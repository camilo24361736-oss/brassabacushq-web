<title>Simulacro 4 · Nivel asistencial · CNSC Empleo Público</title>
<style>
:root{--bg:#f6f8fb;--card:#fff;--ink:#1d2433;--mute:#5a6478;--line:#dbe1ea;--pri:#0b3d6e;--pri2:#1660a8;--ok:#0d6b3a;--okbg:#e6f4ec;--no:#9b1c1c;--nobg:#fbeaea;--sel:#e8f0fa}
@media (prefers-color-scheme: dark){:root{--bg:#10151d;--card:#18202b;--ink:#e6ebf2;--mute:#9aa6b8;--line:#2a3545;--pri:#7fb3ea;--pri2:#9cc6f2;--ok:#7fd3a3;--okbg:#16301f;--no:#f2a3a3;--nobg:#3a1c1c;--sel:#1e2d40}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px}
.hwrap{max-width:860px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
h1{font-size:17px;margin:0;color:var(--pri)}
.stat{font-size:14px;color:var(--mute)}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--pri)}
.timer.low{color:var(--no)}
main{max-width:860px;margin:0 auto;padding:16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin:0 0 16px}
.caso{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--pri);border-radius:10px;padding:14px 16px;margin:22px 0 10px}
.tag{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--pri);font-weight:700}
.caso p{margin:6px 0 0;white-space:pre-line}
.item{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0}
.enun{margin:0 0 8px}
.n{font-weight:700;color:var(--pri)}
.niv{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-right:4px;white-space:nowrap}
.op{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:6px 0;cursor:pointer;background:transparent;width:100%;text-align:left;color:inherit;font:inherit}
.op:hover{border-color:var(--pri2)}
.op .l{font-weight:700;min-width:20px}
.op.sel{background:var(--sel);border-color:var(--pri2)}
.op.ok{background:var(--okbg);border-color:var(--ok)}
.op.no{background:var(--nobg);border-color:var(--no)}
.op[disabled]{cursor:default}
.just{font-size:14px;margin:8px 0 0;padding:8px 10px;border-top:1px dashed var(--line)}
.just div{margin:4px 0}
.just .okt{color:var(--ok);font-weight:700}
.just .not{color:var(--no);font-weight:700}
.src{font-size:13px;color:var(--mute);margin-top:6px}
button.btn{background:var(--pri);color:var(--card);border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer}
button.btn.sec{background:transparent;color:var(--pri);border:1px solid var(--pri)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
select{font:inherit;padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);max-width:100%}
table{border-collapse:collapse;width:100%;font-size:15px}
td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
.big{font-size:40px;font-weight:800;color:var(--pri);line-height:1.1}
.aviso{font-size:13px;color:var(--mute)}
.hide{display:none !important}
.res-ok{color:var(--ok);font-weight:700}.res-no{color:var(--no);font-weight:700}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal .panel{max-width:420px}
footer{max-width:860px;margin:0 auto;padding:8px 16px 40px;font-size:12px;color:var(--mute)}
</style>
</head>
<body>
<header><div class="hwrap"><h1 id="tit"></h1><div class="row stat"><span id="prog"></span><span id="timer" class="timer"></span></div></div></header>
<main id="main"></main>
<div id="modal" class="modal hide"><div class="panel"><p id="mtxt"></p><div class="row"><button class="btn" id="msi">Sí, calificar</button><button class="btn sec" id="mno">Seguir respondiendo</button></div></div></div>
<footer><a href="./" style="color:var(--pri);font-weight:600">← Volver al menú</a><br><br>Material de preparación independiente. No está afiliado a la Comisión Nacional del Servicio Civil (CNSC) ni a ninguna entidad pública, y no contiene preguntas reales de la prueba.</footer>
<script>
const DATA = [{"comp": "estado_constitucion", "rol": "general", "tag": "Estado y Constitución · Habeas data", "texto": "Usted es técnico administrativo del área de atención a la ciudadanía de un instituto distrital de Bogotá que administra una base de datos de beneficiarios de subsidios. Un ciudadano radica una consulta para conocer qué información personal suya reposa en la base. Otra ciudadana presenta un reclamo completo, recibido el lunes 1 de febrero de 2027, para que se corrija su dirección y su estado civil. Además, la Secretaría Distrital de Salud solicita al instituto los datos de contacto de los beneficiarios mayores de 70 años para un programa de vacunación que le asignan sus funciones legales. No hay días festivos entre el 1 de febrero y el 5 de marzo de 2027.", "items": [{"id": "EC-119", "niv": 1, "e": "La consulta del ciudadano sobre su información personal debe atenderse en un término máximo de", "f": "Ley 1581 de 2012, art. 14", "o": [["A", "cinco días hábiles, prorrogables por otros cinco.", "Cinco días hábiles es la prórroga máxima de la consulta, no su término inicial. El artículo 14 fija diez días hábiles.", false], ["B", "diez días hábiles, prorrogables hasta por cinco días hábiles más informando el motivo.", "El artículo 14 de la Ley 1581 de 2012 dispone que la consulta se atenderá en un máximo de diez días hábiles desde su recibo; si no es posible, se informa el motivo y la fecha de respuesta, que no puede superar cinco días hábiles adicionales.", true], ["C", "quince días hábiles, prorrogables hasta por ocho días hábiles más.", "Quince días hábiles prorrogables por ocho es el término del reclamo (art. 15), no el de la consulta.", false]]}, {"id": "EC-120", "niv": 3, "e": "Si no se informa a la ciudadana ninguna prórroga, el término máximo para atender su reclamo vence el", "f": "Ley 1581 de 2012, art. 15, num. 3", "o": [["A", "15 de febrero de 2027.", "Corresponde a contar diez días hábiles, que es el término de la consulta (art. 14). El reclamo tiene quince días hábiles.", false], ["B", "22 de febrero de 2027.", "El artículo 15 de la Ley 1581 de 2012 fija quince días hábiles contados a partir del día siguiente al recibo. Desde el martes 2 de febrero de 2027, sin festivos, el día hábil 15 es el lunes 22 de febrero de 2027.", true], ["C", "4 de marzo de 2027.", "Resulta de sumar la prórroga de ocho días hábiles, que solo procede si se informa a la titular el motivo de la demora y la nueva fecha. Sin esa comunicación, el término es de quince días hábiles.", false]]}, {"id": "EC-121", "niv": 2, "e": "Frente a la solicitud de la Secretaría Distrital de Salud, el instituto puede entregar los datos de contacto", "f": "Ley 1581 de 2012, art. 10, lit. a", "o": [["A", "solo si un juez lo ordena, porque se trata de datos personales.", "La orden judicial es una de las excepciones, pero no la única. El literal a del artículo 10 también exceptúa la información requerida por una entidad pública en ejercicio de sus funciones legales.", false], ["B", "solo con la autorización previa, expresa e informada de cada beneficiario, otorgada por escrito y conservada en el expediente.", "La autorización es la regla general (art. 9), pero el artículo 10 exceptúa la información requerida por una entidad pública en ejercicio de sus funciones legales.", false], ["C", "sin autorización de los titulares, porque la requiere una entidad pública en ejercicio de sus funciones legales.", "El literal a del artículo 10 de la Ley 1581 de 2012 dispone que no es necesaria la autorización del titular cuando se trate de información requerida por una entidad pública o administrativa en ejercicio de sus funciones legales. La entidad receptora queda obligada a cumplir la ley.", true]]}]}, {"comp": "estado_constitucion", "rol": "general", "tag": "Estado y Constitución · Procuraduría y personerías", "texto": "Usted es profesional universitario de la oficina de control interno disciplinario de una alcaldía de tercera categoría, que adelanta una investigación contra un secretario de despacho por presuntas irregularidades en la entrega de subsidios. La Procuraduría Provincial comunica que asumirá esa investigación. A la vez, varios ciudadanos se quejan de que la alcaldía no responde sus derechos de petición, y la personería solicita copia de un informe interno sobre los subsidios; un funcionario de la alcaldía sostiene que ese informe es reservado y no debe entregarse.", "items": [{"id": "EC-131", "niv": 2, "e": "Que la Procuraduría Provincial asuma la investigación que adelanta la oficina de control interno disciplinario es posible porque", "f": "Constitución Política, art. 277, num. 6", "o": [["A", "la Procuraduría ejerce de manera preferente el poder disciplinario sobre quienes desempeñan funciones públicas.", "El numeral 6 del artículo 277 de la Constitución atribuye al Procurador General, por sí o por medio de sus delegados y agentes, ejercer vigilancia superior de la conducta oficial y ejercer preferentemente el poder disciplinario.", true], ["B", "la oficina de control interno disciplinario carece de competencia para investigar a los secretarios de despacho.", "La oficina de control interno disciplinario sí puede investigar a los servidores de la entidad. La Procuraduría asume el asunto por su poder preferente, no por falta de competencia de la oficina.", false], ["C", "la Procuraduría es la segunda instancia de todas las decisiones disciplinarias de la alcaldía.", "Ser segunda instancia no explica que la Procuraduría asuma la primera. La figura que lo permite es el poder disciplinario preferente.", false]]}, {"id": "EC-132", "niv": 1, "e": "A los ciudadanos que se quejan por la falta de respuesta a sus peticiones, usted puede orientarlos a acudir a la personería, porque al personero le corresponde", "f": "Ley 136 de 1994, art. 178, num. 8", "o": [["A", "resolver de fondo las peticiones que la alcaldía deje sin respuesta.", "El personero vigila y promueve las acciones pertinentes, pero no sustituye a la alcaldía en la respuesta de fondo de las peticiones dirigidas a esta.", false], ["B", "imponer multas al alcalde por cada petición sin respuesta.", "El personero no impone multas por esa vía. Puede adelantar actuaciones disciplinarias y promover acciones, pero la ley no le asigna una facultad de multa por petición.", false], ["C", "velar, con arreglo a la ley, por la efectividad del derecho de petición.", "El numeral 8 del artículo 178 de la Ley 136 de 1994 asigna al personero la función de velar por la efectividad del derecho de petición con arreglo a la ley.", true]]}, {"id": "EC-133", "niv": 3, "e": "Frente a la solicitud de la personería del informe interno sobre los subsidios, la alcaldía debe", "f": "Ley 136 de 1994, art. 178, num. 10", "o": [["A", "entregarlo, porque al personero no puede oponérsele reserva, salvo las excepciones de la Constitución o la ley.", "El numeral 10 del artículo 178 de la Ley 136 de 1994 faculta al personero para exigir a los funcionarios públicos municipales la información necesaria y oportuna, sin que pueda oponérsele reserva alguna, salvo la excepción prevista por la Constitución o la ley.", true], ["B", "entregarlo solo si el personero demuestra que actúa en nombre de un ciudadano con interés directo.", "El personero actúa en ejercicio de sus propias funciones de Ministerio Público; no necesita representar a un ciudadano para exigir información.", false], ["C", "negarlo, porque solo un juez puede ordenar la entrega de documentos internos de la administración.", "La ley faculta directamente al personero para exigir información a los funcionarios municipales; no requiere orden judicial.", false]]}]}, {"comp": "estado_constitucion", "rol": "general", "tag": "Estado y Constitución · Ministerio Público", "texto": "Usted es técnico administrativo de la oficina de participación ciudadana de una gobernación y prepara una cartilla para líderes comunales sobre los organismos de control. Un líder le comenta que, según le dijeron, «el Procurador lo nombra el Presidente», «los personeros son independientes y no responden ante nadie» y «el Ministerio Público se encarga de revisar las cuentas y el gasto de las entidades». Usted debe aclarar estas ideas en la cartilla.", "items": [{"id": "EC-146", "niv": 2, "e": "En la cartilla debe explicarse que el Procurador General de la Nación es elegido por", "f": "Constitución Política, art. 276", "o": [["A", "el Senado, de terna integrada por candidatos del Presidente, la Corte Suprema de Justicia y el Consejo de Estado.", "El artículo 276 de la Constitución dispone que el Procurador General es elegido por el Senado para un periodo de cuatro años, de terna integrada por candidatos del Presidente de la República, la Corte Suprema de Justicia y el Consejo de Estado.", true], ["B", "el Presidente de la República, por ser el jefe de la administración pública.", "El Presidente solo integra uno de los cupos de la terna. La elección la hace el Senado (art. 276).", false], ["C", "la Cámara de Representantes, de terna elaborada por el Presidente de la República.", "Esa es la forma de elección del Defensor del Pueblo (art. 281), no la del Procurador.", false]]}, {"id": "EC-147", "niv": 1, "e": "Sobre la relación de los personeros con el Ministerio Público, la cartilla debe señalar que el supremo director del Ministerio Público es", "f": "Constitución Política, art. 275; Ley 136 de 1994, art. 178", "o": [["A", "el Defensor del Pueblo.", "El Defensor integra el Ministerio Público, pero la Constitución atribuye la dirección suprema al Procurador General (art. 275).", false], ["B", "el Procurador General de la Nación.", "El artículo 275 de la Constitución dispone que el Procurador General de la Nación es el supremo director del Ministerio Público, y el artículo 178 de la Ley 136 de 1994 señala que el personero ejerce sus funciones bajo esa dirección suprema.", true], ["C", "el gobernador del respectivo departamento.", "El gobernador es jefe de la administración departamental y no dirige el Ministerio Público, que es un órgano de control autónomo.", false]]}, {"id": "EC-148", "niv": 2, "e": "Para corregir la última idea del líder, la cartilla debe indicar que al Ministerio Público le corresponde", "f": "Constitución Política, arts. 118 y 119", "o": [["A", "la vigilancia de la gestión fiscal de las entidades públicas y el control de resultado de toda la administración.", "Esa es la función de la Contraloría General de la República según el artículo 119, no la del Ministerio Público.", false], ["B", "la dirección y organización de las elecciones, el registro civil y la identificación.", "Esas funciones corresponden al Registrador Nacional del Estado Civil (art. 266).", false], ["C", "la guarda de los derechos humanos, la protección del interés público y la vigilancia de la conducta oficial.", "El artículo 118 de la Constitución asigna al Ministerio Público la guarda y promoción de los derechos humanos, la protección del interés público y la vigilancia de la conducta oficial de quienes desempeñan funciones públicas.", true]]}]}, {"comp": "estado_constitucion", "rol": "general", "tag": "Estado y Constitución · Sector central y descentralizado; servidores públicos", "texto": "Usted es técnico del área de talento humano de un municipio de primera categoría y responde preguntas para un nuevo manual de inducción. En la estructura del municipio hay secretarías de despacho, un instituto municipal de tránsito creado como establecimiento público y una empresa industrial y comercial de servicios de aseo. Un participante pregunta en qué sector se ubica cada entidad y cómo se relacionan con la alcaldía. Otro pregunta si un concejal, un trabajador oficial de la empresa de aseo y una contratista de prestación de servicios de la secretaría de salud son servidores públicos.", "items": [{"id": "EC-158", "niv": 2, "e": "Sobre la ubicación del instituto municipal de tránsito, el manual debe indicar que hace parte", "f": "Ley 489 de 1998, arts. 68 y 70", "o": [["A", "del sector descentralizado por servicios, como establecimiento público con personería jurídica y autonomía.", "El artículo 70 de la Ley 489 de 1998 caracteriza a los establecimientos públicos por su personería jurídica, autonomía administrativa y financiera y patrimonio independiente, y el artículo 68 los clasifica como entidades descentralizadas; su parágrafo 1 extiende ese régimen a las entidades territoriales.", true], ["B", "de los órganos autónomos e independientes, porque no depende jerárquicamente del alcalde.", "Los órganos autónomos e independientes son los que la Constitución ubica fuera de las ramas (art. 113). Un establecimiento público municipal integra la administración, como entidad descentralizada.", false], ["C", "del sector central, porque cumple funciones administrativas propias de la alcaldía.", "Cumplir funciones administrativas no lo ubica en el sector central. Al tener personería jurídica, autonomía administrativa y financiera y patrimonio independiente, es una entidad descentralizada.", false]]}, {"id": "EC-159", "niv": 3, "e": "Respecto de la relación con la administración central, el manual debe explicar que, como regla, el instituto de tránsito y la empresa de aseo están, respectivamente,", "f": "Ley 489 de 1998 (régimen de adscripción y vinculación de entidades descentralizadas)", "o": [["A", "adscritos ambos, porque son entidades descentralizadas del mismo municipio.", "No todas las entidades descentralizadas tienen la misma relación: las empresas industriales y comerciales del Estado están vinculadas, no adscritas.", false], ["B", "vinculado y adscrita.", "Invierte la regla: los establecimientos públicos están adscritos y las empresas industriales y comerciales del Estado están vinculadas.", false], ["C", "adscrito y vinculada.", "La Ley 489 de 1998 dispone que los establecimientos públicos están adscritos a los ministerios o departamentos administrativos, y que las empresas industriales y comerciales del Estado están vinculadas a ellos; ese régimen se aplica, en lo pertinente, a las entidades territoriales.", true]]}, {"id": "EC-160", "niv": 3, "e": "Sobre quiénes son servidores públicos, lo correcto es responder que", "f": "Constitución Política, art. 123", "o": [["A", "lo son los tres, porque todos reciben recursos públicos por su trabajo.", "Recibir recursos públicos no confiere la calidad de servidor. La contratista se vincula por un contrato, no como empleada o trabajadora del Estado.", false], ["B", "lo son el concejal y el trabajador oficial, pero no la contratista de prestación de servicios.", "El artículo 123 de la Constitución dispone que son servidores públicos los miembros de las corporaciones públicas y los empleados y trabajadores del Estado y de sus entidades descentralizadas. El contratista de prestación de servicios no tiene esa calidad.", true], ["C", "solo lo es el trabajador oficial, porque los concejales son representantes de elección popular.", "El artículo 123 incluye expresamente a los miembros de las corporaciones públicas, como los concejales, entre los servidores públicos.", false]]}]}, {"comp": "estado_constitucion", "rol": "general", "tag": "Estado y Constitución · Audiencias públicas y democratización de la gestión", "texto": "Usted es técnico administrativo de la Secretaría de Movilidad de un municipio de primera categoría, que formula un plan de reorganización de rutas de transporte público. Una asociación de usuarios y dos juntas de acción comunal piden que se convoque una audiencia pública para discutir el plan. El secretario pregunta si está obligado a seguir lo que se concluya en la audiencia, quién puede solicitarla y dónde debe quedar definida la forma en que se desarrollará.", "items": [{"id": "EC-170", "niv": 2, "e": "Sobre el carácter de lo que se concluya en la audiencia, debe informarse al secretario que", "f": "Ley 489 de 1998, art. 33", "o": [["A", "las conclusiones no son vinculantes, pero deben explicarse a las organizaciones las razones de la decisión.", "El artículo 33 de la Ley 489 de 1998 dispone que ni la solicitud ni las conclusiones de las audiencias públicas tienen carácter vinculante para la administración, pero en todo caso se explicarán a las organizaciones las razones de la decisión adoptada.", true], ["B", "las conclusiones son obligatorias para la secretaría, porque provienen de un mecanismo de participación ciudadana.", "El artículo 33 de la Ley 489 dispone expresamente que las conclusiones de las audiencias públicas no son vinculantes.", false], ["C", "las conclusiones no son vinculantes y la administración no tiene ningún deber frente a ellas.", "Aunque no son vinculantes, la ley impone el deber de explicar a las organizaciones las razones de la decisión adoptada (art. 33).", false]]}, {"id": "EC-171", "niv": 1, "e": "Respecto de quién puede solicitar la audiencia pública, lo correcto es responder que", "f": "Ley 489 de 1998, art. 33", "o": [["A", "solo el concejo municipal puede pedirla, mediante proposición aprobada en plenaria.", "La ley no reserva la solicitud al concejo. El artículo 33 permite que las comunidades y las organizaciones la soliciten.", false], ["B", "solo la personería puede solicitarla, en representación de los usuarios del transporte.", "La personería puede promover la participación, pero la ley permite que las propias comunidades y organizaciones soliciten la audiencia.", false], ["C", "las comunidades y las organizaciones, sin perjuicio de que la administración la convoque.", "El artículo 33 de la Ley 489 de 1998 dispone que las comunidades y las organizaciones podrán solicitar la realización de audiencias públicas, además de la facultad de la administración de convocarlas cuando lo considere conveniente.", true]]}, {"id": "EC-172", "niv": 2, "e": "La metodología que se utilizará en la audiencia debe quedar definida en", "f": "Ley 489 de 1998, art. 33", "o": [["A", "un reglamento que deben presentar las organizaciones solicitantes el día de la audiencia.", "La ley asigna a la institución que convoca, no a los solicitantes, la definición de la metodología en el acto de convocatoria.", false], ["B", "el acto de convocatoria que expida la secretaría.", "El artículo 33 de la Ley 489 de 1998 dispone que en el acto de convocatoria a la audiencia la institución respectiva definirá la metodología que será utilizada.", true], ["C", "el acta que se levante al finalizar la audiencia.", "El acta da cuenta de lo ocurrido; la metodología debe conocerse antes y quedar en el acto de convocatoria.", false]]}]}, {"comp": "estado_constitucion", "rol": "general", "tag": "Estado y Constitución · Descentralización y aplicación de la Ley 489 de 1998", "texto": "Usted es profesional universitario de la Secretaría de Planeación de un departamento. En una mesa de trabajo sobre la distribución de competencias entre la Nación, el departamento y los municipios, un funcionario afirma que «la Ley 489 de 1998 solo aplica a las entidades nacionales». Además, el alcalde de uno de los municipios pretende delegar en su secretario de Movilidad la expedición del reglamento general de tránsito y estacionamiento del municipio, sin que ninguna ley lo autorice.", "items": [{"id": "EC-185", "niv": 2, "e": "Según el criterio orientador de la Ley 489 de 1998 sobre distribución de competencias, en lo posible la prestación de los servicios debe corresponder", "f": "Ley 489 de 1998, art. 7", "o": [["A", "a la Nación, que la contrata con los municipios y la controla por medio de los departamentos.", "El criterio de la Ley 489 busca acercar la prestación a los municipios, no concentrarla en la Nación.", false], ["B", "a los departamentos, el control a la Nación y la definición de políticas a los municipios.", "Invierte el criterio legal. El artículo 7 asigna la prestación a los municipios, el control a los departamentos y las políticas a la Nación.", false], ["C", "a los municipios, el control sobre dicha prestación a los departamentos y la definición de políticas a la Nación.", "El artículo 7 de la Ley 489 de 1998 señala el criterio de que la prestación de los servicios corresponda a los municipios, el control sobre dicha prestación a los departamentos y la definición de planes, políticas y estrategias a la Nación.", true]]}, {"id": "EC-186", "niv": 3, "e": "Frente a la afirmación del funcionario sobre el alcance de la Ley 489 de 1998, lo correcto es señalar que", "f": "Ley 489 de 1998, art. 2, parágrafo", "o": [["A", "varias de sus reglas, como las de delegación y entidades descentralizadas, se aplican en lo pertinente a las entidades territoriales.", "El parágrafo del artículo 2 de la Ley 489 de 1998 dispone que las reglas sobre principios de la función administrativa, delegación y desconcentración, entidades descentralizadas, participación y control interno, entre otras, se aplican en lo pertinente a las entidades territoriales, sin perjuicio de su autonomía.", true], ["B", "solo aplica a las entidades nacionales, porque las territoriales se rigen exclusivamente por ordenanzas y acuerdos.", "El parágrafo del artículo 2 extiende expresamente varias de sus reglas a las entidades territoriales, en lo pertinente y sin perjuicio de su autonomía.", false], ["C", "aplica íntegramente a las entidades territoriales, sin consideración alguna a la autonomía que les reconoce la Constitución Política.", "La aplicación es en lo pertinente y sin perjuicio de la autonomía territorial; no es una aplicación íntegra e incondicionada.", false]]}, {"id": "EC-187", "niv": 3, "e": "Sobre la delegación del reglamento general de tránsito y estacionamiento, usted debe conceptuar que", "f": "Ley 489 de 1998, art. 11, num. 1", "o": [["A", "es procedente, porque el secretario de Movilidad tiene funciones afines y complementarias a la materia.", "La afinidad de funciones es un requisito general de la delegación, pero no habilita delegar lo que la ley prohíbe: los reglamentos de carácter general no son delegables salvo autorización legal expresa.", false], ["B", "no es procedente, porque la expedición de reglamentos de carácter general solo se delega cuando la ley lo autoriza.", "El numeral 1 del artículo 11 de la Ley 489 de 1998 prohíbe transferir mediante delegación la expedición de reglamentos de carácter general, salvo en los casos expresamente autorizados por la ley, autorización que el caso descarta.", true], ["C", "es procedente si el alcalde conserva la facultad de reasumir la función en cualquier momento.", "La posibilidad de reasumir la función es un efecto de toda delegación válida, pero no sanea una delegación prohibida por el artículo 11.", false]]}]}, {"comp": "empleo_publico", "rol": "general", "tag": "Empleo público, carrera y régimen disciplinario · Provisión de vacancias", "texto": "Usted trabaja en la oficina de talento humano de una corporación autónoma regional de la región Caribe. Debe atender tres novedades: el jefe de la Oficina Asesora de Comunicaciones, empleo de libre nombramiento y remoción, renunció y la vacante es definitiva; una técnica administrativa de carrera, adscrita a la subdirección de gestión ambiental, obtuvo licencia no remunerada de doce meses para adelantar una maestría, y en la planta no hay empleados de carrera que puedan ser encargados en su empleo; y quedó una vacante definitiva de auxiliar administrativo, empleo de carrera, para la cual tampoco hay servidores de carrera con derecho a encargo, mientras se surte el concurso.", "items": [{"id": "EP-107", "niv": 2, "e": "Si la vacante de la Oficina Asesora de Comunicaciones se provee mediante encargo, este podrá durar", "f": "Ley 909 de 2004, art. 24 (modificado por el art. 1 de la Ley 1960 de 2019)", "o": [["A", "hasta tres meses, prorrogables por tres meses más, vencidos los cuales el empleo debe proveerse en forma definitiva.", "El art. 24 de la Ley 909 de 2004, modificado por la Ley 1960 de 2019, dispone que, en vacancia definitiva de un empleo de libre nombramiento y remoción, el encargo es hasta por tres meses prorrogables por tres meses más, y luego el empleo debe proveerse en forma definitiva.", true], ["B", "todo el tiempo que el nominador considere necesario, porque los empleos de libre nombramiento no tienen límite de encargo.", "La ley sí limita el encargo en vacancia definitiva de los empleos de libre nombramiento y remoción y exige su provisión definitiva al vencer el término.", false], ["C", "hasta seis meses improrrogables, porque es el término general de los encargos en empleos de carrera.", "El término aplicable a la vacancia definitiva de un empleo de libre nombramiento y remoción no es de seis meses improrrogables; el art. 24 de la Ley 909 de 2004 fija tres meses prorrogables por otros tres.", false]]}, {"id": "EP-108", "niv": 2, "e": "Para cubrir el empleo de la técnica administrativa durante su licencia de estudios, la corporación podrá", "f": "Ley 909 de 2004, art. 25; Decreto 1083 de 2015, arts. 2.2.5.2.2 y 2.2.5.4.2", "o": [["A", "declarar la vacancia definitiva del empleo y reportarlo a la CNSC para que se incluya en el próximo concurso.", "La licencia no remunerada para estudios produce vacancia temporal, no definitiva; la titular conserva su empleo y debe reintegrarse al terminar la licencia.", false], ["B", "hacer un nombramiento provisional que durará únicamente mientras se mantenga la licencia de estudios de la titular.", "El art. 25 de la Ley 909 de 2004 permite proveer en forma provisional los empleos de carrera cuyos titulares estén en situaciones que impliquen separación temporal, solo por el tiempo que duren esas situaciones y cuando no sea posible el encargo con servidores de carrera, como ocurre en el caso.", true], ["C", "trasladar a otro empleado de carrera al empleo, porque el traslado es la figura propia de las vacancias temporales.", "El traslado procede para proveer un cargo vacante definitivamente (Decreto 1083 de 2015, art. 2.2.5.4.2); no es la figura para cubrir una vacancia temporal.", false]]}, {"id": "EP-109", "niv": 3, "e": "Para proveer transitoriamente el empleo de auxiliar administrativo mediante nombramiento provisional, la entidad debe tener en cuenta que", "f": "Decreto 1083 de 2015 (provisión transitoria de vacancias definitivas de carrera); Ley 1952 de 2019, art. 39", "o": [["A", "solo puede nombrar a quien esté inscrito en una lista de elegibles vigente de otra entidad, porque así lo exige la Ley 1960 de 2019.", "El nombramiento provisional no exige estar en una lista de elegibles; las listas se usan para la provisión definitiva y, en el caso de los empleos temporales, para su ingreso.", false], ["B", "debe preferir a quien tenga mayor experiencia en el sector ambiental, aunque no cumpla todos los requisitos del manual.", "Todo nombramiento exige cumplir los requisitos del empleo; nombrar a quien no los reúne es incluso una prohibición disciplinaria (Ley 1952 de 2019, art. 39, num. 15).", false], ["C", "se dará prelación a jóvenes entre 18 y 28 años que cumplan los requisitos, una vez agotado el derecho preferencial de encargo.", "El Decreto 1083 de 2015, en las reglas de provisión de vacancias definitivas de carrera, dispone que en los nombramientos provisionales se dé prelación a los jóvenes entre 18 y 28 años que cumplan los requisitos, siempre que se haya agotado el derecho preferencial de encargo.", true]]}]}, {"comp": "empleo_publico", "rol": "general", "tag": "Empleo público, carrera y régimen disciplinario · Período de prueba", "texto": "En un instituto descentralizado del orden departamental se posesionaron en período de prueba dos personas que ganaron el concurso: Mónica, que nunca había estado vinculada a la carrera administrativa, en un empleo de técnico operativo; y Julián, inscrito en carrera como auxiliar administrativo del mismo instituto, en un empleo de profesional universitario. Usted, que apoya la coordinación de talento humano, debe orientar al jefe de cada uno sobre el período de prueba y sobre qué hacer con el empleo de auxiliar administrativo que Julián deja mientras dura su prueba.", "items": [{"id": "EP-113", "niv": 1, "e": "Sobre la duración del período de prueba, usted informa a los jefes que esta es de", "f": "Ley 909 de 2004, art. 31, num. 5", "o": [["A", "tres meses.", "Tres meses es el término del encargo en vacancia definitiva de empleos de libre nombramiento (art. 24 de la Ley 909 de 2004), no la duración del período de prueba.", false], ["B", "seis meses.", "El art. 31, num. 5, de la Ley 909 de 2004 establece que quien es seleccionado por concurso será nombrado en período de prueba por seis meses, al final de los cuales se evalúa su desempeño.", true], ["C", "un año.", "Un año es el período anual de la evaluación del desempeño de los empleados de carrera, no la duración del período de prueba, que la ley fija en seis meses.", false]]}, {"id": "EP-114", "niv": 2, "e": "Si Mónica obtiene una calificación no satisfactoria al terminar su período de prueba, la consecuencia será que", "f": "Ley 909 de 2004, art. 31, num. 5", "o": [["A", "se le prorrogará el período de prueba por seis meses para que mejore su desempeño.", "La ley no prevé la prórroga del período de prueba por un resultado no satisfactorio; la consecuencia es la declaratoria de insubsistencia.", false], ["B", "quedará inscrita en carrera, pero con un plan de mejoramiento obligatorio.", "La inscripción en carrera solo se produce si se aprueba el período de prueba con evaluación satisfactoria; con calificación no satisfactoria no se adquieren derechos de carrera.", false], ["C", "su nombramiento será declarado insubsistente.", "El art. 31, num. 5, de la Ley 909 de 2004 dispone que, si quien no estaba inscrito en carrera no obtiene calificación satisfactoria del período de prueba, su nombramiento será declarado insubsistente.", true]]}, {"id": "EP-115", "niv": 3, "e": "Si Julián no supera el período de prueba en el empleo de profesional universitario, la consecuencia será que", "f": "Ley 909 de 2004, art. 31, num. 5", "o": [["A", "regresará al empleo de auxiliar administrativo del que es titular y conservará su inscripción en la carrera.", "El art. 31, num. 5, de la Ley 909 de 2004 prevé que el empleado inscrito en carrera que supere un concurso sea nombrado en período de prueba y, si no obtiene calificación satisfactoria, regrese al empleo que venía desempeñando y conserve su inscripción en la carrera.", true], ["B", "quedará en el empleo de profesional en calidad de provisional hasta que se convoque un nuevo concurso.", "La ley no convierte el nombramiento en provisional; si no aprueba, el empleado regresa a su empleo anterior y conserva su inscripción.", false], ["C", "su nombramiento se declarará insubsistente y perderá también los derechos de carrera que tenía como auxiliar.", "Para el empleado ya inscrito en carrera la ley prevé una regla distinta: no pierde su inscripción, sino que regresa al empleo que venía desempeñando.", false]]}, {"id": "EP-116", "niv": 2, "e": "Mientras se califica el período de prueba de Julián, el empleo de auxiliar administrativo del cual es titular", "f": "Ley 909 de 2004, art. 31, num. 5; Decreto 1083 de 2015, art. 2.2.5.2.2", "o": [["A", "debe permanecer vacante, porque cualquier nombramiento afectaría el derecho de Julián a regresar.", "La ley sí permite proveer ese empleo durante el período de prueba; lo que se protege es que Julián pueda regresar si no aprueba, lo cual es compatible con una provisión transitoria.", false], ["B", "puede proveerse por encargo o mediante nombramiento provisional.", "El art. 31, num. 5, de la Ley 909 de 2004 establece que, mientras se produce la calificación del período de prueba, el cargo del cual era titular el empleado ascendido puede proveerse por encargo o mediante nombramiento provisional.", true], ["C", "debe proveerse con la siguiente persona de la lista de elegibles en período de prueba.", "El empleo de Julián no está en vacancia definitiva mientras dura su período de prueba (Decreto 1083 de 2015, art. 2.2.5.2.2, num. 7, lo trata como vacancia temporal); por eso no se provee en forma definitiva con la lista.", false]]}]}, {"comp": "empleo_publico", "rol": "general", "tag": "Empleo público, carrera y régimen disciplinario · Obligación de evaluar y usos de la evaluación", "texto": "En la Secretaría de Gobierno de una alcaldía, el jefe de una dependencia, empleado de libre nombramiento y remoción, se niega a evaluar a los empleados de carrera a su cargo porque considera que «es un trámite sin utilidad». Una de esas empleadas presenta un dictamen de su EPS en el que se recomienda suspender su evaluación mientras se recupera de afectaciones de salud derivadas de un acoso laboral que denunció. Usted, que trabaja en la oficina de talento humano, debe orientar a la secretaria de despacho sobre estos asuntos y sobre para qué sirven los resultados de la evaluación.", "items": [{"id": "EP-132", "niv": 2, "e": "Sobre la negativa del jefe a evaluar a sus empleados, usted le advierte a la secretaria que", "f": "Ley 909 de 2004, art. 39", "o": [["A", "si el jefe no evalúa, los empleados quedan calificados de forma automática con el puntaje máximo.", "La ley no prevé una calificación automática por omisión del evaluador; prevé la responsabilidad disciplinaria del evaluador y mantiene su obligación de evaluar.", false], ["B", "la evaluación es potestativa para los jefes de libre nombramiento y puede reemplazarse por un informe de gestión.", "La evaluación no es potestativa: el art. 39 de la Ley 909 de 2004 la establece como obligación de quienes deben evaluar, siguiendo la metodología del instrumento.", false], ["C", "incumplir el deber de evaluar es falta grave sancionable disciplinariamente, y el jefe sigue obligado a evaluar.", "El art. 39 de la Ley 909 de 2004 dispone que el incumplimiento del deber de evaluar constituye falta grave sancionable disciplinariamente, sin perjuicio de que se cumpla la obligación de evaluar con el procedimiento señalado.", true]]}, {"id": "EP-133", "niv": 3, "e": "Frente al dictamen de la EPS presentado por la empleada, lo procedente es", "f": "Ley 1010 de 2006, art. 16", "o": [["A", "suspender su evaluación del desempeño por el tiempo que determine el dictamen médico.", "El art. 16 de la Ley 1010 de 2006 dispone que, previo dictamen de la EPS a la que está afiliado el sujeto pasivo del acoso laboral, se suspenderá la evaluación del desempeño por el tiempo que determine el dictamen.", true], ["B", "trasladar su evaluación a la Comisión de Personal para que la califique un evaluador distinto al jefe.", "La ley no ordena cambiar de evaluador ni trasladar la evaluación a la Comisión de Personal; ordena suspenderla por el tiempo que indique el dictamen.", false], ["C", "evaluarla normalmente, porque el dictamen de la EPS solo tiene efectos para el pago de incapacidades.", "La Ley 1010 de 2006 da al dictamen de la EPS un efecto específico frente a la evaluación del desempeño de la víctima de acoso: su suspensión.", false]]}, {"id": "EP-134", "niv": 1, "e": "Sobre la utilidad de los resultados de la evaluación, usted le explica a la secretaria que la ley los exige, entre otros, para", "f": "Ley 909 de 2004, art. 38", "o": [["A", "fijar el salario básico del empleo y sus incrementos para el año siguiente.", "El salario de los empleos se fija según la escala salarial de la entidad territorial y las normas de remuneración; la evaluación no fija la asignación básica.", false], ["B", "conceder becas o comisiones de estudio y planificar la capacitación.", "El art. 38 de la Ley 909 de 2004 señala que los resultados de la evaluación deben tenerse en cuenta, entre otros, para adquirir derechos de carrera, ascender, conceder becas o comisiones de estudio, otorgar incentivos, planificar la capacitación y determinar la permanencia en el servicio.", true], ["C", "decidir la afiliación del empleado al régimen de pensiones.", "La afiliación a pensiones es una obligación del sistema de seguridad social que no depende de la evaluación del desempeño.", false]]}]}, {"comp": "empleo_publico", "rol": "general", "tag": "Empleo público, carrera y régimen disciplinario · Culpabilidad: dolo y culpa", "texto": "En una capacitación sobre el Código General Disciplinario para servidores de una corporación autónoma regional, el facilitador presenta tres situaciones: un técnico que, por un descuido menor que cualquier persona cuidadosa podría tener, transcribió mal un dato en un oficio sin consecuencias; un profesional que firmó la viabilidad de un permiso de vertimientos sin revisar los requisitos básicos que exige la norma, por desatender lo más elemental de su función; y un servidor que, sin intención pero sin el cuidado que cualquier persona del común tendría, incurrió en una conducta que la ley describe como falta gravísima.", "items": [{"id": "EP-160", "niv": 2, "e": "Respecto del técnico que cometió el descuido menor, el facilitador explica que", "f": "Ley 1952 de 2019, art. 29 (modificado por el art. 4 de la Ley 2094 de 2021)", "o": [["A", "no es sancionable disciplinariamente, porque la culpa leve no se sanciona.", "El art. 29 de la Ley 1952 de 2019, modificado por la Ley 2094 de 2021, dispone que la culpa sancionable puede ser gravísima o grave y que la culpa leve no es sancionable en materia disciplinaria.", true], ["B", "debe sancionarse con amonestación escrita, porque toda culpa es sancionable en materia disciplinaria.", "La ley no sanciona toda culpa: la culpa sancionable es la gravísima o la grave, y la culpa leve no es sancionable.", false], ["C", "debe sancionarse con multa, porque el error quedó plasmado en un documento oficial.", "La multa corresponde a faltas leves dolosas; un descuido menor sin dolo constituye culpa leve, que no es sancionable.", false]]}, {"id": "EP-161", "niv": 2, "e": "La conducta del profesional que firmó la viabilidad sin revisar los requisitos básicos corresponde a", "f": "Ley 1952 de 2019, art. 29 (modificado por el art. 4 de la Ley 2094 de 2021)", "o": [["A", "dolo, porque toda firma de un documento sin revisarlo supone intención de causar daño.", "El dolo exige conocer y querer la conducta; el caso describe una desatención, no una actuación intencional.", false], ["B", "culpa grave, porque solo omitió el cuidado que tendría una persona del común.", "La culpa grave es la inobservancia del cuidado de cualquier persona del común; desatender lo más elemental de la función o violar de forma manifiesta reglas obligatorias se califica como culpa gravísima.", false], ["C", "culpa gravísima, porque obedece a una desatención elemental de reglas de obligatorio cumplimiento.", "El art. 29 de la Ley 1952 de 2019, modificado por la Ley 2094 de 2021, define la culpa gravísima como la falta cometida por ignorancia supina, desatención elemental o violación manifiesta de reglas de obligatorio cumplimiento.", true]]}, {"id": "EP-162", "niv": 3, "e": "Respecto del servidor que realizó una conducta descrita como gravísima, pero con culpa grave, el facilitador explica que", "f": "Ley 1952 de 2019, art. 47, num. 9 (modificado por el art. 8 de la Ley 2094 de 2021)", "o": [["A", "se considera falta grave, porque la realización de una falta objetivamente gravísima con culpa grave recibe esa calificación.", "El art. 47, num. 9, de la Ley 1952 de 2019, modificado por la Ley 2094 de 2021, dispone que la realización típica de una falta objetivamente gravísima cometida con culpa grave será considerada falta grave.", true], ["B", "se sanciona como falta gravísima con destitución, porque la clasificación depende solo de la descripción legal de la conducta.", "La ley prevé una regla especial: la realización típica de una falta objetivamente gravísima con culpa grave se considera falta grave.", false], ["C", "no es sancionable, porque las faltas gravísimas solo admiten la modalidad dolosa.", "Las faltas gravísimas también se sancionan a título de culpa; además, la ley califica este supuesto como falta grave, que sí es sancionable.", false]]}]}, {"comp": "empleo_publico", "rol": "general", "tag": "Empleo público, carrera y régimen disciplinario · Niveles jerárquicos de los empleos", "texto": "Una gobernación ajusta su manual específico de funciones. Usted, servidor de la Dirección de Talento Humano, debe clasificar tres empleos según la naturaleza general de sus funciones: uno cuyo titular opera los equipos del laboratorio de calidad del agua y desarrolla los procedimientos técnicos de muestreo; otro cuyo titular aplica los conocimientos de su carrera profesional en el área de presupuesto y coordina un grupo interno de trabajo encargado de ejecutar un programa; y la directora pide primero recordar cuáles son los niveles jerárquicos que aplican a las entidades territoriales.", "items": [{"id": "EP-195", "niv": 1, "e": "Los niveles jerárquicos de los empleos de las entidades territoriales son", "f": "Decreto Ley 785 de 2005, art. 3", "o": [["A", "directivo, ejecutivo, profesional, técnico y operativo.", "El nivel ejecutivo y el operativo no figuran en la clasificación vigente del Decreto Ley 785 de 2005; los niveles son directivo, asesor, profesional, técnico y asistencial.", false], ["B", "directivo, profesional, tecnológico, técnico y auxiliar.", "Los niveles tecnológico y auxiliar no existen en el Decreto Ley 785 de 2005; la clasificación incluye los niveles asesor y asistencial.", false], ["C", "directivo, asesor, profesional, técnico y asistencial.", "El art. 3 del Decreto Ley 785 de 2005 clasifica los empleos de las entidades territoriales, según la naturaleza de sus funciones, las competencias y los requisitos, en los niveles directivo, asesor, profesional, técnico y asistencial.", true]]}, {"id": "EP-196", "niv": 1, "e": "El empleo de quien opera los equipos del laboratorio y desarrolla los procedimientos de muestreo corresponde al nivel", "f": "Decreto Ley 785 de 2005, art. 4", "o": [["A", "asesor.", "El nivel asesor asiste y aconseja directamente a los empleados del nivel directivo; no corresponde a la operación técnica de equipos de laboratorio.", false], ["B", "técnico.", "El art. 4 del Decreto Ley 785 de 2005 ubica en el nivel técnico los empleos cuyas funciones exigen desarrollar procesos y procedimientos en labores técnicas misionales y de apoyo, y las relacionadas con la aplicación de la ciencia y la tecnología.", true], ["C", "asistencial.", "El nivel asistencial agrupa labores de apoyo y complemento de los niveles superiores; el empleo descrito desarrolla procesos técnicos misionales con aplicación de tecnología.", false]]}, {"id": "EP-197", "niv": 2, "e": "El empleo de quien aplica su carrera profesional en presupuesto y coordina un grupo interno corresponde al nivel", "f": "Decreto Ley 785 de 2005, art. 4", "o": [["A", "profesional, porque aplica conocimientos de una carrera profesional y puede tener funciones de coordinación de áreas internas.", "El art. 4 del Decreto Ley 785 de 2005 describe el nivel profesional como el que demanda la aplicación de conocimientos de una carrera profesional y al que, según su complejidad, pueden corresponder funciones de coordinación, supervisión y control de áreas internas.", true], ["B", "directivo, porque coordinar un grupo de trabajo equivale a dirigir la entidad.", "El nivel directivo comprende funciones de dirección general, formulación de políticas y adopción de planes; coordinar un grupo interno es compatible con el nivel profesional.", false], ["C", "asesor, porque toda función relacionada con el presupuesto implica asesorar al gobernador.", "El nivel asesor asiste y aconseja directamente a los empleados del nivel directivo; manejar el presupuesto y coordinar un grupo interno no lo convierte en asesor.", false]]}]}, {"comp": "atencion_procedimiento", "rol": "general", "tag": "Atención al ciudadano y procedimiento administrativo · Derecho de petición: atención prioritaria", "texto": "En la Secretaría de Gobierno de un municipio de tercera categoría se reciben el mismo día varias peticiones. Un periodista de una emisora local pide información sobre los contratos de obra del parque principal para un reportaje. Una mujer solicita reubicación urgente porque las grietas de su vivienda, ubicada en zona de ladera, empeoraron con las lluvias y la casa amenaza con derrumbarse con ella y sus hijos adentro. Además, catorce vecinos de un barrio radican peticiones idénticas en las que piden información sobre el cronograma de pavimentación de su calle.", "items": [{"id": "AP-119", "niv": 1, "e": "La petición del periodista, formulada para el ejercicio de su actividad, debe", "f": "Ley 1755 de 2015, art. 1 (art. 20 de la Ley 1437 de 2011)", "o": [["A", "someterse primero a la aprobación de la oficina de prensa, que debe verificar la acreditación del medio.", "La ley no condiciona el trámite a la aprobación de una oficina de prensa. Exigir requisitos no previstos obstruye el derecho de petición y el acceso a la información.", false], ["B", "responderse en el término de treinta días, por tratarse de información de interés general.", "El término de treinta días es para las consultas. La petición del periodista es de información y, además, la ley ordena darle trámite preferencial.", false], ["C", "tramitarse de manera preferencial.", "El inciso 2 del artículo 20 del CPACA dispone que, si la petición la realiza un periodista para el ejercicio de su actividad, se tramitará preferencialmente.", true]]}, {"id": "AP-120", "niv": 3, "e": "Ante la solicitud de la mujer cuya vivienda amenaza con derrumbarse, la alcaldía debe", "f": "Ley 1755 de 2015, art. 1 (art. 20 de la Ley 1437 de 2011)", "o": [["A", "resolver la petición dentro de los quince días siguientes, ya que no se pide el reconocimiento de un derecho fundamental.", "Cuando está en peligro inminente la vida o la integridad del destinatario, la ley no permite esperar el término ordinario: exige medidas de urgencia inmediatas.", false], ["B", "adoptar de inmediato las medidas de urgencia necesarias para conjurar el peligro, sin perjuicio del trámite de la petición.", "El inciso 2 del artículo 20 del CPACA ordena que, cuando por razones de salud o seguridad personal esté en peligro inminente la vida o la integridad del destinatario, la autoridad adopte de inmediato las medidas de urgencia, sin perjuicio del trámite de la petición.", true], ["C", "exigirle prueba sumaria del riesgo antes de cualquier actuación y, recibida esta, asignarle turno prioritario.", "La prueba sumaria se exige para la atención prioritaria de peticiones de reconocimiento de un derecho fundamental (inciso 1 del art. 20). Ante un peligro inminente para la vida, el inciso 2 ordena actuar de inmediato.", false]]}, {"id": "AP-121", "niv": 2, "e": "Para atender las catorce peticiones idénticas de los vecinos, la alcaldía puede", "f": "Ley 1755 de 2015, art. 1 (art. 22 de la Ley 1437 de 2011)", "o": [["A", "responderlas en el término de treinta días, porque al superar diez peticiones se tramitan como consulta.", "El número de peticiones no cambia su modalidad ni su término. Lo que permite la ley es dar una respuesta única.", false], ["B", "dar una respuesta única, publicarla en un diario de amplia circulación y en su página web, y entregar copia a quien la solicite.", "El artículo 22 del CPACA permite que, cuando más de diez personas formulen peticiones análogas de información, de interés general o de consulta, la administración dé una única respuesta, la publique en un diario de amplia circulación y en su página web y entregue copias a quienes las soliciten.", true], ["C", "acumularlas en un expediente y responder solo al primer peticionario, que se entiende como representante de los demás.", "Ninguna norma convierte al primer peticionario en representante de los demás. La respuesta única debe ponerse al alcance de todos por los medios que fija la ley.", false]]}]}, {"comp": "atencion_procedimiento", "rol": "general", "tag": "Atención al ciudadano y procedimiento administrativo · Atención incluyente y lenguaje claro", "texto": "Una corporación autónoma regional elabora el plan de ordenación de una cuenca en la que habitan un resguardo indígena nasa y varias veredas campesinas. Las autoridades del resguardo pidieron formalmente que la información del plan que afecta a su comunidad se divulgue en nasa yuwe. Además, la asociación de personas con discapacidad visual del municipio pidió poder consultar el documento. Por último, el primer borrador del resumen para la comunidad está lleno de tecnicismos y transcribe artículos completos de decretos sin explicarlos.", "items": [{"id": "AP-185", "niv": 2, "e": "Ante la solicitud de las autoridades del resguardo, la corporación debe", "f": "Ley 1712 de 2014, art. 8; Constitución Política, art. 10", "o": [["A", "remitir la solicitud al Ministerio de Cultura, que es el encargado de traducir y publicar la información en lenguas nativas.", "La obligación de divulgar es del sujeto obligado que produce la información. La corporación puede apoyarse en otras entidades, pero no trasladarles su deber.", false], ["B", "negarla, porque los documentos oficiales de las entidades públicas se expiden únicamente en castellano.", "El artículo 10 de la Constitución reconoce como oficiales en sus territorios las lenguas de los grupos étnicos, y el artículo 8 de la Ley 1712 de 2014 obliga a divulgar la información en otras lenguas a solicitud de las autoridades de las comunidades.", false], ["C", "divulgar en su lengua la información que los afecta y elaborar formatos alternativos comprensibles para la comunidad.", "El artículo 8 de la Ley 1712 de 2014 (criterio diferencial de accesibilidad) dispone que, a solicitud de las autoridades de las comunidades, los sujetos obligados divulguen la información pública que particularmente las afecte en diversos idiomas y lenguas, con formatos alternativos comprensibles.", true]]}, {"id": "AP-186", "niv": 1, "e": "Frente a la solicitud de la asociación de personas con discapacidad visual, la corporación debe", "f": "Ley 1712 de 2014, arts. 3 (principio de calidad de la información) y 8", "o": [["A", "adecuar sus medios de comunicación y ofrecer la información en formatos accesibles para esa población.", "El artículo 8 de la Ley 1712 de 2014 ordena adecuar los medios de comunicación para facilitar el acceso a las personas en situación de discapacidad, y el principio de calidad exige que la información esté disponible en formatos accesibles.", true], ["B", "entregarles una copia impresa del documento completo, sin ajustes adicionales.", "Una copia impresa no resuelve la barrera de acceso de una persona con discapacidad visual. La ley exige formatos accesibles.", false], ["C", "informarles que el documento está publicado en la página web, con lo cual se cumple el deber de divulgación.", "Publicar el documento en un formato que esta población no puede consultar no garantiza el acceso. La ley exige adecuar los medios para las personas con discapacidad.", false]]}, {"id": "AP-187", "niv": 2, "e": "Sobre el borrador del resumen para la comunidad, lo correcto es", "f": "Ley 1712 de 2014, art. 3 (principios de calidad de la información y de divulgación proactiva)", "o": [["A", "reescribirlo en un lenguaje sencillo y comprensible para la comunidad, que explique en qué la afecta el plan.", "Los principios de calidad de la información y de divulgación proactiva del artículo 3 de la Ley 1712 de 2014 exigen que la información sea oportuna, objetiva, veraz, accesible y comprensible, lo que se logra con lenguaje claro.", true], ["B", "mantener la transcripción literal de los decretos, porque así se evitan interpretaciones equivocadas.", "Transcribir normas sin explicarlas dificulta la comprensión. La ley exige que la información de interés público sea comprensible para sus destinatarios.", false], ["C", "reemplazar el resumen por los enlaces a las normas, para que cada lector las consulte directamente.", "Remitir a las normas no cumple el deber de divulgar información comprensible y accesible para la comunidad.", false]]}]}, {"comp": "atencion_procedimiento", "rol": "asistencial", "tag": "Atención al ciudadano y procedimiento administrativo · Nivel asistencial · Presentación de recursos", "texto": "Usted es auxiliar administrativo de la ventanilla de correspondencia de la Secretaría de Hacienda de un municipio de sexta categoría. Un ciudadano que fue notificado personalmente hace cuatro días hábiles de una resolución que le negó un auxilio quiere presentar recurso de reposición. Primero pregunta si puede exponerle sus motivos de palabra en la ventanilla para que usted los anote. Luego pregunta si puede enviar el recurso por correo electrónico y si debe autenticar su firma en notaría. Por último, le cuenta que la semana pasada otro funcionario se negó a recibirle un escrito similar.", "items": [{"id": "AP-212", "niv": 2, "e": "Frente a la pregunta de si puede exponer el recurso de palabra para que usted lo anote, debe explicarle que", "f": "Ley 1437 de 2011, arts. 76 y 77", "o": [["A", "puede hacerlo, porque cualquier petición, incluidos los recursos, puede presentarse verbalmente.", "El artículo 15 del CPACA permite las peticiones verbales, pero aclara que los recursos se presentan conforme a sus normas especiales, que exigen la forma escrita.", false], ["B", "puede hacerlo solo si un abogado lo acompaña y firma el acta en la que usted transcriba sus motivos.", "La ley no exige abogado para que el interesado recurra en nombre propio. Lo que exige es que el recurso se presente por escrito.", false], ["C", "el recurso de reposición debe presentarse por escrito, sustentado con los motivos concretos de su inconformidad.", "El artículo 76 del CPACA exige interponer los recursos de reposición y apelación por escrito, y el artículo 77 exige sustentarlos con expresión concreta de los motivos de inconformidad.", true]]}, {"id": "AP-213", "niv": 1, "e": "Sobre el envío por correo electrónico, debe informarle que", "f": "Ley 1437 de 2011, art. 77", "o": [["A", "es posible, pero el recurso solo se tendrá por presentado cuando entregue el original firmado en la ventanilla.", "La ley no exige entregar después el original físico para que el recurso presentado electrónicamente sea válido.", false], ["B", "puede presentar el recurso por medios electrónicos.", "El artículo 77 del CPACA dispone que los recursos se interponen por escrito y que también pueden presentarse por medios electrónicos.", true], ["C", "no es posible, porque los recursos deben radicarse en físico en la ventanilla de la entidad.", "El artículo 77 del CPACA permite presentar los recursos por medios electrónicos.", false]]}, {"id": "AP-214", "niv": 1, "e": "Sobre la autenticación de la firma en notaría, lo correcto es indicarle que", "f": "Ley 1437 de 2011, art. 77; Decreto Ley 019 de 2012, art. 5", "o": [["A", "no la necesita, porque ya fue reconocido como interesado en la actuación.", "El artículo 77 del CPACA dispone que el escrito del recurso no requiere presentación personal si quien lo presenta ha sido reconocido en la actuación, y el Decreto Ley 019 de 2012 proscribe las autenticaciones no ordenadas por la ley.", true], ["B", "debe autenticarla, porque el recurso es un documento que busca modificar una decisión de la administración.", "Ninguna norma exige autenticar la firma del recurrente que actúa en nombre propio y fue reconocido en la actuación.", false], ["C", "debe autenticarla solo si envía el recurso por correo electrónico, para acreditar su identidad.", "La ley no exige autenticación para el recurso presentado por medios electrónicos.", false]]}, {"id": "AP-215", "niv": 2, "e": "Si en otra ocasión un funcionario competente se niega a recibirle un recurso, el ciudadano puede", "f": "Ley 1437 de 2011, art. 76, inciso 2", "o": [["A", "presentarlo directamente ante el juez administrativo, que lo tramitará en lugar de la secretaría.", "El juez administrativo no recibe ni tramita los recursos en sede administrativa. La ley prevé acudir al procurador regional o al personero.", false], ["B", "dar por agotado el recurso y entender que se produjo el silencio administrativo positivo.", "La negativa a recibir un recurso no produce silencio positivo. La ley prevé un mecanismo para que el recurso se reciba y se tramite.", false], ["C", "presentarlo ante el personero municipal o el procurador regional, para que ordene recibirlo y tramitarlo.", "El inciso 2 del artículo 76 del CPACA dispone que, si quien es competente no quisiere recibir los recursos, estos pueden presentarse ante el procurador regional o ante el personero municipal, para que ordene recibirlos y tramitarlos e imponga las sanciones que correspondan.", true]]}]}, {"comp": "gestion_publica", "rol": "general", "tag": "Gestión pública, MIPG, contratación y documentos · Contratación directa: urgencia manifiesta", "texto": "Usted trabaja en la Secretaría de Planeación e Infraestructura de un municipio de Antioquia. Una avenida torrencial destruyó el puente peatonal que comunica dos veredas y dejó a 200 niños sin acceso a la escuela. El alcalde declaró la urgencia manifiesta mediante decreto motivado y ordenó contratar de inmediato la construcción de un paso provisional. Un compañero insiste en que, antes de firmar, hay que elaborar estudios previos completos y expedir, aparte, el acto de justificación de la contratación directa.", "items": [{"id": "GP-157", "niv": 1, "e": "La situación descrita permite acudir a la urgencia manifiesta porque", "f": "Ley 80 de 1993, art. 42; Ley 1150 de 2007, art. 2, num. 4, lit. a", "o": [["A", "toda obra pública en zona rural puede contratarse de forma directa.", "La ubicación rural de una obra no es causal de contratación directa; las causales del artículo 2, numeral 4, de la Ley 1150 de 2007 son taxativas.", false], ["B", "busca conjurar una situación excepcional derivada de una calamidad que exige actuar de inmediato.", "El artículo 42 de la Ley 80 de 1993 define la urgencia manifiesta, entre otros supuestos, para conjurar situaciones excepcionales relacionadas con hechos de calamidad o desastre que demandan actuaciones inmediatas.", true], ["C", "el valor del paso provisional es inferior a la mínima cuantía del municipio.", "La urgencia manifiesta no depende del valor del contrato; se funda en hechos excepcionales que exigen actuar de inmediato.", false]]}, {"id": "GP-158", "niv": 2, "e": "Frente a la posición del compañero, usted le explica que", "f": "Decreto 1082 de 2015, art. 2.2.1.2.1.4.2", "o": [["A", "el acto de justificación debe expedirse aparte, aunque los estudios previos pueden elaborarse al liquidar el contrato.", "No hace falta un acto de justificación separado: el que declara la urgencia cumple esa función; y la norma no traslada los estudios previos a la liquidación.", false], ["B", "sin estudios previos completos el contrato sería nulo, aunque exista urgencia manifiesta.", "El reglamento releva a la entidad de elaborar estudios previos cuando la causal es la urgencia manifiesta, de modo que su ausencia no vicia el contrato por ese solo hecho.", false], ["C", "el decreto que declaró la urgencia hace las veces de acto de justificación y no es obligatorio elaborar estudios previos.", "El artículo 2.2.1.2.1.4.2 del Decreto 1082 de 2015 dispone que, cuando la causal es la urgencia manifiesta, el acto que la declara hace las veces de acto de justificación y la entidad no está obligada a elaborar estudios y documentos previos.", true]]}, {"id": "GP-159", "niv": 3, "e": "Inmediatamente después de celebrado el contrato, la alcaldía debe", "f": "Ley 80 de 1993, art. 43", "o": [["A", "remitir el contrato al concejo municipal para su aprobación, como requisito para poder pagarlo.", "La ley no somete los contratos de urgencia a aprobación del concejo; el control previsto es el del órgano de control fiscal.", false], ["B", "enviar el contrato, el decreto de urgencia y el expediente al órgano de control fiscal competente.", "El artículo 43 de la Ley 80 de 1993 ordena enviar, inmediatamente después de celebrados, los contratos de urgencia, el acto que la declaró y el expediente con sus antecedentes al funcionario u organismo que ejerce el control fiscal, que se pronuncia dentro de los dos meses siguientes.", true], ["C", "publicar un aviso de convocatoria en el SECOP para que otros interesados presenten ofertas.", "En la contratación directa no se expide aviso de convocatoria (Decreto 1082 de 2015) y, en todo caso, el contrato ya está celebrado; lo que exige la ley es el envío al control fiscal.", false]]}]}, {"comp": "gestion_publica", "rol": "asistencial", "tag": "Gestión pública, MIPG, contratación y documentos · Nivel asistencial · Gestión documental: ciclo vital y tipos de archivo", "texto": "Usted es auxiliar administrativo de la Secretaría de Gobierno de un municipio de sexta categoría y tiene a su cargo el archivo de la dependencia. En las estanterías hay expedientes de permisos para eventos del año en curso, que se consultan a diario; expedientes de hace seis años, que se consultan pocas veces al año pero aún tienen vigencia y ya cumplieron el tiempo de permanencia en la oficina fijado en la tabla de retención documental (TRD); y libros de actas del consejo de gobierno que la TRD señala como de conservación total y que ya cumplieron su tiempo en el archivo central.", "items": [{"id": "GP-194", "niv": 1, "e": "Los expedientes de permisos del año en curso pertenecen al", "f": "Ley 594 de 2000, art. 23", "o": [["A", "archivo de gestión, porque la oficina productora los usa y consulta continuamente.", "El literal a del artículo 23 de la Ley 594 de 2000 define el archivo de gestión como el que comprende la documentación sometida a continua utilización y consulta administrativa por las oficinas productoras.", true], ["B", "archivo histórico, porque son documentos oficiales del municipio.", "El archivo histórico recibe documentos de conservación permanente transferidos desde el archivo central; ser un documento oficial no lo ubica allí.", false], ["C", "archivo central, porque todo documento radicado debe enviarse allí desde su creación.", "Al archivo central llegan documentos transferidos desde los archivos de gestión cuando su consulta ya no es frecuente; no se envían allí desde su creación.", false]]}, {"id": "GP-195", "niv": 2, "e": "Con los expedientes de hace seis años, lo procedente es", "f": "Ley 594 de 2000, art. 23", "o": [["A", "eliminarlos, porque terminó su permanencia en el archivo de gestión.", "Terminar la permanencia en gestión no autoriza eliminar; la eliminación procede solo si la disposición final lo señala y siguiendo el procedimiento del AGN.", false], ["B", "transferirlos al archivo central, que agrupa documentos de consulta menos frecuente que siguen vigentes.", "El literal b del artículo 23 de la Ley 594 de 2000 define el archivo central como el que agrupa los documentos transferidos por los archivos de gestión, de consulta menos frecuente pero aún vigentes; la TRD ya indicó que terminó su tiempo en la oficina.", true], ["C", "transferirlos directamente al archivo histórico, porque ya no se consultan a diario.", "Al archivo histórico solo llegan, desde el archivo central, los documentos de conservación permanente; estos expedientes aún tienen vigencia y deben pasar primero por el archivo central.", false]]}, {"id": "GP-196", "niv": 2, "e": "Los libros de actas del consejo de gobierno, de conservación total, deben ahora", "f": "Ley 594 de 2000, art. 23", "o": [["A", "digitalizarse y luego eliminarse en papel, porque la copia digital los reemplaza.", "Si la TRD fija conservación total, el documento debe conservarse de forma permanente; digitalizarlo no autoriza su eliminación.", false], ["B", "devolverse al archivo de gestión para su custodia definitiva.", "El ciclo vital no prevé devolver documentos al archivo de gestión para conservarlos de forma permanente; su destino es el archivo histórico.", false], ["C", "transferirse al archivo histórico para su conservación permanente.", "El literal c del artículo 23 de la Ley 594 de 2000 define el archivo histórico como aquel al que se transfieren, desde el archivo central, los documentos de conservación permanente.", true]]}]}, {"comp": "entidades_territoriales", "rol": "general", "tag": "Entidades territoriales, Bogotá D.C. y CAR · Funciones del alcalde", "texto": "Usted es profesional de la Secretaría de Gobierno de un municipio de tercera categoría del Huila. Se acercan las fiestas patronales y la Policía reporta riñas asociadas al consumo de licor en el parque principal. El alcalde, que además prepara su informe de gestión al Concejo, le pide revisar qué medidas puede adoptar y si puede encargar a la secretaria de Gobierno algunas de sus funciones para atender la temporada.", "items": [{"id": "ET-113", "niv": 1, "e": "Para controlar las riñas durante las fiestas, el alcalde puede, como medida de orden público,", "f": "Ley 136 de 1994, arts. 84 y 91, lit. b), num. 2 (modificado por el art. 29 de la Ley 1551 de 2012)", "o": [["A", "restringir o prohibir el expendio y consumo de bebidas embriagantes, de conformidad con la ley.", "El art. 91, literal b), numeral 2 de la Ley 136 de 1994 (modificado por la Ley 1551 de 2012) faculta al alcalde para restringir o prohibir el expendio y consumo de bebidas embriagantes, entre otras medidas, para mantener o restablecer el orden público.", true], ["B", "tramitar un acuerdo ante el Concejo, porque esas restricciones son de reserva de la corporación.", "La restricción del expendio y consumo de bebidas embriagantes por razones de orden público es una medida que la ley atribuye directamente al alcalde.", false], ["C", "solicitar al gobernador que expida la medida, porque el orden público municipal le corresponde al departamento.", "El alcalde es la primera autoridad de policía del municipio y conserva el orden público en su jurisdicción (arts. 84 y 91 de la Ley 136 de 1994); no necesita que el gobernador expida la medida.", false]]}, {"id": "ET-114", "niv": 1, "e": "Sobre la posibilidad de que la secretaria de Gobierno ejerza algunas funciones del alcalde, usted le indica que", "f": "Ley 136 de 1994, art. 92 (modificado por el art. 30 de la Ley 1551 de 2012)", "o": [["A", "las funciones del alcalde son indelegables, por tratarse de un cargo de elección popular sujeto al voto programático del elegido.", "La ley sí permite la delegación de funciones del alcalde en sus secretarios, con la única excepción de las que tengan prohibición legal expresa.", false], ["B", "puede delegar en los secretarios de la alcaldía las funciones a su cargo, salvo aquellas que tengan prohibición legal expresa.", "El art. 92 de la Ley 136 de 1994 (modificado por el art. 30 de la Ley 1551 de 2012) permite delegar en secretarios y jefes de departamento administrativo las funciones del alcalde, excepto las que tengan prohibición legal expresa.", true], ["C", "la delegación solo procede con autorización previa del Concejo para cada función.", "El art. 92 de la Ley 136 de 1994 no exige autorización previa del Concejo para delegar en los secretarios; esa autorización se requiere para delegar en subalternos o JAL funciones distintas de las previstas en la ley (art. 32, num. 4).", false]]}, {"id": "ET-115", "niv": 2, "e": "Respecto del informe de gestión al Concejo, el alcalde debe presentar informes generales sobre su administración", "f": "Ley 136 de 1994, art. 91, lit. a), num. 4 (modificado por el art. 29 de la Ley 1551 de 2012)", "o": [["A", "solo cuando el Concejo lo cite a debate de control político.", "El alcalde no puede ser citado por el Concejo para declaraciones orales (art. 32, num. 2), y el informe general es un deber periódico, no una respuesta a citaciones.", false], ["B", "al terminar el último periodo de sesiones ordinarias del año, junto con el presupuesto.", "La norma ubica el informe general en la primera sesión ordinaria del año, no al final de la vigencia.", false], ["C", "en la primera sesión ordinaria de cada año.", "El art. 91, literal a), numeral 4 de la Ley 136 de 1994 (modificado por la Ley 1551 de 2012) ordena al alcalde presentar informes generales sobre su administración en la primera sesión ordinaria de cada año.", true]]}]}, {"comp": "entidades_territoriales", "rol": "general", "tag": "Entidades territoriales, Bogotá D.C. y CAR · Estructura administrativa de Bogotá (Acuerdo 257 de 2006)", "texto": "Usted ingresó como profesional universitario al Departamento Administrativo del Servicio Civil Distrital (DASCD) y participa en la inducción de nuevos servidores. Debe explicar cómo está organizada la administración distrital, qué es un sector administrativo de coordinación y qué instancia articula las entidades de cada sector. Varios asistentes trabajan en establecimientos públicos adscritos a secretarías y en alcaldías locales.", "items": [{"id": "ET-141", "niv": 1, "e": "Al explicar la estructura administrativa del Distrito, usted señala que comprende", "f": "Acuerdo 257 de 2006 del Concejo de Bogotá, art. 21", "o": [["A", "el sector central, el sector descentralizado funcionalmente o por servicios y el sector de las localidades.", "El art. 21 del Acuerdo 257 de 2006 establece que la estructura administrativa de Bogotá comprende el sector central, el sector descentralizado funcionalmente o por servicios y el sector de las localidades.", true], ["B", "el nivel nacional, el nivel departamental de Cundinamarca y el nivel distrital.", "Esa no es la estructura de la administración distrital; Bogotá tiene régimen especial y su administración se organiza en tres sectores propios.", false], ["C", "las secretarías de despacho y las empresas de servicios públicos, que son las únicas entidades con autonomía.", "La estructura incluye también departamentos administrativos, unidades administrativas especiales, establecimientos públicos y las localidades, entre otros.", false]]}, {"id": "ET-142", "niv": 2, "e": "Un sector administrativo de coordinación está conformado por", "f": "Acuerdo 257 de 2006 del Concejo de Bogotá, art. 36", "o": [["A", "los consejos superiores de la administración distrital y las comisiones intersectoriales que crea el alcalde mayor para coordinar la gestión de varios sectores.", "Esas son instancias del sistema de coordinación, no los integrantes de un sector administrativo.", false], ["B", "todas las entidades que tienen sede en una misma localidad, bajo la coordinación del alcalde local.", "La agrupación por territorio corresponde a las localidades; los sectores se organizan por áreas especializadas de la gestión.", false], ["C", "las secretarías y departamentos administrativos y las entidades descentralizadas adscritas o vinculadas a una secretaría cabeza de sector.", "El art. 36 del Acuerdo 257 de 2006 dispone que los sectores administrativos de coordinación se conforman por secretarías y departamentos administrativos y por las entidades descentralizadas adscritas o vinculadas a una secretaría cabeza de sector.", true]]}, {"id": "ET-143", "niv": 2, "e": "La instancia que articula la formulación de políticas y el seguimiento dentro de cada sector, integrada por la cabeza del sector y los directivos de sus entidades, es", "f": "Acuerdo 257 de 2006 del Concejo de Bogotá, arts. 34, 37 y 38; reglamentación distrital del MIPG (Decreto 1499 de 2017)", "o": [["A", "el Comité Sectorial de Gestión y Desempeño (antes llamado Comité Sectorial de Desarrollo Administrativo).", "El art. 37 del Acuerdo 257 de 2006 prevé en cada sector un comité integrado por la secretaría cabeza de sector y los directores o gerentes de sus entidades, que denominó Comité Sectorial de Desarrollo Administrativo; con la adopción del Modelo Integrado de Planeación y Gestión (Decreto 1499 de 2017) la reglamentación distrital lo denomina Comité Sectorial de Gestión y Desempeño.", true], ["B", "el Consejo de Gobierno Distrital, presidido por el alcalde mayor e integrado por los secretarios cabeza de sector.", "El Consejo de Gobierno Distrital es la máxima instancia de formulación de políticas para toda la administración (art. 34), no la instancia propia de cada sector.", false], ["C", "la comisión intersectorial que el alcalde mayor cree para coordinar las entidades del respectivo sector.", "Las comisiones intersectoriales coordinan funciones que comprometen entidades de diferentes sectores (art. 38 del Acuerdo 257 de 2006).", false]]}]}, {"comp": "comportamental", "rol": "general", "tag": "Competencias comportamentales (Decreto 815 de 2018) · Aprendizaje continuo", "texto": "Usted trabaja en la ventanilla de trámites ambientales de una corporación autónoma regional del oriente del país. Cada vez más usuarios preguntan cómo radicar en línea sus solicitudes de concesión de aguas a través de una plataforma nacional de trámites ambientales, que usted conoce poco. Además, el mes pasado entró en vigencia una norma nacional que modificó algunos requisitos de un permiso que se tramita en su ventanilla, pero la lista de chequeo interna todavía no se ha actualizado. Usted participa en un grupo virtual informal de servidores de ventanilla de varias corporaciones, donde se comparten dudas prácticas sobre el uso de la plataforma.", "items": [{"id": "CO-104", "niv": 1, "e": "Para orientar a los usuarios sobre la radicación en línea, la conducta que mejor refleja el aprendizaje continuo es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Aprendizaje continuo)", "o": [["A", "remitir a los usuarios a la mesa de ayuda de la plataforma mientras la corporación decide si capacitará al personal de ventanilla.", "Traslada la necesidad al usuario y espera una decisión institucional. La competencia pide actualizarse por iniciativa propia para mantener la efectividad de la atención.", false], ["B", "estudiar los manuales oficiales de la plataforma y practicar la radicación, ya que así podrá orientar bien a los usuarios.", "Refleja la competencia «Aprendizaje continuo» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en iden
