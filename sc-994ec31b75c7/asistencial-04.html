tificar, incorporar y aplicar conocimientos nuevos sobre normas, tecnologías y métodos de trabajo para mantener vigente la efectividad de las propias prácticas. Corresponde a gestionar sus propias fuentes de información confiable y mantener sus competencias actualizadas según los cambios que exige la administración: los materiales oficiales son la fuente adecuada.", true], ["C", "aprender el proceso con cada caso, pidiendo a los usuarios que ya radicaron que le cuenten qué pasos siguieron.", "Aprende de una fuente que no garantiza exactitud: la experiencia de cada usuario puede contener errores. La conducta asociada exige información confiable.", false]]}, {"id": "CO-105", "niv": 3, "e": "Frente a la norma nacional que cambió los requisitos del permiso, la conducta más coherente con el aprendizaje continuo es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Aprendizaje continuo)", "o": [["A", "aplicar desde ya a los usuarios su interpretación de los cambios, con base en el resumen que le envió un colega de otra corporación.", "Se apoya en una fuente secundaria sin consultar el texto oficial, y aplica por su cuenta un criterio que no comparte con su equipo ni queda reflejado en la lista de chequeo institucional.", false], ["B", "seguir aplicando la lista de chequeo vigente hasta que la oficina jurídica emita una circular, para no generar criterios distintos entre ventanillas.", "Evita criterios dispares, pero ignora un cambio normativo que ya conoce y no lo pone en conocimiento de nadie. La competencia exige incorporar las regulaciones vigentes y compartir ese saber para que la práctica se actualice.", false], ["C", "consultar el texto oficial de la norma y advertir a su jefe y a sus compañeros las diferencias frente a la lista de chequeo para que se actualice.", "Refleja la competencia «Aprendizaje continuo» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en identificar, incorporar y aplicar conocimientos nuevos sobre normas, tecnologías y métodos de trabajo para mantener vigente la efectividad de las propias prácticas. Reúne dos conductas asociadas: mantener actualizadas las competencias con base en las regulaciones vigentes, consultadas en fuente oficial, y compartir ese saber con los compañeros para que la práctica de toda la ventanilla se ajuste por el conducto institucional.", true]]}, {"id": "CO-106", "niv": 2, "e": "Respecto del grupo virtual de servidores de ventanilla de otras corporaciones, la conducta más acorde con el aprendizaje continuo es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Aprendizaje continuo)", "o": [["A", "participar en el grupo aportando las soluciones prácticas que ha encontrado y contrastándolas con las de otras corporaciones.", "Refleja la competencia «Aprendizaje continuo» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en identificar, incorporar y aplicar conocimientos nuevos sobre normas, tecnologías y métodos de trabajo para mantener vigente la efectividad de las propias prácticas. Refleja la conducta de participar en espacios informativos y de interaprendizaje, compartiendo saberes y aprendiendo de colegas habilidades diferenciales sobre el uso de la plataforma.", true], ["B", "salir del grupo y concentrarse en los cursos formales de la corporación, que son la fuente avalada por la entidad.", "La capacitación formal es útil, pero la competencia también valora los flujos informales de interaprendizaje entre colegas como medio para nivelar conocimientos.", false], ["C", "leer los mensajes del grupo sin intervenir, para no difundir prácticas de trabajo que la corporación todavía no ha revisado ni aprobado.", "Aprovecha parte de la información, pero renuncia a compartir sus saberes. Las dudas son prácticas sobre la plataforma, no criterios reservados, y la competencia incluye aportar al interaprendizaje.", false]]}]}, {"comp": "comportamental", "rol": "general", "tag": "Competencias comportamentales (Decreto 815 de 2018) · Orientación al usuario y al ciudadano", "texto": "Usted trabaja en el punto de atención de una entidad distrital de Bogotá que tramita permisos para el aprovechamiento económico del espacio público. Esta semana llega un comerciante molesto porque ha venido tres veces y en cada visita le han dado información distinta sobre su trámite. También atiende a un vendedor que no sabe leer ni escribir y necesita diligenciar el formulario de solicitud. Además, varios usuarios se quejan de demoras que se originan en la visita técnica, a cargo de otra dependencia de la entidad.", "items": [{"id": "CO-116", "niv": 2, "e": "Ante el comerciante molesto por la información contradictoria, la conducta que mejor refleja la orientación al usuario y al ciudadano es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Orientación al usuario y al ciudadano)", "o": [["A", "ofrecerle disculpas en nombre de la entidad y orientarlo a radicar una queja para que su caso quede registrado.", "Reconocer la falla y orientar la queja es válido, pero deja sin resolver la necesidad concreta: saber en qué va su trámite.", false], ["B", "escucharlo sin interrumpir, revisar en el sistema el estado real del trámite y darle una respuesta precisa sobre lo que falta.", "Refleja la competencia «Orientación al usuario y al ciudadano» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en dirigir las decisiones y acciones a satisfacer las necesidades e intereses de los usuarios internos y externos y de los ciudadanos, según las responsabilidades de la entidad. Corresponde a escuchar activamente e informar con veracidad, y a atender de forma oportuna las necesidades del usuario: resuelve la causa de su molestia con información verificada.", true], ["C", "remitirlo al coordinador del punto de atención, quien tiene acceso a todos los trámites y puede darle una respuesta definitiva.", "Prolonga la atención y suma otro intermediario, cuando usted puede verificar el estado del trámite. No atiende la necesidad de forma oportuna.", false]]}, {"id": "CO-117", "niv": 1, "e": "Para atender al vendedor que no sabe leer ni escribir, la conducta más acorde con la orientación al usuario y al ciudadano es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Orientación al usuario y al ciudadano)", "o": [["A", "pedirle que regrese acompañado de alguien de su confianza que sepa leer, para que lo ayude a diligenciar y revisar el formulario con tranquilidad.", "Le impone una carga adicional y aplaza su trámite. La competencia pide adecuar la atención a las condiciones del ciudadano.", false], ["B", "entregarle el formulario y marcar con resaltador los campos que debe llenar la persona que lo ayude.", "Muestra disposición, pero no resuelve la necesidad: el usuario sigue dependiendo de un tercero para hacer su solicitud.", false], ["C", "leerle el formulario, diligenciarlo con los datos que él le dicte y leerle lo escrito antes de que firme o ponga su huella.", "Refleja la competencia «Orientación al usuario y al ciudadano» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en dirigir las decisiones y acciones a satisfacer las necesidades e intereses de los usuarios internos y externos y de los ciudadanos, según las responsabilidades de la entidad. Refleja la conducta de aplicar la no estigmatización y la no discriminación generando espacios incluyentes: adapta la atención a la condición del usuario y asegura que conozca lo que suscribe.", true]]}, {"id": "CO-118", "niv": 3, "e": "Frente a las quejas por demoras originadas en la visita técnica de otra dependencia, la conducta que mejor refleja la orientación al usuario y al ciudadano es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Orientación al usuario y al ciudadano)", "o": [["A", "explicar a cada usuario que la demora es responsabilidad de la otra dependencia y darle el teléfono de esa oficina.", "Informa, pero se desentiende del problema y traslada al usuario la gestión interna. La competencia reconoce la interdependencia entre áreas.", false], ["B", "informar al usuario en qué etapa está su trámite y enviar a la dependencia de visitas un reporte de los casos represados con sus fechas.", "Refleja la competencia «Orientación al usuario y al ciudadano» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en dirigir las decisiones y acciones a satisfacer las necesidades e intereses de los usuarios internos y externos y de los ciudadanos, según las responsabilidades de la entidad. Reúne las conductas de reconocer la interdependencia entre su trabajo y el de otros y de informar con veracidad: da al usuario información real y alerta a quien puede resolver el represamiento.", true], ["C", "comprometerse con cada usuario a que la visita técnica de su trámite se realizará esta misma semana.", "Busca tranquilizar, pero promete algo que no controla. La competencia exige informar con veracidad.", false]]}]}, {"comp": "comportamental", "rol": "general", "tag": "Competencias comportamentales (Decreto 815 de 2018) · Orientación a resultados", "texto": "Usted trabaja en la Secretaría de Infraestructura de una gobernación y apoya el seguimiento de 15 convenios con municipios para construir vías terciarias en placa huella. Su jefe le pidió visitar todas las obras en los próximos dos meses; el vehículo asignado solo está disponible dos días por semana. En una de las visitas, el alcalde le pide que en el informe registre la obra como terminada para poder liquidar el convenio antes de fin de año, aunque usted verificó que falta cerca del 5 % de la obra, que según él se terminará en enero.", "items": [{"id": "CO-128", "niv": 1, "e": "Para planear las visitas, la conducta que mejor refleja la orientación a resultados es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Orientación a resultados)", "o": [["A", "programar las visitas según los días reales de disponibilidad del vehículo y dar prioridad a los convenios con mayor atraso.", "Refleja la competencia «Orientación a resultados» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en cumplir las funciones y los compromisos de la organización con eficacia, calidad y oportunidad. Responde a trabajar con objetivos claros y realistas y adoptar medidas para minimizar riesgos: el plan se ajusta a los recursos disponibles y atiende primero donde hay más riesgo.", true], ["B", "visitar primero los municipios más cercanos a la capital, para avanzar rápido en el número de visitas realizadas.", "Prioriza la cantidad y la comodidad sobre el riesgo. No orienta el esfuerzo a los convenios donde el seguimiento es más necesario.", false], ["C", "programar las 15 visitas dentro del primer mes para tener margen, aunque el vehículo solo esté disponible dos días por semana.", "El plan no es realista frente a los recursos: con dos días semanales de vehículo, difícilmente se cumple en un mes y el cronograma se rompería.", false]]}, {"id": "CO-129", "niv": 2, "e": "Para hacer seguimiento al avance de los convenios durante los dos meses, la conducta más acorde con la orientación a resultados es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Orientación a resultados)", "o": [["A", "anotar en su libreta de campo los hallazgos de cada visita y consolidarlos en un solo documento al cierre de los dos meses.", "Registra información, pero la consolida tarde y sin indicadores, lo que impide detectar a tiempo los convenios rezagados.", false], ["B", "actualizar cada semana una matriz con el avance físico y financiero de cada convenio, para detectar a tiempo los rezagos.", "Refleja la competencia «Orientación a resultados» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en cumplir las funciones y los compromisos de la organización con eficacia, calidad y oportunidad. Corresponde a diseñar y utilizar indicadores para medir los resultados y evaluar de forma regular el grado de consecución de los objetivos.", true], ["C", "esperar los informes de interventoría que envían los municipios y consolidar el avance cuando se reciban todos.", "Depende del ritmo de terceros y no evalúa regularmente el cumplimiento. La competencia pide medir y comprobar los resultados de forma periódica.", false]]}, {"id": "CO-130", "niv": 2, "e": "Ante la petición del alcalde, la conducta que mejor refleja la orientación a resultados es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Orientación a resultados)", "o": [["A", "abstenerse de entregar el informe de esa obra hasta que el municipio la termine en enero y entonces reportarla completa y ya recibida.", "Evita el conflicto, pero incumple la oportunidad del informe que le corresponde entregar y oculta información útil para la gobernación.", false], ["B", "registrar la obra como terminada con una observación sobre el 5 % pendiente, para no frenar la liquidación del convenio.", "Facilita la meta de liquidar, pero el informe dejaría de reflejar lo verificado. La competencia exige que los productos se enmarquen en las normas que rigen a la entidad.", false], ["C", "registrar el avance real verificado e indicar en el informe lo pendiente y la fecha anunciada por el municipio.", "Refleja la competencia «Orientación a resultados» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en cumplir las funciones y los compromisos de la organización con eficacia, calidad y oportunidad. Refleja la conducta de aportar a los resultados enmarcando los productos dentro de las normas de la entidad: el informe es oportuno y veraz, y deja constancia de lo pendiente.", true]]}]}, {"comp": "comportamental", "rol": "general", "tag": "Competencias comportamentales (Decreto 815 de 2018) · Trabajo en equipo", "texto": "Usted forma parte de un equipo de tres servidores de una corporación autónoma regional que realiza visitas de control a usuarios con concesión de aguas en una cuenca andina. El equipo acordó que cada informe de visita sea revisado por otro integrante antes de enviarlo. En las últimas semanas el equipo se ve desmotivado por la cantidad de visitas a zonas lejanas. En una visita, usted observa una captación aparentemente ilegal en un predio que está incluido en la ruta que su compañero Jorge recorrerá la próxima semana.", "items": [{"id": "CO-140", "niv": 2, "e": "Su compañero revisor hace a su informe varias observaciones que usted no comparte. La conducta que mejor refleja el trabajo en equipo es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Trabajo en equipo)", "o": [["A", "revisar cada observación con él, acoger las que mejoran el informe y explicarle con argumentos las que no comparte.", "Refleja la competencia «Trabajo en equipo» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en trabajar con otros de manera integrada y armónica para lograr metas institucionales comunes. Corresponde a respetar la diversidad de criterios y comunicarse de forma directa y respetuosa para compartir ideas: el informe mejora con el aporte de ambos.", true], ["B", "aceptar todas las observaciones sin discutirlas y enviar el informe corregido ese mismo día.", "Agiliza el envío, pero renuncia a compartir sus argumentos y puede afectar la calidad del informe.", false], ["C", "enviar el informe sin cambios, porque la responsabilidad técnica de la visita es suya.", "Desconoce el acuerdo del equipo sobre la revisión cruzada y no respeta el criterio del compañero.", false]]}, {"id": "CO-141", "niv": 3, "e": "Frente a la desmotivación del equipo por las visitas lejanas, la conducta más acorde con el trabajo en equipo es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Trabajo en equipo)", "o": [["A", "comentar a su jefe el desánimo que percibe en el equipo, para que sea él quien adopte una solución.", "Informa, pero no aporta desde su papel de integrante a la motivación del grupo.", false], ["B", "asumir usted las visitas más lejanas durante el próximo mes, para aliviar la carga de trabajo de sus dos compañeros de equipo.", "Es generoso, pero no resuelve el problema del equipo, concentra la carga en una persona y no es sostenible.", false], ["C", "reconocer en la reunión el esfuerzo de los compañeros y proponer que las visitas lejanas se distribuyan por turnos.", "Refleja la competencia «Trabajo en equipo» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en trabajar con otros de manera integrada y armónica para lograr metas institucionales comunes. Refleja la conducta de asumir su responsabilidad como miembro del equipo enfocándose en contribuir al compromiso y la motivación de los demás, con una propuesta equitativa.", true]]}, {"id": "CO-142", "niv": 3, "e": "Respecto de la captación ilegal observada, la conducta que mejor refleja el trabajo en equipo es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Trabajo en equipo)", "o": [["A", "incluirla en su informe y dejar que Jorge la conozca cuando lea el consolidado mensual de las visitas.", "Cumple el registro, pero retiene información que su compañero necesita para la visita de la próxima semana.", false], ["B", "registrarla en su informe y enviar de inmediato a Jorge la ubicación y las fotos, porque el predio está en su ruta.", "Refleja la competencia «Trabajo en equipo» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en trabajar con otros de manera integrada y armónica para lograr metas institucionales comunes. Corresponde a establecer comunicación directa para compartir información con el equipo y planificar las propias acciones según su efecto en los objetivos comunes: deja el registro formal y prepara la visita de su compañero.", true], ["C", "avisarle a Jorge y dejar que él la reporte en su propio informe, para que el hallazgo no quede registrado dos veces.", "Comparte la información, pero omite registrar lo que usted mismo observó, como exige el procedimiento de visita.", false]]}]}, {"comp": "comportamental", "rol": "asistencial", "tag": "Competencias comportamentales (Decreto 815 de 2018) · Nivel asistencial · Manejo de la información", "texto": "Usted es auxiliar administrativo de la oficina de talento humano de la alcaldía de un municipio de cuarta categoría y custodia las historias laborales de los servidores. Un compañero de otra dependencia le pregunta en el pasillo si es cierto que una servidora está incapacitada por un problema de salud mental. Su jefe le pide diseñar el formato de actualización de datos de los servidores. Más tarde, un servidor de la Secretaría de Gobierno se acerca a pedir que le deje revisar la hoja de vida de un compañero, porque «lo van a encargar». El procedimiento de la oficina establece que las historias laborales solo se consultan con autorización del jefe de talento humano y con registro de préstamo.", "items": [{"id": "CO-200", "niv": 2, "e": "Frente a la pregunta sobre la incapacidad de la servidora, la conducta que mejor refleja el manejo de la información es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 5, sustituido por el art. 1 del Decreto 815 de 2018 (nivel asistencial: Manejo de la información)", "o": [["A", "decirle con amabilidad que no puede comentar información de las historias laborales de otros servidores.", "Refleja la competencia «Manejo de la información» (Decreto 1083 de 2015, art. 2.2.4.8, num. 5, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en manejar con responsabilidad la información personal e institucional de la que se dispone. Corresponde a evadir los temas que indagan sobre información confidencial y no hacer pública información que pueda afectar a las personas.", true], ["B", "confirmarle que la servidora sí está incapacitada, pero sin dar detalles del diagnóstico ni de la duración de la incapacidad.", "Intenta ser discreto, pero igual revela información personal que no debe compartir.", false], ["C", "sugerirle que le pregunte directamente a la servidora cuando ella regrese a la oficina.", "No revela el dato, pero alienta indagar sobre la salud de una compañera.", false]]}, {"id": "CO-201", "niv": 1, "e": "Para el formato de actualización de datos, la conducta más acorde con el manejo de la información es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 5, sustituido por el art. 1 del Decreto 815 de 2018 (nivel asistencial: Manejo de la información)", "o": [["A", "incluir únicamente los datos que la oficina necesita, como contacto y beneficiarios, ya que los demás no tienen uso.", "Refleja la competencia «Manejo de la información» (Decreto 1083 de 2015, art. 2.2.4.8, num. 5, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en manejar con responsabilidad la información personal e institucional de la que se dispone. Refleja la conducta de recoger solo la información imprescindible para el desarrollo de la tarea.", true], ["B", "incluir campos amplios sobre la familia, la salud y las preferencias de cada servidor, por si se necesitan en el futuro.", "Prevé necesidades futuras, pero recoge información sensible que no es necesaria hoy.", false], ["C", "copiar el formato de otra alcaldía, que es más completo e incluye datos familiares y de salud.", "Ahorra trabajo, pero no evalúa qué datos son realmente necesarios.", false]]}, {"id": "CO-202", "niv": 3, "e": "Ante la solicitud del servidor de la Secretaría de Gobierno, la conducta que mejor refleja el manejo de la información es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 5, sustituido por el art. 1 del Decreto 815 de 2018 (nivel asistencial: Manejo de la información)", "o": [["A", "entregarle una fotocopia de la hoja de vida, ya que el original debe permanecer en la historia laboral.", "Protege el original, pero entrega información personal sin la autorización previa.", false], ["B", "indicarle que primero debe obtener el visto bueno del jefe de la oficina y que el préstamo quedará anotado, y orientarlo para pedirlo.", "Refleja la competencia «Manejo de la información» (Decreto 1083 de 2015, art. 2.2.4.8, num. 5, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en manejar con responsabilidad la información personal e institucional de la que se dispone. Corresponde a organizar y custodiar la información a su cuidado según las normas legales y de la organización.", true], ["C", "permitirle consultar la hoja de vida en su presencia y anotar la consulta en el registro de préstamos de la oficina.", "Deja constancia de la consulta, pero omite la autorización previa que exige el procedimiento.", false]]}]}, {"comp": "comportamental", "rol": "asistencial", "tag": "Competencias comportamentales (Decreto 815 de 2018) · Nivel asistencial · Relaciones interpersonales", "texto": "Usted es secretario de la Subdirección de Gestión Ambiental de una corporación autónoma regional. Comparte con su compañero Óscar la carpeta digital de correspondencia, que él suele dejar desordenada. Al grupo se integró Natalia, auxiliar con discapacidad auditiva. Además, un usuario campesino de 70 años recibió un oficio de la corporación que le pide aportar un plano del predio y un certificado de tradición, y usted sabe, por una conversación previa en ventanilla, que el usuario no entendió el oficio.", "items": [{"id": "CO-212", "niv": 2, "e": "Frente al desorden de la carpeta compartida, la conducta que mejor refleja las relaciones interpersonales es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 5, sustituido por el art. 1 del Decreto 815 de 2018 (nivel asistencial: Relaciones interpersonales)", "o": [["A", "reorganizar usted mismo la carpeta cada vez que la encuentre desordenada, sin comentarle nada a Óscar.", "Evita el conflicto, pero no comunica el problema y la situación se repetirá.", false], ["B", "informar al subdirector sobre el desorden de Óscar en la carpeta compartida, para que sea él quien tome las medidas del caso.", "Escala un asunto que puede resolverse con una conversación directa y respetuosa.", false], ["C", "hablar con Óscar en privado, explicarle cómo le afecta el desorden y acordar una forma de organizar la carpeta.", "Refleja la competencia «Relaciones interpersonales» (Decreto 1083 de 2015, art. 2.2.4.8, num. 5, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en establecer y mantener relaciones de trabajo positivas, basadas en una comunicación abierta y fluida y en el respeto por los demás. Corresponde a mantener relaciones de trabajo positivas basadas en una comunicación abierta y fluida y en el respeto.", true]]}, {"id": "CO-213", "niv": 2, "e": "Para coordinar el trabajo diario con Natalia, la conducta más acorde con las relaciones interpersonales es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 5, sustituido por el art. 1 del Decreto 815 de 2018 (nivel asistencial: Relaciones interpersonales)", "o": [["A", "preguntarle cómo prefiere comunicarse y usar ese medio en las coordinaciones diarias.", "Refleja la competencia «Relaciones interpersonales» (Decreto 1083 de 2015, art. 2.2.4.8, num. 5, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en establecer y mantener relaciones de trabajo positivas, basadas en una comunicación abierta y fluida y en el respeto por los demás. Refleja la conducta de escuchar con interés y captar las necesidades de los demás, en una relación basada en el respeto.", true], ["B", "comunicarle todo por escrito desde el primer día, sin preguntarle, porque supone que es lo más cómodo para ella.", "Tiene buena intención, pero decide por ella sin escucharla.", false], ["C", "pedir a otro compañero que actúe como intermediario cuando necesite comunicarse con ella.", "Busca facilitar, pero la excluye de la comunicación directa con usted.", false]]}, {"id": "CO-214", "niv": 3, "e": "Respecto del usuario que no entendió el oficio, la conducta que mejor refleja las relaciones interpersonales es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 5, sustituido por el art. 1 del Decreto 815 de 2018 (nivel asistencial: Relaciones interpersonales)", "o": [["A", "reenviarle el mismo oficio por correo certificado, para asegurar que quede notificado en debida forma del requerimiento.", "Asegura el envío, pero no resuelve la dificultad de comprensión del usuario.", false], ["B", "llamarlo para explicarle con palabras sencillas qué documentos le piden y dejar constancia de la llamada.", "Refleja la competencia «Relaciones interpersonales» (Decreto 1083 de 2015, art. 2.2.4.8, num. 5, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en establecer y mantener relaciones de trabajo positivas, basadas en una comunicación abierta y fluida y en el respeto por los demás. Corresponde a tomar la iniciativa en el contacto con los usuarios para dar respuestas con lenguaje claro, en especial con personas en situación de mayor vulnerabilidad.", true], ["C", "esperar a que el profesional que hará la visita le explique el oficio cuando vaya al predio.", "Aplaza la aclaración y no toma la iniciativa de comunicarse con el usuario.", false]]}]}];
const CFG = {"titulo": "Simulacro 4 · Nivel asistencial · CNSC Empleo Público", "modo": "simulacro", "minutos": 130, "componentes": {"estado_constitucion": "Estado y Constitución", "empleo_publico": "Empleo público, carrera y régimen disciplinario", "atencion_procedimiento": "Atención al ciudadano y procedimiento administrativo", "gestion_publica": "Gestión pública, MIPG, contratación y documentos", "entidades_territoriales": "Entidades territoriales, Bogotá D.C. y CAR", "comportamental": "Competencias comportamentales (Decreto 815 de 2018)"}, "niveles": {"1": "Básico", "2": "Intermedio", "3": "Avanzado"}, "roles": {"general": "Todos los niveles", "asistencial": "Nivel asistencial", "tecnico": "Nivel técnico", "profesional": "Nivel profesional"}, "clave": "asistencial-04.html"};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY = 'sim-cnsc:' + CFG.clave;
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}
function save(){try{localStorage.setItem(KEY, JSON.stringify(ST))}catch(e){}}
let ST = load();
ST.r = ST.r || {};
$('#tit').textContent = CFG.titulo;
const ITEMS = [];
DATA.forEach(c => c.items.forEach(it => { it.caso = c; ITEMS.push(it); }));

function justHTML(it){
  return '<div class="just">' + it.o.map(o => `<div><b>${o[0]}.</b> <span class="${o[3]?'okt':'not'}">${o[3]?'Es correcta.':'Es incorrecta.'}</span> ${esc(o[2])}</div>`).join('') +
    `<div class="src">Referencia: ${esc(it.f)}</div></div>`;
}
function itemHTML(it, n, mode){
  const r = ST.r[it.id];
  const reveal = mode === 'review' || (CFG.modo === 'practica' && r);
  let h = `<div class="item" id="i-${it.id}"><p class="enun"><span class="n">${n}.</span> <span class="niv">${CFG.niveles[it.niv]}</span> ${esc(it.e)}</p>`;
  it.o.forEach(o => {
    let cls = '';
    if (reveal) { if (o[3]) cls = 'ok'; else if (r === o[0]) cls = 'no'; }
    else if (r === o[0]) cls = 'sel';
    h += `<button class="op ${cls}" data-id="${it.id}" data-l="${o[0]}" ${reveal?'disabled':''}><span class="l">${o[0]}.</span><span>${esc(o[1])}</span></button>`;
  });
  if (reveal) {
    if (mode === 'review') h += `<div class="${r===keyOf(it)?'res-ok':'res-no'}" style="font-size:14px;margin-top:4px">${r ? (r===keyOf(it)?'Respondiste ' + r + ': correcto.':'Respondiste ' + r + '. La respuesta correcta es ' + keyOf(it) + '.') : 'Sin responder. La respuesta correcta es ' + keyOf(it) + '.'}</div>`;
    h += justHTML(it);
  }
  return h + '</div>';
}
const keyOf = it => it.o.find(o => o[3])[0];

function renderList(list, mode){
  let h = '', last = null, n = 0;
  list.forEach(it => {
    n++;
    if (it.caso !== last) { last = it.caso; h += `<div class="caso"><div class="tag">${esc(it.caso.tag)}</div><p>${esc(it.caso.texto)}</p></div>`; }
    h += itemHTML(it, n, mode);
  });
  return h;
}

// ---------- PRÁCTICA ----------
let LIST = [];
let FILTRO = ST.f || {comp:'', niv:'', rol:''};
function practica(){
  const comps = Object.entries(CFG.componentes).map(([k,v]) => `<option value="${k}" ${FILTRO.comp===k?'selected':''}>${esc(v)}</option>`).join('');
  const nivs = Object.entries(CFG.niveles).map(([k,v]) => `<option value="${k}" ${FILTRO.niv===k?'selected':''}>${esc(v)}</option>`).join('');
  const list = ITEMS.filter(it => (!FILTRO.comp || it.caso.comp===FILTRO.comp) && (!FILTRO.niv || String(it.niv)===FILTRO.niv) && (!FILTRO.rol || it.caso.rol===FILTRO.rol || it.caso.rol==='general'));
  const resp = list.filter(it => ST.r[it.id]); const ok = resp.filter(it => ST.r[it.id]===keyOf(it));
  $('#main').innerHTML = `<div class="panel"><p style="margin-top:0">Elige un tema, tu nivel de empleo y la dificultad. Al responder verás de inmediato si acertaste y la explicación de cada opción.</p>
  <div class="row"><select id="fc"><option value="">Todos los temas</option>${comps}</select>
  <select id="fn"><option value="">Todas las dificultades</option>${nivs}</select>
  <select id="fr"><option value="">Todos los niveles de empleo</option>${['asistencial','tecnico','profesional'].map(k => `<option value="${k}" ${FILTRO.rol===k?'selected':''}>${esc(CFG.roles[k])} (y temas comunes)</option>`).join('')}</select>
  <button class="btn sec" id="borrar">Borrar mis respuestas</button></div>
  <p class="stat" id="pst" style="margin-bottom:0">${list.length} preguntas · respondidas ${resp.length} · aciertos ${ok.length}${resp.length? ' (' + Math.round(100*ok.length/resp.length) + ' %)':''}</p></div>` + renderList(list, 'practica');
  $('#prog').textContent = `${ok.length}/${resp.length} aciertos`;
  ['fc','fn','fr'].forEach((id,i) => $('#'+id).onchange = e => { FILTRO[['comp','niv','rol'][i]] = e.target.value; ST.f = FILTRO; save(); practica(); });
  LIST = list;
  $('#borrar').onclick = () => { list.forEach(it => delete ST.r[it.id]); save(); practica(); };
}

// ---------- SIMULACRO ----------
let tick = null;
function inicio(){
  const n = ITEMS.length, cnt = {};
  ITEMS.forEach(it => cnt[it.caso.comp] = (cnt[it.caso.comp]||0) + 1);
  const h = Math.floor(CFG.minutos/60), m = CFG.minutos%60;
  $('#main').innerHTML = `<div class="panel"><h2 style="margin-top:0;color:var(--pri)">Instrucciones</h2>
  <p>Este simulacro tiene <b>${n} preguntas</b> en el formato de Prueba de Juicio Situacional: un caso, enunciados que se completan y tres opciones con una sola respuesta correcta.</p>
  <table>${Object.entries(cnt).map(([k,v]) => `<tr><td>${esc(CFG.componentes[k])}</td><td class="r">${v}</td></tr>`).join('')}</table>
  <p>Tiempo sugerido: <b>${h ? h + ' h ' : ''}${m ? m + ' min' : ''}</b> (unos ${Math.round(CFG.minutos*60/n/6)/10} minutos por pregunta). Cuando se acaba el tiempo puedes seguir, pero el cronómetro lo indica.</p>
  <p>Tus respuestas se guardan en este navegador. Al terminar verás tu puntaje por componente y por dificultad, y la explicación de cada pregunta.</p>
  <button class="btn" id="go">${ST.t0 ? 'Continuar el simulacro' : 'Comenzar'}</button></div>`;
  $('#prog').textContent = `${n} preguntas`;
  $('#go').onclick = () => { if (!ST.t0) { ST.t0 = Date.now(); save(); } examen(); };
}
function reloj(){
  const rest = CFG.minutos*60 - Math.floor((Date.now() - ST.t0)/1000);
  const a = Math.abs(rest), hh = Math.floor(a/3600), mm = Math.floor(a%3600/60), ss = a%60;
  const t = (rest < 0 ? '+' : '') + (hh ? hh + ':' : '') + String(mm).padStart(2,'0') + ':' + String(ss).padStart(2,'0');
  $('#timer').textContent = rest < 0 ? 'Tiempo cumplido ' + t : '⏱ ' + t;
  $('#timer').classList.toggle('low', rest < 600);
}
function examen(){
  $('#main').innerHTML = renderList(ITEMS, 'examen') + `<div class="panel"><button class="btn" id="fin">Terminar y calificar</button></div>`;
  progreso(); reloj(); clearInterval(tick); tick = setInterval(reloj, 1000);
  $('#fin').onclick = () => {
    const faltan = ITEMS.length - Object.keys(ST.r).filter(k => ITEMS.some(i => i.id===k)).length;
    $('#mtxt').textContent = faltan ? `Te faltan ${faltan} preguntas por responder. ¿Quieres calificar de todos modos?` : '¿Quieres terminar y ver tu calificación?';
    $('#modal').classList.remove('hide');
  };
}
function progreso(){
  const r = ITEMS.filter(it => ST.r[it.id]).length;
  $('#prog').textContent = `Respondidas ${r}/${ITEMS.length}`;
}
$('#mno').onclick = () => $('#modal').classList.add('hide');
$('#msi').onclick = () => { $('#modal').classList.add('hide'); ST.fin = Date.now(); save(); resultados(); };
function resultados(){
  clearInterval(tick);
  const ok = ITEMS.filter(it => ST.r[it.id] === keyOf(it)).length;
  const pct = Math.round(1000*ok/ITEMS.length)/10;
  const g = (fn, lab) => { const m = {}; ITEMS.forEach(it => { const k = fn(it); m[k] = m[k] || [0,0]; m[k][1]++; if (ST.r[it.id]===keyOf(it)) m[k][0]++; });
    return Object.entries(m).map(([k,v]) => `<tr><td>${esc(lab(k))}</td><td class="r">${v[0]}/${v[1]}</td><td class="r">${Math.round(100*v[0]/v[1])} %</td></tr>`).join(''); };
  const mins = Math.round(((ST.fin||Date.now()) - ST.t0)/60000);
  $('#timer').textContent = `Tiempo usado: ${Math.floor(mins/60) ? Math.floor(mins/60) + ' h ' : ''}${mins%60} min`;
  $('#prog').textContent = `${ok}/${ITEMS.length} aciertos`;
  $('#main').innerHTML = `<div class="panel"><div class="big">${String(pct).replace('.',',')} %</div>
  <p style="margin-top:4px">${ok} de ${ITEMS.length} respuestas correctas. ${pct >= 75 ? 'Muy buen resultado: repasa las explicaciones de tus errores para afianzarlo.' : pct >= 65 ? 'Vas bien, pero con poco margen: refuerza los componentes con menor porcentaje.' : 'Todavía no estás en zona segura: practica por tema los componentes con menor porcentaje.'}</p>
  <p class="aviso">Referencia: en los procesos Distrito Capital 7, Territorial 14 y CAR, la prueba de competencias funcionales es eliminatoria con mínimo de 65 puntos, y la comportamental es clasificatoria. Este porcentaje de aciertos es una guía de preparación; la CNSC calcula su puntaje con su propia escala, comparando con los demás aspirantes al mismo empleo.</p>
  <h3>Por componente</h3><table>${g(it => it.caso.comp, k => CFG.componentes[k])}</table>
  <h3>Por dificultad</h3><table>${g(it => it.niv, k => CFG.niveles[k])}</table>
  <div class="row" style="margin-top:14px"><button class="btn" id="solo">Ver solo mis errores</button><button class="btn sec" id="todas">Ver todas</button><button class="btn sec" id="otra">Reiniciar el simulacro</button></div></div><div id="rev"></div>`;
  const rev = errs => { const l = errs ? ITEMS.filter(it => ST.r[it.id] !== keyOf(it)) : ITEMS; $('#rev').innerHTML = renderList(l, 'review'); };
  rev(true);
  $('#solo').onclick = () => rev(true); $('#todas').onclick = () => rev(false);
  $('#otra').onclick = () => { ST = {r:{}}; save(); inicio(); window.scrollTo(0,0); };
}

document.addEventListener('click', e => {
  const b = e.target.closest('button.op'); if (!b || b.disabled) return;
  ST.r[b.dataset.id] = b.dataset.l; save();
  const it = ITEMS.find(i => i.id === b.dataset.id);
  const n = b.closest('.item').querySelector('.n').textContent.replace('.','');
  b.closest('.item').outerHTML = itemHTML(it, n, CFG.modo === 'practica' ? 'practica' : 'examen');
  if (CFG.modo === 'practica') { const resp = LIST.filter(i => ST.r[i.id]); const ok = resp.filter(i => ST.r[i.id]===keyOf(i)).length; $('#prog').textContent = `${ok}/${resp.length} aciertos`; $('#pst').textContent = `${LIST.length} preguntas · respondidas ${resp.length} · aciertos ${ok} (${Math.round(100*ok/resp.length)} %)`; }
  else progreso();
});

if (CFG.modo === 'practica') practica();
else if (ST.fin) resultados();
else if (ST.t0) examen();
else inicio();
</script>
</body>
</html>
