 por medios electrónicos la decisión", "f": "Ley 1437 de 2011, art. 56 (modificado por el art. 10 de la Ley 2080 de 2021) y art. 67, num. 1", "o": [["A", "a ambos usuarios, porque presentaron sus solicitudes por la sede electrónica.", "Usar la sede electrónica para radicar no equivale a aceptar la notificación electrónica. El artículo 56 del CPACA exige que el administrado haya aceptado ese medio.", false], ["B", "solo a quien sea persona jurídica inscrita en el registro mercantil.", "La inscripción en el registro mercantil obliga a informar la dirección electrónica (art. 16 del CPACA), pero no reemplaza la aceptación de la notificación electrónica que exige el artículo 56.", false], ["C", "a la empresa avícola, que aceptó ese medio de notificación.", "El artículo 56 del CPACA, modificado por la Ley 2080 de 2021, permite notificar por medios electrónicos siempre que el administrado haya aceptado ese medio. Solo la empresa avícola lo aceptó.", true]]}, {"id": "AP-135", "niv": 2, "e": "La notificación electrónica a la empresa avícola se entiende surtida", "f": "Ley 1437 de 2011, art. 56 (modificado por el art. 10 de la Ley 2080 de 2021)", "o": [["A", "a partir de la fecha y hora en que el administrado acceda a ella, hecho que debe certificar la corporación.", "El artículo 56 del CPACA, modificado por la Ley 2080 de 2021, dispone que la notificación electrónica queda surtida a partir de la fecha y hora en que el administrado accede a ella, hecho que debe certificar la administración.", true], ["B", "cinco días después del envío, si en ese lapso la empresa no manifiesta haberlo recibido.", "La ley no prevé un plazo de cinco días ni presume la notificación por falta de respuesta. El momento relevante es el acceso al acto, certificado por la autoridad.", false], ["C", "al finalizar el día siguiente al envío del mensaje de datos a la dirección registrada.", "Esa regla es propia de la notificación por aviso (art. 69 del CPACA). Para la notificación electrónica, la ley atiende al momento en que el administrado accede al acto.", false]]}, {"id": "AP-136", "niv": 3, "e": "Frente a la solicitud de la empresa avícola de recibir las siguientes notificaciones por correo físico, la corporación debe", "f": "Ley 1437 de 2011, arts. 53A y 56 (adicionado y modificado por los arts. 8 y 10 de la Ley 2080 de 2021)", "o": [["A", "atenderla y notificar por los demás medios del CPACA, porque ningún precepto hace obligatorio el medio electrónico en ese trámite.", "El inciso 2 del artículo 56 del CPACA permite al interesado pedir, durante la actuación, que las notificaciones sucesivas no sean electrónicas, salvo que el uso de medios electrónicos sea obligatorio según el artículo 53A. El caso aclara que no lo es.", true], ["B", "negarla, porque la aceptación de la notificación electrónica es irrevocable mientras dure la relación con la entidad.", "La ley no hace irrevocable la aceptación: permite al interesado pedir que las notificaciones sucesivas se hagan por otros medios.", false], ["C", "exigirle que interponga reposición contra el auto que ordenó notificar electrónicamente, para poder cambiar el medio.", "Cambiar el medio de notificación es una solicitud que la ley permite hacer durante la actuación, sin necesidad de recurso alguno.", false]]}]}, {"comp": "atencion_procedimiento", "rol": "profesional", "tag": "Atención al ciudadano y procedimiento administrativo · Nivel profesional · Actuación administrativa", "texto": "Usted es profesional universitario de la Secretaría de Gobierno de un municipio de segunda categoría, que tramita la solicitud de un comerciante para ocupar temporalmente un tramo de la plaza principal con una feria artesanal durante diciembre. En el expediente se incorporaron informes técnicos de las secretarías de Planeación y de Movilidad. Los propietarios de los locales vecinos, cuyos accesos podrían quedar bloqueados, pidieron ser reconocidos como terceros. Además, la secretaría expidió un auto que ordena una visita al sitio, y el comerciante quiere recurrirlo.", "items": [{"id": "AP-169", "niv": 2, "e": "Respecto de los informes técnicos incorporados al expediente, el comerciante", "f": "Ley 1437 de 2011, art. 40", "o": [["A", "no puede controvertirlos, porque fueron elaborados de oficio por otras dependencias de la alcaldía.", "Que las pruebas se decreten o practiquen de oficio no impide controvertirlas: el artículo 40 cubre las pruebas aportadas o practicadas dentro de la actuación.", false], ["B", "tiene la oportunidad de controvertirlos antes de que se dicte la decisión de fondo.", "El artículo 40 del CPACA establece que el interesado contará con la oportunidad de controvertir las pruebas aportadas o practicadas dentro de la actuación antes de que se dicte una decisión de fondo.", true], ["C", "solo puede controvertirlos mediante recurso de reposición, una vez se expida la decisión de fondo.", "La ley garantiza la controversia de las pruebas durante la actuación, antes de la decisión, sin perjuicio de los recursos posteriores.", false]]}, {"id": "AP-170", "niv": 2, "e": "La solicitud de los propietarios vecinos para intervenir como terceros debe", "f": "Ley 1437 de 2011, art. 38", "o": [["A", "tramitarse como un derecho de petición independiente, con término de quince días y recurso de reposición.", "El artículo 38 del CPACA regula expresamente la intervención de terceros: se resuelve de plano y sin recurso.", false], ["B", "rechazarse, porque en las actuaciones iniciadas en interés particular solo puede intervenir el solicitante.", "El numeral 2 del artículo 38 del CPACA permite la intervención de terceros cuando la actuación en interés particular pueda afectar sus derechos o causarles perjuicios, como ocurre con los vecinos.", false], ["C", "resolverse de plano, y contra esa decisión no procede recurso.", "El artículo 38 del CPACA permite intervenir a los terceros cuyos derechos o situación jurídica puedan resultar afectados por una actuación en interés particular. Su solicitud se resuelve de plano y contra esa decisión no procede recurso alguno.", true]]}, {"id": "AP-171", "niv": 1, "e": "Contra el auto que ordenó la visita al sitio", "f": "Ley 1437 de 2011, art. 75", "o": [["A", "no procede recurso, porque es un acto de trámite y no hay norma expresa que lo permita.", "El artículo 75 del CPACA dispone que no hay recurso contra los actos de carácter general ni contra los de trámite, preparatorios o de ejecución, salvo los casos previstos en norma expresa. Ordenar una visita impulsa la actuación sin decidir de fondo.", true], ["B", "procede reposición, porque toda decisión de la administración puede recurrirse.", "No toda decisión es recurrible: el artículo 75 del CPACA excluye los recursos contra los actos de trámite, salvo norma expresa.", false], ["C", "procede apelación ante el alcalde, por tratarse de una decisión de un secretario de despacho.", "La apelación procede contra actos definitivos (art. 74 del CPACA). El auto que ordena una visita es de trámite.", false]]}]}, {"comp": "atencion_procedimiento", "rol": "general", "tag": "Atención al ciudadano y procedimiento administrativo · Protección de datos personales: autorización", "texto": "La Secretaría de Educación de un municipio certificado administra la base de datos de los beneficiarios de su auxilio de transporte para estudiantes universitarios, todos mayores de edad. La Personería municipal, en ejercicio de sus funciones de vigilancia, pide el listado de beneficiarios con sus nombres, documentos y direcciones. Al mismo tiempo, la secretaría diseña el formulario de inscripción de un nuevo programa voluntario de formación para padres de familia y discute cómo recoger la autorización para el tratamiento de los datos. Además, un beneficiario pide copia de sus propios datos personales que reposan en la base, y un funcionario propone cobrarle.", "items": [{"id": "AP-203", "niv": 3, "e": "Para entregar a la Personería el listado de beneficiarios, la secretaría", "f": "Ley 1581 de 2012, art. 10, lit. a", "o": [["A", "debe obtener previamente la autorización escrita de cada uno de los titulares o sus representantes.", "El literal a del artículo 10 de la Ley 1581 de 2012 exceptúa de la autorización la información requerida por una entidad pública en ejercicio de sus funciones legales.", false], ["B", "solo puede entregarlo si la Personería presenta una orden judicial que lo autorice.", "La orden judicial es una de las causales de excepción, pero no la única: también lo es el requerimiento de una entidad pública en ejercicio de sus funciones legales.", false], ["C", "no requiere la autorización de los titulares, porque una entidad pública la pide en ejercicio de sus funciones legales.", "El literal a del artículo 10 de la Ley 1581 de 2012 dispone que no es necesaria la autorización del titular cuando la información la requiere una entidad pública en ejercicio de sus funciones legales. Quien accede a los datos debe, en todo caso, cumplir la ley.", true]]}, {"id": "AP-204", "niv": 1, "e": "En el nuevo programa voluntario, la autorización para el tratamiento de los datos debe ser", "f": "Ley 1581 de 2012, art. 9", "o": [["A", "otorgada ante notario, para que tenga plena validez frente a terceros.", "La ley no exige formalidad notarial: basta un medio que permita consultarla después.", false], ["B", "previa e informada, y obtenida por cualquier medio que pueda ser objeto de consulta posterior.", "El artículo 9 de la Ley 1581 de 2012 exige que, salvo las excepciones legales, el tratamiento cuente con la autorización previa e informada del titular, obtenida por cualquier medio que pueda ser objeto de consulta posterior.", true], ["C", "verbal y sin registro, porque los padres se inscriben voluntariamente.", "La autorización debe obtenerse por un medio que pueda ser objeto de consulta posterior; una autorización verbal sin registro no lo permite.", false]]}, {"id": "AP-205", "niv": 1, "e": "Frente a la propuesta de cobrar al beneficiario por conocer sus propios datos, lo correcto es señalar que", "f": "Ley 1581 de 2012, art. 8, lit. f", "o": [["A", "puede cobrarse una tarifa fijada por la secretaría, porque la consulta implica trabajo adicional del personal.", "La ley garantiza el acceso gratuito del titular a sus propios datos.", false], ["B", "el titular tiene derecho a acceder en forma gratuita a sus datos personales que han sido objeto de tratamiento.", "El literal f del artículo 8 de la Ley 1581 de 2012 reconoce al titular el derecho a acceder en forma gratuita a sus datos personales que hayan sido objeto de tratamiento.", true], ["C", "puede cobrarse si la consulta se hace más de una vez en el mismo año.", "La Ley 1581 de 2012 no limita la gratuidad del acceso del titular a sus propios datos según el número de consultas.", false]]}]}, {"comp": "gestion_publica", "rol": "profesional", "tag": "Gestión pública, MIPG, contratación y documentos · Nivel profesional · MIPG: ámbito de aplicación y políticas", "texto": "Usted es profesional especializado de la Oficina Asesora de Planeación de un instituto distrital de Bogotá. Prepara una presentación para la junta directiva sobre el Modelo Integrado de Planeación y Gestión (MIPG). Debe explicar qué entidades lo adoptan, incluida una sociedad de economía mixta del sector en la que el Distrito y sus entidades tienen el 92 % del capital social, y cómo se organizan las políticas de gestión y desempeño. En la sesión, un directivo afirma que el modelo «es para entidades nacionales» y que la gestión documental «no hace parte de MIPG, porque la regula el Archivo General de la Nación».", "items": [{"id": "GP-107", "niv": 1, "e": "Frente a la afirmación de que el modelo es para entidades nacionales, usted explica que el MIPG", "f": "Decreto 1083 de 2015, arts. 2.2.22.3.4 y 2.2.22.3.7", "o": [["A", "lo adoptan los organismos y entidades de la Rama Ejecutiva de los órdenes nacional y territorial.", "El artículo 2.2.22.3.4 del Decreto 1083 de 2015 señala que el modelo se adopta por los organismos y entidades de la Rama Ejecutiva tanto del orden nacional como del territorial, lo que incluye a un instituto distrital.", true], ["B", "es obligatorio solo para ministerios y departamentos administrativos, y voluntario para las entidades distritales.", "El ámbito de aplicación no se limita al sector central nacional; incluye a las entidades territoriales de la Rama Ejecutiva. La adopción voluntaria se prevé para otras ramas y órganos autónomos, no para un instituto distrital.", false], ["C", "aplica en lo territorial solo a gobernaciones y alcaldías, no a sus entidades descentralizadas.", "El decreto no excluye a las entidades descentralizadas territoriales; por el contrario, los comités territoriales de gestión y desempeño incluyen a sus gerentes o directores.", false]]}, {"id": "GP-108", "niv": 2, "e": "Respecto de la sociedad de economía mixta en la que el Distrito tiene el 92 % del capital, usted indica que", "f": "Decreto 1083 de 2015, art. 2.2.22.3.4", "o": [["A", "le aplica solo la política de control interno, porque el modelo completo exige capital totalmente público.", "La regla de aplicar solo la política de control interno se refiere a ramas, órganos autónomos y entidades de régimen especial; para las mixtas el criterio es el porcentaje de capital estatal.", false], ["B", "no le aplica el modelo, porque cualquier participación de capital privado la excluye.", "La norma no excluye a toda entidad con capital privado: fija un umbral de participación estatal a partir del cual el modelo sí aplica.", false], ["C", "le aplica el modelo, porque el Estado posee el 90 % o más de su capital social.", "El artículo 2.2.22.3.4 del Decreto 1083 de 2015 dispone que, en las entidades descentralizadas con capital público y privado, el modelo aplica cuando el Estado tiene el 90 % o más del capital social; aquí la participación es del 92 %.", true]]}, {"id": "GP-109", "niv": 2, "e": "En cuanto a la afirmación sobre la gestión documental, lo correcto es señalar que", "f": "Decreto 1083 de 2015, art. 2.2.22.2.1 y parágrafo", "o": [["A", "es una de las políticas de gestión y desempeño del modelo, que se rige por sus propias normas.", "El artículo 2.2.22.2.1 del Decreto 1083 de 2015 incluye la gestión documental entre las políticas de gestión y desempeño institucional y su parágrafo precisa que cada política se rige por las normas que la regulan, en este caso las de archivos.", true], ["B", "no hace parte del modelo, pues las políticas de MIPG se limitan a las que lidera Función Pública.", "Las políticas de gestión y desempeño son formuladas por Función Pública y por los demás líderes de política; el Archivo General de la Nación, por ejemplo, integra el Consejo para la Gestión y el Desempeño Institucional.", false], ["C", "se integra al modelo únicamente si el instituto decide certificarse bajo una norma técnica de calidad.", "La certificación de calidad es voluntaria según el artículo 2.2.22.3.12 del Decreto 1083 de 2015 y no condiciona que la gestión documental sea una política del modelo.", false]]}]}, {"comp": "gestion_publica", "rol": "profesional", "tag": "Gestión pública, MIPG, contratación y documentos · Nivel profesional · Plan de desarrollo territorial: elaboración", "texto": "Usted es profesional universitario de la Secretaría de Planeación de un municipio de sexta categoría de Boyacá. El alcalde se posesionó el 1 de enero de 2028 y le encargó coordinar el proyecto de plan de desarrollo 2028-2031. El cronograma que heredó del equipo de empalme propone presentar el documento consolidado al Consejo Territorial de Planeación (CTP) el 30 de abril, enviar copia al concejo municipal solo cuando el CTP entregue su concepto y radicar el proyecto de acuerdo en el concejo en mayo. El presidente del CTP ya anunció que su consejo se tomará «todo el tiempo que sea necesario» para estudiar el documento.", "items": [{"id": "GP-125", "niv": 2, "e": "Frente al cronograma, usted advierte que el documento consolidado debe presentarse al CTP", "f": "Ley 152 de 1994, arts. 39 (num. 5) y 40", "o": [["A", "a más tardar dentro de los cuatro meses siguientes a la posesión del alcalde.", "Los cuatro primeros meses del período son el plazo para someter el plan a la corporación de elección popular (art. 40), no para presentarlo al consejo territorial de planeación.", false], ["B", "a más tardar dentro de los dos meses siguientes a la posesión del alcalde.", "El numeral 5 del artículo 39 de la Ley 152 de 1994 ordena presentar el proyecto consolidado a los consejos territoriales de planeación a más tardar dentro de los dos meses siguientes a la posesión; el 30 de abril excede ese plazo.", true], ["C", "en cualquier fecha, siempre que el proyecto llegue al concejo antes del 30 de junio.", "La Ley 152 de 1994 fija plazos concretos para cada etapa; no deja a discreción la presentación al consejo territorial de planeación.", false]]}, {"id": "GP-126", "niv": 2, "e": "En cuanto a la copia del proyecto para el concejo municipal, lo procedente es enviarla", "f": "Ley 152 de 1994, art. 39, num. 5", "o": [["A", "solo con la radicación formal del proyecto de acuerdo en el concejo.", "La radicación del proyecto de acuerdo es una etapa posterior (art. 40); la ley exige que el concejo reciba copia desde que el documento consolidado se presenta al consejo territorial.", false], ["B", "cuando el CTP entregue su concepto, como propone el cronograma.", "Esperar el concepto del consejo territorial desconoce que la ley exige enviar la copia a la corporación en la misma oportunidad en que se presenta el documento a dicho consejo.", false], ["C", "en la misma oportunidad en que el documento se presenta al CTP.", "El inciso segundo del numeral 5 del artículo 39 de la Ley 152 de 1994 dispone que, al presentar el proyecto al consejo territorial de planeación, la máxima autoridad administrativa envíe en la misma oportunidad copia a la corporación de elección popular.", true]]}, {"id": "GP-127", "niv": 3, "e": "Si el CTP no se pronuncia dentro del mes siguiente a la presentación del documento consolidado, la consecuencia es que", "f": "Ley 152 de 1994, art. 39, num. 6", "o": [["A", "el concejo debe integrar un nuevo consejo territorial para que emita el concepto.", "La Ley 152 de 1994 no prevé la integración de un nuevo consejo por falta de pronunciamiento; la consecuencia es que el requisito se entiende surtido.", false], ["B", "se considera surtido el requisito de su concepto y el trámite continúa.", "El numeral 6 del artículo 39 de la Ley 152 de 1994 da al consejo territorial un mes desde la presentación del documento; si en ese lapso no se reúne o no se pronuncia, se considera surtido el requisito en esa fecha.", true], ["C", "el alcalde debe esperar el concepto, porque sin él el concejo no puede aprobar el plan.", "La ley no permite que el silencio del consejo territorial bloquee el trámite: vencido el mes, el requisito se tiene por cumplido.", false]]}]}, {"comp": "gestion_publica", "rol": "profesional", "tag": "Gestión pública, MIPG, contratación y documentos · Nivel profesional · Contratación: interventoría de obra y concurso de méritos", "texto": "Usted es profesional especializado de la Secretaría de Infraestructura de una gobernación. El departamento adjudicó por licitación pública la pavimentación de 12 kilómetros de una vía secundaria. Para la vigilancia del contrato, el secretario propone que un ingeniero de planta haga todo el seguimiento técnico y, si finalmente se contrata una firma, que se escoja por el menor precio ofrecido. Un asesor sugiere además que el interventor imparta sus instrucciones al contratista por teléfono «para agilizar la obra».", "items": [{"id": "GP-151", "niv": 2, "e": "Frente a la propuesta de que un ingeniero de planta haga todo el seguimiento técnico, usted advierte que", "f": "Ley 80 de 1993, art. 32, num. 1 (inciso vigente; la expresión «concurso» fue derogada por el art. 32 de la Ley 1150 de 2007)", "o": [["A", "debe contratarse una interventoría con una persona independiente de la entidad y del contratista.", "El numeral 1 del artículo 32 de la Ley 80 de 1993 dispone que en los contratos de obra celebrados como resultado de una licitación la interventoría se contrate con una persona independiente de la entidad contratante y del contratista. Ese inciso está vigente; la Ley 1150 de 2007 (art. 32) solo derogó la expresión «concurso».", true], ["B", "es viable si el ingeniero tiene posgrado en vías y la Oficina de Control Interno lo autoriza.", "La formación del ingeniero no cambia la exigencia legal, y la oficina de control interno no autoriza actuaciones de la gestión contractual.", false], ["C", "es viable, porque la supervisión por personal de planta reemplaza la interventoría en cualquier contrato de obra.", "La ley no permite sustituir la interventoría por supervisión en los contratos de obra adjudicados por licitación: en ellos la interventoría debe contratarse con un tercero independiente.", false]]}, {"id": "GP-152", "niv": 3, "e": "Sobre la idea de escoger a la firma interventora por el menor precio ofrecido, usted responde que", "f": "Ley 1150 de 2007, art. 5, num. 4; Ley 80 de 1993, art. 32, num. 2", "o": [["A", "procede, porque el menor precio es el único factor de evaluación en los procesos de selección del Estado.", "El menor precio como único factor se aplica a bienes y servicios de características técnicas uniformes; no es una regla general y está prohibido para seleccionar consultores.", false], ["B", "procede, siempre que el valor de la interventoría no supere la menor cuantía del departamento.", "La prohibición de usar el precio como factor de escogencia de consultores no depende de la cuantía del contrato.", false], ["C", "no procede, porque la interventoría es consultoría y para escoger consultores el precio no puede ser factor de escogencia.", "La interventoría es un contrato de consultoría (Ley 80 de 1993, art. 32, num. 2) y el numeral 4 del artículo 5 de la Ley 1150 de 2007 prohíbe incluir el precio como factor de escogencia en la selección de consultores.", true]]}, {"id": "GP-153", "niv": 1, "e": "En cuanto a las instrucciones del interventor al contratista, la Ley 80 de 1993 exige que", "f": "Ley 80 de 1993, art. 32, num. 2", "o": [["A", "sus órdenes se impartan verbalmente en la obra y se ratifiquen en el acta de liquidación.", "La ley prohíbe expresamente las órdenes verbales del interventor; ratificarlas al liquidar no subsana esa exigencia.", false], ["B", "cada instrucción sea aprobada previamente por el ordenador del gasto.", "La ley no somete cada instrucción del interventor a aprobación del ordenador del gasto; lo que exige es que conste por escrito y se ajuste al contrato.", false], ["C", "sus órdenes o sugerencias consten por escrito y se enmarquen en el contrato.", "El numeral 2 del artículo 32 de la Ley 80 de 1993 prohíbe que las órdenes del interventor de una obra se den verbalmente y le obliga a entregarlas por escrito, dentro de los términos del contrato.", true]]}]}, {"comp": "gestion_publica", "rol": "profesional", "tag": "Gestión pública, MIPG, contratación y documentos · Nivel profesional · Programa de Transparencia y Ética Pública (antes PAAC)", "texto": "Usted es profesional universitario de la Oficina de Planeación de una gobernación de la región Pacífica. En enero, el secretario de Planeación le pide «actualizar el Plan Anticorrupción y de Atención al Ciudadano con los mismos componentes de siempre». Usted recuerda que la Ley 2195 de 2022 modificó el artículo 73 de la Ley 1474 de 2011 y que el Decreto 1122 de 2024 reglamentó la materia. El secretario pregunta qué cambió, qué debe contener el nuevo instrumento y dónde debe publicarse.", "items": [{"id": "GP-182", "niv": 2, "e": "Usted le explica que hoy la obligación legal de la gobernación consiste en", "f": "Ley 1474 de 2011, art. 73 (modificado por el art. 31 de la Ley 2195 de 2022); Decreto 1081 de 2015, art. 2.1.4.4.1.5 (adicionado por el Decreto 1122 de 2024)", "o": [["A", "seguir elaborando el Plan Anticorrupción y de Atención al Ciudadano, porque la Ley 2195 de 2022 solo cobija a entidades nacionales.", "La norma modificada se dirige expresamente a las entidades del orden nacional, departamental y municipal, cualquiera que sea su régimen de contratación.", false], ["B", "implementar un Programa de Transparencia y Ética Pública, y las menciones al plan anticorrupción se entienden referidas a ese programa.", "El artículo 73 de la Ley 1474 de 2011, modificado por el artículo 31 de la Ley 2195 de 2022, obliga a las entidades nacionales, departamentales y municipales a implementar Programas de Transparencia y Ética Pública, y el Decreto 1122 de 2024 dispone que toda mención al Plan Anticorrupción y de Atención al Ciudadano se entiende referida a ese programa.", true], ["C", "adoptar un programa de ética empresarial, que reemplaza al plan anticorrupción en todas las entidades.", "Los programas de transparencia y ética empresarial son exigibles a ciertas personas jurídicas vigiladas (art. 34-7 de la Ley 1474 de 2011); para las entidades públicas la ley prevé los programas de transparencia y ética pública.", false]]}, {"id": "GP-183", "niv": 1, "e": "Entre los elementos que, según la ley, debe contemplar el nuevo instrumento se encuentra", "f": "Ley 1474 de 2011, art. 73, lit. d (modificado por el art. 31 de la Ley 2195 de 2022)", "o": [["A", "el establecimiento de canales para que se denuncien posibles hechos de corrupción.", "El literal d del artículo 73 de la Ley 1474 de 2011, modificado por la Ley 2195 de 2022, incluye los canales de denuncia entre los contenidos del Programa de Transparencia y Ética Pública, junto con la debida diligencia, la gestión de riesgos y las estrategias de Estado abierto.", true], ["B", "el plan de ordenamiento territorial del departamento.", "El ordenamiento territorial es un instrumento de planeación física, ajeno a los contenidos del programa de transparencia.", false], ["C", "el manual específico de funciones y competencias laborales.", "El manual de funciones es un instrumento de administración de personal; no figura entre los contenidos del programa en el artículo 73 de la Ley 1474 de 2011.", false]]}, {"id": "GP-184", "niv": 2, "e": "Respecto de la publicación, la gobernación debe", "f": "Decreto 1081 de 2015, art. 2.1.4.4.1.4 (adicionado por el Decreto 1122 de 2024)", "o": [["A", "publicar el programa en su sede electrónica, según la ley de transparencia y acceso a la información.", "El artículo 2.1.4.4.1.4 del Decreto 1081 de 2015, adicionado por el Decreto 1122 de 2024, obliga a publicar el programa en la sede electrónica, en los términos del artículo 9 de la Ley 1712 de 2014.", true], ["B", "remitir el programa a la Procuraduría General de la Nación para que lo apruebe antes de publicarlo en cualquier medio.", "La norma no somete el programa a aprobación previa de la Procuraduría; ordena publicarlo en la sede electrónica de la entidad.", false], ["C", "publicarlo únicamente en la cartelera física, porque contiene información sobre riesgos.", "El deber de publicidad es electrónico, conforme a la ley de transparencia; la cartelera física no lo satisface.", false]]}]}, {"comp": "gestion_publica", "rol": "general", "tag": "Gestión pública, MIPG, contratación y documentos · Transparencia: riesgo de corrupción y atención de quejas", "texto": "Usted trabaja en la Secretaría de Gobierno de un municipio de quinta categoría y participa en la mesa que formula el Programa de Transparencia y Ética Pública de la alcaldía. Un integrante opina que el programa solo debe enumerar actividades de capacitación en valores. Otro pregunta cuánto tiempo tiene la alcaldía para incorporar las modificaciones del anexo técnico que expida la Secretaría de Transparencia de la Presidencia. Un tercero propone suprimir la dependencia que tramita quejas, sugerencias y reclamos «para ahorrar costos».", "items": [{"id": "GP-185", "niv": 1, "e": "Frente a la primera opinión, usted aclara que la finalidad del programa incluye", "f": "Ley 1474 de 2011, art. 73 (modificado por el art. 31 de la Ley 2195 de 2022)", "o": [["A", "capacitar exclusivamente a los directivos en el código de integridad.", "La capacitación puede ser una acción, pero la finalidad legal es más amplia y comprende la gestión del riesgo de corrupción en toda la entidad.", false], ["B", "reemplazar el régimen disciplinario con compromisos éticos firmados por los servidores.", "El programa es preventivo y no sustituye el régimen disciplinario, que sigue regulado por el Código General Disciplinario.", false], ["C", "promover la cultura de la legalidad y gestionar de forma permanente el riesgo de corrupción en la misión de la entidad.", "El artículo 73 de la Ley 1474 de 2011, modificado por la Ley 2195 de 2022, señala como fin del programa promover la cultura de la legalidad y gestionar (identificar, medir, controlar y monitorear) el riesgo de corrupción en la misionalidad de la entidad.", true]]}, {"id": "GP-186", "niv": 3, "e": "Sobre el plazo para incorporar las modificaciones del anexo técnico, las entidades territoriales cuentan con", "f": "Ley 1474 de 2011, art. 73, parágrafo 2; Decreto 1081 de 2015, art. 2.1.4.4.1.2 (adicionado por el Decreto 1122 de 2024)", "o": [["A", "hasta seis meses.", "La norma no fija seis meses; establece un año para las entidades nacionales y dos para las territoriales.", false], ["B", "hasta un año.", "Un año es el plazo para las entidades del orden nacional; las territoriales tienen un plazo mayor.", false], ["C", "hasta dos años.", "El Decreto 1122 de 2024 dispone que las modificaciones del anexo técnico se aplican en los plazos del parágrafo 2 del artículo 73 de la Ley 1474 de 2011: hasta un año para las entidades nacionales y hasta dos años para las territoriales.", true]]}, {"id": "GP-187", "niv": 2, "e": "La propuesta de suprimir la dependencia de quejas, sugerencias y reclamos", "f": "Ley 1474 de 2011, art. 76", "o": [["A", "procede, porque esa función puede trasladarse a la personería municipal como órgano de control.", "La personería es un órgano de control con funciones propias; la ley exige que la dependencia exista dentro de la entidad pública.", false], ["B", "no procede, porque la ley exige que cada entidad pública cuente con una dependencia para atender esos casos.", "El artículo 76 de la Ley 1474 de 2011 exige que en toda entidad pública exista por lo menos una dependencia encargada de recibir, tramitar y resolver las quejas, sugerencias y reclamos de los ciudadanos.", true], ["C", "procede si la alcaldía habilita en su página web un correo electrónico exclusivo para recibir quejas.", "Un correo electrónico es un canal, no una dependencia encargada de tramitar y resolver; no cumple el mandato legal.", false]]}]}, {"comp": "entidades_territoriales", "rol": "profesional", "tag": "Entidades territoriales, Bogotá D.C. y CAR · Nivel profesional · Objeciones a proyectos de acuerdo", "texto": "Usted es profesional de la Oficina Jurídica de la alcaldía de un municipio de segunda categoría de Antioquia. El Concejo aprobó en segundo debate un proyecto de acuerdo de 35 artículos que regula el uso de parques y escenarios deportivos. El alcalde considera que algunas disposiciones son inconvenientes por su costo y que otras desconocen la ley, y le pide orientación sobre el trámite de objeciones. Se sabe que el proyecto fue recibido en el despacho del alcalde el mismo día en que el Concejo lo remitió.", "items": [{"id": "ET-107", "niv": 2, "e": "Para devolver el proyecto con objeciones, el alcalde dispone de un término de", "f": "Ley 136 de 1994, art. 78", "o": [["A", "cinco días.", "Ese término aplica a proyectos de no más de veinte artículos (art. 78 de la Ley 136 de 1994). Este tiene 35.", false], ["B", "diez días.", "El art. 78 de la Ley 136 de 1994 otorga diez días cuando el proyecto tiene entre veintiuno y cincuenta artículos, como este de 35.", true], ["C", "veinte días.", "Hasta veinte días se conceden solo cuando el proyecto excede cincuenta artículos (art. 78 de la Ley 136 de 1994).", false]]}, {"id": "ET-108", "niv": 3, "e": "Si la plenaria del Concejo rechaza las objeciones por inconveniencia, lo que procede es que", "f": "Ley 136 de 1994, art. 79 (subrogado por el art. 4 de la Ley 177 de 1994)", "o": [["A", "el alcalde lo sancione en un término no mayor de ocho días y, si no lo hace, lo sancione y publique el presidente del Concejo.", "El art. 79 de la Ley 136 de 1994 (subrogado por el art. 4 de la Ley 177 de 1994) obliga al alcalde a sancionar en máximo ocho días cuando se rechazan las objeciones por inconveniencia; si no lo hace, sanciona y publica el presidente de la corporación.", true], ["B", "el alcalde envíe el proyecto al Tribunal Administrativo para que decida sobre su conveniencia.", "El Tribunal solo conoce de las objeciones de derecho (art. 80 de la Ley 136 de 1994); la conveniencia la define el Concejo.", false], ["C", "el alcalde pueda formular nuevas objeciones por inconveniencia sobre los mismos artículos, por una sola vez.", "La ley no permite reiterar objeciones por inconveniencia ya rechazadas; impone el deber de sancionar.", false]]}, {"id": "ET-109", "niv": 3, "e": "Si el Concejo no acoge las objeciones por ilegalidad, el alcalde debe", "f": "Ley 136 de 1994, art. 80", "o": [["A", "sancionarlo y luego demandarlo en acción de nulidad ante el juez administrativo.", "La ley prevé un trámite específico previo a la sanción: el envío al Tribunal Administrativo, que decide si las objeciones son fundadas.", false], ["B", "enviarlo, dentro de los diez días siguientes, al Tribunal Administrativo con una exposición de motivos de las objeciones.", "El art. 80 de la Ley 136 de 1994 dispone que, si las objeciones jurídicas no son acogidas, el alcalde envía el proyecto al Tribunal Administrativo dentro de los diez días siguientes, con exposición de motivos.", true], ["C", "remitir el proyecto al gobernador, quien decidirá si lo envía al Tribunal Administrativo.", "La revisión del gobernador opera sobre acuerdos ya sancionados (art. 82 de la Ley 136 de 1994); las objeciones de derecho no acogidas van directamente al Tribunal.", false]]}]}, {"comp": "entidades_territoriales", "rol": "general", "tag": "Entidades territoriales, Bogotá D.C. y CAR · Asamblea departamental", "texto": "Usted es profesional universitario de la Secretaría General de la Asamblea de un departamento del Caribe colombiano. Corre el tercer año del periodo constitucional. En agosto, el gobernador necesita que la Asamblea apruebe con urgencia una autorización para comprometer vigencias futuras de un proyecto vial, y algunos diputados preguntan si en esas sesiones podrán también citar al secretario de Salud por la crisis hospitalaria. Además, la mesa directiva le pide aclarar quién debe aprobar el presupuesto departamental de la próxima vigencia.", "items": [{"id": "ET-123", "niv": 1, "e": "Sobre los periodos de sesiones ordinarias de la Asamblea en ese tercer año, usted informa que van", "f": "Ley 2200 de 2022, art. 23", "o": [["A", "de febrero, mayo, agosto y noviembre, por derecho propio y máximo una vez por día.", "Ese calendario corresponde a los concejos de municipios de tercera a sexta categoría (art. 23 de la Ley 136 de 1994), no a las asambleas departamentales.", false], ["B", "del 1 de enero al último día de febrero, del 1 de junio al 30 de julio y del 1 de octubre al 30 de noviembre.", "El periodo de enero a febrero corresponde solo al primer año de sesiones; del segundo al cuarto año el primer periodo va del 1 de marzo al 30 de abril (art. 23 de la Ley 2200 de 2022).", false], ["C", "del 1 de marzo al 30 de abril, del 1 de junio al 30 de julio y del 1 de octubre al 30 de noviembre.", "El art. 23 de la Ley 2200 de 2022 fija, para el segundo, tercer y cuarto año, los periodos de 1 de marzo a 30 de abril, 1 de junio a 30 de julio y 1 de octubre a 30 de noviembre.", true]]}, {"id": "ET-124", "niv": 2, "e": "Si el gobernador convoca a sesiones extraordinarias en agosto para tramitar la autorización de vigencias futuras, los diputados", "f": "Ley 2200 de 2022, art. 23", "o": [["A", "podrán ocuparse de los asuntos que el gobernador someta y, además, ejercer el control político propio de la corporación.", "El art. 23 de la Ley 2200 de 2022 limita las extraordinarias a los asuntos que el gobernador somete, pero deja a salvo la función de control político y los temas administrativos de la corporación.", true], ["B", "podrán tramitar cualquier proyecto de ordenanza, porque las extraordinarias amplían la agenda ordinaria.", "En las extraordinarias la asamblea solo puede ocuparse de los asuntos que el gobernador somete (además del control político y temas administrativos propios).", false], ["C", "solo podrán ocuparse de la autorización de vigencias futuras, sin adelantar debates de control político.", "La Ley 2200 de 2022 dejó expresamente a salvo el control político durante las sesiones extraordinarias.", false]]}, {"id": "ET-125", "niv": 1, "e": "En relación con el presupuesto departamental de la próxima vigencia, usted aclara que", "f": "Ley 2200 de 2022, art. 19, num. 32", "o": [["A", "lo expide la Asamblea departamental con base en el proyecto que le presente el gobernador.", "El art. 19, numeral 32 de la Ley 2200 de 2022 asigna a la Asamblea expedir anualmente el presupuesto de rentas y gastos, con base en el proyecto presentado por el gobernador.", true], ["B", "lo expide el gobernador por decreto, y la Asamblea solo puede improbarlo dentro del mes siguiente.", "La expedición anual del presupuesto es función de la Asamblea; el gobernador presenta el proyecto (art. 19, num. 32 de la Ley 2200 de 2022).", false], ["C", "lo aprueba el Consejo Departamental de Política Fiscal, previo concepto de la Asamblea.", "Ningún consejo de política fiscal sustituye a la Asamblea en la expedición del presupuesto.", false]]}]}, {"comp": "entidades_territoriales", "rol": "profesional", "tag": "Entidades territoriales, Bogotá D.C. y CAR · Nivel profesional · Concejo de Bogotá y alcalde mayor", "texto": "Usted es profesional de la Secretaría Jurídica Distrital de Bogotá. Un grupo de concejales radicó un proyecto de acuerdo que modifica la estructura general de la administración central y crea una nueva secretaría. Paralelamente, el Concejo aprobó una proposición para citar a la secretaria de Movilidad a un debate de control político, y el alcalde mayor estudia delegar en los alcaldes locales algunas funciones de control de espacio público.", "items": [{"id": "ET-132", "niv": 3, "e": "Sobre el proyecto de los concejales que modifica la estructura de la administración central, usted conceptúa que", "f": "Decreto Ley 1421 de 1993, arts. 12, num. 8, 13 y 55", "o": [["A", "es válido si lo firman al menos la tercera parte de los concejales, por tratarse de una reforma administrativa.", "No existe un umbral de firmas que supla la iniciativa del alcalde; se trata de una reserva de iniciativa.", false], ["B", "es válido, porque el Concejo es la suprema autoridad del Distrito y puede tramitar por iniciativa propia cualquier proyecto de acuerdo, sin restricción alguna.", "Aunque el Concejo es la suprema autoridad del Distrito (art. 8), el art. 13 del Decreto Ley 1421 de 1993 reserva al alcalde la iniciativa en estas materias.", false], ["C", "tiene un vicio de iniciativa, porque los acuerdos sobre la estructura de la administración solo pueden dictarse a iniciativa del alcalde.", "El art. 13 del Decreto Ley 1421 de 1993 dispone que los acuerdos del ordinal 8 del art. 12 (estructura de la administración central) solo pueden dictarse o reformarse a iniciativa del alcalde; el art. 55 reitera que la creación de secretarías es a iniciativa del alcalde mayor.", true]]}, {"id": "ET-133", "niv": 1, "e": "Para la citación de la secretaria de Movilidad, la mesa directiva debe", "f": "Decreto Ley 1421 de 1993, art. 14", "o": [["A", "enviarla a la Personería Distrital, que es la que convoca a los secretarios a rendir cuentas.", "El control político corresponde al Concejo, que cita directamente a los secretarios (art. 14 del Decreto Ley 1421 de 1993).", false], ["B", "hacerla con una anticipación no menor de cinco días hábiles y en cuestionario escrito.", "El art. 14 del Decreto Ley 1421 de 1993 exige que las citaciones de control político se hagan con anticipación no menor de cinco días hábiles y se formulen en cuestionario escrito.", true], ["C", "hacerla con una anticipación no menor de diez días hábiles, previa autorización del alcalde mayor.", "El término es de cinco días hábiles y la citación no requiere autorización del alcalde mayor.", false]]}, {"id": "ET-134", "niv": 2, "e": "Sobre la delegación de funciones en los alcaldes locales, usted conceptúa que el alcalde mayor", "f": "Decreto Ley 1421 de 1993, art. 40", "o": [["A", "no puede hacerlo, porque las funciones de los alcaldes locales solo las asigna el Concejo Distrital.", "El Concejo distribuye competencias (art. 63), pero el alcalde mayor también puede delegar sus funciones en los alcaldes locales (art. 40).", false], ["B", "solo puede delegar en secretarios de despacho, que a su vez pueden subdelegar en los alcaldes locales.", "El art. 40 del Decreto Ley 1421 de 1993 permite la delegación directa en los alcaldes locales, sin exigir una subdelegación.", false], ["C", "puede delegar en ellos, directamente, las funciones que le asignan la ley y los acuerdos distritales.", "El art. 40 del Decreto Ley 1421 de 1993 autoriza al alcalde mayor para delegar las funciones que le asignan la ley y los acuerdos en secretarios, jefes de departamento administrativo, gerentes, JAL y alcaldes locales, entre otros.", true]]}]}, {"comp": "entidades_territoriales", "rol": "profesional", "tag": "Entidades territoriales, Bogotá D.C. y CAR · Nivel profesional · Tasas ambientales", "texto": "Usted es profesional universitario del grupo de instrumentos económicos de una corporación autónoma regional del Valle del Cauca. Al revisar la facturación, encuentra un usuario industrial que capta agua de un río sin concesión, y un vecino del sector que solo usa el agua para bañarse y lavar ropa directamente en el cauce. Además, una curtiembre vierte aguas residuales a la misma corriente. El director le pide un concepto sobre el cobro de tasas y el destino de lo recaudado en una cuenca que tiene Plan de Ordenación y Manejo (POMCA) adoptado.", "items": [{"id": "ET-162", "niv": 3, "e": "Respecto del usuario industrial que capta agua del río sin concesión, a la corporación le corresponde", "f": "Decreto 1076 de 2015, art. 2.2.3.2.5.3 (modificado por el art. 2 del Decreto 875 de 2026); Ley 1333 de 2009, arts. 1, 5, 13 y 18 (modificados por la Ley 2387 de 2024)", "o": [["A", "adelantar el procedimiento sancionatorio y, si es necesario, imponer medidas preventivas, porque usar el agua sin concesión es una infracción.", "Usar aguas públicas sin la concesión exigida viola el art. 2.2.3.2.5.3 del Decreto 1076 de 2015, lo que constituye infracción ambiental según el art. 5 de la Ley 1333 de 2009; la corporación, como titular de la potestad sancionatoria (art. 1 de esa ley y art. 31, num. 17 de la Ley 99 de 1993), puede imponer medidas preventivas e iniciar el procedimiento.", true], ["B", "abstenerse de actuar hasta que el usuario presente voluntariamente la solicitud de concesión, pues la ley privilegia la legalización del uso del recurso.", "La autoridad ambiental actúa de oficio frente a las infracciones (arts. 13 y 18 de la Ley 1333 de 2009); no debe esperar a que el infractor solicite la concesión.", false], ["C", "cobrarle la tasa por utilización de aguas y entender que, con el pago, el uso queda legalizado hasta que tramite la concesión.", "El pago de una tasa no reemplaza la concesión: el uso de aguas públicas con derivación requiere concesión de la autoridad ambiental (art. 2.2.3.2.5.3 del Decreto 1076 de 2015), y ningún pago legaliza el uso sin ella.", false]]}, {"id": "ET-163", "niv": 1, "e": "El vertimiento de aguas residuales de la curtiembre a la corriente da lugar al cobro de", "f": "Ley 99 de 1993, art. 42", "o": [["A", "la tasa por utilización de aguas, que es la única que se aplica a la industria.", "La tasa por utilización grava la captación del agua; el vertimiento de residuos genera tasa retributiva.", false], ["B", "la tasa retributiva, por la utilización del agua para arrojar desechos o sustancias nocivas.", "El art. 42 de la Ley 99 de 1993 sujeta al pago de tasas retributivas la utilización directa o indirecta del agua para introducir o arrojar desechos, aguas servidas y sustancias nocivas resultantes de actividades antrópicas.", true], ["C", "la contribución de valorización, por el beneficio que recibe la curtiembre de las obras ejecutadas por la corporación.", "La valorización se causa por la ejecución de obras públicas, no por el vertimiento de residuos.", false]]}, {"id": "ET-164", "niv": 3, "e": "Sobre el destino de lo recaudado por tasa por utilización de aguas en la cuenca con POMCA adoptado, usted indica que debe destinarse", "f": "Ley 99 de 1993, art. 43, parágrafo 2 (modificado por el art. 25 de la Ley 1930 de 2018)", "o": [["A", "a las actividades de protección, recuperación y monitoreo del recurso hídrico definidas en el POMCA.", "El parágrafo 2, literal a) del art. 43 de la Ley 99 de 1993 (modificado por el art. 25 de la Ley 1930 de 2018) dispone que en las cuencas con POMCA adoptado estos recursos se destinan a las actividades de protección, recuperación y monitoreo del recurso hídrico definidas en él.", true], ["B", "a proyectos del plan de acción de la corporación en cualquier cuenca de su jurisdicción, aunque no se relacionen con el POMCA adoptado.", "Cuando la cuenca tiene POMCA adoptado, la ley orienta estos recursos a las actividades de protección, recuperación y monitoreo del recurso hídrico definidas en ese plan, no a cualquier proyecto del plan de acción.", false], ["C", "libremente a gastos de funcionamiento de la corporación, por tratarse de rentas propias.", "Los recursos de esta tasa tienen destinación específica a la protección del recurso hídrico.", false]]}]}, {"comp": "entidades_territoriales", "rol": "profesional", "tag": "Entidades territoriales, Bogotá D.C. y CAR · Nivel profesional · Sistema General de Participaciones", "texto": "Usted es profesional universitario de la Secretaría de Hacienda de un municipio de tercera categoría de Nariño, con 40.000 habitantes y no certificado en educación. El nuevo alcalde quiere usar en un faltante de caja de la tesorería general unos recursos del Sistema General de Participaciones (SGP) que están en una cuenta sin ejecutar. También pregunta qué componentes tiene el SGP y qué debe hacer el municipio para administrar directamente la educación.", "items": [{"id": "ET-174", "niv": 1, "e": "Al explicar la conformación del SGP, usted señala que está integrado por", "f": "Ley 715 de 2001, art. 3 (modificado por el art. 1 de la Ley 1176 de 2007)", "o": [["A", "las participaciones para educación y salud, únicamente, pues el agua potable se financia con tarifas.", "Desde la Ley 1176 de 2007 existe una participación específica para agua potable y saneamiento básico, además de la de propósito general.", false], ["B", "las participaciones para educación, salud, agua potable y saneamiento básico, y una de propósito general.", "El art. 3 de la Ley 715 de 2001 (modificado por el art. 1 de la Ley 1176 de 2007) conforma el SGP con participaciones para educación, salud, agua potable y saneamiento básico, y una participación de propósito general.", true], ["C", "las regalías, las participaciones para educación y salud, y los recursos del Fondo Nacional de Gestión del Riesgo.", "Las regalías tienen un sistema propio (Sistema General de Regalías) y el fondo de gestión del riesgo no hace parte del SGP.", false]]}, {"id": "ET-175", "niv": 2, "e": "Frente a la idea de cubrir el faltante de caja con recursos del SGP, usted advierte que", "f": "Ley 715 de 2001, arts. 18 y 91", "o": [["A", "es posible si el Concejo lo autoriza mediante acuerdo, con cargo a reintegrar los recursos en la misma vigencia.", "Una autorización del Concejo no cambia la regla legal: los recursos del SGP no hacen unidad de caja con las demás rentas.", false], ["B", "es posible solo con los recursos de propósito general, porque son de libre destinación.", "La participación de propósito general tiene destinaciones definidas por la ley y no es una renta de libre uso para cubrir faltantes de tesorería; además, los recursos del SGP no hacen unidad de caja con las demás rentas (art. 91 de la Ley 715 de 2001).", false], ["C", "no es procedente, porque los recursos del SGP van en cuentas especiales y no hacen unidad de caja con las demás rentas.", "El art. 91 de la Ley 715 de 2001 prohíbe la unidad de caja: los recursos del SGP no se mezclan con los demás recursos del presupuesto y se administran en cuentas separadas; el art. 18 reitera la regla para los recursos de educación.", true]]}, {"id": "ET-176", "niv": 3, "e": "Para administrar directamente la educación, el municipio, con menos de 100.000 habitantes, debe", "f": "Ley 715 de 2001, arts. 6 y 20", "o": [["A", "esperar a superar los 100.000 habitantes, porque solo esos municipios pueden certificarse.", "Los municipios con menos de cien mil habitantes también pueden certificarse si cumplen los requisitos de capacidad técnica, administrativa y financiera.", false], ["B", "solicitar la certificación al departamento y, si este no resuelve en seis meses o la rechaza, acudir a la Nación.", "El art. 20 de la Ley 715 de 2001 asigna a los departamentos decidir la certificación de municipios con menos de cien mil habitantes que cumplan los requisitos, y si en seis meses no se resuelve o se rechaza, el municipio puede acudir a la Nación.", true], ["C", "solicitar la certificación directamente al Ministerio de Educación Nacional, que es el único competente para decidirla en todos los casos.", "Para municipios con menos de cien mil habitantes la decisión corresponde, en primer término, al departamento; la Nación interviene solo si el departamento no resuelve o rechaza.", false]]}]}, {"comp": "entidades_territoriales", "rol": "general", "tag": "Entidades territoriales, Bogotá D.C. y CAR · Gestión del riesgo: responsables y consejos", "texto": "Usted es técnico administrativo de la Secretaría de Gobierno de un municipio de sexta categoría del Chocó, donde las lluvias suelen generar desbordamientos. El municipio no tiene oficina de gestión del riesgo y el alcalde pregunta quién es el responsable de los procesos de gestión del riesgo en el municipio, qué papel cumple el consejo municipal de gestión del riesgo y si puede delegar esa responsabilidad en la corporación autónoma regional, que tiene más personal técnico.", "items": [{"id": "ET-177", "niv": 1, "e": "Sobre la responsabilidad de la gestión del riesgo en el municipio, usted le indica al alcalde que", "f": "Ley 1523 de 2012, arts. 13 y 14", "o": [["A", "él es el responsable directo de implementar los procesos de conocimiento, reducción del riesgo y manejo de desastres en su jurisdicción.", "El art. 14 de la Ley 1523 de 2012 establece que el alcalde, como conductor del desarrollo local, es el responsable directo de la implementación de los procesos de gestión del riesgo en el municipio.", true], ["B", "corresponde a la Unidad Nacional para la Gestión del Riesgo de Desastres, porque el municipio no cuenta con una oficina especializada en la materia.", "La UNGRD dirige el sistema nacional y apoya a los territorios, pero no sustituye la responsabilidad del alcalde en el municipio.", false], ["C", "corresponde al gobernador, porque es agente del Presidente en materia de orden público.", "El gobernador responde en el ámbito departamental (art. 13), pero en el municipio el responsable directo es el alcalde (art. 14 de la Ley 1523 de 2012).", false]]}, {"id": "ET-178", "niv": 1, "e": "Sobre el consejo municipal de gestión del riesgo, usted explica que es", "f": "Ley 1523 de 2012, art. 27", "o": [["A", "una dependencia de la alcaldía con planta de personal propia y presupuesto independiente.", "El consejo no es una dependencia con planta ni presupuesto propio; es una instancia de coordinación. Los recursos se manejan en el fondo municipal de gestión del riesgo.", false], ["B", "un organismo de socorro encargado de ejecutar directamente las labores de rescate en las emergencias.", "Las labores de rescate las ejecutan los organismos operativos (bomberos, Defensa Civil, Cruz Roja); el consejo es una instancia de coordinación.", false], ["C", "una instancia de coordinación, asesoría, planeación y seguimiento de la gestión del riesgo.", "El art. 27 de la Ley 1523 de 2012 crea los consejos territoriales como instancias de coordinación, asesoría, planeación y seguimiento para garantizar la efectividad y articulación de los procesos de conocimiento, reducción y manejo.", true]]}, {"id": "ET-179", "niv": 3, "e": "Sobre trasladar la responsabilidad a la corporación autónoma regional, usted aclara que", "f": "Ley 1523 de 2012, art. 31, parágrafos 1 y 3", "o": [["A", "el papel de la CAR es complementario y subsidiario y no exime al alcalde de su responsabilidad primaria, aunque debe apoyar al municipio.", "El parágrafo 1 del art. 31 de la Ley 1523 de 2012 señala que el papel de las CAR es complementario y subsidiario respecto de alcaldías y gobernaciones y no exime a los alcaldes de su responsabilidad primaria; el parágrafo 3 las obliga a apoyar a las entidades territoriales.", true], ["B", "es obligatorio en municipios de sexta categoría, que deben entregar la gestión del riesgo a la CAR.", "La ley no prevé esa transferencia por categoría; la responsabilidad primaria del alcalde se mantiene en todos los municipios.", false], ["C", "es viable mediante convenio interadministrativo, porque la CAR es la máxima autoridad ambiental y asume la gestión del riesgo en toda su jurisdicción.", "La condición de máxima autoridad ambiental no convierte a la CAR en responsable principal de la gestión del riesgo; su papel es complementario.", false]]}]}, {"comp": "comportamental", "rol": "general", "tag": "Competencias comportamentales (Decreto 815 de 2018) · Orientación a resultados", "texto": "Usted trabaja en la Secretaría de Gobierno de una gobernación y es responsable de consolidar, cada trimestre, el informe de avance del programa de dotación a juntas de acción comunal en los 40 municipios del departamento. El informe del trimestre actual debe entregarse el 15 de noviembre al despacho del secretario. A cinco días del plazo, 12 municipios no han enviado su reporte. Además, cada municipio usa un formato distinto y usted invierte tres días por trimestre en unificarlos.", "items": [{"id": "CO-110", "niv": 2, "e": "Frente a los 12 municipios que no han reportado, la conducta que mejor refleja la orientación a resultados es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Orientación a resultados)", "o": [["A", "pedir al secretario una prórroga de dos semanas para presentar el informe con los 40 municipios completos.", "Busca la calidad del informe, pero sacrifica la oportunidad sin haber intentado antes cumplir. La competencia exige cumplir los compromisos dentro de los tiempos establecidos.", false], ["B", "contactar a los enlaces de los 12 municipios, acordar envíos antes del 15 y, si alguno no reporta, entregar en la fecha dejando constancia.", "Refleja la competencia «Orientación a resultados» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en cumplir las funciones y los compromisos de la organización con eficacia, calidad y oportunidad. Corresponde a plantear estrategias para alcanzar los resultados y cumplir con oportunidad según los tiempos de la entidad: actúa sobre la causa del retraso y, a la vez, asegura la entrega dentro del plazo con información verificada.", true], ["C", "entregar el informe en la fecha y completar los datos de los 12 municipios faltantes con estimaciones basadas en lo reportado el trimestre anterior.", "Cumple la fecha, pero presenta datos estimados como si fueran reportes de los municipios, lo que afecta la calidad del informe; además, no gestiona los reportes faltantes en los días disponibles.", false]]}, {"id": "CO-111", "niv": 1, "e": "Al preparar el informe, usted detecta que una cifra que consolidó en el informe del trimestre anterior quedó mal sumada. La conducta más acorde con la orientación a resultados es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Orientación a resultados)", "o": [["A", "pedir al municipio que reportó la información que remita una corrección oficial del dato.", "El error fue de consolidación, no del municipio. Trasladarle la corrección no refleja la conducta de asumir la responsabilidad por los propios resultados.", false], ["B", "corregir el dato en el nuevo informe sin mencionarlo, para no afectar la confianza en la información del programa.", "Corrige, pero oculta el error a quienes ya usaron la cifra anterior. Asumir la responsabilidad por los resultados implica reconocer y corregir de forma visible.", false], ["C", "informar el error a su jefe, corregir la cifra y dejar nota de la corrección en el informe actual, para que quienes usaron el dato lo sepan.", "Refleja la competencia «Orientación a resultados» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en cumplir las funciones y los compromisos de la organización con eficacia, calidad y oportunidad. Refleja la conducta de asumir la responsabilidad por sus resultados: reconoce el error propio, lo corrige y deja trazabilidad para que los usuarios del informe tengan el dato correcto.", true]]}, {"id": "CO-112", "niv": 3, "e": "Respecto de los tres días que invierte cada trimestre en unificar formatos, la conducta que mejor refleja la orientación a resultados es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Orientación a resultados)", "o": [["A", "seguir haciendo la unificación usted mismo, ya que cambiar el formato podría confundir a los municipios y retrasar los reportes.", "Evita un riesgo, pero renuncia a mejorar un proceso ineficiente. La competencia incluye plantear estrategias para superar los resultados y mejorar la productividad.", false], ["B", "solicitar que se asigne un contratista de apoyo para hacer la unificación de los formatos cada trimestre.", "Gestiona recursos, pero mantiene el reproceso y lo traslada a otra persona con un costo adicional. No ataca la causa del problema.", false], ["C", "diseñar un formato único con instrucciones y proponerlo a su jefe para enviarlo a los municipios desde el próximo trimestre.", "Refleja la competencia «Orientación a resultados» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en cumplir las funciones y los compromisos de la organización con eficacia, calidad y oportunidad. Corresponde a plantear estrategias para alcanzar o superar los resultados y gestionar mejoras de productividad: ataca la causa del reproceso y libera tiempo para el análisis.", true]]}]}, {"comp": "comportamental", "rol": "general", "tag": "Competencias comportamentales (Decreto 815 de 2018) · Trabajo en equipo", "texto": "Usted integra el equipo de educación ambiental de una corporación autónoma regional del Caribe, que prepara una jornada sobre ahorro de agua en 12 instituciones educativas. En la última reunión cada integrante asumió una tarea: usted, los contenidos de las charlas; Laura, la logística y los horarios acordados con los colegios; Andrés, la convocatoria; y Mateo, quien llegó hace una semana trasladado de otra dependencia, el registro fotográfico. Mateo no conoce aún a los rectores ni la forma de trabajo del equipo.", "items": [{"id": "CO-122", "niv": 2, "e": "Respecto de Mateo, la conducta que mejor refleja el trabajo en equipo es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Trabajo en equipo)", "o": [["A", "sugerir que Mateo asista a esta jornada solo como observador y asuma tareas desde la siguiente.", "Pospone su integración y desconoce que ya asumió una tarea en el reparto del equipo.", false], ["B", "explicarle cómo funciona el equipo y presentarle a los contactos de los colegios, para que asuma pronto su tarea.", "Refleja la competencia «Trabajo en equipo» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en trabajar con otros de manera integrada y armónica para lograr metas institucionales comunes. Corresponde a integrar a los nuevos miembros y facilitar su proceso de reconocimiento y apropiación de las actividades a cargo del equipo.", true], ["C", "enviarle por correo las actas de las reuniones anteriores y el directorio de colegios para que se ponga al día por su cuenta.", "Le entrega información, pero lo deja solo en su proceso de integración. La conducta asociada pide facilitar activamente el reconocimiento de las actividades del equipo.", false]]}, {"id": "CO-123", "niv": 2, "e": "Andrés propone hacer la convocatoria por redes sociales; usted considera que funcionaría mejor un oficio dirigido a cada rector. La conducta más acorde con el trabajo en equipo es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Trabajo en equipo)", "o": [["A", "exponer sus razones en la reunión, escuchar las de Andrés y acoger lo que el equipo decida, aunque no sea su propuesta.", "Refleja la competencia «Trabajo en equipo» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en trabajar con otros de manera integrada y armónica para lograr metas institucionales comunes. Reúne las conductas de establecer comunicación directa para compartir ideas con respeto y de respetar la diversidad de criterios y opiniones de los miembros del equipo.", true], ["B", "enviar por su cuenta oficios a los rectores como respaldo, por si la convocatoria por redes no funciona.", "Actúa sin considerar el efecto en el trabajo de su compañero y puede duplicar o contradecir la convocatoria. No planifica teniendo en cuenta los objetivos del grupo.", false], ["C", "dejar que Andrés haga la convocatoria a su manera y concentrarse en preparar los contenidos de las charlas de ahorro de agua.", "Respeta la tarea de Andrés, pero se guarda una idea que podría mejorar el resultado común. La competencia incluye compartir ideas de forma directa y respetuosa.", false]]}, {"id": "CO-124", "niv": 3, "e": "Usted quiere ampliar las charlas para incluir el cambio climático, lo que las alargaría de 30 a 60 minutos. La conducta que mejor refleja el trabajo en equipo es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Trabajo en equipo)", "o": [["A", "ajustar los contenidos a 60 minutos, porque los contenidos son su responsabilidad y el cambio mejora la calidad pedagógica.", "Mejora su parte, pero ignora el efecto sobre los horarios ya pactados por Laura con los colegios. No planifica pensando en el objetivo del grupo.", false], ["B", "revisar con Laura si los horarios pactados con los colegios admiten una charla más larga, antes de cambiarla.", "Refleja la competencia «Trabajo en equipo» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en trabajar con otros de manera integrada y armónica para lograr metas institucionales comunes. Corresponde a planificar las propias acciones teniendo en cuenta su repercusión en los objetivos grupales: el cambio afecta la logística que maneja otra compañera y debe acordarse con ella.", true], ["C", "mantener las charlas de 30 minutos y guardar la idea del cambio climático para otra jornada, sin comentarla al equipo.", "Evita riesgos, pero se reserva una idea útil. El trabajo en equipo incluye compartir información e ideas con los demás integrantes.", false]]}]}, {"comp": "comportamental", "rol": "general", "tag": "Competencias comportamentales (Decreto 815 de 2018) · Compromiso con la organización", "texto": "Usted trabaja en un instituto distrital de Bogotá cuyo plan de acción incluye la meta de reducir el consumo de papel en 30 % este año. La política de seguridad de la información de la entidad prohíbe enviar documentos institucionales a correos personales. Esta semana usted tiene atrasados dos informes, y el área de correspondencia está represada por el aumento de solicitudes ciudadanas. Varios compañeros siguen imprimiendo borradores por costumbre.", "items": [{"id": "CO-134", "niv": 2, "e": "Para ponerse al día con los informes, la conducta que mejor refleja el compromiso con la organización es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Compromiso con la organización)", "o": [["A", "enviarse los archivos a su correo personal por esta única vez y terminarlos en casa esa noche, ya que lo importante es cumplir con la entidad.", "Tiene buena intención, pero desconoce una norma institucional de seguridad. La competencia incluye respetar las normas de la organización mientras promueve sus metas.", false], ["B", "entregar los informes en la fecha con la información que alcance a procesar y enviar los anexos la semana siguiente.", "Cumple la fecha formalmente, pero con un producto incompleto y sin haber concertado el ajuste con su jefe.", false], ["C", "cumplir la política de seguridad y acordar con su jefe la prioridad de los informes dentro de la jornada o un acceso remoto autorizado.", "Refleja la competencia «Compromiso con la organización» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en alinear el propio comportamiento con las necesidades, prioridades y metas de la organización. Corresponde a promover el cumplimiento de las metas de la organización respetando sus normas: busca terminar los informes sin poner en riesgo la información.", true]]}, {"id": "CO-135", "niv": 1, "e": "Frente a la meta de reducción de papel, la conducta más acorde con el compromiso con la organización es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Compromiso con la organización)", "o": [["A", "aplicar la meta en su trabajo y recordar a sus compañeros las alternativas digitales, porque la meta es de toda la entidad.", "Refleja la competencia «Compromiso con la organización» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en alinear el propio comportamiento con las necesidades, prioridades y metas de la organización. Refleja la conducta de promover el cumplimiento de las metas de la organización y respetar sus normas, empezando por la propia práctica.", true], ["B", "proponer que la meta se aplace hasta que la entidad compre más escáneres y pantallas para todas sus dependencias y sedes.", "Puede señalar una necesidad real, pero condiciona la meta en lugar de contribuir a cumplirla con los medios disponibles.", false], ["C", "seguir imprimiendo solo los borradores que considera más importantes para revisarlos con mayor detalle en papel.", "Reduce algo el consumo, pero antepone su preferencia de trabajo a una meta institucional.", false]]}, {"id": "CO-136", "niv": 2, "e": "Usted terminó sus tareas del día dos horas antes y sabe que correspondencia está represada. La conducta que mejor refleja el compromiso con la organización es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Compromiso con la organización)", "o": [["A", "pasar a apoyar en correspondencia el resto de la semana y dejar para la siguiente las tareas nuevas que le lleguen.", "Colabora, pero descuida sus propias tareas. La conducta asociada pide colaborar sin desatender lo propio.", false], ["B", "esperar a que su jefe le asigne formalmente apoyar a correspondencia, para no invadir funciones de otra área.", "Es respetuoso, pero no toma la iniciativa de colaborar cuando la organización lo necesita y usted tiene disponibilidad.", false], ["C", "ofrecer a la coordinadora de correspondencia esas dos horas de apoyo, avisando previamente a su jefe.", "Refleja la competencia «Compromiso con la organización» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en alinear el propio comportamiento con las necesidades, prioridades y metas de la organización. Corresponde a tomar la iniciativa de colaborar con otras áreas cuando se requiere, sin descuidar sus tareas: usa un tiempo libre y mantiene informado a su jefe.", true]]}]}, {"comp": "comportamental", "rol": "general", "tag": "Competencias comportamentales (Decreto 815 de 2018) · Adaptación al cambio", "texto": "Usted trabaja en la Secretaría de Planeación de una gobernación. La nueva secretaria de despacho cambió la forma de reportar: en lugar del informe mensual en documento de texto, cada servidor debe cargar sus datos cada semana en un tablero digital. También reasignó tareas: usted deja el seguimiento de proyectos, que hizo durante seis años, y pasa a apoyar la estructuración de nuevos proyectos, actividad que también está prevista en el manual de funciones de su empleo. Además, la dependencia se trasladará a una sede con puestos de trabajo compartidos.", "items": [{"id": "CO-146", "niv": 1, "e": "Frente al nuevo esquema de reporte, la conducta que mejor refleja la adaptación al cambio es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Adaptación al cambio)", "o": [["A", "cargar sus datos en el tablero cada semana desde el inicio, ya que es la forma de reporte que adoptó la secretaría.", "Refleja la competencia «Adaptación al cambio» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en afrontar con flexibilidad las situaciones nuevas y manejar los cambios de forma positiva y constructiva. Corresponde a aceptar y adaptarse con facilidad a las nuevas situaciones y apoyar a la entidad en nuevas formas de trabajo.", true], ["B", "pedir a la secretaria que mantenga el informe mensual, explicando que ha funcionado bien durante años en la dependencia.", "Defiende la práctica anterior en lugar de responder con flexibilidad a la nueva decisión.", false], ["C", "seguir preparando también el informe mensual en documento de texto, por si el nuevo esquema no se mantiene en el tiempo.", "Duplica el trabajo y muestra resistencia a adoptar por completo la nueva forma de reporte.", false]]}, {"id": "CO-147", "niv": 3, "e": "Respecto de la reasignación de tareas, la conducta más acorde con la adaptación al cambio es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Adaptación al cambio)", "o": [["A", "asumir la estructuración y, de manera informal, seguir pendiente de sus antiguos proyectos para que no se pierdan.", "Acepta el cambio solo en parte: mantener el seguimiento informal genera duplicidad y confusión sobre quién es responsable.", false], ["B", "asumir las nuevas tareas, identificar lo que necesita aprender y entregar a su reemplazo el estado de los proyectos.", "Refleja la competencia «Adaptación al cambio» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en afrontar con flexibilidad las situaciones nuevas y manejar los cambios de forma positiva y constructiva. Refleja la conducta de responder al cambio con flexibilidad y cooperar activamente en la implementación de nuevos objetivos y formas de trabajo, facilitando la transición.", true], ["C", "pedir que lo mantengan en el seguimiento de proyectos, donde tiene más experiencia y puede aportar más a la entidad.", "Su argumento es razonable, pero se resiste a una decisión de la entidad que está dentro de las funciones de su empleo.", false]]}, {"id": "CO-148", "niv": 2, "e": "Ante el traslado a una sede con puestos compartidos, la conducta que mejor refleja la adaptación al cambio es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Adaptación al cambio)", "o": [["A", "solicitar un puesto fijo, argumentando que maneja documentos que requieren un lugar estable de trabajo.", "Busca mantener la condición anterior en lugar de ajustarse a la nueva forma de trabajo de la entidad.", false], ["B", "llevarse a casa cada día los documentos físicos de trabajo, para no perderlos al cambiar de puesto.", "Intenta resolver el problema, pero de una forma que pone en riesgo la información institucional.", false], ["C", "organizar su información en las herramientas digitales de la entidad para poder trabajar desde cualquier puesto.", "Refleja la competencia «Adaptación al cambio» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en afrontar con flexibilidad las situaciones nuevas y manejar los cambios de forma positiva y constructiva. Corresponde a aceptar y adaptarse a las nuevas situaciones, ajustando su forma de trabajo a las nuevas condiciones.", true]]}]}, {"comp": "comportamental", "rol": "profesional", "tag": "Competencias comportamentales (Decreto 815 de 2018) · Nivel profesional · Comunicación efectiva", "texto": "Usted es profesional universitario de la Dirección de Talento Humano de una gobernación. Debe informar a los 300 servidores de la planta central un cambio en el procedimiento para solicitar vacaciones: desde el próximo mes, las solicitudes se harán en un formulario electrónico con 30 días de anticipa const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY = 'sim-cnsc:' + CFG.clave;
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}
function save(){try{localStorage.setItem(KEY, JSON.stringify(ST))}catch(e){}}
let ST = load();
ST.r = ST.r || {};
$('#tit').textContent = CFG.titulo;
const ITEMS = [];
DATA.forEach(c => c.items.forEach(it => { it.caso = c; ITEMS.push(it); }));

function justHTML(it){
  return '<div class="just">' + it.o.map(o => `<div><b>${o[0]}.</b> <span class="${o[3]?'okt':'not'}">${o[3]?'Es correcta.':'Es incorrecta.'}</span> ${esc(o[2])}</div>`).join('') +
    `<div class="src">Referencia: ${esc(it.f)}</div></div>`;
}
function itemHTML(it, n, mode){
  const r = ST.r[it.id];
  const reveal = mode === 'review' || (CFG.modo === 'practica' && r);
  let h = `<div class="item" id="i-${it.id}"><p class="enun"><span class="n">${n}.</span> <span class="niv">${CFG.niveles[it.niv]}</span> ${esc(it.e)}</p>`;
  it.o.forEach(o => {
    let cls = '';
    if (reveal) { if (o[3]) cls = 'ok'; else if (r === o[0]) cls = 'no'; }
    else if (r === o[0]) cls = 'sel';
    h += `<button class="op ${cls}" data-id="${it.id}" data-l="${o[0]}" ${reveal?'disabled':''}><span class="l">${o[0]}.</span><span>${esc(o[1])}</span></button>`;
  });
  if (reveal) {
    if (mode === 'review') h += `<div class="${r===keyOf(it)?'res-ok':'res-no'}" style="font-size:14px;margin-top:4px">${r ? (r===keyOf(it)?'Respondiste ' + r + ': correcto.':'Respondiste ' + r + '. La respuesta correcta es ' + keyOf(it) + '.') : 'Sin responder. La respuesta correcta es ' + keyOf(it) + '.'}</div>`;
    h += justHTML(it);
  }
  return h + '</div>';
}
const keyOf = it => it.o.find(o => o[3])[0];

function renderList(list, mode){
  let h = '', last = null, n = 0;
  list.forEach(it => {
    n++;
    if (it.caso !== last) { last = it.caso; h += `<div class="caso"><div class="tag">${esc(it.caso.tag)}</div><p>${esc(it.caso.texto)}</p></div>`; }
    h += itemHTML(it, n, mode);
  });
  return h;
}

let LIST = [];
let FILTRO = ST.f || {comp:'', niv:'', rol:''};
function practica(){
  const comps = Object.entries(CFG.componentes).map(([k,v]) => `<option value="${k}" ${FILTRO.comp===k?'selected':''}>${esc(v)}</option>`).join('');
  const nivs = Object.entries(CFG.niveles).map(([k,v]) => `<option value="${k}" ${FILTRO.niv===k?'selected':''}>${esc(v)}</option>`).join('');
  const list = ITEMS.filter(it => (!FILTRO.comp || it.caso.comp===FILTRO.comp) && (!FILTRO.niv || String(it.niv)===FILTRO.niv) && (!FILTRO.rol || it.caso.rol===FILTRO.rol || it.caso.rol==='general'));
  const resp = list.filter(it => ST.r[it.id]); const ok = resp.filter(it => ST.r[it.id]===keyOf(it));
  $('#main').innerHTML = `<div class="panel"><p style="margin-top:0">Elige un tema, tu nivel de empleo y la dificultad. Al responder verás de inmediato si acertaste y la explicación de cada opción.</p>
  <div class="row"><select id="fc"><option value="">Todos los temas</option>${comps}</select>
  <select id="fn"><option value="">Todas las dificultades</option>${nivs}</select>
  <select id="fr"><option value="">Todos los niveles de empleo</option>${['asistencial','tecnico','profesional'].map(k => `<option value="${k}" ${FILTRO.rol===k?'selected':''}>${esc(CFG.roles[k])} (y temas comunes)</option>`).join('')}</select>
  <button class="btn sec" id="borrar">Borrar mis respuestas</button></div>
  <p class="stat" id="pst" style="margin-bottom:0">${list.length} preguntas · respondidas ${resp.length} · aciertos ${ok.length}${resp.length? ' (' + Math.round(100*ok.length/resp.length) + ' %)':''}</p></div>` + renderList(list, 'practica');
  $('#prog').textContent = `${ok.length}/${resp.length} aciertos`;
  ['fc','fn','fr'].forEach((id,i) => $('#'+id).onchange = e => { FILTRO[['comp','niv','rol'][i]] = e.target.value; ST.f = FILTRO; save(); practica(); });
  LIST = list;
  $('#borrar').onclick = () => { list.forEach(it => delete ST.r[it.id]); save(); practica(); };
}

  const n = ITEMS.length, cnt = {};
