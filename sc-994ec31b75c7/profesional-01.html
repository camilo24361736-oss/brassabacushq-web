<title>Simulacro 1 · Nivel profesional · CNSC Empleo Público</title>
<style>
:root{--bg:#f6f8fb;--card:#fff;--ink:#1d2433;--mute:#5a6478;--line:#dbe1ea;--pri:#0b3d6e;--pri2:#1660a8;--ok:#0d6b3a;--okbg:#e6f4ec;--no:#9b1c1c;--nobg:#fbeaea;--sel:#e8f0fa}
@media (prefers-color-scheme: dark){:root{--bg:#10151d;--card:#18202b;--ink:#e6ebf2;--mute:#9aa6b8;--line:#2a3545;--pri:#7fb3ea;--pri2:#9cc6f2;--ok:#7fd3a3;--okbg:#16301f;--no:#f2a3a3;--nobg:#3a1c1c;--sel:#1e2d40}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px}
.hwrap{max-width:860px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
h1{font-size:17px;margin:0;color:var(--pri)}
.stat{font-size:14px;color:var(--mute)}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--pri)}
.timer.low{color:var(--no)}
main{max-width:860px;margin:0 auto;padding:16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin:0 0 16px}
.caso{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--pri);border-radius:10px;padding:14px 16px;margin:22px 0 10px}
.tag{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--pri);font-weight:700}
.caso p{margin:6px 0 0;white-space:pre-line}
.item{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0}
.enun{margin:0 0 8px}
.n{font-weight:700;color:var(--pri)}
.niv{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-right:4px;white-space:nowrap}
.op{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:6px 0;cursor:pointer;background:transparent;width:100%;text-align:left;color:inherit;font:inherit}
.op:hover{border-color:var(--pri2)}
.op .l{font-weight:700;min-width:20px}
.op.sel{background:var(--sel);border-color:var(--pri2)}
.op.ok{background:var(--okbg);border-color:var(--ok)}
.op.no{background:var(--nobg);border-color:var(--no)}
.op[disabled]{cursor:default}
.just{font-size:14px;margin:8px 0 0;padding:8px 10px;border-top:1px dashed var(--line)}
.just div{margin:4px 0}
.just .okt{color:var(--ok);font-weight:700}
.just .not{color:var(--no);font-weight:700}
.src{font-size:13px;color:var(--mute);margin-top:6px}
button.btn{background:var(--pri);color:var(--card);border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer}
button.btn.sec{background:transparent;color:var(--pri);border:1px solid var(--pri)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
select{font:inherit;padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);max-width:100%}
table{border-collapse:collapse;width:100%;font-size:15px}
td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
.big{font-size:40px;font-weight:800;color:var(--pri);line-height:1.1}
.aviso{font-size:13px;color:var(--mute)}
.hide{display:none !important}
.res-ok{color:var(--ok);font-weight:700}.res-no{color:var(--no);font-weight:700}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal .panel{max-width:420px}
footer{max-width:860px;margin:0 auto;padding:8px 16px 40px;font-size:12px;color:var(--mute)}
</style>
</head>
<body>
<header><div class="hwrap"><h1 id="tit"></h1><div class="row stat"><span id="prog"></span><span id="timer" class="timer"></span></div></div></header>
<main id="main"></main>
<div id="modal" class="modal hide"><div class="panel"><p id="mtxt"></p><div class="row"><button class="btn" id="msi">Sí, calificar</button><button class="btn sec" id="mno">Seguir respondiendo</button></div></div></div>
<footer><a href="./" style="color:var(--pri);font-weight:600">← Volver al menú</a><br><br>Material de preparación independiente. No está afiliado a la Comisión Nacional del Servicio Civil (CNSC) ni a ninguna entidad pública, y no contiene preguntas reales de la prueba.</footer>
<script>
const DATA = [{"comp": "estado_constitucion", "rol": "general", "tag": "Estado y Constitución · Principios fundamentales y Estado social de derecho", "texto": "Usted es técnico administrativo de la Secretaría de Gobierno de un municipio de sexta categoría. En una reunión de equipo, el coordinador afirma que «si no hacemos nada, nadie nos puede sancionar: los servidores, igual que cualquier particular, solo responden si violan una ley expresa». En la misma reunión se revisa un decreto municipal que, para inscribirse en un programa de mercados solidarios, exige certificado de pertenencia a una iglesia. Además, un concejal pide explicar a la comunidad por qué el municipio puede diseñar sus propios programas sociales sin que cada uno sea aprobado por la Nación.", "items": [{"id": "EC-101", "niv": 1, "e": "Frente a la afirmación del coordinador sobre la responsabilidad de los servidores públicos, lo correcto es aclarar que estos responden", "f": "Constitución Política, art. 6", "o": [["A", "únicamente cuando su omisión cause un daño patrimonial cuantificado por la contraloría.", "El daño patrimonial es un elemento de la responsabilidad fiscal, no un requisito general de la responsabilidad de los servidores. El artículo 6 hace responsables a los servidores por la sola omisión en el ejercicio de sus funciones.", false], ["B", "en los mismos términos que los particulares, porque la Constitución consagra la igualdad de todos ante la ley y no distingue entre ellos.", "Confunde la igualdad del artículo 13 con el régimen de responsabilidad. El artículo 6 establece expresamente un régimen más exigente para los servidores, que incluye la omisión y la extralimitación.", false], ["C", "por infringir la Constitución y las leyes, y también por omisión o extralimitación en el ejercicio de sus funciones.", "El artículo 6 de la Constitución distingue: los particulares responden solo por infringir la Constitución y las leyes, mientras que los servidores públicos responden por esa misma causa y, además, por omitir sus funciones o excederse en ellas. La inacción también genera responsabilidad.", true]]}, {"id": "EC-102", "niv": 1, "e": "Sobre la incompatibilidad entre el decreto municipal que exige pertenecer a una iglesia y la Constitución, la regla constitucional aplicable indica que", "f": "Constitución Política, arts. 4 y 13", "o": [["A", "deben aplicarse las disposiciones constitucionales, por ser la Constitución norma de normas.", "El artículo 4 de la Constitución establece que la Constitución es norma de normas y que, ante cualquier incompatibilidad con la ley u otra norma jurídica, se aplican las disposiciones constitucionales. Exigir pertenecer a una iglesia discrimina por religión (art. 13).", true], ["B", "prevalece el decreto, por ser una norma especial y posterior expedida por la autoridad local competente.", "Los criterios de especialidad y posterioridad resuelven conflictos entre normas del mismo nivel. Frente a la Constitución no operan: el artículo 4 dispone que en caso de incompatibilidad se aplican las disposiciones constitucionales.", false], ["C", "el decreto debe aplicarse hasta que el concejo municipal lo derogue mediante acuerdo.", "El concejo no deroga los decretos del alcalde como mecanismo para resolver su incompatibilidad con la Constitución. La regla del artículo 4 es la prevalencia directa de la Constitución sobre cualquier norma incompatible.", false]]}, {"id": "EC-103", "niv": 2, "e": "Para responder al concejal, el fundamento constitucional que permite al municipio diseñar sus propios programas es que Colombia está organizada como", "f": "Constitución Política, art. 1", "o": [["A", "un Estado federal, en el que cada municipio ejerce soberanía propia sobre los asuntos sociales.", "Colombia no es un Estado federal. El artículo 1 la define como república unitaria; los municipios tienen autonomía, pero no soberanía, que reside exclusivamente en el pueblo (art. 3).", false], ["B", "una república unitaria y descentralizada, con autonomía de sus entidades territoriales.", "El artículo 1 de la Constitución define a Colombia como Estado social de derecho organizado en forma de república unitaria, descentralizada y con autonomía de sus entidades territoriales. Esa autonomía permite al municipio gestionar sus propios programas dentro de la Constitución y la ley.", true], ["C", "una república centralizada, en la que la Nación define y aprueba todos los programas sociales locales.", "El artículo 1 describe a Colombia como república descentralizada y con autonomía de sus entidades territoriales, lo que contradice que la Nación deba aprobar cada programa local.", false]]}]}, {"comp": "estado_constitucion", "rol": "profesional", "tag": "Estado y Constitución · Nivel profesional · Acción de tutela: términos y cumplimiento", "texto": "Usted es profesional universitario de la oficina jurídica de la Secretaría de Salud de un departamento. Una ciudadana de 78 años presentó un derecho de petición hace tres meses y nunca recibió respuesta, por lo que interpuso acción de tutela. El Juzgado Civil Municipal admitió la tutela y pidió a la secretaría un informe. Su jefe le encarga revisar los términos del trámite, explicar qué pasa si el fallo ordena responder y la secretaría no cumple, y definir qué hacer si la secretaría no está de acuerdo con la decisión.", "items": [{"id": "EC-107", "niv": 1, "e": "Al revisar los términos, usted debe informar que el juez debe decidir la tutela dentro de", "f": "Constitución Política, art. 86; Decreto 2591 de 1991, art. 29", "o": [["A", "los diez días siguientes a la presentación de la solicitud.", "El artículo 86 de la Constitución dispone que no pueden transcurrir más de diez días entre la solicitud de tutela y su resolución, y el artículo 29 del Decreto 2591 de 1991 ordena dictar el fallo dentro de los diez días siguientes a la presentación.", true], ["B", "los quince días hábiles siguientes a la notificación del auto admisorio.", "Quince días hábiles es el término general del derecho de petición, no el de la tutela. El fallo de tutela se cuenta desde la presentación de la solicitud y no desde la notificación del auto.", false], ["C", "los treinta días siguientes al reparto, prorrogables si hay pruebas pendientes.", "El término de la tutela es perentorio y breve: diez días desde la presentación de la solicitud. No existe un término de treinta días ni prórroga por pruebas.", false]]}, {"id": "EC-108", "niv": 3, "e": "Si el fallo ordena responder la petición y la secretaría no cumple dentro del plazo fijado, el juez", "f": "Decreto 2591 de 1991, arts. 27 y 52", "o": [["A", "deberá esperar la decisión de segunda instancia antes de exigir el cumplimiento.", "La impugnación no suspende el fallo: el artículo 31 del Decreto 2591 la permite sin perjuicio de su cumplimiento inmediato. El juez no debe esperar la segunda instancia.", false], ["B", "compulsará copias a la contraloría, que es la única autoridad que puede sancionar el incumplimiento.", "El incumplimiento de un fallo de tutela no es un asunto fiscal. El propio juez de tutela puede sancionar por desacato y requerir al superior del responsable (arts. 27 y 52).", false], ["C", "requerirá al superior del responsable para que lo haga cumplir y podrá sancionar por desacato.", "El artículo 27 del Decreto 2591 de 1991 dispone que si la autoridad no cumple dentro de las 48 horas siguientes, el juez requerirá a su superior para que haga cumplir el fallo y abra el procedimiento disciplinario, y podrá sancionar por desacato. El artículo 52 prevé arresto hasta de seis meses y multa hasta de 20 salarios mínimos.", true]]}, {"id": "EC-109", "niv": 3, "e": "Si la secretaría no está de acuerdo con el fallo de primera instancia, la actuación procedente es", "f": "Decreto 2591 de 1991, art. 31", "o": [["A", "impugnarlo dentro de los tres días siguientes a su notificación, con lo cual la orden queda suspendida.", "El término de tres días es correcto, pero la impugnación no suspende el fallo: el artículo 31 dispone expresamente que procede sin perjuicio de su cumplimiento inmediato.", false], ["B", "impugnarlo dentro de los tres días siguientes a su notificación, sin dejar de cumplir la orden.", "El artículo 31 del Decreto 2591 de 1991 permite a la autoridad pública impugnar el fallo dentro de los tres días siguientes a su notificación, sin perjuicio de su cumplimiento inmediato. La orden debe acatarse mientras se resuelve la impugnación.", true], ["C", "interponer recurso de reposición ante el mismo juez dentro de los diez días siguientes.", "Contra el fallo de tutela no procede reposición; el mecanismo es la impugnación, que conoce el superior y debe presentarse dentro de los tres días siguientes a la notificación.", false]]}]}, {"comp": "estado_constitucion", "rol": "general", "tag": "Estado y Constitución · Habeas corpus", "texto": "Usted es auxiliar administrativo de la Secretaría de Gobierno de un municipio de quinta categoría. Un domingo en la noche llega la madre de un joven que fue retenido el viernes en una estación de policía. Según ella, nadie le ha explicado el motivo, no ha sido puesto a disposición de ningún juez y no tiene abogado. La señora pregunta si puede presentar una tutela, cuánto se tardará la decisión y ante quién debe acudir, pues no sabe redactar escritos ni tiene recursos para un apoderado.", "items": [{"id": "EC-122", "niv": 1, "e": "Para proteger la libertad del joven, el mecanismo que debe indicarse a la madre es", "f": "Ley 1095 de 2006, art. 1; Decreto 2591 de 1991, art. 6, num. 2", "o": [["A", "la acción de tutela, porque la libertad personal es un derecho fundamental.", "Aunque la libertad es fundamental, el numeral 2 del artículo 6 del Decreto 2591 dispone que la tutela no procede cuando el derecho puede protegerse con el habeas corpus.", false], ["B", "el habeas corpus, que protege la libertad de quien es privado de ella con violación de sus garantías.", "El artículo 1 de la Ley 1095 de 2006 define el habeas corpus como derecho fundamental y acción constitucional que tutela la libertad personal en esos eventos, y no se suspende ni siquiera en estados de excepción.", true], ["C", "una queja ante la personería municipal, que como agente del Ministerio Público puede ordenar la libertad inmediata del joven.", "La personería puede vigilar la actuación policial, pero no ordena libertades. Solo la autoridad judicial que conoce del habeas corpus puede ordenar la liberación.", false]]}, {"id": "EC-123", "niv": 2, "e": "Sobre el término para decidir, debe informarse a la madre que la solicitud se resuelve en", "f": "Ley 1095 de 2006, art. 3", "o": [["A", "un término de treinta y seis horas.", "El artículo 3 de la Ley 1095 de 2006 garantiza invocar el habeas corpus ante cualquier autoridad judicial para que sea resuelto en un término de treinta y seis horas, sin que se suspenda por festivos o vacancia judicial.", true], ["B", "un término de cuarenta y ocho horas.", "Cuarenta y ocho horas es el plazo máximo de cumplimiento de un fallo de tutela (Decreto 2591, art. 29). El habeas corpus se resuelve en treinta y seis horas.", false], ["C", "un término de diez días.", "Diez días es el término para fallar una tutela. El habeas corpus, por proteger la libertad, tiene un término mucho más corto: treinta y seis horas.", false]]}, {"id": "EC-124", "niv": 2, "e": "Respecto de ante quién y cómo presentar la solicitud, lo correcto es orientarla a que", "f": "Ley 1095 de 2006, arts. 2, 3 y 4", "o": [["A", "espere al lunes para presentarla con abogado ante el juez penal del circuito.", "La ley garantiza que el trámite no se suspenda por festivos (art. 3), que no se requiera apoderado (art. 4) y que cualquier juez sea competente (art. 2).", false], ["B", "la presente por escrito ante el inspector de policía, que es la autoridad administrativa competente en el municipio.", "El habeas corpus no lo resuelven autoridades administrativas. Son competentes los jueces y tribunales de la Rama Judicial (art. 2).", false], ["C", "la presente ante cualquier juez o tribunal de la Rama Judicial, aun verbalmente y sin apoderado.", "Son competentes todos los jueces y tribunales de la Rama Judicial (art. 2); la acción puede invocarse por terceros sin mandato (art. 3) y ejercerse sin formalidad, incluso verbalmente y sin apoderado (art. 4).", true]]}]}, {"comp": "estado_constitucion", "rol": "general", "tag": "Estado y Constitución · Defensoría del Pueblo", "texto": "Usted es técnico administrativo de la Secretaría de Gobierno de una gobernación de frontera que atiende población migrante. Un grupo de familias pide ayuda porque una entidad de salud les niega atención y quieren que alguien presente una tutela en su nombre. Uno de los migrantes, además, fue vinculado a un proceso penal y no tiene recursos para pagar un abogado. En una mesa técnica, un contratista afirma que el Defensor del Pueblo es elegido por el Senado, igual que el Procurador.", "items": [{"id": "EC-134", "niv": 1, "e": "Para que la tutela sea presentada en nombre de las familias que lo soliciten, usted puede orientarlas a acudir a", "f": "Decreto 2591 de 1991, art. 46; Constitución Política, art. 282, num. 3", "o": [["A", "la Defensoría del Pueblo, que puede interponer tutelas en nombre de cualquier persona que se lo solicite.", "El artículo 46 del Decreto 2591 de 1991 faculta al Defensor del Pueblo para interponer la tutela en nombre de cualquier persona que se lo solicite o que esté en situación de desamparo, y el numeral 3 del artículo 282 de la Constitución le asigna esa función.", true], ["B", "la Registraduría Nacional, porque primero deben regularizar su documento de identidad.", "La protección de derechos fundamentales no depende de la regularización migratoria ni corresponde a la Registraduría. La Defensoría puede presentar la tutela en su nombre.", false], ["C", "la Contraloría departamental, que vigila los recursos de salud del departamento.", "La contraloría ejerce control fiscal; no está facultada para interponer tutelas en nombre de las personas.", false]]}, {"id": "EC-135", "niv": 1, "e": "Para el migrante procesado penalmente que no tiene recursos, la orientación correcta es acudir a", "f": "Constitución Política, art. 282, num. 4", "o": [["A", "la personería municipal, que le asignará como defensor a uno de los abogados de su planta.", "El personero interviene en los procesos penales como agente del Ministerio Público, no como defensor del procesado. La defensoría pública la organiza y dirige el Defensor del Pueblo.", false], ["B", "la Defensoría del Pueblo, que organiza y dirige la defensoría pública.", "El numeral 4 del artículo 282 de la Constitución asigna al Defensor del Pueblo la función de organizar y dirigir la defensoría pública en los términos que señale la ley.", true], ["C", "la Fiscalía General de la Nación, que debe designarle un fiscal como defensor de oficio.", "La Fiscalía es la parte acusadora en el proceso penal; no puede asumir la defensa del procesado.", false]]}, {"id": "EC-136", "niv": 2, "e": "Frente a la afirmación del contratista sobre la elección del Defensor del Pueblo, lo correcto es aclarar que lo elige", "f": "Constitución Política, arts. 276 y 281", "o": [["A", "el Congreso en pleno, de lista de elegibles conformada por convocatoria pública.", "Esa es la forma de elección del Contralor General de la República (art. 267). El Defensor lo elige la Cámara de Representantes.", false], ["B", "el Senado de la República, de terna integrada por el Presidente, la Corte Suprema y el Consejo de Estado.", "Esa es la forma de elección del Procurador General de la Nación (art. 276), no la del Defensor del Pueblo.", false], ["C", "la Cámara de Representantes, de terna elaborada por el Presidente de la República.", "El artículo 281 de la Constitución, modificado por el Acto Legislativo 2 de 2015, dispone que el Defensor del Pueblo ejerce sus funciones de manera autónoma y es elegido por la Cámara de Representantes para un periodo de cuatro años, de terna elaborada por el Presidente de la República.", true]]}]}, {"comp": "estado_constitucion", "rol": "general", "tag": "Estado y Constitución · Delegación de funciones", "texto": "Usted es profesional universitario de la Secretaría Jurídica de un municipio de primera categoría. El alcalde quiere que el secretario de Gobierno asuma la función de otorgar los permisos para la realización de espectáculos públicos en el municipio, que hoy firma el propio alcalde, y le pide preparar el acto correspondiente. El secretario de Gobierno, por su parte, ya anunció que, una vez reciba la función, la trasladará a un profesional universitario de su despacho para agilizar los trámites. Un asesor sostiene que, si algo sale mal, el alcalde seguirá respondiendo por todo.", "items": [{"id": "EC-149", "niv": 1, "e": "Para que el secretario de Gobierno asuma válidamente la función, el acto de delegación debe", "f": "Ley 489 de 1998, art. 10", "o": [["A", "constar por escrito y determinar la autoridad delegataria y las funciones o asuntos específicos que se transfieren.", "El artículo 10 de la Ley 489 de 1998 dispone que el acto de delegación siempre será escrito y en él se determinarán la autoridad delegataria y las funciones o asuntos específicos cuya atención y decisión se transfieren.", true], ["B", "ser aprobado previamente por el concejo municipal mediante acuerdo.", "La delegación es un acto de la autoridad delegante. La Ley 489 no exige un acuerdo del concejo para que el alcalde delegue funciones en sus colaboradores.", false], ["C", "comunicarse verbalmente en consejo de gobierno, dejando constancia en el acta de la reunión firmada por los asistentes.", "La delegación no puede ser verbal: el artículo 10 de la Ley 489 exige que el acto sea siempre escrito e identifique al delegatario y las funciones.", false]]}, {"id": "EC-150", "niv": 3, "e": "Frente a la afirmación del asesor sobre la responsabilidad, lo correcto es explicar que la delegación", "f": "Constitución Política, art. 211; Ley 489 de 1998, arts. 10 y 12; Corte Constitucional, Sentencia C-372 de 2002", "o": [["A", "traslada la responsabilidad al delegatario de forma definitiva, sin que el alcalde pueda volver a ejercer la función ni revisar los actos expedidos.", "La delegación no es definitiva: el artículo 12 de la Ley 489 permite a la autoridad delegante reasumir en cualquier tiempo la competencia y revisar los actos del delegatario.", false], ["B", "en principio exime al alcalde, que conserva deberes de dirección y vigilancia y puede reformar o revocar los actos del delegatario.", "El artículo 211 de la Constitución dispone que la delegación exime de responsabilidad al delegante, la cual corresponde al delegatario, cuyos actos puede siempre reformar o revocar aquel, reasumiendo la responsabilidad. La Corte Constitucional (C-372 de 2002) precisó que el delegante no responde por los actos del delegatario, pero sí por sus propios deberes de dirección, orientación, instrucción y seguimiento; el artículo 10 de la Ley 489 le exige informarse del desarrollo de la delegación y el artículo 12 le permite reasumir la competencia.", true], ["C", "no cambia nada, porque el alcalde sigue respondiendo por todos los actos del secretario delegatario.", "El artículo 211 de la Constitución dispone lo contrario: la delegación exime de responsabilidad al delegante y la traslada al delegatario, sin perjuicio de que el delegante responda por sus propios deberes de orientación y seguimiento.", false]]}, {"id": "EC-151", "niv": 3, "e": "Sobre la intención del secretario de trasladar la función recibida a un profesional de su despacho, usted debe conceptuar que", "f": "Ley 489 de 1998, art. 11, num. 2", "o": [["A", "es posible siempre que lo haga mediante acto escrito y lo informe oportunamente al alcalde.", "Cumplir la forma escrita e informar al alcalde no subsana la prohibición: las funciones recibidas en virtud de delegación no son delegables (art. 11, num. 2).", false], ["B", "es posible si el profesional pertenece al nivel directivo o asesor del municipio.", "El nivel del empleado es una condición para ciertas delegaciones, pero aquí el obstáculo es otro: la función ya fue recibida por delegación y no puede volver a delegarse.", false], ["C", "no es posible, porque las funciones recibidas por delegación no pueden transferirse nuevamente.", "El numeral 2 del artículo 11 de la Ley 489 de 1998 prohíbe transferir mediante delegación las funciones, atribuciones y potestades recibidas en virtud de delegación.", true]]}]}, {"comp": "estado_constitucion", "rol": "general", "tag": "Estado y Constitución · Veedurías ciudadanas", "texto": "Usted es técnico administrativo de la Secretaría de Infraestructura de un municipio de cuarta categoría, donde se ejecuta la ampliación del acueducto veredal. Un grupo de habitantes decide constituir una veeduría y pregunta dónde inscribirla. Entre los interesados en ser veedores está el propietario de la ferretería que provee los tubos al contratista. Semanas después, los veedores llegan a la obra y exigen que se detenga de inmediato porque, según ellos, el material no cumple las especificaciones.", "items": [{"id": "EC-161", "niv": 1, "e": "Para formalizar la veeduría, los ciudadanos deben inscribir el documento o acta de constitución ante", "f": "Ley 850 de 2003, art. 3", "o": [["A", "la secretaría de infraestructura que ejecuta la obra vigilada.", "Inscribir la veeduría ante la entidad vigilada afectaría su autonomía. La ley prevé el registro ante personerías o cámaras de comercio.", false], ["B", "la Registraduría Nacional del Estado Civil, en su sede municipal.", "La Registraduría no lleva el registro de veedurías ciudadanas; esa función la asigna la Ley 850 a las personerías y a las cámaras de comercio.", false], ["C", "la personería municipal o la cámara de comercio, que llevan su registro público.", "El artículo 3 de la Ley 850 de 2003 dispone que la inscripción del documento de constitución se realiza ante las personerías municipales o distritales o ante las cámaras de comercio, que llevan el registro público de las veedurías.", true]]}, {"id": "EC-162", "niv": 2, "e": "Sobre el propietario de la ferretería que provee los tubos, usted debe advertir que", "f": "Ley 850 de 2003, art. 19, lit. a", "o": [["A", "está impedido para ser veedor, porque es proveedor de la obra objeto de vigilancia.", "El literal a del artículo 19 de la Ley 850 de 2003 establece el impedimento para ser veedor cuando se es contratista, interventor, proveedor o trabajador de la obra, contrato o programa vigilado, o se tiene interés patrimonial en su ejecución.", true], ["B", "puede ser veedor, pero no podrá votar las decisiones relacionadas con los materiales.", "La ley no prevé una participación parcial: el impedimento le impide ser veedor de esa obra.", false], ["C", "puede ser veedor, siempre que declare por escrito su relación comercial con el contratista.", "Declarar el interés no lo elimina. La Ley 850 establece un impedimento para quienes sean proveedores de la obra vigilada.", false]]}, {"id": "EC-163", "niv": 3, "e": "Frente a la exigencia de los veedores de detener la obra, la respuesta adecuada es explicarles que", "f": "Ley 850 de 2003, arts. 16, 17 y 20", "o": [["A", "no se les dará ninguna información técnica hasta que termine la obra, para no interferir en la ejecución.", "Negar la información desconoce el derecho de las veedurías a obtenerla de los supervisores, contratistas y entidades, información que es de obligatoria respuesta (art. 17).", false], ["B", "la veeduría no puede suspender la obra por sí misma, pero sí pedir información, de obligatoria respuesta, y denunciar.", "El artículo 20 de la Ley 850 prohíbe a las veedurías retrasar, impedir o suspender los programas o contratos sin el concurso de la autoridad competente; el artículo 17 hace obligatoria la respuesta a la información que soliciten, y el artículo 16 les permite denunciar.", true], ["C", "la obra debe suspenderse de inmediato, porque la veeduría tiene la facultad de ordenarlo cuando detecta irregularidades.", "La Ley 850 no otorga a las veedurías facultad de suspender contratos; se lo prohíbe sin el concurso de autoridad competente (art. 20).", false]]}]}, {"comp": "estado_constitucion", "rol": "general", "tag": "Estado y Constitución · Estado social de derecho y espacio público", "texto": "Usted es profesional universitario de la Secretaría de Gobierno de un municipio de segunda categoría que prepara un plan para recuperar el espacio público del centro, ocupado por cerca de 200 vendedores informales. En la mesa de trabajo, un asesor propone desalojar a todos sin más consideraciones «porque el interés general prevalece siempre»; un líder de los vendedores responde que el derecho al trabajo impide cualquier recuperación. Un ciudadano anuncia que acudirá al juez si la alcaldía no actúa. Entre los vendedores hay un hombre con discapacidad física cuya única fuente de ingresos es su puesto.", "items": [{"id": "EC-173", "niv": 2, "e": "Frente a las posiciones del asesor y del líder de los vendedores, el plan debe partir de que el Estado social de derecho", "f": "Constitución Política, arts. 1 y 2", "o": [["A", "impide recuperar el espacio público mientras exista una sola persona que derive su sustento de él.", "El derecho al trabajo no es absoluto ni impide a la administración proteger el espacio público. Se trata de armonizar ambos fundamentos, no de suprimir uno.", false], ["B", "se funda en la prevalencia del interés general como único fundamento, por lo que procede el desalojo sin más consideraciones.", "La prevalencia del interés general es uno de los fundamentos del Estado social de derecho, pero no el único: el artículo 1 también lo funda en la dignidad humana, el trabajo y la solidaridad.", false], ["C", "exige armonizar la prevalencia del interés general con la dignidad humana y el trabajo, que también son sus fundamentos.", "El artículo 1 de la Constitución funda el Estado social de derecho en el respeto de la dignidad humana, en el trabajo, en la solidaridad y en la prevalencia del interés general, y el artículo 2 ordena a las autoridades proteger a todas las personas. El plan debe conciliar estos fundamentos.", true]]}, {"id": "EC-174", "niv": 2, "e": "Si la alcaldía no actúa, el ciudadano que pretende la protección del espacio público puede acudir a", "f": "Constitución Política, art. 88; Ley 472 de 1998, arts. 2 y 9", "o": [["A", "la acción popular, porque el espacio público es un derecho colectivo.", "El artículo 88 de la Constitución incluye el espacio público entre los derechos e intereses colectivos protegidos por las acciones populares, que proceden contra las acciones u omisiones de las autoridades que los amenacen o vulneren (Ley 472, arts. 2 y 9).", true], ["B", "la acción de grupo, porque los afectados por la ocupación del centro son más de veinte personas.", "La acción de grupo busca indemnizar perjuicios individuales. El ciudadano pretende que se proteja el espacio público, finalidad de la acción popular.", false], ["C", "la acción de tutela, porque el espacio público es un derecho fundamental de cada ciudadano.", "El espacio público es un derecho colectivo; la tutela no procede para proteger derechos colectivos (Decreto 2591, art. 6, num. 3), salvo para evitar un perjuicio irremediable a un derecho fundamental propio.", false]]}, {"id": "EC-175", "niv": 3, "e": "Frente al vendedor con discapacidad física y sin otra fuente de ingresos, la Constitución impone a la alcaldía", "f": "Constitución Política, art. 13, inc. 3", "o": [["A", "darle el mismo trato que a los demás vendedores, porque cualquier diferencia sería un trato discriminatorio.", "La igualdad no exige trato idéntico en todos los casos. El inciso 3 del artículo 13 ordena una protección especial a quienes están en circunstancia de debilidad manifiesta.", false], ["B", "brindarle protección especial por su debilidad manifiesta, sin que ello impida recuperar el espacio público.", "El inciso 3 del artículo 13 de la Constitución ordena al Estado proteger especialmente a quienes por su condición económica, física o mental se encuentren en circunstancia de debilidad manifiesta. Esa protección se materializa en medidas diferenciadas dentro del plan, no en la renuncia a proteger el espacio público.", true], ["C", "otorgarle un permiso indefinido para permanecer en el espacio público, por ser sujeto de especial protección.", "La protección especial no convierte el espacio público en un bien apropiable de forma indefinida; exige medidas que atiendan su situación, compatibles con el interés colectivo.", false]]}]}, {"comp": "estado_constitucion", "rol": "profesional", "tag": "Estado y Constitución · Nivel profesional · Acción de tutela: reparto y medidas provisionales", "texto": "Usted es profesional especializado de la Dirección Jurídica de una secretaría distrital de Bogotá. Un ciudadano presentó una tutela contra la secretaría por la suspensión de un apoyo económico, y el juez, al admitirla, ordenó suspender la resolución que le retiró el apoyo mientras decide. En otro asunto, una tutela que el mismo ciudadano dirigió exclusivamente contra una entidad del orden nacional fue repartida por error a un juez municipal. Su jefe le pide un concepto breve sobre estas actuaciones.", "items": [{"id": "EC-176", "niv": 2, "e": "Según las reglas de reparto vigentes, la tutela contra la secretaría distrital debe repartirse, en primera instancia, a", "f": "Decreto 1069 de 2015, art. 2.2.3.1.2.1, num. 1 (modificado por el Decreto 333 de 2021)", "o": [["A", "los jueces del circuito, por tratarse de una entidad de la capital de la República.", "Ser una entidad de Bogotá no la convierte en entidad del orden nacional. Las tutelas contra entidades del orden distrital se reparten a los jueces municipales.", false], ["B", "los jueces administrativos, por dirigirse contra un acto administrativo.", "La tutela no se reparte según la naturaleza del acto, sino según la autoridad accionada; para las distritales, a los jueces municipales.", false], ["C", "los jueces municipales, por dirigirse contra una entidad del orden distrital.", "El numeral 1 del artículo 2.2.3.1.2.1 del Decreto 1069 de 2015, modificado por el Decreto 333 de 2021, dispone que las tutelas contra autoridades, organismos o entidades del orden departamental, distrital o municipal y contra particulares se reparten en primera instancia a los jueces municipales.", true]]}, {"id": "EC-177", "niv": 3, "e": "Respecto de la tutela contra la entidad nacional repartida por error al juez municipal, lo correcto es afirmar que este", "f": "Decreto 1069 de 2015, art. 2.2.3.1.2.1, parágrafo 2 (modificado por el Decreto 333 de 2021); Corte Constitucional, Autos 193 de 2021 y 045 de 2022", "o": [["A", "no puede rechazar el conocimiento con base en las reglas de reparto, que son administrativas.", "El parágrafo 2 del artículo 2.2.3.1.2.1 del Decreto 1069 de 2015 dispone que las reglas de reparto no pueden ser invocadas por ningún juez para rechazar la competencia o plantear conflictos negativos. La Corte Constitucional ha reiterado que son reglas administrativas de reparto.", true], ["B", "debe declararse incompetente y remitirla al juez del circuito, que es el competente según el reparto.", "Las reglas de reparto no autorizan al juez a declararse incompetente. El parágrafo 2 lo prohíbe y la Corte Constitucional ha reiterado que esos conflictos son aparentes.", false], ["C", "debe rechazarla de plano y ordenar al ciudadano presentarla de nuevo ante el juez correcto.", "Rechazar la tutela por razones de reparto desconoce el parágrafo 2 y el carácter preferente y sumario de la acción.", false]]}, {"id": "EC-178", "niv": 2, "e": "La orden del juez de suspender la resolución mientras decide la tutela corresponde a", "f": "Decreto 2591 de 1991, art. 7", "o": [["A", "una decisión irregular, porque la suspensión de un acto administrativo solo puede decretarla el juez contencioso administrativo.", "El juez de tutela está expresamente facultado para suspender provisionalmente el acto concreto que amenaza o vulnera el derecho (art. 7).", false], ["B", "una medida provisional que el juez puede adoptar desde la presentación de la solicitud cuando la considere necesaria y urgente.", "El artículo 7 del Decreto 2591 de 1991 permite al juez, desde la presentación de la solicitud y cuando lo considere necesario y urgente para proteger el derecho, suspender la aplicación del acto concreto que lo amenace o vulnere.", true], ["C", "una anticipación del fallo, que solo puede dictarse si el ciudadano presta caución.", "La medida provisional no exige caución ni equivale al fallo. Busca evitar que la amenaza se consume mientras se decide.", false]]}]}, {"comp": "estado_constitucion", "rol": "general", "tag": "Estado y Constitución · Rendición de cuentas: concejo y audiencias", "texto": "Usted es técnico administrativo de la oficina de planeación de un municipio de quinta categoría. El alcalde presentó al concejo su informe anual de rendición de cuentas, y la mesa directiva pregunta de cuánto tiempo dispone para evaluarlo. Además, el jefe de planeación reconoce que la alcaldía no ha desarrollado espacios de diálogo con la ciudadanía y pregunta qué obligación tiene en ese caso. En la reunión, un concejal pide definir qué se entiende por rendición de cuentas.", "items": [{"id": "EC-191", "niv": 2, "e": "Para evaluar, dictaminar y responder el informe anual de rendición de cuentas del alcalde, el concejo dispone de", "f": "Ley 1757 de 2015, art. 57, parágrafo", "o": [["A", "quince días hábiles.", "No corresponde al término legal. El parágrafo del artículo 57 de la Ley 1757 fija un mes.", false], ["B", "un mes.", "El parágrafo del artículo 57 de la Ley 1757 de 2015 dispone que los concejos municipales y distritales, las asambleas y las juntas administradoras locales tienen un mes de plazo para evaluar, dictaminar y responder los informes anuales de rendición de cuentas de alcaldes y gobernadores.", true], ["C", "tres meses.", "Tres meses es el plazo en el que los presidentes de las corporaciones elaboran su propio informe de rendición de cuentas (art. 59), no el término para evaluar el informe del alcalde.", false]]}, {"id": "EC-192", "niv": 1, "e": "Si la alcaldía no adelanta espacios de diálogo para la rendición de cuentas, está obligada a realizar audiencias públicas participativas como mínimo", "f": "Ley 1757 de 2015, art. 53", "o": [["A", "una vez al año.", "La ley exige una periodicidad mayor cuando la entidad no adelanta espacios de diálogo: mínimo dos veces al año.", false], ["B", "dos veces al año.", "El artículo 53 de la Ley 1757 de 2015 dispone que, si una entidad no adelanta espacios de diálogo para la rendición de cuentas, estará obligada a realizar audiencias públicas participativas mínimo dos veces al año.", true], ["C", "cuatro veces al año.", "La ley no exige una audiencia trimestral; el mínimo es de dos audiencias al año.", false]]}, {"id": "EC-193", "niv": 1, "e": "Al concejal debe explicarse que la rendición de cuentas es", "f": "Ley 1757 de 2015, art. 48", "o": [["A", "una auditoría que realiza la contraloría sobre los resultados de la gestión de la alcaldía.", "La auditoría es un instrumento del control fiscal. La rendición de cuentas es un proceso de la propia administración ante la ciudadanía.", false], ["B", "un informe escrito que el alcalde entrega una vez al año al concejo municipal, sin participación directa de la ciudadanía.", "La rendición de cuentas no se reduce al informe ante el concejo; la ley la define como un proceso dirigido a ciudadanos, sociedad civil, entidades y órganos de control, a partir del diálogo.", false], ["C", "un proceso en el que las entidades informan y explican su gestión a partir del diálogo, como expresión de control social.", "El artículo 48 de la Ley 1757 de 2015 define la rendición de cuentas como el proceso mediante el cual las entidades y servidores informan, explican y dan a conocer los resultados de su gestión a la ciudadanía y otros actores, a partir de la promoción del diálogo, y la califica como expresión de control social.", true]]}]}, {"comp": "empleo_publico", "rol": "general", "tag": "Empleo público, carrera y régimen disciplinario · Concurso de méritos y lista de elegibles", "texto": "Una alcaldía distrital participa en un proceso de selección de la Comisión Nacional del Servicio Civil. Usted, técnico administrativo de la Dirección de Talento Humano, recibe tres consultas: un aspirante pide que se le admitan documentos de experiencia que no cargó en la plataforma dentro de la fecha fijada en la convocatoria, porque «la alcaldía puede flexibilizar las reglas»; el jefe de la dependencia pregunta cuánto tiempo podrá usarse la lista de elegibles una vez quede en firme; y la secretaria general pregunta si con esa lista se puede cubrir una vacante definitiva de un empleo equivalente que no fue convocado y que surgió tres meses después de la convocatoria en la misma alcaldía.", "items": [{"id": "EP-110", "niv": 1, "e": "Frente a la solicitud del aspirante, usted le responde que", "f": "Ley 909 de 2004, art. 31, num. 1", "o": [["A", "la convocatoria es la norma reguladora del concurso y obliga por igual a la administración, a la entidad que lo ejecuta y a los participantes.", "El art. 31, num. 1, de la Ley 909 de 2004 define la convocatoria como norma reguladora de todo concurso, que obliga a la administración, a las entidades contratadas para realizarlo y a los participantes; por eso no es posible aceptar documentos por fuera de las fechas fijadas.", true], ["B", "puede radicar los documentos como derecho de petición para que se valoren en la etapa de pruebas escritas.", "El derecho de petición no sirve para modificar las reglas del concurso ni para acreditar requisitos por fuera de los plazos de la convocatoria, que es obligatoria para todos.", false], ["C", "la alcaldía puede recibir los documentos, porque como entidad nominadora tiene la facultad de ajustar los plazos del concurso.", "La entidad no puede modificar unilateralmente las reglas: la convocatoria la obliga igual que a los aspirantes, según el art. 31, num. 1, de la Ley 909 de 2004.", false]]}, {"id": "EP-111", "niv": 1, "e": "Al jefe de la dependencia usted le informa que la lista de elegibles tendrá una vigencia de", "f": "Ley 909 de 2004, art. 31, num. 4 (modificado por el art. 6 de la Ley 1960 de 2019)", "o": [["A", "un año, contado desde su firmeza.", "Ese era un término de normas anteriores; la Ley 909 de 2004, modificada por la Ley 1960 de 2019, fija hoy una vigencia de dos años.", false], ["B", "dos años.", "El art. 31, num. 4, de la Ley 909 de 2004, modificado por el art. 6 de la Ley 1960 de 2019, establece que la lista de elegibles, elaborada en estricto orden de mérito, tendrá una vigencia de dos años.", true], ["C", "cuatro años.", "La vigencia de cuatro años corresponde a la lista para elegir a los comisionados de la CNSC (art. 9 de la Ley 909 de 2004), no a las listas de los procesos de selección de empleos de carrera.", false]]}, {"id": "EP-112", "niv": 3, "e": "A la secretaria general usted le responde que la vacante del empleo equivalente", "f": "Ley 909 de 2004, art. 31, num. 4 (modificado por el art. 6 de la Ley 1960 de 2019)", "o": [["A", "no puede cubrirse con la lista, porque esta solo sirve para los empleos expresamente ofertados en la convocatoria.", "La Ley 1960 de 2019 amplió el uso de la lista: además de las vacantes convocadas, cubre las vacantes definitivas de cargos equivalentes no convocados que surjan después de la convocatoria en la misma entidad.", false], ["B", "puede cubrirse con la lista de cualquier entidad del distrito, siempre que el empleo tenga igual denominación y grado.", "La norma limita el uso a cargos equivalentes de la misma entidad que adelantó el concurso; no autoriza usar listas de otras entidades por la sola coincidencia de denominación y grado.", false], ["C", "puede cubrirse con la lista, en estricto orden de mérito, porque es un cargo equivalente no convocado que surgió con posterioridad en la misma entidad.", "El art. 31, num. 4, de la Ley 909 de 2004, modificado por la Ley 1960 de 2019, dispone que con la lista se cubran las vacantes convocadas y las vacantes definitivas de cargos equivalentes no convocados que surjan con posterioridad a la convocatoria en la misma entidad.", true]]}]}, {"comp": "empleo_publico", "rol": "profesional", "tag": "Empleo público, carrera y régimen disciplinario · Nivel profesional · Evaluación del desempeño laboral", "texto": "Usted es profesional universitario de la Secretaría de Educación de un departamento y, como jefe inmediato, evalúa a cuatro técnicos de carrera con el sistema tipo de la CNSC. En mayo, el secretario de despacho le remite un informe documentado según el cual uno de los técnicos ha dejado vencer de forma reiterada los términos de los trámites a su cargo. Otro técnico, inconforme con su calificación definitiva del período anterior, le pregunta qué recursos puede interponer. Además, un servidor recién trasladado a su grupo le pide que le explique cómo está organizado el período de evaluación.", "items": [{"id": "EP-126", "niv": 1, "e": "Al servidor recién trasladado usted le explica que la calificación del período anual", "f": "Ley 909 de 2004, art. 38; Acuerdo CNSC 6176 de 2018", "o": [["A", "incluye dos evaluaciones parciales en el año.", "El art. 38 de la Ley 909 de 2004 dispone que el resultado de la evaluación es la calificación del período anual, que debe incluir dos evaluaciones parciales; el sistema tipo de la CNSC (Acuerdo 6176 de 2018) las organiza por semestres.", true], ["B", "depende de una sola evaluación que el jefe realiza al final del año.", "La ley exige dos evaluaciones parciales dentro del período anual; una sola evaluación al cierre no cumple el art. 38 de la Ley 909 de 2004.", false], ["C", "se construye con cuatro evaluaciones trimestrales obligatorias.", "La ley habla de dos evaluaciones parciales al año, no de cuatro trimestrales; las entidades pueden hacer seguimientos, pero el esquema legal es semestral.", false]]}, {"id": "EP-127", "niv": 2, "e": "Frente al informe documentado sobre el desempeño deficiente del técnico, el jefe del organismo puede", "f": "Ley 909 de 2004, art. 38", "o": [["A", "declarar insubsistente el nombramiento con base en el informe, sin necesidad de evaluar al técnico.", "La insubsistencia de un empleado de carrera exige una calificación no satisfactoria producto de la evaluación (arts. 41 y 43 de la Ley 909 de 2004); un informe no reemplaza la evaluación.", false], ["B", "esperar al cierre del período anual, porque antes de esa fecha no es posible calificar al empleado.", "La ley prevé una excepción: si el jefe del organismo recibe información debidamente soportada de desempeño deficiente, puede ordenar una evaluación inmediata sin esperar el cierre del período.", false], ["C", "ordenar por escrito que se evalúen y califiquen de inmediato los servicios del técnico.", "El art. 38 de la Ley 909 de 2004 faculta al jefe del organismo para ordenar, por escrito, la evaluación y calificación inmediata cuando recibe información debidamente soportada de que el desempeño de un empleado es deficiente.", true]]}, {"id": "EP-128", "niv": 2, "e": "Al técnico inconforme con su calificación definitiva usted le informa que contra ella proceden", "f": "Ley 909 de 2004, art. 38", "o": [["A", "los recursos de reposición y de apelación.", "El art. 38 de la Ley 909 de 2004 dispone que sobre la evaluación definitiva del desempeño proceden los recursos de reposición y de apelación.", true], ["B", "únicamente el recurso de reposición ante usted como evaluador.", "Limitarlo a la reposición confunde esta regla con la del acto de insubsistencia (art. 43 de la Ley 909 de 2004); contra la evaluación definitiva la ley admite también la apelación.", false], ["C", "la acción de tutela como único medio, porque la calificación es un acto de trámite.", "La calificación definitiva es un acto que admite recursos en sede administrativa; la ley prevé expresamente la reposición y la apelación, por lo que la tutela no es el único medio.", false]]}]}, {"comp": "empleo_publico", "rol": "general", "tag": "Empleo público, carrera y régimen disciplinario · Permisos", "texto": "En la Secretaría de Desarrollo Económico de una gobernación, tres servidores hacen solicitudes a la oficina de talento humano, donde usted trabaja: un técnico pide permiso remunerado para asistir a la diligencia de entrega de un inmueble que compró; una profesional, empleada de carrera, fue invitada por una universidad pública a dictar una cátedra de cuatro horas semanales en horario laboral y pregunta si puede hacerlo; y la misma profesional pregunta si puede recibir los honorarios de esa cátedra además de su salario.", "items": [{"id": "EP-141", "niv": 1, "e": "Sobre la solicitud del técnico, usted le informa que el permiso remunerado", "f": "Decreto 1083 de 2015, art. 2.2.5.5.17", "o": [["A", "puede concederse hasta por cinco días hábiles y lo autoriza el jefe inmediato.", "El término máximo del permiso remunerado es de tres días hábiles, y la facultad de autorizarlo corresponde al nominador o a su delegado.", false], ["B", "puede concederse hasta por tres días hábiles cuando medie justa causa, y lo autoriza o niega el nominador o su delegado.", "El art. 2.2.5.5.17 del Decreto 1083 de 2015 permite solicitar por escrito permiso remunerado hasta por tres días hábiles cuando medie justa causa, y atribuye al nominador o a su delegado la facultad de autorizarlo o negarlo.", true], ["C", "solo procede por calamidad doméstica comprobada; para trámites personales debe pedir licencia ordinaria.", "La norma no limita el permiso a la calamidad doméstica; exige justa causa, que el nominador valora.", false]]}, {"id": "EP-142", "niv": 1, "e": "Frente a la cátedra universitaria en horario laboral, usted le explica a la profesional que", "f": "Decreto 1083 de 2015, art. 2.2.5.5.20", "o": [["A", "puede otorgársele permiso remunerado para la docencia en hora cátedra hasta por cinco horas semanales, según las necesidades del servicio.", "El art. 2.2.5.5.20 del Decreto 1083 de 2015 permite otorgar permiso remunerado para ejercer la docencia universitaria en hora cátedra hasta por cinco horas semanales, sujeto a las necesidades del servicio a juicio del jefe del organismo; las cuatro horas pedidas están dentro del límite.", true], ["B", "no puede hacerlo, porque toda actividad docente debe realizarse por fuera de la jornada laboral.", "El reglamento prevé un permiso remunerado específico para la docencia universitaria en hora cátedra dentro de la jornada, hasta cinco horas semanales.", false], ["C", "debe pedir una comisión de estudios, porque es la figura prevista para actividades académicas.", "La comisión de estudios es para que el empleado reciba formación, no para que dicte clases; para la docencia universitaria en hora cátedra existe un permiso específico.", false]]}, {"id": "EP-143", "niv": 3, "e": "Sobre los honorarios de la cátedra, usted le responde a la profesional que", "f": "Constitución Política, art. 128; Ley 4 de 1992, art. 19; Ley 1952 de 2019, art. 39, num. 13", "o": [["A", "no puede recibirlos, porque la Constitución prohíbe recibir más de una asignación del tesoro público sin excepción.", "La prohibición del art. 128 de la Constitución admite las excepciones que señale la ley, y la Ley 4 de 1992 (art. 19) exceptúa los honorarios por hora cátedra.", false], ["B", "puede recibirlos solo si renuncia a la parte proporcional de su salario por las horas dedicadas a la cátedra.", "La ley no exige descontar el salario; la excepción permite percibir los honorarios de hora cátedra junto con la asignación del empleo, dentro de los límites legales.", false], ["C", "puede recibirlos, porque los honorarios por hora cátedra son una excepción legal a la prohibición de recibir más de una asignación del tesoro público.", "El art. 128 de la Constitución prohíbe recibir más de una asignación del tesoro salvo los casos que determine la ley, y el art. 19 de la Ley 4 de 1992 exceptúa los honorarios percibidos por hora cátedra; la Ley 1952 de 2019 (art. 39, num. 13) remite a esas excepciones legales.", true]]}]}, {"comp": "empleo_publico", "rol": "general", "tag": "Empleo público, carrera y régimen disciplinario · Encargo y asignación de funciones", "texto": "En la Secretaría de Hacienda de un municipio de segunda categoría se presentan dos novedades. El tesorero, empleo de libre nombramiento y remoción, viajará diez días hábiles en comisión de servicios a otra ciudad del país para una capacitación, y la secretaria quiere que alguien atienda sus funciones mientras tanto. Además, una profesional universitaria de carrera obtuvo licencia ordinaria de dos meses, y un técnico de carrera con evaluación sobresaliente será encargado de ese empleo, de mayor remuneración. Usted, profesional de talento humano, debe proyectar los actos y responder las dudas de los servidores.", "items": [{"id": "EP-147", "niv": 3, "e": "Para que alguien atienda las funciones del tesorero durante su comisión, la figura que procede es", "f": "Decreto 1083 de 2015, arts. 2.2.5.2.2 y 2.2.5.5.52", "o": [["A", "la asignación de las funciones a otro empleado que desempeñe un cargo de la misma naturaleza.", "La comisión de servicios al interior no genera vacancia temporal (art. 2.2.5.2.2, num. 4, del Decreto 1083 de 2015); cuando la situación no genera vacancia pero implica separación transitoria de funciones, el jefe puede asignarlas a otro empleado de un cargo de la misma naturaleza (art. 2.2.5.5.52).", true], ["B", "el encargo del tesorero, porque toda comisión deja vacante temporalmente el empleo del comisionado.", "La comisión de servicios al interior no genera vacancia temporal (Decreto 1083 de 2015, art. 2.2.5.2.2, num. 4); por eso no procede el encargo.", false], ["C", "un nombramiento provisional por diez días hábiles, porque el empleo de tesorero no puede quedar sin titular.", "El nombramiento provisional es para empleos de carrera en vacancia; el tesorero no deja vacante el empleo durante una comisión de servicios al interior.", false]]}, {"id": "EP-148", "niv": 2, "e": "Si se asignan las funciones del tesorero a otro servidor, este tendrá derecho a", "f": "Decreto 1083 de 2015, art. 2.2.5.5.52", "o": [["A", "una bonificación especial equivalente a la mitad del salario del tesorero.", "No existe en el reglamento una bonificación por asignación de funciones; el servidor conserva su salario sin diferencia salarial.", false], ["B", "seguir recibiendo el salario de su propio empleo, sin diferencia salarial.", "El art. 2.2.5.5.52 del Decreto 1083 de 2015 dispone que el empleado a quien se asignan funciones no tiene derecho al pago de la diferencia salarial y no se entiende desvinculado de las funciones de su propio cargo.", true], ["C", "la diferencia salarial entre su empleo y el de tesorero durante los diez días.", "El reglamento excluye expresamente la diferencia salarial en la asignación de funciones; ese derecho es propio del encargo.", false]]}, {"id": "EP-149", "niv": 3, "e": "Mientras dure el encargo en el empleo de la profesional en licencia ordinaria, el técnico tendrá derecho a", "f": "Decreto 1083 de 2015, art. 2.2.5.5.44", "o": [["A", "recibir ambos salarios, el de técnico y el de profesional, porque ejerce dos empleos a la vez.", "Recibir dos asignaciones del tesoro está prohibido salvo excepción legal; el encargado recibe el salario del empleo encargado, no la suma de ambos.", false], ["B", "conservar el salario de técnico, porque en las vacancias temporales nunca se paga diferencia salarial.", "El reglamento sí reconoce la diferencia salarial en el encargo cuando el titular no percibe el salario, como ocurre en la licencia ordinaria no remunerada.", false], ["C", "percibir el salario del empleo de profesional, porque la titular no lo recibe durante la licencia.", "El art. 2.2.5.5.44 del Decreto 1083 de 2015 da al encargado derecho al salario del empleo que desempeña temporalmente, siempre que no deba ser percibido por su titular; la licencia ordinaria es no remunerada, así que la profesional no lo recibe.", true]]}, {"id": "EP-150", "niv": 1, "e": "Si el técnico pregunta qué pasa con sus derechos de carrera al aceptar el encargo, usted le responde que", "f": "Ley 909 de 2004, art. 42, num. 3; Decreto 1083 de 2015, art. 2.2.5.5.46", "o": [["A", "quedan suspendidos mientras dure el encargo y se reactivan solo si la Comisión de Personal lo aprueba.", "No hay suspensión de derechos ni aprobación de la Comisión de Personal; la ley simplemente dispone que no se pierden.", false], ["B", "los pierde, pero puede recuperarlos si concursa de nuevo para su empleo.", "La ley establece lo contrario: los derechos de carrera no se pierden por tomar posesión de un empleo en encargo.", false], ["C", "los conserva, porque tomar posesión de un empleo en encargo no implica perderlos.", "El art. 42, num. 3, de la Ley 909 de 2004 dispone que los derechos de carrera no se pierden cuando el empleado toma posesión de un empleo para el cual fue designado en encargo; al terminar, reasume su empleo (Decreto 1083 de 2015, art. 2.2.5.5.46).", true]]}]}, {"comp": "empleo_publico", "rol": "profesional", "tag": "Empleo público, carrera y régimen disciplinario · Nivel profesional · Gravedad de la falta y graduación de la sanción", "texto": "Usted es profesional especializado de la oficina de control disciplinario interno de una gobernación y debe orientar a un abogado recién vinculado. En un proceso, el investigado es un director técnico que incumplió un deber de su cargo; el abogado no sabe si calificar la falta como grave o leve. En otro proceso, el disciplinado aceptó los cargos que se le formularon y el abogado pregunta qué efecto tiene eso al fijar la duración de la suspensión.", "items": [{"id": "EP-166", "niv": 2, "e": "Al explicar cómo se clasifica la falta del director técnico, usted le indica que", "f": "Ley 1952 de 2019, arts. 47 (modificado por el art. 8 de la Ley 2094 de 2021) y 67", "o": [["A", "las faltas gravísimas están señaladas taxativamente en la ley, y si la conducta no lo está, se determina si es grave o leve con los criterios legales.", "El art. 47 de la Ley 1952 de 2019, modificado por la Ley 2094 de 2021, dispone que las faltas gravísimas están taxativamente señaladas en la ley y que la gravedad o levedad se determina con criterios como la culpabilidad, la naturaleza del servicio y la jerarquía y mando; el art. 67 remite a ellos.", true], ["B", "todas las faltas se clasifican libremente por el operador disciplinario según su criterio personal.", "La clasificación no es libre: las gravísimas son taxativas y la gravedad o levedad se define con los criterios legales del art. 47.", false], ["C", "toda falta por incumplimiento de deberes es gravísima cuando el investigado pertenece al nivel directivo.", "El nivel directivo no convierte la falta en gravísima; las gravísimas están señaladas taxativamente en la ley y la jerarquía es solo uno de los criterios para definir si es grave o leve.", false]]}, {"id": "EP-167", "niv": 1, "e": "Entre los criterios legales para definir si la falta del director es grave o leve se encuentra", "f": "Ley 1952 de 2019, art. 47 (modificado por el art. 8 de la Ley 2094 de 2021)", "o": [["A", "la antigüedad del investigado en la entidad.", "La antigüedad no está entre los criterios del art. 47 de la Ley 1952 de 2019.", false], ["B", "la jerarquía y mando que tenga en la institución.", "El art. 47, num. 4, de la Ley 1952 de 2019, modificado por la Ley 2094 de 2021, incluye la jerarquía y mando del servidor en la institución entre los criterios para determinar la gravedad o levedad de la falta.", true], ["C", "el nivel de formación académica que acreditó al posesionarse.", "La formación académica no es un criterio legal de gravedad; la ley atiende, entre otros, a la culpabilidad, la perturbación del servicio y la jerarquía.", false]]}, {"id": "EP-168", "niv": 3, "e": "Sobre la aceptación de cargos del otro disciplinado, usted le explica al abogado que", "f": "Ley 1952 de 2019, arts. 32, 50, 161 y 162 (modificados por la Ley 2094 de 2021)", "o": [["A", "es un agravante, porque demuestra que el disciplinado tenía conocimiento de la ilicitud.", "El conocimiento de la ilicitud es un agravante distinto; la ley trata expresamente la aceptación de cargos como atenuante.", false], ["B", "extingue la acción disciplinaria, porque el disciplinado reconoció de manera expresa su responsabilidad.", "La aceptación de cargos no es causal de extinción; las causales son la muerte, la caducidad y la prescripción (art. 32).", false], ["C", "es un atenuante para graduar la suspensión, además de las rebajas que el código prevé para ella.", "El art. 50 de la Ley 1952 de 2019, modificado por la Ley 2094 de 2021, incluye la confesión de la falta o la aceptación de cargos entre los atenuantes para fijar la cuantía de la multa y la duración de la suspensión e inhabilidad; además, los arts. 161 y 162 (modificados por la Ley 2094 de 2021) regulan los beneficios y rebajas de sanción por aceptar cargos según la oportunidad en que se haga.", true]]}]}, {"comp": "empleo_publico", "rol": "general", "tag": "Empleo público, carrera y régimen disciplinario · Acoso laboral: definición y modalidades", "texto": "Usted integra el comité de convivencia laboral de una alcaldía de segunda categoría. Recibe tres situaciones: una técnica denuncia que, desde hace tres meses y sin ninguna razón del servicio, su jefe le asigna el triple de trabajo que a sus compañeros y le cambia el horario cada semana, y le ha dicho que «si no le gusta, puede irse»; un auxiliar refiere que un compañero lo insulta con frecuencia y lo llama «inútil» delante de los demás; y una coordinadora de grupo afirma que dos de sus subalternos la hostigan de manera persistente con mensajes ofensivos para que renuncie a la coordinación.", "items": [{"id": "EP-176", "niv": 2, "e": "La situación de la técnica corresponde a la modalidad de acoso laboral denominada", "f": "Ley 1010 de 2006, art. 2", "o": [["A", "desprotección laboral.", "La desprotección laboral consiste en poner en riesgo la integridad y seguridad del trabajador con órdenes o funciones sin los mínimos de protección; el caso describe carga excesiva y cambios de horario para inducir la renuncia.", false], ["B", "persecución laboral.", "El art. 2, num. 2, de la Ley 1010 de 2006 define la persecución laboral como la conducta reiterada o evidentemente arbitraria que permite inferir el propósito de inducir la renuncia, mediante descalificación, carga excesiva de trabajo y cambios permanentes de horario.", true], ["C", "discriminación laboral.", "La discriminación laboral exige un trato diferenciado por razones como raza, género, edad, origen, credo, preferencia política o situación social; el caso no menciona ninguno de esos motivos, sino carga excesiva y cambios de horario para inducir la renuncia.", false]]}, {"id": "EP-177", "niv": 1, "e": "La conducta del compañero que insulta al auxiliar delante de los demás corresponde a", "f": "Ley 1010 de 2006, arts. 2 y 7", "o": [["A", "maltrato laboral, por tratarse de expresiones injuriosas que lesionan la integridad moral del trabajador.", "El art. 2, num. 1, de la Ley 1010 de 2006 define el maltrato laboral como, entre otros, toda expresión verbal injuriosa o ultrajante que lesione la integridad moral, y el art. 7 presume el acoso ante comentarios hostiles y humillantes de descalificación profesional ante los compañeros.", true], ["B", "un conflicto entre pares que no es acoso, porque este solo puede provenir de un superior jerárquico.", "La ley reconoce como posibles autores del acoso al jefe, a un compañero de trabajo o a un subalterno (art. 2 de la Ley 1010 de 2006).", false], ["C", "discriminación laboral, porque el trato que recibe es distinto al que reciben los demás compañeros de la dependencia.", "La discriminación laboral exige un trato diferenciado por razones como raza, género, edad, origen, credo o preferencia política; el caso describe insultos, que corresponden al maltrato.", false]]}, {"id": "EP-178", "niv": 3, "e": "Frente a la queja de la coordinadora contra sus subalternos, el comité debe tener en cuenta que", "f": "Ley 1010 de 2006, arts. 2 y 6", "o": [["A", "no puede tramitarse, porque la víctima del acoso siempre es quien está en posición de subordinación.", "La Ley 1010 de 2006 reconoce expresamente que el acoso puede provenir de un subalterno y que los jefes inmediatos pueden ser víctimas.", false], ["B", "puede tramitarse como acoso laboral, porque la ley contempla que los jefes inmediatos sean víctimas cuando el acoso proviene de sus subalternos.", "El art. 2 de la Ley 1010 de 2006 incluye al subalterno como posible autor del acoso, y el art. 6 reconoce como sujetos pasivos a los jefes inmediatos cuando el acoso proviene de sus subalternos.", true], ["C", "solo puede tramitarse como un asunto disciplinario por desobediencia, no como acoso laboral.", "La ley no limita esta situación a la desobediencia; la regula como acoso laboral cuando se cumplen sus elementos.", false]]}]}, {"comp": "empleo_publico", "rol": "general", "tag": "Empleo público, carrera y régimen disciplinario · Declaración de bienes y rentas y registro de conflictos de interés", "texto": "Usted trabaja en la oficina de talento humano de una corporación autónoma regional. El consejo directivo designó a un nuevo director general, que se posesionará la próxima semana. Al mismo tiempo, un técnico administrativo de planta pregunta qué obligaciones tiene sobre su declaración de bienes y rentas. Y la jefe de la oficina le pide aclarar qué debe hacer el director si, ya posesionado, compra un inmueble y adquiere participación en una sociedad.", "items": [{"id": "EP-198", "niv": 1, "e": "Al técnico administrativo usted le explica que la declaración juramentada de bienes y rentas", "f": "Ley 190 de 1995, art. 13", "o": [["A", "es requisito para posesionarse y desempeñar el cargo, y debe actualizarse cada año y al retirarse.", "El art. 13 de la Ley 190 de 1995 establece la declaración juramentada de bienes y rentas como requisito para la posesión y el desempeño del cargo, y ordena actualizarla cada año y, en todo caso, al momento del retiro.", true], ["B", "solo la presentan los servidores de libre nombramiento y remoción que manejan recursos.", "La obligación de la Ley 190 de 1995 se predica de quien es nombrado para un cargo público, sin limitarla a los de libre nombramiento o a quienes manejan recursos.", false], ["C", "solo se presenta una vez, al momento de posesionarse, y no requiere actualizaciones posteriores mientras se ejerza el cargo.", "La Ley 190 de 1995 exige actualizar la información cada año y al momento del retiro, no solo al posesionarse.", false]]}, {"id": "EP-199", "niv": 3, "e": "Sobre el nuevo director general, usted le informa a la jefe que, por la Ley 2013 de 2019, para posesionarse debe", "f": "Ley 2013 de 2019, arts. 2 y 3", "o": [["A", "entregar en sobre cerrado su declaración de renta a la Contraloría, que la mantendrá bajo reserva.", "La Ley 2013 de 2019 busca lo contrario de la reserva: la publicación y divulgación proactiva de esa información, mediante su registro en el SIGEP.", false], ["B", "presentar solo la declaración de bienes y rentas de la Ley 190 de 1995, porque la Ley 2013 aplica únicamente a cargos de elección popular.", "La Ley 2013 de 2019 no se limita a los cargos de elección popular: incluye a quienes ejercen cargos directivos y gerenciales y a la dirección de las CAR.", false], ["C", "publicar en el SIGEP su declaración de bienes y rentas, su registro de conflictos de interés y copia de su declaración de renta.", "La Ley 2013 de 2019 incluye entre los sujetos obligados a quienes ejercen cargos directivos y gerenciales en el Estado y a quienes dirigen las CAR (art. 2), exige la publicación como requisito para posesionarse, ejercer y retirarse del cargo (par. 1) y ordena registrarla en el SIGEP (art. 3).", true]]}, {"id": "EP-200", "niv": 3, "e": "Si el director, ya posesionado, compra un inmueble y adquiere participación en una sociedad, deberá", "f": "Ley 2013 de 2019, art. 3", "o": [["A", "comunicar el cambio a la entidad y registrarlo dentro de los dos meses siguientes.", "El art. 3 de la Ley 2013 de 2019 dispone que todo cambio que modifique la información de la declaración de bienes y rentas y del registro de conflictos de interés debe comunicarse a la entidad y registrarse dentro de los dos meses siguientes al cambio.", true], ["B", "reportar los cambios solo al momento de su retiro, porque es cuando se cierra la declaración.", "La ley no aplaza el reporte hasta el retiro: los cambios deben registrarse dentro de los dos meses siguientes.", false], ["C", "esperar a la actualización anual para reportar ambos cambios en una sola declaración.", "Además de la actualización anual, la ley exige reportar los cambios dentro de los dos meses siguientes a su ocurrencia; no basta esperar a la actualización anual.", false]]}]}, {"comp": "atencion_procedimiento", "rol": "profesional", "tag": "Atención al ciudadano y procedimiento administrativo · Nivel profesional · Derecho de petición: consultas", "texto": "Usted es profesional universitario de la oficina jurídica de una corporación autónoma regional de la región Andina. Una asociación de acueductos veredales eleva una consulta para que la corporación explique si los acueductos comunitarios que captan pequeños caudales requieren concesión de aguas. Por la necesidad de revisar conceptos técnicos de la Subdirección de Gestión Ambiental, la respuesta no estará lista dentro del plazo legal. La asociación anuncia además que, si el concepto le es favorable, lo presentará como una decisión de obligatorio cumplimiento ante cualquier autoridad que le exija el trámite.", "items": [{"id": "AP-107", "niv": 1, "e": "El término legal para resolver esta consulta es de", "f": "Ley 1755 de 2015, art. 1 (art. 14, num. 2, de la Ley 1437 de 2011)", "o": [["A", "diez (10) días hábiles siguientes a su recepción.", "Es el término de las peticiones de documentos y de información. La asociación no pide documentos: pide el criterio de la corporación sobre una materia a su cargo.", false], ["B", "quince (15) días hábiles siguientes a su recepción.", "Es el término general. Las consultas tienen un término especial en el numeral 2 del artículo 14 del CPACA.", false], ["C", "treinta (30) días hábiles siguientes a su recepción.", "Las peticiones mediante las cuales se eleva una consulta a las autoridades sobre materias a su cargo deben resolverse dentro de los treinta días siguientes a su recepción (art. 14, num. 2, del CPACA).", true]]}, {"id": "AP-108", "niv": 2, "e": "Como la respuesta no estará lista a tiempo, a usted le corresponde proyectar un oficio que", "f": "Ley 1755 de 2015, art. 1 (art. 14, parágrafo, de la Ley 1437 de 2011)", "o": [["A", "informe a la asociación, dentro de los cinco días siguientes al vencimiento, los motivos de la demora y la nueva fecha de respuesta.", "El parágrafo del artículo 14 exige informar antes del vencimiento del término legal. Una comunicación posterior no evita el incumplimiento del plazo.", false], ["B", "informe a la asociación, antes de que venza el término, los motivos de la demora y el plazo razonable de respuesta, que no podrá exceder el doble del inicial.", "Así lo exige el parágrafo del artículo 14 del CPACA cuando excepcionalmente no es posible resolver en el plazo: informar antes del vencimiento, expresar los motivos de la demora y señalar un plazo razonable que no exceda el doble del inicialmente previsto.", true], ["C", "traslade la consulta a la Subdirección de Gestión Ambiental para que responda directamente con un nuevo término.", "El traslado del artículo 21 opera cuando la autoridad no es competente y se remite a otra autoridad. Pasar la consulta a otra dependencia de la misma corporación no reinicia el término ni releva a la entidad de responder.", false]]}, {"id": "AP-109", "niv": 2, "e": "Frente al uso que la asociación anuncia dar al concepto, es acertado advertirle que", "f": "Ley 1755 de 2015, art. 1 (art. 28 de la Ley 1437 de 2011)", "o": [["A", "el concepto solo será obligatorio si la asociación lo protocoliza en una notaría junto con la consulta inicial.", "Confunde el concepto con el procedimiento para invocar el silencio positivo (art. 85 del CPACA). La protocolización no le da fuerza obligatoria a un concepto.", false], ["B", "salvo disposición legal en contrario, los conceptos que responden consultas no son de obligatorio cumplimiento.", "El artículo 28 del CPACA establece que, salvo disposición legal en contrario, los conceptos emitidos como respuesta a consultas no son de obligatorio cumplimiento o ejecución. Orientan, pero no obligan a otras autoridades.", true], ["C", "el concepto obliga a las demás autoridades ambientales una vez queda en firme, por ser un acto administrativo definitivo.", "El concepto que responde una consulta no decide una actuación ni crea situaciones jurídicas; por eso la ley le niega, como regla general, fuerza obligatoria.", false]]}]}, {"comp": "atencion_procedimiento", "rol": "general", "tag": "Atención al ciudadano y procedimiento administrativo · Derecho de petición: reglas generales", "texto": "Usted trabaja en la Secretaría de Educación de un municipio certificado. El martes 4 de mayo de 2027 la Personería municipal radicó una solicitud de información sobre el número de estudiantes beneficiados con el transporte escolar. Ese mismo día, un estudiante de 15 años se acercó solo a radicar una petición para acceder a una beca municipal. Un compañero de trabajo propone cobrar una tarifa por radicar peticiones y exigir abogado en las más complejas. La entidad atiende de lunes a viernes; el lunes 10 de mayo de 2027 es festivo y, aparte del sábado 1 de mayo, no hay otros festivos en mayo hasta el día 30.", "items": [{"id": "AP-122", "niv": 3, "e": "El último día para responder la solicitud de la Personería es el", "f": "Ley 1755 de 2015, art. 1 (art. 30 de la Ley 1437 de 2011); cálculo de días hábiles", "o": [["A", "martes 18 de mayo de 2027.", "Resulta de contar el lunes 10 de mayo como día hábil. Ese día es festivo y no se cuenta.", false], ["B", "miércoles 19 de mayo de 2027.", "Entre autoridades, la petición de información debe resolverse en no más de diez días (art. 30 del CPACA): 5 a 7 de mayo (3), 11 a 14 (7), 17 a 19 (10). Se excluyen el fin de semana y el festivo del 10 de mayo.", true], ["C", "miércoles 26 de mayo de 2027.", "Aplica el término general de quince días. Cuando una autoridad pide información a otra, la ley fija un término especial de diez días.", false]]}, {"id": "AP-123", "niv": 1, "e": "Frente a la petición del estudiante de 15 años sobre la beca municipal, usted debe", "f": "Decreto Ley 019 de 2012, art. 12; Ley 1755 de 2015, art. 1 (art. 13 de la Ley 1437 de 2011)", "o": [["A", "recibirla y tramitarla con prelación en el turno, porque los menores pueden presentar directamente peticiones sobre asuntos de su interés y bienestar.", "El artículo 12 del Decreto Ley 019 de 2012 permite que niños, niñas y adolescentes presenten directamente solicitudes relacionadas con su interés superior, su bienestar y su protección especial, con prelación en el turno. El artículo 13 del CPACA no exige persona mayor ante las entidades dedicadas a su formación.", true], ["B", "exigir que la presente su padre, madre o representante legal, porque los menores no pueden actuar solos ante la administración.", "La ley reconoce a los menores la facultad de presentar peticiones directamente en asuntos de su interés y bienestar, sin intermediarios.", false], ["C", "recibirla solo como información, sin radicarla, hasta que un adulto responsable la ratifique por escrito.", "Ninguna norma exige la ratificación de un adulto. Además, ninguna autoridad puede negarse a radicar peticiones respetuosas (art. 15, parágrafo 2, del CPACA).", false]]}, {"id": "AP-124", "niv": 1, "e": "Sobre la propuesta de cobrar por radicar peticiones y exigir abogado en las complejas, lo correcto es señalar que", "f": "Ley 1755 de 2015, art. 1 (art. 13 de la Ley 1437 de 2011)", "o": [["A", "el abogado solo es exigible cuando la petición busca el reconocimiento de un derecho de contenido económico.", "La ley no distingue según el contenido de la petición. En todos los casos puede ejercerse sin abogado.", false], ["B", "puede cobrarse una tarifa razonable por radicación, siempre que se fije mediante acto administrativo general.", "El artículo 13 del CPACA establece que el derecho de petición es gratuito. Lo único que puede cobrarse es el costo de las copias que se pidan (art. 29).", false], ["C", "el derecho de petición es gratuito y puede ejercerse sin necesidad de abogado.", "El inciso 3 del artículo 13 del CPACA dispone que el ejercicio del derecho de petición es gratuito y puede realizarse sin representación de abogado.", true]]}]}, {"comp": "atencion_procedimiento", "rol": "profesional", "tag": "Atención al ciudadano y procedimiento administrativo · Nivel profesional · Notificación electrónica", "texto": "Usted es profesional especializado de una corporación autónoma regional que recibe por su sede electrónica las solicitudes de permiso de vertimientos. En el formulario, una empresa avícola marcó expresamente que acepta ser notificada por medios electrónicos; un productor porcícola, en cambio, no marcó esa opción. La corporación acaba de decidir ambas solicitudes. Semanas después, ya dentro de otra actuación, el representante de la empresa avícola pide que las siguientes notificaciones se le hagan por correo físico. Ninguna norma hace obligatorio el uso de medios electrónicos en estos trámites.", "items": [{"id": "AP-134", "niv": 1, "e": "La corporación puede notificar
