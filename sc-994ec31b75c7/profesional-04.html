ente la decisión el martes 20 de abril de 2027; en la diligencia se le informó que procedía la reposición. La alcaldía atiende de lunes a viernes. En marzo de 2027 son festivos el lunes 22, el jueves 25 y el viernes 26; entre el 20 de abril y el 7 de mayo de 2027 no hay festivos en días hábiles (el sábado 1 de mayo no afecta el cómputo).", "items": [{"id": "AP-209", "niv": 3, "e": "El último día que tenía la alcaldía para responder oportunamente la petición era el", "f": "Ley 1755 de 2015, art. 1 (art. 14 de la Ley 1437 de 2011); cálculo de días hábiles", "o": [["A", "martes 6 de abril de 2027.", "Resulta de descontar solo el festivo del 22 de marzo y contar como hábiles el jueves y el viernes santos.", false], ["B", "miércoles 7 de abril de 2027.", "Resulta de contar el día de la radicación como primer día. El término corre a partir del día siguiente a la recepción.", false], ["C", "jueves 8 de abril de 2027.", "El término general es de quince días siguientes a la recepción: 16 a 19 de marzo (4), 23 y 24 (6), 29 de marzo a 2 de abril (11) y 5 a 8 de abril (15). Se excluyen los festivos del 22, 25 y 26 de marzo.", true]]}, {"id": "AP-210", "niv": 3, "e": "El último día para que el ciudadano interponga el recurso de reposición es el", "f": "Ley 1437 de 2011, art. 76; cálculo de días hábiles", "o": [["A", "viernes 30 de abril de 2027.", "Resulta de contar diez días calendario. El término de diez días del artículo 76 es de días hábiles.", false], ["B", "lunes 3 de mayo de 2027.", "Resulta de contar el día de la notificación como primer día. El plazo corre dentro de los diez días siguientes a la notificación.", false], ["C", "martes 4 de mayo de 2027.", "El recurso puede interponerse dentro de los diez días siguientes a la notificación personal: 21 a 23 de abril (3), 26 a 30 (8), 3 de mayo (9) y 4 de mayo (10). El 1 de mayo cae sábado y no altera el cómputo.", true]]}, {"id": "AP-211", "niv": 3, "e": "Si el ciudadano no interpone el recurso, la decisión queda en firme a partir del", "f": "Ley 1437 de 2011, arts. 76 y 87, num. 3", "o": [["A", "miércoles 21 de abril de 2027.", "Es el día siguiente a la notificación, regla que aplica solo cuando contra el acto no procede ningún recurso (art. 87, num. 1). Contra esta decisión procedía la reposición.", false], ["B", "martes 4 de mayo de 2027.", "Ese día vence el plazo para recurrir; el acto todavía puede ser recurrido hasta el final de esa fecha.", false], ["C", "miércoles 5 de mayo de 2027.", "El numeral 3 del artículo 87 del CPACA dispone que el acto queda en firme desde el día siguiente al vencimiento del término para interponer los recursos. El plazo venció el martes 4 de mayo, de modo que la firmeza se produce el miércoles 5.", true]]}]}, {"comp": "gestion_publica", "rol": "profesional", "tag": "Gestión pública, MIPG, contratación y documentos · Nivel profesional · MIPG: Comité Institucional de Gestión y Desempeño", "texto": "Usted es profesional universitario de la Oficina Asesora de Planeación de la alcaldía de un municipio de tercera categoría. El alcalde adoptó el Modelo Integrado de Planeación y Gestión (MIPG) y le pidió proyectar la resolución que conforma el Comité Institucional de Gestión y Desempeño. En la reunión preparatoria, el secretario general propone tres cosas: que el comité se reúna una vez al año para revisar el avance del modelo; que la secretaría técnica la ejerza el jefe de la Oficina de Control Interno, «porque es quien conoce la evaluación de la gestión», y que se mantengan, por separado, otros cuatro comités internos creados hace años mediante resoluciones de la propia alcaldía, que tratan temas del modelo y que ninguna ley exige.", "items": [{"id": "GP-101", "niv": 1, "e": "Frente a la periodicidad propuesta, usted advierte que el comité debe aprobar y hacer seguimiento a las acciones y estrategias para la operación del MIPG", "f": "Decreto 1083 de 2015, art. 2.2.22.3.8, num. 1 (sustituido por el Decreto 1499 de 2017)", "o": [["A", "por lo menos una vez cada tres meses.", "El artículo 2.2.22.3.8 del Decreto 1083 de 2015 (texto del Decreto 1499 de 2017), numeral 1, asigna al Comité Institucional de Gestión y Desempeño la función de aprobar y hacer seguimiento a las acciones del modelo como mínimo trimestralmente.", true], ["B", "por lo menos una vez cada seis meses.", "La periodicidad semestral corresponde, por ejemplo, al seguimiento que hacen los comités sectoriales de gestión y desempeño del orden nacional; para el comité institucional la norma exige un seguimiento más frecuente, al menos trimestral.", false], ["C", "una vez al año, al cierre de la vigencia fiscal.", "Una revisión anual, como propone el secretario general, incumple el mínimo previsto en el numeral 1 del artículo 2.2.22.3.8 del Decreto 1083 de 2015, que exige seguimiento por lo menos cada tres meses.", false]]}, {"id": "GP-102", "niv": 2, "e": "Sobre la secretaría técnica del comité, el proyecto de resolución debe asignarla", "f": "Decreto 1083 de 2015, art. 2.2.22.3.8, parágrafo 1", "o": [["A", "al secretario general, por ser el servidor de más alto nivel después del alcalde.", "El nivel jerárquico es relevante para presidir el comité en el orden territorial, no para la secretaría técnica, que el Decreto 1083 de 2015 asigna al jefe de planeación.", false], ["B", "al jefe de la oficina de planeación o a quien haga sus veces.", "El parágrafo 1 del artículo 2.2.22.3.8 del Decreto 1083 de 2015 dispone que la secretaría técnica del Comité Institucional de Gestión y Desempeño la ejerce el jefe de planeación de la entidad, o quien haga sus veces.", true], ["C", "al jefe de la Oficina de Control Interno, porque es quien evalúa la gestión de la alcaldía.", "La oficina de control interno hace la evaluación independiente del sistema; asignarle la secretaría técnica del comité que orienta la implementación del modelo comprometería esa independencia y, además, la norma la asigna expresamente a planeación.", false]]}, {"id": "GP-103", "niv": 3, "e": "En cuanto a los cuatro comités internos que tratan temas del modelo, lo procedente es", "f": "Decreto 1083 de 2015, art. 2.2.22.3.8 (sustituido por el Decreto 1499 de 2017)", "o": [["A", "mantenerlos y ordenar que cada uno reporte sus decisiones al Comité Institucional de Gestión y Desempeño.", "Mantenerlos duplicaría instancias: la norma dispone que el comité institucional sustituye a los demás comités relacionados con el modelo que no sean obligatorios por mandato legal, como ocurre con estos cuatro.", false], ["B", "que el nuevo comité los sustituya, pues no son obligatorios por ley.", "El artículo 2.2.22.3.8 del Decreto 1083 de 2015 establece que el Comité Institucional de Gestión y Desempeño reemplaza los demás comités relacionados con el modelo que no sean obligatorios por mandato legal; los cuatro comités fueron creados por resoluciones internas.", true], ["C", "fusionarlos con el Comité Institucional de Coordinación de Control Interno, que es la instancia que articula el modelo.", "El comité de coordinación de control interno es la instancia del sistema de control interno (línea estratégica), no la que orienta la implementación del MIPG; esa función, y la sustitución de comités no obligatorios, corresponde al comité institucional de gestión y desempeño.", false]]}]}, {"comp": "gestion_publica", "rol": "profesional", "tag": "Gestión pública, MIPG, contratación y documentos · Nivel profesional · Control interno: esquema de líneas de defensa", "texto": "Usted es profesional de la Oficina de Planeación de una corporación autónoma regional del Eje Cafetero, que actualiza su política de administración del riesgo. En el proceso de trámites ambientales (permisos de vertimientos y concesiones de agua), el subdirector y su equipo revisan cada expediente con una lista de chequeo para evitar que se otorgue un permiso sin concepto técnico. Su oficina consolida cada trimestre el mapa de riesgos de todos los procesos y verifica si los controles están bien diseñados. La Oficina de Control Interno adelanta auditorías según su plan anual. En comité, el director general propone que, «para ganar tiempo», sea la Oficina de Control Interno la que diseñe los controles del proceso de trámites ambientales y luego los audite.", "items": [{"id": "GP-116", "niv": 1, "e": "En el esquema de líneas del MIPG, el control que aplican el subdirector y su equipo con la lista de chequeo corresponde a la", "f": "Decreto 1083 de 2015, art. 2.2.23.1; Manual Operativo del MIPG (Función Pública), esquema de líneas", "o": [["A", "primera línea, que gestiona los riesgos y ejecuta los controles en la operación diaria.", "Según el Manual Operativo del MIPG, la primera línea la integran los responsables de procesos y sus equipos, que identifican los riesgos y aplican los controles en el día a día, como la lista de chequeo del caso.", true], ["B", "segunda línea, porque el subdirector es un directivo de la corporación.", "La línea no depende del nivel del cargo sino del rol: quien ejecuta controles en su propio proceso actúa como primera línea; la segunda hace monitoreo transversal.", false], ["C", "línea estratégica, porque los permisos ambientales son la misión de la entidad.", "La línea estratégica la conforman la alta dirección y el Comité Institucional de Coordinación de Control Interno, que fijan lineamientos; no ejecutan los controles de cada expediente.", false]]}, {"id": "GP-117", "niv": 2, "e": "La labor de su oficina al consolidar el mapa de riesgos y verificar el diseño de los controles de todos los procesos corresponde a la", "f": "Manual Operativo del MIPG (Función Pública), dimensión de control interno, esquema de líneas", "o": [["A", "tercera línea, porque implica evaluar controles de otras dependencias.", "La tercera línea es exclusiva de la oficina de control interno, que da aseguramiento independiente; el monitoreo que hace planeación no tiene ese carácter independiente.", false], ["B", "segunda línea, que hace monitoreo transversal y verifica que los controles de la primera operen adecuadamente.", "El Manual Operativo del MIPG ubica en la segunda línea a quienes cumplen funciones transversales de monitoreo, como planeación y gestión del riesgo, para verificar que los controles de la primera línea estén bien diseñados y funcionen.", true], ["C", "primera línea, porque la oficina de planeación también lidera su propio proceso.", "Planeación es primera línea respecto de su propio proceso, pero la labor descrita (consolidar riesgos y verificar controles de todos los procesos) es de monitoreo transversal, propia de la segunda línea.", false]]}, {"id": "GP-118", "niv": 3, "e": "Frente a la propuesta del director general, usted debe advertir que", "f": "Manual Operativo del MIPG (Función Pública), esquema de líneas; Ley 87 de 1993, art. 12, parágrafo", "o": [["A", "es viable si el Comité Institucional de Coordinación de Control Interno la aprueba como decisión de la línea estratégica.", "La aprobación del comité no elimina el conflicto: la línea estratégica define lineamientos, pero no puede asignar a la oficina de control interno funciones que comprometen su independencia.", false], ["B", "es viable, porque a la tercera línea le corresponde diseñar los controles que después evalúa.", "Diseñar e implementar controles es responsabilidad de la primera línea con el acompañamiento de la segunda; si la oficina de control interno los diseñara, perdería la independencia para auditarlos.", false], ["C", "la tercera línea da aseguramiento independiente y no debe asumir responsabilidades de la primera o la segunda.", "El Manual Operativo del MIPG precisa que la oficina de control interno da aseguramiento independiente sin asumir responsabilidades propias de las otras líneas, en armonía con el parágrafo del artículo 12 de la Ley 87 de 1993, que le impide participar en los procedimientos de la entidad.", true]]}]}, {"comp": "gestion_publica", "rol": "profesional", "tag": "Gestión pública, MIPG, contratación y documentos · Nivel profesional · Contratación: modalidades de selección y cuantías", "texto": "Usted es profesional universitario de la oficina jurídica y de contratación de un municipio de sexta categoría cuyo presupuesto anual es inferior a 120.000 salarios mínimos legales mensuales vigentes (SMMLV). En el Plan Anual de Adquisiciones aparecen, entre otros: la construcción de un puente vehicular por un valor estimado de 1.900 SMMLV; la reparación de la cubierta de la casa de la cultura por 20 SMMLV, y la elaboración de los estudios y diseños de un acueducto veredal por 150 SMMLV. El alcalde le pide definir la modalidad de selección de cada proceso. Recuerde que, para entidades con ese presupuesto, la menor cuantía llega hasta 280 SMMLV.", "items": [{"id": "GP-148", "niv": 3, "e": "Para clasificar la reparación de la cubierta, usted calcula que la mínima cuantía del municipio llega hasta", "f": "Ley 1150 de 2007, art. 2, num. 2 (lit. b) y num. 5 (modificado por el art. 30 de la Ley 2069 de 2020)", "o": [["A", "28 SMMLV.", "La mínima cuantía es la contratación que no excede el 10 % de la menor cuantía de la entidad (Ley 1150 de 2007, art. 2, num. 5). Si la menor cuantía es de 280 SMMLV, la mínima llega hasta 280 × 0,10 = 28 SMMLV; la reparación de 20 SMMLV cabe en ella.", true], ["B", "56 SMMLV.", "Resulta de aplicar el 20 % a la menor cuantía; la ley fija la mínima cuantía en el 10 % de la menor cuantía, es decir, 28 SMMLV.", false], ["C", "280 SMMLV.", "Ese es el tope de la menor cuantía del municipio, no el de la mínima cuantía, que equivale al 10 % de aquella.", false]]}, {"id": "GP-149", "niv": 2, "e": "La construcción del puente vehicular debe contratarse mediante", "f": "Ley 1150 de 2007, art. 2, nums. 1, 2 y 4", "o": [["A", "selección abreviada de menor cuantía, porque el municipio es de sexta categoría.", "La menor cuantía se define por el valor del contrato frente al presupuesto anual en SMMLV, no por la categoría del municipio; 1.900 SMMLV supera ampliamente los 280 SMMLV.", false], ["B", "contratación directa, porque es una obra pública de interés general.", "El interés general de una obra no es causal de contratación directa; las causales son taxativas en el numeral 4 del artículo 2 de la Ley 1150 de 2007.", false], ["C", "licitación pública, que es la regla general de escogencia del contratista.", "El numeral 1 del artículo 2 de la Ley 1150 de 2007 establece la licitación pública como regla general; una obra de 1.900 SMMLV supera la menor cuantía y no encaja en causales de selección abreviada ni de contratación directa.", true]]}, {"id": "GP-150", "niv": 2, "e": "Los estudios y diseños del acueducto veredal deben contratarse mediante", "f": "Ley 1150 de 2007, art. 2, num. 3; Ley 80 de 1993, art. 32, num. 2", "o": [["A", "concurso de méritos, por tratarse de una consultoría.", "El numeral 3 del artículo 2 de la Ley 1150 de 2007 prevé el concurso de méritos para seleccionar consultores, y el artículo 32, numeral 2, de la Ley 80 de 1993 define como consultoría los estudios y diseños para proyectos de inversión.", true], ["B", "selección abreviada de menor cuantía, porque su valor es inferior a 280 SMMLV.", "El valor no define la modalidad cuando el objeto es una consultoría que supera la mínima cuantía: la ley reserva para los consultores el concurso de méritos.", false], ["C", "licitación pública, porque los diseños hacen parte de una obra de infraestructura.", "Los estudios y diseños son un contrato de consultoría independiente de la futura obra, y para la selección de consultores la ley prevé el concurso de méritos.", false]]}]}, {"comp": "gestion_publica", "rol": "general", "tag": "Gestión pública, MIPG, contratación y documentos · Contratación directa: urgencia manifiesta", "texto": "Usted trabaja en la Secretaría de Planeación e Infraestructura de un municipio de Antioquia. Una avenida torrencial destruyó el puente peatonal que comunica dos veredas y dejó a 200 niños sin acceso a la escuela. El alcalde declaró la urgencia manifiesta mediante decreto motivado y ordenó contratar de inmediato la construcción de un paso provisional. Un compañero insiste en que, antes de firmar, hay que elaborar estudios previos completos y expedir, aparte, el acto de justificación de la contratación directa.", "items": [{"id": "GP-157", "niv": 1, "e": "La situación descrita permite acudir a la urgencia manifiesta porque", "f": "Ley 80 de 1993, art. 42; Ley 1150 de 2007, art. 2, num. 4, lit. a", "o": [["A", "toda obra pública en zona rural puede contratarse de forma directa.", "La ubicación rural de una obra no es causal de contratación directa; las causales del artículo 2, numeral 4, de la Ley 1150 de 2007 son taxativas.", false], ["B", "busca conjurar una situación excepcional derivada de una calamidad que exige actuar de inmediato.", "El artículo 42 de la Ley 80 de 1993 define la urgencia manifiesta, entre otros supuestos, para conjurar situaciones excepcionales relacionadas con hechos de calamidad o desastre que demandan actuaciones inmediatas.", true], ["C", "el valor del paso provisional es inferior a la mínima cuantía del municipio.", "La urgencia manifiesta no depende del valor del contrato; se funda en hechos excepcionales que exigen actuar de inmediato.", false]]}, {"id": "GP-158", "niv": 2, "e": "Frente a la posición del compañero, usted le explica que", "f": "Decreto 1082 de 2015, art. 2.2.1.2.1.4.2", "o": [["A", "el acto de justificación debe expedirse aparte, aunque los estudios previos pueden elaborarse al liquidar el contrato.", "No hace falta un acto de justificación separado: el que declara la urgencia cumple esa función; y la norma no traslada los estudios previos a la liquidación.", false], ["B", "sin estudios previos completos el contrato sería nulo, aunque exista urgencia manifiesta.", "El reglamento releva a la entidad de elaborar estudios previos cuando la causal es la urgencia manifiesta, de modo que su ausencia no vicia el contrato por ese solo hecho.", false], ["C", "el decreto que declaró la urgencia hace las veces de acto de justificación y no es obligatorio elaborar estudios previos.", "El artículo 2.2.1.2.1.4.2 del Decreto 1082 de 2015 dispone que, cuando la causal es la urgencia manifiesta, el acto que la declara hace las veces de acto de justificación y la entidad no está obligada a elaborar estudios y documentos previos.", true]]}, {"id": "GP-159", "niv": 3, "e": "Inmediatamente después de celebrado el contrato, la alcaldía debe", "f": "Ley 80 de 1993, art. 43", "o": [["A", "remitir el contrato al concejo municipal para su aprobación, como requisito para poder pagarlo.", "La ley no somete los contratos de urgencia a aprobación del concejo; el control previsto es el del órgano de control fiscal.", false], ["B", "enviar el contrato, el decreto de urgencia y el expediente al órgano de control fiscal competente.", "El artículo 43 de la Ley 80 de 1993 ordena enviar, inmediatamente después de celebrados, los contratos de urgencia, el acto que la declaró y el expediente con sus antecedentes al funcionario u organismo que ejerce el control fiscal, que se pronuncia dentro de los dos meses siguientes.", true], ["C", "publicar un aviso de convocatoria en el SECOP para que otros interesados presenten ofertas.", "En la contratación directa no se expide aviso de convocatoria (Decreto 1082 de 2015) y, en todo caso, el contrato ya está celebrado; lo que exige la ley es el envío al control fiscal.", false]]}]}, {"comp": "gestion_publica", "rol": "profesional", "tag": "Gestión pública, MIPG, contratación y documentos · Nivel profesional · Interventoría: prórroga, vigilancia y responsabilidad", "texto": "Usted es profesional especializado de un instituto distrital de Bogotá encargado de obras de espacio público. El contrato de obra de un parque zonal se prorrogó cuatro meses por las lluvias. La firma interventora pide prorrogar también su contrato y ajustar su valor. Un abogado del instituto sostiene que cualquier adición está limitada al 50 % del valor inicial; otro pregunta quién vigila al interventor y por qué responde este si comete errores.", "items": [{"id": "GP-179", "niv": 3, "e": "Frente a la solicitud de la firma interventora, usted explica que el contrato de interventoría", "f": "Ley 1474 de 2011, art. 85", "o": [["A", "puede prorrogarse por el mismo plazo de la obra y su valor ajustarse sin el límite general de adiciones.", "El artículo 85 de la Ley 1474 de 2011 permite prorrogar la interventoría por el mismo plazo en que se prorrogó el contrato vigilado y ajustar su valor sin aplicar el parágrafo del artículo 40 de la Ley 80 de 1993, que limita las adiciones al 50 %.", true], ["B", "no puede prorrogarse, y debe adelantarse un nuevo concurso de méritos para cubrir los cuatro meses adicionales de obra.", "La ley prevé la continuidad de la interventoría: el contrato puede prorrogarse por el mismo plazo de la obra, sin necesidad de un nuevo proceso.", false], ["C", "puede prorrogarse, pero su valor solo puede adicionarse hasta el 50 % del valor inicial.", "Justamente para la interventoría prorrogada la ley excluye la aplicación del límite del 50 % del parágrafo del artículo 40 de la Ley 80 de 1993.", false]]}, {"id": "GP-180", "niv": 2, "e": "Sobre quién vigila la ejecución del contrato de interventoría, lo correcto es que", "f": "Ley 1474 de 2011, art. 83", "o": [["A", "lo supervise directamente el instituto.", "El artículo 83 de la Ley 1474 de 2011 dispone que el contrato de interventoría será supervisado directamente por la entidad estatal.", true], ["B", "lo vigile otra firma interventora contratada para ese fin.", "La ley no prevé una «interventoría de la interventoría»: ordena que la entidad supervise directamente ese contrato.", false], ["C", "lo vigile la Veeduría Distrital, por tratarse de recursos de obra pública.", "Los órganos de control y veeduría ejercen funciones externas; la vigilancia contractual del interventor es una obligación de la propia entidad.", false]]}, {"id": "GP-181", "niv": 2, "e": "En cuanto a la responsabilidad del interventor, este responde", "f": "Ley 80 de 1993, art. 53 (texto vigente)", "o": [["A", "solo disciplinariamente, porque cumple una función pública transitoria.", "Además de la disciplinaria, la ley le atribuye responsabilidad civil, fiscal y penal.", false], ["B", "civil, fiscal, penal y disciplinariamente por sus obligaciones y por los hechos u omisiones que le sean imputables.", "El artículo 53 de la Ley 80 de 1993, en su texto vigente, establece que los interventores responden civil, fiscal, penal y disciplinariamente por el cumplimiento del contrato de interventoría y por los hechos u omisiones imputables que causen daño a la entidad.", true], ["C", "únicamente en lo contractual frente al instituto, por ser un particular sin funciones públicas.", "La ley no limita la responsabilidad del interventor a lo contractual; la extiende a los ámbitos civil, fiscal, penal y disciplinario.", false]]}]}, {"comp": "entidades_territoriales", "rol": "profesional", "tag": "Entidades territoriales, Bogotá D.C. y CAR · Nivel profesional · Categorización de municipios", "texto": "Usted es profesional universitario de la Secretaría de Hacienda de un municipio del Tolima. En agosto recibe las certificaciones oficiales: según el DANE, el municipio tiene 45.000 habitantes; según la Contraloría General de la República, los ingresos corrientes de libre destinación (ICLD) recaudados en la vigencia anterior equivalen a 60.000 salarios mínimos legales mensuales vigentes, y los gastos de funcionamiento no superaron el límite legal. El alcalde le pide preparar el proyecto de decreto de categorización para el año siguiente y resolver algunas dudas del equipo jurídico.", "items": [{"id": "ET-101", "niv": 3, "e": "Con los datos certificados, en el proyecto de decreto usted debe proponer que el municipio quede en", "f": "Ley 136 de 1994, art. 6, parágrafo 1 (modificado por el art. 153 del Decreto Ley 2106 de 2019)", "o": [["A", "tercera categoría, porque la población, entre 30.001 y 50.000 habitantes, es el criterio que define la categoría.", "La población no basta. El parágrafo 1 del art. 6 de la Ley 136 de 1994 ordena que, si los ICLD superan el tope de la categoría que correspondería por población (50.000 SMMLV en tercera), el municipio pase a la categoría inmediatamente superior.", false], ["B", "primera categoría, porque al superar el tope de ingresos se sube dos categorías por encima de la que indica la población.", "La regla es subir a la categoría inmediatamente superior, no dos. El límite de no variar más de dos categorías entre un año y otro es una regla distinta del parágrafo 2 del art. 6 de la Ley 136 de 1994.", false], ["C", "segunda categoría, porque sus ICLD superan el tope previsto para la categoría que le correspondería por población.", "Por población (45.000) estaría en tercera, cuyo tope de ICLD es 50.000 SMMLV. El parágrafo 1 del art. 6 de la Ley 136 de 1994, en el texto vigente del art. 153 del Decreto Ley 2106 de 2019, ordena que el municipio que supere ese tope se clasifique en la categoría inmediatamente superior: segunda. El resultado coincide con el rango de ICLD de segunda categoría (más de 50.000 y hasta 100.000 SMMLV).", true]]}, {"id": "ET-102", "niv": 2, "e": "Sobre el plazo para expedir el decreto de categorización, usted debe advertir al alcalde que", "f": "Ley 136 de 1994, art. 6, parágrafo 3 (modificado por el art. 153 del Decreto Ley 2106 de 2019)", "o": [["A", "debe expedirlo antes del 31 de octubre y, si no lo hace, la categoría la fija el Contador General de la Nación en noviembre.", "El parágrafo 3 del art. 6 de la Ley 136 de 1994 fija el 31 de octubre como plazo para el decreto del alcalde y, ante su omisión, asigna la categorización al Contador General de la Nación en noviembre.", true], ["B", "debe expedirlo antes del 31 de diciembre y, si no lo hace, la categoría la fija mediante decreto el gobernador del respectivo departamento.", "Ni el plazo ni la autoridad supletoria son esos: la norma señala el 31 de octubre y al Contador General de la Nación, no al gobernador.", false], ["C", "puede expedirlo en cualquier momento del año, pues la categoría solo se requiere al aprobar el presupuesto.", "La ley sí fija un término (antes del 31 de octubre) y prevé una consecuencia por su incumplimiento; no es una decisión discrecional en el tiempo.", false]]}, {"id": "ET-103", "niv": 2, "e": "Si el año siguiente el municipio destinara a gastos de funcionamiento un porcentaje superior al límite legal, la consecuencia sobre su categoría sería", "f": "Ley 136 de 1994, art. 6, parágrafo 2 (modificado por el art. 153 del Decreto Ley 2106 de 2019)", "o": [["A", "conservar la categoría, pero sin poder ejecutar inversión con recursos propios hasta ajustar el gasto.", "La norma de categorización no prevé esa consecuencia; lo que establece es la reclasificación del municipio.", false], ["B", "reclasificarlo en la categoría inmediatamente inferior a la que le corresponda por población e ingresos.", "El parágrafo 2 del art. 6 de la Ley 136 de 1994 dispone que el distrito o municipio que supere los límites legales de gastos de funcionamiento se reclasifica en la categoría inmediatamente inferior.", true], ["C", "reclasificarlo en sexta categoría, por ser la que corresponde a los municipios con desequilibrio fiscal.", "No se envía automáticamente a sexta categoría: el descenso es a la categoría inmediatamente inferior y, además, ningún municipio puede variar más de dos categorías de un año a otro.", false]]}]}, {"comp": "entidades_territoriales", "rol": "general", "tag": "Entidades territoriales, Bogotá D.C. y CAR · Funciones del alcalde", "texto": "Usted es profesional de la Secretaría de Gobierno de un municipio de tercera categoría del Huila. Se acercan las fiestas patronales y la Policía reporta riñas asociadas al consumo de licor en el parque principal. El alcalde, que además prepara su informe de gestión al Concejo, le pide revisar qué medidas puede adoptar y si puede encargar a la secretaria de Gobierno algunas de sus funciones para atender la temporada.", "items": [{"id": "ET-113", "niv": 1, "e": "Para controlar las riñas durante las fiestas, el alcalde puede, como medida de orden público,", "f": "Ley 136 de 1994, arts. 84 y 91, lit. b), num. 2 (modificado por el art. 29 de la Ley 1551 de 2012)", "o": [["A", "tramitar un acuerdo ante el Concejo, porque esas restricciones son de reserva de la corporación.", "La restricción del expendio y consumo de bebidas embriagantes por razones de orden público es una medida que la ley atribuye directamente al alcalde.", false], ["B", "solicitar al gobernador que expida la medida, porque el orden público municipal le corresponde al departamento.", "El alcalde es la primera autoridad de policía del municipio y conserva el orden público en su jurisdicción (arts. 84 y 91 de la Ley 136 de 1994); no necesita que el gobernador expida la medida.", false], ["C", "restringir o prohibir el expendio y consumo de bebidas embriagantes, de conformidad con la ley.", "El art. 91, literal b), numeral 2 de la Ley 136 de 1994 (modificado por la Ley 1551 de 2012) faculta al alcalde para restringir o prohibir el expendio y consumo de bebidas embriagantes, entre otras medidas, para mantener o restablecer el orden público.", true]]}, {"id": "ET-114", "niv": 1, "e": "Sobre la posibilidad de que la secretaria de Gobierno ejerza algunas funciones del alcalde, usted le indica que", "f": "Ley 136 de 1994, art. 92 (modificado por el art. 30 de la Ley 1551 de 2012)", "o": [["A", "las funciones del alcalde son indelegables, por tratarse de un cargo de elección popular sujeto al voto programático del elegido.", "La ley sí permite la delegación de funciones del alcalde en sus secretarios, con la única excepción de las que tengan prohibición legal expresa.", false], ["B", "puede delegar en los secretarios de la alcaldía las funciones a su cargo, salvo aquellas que tengan prohibición legal expresa.", "El art. 92 de la Ley 136 de 1994 (modificado por el art. 30 de la Ley 1551 de 2012) permite delegar en secretarios y jefes de departamento administrativo las funciones del alcalde, excepto las que tengan prohibición legal expresa.", true], ["C", "la delegación solo procede con autorización previa del Concejo para cada función.", "El art. 92 de la Ley 136 de 1994 no exige autorización previa del Concejo para delegar en los secretarios; esa autorización se requiere para delegar en subalternos o JAL funciones distintas de las previstas en la ley (art. 32, num. 4).", false]]}, {"id": "ET-115", "niv": 2, "e": "Respecto del informe de gestión al Concejo, el alcalde debe presentar informes generales sobre su administración", "f": "Ley 136 de 1994, art. 91, lit. a), num. 4 (modificado por el art. 29 de la Ley 1551 de 2012)", "o": [["A", "solo cuando el Concejo lo cite a debate de control político.", "El alcalde no puede ser citado por el Concejo para declaraciones orales (art. 32, num. 2), y el informe general es un deber periódico, no una respuesta a citaciones.", false], ["B", "al terminar el último periodo de sesiones ordinarias del año, junto con el presupuesto.", "La norma ubica el informe general en la primera sesión ordinaria del año, no al final de la vigencia.", false], ["C", "en la primera sesión ordinaria de cada año.", "El art. 91, literal a), numeral 4 de la Ley 136 de 1994 (modificado por la Ley 1551 de 2012) ordena al alcalde presentar informes generales sobre su administración en la primera sesión ordinaria de cada año.", true]]}]}, {"comp": "entidades_territoriales", "rol": "profesional", "tag": "Entidades territoriales, Bogotá D.C. y CAR · Nivel profesional · Funciones del gobernador", "texto": "Usted es profesional especializado de la Secretaría de Planeación de un departamento de la Orinoquía. El gobernador presentó en debida forma el proyecto de plan de desarrollo departamental, pero la Asamblea no lo aprobó dentro de los términos legales. Al mismo tiempo, el contralor departamental presentó su renuncia mientras la Asamblea está en receso, y el secretario de Gobierno pregunta si el gobernador puede delegarle la celebración de ciertos convenios con municipios.", "items": [{"id": "ET-129", "niv": 2, "e": "Frente a la falta de aprobación del plan de desarrollo, el gobernador puede", "f": "Ley 2200 de 2022, art. 119, num. 9", "o": [["A", "adoptarlo mediante decreto, pues fue presentado en debida forma y no se aprobó en los términos de ley.", "El art. 119, numeral 9 de la Ley 2200 de 2022 faculta al gobernador para adoptar por decreto el plan de desarrollo departamental cuando, presentado en debida forma, no es aprobado por la Asamblea en los términos de ley.", true], ["B", "convocar a la Asamblea a sesiones extraordinarias indefinidas hasta que apruebe el plan presentado.", "Las extraordinarias tienen un límite de tres meses al año y no son el mecanismo previsto para este supuesto; la ley prevé la adopción por decreto.", false], ["C", "ejecutar el plan del gobierno anterior hasta que la Asamblea apruebe el nuevo.", "La ley no ordena continuar el plan anterior; da al gobernador la facultad de adoptar el nuevo plan por decreto.", false]]}, {"id": "ET-130", "niv": 2, "e": "Sobre la renuncia del contralor departamental presentada durante el receso de la Asamblea, la decisión corresponde a", "f": "Ley 2200 de 2022, arts. 19, num. 9, y 119, num. 13", "o": [["A", "el gobernador, porque la Asamblea se encuentra en receso y la ley le asigna expresamente esa decisión.", "El art. 119, numeral 13 de la Ley 2200 de 2022 asigna al gobernador aceptar la renuncia del contralor cuando la Asamblea está en receso.", true], ["B", "la Contraloría General de la República, que ejerce control prevalente sobre las contralorías territoriales.", "La Contraloría General no acepta renuncias de contralores territoriales; ese acto corresponde a la Asamblea o, en receso, al gobernador.", false], ["C", "la mesa directiva de la Asamblea, que actúa en nombre de la corporación durante el receso.", "La ley atribuye expresamente esta función al gobernador cuando la Asamblea está en receso (art. 119, num. 13 de la Ley 2200 de 2022).", false]]}, {"id": "ET-131", "niv": 1, "e": "Respecto de la delegación solicitada por el secretario de Gobierno, usted le explica que el gobernador", "f": "Ley 2200 de 2022, art. 120", "o": [["A", "necesita una ordenanza que autorice previamente cada delegación, porque se trata de convenios con los municipios.", "La Ley 2200 de 2022 no condiciona la delegación en secretarios a una ordenanza específica; la delegación de la contratación se sujeta además a las normas generales (Leyes 80 de 1993 y 489 de 1998).", false], ["B", "solo puede delegar en los alcaldes, que son agentes del departamento para ejecutar convenios.", "La ley prevé la delegación en los secretarios del departamento y jefes de departamento administrativo; los alcaldes no son agentes del gobernador para estos efectos.", false], ["C", "puede delegarle funciones a su cargo, salvo aquellas respecto de las cuales exista prohibición legal expresa.", "El art. 120 de la Ley 2200 de 2022 permite al gobernador delegar en secretarios y jefes de departamento administrativo sus funciones, excepto las que tengan prohibición legal expresa.", true]]}]}, {"comp": "entidades_territoriales", "rol": "general", "tag": "Entidades territoriales, Bogotá D.C. y CAR · Estructura administrativa de Bogotá (Acuerdo 257 de 2006)", "texto": "Usted ingresó como profesional universitario al Departamento Administrativo del Servicio Civil Distrital (DASCD) y participa en la inducción de nuevos servidores. Debe explicar cómo está organizada la administración distrital, qué es un sector administrativo de coordinación y qué instancia articula las entidades de cada sector. Varios asistentes trabajan en establecimientos públicos adscritos a secretarías y en alcaldías locales.", "items": [{"id": "ET-141", "niv": 1, "e": "Al explicar la estructura administrativa del Distrito, usted señala que comprende", "f": "Acuerdo 257 de 2006 del Concejo de Bogotá, art. 21", "o": [["A", "el nivel nacional, el nivel departamental de Cundinamarca y el nivel distrital.", "Esa no es la estructura de la administración distrital; Bogotá tiene régimen especial y su administración se organiza en tres sectores propios.", false], ["B", "el sector central, el sector descentralizado funcionalmente o por servicios y el sector de las localidades.", "El art. 21 del Acuerdo 257 de 2006 establece que la estructura administrativa de Bogotá comprende el sector central, el sector descentralizado funcionalmente o por servicios y el sector de las localidades.", true], ["C", "las secretarías de despacho y las empresas de servicios públicos, que son las únicas entidades con autonomía.", "La estructura incluye también departamentos administrativos, unidades administrativas especiales, establecimientos públicos y las localidades, entre otros.", false]]}, {"id": "ET-142", "niv": 2, "e": "Un sector administrativo de coordinación está conformado por", "f": "Acuerdo 257 de 2006 del Concejo de Bogotá, art. 36", "o": [["A", "los consejos superiores de la administración distrital y las comisiones intersectoriales que crea el alcalde mayor para coordinar la gestión de varios sectores.", "Esas son instancias del sistema de coordinación, no los integrantes de un sector administrativo.", false], ["B", "todas las entidades que tienen sede en una misma localidad, bajo la coordinación del alcalde local.", "La agrupación por territorio corresponde a las localidades; los sectores se organizan por áreas especializadas de la gestión.", false], ["C", "las secretarías y departamentos administrativos y las entidades descentralizadas adscritas o vinculadas a una secretaría cabeza de sector.", "El art. 36 del Acuerdo 257 de 2006 dispone que los sectores administrativos de coordinación se conforman por secretarías y departamentos administrativos y por las entidades descentralizadas adscritas o vinculadas a una secretaría cabeza de sector.", true]]}, {"id": "ET-143", "niv": 2, "e": "La instancia que articula la formulación de políticas y el seguimiento dentro de cada sector, integrada por la cabeza del sector y los directivos de sus entidades, es", "f": "Acuerdo 257 de 2006 del Concejo de Bogotá, arts. 34, 37 y 38; reglamentación distrital del MIPG (Decreto 1499 de 2017)", "o": [["A", "el Comité Sectorial de Gestión y Desempeño (antes llamado Comité Sectorial de Desarrollo Administrativo).", "El art. 37 del Acuerdo 257 de 2006 prevé en cada sector un comité integrado por la secretaría cabeza de sector y los directores o gerentes de sus entidades, que denominó Comité Sectorial de Desarrollo Administrativo; con la adopción del Modelo Integrado de Planeación y Gestión (Decreto 1499 de 2017) la reglamentación distrital lo denomina Comité Sectorial de Gestión y Desempeño.", true], ["B", "el Consejo de Gobierno Distrital, presidido por el alcalde mayor e integrado por los secretarios cabeza de sector.", "El Consejo de Gobierno Distrital es la máxima instancia de formulación de políticas para toda la administración (art. 34), no la instancia propia de cada sector.", false], ["C", "la comisión intersectorial que el alcalde mayor cree para coordinar las entidades del respectivo sector.", "Las comisiones intersectoriales coordinan funciones que comprometen entidades de diferentes sectores (art. 38 del Acuerdo 257 de 2006).", false]]}]}, {"comp": "entidades_territoriales", "rol": "profesional", "tag": "Entidades territoriales, Bogotá D.C. y CAR · Nivel profesional · Licencia ambiental", "texto": "Usted es profesional especializado de la Subdirección de Gestión Ambiental de una corporación autónoma regional de la región andina. Un municipio de su jurisdicción tramita un proyecto que, según el reglamento, requiere licencia ambiental de competencia de la corporación. El estudio de impacto ambiental identifica la necesidad de captar agua de un río, hacer un aprovechamiento forestal y verter aguas residuales. Por otra parte, una empresa le pide a la corporación un permiso de aprovechamiento forestal para un tramo de una vía nacional cuya licencia es de competencia privativa de la Autoridad Nacional de Licencias Ambientales (ANLA).", "items": [{"id": "ET-156", "niv": 2, "e": "Frente a los permisos para captar agua, aprovechar el bosque y verter aguas residuales en el proyecto del municipio, usted explica que", "f": "Decreto 1076 de 2015, art. 2.2.2.3.1.3", "o": [["A", "deben tramitarse ante la ANLA, que es la única autoridad competente para permisos dentro de proyectos licenciados.", "El proyecto es de competencia de la CAR; la ANLA no tramita permisos de proyectos licenciados por otras autoridades.", false], ["B", "quedan comprendidos en la licencia ambiental, siempre que el estudio de impacto ambiental los identifique.", "El art. 2.2.2.3.1.3 del Decreto 1076 de 2015 dispone que la licencia lleva implícitos los permisos, autorizaciones y concesiones necesarios para el uso de recursos naturales, que deben identificarse claramente en el estudio de impacto ambiental.", true], ["C", "deben tramitarse como permisos separados, después de obtenida la licencia y antes del inicio de obras.", "La licencia ambiental incorpora los permisos, concesiones y autorizaciones necesarios; no se tramitan aparte.", false]]}, {"id": "ET-157", "niv": 1, "e": "En cuanto al momento en que el municipio debe contar con la licencia, usted precisa que debe obtenerse", "f": "Ley 99 de 1993, art. 49; Decreto 1076 de 2015, art. 2.2.2.3.1.3", "o": [["A", "antes de iniciar el proyecto, obra o actividad que la requiere.", "El art. 2.2.2.3.1.3 del Decreto 1076 de 2015 exige obtener la licencia ambiental previamente a la iniciación del proyecto, obra o actividad; el art. 49 de la Ley 99 de 1993 la hace obligatoria.", true], ["B", "durante la ejecución, antes de la etapa de operación.", "La licencia es previa: no puede obtenerse después de iniciadas las obras.", false], ["C", "al terminar las obras, junto con el acta de liquidación del contrato.", "La licencia no es un trámite posterior; debe obtenerse antes del inicio.", false]]}, {"id": "ET-158", "niv": 3, "e": "Sobre la solicitud de permiso de aprovechamiento forestal para el tramo de la vía nacional, la corporación debe", "f": "Decreto 1076 de 2015, art. 2.2.2.3.1.3, parágrafo", "o": [["A", "otorgarlo de forma provisional mientras la ANLA expide la licencia ambiental del proyecto vial, con cargo de informar a esa autoridad.", "No existe un permiso provisional para estos casos; la prohibición del parágrafo del art. 2.2.2.3.1.3 es expresa.", false], ["B", "abstenerse de otorgarlo, porque forma parte de un proyecto cuya licencia es de competencia privativa de la ANLA.", "El parágrafo del art. 2.2.2.3.1.3 del Decreto 1076 de 2015 prohíbe a las CAR otorgar permisos, concesiones o autorizaciones que formen parte de un proyecto cuya licencia ambiental sea de competencia privativa de la ANLA.", true], ["C", "otorgarlo, porque el aprovechamiento forestal es competencia de la CAR en el área de su jurisdicción.", "La regla general cede ante una norma especial: cuando el permiso forma parte de un proyecto de licencia privativa de la ANLA, la CAR no puede otorgarlo.", false]]}]}, {"comp": "entidades_territoriales", "rol": "profesional", "tag": "Entidades territoriales, Bogotá D.C. y CAR · Nivel profesional · Terminación anticipada del sancionatorio ambiental", "texto": "Usted es profesional de la Oficina Jurídica de una corporación autónoma regional de Antioquia. En un procedimiento sancionatorio abierto contra una empresa constructora por la intervención de una ronda hídrica, y antes de que se decida sobre su responsabilidad, la empresa radica una propuesta de medidas técnicas para corregir y compensar la afectación, y pide suspender el procedimiento. La empresa no ha accedido antes a este beneficio.", "items": [{"id": "ET-171", "niv": 3, "e": "Frente a la petición de la empresa, la corporación puede", "f": "Ley 1333 de 2009, art. 18A (adicionado por el art. 10 de la Ley 2387 de 2024)", "o": [["A", "negarla de plano, porque la reparación del daño solo puede ordenarse en el acto administrativo final que declara la responsabilidad del infractor.", "Desde la Ley 2387 de 2024 existe la figura de suspensión y terminación anticipada por corrección o compensación, antes de la decisión de fondo.", false], ["B", "aceptarla sin evaluación, porque la sola propuesta del infractor obliga a archivar el expediente.", "La propuesta debe evaluarse y aprobarse; la terminación anticipada solo se declara después de verificar que las medidas se implementaron.", false], ["C", "suspender el ejercicio de la potestad sancionatoria si la propuesta de corrección o compensación está técnicamente soportada y es viable.", "El art. 18A de la Ley 1333 de 2009 (adicionado por el art. 10 de la Ley 2387 de 2024) permite, a petición del presunto infractor y antes de decidir sobre su responsabilidad, suspender la potestad sancionatoria si presenta medidas técnicamente soportadas y viables para corregir o compensar la afectación.", true]]}, {"id": "ET-172", "niv": 2, "e": "Si la corporación declara la suspensión, la empresa debe presentar una garantía de cumplimiento a favor de la autoridad ambiental dentro de los", "f": "Ley 1333 de 2009, art. 18A (adicionado por el art. 10 de la Ley 2387 de 2024)", "o": [["A", "tres días hábiles siguientes.", "El término legal es de cinco días hábiles.", false], ["B", "cinco días hábiles siguientes.", "El art. 18A de la Ley 1333 de 2009 ordena que, declarada la suspensión, el presunto infractor presente dentro de los cinco días hábiles siguientes una garantía que ampare las obligaciones y costos de las medidas.", true], ["C", "quince días hábiles siguientes.", "Quince días hábiles no es el término previsto para la garantía; la ley fija cinco días hábiles.", false]]}, {"id": "ET-173", "niv": 3, "e": "Sobre la duración de la suspensión y sus efectos, usted precisa que", "f": "Ley 1333 de 2009, art. 18A (adicionado por el art. 10 de la Ley 2387 de 2024)", "o": [["A", "es de máximo dos años, prorrogable hasta por la mitad, y mientras dura no corre la caducidad.", "El art. 18A de la Ley 1333 de 2009 fija la suspensión en máximo dos años, prorrogable hasta por la mitad del tiempo inicial, y dispone que durante la suspensión no corre el término de caducidad del art. 10.", true], ["B", "dura lo que la empresa necesite para ejecutar las medidas, y el cumplimiento se inscribe en el RUIA como antecedente.", "La ley fija un máximo de dos años y la terminación anticipada se inscribe con la advertencia de no ser un antecedente.", false], ["C", "puede durar hasta cinco años y durante ella sigue corriendo el término de caducidad de la acción.", "La suspensión es de máximo dos años (prorrogable hasta la mitad) y durante ella no corre la caducidad.", false]]}]}, {"comp": "comportamental", "rol": "general", "tag": "Competencias comportamentales (Decreto 815 de 2018) · Aprendizaje continuo", "texto": "Usted trabaja en la ventanilla de trámites ambientales de una corporación autónoma regional del oriente del país. Cada vez más usuarios preguntan cómo radicar en línea sus solicitudes de concesión de aguas a través de una plataforma nacional de trámites ambientales, que usted conoce poco. Además, el mes pasado entró en vigencia una norma nacional que modificó algunos requisitos de un permiso que se tramita en su ventanilla, pero la lista de chequeo interna todavía no se ha actualizado. Usted participa en un grupo virtual informal de servidores de ventanilla de varias corporaciones, donde se comparten dudas prácticas sobre el uso de la plataforma.", "items": [{"id": "CO-104", "niv": 1, "e": "Para orientar a los usuarios sobre la radicación en línea, la conducta que mejor refleja el aprendizaje continuo es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Aprendizaje continuo)", "o": [["A", "remitir a los usuarios a la mesa de ayuda de la plataforma mientras la corporación decide si capacitará al personal de ventanilla.", "Traslada la necesidad al usuario y espera una decisión institucional. La competencia pide actualizarse por iniciativa propia para mantener la efectividad de la atención.", false], ["B", "aprender el proceso con cada caso, pidiendo a los usuarios que ya radicaron que le cuenten qué pasos siguieron.", "Aprende de una fuente que no garantiza exactitud: la experiencia de cada usuario puede contener errores. La conducta asociada exige información confiable.", false], ["C", "estudiar los manuales oficiales de la plataforma y practicar la radicación, ya que así podrá orientar bien a los usuarios.", "Refleja la competencia «Aprendizaje continuo» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en identificar, incorporar y aplicar conocimientos nuevos sobre normas, tecnologías y métodos de trabajo para mantener vigente la efectividad de las propias prácticas. Corresponde a gestionar sus propias fuentes de información confiable y mantener sus competencias actualizadas según los cambios que exige la administración: los materiales oficiales son la fuente adecuada.", true]]}, {"id": "CO-105", "niv": 3, "e": "Frente a la norma nacional que cambió los requisitos del permiso, la conducta más coherente con el aprendizaje continuo es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Aprendizaje continuo)", "o": [["A", "aplicar desde ya a los usuarios su interpretación de los cambios, con base en el resumen que le envió un colega de otra corporación.", "Se apoya en una fuente secundaria sin consultar el texto oficial, y aplica por su cuenta un criterio que no comparte con su equipo ni queda reflejado en la lista de chequeo institucional.", false], ["B", "seguir aplicando la lista de chequeo vigente hasta que la oficina jurídica emita una circular, para no generar criterios distintos entre ventanillas.", "Evita criterios dispares, pero ignora un cambio normativo que ya conoce y no lo pone en conocimiento de nadie. La competencia exige incorporar las regulaciones vigentes y compartir ese saber para que la práctica se actualice.", false], ["C", "consultar el texto oficial de la norma y advertir a su jefe y a sus compañeros las diferencias frente a la lista de chequeo para que se actualice.", "Refleja la competencia «Aprendizaje continuo» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en identificar, incorporar y aplicar conocimientos nuevos sobre normas, tecnologías y métodos de trabajo para mantener vigente la efectividad de las propias prácticas. Reúne dos conductas asociadas: mantener actualizadas las competencias con base en las regulaciones vigentes, consultadas en fuente oficial, y compartir ese saber con los compañeros para que la práctica de toda la ventanilla se ajuste por el conducto institucional.", true]]}, {"id": "CO-106", "niv": 2, "e": "Respecto del grupo virtual de servidores de ventanilla de otras corporaciones, la conducta más acorde con el aprendizaje continuo es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Aprendizaje continuo)", "o": [["A", "participar en el grupo aportando las soluciones prácticas que ha encontrado y contrastándolas con las de otras corporaciones.", "Refleja la competencia «Aprendizaje continuo» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en identificar, incorporar y aplicar conocimientos nuevos sobre normas, tecnologías y métodos de trabajo para mantener vigente la efectividad de las propias prácticas. Refleja la conducta de participar en espacios informativos y de interaprendizaje, compartiendo saberes y aprendiendo de colegas habilidades diferenciales sobre el uso de la plataforma.", true], ["B", "salir del grupo y concentrarse en los cursos formales de la corporación, que son la fuente avalada por la entidad.", "La capacitación formal es útil, pero la competencia también valora los flujos informales de interaprendizaje entre colegas como medio para nivelar conocimientos.", false], ["C", "leer los mensajes del grupo sin intervenir, para no difundir prácticas de trabajo que la corporación todavía no ha revisado ni aprobado.", "Aprovecha parte de la información, pero renuncia a compartir sus saberes. Las dudas son prácticas sobre la plataforma, no criterios reservados, y la competencia incluye aportar al interaprendizaje.", false]]}]}, {"comp": "comportamental", "rol": "general", "tag": "Competencias comportamentales (Decreto 815 de 2018) · Orientación al usuario y al ciudadano", "texto": "Usted trabaja en el punto de atención de una entidad distrital de Bogotá que tramita permisos para el aprovechamiento económico del espacio público. Esta semana llega un comerciante molesto porque ha venido tres veces y en cada visita le han dado información distinta sobre su trámite. También atiende a un vendedor que no sabe leer ni escribir y necesita diligenciar el formulario de solicitud. Además, varios usuarios se quejan de demoras que se originan en la visita técnica, a cargo de otra dependencia de la entidad.", "items": [{"id": "CO-116", "niv": 2, "e": "Ante el comerciante molesto por la información contradictoria, la conducta que mejor refleja la orientación al usuario y al ciudadano es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Orientación al usuario y al ciudadano)", "o": [["A", "ofrecerle disculpas en nombre de la entidad y orientarlo a radicar una queja para que su caso quede registrado.", "Reconocer la falla y orientar la queja es válido, pero deja sin resolver la necesidad concreta: saber en qué va su trámite.", false], ["B", "escucharlo sin interrumpir, revisar en el sistema el estado real del trámite y darle una respuesta precisa sobre lo que falta.", "Refleja la competencia «Orientación al usuario y al ciudadano» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en dirigir las decisiones y acciones a satisfacer las necesidades e intereses de los usuarios internos y externos y de los ciudadanos, según las responsabilidades de la entidad. Corresponde a escuchar activamente e informar con veracidad, y a atender de forma oportuna las necesidades del usuario: resuelve la causa de su molestia con información verificada.", true], ["C", "remitirlo al coordinador del punto de atención, quien tiene acceso a todos los trámites y puede darle una respuesta definitiva.", "Prolonga la atención y suma otro intermediario, cuando usted puede verificar el estado del trámite. No atiende la necesidad de forma oportuna.", false]]}, {"id": "CO-117", "niv": 1, "e": "Para atender al vendedor que no sabe leer ni escribir, la conducta más acorde con la orientación al usuario y al ciudadano es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Orientación al usuario y al ciudadano)", "o": [["A", "pedirle que regrese acompañado de alguien de su confianza que sepa leer, para que lo ayude a diligenciar y revisar el formulario con tranquilidad.", "Le impone una carga adicional y aplaza su trámite. La competencia pide adecuar la atención a las condiciones del ciudadano.", false], ["B", "entregarle el formulario y marcar con resaltador los campos que debe llenar la persona que lo ayude.", "Muestra disposición, pero no resuelve la necesidad: el usuario sigue dependiendo de un tercero para hacer su solicitud.", false], ["C", "leerle el formulario, diligenciarlo con los datos que él le dicte y leerle lo escrito antes de que firme o ponga su huella.", "Refleja la competencia «Orientación al usuario y al ciudadano» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en dirigir las decisiones y acciones a satisfacer las necesidades e intereses de los usuarios internos y externos y de los ciudadanos, según las responsabilidades de la entidad. Refleja la conducta de aplicar la no estigmatización y la no discriminación generando espacios incluyentes: adapta la atención a la condición del usuario y asegura que conozca lo que suscribe.", true]]}, {"id": "CO-118", "niv": 3, "e": "Frente a las quejas por demoras originadas en la visita técnica de otra dependencia, la conducta que mejor refleja la orientación al usuario y al ciudadano es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Orientación al usuario y al ciudadano)", "o": [["A", "explicar a cada usuario que la demora es responsabilidad de la otra dependencia y darle el teléfono de esa oficina.", "Informa, pero se desentiende del problema y traslada al usuario la gestión interna. La competencia reconoce la interdependencia entre áreas.", false], ["B", "informar al usuario en qué etapa está su trámite y enviar a la dependencia de visitas un reporte de los casos represados con sus fechas.", "Refleja la competencia «Orientación al usuario y al ciudadano» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en dirigir las decisiones y acciones a satisfacer las necesidades e intereses de los usuarios internos y externos y de los ciudadanos, según las responsabilidades de la entidad. Reúne las conductas de reconocer la interdependencia entre su trabajo y el de otros y de informar con veracidad: da al usuario información real y alerta a quien puede resolver el represamiento.", true], ["C", "comprometerse con cada usuario a que la visita técnica de su trámite se realizará esta misma semana.", "Busca tranquilizar, pero promete algo que no controla. La competencia exige informar con veracidad.", false]]}]}, {"comp": "comportamental", "rol": "general", "tag": "Competencias comportamentales (Decreto 815 de 2018) · Orientación a resultados", "texto": "Usted trabaja en la Secretaría de Infraestructura de una gobernación y apoya el seguimiento de 15 convenios con municipios para construir vías terciarias en placa huella. Su jefe le pidió visitar todas las obras en los próximos dos meses; el vehículo asignado solo está disponible dos días por semana. En una de las visitas, el alcalde le pide que en el informe registre la obra como terminada para poder liquidar el convenio antes de fin de año, aunque usted verificó que falta cerca del 5 % de la obra, que según él se terminará en enero.", "items": [{"id": "CO-128", "niv": 1, "e": "Para planear las visitas, la conducta que mejor refleja la orientación a resultados es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Orientación a resultados)", "o": [["A", "programar las visitas según los días reales de disponibilidad del vehículo y dar prioridad a los convenios con mayor atraso.", "Refleja la competencia «Orientación a resultados» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en cumplir las funciones y los compromisos de la organización con eficacia, calidad y oportunidad. Responde a trabajar con objetivos claros y realistas y adoptar medidas para minimizar riesgos: el plan se ajusta a los recursos disponibles y atiende primero donde hay más riesgo.", true], ["B", "visitar primero los municipios más cercanos a la capital, para avanzar rápido en el número de visitas realizadas.", "Prioriza la cantidad y la comodidad sobre el riesgo. No orienta el esfuerzo a los convenios donde el seguimiento es más necesario.", false], ["C", "programar las 15 visitas dentro del primer mes para tener margen, aunque el vehículo solo esté disponible dos días por semana.", "El plan no es realista frente a los recursos: con dos días semanales de vehículo, difícilmente se cumple en un mes y el cronograma se rompería.", false]]}, {"id": "CO-129", "niv": 2, "e": "Para hacer seguimiento al avance de los convenios durante los dos meses, la conducta más acorde con la orientación a resultados es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Orientación a resultados)", "o": [["A", "anotar en su libreta de campo los hallazgos de cada visita y consolidarlos en un solo documento al cierre de los dos meses.", "Registra información, pero la consolida tarde y sin indicadores, lo que impide detectar a tiempo los convenios rezagados.", false], ["B", "actualizar cada semana una matriz con el avance físico y financiero de cada convenio, para detectar a tiempo los rezagos.", "Refleja la competencia «Orientación a resultados» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en cumplir las funciones y los compromisos de la organización con eficacia, calidad y oportunidad. Corresponde a diseñar y utilizar indicadores para medir los resultados y evaluar de forma regular el grado de consecución de los objetivos.", true], ["C", "esperar los informes de interventoría que envían los municipios y consolidar el avance cuando se reciban todos.", "Depende del ritmo de terceros y no evalúa regularmente el cumplimiento. La competencia pide medir y comprobar los resultados de forma periódica.", false]]}, {"id": "CO-130", "niv": 2, "e": "Ante la petición del alcalde, la conducta que mejor refleja la orientación a resultados es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Orientación a resultados)", "o": [["A", "abstenerse de entregar el informe de esa obra hasta que el municipio la termine en enero y entonces reportarla completa y ya recibida.", "Evita el conflicto, pero incumple la oportunidad del informe que le corresponde entregar y oculta información útil para la gobernación.", false], ["B", "registrar la obra como terminada con una observación sobre el 5 % pendiente, para no frenar la liquidación del convenio.", "Facilita la meta de liquidar, pero el informe dejaría de reflejar lo verificado. La competencia exige que los productos se enmarquen en las normas que rigen a la entidad.", false], ["C", "registrar el avance real verificado e indicar en el informe lo pendiente y la fecha anunciada por el municipio.", "Refleja la competencia «Orientación a resultados» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en cumplir las funciones y los compromisos de la organización con eficacia, calidad y oportunidad. Refleja la conducta de aportar a los resultados enmarcando los productos dentro de las normas de la entidad: el informe es oportuno y veraz, y deja constancia de lo pendiente.", true]]}]}, {"comp": "comportamental", "rol": "general", "tag": "Competencias comportamentales (Decreto 815 de 2018) · Trabajo en equipo", "texto": "Usted forma parte de un equipo de tres servidores de una corporación autónoma regional que realiza visitas de control a usuarios con concesión de aguas en una cuenca andina. El equipo acordó que cada informe de visita sea revisado por otro integrante antes de enviarlo. En las últimas semanas el equipo se ve desmotivado por la cantidad de visitas a zonas lejanas. En una visita, usted observa una captación aparentemente ilegal en un predio que está incluido en la ruta que su compañero Jorge recorrerá la próxima semana.", "items": [{"id": "CO-140", "niv": 2, "e": "Su compañero revisor hace a su informe varias observaciones que usted no comparte. La conducta que mejor refleja el trabajo en equipo es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Trabajo en equipo)", "o": [["A", "revisar cada observación con él, acoger las que mejoran el informe y explicarle con argumentos las que no comparte.", "Refleja la competencia «Trabajo en equipo» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en trabajar con otros de manera integrada y armónica para lograr metas institucionales comunes. Corresponde a respetar la diversidad de criterios y comunicarse de forma directa y respetuosa para compartir ideas: el informe mejora con el aporte de ambos.", true], ["B", "aceptar todas las observaciones sin discutirlas y enviar el informe corregido ese mismo día.", "Agiliza el envío, pero renuncia a compartir sus argumentos y puede afectar la calidad del informe.", false], ["C", "enviar el informe sin cambios, porque la responsabilidad técnica de la visita es suya.", "Desconoce el acuerdo del equipo sobre la revisión cruzada y no respeta el criterio del compañero.", false]]}, {"id": "CO-141", "niv": 3, "e": "Frente a la desmotivación del equipo por las visitas lejanas, la conducta más acorde con el trabajo en equipo es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Trabajo en equipo)", "o": [["A", "comentar a su jefe el desánimo que percibe en el equipo, para que sea él quien adopte una solución.", "Informa, pero no aporta desde su papel de integrante a la motivación del grupo.", false], ["B", "asumir usted las visitas más lejanas durante el próximo mes, para aliviar la carga de trabajo de sus dos compañeros de equipo.", "Es generoso, pero no resuelve el problema del equipo, concentra la carga en una persona y no es sostenible.", false], ["C", "reconocer en la reunión el esfuerzo de los compañeros y proponer que las visitas lejanas se distribuyan por turnos.", "Refleja la competencia «Trabajo en equipo» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en trabajar con otros de manera integrada y armónica para lograr metas institucionales comunes. Refleja la conducta de asumir su responsabilidad como miembro del equipo enfocándose en contribuir al compromiso y la motivación de los demás, con una propuesta equitativa.", true]]}, {"id": "CO-142", "niv": 3, "e": "Respecto de la captación ilegal observada, la conducta que mejor refleja el trabajo en equipo es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Trabajo en equipo)", "o": [["A", "incluirla en su informe y dejar que Jorge la conozca cuando lea el consolidado mensual de las visitas.", "Cumple el registro, pero retiene información que su compañero necesita para la visita de la próxima semana.", false], ["B", "registrarla en su informe y enviar de inmediato a Jorge la ubicación y las fotos, porque el predio está en su ruta.", "Refleja la competencia «Trabajo en equipo» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en trabajar con otros de manera integrada y armónica para lograr metas institucionales comunes. Corresponde a establecer comunicación directa para compartir información con el equipo y planificar las propias acciones según su efecto en los objetivos comunes: deja el registro formal y prepara la visita de su compañero.", true], ["C", "avisarle a Jorge y dejar que él la reporte en su propio informe, para que el hallazgo no quede registrado dos veces.", "Comparte la información, pero omite registrar lo que usted mismo observó, como exige el procedimiento de visita.", false]]}]}, {"comp": "comportamental", "rol": "profesional", "tag": "Competencias comportamentales (Decreto 815 de 2018) · Nivel profesional · Aporte técnico-profesional", "texto": "Usted es biólogo, profesional universitario de una corporación autónoma regional, y evalúa una solicitud de aprovechamiento forestal en un predio rural. Ha evaluado decenas de solicitudes parecidas y sabe que en esa zona son frecuentes los problemas de regeneración natural después del aprovechamiento. En el inventario presentado por el solicitante aparece una especie que, según su experiencia, suele estar incluida en listados oficiales con restricciones de aprovechamiento. La abogada del grupo considera que una de las exigencias técnicas que usted propone no tiene sustento normativo claro.", "items": [{"id": "CO-152", "niv": 2, "e": "La subdirección decidirá si exige un plan de manejo de la regeneración. La conducta que mejor refleja el aporte técnico-profesional es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 3, sustituido por el art. 1 del Decreto 815 de 2018 (nivel profesional: Aporte técnico-profesional)", "o": [["A", "contar a la subdirección lo que ha visto en casos similares de la zona sobre la regeneración y sus efectos.", "Refleja la competencia «Aporte técnico-profesional» (Decreto 1083 de 2015, art. 2.2.4.8, num. 3, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en poner al servicio de la administración los saberes profesionales específicos y la experiencia previa, manteniendo actualizado ese saber experto. Corresponde a informar su experiencia específica en el proceso de toma de decisiones que involucra su especialidad.", true], ["B", "recomendar negar el permiso por precaución, sin entrar en detalles técnicos que puedan complicar la decisión.", "Ofrece una conclusión sin sustento técnico, cuando su aporte consiste justamente en ese saber especializado.", false], ["C", "limitarse a entregar el informe de la visita técnica, ya que la decisión final sobre el plan corresponde a la subdirección.", "Cumple formalmente, pero se guarda un conocimiento útil para la decisión.", false]]}, {"id": "CO-153", "niv": 1, "e": "Frente a la especie del inventario, la conducta más acorde con el aporte técnico-profesional es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 3, sustituido por el art. 1 del Decreto 815 de 2018 (nivel profesional: Aporte técnico-profesional)", "o": [["A", "señalarlo en su concepto y recomendar verificar el estado de la especie en los listados oficiales antes de decidir.", "Refleja la competencia «Aporte técnico-profesional» (Decreto 1083 de 2015, art. 2.2.4.8, num. 3, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en poner al servicio de la administración los saberes profesionales específicos y la experiencia previa, manteniendo actualizado ese saber experto. Refleja la conducta de anticipar problemas previsibles que advierte en su carácter de especialista, sin afirmar más de lo que puede sustentar.", true], ["B", "dar visto bueno técnico al inventario, ya que verificar los listados oficiales le corresponde al área jurídica de la corporación.", "Omite un problema que advierte como especialista y que debería quedar en su concepto.", false], ["C", "recomendar que se niegue la solicitud por la sola presencia de esa especie en el inventario del predio.", "Concluye sin verificar el estado de la especie ni el alcance de la restricción, más allá de lo que su experiencia permite afirmar.", false]]}, {"id": "CO-154", "niv": 3, "e": "Ante la observación de la abogada sobre la exigencia técnica, la conducta que mejor refleja el aporte técnico-profesional es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 3, sustituido por el art. 1 del Decreto 815 de 2018 (nivel profesional: Aporte técnico-profesional)", "o": [["A", "retirar la exigencia del concepto, porque en caso de duda el criterio jurídico prima sobre el técnico.", "Abandona su aporte sin analizar si la exigencia puede sustentarse por otra vía o reformularse.", false], ["B", "mantener la exigencia en el concepto, ya que técnicamente es necesaria aunque la abogada del grupo no le encuentre sustento.", "Defiende su saber, pero no integra el punto de vista jurídico, que es relevante para que la exigencia sea viable.", false], ["C", "revisar con ella el fundamento técnico y normativo, y sustentar o ajustar la exigencia según el resultado del análisis.", "Refleja la competencia «Aporte técnico-profesional» (Decreto 1083 de 2015, art. 2.2.4.8, num. 3, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en poner al servicio de la administración los saberes profesionales específicos y la experiencia previa, manteniendo actualizado ese saber experto. Corresponde a asumir la interdisciplinariedad, aprendiendo de puntos de vista diversos para ponderar las soluciones posibles.", true]]}]}, {"comp": "comportamental", "rol": "profesional", "tag": "Competencias comportamentales (Decreto 815 de 2018) · Nivel profesional · Gestión de procedimientos", "texto": "Usted es ingeniero ambiental, profesional universitario de una corporación autónoma regional, y evalúa solicitudes de permiso de vertimientos. El procedimiento de la corporación exige que la caracterización del vertimiento presentada por el usuario provenga de un laboratorio acreditado. En el último semestre, el 60 % de las solicitudes que usted recibió fueron devueltas por estar incompletas. Hoy su jefe le pide emitir un concepto técnico antes de terminar el día, pero aún le falta revisar el modelo de dispersión del vertimiento que el procedimiento exige verificar.", "items": [{"id": "CO-164", "niv": 1, "e": "Un usuario presenta una caracterización hecha por un laboratorio no acreditado, con resultados que cumplen los límites. La conducta que mejor refleja la gestión de procedimientos es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 3, sustituido por el art. 1 del Decreto 815 de 2018 (nivel profesional: Gestión de procedimientos)", "o": [["A", "tomar usted mismo muestras del vertimiento durante la visita técnica para reemplazar el estudio presentado por el usuario.", "Busca una solución, pero asume una tarea que el procedimiento asigna al usuario y a un laboratorio acreditado.", false], ["B", "pedir al usuario un nuevo análisis hecho por un laboratorio con acreditación, porque así lo exige la corporación.", "Refleja la competencia «Gestión de procedimientos» (Decreto 1083 de 2015, art. 2.2.4.8, num. 3, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en desarrollar las tareas a cargo dentro de los procedimientos vigentes y proponer acciones que aceleren la mejora continua y la productividad. Corresponde a desarrollar las actividades de acuerdo con las pautas y protocolos definidos y ejecutar las tareas con los criterios de calidad establecidos.", true], ["C", "aceptar el estudio, ya que los resultados cumplen y exigir uno nuevo retrasaría el trámite del usuario.", "Prioriza la rapidez sobre un requisito del procedimiento que garantiza la confiabilidad de los datos.", false]]}, {"id": "CO-165", "niv": 2, "e": "Frente al alto porcentaje de solicitudes devueltas, la conducta más acorde con la gestión de procedimientos es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 3, sustituido por el art. 1 del Decreto 815 de 2018 (nivel profesional: Gestión de procedimientos)", "o": [["A", "analizar las causas más frecuentes de devolución y proponer una lista de requisitos para entregar desde la radicación.", "Refleja la competencia «Gestión de procedimientos» (Decreto 1083 de 2015, art. 2.2.4.8, num. 3, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en desarrollar las tareas a cargo dentro de los procedimientos vigentes y proponer acciones que aceleren la mejora continua y la productividad. Refleja la conducta de revisar procedimientos e instrumentos para mejorar tiempos y resultados y anticipar soluciones a problemas.", true], ["B", "ampliar por su cuenta el plazo para que los usuarios completen la información y evitar así las devoluciones.", "Modifica de hecho una regla del procedimiento sin que la mejora se haya aprobado.", false], ["C", "dedicar más tiempo a llamar a cada usuario para explicarle qué documentos le faltan a su solicitud.", "Mejora la atención caso a caso, pero no revisa el procedimiento ni ataca la causa del problema.", false]]}, {"id": "CO-166", "niv": 3, "e": "Ante la solicitud de su jefe de emitir hoy el concepto, la conducta que mejor refleja la gestión de procedimientos es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 3, sustituido por el art. 1 del Decreto 815 de 2018 (nivel profesional: Gestión de procedimientos)", "o": [["A", "emitir hoy el concepto con la salvedad de que el modelo de dispersión se revisará en los días siguientes.", "Cumple el plazo, pero emite un concepto sin la verificación que el procedimiento exige como parte de su calidad.", false], ["B", "informar a su jefe qué revisión falta y cuánto tiempo tomará, y emitir el concepto cuando esté completa.", "Refleja la competencia «Gestión de procedimientos» (Decreto 1083 de 2015, art. 2.2.4.8, num. 3, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en desarrollar las tareas a cargo dentro de los procedimientos vigentes y proponer acciones que aceleren la mejora continua y la productividad. Corresponde a ejecutar sus tareas con los criterios de calidad establecidos y conforme a los protocolos definidos, manteniendo informado a su jefe para que gestione el tiempo.", true], ["C", "emitir hoy el concepto apoyándose en las conclusiones del consultor del usuario sobre el modelo de dispersión.", "Sustituye la verificación propia exigida por el procedimiento por la opinión de una parte interesada.", false]]}]}, {"comp": "comportamental", "rol": "profesional", "tag": "Competencias comportamentales (Decreto 815 de 2018) · Nivel profesional · Profesional con personal a cargo: toma de decisiones", "texto": "Usted es profesional especializado y coordina el grupo de licencias y permisos ambientales de una corporación autónoma regional, con seis profesionales a cargo. El grupo tiene 120 expedientes pendientes: algunos con términos próximos a vencer, otros relacionados con proyectos de alto impacto ambiental y otros sencillos. La subdirección le pidió definir si el grupo adopta un nuevo formato de concepto técnico, entre dos alternativas. Esta semana, uno de los profesionales inició una incapacidad médica de tres meses y deja 20 expedientes en trámite.", "items": [{"id": "CO-176", "niv": 1, "e": "Para organizar la atención de los 120 expedientes, la conducta que mejor refleja la toma de decisiones es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 3, sustituido por el art. 1 del Decreto 815 de 2018 (nivel profesional con personal a cargo: Toma de decisiones)", "o": [["A", "atenderlos por estricto orden de radicación, que es el criterio más objetivo y fácil de explicar a los usuarios de la corporación.", "Es un criterio sencillo, pero ignora los términos próximos a vencer y el riesgo ambiental.", false], ["B", "dar prioridad a los expedientes más sencillos para reducir rápidamente el número de pendientes del grupo.", "Mejora la cifra, pero deja en riesgo los casos con términos y los de mayor impacto.", false], ["C", "priorizar los expedientes con términos próximos a vencer y los de mayor riesgo ambiental, asignando responsables y fechas.", "Refleja la competencia «Toma de decisiones» (Decreto 1083 de 2015, art. 2.2.4.8, num. 3, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en elegir alternativas para solucionar problemas y ejecutar acciones concretas y coherentes con lo decidido. Corresponde a elegir con oportunidad los asuntos a atender, estableciendo responsabilidades precisas con base en las prioridades de la entidad.", true]]}, {"id": "CO-177", "niv": 3, "e": "Para decidir sobre el nuevo formato de concepto técnico, la conducta más acorde con la toma de decisiones es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 3, sustituido por el art. 1 del Decreto 815 de 2018 (nivel profesional con personal a cargo: Toma de decisiones)", "o": [["A", "adoptar la alternativa que usted prefiere, ya que la decisión le corresponde como coordinador del grupo.", "La decisión es suya, pero la competencia pide considerar la opinión técnica de los colaboradores al analizar las alternativas.", false], ["B", "pedir a los profesionales que analicen ambas alternativas y luego decidir usted, explicando las razones.", "Refleja la competencia «Toma de
