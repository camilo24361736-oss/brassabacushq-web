scritorio, para que las organice quien llegue» y afirma que, una vez entregue el puesto, no responderá por nada de lo que pase con esos documentos. Su jefe le pide a usted apoyar la entrega.", "items": [{"id": "GP-203", "niv": 1, "e": "Según la Ley 594 de 2000, al desvincularse la profesional debe", "f": "Ley 594 de 2000, art. 15", "o": [["A", "entregar los documentos y archivos a su cargo debidamente inventariados.", "El artículo 15 de la Ley 594 de 2000 obliga a los servidores públicos que se desvinculan a entregar los documentos y archivos a su cargo debidamente inventariados, según las normas del AGN.", true], ["B", "llevarse copia de los expedientes para responder ante cualquier requerimiento futuro.", "Los documentos son de la entidad y deben quedar en ella; llevarse copias de expedientes no es la forma de cumplir el deber de entrega.", false], ["C", "entregar las carpetas a su jefe sin inventario, porque son documentos en trámite.", "La ley no exceptúa los documentos en trámite: la entrega debe hacerse inventariada.", false]]}, {"id": "GP-204", "niv": 2, "e": "Para registrar la entrega de las carpetas, el instrumento adecuado es", "f": "Ley 594 de 2000, arts. 15 y 26; Archivo General de la Nación, FUID", "o": [["A", "la tabla de valoración documental (TVD).", "La TVD se usa para valorar fondos acumulados y definir su disposición final; no sirve para relacionar las carpetas que entrega un servidor.", false], ["B", "el Formato Único de Inventario Documental (FUID).", "El inventario documental es el instrumento que registra las unidades documentales a cargo de un servidor (Ley 594 de 2000, arts. 15 y 26), y el formato adoptado por el AGN para ello es el FUID.", true], ["C", "el Plan Institucional de Archivos (PINAR).", "El PINAR es un instrumento de planeación de la función archivística, no un registro de entrega de expedientes.", false]]}, {"id": "GP-205", "niv": 2, "e": "Frente a la afirmación de la profesional sobre su responsabilidad, usted le aclara que", "f": "Ley 594 de 2000, art. 15", "o": [["A", "solo responde si los documentos se pierden en los tres meses siguientes a su retiro.", "La ley no fija un plazo de tres meses; la responsabilidad depende de las irregularidades imputables, no de un término desde el retiro.", false], ["B", "tiene razón, porque la responsabilidad pasa a quien recibe el puesto desde la firma del acta.", "La ley dispone que la entrega no exonera de la responsabilidad que pueda haber por irregularidades; no se traslada automáticamente al sucesor.", false], ["C", "la entrega inventariada no la exonera de la responsabilidad que surja por irregularidades.", "El artículo 15 de la Ley 594 de 2000 precisa que la entrega inventariada se hace sin que ello implique exoneración de la responsabilidad a que haya lugar en caso de irregularidades.", true]]}]}, {"comp": "entidades_territoriales", "rol": "general", "tag": "Entidades territoriales, Bogotá D.C. y CAR · Asamblea departamental", "texto": "Usted es profesional universitario de la Secretaría General de la Asamblea de un departamento del Caribe colombiano. Corre el tercer año del periodo constitucional. En agosto, el gobernador necesita que la Asamblea apruebe con urgencia una autorización para comprometer vigencias futuras de un proyecto vial, y algunos diputados preguntan si en esas sesiones podrán también citar al secretario de Salud por la crisis hospitalaria. Además, la mesa directiva le pide aclarar quién debe aprobar el presupuesto departamental de la próxima vigencia.", "items": [{"id": "ET-123", "niv": 1, "e": "Sobre los periodos de sesiones ordinarias de la Asamblea en ese tercer año, usted informa que van", "f": "Ley 2200 de 2022, art. 23", "o": [["A", "de febrero, mayo, agosto y noviembre, por derecho propio y máximo una vez por día.", "Ese calendario corresponde a los concejos de municipios de tercera a sexta categoría (art. 23 de la Ley 136 de 1994), no a las asambleas departamentales.", false], ["B", "del 1 de marzo al 30 de abril, del 1 de junio al 30 de julio y del 1 de octubre al 30 de noviembre.", "El art. 23 de la Ley 2200 de 2022 fija, para el segundo, tercer y cuarto año, los periodos de 1 de marzo a 30 de abril, 1 de junio a 30 de julio y 1 de octubre a 30 de noviembre.", true], ["C", "del 1 de enero al último día de febrero, del 1 de junio al 30 de julio y del 1 de octubre al 30 de noviembre.", "El periodo de enero a febrero corresponde solo al primer año de sesiones; del segundo al cuarto año el primer periodo va del 1 de marzo al 30 de abril (art. 23 de la Ley 2200 de 2022).", false]]}, {"id": "ET-124", "niv": 2, "e": "Si el gobernador convoca a sesiones extraordinarias en agosto para tramitar la autorización de vigencias futuras, los diputados", "f": "Ley 2200 de 2022, art. 23", "o": [["A", "podrán ocuparse de los asuntos que el gobernador someta y, además, ejercer el control político propio de la corporación.", "El art. 23 de la Ley 2200 de 2022 limita las extraordinarias a los asuntos que el gobernador somete, pero deja a salvo la función de control político y los temas administrativos de la corporación.", true], ["B", "podrán tramitar cualquier proyecto de ordenanza, porque las extraordinarias amplían la agenda ordinaria.", "En las extraordinarias la asamblea solo puede ocuparse de los asuntos que el gobernador somete (además del control político y temas administrativos propios).", false], ["C", "solo podrán ocuparse de la autorización de vigencias futuras, sin adelantar debates de control político.", "La Ley 2200 de 2022 dejó expresamente a salvo el control político durante las sesiones extraordinarias.", false]]}, {"id": "ET-125", "niv": 1, "e": "En relación con el presupuesto departamental de la próxima vigencia, usted aclara que", "f": "Ley 2200 de 2022, art. 19, num. 32", "o": [["A", "lo expide la Asamblea departamental con base en el proyecto que le presente el gobernador.", "El art. 19, numeral 32 de la Ley 2200 de 2022 asigna a la Asamblea expedir anualmente el presupuesto de rentas y gastos, con base en el proyecto presentado por el gobernador.", true], ["B", "lo expide el gobernador por decreto, y la Asamblea solo puede improbarlo dentro del mes siguiente.", "La expedición anual del presupuesto es función de la Asamblea; el gobernador presenta el proyecto (art. 19, num. 32 de la Ley 2200 de 2022).", false], ["C", "lo aprueba el Consejo Departamental de Política Fiscal, previo concepto de la Asamblea.", "Ningún consejo de política fiscal sustituye a la Asamblea en la expedición del presupuesto.", false]]}]}, {"comp": "entidades_territoriales", "rol": "general", "tag": "Entidades territoriales, Bogotá D.C. y CAR · Gestión del riesgo: responsables y consejos", "texto": "Usted es técnico administrativo de la Secretaría de Gobierno de un municipio de sexta categoría del Chocó, donde las lluvias suelen generar desbordamientos. El municipio no tiene oficina de gestión del riesgo y el alcalde pregunta quién es el responsable de los procesos de gestión del riesgo en el municipio, qué papel cumple el consejo municipal de gestión del riesgo y si puede delegar esa responsabilidad en la corporación autónoma regional, que tiene más personal técnico.", "items": [{"id": "ET-177", "niv": 1, "e": "Sobre la responsabilidad de la gestión del riesgo en el municipio, usted le indica al alcalde que", "f": "Ley 1523 de 2012, arts. 13 y 14", "o": [["A", "corresponde a la Unidad Nacional para la Gestión del Riesgo de Desastres, porque el municipio no cuenta con una oficina especializada en la materia.", "La UNGRD dirige el sistema nacional y apoya a los territorios, pero no sustituye la responsabilidad del alcalde en el municipio.", false], ["B", "él es el responsable directo de implementar los procesos de conocimiento, reducción del riesgo y manejo de desastres en su jurisdicción.", "El art. 14 de la Ley 1523 de 2012 establece que el alcalde, como conductor del desarrollo local, es el responsable directo de la implementación de los procesos de gestión del riesgo en el municipio.", true], ["C", "corresponde al gobernador, porque es agente del Presidente en materia de orden público.", "El gobernador responde en el ámbito departamental (art. 13), pero en el municipio el responsable directo es el alcalde (art. 14 de la Ley 1523 de 2012).", false]]}, {"id": "ET-178", "niv": 1, "e": "Sobre el consejo municipal de gestión del riesgo, usted explica que es", "f": "Ley 1523 de 2012, art. 27", "o": [["A", "una dependencia de la alcaldía con planta de personal propia y presupuesto independiente.", "El consejo no es una dependencia con planta ni presupuesto propio; es una instancia de coordinación. Los recursos se manejan en el fondo municipal de gestión del riesgo.", false], ["B", "un organismo de socorro encargado de ejecutar directamente las labores de rescate en las emergencias.", "Las labores de rescate las ejecutan los organismos operativos (bomberos, Defensa Civil, Cruz Roja); el consejo es una instancia de coordinación.", false], ["C", "una instancia de coordinación, asesoría, planeación y seguimiento de la gestión del riesgo.", "El art. 27 de la Ley 1523 de 2012 crea los consejos territoriales como instancias de coordinación, asesoría, planeación y seguimiento para garantizar la efectividad y articulación de los procesos de conocimiento, reducción y manejo.", true]]}, {"id": "ET-179", "niv": 3, "e": "Sobre trasladar la responsabilidad a la corporación autónoma regional, usted aclara que", "f": "Ley 1523 de 2012, art. 31, parágrafos 1 y 3", "o": [["A", "el papel de la CAR es complementario y subsidiario y no exime al alcalde de su responsabilidad primaria, aunque debe apoyar al municipio.", "El parágrafo 1 del art. 31 de la Ley 1523 de 2012 señala que el papel de las CAR es complementario y subsidiario respecto de alcaldías y gobernaciones y no exime a los alcaldes de su responsabilidad primaria; el parágrafo 3 las obliga a apoyar a las entidades territoriales.", true], ["B", "es obligatorio en municipios de sexta categoría, que deben entregar la gestión del riesgo a la CAR.", "La ley no prevé esa transferencia por categoría; la responsabilidad primaria del alcalde se mantiene en todos los municipios.", false], ["C", "es viable mediante convenio interadministrativo, porque la CAR es la máxima autoridad ambiental y asume la gestión del riesgo en toda su jurisdicción.", "La condición de máxima autoridad ambiental no convierte a la CAR en responsable principal de la gestión del riesgo; su papel es complementario.", false]]}]}, {"comp": "comportamental", "rol": "general", "tag": "Competencias comportamentales (Decreto 815 de 2018) · Orientación a resultados", "texto": "Usted trabaja en la Secretaría de Gobierno de una gobernación y es responsable de consolidar, cada trimestre, el informe de avance del programa de dotación a juntas de acción comunal en los 40 municipios del departamento. El informe del trimestre actual debe entregarse el 15 de noviembre al despacho del secretario. A cinco días del plazo, 12 municipios no han enviado su reporte. Además, cada municipio usa un formato distinto y usted invierte tres días por trimestre en unificarlos.", "items": [{"id": "CO-110", "niv": 2, "e": "Frente a los 12 municipios que no han reportado, la conducta que mejor refleja la orientación a resultados es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Orientación a resultados)", "o": [["A", "pedir al secretario una prórroga de dos semanas para presentar el informe con los 40 municipios completos.", "Busca la calidad del informe, pero sacrifica la oportunidad sin haber intentado antes cumplir. La competencia exige cumplir los compromisos dentro de los tiempos establecidos.", false], ["B", "contactar a los enlaces de los 12 municipios, acordar envíos antes del 15 y, si alguno no reporta, entregar en la fecha dejando constancia.", "Refleja la competencia «Orientación a resultados» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en cumplir las funciones y los compromisos de la organización con eficacia, calidad y oportunidad. Corresponde a plantear estrategias para alcanzar los resultados y cumplir con oportunidad según los tiempos de la entidad: actúa sobre la causa del retraso y, a la vez, asegura la entrega dentro del plazo con información verificada.", true], ["C", "entregar el informe en la fecha y completar los datos de los 12 municipios faltantes con estimaciones basadas en lo reportado el trimestre anterior.", "Cumple la fecha, pero presenta datos estimados como si fueran reportes de los municipios, lo que afecta la calidad del informe; además, no gestiona los reportes faltantes en los días disponibles.", false]]}, {"id": "CO-111", "niv": 1, "e": "Al preparar el informe, usted detecta que una cifra que consolidó en el informe del trimestre anterior quedó mal sumada. La conducta más acorde con la orientación a resultados es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Orientación a resultados)", "o": [["A", "pedir al municipio que reportó la información que remita una corrección oficial del dato.", "El error fue de consolidación, no del municipio. Trasladarle la corrección no refleja la conducta de asumir la responsabilidad por los propios resultados.", false], ["B", "corregir el dato en el nuevo informe sin mencionarlo, para no afectar la confianza en la información del programa.", "Corrige, pero oculta el error a quienes ya usaron la cifra anterior. Asumir la responsabilidad por los resultados implica reconocer y corregir de forma visible.", false], ["C", "informar el error a su jefe, corregir la cifra y dejar nota de la corrección en el informe actual, para que quienes usaron el dato lo sepan.", "Refleja la competencia «Orientación a resultados» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en cumplir las funciones y los compromisos de la organización con eficacia, calidad y oportunidad. Refleja la conducta de asumir la responsabilidad por sus resultados: reconoce el error propio, lo corrige y deja trazabilidad para que los usuarios del informe tengan el dato correcto.", true]]}, {"id": "CO-112", "niv": 3, "e": "Respecto de los tres días que invierte cada trimestre en unificar formatos, la conducta que mejor refleja la orientación a resultados es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Orientación a resultados)", "o": [["A", "seguir haciendo la unificación usted mismo, ya que cambiar el formato podría confundir a los municipios y retrasar los reportes.", "Evita un riesgo, pero renuncia a mejorar un proceso ineficiente. La competencia incluye plantear estrategias para superar los resultados y mejorar la productividad.", false], ["B", "solicitar que se asigne un contratista de apoyo para hacer la unificación de los formatos cada trimestre.", "Gestiona recursos, pero mantiene el reproceso y lo traslada a otra persona con un costo adicional. No ataca la causa del problema.", false], ["C", "diseñar un formato único con instrucciones y proponerlo a su jefe para enviarlo a los municipios desde el próximo trimestre.", "Refleja la competencia «Orientación a resultados» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en cumplir las funciones y los compromisos de la organización con eficacia, calidad y oportunidad. Corresponde a plantear estrategias para alcanzar o superar los resultados y gestionar mejoras de productividad: ataca la causa del reproceso y libera tiempo para el análisis.", true]]}]}, {"comp": "comportamental", "rol": "general", "tag": "Competencias comportamentales (Decreto 815 de 2018) · Trabajo en equipo", "texto": "Usted integra el equipo de educación ambiental de una corporación autónoma regional del Caribe, que prepara una jornada sobre ahorro de agua en 12 instituciones educativas. En la última reunión cada integrante asumió una tarea: usted, los contenidos de las charlas; Laura, la logística y los horarios acordados con los colegios; Andrés, la convocatoria; y Mateo, quien llegó hace una semana trasladado de otra dependencia, el registro fotográfico. Mateo no conoce aún a los rectores ni la forma de trabajo del equipo.", "items": [{"id": "CO-122", "niv": 2, "e": "Respecto de Mateo, la conducta que mejor refleja el trabajo en equipo es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Trabajo en equipo)", "o": [["A", "sugerir que Mateo asista a esta jornada solo como observador y asuma tareas desde la siguiente.", "Pospone su integración y desconoce que ya asumió una tarea en el reparto del equipo.", false], ["B", "explicarle cómo funciona el equipo y presentarle a los contactos de los colegios, para que asuma pronto su tarea.", "Refleja la competencia «Trabajo en equipo» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en trabajar con otros de manera integrada y armónica para lograr metas institucionales comunes. Corresponde a integrar a los nuevos miembros y facilitar su proceso de reconocimiento y apropiación de las actividades a cargo del equipo.", true], ["C", "enviarle por correo las actas de las reuniones anteriores y el directorio de colegios para que se ponga al día por su cuenta.", "Le entrega información, pero lo deja solo en su proceso de integración. La conducta asociada pide facilitar activamente el reconocimiento de las actividades del equipo.", false]]}, {"id": "CO-123", "niv": 2, "e": "Andrés propone hacer la convocatoria por redes sociales; usted considera que funcionaría mejor un oficio dirigido a cada rector. La conducta más acorde con el trabajo en equipo es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Trabajo en equipo)", "o": [["A", "exponer sus razones en la reunión, escuchar las de Andrés y acoger lo que el equipo decida, aunque no sea su propuesta.", "Refleja la competencia «Trabajo en equipo» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en trabajar con otros de manera integrada y armónica para lograr metas institucionales comunes. Reúne las conductas de establecer comunicación directa para compartir ideas con respeto y de respetar la diversidad de criterios y opiniones de los miembros del equipo.", true], ["B", "enviar por su cuenta oficios a los rectores como respaldo, por si la convocatoria por redes no funciona.", "Actúa sin considerar el efecto en el trabajo de su compañero y puede duplicar o contradecir la convocatoria. No planifica teniendo en cuenta los objetivos del grupo.", false], ["C", "dejar que Andrés haga la convocatoria a su manera y concentrarse en preparar los contenidos de las charlas de ahorro de agua.", "Respeta la tarea de Andrés, pero se guarda una idea que podría mejorar el resultado común. La competencia incluye compartir ideas de forma directa y respetuosa.", false]]}, {"id": "CO-124", "niv": 3, "e": "Usted quiere ampliar las charlas para incluir el cambio climático, lo que las alargaría de 30 a 60 minutos. La conducta que mejor refleja el trabajo en equipo es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Trabajo en equipo)", "o": [["A", "ajustar los contenidos a 60 minutos, porque los contenidos son su responsabilidad y el cambio mejora la calidad pedagógica.", "Mejora su parte, pero ignora el efecto sobre los horarios ya pactados por Laura con los colegios. No planifica pensando en el objetivo del grupo.", false], ["B", "revisar con Laura si los horarios pactados con los colegios admiten una charla más larga, antes de cambiarla.", "Refleja la competencia «Trabajo en equipo» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en trabajar con otros de manera integrada y armónica para lograr metas institucionales comunes. Corresponde a planificar las propias acciones teniendo en cuenta su repercusión en los objetivos grupales: el cambio afecta la logística que maneja otra compañera y debe acordarse con ella.", true], ["C", "mantener las charlas de 30 minutos y guardar la idea del cambio climático para otra jornada, sin comentarla al equipo.", "Evita riesgos, pero se reserva una idea útil. El trabajo en equipo incluye compartir información e ideas con los demás integrantes.", false]]}]}, {"comp": "comportamental", "rol": "general", "tag": "Competencias comportamentales (Decreto 815 de 2018) · Compromiso con la organización", "texto": "Usted trabaja en un instituto distrital de Bogotá cuyo plan de acción incluye la meta de reducir el consumo de papel en 30 % este año. La política de seguridad de la información de la entidad prohíbe enviar documentos institucionales a correos personales. Esta semana usted tiene atrasados dos informes, y el área de correspondencia está represada por el aumento de solicitudes ciudadanas. Varios compañeros siguen imprimiendo borradores por costumbre.", "items": [{"id": "CO-134", "niv": 2, "e": "Para ponerse al día con los informes, la conducta que mejor refleja el compromiso con la organización es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Compromiso con la organización)", "o": [["A", "enviarse los archivos a su correo personal por esta única vez y terminarlos en casa esa noche, ya que lo importante es cumplir con la entidad.", "Tiene buena intención, pero desconoce una norma institucional de seguridad. La competencia incluye respetar las normas de la organización mientras promueve sus metas.", false], ["B", "entregar los informes en la fecha con la información que alcance a procesar y enviar los anexos la semana siguiente.", "Cumple la fecha formalmente, pero con un producto incompleto y sin haber concertado el ajuste con su jefe.", false], ["C", "cumplir la política de seguridad y acordar con su jefe la prioridad de los informes dentro de la jornada o un acceso remoto autorizado.", "Refleja la competencia «Compromiso con la organización» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en alinear el propio comportamiento con las necesidades, prioridades y metas de la organización. Corresponde a promover el cumplimiento de las metas de la organización respetando sus normas: busca terminar los informes sin poner en riesgo la información.", true]]}, {"id": "CO-135", "niv": 1, "e": "Frente a la meta de reducción de papel, la conducta más acorde con el compromiso con la organización es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Compromiso con la organización)", "o": [["A", "aplicar la meta en su trabajo y recordar a sus compañeros las alternativas digitales, porque la meta es de toda la entidad.", "Refleja la competencia «Compromiso con la organización» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en alinear el propio comportamiento con las necesidades, prioridades y metas de la organización. Refleja la conducta de promover el cumplimiento de las metas de la organización y respetar sus normas, empezando por la propia práctica.", true], ["B", "proponer que la meta se aplace hasta que la entidad compre más escáneres y pantallas para todas sus dependencias y sedes.", "Puede señalar una necesidad real, pero condiciona la meta en lugar de contribuir a cumplirla con los medios disponibles.", false], ["C", "seguir imprimiendo solo los borradores que considera más importantes para revisarlos con mayor detalle en papel.", "Reduce algo el consumo, pero antepone su preferencia de trabajo a una meta institucional.", false]]}, {"id": "CO-136", "niv": 2, "e": "Usted terminó sus tareas del día dos horas antes y sabe que correspondencia está represada. La conducta que mejor refleja el compromiso con la organización es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Compromiso con la organización)", "o": [["A", "pasar a apoyar en correspondencia el resto de la semana y dejar para la siguiente las tareas nuevas que le lleguen.", "Colabora, pero descuida sus propias tareas. La conducta asociada pide colaborar sin desatender lo propio.", false], ["B", "esperar a que su jefe le asigne formalmente apoyar a correspondencia, para no invadir funciones de otra área.", "Es respetuoso, pero no toma la iniciativa de colaborar cuando la organización lo necesita y usted tiene disponibilidad.", false], ["C", "ofrecer a la coordinadora de correspondencia esas dos horas de apoyo, avisando previamente a su jefe.", "Refleja la competencia «Compromiso con la organización» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en alinear el propio comportamiento con las necesidades, prioridades y metas de la organización. Corresponde a tomar la iniciativa de colaborar con otras áreas cuando se requiere, sin descuidar sus tareas: usa un tiempo libre y mantiene informado a su jefe.", true]]}]}, {"comp": "comportamental", "rol": "general", "tag": "Competencias comportamentales (Decreto 815 de 2018) · Adaptación al cambio", "texto": "Usted trabaja en la Secretaría de Planeación de una gobernación. La nueva secretaria de despacho cambió la forma de reportar: en lugar del informe mensual en documento de texto, cada servidor debe cargar sus datos cada semana en un tablero digital. También reasignó tareas: usted deja el seguimiento de proyectos, que hizo durante seis años, y pasa a apoyar la estructuración de nuevos proyectos, actividad que también está prevista en el manual de funciones de su empleo. Además, la dependencia se trasladará a una sede con puestos de trabajo compartidos.", "items": [{"id": "CO-146", "niv": 1, "e": "Frente al nuevo esquema de reporte, la conducta que mejor refleja la adaptación al cambio es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Adaptación al cambio)", "o": [["A", "cargar sus datos en el tablero cada semana desde el inicio, ya que es la forma de reporte que adoptó la secretaría.", "Refleja la competencia «Adaptación al cambio» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en afrontar con flexibilidad las situaciones nuevas y manejar los cambios de forma positiva y constructiva. Corresponde a aceptar y adaptarse con facilidad a las nuevas situaciones y apoyar a la entidad en nuevas formas de trabajo.", true], ["B", "pedir a la secretaria que mantenga el informe mensual, explicando que ha funcionado bien durante años en la dependencia.", "Defiende la práctica anterior en lugar de responder con flexibilidad a la nueva decisión.", false], ["C", "seguir preparando también el informe mensual en documento de texto, por si el nuevo esquema no se mantiene en el tiempo.", "Duplica el trabajo y muestra resistencia a adoptar por completo la nueva forma de reporte.", false]]}, {"id": "CO-147", "niv": 3, "e": "Respecto de la reasignación de tareas, la conducta más acorde con la adaptación al cambio es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Adaptación al cambio)", "o": [["A", "asumir la estructuración y, de manera informal, seguir pendiente de sus antiguos proyectos para que no se pierdan.", "Acepta el cambio solo en parte: mantener el seguimiento informal genera duplicidad y confusión sobre quién es responsable.", false], ["B", "asumir las nuevas tareas, identificar lo que necesita aprender y entregar a su reemplazo el estado de los proyectos.", "Refleja la competencia «Adaptación al cambio» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en afrontar con flexibilidad las situaciones nuevas y manejar los cambios de forma positiva y constructiva. Refleja la conducta de responder al cambio con flexibilidad y cooperar activamente en la implementación de nuevos objetivos y formas de trabajo, facilitando la transición.", true], ["C", "pedir que lo mantengan en el seguimiento de proyectos, donde tiene más experiencia y puede aportar más a la entidad.", "Su argumento es razonable, pero se resiste a una decisión de la entidad que está dentro de las funciones de su empleo.", false]]}, {"id": "CO-148", "niv": 2, "e": "Ante el traslado a una sede con puestos compartidos, la conducta que mejor refleja la adaptación al cambio es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Adaptación al cambio)", "o": [["A", "solicitar un puesto fijo, argumentando que maneja documentos que requieren un lugar estable de trabajo.", "Busca mantener la condición anterior en lugar de ajustarse a la nueva forma de trabajo de la entidad.", false], ["B", "llevarse a casa cada día los documentos físicos de trabajo, para no perderlos al cambiar de puesto.", "Intenta resolver el problema, pero de una forma que pone en riesgo la información institucional.", false], ["C", "organizar su información en las herramientas digitales de la entidad para poder trabajar desde cualquier puesto.", "Refleja la competencia «Adaptación al cambio» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en afrontar con flexibilidad las situaciones nuevas y manejar los cambios de forma positiva y constructiva. Corresponde a aceptar y adaptarse a las nuevas situaciones, ajustando su forma de trabajo a las nuevas condiciones.", true]]}]}, {"comp": "comportamental", "rol": "asistencial", "tag": "Competencias comportamenta a regla de seguridad de la corporación.", false], ["C", "informar al equipo el horario límite de regreso y ajustar con ellos el plan, ya que esa vía no debe transitarse de noche.", "Refleja la competencia «Colaboración» (Decreto 1083 de 2015, art. 2.2.4.8, num. 5, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en cooperar con los demás para alcanzar los objetivos institucionales. Corresponde a articular sus actuaciones con las de los demás y facilitar la labor de los compañeros dentro de las reglas de la entidad.", true]]}]}];
const CFG = {"titulo": "Simulacro 1 · Nivel asistencial · CNSC Empleo Público", "modo": "simulacro", "minutos": 145, "componentes": {"estado_constitucion": "Estado y Constitución", "empleo_publico": "Empleo público, carrera y régimen disciplinario", "atencion_procedimiento": "Atención al ciudadano y procedimiento administrativo", "gestion_publica": "Gestión pública, MIPG, contratación y documentos", "entidades_territoriales": "Entidades territoriales, Bogotá D.C. y CAR", "comportamental": "Competencias comportamentales (Decreto 815 de 2018)"}, "niveles": {"1": "Básico", "2": "Intermedio", "3": "Avanzado"}, "roles": {"general": "Todos los niveles", "asistencial": "Nivel asistencial", "tecnico": "Nivel técnico", "profesional": "Nivel profesional"}, "clave": "asistencial-01.html"};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY = 'sim-cnsc:' + CFG.clave;
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}
function save(){try{localStorage.setItem(KEY, JSON.stringify(ST))}catch(e){}}
let ST = load();
ST.r = ST.r || {};
$('#tit').textContent = CFG.titulo;
const ITEMS = [];
DATA.forEach(c => c.items.forEach(it => { it.caso = c; ITEMS.push(it); }));

function justHTML(it){
  return '<div class="just">' + it.o.map(o => `<div><b>${o[0]}.</b> <span class="${o[3]?'okt':'not'}">${o[3]?'Es correcta.':'Es incorrecta.'}</span> ${esc(o[2])}</div>`).join('') +
    `<div class="src">Referencia: ${esc(it.f)}</div></div>`;
}
function itemHTML(it, n, mode){
  const r = ST.r[it.id];
  const reveal = mode === 'review' || (CFG.modo === 'practica' && r);
  let h = `<div class="item" id="i-${it.id}"><p class="enun"><span class="n">${n}.</span> <span class="niv">${CFG.niveles[it.niv]}</span> ${esc(it.e)}</p>`;
  it.o.forEach(o => {
    let cls = '';
    if (reveal) { if (o[3]) cls = 'ok'; else if (r === o[0]) cls = 'no'; }
    else if (r === o[0]) cls = 'sel';
    h += `<button class="op ${cls}" data-id="${it.id}" data-l="${o[0]}" ${reveal?'disabled':''}><span class="l">${o[0]}.</span><span>${esc(o[1])}</span></button>`;
  });
  if (reveal) {
    if (mode === 'review') h += `<div class="${r===keyOf(it)?'res-ok':'res-no'}" style="font-size:14px;margin-top:4px">${r ? (r===keyOf(it)?'Respondiste ' + r + ': correcto.':'Respondiste ' + r + '. La respuesta correcta es ' + keyOf(it) + '.') : 'Sin responder. La respuesta correcta es ' + keyOf(it) + '.'}</div>`;
    h += justHTML(it);
  }
  return h + '</div>';
}
const keyOf = it => it.o.find(o => o[3])[0];

function renderList(list, mode){
  let h = '', last = null, n = 0;
  list.forEach(it => {
    n++;
    if (it.caso !== last) { last = it.caso; h += `<div class="caso"><div class="tag">${esc(it.caso.tag)}</div><p>${esc(it.caso.texto)}</p></div>`; }
    h += itemHTML(it, n, mode);
  });
  return h;
}

// ---------- PRÁCTICA ----------
let LIST = [];
let FILTRO = ST.f || {comp:'', niv:'', rol:''};
function practica(){
  const comps = Object.entries(CFG.componentes).map(([k,v]) => `<option value="${k}" ${FILTRO.comp===k?'selected':''}>${esc(v)}</option>`).join('');
  const nivs = Object.entries(CFG.niveles).map(([k,v]) => `<option value="${k}" ${FILTRO.niv===k?'selected':''}>${esc(v)}</option>`).join('');
  const list = ITEMS.filter(it => (!FILTRO.comp || it.caso.comp===FILTRO.comp) && (!FILTRO.niv || String(it.niv)===FILTRO.niv) && (!FILTRO.rol || it.caso.rol===FILTRO.rol || it.caso.rol==='general'));
  const resp = list.filter(it => ST.r[it.id]); const ok = resp.filter(it => ST.r[it.id]===keyOf(it));
  $('#main').innerHTML = `<div class="panel"><p style="margin-top:0">Elige un tema, tu nivel de empleo y la dificultad. Al responder verás de inmediato si acertaste y la explicación de cada opción.</p>
  <div class="row"><select id="fc"><option value="">Todos los temas</option>${comps}</select>
  <select id="fn"><option value="">Todas las dificultades</option>${nivs}</select>
  <select id="fr"><option value="">Todos los niveles de empleo</option>${['asistencial','tecnico','profesional'].map(k => `<option value="${k}" ${FILTRO.rol===k?'selected':''}>${esc(CFG.roles[k])} (y temas comunes)</option>`).join('')}</select>
  <button class="btn sec" id="borrar">Borrar mis respuestas</button></div>
  <p class="stat" id="pst" style="margin-bottom:0">${list.length} preguntas · respondidas ${resp.length} · aciertos ${ok.length}${resp.length? ' (' + Math.round(100*ok.length/resp.length) + ' %)':''}</p></div>` + renderList(list, 'practica');
  $('#prog').textContent = `${ok.length}/${resp.length} aciertos`;
  ['fc','fn','fr'].forEach((id,i) => $('#'+id).onchange = e => { FILTRO[['comp','niv','rol'][i]] = e.target.value; ST.f = FILTRO; save(); practica(); });
  LIST = list;
  $('#borrar').onclick = () => { list.forEach(it => delete ST.r[it.id]); save(); practica(); };
}

// ---------- SIMULACRO ----------
let tick = null;
function inicio(){
  const n = ITEMS.length, cnt = {};
  ITEMS.forEach(it => cnt[it.caso.comp] = (cnt[it.caso.comp]||0) + 1);
  const h = Math.floor(CFG.minutos/60), m = CFG.minutos%60;
  $('#main').innerHTML = `<div class="panel"><h2 style="margin-top:0;color:var(--pri)">Instrucciones</h2>
  <p>Este simulacro tiene <b>${n} preguntas</b> en el formato de Prueba de Juicio Situacional: un caso, enunciados que se completan y tres opciones con una sola respuesta correcta.</p>
  <table>${Object.entries(cnt).map(([k,v]) => `<tr><td>${esc(CFG.componentes[k])}</td><td class="r">${v}</td></tr>`).join('')}</table>
  <p>Tiempo sugerido: <b>${h ? h + ' h ' : ''}${m ? m + ' min' : ''}</b> (unos ${Math.round(CFG.minutos*60/n/6)/10} minutos por pregunta). Cuando se acaba el tiempo puedes seguir, pero el cronómetro lo indica.</p>
  <p>Tus respuestas se guardan en este navegador. Al terminar verás tu puntaje por componente y por dificultad, y la explicación de cada pregunta.</p>
  <button class="btn" id="go">${ST.t0 ? 'Continuar el simulacro' : 'Comenzar'}</button></div>`;
  $('#prog').textContent = `${n} preguntas`;
  $('#go').onclick = () => { if (!ST.t0) { ST.t0 = Date.now(); save(); } examen(); };
}
function reloj(){
  const rest = CFG.minutos*60 - Math.floor((Date.now() - ST.t0)/1000);
  const a = Math.abs(rest), hh = Math.floor(a/3600), mm = Math.floor(a%3600/60), ss = a%60;
  const t = (rest < 0 ? '+' : '') + (hh ? hh + ':' : '') + String(mm).padStart(2,'0') + ':' + String(ss).padStart(2,'0');
  $('#timer').textContent = rest < 0 ? 'Tiempo cumplido ' + t : '⏱ ' + t;
  $('#timer').classList.toggle('low', rest < 600);
}
function examen(){
  $('#main').innerHTML = renderList(ITEMS, 'examen') + `<div class="panel"><button class="btn" id="fin">Terminar y calificar</button></div>`;
  progreso(); reloj(); clearInterval(tick); tick = setInterval(reloj, 1000);
  $('#fin').onclick = () => {
    const faltan = ITEMS.length - Object.keys(ST.r).filter(k => ITEMS.some(i => i.id===k)).length;
    $('#mtxt').textContent = faltan ? `Te faltan ${faltan} preguntas por responder. ¿Quieres calificar de todos modos?` : '¿Quieres terminar y ver tu calificación?';
    $('#modal').classList.remove('hide');
  };
}
function progreso(){
  const r = ITEMS.filter(it => ST.r[it.id]).length;
  $('#prog').textContent = `Respondidas ${r}/${ITEMS.length}`;
}
$('#mno').onclick = () => $('#modal').classList.add('hide');
$('#msi').onclick = () => { $('#modal').classList.add('hide'); ST.fin = Date.now(); save(); resultados(); };
function resultados(){
  clearInterval(tick);
  const ok = ITEMS.filter(it => ST.r[it.id] === keyOf(it)).length;
  const pct = Math.round(1000*ok/ITEMS.length)/10;
  const g = (fn, lab) => { const m = {}; ITEMS.forEach(it => { const k = fn(it); m[k] = m[k] || [0,0]; m[k][1]++; if (ST.r[it.id]===keyOf(it)) m[k][0]++; });
    return Object.entries(m).map(([k,v]) => `<tr><td>${esc(lab(k))}</td><td class="r">${v[0]}/${v[1]}</td><td class="r">${Math.round(100*v[0]/v[1])} %</td></tr>`).join(''); };
  const mins = Math.round(((ST.fin||Date.now()) - ST.t0)/60000);
  $('#timer').textContent = `Tiempo usado: ${Math.floor(mins/60) ? Math.floor(mins/60) + ' h ' : ''}${mins%60} min`;
  $('#prog').textContent = `${ok}/${ITEMS.length} aciertos`;
  $('#main').innerHTML = `<div class="panel"><div class="big">${String(pct).replace('.',',')} %</div>
  <p style="margin-top:4px">${ok} de ${ITEMS.length} respuestas correctas. ${pct >= 75 ? 'Muy buen resultado: repasa las explicaciones de tus errores para afianzarlo.' : pct >= 65 ? 'Vas bien, pero con poco margen: refuerza los componentes con menor porcentaje.' : 'Todavía no estás en zona segura: practica por tema los componentes con menor porcentaje.'}</p>
  <p class="aviso">Referencia: en los procesos Distrito Capital 7, Territorial 14 y CAR, la prueba de competencias funcionales es eliminatoria con mínimo de 65 puntos, y la comportamental es clasificatoria. Este porcentaje de aciertos es una guía de preparación; la CNSC calcula su puntaje con su propia escala, comparando con los demás aspirantes al mismo empleo.</p>
  <h3>Por componente</h3><table>${g(it => it.caso.comp, k => CFG.componentes[k])}</table>
  <h3>Por dificultad</h3><table>${g(it => it.niv, k => CFG.niveles[k])}</table>
  <div class="row" style="margin-top:14px"><button class="btn" id="solo">Ver solo mis errores</button><button class="btn sec" id="todas">Ver todas</button><button class="btn sec" id="otra">Reiniciar el simulacro</button></div></div><div id="rev"></div>`;
  const rev = errs => { const l = errs ? ITEMS.filter(it => ST.r[it.id] !== keyOf(it)) : ITEMS; $('#rev').innerHTML = renderList(l, 'review'); };
  rev(true);
  $('#solo').onclick = () => rev(true); $('#todas').onclick = () => rev(false);
  $('#otra').onclick = () => { ST = {r:{}}; save(); inicio(); window.scrollTo(0,0); };
}

document.addEventListener('click', e => {
  const b = e.target.closest('button.op'); if (!b || b.disabled) return;
  ST.r[b.dataset.id] = b.dataset.l; save();
  const it = ITEMS.find(i => i.id === b.dataset.id);
  const n = b.closest('.item').querySelector('.n').textContent.replace('.','');
  b.closest('.item').outerHTML = itemHTML(it, n, CFG.modo === 'practica' ? 'practica' : 'examen');
  if (CFG.modo === 'practica') { const resp = LIST.filter(i => ST.r[i.id]); const ok = resp.filter(i => ST.r[i.id]===keyOf(i)).length; $('#prog').textContent = `${ok}/${resp.length} aciertos`; $('#pst').textContent = `${LIST.length} preguntas · respondidas ${resp.length} · aciertos ${ok} (${Math.round(100*ok/resp.length)} %)`; }
  else progreso();
});

if (CFG.modo === 'practica') practica();
else if (ST.fin) resultados();
else if (ST.t0) examen();
else inicio();
</script>
</body>
</html>
