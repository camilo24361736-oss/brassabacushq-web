<!doctype html>
<html lang="es">
<head>

<title>Simulacro 1 · Nivel asistencial · CNSC Empleo Público</title>
<style>
:root{--bg:#f6f8fb;--card:#fff;--ink:#1d2433;--mute:#5a6478;--line:#dbe1ea;--pri:#0b3d6e;--pri2:#1660a8;--ok:#0d6b3a;--okbg:#e6f4ec;--no:#9b1c1c;--nobg:#fbeaea;--sel:#e8f0fa}
@media (prefers-color-scheme: dark){:root{--bg:#10151d;--card:#18202b;--ink:#e6ebf2;--mute:#9aa6b8;--line:#2a3545;--pri:#7fb3ea;--pri2:#9cc6f2;--ok:#7fd3a3;--okbg:#16301f;--no:#f2a3a3;--nobg:#3a1c1c;--sel:#1e2d40}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px}
.hwrap{max-width:860px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
h1{font-size:17px;margin:0;color:var(--pri)}
.stat{font-size:14px;color:var(--mute)}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--pri)}
.timer.low{color:var(--no)}
main{max-width:860px;margin:0 auto;padding:16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin:0 0 16px}
.caso{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--pri);border-radius:10px;padding:14px 16px;margin:22px 0 10px}
.tag{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--pri);font-weight:700}
.caso p{margin:6px 0 0;white-space:pre-line}
.item{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0}
.enun{margin:0 0 8px}
.n{font-weight:700;color:var(--pri)}
.niv{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-right:4px;white-space:nowrap}
.op{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:6px 0;cursor:pointer;background:transparent;width:100%;text-align:left;color:inherit;font:inherit}
.op:hover{border-color:var(--pri2)}
.op .l{font-weight:700;min-width:20px}
.op.sel{background:var(--sel);border-color:var(--pri2)}
.op.ok{background:var(--okbg);border-color:var(--ok)}
.op.no{background:var(--nobg);border-color:var(--no)}
.op[disabled]{cursor:default}
.just{font-size:14px;margin:8px 0 0;padding:8px 10px;border-top:1px dashed var(--line)}
.just div{margin:4px 0}
.just .okt{color:var(--ok);font-weight:700}
.just .not{color:var(--no);font-weight:700}
.src{font-size:13px;color:var(--mute);margin-top:6px}
button.btn{background:var(--pri);color:var(--card);border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer}
button.btn.sec{background:transparent;color:var(--pri);border:1px solid var(--pri)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
select{font:inherit;padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);max-width:100%}
table{border-collapse:collapse;width:100%;font-size:15px}
td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
.big{font-size:40px;font-weight:800;color:var(--pri);line-height:1.1}
.aviso{font-size:13px;color:var(--mute)}
.hide{display:none !important}
.res-ok{color:var(--ok);font-weight:700}.res-no{color:var(--no);font-weight:700}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal .panel{max-width:420px}
footer{max-width:860px;margin:0 auto;padding:8px 16px 40px;font-size:12px;color:var(--mute)}
</style>
</head>
<body>
<header><div class="hwrap"><h1 id="tit"></h1><div class="row stat"><span id="prog"></span><span id="timer" class="timer"></span></div></div></header>
<main id="main"></main>
<div id="modal" class="modal hide"><div class="panel"><p id="mtxt"></p><div class="row"><button class="btn" id="msi">Sí, calificar</button><button class="btn sec" id="mno">Seguir respondiendo</button></div></div></div>
<footer><a href="./" style="color:var(--pri);font-weight:600">← Volver al menú</a><br><br>Material de preparación independiente. No está afiliado a la Comisión Nacional del Servicio Civil (CNSC) ni a ninguna entidad pública, y no contiene preguntas reales de la prueba.</footer>
<script>
const DATA = [{"comp": "estado_constitucion", "rol": "general", "tag": "Estado y Constitución · Principios fundamentales y Estado social de derecho", "texto": "Usted es técnico administrativo de la Secretaría de Gobierno de un municipio de sexta categoría. En una reunión de equipo, el coordinador afirma que «si no hacemos nada, nadie nos puede sancionar: los servidores, igual que cualquier particular, solo responden si violan una ley expresa». En la misma reunión se revisa un decreto municipal que, para inscribirse en un programa de mercados solidarios, exige certificado de pertenencia a una iglesia. Además, un concejal pide explicar a la comunidad por qué el municipio puede diseñar sus propios programas sociales sin que cada uno sea aprobado por la Nación.", "items": [{"id": "EC-101", "niv": 1, "e": "Frente a la afirmación del coordinador sobre la responsabilidad de los servidores públicos, lo correcto es aclarar que estos responden", "f": "Constitución Política, art. 6", "o": [["A", "únicamente cuando su omisión cause un daño patrimonial cuantificado por la contraloría.", "El daño patrimonial es un elemento de la responsabilidad fiscal, no un requisito general de la responsabilidad de los servidores. El artículo 6 hace responsables a los servidores por la sola omisión en el ejercicio de sus funciones.", false], ["B", "en los mismos términos que los particulares, porque la Constitución consagra la igualdad de todos ante la ley y no distingue entre ellos.", "Confunde la igualdad del artículo 13 con el régimen de responsabilidad. El artículo 6 establece expresamente un régimen más exigente para los servidores, que incluye la omisión y la extralimitación.", false], ["C", "por infringir la Constitución y las leyes, y también por omisión o extralimitación en el ejercicio de sus funciones.", "El artículo 6 de la Constitución distingue: los particulares responden solo por infringir la Constitución y las leyes, mientras que los servidores públicos responden por esa misma causa y, además, por omitir sus funciones o excederse en ellas. La inacción también genera responsabilidad.", true]]}, {"id": "EC-102", "niv": 1, "e": "Sobre la incompatibilidad entre el decreto municipal que exige pertenecer a una iglesia y la Constitución, la regla constitucional aplicable indica que", "f": "Constitución Política, arts. 4 y 13", "o": [["A", "deben aplicarse las disposiciones constitucionales, por ser la Constitución norma de normas.", "El artículo 4 de la Constitución establece que la Constitución es norma de normas y que, ante cualquier incompatibilidad con la ley u otra norma jurídica, se aplican las disposiciones constitucionales. Exigir pertenecer a una iglesia discrimina por religión (art. 13).", true], ["B", "prevalece el decreto, por ser una norma especial y posterior expedida por la autoridad local competente.", "Los criterios de especialidad y posterioridad resuelven conflictos entre normas del mismo nivel. Frente a la Constitución no operan: el artículo 4 dispone que en caso de incompatibilidad se aplican las disposiciones constitucionales.", false], ["C", "el decreto debe aplicarse hasta que el concejo municipal lo derogue mediante acuerdo.", "El concejo no deroga los decretos del alcalde como mecanismo para resolver su incompatibilidad con la Constitución. La regla del artículo 4 es la prevalencia directa de la Constitución sobre cualquier norma incompatible.", false]]}, {"id": "EC-103", "niv": 2, "e": "Para responder al concejal, el fundamento constitucional que permite al municipio diseñar sus propios programas es que Colombia está organizada como", "f": "Constitución Política, art. 1", "o": [["A", "un Estado federal, en el que cada municipio ejerce soberanía propia sobre los asuntos sociales.", "Colombia no es un Estado federal. El artículo 1 la define como república unitaria; los municipios tienen autonomía, pero no soberanía, que reside exclusivamente en el pueblo (art. 3).", false], ["B", "una república unitaria y descentralizada, con autonomía de sus entidades territoriales.", "El artículo 1 de la Constitución define a Colombia como Estado social de derecho organizado en forma de república unitaria, descentralizada y con autonomía de sus entidades territoriales. Esa autonomía permite al municipio gestionar sus propios programas dentro de la Constitución y la ley.", true], ["C", "una república centralizada, en la que la Nación define y aprueba todos los programas sociales locales.", "El artículo 1 describe a Colombia como república descentralizada y con autonomía de sus entidades territoriales, lo que contradice que la Nación deba aprobar cada programa local.", false]]}]}, {"comp": "estado_constitucion", "rol": "general", "tag": "Estado y Constitución · Habeas corpus", "texto": "Usted es auxiliar administrativo de la Secretaría de Gobierno de un municipio de quinta categoría. Un domingo en la noche llega la madre de un joven que fue retenido el viernes en una estación de policía. Según ella, nadie le ha explicado el motivo, no ha sido puesto a disposición de ningún juez y no tiene abogado. La señora pregunta si puede presentar una tutela, cuánto se tardará la decisión y ante quién debe acudir, pues no sabe redactar escritos ni tiene recursos para un apoderado.", "items": [{"id": "EC-122", "niv": 1, "e": "Para proteger la libertad del joven, el mecanismo que debe indicarse a la madre es", "f": "Ley 1095 de 2006, art. 1; Decreto 2591 de 1991, art. 6, num. 2", "o": [["A", "la acción de tutela, porque la libertad personal es un derecho fundamental.", "Aunque la libertad es fundamental, el numeral 2 del artículo 6 del Decreto 2591 dispone que la tutela no procede cuando el derecho puede protegerse con el habeas corpus.", false], ["B", "el habeas corpus, que protege la libertad de quien es privado de ella con violación de sus garantías.", "El artículo 1 de la Ley 1095 de 2006 define el habeas corpus como derecho fundamental y acción constitucional que tutela la libertad personal en esos eventos, y no se suspende ni siquiera en estados de excepción.", true], ["C", "una queja ante la personería municipal, que como agente del Ministerio Público puede ordenar la libertad inmediata del joven.", "La personería puede vigilar la actuación policial, pero no ordena libertades. Solo la autoridad judicial que conoce del habeas corpus puede ordenar la liberación.", false]]}, {"id": "EC-123", "niv": 2, "e": "Sobre el término para decidir, debe informarse a la madre que la solicitud se resuelve en", "f": "Ley 1095 de 2006, art. 3", "o": [["A", "un término de treinta y seis horas.", "El artículo 3 de la Ley 1095 de 2006 garantiza invocar el habeas corpus ante cualquier autoridad judicial para que sea resuelto en un término de treinta y seis horas, sin que se suspenda por festivos o vacancia judicial.", true], ["B", "un término de cuarenta y ocho horas.", "Cuarenta y ocho horas es el plazo máximo de cumplimiento de un fallo de tutela (Decreto 2591, art. 29). El habeas corpus se resuelve en treinta y seis horas.", false], ["C", "un término de diez días.", "Diez días es el término para fallar una tutela. El habeas corpus, por proteger la libertad, tiene un término mucho más corto: treinta y seis horas.", false]]}, {"id": "EC-124", "niv": 2, "e": "Respecto de ante quién y cómo presentar la solicitud, lo correcto es orientarla a que", "f": "Ley 1095 de 2006, arts. 2, 3 y 4", "o": [["A", "espere al lunes para presentarla con abogado ante el juez penal del circuito.", "La ley garantiza que el trámite no se suspenda por festivos (art. 3), que no se requiera apoderado (art. 4) y que cualquier juez sea competente (art. 2).", false], ["B", "la presente por escrito ante el inspector de policía, que es la autoridad administrativa competente en el municipio.", "El habeas corpus no lo resuelven autoridades administrativas. Son competentes los jueces y tribunales de la Rama Judicial (art. 2).", false], ["C", "la presente ante cualquier juez o tribunal de la Rama Judicial, aun verbalmente y sin apoderado.", "Son competentes todos los jueces y tribunales de la Rama Judicial (art. 2); la acción puede invocarse por terceros sin mandato (art. 3) y ejercerse sin formalidad, incluso verbalmente y sin apoderado (art. 4).", true]]}]}, {"comp": "estado_constitucion", "rol": "general", "tag": "Estado y Constitución · Defensoría del Pueblo", "texto": "Usted es técnico administrativo de la Secretaría de Gobierno de una gobernación de frontera que atiende población migrante. Un grupo de familias pide ayuda porque una entidad de salud les niega atención y quieren que alguien presente una tutela en su nombre. Uno de los migrantes, además, fue vinculado a un proceso penal y no tiene recursos para pagar un abogado. En una mesa técnica, un contratista afirma que el Defensor del Pueblo es elegido por el Senado, igual que el Procurador.", "items": [{"id": "EC-134", "niv": 1, "e": "Para que la tutela sea presentada en nombre de las familias que lo soliciten, usted puede orientarlas a acudir a", "f": "Decreto 2591 de 1991, art. 46; Constitución Política, art. 282, num. 3", "o": [["A", "la Defensoría del Pueblo, que puede interponer tutelas en nombre de cualquier persona que se lo solicite.", "El artículo 46 del Decreto 2591 de 1991 faculta al Defensor del Pueblo para interponer la tutela en nombre de cualquier persona que se lo solicite o que esté en situación de desamparo, y el numeral 3 del artículo 282 de la Constitución le asigna esa función.", true], ["B", "la Registraduría Nacional, porque primero deben regularizar su documento de identidad.", "La protección de derechos fundamentales no depende de la regularización migratoria ni corresponde a la Registraduría. La Defensoría puede presentar la tutela en su nombre.", false], ["C", "la Contraloría departamental, que vigila los recursos de salud del departamento.", "La contraloría ejerce control fiscal; no está facultada para interponer tutelas en nombre de las personas.", false]]}, {"id": "EC-135", "niv": 1, "e": "Para el migrante procesado penalmente que no tiene recursos, la orientación correcta es acudir a", "f": "Constitución Política, art. 282, num. 4", "o": [["A", "la personería municipal, que le asignará como defensor a uno de los abogados de su planta.", "El personero interviene en los procesos penales como agente del Ministerio Público, no como defensor del procesado. La defensoría pública la organiza y dirige el Defensor del Pueblo.", false], ["B", "la Defensoría del Pueblo, que organiza y dirige la defensoría pública.", "El numeral 4 del artículo 282 de la Constitución asigna al Defensor del Pueblo la función de organizar y dirigir la defensoría pública en los términos que señale la ley.", true], ["C", "la Fiscalía General de la Nación, que debe designarle un fiscal como defensor de oficio.", "La Fiscalía es la parte acusadora en el proceso penal; no puede asumir la defensa del procesado.", false]]}, {"id": "EC-136", "niv": 2, "e": "Frente a la afirmación del contratista sobre la elección del Defensor del Pueblo, lo correcto es aclarar que lo elige", "f": "Constitución Política, arts. 276 y 281", "o": [["A", "el Congreso en pleno, de lista de elegibles conformada por convocatoria pública.", "Esa es la forma de elección del Contralor General de la República (art. 267). El Defensor lo elige la Cámara de Representantes.", false], ["B", "el Senado de la República, de terna integrada por el Presidente, la Corte Suprema y el Consejo de Estado.", "Esa es la forma de elección del Procurador General de la Nación (art. 276), no la del Defensor del Pueblo.", false], ["C", "la Cámara de Representantes, de terna elaborada por el Presidente de la República.", "El artículo 281 de la Constitución, modificado por el Acto Legislativo 2 de 2015, dispone que el Defensor del Pueblo ejerce sus funciones de manera autónoma y es elegido por la Cámara de Representantes para un periodo de cuatro años, de terna elaborada por el Presidente de la República.", true]]}]}, {"comp": "estado_constitucion", "rol": "general", "tag": "Estado y Constitución · Delegación de funciones", "texto": "Usted es profesional universitario de la Secretaría Jurídica de un municipio de primera categoría. El alcalde quiere que el secretario de Gobierno asuma la función de otorgar los permisos para la realización de espectáculos públicos en el municipio, que hoy firma el propio alcalde, y le pide preparar el acto correspondiente. El secretario de Gobierno, por su parte, ya anunció que, una vez reciba la función, la trasladará a un profesional universitario de su despacho para agilizar los trámites. Un asesor sostiene que, si algo sale mal, el alcalde seguirá respondiendo por todo.", "items": [{"id": "EC-149", "niv": 1, "e": "Para que el secretario de Gobierno asuma válidamente la función, el acto de delegación debe", "f": "Ley 489 de 1998, art. 10", "o": [["A", "constar por escrito y determinar la autoridad delegataria y las funciones o asuntos específicos que se transfieren.", "El artículo 10 de la Ley 489 de 1998 dispone que el acto de delegación siempre será escrito y en él se determinarán la autoridad delegataria y las funciones o asuntos específicos cuya atención y decisión se transfieren.", true], ["B", "ser aprobado previamente por el concejo municipal mediante acuerdo.", "La delegación es un acto de la autoridad delegante. La Ley 489 no exige un acuerdo del concejo para que el alcalde delegue funciones en sus colaboradores.", false], ["C", "comunicarse verbalmente en consejo de gobierno, dejando constancia en el acta de la reunión firmada por los asistentes.", "La delegación no puede ser verbal: el artículo 10 de la Ley 489 exige que el acto sea siempre escrito e identifique al delegatario y las funciones.", false]]}, {"id": "EC-150", "niv": 3, "e": "Frente a la afirmación del asesor sobre la responsabilidad, lo correcto es explicar que la delegación", "f": "Constitución Política, art. 211; Ley 489 de 1998, arts. 10 y 12; Corte Constitucional, Sentencia C-372 de 2002", "o": [["A", "traslada la responsabilidad al delegatario de forma definitiva, sin que el alcalde pueda volver a ejercer la función ni revisar los actos expedidos.", "La delegación no es definitiva: el artículo 12 de la Ley 489 permite a la autoridad delegante reasumir en cualquier tiempo la competencia y revisar los actos del delegatario.", false], ["B", "en principio exime al alcalde, que conserva deberes de dirección y vigilancia y puede reformar o revocar los actos del delegatario.", "El artículo 211 de la Constitución dispone que la delegación exime de responsabilidad al delegante, la cual corresponde al delegatario, cuyos actos puede siempre reformar o revocar aquel, reasumiendo la responsabilidad. La Corte Constitucional (C-372 de 2002) precisó que el delegante no responde por los actos del delegatario, pero sí por sus propios deberes de dirección, orientación, instrucción y seguimiento; el artículo 10 de la Ley 489 le exige informarse del desarrollo de la delegación y el artículo 12 le permite reasumir la competencia.", true], ["C", "no cambia nada, porque el alcalde sigue respondiendo por todos los actos del secretario delegatario.", "El artículo 211 de la Constitución dispone lo contrario: la delegación exime de responsabilidad al delegante y la traslada al delegatario, sin perjuicio de que el delegante responda por sus propios deberes de orientación y seguimiento.", false]]}, {"id": "EC-151", "niv": 3, "e": "Sobre la intención del secretario de trasladar la función recibida a un profesional de su despacho, usted debe conceptuar que", "f": "Ley 489 de 1998, art. 11, num. 2", "o": [["A", "es posible siempre que lo haga mediante acto escrito y lo informe oportunamente al alcalde.", "Cumplir la forma escrita e informar al alcalde no subsana la prohibición: las funciones recibidas en virtud de delegación no son delegables (art. 11, num. 2).", false], ["B", "es posible si el profesional pertenece al nivel directivo o asesor del municipio.", "El nivel del empleado es una condición para ciertas delegaciones, pero aquí el obstáculo es otro: la función ya fue recibida por delegación y no puede volver a delegarse.", false], ["C", "no es posible, porque las funciones recibidas por delegación no pueden transferirse nuevamente.", "El numeral 2 del artículo 11 de la Ley 489 de 1998 prohíbe transferir mediante delegación las funciones, atribuciones y potestades recibidas en virtud de delegación.", true]]}]}, {"comp": "estado_constitucion", "rol": "general", "tag": "Estado y Constitución · Veedurías ciudadanas", "texto": "Usted es técnico administrativo de la Secretaría de Infraestructura de un municipio de cuarta categoría, donde se ejecuta la ampliación del acueducto veredal. Un grupo de habitantes decide constituir una veeduría y pregunta dónde inscribirla. Entre los interesados en ser veedores está el propietario de la ferretería que provee los tubos al contratista. Semanas después, los veedores llegan a la obra y exigen que se detenga de inmediato porque, según ellos, el material no cumple las especificaciones.", "items": [{"id": "EC-161", "niv": 1, "e": "Para formalizar la veeduría, los ciudadanos deben inscribir el documento o acta de constitución ante", "f": "Ley 850 de 2003, art. 3", "o": [["A", "la secretaría de infraestructura que ejecuta la obra vigilada.", "Inscribir la veeduría ante la entidad vigilada afectaría su autonomía. La ley prevé el registro ante personerías o cámaras de comercio.", false], ["B", "la Registraduría Nacional del Estado Civil, en su sede municipal.", "La Registraduría no lleva el registro de veedurías ciudadanas; esa función la asigna la Ley 850 a las personerías y a las cámaras de comercio.", false], ["C", "la personería municipal o la cámara de comercio, que llevan su registro público.", "El artículo 3 de la Ley 850 de 2003 dispone que la inscripción del documento de constitución se realiza ante las personerías municipales o distritales o ante las cámaras de comercio, que llevan el registro público de las veedurías.", true]]}, {"id": "EC-162", "niv": 2, "e": "Sobre el propietario de la ferretería que provee los tubos, usted debe advertir que", "f": "Ley 850 de 2003, art. 19, lit. a", "o": [["A", "está impedido para ser veedor, porque es proveedor de la obra objeto de vigilancia.", "El literal a del artículo 19 de la Ley 850 de 2003 establece el impedimento para ser veedor cuando se es contratista, interventor, proveedor o trabajador de la obra, contrato o programa vigilado, o se tiene interés patrimonial en su ejecución.", true], ["B", "puede ser veedor, pero no podrá votar las decisiones relacionadas con los materiales.", "La ley no prevé una participación parcial: el impedimento le impide ser veedor de esa obra.", false], ["C", "puede ser veedor, siempre que declare por escrito su relación comercial con el contratista.", "Declarar el interés no lo elimina. La Ley 850 establece un impedimento para quienes sean proveedores de la obra vigilada.", false]]}, {"id": "EC-163", "niv": 3, "e": "Frente a la exigencia de los veedores de detener la obra, la respuesta adecuada es explicarles que", "f": "Ley 850 de 2003, arts. 16, 17 y 20", "o": [["A", "no se les dará ninguna información técnica hasta que termine la obra, para no interferir en la ejecución.", "Negar la información desconoce el derecho de las veedurías a obtenerla de los supervisores, contratistas y entidades, información que es de obligatoria respuesta (art. 17).", false], ["B", "la veeduría no puede suspender la obra por sí misma, pero sí pedir información, de obligatoria respuesta, y denunciar.", "El artículo 20 de la Ley 850 prohíbe a las veedurías retrasar, impedir o suspender los programas o contratos sin el concurso de la autoridad competente; el artículo 17 hace obligatoria la respuesta a la información que soliciten, y el artículo 16 les permite denunciar.", true], ["C", "la obra debe suspenderse de inmediato, porque la veeduría tiene la facultad de ordenarlo cuando detecta irregularidades.", "La Ley 850 no otorga a las veedurías facultad de suspender contratos; se lo prohíbe sin el concurso de autoridad competente (art. 20).", false]]}]}, {"comp": "estado_constitucion", "rol": "general", "tag": "Estado y Constitución · Estado social de derecho y espacio público", "texto": "Usted es profesional universitario de la Secretaría de Gobierno de un municipio de segunda categoría que prepara un plan para recuperar el espacio público del centro, ocupado por cerca de 200 vendedores informales. En la mesa de trabajo, un asesor propone desalojar a todos sin más consideraciones «porque el interés general prevalece siempre»; un líder de los vendedores responde que el derecho al trabajo impide cualquier recuperación. Un ciudadano anuncia que acudirá al juez si la alcaldía no actúa. Entre los vendedores hay un hombre con discapacidad física cuya única fuente de ingresos es su puesto.", "items": [{"id": "EC-173", "niv": 2, "e": "Frente a las posiciones del asesor y del líder de los vendedores, el plan debe partir de que el Estado social de derecho", "f": "Constitución Política, arts. 1 y 2", "o": [["A", "impide recuperar el espacio público mientras exista una sola persona que derive su sustento de él.", "El derecho al trabajo no es absoluto ni impide a la administración proteger el espacio público. Se trata de armonizar ambos fundamentos, no de suprimir uno.", false], ["B", "se funda en la prevalencia del interés general como único fundamento, por lo que procede el desalojo sin más consideraciones.", "La prevalencia del interés general es uno de los fundamentos del Estado social de derecho, pero no el único: el artículo 1 también lo funda en la dignidad humana, el trabajo y la solidaridad.", false], ["C", "exige armonizar la prevalencia del interés general con la dignidad humana y el trabajo, que también son sus fundamentos.", "El artículo 1 de la Constitución funda el Estado social de derecho en el respeto de la dignidad humana, en el trabajo, en la solidaridad y en la prevalencia del interés general, y el artículo 2 ordena a las autoridades proteger a todas las personas. El plan debe conciliar estos fundamentos.", true]]}, {"id": "EC-174", "niv": 2, "e": "Si la alcaldía no actúa, el ciudadano que pretende la protección del espacio público puede acudir a", "f": "Constitución Política, art. 88; Ley 472 de 1998, arts. 2 y 9", "o": [["A", "la acción popular, porque el espacio público es un derecho colectivo.", "El artículo 88 de la Constitución incluye el espacio público entre los derechos e intereses colectivos protegidos por las acciones populares, que proceden contra las acciones u omisiones de las autoridades que los amenacen o vulneren (Ley 472, arts. 2 y 9).", true], ["B", "la acción de grupo, porque los afectados por la ocupación del centro son más de veinte personas.", "La acción de grupo busca indemnizar perjuicios individuales. El ciudadano pretende que se proteja el espacio público, finalidad de la acción popular.", false], ["C", "la acción de tutela, porque el espacio público es un derecho fundamental de cada ciudadano.", "El espacio público es un derecho colectivo; la tutela no procede para proteger derechos colectivos (Decreto 2591, art. 6, num. 3), salvo para evitar un perjuicio irremediable a un derecho fundamental propio.", false]]}, {"id": "EC-175", "niv": 3, "e": "Frente al vendedor con discapacidad física y sin otra fuente de ingresos, la Constitución impone a la alcaldía", "f": "Constitución Política, art. 13, inc. 3", "o": [["A", "darle el mismo trato que a los demás vendedores, porque cualquier diferencia sería un trato discriminatorio.", "La igualdad no exige trato idéntico en todos los casos. El inciso 3 del artículo 13 ordena una protección especial a quienes están en circunstancia de debilidad manifiesta.", false], ["B", "brindarle protección especial por su debilidad manifiesta, sin que ello impida recuperar el espacio público.", "El inciso 3 del artículo 13 de la Constitución ordena al Estado proteger especialmente a quienes por su condición económica, física o mental se encuentren en circunstancia de debilidad manifiesta. Esa protección se materializa en medidas diferenciadas dentro del plan, no en la renuncia a proteger el espacio público.", true], ["C", "otorgarle un permiso indefinido para permanecer en el espacio público, por ser sujeto de especial protección.", "La protección especial no convierte el espacio público en un bien apropiable de forma indefinida; exige medidas que atiendan su situación, compatibles con el interés colectivo.", false]]}]}, {"comp": "estado_constitucion", "rol": "general", "tag": "Estado y Constitución · Rendición de cuentas: concejo y audiencias", "texto": "Usted es técnico administrativo de la oficina de planeación de un municipio de quinta categoría. El alcalde presentó al concejo su informe anual de rendición de cuentas, y la mesa directiva pregunta de cuánto tiempo dispone para evaluarlo. Además, el jefe de planeación reconoce que la alcaldía no ha desarrollado espacios de diálogo con la ciudadanía y pregunta qué obligación tiene en ese caso. En la reunión, un concejal pide definir qué se entiende por rendición de cuentas.", "items": [{"id": "EC-191", "niv": 2, "e": "Para evaluar, dictaminar y responder el informe anual de rendición de cuentas del alcalde, el concejo dispone de", "f": "Ley 1757 de 2015, art. 57, parágrafo", "o": [["A", "quince días hábiles.", "No corresponde al término legal. El parágrafo del artículo 57 de la Ley 1757 fija un mes.", false], ["B", "un mes.", "El parágrafo del artículo 57 de la Ley 1757 de 2015 dispone que los concejos municipales y distritales, las asambleas y las juntas administradoras locales tienen un mes de plazo para evaluar, dictaminar y responder los informes anuales de rendición de cuentas de alcaldes y gobernadores.", true], ["C", "tres meses.", "Tres meses es el plazo en el que los presidentes de las corporaciones elaboran su propio informe de rendición de cuentas (art. 59), no el término para evaluar el informe del alcalde.", false]]}, {"id": "EC-192", "niv": 1, "e": "Si la alcaldía no adelanta espacios de diálogo para la rendición de cuentas, está obligada a realizar audiencias públicas participativas como mínimo", "f": "Ley 1757 de 2015, art. 53", "o": [["A", "una vez al año.", "La ley exige una periodicidad mayor cuando la entidad no adelanta espacios de diálogo: mínimo dos veces al año.", false], ["B", "dos veces al año.", "El artículo 53 de la Ley 1757 de 2015 dispone que, si una entidad no adelanta espacios de diálogo para la rendición de cuentas, estará obligada a realizar audiencias públicas participativas mínimo dos veces al año.", true], ["C", "cuatro veces al año.", "La ley no exige una audiencia trimestral; el mínimo es de dos audiencias al año.", false]]}, {"id": "EC-193", "niv": 1, "e": "Al concejal debe explicarse que la rendición de cuentas es", "f": "Ley 1757 de 2015, art. 48", "o": [["A", "una auditoría que realiza la contraloría sobre los resultados de la gestión de la alcaldía.", "La auditoría es un instrumento del control fiscal. La rendición de cuentas es un proceso de la propia administración ante la ciudadanía.", false], ["B", "un informe escrito que el alcalde entrega una vez al año al concejo municipal, sin participación directa de la ciudadanía.", "La rendición de cuentas no se reduce al informe ante el concejo; la ley la define como un proceso dirigido a ciudadanos, sociedad civil, entidades y órganos de control, a partir del diálogo.", false], ["C", "un proceso en el que las entidades informan y explican su gestión a partir del diálogo, como expresión de control social.", "El artículo 48 de la Ley 1757 de 2015 define la rendición de cuentas como el proceso mediante el cual las entidades y servidores informan, explican y dan a conocer los resultados de su gestión a la ciudadanía y otros actores, a partir de la promoción del diálogo, y la califica como expresión de control social.", true]]}]}, {"comp": "empleo_publico", "rol": "general", "tag": "Empleo público, carrera y régimen disciplinario · Concurso de méritos y lista de elegibles", "texto": "Una alcaldía distrital participa en un proceso de selección de la Comisión Nacional del Servicio Civil. Usted, técnico administrativo de la Dirección de Talento Humano, recibe tres consultas: un aspirante pide que se le admitan documentos de experiencia que no cargó en la plataforma dentro de la fecha fijada en la convocatoria, porque «la alcaldía puede flexibilizar las reglas»; el jefe de la dependencia pregunta cuánto tiempo podrá usarse la lista de elegibles una vez quede en firme; y la secretaria general pregunta si con esa lista se puede cubrir una vacante definitiva de un empleo equivalente que no fue convocado y que surgió tres meses después de la convocatoria en la misma alcaldía.", "items": [{"id": "EP-110", "niv": 1, "e": "Frente a la solicitud del aspirante, usted le responde que", "f": "Ley 909 de 2004, art. 31, num. 1", "o": [["A", "la convocatoria es la norma reguladora del concurso y obliga por igual a la administración, a la entidad que lo ejecuta y a los participantes.", "El art. 31, num. 1, de la Ley 909 de 2004 define la convocatoria como norma reguladora de todo concurso, que obliga a la administración, a las entidades contratadas para realizarlo y a los participantes; por eso no es posible aceptar documentos por fuera de las fechas fijadas.", true], ["B", "puede radicar los documentos como derecho de petición para que se valoren en la etapa de pruebas escritas.", "El derecho de petición no sirve para modificar las reglas del concurso ni para acreditar requisitos por fuera de los plazos de la convocatoria, que es obligatoria para todos.", false], ["C", "la alcaldía puede recibir los documentos, porque como entidad nominadora tiene la facultad de ajustar los plazos del concurso.", "La entidad no puede modificar unilateralmente las reglas: la convocatoria la obliga igual que a los aspirantes, según el art. 31, num. 1, de la Ley 909 de 2004.", false]]}, {"id": "EP-111", "niv": 1, "e": "Al jefe de la dependencia usted le informa que la lista de elegibles tendrá una vigencia de", "f": "Ley 909 de 2004, art. 31, num. 4 (modificado por el art. 6 de la Ley 1960 de 2019)", "o": [["A", "un año, contado desde su firmeza.", "Ese era un término de normas anteriores; la Ley 909 de 2004, modificada por la Ley 1960 de 2019, fija hoy una vigencia de dos años.", false], ["B", "dos años.", "El art. 31, num. 4, de la Ley 909 de 2004, modificado por el art. 6 de la Ley 1960 de 2019, establece que la lista de elegibles, elaborada en estricto orden de mérito, tendrá una vigencia de dos años.", true], ["C", "cuatro años.", "La vigencia de cuatro años corresponde a la lista para elegir a los comisionados de la CNSC (art. 9 de la Ley 909 de 2004), no a las listas de los procesos de selección de empleos de carrera.", false]]}, {"id": "EP-112", "niv": 3, "e": "A la secretaria general usted le responde que la vacante del empleo equivalente", "f": "Ley 909 de 2004, art. 31, num. 4 (modificado por el art. 6 de la Ley 1960 de 2019)", "o": [["A", "no puede cubrirse con la lista, porque esta solo sirve para los empleos expresamente ofertados en la convocatoria.", "La Ley 1960 de 2019 amplió el uso de la lista: además de las vacantes convocadas, cubre las vacantes definitivas de cargos equivalentes no convocados que surjan después de la convocatoria en la misma entidad.", false], ["B", "puede cubrirse con la lista de cualquier entidad del distrito, siempre que el empleo tenga igual denominación y grado.", "La norma limita el uso a cargos equivalentes de la misma entidad que adelantó el concurso; no autoriza usar listas de otras entidades por la sola coincidencia de denominación y grado.", false], ["C", "puede cubrirse con la lista, en estricto orden de mérito, porque es un cargo equivalente no convocado que surgió con posterioridad en la misma entidad.", "El art. 31, num. 4, de la Ley 909 de 2004, modificado por la Ley 1960 de 2019, dispone que con la lista se cubran las vacantes convocadas y las vacantes definitivas de cargos equivalentes no convocados que surjan con posterioridad a la convocatoria en la misma entidad.", true]]}]}, {"comp": "empleo_publico", "rol": "asistencial", "tag": "Empleo público, carrera y régimen disciplinario · Nivel asistencial · Nombramiento y posesión", "texto": "Usted es auxiliar administrativo de la Secretaría General de un municipio de quinta categoría y apoya los trámites de vinculación de personal. Carolina, elegida para un empleo de secretaria ejecutiva, aceptó por escrito el nombramiento el martes 3 de febrero de 2026. Carolina vive en otro departamento y pregunta si puede pedir más tiempo para posesionarse mientras organiza su traslado. Además, le pide a usted la lista de documentos que debe entregar para el acto de posesión. En febrero de 2026 no hay días festivos.", "items": [{"id": "EP-117", "niv": 3, "e": "Sin prórroga, y contando el término de diez días hábiles que da el reglamento para posesionarse, la fecha límite para que Carolina tome posesión es el", "f": "Decreto 1083 de 2015, art. 2.2.5.1.7", "o": [["A", "martes 10 de febrero de 2026.", "Corresponde a contar solo cinco días hábiles; el plazo del reglamento es de diez días hábiles siguientes a la aceptación.", false], ["B", "viernes 13 de febrero de 2026.", "Resulta de contar diez días calendario desde la aceptación; el plazo se cuenta en días hábiles, por lo que no se incluyen sábados ni domingos.", false], ["C", "martes 17 de febrero de 2026.", "El art. 2.2.5.1.7 del Decreto 1083 de 2015 da diez días hábiles siguientes a la aceptación para posesionarse. Contando desde el miércoles 4 de febrero, sin sábados ni domingos y sin festivos, el décimo día hábil es el martes 17 de febrero de 2026.", true]]}, {"id": "EP-118", "niv": 2, "e": "Frente a la solicitud de más tiempo, usted le informa a Carolina que", "f": "Decreto 1083 de 2015, art. 2.2.5.1.7", "o": [["A", "puede pedir por escrito una prórroga de hasta noventa días hábiles, porque no reside en el lugar donde se ubica el empleo.", "El art. 2.2.5.1.7 del Decreto 1083 de 2015 permite prorrogar por escrito el término de posesión hasta por noventa días hábiles más si el designado no reside en el lugar del empleo o por causa justificada a juicio del nominador.", true], ["B", "no es posible ampliar el plazo y, si no se posesiona en diez días, deberá participar de nuevo en el concurso.", "El reglamento sí prevé la prórroga del término de posesión en las circunstancias de Carolina; negar esa posibilidad desconoce el art. 2.2.5.1.7 del Decreto 1083 de 2015.", false], ["C", "puede posesionarse en cualquier momento mientras la lista de elegibles esté vigente, sin necesidad de solicitarlo.", "La posesión tiene un plazo reglamentario; la vigencia de la lista no reemplaza ese término ni exime de pedir la prórroga por escrito.", false]]}, {"id": "EP-119", "niv": 1, "e": "Entre los documentos que Carolina debe presentar como requisito para la posesión se encuentra", "f": "Ley 190 de 1995, art. 13", "o": [["A", "la declaración juramentada de bienes y rentas.", "El art. 13 de la Ley 190 de 1995 exige como requisito para la posesión y el desempeño del cargo la declaración bajo juramento del nombrado sobre sus bienes y rentas, que se actualiza cada año y al retiro.", true], ["B", "la constancia de afiliación a un sindicato de servidores públicos de la entidad.", "La afiliación sindical es un derecho voluntario de asociación; exigirla como requisito de posesión sería contrario a la libertad sindical.", false], ["C", "el certificado de la evaluación del desempeño de su último empleo público.", "La evaluación del desempeño no es un requisito general de posesión; se exige, por ejemplo, para encargos o comisiones, no para tomar posesión de un empleo.", false]]}]}, {"comp": "empleo_publico", "rol": "general", "tag": "Empleo público, carrera y régimen disciplinario · Permisos", "texto": "En la Secretaría de Desarrollo Económico de una gobernación, tres servidores hacen solicitudes a la oficina de talento humano, donde usted trabaja: un técnico pide permiso remunerado para asistir a la diligencia de entrega de un inmueble que compró; una profesional, empleada de carrera, fue invitada por una universidad pública a dictar una cátedra de cuatro horas semanales en horario laboral y pregunta si puede hacerlo; y la misma profesional pregunta si puede recibir los honorarios de esa cátedra además de su salario.", "items": [{"id": "EP-141", "niv": 1, "e": "Sobre la solicitud del técnico, usted le informa que el permiso remunerado", "f": "Decreto 1083 de 2015, art. 2.2.5.5.17", "o": [["A", "puede concederse hasta por cinco días hábiles y lo autoriza el jefe inmediato.", "El término máximo del permiso remunerado es de tres días hábiles, y la facultad de autorizarlo corresponde al nominador o a su delegado.", false], ["B", "puede concederse hasta por tres días hábiles cuando medie justa causa, y lo autoriza o niega el nominador o su delegado.", "El art. 2.2.5.5.17 del Decreto 1083 de 2015 permite solicitar por escrito permiso remunerado hasta por tres días hábiles cuando medie justa causa, y atribuye al nominador o a su delegado la facultad de autorizarlo o negarlo.", true], ["C", "solo procede por calamidad doméstica comprobada; para trámites personales debe pedir licencia ordinaria.", "La norma no limita el permiso a la calamidad doméstica; exige justa causa, que el nominador valora.", false]]}, {"id": "EP-142", "niv": 1, "e": "Frente a la cátedra universitaria en horario laboral, usted le explica a la profesional que", "f": "Decreto 1083 de 2015, art. 2.2.5.5.20", "o": [["A", "puede otorgársele permiso remunerado para la docencia en hora cátedra hasta por cinco horas semanales, según las necesidades del servicio.", "El art. 2.2.5.5.20 del Decreto 1083 de 2015 permite otorgar permiso remunerado para ejercer la docencia universitaria en hora cátedra hasta por cinco horas semanales, sujeto a las necesidades del servicio a juicio del jefe del organismo; las cuatro horas pedidas están dentro del límite.", true], ["B", "no puede hacerlo, porque toda actividad docente debe realizarse por fuera de la jornada laboral.", "El reglamento prevé un permiso remunerado específico para la docencia universitaria en hora cátedra dentro de la jornada, hasta cinco horas semanales.", false], ["C", "debe pedir una comisión de estudios, porque es la figura prevista para actividades académicas.", "La comisión de estudios es para que el empleado reciba formación, no para que dicte clases; para la docencia universitaria en hora cátedra existe un permiso específico.", false]]}, {"id": "EP-143", "niv": 3, "e": "Sobre los honorarios de la cátedra, usted le responde a la profesional que", "f": "Constitución Política, art. 128; Ley 4 de 1992, art. 19; Ley 1952 de 2019, art. 39, num. 13", "o": [["A", "no puede recibirlos, porque la Constitución prohíbe recibir más de una asignación del tesoro público sin excepción.", "La prohibición del art. 128 de la Constitución admite las excepciones que señale la ley, y la Ley 4 de 1992 (art. 19) exceptúa los honorarios por hora cátedra.", false], ["B", "puede recibirlos solo si renuncia a la parte proporcional de su salario por las horas dedicadas a la cátedra.", "La ley no exige descontar el salario; la excepción permite percibir los honorarios de hora cátedra junto con la asignación del empleo, dentro de los límites legales.", false], ["C", "puede recibirlos, porque los honorarios por hora cátedra son una excepción legal a la prohibición de recibir más de una asignación del tesoro público.", "El art. 128 de la Constitución prohíbe recibir más de una asignación del tesoro salvo los casos que determine la ley, y el art. 19 de la Ley 4 de 1992 exceptúa los honorarios percibidos por hora cátedra; la Ley 1952 de 2019 (art. 39, num. 13) remite a esas excepciones legales.", true]]}]}, {"comp": "empleo_publico", "rol": "general", "tag": "Empleo público, carrera y régimen disciplinario · Encargo y asignación de funciones", "texto": "En la Secretaría de Hacienda de un municipio de segunda categoría se presentan dos novedades. El tesorero, empleo de libre nombramiento y remoción, viajará diez días hábiles en comisión de servicios a otra ciudad del país para una capacitación, y la secretaria quiere que alguien atienda sus funciones mientras tanto. Además, una profesional universitaria de carrera obtuvo licencia ordinaria de dos meses, y un técnico de carrera con evaluación sobresaliente será encargado de ese empleo, de mayor remuneración. Usted, profesional de talento humano, debe proyectar los actos y responder las dudas de los servidores.", "items": [{"id": "EP-147", "niv": 3, "e": "Para que alguien atienda las funciones del tesorero durante su comisión, la figura que procede es", "f": "Decreto 1083 de 2015, arts. 2.2.5.2.2 y 2.2.5.5.52", "o": [["A", "la asignación de las funciones a otro empleado que desempeñe un cargo de la misma naturaleza.", "La comisión de servicios al interior no genera vacancia temporal (art. 2.2.5.2.2, num. 4, del Decreto 1083 de 2015); cuando la situación no genera vacancia pero implica separación transitoria de funciones, el jefe puede asignarlas a otro empleado de un cargo de la misma naturaleza (art. 2.2.5.5.52).", true], ["B", "el encargo del tesorero, porque toda comisión deja vacante temporalmente el empleo del comisionado.", "La comisión de servicios al interior no genera vacancia temporal (Decreto 1083 de 2015, art. 2.2.5.2.2, num. 4); por eso no procede el encargo.", false], ["C", "un nombramiento provisional por diez días hábiles, porque el empleo de tesorero no puede quedar sin titular.", "El nombramiento provisional es para empleos de carrera en vacancia; el tesorero no deja vacante el empleo durante una comisión de servicios al interior.", false]]}, {"id": "EP-148", "niv": 2, "e": "Si se asignan las funciones del tesorero a otro servidor, este tendrá derecho a", "f": "Decreto 1083 de 2015, art. 2.2.5.5.52", "o": [["A", "una bonificación especial equivalente a la mitad del salario del tesorero.", "No existe en el reglamento una bonificación por asignación de funciones; el servidor conserva su salario sin diferencia salarial.", false], ["B", "seguir recibiendo el salario de su propio empleo, sin diferencia salarial.", "El art. 2.2.5.5.52 del Decreto 1083 de 2015 dispone que el empleado a quien se asignan funciones no tiene derecho al pago de la diferencia salarial y no se entiende desvinculado de las funciones de su propio cargo.", true], ["C", "la diferencia salarial entre su empleo y el de tesorero durante los diez días.", "El reglamento excluye expresamente la diferencia salarial en la asignación de funciones; ese derecho es propio del encargo.", false]]}, {"id": "EP-149", "niv": 3, "e": "Mientras dure el encargo en el empleo de la profesional en licencia ordinaria, el técnico tendrá derecho a", "f": "Decreto 1083 de 2015, art. 2.2.5.5.44", "o": [["A", "recibir ambos salarios, el de técnico y el de profesional, porque ejerce dos empleos a la vez.", "Recibir dos asignaciones del tesoro está prohibido salvo excepción legal; el encargado recibe el salario del empleo encargado, no la suma de ambos.", false], ["B", "conservar el salario de técnico, porque en las vacancias temporales nunca se paga diferencia salarial.", "El reglamento sí reconoce la diferencia salarial en el encargo cuando el titular no percibe el salario, como ocurre en la licencia ordinaria no remunerada.", false], ["C", "percibir el salario del empleo de profesional, porque la titular no lo recibe durante la licencia.", "El art. 2.2.5.5.44 del Decreto 1083 de 2015 da al encargado derecho al salario del empleo que desempeña temporalmente, siempre que no deba ser percibido por su titular; la licencia ordinaria es no remunerada, así que la profesional no lo recibe.", true]]}, {"id": "EP-150", "niv": 1, "e": "Si el técnico pregunta qué pasa con sus derechos de carrera al aceptar el encargo, usted le responde que", "f": "Ley 909 de 2004, art. 42, num. 3; Decreto 1083 de 2015, art. 2.2.5.5.46", "o": [["A", "quedan suspendidos mientras dure el encargo y se reactivan solo si la Comisión de Personal lo aprueba.", "No hay suspensión de derechos ni aprobación de la Comisión de Personal; la ley simplemente dispone que no se pierden.", false], ["B", "los pierde, pero puede recuperarlos si concursa de nuevo para su empleo.", "La ley establece lo contrario: los derechos de carrera no se pierden por tomar posesión de un empleo en encargo.", false], ["C", "los conserva, porque tomar posesión de un empleo en encargo no implica perderlos.", "El art. 42, num. 3, de la Ley 909 de 2004 dispone que los derechos de carrera no se pierden cuando el empleado toma posesión de un empleo para el cual fue designado en encargo; al terminar, reasume su empleo (Decreto 1083 de 2015, art. 2.2.5.5.46).", true]]}]}, {"comp": "empleo_publico", "rol": "general", "tag": "Empleo público, carrera y régimen disciplinario · Acoso laboral: definición y modalidades", "texto": "Usted integra el comité de convivencia laboral de una alcaldía de segunda categoría. Recibe tres situaciones: una técnica denuncia que, desde hace tres meses y sin ninguna razón del servicio, su jefe le asigna el triple de trabajo que a sus compañeros y le cambia el horario cada semana, y le ha dicho que «si no le gusta, puede irse»; un auxiliar refiere que un compañero lo insulta con frecuencia y lo llama «inútil» delante de los demás; y una coordinadora de grupo afirma que dos de sus subalternos la hostigan de manera persistente con mensajes ofensivos para que renuncie a la coordinación.", "items": [{"id": "EP-176", "niv": 2, "e": "La situación de la técnica corresponde a la modalidad de acoso laboral denominada", "f": "Ley 1010 de 2006, art. 2", "o": [["A", "desprotección laboral.", "La desprotección laboral consiste en poner en riesgo la integridad y seguridad del trabajador con órdenes o funciones sin los mínimos de protección; el caso describe carga excesiva y cambios de horario para inducir la renuncia.", false], ["B", "persecución laboral.", "El art. 2, num. 2, de la Ley 1010 de 2006 define la persecución laboral como la conducta reiterada o evidentemente arbitraria que permite inferir el propósito de inducir la renuncia, mediante descalificación, carga excesiva de trabajo y cambios permanentes de horario.", true], ["C", "discriminación laboral.", "La discriminación laboral exige un trato diferenciado por razones como raza, género, edad, origen, credo, preferencia política o situación social; el caso no menciona ninguno de esos motivos, sino carga excesiva y cambios de horario para inducir la renuncia.", false]]}, {"id": "EP-177", "niv": 1, "e": "La conducta del compañero que insulta al auxiliar delante de los demás corresponde a", "f": "Ley 1010 de 2006, arts. 2 y 7", "o": [["A", "maltrato laboral, por tratarse de expresiones injuriosas que lesionan la integridad moral del trabajador.", "El art. 2, num. 1, de la Ley 1010 de 2006 define el maltrato laboral como, entre otros, toda expresión verbal injuriosa o ultrajante que lesione la integridad moral, y el art. 7 presume el acoso ante comentarios hostiles y humillantes de descalificación profesional ante los compañeros.", true], ["B", "un conflicto entre pares que no es acoso, porque este solo puede provenir de un superior jerárquico.", "La ley reconoce como posibles autores del acoso al jefe, a un compañero de trabajo o a un subalterno (art. 2 de la Ley 1010 de 2006).", false], ["C", "discriminación laboral, porque el trato que recibe es distinto al que reciben los demás compañeros de la dependencia.", "La discriminación laboral exige un trato diferenciado por razones como raza, género, edad, origen, credo o preferencia política; el caso describe insultos, que corresponden al maltrato.", false]]}, {"id": "EP-178", "niv": 3, "e": "Frente a la queja de la coordinadora contra sus subalternos, el comité debe tener en cuenta que", "f": "Ley 1010 de 2006, arts. 2 y 6", "o": [["A", "no puede tramitarse, porque la víctima del acoso siempre es quien está en posición de subordinación.", "La Ley 1010 de 2006 reconoce expresamente que el acoso puede provenir de un subalterno y que los jefes inmediatos pueden ser víctimas.", false], ["B", "puede tramitarse como acoso laboral, porque la ley contempla que los jefes inmediatos sean víctimas cuando el acoso proviene de sus subalternos.", "El art. 2 de la Ley 1010 de 2006 incluye al subalterno como posible autor del acoso, y el art. 6 reconoce como sujetos pasivos a los jefes inmediatos cuando el acoso proviene de sus subalternos.", true], ["C", "solo puede tramitarse como un asunto disciplinario por desobediencia, no como acoso laboral.", "La ley no limita esta situación a la desobediencia; la regula como acoso laboral cuando se cumplen sus elementos.", false]]}]}, {"comp": "empleo_publico", "rol": "general", "tag": "Empleo público, carrera y régimen disciplinario · Declaración de bienes y rentas y registro de conflictos de interés", "texto": "Usted trabaja en la oficina de talento humano de una corporación autónoma regional. El consejo directivo designó a un nuevo director general, que se posesionará la próxima semana. Al mismo tiempo, un técnico administrativo de planta pregunta qué obligaciones tiene sobre su declaración de bienes y rentas. Y la jefe de la oficina le pide aclarar qué debe hacer el director si, ya posesionado, compra un inmueble y adquiere participación en una sociedad.", "items": [{"id": "EP-198", "niv": 1, "e": "Al técnico administrativo usted le explica que la declaración juramentada de bienes y rentas", "f": "Ley 190 de 1995, art. 13", "o": [["A", "es requisito para posesionarse y desempeñar el cargo, y debe actualizarse cada año y al retirarse.", "El art. 13 de la Ley 190 de 1995 establece la declaración juramentada de bienes y rentas como requisito para la posesión y el desempeño del cargo, y ordena actualizarla cada año y, en todo caso, al momento del retiro.", true], ["B", "solo la presentan los servidores de libre nombramiento y remoción que manejan recursos.", "La obligación de la Ley 190 de 1995 se predica de quien es nombrado para un cargo público, sin limitarla a los de libre nombramiento o a quienes manejan recursos.", false], ["C", "solo se presenta una vez, al momento de posesionarse, y no requiere actualizaciones posteriores mientras se ejerza el cargo.", "La Ley 190 de 1995 exige actualizar la información cada año y al momento del retiro, no solo al posesionarse.", false]]}, {"id": "EP-199", "niv": 3, "e": "Sobre el nuevo director general, usted le informa a la jefe que, por la Ley 2013 de 2019, para posesionarse debe", "f": "Ley 2013 de 2019, arts. 2 y 3", "o": [["A", "entregar en sobre cerrado su declaración de renta a la Contraloría, que la mantendrá bajo reserva.", "La Ley 2013 de 2019 busca lo contrario de la reserva: la publicación y divulgación proactiva de esa información, mediante su registro en el SIGEP.", false], ["B", "presentar solo la declaración de bienes y rentas de la Ley 190 de 1995, porque la Ley 2013 aplica únicamente a cargos de elección popular.", "La Ley 2013 de 2019 no se limita a los cargos de elección popular: incluye a quienes ejercen cargos directivos y gerenciales y a la dirección de las CAR.", false], ["C", "publicar en el SIGEP su declaración de bienes y rentas, su registro de conflictos de interés y copia de su declaración de renta.", "La Ley 2013 de 2019 incluye entre los sujetos obligados a quienes ejercen cargos directivos y gerenciales en el Estado y a quienes dirigen las CAR (art. 2), exige la publicación como requisito para posesionarse, ejercer y retirarse del cargo (par. 1) y ordena registrarla en el SIGEP (art. 3).", true]]}, {"id": "EP-200", "niv": 3, "e": "Si el director, ya posesionado, compra un inmueble y adquiere participación en una sociedad, deberá", "f": "Ley 2013 de 2019, art. 3", "o": [["A", "comunicar el cambio a la entidad y registrarlo dentro de los dos meses siguientes.", "El art. 3 de la Ley 2013 de 2019 dispone que todo cambio que modifique la información de la declaración de bienes y rentas y del registro de conflictos de interés debe comunicarse a la entidad y registrarse dentro de los dos meses siguientes al cambio.", true], ["B", "reportar los cambios solo al momento de su retiro, porque es cuando se cierra la declaración.", "La ley no aplaza el reporte hasta el retiro: los cambios deben registrarse dentro de los dos meses siguientes.", false], ["C", "esperar a la actualización anual para reportar ambos cambios en una sola declaración.", "Además de la actualización anual, la ley exige reportar los cambios dentro de los dos meses siguientes a su ocurrencia; no basta esperar a la actualización anual.", false]]}]}, {"comp": "atencion_procedimiento", "rol": "asistencial", "tag": "Atención al ciudadano y procedimiento administrativo · Nivel asistencial · Derecho de petición", "texto": "Usted es auxiliar administrativo de la ventanilla única de correspondencia de la alcaldía de un municipio de sexta categoría. Un martes en la mañana llega un adulto mayor que no sabe escribir y le pide de palabra que la alcaldía repare la baranda del puente peatonal de su vereda; la alcaldía no ha establecido que ese tipo de solicitudes deba presentarse por escrito. Minutos después, una ciudadana entrega una solicitud escrita de inscripción en un programa municipal de vivienda, pero no adjunta el certificado de ingresos que exige el reglamento del programa, y le pide que de todas formas se la reciba. Por último, un comerciante que tramita un permiso ante la alcaldía protesta porque le exigen el paz y salvo del impuesto predial, que expide la misma Secretaría de Hacienda municipal.", "items": [{"id": "AP-101", "niv": 1, "e": "Frente a la solicitud del adulto mayor, a usted le corresponde", "f": "Ley 1755 de 2015, art. 1 (arts. 13 y 15 de la Ley 1437 de 2011); Decreto 1069 de 2015, art. 2.2.3.12.3 (adicionado por el Decreto 1166 de 2016)", "o": [["A", "orientarlo para que acuda a la personería municipal, encargada de recibir las peticiones de quienes no saben escribir.", "La personería recibe peticiones en sustitución de las autoridades solo cuando estas se han abstenido de recibirlas (art. 23 del CPACA). La alcaldía es la competente y está obligada a recibir y radicar la petición verbal.", false], ["B", "recibir la petición de forma verbal, dejar constancia de ella y radicarla.", "El artículo 15 del CPACA, sustituido por la Ley 1755 de 2015, permite presentar peticiones verbalmente, caso en el cual debe quedar constancia. El Decreto 1166 de 2016 (compilado en el Decreto 1069 de 2015) ordena radicar de inmediato esa constancia. Como la alcaldía no ha exigido la forma escrita para este asunto, la petición verbal es válida.", true], ["C", "pedirle que regrese con un familiar que le ayude a redactar la solicitud, porque las peticiones sobre obras deben presentarse por escrito.", "Ninguna norma exige la forma escrita para este tipo de solicitud y el caso aclara que la alcaldía no la ha establecido. Exigirla al adulto mayor desconoce el derecho a presentar peticiones verbales (art. 15 del CPACA) y su derecho a atención preferente (art. 5, num. 6).", false]]}, {"id": "AP-102", "niv": 2, "e": "Ante la insistencia de la ciudadana en que se radique la solicitud sin el certificado de ingresos, usted debe", "f": "Ley 1755 de 2015, art. 1 (art. 15 de la Ley 1437 de 2011, incisos 2 y 3 y parágrafo 2)", "o": [["A", "abstenerse de radicarla hasta que aporte el certificado, porque una solicitud sin los requisitos del reglamento no puede ingresar al sistema.", "Contradice el parágrafo 2 del artículo 15 del CPACA, según el cual ninguna autoridad puede negarse a recibir y radicar peticiones respetuosas. La falta de un documento se maneja indicándolo en el recibo y, si es del caso, con el requerimiento del artículo 17.", false], ["B", "radicarla y devolvérsela al día siguiente con la anotación de que se tiene por no presentada.", "La ley no permite tener por no presentada una petición incompleta ni devolverla por esa razón (art. 19 del CPACA). Si falta un documento necesario, procede el requerimiento del artículo 17 para que la complete.", false], ["C", "indicarle en ese momento el documento que falta y, si insiste, radicar la solicitud dejando constancia del requisito faltante.", "El artículo 15 del CPACA dispone que, cuando la petición no se acompaña de los documentos exigidos, en el acto de recibo se indican los que faltan y, si el peticionario insiste, se radica dejando constancia de ello. Además, ninguna autoridad puede negarse a recibir y radicar peticiones respetuosas.", true]]}, {"id": "AP-103", "niv": 2, "e": "Sobre la queja del comerciante por la exigencia del paz y salvo predial, lo procedente es explicarle que", "f": "Decreto Ley 019 de 2012, art. 9; Ley 1437 de 2011, art. 9, num. 4; Ley 1755 de 2015, art. 1 (art. 16, parágrafo 1)", "o": [["A", "la alcaldía no puede exigirle ese documento, porque es una certificación que ya reposa en la propia entidad.", "El artículo 9 del Decreto Ley 019 de 2012 prohíbe exigir constancias, certificaciones o documentos que ya reposen en la entidad ante la cual se adelanta el trámite, y el artículo 9, numeral 4, del CPACA lo prohíbe a las autoridades. La Secretaría de Hacienda hace parte de la misma alcaldía.", true], ["B", "el paz y salvo sí es exigible, porque lo expide una dependencia distinta de la que tramita el permiso.", "La prohibición se refiere a documentos que reposan en la entidad, no en la misma dependencia. Las secretarías son dependencias de la alcaldía, de modo que la información está en poder de la entidad que adelanta el trámite.", false], ["C", "puede reemplazar el paz y salvo por una declaración extrajuicio en la que afirme estar al día con el impuesto.", "El artículo 7 del Decreto Ley 019 de 2012 prohíbe exigir declaraciones extrajuicio en los trámites, y en este caso no hay nada que reemplazar: la entidad debe verificar la información que ya tiene en sus archivos.", false]]}]}, {"comp": "atencion_procedimiento", "rol": "general", "tag": "Atención al ciudadano y procedimiento administrativo · Derecho de petición: reglas generales", "texto": "Usted trabaja en la Secretaría de Educación de un municipio certificado. El martes 4 de mayo de 2027 la Personería municipal radicó una solicitud de información sobre el número de estudiantes beneficiados con el transporte escolar. Ese mismo día, un estudiante de 15 años se acercó solo a radicar una petición para acceder a una beca municipal. Un compañero de trabajo propone cobrar una tarifa por radicar peticiones y exigir abogado en las más complejas. La entidad atiende de lunes a viernes; el lunes 10 de mayo de 2027 es festivo y, aparte del sábado 1 de mayo, no hay otros festivos en mayo hasta el día 30.", "items": [{"id": "AP-122", "niv": 3, "e": "El último día para responder la solicitud de la Personería es el", "f": "Ley 1755 de 2015, art. 1 (art. 30 de la Ley 1437 de 2011); cálculo de días hábiles", "o": [["A", "martes 18 de mayo de 2027.", "Resulta de contar el lunes 10 de mayo como día hábil. Ese día es festivo y no se cuenta.", false], ["B", "miércoles 19 de mayo de 2027.", "Entre autoridades, la petición de información debe resolverse en no más de diez días (art. 30 del CPACA): 5 a 7 de mayo (3), 11 a 14 (7), 17 a 19 (10). Se excluyen el fin de semana y el festivo del 10 de mayo.", true], ["C", "miércoles 26 de mayo de 2027.", "Aplica el término general de quince días. Cuando una autoridad pide información a otra, la ley fija un término especial de diez días.", false]]}, {"id": "AP-123", "niv": 1, "e": "Frente a la petición del estudiante de 15 años sobre la beca municipal, usted debe", "f": "Decreto Ley 019 de 2012, art. 12; Ley 1755 de 2015, art. 1 (art. 13 de la Ley 1437 de 2011)", "o": [["A", "exigir que la presente su padre, madre o representante legal, porque los menores no pueden actuar solos ante la administración.", "La ley reconoce a los menores la facultad de presentar peticiones directamente en asuntos de su interés y bienestar, sin intermediarios.", false], ["B", "recibirla solo como información, sin radicarla, hasta que un adulto responsable la ratifique por escrito.", "Ninguna norma exige la ratificación de un adulto. Además, ninguna autoridad puede negarse a radicar peticiones respetuosas (art. 15, parágrafo 2, del CPACA).", false], ["C", "recibirla y tramitarla con prelación en el turno, porque los menores pueden presentar directamente peticiones sobre asuntos de su interés y bienestar.", "El artículo 12 del Decreto Ley 019 de 2012 permite que niños, niñas y adolescentes presenten directamente solicitudes relacionadas con su interés superior, su bienestar y su protección especial, con prelación en el turno. El artículo 13 del CPACA no exige persona mayor ante las entidades dedicadas a su formación.", true]]}, {"id": "AP-124", "niv": 1, "e": "Sobre la propuesta de cobrar por radicar peticiones y exigir abogado en las complejas, lo correcto es señalar que", "f": "Ley 1755 de 2015, art. 1 (art. 13 de la Ley 1437 de 2011)", "o": [["A", "el derecho de petición es gratuito y puede ejercerse sin necesidad de abogado.", "El inciso 3 del artículo 13 del CPACA dispone que el ejercicio del derecho de petición es gratuito y puede realizarse sin representación de abogado.", true], ["B", "el abogado solo es exigible cuando la petición busca el reconocimiento de un derecho de contenido económico.", "La ley no distingue según el contenido de la petición. En todos los casos puede ejercerse sin abogado.", false], ["C", "puede cobrarse una tarifa razonable por radicación, siempre que se fije mediante acto administrativo general.", "El artículo 13 del CPACA establece que el derecho de petición es gratuito. Lo único que puede cobrarse es el costo de las copias que se pidan (art. 29).", false]]}]}, {"comp": "atencion_procedimiento", "rol": "asistencial", "tag": "Atención al ciudadano y procedimiento administrativo · Nivel asistencial · Atención incluyente", "texto": "Usted es auxiliar administrativo del centro de atención a la ciudadanía de una gobernación del Caribe. En la fila de turnos esperan un adulto mayor que camina con bastón y una mujer en avanzado estado de embarazo. Luego llega un hombre que habla wayuunaiki, no se comunica en español y quiere presentar verbalmente una petición sobre el servicio de agua de su comunidad; la gobernación no tiene intérpretes en su planta. Más tarde se acerca una persona sorda que quiere presentar una petición sobre un subsidio y se comunica en lengua de señas.", "items": [{"id": "AP-162", "niv": 1, "e": "Respecto del orden de atención del adulto mayor y de la mujer embarazada, usted debe", "f": "Ley 1437 de 2011, art. 5, num. 6; Decreto Ley 019 de 2012, art. 13", "o": [["A", "asignarles turno como a los demás, para no afectar el derecho a la igualdad de quienes llegaron antes.", "La atención preferencial es un desarrollo del derecho a la igualdad material del artículo 13 de la Constitución, no una vulneración de ese derecho.", false], ["B", "darles atención preferencial frente a quienes esperan en la fila.", "El numeral 6 del artículo 5 del CPACA reconoce el derecho a atención especial y preferente de adultos mayores y mujeres gestantes, y el artículo 13 del Decreto Ley 019 de 2012 obliga a las entidades a establecer mecanismos de atención preferencial para ellos.", true], ["C", "darles prelación solo si presentan un documento que acredite su edad o su estado de embarazo.", "La ley no condiciona la atención preferente a la presentación de documentos. Exigirlos sería un requisito adicional no previsto.", false]]}, {"id": "AP-163", "niv": 2, "e": "Para recibir la petición del hombre que habla wayuunaiki, a usted le corresponde", "f": "Decreto 1069 de 2015, art. 2.2.3.12.9 (adicionado por el Decreto 1166 de 2016)", "o": [["A", "pedirle que regrese con un familiar que hable español, para que la petición quede clara desde el inicio.", "Las personas que hablan una lengua nativa pueden presentar peticiones verbales en su lengua ante cualquier autoridad. Exigir un acompañante traslada al ciudadano una carga que la ley pone en la entidad.", false], ["B", "remitirlo a la Defensoría del Pueblo, que es la entidad encargada de recibir las peticiones de los pueblos indígenas.", "La petición se dirige a la gobernación y debe recibirla la gobernación. La Defensoría presta asistencia, pero no sustituye a la autoridad competente.", false], ["C", "dejar constancia de que no hay intérprete y grabar su petición verbal para su posterior traducción y respuesta.", "El artículo 2.2.3.12.9 del Decreto 1069 de 2015 permite presentar peticiones verbales en lengua nativa y dispone que, si la entidad no tiene intérpretes en su planta, deja constancia de ello y graba la petición en cualquier medio tecnológico o electrónico para su posterior traducción y respuesta.", true]]}, {"id": "AP-164", "niv": 2, "e": "Para recibir la petición de la persona sorda, usted debe", "f": "Decreto 1069 de 2015, art. 2.2.3.12.8 (adicionado por el Decreto 1166 de 2016); Ley 1437 de 2011, art. 5, num. 6", "o": [["A", "pedirle que presente la petición por escrito, porque no puede formularla verbalmente.", "La persona puede presentar su petición verbal en lengua de señas. Obligarla a escribir es una barrera, contraria al deber de adoptar medidas de inclusión.", false], ["B", "atenderla únicamente si llega acompañada de un intérprete de lengua de señas que ella misma consiga.", "Corresponde a la entidad, directamente o por mecanismos idóneos, adoptar las medidas de inclusión. No puede trasladar a la persona la carga de conseguir el intérprete.", false], ["C", "brindarle atención prioritaria y diferencial, apoyándose en personal o mecanismos idóneos.", "El artículo 2.2.3.12.8 del Decreto 1069 de 2015 obliga a adoptar medidas de inclusión para recibir peticiones verbales de personas con discapacidad, como atención prioritaria y diferencial y personal especializado para recibirlas y apoyar su precisión. El CPACA (art. 5, num. 6) reconoce su derecho a atención preferente.", true]]}]}, {"comp": "atencion_procedimiento", "rol": "general", "tag": "Atención al ciudadano y procedimiento administrativo · Protección de datos personales: autorización", "texto": "La Secretaría de Educación de un municipio certificado administra la base de datos de los beneficiarios de su auxilio de transporte para estudiantes universitarios, todos mayores de edad. La Personería municipal, en ejercicio de sus funciones de vigilancia, pide el listado de beneficiarios con sus nombres, documentos y direcciones. Al mismo tiempo, la secretaría diseña el formulario de inscripción de un nuevo programa voluntario de formación para padres de familia y discute cómo recoger la autorización para el tratamiento de los datos. Además, un beneficiario pide copia de sus propios datos personales que reposan en la base, y un funcionario propone cobrarle.", "items": [{"id": "AP-203", "niv": 3, "e": "Para entregar a la Personería el listado de beneficiarios, la secretaría", "f": "Ley 1581 de 2012, art. 10, lit. a", "o": [["A", "debe obtener previamente la autorización escrita de cada uno de los titulares o sus representantes.", "El literal a del artículo 10 de la Ley 1581 de 2012 exceptúa de la autorización la información requerida por una entidad pública en ejercicio de sus funciones legales.", false], ["B", "no requiere la autorización de los titulares, porque una entidad pública la pide en ejercicio de sus funciones legales.", "El literal a del artículo 10 de la Ley 1581 de 2012 dispone que no es necesaria la autorización del titular cuando la información la requiere una entidad pública en ejercicio de sus funciones legales. Quien accede a los datos debe, en todo caso, cumplir la ley.", true], ["C", "solo puede entregarlo si la Personería presenta una orden judicial que lo autorice.", "La orden judicial es una de las causales de excepción, pero no la única: también lo es el requerimiento de una entidad pública en ejercicio de sus funciones legales.", false]]}, {"id": "AP-204", "niv": 1, "e": "En el nuevo programa voluntario, la autorización para el tratamiento de los datos debe ser", "f": "Ley 1581 de 2012, art. 9", "o": [["A", "previa e informada, y obtenida por cualquier medio que pueda ser objeto de consulta posterior.", "El artículo 9 de la Ley 1581 de 2012 exige que, salvo las excepciones legales, el tratamiento cuente con la autorización previa e informada del titular, obtenida por cualquier medio que pueda ser objeto de consulta posterior.", true], ["B", "otorgada ante notario, para que tenga plena validez frente a terceros.", "La ley no exige formalidad notarial: basta un medio que permita consultarla después.", false], ["C", "verbal y sin registro, porque los padres se inscriben voluntariamente.", "La autorización debe obtenerse por un medio que pueda ser objeto de consulta posterior; una autorización verbal sin registro no lo permite.", false]]}, {"id": "AP-205", "niv": 1, "e": "Frente a la propuesta de cobrar al beneficiario por conocer sus propios datos, lo correcto es señalar que", "f": "Ley 1581 de 2012, art. 8, lit. f", "o": [["A", "puede cobrarse una tarifa fijada por la secretaría, porque la consulta implica trabajo adicional del personal.", "La ley garantiza el acceso gratuito del titular a sus propios datos.", false], ["B", "el titular tiene derecho a acceder en forma gratuita a sus datos personales que han sido objeto de tratamiento.", "El literal f del artículo 8 de la Ley 1581 de 2012 reconoce al titular el derecho a acceder en forma gratuita a sus datos personales que hayan sido objeto de tratamiento.", true], ["C", "puede cobrarse si la consulta se hace más de una vez en el mismo año.", "La Ley 1581 de 2012 no limita la gratuidad del acceso del titular a sus propios datos según el número de consultas.", false]]}]}, {"comp": "gestion_publica", "rol": "general", "tag": "Gestión pública, MIPG, contratación y documentos · Transparencia: riesgo de corrupción y atención de quejas", "texto": "Usted trabaja en la Secretaría de Gobierno de un municipio de quinta categoría y participa en la mesa que formula el Programa de Transparencia y Ética Pública de la alcaldía. Un integrante opina que el programa solo debe enumerar actividades de capacitación en valores. Otro pregunta cuánto tiempo tiene la alcaldía para incorporar las modificaciones del anexo técnico que expida la Secretaría de Transparencia de la Presidencia. Un tercero propone suprimir la dependencia que tramita quejas, sugerencias y reclamos «para ahorrar costos».", "items": [{"id": "GP-185", "niv": 1, "e": "Frente a la primera opinión, usted aclara que la finalidad del programa incluye", "f": "Ley 1474 de 2011, art. 73 (modificado por el art. 31 de la Ley 2195 de 2022)", "o": [["A", "capacitar exclusivamente a los directivos en el código de integridad.", "La capacitación puede ser una acción, pero la finalidad legal es más amplia y comprende la gestión del riesgo de corrupción en toda la entidad.", false], ["B", "reemplazar el régimen disciplinario con compromisos éticos firmados por los servidores.", "El programa es preventivo y no sustituye el régimen disciplinario, que sigue regulado por el Código General Disciplinario.", false], ["C", "promover la cultura de la legalidad y gestionar de forma permanente el riesgo de corrupción en la misión de la entidad.", "El artículo 73 de la Ley 1474 de 2011, modificado por la Ley 2195 de 2022, señala como fin del programa promover la cultura de la legalidad y gestionar (identificar, medir, controlar y monitorear) el riesgo de corrupción en la misionalidad de la entidad.", true]]}, {"id": "GP-186", "niv": 3, "e": "Sobre el plazo para incorporar las modificaciones del anexo técnico, las entidades territoriales cuentan con", "f": "Ley 1474 de 2011, art. 73, parágrafo 2; Decreto 1081 de 2015, art. 2.1.4.4.1.2 (adicionado por el Decreto 1122 de 2024)", "o": [["A", "hasta seis meses.", "La norma no fija seis meses; establece un año para las entidades nacionales y dos para las territoriales.", false], ["B", "hasta un año.", "Un año es el plazo para las entidades del orden nacional; las territoriales tienen un plazo mayor.", false], ["C", "hasta dos años.", "El Decreto 1122 de 2024 dispone que las modificaciones del anexo técnico se aplican en los plazos del parágrafo 2 del artículo 73 de la Ley 1474 de 2011: hasta un año para las entidades nacionales y hasta dos años para las territoriales.", true]]}, {"id": "GP-187", "niv": 2, "e": "La propuesta de suprimir la dependencia de quejas, sugerencias y reclamos", "f": "Ley 1474 de 2011, art. 76", "o": [["A", "no procede, porque la ley exige que cada entidad pública cuente con una dependencia para atender esos casos.", "El artículo 76 de la Ley 1474 de 2011 exige que en toda entidad pública exista por lo menos una dependencia encargada de recibir, tramitar y resolver las quejas, sugerencias y reclamos de los ciudadanos.", true], ["B", "procede, porque esa función puede trasladarse a la personería municipal como órgano de control.", "La personería es un órgano de control con funciones propias; la ley exige que la dependencia exista dentro de la entidad pública.", false], ["C", "procede si la alcaldía habilita en su página web un correo electrónico exclusivo para recibir quejas.", "Un correo electrónico es un canal, no una dependencia encargada de tramitar y resolver; no cumple el mandato legal.", false]]}]}, {"comp": "gestion_publica", "rol": "asistencial", "tag": "Gestión pública, MIPG, contratación y documentos · Nivel asistencial · Gestión documental: entrega de archivos al desvincularse", "texto": "Usted es auxiliar administrativo de una alcaldía local de Bogotá. La profesional que manejaba los expedientes de querellas renunció y su último día de trabajo es el viernes. Ella propone dejar las carpetas «en el e
