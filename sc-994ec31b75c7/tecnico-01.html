 la oficina de control disciplinario interno o la autoridad competente; no es un objetivo del sistema de control interno de la Ley 87 de 1993.", false], ["C", "vigilar la gestión fiscal de la alcaldía en reemplazo de la contraloría territorial.", "El control fiscal es externo y corresponde a las contralorías; el control interno no lo reemplaza, sino que opera dentro de la entidad.", false]]}, {"id": "GP-120", "niv": 2, "e": "Sobre lo que hace la Oficina de Control Interno, usted indica que una de sus funciones es", "f": "Ley 87 de 1993, art. 12, lit. c", "o": [["A", "ejecutar directamente los controles de los procesos misionales de la alcaldía.", "La ejecución de los controles corresponde a los responsables de cada proceso; la oficina de control interno verifica su cumplimiento de manera independiente.", false], ["B", "aprobar los procedimientos de cada área antes de que el alcalde los adopte.", "Aprobar procedimientos sería intervenir en la gestión que luego evalúa; la ley le asigna verificar y recomendar, no aprobar procedimientos.", false], ["C", "verificar que los responsables de los procesos cumplan los controles definidos.", "El artículo 12, literal c, de la Ley 87 de 1993 asigna al jefe de control interno verificar que los controles definidos para los procesos se cumplan por los responsables de su ejecución.", true]]}, {"id": "GP-121", "niv": 1, "e": "Frente a la instancia que coordina el sistema, usted señala que la Ley 87 de 1993 ordena establecer al más alto nivel jerárquico", "f": "Ley 87 de 1993, art. 13", "o": [["A", "un comité de coordinación del sistema de control interno.", "El artículo 13 de la Ley 87 de 1993 ordena a las entidades establecer, al más alto nivel jerárquico, un comité de coordinación del sistema de control interno.", true], ["B", "una junta de vigilancia integrada por usuarios y veedores ciudadanos.", "Las veedurías ejercen control social externo; la Ley 87 de 1993 no crea una junta de este tipo como instancia del sistema de control interno.", false], ["C", "una comisión de personal encargada del control interno.", "La comisión de personal es una instancia del sistema de carrera administrativa, con funciones distintas; no es la instancia de coordinación del control interno.", false]]}]}, {"comp": "gestion_publica", "rol": "tecnico", "tag": "Gestión pública, MIPG, contratación y documentos · Nivel técnico · Presupuesto: CDP y registro presupuestal", "texto": "Usted es técnico administrativo del área financiera de un instituto municipal de deportes, cuyo estatuto presupuestal sigue las reglas del Decreto 111 de 1996. La gerente quiere expedir una resolución que reconoce apoyos económicos a deportistas y, después, firmar un contrato de transporte para los juegos departamentales. El jefe jurídico sugiere «firmar primero y pedir después la disponibilidad presupuestal, porque el rubro tiene recursos de sobra». A usted le corresponde orientar el trámite presupuestal.", "items": [{"id": "GP-139", "niv": 1, "e": "Antes de expedir la resolución de apoyos, el instituto debe contar con", "f": "Decreto 111 de 1996, art. 71", "o": [["A", "el registro presupuestal del compromiso, que se expide antes del acto administrativo.", "El registro presupuestal se hace sobre un compromiso ya adquirido; lo que debe existir antes del acto es el certificado de disponibilidad.", false], ["B", "el certificado de disponibilidad presupuestal que garantice apropiación suficiente.", "El artículo 71 del Decreto 111 de 1996 exige que todo acto administrativo que afecte apropiaciones cuente con certificado de disponibilidad previo que garantice apropiación suficiente.", true], ["C", "la aprobación del Programa Anual Mensualizado de Caja por el concejo municipal.", "El PAC es un instrumento de manejo de caja que no aprueba el concejo; el requisito previo al acto es el certificado de disponibilidad presupuestal.", false]]}, {"id": "GP-140", "niv": 2, "e": "Una vez firmado el contrato de transporte, el registro presupuestal", "f": "Decreto 111 de 1996, art. 71", "o": [["A", "solo es necesario si el contrato supera la menor cuantía del instituto.", "El Decreto 111 de 1996 no condiciona el registro presupuestal a la cuantía del compromiso.", false], ["B", "es opcional cuando ya existe certificado de disponibilidad presupuestal.", "La disponibilidad y el registro cumplen funciones distintas; el artículo 71 del Decreto 111 de 1996 exige ambos, de modo que contar con el certificado no exime del registro.", false], ["C", "debe expedirse indicando el valor y el plazo de las prestaciones, para que los recursos no se desvíen a otro fin.", "El artículo 71 del Decreto 111 de 1996 exige registrar los compromisos para que los recursos no se desvíen a otro fin, y que el registro indique con claridad el valor y el plazo de las prestaciones.", true]]}, {"id": "GP-141", "niv": 3, "e": "Si se siguiera la sugerencia del jefe jurídico y se adquiriera el compromiso sin disponibilidad previa,", "f": "Decreto 111 de 1996, art. 71", "o": [["A", "la irregularidad se subsanaría expidiendo el certificado dentro de los tres días siguientes a la firma.", "La disponibilidad debe ser previa; la norma no prevé subsanación posterior dentro de un plazo, sino responsabilidad de quien asume el compromiso irregular.", false], ["B", "quien asuma la obligación incurriría en responsabilidad personal y pecuniaria.", "El artículo 71 del Decreto 111 de 1996 dispone que cualquier compromiso adquirido con violación de estos preceptos crea responsabilidad personal y pecuniaria a cargo de quien asuma la obligación.", true], ["C", "el compromiso sería válido, porque basta con que el rubro tenga saldo suficiente.", "El saldo del rubro no reemplaza el certificado: la norma exige que la disponibilidad se certifique antes de adquirir el compromiso.", false]]}]}, {"comp": "gestion_publica", "rol": "tecnico", "tag": "Gestión pública, MIPG, contratación y documentos · Nivel técnico · Supervisión: facultades y deberes", "texto": "Usted es técnico administrativo de la alcaldía de un municipio de segunda categoría y fue designado supervisor del contrato de aseo y cafetería de las sedes administrativas. Ha notado que el contratista no entrega las planillas de pago de seguridad social de su personal y que algunos insumos facturados no llegan. Además, un trabajador del contratista le cuenta que la factura del último mes incluyó turnos que nunca se prestaron y que «alguien de la alcaldía» lo sabía. Por el volumen de trabajo, usted solicita apoyo para su labor.", "items": [{"id": "GP-176", "niv": 1, "e": "Ante las inconsistencias en planillas e insumos, usted está facultado para", "f": "Ley 1474 de 2011, art. 84", "o": [["A", "suspender los pagos y terminar el contrato de manera unilateral mediante un oficio dirigido al contratista.", "La terminación unilateral y las demás potestades excepcionales son de la entidad, mediante acto administrativo; no son facultades del supervisor.", false], ["B", "imponer directamente multas al contratista mediante comunicación escrita.", "El supervisor no impone multas: estas se imponen por la entidad mediante el procedimiento legal; el supervisor informa y aporta los soportes.", false], ["C", "solicitar al contratista informes, aclaraciones y explicaciones sobre la ejecución.", "El artículo 84 de la Ley 1474 de 2011 faculta a supervisores e interventores para solicitar informes, aclaraciones y explicaciones sobre el desarrollo de la ejecución contractual.", true]]}, {"id": "GP-177", "niv": 2, "e": "Frente a lo que le contó el trabajador del contratista, usted debe", "f": "Ley 1474 de 2011, art. 84", "o": [["A", "informar a la entidad, pues los hechos pueden ser actos de corrupción o afectar el cumplimiento del contrato.", "El artículo 84 de la Ley 1474 de 2011 hace responsables a supervisores e interventores de mantener informada a la entidad sobre hechos que puedan constituir actos de corrupción o poner en riesgo el cumplimiento del contrato.", true], ["B", "esperar a la liquidación del contrato para verificar si el sobrecosto se compensa con otros meses.", "Esperar a la liquidación desatiende el deber de mantener informada a la entidad de manera oportuna sobre hechos que ponen en riesgo el contrato.", false], ["C", "abstenerse de reportarlo hasta reunir pruebas documentales completas, para proteger el buen nombre de los servidores implicados.", "La ley no condiciona el deber de informar a contar con pruebas completas; basta con hechos que puedan constituir corrupción o riesgo de incumplimiento.", false]]}, {"id": "GP-178", "niv": 3, "e": "Si la alcaldía decide contratar personal para apoyar su labor de supervisión, puede hacerlo", "f": "Ley 1474 de 2011, art. 83", "o": [["A", "solo con servidores de carrera de otras dependencias, porque la supervisión no admite contratistas.", "La ley admite expresamente contratistas de prestación de servicios como personal de apoyo a la supervisión.", false], ["B", "solo mediante un contrato de interventoría, que reemplazaría su designación como supervisor.", "Un apoyo a la supervisión no exige contratar una interventoría; la ley prevé expresamente la prestación de servicios como mecanismo de apoyo.", false], ["C", "mediante contratos de prestación de servicios, sin que usted deje de ser el supervisor.", "El artículo 83 de la Ley 1474 de 2011 permite a la entidad contratar personal de apoyo para la supervisión mediante contratos de prestación de servicios; el apoyo no sustituye al supervisor designado.", true]]}]}, {"comp": "gestion_publica", "rol": "general", "tag": "Gestión pública, MIPG, contratación y documentos · Transparencia: riesgo de corrupción y atención de quejas", "texto": "Usted trabaja en la Secretaría de Gobierno de un municipio de quinta categoría y participa en la mesa que formula el Programa de Transparencia y Ética Pública de la alcaldía. Un integrante opina que el programa solo debe enumerar actividades de capacitación en valores. Otro pregunta cuánto tiempo tiene la alcaldía para incorporar las modificaciones del anexo técnico que expida la Secretaría de Transparencia de la Presidencia. Un tercero propone suprimir la dependencia que tramita quejas, sugerencias y reclamos «para ahorrar costos».", "items": [{"id": "GP-185", "niv": 1, "e": "Frente a la primera opinión, usted aclara que la finalidad del programa incluye", "f": "Ley 1474 de 2011, art. 73 (modificado por el art. 31 de la Ley 2195 de 2022)", "o": [["A", "capacitar exclusivamente a los directivos en el código de integridad.", "La capacitación puede ser una acción, pero la finalidad legal es más amplia y comprende la gestión del riesgo de corrupción en toda la entidad.", false], ["B", "promover la cultura de la legalidad y gestionar de forma permanente el riesgo de corrupción en la misión de la entidad.", "El artículo 73 de la Ley 1474 de 2011, modificado por la Ley 2195 de 2022, señala como fin del programa promover la cultura de la legalidad y gestionar (identificar, medir, controlar y monitorear) el riesgo de corrupción en la misionalidad de la entidad.", true], ["C", "reemplazar el régimen disciplinario con compromisos éticos firmados por los servidores.", "El programa es preventivo y no sustituye el régimen disciplinario, que sigue regulado por el Código General Disciplinario.", false]]}, {"id": "GP-186", "niv": 3, "e": "Sobre el plazo para incorporar las modificaciones del anexo técnico, las entidades territoriales cuentan con", "f": "Ley 1474 de 2011, art. 73, parágrafo 2; Decreto 1081 de 2015, art. 2.1.4.4.1.2 (adicionado por el Decreto 1122 de 2024)", "o": [["A", "hasta seis meses.", "La norma no fija seis meses; establece un año para las entidades nacionales y dos para las territoriales.", false], ["B", "hasta un año.", "Un año es el plazo para las entidades del orden nacional; las territoriales tienen un plazo mayor.", false], ["C", "hasta dos años.", "El Decreto 1122 de 2024 dispone que las modificaciones del anexo técnico se aplican en los plazos del parágrafo 2 del artículo 73 de la Ley 1474 de 2011: hasta un año para las entidades nacionales y hasta dos años para las territoriales.", true]]}, {"id": "GP-187", "niv": 2, "e": "La propuesta de suprimir la dependencia de quejas, sugerencias y reclamos", "f": "Ley 1474 de 2011, art. 76", "o": [["A", "no procede, porque la ley exige que cada entidad pública cuente con una dependencia para atender esos casos.", "El artículo 76 de la Ley 1474 de 2011 exige que en toda entidad pública exista por lo menos una dependencia encargada de recibir, tramitar y resolver las quejas, sugerencias y reclamos de los ciudadanos.", true], ["B", "procede, porque esa función puede trasladarse a la personería municipal como órgano de control.", "La personería es un órgano de control con funciones propias; la ley exige que la dependencia exista dentro de la entidad pública.", false], ["C", "procede si la alcaldía habilita en su página web un correo electrónico exclusivo para recibir quejas.", "Un correo electrónico es un canal, no una dependencia encargada de tramitar y resolver; no cumple el mandato legal.", false]]}]}, {"comp": "entidades_territoriales", "rol": "general", "tag": "Entidades territoriales, Bogotá D.C. y CAR · Asamblea departamental", "texto": "Usted es profesional universitario de la Secretaría General de la Asamblea de un departamento del Caribe colombiano. Corre el tercer año del periodo constitucional. En agosto, el gobernador necesita que la Asamblea apruebe con urgencia una autorización para comprometer vigencias futuras de un proyecto vial, y algunos diputados preguntan si en esas sesiones podrán también citar al secretario de Salud por la crisis hospitalaria. Además, la mesa directiva le pide aclarar quién debe aprobar el presupuesto departamental de la próxima vigencia.", "items": [{"id": "ET-123", "niv": 1, "e": "Sobre los periodos de sesiones ordinarias de la Asamblea en ese tercer año, usted informa que van", "f": "Ley 2200 de 2022, art. 23", "o": [["A", "de febrero, mayo, agosto y noviembre, por derecho propio y máximo una vez por día.", "Ese calendario corresponde a los concejos de municipios de tercera a sexta categoría (art. 23 de la Ley 136 de 1994), no a las asambleas departamentales.", false], ["B", "del 1 de marzo al 30 de abril, del 1 de junio al 30 de julio y del 1 de octubre al 30 de noviembre.", "El art. 23 de la Ley 2200 de 2022 fija, para el segundo, tercer y cuarto año, los periodos de 1 de marzo a 30 de abril, 1 de junio a 30 de julio y 1 de octubre a 30 de noviembre.", true], ["C", "del 1 de enero al último día de febrero, del 1 de junio al 30 de julio y del 1 de octubre al 30 de noviembre.", "El periodo de enero a febrero corresponde solo al primer año de sesiones; del segundo al cuarto año el primer periodo va del 1 de marzo al 30 de abril (art. 23 de la Ley 2200 de 2022).", false]]}, {"id": "ET-124", "niv": 2, "e": "Si el gobernador convoca a sesiones extraordinarias en agosto para tramitar la autorización de vigencias futuras, los diputados", "f": "Ley 2200 de 2022, art. 23", "o": [["A", "podrán ocuparse de los asuntos que el gobernador someta y, además, ejercer el control político propio de la corporación.", "El art. 23 de la Ley 2200 de 2022 limita las extraordinarias a los asuntos que el gobernador somete, pero deja a salvo la función de control político y los temas administrativos de la corporación.", true], ["B", "podrán tramitar cualquier proyecto de ordenanza, porque las extraordinarias amplían la agenda ordinaria.", "En las extraordinarias la asamblea solo puede ocuparse de los asuntos que el gobernador somete (además del control político y temas administrativos propios).", false], ["C", "solo podrán ocuparse de la autorización de vigencias futuras, sin adelantar debates de control político.", "La Ley 2200 de 2022 dejó expresamente a salvo el control político durante las sesiones extraordinarias.", false]]}, {"id": "ET-125", "niv": 1, "e": "En relación con el presupuesto departamental de la próxima vigencia, usted aclara que", "f": "Ley 2200 de 2022, art. 19, num. 32", "o": [["A", "lo expide la Asamblea departamental con base en el proyecto que le presente el gobernador.", "El art. 19, numeral 32 de la Ley 2200 de 2022 asigna a la Asamblea expedir anualmente el presupuesto de rentas y gastos, con base en el proyecto presentado por el gobernador.", true], ["B", "lo expide el gobernador por decreto, y la Asamblea solo puede improbarlo dentro del mes siguiente.", "La expedición anual del presupuesto es función de la Asamblea; el gobernador presenta el proyecto (art. 19, num. 32 de la Ley 2200 de 2022).", false], ["C", "lo aprueba el Consejo Departamental de Política Fiscal, previo concepto de la Asamblea.", "Ningún consejo de política fiscal sustituye a la Asamblea en la expedición del presupuesto.", false]]}]}, {"comp": "entidades_territoriales", "rol": "tecnico", "tag": "Entidades territoriales, Bogotá D.C. y CAR · Nivel técnico · Control de las JAL de Bogotá", "texto": "Usted es técnico de la secretaría de la JAL de una localidad de Bogotá. La JAL aprobó citar al alcalde local para hacer seguimiento a la inversión del Fondo de Desarrollo Local; es la primera vez que lo cita en el semestre. La citación, con el cuestionario escrito, fue recibida en el despacho del alcalde local el jueves 4 de marzo de 2027 y la sesión se programó para el viernes 12 de marzo de 2027. No hay días festivos entre el 4 y el 12 de marzo de 2027.", "items": [{"id": "ET-138", "niv": 1, "e": "Sobre la frecuencia con la que la JAL puede citar al alcalde local, usted informa que puede hacerlo", "f": "Decreto Ley 1421 de 1993, art. 69, num. 14 (modificado por el art. 8 de la Ley 2116 de 2021)", "o": [["A", "las veces que apruebe la plenaria, sin límite.", "La ley sí fija un límite: una citación cada seis meses.", false], ["B", "una vez al mes, en cada periodo de sesiones ordinarias.", "La norma fija una periodicidad menor: una vez cada seis meses (art. 69, num. 14 del Decreto Ley 1421 de 1993).", false], ["C", "una vez cada seis meses.", "El art. 69, numeral 14 del Decreto Ley 1421 de 1993 (modificado por la Ley 2116 de 2021) permite a las JAL citar al alcalde local una vez cada seis meses.", true]]}, {"id": "ET-139", "niv": 3, "e": "Respecto de la anticipación con la que se entregó el cuestionario, usted concluye que", "f": "Decreto Ley 1421 de 1993, art. 69, num. 14 (modificado por el art. 8 de la Ley 2116 de 2021)", "o": [["A", "es insuficiente, porque el cuestionario debía entregarse con no menos de diez días hábiles.", "El término exigido es de cinco días hábiles, no de diez.", false], ["B", "cumple, porque entre el recibo y la sesión median cinco días hábiles completos, que es la anticipación mínima exigida.", "El art. 69, num. 14 del Decreto Ley 1421 de 1993 exige que los cuestionarios se hagan con anticipación no menor de cinco días hábiles. Entre el recibo (jueves 4) y la sesión (viernes 12) transcurren cinco días hábiles completos: 5, 8, 9, 10 y 11 de marzo de 2027.", true], ["C", "no aplica ningún término, porque el alcalde local está obligado a asistir cuando la JAL lo cite.", "La ley sí regula la anticipación del cuestionario: no menor de cinco días hábiles.", false]]}, {"id": "ET-140", "niv": 3, "e": "El alcalde local debe radicar en la secretaría de la JAL la respuesta escrita al cuestionario a más tardar el", "f": "Decreto Ley 1421 de 1993, art. 69, num. 14 (modificado por el art. 8 de la Ley 2116 de 2021)", "o": [["A", "lunes 8 de marzo de 2027.", "Corresponde al segundo día hábil siguiente al recibo. La norma da hasta el tercer día hábil.", false], ["B", "martes 9 de marzo de 2027.", "El art. 69, num. 14 del Decreto Ley 1421 de 1993 ordena radicar la respuesta dentro del tercer día hábil siguiente al recibo de la citación. Recibida el jueves 4, los días hábiles siguientes son viernes 5 (1), lunes 8 (2) y martes 9 (3).", true], ["C", "jueves 11 de marzo de 2027.", "Corresponde al quinto día hábil siguiente al recibo. La respuesta debía radicarse dentro del tercer día hábil.", false]]}]}, {"comp": "entidades_territoriales", "rol": "general", "tag": "Entidades territoriales, Bogotá D.C. y CAR · Gestión del riesgo: responsables y consejos", "texto": "Usted es técnico administrativo de la Secretaría de Gobierno de un municipio de sexta categoría del Chocó, donde las lluvias suelen generar desbordamientos. El municipio no tiene oficina de gestión del riesgo y el alcalde pregunta quién es el responsable de los procesos de gestión del riesgo en el municipio, qué papel cumple el consejo municipal de gestión del riesgo y si puede delegar esa responsabilidad en la corporación autónoma regional, que tiene más personal técnico.", "items": [{"id": "ET-177", "niv": 1, "e": "Sobre la responsabilidad de la gestión del riesgo en el municipio, usted le indica al alcalde que", "f": "Ley 1523 de 2012, arts. 13 y 14", "o": [["A", "él es el responsable directo de implementar los procesos de conocimiento, reducción del riesgo y manejo de desastres en su jurisdicción.", "El art. 14 de la Ley 1523 de 2012 establece que el alcalde, como conductor del desarrollo local, es el responsable directo de la implementación de los procesos de gestión del riesgo en el municipio.", true], ["B", "corresponde a la Unidad Nacional para la Gestión del Riesgo de Desastres, porque el municipio no cuenta con una oficina especializada en la materia.", "La UNGRD dirige el sistema nacional y apoya a los territorios, pero no sustituye la responsabilidad del alcalde en el municipio.", false], ["C", "corresponde al gobernador, porque es agente del Presidente en materia de orden público.", "El gobernador responde en el ámbito departamental (art. 13), pero en el municipio el responsable directo es el alcalde (art. 14 de la Ley 1523 de 2012).", false]]}, {"id": "ET-178", "niv": 1, "e": "Sobre el consejo municipal de gestión del riesgo, usted explica que es", "f": "Ley 1523 de 2012, art. 27", "o": [["A", "una dependencia de la alcaldía con planta de personal propia y presupuesto independiente.", "El consejo no es una dependencia con planta ni presupuesto propio; es una instancia de coordinación. Los recursos se manejan en el fondo municipal de gestión del riesgo.", false], ["B", "un organismo de socorro encargado de ejecutar directamente las labores de rescate en las emergencias.", "Las labores de rescate las ejecutan los organismos operativos (bomberos, Defensa Civil, Cruz Roja); el consejo es una instancia de coordinación.", false], ["C", "una instancia de coordinación, asesoría, planeación y seguimiento de la gestión del riesgo.", "El art. 27 de la Ley 1523 de 2012 crea los consejos territoriales como instancias de coordinación, asesoría, planeación y seguimiento para garantizar la efectividad y articulación de los procesos de conocimiento, reducción y manejo.", true]]}, {"id": "ET-179", "niv": 3, "e": "Sobre trasladar la responsabilidad a la corporación autónoma regional, usted aclara que", "f": "Ley 1523 de 2012, art. 31, parágrafos 1 y 3", "o": [["A", "el papel de la CAR es complementario y subsidiario y no exime al alcalde de su responsabilidad primaria, aunque debe apoyar al municipio.", "El parágrafo 1 del art. 31 de la Ley 1523 de 2012 señala que el papel de las CAR es complementario y subsidiario respecto de alcaldías y gobernaciones y no exime a los alcaldes de su responsabilidad primaria; el parágrafo 3 las obliga a apoyar a las entidades territoriales.", true], ["B", "es obligatorio en municipios de sexta categoría, que deben entregar la gestión del riesgo a la CAR.", "La ley no prevé esa transferencia por categoría; la responsabilidad primaria del alcalde se mantiene en todos los municipios.", false], ["C", "es viable mediante convenio interadministrativo, porque la CAR es la máxima autoridad ambiental y asume la gestión del riesgo en toda su jurisdicción.", "La condición de máxima autoridad ambiental no convierte a la CAR en responsable principal de la gestión del riesgo; su papel es complementario.", false]]}]}, {"comp": "comportamental", "rol": "general", "tag": "Competencias comportamentales (Decreto 815 de 2018) · Orientación a resultados", "texto": "Usted trabaja en la Secretaría de Gobierno de una gobernación y es responsable de consolidar, cada trimestre, el informe de avance del programa de dotación a juntas de acción comunal en los 40 municipios del departamento. El informe del trimestre actual debe entregarse el 15 de noviembre al despacho del secretario. A cinco días del plazo, 12 municipios no han enviado su reporte. Además, cada municipio usa un formato distinto y usted invierte tres días por trimestre en unificarlos.", "items": [{"id": "CO-110", "niv": 2, "e": "Frente a los 12 municipios que no han reportado, la conducta que mejor refleja la orientación a resultados es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Orientación a resultados)", "o": [["A", "pedir al secretario una prórroga de dos semanas para presentar el informe con los 40 municipios completos.", "Busca la calidad del informe, pero sacrifica la oportunidad sin haber intentado antes cumplir. La competencia exige cumplir los compromisos dentro de los tiempos establecidos.", false], ["B", "contactar a los enlaces de los 12 municipios, acordar envíos antes del 15 y, si alguno no reporta, entregar en la fecha dejando constancia.", "Refleja la competencia «Orientación a resultados» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en cumplir las funciones y los compromisos de la organización con eficacia, calidad y oportunidad. Corresponde a plantear estrategias para alcanzar los resultados y cumplir con oportunidad según los tiempos de la entidad: actúa sobre la causa del retraso y, a la vez, asegura la entrega dentro del plazo con información verificada.", true], ["C", "entregar el informe en la fecha y completar los datos de los 12 municipios faltantes con estimaciones basadas en lo reportado el trimestre anterior.", "Cumple la fecha, pero presenta datos estimados como si fueran reportes de los municipios, lo que afecta la calidad del informe; además, no gestiona los reportes faltantes en los días disponibles.", false]]}, {"id": "CO-111", "niv": 1, "e": "Al preparar el informe, usted detecta que una cifra que consolidó en el informe del trimestre anterior quedó mal sumada. La conducta más acorde con la orientación a resultados es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Orientación a resultados)", "o": [["A", "pedir al municipio que reportó la información que remita una corrección oficial del dato.", "El error fue de consolidación, no del municipio. Trasladarle la corrección no refleja la conducta de asumir la responsabilidad por los propios resultados.", false], ["B", "corregir el dato en el nuevo informe sin mencionarlo, para no afectar la confianza en la información del programa.", "Corrige, pero oculta el error a quienes ya usaron la cifra anterior. Asumir la responsabilidad por los resultados implica reconocer y corregir de forma visible.", false], ["C", "informar el error a su jefe, corregir la cifra y dejar nota de la corrección en el informe actual, para que quienes usaron el dato lo sepan.", "Refleja la competencia «Orientación a resultados» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en cumplir las funciones y los compromisos de la organización con eficacia, calidad y oportunidad. Refleja la conducta de asumir la responsabilidad por sus resultados: reconoce el error propio, lo corrige y deja trazabilidad para que los usuarios del informe tengan el dato correcto.", true]]}, {"id": "CO-112", "niv": 3, "e": "Respecto de los tres días que invierte cada trimestre en unificar formatos, la conducta que mejor refleja la orientación a resultados es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Orientación a resultados)", "o": [["A", "seguir haciendo la unificación usted mismo, ya que cambiar el formato podría confundir a los municipios y retrasar los reportes.", "Evita un riesgo, pero renuncia a mejorar un proceso ineficiente. La competencia incluye plantear estrategias para superar los resultados y mejorar la productividad.", false], ["B", "solicitar que se asigne un contratista de apoyo para hacer la unificación de los formatos cada trimestre.", "Gestiona recursos, pero mantiene el reproceso y lo traslada a otra persona con un costo adicional. No ataca la causa del problema.", false], ["C", "diseñar un formato único con instrucciones y proponerlo a su jefe para enviarlo a los municipios desde el próximo trimestre.", "Refleja la competencia «Orientación a resultados» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en cumplir las funciones y los compromisos de la organización con eficacia, calidad y oportunidad. Corresponde a plantear estrategias para alcanzar o superar los resultados y gestionar mejoras de productividad: ataca la causa del reproceso y libera tiempo para el análisis.", true]]}]}, {"comp": "comportamental", "rol": "general", "tag": "Competencias comportamentales (Decreto 815 de 2018) · Trabajo en equipo", "texto": "Usted integra el equipo de educación ambiental de una corporación autónoma regional del Caribe, que prepara una jornada sobre ahorro de agua en 12 instituciones educativas. En la última reunión cada integrante asumió una tarea: usted, los contenidos de las charlas; Laura, la logística y los horarios acordados con los colegios; Andrés, la convocatoria; y Mateo, quien llegó hace una semana trasladado de otra dependencia, el registro fotográfico. Mateo no conoce aún a los rectores ni la forma de trabajo del equipo.", "items": [{"id": "CO-122", "niv": 2, "e": "Respecto de Mateo, la conducta que mejor refleja el trabajo en equipo es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Trabajo en equipo)", "o": [["A", "sugerir que Mateo asista a esta jornada solo como observador y asuma tareas desde la siguiente.", "Pospone su integración y desconoce que ya asumió una tarea en el reparto del equipo.", false], ["B", "explicarle cómo funciona el equipo y presentarle a los contactos de los colegios, para que asuma pronto su tarea.", "Refleja la competencia «Trabajo en equipo» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en trabajar con otros de manera integrada y armónica para lograr metas institucionales comunes. Corresponde a integrar a los nuevos miembros y facilitar su proceso de reconocimiento y apropiación de las actividades a cargo del equipo.", true], ["C", "enviarle por correo las actas de las reuniones anteriores y el directorio de colegios para que se ponga al día por su cuenta.", "Le entrega información, pero lo deja solo en su proceso de integración. La conducta asociada pide facilitar activamente el reconocimiento de las actividades del equipo.", false]]}, {"id": "CO-123", "niv": 2, "e": "Andrés propone hacer la convocatoria por redes sociales; usted considera que funcionaría mejor un oficio dirigido a cada rector. La conducta más acorde con el trabajo en equipo es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Trabajo en equipo)", "o": [["A", "exponer sus razones en la reunión, escuchar las de Andrés y acoger lo que el equipo decida, aunque no sea su propuesta.", "Refleja la competencia «Trabajo en equipo» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en trabajar con otros de manera integrada y armónica para lograr metas institucionales comunes. Reúne las conductas de establecer comunicación directa para compartir ideas con respeto y de respetar la diversidad de criterios y opiniones de los miembros del equipo.", true], ["B", "enviar por su cuenta oficios a los rectores como respaldo, por si la convocatoria por redes no funciona.", "Actúa sin considerar el efecto en el trabajo de su compañero y puede duplicar o contradecir la convocatoria. No planifica teniendo en cuenta los objetivos del grupo.", false], ["C", "dejar que Andrés haga la convocatoria a su manera y concentrarse en preparar los contenidos de las charlas de ahorro de agua.", "Respeta la tarea de Andrés, pero se guarda una idea que podría mejorar el resultado común. La competencia incluye compartir ideas de forma directa y respetuosa.", false]]}, {"id": "CO-124", "niv": 3, "e": "Usted quiere ampliar las charlas para incluir el cambio climático, lo que las alargaría de 30 a 60 minutos. La conducta que mejor refleja el trabajo en equipo es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Trabajo en equipo)", "o": [["A", "ajustar los contenidos a 60 minutos, porque los contenidos son su responsabilidad y el cambio mejora la calidad pedagógica.", "Mejora su parte, pero ignora el efecto sobre los horarios ya pactados por Laura con los colegios. No planifica pensando en el objetivo del grupo.", false], ["B", "revisar con Laura si los horarios pactados con los colegios admiten una charla más larga, antes de cambiarla.", "Refleja la competencia «Trabajo en equipo» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en trabajar con otros de manera integrada y armónica para lograr metas institucionales comunes. Corresponde a planificar las propias acciones teniendo en cuenta su repercusión en los objetivos grupales: el cambio afecta la logística que maneja otra compañera y debe acordarse con ella.", true], ["C", "mantener las charlas de 30 minutos y guardar la idea del cambio climático para otra jornada, sin comentarla al equipo.", "Evita riesgos, pero se reserva una idea útil. El trabajo en equipo incluye compartir información e ideas con los demás integrantes.", false]]}]}, {"comp": "comportamental", "rol": "general", "tag": "Competencias comportamentales (Decreto 815 de 2018) · Compromiso con la organización", "texto": "Usted trabaja en un instituto distrital de Bogotá cuyo plan de acción incluye la meta de reducir el consumo de papel en 30 % este año. La política de seguridad de la información de la entidad prohíbe enviar documentos institucionales a correos personales. Esta semana usted tiene atrasados dos informes, y el área de correspondencia está represada por el aumento de solicitudes ciudadanas. Varios compañeros siguen imprimiendo borradores por costumbre.", "items": [{"id": "CO-134", "niv": 2, "e": "Para ponerse al día con los informes, la conducta que mejor refleja el compromiso con la organización es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Compromiso con la organización)", "o": [["A", "enviarse los archivos a su correo personal por esta única vez y terminarlos en casa esa noche, ya que lo importante es cumplir con la entidad.", "Tiene buena intención, pero desconoce una norma institucional de seguridad. La competencia incluye respetar las normas de la organización mientras promueve sus metas.", false], ["B", "entregar los informes en la fecha con la información que alcance a procesar y enviar los anexos la semana siguiente.", "Cumple la fecha formalmente, pero con un producto incompleto y sin haber concertado el ajuste con su jefe.", false], ["C", "cumplir la política de seguridad y acordar con su jefe la prioridad de los informes dentro de la jornada o un acceso remoto autorizado.", "Refleja la competencia «Compromiso con la organización» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en alinear el propio comportamiento con las necesidades, prioridades y metas de la organización. Corresponde a promover el cumplimiento de las metas de la organización respetando sus normas: busca terminar los informes sin poner en riesgo la información.", true]]}, {"id": "CO-135", "niv": 1, "e": "Frente a la meta de reducción de papel, la conducta más acorde con el compromiso con la organización es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Compromiso con la organización)", "o": [["A", "aplicar la meta en su trabajo y recordar a sus compañeros las alternativas digitales, porque la meta es de toda la entidad.", "Refleja la competencia «Compromiso con la organización» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en alinear el propio comportamiento con las necesidades, prioridades y metas de la organización. Refleja la conducta de promover el cumplimiento de las metas de la organización y respetar sus normas, empezando por la propia práctica.", true], ["B", "proponer que la meta se aplace hasta que la entidad compre más escáneres y pantallas para todas sus dependencias y sedes.", "Puede señalar una necesidad real, pero condiciona la meta en lugar de contribuir a cumplirla con los medios disponibles.", false], ["C", "seguir imprimiendo solo los borradores que considera más importantes para revisarlos con mayor detalle en papel.", "Reduce algo el consumo, pero antepone su preferencia de trabajo a una meta institucional.", false]]}, {"id": "CO-136", "niv": 2, "e": "Usted terminó sus tareas del día dos horas antes y sabe que correspondencia está represada. La conducta que mejor refleja el compromiso con la organización es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Compromiso con la organización)", "o": [["A", "pasar a apoyar en correspondencia el resto de la semana y dejar para la siguiente las tareas nuevas que le lleguen.", "Colabora, pero descuida sus propias tareas. La conducta asociada pide colaborar sin desatender lo propio.", false], ["B", "esperar a que su jefe le asigne formalmente apoyar a correspondencia, para no invadir funciones de otra área.", "Es respetuoso, pero no toma la iniciativa de colaborar cuando la organización lo necesita y usted tiene disponibilidad.", false], ["C", "ofrecer a la coordinadora de correspondencia esas dos horas de apoyo, avisando previamente a su jefe.", "Refleja la competencia «Compromiso con la organización» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en alinear el propio comportamiento con las necesidades, prioridades y metas de la organización. Corresponde a tomar la iniciativa de colaborar con otras áreas cuando se requiere, sin descuidar sus tareas: usa un tiempo libre y mantiene informado a su jefe.", true]]}]}, {"comp": "comportamental", "rol": "general", "tag": "Competencias comportamentales (Decreto 815 de 2018) · Adaptación al cambio", "texto": "Usted trabaja en la Secretaría de Planeación de una gobernación. La nueva secretaria de despacho cambió la forma de reportar: en lugar del informe mensual en documento de texto, cada servidor debe cargar sus datos cada semana en un tablero digital. También reasignó tareas: usted deja el seguimiento de proyectos, que hizo durante seis años, y pasa a apoyar la estructuración de nuevos proyectos, actividad que también está prevista en el manual de funciones de su empleo. Además, la dependencia se trasladará a una sede con puestos de trabajo compartidos.", "items": [{"id": "CO-146", "niv": 1, "e": "Frente al nuevo esquema de reporte, la conducta que mejor refleja la adaptación al cambio es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Adaptación al cambio)", "o": [["A", "cargar sus datos en el tablero cada semana desde el inicio, ya que es la forma de reporte que adoptó la secretaría.", "Refleja la competencia «Adaptación al cambio» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en afrontar con flexibilidad las situaciones nuevas y manejar los cambios de forma positiva y constructiva. Corresponde a aceptar y adaptarse con facilidad a las nuevas situaciones y apoyar a la entidad en nuevas formas de trabajo.", true], ["B", "pedir a la secretaria que mantenga el informe mensual, explicando que ha funcionado bien durante años en la dependencia.", "Defiende la práctica anterior en lugar de responder con flexibilidad a la nueva decisión.", false], ["C", "seguir preparando también el informe mensual en documento de texto, por si el nuevo esquema no se mantiene en el tiempo.", "Duplica el trabajo y muestra resistencia a adoptar por completo la nueva forma de reporte.", false]]}, {"id": "CO-147", "niv": 3, "e": "Respecto de la reasignación de tareas, la conducta más acorde con la adaptación al cambio es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Adaptación al cambio)", "o": [["A", "asumir la estructuración y, de manera informal, seguir pendiente de sus antiguos proyectos para que no se pierdan.", "Acepta el cambio solo en parte: mantener el seguimiento informal genera duplicidad y confusión sobre quién es responsable.", false], ["B", "asumir las nuevas tareas, identificar lo que necesita aprender y entregar a su reemplazo el estado de los proyectos.", "Refleja la competencia «Adaptación al cambio» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en afrontar con flexibilidad las situaciones nuevas y manejar los cambios de forma positiva y constructiva. Refleja la conducta de responder al cambio con flexibilidad y cooperar activamente en la implementación de nuevos objetivos y formas de trabajo, facilitando la transición.", true], ["C", "pedir que lo mantengan en el seguimiento de proyectos, donde tiene más experiencia y puede aportar más a la entidad.", "Su argumento es razonable, pero se resiste a una decisión de la entidad que está dentro de las funciones de su empleo.", false]]}, {"id": "CO-148", "niv": 2, "e": "Ante el traslado a una sede con puestos compartidos, la conducta que mejor refleja la adaptación al cambio es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Adaptación al cambio)", "o": [["A", "solicitar un puesto fijo, argumentando que maneja documentos que requieren un lugar estable de trabajo.", "Busca mantener la condición anterior en lugar de ajustarse a la nueva forma de trabajo de la entidad.", false], ["B", "llevarse a casa cada día los documentos físicos de trabajo, para no perderlos al cambiar de puesto.", "Intenta resolver el problema, pero de una forma que pone en riesgo la información institucional.", false], ["C", "organizar su información en las herramientas digitales de la entidad para poder trabajar desde cualquier puesto.", "Refleja la competencia «Adaptación al cambio» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en afrontar con flexibilidad las situaciones nuevas y manejar los cambios de forma positiva y constructiva. Corresponde a aceptar y adaptarse a las nuevas situaciones, ajustando su forma de trabajo a las nuevas condiciones.", true]]}]}, {"comp": "comportamental", "rol": "tecnico", "tag": "Competencias comportamentales (Decreto 815 de 2018) · Nivel técnico · Confiabilidad técnica", "texto": "Usted es técnico operativo de una corporación autónoma regional y realiza aforos de caudal en las captaciones de usuarios con concesión de aguas. El protocolo de aforo de la corporación establece el uso de un molinete y, cuando este no esté disponible o presente fallas, un método volumétrico alternativo. El formato de informe de aforo pide registrar los datos medidos, el método usado y la comparación entre el caudal medido y el caudal concesionado. Hoy, en una de las visitas, el primer aforo dio un valor muy superior a lo habitual para la temporada seca.", "items": [{"id": "CO-182", "niv": 1, "e": "Ante el valor inusual del primer aforo, la conducta que mejor refleja la confiabilidad técnica es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 4, sustituido por el art. 1 del Decreto 815 de 2018 (nivel técnico: Confiabilidad técnica)", "o": [["A", "repetir la medición y revisar el equipo, y registrar ambos valores con una observación sobre la diferencia.", "Refleja la competencia «Confiabilidad técnica» (Decreto 1083 de 2015, art. 2.2.4.8, num. 4, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en contar con los conocimientos técnicos requeridos y aplicarlos a situaciones concretas de trabajo con altos estándares de calidad. Corresponde a aplicar el conocimiento técnico en el desarrollo de sus responsabilidades con altos estándares de calidad: verifica el dato inusual sin alterarlo ni descartarlo, y deja trazabilidad de ambas mediciones.", true], ["B", "ajustar el dato al promedio histórico de la captación en temporada seca.", "Pretende corregir, pero altera la medición sin base técnica.", false], ["C", "registrar el dato tal como salió en el aforo, ya que corresponde a la medición efectivamente realizada.", "Es fiel al registro, pero no aplica el conocimiento técnico para verificar un valor inusual ni para descartar un posible error de medición o de equipo.", false]]}, {"id": "CO-183", "niv": 2, "e": "Al elaborar el informe de aforo, la conducta más acorde con la confiabilidad técnica es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 4, sustituido por el art. 1 del Decreto 815 de 2018 (nivel técnico: Confiabilidad técnica)", "o": [["A", "describir con detalle el recorrido de la visita y dejar los datos y la comparación para que los complete el profesional.", "Aporta contexto, pero omite lo que el formato le pide al técnico.", false], ["B", "consignar las mediciones, la técnica empleada y si el caudal medido excede el autorizado en la concesión.", "Refleja la competencia «Confiabilidad técnica» (Decreto 1083 de 2015, art. 2.2.4.8, num. 4, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en contar con los conocimientos técnicos requeridos y aplicarlos a situaciones concretas de trabajo con altos estándares de calidad. Refleja la conducta de emitir conceptos y juicios técnicos claros, precisos, pertinentes y ajustados a los lineamientos de la organización.", true], ["C", "anotar solo la conclusión sobre si hay exceso y anexar los datos sin procesar para que se revisen después.", "Da una conclusión, pero sin el método ni la comparación sustentada que exige el formato.", false]]}, {"id": "CO-184", "niv": 3, "e": "En la siguiente visita, el molinete presenta una falla. La conducta que mejor refleja la confiabilidad técnica es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 4, sustituido por el art. 1 del Decreto 815 de 2018 (nivel técnico: Confiabilidad técnica)", "o": [["A", "medir con el molinete averiado y anotar en el informe una observación sobre la falla del equipo.", "Deja constancia, pero produce un dato poco confiable.", false], ["B", "medir por el método volumétrico y anotar en el informe que no se usó el molinete y la razón.", "Refleja la competencia «Confiabilidad técnica» (Decreto 1083 de 2015, art. 2.2.4.8, num. 4, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en contar con los conocimientos técnicos requeridos y aplicarlos a situaciones concretas de trabajo con altos estándares de calidad. Corresponde a resolver problemas utilizando los conocimientos técnicos de su especialidad, ajustándose a los lineamientos organizacionales.", true], ["C", "suspender la visita y reprogramarla para cuando el equipo esté reparado, de modo que la medición sea comparable.", "Busca comparabilidad, pero no aprovecha el método alternativo que el protocolo prevé para esta situación.", false]]}]}, {"comp": "comportamental", "rol": "tecnico", "tag": "Competencias comportamentales (Decreto 815 de 2018) · Nivel técnico · Responsabilidad", "texto": "Usted es técnico administrativo de la Secretaría de Tránsito de un municipio de primera categoría y digita en el sistema de información las órdenes de comparendo que llegan en físico. Tiene una pila de 300 órdenes con distintas fechas límite de cargue. Al revisar sus registros de la semana anterior, encuentra que digitó mal la placa de un vehículo, lo que asoció un comparendo a un ciudadano que no tuvo relación con la infracción. Según el procedimiento de la secretaría, toda corrección de un registro ya cargado debe reportarse por el canal establecido para ese fin.", "items": [{"id": "CO-194", "niv": 1, "e": "Para organizar la digitación de las 300 órdenes, la conducta que mejor refleja la responsabilidad es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 4, sustituido por el art. 1 del Decreto 815 de 2018 (nivel técnico: Responsabilidad)", "o": [["A", "digitarlas en el orden en que están en la pila, que corresponde a la secuencia de recibo.", "Es ordenado, pero ignora las fechas límite y puede dejar vencer algunas.", false], ["B", "empezar por las órdenes más legibles y sencillas, para avanzar más rápido en el número de registros.", "Aumenta el ritmo inicial, pero no prioriza según el riesgo de vencimiento.", false], ["C", "ordenarlas por fecha límite y digitar primero las más próximas a vencer, para que ninguna quede por fuera.", "Refleja la competencia «Responsabilidad» (Decreto 1083 de 2015, art. 2.2.4.8, num. 4, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en conocer la magnitud de las propias acciones y la forma de afrontarlas. Corresponde a utilizar el tiempo de manera eficiente y cumplir con eficiencia la tarea encomendada.", true]]}, {"id": "CO-195", "niv": 2, "e": "Para mantener la calidad de la digitación, la conducta más acorde con la responsabilidad es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 4, sustituido por el art. 1 del Decreto 815 de 2018 (nivel técnico: Responsabilidad)", "o": [["A", "verificar cada registro contra la orden física antes de guardarlo, aunque el proceso tome un poco más de tiempo.", "Refleja la competencia «Responsabilidad» (Decreto 1083 de 2015, art. 2.2.4.8, num. 4, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en conocer la magnitud de las propias acciones y la forma de afrontarlas. Refleja la conducta de realizar sus tareas con criterios de calidad, eficiencia y efectividad.", true], ["B", "digitar rápido para cumplir el volumen asignado y corregir los errores cuando los ciudadanos presenten sus reclamaciones.", "Prioriza el volumen y traslada al ciudadano la detección de los errores.", false], ["C", "pedir a un compañero que revise al final del día todos los registros que usted haya digitado.", "Agrega un control, pero traslada a otro la verificación que es parte de su propia tarea.", false]]}, {"id": "CO-196", "niv": 2, "e": "Frente al error en la placa digitada la semana anterior, la conducta que mejor refleja la responsabilidad es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 4, sustituido por el art. 1 del Decreto 815 de 2018 (nivel técnico: Responsabilidad)", "o": [["A", "corregir directamente la placa en el sistema de información, ya que se trata de un simple error de digitación de su parte.", "Corrige, pero sin el reporte que permite dejar trazabilidad y revisar los efectos sobre el ciudadano afectado.", false], ["B", "esperar a que el ciudadano afectado presente su reclamación, para corregirlo dentro de ese trámite.", "Conoce el error y aun así deja que el ciudadano soporte sus efectos.", false], ["C", "reportar de inmediato la placa errada por la vía que fija la secretaría para corregir registros.", "Refleja la competencia «Responsabilidad» (Decreto 1083 de 2015, art. 2.2.4.8, num. 4, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en conocer la magnitud de las propias acciones y la forma de afrontarlas. Corresponde a conocer la magnitud de sus acciones y la forma de afrontarlas: reconoce el error y activa su corrección formal.", true]]}]}];
const CFG = {"titulo": "Simulacro 1 · Nivel técnico · CNSC Empleo Público", "modo": "simulacro", "minutos": 165, "componentes": {"estado_constitucion": "Estado y Constitución", "empleo_publico": "Empleo público, carrera y régimen disciplinario", "atencion_procedimiento": "Atención al ciudadano y procedimiento administrativo", "gestion_publica": "Gestión pública, MIPG, contratación y documentos", "entidades_territoriales": "Entidades territoriales, Bogotá D.C. y CAR", "comportamental": "Competencias comportamentales (Decreto 815 de 2018)"}, "niveles": {"1": "Básico", "2": "Intermedio", "3": "Avanzado"}, "roles": {"general": "Todos los niveles", "asistencial": "Nivel asistencial", "tecnico": "Nivel técnico", "profesional": "Nivel profesional"}, "clave": "tecnico-01.html"};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY = 'sim-cnsc:' + CFG.clave;
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}
function save(){try{localStorage.setItem(KEY, JSON.stringify(ST))}catch(e){}}
let ST = load();
ST.r = ST.r || {};
$('#tit').textContent = CFG.titulo;
const ITEMS = [];
DATA.forEach(c => c.items.forEach(it => { it.caso = c; ITEMS.push(it); }));

function justHTML(it){
  return '<div class="just">' + it.o.map(o => `<div><b>${o[0]}.</b> <span class="${o[3]?'okt':'not'}">${o[3]?'Es correcta.':'Es incorrecta.'}</span> ${esc(o[2])}</div>`).join('') +
    `<div class="src">Referencia: ${esc(it.f)}</div></div>`;
}
function itemHTML(it, n, mode){
  const r = ST.r[it.id];
  const reveal = mode === 'review' || (CFG.modo === 'practica' && r);
  let h = `<div class="item" id="i-${it.id}"><p class="enun"><span class="n">${n}.</span> <span class="niv">${CFG.niveles[it.niv]}</span> ${esc(it.e)}</p>`;
  it.o.forEach(o => {
    let cls = '';
    if (reveal) { if (o[3]) cls = 'ok'; else if (r === o[0]) cls = 'no'; }
    else if (r === o[0]) cls = 'sel';
    h += `<button class="op ${cls}" data-id="${it.id}" data-l="${o[0]}" ${reveal?'disabled':''}><span class="l">${o[0]}.</span><span>${esc(o[1])}</span></button>`;
  });
  if (reveal) {
    if (mode === 'review') h += `<div class="${r===keyOf(it)?'res-ok':'res-no'}" style="font-size:14px;margin-top:4px">${r ? (r===keyOf(it)?'Respondiste ' + r + ': correcto.':'Respondiste ' + r + '. La respuesta correcta es ' + keyOf(it) + '.') : 'Sin responder. La respuesta correcta es ' + keyOf(it) + '.'}</div>`;
    h += justHTML(it);
  }
  return h + '</div>';
}
const keyOf = it => it.o.find(o => o[3])[0];

function renderList(list, mode){
  let h = '', last = null, n = 0;
  list.forEach(it => {
    n++;
    if (it.caso !== last) { last = it.caso; h += `<div class="caso"><div class="tag">${esc(it.caso.tag)}</div><p>${esc(it.caso.texto)}</p></div>`; }
    h += itemHTML(it, n, mode);
  });
  return h;
}

// ---------- PRÁCTICA ----------
let LIST = [];
let FILTRO = ST.f || {comp:'', niv:'', rol:''};
function practica(){
  const comps = Object.entries(CFG.componentes).map(([k,v]) => `<option value="${k}" ${FILTRO.comp===k?'selected':''}>${esc(v)}</option>`).join('');
  const nivs = Object.entries(CFG.niveles).map(([k,v]) => `<option value="${k}" ${FILTRO.niv===k?'selected':''}>${esc(v)}</option>`).join('');
  const list = ITEMS.filter(it => (!FILTRO.comp || it.caso.comp===FILTRO.comp) && (!FILTRO.niv || String(it.niv)===FILTRO.niv) && (!FILTRO.rol || it.caso.rol===FILTRO.rol || it.caso.rol==='general'));
  const resp = list.filter(it => ST.r[it.id]); const ok = resp.filter(it => ST.r[it.id]===keyOf(it));
  $('#main').innerHTML = `<div class="panel"><p style="margin-top:0">Elige un tema, tu nivel de empleo y la dificultad. Al responder verás de inmediato si acertaste y la explicación de cada opción.</p>
  <div class="row"><select id="fc"><option value="">Todos los temas</option>${comps}</select>
  <select id="fn"><option value="">Todas las dificultades</option>${nivs}</select>
  <select id="fr"><option value="">Todos los niveles de empleo</option>${['asistencial','tecnico','profesional'].map(k => `<option value="${k}" ${FILTRO.rol===k?'selected':''}>${esc(CFG.roles[k])} (y temas comunes)</option>`).join('')}</select>
  <button class="btn sec" id="borrar">Borrar mis respuestas</button></div>
  <p class="stat" id="pst" style="margin-bottom:0">${list.length} preguntas · respondidas ${resp.length} · aciertos ${ok.length}${resp.length? ' (' + Math.round(100*ok.length/resp.length) + ' %)':''}</p></div>` + renderList(list, 'practica');
  $('#prog').textContent = `${ok.length}/${resp.length} aciertos`;
  ['fc','fn','fr'].forEach((id,i) => $('#'+id).onchange = e => { FILTRO[['comp','niv','rol'][i]] = e.target.value; ST.f = FILTRO; save(); practica(); });
  LIST = list;
  $('#borrar').onclick = () => { list.forEach(it => delete ST.r[it.id]); save(); practica(); };
}

// ---------- SIMULACRO ----------
let tick = null;
function inicio(){
  const n = ITEMS.length, cnt = {};
  ITEMS.forEach(it => cnt[it.caso.comp] = (cnt[it.caso.comp]||0) + 1);
  const h = Math.floor(CFG.minutos/60), m = CFG.minutos%60;
  $('#main').innerHTML = `<div class="panel"><h2 style="margin-top:0;color:var(--pri)">Instrucciones</h2>
  <p>Este simulacro tiene <b>${n} preguntas</b> en el formato de Prueba de Juicio Situacional: un caso, enunciados que se completan y tres opciones con una sola respuesta correcta.</p>
  <table>${Object.entries(cnt).map(([k,v]) => `<tr><td>${esc(CFG.componentes[k])}</td><td class="r">${v}</td></tr>`).join('')}</table>
  <p>Tiempo sugerido: <b>${h ? h + ' h ' : ''}${m ? m + ' min' : ''}</b> (unos ${Math.round(CFG.minutos*60/n/6)/10} minutos por pregunta). Cuando se acaba el tiempo puedes seguir, pero el cronómetro lo indica.</p>
  <p>Tus respuestas se guardan en este navegador. Al terminar verás tu puntaje por componente y por dificultad, y la explicación de cada pregunta.</p>
  <button class="btn" id="go">${ST.t0 ? 'Continuar el simulacro' : 'Comenzar'}</button></div>`;
  $('#prog').textContent = `${n} preguntas`;
  $('#go').onclick = () => { if (!ST.t0) { ST.t0 = Date.now(); save(); } examen(); };
}
function reloj(){
  const rest = CFG.minutos*60 - Math.floor((Date.now() - ST.t0)/1000);
  const a = Math.abs(rest), hh = Math.floor(a/3600), mm = Math.floor(a%3600/60), ss = a%60;
  const t = (rest < 0 ? '+' : '') + (hh ? hh + ':' : '') + String(mm).padStart(2,'0') + ':' + String(ss).padStart(2,'0');
  $('#timer').textContent = rest < 0 ? 'Tiempo cumplido ' + t : '⏱ ' + t;
  $('#timer').classList.toggle('low', rest < 600);
}
function examen(){
  $('#main').innerHTML = renderList(ITEMS, 'examen') + `<div class="panel"><button class="btn" id="fin">Terminar y calificar</button></div>`;
  progreso(); reloj(); clearInterval(tick); tick = setInterval(reloj, 1000);
  $('#fin').onclick = () => {
    const faltan = ITEMS.length - Object.keys(ST.r).filter(k => ITEMS.some(i => i.id===k)).length;
    $('#mtxt').textContent = faltan ? `Te faltan ${faltan} preguntas por responder. ¿Quieres calificar de todos modos?` : '¿Quieres terminar y ver tu calificación?';
    $('#modal').classList.remove('hide');
  };
}
function progreso(){
  const r = ITEMS.filter(it => ST.r[it.id]).length;
  $('#prog').textContent = `Respondidas ${r}/${ITEMS.length}`;
}
$('#mno').onclick = () => $('#modal').classList.add('hide');
$('#msi').onclick = () => { $('#modal').classList.add('hide'); ST.fin = Date.now(); save(); resultados(); };
function resultados(){
  clearInterval(tick);
  const ok = ITEMS.filter(it => ST.r[it.id] === keyOf(it)).length;
  const pct = Math.round(1000*ok/ITEMS.length)/10;
  const g = (fn, lab) => { const m = {}; ITEMS.forEach(it => { const k = fn(it); m[k] = m[k] || [0,0]; m[k][1]++; if (ST.r[it.id]===keyOf(it)) m[k][0]++; });
    return Object.entries(m).map(([k,v]) => `<tr><td>${esc(lab(k))}</td><td class="r">${v[0]}/${v[1]}</td><td class="r">${Math.round(100*v[0]/v[1])} %</td></tr>`).join(''); };
  const mins = Math.round(((ST.fin||Date.now()) - ST.t0)/60000);
  $('#timer').textContent = `Tiempo usado: ${Math.floor(mins/60) ? Math.floor(mins/60) + ' h ' : ''}${mins%60} min`;
  $('#prog').textContent = `${ok}/${ITEMS.length} aciertos`;
  $('#main').innerHTML = `<div class="panel"><div class="big">${String(pct).replace('.',',')} %</div>
  <p style="margin-top:4px">${ok} de ${ITEMS.length} respuestas correctas. ${pct >= 75 ? 'Muy buen resultado: repasa las explicaciones de tus errores para afianzarlo.' : pct >= 65 ? 'Vas bien, pero con poco margen: refuerza los componentes con menor porcentaje.' : 'Todavía no estás en zona segura: practica por tema los componentes con menor porcentaje.'}</p>
  <p class="aviso">Referencia: en los procesos Distrito Capital 7, Territorial 14 y CAR, la prueba de competencias funcionales es eliminatoria con mínimo de 65 puntos, y la comportamental es clasificatoria. Este porcentaje de aciertos es una guía de preparación; la CNSC calcula su puntaje con su propia escala, comparando con los demás aspirantes al mismo empleo.</p>
  <h3>Por componente</h3><table>${g(it => it.caso.comp, k => CFG.componentes[k])}</table>
  <h3>Por dificultad</h3><table>${g(it => it.niv, k => CFG.niveles[k])}</table>
  <div class="row" style="margin-top:14px"><button class="btn" id="solo">Ver solo mis errores</button><button class="btn sec" id="todas">Ver todas</button><button class="btn sec" id="otra">Reiniciar el simulacro</button></div></div><div id="rev"></div>`;
  const rev = errs => { const l = errs ? ITEMS.filter(it => ST.r[it.id] !== keyOf(it)) : ITEMS; $('#rev').innerHTML = renderList(l, 'review'); };
  rev(true);
  $('#solo').onclick = () => rev(true); $('#todas').onclick = () => rev(false);
  $('#otra').onclick = () => { ST = {r:{}}; save(); inicio(); window.scrollTo(0,0); };
}

document.addEventListener('click', e => {
  const b = e.target.closest('button.op'); if (!b || b.disabled) return;
  ST.r[b.dataset.id] = b.dataset.l; save();
  const it = ITEMS.find(i => i.id === b.dataset.id);
  const n = b.closest('.item').querySelector('.n').textContent.replace('.','');
  b.closest('.item').outerHTML = itemHTML(it, n, CFG.modo === 'practica' ? 'practica' : 'examen');
  if (CFG.modo === 'practica') { const resp = LIST.filter(i => ST.r[i.id]); const ok = resp.filter(i => ST.r[i.id]===keyOf(i)).length; $('#prog').textContent = `${ok}/${resp.length} aciertos`; $('#pst').textContent = `${LIST.length} preguntas · respondidas ${resp.length} · aciertos ${ok} (${Math.round(100*ok/resp.length)} %)`; }
  else progreso();
});

if (CFG.modo === 'practica') practica();
else if (ST.fin) resultados();
else if (ST.t0) examen();
else inicio();
</script>
</body>
</html>
