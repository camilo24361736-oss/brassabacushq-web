<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulacro 1 · Nivel técnico · CNSC Empleo Público</title>
<style>
:root{--bg:#f6f8fb;--card:#fff;--ink:#1d2433;--mute:#5a6478;--line:#dbe1ea;--pri:#0b3d6e;--pri2:#1660a8;--ok:#0d6b3a;--okbg:#e6f4ec;--no:#9b1c1c;--nobg:#fbeaea;--sel:#e8f0fa}
@media (prefers-color-scheme: dark){:root{--bg:#10151d;--card:#18202b;--ink:#e6ebf2;--mute:#9aa6b8;--line:#2a3545;--pri:#7fb3ea;--pri2:#9cc6f2;--ok:#7fd3a3;--okbg:#16301f;--no:#f2a3a3;--nobg:#3a1c1c;--sel:#1e2d40}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px}
.hwrap{max-width:860px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
h1{font-size:17px;margin:0;color:var(--pri)}
.stat{font-size:14px;color:var(--mute)}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--pri)}
.timer.low{color:var(--no)}
main{max-width:860px;margin:0 auto;padding:16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin:0 0 16px}
.caso{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--pri);border-radius:10px;padding:14px 16px;margin:22px 0 10px}
.tag{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--pri);font-weight:700}
.caso p{margin:6px 0 0;white-space:pre-line}
.item{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0}
.enun{margin:0 0 8px}
.n{font-weight:700;color:var(--pri)}
.niv{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-right:4px;white-space:nowrap}
.op{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:6px 0;cursor:pointer;background:transparent;width:100%;text-align:left;color:inherit;font:inherit}
.op:hover{border-color:var(--pri2)}
.op .l{font-weight:700;min-width:20px}
.op.sel{background:var(--sel);border-color:var(--pri2)}
.op.ok{background:var(--okbg);border-color:var(--ok)}
.op.no{background:var(--nobg);border-color:var(--no)}
.op[disabled]{cursor:default}
.just{font-size:14px;margin:8px 0 0;padding:8px 10px;border-top:1px dashed var(--line)}
.just div{margin:4px 0}
.just .okt{color:var(--ok);font-weight:700}
.just .not{color:var(--no);font-weight:700}
.src{font-size:13px;color:var(--mute);margin-top:6px}
button.btn{background:var(--pri);color:var(--card);border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer}
button.btn.sec{background:transparent;color:var(--pri);border:1px solid var(--pri)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
select{font:inherit;padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);max-width:100%}
table{border-collapse:collapse;width:100%;font-size:15px}
td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
.big{font-size:40px;font-weight:800;color:var(--pri);line-height:1.1}
.aviso{font-size:13px;color:var(--mute)}
.hide{display:none !important}
.res-ok{color:var(--ok);font-weight:700}.res-no{color:var(--no);font-weight:700}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal .panel{max-width:420px}
footer{max-width:860px;margin:0 auto;padding:8px 16px 40px;font-size:12px;color:var(--mute)}
</style>
</head>
<body>
<header><div class="hwrap"><h1 id="tit"></h1><div class="row stat"><span id="prog"></span><span id="timer" class="timer"></span></div></div></header>
<main id="main"></main>
<div id="modal" class="modal hide"><div class="panel"><p id="mtxt"></p><div class="row"><button class="btn" id="msi">Sí, calificar</button><button class="btn sec" id="mno">Seguir respondiendo</button></div></div></div>
<footer><a href="./" style="color:var(--pri);font-weight:600">← Volver al menú</a><br><br>Material de preparación independiente. No está afiliado a la Comisión Nacional del Servicio Civil (CNSC) ni a ninguna entidad pública, y no contiene preguntas reales de la prueba.</footer>
<script>
const DATA = [{"comp": "estado_constitucion", "rol": "general", "tag": "Estado y Constitución · Principios fundamentales y Estado social de derecho", "texto": "Usted es técnico administrativo de la Secretaría de Gobierno de un municipio de sexta categoría. En una reunión de equipo, el coordinador afirma que «si no hacemos nada, nadie nos puede sancionar: los servidores, igual que cualquier particular, solo responden si violan una ley expresa». En la misma reunión se revisa un decreto municipal que, para inscribirse en un programa de mercados solidarios, exige certificado de pertenencia a una iglesia. Además, un concejal pide explicar a la comunidad por qué el municipio puede diseñar sus propios programas sociales sin que cada uno sea aprobado por la Nación.", "items": [{"id": "EC-101", "niv": 1, "e": "Frente a la afirmación del coordinador sobre la responsabilidad de los servidores públicos, lo correcto es aclarar que estos responden", "f": "Constitución Política, art. 6", "o": [["A", "únicamente cuando su omisión cause un daño patrimonial cuantificado por la contraloría.", "El daño patrimonial es un elemento de la responsabilidad fiscal, no un requisito general de la responsabilidad de los servidores. El artículo 6 hace responsables a los servidores por la sola omisión en el ejercicio de sus funciones.", false], ["B", "en los mismos términos que los particulares, porque la Constitución consagra la igualdad de todos ante la ley y no distingue entre ellos.", "Confunde la igualdad del artículo 13 con el régimen de responsabilidad. El artículo 6 establece expresamente un régimen más exigente para los servidores, que incluye la omisión y la extralimitación.", false], ["C", "por infringir la Constitución y las leyes, y también por omisión o extralimitación en el ejercicio de sus funciones.", "El artículo 6 de la Constitución distingue: los particulares responden solo por infringir la Constitución y las leyes, mientras que los servidores públicos responden por esa misma causa y, además, por omitir sus funciones o excederse en ellas. La inacción también genera responsabilidad.", true]]}, {"id": "EC-102", "niv": 1, "e": "Sobre la incompatibilidad entre el decreto municipal que exige pertenecer a una iglesia y la Constitución, la regla constitucional aplicable indica que", "f": "Constitución Política, arts. 4 y 13", "o": [["A", "deben aplicarse las disposiciones constitucionales, por ser la Constitución norma de normas.", "El artículo 4 de la Constitución establece que la Constitución es norma de normas y que, ante cualquier incompatibilidad con la ley u otra norma jurídica, se aplican las disposiciones constitucionales. Exigir pertenecer a una iglesia discrimina por religión (art. 13).", true], ["B", "prevalece el decreto, por ser una norma especial y posterior expedida por la autoridad local competente.", "Los criterios de especialidad y posterioridad resuelven conflictos entre normas del mismo nivel. Frente a la Constitución no operan: el artículo 4 dispone que en caso de incompatibilidad se aplican las disposiciones constitucionales.", false], ["C", "el decreto debe aplicarse hasta que el concejo municipal lo derogue mediante acuerdo.", "El concejo no deroga los decretos del alcalde como mecanismo para resolver su incompatibilidad con la Constitución. La regla del artículo 4 es la prevalencia directa de la Constitución sobre cualquier norma incompatible.", false]]}, {"id": "EC-103", "niv": 2, "e": "Para responder al concejal, el fundamento constitucional que permite al municipio diseñar sus propios programas es que Colombia está organizada como", "f": "Constitución Política, art. 1", "o": [["A", "un Estado federal, en el que cada municipio ejerce soberanía propia sobre los asuntos sociales.", "Colombia no es un Estado federal. El artículo 1 la define como república unitaria; los municipios tienen autonomía, pero no soberanía, que reside exclusivamente en el pueblo (art. 3).", false], ["B", "una república unitaria y descentralizada, con autonomía de sus entidades territoriales.", "El artículo 1 de la Constitución define a Colombia como Estado social de derecho organizado en forma de república unitaria, descentralizada y con autonomía de sus entidades territoriales. Esa autonomía permite al municipio gestionar sus propios programas dentro de la Constitución y la ley.", true], ["C", "una república centralizada, en la que la Nación define y aprueba todos los programas sociales locales.", "El artículo 1 describe a Colombia como república descentralizada y con autonomía de sus entidades territoriales, lo que contradice que la Nación deba aprobar cada programa local.", false]]}]}, {"comp": "estado_constitucion", "rol": "general", "tag": "Estado y Constitución · Habeas corpus", "texto": "Usted es auxiliar administrativo de la Secretaría de Gobierno de un municipio de quinta categoría. Un domingo en la noche llega la madre de un joven que fue retenido el viernes en una estación de policía. Según ella, nadie le ha explicado el motivo, no ha sido puesto a disposición de ningún juez y no tiene abogado. La señora pregunta si puede presentar una tutela, cuánto se tardará la decisión y ante quién debe acudir, pues no sabe redactar escritos ni tiene recursos para un apoderado.", "items": [{"id": "EC-122", "niv": 1, "e": "Para proteger la libertad del joven, el mecanismo que debe indicarse a la madre es", "f": "Ley 1095 de 2006, art. 1; Decreto 2591 de 1991, art. 6, num. 2", "o": [["A", "la acción de tutela, porque la libertad personal es un derecho fundamental.", "Aunque la libertad es fundamental, el numeral 2 del artículo 6 del Decreto 2591 dispone que la tutela no procede cuando el derecho puede protegerse con el habeas corpus.", false], ["B", "el habeas corpus, que protege la libertad de quien es privado de ella con violación de sus garantías.", "El artículo 1 de la Ley 1095 de 2006 define el habeas corpus como derecho fundamental y acción constitucional que tutela la libertad personal en esos eventos, y no se suspende ni siquiera en estados de excepción.", true], ["C", "una queja ante la personería municipal, que como agente del Ministerio Público puede ordenar la libertad inmediata del joven.", "La personería puede vigilar la actuación policial, pero no ordena libertades. Solo la autoridad judicial que conoce del habeas corpus puede ordenar la liberación.", false]]}, {"id": "EC-123", "niv": 2, "e": "Sobre el término para decidir, debe informarse a la madre que la solicitud se resuelve en", "f": "Ley 1095 de 2006, art. 3", "o": [["A", "un término de treinta y seis horas.", "El artículo 3 de la Ley 1095 de 2006 garantiza invocar el habeas corpus ante cualquier autoridad judicial para que sea resuelto en un término de treinta y seis horas, sin que se suspenda por festivos o vacancia judicial.", true], ["B", "un término de cuarenta y ocho horas.", "Cuarenta y ocho horas es el plazo máximo de cumplimiento de un fallo de tutela (Decreto 2591, art. 29). El habeas corpus se resuelve en treinta y seis horas.", false], ["C", "un término de diez días.", "Diez días es el término para fallar una tutela. El habeas corpus, por proteger la libertad, tiene un término mucho más corto: treinta y seis horas.", false]]}, {"id": "EC-124", "niv": 2, "e": "Respecto de ante quién y cómo presentar la solicitud, lo correcto es orientarla a que", "f": "Ley 1095 de 2006, arts. 2, 3 y 4", "o": [["A", "espere al lunes para presentarla con abogado ante el juez penal del circuito.", "La ley garantiza que el trámite no se suspenda por festivos (art. 3), que no se requiera apoderado (art. 4) y que cualquier juez sea competente (art. 2).", false], ["B", "la presente por escrito ante el inspector de policía, que es la autoridad administrativa competente en el municipio.", "El habeas corpus no lo resuelven autoridades administrativas. Son competentes los jueces y tribunales de la Rama Judicial (art. 2).", false], ["C", "la presente ante cualquier juez o tribunal de la Rama Judicial, aun verbalmente y sin apoderado.", "Son competentes todos los jueces y tribunales de la Rama Judicial (art. 2); la acción puede invocarse por terceros sin mandato (art. 3) y ejercerse sin formalidad, incluso verbalmente y sin apoderado (art. 4).", true]]}]}, {"comp": "estado_constitucion", "rol": "general", "tag": "Estado y Constitución · Defensoría del Pueblo", "texto": "Usted es técnico administrativo de la Secretaría de Gobierno de una gobernación de frontera que atiende población migrante. Un grupo de familias pide ayuda porque una entidad de salud les niega atención y quieren que alguien presente una tutela en su nombre. Uno de los migrantes, además, fue vinculado a un proceso penal y no tiene recursos para pagar un abogado. En una mesa técnica, un contratista afirma que el Defensor del Pueblo es elegido por el Senado, igual que el Procurador.", "items": [{"id": "EC-134", "niv": 1, "e": "Para que la tutela sea presentada en nombre de las familias que lo soliciten, usted puede orientarlas a acudir a", "f": "Decreto 2591 de 1991, art. 46; Constitución Política, art. 282, num. 3", "o": [["A", "la Defensoría del Pueblo, que puede interponer tutelas en nombre de cualquier persona que se lo solicite.", "El artículo 46 del Decreto 2591 de 1991 faculta al Defensor del Pueblo para interponer la tutela en nombre de cualquier persona que se lo solicite o que esté en situación de desamparo, y el numeral 3 del artículo 282 de la Constitución le asigna esa función.", true], ["B", "la Registraduría Nacional, porque primero deben regularizar su documento de identidad.", "La protección de derechos fundamentales no depende de la regularización migratoria ni corresponde a la Registraduría. La Defensoría puede presentar la tutela en su nombre.", false], ["C", "la Contraloría departamental, que vigila los recursos de salud del departamento.", "La contraloría ejerce control fiscal; no está facultada para interponer tutelas en nombre de las personas.", false]]}, {"id": "EC-135", "niv": 1, "e": "Para el migrante procesado penalmente que no tiene recursos, la orientación correcta es acudir a", "f": "Constitución Política, art. 282, num. 4", "o": [["A", "la personería municipal, que le asignará como defensor a uno de los abogados de su planta.", "El personero interviene en los procesos penales como agente del Ministerio Público, no como defensor del procesado. La defensoría pública la organiza y dirige el Defensor del Pueblo.", false], ["B", "la Defensoría del Pueblo, que organiza y dirige la defensoría pública.", "El numeral 4 del artículo 282 de la Constitución asigna al Defensor del Pueblo la función de organizar y dirigir la defensoría pública en los términos que señale la ley.", true], ["C", "la Fiscalía General de la Nación, que debe designarle un fiscal como defensor de oficio.", "La Fiscalía es la parte acusadora en el proceso penal; no puede asumir la defensa del procesado.", false]]}, {"id": "EC-136", "niv": 2, "e": "Frente a la afirmación del contratista sobre la elección del Defensor del Pueblo, lo correcto es aclarar que lo elige", "f": "Constitución Política, arts. 276 y 281", "o": [["A", "el Congreso en pleno, de lista de elegibles conformada por convocatoria pública.", "Esa es la forma de elección del Contralor General de la República (art. 267). El Defensor lo elige la Cámara de Representantes.", false], ["B", "el Senado de la República, de terna integrada por el Presidente, la Corte Suprema y el Consejo de Estado.", "Esa es la forma de elección del Procurador General de la Nación (art. 276), no la del Defensor del Pueblo.", false], ["C", "la Cámara de Representantes, de terna elaborada por el Presidente de la República.", "El artículo 281 de la Constitución, modificado por el Acto Legislativo 2 de 2015, dispone que el Defensor del Pueblo ejerce sus funciones de manera autónoma y es elegido por la Cámara de Representantes para un periodo de cuatro años, de terna elaborada por el Presidente de la República.", true]]}]}, {"comp": "estado_constitucion", "rol": "general", "tag": "Estado y Constitución · Delegación de funciones", "texto": "Usted es profesional universitario de la Secretaría Jurídica de un municipio de primera categoría. El alcalde quiere que el secretario de Gobierno asuma la función de otorgar los permisos para la realización de espectáculos públicos en el municipio, que hoy firma el propio alcalde, y le pide preparar el acto correspondiente. El secretario de Gobierno, por su parte, ya anunció que, una vez reciba la función, la trasladará a un profesional universitario de su despacho para agilizar los trámites. Un asesor sostiene que, si algo sale mal, el alcalde seguirá respondiendo por todo.", "items": [{"id": "EC-149", "niv": 1, "e": "Para que el secretario de Gobierno asuma válidamente la función, el acto de delegación debe", "f": "Ley 489 de 1998, art. 10", "o": [["A", "constar por escrito y determinar la autoridad delegataria y las funciones o asuntos específicos que se transfieren.", "El artículo 10 de la Ley 489 de 1998 dispone que el acto de delegación siempre será escrito y en él se determinarán la autoridad delegataria y las funciones o asuntos específicos cuya atención y decisión se transfieren.", true], ["B", "ser aprobado previamente por el concejo municipal mediante acuerdo.", "La delegación es un acto de la autoridad delegante. La Ley 489 no exige un acuerdo del concejo para que el alcalde delegue funciones en sus colaboradores.", false], ["C", "comunicarse verbalmente en consejo de gobierno, dejando constancia en el acta de la reunión firmada por los asistentes.", "La delegación no puede ser verbal: el artículo 10 de la Ley 489 exige que el acto sea siempre escrito e identifique al delegatario y las funciones.", false]]}, {"id": "EC-150", "niv": 3, "e": "Frente a la afirmación del asesor sobre la responsabilidad, lo correcto es explicar que la delegación", "f": "Constitución Política, art. 211; Ley 489 de 1998, arts. 10 y 12; Corte Constitucional, Sentencia C-372 de 2002", "o": [["A", "traslada la responsabilidad al delegatario de forma definitiva, sin que el alcalde pueda volver a ejercer la función ni revisar los actos expedidos.", "La delegación no es definitiva: el artículo 12 de la Ley 489 permite a la autoridad delegante reasumir en cualquier tiempo la competencia y revisar los actos del delegatario.", false], ["B", "en principio exime al alcalde, que conserva deberes de dirección y vigilancia y puede reformar o revocar los actos del delegatario.", "El artículo 211 de la Constitución dispone que la delegación exime de responsabilidad al delegante, la cual corresponde al delegatario, cuyos actos puede siempre reformar o revocar aquel, reasumiendo la responsabilidad. La Corte Constitucional (C-372 de 2002) precisó que el delegante no responde por los actos del delegatario, pero sí por sus propios deberes de dirección, orientación, instrucción y seguimiento; el artículo 10 de la Ley 489 le exige informarse del desarrollo de la delegación y el artículo 12 le permite reasumir la competencia.", true], ["C", "no cambia nada, porque el alcalde sigue respondiendo por todos los actos del secretario delegatario.", "El artículo 211 de la Constitución dispone lo contrario: la delegación exime de responsabilidad al delegante y la traslada al delegatario, sin perjuicio de que el delegante responda por sus propios deberes de orientación y seguimiento.", false]]}, {"id": "EC-151", "niv": 3, "e": "Sobre la intención del secretario de trasladar la función recibida a un profesional de su despacho, usted debe conceptuar que", "f": "Ley 489 de 1998, art. 11, num. 2", "o": [["A", "es posible siempre que lo haga mediante acto escrito y lo informe oportunamente al alcalde.", "Cumplir la forma escrita e informar al alcalde no subsana la prohibición: las funciones recibidas en virtud de delegación no son delegables (art. 11, num. 2).", false], ["B", "es posible si el profesional pertenece al nivel directivo o asesor del municipio.", "El nivel del empleado es una condición para ciertas delegaciones, pero aquí el obstáculo es otro: la función ya fue recibida por delegación y no puede volver a delegarse.", false], ["C", "no es posible, porque las funciones recibidas por delegación no pueden transferirse nuevamente.", "El numeral 2 del artículo 11 de la Ley 489 de 1998 prohíbe transferir mediante delegación las funciones, atribuciones y potestades recibidas en virtud de delegación.", true]]}]}, {"comp": "estado_constitucion", "rol": "general", "tag": "Estado y Constitución · Veedurías ciudadanas", "texto": "Usted es técnico administrativo de la Secretaría de Infraestructura de un municipio de cuarta categoría, donde se ejecuta la ampliación del acueducto veredal. Un grupo de habitantes decide constituir una veeduría y pregunta dónde inscribirla. Entre los interesados en ser veedores está el propietario de la ferretería que provee los tubos al contratista. Semanas después, los veedores llegan a la obra y exigen que se detenga de inmediato porque, según ellos, el material no cumple las especificaciones.", "items": [{"id": "EC-161", "niv": 1, "e": "Para formalizar la veeduría, los ciudadanos deben inscribir el documento o acta de constitución ante", "f": "Ley 850 de 2003, art. 3", "o": [["A", "la secretaría de infraestructura que ejecuta la obra vigilada.", "Inscribir la veeduría ante la entidad vigilada afectaría su autonomía. La ley prevé el registro ante personerías o cámaras de comercio.", false], ["B", "la Registraduría Nacional del Estado Civil, en su sede municipal.", "La Registraduría no lleva el registro de veedurías ciudadanas; esa función la asigna la Ley 850 a las personerías y a las cámaras de comercio.", false], ["C", "la personería municipal o la cámara de comercio, que llevan su registro público.", "El artículo 3 de la Ley 850 de 2003 dispone que la inscripción del documento de constitución se realiza ante las personerías municipales o distritales o ante las cámaras de comercio, que llevan el registro público de las veedurías.", true]]}, {"id": "EC-162", "niv": 2, "e": "Sobre el propietario de la ferretería que provee los tubos, usted debe advertir que", "f": "Ley 850 de 2003, art. 19, lit. a", "o": [["A", "está impedido para ser veedor, porque es proveedor de la obra objeto de vigilancia.", "El literal a del artículo 19 de la Ley 850 de 2003 establece el impedimento para ser veedor cuando se es contratista, interventor, proveedor o trabajador de la obra, contrato o programa vigilado, o se tiene interés patrimonial en su ejecución.", true], ["B", "puede ser veedor, pero no podrá votar las decisiones relacionadas con los materiales.", "La ley no prevé una participación parcial: el impedimento le impide ser veedor de esa obra.", false], ["C", "puede ser veedor, siempre que declare por escrito su relación comercial con el contratista.", "Declarar el interés no lo elimina. La Ley 850 establece un impedimento para quienes sean proveedores de la obra vigilada.", false]]}, {"id": "EC-163", "niv": 3, "e": "Frente a la exigencia de los veedores de detener la obra, la respuesta adecuada es explicarles que", "f": "Ley 850 de 2003, arts. 16, 17 y 20", "o": [["A", "no se les dará ninguna información técnica hasta que termine la obra, para no interferir en la ejecución.", "Negar la información desconoce el derecho de las veedurías a obtenerla de los supervisores, contratistas y entidades, información que es de obligatoria respuesta (art. 17).", false], ["B", "la veeduría no puede suspender la obra por sí misma, pero sí pedir información, de obligatoria respuesta, y denunciar.", "El artículo 20 de la Ley 850 prohíbe a las veedurías retrasar, impedir o suspender los programas o contratos sin el concurso de la autoridad competente; el artículo 17 hace obligatoria la respuesta a la información que soliciten, y el artículo 16 les permite denunciar.", true], ["C", "la obra debe suspenderse de inmediato, porque la veeduría tiene la facultad de ordenarlo cuando detecta irregularidades.", "La Ley 850 no otorga a las veedurías facultad de suspender contratos; se lo prohíbe sin el concurso de autoridad competente (art. 20).", false]]}]}, {"comp": "estado_constitucion", "rol": "general", "tag": "Estado y Constitución · Estado social de derecho y espacio público", "texto": "Usted es profesional universitario de la Secretaría de Gobierno de un municipio de segunda categoría que prepara un plan para recuperar el espacio público del centro, ocupado por cerca de 200 vendedores informales. En la mesa de trabajo, un asesor propone desalojar a todos sin más consideraciones «porque el interés general prevalece siempre»; un líder de los vendedores responde que el derecho al trabajo impide cualquier recuperación. Un ciudadano anuncia que acudirá al juez si la alcaldía no actúa. Entre los vendedores hay un hombre con discapacidad física cuya única fuente de ingresos es su puesto.", "items": [{"id": "EC-173", "niv": 2, "e": "Frente a las posiciones del asesor y del líder de los vendedores, el plan debe partir de que el Estado social de derecho", "f": "Constitución Política, arts. 1 y 2", "o": [["A", "impide recuperar el espacio público mientras exista una sola persona que derive su sustento de él.", "El derecho al trabajo no es absoluto ni impide a la administración proteger el espacio público. Se trata de armonizar ambos fundamentos, no de suprimir uno.", false], ["B", "se funda en la prevalencia del interés general como único fundamento, por lo que procede el desalojo sin más consideraciones.", "La prevalencia del interés general es uno de los fundamentos del Estado social de derecho, pero no el único: el artículo 1 también lo funda en la dignidad humana, el trabajo y la solidaridad.", false], ["C", "exige armonizar la prevalencia del interés general con la dignidad humana y el trabajo, que también son sus fundamentos.", "El artículo 1 de la Constitución funda el Estado social de derecho en el respeto de la dignidad humana, en el trabajo, en la solidaridad y en la prevalencia del interés general, y el artículo 2 ordena a las autoridades proteger a todas las personas. El plan debe conciliar estos fundamentos.", true]]}, {"id": "EC-174", "niv": 2, "e": "Si la alcaldía no actúa, el ciudadano que pretende la protección del espacio público puede acudir a", "f": "Constitución Política, art. 88; Ley 472 de 1998, arts. 2 y 9", "o": [["A", "la acción popular, porque el espacio público es un derecho colectivo.", "El artículo 88 de la Constitución incluye el espacio público entre los derechos e intereses colectivos protegidos por las acciones populares, que proceden contra las acciones u omisiones de las autoridades que los amenacen o vulneren (Ley 472, arts. 2 y 9).", true], ["B", "la acción de grupo, porque los afectados por la ocupación del centro son más de veinte personas.", "La acción de grupo busca indemnizar perjuicios individuales. El ciudadano pretende que se proteja el espacio público, finalidad de la acción popular.", false], ["C", "la acción de tutela, porque el espacio público es un derecho fundamental de cada ciudadano.", "El espacio público es un derecho colectivo; la tutela no procede para proteger derechos colectivos (Decreto 2591, art. 6, num. 3), salvo para evitar un perjuicio irremediable a un derecho fundamental propio.", false]]}, {"id": "EC-175", "niv": 3, "e": "Frente al vendedor con discapacidad física y sin otra fuente de ingresos, la Constitución impone a la alcaldía", "f": "Constitución Política, art. 13, inc. 3", "o": [["A", "darle el mismo trato que a los demás vendedores, porque cualquier diferencia sería un trato discriminatorio.", "La igualdad no exige trato idéntico en todos los casos. El inciso 3 del artículo 13 ordena una protección especial a quienes están en circunstancia de debilidad manifiesta.", false], ["B", "brindarle protección especial por su debilidad manifiesta, sin que ello impida recuperar el espacio público.", "El inciso 3 del artículo 13 de la Constitución ordena al Estado proteger especialmente a quienes por su condición económica, física o mental se encuentren en circunstancia de debilidad manifiesta. Esa protección se materializa en medidas diferenciadas dentro del plan, no en la renuncia a proteger el espacio público.", true], ["C", "otorgarle un permiso indefinido para permanecer en el espacio público, por ser sujeto de especial protección.", "La protección especial no convierte el espacio público en un bien apropiable de forma indefinida; exige medidas que atiendan su situación, compatibles con el interés colectivo.", false]]}]}, {"comp": "estado_constitucion", "rol": "general", "tag": "Estado y Constitución · Rendición de cuentas: concejo y audiencias", "texto": "Usted es técnico administrativo de la oficina de planeación de un municipio de quinta categoría. El alcalde presentó al concejo su informe anual de rendición de cuentas, y la mesa directiva pregunta de cuánto tiempo dispone para evaluarlo. Además, el jefe de planeación reconoce que la alcaldía no ha desarrollado espacios de diálogo con la ciudadanía y pregunta qué obligación tiene en ese caso. En la reunión, un concejal pide definir qué se entiende por rendición de cuentas.", "items": [{"id": "EC-191", "niv": 2, "e": "Para evaluar, dictaminar y responder el informe anual de rendición de cuentas del alcalde, el concejo dispone de", "f": "Ley 1757 de 2015, art. 57, parágrafo", "o": [["A", "quince días hábiles.", "No corresponde al término legal. El parágrafo del artículo 57 de la Ley 1757 fija un mes.", false], ["B", "un mes.", "El parágrafo del artículo 57 de la Ley 1757 de 2015 dispone que los concejos municipales y distritales, las asambleas y las juntas administradoras locales tienen un mes de plazo para evaluar, dictaminar y responder los informes anuales de rendición de cuentas de alcaldes y gobernadores.", true], ["C", "tres meses.", "Tres meses es el plazo en el que los presidentes de las corporaciones elaboran su propio informe de rendición de cuentas (art. 59), no el término para evaluar el informe del alcalde.", false]]}, {"id": "EC-192", "niv": 1, "e": "Si la alcaldía no adelanta espacios de diálogo para la rendición de cuentas, está obligada a realizar audiencias públicas participativas como mínimo", "f": "Ley 1757 de 2015, art. 53", "o": [["A", "una vez al año.", "La ley exige una periodicidad mayor cuando la entidad no adelanta espacios de diálogo: mínimo dos veces al año.", false], ["B", "dos veces al año.", "El artículo 53 de la Ley 1757 de 2015 dispone que, si una entidad no adelanta espacios de diálogo para la rendición de cuentas, estará obligada a realizar audiencias públicas participativas mínimo dos veces al año.", true], ["C", "cuatro veces al año.", "La ley no exige una audiencia trimestral; el mínimo es de dos audiencias al año.", false]]}, {"id": "EC-193", "niv": 1, "e": "Al concejal debe explicarse que la rendición de cuentas es", "f": "Ley 1757 de 2015, art. 48", "o": [["A", "una auditoría que realiza la contraloría sobre los resultados de la gestión de la alcaldía.", "La auditoría es un instrumento del control fiscal. La rendición de cuentas es un proceso de la propia administración ante la ciudadanía.", false], ["B", "un informe escrito que el alcalde entrega una vez al año al concejo municipal, sin participación directa de la ciudadanía.", "La rendición de cuentas no se reduce al informe ante el concejo; la ley la define como un proceso dirigido a ciudadanos, sociedad civil, entidades y órganos de control, a partir del diálogo.", false], ["C", "un proceso en el que las entidades informan y explican su gestión a partir del diálogo, como expresión de control social.", "El artículo 48 de la Ley 1757 de 2015 define la rendición de cuentas como el proceso mediante el cual las entidades y servidores informan, explican y dan a conocer los resultados de su gestión a la ciudadanía y otros actores, a partir de la promoción del diálogo, y la califica como expresión de control social.", true]]}]}, {"comp": "empleo_publico", "rol": "general", "tag": "Empleo público, carrera y régimen disciplinario · Concurso de méritos y lista de elegibles", "texto": "Una alcaldía distrital participa en un proceso de selección de la Comisión Nacional del Servicio Civil. Usted, técnico administrativo de la Dirección de Talento Humano, recibe tres consultas: un aspirante pide que se le admitan documentos de experiencia que no cargó en la plataforma dentro de la fecha fijada en la convocatoria, porque «la alcaldía puede flexibilizar las reglas»; el jefe de la dependencia pregunta cuánto tiempo podrá usarse la lista de elegibles una vez quede en firme; y la secretaria general pregunta si con esa lista se puede cubrir una vacante definitiva de un empleo equivalente que no fue convocado y que surgió tres meses después de la convocatoria en la misma alcaldía.", "items": [{"id": "EP-110", "niv": 1, "e": "Frente a la solicitud del aspirante, usted le responde que", "f": "Ley 909 de 2004, art. 31, num. 1", "o": [["A", "la convocatoria es la norma reguladora del concurso y obliga por igual a la administración, a la entidad que lo ejecuta y a los participantes.", "El art. 31, num. 1, de la Ley 909 de 2004 define la convocatoria como norma reguladora de todo concurso, que obliga a la administración, a las entidades contratadas para realizarlo y a los participantes; por eso no es posible aceptar documentos por fuera de las fechas fijadas.", true], ["B", "puede radicar los documentos como derecho de petición para que se valoren en la etapa de pruebas escritas.", "El derecho de petición no sirve para modificar las reglas del concurso ni para acreditar requisitos por fuera de los plazos de la convocatoria, que es obligatoria para todos.", false], ["C", "la alcaldía puede recibir los documentos, porque como entidad nominadora tiene la facultad de ajustar los plazos del concurso.", "La entidad no puede modificar unilateralmente las reglas: la convocatoria la obliga igual que a los aspirantes, según el art. 31, num. 1, de la Ley 909 de 2004.", false]]}, {"id": "EP-111", "niv": 1, "e": "Al jefe de la dependencia usted le informa que la lista de elegibles tendrá una vigencia de", "f": "Ley 909 de 2004, art. 31, num. 4 (modificado por el art. 6 de la Ley 1960 de 2019)", "o": [["A", "un año, contado desde su firmeza.", "Ese era un término de normas anteriores; la Ley 909 de 2004, modificada por la Ley 1960 de 2019, fija hoy una vigencia de dos años.", false], ["B", "dos años.", "El art. 31, num. 4, de la Ley 909 de 2004, modificado por el art. 6 de la Ley 1960 de 2019, establece que la lista de elegibles, elaborada en estricto orden de mérito, tendrá una vigencia de dos años.", true], ["C", "cuatro años.", "La vigencia de cuatro años corresponde a la lista para elegir a los comisionados de la CNSC (art. 9 de la Ley 909 de 2004), no a las listas de los procesos de selección de empleos de carrera.", false]]}, {"id": "EP-112", "niv": 3, "e": "A la secretaria general usted le responde que la vacante del empleo equivalente", "f": "Ley 909 de 2004, art. 31, num. 4 (modificado por el art. 6 de la Ley 1960 de 2019)", "o": [["A", "no puede cubrirse con la lista, porque esta solo sirve para los empleos expresamente ofertados en la convocatoria.", "La Ley 1960 de 2019 amplió el uso de la lista: además de las vacantes convocadas, cubre las vacantes definitivas de cargos equivalentes no convocados que surjan después de la convocatoria en la misma entidad.", false], ["B", "puede cubrirse con la lista de cualquier entidad del distrito, siempre que el empleo tenga igual denominación y grado.", "La norma limita el uso a cargos equivalentes de la misma entidad que adelantó el concurso; no autoriza usar listas de otras entidades por la sola coincidencia de denominación y grado.", false], ["C", "puede cubrirse con la lista, en estricto orden de mérito, porque es un cargo equivalente no convocado que surgió con posterioridad en la misma entidad.", "El art. 31, num. 4, de la Ley 909 de 2004, modificado por la Ley 1960 de 2019, dispone que con la lista se cubran las vacantes convocadas y las vacantes definitivas de cargos equivalentes no convocados que surjan con posterioridad a la convocatoria en la misma entidad.", true]]}]}, {"comp": "empleo_publico", "rol": "tecnico", "tag": "Empleo público, carrera y régimen disciplinario · Nivel técnico · Licencia por luto", "texto": "Usted es técnico administrativo de la Dirección de Talento Humano de un instituto distrital de Bogotá y tramita las novedades de nómina. Esta semana recibe tres casos: Martha, auxiliar de archivo, informa que falleció su abuelo paterno; Hernán, conductor, informa que falleció su cuñado, hermano de su esposa, y pide unos días para acompañar a la familia; y Sofía, profesional, que estaba disfrutando sus vacaciones, informa que falleció su madre.", "items": [{"id": "EP-138", "niv": 2, "e": "Para el caso de Martha, usted proyecta", "f": "Decreto 1083 de 2015, art. 2.2.5.5.15; Ley 1635 de 2013", "o": [["A", "un acto que le confiere licencia por luto de cinco días hábiles.", "El art. 2.2.5.5.15 del Decreto 1083 de 2015, en concordancia con la Ley 1635 de 2013, reconoce cinco días hábiles de licencia por luto por el fallecimiento de familiares hasta el segundo grado de consanguinidad, como el abuelo; la jefatura de personal la confiere por acto motivado.", true], ["B", "una licencia por luto de cinco días calendario contados desde la radicación de la solicitud.", "La licencia por luto se reconoce en días hábiles y se cuenta a partir del fallecimiento, no en días calendario desde la solicitud.", false], ["C", "un permiso remunerado de tres días hábiles, porque el abuelo no está cubierto por la licencia por luto.", "El abuelo es pariente en segundo grado de consanguinidad, que sí está cubierto por la licencia por luto; no es necesario acudir al permiso remunerado.", false]]}, {"id": "EP-139", "niv": 3, "e": "Frente a la solicitud de Hernán, lo procedente es indicarle que", "f": "Decreto 1083 de 2015, arts. 2.2.5.5.15 y 2.2.5.5.17", "o": [["A", "tiene derecho a licencia por luto, porque el cuñado es pariente en segundo grado y la ley cubre hasta ese grado en todos los casos.", "La licencia cubre hasta el segundo grado de consanguinidad, pero solo hasta el primero de afinidad; el cuñado es pariente en segundo grado de afinidad y queda por fuera.", false], ["B", "debe pedir licencia ordinaria, porque es la única figura que permite ausentarse por motivos familiares.", "La licencia ordinaria no es la única opción; el permiso remunerado de hasta tres días hábiles procede cuando medie justa causa, como el fallecimiento de un familiar no cubierto por la licencia por luto.", false], ["C", "no tiene derecho a licencia por luto, pero puede solicitar por escrito un permiso remunerado de hasta tres días hábiles con justa causa.", "El cuñado es pariente en segundo grado de afinidad y el art. 2.2.5.5.15 del Decreto 1083 de 2015 cubre solo hasta el primero de afinidad; Hernán puede pedir permiso remunerado hasta por tres días hábiles cuando medie justa causa, que autoriza o niega el nominador o su delegado (art. 2.2.5.5.17).", true]]}, {"id": "EP-140", "niv": 2, "e": "En el caso de Sofía, la licencia por luto tiene como efecto que", "f": "Decreto 1083 de 2015, art. 2.2.5.5.16", "o": [["A", "las vacaciones se interrumpen y se reanudan una vez termine la licencia por luto.", "El art. 2.2.5.5.16 del Decreto 1083 de 2015 establece que la licencia por luto interrumpe las vacaciones, la licencia ordinaria y la licencia no remunerada para estudios, y que, cumplida aquella, se reanudan las situaciones en que se encontraba el servidor.", true], ["B", "la servidora debe reintegrarse al trabajo para que se le pueda conceder la licencia por luto.", "No se exige reintegro previo; la licencia por luto interrumpe directamente las vacaciones y, al terminar, estas se reanudan.", false], ["C", "las vacaciones absorben la licencia, porque Sofía ya estaba separada del servicio.", "El reglamento dispone lo contrario: la licencia por luto interrumpe las vacaciones; no queda absorbida por ellas.", false]]}]}, {"comp": "empleo_publico", "rol": "general", "tag": "Empleo público, carrera y régimen disciplinario · Permisos", "texto": "En la Secretaría de Desarrollo Económico de una gobernación, tres servidores hacen solicitudes a la oficina de talento humano, donde usted trabaja: un técnico pide permiso remunerado para asistir a la diligencia de entrega de un inmueble que compró; una profesional, empleada de carrera, fue invitada por una universidad pública a dictar una cátedra de cuatro horas semanales en horario laboral y pregunta si puede hacerlo; y la misma profesional pregunta si puede recibir los honorarios de esa cátedra además de su salario.", "items": [{"id": "EP-141", "niv": 1, "e": "Sobre la solicitud del técnico, usted le informa que el permiso remunerado", "f": "Decreto 1083 de 2015, art. 2.2.5.5.17", "o": [["A", "puede concederse hasta por cinco días hábiles y lo autoriza el jefe inmediato.", "El término máximo del permiso remunerado es de tres días hábiles, y la facultad de autorizarlo corresponde al nominador o a su delegado.", false], ["B", "puede concederse hasta por tres días hábiles cuando medie justa causa, y lo autoriza o niega el nominador o su delegado.", "El art. 2.2.5.5.17 del Decreto 1083 de 2015 permite solicitar por escrito permiso remunerado hasta por tres días hábiles cuando medie justa causa, y atribuye al nominador o a su delegado la facultad de autorizarlo o negarlo.", true], ["C", "solo procede por calamidad doméstica comprobada; para trámites personales debe pedir licencia ordinaria.", "La norma no limita el permiso a la calamidad doméstica; exige justa causa, que el nominador valora.", false]]}, {"id": "EP-142", "niv": 1, "e": "Frente a la cátedra universitaria en horario laboral, usted le explica a la profesional que", "f": "Decreto 1083 de 2015, art. 2.2.5.5.20", "o": [["A", "puede otorgársele permiso remunerado para la docencia en hora cátedra hasta por cinco horas semanales, según las necesidades del servicio.", "El art. 2.2.5.5.20 del Decreto 1083 de 2015 permite otorgar permiso remunerado para ejercer la docencia universitaria en hora cátedra hasta por cinco horas semanales, sujeto a las necesidades del servicio a juicio del jefe del organismo; las cuatro horas pedidas están dentro del límite.", true], ["B", "no puede hacerlo, porque toda actividad docente debe realizarse por fuera de la jornada laboral.", "El reglamento prevé un permiso remunerado específico para la docencia universitaria en hora cátedra dentro de la jornada, hasta cinco horas semanales.", false], ["C", "debe pedir una comisión de estudios, porque es la figura prevista para actividades académicas.", "La comisión de estudios es para que el empleado reciba formación, no para que dicte clases; para la docencia universitaria en hora cátedra existe un permiso específico.", false]]}, {"id": "EP-143", "niv": 3, "e": "Sobre los honorarios de la cátedra, usted le responde a la profesional que", "f": "Constitución Política, art. 128; Ley 4 de 1992, art. 19; Ley 1952 de 2019, art. 39, num. 13", "o": [["A", "no puede recibirlos, porque la Constitución prohíbe recibir más de una asignación del tesoro público sin excepción.", "La prohibición del art. 128 de la Constitución admite las excepciones que señale la ley, y la Ley 4 de 1992 (art. 19) exceptúa los honorarios por hora cátedra.", false], ["B", "puede recibirlos solo si renuncia a la parte proporcional de su salario por las horas dedicadas a la cátedra.", "La ley no exige descontar el salario; la excepción permite percibir los honorarios de hora cátedra junto con la asignación del empleo, dentro de los límites legales.", false], ["C", "puede recibirlos, porque los honorarios por hora cátedra son una excepción legal a la prohibición de recibir más de una asignación del tesoro público.", "El art. 128 de la Constitución prohíbe recibir más de una asignación del tesoro salvo los casos que determine la ley, y el art. 19 de la Ley 4 de 1992 exceptúa los honorarios percibidos por hora cátedra; la Ley 1952 de 2019 (art. 39, num. 13) remite a esas excepciones legales.", true]]}]}, {"comp": "empleo_publico", "rol": "general", "tag": "Empleo público, carrera y régimen disciplinario · Encargo y asignación de funciones", "texto": "En la Secretaría de Hacienda de un municipio de segunda categoría se presentan dos novedades. El tesorero, empleo de libre nombramiento y remoción, viajará diez días hábiles en comisión de servicios a otra ciudad del país para una capacitación, y la secretaria quiere que alguien atienda sus funciones mientras tanto. Además, una profesional universitaria de carrera obtuvo licencia ordinaria de dos meses, y un técnico de carrera con evaluación sobresaliente será encargado de ese empleo, de mayor remuneración. Usted, profesional de talento humano, debe proyectar los actos y responder las dudas de los servidores.", "items": [{"id": "EP-147", "niv": 3, "e": "Para que alguien atienda las funciones del tesorero durante su comisión, la figura que procede es", "f": "Decreto 1083 de 2015, arts. 2.2.5.2.2 y 2.2.5.5.52", "o": [["A", "la asignación de las funciones a otro empleado que desempeñe un cargo de la misma naturaleza.", "La comisión de servicios al interior no genera vacancia temporal (art. 2.2.5.2.2, num. 4, del Decreto 1083 de 2015); cuando la situación no genera vacancia pero implica separación transitoria de funciones, el jefe puede asignarlas a otro empleado de un cargo de la misma naturaleza (art. 2.2.5.5.52).", true], ["B", "el encargo del tesorero, porque toda comisión deja vacante temporalmente el empleo del comisionado.", "La comisión de servicios al interior no genera vacancia temporal (Decreto 1083 de 2015, art. 2.2.5.2.2, num. 4); por eso no procede el encargo.", false], ["C", "un nombramiento provisional por diez días hábiles, porque el empleo de tesorero no puede quedar sin titular.", "El nombramiento provisional es para empleos de carrera en vacancia; el tesorero no deja vacante el empleo durante una comisión de servicios al interior.", false]]}, {"id": "EP-148", "niv": 2, "e": "Si se asignan las funciones del tesorero a otro servidor, este tendrá derecho a", "f": "Decreto 1083 de 2015, art. 2.2.5.5.52", "o": [["A", "una bonificación especial equivalente a la mitad del salario del tesorero.", "No existe en el reglamento una bonificación por asignación de funciones; el servidor conserva su salario sin diferencia salarial.", false], ["B", "seguir recibiendo el salario de su propio empleo, sin diferencia salarial.", "El art. 2.2.5.5.52 del Decreto 1083 de 2015 dispone que el empleado a quien se asignan funciones no tiene derecho al pago de la diferencia salarial y no se entiende desvinculado de las funciones de su propio cargo.", true], ["C", "la diferencia salarial entre su empleo y el de tesorero durante los diez días.", "El reglamento excluye expresamente la diferencia salarial en la asignación de funciones; ese derecho es propio del encargo.", false]]}, {"id": "EP-149", "niv": 3, "e": "Mientras dure el encargo en el empleo de la profesional en licencia ordinaria, el técnico tendrá derecho a", "f": "Decreto 1083 de 2015, art. 2.2.5.5.44", "o": [["A", "recibir ambos salarios, el de técnico y el de profesional, porque ejerce dos empleos a la vez.", "Recibir dos asignaciones del tesoro está prohibido salvo excepción legal; el encargado recibe el salario del empleo encargado, no la suma de ambos.", false], ["B", "conservar el salario de técnico, porque en las vacancias temporales nunca se paga diferencia salarial.", "El reglamento sí reconoce la diferencia salarial en el encargo cuando el titular no percibe el salario, como ocurre en la licencia ordinaria no remunerada.", false], ["C", "percibir el salario del empleo de profesional, porque la titular no lo recibe durante la licencia.", "El art. 2.2.5.5.44 del Decreto 1083 de 2015 da al encargado derecho al salario del empleo que desempeña temporalmente, siempre que no deba ser percibido por su titular; la licencia ordinaria es no remunerada, así que la profesional no lo recibe.", true]]}, {"id": "EP-150", "niv": 1, "e": "Si el técnico pregunta qué pasa con sus derechos de carrera al aceptar el encargo, usted le responde que", "f": "Ley 909 de 2004, art. 42, num. 3; Decreto 1083 de 2015, art. 2.2.5.5.46", "o": [["A", "quedan suspendidos mientras dure el encargo y se reactivan solo si la Comisión de Personal lo aprueba.", "No hay suspensión de derechos ni aprobación de la Comisión de Personal; la ley simplemente dispone que no se pierden.", false], ["B", "los pierde, pero puede recuperarlos si concursa de nuevo para su empleo.", "La ley establece lo contrario: los derechos de carrera no se pierden por tomar posesión de un empleo en encargo.", false], ["C", "los conserva, porque tomar posesión de un empleo en encargo no implica perderlos.", "El art. 42, num. 3, de la Ley 909 de 2004 dispone que los derechos de carrera no se pierden cuando el empleado toma posesión de un empleo para el cual fue designado en encargo; al terminar, reasume su empleo (Decreto 1083 de 2015, art. 2.2.5.5.46).", true]]}]}, {"comp": "empleo_publico", "rol": "general", "tag": "Empleo público, carrera y régimen disciplinario · Acoso laboral: definición y modalidades", "texto": "Usted integra el comité de convivencia laboral de una alcaldía de segunda categoría. Recibe tres situaciones: una técnica denuncia que, desde hace tres meses y sin ninguna razón del servicio, su jefe le asigna el triple de trabajo que a sus compañeros y le cambia el horario cada semana, y le ha dicho que «si no le gusta, puede irse»; un auxiliar refiere que un compañero lo insulta con frecuencia y lo llama «inútil» delante de los demás; y una coordinadora de grupo afirma que dos de sus subalternos la hostigan de manera persistente con mensajes ofensivos para que renuncie a la coordinación.", "items": [{"id": "EP-176", "niv": 2, "e": "La situación de la técnica corresponde a la modalidad de acoso laboral denominada", "f": "Ley 1010 de 2006, art. 2", "o": [["A", "desprotección laboral.", "La desprotección laboral consiste en poner en riesgo la integridad y seguridad del trabajador con órdenes o funciones sin los mínimos de protección; el caso describe carga excesiva y cambios de horario para inducir la renuncia.", false], ["B", "persecución laboral.", "El art. 2, num. 2, de la Ley 1010 de 2006 define la persecución laboral como la conducta reiterada o evidentemente arbitraria que permite inferir el propósito de inducir la renuncia, mediante descalificación, carga excesiva de trabajo y cambios permanentes de horario.", true], ["C", "discriminación laboral.", "La discriminación laboral exige un trato diferenciado por razones como raza, género, edad, origen, credo, preferencia política o situación social; el caso no menciona ninguno de esos motivos, sino carga excesiva y cambios de horario para inducir la renuncia.", false]]}, {"id": "EP-177", "niv": 1, "e": "La conducta del compañero que insulta al auxiliar delante de los demás corresponde a", "f": "Ley 1010 de 2006, arts. 2 y 7", "o": [["A", "maltrato laboral, por tratarse de expresiones injuriosas que lesionan la integridad moral del trabajador.", "El art. 2, num. 1, de la Ley 1010 de 2006 define el maltrato laboral como, entre otros, toda expresión verbal injuriosa o ultrajante que lesione la integridad moral, y el art. 7 presume el acoso ante comentarios hostiles y humillantes de descalificación profesional ante los compañeros.", true], ["B", "un conflicto entre pares que no es acoso, porque este solo puede provenir de un superior jerárquico.", "La ley reconoce como posibles autores del acoso al jefe, a un compañero de trabajo o a un subalterno (art. 2 de la Ley 1010 de 2006).", false], ["C", "discriminación laboral, porque el trato que recibe es distinto al que reciben los demás compañeros de la dependencia.", "La discriminación laboral exige un trato diferenciado por razones como raza, género, edad, origen, credo o preferencia política; el caso describe insultos, que corresponden al maltrato.", false]]}, {"id": "EP-178", "niv": 3, "e": "Frente a la queja de la coordinadora contra sus subalternos, el comité debe tener en cuenta que", "f": "Ley 1010 de 2006, arts. 2 y 6", "o": [["A", "no puede tramitarse, porque la víctima del acoso siempre es quien está en posición de subordinación.", "La Ley 1010 de 2006 reconoce expresamente que el acoso puede provenir de un subalterno y que los jefes inmediatos pueden ser víctimas.", false], ["B", "puede tramitarse como acoso laboral, porque la ley contempla que los jefes inmediatos sean víctimas cuando el acoso proviene de sus subalternos.", "El art. 2 de la Ley 1010 de 2006 incluye al subalterno como posible autor del acoso, y el art. 6 reconoce como sujetos pasivos a los jefes inmediatos cuando el acoso proviene de sus subalternos.", true], ["C", "solo puede tramitarse como un asunto disciplinario por desobediencia, no como acoso laboral.", "La ley no limita esta situación a la desobediencia; la regula como acoso laboral cuando se cumplen sus elementos.", false]]}]}, {"comp": "empleo_publico", "rol": "general", "tag": "Empleo público, carrera y régimen disciplinario · Declaración de bienes y rentas y registro de conflictos de interés", "texto": "Usted trabaja en la oficina de talento humano de una corporación autónoma regional. El consejo directivo designó a un nuevo director general, que se posesionará la próxima semana. Al mismo tiempo, un técnico administrativo de planta pregunta qué obligaciones tiene sobre su declaración de bienes y rentas. Y la jefe de la oficina le pide aclarar qué debe hacer el director si, ya posesionado, compra un inmueble y adquiere participación en una sociedad.", "items": [{"id": "EP-198", "niv": 1, "e": "Al técnico administrativo usted le explica que la declaración juramentada de bienes y rentas", "f": "Ley 190 de 1995, art. 13", "o": [["A", "es requisito para posesionarse y desempeñar el cargo, y debe actualizarse cada año y al retirarse.", "El art. 13 de la Ley 190 de 1995 establece la declaración juramentada de bienes y rentas como requisito para la posesión y el desempeño del cargo, y ordena actualizarla cada año y, en todo caso, al momento del retiro.", true], ["B", "solo la presentan los servidores de libre nombramiento y remoción que manejan recursos.", "La obligación de la Ley 190 de 1995 se predica de quien es nombrado para un cargo público, sin limitarla a los de libre nombramiento o a quienes manejan recursos.", false], ["C", "solo se presenta una vez, al momento de posesionarse, y no requiere actualizaciones posteriores mientras se ejerza el cargo.", "La Ley 190 de 1995 exige actualizar la información cada año y al momento del retiro, no solo al posesionarse.", false]]}, {"id": "EP-199", "niv": 3, "e": "Sobre el nuevo director general, usted le informa a la jefe que, por la Ley 2013 de 2019, para posesionarse debe", "f": "Ley 2013 de 2019, arts. 2 y 3", "o": [["A", "entregar en sobre cerrado su declaración de renta a la Contraloría, que la mantendrá bajo reserva.", "La Ley 2013 de 2019 busca lo contrario de la reserva: la publicación y divulgación proactiva de esa información, mediante su registro en el SIGEP.", false], ["B", "presentar solo la declaración de bienes y rentas de la Ley 190 de 1995, porque la Ley 2013 aplica únicamente a cargos de elección popular.", "La Ley 2013 de 2019 no se limita a los cargos de elección popular: incluye a quienes ejercen cargos directivos y gerenciales y a la dirección de las CAR.", false], ["C", "publicar en el SIGEP su declaración de bienes y rentas, su registro de conflictos de interés y copia de su declaración de renta.", "La Ley 2013 de 2019 incluye entre los sujetos obligados a quienes ejercen cargos directivos y gerenciales en el Estado y a quienes dirigen las CAR (art. 2), exige la publicación como requisito para posesionarse, ejercer y retirarse del cargo (par. 1) y ordena registrarla en el SIGEP (art. 3).", true]]}, {"id": "EP-200", "niv": 3, "e": "Si el director, ya posesionado, compra un inmueble y adquiere participación en una sociedad, deberá", "f": "Ley 2013 de 2019, art. 3", "o": [["A", "comunicar el cambio a la entidad y registrarlo dentro de los dos meses siguientes.", "El art. 3 de la Ley 2013 de 2019 dispone que todo cambio que modifique la información de la declaración de bienes y rentas y del registro de conflictos de interés debe comunicarse a la entidad y registrarse dentro de los dos meses siguientes al cambio.", true], ["B", "reportar los cambios solo al momento de su retiro, porque es cuando se cierra la declaración.", "La ley no aplaza el reporte hasta el retiro: los cambios deben registrarse dentro de los dos meses siguientes.", false], ["C", "esperar a la actualización anual para reportar ambos cambios en una sola declaración.", "Además de la actualización anual, la ley exige reportar los cambios dentro de los dos meses siguientes a su ocurrencia; no basta esperar a la actualización anual.", false]]}]}, {"comp": "atencion_procedimiento", "rol": "tecnico", "tag": "Atención al ciudadano y procedimiento administrativo · Nivel técnico · Derecho de petición: peticiones incompletas y desistimiento", "texto": "Usted es técnico administrativo de la Secretaría de Desarrollo Social de un municipio de segunda categoría. El martes 1 de septiembre de 2026 se radicó la solicitud de una madre cabeza de familia para acceder a un apoyo económico del programa municipal de permanencia escolar. Al revisarla, usted constata que falta el certificado de estudios del hijo, que la peticionaria debe obtener en el colegio privado donde estudia el menor y sin el cual no es posible decidir de fondo. La secretaría atiende de lunes a viernes y no hay festivos en septiembre de 2026.", "items": [{"id": "AP-116", "niv": 3, "e": "Si la secretaría va a requerir a la peticionaria para que complete la solicitud, el último día para hacerlo es el", "f": "Ley 1755 de 2015, art. 1 (art. 17 de la Ley 1437 de 2011); cálculo de días hábiles", "o": [["A", "viernes 11 de septiembre de 2026.", "Resulta de contar diez días calendario. El término de diez días se cuenta en días hábiles.", false], ["B", "lunes 14 de septiembre de 2026.", "Resulta de contar el día de la radicación como primer día. El plazo corre dentro de los diez días siguientes a la fecha de radicación.", false], ["C", "martes 15 de septiembre de 2026.", "El artículo 17 del CPACA ordena requerir dentro de los diez días siguientes a la radicación: 2 a 4 de septiembre (3), 7 a 11 (8), 14 (9) y 15 (10). No hay festivos en el periodo.", true]]}, {"id": "AP-117", "niv": 2, "e": "En el requerimiento debe indicarse que la peticionaria cuenta, para aportar el certificado, con", "f": "Ley 1755 de 2015, art. 1 (art. 17 de la Ley 1437 de 2011)", "o": [["A", "diez días hábiles, prorrogables por una sola vez a juicio de la secretaría.", "Confunde el plazo que tiene la autoridad para hacer el requerimiento (diez días) con el que tiene el peticionario para cumplirlo, que es de un mes.", false], ["B", "un término máximo de un mes, prorrogable hasta por un término igual si lo pide antes de su vencimiento.", "El artículo 17 del CPACA da al peticionario un término máximo de un mes para completar la petición y le permite pedir, antes de que venza, una prórroga hasta por un término igual.", true], ["C", "tres meses, al cabo de los cuales operará el silencio administrativo negativo.", "Tres meses es el plazo del silencio negativo (art. 83 del CPACA), que no tiene relación con el requerimiento para completar una petición.", false]]}, {"id": "AP-118", "niv": 2, "e": "Si la peticionaria no aporta el certificado ni pide prórroga, la secretaría debe", "f": "Ley 1755 de 2015, art. 1 (art. 17 de la Ley 1437 de 2011)", "o": [["A", "decretar el desistimiento y el archivo mediante acto motivado que se notifica personalmente, contra el cual solo procede reposición.", "El artículo 17 del CPACA ordena decretar el desistimiento y el archivo mediante acto administrativo motivado, notificado personalmente, contra el que únicamente procede reposición. La petición puede presentarse de nuevo con los requisitos completos.", true], ["B", "archivar el expediente sin expedir acto administrativo, porque el desistimiento opera de pleno derecho.", "La ley exige un acto administrativo motivado que decrete el desistimiento, notificado personalmente, para garantizar el debido proceso.", false], ["C", "negar de fondo el apoyo económico mediante resolución contra la cual proceden reposición y apelación.", "No hay decisión de fondo: la consecuencia del incumplimiento es el desistimiento, contra el cual solo procede reposición.", false]]}]}, {"comp": "atencion_procedimiento", "rol": "general", "tag": "Atención al ciudadano y procedimiento administrativo · Derecho de petición: reglas generales", "texto": "Usted trabaja en la Secretaría de Educación de un municipio certificado. El martes 4 de mayo de 2027 la Personería municipal radicó una solicitud de información sobre el número de estudiantes beneficiados con el transporte escolar. Ese mismo día, un estudiante de 15 años se acercó solo a radicar una petición para acceder a una beca municipal. Un compañero de trabajo propone cobrar una tarifa por radicar peticiones y exigir abogado en las más complejas. La entidad atiende de lunes a viernes; el lunes 10 de mayo de 2027 es festivo y, aparte del sábado 1 de mayo, no hay otros festivos en mayo hasta el día 30.", "items": [{"id": "AP-122", "niv": 3, "e": "El último día para responder la solicitud de la Personería es el", "f": "Ley 1755 de 2015, art. 1 (art. 30 de la Ley 1437 de 2011); cálculo de días hábiles", "o": [["A", "martes 18 de mayo de 2027.", "Resulta de contar el lunes 10 de mayo como día hábil. Ese día es festivo y no se cuenta.", false], ["B", "miércoles 19 de mayo de 2027.", "Entre autoridades, la petición de información debe resolverse en no más de diez días (art. 30 del CPACA): 5 a 7 de mayo (3), 11 a 14 (7), 17 a 19 (10). Se excluyen el fin de semana y el festivo del 10 de mayo.", true], ["C", "miércoles 26 de mayo de 2027.", "Aplica el término general de quince días. Cuando una autoridad pide información a otra, la ley fija un término especial de diez días.", false]]}, {"id": "AP-123", "niv": 1, "e": "Frente a la petición del estudiante de 15 años sobre la beca municipal, usted debe", "f": "Decreto Ley 019 de 2012, art. 12; Ley 1755 de 2015, art. 1 (art. 13 de la Ley 1437 de 2011)", "o": [["A", "exigir que la presente su padre, madre o representante legal, porque los menores no pueden actuar solos ante la administración.", "La ley reconoce a los menores la facultad de presentar peticiones directamente en asuntos de su interés y bienestar, sin intermediarios.", false], ["B", "recibirla solo como información, sin radicarla, hasta que un adulto responsable la ratifique por escrito.", "Ninguna norma exige la ratificación de un adulto. Además, ninguna autoridad puede negarse a radicar peticiones respetuosas (art. 15, parágrafo 2, del CPACA).", false], ["C", "recibirla y tramitarla con prelación en el turno, porque los menores pueden presentar directamente peticiones sobre asuntos de su interés y bienestar.", "El artículo 12 del Decreto Ley 019 de 2012 permite que niños, niñas y adolescentes presenten directamente solicitudes relacionadas con su interés superior, su bienestar y su protección especial, con prelación en el turno. El artículo 13 del CPACA no exige persona mayor ante las entidades dedicadas a su formación.", true]]}, {"id": "AP-124", "niv": 1, "e": "Sobre la propuesta de cobrar por radicar peticiones y exigir abogado en las complejas, lo correcto es señalar que", "f": "Ley 1755 de 2015, art. 1 (art. 13 de la Ley 1437 de 2011)", "o": [["A", "el derecho de petición es gratuito y puede ejercerse sin necesidad de abogado.", "El inciso 3 del artículo 13 del CPACA dispone que el ejercicio del derecho de petición es gratuito y puede realizarse sin representación de abogado.", true], ["B", "el abogado solo es exigible cuando la petición busca el reconocimiento de un derecho de contenido económico.", "La ley no distingue según el contenido de la petición. En todos los casos puede ejercerse sin abogado.", false], ["C", "puede cobrarse una tarifa razonable por radicación, siempre que se fije mediante acto administrativo general.", "El artículo 13 del CPACA establece que el derecho de petición es gratuito. Lo único que puede cobrarse es el costo de las copias que se pidan (art. 29).", false]]}]}, {"comp": "atencion_procedimiento", "rol": "tecnico", "tag": "Atención al ciudadano y procedimiento administrativo · Nivel técnico · Racionalización de trámites", "texto": "Usted es técnico administrativo de la oficina de personal de la Secretaría de Educación de un departamento. Un docente que solicita la actualización de su historia laboral presenta fotocopias simples de sus diplomas, y un compañero le exige que las autentique en notaría. El mismo docente necesita acreditar el tiempo que trabajó en una alcaldía del departamento, cuyo certificado reposa en el archivo de esa alcaldía, y pregunta si debe ir él mismo a pedirlo. Además, para seguir pagando un auxilio periódico a un exservidor que reside en Colombia, la oficina acostumbra pedirle cada semestre un certificado de supervivencia.", "items": [{"id": "AP-159", "niv": 2, "e": "Frente a la exigencia de autenticar las fotocopias de los diplomas, lo procedente es", "f": "Decreto Ley 019 de 2012, art. 25", "o": [["A", "exigir los diplomas originales y devolverlos después de cotejarlos con las copias.", "Exigir originales para cotejo es un requisito que el artículo 25 también prohíbe, salvo en los casos que la norma exceptúa.", false], ["B", "recibir las copias simples, sin perjuicio de los controles o verificaciones que la secretaría deba realizar.", "El artículo 25 del Decreto Ley 019 de 2012 prohíbe a las autoridades administrativas exigir documentos originales autenticados o copias autenticadas, sin perjuicio de los controles o verificaciones que deban hacer. La excepción se refiere al reconocimiento o pago de pensiones, que no es el caso.", true], ["C", "exigir la autenticación, porque los diplomas son documentos privados que carecen de presunción de autenticidad.", "La prohibición de exigir copias autenticadas cubre este trámite. Si hay dudas, la secretaría puede verificar la información, pero no trasladar al docente la carga de autenticar.", false]]}, {"id": "AP-160", "niv": 3, "e": "Sobre el certificado de tiempo de servicio que reposa en la alcaldía, debe explicarse al docente que", "f": "Decreto Ley 019 de 2012, art. 9, parágrafo", "o": [["A", "no necesita acreditar ese tiempo, porque la secretaría debe reconocerlo con su sola afirmación bajo juramento.", "La afirmación bajo juramento reemplaza las declaraciones extrajuicio, no la prueba del tiempo de servicio. La norma permite que la secretaría obtenga el certificado directamente de la alcaldía.", false], ["B", "debe aportarlo él mismo, porque la prohibición de exigir documentos solo cubre los que reposan en la propia secretaría.", "El parágrafo del artículo 9 del Decreto Ley 019 de 2012 extiende la regla a los documentos que reposan en otra entidad pública: el solicitante puede indicar dónde están para que la entidad los requiera directamente.", false], ["C", "puede indicar la entidad donde reposa para que la secretaría lo pida directamente, sin perjuicio de que él decida aportarlo.", "El parágrafo del artículo 9 del Decreto Ley 019 de 2012 dispone que, cuando los documentos reposen en otra entidad pública, el solicitante puede indicarla para que la entidad que tramita los requiera de manera directa, sin perjuicio de que la persona los aporte.", true]]}, {"id": "AP-161", "niv": 2, "e": "Sobre el certificado de supervivencia que se pide al exservidor, la oficina debe", "f": "Decreto Ley 019 de 2012, art. 21", "o": [["A", "reemplazarlo por la presentación personal semestral del exservidor en la oficina.", "El artículo 21 también prohíbe exigir presentaciones personales para probar la supervivencia.", false], ["B", "seguir exigiéndolo, pero aceptarlo aunque no esté autenticado.", "El artículo 21 del Decreto Ley 019 de 2012 prohíbe exigir certificados de fe de vida. El problema no es la autenticación, sino el certificado mismo.", false], ["C", "dejar de exigirlo y verificar la supervivencia en las bases del registro civil.", "El artículo 21 del Decreto Ley 019 de 2012 ordena verificar la supervivencia consultando únicamente las bases de datos del Registro Civil de la Registraduría Nacional del Estado Civil, servicio gratuito, y prohíbe exigir certificados de fe de vida. Para connacionales en el exterior rige una regla especial (art. 22), que no aplica a este exservidor.", true]]}]}, {"comp": "atencion_procedimiento", "rol": "tecnico", "tag": "Atención al ciudadano y procedimiento administrativo · Nivel técnico · Protección de datos personales: consultas y reclamos", "texto": "Usted es técnico administrativo de la oficina de atención al ciudadano de una corporación autónoma regional, responsable de la base de datos de usuarios de sus trámites. Un usuario radicó un reclamo para que se supriman sus datos de una lista de difusión, pero no indicó la dirección para recibir la respuesta ni describió los hechos. Otro ciudadano radicó en la corporación un reclamo sobre datos que administra exclusivamente una empresa de servicios públicos del municipio. Un tercer ciudadano presentó una consulta para conocer toda la información que la corporación conserva sobre él.", "items": [{"id": "AP-200", "niv": 3, "e": "Frente al reclamo incompleto, la corporación debe", "f": "Ley 1581 de 2012, art. 15, num. 1", "o": [["A", "rechazarlo de plano, porque un reclamo sin descripción de los hechos no puede tramitarse.", "La ley no prevé el rechazo de plano: ordena requerir al interesado para que subsane.", false], ["B", "requerirlo dentro de los cinco días siguientes a la recepción para que subsane, y entender desistido el reclamo si pasan dos meses sin respuesta.", "El numeral 1 del artículo 15 de la Ley 1581 de 2012 dispone que, si el reclamo resulta incompleto, se requiere al interesado dentro de los cinco días siguientes a su recepción para que subsane las fallas, y que, transcurridos dos meses desde el requerimiento sin que presente la información, se entiende que desistió.", true], ["C", "requerir al usuario dentro de los diez días siguientes para que lo complete en el término máximo de un mes, como ocurre con las peticiones incompletas.", "Ese es el régimen general del artículo 17 del CPACA. Para los reclamos de datos personales, la Ley 1581 de 2012 fija reglas propias: requerimiento en cinco días y desistimiento a los dos meses.", false]]}, {"id": "AP-201", "niv": 2, "e": "Frente al reclamo sobre datos que administra la empresa de servicios públicos, la corporación debe", "f": "Ley 1581 de 2012, art. 15, num. 1", "o": [["A", "darle traslado a la empresa en un término máximo de dos días hábiles e informar de la situación al ciudadano.", "El numeral 1 del artículo 15 de la Ley 1581 de 2012 dispone que, si quien recibe el reclamo no es competente para resolverlo, dará traslado a quien corresponda en un término máximo de dos días hábiles e informará de la situación al interesado.", true], ["B", "devolverlo al ciudadano para que lo presente directamente ante la empresa de servicios públicos.", "La ley no autoriza devolver el reclamo: ordena trasladarlo a quien corresponda e informar al interesado.", false], ["C", "remitirlo a la empresa dentro de los cinco días siguientes, como en el derecho de petición ante autoridad sin competencia.", "Para los reclamos de datos personales la ley fija un término especial y más corto: dos días hábiles.", false]]}, {"id": "AP-202", "niv": 3, "e": "La consulta del tercer ciudadano debe atenderse en", "f": "Ley 1581 de 2012, art. 14", "o": [["A", "un máximo de quince días hábiles, prorrogable hasta ocho días hábiles más si se le informan los motivos de la demora.", "Esos son los términos del reclamo (art. 15). La consulta para conocer la información tiene términos más cortos.", false], ["B", "un máximo de diez días hábiles, prorrogable hasta cinco días hábiles más si se le informan los motivos de la demora.", "El artículo 14 de la Ley 1581 de 2012 ordena atender la consulta en un máximo de diez días hábiles desde su recibo. Si no es posible, se informan los motivos y la nueva fecha, que no puede superar los cinco días hábiles siguientes al vencimiento del primer término.", true], ["C", "treinta días hábiles, porque toda consulta ante una autoridad tiene ese término, prorrogable hasta el doble.", "Los treinta días del artículo 14 del CPACA corresponden a las consultas sobre materias a cargo de la autoridad. La consulta de datos personales tiene un régimen especial en la Ley 1581 de 2012.", false]]}]}, {"comp": "atencion_procedimiento", "rol": "general", "tag": "Atención al ciudadano y procedimiento administrativo · Protección de datos personales: autorización", "texto": "La Secretaría de Educación de un municipio certificado administra la base de datos de los beneficiarios de su auxilio de transporte para estudiantes universitarios, todos mayores de edad. La Personería municipal, en ejercicio de sus funciones de vigilancia, pide el listado de beneficiarios con sus nombres, documentos y direcciones. Al mismo tiempo, la secretaría diseña el formulario de inscripción de un nuevo programa voluntario de formación para padres de familia y discute cómo recoger la autorización para el tratamiento de los datos. Además, un beneficiario pide copia de sus propios datos personales que reposan en la base, y un funcionario propone cobrarle.", "items": [{"id": "AP-203", "niv": 3, "e": "Para entregar a la Personería el listado de beneficiarios, la secretaría", "f": "Ley 1581 de 2012, art. 10, lit. a", "o": [["A", "debe obtener previamente la autorización escrita de cada uno de los titulares o sus representantes.", "El literal a del artículo 10 de la Ley 1581 de 2012 exceptúa de la autorización la información requerida por una entidad pública en ejercicio de sus funciones legales.", false], ["B", "solo puede entregarlo si la Personería presenta una orden judicial que lo autorice.", "La orden judicial es una de las causales de excepción, pero no la única: también lo es el requerimiento de una entidad pública en ejercicio de sus funciones legales.", false], ["C", "no requiere la autorización de los titulares, porque una entidad pública la pide en ejercicio de sus funciones legales.", "El literal a del artículo 10 de la Ley 1581 de 2012 dispone que no es necesaria la autorización del titular cuando la información la requiere una entidad pública en ejercicio de sus funciones legales. Quien accede a los datos debe, en todo caso, cumplir la ley.", true]]}, {"id": "AP-204", "niv": 1, "e": "En el nuevo programa voluntario, la autorización para el tratamiento de los datos debe ser", "f": "Ley 1581 de 2012, art. 9", "o": [["A", "previa e informada, y obtenida por cualquier medio que pueda ser objeto de consulta posterior.", "El artículo 9 de la Ley 1581 de 2012 exige que, salvo las excepciones legales, el tratamiento cuente con la autorización previa e informada del titular, obtenida por cualquier medio que pueda ser objeto de consulta posterior.", true], ["B", "otorgada ante notario, para que tenga plena validez frente a terceros.", "La ley no exige formalidad notarial: basta un medio que permita consultarla después.", false], ["C", "verbal y sin registro, porque los padres se inscriben voluntariamente.", "La autorización debe obtenerse por un medio que pueda ser objeto de consulta posterior; una autorización verbal sin registro no lo permite.", false]]}, {"id": "AP-205", "niv": 1, "e": "Frente a la propuesta de cobrar al beneficiario por conocer sus propios datos, lo correcto es señalar que", "f": "Ley 1581 de 2012, art. 8, lit. f", "o": [["A", "puede cobrarse una tarifa fijada por la secretaría, porque la consulta implica trabajo adicional del personal.", "La ley garantiza el acceso gratuito del titular a sus propios datos.", false], ["B", "el titular tiene derecho a acceder en forma gratuita a sus datos personales que han sido objeto de tratamiento.", "El literal f del artículo 8 de la Ley 1581 de 2012 reconoce al titular el derecho a acceder en forma gratuita a sus datos personales que hayan sido objeto de tratamiento.", true], ["C", "puede cobrarse si la consulta se hace más de una vez en el mismo año.", "La Ley 1581 de 2012 no limita la gratuidad del acceso del titular a sus propios datos según el número de consultas.", false]]}]}, {"comp": "gestion_publica", "rol": "tecnico", "tag": "Gestión pública, MIPG, contratación y documentos · Nivel técnico · Control interno: objetivos y funciones", "texto": "Usted es técnico administrativo de la Secretaría de Hacienda de un municipio del Huila y apoya la inducción de los nuevos servidores. Durante la charla sobre el sistema de control interno, un auxiliar pregunta para qué sirve el control interno si «ya existe la contraloría»; otro pregunta qué hace concretamente la Oficina de Control Interno y si existe alguna instancia de alto nivel que coordine el sistema dentro de la alcaldía.", "items": [{"id": "GP-119", "niv": 1, "e": "Para responder al primer auxiliar, usted explica que uno de los objetivos del sistema de control interno es", "f": "Ley 87 de 1993, art. 2, lit. a", "o": [["A", "proteger los recursos de la organización y procurar su adecuada administración frente a los riesgos.", "El artículo 2, literal a, de la Ley 87 de 1993 señala como objetivo del sistema proteger los recursos de la organización, buscando su adecuada administración ante posibles riesgos.", true], ["B", "adelantar los procesos disciplinarios contra los servidores que incumplan los procedimientos.", "La potestad disciplinaria la ejerce
