<style>
:root{--bg:#f6f8fb;--card:#fff;--ink:#1d2433;--mute:#5a6478;--line:#dbe1ea;--pri:#0b3d6e;--pri2:#1660a8;--ok:#0d6b3a;--okbg:#e6f4ec;--no:#9b1c1c;--nobg:#fbeaea;--sel:#e8f0fa}
@media (prefers-color-scheme: dark){:root{--bg:#10151d;--card:#18202b;--ink:#e6ebf2;--mute:#9aa6b8;--line:#2a3545;--pri:#7fb3ea;--pri2:#9cc6f2;--ok:#7fd3a3;--okbg:#16301f;--no:#f2a3a3;--nobg:#3a1c1c;--sel:#1e2d40}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px}

h1{font-size:17px;margin:0;color:var(--pri)}
.stat{font-size:14px;color:var(--mute)}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--pri)}
.timer.low{color:var(--no)}
main{max-width:860px;margin:0 auto;padding:16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin:0 0 16px}
.caso{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--pri);border-radius:10px;padding:14px 16px;margin:22px 0 10px}
.tag{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--pri);font-weight:700}
.caso p{margin:6px 0 0;white-space:pre-line}
.item{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0}
.enun{margin:0 0 8px}
.n{font-weight:700;color:var(--pri)}
.niv{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-right:4px;white-space:nowrap}
.op{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:6px 0;cursor:pointer;background:transparent;width:100%;text-align:left;color:inherit;font:inherit}
.op:hover{border-color:var(--pri2)}
.op .l{font-weight:700;min-width:20px}
.op.sel{background:var(--sel);border-color:var(--pri2)}
.op.ok{background:var(--okbg);border-color:var(--ok)}
.op.no{background:var(--nobg);border-color:var(--no)}
.op[disabled]{cursor:default}
.just{font-size:14px;margin:8px 0 0;padding:8px 10px;border-top:1px dashed var(--line)}
.just div{margin:4px 0}
.just .okt{color:var(--ok);font-weight:700}
.just .not{color:var(--no);font-weight:700}
.src{font-size:13px;color:var(--mute);margin-top:6px}
button.btn{background:var(--pri);color:var(--card);border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer}
button.btn.sec{background:transparent;color:var(--pri);border:1px solid var(--pri)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
select{font:inherit;padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);max-width:100%}
table{border-collapse:collapse;width:100%;font-size:15px}
td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
.big{font-size:40px;font-weight:800;color:var(--pri);line-height:1.1}
.aviso{font-size:13px;color:var(--mute)}
.hide{display:none !important}
.res-ok{color:var(--ok);font-weight:700}.res-no{color:var(--no);font-weight:700}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal .panel{max-width:420px}
footer{max-width:860px;margin:0 auto;padding:8px 16px 40px;font-size:12px;color:var(--mute)}
</style>

<footer><a href="./" style="color:var(--pri);font-weight:600">← Volver al menú</a><br><br>Material de preparación independiente. No está afiliado a la Comisión Nacional del Servicio Civil (CNSC) ni a ninguna entidad pública, y no contiene preguntas reales de la prueba.</footer>
<script>
const DATA = [{"comp": "estado_constitucion", "rol": "general", "tag": "Estado y Constitución · Acción de cumplimiento", "texto": "Usted es técnico administrativo de la Secretaría de Planeación de un municipio de cuarta categoría. Un acto administrativo general vigente obliga a la secretaría a publicar cada trimestre en la página web el listado de licencias de intervención del espacio público otorgadas. Hace un año no se publica. El 3 de marzo, un ciudadano radicó un escrito pidiendo que se cumpla esa obligación y anunció que, si no le responden, demandará. Además, otra ciudadana pregunta si puede usar la misma acción para obligar al municipio a construir un parque que ordenó un acuerdo municipal, aunque la obra no tiene recursos apropiados.", "items": [{"id": "EC-113", "niv": 2, "e": "Para que la demanda del ciudadano sea procedente, como regla general se requiere que", "f": "Ley 393 de 1997, art. 8", "o": [["A", "hayan transcurrido tres meses sin respuesta, para que se configure el silencio administrativo negativo.", "El silencio negativo de tres meses es una figura del procedimiento administrativo general. La renuencia para la acción de cumplimiento se configura si la autoridad no contesta dentro de diez días o se ratifica en el incumplimiento.", false], ["B", "haya interpuesto los recursos de reposición y apelación contra la decisión de la secretaría que niega el cumplimiento del acto.", "La Ley 393 no exige agotar recursos administrativos. El requisito de procedibilidad es la constitución de la renuencia mediante la reclamación previa.", false], ["C", "haya reclamado antes el cumplimiento y la autoridad se haya negado o no haya respondido en los diez días siguientes.", "El artículo 8 de la Ley 393 de 1997 exige, para constituir la renuencia, que el accionante haya reclamado previamente el cumplimiento y que la autoridad se ratifique en el incumplimiento o no conteste dentro de los diez días siguientes. Solo se exceptúa ante el inminente peligro de un perjuicio irremediable.", true]]}, {"id": "EC-114", "niv": 1, "e": "Si el ciudadano presenta la demanda, en primera instancia será competente", "f": "Ley 393 de 1997, art. 3, en concordancia con las reglas de competencia de la Ley 1437 de 2011", "o": [["A", "el juez civil municipal, por dirigirse contra una autoridad del orden municipal.", "La regla de reparto de jueces municipales corresponde a la tutela contra autoridades territoriales (Decreto 333 de 2021). La acción de cumplimiento tiene una regla propia en la Ley 393.", false], ["B", "el juez administrativo con competencia en el domicilio del accionante.", "El artículo 3 de la Ley 393 de 1997 asigna la primera instancia de la acción de cumplimiento a los jueces administrativos con competencia en el domicilio del accionante, y la segunda al tribunal administrativo del respectivo departamento; las reglas de competencia de la Ley 1437 de 2011 mantienen el conocimiento en la jurisdicción de lo contencioso administrativo.", true], ["C", "el tribunal administrativo del departamento, por tratarse de una acción constitucional.", "El tribunal administrativo conoce de la segunda instancia. La primera corresponde a los jueces administrativos (art. 3 de la Ley 393 de 1997).", false]]}, {"id": "EC-115", "niv": 3, "e": "Frente a la pregunta de la ciudadana sobre el parque, usted debe orientarla en el sentido de que la acción de cumplimiento", "f": "Ley 393 de 1997, art. 9, parágrafo", "o": [["A", "no procede, porque esta acción no puede perseguir el cumplimiento de normas que establezcan gastos.", "El parágrafo del artículo 9 de la Ley 393 de 1997 dispone que la acción de cumplimiento no puede perseguir el cumplimiento de normas que establezcan gastos. Construir el parque implica ejecutar un gasto.", true], ["B", "procede, pero debe tramitarse como tutela por tratarse del derecho a la recreación.", "El juez da trámite de tutela cuando se buscan proteger derechos garantizables por esa vía (art. 9, inc. 1), pero exigir la construcción de una obra que implica gasto no es la protección de un derecho fundamental concreto. La razón de la improcedencia es el parágrafo del artículo 9.", false], ["C", "procede, siempre que el parque esté incluido en el plan de desarrollo municipal.", "La inclusión en el plan de desarrollo no cambia la regla: el parágrafo del artículo 9 de la Ley 393 prohíbe usar esta acción para exigir el cumplimiento de normas que establezcan gastos.", false]]}]}, {"comp": "estado_constitucion", "rol": "general", "tag": "Estado y Constitución · Organización electoral", "texto": "Usted es auxiliar administrativo de la Secretaría de Gobierno de un municipio de quinta categoría. Se acerca una jornada de votación y la secretaría debe coordinar con las autoridades electorales la logística de los puestos. Una ciudadana pregunta quién organiza las elecciones y quién expide las cédulas. Por otra parte, un amigo suyo que trabaja como técnico en la personería municipal le cuenta que quiere hacer campaña, en sus horas libres, por un candidato al concejo.", "items": [{"id": "EC-128", "niv": 1, "e": "Al explicar a la ciudadana qué entidades conforman la organización electoral, usted debe mencionar", "f": "Constitución Política, art. 120", "o": [["A", "al Consejo Nacional Electoral y a las secretarías de gobierno de los municipios donde se instalan los puestos de votación.", "Las alcaldías apoyan la logística, pero no integran la organización electoral, que la Constitución conforma con el Consejo Nacional Electoral y la Registraduría.", false], ["B", "a la Registraduría Nacional del Estado Civil y a la Procuraduría General de la Nación.", "La Procuraduría vigila la conducta oficial de los servidores, también en época electoral, pero no forma parte de la organización electoral según el artículo 120.", false], ["C", "al Consejo Nacional Electoral, a la Registraduría Nacional del Estado Civil y a los demás organismos que fije la ley.", "El artículo 120 de la Constitución dispone que la organización electoral está conformada por el Consejo Nacional Electoral, por la Registraduría Nacional del Estado Civil y por los demás organismos que establezca la ley.", true]]}, {"id": "EC-129", "niv": 1, "e": "Sobre quién dirige y organiza las elecciones y tiene a su cargo la identificación de las personas, lo correcto es responder que corresponde", "f": "Constitución Política, arts. 265 y 266", "o": [["A", "al Registrador Nacional del Estado Civil, según la Constitución.", "El artículo 266 de la Constitución asigna al Registrador Nacional del Estado Civil la dirección y organización de las elecciones, el registro civil y la identificación de las personas.", true], ["B", "al alcalde municipal, como primera autoridad electoral del municipio.", "El alcalde no es autoridad electoral. La dirección y organización de las elecciones y la identificación corresponden al Registrador Nacional (art. 266).", false], ["C", "al Consejo Nacional Electoral, que expide las cédulas a través de sus delegados.", "Al Consejo Nacional Electoral le corresponde la suprema inspección y vigilancia de la organización electoral (art. 265), no la expedición de documentos de identidad.", false]]}, {"id": "EC-130", "niv": 2, "e": "Frente a la intención de su amigo de hacer campaña en sus horas libres, usted debe advertirle que", "f": "Constitución Política, art. 127", "o": [["A", "puede hacerlo si solicita una licencia no remunerada durante el periodo de campaña.", "La licencia no levanta la prohibición constitucional, que se deriva de la calidad de empleado de un órgano de control.", false], ["B", "no puede participar en actividades de partidos ni en controversias políticas, aunque sí puede votar.", "El artículo 127 de la Constitución prohíbe a los empleados del Estado que se desempeñan en la Rama Judicial y en los órganos electorales, de control y de seguridad tomar parte en las actividades de los partidos y en las controversias políticas, sin perjuicio de ejercer libremente el derecho al sufragio. La personería es un órgano de control.", true], ["C", "puede hacerlo fuera del horario laboral, siempre que no use bienes ni recursos de la personería municipal.", "La prohibición para los empleados de los órganos de control no depende del horario ni de los bienes usados: el artículo 127 les prohíbe tomar parte en actividades de partidos y controversias políticas.", false]]}]}, {"comp": "estado_constitucion", "rol": "general", "tag": "Estado y Constitución · Órganos de control: competencias", "texto": "Usted es auxiliar administrativo de la Secretaría General de una alcaldía de segunda categoría. Un informe periodístico revela que en un contrato de suministro de alimentos escolares se pagaron raciones que nunca se entregaron, con la presunta participación del supervisor, un servidor municipal. El alcalde pide a su oficina preparar una ficha para la comunidad que explique qué autoridades externas pueden intervenir y qué alcance tiene cada actuación.", "items": [{"id": "EC-143", "niv": 1, "e": "En la ficha debe indicarse que la determinación del daño patrimonial y de quién debe resarcirlo corresponde a", "f": "Constitución Política, arts. 119 y 272", "o": [["A", "la personería municipal, porque vigila la conducta oficial de los servidores municipales que intervinieron en el contrato.", "La personería vigila la conducta oficial y ejerce funciones disciplinarias, pero no establece responsabilidad fiscal por el daño patrimonial.", false], ["B", "la contraloría competente, porque tiene a su cargo la vigilancia de la gestión fiscal.", "El artículo 119 asigna a la Contraloría la vigilancia de la gestión fiscal y el control de resultado de la administración; en el nivel territorial, el artículo 272 asigna esa vigilancia a las contralorías territoriales. Ellas establecen la responsabilidad fiscal.", true], ["C", "el concejo municipal, mediante un debate de control político al alcalde.", "El control político del concejo no determina responsabilidades patrimoniales; esa es una función de las contralorías.", false]]}, {"id": "EC-144", "niv": 2, "e": "Respecto de la conducta del supervisor como servidor municipal, una autoridad externa que puede ejercer preferentemente la función disciplinaria es", "f": "Ley 136 de 1994, art. 178, num. 4", "o": [["A", "la personería municipal, respecto de los servidores públicos del municipio.", "El numeral 4 del artículo 178 de la Ley 136 de 1994 asigna al personero vigilar la conducta oficial de quienes desempeñan funciones públicas municipales y ejercer preferentemente la función disciplinaria respecto de los servidores públicos municipales.", true], ["B", "el concejo municipal, por medio de la moción de censura.", "La moción de censura es un instrumento de control político frente a secretarios del alcalde; no es un proceso disciplinario contra servidores como el supervisor.", false], ["C", "la contraloría departamental, en el mismo proceso de responsabilidad fiscal.", "La contraloría establece responsabilidad fiscal, no disciplinaria. Si encuentra posibles faltas, debe dar traslado a la autoridad disciplinaria competente.", false]]}, {"id": "EC-145", "niv": 2, "e": "Si además se abre una investigación penal, los resultados de las indagaciones preliminares o del proceso de responsabilidad fiscal que adelante la contraloría", "f": "Constitución Política, art. 271 (modificado por el Acto Legislativo 4 de 2019)", "o": [["A", "carecen de valor en el proceso penal, porque son actuaciones administrativas ajenas a la jurisdicción penal.", "El artículo 271 dispone expresamente lo contrario: esos resultados tienen valor probatorio ante la Fiscalía y el juez.", false], ["B", "solo pueden usarse si la Procuraduría los valida previamente.", "La Constitución no condiciona el valor probatorio de esos resultados a una validación de la Procuraduría.", false], ["C", "tendrán valor probatorio ante la Fiscalía General de la Nación y el juez competente.", "El artículo 271 de la Constitución, modificado por el Acto Legislativo 4 de 2019, dispone que los resultados de los ejercicios de vigilancia y control fiscal, así como de las indagaciones preliminares o los procesos de responsabilidad fiscal adelantados por las contralorías, tienen valor probatorio ante la Fiscalía General de la Nación y el juez competente.", true]]}]}, {"comp": "estado_constitucion", "rol": "general", "tag": "Estado y Constitución · Principios de la función administrativa", "texto": "Usted es técnico de la Secretaría Distrital de Hábitat de Bogotá y participa en la evaluación de solicitudes de un subsidio de mejoramiento de vivienda. Durante la semana ocurren tres situaciones: un compañero advierte que su hermano es uno de los solicitantes; la Secretaría de Integración Social y la de Hábitat programaron, por separado, visitas a las mismas familias del mismo barrio; y el director de un pequeño instituto adscrito afirma que el control interno es obligatorio solo para las entidades nacionales.", "items": [{"id": "EC-155", "niv": 1, "e": "Que el compañero se aparte de evaluar la solicitud de su hermano responde principalmente al principio de", "f": "Constitución Política, art. 209; Ley 489 de 1998, art. 3", "o": [["A", "economía.", "La economía se refiere al uso racional de recursos y a evitar trámites innecesarios, no a la neutralidad de quien decide.", false], ["B", "celeridad.", "La celeridad busca que las actuaciones se adelanten sin dilaciones. Apartarse de un asunto por un vínculo familiar no tiene que ver con la rapidez del trámite.", false], ["C", "imparcialidad.", "El artículo 209 de la Constitución incluye la imparcialidad entre los principios de la función administrativa. Apartarse de evaluar la solicitud de un familiar garantiza que la decisión no se vea influida por intereses personales.", true]]}, {"id": "EC-156", "niv": 2, "e": "Para resolver la duplicidad de visitas entre las dos secretarías, el principio que debe guiar la actuación es el de", "f": "Constitución Política, art. 209; Ley 489 de 1998, art. 6", "o": [["A", "publicidad, porque las familias deben conocer con anticipación las fechas de cada visita.", "Informar las fechas es útil, pero no evita la duplicidad. El problema es la falta de armonía entre entidades, que se resuelve con la coordinación.", false], ["B", "coordinación, porque las autoridades deben armonizar sus actuaciones para cumplir los fines del Estado.", "El artículo 209 de la Constitución ordena a las autoridades administrativas coordinar sus actuaciones para el adecuado cumplimiento de los fines del Estado, y el artículo 6 de la Ley 489 exige garantizar la armonía en el ejercicio de sus funciones.", true], ["C", "desconcentración, porque cada secretaría debe radicar sus visitas en las alcaldías locales correspondientes al barrio.", "La desconcentración es una forma de distribuir competencias hacia dependencias fuera de la sede principal; no resuelve la duplicidad entre dos entidades distintas.", false]]}, {"id": "EC-157", "niv": 2, "e": "Frente a la afirmación del director del instituto, lo correcto es señalar que", "f": "Constitución Política, arts. 209 y 269", "o": [["A", "la administración pública, en todos sus órdenes, debe tener control interno en los términos de la ley.", "El artículo 209 de la Constitución dispone que la administración pública, en todos sus órdenes, tendrá un control interno que se ejercerá en los términos que señale la ley; el artículo 269 obliga a las autoridades a diseñar y aplicar métodos y procedimientos de control interno.", true], ["B", "en el Distrito el control interno lo ejerce de forma exclusiva la Personería de Bogotá.", "La personería ejerce funciones de Ministerio Público, no el control interno de cada entidad, que es un deber de las propias autoridades (art. 269).", false], ["C", "el control interno es exigible solo a las entidades nacionales; en las territoriales lo sustituye la contraloría.", "El control fiscal externo no sustituye el control interno. El artículo 209 lo exige a la administración pública en todos sus órdenes.", false]]}]}, {"comp": "estado_constitucion", "rol": "general", "tag": "Estado y Constitución · Cabildo abierto", "texto": "Usted es técnico administrativo de la secretaría general del concejo de un municipio de tercera categoría. Un grupo de residentes quiere que en un cabildo abierto se discuta el cierre de una vía principal por obras, y pretende citar al alcalde para que responda un cuestionario. Los promotores preguntan cuántos apoyos necesitan, si el alcalde está obligado a asistir y qué pasa con las respuestas que se den en el cabildo. El municipio tiene un censo electoral de 48.000 ciudadanos.", "items": [{"id": "EC-167", "niv": 2, "e": "Para que el cabildo se realice, la iniciativa debe contar con el respaldo de un número de ciudadanos no inferior a", "f": "Ley 1757 de 2015, art. 22", "o": [["A", "el cinco por mil del censo electoral, es decir, 240 ciudadanos.", "El artículo 22 de la Ley 1757 de 2015 exige la iniciativa de un número no inferior al cinco por mil de los ciudadanos del censo electoral del respectivo municipio. Con 48.000 ciudadanos, el cinco por mil es 48.000 × 5 / 1.000 = 240.", true], ["B", "el cinco por ciento del censo electoral, es decir, 2.400 ciudadanos.", "Confunde el cinco por mil con el cinco por ciento, que es la proporción exigida para otras iniciativas, como el referendo constitucional o la iniciativa legislativa (art. 9).", false], ["C", "el diez por ciento del censo electoral, es decir, 4.800 ciudadanos.", "No existe ese umbral para el cabildo abierto. La Ley 1757 exige el cinco por mil del censo electoral.", false]]}, {"id": "EC-168", "niv": 3, "e": "Sobre la citación al alcalde, debe informarse a los promotores que", "f": "Ley 1757 de 2015, arts. 22 y 23", "o": [["A", "la asistencia del alcalde es voluntaria, porque el cabildo es una sesión del concejo y no de la administración.", "Aunque el cabildo se celebra en la corporación, la ley impone al alcalde la obligación de asistir (art. 22).", false], ["B", "el alcalde puede delegar su asistencia en el secretario de obras, quien responderá el cuestionario.", "La ley establece que es obligación del alcalde o gobernador asistir al cabildo abierto (art. 22); no prevé que se cumpla mediante delegación.", false], ["C", "el alcalde debe asistir, y el cuestionario debe remitírsele con mínimo cinco días de antelación.", "El artículo 22 de la Ley 1757 de 2015 establece que es obligación del alcalde o gobernador asistir al cabildo abierto, y el artículo 23 dispone que el cuestionario formulado al funcionario se remite por el presidente de la corporación con mínimo cinco días de antelación a la celebración del cabildo.", true]]}, {"id": "EC-169", "niv": 3, "e": "Respecto de las respuestas a los planteamientos del cabildo, lo correcto es explicar que", "f": "Ley 1757 de 2015, art. 28", "o": [["A", "las respuestas son simples recomendaciones, porque el cabildo no es un mecanismo de decisión vinculante en ningún caso.", "La ley dispone expresamente que los compromisos decisorios que incluyan las respuestas son obligatorios y deben ejecutarse (art. 28).", false], ["B", "una semana después se hará una sesión con las respuestas razonadas, y los compromisos decisorios que se adquieran serán obligatorios.", "El artículo 28 de la Ley 1757 de 2015 dispone que una semana después del cabildo se realiza una sesión en la que se exponen las respuestas razonadas del mandatario y de la corporación, y que los compromisos decisorios incluidos en las respuestas son obligatorios, previo cumplimiento de las normas aplicables.", true], ["C", "las respuestas deben darse por escrito dentro de los quince días hábiles siguientes, como un derecho de petición.", "El cabildo abierto tiene una regla propia: una sesión una semana después con respuestas razonadas (art. 28). No se tramita como derecho de petición.", false]]}]}, {"comp": "estado_constitucion", "rol": "general", "tag": "Estado y Constitución · Habeas data: datos sensibles y reclamos", "texto": "Usted es auxiliar administrativo de la Secretaría de la Mujer de un departamento, que construye una base de datos de participantes en un programa de emprendimiento. El formulario pregunta, entre otros datos, por el origen étnico de las participantes. Una participante presentó una queja directamente ante la Superintendencia de Industria y Comercio sin haber reclamado antes a la secretaría. Otra participante pide conocer los datos suyos que reposan en la base y que se le muestre la autorización que firmó al inscribirse; un funcionario propone cobrarle la consulta como si fuera una solicitud de copias y negarle la autorización por ser un documento interno.", "items": [{"id": "EC-182", "niv": 3, "e": "Para recolectar el dato sobre origen étnico, la secretaría debe", "f": "Ley 1581 de 2012, arts. 5 y 6", "o": [["A", "informar verbalmente a la participante, porque los datos sobre origen étnico son de naturaleza pública.", "El origen étnico no es un dato público sino sensible (art. 5), por lo que su tratamiento requiere autorización explícita.", false], ["B", "recogerlo sin autorización, porque toda información recolectada por una entidad pública está exceptuada.", "La excepción del artículo 10 se refiere a información requerida por una entidad en ejercicio de funciones legales, y no elimina las reglas especiales para datos sensibles; no toda recolección pública está exceptuada.", false], ["C", "contar con la autorización explícita de la titular, salvo los casos en que la ley no la exija.", "El origen racial o étnico es un dato sensible (art. 5 de la Ley 1581 de 2012). El artículo 6 prohíbe su tratamiento, salvo, entre otros casos, cuando la titular haya dado su autorización explícita, excepto cuando la ley no la requiera.", true]]}, {"id": "EC-183", "niv": 1, "e": "Sobre la queja presentada directamente ante la Superintendencia de Industria y Comercio, debe tenerse en cuenta que", "f": "Ley 1581 de 2012, art. 16", "o": [["A", "debe presentarse primero ante la Procuraduría, que la remitirá luego a la Superintendencia.", "La Procuraduría no es instancia previa en materia de habeas data. El requisito es agotar la consulta o el reclamo ante el responsable o encargado.", false], ["B", "solo puede elevarse después de agotar la consulta o el reclamo ante el responsable.", "El artículo 16 de la Ley 1581 de 2012 dispone que el titular o causahabiente solo podrá elevar queja ante la Superintendencia de Industria y Comercio una vez haya agotado el trámite de consulta o reclamo ante el responsable o el encargado del tratamiento.", true], ["C", "procede de inmediato, porque la Superintendencia es la autoridad de protección de datos.", "La Superintendencia es la autoridad competente, pero la ley exige un requisito de procedibilidad previo: agotar la consulta o el reclamo ante el responsable.", false]]}, {"id": "EC-184", "niv": 2, "e": "Frente a la solicitud de la otra participante, la secretaría debe", "f": "Ley 1581 de 2012, art. 8, lits. b y f", "o": [["A", "darle acceso gratuito a sus datos y entregarle prueba de la autorización que otorgó al inscribirse.", "El artículo 8 de la Ley 1581 de 2012 reconoce al titular, entre otros, los derechos a solicitar prueba de la autorización otorgada al responsable del tratamiento (lit. b) y a acceder en forma gratuita a sus datos personales que hayan sido objeto de tratamiento (lit. f).", true], ["B", "mostrarle la autorización, pero exigirle una orden judicial para conocer los datos que reposan en la base.", "El titular no necesita orden judicial para conocer sus propios datos: el artículo 8, literal f, le garantiza el acceso gratuito, y el artículo 14 regula la consulta directa ante el responsable.", false], ["C", "cobrarle la consulta según la tarifa de copias y negarle la autorización, por ser un documento interno de la entidad.", "El literal f del artículo 8 de la Ley 1581 garantiza al titular el acceso gratuito a sus datos personales objeto de tratamiento, y el literal b le permite solicitar prueba de la autorización otorgada; ese documento no le es oponible como interno.", false]]}]}, {"comp": "estado_constitucion", "rol": "general", "tag": "Estado y Constitución · Enfoque diferencial y diversidad étnica", "texto": "Usted es técnico administrativo de la Secretaría de Desarrollo Social de un departamento con presencia de comunidades indígenas. Varias mujeres de una comunidad que habla su lengua propia acuden a inscribirse en un programa de apoyo a artesanas. Un compañero propone exigir que diligencien el formulario en castellano. Por otra parte, el programa reserva el 30 % de los cupos a mujeres indígenas artesanas, y un ciudadano no indígena presenta una petición en la que califica esa reserva como discriminatoria. La coordinación también propone asignar puntaje adicional en la selección a mujeres con discapacidad.", "items": [{"id": "EC-197", "niv": 1, "e": "Frente a la propuesta de exigir el formulario en castellano, la actuación acorde con la Constitución es", "f": "Constitución Política, art. 7", "o": [["A", "remitir a las mujeres a la autoridad indígena para que ella tramite la inscripción en su nombre.", "Trasladar el trámite a la autoridad indígena no garantiza la atención directa por parte de la secretaría, que es la responsable del programa.", false], ["B", "exigir el castellano, porque es el idioma oficial de Colombia y garantiza la igualdad de trato en el trámite.", "Imponer el castellano sin apoyo excluye a quienes hablan una lengua propia. El artículo 7 obliga al Estado a reconocer y proteger la diversidad étnica y cultural.", false], ["C", "adaptar la atención, por ejemplo con un intérprete, porque el Estado protege la diversidad étnica y cultural.", "El artículo 7 de la Constitución dispone que el Estado reconoce y protege la diversidad étnica y cultural de la Nación. Adaptar la atención a la lengua de las solicitantes materializa ese mandato y el enfoque diferencial.", true]]}, {"id": "EC-198", "niv": 2, "e": "La asignación de puntaje adicional a mujeres con discapacidad en la selección del programa corresponde a", "f": "Ley 1618 de 2013, art. 2, num. 3", "o": [["A", "un ajuste razonable, porque adapta el entorno físico del programa a sus necesidades.", "Un ajuste razonable adapta condiciones concretas para permitir el ejercicio de un derecho; el puntaje adicional no adapta el entorno, sino que favorece al grupo para reducir desigualdades, lo que es una acción afirmativa.", false], ["B", "una acción afirmativa, dirigida a favorecer a personas con discapacidad para reducir las desigualdades que las afectan.", "El numeral 3 del artículo 2 de la Ley 1618 de 2013 define las acciones afirmativas como políticas, medidas o acciones dirigidas a favorecer a personas o grupos con algún tipo de discapacidad, con el fin de eliminar o reducir las desigualdades y barreras que los afectan.", true], ["C", "un trato discriminatorio prohibido, porque otorga una ventaja a un grupo frente a los demás aspirantes.", "El artículo 13 de la Constitución ordena adoptar medidas en favor de grupos discriminados o marginados; las acciones afirmativas razonables no son discriminación prohibida.", false]]}, {"id": "EC-199", "niv": 3, "e": "En la respuesta a la petición del ciudadano que considera discriminatoria la reserva de cupos, la secretaría debe explicar que la medida", "f": "Constitución Política, art. 13, inc. 2", "o": [["A", "es compatible con la igualdad si busca reducir una desigualdad real del grupo y es razonable y proporcionada.", "El inciso 2 del artículo 13 de la Constitución ordena al Estado promover las condiciones para que la igualdad sea real y efectiva y adoptar medidas en favor de grupos discriminados o marginados. Una reserva de cupos razonable y proporcionada que atienda una desigualdad real es una medida de ese tipo.", true], ["B", "es legítima sin necesidad de justificación, porque los programas sociales son decisiones discrecionales del gobernador.", "Las medidas diferenciadas deben estar justificadas y ser razonables y proporcionadas; la discrecionalidad no exime de respetar la igualdad.", false], ["C", "está prohibida, porque el artículo 13 impide cualquier trato diferente por razones de sexo o de raza.", "El artículo 13 prohíbe la discriminación, pero su inciso 2 ordena al Estado adoptar medidas en favor de grupos discriminados o marginados. Un trato diferente justificado no es discriminación.", false]]}]}, {"comp": "empleo_publico", "rol": "general", "tag": "Empleo público, carrera y régimen disciplinario · Retiro del servicio", "texto": "En la Secretaría de Salud de un departamento ocurrieron tres situaciones que debe atender la oficina de talento humano, donde usted trabaja: Felipe, técnico de carrera, terminó sus vacaciones el viernes y no se ha vuelto a presentar desde el lunes, sin dar explicación, y ya completa cuatro días hábiles de ausencia; el gobernador, a solicitud de la secretaria de despacho, decidió prescindir del asesor de ese despacho, empleo de libre nombramiento y remoción; y una auxiliar presentó renuncia escrita, libre y espontánea, para dedicarse a un negocio familiar.", "items": [{"id": "EP-123", "niv": 2, "e": "Frente a la situación de Felipe, la entidad puede", "f": "Ley 909 de 2004, art. 41, lit. i; Decreto 1083 de 2015 (abandono del cargo)", "o": [["A", "adelantar el procedimiento para declarar la vacancia del empleo por abandono del cargo, sin perjuicio de la acción disciplinaria.", "El Decreto 1083 de 2015 considera abandono del cargo no reasumir funciones al vencimiento de las vacaciones o dejar de concurrir por tres días consecutivos sin justa causa, y el art. 41, lit. i, de la Ley 909 de 2004 lo prevé como causal de retiro mediante declaratoria de vacancia.", true], ["B", "declararle insubsistente el nombramiento por calificación no satisfactoria en la evaluación del desempeño.", "La insubsistencia por calificación no satisfactoria exige una evaluación con ese resultado; la ausencia injustificada de Felipe corresponde a la causal de abandono del cargo, que es distinta.", false], ["C", "descontarle los días de su próximo período de vacaciones, porque la ausencia sin justificación se compensa con descanso.", "La ausencia injustificada no se compensa con vacaciones; el reglamento la trata como abandono del cargo cuando no se reasumen funciones al vencimiento de las vacaciones o se dejan de prestar por tres días consecutivos.", false]]}, {"id": "EP-124", "niv": 2, "e": "Para retirar al asesor del despacho de Salud, el gobernador debe tener en cuenta que", "f": "Ley 909 de 2004, art. 41, parágrafo 2", "o": [["A", "debe solicitar autorización previa a la Comisión Nacional del Servicio Civil.", "La CNSC administra y vigila la carrera; el retiro de un empleado de libre nombramiento y remoción no requiere su autorización previa.", false], ["B", "debe motivar el acto de insubsistencia y demostrar que el asesor incumplió sus funciones.", "La motivación es exigible para el retiro de los empleados de carrera; la remoción en empleos de libre nombramiento es discrecional y se hace mediante acto no motivado.", false], ["C", "la remoción es discrecional y se hace mediante acto no motivado.", "El parágrafo 2 del art. 41 de la Ley 909 de 2004 dispone que la competencia para remover a los empleados de libre nombramiento y remoción es discrecional y se ejerce mediante acto no motivado, a diferencia del retiro de los de carrera, que es reglado y motivado.", true]]}, {"id": "EP-125", "niv": 1, "e": "En relación con la renuncia de la auxiliar, el retiro del servicio se produce", "f": "Ley 909 de 2004, art. 41, lit. d; Ley 1952 de 2019, art. 38, num. 18", "o": [["A", "solo si la Comisión de Personal emite concepto favorable sobre los motivos de la renuncia.", "La ley no condiciona la aceptación de la renuncia al concepto de la Comisión de Personal; corresponde al nominador aceptarla.", false], ["B", "cuando la autoridad nominadora acepta regularmente la renuncia presentada por la servidora.", "El art. 41, lit. d, de la Ley 909 de 2004 establece como causal de retiro la renuncia regularmente aceptada; mientras no se acepte, la servidora debe seguir en sus funciones (Ley 1952 de 2019, art. 38, num. 18).", true], ["C", "desde el momento en que la auxiliar radica el escrito, aunque la entidad no se pronuncie.", "La causal legal es la renuncia regularmente aceptada; la sola presentación del escrito no produce el retiro.", false]]}]}, {"comp": "empleo_publico", "rol": "general", "tag": "Empleo público, carrera y régimen disciplinario · Sujetos disciplinables y extinción de la acción", "texto": "Usted apoya la oficina de control disciplinario interno de una alcaldía de primera categoría. Llegan tres consultas: un ciudadano presentó queja contra un exinspector de policía que renunció hace cuatro meses, por hechos ocurridos cuando aún estaba en el cargo; otra quejosa, en un proceso distinto, presentó un escrito en el que dice que «retira la queja» porque llegó a un acuerdo con el servidor investigado; y en un tercer proceso se allegó el registro civil de defunción del servidor investigado.", "items": [{"id": "EP-151", "niv": 1, "e": "Frente a la queja contra el exinspector, usted indica que", "f": "Ley 1952 de 2019, art. 25", "o": [["A", "debe archivarse, porque la potestad disciplinaria se pierde cuando el servidor se retira del servicio.", "El Código General Disciplinario dispone lo contrario: los servidores públicos son destinatarios de la ley disciplinaria aunque se encuentren retirados del servicio.", false], ["B", "debe remitirse a la Fiscalía, porque solo la justicia penal puede investigar a quien ya dejó de ser servidor público.", "El retiro no traslada la competencia a la justicia penal; la acción disciplinaria procede contra el exservidor por hechos cometidos en ejercicio del cargo.", false], ["C", "puede tramitarse, porque los servidores públicos siguen siendo disciplinables aunque se hayan retirado del servicio.", "El art. 25 de la Ley 1952 de 2019 establece que son destinatarios de la ley disciplinaria los servidores públicos aunque se encuentren retirados del servicio; los hechos ocurrieron mientras ejercía el cargo.", true]]}, {"id": "EP-152", "niv": 1, "e": "Frente al escrito de la quejosa que «retira la queja», lo procedente es", "f": "Ley 1952 de 2019, art. 32 (modificado por el art. 6 de la Ley 2094 de 2021)", "o": [["A", "citar a audiencia de conciliación entre la quejosa y el servidor para formalizar el acuerdo.", "La acción disciplinaria es pública y no es conciliable entre particulares; el acuerdo no tiene efectos sobre el proceso.", false], ["B", "continuar el trámite, porque el desistimiento del quejoso no extingue la acción disciplinaria.", "El parágrafo del art. 32 de la Ley 1952 de 2019, modificado por la Ley 2094 de 2021, establece que el desistimiento del quejoso no extingue la acción disciplinaria, que el Estado ejerce como titular.", true], ["C", "archivar el proceso, porque el desistimiento expreso del quejoso extingue la acción disciplinaria.", "El desistimiento del quejoso no figura entre las causales de extinción; la ley dice expresamente que no extingue la acción.", false]]}, {"id": "EP-153", "niv": 2, "e": "En el proceso en que se allegó el registro civil de defunción del investigado, corresponde", "f": "Ley 1952 de 2019, art. 32 (modificado por el art. 6 de la Ley 2094 de 2021)", "o": [["A", "declarar extinguida la acción disciplinaria por la muerte del disciplinable.", "El art. 32 de la Ley 1952 de 2019, modificado por la Ley 2094 de 2021, señala como causales de extinción de la acción la muerte del disciplinable, la caducidad y la prescripción.", true], ["B", "suspender el proceso hasta que se cumpla el término de prescripción de cinco años.", "No hay que esperar la prescripción: la muerte es una causal autónoma de extinción de la acción disciplinaria.", false], ["C", "continuar el proceso contra los herederos para que respondan por la falta.", "La responsabilidad disciplinaria es personal; la muerte del disciplinable extingue la acción y no se traslada a los herederos.", false]]}]}, {"comp": "empleo_publico", "rol": "asistencial", "tag": "Empleo público, carrera y régimen disciplinario · Nivel asistencial · Deberes y prohibiciones", "texto": "Usted es auxiliar administrativo del archivo de gestión de la Secretaría General de un municipio de cuarta categoría, que custodia, entre otros, los expedientes de la oficina de control disciplinario interno. Un día ocurren tres situaciones: un abogado que no es sujeto procesal le pide que le deje revisar «solo un momento» el expediente de una investigación disciplinaria contra un funcionario, en la que todavía no se ha formulado pliego de cargos ni se ha ordenado el archivo; un compañero le sugiere pedirle «una colaboración» en dinero a un ciudadano para entregarle más rápido unas copias; y en la ventanilla hay solicitudes de consulta radicadas en orden, pero un concejal amigo de su jefe le pide que atienda primero la suya, que llegó de última y no tiene ninguna prelación legal ni urgencia.", "items": [{"id": "EP-163", "niv": 2, "e": "Frente a la petición del abogado sobre el expediente disciplinario, usted debe", "f": "Ley 1952 de 2019, arts. 38, num. 6, 39, num. 18, y 115; Ley 1437 de 2011, art. 36", "o": [["A", "permitirle revisarlo en su escritorio, porque cualquier persona tiene derecho a examinar los expedientes de la administración.", "El derecho a examinar expedientes del art. 36 de la Ley 1437 de 2011 exceptúa los documentos sujetos a reserva, y la actuación disciplinaria es reservada hasta el pliego de cargos o el archivo definitivo (art. 115 de la Ley 1952 de 2019).", false], ["B", "abstenerse de permitirle el acceso, porque la actuación disciplinaria es reservada en esa etapa y él no es sujeto procesal.", "El art. 115 de la Ley 1952 de 2019 establece que las actuaciones disciplinarias son reservadas hasta que se formule pliego de cargos o se ordene el archivo definitivo, sin perjuicio de los derechos de los sujetos procesales; el art. 39, num. 18, prohíbe dar acceso o exhibir expedientes a personas no autorizadas, y el art. 38, num. 6, impone custodiar la documentación.", true], ["C", "entregarle copia del expediente, siempre que firme el libro de préstamos del archivo y se identifique como abogado.", "Firmar un registro o acreditar la profesión no levanta la reserva legal de la actuación disciplinaria; entregar copias a quien no es sujeto procesal desconoce el art. 115 de la Ley 1952 de 2019.", false]]}, {"id": "EP-164", "niv": 1, "e": "Frente a la sugerencia de su compañero, usted debe tener presente que", "f": "Ley 1952 de 2019, art. 39, num. 3", "o": [["A", "está permitido recibir aportes voluntarios de los ciudadanos si no superan un salario mínimo.", "La ley no establece un monto permitido; está prohibido solicitar, directa o indirectamente, dádivas, regalos, favores o cualquier otro beneficio.", false], ["B", "la conducta solo sería reprochable si el ciudadano presenta una queja formal ante la personería municipal.", "La falta se configura por la conducta, no por la queja; además, la acción disciplinaria puede iniciarse de oficio.", false], ["C", "está prohibido solicitar, directa o indirectamente, dádivas o cualquier otra clase de beneficios.", "El art. 39, num. 3, de la Ley 1952 de 2019 prohíbe a todo servidor solicitar, directa o indirectamente, dádivas, agasajos, regalos, favores o cualquier otra clase de beneficios.", true]]}, {"id": "EP-165", "niv": 2, "e": "Frente a la petición del concejal, usted debe", "f": "Ley 1952 de 2019, art. 38, nums. 13 y 39", "o": [["A", "atender las solicitudes en el orden en que ingresaron, porque no existe prelación legal ni urgencia manifiesta.", "El art. 38, num. 13, de la Ley 1952 de 2019 impone el deber de resolver los asuntos en el orden de ingreso, salvo prelación legal o urgencia manifiesta, y el num. 39 exige respetar el orden de inscripción y de ingreso de solicitudes.", true], ["B", "atenderlo primero si su jefe lo autoriza por escrito, porque así queda soporte de la excepción.", "La autorización del jefe no crea una prelación legal; resolver por fuera del orden de ingreso sin causa legal desconoce el deber del art. 38, num. 13.", false], ["C", "atenderlo primero, porque los miembros de las corporaciones públicas de elección popular tienen prelación en los trámites.", "La ley no otorga prelación general a los concejales en las solicitudes de consulta; el caso indica que no hay prelación legal ni urgencia.", false]]}]}, {"comp": "empleo_publico", "rol": "general", "tag": "Empleo público, carrera y régimen disciplinario · Acoso laboral: sanción, competencia y garantías", "texto": "Una profesional de la Secretaría de la Mujer de un departamento presentó en mayo de 2026 queja por acoso laboral contra su jefe, ambos servidores públicos. Usted, que trabaja en la oficina jurídica, debe responder varias preguntas de la secretaria de despacho: qué consecuencia tendría el acoso si se demuestra, quién es competente para conocer de la falta, hasta cuándo pueden ejercerse las acciones y qué protección tiene la quejosa frente a represalias.", "items": [{"id": "EP-182", "niv": 1, "e": "Si se acredita el acoso laboral, la conducta del jefe se sancionará como", "f": "Ley 1010 de 2006, art. 10", "o": [["A", "falta disciplinaria leve, porque se trata de un conflicto de convivencia entre servidores.", "La Ley 1010 de 2006 no la califica como leve; cuando el autor es servidor público, el acoso acreditado es falta gravísima.", false], ["B", "falta disciplinaria gravísima.", "El art. 10, num. 1, de la Ley 1010 de 2006 establece que el acoso laboral debidamente acreditado se sanciona como falta disciplinaria gravísima cuando su autor es un servidor público.", true], ["C", "contravención de policía, con multa impuesta por el inspector municipal.", "Los inspectores de policía pueden recibir la denuncia como medida preventiva (art. 9), pero la sanción para el servidor autor es la disciplinaria por falta gravísima.", false]]}, {"id": "EP-183", "niv": 2, "e": "Cuando la víctima del acoso es un servidor público, la competencia para conocer de la falta disciplinaria del acosador corresponde", "f": "Ley 1010 de 2006, arts. 12 y 13; Ley 1952 de 2019 (modificada por la Ley 2094 de 2021)", "o": [["A", "al juez laboral del lugar de los hechos.", "Los jueces de trabajo son competentes cuando las víctimas son trabajadores o empleados particulares, no cuando la víctima es servidora pública.", false], ["B", "al inspector de trabajo, que impone directamente la sanción de destitución al servidor que cometió el acoso.", "El inspector de trabajo puede recibir la denuncia a prevención para medidas preventivas, pero no impone sanciones disciplinarias a servidores públicos.", false], ["C", "al Ministerio Público y a las demás autoridades disciplinarias competentes según la ley.", "El art. 12 de la Ley 1010 de 2006 atribuye la competencia al Ministerio Público o a las autoridades disciplinarias judiciales «conforme a las competencias que señala la ley», y el art. 13 remite al procedimiento del Código Disciplinario. Hoy las antiguas salas jurisdiccionales disciplinarias fueron reemplazadas por las Comisiones de Disciplina Judicial, y según la Ley 1952 de 2019 también conocen las oficinas de control disciplinario interno, sin perjuicio del poder preferente de la Procuraduría.", true]]}, {"id": "EP-184", "niv": 3, "e": "Las acciones derivadas del acoso laboral caducan en", "f": "Ley 1010 de 2006, art. 18 (modificado por el art. 1 de la Ley 2209 de 2022)", "o": [["A", "seis meses contados desde la ocurrencia de las conductas.", "Ese era el término original del art. 18 de la Ley 1010 de 2006; la Ley 2209 de 2022 lo amplió a tres años.", false], ["B", "tres años contados desde la ocurrencia de las conductas.", "El art. 18 de la Ley 1010 de 2006, modificado por el art. 1 de la Ley 2209 de 2022, dispone que las acciones derivadas del acoso laboral caducan en tres años a partir de la fecha en que ocurrieron las conductas.", true], ["C", "cinco años contados desde la presentación de la queja.", "Cinco años es el término general de prescripción de la acción disciplinaria del art. 33 de la Ley 1952 de 2019; la caducidad de las acciones de la Ley 1010 de 2006 es de tres años y se cuenta desde las conductas.", false]]}, {"id": "EP-185", "niv": 3, "e": "Si en agosto de 2026 la entidad destituye a la quejosa, y la autoridad competente verifica la ocurrencia de los hechos denunciados, esa decisión", "f": "Ley 1010 de 2006, art. 11", "o": [["A", "carecerá de todo efecto, porque se produjo dentro de los seis meses siguientes a la queja.", "El art. 11, num. 1, de la Ley 1010 de 2006 dispone que la destitución de la víctima que haya ejercido los procedimientos de la ley carece de todo efecto cuando se produce dentro de los seis meses siguientes a la queja, siempre que la autoridad competente verifique la ocurrencia de los hechos.", true], ["B", "será válida, porque la queja de acoso no limita la potestad del nominador.", "La ley establece una garantía contra represalias: la destitución de la víctima dentro de los seis meses siguientes a la queja carece de efecto si se verifican los hechos.", false], ["C", "solo podrá revisarse si la quejosa demuestra que la destitución fue motivada por la queja.", "La garantía legal opera por el hecho objetivo de que la destitución se produzca dentro de los seis meses siguientes a la queja y se verifiquen los hechos.", false]]}]}, {"comp": "empleo_publico", "rol": "general", "tag": "Empleo público, carrera y régimen disciplinario · Código de Integridad del Servicio Público", "texto": "La gestora de integridad de una alcaldía local de Bogotá prepara una jornada de apropiación del Código de Integridad. Recoge tres situaciones para discutir: una auxiliar que organiza su trabajo para resolver con prontitud los trámites, evita reprocesos y cuida los insumos de la oficina; un técnico que aplica exactamente los mismos criterios a todas las solicitudes de ayudas humanitarias, sin importar la afinidad política o la cercanía de los solicitantes; y un contratista de prestación de servicios que pregunta si también debe asistir a la inducción sobre el código.", "items": [{"id": "EP-192", "niv": 1, "e": "La conducta de la auxiliar refleja principalmente el valor de", "f": "Código de Integridad del Servicio Público (Función Pública), adoptado por la Ley 2016 de 2020", "o": [["A", "el respeto.", "El respeto se refiere al trato digno a todas las personas; el caso describe la forma eficiente y cuidadosa de cumplir las tareas.", false], ["B", "la honestidad.", "La honestidad se relaciona con actuar con fundamento en la verdad, con transparencia y rectitud; el caso resalta la prontitud, la eficiencia y el buen uso de los recursos.", false], ["C", "la diligencia.", "En el Código de Integridad del Servicio Público, la diligencia consiste en cumplir los deberes y funciones de la mejor manera posible, con atención, prontitud, destreza y eficiencia, para optimizar el uso de los recursos del Estado, como hace la auxiliar.", true]]}, {"id": "EP-193", "niv": 2, "e": "La conducta del técnico refleja principalmente el valor de", "f": "Código de Integridad del Servicio Público (Función Pública), adoptado por la Ley 2016 de 2020", "o": [["A", "la justicia.", "En el Código de Integridad, la justicia implica actuar con imparcialidad, garantizando los derechos de las personas con equidad, igualdad y sin discriminación, que es lo que hace el técnico al aplicar los mismos criterios a todos.", true], ["B", "la diligencia.", "La diligencia se refiere a la prontitud y eficiencia en el uso de los recursos; el caso resalta que el técnico decide sin favorecer a nadie.", false], ["C", "el compromiso.", "El compromiso se refiere a la disposición permanente para comprender y resolver las necesidades de las personas; el rasgo central del caso es la imparcialidad en la aplicación de criterios.", false]]}, {"id": "EP-194", "niv": 2, "e": "Al contratista de prestación de servicios, la gestora le responde que", "f": "Ley 2016 de 2020, art. 1", "o": [["A", "no debe asistir, porque el Código de Integridad solo obliga a los empleados de carrera administrativa.", "La Ley 2016 de 2020 no limita el código a los empleados de carrera; su implementación incluye la inducción obligatoria para cualquier cargo del Estado y en cualquier modalidad contractual.", false], ["B", "sí debe asistir, porque la implementación del código incluye la capacitación obligatoria de inducción en cualquier modalidad contractual.", "El parágrafo del art. 1 de la Ley 2016 de 2020 entiende por implementación del Código de Integridad, entre otros, la capacitación obligatoria de inducción para cualquier cargo del Estado y en cualquier modalidad contractual.", true], ["C", "puede asistir de forma voluntaria, porque la ley deja a cada entidad la decisión de aplicar el código.", "La Ley 2016 de 2020 ordena a todas las entidades adoptar e implementar el código; las entidades pueden complementarlo, pero no decidir si lo aplican.", false]]}]}, {"comp": "atencion_procedimiento", "rol": "general", "tag": "Atención al ciudadano y procedimiento administrativo · Derecho de petición: falta de competencia", "texto": "Usted trabaja en la Secretaría de Gobierno de un municipio de cuarta categoría. El jueves 18 de marzo de 2027 se recibió por escrito la petición de un ciudadano que solicita a la alcaldía el reconocimiento de su pensión de vejez, que administra Colpensiones, entidad del orden nacional. La alcaldía no tiene ninguna competencia en el asunto. La alcaldía atiende de lunes a viernes y en ese periodo son festivos el lunes 22 de marzo y el jueves 25 y el viernes 26 de marzo de 2027; no hay otros festivos.", "items": [{"id": "AP-110", "niv": 1, "e": "La actuación que corresponde a la Secretaría frente a esta petición es", "f": "Ley 1755 de 2015, art. 1 (art. 21 de la Ley 1437 de 2011)", "o": [["A", "devolverle el escrito al ciudadano para que lo radique directamente ante la entidad competente.", "La ley no autoriza devolver la petición. La carga de remitirla al competente es de la autoridad que la recibió (art. 21 del CPACA).", false], ["B", "responderla de fondo explicando los requisitos para pensionarse, porque la autoridad que recibe una petición debe resolverla.", "La alcaldía no puede decidir sobre una pensión que no administra. La ley prevé para este evento la remisión al competente, no una respuesta de fondo de quien carece de competencia.", false], ["C", "remitirla a Colpensiones, informar al ciudadano la falta de competencia y enviarle copia del oficio remisorio.", "El artículo 21 del CPACA ordena que, si la autoridad no es competente, informe al interesado y remita la petición al competente, enviando copia del oficio remisorio al peticionario.", true]]}, {"id": "AP-111", "niv": 3, "e": "Como la petición se presentó por escrito, el último día que tiene la Secretaría para informar al ciudadano y remitir la solicitud es el", "f": "Ley 1755 de 2015, art. 1 (art. 21 de la Ley 1437 de 2011); cálculo de días hábiles", "o": [["A", "martes 23 de marzo de 2027.", "Resulta de contar cinco días calendario (19 a 23 de marzo). El término es de días hábiles, por lo que se excluyen fines de semana y festivos.", false], ["B", "lunes 29 de marzo de 2027.", "Resulta de contar el mismo día de la recepción como primer día. El término de cinco días se cuenta a partir del día siguiente al de la recepción.", false], ["C", "martes 30 de marzo de 2027.", "Si se obró por escrito, el plazo es de cinco días siguientes a la recepción: 19 de marzo (1), 23 (2), 24 (3), 29 (4) y 30 (5). Se excluyen el fin de semana y los festivos del 22, 25 y 26 de marzo.", true]]}, {"id": "AP-112", "niv": 2, "e": "El término para que Colpensiones resuelva la petición se cuenta a partir", "f": "Ley 1755 de 2015, art. 1 (art. 21 de la Ley 1437 de 2011)", "o": [["A", "del día siguiente a aquel en que Colpensiones reciba la petición.", "El artículo 21 del CPACA dispone que los términos para decidir o responder se cuentan a partir del día siguiente a la recepción de la petición por la autoridad competente.", true], ["B", "del día siguiente a la radicación en la alcaldía, porque la remisión no interrumpe el término inicial.", "La ley fija un punto de partida distinto: la recepción por la autoridad competente. El tiempo que la petición estuvo en la alcaldía no se descuenta del plazo de Colpensiones.", false], ["C", "de la fecha en que el ciudadano reciba la copia del oficio remisorio enviado por la alcaldía.", "La copia del oficio remisorio informa al ciudadano, pero no marca el inicio del término. Este depende de la recepción por la autoridad competente.", false]]}]}, {"comp": "atencion_procedimiento", "rol": "general", "tag": "Atención al ciudadano y procedimiento administrativo · Firmeza de los actos administrativos", "texto": "En la oficina jurídica de una alcaldía de segunda categoría se lleva el control de firmeza de varias resoluciones de carácter particular. La primera, que niega una solicitud de reconocimiento de un auxilio funerario, se notificó personalmente y el interesado no presentó recurso alguno. La segunda fue recurrida en reposición y en subsidio apelación; ambos recursos ya fueron resueltos y las decisiones se notificaron. En la tercera, el interesado presentó reposición, pero días después radicó un escrito en el que desiste del recurso, y la alcaldía aceptó el desistimiento.", "items": [{"id": "AP-137", "niv": 1, "e": "La primera resolución, contra la cual no se presentaron recursos, quedó en firme", "f": "Ley 1437 de 2011, art. 87, num. 3", "o": [["A", "desde el día siguiente al vencimiento del término para interponer los recursos.", "El numeral 3 del artículo 87 del CPACA dispone que el acto queda en firme desde el día siguiente al del vencimiento del término para interponer los recursos, si estos no fueron interpuestos.", true], ["B", "desde el día siguiente al de su notificación personal.", "Esa regla aplica a los actos contra los que no procede ningún recurso (art. 87, num. 1). Contra esta resolución sí procedían recursos, de modo que hay que esperar el vencimiento del término para interponerlos.", false], ["C", "desde su expedición, porque no presentar recursos equivale a aceptar la decisión.", "Un acto de carácter particular no queda en firme antes de ser notificado ni antes de que venza el plazo para recurrirlo.", false]]}, {"id": "AP-138", "niv": 2, "e": "La segunda resolución, recurrida en reposición y apelación, queda en firme", "f": "Ley 1437 de 2011, art. 87, num. 2", "o": [["A", "desde el día siguiente a la fecha en que el interesado presentó los recursos.", "Presentar los recursos suspende los efectos del acto; no lo deja en firme.", false], ["B", "desde el día siguiente a la notificación de la decisión sobre los recursos interpuestos.", "El numeral 2 del artículo 87 del CPACA dispone que los actos quedan en firme desde el día siguiente a la publicación, comunicación o notificación de la decisión sobre los recursos interpuestos.", true], ["C", "desde el día siguiente a la notificación de la decisión que resolvió la reposición, aunque la apelación siga en trámite.", "Mientras la apelación no se resuelva, el acto no está en firme: los recursos se tramitan en el efecto suspensivo (art. 79 del CPACA).", false]]}, {"id": "AP-139", "niv": 2, "e": "La tercera resolución, cuyo recurso fue desistido, queda en firme", "f": "Ley 1437 de 2011, art. 87, num. 4", "o": [["A", "desde el día siguiente al de la notificación de la aceptación del desistimiento.", "El numeral 4 del artículo 87 del CPACA establece que el acto queda en firme desde el día siguiente al de la notificación de la aceptación del desistimiento de los recursos.", true], ["B", "al vencer el plazo de dos meses para resolver el recurso, por configurarse el silencio negativo.", "El silencio negativo en recursos supone que el recurso sigue vivo y no se resuelve. Aquí el recurso fue desistido y la aceptación determina la firmeza.", false], ["C", "desde el día siguiente a la radicación del escrito de desistimiento.", "La ley exige que se acepte el desistimiento y se notifique esa aceptación. La sola radicación del escrito no deja en firme el acto.", false]]}]}, {"comp": "atencion_procedimiento", "rol": "asistencial", "tag": "Atención al ciudadano y procedimiento administrativo · Nivel asistencial · Racionalización de trámites", "texto": "Usted es auxiliar administrativo de la ventanilla de atención de un instituto distrital de Bogotá que inscribe a los interesados en un programa de formación para el empleo. Durante la mañana se presentan tres situaciones. Un compañero le pide a una ciudadana una declaración extrajuicio ante notario sobre su lugar de residencia, aunque ninguna norma del programa la exige. Un ciudadano solicita el duplicado del carné del programa que expidió el instituto y que perdió, y le indican que primero debe traer la denuncia por pérdida. Por último, usted advierte que en un formulario radicado el nombre del barrio del solicitante tiene un error de ortografía que no deja dudas sobre lo que quiso escribir.", "items": [{"id": "AP-156", "niv": 1, "e": "Frente a la exigencia de la declaración extrajuicio sobre el lugar de residencia, lo correcto es", "f": "Decreto Ley 019 de 2012, art. 7 (modifica el art. 10 del Decreto 2150 de 1995)", "o": [["A", "reemplazarla por un certificado de residencia expedido por la junta de acción comunal del barrio.", "Sustituir la declaración por otro documento crea un requisito que la norma del programa no prevé. La ley ordena tener como suficiente la afirmación de la ciudadana.", false], ["B", "no exigirla, porque basta la afirmación de la ciudadana, que se entiende hecha bajo la gravedad del juramento.", "El artículo 7 del Decreto Ley 019 de 2012 prohíbe exigir declaraciones extrajuicio como requisito para el trámite de una actuación administrativa y dispone que basta la afirmación del particular ante la autoridad, que se entiende hecha bajo juramento.", true], ["C", "aceptar la declaración solo si está autenticada ante notario, para darle mayor seguridad al trámite.", "El Decreto Ley 019 de 2012 prohíbe exigir declaraciones extrajuicio como requisito para un trámite, y el artículo 25 elimina las autenticaciones que la ley no exige.", false]]}, {"id": "AP-157", "niv": 1, "e": "Frente a la solicitud de duplicado del carné, el instituto debe", "f": "Decreto Ley 019 de 2012, art. 30", "o": [["A", "exigir la publicación de un aviso de pérdida en un periódico de circulación local antes de expedir el duplicado.", "Es un requisito no previsto en la ley que contradice el principio de simplicidad de los trámites (art. 6 del Decreto Ley 019 de 2012).", false], ["B", "exigir la denuncia por pérdida ante la Policía, porque protege al instituto frente a un posible uso fraudulento del carné.", "Ninguna autoridad administrativa puede exigir esa denuncia para expedir un duplicado. La excepción de la norma se refiere a los documentos de identificación de la fuerza pública y de los cuerpos de seguridad del Estado.", false], ["C", "tramitar el duplicado con la afirmación del ciudadano sobre la pérdida, que se entiende hecha bajo juramento.", "El artículo 30 del Decreto Ley 019 de 2012 prohíbe exigir la denuncia por pérdida de documentos para expedir el duplicado o reemplazo; basta la afirmación del peticionario, que se entiende hecha bajo la gravedad del juramento.", true]]}, {"id": "AP-158", "niv": 2, "e": "Respecto del formulario con el error de ortografía, a usted le corresponde", "f": "Decreto Ley 019 de 2012, art. 11", "o": [["A", "corregir el error sin detener el trámite y comunicar la corrección al interesado por el medio más idóneo.", "El artículo 11 del Decreto Ley 019 de 2012 permite a cualquier funcionario corregir errores de citas, ortografía, mecanografía o aritmética sin detener la actuación, comunicando la corrección al interesado por el medio más idóneo.", true], ["B", "rechazar la inscripción, porque los datos del formulario son la base del registro y deben ser exactos.", "No procede el rechazo: el error no genera duda sobre lo que quiso decir el solicitante ni es relevante para decidir de fondo.", false], ["C", "devolver el formulario al solicitante para que lo diligencie de nuevo sin errores.", "El artículo 11 del Decreto Ley 019 de 2012 prohíbe devolver o rechazar solicitudes contenidas en formularios por errores de ortografía, salvo que el idioma sea relevante para el fondo y exista duda sobre el querer del solicitante, lo que no ocurre aquí.", false]]}]}, {"comp": "atencion_procedimiento", "rol": "asistencial", "tag": "Atención al ciudadano y procedimiento administrativo · Nivel asistencial · Peticiones verbales y atención telefónica", "texto": "Usted es auxiliar administrativo de la línea de atención telefónica de una secretaría distrital de Bogotá. Una ciudadana llama para presentar una petición sobre la entrega de un subsidio y su compañero de turno quiere pedirle que mejor la envíe por correo electrónico. Más tarde llama un ciudadano que quiere quejarse por el cobro de una factura de energía, asunto que no es competencia de la secretaría. Además, la secretaría quiere establecer que las solicitudes de devolución de dineros pagados por trámites deban presentarse por escrito.", "items": [{"id": "AP-191", "niv": 1, "e": "Frente a la petición de la ciudadana que llama por teléfono, usted debe", "f": "Decreto 1069 de 2015, arts. 2.2.3.12.1, 2.2.3.12.2 y 2.2.3.12.3 (adicionados por el Decreto 1166 de 2016)", "o": [["A", "pedirle que la envíe por correo electrónico, porque la línea telefónica es solo un canal de orientación.", "Las peticiones verbales también pueden presentarse por vía telefónica, y las autoridades deben centralizar en su línea de atención su recepción y la constancia de radicación.", false], ["B", "tomar nota de la llamada y radicar la petición solo cuando la ciudadana la confirme por escrito.", "La petición verbal no requiere confirmación escrita para ser radicada. Exigirla convierte el escrito en un requisito que la ley no impone.", false], ["C", "recibirla, radicarla de inmediato y dejar constancia con los datos mínimos, como la fecha y hora de recibo.", "El Decreto 1069 de 2015 (arts. 2.2.3.12.1 a 2.2.3.12.3) regula las peticiones verbales presentadas por vía telefónica y exige radicar de inmediato una constancia con datos mínimos, como el número de radicado, la fecha y hora de recibo y la constancia explícita de que la petición fue verbal.", true]]}, {"id": "AP-192", "niv": 2, "e": "Frente a la queja por el cobro de la factura de energía, que no es competencia de la secretaría, usted debe", "f": "Decreto 1069 de 2015, art. 2.2.3.12.7 (adicionado por el Decreto 1166 de 2016); Ley 1755 de 2015, art. 1 (art. 21 de la Ley 1437 de 2011)", "o": [["A", "tomar sus datos y decirle que la secretaría le enviará por escrito la respuesta sobre la factura.", "La secretaría no puede responder de fondo un asunto que no es de su competencia. La norma exige informarle de inmediato la falta de competencia y orientarlo; si insiste, se radica la petición.", false], ["B", "informarle en la llamada que la secretaría no es competente y orientarlo; si insiste, radicar la petición y remitirla al competente.", "El artículo 2.2.3.12.7 del Decreto 1069 de 2015 dispone que, ante una petición verbal ajena a su competencia, el funcionario informa en el mismo acto la falta de competencia y orienta al peticionario. Si este insiste, deja constancia, radica la petición y le da el trámite correspondiente, que es la remisión a la autoridad competente prevista en el artículo 21 del CPACA (sustituido por la Ley 1755 de 2015).", true], ["C", "radicar la petición y remitirla al competente dentro de los cinco días siguientes, sin informarle nada durante la llamada.", "Para la petición verbal, el aviso de falta de competencia se da de inmediato, en el mismo acto (art. 21 del CPACA y art. 2.2.3.12.7 del Decreto 1069 de 2015).", false]]}, {"id": "AP-193", "niv": 3, "e": "Para exigir que las solicitudes de devolución de dineros se presenten por escrito, la secretaría", "f": "Ley 1755 de 2015, art. 1 (art. 15 de la Ley 1437 de 2011); Decreto 1069 de 2015, art. 2.2.3.12.5 (adicionado por el Decreto 1166 de 2016)", "o": [["A", "no puede hacerlo, porque la ley garantiza que toda petición pueda presentarse de forma verbal, y exigir el escrito restringiría ese derecho.", "La ley permite a las autoridades exigir que ciertas peticiones se presenten por escrito (art. 15 del CPACA), siempre que cumplan las condiciones previstas.", false], ["B", "puede hacerlo, y cobrar a los usuarios el valor de los formularios que diseñe, siempre que lo informe en su sede electrónica.", "Los formularios deben ponerse a disposición sin costo, salvo que una ley disponga expresamente lo contrario (art. 15 del CPACA).", false], ["C", "puede hacerlo, si pone a disposición formularios gratuitos e informa antes, en su sede electrónica y otros canales, qué solicitudes deben ser escritas.", "El artículo 15 del CPACA permite exigir que ciertas peticiones se presenten por escrito, con formularios gratuitos. El artículo 2.2.3.12.5 del Decreto 1069 de 2015 lo admite para peticiones sobre trámites y servicios y exige informar previamente, por la sede electrónica y otros canales, qué solicitudes deben presentarse por escrito.", true]]}]}, {"comp": "gestion_publica", "rol": "general", "tag": "Gestión pública, MIPG, contratación y documentos · Control interno: definición y recomendaciones", "texto": "Usted trabaja en la Secretaría de Educación de un departamento. La Oficina de Control Interno entregó al secretario de despacho el informe de una auditoría al proceso de nómina con tres hallazgos y sus recomendaciones. En la reunión de análisis, el secretario pregunta si el control interno es una tarea aparte de las funciones de cada cargo, qué papel cumple la Oficina de Control Interno frente a las recomendaciones que formuló y qué principios debe consultar el ejercicio del control interno.", "items": [{"id": "GP-122", "niv": 2, "e": "Sobre la relación entre el control interno y las funciones de cada cargo, la Ley 87 de 1993 dispone que el control interno", "f": "Ley 87 de 1993, art. 1", "o": [["A", "es propio de los cargos del nivel directivo; los demás niveles se limitan a atender las auditorías.", "Aunque la ley destaca a quienes tienen mando, el control interno debe estar presente en todos los cargos existentes, no solo en el nivel directivo.", false], ["B", "debe ser parte del ejercicio de las funciones de todos los cargos, en especial de quienes tienen mando.", "El artículo 1 de la Ley 87 de 1993 dispone que el control interno debe concebirse y organizarse de modo que su ejercicio sea intrínseco a las funciones de todos los cargos, y en particular de los que tienen responsabilidad de mando.", true], ["C", "es una función adicional que solo se asigna a los servidores designados como enlaces de control interno en cada dependencia.", "La ley no reduce el control interno a unos enlaces designados; lo concibe como parte de todos los cargos de la entidad.", false]]}, {"id": "GP-123", "niv": 2, "e": "Respecto de las recomendaciones de la auditoría, es correcto afirmar que la Oficina de Control Interno", "f": "Ley 87 de 1993, arts. 3 (lit. d) y 12 (lit. k)", "o": [["A", "propone mejoras al sistema y verifica que se implanten las medidas recomendadas.", "La Ley 87 de 1993 asigna a la unidad de control interno proponer recomendaciones para mejorar el sistema (art. 3, lit. d) y verificar que se implanten las medidas recomendadas (art. 12, lit. k).", true], ["B", "solo puede dirigir sus recomendaciones a la asamblea departamental, y no a los jefes de dependencia.", "Las recomendaciones se dirigen a la administración (representante legal y directivos); la asamblea ejerce control político, no es destinataria natural de las auditorías internas.", false], ["C", "impone las medidas correctivas mediante acto administrativo de obligatorio cumplimiento.", "La oficina de control interno no tiene facultades para imponer medidas mediante actos administrativos; su papel es evaluar, recomendar y hacer seguimiento.", false]]}, {"id": "GP-124", "niv": 1, "e": "Entre los principios que debe consultar el ejercicio del control interno, según la Ley 87 de 1993, se encuentra el de", "f": "Ley 87 de 1993, art. 1", "o": [["A", "doble instancia, para revisar los hallazgos de auditoría.", "La doble instancia es una garantía procesal; la Ley 87 de 1993 no la incluye entre los principios que orientan el control interno.", false], ["B", "valoración de costos ambientales, junto con los de eficiencia y economía.", "El artículo 1 de la Ley 87 de 1993 enumera los principios de igualdad, moralidad, eficiencia, economía, celeridad, imparcialidad, publicidad y valoración de costos ambientales.", true], ["C", "favorabilidad, propio de los procesos sancionatorios.", "La favorabilidad es una garantía del derecho sancionatorio y disciplinario; no figura entre los principios del control interno de la Ley 87 de 1993.", false]]}]}, {"comp": "entidades_territoriales", "rol": "general", "tag": "Entidades territoriales, Bogotá D.C. y CAR · Sesiones del concejo municipal", "texto": "Usted es técnico administrativo de la Secretaría General del Concejo de un municipio de sexta categoría de Boyacá. A comienzos de año, un concejal recién posesionado le pide orientación sobre el funcionamiento de la corporación: en qué meses sesiona ordinariamente, qué ocurre si el alcalde necesita que el Concejo estudie con urgencia un proyecto fuera de esos meses y si es posible ampliar un periodo de sesiones cuando quedan proyectos pendientes de segundo debate.", "items": [{"id": "ET-104", "niv": 1, "e": "Respecto de las sesiones ordinarias, usted le informa al concejal que el Concejo sesiona", "f": "Ley 136 de 1994, art. 23", "o": [["A", "en febrero, mayo, agosto y noviembre, por derecho propio.", "El art. 23 de la Ley 136 de 1994 establece que los concejos de municipios distintos de categoría especial, primera y segunda sesionan cuatro meses al año: febrero, mayo, agosto y noviembre.", true], ["B", "cuando lo convoque el alcalde, que fija cada año el calendario.", "Las sesiones ordinarias son por derecho propio en los meses fijados por la ley; la convocatoria del alcalde corresponde a las sesiones extraordinarias.", false], ["C", "seis meses al año, en tres periodos de dos meses.", "Ese régimen de seis meses (tres periodos) aplica solo a los concejos de municipios de categoría especial, primera y segunda, según el art. 23 de la Ley 136 de 1994.", false]]}, {"id": "ET-105", "niv": 1, "e": "Si el alcalde necesita que el Concejo estudie un proyecto en un mes en el que no hay sesiones ordinarias, el mecanismo procedente es que", "f": "Ley 136 de 1994, art. 23, parágrafo 2, y art. 91, lit. a), num. 4 (modificado por el art. 29 de la Ley 1551 de 2012)", "o": [["A", "el alcalde expida el acto como decreto, pues durante el receso del Concejo asume transitoriamente sus funciones normativas.", "El receso del Concejo no traslada sus funciones al alcalde; las facultades pro tempore requieren autorización expresa del Concejo.", false], ["B", "el presidente del Concejo convoque a sesiones ordinarias adicionales a solicitud del alcalde.", "La ley no prevé sesiones ordinarias adicionales convocadas por el presidente; las sesiones fuera de los periodos legales son extraordinarias y las convoca el alcalde.", false], ["C", "el alcalde convoque a sesiones extraordinarias, en las que el Concejo se ocupa solo de los asuntos que él someta.", "El parágrafo 2 del art. 23 de la Ley 136 de 1994 y el art. 91, literal a), numeral 4 (modificado por la Ley 1551 de 2012) facultan al alcalde para convocar a extraordinarias, limitadas a los asuntos que somete a consideración.", true]]}, {"id": "ET-106", "niv": 2, "e": "En cuanto a la posibilidad de ampliar un periodo ordinario, usted le explica que", "f": "Ley 136 de 1994, art. 23, parágrafo 1", "o": [["A", "cada periodo puede prorrogarse hasta por diez días hábiles, con autorización del alcalde.", "La prórroga es de diez días calendario y depende de la voluntad del propio Concejo, no de una autorización del alcalde.", false], ["B", "cada periodo puede prorrogarse por diez días calendario más, por decisión del mismo Concejo.", "El parágrafo 1 del art. 23 de la Ley 136 de 1994 permite prorrogar cada periodo ordinario por diez días calendario más, a voluntad del respectivo Concejo.", true], ["C", "no es posible ampliarlo, por lo que los proyectos pendientes deben radicarse de nuevo en el siguiente periodo.", "La ley sí permite prorrogar cada periodo ordinario, de modo que esta afirmación desconoce el parágrafo 1 del art. 23 de la Ley 136 de 1994.", false]]}]}, {"comp": "entidades_territoriales", "rol": "general", "tag": "Entidades territoriales, Bogotá D.C. y CAR · Localidades de Bogotá", "texto": "Usted es técnico de la Alcaldía Local de una localidad del sur de Bogotá. Se inicia un nuevo periodo y la Junta Administradora Local (JAL) prepara la designación del alcalde local. Además, la JAL debe aprobar el presupuesto del Fondo de Desarrollo Local para la siguiente vigencia, y la semana pasada el alcalde local sancionó un acuerdo local sobre el uso temporal del espacio público para mercados campesinos.", "items": [{"id": "ET-135", "niv": 1, "e": "Sobre la designación del alcalde local, usted explica que", "f": "Decreto Ley 1421 de 1993, art. 84", "o": [["A", "lo nombra el alcalde mayor de una terna elaborada por la JAL.", "El art. 84 del Decreto Ley 1421 de 1993 establece que los alcaldes locales son nombrados por el alcalde mayor de terna elaborada por la respectiva junta administradora.", true], ["B", "lo elige la JAL por mayoría absoluta de sus miembros, para un periodo igual al de los ediles.", "La JAL no elige al alcalde local: integra una terna y el nombramiento lo hace el alcalde mayor (art. 84 del Decreto Ley 1421 de 1993).", false], ["C", "lo elige la ciudadanía de la localidad en las elecciones de autoridades territoriales.", "Los alcaldes locales no son de elección popular; los elegidos popularmente son los ediles.", false]]}, {"id": "ET-136", "niv": 2, "e": "Para aprobar el presupuesto anual del Fondo de Desarrollo Local, la JAL debe contar con", "f": "Decreto Ley 1421 de 1993, art. 69, num. 4 (modificado por el art. 8 de la Ley 2116 de 2021)", "o": [["A", "la aprobación previa del Concejo de Bogotá, que incorpora los presupuestos locales al distrital.", "La aprobación del presupuesto del fondo de desarrollo local corresponde a la JAL; el requisito previo es el concepto favorable del CONFIS, no una aprobación del Concejo.", false], ["B", "el visto bueno de la Contraloría Distrital sobre la viabilidad de los proyectos de inversión.", "La Contraloría ejerce control fiscal posterior; la norma exige concepto previo del Consejo Distrital de Política Económica y Fiscal.", false], ["C", "concepto previo favorable del Consejo Distrital de Política Económica y Fiscal (CONFIS).", "El art. 69, numeral 4 del Decreto Ley 1421 de 1993 (modificado por la Ley 2116 de 2021) asigna a la JAL aprobar el presupuesto del fondo, previo concepto favorable del CONFIS y conforme al plan de desarrollo local.", true]]}, {"id": "ET-137", "niv": 2, "e": "Respecto del acuerdo local sancionado, el alcalde local debe", "f": "Decreto Ley 1421 de 1993, art. 83", "o": [["A", "enviarlo al gobernador de Cundinamarca dentro de los cinco días siguientes a la sanción, como ocurre con los acuerdos de los municipios del departamento.", "Los acuerdos locales de Bogotá los revisa el alcalde mayor, no el gobernador de Cundinamarca.", false], ["B", "enviar copia al alcalde mayor dentro de los tres días siguientes a la sanción, para su revisión jurídica, sin que esta suspenda sus efectos.", "El art. 83 del Decreto Ley 1421 de 1993 ordena enviar copia del acuerdo local al alcalde mayor dentro de los tres días siguientes a la sanció
