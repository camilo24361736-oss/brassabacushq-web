n; la revisión no suspende sus efectos.", true], ["C", "abstenerse de aplicarlo hasta que el alcalde mayor emita concepto favorable de legalidad.", "La revisión jurídica del alcalde mayor no suspende los efectos del acuerdo local (art. 83 del Decreto Ley 1421 de 1993).", false]]}]}, {"comp": "comportamental", "rol": "general", "tag": "Competencias comportamentales (Decreto 815 de 2018) · Aprendizaje continuo", "texto": "Usted es servidor de la Secretaría de Hacienda de un municipio de segunda categoría y atiende consultas de contribuyentes sobre el impuesto de industria y comercio. En octubre, el Concejo Municipal aprobó un acuerdo que modifica las tarifas y el calendario de declaración de ese impuesto a partir del 1 de enero del año siguiente. La Secretaría aún no ha programado capacitaciones sobre el cambio. En la oficina trabaja también Liliana, quien terminó un diplomado de la ESAP en fiscalización tributaria territorial y maneja una herramienta de cruce de información que usted no conoce; usted, a su vez, domina las plantillas de liquidación que el equipo usa a diario.", "items": [{"id": "CO-101", "niv": 1, "e": "Ante la aprobación del acuerdo y sin capacitación programada, la conducta que mejor refleja la competencia de aprendizaje continuo es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Aprendizaje continuo)", "o": [["A", "leer el texto oficial del acuerdo y actualizar sus apuntes antes de que rija, para orientar bien a los contribuyentes.", "Refleja la competencia «Aprendizaje continuo» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en identificar, incorporar y aplicar conocimientos nuevos sobre normas, tecnologías y métodos de trabajo para mantener vigente la efectividad de las propias prácticas. Corresponde a las conductas asociadas de mantener actualizadas las propias competencias según los cambios que exige la administración y de gestionar fuentes de información confiables: el texto oficial del acuerdo es la fuente idónea y le permite estar preparado antes de enero.", true], ["B", "esperar la capacitación que organice la Secretaría y, mientras tanto, seguir orientando a los contribuyentes con las reglas actuales.", "Deja su actualización en manos exclusivas de la entidad. La competencia pide gestionar las propias fuentes de información confiable, como el texto oficial del acuerdo.", false], ["C", "revisar en foros de contadores de la región cómo están entendiendo el cambio otros profesionales, para tener varias opiniones.", "Busca actualizarse, pero en fuentes que no son confiables ni oficiales. La conducta asociada exige acudir a información confiable; las opiniones de foros pueden ser imprecisas o referirse a otros municipios.", false]]}, {"id": "CO-102", "niv": 2, "e": "Frente a la herramienta de cruce de información que maneja Liliana, la conducta más acorde con el aprendizaje continuo es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Aprendizaje continuo)", "o": [["A", "proponer a su jefe que Liliana asuma en adelante todos los cruces de información de la oficina y usted las liquidaciones de ella.", "Puede ser eficiente en lo inmediato, pero renuncia a aprender. No refleja la conducta de nivelar conocimientos aprendiendo de los colegas y deja el saber concentrado en una sola persona.", false], ["B", "inscribirse en la próxima cohorte del diplomado de la ESAP, que abre dentro de un año, para aprender la herramienta con un certificado.", "Participar en capacitación es valioso, pero aplaza un año un aprendizaje que puede lograr ya con una colega. La competencia valora el interaprendizaje informal entre compañeros para nivelar conocimientos.", false], ["C", "pedirle a Liliana que le muestre en la práctica cómo hace los cruces y, a su vez, enseñarle el manejo de las plantillas de liquidación.", "Refleja la competencia «Aprendizaje continuo» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en identificar, incorporar y aplicar conocimientos nuevos sobre normas, tecnologías y métodos de trabajo para mantener vigente la efectividad de las propias prácticas. Es la conducta asociada de compartir saberes con los compañeros y aprender de ellos habilidades diferenciales en flujos informales de interaprendizaje: ambos nivelan conocimientos sin esperar un curso formal.", true]]}, {"id": "CO-103", "niv": 3, "e": "Usted asistió a una jornada de la gobernación sobre el nuevo sistema de información tributaria, a la que solo pudo ir un servidor por oficina. Al regresar, la conducta que mejor refleja el aprendizaje continuo es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Aprendizaje continuo)", "o": [["A", "enviar el certificado y la memoria de la jornada a talento humano para que la formación quede registrada en su historia laboral.", "Es un trámite útil, pero no aplica ni comparte el conocimiento adquirido. La competencia apunta a incorporar lo aprendido y transmitirlo a los colegas, no solo a dejar constancia de la asistencia.", false], ["B", "preparar una guía corta con lo aprendido y explicarla a quienes no asistieron, para que todos usen el sistema.", "Refleja la competencia «Aprendizaje continuo» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en identificar, incorporar y aplicar conocimientos nuevos sobre normas, tecnologías y métodos de trabajo para mantener vigente la efectividad de las propias prácticas. Responde a la conducta asociada de compartir saberes y habilidades con los compañeros: al socializar lo aprendido, la oficina entera mantiene actualizadas sus prácticas, no solo quien asistió.", true], ["C", "aplicar lo aprendido en sus propios trámites y guardar la memoria de la jornada para consultarla cuando la necesite.", "Incorpora lo aprendido en su trabajo, pero no lo comparte con los compañeros que no pudieron asistir. La competencia incluye compartir los saberes y habilidades con los colegas.", false]]}]}, {"comp": "comportamental", "rol": "general", "tag": "Competencias comportamentales (Decreto 815 de 2018) · Orientación al usuario y al ciudadano", "texto": "Usted atiende el punto de información de la Secretaría de Desarrollo Social de un municipio de quinta categoría, donde se reciben solicitudes para un subsidio municipal de transporte escolar. La convocatoria cierra en dos días. Entre los usuarios de la mañana hay un adulto mayor con dificultad auditiva que pregunta por los requisitos para su nieta, y una madre de familia que pregunta si su solicitud será aprobada, aunque usted observa que le falta el certificado de estudios. En las últimas semanas usted ha notado que muchos usuarios de las veredas no logran llegar en el horario de atención.", "items": [{"id": "CO-113", "niv": 1, "e": "Para atender al adulto mayor con dificultad auditiva, la conducta que mejor refleja la orientación al usuario y al ciudadano es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Orientación al usuario y al ciudadano)", "o": [["A", "hablarle de frente y con frases cortas, comprobar que entendió y darle los requisitos por escrito, para que pueda repasarlos.", "Refleja la competencia «Orientación al usuario y al ciudadano» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en dirigir las decisiones y acciones a satisfacer las necesidades e intereses de los usuarios internos y externos y de los ciudadanos, según las responsabilidades de la entidad. Corresponde a las conductas de aplicar la no discriminación con espacios y lenguaje incluyentes, y de escuchar activamente e informar con veracidad: adapta la comunicación a la necesidad de la persona.", true], ["B", "pedirle con amabilidad que regrese con un familiar que pueda escuchar la explicación de los requisitos.", "Traslada al ciudadano la carga de la atención y lo hace volver. La competencia pide generar espacios y lenguaje incluyentes para atender a cada persona según sus condiciones.", false], ["C", "explicarle los requisitos en voz alta y sugerirle que los consulte después con calma en la página web oficial de la alcaldía municipal.", "Intenta informar, pero no ajusta la forma de comunicarse a la dificultad auditiva ni verifica que el mensaje haya sido comprendido.", false]]}, {"id": "CO-114", "niv": 2, "e": "Ante la pregunta de la madre de familia sobre si su solicitud será aprobada, la conducta más acorde con la orientación al usuario y al ciudadano es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Orientación al usuario y al ciudadano)", "o": [["A", "recomendarle que no radique en esta convocatoria y espere la siguiente, cuando pueda reunir los documentos con calma.", "Aunque parezca prudente, le cierra una opción real: aún hay dos días para obtener el certificado. No atiende la necesidad de forma oportuna.", false], ["B", "recibirle la solicitud incompleta y decirle que el comité evaluará si la acepta, para no desanimarla.", "Busca no desmotivarla, pero no informa con veracidad y le hace perder la oportunidad de completar el requisito a tiempo.", false], ["C", "indicarle con claridad que falta el certificado de estudios, que sin él la solicitud no cumple, y explicarle cómo obtenerlo antes del cierre.", "Refleja la competencia «Orientación al usuario y al ciudadano» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en dirigir las decisiones y acciones a satisfacer las necesidades e intereses de los usuarios internos y externos y de los ciudadanos, según las responsabilidades de la entidad. Responde a la conducta de informar con veracidad y atender las necesidades de forma oportuna: le da la información real y una ruta concreta para cumplir dentro del plazo.", true]]}, {"id": "CO-115", "niv": 2, "e": "Frente a la dificultad de los usuarios de las veredas para llegar en el horario de atención, la conducta que mejor refleja la orientación al usuario y al ciudadano es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Orientación al usuario y al ciudadano)", "o": [["A", "difundir en la emisora comunitaria los horarios de atención para que los usuarios rurales organicen con tiempo su viaje.", "Mejora la información, pero no responde a la necesidad identificada: el problema no es desconocer el horario sino no poder llegar a tiempo.", false], ["B", "registrar cuántos usuarios rurales consultan y qué dificultades tienen, y presentar esos datos con una propuesta de jornadas en las veredas.", "Refleja la competencia «Orientación al usuario y al ciudadano» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en dirigir las decisiones y acciones a satisfacer las necesidades e intereses de los usuarios internos y externos y de los ciudadanos, según las responsabilidades de la entidad. Corresponde a establecer mecanismos para conocer las necesidades de los ciudadanos e incorporarlas en los proyectos institucionales con visión de servicio: convierte una observación en información para decidir.", true], ["C", "atender después del horario a los usuarios rurales que lleguen tarde a la sede, aunque deba quedarse por su cuenta y sin autorización del jefe.", "Tiene buena intención, pero da una solución individual e informal que no resuelve la necesidad de fondo ni la incorpora a la gestión de la entidad.", false]]}]}, {"comp": "comportamental", "rol": "general", "tag": "Competencias comportamentales (Decreto 815 de 2018) · Aprendizaje continuo", "texto": "Usted trabaja en la Subdirección Administrativa de una secretaría distrital de Bogotá. La entidad implementó un sistema de gestión documental electrónico que reemplaza el registro en hojas de cálculo, y ofrece un curso virtual de 20 horas, en franjas de dos horas dentro de la jornada. Usted domina la clasificación de documentos según las tablas de retención documental, pero se le dificulta el nuevo sistema. Su compañero Felipe, que ingresó hace poco, maneja el sistema con facilidad pero comete errores al clasificar. En un chat de la dependencia circula un instructivo no oficial sobre cómo firmar electrónicamente en el sistema.", "items": [{"id": "CO-125", "niv": 1, "e": "Frente al curso virtual ofrecido por la entidad, la conducta que mejor refleja el aprendizaje continuo es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Aprendizaje continuo)", "o": [["A", "esperar unos meses a que el sistema se estabilice y tomar el curso en una cohorte posterior.", "Aplaza la actualización sin razón suficiente. La competencia pide mantener las competencias al día frente a los cambios que exige la administración.", false], ["B", "seguir llevando en paralelo su hoja de cálculo mientras domina el sistema, para no cometer errores en el registro.", "Busca evitar errores, pero mantiene la práctica anterior en lugar de incorporar la nueva herramienta, y duplica el trabajo.", false], ["C", "inscribirse en el curso y reorganizar sus pendientes para asistir, pues así dominará pronto la nueva herramienta.", "Refleja la competencia «Aprendizaje continuo» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en identificar, incorporar y aplicar conocimientos nuevos sobre normas, tecnologías y métodos de trabajo para mantener vigente la efectividad de las propias prácticas. Corresponde a la conducta de participar en espacios informativos y de capacitación para mantener sus competencias actualizadas frente a las nuevas tecnologías de la entidad.", true]]}, {"id": "CO-126", "niv": 2, "e": "Respecto de Felipe, la conducta más acorde con el aprendizaje continuo es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Aprendizaje continuo)", "o": [["A", "proponerle que él le enseñe el manejo del sistema y usted le explique cómo clasificar según las tablas de retención.", "Refleja la competencia «Aprendizaje continuo» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en identificar, incorporar y aplicar conocimientos nuevos sobre normas, tecnologías y métodos de trabajo para mantener vigente la efectividad de las propias prácticas. Refleja la conducta de compartir saberes con los compañeros y aprender de ellos habilidades diferenciales en flujos informales de interaprendizaje: ambos nivelan sus conocimientos.", true], ["B", "ofrecerle hacer la clasificación de los documentos de los dos a cambio de que él los cargue en el sistema.", "Reparte tareas según lo que cada uno ya sabe, pero ninguno aprende lo que le falta. No hay incorporación de conocimiento nuevo.", false], ["C", "pedirle que le escriba una guía paso a paso del sistema para estudiarla por su cuenta en los ratos libres de la semana.", "Aprende del compañero, pero en una sola vía: no comparte su propio saber sobre clasificación, que es justo lo que Felipe necesita.", false]]}, {"id": "CO-127", "niv": 3, "e": "Frente al instructivo no oficial que circula en el chat, la conducta que mejor refleja el aprendizaje continuo es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Aprendizaje continuo)", "o": [["A", "contrastarlo antes de usarlo con el manual oficial del sistema, ya que el instructivo no tiene respaldo de la entidad.", "Refleja la competencia «Aprendizaje continuo» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en identificar, incorporar y aplicar conocimientos nuevos sobre normas, tecnologías y métodos de trabajo para mantener vigente la efectividad de las propias prácticas. Corresponde a gestionar sus propias fuentes de información confiable: verificar contra el manual oficial permite aprovechar lo útil del instructivo sin asumir errores.", true], ["B", "aplicarlo en sus documentos tal como lo están usando varios compañeros de la dependencia.", "Se basa en una fuente no verificada. La conducta asociada exige gestionar fuentes de información confiables.", false], ["C", "descartarlo y no usar la firma electrónica hasta recibir una capacitación presencial sobre esa función.", "Evita el riesgo, pero frena la incorporación de la herramienta cuando existe información oficial que puede consultar.", false]]}]}, {"comp": "comportamental", "rol": "general", "tag": "Competencias comportamentales (Decreto 815 de 2018) · Trabajo en equipo", "texto": "Usted hace parte del equipo que prepara la audiencia pública de rendición de cuentas de una alcaldía de tercera categoría. Cada integrante redacta un capítulo del informe: usted, inversión social; Diana, infraestructura. El plazo interno vence el día 20. Usted terminó su capítulo el 14, mientras Diana va retrasada. Al revisar el borrador consolidado, usted encuentra que el número de beneficiarios del programa de mejoramiento de vivienda que aparece en el capítulo de Diana no coincide con el que usted reportó. Además, el equipo eligió por mayoría un formato de presentación que usted consideraba menos claro.", "items": [{"id": "CO-137", "niv": 1, "e": "Al terminar su capítulo antes del plazo, la conducta que mejor refleja el trabajo en equipo es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Trabajo en equipo)", "o": [["A", "entregar su capítulo al coordinador y volver a sus funciones habituales hasta la reunión de cierre del día 20.", "Cumple su parte, pero ignora que el resultado del equipo depende también del capítulo pendiente.", false], ["B", "informar al coordinador que Diana va retrasada, para que él adopte las medidas que considere necesarias.", "Alerta sobre el riesgo, pero no contribuye al resultado común cuando tiene tiempo para hacerlo.", false], ["C", "ofrecer a Diana ayuda con una parte concreta de su capítulo y acordar con ella cómo integrarla.", "Refleja la competencia «Trabajo en equipo» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en trabajar con otros de manera integrada y armónica para lograr metas institucionales comunes. Corresponde a asumir su responsabilidad como miembro del equipo y planificar sus acciones según su repercusión en el objetivo grupal: el informe es de todos.", true]]}, {"id": "CO-138", "niv": 3, "e": "Frente a la diferencia en el número de beneficiarios, la conducta más acorde con el trabajo en equipo es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Trabajo en equipo)", "o": [["A", "plantear la diferencia en la reunión general del equipo para que todos validen cuál de las dos cifras debe quedar.", "Busca transparencia, pero expone ante todos un asunto que se resuelve de manera directa entre las dos personas que tienen las fuentes.", false], ["B", "hablarlo directamente con Diana, mostrarle ambas fuentes y revisarlas juntos para unificar el dato.", "Refleja la competencia «Trabajo en equipo» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en trabajar con otros de manera integrada y armónica para lograr metas institucionales comunes. Refleja la conducta de establecer una comunicación directa con los miembros del equipo para compartir información con respeto y cordialidad.", true], ["C", "corregir usted la cifra de Diana en el documento consolidado, ya que su fuente es la más reciente.", "Puede tener razón, pero modifica el trabajo de una compañera sin comunicárselo, lo que afecta la confianza en el equipo.", false]]}, {"id": "CO-139", "niv": 2, "e": "Respecto del formato de presentación elegido por mayoría, la conducta que mejor refleja el trabajo en equipo es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Trabajo en equipo)", "o": [["A", "aplicar el formato acordado en su capítulo y dejar registrada su sugerencia para la próxima rendición de cuentas.", "Refleja la competencia «Trabajo en equipo» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en trabajar con otros de manera integrada y armónica para lograr metas institucionales comunes. Corresponde a cumplir los compromisos que adquiere con el equipo y respetar la diversidad de criterios: acata la decisión colectiva sin renunciar a aportar su idea.", true], ["B", "pedir al jefe de planeación que revise la decisión del equipo antes de seguir avanzando con el capítulo.", "Escala un desacuerdo menor que el equipo ya resolvió y retrasa el trabajo de todos.", false], ["C", "presentar su capítulo en el formato que propuso, porque considera que es más claro para la ciudadanía.", "Su intención es mejorar la claridad, pero rompe la unidad del informe y desconoce una decisión del equipo.", false]]}]}, {"comp": "comportamental", "rol": "asistencial", "tag": "Competencias comportamentales (Decreto 815 de 2018) · Nivel asistencial · Manejo de la información", "texto": "Usted es auxiliar administrativo de la ventanilla de radicación de una corporación autónoma regional. Hoy un ciudadano radicó una denuncia por un vertimiento de aguas residuales que, según él, está ocurriendo en ese momento sobre una quebrada, y pidió expresamente que su identidad se mantenga en reserva. En la tarde llama un periodista de una emisora local preguntando por la denuncia, y luego se presenta un empleado de la empresa denunciada a preguntar quién la presentó. La corporación tiene una oficina de comunicaciones que atiende a los medios.", "items": [{"id": "CO-203", "niv": 1, "e": "Al recibir la denuncia, la conducta que mejor refleja el manejo de la información es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 5, sustituido por el art. 1 del Decreto 815 de 2018 (nivel asistencial: Manejo de la información)", "o": [["A", "radicarla y agregar una nota personal indicando que, por lo que contó el ciudadano, el caso parece muy grave.", "Busca destacar la urgencia, pero agrega apreciaciones propias en lugar de transmitir la información de forma objetiva.", false], ["B", "radicarla y enviarla en el reparto ordinario del día siguiente, como se hace con las demás comunicaciones.", "Cumple el trámite general, pero no transmite con oportunidad una situación que ocurre en ese momento.", false], ["C", "radicarla y avisar de inmediato al área de control con los datos reportados, ya que el hecho está ocurriendo.", "Refleja la competencia «Manejo de la información» (Decreto 1083 de 2015, art. 2.2.4.8, num. 5, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en manejar con responsabilidad la información personal e institucional de la que se dispone. Corresponde a transmitir información oportuna y objetiva.", true]]}, {"id": "CO-204", "niv": 2, "e": "Frente a la llamada del periodista, la conducta más acorde con el manejo de la información es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 5, sustituido por el art. 1 del Decreto 815 de 2018 (nivel asistencial: Manejo de la información)", "o": [["A", "confirmarle solamente que la denuncia existe, sin entregar detalles sobre su contenido.", "Parece prudente, pero entrega información institucional sin estar autorizado.", false], ["B", "indicarle que no está autorizado para dar información y remitirlo a la oficina de comunicaciones.", "Refleja la competencia «Manejo de la información» (Decreto 1083 de 2015, art. 2.2.4.8, num. 5, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en manejar con responsabilidad la información personal e institucional de la que se dispone. Refleja las conductas de evadir temas que indagan sobre información confidencial y no hacer pública información laboral que pueda afectar a la organización.", true], ["C", "darle los datos generales que ya conoce la comunidad del sector, para evitar que circulen rumores.", "Su intención es evitar rumores, pero asume una vocería que no le corresponde.", false]]}, {"id": "CO-205", "niv": 3, "e": "Ante la pregunta del empleado de la empresa denunciada, la conducta que mejor refleja el manejo de la información es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 5, sustituido por el art. 1 del Decreto 815 de 2018 (nivel asistencial: Manejo de la información)", "o": [["A", "pedirle que espere mientras consulta con el profesional a cargo si es posible darle el nombre.", "Muestra cautela, pero deja abierta la posibilidad de revelar una identidad que el ciudadano pidió reservar.", false], ["B", "abstenerse de revelar cualquier dato del denunciante e indicarle que puede conocer el trámite por los canales formales.", "Refleja la competencia «Manejo de la información» (Decreto 1083 de 2015, art. 2.2.4.8, num. 5, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en manejar con responsabilidad la información personal e institucional de la que se dispone. Corresponde a manejar con responsabilidad la información personal de que dispone y no hacer pública la que pueda afectar a las personas.", true], ["C", "decirle que la denuncia la presentó un vecino del sector, sin mencionar su nombre ni otros datos.", "Intenta proteger al denunciante, pero revela datos que pueden permitir identificarlo.", false]]}]}, {"comp": "comportamental", "rol": "asistencial", "tag": "Competencias comportamentales (Decreto 815 de 2018) · Nivel asistencial · Colaboración", "texto": "Usted es auxiliar administrativo del archivo central de una gobernación. Este mes se realiza la transferencia documental de cinco secretarías, y usted trabaja con los auxiliares de cada una. Se comprometió a entregar el jueves a la Secretaría de Hacienda la revisión de su inventario documental. En las primeras transferencias, los auxiliares de varias secretarías han diligenciado con errores el formato de inventario. Las secretarías de Salud y de Educación pidieron transferir el mismo día, pero el archivo solo tiene capacidad para recibir una transferencia diaria.", "items": [{"id": "CO-215", "niv": 1, "e": "El miércoles le piden atender la consulta urgente de un expediente solicitado por un juzgado, que le tomará unas dos horas; reorganizando su agenda, aún puede terminar la revisión para Hacienda el jueves. La conducta que mejor refleja la colaboración es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 5, sustituido por el art. 1 del Decreto 815 de 2018 (nivel asistencial: Colaboración)", "o": [["A", "atender la consulta urgente y avisar con tiempo a Hacienda que el inventario revisado se le entregará el viernes.", "Avisa a tiempo, pero incumple el compromiso sin haber intentado reorganizar su trabajo.", false], ["B", "pedir a Hacienda que revise por su cuenta el inventario, ya que usted debe atender la consulta del juzgado.", "Traslada su compromiso a otra dependencia.", false], ["C", "atender la consulta urgente y reorganizar su día para entregar el inventario el jueves como acordó.", "Refleja la competencia «Colaboración» (Decreto 1083 de 2015, art. 2.2.4.8, num. 5, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en cooperar con los demás para alcanzar los objetivos institucionales. Corresponde a cumplir con los compromisos adquiridos sin dejar de apoyar una necesidad urgente de la entidad.", true]]}, {"id": "CO-216", "niv": 2, "e": "Frente a los errores en el formato de inventario, la conducta más acorde con la colaboración es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 5, sustituido por el art. 1 del Decreto 815 de 2018 (nivel asistencial: Colaboración)", "o": [["A", "enviar a los auxiliares, antes de su transferencia, un ejemplo del formato bien diligenciado con indicaciones breves.", "Refleja la competencia «Colaboración» (Decreto 1083 de 2015, art. 2.2.4.8, num. 5, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en cooperar con los demás para alcanzar los objetivos institucionales. Refleja la conducta de facilitar la labor de sus superiores y compañeros de trabajo.", true], ["B", "devolver las cajas con errores para que cada secretaría corrija el formato de inventario antes de recibir la transferencia.", "Aplica el control, pero no facilita la labor de los compañeros para evitar que el error se repita.", false], ["C", "corregir usted mismo los formatos de todas las secretarías, para que la transferencia avance más rápido.", "Resuelve en lo inmediato, pero asume una tarea ajena y no evita que el error se repita.", false]]}, {"id": "CO-217", "niv": 3, "e": "Ante la solicitud de Salud y Educación de transferir el mismo día, la conducta que mejor refleja la colaboración es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 5, sustituido por el art. 1 del Decreto 815 de 2018 (nivel asistencial: Colaboración)", "o": [["A", "atender a la secretaría que lo solicitó primero y aplazar la otra hasta el próximo mes.", "Aplica un criterio objetivo, pero no busca la forma de articular ambas transferencias dentro del mes.", false], ["B", "proponer a ambas secretarías fechas consecutivas, de acuerdo con la capacidad del archivo, y confirmarlas por escrito.", "Refleja la competencia «Colaboración» (Decreto 1083 de 2015, art. 2.2.4.8, num. 5, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en cooperar con los demás para alcanzar los objetivos institucionales. Corresponde a articular sus actuaciones con las de los demás para alcanzar los objetivos institucionales.", true], ["C", "recibir ambas transferencias el mismo día, aunque se supere la capacidad del archivo, para no afectar a ninguna.", "Busca atender a ambas, pero desconoce la capacidad real y arriesga el orden de la documentación.", false]]}]}];
const CFG = {"titulo": "Simulacro 3 · Nivel asistencial · CNSC Empleo Público", "modo": "simulacro", "minutos": 135, "componentes": {"estado_constitucion": "Estado y Constitución", "empleo_publico": "Empleo público, carrera y régimen disciplinario", "atencion_procedimiento": "Atención al ciudadano y procedimiento administrativo", "gestion_publica": "Gestión pública, MIPG, contratación y documentos", "entidades_territoriales": "Entidades territoriales, Bogotá D.C. y CAR", "comportamental": "Competencias comportamentales (Decreto 815 de 2018)"}, "niveles": {"1": "Básico", "2": "Intermedio", "3": "Avanzado"}, "roles": {"general": "Todos los niveles", "asistencial": "Nivel asistencial", "tecnico": "Nivel técnico", "profesional": "Nivel profesional"}, "clave": "asistencial-03.html"};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY = 'sim-cnsc:' + CFG.clave;
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}
function save(){try{localStorage.setItem(KEY, JSON.stringify(ST))}catch(e){}}
let ST = load();
ST.r = ST.r || {};
$('#tit').textContent = CFG.titulo;
const ITEMS = [];
DATA.forEach(c => c.items.forEach(it => { it.caso = c; ITEMS.push(it); }));

function justHTML(it){
  return '<div class="just">' + it.o.map(o => `<div><b>${o[0]}.</b> <span class="${o[3]?'okt':'not'}">${o[3]?'Es correcta.':'Es incorrecta.'}</span> ${esc(o[2])}</div>`).join('') +
    `<div class="src">Referencia: ${esc(it.f)}</div></div>`;
}
function itemHTML(it, n, mode){
  const r = ST.r[it.id];
  const reveal = mode === 'review' || (CFG.modo === 'practica' && r);
  let h = `<div class="item" id="i-${it.id}"><p class="enun"><span class="n">${n}.</span> <span class="niv">${CFG.niveles[it.niv]}</span> ${esc(it.e)}</p>`;
  it.o.forEach(o => {
    let cls = '';
    if (reveal) { if (o[3]) cls = 'ok'; else if (r === o[0]) cls = 'no'; }
    else if (r === o[0]) cls = 'sel';
    h += `<button class="op ${cls}" data-id="${it.id}" data-l="${o[0]}" ${reveal?'disabled':''}><span class="l">${o[0]}.</span><span>${esc(o[1])}</span></button>`;
  });
  if (reveal) {
    if (mode === 'review') h += `<div class="${r===keyOf(it)?'res-ok':'res-no'}" style="font-size:14px;margin-top:4px">${r ? (r===keyOf(it)?'Respondiste ' + r + ': correcto.':'Respondiste ' + r + '. La respuesta correcta es ' + keyOf(it) + '.') : 'Sin responder. La respuesta correcta es ' + keyOf(it) + '.'}</div>`;
    h += justHTML(it);
  }
  return h + '</div>';
}
const keyOf = it => it.o.find(o => o[3])[0];

function renderList(list, mode){
  let h = '', last = null, n = 0;
  list.forEach(it => {
    n++;
    if (it.caso !== last) { last = it.caso; h += `<div class="caso"><div class="tag">${esc(it.caso.tag)}</div><p>${esc(it.caso.texto)}</p></div>`; }
    h += itemHTML(it, n, mode);
  });
  return h;
}

// ---------- PRÁCTICA ----------
let LIST = [];
let FILTRO = ST.f || {comp:'', niv:'', rol:''};
function practica(){
  const comps = Object.entries(CFG.componentes).map(([k,v]) => `<option value="${k}" ${FILTRO.comp===k?'selected':''}>${esc(v)}</option>`).join('');
  const nivs = Object.entries(CFG.niveles).map(([k,v]) => `<option value="${k}" ${FILTRO.niv===k?'selected':''}>${esc(v)}</option>`).join('');
  const list = ITEMS.filter(it => (!FILTRO.comp || it.caso.comp===FILTRO.comp) && (!FILTRO.niv || String(it.niv)===FILTRO.niv) && (!FILTRO.rol || it.caso.rol===FILTRO.rol || it.caso.rol==='general'));
  const resp = list.filter(it => ST.r[it.id]); const ok = resp.filter(it => ST.r[it.id]===keyOf(it));
  $('#main').innerHTML = `<div class="panel"><p style="margin-top:0">Elige un tema, tu nivel de empleo y la dificultad. Al responder verás de inmediato si acertaste y la explicación de cada opción.</p>
  <div class="row"><select id="fc"><option value="">Todos los temas</option>${comps}</select>
  <select id="fn"><option value="">Todas las dificultades</option>${nivs}</select>
  <select id="fr"><option value="">Todos los niveles de empleo</option>${['asistencial','tecnico','profesional'].map(k => `<option value="${k}" ${FILTRO.rol===k?'selected':''}>${esc(CFG.roles[k])} (y temas comunes)</option>`).join('')}</select>
  <button class="btn sec" id="borrar">Borrar mis respuestas</button></div>
  <p class="stat" id="pst" style="margin-bottom:0">${list.length} preguntas · respondidas ${resp.length} · aciertos ${ok.length}${resp.length? ' (' + Math.round(100*ok.length/resp.length) + ' %)':''}</p></div>` + renderList(list, 'practica');
  $('#prog').textContent = `${ok.length}/${resp.length} aciertos`;
  ['fc','fn','fr'].forEach((id,i) => $('#'+id).onchange = e => { FILTRO[['comp','niv','rol'][i]] = e.target.value; ST.f = FILTRO; save(); practica(); });
  LIST = list;
  $('#borrar').onclick = () => { list.forEach(it => delete ST.r[it.id]); save(); practica(); };
}

// ---------- SIMULACRO ----------
let tick = null;
function inicio(){
  const n = ITEMS.length, cnt = {};
  ITEMS.forEach(it => cnt[it.caso.comp] = (cnt[it.caso.comp]||0) + 1);
  const h = Math.floor(CFG.minutos/60), m = CFG.minutos%60;
  $('#main').innerHTML = `<div class="panel"><h2 style="margin-top:0;color:var(--pri)">Instrucciones</h2>
  <p>Este simulacro tiene <b>${n} preguntas</b> en el formato de Prueba de Juicio Situacional: un caso, enunciados que se completan y tres opciones con una sola respuesta correcta.</p>
  <table>${Object.entries(cnt).map(([k,v]) => `<tr><td>${esc(CFG.componentes[k])}</td><td class="r">${v}</td></tr>`).join('')}</table>
  <p>Tiempo sugerido: <b>${h ? h + ' h ' : ''}${m ? m + ' min' : ''}</b> (unos ${Math.round(CFG.minutos*60/n/6)/10} minutos por pregunta). Cuando se acaba el tiempo puedes seguir, pero el cronómetro lo indica.</p>
  <p>Tus respuestas se guardan en este navegador. Al terminar verás tu puntaje por componente y por dificultad, y la explicación de cada pregunta.</p>
  <button class="btn" id="go">${ST.t0 ? 'Continuar el simulacro' : 'Comenzar'}</button></div>`;
  $('#prog').textContent = `${n} preguntas`;
  $('#go').onclick = () => { if (!ST.t0) { ST.t0 = Date.now(); save(); } examen(); };
}
function reloj(){
  const rest = CFG.minutos*60 - Math.floor((Date.now() - ST.t0)/1000);
  const a = Math.abs(rest), hh = Math.floor(a/3600), mm = Math.floor(a%3600/60), ss = a%60;
  const t = (rest < 0 ? '+' : '') + (hh ? hh + ':' : '') + String(mm).padStart(2,'0') + ':' + String(ss).padStart(2,'0');
  $('#timer').textContent = rest < 0 ? 'Tiempo cumplido ' + t : '⏱ ' + t;
  $('#timer').classList.toggle('low', rest < 600);
}
function examen(){
  $('#main').innerHTML = renderList(ITEMS, 'examen') + `<div class="panel"><button class="btn" id="fin">Terminar y calificar</button></div>`;
  progreso(); reloj(); clearInterval(tick); tick = setInterval(reloj, 1000);
  $('#fin').onclick = () => {
    const faltan = ITEMS.length - Object.keys(ST.r).filter(k => ITEMS.some(i => i.id===k)).length;
    $('#mtxt').textContent = faltan ? `Te faltan ${faltan} preguntas por responder. ¿Quieres calificar de todos modos?` : '¿Quieres terminar y ver tu calificación?';
    $('#modal').classList.remove('hide');
  };
}
function progreso(){
  const r = ITEMS.filter(it => ST.r[it.id]).length;
  $('#prog').textContent = `Respondidas ${r}/${ITEMS.length}`;
}
$('#mno').onclick = () => $('#modal').classList.add('hide');
$('#msi').onclick = () => { $('#modal').classList.add('hide'); ST.fin = Date.now(); save(); resultados(); };
function resultados(){
  clearInterval(tick);
  const ok = ITEMS.filter(it => ST.r[it.id] === keyOf(it)).length;
  const pct = Math.round(1000*ok/ITEMS.length)/10;
  const g = (fn, lab) => { const m = {}; ITEMS.forEach(it => { const k = fn(it); m[k] = m[k] || [0,0]; m[k][1]++; if (ST.r[it.id]===keyOf(it)) m[k][0]++; });
    return Object.entries(m).map(([k,v]) => `<tr><td>${esc(lab(k))}</td><td class="r">${v[0]}/${v[1]}</td><td class="r">${Math.round(100*v[0]/v[1])} %</td></tr>`).join(''); };
  const mins = Math.round(((ST.fin||Date.now()) - ST.t0)/60000);
  $('#timer').textContent = `Tiempo usado: ${Math.floor(mins/60) ? Math.floor(mins/60) + ' h ' : ''}${mins%60} min`;
  $('#prog').textContent = `${ok}/${ITEMS.length} aciertos`;
  $('#main').innerHTML = `<div class="panel"><div class="big">${String(pct).replace('.',',')} %</div>
  <p style="margin-top:4px">${ok} de ${ITEMS.length} respuestas correctas. ${pct >= 75 ? 'Muy buen resultado: repasa las explicaciones de tus errores para afianzarlo.' : pct >= 65 ? 'Vas bien, pero con poco margen: refuerza los componentes con menor porcentaje.' : 'Todavía no estás en zona segura: practica por tema los componentes con menor porcentaje.'}</p>
  <p class="aviso">Referencia: en los procesos Distrito Capital 7, Territorial 14 y CAR, la prueba de competencias funcionales es eliminatoria con mínimo de 65 puntos, y la comportamental es clasificatoria. Este porcentaje de aciertos es una guía de preparación; la CNSC calcula su puntaje con su propia escala, comparando con los demás aspirantes al mismo empleo.</p>
  <h3>Por componente</h3><table>${g(it => it.caso.comp, k => CFG.componentes[k])}</table>
  <h3>Por dificultad</h3><table>${g(it => it.niv, k => CFG.niveles[k])}</table>
  <div class="row" style="margin-top:14px"><button class="btn" id="solo">Ver solo mis errores</button><button class="btn sec" id="todas">Ver todas</button><button class="btn sec" id="otra">Reiniciar el simulacro</button></div></div><div id="rev"></div>`;
  const rev = errs => { const l = errs ? ITEMS.filter(it => ST.r[it.id] !== keyOf(it)) : ITEMS; $('#rev').innerHTML = renderList(l, 'review'); };
  rev(true);
  $('#solo').onclick = () => rev(true); $('#todas').onclick = () => rev(false);
  $('#otra').onclick = () => { ST = {r:{}}; save(); inicio(); window.scrollTo(0,0); };
}

document.addEventListener('click', e => {
  const b = e.target.closest('button.op'); if (!b || b.disabled) return;
  ST.r[b.dataset.id] = b.dataset.l; save();
  const it = ITEMS.find(i => i.id === b.dataset.id);
  const n = b.closest('.item').querySelector('.n').textContent.replace('.','');
  b.closest('.item').outerHTML = itemHTML(it, n, CFG.modo === 'practica' ? 'practica' : 'examen');
  if (CFG.modo === 'practica') { const resp = LIST.filter(i => ST.r[i.id]); const ok = resp.filter(i => ST.r[i.id]===keyOf(i)).length; $('#prog').textContent = `${ok}/${resp.length} aciertos`; $('#pst').textContent = `${LIST.length} preguntas · respondidas ${resp.length} · aciertos ${ok} (${Math.round(100*ok/resp.length)} %)`; }
  else progreso();
});

if (CFG.modo === 'practica') practica();
else if (ST.fin) resultados();
else if (ST.t0) examen();
else inicio();
</script>
</body>
</html>
