 el interesado presentó reposición, pero días después radicó un escrito en el que desiste del recurso, y la alcaldía aceptó el desistimiento.", "items": [{"id": "AP-137", "niv": 1, "e": "La primera resolución, contra la cual no se presentaron recursos, quedó en firme", "f": "Ley 1437 de 2011, art. 87, num. 3", "o": [["A", "desde el día siguiente al de su notificación personal.", "Esa regla aplica a los actos contra los que no procede ningún recurso (art. 87, num. 1). Contra esta resolución sí procedían recursos, de modo que hay que esperar el vencimiento del término para interponerlos.", false], ["B", "desde el día siguiente al vencimiento del término para interponer los recursos.", "El numeral 3 del artículo 87 del CPACA dispone que el acto queda en firme desde el día siguiente al del vencimiento del término para interponer los recursos, si estos no fueron interpuestos.", true], ["C", "desde su expedición, porque no presentar recursos equivale a aceptar la decisión.", "Un acto de carácter particular no queda en firme antes de ser notificado ni antes de que venza el plazo para recurrirlo.", false]]}, {"id": "AP-138", "niv": 2, "e": "La segunda resolución, recurrida en reposición y apelación, queda en firme", "f": "Ley 1437 de 2011, art. 87, num. 2", "o": [["A", "desde el día siguiente a la fecha en que el interesado presentó los recursos.", "Presentar los recursos suspende los efectos del acto; no lo deja en firme.", false], ["B", "desde el día siguiente a la notificación de la decisión que resolvió la reposición, aunque la apelación siga en trámite.", "Mientras la apelación no se resuelva, el acto no está en firme: los recursos se tramitan en el efecto suspensivo (art. 79 del CPACA).", false], ["C", "desde el día siguiente a la notificación de la decisión sobre los recursos interpuestos.", "El numeral 2 del artículo 87 del CPACA dispone que los actos quedan en firme desde el día siguiente a la publicación, comunicación o notificación de la decisión sobre los recursos interpuestos.", true]]}, {"id": "AP-139", "niv": 2, "e": "La tercera resolución, cuyo recurso fue desistido, queda en firme", "f": "Ley 1437 de 2011, art. 87, num. 4", "o": [["A", "desde el día siguiente al de la notificación de la aceptación del desistimiento.", "El numeral 4 del artículo 87 del CPACA establece que el acto queda en firme desde el día siguiente al de la notificación de la aceptación del desistimiento de los recursos.", true], ["B", "al vencer el plazo de dos meses para resolver el recurso, por configurarse el silencio negativo.", "El silencio negativo en recursos supone que el recurso sigue vivo y no se resuelve. Aquí el recurso fue desistido y la aceptación determina la firmeza.", false], ["C", "desde el día siguiente a la radicación del escrito de desistimiento.", "La ley exige que se acepte el desistimiento y se notifique esa aceptación. La sola radicación del escrito no deja en firme el acto.", false]]}]}, {"comp": "atencion_procedimiento", "rol": "profesional", "tag": "Atención al ciudadano y procedimiento administrativo · Nivel profesional · Silencio administrativo negativo", "texto": "Usted es profesional universitario de la Secretaría Jurídica de una gobernación. El 10 de febrero de 2027 un exservidor radicó una solicitud de reconocimiento y pago de unas horas extra. Por un error de reparto, la solicitud no se tramitó y, a 20 de mayo de 2027, la gobernación no ha notificado ninguna decisión. El exservidor no ha presentado recursos ni demanda. Ninguna norma especial fija un plazo superior para decidir este tipo de solicitudes ni prevé silencio positivo. Su jefe le pide un concepto sobre la situación.", "items": [{"id": "AP-140", "niv": 1, "e": "Al haber pasado más de tres meses sin que se notifique decisión, la ley entiende que", "f": "Ley 1437 de 2011, art. 83", "o": [["A", "el exservidor desistió de su solicitud, por no haber insistido en ella.", "El desistimiento tácito se configura cuando el peticionario no atiende un requerimiento (art. 17 del CPACA). La inactividad de la entidad no se le atribuye al peticionario.", false], ["B", "la solicitud fue aceptada y la gobernación debe pagar lo pedido.", "El silencio positivo solo opera en los casos que prevé expresamente una norma especial (art. 84 del CPACA), y el caso aclara que no existe.", false], ["C", "la solicitud fue negada, por configurarse el silencio administrativo negativo.", "El artículo 83 del CPACA dispone que, transcurridos tres meses desde la presentación de una petición sin que se haya notificado decisión que la resuelva, se entiende que esta es negativa.", true]]}, {"id": "AP-141", "niv": 2, "e": "Frente al acto presunto, el exservidor puede presentar recursos", "f": "Ley 1437 de 2011, art. 76", "o": [["A", "dentro de los diez días siguientes al vencimiento de los tres meses.", "El plazo de diez días se cuenta desde la notificación de un acto expreso. Como el acto presunto no se notifica, la ley permite recurrirlo en cualquier tiempo.", false], ["B", "en cualquier tiempo, salvo en el evento en que haya acudido ante el juez.", "El inciso 1 del artículo 76 del CPACA dispone que los recursos contra los actos presuntos pueden interponerse en cualquier tiempo, salvo que se haya acudido ante el juez.", true], ["C", "dentro de los cinco días siguientes a la fecha en que conozca el silencio, mediante recurso de queja.", "La queja procede contra el rechazo de la apelación, no contra los actos presuntos.", false]]}, {"id": "AP-142", "niv": 3, "e": "Sobre las obligaciones de la gobernación después del silencio, el concepto debe señalar que", "f": "Ley 1437 de 2011, art. 83, inciso 3", "o": [["A", "perdió competencia para decidir, porque la ley ya le dio un sentido a la petición.", "El inciso 3 del artículo 83 del CPACA dispone lo contrario: el silencio no excusa a la autoridad del deber de decidir la petición inicial, salvo en dos eventos que aquí no han ocurrido.", false], ["B", "queda libre de responsabilidad, porque la ley le atribuyó un efecto jurídico a su silencio.", "La ocurrencia del silencio negativo no exime de responsabilidad a las autoridades (art. 83, inciso 3). Además, no resolver las peticiones en término es falta disciplinaria (art. 31 del CPACA).", false], ["C", "mantiene el deber de decidir la solicitud, con las excepciones legales.", "El inciso 3 del artículo 83 del CPACA establece que el silencio negativo no exime de responsabilidad ni excusa del deber de decidir la petición inicial. Las únicas excepciones son que el interesado haya recurrido el acto presunto o que, habiendo acudido a la jurisdicción, se haya notificado el auto admisorio de la demanda; ninguna ha ocurrido.", true]]}]}, {"comp": "atencion_procedimiento", "rol": "profesional", "tag": "Atención al ciudadano y procedimiento administrativo · Nivel profesional · Silencio administrativo positivo", "texto": "Usted es profesional universitario de una alcaldía de tercera categoría. Un ciudadano radicó una solicitud de autorización para instalar publicidad exterior en su local y, como no recibió respuesta en quince días, se presentó afirmando que todas las peticiones que no se contestan en término se entienden aceptadas, por lo que ya puede instalar el aviso. Su jefe le pide preparar la respuesta y, de paso, explicar qué ocurriría en un trámite para el cual una ley especial sí previera el silencio positivo.", "items": [{"id": "AP-143", "niv": 1, "e": "Frente al argumento del ciudadano, usted debe explicar que el silencio positivo", "f": "Ley 1437 de 2011, arts. 83 y 84", "o": [["A", "opera para toda petición que no se resuelva dentro de los quince días siguientes a su recepción.", "No responder en quince días es incumplir el término del artículo 14 y puede generar responsabilidad disciplinaria, pero no produce una aceptación presunta.", false], ["B", "opera en los casos que prevén expresamente disposiciones legales especiales.", "El artículo 84 del CPACA dispone que solamente en los casos expresamente previstos en disposiciones legales especiales el silencio de la administración equivale a decisión positiva. La regla general es el silencio negativo (art. 83).", true], ["C", "opera en las peticiones de interés particular, mientras que el negativo se reserva para las de interés general.", "La ley no distingue según el interés de la petición. La regla general es el silencio negativo y el positivo es excepcional.", false]]}, {"id": "AP-144", "niv": 2, "e": "Si una ley especial previera el silencio positivo, para invocarlo el interesado debería", "f": "Ley 1437 de 2011, art. 85", "o": [["A", "protocolizar la constancia de su petición con una declaración jurada de no haber sido notificado.", "El artículo 85 del CPACA ordena protocolizar la constancia o copia de que trata el artículo 15 junto con una declaración jurada de no haberle sido notificada la decisión dentro del término previsto.", true], ["B", "obtener una sentencia del juez administrativo que declare la existencia del acto presunto.", "La ley no exige intervención judicial para invocar el silencio positivo; basta la protocolización con la declaración jurada.", false], ["C", "pedir a la entidad una certificación de silencio positivo, que debe expedirse en cinco días.", "El CPACA no prevé una certificación de la entidad. El procedimiento es la protocolización que hace el propio interesado.", false]]}, {"id": "AP-145", "niv": 2, "e": "En ese supuesto, una vez configurado el silencio positivo, el acto presunto", "f": "Ley 1437 de 2011, arts. 84 y 87, num. 5", "o": [["A", "requiere la ratificación del superior jerárquico para producir efectos.", "Ninguna norma exige ratificación del superior. Los efectos dependen de la protocolización prevista en el artículo 85.", false], ["B", "puede ser objeto de revocación directa en los términos del CPACA.", "El inciso 3 del artículo 84 del CPACA dispone que el acto positivo presunto puede ser objeto de revocación directa en los términos del Código. Su firmeza se produce desde el día siguiente a la protocolización (art. 87, num. 5).", true], ["C", "no puede revocarse por ninguna vía, porque nace de la omisión de la propia entidad.", "El artículo 84 del CPACA prevé expresamente que el acto positivo presunto puede ser objeto de revocación directa, así que no es irrevocable.", false]]}]}, {"comp": "atencion_procedimiento", "rol": "profesional", "tag": "Atención al ciudadano y procedimiento administrativo · Nivel profesional · Trámite y decisión de los recursos", "texto": "Usted es profesional especializado de la Secretaría General de una alcaldía de categoría especial y debe proyectar la decisión de un recurso de reposición con apelación subsidiaria contra una resolución que negó a una servidora el reconocimiento de una bonificación. Con el recurso, la servidora aportó una certificación de las funciones que desempeñó y pidió que se reciba el testimonio de su jefe inmediato. En la actuación interviene también, como tercero, otra servidora cuyos derechos pueden verse afectados con la decisión. No se trata de un procedimiento sancionatorio y no existe norma especial sobre el trámite.", "items": [{"id": "AP-146", "niv": 2, "e": "Como la recurrente pidió pruebas, el término para practicarlas", "f": "Ley 1437 de 2011, art. 79", "o": [["A", "es de diez días, prorrogable por un término igual a solicitud de la recurrente.", "El término probatorio de los recursos puede ser de hasta treinta días, y los términos inferiores pueden prorrogarse una vez sin exceder ese límite.", false], ["B", "puede llegar a sesenta días, porque en la actuación intervienen dos interesadas.", "El término de hasta sesenta días está previsto en el procedimiento sancionatorio cuando hay tres o más investigados o pruebas en el exterior (art. 48). En los recursos el límite es de treinta días.", false], ["C", "no puede superar treinta días, y en el acto que las decrete debe indicarse el día en que vence.", "El artículo 79 del CPACA dispone que, cuando sea del caso practicar pruebas, se señala un término no mayor de treinta días y que en el acto que las decrete se indica el día en que vence el término probatorio.", true]]}, {"id": "AP-147", "niv": 2, "e": "Como en la actuación interviene más de una parte, frente a la certificación que la recurrente aportó con el recurso la alcaldía debe", "f": "Ley 1437 de 2011, art. 79", "o": [["A", "correr traslado de la certificación a la otra interesada por el término de cinco días.", "El artículo 79 del CPACA dispone que, cuando con un recurso se presentan pruebas y en el trámite interviene más de una parte, se da traslado a las demás por el término de cinco días.", true], ["B", "dar traslado a la otra interesada por diez días, igual al plazo para interponer recursos.", "La ley fija para este traslado un término de cinco días; el de diez días corresponde a la interposición de los recursos.", false], ["C", "resolver de plano sin traslado, porque los recursos se deciden sin dilaciones.", "Los recursos se resuelven de plano solo cuando no se piden pruebas ni se decretan de oficio. Aquí la recurrente aportó una prueba y pidió otra, y con más de una parte procede el traslado.", false]]}, {"id": "AP-148", "niv": 2, "e": "Si pasan dos meses desde la interposición de los recursos sin que se notifique decisión, se entiende que", "f": "Ley 1437 de 2011, art. 86", "o": [["A", "la decisión sobre los recursos es negativa y la alcaldía no queda exenta de responsabilidad.", "El artículo 86 del CPACA dispone que, transcurridos dos meses desde la interposición de reposición o apelación sin decisión notificada, se entiende que esta es negativa. Ese silencio no exime de responsabilidad a la entidad ni le impide resolver mientras no se haya notificado el auto admisorio de una demanda.", true], ["B", "la recurrente desistió de los recursos al no exigir su decisión.", "El desistimiento de los recursos debe ser expreso. La falta de decisión es una omisión de la entidad, no de la recurrente.", false], ["C", "los recursos se resolvieron a favor de la recurrente, por operar el silencio administrativo positivo.", "Fuera del procedimiento sancionatorio (art. 52), la ley atribuye al silencio en recursos un efecto negativo.", false]]}]}, {"comp": "atencion_procedimiento", "rol": "profesional", "tag": "Atención al ciudadano y procedimiento administrativo · Nivel profesional · Revocatoria directa", "texto": "Usted es profesional especializado de la oficina jurídica de una alcaldía de primera categoría. Le asignan dos asuntos. En el primero, la administración advirtió que una resolución de 2026 reconoció a un servidor una prima de antigüedad sin que cumpliera los requisitos del acuerdo municipal que la regula; no hay indicios de fraude y el servidor ya recibe el pago. En el segundo, un ciudadano pide la revocatoria directa de la resolución que le negó un subsidio de vivienda, alegando que es manifiestamente contraria a la ley; contra esa resolución él ya había interpuesto reposición y apelación, que fueron resueltas en su contra.", "items": [{"id": "AP-149", "niv": 1, "e": "Las causales que permiten a la administración revocar directamente sus actos son", "f": "Ley 1437 de 2011, art. 93", "o": [["A", "la pérdida de fuerza ejecutoria del acto, el decaimiento por la desaparición de sus fundamentos de derecho y el vencimiento del plazo de su vigencia.", "Esos supuestos corresponden a la pérdida de fuerza ejecutoria (art. 91 del CPACA), una figura distinta de la revocatoria directa.", false], ["B", "las mismas causales de nulidad de los actos, como la falsa motivación, la desviación de poder y la expedición irregular.", "Esas son causales de nulidad que decide el juez de lo contencioso administrativo. La revocatoria directa tiene sus propias causales en el artículo 93 del CPACA.", false], ["C", "la oposición manifiesta a la Constitución o a la ley, la inconformidad con el interés público o social y el agravio injustificado a una persona.", "El artículo 93 del CPACA establece tres causales de revocación directa: manifiesta oposición a la Constitución o a la ley, no estar conformes con el interés público o social o atentar contra él, y causar agravio injustificado a una persona.", true]]}, {"id": "AP-150", "niv": 3, "e": "Para dejar sin efectos la resolución que reconoció la prima al servidor, la alcaldía", "f": "Ley 1437 de 2011, art. 97", "o": [["A", "puede revocarla de oficio en cualquier tiempo, porque un acto manifiestamente ilegal no genera derechos.", "El artículo 97 del CPACA protege los actos que reconocieron un derecho particular y concreto: sin el consentimiento del titular, la administración no puede revocarlos, aunque los considere ilegales.", false], ["B", "necesita el consentimiento previo, expreso y escrito del servidor o, si lo niega, demandar su propio acto.", "El artículo 97 del CPACA dispone que el acto que reconoció un derecho particular y concreto no puede revocarse sin el consentimiento previo, expreso y escrito del titular. Si este lo niega y la autoridad considera el acto contrario a la ley, debe demandarlo ante la jurisdicción de lo contencioso administrativo.", true], ["C", "puede revocarla sin el consentimiento del servidor si lo hace dentro de los dos meses siguientes a la fecha en que advirtió el error.", "El plazo de dos meses del artículo 95 es para resolver las solicitudes de revocatoria. No autoriza a revocar sin consentimiento un acto que reconoció un derecho particular.", false]]}, {"id": "AP-151", "niv": 3, "e": "Frente a la solicitud del ciudadano, la revocatoria directa", "f": "Ley 1437 de 2011, arts. 93, num. 1, y 94", "o": [["A", "procede, porque puede solicitarse en cualquier tiempo, incluso después de haber agotado los recursos.", "El artículo 94 del CPACA limita la revocatoria a solicitud de parte cuando se invoca la causal de oposición manifiesta a la Constitución o a la ley y el peticionario ya interpuso los recursos.", false], ["B", "procede, y su presentación revive los términos para demandar la resolución ante la jurisdicción.", "Aun si procediera, el artículo 96 del CPACA establece que ni la petición de revocatoria ni su decisión reviven los términos para demandar el acto.", false], ["C", "es improcedente por la causal invocada, porque el ciudadano ya interpuso los recursos de que era susceptible el acto.", "El artículo 94 del CPACA dispone que la revocatoria directa a solicitud de parte no procede por la causal del numeral 1 del artículo 93 (oposición manifiesta a la Constitución o a la ley) cuando el peticionario haya interpuesto los recursos de que el acto era susceptible.", true]]}, {"id": "AP-152", "niv": 2, "e": "Cuando una solicitud de revocatoria directa es procedente, la alcaldía debe resolverla", "f": "Ley 1437 de 2011, art. 95", "o": [["A", "dentro de los tres meses siguientes a su presentación, so pena de que se entienda negada por silencio.", "El plazo es de dos meses, y el artículo 96 aclara que la solicitud de revocatoria no da lugar a la aplicación del silencio administrativo.", false], ["B", "dentro de los dos meses siguientes a su presentación, y contra la decisión no procede recurso.", "El artículo 95 del CPACA ordena resolver las solicitudes de revocación directa dentro de los dos meses siguientes a su presentación y dispone que contra esa decisión no procede recurso.", true], ["C", "dentro de los quince días siguientes a su presentación, y contra la decisión procede reposición.", "El término para resolver la revocatoria no es el general de las peticiones, y contra su decisión no procede ningún recurso.", false]]}]}, {"comp": "atencion_procedimiento", "rol": "tecnico", "tag": "Atención al ciudadano y procedimiento administrativo · Nivel técnico · Notificación de actos administrativos", "texto": "Usted es técnico administrativo de la oficina de talento humano de una empresa social del Estado del orden departamental. Un compañero notificó personalmente a un exfuncionario la resolución que le negó el pago de unas vacaciones; le entregó la copia, pero olvidó indicarle los recursos que procedían, ante quién y en qué plazos. Aun así, ocho días hábiles después, el exfuncionario presentó recurso de reposición. En otro expediente, como no fue posible conocer la dirección ni otro dato de contacto de una exfuncionaria, la citación y después el aviso con copia íntegra de la resolución se publicaron en la página web y en la cartelera de la entidad por cinco días. El aviso se retiró el martes 19 de octubre de 2027; entre el 19 y el 29 de octubre de 2027 no hay festivos.", "items": [{"id": "AP-153", "niv": 1, "e": "En toda diligencia de notificación personal, la entidad debe entregar al interesado", "f": "Ley 1437 de 2011, art. 67", "o": [["A", "copia íntegra, auténtica y gratuita del acto, con indicación de los recursos, ante quién y en qué plazo.", "El inciso 2 del artículo 67 del CPACA ordena entregar copia íntegra, auténtica y gratuita del acto, con anotación de la fecha y la hora, los recursos que legalmente proceden, las autoridades ante quienes deben interponerse y los plazos para hacerlo.", true], ["B", "copia simple de la parte resolutiva del acto, previo pago del valor de la reproducción por el interesado.", "La ley exige copia íntegra, no solo de la parte resolutiva, y gratuita: el interesado no paga por la copia que se le entrega en la notificación.", false], ["C", "un extracto del acto con los recursos que proceden, y la copia íntegra solo si el interesado la pide por escrito.", "La copia íntegra hace parte obligatoria de la diligencia, sin que el interesado tenga que pedirla.", false]]}, {"id": "AP-154", "niv": 3, "e": "Respecto de la notificación al exfuncionario que no fue informado de los recursos, lo correcto es concluir que", "f": "Ley 1437 de 2011, arts. 67 y 72", "o": [["A", "aunque la diligencia tuvo un defecto, la decisión produce efectos porque el exfuncionario interpuso el recurso legal.", "El artículo 72 del CPACA dispone que, sin el lleno de los requisitos, no se tiene por hecha la notificación ni produce efectos la decisión, a menos que la parte interesada revele que conoce el acto, consienta la decisión o interponga los recursos legales.", true], ["B", "debe repetirse la notificación y el recurso presentado se tiene por no interpuesto.", "No es necesario repetirla: al interponer el recurso, el interesado se da por notificado por conducta concluyente, y su recurso debe tramitarse.", false], ["C", "la notificación es válida, porque la indicación de los recursos es una formalidad que no afecta sus efectos.", "El artículo 67 del CPACA dispone que el incumplimiento de cualquiera de los requisitos de la diligencia invalida la notificación, y la indicación de los recursos es uno de ellos.", false]]}, {"id": "AP-155", "niv": 3, "e": "La notificación a la exfuncionaria cuya dirección se desconoce se considera surtida al finalizar el", "f": "Ley 1437 de 2011, art. 69, inciso 3", "o": [["A", "martes 19 de octubre de 2027, día en que se retiró el aviso.", "El inciso 3 del artículo 69 del CPACA no hace coincidir la notificación con el día del retiro: la notificación se surte al finalizar el día siguiente.", false], ["B", "miércoles 20 de octubre de 2027.", "Cuando se desconoce la información del destinatario, el aviso se publica por cinco días y la notificación se considera surtida al finalizar el día siguiente al retiro del aviso (art. 69, inciso 3, del CPACA). El aviso se retiró el martes 19, de modo que la notificación se surte al finalizar el miércoles 20.", true], ["C", "martes 26 de octubre de 2027, cinco días hábiles después del retiro del aviso.", "La ley no agrega un plazo de cinco días después del retiro. Los cinco días corresponden al tiempo de publicación, que ya se cumplió.", false]]}]}, {"comp": "atencion_procedimiento", "rol": "asistencial", "tag": "Atención al ciudadano y procedimiento administrativo · Nivel asistencial · Racionalización de trámites", "texto": "Usted es auxiliar administrativo de la ventanilla de atención de un instituto distrital de Bogotá que inscribe a los interesados en un programa de formación para el empleo. Durante la mañana se presentan tres situaciones. Un compañero le pide a una ciudadana una declaración extrajuicio ante notario sobre su lugar de residencia, aunque ninguna norma del programa la exige. Un ciudadano solicita el duplicado del carné del programa que expidió el instituto y que perdió, y le indican que primero debe traer la denuncia por pérdida. Por último, usted advierte que en un formulario radicado el nombre del barrio del solicitante tiene un error de ortografía que no deja dudas sobre lo que quiso escribir.", "items": [{"id": "AP-156", "niv": 1, "e": "Frente a la exigencia de la declaración extrajuicio sobre el lugar de residencia, lo correcto es", "f": "Decreto Ley 019 de 2012, art. 7 (modifica el art. 10 del Decreto 2150 de 1995)", "o": [["A", "reemplazarla por un certificado de residencia expedido por la junta de acción comunal del barrio.", "Sustituir la declaración por otro documento crea un requisito que la norma del programa no prevé. La ley ordena tener como suficiente la afirmación de la ciudadana.", false], ["B", "aceptar la declaración solo si está autenticada ante notario, para darle mayor seguridad al trámite.", "El Decreto Ley 019 de 2012 prohíbe exigir declaraciones extrajuicio como requisito para un trámite, y el artículo 25 elimina las autenticaciones que la ley no exige.", false], ["C", "no exigirla, porque basta la afirmación de la ciudadana, que se entiende hecha bajo la gravedad del juramento.", "El artículo 7 del Decreto Ley 019 de 2012 prohíbe exigir declaraciones extrajuicio como requisito para el trámite de una actuación administrativa y dispone que basta la afirmación del particular ante la autoridad, que se entiende hecha bajo juramento.", true]]}, {"id": "AP-157", "niv": 1, "e": "Frente a la solicitud de duplicado del carné, el instituto debe", "f": "Decreto Ley 019 de 2012, art. 30", "o": [["A", "tramitar el duplicado con la afirmación del ciudadano sobre la pérdida, que se entiende hecha bajo juramento.", "El artículo 30 del Decreto Ley 019 de 2012 prohíbe exigir la denuncia por pérdida de documentos para expedir el duplicado o reemplazo; basta la afirmación del peticionario, que se entiende hecha bajo la gravedad del juramento.", true], ["B", "exigir la publicación de un aviso de pérdida en un periódico de circulación local antes de expedir el duplicado.", "Es un requisito no previsto en la ley que contradice el principio de simplicidad de los trámites (art. 6 del Decreto Ley 019 de 2012).", false], ["C", "exigir la denuncia por pérdida ante la Policía, porque protege al instituto frente a un posible uso fraudulento del carné.", "Ninguna autoridad administrativa puede exigir esa denuncia para expedir un duplicado. La excepción de la norma se refiere a los documentos de identificación de la fuerza pública y de los cuerpos de seguridad del Estado.", false]]}, {"id": "AP-158", "niv": 2, "e": "Respecto del formulario con el error de ortografía, a usted le corresponde", "f": "Decreto Ley 019 de 2012, art. 11", "o": [["A", "rechazar la inscripción, porque los datos del formulario son la base del registro y deben ser exactos.", "No procede el rechazo: el error no genera duda sobre lo que quiso decir el solicitante ni es relevante para decidir de fondo.", false], ["B", "corregir el error sin detener el trámite y comunicar la corrección al interesado por el medio más idóneo.", "El artículo 11 del Decreto Ley 019 de 2012 permite a cualquier funcionario corregir errores de citas, ortografía, mecanografía o aritmética sin detener la actuación, comunicando la corrección al interesado por el medio más idóneo.", true], ["C", "devolver el formulario al solicitante para que lo diligencie de nuevo sin errores.", "El artículo 11 del Decreto Ley 019 de 2012 prohíbe devolver o rechazar solicitudes contenidas en formularios por errores de ortografía, salvo que el idioma sea relevante para el fondo y exista duda sobre el querer del solicitante, lo que no ocurre aquí.", false]]}]}, {"comp": "atencion_procedimiento", "rol": "tecnico", "tag": "Atención al ciudadano y procedimiento administrativo · Nivel técnico · Racionalización de trámites", "texto": "Usted es técnico administrativo de la oficina de personal de la Secretaría de Educación de un departamento. Un docente que solicita la actualización de su historia laboral presenta fotocopias simples de sus diplomas, y un compañero le exige que las autentique en notaría. El mismo docente necesita acreditar el tiempo que trabajó en una alcaldía del departamento, cuyo certificado reposa en el archivo de esa alcaldía, y pregunta si debe ir él mismo a pedirlo. Además, para seguir pagando un auxilio periódico a un exservidor que reside en Colombia, la oficina acostumbra pedirle cada semestre un certificado de supervivencia.", "items": [{"id": "AP-159", "niv": 2, "e": "Frente a la exigencia de autenticar las fotocopias de los diplomas, lo procedente es", "f": "Decreto Ley 019 de 2012, art. 25", "o": [["A", "exigir los diplomas originales y devolverlos después de cotejarlos con las copias.", "Exigir originales para cotejo es un requisito que el artículo 25 también prohíbe, salvo en los casos que la norma exceptúa.", false], ["B", "exigir la autenticación, porque los diplomas son documentos privados que carecen de presunción de autenticidad.", "La prohibición de exigir copias autenticadas cubre este trámite. Si hay dudas, la secretaría puede verificar la información, pero no trasladar al docente la carga de autenticar.", false], ["C", "recibir las copias simples, sin perjuicio de los controles o verificaciones que la secretaría deba realizar.", "El artículo 25 del Decreto Ley 019 de 2012 prohíbe a las autoridades administrativas exigir documentos originales autenticados o copias autenticadas, sin perjuicio de los controles o verificaciones que deban hacer. La excepción se refiere al reconocimiento o pago de pensiones, que no es el caso.", true]]}, {"id": "AP-160", "niv": 3, "e": "Sobre el certificado de tiempo de servicio que reposa en la alcaldía, debe explicarse al docente que", "f": "Decreto Ley 019 de 2012, art. 9, parágrafo", "o": [["A", "debe aportarlo él mismo, porque la prohibición de exigir documentos solo cubre los que reposan en la propia secretaría.", "El parágrafo del artículo 9 del Decreto Ley 019 de 2012 extiende la regla a los documentos que reposan en otra entidad pública: el solicitante puede indicar dónde están para que la entidad los requiera directamente.", false], ["B", "no necesita acreditar ese tiempo, porque la secretaría debe reconocerlo con su sola afirmación bajo juramento.", "La afirmación bajo juramento reemplaza las declaraciones extrajuicio, no la prueba del tiempo de servicio. La norma permite que la secretaría obtenga el certificado directamente de la alcaldía.", false], ["C", "puede indicar la entidad donde reposa para que la secretaría lo pida directamente, sin perjuicio de que él decida aportarlo.", "El parágrafo del artículo 9 del Decreto Ley 019 de 2012 dispone que, cuando los documentos reposen en otra entidad pública, el solicitante puede indicarla para que la entidad que tramita los requiera de manera directa, sin perjuicio de que la persona los aporte.", true]]}, {"id": "AP-161", "niv": 2, "e": "Sobre el certificado de supervivencia que se pide al exservidor, la oficina debe", "f": "Decreto Ley 019 de 2012, art. 21", "o": [["A", "dejar de exigirlo y verificar la supervivencia en las bases del registro civil.", "El artículo 21 del Decreto Ley 019 de 2012 ordena verificar la supervivencia consultando únicamente las bases de datos del Registro Civil de la Registraduría Nacional del Estado Civil, servicio gratuito, y prohíbe exigir certificados de fe de vida. Para connacionales en el exterior rige una regla especial (art. 22), que no aplica a este exservidor.", true], ["B", "seguir exigiéndolo, pero aceptarlo aunque no esté autenticado.", "El artículo 21 del Decreto Ley 019 de 2012 prohíbe exigir certificados de fe de vida. El problema no es la autenticación, sino el certificado mismo.", false], ["C", "reemplazarlo por la presentación personal semestral del exservidor en la oficina.", "El artículo 21 también prohíbe exigir presentaciones personales para probar la supervivencia.", false]]}]}, {"comp": "atencion_procedimiento", "rol": "asistencial", "tag": "Atención al ciudadano y procedimiento administrativo · Nivel asistencial · Atención incluyente", "texto": "Usted es auxiliar administrativo del centro de atención a la ciudadanía de una gobernación del Caribe. En la fila de turnos esperan un adulto mayor que camina con bastón y una mujer en avanzado estado de embarazo. Luego llega un hombre que habla wayuunaiki, no se comunica en español y quiere presentar verbalmente una petición sobre el servicio de agua de su comunidad; la gobernación no tiene intérpretes en su planta. Más tarde se acerca una persona sorda que quiere presentar una petición sobre un subsidio y se comunica en lengua de señas.", "items": [{"id": "AP-162", "niv": 1, "e": "Respecto del orden de atención del adulto mayor y de la mujer embarazada, usted debe", "f": "Ley 1437 de 2011, art. 5, num. 6; Decreto Ley 019 de 2012, art. 13", "o": [["A", "asignarles turno como a los demás, para no afectar el derecho a la igualdad de quienes llegaron antes.", "La atención preferencial es un desarrollo del derecho a la igualdad material del artículo 13 de la Constitución, no una vulneración de ese derecho.", false], ["B", "darles atención preferencial frente a quienes esperan en la fila.", "El numeral 6 del artículo 5 del CPACA reconoce el derecho a atención especial y preferente de adultos mayores y mujeres gestantes, y el artículo 13 del Decreto Ley 019 de 2012 obliga a las entidades a establecer mecanismos de atención preferencial para ellos.", true], ["C", "darles prelación solo si presentan un documento que acredite su edad o su estado de embarazo.", "La ley no condiciona la atención preferente a la presentación de documentos. Exigirlos sería un requisito adicional no previsto.", false]]}, {"id": "AP-163", "niv": 2, "e": "Para recibir la petición del hombre que habla wayuunaiki, a usted le corresponde", "f": "Decreto 1069 de 2015, art. 2.2.3.12.9 (adicionado por el Decreto 1166 de 2016)", "o": [["A", "pedirle que regrese con un familiar que hable español, para que la petición quede clara desde el inicio.", "Las personas que hablan una lengua nativa pueden presentar peticiones verbales en su lengua ante cualquier autoridad. Exigir un acompañante traslada al ciudadano una carga que la ley pone en la entidad.", false], ["B", "dejar constancia de que no hay intérprete y grabar su petición verbal para su posterior traducción y respuesta.", "El artículo 2.2.3.12.9 del Decreto 1069 de 2015 permite presentar peticiones verbales en lengua nativa y dispone que, si la entidad no tiene intérpretes en su planta, deja constancia de ello y graba la petición en cualquier medio tecnológico o electrónico para su posterior traducción y respuesta.", true], ["C", "remitirlo a la Defensoría del Pueblo, que es la entidad encargada de recibir las peticiones de los pueblos indígenas.", "La petición se dirige a la gobernación y debe recibirla la gobernación. La Defensoría presta asistencia, pero no sustituye a la autoridad competente.", false]]}, {"id": "AP-164", "niv": 2, "e": "Para recibir la petición de la persona sorda, usted debe", "f": "Decreto 1069 de 2015, art. 2.2.3.12.8 (adicionado por el Decreto 1166 de 2016); Ley 1437 de 2011, art. 5, num. 6", "o": [["A", "atenderla únicamente si llega acompañada de un intérprete de lengua de señas que ella misma consiga.", "Corresponde a la entidad, directamente o por mecanismos idóneos, adoptar las medidas de inclusión. No puede trasladar a la persona la carga de conseguir el intérprete.", false], ["B", "pedirle que presente la petición por escrito, porque no puede formularla verbalmente.", "La persona puede presentar su petición verbal en lengua de señas. Obligarla a escribir es una barrera, contraria al deber de adoptar medidas de inclusión.", false], ["C", "brindarle atención prioritaria y diferencial, apoyándose en personal o mecanismos idóneos.", "El artículo 2.2.3.12.8 del Decreto 1069 de 2015 obliga a adoptar medidas de inclusión para recibir peticiones verbales de personas con discapacidad, como atención prioritaria y diferencial y personal especializado para recibirlas y apoyar su precisión. El CPACA (art. 5, num. 6) reconoce su derecho a atención preferente.", true]]}]}, {"comp": "atencion_procedimiento", "rol": "general", "tag": "Atención al ciudadano y procedimiento administrativo · Deberes de las autoridades en la atención al público", "texto": "La alcaldía de un municipio de quinta categoría revisa su protocolo de atención a la ciudadanía. Un borrador propone atender al público de lunes a jueves de 8:00 a. m. a 12:00 m. y de 2:00 a 4:00 p. m., y cerrar la puerta a las 4:00 p. m. dejando sin atender a quienes estén dentro. También propone no publicar la carta de trato digno porque nadie la ha solicitado y exigir la presentación personal ante notario de las peticiones de certificados laborales, aunque ninguna ley lo exige.", "items": [{"id": "AP-165", "niv": 1, "e": "Sobre el horario propuesto, que suma 24 horas semanales, el protocolo debe ajustarse para", "f": "Ley 1437 de 2011, art. 7, num. 2", "o": [["A", "garantizar atención personal al público durante al menos 30 horas a la semana.", "El CPACA fija un mínimo mayor: 40 horas semanales de atención personal.", false], ["B", "garantizar atención personal al público durante al menos 40 horas a la semana.", "El numeral 2 del artículo 7 del CPACA obliga a garantizar atención personal al público como mínimo durante cuarenta horas a la semana, distribuidas en horarios que satisfagan las necesidades del servicio.", true], ["C", "garantizar atención personal al público durante al menos 48 horas a la semana.", "La ley fija un mínimo de 40 horas. Nada impide ampliar la atención, pero 48 horas no es el mínimo legal.", false]]}, {"id": "AP-166", "niv": 1, "e": "Sobre las personas que estén dentro de la oficina a la hora del cierre, el protocolo debe disponer que", "f": "Ley 1437 de 2011, art. 7, num. 3", "o": [["A", "se atienda a todas las que ingresaron dentro del horario normal de atención.", "El numeral 3 del artículo 7 del CPACA impone el deber de atender a todas las personas que hayan ingresado a las oficinas dentro del horario normal de atención.", true], ["B", "se atienda solo a quienes vengan a radicar peticiones con términos próximos a vencer.", "La ley no permite seleccionar a quiénes atender: el deber cubre a todas las personas que ingresaron dentro del horario.", false], ["C", "se les entregue un turno preferente para que regresen al día siguiente.", "Diferir la atención de quienes ya ingresaron dentro del horario incumple el deber del numeral 3 del artículo 7.", false]]}, {"id": "AP-167", "niv": 2, "e": "En cuanto a la carta de trato digno, la alcaldía debe", "f": "Ley 1437 de 2011, art. 7, num. 5", "o": [["A", "expedirla, hacerla visible y actualizarla cada año, con los derechos de los usuarios y los medios para garantizarlos.", "El numeral 5 del artículo 7 del CPACA obliga a expedir, hacer visible y actualizar anualmente una carta de trato digno que especifique los derechos de los usuarios y los medios dispuestos para garantizarlos.", true], ["B", "expedirla cuando la Personería o un ciudadano la soliciten, y mantenerla en el archivo de la entidad.", "La carta de trato digno no depende de que alguien la solicite. La ley exige expedirla, hacerla visible y actualizarla anualmente.", false], ["C", "expedirla al inicio de cada periodo de gobierno y actualizarla con el plan de desarrollo.", "La ley exige actualizarla anualmente, no cada cuatro años.", false]]}, {"id": "AP-168", "niv": 2, "e": "Sobre la presentación personal ante notario de las peticiones de certificados laborales, el protocolo", "f": "Ley 1437 de 2011, art. 9, num. 3; Decreto Ley 019 de 2012, art. 5", "o": [["A", "puede incluirla, siempre que se trate de certificados que contengan datos personales del servidor.", "Proteger datos personales no justifica exigir presentación personal. Basta verificar la identidad o la autorización de quien pide el certificado.", false], ["B", "puede incluirla, si se aprueba mediante resolución del alcalde publicada en la página web.", "Las autoridades no pueden crear requisitos o formalidades adicionales a los previstos en la ley (art. 84 de la Constitución y art. 9, num. 5, del CPACA), aunque los adopten por acto administrativo.", false], ["C", "no puede incluirla, porque está prohibido exigir presentación personal de peticiones cuando la ley no lo exige.", "El numeral 3 del artículo 9 del CPACA prohíbe a las autoridades exigir la presentación personal de peticiones, recursos o documentos cuando la ley no lo exija, y el artículo 5 del Decreto Ley 019 de 2012 proscribe las notas de presentación personal no ordenadas por la ley.", true]]}]}, {"comp": "atencion_procedimiento", "rol": "profesional", "tag": "Atención al ciudadano y procedimiento administrativo · Nivel profesional · Actuación administrativa", "texto": "Usted es profesional universitario de la Secretaría de Gobierno de un municipio de segunda categoría, que tramita la solicitud de un comerciante para ocupar temporalmente un tramo de la plaza principal con una feria artesanal durante diciembre. En el expediente se incorporaron informes técnicos de las secretarías de Planeación y de Movilidad. Los propietarios de los locales vecinos, cuyos accesos podrían quedar bloqueados, pidieron ser reconocidos como terceros. Además, la secretaría expidió un auto que ordena una visita al sitio, y el comerciante quiere recurrirlo.", "items": [{"id": "AP-169", "niv": 2, "e": "Respecto de los informes técnicos incorporados al expediente, el comerciante", "f": "Ley 1437 de 2011, art. 40", "o": [["A", "tiene la oportunidad de controvertirlos antes de que se dicte la decisión de fondo.", "El artículo 40 del CPACA establece que el interesado contará con la oportunidad de controvertir las pruebas aportadas o practicadas dentro de la actuación antes de que se dicte una decisión de fondo.", true], ["B", "no puede controvertirlos, porque fueron elaborados de oficio por otras dependencias de la alcaldía.", "Que las pruebas se decreten o practiquen de oficio no impide controvertirlas: el artículo 40 cubre las pruebas aportadas o practicadas dentro de la actuación.", false], ["C", "solo puede controvertirlos mediante recurso de reposición, una vez se expida la decisión de fondo.", "La ley garantiza la controversia de las pruebas durante la actuación, antes de la decisión, sin perjuicio de los recursos posteriores.", false]]}, {"id": "AP-170", "niv": 2, "e": "La solicitud de los propietarios vecinos para intervenir como terceros debe", "f": "Ley 1437 de 2011, art. 38", "o": [["A", "tramitarse como un derecho de petición independiente, con término de quince días y recurso de reposición.", "El artículo 38 del CPACA regula expresamente la intervención de terceros: se resuelve de plano y sin recurso.", false], ["B", "resolverse de plano, y contra esa decisión no procede recurso.", "El artículo 38 del CPACA permite intervenir a los terceros cuyos derechos o situación jurídica puedan resultar afectados por una actuación en interés particular. Su solicitud se resuelve de plano y contra esa decisión no procede recurso alguno.", true], ["C", "rechazarse, porque en las actuaciones iniciadas en interés particular solo puede intervenir el solicitante.", "El numeral 2 del artículo 38 del CPACA permite la intervención de terceros cuando la actuación en interés particular pueda afectar sus derechos o causarles perjuicios, como ocurre con los vecinos.", false]]}, {"id": "AP-171", "niv": 1, "e": "Contra el auto que ordenó la visita al sitio", "f": "Ley 1437 de 2011, art. 75", "o": [["A", "procede reposición, porque toda decisión de la administración puede recurrirse.", "No toda decisión es recurrible: el artículo 75 del CPACA excluye los recursos contra los actos de trámite, salvo norma expresa.", false], ["B", "procede apelación ante el alcalde, por tratarse de una decisión de un secretario de despacho.", "La apelación procede contra actos definitivos (art. 74 del CPACA). El auto que ordena una visita es de trámite.", false], ["C", "no procede recurso, porque es un acto de trámite y no hay norma expresa que lo permita.", "El artículo 75 del CPACA dispone que no hay recurso contra los actos de carácter general ni contra los de trámite, preparatorios o de ejecución, salvo los casos previstos en norma expresa. Ordenar una visita impulsa la actuación sin decidir de fondo.", true]]}]}, {"comp": "atencion_procedimiento", "rol": "asistencial", "tag": "Atención al ciudadano y procedimiento administrativo · Nivel asistencial · Acceso a la información pública", "texto": "Usted es auxiliar administrativo del centro de atención al usuario de una corporación autónoma regional. Un estudiante universitario se acerca a la ventanilla y pide de forma verbal información sobre los permisos de vertimientos otorgados en 2026 en una cuenca, incluidas copias de unas 300 páginas de resoluciones que no están publicadas en la página web. Un compañero le sugiere preguntarle al estudiante para qué quiere la información antes de recibir la solicitud. El estudiante pregunta cuánto le costarán las copias y cómo recibirá la respuesta.", "items": [{"id": "AP-172", "niv": 1, "e": "Frente a la sugerencia de preguntar para qué quiere la información, lo correcto es", "f": "Ley 1712 de 2014, arts. 3 (principio de no discriminación) y 25", "o": [["A", "pedirle que presente la solicitud por escrito, con una motivación que permita clasificarla.", "El artículo 25 de la Ley 1712 de 2014 permite presentar la solicitud de acceso de forma oral o escrita, y la ley no exige motivarla.", false], ["B", "recibir la solicitud sin exigirle que exprese la causa o el motivo por el que la pide.", "El principio de no discriminación del artículo 3 de la Ley 1712 de 2014 obliga a entregar la información a todas las personas que la soliciten, en igualdad de condiciones y sin exigir expresión de causa o motivación.", true], ["C", "exigirle que explique el uso que dará a la información, para garantizar su uso responsable.", "El principio de responsabilidad en el uso de la información recae en quien la usa, pero no autoriza a la entidad a exigir motivación para entregarla.", false]]}, {"id": "AP-173", "niv": 1, "e": "Sobre el costo de las copias, usted debe informarle que", "f": "Ley 1712 de 2014, arts. 3 (principio de gratuidad) y 26", "o": [["A", "pagará la tarifa que fije la corporación, que puede incluir el tiempo del personal que prepara las copias.", "Incluir el tiempo del personal supera el costo de reproducción. La ley prohíbe cobrar valores adicionales a ese costo.", false], ["B", "la respuesta es gratuita en su totalidad, incluidas las 300 páginas de copias físicas.", "El principio de gratuidad no impide cobrar la reproducción: el artículo 26 permite un costo que no supere el valor de la reproducción y el envío.", false], ["C", "solo pagará un valor que no supere el costo de la reproducción y el envío de la información.", "El artículo 26 de la Ley 1712 de 2014 dispone que la respuesta será gratuita o sujeta a un costo que no supere el valor de la reproducción y envío, y el principio de gratuidad prohíbe cobrar valores adicionales a ese costo.", true]]}, {"id": "AP-174", "niv": 2, "e": "Como la solicitud se presentó de forma verbal, la respuesta debe darse", "f": "Decreto 1069 de 2015, art. 2.2.3.12.10 (adicionado por el Decreto 1166 de 2016); Ley 1712 de 2014, art. 26", "o": [["A", "por escrito, de preferencia por medio electrónico si el estudiante lo consiente.", "El artículo 2.2.3.12.10 del Decreto 1069 de 2015 ordena responder por escrito las solicitudes verbales de acceso a la información, una vez radicadas y con constancia. El artículo 26 de la Ley 1712 de 2014 prefiere la respuesta electrónica cuando el solicitante lo consiente.", true], ["B", "de forma verbal en la misma ventanilla, porque la respuesta debe darse por el mismo medio en que se pidió.", "La norma reglamentaria exige que la respuesta a solicitudes verbales de acceso a información se dé por escrito.", false], ["C", "de forma verbal en la ventanilla, siempre que el estudiante firme la constancia de que la recibió.", "Para las solicitudes verbales de acceso a información pública, el art. 2.2.3.12.10 del Decreto 1069 de 2015 exige respuesta escrita; además, el art. 26 de la Ley 1712 de 2014 define la respuesta como un acto escrito. Una constancia firmada no reemplaza ese acto.", false]]}]}, {"comp": "atencion_procedimiento", "rol": "profesional", "tag": "Atención al ciudadano y procedimiento administrativo · Nivel profesional · Información clasificada y reservada", "texto": "Usted es profesional universitario de la Secretaría General de una gobernación y debe proyectar respuestas a solicitudes de acceso a información. Una veeduría pide las hojas de vida completas de los contratistas de prestación de servicios de la secretaría; los documentos incluyen la formación académica y la experiencia, pero también la dirección de residencia, el teléfono personal y certificados médicos. Otro ciudadano solicita los documentos en los que los asesores del gobernador expusieron sus opiniones durante la discusión, aún no concluida, de un proyecto de ordenanza.", "items": [{"id": "AP-175", "niv": 2, "e": "La dirección de residencia, el teléfono personal y los certificados médicos de los contratistas son información", "f": "Ley 1712 de 2014, arts. 6, lit. c, y 18", "o": [["A", "pública clasificada, porque su divulgación puede dañar el derecho a la intimidad de las personas.", "El artículo 6, literal c, de la Ley 1712 de 2014 define la información clasificada como la que pertenece al ámbito particular y privado de una persona, y el artículo 18 permite negar su acceso cuando pueda dañar, entre otros, el derecho a la intimidad.", true], ["B", "pública reservada, porque su divulgación puede afectar la seguridad pública y la defensa nacional.", "La información reservada se exceptúa por daño a intereses públicos (art. 19). Los datos personales de los contratistas se protegen por el daño a derechos de personas naturales (art. 18).", false], ["C", "pública sin restricción, porque quienes contratan con el Estado renuncian a su intimidad.", "Contratar con el Estado no suprime el derecho a la intimidad. La ley exige publicar datos como la formación y la experiencia, pero omite los que afecten la privacidad (art. 9, parágrafo 2).", false]]}, {"id": "AP-176", "niv": 3, "e": "Para responder la solicitud de la veeduría, la gobernación debe", "f": "Ley 1712 de 2014, arts. 18, 21 y 9, parágrafo 2", "o": [["A", "negar la entrega de las hojas de vida, porque contienen información clasificada.", "La presencia de datos clasificados no justifica negar todo el documento. El artículo 21 obliga a entregar una versión pública que reserve solo lo indispensable.", false], ["B", "entregar una versión pública que proteja los datos personales y permita conocer la formación y la experiencia.", "El artículo 21 de la Ley 1712 de 2014 ordena hacer una versión pública que mantenga la reserva únicamente de la parte indispensable. La formación y la experiencia de los contratistas son información que la propia ley ordena publicar (art. 9, parágrafo 2).", true], ["C", "entregar las hojas de vida completas, porque la veeduría ejerce control social sobre la contratación.", "La condición de veeduría no hace desaparecer la protección de los datos clasificados de terceros. Lo procedente es entregar la versión pública.", false]]}, {"id": "AP-177", "niv": 2, "e": "Los documentos con las opiniones de los asesores, emitidas durante la discusión del proyecto de ordenanza, son", "f": "Ley 1712 de 2014, art. 19, parágrafo", "o": [["A", "información pública clasificada, porque las opiniones pertenecen a la esfera personal de cada asesor.", "Las opiniones que forman parte del proceso deliberativo no se protegen por la intimidad del servidor (art. 18), sino por el interés público del artículo 19.", false], ["B", "información pública que debe entregarse sin restricción, porque los asesores son servidores públicos.", "El parágrafo del artículo 19 de la Ley 1712 de 2014 exceptúa expresamente estos documentos.", false], ["C", "información exceptuada por daño a los intereses públicos, por formar parte del proceso deliberativo.", "El parágrafo del artículo 19 de la Ley 1712 de 2014 exceptúa los documentos que contengan las opiniones o puntos de vista que formen parte del proceso deliberativo de los servidores públicos, dentro de la información exceptuada por daño a los intereses públicos.", true]]}]}, {"comp": "atencion_procedimiento", "rol": "tecnico", "tag": "Atención al ciudadano y procedimiento administrativo · Nivel técnico · Información clasificada y reservada", "texto": "Usted es técnico administrativo de la Secretaría de Seguridad de un distrito. Un ciudadano solicita el documento técnico que describe la ubicación y los puntos ciegos de las cámaras de vigilancia del centro de la ciudad. El jefe de la oficina propone responder que la secretaría no confirma ni niega si el documento existe, declarar la información reservada de manera indefinida y responder sin explicar los motivos. Una ley vigente prohíbe expresamente divulgar este tipo de información por razones de seguridad pública.", "items": [{"id": "AP-178", "niv": 2, "e": "Frente a la propuesta de no confirmar si el documento existe, debe advertirse que", "f": "Ley 1712 de 2014, art. 21", "o": [["A", "es correcta, porque revelar la existencia de un documento reservado equivale a divulgar su contenido.", "La ley separa ambos aspectos: la reserva cubre el contenido de un documento público, pero no su existencia.", false], ["B", "es correcta, siempre que el jefe de la oficina lo decida mediante resolución motivada publicada en la página web.", "Una resolución no cambia la regla legal: la reserva recae sobre el contenido y no sobre la existencia del documento.", false], ["C", "por regla general debe indicarse si el documento obra en poder de la entidad, porque la reserva recae sobre su contenido.", "El artículo 21 de la Ley 1712 de 2014 dispone que la reserva opera respecto del contenido de un documento público, pero no de su existencia, y que ninguna autoridad puede negarse a indicar si un documento obra en su poder, salvo que el daño al interés protegido sea mayor al interés público de acceder.", true]]}, {"id": "AP-179", "niv": 1, "e": "La reserva de esta información, basada en la seguridad pública, no puede extenderse por más de", "f": "Ley 1712 de 2014, arts. 19 y 22", "o": [["A", "seis (6) meses.", "Seis meses es la reserva especial de los documentos sobre operaciones de crédito público y tesorería de la Nación (art. 24, num. 4, del CPACA), no la de la información reservada por seguridad pública.", false], ["B", "diez (10) años.", "La ley no fija un límite de diez años para la información reservada del artículo 19.", false], ["C", "quince (15) años.", "El artículo 22 de la Ley 1712 de 2014 dispone que la reserva de la información amparada por el artículo 19 no debe extenderse por un período mayor a quince años.", true]]}, {"id": "AP-180", "niv": 3, "e": "Si la secretaría niega el acceso, la carga de demostrar que la información debe permanecer reservada le corresponde", "f": "Ley 1712 de 2014, arts. 19 y 28", "o": [["A", "al solicitante, que debe acreditar un interés legítimo y directo en conocer la información.", "La ley no exige al solicitante demostrar interés alguno; la carga de justificar la reserva es de quien la invoca.", false], ["B", "a la secretaría, que debe demostrar que divulgarla causaría un daño presente, probable y específico.", "El artículo 28 de la Ley 1712 de 2014 asigna al sujeto obligado la carga de la prueba: debe demostrar que la información se relaciona con un objetivo legítimo, establecer la excepción aplicable y probar que su revelación causaría un daño presente, probable y específico que excede el interés público del acceso. Además, el rechazo debe ser motivado y por escrito (art. 19).", true], ["C", "al juez administrativo, que debe establecer de oficio si existe la reserva, sin que la secretaría deba motivar.", "El rechazo debe ser motivado y por escrito (art. 19), y la carga de la prueba recae en el sujeto obligado (art. 28), no en el juez.", false]]}]}, {"comp": "atencion_procedimiento", "rol": "profesional", "tag": "Atención al ciudadano y procedimiento administrativo · Nivel profesional · Recursos frente a la negativa de acceso", "texto": "Usted es profesional especializado y asesora a dos entidades en la respuesta a solicitudes de información. En la primera, una gobernación negó a un periodista unos documentos invocando la reserva de defensa y seguridad nacional, y la decisión se le notificó personalmente. En la segunda, la alcaldía de un municipio de cuarta categoría negó a un tercero copia de la historia laboral de un exservidor, invocando la reserva legal de ese documento; la negativa también se notificó personalmente. Ninguno de los solicitantes es titular de la información ni está autorizado por su titular.", "items": [{"id": "AP-181", "niv": 3, "e": "Contra la negativa de la gobernación fundada en la reserva de defensa y seguridad nacional, el periodista puede", "f": "Ley 1712 de 2014, art. 27", "o": [["A", "interponer reposición por escrito y sustentada en la diligencia de notificación o dentro de los tres días siguientes.", "El artículo 27 de la Ley 1712 de 2014 dispone que, cuando la respuesta invoca la reserva de seguridad y defensa nacional o de relaciones internacionales, el solicitante puede acudir al recurso de reposición, por escrito y sustentado en la diligencia de notificación o dentro de los tres días siguientes.", true], ["B", "presentar insistencia dentro de los diez días siguientes a la notificación, para que decida el juez administrativo.", "La insistencia del artículo 26 del CPACA es el mecanismo general frente a la reserva. Cuando se invoca la reserva de seguridad y defensa nacional o de relaciones internacionales, la Ley 1712 prevé primero el recurso de reposición, con un plazo más corto.", false], ["C", "apelar ante el Ministerio de Defensa Nacional dentro de los diez días siguientes, por tratarse de un asunto de defensa.", "El Ministerio de Defensa no es superior de la gobernación ni la ley prevé esa apelación. El mecanismo es la reposición y, si se niega, la decisión judicial en única instancia.", false]]}, {"id": "AP-182", "niv": 3, "e": "Si la gobernación niega la reposición, el asunto lo decide en única instancia", "f": "Ley 1712 de 2014, art. 27", "o": [["A", "el juez administrativo del lugar donde se encuentran los documentos.", "El juez administrativo conoce cuando se trata de autoridades distritales y municipales. La gobernación es una autoridad departamental.", false], ["B", "el tribunal administrativo con jurisdicción en el lugar donde se encuentran los documentos.", "El artículo 27 de la Ley 1712 de 2014 asigna la decisión en única instancia al tribunal administrativo con jurisdicción en el lugar donde se encuentran los documentos si se trata de autoridades nacionales, departamentales o del Distrito Capital, y al juez administrativo si son autoridades distritales y municipales.", true], ["C", "el Consejo de Estado, por tratarse de información de defensa y seguridad nacional.", "La ley prevé que una sección del Consejo de Estado asuma el conocimiento solo en casos excepcionales, a solicitud y por su importancia jurídica. La competencia ordinaria, cuando la autoridad es departamental, es del tribunal administrativo.", false]]}, {"id": "AP-183", "niv": 2, "e": "Frente a la negativa de la alcaldía sobre la historia laboral, el solicitante puede", "f": "Ley 1755 de 2015, art. 1 (arts. 24, 25 y 26 de la Ley 1437 de 2011)", "o": [["A", "insistir dentro de los diez días siguientes a la notificación, para que decida el juez administrativo.", "El artículo 26 del CPACA permite insistir ante la autoridad que invoca la reserva. La insistencia se presenta por escrito y sustentada en la diligencia de notificación o dentro de los diez días siguientes, y si se trata de autoridades municipales la decide el juez administrativo en única instancia.", true], ["B", "interponer reposición dentro de los tres días siguientes, para que decida el tribunal administrativo.", "La reposición de tres días está prevista para la reserva de seguridad y defensa nacional o relaciones internacionales (art. 27 de la Ley 1712). Además, frente a una alcaldía decide el juez administrativo.", false], ["C", "interponer reposición y, en subsidio, apelación ante el alcalde, dentro de los diez días siguientes.", "El artículo 25 del CPACA establece que contra la decisión que rechaza la petición por reserva legal no procede recurso alguno, salvo la insistencia del artículo 26.", false]]}, {"id": "AP-184", "niv": 2, "e": "Una vez recibe la documentación, el juez que conoce de la insistencia debe decidir", "f": "Ley 1755 de 2015, art. 1 (art. 26 de la Ley 1437 de 2011)", "o": [["A", "dentro de los diez días siguientes, salvo las interrupciones que prevé la ley.", "El artículo 26 del CPACA dispone que el tribunal o juez decide dentro de los diez días siguientes, y que el término se interrumpe, entre otros casos, cuando solicita copia de los documentos o información adicional, hasta que los reciba.", true], ["B", "dentro de los treinta días siguientes, prorrogables por un término igual.", "La ley fija un término de diez días, que puede interrumpirse, no prorrogarse por treinta más.", false], ["C", "dentro de los dos meses siguientes, como cualquier solicitud de revocatoria directa.", "La insistencia no es una revocatoria directa. La ley le fija un término propio de diez días.", false]]}]}, {"comp": "atencion_procedimiento", "rol": "general", "tag": "Atención al ciudadano y procedimiento administrativo · Atención incluyente y lenguaje claro", "texto": "Una corporación autónoma regional elabora el plan de ordenación de una cuenca en la que habitan un resguardo indígena nasa y varias veredas campesinas. Las autoridades del resguardo pidieron formalmente que la información del plan que afecta a su comunidad se divulgue en nasa yuwe. Además, la asociación de personas con discapacidad visual del municipio pidió poder consultar el documento. Por último, el primer borrador del resumen para la comunidad está lleno de tecnicismos y transcribe artículos completos de decretos sin explicarlos.", "items": [{"id": "AP-185", "niv": 2, "e": "Ante la solicitud de las autoridades del resguardo, la corporación debe", "f": "Ley 1712 de 2014, art. 8; Constitución Política, art. 10", "o": [["A", "remitir la solicitud al Ministerio de Cultura, que es el encargado de traducir y publicar la información en lenguas nativas.", "La obligación de divulgar es del sujeto obligado que produce la información. La corporación puede apoyarse en otras entidades, pero no trasladarles su deber.", false], ["B", "negarla, porque los documentos oficiales de las entidades públicas se expiden únicamente en castellano.", "El artículo 10 de la Constitución reconoce como oficiales en sus territorios las lenguas de los grupos étnicos, y el artículo 8 de la Ley 1712 de 2014 obliga a divulgar la información en otras lenguas a solicitud de las autoridades de las comunidades.", false], ["C", "divulgar en su lengua la información que los afecta y elaborar formatos alternativos comprensibles para la comunidad.", "El artículo 8 de la Ley 1712 de 2014 (criterio diferencial de accesibilidad) dispone que, a solicitud de las autoridades de las comunidades, los sujetos obligados divulguen la información pública que particularmente las afecte en diversos idiomas y lenguas, con formatos alternativos comprensibles.", true]]}, {"id": "AP-186", "niv": 1, "e": "Frente a la solicitud de la asociación de personas con discapacidad visual, la corporación debe", "f": "Ley 1712 de 2014, arts. 3 (principio de calidad de la información) y 8", "o": [["A", "entregarles una copia impresa del documento completo, sin ajustes adicionales.", "Una copia impresa no resuelve la barrera de acceso de una persona con discapacidad visual. La ley exige formatos accesibles.", false], ["B", "adecuar sus medios de comunicación y ofrecer la información en formatos accesibles para esa población.", "El artículo 8 de la Ley 1712 de 2014 ordena adecuar los medios de comunicación para facilitar el acceso a las personas en situación de discapacidad, y el principio de calidad exige que la información esté disponible en formatos accesibles.", true], ["C", "informarles que el documento está publicado en la página web, con lo cual se cumple el deber de divulgación.", "Publicar el documento en un formato que esta población no puede consultar no garantiza el acceso. La ley exige adecuar los medios para las personas con discapacidad.", false]]}, {"id": "AP-187", "niv": 2, "e": "Sobre el borrador del resumen para la comunidad, lo correcto es", "f": "Ley 1712 de 2014, art. 3 (principios de calidad de la información y de divulgación proactiva)", "o": [["A", "reescribirlo en un lenguaje sencillo y comprensible para la comunidad, que explique en qué la afecta el plan.", "Los principios de calidad de la información y de divulgación proactiva del artículo 3 de la Ley 1712 de 2014 exigen que la información sea oportuna, objetiva, veraz, accesible y comprensible, lo que se logra con lenguaje claro.", true], ["B", "mantener la transcripción literal de los decretos, porque así se evitan interpretaciones equivocadas.", "Transcribir normas sin explicarlas dificulta la comprensión. La ley exige que la información de interés público sea comprensible para sus destinatarios.", false], ["C", "reemplazar el resumen por los enlaces a las normas, para que cada lector las consulte directamente.", "Remitir a las normas no cumple el deber de divulgar información comprensible y accesible para la comunidad.", false]]}]}, {"comp": "atencion_procedimiento", "rol": "tecnico", "tag": "Atención al ciudadano y procedimiento administrativo · Nivel técnico · Respuesta de fondo", "texto": "Usted es técnico administrativo de la Secretaría de Infraestructura de un municipio de tercera categoría. Un ciudadano presentó una petición en la que pregunta cuándo se repavimentará su calle y cuánto presupuesto se asignó a esa obra; en el escrito cita, por error, una ley derogada como fundamento. Al revisar los borradores de respuesta, usted encuentra que uno solo informa que la solicitud fue recibida y está en trámite, otro responde únicamente la pregunta sobre la fecha de la obra, y un compañero propone rechazar la petición por la cita equivocada.", "items": [{"id": "AP-188", "niv": 1, "e": "Una respuesta que solo informa que la solicitud fue recibida y está en trámite", "f": "Ley 1755 de 2015, art. 1 (art. 13 de la Ley 1437 de 2011)", "o": [["A", "satisface el derecho de petición si se envía antes del décimo día hábil.", "El cumplimiento del término no subsana la falta de una respuesta de fondo.", false], ["B", "satisface el derecho de petición, porque demuestra que la entidad atendió la solicitud dentro del término.", "Acusar recibo o informar que la petición está en trámite no resuelve lo pedido. El derecho de petición exige una resolución completa y de fondo.", false], ["C", "no satisface el derecho de petición, porque este exige una respuesta pronta, completa y de fondo.", "El artículo 13 del CPACA reconoce el derecho a obtener pronta resolución completa y de fondo sobre lo pedido. Un mensaje de trámite no responde la pregunta del ciudadano.", true]]}, {"id": "AP-189", "niv": 2, "e": "Si se responde solo la pregunta sobre la fecha de la obra, la respuesta", "f": "Ley 1755 de 2015, art. 1 (arts. 13 y 15 de la Ley 1437 de 2011)", "o": [["A", "es suficiente si se le indica al ciudadano que puede presentar una nueva petición sobre el presupuesto.", "Remitir al ciudadano a una nueva petición deja sin resolver una parte de la que ya presentó.", false], ["B", "es incompleta, porque la entidad debe resolver todos los aspectos que plantea la petición.", "El artículo 13 del CPACA exige una resolución completa y de fondo, y el artículo 15 recuerda que las autoridades deben resolver sobre todos los aspectos que les sean planteados. La pregunta sobre el presupuesto quedó sin responder.", true], ["C", "es suficiente, porque la pregunta principal del ciudadano era la fecha de la repavimentación.", "La entidad no puede seleccionar qué preguntas responder: debe resolver todo lo planteado.", false]]}, {"id": "AP-190", "niv": 2, "e": "Frente a la propuesta de rechazar la petición por la cita de una ley derogada, debe responderse que", "f": "Ley 1755 de 2015, art. 1 (art. 16, parágrafo 2, de la Ley 1437 de 2011)", "o": [["A", "procede devolverla al ciudadano para que, dentro de los diez días siguientes, corrija la norma citada.", "La devolución para aclarar está prevista para las peticiones cuyo objeto no se comprende (art. 19), y el objeto de esta petición es claro.", false], ["B", "procede rechazarla, porque una petición que se funda en una ley derogada carece de objeto.", "El objeto de la petición es la información sobre la obra, no la ley citada. El error en el fundamento no autoriza el rechazo.", false], ["C", "la petición no puede rechazarse por una fundamentación inadecuada o incompleta.", "El parágrafo 2 del artículo 16 del CPACA dispone que en ningún caso podrá rechazarse la petición por motivos de fundamentación inadecuada o incompleta. Lo pedido es claro, de modo que debe responderse de fondo.", true]]}]}, {"comp": "atencion_procedimiento", "rol": "asistencial", "tag": "Atención al ciudadano y procedimiento administrativo · Nivel asistencial · Peticiones verbales y atención telefónica", "texto": "Usted es auxiliar administrativo de la línea de atención telefónica de una secretaría distrital de Bogotá. Una ciudadana llama para presentar una petición sobre la entrega de un subsidio y su compañero de turno quiere pedirle que mejor la envíe por correo electrónico. Más tarde llama un ciudadano que quiere quejarse por el cobro de una factura de energía, asunto que no es competencia de la secretaría. Además, la secretaría quiere establecer que las solicitudes de devolución de dineros pagados por trámites deban presentarse por escrito.", "items": [{"id": "AP-191", "niv": 1, "e": "Frente a la petición de la ciudadana que llama por teléfono, usted debe", "f": "Decreto 1069 de 2015, arts. 2.2.3.12.1, 2.2.3.12.2 y 2.2.3.12.3 (adicionados por el Decreto 1166 de 2016)", "o": [["A", "pedirle que la envíe por correo electrónico, porque la línea telefónica es solo un canal de orientación.", "Las peticiones verbales también pueden presentarse por vía telefónica, y las autoridades deben centralizar en su línea de atención su recepción y la constancia de radicación.", false], ["B", "recibirla, radicarla de inmediato y dejar constancia con los datos mínimos, como la fecha y hora de recibo.", "El Decreto 1069 de 2015 (arts. 2.2.3.12.1 a 2.2.3.12.3) regula las peticiones verbales presentadas por vía telefónica y exige radicar de inmediato una constancia con datos mínimos, como el número de radicado, la fecha y hora de recibo y la constancia explícita de que la petición fue verbal.", true], ["C", "tomar nota de la llamada y radicar la petición solo cuando la ciudadana la confirme por escrito.", "La petición verbal no requiere confirmación escrita para ser radicada. Exigirla convierte el escrito en un requisito que la ley no impone.", false]]}, {"id": "AP-192", "niv": 2, "e": "Frente a la queja por el cobro de la factura de energía, que no es competencia de la secretaría, usted debe", "f": "Decreto 1069 de 2015, art. 2.2.3.12.7 (adicionado por el Decreto 1166 de 2016); Ley 1755 de 2015, art. 1 (art. 21 de la Ley 1437 de 2011)", "o": [["A", "informarle en la llamada que la secretaría no es competente y orientarlo; si insiste, radicar la petición y remitirla al competente.", "El artículo 2.2.3.12.7 del Decreto 1069 de 2015 dispone que, ante una petición verbal ajena a su competencia, el funcionario informa en el mismo acto la falta de competencia y orienta al peticionario. Si este insiste, deja constancia, radica la petición y le da el trámite correspondiente, que es la remisión a la autoridad competente prevista en el artículo 21 del CPACA (sustituido por la Ley 1755 de 2015).", true], ["B", "tomar sus datos y decirle que la secretaría le enviará por escrito la respuesta sobre la factura.", "La secretaría no puede responder de fondo un asunto que no es de su competencia. La norma exige informarle de inmediato la falta de competencia y orientarlo; si insiste, se radica la petición.", false], ["C", "radicar la petición y remitirla al competente dentro de los cinco días siguientes, sin informarle nada durante la llamada.", "Para la petición verbal, el aviso de falta de competencia se da de inmediato, en el mismo acto (art. 21 del CPACA y art. 2.2.3.12.7 del Decreto 1069 de 2015).", false]]}, {"id": "AP-193", "niv": 3, "e": "Para exigir que las solicitudes de devolución de dineros se presenten por escrito, la secretaría", "f": "Ley 1755 de 2015, art. 1 (art. 15 de la Ley 1437 de 2011); Decreto 1069 de 2015, art. 2.2.3.12.5 (adicionado por el Decreto 1166 de 2016)", "o": [["A", "no puede hacerlo, porque la ley garantiza que toda petición pueda presentarse de forma verbal, y exigir el escrito restringiría ese derecho.", "La ley permite a las autoridades exigir que ciertas peticiones se presenten por escrito (art. 15 del CPACA), siempre que cumplan las condiciones previstas.", false], ["B", "puede hacerlo, y cobrar a los usuarios el valor de los formularios que diseñe, siempre que lo informe en su sede electrónica.", "Los formularios deben ponerse a disposición sin costo, salvo que una ley disponga expresamente lo contrario (art. 15 del CPACA).", false], ["C", "puede hacerlo, si pone a disposición formularios gratuitos e informa antes, en su sede electrónica y otros canales, qué solicitudes deben ser escritas.", "El artículo 15 del CPACA permite exigir que ciertas peticiones se presenten por escrito, con formularios gratuitos. El artículo 2.2.3.12.5 del Decreto 1069 de 2015 lo admite para peticiones sobre trámites y servicios y exige informar previamente, por la sede electrónica y otros canales, qué solicitudes deben presentarse por escrito.", true]]}]}, {"comp": "atencion_procedimiento", "rol": "profesional", "tag": "Atención al ciudadano y procedimiento administrativo · Nivel profesional · Protección de datos personales", "texto": "Usted es profesional universitario de la oficina de tecnologías de la información de una alcaldía de primera categoría, que administra la base de datos de beneficiarios de los programas sociales. Un beneficiario solicita que se le informe de forma detallada para qué se han usado sus datos personales desde que se inscribió. Otro beneficiario, molesto porque recibe mensajes publicitarios de un tercero, anuncia que presentará de inmediato una queja ante la Superintendencia de Industria y Comercio, sin haber acudido antes a la alcaldía. Además, el formulario de inscripción de un nuevo programa pregunta por el origen étnico y por el diagnóstico de enfermedades de los aspirantes.", "items": [{"id": "AP-194", "niv": 1, "e": "Frente a la solicitud del primer beneficiario, a usted le corresponde", "f": "Ley 1581 de 2012, art. 8, lit. c", "o": [["A", "remitir la solicitud a la Superintendencia de Industria y Comercio, para que sea ella quien le informe el uso de sus datos.", "La Superintendencia vigila el cumplimiento de la ley, pero no responde por el responsable del tratamiento. La obligación de informar es de la alcaldía.", false], ["B", "verificar los registros de la entidad y proyectar la respuesta informándole el uso que se ha dado a sus datos.", "El literal c del artículo 8 de la Ley 1581 de 2012 reconoce al titular el derecho a ser informado por el responsable del tratamiento, previa solicitud, del uso que le ha dado a sus datos personales. La alcaldía, como responsable, debe responder.", true], ["C", "informarle que, para conocer el uso de sus datos, primero debe solicitar su supresión de la base de datos.", "La ley no condiciona el derecho a ser informado a la supresión de los datos. Son derechos distintos del titular.", false]]}, {"id": "AP-195", "niv": 3, "e": "Sobre la queja que el segundo beneficiario quiere presentar de inmediato ante la Superintendencia, es correcto advertirle que", "f": "Ley 1581 de 2012, arts. 8, lit. d, y 16", "o": [["A", "primero debe agotar el trámite de consulta o reclamo ante la alcaldía, como responsable del tratamiento.", "El artículo 16 de la Ley 1581 de 2012 establece como requisito de procedibilidad que el titular solo puede elevar queja ante la Superintendencia de Industria y Comercio una vez haya agotado el trámite de consulta o reclamo ante el responsable o el encargado del tratamiento.", true], ["B", "solo puede presentarla después de interponer una acción de tutela contra la alcaldía y obtener un fallo.", "La ley no exige una tutela previa. El requisito de procedibilidad es agotar la consulta o el reclamo ante el responsable.", false], ["C", "puede presentarla de inmediato, porque la queja ante la Superintendencia es un derecho del titular que no tiene requisitos previos.", "El derecho a presentar quejas ante la Superintendencia (art. 8, lit. d) está sujeto al requisito de procedibilidad del artículo 16: agotar antes la consulta o el reclamo ante el responsable o el encargado.", false]]}, {"id": "AP-196", "niv": 2, "e": "El origen étnico y el diagnóstico de enfermedades que pide el formulario son", "f": "Ley 1581 de 2012, arts. 5 y 6", "o": [["A", "datos de naturaleza pública, porque los recoge una entidad pública para un programa social.", "La naturaleza del dato no depende de que lo recoja una entidad pública. El origen étnico y los datos de salud son datos sensibles por definición legal.", false], ["B", "datos semiprivados, porque solo interesan al titular y a la entidad que administra el programa.", "La ley los clasifica expresamente como sensibles (art. 5), categoría con una protección reforzada.", false], ["C", "datos sensibles, porque afectan la intimidad del titular o su uso indebido puede generar discriminación.", "El artículo 5 de la Ley 1581 de 2012 define como sensibles los datos que afectan la intimidad del titular o cuyo uso indebido puede generar discriminación, como los que revelan el origen racial o étnico y los relativos a la salud. El artículo 6 restringe su tratamiento.", true]]}]}, {"comp": "atencion_procedimiento", "rol": "tecnico", "tag": "Atención al ciudadano y procedimiento administrativo · Nivel técnico · Protección de datos personales: términos", "texto": "Usted es técnico administrativo del instituto de vivienda de un departamento, responsable de la base de datos de postulantes a subsidios. El martes 13 de julio de 2027 una postulante radicó un reclamo completo para que se corrija su número de identificación, que aparece errado en la base de datos. La entidad atiende de lunes a viernes. Son festivos el martes 20 de julio y el lunes 16 de agosto de 2027; el sábado 7 de agosto no afecta el cómputo y no hay otros festivos en el periodo.", "items": [{"id": "AP-197", "niv": 3, "e": "El último día para atender el reclamo dentro del término inicial es el", "f": "Ley 1581 de 2012, art. 15, num. 3; cálculo de días hábiles", "o": [["A", "miércoles 28 de julio de 2027.", "Aplica el término de diez días hábiles de las consultas (art. 14). La corrección de un dato se tramita como reclamo, con un término de quince días hábiles.", false], ["B", "martes 3 de agosto de 2027.", "Resulta de contar el m
