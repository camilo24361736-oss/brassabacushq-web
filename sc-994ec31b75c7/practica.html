lo pueden constituirse reservas con compromisos ya adquiridos; un saldo nunca comprometido no puede convertirse en reserva.", false]]}]}, {"comp": "gestion_publica", "rol": "profesional", "tag": "Gestión pública, MIPG, contratación y documentos · Nivel profesional · Presupuesto: vigencias futuras ordinarias territoriales", "texto": "Usted es profesional especializado de la Secretaría de Hacienda de un municipio de primera categoría, cuyo período de gobierno va de 2028 a 2031. En junio de 2029 el alcalde quiere contratar el proyecto de inversión de transporte escolar para los años 2029, 2030 y 2031 mediante un solo contrato, cuya ejecución se iniciaría con presupuesto de 2029. Para 2030 y 2031 se solicitan vigencias futuras ordinarias por $1.800 millones en total. El proyecto está incluido en el plan de desarrollo, no compromete la capacidad de endeudamiento y el Consejo Municipal de Política Fiscal (Confis) ya lo revisó.", "items": [{"id": "GP-145", "niv": 3, "e": "La autorización para comprometer las vigencias futuras debe impartirla", "f": "Ley 819 de 2003, art. 12", "o": [["A", "el Confis municipal, sin acuerdo del concejo, por tratarse de vigencias ordinarias.", "En el nivel nacional el Confis autoriza las vigencias futuras ordinarias, pero en las entidades territoriales la autorización la da la corporación de elección popular; el Confis territorial solo la aprueba previamente.", false], ["B", "el Ministerio de Hacienda y Crédito Público, previo concepto del Departamento Nacional de Planeación.", "El concepto del DNP solo se exige cuando el proyecto conlleva inversión nacional, y la autorización no la da el Ministerio de Hacienda sino el concejo.", false], ["C", "el concejo municipal, a iniciativa del alcalde y previa aprobación del Confis territorial.", "El artículo 12 de la Ley 819 de 2003 dispone que en las entidades territoriales las autorizaciones para comprometer vigencias futuras las imparte la asamblea o el concejo, a iniciativa del gobierno local y previa aprobación del Confis territorial o quien haga sus veces.", true]]}, {"id": "GP-146", "niv": 3, "e": "Para que puedan autorizarse las vigencias futuras solicitadas, en la vigencia 2029 el municipio debe contar, como mínimo, con una apropiación de", "f": "Ley 819 de 2003, art. 12, lit. b", "o": [["A", "$180 millones.", "Corresponde al 10 % de $1.800 millones; la ley exige como mínimo el 15 % de las vigencias futuras que se soliciten.", false], ["B", "$270 millones.", "El literal b del artículo 12 de la Ley 819 de 2003 dispone: «Como mínimo, de las vigencias futuras que se soliciten se deberá contar con apropiación del quince por ciento (15%) en la vigencia fiscal en la que estas sean autorizadas». La base del cálculo son las vigencias futuras solicitadas ($1.800 millones), no el valor total del proyecto: 1.800 × 0,15 = 270 millones de pesos.", true], ["C", "$360 millones.", "Corresponde al 20 % de $1.800 millones, porcentaje superior al mínimo legal del 15 %; el enunciado pregunta por el mínimo exigido.", false]]}, {"id": "GP-147", "niv": 3, "e": "Si el alcalde quisiera extender el contrato hasta 2033, las vigencias futuras para 2032 y 2033", "f": "Ley 819 de 2003, art. 12", "o": [["A", "solo podrían superar el período de gobierno si el Consejo de Gobierno declara antes el proyecto de importancia estratégica.", "El artículo 12 de la Ley 819 de 2003 dispone que la autorización no puede superar el período de gobierno, salvo los proyectos de gastos de inversión que el Consejo de Gobierno declare previamente de importancia estratégica.", true], ["B", "no podrían autorizarse en ningún caso, porque las vigencias futuras solo cubren la vigencia siguiente.", "Las vigencias futuras pueden cubrir varios años; el límite es el período de gobierno, que admite una excepción expresa.", false], ["C", "podrían autorizarse sin requisitos adicionales, porque las vigencias ordinarias no tienen límite temporal.", "La ley sí fija un límite: la autorización no puede superar el período de gobierno, salvo la excepción de los proyectos declarados de importancia estratégica.", false]]}]}, {"comp": "gestion_publica", "rol": "profesional", "tag": "Gestión pública, MIPG, contratación y documentos · Nivel profesional · Contratación: modalidades de selección y cuantías", "texto": "Usted es profesional universitario de la oficina jurídica y de contratación de un municipio de sexta categoría cuyo presupuesto anual es inferior a 120.000 salarios mínimos legales mensuales vigentes (SMMLV). En el Plan Anual de Adquisiciones aparecen, entre otros: la construcción de un puente vehicular por un valor estimado de 1.900 SMMLV; la reparación de la cubierta de la casa de la cultura por 20 SMMLV, y la elaboración de los estudios y diseños de un acueducto veredal por 150 SMMLV. El alcalde le pide definir la modalidad de selección de cada proceso. Recuerde que, para entidades con ese presupuesto, la menor cuantía llega hasta 280 SMMLV.", "items": [{"id": "GP-148", "niv": 3, "e": "Para clasificar la reparación de la cubierta, usted calcula que la mínima cuantía del municipio llega hasta", "f": "Ley 1150 de 2007, art. 2, num. 2 (lit. b) y num. 5 (modificado por el art. 30 de la Ley 2069 de 2020)", "o": [["A", "28 SMMLV.", "La mínima cuantía es la contratación que no excede el 10 % de la menor cuantía de la entidad (Ley 1150 de 2007, art. 2, num. 5). Si la menor cuantía es de 280 SMMLV, la mínima llega hasta 280 × 0,10 = 28 SMMLV; la reparación de 20 SMMLV cabe en ella.", true], ["B", "56 SMMLV.", "Resulta de aplicar el 20 % a la menor cuantía; la ley fija la mínima cuantía en el 10 % de la menor cuantía, es decir, 28 SMMLV.", false], ["C", "280 SMMLV.", "Ese es el tope de la menor cuantía del municipio, no el de la mínima cuantía, que equivale al 10 % de aquella.", false]]}, {"id": "GP-149", "niv": 2, "e": "La construcción del puente vehicular debe contratarse mediante", "f": "Ley 1150 de 2007, art. 2, nums. 1, 2 y 4", "o": [["A", "selección abreviada de menor cuantía, porque el municipio es de sexta categoría.", "La menor cuantía se define por el valor del contrato frente al presupuesto anual en SMMLV, no por la categoría del municipio; 1.900 SMMLV supera ampliamente los 280 SMMLV.", false], ["B", "contratación directa, porque es una obra pública de interés general.", "El interés general de una obra no es causal de contratación directa; las causales son taxativas en el numeral 4 del artículo 2 de la Ley 1150 de 2007.", false], ["C", "licitación pública, que es la regla general de escogencia del contratista.", "El numeral 1 del artículo 2 de la Ley 1150 de 2007 establece la licitación pública como regla general; una obra de 1.900 SMMLV supera la menor cuantía y no encaja en causales de selección abreviada ni de contratación directa.", true]]}, {"id": "GP-150", "niv": 2, "e": "Los estudios y diseños del acueducto veredal deben contratarse mediante", "f": "Ley 1150 de 2007, art. 2, num. 3; Ley 80 de 1993, art. 32, num. 2", "o": [["A", "selección abreviada de menor cuantía, porque su valor es inferior a 280 SMMLV.", "El valor no define la modalidad cuando el objeto es una consultoría que supera la mínima cuantía: la ley reserva para los consultores el concurso de méritos.", false], ["B", "concurso de méritos, por tratarse de una consultoría.", "El numeral 3 del artículo 2 de la Ley 1150 de 2007 prevé el concurso de méritos para seleccionar consultores, y el artículo 32, numeral 2, de la Ley 80 de 1993 define como consultoría los estudios y diseños para proyectos de inversión.", true], ["C", "licitación pública, porque los diseños hacen parte de una obra de infraestructura.", "Los estudios y diseños son un contrato de consultoría independiente de la futura obra, y para la selección de consultores la ley prevé el concurso de méritos.", false]]}]}, {"comp": "gestion_publica", "rol": "profesional", "tag": "Gestión pública, MIPG, contratación y documentos · Nivel profesional · Contratación: interventoría de obra y concurso de méritos", "texto": "Usted es profesional especializado de la Secretaría de Infraestructura de una gobernación. El departamento adjudicó por licitación pública la pavimentación de 12 kilómetros de una vía secundaria. Para la vigilancia del contrato, el secretario propone que un ingeniero de planta haga todo el seguimiento técnico y, si finalmente se contrata una firma, que se escoja por el menor precio ofrecido. Un asesor sugiere además que el interventor imparta sus instrucciones al contratista por teléfono «para agilizar la obra».", "items": [{"id": "GP-151", "niv": 2, "e": "Frente a la propuesta de que un ingeniero de planta haga todo el seguimiento técnico, usted advierte que", "f": "Ley 80 de 1993, art. 32, num. 1 (inciso vigente; la expresión «concurso» fue derogada por el art. 32 de la Ley 1150 de 2007)", "o": [["A", "es viable si el ingeniero tiene posgrado en vías y la Oficina de Control Interno lo autoriza.", "La formación del ingeniero no cambia la exigencia legal, y la oficina de control interno no autoriza actuaciones de la gestión contractual.", false], ["B", "debe contratarse una interventoría con una persona independiente de la entidad y del contratista.", "El numeral 1 del artículo 32 de la Ley 80 de 1993 dispone que en los contratos de obra celebrados como resultado de una licitación la interventoría se contrate con una persona independiente de la entidad contratante y del contratista. Ese inciso está vigente; la Ley 1150 de 2007 (art. 32) solo derogó la expresión «concurso».", true], ["C", "es viable, porque la supervisión por personal de planta reemplaza la interventoría en cualquier contrato de obra.", "La ley no permite sustituir la interventoría por supervisión en los contratos de obra adjudicados por licitación: en ellos la interventoría debe contratarse con un tercero independiente.", false]]}, {"id": "GP-152", "niv": 3, "e": "Sobre la idea de escoger a la firma interventora por el menor precio ofrecido, usted responde que", "f": "Ley 1150 de 2007, art. 5, num. 4; Ley 80 de 1993, art. 32, num. 2", "o": [["A", "procede, porque el menor precio es el único factor de evaluación en los procesos de selección del Estado.", "El menor precio como único factor se aplica a bienes y servicios de características técnicas uniformes; no es una regla general y está prohibido para seleccionar consultores.", false], ["B", "procede, siempre que el valor de la interventoría no supere la menor cuantía del departamento.", "La prohibición de usar el precio como factor de escogencia de consultores no depende de la cuantía del contrato.", false], ["C", "no procede, porque la interventoría es consultoría y para escoger consultores el precio no puede ser factor de escogencia.", "La interventoría es un contrato de consultoría (Ley 80 de 1993, art. 32, num. 2) y el numeral 4 del artículo 5 de la Ley 1150 de 2007 prohíbe incluir el precio como factor de escogencia en la selección de consultores.", true]]}, {"id": "GP-153", "niv": 1, "e": "En cuanto a las instrucciones del interventor al contratista, la Ley 80 de 1993 exige que", "f": "Ley 80 de 1993, art. 32, num. 2", "o": [["A", "sus órdenes se impartan verbalmente en la obra y se ratifiquen en el acta de liquidación.", "La ley prohíbe expresamente las órdenes verbales del interventor; ratificarlas al liquidar no subsana esa exigencia.", false], ["B", "cada instrucción sea aprobada previamente por el ordenador del gasto.", "La ley no somete cada instrucción del interventor a aprobación del ordenador del gasto; lo que exige es que conste por escrito y se ajuste al contrato.", false], ["C", "sus órdenes o sugerencias consten por escrito y se enmarquen en el contrato.", "El numeral 2 del artículo 32 de la Ley 80 de 1993 prohíbe que las órdenes del interventor de una obra se den verbalmente y le obliga a entregarlas por escrito, dentro de los términos del contrato.", true]]}]}, {"comp": "gestion_publica", "rol": "profesional", "tag": "Gestión pública, MIPG, contratación y documentos · Nivel profesional · Contratación directa: causales y acto de justificación", "texto": "Usted es profesional universitario de la Dirección de Contratación de un instituto distrital de Bogotá. Este año el instituto necesita: celebrar con una universidad pública un contrato para dictar un diplomado de formación a sus servidores, actividad que guarda relación directa con el objeto de la universidad; y vincular, mediante contrato de prestación de servicios profesionales, a una abogada que apoye la defensa judicial durante seis meses, porque el personal de planta no alcanza para atender los procesos. El director le pide precisar los requisitos de cada contratación.", "items": [{"id": "GP-154", "niv": 3, "e": "El contrato con la universidad pública puede celebrarse por contratación directa porque", "f": "Ley 1150 de 2007, art. 2, num. 4, lit. c (modificado por el art. 92 de la Ley 1474 de 2011); Decreto 1082 de 2015, art. 2.2.1.2.1.4.4", "o": [["A", "su valor es inferior a la menor cuantía del instituto.", "Un valor inferior a la menor cuantía conduce, por regla general, a selección abreviada o a mínima cuantía, no a contratación directa; la causal aplicable aquí es la interadministrativa.", false], ["B", "es interadministrativo y sus obligaciones tienen relación directa con el objeto de la universidad.", "El literal c del numeral 4 del artículo 2 de la Ley 1150 de 2007, modificado por el artículo 92 de la Ley 1474 de 2011, permite la contratación directa de contratos interadministrativos siempre que las obligaciones tengan relación directa con el objeto de la entidad ejecutora.", true], ["C", "las universidades públicas están excluidas del Estatuto General de Contratación en cualquier contrato.", "El régimen propio de contratación de la universidad no es lo que habilita al instituto a contratar directamente; la causal es el contrato interadministrativo con la condición de relación directa con el objeto de la ejecutora.", false]]}, {"id": "GP-155", "niv": 1, "e": "Para contratar a la abogada, el instituto", "f": "Ley 1150 de 2007, art. 2, num. 4; Decreto 1082 de 2015, art. 2.2.1.2.1.4.9", "o": [["A", "puede contratarla directamente, sin pedir varias ofertas, si verifica su idoneidad y deja constancia escrita.", "El artículo 2.2.1.2.1.4.9 del Decreto 1082 de 2015 permite contratar directamente los servicios profesionales con quien esté en capacidad de ejecutar el objeto, verificando su idoneidad o experiencia, sin obtener varias ofertas y dejando constancia escrita del ordenador del gasto.", true], ["B", "debe adelantar una selección abreviada de menor cuantía con por lo menos tres cotizaciones de abogados.", "Los servicios profesionales y de apoyo a la gestión son causal de contratación directa; la norma aclara que no es necesario obtener varias ofertas.", false], ["C", "debe convocar un concurso de méritos, porque la defensa judicial es una consultoría.", "El Decreto 1082 de 2015 define los servicios profesionales como los de naturaleza intelectual diferentes a los de consultoría, de modo que no se rigen por el concurso de méritos.", false]]}, {"id": "GP-156", "niv": 3, "e": "Sobre el acto administrativo de justificación de la contratación directa, es correcto afirmar que", "f": "Decreto 1082 de 2015, arts. 2.2.1.2.1.4.1 y 2.2.1.2.1.4.4", "o": [["A", "es necesario en ambos casos, incluido el contrato de prestación de servicios profesionales.", "El Decreto 1082 de 2015 exceptúa expresamente del acto de justificación los contratos de prestación de servicios profesionales y de apoyo a la gestión.", false], ["B", "no se requiere para el contrato de la abogada, pero sí para el contrato con la universidad.", "El artículo 2.2.1.2.1.4.1 del Decreto 1082 de 2015 exige el acto de justificación en la contratación directa, salvo, entre otros, en los contratos de prestación de servicios profesionales y de apoyo a la gestión; los interadministrativos sí lo requieren (art. 2.2.1.2.1.4.4).", true], ["C", "no se requiere en ninguno de los dos casos, porque la contratación directa no exige justificación previa.", "La contratación directa sí exige, por regla general, un acto de justificación con la causal, el objeto, el presupuesto y el lugar de consulta de los estudios previos.", false]]}]}, {"comp": "gestion_publica", "rol": "general", "tag": "Gestión pública, MIPG, contratación y documentos · Contratación directa: urgencia manifiesta", "texto": "Usted trabaja en la Secretaría de Planeación e Infraestructura de un municipio de Antioquia. Una avenida torrencial destruyó el puente peatonal que comunica dos veredas y dejó a 200 niños sin acceso a la escuela. El alcalde declaró la urgencia manifiesta mediante decreto motivado y ordenó contratar de inmediato la construcción de un paso provisional. Un compañero insiste en que, antes de firmar, hay que elaborar estudios previos completos y expedir, aparte, el acto de justificación de la contratación directa.", "items": [{"id": "GP-157", "niv": 1, "e": "La situación descrita permite acudir a la urgencia manifiesta porque", "f": "Ley 80 de 1993, art. 42; Ley 1150 de 2007, art. 2, num. 4, lit. a", "o": [["A", "busca conjurar una situación excepcional derivada de una calamidad que exige actuar de inmediato.", "El artículo 42 de la Ley 80 de 1993 define la urgencia manifiesta, entre otros supuestos, para conjurar situaciones excepcionales relacionadas con hechos de calamidad o desastre que demandan actuaciones inmediatas.", true], ["B", "toda obra pública en zona rural puede contratarse de forma directa.", "La ubicación rural de una obra no es causal de contratación directa; las causales del artículo 2, numeral 4, de la Ley 1150 de 2007 son taxativas.", false], ["C", "el valor del paso provisional es inferior a la mínima cuantía del municipio.", "La urgencia manifiesta no depende del valor del contrato; se funda en hechos excepcionales que exigen actuar de inmediato.", false]]}, {"id": "GP-158", "niv": 2, "e": "Frente a la posición del compañero, usted le explica que", "f": "Decreto 1082 de 2015, art. 2.2.1.2.1.4.2", "o": [["A", "el acto de justificación debe expedirse aparte, aunque los estudios previos pueden elaborarse al liquidar el contrato.", "No hace falta un acto de justificación separado: el que declara la urgencia cumple esa función; y la norma no traslada los estudios previos a la liquidación.", false], ["B", "sin estudios previos completos el contrato sería nulo, aunque exista urgencia manifiesta.", "El reglamento releva a la entidad de elaborar estudios previos cuando la causal es la urgencia manifiesta, de modo que su ausencia no vicia el contrato por ese solo hecho.", false], ["C", "el decreto que declaró la urgencia hace las veces de acto de justificación y no es obligatorio elaborar estudios previos.", "El artículo 2.2.1.2.1.4.2 del Decreto 1082 de 2015 dispone que, cuando la causal es la urgencia manifiesta, el acto que la declara hace las veces de acto de justificación y la entidad no está obligada a elaborar estudios y documentos previos.", true]]}, {"id": "GP-159", "niv": 3, "e": "Inmediatamente después de celebrado el contrato, la alcaldía debe", "f": "Ley 80 de 1993, art. 43", "o": [["A", "remitir el contrato al concejo municipal para su aprobación, como requisito para poder pagarlo.", "La ley no somete los contratos de urgencia a aprobación del concejo; el control previsto es el del órgano de control fiscal.", false], ["B", "publicar un aviso de convocatoria en el SECOP para que otros interesados presenten ofertas.", "En la contratación directa no se expide aviso de convocatoria (Decreto 1082 de 2015) y, en todo caso, el contrato ya está celebrado; lo que exige la ley es el envío al control fiscal.", false], ["C", "enviar el contrato, el decreto de urgencia y el expediente al órgano de control fiscal competente.", "El artículo 43 de la Ley 80 de 1993 ordena enviar, inmediatamente después de celebrados, los contratos de urgencia, el acto que la declaró y el expediente con sus antecedentes al funcionario u organismo que ejerce el control fiscal, que se pronuncia dentro de los dos meses siguientes.", true]]}]}, {"comp": "gestion_publica", "rol": "tecnico", "tag": "Gestión pública, MIPG, contratación y documentos · Nivel técnico · Contratación: selección abreviada", "texto": "Usted es técnico administrativo del área de contratación de un municipio de segunda categoría. La licitación pública para la adecuación de la plaza de mercado se declaró desierta el 10 de marzo porque ninguna oferta cumplió los requisitos. En paralelo, la alcaldía adelanta un proceso de selección abreviada de menor cuantía para la señalización de vías urbanas, en el que recibió 14 manifestaciones de interés; el pliego previó la posibilidad de sorteo. El secretario jurídico le pregunta cómo continuar con ambos procesos.", "items": [{"id": "GP-160", "niv": 2, "e": "Para contratar la adecuación de la plaza de mercado por selección abreviada, la alcaldía debe iniciar el proceso", "f": "Ley 1150 de 2007, art. 2, num. 2, lit. d", "o": [["A", "dentro de los dos meses siguientes a la declaratoria de desierta.", "El plazo legal es más amplio: la ley concede cuatro meses contados desde la declaratoria de desierta del proceso inicial.", false], ["B", "dentro de los cuatro meses siguientes a la declaratoria de desierta.", "El literal d del numeral 2 del artículo 2 de la Ley 1150 de 2007 permite la selección abreviada cuando la licitación se declara desierta, y ordena iniciarla dentro de los cuatro meses siguientes a esa declaratoria.", true], ["C", "en cualquier momento de la vigencia, porque la declaratoria de desierta no fija plazo.", "La ley sí fija un plazo para acudir a esta causal; vencido, la entidad no puede invocarla.", false]]}, {"id": "GP-161", "niv": 3, "e": "Frente a las 14 manifestaciones de interés, la alcaldía", "f": "Decreto 1082 de 2015, art. 2.2.1.2.1.2.20; Ley 1150 de 2007, art. 2", "o": [["A", "puede continuar con todos los interesados o hacer un sorteo para escoger máximo diez, como lo previó el pliego.", "El artículo 2.2.1.2.1.2.20 del Decreto 1082 de 2015 dispone que, si se reciben más de diez manifestaciones de interés, la entidad puede continuar el proceso o sortear para seleccionar máximo diez interesados, según lo previsto en el pliego.", true], ["B", "debe terminar el proceso y convertirlo en licitación pública por el exceso de interesados.", "Recibir muchas manifestaciones de interés no cambia la modalidad; la norma ofrece continuar o sortear.", false], ["C", "debe rechazar las manifestaciones que excedan de diez, según el orden de llegada.", "El reglamento no prevé rechazar manifestaciones por orden de llegada; la limitación, si se usa, se hace por sorteo.", false]]}, {"id": "GP-162", "niv": 3, "e": "En el proceso de menor cuantía, el informe de evaluación de las ofertas debe publicarse durante", "f": "Decreto 1082 de 2015, art. 2.2.1.2.1.2.20, num. 4", "o": [["A", "un día hábil.", "Un día hábil es el término mínimo previsto para el informe de evaluación en la mínima cuantía, no en la selección abreviada de menor cuantía.", false], ["B", "tres días hábiles.", "El numeral 4 del artículo 2.2.1.2.1.2.20 del Decreto 1082 de 2015 ordena publicar el informe de evaluación de ofertas de la selección abreviada de menor cuantía durante tres días hábiles.", true], ["C", "cinco días hábiles.", "El reglamento no fija cinco días hábiles para este informe; para la menor cuantía el término es de tres días hábiles.", false]]}]}, {"comp": "gestion_publica", "rol": "tecnico", "tag": "Gestión pública, MIPG, contratación y documentos · Nivel técnico · Contratación: estudios y documentos previos", "texto": "Usted es técnico de la Subdirección Administrativa y Financiera de una corporación autónoma regional de la región Caribe. Debe completar los estudios previos para contratar la construcción de un vivero forestal, cuyo valor supera la menor cuantía de la corporación. El borrador que heredó describe la necesidad, el objeto, el valor estimado y las garantías, pero no indica la modalidad de selección, no analiza los riesgos del contrato y nada dice sobre cómo se vigilará su ejecución.", "items": [{"id": "GP-163", "niv": 1, "e": "Para completar los estudios previos, usted debe incluir, entre otros elementos,", "f": "Decreto 1082 de 2015, art. 2.2.1.1.2.1.1", "o": [["A", "el análisis de riesgo y la forma de mitigarlo.", "El numeral 6 del artículo 2.2.1.1.2.1.1 del Decreto 1082 de 2015 incluye el análisis de riesgo y la forma de mitigarlo entre los contenidos mínimos de los estudios y documentos previos.", true], ["B", "la lista de los oferentes que serán invitados a presentar propuesta.", "Los estudios previos no definen de antemano a quiénes se invita; hacerlo contrariaría la libre concurrencia de los procesos competitivos.", false], ["C", "el acta de inicio firmada con el futuro contratista.", "El acta de inicio es posterior a la celebración del contrato; no puede formar parte de los estudios que sirven de soporte al proceso.", false]]}, {"id": "GP-164", "niv": 2, "e": "En cuanto a la modalidad de selección, los estudios previos deben contener", "f": "Decreto 1082 de 2015, art. 2.2.1.1.2.1.1, num. 3; Ley 1150 de 2007, art. 2, parágrafo 1", "o": [["A", "solo el nombre de la modalidad, porque su justificación va en el contrato.", "La justificación de la modalidad, con sus fundamentos jurídicos, debe estar en los estudios previos y ser anterior a la apertura del proceso, no en el contrato.", false], ["B", "la modalidad que recomiende el comité evaluador después de recibir las ofertas.", "La modalidad se define y justifica antes de abrir el proceso; el comité evaluador actúa después, sobre las ofertas ya presentadas.", false], ["C", "la modalidad y su justificación, incluidos los fundamentos jurídicos.", "El numeral 3 del artículo 2.2.1.1.2.1.1 del Decreto 1082 de 2015 exige indicar la modalidad de selección y su justificación con los fundamentos jurídicos, en armonía con el parágrafo 1 del artículo 2 de la Ley 1150 de 2007.", true]]}, {"id": "GP-165", "niv": 3, "e": "Sobre la vigilancia de la ejecución, dado el valor del contrato, los estudios previos deben", "f": "Ley 1474 de 2011, art. 83, parágrafo 1", "o": [["A", "omitir el tema, porque la interventoría se decide al firmar el acta de inicio.", "La decisión sobre la vigilancia hace parte de la planeación: los estudios previos de contratos que superan la menor cuantía deben referirse a la necesidad de interventoría.", false], ["B", "pronunciarse sobre la necesidad de contar con interventoría.", "El parágrafo 1 del artículo 83 de la Ley 1474 de 2011 dispone que los estudios previos de los contratos cuyo valor supere la menor cuantía de la entidad, con independencia de la modalidad de selección, se pronuncien sobre la necesidad de contar con interventoría.", true], ["C", "designar desde ya al supervisor con nombre propio y fijarle una bonificación por la supervisión.", "La ley no exige nombrar al supervisor en los estudios previos ni prevé bonificaciones por supervisar; lo que exige es pronunciarse sobre la necesidad de interventoría.", false]]}]}, {"comp": "gestion_publica", "rol": "tecnico", "tag": "Gestión pública, MIPG, contratación y documentos · Nivel técnico · Contratación: mínima cuantía", "texto": "Usted es técnico administrativo de la personería de un municipio de cuarta categoría. La personería adelanta un proceso de mínima cuantía para el mantenimiento preventivo de sus equipos de aire acondicionado y publicó la invitación en el SECOP con su cronograma. Recibió tres ofertas: la más económica cumple todas las condiciones de la invitación; la segunda, más costosa, ofrece un año adicional de garantía comercial; la tercera no cumple las condiciones técnicas. El personero pregunta cómo seleccionar, qué documentos forman el contrato y si es obligatorio exigir garantías.", "items": [{"id": "GP-166", "niv": 1, "e": "La invitación a presentar ofertas debía publicarse por un término", "f": "Ley 1150 de 2007, art. 2, num. 5, lit. a (modificado por el art. 30 de la Ley 2069 de 2020)", "o": [["A", "no inferior a un día hábil.", "El literal a del numeral 5 del artículo 2 de la Ley 1150 de 2007 dispone que la invitación de mínima cuantía se publique por un término no inferior a un día hábil.", true], ["B", "no inferior a cinco días hábiles.", "La ley fija para la mínima cuantía un mínimo de un día hábil; cinco días hábiles no es un requisito legal de esta modalidad.", false], ["C", "no inferior a diez días hábiles.", "Diez días hábiles no corresponde al mínimo legal de la invitación de mínima cuantía, que es de un día hábil.", false]]}, {"id": "GP-167", "niv": 2, "e": "Para seleccionar, la personería debe", "f": "Ley 1150 de 2007, art. 2, num. 5, lit. c; Decreto 1082 de 2015, art. 2.2.1.2.1.5.2, num. 7", "o": [["A", "aceptar la segunda oferta, porque el año adicional de garantía ofrece mejor relación costo-beneficio.", "En la mínima cuantía el criterio de selección es el menor precio entre las ofertas que cumplen; las ventajas adicionales no previstas como criterio no permiten escoger una oferta más costosa.", false], ["B", "asignar puntajes a cada oferta y aceptar la de mayor puntaje total.", "La mínima cuantía no es un proceso de calificación por puntajes; la ley ordena escoger la de menor precio que cumpla.", false], ["C", "aceptar la oferta de menor precio, siempre que cumpla las condiciones de la invitación.", "El literal c del numeral 5 del artículo 2 de la Ley 1150 de 2007 y el numeral 7 del artículo 2.2.1.2.1.5.2 del Decreto 1082 de 2015 ordenan aceptar la oferta de menor precio que cumpla las condiciones exigidas.", true]]}, {"id": "GP-168", "niv": 2, "e": "El contrato queda conformado por", "f": "Ley 1150 de 2007, art. 2, num. 5, lit. d", "o": [["A", "una minuta escrita firmada por las partes, una vez se apruebe la póliza de cumplimiento.", "En la mínima cuantía la ley no exige minuta: la aceptación y la oferta constituyen el contrato; además, la garantía no es obligatoria.", false], ["B", "el acta de inicio suscrita por el supervisor y el contratista.", "El acta de inicio es un documento de ejecución; no es lo que perfecciona el contrato de mínima cuantía.", false], ["C", "la comunicación de aceptación junto con la oferta, que sirven de base al registro presupuestal.", "El literal d del numeral 5 del artículo 2 de la Ley 1150 de 2007 dispone que la comunicación de aceptación junto con la oferta constituyen el contrato celebrado, con base en lo cual se efectúa el registro presupuestal.", true]]}, {"id": "GP-169", "niv": 2, "e": "Sobre las garantías en este proceso, la personería", "f": "Ley 1150 de 2007, art. 7; Decreto 1082 de 2015, art. 2.2.1.2.1.5.5", "o": [["A", "debe exigir siempre garantía de cumplimiento, porque es requisito de ejecución de todo contrato estatal.", "La ley exceptúa de la obligatoriedad de garantías a los contratos cuyo valor sea inferior al 10 % de la menor cuantía, y el reglamento deja a la entidad la decisión en la mínima cuantía.", false], ["B", "es libre de exigirlas o no, según la naturaleza del objeto y la forma de pago.", "El artículo 7 de la Ley 1150 de 2007 dispone que las garantías no son obligatorias en contratos inferiores al 10 % de la menor cuantía, y el artículo 2.2.1.2.1.5.5 del Decreto 1082 de 2015 deja a la entidad en libertad de exigirlas en la mínima cuantía.", true], ["C", "no puede exigirlas, porque están prohibidas en la mínima cuantía.", "No hay prohibición: la entidad es libre de exigirlas o no, según el objeto y la forma de pago.", false]]}]}, {"comp": "gestion_publica", "rol": "tecnico", "tag": "Gestión pública, MIPG, contratación y documentos · Nivel técnico · Contratación: Plan Anual de Adquisiciones y SECOP", "texto": "Usted es técnico administrativo de la Secretaría General de una gobernación y le corresponde publicar el Plan Anual de Adquisiciones y apoyar la publicación de los procesos contractuales. Un jefe de dependencia le pide retirar del plan la compra de mobiliario, «porque la gobernación ya quedó obligada a hacerla por haberla incluido». Otro jefe le pide publicar en el SECOP los documentos de un proceso «al final, cuando se liquide el contrato, para no hacer el trabajo dos veces».", "items": [{"id": "GP-170", "niv": 2, "e": "Frente a la inquietud del primer jefe, usted le aclara que el Plan Anual de Adquisiciones", "f": "Decreto 1082 de 2015, art. 2.2.1.1.1.4.2", "o": [["A", "no obliga a la entidad a adelantar los procesos de adquisición que enumera.", "El artículo 2.2.1.1.1.4.2 del Decreto 1082 de 2015 dispone que el Plan Anual de Adquisiciones no obliga a las entidades estatales a efectuar los procesos de adquisición que en él se enumeran.", true], ["B", "obliga a adquirir todo lo incluido, salvo que la asamblea autorice excluirlo.", "El reglamento dispone lo contrario: el plan no obliga a adelantar las adquisiciones que enumera, y su ajuste no requiere autorización de la asamblea.", false], ["C", "solo es obligatorio respecto de las compras que superen la menor cuantía.", "El plan no obliga a adquirir ningún bien incluido, cualquiera sea su cuantía; la no obligatoriedad es general.", false]]}, {"id": "GP-171", "niv": 1, "e": "El Plan Anual de Adquisiciones y sus actualizaciones deben publicarse", "f": "Decreto 1082 de 2015, art. 2.2.1.1.1.4.3", "o": [["A", "en la página web de la entidad y en el SECOP.", "El artículo 2.2.1.1.1.4.3 del Decreto 1082 de 2015 ordena publicar el Plan Anual de Adquisiciones y sus actualizaciones en la página web de la entidad y en el SECOP.", true], ["B", "en la gaceta departamental, una vez lo apruebe la asamblea.", "El plan no requiere aprobación de la asamblea ni se publica en la gaceta; se publica en la web de la entidad y en el SECOP.", false], ["C", "solo en la cartelera de la Secretaría General, para consulta de los proveedores.", "Una cartelera física no cumple el deber de publicidad electrónica que exige el reglamento: página web y SECOP.", false]]}, {"id": "GP-172", "niv": 2, "e": "En cuanto a la solicitud del segundo jefe, los documentos y actos del proceso de contratación deben publicarse en el SECOP", "f": "Decreto 1082 de 2015, art. 2.2.1.1.1.7.1", "o": [["A", "al finalizar el proceso, en un solo cargue junto con la liquidación.", "Publicar todo al final impide que los interesados conozcan y controviertan los documentos en tiempo; el reglamento fija un plazo corto desde la expedición de cada documento.", false], ["B", "dentro de los tres días siguientes a su expedición.", "El artículo 2.2.1.1.1.7.1 del Decreto 1082 de 2015 obliga a publicar en el SECOP los documentos y actos administrativos del proceso de contratación dentro de los tres días siguientes a su expedición.", true], ["C", "dentro de los diez días siguientes a su expedición.", "El plazo reglamentario es de tres días siguientes a la expedición, no de diez.", false]]}]}, {"comp": "gestion_publica", "rol": "profesional", "tag": "Gestión pública, MIPG, contratación y documentos · Nivel profesional · Supervisión e interventoría (Ley 1474 de 2011)", "texto": "Usted es profesional universitario de la Secretaría General de un municipio de tercera categoría y debe proyectar la forma de vigilancia de dos contratos: el suministro de refrigerios para una jornada de rendición de cuentas y la construcción de un centro de salud con estructuras especiales, cuyo seguimiento exige conocimientos de ingeniería estructural que no tiene el personal de planta. Para el centro de salud, el alcalde quiere que una firma externa vigile solo los aspectos técnicos y que un servidor de la alcaldía se encargue de los aspectos administrativos y financieros.", "items": [{"id": "GP-173", "niv": 1, "e": "Para el contrato de suministro de refrigerios, lo procedente es", "f": "Ley 1474 de 2011, art. 83", "o": [["A", "contratar una interventoría externa con una firma especializada.", "La interventoría procede cuando el seguimiento exige conocimiento especializado o la complejidad o extensión del contrato lo justifican; no es el caso de un suministro de refrigerios.", false], ["B", "asignar la vigilancia a la Oficina de Control Interno.", "La oficina de control interno evalúa de forma independiente y no debe intervenir en la gestión contractual (Ley 87 de 1993, art. 12, parágrafo); la vigilancia de los contratos corresponde al supervisor o al interventor.", false], ["C", "designar como supervisor a un servidor de la alcaldía.", "El artículo 83 de la Ley 1474 de 2011 define la supervisión como el seguimiento que ejerce la misma entidad cuando no se requieren conocimientos especializados, como ocurre con un suministro sencillo.", true]]}, {"id": "GP-174", "niv": 2, "e": "Para el contrato del centro de salud procede la interventoría porque", "f": "Ley 1474 de 2011, art. 83", "o": [["A", "la supervisión solo puede ejercerse sobre contratos de prestación de servicios.", "La supervisión puede ejercerse sobre cualquier tipo de contrato que no requiera conocimientos especializados; no se limita a la prestación de servicios.", false], ["B", "todo contrato que supere la mínima cuantía requiere interventoría externa.", "La ley no fija la interventoría por superar la mínima cuantía; la procedencia depende del conocimiento especializado, la complejidad o la extensión del contrato.", false], ["C", "el seguimiento exige conocimiento especializado en la materia.", "El artículo 83 de la Ley 1474 de 2011 dispone que la interventoría procede cuando el seguimiento del contrato supone conocimiento especializado o cuando su complejidad o extensión lo justifican, como en el caso de las estructuras especiales.", true]]}, {"id": "GP-175", "niv": 3, "e": "La propuesta del alcalde de dividir la vigilancia del centro de salud", "f": "Ley 1474 de 2011, art. 83", "o": [["A", "es posible, si el contrato de interventoría delimita lo técnico y el resto queda en cabeza del supervisor.", "El artículo 83 de la Ley 1474 de 2011 establece que, por regla general, supervisión e interventoría no concurren, pero la entidad puede dividir la vigilancia; en tal caso el contrato de interventoría indica las actividades técnicas del interventor y las demás quedan a cargo del supervisor.", true], ["B", "no es posible, porque la supervisión y la interventoría nunca pueden concurrir sobre un mismo contrato.", "La no concurrencia es la regla general, pero la misma norma permite dividir la vigilancia entre interventor y supervisor.", false], ["C", "es posible solo si el interventor asume también lo financiero, porque lo técnico no se separa de los pagos.", "La ley permite precisamente que el interventor asuma las actividades técnicas y que las demás, incluidas las financieras, queden a cargo del supervisor.", false]]}]}, {"comp": "gestion_publica", "rol": "tecnico", "tag": "Gestión pública, MIPG, contratación y documentos · Nivel técnico · Supervisión: facultades y deberes", "texto": "Usted es técnico administrativo de la alcaldía de un municipio de segunda categoría y fue designado supervisor del contrato de aseo y cafetería de las sedes administrativas. Ha notado que el contratista no entrega las planillas de pago de seguridad social de su personal y que algunos insumos facturados no llegan. Además, un trabajador del contratista le cuenta que la factura del último mes incluyó turnos que nunca se prestaron y que «alguien de la alcaldía» lo sabía. Por el volumen de trabajo, usted solicita apoyo para su labor.", "items": [{"id": "GP-176", "niv": 1, "e": "Ante las inconsistencias en planillas e insumos, usted está facultado para", "f": "Ley 1474 de 2011, art. 84", "o": [["A", "suspender los pagos y terminar el contrato de manera unilateral mediante un oficio dirigido al contratista.", "La terminación unilateral y las demás potestades excepcionales son de la entidad, mediante acto administrativo; no son facultades del supervisor.", false], ["B", "solicitar al contratista informes, aclaraciones y explicaciones sobre la ejecución.", "El artículo 84 de la Ley 1474 de 2011 faculta a supervisores e interventores para solicitar informes, aclaraciones y explicaciones sobre el desarrollo de la ejecución contractual.", true], ["C", "imponer directamente multas al contratista mediante comunicación escrita.", "El supervisor no impone multas: estas se imponen por la entidad mediante el procedimiento legal; el supervisor informa y aporta los soportes.", false]]}, {"id": "GP-177", "niv": 2, "e": "Frente a lo que le contó el trabajador del contratista, usted debe", "f": "Ley 1474 de 2011, art. 84", "o": [["A", "esperar a la liquidación del contrato para verificar si el sobrecosto se compensa con otros meses.", "Esperar a la liquidación desatiende el deber de mantener informada a la entidad de manera oportuna sobre hechos que ponen en riesgo el contrato.", false], ["B", "informar a la entidad, pues los hechos pueden ser actos de corrupción o afectar el cumplimiento del contrato.", "El artículo 84 de la Ley 1474 de 2011 hace responsables a supervisores e interventores de mantener informada a la entidad sobre hechos que puedan constituir actos de corrupción o poner en riesgo el cumplimiento del contrato.", true], ["C", "abstenerse de reportarlo hasta reunir pruebas documentales completas, para proteger el buen nombre de los servidores implicados.", "La ley no condiciona el deber de informar a contar con pruebas completas; basta con hechos que puedan constituir corrupción o riesgo de incumplimiento.", false]]}, {"id": "GP-178", "niv": 3, "e": "Si la alcaldía decide contratar personal para apoyar su labor de supervisión, puede hacerlo", "f": "Ley 1474 de 2011, art. 83", "o": [["A", "mediante contratos de prestación de servicios, sin que usted deje de ser el supervisor.", "El artículo 83 de la Ley 1474 de 2011 permite a la entidad contratar personal de apoyo para la supervisión mediante contratos de prestación de servicios; el apoyo no sustituye al supervisor designado.", true], ["B", "solo mediante un contrato de interventoría, que reemplazaría su designación como supervisor.", "Un apoyo a la supervisión no exige contratar una interventoría; la ley prevé expresamente la prestación de servicios como mecanismo de apoyo.", false], ["C", "solo con servidores de carrera de otras dependencias, porque la supervisión no admite contratistas.", "La ley admite expresamente contratistas de prestación de servicios como personal de apoyo a la supervisión.", false]]}]}, {"comp": "gestion_publica", "rol": "profesional", "tag": "Gestión pública, MIPG, contratación y documentos · Nivel profesional · Interventoría: prórroga, vigilancia y responsabilidad", "texto": "Usted es profesional especializado de un instituto distrital de Bogotá encargado de obras de espacio público. El contrato de obra de un parque zonal se prorrogó cuatro meses por las lluvias. La firma interventora pide prorrogar también su contrato y ajustar su valor. Un abogado del instituto sostiene que cualquier adición está limitada al 50 % del valor inicial; otro pregunta quién vigila al interventor y por qué responde este si comete errores.", "items": [{"id": "GP-179", "niv": 3, "e": "Frente a la solicitud de la firma interventora, usted explica que el contrato de interventoría", "f": "Ley 1474 de 2011, art. 85", "o": [["A", "no puede prorrogarse, y debe adelantarse un nuevo concurso de méritos para cubrir los cuatro meses adicionales de obra.", "La ley prevé la continuidad de la interventoría: el contrato puede prorrogarse por el mismo plazo de la obra, sin necesidad de un nuevo proceso.", false], ["B", "puede prorrogarse, pero su valor solo puede adicionarse hasta el 50 % del valor inicial.", "Justamente para la interventoría prorrogada la ley excluye la aplicación del límite del 50 % del parágrafo del artículo 40 de la Ley 80 de 1993.", false], ["C", "puede prorrogarse por el mismo plazo de la obra y su valor ajustarse sin el límite general de adiciones.", "El artículo 85 de la Ley 1474 de 2011 permite prorrogar la interventoría por el mismo plazo en que se prorrogó el contrato vigilado y ajustar su valor sin aplicar el parágrafo del artículo 40 de la Ley 80 de 1993, que limita las adiciones al 50 %.", true]]}, {"id": "GP-180", "niv": 2, "e": "Sobre quién vigila la ejecución del contrato de interventoría, lo correcto es que", "f": "Ley 1474 de 2011, art. 83", "o": [["A", "lo supervise directamente el instituto.", "El artículo 83 de la Ley 1474 de 2011 dispone que el contrato de interventoría será supervisado directamente por la entidad estatal.", true], ["B", "lo vigile otra firma interventora contratada para ese fin.", "La ley no prevé una «interventoría de la interventoría»: ordena que la entidad supervise directamente ese contrato.", false], ["C", "lo vigile la Veeduría Distrital, por tratarse de recursos de obra pública.", "Los órganos de control y veeduría ejercen funciones externas; la vigilancia contractual del interventor es una obligación de la propia entidad.", false]]}, {"id": "GP-181", "niv": 2, "e": "En cuanto a la responsabilidad del interventor, este responde", "f": "Ley 80 de 1993, art. 53 (texto vigente)", "o": [["A", "solo disciplinariamente, porque cumple una función pública transitoria.", "Además de la disciplinaria, la ley le atribuye responsabilidad civil, fiscal y penal.", false], ["B", "civil, fiscal, penal y disciplinariamente por sus obligaciones y por los hechos u omisiones que le sean imputables.", "El artículo 53 de la Ley 80 de 1993, en su texto vigente, establece que los interventores responden civil, fiscal, penal y disciplinariamente por el cumplimiento del contrato de interventoría y por los hechos u omisiones imputables que causen daño a la entidad.", true], ["C", "únicamente en lo contractual frente al instituto, por ser un particular sin funciones públicas.", "La ley no limita la responsabilidad del interventor a lo contractual; la extiende a los ámbitos civil, fiscal, penal y disciplinario.", false]]}]}, {"comp": "gestion_publica", "rol": "profesional", "tag": "Gestión pública, MIPG, contratación y documentos · Nivel profesional · Programa de Transparencia y Ética Pública (antes PAAC)", "texto": "Usted es profesional universitario de la Oficina de Planeación de una gobernación de la región Pacífica. En enero, el secretario de Planeación le pide «actualizar el Plan Anticorrupción y de Atención al Ciudadano con los mismos componentes de siempre». Usted recuerda que la Ley 2195 de 2022 modificó el artículo 73 de la Ley 1474 de 2011 y que el Decreto 1122 de 2024 reglamentó la materia. El secretario pregunta qué cambió, qué debe contener el nuevo instrumento y dónde debe publicarse.", "items": [{"id": "GP-182", "niv": 2, "e": "Usted le explica que hoy la obligación legal de la gobernación consiste en", "f": "Ley 1474 de 2011, art. 73 (modificado por el art. 31 de la Ley 2195 de 2022); Decreto 1081 de 2015, art. 2.1.4.4.1.5 (adicionado por el Decreto 1122 de 2024)", "o": [["A", "seguir elaborando el Plan Anticorrupción y de Atención al Ciudadano, porque la Ley 2195 de 2022 solo cobija a entidades nacionales.", "La norma modificada se dirige expresamente a las entidades del orden nacional, departamental y municipal, cualquiera que sea su régimen de contratación.", false], ["B", "adoptar un programa de ética empresarial, que reemplaza al plan anticorrupción en todas las entidades.", "Los programas de transparencia y ética empresarial son exigibles a ciertas personas jurídicas vigiladas (art. 34-7 de la Ley 1474 de 2011); para las entidades públicas la ley prevé los programas de transparencia y ética pública.", false], ["C", "implementar un Programa de Transparencia y Ética Pública, y las menciones al plan anticorrupción se entienden referidas a ese programa.", "El artículo 73 de la Ley 1474 de 2011, modificado por el artículo 31 de la Ley 2195 de 2022, obliga a las entidades nacionales, departamentales y municipales a implementar Programas de Transparencia y Ética Pública, y el Decreto 1122 de 2024 dispone que toda mención al Plan Anticorrupción y de Atención al Ciudadano se entiende referida a ese programa.", true]]}, {"id": "GP-183", "niv": 1, "e": "Entre los elementos que, según la ley, debe contemplar el nuevo instrumento se encuentra", "f": "Ley 1474 de 2011, art. 73, lit. d (modificado por el art. 31 de la Ley 2195 de 2022)", "o": [["A", "el plan de ordenamiento territorial del departamento.", "El ordenamiento territorial es un instrumento de planeación física, ajeno a los contenidos del programa de transparencia.", false], ["B", "el establecimiento de canales para que se denuncien posibles hechos de corrupción.", "El literal d del artículo 73 de la Ley 1474 de 2011, modificado por la Ley 2195 de 2022, incluye los canales de denuncia entre los contenidos del Programa de Transparencia y Ética Pública, junto con la debida diligencia, la gestión de riesgos y las estrategias de Estado abierto.", true], ["C", "el manual específico de funciones y competencias laborales.", "El manual de funciones es un instrumento de administración de personal; no figura entre los contenidos del programa en el artículo 73 de la Ley 1474 de 2011.", false]]}, {"id": "GP-184", "niv": 2, "e": "Respecto de la publicación, la gobernación debe", "f": "Decreto 1081 de 2015, art. 2.1.4.4.1.4 (adicionado por el Decreto 1122 de 2024)", "o": [["A", "publicar el programa en su sede electrónica, según la ley de transparencia y acceso a la información.", "El artículo 2.1.4.4.1.4 del Decreto 1081 de 2015, adicionado por el Decreto 1122 de 2024, obliga a publicar el programa en la sede electrónica, en los términos del artículo 9 de la Ley 1712 de 2014.", true], ["B", "remitir el programa a la Procuraduría General de la Nación para que lo apruebe antes de publicarlo en cualquier medio.", "La norma no somete el programa a aprobación previa de la Procuraduría; ordena publicarlo en la sede electrónica de la entidad.", false], ["C", "publicarlo únicamente en la cartelera física, porque contiene información sobre riesgos.", "El deber de publicidad es electrónico, conforme a la ley de transparencia; la cartelera física no lo satisface.", false]]}]}, {"comp": "gestion_publica", "rol": "general", "tag": "Gestión pública, MIPG, contratación y documentos · Transparencia: riesgo de corrupción y atención de quejas", "texto": "Usted trabaja en la Secretaría de Gobierno de un municipio de quinta categoría y participa en la mesa que formula el Programa de Transparencia y Ética Pública de la alcaldía. Un integrante opina que el programa solo debe enumerar actividades de capacitación en valores. Otro pregunta cuánto tiempo tiene la alcaldía para incorporar las modificaciones del anexo técnico que expida la Secretaría de Transparencia de la Presidencia. Un tercero propone suprimir la dependencia que tramita quejas, sugerencias y reclamos «para ahorrar costos».", "items": [{"id": "GP-185", "niv": 1, "e": "Frente a la primera opinión, usted aclara que la finalidad del programa incluye", "f": "Ley 1474 de 2011, art. 73 (modificado por el art. 31 de la Ley 2195 de 2022)", "o": [["A", "capacitar exclusivamente a los directivos en el código de integridad.", "La capacitación puede ser una acción, pero la finalidad legal es más amplia y comprende la gestión del riesgo de corrupción en toda la entidad.", false], ["B", "reemplazar el régimen disciplinario con compromisos éticos firmados por los servidores.", "El programa es preventivo y no sustituye el régimen disciplinario, que sigue regulado por el Código General Disciplinario.", false], ["C", "promover la cultura de la legalidad y gestionar de forma permanente el riesgo de corrupción en la misión de la entidad.", "El artículo 73 de la Ley 1474 de 2011, modificado por la Ley 2195 de 2022, señala como fin del programa promover la cultura de la legalidad y gestionar (identificar, medir, controlar y monitorear) el riesgo de corrupción en la misionalidad de la entidad.", true]]}, {"id": "GP-186", "niv": 3, "e": "Sobre el plazo para incorporar las modificaciones del anexo técnico, las entidades territoriales cuentan con", "f": "Ley 1474 de 2011, art. 73, parágrafo 2; Decreto 1081 de 2015, art. 2.1.4.4.1.2 (adicionado por el Decreto 1122 de 2024)", "o": [["A", "hasta seis meses.", "La norma no fija seis meses; establece un año para las entidades nacionales y dos para las territoriales.", false], ["B", "hasta un año.", "Un año es el plazo para las entidades del orden nacional; las territoriales tienen un plazo mayor.", false], ["C", "hasta dos años.", "El Decreto 1122 de 2024 dispone que las modificaciones del anexo técnico se aplican en los plazos del parágrafo 2 del artículo 73 de la Ley 1474 de 2011: hasta un año para las entidades nacionales y hasta dos años para las territoriales.", true]]}, {"id": "GP-187", "niv": 2, "e": "La propuesta de suprimir la dependencia de quejas, sugerencias y reclamos", "f": "Ley 1474 de 2011, art. 76", "o": [["A", "no procede, porque la ley exige que cada entidad pública cuente con una dependencia para atender esos casos.", "El artículo 76 de la Ley 1474 de 2011 exige que en toda entidad pública exista por lo menos una dependencia encargada de recibir, tramitar y resolver las quejas, sugerencias y reclamos de los ciudadanos.", true], ["B", "procede, porque esa función puede trasladarse a la personería municipal como órgano de control.", "La personería es un órgano de control con funciones propias; la ley exige que la dependencia exista dentro de la entidad pública.", false], ["C", "procede si la alcaldía habilita en su página web un correo electrónico exclusivo para recibir quejas.", "Un correo electrónico es un canal, no una dependencia encargada de tramitar y resolver; no cumple el mandato legal.", false]]}]}, {"comp": "gestion_publica", "rol": "tecnico", "tag": "Gestión pública, MIPG, contratación y documentos · Nivel técnico · Contratación: liquidación, garantías y RUP", "texto": "Usted es técnico de la oficina de contratación de una corporación autónoma regional y revisa tres expedientes: un contrato de prestación de servicios profesionales con un ingeniero ambiental, que ya terminó; un contrato interadministrativo con un municipio para reforestar una microcuenca; y un proceso de contratación directa que se adelanta porque no existe pluralidad de oferentes en el mercado. El jefe de la oficina le pide verificar los requisitos de cada uno.", "items": [{"id": "GP-188", "niv": 3, "e": "Sobre el contrato terminado con el ingeniero ambiental, la liquidación", "f": "Ley 80 de 1993, art. 60 (texto vigente)", "o": [["A", "es obligatoria solo si el contrato tuvo adiciones o prórrogas.", "La norma no condiciona la excepción a que el contrato no haya tenido adiciones o prórrogas.", false], ["B", "no es obligatoria, por tratarse de prestación de servicios profesionales.", "El artículo 60 de la Ley 80 de 1993, en su texto vigente, dispone que la liquidación no es obligatoria en los contratos de prestación de servicios profesionales y de apoyo a la gestión.", true], ["C", "es obligatoria y debe hacerse de mutuo acuerdo dentro de los cuatro meses siguientes a la terminación.", "La ley exceptúa de la liquidación obligatoria a los contratos de prestación de servicios profesionales y de apoyo a la gestión.", false]]}, {"id": "GP-189", "niv": 3, "e": "En el contrato interadministrativo con el municipio, las garantías", "f": "Ley 1150 de 2007, art. 7; Decreto 1082 de 2015, art. 2.2.1.2.1.4.5", "o": [["A", "son obligatorias, porque el contrato compromete recursos públicos de dos entidades estatales distintas.", "La ley excluye expresamente a los contratos interadministrativos de la obligatoriedad de garantías.", false], ["B", "no son obligatorias, y la decisión de exigirlas o no debe justificarse en los estudios previos.", "El artículo 7 de la Ley 1150 de 2007 dispone que las garantías no son obligatorias en los contratos interadministrativos, y el artículo 2.2.1.2.1.4.5 del Decreto 1082 de 2015 exige que en la contratación directa la justificación para exigirlas o no esté en los estudios previos.", true], ["C", "están prohibidas, porque una entidad pública no puede garantizar obligaciones ante otra.", "No existe tal prohibición: las garantías no son obligatorias, pero la entidad puede exigirlas si lo justifica.", false]]}, {"id": "GP-190", "niv": 3, "e": "En el proceso por inexistencia de pluralidad de oferentes, al contratista", "f": "Ley 1150 de 2007, art. 6", "o": [["A", "no se le exige el Registro Único de Proponentes; la corporación verifica directamente sus condiciones.", "El artículo 6 de la Ley 1150 de 2007 exceptúa del RUP, entre otros, los casos de contratación directa y la mínima cuantía, y dispone que en esos eventos la entidad verifique las condiciones de los proponentes.", true], ["B", "se le exige el RUP solo si el valor del contrato supera la mínima cuantía de la corporación.", "La excepción del RUP en la contratación directa no depende del valor del contrato.", false], ["C", "se le exige el RUP vigente, porque toda contratación de la corporación lo requiere sin excepción alguna.", "El RUP no se exige en todos los casos; la ley excluye, entre otros, la contratación directa.", false]]}]}, {"comp": "gestion_publica", "rol": "general", "tag": "Gestión pública, MIPG, contratación y documentos · Contrato de prestación de servicios", "texto": "Usted trabaja en la Secretaría General de un municipio de cuarta categoría. La Secretaría de Desarrollo Social pide vincular mediante contrato de prestación de servicios a una trabajadora social para un programa de atención a personas mayores que durará cinco meses. En la planta hay dos trabajadoras sociales, pero ambas están dedicadas por completo a otro programa. La secretaria propone pactar el contrato por dos años «para no repetir el trámite», fijarle el mismo horario de los servidores de planta y reconocerle vacaciones remuneradas.", "items": [{"id": "GP-191", "niv": 2, "e": "Para celebrar este contrato con una persona natural, debe acreditarse que", "f": "Ley 80 de 1993, art. 32, num. 3", "o": [["A", "la trabajadora social no tiene vínculos previos con otra entidad pública.", "Haber tenido vínculos con otras entidades no es el presupuesto legal de este contrato; lo relevante es la insuficiencia de la planta o la necesidad de conocimientos especializados.", false], ["B", "el valor del contrato no supera la mínima cuantía del municipio.", "La procedencia de este contrato no depende de su cuantía; los servicios profesionales se contratan directamente con independencia del valor.", false], ["C", "la actividad no puede realizarse con el personal de planta o requiere conocimientos especializados.", "El numeral 3 del artículo 32 de la Ley 80 de 1993 permite celebrar contratos de prestación de servicios con personas naturales solo cuando la actividad no puede realizarse con personal de planta o requiere conocimientos especializados.", true]]}, {"id": "GP-192", "niv": 1, "e": "Sobre la duración propuesta por la secretaria, el contrato debe pactarse", "f": "Ley 80 de 1993, art. 32, num. 3", "o": [["A", "por el término estrictamente indispensable para ejecutar el programa.", "El numeral 3 del artículo 32 de la Ley 80 de 1993 ordena que los contratos de prestación de servicios se celebren por el término estrictamente indispensable; si el programa dura cinco meses, pactar dos años lo desconoce.", true], ["B", "por un plazo mínimo de un año, para garantizar la continuidad del servicio.", "La ley no fija un plazo mínimo; por el contrario, limita la duración a lo estrictamente indispensable.", false], ["C", "por el período que le resta al alcalde, por tratarse de un programa del plan de desarrollo.", "El período del alcalde no es el criterio legal; la duración depende de la necesidad concreta, que aquí es de cinco meses.", false]]}, {"id": "GP-193", "niv": 2, "e": "En cuanto a las vacaciones remuneradas propuestas, usted advierte que", "f": "Ley 80 de 1993, art. 32, num. 3", "o": [["A", "proceden si el contrato se celebra con una persona natural y no con una persona jurídica o un consorcio.", "La naturaleza del contratista no cambia la regla: los contratos de prestación de servicios no generan prestaciones sociales.", false], ["B", "los contratos de prestación de servicios no generan relación laboral ni prestaciones sociales.", "El numeral 3 del artículo 32 de la Ley 80 de 1993 dispone que estos contratos en ningún caso generan relación laboral ni prestaciones sociales; reconocer vacaciones y fijar horario de planta desnaturaliza el contrato.", true], ["C", "proceden de manera proporcional, siempre que el contrato supere seis meses.", "Las vacaciones son una prestación propia de la relación laboral; la duración del contrato no las hace procedentes en un contrato de prestación de servicios.", false]]}]}, {"comp": "gestion_publica", "rol": "asistencial", "tag": "Gestión pública, MIPG, contratación y documentos · Nivel asistencial · Gestión documental: ciclo vital y tipos de archivo", "texto": "Usted es auxiliar administrativo de la Secretaría de Gobierno de un municipio de sexta categoría y tiene a su cargo el archivo de la dependencia. En las estanterías hay expedientes de permisos para eventos del año en curso, que se consultan a diario; expedientes de hace seis años, que se consultan pocas veces al año pero aún tienen vigencia y ya cumplieron el tiempo de permanencia en la oficina fijado en la tabla de retención documental (TRD); y libros de actas del consejo de gobierno que la TRD señala como de conservación total y que ya cumplieron su tiempo en el archivo central.", "items": [{"id": "GP-194", "niv": 1, "e": "Los expedientes de permisos del año en curso pertenecen al", "f": "Ley 594 de 2000, art. 23", "o": [["A", "archivo histórico, porque son documentos oficiales del municipio.", "El archivo histórico recibe documentos de conservación permanente transferidos desde el archivo central; ser un documento oficial no lo ubica allí.", false], ["B", "archivo central, porque todo documento radicado debe enviarse allí desde su creación.", "Al archivo central llegan documentos transferidos desde los archivos de gestión cuando su consulta ya no es frecuente; no se envían allí desde su creación.", false], ["C", "archivo de gestión, porque la oficina productora los usa y consulta continuamente.", "El literal a del artículo 23 de la Ley 594 de 2000 define el archivo de gestión como el que comprende la documentación sometida a continua utilización y consulta administrativa por las oficinas productoras.", true]]}, {"id": "GP-195", "niv": 2, "e": "Con los expedientes de hace seis años, lo procedente es", "f": "Ley 594 de 2000, art. 23", "o": [["A", "eliminarlos, porque terminó su permanencia en el archivo de gestión.", "Terminar la permanencia en gestión no autoriza eliminar; la eliminación procede solo si la disposición final lo señala y siguiendo el procedimiento del AGN.", false], ["B", "transferirlos al archivo central, que agrupa documentos de consulta menos frecuente que siguen vigentes.", "El literal b del artículo 23 de la Ley 594 de 2000 define el archivo central como el que agrupa los documentos transferidos por los archivos de gestión, de consulta menos frecuente pero aún vigentes; la TRD ya indicó que terminó su tiempo en la oficina.", true], ["C", "transferirlos directamente al archivo histórico, porque ya no se consultan a diario.", "Al archivo histórico solo llegan, desde el archivo central, los documentos de conservación permanente; estos expedientes aún tienen vigencia y deben pasar primero por el archivo central.", false]]}, {"id": "GP-196", "niv": 2, "e": "Los libros de actas del consejo de gobierno, de conservación total, deben ahora", "f": "Ley 594 de 2000, art. 23", "o": [["A", "digitalizarse y luego eliminarse en papel, porque la copia digital los reemplaza.", "Si la TRD fija conservación total, el documento debe conservarse de forma permanente; digitalizarlo no autoriza su eliminación.", false], ["B", "devolverse al archivo de gestión para su custodia definitiva.", "El ciclo vital no prevé devolver documentos al archivo de gestión para conservarlos de forma permanente; su destino es el archivo histórico.", false], ["C", "transferirse al archivo histórico para su conservación permanente.", "El literal c del artículo 23 de la Ley 594 de 2000 define el archivo histórico como aquel al que se transfieren, desde el archivo central, los documentos de conservación permanente.", true]]}]}, {"comp": "gestion_publica", "rol": "tecnico", "tag": "Gestión pública, MIPG, contratación y documentos · Nivel técnico · Gestión documental: tablas de retención documental", "texto": "Usted es técnico administrativo del grupo de gestión documental de una corporación autónoma regional de los Santanderes. La corporación no ha actualizado su tabla de retención documental (TRD) desde una reestructuración que creó nuevas dependencias. En el comité directivo, un subdirector pregunta qué es exactamente la TRD, si es obligatorio tenerla y quién aprueba internamente la eliminación de los documentos cuya disposición final en la TRD es la eliminación.", "items": [{"id": "GP-197", "niv": 1, "e": "Usted explica que la TRD es", "f": "Ley 594 de 2000, art. 3", "o": [["A", "la relación de series y tipos documentales con el tiempo que deben permanecer en cada etapa del ciclo vital.", "El artículo 3 de la Ley 594 de 2000 define la tabla de retención documental como el listado de series con sus tipos documentales, a las cuales se asigna el tiempo de permanencia en cada etapa del ciclo vital.", true], ["B", "el plan que fija las metas anuales del proceso de gestión documental.", "Las metas y la planeación de la función archivística se recogen en instrumentos como el Plan Institucional de Archivos; la TRD no es un plan de metas.", false], ["C", "el inventario de todos los documentos que custodia el archivo central, con su ubicación física.", "Eso describe un inventario documental, instrumento distinto (Ley 594 de 2000, art. 26); la TRD no ubica unidades físicas sino que fija tiempos de retención por serie.", false]]}, {"id": "GP-198", "niv": 1, "e": "Respecto de su obligatoriedad, usted señala que", "f": "Ley 594 de 2000, art. 24", "o": [["A", "la ley obliga a las entidades del Estado a elaborar y adoptar sus TRD.", "El artículo 24 de la Ley 594 de 2000 dispone que es obligatorio para las entidades del Estado elaborar y adoptar sus tablas de retención documental.", true], ["B", "solo es obligatoria para las entidades del orden nacional.", "La obligación legal se dirige a las entidades del Estado sin distinguir el orden nacional o territorial.", false], ["C", "es voluntaria y se recomienda para entidades con archivo histórico.", "La ley no la deja a la voluntad de la entidad: la hace obligatoria.", false]]}, {"id": "GP-199", "niv": 2, "e": "La eliminación de los documentos cuya disposición final en la TRD es la eliminación debe aprobarla", "f": "Acuerdo AGN 001 de 2024, art. 4.5.4 (Acuerdo Único de la Función Archivística; deroga el Acuerdo 004 de 2019)", "o": [["A", "el jefe de la Oficina de Control Interno, mediante certificación.", "La oficina de control interno evalúa de forma independiente; no aprueba actos de gestión como la eliminación documental.", false], ["B", "el Comité Institucional de Gestión y Desempeño o la instancia que haga sus veces.", "El artículo 4.5.4 del Acuerdo 001 de 2024 del Archivo General de la Nación (Acuerdo Único de la Función Archivística) dispone que la eliminación debe ser aprobada por el Comité Institucional de Gestión y Desempeño o quien haga sus veces. Esta regla, que antes estaba en el Acuerdo 004 de 2019, hoy está en el Acuerdo 001 de 2024, que derogó aquel.", true], ["C", "el Archivo General de la Nación, en cada caso, mediante resolución.", "El AGN o los consejos territoriales intervienen si hay observaciones ciudadanas, pero la aprobación de la eliminación corresponde a la instancia interna de la entidad.", false]]}]}, {"comp": "gestion_publica", "rol": "profesional", "tag": "Gestión pública, MIPG, contratación y documentos · Nivel profesional · Gestión documental: eliminación de documentos", "texto": "Usted es profesional universitario responsable de gestión documental de una gobernación. La TRD convalidada señala que los comprobantes de la caja menor se eliminan después de cumplir su tiempo en el archivo central. El secretario general quiere eliminar 300 cajas este mes «para liberar espacio» y le pide el procedimiento. Al revisar, usted encuentra que la TRD de la gobernación todavía no ha sido inscrita en el Registro Único de Series Documentales (RUSD).", "items": [{"id": "GP-200", "niv": 3, "e": "Antes de eliminar, la gobernación debe", "f": "Acuerdo AGN 001 de 2024, art. 4.5.4, num. 1 (Acuerdo Único de la Función Archivística; deroga el Acuerdo 004 de 2019)", "o": [["A", "microfilmar o digitalizar todos los documentos que se van a eliminar.", "La reproducción técnica no es requisito general de la eliminación; si la TRD dispone eliminar, el procedimiento exige registro de la TRD, publicación del inventario y aprobación interna.", false], ["B", "obtener concepto favorable de la contraloría departamental sobre el contenido de cada una de las cajas.", "El procedimiento de eliminación del AGN no exige concepto de la contraloría; el requisito previo omitido en el caso es la inscripción de la TRD en el RUSD.", false], ["C", "acreditar que la TRD está inscrita en el Registro Único de Series Documentales (RUSD).", "El numeral 1 del artículo 4.5.4 del Acuerdo 001 de 2024 del AGN exige que, antes de adelantar la eliminación, la entidad acredite la inscripción de sus TRD o TVD en el Registro Único de Series Documentales. Esta regla, que antes estaba en el Acuerdo 004 de 2019, hoy está en el Acuerdo 001 de 2024, que derogó aquel.", true]]}, {"id": "GP-201", "niv": 3, "e": "Como requisito de la eliminación, el inventario de los documentos debe publicarse en el sitio web de la gobernación por", "f": "Acuerdo AGN 001 de 2024, art. 4.5.4, num. 2 (Acuerdo Único de la Función Archivística; deroga el Acuerdo 004 de 2019)", "o": [["A", "diez días hábiles.", "Diez días hábiles es inferior al término que fija el Acuerdo 001 de 2024 del AGN para que la ciudadanía conozca el inventario y formule observaciones.", false], ["B", "treinta días hábiles.", "Treinta días hábiles es el plazo de la entidad para pedir concepto técnico cuando recibe observaciones, no el término de publicación del inventario.", false], ["C", "sesenta días hábiles.", "El numeral 2 del artículo 4.5.4 del Acuerdo 001 de 2024 del AGN exige publicar en el sitio web, durante sesenta días hábiles, el inventario de los documentos que pueden eliminarse, para que los ciudadanos envíen observaciones. Esta regla, que antes estaba en el Acuerdo 004 de 2019, hoy está en el Acuerdo 001 de 2024, que derogó aquel.", true]]}, {"id": "GP-202", "niv": 3, "e": "Si durante la publicación un ciudadano presenta observaciones directamente ante la gobernación, esta debe", "f": "Acuerdo AGN 001 de 2024, art. 4.5.4, num. 3 (Acuerdo Único de la Función Archivística; deroga el Acuerdo 004 de 2019)", "o": [["A", "responder la observación como un derecho de petición y continuar con la eliminación al vencer el término de publicación, sin consultar a ninguna otra instancia técnica ni archivística.", "Responder al ciudadano no basta: el acuerdo exige pedir concepto técnico a la instancia archivística competente antes de decidir si se suspende la eliminación.", false], ["B", "pedir, dentro de los treinta días hábiles siguientes a su radicación, concepto técnico al consejo territorial de archivos o al AGN sobre si debe suspenderse la eliminación.", "El numeral 3 del artículo 4.5.4 del Acuerdo 001 de 2024 del AGN, que nombra expresamente a «los Consejos Territoriales de Archivos o al Archivo General de la Nación», da a la entidad treinta días hábiles desde la radicación de las observaciones para solicitar concepto técnico al consejo territorial de archivos o al AGN, con copia de las observaciones y de la propuesta de eliminación. Esta regla, que antes estaba en el Acuerdo 004 de 2019, hoy está en el Acuerdo 001 de 2024, que derogó aquel.", true], ["C", "suspender de manera definitiva la eliminación, porque cualquier observación ciudadana la impide.", "Las observaciones no suspenden automáticamente y para siempre el proceso; dan lugar a un concepto técnico sobre la pertinencia de suspenderlo.", false]]}]}, {"comp": "gestion_publica", "rol": "asistencial", "tag": "Gestión pública, MIPG, contratación y documentos · Nivel asistencial · Gestión documental: entrega de archivos al desvincularse", "texto": "Usted es auxiliar administrativo de una alcaldía local de Bogotá. La profesional que manejaba los expedientes de querellas renunció y su último día de trabajo es el viernes. Ella propone dejar las carpetas «en el escritorio, para que las organice quien llegue» y afirma que, una vez entregue el puesto, no responderá por nada de lo que pase con esos documentos. Su jefe le pide a usted apoyar la entrega.", "items": [{"id": "GP-203", "niv": 1, "e": "Según la Ley 594 de 2000, al desvincularse la profesional debe", "f": "Ley 594 de 2000, art. 15", "o": [["A", "entregar los documentos y archivos a su cargo debidamente inventariados.", "El artículo 15 de la Ley 594 de 2000 obliga a los servidores públicos que se desvinculan a entregar los documentos y archivos a su cargo debidamente inventariados, según las normas del AGN.", true], ["B", "llevarse copia de los expedientes para responder ante cualquier requerimiento futuro.", "Los documentos son de la entidad y deben quedar en ella; llevarse copias de expedientes no es la forma de cumplir el deber de entrega.", false], ["C", "entregar las carpetas a su jefe sin inventario, porque son documentos en trámite.", "La ley no exceptúa los documentos en trámite: la entrega debe hacerse inventariada.", false]]}, {"id": "GP-204", "niv": 2, "e": "Para registrar la entrega de las carpetas, el instrumento adecuado es", "f": "Ley 594 de 2000, arts. 15 y 26; Archivo General de la Nación, FUID", "o": [["A", "el Plan Institucional de Archivos (PINAR).", "El PINAR es un instrumento de planeación de la función archivística, no un registro de entrega de expedientes.", false], ["B", "la tabla de valoración documental (TVD).", "La TVD se usa para valorar fondos acumulados y definir su disposición final; no sirve para relacionar las carpetas que entrega un servidor.", false], ["C", "el Formato Único de Inventario Documental (FUID).", "El inventario documental es el instrumento que registra las unidades documentales a cargo de un servidor (Ley 594 de 2000, arts. 15 y 26), y el formato adoptado por el AGN para ello es el FUID.", true]]}, {"id": "GP-205", "niv": 2, "e": "Frente a la afirmación de la profesional sobre su responsabilidad, usted le aclara que", "f": "Ley 594 de 2000, art. 15", "o": [["A", "la entrega inventariada no la exonera de la responsabilidad que surja por irregularidades.", "El artículo 15 de la Ley 594 de 2000 precisa que la entrega inventariada se hace sin que ello implique exoneración de la responsabilidad a que haya lugar en caso de irregularidades.", true], ["B", "tiene razón, porque la responsabilidad pasa a quien recibe el puesto desde la firma del acta.", "La ley dispone que la entrega no exonera de la responsabilidad que pueda haber por irregularidades; no se traslada automáticamente al sucesor.", false], ["C", "solo responde si los documentos se pierden en los tres meses siguientes a su retiro.", "La ley no fija un plazo de tres meses; la responsabilidad depende de las irregularidades imputables, no de un término desde el retiro.", false]]}]}, {"comp": "gestion_publica", "rol": "tecnico", "tag": "Gestión pública, MIPG, contratación y documentos · Nivel técnico · Gestión documental: principios de organización", "texto": "Usted es técnico de archivo de un instituto departamental de cultura. Al organizar el archivo central encuentra cajas mezcladas, con documentos de la Oficina Jurídica revueltos con los de Tesorería, y expedientes cuyos folios fueron reordenados alfabéticamente por un contratista anterior, sin respetar la secuencia en que se produjeron los trámites. El director le pregunta, además, si es obligatorio llevar inventarios y tener un programa de gestión documental.", "items": [{"id": "GP-206", "niv": 2, "e": "Al separar los documentos según la dependencia que los produjo, usted aplica el principio de", "f": "Ley 594 de 2000, art. 11", "o": [["A", "orden original.", "El orden original se refiere a la secuencia interna en que se produjeron los documentos dentro de cada agrupación, no a la dependencia productora.", false], ["B", "procedencia.", "El artículo 11 de la Ley 594 de 2000 ordena organizar los archivos según los principios de procedencia y orden original; la procedencia exige mantener juntos los documentos de una misma oficina productora.", true], ["C", "selección documental.", "La selección es una forma de disposición final que se aplica a ciertas series según la TRD; no es el principio que ordena agrupar por dependencia productora.", false]]}, {"id": "GP-207", "niv": 2, "e": "Al restablecer dentro de cada expediente la secuencia en que se produjeron los documentos, usted aplica el principio de", "f": "Ley 594 de 2000, art. 11", "o": [["A", "orden original.", "El artículo 11 de la Ley 594 de 2000 incluye el principio de orden original, que exige conservar la secuencia en que se produjeron los documentos al tramitar el asunto; el orden alfabético impuesto por el contratista lo desconoce.", true], ["B", "conservación total.", "La conservación total es una disposición final que fija la TRD, no un principio de organización interna del expediente.", false], ["C", "procedencia.", "La procedencia determina a qué oficina pertenecen los documentos, pero no el orden interno de los folios en cada expediente.", false]]}, {"id": "GP-208", "niv": 1, "e": "Respecto de las preguntas del director, usted le informa que las entidades públicas", "f": "Ley 594 de 2000, arts. 21 y 26", "o": [["A", "pueden prescindir del programa de gestión documental si tienen una TRD convalidada.", "La TRD y el programa de gestión documental son obligaciones distintas; tener una no exime de la otra.", false], ["B", "deben elaborar inventarios solo cuando van a eliminar documentos.", "La obligación de inventariar es general, para controlar los documentos en sus diferentes fases, y no se limita a la eliminación.", false], ["C", "deben elaborar inventarios documentales y programas de gestión documental.", "El artículo 26 de la Ley 594 de 2000 obliga a elaborar inventarios de los documentos que se producen, y el artículo 21 exige elaborar programas de gestión documental.", true]]}]}, {"comp": "gestion_publica", "rol": "asistencial", "tag": "Gestión pública, MIPG, contratación y documentos · Nivel asistencial · Gestión documental: procesos archivísticos y responsabilidad", "texto": "Usted es auxiliar administrativo de la ventanilla de correspondencia de una corporación autónoma regional. Cada día radica solicitudes de concesión de aguas y de permisos de vertimientos, las distribuye a las dependencias y orienta a los usuarios sobre el estado de sus trámites. La corporación piensa implementar la radicación electrónica. En una capacitación le preguntan cómo se relaciona su trabajo con la gestión documental y quién responde por los archivos de la entidad.", "items": [{"id": "GP-209", "niv": 1, "e": "Usted explica que la radicación y la distribución de las solicitudes hacen parte de", "f": "Ley 594 de 2000, art. 22", "o": [["A", "la etapa de archivo histórico, porque toda solicitud radicada adquiere valor permanente.", "Radicar un documento no le da valor permanente; el archivo histórico recibe solo los documentos de conservación permanente desde el archivo central.", false], ["B", "los procesos archivísticos, que van desde la recepción de los documentos hasta su disposición final.", "El artículo 22 de la Ley 594 de 2000 señala que la gestión documental comprende procesos como la producción o recepción, la distribución, la con
