sulta, la organización, la recuperación y la disposición final.", true], ["C", "las actividades de atención al ciudadano, ajenas a la gestión documental.", "Aunque se relacionan con la atención al usuario, la recepción y distribución de documentos son procesos archivísticos según la Ley 594 de 2000.", false]]}, {"id": "GP-210", "niv": 2, "e": "La responsabilidad por la gestión de documentos y la administración de los archivos de la corporación recae en", "f": "Ley 594 de 2000, art. 12", "o": [["A", "la propia administración, es decir, en la corporación.", "El artículo 12 de la Ley 594 de 2000 dispone que la administración pública es responsable de la gestión de documentos y de la administración de sus archivos.", true], ["B", "cada usuario que radica su solicitud, respecto de sus propios documentos.", "Una vez radicados, los documentos hacen parte del archivo de la entidad, que es la responsable de gestionarlos.", false], ["C", "el Archivo General de la Nación, como ente rector de la política archivística.", "El AGN orienta, regula y vigila, pero la responsabilidad por la gestión de los documentos y archivos de cada entidad es de esa entidad.", false]]}, {"id": "GP-211", "niv": 2, "e": "Frente a la idea de implementar la radicación electrónica, la Ley 594 de 2000", "f": "Ley 594 de 2000, art. 21", "o": [["A", "la prohíbe, porque los trámites ambientales de la corporación solo admiten expedientes físicos en soporte papel firmado.", "La ley no prohíbe los soportes electrónicos; por el contrario, admite el uso de nuevas tecnologías en la gestión documental.", false], ["B", "la permite en los programas de gestión documental, siempre que se respeten los principios y procesos archivísticos.", "El artículo 21 de la Ley 594 de 2000 dispone que los programas de gestión de documentos pueden contemplar el uso de nuevas tecnologías y soportes, observando los principios y procesos archivísticos.", true], ["C", "la permite solo si el AGN autoriza previamente cada documento electrónico que se radique.", "La ley no exige una autorización del AGN documento por documento; exige respetar los principios y procesos archivísticos.", false]]}]}, {"comp": "entidades_territoriales", "rol": "profesional", "tag": "Entidades territoriales, Bogotá D.C. y CAR · Nivel profesional · Categorización de municipios", "texto": "Usted es profesional universitario de la Secretaría de Hacienda de un municipio del Tolima. En agosto recibe las certificaciones oficiales: según el DANE, el municipio tiene 45.000 habitantes; según la Contraloría General de la República, los ingresos corrientes de libre destinación (ICLD) recaudados en la vigencia anterior equivalen a 60.000 salarios mínimos legales mensuales vigentes, y los gastos de funcionamiento no superaron el límite legal. El alcalde le pide preparar el proyecto de decreto de categorización para el año siguiente y resolver algunas dudas del equipo jurídico.", "items": [{"id": "ET-101", "niv": 3, "e": "Con los datos certificados, en el proyecto de decreto usted debe proponer que el municipio quede en", "f": "Ley 136 de 1994, art. 6, parágrafo 1 (modificado por el art. 153 del Decreto Ley 2106 de 2019)", "o": [["A", "tercera categoría, porque la población, entre 30.001 y 50.000 habitantes, es el criterio que define la categoría.", "La población no basta. El parágrafo 1 del art. 6 de la Ley 136 de 1994 ordena que, si los ICLD superan el tope de la categoría que correspondería por población (50.000 SMMLV en tercera), el municipio pase a la categoría inmediatamente superior.", false], ["B", "primera categoría, porque al superar el tope de ingresos se sube dos categorías por encima de la que indica la población.", "La regla es subir a la categoría inmediatamente superior, no dos. El límite de no variar más de dos categorías entre un año y otro es una regla distinta del parágrafo 2 del art. 6 de la Ley 136 de 1994.", false], ["C", "segunda categoría, porque sus ICLD superan el tope previsto para la categoría que le correspondería por población.", "Por población (45.000) estaría en tercera, cuyo tope de ICLD es 50.000 SMMLV. El parágrafo 1 del art. 6 de la Ley 136 de 1994, en el texto vigente del art. 153 del Decreto Ley 2106 de 2019, ordena que el municipio que supere ese tope se clasifique en la categoría inmediatamente superior: segunda. El resultado coincide con el rango de ICLD de segunda categoría (más de 50.000 y hasta 100.000 SMMLV).", true]]}, {"id": "ET-102", "niv": 2, "e": "Sobre el plazo para expedir el decreto de categorización, usted debe advertir al alcalde que", "f": "Ley 136 de 1994, art. 6, parágrafo 3 (modificado por el art. 153 del Decreto Ley 2106 de 2019)", "o": [["A", "debe expedirlo antes del 31 de octubre y, si no lo hace, la categoría la fija el Contador General de la Nación en noviembre.", "El parágrafo 3 del art. 6 de la Ley 136 de 1994 fija el 31 de octubre como plazo para el decreto del alcalde y, ante su omisión, asigna la categorización al Contador General de la Nación en noviembre.", true], ["B", "debe expedirlo antes del 31 de diciembre y, si no lo hace, la categoría la fija mediante decreto el gobernador del respectivo departamento.", "Ni el plazo ni la autoridad supletoria son esos: la norma señala el 31 de octubre y al Contador General de la Nación, no al gobernador.", false], ["C", "puede expedirlo en cualquier momento del año, pues la categoría solo se requiere al aprobar el presupuesto.", "La ley sí fija un término (antes del 31 de octubre) y prevé una consecuencia por su incumplimiento; no es una decisión discrecional en el tiempo.", false]]}, {"id": "ET-103", "niv": 2, "e": "Si el año siguiente el municipio destinara a gastos de funcionamiento un porcentaje superior al límite legal, la consecuencia sobre su categoría sería", "f": "Ley 136 de 1994, art. 6, parágrafo 2 (modificado por el art. 153 del Decreto Ley 2106 de 2019)", "o": [["A", "conservar la categoría, pero sin poder ejecutar inversión con recursos propios hasta ajustar el gasto.", "La norma de categorización no prevé esa consecuencia; lo que establece es la reclasificación del municipio.", false], ["B", "reclasificarlo en la categoría inmediatamente inferior a la que le corresponda por población e ingresos.", "El parágrafo 2 del art. 6 de la Ley 136 de 1994 dispone que el distrito o municipio que supere los límites legales de gastos de funcionamiento se reclasifica en la categoría inmediatamente inferior.", true], ["C", "reclasificarlo en sexta categoría, por ser la que corresponde a los municipios con desequilibrio fiscal.", "No se envía automáticamente a sexta categoría: el descenso es a la categoría inmediatamente inferior y, además, ningún municipio puede variar más de dos categorías de un año a otro.", false]]}]}, {"comp": "entidades_territoriales", "rol": "general", "tag": "Entidades territoriales, Bogotá D.C. y CAR · Sesiones del concejo municipal", "texto": "Usted es técnico administrativo de la Secretaría General del Concejo de un municipio de sexta categoría de Boyacá. A comienzos de año, un concejal recién posesionado le pide orientación sobre el funcionamiento de la corporación: en qué meses sesiona ordinariamente, qué ocurre si el alcalde necesita que el Concejo estudie con urgencia un proyecto fuera de esos meses y si es posible ampliar un periodo de sesiones cuando quedan proyectos pendientes de segundo debate.", "items": [{"id": "ET-104", "niv": 1, "e": "Respecto de las sesiones ordinarias, usted le informa al concejal que el Concejo sesiona", "f": "Ley 136 de 1994, art. 23", "o": [["A", "cuando lo convoque el alcalde, que fija cada año el calendario.", "Las sesiones ordinarias son por derecho propio en los meses fijados por la ley; la convocatoria del alcalde corresponde a las sesiones extraordinarias.", false], ["B", "seis meses al año, en tres periodos de dos meses.", "Ese régimen de seis meses (tres periodos) aplica solo a los concejos de municipios de categoría especial, primera y segunda, según el art. 23 de la Ley 136 de 1994.", false], ["C", "en febrero, mayo, agosto y noviembre, por derecho propio.", "El art. 23 de la Ley 136 de 1994 establece que los concejos de municipios distintos de categoría especial, primera y segunda sesionan cuatro meses al año: febrero, mayo, agosto y noviembre.", true]]}, {"id": "ET-105", "niv": 1, "e": "Si el alcalde necesita que el Concejo estudie un proyecto en un mes en el que no hay sesiones ordinarias, el mecanismo procedente es que", "f": "Ley 136 de 1994, art. 23, parágrafo 2, y art. 91, lit. a), num. 4 (modificado por el art. 29 de la Ley 1551 de 2012)", "o": [["A", "el presidente del Concejo convoque a sesiones ordinarias adicionales a solicitud del alcalde.", "La ley no prevé sesiones ordinarias adicionales convocadas por el presidente; las sesiones fuera de los periodos legales son extraordinarias y las convoca el alcalde.", false], ["B", "el alcalde expida el acto como decreto, pues durante el receso del Concejo asume transitoriamente sus funciones normativas.", "El receso del Concejo no traslada sus funciones al alcalde; las facultades pro tempore requieren autorización expresa del Concejo.", false], ["C", "el alcalde convoque a sesiones extraordinarias, en las que el Concejo se ocupa solo de los asuntos que él someta.", "El parágrafo 2 del art. 23 de la Ley 136 de 1994 y el art. 91, literal a), numeral 4 (modificado por la Ley 1551 de 2012) facultan al alcalde para convocar a extraordinarias, limitadas a los asuntos que somete a consideración.", true]]}, {"id": "ET-106", "niv": 2, "e": "En cuanto a la posibilidad de ampliar un periodo ordinario, usted le explica que", "f": "Ley 136 de 1994, art. 23, parágrafo 1", "o": [["A", "cada periodo puede prorrogarse hasta por diez días hábiles, con autorización del alcalde.", "La prórroga es de diez días calendario y depende de la voluntad del propio Concejo, no de una autorización del alcalde.", false], ["B", "cada periodo puede prorrogarse por diez días calendario más, por decisión del mismo Concejo.", "El parágrafo 1 del art. 23 de la Ley 136 de 1994 permite prorrogar cada periodo ordinario por diez días calendario más, a voluntad del respectivo Concejo.", true], ["C", "no es posible ampliarlo, por lo que los proyectos pendientes deben radicarse de nuevo en el siguiente periodo.", "La ley sí permite prorrogar cada periodo ordinario, de modo que esta afirmación desconoce el parágrafo 1 del art. 23 de la Ley 136 de 1994.", false]]}]}, {"comp": "entidades_territoriales", "rol": "profesional", "tag": "Entidades territoriales, Bogotá D.C. y CAR · Nivel profesional · Objeciones a proyectos de acuerdo", "texto": "Usted es profesional de la Oficina Jurídica de la alcaldía de un municipio de segunda categoría de Antioquia. El Concejo aprobó en segundo debate un proyecto de acuerdo de 35 artículos que regula el uso de parques y escenarios deportivos. El alcalde considera que algunas disposiciones son inconvenientes por su costo y que otras desconocen la ley, y le pide orientación sobre el trámite de objeciones. Se sabe que el proyecto fue recibido en el despacho del alcalde el mismo día en que el Concejo lo remitió.", "items": [{"id": "ET-107", "niv": 2, "e": "Para devolver el proyecto con objeciones, el alcalde dispone de un término de", "f": "Ley 136 de 1994, art. 78", "o": [["A", "cinco días.", "Ese término aplica a proyectos de no más de veinte artículos (art. 78 de la Ley 136 de 1994). Este tiene 35.", false], ["B", "diez días.", "El art. 78 de la Ley 136 de 1994 otorga diez días cuando el proyecto tiene entre veintiuno y cincuenta artículos, como este de 35.", true], ["C", "veinte días.", "Hasta veinte días se conceden solo cuando el proyecto excede cincuenta artículos (art. 78 de la Ley 136 de 1994).", false]]}, {"id": "ET-108", "niv": 3, "e": "Si la plenaria del Concejo rechaza las objeciones por inconveniencia, lo que procede es que", "f": "Ley 136 de 1994, art. 79 (subrogado por el art. 4 de la Ley 177 de 1994)", "o": [["A", "el alcalde lo sancione en un término no mayor de ocho días y, si no lo hace, lo sancione y publique el presidente del Concejo.", "El art. 79 de la Ley 136 de 1994 (subrogado por el art. 4 de la Ley 177 de 1994) obliga al alcalde a sancionar en máximo ocho días cuando se rechazan las objeciones por inconveniencia; si no lo hace, sanciona y publica el presidente de la corporación.", true], ["B", "el alcalde envíe el proyecto al Tribunal Administrativo para que decida sobre su conveniencia.", "El Tribunal solo conoce de las objeciones de derecho (art. 80 de la Ley 136 de 1994); la conveniencia la define el Concejo.", false], ["C", "el alcalde pueda formular nuevas objeciones por inconveniencia sobre los mismos artículos, por una sola vez.", "La ley no permite reiterar objeciones por inconveniencia ya rechazadas; impone el deber de sancionar.", false]]}, {"id": "ET-109", "niv": 3, "e": "Si el Concejo no acoge las objeciones por ilegalidad, el alcalde debe", "f": "Ley 136 de 1994, art. 80", "o": [["A", "sancionarlo y luego demandarlo en acción de nulidad ante el juez administrativo.", "La ley prevé un trámite específico previo a la sanción: el envío al Tribunal Administrativo, que decide si las objeciones son fundadas.", false], ["B", "remitir el proyecto al gobernador, quien decidirá si lo envía al Tribunal Administrativo.", "La revisión del gobernador opera sobre acuerdos ya sancionados (art. 82 de la Ley 136 de 1994); las objeciones de derecho no acogidas van directamente al Tribunal.", false], ["C", "enviarlo, dentro de los diez días siguientes, al Tribunal Administrativo con una exposición de motivos de las objeciones.", "El art. 80 de la Ley 136 de 1994 dispone que, si las objeciones jurídicas no son acogidas, el alcalde envía el proyecto al Tribunal Administrativo dentro de los diez días siguientes, con exposición de motivos.", true]]}]}, {"comp": "entidades_territoriales", "rol": "tecnico", "tag": "Entidades territoriales, Bogotá D.C. y CAR · Nivel técnico · Revisión de actos municipales por el gobernador", "texto": "Usted es técnico administrativo del despacho del alcalde de un municipio de cuarta categoría de Santander. El alcalde sancionó el lunes un acuerdo que modifica el estatuto de rentas y, ese mismo día, expidió un decreto de carácter general que reglamenta la publicidad exterior visual. La secretaria de despacho le pide encargarse del envío de estos actos a la gobernación y responder dudas de los comerciantes, que preguntan si el acuerdo «queda en suspenso» mientras el departamento lo revisa.", "items": [{"id": "ET-110", "niv": 1, "e": "En cuanto al envío de los actos a la gobernación, usted debe tener en cuenta que", "f": "Ley 136 de 1994, art. 82, y art. 91, lit. a), num. 7 (modificado por el art. 29 de la Ley 1551 de 2012)", "o": [["A", "el acuerdo y el decreto de carácter general deben enviarse al gobernador dentro de los cinco días siguientes a su sanción o expedición.", "El art. 91, literal a), numeral 7 de la Ley 136 de 1994 (modificado por la Ley 1551 de 2012) y el art. 82 de la misma ley exigen enviar al gobernador, dentro de los cinco días siguientes, los acuerdos sancionados y los decretos de carácter general.", true], ["B", "los actos solo se envían si el gobernador los solicita por escrito en ejercicio de su función de tutela.", "El envío de acuerdos y decretos generales es un deber del alcalde; solo los actos de carácter particular se envían cuando el gobernador los solicita.", false], ["C", "solo el acuerdo debe enviarse, dentro de los diez días siguientes a su publicación en la gaceta municipal, junto con su exposición de motivos.", "El término es de cinco días y, además del acuerdo, deben enviarse los decretos de carácter general que expida el alcalde (art. 91, lit. a, num. 7 de la Ley 136 de 1994).", false]]}, {"id": "ET-111", "niv": 2, "e": "A los comerciantes que preguntan por los efectos del acuerdo mientras se revisa, usted les responde que", "f": "Ley 136 de 1994, art. 82", "o": [["A", "el acuerdo produce efectos, porque la revisión del gobernador no los suspende.", "El art. 82 de la Ley 136 de 1994 señala expresamente que la revisión por parte del gobernador no suspende los efectos de los acuerdos.", true], ["B", "el acuerdo solo rige cuando el gobernador emita concepto favorable.", "El concepto del gobernador no es requisito de vigencia; el acuerdo rige conforme a su publicación y la revisión no suspende sus efectos.", false], ["C", "el acuerdo queda suspendido hasta que venza el término que tiene el gobernador para revisarlo.", "La ley dispone lo contrario: la revisión no suspende los efectos del acuerdo (art. 82 de la Ley 136 de 1994).", false]]}, {"id": "ET-112", "niv": 2, "e": "Si al revisar el acuerdo el gobernador encuentra que es contrario a la ley, la actuación que le corresponde es", "f": "Constitución Política, art. 305, num. 10; Ley 136 de 1994, art. 82", "o": [["A", "devolverlo al Concejo para que lo modifique dentro de las siguientes sesiones ordinarias.", "La Constitución no prevé la devolución al Concejo; la decisión sobre la validez corresponde al Tribunal.", false], ["B", "enviarlo al Tribunal Administrativo competente para que decida sobre su validez.", "El art. 305, numeral 10 de la Constitución asigna al gobernador revisar los actos de concejos y alcaldes y, por motivos de inconstitucionalidad o ilegalidad, remitirlos al Tribunal competente para que decida sobre su validez.", true], ["C", "revocarlo mediante decreto departamental y ordenar al alcalde que lo publique.", "El gobernador no tiene competencia para revocar acuerdos municipales; su función es de revisión y remisión al juez.", false]]}]}, {"comp": "entidades_territoriales", "rol": "general", "tag": "Entidades territoriales, Bogotá D.C. y CAR · Funciones del alcalde", "texto": "Usted es profesional de la Secretaría de Gobierno de un municipio de tercera categoría del Huila. Se acercan las fiestas patronales y la Policía reporta riñas asociadas al consumo de licor en el parque principal. El alcalde, que además prepara su informe de gestión al Concejo, le pide revisar qué medidas puede adoptar y si puede encargar a la secretaria de Gobierno algunas de sus funciones para atender la temporada.", "items": [{"id": "ET-113", "niv": 1, "e": "Para controlar las riñas durante las fiestas, el alcalde puede, como medida de orden público,", "f": "Ley 136 de 1994, arts. 84 y 91, lit. b), num. 2 (modificado por el art. 29 de la Ley 1551 de 2012)", "o": [["A", "tramitar un acuerdo ante el Concejo, porque esas restricciones son de reserva de la corporación.", "La restricción del expendio y consumo de bebidas embriagantes por razones de orden público es una medida que la ley atribuye directamente al alcalde.", false], ["B", "solicitar al gobernador que expida la medida, porque el orden público municipal le corresponde al departamento.", "El alcalde es la primera autoridad de policía del municipio y conserva el orden público en su jurisdicción (arts. 84 y 91 de la Ley 136 de 1994); no necesita que el gobernador expida la medida.", false], ["C", "restringir o prohibir el expendio y consumo de bebidas embriagantes, de conformidad con la ley.", "El art. 91, literal b), numeral 2 de la Ley 136 de 1994 (modificado por la Ley 1551 de 2012) faculta al alcalde para restringir o prohibir el expendio y consumo de bebidas embriagantes, entre otras medidas, para mantener o restablecer el orden público.", true]]}, {"id": "ET-114", "niv": 1, "e": "Sobre la posibilidad de que la secretaria de Gobierno ejerza algunas funciones del alcalde, usted le indica que", "f": "Ley 136 de 1994, art. 92 (modificado por el art. 30 de la Ley 1551 de 2012)", "o": [["A", "las funciones del alcalde son indelegables, por tratarse de un cargo de elección popular sujeto al voto programático del elegido.", "La ley sí permite la delegación de funciones del alcalde en sus secretarios, con la única excepción de las que tengan prohibición legal expresa.", false], ["B", "puede delegar en los secretarios de la alcaldía las funciones a su cargo, salvo aquellas que tengan prohibición legal expresa.", "El art. 92 de la Ley 136 de 1994 (modificado por el art. 30 de la Ley 1551 de 2012) permite delegar en secretarios y jefes de departamento administrativo las funciones del alcalde, excepto las que tengan prohibición legal expresa.", true], ["C", "la delegación solo procede con autorización previa del Concejo para cada función.", "El art. 92 de la Ley 136 de 1994 no exige autorización previa del Concejo para delegar en los secretarios; esa autorización se requiere para delegar en subalternos o JAL funciones distintas de las previstas en la ley (art. 32, num. 4).", false]]}, {"id": "ET-115", "niv": 2, "e": "Respecto del informe de gestión al Concejo, el alcalde debe presentar informes generales sobre su administración", "f": "Ley 136 de 1994, art. 91, lit. a), num. 4 (modificado por el art. 29 de la Ley 1551 de 2012)", "o": [["A", "solo cuando el Concejo lo cite a debate de control político.", "El alcalde no puede ser citado por el Concejo para declaraciones orales (art. 32, num. 2), y el informe general es un deber periódico, no una respuesta a citaciones.", false], ["B", "al terminar el último periodo de sesiones ordinarias del año, junto con el presupuesto.", "La norma ubica el informe general en la primera sesión ordinaria del año, no al final de la vigencia.", false], ["C", "en la primera sesión ordinaria de cada año.", "El art. 91, literal a), numeral 4 de la Ley 136 de 1994 (modificado por la Ley 1551 de 2012) ordena al alcalde presentar informes generales sobre su administración en la primera sesión ordinaria de cada año.", true]]}]}, {"comp": "entidades_territoriales", "rol": "profesional", "tag": "Entidades territoriales, Bogotá D.C. y CAR · Nivel profesional · Control político del concejo", "texto": "Usted es profesional de apoyo jurídico del Concejo de un municipio de primera categoría del Valle del Cauca. La bancada de oposición quiere adelantar un debate sobre los retrasos en la construcción del hospital municipal y pretende citar al secretario de Infraestructura y al alcalde. Además, un concejal amenazado, que por razones de seguridad no puede acudir al recinto, pidió participar de forma no presencial en las sesiones de la próxima semana, y la mesa directiva quiere saber qué trámite debe surtir el acto que lo autorice.", "items": [{"id": "ET-116", "niv": 1, "e": "Para citar al secretario de Infraestructura al debate, la proposición aprobada debe", "f": "Ley 136 de 1994, art. 38", "o": [["A", "notificarse con una anticipación no menor de cinco días hábiles y formularse en cuestionario escrito.", "El art. 38 de la Ley 136 de 1994 exige que las citaciones de control político se hagan con anticipación no menor de cinco días hábiles y en cuestionario escrito.", true], ["B", "enviarse por intermedio del alcalde, quien decide si autoriza la asistencia del secretario.", "La citación es una facultad propia del Concejo en ejercicio del control político; no depende de autorización del alcalde.", false], ["C", "notificarse con una anticipación no menor de tres días calendario, sin necesidad de cuestionario.", "El término es de cinco días hábiles y la ley exige expresamente el cuestionario escrito (art. 38 de la Ley 136 de 1994).", false]]}, {"id": "ET-117", "niv": 3, "e": "Frente a la intención de citar también al alcalde para que rinda declaraciones orales en el debate, usted debe advertir que", "f": "Ley 136 de 1994, art. 32, num. 2 (modificado por el art. 18 de la Ley 1551 de 2012)", "o": [["A", "es procedente, siempre que la proposición de citación se apruebe por la mayoría absoluta de los miembros y se notifique con cinco días hábiles.", "No es un problema de mayorías: la ley excluye al alcalde del grupo de servidores que el Concejo puede citar para declaraciones orales.", false], ["B", "no es procedente, porque la ley permite citar a los funcionarios municipales para declaraciones orales, con excepción del alcalde.", "El art. 32, numeral 2 de la Ley 136 de 1994 (modificado por el art. 18 de la Ley 1551 de 2012) faculta al Concejo para citar a secretarios y demás funcionarios municipales, excepto el alcalde, para declaraciones orales.", true], ["C", "es procedente solo si se trata de un debate de moción de censura contra el alcalde.", "La moción de censura procede respecto de secretarios del despacho, no del alcalde; y la ley excluye al alcalde de las citaciones para declaraciones orales.", false]]}, {"id": "ET-118", "niv": 2, "e": "Sobre el acto que autorice la participación no presencial del concejal, la mesa directiva debe", "f": "Ley 136 de 1994, art. 23 (inciso adicionado por el art. 15 de la Ley 1551 de 2012)", "o": [["A", "remitirlo al gobernador dentro de los cinco días siguientes, para su revisión de legalidad.", "La remisión al gobernador aplica a acuerdos y decretos generales del alcalde; para los actos que autorizan sesiones no presenciales la ley ordena comunicarlos al personero.", false], ["B", "publicarlo en la gaceta del Concejo, sin que deba informarse a ninguna otra autoridad.", "La Ley 1551 de 2012 exige comunicar estos actos al personero, que actúa como veedor del uso de los medios tecnológicos.", false], ["C", "comunicarlo al personero del municipio dentro de los dos días siguientes a su expedición.", "El inciso adicionado al art. 23 de la Ley 136 de 1994 por el art. 15 de la Ley 1551 de 2012 dispone que estos actos se comuniquen al personero dentro de los dos días siguientes, pues este verifica el uso proporcional y justificado de los medios tecnológicos.", true]]}, {"id": "ET-119", "niv": 3, "e": "Si el debate concluye que el Concejo debe regular por primera vez una materia normativa municipal que la ley no asignó expresamente ni al alcalde ni al Concejo, esa competencia se entiende atribuida", "f": "Ley 136 de 1994, art. 32, parágrafo 2 (modificado por el art. 18 de la Ley 1551 de 2012)", "o": [["A", "al Concejo, siempre que no contraríe la Constitución y la ley.", "El parágrafo 2 del art. 32 de la Ley 136 de 1994 (modificado por la Ley 1551 de 2012) establece que las funciones normativas del municipio sin asignación expresa se entienden atribuidas a los concejos, siempre que no se contraríen la Constitución y la ley.", true], ["B", "al alcalde, como jefe de la administración local y titular de la potestad reglamentaria.", "La potestad reglamentaria del alcalde sirve para ejecutar acuerdos; la cláusula residual de funciones normativas favorece al Concejo.", false], ["C", "al gobernador, por el principio de subsidiariedad entre niveles territoriales.", "La subsidiariedad no traslada al departamento funciones normativas municipales sin asignación; la ley resuelve el vacío a favor del Concejo.", false]]}]}, {"comp": "entidades_territoriales", "rol": "general", "tag": "Entidades territoriales, Bogotá D.C. y CAR · Juntas administradoras locales", "texto": "Usted es auxiliar administrativo de la Secretaría de Planeación de un municipio de primera categoría del Meta dividido en comunas y corregimientos. La Junta Administradora Local (JAL) de la Comuna 4 radicó varias solicitudes: quiere presentar al Concejo un proyecto de acuerdo sobre ferias comunitarias, pide información sobre las partidas presupuestales para la comuna antes de que el alcalde radique el presupuesto y pregunta cuántos cabildos abiertos debe celebrar.", "items": [{"id": "ET-120", "niv": 2, "e": "Sobre el proyecto de acuerdo de ferias comunitarias, usted informa a la JAL que", "f": "Ley 136 de 1994, art. 131, num. 1; Constitución Política, art. 318", "o": [["A", "no puede presentarlo, porque las JAL solo emiten conceptos y no tienen iniciativa normativa.", "Las JAL sí tienen iniciativa para presentar proyectos de acuerdo relacionados con sus funciones (art. 131, num. 1 de la Ley 136 de 1994).", false], ["B", "debe presentarlo por conducto del alcalde, único autorizado para radicar proyectos ante el Concejo.", "El alcalde no tiene iniciativa exclusiva en todos los asuntos; la ley reconoce iniciativa a las JAL en temas relacionados con sus funciones.", false], ["C", "puede presentarlo al Concejo municipal, siempre que se relacione con el objeto de sus funciones.", "El art. 131, numeral 1 de la Ley 136 de 1994 faculta a las JAL para presentar proyectos de acuerdo al Concejo relacionados con el objeto de sus funciones.", true]]}, {"id": "ET-121", "niv": 2, "e": "Frente a las partidas presupuestales de la comuna, a la JAL le corresponde", "f": "Ley 136 de 1994, art. 131, num. 8", "o": [["A", "esperar la aprobación del presupuesto por el Concejo y luego ejercer control político sobre su ejecución en la comuna, mediante citaciones a los secretarios del despacho municipal.", "La ley le asigna a la JAL una intervención previa (concepto) antes de que el proyecto llegue al Concejo, no solo un control posterior.", false], ["B", "rendir concepto sobre la conveniencia de las partidas antes de que el proyecto se presente al Concejo, para lo cual el alcalde debe suministrarle la información disponible.", "El art. 131, numeral 8 de la Ley 136 de 1994 asigna a las JAL rendir concepto sobre las partidas presupuestales antes de la presentación del proyecto al Concejo, y obliga al alcalde a brindar la información disponible.", true], ["C", "aprobar el presupuesto de la comuna una vez el Concejo apruebe el presupuesto general del municipio.", "En los municipios la JAL no aprueba el presupuesto; emite concepto previo sobre las partidas y distribuye partidas globales conforme al plan de desarrollo.", false]]}, {"id": "ET-122", "niv": 1, "e": "Sobre los cabildos abiertos, usted le indica a la JAL que debe celebrar", "f": "Ley 136 de 1994, art. 131, num. 12", "o": [["A", "al menos dos por periodo de sesiones.", "El art. 131, numeral 12 de la Ley 136 de 1994 ordena a las JAL celebrar al menos dos cabildos abiertos por periodo de sesiones.", true], ["B", "los que convoque el alcalde, pues la JAL no puede convocarlos por iniciativa propia.", "La ley impone a la propia JAL el deber de celebrar cabildos abiertos y de convocar audiencias públicas.", false], ["C", "uno al año, coincidiendo con la discusión del plan de desarrollo.", "La ley fija un mínimo mayor: al menos dos cabildos abiertos por cada periodo de sesiones.", false]]}]}, {"comp": "entidades_territoriales", "rol": "general", "tag": "Entidades territoriales, Bogotá D.C. y CAR · Asamblea departamental", "texto": "Usted es profesional universitario de la Secretaría General de la Asamblea de un departamento del Caribe colombiano. Corre el tercer año del periodo constitucional. En agosto, el gobernador necesita que la Asamblea apruebe con urgencia una autorización para comprometer vigencias futuras de un proyecto vial, y algunos diputados preguntan si en esas sesiones podrán también citar al secretario de Salud por la crisis hospitalaria. Además, la mesa directiva le pide aclarar quién debe aprobar el presupuesto departamental de la próxima vigencia.", "items": [{"id": "ET-123", "niv": 1, "e": "Sobre los periodos de sesiones ordinarias de la Asamblea en ese tercer año, usted informa que van", "f": "Ley 2200 de 2022, art. 23", "o": [["A", "de febrero, mayo, agosto y noviembre, por derecho propio y máximo una vez por día.", "Ese calendario corresponde a los concejos de municipios de tercera a sexta categoría (art. 23 de la Ley 136 de 1994), no a las asambleas departamentales.", false], ["B", "del 1 de marzo al 30 de abril, del 1 de junio al 30 de julio y del 1 de octubre al 30 de noviembre.", "El art. 23 de la Ley 2200 de 2022 fija, para el segundo, tercer y cuarto año, los periodos de 1 de marzo a 30 de abril, 1 de junio a 30 de julio y 1 de octubre a 30 de noviembre.", true], ["C", "del 1 de enero al último día de febrero, del 1 de junio al 30 de julio y del 1 de octubre al 30 de noviembre.", "El periodo de enero a febrero corresponde solo al primer año de sesiones; del segundo al cuarto año el primer periodo va del 1 de marzo al 30 de abril (art. 23 de la Ley 2200 de 2022).", false]]}, {"id": "ET-124", "niv": 2, "e": "Si el gobernador convoca a sesiones extraordinarias en agosto para tramitar la autorización de vigencias futuras, los diputados", "f": "Ley 2200 de 2022, art. 23", "o": [["A", "podrán ocuparse de los asuntos que el gobernador someta y, además, ejercer el control político propio de la corporación.", "El art. 23 de la Ley 2200 de 2022 limita las extraordinarias a los asuntos que el gobernador somete, pero deja a salvo la función de control político y los temas administrativos de la corporación.", true], ["B", "podrán tramitar cualquier proyecto de ordenanza, porque las extraordinarias amplían la agenda ordinaria.", "En las extraordinarias la asamblea solo puede ocuparse de los asuntos que el gobernador somete (además del control político y temas administrativos propios).", false], ["C", "solo podrán ocuparse de la autorización de vigencias futuras, sin adelantar debates de control político.", "La Ley 2200 de 2022 dejó expresamente a salvo el control político durante las sesiones extraordinarias.", false]]}, {"id": "ET-125", "niv": 1, "e": "En relación con el presupuesto departamental de la próxima vigencia, usted aclara que", "f": "Ley 2200 de 2022, art. 19, num. 32", "o": [["A", "lo expide el gobernador por decreto, y la Asamblea solo puede improbarlo dentro del mes siguiente.", "La expedición anual del presupuesto es función de la Asamblea; el gobernador presenta el proyecto (art. 19, num. 32 de la Ley 2200 de 2022).", false], ["B", "lo aprueba el Consejo Departamental de Política Fiscal, previo concepto de la Asamblea.", "Ningún consejo de política fiscal sustituye a la Asamblea en la expedición del presupuesto.", false], ["C", "lo expide la Asamblea departamental con base en el proyecto que le presente el gobernador.", "El art. 19, numeral 32 de la Ley 2200 de 2022 asigna a la Asamblea expedir anualmente el presupuesto de rentas y gastos, con base en el proyecto presentado por el gobernador.", true]]}]}, {"comp": "entidades_territoriales", "rol": "profesional", "tag": "Entidades territoriales, Bogotá D.C. y CAR · Nivel profesional · Sanción y objeción de ordenanzas", "texto": "Usted es profesional de la Oficina Jurídica de una gobernación de la región andina. La Asamblea aprobó una ordenanza de 64 artículos que expide el estatuto de participación ciudadana del departamento. El gobernador tiene reparos de conveniencia sobre el costo de algunas instancias y le pide un concepto sobre los plazos y efectos de una eventual objeción.", "items": [{"id": "ET-126", "niv": 2, "e": "Para devolver el proyecto con objeciones, el gobernador dispone de", "f": "Ley 2200 de 2022, art. 100", "o": [["A", "cinco días.", "Ese término aplica cuando el proyecto no tiene más de veinte artículos (art. 100 de la Ley 2200 de 2022).", false], ["B", "diez días.", "Diez días se otorgan para proyectos de veintiuno a cincuenta artículos; este tiene 64.", false], ["C", "hasta veinte días.", "El art. 100, numeral 3 de la Ley 2200 de 2022 otorga hasta veinte días cuando el proyecto tiene más de cincuenta artículos, como en este caso.", true]]}, {"id": "ET-127", "niv": 3, "e": "Si la Asamblea reconsidera el proyecto objetado por inconveniencia y lo aprueba por la mitad más uno de sus miembros, el gobernador", "f": "Ley 2200 de 2022, art. 100, parágrafo", "o": [["A", "debe sancionarlo y promulgarlo, sin poder presentar nuevas objeciones por inconveniencia.", "El parágrafo del art. 100 de la Ley 2200 de 2022 obliga al gobernador a sancionar, sin nuevas objeciones por inconveniencia, el proyecto reconsiderado y aprobado por la mitad más uno de los miembros.", true], ["B", "puede objetarlo de nuevo por inconveniencia, por una sola vez, si la votación no fue unánime.", "La ley no exige unanimidad: basta la mitad más uno de los miembros para que el gobernador quede obligado a sancionar sin nuevas objeciones por inconveniencia.", false], ["C", "puede enviarlo al Tribunal Administrativo para que decida definitivamente sobre su conveniencia.", "El juez administrativo decide sobre legalidad o constitucionalidad, no sobre conveniencia; aprobado por la mayoría exigida, el gobernador debe sancionar.", false]]}, {"id": "ET-128", "niv": 3, "e": "Si vence el término legal sin que el gobernador devuelva el proyecto con objeciones y aun así no lo sanciona, la consecuencia es que", "f": "Ley 2200 de 2022, art. 100", "o": [["A", "el proyecto queda sancionado tácitamente, sin necesidad de ningún acto adicional de publicación.", "La ley no consagra una sanción tácita automática; asigna al presidente de la Asamblea el deber de sancionarlo y publicarlo.", false], ["B", "el presidente de la Asamblea departamental procede a sancionarlo y publicarlo como ordenanza.", "El art. 100 de la Ley 2200 de 2022 dispone que, vencidos los términos sin objeciones, el gobernador debe sancionar y promulgar; si no lo hace, el presidente de la corporación lo sanciona y publica.", true], ["C", "el proyecto se archiva y debe presentarse de nuevo en el siguiente periodo de sesiones.", "El silencio del gobernador no archiva el proyecto; la ley prevé que debe sancionarse y, en su defecto, lo sanciona el presidente de la Asamblea.", false]]}]}, {"comp": "entidades_territoriales", "rol": "profesional", "tag": "Entidades territoriales, Bogotá D.C. y CAR · Nivel profesional · Funciones del gobernador", "texto": "Usted es profesional especializado de la Secretaría de Planeación de un departamento de la Orinoquía. El gobernador presentó en debida forma el proyecto de plan de desarrollo departamental, pero la Asamblea no lo aprobó dentro de los términos legales. Al mismo tiempo, el contralor departamental presentó su renuncia mientras la Asamblea está en receso, y el secretario de Gobierno pregunta si el gobernador puede delegarle la celebración de ciertos convenios con municipios.", "items": [{"id": "ET-129", "niv": 2, "e": "Frente a la falta de aprobación del plan de desarrollo, el gobernador puede", "f": "Ley 2200 de 2022, art. 119, num. 9", "o": [["A", "ejecutar el plan del gobierno anterior hasta que la Asamblea apruebe el nuevo.", "La ley no ordena continuar el plan anterior; da al gobernador la facultad de adoptar el nuevo plan por decreto.", false], ["B", "convocar a la Asamblea a sesiones extraordinarias indefinidas hasta que apruebe el plan presentado.", "Las extraordinarias tienen un límite de tres meses al año y no son el mecanismo previsto para este supuesto; la ley prevé la adopción por decreto.", false], ["C", "adoptarlo mediante decreto, pues fue presentado en debida forma y no se aprobó en los términos de ley.", "El art. 119, numeral 9 de la Ley 2200 de 2022 faculta al gobernador para adoptar por decreto el plan de desarrollo departamental cuando, presentado en debida forma, no es aprobado por la Asamblea en los términos de ley.", true]]}, {"id": "ET-130", "niv": 2, "e": "Sobre la renuncia del contralor departamental presentada durante el receso de la Asamblea, la decisión corresponde a", "f": "Ley 2200 de 2022, arts. 19, num. 9, y 119, num. 13", "o": [["A", "el gobernador, porque la Asamblea se encuentra en receso y la ley le asigna expresamente esa decisión.", "El art. 119, numeral 13 de la Ley 2200 de 2022 asigna al gobernador aceptar la renuncia del contralor cuando la Asamblea está en receso.", true], ["B", "la Contraloría General de la República, que ejerce control prevalente sobre las contralorías territoriales.", "La Contraloría General no acepta renuncias de contralores territoriales; ese acto corresponde a la Asamblea o, en receso, al gobernador.", false], ["C", "la mesa directiva de la Asamblea, que actúa en nombre de la corporación durante el receso.", "La ley atribuye expresamente esta función al gobernador cuando la Asamblea está en receso (art. 119, num. 13 de la Ley 2200 de 2022).", false]]}, {"id": "ET-131", "niv": 1, "e": "Respecto de la delegación solicitada por el secretario de Gobierno, usted le explica que el gobernador", "f": "Ley 2200 de 2022, art. 120", "o": [["A", "necesita una ordenanza que autorice previamente cada delegación, porque se trata de convenios con los municipios.", "La Ley 2200 de 2022 no condiciona la delegación en secretarios a una ordenanza específica; la delegación de la contratación se sujeta además a las normas generales (Leyes 80 de 1993 y 489 de 1998).", false], ["B", "puede delegarle funciones a su cargo, salvo aquellas respecto de las cuales exista prohibición legal expresa.", "El art. 120 de la Ley 2200 de 2022 permite al gobernador delegar en secretarios y jefes de departamento administrativo sus funciones, excepto las que tengan prohibición legal expresa.", true], ["C", "solo puede delegar en los alcaldes, que son agentes del departamento para ejecutar convenios.", "La ley prevé la delegación en los secretarios del departamento y jefes de departamento administrativo; los alcaldes no son agentes del gobernador para estos efectos.", false]]}]}, {"comp": "entidades_territoriales", "rol": "profesional", "tag": "Entidades territoriales, Bogotá D.C. y CAR · Nivel profesional · Concejo de Bogotá y alcalde mayor", "texto": "Usted es profesional de la Secretaría Jurídica Distrital de Bogotá. Un grupo de concejales radicó un proyecto de acuerdo que modifica la estructura general de la administración central y crea una nueva secretaría. Paralelamente, el Concejo aprobó una proposición para citar a la secretaria de Movilidad a un debate de control político, y el alcalde mayor estudia delegar en los alcaldes locales algunas funciones de control de espacio público.", "items": [{"id": "ET-132", "niv": 3, "e": "Sobre el proyecto de los concejales que modifica la estructura de la administración central, usted conceptúa que", "f": "Decreto Ley 1421 de 1993, arts. 12, num. 8, 13 y 55", "o": [["A", "es válido si lo firman al menos la tercera parte de los concejales, por tratarse de una reforma administrativa.", "No existe un umbral de firmas que supla la iniciativa del alcalde; se trata de una reserva de iniciativa.", false], ["B", "tiene un vicio de iniciativa, porque los acuerdos sobre la estructura de la administración solo pueden dictarse a iniciativa del alcalde.", "El art. 13 del Decreto Ley 1421 de 1993 dispone que los acuerdos del ordinal 8 del art. 12 (estructura de la administración central) solo pueden dictarse o reformarse a iniciativa del alcalde; el art. 55 reitera que la creación de secretarías es a iniciativa del alcalde mayor.", true], ["C", "es válido, porque el Concejo es la suprema autoridad del Distrito y puede tramitar por iniciativa propia cualquier proyecto de acuerdo, sin restricción alguna.", "Aunque el Concejo es la suprema autoridad del Distrito (art. 8), el art. 13 del Decreto Ley 1421 de 1993 reserva al alcalde la iniciativa en estas materias.", false]]}, {"id": "ET-133", "niv": 1, "e": "Para la citación de la secretaria de Movilidad, la mesa directiva debe", "f": "Decreto Ley 1421 de 1993, art. 14", "o": [["A", "hacerla con una anticipación no menor de cinco días hábiles y en cuestionario escrito.", "El art. 14 del Decreto Ley 1421 de 1993 exige que las citaciones de control político se hagan con anticipación no menor de cinco días hábiles y se formulen en cuestionario escrito.", true], ["B", "enviarla a la Personería Distrital, que es la que convoca a los secretarios a rendir cuentas.", "El control político corresponde al Concejo, que cita directamente a los secretarios (art. 14 del Decreto Ley 1421 de 1993).", false], ["C", "hacerla con una anticipación no menor de diez días hábiles, previa autorización del alcalde mayor.", "El término es de cinco días hábiles y la citación no requiere autorización del alcalde mayor.", false]]}, {"id": "ET-134", "niv": 2, "e": "Sobre la delegación de funciones en los alcaldes locales, usted conceptúa que el alcalde mayor", "f": "Decreto Ley 1421 de 1993, art. 40", "o": [["A", "no puede hacerlo, porque las funciones de los alcaldes locales solo las asigna el Concejo Distrital.", "El Concejo distribuye competencias (art. 63), pero el alcalde mayor también puede delegar sus funciones en los alcaldes locales (art. 40).", false], ["B", "solo puede delegar en secretarios de despacho, que a su vez pueden subdelegar en los alcaldes locales.", "El art. 40 del Decreto Ley 1421 de 1993 permite la delegación directa en los alcaldes locales, sin exigir una subdelegación.", false], ["C", "puede delegar en ellos, directamente, las funciones que le asignan la ley y los acuerdos distritales.", "El art. 40 del Decreto Ley 1421 de 1993 autoriza al alcalde mayor para delegar las funciones que le asignan la ley y los acuerdos en secretarios, jefes de departamento administrativo, gerentes, JAL y alcaldes locales, entre otros.", true]]}]}, {"comp": "entidades_territoriales", "rol": "general", "tag": "Entidades territoriales, Bogotá D.C. y CAR · Localidades de Bogotá", "texto": "Usted es técnico de la Alcaldía Local de una localidad del sur de Bogotá. Se inicia un nuevo periodo y la Junta Administradora Local (JAL) prepara la designación del alcalde local. Además, la JAL debe aprobar el presupuesto del Fondo de Desarrollo Local para la siguiente vigencia, y la semana pasada el alcalde local sancionó un acuerdo local sobre el uso temporal del espacio público para mercados campesinos.", "items": [{"id": "ET-135", "niv": 1, "e": "Sobre la designación del alcalde local, usted explica que", "f": "Decreto Ley 1421 de 1993, art. 84", "o": [["A", "lo nombra el alcalde mayor de una terna elaborada por la JAL.", "El art. 84 del Decreto Ley 1421 de 1993 establece que los alcaldes locales son nombrados por el alcalde mayor de terna elaborada por la respectiva junta administradora.", true], ["B", "lo elige la JAL por mayoría absoluta de sus miembros, para un periodo igual al de los ediles.", "La JAL no elige al alcalde local: integra una terna y el nombramiento lo hace el alcalde mayor (art. 84 del Decreto Ley 1421 de 1993).", false], ["C", "lo elige la ciudadanía de la localidad en las elecciones de autoridades territoriales.", "Los alcaldes locales no son de elección popular; los elegidos popularmente son los ediles.", false]]}, {"id": "ET-136", "niv": 2, "e": "Para aprobar el presupuesto anual del Fondo de Desarrollo Local, la JAL debe contar con", "f": "Decreto Ley 1421 de 1993, art. 69, num. 4 (modificado por el art. 8 de la Ley 2116 de 2021)", "o": [["A", "la aprobación previa del Concejo de Bogotá, que incorpora los presupuestos locales al distrital.", "La aprobación del presupuesto del fondo de desarrollo local corresponde a la JAL; el requisito previo es el concepto favorable del CONFIS, no una aprobación del Concejo.", false], ["B", "el visto bueno de la Contraloría Distrital sobre la viabilidad de los proyectos de inversión.", "La Contraloría ejerce control fiscal posterior; la norma exige concepto previo del Consejo Distrital de Política Económica y Fiscal.", false], ["C", "concepto previo favorable del Consejo Distrital de Política Económica y Fiscal (CONFIS).", "El art. 69, numeral 4 del Decreto Ley 1421 de 1993 (modificado por la Ley 2116 de 2021) asigna a la JAL aprobar el presupuesto del fondo, previo concepto favorable del CONFIS y conforme al plan de desarrollo local.", true]]}, {"id": "ET-137", "niv": 2, "e": "Respecto del acuerdo local sancionado, el alcalde local debe", "f": "Decreto Ley 1421 de 1993, art. 83", "o": [["A", "enviarlo al gobernador de Cundinamarca dentro de los cinco días siguientes a la sanción, como ocurre con los acuerdos de los municipios del departamento.", "Los acuerdos locales de Bogotá los revisa el alcalde mayor, no el gobernador de Cundinamarca.", false], ["B", "enviar copia al alcalde mayor dentro de los tres días siguientes a la sanción, para su revisión jurídica, sin que esta suspenda sus efectos.", "El art. 83 del Decreto Ley 1421 de 1993 ordena enviar copia del acuerdo local al alcalde mayor dentro de los tres días siguientes a la sanción; la revisión no suspende sus efectos.", true], ["C", "abstenerse de aplicarlo hasta que el alcalde mayor emita concepto favorable de legalidad.", "La revisión jurídica del alcalde mayor no suspende los efectos del acuerdo local (art. 83 del Decreto Ley 1421 de 1993).", false]]}]}, {"comp": "entidades_territoriales", "rol": "tecnico", "tag": "Entidades territoriales, Bogotá D.C. y CAR · Nivel técnico · Control de las JAL de Bogotá", "texto": "Usted es técnico de la secretaría de la JAL de una localidad de Bogotá. La JAL aprobó citar al alcalde local para hacer seguimiento a la inversión del Fondo de Desarrollo Local; es la primera vez que lo cita en el semestre. La citación, con el cuestionario escrito, fue recibida en el despacho del alcalde local el jueves 4 de marzo de 2027 y la sesión se programó para el viernes 12 de marzo de 2027. No hay días festivos entre el 4 y el 12 de marzo de 2027.", "items": [{"id": "ET-138", "niv": 1, "e": "Sobre la frecuencia con la que la JAL puede citar al alcalde local, usted informa que puede hacerlo", "f": "Decreto Ley 1421 de 1993, art. 69, num. 14 (modificado por el art. 8 de la Ley 2116 de 2021)", "o": [["A", "las veces que apruebe la plenaria, sin límite.", "La ley sí fija un límite: una citación cada seis meses.", false], ["B", "una vez cada seis meses.", "El art. 69, numeral 14 del Decreto Ley 1421 de 1993 (modificado por la Ley 2116 de 2021) permite a las JAL citar al alcalde local una vez cada seis meses.", true], ["C", "una vez al mes, en cada periodo de sesiones ordinarias.", "La norma fija una periodicidad menor: una vez cada seis meses (art. 69, num. 14 del Decreto Ley 1421 de 1993).", false]]}, {"id": "ET-139", "niv": 3, "e": "Respecto de la anticipación con la que se entregó el cuestionario, usted concluye que", "f": "Decreto Ley 1421 de 1993, art. 69, num. 14 (modificado por el art. 8 de la Ley 2116 de 2021)", "o": [["A", "cumple, porque entre el recibo y la sesión median cinco días hábiles completos, que es la anticipación mínima exigida.", "El art. 69, num. 14 del Decreto Ley 1421 de 1993 exige que los cuestionarios se hagan con anticipación no menor de cinco días hábiles. Entre el recibo (jueves 4) y la sesión (viernes 12) transcurren cinco días hábiles completos: 5, 8, 9, 10 y 11 de marzo de 2027.", true], ["B", "es insuficiente, porque el cuestionario debía entregarse con no menos de diez días hábiles.", "El término exigido es de cinco días hábiles, no de diez.", false], ["C", "no aplica ningún término, porque el alcalde local está obligado a asistir cuando la JAL lo cite.", "La ley sí regula la anticipación del cuestionario: no menor de cinco días hábiles.", false]]}, {"id": "ET-140", "niv": 3, "e": "El alcalde local debe radicar en la secretaría de la JAL la respuesta escrita al cuestionario a más tardar el", "f": "Decreto Ley 1421 de 1993, art. 69, num. 14 (modificado por el art. 8 de la Ley 2116 de 2021)", "o": [["A", "lunes 8 de marzo de 2027.", "Corresponde al segundo día hábil siguiente al recibo. La norma da hasta el tercer día hábil.", false], ["B", "martes 9 de marzo de 2027.", "El art. 69, num. 14 del Decreto Ley 1421 de 1993 ordena radicar la respuesta dentro del tercer día hábil siguiente al recibo de la citación. Recibida el jueves 4, los días hábiles siguientes son viernes 5 (1), lunes 8 (2) y martes 9 (3).", true], ["C", "jueves 11 de marzo de 2027.", "Corresponde al quinto día hábil siguiente al recibo. La respuesta debía radicarse dentro del tercer día hábil.", false]]}]}, {"comp": "entidades_territoriales", "rol": "general", "tag": "Entidades territoriales, Bogotá D.C. y CAR · Estructura administrativa de Bogotá (Acuerdo 257 de 2006)", "texto": "Usted ingresó como profesional universitario al Departamento Administrativo del Servicio Civil Distrital (DASCD) y participa en la inducción de nuevos servidores. Debe explicar cómo está organizada la administración distrital, qué es un sector administrativo de coordinación y qué instancia articula las entidades de cada sector. Varios asistentes trabajan en establecimientos públicos adscritos a secretarías y en alcaldías locales.", "items": [{"id": "ET-141", "niv": 1, "e": "Al explicar la estructura administrativa del Distrito, usted señala que comprende", "f": "Acuerdo 257 de 2006 del Concejo de Bogotá, art. 21", "o": [["A", "el nivel nacional, el nivel departamental de Cundinamarca y el nivel distrital.", "Esa no es la estructura de la administración distrital; Bogotá tiene régimen especial y su administración se organiza en tres sectores propios.", false], ["B", "las secretarías de despacho y las empresas de servicios públicos, que son las únicas entidades con autonomía.", "La estructura incluye también departamentos administrativos, unidades administrativas especiales, establecimientos públicos y las localidades, entre otros.", false], ["C", "el sector central, el sector descentralizado funcionalmente o por servicios y el sector de las localidades.", "El art. 21 del Acuerdo 257 de 2006 establece que la estructura administrativa de Bogotá comprende el sector central, el sector descentralizado funcionalmente o por servicios y el sector de las localidades.", true]]}, {"id": "ET-142", "niv": 2, "e": "Un sector administrativo de coordinación está conformado por", "f": "Acuerdo 257 de 2006 del Concejo de Bogotá, art. 36", "o": [["A", "las secretarías y departamentos administrativos y las entidades descentralizadas adscritas o vinculadas a una secretaría cabeza de sector.", "El art. 36 del Acuerdo 257 de 2006 dispone que los sectores administrativos de coordinación se conforman por secretarías y departamentos administrativos y por las entidades descentralizadas adscritas o vinculadas a una secretaría cabeza de sector.", true], ["B", "los consejos superiores de la administración distrital y las comisiones intersectoriales que crea el alcalde mayor para coordinar la gestión de varios sectores.", "Esas son instancias del sistema de coordinación, no los integrantes de un sector administrativo.", false], ["C", "todas las entidades que tienen sede en una misma localidad, bajo la coordinación del alcalde local.", "La agrupación por territorio corresponde a las localidades; los sectores se organizan por áreas especializadas de la gestión.", false]]}, {"id": "ET-143", "niv": 2, "e": "La instancia que articula la formulación de políticas y el seguimiento dentro de cada sector, integrada por la cabeza del sector y los directivos de sus entidades, es", "f": "Acuerdo 257 de 2006 del Concejo de Bogotá, arts. 34, 37 y 38; reglamentación distrital del MIPG (Decreto 1499 de 2017)", "o": [["A", "el Consejo de Gobierno Distrital, presidido por el alcalde mayor e integrado por los secretarios cabeza de sector.", "El Consejo de Gobierno Distrital es la máxima instancia de formulación de políticas para toda la administración (art. 34), no la instancia propia de cada sector.", false], ["B", "la comisión intersectorial que el alcalde mayor cree para coordinar las entidades del respectivo sector.", "Las comisiones intersectoriales coordinan funciones que comprometen entidades de diferentes sectores (art. 38 del Acuerdo 257 de 2006).", false], ["C", "el Comité Sectorial de Gestión y Desempeño (antes llamado Comité Sectorial de Desarrollo Administrativo).", "El art. 37 del Acuerdo 257 de 2006 prevé en cada sector un comité integrado por la secretaría cabeza de sector y los directores o gerentes de sus entidades, que denominó Comité Sectorial de Desarrollo Administrativo; con la adopción del Modelo Integrado de Planeación y Gestión (Decreto 1499 de 2017) la reglamentación distrital lo denomina Comité Sectorial de Gestión y Desempeño.", true]]}]}, {"comp": "entidades_territoriales", "rol": "general", "tag": "Entidades territoriales, Bogotá D.C. y CAR · Corporaciones Autónomas Regionales: naturaleza y órganos", "texto": "Usted es profesional universitario de la Secretaría General de una corporación autónoma regional del Eje Cafetero. En la jornada de inducción, varios servidores nuevos preguntan cómo está gobernada la corporación, quién elige al director general y por cuánto tiempo, y qué órgano decide la ampliación de la planta de personal que propone la dirección para atender el aumento de solicitudes de permisos ambientales.", "items": [{"id": "ET-144", "niv": 1, "e": "Al explicar los órganos principales de dirección y administración de la corporación, usted señala que son", "f": "Ley 99 de 1993, arts. 23 y 24", "o": [["A", "el consejo directivo, el revisor fiscal y la oficina de control interno.", "El revisor fiscal y la oficina de control interno son instancias de control, no órganos principales de dirección y administración.", false], ["B", "el Ministerio de Ambiente, la junta de gobernadores y el director general.", "El Ministerio orienta la política ambiental, pero no es órgano de dirección de la CAR, y no existe una «junta de gobernadores» como órgano previsto en el art. 24.", false], ["C", "la asamblea corporativa, el consejo directivo y el director general.", "El art. 24 de la Ley 99 de 1993 señala como órganos principales de dirección y administración de las CAR la asamblea corporativa, el consejo directivo y el director general.", true]]}, {"id": "ET-145", "niv": 2, "e": "Sobre la designación del director general, usted precisa que lo designa", "f": "Ley 99 de 1993, art. 28 (modificado por el art. 1 de la Ley 1263 de 2008)", "o": [["A", "la asamblea corporativa, para un periodo de tres años, sin posibilidad de reelección.", "La designación corresponde al consejo directivo, el periodo es de cuatro años y la ley permite la reelección por una sola vez.", false], ["B", "el consejo directivo, para un periodo de cuatro años, y puede ser reelegido por una sola vez.", "El art. 28 de la Ley 99 de 1993 (modificado por el art. 1 de la Ley 1263 de 2008) dispone que el director general es designado por el consejo directivo para un periodo de cuatro años y puede ser reelegido por una sola vez.", true], ["C", "el Presidente de la República, de terna enviada por el consejo directivo, para un periodo de cuatro años.", "El director de una CAR no lo nombra el Presidente: lo designa el consejo directivo, en desarrollo de la autonomía de la corporación.", false]]}, {"id": "ET-146", "niv": 2, "e": "La decisión sobre la ampliación de la planta de personal propuesta por la dirección corresponde a", "f": "Ley 99 de 1993, arts. 25, 27, lit. b), y 29, nums. 3 y 8", "o": [["A", "el consejo directivo, a partir del proyecto que presente el director general.", "El art. 27, literal b) de la Ley 99 de 1993 asigna al consejo directivo determinar la planta de personal, y el art. 29, numeral 3 ordena al director presentarle los proyectos de planta.", true], ["B", "la asamblea corporativa, porque es el principal órgano de dirección de la corporación.", "Aunque es el principal órgano de dirección, sus funciones (elegir parte del consejo, aprobar informes y estatutos) no incluyen determinar la planta.", false], ["C", "el director general, porque nombra y remueve el personal de la corporación.", "Nombrar y remover el personal (art. 29, num. 8) es distinto de determinar la planta; el director presenta el proyecto, pero quien la determina es el consejo directivo.", false]]}]}, {"comp": "entidades_territoriales", "rol": "profesional", "tag": "Entidades territoriales, Bogotá D.C. y CAR · Nivel profesional · Funciones de las CAR", "texto": "Usted es profesional especializado de la Oficina Jurídica de una corporación autónoma regional de la costa Caribe. La dirección general estudia celebrar un convenio con una fundación ambiental sin ánimo de lucro para fortalecer la gestión en el territorio y pregunta si puede trasladarle, entre otras, la facultad de imponer sanciones por infracciones ambientales. Además, un alcalde de la jurisdicción solicita apoyo para incluir la educación ambiental en los colegios del municipio.", "items": [{"id": "ET-147", "niv": 2, "e": "Sobre trasladar a la fundación la facultad de imponer sanciones ambientales, usted conceptúa que", "f": "Ley 99 de 1993, art. 32", "o": [["A", "es viable si el consejo directivo aprueba la delegación y la fundación acredita idoneidad técnica.", "Aunque el consejo directivo puede delegar algunas funciones, la ley excluye expresamente la sancionatoria, sin importar la idoneidad de la entidad.", false], ["B", "no es viable, porque la ley permite delegar ciertas funciones, pero la sancionatoria es indelegable.", "El art. 32 de la Ley 99 de 1993 permite al consejo directivo delegar funciones en entes públicos o entidades privadas sin ánimo de lucro, siempre que no impliquen atribuciones de autoridad, y dispone que la facultad sancionatoria es indelegable.", true], ["C", "es viable, siempre que la CAR conserve la decisión de los recursos de reposición contra las sanciones.", "Reservarse los recursos no salva la delegación: la facultad sancionatoria misma es indelegable (art. 32 de la Ley 99 de 1993).", false]]}, {"id": "ET-148", "niv": 1, "e": "Para fundamentar el convenio, usted recuerda que en el área de su jurisdicción la corporación ejerce la función de", "f": "Ley 99 de 1993, arts. 23 y 31, num. 2", "o": [["A", "máxima autoridad ambiental, conforme a las normas superiores y las directrices del Ministerio.", "El art. 31, numeral 2 de la Ley 99 de 1993 atribuye a las CAR la función de máxima autoridad ambiental en el área de su jurisdicción, de acuerdo con las normas superiores y las directrices del Ministerio de Ambiente.", true], ["B", "autoridad ambiental subsidiaria, que actúa solo cuando los municipios no tienen capacidad técnica.", "La subsidiariedad describe el papel de las CAR frente a la gestión del riesgo (Ley 1523 de 2012), pero en materia ambiental la Ley 99 les asigna la máxima autoridad en su jurisdicción.", false], ["C", "órgano consultivo del gobernador en asuntos ambientales del departamento.", "Las CAR son entes autónomos (art. 23 de la Ley 99 de 1993) y no órganos consultivos del gobernador.", false]]}, {"id": "ET-149", "niv": 2, "e": "Frente a la solicitud del alcalde sobre educación ambiental, a la corporación le corresponde", "f": "Ley 99 de 1993, art. 31, num. 8", "o": [["A", "asumir directamente la educación ambiental formal en los colegios, porque es la autoridad ambiental del territorio.", "La CAR no presta el servicio educativo formal; su función es asesorar a las entidades territoriales en los planes de educación ambiental formal.", false], ["B", "abstenerse, porque la educación ambiental es competencia exclusiva del Ministerio de Educación y de las secretarías de educación.", "La Ley 99 de 1993 sí asigna a las CAR funciones en educación ambiental (art. 31, num. 8).", false], ["C", "asesorar al municipio en sus planes de educación ambiental formal y ejecutar programas de educación ambiental no formal.", "El art. 31, numeral 8 de la Ley 99 de 1993 asigna a las CAR asesorar a las entidades territoriales en planes de educación ambiental formal y ejecutar programas de educación ambiental no formal, conforme a la política nacional.", true]]}]}, {"comp": "entidades_territoriales", "rol": "tecnico", "tag": "Entidades territoriales, Bogotá D.C. y CAR · Nivel técnico · Concesión de aguas", "texto": "Usted es técnico operativo de la subdirección de recursos naturales de una corporación autónoma regional de Cundinamarca. Esta semana atiende tres solicitudes: una empresa avícola quiere instalar una bocatoma y una motobomba para tomar agua de una quebrada para su proceso productivo; un campesino pregunta si necesita trámite para que su ganado beba directamente en el río que pasa junto a su finca; y la empresa de servicios públicos del municipio pide concesión para el acueducto urbano.", "items": [{"id": "ET-150", "niv": 1, "e": "Frente a la empresa avícola, usted le informa que", "f": "Decreto 1076 de 2015, arts. 2.2.3.2.5.3 (modificado por el art. 2 del Decreto 875 de 2026) y 2.2.3.2.9.1", "o": [["A", "solo debe inscribirse en el registro de usuarios del recurso hídrico, sin necesidad de concesión.", "La sola inscripción no sustituye la concesión para un uso industrial con derivación (art. 2.2.3.2.9.1 del Decreto 1076 de 2015).", false], ["B", "debe solicitar concesión de aguas ante la corporación antes de derivar el agua.", "Los arts. 2.2.3.2.5.3 (modificado por el Decreto 875 de 2026) y 2.2.3.2.9.1 del Decreto 1076 de 2015 exigen concesión o permiso de la autoridad ambiental para usar aguas públicas con fines distintos de los que se ejercen por ministerio de la ley, como el uso industrial con derivación.", true], ["C", "puede usar el agua sin trámite, pues las aguas que discurren por cauces naturales son de uso público.", "Que las aguas sean de uso público no autoriza a derivarlas para un proceso productivo; el uso sin autorización se limita a los usos por ministerio de la ley.", false]]}, {"id": "ET-151", "niv": 2, "e": "Al campesino que pregunta por el abrevadero de su ganado directamente en el río, usted le responde que", "f": "Decreto 1076 de 2015, art. 2.2.3.2.6.1", "o": [["A", "debe tramitar concesión de aguas, porque todo uso pecuario requiere autorización de la corporación.", "No todo uso pecuario requiere concesión: abrevar animales en el cauce natural, sin derivación, es un uso por ministerio de la ley.", false], ["B", "debe pagar la tasa por utilización del agua y luego solicitar ante la corporación la legalización del uso que viene haciendo en su finca.", "La tasa excluye a quienes usan el agua por ministerio de la ley, y en este caso no hay nada que legalizar.", false], ["C", "no requiere concesión, porque abrevar animales en aguas que discurren por cauces naturales es un uso por ministerio de la ley.", "El art. 2.2.3.2.6.1 del Decreto 1076 de 2015 permite a todos los habitantes usar las aguas mientras discurran por cauces naturales para beber, bañarse, abrevar animales y lavar ropa, de acuerdo con las normas sanitarias y de protección de recursos.", true]]}, {"id": "ET-152", "niv": 3, "e": "Sobre el término de la concesión para el acueducto urbano, usted explica que", "f": "Decreto 1076 de 2015, art. 2.2.3.2.7.4", "o": [["A", "puede otorgarse por un periodo de hasta cincuenta años, por tratarse de la prestación de un servicio público.", "El art. 2.2.3.2.7.4 del Decreto 1076 de 2015 fija un término no mayor de diez años, salvo las concesiones destinadas a servicios públicos u obras de interés público o social, que pueden otorgarse hasta por cincuenta años.", true], ["B", "se otorga a término indefinido, mientras la empresa preste el servicio público domiciliario de acueducto en el municipio.", "No existen concesiones indefinidas: incluso las de servicios públicos tienen un tope de cincuenta años.", false], ["C", "no puede exceder de diez años, como cualquier otra concesión de aguas.", "El límite de diez años es la regla general, pero la norma exceptúa las concesiones destinadas a servicios públicos.", false]]}]}, {"comp": "entidades_territoriales", "rol": "profesional", "tag": "Entidades territoriales, Bogotá D.C. y CAR · Nivel profesional · Permiso de vertimientos", "texto": "Usted es profesional universitario del área de evaluación de una corporación autónoma regional de Boyacá. Una planta procesadora de lácteos vierte sus aguas residuales industriales a una quebrada y solicita la renovación de su permiso. Al revisar el expediente, usted nota que el permiso fue otorgado por el término máximo legal y está en su último año de vigencia. Además, otra empresa, que no tiene permiso de vertimientos, va a solicitar una concesión de agua de la misma quebrada para un proceso que generará aguas residuales que se verterán en ella.", "items": [{"id": "ET-153", "niv": 1, "e": "Al explicar a la empresa la vigencia máxima de un permiso de vertimientos, usted señala que es de", "f": "Decreto 1076 de 2015, art. 2.2.3.3.5.7", "o": [["A", "cinco años.", "La norma permite un término mayor: no superior a diez años (art. 2.2.3.3.5.7 del Decreto 1076 de 2015).", false], ["B", "diez años.", "El art. 2.2.3.3.5.7 del Decreto 1076 de 2015 dispone que el permiso de vertimiento se otorga por un término no mayor a diez años.", true], ["C", "veinte años.", "El tope legal es de diez años, no de veinte.", false]]}, {"id": "ET-154", "niv": 2, "e": "Sobre la oportunidad de la solicitud de renovación, usted indica que debía presentarse", "f": "Decreto 1076 de 2015, art. 2.2.3.3.5.10", "o": [["A", "dentro del primer trimestre del último año de vigencia del permiso.", "El art. 2.2.3.3.5.10 del Decreto 1076 de 2015 ordena presentar la solicitud de renovación dentro del primer trimestre del último año de vigencia del permiso, y tramitarla antes del vencimiento.", true], ["B", "después del vencimiento, una vez la corporación verifique la caracterización del vertimiento.", "La renovación debe pedirse y tramitarse antes del vencimiento; vencido el permiso, el vertimiento quedaría sin autorización.", false], ["C", "en cualquier momento antes del vencimiento, incluso el último día de vigencia.", "La norma fija una ventana específica: el primer trimestre del último año de vigencia.", false]]}, {"id": "ET-155", "niv": 3, "e": "Respecto de la otra empresa que solicitará la concesión para un proceso que generará aguas residuales, usted le indica que debe", "f": "Decreto 1076 de 2015, arts. 2.2.3.2.20.2 y 2.2.3.3.5.1; Ley 99 de 1993, art. 42", "o": [["A", "tramitar solo la concesión de aguas y pedir el permiso de vertimientos cuando empiece a verter.", "El permiso de vertimientos debe obtenerse antes de verter; cuando el uso del agua incorporará sustancias o desechos, la norma ordena tramitarlo junto con la solicitud de concesión.", false], ["B", "tramitar solo la concesión, porque el pago de la tasa retributiva por los vertimientos sustituye el permiso ante la corporación.", "La tasa retributiva (art. 42 de la Ley 99 de 1993) es un instrumento económico y no sustituye el permiso de vertimientos (art. 2.2.3.3.5.1 del Decreto 1076 de 2015).", false], ["C", "tramitar el permiso de vertimiento junto con la solicitud de concesión, porque el uso del agua incorporará sustancias o desechos.", "El art. 2.2.3.2.20.2 del Decreto 1076 de 2015 dispone que, si con el aprovechamiento de aguas se han de incorporar sustancias o desechos, se requiere permiso de vertimiento, que se tramita junto con la solicitud de concesión; el art. 2.2.3.3.5.1 exige el permiso a quien vierta a aguas superficiales.", true]]}]}, {"comp": "entidades_territoriales", "rol": "profesional", "tag": "Entidades territoriales, Bogotá D.C. y CAR · Nivel profesional · Licencia ambiental", "texto": "Usted es profesional especializado de la Subdirección de Gestión Ambiental de una corporación autónoma regional de la región andina. Un municipio de su jurisdicción tramita un proyecto que, según el reglamento, requiere licencia ambiental de competencia de la corporación. El estudio de impacto ambiental identifica la necesidad de captar agua de un río, hacer un aprovechamiento forestal y verter aguas residuales. Por otra parte, una empresa le pide a la corporación un permiso de aprovechamiento forestal para un tramo de una vía nacional cuya licencia es de competencia privativa de la Autoridad Nacional de Licencias Ambientales (ANLA).", "items": [{"id": "ET-156", "niv": 2, "e": "Frente a los permisos para captar agua, aprovechar el bosque y verter aguas residuales en el proyecto del municipio, usted explica que", "f": "Decreto 1076 de 2015, art. 2.2.2.3.1.3", "o": [["A", "deben tramitarse ante la ANLA, que es la única autoridad competente para permisos dentro de proyectos licenciados.", "El proyecto es de competencia de la CAR; la ANLA no tramita permisos de proyectos licenciados por otras autoridades.", false], ["B", "deben tramitarse como permisos separados, después de obtenida la licencia y antes del inicio de obras.", "La licencia ambiental incorpora los permisos, concesiones y autorizaciones necesarios; no se tramitan aparte.", false], ["C", "quedan comprendidos en la licencia ambiental, siempre que el estudio de impacto ambiental los identifique.", "El art. 2.2.2.3.1.3 del Decreto 1076 de 2015 dispone que la licencia lleva implícitos los permisos, autorizaciones y concesiones necesarios para el uso de recursos naturales, que deben identificarse claramente en el estudio de impacto ambiental.", true]]}, {"id": "ET-157", "niv": 1, "e": "En cuanto al momento en que el municipio debe contar con la licencia, usted precisa que debe obtenerse", "f": "Ley 99 de 1993, art. 49; Decreto 1076 de 2015, art. 2.2.2.3.1.3", "o": [["A", "antes de iniciar el proyecto, obra o actividad que la requiere.", "El art. 2.2.2.3.1.3 del Decreto 1076 de 2015 exige obtener la licencia ambiental previamente a la iniciación del proyecto, obra o actividad; el art. 49 de la Ley 99 de 1993 la hace obligatoria.", true], ["B", "durante la ejecución, antes de la etapa de operación.", "La licencia es previa: no puede obtenerse después de iniciadas las obras.", false], ["C", "al terminar las obras, junto con el acta de liquidación del contrato.", "La licencia no es un trámite posterior; debe obtenerse antes del inicio.", false]]}, {"id": "ET-158", "niv": 3, "e": "Sobre la solicitud de permiso de aprovechamiento forestal para el tramo de la vía nacional, la corporación debe", "f": "Decreto 1076 de 2015, art. 2.2.2.3.1.3, parágrafo", "o": [["A", "otorgarlo de forma provisional mientras la ANLA expide la licencia ambiental del proyecto vial, con cargo de informar a esa autoridad.", "No existe un permiso provisional para estos casos; la prohibición del parágrafo del art. 2.2.2.3.1.3 es expresa.", false], ["B", "abstenerse de otorgarlo, porque forma parte de un proyecto cuya licencia es de competencia privativa de la ANLA.", "El parágrafo del art. 2.2.2.3.1.3 del Decreto 1076 de 2015 prohíbe a las CAR otorgar permisos, concesiones o autorizaciones que formen parte de un proyecto cuya licencia ambiental sea de competencia privativa de la ANLA.", true], ["C", "otorgarlo, porque el aprovechamiento forestal es competencia de la CAR en el área de su jurisdicción.", "La regla general cede ante una norma especial: cuando el permiso forma parte de un proyecto de licencia privativa de la ANLA, la CAR no puede otorgarlo.", false]]}]}, {"comp": "entidades_territoriales", "rol": "tecnico", "tag": "Entidades territoriales, Bogotá D.C. y CAR · Nivel técnico · Aprovechamiento forestal", "texto": "Usted es técnico operativo de la oficina territorial de una corporación autónoma regional del Huila. Atiende tres solicitudes: una familia campesina quiere cortar algunos árboles de su finca para reparar su vivienda y pregunta si luego puede vender la madera sobrante; un propietario pide autorización para talar por una sola vez un bosque en un área donde los estudios técnicos muestran mejor aptitud de uso del suelo diferente al forestal; y un vecino solicita que se autorice talar unos árboles del predio colindante porque, según él, amenazan con caer sobre su casa.", "items": [{"id": "ET-159", "niv": 1, "e": "A la familia campesina, usted le explica que el aprovechamiento doméstico", "f": "Decreto 1076 de 2015, art. 2.2.1.1.3.1", "o": [["A", "es exclusivamente para satisfacer necesidades vitales domésticas y sus productos no pueden comercializarse.", "El art. 2.2.1.1.3.1, literal c) del Decreto 1076 de 2015 define los aprovechamientos domésticos como los que se efectúan exclusivamente para satisfacer necesidades vitales domésticas, sin que se puedan comercializar sus productos.", true], ["B", "permite vender la madera sobrante si se paga la tasa compensatoria correspondiente.", "El pago de tasas no habilita la comercialización: los productos del aprovechamiento doméstico no pueden venderse.", false], ["C", "permite vender la madera a otros campesinos de la misma vereda, siempre que se trate de pequeñas cantidades para uso familiar.", "La prohibición de comercializar no admite excepción por la cercanía del comprador.", false]]}, {"id": "ET-160", "niv": 2, "e": "La solicitud del propietario que quiere talar por una vez el bosque por la aptitud del suelo corresponde a un aprovechamiento", "f": "Decreto 1076 de 2015, art. 2.2.1.1.3.1", "o": [["A", "persistente, que lo obliga a conservar el rendimiento normal del bosque mediante técnicas silvícolas que permitan su renovación posterior.", "El persistente se hace con criterios de sostenibilidad y obligación de renovar el bosque; aquí se trata de una intervención por una sola vez por aptitud del suelo.", false], ["B", "doméstico, porque lo solicita el propietario del predio.", "La clase no depende de quién lo solicita, sino de su finalidad; el doméstico es solo para necesidades vitales domésticas.", false], ["C", "único, que puede incluir la obligación de dejar limpio el terreno, pero no la de renovar o conservar el bosque.", "El art. 2.2.1.1.3.1, literal a) del Decreto 1076 de 2015 define los aprovechamientos únicos como los que se hacen por una sola vez donde los estudios muestran mejor aptitud de uso diferente al forestal, y precisa que pueden incluir la obligación de dejar limpio el terreno, pero no la de renovar o conservar el bosque.", true]]}, {"id": "ET-161", "niv": 3, "e": "Frente a la solicitud del vecino sobre los árboles del predio colindante, la corporación debe", "f": "Decreto 1076 de 2015, art. 2.2.1.1.9.2", "o": [["A", "autorizar la tala de inmediato, porque se trata de una situación de riesgo que da trámite prioritario.", "El trámite prioritario aplica a la solicitud del propietario; cuando la presenta un tercero alegando daño o peligro, se requiere primero la decisión de la autoridad que resuelve el litigio.", false], ["B", "otorgar la autorización solo previa decisión de la autoridad competente para conocer el litigio entre los vecinos.", "El art. 2.2.1.1.9.2 del Decreto 1076 de 2015 dispone que, si la solicitud la presenta una persona distinta del propietario alegando daño o peligro por árboles de predios vecinos, solo se autoriza la tala previa decisión de la autoridad competente para conocer esa clase de litigios.", true], ["C", "rechazar la solicitud, porque solo el propietario puede pedir la tala de árboles ubicados en su predio.", "La norma no impone un rechazo de plano: admite la autorización, condicionada a la decisión previa de la autoridad que resuelve el conflicto.", false]]}]}, {"comp": "entidades_territoriales", "rol": "profesional", "tag": "Entidades territoriales, Bogotá D.C. y CAR · Nivel profesional · Tasas ambientales", "texto": "Usted es profesional universitario del grupo de instrumentos económicos de una corporación autónoma regional del Valle del Cauca. Al revisar la facturación, encuentra un usuario industrial que capta agua de un río sin concesión, y un vecino del sector que solo usa el agua para bañarse y lavar ropa directamente en el cauce. Además, una curtiembre vierte aguas residuales a la misma corriente. El director le pide un concepto sobre el cobro de tasas y el destino de lo recaudado en una cuenca que tiene Plan de Ordenación y Manejo (POMCA) adoptado.", "items": [{"id": "ET-162", "niv": 3, "e": "Respecto del usuario industrial que capta agua del río sin concesión, a la corporación le corresponde", "f": "Decreto 1076 de 2015, art. 2.2.3.2.5.3 (modificado por el art. 2 del Decreto 875 de 2026); Ley 1333 de 2009, arts. 1, 5, 13 y 18 (modificados por la Ley 2387 de 2024)", "o": [["A", "abstenerse de actuar hasta que el usuario presente voluntariamente la solicitud de concesión, pues la ley privilegia la legalización del uso del recurso.", "La autoridad ambiental actúa de oficio frente a las infracciones (arts. 13 y 18 de la Ley 1333 de 2009); no debe esperar a que el infractor solicite la concesión.", false], ["B", "cobrarle la tasa por utilización de aguas y entender que, con el pago, el uso queda legalizado hasta que tramite la concesión.", "El pago de una tasa no reemplaza la concesión: el uso de aguas públicas con derivación requiere concesión de la autoridad ambiental (art. 2.2.3.2.5.3 del Decreto 1076 de 2015), y ningún pago legaliza el uso sin ella.", false], ["C", "adelantar e
