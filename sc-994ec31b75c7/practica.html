gistra información, pero la consolida tarde y sin indicadores, lo que impide detectar a tiempo los convenios rezagados.", false], ["B", "actualizar cada semana una matriz con el avance físico y financiero de cada convenio, para detectar a tiempo los rezagos.", "Refleja la competencia «Orientación a resultados» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en cumplir las funciones y los compromisos de la organización con eficacia, calidad y oportunidad. Corresponde a diseñar y utilizar indicadores para medir los resultados y evaluar de forma regular el grado de consecución de los objetivos.", true], ["C", "esperar los informes de interventoría que envían los municipios y consolidar el avance cuando se reciban todos.", "Depende del ritmo de terceros y no evalúa regularmente el cumplimiento. La competencia pide medir y comprobar los resultados de forma periódica.", false]]}, {"id": "CO-130", "niv": 2, "e": "Ante la petición del alcalde, la conducta que mejor refleja la orientación a resultados es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Orientación a resultados)", "o": [["A", "registrar el avance real verificado e indicar en el informe lo pendiente y la fecha anunciada por el municipio.", "Refleja la competencia «Orientación a resultados» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en cumplir las funciones y los compromisos de la organización con eficacia, calidad y oportunidad. Refleja la conducta de aportar a los resultados enmarcando los productos dentro de las normas de la entidad: el informe es oportuno y veraz, y deja constancia de lo pendiente.", true], ["B", "abstenerse de entregar el informe de esa obra hasta que el municipio la termine en enero y entonces reportarla completa y ya recibida.", "Evita el conflicto, pero incumple la oportunidad del informe que le corresponde entregar y oculta información útil para la gobernación.", false], ["C", "registrar la obra como terminada con una observación sobre el 5 % pendiente, para no frenar la liquidación del convenio.", "Facilita la meta de liquidar, pero el informe dejaría de reflejar lo verificado. La competencia exige que los productos se enmarquen en las normas que rigen a la entidad.", false]]}]}, {"comp": "comportamental", "rol": "general", "tag": "Competencias comportamentales (Decreto 815 de 2018) · Orientación al usuario y al ciudadano", "texto": "Usted atiende el chat y el correo de la Secretaría de Tránsito de un municipio de primera categoría. Recibe a diario decenas de consultas: muchas están mal planteadas, y cerca del 40 % se refiere a cómo solicitar un acuerdo de pago de multas. Hoy un ciudadano le escribe preguntando si una fotodetección que recibió puede anularse porque, según él, la señal no era visible; usted no conoce el criterio que aplica la entidad en esos casos.", "items": [{"id": "CO-131", "niv": 1, "e": "Cuando una consulta llega mal planteada, la conducta que mejor refleja la orientación al usuario y al ciudadano es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Orientación al usuario y al ciudadano)", "o": [["A", "responderle con la información general de todos los trámites de la secretaría para que él elija el que corresponde.", "Muestra disposición, pero traslada al ciudadano el trabajo de interpretar y no atiende su necesidad específica.", false], ["B", "hacerle preguntas puntuales antes de responder, para identificar con precisión qué información necesita.", "Refleja la competencia «Orientación al usuario y al ciudadano» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en dirigir las decisiones y acciones a satisfacer las necesidades e intereses de los usuarios internos y externos y de los ciudadanos, según las responsabilidades de la entidad. Corresponde a escuchar activamente y valorar las necesidades del ciudadano: aclarar la consulta permite dar una respuesta pertinente y veraz.", true], ["C", "enviarle el enlace de preguntas frecuentes de la página web para que identifique allí la respuesta que necesita.", "Informa, pero sin comprender la necesidad concreta del ciudadano, que puede no estar cubierta en las preguntas frecuentes.", false]]}, {"id": "CO-132", "niv": 3, "e": "Frente al alto volumen de consultas sobre acuerdos de pago, la conducta más acorde con la orientación al usuario y al ciudadano es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Orientación al usuario y al ciudadano)", "o": [["A", "responder cada consulta sobre acuerdos de pago con el enlace al acto administrativo que regula ese trámite.", "Responde, pero remite a un texto normativo que difícilmente resuelve la duda práctica del ciudadano, y no incorpora la necesidad detectada en la gestión de la entidad.", false], ["B", "remitir esas consultas al área de cobro para que sean sus servidores quienes respondan directamente a los ciudadanos.", "Traslada la carga a otra área sin aportar una solución que facilite el trámite a los ciudadanos.", false], ["C", "proponer, con base en las preguntas recibidas, que se publique una guía paso a paso del trámite en los canales de la entidad.", "Refleja la competencia «Orientación al usuario y al ciudadano» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en dirigir las decisiones y acciones a satisfacer las necesidades e intereses de los usuarios internos y externos y de los ciudadanos, según las responsabilidades de la entidad. Refleja la conducta de incorporar las necesidades de usuarios y ciudadanos en los proyectos institucionales con visión de servicio a mediano plazo: lo que observa en el chat se convierte en una mejora para todos.", true]]}, {"id": "CO-133", "niv": 2, "e": "Ante la pregunta sobre la posible anulación de la fotodetección, la conducta que mejor refleja la orientación al usuario y al ciudadano es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Orientación al usuario y al ciudadano)", "o": [["A", "indicarle que no tiene certeza sobre ese punto y explicarle cómo presentar su solicitud para que el área competente la estudie.", "Refleja la competencia «Orientación al usuario y al ciudadano» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en dirigir las decisiones y acciones a satisfacer las necesidades e intereses de los usuarios internos y externos y de los ciudadanos, según las responsabilidades de la entidad. Corresponde a informar con veracidad y atender de forma oportuna la necesidad: reconoce el límite de lo que sabe y le da la ruta concreta para obtener una respuesta de fondo.", true], ["B", "responderle que, por regla general, las fotodetecciones no se anulan por ese motivo.", "Pretende evitar expectativas, pero afirma algo que usted no conoce. También falta a la veracidad.", false], ["C", "decirle que en casos parecidos las fotodetecciones suelen anularse, para darle tranquilidad mientras presenta formalmente su solicitud.", "Busca tranquilizarlo, pero da una información que no le consta. La competencia exige informar con veracidad.", false]]}]}, {"comp": "comportamental", "rol": "general", "tag": "Competencias comportamentales (Decreto 815 de 2018) · Compromiso con la organización", "texto": "Usted trabaja en un instituto distrital de Bogotá cuyo plan de acción incluye la meta de reducir el consumo de papel en 30 % este año. La política de seguridad de la información de la entidad prohíbe enviar documentos institucionales a correos personales. Esta semana usted tiene atrasados dos informes, y el área de correspondencia está represada por el aumento de solicitudes ciudadanas. Varios compañeros siguen imprimiendo borradores por costumbre.", "items": [{"id": "CO-134", "niv": 2, "e": "Para ponerse al día con los informes, la conducta que mejor refleja el compromiso con la organización es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Compromiso con la organización)", "o": [["A", "enviarse los archivos a su correo personal por esta única vez y terminarlos en casa esa noche, ya que lo importante es cumplir con la entidad.", "Tiene buena intención, pero desconoce una norma institucional de seguridad. La competencia incluye respetar las normas de la organización mientras promueve sus metas.", false], ["B", "cumplir la política de seguridad y acordar con su jefe la prioridad de los informes dentro de la jornada o un acceso remoto autorizado.", "Refleja la competencia «Compromiso con la organización» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en alinear el propio comportamiento con las necesidades, prioridades y metas de la organización. Corresponde a promover el cumplimiento de las metas de la organización respetando sus normas: busca terminar los informes sin poner en riesgo la información.", true], ["C", "entregar los informes en la fecha con la información que alcance a procesar y enviar los anexos la semana siguiente.", "Cumple la fecha formalmente, pero con un producto incompleto y sin haber concertado el ajuste con su jefe.", false]]}, {"id": "CO-135", "niv": 1, "e": "Frente a la meta de reducción de papel, la conducta más acorde con el compromiso con la organización es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Compromiso con la organización)", "o": [["A", "proponer que la meta se aplace hasta que la entidad compre más escáneres y pantallas para todas sus dependencias y sedes.", "Puede señalar una necesidad real, pero condiciona la meta en lugar de contribuir a cumplirla con los medios disponibles.", false], ["B", "seguir imprimiendo solo los borradores que considera más importantes para revisarlos con mayor detalle en papel.", "Reduce algo el consumo, pero antepone su preferencia de trabajo a una meta institucional.", false], ["C", "aplicar la meta en su trabajo y recordar a sus compañeros las alternativas digitales, porque la meta es de toda la entidad.", "Refleja la competencia «Compromiso con la organización» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en alinear el propio comportamiento con las necesidades, prioridades y metas de la organización. Refleja la conducta de promover el cumplimiento de las metas de la organización y respetar sus normas, empezando por la propia práctica.", true]]}, {"id": "CO-136", "niv": 2, "e": "Usted terminó sus tareas del día dos horas antes y sabe que correspondencia está represada. La conducta que mejor refleja el compromiso con la organización es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Compromiso con la organización)", "o": [["A", "ofrecer a la coordinadora de correspondencia esas dos horas de apoyo, avisando previamente a su jefe.", "Refleja la competencia «Compromiso con la organización» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en alinear el propio comportamiento con las necesidades, prioridades y metas de la organización. Corresponde a tomar la iniciativa de colaborar con otras áreas cuando se requiere, sin descuidar sus tareas: usa un tiempo libre y mantiene informado a su jefe.", true], ["B", "pasar a apoyar en correspondencia el resto de la semana y dejar para la siguiente las tareas nuevas que le lleguen.", "Colabora, pero descuida sus propias tareas. La conducta asociada pide colaborar sin desatender lo propio.", false], ["C", "esperar a que su jefe le asigne formalmente apoyar a correspondencia, para no invadir funciones de otra área.", "Es respetuoso, pero no toma la iniciativa de colaborar cuando la organización lo necesita y usted tiene disponibilidad.", false]]}]}, {"comp": "comportamental", "rol": "general", "tag": "Competencias comportamentales (Decreto 815 de 2018) · Trabajo en equipo", "texto": "Usted hace parte del equipo que prepara la audiencia pública de rendición de cuentas de una alcaldía de tercera categoría. Cada integrante redacta un capítulo del informe: usted, inversión social; Diana, infraestructura. El plazo interno vence el día 20. Usted terminó su capítulo el 14, mientras Diana va retrasada. Al revisar el borrador consolidado, usted encuentra que el número de beneficiarios del programa de mejoramiento de vivienda que aparece en el capítulo de Diana no coincide con el que usted reportó. Además, el equipo eligió por mayoría un formato de presentación que usted consideraba menos claro.", "items": [{"id": "CO-137", "niv": 1, "e": "Al terminar su capítulo antes del plazo, la conducta que mejor refleja el trabajo en equipo es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Trabajo en equipo)", "o": [["A", "entregar su capítulo al coordinador y volver a sus funciones habituales hasta la reunión de cierre del día 20.", "Cumple su parte, pero ignora que el resultado del equipo depende también del capítulo pendiente.", false], ["B", "ofrecer a Diana ayuda con una parte concreta de su capítulo y acordar con ella cómo integrarla.", "Refleja la competencia «Trabajo en equipo» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en trabajar con otros de manera integrada y armónica para lograr metas institucionales comunes. Corresponde a asumir su responsabilidad como miembro del equipo y planificar sus acciones según su repercusión en el objetivo grupal: el informe es de todos.", true], ["C", "informar al coordinador que Diana va retrasada, para que él adopte las medidas que considere necesarias.", "Alerta sobre el riesgo, pero no contribuye al resultado común cuando tiene tiempo para hacerlo.", false]]}, {"id": "CO-138", "niv": 3, "e": "Frente a la diferencia en el número de beneficiarios, la conducta más acorde con el trabajo en equipo es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Trabajo en equipo)", "o": [["A", "plantear la diferencia en la reunión general del equipo para que todos validen cuál de las dos cifras debe quedar.", "Busca transparencia, pero expone ante todos un asunto que se resuelve de manera directa entre las dos personas que tienen las fuentes.", false], ["B", "corregir usted la cifra de Diana en el documento consolidado, ya que su fuente es la más reciente.", "Puede tener razón, pero modifica el trabajo de una compañera sin comunicárselo, lo que afecta la confianza en el equipo.", false], ["C", "hablarlo directamente con Diana, mostrarle ambas fuentes y revisarlas juntos para unificar el dato.", "Refleja la competencia «Trabajo en equipo» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en trabajar con otros de manera integrada y armónica para lograr metas institucionales comunes. Refleja la conducta de establecer una comunicación directa con los miembros del equipo para compartir información con respeto y cordialidad.", true]]}, {"id": "CO-139", "niv": 2, "e": "Respecto del formato de presentación elegido por mayoría, la conducta que mejor refleja el trabajo en equipo es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Trabajo en equipo)", "o": [["A", "aplicar el formato acordado en su capítulo y dejar registrada su sugerencia para la próxima rendición de cuentas.", "Refleja la competencia «Trabajo en equipo» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en trabajar con otros de manera integrada y armónica para lograr metas institucionales comunes. Corresponde a cumplir los compromisos que adquiere con el equipo y respetar la diversidad de criterios: acata la decisión colectiva sin renunciar a aportar su idea.", true], ["B", "pedir al jefe de planeación que revise la decisión del equipo antes de seguir avanzando con el capítulo.", "Escala un desacuerdo menor que el equipo ya resolvió y retrasa el trabajo de todos.", false], ["C", "presentar su capítulo en el formato que propuso, porque considera que es más claro para la ciudadanía.", "Su intención es mejorar la claridad, pero rompe la unidad del informe y desconoce una decisión del equipo.", false]]}]}, {"comp": "comportamental", "rol": "general", "tag": "Competencias comportamentales (Decreto 815 de 2018) · Trabajo en equipo", "texto": "Usted forma parte de un equipo de tres servidores de una corporación autónoma regional que realiza visitas de control a usuarios con concesión de aguas en una cuenca andina. El equipo acordó que cada informe de visita sea revisado por otro integrante antes de enviarlo. En las últimas semanas el equipo se ve desmotivado por la cantidad de visitas a zonas lejanas. En una visita, usted observa una captación aparentemente ilegal en un predio que está incluido en la ruta que su compañero Jorge recorrerá la próxima semana.", "items": [{"id": "CO-140", "niv": 2, "e": "Su compañero revisor hace a su informe varias observaciones que usted no comparte. La conducta que mejor refleja el trabajo en equipo es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Trabajo en equipo)", "o": [["A", "enviar el informe sin cambios, porque la responsabilidad técnica de la visita es suya.", "Desconoce el acuerdo del equipo sobre la revisión cruzada y no respeta el criterio del compañero.", false], ["B", "aceptar todas las observaciones sin discutirlas y enviar el informe corregido ese mismo día.", "Agiliza el envío, pero renuncia a compartir sus argumentos y puede afectar la calidad del informe.", false], ["C", "revisar cada observación con él, acoger las que mejoran el informe y explicarle con argumentos las que no comparte.", "Refleja la competencia «Trabajo en equipo» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en trabajar con otros de manera integrada y armónica para lograr metas institucionales comunes. Corresponde a respetar la diversidad de criterios y comunicarse de forma directa y respetuosa para compartir ideas: el informe mejora con el aporte de ambos.", true]]}, {"id": "CO-141", "niv": 3, "e": "Frente a la desmotivación del equipo por las visitas lejanas, la conducta más acorde con el trabajo en equipo es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Trabajo en equipo)", "o": [["A", "reconocer en la reunión el esfuerzo de los compañeros y proponer que las visitas lejanas se distribuyan por turnos.", "Refleja la competencia «Trabajo en equipo» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en trabajar con otros de manera integrada y armónica para lograr metas institucionales comunes. Refleja la conducta de asumir su responsabilidad como miembro del equipo enfocándose en contribuir al compromiso y la motivación de los demás, con una propuesta equitativa.", true], ["B", "asumir usted las visitas más lejanas durante el próximo mes, para aliviar la carga de trabajo de sus dos compañeros de equipo.", "Es generoso, pero no resuelve el problema del equipo, concentra la carga en una persona y no es sostenible.", false], ["C", "comentar a su jefe el desánimo que percibe en el equipo, para que sea él quien adopte una solución.", "Informa, pero no aporta desde su papel de integrante a la motivación del grupo.", false]]}, {"id": "CO-142", "niv": 3, "e": "Respecto de la captación ilegal observada, la conducta que mejor refleja el trabajo en equipo es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Trabajo en equipo)", "o": [["A", "incluirla en su informe y dejar que Jorge la conozca cuando lea el consolidado mensual de las visitas.", "Cumple el registro, pero retiene información que su compañero necesita para la visita de la próxima semana.", false], ["B", "registrarla en su informe y enviar de inmediato a Jorge la ubicación y las fotos, porque el predio está en su ruta.", "Refleja la competencia «Trabajo en equipo» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en trabajar con otros de manera integrada y armónica para lograr metas institucionales comunes. Corresponde a establecer comunicación directa para compartir información con el equipo y planificar las propias acciones según su efecto en los objetivos comunes: deja el registro formal y prepara la visita de su compañero.", true], ["C", "avisarle a Jorge y dejar que él la reporte en su propio informe, para que el hallazgo no quede registrado dos veces.", "Comparte la información, pero omite registrar lo que usted mismo observó, como exige el procedimiento de visita.", false]]}]}, {"comp": "comportamental", "rol": "general", "tag": "Competencias comportamentales (Decreto 815 de 2018) · Adaptación al cambio", "texto": "La alcaldía de un municipio de primera categoría adoptó un nuevo modelo de atención: desde el próximo mes, las solicitudes se recibirán únicamente por la ventanilla única virtual, y los servidores de la ventanilla presencial pasarán a orientar a los ciudadanos en el uso de computadores de autoservicio instalados en la sede. Usted lleva 12 años recibiendo documentos en la ventanilla presencial. Algunos compañeros están inconformes con el cambio y temen que los ciudadanos mayores no logren usar la plataforma.", "items": [{"id": "CO-143", "niv": 2, "e": "Ante el anuncio del nuevo modelo, la conducta que mejor refleja la adaptación al cambio es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Adaptación al cambio)", "o": [["A", "aprender el manejo de la plataforma antes de la fecha de inicio y practicar con compañeros cómo orientar a los ciudadanos.", "Refleja la competencia «Adaptación al cambio» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en afrontar con flexibilidad las situaciones nuevas y manejar los cambios de forma positiva y constructiva. Corresponde a aceptar y adaptarse a las nuevas situaciones y cooperar activamente en la implementación de nuevas formas de trabajo.", true], ["B", "seguir recibiendo en papel los documentos de los adultos mayores que lo prefieran, aunque el nuevo modelo no lo contemple.", "Tiene intención de servicio, pero se aparta de la decisión institucional. La competencia pide apoyar las nuevas decisiones; la necesidad de los mayores se atiende acompañándolos en el autoservicio.", false], ["C", "pedir traslado a una dependencia que mantenga la atención presencial, donde su experiencia sea mejor aprovechada.", "Evita el cambio en lugar de afrontarlo con flexibilidad.", false]]}, {"id": "CO-144", "niv": 1, "e": "Frente a la inconformidad de algunos compañeros, la conducta más acorde con la adaptación al cambio es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Adaptación al cambio)", "o": [["A", "unirse a la solicitud de aplazar la implementación hasta que todos se sientan preparados para el nuevo modelo.", "Comprende la preocupación, pero no apoya a la entidad en la nueva decisión y retrasa su implementación.", false], ["B", "evitar opinar sobre el cambio con sus compañeros para no generar tensiones en el grupo de trabajo.", "Es prudente, pero desaprovecha la oportunidad de ayudar a sus compañeros a adaptarse.", false], ["C", "compartirles lo que ha aprendido de la plataforma y mostrarles cómo puede facilitar su trabajo.", "Refleja la competencia «Adaptación al cambio» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en afrontar con flexibilidad las situaciones nuevas y manejar los cambios de forma positiva y constructiva. Refleja la conducta de promover al grupo para que se adapte a las nuevas condiciones.", true]]}, {"id": "CO-145", "niv": 3, "e": "En las primeras semanas la plataforma presenta fallas intermitentes. La conducta que mejor refleja la adaptación al cambio es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Adaptación al cambio)", "o": [["A", "suspender la orientación en los computadores de autoservicio y pedir a los ciudadanos que regresen cuando la plataforma funcione bien.", "Ante la dificultad abandona el nuevo modelo y deja sin atención a los ciudadanos.", false], ["B", "registrar las fallas, reportarlas por el canal definido y orientar a los ciudadanos con las alternativas dispuestas por la entidad.", "Refleja la competencia «Adaptación al cambio» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en afrontar con flexibilidad las situaciones nuevas y manejar los cambios de forma positiva y constructiva. Corresponde a responder al cambio con flexibilidad y cooperar activamente en la implementación de los nuevos procedimientos: aporta información para corregir y mantiene la atención.", true], ["C", "recibir de nuevo los documentos en papel mientras la plataforma se estabiliza, para no perjudicar a los ciudadanos.", "Su intención es proteger al ciudadano, pero revierte por su cuenta la decisión institucional en lugar de usar las alternativas dispuestas por la entidad.", false]]}]}, {"comp": "comportamental", "rol": "general", "tag": "Competencias comportamentales (Decreto 815 de 2018) · Adaptación al cambio", "texto": "Usted trabaja en la Secretaría de Planeación de una gobernación. La nueva secretaria de despacho cambió la forma de reportar: en lugar del informe mensual en documento de texto, cada servidor debe cargar sus datos cada semana en un tablero digital. También reasignó tareas: usted deja el seguimiento de proyectos, que hizo durante seis años, y pasa a apoyar la estructuración de nuevos proyectos, actividad que también está prevista en el manual de funciones de su empleo. Además, la dependencia se trasladará a una sede con puestos de trabajo compartidos.", "items": [{"id": "CO-146", "niv": 1, "e": "Frente al nuevo esquema de reporte, la conducta que mejor refleja la adaptación al cambio es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Adaptación al cambio)", "o": [["A", "pedir a la secretaria que mantenga el informe mensual, explicando que ha funcionado bien durante años en la dependencia.", "Defiende la práctica anterior en lugar de responder con flexibilidad a la nueva decisión.", false], ["B", "seguir preparando también el informe mensual en documento de texto, por si el nuevo esquema no se mantiene en el tiempo.", "Duplica el trabajo y muestra resistencia a adoptar por completo la nueva forma de reporte.", false], ["C", "cargar sus datos en el tablero cada semana desde el inicio, ya que es la forma de reporte que adoptó la secretaría.", "Refleja la competencia «Adaptación al cambio» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en afrontar con flexibilidad las situaciones nuevas y manejar los cambios de forma positiva y constructiva. Corresponde a aceptar y adaptarse con facilidad a las nuevas situaciones y apoyar a la entidad en nuevas formas de trabajo.", true]]}, {"id": "CO-147", "niv": 3, "e": "Respecto de la reasignación de tareas, la conducta más acorde con la adaptación al cambio es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Adaptación al cambio)", "o": [["A", "asumir las nuevas tareas, identificar lo que necesita aprender y entregar a su reemplazo el estado de los proyectos.", "Refleja la competencia «Adaptación al cambio» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en afrontar con flexibilidad las situaciones nuevas y manejar los cambios de forma positiva y constructiva. Refleja la conducta de responder al cambio con flexibilidad y cooperar activamente en la implementación de nuevos objetivos y formas de trabajo, facilitando la transición.", true], ["B", "asumir la estructuración y, de manera informal, seguir pendiente de sus antiguos proyectos para que no se pierdan.", "Acepta el cambio solo en parte: mantener el seguimiento informal genera duplicidad y confusión sobre quién es responsable.", false], ["C", "pedir que lo mantengan en el seguimiento de proyectos, donde tiene más experiencia y puede aportar más a la entidad.", "Su argumento es razonable, pero se resiste a una decisión de la entidad que está dentro de las funciones de su empleo.", false]]}, {"id": "CO-148", "niv": 2, "e": "Ante el traslado a una sede con puestos compartidos, la conducta que mejor refleja la adaptación al cambio es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Adaptación al cambio)", "o": [["A", "solicitar un puesto fijo, argumentando que maneja documentos que requieren un lugar estable de trabajo.", "Busca mantener la condición anterior en lugar de ajustarse a la nueva forma de trabajo de la entidad.", false], ["B", "organizar su información en las herramientas digitales de la entidad para poder trabajar desde cualquier puesto.", "Refleja la competencia «Adaptación al cambio» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en afrontar con flexibilidad las situaciones nuevas y manejar los cambios de forma positiva y constructiva. Corresponde a aceptar y adaptarse a las nuevas situaciones, ajustando su forma de trabajo a las nuevas condiciones.", true], ["C", "llevarse a casa cada día los documentos físicos de trabajo, para no perderlos al cambiar de puesto.", "Intenta resolver el problema, pero de una forma que pone en riesgo la información institucional.", false]]}]}, {"comp": "comportamental", "rol": "profesional", "tag": "Competencias comportamentales (Decreto 815 de 2018) · Nivel profesional · Aporte técnico-profesional", "texto": "Usted es ingeniero civil, profesional universitario de la Secretaría de Planeación de un municipio de tercera categoría, e integra el comité que evalúa el proyecto de un parque recreativo en un lote municipal ubicado junto a una quebrada. Por su experiencia en obras similares, usted observa en los planos señales de que parte del lote podría inundarse en temporada de lluvias. En el comité también participa la trabajadora social de la Secretaría de Desarrollo Social, quien defiende ubicar la zona infantil en el sector que la comunidad pidió en las mesas de participación, aunque allí la cimentación sería más costosa. Días después, el presupuesto del proyecto se reduce en un 30 %.", "items": [{"id": "CO-149", "niv": 2, "e": "Frente al posible riesgo de inundación que usted identifica, la conducta que mejor refleja el aporte técnico-profesional es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 3, sustituido por el art. 1 del Decreto 815 de 2018 (nivel profesional: Aporte técnico-profesional)", "o": [["A", "dejar la observación para el concepto escrito que le corresponde emitir más adelante, cuando el diseño esté definido.", "La observación llegaría cuando el diseño ya esté avanzado y corregirlo sea más costoso. La competencia pide anticipar los problemas previsibles en el proceso de decisión.", false], ["B", "advertir en el comité el riesgo que identifica y sugerir consultar el estudio de amenaza antes de aprobar el diseño.", "Refleja la competencia «Aporte técnico-profesional» (Decreto 1083 de 2015, art. 2.2.4.8, num. 3, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en poner al servicio de la administración los saberes profesionales específicos y la experiencia previa, manteniendo actualizado ese saber experto. Corresponde a las conductas de anticipar problemas previsibles que advierte como especialista e informar su experiencia en la toma de decisiones que involucran su especialidad.", true], ["C", "dejar que se pronuncie el ingeniero ambiental del comité, ya que la hidrología no es la especialidad principal de su formación profesional.", "Muestra respeto por otras especialidades, pero calla un riesgo que identificó con base en su propia experiencia en obras similares.", false]]}, {"id": "CO-150", "niv": 3, "e": "Ante la propuesta de la trabajadora social sobre la zona infantil, la conducta más acorde con el aporte técnico-profesional es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 3, sustituido por el art. 1 del Decreto 815 de 2018 (nivel profesional: Aporte técnico-profesional)", "o": [["A", "sostener la ubicación técnicamente más económica, ya que el costo es un criterio objetivo frente a las preferencias de la comunidad.", "Defiende un criterio válido, pero descarta sin análisis el punto de vista social. La competencia incluye aprender de puntos de vista distintos al propio.", false], ["B", "aceptar la ubicación pedida por la comunidad y ajustar el presupuesto a ese mayor costo sin analizar otras opciones.", "Renuncia a aportar su saber técnico, que es justamente lo que se espera de su participación.", false], ["C", "escuchar sus argumentos y analizar con ella alternativas de diseño que reduzcan el costo en el sector pedido por la comunidad.", "Refleja la competencia «Aporte técnico-profesional» (Decreto 1083 de 2015, art. 2.2.4.8, num. 3, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en poner al servicio de la administración los saberes profesionales específicos y la experiencia previa, manteniendo actualizado ese saber experto. Refleja la conducta de asumir la interdisciplinariedad, aprendiendo de puntos de vista diversos para analizar y ponderar soluciones posibles.", true]]}, {"id": "CO-151", "niv": 1, "e": "Tras la reducción del presupuesto, la conducta que mejor refleja el aporte técnico-profesional es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 3, sustituido por el art. 1 del Decreto 815 de 2018 (nivel profesional: Aporte técnico-profesional)", "o": [["A", "proponer alternativas de materiales o de ejecución por etapas que se ajusten al nuevo presupuesto, para no perder el proyecto.", "Refleja la competencia «Aporte técnico-profesional» (Decreto 1083 de 2015, art. 2.2.4.8, num. 3, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en poner al servicio de la administración los saberes profesionales específicos y la experiencia previa, manteniendo actualizado ese saber experto. Corresponde a la conducta de aportar soluciones alternativas en lo que refiere a sus saberes específicos.", true], ["B", "pedir a la Secretaría de Hacienda que gestione el recurso faltante antes de continuar con el diseño.", "Traslada el problema a otra dependencia sin aportar soluciones desde su especialidad.", false], ["C", "recomendar que se aplace la ejecución del proyecto hasta contar con la totalidad de los recursos inicialmente previstos.", "Es una opción, pero no pone a disposición de la entidad su saber para buscar alternativas viables.", false]]}]}, {"comp": "comportamental", "rol": "profesional", "tag": "Competencias comportamentales (Decreto 815 de 2018) · Nivel profesional · Aporte técnico-profesional", "texto": "Usted es biólogo, profesional universitario de una corporación autónoma regional, y evalúa una solicitud de aprovechamiento forestal en un predio rural. Ha evaluado decenas de solicitudes parecidas y sabe que en esa zona son frecuentes los problemas de regeneración natural después del aprovechamiento. En el inventario presentado por el solicitante aparece una especie que, según su experiencia, suele estar incluida en listados oficiales con restricciones de aprovechamiento. La abogada del grupo considera que una de las exigencias técnicas que usted propone no tiene sustento normativo claro.", "items": [{"id": "CO-152", "niv": 2, "e": "La subdirección decidirá si exige un plan de manejo de la regeneración. La conducta que mejor refleja el aporte técnico-profesional es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 3, sustituido por el art. 1 del Decreto 815 de 2018 (nivel profesional: Aporte técnico-profesional)", "o": [["A", "limitarse a entregar el informe de la visita técnica, ya que la decisión final sobre el plan corresponde a la subdirección.", "Cumple formalmente, pero se guarda un conocimiento útil para la decisión.", false], ["B", "recomendar negar el permiso por precaución, sin entrar en detalles técnicos que puedan complicar la decisión.", "Ofrece una conclusión sin sustento técnico, cuando su aporte consiste justamente en ese saber especializado.", false], ["C", "contar a la subdirección lo que ha visto en casos similares de la zona sobre la regeneración y sus efectos.", "Refleja la competencia «Aporte técnico-profesional» (Decreto 1083 de 2015, art. 2.2.4.8, num. 3, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en poner al servicio de la administración los saberes profesionales específicos y la experiencia previa, manteniendo actualizado ese saber experto. Corresponde a informar su experiencia específica en el proceso de toma de decisiones que involucra su especialidad.", true]]}, {"id": "CO-153", "niv": 1, "e": "Frente a la especie del inventario, la conducta más acorde con el aporte técnico-profesional es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 3, sustituido por el art. 1 del Decreto 815 de 2018 (nivel profesional: Aporte técnico-profesional)", "o": [["A", "señalarlo en su concepto y recomendar verificar el estado de la especie en los listados oficiales antes de decidir.", "Refleja la competencia «Aporte técnico-profesional» (Decreto 1083 de 2015, art. 2.2.4.8, num. 3, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en poner al servicio de la administración los saberes profesionales específicos y la experiencia previa, manteniendo actualizado ese saber experto. Refleja la conducta de anticipar problemas previsibles que advierte en su carácter de especialista, sin afirmar más de lo que puede sustentar.", true], ["B", "dar visto bueno técnico al inventario, ya que verificar los listados oficiales le corresponde al área jurídica de la corporación.", "Omite un problema que advierte como especialista y que debería quedar en su concepto.", false], ["C", "recomendar que se niegue la solicitud por la sola presencia de esa especie en el inventario del predio.", "Concluye sin verificar el estado de la especie ni el alcance de la restricción, más allá de lo que su experiencia permite afirmar.", false]]}, {"id": "CO-154", "niv": 3, "e": "Ante la observación de la abogada sobre la exigencia técnica, la conducta que mejor refleja el aporte técnico-profesional es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 3, sustituido por el art. 1 del Decreto 815 de 2018 (nivel profesional: Aporte técnico-profesional)", "o": [["A", "retirar la exigencia del concepto, porque en caso de duda el criterio jurídico prima sobre el técnico.", "Abandona su aporte sin analizar si la exigencia puede sustentarse por otra vía o reformularse.", false], ["B", "revisar con ella el fundamento técnico y normativo, y sustentar o ajustar la exigencia según el resultado del análisis.", "Refleja la competencia «Aporte técnico-profesional» (Decreto 1083 de 2015, art. 2.2.4.8, num. 3, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en poner al servicio de la administración los saberes profesionales específicos y la experiencia previa, manteniendo actualizado ese saber experto. Corresponde a asumir la interdisciplinariedad, aprendiendo de puntos de vista diversos para ponderar las soluciones posibles.", true], ["C", "mantener la exigencia en el concepto, ya que técnicamente es necesaria aunque la abogada del grupo no le encuentre sustento.", "Defiende su saber, pero no integra el punto de vista jurídico, que es relevante para que la exigencia sea viable.", false]]}]}, {"comp": "comportamental", "rol": "profesional", "tag": "Competencias comportamentales (Decreto 815 de 2018) · Nivel profesional · Comunicación efectiva", "texto": "Usted es profesional universitario de la Dirección de Talento Humano de una gobernación. Debe informar a los 300 servidores de la planta central un cambio en el procedimiento para solicitar vacaciones: desde el próximo mes, las solicitudes se harán en un formulario electrónico con 30 días de anticipación. Tras la divulgación, empiezan a llegar correos con dudas y algunas llamadas. Uno de los servidores llama molesto, porque cree que el cambio afecta las vacaciones que ya tenía aprobadas para el mes siguiente; la circular incluye una regla de transición para esos casos.", "items": [{"id": "CO-155", "niv": 1, "e": "Para divulgar el nuevo procedimiento, la conducta que mejor refleja la comunicación efectiva es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 3, sustituido por el art. 1 del Decreto 815 de 2018 (nivel profesional: Comunicación efectiva)", "o": [["A", "redactar una circular breve con los pasos en orden, las fechas clave y un ejemplo del formulario diligenciado.", "Refleja la competencia «Comunicación efectiva» (Decreto 1083 de 2015, art. 2.2.4.8, num. 3, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en comunicarse de forma efectiva y positiva con superiores, pares y ciudadanos, tanto por escrito como de manera verbal y gestual. Corresponde a redactar textos con claridad para hacer efectiva y sencilla la comprensión.", true], ["B", "enviar a todos los servidores el texto completo de la resolución que adopta el procedimiento, con sus considerandos y anexos.", "Cumple con divulgar, pero un texto normativo extenso no facilita la comprensión de los pasos prácticos.", false], ["C", "enviar un mensaje corto que anuncie el cambio y remita a la intranet para consultar el detalle del procedimiento.", "Es breve, pero deja la comprensión en manos de cada servidor y no explica lo esencial.", false]]}, {"id": "CO-156", "niv": 2, "e": "Frente a los correos con dudas que llegan después de la divulgación, la conducta más acorde con la comunicación efectiva es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 3, sustituido por el art. 1 del Decreto 815 de 2018 (nivel profesional: Comunicación efectiva)", "o": [["A", "responder solo las dudas que no estén resueltas en la circular, para no repetir información ya divulgada.", "Deja sin respuesta a quienes no entendieron la circular. La competencia pide responder cada comunicación recibida.", false], ["B", "reunir todos los correos de la semana y responderlos el viernes en un solo mensaje colectivo a todos los servidores.", "Es ordenado, pero demora las respuestas y no atiende cada comunicación de forma oportuna.", false], ["C", "contestar cada correo a medida que llega y agrupar las preguntas repetidas en un documento de preguntas frecuentes.", "Refleja la competencia «Comunicación efectiva» (Decreto 1083 de 2015, art. 2.2.4.8, num. 3, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en comunicarse de forma efectiva y positiva con superiores, pares y ciudadanos, tanto por escrito como de manera verbal y gestual. Refleja la conducta de dar respuesta a cada comunicación recibida de modo inmediato, y además aprovecha las preguntas para mejorar la claridad del mensaje.", true]]}, {"id": "CO-157", "niv": 3, "e": "Ante la llamada del servidor molesto, la conducta que mejor refleja la comunicación efectiva es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 3, sustituido por el art. 1 del Decreto 815 de 2018 (nivel profesional: Comunicación efectiva)", "o": [["A", "tomar nota de su inconformidad e informarle que el director de talento humano le responderá por escrito.", "Es cortés, pero no escucha ni aclara una duda que usted puede resolver en la misma llamada.", false], ["B", "dejarlo explicar su situación, verificar con él las fechas aprobadas y aclararle cómo aplica la regla de transición a su caso.", "Refleja la competencia «Comunicación efectiva» (Decreto 1083 de 2015, art. 2.2.4.8, num. 3, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en comunicarse de forma efectiva y positiva con superiores, pares y ciudadanos, tanto por escrito como de manera verbal y gestual. Corresponde a mantener una escucha atenta para comprender mejor el mensaje y comunicarse con claridad y tono agradable para el receptor.", true], ["C", "explicarle de inmediato que el nuevo procedimiento aplica para todos y que debe volver a radicar la solicitud.", "Responde rápido, pero sin escuchar su situación y, además, ignora la regla de transición que puede aplicarle.", false]]}]}, {"comp": "comportamental", "rol": "profesional", "tag": "Competencias comportamentales (Decreto 815 de 2018) · Nivel profesional · Comunicación efectiva", "texto": "Usted es profesional especializado de una secretaría distrital de Bogotá y coordinó un estudio técnico de movilidad en un barrio de la localidad de Kennedy. Debe presentar los resultados a la junta de acción comunal, cuyos integrantes no tienen formación técnica. Su jefe le escribió por correo: «Prepare un resumen del estudio para el Concejo», sin más detalles, y usted no sabe si se trata de un debate de control político o de una solicitud de información. Además, un ciudadano le escribe confundido, pues cree que el estudio recomienda cerrar una vía, cuando en realidad recomienda cambiar su sentido de circulación.", "items": [{"id": "CO-158", "niv": 1, "e": "Para presentar los resultados a la junta de acción comunal, la conducta que mejor refleja la comunicación efectiva es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 3, sustituido por el art. 1 del Decreto 815 de 2018 (nivel profesional: Comunicación efectiva)", "o": [["A", "explicar los resultados con mapas del barrio y ejemplos cotidianos, pues la junta no es experta en el tema.", "Refleja la competencia «Comunicación efectiva» (Decreto 1083 de 2015, art. 2.2.4.8, num. 3, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en comunicarse de forma efectiva y positiva con superiores, pares y ciudadanos, tanto por escrito como de manera verbal y gestual. Corresponde a utilizar los canales de comunicación con claridad, precisión y tono adecuado para el receptor, haciendo sencilla la comprensión.", true], ["B", "presentar el informe técnico completo con sus tablas y anexos, para garantizar el rigor de la información.", "Es riguroso, pero no se ajusta al receptor: un documento técnico sin adaptación dificulta la comprensión de la comunidad.", false], ["C", "entregar a cada integrante de la junta un resumen escrito del estudio y ofrecer resolver las dudas que tengan por correo.", "Facilita algo, pero renuncia a la explicación directa que la comunidad necesita y deja la comprensión a cada lector.", false]]}, {"id": "CO-159", "niv": 3, "e": "Frente al correo de su jefe, la conducta más acorde con la comunicación efectiva es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 3, sustituido por el art. 1 del Decreto 815 de 2018 (nivel profesional: Comunicación efectiva)", "o": [["A", "usar el mismo formato del último resumen que envió al Concejo, ya que ese documento fue bien recibido.", "Ahorra tiempo, pero supone que el propósito es el mismo sin haber comprendido el mensaje recibido.", false], ["B", "releer el correo y sus anexos y, si aún tiene dudas, preguntar a su jefe el propósito y la extensión.", "Refleja la competencia «Comunicación efectiva» (Decreto 1083 de 2015, art. 2.2.4.8, num. 3, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en comunicarse de forma efectiva y positiva con superiores, pares y ciudadanos, tanto por escrito como de manera verbal y gestual. Refleja la conducta de mantener una lectura atenta para comprender mejor los mensajes recibidos antes de producir la respuesta.", true], ["C", "preparar un resumen extenso que cubra todos los aspectos del estudio, de modo que sirva para cualquier propósito.", "Intenta cubrir todo, pero un texto que no responde a un propósito definido pierde claridad y eficacia.", false]]}, {"id": "CO-160", "niv": 2, "e": "Para responder al ciudadano confundido, la conducta que mejor refleja la comunicación efectiva es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 3, sustituido por el art. 1 del Decreto 815 de 2018 (nivel profesional: Comunicación efectiva)", "o": [["A", "invitarlo a la próxima reunión de socialización del estudio, donde podrá resolver su inquietud en persona.", "Ofrece un espacio útil, pero aplaza una aclaración que puede hacer de inmediato y por escrito.", false], ["B", "reenviarle el estudio completo con la indicación de que la respuesta a su inquietud se encuentra en el capítulo de recomendaciones.", "Remite la información, pero no aclara el malentendido ni facilita la comprensión.", false], ["C", "responderle señalando con claridad la recomendación del estudio y explicándole la diferencia con un ejemplo de su calle.", "Refleja la competencia «Comunicación efectiva» (Decreto 1083 de 2015, art. 2.2.4.8, num. 3, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en comunicarse de forma efectiva y positiva con superiores, pares y ciudadanos, tanto por escrito como de manera verbal y gestual. Corresponde a responder cada comunicación con claridad y precisión, de modo que el mensaje sea comprensible para quien lo recibe.", true]]}]}, {"comp": "comportamental", "rol": "profesional", "tag": "Competencias comportamentales (Decreto 815 de 2018) · Nivel profesional · Gestión de procedimientos", "texto": "Usted es profesional universitario del grupo de contratación de la Secretaría General de una alcaldía de segunda categoría. El procedimiento interno de contratación exige revisar una lista de chequeo antes de pasar cada contrato a firma. Un secretario de despacho le pide agilizar un contrato urgente sin revisar la lista, porque «ya está todo». Usted ha notado, además, que el procedimiento exige diligenciar un formato de estudio previo que repite casi toda la información de otro formato. El viernes, revisando otro expediente cuyo plazo interno vence ese día, encuentra que uno de los documentos soporte del contratista está desactualizado.", "items": [{"id": "CO-161", "niv": 1, "e": "Ante la solicitud del secretario de despacho, la conducta que mejor refleja la gestión de procedimientos es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 3, sustituido por el art. 1 del Decreto 815 de 2018 (nivel profesional: Gestión de procedimientos)", "o": [["A", "tramitarlo sin la lista de chequeo y dejar por escrito que el secretario asumió la responsabilidad por la omisión.", "Deja constancia, pero igual se aparta del procedimiento vigente, que no prevé esa excepción.", false], ["B", "tramitar el contrato de inmediato y revisar la lista de chequeo después de la firma, para no retrasar la necesidad de la secretaría.", "Atiende la urgencia, pero altera el orden del procedimiento: el control posterior pierde su propósito preventivo.", false], ["C", "revisar el contrato contra la lista de chequeo completa, porque es un control previo, e informar al secretario cuánto tardará.", "Refleja la competencia «Gestión de procedimientos» (Decreto 1083 de 2015, art. 2.2.4.8, num. 3, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en desarrollar las tareas a cargo dentro de los procedimientos vigentes y proponer acciones que aceleren la mejora continua y la productividad. Corresponde a desarrollar las actividades de acuerdo con las pautas y protocolos definidos: puede priorizar el contrato, pero no omitir el control.", true]]}, {"id": "CO-162", "niv": 2, "e": "Frente al formato que duplica información, la conducta más acorde con la gestión de procedimientos es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 3, sustituido por el art. 1 del Decreto 815 de 2018 (nivel profesional: Gestión de procedimientos)", "o": [["A", "dejar de diligenciar el formato repetido, porque no aporta valor y retrasa los trámites de contratación.", "Puede tener razón en el fondo, pero se aparta por su cuenta del procedimiento vigente.", false], ["B", "documentar la duplicidad con ejemplos y proponer el ajuste al responsable del procedimiento en el sistema de gestión.", "Refleja la competencia «Gestión de procedimientos» (Decreto 1083 de 2015, art. 2.2.4.8, num. 3, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en desarrollar las tareas a cargo dentro de los procedimientos vigentes y proponer acciones que aceleren la mejora continua y la productividad. Refleja la conducta de revisar procedimientos e instrumentos para mejorar tiempos y resultados, por el canal institucional y sin dejar de cumplir el procedimiento mientras se ajusta.", true], ["C", "seguir diligenciando los dos formatos sin comentarios y dedicar el tiempo restante a revisar sus demás expedientes de contratación.", "Cumple el procedimiento, pero no aporta a su mejora. La competencia también incluye revisar procedimientos para mejorar tiempos.", false]]}, {"id": "CO-163", "niv": 3, "e": "Frente al documento desactualizado del expediente que vence el viernes, la conducta que mejor refleja la gestión de procedimientos es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 3, sustituido por el art. 1 del Decreto 815 de 2018 (nivel profesional: Gestión de procedimientos)", "o": [["A", "pedir de inmediato al contratista el documento actualizado y avanzar en la revisión de los demás requisitos mientras llega.", "Refleja la competencia «Gestión de procedimientos» (Decreto 1083 de 2015, art. 2.2.4.8, num. 3, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en desarrollar las tareas a cargo dentro de los procedimientos vigentes y proponer acciones que aceleren la mejora continua y la productividad. Corresponde a ejecutar sus tareas con los criterios de calidad establecidos y anticipar soluciones: no omite el requisito y aprovecha el tiempo para no retrasar el trámite.", true], ["B", "devolver el expediente completo a la dependencia de origen para que inicie nuevamente el trámite.", "Protege la calidad, pero genera un reproceso desproporcionado frente a un documento que puede subsanarse.", false], ["C", "continuar el trámite y anotar que el contratista actualizará el documento antes de suscribir el acta de inicio.", "Cumple el plazo interno, pero deja avanzar un expediente sin el requisito de calidad exigido en esa etapa.", false]]}]}, {"comp": "comportamental", "rol": "profesional", "tag": "Competencias comportamentales (Decreto 815 de 2018) · Nivel profesional · Gestión de procedimientos", "texto": "Usted es ingeniero ambiental, profesional universitario de una corporación autónoma regional, y evalúa solicitudes de permiso de vertimientos. El procedimiento de la corporación exige que la caracterización del vertimiento presentada por el usuario provenga de un laboratorio acreditado. En el último semestre, el 60 % de las solicitudes que usted recibió fueron devueltas por estar incompletas. Hoy su jefe le pide emitir un concepto técnico antes de terminar el día, pero aún le falta revisar el modelo de dispersión del vertimiento que el procedimiento exige verificar.", "items": [{"id": "CO-164", "niv": 1, "e": "Un usuario presenta una caracterización hecha por un laboratorio no acreditado, con resultados que cumplen los límites. La conducta que mejor refleja la gestión de procedimientos es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 3, sustituido por el art. 1 del Decreto 815 de 2018 (nivel profesional: Gestión de procedimientos)", "o": [["A", "pedir al usuario un nuevo análisis hecho por un laboratorio con acreditación, porque así lo exige la corporación.", "Refleja la competencia «Gestión de procedimientos» (Decreto 1083 de 2015, art. 2.2.4.8, num. 3, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en desarrollar las tareas a cargo dentro de los procedimientos vigentes y proponer acciones que aceleren la mejora continua y la productividad. Corresponde a desarrollar las actividades de acuerdo con las pautas y protocolos definidos y ejecutar las tareas con los criterios de calidad establecidos.", true], ["B", "tomar usted mismo muestras del vertimiento durante la visita técnica para reemplazar el estudio presentado por el usuario.", "Busca una solución, pero asume una tarea que el procedimiento asigna al usuario y a un laboratorio acreditado.", false], ["C", "aceptar el estudio, ya que los resultados cumplen y exigir uno nuevo retrasaría el trámite del usuario.", "Prioriza la rapidez sobre un requisito del procedimiento que garantiza la confiabilidad de los datos.", false]]}, {"id": "CO-165", "niv": 2, "e": "Frente al alto porcentaje de solicitudes devueltas, la conducta más acorde con la gestión de procedimientos es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 3, sustituido por el art. 1 del Decreto 815 de 2018 (nivel profesional: Gestión de procedimientos)", "o": [["A", "ampliar por su cuenta el plazo para que los usuarios completen la información y evitar así las devoluciones.", "Modifica de hecho una regla del procedimiento sin que la mejora se haya aprobado.", false], ["B", "analizar las causas más frecuentes de devolución y proponer una lista de requisitos para entregar desde la radicación.", "Refleja la competencia «Gestión de procedimientos» (Decreto 1083 de 2015, art. 2.2.4.8, num. 3, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en desarrollar las tareas a cargo dentro de los procedimientos vigentes y proponer acciones que aceleren la mejora continua y la productividad. Refleja la conducta de revisar procedimientos e instrumentos para mejorar tiempos y resultados y anticipar soluciones a problemas.", true], ["C", "dedicar más tiempo a llamar a cada usuario para explicarle qué documentos le faltan a su solicitud.", "Mejora la atención caso a caso, pero no revisa el procedimiento ni ataca la causa del problema.", false]]}, {"id": "CO-166", "niv": 3, "e": "Ante la solicitud de su jefe de emitir hoy el concepto, la conducta que mejor refleja la gestión de procedimientos es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 3, sustituido por el art. 1 del Decreto 815 de 2018 (nivel profesional: Gestión de procedimientos)", "o": [["A", "emitir hoy el concepto con la salvedad de que el modelo de dispersión se revisará en los días siguientes.", "Cumple el plazo, pero emite un concepto sin la verificación que el procedimiento exige como parte de su calidad.", false], ["B", "emitir hoy el concepto apoyándose en las conclusiones del consultor del usuario sobre el modelo de dispersión.", "Sustituye la verificación propia exigida por el procedimiento por la opinión de una parte interesada.", false], ["C", "informar a su jefe qué revisión falta y cuánto tiempo tomará, y emitir el concepto cuando esté completa.", "Refleja la competencia «Gestión de procedimientos» (Decreto 1083 de 2015, art. 2.2.4.8, num. 3, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en desarrollar las tareas a cargo dentro de los procedimientos vigentes y proponer acciones que aceleren la mejora continua y la productividad. Corresponde a ejecutar sus tareas con los criterios de calidad establecidos y conforme a los protocolos definidos, manteniendo informado a su jefe para que gestione el tiempo.", true]]}]}, {"comp": "comportamental", "rol": "profesional", "tag": "Competencias comportamentales (Decreto 815 de 2018) · Nivel profesional · Instrumentación de decisiones", "texto": "Usted es profesional universitario del grupo de presupuesto de la Secretaría de Hacienda de una gobernación. Esta semana enfrenta tres asuntos: primero, debe definir el orden en que revisará 20 solicitudes de certificado de disponibilidad presupuestal que le fueron asignadas; segundo, recibió una solicitud de traslado presupuestal que, según el decreto de liquidación del presupuesto, requiere aprobación del secretario de Hacienda; tercero, quiere cambiar la plantilla interna de seguimiento que el propio grupo diseñó el año pasado, que usan todos sus compañeros y que no hace parte del sistema de gestión de calidad.", "items": [{"id": "CO-167", "niv": 1, "e": "Respecto del orden de revisión de las 20 solicitudes, la conducta que mejor refleja la instrumentación de decisiones es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 3, sustituido por el art. 1 del Decreto 815 de 2018 (nivel profesional: Instrumentación de decisiones)", "o": [["A", "consultar al secretario de Hacienda en qué orden prefiere que se revisen las solicitudes asignadas.", "Eleva una decisión que pertenece a su esfera individual de trabajo y recarga al superior con un asunto operativo.", false], ["B", "proponer al grupo que defina en reunión el orden de revisión de las solicitudes asignadas a usted.", "Socializa una decisión que es de su ámbito individual y le resta agilidad al trabajo.", false], ["C", "definirlo usted mismo, porque es un asunto de su trabajo, con criterios como la fecha de radicación y la urgencia.", "Refleja la competencia «Instrumentación de decisiones» (Decreto 1083 de 2015, art. 2.2.4.8, num. 3, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en decidir los asuntos de los que se es responsable con criterios de economía, eficacia, eficiencia y transparencia. Corresponde a discriminar las decisiones que pertenecen a la esfera individual de trabajo y adoptarlas con criterios objetivos.", true]]}, {"id": "CO-168", "niv": 2, "e": "Frente a la solicitud de traslado presupuestal, la conducta más acorde con la instrumentación de decisiones es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 3, sustituido por el art. 1 del Decreto 815 de 2018 (nivel profesional: Instrumentación de decisiones)", "o": [["A", "llevar la solicitud a la reunión del grupo de presupuesto para decidir entre todos si procede.", "La decisión no corresponde al grupo sino al superior; socializarla no la resuelve.", false], ["B", "estudiar la solicitud y pasarla al secretario con su recomendación sustentada, para que decida.", "Refleja la competencia «Instrumentación de decisiones» (Decreto 1083 de 2015, art. 2.2.4.8, num. 3, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en decidir los asuntos de los que se es responsable con criterios de economía, eficacia, eficiencia y transparencia. Refleja la conducta de discriminar con efectividad las decisiones que deben ser elevadas a un superior, aportando información válida y rigurosa para la decisión.", true], ["C", "aprobar el traslado usted mismo, ya que tiene claro que es viable y así evita demoras a la dependencia solicitante.", "Decide sobre un asunto que, según el caso, requiere la aprobación del secretario.", false]]}, {"id": "CO-169", "niv": 3, "e": "Respecto del cambio en la plantilla interna de seguimiento, la conducta que mejor refleja la instrumentación de decisiones es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 3, sustituido por el art. 1 del Decreto 815 de 2018 (nivel profesional: Instrumentación de decisiones)", "o": [["A", "llevar al grupo un borrador de la nueva plantilla y acordar la versión final, ya que todos la usan.", "Refleja la competencia «Instrumentación de decisiones» (Decreto 1083 de 2015, art. 2.2.4.8, num. 3, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en decidir los asuntos de los que se es responsable con criterios de economía, eficacia, eficiencia y transparencia. Corresponde a discriminar las decisiones que deben socializarse con el equipo de trabajo y analizarlas con criterios objetivos junto con las personas involucradas.", true], ["B", "implementar su nueva versión de la plantilla y enviarla a los compañeros para que empiecen a usarla de inmediato.", "Decide solo sobre una herramienta que usa todo el grupo, sin considerar a las personas involucradas.", false], ["C", "enviar la propuesta al secretario de Hacienda para que la adopte como instrumento oficial del grupo.", "Eleva al superior una decisión operativa que el propio grupo puede tomar sobre una herramienta que él mismo diseñó.", false]]}]}, {"comp": "comportamental", "rol": "profesional", "tag": "Competencias comportamentales (Decreto 815 de 2018) · Nivel profesional · Instrumentación de decisiones", "texto": "Usted es profesional universitario de una entidad distrital de cultura de Bogotá y, dentro de sus funciones, debe decidir en qué orden recibirán tres localidades la itinerancia de un programa de fomento a la lectura. La entidad cuenta con datos de asistencia a bibliotecas y de oferta cultural por localidad. Los gestores culturales de las tres localidades han pedido conocer cómo se tomará la decisión. Una vez iniciada la itinerancia, la asistencia en la primera localidad resultó menor a la esperada.", "items": [{"id": "CO-170", "niv": 1, "e": "Para definir el orden de las localidades, la conducta que mejor refleja la instrumentación de decisiones es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 3, sustituido por el art. 1 del Decreto 815 de 2018 (nivel profesional: Instrumentación de decisiones)", "o": [["A", "basar la decisión en los datos de asistencia y oferta cultural registrados por la entidad para cada localidad.", "Refleja la competencia «Instrumentación de decisiones» (Decreto 1083 de 2015, art. 2.2.4.8, num. 3, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en decidir los asuntos de los que se es responsable con criterios de economía, eficacia, eficiencia y transparencia. Corresponde a adoptar decisiones con base en información válida y rigurosa.", true], ["B", "definir el orden según una encuesta rápida en las redes sociales de la entidad sobre dónde prefieren el programa.", "Consulta a la ciudadanía, pero con un mecanismo poco riguroso que no asegura información representativa.", false], ["C", "asignar el primer turno a la localidad cuyo alcalde local ha insistido más en recibir el programa.", "Decide por la presión recibida y no por información válida, lo que afecta la transparencia.", false]]}, {"id": "CO-171", "niv": 3, "e": "Frente a la solicitud de los gestores culturales, la conducta más acorde con la instrumentación de decisiones es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 3, sustituido por el art. 1 del Decreto 815 de 2018 (nivel profesional: Instrumentación de decisiones)", "o": [["A", "pedirles que acuerden entre ellos el orden de las localidades y acoger lo que decidan.", "Delega una decisión que le corresponde por sus funciones y renuncia a criterios objetivos.", false], ["B", "comunicarles la decisión final sin detallar los criterios, para evitar discusiones que retrasen el programa.", "Ahorra tiempo, pero sacrifica la transparencia y no analiza la materia con las personas involucradas.", false], ["C", "reunirse con ellos, presentarles los criterios y los datos usados y escuchar si aportan información que cambie el análisis.", "Refleja la competencia «Instrumentación de decisiones» (Decreto 1083 de 2015, art. 2.2.4.8, num. 3, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en decidir los asuntos de los que se es responsable con criterios de economía, eficacia, eficiencia y transparencia. Refleja la conducta de manejar criterios objetivos para analizar la materia a decidir con las personas involucradas, con transparencia.", true]]}, {"id": "CO-172", "niv": 2, "e": "Ante la baja asistencia en la primera localidad, la conducta que mejor refleja la instrumentación de decisiones es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 3, sustituido por el art. 1 del Decreto 815 de 2018 (nivel profesional: Instrumentación de decisiones)", "o": [["A", "explicar en el informe que la baja asistencia se debió a la escasa difusión que hizo la alcaldía local.", "Puede ser una causa, pero atribuir el resultado a otros sin análisis no refleja la conducta de asumir los efectos de las propias decisiones.", false], ["B", "reconocer en su informe el resultado, analizar sus causas y proponer ajustes para las siguientes rondas.", "Refleja la competencia «Instrumentación de decisiones» (Decreto 1083 de 2015, art. 2.2.4.8, num. 3, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en decidir los asuntos de los que se es responsable con criterios de economía, eficacia, eficiencia y transparencia. Corresponde a asumir los efectos de sus decisiones: reconoce el resultado y lo usa para mejorar las decisiones siguientes.", true], ["C", "esperar a que termine la itinerancia en las tres localidades para evaluar si se trató de un problema puntual de esa localidad.", "Aplaza el análisis y pierde la oportunidad de ajustar a tiempo las rondas siguientes.", false]]}]}, {"comp": "comportamental", "rol": "profesional", "tag": "Competencias comportamentales (Decreto 815 de 2018) · Nivel profesional · Profesional con personal a cargo: dirección y desarrollo de personal", "texto": "Usted es profesional especializado y coordina el grupo de atención al ciudadano de la alcaldía de un municipio de primera categoría; tiene a cargo cinco servidores. Una de ellas, Marcela, auxiliar administrativa asignada al archivo del grupo y cuyo manual de funciones incluye la atención y orientación de usuarios, ha mostrado gran habilidad para atender a usuarios difíciles cuando apoya la ventanilla. Hasta ahora, la retroalimentación al grupo se ha limitado a la evaluación del desempeño. Talento humano solicitó a los coordinadores reportar las necesidades de capacitación de sus equipos para el plan institucional del próximo año.", "items": [{"id": "CO-173", "niv": 2, "e": "Respecto de Marcela, la conducta que mejor refleja la dirección y desarrollo de personal es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 3, sustituido por el art. 1 del Decreto 815 de 2018 (nivel profesional con personal a cargo: Dirección y desarrollo de personal)", "o": [["A", "mantenerla en el archivo, porque allí cumple bien y moverla afectaría una tarea que ya funciona.", "Privilegia la estabilidad de una tarea sobre el desarrollo de una potencialidad identificada.", false], ["B", "pedirle que cubra la ventanilla cuando falte personal, sin cambiar su asignación en el archivo ni acompañarla en esa labor.", "Aprovecha su habilidad de forma ocasional, pero no la ubica donde más aporta ni acompaña su desarrollo.", false], ["C", "asignarle, dentro de las funciones de su empleo, la atención de casos complejos y acompañarla con retroalimentación.", "Refleja la competencia «Dirección y desarrollo de personal» (Decreto 1083 de 2015, art. 2.2.4.8, num. 3, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en favorecer el aprendizaje y el desarrollo de los colaboradores, identificando sus potencialidades personales y profesionales para cumplir los objetivos institucionales. Corresponde a identificar, ubicar y desarrollar el talento humano a su cargo y hacer uso de sus habilidades para alcanzar las metas del grupo.", true]]}, {"id": "CO-174", "niv": 2, "e": "Para mejorar la retroalimentación al grupo, la conducta más acorde con la dirección y desarrollo de personal es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 3, sustituido por el art. 1 del Decreto 815 de 2018 (nivel profesional con personal a cargo: Dirección y desarrollo de personal)", "o": [["A", "programar reuniones cortas y periódicas con cada colaborador para revisar avances, reconocer logros y acordar mejoras.", "Refleja la competencia «Dirección y desarrollo de personal» (Decreto 1083 de 2015, art. 2.2.4.8, num. 3, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en favorecer el aprendizaje y el desarrollo de los colaboradores, identificando sus potencialidades personales y profesionales para cumplir los objetivos institucionales. Refleja la conducta de establecer espacios regulares de retroalimentación y reconocimiento del buen desempeño en pro del mejoramiento continuo.", true], ["B", "dar retroalimentación en la evaluación del desempeño, que es el espacio formal previsto para ello.", "La evaluación es necesaria, pero por sí sola es esporádica. La competencia pide espacios regulares de retroalimentación.", false], ["C", "enviar un correo de felicitación a todo el grupo, con copia a la secretaría, cada vez que se cumplan las metas mensuales de atención.", "Reconoce logros colectivos, pero no ofrece retroalimentación individual para mejorar.", false]]}, {"id": "CO-175", "niv": 3, "e": "Frente a la solicitud de talento humano sobre capacitación, la conducta que mejor refleja la dirección y desarrollo de personal es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 3, sustituido por el art. 1 del Decreto 815 de 2018 (nivel profesional con personal a cargo: Dirección y desarrollo de personal)", "o": [["A", "dejar que cada colaborador busque y proponga por su cuenta los cursos que le interesen para el plan del próximo año.", "Respeta la autonomía, pero el coordinador no orienta la identificación de las necesidades del grupo.", false], ["B", "identificar con cada colaborador sus necesidades de formación, reportarlas y apoyar su asistencia.", "Refleja la competencia «Dirección y desarrollo de personal» (Decreto 1083 de 2015, art. 2.2.4.8, num. 3, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en favorecer el aprendizaje y el desarrollo de los colaboradores, identificando sus potencialidades personales y profesionales para cumplir los objetivos institucionales. Corresponde a orientar la identificación de necesidades de formación y capacitación y apoyar la ejecución de las acciones propuestas para satisfacerlas.", true], ["C", "inscribir a los cinco servidores en el mismo curso de servicio al ciudadano que ofrece la entidad cada año.", "Es práctico, pero no parte de las necesidades particulares de cada colaborador.", false]]}]}, {"comp": "comportamental", "rol": "profesional", "tag": "Competencias comportamentales (Decreto 815 de 2018) · Nivel profesional · Profesional con personal a cargo: toma de decisiones", "texto": "Usted es profesional especializado y coordina el grupo de licencias y permisos ambientales de una corporación autónoma regional, con seis profesionales a cargo. El grupo tiene 120 expedientes pendientes: algunos con términos próximos a vencer, otros relacionados con proyectos de alto impacto ambiental y otros sencillos. La subdirección le pidió definir si el grupo adopta un nuevo formato de concepto técnico, entre dos alternativas. Esta semana, uno de los profesionales inició una incapacidad médica de tres meses y deja 20 expedientes en trámite.", "items": [{"id": "CO-176", "niv": 1, "e": "Para organizar la atención de los 120 expedientes, la conducta que mejor refleja la toma de decisiones es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 3, sustituido por el art. 1 del Decreto 815 de 2018 (nivel profesional con personal a cargo: Toma de decisiones)", "o": [["A", "priorizar los expedientes con términos próximos a vencer y los de mayor riesgo ambiental, asignando responsables y fechas.", "Refleja la competencia «Toma de decisiones» (Decreto 1083 de 2015, art. 2.2.4.8, num. 3, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en elegir alternativas para solucionar problemas y ejecutar acciones concretas y coherentes con lo decidido. Corresponde a elegir con oportunidad los asuntos a atender, estableciendo responsabilidades precisas con base en las prioridades de la entidad.", true], ["B", "atenderlos por estricto orden de radicación, que es el criterio más objetivo y fácil de explicar a los usuarios de la corporación.", "Es un criterio sencillo, pero ignora los términos próximos a vencer y el riesgo ambiental.", false], ["C", "dar prioridad a los expedientes más sencillos para reducir rápidamente el número de pendientes del grupo.", "Mejora la cifra, pero deja en riesgo los casos con términos y los de mayor impacto.", false]]}, {"id": "CO-177", "niv": 3, "e": "Para decidir sobre el nuevo formato de concepto técnico, la conducta más acorde con la toma de decisiones es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 3, sustituido por el art. 1 del Decreto 815 de 2018 (nivel profesional con personal a cargo: Toma de decisiones)", "o": [["A", "adoptar la alternativa que usted prefiere, ya que la decisión le corresponde como coordinador del grupo.", "La decisión es suya, pero la competencia pide considerar la opinión técnica de los colaboradores al analizar las alternativas.", false], ["B", "someter la decisión a votación del grupo y adoptar el formato que obtenga más votos.", "Escucha al equipo, pero renuncia a la responsabilidad de decidir que le fue asignada.", false], ["C", "pedir a los profesionales que analicen ambas alternativas y luego decidir usted, explicando las razones.", "Refleja la competencia «Toma de decisiones» (Decreto 1083 de 2015, art. 2.2.4.8, num. 3, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en elegir alternativas para solucionar problemas y ejecutar acciones concretas y coherentes con lo decidido. Refleja la conducta de tomar en cuenta la opinión técnica de los colaboradores al analizar las alternativas, sin renunciar a decidir.", true]]}, {"id": "CO-178", "niv": 2, "e": "Frente a los 20 expedientes del profesional incapacitado, la conducta que mejor refleja la toma de decisiones es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 3, sustituido por el art. 1 del Decreto 815 de 2018 (nivel profesional con personal a cargo: Toma de decisiones)", "o": [["A", "asumir usted personalmente los 20 expedientes, para no aumentar la carga de los demás profesionales.", "Muestra compromiso, pero descuida su función de coordinación y no usa la capacidad del grupo.", false], ["B", "redistribuir de inmediato los expedientes según la carga de cada uno, para que no venzan términos, e informar a la subdirección.", "Refleja la competencia «Toma de decisiones» (Decreto 1083 de 2015, art. 2.2.4.8, num. 3, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en elegir alternativas para solucionar problemas y ejecutar acciones concretas y coherentes con lo decidido. Corresponde a efectuar los cambios necesarios para solucionar los problemas detectados y hacerse responsable de la decisión tomada.", true], ["C", "esperar a que talento humano designe un reemplazo para que asuma los expedientes durante la incapacidad.", "Aplaza la solución y pone en riesgo los términos de los expedientes mientras se designa un reemplazo.", false]]}]}, {"comp": "comportamental", "rol": "profesional", "tag": "Competencias comportamentales (Decreto 815 de 2018) · Nivel profesional · Profesional con personal a cargo: toma de decisiones y desarrollo de personal", "texto": "Usted es profesional especializado y coordina el grupo técnico de la oficina de gestión del riesgo de una gobernación, con cuatro profesionales a cargo: Sergio maneja sistemas de información geográfica, Paula tiene amplia experiencia con comunidades rurales, y los otros dos son ingenieros. A las 6:00 p. m. llega el reporte preliminar de una creciente súbita en un municipio de montaña, con información incompleta sobre viviendas afectadas. El protocolo de la oficina permite desplazar equipos técnicos de evaluación con las medidas de seguridad previstas.", "items": [{"id": "CO-179", "niv": 3, "e": "Con la información incompleta de las 6:00 p. m., la conducta que mejor refleja la toma de decisiones es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 3, sustituido por el art. 1 del Decreto 815 de 2018 (nivel profesional con personal a cargo: Toma de decisiones)", "o": [["A", "esperar el reporte oficial completo del municipio
