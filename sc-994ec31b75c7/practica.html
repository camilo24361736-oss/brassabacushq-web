 produce si se aprueba el período de prueba con evaluación satisfactoria; con calificación no satisfactoria no se adquieren derechos de carrera.", false]]}, {"id": "EP-115", "niv": 3, "e": "Si Julián no supera el período de prueba en el empleo de profesional universitario, la consecuencia será que", "f": "Ley 909 de 2004, art. 31, num. 5", "o": [["A", "quedará en el empleo de profesional en calidad de provisional hasta que se convoque un nuevo concurso.", "La ley no convierte el nombramiento en provisional; si no aprueba, el empleado regresa a su empleo anterior y conserva su inscripción.", false], ["B", "su nombramiento se declarará insubsistente y perderá también los derechos de carrera que tenía como auxiliar.", "Para el empleado ya inscrito en carrera la ley prevé una regla distinta: no pierde su inscripción, sino que regresa al empleo que venía desempeñando.", false], ["C", "regresará al empleo de auxiliar administrativo del que es titular y conservará su inscripción en la carrera.", "El art. 31, num. 5, de la Ley 909 de 2004 prevé que el empleado inscrito en carrera que supere un concurso sea nombrado en período de prueba y, si no obtiene calificación satisfactoria, regrese al empleo que venía desempeñando y conserve su inscripción en la carrera.", true]]}, {"id": "EP-116", "niv": 2, "e": "Mientras se califica el período de prueba de Julián, el empleo de auxiliar administrativo del cual es titular", "f": "Ley 909 de 2004, art. 31, num. 5; Decreto 1083 de 2015, art. 2.2.5.2.2", "o": [["A", "puede proveerse por encargo o mediante nombramiento provisional.", "El art. 31, num. 5, de la Ley 909 de 2004 establece que, mientras se produce la calificación del período de prueba, el cargo del cual era titular el empleado ascendido puede proveerse por encargo o mediante nombramiento provisional.", true], ["B", "debe permanecer vacante, porque cualquier nombramiento afectaría el derecho de Julián a regresar.", "La ley sí permite proveer ese empleo durante el período de prueba; lo que se protege es que Julián pueda regresar si no aprueba, lo cual es compatible con una provisión transitoria.", false], ["C", "debe proveerse con la siguiente persona de la lista de elegibles en período de prueba.", "El empleo de Julián no está en vacancia definitiva mientras dura su período de prueba (Decreto 1083 de 2015, art. 2.2.5.2.2, num. 7, lo trata como vacancia temporal); por eso no se provee en forma definitiva con la lista.", false]]}]}, {"comp": "empleo_publico", "rol": "asistencial", "tag": "Empleo público, carrera y régimen disciplinario · Nivel asistencial · Nombramiento y posesión", "texto": "Usted es auxiliar administrativo de la Secretaría General de un municipio de quinta categoría y apoya los trámites de vinculación de personal. Carolina, elegida para un empleo de secretaria ejecutiva, aceptó por escrito el nombramiento el martes 3 de febrero de 2026. Carolina vive en otro departamento y pregunta si puede pedir más tiempo para posesionarse mientras organiza su traslado. Además, le pide a usted la lista de documentos que debe entregar para el acto de posesión. En febrero de 2026 no hay días festivos.", "items": [{"id": "EP-117", "niv": 3, "e": "Sin prórroga, y contando el término de diez días hábiles que da el reglamento para posesionarse, la fecha límite para que Carolina tome posesión es el", "f": "Decreto 1083 de 2015, art. 2.2.5.1.7", "o": [["A", "martes 10 de febrero de 2026.", "Corresponde a contar solo cinco días hábiles; el plazo del reglamento es de diez días hábiles siguientes a la aceptación.", false], ["B", "viernes 13 de febrero de 2026.", "Resulta de contar diez días calendario desde la aceptación; el plazo se cuenta en días hábiles, por lo que no se incluyen sábados ni domingos.", false], ["C", "martes 17 de febrero de 2026.", "El art. 2.2.5.1.7 del Decreto 1083 de 2015 da diez días hábiles siguientes a la aceptación para posesionarse. Contando desde el miércoles 4 de febrero, sin sábados ni domingos y sin festivos, el décimo día hábil es el martes 17 de febrero de 2026.", true]]}, {"id": "EP-118", "niv": 2, "e": "Frente a la solicitud de más tiempo, usted le informa a Carolina que", "f": "Decreto 1083 de 2015, art. 2.2.5.1.7", "o": [["A", "puede pedir por escrito una prórroga de hasta noventa días hábiles, porque no reside en el lugar donde se ubica el empleo.", "El art. 2.2.5.1.7 del Decreto 1083 de 2015 permite prorrogar por escrito el término de posesión hasta por noventa días hábiles más si el designado no reside en el lugar del empleo o por causa justificada a juicio del nominador.", true], ["B", "no es posible ampliar el plazo y, si no se posesiona en diez días, deberá participar de nuevo en el concurso.", "El reglamento sí prevé la prórroga del término de posesión en las circunstancias de Carolina; negar esa posibilidad desconoce el art. 2.2.5.1.7 del Decreto 1083 de 2015.", false], ["C", "puede posesionarse en cualquier momento mientras la lista de elegibles esté vigente, sin necesidad de solicitarlo.", "La posesión tiene un plazo reglamentario; la vigencia de la lista no reemplaza ese término ni exime de pedir la prórroga por escrito.", false]]}, {"id": "EP-119", "niv": 1, "e": "Entre los documentos que Carolina debe presentar como requisito para la posesión se encuentra", "f": "Ley 190 de 1995, art. 13", "o": [["A", "la declaración juramentada de bienes y rentas.", "El art. 13 de la Ley 190 de 1995 exige como requisito para la posesión y el desempeño del cargo la declaración bajo juramento del nombrado sobre sus bienes y rentas, que se actualiza cada año y al retiro.", true], ["B", "la constancia de afiliación a un sindicato de servidores públicos de la entidad.", "La afiliación sindical es un derecho voluntario de asociación; exigirla como requisito de posesión sería contrario a la libertad sindical.", false], ["C", "el certificado de la evaluación del desempeño de su último empleo público.", "La evaluación del desempeño no es un requisito general de posesión; se exige, por ejemplo, para encargos o comisiones, no para tomar posesión de un empleo.", false]]}]}, {"comp": "empleo_publico", "rol": "general", "tag": "Empleo público, carrera y régimen disciplinario · Comisión para desempeñar empleos de libre nombramiento", "texto": "Ricardo es profesional universitario con derechos de carrera en una secretaría de Movilidad de Bogotá y su última evaluación del desempeño fue sobresaliente. El secretario de Ambiente lo invitó a ocupar el empleo de jefe de oficina, de libre nombramiento y remoción, en esa otra entidad del distrito. Ricardo le consulta a usted, que trabaja en la Dirección de Talento Humano de Movilidad, cómo puede aceptar sin perder su empleo de carrera y qué pasa si después renuncia al empleo directivo.", "items": [{"id": "EP-120", "niv": 2, "e": "Para conservar su empleo de carrera mientras ocupa el cargo de jefe de oficina, Ricardo debe", "f": "Ley 909 de 2004, art. 26", "o": [["A", "solicitar un encargo en el empleo de jefe de oficina, porque es la figura que protege los derechos de carrera.", "El encargo es un movimiento dentro de la planta de la entidad; para ocupar un empleo de libre nombramiento en otra entidad con nombramiento ordinario, la figura prevista es la comisión del art. 26 de la Ley 909 de 2004.", false], ["B", "renunciar al empleo de carrera, porque la ley prohíbe tener derechos de carrera y ocupar un empleo de libre nombramiento.", "La ley no exige renunciar: el art. 26 de la Ley 909 de 2004 prevé precisamente la comisión para que el empleado de carrera desempeñe empleos de libre nombramiento sin perder sus derechos.", false], ["C", "obtener comisión para desempeñar el empleo de libre nombramiento, a la cual tiene derecho por su evaluación sobresaliente.", "El art. 26 de la Ley 909 de 2004 reconoce a los empleados de carrera con evaluación sobresaliente el derecho a comisión hasta por tres años, prorrogable por un término igual, para desempeñar empleos de libre nombramiento y remoción en la misma entidad o en otra.", true]]}, {"id": "EP-121", "niv": 2, "e": "Si Ricardo se posesionara en el empleo de jefe de oficina sin que se le haya otorgado la comisión, la consecuencia sería", "f": "Ley 909 de 2004, art. 42, num. 2", "o": [["A", "una falta disciplinaria leve, pero conservaría su inscripción en el registro de carrera.", "La consecuencia prevista en la ley no es disciplinaria sino la pérdida de los derechos de carrera (art. 42, num. 2, de la Ley 909 de 2004).", false], ["B", "el retiro de la carrera administrativa y la pérdida de los derechos inherentes a ella.", "El art. 42, num. 2, de la Ley 909 de 2004 establece que el empleado pierde los derechos de carrera cuando toma posesión de un cargo de libre nombramiento y remoción sin haber mediado la comisión respectiva.", true], ["C", "una vacancia temporal del empleo de carrera hasta que Ricardo regrese a Movilidad.", "Sin comisión no se genera vacancia temporal con derecho a regresar; la ley prevé la pérdida de los derechos de carrera.", false]]}, {"id": "EP-122", "niv": 3, "e": "Si, ya en comisión, Ricardo renuncia al empleo de jefe de oficina antes de que venza la comisión, deberá", "f": "Ley 909 de 2004, art. 26", "o": [["A", "asumir el empleo respecto del cual tiene derechos de carrera; si no lo hace, la entidad declarará la vacancia y lo proveerá en forma definitiva.", "El art. 26 de la Ley 909 de 2004 dispone que, al terminar la comisión o cuando el empleado renuncie o sea retirado del cargo de libre nombramiento antes del vencimiento, debe asumir el empleo de carrera; de no hacerlo, la entidad declara la vacancia, lo provee definitivamente e informa a la CNSC.", true], ["B", "solicitar a la CNSC su reubicación en un empleo de libre nombramiento equivalente en Movilidad.", "La comisión no da derecho a ser reubicado en otro empleo de libre nombramiento; su efecto es que el empleado regrese al empleo respecto del cual tiene derechos de carrera.", false], ["C", "esperar a que venza el término de la comisión para regresar, porque la comisión no puede interrumpirse.", "La ley prevé expresamente que, si el empleado renuncia al cargo de libre nombramiento antes del vencimiento de la comisión, debe asumir el empleo de carrera; no tiene que esperar el vencimiento.", false]]}]}, {"comp": "empleo_publico", "rol": "general", "tag": "Empleo público, carrera y régimen disciplinario · Retiro del servicio", "texto": "En la Secretaría de Salud de un departamento ocurrieron tres situaciones que debe atender la oficina de talento humano, donde usted trabaja: Felipe, técnico de carrera, terminó sus vacaciones el viernes y no se ha vuelto a presentar desde el lunes, sin dar explicación, y ya completa cuatro días hábiles de ausencia; el gobernador, a solicitud de la secretaria de despacho, decidió prescindir del asesor de ese despacho, empleo de libre nombramiento y remoción; y una auxiliar presentó renuncia escrita, libre y espontánea, para dedicarse a un negocio familiar.", "items": [{"id": "EP-123", "niv": 2, "e": "Frente a la situación de Felipe, la entidad puede", "f": "Ley 909 de 2004, art. 41, lit. i; Decreto 1083 de 2015 (abandono del cargo)", "o": [["A", "declararle insubsistente el nombramiento por calificación no satisfactoria en la evaluación del desempeño.", "La insubsistencia por calificación no satisfactoria exige una evaluación con ese resultado; la ausencia injustificada de Felipe corresponde a la causal de abandono del cargo, que es distinta.", false], ["B", "adelantar el procedimiento para declarar la vacancia del empleo por abandono del cargo, sin perjuicio de la acción disciplinaria.", "El Decreto 1083 de 2015 considera abandono del cargo no reasumir funciones al vencimiento de las vacaciones o dejar de concurrir por tres días consecutivos sin justa causa, y el art. 41, lit. i, de la Ley 909 de 2004 lo prevé como causal de retiro mediante declaratoria de vacancia.", true], ["C", "descontarle los días de su próximo período de vacaciones, porque la ausencia sin justificación se compensa con descanso.", "La ausencia injustificada no se compensa con vacaciones; el reglamento la trata como abandono del cargo cuando no se reasumen funciones al vencimiento de las vacaciones o se dejan de prestar por tres días consecutivos.", false]]}, {"id": "EP-124", "niv": 2, "e": "Para retirar al asesor del despacho de Salud, el gobernador debe tener en cuenta que", "f": "Ley 909 de 2004, art. 41, parágrafo 2", "o": [["A", "debe solicitar autorización previa a la Comisión Nacional del Servicio Civil.", "La CNSC administra y vigila la carrera; el retiro de un empleado de libre nombramiento y remoción no requiere su autorización previa.", false], ["B", "debe motivar el acto de insubsistencia y demostrar que el asesor incumplió sus funciones.", "La motivación es exigible para el retiro de los empleados de carrera; la remoción en empleos de libre nombramiento es discrecional y se hace mediante acto no motivado.", false], ["C", "la remoción es discrecional y se hace mediante acto no motivado.", "El parágrafo 2 del art. 41 de la Ley 909 de 2004 dispone que la competencia para remover a los empleados de libre nombramiento y remoción es discrecional y se ejerce mediante acto no motivado, a diferencia del retiro de los de carrera, que es reglado y motivado.", true]]}, {"id": "EP-125", "niv": 1, "e": "En relación con la renuncia de la auxiliar, el retiro del servicio se produce", "f": "Ley 909 de 2004, art. 41, lit. d; Ley 1952 de 2019, art. 38, num. 18", "o": [["A", "cuando la autoridad nominadora acepta regularmente la renuncia presentada por la servidora.", "El art. 41, lit. d, de la Ley 909 de 2004 establece como causal de retiro la renuncia regularmente aceptada; mientras no se acepte, la servidora debe seguir en sus funciones (Ley 1952 de 2019, art. 38, num. 18).", true], ["B", "solo si la Comisión de Personal emite concepto favorable sobre los motivos de la renuncia.", "La ley no condiciona la aceptación de la renuncia al concepto de la Comisión de Personal; corresponde al nominador aceptarla.", false], ["C", "desde el momento en que la auxiliar radica el escrito, aunque la entidad no se pronuncie.", "La causal legal es la renuncia regularmente aceptada; la sola presentación del escrito no produce el retiro.", false]]}]}, {"comp": "empleo_publico", "rol": "profesional", "tag": "Empleo público, carrera y régimen disciplinario · Nivel profesional · Evaluación del desempeño laboral", "texto": "Usted es profesional universitario de la Secretaría de Educación de un departamento y, como jefe inmediato, evalúa a cuatro técnicos de carrera con el sistema tipo de la CNSC. En mayo, el secretario de despacho le remite un informe documentado según el cual uno de los técnicos ha dejado vencer de forma reiterada los términos de los trámites a su cargo. Otro técnico, inconforme con su calificación definitiva del período anterior, le pregunta qué recursos puede interponer. Además, un servidor recién trasladado a su grupo le pide que le explique cómo está organizado el período de evaluación.", "items": [{"id": "EP-126", "niv": 1, "e": "Al servidor recién trasladado usted le explica que la calificación del período anual", "f": "Ley 909 de 2004, art. 38; Acuerdo CNSC 6176 de 2018", "o": [["A", "depende de una sola evaluación que el jefe realiza al final del año.", "La ley exige dos evaluaciones parciales dentro del período anual; una sola evaluación al cierre no cumple el art. 38 de la Ley 909 de 2004.", false], ["B", "se construye con cuatro evaluaciones trimestrales obligatorias.", "La ley habla de dos evaluaciones parciales al año, no de cuatro trimestrales; las entidades pueden hacer seguimientos, pero el esquema legal es semestral.", false], ["C", "incluye dos evaluaciones parciales en el año.", "El art. 38 de la Ley 909 de 2004 dispone que el resultado de la evaluación es la calificación del período anual, que debe incluir dos evaluaciones parciales; el sistema tipo de la CNSC (Acuerdo 6176 de 2018) las organiza por semestres.", true]]}, {"id": "EP-127", "niv": 2, "e": "Frente al informe documentado sobre el desempeño deficiente del técnico, el jefe del organismo puede", "f": "Ley 909 de 2004, art. 38", "o": [["A", "declarar insubsistente el nombramiento con base en el informe, sin necesidad de evaluar al técnico.", "La insubsistencia de un empleado de carrera exige una calificación no satisfactoria producto de la evaluación (arts. 41 y 43 de la Ley 909 de 2004); un informe no reemplaza la evaluación.", false], ["B", "ordenar por escrito que se evalúen y califiquen de inmediato los servicios del técnico.", "El art. 38 de la Ley 909 de 2004 faculta al jefe del organismo para ordenar, por escrito, la evaluación y calificación inmediata cuando recibe información debidamente soportada de que el desempeño de un empleado es deficiente.", true], ["C", "esperar al cierre del período anual, porque antes de esa fecha no es posible calificar al empleado.", "La ley prevé una excepción: si el jefe del organismo recibe información debidamente soportada de desempeño deficiente, puede ordenar una evaluación inmediata sin esperar el cierre del período.", false]]}, {"id": "EP-128", "niv": 2, "e": "Al técnico inconforme con su calificación definitiva usted le informa que contra ella proceden", "f": "Ley 909 de 2004, art. 38", "o": [["A", "los recursos de reposición y de apelación.", "El art. 38 de la Ley 909 de 2004 dispone que sobre la evaluación definitiva del desempeño proceden los recursos de reposición y de apelación.", true], ["B", "únicamente el recurso de reposición ante usted como evaluador.", "Limitarlo a la reposición confunde esta regla con la del acto de insubsistencia (art. 43 de la Ley 909 de 2004); contra la evaluación definitiva la ley admite también la apelación.", false], ["C", "la acción de tutela como único medio, porque la calificación es un acto de trámite.", "La calificación definitiva es un acto que admite recursos en sede administrativa; la ley prevé expresamente la reposición y la apelación, por lo que la tutela no es el único medio.", false]]}]}, {"comp": "empleo_publico", "rol": "profesional", "tag": "Empleo público, carrera y régimen disciplinario · Nivel profesional · Calificación no satisfactoria", "texto": "Usted es profesional especializado de talento humano en una empresa social del Estado del orden municipal y apoya los asuntos de carrera administrativa. Un auxiliar de carrera obtuvo calificación definitiva no satisfactoria, que quedó en firme. El gerente le pide proyectar el acto que corresponde y le pregunta qué recurso procede contra esa decisión. También quiere saber qué ocurre si el auxiliar interpone el recurso a tiempo y la entidad no lo resuelve.", "items": [{"id": "EP-129", "niv": 1, "e": "Ante la calificación no satisfactoria en firme, el acto que usted debe proyectar es", "f": "Ley 909 de 2004, arts. 41 y 43", "o": [["A", "una sanción disciplinaria de suspensión, previa apertura de investigación.", "La calificación no satisfactoria no es una falta disciplinaria por sí misma; su consecuencia legal es la insubsistencia del nombramiento, no una sanción disciplinaria.", false], ["B", "la declaratoria motivada de insubsistencia del nombramiento.", "El art. 43 de la Ley 909 de 2004 ordena a la autoridad nominadora declarar insubsistente, en forma motivada, el nombramiento del empleado de carrera que obtenga calificación no satisfactoria; el art. 41, lit. b, lo prevé como causal de retiro.", true], ["C", "un traslado a otra dependencia para que el auxiliar mejore su desempeño.", "El traslado es un movimiento de personal para proveer vacantes, no una consecuencia de la calificación no satisfactoria; la ley ordena la insubsistencia.", false]]}, {"id": "EP-130", "niv": 2, "e": "Contra el acto que declara la insubsistencia por calificación no satisfactoria procede", "f": "Ley 909 de 2004, art. 43", "o": [["A", "el recurso de apelación ante la Comisión Nacional del Servicio Civil.", "La ley no prevé apelación ante la CNSC contra este acto; el recurso que procede es el de reposición ante quien lo expidió.", false], ["B", "el recurso de queja ante el superior jerárquico.", "El recurso de queja procede cuando se rechaza la apelación; no es el recurso previsto contra la declaratoria de insubsistencia.", false], ["C", "el recurso de reposición.", "El art. 43, num. 2, de la Ley 909 de 2004 establece que contra el acto que declara la insubsistencia del nombramiento por calificación no satisfactoria procede el recurso de reposición.", true]]}, {"id": "EP-131", "niv": 3, "e": "Si el auxiliar presenta el recurso dentro del término y la entidad no lo resuelve en el plazo legal, la consecuencia es que", "f": "Ley 909 de 2004, art. 43, num. 3", "o": [["A", "se configura silencio administrativo negativo, y el auxiliar puede demandar en nulidad y restablecimiento del derecho ante la jurisdicción.", "La Ley 909 de 2004 prevé una consecuencia especial y favorable al empleado: la decisión se entiende revocada, no un silencio negativo.", false], ["B", "el recurso se entiende rechazado y la insubsistencia queda en firme a los treinta días hábiles.", "La ley no fija ese efecto ni ese término; dispone que la decisión se entiende revocada si la administración no se pronuncia dentro de cuarenta y cinco días calendario.", false], ["C", "la insubsistencia se entiende revocada si la entidad no se pronuncia en cuarenta y cinco días calendario.", "El art. 43, num. 3, de la Ley 909 de 2004 dispone que la declaratoria de insubsistencia se entiende revocada si, interpuestos los recursos en término, la administración no se pronuncia dentro de los cuarenta y cinco días calendario siguientes; en ese evento la calificación que la originó se tiene como satisfactoria en el puntaje mínimo.", true]]}]}, {"comp": "empleo_publico", "rol": "general", "tag": "Empleo público, carrera y régimen disciplinario · Obligación de evaluar y usos de la evaluación", "texto": "En la Secretaría de Gobierno de una alcaldía, el jefe de una dependencia, empleado de libre nombramiento y remoción, se niega a evaluar a los empleados de carrera a su cargo porque considera que «es un trámite sin utilidad». Una de esas empleadas presenta un dictamen de su EPS en el que se recomienda suspender su evaluación mientras se recupera de afectaciones de salud derivadas de un acoso laboral que denunció. Usted, que trabaja en la oficina de talento humano, debe orientar a la secretaria de despacho sobre estos asuntos y sobre para qué sirven los resultados de la evaluación.", "items": [{"id": "EP-132", "niv": 2, "e": "Sobre la negativa del jefe a evaluar a sus empleados, usted le advierte a la secretaria que", "f": "Ley 909 de 2004, art. 39", "o": [["A", "si el jefe no evalúa, los empleados quedan calificados de forma automática con el puntaje máximo.", "La ley no prevé una calificación automática por omisión del evaluador; prevé la responsabilidad disciplinaria del evaluador y mantiene su obligación de evaluar.", false], ["B", "incumplir el deber de evaluar es falta grave sancionable disciplinariamente, y el jefe sigue obligado a evaluar.", "El art. 39 de la Ley 909 de 2004 dispone que el incumplimiento del deber de evaluar constituye falta grave sancionable disciplinariamente, sin perjuicio de que se cumpla la obligación de evaluar con el procedimiento señalado.", true], ["C", "la evaluación es potestativa para los jefes de libre nombramiento y puede reemplazarse por un informe de gestión.", "La evaluación no es potestativa: el art. 39 de la Ley 909 de 2004 la establece como obligación de quienes deben evaluar, siguiendo la metodología del instrumento.", false]]}, {"id": "EP-133", "niv": 3, "e": "Frente al dictamen de la EPS presentado por la empleada, lo procedente es", "f": "Ley 1010 de 2006, art. 16", "o": [["A", "suspender su evaluación del desempeño por el tiempo que determine el dictamen médico.", "El art. 16 de la Ley 1010 de 2006 dispone que, previo dictamen de la EPS a la que está afiliado el sujeto pasivo del acoso laboral, se suspenderá la evaluación del desempeño por el tiempo que determine el dictamen.", true], ["B", "trasladar su evaluación a la Comisión de Personal para que la califique un evaluador distinto al jefe.", "La ley no ordena cambiar de evaluador ni trasladar la evaluación a la Comisión de Personal; ordena suspenderla por el tiempo que indique el dictamen.", false], ["C", "evaluarla normalmente, porque el dictamen de la EPS solo tiene efectos para el pago de incapacidades.", "La Ley 1010 de 2006 da al dictamen de la EPS un efecto específico frente a la evaluación del desempeño de la víctima de acoso: su suspensión.", false]]}, {"id": "EP-134", "niv": 1, "e": "Sobre la utilidad de los resultados de la evaluación, usted le explica a la secretaria que la ley los exige, entre otros, para", "f": "Ley 909 de 2004, art. 38", "o": [["A", "fijar el salario básico del empleo y sus incrementos para el año siguiente.", "El salario de los empleos se fija según la escala salarial de la entidad territorial y las normas de remuneración; la evaluación no fija la asignación básica.", false], ["B", "conceder becas o comisiones de estudio y planificar la capacitación.", "El art. 38 de la Ley 909 de 2004 señala que los resultados de la evaluación deben tenerse en cuenta, entre otros, para adquirir derechos de carrera, ascender, conceder becas o comisiones de estudio, otorgar incentivos, planificar la capacitación y determinar la permanencia en el servicio.", true], ["C", "decidir la afiliación del empleado al régimen de pensiones.", "La afiliación a pensiones es una obligación del sistema de seguridad social que no depende de la evaluación del desempeño.", false]]}]}, {"comp": "empleo_publico", "rol": "asistencial", "tag": "Empleo público, carrera y régimen disciplinario · Nivel asistencial · Licencia ordinaria", "texto": "Usted es auxiliar administrativo de la oficina de personal de una corporación autónoma regional de la Orinoquía. Gloria, secretaria de carrera, disfrutó entre febrero y marzo de 2026 de una licencia ordinaria de 45 días hábiles para atender asuntos familiares. En octubre de 2026 vuelve a solicitar licencia ordinaria, esta vez de 25 días hábiles, para un viaje personal; no aduce ninguna causa especial que justifique una prórroga. Gloria también pregunta si durante la licencia la corporación le seguirá pagando el salario y la seguridad social.", "items": [{"id": "EP-135", "niv": 1, "e": "Sobre el alcance de la licencia ordinaria, usted le explica a Gloria que puede concederse", "f": "Decreto 1083 de 2015, art. 2.2.5.5.5", "o": [["A", "hasta por doce meses, prorrogables por un término igual hasta por dos veces.", "Ese es el término de la licencia no remunerada para adelantar estudios (art. 2.2.5.5.6 del Decreto 1083 de 2015), no el de la licencia ordinaria.", false], ["B", "hasta por noventa días calendario al año, sin posibilidad de prórroga.", "La licencia ordinaria se cuenta en días hábiles y admite prórroga; el término de noventa días calendario no corresponde a la norma.", false], ["C", "hasta por sesenta días hábiles al año, continuos o discontinuos, prorrogables hasta treinta días hábiles más por causa justificada.", "El art. 2.2.5.5.5 del Decreto 1083 de 2015 establece que la licencia ordinaria se otorga a solicitud del empleado, sin remuneración, hasta por sesenta días hábiles al año, continuos o discontinuos, prorrogables hasta treinta días hábiles más por causa justificada a juicio del nominador.", true]]}, {"id": "EP-136", "niv": 3, "e": "Si no se invoca causa justificada para una prórroga, el número máximo de días hábiles de licencia ordinaria que pueden concederse a Gloria en octubre de 2026 es de", "f": "Decreto 1083 de 2015, art. 2.2.5.5.5", "o": [["A", "15 días hábiles.", "Gloria ya usó 45 de los 60 días hábiles que permite el art. 2.2.5.5.5 del Decreto 1083 de 2015 en el año; le quedan 60 − 45 = 15 días hábiles. La prórroga de hasta 30 días más exige causa justificada a juicio del nominador, que no se invocó.", true], ["B", "25 días hábiles.", "Conceder los 25 días pedidos llevaría el total del año a 70 días hábiles, por encima del límite de 60, sin que exista la causa justificada que permitiría la prórroga.", false], ["C", "45 días hábiles.", "Resulta de sumar los 15 días disponibles a la prórroga de 30 días, pero la prórroga solo procede por causa justificada a juicio del nominador, y en el caso no se invocó ninguna.", false]]}, {"id": "EP-137", "niv": 2, "e": "Sobre el pago durante la licencia ordinaria, usted le informa a Gloria que", "f": "Decreto 1083 de 2015, arts. 2.2.5.5.5 y 2.2.5.5.7", "o": [["A", "no recibirá salario y deberá asumir por su cuenta la totalidad de los aportes a la seguridad social.", "El reglamento ordena a la entidad seguir pagando los aportes a seguridad social en la proporción que le corresponde; no todos quedan a cargo de la servidora.", false], ["B", "la corporación le pagará el salario completo, porque la licencia es un derecho del servidor.", "La licencia ordinaria es no remunerada (Decreto 1083 de 2015, art. 2.2.5.5.5); durante ella no se paga la remuneración del empleo.", false], ["C", "no recibirá salario ni se le contará ese tiempo como servicio, pero la entidad seguirá pagando los aportes a seguridad social que le corresponden.", "El art. 2.2.5.5.7 del Decreto 1083 de 2015 dispone que el tiempo de las licencias no remuneradas no es computable como servicio activo ni se paga remuneración, pero la entidad debe seguir pagando los aportes al sistema de seguridad social en la proporción que le corresponde por ley.", true]]}]}, {"comp": "empleo_publico", "rol": "tecnico", "tag": "Empleo público, carrera y régimen disciplinario · Nivel técnico · Licencia por luto", "texto": "Usted es técnico administrativo de la Dirección de Talento Humano de un instituto distrital de Bogotá y tramita las novedades de nómina. Esta semana recibe tres casos: Martha, auxiliar de archivo, informa que falleció su abuelo paterno; Hernán, conductor, informa que falleció su cuñado, hermano de su esposa, y pide unos días para acompañar a la familia; y Sofía, profesional, que estaba disfrutando sus vacaciones, informa que falleció su madre.", "items": [{"id": "EP-138", "niv": 2, "e": "Para el caso de Martha, usted proyecta", "f": "Decreto 1083 de 2015, art. 2.2.5.5.15; Ley 1635 de 2013", "o": [["A", "una licencia por luto de cinco días calendario contados desde la radicación de la solicitud.", "La licencia por luto se reconoce en días hábiles y se cuenta a partir del fallecimiento, no en días calendario desde la solicitud.", false], ["B", "un acto que le confiere licencia por luto de cinco días hábiles.", "El art. 2.2.5.5.15 del Decreto 1083 de 2015, en concordancia con la Ley 1635 de 2013, reconoce cinco días hábiles de licencia por luto por el fallecimiento de familiares hasta el segundo grado de consanguinidad, como el abuelo; la jefatura de personal la confiere por acto motivado.", true], ["C", "un permiso remunerado de tres días hábiles, porque el abuelo no está cubierto por la licencia por luto.", "El abuelo es pariente en segundo grado de consanguinidad, que sí está cubierto por la licencia por luto; no es necesario acudir al permiso remunerado.", false]]}, {"id": "EP-139", "niv": 3, "e": "Frente a la solicitud de Hernán, lo procedente es indicarle que", "f": "Decreto 1083 de 2015, arts. 2.2.5.5.15 y 2.2.5.5.17", "o": [["A", "no tiene derecho a licencia por luto, pero puede solicitar por escrito un permiso remunerado de hasta tres días hábiles con justa causa.", "El cuñado es pariente en segundo grado de afinidad y el art. 2.2.5.5.15 del Decreto 1083 de 2015 cubre solo hasta el primero de afinidad; Hernán puede pedir permiso remunerado hasta por tres días hábiles cuando medie justa causa, que autoriza o niega el nominador o su delegado (art. 2.2.5.5.17).", true], ["B", "tiene derecho a licencia por luto, porque el cuñado es pariente en segundo grado y la ley cubre hasta ese grado en todos los casos.", "La licencia cubre hasta el segundo grado de consanguinidad, pero solo hasta el primero de afinidad; el cuñado es pariente en segundo grado de afinidad y queda por fuera.", false], ["C", "debe pedir licencia ordinaria, porque es la única figura que permite ausentarse por motivos familiares.", "La licencia ordinaria no es la única opción; el permiso remunerado de hasta tres días hábiles procede cuando medie justa causa, como el fallecimiento de un familiar no cubierto por la licencia por luto.", false]]}, {"id": "EP-140", "niv": 2, "e": "En el caso de Sofía, la licencia por luto tiene como efecto que", "f": "Decreto 1083 de 2015, art. 2.2.5.5.16", "o": [["A", "la servidora debe reintegrarse al trabajo para que se le pueda conceder la licencia por luto.", "No se exige reintegro previo; la licencia por luto interrumpe directamente las vacaciones y, al terminar, estas se reanudan.", false], ["B", "las vacaciones se interrumpen y se reanudan una vez termine la licencia por luto.", "El art. 2.2.5.5.16 del Decreto 1083 de 2015 establece que la licencia por luto interrumpe las vacaciones, la licencia ordinaria y la licencia no remunerada para estudios, y que, cumplida aquella, se reanudan las situaciones en que se encontraba el servidor.", true], ["C", "las vacaciones absorben la licencia, porque Sofía ya estaba separada del servicio.", "El reglamento dispone lo contrario: la licencia por luto interrumpe las vacaciones; no queda absorbida por ellas.", false]]}]}, {"comp": "empleo_publico", "rol": "general", "tag": "Empleo público, carrera y régimen disciplinario · Permisos", "texto": "En la Secretaría de Desarrollo Económico de una gobernación, tres servidores hacen solicitudes a la oficina de talento humano, donde usted trabaja: un técnico pide permiso remunerado para asistir a la diligencia de entrega de un inmueble que compró; una profesional, empleada de carrera, fue invitada por una universidad pública a dictar una cátedra de cuatro horas semanales en horario laboral y pregunta si puede hacerlo; y la misma profesional pregunta si puede recibir los honorarios de esa cátedra además de su salario.", "items": [{"id": "EP-141", "niv": 1, "e": "Sobre la solicitud del técnico, usted le informa que el permiso remunerado", "f": "Decreto 1083 de 2015, art. 2.2.5.5.17", "o": [["A", "puede concederse hasta por cinco días hábiles y lo autoriza el jefe inmediato.", "El término máximo del permiso remunerado es de tres días hábiles, y la facultad de autorizarlo corresponde al nominador o a su delegado.", false], ["B", "solo procede por calamidad doméstica comprobada; para trámites personales debe pedir licencia ordinaria.", "La norma no limita el permiso a la calamidad doméstica; exige justa causa, que el nominador valora.", false], ["C", "puede concederse hasta por tres días hábiles cuando medie justa causa, y lo autoriza o niega el nominador o su delegado.", "El art. 2.2.5.5.17 del Decreto 1083 de 2015 permite solicitar por escrito permiso remunerado hasta por tres días hábiles cuando medie justa causa, y atribuye al nominador o a su delegado la facultad de autorizarlo o negarlo.", true]]}, {"id": "EP-142", "niv": 1, "e": "Frente a la cátedra universitaria en horario laboral, usted le explica a la profesional que", "f": "Decreto 1083 de 2015, art. 2.2.5.5.20", "o": [["A", "puede otorgársele permiso remunerado para la docencia en hora cátedra hasta por cinco horas semanales, según las necesidades del servicio.", "El art. 2.2.5.5.20 del Decreto 1083 de 2015 permite otorgar permiso remunerado para ejercer la docencia universitaria en hora cátedra hasta por cinco horas semanales, sujeto a las necesidades del servicio a juicio del jefe del organismo; las cuatro horas pedidas están dentro del límite.", true], ["B", "no puede hacerlo, porque toda actividad docente debe realizarse por fuera de la jornada laboral.", "El reglamento prevé un permiso remunerado específico para la docencia universitaria en hora cátedra dentro de la jornada, hasta cinco horas semanales.", false], ["C", "debe pedir una comisión de estudios, porque es la figura prevista para actividades académicas.", "La comisión de estudios es para que el empleado reciba formación, no para que dicte clases; para la docencia universitaria en hora cátedra existe un permiso específico.", false]]}, {"id": "EP-143", "niv": 3, "e": "Sobre los honorarios de la cátedra, usted le responde a la profesional que", "f": "Constitución Política, art. 128; Ley 4 de 1992, art. 19; Ley 1952 de 2019, art. 39, num. 13", "o": [["A", "puede recibirlos, porque los honorarios por hora cátedra son una excepción legal a la prohibición de recibir más de una asignación del tesoro público.", "El art. 128 de la Constitución prohíbe recibir más de una asignación del tesoro salvo los casos que determine la ley, y el art. 19 de la Ley 4 de 1992 exceptúa los honorarios percibidos por hora cátedra; la Ley 1952 de 2019 (art. 39, num. 13) remite a esas excepciones legales.", true], ["B", "no puede recibirlos, porque la Constitución prohíbe recibir más de una asignación del tesoro público sin excepción.", "La prohibición del art. 128 de la Constitución admite las excepciones que señale la ley, y la Ley 4 de 1992 (art. 19) exceptúa los honorarios por hora cátedra.", false], ["C", "puede recibirlos solo si renuncia a la parte proporcional de su salario por las horas dedicadas a la cátedra.", "La ley no exige descontar el salario; la excepción permite percibir los honorarios de hora cátedra junto con la asignación del empleo, dentro de los límites legales.", false]]}]}, {"comp": "empleo_publico", "rol": "general", "tag": "Empleo público, carrera y régimen disciplinario · Comisiones", "texto": "La subdirección de gestión ambiental de una corporación autónoma regional del Eje Cafetero debe atender varias solicitudes. Un técnico de carrera debe viajar a municipios de la jurisdicción para apoyar visitas de seguimiento a permisos de vertimientos durante varias semanas. Además, dos servidores piden comisión de estudios para cursar una especialización: Paula, nombrada en provisionalidad desde hace tres años, con evaluación de gestión excelente; y Tomás, empleado de carrera, con evaluación sobresaliente en su último año, que se vinculó a la corporación hace ocho meses. Usted, que trabaja en talento humano, debe orientar a la subdirectora.", "items": [{"id": "EP-144", "niv": 2, "e": "Respecto del viaje del técnico, usted indica que la comisión de servicios al interior del país puede otorgarse", "f": "Decreto 1083 de 2015, art. 2.2.5.5.26", "o": [["A", "hasta por quince días calendario, sin posibilidad de prórroga.", "El término reglamentario es de treinta días hábiles con una posible prórroga, no de quince días calendario improrrogables.", false], ["B", "por tiempo indefinido mientras duren las visitas, porque la comisión de servicios es una forma de provisión del empleo.", "La comisión de servicios tiene término reglamentario y no es una forma de provisión de empleos; solo las de inspección o vigilancia o las que por naturaleza exijan más tiempo escapan al término general, a juicio del nominador.", false], ["C", "hasta por treinta días hábiles, prorrogable por razones del servicio y por una sola vez hasta por treinta días hábiles más.", "El art. 2.2.5.5.26 del Decreto 1083 de 2015 dispone que la comisión de servicios al interior se otorga hasta por treinta días hábiles, prorrogable por razones del servicio y por una sola vez hasta por treinta días hábiles más.", true]]}, {"id": "EP-145", "niv": 2, "e": "Frente a la solicitud de Paula, usted concluye que", "f": "Decreto 1083 de 2015, arts. 2.2.5.5.31 y siguientes", "o": [["A", "procede la comisión, siempre que Paula firme el convenio de prestación de servicios por el doble del tiempo.", "El convenio de permanencia es una obligación del comisionado, pero no suple los requisitos de acceso; Paula no cumple el de estar en un empleo de libre nombramiento o tener derechos de carrera.", false], ["B", "no procede la comisión de estudios, porque se exige estar en un empleo de libre nombramiento y remoción o tener derechos de carrera.", "El Decreto 1083 de 2015 (arts. 2.2.5.5.31 y siguientes) exige para la comisión de estudios estar vinculado en un empleo de libre nombramiento y remoción o acreditar derechos de carrera, un año continuo de servicio en la entidad y nivel sobresaliente en la calificación del último año; Paula es provisional.", true], ["C", "procede la comisión, porque lleva más de un año en la entidad y su gestión ha sido excelente.", "Aunque Paula lleve más de un año, la comisión de estudios exige además estar en un empleo de libre nombramiento o tener derechos de carrera, condición que no tiene una servidora provisional.", false]]}, {"id": "EP-146", "niv": 3, "e": "Frente a la solicitud de Tomás, usted concluye que", "f": "Decreto 1083 de 2015, arts. 2.2.5.5.19 y 2.2.5.5.31 y siguientes", "o": [["A", "todavía no procede, porque no acredita un año continuo de servicio en la corporación.", "Además de tener derechos de carrera y evaluación sobresaliente, el Decreto 1083 de 2015 exige acreditar por lo menos un año continuo de servicio en la respectiva entidad; Tomás lleva ocho meses.", true], ["B", "procede, pero solo como permiso académico compensado de hasta dos horas diarias.", "El permiso académico compensado es una figura distinta que Tomás podría pedir, pero no es una forma de conceder la comisión de estudios; la comisión no procede porque falta el año de servicio.", false], ["C", "procede, porque los derechos de carrera y la evaluación sobresaliente son los únicos requisitos exigidos.", "Omite el requisito de antigüedad: el reglamento exige por lo menos un año continuo de servicio en la entidad que otorga la comisión.", false]]}]}, {"comp": "empleo_publico", "rol": "general", "tag": "Empleo público, carrera y régimen disciplinario · Encargo y asignación de funciones", "texto": "En la Secretaría de Hacienda de un municipio de segunda categoría se presentan dos novedades. El tesorero, empleo de libre nombramiento y remoción, viajará diez días hábiles en comisión de servicios a otra ciudad del país para una capacitación, y la secretaria quiere que alguien atienda sus funciones mientras tanto. Además, una profesional universitaria de carrera obtuvo licencia ordinaria de dos meses, y un técnico de carrera con evaluación sobresaliente será encargado de ese empleo, de mayor remuneración. Usted, profesional de talento humano, debe proyectar los actos y responder las dudas de los servidores.", "items": [{"id": "EP-147", "niv": 3, "e": "Para que alguien atienda las funciones del tesorero durante su comisión, la figura que procede es", "f": "Decreto 1083 de 2015, arts. 2.2.5.2.2 y 2.2.5.5.52", "o": [["A", "el encargo del tesorero, porque toda comisión deja vacante temporalmente el empleo del comisionado.", "La comisión de servicios al interior no genera vacancia temporal (Decreto 1083 de 2015, art. 2.2.5.2.2, num. 4); por eso no procede el encargo.", false], ["B", "la asignación de las funciones a otro empleado que desempeñe un cargo de la misma naturaleza.", "La comisión de servicios al interior no genera vacancia temporal (art. 2.2.5.2.2, num. 4, del Decreto 1083 de 2015); cuando la situación no genera vacancia pero implica separación transitoria de funciones, el jefe puede asignarlas a otro empleado de un cargo de la misma naturaleza (art. 2.2.5.5.52).", true], ["C", "un nombramiento provisional por diez días hábiles, porque el empleo de tesorero no puede quedar sin titular.", "El nombramiento provisional es para empleos de carrera en vacancia; el tesorero no deja vacante el empleo durante una comisión de servicios al interior.", false]]}, {"id": "EP-148", "niv": 2, "e": "Si se asignan las funciones del tesorero a otro servidor, este tendrá derecho a", "f": "Decreto 1083 de 2015, art. 2.2.5.5.52", "o": [["A", "una bonificación especial equivalente a la mitad del salario del tesorero.", "No existe en el reglamento una bonificación por asignación de funciones; el servidor conserva su salario sin diferencia salarial.", false], ["B", "la diferencia salarial entre su empleo y el de tesorero durante los diez días.", "El reglamento excluye expresamente la diferencia salarial en la asignación de funciones; ese derecho es propio del encargo.", false], ["C", "seguir recibiendo el salario de su propio empleo, sin diferencia salarial.", "El art. 2.2.5.5.52 del Decreto 1083 de 2015 dispone que el empleado a quien se asignan funciones no tiene derecho al pago de la diferencia salarial y no se entiende desvinculado de las funciones de su propio cargo.", true]]}, {"id": "EP-149", "niv": 3, "e": "Mientras dure el encargo en el empleo de la profesional en licencia ordinaria, el técnico tendrá derecho a", "f": "Decreto 1083 de 2015, art. 2.2.5.5.44", "o": [["A", "percibir el salario del empleo de profesional, porque la titular no lo recibe durante la licencia.", "El art. 2.2.5.5.44 del Decreto 1083 de 2015 da al encargado derecho al salario del empleo que desempeña temporalmente, siempre que no deba ser percibido por su titular; la licencia ordinaria es no remunerada, así que la profesional no lo recibe.", true], ["B", "recibir ambos salarios, el de técnico y el de profesional, porque ejerce dos empleos a la vez.", "Recibir dos asignaciones del tesoro está prohibido salvo excepción legal; el encargado recibe el salario del empleo encargado, no la suma de ambos.", false], ["C", "conservar el salario de técnico, porque en las vacancias temporales nunca se paga diferencia salarial.", "El reglamento sí reconoce la diferencia salarial en el encargo cuando el titular no percibe el salario, como ocurre en la licencia ordinaria no remunerada.", false]]}, {"id": "EP-150", "niv": 1, "e": "Si el técnico pregunta qué pasa con sus derechos de carrera al aceptar el encargo, usted le responde que", "f": "Ley 909 de 2004, art. 42, num. 3; Decreto 1083 de 2015, art. 2.2.5.5.46", "o": [["A", "los pierde, pero puede recuperarlos si concursa de nuevo para su empleo.", "La ley establece lo contrario: los derechos de carrera no se pierden por tomar posesión de un empleo en encargo.", false], ["B", "los conserva, porque tomar posesión de un empleo en encargo no implica perderlos.", "El art. 42, num. 3, de la Ley 909 de 2004 dispone que los derechos de carrera no se pierden cuando el empleado toma posesión de un empleo para el cual fue designado en encargo; al terminar, reasume su empleo (Decreto 1083 de 2015, art. 2.2.5.5.46).", true], ["C", "quedan suspendidos mientras dure el encargo y se reactivan solo si la Comisión de Personal lo aprueba.", "No hay suspensión de derechos ni aprobación de la Comisión de Personal; la ley simplemente dispone que no se pierden.", false]]}]}, {"comp": "empleo_publico", "rol": "general", "tag": "Empleo público, carrera y régimen disciplinario · Sujetos disciplinables y extinción de la acción", "texto": "Usted apoya la oficina de control disciplinario interno de una alcaldía de primera categoría. Llegan tres consultas: un ciudadano presentó queja contra un exinspector de policía que renunció hace cuatro meses, por hechos ocurridos cuando aún estaba en el cargo; otra quejosa, en un proceso distinto, presentó un escrito en el que dice que «retira la queja» porque llegó a un acuerdo con el servidor investigado; y en un tercer proceso se allegó el registro civil de defunción del servidor investigado.", "items": [{"id": "EP-151", "niv": 1, "e": "Frente a la queja contra el exinspector, usted indica que", "f": "Ley 1952 de 2019, art. 25", "o": [["A", "debe remitirse a la Fiscalía, porque solo la justicia penal puede investigar a quien ya dejó de ser servidor público.", "El retiro no traslada la competencia a la justicia penal; la acción disciplinaria procede contra el exservidor por hechos cometidos en ejercicio del cargo.", false], ["B", "debe archivarse, porque la potestad disciplinaria se pierde cuando el servidor se retira del servicio.", "El Código General Disciplinario dispone lo contrario: los servidores públicos son destinatarios de la ley disciplinaria aunque se encuentren retirados del servicio.", false], ["C", "puede tramitarse, porque los servidores públicos siguen siendo disciplinables aunque se hayan retirado del servicio.", "El art. 25 de la Ley 1952 de 2019 establece que son destinatarios de la ley disciplinaria los servidores públicos aunque se encuentren retirados del servicio; los hechos ocurrieron mientras ejercía el cargo.", true]]}, {"id": "EP-152", "niv": 1, "e": "Frente al escrito de la quejosa que «retira la queja», lo procedente es", "f": "Ley 1952 de 2019, art. 32 (modificado por el art. 6 de la Ley 2094 de 2021)", "o": [["A", "archivar el proceso, porque el desistimiento expreso del quejoso extingue la acción disciplinaria.", "El desistimiento del quejoso no figura entre las causales de extinción; la ley dice expresamente que no extingue la acción.", false], ["B", "citar a audiencia de conciliación entre la quejosa y el servidor para formalizar el acuerdo.", "La acción disciplinaria es pública y no es conciliable entre particulares; el acuerdo no tiene efectos sobre el proceso.", false], ["C", "continuar el trámite, porque el desistimiento del quejoso no extingue la acción disciplinaria.", "El parágrafo del art. 32 de la Ley 1952 de 2019, modificado por la Ley 2094 de 2021, establece que el desistimiento del quejoso no extingue la acción disciplinaria, que el Estado ejerce como titular.", true]]}, {"id": "EP-153", "niv": 2, "e": "En el proceso en que se allegó el registro civil de defunción del investigado, corresponde", "f": "Ley 1952 de 2019, art. 32 (modificado por el art. 6 de la Ley 2094 de 2021)", "o": [["A", "declarar extinguida la acción disciplinaria por la muerte del disciplinable.", "El art. 32 de la Ley 1952 de 2019, modificado por la Ley 2094 de 2021, señala como causales de extinción de la acción la muerte del disciplinable, la caducidad y la prescripción.", true], ["B", "suspender el proceso hasta que se cumpla el término de prescripción de cinco años.", "No hay que esperar la prescripción: la muerte es una causal autónoma de extinción de la acción disciplinaria.", false], ["C", "continuar el proceso contra los herederos para que respondan por la falta.", "La responsabilidad disciplinaria es personal; la muerte del disciplinable extingue la acción y no se traslada a los herederos.", false]]}]}, {"comp": "empleo_publico", "rol": "profesional", "tag": "Empleo público, carrera y régimen disciplinario · Nivel profesional · Prescripción de la acción disciplinaria", "texto": "Usted es profesional universitario de la oficina de control disciplinario interno de una gobernación. Revisa tres expedientes por hechos ocurridos en 2026: en el primero, un servidor alteró el 10 de marzo de 2026 un acta de recibo de bienes; en el segundo, otro servidor cobró de manera indebida a usuarios, en forma repetida, entre abril y septiembre de 2026; y en el tercero, la oficina notificó el fallo de primera instancia y el disciplinado apeló. La jefe le pide precisar cómo se cuenta la prescripción en cada caso. Ninguna de las faltas es de las señaladas en el art. 52 del Código General Disciplinario.", "items": [{"id": "EP-154", "niv": 2, "e": "Para la alteración del acta, la acción disciplinaria prescribirá en", "f": "Ley 1952 de 2019, art. 33 (modificado por el art. 7 de la Ley 2094 de 2021)", "o": [["A", "tres años contados desde la fecha en que la oficina conoció los hechos.", "El término general no es de tres años ni se cuenta desde el conocimiento de la oficina; para las faltas instantáneas se cuenta desde su consumación.", false], ["B", "cinco años contados desde el día en que se consumó la falta.", "El art. 33 de la Ley 1952 de 2019, modificado por la Ley 2094 de 2021, fija la prescripción en cinco años, contados para las faltas instantáneas desde el día de su consumación; la alteración del acta se consumó el 10 de marzo de 2026.", true], ["C", "doce años contados desde la apertura de la investigación disciplinaria.", "El término de doce años aplica a las faltas del art. 52 del Código, que el caso descarta, y la ley no lo cuenta desde la apertura de la investigación.", false]]}, {"id": "EP-155", "niv": 3, "e": "Para los cobros indebidos repetidos entre abril y septiembre, el término de prescripción empieza a contarse desde", "f": "Ley 1952 de 2019, art. 33 (modificado por el art. 7 de la Ley 2094 de 2021)", "o": [["A", "el primer cobro realizado en abril de 2026, porque allí comenzó la falta.", "Para las faltas de carácter permanente o continuado la ley no toma el primer acto sino el último; contar desde abril acortaría indebidamente el término.", false], ["B", "la fecha en que el primer usuario presentó la queja ante la gobernación.", "La presentación de la queja no es el punto de partida legal del término de prescripción.", false], ["C", "el último cobro, porque se trata de una falta de carácter continuado.", "El art. 33 de la Ley 1952 de 2019, modificado por la Ley 2094 de 2021, dispone que para las faltas de carácter permanente o continuado la prescripción se cuenta desde la realización del último hecho o acto.", true]]}, {"id": "EP-156", "niv": 3, "e": "En el tercer expediente, la notificación del fallo de primera instancia produce el efecto de", "f": "Ley 1952 de 2019, art. 33 (modificado por el art. 7 de la Ley 2094 de 2021)", "o": [["A", "suspender la prescripción hasta que el disciplinado desista del recurso de apelación.", "La ley no habla de suspensión ligada al desistimiento del recurso; establece la interrupción con la notificación del fallo y un nuevo término para la segunda instancia.", false], ["B", "interrumpir la prescripción, que se producirá si en dos años no se notifica la decisión de segunda instancia.", "El art. 33 de la Ley 1952 de 2019, modificado por la Ley 2094 de 2021, dispone que la prescripción se interrumpe con la notificación del fallo de primera instancia y que se producirá si, transcurridos dos años desde esa notificación, no se notifica la decisión de segunda instancia.", true], ["C", "hacer imprescriptible la acción disciplinaria, porque ya existe una decisión de fondo sobre la responsabilidad del investigado.", "Ninguna decisión de primera instancia vuelve imprescriptible la acción; la ley fija un término de dos años para notificar la segunda instancia.", false]]}]}, {"comp": "empleo_publico", "rol": "profesional", "tag": "Empleo público, carrera y régimen disciplinario · Nivel profesional · Clases y límites de las sanciones", "texto": "Usted es profesional de la oficina de control disciplinario interno de un instituto de recreación y deporte del distrito y debe proyectar la parte resolutiva de tres fallos. En el primero se probó una falta leve cometida con culpa. En el segundo, una falta grave cometida con dolo. En el tercero, una falta gravísima cometida con culpa gravísima.", "items": [{"id": "EP-157", "niv": 1, "e": "Para la falta leve cometida con culpa, la sanción que corresponde es", "f": "Ley 1952 de 2019, art. 48 (modificado por el art. 9 de la Ley 2094 de 2021)", "o": [["A", "amonestación escrita.", "El art. 48, num. 6, de la Ley 1952 de 2019, modificado por la Ley 2094 de 2021, prevé la amonestación escrita para las faltas leves culposas.", true], ["B", "multa de diez a ciento ochenta días del salario básico.", "La multa corresponde a las faltas leves dolosas; para las leves culposas la ley prevé una sanción menor.", false], ["C", "suspensión en el ejercicio del cargo de uno a doce meses.", "La suspensión de uno a doce meses corresponde a las faltas graves culposas, no a las leves.", false]]}, {"id": "EP-158", "niv": 2, "e": "Para la falta grave cometida con dolo, la sanción que corresponde es", "f": "Ley 1952 de 2019, art. 48 (modificado por el art. 9 de la Ley 2094 de 2021)", "o": [["A", "suspensión de tres a dieciocho meses e inhabilidad especial por igual término.", "El art. 48, num. 3, de la Ley 1952 de 2019, modificado por la Ley 2094 de 2021, prevé para las faltas graves dolosas la suspensión de tres a dieciocho meses e inhabilidad especial por el mismo término.", true], ["B", "suspensión en el ejercicio del cargo de uno a doce meses, sin inhabilidad especial.", "Esa es la sanción de las faltas graves culposas; para las graves dolosas la ley fija un rango mayor y añade inhabilidad especial.", false], ["C", "destitución e inhabilidad general de diez a veinte años, por tratarse de una falta dolosa.", "La destitución con inhabilidad general de diez a veinte años está prevista para las faltas gravísimas dolosas, no para las graves.", false]]}, {"id": "EP-159", "niv": 3, "e": "Para la falta gravísima cometida con culpa gravísima, la sanción que corresponde es", "f": "Ley 1952 de 2019, art. 48 (modificado por el art. 9 de la Ley 2094 de 2021)", "o": [["A", "suspensión de tres a dieciocho meses e inhabilidad especial.", "La suspensión con inhabilidad especial corresponde a las faltas graves dolosas; las gravísimas con culpa gravísima conllevan destitución.", false], ["B", "destitución e inhabilidad general de ocho a diez años.", "El art. 48, num. 2, de la Ley 1952 de 2019, modificado por la Ley 2094 de 2021, prevé destitución e inhabilidad general de ocho a diez años para las faltas gravísimas realizadas con culpa gravísima.", true], ["C", "destitución e inhabilidad general de diez a veinte años.", "Ese rango aplica a las faltas gravísimas dolosas; cuando la gravísima se comete con culpa gravísima la inhabilidad es de ocho a diez años.", false]]}]}, {"comp": "empleo_publico", "rol": "general", "tag": "Empleo público, carrera y régimen disciplinario · Culpabilidad: dolo y culpa", "texto": "En una capacitación sobre el Código General Disciplinario para servidores de una corporación autónoma regional, el facilitador presenta tres situaciones: un técnico que, por un descuido menor que cualquier persona cuidadosa podría tener, transcribió mal un dato en un oficio sin consecuencias; un profesional que firmó la viabilidad de un permiso de vertimientos sin revisar los requisitos básicos que exige la norma, por desatender lo más elemental de su función; y un servidor que, sin intención pero sin el cuidado que cualquier persona del común tendría, incurrió en una conducta que la ley describe como falta gravísima.", "items": [{"id": "EP-160", "niv": 2, "e": "Respecto del técnico que cometió el descuido menor, el facilitador explica que", "f": "Ley 1952 de 2019, art. 29 (modificado por el art. 4 de la Ley 2094 de 2021)", "o": [["A", "debe sancionarse con amonestación escrita, porque toda culpa es sancionable en materia disciplinaria.", "La ley no sanciona toda culpa: la culpa sancionable es la gravísima o la grave, y la culpa leve no es sancionable.", false], ["B", "debe sancionarse con multa, porque el error quedó plasmado en un documento oficial.", "La multa corresponde a faltas leves dolosas; un descuido menor sin dolo constituye culpa leve, que no es sancionable.", false], ["C", "no es sancionable disciplinariamente, porque la culpa leve no se sanciona.", "El art. 29 de la Ley 1952 de 2019, modificado por la Ley 2094 de 2021, dispone que la culpa sancionable puede ser gravísima o grave y que la culpa leve no es sancionable en materia disciplinaria.", true]]}, {"id": "EP-161", "niv": 2, "e": "La conducta del profesional que firmó la viabilidad sin revisar los requisitos básicos corresponde a", "f": "Ley 1952 de 2019, art. 29 (modificado por el art. 4 de la Ley 2094 de 2021)", "o": [["A", "culpa gravísima, porque obedece a una desatención elemental de reglas de obligatorio cumplimiento.", "El art. 29 de la Ley 1952 de 2019, modificado por la Ley 2094 de 2021, define la culpa gravísima como la falta cometida por ignorancia supina, desatención elemental o violación manifiesta de reglas de obligatorio cumplimiento.", true], ["B", "dolo, porque toda firma de un documento sin revisarlo supone intención de causar daño.", "El dolo exige conocer y querer la conducta; el caso describe una desatención, no una actuación intencional.", false], ["C", "culpa grave, porque solo omitió el cuidado que tendría una persona del común.", "La culpa grave es la inobservancia del cuidado de cualquier persona del común; desatender lo más elemental de la función o violar de forma manifiesta reglas obligatorias se califica como culpa gravísima.", false]]}, {"id": "EP-162", "niv": 3, "e": "Respecto del servidor que realizó una conducta descrita como gravísima, pero con culpa grave, el facilitador explica que", "f": "Ley 1952 de 2019, art. 47, num. 9 (modificado por el art. 8 de la Ley 2094 de 2021)", "o": [["A", "se sanciona como falta gravísima con destitución, porque la clasificación depende solo de la descripción legal de la conducta.", "La ley prevé una regla especial: la realización típica de una falta objetivamente gravísima con culpa grave se considera falta grave.", false], ["B", "se considera falta grave, porque la realización de una falta objetivamente gravísima con culpa grave recibe esa calificación.", "El art. 47, num. 9, de la Ley 1952 de 2019, modificado por la Ley 2094 de 2021, dispone que la realización típica de una falta objetivamente gravísima cometida con culpa grave será considerada falta grave.", true], ["C", "no es sancionable, porque las faltas gravísimas solo admiten la modalidad dolosa.", "Las faltas gravísimas también se sancionan a título de culpa; además, la ley califica este supuesto como falta grave, que sí es sancionable.", false]]}]}, {"comp": "empleo_publico", "rol": "asistencial", "tag": "Empleo público, carrera y régimen disciplinario · Nivel asistencial · Deberes y prohibiciones", "texto": "Usted es auxiliar administrativo del archivo de gestión de la Secretaría General de un municipio de cuarta categoría, que custodia, entre otros, los expedientes de la oficina de control disciplinario interno. Un día ocurren tres situaciones: un abogado que no es sujeto procesal le pide que le deje revisar «solo un momento» el expediente de una investigación disciplinaria contra un funcionario, en la que todavía no se ha formulado pliego de cargos ni se ha ordenado el archivo; un compañero le sugiere pedirle «una colaboración» en dinero a un ciudadano para entregarle más rápido unas copias; y en la ventanilla hay solicitudes de consulta radicadas en orden, pero un concejal amigo de su jefe le pide que atienda primero la suya, que llegó de última y no tiene ninguna prelación legal ni urgencia.", "items": [{"id": "EP-163", "niv": 2, "e": "Frente a la petición del abogado sobre el expediente disciplinario, usted debe", "f": "Ley 1952 de 2019, arts. 38, num. 6, 39, num. 18, y 115; Ley 1437 de 2011, art. 36", "o": [["A", "permitirle revisarlo en su escritorio, porque cualquier persona tiene derecho a examinar los expedientes de la administración.", "El derecho a examinar expedientes del art. 36 de la Ley 1437 de 2011 exceptúa los documentos sujetos a reserva, y la actuación disciplinaria es reservada hasta el pliego de cargos o el archivo definitivo (art. 115 de la Ley 1952 de 2019).", false], ["B", "entregarle copia del expediente, siempre que firme el libro de préstamos del archivo y se identifique como abogado.", "Firmar un registro o acreditar la profesión no levanta la reserva legal de la actuación disciplinaria; entregar copias a quien no es sujeto procesal desconoce el art. 115 de la Ley 1952 de 2019.", false], ["C", "abstenerse de permitirle el acceso, porque la actuación disciplinaria es reservada en esa etapa y él no es sujeto procesal.", "El art. 115 de la Ley 1952 de 2019 establece que las actuaciones disciplinarias son reservadas hasta que se formule pliego de cargos o se ordene el archivo definitivo, sin perjuicio de los derechos de los sujetos procesales; el art. 39, num. 18, prohíbe dar acceso o exhibir expedientes a personas no autorizadas, y el art. 38, num. 6, impone custodiar la documentación.", true]]}, {"id": "EP-164", "niv": 1, "e": "Frente a la sugerencia de su compañero, usted debe tener presente que", "f": "Ley 1952 de 2019, art. 39, num. 3", "o": [["A", "está permitido recibir aportes voluntarios de los ciudadanos si no superan un salario mínimo.", "La ley no establece un monto permitido; está prohibido solicitar, directa o indirectamente, dádivas, regalos, favores o cualquier otro beneficio.", false], ["B", "la conducta solo sería reprochable si el ciudadano presenta una queja formal ante la personería municipal.", "La falta se configura por la conducta, no por la queja; además, la acción disciplinaria puede iniciarse de oficio.", false], ["C", "está prohibido solicitar, directa o indirectamente, dádivas o cualquier otra clase de beneficios.", "El art. 39, num. 3, de la Ley 1952 de 2019 prohíbe a todo servidor solicitar, directa o indirectamente, dádivas, agasajos, regalos, favores o cualquier otra clase de beneficios.", true]]}, {"id": "EP-165", "niv": 2, "e": "Frente a la petición del concejal, usted debe", "f": "Ley 1952 de 2019, art. 38, nums. 13 y 39", "o": [["A", "atenderlo primero si su jefe lo autoriza por escrito, porque así queda soporte de la excepción.", "La autorización del jefe no crea una prelación legal; resolver por fuera del orden de ingreso sin causa legal desconoce el deber del art. 38, num. 13.", false], ["B", "atender las solicitudes en el orden en que ingresaron, porque no existe prelación legal ni urgencia manifiesta.", "El art. 38, num. 13, de la Ley 1952 de 2019 impone el deber de resolver los asuntos en el orden de ingreso, salvo prelación legal o urgencia manifiesta, y el num. 39 exige respetar el orden de inscripción y de ingreso de solicitudes.", true], ["C", "atenderlo primero, porque los miembros de las corporaciones públicas de elección popular tienen prelación en los trámites.", "La ley no otorga prelación general a los concejales en las solicitudes de consulta; el caso indica que no hay prelación legal ni urgencia.", false]]}]}, {"comp": "empleo_publico", "rol": "profesional", "tag": "Empleo público, carrera y régimen disciplinario · Nivel profesional · Gravedad de la falta y graduación de la sanción", "texto": "Usted es profesional especializado de la oficina de control disciplinario interno de una gobernación y debe orientar a un abogado recién vinculado. En un proceso, el investigado es un director técnico que incumplió un deber de su cargo; el abogado no sabe si calificar la falta como grave o leve. En otro proceso, el disciplinado aceptó los cargos que se le formularon y el abogado pregunta qué efecto tiene eso al fijar la duración de la suspensión.", "items": [{"id": "EP-166", "niv": 2, "e": "Al explicar cómo se clasifica la falta del director técnico, usted le indica que", "f": "Ley 1952 de 2019, arts. 47 (modificado por el art. 8 de la Ley 2094 de 2021) y 67", "o": [["A", "las faltas gravísimas están señaladas taxativamente en la ley, y si la conducta no lo está, se determina si es grave o leve con los criterios legales.", "El art. 47 de la Ley 1952 de 2019, modificado por la Ley 2094 de 2021, dispone que las faltas gravísimas están taxativamente señaladas en la ley y que la gravedad o levedad se determina con criterios como la culpabilidad, la naturaleza del servicio y la jerarquía y mando; el art. 67 remite a ellos.", true], ["B", "todas las faltas se clasifican libremente por el operador disciplinario según su criterio personal.", "La clasificación no es libre: las gravísimas son taxativas y la gravedad o levedad se define con los criterios legales del art. 47.", false], ["C", "toda falta por incumplimiento de deberes es gravísima cuando el investigado pertenece al nivel directivo.", "El nivel directivo no convierte la falta en gravísima; las gravísimas están señaladas taxativamente en la ley y la jerarquía es solo uno de los criterios para definir si es grave o leve.", false]]}, {"id": "EP-167", "niv": 1, "e": "Entre los criterios legales para definir si la falta del director es grave o leve se encuentra", "f": "Ley 1952 de 2019, art. 47 (modificado por el art. 8 de la Ley 2094 de 2021)", "o": [["A", "la jerarquía y mando que tenga en la institución.", "El art. 47, num. 4, de la Ley 1952 de 2019, modificado por la Ley 2094 de 2021, incluye la jerarquía y mando del servidor en la institución entre los criterios para determinar la gravedad o levedad de la falta.", true], ["B", "la antigüedad del investigado en la entidad.", "La antigüedad no está entre los criterios del art. 47 de la Ley 1952 de 2019.", false], ["C", "el nivel de formación académica que acreditó al posesionarse.", "La formación académica no es un criterio legal de gravedad; la ley atiende, entre otros, a la culpabilidad, la perturbación del servicio y la jerarquía.", false]]}, {"id": "EP-168", "niv": 3, "e": "Sobre la aceptación de cargos del otro disciplinado, usted le explica al abogado que", "f": "Ley 1952 de 2019, arts. 32, 50, 161 y 162 (modificados por la Ley 2094 de 2021)", "o": [["A", "es un agravante, porque demuestra que el disciplinado tenía conocimiento de la ilicitud.", "El conocimiento de la ilicitud es un agravante distinto; la ley trata expresamente la aceptación de cargos como atenuante.", false], ["B", "es un atenuante para graduar la suspensión, además de las rebajas que el código prevé para ella.", "El art. 50 de la Ley 1952 de 2019, modificado por la Ley 2094 de 2021, incluye la confesión de la falta o la aceptación de cargos entre los atenuantes para fijar la cuantía de la multa y la duración de la suspensión e inhabilidad; además, los arts. 161 y 162 (modificados por la Ley 2094 de 2021) regulan los beneficios y rebajas de sanción por aceptar cargos según la oportunidad en que se haga.", true], ["C", "extingue la acción disciplinaria, porque el disciplinado reconoció de manera expresa su responsabilidad.", "La aceptación de cargos no es causal de extinción; las causales son la muerte, la caducidad y la prescripción (art. 32).", false]]}]}, {"comp": "empleo_publico", "rol": "tecnico", "tag": "Empleo público, carrera y régimen disciplinario · Nivel técnico · Deberes del servidor", "texto": "Usted es técnico operativo de la Secretaría de Infraestructura de un municipio de sexta categoría. Presentó renuncia a su empleo para trabajar en el sector privado, y el alcalde aún no la ha aceptado ni ha designado a quien lo reemplace. Mientras tanto, un compañero le propone salir dos horas en la jornada, sin permiso, a un asunto personal, «porque igual ya se va». Además, su jefe inmediato le ha pedido varias veces que, en horario laboral, haga diligencias bancarias personales de él.", "items": [{"id": "EP-169", "niv": 2, "e": "Mientras la renuncia no se acepte ni llegue su reemplazo, usted debe", "f": "Ley 1952 de 2019, art. 38, num. 18; Ley 909 de 2004, art. 41, lit. d", "o": [["A", "dejar de asistir desde el día siguiente a la radicación, porque la renuncia surte efectos con su sola presentación.", "La renuncia produce el retiro solo cuando es regularmente aceptada; dejar el cargo antes vulnera el deber de permanecer hasta ser reemplazado.", false], ["B", "entregar el puesto a cualquier compañero de la dependencia y retirarse, porque así se garantiza la continuidad del servicio.", "La entrega a un compañero no equivale al relevo por quien deba reemplazarlo ni a una autorización de quien provee el cargo.", false], ["C", "permanecer en el desempeño de sus labores, salvo autorización legal, reglamentaria o de quien deba proveer el cargo.", "El art. 38, num. 18, de la Ley 1952 de 2019 impone el deber de permanecer en el desempeño de las labores mientras no se haga cargo de ellas quien deba reemplazarlo, salvo autorización legal, reglamentaria o de quien deba proveer el cargo; además, el retiro solo se produce con la renuncia regularmente aceptada (Ley 909 de 2004, art. 41).", true]]}, {"id": "EP-170", "niv": 1, "e": "Frente a la propuesta de su compañero de salir dos horas sin permiso, usted debe tener en cuenta que", "f": "Ley 1952 de 2019, arts. 38, num. 12, y 39, num. 9", "o": [["A", "puede hacerlo si luego repone las horas al final del mes, aunque no avise a nadie.", "Reponer tiempo sin autorización no justifica la ausencia; ausentarse sin justificación está prohibido.", false], ["B", "puede hacerlo, porque el empleado que renunció ya no está obligado a cumplir el horario.", "Mientras no se acepte la renuncia sigue siendo servidor y conserva todos sus deberes, incluido el de dedicar el tiempo reglamentario a sus funciones.", false], ["C", "está prohibido ausentarse del cumplimiento de la función sin justificación.", "El art. 39, num. 9, de la Ley 1952 de 2019 prohíbe ausentarse del cumplimiento de la función, cargo o servicio sin justificación, y el art. 38, num. 12, exige dedicar la totalidad del tiempo reglamentario a las funciones.", true]]}, {"id": "EP-171", "niv": 2, "e": "Las órdenes reiteradas de su jefe para hacer diligencias bancarias personales constituyen", "f": "Ley 1952 de 2019, arts. 38, num. 8, y 39, num. 2", "o": [["A", "una conducta prohibida, porque está prohibido imponer a otro servidor trabajos ajenos a sus funciones.", "El art. 39, num. 2, de la Ley 1952 de 2019 prohíbe imponer a otro servidor público trabajos ajenos a sus funciones; las diligencias personales del jefe no hacen parte de las funciones del técnico.", true], ["B", "un ejercicio legítimo de la subordinación, porque el servidor debe cumplir las órdenes del superior.", "El deber de cumplir órdenes se limita a las que el superior adopte en ejercicio de sus atribuciones (art. 38, num. 8); encargar asuntos personales no lo es.", false], ["C", "una situación permitida si el jefe le reconoce horas extra por el tiempo que dedica a las diligencias.", "El pago de horas extra no convierte en funciones del empleo las diligencias personales del jefe; la conducta sigue estando prohibida.", false]]}]}, {"comp": "empleo_publico", "rol": "general", "tag": "Empleo público, carrera y régimen disciplinario · Inhabilidades, incompatibilidades y prohibiciones", "texto": "En la Secretaría de Gobierno de un departamento surgen varias consultas que llegan a la oficina jurídica, donde usted trabaja: un profesional de planta quiere aceptar un segundo empleo de medio tiempo en la personería de un municipio vecino; la entidad rematará vehículos dados de baja y un técnico que se retiró hace cinco meses quiere participar en la subasta; una auxiliar pregunta si puede firmar un contrato de prestación de servicios con la alcaldía de su municipio para dictar talleres los fines de semana; y el secretario de despacho quiere nombrar en un empleo de carrera, en provisionalidad, a una persona que no cumple el requisito de experiencia del manual de funciones.", "items": [{"id": "EP-172", "niv": 1, "e": "Sobre el segundo empleo en la personería, usted conceptúa que", "f": "Ley 1952 de 2019, art. 39, num. 13; Constitución Política, art. 128", "o": [["A", "puede aceptarlo, porque se trata de una entidad de otro nivel territorial.", "La prohibición cubre cualquier empleo público y cualquier asignación del tesoro, que incluye el de la nación, las entidades territoriales y las descentralizadas.", false], ["B", "no puede aceptarlo, porque está prohibido desempeñar simultáneamente más de un empleo público, salvo excepción legal.", "El art. 39, num. 13, de la Ley 1952 de 2019 prohíbe desempeñar simultáneamente más de un empleo público o recibir más de una asignación del tesoro, salvo los casos determinados por la ley, en desarrollo del art. 128 de la Constitución.", true], ["C", "puede aceptarlo si el horario de la personería no se cruza con el de la secretaría.", "La compatibilidad de horarios no elimina la prohibición de desempeñar simultáneamente más de un empleo público.", false]]}, {"id": "EP-173", "niv": 3, "e": "Sobre la participación del extécnico en el remate de los vehículos, usted conceptúa que", "f": "Ley 1952 de 2019, art. 43, num. 2", "o": [["A", "no puede participar, porque la incompatibilidad para intervenir en remates de bienes de la entidad se extiende hasta doce meses después del retiro.", "El art. 43, num. 2, de la Ley 1952 de 2019 establece la incompatibilidad para adquirir o intervenir en remates o ventas de bienes de la entidad donde se labora, desde la vinculación y hasta doce meses después del retiro; el técnico se retiró hace cinco meses.", true], ["B", "puede participar si presenta la oferta a través de un familiar, porque la incompatibilidad es personal.", "La incompatibilidad cubre la intervención directa o indirecta; usar a un familiar para participar no la elude.", false], ["C", "puede participar, porque las incompatibilidades terminan el día en que el servidor se retira.", "Esta incompatibilidad tiene una extensión expresa después del retiro: se mantiene hasta doce meses después de dejar el servicio.", false]]}, {"id": "EP-174", "niv": 2, "e": "Sobre el contrato de prestación de servicios que quiere firmar la auxiliar, usted conceptúa que", "f": "Ley 1952 de 2019, art. 43, num. 3", "o": [["A", "puede celebrarlo, porque los talleres se dictarán por fuera de la jornada laboral.", "Que la actividad se realice fuera de la jornada no elimina la incompatibilidad para contratar con el Estado.", false], ["B", "puede celebrarlo si informa previamente a su jefe inmediato y este no se opone.", "La autorización del jefe no crea una excepción a la incompatibilidad; las excepciones deben ser constitucionales o legales.", false], ["C", "no puede celebrarlo, porque los servidores públicos tienen incompatibilidad para contratar con el Estado, salvo excepciones constitucionales o legales.", "El art. 43, num. 3, de la Ley 1952 de 2019 establece como incompatibilidad para todo servidor público contratar con el Estado, salvo las excepciones constitucionales o legales, ninguna de las cuales se configura en el caso.", true]]}, {"id": "EP-175", "niv": 2, "e": "Sobre el nombramiento provisional que quiere hacer el secretario, usted le advierte que", "f": "Ley 1952 de 2019, arts. 38, num. 10, y 39, num. 15", "o": [["A", "puede hacerlo si la persona se compromete por escrito a acreditar la experiencia exigida durante el primer año de servicio.", "No es posible posesionar a alguien con el compromiso de completar después los requisitos; deben acreditarse para la posesión y el desempeño del cargo (art. 38, num. 10).", false], ["B", "está prohibido nombrar a quien no reúna los requisitos del empleo, aunque el nombramiento sea provisional.", "El art. 39, num. 15, de la Ley 1952 de 2019 prohíbe nombrar en cargos públicos a personas que no reúnan los requisitos constitucionales, legales o reglamentarios; el nombramiento provisional también exige cumplir los requisitos del empleo.", true], ["C", "puede hacerlo, porque en la provisionalidad los requisitos del manual de funciones son opcionales.", "El nombramiento provisional no exime de cumplir los requisitos del empleo; nombrar sin ellos está prohibido.", false]]}]}, {"comp": "empleo_publico", "rol": "general", "tag": "Empleo público, carrera y régimen disciplinario · Acoso laboral: definición y modalidades", "texto": "Usted integra el comité de convivencia laboral de una alcaldía de segunda categoría. Recibe tres situaciones: una técnica denuncia que, desde hace tres meses y sin ninguna razón del servicio, su jefe le asigna el triple de trabajo que a sus compañeros y le cambia el horario cada semana, y le ha dicho que «si no le gusta, puede irse»; un auxiliar refiere que un compañero lo insulta con frecuencia y lo llama «inútil» delante de los demás; y una coordinadora de grupo afirma que dos de sus subalternos la hostigan de manera persistente con mensajes ofensivos para que renuncie a la coordinación.", "items": [{"id": "EP-176", "niv": 2, "e": "La situación de la técnica corresponde a la modalidad de acoso laboral denominada", "f": "Ley 1010 de 2006, art. 2", "o": [["A", "desprotección laboral.", "La desprotección laboral consiste en poner en riesgo la integridad y seguridad del trabajador con órdenes o funciones sin los mínimos de protección; el caso describe carga excesiva y cambios
