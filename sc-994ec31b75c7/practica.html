<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Práctica por tema y nivel · CNSC Empleo Público</title>
<style>
:root{--bg:#f6f8fb;--card:#fff;--ink:#1d2433;--mute:#5a6478;--line:#dbe1ea;--pri:#0b3d6e;--pri2:#1660a8;--ok:#0d6b3a;--okbg:#e6f4ec;--no:#9b1c1c;--nobg:#fbeaea;--sel:#e8f0fa}
@media (prefers-color-scheme: dark){:root{--bg:#10151d;--card:#18202b;--ink:#e6ebf2;--mute:#9aa6b8;--line:#2a3545;--pri:#7fb3ea;--pri2:#9cc6f2;--ok:#7fd3a3;--okbg:#16301f;--no:#f2a3a3;--nobg:#3a1c1c;--sel:#1e2d40}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px}
.hwrap{max-width:860px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
h1{font-size:17px;margin:0;color:var(--pri)}
.stat{font-size:14px;color:var(--mute)}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--pri)}
.timer.low{color:var(--no)}
main{max-width:860px;margin:0 auto;padding:16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin:0 0 16px}
.caso{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--pri);border-radius:10px;padding:14px 16px;margin:22px 0 10px}
.tag{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--pri);font-weight:700}
.caso p{margin:6px 0 0;white-space:pre-line}
.item{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0}
.enun{margin:0 0 8px}
.n{font-weight:700;color:var(--pri)}
.niv{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-right:4px;white-space:nowrap}
.op{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:6px 0;cursor:pointer;background:transparent;width:100%;text-align:left;color:inherit;font:inherit}
.op:hover{border-color:var(--pri2)}
.op .l{font-weight:700;min-width:20px}
.op.sel{background:var(--sel);border-color:var(--pri2)}
.op.ok{background:var(--okbg);border-color:var(--ok)}
.op.no{background:var(--nobg);border-color:var(--no)}
.op[disabled]{cursor:default}
.just{font-size:14px;margin:8px 0 0;padding:8px 10px;border-top:1px dashed var(--line)}
.just div{margin:4px 0}
.just .okt{color:var(--ok);font-weight:700}
.just .not{color:var(--no);font-weight:700}
.src{font-size:13px;color:var(--mute);margin-top:6px}
button.btn{background:var(--pri);color:var(--card);border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer}
button.btn.sec{background:transparent;color:var(--pri);border:1px solid var(--pri)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
select{font:inherit;padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);max-width:100%}
table{border-collapse:collapse;width:100%;font-size:15px}
td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
.big{font-size:40px;font-weight:800;color:var(--pri);line-height:1.1}
.aviso{font-size:13px;color:var(--mute)}
.hide{display:none !important}
.res-ok{color:var(--ok);font-weight:700}.res-no{color:var(--no);font-weight:700}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal .panel{max-width:420px}
footer{max-width:860px;margin:0 auto;padding:8px 16px 40px;font-size:12px;color:var(--mute)}
</style>
</head>
<body>
<header><div class="hwrap"><h1 id="tit"></h1><div class="row stat"><span id="prog"></span><span id="timer" class="timer"></span></div></div></header>
<main id="main"></main>
<div id="modal" class="modal hide"><div class="panel"><p id="mtxt"></p><div class="row"><button class="btn" id="msi">Sí, calificar</button><button class="btn sec" id="mno">Seguir respondiendo</button></div></div></div>
<footer><a href="./" style="color:var(--pri);font-weight:600">← Volver al menú</a><br><br>Material de preparación independiente. No está afiliado a la Comisión Nacional del Servicio Civil (CNSC) ni a ninguna entidad pública, y no contiene preguntas reales de la prueba.</footer>
<script>
const DATA = [{"comp": "estado_constitucion", "rol": "general", "tag": "Estado y Constitución · Principios fundamentales y Estado social de derecho", "texto": "Usted es técnico administrativo de la Secretaría de Gobierno de un municipio de sexta categoría. En una reunión de equipo, el coordinador afirma que «si no hacemos nada, nadie nos puede sancionar: los servidores, igual que cualquier particular, solo responden si violan una ley expresa». En la misma reunión se revisa un decreto municipal que, para inscribirse en un programa de mercados solidarios, exige certificado de pertenencia a una iglesia. Además, un concejal pide explicar a la comunidad por qué el municipio puede diseñar sus propios programas sociales sin que cada uno sea aprobado por la Nación.", "items": [{"id": "EC-101", "niv": 1, "e": "Frente a la afirmación del coordinador sobre la responsabilidad de los servidores públicos, lo correcto es aclarar que estos responden", "f": "Constitución Política, art. 6", "o": [["A", "únicamente cuando su omisión cause un daño patrimonial cuantificado por la contraloría.", "El daño patrimonial es un elemento de la responsabilidad fiscal, no un requisito general de la responsabilidad de los servidores. El artículo 6 hace responsables a los servidores por la sola omisión en el ejercicio de sus funciones.", false], ["B", "en los mismos términos que los particulares, porque la Constitución consagra la igualdad de todos ante la ley y no distingue entre ellos.", "Confunde la igualdad del artículo 13 con el régimen de responsabilidad. El artículo 6 establece expresamente un régimen más exigente para los servidores, que incluye la omisión y la extralimitación.", false], ["C", "por infringir la Constitución y las leyes, y también por omisión o extralimitación en el ejercicio de sus funciones.", "El artículo 6 de la Constitución distingue: los particulares responden solo por infringir la Constitución y las leyes, mientras que los servidores públicos responden por esa misma causa y, además, por omitir sus funciones o excederse en ellas. La inacción también genera responsabilidad.", true]]}, {"id": "EC-102", "niv": 1, "e": "Sobre la incompatibilidad entre el decreto municipal que exige pertenecer a una iglesia y la Constitución, la regla constitucional aplicable indica que", "f": "Constitución Política, arts. 4 y 13", "o": [["A", "deben aplicarse las disposiciones constitucionales, por ser la Constitución norma de normas.", "El artículo 4 de la Constitución establece que la Constitución es norma de normas y que, ante cualquier incompatibilidad con la ley u otra norma jurídica, se aplican las disposiciones constitucionales. Exigir pertenecer a una iglesia discrimina por religión (art. 13).", true], ["B", "prevalece el decreto, por ser una norma especial y posterior expedida por la autoridad local competente.", "Los criterios de especialidad y posterioridad resuelven conflictos entre normas del mismo nivel. Frente a la Constitución no operan: el artículo 4 dispone que en caso de incompatibilidad se aplican las disposiciones constitucionales.", false], ["C", "el decreto debe aplicarse hasta que el concejo municipal lo derogue mediante acuerdo.", "El concejo no deroga los decretos del alcalde como mecanismo para resolver su incompatibilidad con la Constitución. La regla del artículo 4 es la prevalencia directa de la Constitución sobre cualquier norma incompatible.", false]]}, {"id": "EC-103", "niv": 2, "e": "Para responder al concejal, el fundamento constitucional que permite al municipio diseñar sus propios programas es que Colombia está organizada como", "f": "Constitución Política, art. 1", "o": [["A", "un Estado federal, en el que cada municipio ejerce soberanía propia sobre los asuntos sociales.", "Colombia no es un Estado federal. El artículo 1 la define como república unitaria; los municipios tienen autonomía, pero no soberanía, que reside exclusivamente en el pueblo (art. 3).", false], ["B", "una república unitaria y descentralizada, con autonomía de sus entidades territoriales.", "El artículo 1 de la Constitución define a Colombia como Estado social de derecho organizado en forma de república unitaria, descentralizada y con autonomía de sus entidades territoriales. Esa autonomía permite al municipio gestionar sus propios programas dentro de la Constitución y la ley.", true], ["C", "una república centralizada, en la que la Nación define y aprueba todos los programas sociales locales.", "El artículo 1 describe a Colombia como república descentralizada y con autonomía de sus entidades territoriales, lo que contradice que la Nación deba aprobar cada programa local.", false]]}]}, {"comp": "estado_constitucion", "rol": "general", "tag": "Estado y Constitución · Igualdad y enfoque diferencial", "texto": "Usted es auxiliar administrativo de una subdirección local de la Secretaría Distrital de Integración Social de Bogotá, encargada de inscribir personas en cursos gratuitos de alfabetización digital. Durante la jornada ocurre lo siguiente: un compañero se niega a inscribir a un ciudadano porque este llevaba una camiseta de un partido político contrario al suyo; una ciudadana con discapacidad visual pide que la guía del curso se le entregue en un formato que pueda leer con su lector de pantalla; y un contratista propone excluir de los cursos a los mayores de 60 años porque, según él, «aprenden más lento y ocupan cupos».", "items": [{"id": "EC-104", "niv": 1, "e": "Ante la negativa del compañero a inscribir al ciudadano por su afinidad política, usted debe advertirle que", "f": "Constitución Política, art. 13", "o": [["A", "debe remitir al ciudadano a otra subdirección local para evitar un conflicto de intereses.", "No existe conflicto de intereses por la afinidad política del ciudadano. Remitirlo a otra sede es un trato diferente basado en su opinión política, prohibido por el artículo 13.", false], ["B", "todas las personas deben recibir la misma protección y trato de las autoridades, sin discriminación por opinión política.", "El artículo 13 de la Constitución dispone que todas las personas recibirán la misma protección y trato de las autoridades, sin discriminación por razones, entre otras, de opinión política o filosófica.", true], ["C", "puede negarse si el ciudadano hace propaganda dentro de la sede, pues los servidores públicos deben mantener la neutralidad política.", "La neutralidad política es un deber del servidor, no un motivo para negar un servicio al ciudadano. Llevar una prenda alusiva a un partido no autoriza un trato diferente en el acceso al curso.", false]]}, {"id": "EC-105", "niv": 2, "e": "Frente a la solicitud de la ciudadana con discapacidad visual, la actuación que corresponde es", "f": "Ley 1618 de 2013, art. 1; Constitución Política, art. 13", "o": [["A", "entregarle la guía en un formato accesible, como un ajuste razonable que le permita participar en igualdad de condiciones.", "La Ley 1618 de 2013 (art. 1) tiene por objeto garantizar el ejercicio efectivo de los derechos de las personas con discapacidad mediante medidas de inclusión, acción afirmativa y ajustes razonables, eliminando toda forma de discriminación por discapacidad. Adaptar el formato es un ajuste razonable.", true], ["B", "inscribirla en un grupo separado solo para personas con discapacidad, con un horario distinto.", "Separarla del curso general no elimina la barrera (el formato de la guía) y crea una segregación no solicitada. La inclusión busca que participe junto con los demás, con los apoyos necesarios.", false], ["C", "pedirle que asista con un acompañante que le lea la guía, pues la entidad no está obligada a modificar sus formatos.", "Trasladar a la ciudadana la carga de conseguir un lector desconoce el deber de eliminar barreras. La Ley 1618 de 2013 ordena garantizar sus derechos mediante medidas de inclusión, acción afirmativa y ajustes razonables.", false]]}, {"id": "EC-106", "niv": 3, "e": "Sobre la propuesta del contratista de excluir a los mayores de 60 años, lo correcto es señalar que", "f": "Constitución Política, art. 13 (jurisprudencia constitucional sobre el carácter enunciativo de los criterios del inciso 1)", "o": [["A", "es válida si se publica en la convocatoria antes de abrir las inscripciones.", "Publicar una regla discriminatoria no la vuelve constitucional. La publicidad no sustituye la justificación objetiva y razonable que exige cualquier trato diferente.", false], ["B", "es válida, porque la edad no figura entre los criterios de discriminación que enumera expresamente el artículo 13.", "La lista del artículo 13 no es taxativa; cualquier trato diferente debe tener una justificación objetiva y razonable. La ausencia de la edad en la enumeración no vuelve legítima una exclusión arbitraria.", false], ["C", "es contraria a la igualdad, porque introduce un trato diferente sin justificación objetiva y razonable.", "El artículo 13 garantiza los mismos derechos y oportunidades a todas las personas. Excluir a un grupo por un prejuicio sobre su capacidad de aprender, en un curso gratuito sin requisitos técnicos, es un trato diferente sin justificación objetiva y razonable, aunque la edad no esté en la lista del artículo.", true]]}]}, {"comp": "estado_constitucion", "rol": "profesional", "tag": "Estado y Constitución · Nivel profesional · Acción de tutela: términos y cumplimiento", "texto": "Usted es profesional universitario de la oficina jurídica de la Secretaría de Salud de un departamento. Una ciudadana de 78 años presentó un derecho de petición hace tres meses y nunca recibió respuesta, por lo que interpuso acción de tutela. El Juzgado Civil Municipal admitió la tutela y pidió a la secretaría un informe. Su jefe le encarga revisar los términos del trámite, explicar qué pasa si el fallo ordena responder y la secretaría no cumple, y definir qué hacer si la secretaría no está de acuerdo con la decisión.", "items": [{"id": "EC-107", "niv": 1, "e": "Al revisar los términos, usted debe informar que el juez debe decidir la tutela dentro de", "f": "Constitución Política, art. 86; Decreto 2591 de 1991, art. 29", "o": [["A", "los diez días siguientes a la presentación de la solicitud.", "El artículo 86 de la Constitución dispone que no pueden transcurrir más de diez días entre la solicitud de tutela y su resolución, y el artículo 29 del Decreto 2591 de 1991 ordena dictar el fallo dentro de los diez días siguientes a la presentación.", true], ["B", "los quince días hábiles siguientes a la notificación del auto admisorio.", "Quince días hábiles es el término general del derecho de petición, no el de la tutela. El fallo de tutela se cuenta desde la presentación de la solicitud y no desde la notificación del auto.", false], ["C", "los treinta días siguientes al reparto, prorrogables si hay pruebas pendientes.", "El término de la tutela es perentorio y breve: diez días desde la presentación de la solicitud. No existe un término de treinta días ni prórroga por pruebas.", false]]}, {"id": "EC-108", "niv": 3, "e": "Si el fallo ordena responder la petición y la secretaría no cumple dentro del plazo fijado, el juez", "f": "Decreto 2591 de 1991, arts. 27 y 52", "o": [["A", "deberá esperar la decisión de segunda instancia antes de exigir el cumplimiento.", "La impugnación no suspende el fallo: el artículo 31 del Decreto 2591 la permite sin perjuicio de su cumplimiento inmediato. El juez no debe esperar la segunda instancia.", false], ["B", "compulsará copias a la contraloría, que es la única autoridad que puede sancionar el incumplimiento.", "El incumplimiento de un fallo de tutela no es un asunto fiscal. El propio juez de tutela puede sancionar por desacato y requerir al superior del responsable (arts. 27 y 52).", false], ["C", "requerirá al superior del responsable para que lo haga cumplir y podrá sancionar por desacato.", "El artículo 27 del Decreto 2591 de 1991 dispone que si la autoridad no cumple dentro de las 48 horas siguientes, el juez requerirá a su superior para que haga cumplir el fallo y abra el procedimiento disciplinario, y podrá sancionar por desacato. El artículo 52 prevé arresto hasta de seis meses y multa hasta de 20 salarios mínimos.", true]]}, {"id": "EC-109", "niv": 3, "e": "Si la secretaría no está de acuerdo con el fallo de primera instancia, la actuación procedente es", "f": "Decreto 2591 de 1991, art. 31", "o": [["A", "impugnarlo dentro de los tres días siguientes a su notificación, con lo cual la orden queda suspendida.", "El término de tres días es correcto, pero la impugnación no suspende el fallo: el artículo 31 dispone expresamente que procede sin perjuicio de su cumplimiento inmediato.", false], ["B", "impugnarlo dentro de los tres días siguientes a su notificación, sin dejar de cumplir la orden.", "El artículo 31 del Decreto 2591 de 1991 permite a la autoridad pública impugnar el fallo dentro de los tres días siguientes a su notificación, sin perjuicio de su cumplimiento inmediato. La orden debe acatarse mientras se resuelve la impugnación.", true], ["C", "interponer recurso de reposición ante el mismo juez dentro de los diez días siguientes.", "Contra el fallo de tutela no procede reposición; el mecanismo es la impugnación, que conoce el superior y debe presentarse dentro de los tres días siguientes a la notificación.", false]]}]}, {"comp": "estado_constitucion", "rol": "profesional", "tag": "Estado y Constitución · Nivel profesional · Acción de tutela: procedencia", "texto": "Usted es profesional especializado de la oficina jurídica de una corporación autónoma regional. Llegan tres asuntos: (1) un usuario anuncia una tutela para que se deje sin efectos el acuerdo del consejo directivo que fija, para toda la jurisdicción, los criterios generales de cobro de un servicio de la corporación; (2) una asociación de vecinos considera que un permiso de vertimientos otorgado a una empresa afecta el río del cual se abastece todo el corregimiento y quiere usar la tutela para protegerlo; y (3) un juez concedió a un usuario una tutela como mecanismo transitorio mientras demanda ante la jurisdicción de lo contencioso administrativo.", "items": [{"id": "EC-110", "niv": 2, "e": "Sobre la tutela anunciada contra el acuerdo del consejo directivo, usted debe conceptuar que, en principio,", "f": "Decreto 2591 de 1991, art. 6, num. 5", "o": [["A", "es procedente solo si el usuario agotó antes la acción de cumplimiento.", "La acción de cumplimiento busca que se cumpla una norma, no que se deje sin efectos. Además, no es requisito previo de la tutela; la razón de la improcedencia es el carácter general del acto.", false], ["B", "es procedente, porque cualquier acto de una autoridad ambiental puede afectar derechos fundamentales.", "No basta con que el acto provenga de una autoridad: el artículo 6 del Decreto 2591 excluye la tutela contra actos de carácter general, impersonal y abstracto, como un acuerdo que fija criterios para toda la jurisdicción.", false], ["C", "es improcedente, porque se dirige contra un acto de carácter general, impersonal y abstracto.", "El numeral 5 del artículo 6 del Decreto 2591 de 1991 señala que la tutela no procede cuando se trate de actos de carácter general, impersonal y abstracto. El acuerdo que fija criterios para toda la jurisdicción tiene ese carácter.", true]]}, {"id": "EC-111", "niv": 2, "e": "Para proteger el río frente al permiso de vertimientos, el mecanismo judicial que corresponde a la asociación es", "f": "Decreto 2591 de 1991, art. 6, num. 3; Ley 472 de 1998, arts. 2 y 9; Constitución Política, art. 88", "o": [["A", "la acción de tutela en lugar de la acción popular, porque el ambiente sano está ligado a la vida de los habitantes.", "El artículo 6, numeral 3, del Decreto 2591 excluye la tutela para proteger derechos colectivos como el ambiente, salvo que un titular busque impedir un perjuicio irremediable a sus propios derechos fundamentales, situación que el caso no plantea.", false], ["B", "la acción popular, porque busca proteger un derecho colectivo frente a la acción u omisión de una autoridad o un particular.", "Las acciones populares son los medios procesales para proteger derechos e intereses colectivos (Ley 472, art. 2) y proceden contra acciones u omisiones de autoridades o particulares (art. 9). El ambiente es un derecho colectivo según el artículo 88 de la Constitución.", true], ["C", "la acción de grupo, porque los afectados son más de veinte habitantes del corregimiento.", "La acción de grupo sirve exclusivamente para obtener la indemnización de perjuicios individuales (Ley 472, arts. 3 y 46). La asociación busca proteger el río, no cobrar indemnizaciones.", false]]}, {"id": "EC-112", "niv": 3, "e": "Respecto de la tutela concedida como mecanismo transitorio, el usuario debe presentar la demanda ante lo contencioso administrativo en un término máximo de", "f": "Decreto 2591 de 1991, art. 8", "o": [["A", "dos meses contados desde el fallo de tutela.", "No corresponde al término del Decreto 2591. El artículo 8 fija un máximo de cuatro meses a partir del fallo de tutela.", false], ["B", "cuatro meses contados desde el fallo de tutela; si no lo hace, cesan los efectos de la tutela.", "El artículo 8 del Decreto 2591 de 1991 dispone que, cuando la tutela se concede como mecanismo transitorio, el afectado debe ejercer la acción ordinaria en un término máximo de cuatro meses a partir del fallo; si no la instaura, cesan sus efectos.", true], ["C", "seis meses contados desde la ejecutoria del acto, sin que ello afecte la vigencia de la tutela.", "El término se cuenta desde el fallo de tutela y es de cuatro meses. Además, si la demanda no se presenta, los efectos de la tutela cesan.", false]]}]}, {"comp": "estado_constitucion", "rol": "general", "tag": "Estado y Constitución · Acción de cumplimiento", "texto": "Usted es técnico administrativo de la Secretaría de Planeación de un municipio de cuarta categoría. Un acto administrativo general vigente obliga a la secretaría a publicar cada trimestre en la página web el listado de licencias de intervención del espacio público otorgadas. Hace un año no se publica. El 3 de marzo, un ciudadano radicó un escrito pidiendo que se cumpla esa obligación y anunció que, si no le responden, demandará. Además, otra ciudadana pregunta si puede usar la misma acción para obligar al municipio a construir un parque que ordenó un acuerdo municipal, aunque la obra no tiene recursos apropiados.", "items": [{"id": "EC-113", "niv": 2, "e": "Para que la demanda del ciudadano sea procedente, como regla general se requiere que", "f": "Ley 393 de 1997, art. 8", "o": [["A", "haya reclamado antes el cumplimiento y la autoridad se haya negado o no haya respondido en los diez días siguientes.", "El artículo 8 de la Ley 393 de 1997 exige, para constituir la renuencia, que el accionante haya reclamado previamente el cumplimiento y que la autoridad se ratifique en el incumplimiento o no conteste dentro de los diez días siguientes. Solo se exceptúa ante el inminente peligro de un perjuicio irremediable.", true], ["B", "hayan transcurrido tres meses sin respuesta, para que se configure el silencio administrativo negativo.", "El silencio negativo de tres meses es una figura del procedimiento administrativo general. La renuencia para la acción de cumplimiento se configura si la autoridad no contesta dentro de diez días o se ratifica en el incumplimiento.", false], ["C", "haya interpuesto los recursos de reposición y apelación contra la decisión de la secretaría que niega el cumplimiento del acto.", "La Ley 393 no exige agotar recursos administrativos. El requisito de procedibilidad es la constitución de la renuencia mediante la reclamación previa.", false]]}, {"id": "EC-114", "niv": 1, "e": "Si el ciudadano presenta la demanda, en primera instancia será competente", "f": "Ley 393 de 1997, art. 3, en concordancia con las reglas de competencia de la Ley 1437 de 2011", "o": [["A", "el juez civil municipal, por dirigirse contra una autoridad del orden municipal.", "La regla de reparto de jueces municipales corresponde a la tutela contra autoridades territoriales (Decreto 333 de 2021). La acción de cumplimiento tiene una regla propia en la Ley 393.", false], ["B", "el tribunal administrativo del departamento, por tratarse de una acción constitucional.", "El tribunal administrativo conoce de la segunda instancia. La primera corresponde a los jueces administrativos (art. 3 de la Ley 393 de 1997).", false], ["C", "el juez administrativo con competencia en el domicilio del accionante.", "El artículo 3 de la Ley 393 de 1997 asigna la primera instancia de la acción de cumplimiento a los jueces administrativos con competencia en el domicilio del accionante, y la segunda al tribunal administrativo del respectivo departamento; las reglas de competencia de la Ley 1437 de 2011 mantienen el conocimiento en la jurisdicción de lo contencioso administrativo.", true]]}, {"id": "EC-115", "niv": 3, "e": "Frente a la pregunta de la ciudadana sobre el parque, usted debe orientarla en el sentido de que la acción de cumplimiento", "f": "Ley 393 de 1997, art. 9, parágrafo", "o": [["A", "no procede, porque esta acción no puede perseguir el cumplimiento de normas que establezcan gastos.", "El parágrafo del artículo 9 de la Ley 393 de 1997 dispone que la acción de cumplimiento no puede perseguir el cumplimiento de normas que establezcan gastos. Construir el parque implica ejecutar un gasto.", true], ["B", "procede, pero debe tramitarse como tutela por tratarse del derecho a la recreación.", "El juez da trámite de tutela cuando se buscan proteger derechos garantizables por esa vía (art. 9, inc. 1), pero exigir la construcción de una obra que implica gasto no es la protección de un derecho fundamental concreto. La razón de la improcedencia es el parágrafo del artículo 9.", false], ["C", "procede, siempre que el parque esté incluido en el plan de desarrollo municipal.", "La inclusión en el plan de desarrollo no cambia la regla: el parágrafo del artículo 9 de la Ley 393 prohíbe usar esta acción para exigir el cumplimiento de normas que establezcan gastos.", false]]}]}, {"comp": "estado_constitucion", "rol": "profesional", "tag": "Estado y Constitución · Nivel profesional · Acciones populares y de grupo", "texto": "Usted es profesional universitario de la oficina jurídica de una corporación autónoma regional del Caribe. Desde hace meses, una planta procesadora vierte residuos a una ciénaga. Los habitantes del corregimiento quieren detener la contaminación, y 35 pescadores artesanales registran pérdidas individuales en sus ingresos por la mortandad de peces. El personero municipal anuncia que también puede acudir al juez. La asociación de habitantes pide a la corporación orientación sobre los pasos y los mecanismos judiciales disponibles.", "items": [{"id": "EC-116", "niv": 3, "e": "Antes de presentar la demanda para proteger la ciénaga, la asociación debe, como regla general,", "f": "Ley 1437 de 2011, art. 144; Ley 472 de 1998, art. 10", "o": [["A", "obtener un concepto previo favorable de la Procuraduría Ambiental sobre la existencia del daño.", "Ninguna norma exige un concepto previo de la Procuraduría para demandar. El requisito previo es la reclamación ante la autoridad o el particular.", false], ["B", "interponer los recursos de reposición y apelación contra el permiso otorgado a la planta.", "El artículo 10 de la Ley 472 de 1998 establece que no es necesario interponer previamente los recursos administrativos para intentar la acción popular.", false], ["C", "pedir a la autoridad que adopte medidas de protección y esperar quince días, salvo perjuicio irremediable.", "El artículo 144 de la Ley 1437 de 2011 exige solicitar a la autoridad o al particular en ejercicio de funciones administrativas que adopte las medidas necesarias; si no atiende la reclamación dentro de los quince días siguientes o se niega, puede acudirse al juez. Se exceptúa el inminente peligro de perjuicio irremediable.", true]]}, {"id": "EC-117", "niv": 1, "e": "Sobre quién puede presentar la acción popular para proteger la ciénaga, lo correcto es afirmar que", "f": "Ley 472 de 1998, art. 12", "o": [["A", "solo pueden hacerlo quienes demuestren un perjuicio personal y directo causado por los vertimientos de la planta.", "Exigir un perjuicio individual es propio de la acción de grupo. La acción popular protege intereses colectivos y la puede ejercer toda persona.", false], ["B", "puede hacerlo toda persona natural o jurídica y también el personero, en lo de su competencia.", "El artículo 12 de la Ley 472 de 1998 autoriza a toda persona natural o jurídica, a las organizaciones cívicas y no gubernamentales, a las entidades públicas de control y al Procurador, al Defensor y a los personeros distritales y municipales, en lo relacionado con su competencia.", true], ["C", "solo puede hacerlo la corporación, por ser la autoridad ambiental de la jurisdicción.", "La corporación puede actuar, pero no es la única legitimada. La Ley 472 amplía la titularidad a toda persona natural o jurídica y a otros actores.", false]]}, {"id": "EC-118", "niv": 3, "e": "Para obtener la reparación de las pérdidas de ingresos, los 35 pescadores pueden acudir a", "f": "Ley 472 de 1998, arts. 3, 46 y 47; Ley 1437 de 2011, art. 145", "o": [["A", "la acción de grupo, pues piden indemnizar perjuicios individuales de una misma causa y son más de veinte.", "La acción de grupo se ejerce exclusivamente para obtener el reconocimiento y pago de la indemnización de perjuicios individuales causados por una misma causa, y el grupo debe tener al menos veinte personas (Ley 472, arts. 3 y 46). Debe promoverse dentro de los dos años siguientes al daño o a su cese (art. 47).", true], ["B", "la acción popular, en la que el juez reparte una indemnización entre todos los habitantes afectados por la contaminación.", "La acción popular protege el derecho colectivo; la eventual condena a perjuicios se dirige a la entidad pública no culpable que tenga a su cargo el derecho, no al reparto de indemnizaciones individuales.", false], ["C", "la acción de cumplimiento, para que la corporación aplique las normas de vertimientos y pague los daños.", "La acción de cumplimiento busca que se cumpla una norma o acto administrativo; no es un mecanismo para indemnizar perjuicios individuales.", false]]}]}, {"comp": "estado_constitucion", "rol": "general", "tag": "Estado y Constitución · Habeas data", "texto": "Usted es técnico administrativo del área de atención a la ciudadanía de un instituto distrital de Bogotá que administra una base de datos de beneficiarios de subsidios. Un ciudadano radica una consulta para conocer qué información personal suya reposa en la base. Otra ciudadana presenta un reclamo completo, recibido el lunes 1 de febrero de 2027, para que se corrija su dirección y su estado civil. Además, la Secretaría Distrital de Salud solicita al instituto los datos de contacto de los beneficiarios mayores de 70 años para un programa de vacunación que le asignan sus funciones legales. No hay días festivos entre el 1 de febrero y el 5 de marzo de 2027.", "items": [{"id": "EC-119", "niv": 1, "e": "La consulta del ciudadano sobre su información personal debe atenderse en un término máximo de", "f": "Ley 1581 de 2012, art. 14", "o": [["A", "cinco días hábiles, prorrogables por otros cinco.", "Cinco días hábiles es la prórroga máxima de la consulta, no su término inicial. El artículo 14 fija diez días hábiles.", false], ["B", "diez días hábiles, prorrogables hasta por cinco días hábiles más informando el motivo.", "El artículo 14 de la Ley 1581 de 2012 dispone que la consulta se atenderá en un máximo de diez días hábiles desde su recibo; si no es posible, se informa el motivo y la fecha de respuesta, que no puede superar cinco días hábiles adicionales.", true], ["C", "quince días hábiles, prorrogables hasta por ocho días hábiles más.", "Quince días hábiles prorrogables por ocho es el término del reclamo (art. 15), no el de la consulta.", false]]}, {"id": "EC-120", "niv": 3, "e": "Si no se informa a la ciudadana ninguna prórroga, el término máximo para atender su reclamo vence el", "f": "Ley 1581 de 2012, art. 15, num. 3", "o": [["A", "15 de febrero de 2027.", "Corresponde a contar diez días hábiles, que es el término de la consulta (art. 14). El reclamo tiene quince días hábiles.", false], ["B", "22 de febrero de 2027.", "El artículo 15 de la Ley 1581 de 2012 fija quince días hábiles contados a partir del día siguiente al recibo. Desde el martes 2 de febrero de 2027, sin festivos, el día hábil 15 es el lunes 22 de febrero de 2027.", true], ["C", "4 de marzo de 2027.", "Resulta de sumar la prórroga de ocho días hábiles, que solo procede si se informa a la titular el motivo de la demora y la nueva fecha. Sin esa comunicación, el término es de quince días hábiles.", false]]}, {"id": "EC-121", "niv": 2, "e": "Frente a la solicitud de la Secretaría Distrital de Salud, el instituto puede entregar los datos de contacto", "f": "Ley 1581 de 2012, art. 10, lit. a", "o": [["A", "solo si un juez lo ordena, porque se trata de datos personales.", "La orden judicial es una de las excepciones, pero no la única. El literal a del artículo 10 también exceptúa la información requerida por una entidad pública en ejercicio de sus funciones legales.", false], ["B", "solo con la autorización previa, expresa e informada de cada beneficiario, otorgada por escrito y conservada en el expediente.", "La autorización es la regla general (art. 9), pero el artículo 10 exceptúa la información requerida por una entidad pública en ejercicio de sus funciones legales.", false], ["C", "sin autorización de los titulares, porque la requiere una entidad pública en ejercicio de sus funciones legales.", "El literal a del artículo 10 de la Ley 1581 de 2012 dispone que no es necesaria la autorización del titular cuando se trate de información requerida por una entidad pública o administrativa en ejercicio de sus funciones legales. La entidad receptora queda obligada a cumplir la ley.", true]]}]}, {"comp": "estado_constitucion", "rol": "general", "tag": "Estado y Constitución · Habeas corpus", "texto": "Usted es auxiliar administrativo de la Secretaría de Gobierno de un municipio de quinta categoría. Un domingo en la noche llega la madre de un joven que fue retenido el viernes en una estación de policía. Según ella, nadie le ha explicado el motivo, no ha sido puesto a disposición de ningún juez y no tiene abogado. La señora pregunta si puede presentar una tutela, cuánto se tardará la decisión y ante quién debe acudir, pues no sabe redactar escritos ni tiene recursos para un apoderado.", "items": [{"id": "EC-122", "niv": 1, "e": "Para proteger la libertad del joven, el mecanismo que debe indicarse a la madre es", "f": "Ley 1095 de 2006, art. 1; Decreto 2591 de 1991, art. 6, num. 2", "o": [["A", "el habeas corpus, que protege la libertad de quien es privado de ella con violación de sus garantías.", "El artículo 1 de la Ley 1095 de 2006 define el habeas corpus como derecho fundamental y acción constitucional que tutela la libertad personal en esos eventos, y no se suspende ni siquiera en estados de excepción.", true], ["B", "la acción de tutela, porque la libertad personal es un derecho fundamental.", "Aunque la libertad es fundamental, el numeral 2 del artículo 6 del Decreto 2591 dispone que la tutela no procede cuando el derecho puede protegerse con el habeas corpus.", false], ["C", "una queja ante la personería municipal, que como agente del Ministerio Público puede ordenar la libertad inmediata del joven.", "La personería puede vigilar la actuación policial, pero no ordena libertades. Solo la autoridad judicial que conoce del habeas corpus puede ordenar la liberación.", false]]}, {"id": "EC-123", "niv": 2, "e": "Sobre el término para decidir, debe informarse a la madre que la solicitud se resuelve en", "f": "Ley 1095 de 2006, art. 3", "o": [["A", "un término de treinta y seis horas.", "El artículo 3 de la Ley 1095 de 2006 garantiza invocar el habeas corpus ante cualquier autoridad judicial para que sea resuelto en un término de treinta y seis horas, sin que se suspenda por festivos o vacancia judicial.", true], ["B", "un término de cuarenta y ocho horas.", "Cuarenta y ocho horas es el plazo máximo de cumplimiento de un fallo de tutela (Decreto 2591, art. 29). El habeas corpus se resuelve en treinta y seis horas.", false], ["C", "un término de diez días.", "Diez días es el término para fallar una tutela. El habeas corpus, por proteger la libertad, tiene un término mucho más corto: treinta y seis horas.", false]]}, {"id": "EC-124", "niv": 2, "e": "Respecto de ante quién y cómo presentar la solicitud, lo correcto es orientarla a que", "f": "Ley 1095 de 2006, arts. 2, 3 y 4", "o": [["A", "espere al lunes para presentarla con abogado ante el juez penal del circuito.", "La ley garantiza que el trámite no se suspenda por festivos (art. 3), que no se requiera apoderado (art. 4) y que cualquier juez sea competente (art. 2).", false], ["B", "la presente por escrito ante el inspector de policía, que es la autoridad administrativa competente en el municipio.", "El habeas corpus no lo resuelven autoridades administrativas. Son competentes los jueces y tribunales de la Rama Judicial (art. 2).", false], ["C", "la presente ante cualquier juez o tribunal de la Rama Judicial, aun verbalmente y sin apoderado.", "Son competentes todos los jueces y tribunales de la Rama Judicial (art. 2); la acción puede invocarse por terceros sin mandato (art. 3) y ejercerse sin formalidad, incluso verbalmente y sin apoderado (art. 4).", true]]}]}, {"comp": "estado_constitucion", "rol": "general", "tag": "Estado y Constitución · Estructura del Estado: ramas y órganos autónomos", "texto": "Usted es técnico del área de talento humano de una alcaldía de segunda categoría y prepara el módulo de inducción para el personal que ingresará por concurso. El borrador heredado de una administración anterior contiene varias afirmaciones dudosas: que «el poder público tiene cuatro ramas, incluida la de control»; que «la personería es una oficina de la Secretaría de Gobierno»; y que «la carrera administrativa del municipio la administra el Departamento Administrativo de la Función Pública». Su jefe le pide corregir el material antes de la jornada.", "items": [{"id": "EC-125", "niv": 1, "e": "Al explicar la estructura del Estado según la Constitución, el módulo debe indicar que", "f": "Constitución Política, art. 113", "o": [["A", "existen cuatro ramas del poder público: legislativa, ejecutiva, judicial y de control fiscal y disciplinario.", "La Constitución reconoce solo tres ramas. Los órganos de control no forman una rama; son órganos autónomos e independientes (arts. 113 y 117).", false], ["B", "los órganos de control hacen parte de la rama ejecutiva, porque vigilan a la administración pública.", "Vigilar a la administración no convierte a los órganos de control en parte de la rama ejecutiva. El artículo 113 los ubica fuera de las ramas, como órganos autónomos e independientes.", false], ["C", "además de las tres ramas existen órganos autónomos e independientes, y todos colaboran armónicamente.", "El artículo 113 de la Constitución dispone que son ramas del poder público la legislativa, la ejecutiva y la judicial, que además existen otros órganos autónomos e independientes para las demás funciones del Estado, y que los órganos tienen funciones separadas pero colaboran armónicamente.", true]]}, {"id": "EC-126", "niv": 2, "e": "Sobre la personería municipal, el módulo debe presentarla como", "f": "Constitución Política, art. 118; Ley 136 de 1994, art. 178", "o": [["A", "la entidad que ejerce en el municipio funciones de Ministerio Público, bajo dirección del Procurador.", "El artículo 118 de la Constitución menciona a los personeros municipales entre quienes ejercen el Ministerio Público, y el artículo 178 de la Ley 136 de 1994 dispone que el personero ejerce esas funciones en el municipio bajo la dirección suprema del Procurador General de la Nación.", true], ["B", "una dependencia de la Secretaría de Gobierno, sometida a la dirección jerárquica del alcalde y a su manual de funciones.", "La personería no depende del alcalde. El artículo 118 la incluye en el Ministerio Público y el artículo 178 de la Ley 136 de 1994 señala que el personero actúa bajo la dirección suprema del Procurador General.", false], ["C", "una oficina seccional de la Contraloría General de la República en el municipio.", "La Contraloría es el otro órgano de control, encargado de la gestión fiscal (art. 119). La personería pertenece al Ministerio Público, no a la Contraloría.", false]]}, {"id": "EC-127", "niv": 1, "e": "Respecto de la entidad responsable de administrar y vigilar la carrera administrativa de los empleados de la alcaldía, el módulo debe corregirse para indicar que es", "f": "Constitución Política, art. 130", "o": [["A", "la Procuraduría General de la Nación, por medio de los personeros.", "La Procuraduría vigila la conducta oficial de los servidores; no administra la carrera administrativa, función que el artículo 130 asigna a la Comisión Nacional del Servicio Civil.", false], ["B", "la Comisión Nacional del Servicio Civil, por mandato constitucional.", "El artículo 130 de la Constitución dispone que la Comisión Nacional del Servicio Civil es responsable de la administración y vigilancia de las carreras de los servidores públicos, excepto las que tengan carácter especial.", true], ["C", "el Departamento Administrativo de la Función Pública.", "Función Pública formula políticas de empleo público, pero la Constitución asigna la administración y vigilancia de la carrera a la Comisión Nacional del Servicio Civil (art. 130).", false]]}]}, {"comp": "estado_constitucion", "rol": "general", "tag": "Estado y Constitución · Organización electoral", "texto": "Usted es auxiliar administrativo de la Secretaría de Gobierno de un municipio de quinta categoría. Se acerca una jornada de votación y la secretaría debe coordinar con las autoridades electorales la logística de los puestos. Una ciudadana pregunta quién organiza las elecciones y quién expide las cédulas. Por otra parte, un amigo suyo que trabaja como técnico en la personería municipal le cuenta que quiere hacer campaña, en sus horas libres, por un candidato al concejo.", "items": [{"id": "EC-128", "niv": 1, "e": "Al explicar a la ciudadana qué entidades conforman la organización electoral, usted debe mencionar", "f": "Constitución Política, art. 120", "o": [["A", "al Consejo Nacional Electoral y a las secretarías de gobierno de los municipios donde se instalan los puestos de votación.", "Las alcaldías apoyan la logística, pero no integran la organización electoral, que la Constitución conforma con el Consejo Nacional Electoral y la Registraduría.", false], ["B", "a la Registraduría Nacional del Estado Civil y a la Procuraduría General de la Nación.", "La Procuraduría vigila la conducta oficial de los servidores, también en época electoral, pero no forma parte de la organización electoral según el artículo 120.", false], ["C", "al Consejo Nacional Electoral, a la Registraduría Nacional del Estado Civil y a los demás organismos que fije la ley.", "El artículo 120 de la Constitución dispone que la organización electoral está conformada por el Consejo Nacional Electoral, por la Registraduría Nacional del Estado Civil y por los demás organismos que establezca la ley.", true]]}, {"id": "EC-129", "niv": 1, "e": "Sobre quién dirige y organiza las elecciones y tiene a su cargo la identificación de las personas, lo correcto es responder que corresponde", "f": "Constitución Política, arts. 265 y 266", "o": [["A", "al Registrador Nacional del Estado Civil, según la Constitución.", "El artículo 266 de la Constitución asigna al Registrador Nacional del Estado Civil la dirección y organización de las elecciones, el registro civil y la identificación de las personas.", true], ["B", "al alcalde municipal, como primera autoridad electoral del municipio.", "El alcalde no es autoridad electoral. La dirección y organización de las elecciones y la identificación corresponden al Registrador Nacional (art. 266).", false], ["C", "al Consejo Nacional Electoral, que expide las cédulas a través de sus delegados.", "Al Consejo Nacional Electoral le corresponde la suprema inspección y vigilancia de la organización electoral (art. 265), no la expedición de documentos de identidad.", false]]}, {"id": "EC-130", "niv": 2, "e": "Frente a la intención de su amigo de hacer campaña en sus horas libres, usted debe advertirle que", "f": "Constitución Política, art. 127", "o": [["A", "puede hacerlo si solicita una licencia no remunerada durante el periodo de campaña.", "La licencia no levanta la prohibición constitucional, que se deriva de la calidad de empleado de un órgano de control.", false], ["B", "no puede participar en actividades de partidos ni en controversias políticas, aunque sí puede votar.", "El artículo 127 de la Constitución prohíbe a los empleados del Estado que se desempeñan en la Rama Judicial y en los órganos electorales, de control y de seguridad tomar parte en las actividades de los partidos y en las controversias políticas, sin perjuicio de ejercer libremente el derecho al sufragio. La personería es un órgano de control.", true], ["C", "puede hacerlo fuera del horario laboral, siempre que no use bienes ni recursos de la personería municipal.", "La prohibición para los empleados de los órganos de control no depende del horario ni de los bienes usados: el artículo 127 les prohíbe tomar parte en actividades de partidos y controversias políticas.", false]]}]}, {"comp": "estado_constitucion", "rol": "general", "tag": "Estado y Constitución · Procuraduría y personerías", "texto": "Usted es profesional universitario de la oficina de control interno disciplinario de una alcaldía de tercera categoría, que adelanta una investigación contra un secretario de despacho por presuntas irregularidades en la entrega de subsidios. La Procuraduría Provincial comunica que asumirá esa investigación. A la vez, varios ciudadanos se quejan de que la alcaldía no responde sus derechos de petición, y la personería solicita copia de un informe interno sobre los subsidios; un funcionario de la alcaldía sostiene que ese informe es reservado y no debe entregarse.", "items": [{"id": "EC-131", "niv": 2, "e": "Que la Procuraduría Provincial asuma la investigación que adelanta la oficina de control interno disciplinario es posible porque", "f": "Constitución Política, art. 277, num. 6", "o": [["A", "la Procuraduría ejerce de manera preferente el poder disciplinario sobre quienes desempeñan funciones públicas.", "El numeral 6 del artículo 277 de la Constitución atribuye al Procurador General, por sí o por medio de sus delegados y agentes, ejercer vigilancia superior de la conducta oficial y ejercer preferentemente el poder disciplinario.", true], ["B", "la oficina de control interno disciplinario carece de competencia para investigar a los secretarios de despacho.", "La oficina de control interno disciplinario sí puede investigar a los servidores de la entidad. La Procuraduría asume el asunto por su poder preferente, no por falta de competencia de la oficina.", false], ["C", "la Procuraduría es la segunda instancia de todas las decisiones disciplinarias de la alcaldía.", "Ser segunda instancia no explica que la Procuraduría asuma la primera. La figura que lo permite es el poder disciplinario preferente.", false]]}, {"id": "EC-132", "niv": 1, "e": "A los ciudadanos que se quejan por la falta de respuesta a sus peticiones, usted puede orientarlos a acudir a la personería, porque al personero le corresponde", "f": "Ley 136 de 1994, art. 178, num. 8", "o": [["A", "resolver de fondo las peticiones que la alcaldía deje sin respuesta.", "El personero vigila y promueve las acciones pertinentes, pero no sustituye a la alcaldía en la respuesta de fondo de las peticiones dirigidas a esta.", false], ["B", "imponer multas al alcalde por cada petición sin respuesta.", "El personero no impone multas por esa vía. Puede adelantar actuaciones disciplinarias y promover acciones, pero la ley no le asigna una facultad de multa por petición.", false], ["C", "velar, con arreglo a la ley, por la efectividad del derecho de petición.", "El numeral 8 del artículo 178 de la Ley 136 de 1994 asigna al personero la función de velar por la efectividad del derecho de petición con arreglo a la ley.", true]]}, {"id": "EC-133", "niv": 3, "e": "Frente a la solicitud de la personería del informe interno sobre los subsidios, la alcaldía debe", "f": "Ley 136 de 1994, art. 178, num. 10", "o": [["A", "entregarlo solo si el personero demuestra que actúa en nombre de un ciudadano con interés directo.", "El personero actúa en ejercicio de sus propias funciones de Ministerio Público; no necesita representar a un ciudadano para exigir información.", false], ["B", "entregarlo, porque al personero no puede oponérsele reserva, salvo las excepciones de la Constitución o la ley.", "El numeral 10 del artículo 178 de la Ley 136 de 1994 faculta al personero para exigir a los funcionarios públicos municipales la información necesaria y oportuna, sin que pueda oponérsele reserva alguna, salvo la excepción prevista por la Constitución o la ley.", true], ["C", "negarlo, porque solo un juez puede ordenar la entrega de documentos internos de la administración.", "La ley faculta directamente al personero para exigir información a los funcionarios municipales; no requiere orden judicial.", false]]}]}, {"comp": "estado_constitucion", "rol": "general", "tag": "Estado y Constitución · Defensoría del Pueblo", "texto": "Usted es técnico administrativo de la Secretaría de Gobierno de una gobernación de frontera que atiende población migrante. Un grupo de familias pide ayuda porque una entidad de salud les niega atención y quieren que alguien presente una tutela en su nombre. Uno de los migrantes, además, fue vinculado a un proceso penal y no tiene recursos para pagar un abogado. En una mesa técnica, un contratista afirma que el Defensor del Pueblo es elegido por el Senado, igual que el Procurador.", "items": [{"id": "EC-134", "niv": 1, "e": "Para que la tutela sea presentada en nombre de las familias que lo soliciten, usted puede orientarlas a acudir a", "f": "Decreto 2591 de 1991, art. 46; Constitución Política, art. 282, num. 3", "o": [["A", "la Defensoría del Pueblo, que puede interponer tutelas en nombre de cualquier persona que se lo solicite.", "El artículo 46 del Decreto 2591 de 1991 faculta al Defensor del Pueblo para interponer la tutela en nombre de cualquier persona que se lo solicite o que esté en situación de desamparo, y el numeral 3 del artículo 282 de la Constitución le asigna esa función.", true], ["B", "la Registraduría Nacional, porque primero deben regularizar su documento de identidad.", "La protección de derechos fundamentales no depende de la regularización migratoria ni corresponde a la Registraduría. La Defensoría puede presentar la tutela en su nombre.", false], ["C", "la Contraloría departamental, que vigila los recursos de salud del departamento.", "La contraloría ejerce control fiscal; no está facultada para interponer tutelas en nombre de las personas.", false]]}, {"id": "EC-135", "niv": 1, "e": "Para el migrante procesado penalmente que no tiene recursos, la orientación correcta es acudir a", "f": "Constitución Política, art. 282, num. 4", "o": [["A", "la personería municipal, que le asignará como defensor a uno de los abogados de su planta.", "El personero interviene en los procesos penales como agente del Ministerio Público, no como defensor del procesado. La defensoría pública la organiza y dirige el Defensor del Pueblo.", false], ["B", "la Defensoría del Pueblo, que organiza y dirige la defensoría pública.", "El numeral 4 del artículo 282 de la Constitución asigna al Defensor del Pueblo la función de organizar y dirigir la defensoría pública en los términos que señale la ley.", true], ["C", "la Fiscalía General de la Nación, que debe designarle un fiscal como defensor de oficio.", "La Fiscalía es la parte acusadora en el proceso penal; no puede asumir la defensa del procesado.", false]]}, {"id": "EC-136", "niv": 2, "e": "Frente a la afirmación del contratista sobre la elección del Defensor del Pueblo, lo correcto es aclarar que lo elige", "f": "Constitución Política, arts. 276 y 281", "o": [["A", "el Congreso en pleno, de lista de elegibles conformada por convocatoria pública.", "Esa es la forma de elección del Contralor General de la República (art. 267). El Defensor lo elige la Cámara de Representantes.", false], ["B", "el Senado de la República, de terna integrada por el Presidente, la Corte Suprema y el Consejo de Estado.", "Esa es la forma de elección del Procurador General de la Nación (art. 276), no la del Defensor del Pueblo.", false], ["C", "la Cámara de Representantes, de terna elaborada por el Presidente de la República.", "El artículo 281 de la Constitución, modificado por el Acto Legislativo 2 de 2015, dispone que el Defensor del Pueblo ejerce sus funciones de manera autónoma y es elegido por la Cámara de Representantes para un periodo de cuatro años, de terna elaborada por el Presidente de la República.", true]]}]}, {"comp": "estado_constitucion", "rol": "profesional", "tag": "Estado y Constitución · Nivel profesional · Control fiscal", "texto": "Usted es profesional universitario de la Secretaría de Infraestructura de un departamento. La Contraloría Departamental adelanta una auditoría sobre contratos de vías terciarias ya ejecutados. En una reunión, un funcionario de la contraloría departamental anuncia que, además, emitirá una «advertencia obligatoria» sobre un contrato que aún no se ha firmado y que exigirá aprobar previamente sus cláusulas. Por otra parte, el alcalde de un municipio de sexta categoría del departamento, que no tiene contraloría propia, pregunta qué órgano vigila la gestión fiscal de su municipio.", "items": [{"id": "EC-137", "niv": 1, "e": "Según la Constitución, el control fiscal se ejerce", "f": "Constitución Política, art. 267 (modificado por el Acto Legislativo 4 de 2019)", "o": [["A", "en forma previa y perceptiva, mediante la aprobación de los contratos antes de su firma.", "El control previo fue eliminado. El artículo 267 vigente establece un control posterior y selectivo, que puede ser además preventivo y concomitante, sin coadministración.", false], ["B", "exclusivamente en forma posterior, una vez liquidados los contratos.", "Desde el Acto Legislativo 4 de 2019 el control fiscal no es exclusivamente posterior: también puede ser preventivo y concomitante.", false], ["C", "en forma posterior y selectiva, y además puede ser preventivo y concomitante según sea necesario.", "El artículo 267 de la Constitución, modificado por el Acto Legislativo 4 de 2019, dispone que el control fiscal se ejerce en forma posterior y selectiva y que además podrá ser preventivo y concomitante, según sea necesario para proteger el patrimonio público.", true]]}, {"id": "EC-138", "niv": 3, "e": "Frente a lo anunciado por el funcionario de la contraloría departamental sobre el contrato que no se ha firmado, usted debe señalar que el control preventivo y concomitante", "f": "Constitución Política, art. 267 (texto modificado por el Acto Legislativo 4 de 2019, que fija expresamente el carácter excepcional y no vinculante de este control)", "o": [["A", "es excepcional, no vinculante, sin coadministración y exclusivo del Contralor General.", "El artículo 267 dispone que el control concomitante y preventivo es excepcional, no vinculante, no implica coadministración, se realiza en forma de advertencia al gestor fiscal y su ejercicio y coordinación corresponden exclusivamente al Contralor General de la República.", true], ["B", "es obligatorio para la entidad y suspende la firma del contrato hasta que la contraloría departamental lo autorice.", "El control preventivo y concomitante no es vinculante ni suspende decisiones; se expresa como advertencia y corresponde exclusivamente al Contralor General.", false], ["C", "permite a la contraloría departamental aprobar las cláusulas antes de la firma, pero su advertencia no es obligatoria.", "Aprobar previamente las cláusulas sería coadministración, prohibida por el artículo 267. Además, ese control corresponde exclusivamente al Contralor General.", false]]}, {"id": "EC-139", "niv": 2, "e": "Al alcalde del municipio sin contraloría propia debe responderse que la vigilancia de la gestión fiscal de su municipio corresponde a", "f": "Constitución Política, art. 272", "o": [["A", "la oficina de control interno de la alcaldía, que reemplaza el control fiscal externo.", "El control interno (art. 269) es un control de la propia entidad y no reemplaza el control fiscal externo que ejercen las contralorías.", false], ["B", "la contraloría departamental, sin perjuicio del control concurrente y prevalente de la Contraloría General de la República.", "El inciso 2 del artículo 272 de la Constitución dispone que la vigilancia de los municipios incumbe a las contralorías departamentales, salvo lo que la ley determine respecto de contralorías municipales; como el municipio no tiene contraloría propia, la competencia es de la contraloría departamental. Ello no excluye a la Contraloría General de la República: el mismo artículo prevé el ejercicio concurrente con ella y remite a la ley la regulación de su prevalencia, y su control es preferente en los términos de la ley (arts. 267 y 272).", true], ["C", "la personería municipal, que asume el control fiscal donde no hay contraloría.", "La personería ejerce funciones de Ministerio Público, no de control fiscal. La Constitución asigna la vigilancia fiscal de los municipios a las contralorías departamentales.", false]]}]}, {"comp": "estado_constitucion", "rol": "general", "tag": "Estado y Constitución · Contralorías territoriales y responsabilidad fiscal", "texto": "Usted es técnico de la oficina de control interno de un instituto descentralizado de Bogotá. La Contraloría de Bogotá detectó pagos duplicados a un contratista por 85 millones de pesos y anunció que abrirá un proceso. Un directivo pregunta qué autoridad establece la responsabilidad por ese detrimento y quién vigila, a su vez, la gestión fiscal de la propia Contraloría de Bogotá. Además, una veeduría ciudadana considera que la contraloría territorial ha actuado sin objetividad en otro asunto y pregunta qué puede hacer.", "items": [{"id": "EC-140", "niv": 1, "e": "Para establecer la responsabilidad derivada del detrimento por los pagos duplicados, la autoridad competente es", "f": "Constitución Política, arts. 268, num. 5, y 272", "o": [["A", "la Personería de Bogotá, mediante un proceso disciplinario contra el servidor que ordenó los pagos.", "El proceso disciplinario juzga la conducta del servidor frente a sus deberes, pero no establece la responsabilidad fiscal por el detrimento patrimonial.", false], ["B", "la Fiscalía General, mediante una investigación penal.", "La Fiscalía investiga delitos. La responsabilidad fiscal por el detrimento corresponde a la contraloría competente; ambos procesos pueden coexistir.", false], ["C", "la Contraloría de Bogotá, mediante el proceso de responsabilidad fiscal a su cargo.", "El numeral 5 del artículo 268 atribuye al Contralor establecer la responsabilidad derivada de la gestión fiscal, imponer sanciones pecuniarias y ejercer jurisdicción coactiva; el artículo 272 asigna esas funciones, en lo pertinente, a los contralores distritales.", true]]}, {"id": "EC-141", "niv": 2, "e": "Sobre quién vigila la gestión fiscal de la Contraloría de Bogotá, lo correcto es responder que corresponde", "f": "Constitución Política, art. 274", "o": [["A", "a la Contraloría General de la República, como superior de las contralorías territoriales.", "La Contraloría General no es superior jerárquico de las contralorías territoriales, y la vigilancia de la gestión fiscal de estas corresponde a la Auditoría General (art. 274).", false], ["B", "a la Auditoría General de la República, por disposición constitucional.", "El artículo 274 de la Constitución dispone que la vigilancia de la gestión fiscal de la Contraloría General y de todas las contralorías territoriales la ejerce el Auditor General de la República.", true], ["C", "al Concejo de Bogotá, que eligió al contralor distrital.", "El concejo elige al contralor (art. 272), pero no vigila la gestión fiscal de la contraloría; esa función es del Auditor General.", false]]}, {"id": "EC-142", "niv": 3, "e": "Ante la falta de objetividad que la veeduría atribuye a la contraloría territorial, una vía prevista en el ordenamiento es", "f": "Constitución Política, art. 268, num. 14 (modificado por el Acto Legislativo 4 de 2019); los casos excepcionales los define la ley", "o": [["A", "pedir a la Contraloría General que intervenga en los casos excepcionales previstos por la ley.", "El numeral 14 del artículo 268 de la Constitución, modificado por el Acto Legislativo 4 de 2019, permite al Contralor General intervenir en los casos excepcionales previstos por la ley en las funciones de vigilancia y control de las contralorías territoriales, y señala que esa intervención puede ser solicitada, entre otros, por la ciudadanía mediante cualquiera de los mecanismos de participación ciudadana. La ley define los casos y el procedimiento.", true], ["B", "solicitar al concejo distrital que realice directamente la auditoría fiscal del caso.", "El concejo ejerce control político; no realiza auditorías fiscales, que son función técnica de las contralorías.", false], ["C", "pedir a la Procuraduría que asuma el control fiscal de los asuntos en los que la contraloría no fue objetiva.", "La Procuraduría ejerce control disciplinario y no puede asumir el control fiscal. La intervención en las funciones de las contralorías territoriales corresponde a la Contraloría General.", false]]}]}, {"comp": "estado_constitucion", "rol": "general", "tag": "Estado y Constitución · Órganos de control: competencias", "texto": "Usted es auxiliar administrativo de la Secretaría General de una alcaldía de segunda categoría. Un informe periodístico revela que en un contrato de suministro de alimentos escolares se pagaron raciones que nunca se entregaron, con la presunta participación del supervisor, un servidor municipal. El alcalde pide a su oficina preparar una ficha para la comunidad que explique qué autoridades externas pueden intervenir y qué alcance tiene cada actuación.", "items": [{"id": "EC-143", "niv": 1, "e": "En la ficha debe indicarse que la determinación del daño patrimonial y de quién debe resarcirlo corresponde a", "f": "Constitución Política, arts. 119 y 272", "o": [["A", "la personería municipal, porque vigila la conducta oficial de los servidores municipales que intervinieron en el contrato.", "La personería vigila la conducta oficial y ejerce funciones disciplinarias, pero no establece responsabilidad fiscal por el daño patrimonial.", false], ["B", "la contraloría competente, porque tiene a su cargo la vigilancia de la gestión fiscal.", "El artículo 119 asigna a la Contraloría la vigilancia de la gestión fiscal y el control de resultado de la administración; en el nivel territorial, el artículo 272 asigna esa vigilancia a las contralorías territoriales. Ellas establecen la responsabilidad fiscal.", true], ["C", "el concejo municipal, mediante un debate de control político al alcalde.", "El control político del concejo no determina responsabilidades patrimoniales; esa es una función de las contralorías.", false]]}, {"id": "EC-144", "niv": 2, "e": "Respecto de la conducta del supervisor como servidor municipal, una autoridad externa que puede ejercer preferentemente la función disciplinaria es", "f": "Ley 136 de 1994, art. 178, num. 4", "o": [["A", "la personería municipal, respecto de los servidores públicos del municipio.", "El numeral 4 del artículo 178 de la Ley 136 de 1994 asigna al personero vigilar la conducta oficial de quienes desempeñan funciones públicas municipales y ejercer preferentemente la función disciplinaria respecto de los servidores públicos municipales.", true], ["B", "el concejo municipal, por medio de la moción de censura.", "La moción de censura es un instrumento de control político frente a secretarios del alcalde; no es un proceso disciplinario contra servidores como el supervisor.", false], ["C", "la contraloría departamental, en el mismo proceso de responsabilidad fiscal.", "La contraloría establece responsabilidad fiscal, no disciplinaria. Si encuentra posibles faltas, debe dar traslado a la autoridad disciplinaria competente.", false]]}, {"id": "EC-145", "niv": 2, "e": "Si además se abre una investigación penal, los resultados de las indagaciones preliminares o del proceso de responsabilidad fiscal que adelante la contraloría", "f": "Constitución Política, art. 271 (modificado por el Acto Legislativo 4 de 2019)", "o": [["A", "carecen de valor en el proceso penal, porque son actuaciones administrativas ajenas a la jurisdicción penal.", "El artículo 271 dispone expresamente lo contrario: esos resultados tienen valor probatorio ante la Fiscalía y el juez.", false], ["B", "solo pueden usarse si la Procuraduría los valida previamente.", "La Constitución no condiciona el valor probatorio de esos resultados a una validación de la Procuraduría.", false], ["C", "tendrán valor probatorio ante la Fiscalía General de la Nación y el juez competente.", "El artículo 271 de la Constitución, modificado por el Acto Legislativo 4 de 2019, dispone que los resultados de los ejercicios de vigilancia y control fiscal, así como de las indagaciones preliminares o los procesos de responsabilidad fiscal adelantados por las contralorías, tienen valor probatorio ante la Fiscalía General de la Nación y el juez competente.", true]]}]}, {"comp": "estado_constitucion", "rol": "general", "tag": "Estado y Constitución · Ministerio Público", "texto": "Usted es técnico administrativo de la oficina de participación ciudadana de una gobernación y prepara una cartilla para líderes comunales sobre los organismos de control. Un líder le comenta que, según le dijeron, «el Procurador lo nombra el Presidente», «los personeros son independientes y no responden ante nadie» y «el Ministerio Público se encarga de revisar las cuentas y el gasto de las entidades». Usted debe aclarar estas ideas en la cartilla.", "items": [{"id": "EC-146", "niv": 2, "e": "En la cartilla debe explicarse que el Procurador General de la Nación es elegido por", "f": "Constitución Política, art. 276", "o": [["A", "el Senado, de terna integrada por candidatos del Presidente, la Corte Suprema de Justicia y el Consejo de Estado.", "El artículo 276 de la Constitución dispone que el Procurador General es elegido por el Senado para un periodo de cuatro años, de terna integrada por candidatos del Presidente de la República, la Corte Suprema de Justicia y el Consejo de Estado.", true], ["B", "el Presidente de la República, por ser el jefe de la administración pública.", "El Presidente solo integra uno de los cupos de la terna. La elección la hace el Senado (art. 276).", false], ["C", "la Cámara de Representantes, de terna elaborada por el Presidente de la República.", "Esa es la forma de elección del Defensor del Pueblo (art. 281), no la del Procurador.", false]]}, {"id": "EC-147", "niv": 1, "e": "Sobre la relación de los personeros con el Ministerio Público, la cartilla debe señalar que el supremo director del Ministerio Público es", "f": "Constitución Política, art. 275; Ley 136 de 1994, art. 178", "o": [["A", "el Defensor del Pueblo.", "El Defensor integra el Ministerio Público, pero la Constitución atribuye la dirección suprema al Procurador General (art. 275).", false], ["B", "el Procurador General de la Nación.", "El artículo 275 de la Constitución dispone que el Procurador General de la Nación es el supremo director del Ministerio Público, y el artículo 178 de la Ley 136 de 1994 señala que el personero ejerce sus funciones bajo esa dirección suprema.", true], ["C", "el gobernador del respectivo departamento.", "El gobernador es jefe de la administración departamental y no dirige el Ministerio Público, que es un órgano de control autónomo.", false]]}, {"id": "EC-148", "niv": 2, "e": "Para corregir la última idea del líder, la cartilla debe indicar que al Ministerio Público le corresponde", "f": "Constitución Política, arts. 118 y 119", "o": [["A", "la vigilancia de la gestión fiscal de las entidades públicas y el control de resultado de toda la administración.", "Esa es la función de la Contraloría General de la República según el artículo 119, no la del Ministerio Público.", false], ["B", "la dirección y organización de las elecciones, el registro civil y la identificación.", "Esas funciones corresponden al Registrador Nacional del Estado Civil (art. 266).", false], ["C", "la guarda de los derechos humanos, la protección del interés público y la vigilancia de la conducta oficial.", "El artículo 118 de la Constitución asigna al Ministerio Público la guarda y promoción de los derechos humanos, la protección del interés público y la vigilancia de la conducta oficial de quienes desempeñan funciones públicas.", true]]}]}, {"comp": "estado_constitucion", "rol": "general", "tag": "Estado y Constitución · Delegación de funciones", "texto": "Usted es profesional universitario de la Secretaría Jurídica de un municipio de primera categoría. El alcalde quiere que el secretario de Gobierno asuma la función de otorgar los permisos para la realización de espectáculos públicos en el municipio, que hoy firma el propio alcalde, y le pide preparar el acto correspondiente. El secretario de Gobierno, por su parte, ya anunció que, una vez reciba la función, la trasladará a un profesional universitario de su despacho para agilizar los trámites. Un asesor sostiene que, si algo sale mal, el alcalde seguirá respondiendo por todo.", "items": [{"id": "EC-149", "niv": 1, "e": "Para que el secretario de Gobierno asuma válidamente la función, el acto de delegación debe", "f": "Ley 489 de 1998, art. 10", "o": [["A", "constar por escrito y determinar la autoridad delegataria y las funciones o asuntos específicos que se transfieren.", "El artículo 10 de la Ley 489 de 1998 dispone que el acto de delegación siempre será escrito y en él se determinarán la autoridad delegataria y las funciones o asuntos específicos cuya atención y decisión se transfieren.", true], ["B", "ser aprobado previamente por el concejo municipal mediante acuerdo.", "La delegación es un acto de la autoridad delegante. La Ley 489 no exige un acuerdo del concejo para que el alcalde delegue funciones en sus colaboradores.", false], ["C", "comunicarse verbalmente en consejo de gobierno, dejando constancia en el acta de la reunión firmada por los asistentes.", "La delegación no puede ser verbal: el artículo 10 de la Ley 489 exige que el acto sea siempre escrito e identifique al delegatario y las funciones.", false]]}, {"id": "EC-150", "niv": 3, "e": "Frente a la afirmación del asesor sobre la responsabilidad, lo correcto es explicar que la delegación", "f": "Constitución Política, art. 211; Ley 489 de 1998, arts. 10 y 12; Corte Constitucional, Sentencia C-372 de 2002", "o": [["A", "traslada la responsabilidad al delegatario de forma definitiva, sin que el alcalde pueda volver a ejercer la función ni revisar los actos expedidos.", "La delegación no es definitiva: el artículo 12 de la Ley 489 permite a la autoridad delegante reasumir en cualquier tiempo la competencia y revisar los actos del delegatario.", false], ["B", "en principio exime al alcalde, que conserva deberes de dirección y vigilancia y puede reformar o revocar los actos del delegatario.", "El artículo 211 de la Constitución dispone que la delegación exime de responsabilidad al delegante, la cual corresponde al delegatario, cuyos actos puede siempre reformar o revocar aquel, reasumiendo la responsabilidad. La Corte Constitucional (C-372 de 2002) precisó que el delegante no responde por los actos del delegatario, pero sí por sus propios deberes de dirección, orientación, instrucción y seguimiento; el artículo 10 de la Ley 489 le exige informarse del desarrollo de la delegación y el artículo 12 le permite reasumir la competencia.", true], ["C", "no cambia nada, porque el alcalde sigue respondiendo por todos los actos del secretario delegatario.", "El artículo 211 de la Constitución dispone lo contrario: la delegación exime de responsabilidad al delegante y la traslada al delegatario, sin perjuicio de que el delegante responda por sus propios deberes de orientación y seguimiento.", false]]}, {"id": "EC-151", "niv": 3, "e": "Sobre la intención del secretario de trasladar la función recibida a un profesional de su despacho, usted debe conceptuar que", "f": "Ley 489 de 1998, art. 11, num. 2", "o": [["A", "es posible siempre que lo haga mediante acto escrito y lo informe oportunamente al alcalde.", "Cumplir la forma escrita e informar al alcalde no subsana la prohibición: las funciones recibidas en virtud de delegación no son delegables (art. 11, num. 2).", false], ["B", "es posible si el profesional pertenece al nivel directivo o asesor del municipio.", "El nivel del empleado es una condición para ciertas delegaciones, pero aquí el obstáculo es otro: la función ya fue recibida por delegación y no puede volver a delegarse.", false], ["C", "no es posible, porque las funciones recibidas por delegación no pueden transferirse nuevamente.", "El numeral 2 del artículo 11 de la Ley 489 de 1998 prohíbe transferir mediante delegación las funciones, atribuciones y potestades recibidas en virtud de delegación.", true]]}]}, {"comp": "estado_constitucion", "rol": "general", "tag": "Estado y Constitución · Desconcentración y descentralización", "texto": "Usted es técnico administrativo de la oficina de planeación de un departamento. La corporación autónoma regional con jurisdicción en el departamento trasladó a sus direcciones territoriales, ubicadas en tres municipios alejados, la recepción y el trámite de solicitudes, sin que el director general deje de orientarlas. A su vez, la asamblea estudia crear un instituto departamental de deportes como establecimiento público, y el gobernador quiere crear otra entidad que preste servicios de impresión y publicaciones en competencia con empresas privadas.", "items": [{"id": "EC-152", "niv": 2, "e": "La decisión de la corporación de radicar funciones en sus direcciones territoriales corresponde a la figura de", "f": "Ley 489 de 1998, art. 8", "o": [["A", "la delegación, porque el director general transfiere funciones a otros servidores mediante acto escrito.", "La delegación transfiere el ejercicio de funciones a colaboradores o a otras autoridades. El artículo 8 de la Ley 489 aclara que la desconcentración no implica delegación.", false], ["B", "la descentralización por servicios, porque las direcciones territoriales adquieren autonomía.", "La descentralización por servicios crea entidades con personería jurídica y autonomía propias. Las direcciones territoriales siguen siendo parte de la misma corporación.", false], ["C", "la desconcentración, porque radica competencias en dependencias ubicadas fuera de la sede principal.", "El artículo 8 de la Ley 489 de 1998 define la desconcentración como la radicación de competencias y funciones en dependencias ubicadas fuera de la sede principal del organismo, sin perjuicio de las potestades de orientación de los jefes superiores; no implica delegación.", true]]}, {"id": "EC-153", "niv": 1, "e": "Para crear el instituto departamental de deportes como establecimiento público se requiere", "f": "Ley 489 de 1998, art. 69", "o": [["A", "una ordenanza de la asamblea departamental, o su autorización, por ser entidad del departamento.", "El artículo 69 de la Ley 489 de 1998 dispone que las entidades descentralizadas se crean, en el orden nacional, por la ley, y en el orden departamental, distrital y municipal, por la ordenanza o el acuerdo, o con su autorización.", true], ["B", "una ley de la República, por tratarse de una entidad descentralizada.", "La ley crea las entidades descentralizadas del orden nacional. Las del orden departamental se crean por ordenanza o con su autorización (art. 69).", false], ["C", "un decreto del gobernador, sin necesidad de autorización previa de la asamblea departamental.", "El gobernador no puede crear por sí solo entidades descentralizadas. El artículo 69 exige la ordenanza o la autorización de la asamblea.", false]]}, {"id": "EC-154", "niv": 3, "e": "La entidad que prestará servicios de impresión en competencia con empresas privadas, conforme a las reglas del derecho privado, corresponde a la figura de", "f": "Ley 489 de 1998, arts. 70 y 85", "o": [["A", "establecimiento público, porque presta un servicio con patrimonio independiente.", "Los establecimientos públicos atienden principalmente funciones administrativas y prestan servicios públicos conforme al derecho público (art. 70), no actividades comerciales regidas por el derecho privado.", false], ["B", "empresa industrial y comercial del Estado, por su actividad comercial regida por el derecho privado.", "El artículo 85 de la Ley 489 de 1998 define las empresas industriales y comerciales del Estado como organismos que desarrollan actividades de naturaleza industrial o comercial y de gestión económica conforme a las reglas del derecho privado, con personería jurídica, autonomía y capital independiente.", true], ["C", "unidad administrativa especial sin personería jurídica, adscrita a la secretaría de hacienda.", "Una unidad sin personería jurídica pertenece al sector central y no es la figura prevista para actividades comerciales en competencia regidas por el derecho privado.", false]]}]}, {"comp": "estado_constitucion", "rol": "ge
