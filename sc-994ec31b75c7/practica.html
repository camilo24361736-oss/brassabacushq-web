 antes de desplazar personal, para no exponer al equipo.", "Es prudente, pero aplaza una decisión necesaria y el protocolo ya prevé las medidas de seguridad para desplazarse.", false], ["B", "desplazar a todo el equipo al municipio para cubrir cualquier necesidad que pueda presentarse.", "Actúa rápido, pero sin ponderar alternativas: deja sin capacidad de respuesta a la oficina y expone a todo el personal.", false], ["C", "enviar a dos profesionales con las medidas del protocolo y ajustar la decisión a medida que llegue información.", "Refleja la competencia «Toma de decisiones» (Decreto 1083 de 2015, art. 2.2.4.8, num. 3, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en elegir alternativas para solucionar problemas y ejecutar acciones concretas y coherentes con lo decidido. Corresponde a decidir en situaciones de alta complejidad e incertidumbre considerando los objetivos de la entidad y asumiendo los riesgos de la decisión.", true]]}, {"id": "CO-180", "niv": 1, "e": "Para asignar las tareas de evaluación, la conducta más acorde con la dirección y desarrollo de personal es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 3, sustituido por el art. 1 del Decreto 815 de 2018 (nivel profesional con personal a cargo: Dirección y desarrollo de personal)", "o": [["A", "asignar el mapeo de afectaciones a Sergio y la caracterización de las familias a Paula, ya que son sus fortalezas.", "Refleja la competencia «Dirección y desarrollo de personal» (Decreto 1083 de 2015, art. 2.2.4.8, num. 3, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en favorecer el aprendizaje y el desarrollo de los colaboradores, identificando sus potencialidades personales y profesionales para cumplir los objetivos institucionales. Refleja la conducta de hacer uso de las habilidades y recursos del talento humano a cargo para alcanzar las metas.", true], ["B", "asignar las tareas por turnos de disponibilidad, para que la carga se reparta de forma equitativa entre todos los integrantes.", "Es equitativo, pero no aprovecha las habilidades específicas de cada colaborador.", false], ["C", "asignar ambas tareas a los dos ingenieros, que son los profesionales con mayor antigüedad en la oficina.", "Usa un criterio de antigüedad que no se relaciona con las capacidades requeridas para cada tarea.", false]]}, {"id": "CO-181", "niv": 2, "e": "Superada la emergencia, la conducta que mejor refleja la dirección y desarrollo de personal es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 3, sustituido por el art. 1 del Decreto 815 de 2018 (nivel profesional con personal a cargo: Dirección y desarrollo de personal)", "o": [["A", "incluir en el informe final al gobernador un párrafo de reconocimiento al trabajo realizado por el grupo técnico durante la emergencia.", "Reconoce el trabajo ante el superior, pero no retroalimenta a los colaboradores ni extrae aprendizajes con ellos.", false], ["B", "hacer una sesión con el grupo para revisar qué funcionó y qué mejorar, y reconocer el aporte de cada uno.", "Refleja la competencia «Dirección y desarrollo de personal» (Decreto 1083 de 2015, art. 2.2.4.8, num. 3, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en favorecer el aprendizaje y el desarrollo de los colaboradores, identificando sus potencialidades personales y profesionales para cumplir los objetivos institucionales. Corresponde a establecer espacios de retroalimentación y reconocimiento del buen desempeño en pro del mejoramiento continuo.", true], ["C", "proponer a talento humano que conceda al grupo un día de descanso compensatorio por el esfuerzo realizado.", "Puede ser una medida de bienestar, pero no retroalimenta el desempeño ni promueve el aprendizaje.", false]]}]}, {"comp": "comportamental", "rol": "tecnico", "tag": "Competencias comportamentales (Decreto 815 de 2018) · Nivel técnico · Confiabilidad técnica", "texto": "Usted es técnico operativo de una corporación autónoma regional y realiza aforos de caudal en las captaciones de usuarios con concesión de aguas. El protocolo de aforo de la corporación establece el uso de un molinete y, cuando este no esté disponible o presente fallas, un método volumétrico alternativo. El formato de informe de aforo pide registrar los datos medidos, el método usado y la comparación entre el caudal medido y el caudal concesionado. Hoy, en una de las visitas, el primer aforo dio un valor muy superior a lo habitual para la temporada seca.", "items": [{"id": "CO-182", "niv": 1, "e": "Ante el valor inusual del primer aforo, la conducta que mejor refleja la confiabilidad técnica es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 4, sustituido por el art. 1 del Decreto 815 de 2018 (nivel técnico: Confiabilidad técnica)", "o": [["A", "repetir la medición y revisar el equipo, y registrar ambos valores con una observación sobre la diferencia.", "Refleja la competencia «Confiabilidad técnica» (Decreto 1083 de 2015, art. 2.2.4.8, num. 4, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en contar con los conocimientos técnicos requeridos y aplicarlos a situaciones concretas de trabajo con altos estándares de calidad. Corresponde a aplicar el conocimiento técnico en el desarrollo de sus responsabilidades con altos estándares de calidad: verifica el dato inusual sin alterarlo ni descartarlo, y deja trazabilidad de ambas mediciones.", true], ["B", "ajustar el dato al promedio histórico de la captación en temporada seca.", "Pretende corregir, pero altera la medición sin base técnica.", false], ["C", "registrar el dato tal como salió en el aforo, ya que corresponde a la medición efectivamente realizada.", "Es fiel al registro, pero no aplica el conocimiento técnico para verificar un valor inusual ni para descartar un posible error de medición o de equipo.", false]]}, {"id": "CO-183", "niv": 2, "e": "Al elaborar el informe de aforo, la conducta más acorde con la confiabilidad técnica es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 4, sustituido por el art. 1 del Decreto 815 de 2018 (nivel técnico: Confiabilidad técnica)", "o": [["A", "describir con detalle el recorrido de la visita y dejar los datos y la comparación para que los complete el profesional.", "Aporta contexto, pero omite lo que el formato le pide al técnico.", false], ["B", "anotar solo la conclusión sobre si hay exceso y anexar los datos sin procesar para que se revisen después.", "Da una conclusión, pero sin el método ni la comparación sustentada que exige el formato.", false], ["C", "consignar las mediciones, la técnica empleada y si el caudal medido excede el autorizado en la concesión.", "Refleja la competencia «Confiabilidad técnica» (Decreto 1083 de 2015, art. 2.2.4.8, num. 4, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en contar con los conocimientos técnicos requeridos y aplicarlos a situaciones concretas de trabajo con altos estándares de calidad. Refleja la conducta de emitir conceptos y juicios técnicos claros, precisos, pertinentes y ajustados a los lineamientos de la organización.", true]]}, {"id": "CO-184", "niv": 3, "e": "En la siguiente visita, el molinete presenta una falla. La conducta que mejor refleja la confiabilidad técnica es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 4, sustituido por el art. 1 del Decreto 815 de 2018 (nivel técnico: Confiabilidad técnica)", "o": [["A", "medir con el molinete averiado y anotar en el informe una observación sobre la falla del equipo.", "Deja constancia, pero produce un dato poco confiable.", false], ["B", "medir por el método volumétrico y anotar en el informe que no se usó el molinete y la razón.", "Refleja la competencia «Confiabilidad técnica» (Decreto 1083 de 2015, art. 2.2.4.8, num. 4, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en contar con los conocimientos técnicos requeridos y aplicarlos a situaciones concretas de trabajo con altos estándares de calidad. Corresponde a resolver problemas utilizando los conocimientos técnicos de su especialidad, ajustándose a los lineamientos organizacionales.", true], ["C", "suspender la visita y reprogramarla para cuando el equipo esté reparado, de modo que la medición sea comparable.", "Busca comparabilidad, pero no aprovecha el método alternativo que el protocolo prevé para esta situación.", false]]}]}, {"comp": "comportamental", "rol": "tecnico", "tag": "Competencias comportamentales (Decreto 815 de 2018) · Nivel técnico · Confiabilidad técnica", "texto": "Usted es técnico de sistemas de la alcaldía de un municipio de segunda categoría y da soporte a los equipos de todas las dependencias. Cada mes, el servidor de archivos compartidos se llena y los servidores no pueden guardar documentos. La alcaldía migrará los computadores a una nueva versión del sistema operativo dentro de dos meses. Además, el secretario general le pidió un concepto técnico sobre cuál de tres ofertas de licencias de software ofimático conviene adquirir; la alcaldía tiene una política de seguridad digital adoptada.", "items": [{"id": "CO-185", "niv": 2, "e": "Frente al servidor de archivos que se llena cada mes, la conducta que mejor refleja la confiabilidad técnica es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 4, sustituido por el art. 1 del Decreto 815 de 2018 (nivel técnico: Confiabilidad técnica)", "o": [["A", "solicitar la compra de un disco de mayor capacidad para el servidor de archivos compartidos de la alcaldía.", "Aumenta la capacidad, pero sin diagnóstico el problema se repetirá cuando el nuevo disco se llene.", false], ["B", "analizar qué tipo de archivos ocupa el espacio y proponer, con sustento técnico, reglas de almacenamiento y depuración.", "Refleja la competencia «Confiabilidad técnica» (Decreto 1083 de 2015, art. 2.2.4.8, num. 4, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en contar con los conocimientos técnicos requeridos y aplicarlos a situaciones concretas de trabajo con altos estándares de calidad. Corresponde a resolver problemas utilizando los conocimientos técnicos de su especialidad para apoyar el cumplimiento de los objetivos.", true], ["C", "borrar los archivos más antiguos de cada carpeta compartida hasta liberar el espacio necesario.", "Libera espacio, pero puede eliminar información institucional sin criterio técnico ni autorización.", false]]}, {"id": "CO-186", "niv": 1, "e": "Ante la migración del sistema operativo, la conducta más acorde con la confiabilidad técnica es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 4, sustituido por el art. 1 del Decreto 815 de 2018 (nivel técnico: Confiabilidad técnica)", "o": [["A", "estudiar la documentación técnica de la nueva versión y probarla en un equipo antes de la migración, para prever fallas.", "Refleja la competencia «Confiabilidad técnica» (Decreto 1083 de 2015, art. 2.2.4.8, num. 4, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en contar con los conocimientos técnicos requeridos y aplicarlos a situaciones concretas de trabajo con altos estándares de calidad. Refleja la conducta de mantener actualizado su conocimiento técnico para apoyar su gestión.", true], ["B", "pedir al proveedor que realice toda la migración, porque conoce mejor la nueva versión.", "Delega una tarea de su especialidad en lugar de actualizar sus conocimientos para el soporte posterior.", false], ["C", "aprender el manejo de la nueva versión durante la migración, a medida que se presenten los problemas en cada dependencia.", "Aprende de forma reactiva y expone a las dependencias a fallas que pudieron preverse.", false]]}, {"id": "CO-187", "niv": 3, "e": "Para el concepto sobre las licencias, la conducta que mejor refleja la confiabilidad técnica es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 4, sustituido por el art. 1 del Decreto 815 de 2018 (nivel técnico: Confiabilidad técnica)", "o": [["A", "recomendar la marca que usted ha usado durante años y cuyo desempeño conoce de primera mano.", "Se basa en su experiencia, pero no en una comparación objetiva frente a los requerimientos de la alcaldía.", false], ["B", "recomendar la oferta de menor precio, ya que las tres cumplen con las funciones básicas de ofimática.", "El precio es relevante, pero el concepto no compara los aspectos técnicos ni los lineamientos de la entidad.", false], ["C", "comparar las ofertas frente a criterios técnicos y a la política de seguridad digital, y emitir una recomendación sustentada.", "Refleja la competencia «Confiabilidad técnica» (Decreto 1083 de 2015, art. 2.2.4.8, num. 4, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en contar con los conocimientos técnicos requeridos y aplicarlos a situaciones concretas de trabajo con altos estándares de calidad. Corresponde a emitir conceptos técnicos claros, precisos, pertinentes y ajustados a los lineamientos normativos y organizacionales.", true]]}]}, {"comp": "comportamental", "rol": "tecnico", "tag": "Competencias comportamentales (Decreto 815 de 2018) · Nivel técnico · Disciplina", "texto": "Usted es técnico administrativo de la oficina de cobro de una secretaría distrital de Bogotá y proyecta acuerdos de pago. Su jefe le indicó que, a partir de hoy, todos los acuerdos, incluidos los que están en curso, se proyecten en un nuevo formato. Esta semana llegó un nuevo profesional supervisor que revisará durante el primer mes la totalidad de sus proyecciones. Usted lleva, además, una hoja de cálculo personal con más detalles que el aplicativo oficial de cobro. La oficina publica en la intranet las versiones vigentes de sus procedimientos, y la semana pasada se actualizó uno de ellos.", "items": [{"id": "CO-188", "niv": 1, "e": "Frente a la instrucción sobre el nuevo formato, la conducta que mejor refleja la disciplina es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 4, sustituido por el art. 1 del Decreto 815 de 2018 (nivel técnico: Disciplina)", "o": [["A", "terminar en el formato anterior los acuerdos ya iniciados y usar el nuevo formato solo en los acuerdos que empiecen a partir de hoy.", "Parece razonable, pero se aparta de una instrucción que incluyó expresamente los acuerdos en curso.", false], ["B", "seguir con el formato anterior hasta que el nuevo se publique en el sistema de gestión de calidad.", "Condiciona por su cuenta una instrucción clara del jefe.", false], ["C", "aplicar el nuevo formato desde hoy a todos los acuerdos, aun los ya iniciados, y consultar al jefe si alguno requiere ajuste.", "Refleja la competencia «Disciplina» (Decreto 1083 de 2015, art. 2.2.4.8, num. 4, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en adaptarse a las políticas institucionales y generar información acorde con los procesos. Corresponde a recibir instrucciones y desarrollar las actividades de acuerdo con ellas.", true]]}, {"id": "CO-189", "niv": 2, "e": "Respecto de la revisión total de sus proyecciones por el nuevo supervisor, la conducta más acorde con la disciplina es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 4, sustituido por el art. 1 del Decreto 815 de 2018 (nivel técnico: Disciplina)", "o": [["A", "facilitar la revisión con los soportes completos y aplicar las observaciones, pues es el control definido para el primer mes.", "Refleja la competencia «Disciplina» (Decreto 1083 de 2015, art. 2.2.4.8, num. 4, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en adaptarse a las políticas institucionales y generar información acorde con los procesos. Refleja la conducta de aceptar la supervisión constante como parte de su trabajo.", true], ["B", "solicitar que cada observación se le entregue por escrito y con sustento normativo antes de aplicarla.", "Pedir claridad es válido, pero condicionar cada observación a un trámite formal dificulta la supervisión.", false], ["C", "pedir que la revisión se haga por muestreo, ya que su experiencia de varios años en la oficina respalda la calidad de su trabajo.", "Su experiencia es real, pero no acepta la supervisión definida para el periodo de empalme.", false]]}, {"id": "CO-190", "niv": 3, "e": "Su jefe le pide un reporte del estado de los acuerdos de pago. La conducta que mejor refleja la disciplina es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 4, sustituido por el art. 1 del Decreto 815 de 2018 (nivel técnico: Disciplina)", "o": [["A", "entregar su hoja de cálculo personal, que tiene información más completa que el aplicativo oficial.", "Puede tener más detalle, pero produce información por fuera del proceso y del sistema oficial.", false], ["B", "generar el reporte desde el aplicativo oficial y completar allí los datos faltantes, porque es la fuente del proceso.", "Refleja la competencia «Disciplina» (Decreto 1083 de 2015, art. 2.2.4.8, num. 4, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en adaptarse a las políticas institucionales y generar información acorde con los procesos. Corresponde a generar información acorde con los procesos, usando y completando el sistema oficial.", true], ["C", "entregar el reporte del aplicativo junto con su hoja de cálculo, para que el jefe compare ambas fuentes.", "Entrega dos versiones que pueden no coincidir, en lugar de dejar completa la fuente oficial del proceso.", false]]}]}, {"comp": "comportamental", "rol": "tecnico", "tag": "Competencias comportamentales (Decreto 815 de 2018) · Nivel técnico · Responsabilidad", "texto": "Usted es técnico del almacén general de una gobernación, a cargo del inventario y de la entrega de elementos a las dependencias. Dentro de cinco días hábiles debe terminar el conteo físico anual del inventario, sin suspender las entregas diarias. El almacén tiene una terminal portátil de lectura de códigos que otras dependencias piden prestada con frecuencia. Al revisar los registros de la semana, usted descubre que entregó por error diez resmas de papel de más a la Secretaría de Educación.", "items": [{"id": "CO-191", "niv": 2, "e": "Para cumplir el conteo sin suspender las entregas, la conducta que mejor refleja la responsabilidad es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 4, sustituido por el art. 1 del Decreto 815 de 2018 (nivel técnico: Responsabilidad)", "o": [["A", "suspender las entregas durante los cinco días para concentrarse en el conteo y evitar diferencias.", "Facilita el conteo, pero incumple la condición de mantener las entregas a las dependencias.", false], ["B", "programar el conteo por bodegas en franjas fijas y atender las entregas en un horario definido y comunicado.", "Refleja la competencia «Responsabilidad» (Decreto 1083 de 2015, art. 2.2.4.8, num. 4, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en conocer la magnitud de las propias acciones y la forma de afrontarlas. Corresponde a utilizar el tiempo de manera eficiente y realizar sus tareas con criterios de productividad y efectividad.", true], ["C", "hacer el conteo después de la jornada para no afectar las entregas, aunque deba quedarse hasta tarde todos los días.", "Muestra dedicación, pero no organiza el tiempo de forma eficiente y aumenta el riesgo de errores por cansancio.", false]]}, {"id": "CO-192", "niv": 1, "e": "Frente a los préstamos de la terminal portátil, la conducta más acorde con la responsabilidad es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 4, sustituido por el art. 1 del Decreto 815 de 2018 (nivel técnico: Responsabilidad)", "o": [["A", "prestarla dejando constancia de quién la recibe y revisar su estado al devolverla, porque responde por el equipo.", "Refleja la competencia «Responsabilidad» (Decreto 1083 de 2015, art. 2.2.4.8, num. 4, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en conocer la magnitud de las propias acciones y la forma de afrontarlas. Refleja la conducta de manejar adecuadamente los implementos requeridos para la ejecución de su tarea.", true], ["B", "prestarla sin registro a las dependencias que la soliciten, ya que todas pertenecen a la misma gobernación y la devuelven pronto.", "Es colaborador, pero pierde el control de un implemento a su cargo.", false], ["C", "negar los préstamos de la terminal, para evitar cualquier riesgo de daño o pérdida del equipo.", "Protege el equipo, pero restringe sin necesidad un recurso que puede prestarse con control.", false]]}, {"id": "CO-193", "niv": 2, "e": "Respecto de las diez resmas entregadas de más, la conducta que mejor refleja la responsabilidad es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 4, sustituido por el art. 1 del Decreto 815 de 2018 (nivel técnico: Responsabilidad)", "o": [["A", "descontar las diez resmas en la próxima entrega a esa secretaría, sin dejar registro del error.", "Compensa la diferencia, pero oculta el error y el inventario queda sin trazabilidad.", false], ["B", "dejar la situación así, ya que las resmas igual se usarán dentro de la misma gobernación.", "Minimiza el error y deja el inventario descuadrado frente a los registros.", false], ["C", "informar a la secretaría, gestionar la devolución o el ajuste del registro y reportarlo según el procedimiento.", "Refleja la competencia «Responsabilidad» (Decreto 1083 de 2015, art. 2.2.4.8, num. 4, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en conocer la magnitud de las propias acciones y la forma de afrontarlas. Corresponde a conocer la magnitud de sus acciones y la forma de afrontarlas, reconociendo y corrigiendo el error con trazabilidad.", true]]}]}, {"comp": "comportamental", "rol": "tecnico", "tag": "Competencias comportamentales (Decreto 815 de 2018) · Nivel técnico · Responsabilidad", "texto": "Usted es técnico administrativo de la Secretaría de Tránsito de un municipio de primera categoría y digita en el sistema de información las órdenes de comparendo que llegan en físico. Tiene una pila de 300 órdenes con distintas fechas límite de cargue. Al revisar sus registros de la semana anterior, encuentra que digitó mal la placa de un vehículo, lo que asoció un comparendo a un ciudadano que no tuvo relación con la infracción. Según el procedimiento de la secretaría, toda corrección de un registro ya cargado debe reportarse por el canal establecido para ese fin.", "items": [{"id": "CO-194", "niv": 1, "e": "Para organizar la digitación de las 300 órdenes, la conducta que mejor refleja la responsabilidad es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 4, sustituido por el art. 1 del Decreto 815 de 2018 (nivel técnico: Responsabilidad)", "o": [["A", "digitarlas en el orden en que están en la pila, que corresponde a la secuencia de recibo.", "Es ordenado, pero ignora las fechas límite y puede dejar vencer algunas.", false], ["B", "ordenarlas por fecha límite y digitar primero las más próximas a vencer, para que ninguna quede por fuera.", "Refleja la competencia «Responsabilidad» (Decreto 1083 de 2015, art. 2.2.4.8, num. 4, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en conocer la magnitud de las propias acciones y la forma de afrontarlas. Corresponde a utilizar el tiempo de manera eficiente y cumplir con eficiencia la tarea encomendada.", true], ["C", "empezar por las órdenes más legibles y sencillas, para avanzar más rápido en el número de registros.", "Aumenta el ritmo inicial, pero no prioriza según el riesgo de vencimiento.", false]]}, {"id": "CO-195", "niv": 2, "e": "Para mantener la calidad de la digitación, la conducta más acorde con la responsabilidad es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 4, sustituido por el art. 1 del Decreto 815 de 2018 (nivel técnico: Responsabilidad)", "o": [["A", "digitar rápido para cumplir el volumen asignado y corregir los errores cuando los ciudadanos presenten sus reclamaciones.", "Prioriza el volumen y traslada al ciudadano la detección de los errores.", false], ["B", "pedir a un compañero que revise al final del día todos los registros que usted haya digitado.", "Agrega un control, pero traslada a otro la verificación que es parte de su propia tarea.", false], ["C", "verificar cada registro contra la orden física antes de guardarlo, aunque el proceso tome un poco más de tiempo.", "Refleja la competencia «Responsabilidad» (Decreto 1083 de 2015, art. 2.2.4.8, num. 4, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en conocer la magnitud de las propias acciones y la forma de afrontarlas. Refleja la conducta de realizar sus tareas con criterios de calidad, eficiencia y efectividad.", true]]}, {"id": "CO-196", "niv": 2, "e": "Frente al error en la placa digitada la semana anterior, la conducta que mejor refleja la responsabilidad es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 4, sustituido por el art. 1 del Decreto 815 de 2018 (nivel técnico: Responsabilidad)", "o": [["A", "reportar de inmediato la placa errada por la vía que fija la secretaría para corregir registros.", "Refleja la competencia «Responsabilidad» (Decreto 1083 de 2015, art. 2.2.4.8, num. 4, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en conocer la magnitud de las propias acciones y la forma de afrontarlas. Corresponde a conocer la magnitud de sus acciones y la forma de afrontarlas: reconoce el error y activa su corrección formal.", true], ["B", "esperar a que el ciudadano afectado presente su reclamación, para corregirlo dentro de ese trámite.", "Conoce el error y aun así deja que el ciudadano soporte sus efectos.", false], ["C", "corregir directamente la placa en el sistema de información, ya que se trata de un simple error de digitación de su parte.", "Corrige, pero sin el reporte que permite dejar trazabilidad y revisar los efectos sobre el ciudadano afectado.", false]]}]}, {"comp": "comportamental", "rol": "tecnico", "tag": "Competencias comportamentales (Decreto 815 de 2018) · Nivel técnico · Disciplina", "texto": "Usted es técnico del laboratorio de calidad de agua de una corporación autónoma regional. El coordinador del laboratorio dio la instrucción de registrar cada muestra en el formato de cadena de custodia antes de abrir la nevera de transporte. El laboratorio está en proceso de auditoría de seguimiento a su acreditación, y esta semana un auditor observará directamente el trabajo de los técnicos. Además, hace diez días se publicó una nueva versión del procedimiento de uno de los métodos analíticos que usted aplica; un compañero sigue usando la versión anterior.", "items": [{"id": "CO-197", "niv": 1, "e": "Al final de la tarde llegan 15 muestras y usted tiene poco tiempo. La conducta que mejor refleja la disciplina es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 4, sustituido por el art. 1 del Decreto 815 de 2018 (nivel técnico: Disciplina)", "o": [["A", "registrar ahora solo las muestras de los trámites más urgentes y dejar las demás para la mañana siguiente.", "Prioriza con buena intención, pero aplica la instrucción solo en parte.", false], ["B", "diligenciar primero el formato de custodia de cada una de las 15 muestras y solo después abrir la nevera.", "Refleja la competencia «Disciplina» (Decreto 1083 de 2015, art. 2.2.4.8, num. 4, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en adaptarse a las políticas institucionales y generar información acorde con los procesos. Corresponde a recibir instrucciones y desarrollar las actividades de acuerdo con ellas, generando la información que exige el proceso.", true], ["C", "refrigerar primero todas las muestras y registrarlas en la cadena de custodia a primera hora del día siguiente.", "Busca conservar las muestras, pero altera el orden fijado en la instrucción del coordinador.", false]]}, {"id": "CO-198", "niv": 2, "e": "Frente a la observación directa del auditor, la conducta más acorde con la disciplina es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 4, sustituido por el art. 1 del Decreto 815 de 2018 (nivel técnico: Disciplina)", "o": [["A", "solicitar que la auditoría se haga sobre registros ya cerrados, para no interrumpir los análisis del día.", "Busca proteger la operación, pero limita una supervisión que forma parte del proceso de acreditación.", false], ["B", "pedir que la observación se haga a un técnico con más experiencia, que pueda responder mejor las preguntas del auditor.", "Evita exponerse, pero no acepta la supervisión sobre su propio trabajo.", false], ["C", "permitir la observación y trabajar como de costumbre, pues la supervisión hace parte de la acreditación.", "Refleja la competencia «Disciplina» (Decreto 1083 de 2015, art. 2.2.4.8, num. 4, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en adaptarse a las políticas institucionales y generar información acorde con los procesos. Refleja la conducta de aceptar la supervisión constante como parte del trabajo.", true]]}, {"id": "CO-199", "niv": 3, "e": "Respecto de la nueva versión del procedimiento analítico, la conducta que mejor refleja la disciplina es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 4, sustituido por el art. 1 del Decreto 815 de 2018 (nivel técnico: Disciplina)", "o": [["A", "aplicar la versión vigente del procedimiento y avisar a su compañero que fue publicada una nueva.", "Refleja la competencia «Disciplina» (Decreto 1083 de 2015, art. 2.2.4.8, num. 4, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en adaptarse a las políticas institucionales y generar información acorde con los procesos. Corresponde a revisar de manera permanente los cambios en los procesos y adaptarse a las políticas institucionales.", true], ["B", "aplicar en paralelo las dos versiones durante un mes, para comparar resultados antes de adoptar la nueva versión.", "Busca seguridad técnica, pero mantiene en uso una versión que ya no está vigente.", false], ["C", "continuar con la versión anterior hasta que el coordinador programe la capacitación sobre los cambios.", "Espera una capacitación que no es condición para aplicar el procedimiento vigente ya publicado.", false]]}]}, {"comp": "comportamental", "rol": "asistencial", "tag": "Competencias comportamentales (Decreto 815 de 2018) · Nivel asistencial · Manejo de la información", "texto": "Usted es auxiliar administrativo de la oficina de talento humano de la alcaldía de un municipio de cuarta categoría y custodia las historias laborales de los servidores. Un compañero de otra dependencia le pregunta en el pasillo si es cierto que una servidora está incapacitada por un problema de salud mental. Su jefe le pide diseñar el formato de actualización de datos de los servidores. Más tarde, un servidor de la Secretaría de Gobierno se acerca a pedir que le deje revisar la hoja de vida de un compañero, porque «lo van a encargar». El procedimiento de la oficina establece que las historias laborales solo se consultan con autorización del jefe de talento humano y con registro de préstamo.", "items": [{"id": "CO-200", "niv": 2, "e": "Frente a la pregunta sobre la incapacidad de la servidora, la conducta que mejor refleja el manejo de la información es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 5, sustituido por el art. 1 del Decreto 815 de 2018 (nivel asistencial: Manejo de la información)", "o": [["A", "confirmarle que la servidora sí está incapacitada, pero sin dar detalles del diagnóstico ni de la duración de la incapacidad.", "Intenta ser discreto, pero igual revela información personal que no debe compartir.", false], ["B", "decirle con amabilidad que no puede comentar información de las historias laborales de otros servidores.", "Refleja la competencia «Manejo de la información» (Decreto 1083 de 2015, art. 2.2.4.8, num. 5, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en manejar con responsabilidad la información personal e institucional de la que se dispone. Corresponde a evadir los temas que indagan sobre información confidencial y no hacer pública información que pueda afectar a las personas.", true], ["C", "sugerirle que le pregunte directamente a la servidora cuando ella regrese a la oficina.", "No revela el dato, pero alienta indagar sobre la salud de una compañera.", false]]}, {"id": "CO-201", "niv": 1, "e": "Para el formato de actualización de datos, la conducta más acorde con el manejo de la información es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 5, sustituido por el art. 1 del Decreto 815 de 2018 (nivel asistencial: Manejo de la información)", "o": [["A", "incluir únicamente los datos que la oficina necesita, como contacto y beneficiarios, ya que los demás no tienen uso.", "Refleja la competencia «Manejo de la información» (Decreto 1083 de 2015, art. 2.2.4.8, num. 5, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en manejar con responsabilidad la información personal e institucional de la que se dispone. Refleja la conducta de recoger solo la información imprescindible para el desarrollo de la tarea.", true], ["B", "incluir campos amplios sobre la familia, la salud y las preferencias de cada servidor, por si se necesitan en el futuro.", "Prevé necesidades futuras, pero recoge información sensible que no es necesaria hoy.", false], ["C", "copiar el formato de otra alcaldía, que es más completo e incluye datos familiares y de salud.", "Ahorra trabajo, pero no evalúa qué datos son realmente necesarios.", false]]}, {"id": "CO-202", "niv": 3, "e": "Ante la solicitud del servidor de la Secretaría de Gobierno, la conducta que mejor refleja el manejo de la información es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 5, sustituido por el art. 1 del Decreto 815 de 2018 (nivel asistencial: Manejo de la información)", "o": [["A", "entregarle una fotocopia de la hoja de vida, ya que el original debe permanecer en la historia laboral.", "Protege el original, pero entrega información personal sin la autorización previa.", false], ["B", "permitirle consultar la hoja de vida en su presencia y anotar la consulta en el registro de préstamos de la oficina.", "Deja constancia de la consulta, pero omite la autorización previa que exige el procedimiento.", false], ["C", "indicarle que primero debe obtener el visto bueno del jefe de la oficina y que el préstamo quedará anotado, y orientarlo para pedirlo.", "Refleja la competencia «Manejo de la información» (Decreto 1083 de 2015, art. 2.2.4.8, num. 5, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en manejar con responsabilidad la información personal e institucional de la que se dispone. Corresponde a organizar y custodiar la información a su cuidado según las normas legales y de la organización.", true]]}]}, {"comp": "comportamental", "rol": "asistencial", "tag": "Competencias comportamentales (Decreto 815 de 2018) · Nivel asistencial · Manejo de la información", "texto": "Usted es auxiliar administrativo de la ventanilla de radicación de una corporación autónoma regional. Hoy un ciudadano radicó una denuncia por un vertimiento de aguas residuales que, según él, está ocurriendo en ese momento sobre una quebrada, y pidió expresamente que su identidad se mantenga en reserva. En la tarde llama un periodista de una emisora local preguntando por la denuncia, y luego se presenta un empleado de la empresa denunciada a preguntar quién la presentó. La corporación tiene una oficina de comunicaciones que atiende a los medios.", "items": [{"id": "CO-203", "niv": 1, "e": "Al recibir la denuncia, la conducta que mejor refleja el manejo de la información es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 5, sustituido por el art. 1 del Decreto 815 de 2018 (nivel asistencial: Manejo de la información)", "o": [["A", "radicarla y agregar una nota personal indicando que, por lo que contó el ciudadano, el caso parece muy grave.", "Busca destacar la urgencia, pero agrega apreciaciones propias en lugar de transmitir la información de forma objetiva.", false], ["B", "radicarla y avisar de inmediato al área de control con los datos reportados, ya que el hecho está ocurriendo.", "Refleja la competencia «Manejo de la información» (Decreto 1083 de 2015, art. 2.2.4.8, num. 5, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en manejar con responsabilidad la información personal e institucional de la que se dispone. Corresponde a transmitir información oportuna y objetiva.", true], ["C", "radicarla y enviarla en el reparto ordinario del día siguiente, como se hace con las demás comunicaciones.", "Cumple el trámite general, pero no transmite con oportunidad una situación que ocurre en ese momento.", false]]}, {"id": "CO-204", "niv": 2, "e": "Frente a la llamada del periodista, la conducta más acorde con el manejo de la información es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 5, sustituido por el art. 1 del Decreto 815 de 2018 (nivel asistencial: Manejo de la información)", "o": [["A", "confirmarle solamente que la denuncia existe, sin entregar detalles sobre su contenido.", "Parece prudente, pero entrega información institucional sin estar autorizado.", false], ["B", "darle los datos generales que ya conoce la comunidad del sector, para evitar que circulen rumores.", "Su intención es evitar rumores, pero asume una vocería que no le corresponde.", false], ["C", "indicarle que no está autorizado para dar información y remitirlo a la oficina de comunicaciones.", "Refleja la competencia «Manejo de la información» (Decreto 1083 de 2015, art. 2.2.4.8, num. 5, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en manejar con responsabilidad la información personal e institucional de la que se dispone. Refleja las conductas de evadir temas que indagan sobre información confidencial y no hacer pública información laboral que pueda afectar a la organización.", true]]}, {"id": "CO-205", "niv": 3, "e": "Ante la pregunta del empleado de la empresa denunciada, la conducta que mejor refleja el manejo de la información es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 5, sustituido por el art. 1 del Decreto 815 de 2018 (nivel asistencial: Manejo de la información)", "o": [["A", "abstenerse de revelar cualquier dato del denunciante e indicarle que puede conocer el trámite por los canales formales.", "Refleja la competencia «Manejo de la información» (Decreto 1083 de 2015, art. 2.2.4.8, num. 5, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en manejar con responsabilidad la información personal e institucional de la que se dispone. Corresponde a manejar con responsabilidad la información personal de que dispone y no hacer pública la que pueda afectar a las personas.", true], ["B", "pedirle que espere mientras consulta con el profesional a cargo si es posible darle el nombre.", "Muestra cautela, pero deja abierta la posibilidad de revelar una identidad que el ciudadano pidió reservar.", false], ["C", "decirle que la denuncia la presentó un vecino del sector, sin mencionar su nombre ni otros datos.", "Intenta proteger al denunciante, pero revela datos que pueden permitir identificarlo.", false]]}]}, {"comp": "comportamental", "rol": "asistencial", "tag": "Competencias comportamentales (Decreto 815 de 2018) · Nivel asistencial · Manejo de la información", "texto": "Usted es auxiliar administrativo en la oficina de atención a la ciudadanía de una secretaría distrital de Bogotá. En su equipo de trabajo maneja una base de datos con nombres, documentos y direcciones de los solicitantes, y en su escritorio quedan con frecuencia formularios físicos diligenciados. Para un trámite de certificado, una usuaria le ofrece copia de toda su historia clínica «por si acaso». Su jefe le pidió el informe mensual de quejas, entre las cuales hay una contra un compañero con quien usted tiene una buena amistad.", "items": [{"id": "CO-206", "niv": 1, "e": "Cuando debe alejarse un momento de su puesto, la conducta que mejor refleja el manejo de la información es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 5, sustituido por el art. 1 del Decreto 815 de 2018 (nivel asistencial: Manejo de la información)", "o": [["A", "pedirle a un compañero cercano que esté pendiente de su puesto y de los documentos mientras regresa.", "Muestra cuidado, pero deja la información expuesta y depende de la atención de otra persona.", false], ["B", "bloquear la sesión del computador y guardar los formularios antes de levantarse, pues contienen datos personales.", "Refleja la competencia «Manejo de la información» (Decreto 1083 de 2015, art. 2.2.4.8, num. 5, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en manejar con responsabilidad la información personal e institucional de la que se dispone. Corresponde a organizar y custodiar de forma adecuada la información a su cuidado.", true], ["C", "minimizar la ventana de la base de datos y voltear los formularios sobre el escritorio.", "Reduce la exposición, pero la información sigue accesible para cualquiera.", false]]}, {"id": "CO-207", "niv": 2, "e": "Frente a la usuaria que ofrece copia de su historia clínica, la conducta más acorde con el manejo de la información es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 5, sustituido por el art. 1 del Decreto 815 de 2018 (nivel asistencial: Manejo de la información)", "o": [["A", "recibir la copia completa y archivarla en el expediente, por si llegara a necesitarse más adelante.", "Facilita un trámite futuro hipotético, pero recoge información sensible que no se requiere.", false], ["B", "escanear la historia clínica completa, incorporarla al expediente digital del trámite y devolverle los originales.", "Devuelve los originales, pero igual almacena información sensible innecesaria.", false], ["C", "recibir solo lo que pide el trámite y devolverle la historia clínica, que no se requiere.", "Refleja la competencia «Manejo de la información» (Decreto 1083 de 2015, art. 2.2.4.8, num. 5, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en manejar con responsabilidad la información personal e institucional de la que se dispone. Aplica la conducta de recoger únicamente la información imprescindible: la historia clínica es información sensible que el trámite no requiere.", true]]}, {"id": "CO-208", "niv": 3, "e": "Al preparar el informe mensual de quejas, la conducta que mejor refleja el manejo de la información es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 5, sustituido por el art. 1 del Decreto 815 de 2018 (nivel asistencial: Manejo de la información)", "o": [["A", "incluir todas las quejas registradas, con los datos tal como constan en el sistema.", "Refleja la competencia «Manejo de la información» (Decreto 1083 de 2015, art. 2.2.4.8, num. 5, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en manejar con responsabilidad la información personal e institucional de la que se dispone. Corresponde a transmitir información oportuna y objetiva, sin dejar que las relaciones personales la alteren.", true], ["B", "omitir la queja contra su compañero mientras se verifica, para no afectar su reputación ante el jefe.", "Busca proteger al compañero, pero el informe deja de ser completo y objetivo.", false], ["C", "incluir la queja con una nota en la que explique que su compañero suele ser muy amable con los usuarios.", "Incluye el dato, pero agrega una valoración personal que resta objetividad al informe.", false]]}]}, {"comp": "comportamental", "rol": "asistencial", "tag": "Competencias comportamentales (Decreto 815 de 2018) · Nivel asistencial · Relaciones interpersonales", "texto": "Usted es auxiliar administrativo de la ventanilla de atención de la alcaldía de un municipio de sexta categoría. Un campesino llega a explicarle un problema con su recibo de impuesto predial, pero lo hace de forma desordenada. Por otro lado, el trámite de una usuaria de una comunidad indígena, que habla poco español, ya está listo para entrega. En la reunión de esta mañana, a la que faltaron dos compañeros, el jefe presentó datos sobre los tiempos de espera en ventanilla y dijo que es necesario reducirlos.", "items": [{"id": "CO-209", "niv": 1, "e": "Para atender al campesino, la conducta que mejor refleja las relaciones interpersonales es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 5, sustituido por el art. 1 del Decreto 815 de 2018 (nivel asistencial: Relaciones interpersonales)", "o": [["A", "interrumpirlo con amabilidad para explicarle cuáles son los motivos más comunes de error en los recibos.", "Es cortés, pero responde antes de entender la necesidad concreta del usuario.", false], ["B", "dejarlo terminar, hacerle preguntas y repetirle lo que entendió, para asegurarse de captar su necesidad.", "Refleja la competencia «Relaciones interpersonales» (Decreto 1083 de 2015, art. 2.2.4.8, num. 5, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en establecer y mantener relaciones de trabajo positivas, basadas en una comunicación abierta y fluida y en el respeto por los demás. Corresponde a escuchar con interés y captar las necesidades de los demás.", true], ["C", "pedirle que escriba el problema en un formato de solicitud, para analizarlo con más calma después.", "Deja constancia, pero no escucha ni capta la necesidad del usuario en el momento.", false]]}, {"id": "CO-210", "niv": 2, "e": "Respecto del trámite listo de la usuaria indígena, la conducta más acorde con las relaciones interpersonales es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 5, sustituido por el art. 1 del Decreto 815 de 2018 (nivel asistencial: Relaciones interpersonales)", "o": [["A", "llamarla para avisarle, con palabras sencillas, que el trámite está listo y qué debe traer para reclamarlo.", "Refleja la competencia «Relaciones interpersonales» (Decreto 1083 de 2015, art. 2.2.4.8, num. 5, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en establecer y mantener relaciones de trabajo positivas, basadas en una comunicación abierta y fluida y en el respeto por los demás. Refleja la conducta de tomar la iniciativa en el contacto con los usuarios para dar avisos con lenguaje claro, especialmente con personas de grupos minoritarios.", true], ["B", "publicar en la cartelera y en las redes de la alcaldía la lista de los trámites que ya están listos para entrega.", "Informa de manera general, pero no garantiza que la usuaria reciba ni comprenda el aviso.", false], ["C", "esperar a que la usuaria regrese a preguntar, momento en el que se le hará la entrega del trámite.", "No toma la iniciativa de contactarla y prolonga innecesariamente la espera.", false]]}, {"id": "CO-211", "niv": 3, "e": "Los dos compañeros que faltaron a la reunión le preguntan qué se dijo. La conducta que mejor refleja las relaciones interpersonales es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 5, sustituido por el art. 1 del Decreto 815 de 2018 (nivel asistencial: Relaciones interpersonales)", "o": [["A", "decirles que el jefe está molesto con la ventanilla, para que tomen conciencia de la necesidad de mejorar.", "Busca motivarlos, pero distorsiona el mensaje y puede deteriorar el ambiente laboral.", false], ["B", "decirles que solo se habló de temas generales y que el jefe les contará los detalles después.", "Evita el tema, pero oculta información que sus compañeros necesitan para su trabajo.", false], ["C", "contarles lo que dijo el jefe tal como lo expresó, con los datos de tiempos que presentó.", "Refleja la competencia «Relaciones interpersonales» (Decreto 1083 de 2015, art. 2.2.4.8, num. 5, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en establecer y mantener relaciones de trabajo positivas, basadas en una comunicación abierta y fluida y en el respeto por los demás. Corresponde a transmitir la información de forma fidedigna, evitando situaciones que deterioren el ambiente laboral.", true]]}]}, {"comp": "comportamental", "rol": "asistencial", "tag": "Competencias comportamentales (Decreto 815 de 2018) · Nivel asistencial · Relaciones interpersonales", "texto": "Usted es secretario de la Subdirección de Gestión Ambiental de una corporación autónoma regional. Comparte con su compañero Óscar la carpeta digital de correspondencia, que él suele dejar desordenada. Al grupo se integró Natalia, auxiliar con discapacidad auditiva. Además, un usuario campesino de 70 años recibió un oficio de la corporación que le pide aportar un plano del predio y un certificado de tradición, y usted sabe, por una conversación previa en ventanilla, que el usuario no entendió el oficio.", "items": [{"id": "CO-212", "niv": 2, "e": "Frente al desorden de la carpeta compartida, la conducta que mejor refleja las relaciones interpersonales es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 5, sustituido por el art. 1 del Decreto 815 de 2018 (nivel asistencial: Relaciones interpersonales)", "o": [["A", "informar al subdirector sobre el desorden de Óscar en la carpeta compartida, para que sea él quien tome las medidas del caso.", "Escala un asunto que puede resolverse con una conversación directa y respetuosa.", false], ["B", "reorganizar usted mismo la carpeta cada vez que la encuentre desordenada, sin comentarle nada a Óscar.", "Evita el conflicto, pero no comunica el problema y la situación se repetirá.", false], ["C", "hablar con Óscar en privado, explicarle cómo le afecta el desorden y acordar una forma de organizar la carpeta.", "Refleja la competencia «Relaciones interpersonales» (Decreto 1083 de 2015, art. 2.2.4.8, num. 5, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en establecer y mantener relaciones de trabajo positivas, basadas en una comunicación abierta y fluida y en el respeto por los demás. Corresponde a mantener relaciones de trabajo positivas basadas en una comunicación abierta y fluida y en el respeto.", true]]}, {"id": "CO-213", "niv": 2, "e": "Para coordinar el trabajo diario con Natalia, la conducta más acorde con las relaciones interpersonales es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 5, sustituido por el art. 1 del Decreto 815 de 2018 (nivel asistencial: Relaciones interpersonales)", "o": [["A", "preguntarle cómo prefiere comunicarse y usar ese medio en las coordinaciones diarias.", "Refleja la competencia «Relaciones interpersonales» (Decreto 1083 de 2015, art. 2.2.4.8, num. 5, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en establecer y mantener relaciones de trabajo positivas, basadas en una comunicación abierta y fluida y en el respeto por los demás. Refleja la conducta de escuchar con interés y captar las necesidades de los demás, en una relación basada en el respeto.", true], ["B", "comunicarle todo por escrito desde el primer día, sin preguntarle, porque supone que es lo más cómodo para ella.", "Tiene buena intención, pero decide por ella sin escucharla.", false], ["C", "pedir a otro compañero que actúe como intermediario cuando necesite comunicarse con ella.", "Busca facilitar, pero la excluye de la comunicación directa con usted.", false]]}, {"id": "CO-214", "niv": 3, "e": "Respecto del usuario que no entendió el oficio, la conducta que mejor refleja las relaciones interpersonales es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 5, sustituido por el art. 1 del Decreto 815 de 2018 (nivel asistencial: Relaciones interpersonales)", "o": [["A", "reenviarle el mismo oficio por correo certificado, para asegurar que quede notificado en debida forma del requerimiento.", "Asegura el envío, pero no resuelve la dificultad de comprensión del usuario.", false], ["B", "llamarlo para explicarle con palabras sencillas qué documentos le piden y dejar constancia de la llamada.", "Refleja la competencia «Relaciones interpersonales» (Decreto 1083 de 2015, art. 2.2.4.8, num. 5, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en establecer y mantener relaciones de trabajo positivas, basadas en una comunicación abierta y fluida y en el respeto por los demás. Corresponde a tomar la iniciativa en el contacto con los usuarios para dar respuestas con lenguaje claro, en especial con personas en situación de mayor vulnerabilidad.", true], ["C", "esperar a que el profesional que hará la visita le explique el oficio cuando vaya al predio.", "Aplaza la aclaración y no toma la iniciativa de comunicarse con el usuario.", false]]}]}, {"comp": "comportamental", "rol": "asistencial", "tag": "Competencias comportamentales (Decreto 815 de 2018) · Nivel asistencial · Colaboración", "texto": "Usted es auxiliar administrativo del archivo central de una gobernación. Este mes se realiza la transferencia documental de cinco secretarías, y usted trabaja con los auxiliares de cada una. Se comprometió a entregar el jueves a la Secretaría de Hacienda la revisión de su inventario documental. En las primeras transferencias, los auxiliares de varias secretarías han diligenciado con errores el formato de inventario. Las secretarías de Salud y de Educación pidieron transferir el mismo día, pero el archivo solo tiene capacidad para recibir una transferencia diaria.", "items": [{"id": "CO-215", "niv": 1, "e": "El miércoles le piden atender la consulta urgente de un expediente solicitado por un juzgado, que le tomará unas dos horas; reorganizando su agenda, aún puede terminar la revisión para Hacienda el jueves. La conducta que mejor refleja la colaboración es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 5, sustituido por el art. 1 del Decreto 815 de 2018 (nivel asistencial: Colaboración)", "o": [["A", "atender la consulta urgente y avisar con tiempo a Hacienda que el inventario revisado se le entregará el viernes.", "Avisa a tiempo, pero incumple el compromiso sin haber intentado reorganizar su trabajo.", false], ["B", "atender la consulta urgente y reorganizar su día para entregar el inventario el jueves como acordó.", "Refleja la competencia «Colaboración» (Decreto 1083 de 2015, art. 2.2.4.8, num. 5, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en cooperar con los demás para alcanzar los objetivos institucionales. Corresponde a cumplir con los compromisos adquiridos sin dejar de apoyar una necesidad urgente de la entidad.", true], ["C", "pedir a Hacienda que revise por su cuenta el inventario, ya que usted debe atender la consulta del juzgado.", "Traslada su compromiso a otra dependencia.", false]]}, {"id": "CO-216", "niv": 2, "e": "Frente a los errores en el formato de inventario, la conducta más acorde con la colaboración es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 5, sustituido por el art. 1 del Decreto 815 de 2018 (nivel asistencial: Colaboración)", "o": [["A", "devolver las cajas con errores para que cada secretaría corrija el formato de inventario antes de recibir la transferencia.", "Aplica el control, pero no facilita la labor de los compañeros para evitar que el error se repita.", false], ["B", "corregir usted mismo los formatos de todas las secretarías, para que la transferencia avance más rápido.", "Resuelve en lo inmediato, pero asume una tarea ajena y no evita que el error se repita.", false], ["C", "enviar a los auxiliares, antes de su transferencia, un ejemplo del formato bien diligenciado con indicaciones breves.", "Refleja la competencia «Colaboración» (Decreto 1083 de 2015, art. 2.2.4.8, num. 5, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en cooperar con los demás para alcanzar los objetivos institucionales. Refleja la conducta de facilitar la labor de sus superiores y compañeros de trabajo.", true]]}, {"id": "CO-217", "niv": 3, "e": "Ante la solicitud de Salud y Educación de transferir el mismo día, la conducta que mejor refleja la colaboración es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 5, sustituido por el art. 1 del Decreto 815 de 2018 (nivel asistencial: Colaboración)", "o": [["A", "proponer a ambas secretarías fechas consecutivas, de acuerdo con la capacidad del archivo, y confirmarlas por escrito.", "Refleja la competencia «Colaboración» (Decreto 1083 de 2015, art. 2.2.4.8, num. 5, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en cooperar con los demás para alcanzar los objetivos institucionales. Corresponde a articular sus actuaciones con las de los demás para alcanzar los objetivos institucionales.", true], ["B", "atender a la secretaría que lo solicitó primero y aplazar la otra hasta el próximo mes.", "Aplica un criterio objetivo, pero no busca la forma de articular ambas transferencias dentro del mes.", false], ["C", "recibir ambas transferencias el mismo día, aunque se supere la capacidad del archivo, para no afectar a ninguna.", "Busca atender a ambas, pero desconoce la capacidad real y arriesga el orden de la documentación.", false]]}]}, {"comp": "comportamental", "rol": "asistencial", "tag": "Competencias comportamentales (Decreto 815 de 2018) · Nivel asistencial · Colaboración", "texto": "Usted es conductor de una corporación autónoma regional y transporta a los equipos técnicos a sus visitas de campo. La programación del parque automotor está a cargo del profesional de servicios administrativos. Hoy se comprometió a recoger a un equipo técnico a las 3:00 p. m. en una vereda; a las 2:00 p. m. un funcionario le pide llevar un documento urgente a la alcaldía municipal. Otro día, el equipo técnico decide prolongar dos horas una visita en una zona cuya vía de regreso, según las reglas de seguridad de la corporación, no debe transitarse de noche.", "items": [{"id": "CO-218", "niv": 1, "e": "Ante la solicitud de llevar el documento a las 2:00 p. m., la conducta que mejor refleja la colaboración es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 5, sustituido por el art. 1 del Decreto 815 de 2018 (nivel asistencial: Colaboración)", "o": [["A", "negarse a llevar el documento, porque esa tarea no está incluida en la programación del día.", "Protege su compromiso, pero no busca alternativas para cooperar con la necesidad planteada.", false], ["B", "explicar que a las 3:00 p. m. tiene un compromiso y acordar llevar el documento después o que lo lleve otra persona.", "Refleja la competencia «Colaboración» (Decreto 1083 de 2015, art. 2.2.4.8, num. 5, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en cooperar con los demás para alcanzar los objetivos institucionales. Corresponde a cumplir con los compromisos adquiridos y articular sus actuaciones con las de los demás.", true], ["C", "llevar el documento a la alcaldía y llegar más tarde por el equipo técnico, que entenderá la urgencia.", "Apoya una necesidad, pero incumple el compromiso adquirido con el equipo técnico.", false]]}, {"id": "CO-219", "niv": 2, "e": "Dos profesionales le piden el vehículo para el mismo día y para zonas opuestas. La conducta más acorde con la colaboración es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 5, sustituido por el art. 1 del Decreto 815 de 2018 (nivel asistencial: Colaboración)", "o": [["A", "atender al profesional que hizo primero la solicitud y avisar al otro que no hay disponibilidad.", "Usa un criterio razonable, pero decide sobre una programación que no le corresponde.", false], ["B", "hacer ambas visitas el mismo día acortando el tiempo de cada una, para no dejar a ninguno de los dos profesionales sin transporte.", "Quiere ayudar a ambos, pero altera las visitas sin coordinación y puede afectar su resultado.", false], ["C", "avisar del cruce al responsable de programar el parque automotor, ya que a él le corresponde asignar el vehículo.", "Refleja la competencia «Colaboración» (Decreto 1083 de 2015, art. 2.2.4.8, num. 5, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en cooperar con los demás para alcanzar los objetivos institucionales. Refleja la conducta de articular sus actuaciones con las de los demás y facilitar la labor de sus superiores, respetando el procedimiento de programación.", true]]}, {"id": "CO-220", "niv": 3, "e": "Frente a la decisión del equipo de prolongar la visita, la conducta que mejor refleja la colaboración es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 5, sustituido por el art. 1 del Decreto 815 de 2018 (nivel asistencial: Colaboración)", "o": [["A", "informar al equipo el horario límite de regreso y ajustar con ellos el plan, ya que esa vía no debe transitarse de noche.", "Refleja la competencia «Colaboración» (Decreto 1083 de 2015, art. 2.2.4.8, num. 5, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en cooperar con los demás para alcanzar los objetivos institucionales. Corresponde a articular sus actuaciones con las de los demás y facilitar la labor de los compañeros dentro de las reglas de la entidad.", true], ["B", "regresar a la hora inicialmente prevista y dejar que el equipo busque otro medio de transporte.", "Respeta la regla, pero no articula su actuación con el equipo y lo deja sin transporte.", false], ["C", "esperar el tiempo que el equipo necesite en la zona, ya que cumplir el objetivo de la visita técnica es lo más importante.", "Apoya la visita, pero desconoce una regla de seguridad de la corporación.", false]]}]}];
const CFG = {"titulo": "Práctica por tema y nivel · CNSC Empleo Público", "modo": "practica", "minutos": 0, "componentes": {"estado_constitucion": "Estado y Constitución", "empleo_publico": "Empleo público, carrera y régimen disciplinario", "atencion_procedimiento": "Atención al ciudadano y procedimiento administrativo", "gestion_publica": "Gestión pública, MIPG, contratación y documentos", "entidades_territoriales": "Entidades territoriales, Bogotá D.C. y CAR", "comportamental": "Competencias comportamentales (Decreto 815 de 2018)"}, "niveles": {"1": "Básico", "2": "Intermedio", "3": "Avanzado"}, "roles": {"general": "Todos los niveles", "asistencial": "Nivel asistencial", "tecnico": "Nivel técnico", "profesional": "Nivel profesional"}, "clave": "practica.html"};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY = 'sim-cnsc:' + CFG.clave;
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}
function save(){try{localStorage.setItem(KEY, JSON.stringify(ST))}catch(e){}}
let ST = load();
ST.r = ST.r || {};
$('#tit').textContent = CFG.titulo;
const ITEMS = [];
DATA.forEach(c => c.items.forEach(it => { it.caso = c; ITEMS.push(it); }));

function justHTML(it){
  return '<div class="just">' + it.o.map(o => `<div><b>${o[0]}.</b> <span class="${o[3]?'okt':'not'}">${o[3]?'Es correcta.':'Es incorrecta.'}</span> ${esc(o[2])}</div>`).join('') +
    `<div class="src">Referencia: ${esc(it.f)}</div></div>`;
}
function itemHTML(it, n, mode){
  const r = ST.r[it.id];
  const reveal = mode === 'review' || (CFG.modo === 'practica' && r);
  let h = `<div class="item" id="i-${it.id}"><p class="enun"><span class="n">${n}.</span> <span class="niv">${CFG.niveles[it.niv]}</span> ${esc(it.e)}</p>`;
  it.o.forEach(o => {
    let cls = '';
    if (reveal) { if (o[3]) cls = 'ok'; else if (r === o[0]) cls = 'no'; }
    else if (r === o[0]) cls = 'sel';
    h += `<button class="op ${cls}" data-id="${it.id}" data-l="${o[0]}" ${reveal?'disabled':''}><span class="l">${o[0]}.</span><span>${esc(o[1])}</span></button>`;
  });
  if (reveal) {
    if (mode === 'review') h += `<div class="${r===keyOf(it)?'res-ok':'res-no'}" style="font-size:14px;margin-top:4px">${r ? (r===keyOf(it)?'Respondiste ' + r + ': correcto.':'Respondiste ' + r + '. La respuesta correcta es ' + keyOf(it) + '.') : 'Sin responder. La respuesta correcta es ' + keyOf(it) + '.'}</div>`;
    h += justHTML(it);
  }
  return h + '</div>';
}
const keyOf = it => it.o.find(o => o[3])[0];

function renderList(list, mode){
  let h = '', last = null, n = 0;
  list.forEach(it => {
    n++;
    if (it.caso !== last) { last = it.caso; h += `<div class="caso"><div class="tag">${esc(it.caso.tag)}</div><p>${esc(it.caso.texto)}</p></div>`; }
    h += itemHTML(it, n, mode);
  });
  return h;
}

// ---------- PRÁCTICA ----------
let LIST = [];
let FILTRO = ST.f || {comp:'', niv:'', rol:''};
function practica(){
  const comps = Object.entries(CFG.componentes).map(([k,v]) => `<option value="${k}" ${FILTRO.comp===k?'selected':''}>${esc(v)}</option>`).join('');
  const nivs = Object.entries(CFG.niveles).map(([k,v]) => `<option value="${k}" ${FILTRO.niv===k?'selected':''}>${esc(v)}</option>`).join('');
  const list = ITEMS.filter(it => (!FILTRO.comp || it.caso.comp===FILTRO.comp) && (!FILTRO.niv || String(it.niv)===FILTRO.niv) && (!FILTRO.rol || it.caso.rol===FILTRO.rol || it.caso.rol==='general'));
  const resp = list.filter(it => ST.r[it.id]); const ok = resp.filter(it => ST.r[it.id]===keyOf(it));
  $('#main').innerHTML = `<div class="panel"><p style="margin-top:0">Elige un tema, tu nivel de empleo y la dificultad. Al responder verás de inmediato si acertaste y la explicación de cada opción.</p>
  <div class="row"><select id="fc"><option value="">Todos los temas</option>${comps}</select>
  <select id="fn"><option value="">Todas las dificultades</option>${nivs}</select>
  <select id="fr"><option value="">Todos los niveles de empleo</option>${['asistencial','tecnico','profesional'].map(k => `<option value="${k}" ${FILTRO.rol===k?'selected':''}>${esc(CFG.roles[k])} (y temas comunes)</option>`).join('')}</select>
  <button class="btn sec" id="borrar">Borrar mis respuestas</button></div>
  <p class="stat" id="pst" style="margin-bottom:0">${list.length} preguntas · respondidas ${resp.length} · aciertos ${ok.length}${resp.length? ' (' + Math.round(100*ok.length/resp.length) + ' %)':''}</p></div>` + renderList(list, 'practica');
  $('#prog').textContent = `${ok.length}/${resp.length} aciertos`;
  ['fc','fn','fr'].forEach((id,i) => $('#'+id).onchange = e => { FILTRO[['comp','niv','rol'][i]] = e.target.value; ST.f = FILTRO; save(); practica(); });
  LIST = list;
  $('#borrar').onclick = () => { list.forEach(it => delete ST.r[it.id]); save(); practica(); };
}

// ---------- SIMULACRO ----------
let tick = null;
function inicio(){
  const n = ITEMS.length, cnt = {};
  ITEMS.forEach(it => cnt[it.caso.comp] = (cnt[it.caso.comp]||0) + 1);
  const h = Math.floor(CFG.minutos/60), m = CFG.minutos%60;
  $('#main').innerHTML = `<div class="panel"><h2 style="margin-top:0;color:var(--pri)">Instrucciones</h2>
  <p>Este simulacro tiene <b>${n} preguntas</b> en el formato de Prueba de Juicio Situacional: un caso, enunciados que se completan y tres opciones con una sola respuesta correcta.</p>
  <table>${Object.entries(cnt).map(([k,v]) => `<tr><td>${esc(CFG.componentes[k])}</td><td class="r">${v}</td></tr>`).join('')}</table>
  <p>Tiempo sugerido: <b>${h ? h + ' h ' : ''}${m ? m + ' min' : ''}</b> (unos ${Math.round(CFG.minutos*60/n/6)/10} minutos por pregunta). Cuando se acaba el tiempo puedes seguir, pero el cronómetro lo indica.</p>
  <p>Tus respuestas se guardan en este navegador. Al terminar verás tu puntaje por componente y por dificultad, y la explicación de cada pregunta.</p>
  <button class="btn" id="go">${ST.t0 ? 'Continuar el simulacro' : 'Comenzar'}</button></div>`;
  $('#prog').textContent = `${n} preguntas`;
  $('#go').onclick = () => { if (!ST.t0) { ST.t0 = Date.now(); save(); } examen(); };
}
function reloj(){
  const rest = CFG.minutos*60 - Math.floor((Date.now() - ST.t0)/1000);
  const a = Math.abs(rest), hh = Math.floor(a/3600), mm = Math.floor(a%3600/60), ss = a%60;
  const t = (rest < 0 ? '+' : '') + (hh ? hh + ':' : '') + String(mm).padStart(2,'0') + ':' + String(ss).padStart(2,'0');
  $('#timer').textContent = rest < 0 ? 'Tiempo cumplido ' + t : '⏱ ' + t;
  $('#timer').classList.toggle('low', rest < 600);
}
function examen(){
  $('#main').innerHTML = renderList(ITEMS, 'examen') + `<div class="panel"><button class="btn" id="fin">Terminar y calificar</button></div>`;
  progreso(); reloj(); clearInterval(tick); tick = setInterval(reloj, 1000);
  $('#fin').onclick = () => {
    const faltan = ITEMS.length - Object.keys(ST.r).filter(k => ITEMS.some(i => i.id===k)).length;
    $('#mtxt').textContent = faltan ? `Te faltan ${faltan} preguntas por responder. ¿Quieres calificar de todos modos?` : '¿Quieres terminar y ver tu calificación?';
    $('#modal').classList.remove('hide');
  };
}
function progreso(){
  const r = ITEMS.filter(it => ST.r[it.id]).length;
  $('#prog').textContent = `Respondidas ${r}/${ITEMS.length}`;
}
$('#mno').onclick = () => $('#modal').classList.add('hide');
$('#msi').onclick = () => { $('#modal').classList.add('hide'); ST.fin = Date.now(); save(); resultados(); };
function resultados(){
  clearInterval(tick);
  const ok = ITEMS.filter(it => ST.r[it.id] === keyOf(it)).length;
  const pct = Math.round(1000*ok/ITEMS.length)/10;
  const g = (fn, lab) => { const m = {}; ITEMS.forEach(it => { const k = fn(it); m[k] = m[k] || [0,0]; m[k][1]++; if (ST.r[it.id]===keyOf(it)) m[k][0]++; });
    return Object.entries(m).map(([k,v]) => `<tr><td>${esc(lab(k))}</td><td class="r">${v[0]}/${v[1]}</td><td class="r">${Math.round(100*v[0]/v[1])} %</td></tr>`).join(''); };
  const mins = Math.round(((ST.fin||Date.now()) - ST.t0)/60000);
  $('#timer').textContent = `Tiempo usado: ${Math.floor(mins/60) ? Math.floor(mins/60) + ' h ' : ''}${mins%60} min`;
  $('#prog').textContent = `${ok}/${ITEMS.length} aciertos`;
  $('#main').innerHTML = `<div class="panel"><div class="big">${String(pct).replace('.',',')} %</div>
  <p style="margin-top:4px">${ok} de ${ITEMS.length} respuestas correctas. ${pct >= 75 ? 'Muy buen resultado: repasa las explicaciones de tus errores para afianzarlo.' : pct >= 65 ? 'Vas bien, pero con poco margen: refuerza los componentes con menor porcentaje.' : 'Todavía no estás en zona segura: practica por tema los componentes con menor porcentaje.'}</p>
  <p class="aviso">Referencia: en los procesos Distrito Capital 7, Territorial 14 y CAR, la prueba de competencias funcionales es eliminatoria con mínimo de 65 puntos, y la comportamental es clasificatoria. Este porcentaje de aciertos es una guía de preparación; la CNSC calcula su puntaje con su propia escala, comparando con los demás aspirantes al mismo empleo.</p>
  <h3>Por componente</h3><table>${g(it => it.caso.comp, k => CFG.componentes[k])}</table>
  <h3>Por dificultad</h3><table>${g(it => it.niv, k => CFG.niveles[k])}</table>
  <div class="row" style="margin-top:14px"><button class="btn" id="solo">Ver solo mis errores</button><button class="btn sec" id="todas">Ver todas</button><button class="btn sec" id="otra">Reiniciar el simulacro</button></div></div><div id="rev"></div>`;
  const rev = errs => { const l = errs ? ITEMS.filter(it => ST.r[it.id] !== keyOf(it)) : ITEMS; $('#rev').innerHTML = renderList(l, 'review'); };
  rev(true);
  $('#solo').onclick = () => rev(true); $('#todas').onclick = () => rev(false);
  $('#otra').onclick = () => { ST = {r:{}}; save(); inicio(); window.scrollTo(0,0); };
}

document.addEventListener('click', e => {
  const b = e.target.closest('button.op'); if (!b || b.disabled) return;
  ST.r[b.dataset.id] = b.dataset.l; save();
  const it = ITEMS.find(i => i.id === b.dataset.id);
  const n = b.closest('.item').querySelector('.n').textContent.replace('.','');
  b.closest('.item').outerHTML = itemHTML(it, n, CFG.modo === 'practica' ? 'practica' : 'examen');
  if (CFG.modo === 'practica') { const resp = LIST.filter(i => ST.r[i.id]); const ok = resp.filter(i => ST.r[i.id]===keyOf(i)).length; $('#prog').textContent = `${ok}/${resp.length} aciertos`; $('#pst').textContent = `${LIST.length} preguntas · respondidas ${resp.length} · aciertos ${ok} (${Math.round(100*ok/resp.length)} %)`; }
  else progreso();
});

if (CFG.modo === 'practica') practica();
else if (ST.fin) resultados();
else if (ST.t0) examen();
else inicio();
</script>
</body>
</html>
