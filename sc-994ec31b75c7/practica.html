 de horario para inducir la renuncia.", false], ["B", "persecución laboral.", "El art. 2, num. 2, de la Ley 1010 de 2006 define la persecución laboral como la conducta reiterada o evidentemente arbitraria que permite inferir el propósito de inducir la renuncia, mediante descalificación, carga excesiva de trabajo y cambios permanentes de horario.", true], ["C", "discriminación laboral.", "La discriminación laboral exige un trato diferenciado por razones como raza, género, edad, origen, credo, preferencia política o situación social; el caso no menciona ninguno de esos motivos, sino carga excesiva y cambios de horario para inducir la renuncia.", false]]}, {"id": "EP-177", "niv": 1, "e": "La conducta del compañero que insulta al auxiliar delante de los demás corresponde a", "f": "Ley 1010 de 2006, arts. 2 y 7", "o": [["A", "maltrato laboral, por tratarse de expresiones injuriosas que lesionan la integridad moral del trabajador.", "El art. 2, num. 1, de la Ley 1010 de 2006 define el maltrato laboral como, entre otros, toda expresión verbal injuriosa o ultrajante que lesione la integridad moral, y el art. 7 presume el acoso ante comentarios hostiles y humillantes de descalificación profesional ante los compañeros.", true], ["B", "un conflicto entre pares que no es acoso, porque este solo puede provenir de un superior jerárquico.", "La ley reconoce como posibles autores del acoso al jefe, a un compañero de trabajo o a un subalterno (art. 2 de la Ley 1010 de 2006).", false], ["C", "discriminación laboral, porque el trato que recibe es distinto al que reciben los demás compañeros de la dependencia.", "La discriminación laboral exige un trato diferenciado por razones como raza, género, edad, origen, credo o preferencia política; el caso describe insultos, que corresponden al maltrato.", false]]}, {"id": "EP-178", "niv": 3, "e": "Frente a la queja de la coordinadora contra sus subalternos, el comité debe tener en cuenta que", "f": "Ley 1010 de 2006, arts. 2 y 6", "o": [["A", "no puede tramitarse, porque la víctima del acoso siempre es quien está en posición de subordinación.", "La Ley 1010 de 2006 reconoce expresamente que el acoso puede provenir de un subalterno y que los jefes inmediatos pueden ser víctimas.", false], ["B", "solo puede tramitarse como un asunto disciplinario por desobediencia, no como acoso laboral.", "La ley no limita esta situación a la desobediencia; la regula como acoso laboral cuando se cumplen sus elementos.", false], ["C", "puede tramitarse como acoso laboral, porque la ley contempla que los jefes inmediatos sean víctimas cuando el acoso proviene de sus subalternos.", "El art. 2 de la Ley 1010 de 2006 incluye al subalterno como posible autor del acoso, y el art. 6 reconoce como sujetos pasivos a los jefes inmediatos cuando el acoso proviene de sus subalternos.", true]]}]}, {"comp": "empleo_publico", "rol": "general", "tag": "Empleo público, carrera y régimen disciplinario · Conductas que no constituyen acoso laboral", "texto": "En una corporación autónoma regional, el subdirector de gestión ambiental expidió un memorando que exige a su equipo cumplir un estándar técnico para los conceptos de concesiones de agua y anuncia que el desempeño se evaluará con indicadores objetivos aplicables a todos. Días después, por una emergencia por inundaciones, pidió a varios servidores apoyar fuera de su rutina habitual la atención de la emergencia durante una semana. Un servidor considera que ambas medidas son acoso laboral. Además, otra servidora relata que una sola vez su jefe la agredió físicamente en una reunión.", "items": [{"id": "EP-179", "niv": 2, "e": "Respecto del memorando con estándares técnicos e indicadores objetivos, el comité concluye que", "f": "Ley 1010 de 2006, art. 8", "o": [["A", "constituye acoso, porque toda exigencia escrita del superior genera presión indebida sobre el equipo.", "La ley excluye expresamente del acoso los memorandos encaminados a exigencias técnicas, a mejorar la eficiencia y a evaluar con indicadores objetivos y generales.", false], ["B", "no constituye acoso, porque busca exigencias técnicas y una evaluación con indicadores objetivos y generales.", "El art. 8, lit. d, de la Ley 1010 de 2006 dispone que no constituye acoso la formulación de circulares o memorandos de servicio encaminados a solicitar exigencias técnicas o mejorar la eficiencia laboral y la evaluación de subalternos con indicadores objetivos y generales de rendimiento.", true], ["C", "constituye acoso solo si el servidor afectado obtiene después una evaluación no satisfactoria en su desempeño.", "El resultado posterior de la evaluación no convierte en acoso una medida que la ley excluye expresamente de ese concepto.", false]]}, {"id": "EP-180", "niv": 1, "e": "Respecto de la solicitud de apoyo durante la emergencia por inundaciones, el comité concluye que", "f": "Ley 1010 de 2006, art. 8", "o": [["A", "no es acoso, porque son deberes extra de colaboración necesarios para la continuidad del servicio.", "El art. 8, lit. e, de la Ley 1010 de 2006 establece que no constituye acoso la solicitud de cumplir deberes extras de colaboración cuando sean necesarios para la continuidad del servicio o para solucionar situaciones difíciles de la institución.", true], ["B", "es acoso, porque la ley prohíbe pedir colaboración por fuera del manual de funciones en cualquier caso.", "No existe esa prohibición absoluta; la ley admite la solicitud de deberes extra de colaboración en situaciones como la emergencia descrita.", false], ["C", "es acoso, porque cualquier tarea distinta de las habituales es ajena a las obligaciones laborales.", "La ley distingue: los deberes ostensiblemente extraños sin fundamento pueden ser acoso, pero los deberes extra necesarios para la continuidad del servicio están excluidos.", false]]}, {"id": "EP-181", "niv": 3, "e": "Sobre la agresión física ocurrida una sola vez, el comité debe tener en cuenta que", "f": "Ley 1010 de 2006, art. 7", "o": [["A", "debe remitirse a la Fiscalía para que decida, porque una agresión física es un asunto penal y no de convivencia laboral.", "La agresión física aparece en la propia Ley 1010 de 2006 como conducta constitutiva de acoso (art. 7, lit. a); su posible relevancia penal no impide aplicar también esta ley.", false], ["B", "no puede considerarse acoso, porque la ley exige que la conducta sea persistente y repetida.", "La regla general exige conductas persistentes, pero la ley admite que excepcionalmente un solo acto hostil acredite el acoso.", false], ["C", "puede configurar acoso si, por su gravedad, ofende por sí sola la dignidad o la integridad de la servidora.", "El art. 7 de la Ley 1010 de 2006 dispone que excepcionalmente un solo acto hostil bastará para acreditar el acoso laboral, lo que la autoridad apreciará según la gravedad de la conducta y su capacidad de ofender por sí sola la dignidad, la vida e integridad física y otros derechos fundamentales.", true]]}]}, {"comp": "empleo_publico", "rol": "general", "tag": "Empleo público, carrera y régimen disciplinario · Acoso laboral: sanción, competencia y garantías", "texto": "Una profesional de la Secretaría de la Mujer de un departamento presentó en mayo de 2026 queja por acoso laboral contra su jefe, ambos servidores públicos. Usted, que trabaja en la oficina jurídica, debe responder varias preguntas de la secretaria de despacho: qué consecuencia tendría el acoso si se demuestra, quién es competente para conocer de la falta, hasta cuándo pueden ejercerse las acciones y qué protección tiene la quejosa frente a represalias.", "items": [{"id": "EP-182", "niv": 1, "e": "Si se acredita el acoso laboral, la conducta del jefe se sancionará como", "f": "Ley 1010 de 2006, art. 10", "o": [["A", "falta disciplinaria leve, porque se trata de un conflicto de convivencia entre servidores.", "La Ley 1010 de 2006 no la califica como leve; cuando el autor es servidor público, el acoso acreditado es falta gravísima.", false], ["B", "falta disciplinaria gravísima.", "El art. 10, num. 1, de la Ley 1010 de 2006 establece que el acoso laboral debidamente acreditado se sanciona como falta disciplinaria gravísima cuando su autor es un servidor público.", true], ["C", "contravención de policía, con multa impuesta por el inspector municipal.", "Los inspectores de policía pueden recibir la denuncia como medida preventiva (art. 9), pero la sanción para el servidor autor es la disciplinaria por falta gravísima.", false]]}, {"id": "EP-183", "niv": 2, "e": "Cuando la víctima del acoso es un servidor público, la competencia para conocer de la falta disciplinaria del acosador corresponde", "f": "Ley 1010 de 2006, arts. 12 y 13; Ley 1952 de 2019 (modificada por la Ley 2094 de 2021)", "o": [["A", "al juez laboral del lugar de los hechos.", "Los jueces de trabajo son competentes cuando las víctimas son trabajadores o empleados particulares, no cuando la víctima es servidora pública.", false], ["B", "al inspector de trabajo, que impone directamente la sanción de destitución al servidor que cometió el acoso.", "El inspector de trabajo puede recibir la denuncia a prevención para medidas preventivas, pero no impone sanciones disciplinarias a servidores públicos.", false], ["C", "al Ministerio Público y a las demás autoridades disciplinarias competentes según la ley.", "El art. 12 de la Ley 1010 de 2006 atribuye la competencia al Ministerio Público o a las autoridades disciplinarias judiciales «conforme a las competencias que señala la ley», y el art. 13 remite al procedimiento del Código Disciplinario. Hoy las antiguas salas jurisdiccionales disciplinarias fueron reemplazadas por las Comisiones de Disciplina Judicial, y según la Ley 1952 de 2019 también conocen las oficinas de control disciplinario interno, sin perjuicio del poder preferente de la Procuraduría.", true]]}, {"id": "EP-184", "niv": 3, "e": "Las acciones derivadas del acoso laboral caducan en", "f": "Ley 1010 de 2006, art. 18 (modificado por el art. 1 de la Ley 2209 de 2022)", "o": [["A", "seis meses contados desde la ocurrencia de las conductas.", "Ese era el término original del art. 18 de la Ley 1010 de 2006; la Ley 2209 de 2022 lo amplió a tres años.", false], ["B", "tres años contados desde la ocurrencia de las conductas.", "El art. 18 de la Ley 1010 de 2006, modificado por el art. 1 de la Ley 2209 de 2022, dispone que las acciones derivadas del acoso laboral caducan en tres años a partir de la fecha en que ocurrieron las conductas.", true], ["C", "cinco años contados desde la presentación de la queja.", "Cinco años es el término general de prescripción de la acción disciplinaria del art. 33 de la Ley 1952 de 2019; la caducidad de las acciones de la Ley 1010 de 2006 es de tres años y se cuenta desde las conductas.", false]]}, {"id": "EP-185", "niv": 3, "e": "Si en agosto de 2026 la entidad destituye a la quejosa, y la autoridad competente verifica la ocurrencia de los hechos denunciados, esa decisión", "f": "Ley 1010 de 2006, art. 11", "o": [["A", "carecerá de todo efecto, porque se produjo dentro de los seis meses siguientes a la queja.", "El art. 11, num. 1, de la Ley 1010 de 2006 dispone que la destitución de la víctima que haya ejercido los procedimientos de la ley carece de todo efecto cuando se produce dentro de los seis meses siguientes a la queja, siempre que la autoridad competente verifique la ocurrencia de los hechos.", true], ["B", "será válida, porque la queja de acoso no limita la potestad del nominador.", "La ley establece una garantía contra represalias: la destitución de la víctima dentro de los seis meses siguientes a la queja carece de efecto si se verifican los hechos.", false], ["C", "solo podrá revisarse si la quejosa demuestra que la destitución fue motivada por la queja.", "La garantía legal opera por el hecho objetivo de que la destitución se produzca dentro de los seis meses siguientes a la queja y se verifiquen los hechos.", false]]}]}, {"comp": "empleo_publico", "rol": "profesional", "tag": "Empleo público, carrera y régimen disciplinario · Nivel profesional · Conflicto de intereses e impedimentos", "texto": "Usted es profesional universitario de la subdirección de autoridad ambiental de una corporación autónoma regional de Santander y le asignan sustanciar la solicitud de concesión de aguas superficiales de una finca. Al revisar el expediente, el 9 de febrero de 2026 descubre que el solicitante es su primo hermano, hijo de un hermano de su madre. Usted no ha emitido ningún concepto en el trámite y quiere actuar conforme a la ley.", "items": [{"id": "EP-186", "niv": 2, "e": "Frente a este hallazgo, usted debe", "f": "Ley 1437 de 2011, art. 11, num. 1; Ley 1952 de 2019, art. 44", "o": [["A", "informar verbalmente a su jefe y seguir sustanciando, porque solo debe apartarse si emite la decisión final.", "El impedimento cubre a quien sustancia actuaciones, practica pruebas o adopta decisiones; además debe manifestarse por escrito motivado, no de manera verbal.", false], ["B", "continuar el trámite con especial rigor, porque el parentesco con primos no genera impedimento.", "Los primos hermanos son parientes en cuarto grado de consanguinidad, dentro del límite que fijan la Ley 1437 de 2011 y la Ley 1952 de 2019 para el impedimento.", false], ["C", "declararse impedido, porque su primo es pariente dentro del cuarto grado de consanguinidad y tiene interés directo en la decisión.", "El art. 11, num. 1, de la Ley 1437 de 2011 y el art. 44 de la Ley 1952 de 2019 obligan al servidor a declararse impedido cuando él o sus parientes dentro del cuarto grado de consanguinidad tengan interés particular y directo en el asunto; el primo hermano es pariente en cuarto grado.", true]]}, {"id": "EP-187", "niv": 3, "e": "Para tramitar el impedimento, usted debe", "f": "Ley 1437 de 2011, art. 12", "o": [["A", "enviar la actuación con escrito motivado a su superior dentro de los tres días siguientes a conocer la causal.", "El art. 12 de la Ley 1437 de 2011 dispone que, en caso de impedimento, el servidor enviará dentro de los tres días siguientes a su conocimiento la actuación con escrito motivado al superior o, si no lo tuviere, a la cabeza del sector.", true], ["B", "devolver el expediente al solicitante para que lo radique de nuevo cuando le asignen otro sustanciador.", "El trámite del impedimento es interno: la actuación se remite al superior; no se devuelve al solicitante.", false], ["C", "remitir la actuación a la Procuraduría General de la Nación dentro de los diez días siguientes, para que designe un funcionario ad hoc.", "El servidor remite primero a su superior; la Procuraduría solo interviene a falta de superior y de cabeza de sector, y diez días es el plazo para decidir, no para remitir.", false]]}, {"id": "EP-188", "niv": 3, "e": "Mientras su superior resuelve el impedimento, el trámite de la concesión", "f": "Ley 1437 de 2011, art. 12", "o": [["A", "sigue corriendo normalmente, porque el impedimento no afecta los términos de la actuación.", "La ley dispone lo contrario: la actuación se suspende desde la manifestación del impedimento hasta que se decida.", false], ["B", "se archiva, y el solicitante deberá presentar una nueva solicitud.", "El impedimento no da lugar al archivo; la autoridad que lo acepta determina a quién corresponde el asunto y ordena entregar el expediente.", false], ["C", "se suspende hasta la decisión, que el superior debe adoptar de plano dentro de los diez días siguientes al recibo.", "El art. 12 de la Ley 1437 de 2011 establece que la autoridad competente decide de plano el impedimento dentro de los diez días siguientes a su recibo y que la actuación se suspende desde la manifestación del impedimento hasta cuando se decida.", true]]}]}, {"comp": "empleo_publico", "rol": "tecnico", "tag": "Empleo público, carrera y régimen disciplinario · Nivel técnico · Recusación y conflicto de intereses", "texto": "Usted es técnico administrativo de la Secretaría de Tránsito de un municipio y le corresponde practicar pruebas en una actuación administrativa sancionatoria. El apoderado del investigado presentó un escrito en el que lo recusa por tener «amistad entrañable» con el denunciante, con quien usted comparte desde hace años reuniones familiares. Usted reconoce que esa amistad existe y que no había manifestado el impedimento.", "items": [{"id": "EP-189", "niv": 3, "e": "Ante la recusación presentada por el apoderado, usted debe manifestar si acepta o no la causal", "f": "Ley 1437 de 2011, art. 12", "o": [["A", "dentro de los tres días siguientes a la formulación de la recusación.", "Tres días es el término para que el servidor que advierte un impedimento envíe la actuación al superior; para responder una recusación el término es de cinco días.", false], ["B", "dentro de los cinco días siguientes a la formulación de la recusación.", "El art. 12 de la Ley 1437 de 2011 dispone que, presentada una recusación, el recusado manifestará si acepta o no la causal invocada dentro de los cinco días siguientes a su formulación; vencido ese término se sigue el trámite del impedimento.", true], ["C", "dentro de los diez días hábiles siguientes a la formulación de la recusación.", "Diez días es el plazo que tiene el superior para decidir de plano sobre el impedimento, no el del recusado para pronunciarse.", false]]}, {"id": "EP-190", "niv": 1, "e": "La causal que invoca el apoderado", "f": "Ley 1437 de 2011, art. 11, num. 8", "o": [["A", "está prevista en la ley, porque la amistad entrañable con un interesado es causal de impedimento y recusación.", "El art. 11, num. 8, de la Ley 1437 de 2011 incluye como causal de impedimento y recusación la amistad entrañable entre el servidor y alguna de las personas interesadas en la actuación administrativa.", true], ["B", "no está prevista en la ley, porque solo el parentesco o el matrimonio generan impedimento para los servidores públicos.", "Las causales del art. 11 de la Ley 1437 de 2011 no se limitan al parentesco; incluyen, entre otras, la enemistad grave y la amistad entrañable.", false], ["C", "solo procede si la amistad está registrada en el formato de conflictos de interés de la entidad.", "La causal depende de la existencia de la amistad entrañable, no de que esté registrada en un formato.", false]]}, {"id": "EP-191", "niv": 2, "e": "Si usted siguiera practicando las pruebas a pesar de la causal, se expondría a responder disciplinariamente por", "f": "Ley 1952 de 2019, art. 56, num. 1", "o": [["A", "ninguna falta, porque la recusación ya trasladó la responsabilidad al apoderado que la formuló en el proceso.", "La recusación no traslada responsabilidad alguna; el servidor sigue obligado a apartarse si la causal existe, y actuar pese a ella es falta gravísima.", false], ["B", "una falta gravísima, por actuar a pesar de la existencia de una causal de conflicto de intereses.", "El art. 56, num. 1, de la Ley 1952 de 2019 describe como falta gravísima actuar u omitir a pesar de la existencia de causales de incompatibilidad, inhabilidad y conflicto de intereses.", true], ["C", "una falta leve, porque la actuación administrativa aún no ha terminado con una decisión.", "La ley no condiciona la falta a que exista decisión final; actuar pese al conflicto de intereses está descrito como falta gravísima.", false]]}]}, {"comp": "empleo_publico", "rol": "general", "tag": "Empleo público, carrera y régimen disciplinario · Código de Integridad del Servicio Público", "texto": "La gestora de integridad de una alcaldía local de Bogotá prepara una jornada de apropiación del Código de Integridad. Recoge tres situaciones para discutir: una auxiliar que organiza su trabajo para resolver con prontitud los trámites, evita reprocesos y cuida los insumos de la oficina; un técnico que aplica exactamente los mismos criterios a todas las solicitudes de ayudas humanitarias, sin importar la afinidad política o la cercanía de los solicitantes; y un contratista de prestación de servicios que pregunta si también debe asistir a la inducción sobre el código.", "items": [{"id": "EP-192", "niv": 1, "e": "La conducta de la auxiliar refleja principalmente el valor de", "f": "Código de Integridad del Servicio Público (Función Pública), adoptado por la Ley 2016 de 2020", "o": [["A", "el respeto.", "El respeto se refiere al trato digno a todas las personas; el caso describe la forma eficiente y cuidadosa de cumplir las tareas.", false], ["B", "la honestidad.", "La honestidad se relaciona con actuar con fundamento en la verdad, con transparencia y rectitud; el caso resalta la prontitud, la eficiencia y el buen uso de los recursos.", false], ["C", "la diligencia.", "En el Código de Integridad del Servicio Público, la diligencia consiste en cumplir los deberes y funciones de la mejor manera posible, con atención, prontitud, destreza y eficiencia, para optimizar el uso de los recursos del Estado, como hace la auxiliar.", true]]}, {"id": "EP-193", "niv": 2, "e": "La conducta del técnico refleja principalmente el valor de", "f": "Código de Integridad del Servicio Público (Función Pública), adoptado por la Ley 2016 de 2020", "o": [["A", "la justicia.", "En el Código de Integridad, la justicia implica actuar con imparcialidad, garantizando los derechos de las personas con equidad, igualdad y sin discriminación, que es lo que hace el técnico al aplicar los mismos criterios a todos.", true], ["B", "la diligencia.", "La diligencia se refiere a la prontitud y eficiencia en el uso de los recursos; el caso resalta que el técnico decide sin favorecer a nadie.", false], ["C", "el compromiso.", "El compromiso se refiere a la disposición permanente para comprender y resolver las necesidades de las personas; el rasgo central del caso es la imparcialidad en la aplicación de criterios.", false]]}, {"id": "EP-194", "niv": 2, "e": "Al contratista de prestación de servicios, la gestora le responde que", "f": "Ley 2016 de 2020, art. 1", "o": [["A", "no debe asistir, porque el Código de Integridad solo obliga a los empleados de carrera administrativa.", "La Ley 2016 de 2020 no limita el código a los empleados de carrera; su implementación incluye la inducción obligatoria para cualquier cargo del Estado y en cualquier modalidad contractual.", false], ["B", "sí debe asistir, porque la implementación del código incluye la capacitación obligatoria de inducción en cualquier modalidad contractual.", "El parágrafo del art. 1 de la Ley 2016 de 2020 entiende por implementación del Código de Integridad, entre otros, la capacitación obligatoria de inducción para cualquier cargo del Estado y en cualquier modalidad contractual.", true], ["C", "puede asistir de forma voluntaria, porque la ley deja a cada entidad la decisión de aplicar el código.", "La Ley 2016 de 2020 ordena a todas las entidades adoptar e implementar el código; las entidades pueden complementarlo, pero no decidir si lo aplican.", false]]}]}, {"comp": "empleo_publico", "rol": "general", "tag": "Empleo público, carrera y régimen disciplinario · Niveles jerárquicos de los empleos", "texto": "Una gobernación ajusta su manual específico de funciones. Usted, servidor de la Dirección de Talento Humano, debe clasificar tres empleos según la naturaleza general de sus funciones: uno cuyo titular opera los equipos del laboratorio de calidad del agua y desarrolla los procedimientos técnicos de muestreo; otro cuyo titular aplica los conocimientos de su carrera profesional en el área de presupuesto y coordina un grupo interno de trabajo encargado de ejecutar un programa; y la directora pide primero recordar cuáles son los niveles jerárquicos que aplican a las entidades territoriales.", "items": [{"id": "EP-195", "niv": 1, "e": "Los niveles jerárquicos de los empleos de las entidades territoriales son", "f": "Decreto Ley 785 de 2005, art. 3", "o": [["A", "directivo, ejecutivo, profesional, técnico y operativo.", "El nivel ejecutivo y el operativo no figuran en la clasificación vigente del Decreto Ley 785 de 2005; los niveles son directivo, asesor, profesional, técnico y asistencial.", false], ["B", "directivo, profesional, tecnológico, técnico y auxiliar.", "Los niveles tecnológico y auxiliar no existen en el Decreto Ley 785 de 2005; la clasificación incluye los niveles asesor y asistencial.", false], ["C", "directivo, asesor, profesional, técnico y asistencial.", "El art. 3 del Decreto Ley 785 de 2005 clasifica los empleos de las entidades territoriales, según la naturaleza de sus funciones, las competencias y los requisitos, en los niveles directivo, asesor, profesional, técnico y asistencial.", true]]}, {"id": "EP-196", "niv": 1, "e": "El empleo de quien opera los equipos del laboratorio y desarrolla los procedimientos de muestreo corresponde al nivel", "f": "Decreto Ley 785 de 2005, art. 4", "o": [["A", "técnico.", "El art. 4 del Decreto Ley 785 de 2005 ubica en el nivel técnico los empleos cuyas funciones exigen desarrollar procesos y procedimientos en labores técnicas misionales y de apoyo, y las relacionadas con la aplicación de la ciencia y la tecnología.", true], ["B", "asesor.", "El nivel asesor asiste y aconseja directamente a los empleados del nivel directivo; no corresponde a la operación técnica de equipos de laboratorio.", false], ["C", "asistencial.", "El nivel asistencial agrupa labores de apoyo y complemento de los niveles superiores; el empleo descrito desarrolla procesos técnicos misionales con aplicación de tecnología.", false]]}, {"id": "EP-197", "niv": 2, "e": "El empleo de quien aplica su carrera profesional en presupuesto y coordina un grupo interno corresponde al nivel", "f": "Decreto Ley 785 de 2005, art. 4", "o": [["A", "profesional, porque aplica conocimientos de una carrera profesional y puede tener funciones de coordinación de áreas internas.", "El art. 4 del Decreto Ley 785 de 2005 describe el nivel profesional como el que demanda la aplicación de conocimientos de una carrera profesional y al que, según su complejidad, pueden corresponder funciones de coordinación, supervisión y control de áreas internas.", true], ["B", "directivo, porque coordinar un grupo de trabajo equivale a dirigir la entidad.", "El nivel directivo comprende funciones de dirección general, formulación de políticas y adopción de planes; coordinar un grupo interno es compatible con el nivel profesional.", false], ["C", "asesor, porque toda función relacionada con el presupuesto implica asesorar al gobernador.", "El nivel asesor asiste y aconseja directamente a los empleados del nivel directivo; manejar el presupuesto y coordinar un grupo interno no lo convierte en asesor.", false]]}]}, {"comp": "empleo_publico", "rol": "general", "tag": "Empleo público, carrera y régimen disciplinario · Declaración de bienes y rentas y registro de conflictos de interés", "texto": "Usted trabaja en la oficina de talento humano de una corporación autónoma regional. El consejo directivo designó a un nuevo director general, que se posesionará la próxima semana. Al mismo tiempo, un técnico administrativo de planta pregunta qué obligaciones tiene sobre su declaración de bienes y rentas. Y la jefe de la oficina le pide aclarar qué debe hacer el director si, ya posesionado, compra un inmueble y adquiere participación en una sociedad.", "items": [{"id": "EP-198", "niv": 1, "e": "Al técnico administrativo usted le explica que la declaración juramentada de bienes y rentas", "f": "Ley 190 de 1995, art. 13", "o": [["A", "solo la presentan los servidores de libre nombramiento y remoción que manejan recursos.", "La obligación de la Ley 190 de 1995 se predica de quien es nombrado para un cargo público, sin limitarla a los de libre nombramiento o a quienes manejan recursos.", false], ["B", "es requisito para posesionarse y desempeñar el cargo, y debe actualizarse cada año y al retirarse.", "El art. 13 de la Ley 190 de 1995 establece la declaración juramentada de bienes y rentas como requisito para la posesión y el desempeño del cargo, y ordena actualizarla cada año y, en todo caso, al momento del retiro.", true], ["C", "solo se presenta una vez, al momento de posesionarse, y no requiere actualizaciones posteriores mientras se ejerza el cargo.", "La Ley 190 de 1995 exige actualizar la información cada año y al momento del retiro, no solo al posesionarse.", false]]}, {"id": "EP-199", "niv": 3, "e": "Sobre el nuevo director general, usted le informa a la jefe que, por la Ley 2013 de 2019, para posesionarse debe", "f": "Ley 2013 de 2019, arts. 2 y 3", "o": [["A", "entregar en sobre cerrado su declaración de renta a la Contraloría, que la mantendrá bajo reserva.", "La Ley 2013 de 2019 busca lo contrario de la reserva: la publicación y divulgación proactiva de esa información, mediante su registro en el SIGEP.", false], ["B", "presentar solo la declaración de bienes y rentas de la Ley 190 de 1995, porque la Ley 2013 aplica únicamente a cargos de elección popular.", "La Ley 2013 de 2019 no se limita a los cargos de elección popular: incluye a quienes ejercen cargos directivos y gerenciales y a la dirección de las CAR.", false], ["C", "publicar en el SIGEP su declaración de bienes y rentas, su registro de conflictos de interés y copia de su declaración de renta.", "La Ley 2013 de 2019 incluye entre los sujetos obligados a quienes ejercen cargos directivos y gerenciales en el Estado y a quienes dirigen las CAR (art. 2), exige la publicación como requisito para posesionarse, ejercer y retirarse del cargo (par. 1) y ordena registrarla en el SIGEP (art. 3).", true]]}, {"id": "EP-200", "niv": 3, "e": "Si el director, ya posesionado, compra un inmueble y adquiere participación en una sociedad, deberá", "f": "Ley 2013 de 2019, art. 3", "o": [["A", "comunicar el cambio a la entidad y registrarlo dentro de los dos meses siguientes.", "El art. 3 de la Ley 2013 de 2019 dispone que todo cambio que modifique la información de la declaración de bienes y rentas y del registro de conflictos de interés debe comunicarse a la entidad y registrarse dentro de los dos meses siguientes al cambio.", true], ["B", "reportar los cambios solo al momento de su retiro, porque es cuando se cierra la declaración.", "La ley no aplaza el reporte hasta el retiro: los cambios deben registrarse dentro de los dos meses siguientes.", false], ["C", "esperar a la actualización anual para reportar ambos cambios en una sola declaración.", "Además de la actualización anual, la ley exige reportar los cambios dentro de los dos meses siguientes a su ocurrencia; no basta esperar a la actualización anual.", false]]}]}, {"comp": "atencion_procedimiento", "rol": "asistencial", "tag": "Atención al ciudadano y procedimiento administrativo · Nivel asistencial · Derecho de petición", "texto": "Usted es auxiliar administrativo de la ventanilla única de correspondencia de la alcaldía de un municipio de sexta categoría. Un martes en la mañana llega un adulto mayor que no sabe escribir y le pide de palabra que la alcaldía repare la baranda del puente peatonal de su vereda; la alcaldía no ha establecido que ese tipo de solicitudes deba presentarse por escrito. Minutos después, una ciudadana entrega una solicitud escrita de inscripción en un programa municipal de vivienda, pero no adjunta el certificado de ingresos que exige el reglamento del programa, y le pide que de todas formas se la reciba. Por último, un comerciante que tramita un permiso ante la alcaldía protesta porque le exigen el paz y salvo del impuesto predial, que expide la misma Secretaría de Hacienda municipal.", "items": [{"id": "AP-101", "niv": 1, "e": "Frente a la solicitud del adulto mayor, a usted le corresponde", "f": "Ley 1755 de 2015, art. 1 (arts. 13 y 15 de la Ley 1437 de 2011); Decreto 1069 de 2015, art. 2.2.3.12.3 (adicionado por el Decreto 1166 de 2016)", "o": [["A", "orientarlo para que acuda a la personería municipal, encargada de recibir las peticiones de quienes no saben escribir.", "La personería recibe peticiones en sustitución de las autoridades solo cuando estas se han abstenido de recibirlas (art. 23 del CPACA). La alcaldía es la competente y está obligada a recibir y radicar la petición verbal.", false], ["B", "recibir la petición de forma verbal, dejar constancia de ella y radicarla.", "El artículo 15 del CPACA, sustituido por la Ley 1755 de 2015, permite presentar peticiones verbalmente, caso en el cual debe quedar constancia. El Decreto 1166 de 2016 (compilado en el Decreto 1069 de 2015) ordena radicar de inmediato esa constancia. Como la alcaldía no ha exigido la forma escrita para este asunto, la petición verbal es válida.", true], ["C", "pedirle que regrese con un familiar que le ayude a redactar la solicitud, porque las peticiones sobre obras deben presentarse por escrito.", "Ninguna norma exige la forma escrita para este tipo de solicitud y el caso aclara que la alcaldía no la ha establecido. Exigirla al adulto mayor desconoce el derecho a presentar peticiones verbales (art. 15 del CPACA) y su derecho a atención preferente (art. 5, num. 6).", false]]}, {"id": "AP-102", "niv": 2, "e": "Ante la insistencia de la ciudadana en que se radique la solicitud sin el certificado de ingresos, usted debe", "f": "Ley 1755 de 2015, art. 1 (art. 15 de la Ley 1437 de 2011, incisos 2 y 3 y parágrafo 2)", "o": [["A", "abstenerse de radicarla hasta que aporte el certificado, porque una solicitud sin los requisitos del reglamento no puede ingresar al sistema.", "Contradice el parágrafo 2 del artículo 15 del CPACA, según el cual ninguna autoridad puede negarse a recibir y radicar peticiones respetuosas. La falta de un documento se maneja indicándolo en el recibo y, si es del caso, con el requerimiento del artículo 17.", false], ["B", "radicarla y devolvérsela al día siguiente con la anotación de que se tiene por no presentada.", "La ley no permite tener por no presentada una petición incompleta ni devolverla por esa razón (art. 19 del CPACA). Si falta un documento necesario, procede el requerimiento del artículo 17 para que la complete.", false], ["C", "indicarle en ese momento el documento que falta y, si insiste, radicar la solicitud dejando constancia del requisito faltante.", "El artículo 15 del CPACA dispone que, cuando la petición no se acompaña de los documentos exigidos, en el acto de recibo se indican los que faltan y, si el peticionario insiste, se radica dejando constancia de ello. Además, ninguna autoridad puede negarse a recibir y radicar peticiones respetuosas.", true]]}, {"id": "AP-103", "niv": 2, "e": "Sobre la queja del comerciante por la exigencia del paz y salvo predial, lo procedente es explicarle que", "f": "Decreto Ley 019 de 2012, art. 9; Ley 1437 de 2011, art. 9, num. 4; Ley 1755 de 2015, art. 1 (art. 16, parágrafo 1)", "o": [["A", "la alcaldía no puede exigirle ese documento, porque es una certificación que ya reposa en la propia entidad.", "El artículo 9 del Decreto Ley 019 de 2012 prohíbe exigir constancias, certificaciones o documentos que ya reposen en la entidad ante la cual se adelanta el trámite, y el artículo 9, numeral 4, del CPACA lo prohíbe a las autoridades. La Secretaría de Hacienda hace parte de la misma alcaldía.", true], ["B", "el paz y salvo sí es exigible, porque lo expide una dependencia distinta de la que tramita el permiso.", "La prohibición se refiere a documentos que reposan en la entidad, no en la misma dependencia. Las secretarías son dependencias de la alcaldía, de modo que la información está en poder de la entidad que adelanta el trámite.", false], ["C", "puede reemplazar el paz y salvo por una declaración extrajuicio en la que afirme estar al día con el impuesto.", "El artículo 7 del Decreto Ley 019 de 2012 prohíbe exigir declaraciones extrajuicio en los trámites, y en este caso no hay nada que reemplazar: la entidad debe verificar la información que ya tiene en sus archivos.", false]]}]}, {"comp": "atencion_procedimiento", "rol": "tecnico", "tag": "Atención al ciudadano y procedimiento administrativo · Nivel técnico · Derecho de petición: términos", "texto": "Usted es técnico administrativo de la oficina de archivo de la Secretaría de Hacienda de un departamento. El miércoles 10 de marzo de 2027 se radicó por correo electrónico la petición de un veedor ciudadano que solicita copia de los contratos de arrendamiento de bienes del departamento suscritos en 2026. La entidad atiende de lunes a viernes. En ese periodo son festivos el lunes 22 de marzo y el jueves 25 y el viernes 26 de marzo (Semana Santa); no hay otros festivos. Su jefe le pide revisar el término de respuesta y los efectos de no contestar a tiempo.", "items": [{"id": "AP-104", "niv": 1, "e": "Por su objeto, esta petición debe resolverse dentro de los", "f": "Ley 1755 de 2015, art. 1 (art. 14, num. 1, de la Ley 1437 de 2011)", "o": [["A", "diez (10) días hábiles siguientes a su recepción.", "La solicitud de copias es una petición de documentos, que según el numeral 1 del artículo 14 del CPACA debe resolverse dentro de los diez días siguientes a su recepción. Los términos de días en la ley se cuentan en días hábiles.", true], ["B", "quince (15) días hábiles siguientes a su recepción.", "Ese es el término general del artículo 14 del CPACA. Las peticiones de documentos y de información tienen un término especial más corto, de diez días.", false], ["C", "treinta (30) días hábiles siguientes a su recepción.", "Ese término corresponde a las consultas que se elevan a las autoridades sobre materias a su cargo (art. 14, num. 2). El veedor no consulta un criterio: pide copia de documentos.", false]]}, {"id": "AP-105", "niv": 3, "e": "El último día para responder oportunamente la petición del veedor es el", "f": "Ley 1755 de 2015, art. 1 (art. 14, num. 1, de la Ley 1437 de 2011); cálculo de días hábiles", "o": [["A", "jueves 25 de marzo de 2027.", "Resulta de descontar solo el festivo del 22 de marzo y contar el jueves 25 como hábil. El jueves y el viernes santos son festivos, por lo que no se cuentan.", false], ["B", "lunes 29 de marzo de 2027.", "El término empieza el día siguiente a la recepción. Días hábiles: 11 y 12 de marzo (2), 15 a 19 (7), 23 y 24 (9) y lunes 29 (10). Se excluyen los fines de semana y los festivos del 22, 25 y 26 de marzo.", true], ["C", "jueves 1 de abril de 2027.", "Suma al término de respuesta los tres días que la ley da para entregar las copias cuando la petición se entiende aceptada por no responder. Ese plazo adicional no amplía el término para contestar.", false]]}, {"id": "AP-106", "niv": 2, "e": "Si la Secretaría deja vencer el término sin responder, la consecuencia prevista en la ley es que", "f": "Ley 1755 de 2015, art. 1 (art. 14, num. 1 y parágrafo, de la Ley 1437 de 2011)", "o": [["A", "se configura el silencio administrativo negativo y el veedor puede demandar el acto presunto ante la jurisdicción.", "El silencio negativo del artículo 83 del CPACA se produce a los tres meses sin decisión. Para las peticiones de documentos la ley previó una consecuencia especial y favorable al peticionario: la aceptación.", false], ["B", "el término se amplía automáticamente hasta el doble, siempre que se deje constancia del motivo de la demora en el expediente.", "La ampliación del parágrafo del artículo 14 no es automática: la entidad debe informar al interesado antes del vencimiento, con los motivos y el nuevo plazo. Una constancia interna posterior no la sustituye.", false], ["C", "la solicitud se entiende aceptada, la entidad ya no puede negar la entrega y debe dar las copias dentro de los tres días siguientes.", "El numeral 1 del artículo 14 del CPACA prevé que, si la petición de documentos no se responde en diez días, se entiende aceptada para todos los efectos legales, la administración ya no puede negar la entrega y las copias se entregan dentro de los tres días siguientes.", true]]}]}, {"comp": "atencion_procedimiento", "rol": "profesional", "tag": "Atención al ciudadano y procedimiento administrativo · Nivel profesional · Derecho de petición: consultas", "texto": "Usted es profesional universitario de la oficina jurídica de una corporación autónoma regional de la región Andina. Una asociación de acueductos veredales eleva una consulta para que la corporación explique si los acueductos comunitarios que captan pequeños caudales requieren concesión de aguas. Por la necesidad de revisar conceptos técnicos de la Subdirección de Gestión Ambiental, la respuesta no estará lista dentro del plazo legal. La asociación anuncia además que, si el concepto le es favorable, lo presentará como una decisión de obligatorio cumplimiento ante cualquier autoridad que le exija el trámite.", "items": [{"id": "AP-107", "niv": 1, "e": "El término legal para resolver esta consulta es de", "f": "Ley 1755 de 2015, art. 1 (art. 14, num. 2, de la Ley 1437 de 2011)", "o": [["A", "diez (10) días hábiles siguientes a su recepción.", "Es el término de las peticiones de documentos y de información. La asociación no pide documentos: pide el criterio de la corporación sobre una materia a su cargo.", false], ["B", "quince (15) días hábiles siguientes a su recepción.", "Es el término general. Las consultas tienen un término especial en el numeral 2 del artículo 14 del CPACA.", false], ["C", "treinta (30) días hábiles siguientes a su recepción.", "Las peticiones mediante las cuales se eleva una consulta a las autoridades sobre materias a su cargo deben resolverse dentro de los treinta días siguientes a su recepción (art. 14, num. 2, del CPACA).", true]]}, {"id": "AP-108", "niv": 2, "e": "Como la respuesta no estará lista a tiempo, a usted le corresponde proyectar un oficio que", "f": "Ley 1755 de 2015, art. 1 (art. 14, parágrafo, de la Ley 1437 de 2011)", "o": [["A", "informe a la asociación, dentro de los cinco días siguientes al vencimiento, los motivos de la demora y la nueva fecha de respuesta.", "El parágrafo del artículo 14 exige informar antes del vencimiento del término legal. Una comunicación posterior no evita el incumplimiento del plazo.", false], ["B", "informe a la asociación, antes de que venza el término, los motivos de la demora y el plazo razonable de respuesta, que no podrá exceder el doble del inicial.", "Así lo exige el parágrafo del artículo 14 del CPACA cuando excepcionalmente no es posible resolver en el plazo: informar antes del vencimiento, expresar los motivos de la demora y señalar un plazo razonable que no exceda el doble del inicialmente previsto.", true], ["C", "traslade la consulta a la Subdirección de Gestión Ambiental para que responda directamente con un nuevo término.", "El traslado del artículo 21 opera cuando la autoridad no es competente y se remite a otra autoridad. Pasar la consulta a otra dependencia de la misma corporación no reinicia el término ni releva a la entidad de responder.", false]]}, {"id": "AP-109", "niv": 2, "e": "Frente al uso que la asociación anuncia dar al concepto, es acertado advertirle que", "f": "Ley 1755 de 2015, art. 1 (art. 28 de la Ley 1437 de 2011)", "o": [["A", "el concepto solo será obligatorio si la asociación lo protocoliza en una notaría junto con la consulta inicial.", "Confunde el concepto con el procedimiento para invocar el silencio positivo (art. 85 del CPACA). La protocolización no le da fuerza obligatoria a un concepto.", false], ["B", "salvo disposición legal en contrario, los conceptos que responden consultas no son de obligatorio cumplimiento.", "El artículo 28 del CPACA establece que, salvo disposición legal en contrario, los conceptos emitidos como respuesta a consultas no son de obligatorio cumplimiento o ejecución. Orientan, pero no obligan a otras autoridades.", true], ["C", "el concepto obliga a las demás autoridades ambientales una vez queda en firme, por ser un acto administrativo definitivo.", "El concepto que responde una consulta no decide una actuación ni crea situaciones jurídicas; por eso la ley le niega, como regla general, fuerza obligatoria.", false]]}]}, {"comp": "atencion_procedimiento", "rol": "general", "tag": "Atención al ciudadano y procedimiento administrativo · Derecho de petición: falta de competencia", "texto": "Usted trabaja en la Secretaría de Gobierno de un municipio de cuarta categoría. El jueves 18 de marzo de 2027 se recibió por escrito la petición de un ciudadano que solicita a la alcaldía el reconocimiento de su pensión de vejez, que administra Colpensiones, entidad del orden nacional. La alcaldía no tiene ninguna competencia en el asunto. La alcaldía atiende de lunes a viernes y en ese periodo son festivos el lunes 22 de marzo y el jueves 25 y el viernes 26 de marzo de 2027; no hay otros festivos.", "items": [{"id": "AP-110", "niv": 1, "e": "La actuación que corresponde a la Secretaría frente a esta petición es", "f": "Ley 1755 de 2015, art. 1 (art. 21 de la Ley 1437 de 2011)", "o": [["A", "devolverle el escrito al ciudadano para que lo radique directamente ante la entidad competente.", "La ley no autoriza devolver la petición. La carga de remitirla al competente es de la autoridad que la recibió (art. 21 del CPACA).", false], ["B", "responderla de fondo explicando los requisitos para pensionarse, porque la autoridad que recibe una petición debe resolverla.", "La alcaldía no puede decidir sobre una pensión que no administra. La ley prevé para este evento la remisión al competente, no una respuesta de fondo de quien carece de competencia.", false], ["C", "remitirla a Colpensiones, informar al ciudadano la falta de competencia y enviarle copia del oficio remisorio.", "El artículo 21 del CPACA ordena que, si la autoridad no es competente, informe al interesado y remita la petición al competente, enviando copia del oficio remisorio al peticionario.", true]]}, {"id": "AP-111", "niv": 3, "e": "Como la petición se presentó por escrito, el último día que tiene la Secretaría para informar al ciudadano y remitir la solicitud es el", "f": "Ley 1755 de 2015, art. 1 (art. 21 de la Ley 1437 de 2011); cálculo de días hábiles", "o": [["A", "martes 23 de marzo de 2027.", "Resulta de contar cinco días calendario (19 a 23 de marzo). El término es de días hábiles, por lo que se excluyen fines de semana y festivos.", false], ["B", "lunes 29 de marzo de 2027.", "Resulta de contar el mismo día de la recepción como primer día. El término de cinco días se cuenta a partir del día siguiente al de la recepción.", false], ["C", "martes 30 de marzo de 2027.", "Si se obró por escrito, el plazo es de cinco días siguientes a la recepción: 19 de marzo (1), 23 (2), 24 (3), 29 (4) y 30 (5). Se excluyen el fin de semana y los festivos del 22, 25 y 26 de marzo.", true]]}, {"id": "AP-112", "niv": 2, "e": "El término para que Colpensiones resuelva la petición se cuenta a partir", "f": "Ley 1755 de 2015, art. 1 (art. 21 de la Ley 1437 de 2011)", "o": [["A", "del día siguiente a aquel en que Colpensiones reciba la petición.", "El artículo 21 del CPACA dispone que los términos para decidir o responder se cuentan a partir del día siguiente a la recepción de la petición por la autoridad competente.", true], ["B", "del día siguiente a la radicación en la alcaldía, porque la remisión no interrumpe el término inicial.", "La ley fija un punto de partida distinto: la recepción por la autoridad competente. El tiempo que la petición estuvo en la alcaldía no se descuenta del plazo de Colpensiones.", false], ["C", "de la fecha en que el ciudadano reciba la copia del oficio remisorio enviado por la alcaldía.", "La copia del oficio remisorio informa al ciudadano, pero no marca el inicio del término. Este depende de la recepción por la autoridad competente.", false]]}]}, {"comp": "atencion_procedimiento", "rol": "asistencial", "tag": "Atención al ciudadano y procedimiento administrativo · Nivel asistencial · Derecho de petición: peticiones irrespetuosas, oscuras o reiterativas", "texto": "Usted es auxiliar administrativo del punto de atención a la ciudadanía de una secretaría distrital de Bogotá y apoya la clasificación de las peticiones que llegan por el sistema de PQRS. Esta semana recibió tres escritos. En el primero, el peticionario pide información sobre un subsidio, pero dirige insultos graves contra la secretaria del despacho. El segundo es tan confuso que no se logra identificar qué pide ni a qué asunto se refiere. El tercero lo presenta una ciudadana a quien hace dos meses se le negó la inscripción en un programa por no acreditar un requisito; ahora repite la solicitud y adjunta el documento que antes le faltaba.", "items": [{"id": "AP-113", "niv": 1, "e": "Frente al escrito que contiene insultos graves, la ley prevé que", "f": "Ley 1755 de 2015, art. 1 (art. 19 de la Ley 1437 de 2011)", "o": [["A", "la petición puede ser rechazada, porque toda petición debe ser respetuosa.", "El artículo 19 del CPACA, sustituido por la Ley 1755 de 2015, dispone que toda petición debe ser respetuosa so pena de rechazo. Un escrito con insultos graves contra una servidora encaja en ese supuesto.", true], ["B", "se devuelva al peticionario para que, dentro de los diez días siguientes, la presente en términos respetuosos.", "La devolución para corregir o aclarar en diez días está prevista para las peticiones cuya finalidad u objeto no se comprende, no para las irrespetuosas.", false], ["C", "se traslade a la personería, para que la tramite en sustitución de la secretaría por involucrar a la jefa del despacho.", "La personería recibe peticiones en sustitución solo cuando la autoridad se abstiene de recibirlas (art. 23 del CPACA). Que la petición mencione a la secretaria no cambia la competencia.", false]]}, {"id": "AP-114", "niv": 2, "e": "Respecto del escrito confuso, lo procedente es", "f": "Ley 1755 de 2015, art. 1 (arts. 17 y 19 de la Ley 1437 de 2011)", "o": [["A", "rechazarlo de plano, porque una petición cuyo objeto no se comprende carece de los requisitos mínimos.", "El artículo 19 no autoriza el rechazo de las peticiones oscuras. Ordena devolverlas para que se aclaren y solo las archiva si no se corrigen.", false], ["B", "devolverlo al interesado para que lo corrija o aclare dentro de los diez días siguientes y, si no lo hace, archivarlo.", "El artículo 19 del CPACA establece que, cuando no se comprenda la finalidad u objeto de la petición, esta se devuelve al interesado para que la corrija o aclare dentro de los diez días siguientes; si no lo hace, se archiva.", true], ["C", "requerir al peticionario para que la complete en un plazo máximo de un mes, so pena de decretar el desistimiento tácito.", "El requerimiento del artículo 17 aplica a peticiones incompletas o que exigen una gestión del peticionario, cuyo objeto sí se entiende. Para las peticiones oscuras la regla es la del artículo 19.", false]]}, {"id": "AP-115", "niv": 3, "e": "En relación con la nueva solicitud de la ciudadana, la secretaría debe", "f": "Ley 1755 de 2015, art. 1 (art. 19, inciso 2, de la Ley 1437 de 2011)", "o": [["A", "rechazarla, porque contra la negativa anterior procedían recursos que la ciudadana no interpuso.", "No interponer recursos contra la primera decisión no impide presentar una nueva petición con los requisitos completos. La ley prevé expresamente que se resuelva cuando se subsana.", false], ["B", "estudiarla y resolverla de fondo, porque la petición negada por falta de un requisito ahora viene subsanada.", "El inciso 2 del artículo 19 del CPACA permite remitirse a respuestas anteriores frente a peticiones reiterativas, salvo que se trate de derechos imprescriptibles o de peticiones negadas por no acreditar requisitos que se subsanan en la nueva petición.", true], ["C", "remitirse a la respuesta anterior, porque se trata de una petición reiterativa sobre un asunto ya resuelto.", "La remisión a respuestas anteriores tiene excepciones. Una de ellas es la petición que se negó por no acreditar requisitos, cuando en la nueva petición se subsanan; ese es el caso.", false]]}]}, {"comp": "atencion_procedimiento", "rol": "tecnico", "tag": "Atención al ciudadano y procedimiento administrativo · Nivel técnico · Derecho de petición: peticiones incompletas y desistimiento", "texto": "Usted es técnico administrativo de la Secretaría de Desarrollo Social de un municipio de segunda categoría. El martes 1 de septiembre de 2026 se radicó la solicitud de una madre cabeza de familia para acceder a un apoyo económico del programa municipal de permanencia escolar. Al revisarla, usted constata que falta el certificado de estudios del hijo, que la peticionaria debe obtener en el colegio privado donde estudia el menor y sin el cual no es posible decidir de fondo. La secretaría atiende de lunes a viernes y no hay festivos en septiembre de 2026.", "items": [{"id": "AP-116", "niv": 3, "e": "Si la secretaría va a requerir a la peticionaria para que complete la solicitud, el último día para hacerlo es el", "f": "Ley 1755 de 2015, art. 1 (art. 17 de la Ley 1437 de 2011); cálculo de días hábiles", "o": [["A", "viernes 11 de septiembre de 2026.", "Resulta de contar diez días calendario. El término de diez días se cuenta en días hábiles.", false], ["B", "lunes 14 de septiembre de 2026.", "Resulta de contar el día de la radicación como primer día. El plazo corre dentro de los diez días siguientes a la fecha de radicación.", false], ["C", "martes 15 de septiembre de 2026.", "El artículo 17 del CPACA ordena requerir dentro de los diez días siguientes a la radicación: 2 a 4 de septiembre (3), 7 a 11 (8), 14 (9) y 15 (10). No hay festivos en el periodo.", true]]}, {"id": "AP-117", "niv": 2, "e": "En el requerimiento debe indicarse que la peticionaria cuenta, para aportar el certificado, con", "f": "Ley 1755 de 2015, art. 1 (art. 17 de la Ley 1437 de 2011)", "o": [["A", "un término máximo de un mes, prorrogable hasta por un término igual si lo pide antes de su vencimiento.", "El artículo 17 del CPACA da al peticionario un término máximo de un mes para completar la petición y le permite pedir, antes de que venza, una prórroga hasta por un término igual.", true], ["B", "diez días hábiles, prorrogables por una sola vez a juicio de la secretaría.", "Confunde el plazo que tiene la autoridad para hacer el requerimiento (diez días) con el que tiene el peticionario para cumplirlo, que es de un mes.", false], ["C", "tres meses, al cabo de los cuales operará el silencio administrativo negativo.", "Tres meses es el plazo del silencio negativo (art. 83 del CPACA), que no tiene relación con el requerimiento para completar una petición.", false]]}, {"id": "AP-118", "niv": 2, "e": "Si la peticionaria no aporta el certificado ni pide prórroga, la secretaría debe", "f": "Ley 1755 de 2015, art. 1 (art. 17 de la Ley 1437 de 2011)", "o": [["A", "decretar el desistimiento y el archivo mediante acto motivado que se notifica personalmente, contra el cual solo procede reposición.", "El artículo 17 del CPACA ordena decretar el desistimiento y el archivo mediante acto administrativo motivado, notificado personalmente, contra el que únicamente procede reposición. La petición puede presentarse de nuevo con los requisitos completos.", true], ["B", "archivar el expediente sin expedir acto administrativo, porque el desistimiento opera de pleno derecho.", "La ley exige un acto administrativo motivado que decrete el desistimiento, notificado personalmente, para garantizar el debido proceso.", false], ["C", "negar de fondo el apoyo económico mediante resolución contra la cual proceden reposición y apelación.", "No hay decisión de fondo: la consecuencia del incumplimiento es el desistimiento, contra el cual solo procede reposición.", false]]}]}, {"comp": "atencion_procedimiento", "rol": "general", "tag": "Atención al ciudadano y procedimiento administrativo · Derecho de petición: atención prioritaria", "texto": "En la Secretaría de Gobierno de un municipio de tercera categoría se reciben el mismo día varias peticiones. Un periodista de una emisora local pide información sobre los contratos de obra del parque principal para un reportaje. Una mujer solicita reubicación urgente porque las grietas de su vivienda, ubicada en zona de ladera, empeoraron con las lluvias y la casa amenaza con derrumbarse con ella y sus hijos adentro. Además, catorce vecinos de un barrio radican peticiones idénticas en las que piden información sobre el cronograma de pavimentación de su calle.", "items": [{"id": "AP-119", "niv": 1, "e": "La petición del periodista, formulada para el ejercicio de su actividad, debe", "f": "Ley 1755 de 2015, art. 1 (art. 20 de la Ley 1437 de 2011)", "o": [["A", "someterse primero a la aprobación de la oficina de prensa, que debe verificar la acreditación del medio.", "La ley no condiciona el trámite a la aprobación de una oficina de prensa. Exigir requisitos no previstos obstruye el derecho de petición y el acceso a la información.", false], ["B", "responderse en el término de treinta días, por tratarse de información de interés general.", "El término de treinta días es para las consultas. La petición del periodista es de información y, además, la ley ordena darle trámite preferencial.", false], ["C", "tramitarse de manera preferencial.", "El inciso 2 del artículo 20 del CPACA dispone que, si la petición la realiza un periodista para el ejercicio de su actividad, se tramitará preferencialmente.", true]]}, {"id": "AP-120", "niv": 3, "e": "Ante la solicitud de la mujer cuya vivienda amenaza con derrumbarse, la alcaldía debe", "f": "Ley 1755 de 2015, art. 1 (art. 20 de la Ley 1437 de 2011)", "o": [["A", "resolver la petición dentro de los quince días siguientes, ya que no se pide el reconocimiento de un derecho fundamental.", "Cuando está en peligro inminente la vida o la integridad del destinatario, la ley no permite esperar el término ordinario: exige medidas de urgencia inmediatas.", false], ["B", "adoptar de inmediato las medidas de urgencia necesarias para conjurar el peligro, sin perjuicio del trámite de la petición.", "El inciso 2 del artículo 20 del CPACA ordena que, cuando por razones de salud o seguridad personal esté en peligro inminente la vida o la integridad del destinatario, la autoridad adopte de inmediato las medidas de urgencia, sin perjuicio del trámite de la petición.", true], ["C", "exigirle prueba sumaria del riesgo antes de cualquier actuación y, recibida esta, asignarle turno prioritario.", "La prueba sumaria se exige para la atención prioritaria de peticiones de reconocimiento de un derecho fundamental (inciso 1 del art. 20). Ante un peligro inminente para la vida, el inciso 2 ordena actuar de inmediato.", false]]}, {"id": "AP-121", "niv": 2, "e": "Para atender las catorce peticiones idénticas de los vecinos, la alcaldía puede", "f": "Ley 1755 de 2015, art. 1 (art. 22 de la Ley 1437 de 2011)", "o": [["A", "responderlas en el término de treinta días, porque al superar diez peticiones se tramitan como consulta.", "El número de peticiones no cambia su modalidad ni su término. Lo que permite la ley es dar una respuesta única.", false], ["B", "dar una respuesta única, publicarla en un diario de amplia circulación y en su página web, y entregar copia a quien la solicite.", "El artículo 22 del CPACA permite que, cuando más de diez personas formulen peticiones análogas de información, de interés general o de consulta, la administración dé una única respuesta, la publique en un diario de amplia circulación y en su página web y entregue copias a quienes las soliciten.", true], ["C", "acumularlas en un expediente y responder solo al primer peticionario, que se entiende como representante de los demás.", "Ninguna norma convierte al primer peticionario en representante de los demás. La respuesta única debe ponerse al alcance de todos por los medios que fija la ley.", false]]}]}, {"comp": "atencion_procedimiento", "rol": "general", "tag": "Atención al ciudadano y procedimiento administrativo · Derecho de petición: reglas generales", "texto": "Usted trabaja en la Secretaría de Educación de un municipio certificado. El martes 4 de mayo de 2027 la Personería municipal radicó una solicitud de información sobre el número de estudiantes beneficiados con el transporte escolar. Ese mismo día, un estudiante de 15 años se acercó solo a radicar una petición para acceder a una beca municipal. Un compañero de trabajo propone cobrar una tarifa por radicar peticiones y exigir abogado en las más complejas. La entidad atiende de lunes a viernes; el lunes 10 de mayo de 2027 es festivo y, aparte del sábado 1 de mayo, no hay otros festivos en mayo hasta el día 30.", "items": [{"id": "AP-122", "niv": 3, "e": "El último día para responder la solicitud de la Personería es el", "f": "Ley 1755 de 2015, art. 1 (art. 30 de la Ley 1437 de 2011); cálculo de días hábiles", "o": [["A", "martes 18 de mayo de 2027.", "Resulta de contar el lunes 10 de mayo como día hábil. Ese día es festivo y no se cuenta.", false], ["B", "miércoles 19 de mayo de 2027.", "Entre autoridades, la petición de información debe resolverse en no más de diez días (art. 30 del CPACA): 5 a 7 de mayo (3), 11 a 14 (7), 17 a 19 (10). Se excluyen el fin de semana y el festivo del 10 de mayo.", true], ["C", "miércoles 26 de mayo de 2027.", "Aplica el término general de quince días. Cuando una autoridad pide información a otra, la ley fija un término especial de diez días.", false]]}, {"id": "AP-123", "niv": 1, "e": "Frente a la petición del estudiante de 15 años sobre la beca municipal, usted debe", "f": "Decreto Ley 019 de 2012, art. 12; Ley 1755 de 2015, art. 1 (art. 13 de la Ley 1437 de 2011)", "o": [["A", "recibirla y tramitarla con prelación en el turno, porque los menores pueden presentar directamente peticiones sobre asuntos de su interés y bienestar.", "El artículo 12 del Decreto Ley 019 de 2012 permite que niños, niñas y adolescentes presenten directamente solicitudes relacionadas con su interés superior, su bienestar y su protección especial, con prelación en el turno. El artículo 13 del CPACA no exige persona mayor ante las entidades dedicadas a su formación.", true], ["B", "exigir que la presente su padre, madre o representante legal, porque los menores no pueden actuar solos ante la administración.", "La ley reconoce a los menores la facultad de presentar peticiones directamente en asuntos de su interés y bienestar, sin intermediarios.", false], ["C", "recibirla solo como información, sin radicarla, hasta que un adulto responsable la ratifique por escrito.", "Ninguna norma exige la ratificación de un adulto. Además, ninguna autoridad puede negarse a radicar peticiones respetuosas (art. 15, parágrafo 2, del CPACA).", false]]}, {"id": "AP-124", "niv": 1, "e": "Sobre la propuesta de cobrar por radicar peticiones y exigir abogado en las complejas, lo correcto es señalar que", "f": "Ley 1755 de 2015, art. 1 (art. 13 de la Ley 1437 de 2011)", "o": [["A", "el abogado solo es exigible cuando la petición busca el reconocimiento de un derecho de contenido económico.", "La ley no distingue según el contenido de la petición. En todos los casos puede ejercerse sin abogado.", false], ["B", "puede cobrarse una tarifa razonable por radicación, siempre que se fije mediante acto administrativo general.", "El artículo 13 del CPACA establece que el derecho de petición es gratuito. Lo único que puede cobrarse es el costo de las copias que se pidan (art. 29).", false], ["C", "el derecho de petición es gratuito y puede ejercerse sin necesidad de abogado.", "El inciso 3 del artículo 13 del CPACA dispone que el ejercicio del derecho de petición es gratuito y puede realizarse sin representación de abogado.", true]]}]}, {"comp": "atencion_procedimiento", "rol": "tecnico", "tag": "Atención al ciudadano y procedimiento administrativo · Nivel técnico · Notificación de actos administrativos", "texto": "Usted es técnico administrativo del instituto municipal de deportes de un municipio de primera categoría. El martes 25 de mayo de 2027 el director expidió una resolución que niega a una liga deportiva el apoyo económico que había solicitado. En el expediente figura la dirección física de la liga, pero su representante legal no ha aceptado notificaciones electrónicas. No existe norma especial sobre la notificación de este acto. El representante no compareció a notificarse personalmente, por lo que el aviso con copia íntegra de la resolución se entregó en la sede de la liga el jueves 3 de junio de 2027. El instituto atiende de lunes a viernes; el lunes 7 de junio de 2027 es festivo y no hay otros festivos en junio antes del día 28.", "items": [{"id": "AP-125", "niv": 1, "e": "Para notificar la resolución, si no hay otro medio más eficaz de informar a la liga, la primera actuación del instituto es", "f": "Ley 1437 de 2011, arts. 67 y 68", "o": [["A", "enviar, dentro de los cinco días siguientes a la expedición, una citación para que el representante comparezca a notificarse.", "El artículo 68 del CPACA ordena enviar una citación a la dirección, fax o correo del expediente para que el interesado comparezca a la notificación personal. El envío se hace dentro de los cinco días siguientes a la expedición del acto y se deja constancia en el expediente.", true], ["B", "publicar la resolución en la página web del instituto durante diez días, con lo cual queda notificada.", "La publicación es el medio para los actos de carácter general. Un acto particular se notifica personalmente y, en subsidio, por aviso (arts. 66 a 69 del CPACA).", false], ["C", "enviar copia de la resolución al correo electrónico de la liga, que se entiende notificada al día siguiente del envío.", "La notificación electrónica exige que el interesado haya aceptado ese medio (art. 56 del CPACA), y el caso indica que no lo hizo.", false]]}, {"id": "AP-126", "niv": 2, "e": "Ante la inasistencia del representante, la notificación por aviso procedía", "f": "Ley 1437 de 2011, arts. 68 y 69", "o": [["A", "al cabo de diez días del envío de la citación, siempre que el aviso se publique además en un diario de amplia circulación.", "La ley fija un plazo de cinco días y no exige publicar el aviso en un diario cuando se conoce la dirección del destinatario.", false], ["B", "una vez publicada la citación en la página web del instituto durante cinco días.", "La publicación de la citación en la página web solo procede cuando se desconoce la información del destinatario (art. 68, inciso 3). Aquí la dirección de la liga figura en el expediente.", false], ["C", "al cabo de cinco días del envío de la citación, remitiendo el aviso con copia íntegra del acto a la dirección del expediente.", "El artículo 69 del CPACA dispone que, si la notificación personal no puede hacerse al cabo de los cinco días del envío de la citación, se hace por aviso, remitido a la dirección que figure en el expediente y acompañado de copia íntegra del acto.", true]]}, {"id": "AP-127", "niv": 3, "e": "Si la liga quiere presentar recurso de reposición, el último día para hacerlo es el", "f": "Ley 1437 de 2011, arts. 69 y 76; cálculo de días hábiles", "o": [["A", "jueves 17 de junio de 2027.", "Resulta de contar desde el día de la entrega del aviso y de tomar el lunes 7 de junio como hábil. El aviso solo surte efectos al finalizar el día siguiente a la entrega, y el 7 de junio es festivo.", false], ["B", "viernes 18 de junio de 2027.", "Resulta de contar el viernes 4 de junio como primer día del término. Ese día la notificación todavía no se ha surtido: se surte al finalizar el día siguiente al de la entrega.", false], ["C", "lunes 21 de junio de 2027.", "Según el artículo 69 del CPACA, la notificación se surte al finalizar el viernes 4 de junio, día siguiente a la entrega. Los diez días del artículo 76 corren desde el 8 de junio (el 7 es festivo): 8 a 11 (4), 14 a 18 (9) y lunes 21 (10).", true]]}]}, {"comp": "atencion_procedimiento", "rol": "profesional", "tag": "Atención al ciudadano y procedimiento administrativo · Nivel profesional · Recursos contra los actos administrativos", "texto": "Usted es profesional universitario de la oficina jurídica de una gobernación. Revisa dos asuntos. En el primero, la secretaria de Educación departamental, en ejercicio de funciones propias de su cargo y no delegadas, expidió una resolución que negó a un docente el reconocimiento de una prima; el docente fue notificado personalmente y quiere controvertir la decisión. En el segundo, el gobernador firmó una resolución que negó a una fundación la solicitud de entrega en comodato de un inmueble del departamento. Ninguno de los dos asuntos tiene norma especial sobre recursos.", "items": [{"id": "AP-128", "niv": 1, "e": "Contra la resolución de la secretaria de Educación, los recursos de reposición y apelación pueden interponerse", "f": "Ley 1437 de 2011, art. 76", "o": [["A", "dentro del mes siguiente a la notificación, por ser un asunto laboral del docente.", "El CPACA no fija un plazo distinto según la materia. Sin norma especial, rige el plazo general de diez días.", false], ["B", "por escrito en la diligencia de notificación personal o dentro de los diez días siguientes a ella.", "El artículo 76 del CPACA establece que los recursos de reposición y apelación se interponen por escrito en la diligencia de notificación personal o dentro de los diez días siguientes a ella, o a la notificación por aviso o al vencimiento del término de publicación, según el caso.", true], ["C", "dentro de los cinco días siguientes a la notificación personal, por escrito o verbalmente.", "Cinco días es el plazo del recurso de queja. Para la reposición y la apelación el plazo es de diez días y el recurso se interpone por escrito.", false]]}, {"id": "AP-129", "niv": 2, "e": "Si el docente decide apelar, debe presentar el recurso", "f": "Ley 1437 de 2011, arts. 74, num. 2, y 76", "o": [["A", "ante la secretaria de Educación, directamente o en subsidio de la reposición, para que lo decida el gobernador.", "Los recursos se presentan ante el funcionario que dictó la decisión (art. 76 del CPACA), y la apelación, interpuesta directamente o como subsidiaria de la reposición, la resuelve el inmediato superior administrativo (art. 74, num. 2), que en este caso es el gobernador.", true], ["B", "directamente ante el gobernador, porque la apelación se presenta ante quien va a resolverla.", "El artículo 76 del CPACA dispone que los recursos se presentan ante el funcionario que dictó la decisión, salvo el de queja. La apelación la decide el superior, pero se presenta ante quien expidió el acto.", false], ["C", "ante la secretaria de Educación, para que lo decida la asamblea departamental como superior funcional de las secretarías.", "La asamblea departamental es una corporación político-administrativa que ejerce control político; no es superior jerárquico de los secretarios del gobernador ni resuelve recursos contra sus actos.", false]]}, {"id": "AP-130", "niv": 3, "e": "Contra la resolución firmada por el gobernador que negó la solicitud de la fundación procede", "f": "Ley 1437 de 2011, arts. 74 y 76", "o": [["A", "reposición y, en subsidio, apelación ante la asamblea departamental, que es obligatoria para acudir a la jurisdicción.", "La asamblea no resuelve recursos contra los actos del gobernador, y la ley establece que esas decisiones no son apelables.", false], ["B", "solo el recurso de reposición, porque esa decisión no es apelable.", "El artículo 74 del CPACA establece que no son apelables las decisiones de los representantes legales y jefes superiores de las entidades y organismos del nivel territorial, como el gobernador. Procede solo reposición, que no es obligatoria para acudir a la jurisdicción (art. 76).", true], ["C", "reposición ante el gobernador y, en subsidio, apelación ante el Ministerio del Interior.", "El Ministerio del Interior no es superior jerárquico del gobernador. Además, la ley excluye la apelación contra las decisiones de los jefes superiores de las entidades territoriales.", false]]}]}, {"comp": "atencion_procedimiento", "rol": "tecnico", "tag": "Atención al ciudadano y procedimiento administrativo · Nivel técnico · Recursos: rechazo y recurso de queja", "texto": "Usted es técnico administrativo de la Secretaría de Ambiente de un municipio de categoría especial. El subsecretario de Control Ambiental negó un permiso de poda solicitado por una copropiedad, que interpuso apelación. El subsecretario rechazó la apelación por considerar que se presentó por fuera del plazo, y esa decisión se notificó personalmente al administrador de la copropiedad el jueves 12 de agosto de 2027. El administrador le pide orientación. La entidad atiende de lunes a viernes; el lunes 16 de agosto de 2027 es festivo y no hay otros festivos en días hábiles de agosto (el sábado 7 no afecta el cómputo).", "items": [{"id": "AP-131", "niv": 2, "e": "Para controvertir el rechazo de la apelación, la copropiedad puede", "f": "Ley 1437 de 2011, arts. 74, num. 3, y 78", "o": [["A", "interponer recurso de queja ante el superior del subsecretario.", "El numeral 3 del artículo 74 del CPACA prevé la queja cuando se rechaza la apelación. Es facultativa y se interpone directamente ante el superior del funcionario que dictó la decisión, con copia de la providencia que negó el recurso (art. 78).", true], ["B", "solicitar la revocatoria directa ante el mismo subsecretario, único mecanismo para controvertir el rechazo.", "La revocatoria directa no es un recurso ni el medio previsto para controvertir el rechazo de la apelación, para el cual existe la queja (arts. 74 y 78 del CPACA).", false], ["C", "interponer reposición ante el subsecretario y, en subsidio, una nueva apelación contra el auto de rechazo.", "La ley prevé un recurso específico contra el rechazo de la apelación: la queja ante el superior. Encadenar reposición y nueva apelación no es el mecanismo previsto.", false]]}, {"id": "AP-132", "niv": 3, "e": "El último día para interponer el recurso de queja es el", "f": "Ley 1437 de 2011, art. 74, num. 3; cálculo de días hábiles", "o": [["A", "jueves 19 de agosto de 2027.", "Resulta de contar el lunes 16 de agosto como hábil. Ese día es festivo y no se cuenta.", false], ["B", "viernes 20 de agosto de 2027.", "La queja puede interponerse dentro de los cinco días siguientes a la notificación: 13 de agosto (1), 17 (2), 18 (3), 19 (4) y 20 (5). Se excluyen el fin de semana y el festivo del 16 de agosto.", true], ["C", "viernes 27 de agosto de 2027.", "Aplica el plazo de diez días de la reposición y la apelación. Para la queja la ley fija un plazo de cinco días.", false]]}, {"id": "AP-133", "niv": 2, "e": "Según el CPACA, el funcionario debe rechazar un recurso cuando el escrito", "f": "Ley 1437 de 2011, arts. 77 y 78", "o": [["A", "no acredita el pago de la suma que exige el acto recurrido.", "El artículo 77 del CPACA dispone que, para tramitar el recurso, el recurrente no está obligado a pagar la suma que el acto le exija.", false], ["B", "no viene acompañado de las pruebas que el recurrente pretende hacer valer en el trámite del recurso.", "Solicitar y aportar pruebas es un requisito del numeral 3 del artículo 77, pero su ausencia no es causal de rechazo: el artículo 78 solo remite a los numerales 1, 2 y 4.", false], ["C", "no expresa los motivos concretos de inconformidad del recurrente.", "El artículo 78 del CPACA ordena rechazar el recurso que no cumpla los requisitos de los numerales 1, 2 y 4 del artículo 77. El numeral 2 exige sustentar el recurso con expresión concreta de los motivos de inconformidad.", true]]}]}, {"comp": "atencion_procedimiento", "rol": "profesional", "tag": "Atención al ciudadano y procedimiento administrativo · Nivel profesional · Notificación electrónica", "texto": "Usted es profesional especializado de una corporación autónoma regional que recibe por su sede electrónica las solicitudes de permiso de vertimientos. En el formulario, una empresa avícola marcó expresamente que acepta ser notificada por medios electrónicos; un productor porcícola, en cambio, no marcó esa opción. La corporación acaba de decidir ambas solicitudes. Semanas después, ya dentro de otra actuación, el representante de la empresa avícola pide que las siguientes notificaciones se le hagan por correo físico. Ninguna norma hace obligatorio el uso de medios electrónicos en estos trámites.", "items": [{"id": "AP-134", "niv": 1, "e": "La corporación puede notificar por medios electrónicos la decisión", "f": "Ley 1437 de 2011, art. 56 (modificado por el art. 10 de la Ley 2080 de 2021) y art. 67, num. 1", "o": [["A", "a ambos usuarios, porque presentaron sus solicitudes por la sede electrónica.", "Usar la sede electrónica para radicar no equivale a aceptar la notificación electrónica. El artículo 56 del CPACA exige que el administrado haya aceptado ese medio.", false], ["B", "solo a quien sea persona jurídica inscrita en el registro mercantil.", "La inscripción en el registro mercantil obliga a informar la dirección electrónica (art. 16 del CPACA), pero no reemplaza la aceptación de la notificación electrónica que exige el artículo 56.", false], ["C", "a la empresa avícola, que aceptó ese medio de notificación.", "El artículo 56 del CPACA, modificado por la Ley 2080 de 2021, permite notificar por medios electrónicos siempre que el administrado haya aceptado ese medio. Solo la empresa avícola lo aceptó.", true]]}, {"id": "AP-135", "niv": 2, "e": "La notificación electrónica a la empresa avícola se entiende surtida", "f": "Ley 1437 de 2011, art. 56 (modificado por el art. 10 de la Ley 2080 de 2021)", "o": [["A", "a partir de la fecha y hora en que el administrado acceda a ella, hecho que debe certificar la corporación.", "El artículo 56 del CPACA, modificado por la Ley 2080 de 2021, dispone que la notificación electrónica queda surtida a partir de la fecha y hora en que el administrado accede a ella, hecho que debe certificar la administración.", true], ["B", "cinco días después del envío, si en ese lapso la empresa no manifiesta haberlo recibido.", "La ley no prevé un plazo de cinco días ni presume la notificación por falta de respuesta. El momento relevante es el acceso al acto, certificado por la autoridad.", false], ["C", "al finalizar el día siguiente al envío del mensaje de datos a la dirección registrada.", "Esa regla es propia de la notificación por aviso (art. 69 del CPACA). Para la notificación electrónica, la ley atiende al momento en que el administrado accede al acto.", false]]}, {"id": "AP-136", "niv": 3, "e": "Frente a la solicitud de la empresa avícola de recibir las siguientes notificaciones por correo físico, la corporación debe", "f": "Ley 1437 de 2011, arts. 53A y 56 (adicionado y modificado por los arts. 8 y 10 de la Ley 2080 de 2021)", "o": [["A", "atenderla y notificar por los demás medios del CPACA, porque ningún precepto hace obligatorio el medio electrónico en ese trámite.", "El inciso 2 del artículo 56 del CPACA permite al interesado pedir, durante la actuación, que las notificaciones sucesivas no sean electrónicas, salvo que el uso de medios electrónicos sea obligatorio según el artículo 53A. El caso aclara que no lo es.", true], ["B", "negarla, porque la aceptación de la notificación electrónica es irrevocable mientras dure la relación con la entidad.", "La ley no hace irrevocable la aceptación: permite al interesado pedir que las notificaciones sucesivas se hagan por otros medios.", false], ["C", "exigirle que interponga reposición contra el auto que ordenó notificar electrónicamente, para poder cambiar el medio.", "Cambiar el medio de notificación es una solicitud que la ley permite hacer durante la actuación, sin necesidad de recurso alguno.", false]]}]}, {"comp": "atencion_procedimiento", "rol": "general", "tag": "Atención al ciudadano y procedimiento administrativo · Firmeza de los actos administrativos", "texto": "En la oficina jurídica de una alcaldía de segunda categoría se lleva el control de firmeza de varias resoluciones de carácter particular. La primera, que niega una solicitud de reconocimiento de un auxilio funerario, se notificó personalmente y el interesado no presentó recurso alguno. La segunda fue recurrida en reposición y en subsidio apelación; ambos recursos ya fueron resueltos y las decisiones se notificaron. En la tercera,
