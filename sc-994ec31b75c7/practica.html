neral", "tag": "Estado y Constitución · Principios de la función administrativa", "texto": "Usted es técnico de la Secretaría Distrital de Hábitat de Bogotá y participa en la evaluación de solicitudes de un subsidio de mejoramiento de vivienda. Durante la semana ocurren tres situaciones: un compañero advierte que su hermano es uno de los solicitantes; la Secretaría de Integración Social y la de Hábitat programaron, por separado, visitas a las mismas familias del mismo barrio; y el director de un pequeño instituto adscrito afirma que el control interno es obligatorio solo para las entidades nacionales.", "items": [{"id": "EC-155", "niv": 1, "e": "Que el compañero se aparte de evaluar la solicitud de su hermano responde principalmente al principio de", "f": "Constitución Política, art. 209; Ley 489 de 1998, art. 3", "o": [["A", "economía.", "La economía se refiere al uso racional de recursos y a evitar trámites innecesarios, no a la neutralidad de quien decide.", false], ["B", "celeridad.", "La celeridad busca que las actuaciones se adelanten sin dilaciones. Apartarse de un asunto por un vínculo familiar no tiene que ver con la rapidez del trámite.", false], ["C", "imparcialidad.", "El artículo 209 de la Constitución incluye la imparcialidad entre los principios de la función administrativa. Apartarse de evaluar la solicitud de un familiar garantiza que la decisión no se vea influida por intereses personales.", true]]}, {"id": "EC-156", "niv": 2, "e": "Para resolver la duplicidad de visitas entre las dos secretarías, el principio que debe guiar la actuación es el de", "f": "Constitución Política, art. 209; Ley 489 de 1998, art. 6", "o": [["A", "publicidad, porque las familias deben conocer con anticipación las fechas de cada visita.", "Informar las fechas es útil, pero no evita la duplicidad. El problema es la falta de armonía entre entidades, que se resuelve con la coordinación.", false], ["B", "coordinación, porque las autoridades deben armonizar sus actuaciones para cumplir los fines del Estado.", "El artículo 209 de la Constitución ordena a las autoridades administrativas coordinar sus actuaciones para el adecuado cumplimiento de los fines del Estado, y el artículo 6 de la Ley 489 exige garantizar la armonía en el ejercicio de sus funciones.", true], ["C", "desconcentración, porque cada secretaría debe radicar sus visitas en las alcaldías locales correspondientes al barrio.", "La desconcentración es una forma de distribuir competencias hacia dependencias fuera de la sede principal; no resuelve la duplicidad entre dos entidades distintas.", false]]}, {"id": "EC-157", "niv": 2, "e": "Frente a la afirmación del director del instituto, lo correcto es señalar que", "f": "Constitución Política, arts. 209 y 269", "o": [["A", "la administración pública, en todos sus órdenes, debe tener control interno en los términos de la ley.", "El artículo 209 de la Constitución dispone que la administración pública, en todos sus órdenes, tendrá un control interno que se ejercerá en los términos que señale la ley; el artículo 269 obliga a las autoridades a diseñar y aplicar métodos y procedimientos de control interno.", true], ["B", "en el Distrito el control interno lo ejerce de forma exclusiva la Personería de Bogotá.", "La personería ejerce funciones de Ministerio Público, no el control interno de cada entidad, que es un deber de las propias autoridades (art. 269).", false], ["C", "el control interno es exigible solo a las entidades nacionales; en las territoriales lo sustituye la contraloría.", "El control fiscal externo no sustituye el control interno. El artículo 209 lo exige a la administración pública en todos sus órdenes.", false]]}]}, {"comp": "estado_constitucion", "rol": "general", "tag": "Estado y Constitución · Sector central y descentralizado; servidores públicos", "texto": "Usted es técnico del área de talento humano de un municipio de primera categoría y responde preguntas para un nuevo manual de inducción. En la estructura del municipio hay secretarías de despacho, un instituto municipal de tránsito creado como establecimiento público y una empresa industrial y comercial de servicios de aseo. Un participante pregunta en qué sector se ubica cada entidad y cómo se relacionan con la alcaldía. Otro pregunta si un concejal, un trabajador oficial de la empresa de aseo y una contratista de prestación de servicios de la secretaría de salud son servidores públicos.", "items": [{"id": "EC-158", "niv": 2, "e": "Sobre la ubicación del instituto municipal de tránsito, el manual debe indicar que hace parte", "f": "Ley 489 de 1998, arts. 68 y 70", "o": [["A", "del sector descentralizado por servicios, como establecimiento público con personería jurídica y autonomía.", "El artículo 70 de la Ley 489 de 1998 caracteriza a los establecimientos públicos por su personería jurídica, autonomía administrativa y financiera y patrimonio independiente, y el artículo 68 los clasifica como entidades descentralizadas; su parágrafo 1 extiende ese régimen a las entidades territoriales.", true], ["B", "de los órganos autónomos e independientes, porque no depende jerárquicamente del alcalde.", "Los órganos autónomos e independientes son los que la Constitución ubica fuera de las ramas (art. 113). Un establecimiento público municipal integra la administración, como entidad descentralizada.", false], ["C", "del sector central, porque cumple funciones administrativas propias de la alcaldía.", "Cumplir funciones administrativas no lo ubica en el sector central. Al tener personería jurídica, autonomía administrativa y financiera y patrimonio independiente, es una entidad descentralizada.", false]]}, {"id": "EC-159", "niv": 3, "e": "Respecto de la relación con la administración central, el manual debe explicar que, como regla, el instituto de tránsito y la empresa de aseo están, respectivamente,", "f": "Ley 489 de 1998 (régimen de adscripción y vinculación de entidades descentralizadas)", "o": [["A", "adscritos ambos, porque son entidades descentralizadas del mismo municipio.", "No todas las entidades descentralizadas tienen la misma relación: las empresas industriales y comerciales del Estado están vinculadas, no adscritas.", false], ["B", "vinculado y adscrita.", "Invierte la regla: los establecimientos públicos están adscritos y las empresas industriales y comerciales del Estado están vinculadas.", false], ["C", "adscrito y vinculada.", "La Ley 489 de 1998 dispone que los establecimientos públicos están adscritos a los ministerios o departamentos administrativos, y que las empresas industriales y comerciales del Estado están vinculadas a ellos; ese régimen se aplica, en lo pertinente, a las entidades territoriales.", true]]}, {"id": "EC-160", "niv": 3, "e": "Sobre quiénes son servidores públicos, lo correcto es responder que", "f": "Constitución Política, art. 123", "o": [["A", "lo son los tres, porque todos reciben recursos públicos por su trabajo.", "Recibir recursos públicos no confiere la calidad de servidor. La contratista se vincula por un contrato, no como empleada o trabajadora del Estado.", false], ["B", "lo son el concejal y el trabajador oficial, pero no la contratista de prestación de servicios.", "El artículo 123 de la Constitución dispone que son servidores públicos los miembros de las corporaciones públicas y los empleados y trabajadores del Estado y de sus entidades descentralizadas. El contratista de prestación de servicios no tiene esa calidad.", true], ["C", "solo lo es el trabajador oficial, porque los concejales son representantes de elección popular.", "El artículo 123 incluye expresamente a los miembros de las corporaciones públicas, como los concejales, entre los servidores públicos.", false]]}]}, {"comp": "estado_constitucion", "rol": "general", "tag": "Estado y Constitución · Veedurías ciudadanas", "texto": "Usted es técnico administrativo de la Secretaría de Infraestructura de un municipio de cuarta categoría, donde se ejecuta la ampliación del acueducto veredal. Un grupo de habitantes decide constituir una veeduría y pregunta dónde inscribirla. Entre los interesados en ser veedores está el propietario de la ferretería que provee los tubos al contratista. Semanas después, los veedores llegan a la obra y exigen que se detenga de inmediato porque, según ellos, el material no cumple las especificaciones.", "items": [{"id": "EC-161", "niv": 1, "e": "Para formalizar la veeduría, los ciudadanos deben inscribir el documento o acta de constitución ante", "f": "Ley 850 de 2003, art. 3", "o": [["A", "la secretaría de infraestructura que ejecuta la obra vigilada.", "Inscribir la veeduría ante la entidad vigilada afectaría su autonomía. La ley prevé el registro ante personerías o cámaras de comercio.", false], ["B", "la Registraduría Nacional del Estado Civil, en su sede municipal.", "La Registraduría no lleva el registro de veedurías ciudadanas; esa función la asigna la Ley 850 a las personerías y a las cámaras de comercio.", false], ["C", "la personería municipal o la cámara de comercio, que llevan su registro público.", "El artículo 3 de la Ley 850 de 2003 dispone que la inscripción del documento de constitución se realiza ante las personerías municipales o distritales o ante las cámaras de comercio, que llevan el registro público de las veedurías.", true]]}, {"id": "EC-162", "niv": 2, "e": "Sobre el propietario de la ferretería que provee los tubos, usted debe advertir que", "f": "Ley 850 de 2003, art. 19, lit. a", "o": [["A", "está impedido para ser veedor, porque es proveedor de la obra objeto de vigilancia.", "El literal a del artículo 19 de la Ley 850 de 2003 establece el impedimento para ser veedor cuando se es contratista, interventor, proveedor o trabajador de la obra, contrato o programa vigilado, o se tiene interés patrimonial en su ejecución.", true], ["B", "puede ser veedor, pero no podrá votar las decisiones relacionadas con los materiales.", "La ley no prevé una participación parcial: el impedimento le impide ser veedor de esa obra.", false], ["C", "puede ser veedor, siempre que declare por escrito su relación comercial con el contratista.", "Declarar el interés no lo elimina. La Ley 850 establece un impedimento para quienes sean proveedores de la obra vigilada.", false]]}, {"id": "EC-163", "niv": 3, "e": "Frente a la exigencia de los veedores de detener la obra, la respuesta adecuada es explicarles que", "f": "Ley 850 de 2003, arts. 16, 17 y 20", "o": [["A", "no se les dará ninguna información técnica hasta que termine la obra, para no interferir en la ejecución.", "Negar la información desconoce el derecho de las veedurías a obtenerla de los supervisores, contratistas y entidades, información que es de obligatoria respuesta (art. 17).", false], ["B", "la veeduría no puede suspender la obra por sí misma, pero sí pedir información, de obligatoria respuesta, y denunciar.", "El artículo 20 de la Ley 850 prohíbe a las veedurías retrasar, impedir o suspender los programas o contratos sin el concurso de la autoridad competente; el artículo 17 hace obligatoria la respuesta a la información que soliciten, y el artículo 16 les permite denunciar.", true], ["C", "la obra debe suspenderse de inmediato, porque la veeduría tiene la facultad de ordenarlo cuando detecta irregularidades.", "La Ley 850 no otorga a las veedurías facultad de suspender contratos; se lo prohíbe sin el concurso de autoridad competente (art. 20).", false]]}]}, {"comp": "estado_constitucion", "rol": "general", "tag": "Estado y Constitución · Rendición de cuentas", "texto": "Usted es profesional universitario de la oficina de planeación de una gobernación y apoya la preparación de la rendición de cuentas anual del gobernador. En la reunión de preparación surgen tres asuntos: el jefe de prensa propone que el ejercicio consista solo en publicar un video con las cifras de gestión; durante la audiencia los ciudadanos formularán preguntas que no alcanzarán a responderse en el evento; y un asesor pregunta en qué instrumento de planeación debe quedar la estrategia de rendición de cuentas.", "items": [{"id": "EC-164", "niv": 1, "e": "Frente a la propuesta del jefe de prensa, debe señalarse que la rendición de cuentas se fundamenta en los elementos de", "f": "Ley 1757 de 2015, art. 49", "o": [["A", "información y transparencia, que se satisfacen con la publicación en la página web de la entidad.", "La información es solo uno de los elementos. La Ley 1757 exige además lenguaje comprensible, diálogo e incentivos.", false], ["B", "información, lenguaje comprensible al ciudadano, diálogo e incentivos.", "El artículo 49 de la Ley 1757 de 2015 establece que la rendición de cuentas se fundamenta en los elementos de información, lenguaje comprensible al ciudadano, diálogo e incentivos. Un video sin espacio de diálogo no cumple todos ellos.", true], ["C", "publicidad, eficacia y economía, que se cumplen con la difusión de las cifras de gestión.", "Publicidad, eficacia y economía son principios de la función administrativa (art. 209 C. P.), no los elementos de la rendición de cuentas que fija la Ley 1757.", false]]}, {"id": "EC-165", "niv": 1, "e": "Las preguntas de los ciudadanos que no se respondan en el evento deben contestarse por escrito en el término de", "f": "Ley 1757 de 2015, art. 56, lit. f", "o": [["A", "cinco días, y publicarse en la página web.", "La ley no fija cinco días. El literal f del artículo 56 establece quince días para las respuestas escritas.", false], ["B", "quince días, y publicarse en la página web o en los medios oficiales de difusión.", "El literal f del artículo 56 de la Ley 1757 de 2015 prevé respuestas escritas, en el término de quince días, a las preguntas de los ciudadanos formuladas en el marco del proceso de rendición de cuentas, y su publicación en la página web o en los medios oficiales de la entidad.", true], ["C", "treinta días, y remitirse a la asamblea departamental para su evaluación.", "El término es de quince días y la respuesta se publica en los medios de la entidad. La asamblea evalúa el informe anual del gobernador, no cada respuesta.", false]]}, {"id": "EC-166", "niv": 2, "e": "Al asesor debe responderse que la estrategia anual de rendición de cuentas debe incluirse en", "f": "Ley 1757 de 2015, art. 52; Ley 1474 de 2011, art. 73 (modificado por el art. 31 de la Ley 2195 de 2022); Decreto 1081 de 2015, art. 2.1.4.4.1.5 (adicionado por el Decreto 1122 de 2024)", "o": [["A", "el plan anual de adquisiciones, porque implica contratar la logística de la audiencia.", "El plan de adquisiciones programa compras; no es el instrumento donde la ley ordena incluir la estrategia de rendición de cuentas.", false], ["B", "el plan de desarrollo departamental, como un programa del componente estratégico.", "La Ley 1757 no ordena incluir la estrategia anual en el plan de desarrollo cuatrienal, sino en el instrumento anticorrupción de la entidad, hoy el Programa de Transparencia y Ética Pública (antes Plan Anticorrupción y de Atención al Ciudadano).", false], ["C", "el Programa de Transparencia y Ética Pública (antes Plan Anticorrupción y de Atención al Ciudadano), según la ley de participación y su reglamentación vigente.", "El artículo 52 de la Ley 1757 de 2015 ordena a las entidades nacionales y territoriales elaborar anualmente una estrategia de rendición de cuentas, conforme al Manual Único, que debe incluirse en el Plan Anticorrupción y de Atención a los Ciudadanos. Desde el Decreto 1122 de 2024 (art. 2.1.4.4.1.5 del Decreto 1081 de 2015), que reglamenta el artículo 73 de la Ley 1474 de 2011 modificado por la Ley 2195 de 2022, ese plan fue reemplazado por el Programa de Transparencia y Ética Pública, y toda mención al plan se entiende referida al programa.", true]]}]}, {"comp": "estado_constitucion", "rol": "general", "tag": "Estado y Constitución · Cabildo abierto", "texto": "Usted es técnico administrativo de la secretaría general del concejo de un municipio de tercera categoría. Un grupo de residentes quiere que en un cabildo abierto se discuta el cierre de una vía principal por obras, y pretende citar al alcalde para que responda un cuestionario. Los promotores preguntan cuántos apoyos necesitan, si el alcalde está obligado a asistir y qué pasa con las respuestas que se den en el cabildo. El municipio tiene un censo electoral de 48.000 ciudadanos.", "items": [{"id": "EC-167", "niv": 2, "e": "Para que el cabildo se realice, la iniciativa debe contar con el respaldo de un número de ciudadanos no inferior a", "f": "Ley 1757 de 2015, art. 22", "o": [["A", "el cinco por mil del censo electoral, es decir, 240 ciudadanos.", "El artículo 22 de la Ley 1757 de 2015 exige la iniciativa de un número no inferior al cinco por mil de los ciudadanos del censo electoral del respectivo municipio. Con 48.000 ciudadanos, el cinco por mil es 48.000 × 5 / 1.000 = 240.", true], ["B", "el cinco por ciento del censo electoral, es decir, 2.400 ciudadanos.", "Confunde el cinco por mil con el cinco por ciento, que es la proporción exigida para otras iniciativas, como el referendo constitucional o la iniciativa legislativa (art. 9).", false], ["C", "el diez por ciento del censo electoral, es decir, 4.800 ciudadanos.", "No existe ese umbral para el cabildo abierto. La Ley 1757 exige el cinco por mil del censo electoral.", false]]}, {"id": "EC-168", "niv": 3, "e": "Sobre la citación al alcalde, debe informarse a los promotores que", "f": "Ley 1757 de 2015, arts. 22 y 23", "o": [["A", "la asistencia del alcalde es voluntaria, porque el cabildo es una sesión del concejo y no de la administración.", "Aunque el cabildo se celebra en la corporación, la ley impone al alcalde la obligación de asistir (art. 22).", false], ["B", "el alcalde puede delegar su asistencia en el secretario de obras, quien responderá el cuestionario.", "La ley establece que es obligación del alcalde o gobernador asistir al cabildo abierto (art. 22); no prevé que se cumpla mediante delegación.", false], ["C", "el alcalde debe asistir, y el cuestionario debe remitírsele con mínimo cinco días de antelación.", "El artículo 22 de la Ley 1757 de 2015 establece que es obligación del alcalde o gobernador asistir al cabildo abierto, y el artículo 23 dispone que el cuestionario formulado al funcionario se remite por el presidente de la corporación con mínimo cinco días de antelación a la celebración del cabildo.", true]]}, {"id": "EC-169", "niv": 3, "e": "Respecto de las respuestas a los planteamientos del cabildo, lo correcto es explicar que", "f": "Ley 1757 de 2015, art. 28", "o": [["A", "una semana después se hará una sesión con las respuestas razonadas, y los compromisos decisorios que se adquieran serán obligatorios.", "El artículo 28 de la Ley 1757 de 2015 dispone que una semana después del cabildo se realiza una sesión en la que se exponen las respuestas razonadas del mandatario y de la corporación, y que los compromisos decisorios incluidos en las respuestas son obligatorios, previo cumplimiento de las normas aplicables.", true], ["B", "las respuestas son simples recomendaciones, porque el cabildo no es un mecanismo de decisión vinculante en ningún caso.", "La ley dispone expresamente que los compromisos decisorios que incluyan las respuestas son obligatorios y deben ejecutarse (art. 28).", false], ["C", "las respuestas deben darse por escrito dentro de los quince días hábiles siguientes, como un derecho de petición.", "El cabildo abierto tiene una regla propia: una sesión una semana después con respuestas razonadas (art. 28). No se tramita como derecho de petición.", false]]}]}, {"comp": "estado_constitucion", "rol": "general", "tag": "Estado y Constitución · Audiencias públicas y democratización de la gestión", "texto": "Usted es técnico administrativo de la Secretaría de Movilidad de un municipio de primera categoría, que formula un plan de reorganización de rutas de transporte público. Una asociación de usuarios y dos juntas de acción comunal piden que se convoque una audiencia pública para discutir el plan. El secretario pregunta si está obligado a seguir lo que se concluya en la audiencia, quién puede solicitarla y dónde debe quedar definida la forma en que se desarrollará.", "items": [{"id": "EC-170", "niv": 2, "e": "Sobre el carácter de lo que se concluya en la audiencia, debe informarse al secretario que", "f": "Ley 489 de 1998, art. 33", "o": [["A", "las conclusiones no son vinculantes, pero deben explicarse a las organizaciones las razones de la decisión.", "El artículo 33 de la Ley 489 de 1998 dispone que ni la solicitud ni las conclusiones de las audiencias públicas tienen carácter vinculante para la administración, pero en todo caso se explicarán a las organizaciones las razones de la decisión adoptada.", true], ["B", "las conclusiones son obligatorias para la secretaría, porque provienen de un mecanismo de participación ciudadana.", "El artículo 33 de la Ley 489 dispone expresamente que las conclusiones de las audiencias públicas no son vinculantes.", false], ["C", "las conclusiones no son vinculantes y la administración no tiene ningún deber frente a ellas.", "Aunque no son vinculantes, la ley impone el deber de explicar a las organizaciones las razones de la decisión adoptada (art. 33).", false]]}, {"id": "EC-171", "niv": 1, "e": "Respecto de quién puede solicitar la audiencia pública, lo correcto es responder que", "f": "Ley 489 de 1998, art. 33", "o": [["A", "solo el concejo municipal puede pedirla, mediante proposición aprobada en plenaria.", "La ley no reserva la solicitud al concejo. El artículo 33 permite que las comunidades y las organizaciones la soliciten.", false], ["B", "solo la personería puede solicitarla, en representación de los usuarios del transporte.", "La personería puede promover la participación, pero la ley permite que las propias comunidades y organizaciones soliciten la audiencia.", false], ["C", "las comunidades y las organizaciones, sin perjuicio de que la administración la convoque.", "El artículo 33 de la Ley 489 de 1998 dispone que las comunidades y las organizaciones podrán solicitar la realización de audiencias públicas, además de la facultad de la administración de convocarlas cuando lo considere conveniente.", true]]}, {"id": "EC-172", "niv": 2, "e": "La metodología que se utilizará en la audiencia debe quedar definida en", "f": "Ley 489 de 1998, art. 33", "o": [["A", "un reglamento que deben presentar las organizaciones solicitantes el día de la audiencia.", "La ley asigna a la institución que convoca, no a los solicitantes, la definición de la metodología en el acto de convocatoria.", false], ["B", "el acto de convocatoria que expida la secretaría.", "El artículo 33 de la Ley 489 de 1998 dispone que en el acto de convocatoria a la audiencia la institución respectiva definirá la metodología que será utilizada.", true], ["C", "el acta que se levante al finalizar la audiencia.", "El acta da cuenta de lo ocurrido; la metodología debe conocerse antes y quedar en el acto de convocatoria.", false]]}]}, {"comp": "estado_constitucion", "rol": "general", "tag": "Estado y Constitución · Estado social de derecho y espacio público", "texto": "Usted es profesional universitario de la Secretaría de Gobierno de un municipio de segunda categoría que prepara un plan para recuperar el espacio público del centro, ocupado por cerca de 200 vendedores informales. En la mesa de trabajo, un asesor propone desalojar a todos sin más consideraciones «porque el interés general prevalece siempre»; un líder de los vendedores responde que el derecho al trabajo impide cualquier recuperación. Un ciudadano anuncia que acudirá al juez si la alcaldía no actúa. Entre los vendedores hay un hombre con discapacidad física cuya única fuente de ingresos es su puesto.", "items": [{"id": "EC-173", "niv": 2, "e": "Frente a las posiciones del asesor y del líder de los vendedores, el plan debe partir de que el Estado social de derecho", "f": "Constitución Política, arts. 1 y 2", "o": [["A", "impide recuperar el espacio público mientras exista una sola persona que derive su sustento de él.", "El derecho al trabajo no es absoluto ni impide a la administración proteger el espacio público. Se trata de armonizar ambos fundamentos, no de suprimir uno.", false], ["B", "se funda en la prevalencia del interés general como único fundamento, por lo que procede el desalojo sin más consideraciones.", "La prevalencia del interés general es uno de los fundamentos del Estado social de derecho, pero no el único: el artículo 1 también lo funda en la dignidad humana, el trabajo y la solidaridad.", false], ["C", "exige armonizar la prevalencia del interés general con la dignidad humana y el trabajo, que también son sus fundamentos.", "El artículo 1 de la Constitución funda el Estado social de derecho en el respeto de la dignidad humana, en el trabajo, en la solidaridad y en la prevalencia del interés general, y el artículo 2 ordena a las autoridades proteger a todas las personas. El plan debe conciliar estos fundamentos.", true]]}, {"id": "EC-174", "niv": 2, "e": "Si la alcaldía no actúa, el ciudadano que pretende la protección del espacio público puede acudir a", "f": "Constitución Política, art. 88; Ley 472 de 1998, arts. 2 y 9", "o": [["A", "la acción popular, porque el espacio público es un derecho colectivo.", "El artículo 88 de la Constitución incluye el espacio público entre los derechos e intereses colectivos protegidos por las acciones populares, que proceden contra las acciones u omisiones de las autoridades que los amenacen o vulneren (Ley 472, arts. 2 y 9).", true], ["B", "la acción de grupo, porque los afectados por la ocupación del centro son más de veinte personas.", "La acción de grupo busca indemnizar perjuicios individuales. El ciudadano pretende que se proteja el espacio público, finalidad de la acción popular.", false], ["C", "la acción de tutela, porque el espacio público es un derecho fundamental de cada ciudadano.", "El espacio público es un derecho colectivo; la tutela no procede para proteger derechos colectivos (Decreto 2591, art. 6, num. 3), salvo para evitar un perjuicio irremediable a un derecho fundamental propio.", false]]}, {"id": "EC-175", "niv": 3, "e": "Frente al vendedor con discapacidad física y sin otra fuente de ingresos, la Constitución impone a la alcaldía", "f": "Constitución Política, art. 13, inc. 3", "o": [["A", "darle el mismo trato que a los demás vendedores, porque cualquier diferencia sería un trato discriminatorio.", "La igualdad no exige trato idéntico en todos los casos. El inciso 3 del artículo 13 ordena una protección especial a quienes están en circunstancia de debilidad manifiesta.", false], ["B", "brindarle protección especial por su debilidad manifiesta, sin que ello impida recuperar el espacio público.", "El inciso 3 del artículo 13 de la Constitución ordena al Estado proteger especialmente a quienes por su condición económica, física o mental se encuentren en circunstancia de debilidad manifiesta. Esa protección se materializa en medidas diferenciadas dentro del plan, no en la renuncia a proteger el espacio público.", true], ["C", "otorgarle un permiso indefinido para permanecer en el espacio público, por ser sujeto de especial protección.", "La protección especial no convierte el espacio público en un bien apropiable de forma indefinida; exige medidas que atiendan su situación, compatibles con el interés colectivo.", false]]}]}, {"comp": "estado_constitucion", "rol": "profesional", "tag": "Estado y Constitución · Nivel profesional · Acción de tutela: reparto y medidas provisionales", "texto": "Usted es profesional especializado de la Dirección Jurídica de una secretaría distrital de Bogotá. Un ciudadano presentó una tutela contra la secretaría por la suspensión de un apoyo económico, y el juez, al admitirla, ordenó suspender la resolución que le retiró el apoyo mientras decide. En otro asunto, una tutela que el mismo ciudadano dirigió exclusivamente contra una entidad del orden nacional fue repartida por error a un juez municipal. Su jefe le pide un concepto breve sobre estas actuaciones.", "items": [{"id": "EC-176", "niv": 2, "e": "Según las reglas de reparto vigentes, la tutela contra la secretaría distrital debe repartirse, en primera instancia, a", "f": "Decreto 1069 de 2015, art. 2.2.3.1.2.1, num. 1 (modificado por el Decreto 333 de 2021)", "o": [["A", "los jueces del circuito, por tratarse de una entidad de la capital de la República.", "Ser una entidad de Bogotá no la convierte en entidad del orden nacional. Las tutelas contra entidades del orden distrital se reparten a los jueces municipales.", false], ["B", "los jueces administrativos, por dirigirse contra un acto administrativo.", "La tutela no se reparte según la naturaleza del acto, sino según la autoridad accionada; para las distritales, a los jueces municipales.", false], ["C", "los jueces municipales, por dirigirse contra una entidad del orden distrital.", "El numeral 1 del artículo 2.2.3.1.2.1 del Decreto 1069 de 2015, modificado por el Decreto 333 de 2021, dispone que las tutelas contra autoridades, organismos o entidades del orden departamental, distrital o municipal y contra particulares se reparten en primera instancia a los jueces municipales.", true]]}, {"id": "EC-177", "niv": 3, "e": "Respecto de la tutela contra la entidad nacional repartida por error al juez municipal, lo correcto es afirmar que este", "f": "Decreto 1069 de 2015, art. 2.2.3.1.2.1, parágrafo 2 (modificado por el Decreto 333 de 2021); Corte Constitucional, Autos 193 de 2021 y 045 de 2022", "o": [["A", "no puede rechazar el conocimiento con base en las reglas de reparto, que son administrativas.", "El parágrafo 2 del artículo 2.2.3.1.2.1 del Decreto 1069 de 2015 dispone que las reglas de reparto no pueden ser invocadas por ningún juez para rechazar la competencia o plantear conflictos negativos. La Corte Constitucional ha reiterado que son reglas administrativas de reparto.", true], ["B", "debe declararse incompetente y remitirla al juez del circuito, que es el competente según el reparto.", "Las reglas de reparto no autorizan al juez a declararse incompetente. El parágrafo 2 lo prohíbe y la Corte Constitucional ha reiterado que esos conflictos son aparentes.", false], ["C", "debe rechazarla de plano y ordenar al ciudadano presentarla de nuevo ante el juez correcto.", "Rechazar la tutela por razones de reparto desconoce el parágrafo 2 y el carácter preferente y sumario de la acción.", false]]}, {"id": "EC-178", "niv": 2, "e": "La orden del juez de suspender la resolución mientras decide la tutela corresponde a", "f": "Decreto 2591 de 1991, art. 7", "o": [["A", "una decisión irregular, porque la suspensión de un acto administrativo solo puede decretarla el juez contencioso administrativo.", "El juez de tutela está expresamente facultado para suspender provisionalmente el acto concreto que amenaza o vulnera el derecho (art. 7).", false], ["B", "una medida provisional que el juez puede adoptar desde la presentación de la solicitud cuando la considere necesaria y urgente.", "El artículo 7 del Decreto 2591 de 1991 permite al juez, desde la presentación de la solicitud y cuando lo considere necesario y urgente para proteger el derecho, suspender la aplicación del acto concreto que lo amenace o vulnere.", true], ["C", "una anticipación del fallo, que solo puede dictarse si el ciudadano presta caución.", "La medida provisional no exige caución ni equivale al fallo. Busca evitar que la amenaza se consume mientras se decide.", false]]}]}, {"comp": "estado_constitucion", "rol": "general", "tag": "Estado y Constitución · Acción de cumplimiento: titulares y trámite", "texto": "Usted es técnico administrativo de una corporación autónoma regional. Un acuerdo del consejo directivo de la corporación le impone publicar semestralmente en su sitio web el informe de seguimiento a las concesiones de agua otorgadas, y no se ha publicado en dos años. El personero de un municipio de la jurisdicción reclamó por escrito el cumplimiento, sin respuesta en más de diez días, y anuncia una acción de cumplimiento. En paralelo, un usuario presentó una «acción de cumplimiento» cuyo verdadero propósito es que se responda un derecho de petición suyo.", "items": [{"id": "EC-179", "niv": 1, "e": "Sobre si el personero puede presentar la acción de cumplimiento, lo correcto es afirmar que", "f": "Ley 393 de 1997, art. 4", "o": [["A", "solo puede hacerlo como apoderado de un usuario de las concesiones de agua que le otorgue poder.", "El personero está legitimado por sí mismo como servidor público (art. 4); no necesita poder de un ciudadano.", false], ["B", "sí puede, porque la ley la concede a cualquier persona y, en especial, a servidores públicos como los personeros.", "El artículo 4 de la Ley 393 de 1997 dispone que cualquier persona puede ejercer la acción de cumplimiento y menciona expresamente a los servidores públicos, en especial a los personeros municipales, entre otros.", true], ["C", "no puede, porque la acción de cumplimiento es exclusiva de los ciudadanos directamente afectados por el incumplimiento de la norma.", "La Ley 393 no limita la acción a los afectados; la concede a cualquier persona y expresamente a servidores públicos y organizaciones.", false]]}, {"id": "EC-180", "niv": 3, "e": "Ante la «acción de cumplimiento» del usuario que busca la respuesta a su derecho de petición, el juez", "f": "Ley 393 de 1997, art. 9", "o": [["A", "la tramitará como acción de cumplimiento, porque el usuario eligió ese mecanismo y el juez no puede cambiarlo.", "La elección del accionante no prevalece: la acción de cumplimiento no procede para proteger derechos que puedan garantizarse por tutela (art. 9).", false], ["B", "la rechazará y ordenará al usuario presentar una tutela por separado.", "La ley no ordena el rechazo: el artículo 9 dispone que el juez le dará a la solicitud el trámite de tutela.", false], ["C", "le dará el trámite de tutela, porque busca proteger un derecho garantizable por esa vía.", "El artículo 9 de la Ley 393 de 1997 dispone que la acción de cumplimiento no procede para proteger derechos que puedan ser garantizados mediante la tutela, y que en esos eventos el juez dará a la solicitud el trámite correspondiente a la tutela. El derecho de petición es fundamental.", true]]}, {"id": "EC-181", "niv": 2, "e": "Si el juez ordena a la corporación publicar el informe, el plazo para cumplir, salvo que el juez justifique uno mayor, no podrá exceder de", "f": "Ley 393 de 1997, art. 21, num. 5", "o": [["A", "cuarenta y ocho horas desde la notificación del fallo.", "Cuarenta y ocho horas es el plazo máximo de cumplimiento de un fallo de tutela (Decreto 2591, art. 29), no de cumplimiento.", false], ["B", "diez días hábiles contados a partir de la ejecutoria del fallo.", "El numeral 5 del artículo 21 de la Ley 393 de 1997 dispone que el plazo para cumplir lo resuelto no podrá exceder de diez días hábiles contados a partir de la ejecutoria del fallo; si se requiere uno mayor, el juez lo sustenta en la sentencia.", true], ["C", "treinta días calendario contados desde la ejecutoria del fallo.", "La ley fija un máximo de diez días hábiles desde la ejecutoria, salvo que el juez justifique un término mayor.", false]]}]}, {"comp": "estado_constitucion", "rol": "general", "tag": "Estado y Constitución · Habeas data: datos sensibles y reclamos", "texto": "Usted es auxiliar administrativo de la Secretaría de la Mujer de un departamento, que construye una base de datos de participantes en un programa de emprendimiento. El formulario pregunta, entre otros datos, por el origen étnico de las participantes. Una participante presentó una queja directamente ante la Superintendencia de Industria y Comercio sin haber reclamado antes a la secretaría. Otra participante pide conocer los datos suyos que reposan en la base y que se le muestre la autorización que firmó al inscribirse; un funcionario propone cobrarle la consulta como si fuera una solicitud de copias y negarle la autorización por ser un documento interno.", "items": [{"id": "EC-182", "niv": 3, "e": "Para recolectar el dato sobre origen étnico, la secretaría debe", "f": "Ley 1581 de 2012, arts. 5 y 6", "o": [["A", "contar con la autorización explícita de la titular, salvo los casos en que la ley no la exija.", "El origen racial o étnico es un dato sensible (art. 5 de la Ley 1581 de 2012). El artículo 6 prohíbe su tratamiento, salvo, entre otros casos, cuando la titular haya dado su autorización explícita, excepto cuando la ley no la requiera.", true], ["B", "recogerlo sin autorización, porque toda información recolectada por una entidad pública está exceptuada.", "La excepción del artículo 10 se refiere a información requerida por una entidad en ejercicio de funciones legales, y no elimina las reglas especiales para datos sensibles; no toda recolección pública está exceptuada.", false], ["C", "informar verbalmente a la participante, porque los datos sobre origen étnico son de naturaleza pública.", "El origen étnico no es un dato público sino sensible (art. 5), por lo que su tratamiento requiere autorización explícita.", false]]}, {"id": "EC-183", "niv": 1, "e": "Sobre la queja presentada directamente ante la Superintendencia de Industria y Comercio, debe tenerse en cuenta que", "f": "Ley 1581 de 2012, art. 16", "o": [["A", "debe presentarse primero ante la Procuraduría, que la remitirá luego a la Superintendencia.", "La Procuraduría no es instancia previa en materia de habeas data. El requisito es agotar la consulta o el reclamo ante el responsable o encargado.", false], ["B", "procede de inmediato, porque la Superintendencia es la autoridad de protección de datos.", "La Superintendencia es la autoridad competente, pero la ley exige un requisito de procedibilidad previo: agotar la consulta o el reclamo ante el responsable.", false], ["C", "solo puede elevarse después de agotar la consulta o el reclamo ante el responsable.", "El artículo 16 de la Ley 1581 de 2012 dispone que el titular o causahabiente solo podrá elevar queja ante la Superintendencia de Industria y Comercio una vez haya agotado el trámite de consulta o reclamo ante el responsable o el encargado del tratamiento.", true]]}, {"id": "EC-184", "niv": 2, "e": "Frente a la solicitud de la otra participante, la secretaría debe", "f": "Ley 1581 de 2012, art. 8, lits. b y f", "o": [["A", "darle acceso gratuito a sus datos y entregarle prueba de la autorización que otorgó al inscribirse.", "El artículo 8 de la Ley 1581 de 2012 reconoce al titular, entre otros, los derechos a solicitar prueba de la autorización otorgada al responsable del tratamiento (lit. b) y a acceder en forma gratuita a sus datos personales que hayan sido objeto de tratamiento (lit. f).", true], ["B", "mostrarle la autorización, pero exigirle una orden judicial para conocer los datos que reposan en la base.", "El titular no necesita orden judicial para conocer sus propios datos: el artículo 8, literal f, le garantiza el acceso gratuito, y el artículo 14 regula la consulta directa ante el responsable.", false], ["C", "cobrarle la consulta según la tarifa de copias y negarle la autorización, por ser un documento interno de la entidad.", "El literal f del artículo 8 de la Ley 1581 garantiza al titular el acceso gratuito a sus datos personales objeto de tratamiento, y el literal b le permite solicitar prueba de la autorización otorgada; ese documento no le es oponible como interno.", false]]}]}, {"comp": "estado_constitucion", "rol": "general", "tag": "Estado y Constitución · Descentralización y aplicación de la Ley 489 de 1998", "texto": "Usted es profesional universitario de la Secretaría de Planeación de un departamento. En una mesa de trabajo sobre la distribución de competencias entre la Nación, el departamento y los municipios, un funcionario afirma que «la Ley 489 de 1998 solo aplica a las entidades nacionales». Además, el alcalde de uno de los municipios pretende delegar en su secretario de Movilidad la expedición del reglamento general de tránsito y estacionamiento del municipio, sin que ninguna ley lo autorice.", "items": [{"id": "EC-185", "niv": 2, "e": "Según el criterio orientador de la Ley 489 de 1998 sobre distribución de competencias, en lo posible la prestación de los servicios debe corresponder", "f": "Ley 489 de 1998, art. 7", "o": [["A", "a la Nación, que la contrata con los municipios y la controla por medio de los departamentos.", "El criterio de la Ley 489 busca acercar la prestación a los municipios, no concentrarla en la Nación.", false], ["B", "a los departamentos, el control a la Nación y la definición de políticas a los municipios.", "Invierte el criterio legal. El artículo 7 asigna la prestación a los municipios, el control a los departamentos y las políticas a la Nación.", false], ["C", "a los municipios, el control sobre dicha prestación a los departamentos y la definición de políticas a la Nación.", "El artículo 7 de la Ley 489 de 1998 señala el criterio de que la prestación de los servicios corresponda a los municipios, el control sobre dicha prestación a los departamentos y la definición de planes, políticas y estrategias a la Nación.", true]]}, {"id": "EC-186", "niv": 3, "e": "Frente a la afirmación del funcionario sobre el alcance de la Ley 489 de 1998, lo correcto es señalar que", "f": "Ley 489 de 1998, art. 2, parágrafo", "o": [["A", "varias de sus reglas, como las de delegación y entidades descentralizadas, se aplican en lo pertinente a las entidades territoriales.", "El parágrafo del artículo 2 de la Ley 489 de 1998 dispone que las reglas sobre principios de la función administrativa, delegación y desconcentración, entidades descentralizadas, participación y control interno, entre otras, se aplican en lo pertinente a las entidades territoriales, sin perjuicio de su autonomía.", true], ["B", "solo aplica a las entidades nacionales, porque las territoriales se rigen exclusivamente por ordenanzas y acuerdos.", "El parágrafo del artículo 2 extiende expresamente varias de sus reglas a las entidades territoriales, en lo pertinente y sin perjuicio de su autonomía.", false], ["C", "aplica íntegramente a las entidades territoriales, sin consideración alguna a la autonomía que les reconoce la Constitución Política.", "La aplicación es en lo pertinente y sin perjuicio de la autonomía territorial; no es una aplicación íntegra e incondicionada.", false]]}, {"id": "EC-187", "niv": 3, "e": "Sobre la delegación del reglamento general de tránsito y estacionamiento, usted debe conceptuar que", "f": "Ley 489 de 1998, art. 11, num. 1", "o": [["A", "es procedente, porque el secretario de Movilidad tiene funciones afines y complementarias a la materia.", "La afinidad de funciones es un requisito general de la delegación, pero no habilita delegar lo que la ley prohíbe: los reglamentos de carácter general no son delegables salvo autorización legal expresa.", false], ["B", "no es procedente, porque la expedición de reglamentos de carácter general solo se delega cuando la ley lo autoriza.", "El numeral 1 del artículo 11 de la Ley 489 de 1998 prohíbe transferir mediante delegación la expedición de reglamentos de carácter general, salvo en los casos expresamente autorizados por la ley, autorización que el caso descarta.", true], ["C", "es procedente si el alcalde conserva la facultad de reasumir la función en cualquier momento.", "La posibilidad de reasumir la función es un efecto de toda delegación válida, pero no sanea una delegación prohibida por el artículo 11.", false]]}]}, {"comp": "estado_constitucion", "rol": "profesional", "tag": "Estado y Constitución · Nivel profesional · Acción popular: pacto de cumplimiento", "texto": "Usted es profesional universitario de la oficina jurídica de un municipio de tercera categoría, demandado en una acción popular por la falta de mantenimiento de un puente peatonal que pone en riesgo a los habitantes de un barrio. El demandante había pedido a la alcaldía, un mes antes de demandar, que adoptara medidas, sin obtener respuesta. La alcaldía alega que la demanda debe rechazarse porque el demandante no interpuso recursos administrativos. El juez convocó a la audiencia de pacto de cumplimiento y el secretario de Infraestructura pregunta si es necesario asistir.", "items": [{"id": "EC-188", "niv": 2, "e": "Sobre la asistencia del secretario de Infraestructura a la audiencia, usted debe advertirle que", "f": "Ley 472 de 1998, art. 27", "o": [["A", "es opcional, porque la alcaldía puede enviar sus argumentos por escrito antes de la audiencia.", "La Ley 472 hace obligatoria la intervención de la entidad responsable de velar por el derecho colectivo; el escrito no sustituye su asistencia.", false], ["B", "solo es obligatoria si el juez lo cita personalmente por su nombre en el auto que fija la audiencia.", "La obligación se predica de los funcionarios competentes de la entidad responsable, sin que la ley exija citación nominal.", false], ["C", "es obligatoria la intervención de la entidad y su inasistencia es causal de mala conducta.", "El artículo 27 de la Ley 472 de 1998 dispone que la intervención del Ministerio Público y de la entidad responsable de velar por el derecho colectivo es obligatoria, y que la inasistencia de los funcionarios competentes constituye causal de mala conducta sancionable con destitución.", true]]}, {"id": "EC-189", "niv": 3, "e": "Si en el proyecto de pacto el juez advierte un vicio de ilegalidad, lo procedente es que", "f": "Ley 472 de 1998, art. 27", "o": [["A", "lo apruebe de todas formas, porque en el pacto prevalece la voluntad de las partes sobre la legalidad.", "El juez no puede aprobar un pacto ilegal. La ley le ordena corregir los vicios con el consentimiento de las partes.", false], ["B", "lo corrija con el consentimiento de las partes; si estas no consienten, la audiencia se considera fallida.", "El artículo 27 de la Ley 472 de 1998 dispone que el juez revisa el pacto en cinco días y que, si observa vicios de ilegalidad, los corrige con el consentimiento de las partes interesadas; la audiencia se considera fallida cuando las partes no consienten en las correcciones.", true], ["C", "declare la nulidad de todo lo actuado y ordene al demandante presentar una nueva demanda.", "La ley no prevé la nulidad del proceso por esta causa; si no hay acuerdo sobre las correcciones, la audiencia se declara fallida y el proceso continúa con la etapa probatoria.", false]]}, {"id": "EC-190", "niv": 3, "e": "Frente al argumento de la alcaldía sobre los recursos administrativos, usted debe conceptuar que", "f": "Ley 472 de 1998, art. 10; Ley 1437 de 2011, art. 144", "o": [["A", "no prospera, porque la acción popular no exige recursos previos y el demandante ya hizo la reclamación ante la alcaldía.", "El artículo 10 de la Ley 472 de 1998 dispone que no es necesario interponer previamente los recursos administrativos para intentar la acción popular. El requisito del artículo 144 de la Ley 1437 de 2011, la reclamación previa con quince días para responder, se cumplió.", true], ["B", "prospera, porque toda acción contra la administración exige agotar previamente los recursos procedentes.", "La acción popular tiene una regla especial: el artículo 10 de la Ley 472 dispone que no es necesario interponer previamente los recursos administrativos.", false], ["C", "prospera, porque el demandante debía esperar tres meses para que se configurara el silencio administrativo.", "El requisito previo de la acción popular es la reclamación con un plazo de quince días (art. 144 de la Ley 1437), que el demandante cumplió; no se exige esperar el silencio administrativo.", false]]}]}, {"comp": "estado_constitucion", "rol": "general", "tag": "Estado y Constitución · Rendición de cuentas: concejo y audiencias", "texto": "Usted es técnico administrativo de la oficina de planeación de un municipio de quinta categoría. El alcalde presentó al concejo su informe anual de rendición de cuentas, y la mesa directiva pregunta de cuánto tiempo dispone para evaluarlo. Además, el jefe de planeación reconoce que la alcaldía no ha desarrollado espacios de diálogo con la ciudadanía y pregunta qué obligación tiene en ese caso. En la reunión, un concejal pide definir qué se entiende por rendición de cuentas.", "items": [{"id": "EC-191", "niv": 2, "e": "Para evaluar, dictaminar y responder el informe anual de rendición de cuentas del alcalde, el concejo dispone de", "f": "Ley 1757 de 2015, art. 57, parágrafo", "o": [["A", "quince días hábiles.", "No corresponde al término legal. El parágrafo del artículo 57 de la Ley 1757 fija un mes.", false], ["B", "un mes.", "El parágrafo del artículo 57 de la Ley 1757 de 2015 dispone que los concejos municipales y distritales, las asambleas y las juntas administradoras locales tienen un mes de plazo para evaluar, dictaminar y responder los informes anuales de rendición de cuentas de alcaldes y gobernadores.", true], ["C", "tres meses.", "Tres meses es el plazo en el que los presidentes de las corporaciones elaboran su propio informe de rendición de cuentas (art. 59), no el término para evaluar el informe del alcalde.", false]]}, {"id": "EC-192", "niv": 1, "e": "Si la alcaldía no adelanta espacios de diálogo para la rendición de cuentas, está obligada a realizar audiencias públicas participativas como mínimo", "f": "Ley 1757 de 2015, art. 53", "o": [["A", "una vez al año.", "La ley exige una periodicidad mayor cuando la entidad no adelanta espacios de diálogo: mínimo dos veces al año.", false], ["B", "dos veces al año.", "El artículo 53 de la Ley 1757 de 2015 dispone que, si una entidad no adelanta espacios de diálogo para la rendición de cuentas, estará obligada a realizar audiencias públicas participativas mínimo dos veces al año.", true], ["C", "cuatro veces al año.", "La ley no exige una audiencia trimestral; el mínimo es de dos audiencias al año.", false]]}, {"id": "EC-193", "niv": 1, "e": "Al concejal debe explicarse que la rendición de cuentas es", "f": "Ley 1757 de 2015, art. 48", "o": [["A", "una auditoría que realiza la contraloría sobre los resultados de la gestión de la alcaldía.", "La auditoría es un instrumento del control fiscal. La rendición de cuentas es un proceso de la propia administración ante la ciudadanía.", false], ["B", "un informe escrito que el alcalde entrega una vez al año al concejo municipal, sin participación directa de la ciudadanía.", "La rendición de cuentas no se reduce al informe ante el concejo; la ley la define como un proceso dirigido a ciudadanos, sociedad civil, entidades y órganos de control, a partir del diálogo.", false], ["C", "un proceso en el que las entidades informan y explican su gestión a partir del diálogo, como expresión de control social.", "El artículo 48 de la Ley 1757 de 2015 define la rendición de cuentas como el proceso mediante el cual las entidades y servidores informan, explican y dan a conocer los resultados de su gestión a la ciudadanía y otros actores, a partir de la promoción del diálogo, y la califica como expresión de control social.", true]]}]}, {"comp": "estado_constitucion", "rol": "general", "tag": "Estado y Constitución · Veedurías y control fiscal", "texto": "Usted es técnico administrativo de un instituto distrital de Bogotá que ejecuta un programa de comedores comunitarios con recursos públicos, operado por una fundación privada. Una veeduría ciudadana vigila el programa y presentó una denuncia ante la Contraloría de Bogotá por posibles sobrecostos. El director del instituto propone pagar honorarios a los veedores «para que hagan mejor su trabajo», y la fundación operadora sostiene que, por ser privada, la veeduría no puede vigilarla.", "items": [{"id": "EC-194", "niv": 2, "e": "Recibida la denuncia de la veeduría, la primera etapa del proceso común de atención de denuncias en el organismo de control fiscal es", "f": "Ley 850 de 2003, art. 16A (adicionado por la Ley 1757 de 2015, art. 70)", "o": [["A", "la evaluación de la denuncia y la determinación de la competencia del organismo.", "El artículo 16A de la Ley 850 de 2003, adicionado por el artículo 70 de la Ley 1757 de 2015, establece un proceso común de atención de denuncias en los organismos de control fiscal cuya primera etapa es la evaluación y determinación de competencia, seguida de la atención inicial, el traslado y la respuesta al ciudadano.", true], ["B", "el traslado inmediato al proceso de responsabilidad fiscal contra el ordenador del gasto.", "El traslado al proceso auditor o de responsabilidad fiscal es la tercera etapa, después de evaluar la competencia y recaudar pruebas.", false], ["C", "la respuesta al ciudadano informándole el archivo o la apertura del proceso.", "La respuesta al ciudadano es la última etapa del proceso común previsto en el artículo 16A.", false]]}, {"id": "EC-195", "niv": 2, "e": "Frente a la propuesta del director de pagar honorarios a los veedores, usted debe advertir que", "f": "Ley 850 de 2003, art. 8", "o": [["A", "es viable, siempre que lo autorice previamente la personería que inscribió la veeduría.", "La personería no puede autorizar lo que la ley prohíbe; el pago desconoce la autonomía de la veeduría.", false], ["B", "es viable, siempre que el pago se haga mediante un contrato de prestación de servicios.", "La forma de vinculación no cambia la conclusión: los veedores no pueden ser pagados por las entidades, por el principio de autonomía (art. 8).", false], ["C", "contraría la autonomía de las veedurías, cuyos miembros no dependen de las entidades públicas ni son pagados por ellas.", "El artículo 8 de la Ley 850 de 2003 dispone que las veedurías gozan de plena autonomía frente a las entidades públicas y los organismos de control, por lo que los veedores no dependen de ellas ni son pagados por ellas. Si la entidad vigilada pagara a los veedores, la veeduría perdería su independencia frente a quien debe vigilar.", true]]}, {"id": "EC-196", "niv": 3, "e": "Frente a la posición de la fundación operadora, lo correcto es señalar que la veeduría", "f": "Ley 850 de 2003, arts. 1 y 5", "o": [["A", "puede vigilarla en la ejecución del programa, porque este se financia con recursos públicos.", "El artículo 1 de la Ley 850 de 2003 permite a las veedurías vigilar a entidades públicas o privadas encargadas de ejecutar un programa, proyecto o contrato, en los ámbitos en que se empleen recursos públicos, y el artículo 5 extiende la vigilancia a particulares que cumplan funciones públicas.", true], ["B", "puede vigilarla en todas sus actividades, incluidas las que financia con recursos propios.", "La vigilancia se ejerce en los ámbitos en que se emplean recursos públicos (art. 1), no sobre toda la actividad privada de la fundación.", false], ["C", "no puede vigilarla, porque las veedurías solo ejercen vigilancia sobre entidades y servidores públicos.", "La Ley 850 permite vigilar también a entidades privadas y organizaciones no gubernamentales encargadas de ejecutar programas, proyectos o contratos con recursos públicos (art. 1).", false]]}]}, {"comp": "estado_constitucion", "rol": "general", "tag": "Estado y Constitución · Enfoque diferencial y diversidad étnica", "texto": "Usted es técnico administrativo de la Secretaría de Desarrollo Social de un departamento con presencia de comunidades indígenas. Varias mujeres de una comunidad que habla su lengua propia acuden a inscribirse en un programa de apoyo a artesanas. Un compañero propone exigir que diligencien el formulario en castellano. Por otra parte, el programa reserva el 30 % de los cupos a mujeres indígenas artesanas, y un ciudadano no indígena presenta una petición en la que califica esa reserva como discriminatoria. La coordinación también propone asignar puntaje adicional en la selección a mujeres con discapacidad.", "items": [{"id": "EC-197", "niv": 1, "e": "Frente a la propuesta de exigir el formulario en castellano, la actuación acorde con la Constitución es", "f": "Constitución Política, art. 7", "o": [["A", "remitir a las mujeres a la autoridad indígena para que ella tramite la inscripción en su nombre.", "Trasladar el trámite a la autoridad indígena no garantiza la atención directa por parte de la secretaría, que es la responsable del programa.", false], ["B", "exigir el castellano, porque es el idioma oficial de Colombia y garantiza la igualdad de trato en el trámite.", "Imponer el castellano sin apoyo excluye a quienes hablan una lengua propia. El artículo 7 obliga al Estado a reconocer y proteger la diversidad étnica y cultural.", false], ["C", "adaptar la atención, por ejemplo con un intérprete, porque el Estado protege la diversidad étnica y cultural.", "El artículo 7 de la Constitución dispone que el Estado reconoce y protege la diversidad étnica y cultural de la Nación. Adaptar la atención a la lengua de las solicitantes materializa ese mandato y el enfoque diferencial.", true]]}, {"id": "EC-198", "niv": 2, "e": "La asignación de puntaje adicional a mujeres con discapacidad en la selección del programa corresponde a", "f": "Ley 1618 de 2013, art. 2, num. 3", "o": [["A", "un ajuste razonable, porque adapta el entorno físico del programa a sus necesidades.", "Un ajuste razonable adapta condiciones concretas para permitir el ejercicio de un derecho; el puntaje adicional no adapta el entorno, sino que favorece al grupo para reducir desigualdades, lo que es una acción afirmativa.", false], ["B", "una acción afirmativa, dirigida a favorecer a personas con discapacidad para reducir las desigualdades que las afectan.", "El numeral 3 del artículo 2 de la Ley 1618 de 2013 define las acciones afirmativas como políticas, medidas o acciones dirigidas a favorecer a personas o grupos con algún tipo de discapacidad, con el fin de eliminar o reducir las desigualdades y barreras que los afectan.", true], ["C", "un trato discriminatorio prohibido, porque otorga una ventaja a un grupo frente a los demás aspirantes.", "El artículo 13 de la Constitución ordena adoptar medidas en favor de grupos discriminados o marginados; las acciones afirmativas razonables no son discriminación prohibida.", false]]}, {"id": "EC-199", "niv": 3, "e": "En la respuesta a la petición del ciudadano que considera discriminatoria la reserva de cupos, la secretaría debe explicar que la medida", "f": "Constitución Política, art. 13, inc. 2", "o": [["A", "es compatible con la igualdad si busca reducir una desigualdad real del grupo y es razonable y proporcionada.", "El inciso 2 del artículo 13 de la Constitución ordena al Estado promover las condiciones para que la igualdad sea real y efectiva y adoptar medidas en favor de grupos discriminados o marginados. Una reserva de cupos razonable y proporcionada que atienda una desigualdad real es una medida de ese tipo.", true], ["B", "es legítima sin necesidad de justificación, porque los programas sociales son decisiones discrecionales del gobernador.", "Las medidas diferenciadas deben estar justificadas y ser razonables y proporcionadas; la discrecionalidad no exime de respetar la igualdad.", false], ["C", "está prohibida, porque el artículo 13 impide cualquier trato diferente por razones de sexo o de raza.", "El artículo 13 prohíbe la discriminación, pero su inciso 2 ordena al Estado adoptar medidas en favor de grupos discriminados o marginados. Un trato diferente justificado no es discriminación.", false]]}]}, {"comp": "empleo_publico", "rol": "profesional", "tag": "Empleo público, carrera y régimen disciplinario · Nivel profesional · Clases de empleos públicos", "texto": "Usted es profesional universitario de la oficina de talento humano de una alcaldía de tercera categoría. El alcalde le pide revisar la planta de personal antes de actualizar el manual de funciones. Le interesan tres empleos: el de secretario de Hacienda, que fija las directrices de la política fiscal del municipio; el de auxiliar administrativo de la Secretaría de Gobierno, que radica correspondencia y actualiza bases de datos sin funciones de confianza ni de manejo; y un nuevo empleo que se quiere crear para ejecutar, durante diez meses, un programa de formalización de predios financiado con recursos de un convenio, actividad que no hace parte de las funciones permanentes de la entidad.", "items": [{"id": "EP-101", "niv": 1, "e": "Respecto del empleo de secretario de Hacienda, usted conceptúa que se trata de un empleo", "f": "Ley 909 de 2004, arts. 1 y 5 (num. 2, lit. a)", "o": [["A", "de carrera administrativa, porque en la planta territorial todos los empleos se proveen por concurso.", "La carrera es la regla general, pero la misma ley exceptúa los empleos de dirección y orientación institucional; afirmar que todos se proveen por concurso desconoce las excepciones del art. 5 de la Ley 909 de 2004.", false], ["B", "de período fijo, porque su titular permanece en el cargo durante el período constitucional del alcalde.", "Los empleos de período son aquellos a los que la Constitución o la ley les fija un período (por ejemplo, ciertos cargos de elección); el secretario de despacho no tiene período legal y puede ser removido en cualquier momento por el nominador.", false], ["C", "de libre nombramiento y remoción, porque implica la dirección y adopción de políticas institucionales.", "La Ley 909 de 2004 (art. 5, num. 2, lit. a) clasifica como de libre nombramiento y remoción los empleos de dirección, conducción y orientación institucionales cuyo ejercicio implica adoptar políticas o directrices; el secretario de despacho que fija la política fiscal encaja en ese criterio.", true]]}, {"id": "EP-102", "niv": 1, "e": "Sobre el empleo de auxiliar administrativo de la Secretaría de Gobierno, lo procedente es indicar que", "f": "Constitución Política, art. 125; Ley 909 de 2004, art. 5", "o": [["A", "es de carrera administrativa y su provisión definitiva requiere concurso de méritos.", "La regla general del art. 125 de la Constitución y del art. 5 de la Ley 909 de 2004 es que los empleos son de carrera, salvo las excepciones legales; un auxiliar sin funciones de confianza ni de manejo no encaja en ninguna, por lo que su provisión definitiva se hace por concurso.", true], ["B", "es un empleo temporal, porque sus funciones son de apoyo y pueden suprimirse cuando cambie la administración.", "Los empleos temporales se crean por razones excepcionales y con duración determinada (art. 21 de la Ley 909 de 2004); las funciones permanentes de apoyo de una secretaría no cumplen esas condiciones.", false], ["C", "puede proveerse libremente por el alcalde, porque el nivel asistencial no está sujeto al sistema de mérito.", "Ningún nivel jerárquico está excluido como tal del mérito: el art. 5 de la Ley 909 de 2004 enumera excepciones por la naturaleza de las funciones (dirección, confianza, manejo de bienes, etc.), no por el nivel asistencial.", false]]}, {"id": "EP-103", "niv": 2, "e": "Si se crea el empleo para el programa de formalización de predios, su provisión deberá hacerse", "f": "Ley 909 de 2004, art. 21", "o": [["A", "mediante un concurso abierto convocado por la CNSC exclusivamente para ese empleo, con período de prueba de seis meses.", "La ley no exige un concurso específico ni período de prueba para el empleo temporal; ordena acudir primero a las listas de elegibles vigentes y, si no es posible, a una evaluación de capacidades.", false], ["B", "con las listas de elegibles vigentes y, si no es posible usarlas, mediante una evaluación de capacidades y competencias de los candidatos.", "El art. 21, num. 3, de la Ley 909 de 2004 dispone que el ingreso a los empleos temporales se haga con base en las listas de elegibles vigentes para empleos permanentes, sin que ello retire a la persona de la lista, y que, de no ser posible, se adelante un proceso de evaluación de las capacidades y competencias de los candidatos.", true], ["C", "mediante nombramiento provisional, escogido libremente por el alcalde entre los candidatos que cumplan requisitos.", "El nombramiento provisional es una forma transitoria de proveer empleos de carrera mientras se surte el concurso; para los empleos temporales la ley fija un mecanismo propio basado en listas de elegibles o evaluación de competencias.", false]]}]}, {"comp": "empleo_publico", "rol": "profesional", "tag": "Empleo público, carrera y régimen disciplinario · Nivel profesional · Encargo en empleos de carrera", "texto": "Usted es profesional especializado del área de talento humano de una gobernación. Quedó vacante de manera definitiva un empleo de profesional universitario grado 02 de la Secretaría de Planeación y la entidad ya reportó la vacante para el próximo concurso. Mientras tanto, debe proyectar el encargo. En la planta hay tres empleados de carrera que desempeñan el empleo inmediatamente inferior y cumplen requisitos: Laura, con evaluación sobresaliente y una sanción disciplinaria de amonestación escrita ejecutoriada hace ocho meses; Andrés, con evaluación sobresaliente y sin sanciones; y Diana, con evaluación satisfactoria, sin sanciones y con mayor antigüedad que los otros dos.", "items": [{"id": "EP-104", "niv": 2, "e": "Para efectos del encargo, usted concluye que el derecho preferencial corresponde a", "f": "Ley 909 de 2004, art. 24 (modificado por el art. 1 de la Ley 1960 de 2019)", "o": [["A", "el empleado Andrés, porque reúne la evaluación sobresaliente y no registra sanciones en el último año.", "El art. 24 de la Ley 909 de 2004, modificado por la Ley 1960 de 2019, exige requisitos y aptitudes, no haber sido sancionado disciplinariamente en el último año y tener última evaluación sobresaliente; Andrés cumple todo, mientras Laura fue sancionada hace ocho meses.", true], ["B", "la empleada Diana, porque su mayor antigüedad en la entidad prevalece sobre el resultado de la evaluación del desempeño.", "La Ley 909 de 2004 (art. 24, mod. Ley 1960 de 2019) no toma la antigüedad como criterio preferente: el derecho se otorga a quien tenga evaluación sobresaliente y cumpla las demás condiciones.", false], ["C", "la empleada Laura, porque la amonestación escrita es una sanción leve que no afecta el derecho al encargo.", "La norma excluye a quien haya sido sancionado disciplinariamente en el último año, sin distinguir la clase de sanción; la amonestación impuesta hace ocho meses impide a Laura acceder al encargo.", false]]}, {"id": "EP-105", "niv": 2, "e": "Si ninguno de los empleados del cargo inmediatamente inferior tuviera evaluación sobresaliente, el encargo debería", "f": "Ley 909 de 2004, art. 24 (modificado por el art. 1 de la Ley 1960 de 2019)", "o": [["A", "otorgarse al empleado con más tiempo de servicio, como criterio de desempate previsto en la ley.", "La antigüedad no es el criterio legal; la norma se refiere a las más altas calificaciones del desempeño, descendiendo de sobresaliente a satisfactorio.", false], ["B", "sustituirse por un nombramiento provisional, porque solo la evaluación sobresaliente habilita el encargo.", "La ley no elimina el encargo cuando no hay sobresalientes; ordena descender al nivel satisfactorio. El nombramiento provisional procede solo cuando no es posible el encargo.", false], ["C", "recaer en quienes tengan las calificaciones más altas, descendiendo del nivel sobresaliente al satisfactorio.", "Así lo dispone el inciso segundo del art. 24 de la Ley 909 de 2004 (mod. Ley 1960 de 2019): a falta de sobresalientes, el encargo recae en quienes tengan las más altas calificaciones, de acuerdo con el sistema de evaluación que aplique la entidad.", true]]}, {"id": "EP-106", "niv": 3, "e": "Si el encargo de Andrés se prolonga y antes del concurso el nominador decide terminarlo, deberá hacerlo", "f": "Decreto 1083 de 2015, arts. 2.2.5.3.4 y 2.2.5.5.46; Ley 909 de 2004, art. 42", "o": [["A", "solo cuando se publique la lista de elegibles, porque antes de ello el encargo no puede darse por terminado.", "El reglamento permite que el nominador dé por terminado el encargo antes de cumplirse su término, siempre que lo haga mediante resolución motivada; no lo condiciona a la publicación de la lista.", false], ["B", "mediante resolución motivada, y Andrés volverá a ejercer el empleo del cual es titular sin perder sus derechos de carrera.", "El Decreto 1083 de 2015 (art. 2.2.5.3.4) permite terminar el encargo antes de su término por resolución motivada; al cesar, el encargado reasume su empleo (art. 2.2.5.5.46), y el art. 42, num. 3, de la Ley 909 de 2004 dispone que los derechos de carrera no se pierden por el encargo.", true], ["C", "de manera verbal, porque el encargo es una situación transitoria que no genera derechos para el encargado.", "El encargo se confiere y termina mediante acto administrativo; el reglamento exige resolución motivada para darlo por terminado antes de su término.", false]]}]}, {"comp": "empleo_publico", "rol": "general", "tag": "Empleo público, carrera y régimen disciplinario · Provisión de vacancias", "texto": "Usted trabaja en la oficina de talento humano de una corporación autónoma regional de la región Caribe. Debe atender tres novedades: el jefe de la Oficina Asesora de Comunicaciones, empleo de libre nombramiento y remoción, renunció y la vacante es definitiva; una técnica administrativa de carrera, adscrita a la subdirección de gestión ambiental, obtuvo licencia no remunerada de doce meses para adelantar una maestría, y en la planta no hay empleados de carrera que puedan ser encargados en su empleo; y quedó una vacante definitiva de auxiliar administrativo, empleo de carrera, para la cual tampoco hay servidores de carrera con derecho a encargo, mientras se surte el concurso.", "items": [{"id": "EP-107", "niv": 2, "e": "Si la vacante de la Oficina Asesora de Comunicaciones se provee mediante encargo, este podrá durar", "f": "Ley 909 de 2004, art. 24 (modificado por el art. 1 de la Ley 1960 de 2019)", "o": [["A", "hasta tres meses, prorrogables por tres meses más, vencidos los cuales el empleo debe proveerse en forma definitiva.", "El art. 24 de la Ley 909 de 2004, modificado por la Ley 1960 de 2019, dispone que, en vacancia definitiva de un empleo de libre nombramiento y remoción, el encargo es hasta por tres meses prorrogables por tres meses más, y luego el empleo debe proveerse en forma definitiva.", true], ["B", "todo el tiempo que el nominador considere necesario, porque los empleos de libre nombramiento no tienen límite de encargo.", "La ley sí limita el encargo en vacancia definitiva de los empleos de libre nombramiento y remoción y exige su provisión definitiva al vencer el término.", false], ["C", "hasta seis meses improrrogables, porque es el término general de los encargos en empleos de carrera.", "El término aplicable a la vacancia definitiva de un empleo de libre nombramiento y remoción no es de seis meses improrrogables; el art. 24 de la Ley 909 de 2004 fija tres meses prorrogables por otros tres.", false]]}, {"id": "EP-108", "niv": 2, "e": "Para cubrir el empleo de la técnica administrativa durante su licencia de estudios, la corporación podrá", "f": "Ley 909 de 2004, art. 25; Decreto 1083 de 2015, arts. 2.2.5.2.2 y 2.2.5.4.2", "o": [["A", "declarar la vacancia definitiva del empleo y reportarlo a la CNSC para que se incluya en el próximo concurso.", "La licencia no remunerada para estudios produce vacancia temporal, no definitiva; la titular conserva su empleo y debe reintegrarse al terminar la licencia.", false], ["B", "hacer un nombramiento provisional que durará únicamente mientras se mantenga la licencia de estudios de la titular.", "El art. 25 de la Ley 909 de 2004 permite proveer en forma provisional los empleos de carrera cuyos titulares estén en situaciones que impliquen separación temporal, solo por el tiempo que duren esas situaciones y cuando no sea posible el encargo con servidores de carrera, como ocurre en el caso.", true], ["C", "trasladar a otro empleado de carrera al empleo, porque el traslado es la figura propia de las vacancias temporales.", "El traslado procede para proveer un cargo vacante definitivamente (Decreto 1083 de 2015, art. 2.2.5.4.2); no es la figura para cubrir una vacancia temporal.", false]]}, {"id": "EP-109", "niv": 3, "e": "Para proveer transitoriamente el empleo de auxiliar administrativo mediante nombramiento provisional, la entidad debe tener en cuenta que", "f": "Decreto 1083 de 2015 (provisión transitoria de vacancias definitivas de carrera); Ley 1952 de 2019, art. 39", "o": [["A", "solo puede nombrar a quien esté inscrito en una lista de elegibles vigente de otra entidad, porque así lo exige la Ley 1960 de 2019.", "El nombramiento provisional no exige estar en una lista de elegibles; las listas se usan para la provisión definitiva y, en el caso de los empleos temporales, para su ingreso.", false], ["B", "debe preferir a quien tenga mayor experiencia en el sector ambiental, aunque no cumpla todos los requisitos del manual.", "Todo nombramiento exige cumplir los requisitos del empleo; nombrar a quien no los reúne es incluso una prohibición disciplinaria (Ley 1952 de 2019, art. 39, num. 15).", false], ["C", "se dará prelación a jóvenes entre 18 y 28 años que cumplan los requisitos, una vez agotado el derecho preferencial de encargo.", "El Decreto 1083 de 2015, en las reglas de provisión de vacancias definitivas de carrera, dispone que en los nombramientos provisionales se dé prelación a los jóvenes entre 18 y 28 años que cumplan los requisitos, siempre que se haya agotado el derecho preferencial de encargo.", true]]}]}, {"comp": "empleo_publico", "rol": "general", "tag": "Empleo público, carrera y régimen disciplinario · Concurso de méritos y lista de elegibles", "texto": "Una alcaldía distrital participa en un proceso de selección de la Comisión Nacional del Servicio Civil. Usted, técnico administrativo de la Dirección de Talento Humano, recibe tres consultas: un aspirante pide que se le admitan documentos de experiencia que no cargó en la plataforma dentro de la fecha fijada en la convocatoria, porque «la alcaldía puede flexibilizar las reglas»; el jefe de la dependencia pregunta cuánto tiempo podrá usarse la lista de elegibles una vez quede en firme; y la secretaria general pregunta si con esa lista se puede cubrir una vacante definitiva de un empleo equivalente que no fue convocado y que surgió tres meses después de la convocatoria en la misma alcaldía.", "items": [{"id": "EP-110", "niv": 1, "e": "Frente a la solicitud del aspirante, usted le responde que", "f": "Ley 909 de 2004, art. 31, num. 1", "o": [["A", "puede radicar los documentos como derecho de petición para que se valoren en la etapa de pruebas escritas.", "El derecho de petición no sirve para modificar las reglas del concurso ni para acreditar requisitos por fuera de los plazos de la convocatoria, que es obligatoria para todos.", false], ["B", "la convocatoria es la norma reguladora del concurso y obliga por igual a la administración, a la entidad que lo ejecuta y a los participantes.", "El art. 31, num. 1, de la Ley 909 de 2004 define la convocatoria como norma reguladora de todo concurso, que obliga a la administración, a las entidades contratadas para realizarlo y a los participantes; por eso no es posible aceptar documentos por fuera de las fechas fijadas.", true], ["C", "la alcaldía puede recibir los documentos, porque como entidad nominadora tiene la facultad de ajustar los plazos del concurso.", "La entidad no puede modificar unilateralmente las reglas: la convocatoria la obliga igual que a los aspirantes, según el art. 31, num. 1, de la Ley 909 de 2004.", false]]}, {"id": "EP-111", "niv": 1, "e": "Al jefe de la dependencia usted le informa que la lista de elegibles tendrá una vigencia de", "f": "Ley 909 de 2004, art. 31, num. 4 (modificado por el art. 6 de la Ley 1960 de 2019)", "o": [["A", "un año, contado desde su firmeza.", "Ese era un término de normas anteriores; la Ley 909 de 2004, modificada por la Ley 1960 de 2019, fija hoy una vigencia de dos años.", false], ["B", "dos años.", "El art. 31, num. 4, de la Ley 909 de 2004, modificado por el art. 6 de la Ley 1960 de 2019, establece que la lista de elegibles, elaborada en estricto orden de mérito, tendrá una vigencia de dos años.", true], ["C", "cuatro años.", "La vigencia de cuatro años corresponde a la lista para elegir a los comisionados de la CNSC (art. 9 de la Ley 909 de 2004), no a las listas de los procesos de selección de empleos de carrera.", false]]}, {"id": "EP-112", "niv": 3, "e": "A la secretaria general usted le responde que la vacante del empleo equivalente", "f": "Ley 909 de 2004, art. 31, num. 4 (modificado por el art. 6 de la Ley 1960 de 2019)", "o": [["A", "no puede cubrirse con la lista, porque esta solo sirve para los empleos expresamente ofertados en la convocatoria.", "La Ley 1960 de 2019 amplió el uso de la lista: además de las vacantes convocadas, cubre las vacantes definitivas de cargos equivalentes no convocados que surjan después de la convocatoria en la misma entidad.", false], ["B", "puede cubrirse con la lista de cualquier entidad del distrito, siempre que el empleo tenga igual denominación y grado.", "La norma limita el uso a cargos equivalentes de la misma entidad que adelantó el concurso; no autoriza usar listas de otras entidades por la sola coincidencia de denominación y grado.", false], ["C", "puede cubrirse con la lista, en estricto orden de mérito, porque es un cargo equivalente no convocado que surgió con posterioridad en la misma entidad.", "El art. 31, num. 4, de la Ley 909 de 2004, modificado por la Ley 1960 de 2019, dispone que con la lista se cubran las vacantes convocadas y las vacantes definitivas de cargos equivalentes no convocados que surjan con posterioridad a la convocatoria en la misma entidad.", true]]}]}, {"comp": "empleo_publico", "rol": "general", "tag": "Empleo público, carrera y régimen disciplinario · Período de prueba", "texto": "En un instituto descentralizado del orden departamental se posesionaron en período de prueba dos personas que ganaron el concurso: Mónica, que nunca había estado vinculada a la carrera administrativa, en un empleo de técnico operativo; y Julián, inscrito en carrera como auxiliar administrativo del mismo instituto, en un empleo de profesional universitario. Usted, que apoya la coordinación de talento humano, debe orientar al jefe de cada uno sobre el período de prueba y sobre qué hacer con el empleo de auxiliar administrativo que Julián deja mientras dura su prueba.", "items": [{"id": "EP-113", "niv": 1, "e": "Sobre la duración del período de prueba, usted informa a los jefes que esta es de", "f": "Ley 909 de 2004, art. 31, num. 5", "o": [["A", "tres meses.", "Tres meses es el término del encargo en vacancia definitiva de empleos de libre nombramiento (art. 24 de la Ley 909 de 2004), no la duración del período de prueba.", false], ["B", "seis meses.", "El art. 31, num. 5, de la Ley 909 de 2004 establece que quien es seleccionado por concurso será nombrado en período de prueba por seis meses, al final de los cuales se evalúa su desempeño.", true], ["C", "un año.", "Un año es el período anual de la evaluación del desempeño de los empleados de carrera, no la duración del período de prueba, que la ley fija en seis meses.", false]]}, {"id": "EP-114", "niv": 2, "e": "Si Mónica obtiene una calificación no satisfactoria al terminar su período de prueba, la consecuencia será que", "f": "Ley 909 de 2004, art. 31, num. 5", "o": [["A", "su nombramiento será declarado insubsistente.", "El art. 31, num. 5, de la Ley 909 de 2004 dispone que, si quien no estaba inscrito en carrera no obtiene calificación satisfactoria del período de prueba, su nombramiento será declarado insubsistente.", true], ["B", "se le prorrogará el período de prueba por seis meses para que mejore su desempeño.", "La ley no prevé la prórroga del período de prueba por un resultado no satisfactorio; la consecuencia es la declaratoria de insubsistencia.", false], ["C", "quedará inscrita en carrera, pero con un plan de mejoramiento obligatorio.", "La inscripción en carrera solo se
