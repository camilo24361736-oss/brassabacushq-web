l procedimiento sancionatorio y, si es necesario, imponer medidas preventivas, porque usar el agua sin concesión es una infracción.", "Usar aguas públicas sin la concesión exigida viola el art. 2.2.3.2.5.3 del Decreto 1076 de 2015, lo que constituye infracción ambiental según el art. 5 de la Ley 1333 de 2009; la corporación, como titular de la potestad sancionatoria (art. 1 de esa ley y art. 31, num. 17 de la Ley 99 de 1993), puede imponer medidas preventivas e iniciar el procedimiento.", true]]}, {"id": "ET-163", "niv": 1, "e": "El vertimiento de aguas residuales de la curtiembre a la corriente da lugar al cobro de", "f": "Ley 99 de 1993, art. 42", "o": [["A", "la tasa por utilización de aguas, que es la única que se aplica a la industria.", "La tasa por utilización grava la captación del agua; el vertimiento de residuos genera tasa retributiva.", false], ["B", "la tasa retributiva, por la utilización del agua para arrojar desechos o sustancias nocivas.", "El art. 42 de la Ley 99 de 1993 sujeta al pago de tasas retributivas la utilización directa o indirecta del agua para introducir o arrojar desechos, aguas servidas y sustancias nocivas resultantes de actividades antrópicas.", true], ["C", "la contribución de valorización, por el beneficio que recibe la curtiembre de las obras ejecutadas por la corporación.", "La valorización se causa por la ejecución de obras públicas, no por el vertimiento de residuos.", false]]}, {"id": "ET-164", "niv": 3, "e": "Sobre el destino de lo recaudado por tasa por utilización de aguas en la cuenca con POMCA adoptado, usted indica que debe destinarse", "f": "Ley 99 de 1993, art. 43, parágrafo 2 (modificado por el art. 25 de la Ley 1930 de 2018)", "o": [["A", "a las actividades de protección, recuperación y monitoreo del recurso hídrico definidas en el POMCA.", "El parágrafo 2, literal a) del art. 43 de la Ley 99 de 1993 (modificado por el art. 25 de la Ley 1930 de 2018) dispone que en las cuencas con POMCA adoptado estos recursos se destinan a las actividades de protección, recuperación y monitoreo del recurso hídrico definidas en él.", true], ["B", "a proyectos del plan de acción de la corporación en cualquier cuenca de su jurisdicción, aunque no se relacionen con el POMCA adoptado.", "Cuando la cuenca tiene POMCA adoptado, la ley orienta estos recursos a las actividades de protección, recuperación y monitoreo del recurso hídrico definidas en ese plan, no a cualquier proyecto del plan de acción.", false], ["C", "libremente a gastos de funcionamiento de la corporación, por tratarse de rentas propias.", "Los recursos de esta tasa tienen destinación específica a la protección del recurso hídrico.", false]]}]}, {"comp": "entidades_territoriales", "rol": "profesional", "tag": "Entidades territoriales, Bogotá D.C. y CAR · Nivel profesional · Medidas preventivas ambientales", "texto": "Usted es profesional universitario de la Oficina de Control y Seguimiento de una corporación autónoma regional de Santander. En un recorrido de control, el equipo técnico sorprende a una ladrillera quemando llantas como combustible, con emisiones visibles sobre una vereda. El equipo impone en el sitio la suspensión de la actividad. Días después, el representante de la ladrillera radica un recurso de reposición contra la medida y alega que no tuvo intención de contaminar, pues desconocía la prohibición.", "items": [{"id": "ET-165", "niv": 2, "e": "Para formalizar la medida impuesta en el sitio, al tratarse de un caso de flagrancia, el equipo debía", "f": "Ley 1333 de 2009, art. 15", "o": [["A", "solicitar autorización previa del director general antes de suspender la actividad.", "La ley no exige autorización previa del director para imponer la medida en flagrancia.", false], ["B", "levantar un acta con los motivos, la autoridad que la impone, el lugar, la fecha y la hora, y la actividad sobre la que recae.", "El art. 15 de la Ley 1333 de 2009 dispone que en flagrancia se levanta un acta con los motivos que justifican la medida, la autoridad que la impone, lugar, fecha y hora, funcionario y persona, proyecto o actividad a la que se impone.", true], ["C", "esperar a la apertura del procedimiento sancionatorio para imponerla mediante resolución motivada, notificada personalmente al infractor.", "En flagrancia la medida se impone en el lugar de los hechos y se deja constancia en un acta; no es necesario esperar la apertura del procedimiento.", false]]}, {"id": "ET-166", "niv": 2, "e": "Frente al recurso de reposición presentado contra la medida preventiva, la corporación debe", "f": "Ley 1333 de 2009, art. 32", "o": [["A", "rechazarlo, porque contra las medidas preventivas no procede recurso alguno.", "El art. 32 de la Ley 1333 de 2009 dispone que las medidas preventivas son de ejecución inmediata, preventivas y transitorias, surten efectos inmediatos y contra ellas no procede recurso alguno.", true], ["B", "resolverlo dentro de los quince días siguientes, con efecto suspensivo sobre la medida.", "Contra las medidas preventivas no procede recurso, de modo que no hay término para resolverlo ni efecto suspensivo.", false], ["C", "tramitarlo como apelación ante el Ministerio de Ambiente, superior jerárquico de la corporación.", "Las CAR son entes autónomos sin superior jerárquico en el Ministerio, y además contra las medidas preventivas no procede recurso.", false]]}, {"id": "ET-167", "niv": 1, "e": "Frente al argumento de que la ladrillera no tuvo intención de contaminar, usted conceptúa que", "f": "Ley 1333 de 2009, art. 1, parágrafo, y art. 5, parágrafo 1 (modificados por la Ley 2387 de 2024)", "o": [["A", "corresponde a la corporación probar la intención de contaminar antes de continuar con el procedimiento.", "La ley invierte la carga: se presume la culpa o el dolo y el infractor debe desvirtuarla.", false], ["B", "el desconocimiento de la prohibición excluye la responsabilidad, por lo que debe archivarse la actuación.", "El desconocimiento de la norma no es causal para archivar; la culpa o el dolo se presumen y el infractor debe desvirtuarlos con pruebas.", false], ["C", "se presume la culpa o el dolo, y es el presunto infractor quien debe desvirtuar esa presunción.", "El parágrafo del art. 1 y el parágrafo 1 del art. 5 de la Ley 1333 de 2009 (modificados por la Ley 2387 de 2024) establecen la presunción de culpa o dolo del infractor, quien tiene la carga de la prueba para desvirtuarla.", true]]}]}, {"comp": "entidades_territoriales", "rol": "profesional", "tag": "Entidades territoriales, Bogotá D.C. y CAR · Nivel profesional · Procedimiento sancionatorio ambiental", "texto": "Usted es profesional especializado de la Oficina Jurídica de una corporación autónoma regional del Cauca. La corporación recibió una queja anónima sobre la posible desecación de un humedal y, como no es claro si los hechos constituyen infracción, se ordenó una indagación preliminar. En otro expediente ya abierto contra una empresa minera, el pliego de cargos fue notificado personalmente el lunes 1 de febrero de 2027. No hay días festivos en febrero de 2027.", "items": [{"id": "ET-168", "niv": 2, "e": "Sobre la indagación preliminar ordenada por la queja del humedal, usted advierte que", "f": "Ley 1333 de 2009, art. 17", "o": [["A", "dura como máximo dos meses y puede extenderse a cualquier otro hecho que se descubra durante las visitas.", "El término es de seis meses y la indagación no puede extenderse a hechos distintos del denunciado, salvo los conexos (art. 17 de la Ley 1333 de 2009).", false], ["B", "puede extenderse hasta que se recauden todas las pruebas necesarias, porque la ley no le fija un término máximo.", "La ley sí fija un término máximo de seis meses para la indagación preliminar.", false], ["C", "dura como máximo seis meses y termina con el archivo definitivo o con el auto de apertura de la investigación.", "El art. 17 de la Ley 1333 de 2009 establece que la indagación preliminar tiene un término máximo de seis meses y culmina con el archivo definitivo o el auto de apertura de la investigación.", true]]}, {"id": "ET-169", "niv": 3, "e": "En el expediente de la empresa minera, el último día para presentar descargos es el", "f": "Ley 1333 de 2009, art. 25", "o": [["A", "jueves 11 de febrero de 2027.", "Resulta de contar diez días calendario desde la notificación. El término legal es de diez días hábiles.", false], ["B", "lunes 15 de febrero de 2027.", "El art. 25 de la Ley 1333 de 2009 otorga diez días hábiles siguientes a la notificación del pliego. Desde el martes 2 de febrero, contando solo días hábiles (2, 3, 4, 5, 8, 9, 10, 11, 12 y 15), el décimo es el lunes 15 de febrero de 2027.", true], ["C", "lunes 22 de febrero de 2027.", "Corresponde a quince días hábiles. El término legal para descargos es de diez días hábiles.", false]]}, {"id": "ET-170", "niv": 3, "e": "Sobre la caducidad y la duración del procedimiento contra la empresa minera, usted precisa que", "f": "Ley 1333 de 2009, art. 10 y parágrafo (adicionado por el art. 18 de la Ley 2387 de 2024)", "o": [["A", "la acción caduca a los veinte años y, ya iniciado, el procedimiento no puede durar más de cinco años, prorrogables una vez por igual término.", "El art. 10 de la Ley 1333 de 2009 fija la caducidad en veinte años y su parágrafo (adicionado por el art. 18 de la Ley 2387 de 2024) limita la duración del procedimiento iniciado a cinco años, prorrogables hasta por otro término igual por la complejidad del caso.", true], ["B", "la acción caduca a los tres años del hecho, como en el régimen sancionatorio general del CPACA, y el procedimiento iniciado no tiene un límite máximo de duración en la ley.", "Tres años es la regla general del art. 52 de la Ley 1437 de 2011, pero en materia ambiental rige la norma especial de veinte años (art. 10 de la Ley 1333 de 2009); además, la Ley 2387 de 2024 sí fijó un límite de duración del procedimiento.", false], ["C", "la acción caduca a los veinte años del hecho, y el procedimiento puede durar todo ese tiempo sin límite adicional.", "La Ley 2387 de 2024 añadió un límite: iniciado el procedimiento, no puede extenderse más de cinco años (prorrogables una vez).", false]]}]}, {"comp": "entidades_territoriales", "rol": "profesional", "tag": "Entidades territoriales, Bogotá D.C. y CAR · Nivel profesional · Terminación anticipada del sancionatorio ambiental", "texto": "Usted es profesional de la Oficina Jurídica de una corporación autónoma regional de Antioquia. En un procedimiento sancionatorio abierto contra una empresa constructora por la intervención de una ronda hídrica, y antes de que se decida sobre su responsabilidad, la empresa radica una propuesta de medidas técnicas para corregir y compensar la afectación, y pide suspender el procedimiento. La empresa no ha accedido antes a este beneficio.", "items": [{"id": "ET-171", "niv": 3, "e": "Frente a la petición de la empresa, la corporación puede", "f": "Ley 1333 de 2009, art. 18A (adicionado por el art. 10 de la Ley 2387 de 2024)", "o": [["A", "negarla de plano, porque la reparación del daño solo puede ordenarse en el acto administrativo final que declara la responsabilidad del infractor.", "Desde la Ley 2387 de 2024 existe la figura de suspensión y terminación anticipada por corrección o compensación, antes de la decisión de fondo.", false], ["B", "suspender el ejercicio de la potestad sancionatoria si la propuesta de corrección o compensación está técnicamente soportada y es viable.", "El art. 18A de la Ley 1333 de 2009 (adicionado por el art. 10 de la Ley 2387 de 2024) permite, a petición del presunto infractor y antes de decidir sobre su responsabilidad, suspender la potestad sancionatoria si presenta medidas técnicamente soportadas y viables para corregir o compensar la afectación.", true], ["C", "aceptarla sin evaluación, porque la sola propuesta del infractor obliga a archivar el expediente.", "La propuesta debe evaluarse y aprobarse; la terminación anticipada solo se declara después de verificar que las medidas se implementaron.", false]]}, {"id": "ET-172", "niv": 2, "e": "Si la corporación declara la suspensión, la empresa debe presentar una garantía de cumplimiento a favor de la autoridad ambiental dentro de los", "f": "Ley 1333 de 2009, art. 18A (adicionado por el art. 10 de la Ley 2387 de 2024)", "o": [["A", "tres días hábiles siguientes.", "El término legal es de cinco días hábiles.", false], ["B", "cinco días hábiles siguientes.", "El art. 18A de la Ley 1333 de 2009 ordena que, declarada la suspensión, el presunto infractor presente dentro de los cinco días hábiles siguientes una garantía que ampare las obligaciones y costos de las medidas.", true], ["C", "quince días hábiles siguientes.", "Quince días hábiles no es el término previsto para la garantía; la ley fija cinco días hábiles.", false]]}, {"id": "ET-173", "niv": 3, "e": "Sobre la duración de la suspensión y sus efectos, usted precisa que", "f": "Ley 1333 de 2009, art. 18A (adicionado por el art. 10 de la Ley 2387 de 2024)", "o": [["A", "es de máximo dos años, prorrogable hasta por la mitad, y mientras dura no corre la caducidad.", "El art. 18A de la Ley 1333 de 2009 fija la suspensión en máximo dos años, prorrogable hasta por la mitad del tiempo inicial, y dispone que durante la suspensión no corre el término de caducidad del art. 10.", true], ["B", "dura lo que la empresa necesite para ejecutar las medidas, y el cumplimiento se inscribe en el RUIA como antecedente.", "La ley fija un máximo de dos años y la terminación anticipada se inscribe con la advertencia de no ser un antecedente.", false], ["C", "puede durar hasta cinco años y durante ella sigue corriendo el término de caducidad de la acción.", "La suspensión es de máximo dos años (prorrogable hasta la mitad) y durante ella no corre la caducidad.", false]]}]}, {"comp": "entidades_territoriales", "rol": "profesional", "tag": "Entidades territoriales, Bogotá D.C. y CAR · Nivel profesional · Sistema General de Participaciones", "texto": "Usted es profesional universitario de la Secretaría de Hacienda de un municipio de tercera categoría de Nariño, con 40.000 habitantes y no certificado en educación. El nuevo alcalde quiere usar en un faltante de caja de la tesorería general unos recursos del Sistema General de Participaciones (SGP) que están en una cuenta sin ejecutar. También pregunta qué componentes tiene el SGP y qué debe hacer el municipio para administrar directamente la educación.", "items": [{"id": "ET-174", "niv": 1, "e": "Al explicar la conformación del SGP, usted señala que está integrado por", "f": "Ley 715 de 2001, art. 3 (modificado por el art. 1 de la Ley 1176 de 2007)", "o": [["A", "las participaciones para educación y salud, únicamente, pues el agua potable se financia con tarifas.", "Desde la Ley 1176 de 2007 existe una participación específica para agua potable y saneamiento básico, además de la de propósito general.", false], ["B", "las regalías, las participaciones para educación y salud, y los recursos del Fondo Nacional de Gestión del Riesgo.", "Las regalías tienen un sistema propio (Sistema General de Regalías) y el fondo de gestión del riesgo no hace parte del SGP.", false], ["C", "las participaciones para educación, salud, agua potable y saneamiento básico, y una de propósito general.", "El art. 3 de la Ley 715 de 2001 (modificado por el art. 1 de la Ley 1176 de 2007) conforma el SGP con participaciones para educación, salud, agua potable y saneamiento básico, y una participación de propósito general.", true]]}, {"id": "ET-175", "niv": 2, "e": "Frente a la idea de cubrir el faltante de caja con recursos del SGP, usted advierte que", "f": "Ley 715 de 2001, arts. 18 y 91", "o": [["A", "es posible si el Concejo lo autoriza mediante acuerdo, con cargo a reintegrar los recursos en la misma vigencia.", "Una autorización del Concejo no cambia la regla legal: los recursos del SGP no hacen unidad de caja con las demás rentas.", false], ["B", "es posible solo con los recursos de propósito general, porque son de libre destinación.", "La participación de propósito general tiene destinaciones definidas por la ley y no es una renta de libre uso para cubrir faltantes de tesorería; además, los recursos del SGP no hacen unidad de caja con las demás rentas (art. 91 de la Ley 715 de 2001).", false], ["C", "no es procedente, porque los recursos del SGP van en cuentas especiales y no hacen unidad de caja con las demás rentas.", "El art. 91 de la Ley 715 de 2001 prohíbe la unidad de caja: los recursos del SGP no se mezclan con los demás recursos del presupuesto y se administran en cuentas separadas; el art. 18 reitera la regla para los recursos de educación.", true]]}, {"id": "ET-176", "niv": 3, "e": "Para administrar directamente la educación, el municipio, con menos de 100.000 habitantes, debe", "f": "Ley 715 de 2001, arts. 6 y 20", "o": [["A", "solicitar la certificación al departamento y, si este no resuelve en seis meses o la rechaza, acudir a la Nación.", "El art. 20 de la Ley 715 de 2001 asigna a los departamentos decidir la certificación de municipios con menos de cien mil habitantes que cumplan los requisitos, y si en seis meses no se resuelve o se rechaza, el municipio puede acudir a la Nación.", true], ["B", "esperar a superar los 100.000 habitantes, porque solo esos municipios pueden certificarse.", "Los municipios con menos de cien mil habitantes también pueden certificarse si cumplen los requisitos de capacidad técnica, administrativa y financiera.", false], ["C", "solicitar la certificación directamente al Ministerio de Educación Nacional, que es el único competente para decidirla en todos los casos.", "Para municipios con menos de cien mil habitantes la decisión corresponde, en primer término, al departamento; la Nación interviene solo si el departamento no resuelve o rechaza.", false]]}]}, {"comp": "entidades_territoriales", "rol": "general", "tag": "Entidades territoriales, Bogotá D.C. y CAR · Gestión del riesgo: responsables y consejos", "texto": "Usted es técnico administrativo de la Secretaría de Gobierno de un municipio de sexta categoría del Chocó, donde las lluvias suelen generar desbordamientos. El municipio no tiene oficina de gestión del riesgo y el alcalde pregunta quién es el responsable de los procesos de gestión del riesgo en el municipio, qué papel cumple el consejo municipal de gestión del riesgo y si puede delegar esa responsabilidad en la corporación autónoma regional, que tiene más personal técnico.", "items": [{"id": "ET-177", "niv": 1, "e": "Sobre la responsabilidad de la gestión del riesgo en el municipio, usted le indica al alcalde que", "f": "Ley 1523 de 2012, arts. 13 y 14", "o": [["A", "corresponde al gobernador, porque es agente del Presidente en materia de orden público.", "El gobernador responde en el ámbito departamental (art. 13), pero en el municipio el responsable directo es el alcalde (art. 14 de la Ley 1523 de 2012).", false], ["B", "corresponde a la Unidad Nacional para la Gestión del Riesgo de Desastres, porque el municipio no cuenta con una oficina especializada en la materia.", "La UNGRD dirige el sistema nacional y apoya a los territorios, pero no sustituye la responsabilidad del alcalde en el municipio.", false], ["C", "él es el responsable directo de implementar los procesos de conocimiento, reducción del riesgo y manejo de desastres en su jurisdicción.", "El art. 14 de la Ley 1523 de 2012 establece que el alcalde, como conductor del desarrollo local, es el responsable directo de la implementación de los procesos de gestión del riesgo en el municipio.", true]]}, {"id": "ET-178", "niv": 1, "e": "Sobre el consejo municipal de gestión del riesgo, usted explica que es", "f": "Ley 1523 de 2012, art. 27", "o": [["A", "una dependencia de la alcaldía con planta de personal propia y presupuesto independiente.", "El consejo no es una dependencia con planta ni presupuesto propio; es una instancia de coordinación. Los recursos se manejan en el fondo municipal de gestión del riesgo.", false], ["B", "una instancia de coordinación, asesoría, planeación y seguimiento de la gestión del riesgo.", "El art. 27 de la Ley 1523 de 2012 crea los consejos territoriales como instancias de coordinación, asesoría, planeación y seguimiento para garantizar la efectividad y articulación de los procesos de conocimiento, reducción y manejo.", true], ["C", "un organismo de socorro encargado de ejecutar directamente las labores de rescate en las emergencias.", "Las labores de rescate las ejecutan los organismos operativos (bomberos, Defensa Civil, Cruz Roja); el consejo es una instancia de coordinación.", false]]}, {"id": "ET-179", "niv": 3, "e": "Sobre trasladar la responsabilidad a la corporación autónoma regional, usted aclara que", "f": "Ley 1523 de 2012, art. 31, parágrafos 1 y 3", "o": [["A", "el papel de la CAR es complementario y subsidiario y no exime al alcalde de su responsabilidad primaria, aunque debe apoyar al municipio.", "El parágrafo 1 del art. 31 de la Ley 1523 de 2012 señala que el papel de las CAR es complementario y subsidiario respecto de alcaldías y gobernaciones y no exime a los alcaldes de su responsabilidad primaria; el parágrafo 3 las obliga a apoyar a las entidades territoriales.", true], ["B", "es obligatorio en municipios de sexta categoría, que deben entregar la gestión del riesgo a la CAR.", "La ley no prevé esa transferencia por categoría; la responsabilidad primaria del alcalde se mantiene en todos los municipios.", false], ["C", "es viable mediante convenio interadministrativo, porque la CAR es la máxima autoridad ambiental y asume la gestión del riesgo en toda su jurisdicción.", "La condición de máxima autoridad ambiental no convierte a la CAR en responsable principal de la gestión del riesgo; su papel es complementario.", false]]}]}, {"comp": "entidades_territoriales", "rol": "profesional", "tag": "Entidades territoriales, Bogotá D.C. y CAR · Nivel profesional · Declaratoria de calamidad pública", "texto": "Usted es profesional universitario de la Oficina de Planeación de un municipio de cuarta categoría del Tolima. Una avenida torrencial destruyó viviendas, un puente y parte del acueducto. El alcalde quiere declarar la situación de calamidad pública esta misma tarde, contratar de inmediato la rehabilitación del acueducto y saber hasta cuándo podría mantenerse el régimen especial antes de declarar el retorno a la normalidad.", "items": [{"id": "ET-180", "niv": 1, "e": "Para declarar la situación de calamidad pública, el alcalde debe contar con", "f": "Ley 1523 de 2012, art. 57", "o": [["A", "aprobación de la Unidad Nacional para la Gestión del Riesgo de Desastres.", "La declaratoria de calamidad es competencia territorial; la UNGRD interviene en la declaratoria de desastre nacional, no aprueba las calamidades municipales.", false], ["B", "autorización previa del Concejo municipal mediante acuerdo.", "La ley no exige acuerdo del Concejo para la declaratoria; exige el concepto favorable del consejo municipal de gestión del riesgo.", false], ["C", "concepto previo favorable del consejo municipal de gestión del riesgo de desastres.", "El art. 57 de la Ley 1523 de 2012 dispone que los gobernadores y alcaldes, previo concepto favorable del respectivo consejo de gestión del riesgo, podrán declarar la situación de calamidad pública.", true]]}, {"id": "ET-181", "niv": 3, "e": "Declarada la calamidad, los contratos para la rehabilitación del acueducto afectado se someten a", "f": "Ley 1523 de 2012, art. 66", "o": [["A", "los requisitos y formalidades de la contratación entre particulares, con las reglas especiales previstas para estas situaciones.", "El art. 66 de la Ley 1523 de 2012 dispone que los contratos de las entidades territoriales relacionados directamente con la respuesta, rehabilitación y reconstrucción de zonas declaradas en calamidad pública se someten a los requisitos de la contratación entre particulares, con sujeción al art. 13 de la Ley 1150 de 2007.", true], ["B", "la modalidad de licitación pública, por tratarse de un contrato de obra pública cuya cuantía supera la menor cuantía de la entidad territorial.", "La ley establece un régimen especial: los contratos de respuesta, rehabilitación y reconstrucción en zonas declaradas en calamidad siguen las reglas de la contratación entre particulares.", false], ["C", "la autorización previa del gobernador, conforme a las normas de tutela administrativa del departamento sobre los municipios.", "La ley no exige aprobación del gobernador; el régimen especial se aplica directamente por la entidad territorial.", false]]}, {"id": "ET-182", "niv": 3, "e": "Sobre el plazo para declarar el retorno a la normalidad, usted informa que la calamidad pública", "f": "Ley 1523 de 2012, art. 64, parágrafo", "o": [["A", "se mantiene hasta que termine la reconstrucción total de las obras afectadas, sin plazo máximo.", "La ley sí fija un término máximo para declarar el retorno a la normalidad.", false], ["B", "no puede exceder seis meses, prorrogables una vez por el mismo término previo concepto favorable del consejo.", "El parágrafo del art. 64 de la Ley 1523 de 2012 fija un máximo de seis meses para la calamidad pública (doce para el desastre), prorrogable una vez y hasta por el mismo término, previo concepto favorable del consejo respectivo.", true], ["C", "no puede exceder doce meses, prorrogables una vez por el mismo término previo concepto favorable del consejo.", "Doce meses es el término previsto para la declaratoria de situación de desastre, no para la calamidad pública.", false]]}]}, {"comp": "entidades_territoriales", "rol": "tecnico", "tag": "Entidades territoriales, Bogotá D.C. y CAR · Nivel técnico · Procesos de la gestión del riesgo", "texto": "Usted es técnico de la oficina de gestión del riesgo de una gobernación de la región andina y apoya la actualización del plan departamental. Debe clasificar varias acciones propuestas por los municipios: elaborar mapas de amenaza por movimientos en masa y monitorear la lluvia con estaciones; construir un muro de contención para proteger un barrio ya asentado en una ladera inestable; e incluir en el plan de ordenamiento territorial la prohibición de urbanizar nuevas zonas de alto riesgo no mitigable.", "items": [{"id": "ET-183", "niv": 1, "e": "La elaboración de mapas de amenaza y el monitoreo de la lluvia corresponden al proceso de", "f": "Ley 1523 de 2012, art. 6, num. 2.1", "o": [["A", "reducción del riesgo, porque disminuyen la vulnerabilidad de la población.", "Elaborar mapas y monitorear no modifica por sí mismo las condiciones de riesgo; produce información, propia del conocimiento.", false], ["B", "manejo de desastres, porque preparan la respuesta a emergencias.", "La preparación para la respuesta es parte del manejo, pero identificar amenazas y monitorear el riesgo pertenece al conocimiento del riesgo.", false], ["C", "conocimiento del riesgo, que incluye identificar escenarios y factores, analizar, monitorear y comunicar el riesgo.", "El art. 6, numeral 2.1 de la Ley 1523 de 2012 incluye en el proceso de conocimiento del riesgo la identificación de escenarios y factores, el análisis y evaluación, el monitoreo y la comunicación del riesgo.", true]]}, {"id": "ET-184", "niv": 2, "e": "El muro de contención para proteger el barrio ya asentado es una acción de", "f": "Ley 1523 de 2012, art. 4, num. 21 (modificado por el art. 4 de la Ley 2474 de 2025)", "o": [["A", "mitigación del riesgo, porque interviene de manera correctiva un riesgo existente.", "El art. 4, numeral 21 de la Ley 1523 de 2012 (modificado por la Ley 2474 de 2025) define la reducción del riesgo como la intervención para modificar o disminuir el riesgo existente (mitigación) y evitar nuevo riesgo (prevención); la intervención correctiva del riesgo existente es mitigación.", true], ["B", "prevención del riesgo, porque evita que se genere un nuevo riesgo en el territorio.", "La prevención es intervención prospectiva para evitar nuevo riesgo; aquí el barrio ya existe, por lo que la acción es correctiva.", false], ["C", "protección financiera, porque traslada el riesgo a un tercero.", "Un muro no traslada el riesgo: lo reduce físicamente. La protección financiera se refiere a seguros y otros instrumentos financieros.", false]]}, {"id": "ET-185", "niv": 2, "e": "La prohibición de urbanizar nuevas zonas de alto riesgo en el plan de ordenamiento territorial es una acción de", "f": "Ley 1523 de 2012, art. 4, num. 21 (modificado por el art. 4 de la Ley 2474 de 2025), y art. 14, parágrafo", "o": [["A", "manejo de desastres, porque prepara la recuperación posterior a una emergencia.", "La medida es anterior a cualquier emergencia y busca evitar el riesgo; no se relaciona con la respuesta ni con la recuperación.", false], ["B", "prevención del riesgo, porque impide que se genere nuevo riesgo.", "El art. 4, numeral 21 de la Ley 1523 de 2012 (modificado por la Ley 2474 de 2025) identifica la prevención con la intervención dirigida a evitar nuevo riesgo en el territorio, propia de los instrumentos de ordenamiento.", true], ["C", "mitigación del riesgo, porque disminuye las condiciones de riesgo existentes.", "En esas zonas no hay todavía asentamientos: la medida no corrige un riesgo existente, sino que impide que se genere uno nuevo.", false]]}]}, {"comp": "comportamental", "rol": "general", "tag": "Competencias comportamentales (Decreto 815 de 2018) · Aprendizaje continuo", "texto": "Usted es servidor de la Secretaría de Hacienda de un municipio de segunda categoría y atiende consultas de contribuyentes sobre el impuesto de industria y comercio. En octubre, el Concejo Municipal aprobó un acuerdo que modifica las tarifas y el calendario de declaración de ese impuesto a partir del 1 de enero del año siguiente. La Secretaría aún no ha programado capacitaciones sobre el cambio. En la oficina trabaja también Liliana, quien terminó un diplomado de la ESAP en fiscalización tributaria territorial y maneja una herramienta de cruce de información que usted no conoce; usted, a su vez, domina las plantillas de liquidación que el equipo usa a diario.", "items": [{"id": "CO-101", "niv": 1, "e": "Ante la aprobación del acuerdo y sin capacitación programada, la conducta que mejor refleja la competencia de aprendizaje continuo es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Aprendizaje continuo)", "o": [["A", "leer el texto oficial del acuerdo y actualizar sus apuntes antes de que rija, para orientar bien a los contribuyentes.", "Refleja la competencia «Aprendizaje continuo» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en identificar, incorporar y aplicar conocimientos nuevos sobre normas, tecnologías y métodos de trabajo para mantener vigente la efectividad de las propias prácticas. Corresponde a las conductas asociadas de mantener actualizadas las propias competencias según los cambios que exige la administración y de gestionar fuentes de información confiables: el texto oficial del acuerdo es la fuente idónea y le permite estar preparado antes de enero.", true], ["B", "esperar la capacitación que organice la Secretaría y, mientras tanto, seguir orientando a los contribuyentes con las reglas actuales.", "Deja su actualización en manos exclusivas de la entidad. La competencia pide gestionar las propias fuentes de información confiable, como el texto oficial del acuerdo.", false], ["C", "revisar en foros de contadores de la región cómo están entendiendo el cambio otros profesionales, para tener varias opiniones.", "Busca actualizarse, pero en fuentes que no son confiables ni oficiales. La conducta asociada exige acudir a información confiable; las opiniones de foros pueden ser imprecisas o referirse a otros municipios.", false]]}, {"id": "CO-102", "niv": 2, "e": "Frente a la herramienta de cruce de información que maneja Liliana, la conducta más acorde con el aprendizaje continuo es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Aprendizaje continuo)", "o": [["A", "proponer a su jefe que Liliana asuma en adelante todos los cruces de información de la oficina y usted las liquidaciones de ella.", "Puede ser eficiente en lo inmediato, pero renuncia a aprender. No refleja la conducta de nivelar conocimientos aprendiendo de los colegas y deja el saber concentrado en una sola persona.", false], ["B", "inscribirse en la próxima cohorte del diplomado de la ESAP, que abre dentro de un año, para aprender la herramienta con un certificado.", "Participar en capacitación es valioso, pero aplaza un año un aprendizaje que puede lograr ya con una colega. La competencia valora el interaprendizaje informal entre compañeros para nivelar conocimientos.", false], ["C", "pedirle a Liliana que le muestre en la práctica cómo hace los cruces y, a su vez, enseñarle el manejo de las plantillas de liquidación.", "Refleja la competencia «Aprendizaje continuo» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en identificar, incorporar y aplicar conocimientos nuevos sobre normas, tecnologías y métodos de trabajo para mantener vigente la efectividad de las propias prácticas. Es la conducta asociada de compartir saberes con los compañeros y aprender de ellos habilidades diferenciales en flujos informales de interaprendizaje: ambos nivelan conocimientos sin esperar un curso formal.", true]]}, {"id": "CO-103", "niv": 3, "e": "Usted asistió a una jornada de la gobernación sobre el nuevo sistema de información tributaria, a la que solo pudo ir un servidor por oficina. Al regresar, la conducta que mejor refleja el aprendizaje continuo es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Aprendizaje continuo)", "o": [["A", "enviar el certificado y la memoria de la jornada a talento humano para que la formación quede registrada en su historia laboral.", "Es un trámite útil, pero no aplica ni comparte el conocimiento adquirido. La competencia apunta a incorporar lo aprendido y transmitirlo a los colegas, no solo a dejar constancia de la asistencia.", false], ["B", "preparar una guía corta con lo aprendido y explicarla a quienes no asistieron, para que todos usen el sistema.", "Refleja la competencia «Aprendizaje continuo» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en identificar, incorporar y aplicar conocimientos nuevos sobre normas, tecnologías y métodos de trabajo para mantener vigente la efectividad de las propias prácticas. Responde a la conducta asociada de compartir saberes y habilidades con los compañeros: al socializar lo aprendido, la oficina entera mantiene actualizadas sus prácticas, no solo quien asistió.", true], ["C", "aplicar lo aprendido en sus propios trámites y guardar la memoria de la jornada para consultarla cuando la necesite.", "Incorpora lo aprendido en su trabajo, pero no lo comparte con los compañeros que no pudieron asistir. La competencia incluye compartir los saberes y habilidades con los colegas.", false]]}]}, {"comp": "comportamental", "rol": "general", "tag": "Competencias comportamentales (Decreto 815 de 2018) · Aprendizaje continuo", "texto": "Usted trabaja en la ventanilla de trámites ambientales de una corporación autónoma regional del oriente del país. Cada vez más usuarios preguntan cómo radicar en línea sus solicitudes de concesión de aguas a través de una plataforma nacional de trámites ambientales, que usted conoce poco. Además, el mes pasado entró en vigencia una norma nacional que modificó algunos requisitos de un permiso que se tramita en su ventanilla, pero la lista de chequeo interna todavía no se ha actualizado. Usted participa en un grupo virtual informal de servidores de ventanilla de varias corporaciones, donde se comparten dudas prácticas sobre el uso de la plataforma.", "items": [{"id": "CO-104", "niv": 1, "e": "Para orientar a los usuarios sobre la radicación en línea, la conducta que mejor refleja el aprendizaje continuo es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Aprendizaje continuo)", "o": [["A", "remitir a los usuarios a la mesa de ayuda de la plataforma mientras la corporación decide si capacitará al personal de ventanilla.", "Traslada la necesidad al usuario y espera una decisión institucional. La competencia pide actualizarse por iniciativa propia para mantener la efectividad de la atención.", false], ["B", "estudiar los manuales oficiales de la plataforma y practicar la radicación, ya que así podrá orientar bien a los usuarios.", "Refleja la competencia «Aprendizaje continuo» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en identificar, incorporar y aplicar conocimientos nuevos sobre normas, tecnologías y métodos de trabajo para mantener vigente la efectividad de las propias prácticas. Corresponde a gestionar sus propias fuentes de información confiable y mantener sus competencias actualizadas según los cambios que exige la administración: los materiales oficiales son la fuente adecuada.", true], ["C", "aprender el proceso con cada caso, pidiendo a los usuarios que ya radicaron que le cuenten qué pasos siguieron.", "Aprende de una fuente que no garantiza exactitud: la experiencia de cada usuario puede contener errores. La conducta asociada exige información confiable.", false]]}, {"id": "CO-105", "niv": 3, "e": "Frente a la norma nacional que cambió los requisitos del permiso, la conducta más coherente con el aprendizaje continuo es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Aprendizaje continuo)", "o": [["A", "consultar el texto oficial de la norma y advertir a su jefe y a sus compañeros las diferencias frente a la lista de chequeo para que se actualice.", "Refleja la competencia «Aprendizaje continuo» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en identificar, incorporar y aplicar conocimientos nuevos sobre normas, tecnologías y métodos de trabajo para mantener vigente la efectividad de las propias prácticas. Reúne dos conductas asociadas: mantener actualizadas las competencias con base en las regulaciones vigentes, consultadas en fuente oficial, y compartir ese saber con los compañeros para que la práctica de toda la ventanilla se ajuste por el conducto institucional.", true], ["B", "seguir aplicando la lista de chequeo vigente hasta que la oficina jurídica emita una circular, para no generar criterios distintos entre ventanillas.", "Evita criterios dispares, pero ignora un cambio normativo que ya conoce y no lo pone en conocimiento de nadie. La competencia exige incorporar las regulaciones vigentes y compartir ese saber para que la práctica se actualice.", false], ["C", "aplicar desde ya a los usuarios su interpretación de los cambios, con base en el resumen que le envió un colega de otra corporación.", "Se apoya en una fuente secundaria sin consultar el texto oficial, y aplica por su cuenta un criterio que no comparte con su equipo ni queda reflejado en la lista de chequeo institucional.", false]]}, {"id": "CO-106", "niv": 2, "e": "Respecto del grupo virtual de servidores de ventanilla de otras corporaciones, la conducta más acorde con el aprendizaje continuo es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Aprendizaje continuo)", "o": [["A", "salir del grupo y concentrarse en los cursos formales de la corporación, que son la fuente avalada por la entidad.", "La capacitación formal es útil, pero la competencia también valora los flujos informales de interaprendizaje entre colegas como medio para nivelar conocimientos.", false], ["B", "leer los mensajes del grupo sin intervenir, para no difundir prácticas de trabajo que la corporación todavía no ha revisado ni aprobado.", "Aprovecha parte de la información, pero renuncia a compartir sus saberes. Las dudas son prácticas sobre la plataforma, no criterios reservados, y la competencia incluye aportar al interaprendizaje.", false], ["C", "participar en el grupo aportando las soluciones prácticas que ha encontrado y contrastándolas con las de otras corporaciones.", "Refleja la competencia «Aprendizaje continuo» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en identificar, incorporar y aplicar conocimientos nuevos sobre normas, tecnologías y métodos de trabajo para mantener vigente la efectividad de las propias prácticas. Refleja la conducta de participar en espacios informativos y de interaprendizaje, compartiendo saberes y aprendiendo de colegas habilidades diferenciales sobre el uso de la plataforma.", true]]}]}, {"comp": "comportamental", "rol": "general", "tag": "Competencias comportamentales (Decreto 815 de 2018) · Orientación a resultados", "texto": "Usted es servidor de la Secretaría de Planeación de un municipio de cuarta categoría y tiene a cargo la meta del Plan de Desarrollo de responder 600 solicitudes de certificados de uso del suelo en el año. Al 30 de septiembre ha respondido 380 y, en promedio, tarda 18 días por solicitud, aunque el procedimiento interno fija un máximo de 10 días. Una de las causas del retraso es que el aplicativo de consulta cartográfica, indispensable para expedir los certificados, presenta fallas frecuentes que pueden durar varias horas.", "items": [{"id": "CO-107", "niv": 1, "e": "Ante el rezago en la meta anual, la conducta que mejor refleja la orientación a resultados es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Orientación a resultados)", "o": [["A", "calcular cuántas solicitudes debe responder cada mes en el último trimestre y organizar su trabajo semanal con base en esa cifra.", "Refleja la competencia «Orientación a resultados» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en cumplir las funciones y los compromisos de la organización con eficacia, calidad y oportunidad. Refleja las conductas de asumir la responsabilidad por sus resultados y trabajar con objetivos claros y realistas: le faltan 220 solicitudes en tres meses, unas 74 por mes, y planear con esa cifra hace medible el esfuerzo.", true], ["B", "dar prioridad a las solicitudes más sencillas para subir rápido el número de respuestas y dejar las complejas para el año siguiente.", "Mejora la cifra, pero sacrifica la oportunidad y la calidad en los casos complejos. La competencia exige cumplir con eficacia, calidad y oportunidad, no solo con el número.", false], ["C", "solicitar a su jefe que gestione la reducción de la meta anual y que se reconozca en el informe el efecto de las fallas del aplicativo.", "No asume la responsabilidad por el resultado: busca ajustar la meta antes de intentar cumplirla. La competencia pide trabajar con objetivos claros y obtener los resultados esperados.", false]]}, {"id": "CO-108", "niv": 2, "e": "Para medir y comprobar si el rezago se está corrigiendo, la conducta más acorde con la orientación a resultados es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Orientación a resultados)", "o": [["A", "preguntar a los usuarios en ventanilla si perciben que los certificados están saliendo más rápido que antes.", "Recoger la percepción del usuario es útil para el servicio, pero no mide con precisión el avance frente a la meta ni frente al tiempo del procedimiento.", false], ["B", "revisar el avance al cierre del año, cuando la oficina de planeación solicita el informe anual de gestión del Plan de Desarrollo municipal vigente.", "La revisión llega cuando ya no hay tiempo de corregir. La competencia incluye evaluar de forma regular el grado de consecución de los objetivos.", false], ["C", "llevar un registro semanal de solicitudes recibidas, respondidas y días de respuesta, y compararlo con la meta y con el plazo del procedimiento.", "Refleja la competencia «Orientación a resultados» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en cumplir las funciones y los compromisos de la organización con eficacia, calidad y oportunidad. Corresponde a diseñar y utilizar indicadores para medir y comprobar los resultados y a evaluar regularmente la consecución de los objetivos, tanto en cantidad como en oportunidad.", true]]}, {"id": "CO-109", "niv": 3, "e": "Frente a las fallas frecuentes del aplicativo cartográfico, la conducta que mejor refleja la orientación a resultados es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Orientación a resultados)", "o": [["A", "reportar cada falla a la mesa de ayuda de sistemas y esperar la solución, pues el retraso no depende de su gestión.", "Reportar es necesario, pero se limita a esperar y no asume la responsabilidad por sus resultados ni adopta medidas para reducir el riesgo de incumplir.", false], ["B", "documentar las fallas con fecha y efecto en los tiempos, y proponer a su jefe un mecanismo alterno de consulta mientras se corrige el aplicativo.", "Refleja la competencia «Orientación a resultados» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en cumplir las funciones y los compromisos de la organización con eficacia, calidad y oportunidad. Reúne las conductas de adoptar medidas para minimizar riesgos y plantear estrategias para alcanzar los resultados: la evidencia permite gestionar la solución y la alternativa evita que el rezago crezca.", true], ["C", "expedir los certificados de predios ya consultados con la información guardada de la última consulta, aunque pueda estar desactualizada.", "Gana tiempo, pero expone a la entidad a expedir certificados con información imprecisa. La competencia exige que los productos se enmarquen en las normas y estándares de calidad de la entidad.", false]]}]}, {"comp": "comportamental", "rol": "general", "tag": "Competencias comportamentales (Decreto 815 de 2018) · Orientación a resultados", "texto": "Usted trabaja en la Secretaría de Gobierno de una gobernación y es responsable de consolidar, cada trimestre, el informe de avance del programa de dotación a juntas de acción comunal en los 40 municipios del departamento. El informe del trimestre actual debe entregarse el 15 de noviembre al despacho del secretario. A cinco días del plazo, 12 municipios no han enviado su reporte. Además, cada municipio usa un formato distinto y usted invierte tres días por trimestre en unificarlos.", "items": [{"id": "CO-110", "niv": 2, "e": "Frente a los 12 municipios que no han reportado, la conducta que mejor refleja la orientación a resultados es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Orientación a resultados)", "o": [["A", "contactar a los enlaces de los 12 municipios, acordar envíos antes del 15 y, si alguno no reporta, entregar en la fecha dejando constancia.", "Refleja la competencia «Orientación a resultados» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en cumplir las funciones y los compromisos de la organización con eficacia, calidad y oportunidad. Corresponde a plantear estrategias para alcanzar los resultados y cumplir con oportunidad según los tiempos de la entidad: actúa sobre la causa del retraso y, a la vez, asegura la entrega dentro del plazo con información verificada.", true], ["B", "pedir al secretario una prórroga de dos semanas para presentar el informe con los 40 municipios completos.", "Busca la calidad del informe, pero sacrifica la oportunidad sin haber intentado antes cumplir. La competencia exige cumplir los compromisos dentro de los tiempos establecidos.", false], ["C", "entregar el informe en la fecha y completar los datos de los 12 municipios faltantes con estimaciones basadas en lo reportado el trimestre anterior.", "Cumple la fecha, pero presenta datos estimados como si fueran reportes de los municipios, lo que afecta la calidad del informe; además, no gestiona los reportes faltantes en los días disponibles.", false]]}, {"id": "CO-111", "niv": 1, "e": "Al preparar el informe, usted detecta que una cifra que consolidó en el informe del trimestre anterior quedó mal sumada. La conducta más acorde con la orientación a resultados es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Orientación a resultados)", "o": [["A", "pedir al municipio que reportó la información que remita una corrección oficial del dato.", "El error fue de consolidación, no del municipio. Trasladarle la corrección no refleja la conducta de asumir la responsabilidad por los propios resultados.", false], ["B", "informar el error a su jefe, corregir la cifra y dejar nota de la corrección en el informe actual, para que quienes usaron el dato lo sepan.", "Refleja la competencia «Orientación a resultados» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en cumplir las funciones y los compromisos de la organización con eficacia, calidad y oportunidad. Refleja la conducta de asumir la responsabilidad por sus resultados: reconoce el error propio, lo corrige y deja trazabilidad para que los usuarios del informe tengan el dato correcto.", true], ["C", "corregir el dato en el nuevo informe sin mencionarlo, para no afectar la confianza en la información del programa.", "Corrige, pero oculta el error a quienes ya usaron la cifra anterior. Asumir la responsabilidad por los resultados implica reconocer y corregir de forma visible.", false]]}, {"id": "CO-112", "niv": 3, "e": "Respecto de los tres días que invierte cada trimestre en unificar formatos, la conducta que mejor refleja la orientación a resultados es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Orientación a resultados)", "o": [["A", "solicitar que se asigne un contratista de apoyo para hacer la unificación de los formatos cada trimestre.", "Gestiona recursos, pero mantiene el reproceso y lo traslada a otra persona con un costo adicional. No ataca la causa del problema.", false], ["B", "seguir haciendo la unificación usted mismo, ya que cambiar el formato podría confundir a los municipios y retrasar los reportes.", "Evita un riesgo, pero renuncia a mejorar un proceso ineficiente. La competencia incluye plantear estrategias para superar los resultados y mejorar la productividad.", false], ["C", "diseñar un formato único con instrucciones y proponerlo a su jefe para enviarlo a los municipios desde el próximo trimestre.", "Refleja la competencia «Orientación a resultados» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en cumplir las funciones y los compromisos de la organización con eficacia, calidad y oportunidad. Corresponde a plantear estrategias para alcanzar o superar los resultados y gestionar mejoras de productividad: ataca la causa del reproceso y libera tiempo para el análisis.", true]]}]}, {"comp": "comportamental", "rol": "general", "tag": "Competencias comportamentales (Decreto 815 de 2018) · Orientación al usuario y al ciudadano", "texto": "Usted atiende el punto de información de la Secretaría de Desarrollo Social de un municipio de quinta categoría, donde se reciben solicitudes para un subsidio municipal de transporte escolar. La convocatoria cierra en dos días. Entre los usuarios de la mañana hay un adulto mayor con dificultad auditiva que pregunta por los requisitos para su nieta, y una madre de familia que pregunta si su solicitud será aprobada, aunque usted observa que le falta el certificado de estudios. En las últimas semanas usted ha notado que muchos usuarios de las veredas no logran llegar en el horario de atención.", "items": [{"id": "CO-113", "niv": 1, "e": "Para atender al adulto mayor con dificultad auditiva, la conducta que mejor refleja la orientación al usuario y al ciudadano es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Orientación al usuario y al ciudadano)", "o": [["A", "explicarle los requisitos en voz alta y sugerirle que los consulte después con calma en la página web oficial de la alcaldía municipal.", "Intenta informar, pero no ajusta la forma de comunicarse a la dificultad auditiva ni verifica que el mensaje haya sido comprendido.", false], ["B", "pedirle con amabilidad que regrese con un familiar que pueda escuchar la explicación de los requisitos.", "Traslada al ciudadano la carga de la atención y lo hace volver. La competencia pide generar espacios y lenguaje incluyentes para atender a cada persona según sus condiciones.", false], ["C", "hablarle de frente y con frases cortas, comprobar que entendió y darle los requisitos por escrito, para que pueda repasarlos.", "Refleja la competencia «Orientación al usuario y al ciudadano» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en dirigir las decisiones y acciones a satisfacer las necesidades e intereses de los usuarios internos y externos y de los ciudadanos, según las responsabilidades de la entidad. Corresponde a las conductas de aplicar la no discriminación con espacios y lenguaje incluyentes, y de escuchar activamente e informar con veracidad: adapta la comunicación a la necesidad de la persona.", true]]}, {"id": "CO-114", "niv": 2, "e": "Ante la pregunta de la madre de familia sobre si su solicitud será aprobada, la conducta más acorde con la orientación al usuario y al ciudadano es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Orientación al usuario y al ciudadano)", "o": [["A", "recomendarle que no radique en esta convocatoria y espere la siguiente, cuando pueda reunir los documentos con calma.", "Aunque parezca prudente, le cierra una opción real: aún hay dos días para obtener el certificado. No atiende la necesidad de forma oportuna.", false], ["B", "indicarle con claridad que falta el certificado de estudios, que sin él la solicitud no cumple, y explicarle cómo obtenerlo antes del cierre.", "Refleja la competencia «Orientación al usuario y al ciudadano» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en dirigir las decisiones y acciones a satisfacer las necesidades e intereses de los usuarios internos y externos y de los ciudadanos, según las responsabilidades de la entidad. Responde a la conducta de informar con veracidad y atender las necesidades de forma oportuna: le da la información real y una ruta concreta para cumplir dentro del plazo.", true], ["C", "recibirle la solicitud incompleta y decirle que el comité evaluará si la acepta, para no desanimarla.", "Busca no desmotivarla, pero no informa con veracidad y le hace perder la oportunidad de completar el requisito a tiempo.", false]]}, {"id": "CO-115", "niv": 2, "e": "Frente a la dificultad de los usuarios de las veredas para llegar en el horario de atención, la conducta que mejor refleja la orientación al usuario y al ciudadano es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Orientación al usuario y al ciudadano)", "o": [["A", "registrar cuántos usuarios rurales consultan y qué dificultades tienen, y presentar esos datos con una propuesta de jornadas en las veredas.", "Refleja la competencia «Orientación al usuario y al ciudadano» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en dirigir las decisiones y acciones a satisfacer las necesidades e intereses de los usuarios internos y externos y de los ciudadanos, según las responsabilidades de la entidad. Corresponde a establecer mecanismos para conocer las necesidades de los ciudadanos e incorporarlas en los proyectos institucionales con visión de servicio: convierte una observación en información para decidir.", true], ["B", "difundir en la emisora comunitaria los horarios de atención para que los usuarios rurales organicen con tiempo su viaje.", "Mejora la información, pero no responde a la necesidad identificada: el problema no es desconocer el horario sino no poder llegar a tiempo.", false], ["C", "atender después del horario a los usuarios rurales que lleguen tarde a la sede, aunque deba quedarse por su cuenta y sin autorización del jefe.", "Tiene buena intención, pero da una solución individual e informal que no resuelve la necesidad de fondo ni la incorpora a la gestión de la entidad.", false]]}]}, {"comp": "comportamental", "rol": "general", "tag": "Competencias comportamentales (Decreto 815 de 2018) · Orientación al usuario y al ciudadano", "texto": "Usted trabaja en el punto de atención de una entidad distrital de Bogotá que tramita permisos para el aprovechamiento económico del espacio público. Esta semana llega un comerciante molesto porque ha venido tres veces y en cada visita le han dado información distinta sobre su trámite. También atiende a un vendedor que no sabe leer ni escribir y necesita diligenciar el formulario de solicitud. Además, varios usuarios se quejan de demoras que se originan en la visita técnica, a cargo de otra dependencia de la entidad.", "items": [{"id": "CO-116", "niv": 2, "e": "Ante el comerciante molesto por la información contradictoria, la conducta que mejor refleja la orientación al usuario y al ciudadano es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Orientación al usuario y al ciudadano)", "o": [["A", "ofrecerle disculpas en nombre de la entidad y orientarlo a radicar una queja para que su caso quede registrado.", "Reconocer la falla y orientar la queja es válido, pero deja sin resolver la necesidad concreta: saber en qué va su trámite.", false], ["B", "escucharlo sin interrumpir, revisar en el sistema el estado real del trámite y darle una respuesta precisa sobre lo que falta.", "Refleja la competencia «Orientación al usuario y al ciudadano» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en dirigir las decisiones y acciones a satisfacer las necesidades e intereses de los usuarios internos y externos y de los ciudadanos, según las responsabilidades de la entidad. Corresponde a escuchar activamente e informar con veracidad, y a atender de forma oportuna las necesidades del usuario: resuelve la causa de su molestia con información verificada.", true], ["C", "remitirlo al coordinador del punto de atención, quien tiene acceso a todos los trámites y puede darle una respuesta definitiva.", "Prolonga la atención y suma otro intermediario, cuando usted puede verificar el estado del trámite. No atiende la necesidad de forma oportuna.", false]]}, {"id": "CO-117", "niv": 1, "e": "Para atender al vendedor que no sabe leer ni escribir, la conducta más acorde con la orientación al usuario y al ciudadano es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Orientación al usuario y al ciudadano)", "o": [["A", "pedirle que regrese acompañado de alguien de su confianza que sepa leer, para que lo ayude a diligenciar y revisar el formulario con tranquilidad.", "Le impone una carga adicional y aplaza su trámite. La competencia pide adecuar la atención a las condiciones del ciudadano.", false], ["B", "entregarle el formulario y marcar con resaltador los campos que debe llenar la persona que lo ayude.", "Muestra disposición, pero no resuelve la necesidad: el usuario sigue dependiendo de un tercero para hacer su solicitud.", false], ["C", "leerle el formulario, diligenciarlo con los datos que él le dicte y leerle lo escrito antes de que firme o ponga su huella.", "Refleja la competencia «Orientación al usuario y al ciudadano» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en dirigir las decisiones y acciones a satisfacer las necesidades e intereses de los usuarios internos y externos y de los ciudadanos, según las responsabilidades de la entidad. Refleja la conducta de aplicar la no estigmatización y la no discriminación generando espacios incluyentes: adapta la atención a la condición del usuario y asegura que conozca lo que suscribe.", true]]}, {"id": "CO-118", "niv": 3, "e": "Frente a las quejas por demoras originadas en la visita técnica de otra dependencia, la conducta que mejor refleja la orientación al usuario y al ciudadano es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Orientación al usuario y al ciudadano)", "o": [["A", "informar al usuario en qué etapa está su trámite y enviar a la dependencia de visitas un reporte de los casos represados con sus fechas.", "Refleja la competencia «Orientación al usuario y al ciudadano» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en dirigir las decisiones y acciones a satisfacer las necesidades e intereses de los usuarios internos y externos y de los ciudadanos, según las responsabilidades de la entidad. Reúne las conductas de reconocer la interdependencia entre su trabajo y el de otros y de informar con veracidad: da al usuario información real y alerta a quien puede resolver el represamiento.", true], ["B", "explicar a cada usuario que la demora es responsabilidad de la otra dependencia y darle el teléfono de esa oficina.", "Informa, pero se desentiende del problema y traslada al usuario la gestión interna. La competencia reconoce la interdependencia entre áreas.", false], ["C", "comprometerse con cada usuario a que la visita técnica de su trámite se realizará esta misma semana.", "Busca tranquilizar, pero promete algo que no controla. La competencia exige informar con veracidad.", false]]}]}, {"comp": "comportamental", "rol": "general", "tag": "Competencias comportamentales (Decreto 815 de 2018) · Compromiso con la organización", "texto": "Usted es servidor de la oficina de talento humano de un municipio de sexta categoría. Una ola invernal dejó a cientos de familias damnificadas y la alcaldía necesita apoyo de todas las dependencias para registrar a las familias afectadas durante el fin de semana y los días siguientes. Usted tiene a cargo la liquidación de la nómina, que debe quedar lista el jueves para pagarse el viernes. Mientras tanto, en redes sociales circulan publicaciones que afirman, sin pruebas, que la alcaldía no ha entregado ninguna ayuda.", "items": [{"id": "CO-119", "niv": 1, "e": "El coordinador de gestión del riesgo pide voluntarios para el registro del sábado y usted no tiene tareas urgentes ese día. La conducta que mejor refleja el compromiso con la organización es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Compromiso con la organización)", "o": [["A", "recomendar que la alcaldía contrate personal temporal para el registro, pues los servidores de otras áreas no conocen el procedimiento.", "Plantea una alternativa, pero no se involucra en la necesidad de la organización y supone un tiempo y un costo que la emergencia no permite.", false], ["B", "esperar a que la alcaldía expida una orden formal de apoyo, ya que la gestión del riesgo no hace parte de sus funciones.", "Prioriza la formalidad sobre una necesidad urgente de la organización. La competencia incluye apoyar a la entidad en situaciones difíciles.", false], ["C", "ofrecerse para apoyar el registro del sábado, porque la emergencia lo requiere, e informarlo a su jefe inmediato.", "Refleja la competencia «Compromiso con la organización» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en alinear el propio comportamiento con las necesidades, prioridades y metas de la organización. Corresponde a apoyar a la organización en situaciones difíciles y tomar la iniciativa de colaborar con otras áreas cuando se requiere, manteniendo informado a su jefe.", true]]}, {"id": "CO-120", "niv": 2, "e": "El lunes le piden dedicar toda la semana al registro de damnificados. La conducta más acorde con el compromiso con la organización es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Compromiso con la organización)", "o": [["A", "dedicarse por completo al registro durante la semana, pues atender la emergencia prima sobre cualquier trámite interno de la dependencia.", "Apoya la emergencia, pero descuida la nómina, cuyo pago también es una prioridad de la entidad. La conducta asociada pide colaborar sin descuidar las propias tareas.", false], ["B", "asegurar que la nómina quede liquidada el jueves y apoyar el registro en el tiempo restante, avisando a ambos.", "Refleja la competencia «Compromiso con la organización» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en alinear el propio comportamiento con las necesidades, prioridades y metas de la organización. Refleja la conducta de tomar la iniciativa de colaborar con otras áreas cuando se requiere, sin descuidar las propias tareas: atiende las dos prioridades de la organización.", true], ["C", "excusarse de apoyar el registro para no poner en riesgo la nómina y explicar que no tiene disponibilidad esa semana.", "Protege su tarea, pero no colabora con la organización en una situación difícil cuando sí podría hacerlo en parte de su tiempo.", false]]}, {"id": "CO-121", "niv": 3, "e": "Un vecino le pregunta a usted si es cierto lo que dicen las redes sobre las ayudas. La conducta que mejor refleja el compromiso con la organización es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Compromiso con la organización)", "o": [["A", "contarle lo que le consta sobre las entregas y orientarlo al reporte oficial de ayudas que publica la alcaldía.", "Refleja la competencia «Compromiso con la organización» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en alinear el propio comportamiento con las necesidades, prioridades y metas de la organización. Corresponde a demostrar sentido de pertenencia y apoyar a la organización en situaciones difíciles, sin asumir una vocería que no le corresponde: da información cierta y remite a la fuente oficial.", true], ["B", "decirle que prefiere no opinar sobre el tema y que esos asuntos los maneja directamente la oficina de prensa de la alcaldía.", "Es prudente, pero pierde la oportunidad de apoyar a la organización con información que conoce de primera mano y de orientar al ciudadano hacia la fuente oficial.", false], ["C", "publicar desde su cuenta personal fotos de las entregas para desmentir las críticas y defender la gestión de la alcaldía.", "Busca defender a la entidad, pero asume una vocería institucional que no le corresponde y puede difundir información sin el respaldo de los canales oficiales.", false]]}]}, {"comp": "comportamental", "rol": "general", "tag": "Competencias comportamentales (Decreto 815 de 2018) · Trabajo en equipo", "texto": "Usted integra el equipo de educación ambiental de una corporación autónoma regional del Caribe, que prepara una jornada sobre ahorro de agua en 12 instituciones educativas. En la última reunión cada integrante asumió una tarea: usted, los contenidos de las charlas; Laura, la logística y los horarios acordados con los colegios; Andrés, la convocatoria; y Mateo, quien llegó hace una semana trasladado de otra dependencia, el registro fotográfico. Mateo no conoce aún a los rectores ni la forma de trabajo del equipo.", "items": [{"id": "CO-122", "niv": 2, "e": "Respecto de Mateo, la conducta que mejor refleja el trabajo en equipo es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Trabajo en equipo)", "o": [["A", "sugerir que Mateo asista a esta jornada solo como observador y asuma tareas desde la siguiente.", "Pospone su integración y desconoce que ya asumió una tarea en el reparto del equipo.", false], ["B", "explicarle cómo funciona el equipo y presentarle a los contactos de los colegios, para que asuma pronto su tarea.", "Refleja la competencia «Trabajo en equipo» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en trabajar con otros de manera integrada y armónica para lograr metas institucionales comunes. Corresponde a integrar a los nuevos miembros y facilitar su proceso de reconocimiento y apropiación de las actividades a cargo del equipo.", true], ["C", "enviarle por correo las actas de las reuniones anteriores y el directorio de colegios para que se ponga al día por su cuenta.", "Le entrega información, pero lo deja solo en su proceso de integración. La conducta asociada pide facilitar activamente el reconocimiento de las actividades del equipo.", false]]}, {"id": "CO-123", "niv": 2, "e": "Andrés propone hacer la convocatoria por redes sociales; usted considera que funcionaría mejor un oficio dirigido a cada rector. La conducta más acorde con el trabajo en equipo es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Trabajo en equipo)", "o": [["A", "exponer sus razones en la reunión, escuchar las de Andrés y acoger lo que el equipo decida, aunque no sea su propuesta.", "Refleja la competencia «Trabajo en equipo» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en trabajar con otros de manera integrada y armónica para lograr metas institucionales comunes. Reúne las conductas de establecer comunicación directa para compartir ideas con respeto y de respetar la diversidad de criterios y opiniones de los miembros del equipo.", true], ["B", "enviar por su cuenta oficios a los rectores como respaldo, por si la convocatoria por redes no funciona.", "Actúa sin considerar el efecto en el trabajo de su compañero y puede duplicar o contradecir la convocatoria. No planifica teniendo en cuenta los objetivos del grupo.", false], ["C", "dejar que Andrés haga la convocatoria a su manera y concentrarse en preparar los contenidos de las charlas de ahorro de agua.", "Respeta la tarea de Andrés, pero se guarda una idea que podría mejorar el resultado común. La competencia incluye compartir ideas de forma directa y respetuosa.", false]]}, {"id": "CO-124", "niv": 3, "e": "Usted quiere ampliar las charlas para incluir el cambio climático, lo que las alargaría de 30 a 60 minutos. La conducta que mejor refleja el trabajo en equipo es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Trabajo en equipo)", "o": [["A", "ajustar los contenidos a 60 minutos, porque los contenidos son su responsabilidad y el cambio mejora la calidad pedagógica.", "Mejora su parte, pero ignora el efecto sobre los horarios ya pactados por Laura con los colegios. No planifica pensando en el objetivo del grupo.", false], ["B", "mantener las charlas de 30 minutos y guardar la idea del cambio climático para otra jornada, sin comentarla al equipo.", "Evita riesgos, pero se reserva una idea útil. El trabajo en equipo incluye compartir información e ideas con los demás integrantes.", false], ["C", "revisar con Laura si los horarios pactados con los colegios admiten una charla más larga, antes de cambiarla.", "Refleja la competencia «Trabajo en equipo» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en trabajar con otros de manera integrada y armónica para lograr metas institucionales comunes. Corresponde a planificar las propias acciones teniendo en cuenta su repercusión en los objetivos grupales: el cambio afecta la logística que maneja otra compañera y debe acordarse con ella.", true]]}]}, {"comp": "comportamental", "rol": "general", "tag": "Competencias comportamentales (Decreto 815 de 2018) · Aprendizaje continuo", "texto": "Usted trabaja en la Subdirección Administrativa de una secretaría distrital de Bogotá. La entidad implementó un sistema de gestión documental electrónico que reemplaza el registro en hojas de cálculo, y ofrece un curso virtual de 20 horas, en franjas de dos horas dentro de la jornada. Usted domina la clasificación de documentos según las tablas de retención documental, pero se le dificulta el nuevo sistema. Su compañero Felipe, que ingresó hace poco, maneja el sistema con facilidad pero comete errores al clasificar. En un chat de la dependencia circula un instructivo no oficial sobre cómo firmar electrónicamente en el sistema.", "items": [{"id": "CO-125", "niv": 1, "e": "Frente al curso virtual ofrecido por la entidad, la conducta que mejor refleja el aprendizaje continuo es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Aprendizaje continuo)", "o": [["A", "esperar unos meses a que el sistema se estabilice y tomar el curso en una cohorte posterior.", "Aplaza la actualización sin razón suficiente. La competencia pide mantener las competencias al día frente a los cambios que exige la administración.", false], ["B", "inscribirse en el curso y reorganizar sus pendientes para asistir, pues así dominará pronto la nueva herramienta.", "Refleja la competencia «Aprendizaje continuo» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en identificar, incorporar y aplicar conocimientos nuevos sobre normas, tecnologías y métodos de trabajo para mantener vigente la efectividad de las propias prácticas. Corresponde a la conducta de participar en espacios informativos y de capacitación para mantener sus competencias actualizadas frente a las nuevas tecnologías de la entidad.", true], ["C", "seguir llevando en paralelo su hoja de cálculo mientras domina el sistema, para no cometer errores en el registro.", "Busca evitar errores, pero mantiene la práctica anterior en lugar de incorporar la nueva herramienta, y duplica el trabajo.", false]]}, {"id": "CO-126", "niv": 2, "e": "Respecto de Felipe, la conducta más acorde con el aprendizaje continuo es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Aprendizaje continuo)", "o": [["A", "proponerle que él le enseñe el manejo del sistema y usted le explique cómo clasificar según las tablas de retención.", "Refleja la competencia «Aprendizaje continuo» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en identificar, incorporar y aplicar conocimientos nuevos sobre normas, tecnologías y métodos de trabajo para mantener vigente la efectividad de las propias prácticas. Refleja la conducta de compartir saberes con los compañeros y aprender de ellos habilidades diferenciales en flujos informales de interaprendizaje: ambos nivelan sus conocimientos.", true], ["B", "ofrecerle hacer la clasificación de los documentos de los dos a cambio de que él los cargue en el sistema.", "Reparte tareas según lo que cada uno ya sabe, pero ninguno aprende lo que le falta. No hay incorporación de conocimiento nuevo.", false], ["C", "pedirle que le escriba una guía paso a paso del sistema para estudiarla por su cuenta en los ratos libres de la semana.", "Aprende del compañero, pero en una sola vía: no comparte su propio saber sobre clasificación, que es justo lo que Felipe necesita.", false]]}, {"id": "CO-127", "niv": 3, "e": "Frente al instructivo no oficial que circula en el chat, la conducta que mejor refleja el aprendizaje continuo es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Aprendizaje continuo)", "o": [["A", "aplicarlo en sus documentos tal como lo están usando varios compañeros de la dependencia.", "Se basa en una fuente no verificada. La conducta asociada exige gestionar fuentes de información confiables.", false], ["B", "descartarlo y no usar la firma electrónica hasta recibir una capacitación presencial sobre esa función.", "Evita el riesgo, pero frena la incorporación de la herramienta cuando existe información oficial que puede consultar.", false], ["C", "contrastarlo antes de usarlo con el manual oficial del sistema, ya que el instructivo no tiene respaldo de la entidad.", "Refleja la competencia «Aprendizaje continuo» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en identificar, incorporar y aplicar conocimientos nuevos sobre normas, tecnologías y métodos de trabajo para mantener vigente la efectividad de las propias prácticas. Corresponde a gestionar sus propias fuentes de información confiable: verificar contra el manual oficial permite aprovechar lo útil del instructivo sin asumir errores.", true]]}]}, {"comp": "comportamental", "rol": "general", "tag": "Competencias comportamentales (Decreto 815 de 2018) · Orientación a resultados", "texto": "Usted trabaja en la Secretaría de Infraestructura de una gobernación y apoya el seguimiento de 15 convenios con municipios para construir vías terciarias en placa huella. Su jefe le pidió visitar todas las obras en los próximos dos meses; el vehículo asignado solo está disponible dos días por semana. En una de las visitas, el alcalde le pide que en el informe registre la obra como terminada para poder liquidar el convenio antes de fin de año, aunque usted verificó que falta cerca del 5 % de la obra, que según él se terminará en enero.", "items": [{"id": "CO-128", "niv": 1, "e": "Para planear las visitas, la conducta que mejor refleja la orientación a resultados es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Orientación a resultados)", "o": [["A", "programar las 15 visitas dentro del primer mes para tener margen, aunque el vehículo solo esté disponible dos días por semana.", "El plan no es realista frente a los recursos: con dos días semanales de vehículo, difícilmente se cumple en un mes y el cronograma se rompería.", false], ["B", "visitar primero los municipios más cercanos a la capital, para avanzar rápido en el número de visitas realizadas.", "Prioriza la cantidad y la comodidad sobre el riesgo. No orienta el esfuerzo a los convenios donde el seguimiento es más necesario.", false], ["C", "programar las visitas según los días reales de disponibilidad del vehículo y dar prioridad a los convenios con mayor atraso.", "Refleja la competencia «Orientación a resultados» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en cumplir las funciones y los compromisos de la organización con eficacia, calidad y oportunidad. Responde a trabajar con objetivos claros y realistas y adoptar medidas para minimizar riesgos: el plan se ajusta a los recursos disponibles y atiende primero donde hay más riesgo.", true]]}, {"id": "CO-129", "niv": 2, "e": "Para hacer seguimiento al avance de los convenios durante los dos meses, la conducta más acorde con la orientación a resultados es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Orientación a resultados)", "o": [["A", "anotar en su libreta de campo los hallazgos de cada visita y consolidarlos en un solo documento al cierre de los dos meses.", "Re
