artes 20 de julio como hábil. Ese día es festivo y no se cuenta.", false], ["C", "miércoles 4 de agosto de 2027.", "El reclamo debe atenderse en quince días hábiles contados a partir del día siguiente a su recibo (art. 15, num. 3): 14 a 16 de julio (3), 19 y 21 a 23 (7), 26 a 30 (12) y 2 a 4 de agosto (15). Se excluye el festivo del 20 de julio.", true]]}, {"id": "AP-198", "niv": 3, "e": "Si no es posible atender el reclamo en el término inicial y así se le informa con los motivos, la nueva fecha de respuesta no podrá superar el", "f": "Ley 1581 de 2012, art. 15, num. 3; cálculo de días hábiles", "o": [["A", "miércoles 11 de agosto de 2027.", "Aplica la prórroga de cinco días hábiles prevista para las consultas (art. 14). Para los reclamos la prórroga máxima es de ocho días hábiles.", false], ["B", "martes 17 de agosto de 2027.", "La nueva fecha no puede superar los ocho días hábiles siguientes al vencimiento del primer término (art. 15, num. 3). Desde el 4 de agosto: 5 y 6 (2), 9 a 13 (7) y martes 17 (8), excluido el festivo del 16 de agosto.", true], ["C", "jueves 26 de agosto de 2027.", "Duplica el término inicial, como ocurre con la ampliación del derecho de petición (Ley 1755 de 2015). La Ley 1581 de 2012 fija para los reclamos una prórroga máxima de ocho días hábiles.", false]]}, {"id": "AP-199", "niv": 2, "e": "Una vez recibido el reclamo completo, el instituto debe incluir en la base de datos la leyenda «reclamo en trámite»", "f": "Ley 1581 de 2012, art. 15, num. 2", "o": [["A", "en un término no mayor a dos días hábiles, y mantenerla hasta que el reclamo se decida.", "El numeral 2 del artículo 15 de la Ley 1581 de 2012 ordena incluir la leyenda «reclamo en trámite» y el motivo en un término no mayor a dos días hábiles, y mantenerla hasta que el reclamo sea decidido.", true], ["B", "solo si el reclamo no se resuelve dentro de los quince días hábiles del término inicial.", "La leyenda no depende del vencimiento del término: se incluye apenas se recibe el reclamo completo.", false], ["C", "dentro de los cinco días hábiles siguientes, y retirarla cuando se cumpla el término inicial de respuesta.", "El plazo es de dos días hábiles y la leyenda se mantiene hasta que el reclamo se decida, no hasta el vencimiento del término.", false]]}]}, {"comp": "atencion_procedimiento", "rol": "tecnico", "tag": "Atención al ciudadano y procedimiento administrativo · Nivel técnico · Protección de datos personales: consultas y reclamos", "texto": "Usted es técnico administrativo de la oficina de atención al ciudadano de una corporación autónoma regional, responsable de la base de datos de usuarios de sus trámites. Un usuario radicó un reclamo para que se supriman sus datos de una lista de difusión, pero no indicó la dirección para recibir la respuesta ni describió los hechos. Otro ciudadano radicó en la corporación un reclamo sobre datos que administra exclusivamente una empresa de servicios públicos del municipio. Un tercer ciudadano presentó una consulta para conocer toda la información que la corporación conserva sobre él.", "items": [{"id": "AP-200", "niv": 3, "e": "Frente al reclamo incompleto, la corporación debe", "f": "Ley 1581 de 2012, art. 15, num. 1", "o": [["A", "rechazarlo de plano, porque un reclamo sin descripción de los hechos no puede tramitarse.", "La ley no prevé el rechazo de plano: ordena requerir al interesado para que subsane.", false], ["B", "requerirlo dentro de los cinco días siguientes a la recepción para que subsane, y entender desistido el reclamo si pasan dos meses sin respuesta.", "El numeral 1 del artículo 15 de la Ley 1581 de 2012 dispone que, si el reclamo resulta incompleto, se requiere al interesado dentro de los cinco días siguientes a su recepción para que subsane las fallas, y que, transcurridos dos meses desde el requerimiento sin que presente la información, se entiende que desistió.", true], ["C", "requerir al usuario dentro de los diez días siguientes para que lo complete en el término máximo de un mes, como ocurre con las peticiones incompletas.", "Ese es el régimen general del artículo 17 del CPACA. Para los reclamos de datos personales, la Ley 1581 de 2012 fija reglas propias: requerimiento en cinco días y desistimiento a los dos meses.", false]]}, {"id": "AP-201", "niv": 2, "e": "Frente al reclamo sobre datos que administra la empresa de servicios públicos, la corporación debe", "f": "Ley 1581 de 2012, art. 15, num. 1", "o": [["A", "darle traslado a la empresa en un término máximo de dos días hábiles e informar de la situación al ciudadano.", "El numeral 1 del artículo 15 de la Ley 1581 de 2012 dispone que, si quien recibe el reclamo no es competente para resolverlo, dará traslado a quien corresponda en un término máximo de dos días hábiles e informará de la situación al interesado.", true], ["B", "devolverlo al ciudadano para que lo presente directamente ante la empresa de servicios públicos.", "La ley no autoriza devolver el reclamo: ordena trasladarlo a quien corresponda e informar al interesado.", false], ["C", "remitirlo a la empresa dentro de los cinco días siguientes, como en el derecho de petición ante autoridad sin competencia.", "Para los reclamos de datos personales la ley fija un término especial y más corto: dos días hábiles.", false]]}, {"id": "AP-202", "niv": 3, "e": "La consulta del tercer ciudadano debe atenderse en", "f": "Ley 1581 de 2012, art. 14", "o": [["A", "un máximo de quince días hábiles, prorrogable hasta ocho días hábiles más si se le informan los motivos de la demora.", "Esos son los términos del reclamo (art. 15). La consulta para conocer la información tiene términos más cortos.", false], ["B", "un máximo de diez días hábiles, prorrogable hasta cinco días hábiles más si se le informan los motivos de la demora.", "El artículo 14 de la Ley 1581 de 2012 ordena atender la consulta en un máximo de diez días hábiles desde su recibo. Si no es posible, se informan los motivos y la nueva fecha, que no puede superar los cinco días hábiles siguientes al vencimiento del primer término.", true], ["C", "treinta días hábiles, porque toda consulta ante una autoridad tiene ese término, prorrogable hasta el doble.", "Los treinta días del artículo 14 del CPACA corresponden a las consultas sobre materias a cargo de la autoridad. La consulta de datos personales tiene un régimen especial en la Ley 1581 de 2012.", false]]}]}, {"comp": "atencion_procedimiento", "rol": "general", "tag": "Atención al ciudadano y procedimiento administrativo · Protección de datos personales: autorización", "texto": "La Secretaría de Educación de un municipio certificado administra la base de datos de los beneficiarios de su auxilio de transporte para estudiantes universitarios, todos mayores de edad. La Personería municipal, en ejercicio de sus funciones de vigilancia, pide el listado de beneficiarios con sus nombres, documentos y direcciones. Al mismo tiempo, la secretaría diseña el formulario de inscripción de un nuevo programa voluntario de formación para padres de familia y discute cómo recoger la autorización para el tratamiento de los datos. Además, un beneficiario pide copia de sus propios datos personales que reposan en la base, y un funcionario propone cobrarle.", "items": [{"id": "AP-203", "niv": 3, "e": "Para entregar a la Personería el listado de beneficiarios, la secretaría", "f": "Ley 1581 de 2012, art. 10, lit. a", "o": [["A", "debe obtener previamente la autorización escrita de cada uno de los titulares o sus representantes.", "El literal a del artículo 10 de la Ley 1581 de 2012 exceptúa de la autorización la información requerida por una entidad pública en ejercicio de sus funciones legales.", false], ["B", "solo puede entregarlo si la Personería presenta una orden judicial que lo autorice.", "La orden judicial es una de las causales de excepción, pero no la única: también lo es el requerimiento de una entidad pública en ejercicio de sus funciones legales.", false], ["C", "no requiere la autorización de los titulares, porque una entidad pública la pide en ejercicio de sus funciones legales.", "El literal a del artículo 10 de la Ley 1581 de 2012 dispone que no es necesaria la autorización del titular cuando la información la requiere una entidad pública en ejercicio de sus funciones legales. Quien accede a los datos debe, en todo caso, cumplir la ley.", true]]}, {"id": "AP-204", "niv": 1, "e": "En el nuevo programa voluntario, la autorización para el tratamiento de los datos debe ser", "f": "Ley 1581 de 2012, art. 9", "o": [["A", "previa e informada, y obtenida por cualquier medio que pueda ser objeto de consulta posterior.", "El artículo 9 de la Ley 1581 de 2012 exige que, salvo las excepciones legales, el tratamiento cuente con la autorización previa e informada del titular, obtenida por cualquier medio que pueda ser objeto de consulta posterior.", true], ["B", "otorgada ante notario, para que tenga plena validez frente a terceros.", "La ley no exige formalidad notarial: basta un medio que permita consultarla después.", false], ["C", "verbal y sin registro, porque los padres se inscriben voluntariamente.", "La autorización debe obtenerse por un medio que pueda ser objeto de consulta posterior; una autorización verbal sin registro no lo permite.", false]]}, {"id": "AP-205", "niv": 1, "e": "Frente a la propuesta de cobrar al beneficiario por conocer sus propios datos, lo correcto es señalar que", "f": "Ley 1581 de 2012, art. 8, lit. f", "o": [["A", "puede cobrarse una tarifa fijada por la secretaría, porque la consulta implica trabajo adicional del personal.", "La ley garantiza el acceso gratuito del titular a sus propios datos.", false], ["B", "el titular tiene derecho a acceder en forma gratuita a sus datos personales que han sido objeto de tratamiento.", "El literal f del artículo 8 de la Ley 1581 de 2012 reconoce al titular el derecho a acceder en forma gratuita a sus datos personales que hayan sido objeto de tratamiento.", true], ["C", "puede cobrarse si la consulta se hace más de una vez en el mismo año.", "La Ley 1581 de 2012 no limita la gratuidad del acceso del titular a sus propios datos según el número de consultas.", false]]}]}, {"comp": "atencion_procedimiento", "rol": "tecnico", "tag": "Atención al ciudadano y procedimiento administrativo · Nivel técnico · Información reservada en el derecho de petición", "texto": "Usted es técnico administrativo de la oficina de talento humano de una gobernación. Una periodista, sin autorización del titular, solicita copia completa de la historia laboral de un exsecretario de despacho, incluidas sus evaluaciones médicas ocupacionales y los datos de su núcleo familiar. En la misma solicitud pide los decretos de nombramiento y el acta de posesión del exsecretario, que están archivados dentro de esa historia laboral. Días después, la Procuraduría Provincial solicita la historia laboral completa para una investigación disciplinaria en curso.", "items": [{"id": "AP-206", "niv": 2, "e": "Frente a la solicitud de la historia laboral completa, la gobernación debe", "f": "Ley 1755 de 2015, art. 1 (arts. 24, num. 3 y parágrafo, y 25 de la Ley 1437 de 2011)", "o": [["A", "rechazar su entrega mediante decisión motivada que indique las normas que la impiden, porque la periodista no es titular ni está autorizada.", "El numeral 3 del artículo 24 del CPACA reserva la historia laboral y su parágrafo permite pedirla solo al titular, sus apoderados o personas autorizadas con facultad expresa. El artículo 25 exige que el rechazo sea motivado, indique las disposiciones legales que impiden la entrega y se notifique.", true], ["B", "entregarla completa, porque el exsecretario fue un servidor público de alto nivel.", "La condición de servidor público no elimina la reserva de la historia laboral, que solo puede pedir el titular, su apoderado o una persona autorizada con facultad expresa.", false], ["C", "negarla sin necesidad de motivación, porque la reserva de la historia laboral es evidente.", "Toda decisión que rechace una petición de informaciones o documentos debe ser motivada e indicar las disposiciones legales que impiden la entrega (art. 25 del CPACA).", false]]}, {"id": "AP-207", "niv": 3, "e": "Frente a la solicitud de la Procuraduría Provincial, la gobernación debe", "f": "Ley 1755 de 2015, art. 1 (art. 27 de la Ley 1437 de 2011)", "o": [["A", "negarla, porque la historia laboral solo puede entregarse al titular o a quien este autorice.", "La reserva no es oponible a las autoridades administrativas legalmente competentes que pidan la información para el debido ejercicio de sus funciones (art. 27 del CPACA).", false], ["B", "entregarla solo si la Procuraduría presenta autorización escrita del exsecretario investigado.", "La ley no exige autorización del titular cuando la información la pide una autoridad competente para ejercer sus funciones.", false], ["C", "entregarla, porque la reserva no es oponible a las autoridades competentes que la piden para ejercer sus funciones, las cuales deben mantenerla.", "El artículo 27 del CPACA dispone que el carácter reservado de una información no es oponible a las autoridades judiciales, legislativas ni administrativas legalmente competentes que la soliciten para el debido ejercicio de sus funciones. Esas autoridades deben asegurar la reserva.", true]]}, {"id": "AP-208", "niv": 3, "e": "Respecto de los decretos de nombramiento y el acta de posesión archivados en la historia laboral, la gobernación debe", "f": "Ley 1755 de 2015, art. 1 (art. 25, inciso 2, de la Ley 1437 de 2011); Ley 1712 de 2014, art. 21", "o": [["A", "entregarlos, porque la reserva no se extiende a piezas del expediente que no están cubiertas por ella.", "El inciso 2 del artículo 25 del CPACA dispone que la restricción por reserva legal no se extiende a otras piezas del expediente que no estén cubiertas por ella, y el artículo 21 de la Ley 1712 de 2014 ordena entregar la información que no cae en ninguna excepción. Los actos de nombramiento y posesión no son reservados.", true], ["B", "entregarlos solo si el exsecretario lo autoriza por escrito, porque forman parte de su historia laboral.", "La autorización del titular se exige para la información reservada. Los actos de nombramiento y posesión no lo son.", false], ["C", "negarlos, porque al estar archivados en la historia laboral quedan cubiertos por la misma reserva.", "La ubicación física de un documento no le da carácter reservado. La reserva se aplica por su contenido y no se extiende a las piezas no cubiertas.", false]]}]}, {"comp": "atencion_procedimiento", "rol": "profesional", "tag": "Atención al ciudadano y procedimiento administrativo · Nivel profesional · Cálculo de términos", "texto": "Usted es profesional universitario de la oficina jurídica de una alcaldía de segunda categoría. El lunes 15 de marzo de 2027 un ciudadano radicó una petición de interés particular, sin norma especial de términos. La alcaldía la resolvió negativamente y notificó personalmente la decisión el martes 20 de abril de 2027; en la diligencia se le informó que procedía la reposición. La alcaldía atiende de lunes a viernes. En marzo de 2027 son festivos el lunes 22, el jueves 25 y el viernes 26; entre el 20 de abril y el 7 de mayo de 2027 no hay festivos en días hábiles (el sábado 1 de mayo no afecta el cómputo).", "items": [{"id": "AP-209", "niv": 3, "e": "El último día que tenía la alcaldía para responder oportunamente la petición era el", "f": "Ley 1755 de 2015, art. 1 (art. 14 de la Ley 1437 de 2011); cálculo de días hábiles", "o": [["A", "martes 6 de abril de 2027.", "Resulta de descontar solo el festivo del 22 de marzo y contar como hábiles el jueves y el viernes santos.", false], ["B", "miércoles 7 de abril de 2027.", "Resulta de contar el día de la radicación como primer día. El término corre a partir del día siguiente a la recepción.", false], ["C", "jueves 8 de abril de 2027.", "El término general es de quince días siguientes a la recepción: 16 a 19 de marzo (4), 23 y 24 (6), 29 de marzo a 2 de abril (11) y 5 a 8 de abril (15). Se excluyen los festivos del 22, 25 y 26 de marzo.", true]]}, {"id": "AP-210", "niv": 3, "e": "El último día para que el ciudadano interponga el recurso de reposición es el", "f": "Ley 1437 de 2011, art. 76; cálculo de días hábiles", "o": [["A", "viernes 30 de abril de 2027.", "Resulta de contar diez días calendario. El término de diez días del artículo 76 es de días hábiles.", false], ["B", "lunes 3 de mayo de 2027.", "Resulta de contar el día de la notificación como primer día. El plazo corre dentro de los diez días siguientes a la notificación.", false], ["C", "martes 4 de mayo de 2027.", "El recurso puede interponerse dentro de los diez días siguientes a la notificación personal: 21 a 23 de abril (3), 26 a 30 (8), 3 de mayo (9) y 4 de mayo (10). El 1 de mayo cae sábado y no altera el cómputo.", true]]}, {"id": "AP-211", "niv": 3, "e": "Si el ciudadano no interpone el recurso, la decisión queda en firme a partir del", "f": "Ley 1437 de 2011, arts. 76 y 87, num. 3", "o": [["A", "miércoles 21 de abril de 2027.", "Es el día siguiente a la notificación, regla que aplica solo cuando contra el acto no procede ningún recurso (art. 87, num. 1). Contra esta decisión procedía la reposición.", false], ["B", "martes 4 de mayo de 2027.", "Ese día vence el plazo para recurrir; el acto todavía puede ser recurrido hasta el final de esa fecha.", false], ["C", "miércoles 5 de mayo de 2027.", "El numeral 3 del artículo 87 del CPACA dispone que el acto queda en firme desde el día siguiente al vencimiento del término para interponer los recursos. El plazo venció el martes 4 de mayo, de modo que la firmeza se produce el miércoles 5.", true]]}]}, {"comp": "atencion_procedimiento", "rol": "asistencial", "tag": "Atención al ciudadano y procedimiento administrativo · Nivel asistencial · Presentación de recursos", "texto": "Usted es auxiliar administrativo de la ventanilla de correspondencia de la Secretaría de Hacienda de un municipio de sexta categoría. Un ciudadano que fue notificado personalmente hace cuatro días hábiles de una resolución que le negó un auxilio quiere presentar recurso de reposición. Primero pregunta si puede exponerle sus motivos de palabra en la ventanilla para que usted los anote. Luego pregunta si puede enviar el recurso por correo electrónico y si debe autenticar su firma en notaría. Por último, le cuenta que la semana pasada otro funcionario se negó a recibirle un escrito similar.", "items": [{"id": "AP-212", "niv": 2, "e": "Frente a la pregunta de si puede exponer el recurso de palabra para que usted lo anote, debe explicarle que", "f": "Ley 1437 de 2011, arts. 76 y 77", "o": [["A", "puede hacerlo, porque cualquier petición, incluidos los recursos, puede presentarse verbalmente.", "El artículo 15 del CPACA permite las peticiones verbales, pero aclara que los recursos se presentan conforme a sus normas especiales, que exigen la forma escrita.", false], ["B", "el recurso de reposición debe presentarse por escrito, sustentado con los motivos concretos de su inconformidad.", "El artículo 76 del CPACA exige interponer los recursos de reposición y apelación por escrito, y el artículo 77 exige sustentarlos con expresión concreta de los motivos de inconformidad.", true], ["C", "puede hacerlo solo si un abogado lo acompaña y firma el acta en la que usted transcriba sus motivos.", "La ley no exige abogado para que el interesado recurra en nombre propio. Lo que exige es que el recurso se presente por escrito.", false]]}, {"id": "AP-213", "niv": 1, "e": "Sobre el envío por correo electrónico, debe informarle que", "f": "Ley 1437 de 2011, art. 77", "o": [["A", "puede presentar el recurso por medios electrónicos.", "El artículo 77 del CPACA dispone que los recursos se interponen por escrito y que también pueden presentarse por medios electrónicos.", true], ["B", "es posible, pero el recurso solo se tendrá por presentado cuando entregue el original firmado en la ventanilla.", "La ley no exige entregar después el original físico para que el recurso presentado electrónicamente sea válido.", false], ["C", "no es posible, porque los recursos deben radicarse en físico en la ventanilla de la entidad.", "El artículo 77 del CPACA permite presentar los recursos por medios electrónicos.", false]]}, {"id": "AP-214", "niv": 1, "e": "Sobre la autenticación de la firma en notaría, lo correcto es indicarle que", "f": "Ley 1437 de 2011, art. 77; Decreto Ley 019 de 2012, art. 5", "o": [["A", "debe autenticarla, porque el recurso es un documento que busca modificar una decisión de la administración.", "Ninguna norma exige autenticar la firma del recurrente que actúa en nombre propio y fue reconocido en la actuación.", false], ["B", "no la necesita, porque ya fue reconocido como interesado en la actuación.", "El artículo 77 del CPACA dispone que el escrito del recurso no requiere presentación personal si quien lo presenta ha sido reconocido en la actuación, y el Decreto Ley 019 de 2012 proscribe las autenticaciones no ordenadas por la ley.", true], ["C", "debe autenticarla solo si envía el recurso por correo electrónico, para acreditar su identidad.", "La ley no exige autenticación para el recurso presentado por medios electrónicos.", false]]}, {"id": "AP-215", "niv": 2, "e": "Si en otra ocasión un funcionario competente se niega a recibirle un recurso, el ciudadano puede", "f": "Ley 1437 de 2011, art. 76, inciso 2", "o": [["A", "presentarlo directamente ante el juez administrativo, que lo tramitará en lugar de la secretaría.", "El juez administrativo no recibe ni tramita los recursos en sede administrativa. La ley prevé acudir al procurador regional o al personero.", false], ["B", "presentarlo ante el personero municipal o el procurador regional, para que ordene recibirlo y tramitarlo.", "El inciso 2 del artículo 76 del CPACA dispone que, si quien es competente no quisiere recibir los recursos, estos pueden presentarse ante el procurador regional o ante el personero municipal, para que ordene recibirlos y tramitarlos e imponga las sanciones que correspondan.", true], ["C", "dar por agotado el recurso y entender que se produjo el silencio administrativo positivo.", "La negativa a recibir un recurso no produce silencio positivo. La ley prevé un mecanismo para que el recurso se reciba y se tramite.", false]]}]}, {"comp": "gestion_publica", "rol": "profesional", "tag": "Gestión pública, MIPG, contratación y documentos · Nivel profesional · MIPG: Comité Institucional de Gestión y Desempeño", "texto": "Usted es profesional universitario de la Oficina Asesora de Planeación de la alcaldía de un municipio de tercera categoría. El alcalde adoptó el Modelo Integrado de Planeación y Gestión (MIPG) y le pidió proyectar la resolución que conforma el Comité Institucional de Gestión y Desempeño. En la reunión preparatoria, el secretario general propone tres cosas: que el comité se reúna una vez al año para revisar el avance del modelo; que la secretaría técnica la ejerza el jefe de la Oficina de Control Interno, «porque es quien conoce la evaluación de la gestión», y que se mantengan, por separado, otros cuatro comités internos creados hace años mediante resoluciones de la propia alcaldía, que tratan temas del modelo y que ninguna ley exige.", "items": [{"id": "GP-101", "niv": 1, "e": "Frente a la periodicidad propuesta, usted advierte que el comité debe aprobar y hacer seguimiento a las acciones y estrategias para la operación del MIPG", "f": "Decreto 1083 de 2015, art. 2.2.22.3.8, num. 1 (sustituido por el Decreto 1499 de 2017)", "o": [["A", "por lo menos una vez cada tres meses.", "El artículo 2.2.22.3.8 del Decreto 1083 de 2015 (texto del Decreto 1499 de 2017), numeral 1, asigna al Comité Institucional de Gestión y Desempeño la función de aprobar y hacer seguimiento a las acciones del modelo como mínimo trimestralmente.", true], ["B", "por lo menos una vez cada seis meses.", "La periodicidad semestral corresponde, por ejemplo, al seguimiento que hacen los comités sectoriales de gestión y desempeño del orden nacional; para el comité institucional la norma exige un seguimiento más frecuente, al menos trimestral.", false], ["C", "una vez al año, al cierre de la vigencia fiscal.", "Una revisión anual, como propone el secretario general, incumple el mínimo previsto en el numeral 1 del artículo 2.2.22.3.8 del Decreto 1083 de 2015, que exige seguimiento por lo menos cada tres meses.", false]]}, {"id": "GP-102", "niv": 2, "e": "Sobre la secretaría técnica del comité, el proyecto de resolución debe asignarla", "f": "Decreto 1083 de 2015, art. 2.2.22.3.8, parágrafo 1", "o": [["A", "al secretario general, por ser el servidor de más alto nivel después del alcalde.", "El nivel jerárquico es relevante para presidir el comité en el orden territorial, no para la secretaría técnica, que el Decreto 1083 de 2015 asigna al jefe de planeación.", false], ["B", "al jefe de la oficina de planeación o a quien haga sus veces.", "El parágrafo 1 del artículo 2.2.22.3.8 del Decreto 1083 de 2015 dispone que la secretaría técnica del Comité Institucional de Gestión y Desempeño la ejerce el jefe de planeación de la entidad, o quien haga sus veces.", true], ["C", "al jefe de la Oficina de Control Interno, porque es quien evalúa la gestión de la alcaldía.", "La oficina de control interno hace la evaluación independiente del sistema; asignarle la secretaría técnica del comité que orienta la implementación del modelo comprometería esa independencia y, además, la norma la asigna expresamente a planeación.", false]]}, {"id": "GP-103", "niv": 3, "e": "En cuanto a los cuatro comités internos que tratan temas del modelo, lo procedente es", "f": "Decreto 1083 de 2015, art. 2.2.22.3.8 (sustituido por el Decreto 1499 de 2017)", "o": [["A", "mantenerlos y ordenar que cada uno reporte sus decisiones al Comité Institucional de Gestión y Desempeño.", "Mantenerlos duplicaría instancias: la norma dispone que el comité institucional sustituye a los demás comités relacionados con el modelo que no sean obligatorios por mandato legal, como ocurre con estos cuatro.", false], ["B", "fusionarlos con el Comité Institucional de Coordinación de Control Interno, que es la instancia que articula el modelo.", "El comité de coordinación de control interno es la instancia del sistema de control interno (línea estratégica), no la que orienta la implementación del MIPG; esa función, y la sustitución de comités no obligatorios, corresponde al comité institucional de gestión y desempeño.", false], ["C", "que el nuevo comité los sustituya, pues no son obligatorios por ley.", "El artículo 2.2.22.3.8 del Decreto 1083 de 2015 establece que el Comité Institucional de Gestión y Desempeño reemplaza los demás comités relacionados con el modelo que no sean obligatorios por mandato legal; los cuatro comités fueron creados por resoluciones internas.", true]]}]}, {"comp": "gestion_publica", "rol": "tecnico", "tag": "Gestión pública, MIPG, contratación y documentos · Nivel técnico · MIPG: FURAG y medición del desempeño", "texto": "Usted es técnico administrativo de la Secretaría de Planeación de una gobernación del Caribe. Función Pública abrió el periodo de reporte para medir la gestión y el desempeño institucional, y su jefe le encarga coordinar la consolidación de la información que deben aportar las dependencias. Un compañero sostiene que el reporte «es un formulario cualquiera que puede llenar la Oficina de Control Interno por su cuenta»; otro afirma que, antes de reportar, conviene usar la herramienta de autodiagnóstico que pone a disposición Función Pública. Además, el jefe de control interno le pregunta qué parte de la medición del Modelo Estándar de Control Interno (MECI) le corresponde a él y cuál al gobernador.", "items": [{"id": "GP-104", "niv": 1, "e": "La herramienta mediante la cual la gobernación entrega la información para la medición de su gestión y desempeño institucional es", "f": "Decreto 1083 de 2015, art. 2.2.22.3.10", "o": [["A", "el Formulario Único de Reporte y Avance de Gestión (FURAG).", "El artículo 2.2.22.3.10 del Decreto 1083 de 2015 dispone que la información necesaria para medir la gestión y el desempeño institucional se recoge a través del FURAG, con la metodología y periodicidad que defina Función Pública.", true], ["B", "el Formulario Único Territorial (FUT).", "El FUT es un instrumento de reporte de información fiscal y financiera de las entidades territoriales; no es el medio previsto para medir la gestión y el desempeño institucional en el marco de MIPG.", false], ["C", "el Sistema de Información y Gestión del Empleo Público (SIGEP).", "El SIGEP registra información de servidores, hojas de vida y plantas de personal; no es el formulario de medición del desempeño institucional que prevé el Decreto 1083 de 2015.", false]]}, {"id": "GP-105", "niv": 2, "e": "Respecto del autodiagnóstico que sugiere el compañero, es acertado afirmar que", "f": "Decreto 1083 de 2015, art. 2.2.22.3.10", "o": [["A", "es un instrumento de Función Pública para valorar internamente el avance del modelo y definir acciones de mejora.", "El artículo 2.2.22.3.10 del Decreto 1083 de 2015 prevé que Función Pública ponga a disposición de las entidades un instrumento de autodiagnóstico para valorar el estado de la operación del MIPG y emprender acciones de mejora.", true], ["B", "es un reporte que reemplaza al FURAG en las entidades territoriales.", "El autodiagnóstico es una herramienta de valoración interna; no sustituye la medición mediante el FURAG, que también aplica a las entidades territoriales.", false], ["C", "es la evaluación independiente que la Oficina de Control Interno debe practicar antes de firmar el reporte de medición.", "La evaluación independiente es propia de la oficina de control interno y tiene otros instrumentos (auditorías, informes semestrales); el autodiagnóstico es un instrumento de autoevaluación de la entidad, no un requisito de firma del reporte.", false]]}, {"id": "GP-106", "niv": 3, "e": "Frente a la pregunta del jefe de control interno sobre la medición del MECI, usted le responde que", "f": "Decreto 1083 de 2015, art. 2.2.23.3 (sustituido por el art. 2 del Decreto 1499 de 2017)", "o": [["A", "la medición del MECI la hace directamente Función Pública, sin intervención de la gobernación.", "Función Pública fija la metodología y recoge la información por medio del FURAG, pero la medición la hacen los responsables de cada entidad, según el artículo 2.2.23.3 del Decreto 1083 de 2015.", false], ["B", "a él le corresponde medir tanto el avance como la efectividad del MECI, por ser la tercera línea.", "La norma reparte la medición: el avance lo miden los representantes legales y la efectividad los jefes de control interno; no concentra ambas mediciones en la oficina de control interno.", false], ["C", "al gobernador le corresponde medir el avance del MECI y a él, su efectividad.", "El artículo 2.2.23.3 del Decreto 1083 de 2015 dispone que los representantes legales miden el estado de avance del MECI y que los jefes de control interno, o quienes hagan sus veces, miden su efectividad; la información se recoge por medio del FURAG.", true]]}]}, {"comp": "gestion_publica", "rol": "profesional", "tag": "Gestión pública, MIPG, contratación y documentos · Nivel profesional · MIPG: ámbito de aplicación y políticas", "texto": "Usted es profesional especializado de la Oficina Asesora de Planeación de un instituto distrital de Bogotá. Prepara una presentación para la junta directiva sobre el Modelo Integrado de Planeación y Gestión (MIPG). Debe explicar qué entidades lo adoptan, incluida una sociedad de economía mixta del sector en la que el Distrito y sus entidades tienen el 92 % del capital social, y cómo se organizan las políticas de gestión y desempeño. En la sesión, un directivo afirma que el modelo «es para entidades nacionales» y que la gestión documental «no hace parte de MIPG, porque la regula el Archivo General de la Nación».", "items": [{"id": "GP-107", "niv": 1, "e": "Frente a la afirmación de que el modelo es para entidades nacionales, usted explica que el MIPG", "f": "Decreto 1083 de 2015, arts. 2.2.22.3.4 y 2.2.22.3.7", "o": [["A", "es obligatorio solo para ministerios y departamentos administrativos, y voluntario para las entidades distritales.", "El ámbito de aplicación no se limita al sector central nacional; incluye a las entidades territoriales de la Rama Ejecutiva. La adopción voluntaria se prevé para otras ramas y órganos autónomos, no para un instituto distrital.", false], ["B", "lo adoptan los organismos y entidades de la Rama Ejecutiva de los órdenes nacional y territorial.", "El artículo 2.2.22.3.4 del Decreto 1083 de 2015 señala que el modelo se adopta por los organismos y entidades de la Rama Ejecutiva tanto del orden nacional como del territorial, lo que incluye a un instituto distrital.", true], ["C", "aplica en lo territorial solo a gobernaciones y alcaldías, no a sus entidades descentralizadas.", "El decreto no excluye a las entidades descentralizadas territoriales; por el contrario, los comités territoriales de gestión y desempeño incluyen a sus gerentes o directores.", false]]}, {"id": "GP-108", "niv": 2, "e": "Respecto de la sociedad de economía mixta en la que el Distrito tiene el 92 % del capital, usted indica que", "f": "Decreto 1083 de 2015, art. 2.2.22.3.4", "o": [["A", "le aplica solo la política de control interno, porque el modelo completo exige capital totalmente público.", "La regla de aplicar solo la política de control interno se refiere a ramas, órganos autónomos y entidades de régimen especial; para las mixtas el criterio es el porcentaje de capital estatal.", false], ["B", "no le aplica el modelo, porque cualquier participación de capital privado la excluye.", "La norma no excluye a toda entidad con capital privado: fija un umbral de participación estatal a partir del cual el modelo sí aplica.", false], ["C", "le aplica el modelo, porque el Estado posee el 90 % o más de su capital social.", "El artículo 2.2.22.3.4 del Decreto 1083 de 2015 dispone que, en las entidades descentralizadas con capital público y privado, el modelo aplica cuando el Estado tiene el 90 % o más del capital social; aquí la participación es del 92 %.", true]]}, {"id": "GP-109", "niv": 2, "e": "En cuanto a la afirmación sobre la gestión documental, lo correcto es señalar que", "f": "Decreto 1083 de 2015, art. 2.2.22.2.1 y parágrafo", "o": [["A", "es una de las políticas de gestión y desempeño del modelo, que se rige por sus propias normas.", "El artículo 2.2.22.2.1 del Decreto 1083 de 2015 incluye la gestión documental entre las políticas de gestión y desempeño institucional y su parágrafo precisa que cada política se rige por las normas que la regulan, en este caso las de archivos.", true], ["B", "no hace parte del modelo, pues las políticas de MIPG se limitan a las que lidera Función Pública.", "Las políticas de gestión y desempeño son formuladas por Función Pública y por los demás líderes de política; el Archivo General de la Nación, por ejemplo, integra el Consejo para la Gestión y el Desempeño Institucional.", false], ["C", "se integra al modelo únicamente si el instituto decide certificarse bajo una norma técnica de calidad.", "La certificación de calidad es voluntaria según el artículo 2.2.22.3.12 del Decreto 1083 de 2015 y no condiciona que la gestión documental sea una política del modelo.", false]]}]}, {"comp": "gestion_publica", "rol": "general", "tag": "Gestión pública, MIPG, contratación y documentos · Control interno: responsables (Ley 87 de 1993)", "texto": "Usted trabaja en la Secretaría de Hacienda de un municipio de quinta categoría. En una auditoría, la Oficina de Control Interno encontró que en la dependencia no se verificaban los soportes de los pagos antes de girarlos. En la reunión de cierre, el secretario de Hacienda sostiene que el control interno «es asunto exclusivo de la Oficina de Control Interno» y que su dependencia solo debe atender lo que esa oficina le pida. Para corregir la falla, propone además que la jefe de control interno firme como visto bueno cada orden de pago antes del giro.", "items": [{"id": "GP-110", "niv": 1, "e": "Según la Ley 87 de 1993, el establecimiento y desarrollo del sistema de control interno del municipio es responsabilidad", "f": "Ley 87 de 1993, arts. 3 y 6", "o": [["A", "de la jefe de la Oficina de Control Interno, por ser la encargada de evaluarlo.", "La oficina de control interno evalúa el sistema de forma independiente y recomienda mejoras (art. 3, lit. d), pero no es la responsable de establecerlo.", false], ["B", "del representante legal o máximo directivo, en este caso el alcalde.", "El artículo 6 de la Ley 87 de 1993 atribuye al representante legal o máximo directivo la responsabilidad de establecer y desarrollar el sistema de control interno; en el municipio, ese papel lo cumple el alcalde.", true], ["C", "del concejo municipal, como órgano de control político de la administración.", "El control político del concejo es distinto del control interno; la Ley 87 de 1993 no asigna al concejo el establecimiento del sistema de control interno de la alcaldía.", false]]}, {"id": "GP-111", "niv": 2, "e": "Frente a la afirmación del secretario de Hacienda, usted le recuerda que", "f": "Ley 87 de 1993, arts. 1, 3 (lit. c) y 6", "o": [["A", "la responsabilidad de los controles de su área recae en el Comité de Coordinación de Control Interno.", "El comité coordina el sistema al más alto nivel, pero no traslada a esa instancia la responsabilidad por los controles de cada dependencia, que la ley asigna a su jefe.", false], ["B", "tiene razón, porque los jefes de dependencia solo deben cumplir los planes de mejoramiento que fije la oficina.", "La ley concibe el control interno como intrínseco a las funciones de todos los cargos, en especial de quienes tienen mando; el jefe de dependencia no es un simple destinatario de los planes de la oficina.", false], ["C", "como jefe de dependencia, él también responde por la aplicación y la calidad de los controles de su área.", "El artículo 6 de la Ley 87 de 1993 extiende a los jefes de cada dependencia la responsabilidad por la aplicación de los métodos y procedimientos, y por la calidad y eficacia del control interno; el artículo 3, literal c, los hace responsables ante su jefe inmediato.", true]]}, {"id": "GP-112", "niv": 3, "e": "La propuesta de que la jefe de control interno dé visto bueno a cada orden de pago", "f": "Ley 87 de 1993, art. 12 y parágrafo", "o": [["A", "no procede, porque firmar cada pago comprometería la independencia que la ley exige a quien audita.", "El parágrafo del artículo 12 de la Ley 87 de 1993 prohíbe al jefe de control interno intervenir en los procedimientos administrativos con autorizaciones o refrendaciones; dar visto bueno a cada orden de pago sería una refrendación y le restaría independencia para evaluar ese mismo proceso.", true], ["B", "procede si el alcalde la delega por escrito y la jefe de control interno la acepta.", "La prohibición del parágrafo del artículo 12 de la Ley 87 de 1993 opera «en ningún caso», de modo que no se supera con una delegación ni con la aceptación de la jefe de control interno.", false], ["C", "procede, porque verificar los controles de los procesos financieros es una de sus funciones legales.", "Verificar los controles es una función de evaluación posterior e independiente; refrendar cada pago la convertiría en parte del procedimiento que luego debe evaluar, lo que la ley prohíbe.", false]]}]}, {"comp": "gestion_publica", "rol": "profesional", "tag": "Gestión pública, MIPG, contratación y documentos · Nivel profesional · Control interno: jefe de la oficina e informes", "texto": "Usted es profesional universitario de la Secretaría General de una gobernación. El gobernador inició su período el 1 de enero de 2028 y pregunta si puede designar de inmediato un nuevo jefe de la Oficina de Control Interno, pues quien ocupa el cargo fue designado por su antecesor a mitad del período anterior. Por otra parte, un diputado se queja de que en la página web de la gobernación solo aparece un informe de control interno por año y pide saber con qué frecuencia debe publicarse y qué valor tienen esos informes en las investigaciones que adelanten otras autoridades.", "items": [{"id": "GP-113", "niv": 3, "e": "Sobre la designación del jefe de control interno, usted le explica al gobernador que", "f": "Ley 87 de 1993, art. 11 (modificado por el art. 8 de la Ley 1474 de 2011)", "o": [["A", "la designación corresponde a la asamblea departamental, de terna enviada por el gobernador.", "La ley asigna la designación a la máxima autoridad administrativa de la entidad territorial, no a la corporación de elección popular.", false], ["B", "en el orden territorial lo designa la máxima autoridad administrativa por un período fijo de cuatro años, que inicia a mitad del período del gobernador.", "El artículo 11 de la Ley 87 de 1993, modificado por el artículo 8 de la Ley 1474 de 2011, dispone que en las entidades territoriales el jefe de control interno se designa por un período fijo de cuatro años, en la mitad del período del alcalde o gobernador; por eso el actual jefe no puede reemplazarse libremente al inicio del mandato.", true], ["C", "es un empleo de libre nombramiento y remoción en todos los órdenes, de modo que puede reemplazarlo desde el comienzo de su mandato con un nuevo acto de designación.", "La libre designación y remoción por el Presidente aplica a la rama ejecutiva del orden nacional; en lo territorial la ley fija un período de cuatro años desfasado del período del gobernador.", false]]}, {"id": "GP-114", "niv": 2, "e": "Frente a la queja del diputado, el informe de evaluación independiente del estado del sistema de control interno debe publicarse en la web de la gobernación", "f": "Ley 87 de 1993, art. 14 (art. 9 de la Ley 1474 de 2011, modificado por el art. 156 del Decreto Ley 2106 de 2019)", "o": [["A", "cada tres meses.", "La norma vigente no exige una publicación trimestral: el Decreto Ley 2106 de 2019 fijó para este informe una periodicidad semestral.", false], ["B", "cada seis meses.", "El artículo 14 de la Ley 87 de 1993 (que recoge el artículo 9 de la Ley 1474 de 2011), modificado por el artículo 156 del Decreto Ley 2106 de 2019, obliga al jefe de control interno a publicar cada seis meses en el sitio web un informe de evaluación independiente del estado del sistema de control interno, so pena de falta disciplinaria grave. La periodicidad cuatrimestral del antiguo «informe pormenorizado» ya no está vigente.", true], ["C", "una vez al año, con el informe de gestión.", "Publicar un solo informe anual, como ocurre en el caso, incumple la periodicidad semestral fijada por la norma.", false]]}, {"id": "GP-115", "niv": 3, "e": "Sobre el valor de los informes de los funcionarios de control interno, es correcto afirmar que", "f": "Ley 87 de 1993, art. 14 (texto modificado por el art. 156 del Decreto Ley 2106 de 2019)", "o": [["A", "tienen valor probatorio en procesos disciplinarios, administrativos, judiciales y fiscales cuando las autoridades pertinentes lo soliciten.", "El texto vigente del artículo 14 de la Ley 87 de 1993 (modificado por el Decreto Ley 2106 de 2019) reconoce a esos informes valor probatorio en procesos disciplinarios, administrativos, judiciales y fiscales cuando las autoridades lo pidan.", true], ["B", "solo tienen valor probatorio en procesos fiscales, porque la competencia disciplinaria pertenece a la oficina de control disciplinario interno.", "La norma no limita el valor probatorio a los procesos fiscales; lo extiende también a los disciplinarios, administrativos y judiciales.", false], ["C", "son documentos internos y reservados que solo pueden entregarse al gobernador.", "La misma norma ordena publicar el informe semestral en la web y reconoce valor probatorio a los informes; no son documentos reservados por naturaleza.", false]]}]}, {"comp": "gestion_publica", "rol": "profesional", "tag": "Gestión pública, MIPG, contratación y documentos · Nivel profesional · Control interno: esquema de líneas de defensa", "texto": "Usted es profesional de la Oficina de Planeación de una corporación autónoma regional del Eje Cafetero, que actualiza su política de administración del riesgo. En el proceso de trámites ambientales (permisos de vertimientos y concesiones de agua), el subdirector y su equipo revisan cada expediente con una lista de chequeo para evitar que se otorgue un permiso sin concepto técnico. Su oficina consolida cada trimestre el mapa de riesgos de todos los procesos y verifica si los controles están bien diseñados. La Oficina de Control Interno adelanta auditorías según su plan anual. En comité, el director general propone que, «para ganar tiempo», sea la Oficina de Control Interno la que diseñe los controles del proceso de trámites ambientales y luego los audite.", "items": [{"id": "GP-116", "niv": 1, "e": "En el esquema de líneas del MIPG, el control que aplican el subdirector y su equipo con la lista de chequeo corresponde a la", "f": "Decreto 1083 de 2015, art. 2.2.23.1; Manual Operativo del MIPG (Función Pública), esquema de líneas", "o": [["A", "segunda línea, porque el subdirector es un directivo de la corporación.", "La línea no depende del nivel del cargo sino del rol: quien ejecuta controles en su propio proceso actúa como primera línea; la segunda hace monitoreo transversal.", false], ["B", "línea estratégica, porque los permisos ambientales son la misión de la entidad.", "La línea estratégica la conforman la alta dirección y el Comité Institucional de Coordinación de Control Interno, que fijan lineamientos; no ejecutan los controles de cada expediente.", false], ["C", "primera línea, que gestiona los riesgos y ejecuta los controles en la operación diaria.", "Según el Manual Operativo del MIPG, la primera línea la integran los responsables de procesos y sus equipos, que identifican los riesgos y aplican los controles en el día a día, como la lista de chequeo del caso.", true]]}, {"id": "GP-117", "niv": 2, "e": "La labor de su oficina al consolidar el mapa de riesgos y verificar el diseño de los controles de todos los procesos corresponde a la", "f": "Manual Operativo del MIPG (Función Pública), dimensión de control interno, esquema de líneas", "o": [["A", "tercera línea, porque implica evaluar controles de otras dependencias.", "La tercera línea es exclusiva de la oficina de control interno, que da aseguramiento independiente; el monitoreo que hace planeación no tiene ese carácter independiente.", false], ["B", "segunda línea, que hace monitoreo transversal y verifica que los controles de la primera operen adecuadamente.", "El Manual Operativo del MIPG ubica en la segunda línea a quienes cumplen funciones transversales de monitoreo, como planeación y gestión del riesgo, para verificar que los controles de la primera línea estén bien diseñados y funcionen.", true], ["C", "primera línea, porque la oficina de planeación también lidera su propio proceso.", "Planeación es primera línea respecto de su propio proceso, pero la labor descrita (consolidar riesgos y verificar controles de todos los procesos) es de monitoreo transversal, propia de la segunda línea.", false]]}, {"id": "GP-118", "niv": 3, "e": "Frente a la propuesta del director general, usted debe advertir que", "f": "Manual Operativo del MIPG (Función Pública), esquema de líneas; Ley 87 de 1993, art. 12, parágrafo", "o": [["A", "es viable si el Comité Institucional de Coordinación de Control Interno la aprueba como decisión de la línea estratégica.", "La aprobación del comité no elimina el conflicto: la línea estratégica define lineamientos, pero no puede asignar a la oficina de control interno funciones que comprometen su independencia.", false], ["B", "es viable, porque a la tercera línea le corresponde diseñar los controles que después evalúa.", "Diseñar e implementar controles es responsabilidad de la primera línea con el acompañamiento de la segunda; si la oficina de control interno los diseñara, perdería la independencia para auditarlos.", false], ["C", "la tercera línea da aseguramiento independiente y no debe asumir responsabilidades de la primera o la segunda.", "El Manual Operativo del MIPG precisa que la oficina de control interno da aseguramiento independiente sin asumir responsabilidades propias de las otras líneas, en armonía con el parágrafo del artículo 12 de la Ley 87 de 1993, que le impide participar en los procedimientos de la entidad.", true]]}]}, {"comp": "gestion_publica", "rol": "tecnico", "tag": "Gestión pública, MIPG, contratación y documentos · Nivel técnico · Control interno: objetivos y funciones", "texto": "Usted es técnico administrativo de la Secretaría de Hacienda de un municipio del Huila y apoya la inducción de los nuevos servidores. Durante la charla sobre el sistema de control interno, un auxiliar pregunta para qué sirve el control interno si «ya existe la contraloría»; otro pregunta qué hace concretamente la Oficina de Control Interno y si existe alguna instancia de alto nivel que coordine el sistema dentro de la alcaldía.", "items": [{"id": "GP-119", "niv": 1, "e": "Para responder al primer auxiliar, usted explica que uno de los objetivos del sistema de control interno es", "f": "Ley 87 de 1993, art. 2, lit. a", "o": [["A", "proteger los recursos de la organización y procurar su adecuada administración frente a los riesgos.", "El artículo 2, literal a, de la Ley 87 de 1993 señala como objetivo del sistema proteger los recursos de la organización, buscando su adecuada administración ante posibles riesgos.", true], ["B", "adelantar los procesos disciplinarios contra los servidores que incumplan los procedimientos.", "La potestad disciplinaria la ejerce la oficina de control disciplinario interno o la autoridad competente; no es un objetivo del sistema de control interno de la Ley 87 de 1993.", false], ["C", "vigilar la gestión fiscal de la alcaldía en reemplazo de la contraloría territorial.", "El control fiscal es externo y corresponde a las contralorías; el control interno no lo reemplaza, sino que opera dentro de la entidad.", false]]}, {"id": "GP-120", "niv": 2, "e": "Sobre lo que hace la Oficina de Control Interno, usted indica que una de sus funciones es", "f": "Ley 87 de 1993, art. 12, lit. c", "o": [["A", "verificar que los responsables de los procesos cumplan los controles definidos.", "El artículo 12, literal c, de la Ley 87 de 1993 asigna al jefe de control interno verificar que los controles definidos para los procesos se cumplan por los responsables de su ejecución.", true], ["B", "ejecutar directamente los controles de los procesos misionales de la alcaldía.", "La ejecución de los controles corresponde a los responsables de cada proceso; la oficina de control interno verifica su cumplimiento de manera independiente.", false], ["C", "aprobar los procedimientos de cada área antes de que el alcalde los adopte.", "Aprobar procedimientos sería intervenir en la gestión que luego evalúa; la ley le asigna verificar y recomendar, no aprobar procedimientos.", false]]}, {"id": "GP-121", "niv": 1, "e": "Frente a la instancia que coordina el sistema, usted señala que la Ley 87 de 1993 ordena establecer al más alto nivel jerárquico", "f": "Ley 87 de 1993, art. 13", "o": [["A", "una junta de vigilancia integrada por usuarios y veedores ciudadanos.", "Las veedurías ejercen control social externo; la Ley 87 de 1993 no crea una junta de este tipo como instancia del sistema de control interno.", false], ["B", "un comité de coordinación del sistema de control interno.", "El artículo 13 de la Ley 87 de 1993 ordena a las entidades establecer, al más alto nivel jerárquico, un comité de coordinación del sistema de control interno.", true], ["C", "una comisión de personal encargada del control interno.", "La comisión de personal es una instancia del sistema de carrera administrativa, con funciones distintas; no es la instancia de coordinación del control interno.", false]]}]}, {"comp": "gestion_publica", "rol": "general", "tag": "Gestión pública, MIPG, contratación y documentos · Control interno: definición y recomendaciones", "texto": "Usted trabaja en la Secretaría de Educación de un departamento. La Oficina de Control Interno entregó al secretario de despacho el informe de una auditoría al proceso de nómina con tres hallazgos y sus recomendaciones. En la reunión de análisis, el secretario pregunta si el control interno es una tarea aparte de las funciones de cada cargo, qué papel cumple la Oficina de Control Interno frente a las recomendaciones que formuló y qué principios debe consultar el ejercicio del control interno.", "items": [{"id": "GP-122", "niv": 2, "e": "Sobre la relación entre el control interno y las funciones de cada cargo, la Ley 87 de 1993 dispone que el control interno", "f": "Ley 87 de 1993, art. 1", "o": [["A", "es propio de los cargos del nivel directivo; los demás niveles se limitan a atender las auditorías.", "Aunque la ley destaca a quienes tienen mando, el control interno debe estar presente en todos los cargos existentes, no solo en el nivel directivo.", false], ["B", "es una función adicional que solo se asigna a los servidores designados como enlaces de control interno en cada dependencia.", "La ley no reduce el control interno a unos enlaces designados; lo concibe como parte de todos los cargos de la entidad.", false], ["C", "debe ser parte del ejercicio de las funciones de todos los cargos, en especial de quienes tienen mando.", "El artículo 1 de la Ley 87 de 1993 dispone que el control interno debe concebirse y organizarse de modo que su ejercicio sea intrínseco a las funciones de todos los cargos, y en particular de los que tienen responsabilidad de mando.", true]]}, {"id": "GP-123", "niv": 2, "e": "Respecto de las recomendaciones de la auditoría, es correcto afirmar que la Oficina de Control Interno", "f": "Ley 87 de 1993, arts. 3 (lit. d) y 12 (lit. k)", "o": [["A", "solo puede dirigir sus recomendaciones a la asamblea departamental, y no a los jefes de dependencia.", "Las recomendaciones se dirigen a la administración (representante legal y directivos); la asamblea ejerce control político, no es destinataria natural de las auditorías internas.", false], ["B", "impone las medidas correctivas mediante acto administrativo de obligatorio cumplimiento.", "La oficina de control interno no tiene facultades para imponer medidas mediante actos administrativos; su papel es evaluar, recomendar y hacer seguimiento.", false], ["C", "propone mejoras al sistema y verifica que se implanten las medidas recomendadas.", "La Ley 87 de 1993 asigna a la unidad de control interno proponer recomendaciones para mejorar el sistema (art. 3, lit. d) y verificar que se implanten las medidas recomendadas (art. 12, lit. k).", true]]}, {"id": "GP-124", "niv": 1, "e": "Entre los principios que debe consultar el ejercicio del control interno, según la Ley 87 de 1993, se encuentra el de", "f": "Ley 87 de 1993, art. 1", "o": [["A", "doble instancia, para revisar los hallazgos de auditoría.", "La doble instancia es una garantía procesal; la Ley 87 de 1993 no la incluye entre los principios que orientan el control interno.", false], ["B", "valoración de costos ambientales, junto con los de eficiencia y economía.", "El artículo 1 de la Ley 87 de 1993 enumera los principios de igualdad, moralidad, eficiencia, economía, celeridad, imparcialidad, publicidad y valoración de costos ambientales.", true], ["C", "favorabilidad, propio de los procesos sancionatorios.", "La favorabilidad es una garantía del derecho sancionatorio y disciplinario; no figura entre los principios del control interno de la Ley 87 de 1993.", false]]}]}, {"comp": "gestion_publica", "rol": "profesional", "tag": "Gestión pública, MIPG, contratación y documentos · Nivel profesional · Plan de desarrollo territorial: elaboración", "texto": "Usted es profesional universitario de la Secretaría de Planeación de un municipio de sexta categoría de Boyacá. El alcalde se posesionó el 1 de enero de 2028 y le encargó coordinar el proyecto de plan de desarrollo 2028-2031. El cronograma que heredó del equipo de empalme propone presentar el documento consolidado al Consejo Territorial de Planeación (CTP) el 30 de abril, enviar copia al concejo municipal solo cuando el CTP entregue su concepto y radicar el proyecto de acuerdo en el concejo en mayo. El presidente del CTP ya anunció que su consejo se tomará «todo el tiempo que sea necesario» para estudiar el documento.", "items": [{"id": "GP-125", "niv": 2, "e": "Frente al cronograma, usted advierte que el documento consolidado debe presentarse al CTP", "f": "Ley 152 de 1994, arts. 39 (num. 5) y 40", "o": [["A", "a más tardar dentro de los dos meses siguientes a la posesión del alcalde.", "El numeral 5 del artículo 39 de la Ley 152 de 1994 ordena presentar el proyecto consolidado a los consejos territoriales de planeación a más tardar dentro de los dos meses siguientes a la posesión; el 30 de abril excede ese plazo.", true], ["B", "a más tardar dentro de los cuatro meses siguientes a la posesión del alcalde.", "Los cuatro primeros meses del período son el plazo para someter el plan a la corporación de elección popular (art. 40), no para presentarlo al consejo territorial de planeación.", false], ["C", "en cualquier fecha, siempre que el proyecto llegue al concejo antes del 30 de junio.", "La Ley 152 de 1994 fija plazos concretos para cada etapa; no deja a discreción la presentación al consejo territorial de planeación.", false]]}, {"id": "GP-126", "niv": 2, "e": "En cuanto a la copia del proyecto para el concejo municipal, lo procedente es enviarla", "f": "Ley 152 de 1994, art. 39, num. 5", "o": [["A", "cuando el CTP entregue su concepto, como propone el cronograma.", "Esperar el concepto del consejo territorial desconoce que la ley exige enviar la copia a la corporación en la misma oportunidad en que se presenta el documento a dicho consejo.", false], ["B", "solo con la radicación formal del proyecto de acuerdo en el concejo.", "La radicación del proyecto de acuerdo es una etapa posterior (art. 40); la ley exige que el concejo reciba copia desde que el documento consolidado se presenta al consejo territorial.", false], ["C", "en la misma oportunidad en que el documento se presenta al CTP.", "El inciso segundo del numeral 5 del artículo 39 de la Ley 152 de 1994 dispone que, al presentar el proyecto al consejo territorial de planeación, la máxima autoridad administrativa envíe en la misma oportunidad copia a la corporación de elección popular.", true]]}, {"id": "GP-127", "niv": 3, "e": "Si el CTP no se pronuncia dentro del mes siguiente a la presentación del documento consolidado, la consecuencia es que", "f": "Ley 152 de 1994, art. 39, num. 6", "o": [["A", "el concejo debe integrar un nuevo consejo territorial para que emita el concepto.", "La Ley 152 de 1994 no prevé la integración de un nuevo consejo por falta de pronunciamiento; la consecuencia es que el requisito se entiende surtido.", false], ["B", "se considera surtido el requisito de su concepto y el trámite continúa.", "El numeral 6 del artículo 39 de la Ley 152 de 1994 da al consejo territorial un mes desde la presentación del documento; si en ese lapso no se reúne o no se pronuncia, se considera surtido el requisito en esa fecha.", true], ["C", "el alcalde debe esperar el concepto, porque sin él el concejo no puede aprobar el plan.", "La ley no permite que el silencio del consejo territorial bloquee el trámite: vencido el mes, el requisito se tiene por cumplido.", false]]}]}, {"comp": "gestion_publica", "rol": "tecnico", "tag": "Gestión pública, MIPG, contratación y documentos · Nivel técnico · Plan de desarrollo territorial: contenido y aprobación", "texto": "Usted es técnico de la Secretaría de Planeación de un departamento de la Orinoquía. El gobernador radicó el proyecto de plan de desarrollo en la asamblea el 20 de abril, dentro de los primeros cuatro meses de su período. Durante el debate, una diputada propone incluir un programa de vías terciarias que no estaba en el proyecto, sin que el gobernador se haya pronunciado. Otro diputado pide saber qué partes debe contener el plan y qué ocurre si la asamblea no decide a tiempo.", "items": [{"id": "GP-128", "niv": 1, "e": "Sobre el contenido, usted explica que los planes de desarrollo de las entidades territoriales están conformados por", "f": "Ley 152 de 1994, art. 31", "o": [["A", "una parte estratégica y un plan de inversiones de mediano y corto plazo.", "El artículo 31 de la Ley 152 de 1994 dispone que los planes de desarrollo territoriales se conforman por una parte estratégica y un plan de inversiones a mediano y corto plazo.", true], ["B", "una parte estratégica y el plan anual de adquisiciones de la gobernación.", "El plan anual de adquisiciones es un instrumento de la gestión contractual de cada entidad; no es componente del plan de desarrollo.", false], ["C", "un diagnóstico, el plan de ordenamiento territorial y el presupuesto anual.", "El plan de ordenamiento territorial es un instrumento distinto, regido por normas especiales (art. 41, inciso final), y el presupuesto anual se armoniza con el plan, pero no lo integra.", false]]}, {"id": "GP-129", "niv": 2, "e": "Frente a la propuesta de la diputada, la modificación", "f": "Ley 152 de 1994, art. 40", "o": [["A", "requiere la aceptación previa y por escrito del gobernador.", "El artículo 40 de la Ley 152 de 1994 dispone que toda modificación que pretenda introducir la asamblea o el concejo debe contar con la aceptación previa y por escrito del gobernador o alcalde.", true], ["B", "puede aprobarse por mayoría de la asamblea sin intervención del gobernador.", "La ley exige la aceptación previa y escrita del mandatario para cualquier modificación que pretenda introducir la corporación, de modo que la sola mayoría no basta.", false], ["C", "exige un concepto previo favorable del Departamento Nacional de Planeación.", "El artículo 40 de la Ley 152 de 1994 no somete las modificaciones de la asamblea a concepto del DNP; el requisito es la aceptación del gobernador.", false]]}, {"id": "GP-130", "niv": 2, "e": "Si la asamblea no decide sobre el plan dentro del mes siguiente a su presentación,", "f": "Ley 152 de 1994, art. 40", "o": [["A", "sigue rigiendo el plan del período anterior hasta que la asamblea lo apruebe.", "La ley no prorroga el plan anterior; resuelve la falta de decisión facultando al mandatario para adoptar el nuevo plan por decreto.", false], ["B", "el gobernador podrá adoptarlo mediante decreto.", "El artículo 40 de la Ley 152 de 1994 establece que, si transcurre el mes siguiente a la presentación sin que la asamblea o el concejo decidan, el gobernador o alcalde podrá adoptar el plan mediante decreto.", true], ["C", "el proyecto se entiende negado y el gobernador debe presentar uno nuevo.", "La ley no atribuye al silencio de la asamblea el efecto de negar el plan; prevé, por el contrario, que el mandatario pueda adoptarlo.", false]]}]}, {"comp": "gestion_publica", "rol": "profesional", "tag": "Gestión pública, MIPG, contratación y documentos · Nivel profesional · Plan de acción, integración de planes y evaluación", "texto": "Usted es profesional especializado de la Secretaría de Planeación de un municipio de segunda categoría. El concejo aprobó el plan de desarrollo y ahora se debe orientar a las secretarías para la ejecución. La Secretaría de Salud anuncia que su plan de acción lo aprobará el propio secretario y lo publicará «cuando esté listo, a mitad de año». La Secretaría General pregunta si el Plan Institucional de Archivos (PINAR) y el Plan Anual de Adquisiciones deben manejarse por separado del plan de acción. Además, el concejo solicita información sobre cómo y por quién se rinde cuenta y se evalúa la ejecución del plan.", "items": [{"id": "GP-131", "niv": 2, "e": "Sobre el plan de acción de la Secretaría de Salud, usted le indica que", "f": "Ley 152 de 1994, art. 41", "o": [["A", "puede aprobarlo el secretario, siempre que lo remita para información al Consejo Territorial de Planeación.", "La aprobación no corresponde al secretario de despacho; además, el consejo territorial de planeación conceptúa sobre el plan de desarrollo, no sobre los planes de acción.", false], ["B", "lo aprueba el concejo municipal, porque desarrolla el plan de desarrollo que ese órgano adoptó.", "El concejo aprueba el plan de desarrollo, pero los planes de acción de las secretarías se someten a la aprobación del consejo de gobierno según el artículo 41 de la Ley 152 de 1994.", false], ["C", "debe prepararlo con la coordinación de la oficina de planeación y someterlo a aprobación del consejo de gobierno.", "El artículo 41 de la Ley 152 de 1994 dispone que, con base en el plan aprobado, cada secretaría prepara su plan de acción con la coordinación de planeación y lo somete a la aprobación del consejo de gobierno municipal.", true]]}, {"id": "GP-132", "niv": 1, "e": "En cuanto a la publicación del plan de acción institucional, la alcaldía debe publicarlo en su página web", "f": "Ley 1474 de 2011, art. 74", "o": [["A", "una sola vez, dentro del mes siguiente a la aprobación del plan de desarrollo.", "El plan de acción es anual y su publicación también lo es; no se trata de una publicación única al inicio del cuatrienio.", false], ["B", "a más tardar el 30 de junio de cada año.", "Publicarlo a mitad de año, como pretende la Secretaría de Salud, desconoce la fecha límite del 31 de enero fijada por la Ley 1474 de 2011.", false], ["C", "a más tardar el 31 de enero de cada año.", "El artículo 74 de la Ley 1474 de 2011 obliga a las entidades del Estado a publicar en su página web el plan de acción a más tardar el 31 de enero de cada año.", true]]}, {"id": "GP-133", "niv": 3, "e": "Frente a la pregunta de la Secretaría General, usted responde que el PINAR y el Plan Anual de Adquisiciones", "f": "Decreto 612 de 2018 (adiciona el Decreto 1083 de 2015); Ley 1474 de 2011, art. 74", "o": [["A", "solo se integran al plan de acción en las entidades del orden nacional.", "Las directrices de integración de planes al plan de acción se dirigen a las entidades del Estado, incluidas las territoriales; no se limitan al orden nacional.", false], ["B", "se integran al plan de acción institucional, según las directrices del Decreto 612 de 2018.", "El Decreto 612 de 2018 fija directrices para integrar al plan de acción, entre otros, el Plan Institucional de Archivos y el Plan Anual de Adquisiciones, con la fecha de publicación del artículo 74 de la Ley 1474 de 2011.", true], ["C", "se excluyen del plan de acción, porque cada uno tiene su propia norma y fecha de adopción.", "El Decreto 612 de 2018 busca precisamente unificar la fecha y adoptar estos planes como parte del plan de acción, por lo que no se manejan por separado.", false]]}, {"id": "GP-134", "niv": 1, "e": "Sobre la rendición de cuentas al concejo, la Ley 152 de 1994 dispone que", "f": "Ley 152 de 1994, art. 43", "o": [["A", "el alcalde presenta un informe anual de la ejecución de los planes.", "El artículo 43 de la Ley 152 de 1994 obliga al gobernador o alcalde a presentar a la asamblea o concejo un informe anual sobre la ejecución de los planes.", true], ["B", "el informe solo procede al final del cuatrienio, durante el empalme.", "La Ley 152 de 1994 prevé un informe anual; no lo aplaza al final del período.", false], ["C", "el informe lo rinde el Consejo Territorial de Planeación, no el alcalde.", "El consejo territorial es una instancia consultiva; la obligación de informar al concejo sobre la ejecución del plan está a cargo del mandatario.", false]]}, {"id": "GP-135", "niv": 3, "e": "La evaluación de gestión y resultados de los planes y programas de desarrollo e inversión del municipio corresponde, según la Ley 152 de 1994, a", "f": "Ley 152 de 1994, art. 42", "o": [["A", "los organismos departamentales de planeación, respecto del departamento y de los municipios de su jurisdicción.", "El artículo 42 de la Ley 152 de 1994 asigna a los organismos departamentales de planeación la evaluación de gestión y resultados de los planes del departamento y de los municipios de su jurisdicción.", true], ["B", "la Contraloría General de la República, como parte de su control fiscal.", "El control fiscal es una función distinta; la evaluación de gestión y resultados de los planes que prevé la Ley 152 de 1994 se asigna a la planeación departamental.", false], ["C", "el Consejo Territorial de Planeación del municipio, que emite el concepto final.", "El consejo territorial de planeación conceptúa sobre el proyecto de plan; la Ley 152 de 1994 no le asigna la evaluación de gestión y resultados.", false]]}]}, {"comp": "gestion_publica", "rol": "tecnico", "tag": "Gestión pública, MIPG, contratación y documentos · Nivel técnico · Presupuesto: principios presupuestales", "texto": "Usted es técnico de presupuesto de la Secretaría de Hacienda de un municipio de cuarta categoría, cuyo estatuto orgánico de presupuesto reproduce los principios del Decreto 111 de 1996. Es 29 de diciembre y llegan tres solicitudes: la Secretaría de Cultura quiere firmar el 4 de enero un contrato con cargo al saldo libre de una apropiación del año que termina; la Secretaría de Gobierno pide pagar un evento que no figura en el presupuesto «porque hay plata en caja»; y la Secretaría de Ambiente quiere usar el rubro de mantenimiento de parques para comprar un vehículo, sin que medie ninguna modificación presupuestal.", "items": [{"id": "GP-136", "niv": 1, "e": "Frente a la solicitud de la Secretaría de Cultura, usted responde que no es posible porque", "f": "Decreto 111 de 1996, arts. 12 y 14", "o": [["A", "los saldos no comprometidos deben reservarse para emergencias, por el principio de homeostasis.", "La homeostasis presupuestal se refiere a la relación entre el crecimiento del presupuesto y la economía; no destina los saldos a emergencias.", false], ["B", "pasado el 31 de diciembre no pueden asumirse compromisos con cargo a las apropiaciones del año que termina.", "El principio de anualidad (art. 14 del Decreto 111 de 1996) establece que después del 31 de diciembre no pueden asumirse compromisos con cargo a las apropiaciones del año fiscal que se cierra, y que los saldos no comprometidos caducan.", true], ["C", "los contratos firmados en enero solo pueden financiarse con recursos del crédito, por el principio de unidad de caja.", "La unidad de caja significa que con el recaudo de todas las rentas se atiende el pago de las apropiaciones; no tiene relación con financiar contratos con crédito.", false]]}, {"id": "GP-137", "niv": 2, "e": "La solicitud de la Secretaría de Gobierno contraría el principio de", "f": "Decreto 111 de 1996, art. 15", "o": [["A", "planificación, porque el gasto debe estar previsto en el plan de ordenamiento territorial.", "La planificación exige concordancia del presupuesto con el plan de desarrollo y el plan de inversiones, no con el plan de ordenamiento territorial; y el defecto del caso es que el gasto no está en el presupuesto.", false], ["B", "unidad de caja, porque el recaudo debe destinarse primero al servicio de la deuda.", "El problema no es el orden de uso del recaudo: aunque haya liquidez, ningún gasto puede ejecutarse si no figura en el presupuesto.", false], ["C", "universalidad, porque no pueden hacerse gastos que no figuren en el presupuesto.", "El artículo 15 del Decreto 111 de 1996 (universalidad) dispone que el presupuesto contiene la totalidad de los gastos de la vigencia y que ninguna autoridad puede efectuar gastos que no figuren en él.", true]]}, {"id": "GP-138", "niv": 2, "e": "La propuesta de la Secretaría de Ambiente desconoce el principio de", "f": "Decreto 111 de 1996, arts. 17 y 18", "o": [["A", "especialización, porque las apropiaciones se ejecutan conforme al fin para el que se programaron.", "El artículo 18 del Decreto 111 de 1996 (especialización) exige que las operaciones se ejecuten estrictamente conforme al fin para el cual fueron programadas; comprar un vehículo con el rubro de mantenimiento de parques lo desconoce.", true], ["B", "inembargabilidad, porque los rubros de inversión no pueden afectarse con compras nuevas.", "La inembargabilidad protege las rentas y recursos del presupuesto frente a medidas judiciales; no regula el uso de un rubro para un fin distinto.", false], ["C", "programación integral, porque todo programa debe incluir los gastos de funcionamiento que requiere.", "La programación integral exige prever simultáneamente inversión y funcionamiento al programar; el defecto del caso es usar una apropiación para un fin diferente del programado.", false]]}]}, {"comp": "gestion_publica", "rol": "tecnico", "tag": "Gestión pública, MIPG, contratación y documentos · Nivel técnico · Presupuesto: CDP y registro presupuestal", "texto": "Usted es técnico administrativo del área financiera de un instituto municipal de deportes, cuyo estatuto presupuestal sigue las reglas del Decreto 111 de 1996. La gerente quiere expedir una resolución que reconoce apoyos económicos a deportistas y, después, firmar un contrato de transporte para los juegos departamentales. El jefe jurídico sugiere «firmar primero y pedir después la disponibilidad presupuestal, porque el rubro tiene recursos de sobra». A usted le corresponde orientar el trámite presupuestal.", "items": [{"id": "GP-139", "niv": 1, "e": "Antes de expedir la resolución de apoyos, el instituto debe contar con", "f": "Decreto 111 de 1996, art. 71", "o": [["A", "el registro presupuestal del compromiso, que se expide antes del acto administrativo.", "El registro presupuestal se hace sobre un compromiso ya adquirido; lo que debe existir antes del acto es el certificado de disponibilidad.", false], ["B", "el certificado de disponibilidad presupuestal que garantice apropiación suficiente.", "El artículo 71 del Decreto 111 de 1996 exige que todo acto administrativo que afecte apropiaciones cuente con certificado de disponibilidad previo que garantice apropiación suficiente.", true], ["C", "la aprobación del Programa Anual Mensualizado de Caja por el concejo municipal.", "El PAC es un instrumento de manejo de caja que no aprueba el concejo; el requisito previo al acto es el certificado de disponibilidad presupuestal.", false]]}, {"id": "GP-140", "niv": 2, "e": "Una vez firmado el contrato de transporte, el registro presupuestal", "f": "Decreto 111 de 1996, art. 71", "o": [["A", "solo es necesario si el contrato supera la menor cuantía del instituto.", "El Decreto 111 de 1996 no condiciona el registro presupuestal a la cuantía del compromiso.", false], ["B", "es opcional cuando ya existe certificado de disponibilidad presupuestal.", "La disponibilidad y el registro cumplen funciones distintas; el artículo 71 del Decreto 111 de 1996 exige ambos, de modo que contar con el certificado no exime del registro.", false], ["C", "debe expedirse indicando el valor y el plazo de las prestaciones, para que los recursos no se desvíen a otro fin.", "El artículo 71 del Decreto 111 de 1996 exige registrar los compromisos para que los recursos no se desvíen a otro fin, y que el registro indique con claridad el valor y el plazo de las prestaciones.", true]]}, {"id": "GP-141", "niv": 3, "e": "Si se siguiera la sugerencia del jefe jurídico y se adquiriera el compromiso sin disponibilidad previa,", "f": "Decreto 111 de 1996, art. 71", "o": [["A", "la irregularidad se subsanaría expidiendo el certificado dentro de los tres días siguientes a la firma.", "La disponibilidad debe ser previa; la norma no prevé subsanación posterior dentro de un plazo, sino responsabilidad de quien asume el compromiso irregular.", false], ["B", "quien asuma la obligación incurriría en responsabilidad personal y pecuniaria.", "El artículo 71 del Decreto 111 de 1996 dispone que cualquier compromiso adquirido con violación de estos preceptos crea responsabilidad personal y pecuniaria a cargo de quien asuma la obligación.", true], ["C", "el compromiso sería válido, porque basta con que el rubro tenga saldo suficiente.", "El saldo del rubro no reemplaza el certificado: la norma exige que la disponibilidad se certifique antes de adquirir el compromiso.", false]]}]}, {"comp": "gestion_publica", "rol": "profesional", "tag": "Gestión pública, MIPG, contratación y documentos · Nivel profesional · Presupuesto: reservas presupuestales y cuentas por pagar", "texto": "Usted es profesional universitario del área de presupuesto de un instituto departamental de tránsito, cuyo estatuto presupuestal reproduce las reglas del Decreto 111 de 1996. Al 31 de diciembre de 2027 analiza tres situaciones: (1) un contrato de mantenimiento de semáforos, firmado en octubre con registro presupuestal, del que falta ejecutar la mitad de las actividades, que terminarán en marzo; (2) un contrato de suministro de uniformes, cuyos bienes se recibieron a satisfacción el 20 de diciembre y aún no se han pagado; (3) un saldo del rubro de capacitación que nunca se comprometió.", "items": [{"id": "GP-142", "niv": 3, "e": "Para el contrato de mantenimiento de semáforos, al cierre de la vigencia el instituto debe constituir", "f": "Decreto 111 de 1996, art. 89", "o": [["A", "una vigencia futura, porque la ejecución termina en el año siguiente.", "Las vigencias futuras se autorizan antes de comprometer presupuestos de años siguientes; no son la figura de cierre para un compromiso ya adquirido con cargo a la vigencia que termina.", false], ["B", "una cuenta por pagar, porque el contrato tiene registro presupuestal.", "Tener registro presupuestal no convierte el compromiso en cuenta por pagar; estas corresponden a anticipos pactados y a bienes o servicios ya recibidos, lo que no ocurre con las actividades pendientes.", false], ["C", "una reserva presupuestal, porque es un compromiso legalmente contraído que no se ha cumplido.", "El artículo 89 del Decreto 111 de 1996 ordena constituir reservas presupuestales con los compromisos legalmente contraídos que al 31 de diciembre no se hayan cumplido, como las actividades de mantenimiento pendientes.", true]]}, {"id": "GP-143", "niv": 3, "e": "Para el contrato de suministro de uniformes, lo procedente es constituir", "f": "Decreto 111 de 1996, art. 89", "o": [["A", "una cuenta por pagar, porque los bienes ya se entregaron y solo falta el pago.", "El artículo 89 del Decreto 111 de 1996 ordena constituir al 31 de diciembre cuentas por pagar con las obligaciones correspondientes a anticipos pactados y a la entrega de bienes y servicios, como los uniformes recibidos.", true], ["B", "una reserva presupuestal, porque el pago no se hizo antes del 31 de diciembre.", "La reserva se constituye con compromisos no cumplidos; aquí el contratista ya cumplió con la entrega y solo está pendiente el pago, lo que da lugar a una cuenta por pagar.", false], ["C", "un nuevo compromiso con cargo al presupuesto del año siguiente.", "Crear un nuevo compromiso para una obligación ya adquirida y cumplida no corresponde; el Decreto 111 de 1996 prevé para este caso la cuenta por pagar.", false]]}, {"id": "GP-144", "niv": 2, "e": "Respecto del saldo no comprometido del rubro de capacitación,", "f": "Decreto 111 de 1996, arts. 14 y 89", "o": [["A", "la autorización de gasto expira y no podrá comprometerse en el año siguiente.", "Los artículos 14 y 89 del Decreto 111 de 1996 disponen que las apropiaciones son autorizaciones máximas de gasto para la vigencia y que, después del 31 de diciembre, expiran y no pueden comprometerse; los saldos no afectados caducan.", true], ["B", "se traslada automáticamente al mismo rubro del presupuesto del año siguiente.", "No existe traslado automático entre vigencias; la apropiación no comprometida expira y caduca al cierre.", false], ["C", "puede comprometerse hasta el 31 de marzo siguiente como reserva de apropiación.", "So
