<style>
:root{--bg:#f6f8fb;--card:#fff;--ink:#1d2433;--mute:#5a6478;--line:#dbe1ea;--pri:#0b3d6e;--pri2:#1660a8;--ok:#0d6b3a;--okbg:#e6f4ec;--no:#9b1c1c;--nobg:#fbeaea;--sel:#e8f0fa}
@media (prefers-color-scheme: dark){:root{--bg:#10151d;--card:#18202b;--ink:#e6ebf2;--mute:#9aa6b8;--line:#2a3545;--pri:#7fb3ea;--pri2:#9cc6f2;--ok:#7fd3a3;--okbg:#16301f;--no:#f2a3a3;--nobg:#3a1c1c;--sel:#1e2d40}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px}

.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--pri)}
.timer.low{color:var(--no)}
main{max-width:860px;margin:0 auto;padding:16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin:0 0 16px}
.caso{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--pri);border-radius:10px;padding:14px 16px;margin:22px 0 10px}
.tag{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--pri);font-weight:700}

.item{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0}

.n{font-weight:700;color:var(--pri)}
.niv{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-right:4px;white-space:nowrap}
.op{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:6px 0;cursor:pointer;background:transparent;width:100%;text-align:left;color:inherit;font:inherit}
.op:hover{border-color:var(--pri2)}
.op .l{font-weight:700;min-width:20px}
.op.sel{background:var(--sel);border-color:var(--pri2)}
.op.ok{background:var(--okbg);border-color:var(--ok)}
.op.no{background:var(--nobg);border-color:var(--no)}
.op[disabled]{cursor:default}

.just div{margin:4px 0}
.just .okt{color:var(--ok);font-weight:700}
.just .not{color:var(--no);font-weight:700}
.src{font-size:13px;color:var(--mute);margin-top:6px}
button.btn{background:var(--pri);color:var(--card);border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer}
button.btn.sec{background:transparent;color:var(--pri);border:1px solid var(--pri)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
select{font:inherit;padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);max-width:100%}
table{border-collapse:collapse;width:100%;font-size:15px}
td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
.big{font-size:40px;font-weight:800;color:var(--pri);line-height:1.1}
.aviso{font-size:13px;color:var(--mute)}
.hide{display:none !important}
.res-ok{color:var(--ok);font-weight:700}.res-no{color:var(--no);font-weight:700}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal .panel{max-width:420px}
footer{max-width:860px;margin:0 auto;padding:8px 16px 40px;font-size:12px;color:var(--mute)}
</style>

<footer><a href="./" style="color:var(--pri);font-weight:600">← Volver al menú</a><br><br>Material de preparación independiente. No está afiliado a la Comisión Nacional del Servicio Civil (CNSC) ni a ninguna entidad pública, y no contiene preguntas reales de la prueba.</footer>
<script>
const DATA = [{"comp": "estado_constitucion", "rol": "general", "tag": "Estado y Constitución · Igualdad y enfoque diferencial", "texto": "Usted es auxiliar administrativo de una subdirección local de la Secretaría Distrital de Integración Social de Bogotá, encargada de inscribir personas en cursos gratuitos de alfabetización digital. Durante la jornada ocurre lo siguiente: un compañero se niega a inscribir a un ciudadano porque este llevaba una camiseta de un partido político contrario al suyo; una ciudadana con discapacidad visual pide que la guía del curso se le entregue en un formato que pueda leer con su lector de pantalla; y un contratista propone excluir de los cursos a los mayores de 60 años porque, según él, «aprenden más lento y ocupan cupos».", "items": [{"id": "EC-104", "niv": 1, "e": "Ante la negativa del compañero a inscribir al ciudadano por su afinidad política, usted debe advertirle que", "f": "Constitución Política, art. 13", "o": [["A", "debe remitir al ciudadano a otra subdirección local para evitar un conflicto de intereses.", "No existe conflicto de intereses por la afinidad política del ciudadano. Remitirlo a otra sede es un trato diferente basado en su opinión política, prohibido por el artículo 13.", false], ["B", "todas las personas deben recibir la misma protección y trato de las autoridades, sin discriminación por opinión política.", "El artículo 13 de la Constitución dispone que todas las personas recibirán la misma protección y trato de las autoridades, sin discriminación por razones, entre otras, de opinión política o filosófica.", true], ["C", "puede negarse si el ciudadano hace propaganda dentro de la sede, pues los servidores públicos deben mantener la neutralidad política.", "La neutralidad política es un deber del servidor, no un motivo para negar un servicio al ciudadano. Llevar una prenda alusiva a un partido no autoriza un trato diferente en el acceso al curso.", false]]}, {"id": "EC-105", "niv": 2, "e": "Frente a la solicitud de la ciudadana con discapacidad visual, la actuación que corresponde es", "f": "Ley 1618 de 2013, art. 1; Constitución Política, art. 13", "o": [["A", "entregarle la guía en un formato accesible, como un ajuste razonable que le permita participar en igualdad de condiciones.", "La Ley 1618 de 2013 (art. 1) tiene por objeto garantizar el ejercicio efectivo de los derechos de las personas con discapacidad mediante medidas de inclusión, acción afirmativa y ajustes razonables, eliminando toda forma de discriminación por discapacidad. Adaptar el formato es un ajuste razonable.", true], ["B", "inscribirla en un grupo separado solo para personas con discapacidad, con un horario distinto.", "Separarla del curso general no elimina la barrera (el formato de la guía) y crea una segregación no solicitada. La inclusión busca que participe junto con los demás, con los apoyos necesarios.", false], ["C", "pedirle que asista con un acompañante que le lea la guía, pues la entidad no está obligada a modificar sus formatos.", "Trasladar a la ciudadana la carga de conseguir un lector desconoce el deber de eliminar barreras. La Ley 1618 de 2013 ordena garantizar sus derechos mediante medidas de inclusión, acción afirmativa y ajustes razonables.", false]]}, {"id": "EC-106", "niv": 3, "e": "Sobre la propuesta del contratista de excluir a los mayores de 60 años, lo correcto es señalar que", "f": "Constitución Política, art. 13 (jurisprudencia constitucional sobre el carácter enunciativo de los criterios del inciso 1)", "o": [["A", "es válida si se publica en la convocatoria antes de abrir las inscripciones.", "Publicar una regla discriminatoria no la vuelve constitucional. La publicidad no sustituye la justificación objetiva y razonable que exige cualquier trato diferente.", false], ["B", "es válida, porque la edad no figura entre los criterios de discriminación que enumera expresamente el artículo 13.", "La lista del artículo 13 no es taxativa; cualquier trato diferente debe tener una justificación objetiva y razonable. La ausencia de la edad en la enumeración no vuelve legítima una exclusión arbitraria.", false], ["C", "es contraria a la igualdad, porque introduce un trato diferente sin justificación objetiva y razonable.", "El artículo 13 garantiza los mismos derechos y oportunidades a todas las personas. Excluir a un grupo por un prejuicio sobre su capacidad de aprender, en un curso gratuito sin requisitos técnicos, es un trato diferente sin justificación objetiva y razonable, aunque la edad no esté en la lista del artículo.", true]]}]}, {"comp": "estado_constitucion", "rol": "profesional", "tag": "Estado y Constitución · Nivel profesional · Acción de tutela: procedencia", "texto": "Usted es profesional especializado de la oficina jurídica de una corporación autónoma regional. Llegan tres asuntos: (1) un usuario anuncia una tutela para que se deje sin efectos el acuerdo del consejo directivo que fija, para toda la jurisdicción, los criterios generales de cobro de un servicio de la corporación; (2) una asociación de vecinos considera que un permiso de vertimientos otorgado a una empresa afecta el río del cual se abastece todo el corregimiento y quiere usar la tutela para protegerlo; y (3) un juez concedió a un usuario una tutela como mecanismo transitorio mientras demanda ante la jurisdicción de lo contencioso administrativo.", "items": [{"id": "EC-110", "niv": 2, "e": "Sobre la tutela anunciada contra el acuerdo del consejo directivo, usted debe conceptuar que, en principio,", "f": "Decreto 2591 de 1991, art. 6, num. 5", "o": [["A", "es procedente solo si el usuario agotó antes la acción de cumplimiento.", "La acción de cumplimiento busca que se cumpla una norma, no que se deje sin efectos. Además, no es requisito previo de la tutela; la razón de la improcedencia es el carácter general del acto.", false], ["B", "es procedente, porque cualquier acto de una autoridad ambiental puede afectar derechos fundamentales.", "No basta con que el acto provenga de una autoridad: el artículo 6 del Decreto 2591 excluye la tutela contra actos de carácter general, impersonal y abstracto, como un acuerdo que fija criterios para toda la jurisdicción.", false], ["C", "es improcedente, porque se dirige contra un acto de carácter general, impersonal y abstracto.", "El numeral 5 del artículo 6 del Decreto 2591 de 1991 señala que la tutela no procede cuando se trate de actos de carácter general, impersonal y abstracto. El acuerdo que fija criterios para toda la jurisdicción tiene ese carácter.", true]]}, {"id": "EC-111", "niv": 2, "e": "Para proteger el río frente al permiso de vertimientos, el mecanismo judicial que corresponde a la asociación es", "f": "Decreto 2591 de 1991, art. 6, num. 3; Ley 472 de 1998, arts. 2 y 9; Constitución Política, art. 88", "o": [["A", "la acción de tutela en lugar de la acción popular, porque el ambiente sano está ligado a la vida de los habitantes.", "El artículo 6, numeral 3, del Decreto 2591 excluye la tutela para proteger derechos colectivos como el ambiente, salvo que un titular busque impedir un perjuicio irremediable a sus propios derechos fundamentales, situación que el caso no plantea.", false], ["B", "la acción popular, porque busca proteger un derecho colectivo frente a la acción u omisión de una autoridad o un particular.", "Las acciones populares son los medios procesales para proteger derechos e intereses colectivos (Ley 472, art. 2) y proceden contra acciones u omisiones de autoridades o particulares (art. 9). El ambiente es un derecho colectivo según el artículo 88 de la Constitución.", true], ["C", "la acción de grupo, porque los afectados son más de veinte habitantes del corregimiento.", "La acción de grupo sirve exclusivamente para obtener la indemnización de perjuicios individuales (Ley 472, arts. 3 y 46). La asociación busca proteger el río, no cobrar indemnizaciones.", false]]}, {"id": "EC-112", "niv": 3, "e": "Respecto de la tutela concedida como mecanismo transitorio, el usuario debe presentar la demanda ante lo contencioso administrativo en un término máximo de", "f": "Decreto 2591 de 1991, art. 8", "o": [["A", "dos meses contados desde el fallo de tutela.", "No corresponde al término del Decreto 2591. El artículo 8 fija un máximo de cuatro meses a partir del fallo de tutela.", false], ["B", "cuatro meses contados desde el fallo de tutela; si no lo hace, cesan los efectos de la tutela.", "El artículo 8 del Decreto 2591 de 1991 dispone que, cuando la tutela se concede como mecanismo transitorio, el afectado debe ejercer la acción ordinaria en un término máximo de cuatro meses a partir del fallo; si no la instaura, cesan sus efectos.", true], ["C", "seis meses contados desde la ejecutoria del acto, sin que ello afecte la vigencia de la tutela.", "El término se cuenta desde el fallo de tutela y es de cuatro meses. Además, si la demanda no se presenta, los efectos de la tutela cesan.", false]]}]}, {"comp": "estado_constitucion", "rol": "general", "tag": "Estado y Constitución · Estructura del Estado: ramas y órganos autónomos", "texto": "Usted es técnico del área de talento humano de una alcaldía de segunda categoría y prepara el módulo de inducción para el personal que ingresará por concurso. El borrador heredado de una administración anterior contiene varias afirmaciones dudosas: que «el poder público tiene cuatro ramas, incluida la de control»; que «la personería es una oficina de la Secretaría de Gobierno»; y que «la carrera administrativa del municipio la administra el Departamento Administrativo de la Función Pública». Su jefe le pide corregir el material antes de la jornada.", "items": [{"id": "EC-125", "niv": 1, "e": "Al explicar la estructura del Estado según la Constitución, el módulo debe indicar que", "f": "Constitución Política, art. 113", "o": [["A", "además de las tres ramas existen órganos autónomos e independientes, y todos colaboran armónicamente.", "El artículo 113 de la Constitución dispone que son ramas del poder público la legislativa, la ejecutiva y la judicial, que además existen otros órganos autónomos e independientes para las demás funciones del Estado, y que los órganos tienen funciones separadas pero colaboran armónicamente.", true], ["B", "los órganos de control hacen parte de la rama ejecutiva, porque vigilan a la administración pública.", "Vigilar a la administración no convierte a los órganos de control en parte de la rama ejecutiva. El artículo 113 los ubica fuera de las ramas, como órganos autónomos e independientes.", false], ["C", "existen cuatro ramas del poder público: legislativa, ejecutiva, judicial y de control fiscal y disciplinario.", "La Constitución reconoce solo tres ramas. Los órganos de control no forman una rama; son órganos autónomos e independientes (arts. 113 y 117).", false]]}, {"id": "EC-126", "niv": 2, "e": "Sobre la personería municipal, el módulo debe presentarla como", "f": "Constitución Política, art. 118; Ley 136 de 1994, art. 178", "o": [["A", "la entidad que ejerce en el municipio funciones de Ministerio Público, bajo dirección del Procurador.", "El artículo 118 de la Constitución menciona a los personeros municipales entre quienes ejercen el Ministerio Público, y el artículo 178 de la Ley 136 de 1994 dispone que el personero ejerce esas funciones en el municipio bajo la dirección suprema del Procurador General de la Nación.", true], ["B", "una dependencia de la Secretaría de Gobierno, sometida a la dirección jerárquica del alcalde y a su manual de funciones.", "La personería no depende del alcalde. El artículo 118 la incluye en el Ministerio Público y el artículo 178 de la Ley 136 de 1994 señala que el personero actúa bajo la dirección suprema del Procurador General.", false], ["C", "una oficina seccional de la Contraloría General de la República en el municipio.", "La Contraloría es el otro órgano de control, encargado de la gestión fiscal (art. 119). La personería pertenece al Ministerio Público, no a la Contraloría.", false]]}, {"id": "EC-127", "niv": 1, "e": "Respecto de la entidad responsable de administrar y vigilar la carrera administrativa de los empleados de la alcaldía, el módulo debe corregirse para indicar que es", "f": "Constitución Política, art. 130", "o": [["A", "la Procuraduría General de la Nación, por medio de los personeros.", "La Procuraduría vigila la conducta oficial de los servidores; no administra la carrera administrativa, función que el artículo 130 asigna a la Comisión Nacional del Servicio Civil.", false], ["B", "el Departamento Administrativo de la Función Pública.", "Función Pública formula políticas de empleo público, pero la Constitución asigna la administración y vigilancia de la carrera a la Comisión Nacional del Servicio Civil (art. 130).", false], ["C", "la Comisión Nacional del Servicio Civil, por mandato constitucional.", "El artículo 130 de la Constitución dispone que la Comisión Nacional del Servicio Civil es responsable de la administración y vigilancia de las carreras de los servidores públicos, excepto las que tengan carácter especial.", true]]}]}, {"comp": "estado_constitucion", "rol": "general", "tag": "Estado y Constitución · Contralorías territoriales y responsabilidad fiscal", "texto": "Usted es técnico de la oficina de control interno de un instituto descentralizado de Bogotá. La Contraloría de Bogotá detectó pagos duplicados a un contratista por 85 millones de pesos y anunció que abrirá un proceso. Un directivo pregunta qué autoridad establece la responsabilidad por ese detrimento y quién vigila, a su vez, la gestión fiscal de la propia Contraloría de Bogotá. Además, una veeduría ciudadana considera que la contraloría territorial ha actuado sin objetividad en otro asunto y pregunta qué puede hacer.", "items": [{"id": "EC-140", "niv": 1, "e": "Para establecer la responsabilidad derivada del detrimento por los pagos duplicados, la autoridad competente es", "f": "Constitución Política, arts. 268, num. 5, y 272", "o": [["A", "la Personería de Bogotá, mediante un proceso disciplinario contra el servidor que ordenó los pagos.", "El proceso disciplinario juzga la conducta del servidor frente a sus deberes, pero no establece la responsabilidad fiscal por el detrimento patrimonial.", false], ["B", "la Fiscalía General, mediante una investigación penal.", "La Fiscalía investiga delitos. La responsabilidad fiscal por el detrimento corresponde a la contraloría competente; ambos procesos pueden coexistir.", false], ["C", "la Contraloría de Bogotá, mediante el proceso de responsabilidad fiscal a su cargo.", "El numeral 5 del artículo 268 atribuye al Contralor establecer la responsabilidad derivada de la gestión fiscal, imponer sanciones pecuniarias y ejercer jurisdicción coactiva; el artículo 272 asigna esas funciones, en lo pertinente, a los contralores distritales.", true]]}, {"id": "EC-141", "niv": 2, "e": "Sobre quién vigila la gestión fiscal de la Contraloría de Bogotá, lo correcto es responder que corresponde", "f": "Constitución Política, art. 274", "o": [["A", "a la Contraloría General de la República, como superior de las contralorías territoriales.", "La Contraloría General no es superior jerárquico de las contralorías territoriales, y la vigilancia de la gestión fiscal de estas corresponde a la Auditoría General (art. 274).", false], ["B", "a la Auditoría General de la República, por disposición constitucional.", "El artículo 274 de la Constitución dispone que la vigilancia de la gestión fiscal de la Contraloría General y de todas las contralorías territoriales la ejerce el Auditor General de la República.", true], ["C", "al Concejo de Bogotá, que eligió al contralor distrital.", "El concejo elige al contralor (art. 272), pero no vigila la gestión fiscal de la contraloría; esa función es del Auditor General.", false]]}, {"id": "EC-142", "niv": 3, "e": "Ante la falta de objetividad que la veeduría atribuye a la contraloría territorial, una vía prevista en el ordenamiento es", "f": "Constitución Política, art. 268, num. 14 (modificado por el Acto Legislativo 4 de 2019); los casos excepcionales los define la ley", "o": [["A", "pedir a la Contraloría General que intervenga en los casos excepcionales previstos por la ley.", "El numeral 14 del artículo 268 de la Constitución, modificado por el Acto Legislativo 4 de 2019, permite al Contralor General intervenir en los casos excepcionales previstos por la ley en las funciones de vigilancia y control de las contralorías territoriales, y señala que esa intervención puede ser solicitada, entre otros, por la ciudadanía mediante cualquiera de los mecanismos de participación ciudadana. La ley define los casos y el procedimiento.", true], ["B", "solicitar al concejo distrital que realice directamente la auditoría fiscal del caso.", "El concejo ejerce control político; no realiza auditorías fiscales, que son función técnica de las contralorías.", false], ["C", "pedir a la Procuraduría que asuma el control fiscal de los asuntos en los que la contraloría no fue objetiva.", "La Procuraduría ejerce control disciplinario y no puede asumir el control fiscal. La intervención en las funciones de las contralorías territoriales corresponde a la Contraloría General.", false]]}]}, {"comp": "estado_constitucion", "rol": "general", "tag": "Estado y Constitución · Desconcentración y descentralización", "texto": "Usted es técnico administrativo de la oficina de planeación de un departamento. La corporación autónoma regional con jurisdicción en el departamento trasladó a sus direcciones territoriales, ubicadas en tres municipios alejados, la recepción y el trámite de solicitudes, sin que el director general deje de orientarlas. A su vez, la asamblea estudia crear un instituto departamental de deportes como establecimiento público, y el gobernador quiere crear otra entidad que preste servicios de impresión y publicaciones en competencia con empresas privadas.", "items": [{"id": "EC-152", "niv": 2, "e": "La decisión de la corporación de radicar funciones en sus direcciones territoriales corresponde a la figura de", "f": "Ley 489 de 1998, art. 8", "o": [["A", "la delegación, porque el director general transfiere funciones a otros servidores mediante acto escrito.", "La delegación transfiere el ejercicio de funciones a colaboradores o a otras autoridades. El artículo 8 de la Ley 489 aclara que la desconcentración no implica delegación.", false], ["B", "la descentralización por servicios, porque las direcciones territoriales adquieren autonomía.", "La descentralización por servicios crea entidades con personería jurídica y autonomía propias. Las direcciones territoriales siguen siendo parte de la misma corporación.", false], ["C", "la desconcentración, porque radica competencias en dependencias ubicadas fuera de la sede principal.", "El artículo 8 de la Ley 489 de 1998 define la desconcentración como la radicación de competencias y funciones en dependencias ubicadas fuera de la sede principal del organismo, sin perjuicio de las potestades de orientación de los jefes superiores; no implica delegación.", true]]}, {"id": "EC-153", "niv": 1, "e": "Para crear el instituto departamental de deportes como establecimiento público se requiere", "f": "Ley 489 de 1998, art. 69", "o": [["A", "una ordenanza de la asamblea departamental, o su autorización, por ser entidad del departamento.", "El artículo 69 de la Ley 489 de 1998 dispone que las entidades descentralizadas se crean, en el orden nacional, por la ley, y en el orden departamental, distrital y municipal, por la ordenanza o el acuerdo, o con su autorización.", true], ["B", "una ley de la República, por tratarse de una entidad descentralizada.", "La ley crea las entidades descentralizadas del orden nacional. Las del orden departamental se crean por ordenanza o con su autorización (art. 69).", false], ["C", "un decreto del gobernador, sin necesidad de autorización previa de la asamblea departamental.", "El gobernador no puede crear por sí solo entidades descentralizadas. El artículo 69 exige la ordenanza o la autorización de la asamblea.", false]]}, {"id": "EC-154", "niv": 3, "e": "La entidad que prestará servicios de impresión en competencia con empresas privadas, conforme a las reglas del derecho privado, corresponde a la figura de", "f": "Ley 489 de 1998, arts. 70 y 85", "o": [["A", "establecimiento público, porque presta un servicio con patrimonio independiente.", "Los establecimientos públicos atienden principalmente funciones administrativas y prestan servicios públicos conforme al derecho público (art. 70), no actividades comerciales regidas por el derecho privado.", false], ["B", "empresa industrial y comercial del Estado, por su actividad comercial regida por el derecho privado.", "El artículo 85 de la Ley 489 de 1998 define las empresas industriales y comerciales del Estado como organismos que desarrollan actividades de naturaleza industrial o comercial y de gestión económica conforme a las reglas del derecho privado, con personería jurídica, autonomía y capital independiente.", true], ["C", "unidad administrativa especial sin personería jurídica, adscrita a la secretaría de hacienda.", "Una unidad sin personería jurídica pertenece al sector central y no es la figura prevista para actividades comerciales en competencia regidas por el derecho privado.", false]]}]}, {"comp": "estado_constitucion", "rol": "general", "tag": "Estado y Constitución · Rendición de cuentas", "texto": "Usted es profesional universitario de la oficina de planeación de una gobernación y apoya la preparación de la rendición de cuentas anual del gobernador. En la reunión de preparación surgen tres asuntos: el jefe de prensa propone que el ejercicio consista solo en publicar un video con las cifras de gestión; durante la audiencia los ciudadanos formularán preguntas que no alcanzarán a responderse en el evento; y un asesor pregunta en qué instrumento de planeación debe quedar la estrategia de rendición de cuentas.", "items": [{"id": "EC-164", "niv": 1, "e": "Frente a la propuesta del jefe de prensa, debe señalarse que la rendición de cuentas se fundamenta en los elementos de", "f": "Ley 1757 de 2015, art. 49", "o": [["A", "información y transparencia, que se satisfacen con la publicación en la página web de la entidad.", "La información es solo uno de los elementos. La Ley 1757 exige además lenguaje comprensible, diálogo e incentivos.", false], ["B", "información, lenguaje comprensible al ciudadano, diálogo e incentivos.", "El artículo 49 de la Ley 1757 de 2015 establece que la rendición de cuentas se fundamenta en los elementos de información, lenguaje comprensible al ciudadano, diálogo e incentivos. Un video sin espacio de diálogo no cumple todos ellos.", true], ["C", "publicidad, eficacia y economía, que se cumplen con la difusión de las cifras de gestión.", "Publicidad, eficacia y economía son principios de la función administrativa (art. 209 C. P.), no los elementos de la rendición de cuentas que fija la Ley 1757.", false]]}, {"id": "EC-165", "niv": 1, "e": "Las preguntas de los ciudadanos que no se respondan en el evento deben contestarse por escrito en el término de", "f": "Ley 1757 de 2015, art. 56, lit. f", "o": [["A", "cinco días, y publicarse en la página web.", "La ley no fija cinco días. El literal f del artículo 56 establece quince días para las respuestas escritas.", false], ["B", "quince días, y publicarse en la página web o en los medios oficiales de difusión.", "El literal f del artículo 56 de la Ley 1757 de 2015 prevé respuestas escritas, en el término de quince días, a las preguntas de los ciudadanos formuladas en el marco del proceso de rendición de cuentas, y su publicación en la página web o en los medios oficiales de la entidad.", true], ["C", "treinta días, y remitirse a la asamblea departamental para su evaluación.", "El término es de quince días y la respuesta se publica en los medios de la entidad. La asamblea evalúa el informe anual del gobernador, no cada respuesta.", false]]}, {"id": "EC-166", "niv": 2, "e": "Al asesor debe responderse que la estrategia anual de rendición de cuentas debe incluirse en", "f": "Ley 1757 de 2015, art. 52; Ley 1474 de 2011, art. 73 (modificado por el art. 31 de la Ley 2195 de 2022); Decreto 1081 de 2015, art. 2.1.4.4.1.5 (adicionado por el Decreto 1122 de 2024)", "o": [["A", "el plan anual de adquisiciones, porque implica contratar la logística de la audiencia.", "El plan de adquisiciones programa compras; no es el instrumento donde la ley ordena incluir la estrategia de rendición de cuentas.", false], ["B", "el plan de desarrollo departamental, como un programa del componente estratégico.", "La Ley 1757 no ordena incluir la estrategia anual en el plan de desarrollo cuatrienal, sino en el instrumento anticorrupción de la entidad, hoy el Programa de Transparencia y Ética Pública (antes Plan Anticorrupción y de Atención al Ciudadano).", false], ["C", "el Programa de Transparencia y Ética Pública (antes Plan Anticorrupción y de Atención al Ciudadano), según la ley de participación y su reglamentación vigente.", "El artículo 52 de la Ley 1757 de 2015 ordena a las entidades nacionales y territoriales elaborar anualmente una estrategia de rendición de cuentas, conforme al Manual Único, que debe incluirse en el Plan Anticorrupción y de Atención a los Ciudadanos. Desde el Decreto 1122 de 2024 (art. 2.1.4.4.1.5 del Decreto 1081 de 2015), que reglamenta el artículo 73 de la Ley 1474 de 2011 modificado por la Ley 2195 de 2022, ese plan fue reemplazado por el Programa de Transparencia y Ética Pública, y toda mención al plan se entiende referida al programa.", true]]}]}, {"comp": "estado_constitucion", "rol": "general", "tag": "Estado y Constitución · Acción de cumplimiento: titulares y trámite", "texto": "Usted es técnico administrativo de una corporación autónoma regional. Un acuerdo del consejo directivo de la corporación le impone publicar semestralmente en su sitio web el informe de seguimiento a las concesiones de agua otorgadas, y no se ha publicado en dos años. El personero de un municipio de la jurisdicción reclamó por escrito el cumplimiento, sin respuesta en más de diez días, y anuncia una acción de cumplimiento. En paralelo, un usuario presentó una «acción de cumplimiento» cuyo verdadero propósito es que se responda un derecho de petición suyo.", "items": [{"id": "EC-179", "niv": 1, "e": "Sobre si el personero puede presentar la acción de cumplimiento, lo correcto es afirmar que", "f": "Ley 393 de 1997, art. 4", "o": [["A", "sí puede, porque la ley la concede a cualquier persona y, en especial, a servidores públicos como los personeros.", "El artículo 4 de la Ley 393 de 1997 dispone que cualquier persona puede ejercer la acción de cumplimiento y menciona expresamente a los servidores públicos, en especial a los personeros municipales, entre otros.", true], ["B", "solo puede hacerlo como apoderado de un usuario de las concesiones de agua que le otorgue poder.", "El personero está legitimado por sí mismo como servidor público (art. 4); no necesita poder de un ciudadano.", false], ["C", "no puede, porque la acción de cumplimiento es exclusiva de los ciudadanos directamente afectados por el incumplimiento de la norma.", "La Ley 393 no limita la acción a los afectados; la concede a cualquier persona y expresamente a servidores públicos y organizaciones.", false]]}, {"id": "EC-180", "niv": 3, "e": "Ante la «acción de cumplimiento» del usuario que busca la respuesta a su derecho de petición, el juez", "f": "Ley 393 de 1997, art. 9", "o": [["A", "la tramitará como acción de cumplimiento, porque el usuario eligió ese mecanismo y el juez no puede cambiarlo.", "La elección del accionante no prevalece: la acción de cumplimiento no procede para proteger derechos que puedan garantizarse por tutela (art. 9).", false], ["B", "la rechazará y ordenará al usuario presentar una tutela por separado.", "La ley no ordena el rechazo: el artículo 9 dispone que el juez le dará a la solicitud el trámite de tutela.", false], ["C", "le dará el trámite de tutela, porque busca proteger un derecho garantizable por esa vía.", "El artículo 9 de la Ley 393 de 1997 dispone que la acción de cumplimiento no procede para proteger derechos que puedan ser garantizados mediante la tutela, y que en esos eventos el juez dará a la solicitud el trámite correspondiente a la tutela. El derecho de petición es fundamental.", true]]}, {"id": "EC-181", "niv": 2, "e": "Si el juez ordena a la corporación publicar el informe, el plazo para cumplir, salvo que el juez justifique uno mayor, no podrá exceder de", "f": "Ley 393 de 1997, art. 21, num. 5", "o": [["A", "cuarenta y ocho horas desde la notificación del fallo.", "Cuarenta y ocho horas es el plazo máximo de cumplimiento de un fallo de tutela (Decreto 2591, art. 29), no de cumplimiento.", false], ["B", "diez días hábiles contados a partir de la ejecutoria del fallo.", "El numeral 5 del artículo 21 de la Ley 393 de 1997 dispone que el plazo para cumplir lo resuelto no podrá exceder de diez días hábiles contados a partir de la ejecutoria del fallo; si se requiere uno mayor, el juez lo sustenta en la sentencia.", true], ["C", "treinta días calendario contados desde la ejecutoria del fallo.", "La ley fija un máximo de diez días hábiles desde la ejecutoria, salvo que el juez justifique un término mayor.", false]]}]}, {"comp": "estado_constitucion", "rol": "profesional", "tag": "Estado y Constitución · Nivel profesional · Acción popular: pacto de cumplimiento", "texto": "Usted es profesional universitario de la oficina jurídica de un municipio de tercera categoría, demandado en una acción popular por la falta de mantenimiento de un puente peatonal que pone en riesgo a los habitantes de un barrio. El demandante había pedido a la alcaldía, un mes antes de demandar, que adoptara medidas, sin obtener respuesta. La alcaldía alega que la demanda debe rechazarse porque el demandante no interpuso recursos administrativos. El juez convocó a la audiencia de pacto de cumplimiento y el secretario de Infraestructura pregunta si es necesario asistir.", "items": [{"id": "EC-188", "niv": 2, "e": "Sobre la asistencia del secretario de Infraestructura a la audiencia, usted debe advertirle que", "f": "Ley 472 de 1998, art. 27", "o": [["A", "es obligatoria la intervención de la entidad y su inasistencia es causal de mala conducta.", "El artículo 27 de la Ley 472 de 1998 dispone que la intervención del Ministerio Público y de la entidad responsable de velar por el derecho colectivo es obligatoria, y que la inasistencia de los funcionarios competentes constituye causal de mala conducta sancionable con destitución.", true], ["B", "solo es obligatoria si el juez lo cita personalmente por su nombre en el auto que fija la audiencia.", "La obligación se predica de los funcionarios competentes de la entidad responsable, sin que la ley exija citación nominal.", false], ["C", "es opcional, porque la alcaldía puede enviar sus argumentos por escrito antes de la audiencia.", "La Ley 472 hace obligatoria la intervención de la entidad responsable de velar por el derecho colectivo; el escrito no sustituye su asistencia.", false]]}, {"id": "EC-189", "niv": 3, "e": "Si en el proyecto de pacto el juez advierte un vicio de ilegalidad, lo procedente es que", "f": "Ley 472 de 1998, art. 27", "o": [["A", "lo apruebe de todas formas, porque en el pacto prevalece la voluntad de las partes sobre la legalidad.", "El juez no puede aprobar un pacto ilegal. La ley le ordena corregir los vicios con el consentimiento de las partes.", false], ["B", "declare la nulidad de todo lo actuado y ordene al demandante presentar una nueva demanda.", "La ley no prevé la nulidad del proceso por esta causa; si no hay acuerdo sobre las correcciones, la audiencia se declara fallida y el proceso continúa con la etapa probatoria.", false], ["C", "lo corrija con el consentimiento de las partes; si estas no consienten, la audiencia se considera fallida.", "El artículo 27 de la Ley 472 de 1998 dispone que el juez revisa el pacto en cinco días y que, si observa vicios de ilegalidad, los corrige con el consentimiento de las partes interesadas; la audiencia se considera fallida cuando las partes no consienten en las correcciones.", true]]}, {"id": "EC-190", "niv": 3, "e": "Frente al argumento de la alcaldía sobre los recursos administrativos, usted debe conceptuar que", "f": "Ley 472 de 1998, art. 10; Ley 1437 de 2011, art. 144", "o": [["A", "no prospera, porque la acción popular no exige recursos previos y el demandante ya hizo la reclamación ante la alcaldía.", "El artículo 10 de la Ley 472 de 1998 dispone que no es necesario interponer previamente los recursos administrativos para intentar la acción popular. El requisito del artículo 144 de la Ley 1437 de 2011, la reclamación previa con quince días para responder, se cumplió.", true], ["B", "prospera, porque toda acción contra la administración exige agotar previamente los recursos procedentes.", "La acción popular tiene una regla especial: el artículo 10 de la Ley 472 dispone que no es necesario interponer previamente los recursos administrativos.", false], ["C", "prospera, porque el demandante debía esperar tres meses para que se configurara el silencio administrativo.", "El requisito previo de la acción popular es la reclamación con un plazo de quince días (art. 144 de la Ley 1437), que el demandante cumplió; no se exige esperar el silencio administrativo.", false]]}]}, {"comp": "estado_constitucion", "rol": "general", "tag": "Estado y Constitución · Veedurías y control fiscal", "texto": "Usted es técnico administrativo de un instituto distrital de Bogotá que ejecuta un programa de comedores comunitarios con recursos públicos, operado por una fundación privada. Una veeduría ciudadana vigila el programa y presentó una denuncia ante la Contraloría de Bogotá por posibles sobrecostos. El director del instituto propone pagar honorarios a los veedores «para que hagan mejor su trabajo», y la fundación operadora sostiene que, por ser privada, la veeduría no puede vigilarla.", "items": [{"id": "EC-194", "niv": 2, "e": "Recibida la denuncia de la veeduría, la primera etapa del proceso común de atención de denuncias en el organismo de control fiscal es", "f": "Ley 850 de 2003, art. 16A (adicionado por la Ley 1757 de 2015, art. 70)", "o": [["A", "el traslado inmediato al proceso de responsabilidad fiscal contra el ordenador del gasto.", "El traslado al proceso auditor o de responsabilidad fiscal es la tercera etapa, después de evaluar la competencia y recaudar pruebas.", false], ["B", "la evaluación de la denuncia y la determinación de la competencia del organismo.", "El artículo 16A de la Ley 850 de 2003, adicionado por el artículo 70 de la Ley 1757 de 2015, establece un proceso común de atención de denuncias en los organismos de control fiscal cuya primera etapa es la evaluación y determinación de competencia, seguida de la atención inicial, el traslado y la respuesta al ciudadano.", true], ["C", "la respuesta al ciudadano informándole el archivo o la apertura del proceso.", "La respuesta al ciudadano es la última etapa del proceso común previsto en el artículo 16A.", false]]}, {"id": "EC-195", "niv": 2, "e": "Frente a la propuesta del director de pagar honorarios a los veedores, usted debe advertir que", "f": "Ley 850 de 2003, art. 8", "o": [["A", "es viable, siempre que lo autorice previamente la personería que inscribió la veeduría.", "La personería no puede autorizar lo que la ley prohíbe; el pago desconoce la autonomía de la veeduría.", false], ["B", "es viable, siempre que el pago se haga mediante un contrato de prestación de servicios.", "La forma de vinculación no cambia la conclusión: los veedores no pueden ser pagados por las entidades, por el principio de autonomía (art. 8).", false], ["C", "contraría la autonomía de las veedurías, cuyos miembros no dependen de las entidades públicas ni son pagados por ellas.", "El artículo 8 de la Ley 850 de 2003 dispone que las veedurías gozan de plena autonomía frente a las entidades públicas y los organismos de control, por lo que los veedores no dependen de ellas ni son pagados por ellas. Si la entidad vigilada pagara a los veedores, la veeduría perdería su independencia frente a quien debe vigilar.", true]]}, {"id": "EC-196", "niv": 3, "e": "Frente a la posición de la fundación operadora, lo correcto es señalar que la veeduría", "f": "Ley 850 de 2003, arts. 1 y 5", "o": [["A", "puede vigilarla en la ejecución del programa, porque este se financia con recursos públicos.", "El artículo 1 de la Ley 850 de 2003 permite a las veedurías vigilar a entidades públicas o privadas encargadas de ejecutar un programa, proyecto o contrato, en los ámbitos en que se empleen recursos públicos, y el artículo 5 extiende la vigilancia a particulares que cumplan funciones públicas.", true], ["B", "puede vigilarla en todas sus actividades, incluidas las que financia con recursos propios.", "La vigilancia se ejerce en los ámbitos en que se emplean recursos públicos (art. 1), no sobre toda la actividad privada de la fundación.", false], ["C", "no puede vigilarla, porque las veedurías solo ejercen vigilancia sobre entidades y servidores públicos.", "La Ley 850 permite vigilar también a entidades privadas y organizaciones no gubernamentales encargadas de ejecutar programas, proyectos o contratos con recursos públicos (art. 1).", false]]}]}, {"comp": "empleo_publico", "rol": "general", "tag": "Empleo público, carrera y régimen disciplinario · Comisión para desempeñar empleos de libre nombramiento", "texto": "Ricardo es profesional universitario con derechos de carrera en una secretaría de Movilidad de Bogotá y su última evaluación del desempeño fue sobresaliente. El secretario de Ambiente lo invitó a ocupar el empleo de jefe de oficina, de libre nombramiento y remoción, en esa otra entidad del distrito. Ricardo le consulta a usted, que trabaja en la Dirección de Talento Humano de Movilidad, cómo puede aceptar sin perder su empleo de carrera y qué pasa si después renuncia al empleo directivo.", "items": [{"id": "EP-120", "niv": 2, "e": "Para conservar su empleo de carrera mientras ocupa el cargo de jefe de oficina, Ricardo debe", "f": "Ley 909 de 2004, art. 26", "o": [["A", "solicitar un encargo en el empleo de jefe de oficina, porque es la figura que protege los derechos de carrera.", "El encargo es un movimiento dentro de la planta de la entidad; para ocupar un empleo de libre nombramiento en otra entidad con nombramiento ordinario, la figura prevista es la comisión del art. 26 de la Ley 909 de 2004.", false], ["B", "obtener comisión para desempeñar el empleo de libre nombramiento, a la cual tiene derecho por su evaluación sobresaliente.", "El art. 26 de la Ley 909 de 2004 reconoce a los empleados de carrera con evaluación sobresaliente el derecho a comisión hasta por tres años, prorrogable por un término igual, para desempeñar empleos de libre nombramiento y remoción en la misma entidad o en otra.", true], ["C", "renunciar al empleo de carrera, porque la ley prohíbe tener derechos de carrera y ocupar un empleo de libre nombramiento.", "La ley no exige renunciar: el art. 26 de la Ley 909 de 2004 prevé precisamente la comisión para que el empleado de carrera desempeñe empleos de libre nombramiento sin perder sus derechos.", false]]}, {"id": "EP-121", "niv": 2, "e": "Si Ricardo se posesionara en el empleo de jefe de oficina sin que se le haya otorgado la comisión, la consecuencia sería", "f": "Ley 909 de 2004, art. 42, num. 2", "o": [["A", "una falta disciplinaria leve, pero conservaría su inscripción en el registro de carrera.", "La consecuencia prevista en la ley no es disciplinaria sino la pérdida de los derechos de carrera (art. 42, num. 2, de la Ley 909 de 2004).", false], ["B", "una vacancia temporal del empleo de carrera hasta que Ricardo regrese a Movilidad.", "Sin comisión no se genera vacancia temporal con derecho a regresar; la ley prevé la pérdida de los derechos de carrera.", false], ["C", "el retiro de la carrera administrativa y la pérdida de los derechos inherentes a ella.", "El art. 42, num. 2, de la Ley 909 de 2004 establece que el empleado pierde los derechos de carrera cuando toma posesión de un cargo de libre nombramiento y remoción sin haber mediado la comisión respectiva.", true]]}, {"id": "EP-122", "niv": 3, "e": "Si, ya en comisión, Ricardo renuncia al empleo de jefe de oficina antes de que venza la comisión, deberá", "f": "Ley 909 de 2004, art. 26", "o": [["A", "asumir el empleo respecto del cual tiene derechos de carrera; si no lo hace, la entidad declarará la vacancia y lo proveerá en forma definitiva.", "El art. 26 de la Ley 909 de 2004 dispone que, al terminar la comisión o cuando el empleado renuncie o sea retirado del cargo de libre nombramiento antes del vencimiento, debe asumir el empleo de carrera; de no hacerlo, la entidad declara la vacancia, lo provee definitivamente e informa a la CNSC.", true], ["B", "solicitar a la CNSC su reubicación en un empleo de libre nombramiento equivalente en Movilidad.", "La comisión no da derecho a ser reubicado en otro empleo de libre nombramiento; su efecto es que el empleado regrese al empleo respecto del cual tiene derechos de carrera.", false], ["C", "esperar a que venza el término de la comisión para regresar, porque la comisión no puede interrumpirse.", "La ley prevé expresamente que, si el empleado renuncia al cargo de libre nombramiento antes del vencimiento de la comisión, debe asumir el empleo de carrera; no tiene que esperar el vencimiento.", false]]}]}, {"comp": "empleo_publico", "rol": "profesional", "tag": "Empleo público, carrera y régimen disciplinario · Nivel profesional · Calificación no satisfactoria", "texto": "Usted es profesional especializado de talento humano en una empresa social del Estado del orden municipal y apoya los asuntos de carrera administrativa. Un auxiliar de carrera obtuvo calificación definitiva no satisfactoria, que quedó en firme. El gerente le pide proyectar el acto que corresponde y le pregunta qué recurso procede contra esa decisión. También quiere saber qué ocurre si el auxiliar interpone el recurso a tiempo y la entidad no lo resuelve.", "items": [{"id": "EP-129", "niv": 1, "e": "Ante la calificación no satisfactoria en firme, el acto que usted debe proyectar es", "f": "Ley 909 de 2004, arts. 41 y 43", "o": [["A", "la declaratoria motivada de insubsistencia del nombramiento.", "El art. 43 de la Ley 909 de 2004 ordena a la autoridad nominadora declarar insubsistente, en forma motivada, el nombramiento del empleado de carrera que obtenga calificación no satisfactoria; el art. 41, lit. b, lo prevé como causal de retiro.", true], ["B", "una sanción disciplinaria de suspensión, previa apertura de investigación.", "La calificación no satisfactoria no es una falta disciplinaria por sí misma; su consecuencia legal es la insubsistencia del nombramiento, no una sanción disciplinaria.", false], ["C", "un traslado a otra dependencia para que el auxiliar mejore su desempeño.", "El traslado es un movimiento de personal para proveer vacantes, no una consecuencia de la calificación no satisfactoria; la ley ordena la insubsistencia.", false]]}, {"id": "EP-130", "niv": 2, "e": "Contra el acto que declara la insubsistencia por calificación no satisfactoria procede", "f": "Ley 909 de 2004, art. 43", "o": [["A", "el recurso de apelación ante la Comisión Nacional del Servicio Civil.", "La ley no prevé apelación ante la CNSC contra este acto; el recurso que procede es el de reposición ante quien lo expidió.", false], ["B", "el recurso de reposición.", "El art. 43, num. 2, de la Ley 909 de 2004 establece que contra el acto que declara la insubsistencia del nombramiento por calificación no satisfactoria procede el recurso de reposición.", true], ["C", "el recurso de queja ante el superior jerárquico.", "El recurso de queja procede cuando se rechaza la apelación; no es el recurso previsto contra la declaratoria de insubsistencia.", false]]}, {"id": "EP-131", "niv": 3, "e": "Si el auxiliar presenta el recurso dentro del término y la entidad no lo resuelve en el plazo legal, la consecuencia es que", "f": "Ley 909 de 2004, art. 43, num. 3", "o": [["A", "se configura silencio administrativo negativo, y el auxiliar puede demandar en nulidad y restablecimiento del derecho ante la jurisdicción.", "La Ley 909 de 2004 prevé una consecuencia especial y favorable al empleado: la decisión se entiende revocada, no un silencio negativo.", false], ["B", "el recurso se entiende rechazado y la insubsistencia queda en firme a los treinta días hábiles.", "La ley no fija ese efecto ni ese término; dispone que la decisión se entiende revocada si la administración no se pronuncia dentro de cuarenta y cinco días calendario.", false], ["C", "la insubsistencia se entiende revocada si la entidad no se pronuncia en cuarenta y cinco días calendario.", "El art. 43, num. 3, de la Ley 909 de 2004 dispone que la declaratoria de insubsistencia se entiende revocada si, interpuestos los recursos en término, la administración no se pronuncia dentro de los cuarenta y cinco días calendario siguientes; en ese evento la calificación que la originó se tiene como satisfactoria en el puntaje mínimo.", true]]}]}, {"comp": "empleo_publico", "rol": "general", "tag": "Empleo público, carrera y régimen disciplinario · Comisiones", "texto": "La subdirección de gestión ambiental de una corporación autónoma regional del Eje Cafetero debe atender varias solicitudes. Un técnico de carrera debe viajar a municipios de la jurisdicción para apoyar visitas de seguimiento a permisos de vertimientos durante varias semanas. Además, dos servidores piden comisión de estudios para cursar una especialización: Paula, nombrada en provisionalidad desde hace tres años, con evaluación de gestión excelente; y Tomás, empleado de carrera, con evaluación sobresaliente en su último año, que se vinculó a la corporación hace ocho meses. Usted, que trabaja en talento humano, debe orientar a la subdirectora.", "items": [{"id": "EP-144", "niv": 2, "e": "Respecto del viaje del técnico, usted indica que la comisión de servicios al interior del país puede otorgarse", "f": "Decreto 1083 de 2015, art. 2.2.5.5.26", "o": [["A", "hasta por quince días calendario, sin posibilidad de prórroga.", "El término reglamentario es de treinta días hábiles con una posible prórroga, no de quince días calendario improrrogables.", false], ["B", "hasta por treinta días hábiles, prorrogable por razones del servicio y por una sola vez hasta por treinta días hábiles más.", "El art. 2.2.5.5.26 del Decreto 1083 de 2015 dispone que la comisión de servicios al interior se otorga hasta por treinta días hábiles, prorrogable por razones del servicio y por una sola vez hasta por treinta días hábiles más.", true], ["C", "por tiempo indefinido mientras duren las visitas, porque la comisión de servicios es una forma de provisión del empleo.", "La comisión de servicios tiene término reglamentario y no es una forma de provisión de empleos; solo las de inspección o vigilancia o las que por naturaleza exijan más tiempo escapan al término general, a juicio del nominador.", false]]}, {"id": "EP-145", "niv": 2, "e": "Frente a la solicitud de Paula, usted concluye que", "f": "Decreto 1083 de 2015, arts. 2.2.5.5.31 y siguientes", "o": [["A", "no procede la comisión de estudios, porque se exige estar en un empleo de libre nombramiento y remoción o tener derechos de carrera.", "El Decreto 1083 de 2015 (arts. 2.2.5.5.31 y siguientes) exige para la comisión de estudios estar vinculado en un empleo de libre nombramiento y remoción o acreditar derechos de carrera, un año continuo de servicio en la entidad y nivel sobresaliente en la calificación del último año; Paula es provisional.", true], ["B", "procede la comisión, siempre que Paula firme el convenio de prestación de servicios por el doble del tiempo.", "El convenio de permanencia es una obligación del comisionado, pero no suple los requisitos de acceso; Paula no cumple el de estar en un empleo de libre nombramiento o tener derechos de carrera.", false], ["C", "procede la comisión, porque lleva más de un año en la entidad y su gestión ha sido excelente.", "Aunque Paula lleve más de un año, la comisión de estudios exige además estar en un empleo de libre nombramiento o tener derechos de carrera, condición que no tiene una servidora provisional.", false]]}, {"id": "EP-146", "niv": 3, "e": "Frente a la solicitud de Tomás, usted concluye que", "f": "Decreto 1083 de 2015, arts. 2.2.5.5.19 y 2.2.5.5.31 y siguientes", "o": [["A", "procede, pero solo como permiso académico compensado de hasta dos horas diarias.", "El permiso académico compensado es una figura distinta que Tomás podría pedir, pero no es una forma de conceder la comisión de estudios; la comisión no procede porque falta el año de servicio.", false], ["B", "procede, porque los derechos de carrera y la evaluación sobresaliente son los únicos requisitos exigidos.", "Omite el requisito de antigüedad: el reglamento exige por lo menos un año continuo de servicio en la entidad que otorga la comisión.", false], ["C", "todavía no procede, porque no acredita un año continuo de servicio en la corporación.", "Además de tener derechos de carrera y evaluación sobresaliente, el Decreto 1083 de 2015 exige acreditar por lo menos un año continuo de servicio en la respectiva entidad; Tomás lleva ocho meses.", true]]}]}, {"comp": "empleo_publico", "rol": "general", "tag": "Empleo público, carrera y régimen disciplinario · Inhabilidades, incompatibilidades y prohibiciones", "texto": "En la Secretaría de Gobierno de un departamento surgen varias consultas que llegan a la oficina jurídica, donde usted trabaja: un profesional de planta quiere aceptar un segundo empleo de medio tiempo en la personería de un municipio vecino; la entidad rematará vehículos dados de baja y un técnico que se retiró hace cinco meses quiere participar en la subasta; una auxiliar pregunta si puede firmar un contrato de prestación de servicios con la alcaldía de su municipio para dictar talleres los fines de semana; y el secretario de despacho quiere nombrar en un empleo de carrera, en provisionalidad, a una persona que no cumple el requisito de experiencia del manual de funciones.", "items": [{"id": "EP-172", "niv": 1, "e": "Sobre el segundo empleo en la personería, usted conceptúa que", "f": "Ley 1952 de 2019, art. 39, num. 13; Constitución Política, art. 128", "o": [["A", "puede aceptarlo si el horario de la personería no se cruza con el de la secretaría.", "La compatibilidad de horarios no elimina la prohibición de desempeñar simultáneamente más de un empleo público.", false], ["B", "puede aceptarlo, porque se trata de una entidad de otro nivel territorial.", "La prohibición cubre cualquier empleo público y cualquier asignación del tesoro, que incluye el de la nación, las entidades territoriales y las descentralizadas.", false], ["C", "no puede aceptarlo, porque está prohibido desempeñar simultáneamente más de un empleo público, salvo excepción legal.", "El art. 39, num. 13, de la Ley 1952 de 2019 prohíbe desempeñar simultáneamente más de un empleo público o recibir más de una asignación del tesoro, salvo los casos determinados por la ley, en desarrollo del art. 128 de la Constitución.", true]]}, {"id": "EP-173", "niv": 3, "e": "Sobre la participación del extécnico en el remate de los vehículos, usted conceptúa que", "f": "Ley 1952 de 2019, art. 43, num. 2", "o": [["A", "no puede participar, porque la incompatibilidad para intervenir en remates de bienes de la entidad se extiende hasta doce meses después del retiro.", "El art. 43, num. 2, de la Ley 1952 de 2019 establece la incompatibilidad para adquirir o intervenir en remates o ventas de bienes de la entidad donde se labora, desde la vinculación y hasta doce meses después del retiro; el técnico se retiró hace cinco meses.", true], ["B", "puede participar si presenta la oferta a través de un familiar, porque la incompatibilidad es personal.", "La incompatibilidad cubre la intervención directa o indirecta; usar a un familiar para participar no la elude.", false], ["C", "puede participar, porque las incompatibilidades terminan el día en que el servidor se retira.", "Esta incompatibilidad tiene una extensión expresa después del retiro: se mantiene hasta doce meses después de dejar el servicio.", false]]}, {"id": "EP-174", "niv": 2, "e": "Sobre el contrato de prestación de servicios que quiere firmar la auxiliar, usted conceptúa que", "f": "Ley 1952 de 2019, art. 43, num. 3", "o": [["A", "puede celebrarlo, porque los talleres se dictarán por fuera de la jornada laboral.", "Que la actividad se realice fuera de la jornada no elimina la incompatibilidad para contratar con el Estado.", false], ["B", "no puede celebrarlo, porque los servidores públicos tienen incompatibilidad para contratar con el Estado, salvo excepciones constitucionales o legales.", "El art. 43, num. 3, de la Ley 1952 de 2019 establece como incompatibilidad para todo servidor público contratar con el Estado, salvo las excepciones constitucionales o legales, ninguna de las cuales se configura en el caso.", true], ["C", "puede celebrarlo si informa previamente a su jefe inmediato y este no se opone.", "La autorización del jefe no crea una excepción a la incompatibilidad; las excepciones deben ser constitucionales o legales.", false]]}, {"id": "EP-175", "niv": 2, "e": "Sobre el nombramiento provisional que quiere hacer el secretario, usted le advierte que", "f": "Ley 1952 de 2019, arts. 38, num. 10, y 39, num. 15", "o": [["A", "está prohibido nombrar a quien no reúna los requisitos del empleo, aunque el nombramiento sea provisional.", "El art. 39, num. 15, de la Ley 1952 de 2019 prohíbe nombrar en cargos públicos a personas que no reúnan los requisitos constitucionales, legales o reglamentarios; el nombramiento provisional también exige cumplir los requisitos del empleo.", true], ["B", "puede hacerlo si la persona se compromete por escrito a acreditar la experiencia exigida durante el primer año de servicio.", "No es posible posesionar a alguien con el compromiso de completar después los requisitos; deben acreditarse para la posesión y el desempeño del cargo (art. 38, num. 10).", false], ["C", "puede hacerlo, porque en la provisionalidad los requisitos del manual de funciones son opcionales.", "El nombramiento provisional no exime de cumplir los requisitos del empleo; nombrar sin ellos está prohibido.", false]]}]}, {"comp": "empleo_publico", "rol": "general", "tag": "Empleo público, carrera y régimen disciplinario · Conductas que no constituyen acoso laboral", "texto": "En una corporación autónoma regional, el subdirector de gestión ambiental expidió un memorando que exige a su equipo cumplir un estándar técnico para los conceptos de concesiones de agua y anuncia que el desempeño se evaluará con indicadores objetivos aplicables a todos. Días después, por una emergencia por inundaciones, pidió a varios servidores apoyar fuera de su rutina habitual la atención de la emergencia durante una semana. Un servidor considera que ambas medidas son acoso laboral. Además, otra servidora relata que una sola vez su jefe la agredió físicamente en una reunión.", "items": [{"id": "EP-179", "niv": 2, "e": "Respecto del memorando con estándares técnicos e indicadores objetivos, el comité concluye que", "f": "Ley 1010 de 2006, art. 8", "o": [["A", "constituye acoso, porque toda exigencia escrita del superior genera presión indebida sobre el equipo.", "La ley excluye expresamente del acoso los memorandos encaminados a exigencias técnicas, a mejorar la eficiencia y a evaluar con indicadores objetivos y generales.", false], ["B", "constituye acoso solo si el servidor afectado obtiene después una evaluación no satisfactoria en su desempeño.", "El resultado posterior de la evaluación no convierte en acoso una medida que la ley excluye expresamente de ese concepto.", false], ["C", "no constituye acoso, porque busca exigencias técnicas y una evaluación con indicadores objetivos y generales.", "El art. 8, lit. d, de la Ley 1010 de 2006 dispone que no constituye acoso la formulación de circulares o memorandos de servicio encaminados a solicitar exigencias técnicas o mejorar la eficiencia laboral y la evaluación de subalternos con indicadores objetivos y generales de rendimiento.", true]]}, {"id": "EP-180", "niv": 1, "e": "Respecto de la solicitud de apoyo durante la emergencia por inundaciones, el comité concluye que", "f": "Ley 1010 de 2006, art. 8", "o": [["A", "es acoso, porque la ley prohíbe pedir colaboración por fuera del manual de funciones en cualquier caso.", "No existe esa prohibición absoluta; la ley admite la solicitud de deberes extra de colaboración en situaciones como la emergencia descrita.", false], ["B", "no es acoso, porque son deberes extra de colaboración necesarios para la continuidad del servicio.", "El art. 8, lit. e, de la Ley 1010 de 2006 establece que no constituye acoso la solicitud de cumplir deberes extras de colaboración cuando sean necesarios para la continuidad del servicio o para solucionar situaciones difíciles de la institución.", true], ["C", "es acoso, porque cualquier tarea distinta de las habituales es ajena a las obligaciones laborales.", "La ley distingue: los deberes ostensiblemente extraños sin fundamento pueden ser acoso, pero los deberes extra necesarios para la continuidad del servicio están excluidos.", false]]}, {"id": "EP-181", "niv": 3, "e": "Sobre la agresión física ocurrida una sola vez, el comité debe tener en cuenta que", "f": "Ley 1010 de 2006, art. 7", "o": [["A", "no puede considerarse acoso, porque la ley exige que la conducta sea persistente y repetida.", "La regla general exige conductas persistentes, pero la ley admite que excepcionalmente un solo acto hostil acredite el acoso.", false], ["B", "debe remitirse a la Fiscalía para que decida, porque una agresión física es un asunto penal y no de convivencia laboral.", "La agresión física aparece en la propia Ley 1010 de 2006 como conducta constitutiva de acoso (art. 7, lit. a); su posible relevancia penal no impide aplicar también esta ley.", false], ["C", "puede configurar acoso si, por su gravedad, ofende por sí sola la dignidad o la integridad de la servidora.", "El art. 7 de la Ley 1010 de 2006 dispone que excepcionalmente un solo acto hostil bastará para acreditar el acoso laboral, lo que la autoridad apreciará según la gravedad de la conducta y su capacidad de ofender por sí sola la dignidad, la vida e integridad física y otros derechos fundamentales.", true]]}]}, {"comp": "empleo_publico", "rol": "profesional", "tag": "Empleo público, carrera y régimen disciplinario · Nivel profesional · Conflicto de intereses e impedimentos", "texto": "Usted es profesional universitario de la subdirección de autoridad ambiental de una corporación autónoma regional de Santander y le asignan sustanciar la solicitud de concesión de aguas superficiales de una finca. Al revisar el expediente, el 9 de febrero de 2026 descubre que el solicitante es su primo hermano, hijo de un hermano de su madre. Usted no ha emitido ningún concepto en el trámite y quiere actuar conforme a la ley.", "items": [{"id": "EP-186", "niv": 2, "e": "Frente a este hallazgo, usted debe", "f": "Ley 1437 de 2011, art. 11, num. 1; Ley 1952 de 2019, art. 44", "o": [["A", "informar verbalmente a su jefe y seguir sustanciando, porque solo debe apartarse si emite la decisión final.", "El impedimento cubre a quien sustancia actuaciones, practica pruebas o adopta decisiones; además debe manifestarse por escrito motivado, no de manera verbal.", false], ["B", "declararse impedido, porque su primo es pariente dentro del cuarto grado de consanguinidad y tiene interés directo en la decisión.", "El art. 11, num. 1, de la Ley 1437 de 2011 y el art. 44 de la Ley 1952 de 2019 obligan al servidor a declararse impedido cuando él o sus parientes dentro del cuarto grado de consanguinidad tengan interés particular y directo en el asunto; el primo hermano es pariente en cuarto grado.", true], ["C", "continuar el trámite con especial rigor, porque el parentesco con primos no genera impedimento.", "Los primos hermanos son parientes en cuarto grado de consanguinidad, dentro del límite que fijan la Ley 1437 de 2011 y la Ley 1952 de 2019 para el impedimento.", false]]}, {"id": "EP-187", "niv": 3, "e": "Para tramitar el impedimento, usted debe", "f": "Ley 1437 de 2011, art. 12", "o": [["A", "enviar la actuación con escrito motivado a su superior dentro de los tres días siguientes a conocer la causal.", "El art. 12 de la Ley 1437 de 2011 dispone que, en caso de impedimento, el servidor enviará dentro de los tres días siguientes a su conocimiento la actuación con escrito motivado al superior o, si no lo tuviere, a la cabeza del sector.", true], ["B", "devolver el expediente al solicitante para que lo radique de nuevo cuando le asignen otro sustanciador.", "El trámite del impedimento es interno: la actuación se remite al superior; no se devuelve al solicitante.", false], ["C", "remitir la actuación a la Procuraduría General de la Nación dentro de los diez días siguientes, para que designe un funcionario ad hoc.", "El servidor remite primero a su superior; la Procuraduría solo interviene a falta de superior y de cabeza de sector, y diez días es el plazo para decidir, no para remitir.", false]]}, {"id": "EP-188", "niv": 3, "e": "Mientras su superior resuelve el impedimento, el trámite de la concesión", "f": "Ley 1437 de 2011, art. 12", "o": [["A", "sigue corriendo normalmente, porque el impedimento no afecta los términos de la actuación.", "La ley dispone lo contrario: la actuación se suspende desde la manifestación del impedimento hasta que se decida.", false], ["B", "se archiva, y el solicitante deberá presentar una nueva solicitud.", "El impedimento no da lugar al archivo; la autoridad que lo acepta determina a quién corresponde el asunto y ordena entregar el expediente.", false], ["C", "se suspende hasta la decisión, que el superior debe adoptar de plano dentro de los diez días siguientes al recibo.", "El art. 12 de la Ley 1437 de 2011 establece que la autoridad competente decide de plano el impedimento dentro de los diez días siguientes a su recibo y que la actuación se suspende desde la manifestación del impedimento hasta cuando se decida.", true]]}]}, {"comp": "atencion_procedimiento", "rol": "profesional", "tag": "Atención al ciudadano y procedimiento administrativo · Nivel profesional · Recursos contra los actos administrativos", "texto": "Usted es profesional universitario de la oficina jurídica de una gobernación. Revisa dos asuntos. En el primero, la secretaria de Educación departamental, en ejercicio de funciones propias de su cargo y no delegadas, expidió una resolución que negó a un docente el reconocimiento de una prima; el docente fue notificado personalmente y quiere controvertir la decisión. En el segundo, el gobernador firmó una resolución que negó a una fundación la solicitud de entrega en comodato de un inmueble del departamento. Ninguno de los dos asuntos tiene norma especial sobre recursos.", "items": [{"id": "AP-128", "niv": 1, "e": "Contra la resolución de la secretaria de Educación, los recursos de reposición y apelación pueden interponerse", "f": "Ley 1437 de 2011, art. 76", "o": [["A", "dentro del mes siguiente a la notificación, por ser un asunto laboral del docente.", "El CPACA no fija un plazo distinto según la materia. Sin norma especial, rige el plazo general de diez días.", false], ["B", "por escrito en la diligencia de notificación personal o dentro de los diez días siguientes a ella.", "El artículo 76 del CPACA establece que los recursos de reposición y apelación se interponen por escrito en la diligencia de notificación personal o dentro de los diez días siguientes a ella, o a la notificación por aviso o al vencimiento del término de publicación, según el caso.", true], ["C", "dentro de los cinco días siguientes a la notificación personal, por escrito o verbalmente.", "Cinco días es el plazo del recurso de queja. Para la reposición y la apelación el plazo es de diez días y el recurso se interpone por escrito.", false]]}, {"id": "AP-129", "niv": 2, "e": "Si el docente decide apelar, debe presentar el recurso", "f": "Ley 1437 de 2011, arts. 74, num. 2, y 76", "o": [["A", "ante la secretaria de Educación, directamente o en subsidio de la reposición, para que lo decida el gobernador.", "Los recursos se presentan ante el funcionario que dictó la decisión (art. 76 del CPACA), y la apelación, interpuesta directamente o como subsidiaria de la reposición, la resuelve el inmediato superior administrativo (art. 74, num. 2), que en este caso es el gobernador.", true], ["B", "directamente ante el gobernador, porque la apelación se presenta ante quien va a resolverla.", "El artículo 76 del CPACA dispone que los recursos se presentan ante el funcionario que dictó la decisión, salvo el de queja. La apelación la decide el superior, pero se presenta ante quien expidió el acto.", false], ["C", "ante la secretaria de Educación, para que lo decida la asamblea departamental como superior funcional de las secretarías.", "La asamblea departamental es una corporación político-administrativa que ejerce control político; no es superior jerárquico de los secretarios del gobernador ni resuelve recursos contra sus actos.", false]]}, {"id": "AP-130", "niv": 3, "e": "Contra la resolución firmada por el gobernador que negó la solicitud de la fundación procede", "f": "Ley 1437 de 2011, arts. 74 y 76", "o": [["A", "reposición y, en subsidio, apelación ante la asamblea departamental, que es obligatoria para acudir a la jurisdicción.", "La asamblea no resuelve recursos contra los actos del gobernador, y la ley establece que esas decisiones no son apelables.", false], ["B", "solo el recurso de reposición, porque esa decisión no es apelable.", "El artículo 74 del CPACA establece que no son apelables las decisiones de los representantes legales y jefes superiores de las entidades y organismos del nivel territorial, como el gobernador. Procede solo reposición, que no es obligatoria para acudir a la jurisdicción (art. 76).", true], ["C", "reposición ante el gobernador y, en subsidio, apelación ante el Ministerio del Interior.", "El Ministerio del Interior no es superior jerárquico del gobernador. Además, la ley excluye la apelación contra las decisiones de los jefes superiores de las entidades territoriales.", false]]}]}, {"comp": "atencion_procedimiento", "rol": "profesional", "tag": "Atención al ciudadano y procedimiento administrativo · Nivel profesional · Silencio administrativo negativo", "texto": "Usted es profesional universitario de la Secretaría Jurídica de una gobernación. El 10 de febrero de 2027 un exservidor radicó una solicitud de reconocimiento y pago de unas horas extra. Por un error de reparto, la solicitud no se tramitó y, a 20 de mayo de 2027, la gobernación no ha notificado ninguna decisión. El exservidor no ha presentado recursos ni demanda. Ninguna norma especial fija un plazo superior para decidir este tipo de solicitudes ni prevé silencio positivo. Su jefe le pide un concepto sobre la situación.", "items": [{"id": "AP-140", "niv": 1, "e": "Al haber pasado más de tres meses sin que se notifique decisión, la ley entiende que", "f": "Ley 1437 de 2011, art. 83", "o": [["A", "el exservidor desistió de su solicitud, por no haber insistido en ella.", "El desistimiento tácito se configura cuando el peticionario no atiende un requerimiento (art. 17 del CPACA). La inactividad de la entidad no se le atribuye al peticionario.", false], ["B", "la solicitud fue aceptada y la gobernación debe pagar lo pedido.", "El silencio positivo solo opera en los casos que prevé expresamente una norma especial (art. 84 del CPACA), y el caso aclara que no existe.", false], ["C", "la solicitud fue negada, por configurarse el silencio administrativo negativo.", "El artículo 83 del CPACA dispone que, transcurridos tres meses desde la presentación de una petición sin que se haya notificado decisión que la resuelva, se entiende que esta es negativa.", true]]}, {"id": "AP-141", "niv": 2, "e": "Frente al acto presunto, el exservidor puede presentar recursos", "f": "Ley 1437 de 2011, art. 76", "o": [["A", "en cualquier tiempo, salvo en el evento en que haya acudido ante el juez.", "El inciso 1 del artículo 76 del CPACA dispone que los recursos contra los actos presuntos pueden interponerse en cualquier tiempo, salvo que se haya acudido ante el juez.", true], ["B", "dentro de los diez días siguientes al vencimiento de los tres meses.", "El plazo de diez días se cuenta desde la notificación de un acto expreso. Como el acto presunto no se notifica, la ley permite recurrirlo en cualquier tiempo.", false], ["C", "dentro de los cinco días siguientes a la fecha en que conozca el silencio, mediante recurso de queja.", "La queja procede contra el rechazo de la apelación, no contra los actos presuntos.", false]]}, {"id": "AP-142", "niv": 3, "e": "Sobre las obligaciones de la gobernación después del silencio, el concepto debe señalar que", "f": "Ley 1437 de 2011, art. 83, inciso 3", "o": [["A", "perdió competencia para decidir, porque la ley ya le dio un sentido a la petición.", "El inciso 3 del artículo 83 del CPACA dispone lo contrario: el silencio no excusa a la autoridad del deber de decidir la petición inicial, salvo en dos eventos que aquí no han ocurrido.", false], ["B", "queda libre de responsabilidad, porque la ley le atribuyó un efecto jurídico a su silencio.", "La ocurrencia del silencio negativo no exime de responsabilidad a las autoridades (art. 83, inciso 3). Además, no resolver las peticiones en término es falta disciplinaria (art. 31 del CPACA).", false], ["C", "mantiene el deber de decidir la solicitud, con las excepciones legales.", "El inciso 3 del artículo 83 del CPACA establece que el silencio negativo no exime de responsabilidad ni excusa del deber de decidir la petición inicial. Las únicas excepciones son que el interesado haya recurrido el acto presunto o que, habiendo acudido a la jurisdicción, se haya notificado el auto admisorio de la demanda; ninguna ha ocurrido.", true]]}]}, {"comp": "atencion_procedimiento", "rol": "general", "tag": "Atención al ciudadano y procedimiento administrativo · Deberes de las autoridades en la atención al público", "texto": "La alcaldía de un municipio de quinta categoría revisa su protocolo de atención a la ciudadanía. Un borrador propone atender al público de lunes a jueves de 8:00 a. m. a 12:00 m. y de 2:00 a 4:00 p. m., y cerrar la puerta a las 4:00 p. m. dejando sin atender a quienes estén dentro. También propone no publicar la carta de trato digno porque nadie la ha solicitado y exigir la presentación personal ante notario de las peticiones de certificados laborales, aunque ninguna ley lo exige.", "items": [{"id": "AP-165", "niv": 1, "e": "Sobre el horario propuesto, que suma 24 horas semanales, el protocolo debe ajustarse para", "f": "Ley 1437 de 2011, art. 7, num. 2", "o": [["A", "garantizar atención personal al público durante al menos 30 horas a la semana.", "El CPACA fija un mínimo mayor: 40 horas semanales de atención personal.", false], ["B", "garantizar atención personal al público durante al menos 40 horas a la semana.", "El numeral 2 del artículo 7 del CPACA obliga a garantizar atención personal al público como mínimo durante cuarenta horas a la semana, distribuidas en horarios que satisfagan las necesidades del servicio.", true], ["C", "garantizar atención personal al público durante al menos 48 horas a la semana.", "La ley fija un mínimo de 40 horas. Nada impide ampliar la atención, pero 48 horas no es el mínimo legal.", false]]}, {"id": "AP-166", "niv": 1, "e": "Sobre las personas que estén dentro de la oficina a la hora del cierre, el protocolo debe disponer que", "f": "Ley 1437 de 2011, art. 7, num. 3", "o": [["A", "se atienda a todas las que ingresaron dentro del horario normal de atención.", "El numeral 3 del artículo 7 del CPACA impone el deber de atender a todas las personas que hayan ingresado a las oficinas dentro del horario normal de atención.", true], ["B", "se atienda solo a quienes vengan a radicar peticiones con términos próximos a vencer.", "La ley no permite seleccionar a quiénes atender: el deber cubre a todas las personas que ingresaron dentro del horario.", false], ["C", "se les entregue un turno preferente para que regresen al día siguiente.", "Diferir la atención de quienes ya ingresaron dentro del horario incumple el deber del numeral 3 del artículo 7.", false]]}, {"id": "AP-167", "niv": 2, "e": "En cuanto a la carta de trato digno, la alcaldía debe", "f": "Ley 1437 de 2011, art. 7, num. 5", "o": [["A", "expedirla al inicio de cada periodo de gobierno y actualizarla con el plan de desarrollo.", "La ley exige actualizarla anualmente, no cada cuatro años.", false], ["B", "expedirla cuando la Personería o un ciudadano la soliciten, y mantenerla en el archivo de la entidad.", "La carta de trato digno no depende de que alguien la solicite. La ley exige expedirla, hacerla visible y actualizarla anualmente.", false], ["C", "expedirla, hacerla visible y actualizarla cada año, con los derechos de los usuarios y los medios para garantizarlos.", "El numeral 5 del artículo 7 del CPACA obliga a expedir, hacer visible y actualizar anualmente una carta de trato digno que especifique los derechos de los usuarios y los medios dispuestos para garantizarlos.", true]]}, {"id": "AP-168", "niv": 2, "e": "Sobre la presentación personal ante notario de las peticiones de certificados laborales, el protocolo", "f": "Ley 1437 de 2011, art. 9, num. 3; Decreto Ley 019 de 2012, art. 5", "o": [["A", "no puede incluirla, porque está prohibido exigir presentación personal de peticiones cuando la ley no lo exige.", "El numeral 3 del artículo 9 del CPACA prohíbe a las autoridades exigir la presentación personal de peticiones, recursos o documentos cuando la ley no lo exija, y el artículo 5 del Decreto Ley 019 de 2012 proscribe las notas de presentación personal no ordenadas por la ley.", true], ["B", "puede incluirla, siempre que se trate de certificados que contengan datos personales del servidor.", "Proteger datos personales no justifica exigir presentación personal. Basta verificar la identidad o la autorización de quien pide el certificado.", false], ["C", "puede incluirla, si se aprueba mediante resolución del alcalde publicada en la página web.", "Las autoridades no pueden crear requisitos o formalidades adicionales a los previstos en la ley (art. 84 de la Constitución y art. 9, num. 5, del CPACA), aunque los adopten por acto administrativo.", false]]}]}, {"comp": "atencion_procedimiento", "rol": "profesional", "tag": "Atención al ciudadano y procedimiento administrativo · Nivel profesional · Información clasificada y reservada", "texto": "Usted es profesional universitario de la Secretaría General de una gobernación y debe proyectar respuestas a solicitudes de acceso a información. Una veeduría pide las hojas de vida completas de los contratistas de prestación de servicios de la secretaría; los documentos incluyen la formación académica y la experiencia, pero también la dirección de residencia, el teléfono personal y certificados médicos. Otro ciudadano solicita los documentos en los que los asesores del gobernador expusieron sus opiniones durante la discusión, aún no concluida, de un proyecto de ordenanza.", "items": [{"id": "AP-175", "niv": 2, "e": "La dirección de residencia, el teléfono personal y los certificados médicos de los contratistas son información", "f": "Ley 1712 de 2014, arts. 6, lit. c, y 18", "o": [["A", "pública reservada, porque su divulgación puede afectar la seguridad pública y la defensa nacional.", "La información reservada se exceptúa por daño a intereses
