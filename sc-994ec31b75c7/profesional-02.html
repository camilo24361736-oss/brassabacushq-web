 públicos (art. 19). Los datos personales de los contratistas se protegen por el daño a derechos de personas naturales (art. 18).", false], ["B", "pública clasificada, porque su divulgación puede dañar el derecho a la intimidad de las personas.", "El artículo 6, literal c, de la Ley 1712 de 2014 define la información clasificada como la que pertenece al ámbito particular y privado de una persona, y el artículo 18 permite negar su acceso cuando pueda dañar, entre otros, el derecho a la intimidad.", true], ["C", "pública sin restricción, porque quienes contratan con el Estado renuncian a su intimidad.", "Contratar con el Estado no suprime el derecho a la intimidad. La ley exige publicar datos como la formación y la experiencia, pero omite los que afecten la privacidad (art. 9, parágrafo 2).", false]]}, {"id": "AP-176", "niv": 3, "e": "Para responder la solicitud de la veeduría, la gobernación debe", "f": "Ley 1712 de 2014, arts. 18, 21 y 9, parágrafo 2", "o": [["A", "entregar una versión pública que proteja los datos personales y permita conocer la formación y la experiencia.", "El artículo 21 de la Ley 1712 de 2014 ordena hacer una versión pública que mantenga la reserva únicamente de la parte indispensable. La formación y la experiencia de los contratistas son información que la propia ley ordena publicar (art. 9, parágrafo 2).", true], ["B", "negar la entrega de las hojas de vida, porque contienen información clasificada.", "La presencia de datos clasificados no justifica negar todo el documento. El artículo 21 obliga a entregar una versión pública que reserve solo lo indispensable.", false], ["C", "entregar las hojas de vida completas, porque la veeduría ejerce control social sobre la contratación.", "La condición de veeduría no hace desaparecer la protección de los datos clasificados de terceros. Lo procedente es entregar la versión pública.", false]]}, {"id": "AP-177", "niv": 2, "e": "Los documentos con las opiniones de los asesores, emitidas durante la discusión del proyecto de ordenanza, son", "f": "Ley 1712 de 2014, art. 19, parágrafo", "o": [["A", "información pública clasificada, porque las opiniones pertenecen a la esfera personal de cada asesor.", "Las opiniones que forman parte del proceso deliberativo no se protegen por la intimidad del servidor (art. 18), sino por el interés público del artículo 19.", false], ["B", "información pública que debe entregarse sin restricción, porque los asesores son servidores públicos.", "El parágrafo del artículo 19 de la Ley 1712 de 2014 exceptúa expresamente estos documentos.", false], ["C", "información exceptuada por daño a los intereses públicos, por formar parte del proceso deliberativo.", "El parágrafo del artículo 19 de la Ley 1712 de 2014 exceptúa los documentos que contengan las opiniones o puntos de vista que formen parte del proceso deliberativo de los servidores públicos, dentro de la información exceptuada por daño a los intereses públicos.", true]]}]}, {"comp": "gestion_publica", "rol": "general", "tag": "Gestión pública, MIPG, contratación y documentos · Control interno: responsables (Ley 87 de 1993)", "texto": "Usted trabaja en la Secretaría de Hacienda de un municipio de quinta categoría. En una auditoría, la Oficina de Control Interno encontró que en la dependencia no se verificaban los soportes de los pagos antes de girarlos. En la reunión de cierre, el secretario de Hacienda sostiene que el control interno «es asunto exclusivo de la Oficina de Control Interno» y que su dependencia solo debe atender lo que esa oficina le pida. Para corregir la falla, propone además que la jefe de control interno firme como visto bueno cada orden de pago antes del giro.", "items": [{"id": "GP-110", "niv": 1, "e": "Según la Ley 87 de 1993, el establecimiento y desarrollo del sistema de control interno del municipio es responsabilidad", "f": "Ley 87 de 1993, arts. 3 y 6", "o": [["A", "de la jefe de la Oficina de Control Interno, por ser la encargada de evaluarlo.", "La oficina de control interno evalúa el sistema de forma independiente y recomienda mejoras (art. 3, lit. d), pero no es la responsable de establecerlo.", false], ["B", "del representante legal o máximo directivo, en este caso el alcalde.", "El artículo 6 de la Ley 87 de 1993 atribuye al representante legal o máximo directivo la responsabilidad de establecer y desarrollar el sistema de control interno; en el municipio, ese papel lo cumple el alcalde.", true], ["C", "del concejo municipal, como órgano de control político de la administración.", "El control político del concejo es distinto del control interno; la Ley 87 de 1993 no asigna al concejo el establecimiento del sistema de control interno de la alcaldía.", false]]}, {"id": "GP-111", "niv": 2, "e": "Frente a la afirmación del secretario de Hacienda, usted le recuerda que", "f": "Ley 87 de 1993, arts. 1, 3 (lit. c) y 6", "o": [["A", "la responsabilidad de los controles de su área recae en el Comité de Coordinación de Control Interno.", "El comité coordina el sistema al más alto nivel, pero no traslada a esa instancia la responsabilidad por los controles de cada dependencia, que la ley asigna a su jefe.", false], ["B", "tiene razón, porque los jefes de dependencia solo deben cumplir los planes de mejoramiento que fije la oficina.", "La ley concibe el control interno como intrínseco a las funciones de todos los cargos, en especial de quienes tienen mando; el jefe de dependencia no es un simple destinatario de los planes de la oficina.", false], ["C", "como jefe de dependencia, él también responde por la aplicación y la calidad de los controles de su área.", "El artículo 6 de la Ley 87 de 1993 extiende a los jefes de cada dependencia la responsabilidad por la aplicación de los métodos y procedimientos, y por la calidad y eficacia del control interno; el artículo 3, literal c, los hace responsables ante su jefe inmediato.", true]]}, {"id": "GP-112", "niv": 3, "e": "La propuesta de que la jefe de control interno dé visto bueno a cada orden de pago", "f": "Ley 87 de 1993, art. 12 y parágrafo", "o": [["A", "no procede, porque firmar cada pago comprometería la independencia que la ley exige a quien audita.", "El parágrafo del artículo 12 de la Ley 87 de 1993 prohíbe al jefe de control interno intervenir en los procedimientos administrativos con autorizaciones o refrendaciones; dar visto bueno a cada orden de pago sería una refrendación y le restaría independencia para evaluar ese mismo proceso.", true], ["B", "procede si el alcalde la delega por escrito y la jefe de control interno la acepta.", "La prohibición del parágrafo del artículo 12 de la Ley 87 de 1993 opera «en ningún caso», de modo que no se supera con una delegación ni con la aceptación de la jefe de control interno.", false], ["C", "procede, porque verificar los controles de los procesos financieros es una de sus funciones legales.", "Verificar los controles es una función de evaluación posterior e independiente; refrendar cada pago la convertiría en parte del procedimiento que luego debe evaluar, lo que la ley prohíbe.", false]]}]}, {"comp": "gestion_publica", "rol": "profesional", "tag": "Gestión pública, MIPG, contratación y documentos · Nivel profesional · Control interno: jefe de la oficina e informes", "texto": "Usted es profesional universitario de la Secretaría General de una gobernación. El gobernador inició su período el 1 de enero de 2028 y pregunta si puede designar de inmediato un nuevo jefe de la Oficina de Control Interno, pues quien ocupa el cargo fue designado por su antecesor a mitad del período anterior. Por otra parte, un diputado se queja de que en la página web de la gobernación solo aparece un informe de control interno por año y pide saber con qué frecuencia debe publicarse y qué valor tienen esos informes en las investigaciones que adelanten otras autoridades.", "items": [{"id": "GP-113", "niv": 3, "e": "Sobre la designación del jefe de control interno, usted le explica al gobernador que", "f": "Ley 87 de 1993, art. 11 (modificado por el art. 8 de la Ley 1474 de 2011)", "o": [["A", "la designación corresponde a la asamblea departamental, de terna enviada por el gobernador.", "La ley asigna la designación a la máxima autoridad administrativa de la entidad territorial, no a la corporación de elección popular.", false], ["B", "en el orden territorial lo designa la máxima autoridad administrativa por un período fijo de cuatro años, que inicia a mitad del período del gobernador.", "El artículo 11 de la Ley 87 de 1993, modificado por el artículo 8 de la Ley 1474 de 2011, dispone que en las entidades territoriales el jefe de control interno se designa por un período fijo de cuatro años, en la mitad del período del alcalde o gobernador; por eso el actual jefe no puede reemplazarse libremente al inicio del mandato.", true], ["C", "es un empleo de libre nombramiento y remoción en todos los órdenes, de modo que puede reemplazarlo desde el comienzo de su mandato con un nuevo acto de designación.", "La libre designación y remoción por el Presidente aplica a la rama ejecutiva del orden nacional; en lo territorial la ley fija un período de cuatro años desfasado del período del gobernador.", false]]}, {"id": "GP-114", "niv": 2, "e": "Frente a la queja del diputado, el informe de evaluación independiente del estado del sistema de control interno debe publicarse en la web de la gobernación", "f": "Ley 87 de 1993, art. 14 (art. 9 de la Ley 1474 de 2011, modificado por el art. 156 del Decreto Ley 2106 de 2019)", "o": [["A", "cada tres meses.", "La norma vigente no exige una publicación trimestral: el Decreto Ley 2106 de 2019 fijó para este informe una periodicidad semestral.", false], ["B", "cada seis meses.", "El artículo 14 de la Ley 87 de 1993 (que recoge el artículo 9 de la Ley 1474 de 2011), modificado por el artículo 156 del Decreto Ley 2106 de 2019, obliga al jefe de control interno a publicar cada seis meses en el sitio web un informe de evaluación independiente del estado del sistema de control interno, so pena de falta disciplinaria grave. La periodicidad cuatrimestral del antiguo «informe pormenorizado» ya no está vigente.", true], ["C", "una vez al año, con el informe de gestión.", "Publicar un solo informe anual, como ocurre en el caso, incumple la periodicidad semestral fijada por la norma.", false]]}, {"id": "GP-115", "niv": 3, "e": "Sobre el valor de los informes de los funcionarios de control interno, es correcto afirmar que", "f": "Ley 87 de 1993, art. 14 (texto modificado por el art. 156 del Decreto Ley 2106 de 2019)", "o": [["A", "tienen valor probatorio en procesos disciplinarios, administrativos, judiciales y fiscales cuando las autoridades pertinentes lo soliciten.", "El texto vigente del artículo 14 de la Ley 87 de 1993 (modificado por el Decreto Ley 2106 de 2019) reconoce a esos informes valor probatorio en procesos disciplinarios, administrativos, judiciales y fiscales cuando las autoridades lo pidan.", true], ["B", "solo tienen valor probatorio en procesos fiscales, porque la competencia disciplinaria pertenece a la oficina de control disciplinario interno.", "La norma no limita el valor probatorio a los procesos fiscales; lo extiende también a los disciplinarios, administrativos y judiciales.", false], ["C", "son documentos internos y reservados que solo pueden entregarse al gobernador.", "La misma norma ordena publicar el informe semestral en la web y reconoce valor probatorio a los informes; no son documentos reservados por naturaleza.", false]]}]}, {"comp": "gestion_publica", "rol": "profesional", "tag": "Gestión pública, MIPG, contratación y documentos · Nivel profesional · Presupuesto: reservas presupuestales y cuentas por pagar", "texto": "Usted es profesional universitario del área de presupuesto de un instituto departamental de tránsito, cuyo estatuto presupuestal reproduce las reglas del Decreto 111 de 1996. Al 31 de diciembre de 2027 analiza tres situaciones: (1) un contrato de mantenimiento de semáforos, firmado en octubre con registro presupuestal, del que falta ejecutar la mitad de las actividades, que terminarán en marzo; (2) un contrato de suministro de uniformes, cuyos bienes se recibieron a satisfacción el 20 de diciembre y aún no se han pagado; (3) un saldo del rubro de capacitación que nunca se comprometió.", "items": [{"id": "GP-142", "niv": 3, "e": "Para el contrato de mantenimiento de semáforos, al cierre de la vigencia el instituto debe constituir", "f": "Decreto 111 de 1996, art. 89", "o": [["A", "una vigencia futura, porque la ejecución termina en el año siguiente.", "Las vigencias futuras se autorizan antes de comprometer presupuestos de años siguientes; no son la figura de cierre para un compromiso ya adquirido con cargo a la vigencia que termina.", false], ["B", "una cuenta por pagar, porque el contrato tiene registro presupuestal.", "Tener registro presupuestal no convierte el compromiso en cuenta por pagar; estas corresponden a anticipos pactados y a bienes o servicios ya recibidos, lo que no ocurre con las actividades pendientes.", false], ["C", "una reserva presupuestal, porque es un compromiso legalmente contraído que no se ha cumplido.", "El artículo 89 del Decreto 111 de 1996 ordena constituir reservas presupuestales con los compromisos legalmente contraídos que al 31 de diciembre no se hayan cumplido, como las actividades de mantenimiento pendientes.", true]]}, {"id": "GP-143", "niv": 3, "e": "Para el contrato de suministro de uniformes, lo procedente es constituir", "f": "Decreto 111 de 1996, art. 89", "o": [["A", "una reserva presupuestal, porque el pago no se hizo antes del 31 de diciembre.", "La reserva se constituye con compromisos no cumplidos; aquí el contratista ya cumplió con la entrega y solo está pendiente el pago, lo que da lugar a una cuenta por pagar.", false], ["B", "una cuenta por pagar, porque los bienes ya se entregaron y solo falta el pago.", "El artículo 89 del Decreto 111 de 1996 ordena constituir al 31 de diciembre cuentas por pagar con las obligaciones correspondientes a anticipos pactados y a la entrega de bienes y servicios, como los uniformes recibidos.", true], ["C", "un nuevo compromiso con cargo al presupuesto del año siguiente.", "Crear un nuevo compromiso para una obligación ya adquirida y cumplida no corresponde; el Decreto 111 de 1996 prevé para este caso la cuenta por pagar.", false]]}, {"id": "GP-144", "niv": 2, "e": "Respecto del saldo no comprometido del rubro de capacitación,", "f": "Decreto 111 de 1996, arts. 14 y 89", "o": [["A", "la autorización de gasto expira y no podrá comprometerse en el año siguiente.", "Los artículos 14 y 89 del Decreto 111 de 1996 disponen que las apropiaciones son autorizaciones máximas de gasto para la vigencia y que, después del 31 de diciembre, expiran y no pueden comprometerse; los saldos no afectados caducan.", true], ["B", "se traslada automáticamente al mismo rubro del presupuesto del año siguiente.", "No existe traslado automático entre vigencias; la apropiación no comprometida expira y caduca al cierre.", false], ["C", "puede comprometerse hasta el 31 de marzo siguiente como reserva de apropiación.", "Solo pueden constituirse reservas con compromisos ya adquiridos; un saldo nunca comprometido no puede convertirse en reserva.", false]]}]}, {"comp": "gestion_publica", "rol": "profesional", "tag": "Gestión pública, MIPG, contratación y documentos · Nivel profesional · Contratación directa: causales y acto de justificación", "texto": "Usted es profesional universitario de la Dirección de Contratación de un instituto distrital de Bogotá. Este año el instituto necesita: celebrar con una universidad pública un contrato para dictar un diplomado de formación a sus servidores, actividad que guarda relación directa con el objeto de la universidad; y vincular, mediante contrato de prestación de servicios profesionales, a una abogada que apoye la defensa judicial durante seis meses, porque el personal de planta no alcanza para atender los procesos. El director le pide precisar los requisitos de cada contratación.", "items": [{"id": "GP-154", "niv": 3, "e": "El contrato con la universidad pública puede celebrarse por contratación directa porque", "f": "Ley 1150 de 2007, art. 2, num. 4, lit. c (modificado por el art. 92 de la Ley 1474 de 2011); Decreto 1082 de 2015, art. 2.2.1.2.1.4.4", "o": [["A", "su valor es inferior a la menor cuantía del instituto.", "Un valor inferior a la menor cuantía conduce, por regla general, a selección abreviada o a mínima cuantía, no a contratación directa; la causal aplicable aquí es la interadministrativa.", false], ["B", "las universidades públicas están excluidas del Estatuto General de Contratación en cualquier contrato.", "El régimen propio de contratación de la universidad no es lo que habilita al instituto a contratar directamente; la causal es el contrato interadministrativo con la condición de relación directa con el objeto de la ejecutora.", false], ["C", "es interadministrativo y sus obligaciones tienen relación directa con el objeto de la universidad.", "El literal c del numeral 4 del artículo 2 de la Ley 1150 de 2007, modificado por el artículo 92 de la Ley 1474 de 2011, permite la contratación directa de contratos interadministrativos siempre que las obligaciones tengan relación directa con el objeto de la entidad ejecutora.", true]]}, {"id": "GP-155", "niv": 1, "e": "Para contratar a la abogada, el instituto", "f": "Ley 1150 de 2007, art. 2, num. 4; Decreto 1082 de 2015, art. 2.2.1.2.1.4.9", "o": [["A", "debe convocar un concurso de méritos, porque la defensa judicial es una consultoría.", "El Decreto 1082 de 2015 define los servicios profesionales como los de naturaleza intelectual diferentes a los de consultoría, de modo que no se rigen por el concurso de méritos.", false], ["B", "debe adelantar una selección abreviada de menor cuantía con por lo menos tres cotizaciones de abogados.", "Los servicios profesionales y de apoyo a la gestión son causal de contratación directa; la norma aclara que no es necesario obtener varias ofertas.", false], ["C", "puede contratarla directamente, sin pedir varias ofertas, si verifica su idoneidad y deja constancia escrita.", "El artículo 2.2.1.2.1.4.9 del Decreto 1082 de 2015 permite contratar directamente los servicios profesionales con quien esté en capacidad de ejecutar el objeto, verificando su idoneidad o experiencia, sin obtener varias ofertas y dejando constancia escrita del ordenador del gasto.", true]]}, {"id": "GP-156", "niv": 3, "e": "Sobre el acto administrativo de justificación de la contratación directa, es correcto afirmar que", "f": "Decreto 1082 de 2015, arts. 2.2.1.2.1.4.1 y 2.2.1.2.1.4.4", "o": [["A", "es necesario en ambos casos, incluido el contrato de prestación de servicios profesionales.", "El Decreto 1082 de 2015 exceptúa expresamente del acto de justificación los contratos de prestación de servicios profesionales y de apoyo a la gestión.", false], ["B", "no se requiere para el contrato de la abogada, pero sí para el contrato con la universidad.", "El artículo 2.2.1.2.1.4.1 del Decreto 1082 de 2015 exige el acto de justificación en la contratación directa, salvo, entre otros, en los contratos de prestación de servicios profesionales y de apoyo a la gestión; los interadministrativos sí lo requieren (art. 2.2.1.2.1.4.4).", true], ["C", "no se requiere en ninguno de los dos casos, porque la contratación directa no exige justificación previa.", "La contratación directa sí exige, por regla general, un acto de justificación con la causal, el objeto, el presupuesto y el lugar de consulta de los estudios previos.", false]]}]}, {"comp": "gestion_publica", "rol": "general", "tag": "Gestión pública, MIPG, contratación y documentos · Contrato de prestación de servicios", "texto": "Usted trabaja en la Secretaría General de un municipio de cuarta categoría. La Secretaría de Desarrollo Social pide vincular mediante contrato de prestación de servicios a una trabajadora social para un programa de atención a personas mayores que durará cinco meses. En la planta hay dos trabajadoras sociales, pero ambas están dedicadas por completo a otro programa. La secretaria propone pactar el contrato por dos años «para no repetir el trámite», fijarle el mismo horario de los servidores de planta y reconocerle vacaciones remuneradas.", "items": [{"id": "GP-191", "niv": 2, "e": "Para celebrar este contrato con una persona natural, debe acreditarse que", "f": "Ley 80 de 1993, art. 32, num. 3", "o": [["A", "la actividad no puede realizarse con el personal de planta o requiere conocimientos especializados.", "El numeral 3 del artículo 32 de la Ley 80 de 1993 permite celebrar contratos de prestación de servicios con personas naturales solo cuando la actividad no puede realizarse con personal de planta o requiere conocimientos especializados.", true], ["B", "la trabajadora social no tiene vínculos previos con otra entidad pública.", "Haber tenido vínculos con otras entidades no es el presupuesto legal de este contrato; lo relevante es la insuficiencia de la planta o la necesidad de conocimientos especializados.", false], ["C", "el valor del contrato no supera la mínima cuantía del municipio.", "La procedencia de este contrato no depende de su cuantía; los servicios profesionales se contratan directamente con independencia del valor.", false]]}, {"id": "GP-192", "niv": 1, "e": "Sobre la duración propuesta por la secretaria, el contrato debe pactarse", "f": "Ley 80 de 1993, art. 32, num. 3", "o": [["A", "por el término estrictamente indispensable para ejecutar el programa.", "El numeral 3 del artículo 32 de la Ley 80 de 1993 ordena que los contratos de prestación de servicios se celebren por el término estrictamente indispensable; si el programa dura cinco meses, pactar dos años lo desconoce.", true], ["B", "por un plazo mínimo de un año, para garantizar la continuidad del servicio.", "La ley no fija un plazo mínimo; por el contrario, limita la duración a lo estrictamente indispensable.", false], ["C", "por el período que le resta al alcalde, por tratarse de un programa del plan de desarrollo.", "El período del alcalde no es el criterio legal; la duración depende de la necesidad concreta, que aquí es de cinco meses.", false]]}, {"id": "GP-193", "niv": 2, "e": "En cuanto a las vacaciones remuneradas propuestas, usted advierte que", "f": "Ley 80 de 1993, art. 32, num. 3", "o": [["A", "proceden si el contrato se celebra con una persona natural y no con una persona jurídica o un consorcio.", "La naturaleza del contratista no cambia la regla: los contratos de prestación de servicios no generan prestaciones sociales.", false], ["B", "los contratos de prestación de servicios no generan relación laboral ni prestaciones sociales.", "El numeral 3 del artículo 32 de la Ley 80 de 1993 dispone que estos contratos en ningún caso generan relación laboral ni prestaciones sociales; reconocer vacaciones y fijar horario de planta desnaturaliza el contrato.", true], ["C", "proceden de manera proporcional, siempre que el contrato supere seis meses.", "Las vacaciones son una prestación propia de la relación laboral; la duración del contrato no las hace procedentes en un contrato de prestación de servicios.", false]]}]}, {"comp": "gestion_publica", "rol": "profesional", "tag": "Gestión pública, MIPG, contratación y documentos · Nivel profesional · Gestión documental: eliminación de documentos", "texto": "Usted es profesional universitario responsable de gestión documental de una gobernación. La TRD convalidada señala que los comprobantes de la caja menor se eliminan después de cumplir su tiempo en el archivo central. El secretario general quiere eliminar 300 cajas este mes «para liberar espacio» y le pide el procedimiento. Al revisar, usted encuentra que la TRD de la gobernación todavía no ha sido inscrita en el Registro Único de Series Documentales (RUSD).", "items": [{"id": "GP-200", "niv": 3, "e": "Antes de eliminar, la gobernación debe", "f": "Acuerdo AGN 001 de 2024, art. 4.5.4, num. 1 (Acuerdo Único de la Función Archivística; deroga el Acuerdo 004 de 2019)", "o": [["A", "microfilmar o digitalizar todos los documentos que se van a eliminar.", "La reproducción técnica no es requisito general de la eliminación; si la TRD dispone eliminar, el procedimiento exige registro de la TRD, publicación del inventario y aprobación interna.", false], ["B", "obtener concepto favorable de la contraloría departamental sobre el contenido de cada una de las cajas.", "El procedimiento de eliminación del AGN no exige concepto de la contraloría; el requisito previo omitido en el caso es la inscripción de la TRD en el RUSD.", false], ["C", "acreditar que la TRD está inscrita en el Registro Único de Series Documentales (RUSD).", "El numeral 1 del artículo 4.5.4 del Acuerdo 001 de 2024 del AGN exige que, antes de adelantar la eliminación, la entidad acredite la inscripción de sus TRD o TVD en el Registro Único de Series Documentales. Esta regla, que antes estaba en el Acuerdo 004 de 2019, hoy está en el Acuerdo 001 de 2024, que derogó aquel.", true]]}, {"id": "GP-201", "niv": 3, "e": "Como requisito de la eliminación, el inventario de los documentos debe publicarse en el sitio web de la gobernación por", "f": "Acuerdo AGN 001 de 2024, art. 4.5.4, num. 2 (Acuerdo Único de la Función Archivística; deroga el Acuerdo 004 de 2019)", "o": [["A", "diez días hábiles.", "Diez días hábiles es inferior al término que fija el Acuerdo 001 de 2024 del AGN para que la ciudadanía conozca el inventario y formule observaciones.", false], ["B", "treinta días hábiles.", "Treinta días hábiles es el plazo de la entidad para pedir concepto técnico cuando recibe observaciones, no el término de publicación del inventario.", false], ["C", "sesenta días hábiles.", "El numeral 2 del artículo 4.5.4 del Acuerdo 001 de 2024 del AGN exige publicar en el sitio web, durante sesenta días hábiles, el inventario de los documentos que pueden eliminarse, para que los ciudadanos envíen observaciones. Esta regla, que antes estaba en el Acuerdo 004 de 2019, hoy está en el Acuerdo 001 de 2024, que derogó aquel.", true]]}, {"id": "GP-202", "niv": 3, "e": "Si durante la publicación un ciudadano presenta observaciones directamente ante la gobernación, esta debe", "f": "Acuerdo AGN 001 de 2024, art. 4.5.4, num. 3 (Acuerdo Único de la Función Archivística; deroga el Acuerdo 004 de 2019)", "o": [["A", "responder la observación como un derecho de petición y continuar con la eliminación al vencer el término de publicación, sin consultar a ninguna otra instancia técnica ni archivística.", "Responder al ciudadano no basta: el acuerdo exige pedir concepto técnico a la instancia archivística competente antes de decidir si se suspende la eliminación.", false], ["B", "pedir, dentro de los treinta días hábiles siguientes a su radicación, concepto técnico al consejo territorial de archivos o al AGN sobre si debe suspenderse la eliminación.", "El numeral 3 del artículo 4.5.4 del Acuerdo 001 de 2024 del AGN, que nombra expresamente a «los Consejos Territoriales de Archivos o al Archivo General de la Nación», da a la entidad treinta días hábiles desde la radicación de las observaciones para solicitar concepto técnico al consejo territorial de archivos o al AGN, con copia de las observaciones y de la propuesta de eliminación. Esta regla, que antes estaba en el Acuerdo 004 de 2019, hoy está en el Acuerdo 001 de 2024, que derogó aquel.", true], ["C", "suspender de manera definitiva la eliminación, porque cualquier observación ciudadana la impide.", "Las observaciones no suspenden automáticamente y para siempre el proceso; dan lugar a un concepto técnico sobre la pertinencia de suspenderlo.", false]]}]}, {"comp": "entidades_territoriales", "rol": "general", "tag": "Entidades territoriales, Bogotá D.C. y CAR · Juntas administradoras locales", "texto": "Usted es auxiliar administrativo de la Secretaría de Planeación de un municipio de primera categoría del Meta dividido en comunas y corregimientos. La Junta Administradora Local (JAL) de la Comuna 4 radicó varias solicitudes: quiere presentar al Concejo un proyecto de acuerdo sobre ferias comunitarias, pide información sobre las partidas presupuestales para la comuna antes de que el alcalde radique el presupuesto y pregunta cuántos cabildos abiertos debe celebrar.", "items": [{"id": "ET-120", "niv": 2, "e": "Sobre el proyecto de acuerdo de ferias comunitarias, usted informa a la JAL que", "f": "Ley 136 de 1994, art. 131, num. 1; Constitución Política, art. 318", "o": [["A", "puede presentarlo al Concejo municipal, siempre que se relacione con el objeto de sus funciones.", "El art. 131, numeral 1 de la Ley 136 de 1994 faculta a las JAL para presentar proyectos de acuerdo al Concejo relacionados con el objeto de sus funciones.", true], ["B", "no puede presentarlo, porque las JAL solo emiten conceptos y no tienen iniciativa normativa.", "Las JAL sí tienen iniciativa para presentar proyectos de acuerdo relacionados con sus funciones (art. 131, num. 1 de la Ley 136 de 1994).", false], ["C", "debe presentarlo por conducto del alcalde, único autorizado para radicar proyectos ante el Concejo.", "El alcalde no tiene iniciativa exclusiva en todos los asuntos; la ley reconoce iniciativa a las JAL en temas relacionados con sus funciones.", false]]}, {"id": "ET-121", "niv": 2, "e": "Frente a las partidas presupuestales de la comuna, a la JAL le corresponde", "f": "Ley 136 de 1994, art. 131, num. 8", "o": [["A", "esperar la aprobación del presupuesto por el Concejo y luego ejercer control político sobre su ejecución en la comuna, mediante citaciones a los secretarios del despacho municipal.", "La ley le asigna a la JAL una intervención previa (concepto) antes de que el proyecto llegue al Concejo, no solo un control posterior.", false], ["B", "rendir concepto sobre la conveniencia de las partidas antes de que el proyecto se presente al Concejo, para lo cual el alcalde debe suministrarle la información disponible.", "El art. 131, numeral 8 de la Ley 136 de 1994 asigna a las JAL rendir concepto sobre las partidas presupuestales antes de la presentación del proyecto al Concejo, y obliga al alcalde a brindar la información disponible.", true], ["C", "aprobar el presupuesto de la comuna una vez el Concejo apruebe el presupuesto general del municipio.", "En los municipios la JAL no aprueba el presupuesto; emite concepto previo sobre las partidas y distribuye partidas globales conforme al plan de desarrollo.", false]]}, {"id": "ET-122", "niv": 1, "e": "Sobre los cabildos abiertos, usted le indica a la JAL que debe celebrar", "f": "Ley 136 de 1994, art. 131, num. 12", "o": [["A", "los que convoque el alcalde, pues la JAL no puede convocarlos por iniciativa propia.", "La ley impone a la propia JAL el deber de celebrar cabildos abiertos y de convocar audiencias públicas.", false], ["B", "uno al año, coincidiendo con la discusión del plan de desarrollo.", "La ley fija un mínimo mayor: al menos dos cabildos abiertos por cada periodo de sesiones.", false], ["C", "al menos dos por periodo de sesiones.", "El art. 131, numeral 12 de la Ley 136 de 1994 ordena a las JAL celebrar al menos dos cabildos abiertos por periodo de sesiones.", true]]}]}, {"comp": "entidades_territoriales", "rol": "profesional", "tag": "Entidades territoriales, Bogotá D.C. y CAR · Nivel profesional · Sanción y objeción de ordenanzas", "texto": "Usted es profesional de la Oficina Jurídica de una gobernación de la región andina. La Asamblea aprobó una ordenanza de 64 artículos que expide el estatuto de participación ciudadana del departamento. El gobernador tiene reparos de conveniencia sobre el costo de algunas instancias y le pide un concepto sobre los plazos y efectos de una eventual objeción.", "items": [{"id": "ET-126", "niv": 2, "e": "Para devolver el proyecto con objeciones, el gobernador dispone de", "f": "Ley 2200 de 2022, art. 100", "o": [["A", "cinco días.", "Ese término aplica cuando el proyecto no tiene más de veinte artículos (art. 100 de la Ley 2200 de 2022).", false], ["B", "diez días.", "Diez días se otorgan para proyectos de veintiuno a cincuenta artículos; este tiene 64.", false], ["C", "hasta veinte días.", "El art. 100, numeral 3 de la Ley 2200 de 2022 otorga hasta veinte días cuando el proyecto tiene más de cincuenta artículos, como en este caso.", true]]}, {"id": "ET-127", "niv": 3, "e": "Si la Asamblea reconsidera el proyecto objetado por inconveniencia y lo aprueba por la mitad más uno de sus miembros, el gobernador", "f": "Ley 2200 de 2022, art. 100, parágrafo", "o": [["A", "debe sancionarlo y promulgarlo, sin poder presentar nuevas objeciones por inconveniencia.", "El parágrafo del art. 100 de la Ley 2200 de 2022 obliga al gobernador a sancionar, sin nuevas objeciones por inconveniencia, el proyecto reconsiderado y aprobado por la mitad más uno de los miembros.", true], ["B", "puede objetarlo de nuevo por inconveniencia, por una sola vez, si la votación no fue unánime.", "La ley no exige unanimidad: basta la mitad más uno de los miembros para que el gobernador quede obligado a sancionar sin nuevas objeciones por inconveniencia.", false], ["C", "puede enviarlo al Tribunal Administrativo para que decida definitivamente sobre su conveniencia.", "El juez administrativo decide sobre legalidad o constitucionalidad, no sobre conveniencia; aprobado por la mayoría exigida, el gobernador debe sancionar.", false]]}, {"id": "ET-128", "niv": 3, "e": "Si vence el término legal sin que el gobernador devuelva el proyecto con objeciones y aun así no lo sanciona, la consecuencia es que", "f": "Ley 2200 de 2022, art. 100", "o": [["A", "el proyecto queda sancionado tácitamente, sin necesidad de ningún acto adicional de publicación.", "La ley no consagra una sanción tácita automática; asigna al presidente de la Asamblea el deber de sancionarlo y publicarlo.", false], ["B", "el presidente de la Asamblea departamental procede a sancionarlo y publicarlo como ordenanza.", "El art. 100 de la Ley 2200 de 2022 dispone que, vencidos los términos sin objeciones, el gobernador debe sancionar y promulgar; si no lo hace, el presidente de la corporación lo sanciona y publica.", true], ["C", "el proyecto se archiva y debe presentarse de nuevo en el siguiente periodo de sesiones.", "El silencio del gobernador no archiva el proyecto; la ley prevé que debe sancionarse y, en su defecto, lo sanciona el presidente de la Asamblea.", false]]}]}, {"comp": "entidades_territoriales", "rol": "general", "tag": "Entidades territoriales, Bogotá D.C. y CAR · Corporaciones Autónomas Regionales: naturaleza y órganos", "texto": "Usted es profesional universitario de la Secretaría General de una corporación autónoma regional del Eje Cafetero. En la jornada de inducción, varios servidores nuevos preguntan cómo está gobernada la corporación, quién elige al director general y por cuánto tiempo, y qué órgano decide la ampliación de la planta de personal que propone la dirección para atender el aumento de solicitudes de permisos ambientales.", "items": [{"id": "ET-144", "niv": 1, "e": "Al explicar los órganos principales de dirección y administración de la corporación, usted señala que son", "f": "Ley 99 de 1993, arts. 23 y 24", "o": [["A", "la asamblea corporativa, el consejo directivo y el director general.", "El art. 24 de la Ley 99 de 1993 señala como órganos principales de dirección y administración de las CAR la asamblea corporativa, el consejo directivo y el director general.", true], ["B", "el consejo directivo, el revisor fiscal y la oficina de control interno.", "El revisor fiscal y la oficina de control interno son instancias de control, no órganos principales de dirección y administración.", false], ["C", "el Ministerio de Ambiente, la junta de gobernadores y el director general.", "El Ministerio orienta la política ambiental, pero no es órgano de dirección de la CAR, y no existe una «junta de gobernadores» como órgano previsto en el art. 24.", false]]}, {"id": "ET-145", "niv": 2, "e": "Sobre la designación del director general, usted precisa que lo designa", "f": "Ley 99 de 1993, art. 28 (modificado por el art. 1 de la Ley 1263 de 2008)", "o": [["A", "la asamblea corporativa, para un periodo de tres años, sin posibilidad de reelección.", "La designación corresponde al consejo directivo, el periodo es de cuatro años y la ley permite la reelección por una sola vez.", false], ["B", "el consejo directivo, para un periodo de cuatro años, y puede ser reelegido por una sola vez.", "El art. 28 de la Ley 99 de 1993 (modificado por el art. 1 de la Ley 1263 de 2008) dispone que el director general es designado por el consejo directivo para un periodo de cuatro años y puede ser reelegido por una sola vez.", true], ["C", "el Presidente de la República, de terna enviada por el consejo directivo, para un periodo de cuatro años.", "El director de una CAR no lo nombra el Presidente: lo designa el consejo directivo, en desarrollo de la autonomía de la corporación.", false]]}, {"id": "ET-146", "niv": 2, "e": "La decisión sobre la ampliación de la planta de personal propuesta por la dirección corresponde a", "f": "Ley 99 de 1993, arts. 25, 27, lit. b), y 29, nums. 3 y 8", "o": [["A", "el consejo directivo, a partir del proyecto que presente el director general.", "El art. 27, literal b) de la Ley 99 de 1993 asigna al consejo directivo determinar la planta de personal, y el art. 29, numeral 3 ordena al director presentarle los proyectos de planta.", true], ["B", "la asamblea corporativa, porque es el principal órgano de dirección de la corporación.", "Aunque es el principal órgano de dirección, sus funciones (elegir parte del consejo, aprobar informes y estatutos) no incluyen determinar la planta.", false], ["C", "el director general, porque nombra y remueve el personal de la corporación.", "Nombrar y remover el personal (art. 29, num. 8) es distinto de determinar la planta; el director presenta el proyecto, pero quien la determina es el consejo directivo.", false]]}]}, {"comp": "entidades_territoriales", "rol": "profesional", "tag": "Entidades territoriales, Bogotá D.C. y CAR · Nivel profesional · Funciones de las CAR", "texto": "Usted es profesional especializado de la Oficina Jurídica de una corporación autónoma regional de la costa Caribe. La dirección general estudia celebrar un convenio con una fundación ambiental sin ánimo de lucro para fortalecer la gestión en el territorio y pregunta si puede trasladarle, entre otras, la facultad de imponer sanciones por infracciones ambientales. Además, un alcalde de la jurisdicción solicita apoyo para incluir la educación ambiental en los colegios del municipio.", "items": [{"id": "ET-147", "niv": 2, "e": "Sobre trasladar a la fundación la facultad de imponer sanciones ambientales, usted conceptúa que", "f": "Ley 99 de 1993, art. 32", "o": [["A", "es viable si el consejo directivo aprueba la delegación y la fundación acredita idoneidad técnica.", "Aunque el consejo directivo puede delegar algunas funciones, la ley excluye expresamente la sancionatoria, sin importar la idoneidad de la entidad.", false], ["B", "es viable, siempre que la CAR conserve la decisión de los recursos de reposición contra las sanciones.", "Reservarse los recursos no salva la delegación: la facultad sancionatoria misma es indelegable (art. 32 de la Ley 99 de 1993).", false], ["C", "no es viable, porque la ley permite delegar ciertas funciones, pero la sancionatoria es indelegable.", "El art. 32 de la Ley 99 de 1993 permite al consejo directivo delegar funciones en entes públicos o entidades privadas sin ánimo de lucro, siempre que no impliquen atribuciones de autoridad, y dispone que la facultad sancionatoria es indelegable.", true]]}, {"id": "ET-148", "niv": 1, "e": "Para fundamentar el convenio, usted recuerda que en el área de su jurisdicción la corporación ejerce la función de", "f": "Ley 99 de 1993, arts. 23 y 31, num. 2", "o": [["A", "máxima autoridad ambiental, conforme a las normas superiores y las directrices del Ministerio.", "El art. 31, numeral 2 de la Ley 99 de 1993 atribuye a las CAR la función de máxima autoridad ambiental en el área de su jurisdicción, de acuerdo con las normas superiores y las directrices del Ministerio de Ambiente.", true], ["B", "autoridad ambiental subsidiaria, que actúa solo cuando los municipios no tienen capacidad técnica.", "La subsidiariedad describe el papel de las CAR frente a la gestión del riesgo (Ley 1523 de 2012), pero en materia ambiental la Ley 99 les asigna la máxima autoridad en su jurisdicción.", false], ["C", "órgano consultivo del gobernador en asuntos ambientales del departamento.", "Las CAR son entes autónomos (art. 23 de la Ley 99 de 1993) y no órganos consultivos del gobernador.", false]]}, {"id": "ET-149", "niv": 2, "e": "Frente a la solicitud del alcalde sobre educación ambiental, a la corporación le corresponde", "f": "Ley 99 de 1993, art. 31, num. 8", "o": [["A", "asumir directamente la educación ambiental formal en los colegios, porque es la autoridad ambiental del territorio.", "La CAR no presta el servicio educativo formal; su función es asesorar a las entidades territoriales en los planes de educación ambiental formal.", false], ["B", "asesorar al municipio en sus planes de educación ambiental formal y ejecutar programas de educación ambiental no formal.", "El art. 31, numeral 8 de la Ley 99 de 1993 asigna a las CAR asesorar a las entidades territoriales en planes de educación ambiental formal y ejecutar programas de educación ambiental no formal, conforme a la política nacional.", true], ["C", "abstenerse, porque la educación ambiental es competencia exclusiva del Ministerio de Educación y de las secretarías de educación.", "La Ley 99 de 1993 sí asigna a las CAR funciones en educación ambiental (art. 31, num. 8).", false]]}]}, {"comp": "entidades_territoriales", "rol": "profesional", "tag": "Entidades territoriales, Bogotá D.C. y CAR · Nivel profesional · Medidas preventivas ambientales", "texto": "Usted es profesional universitario de la Oficina de Control y Seguimiento de una corporación autónoma regional de Santander. En un recorrido de control, el equipo técnico sorprende a una ladrillera quemando llantas como combustible, con emisiones visibles sobre una vereda. El equipo impone en el sitio la suspensión de la actividad. Días después, el representante de la ladrillera radica un recurso de reposición contra la medida y alega que no tuvo intención de contaminar, pues desconocía la prohibición.", "items": [{"id": "ET-165", "niv": 2, "e": "Para formalizar la medida impuesta en el sitio, al tratarse de un caso de flagrancia, el equipo debía", "f": "Ley 1333 de 2009, art. 15", "o": [["A", "solicitar autorización previa del director general antes de suspender la actividad.", "La ley no exige autorización previa del director para imponer la medida en flagrancia.", false], ["B", "esperar a la apertura del procedimiento sancionatorio para imponerla mediante resolución motivada, notificada personalmente al infractor.", "En flagrancia la medida se impone en el lugar de los hechos y se deja constancia en un acta; no es necesario esperar la apertura del procedimiento.", false], ["C", "levantar un acta con los motivos, la autoridad que la impone, el lugar, la fecha y la hora, y la actividad sobre la que recae.", "El art. 15 de la Ley 1333 de 2009 dispone que en flagrancia se levanta un acta con los motivos que justifican la medida, la autoridad que la impone, lugar, fecha y hora, funcionario y persona, proyecto o actividad a la que se impone.", true]]}, {"id": "ET-166", "niv": 2, "e": "Frente al recurso de reposición presentado contra la medida preventiva, la corporación debe", "f": "Ley 1333 de 2009, art. 32", "o": [["A", "rechazarlo, porque contra las medidas preventivas no procede recurso alguno.", "El art. 32 de la Ley 1333 de 2009 dispone que las medidas preventivas son de ejecución inmediata, preventivas y transitorias, surten efectos inmediatos y contra ellas no procede recurso alguno.", true], ["B", "resolverlo dentro de los quince días siguientes, con efecto suspensivo sobre la medida.", "Contra las medidas preventivas no procede recurso, de modo que no hay término para resolverlo ni efecto suspensivo.", false], ["C", "tramitarlo como apelación ante el Ministerio de Ambiente, superior jerárquico de la corporación.", "Las CAR son entes autónomos sin superior jerárquico en el Ministerio, y además contra las medidas preventivas no procede recurso.", false]]}, {"id": "ET-167", "niv": 1, "e": "Frente al argumento de que la ladrillera no tuvo intención de contaminar, usted conceptúa que", "f": "Ley 1333 de 2009, art. 1, parágrafo, y art. 5, parágrafo 1 (modificados por la Ley 2387 de 2024)", "o": [["A", "corresponde a la corporación probar la intención de contaminar antes de continuar con el procedimiento.", "La ley invierte la carga: se presume la culpa o el dolo y el infractor debe desvirtuarla.", false], ["B", "el desconocimiento de la prohibición excluye la responsabilidad, por lo que debe archivarse la actuación.", "El desconocimiento de la norma no es causal para archivar; la culpa o el dolo se presumen y el infractor debe desvirtuarlos con pruebas.", false], ["C", "se presume la culpa o el dolo, y es el presunto infractor quien debe desvirtuar esa presunción.", "El parágrafo del art. 1 y el parágrafo 1 del art. 5 de la Ley 1333 de 2009 (modificados por la Ley 2387 de 2024) establecen la presunción de culpa o dolo del infractor, quien tiene la carga de la prueba para desvirtuarla.", true]]}]}, {"comp": "entidades_territoriales", "rol": "profesional", "tag": "Entidades territoriales, Bogotá D.C. y CAR · Nivel profesional · Declaratoria de calamidad pública", "texto": "Usted es profesional universitario de la Oficina de Planeación de un municipio de cuarta categoría del Tolima. Una avenida torrencial destruyó viviendas, un puente y parte del acueducto. El alcalde quiere declarar la situación de calamidad pública esta misma tarde, contratar de inmediato la rehabilitación del acueducto y saber hasta cuándo podría mantenerse el régimen especial antes de declarar el retorno a la normalidad.", "items": [{"id": "ET-180", "niv": 1, "e": "Para declarar la situación de calamidad pública, el alcalde debe contar con", "f": "Ley 1523 de 2012, art. 57", "o": [["A", "autorización previa del Concejo municipal mediante acuerdo.", "La ley no exige acuerdo del Concejo para la declaratoria; exige el concepto favorable del consejo municipal de gestión del riesgo.", false], ["B", "concepto previo favorable del consejo municipal de gestión del riesgo de desastres.", "El art. 57 de la Ley 1523 de 2012 dispone que los gobernadores y alcaldes, previo concepto favorable del respectivo consejo de gestión del riesgo, podrán declarar la situación de calamidad pública.", true], ["C", "aprobación de la Unidad Nacional para la Gestión del Riesgo de Desastres.", "La declaratoria de calamidad es competencia territorial; la UNGRD interviene en la declaratoria de desastre nacional, no aprueba las calamidades municipales.", false]]}, {"id": "ET-181", "niv": 3, "e": "Declarada la calamidad, los contratos para la rehabilitación del acueducto afectado se someten a", "f": "Ley 1523 de 2012, art. 66", "o": [["A", "los requisitos y formalidades de la contratación entre particulares, con las reglas especiales previstas para estas situaciones.", "El art. 66 de la Ley 1523 de 2012 dispone que los contratos de las entidades territoriales relacionados directamente con la respuesta, rehabilitación y reconstrucción de zonas declaradas en calamidad pública se someten a los requisitos de la contratación entre particulares, con sujeción al art. 13 de la Ley 1150 de 2007.", true], ["B", "la modalidad de licitación pública, por tratarse de un contrato de obra pública cuya cuantía supera la menor cuantía de la entidad territorial.", "La ley establece un régimen especial: los contratos de respuesta, rehabilitación y reconstrucción en zonas declaradas en calamidad siguen las reglas de la contratación entre particulares.", false], ["C", "la autorización previa del gobernador, conforme a las normas de tutela administrativa del departamento sobre los municipios.", "La ley no exige aprobación del gobernador; el régimen especial se aplica directamente por la entidad territorial.", false]]}, {"id": "ET-182", "niv": 3, "e": "Sobre el plazo para declarar el retorno a la normalidad, usted informa que la calamidad pública", "f": "Ley 1523 de 2012, art. 64, parágrafo", "o": [["A", "se mantiene hasta que termine la reconstrucción total de las obras afectadas, sin plazo máximo.", "La ley sí fija un término máximo para declarar el retorno a la normalidad.", false], ["B", "no puede exceder doce meses, prorrogables una vez por el mismo término previo concepto favorable del consejo.", "Doce meses es el término previsto para la declaratoria de situación de desastre, no para la calamidad pública.", false], ["C", "no puede exceder seis meses, prorrogables una vez por el mismo término previo concepto favorable del consejo.", "El parágrafo del art. 64 de la Ley 1523 de 2012 fija un máximo de seis meses para la calamidad pública (doce para el desastre), prorrogable una vez y hasta por el mismo término, previo concepto favorable del consejo respectivo.", true]]}]}, {"comp": "comportamental", "rol": "general", "tag": "Competencias comportamentales (Decreto 815 de 2018) · Orientación a resultados", "texto": "Usted es servidor de la Secretaría de Planeación de un municipio de cuarta categoría y tiene a cargo la meta del Plan de Desarrollo de responder 600 solicitudes de certificados de uso del suelo en el año. Al 30 de septiembre ha respondido 380 y, en promedio, tarda 18 días por solicitud, aunque el procedimiento interno fija un máximo de 10 días. Una de las causas del retraso es que el aplicativo de consulta cartográfica, indispensable para expedir los certificados, presenta fallas frecuentes que pueden durar varias horas.", "items": [{"id": "CO-107", "niv": 1, "e": "Ante el rezago en la meta anual, la conducta que mejor refleja la orientación a resultados es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Orientación a resultados)", "o": [["A", "dar prioridad a las solicitudes más sencillas para subir rápido el número de respuestas y dejar las complejas para el año siguiente.", "Mejora la cifra, pero sacrifica la oportunidad y la calidad en los casos complejos. La competencia exige cumplir con eficacia, calidad y oportunidad, no solo con el número.", false], ["B", "calcular cuántas solicitudes debe responder cada mes en el último trimestre y organizar su trabajo semanal con base en esa cifra.", "Refleja la competencia «Orientación a resultados» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en cumplir las funciones y los compromisos de la organización con eficacia, calidad y oportunidad. Refleja las conductas de asumir la responsabilidad por sus resultados y trabajar con objetivos claros y realistas: le faltan 220 solicitudes en tres meses, unas 74 por mes, y planear con esa cifra hace medible el esfuerzo.", true], ["C", "solicitar a su jefe que gestione la reducción de la meta anual y que se reconozca en el informe el efecto de las fallas del aplicativo.", "No asume la responsabilidad por el resultado: busca ajustar la meta antes de intentar cumplirla. La competencia pide trabajar con objetivos claros y obtener los resultados esperados.", false]]}, {"id": "CO-108", "niv": 2, "e": "Para medir y comprobar si el rezago se está corrigiendo, la conducta más acorde con la orientación a resultados es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Orientación a resultados)", "o": [["A", "revisar el avance al cierre del año, cuando la oficina de planeación solicita el informe anual de gestión del Plan de Desarrollo municipal vigente.", "La revisión llega cuando ya no hay tiempo de corregir. La competencia incluye evaluar de forma regular el grado de consecución de los objetivos.", false], ["B", "preguntar a los usuarios en ventanilla si perciben que los certificados están saliendo más rápido que antes.", "Recoger la percepción del usuario es útil para el servicio, pero no mide con precisión el avance frente a la meta ni frente al tiempo del procedimiento.", false], ["C", "llevar un registro semanal de solicitudes recibidas, respondidas y días de respuesta, y compararlo con la meta y con el plazo del procedimiento.", "Refleja la competencia «Orientación a resultados» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en cumplir las funciones y los compromisos de la organización con eficacia, calidad y oportunidad. Corresponde a diseñar y utilizar indicadores para medir y comprobar los resultados y a evaluar regularmente la consecución de los objetivos, tanto en cantidad como en oportunidad.", true]]}, {"id": "CO-109", "niv": 3, "e": "Frente a las fallas frecuentes del aplicativo cartográfico, la conducta que mejor refleja la orientación a resultados es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Orientación a resultados)", "o": [["A", "documentar las fallas con fecha y efecto en los tiempos, y proponer a su jefe un mecanismo alterno de consulta mientras se corrige el aplicativo.", "Refleja la competencia «Orientación a resultados» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en cumplir las funciones y los compromisos de la organización con eficacia, calidad y oportunidad. Reúne las conductas de adoptar medidas para minimizar riesgos y plantear estrategias para alcanzar los resultados: la evidencia permite gestionar la solución y la alternativa evita que el rezago crezca.", true], ["B", "reportar cada falla a la mesa de ayuda de sistemas y esperar la solución, pues el retraso no depende de su gestión.", "Reportar es necesario, pero se limita a esperar y no asume la responsabilidad por sus resultados ni adopta medidas para reducir el riesgo de incumplir.", false], ["C", "expedir los certificados de predios ya consultados con la información guardada de la última consulta, aunque pueda estar desactualizada.", "Gana tiempo, pero expone a la entidad a expedir certificados con información imprecisa. La competencia exige que los productos se enmarquen en las normas y estándares de calidad de la entidad.", false]]}]}, {"comp": "comportamental", "rol": "general", "tag": "Competencias comportamentales (Decreto 815 de 2018) · Compromiso con la organización", "texto": "Usted es servidor de la oficina de talento humano de un municipio de sexta categoría. Una ola invernal dejó a cientos de familias damnificadas y la alcaldía necesita apoyo de todas las dependencias para registrar a las familias afectadas durante el fin de semana y los días siguientes. Usted tiene a cargo la liquidación de la nómina, que debe quedar lista el jueves para pagarse el viernes. Mientras tanto, en redes sociales circulan publicaciones que afirman, sin pruebas, que la alcaldía no ha entregado ninguna ayuda.", "items": [{"id": "CO-119", "niv": 1, "e": "El coordinador de gestión del riesgo pide voluntarios para el registro del sábado y usted no tiene tareas urgentes ese día. La conducta que mejor refleja el compromiso con la organización es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Compromiso con la organización)", "o": [["A", "esperar a que la alcaldía expida una orden formal de apoyo, ya que la gestión del riesgo no hace parte de sus funciones.", "Prioriza la formalidad sobre una necesidad urgente de la organización. La competencia incluye apoyar a la entidad en situaciones difíciles.", false], ["B", "ofrecerse para apoyar el registro del sábado, porque la emergencia lo requiere, e informarlo a su jefe inmediato.", "Refleja la competencia «Compromiso con la organización» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en alinear el propio comportamiento con las necesidades, prioridades y metas de la organización. Corresponde a apoyar a la organización en situaciones difíciles y tomar la iniciativa de colaborar con otras áreas cuando se requiere, manteniendo informado a su jefe.", true], ["C", "recomendar que la alcaldía contrate personal temporal para el registro, pues los servidores de otras áreas no conocen el procedimiento.", "Plantea una alternativa, pero no se involucra en la necesidad de la organización y supone un tiempo y un costo que la emergencia no permite.", false]]}, {"id": "CO-120", "niv": 2, "e": "El lunes le piden dedicar toda la semana al registro de damnificados. La conducta más acorde con el compromiso con la organización es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Compromiso con la organización)", "o": [["A", "dedicarse por completo al registro durante la semana, pues atender la emergencia prima sobre cualquier trámite interno de la dependencia.", "Apoya la emergencia, pero descuida la nómina, cuyo pago también es una prioridad de la entidad. La conducta asociada pide colaborar sin descuidar las propias tareas.", false], ["B", "excusarse de apoyar el registro para no poner en riesgo la nómina y explicar que no tiene disponibilidad esa semana.", "Protege su tarea, pero no colabora con la organización en una situación difícil cuando sí podría hacerlo en parte de su tiempo.", false], ["C", "asegurar que la nómina quede liquidada el jueves y apoyar el registro en el tiempo restante, avisando a ambos.", "Refleja la competencia «Compromiso con la organización» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en alinear el propio comportamiento con las necesidades, prioridades y metas de la organización. Refleja la conducta de tomar la iniciativa de colaborar con otras áreas cuando se requiere, sin descuidar las propias tareas: atiende las dos prioridades de la organización.", true]]}, {"id": "CO-121", "niv": 3, "e": "Un vecino le pregunta a usted si es cierto lo que dicen las redes sobre las ayudas. La conducta que mejor refleja el compromiso con la organización es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Compromiso con la organización)", "o": [["A", "contarle lo que le consta sobre las entregas y orientarlo al reporte oficial de ayudas que publica la alcaldía.", "Refleja la competencia «Compromiso con la organización» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en alinear el propio comportamiento con las necesidades, prioridades y metas de la organización. Corresponde a demostrar sentido de pertenencia y apoyar a la organización en situaciones difíciles, sin asumir una vocería que no le corresponde: da información cierta y remite a la fuente oficial.", true], ["B", "decirle que prefiere no opinar sobre el tema y que esos asuntos los maneja directamente la oficina de prensa de la alcaldía.", "Es prudente, pero pierde la oportunidad de apoyar a la organización con información que conoce de primera mano y de orientar al ciudadano hacia la fuente oficial.", false], ["C", "publicar desde su cuenta personal fotos de las entregas para desmentir las críticas y defender la gestión de la alcaldía.", "Busca defender a la entidad, pero asume una vocería institucional que no le corresponde y puede difundir información sin el respaldo de los canales oficiales.", false]]}]}, {"comp": "comportamental", "rol": "general", "tag": "Competencias comportamentales (Decreto 815 de 2018) · Orientación al usuario y al ciudadano", "texto": "Usted atiende el chat y el correo de la Secretaría de Tránsito de un municipio de primera categoría. Recibe a diario decenas de consultas: muchas están mal planteadas, y cerca del 40 % se refiere a cómo solicitar un acuerdo de pago de multas. Hoy un ciudadano le escribe preguntando si una fotodetección que recibió puede anularse porque, según él, la señal no era visible; usted no conoce el criterio que aplica la entidad en esos casos.", "items": [{"id": "CO-131", "niv": 1, "e": "Cuando una consulta llega mal planteada, la conducta que mejor refleja la orientación al usuario y al ciudadano es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Orientación al usuario y al ciudadano)", "o": [["A", "responderle con la información general de todos los trámites de la secretaría para que él elija el que corresponde.", "Muestra disposición, pero traslada al ciudadano el trabajo de interpretar y no atiende su necesidad específica.", false], ["B", "hacerle preguntas puntuales antes de responder, para identificar con precisión qué información necesita.", "Refleja la competencia «Orientación al usuario y al ciudadano» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en dirigir las decisiones y acciones a satisfacer las necesidades e intereses de los usuarios internos y externos y de los ciudadanos, según las responsabilidades de la entidad. Corresponde a escuchar activamente y valorar las necesidades del ciudadano: aclarar la consulta permite dar una respuesta pertinente y veraz.", true], ["C", "enviarle el enlace de preguntas frecuentes de la página web para que identifique allí la respuesta que necesita.", "Informa, pero sin comprender la necesidad concreta del ciudadano, que puede no estar cubierta en las preguntas frecuentes.", false]]}, {"id": "CO-132", "niv": 3, "e": "Frente al alto volumen de consultas sobre acuerdos de pago, la conducta más acorde con la orientación al usuario y al ciudadano es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Orientación al usuario y al ciudadano)", "o": [["A", "responder cada consulta sobre acuerdos de pago con el enlace al acto administrativo que regula ese trámite.", "Responde, pero remite a un texto normativo que difícilmente resuelve la duda práctica del ciudadano, y no incorpora la necesidad detectada en la gestión de la entidad.", false], ["B", "remitir esas consultas al área de cobro para que sean sus servidores quienes respondan directamente a los ciudadanos.", "Traslada la carga a otra área sin aportar una solución que facilite el trámite a los ciudadanos.", false], ["C", "proponer, con base en las preguntas recibidas, que se publique una guía paso a paso del trámite en los canales de la entidad.", "Refleja la competencia «Orientación al usuario y al ciudadano» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en dirigir las decisiones y acciones a satisfacer las necesidades e intereses de los usuarios internos y externos y de los ciudadanos, según las responsabilidades de la entidad. Refleja la conducta de incorporar las necesidades de usuarios y ciudadanos en los proyectos institucionales con visión de servicio a mediano plazo: lo que observa en el chat se convierte en una mejora para todos.", true]]}, {"id": "CO-133", "niv": 2, "e": "Ante la pregunta sobre la posible anulación de la fotodetección, la conducta que mejor refleja la orientación al usuario y al ciudadano es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Orientación al usuario y al ciudadano)", "o": [["A", "indicarle que no tiene certeza sobre ese punto y explicarle cómo presentar su solicitud para que el área competente la estudie.", "Refleja la competencia «Orientación al usuario y al ciudadano» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en dirigir las decisiones y acciones a satisfacer las necesidades e intereses de los usuarios internos y externos y de los ciudadanos, según las responsabilidades de la entidad. Corresponde a informar con veracidad y atender de forma oportuna la necesidad: reconoce el límite de lo que sabe y le da la ruta concreta para obtener una respuesta de fondo.", true], ["B", "responderle que, por regla general, las fotodetecciones no se anulan por ese motivo.", "Pretende evitar expectativas, pero afirma algo que usted no conoce. También falta a la veracidad.", false], ["C", "decirle que en casos parecidos las fotodetecciones suelen anularse, para darle tranquilidad mientras presenta formalmente su solicitud.", "Busca tranquilizarlo, pero da una información que no le consta. La competencia exige informar con veracidad.", false]]}]}, {"comp": "comportamental", "rol": "general", "tag": "Competencias comportamentales (Decreto 815 de 2018) · Adaptación al cambio", "texto": "La alcaldía de un municipio de primera categoría adoptó un nuevo modelo de atención: desde el próximo mes, las solicitudes se recibirán únicamente por la ventanilla única virtual, y los servidores de la ventanilla presencial pasarán a orientar a los ciudadanos en el uso de computadores de autoservicio instalados en la sede. Usted lleva 12 años recibiendo documentos en la ventanilla presencial. Algunos compañeros están inconformes con el cambio y temen que los ciudadanos mayores no logren usar la plataforma.", "items": [{"id": "CO-143", "niv": 2, "e": "Ante el anuncio del nuevo modelo, la conducta que mejor refleja la adaptación al cambio es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Adaptación al cambio)", "o": [["A", "seguir recibiendo en papel los documentos de los adultos mayores que lo prefieran, aunque el nuevo modelo no lo contemple.", "Tiene intención de servicio, pero se aparta de la decisión institucional. La competencia pide apoyar las nuevas decisiones; la necesidad de los mayores se atiende acompañándolos en el autoservicio.", false], ["B", "aprender el manejo de la plataforma antes de la fecha de inicio y practicar con compañeros cómo orientar a los ciudadanos.", "Refleja la competencia «Adaptación al cambio» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en afrontar con flexibilidad las situaciones nuevas y manejar los cambios de forma positiva y constructiva. Corresponde a aceptar y adaptarse a las nuevas situaciones y cooperar activamente en la implementación de nuevas formas de trabajo.", true], ["C", "pedir traslado a una dependencia que mantenga la atención presencial, donde su experiencia sea mejor aprovechada.", "Evita el cambio en lugar de afrontarlo con flexibilidad.", false]]}, {"id": "CO-144", "niv": 1, "e": "Frente a la inconformidad de algunos compañeros, la conducta más acorde con la adaptación al cambio es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Adaptación al cambio)", "o": [["A", "unirse a la solicitud de aplazar la implementación hasta que todos se sientan preparados para el nuevo modelo.", "Comprende la preocupación, pero no apoya a la entidad en la nueva decisión y retrasa su implementación.", false], ["B", "evitar opinar sobre el cambio con sus compañeros para no generar tensiones en el grupo de trabajo.", "Es prudente, pero desaprovecha la oportunidad de ayudar a sus compañeros a adaptarse.", false], ["C", "compartirles lo que ha aprendido de la plataforma y mostrarles cómo puede facilitar su trabajo.", "Refleja la competencia «Adaptación al cambio» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en afrontar con flexibilidad las situaciones nuevas y manejar los cambios de forma positiva y constructiva. Refleja la conducta de promover al grupo para que se adapte a las nuevas condiciones.", true]]}, {"id": "CO-145", "niv": 3, "e": "En las primeras semanas la plataforma presenta fallas intermitentes. La conducta que mejor refleja la adaptación al cambio es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Adaptación al cambio)", "o": [["A", "suspender la orientación en los computadores de autoservicio y pedir a los ciudadanos que regresen cuando la plataforma funcione bien.", "Ante la dificultad abandona el nuevo modelo y deja sin atención a los ciudadanos.", false], ["B", "registrar las fallas, reportarlas por el canal definido y orientar a los ciudadanos con las alternativas dispuestas por la entidad.", "Refleja la competencia «Adaptación al cambio» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en afrontar con flexibilidad las situaciones nuevas y manejar los cambios de forma positiva y constructiva. Corresponde a responder al cambio con flexibilidad y cooperar activamente en la implementación de los nuevos procedimientos: aporta información para corregir y mantiene la atención.", true], ["C", "recibir de nuevo los documentos en papel mientras la plataforma se estabiliza, para no perjudicar a los ciudadanos.", "Su intención es proteger al ciudadano, pero revierte por su cuenta la decisión institucional en lugar de usar las alternativas dispuestas por la entidad.", false]]}]}, {"comp": "comportamental", "rol": "profesional", "tag": "Competencias comportamentales (Decreto 815 de 2018) · Nivel profesional · Comunicación efectiva", "texto": "Usted es profesional especializado de una secretaría distrital de Bogotá y coordinó un estudio técnico de movilidad en un barrio de la localidad de Kennedy. Debe presentar los resultados a la junta de acción comunal, cuyos integrantes no tienen formación técnica. Su jefe le escribió por correo: «Prepare un resumen del estudio para el Concejo», sin más detalles, y usted no sabe si se trata de un debate de control político o de una solicitud de información. Además, un ciudadano le escribe confundido, pues cree que el estudio recomienda cerrar una vía, cuando en realidad recomienda cambiar su sentido de circulación.", "items": [{"id": "CO-158", "niv": 1, "e": "Para presentar los resultados a la junta de acción comunal, la conducta que mejor refleja la comunicación efectiva es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 3, sustituido por el art. 1 del Decreto 815 de 2018 (nivel profesional: Comunicación efectiva)", "o": [["A", "explicar los resultados con mapas del barrio y ejemplos cotidianos, pues la junta no es experta en el tema.", "Refleja la competencia «Comunicación efectiva» (Decreto 1083 de 2015, art. 2.2.4.8, num. 3, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en comunicarse de forma efectiva y positiva con superiores, pares y ciudadanos, tanto por escrito como de manera verbal y gestual. Corresponde a utilizar los canales de comunicación con claridad, precisión y tono adecuado para el receptor, haciendo sencilla la comprensión.", true], ["B", "presentar el informe técnico completo con sus tablas y anexos, para garantizar el rigor de la información.", "Es riguroso, pero no se ajusta al receptor: un documento técnico sin adaptación dificulta la comprensión de la comunidad.", false], ["C", "entregar a cada integrante de la junta un resumen escrito del estudio y ofrecer resolver las dudas que tengan por correo.", "Facilita algo, pero renuncia a la explicación directa que la comunidad necesita y deja la comprensión a cada lector.", false]]}, {"id": "CO-159", "niv": 3, "e": "Frente al correo de su jefe, la conducta más acorde con la comunicación efectiva es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 3, sustituido por el art. 1 del Decreto 815 de 2018 (nivel profesional: Comunicación efectiva)", "o": [["A", "releer el correo y sus anexos y, si aún tiene dudas, preguntar a su jefe el propósito y la extensión.", "Refleja la competencia «Comunicación efectiva» (Decreto 1083 de 2015, art. 2.2.4.8, num. 3, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en comunicarse de forma efectiva y positiva con superiores, pares y ciudadanos, tanto por escrito como de manera verbal y gestual. Refleja la conducta de mantener una lectura atenta para comprender mejor los mensajes recibidos antes de producir la respuesta.", true], ["B", "usar el mismo formato del último resumen que envió al Concejo, ya que ese documento fue bien recibido.", "Ahorra tiempo, pero supone que el propósito es el mismo sin haber comprendido el mensaje recibido.", false], ["C", "preparar un resumen extenso que cubra todos los aspectos del estudio, de modo que sirva para cualquier propósito.", "Intenta cubrir todo, pero un texto que no responde a un propósito definido pierde claridad y eficacia.", false]]}, {"id": "CO-160", "niv": 2, "e": "Para responder al ciudadano confundido, la conducta que mejor refleja la comunicación efectiva es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 3, sustituido por el art. 1 del Decreto 815 de 2018 (nivel profesional: Comunicación efectiva)", "o": [["A", "invitarlo a la próxima reunión de socialización del estudio, donde podrá resolver su inquietud en persona.", "Ofrece un espacio útil, pero aplaza una aclaración que puede hacer de inmediato y por escrito.", false], ["B", "responderle señalando con claridad la recomendación del estudio y explicándole la diferencia con un ejemplo de su calle.", "Refleja la competencia «Comunicación efectiva» (Decreto 1083 de 2015, art. 2.2.4.8, num. 3, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en comunicarse de forma efectiva y positiva con superiores, pares y ciudadanos, tanto por escrito como de manera verbal y gestual. Corresponde a responder cada comunicación con claridad y precisión, de modo que el mensaje sea comprensible para quien lo recibe.", true], ["C", "reenviarle el estudio completo con la indicación de que la respuesta a su inquietud se encuentra en el capítulo de recomendaciones.", "Remite la información, pero no aclara el malentendido ni facilita la comprensión.", false]]}]}, {"comp": "comportamental", "rol": "profesional", "tag": "Competencias comportamentales (Decreto 815 de 2018) · Nivel profesional · Instrumentación de decisiones", "texto": "Usted es profesional universitario de una entidad distrital de cultura de Bogotá y, dentro de sus funciones, debe decidir en qué orden recibirán tres localidades la itinerancia de un programa de fomento a la lectura. La entidad cuenta con datos de asistencia a bibliotecas y de oferta cultural por localidad. Los gestores culturales de las tres localidades han pedido conocer cómo se tomará la decisión. Una vez iniciada la itinerancia, la asistencia en la primera localidad resultó menor a la esperada.", "items": [{"id": "CO-170", "niv": 1, "e": "Para definir el orden de las localidades, la conducta que mejor refleja la instrumentación de decisiones es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 3, sustituido por el art. 1 del Decreto 815 de 2018 (nivel profesional: Instrumentación de decisiones)", "o": [["A", "definir el orden según una encuesta rápida en las redes sociales de la entidad sobre dónde prefieren el programa.", "Consulta a la ciudadanía, pero con un mecanismo poco riguroso que no asegura información representativa.", false], ["B", "asignar el primer turno a la localidad cuyo alcalde local ha insistido más en recibir el programa.", "Decide por la presión recibida y no por información válida, lo que afecta la transparencia.", false], ["C", "basar la decisión en los datos de asistencia y oferta cultural registrados por la entidad para cada localidad.", "Refleja la competencia «Instrumentación de decisiones» (Decreto 1083 de 2015, art. 2.2.4.8, num. 3, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en decidir los asuntos de los que se es responsable con criterios de economía, eficacia, eficiencia y transparencia. Corresponde a adoptar decisiones con base en información válida y rigurosa.", true]]}, {"id": "CO-171", "niv": 3, "e": "Frente a la solicitud de los gestores culturales, la conducta más acorde con la instrumentación de decisiones es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 3, sustituido por el art. 1 del Decreto 815 de 2018 (nivel profesional: Instrumentación de decisiones)", "o": [["A", "pedirles que acuerden entre ellos el orden de las localidades y acoger lo que decidan.", "Delega una decisión que le corresponde por sus funciones y renuncia a criterios objetivos.", false], ["B", "reunirse con ellos, presentarles los criterios y los datos usados y escuchar si aportan información que cambie el análisis.", "Refleja la competencia «Instrumentación de decisiones» (Decreto 1083 de 2015, art. 2.2.4.8, num. 3, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en decidir los asuntos de los que se es responsable con criterios de economía, eficacia, eficiencia y transparencia. Refleja la conducta de manejar criterios objetivos para analizar la materia a decidir con las personas involucradas, con transparencia.", true], ["C", "comunicarles la decisión final sin detallar los criterios, para evitar discusiones que retrasen el programa.", "Ahorra tiempo, pero sacrifica la transparencia y no analiza la materia con las personas involucradas.", false]]}, {"id": "CO-172", "niv": 2, "e": "Ante la baja asistencia en la primera localidad, la conducta que mejor refleja la instrumentación de decisiones es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 3, sustituido por el art. 1 del Decreto 815 de 2018 (nivel profesional: Instrumentación de decisiones)", "o": [["A", "reconocer en su informe el resultado, analizar sus causas y proponer ajustes para las siguientes rondas.", "Refleja la competencia «Instrumentación de decisiones» (Decreto 1083 de 2015, art. 2.2.4.8, num. 3, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en decidir los asuntos de los que se es responsable con criterios de economía, eficacia, eficiencia y transparencia. Corresponde a asumir los efectos de sus decisiones: reconoce el resultado y lo usa para mejorar las decisiones siguientes.", true], ["B", "explicar en el informe que la baja asistencia se debió a la escasa difusión que hizo la alcaldía local.", "Puede ser una causa, pero atribuir el resultado a otros sin análisis no refleja la conducta de asumir los efectos de las propias decisiones.", false], ["C", "esperar a que termine la itinerancia en las tres localidades para evaluar si se trató de un problema puntual de esa localidad.", "Aplaza el análisis y pierde la oportunidad de ajustar a tiempo las rondas siguientes.", false]]}]}];
const CFG = {"titulo": "Simulacro 2 · Nivel profesional · CNSC Empleo Público", "modo": "simulacro", "minutos": 200, "componentes": {"estado_constitucion": "Estado y Constitución", "empleo_publico": "Empleo público, carrera y régimen disciplinario", "atencion_procedimiento": "Atención al ciudadano y procedimiento administrativo", "gestion_publica": "Gestión pública, MIPG, contratación y documentos", "entidades_territoriales": "Entidades territoriales, Bogotá D.C. y CAR", "comportamental": "Competencias comportamentales (Decreto 815 de 2018)"}, "niveles": {"1": "Básico", "2": "Intermedio", "3": "Avanzado"}, "roles": {"general": "Todos los niveles", "asistencial": "Nivel asistencial", "tecnico": "Nivel técnico", "profesional": "Nivel profesional"}, "clave": "profesional-02.html"};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY = 'sim-cnsc:' + CFG.clave;
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}
function save(){try{localStorage.setItem(KEY, JSON.stringify(ST))}catch(e){}}
let ST = load();
ST.r = ST.r || {};
