os previos cuando la causal es la urgencia manifiesta, de modo que su ausencia no vicia el contrato por ese solo hecho.", false], ["C", "el decreto que declaró la urgencia hace las veces de acto de justificación y no es obligatorio elaborar estudios previos.", "El artículo 2.2.1.2.1.4.2 del Decreto 1082 de 2015 dispone que, cuando la causal es la urgencia manifiesta, el acto que la declara hace las veces de acto de justificación y la entidad no está obligada a elaborar estudios y documentos previos.", true]]}, {"id": "GP-159", "niv": 3, "e": "Inmediatamente después de celebrado el contrato, la alcaldía debe", "f": "Ley 80 de 1993, art. 43", "o": [["A", "remitir el contrato al concejo municipal para su aprobación, como requisito para poder pagarlo.", "La ley no somete los contratos de urgencia a aprobación del concejo; el control previsto es el del órgano de control fiscal.", false], ["B", "publicar un aviso de convocatoria en el SECOP para que otros interesados presenten ofertas.", "En la contratación directa no se expide aviso de convocatoria (Decreto 1082 de 2015) y, en todo caso, el contrato ya está celebrado; lo que exige la ley es el envío al control fiscal.", false], ["C", "enviar el contrato, el decreto de urgencia y el expediente al órgano de control fiscal competente.", "El artículo 43 de la Ley 80 de 1993 ordena enviar, inmediatamente después de celebrados, los contratos de urgencia, el acto que la declaró y el expediente con sus antecedentes al funcionario u organismo que ejerce el control fiscal, que se pronuncia dentro de los dos meses siguientes.", true]]}]}, {"comp": "gestion_publica", "rol": "tecnico", "tag": "Gestión pública, MIPG, contratación y documentos · Nivel técnico · Contratación: Plan Anual de Adquisiciones y SECOP", "texto": "Usted es técnico administrativo de la Secretaría General de una gobernación y le corresponde publicar el Plan Anual de Adquisiciones y apoyar la publicación de los procesos contractuales. Un jefe de dependencia le pide retirar del plan la compra de mobiliario, «porque la gobernación ya quedó obligada a hacerla por haberla incluido». Otro jefe le pide publicar en el SECOP los documentos de un proceso «al final, cuando se liquide el contrato, para no hacer el trabajo dos veces».", "items": [{"id": "GP-170", "niv": 2, "e": "Frente a la inquietud del primer jefe, usted le aclara que el Plan Anual de Adquisiciones", "f": "Decreto 1082 de 2015, art. 2.2.1.1.1.4.2", "o": [["A", "obliga a adquirir todo lo incluido, salvo que la asamblea autorice excluirlo.", "El reglamento dispone lo contrario: el plan no obliga a adelantar las adquisiciones que enumera, y su ajuste no requiere autorización de la asamblea.", false], ["B", "no obliga a la entidad a adelantar los procesos de adquisición que enumera.", "El artículo 2.2.1.1.1.4.2 del Decreto 1082 de 2015 dispone que el Plan Anual de Adquisiciones no obliga a las entidades estatales a efectuar los procesos de adquisición que en él se enumeran.", true], ["C", "solo es obligatorio respecto de las compras que superen la menor cuantía.", "El plan no obliga a adquirir ningún bien incluido, cualquiera sea su cuantía; la no obligatoriedad es general.", false]]}, {"id": "GP-171", "niv": 1, "e": "El Plan Anual de Adquisiciones y sus actualizaciones deben publicarse", "f": "Decreto 1082 de 2015, art. 2.2.1.1.1.4.3", "o": [["A", "en la página web de la entidad y en el SECOP.", "El artículo 2.2.1.1.1.4.3 del Decreto 1082 de 2015 ordena publicar el Plan Anual de Adquisiciones y sus actualizaciones en la página web de la entidad y en el SECOP.", true], ["B", "en la gaceta departamental, una vez lo apruebe la asamblea.", "El plan no requiere aprobación de la asamblea ni se publica en la gaceta; se publica en la web de la entidad y en el SECOP.", false], ["C", "solo en la cartelera de la Secretaría General, para consulta de los proveedores.", "Una cartelera física no cumple el deber de publicidad electrónica que exige el reglamento: página web y SECOP.", false]]}, {"id": "GP-172", "niv": 2, "e": "En cuanto a la solicitud del segundo jefe, los documentos y actos del proceso de contratación deben publicarse en el SECOP", "f": "Decreto 1082 de 2015, art. 2.2.1.1.1.7.1", "o": [["A", "dentro de los tres días siguientes a su expedición.", "El artículo 2.2.1.1.1.7.1 del Decreto 1082 de 2015 obliga a publicar en el SECOP los documentos y actos administrativos del proceso de contratación dentro de los tres días siguientes a su expedición.", true], ["B", "al finalizar el proceso, en un solo cargue junto con la liquidación.", "Publicar todo al final impide que los interesados conozcan y controviertan los documentos en tiempo; el reglamento fija un plazo corto desde la expedición de cada documento.", false], ["C", "dentro de los diez días siguientes a su expedición.", "El plazo reglamentario es de tres días siguientes a la expedición, no de diez.", false]]}]}, {"comp": "gestion_publica", "rol": "tecnico", "tag": "Gestión pública, MIPG, contratación y documentos · Nivel técnico · Gestión documental: principios de organización", "texto": "Usted es técnico de archivo de un instituto departamental de cultura. Al organizar el archivo central encuentra cajas mezcladas, con documentos de la Oficina Jurídica revueltos con los de Tesorería, y expedientes cuyos folios fueron reordenados alfabéticamente por un contratista anterior, sin respetar la secuencia en que se produjeron los trámites. El director le pregunta, además, si es obligatorio llevar inventarios y tener un programa de gestión documental.", "items": [{"id": "GP-206", "niv": 2, "e": "Al separar los documentos según la dependencia que los produjo, usted aplica el principio de", "f": "Ley 594 de 2000, art. 11", "o": [["A", "orden original.", "El orden original se refiere a la secuencia interna en que se produjeron los documentos dentro de cada agrupación, no a la dependencia productora.", false], ["B", "selección documental.", "La selección es una forma de disposición final que se aplica a ciertas series según la TRD; no es el principio que ordena agrupar por dependencia productora.", false], ["C", "procedencia.", "El artículo 11 de la Ley 594 de 2000 ordena organizar los archivos según los principios de procedencia y orden original; la procedencia exige mantener juntos los documentos de una misma oficina productora.", true]]}, {"id": "GP-207", "niv": 2, "e": "Al restablecer dentro de cada expediente la secuencia en que se produjeron los documentos, usted aplica el principio de", "f": "Ley 594 de 2000, art. 11", "o": [["A", "conservación total.", "La conservación total es una disposición final que fija la TRD, no un principio de organización interna del expediente.", false], ["B", "orden original.", "El artículo 11 de la Ley 594 de 2000 incluye el principio de orden original, que exige conservar la secuencia en que se produjeron los documentos al tramitar el asunto; el orden alfabético impuesto por el contratista lo desconoce.", true], ["C", "procedencia.", "La procedencia determina a qué oficina pertenecen los documentos, pero no el orden interno de los folios en cada expediente.", false]]}, {"id": "GP-208", "niv": 1, "e": "Respecto de las preguntas del director, usted le informa que las entidades públicas", "f": "Ley 594 de 2000, arts. 21 y 26", "o": [["A", "deben elaborar inventarios solo cuando van a eliminar documentos.", "La obligación de inventariar es general, para controlar los documentos en sus diferentes fases, y no se limita a la eliminación.", false], ["B", "pueden prescindir del programa de gestión documental si tienen una TRD convalidada.", "La TRD y el programa de gestión documental son obligaciones distintas; tener una no exime de la otra.", false], ["C", "deben elaborar inventarios documentales y programas de gestión documental.", "El artículo 26 de la Ley 594 de 2000 obliga a elaborar inventarios de los documentos que se producen, y el artículo 21 exige elaborar programas de gestión documental.", true]]}]}, {"comp": "entidades_territoriales", "rol": "general", "tag": "Entidades territoriales, Bogotá D.C. y CAR · Funciones del alcalde", "texto": "Usted es profesional de la Secretaría de Gobierno de un municipio de tercera categoría del Huila. Se acercan las fiestas patronales y la Policía reporta riñas asociadas al consumo de licor en el parque principal. El alcalde, que además prepara su informe de gestión al Concejo, le pide revisar qué medidas puede adoptar y si puede encargar a la secretaria de Gobierno algunas de sus funciones para atender la temporada.", "items": [{"id": "ET-113", "niv": 1, "e": "Para controlar las riñas durante las fiestas, el alcalde puede, como medida de orden público,", "f": "Ley 136 de 1994, arts. 84 y 91, lit. b), num. 2 (modificado por el art. 29 de la Ley 1551 de 2012)", "o": [["A", "restringir o prohibir el expendio y consumo de bebidas embriagantes, de conformidad con la ley.", "El art. 91, literal b), numeral 2 de la Ley 136 de 1994 (modificado por la Ley 1551 de 2012) faculta al alcalde para restringir o prohibir el expendio y consumo de bebidas embriagantes, entre otras medidas, para mantener o restablecer el orden público.", true], ["B", "tramitar un acuerdo ante el Concejo, porque esas restricciones son de reserva de la corporación.", "La restricción del expendio y consumo de bebidas embriagantes por razones de orden público es una medida que la ley atribuye directamente al alcalde.", false], ["C", "solicitar al gobernador que expida la medida, porque el orden público municipal le corresponde al departamento.", "El alcalde es la primera autoridad de policía del municipio y conserva el orden público en su jurisdicción (arts. 84 y 91 de la Ley 136 de 1994); no necesita que el gobernador expida la medida.", false]]}, {"id": "ET-114", "niv": 1, "e": "Sobre la posibilidad de que la secretaria de Gobierno ejerza algunas funciones del alcalde, usted le indica que", "f": "Ley 136 de 1994, art. 92 (modificado por el art. 30 de la Ley 1551 de 2012)", "o": [["A", "las funciones del alcalde son indelegables, por tratarse de un cargo de elección popular sujeto al voto programático del elegido.", "La ley sí permite la delegación de funciones del alcalde en sus secretarios, con la única excepción de las que tengan prohibición legal expresa.", false], ["B", "puede delegar en los secretarios de la alcaldía las funciones a su cargo, salvo aquellas que tengan prohibición legal expresa.", "El art. 92 de la Ley 136 de 1994 (modificado por el art. 30 de la Ley 1551 de 2012) permite delegar en secretarios y jefes de departamento administrativo las funciones del alcalde, excepto las que tengan prohibición legal expresa.", true], ["C", "la delegación solo procede con autorización previa del Concejo para cada función.", "El art. 92 de la Ley 136 de 1994 no exige autorización previa del Concejo para delegar en los secretarios; esa autorización se requiere para delegar en subalternos o JAL funciones distintas de las previstas en la ley (art. 32, num. 4).", false]]}, {"id": "ET-115", "niv": 2, "e": "Respecto del informe de gestión al Concejo, el alcalde debe presentar informes generales sobre su administración", "f": "Ley 136 de 1994, art. 91, lit. a), num. 4 (modificado por el art. 29 de la Ley 1551 de 2012)", "o": [["A", "solo cuando el Concejo lo cite a debate de control político.", "El alcalde no puede ser citado por el Concejo para declaraciones orales (art. 32, num. 2), y el informe general es un deber periódico, no una respuesta a citaciones.", false], ["B", "en la primera sesión ordinaria de cada año.", "El art. 91, literal a), numeral 4 de la Ley 136 de 1994 (modificado por la Ley 1551 de 2012) ordena al alcalde presentar informes generales sobre su administración en la primera sesión ordinaria de cada año.", true], ["C", "al terminar el último periodo de sesiones ordinarias del año, junto con el presupuesto.", "La norma ubica el informe general en la primera sesión ordinaria del año, no al final de la vigencia.", false]]}]}, {"comp": "entidades_territoriales", "rol": "general", "tag": "Entidades territoriales, Bogotá D.C. y CAR · Estructura administrativa de Bogotá (Acuerdo 257 de 2006)", "texto": "Usted ingresó como profesional universitario al Departamento Administrativo del Servicio Civil Distrital (DASCD) y participa en la inducción de nuevos servidores. Debe explicar cómo está organizada la administración distrital, qué es un sector administrativo de coordinación y qué instancia articula las entidades de cada sector. Varios asistentes trabajan en establecimientos públicos adscritos a secretarías y en alcaldías locales.", "items": [{"id": "ET-141", "niv": 1, "e": "Al explicar la estructura administrativa del Distrito, usted señala que comprende", "f": "Acuerdo 257 de 2006 del Concejo de Bogotá, art. 21", "o": [["A", "el nivel nacional, el nivel departamental de Cundinamarca y el nivel distrital.", "Esa no es la estructura de la administración distrital; Bogotá tiene régimen especial y su administración se organiza en tres sectores propios.", false], ["B", "las secretarías de despacho y las empresas de servicios públicos, que son las únicas entidades con autonomía.", "La estructura incluye también departamentos administrativos, unidades administrativas especiales, establecimientos públicos y las localidades, entre otros.", false], ["C", "el sector central, el sector descentralizado funcionalmente o por servicios y el sector de las localidades.", "El art. 21 del Acuerdo 257 de 2006 establece que la estructura administrativa de Bogotá comprende el sector central, el sector descentralizado funcionalmente o por servicios y el sector de las localidades.", true]]}, {"id": "ET-142", "niv": 2, "e": "Un sector administrativo de coordinación está conformado por", "f": "Acuerdo 257 de 2006 del Concejo de Bogotá, art. 36", "o": [["A", "las secretarías y departamentos administrativos y las entidades descentralizadas adscritas o vinculadas a una secretaría cabeza de sector.", "El art. 36 del Acuerdo 257 de 2006 dispone que los sectores administrativos de coordinación se conforman por secretarías y departamentos administrativos y por las entidades descentralizadas adscritas o vinculadas a una secretaría cabeza de sector.", true], ["B", "los consejos superiores de la administración distrital y las comisiones intersectoriales que crea el alcalde mayor para coordinar la gestión de varios sectores.", "Esas son instancias del sistema de coordinación, no los integrantes de un sector administrativo.", false], ["C", "todas las entidades que tienen sede en una misma localidad, bajo la coordinación del alcalde local.", "La agrupación por territorio corresponde a las localidades; los sectores se organizan por áreas especializadas de la gestión.", false]]}, {"id": "ET-143", "niv": 2, "e": "La instancia que articula la formulación de políticas y el seguimiento dentro de cada sector, integrada por la cabeza del sector y los directivos de sus entidades, es", "f": "Acuerdo 257 de 2006 del Concejo de Bogotá, arts. 34, 37 y 38; reglamentación distrital del MIPG (Decreto 1499 de 2017)", "o": [["A", "el Comité Sectorial de Gestión y Desempeño (antes llamado Comité Sectorial de Desarrollo Administrativo).", "El art. 37 del Acuerdo 257 de 2006 prevé en cada sector un comité integrado por la secretaría cabeza de sector y los directores o gerentes de sus entidades, que denominó Comité Sectorial de Desarrollo Administrativo; con la adopción del Modelo Integrado de Planeación y Gestión (Decreto 1499 de 2017) la reglamentación distrital lo denomina Comité Sectorial de Gestión y Desempeño.", true], ["B", "el Consejo de Gobierno Distrital, presidido por el alcalde mayor e integrado por los secretarios cabeza de sector.", "El Consejo de Gobierno Distrital es la máxima instancia de formulación de políticas para toda la administración (art. 34), no la instancia propia de cada sector.", false], ["C", "la comisión intersectorial que el alcalde mayor cree para coordinar las entidades del respectivo sector.", "Las comisiones intersectoriales coordinan funciones que comprometen entidades de diferentes sectores (art. 38 del Acuerdo 257 de 2006).", false]]}]}, {"comp": "entidades_territoriales", "rol": "tecnico", "tag": "Entidades territoriales, Bogotá D.C. y CAR · Nivel técnico · Aprovechamiento forestal", "texto": "Usted es técnico operativo de la oficina territorial de una corporación autónoma regional del Huila. Atiende tres solicitudes: una familia campesina quiere cortar algunos árboles de su finca para reparar su vivienda y pregunta si luego puede vender la madera sobrante; un propietario pide autorización para talar por una sola vez un bosque en un área donde los estudios técnicos muestran mejor aptitud de uso del suelo diferente al forestal; y un vecino solicita que se autorice talar unos árboles del predio colindante porque, según él, amenazan con caer sobre su casa.", "items": [{"id": "ET-159", "niv": 1, "e": "A la familia campesina, usted le explica que el aprovechamiento doméstico", "f": "Decreto 1076 de 2015, art. 2.2.1.1.3.1", "o": [["A", "permite vender la madera sobrante si se paga la tasa compensatoria correspondiente.", "El pago de tasas no habilita la comercialización: los productos del aprovechamiento doméstico no pueden venderse.", false], ["B", "es exclusivamente para satisfacer necesidades vitales domésticas y sus productos no pueden comercializarse.", "El art. 2.2.1.1.3.1, literal c) del Decreto 1076 de 2015 define los aprovechamientos domésticos como los que se efectúan exclusivamente para satisfacer necesidades vitales domésticas, sin que se puedan comercializar sus productos.", true], ["C", "permite vender la madera a otros campesinos de la misma vereda, siempre que se trate de pequeñas cantidades para uso familiar.", "La prohibición de comercializar no admite excepción por la cercanía del comprador.", false]]}, {"id": "ET-160", "niv": 2, "e": "La solicitud del propietario que quiere talar por una vez el bosque por la aptitud del suelo corresponde a un aprovechamiento", "f": "Decreto 1076 de 2015, art. 2.2.1.1.3.1", "o": [["A", "persistente, que lo obliga a conservar el rendimiento normal del bosque mediante técnicas silvícolas que permitan su renovación posterior.", "El persistente se hace con criterios de sostenibilidad y obligación de renovar el bosque; aquí se trata de una intervención por una sola vez por aptitud del suelo.", false], ["B", "doméstico, porque lo solicita el propietario del predio.", "La clase no depende de quién lo solicita, sino de su finalidad; el doméstico es solo para necesidades vitales domésticas.", false], ["C", "único, que puede incluir la obligación de dejar limpio el terreno, pero no la de renovar o conservar el bosque.", "El art. 2.2.1.1.3.1, literal a) del Decreto 1076 de 2015 define los aprovechamientos únicos como los que se hacen por una sola vez donde los estudios muestran mejor aptitud de uso diferente al forestal, y precisa que pueden incluir la obligación de dejar limpio el terreno, pero no la de renovar o conservar el bosque.", true]]}, {"id": "ET-161", "niv": 3, "e": "Frente a la solicitud del vecino sobre los árboles del predio colindante, la corporación debe", "f": "Decreto 1076 de 2015, art. 2.2.1.1.9.2", "o": [["A", "autorizar la tala de inmediato, porque se trata de una situación de riesgo que da trámite prioritario.", "El trámite prioritario aplica a la solicitud del propietario; cuando la presenta un tercero alegando daño o peligro, se requiere primero la decisión de la autoridad que resuelve el litigio.", false], ["B", "otorgar la autorización solo previa decisión de la autoridad competente para conocer el litigio entre los vecinos.", "El art. 2.2.1.1.9.2 del Decreto 1076 de 2015 dispone que, si la solicitud la presenta una persona distinta del propietario alegando daño o peligro por árboles de predios vecinos, solo se autoriza la tala previa decisión de la autoridad competente para conocer esa clase de litigios.", true], ["C", "rechazar la solicitud, porque solo el propietario puede pedir la tala de árboles ubicados en su predio.", "La norma no impone un rechazo de plano: admite la autorización, condicionada a la decisión previa de la autoridad que resuelve el conflicto.", false]]}]}, {"comp": "comportamental", "rol": "general", "tag": "Competencias comportamentales (Decreto 815 de 2018) · Aprendizaje continuo", "texto": "Usted trabaja en la ventanilla de trámites ambientales de una corporación autónoma regional del oriente del país. Cada vez más usuarios preguntan cómo radicar en línea sus solicitudes de concesión de aguas a través de una plataforma nacional de trámites ambientales, que usted conoce poco. Además, el mes pasado entró en vigencia una norma nacional que modificó algunos requisitos de un permiso que se tramita en su ventanilla, pero la lista de chequeo interna todavía no se ha actualizado. Usted participa en un grupo virtual informal de servidores de ventanilla de varias corporaciones, donde se comparten dudas prácticas sobre el uso de la plataforma.", "items": [{"id": "CO-104", "niv": 1, "e": "Para orientar a los usuarios sobre la radicación en línea, la conducta que mejor refleja el aprendizaje continuo es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Aprendizaje continuo)", "o": [["A", "remitir a los usuarios a la mesa de ayuda de la plataforma mientras la corporación decide si capacitará al personal de ventanilla.", "Traslada la necesidad al usuario y espera una decisión institucional. La competencia pide actualizarse por iniciativa propia para mantener la efectividad de la atención.", false], ["B", "aprender el proceso con cada caso, pidiendo a los usuarios que ya radicaron que le cuenten qué pasos siguieron.", "Aprende de una fuente que no garantiza exactitud: la experiencia de cada usuario puede contener errores. La conducta asociada exige información confiable.", false], ["C", "estudiar los manuales oficiales de la plataforma y practicar la radicación, ya que así podrá orientar bien a los usuarios.", "Refleja la competencia «Aprendizaje continuo» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en identificar, incorporar y aplicar conocimientos nuevos sobre normas, tecnologías y métodos de trabajo para mantener vigente la efectividad de las propias prácticas. Corresponde a gestionar sus propias fuentes de información confiable y mantener sus competencias actualizadas según los cambios que exige la administración: los materiales oficiales son la fuente adecuada.", true]]}, {"id": "CO-105", "niv": 3, "e": "Frente a la norma nacional que cambió los requisitos del permiso, la conducta más coherente con el aprendizaje continuo es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Aprendizaje continuo)", "o": [["A", "consultar el texto oficial de la norma y advertir a su jefe y a sus compañeros las diferencias frente a la lista de chequeo para que se actualice.", "Refleja la competencia «Aprendizaje continuo» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en identificar, incorporar y aplicar conocimientos nuevos sobre normas, tecnologías y métodos de trabajo para mantener vigente la efectividad de las propias prácticas. Reúne dos conductas asociadas: mantener actualizadas las competencias con base en las regulaciones vigentes, consultadas en fuente oficial, y compartir ese saber con los compañeros para que la práctica de toda la ventanilla se ajuste por el conducto institucional.", true], ["B", "seguir aplicando la lista de chequeo vigente hasta que la oficina jurídica emita una circular, para no generar criterios distintos entre ventanillas.", "Evita criterios dispares, pero ignora un cambio normativo que ya conoce y no lo pone en conocimiento de nadie. La competencia exige incorporar las regulaciones vigentes y compartir ese saber para que la práctica se actualice.", false], ["C", "aplicar desde ya a los usuarios su interpretación de los cambios, con base en el resumen que le envió un colega de otra corporación.", "Se apoya en una fuente secundaria sin consultar el texto oficial, y aplica por su cuenta un criterio que no comparte con su equipo ni queda reflejado en la lista de chequeo institucional.", false]]}, {"id": "CO-106", "niv": 2, "e": "Respecto del grupo virtual de servidores de ventanilla de otras corporaciones, la conducta más acorde con el aprendizaje continuo es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Aprendizaje continuo)", "o": [["A", "salir del grupo y concentrarse en los cursos formales de la corporación, que son la fuente avalada por la entidad.", "La capacitación formal es útil, pero la competencia también valora los flujos informales de interaprendizaje entre colegas como medio para nivelar conocimientos.", false], ["B", "leer los mensajes del grupo sin intervenir, para no difundir prácticas de trabajo que la corporación todavía no ha revisado ni aprobado.", "Aprovecha parte de la información, pero renuncia a compartir sus saberes. Las dudas son prácticas sobre la plataforma, no criterios reservados, y la competencia incluye aportar al interaprendizaje.", false], ["C", "participar en el grupo aportando las soluciones prácticas que ha encontrado y contrastándolas con las de otras corporaciones.", "Refleja la competencia «Aprendizaje continuo» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en identificar, incorporar y aplicar conocimientos nuevos sobre normas, tecnologías y métodos de trabajo para mantener vigente la efectividad de las propias prácticas. Refleja la conducta de participar en espacios informativos y de interaprendizaje, compartiendo saberes y aprendiendo de colegas habilidades diferenciales sobre el uso de la plataforma.", true]]}]}, {"comp": "comportamental", "rol": "general", "tag": "Competencias comportamentales (Decreto 815 de 2018) · Orientación al usuario y al ciudadano", "texto": "Usted trabaja en el punto de atención de una entidad distrital de Bogotá que tramita permisos para el aprovechamiento económico del espacio público. Esta semana llega un comerciante molesto porque ha venido tres veces y en cada visita le han dado información distinta sobre su trámite. También atiende a un vendedor que no sabe leer ni escribir y necesita diligenciar el formulario de solicitud. Además, varios usuarios se quejan de demoras que se originan en la visita técnica, a cargo de otra dependencia de la entidad.", "items": [{"id": "CO-116", "niv": 2, "e": "Ante el comerciante molesto por la información contradictoria, la conducta que mejor refleja la orientación al usuario y al ciudadano es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Orientación al usuario y al ciudadano)", "o": [["A", "ofrecerle disculpas en nombre de la entidad y orientarlo a radicar una queja para que su caso quede registrado.", "Reconocer la falla y orientar la queja es válido, pero deja sin resolver la necesidad concreta: saber en qué va su trámite.", false], ["B", "escucharlo sin interrumpir, revisar en el sistema el estado real del trámite y darle una respuesta precisa sobre lo que falta.", "Refleja la competencia «Orientación al usuario y al ciudadano» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en dirigir las decisiones y acciones a satisfacer las necesidades e intereses de los usuarios internos y externos y de los ciudadanos, según las responsabilidades de la entidad. Corresponde a escuchar activamente e informar con veracidad, y a atender de forma oportuna las necesidades del usuario: resuelve la causa de su molestia con información verificada.", true], ["C", "remitirlo al coordinador del punto de atención, quien tiene acceso a todos los trámites y puede darle una respuesta definitiva.", "Prolonga la atención y suma otro intermediario, cuando usted puede verificar el estado del trámite. No atiende la necesidad de forma oportuna.", false]]}, {"id": "CO-117", "niv": 1, "e": "Para atender al vendedor que no sabe leer ni escribir, la conducta más acorde con la orientación al usuario y al ciudadano es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Orientación al usuario y al ciudadano)", "o": [["A", "leerle el formulario, diligenciarlo con los datos que él le dicte y leerle lo escrito antes de que firme o ponga su huella.", "Refleja la competencia «Orientación al usuario y al ciudadano» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en dirigir las decisiones y acciones a satisfacer las necesidades e intereses de los usuarios internos y externos y de los ciudadanos, según las responsabilidades de la entidad. Refleja la conducta de aplicar la no estigmatización y la no discriminación generando espacios incluyentes: adapta la atención a la condición del usuario y asegura que conozca lo que suscribe.", true], ["B", "pedirle que regrese acompañado de alguien de su confianza que sepa leer, para que lo ayude a diligenciar y revisar el formulario con tranquilidad.", "Le impone una carga adicional y aplaza su trámite. La competencia pide adecuar la atención a las condiciones del ciudadano.", false], ["C", "entregarle el formulario y marcar con resaltador los campos que debe llenar la persona que lo ayude.", "Muestra disposición, pero no resuelve la necesidad: el usuario sigue dependiendo de un tercero para hacer su solicitud.", false]]}, {"id": "CO-118", "niv": 3, "e": "Frente a las quejas por demoras originadas en la visita técnica de otra dependencia, la conducta que mejor refleja la orientación al usuario y al ciudadano es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Orientación al usuario y al ciudadano)", "o": [["A", "explicar a cada usuario que la demora es responsabilidad de la otra dependencia y darle el teléfono de esa oficina.", "Informa, pero se desentiende del problema y traslada al usuario la gestión interna. La competencia reconoce la interdependencia entre áreas.", false], ["B", "informar al usuario en qué etapa está su trámite y enviar a la dependencia de visitas un reporte de los casos represados con sus fechas.", "Refleja la competencia «Orientación al usuario y al ciudadano» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en dirigir las decisiones y acciones a satisfacer las necesidades e intereses de los usuarios internos y externos y de los ciudadanos, según las responsabilidades de la entidad. Reúne las conductas de reconocer la interdependencia entre su trabajo y el de otros y de informar con veracidad: da al usuario información real y alerta a quien puede resolver el represamiento.", true], ["C", "comprometerse con cada usuario a que la visita técnica de su trámite se realizará esta misma semana.", "Busca tranquilizar, pero promete algo que no controla. La competencia exige informar con veracidad.", false]]}]}, {"comp": "comportamental", "rol": "general", "tag": "Competencias comportamentales (Decreto 815 de 2018) · Orientación a resultados", "texto": "Usted trabaja en la Secretaría de Infraestructura de una gobernación y apoya el seguimiento de 15 convenios con municipios para construir vías terciarias en placa huella. Su jefe le pidió visitar todas las obras en los próximos dos meses; el vehículo asignado solo está disponible dos días por semana. En una de las visitas, el alcalde le pide que en el informe registre la obra como terminada para poder liquidar el convenio antes de fin de año, aunque usted verificó que falta cerca del 5 % de la obra, que según él se terminará en enero.", "items": [{"id": "CO-128", "niv": 1, "e": "Para planear las visitas, la conducta que mejor refleja la orientación a resultados es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Orientación a resultados)", "o": [["A", "visitar primero los municipios más cercanos a la capital, para avanzar rápido en el número de visitas realizadas.", "Prioriza la cantidad y la comodidad sobre el riesgo. No orienta el esfuerzo a los convenios donde el seguimiento es más necesario.", false], ["B", "programar las 15 visitas dentro del primer mes para tener margen, aunque el vehículo solo esté disponible dos días por semana.", "El plan no es realista frente a los recursos: con dos días semanales de vehículo, difícilmente se cumple en un mes y el cronograma se rompería.", false], ["C", "programar las visitas según los días reales de disponibilidad del vehículo y dar prioridad a los convenios con mayor atraso.", "Refleja la competencia «Orientación a resultados» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en cumplir las funciones y los compromisos de la organización con eficacia, calidad y oportunidad. Responde a trabajar con objetivos claros y realistas y adoptar medidas para minimizar riesgos: el plan se ajusta a los recursos disponibles y atiende primero donde hay más riesgo.", true]]}, {"id": "CO-129", "niv": 2, "e": "Para hacer seguimiento al avance de los convenios durante los dos meses, la conducta más acorde con la orientación a resultados es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Orientación a resultados)", "o": [["A", "actualizar cada semana una matriz con el avance físico y financiero de cada convenio, para detectar a tiempo los rezagos.", "Refleja la competencia «Orientación a resultados» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en cumplir las funciones y los compromisos de la organización con eficacia, calidad y oportunidad. Corresponde a diseñar y utilizar indicadores para medir los resultados y evaluar de forma regular el grado de consecución de los objetivos.", true], ["B", "anotar en su libreta de campo los hallazgos de cada visita y consolidarlos en un solo documento al cierre de los dos meses.", "Registra información, pero la consolida tarde y sin indicadores, lo que impide detectar a tiempo los convenios rezagados.", false], ["C", "esperar los informes de interventoría que envían los municipios y consolidar el avance cuando se reciban todos.", "Depende del ritmo de terceros y no evalúa regularmente el cumplimiento. La competencia pide medir y comprobar los resultados de forma periódica.", false]]}, {"id": "CO-130", "niv": 2, "e": "Ante la petición del alcalde, la conducta que mejor refleja la orientación a resultados es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Orientación a resultados)", "o": [["A", "abstenerse de entregar el informe de esa obra hasta que el municipio la termine en enero y entonces reportarla completa y ya recibida.", "Evita el conflicto, pero incumple la oportunidad del informe que le corresponde entregar y oculta información útil para la gobernación.", false], ["B", "registrar el avance real verificado e indicar en el informe lo pendiente y la fecha anunciada por el municipio.", "Refleja la competencia «Orientación a resultados» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en cumplir las funciones y los compromisos de la organización con eficacia, calidad y oportunidad. Refleja la conducta de aportar a los resultados enmarcando los productos dentro de las normas de la entidad: el informe es oportuno y veraz, y deja constancia de lo pendiente.", true], ["C", "registrar la obra como terminada con una observación sobre el 5 % pendiente, para no frenar la liquidación del convenio.", "Facilita la meta de liquidar, pero el informe dejaría de reflejar lo verificado. La competencia exige que los productos se enmarquen en las normas que rigen a la entidad.", false]]}]}, {"comp": "comportamental", "rol": "general", "tag": "Competencias comportamentales (Decreto 815 de 2018) · Trabajo en equipo", "texto": "Usted forma parte de un equipo de tres servidores de una corporación autónoma regional que realiza visitas de control a usuarios con concesión de aguas en una cuenca andina. El equipo acordó que cada informe de visita sea revisado por otro integrante antes de enviarlo. En las últimas semanas el equipo se ve desmotivado por la cantidad de visitas a zonas lejanas. En una visita, usted observa una captación aparentemente ilegal en un predio que está incluido en la ruta que su compañero Jorge recorrerá la próxima semana.", "items": [{"id": "CO-140", "niv": 2, "e": "Su compañero revisor hace a su informe varias observaciones que usted no comparte. La conducta que mejor refleja el trabajo en equipo es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Trabajo en equipo)", "o": [["A", "revisar cada observación con él, acoger las que mejoran el informe y explicarle con argumentos las que no comparte.", "Refleja la competencia «Trabajo en equipo» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en trabajar con otros de manera integrada y armónica para lograr metas institucionales comunes. Corresponde a respetar la diversidad de criterios y comunicarse de forma directa y respetuosa para compartir ideas: el informe mejora con el aporte de ambos.", true], ["B", "aceptar todas las observaciones sin discutirlas y enviar el informe corregido ese mismo día.", "Agiliza el envío, pero renuncia a compartir sus argumentos y puede afectar la calidad del informe.", false], ["C", "enviar el informe sin cambios, porque la responsabilidad técnica de la visita es suya.", "Desconoce el acuerdo del equipo sobre la revisión cruzada y no respeta el criterio del compañero.", false]]}, {"id": "CO-141", "niv": 3, "e": "Frente a la desmotivación del equipo por las visitas lejanas, la conducta más acorde con el trabajo en equipo es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Trabajo en equipo)", "o": [["A", "asumir usted las visitas más lejanas durante el próximo mes, para aliviar la carga de trabajo de sus dos compañeros de equipo.", "Es generoso, pero no resuelve el problema del equipo, concentra la carga en una persona y no es sostenible.", false], ["B", "comentar a su jefe el desánimo que percibe en el equipo, para que sea él quien adopte una solución.", "Informa, pero no aporta desde su papel de integrante a la motivación del grupo.", false], ["C", "reconocer en la reunión el esfuerzo de los compañeros y proponer que las visitas lejanas se distribuyan por turnos.", "Refleja la competencia «Trabajo en equipo» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en trabajar con otros de manera integrada y armónica para lograr metas institucionales comunes. Refleja la conducta de asumir su responsabilidad como miembro del equipo enfocándose en contribuir al compromiso y la motivación de los demás, con una propuesta equitativa.", true]]}, {"id": "CO-142", "niv": 3, "e": "Respecto de la captación ilegal observada, la conducta que mejor refleja el trabajo en equipo es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Trabajo en equipo)", "o": [["A", "incluirla en su informe y dejar que Jorge la conozca cuando lea el consolidado mensual de las visitas.", "Cumple el registro, pero retiene información que su compañero necesita para la visita de la próxima semana.", false], ["B", "registrarla en su informe y enviar de inmediato a Jorge la ubicación y las fotos, porque el predio está en su ruta.", "Refleja la competencia «Trabajo en equipo» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en trabajar con otros de manera integrada y armónica para lograr metas institucionales comunes. Corresponde a establecer comunicación directa para compartir información con el equipo y planificar las propias acciones según su efecto en los objetivos comunes: deja el registro formal y prepara la visita de su compañero.", true], ["C", "avisarle a Jorge y dejar que él la reporte en su propio informe, para que el hallazgo no quede registrado dos veces.", "Comparte la información, pero omite registrar lo que usted mismo observó, como exige el procedimiento de visita.", false]]}]}, {"comp": "comportamental", "rol": "tecnico", "tag": "Competencias comportamentales (Decreto 815 de 2018) · Nivel técnico · Disciplina", "texto": "Usted es técnico administrativo de la oficina de cobro de una secretaría distrital de Bogotá y proyecta acuerdos de pago. Su jefe le indicó que, a partir de hoy, todos los acuerdos, incluidos los que están en curso, se proyecten en un nuevo formato. Esta semana llegó un nuevo profesional supervisor que revisará durante el primer mes la totalidad de sus proyecciones. Usted lleva, además, una hoja de cálculo personal con más detalles que el aplicativo oficial de cobro. La oficina publica en la intranet las versiones vigentes de sus procedimientos, y la semana pasada se actualizó uno de ellos.", "items": [{"id": "CO-188", "niv": 1, "e": "Frente a la instrucción sobre el nuevo formato, la conducta que mejor refleja la disciplina es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 4, sustituido por el art. 1 del Decreto 815 de 2018 (nivel técnico: Disciplina)", "o": [["A", "terminar en el formato anterior los acuerdos ya iniciados y usar el nuevo formato solo en los acuerdos que empiecen a partir de hoy.", "Parece razonable, pero se aparta de una instrucción que incluyó expresamente los acuerdos en curso.", false], ["B", "seguir con el formato anterior hasta que el nuevo se publique en el sistema de gestión de calidad.", "Condiciona por su cuenta una instrucción clara del jefe.", false], ["C", "aplicar el nuevo formato desde hoy a todos los acuerdos, aun los ya iniciados, y consultar al jefe si alguno requiere ajuste.", "Refleja la competencia «Disciplina» (Decreto 1083 de 2015, art. 2.2.4.8, num. 4, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en adaptarse a las políticas institucionales y generar información acorde con los procesos. Corresponde a recibir instrucciones y desarrollar las actividades de acuerdo con ellas.", true]]}, {"id": "CO-189", "niv": 2, "e": "Respecto de la revisión total de sus proyecciones por el nuevo supervisor, la conducta más acorde con la disciplina es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 4, sustituido por el art. 1 del Decreto 815 de 2018 (nivel técnico: Disciplina)", "o": [["A", "facilitar la revisión con los soportes completos y aplicar las observaciones, pues es el control definido para el primer mes.", "Refleja la competencia «Disciplina» (Decreto 1083 de 2015, art. 2.2.4.8, num. 4, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en adaptarse a las políticas institucionales y generar información acorde con los procesos. Refleja la conducta de aceptar la supervisión constante como parte de su trabajo.", true], ["B", "solicitar que cada observación se le entregue por escrito y con sustento normativo antes de aplicarla.", "Pedir claridad es válido, pero condicionar cada observación a un trámite formal dificulta la supervisión.", false], ["C", "pedir que la revisión se haga por muestreo, ya que su experiencia de varios años en la oficina respalda la calidad de su trabajo.", "Su experiencia es real, pero no acepta la supervisión definida para el periodo de empalme.", false]]}, {"id": "CO-190", "niv": 3, "e": "Su jefe le pide un reporte del estado de los acuerdos de pago. La conducta que mejor refleja la disciplina es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 4, sustituido por el art. 1 del Decreto 815 de 2018 (nivel técnico: Disciplina)", "o": [["A", "generar el reporte desde el aplicativo oficial y completar allí los datos faltantes, porque es la fuente del proceso.", "Refleja la competencia «Disciplina» (Decreto 1083 de 2015, art. 2.2.4.8, num. 4, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en adaptarse a las políticas institucionales y generar información acorde con los procesos. Corresponde a generar información acorde con los procesos, usando y completando el sistema oficial.", true], ["B", "entregar su hoja de cálculo personal, que tiene información más completa que el aplicativo oficial.", "Puede tener más detalle, pero produce información por fuera del proceso y del sistema oficial.", false], ["C", "entregar el reporte del aplicativo junto con su hoja de cálculo, para que el jefe compare ambas fuentes.", "Entrega dos versiones que pueden no coincidir, en lugar de dejar completa la fuente oficial del proceso.", false]]}]}];
const CFG = {"titulo": "Simulacro 4 · Nivel técnico · CNSC Empleo Público", "modo": "simulacro", "minutos": 155, "componentes": {"estado_constitucion": "Estado y Constitución", "empleo_publico": "Empleo público, carrera y régimen disciplinario", "atencion_procedimiento": "Atención al ciudadano y procedimiento administrativo", "gestion_publica": "Gestión pública, MIPG, contratación y documentos", "entidades_territoriales": "Entidades territoriales, Bogotá D.C. y CAR", "comportamental": "Competencias comportamentales (Decreto 815 de 2018)"}, "niveles": {"1": "Básico", "2": "Intermedio", "3": "Avanzado"}, "roles": {"general": "Todos los niveles", "asistencial": "Nivel asistencial", "tecnico": "Nivel técnico", "profesional": "Nivel profesional"}, "clave": "tecnico-04.html"};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY = 'sim-cnsc:' + CFG.clave;
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}
function save(){try{localStorage.setItem(KEY, JSON.stringify(ST))}catch(e){}}
let ST = load();
ST.r = ST.r || {};
$('#tit').textContent = CFG.titulo;
const ITEMS = [];
DATA.forEach(c => c.items.forEach(it => { it.caso = c; ITEMS.push(it); }));

function justHTML(it){
  return '<div class="just">' + it.o.map(o => `<div><b>${o[0]}.</b> <span class="${o[3]?'okt':'not'}">${o[3]?'Es correcta.':'Es incorrecta.'}</span> ${esc(o[2])}</div>`).join('') +
    `<div class="src">Referencia: ${esc(it.f)}</div></div>`;
}
function itemHTML(it, n, mode){
  const r = ST.r[it.id];
  const reveal = mode === 'review' || (CFG.modo === 'practica' && r);
  let h = `<div class="item" id="i-${it.id}"><p class="enun"><span class="n">${n}.</span> <span class="niv">${CFG.niveles[it.niv]}</span> ${esc(it.e)}</p>`;
  it.o.forEach(o => {
    let cls = '';
    if (reveal) { if (o[3]) cls = 'ok'; else if (r === o[0]) cls = 'no'; }
    else if (r === o[0]) cls = 'sel';
    h += `<button class="op ${cls}" data-id="${it.id}" data-l="${o[0]}" ${reveal?'disabled':''}><span class="l">${o[0]}.</span><span>${esc(o[1])}</span></button>`;
  });
  if (reveal) {
    if (mode === 'review') h += `<div class="${r===keyOf(it)?'res-ok':'res-no'}" style="font-size:14px;margin-top:4px">${r ? (r===keyOf(it)?'Respondiste ' + r + ': correcto.':'Respondiste ' + r + '. La respuesta correcta es ' + keyOf(it) + '.') : 'Sin responder. La respuesta correcta es ' + keyOf(it) + '.'}</div>`;
    h += justHTML(it);
  }
  return h + '</div>';
}
const keyOf = it => it.o.find(o => o[3])[0];

function renderList(list, mode){
  let h = '', last = null, n = 0;
  list.forEach(it => {
    n++;
    if (it.caso !== last) { last = it.caso; h += `<div class="caso"><div class="tag">${esc(it.caso.tag)}</div><p>${esc(it.caso.texto)}</p></div>`; }
    h += itemHTML(it, n, mode);
  });
  return h;
}

// ---------- PRÁCTICA ----------
let LIST = [];
let FILTRO = ST.f || {comp:'', niv:'', rol:''};
function practica(){
  const comps = Object.entries(CFG.componentes).map(([k,v]) => `<option value="${k}" ${FILTRO.comp===k?'selected':''}>${esc(v)}</option>`).join('');
  const nivs = Object.entries(CFG.niveles).map(([k,v]) => `<option value="${k}" ${FILTRO.niv===k?'selected':''}>${esc(v)}</option>`).join('');
  const list = ITEMS.filter(it => (!FILTRO.comp || it.caso.comp===FILTRO.comp) && (!FILTRO.niv || String(it.niv)===FILTRO.niv) && (!FILTRO.rol || it.caso.rol===FILTRO.rol || it.caso.rol==='general'));
  const resp = list.filter(it => ST.r[it.id]); const ok = resp.filter(it => ST.r[it.id]===keyOf(it));
  $('#main').innerHTML = `<div class="panel"><p style="margin-top:0">Elige un tema, tu nivel de empleo y la dificultad. Al responder verás de inmediato si acertaste y la explicación de cada opción.</p>
  <div class="row"><select id="fc"><option value="">Todos los temas</option>${comps}</select>
  <select id="fn"><option value="">Todas las dificultades</option>${nivs}</select>
  <select id="fr"><option value="">Todos los niveles de empleo</option>${['asistencial','tecnico','profesional'].map(k => `<option value="${k}" ${FILTRO.rol===k?'selected':''}>${esc(CFG.roles[k])} (y temas comunes)</option>`).join('')}</select>
  <button class="btn sec" id="borrar">Borrar mis respuestas</button></div>
  <p class="stat" id="pst" style="margin-bottom:0">${list.length} preguntas · respondidas ${resp.length} · aciertos ${ok.length}${resp.length? ' (' + Math.round(100*ok.length/resp.length) + ' %)':''}</p></div>` + renderList(list, 'practica');
  $('#prog').textContent = `${ok.length}/${resp.length} aciertos`;
  ['fc','fn','fr'].forEach((id,i) => $('#'+id).onchange = e => { FILTRO[['comp','niv','rol'][i]] = e.target.value; ST.f = FILTRO; save(); practica(); });
  LIST = list;
  $('#borrar').onclick = () => { list.forEach(it => delete ST.r[it.id]); save(); practica(); };
}

// ---------- SIMULACRO ----------
let tick = null;
function inicio(){
  const n = ITEMS.length, cnt = {};
  ITEMS.forEach(it => cnt[it.caso.comp] = (cnt[it.caso.comp]||0) + 1);
  const h = Math.floor(CFG.minutos/60), m = CFG.minutos%60;
  $('#main').innerHTML = `<div class="panel"><h2 style="margin-top:0;color:var(--pri)">Instrucciones</h2>
  <p>Este simulacro tiene <b>${n} preguntas</b> en el formato de Prueba de Juicio Situacional: un caso, enunciados que se completan y tres opciones con una sola respuesta correcta.</p>
  <table>${Object.entries(cnt).map(([k,v]) => `<tr><td>${esc(CFG.componentes[k])}</td><td class="r">${v}</td></tr>`).join('')}</table>
  <p>Tiempo sugerido: <b>${h ? h + ' h ' : ''}${m ? m + ' min' : ''}</b> (unos ${Math.round(CFG.minutos*60/n/6)/10} minutos por pregunta). Cuando se acaba el tiempo puedes seguir, pero el cronómetro lo indica.</p>
  <p>Tus respuestas se guardan en este navegador. Al terminar verás tu puntaje por componente y por dificultad, y la explicación de cada pregunta.</p>
  <button class="btn" id="go">${ST.t0 ? 'Continuar el simulacro' : 'Comenzar'}</button></div>`;
  $('#prog').textContent = `${n} preguntas`;
  $('#go').onclick = () => { if (!ST.t0) { ST.t0 = Date.now(); save(); } examen(); };
}
function reloj(){
  const rest = CFG.minutos*60 - Math.floor((Date.now() - ST.t0)/1000);
  const a = Math.abs(rest), hh = Math.floor(a/3600), mm = Math.floor(a%3600/60), ss = a%60;
  const t = (rest < 0 ? '+' : '') + (hh ? hh + ':' : '') + String(mm).padStart(2,'0') + ':' + String(ss).padStart(2,'0');
  $('#timer').textContent = rest < 0 ? 'Tiempo cumplido ' + t : '⏱ ' + t;
  $('#timer').classList.toggle('low', rest < 600);
}
function examen(){
  $('#main').innerHTML = renderList(ITEMS, 'examen') + `<div class="panel"><button class="btn" id="fin">Terminar y calificar</button></div>`;
  progreso(); reloj(); clearInterval(tick); tick = setInterval(reloj, 1000);
  $('#fin').onclick = () => {
    const faltan = ITEMS.length - Object.keys(ST.r).filter(k => ITEMS.some(i => i.id===k)).length;
    $('#mtxt').textContent = faltan ? `Te faltan ${faltan} preguntas por responder. ¿Quieres calificar de todos modos?` : '¿Quieres terminar y ver tu calificación?';
    $('#modal').classList.remove('hide');
  };
}
function progreso(){
  const r = ITEMS.filter(it => ST.r[it.id]).length;
  $('#prog').textContent = `Respondidas ${r}/${ITEMS.length}`;
}
$('#mno').onclick = () => $('#modal').classList.add('hide');
$('#msi').onclick = () => { $('#modal').classList.add('hide'); ST.fin = Date.now(); save(); resultados(); };
function resultados(){
  clearInterval(tick);
  const ok = ITEMS.filter(it => ST.r[it.id] === keyOf(it)).length;
  const pct = Math.round(1000*ok/ITEMS.length)/10;
  const g = (fn, lab) => { const m = {}; ITEMS.forEach(it => { const k = fn(it); m[k] = m[k] || [0,0]; m[k][1]++; if (ST.r[it.id]===keyOf(it)) m[k][0]++; });
    return Object.entries(m).map(([k,v]) => `<tr><td>${esc(lab(k))}</td><td class="r">${v[0]}/${v[1]}</td><td class="r">${Math.round(100*v[0]/v[1])} %</td></tr>`).join(''); };
  const mins = Math.round(((ST.fin||Date.now()) - ST.t0)/60000);
  $('#timer').textContent = `Tiempo usado: ${Math.floor(mins/60) ? Math.floor(mins/60) + ' h ' : ''}${mins%60} min`;
  $('#prog').textContent = `${ok}/${ITEMS.length} aciertos`;
  $('#main').innerHTML = `<div class="panel"><div class="big">${String(pct).replace('.',',')} %</div>
  <p style="margin-top:4px">${ok} de ${ITEMS.length} respuestas correctas. ${pct >= 75 ? 'Muy buen resultado: repasa las explicaciones de tus errores para afianzarlo.' : pct >= 65 ? 'Vas bien, pero con poco margen: refuerza los componentes con menor porcentaje.' : 'Todavía no estás en zona segura: practica por tema los componentes con menor porcentaje.'}</p>
  <p class="aviso">Referencia: en los procesos Distrito Capital 7, Territorial 14 y CAR, la prueba de competencias funcionales es eliminatoria con mínimo de 65 puntos, y la comportamental es clasificatoria. Este porcentaje de aciertos es una guía de preparación; la CNSC calcula su puntaje con su propia escala, comparando con los demás aspirantes al mismo empleo.</p>
  <h3>Por componente</h3><table>${g(it => it.caso.comp, k => CFG.componentes[k])}</table>
  <h3>Por dificultad</h3><table>${g(it => it.niv, k => CFG.niveles[k])}</table>
  <div class="row" style="margin-top:14px"><button class="btn" id="solo">Ver solo mis errores</button><button class="btn sec" id="todas">Ver todas</button><button class="btn sec" id="otra">Reiniciar el simulacro</button></div></div><div id="rev"></div>`;
  const rev = errs => { const l = errs ? ITEMS.filter(it => ST.r[it.id] !== keyOf(it)) : ITEMS; $('#rev').innerHTML = renderList(l, 'review'); };
  rev(true);
  $('#solo').onclick = () => rev(true); $('#todas').onclick = () => rev(false);
  $('#otra').onclick = () => { ST = {r:{}}; save(); inicio(); window.scrollTo(0,0); };
}

document.addEventListener('click', e => {
  const b = e.target.closest('button.op'); if (!b || b.disabled) return;
  ST.r[b.dataset.id] = b.dataset.l; save();
  const it = ITEMS.find(i => i.id === b.dataset.id);
  const n = b.closest('.item').querySelector('.n').textContent.replace('.','');
  b.closest('.item').outerHTML = itemHTML(it, n, CFG.modo === 'practica' ? 'practica' : 'examen');
  if (CFG.modo === 'practica') { const resp = LIST.filter(i => ST.r[i.id]); const ok = resp.filter(i => ST.r[i.id]===keyOf(i)).length; $('#prog').textContent = `${ok}/${resp.length} aciertos`; $('#pst').textContent = `${LIST.length} preguntas · respondidas ${resp.length} · aciertos ${ok} (${Math.round(100*ok/resp.length)} %)`; }
  else progreso();
});

if (CFG.modo === 'practica') practica();
else if (ST.fin) resultados();
else if (ST.t0) examen();
else inicio();
</script>
</body>
</html>
