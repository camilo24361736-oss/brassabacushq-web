giendo el plan del período anterior hasta que la asamblea lo apruebe.", "La ley no prorroga el plan anterior; resuelve la falta de decisión facultando al mandatario para adoptar el nuevo plan por decreto.", false], ["B", "el gobernador podrá adoptarlo mediante decreto.", "El artículo 40 de la Ley 152 de 1994 establece que, si transcurre el mes siguiente a la presentación sin que la asamblea o el concejo decidan, el gobernador o alcalde podrá adoptar el plan mediante decreto.", true], ["C", "el proyecto se entiende negado y el gobernador debe presentar uno nuevo.", "La ley no atribuye al silencio de la asamblea el efecto de negar el plan; prevé, por el contrario, que el mandatario pueda adoptarlo.", false]]}]}, {"comp": "gestion_publica", "rol": "tecnico", "tag": "Gestión pública, MIPG, contratación y documentos · Nivel técnico · Contratación: selección abreviada", "texto": "Usted es técnico administrativo del área de contratación de un municipio de segunda categoría. La licitación pública para la adecuación de la plaza de mercado se declaró desierta el 10 de marzo porque ninguna oferta cumplió los requisitos. En paralelo, la alcaldía adelanta un proceso de selección abreviada de menor cuantía para la señalización de vías urbanas, en el que recibió 14 manifestaciones de interés; el pliego previó la posibilidad de sorteo. El secretario jurídico le pregunta cómo continuar con ambos procesos.", "items": [{"id": "GP-160", "niv": 2, "e": "Para contratar la adecuación de la plaza de mercado por selección abreviada, la alcaldía debe iniciar el proceso", "f": "Ley 1150 de 2007, art. 2, num. 2, lit. d", "o": [["A", "dentro de los dos meses siguientes a la declaratoria de desierta.", "El plazo legal es más amplio: la ley concede cuatro meses contados desde la declaratoria de desierta del proceso inicial.", false], ["B", "en cualquier momento de la vigencia, porque la declaratoria de desierta no fija plazo.", "La ley sí fija un plazo para acudir a esta causal; vencido, la entidad no puede invocarla.", false], ["C", "dentro de los cuatro meses siguientes a la declaratoria de desierta.", "El literal d del numeral 2 del artículo 2 de la Ley 1150 de 2007 permite la selección abreviada cuando la licitación se declara desierta, y ordena iniciarla dentro de los cuatro meses siguientes a esa declaratoria.", true]]}, {"id": "GP-161", "niv": 3, "e": "Frente a las 14 manifestaciones de interés, la alcaldía", "f": "Decreto 1082 de 2015, art. 2.2.1.2.1.2.20; Ley 1150 de 2007, art. 2", "o": [["A", "debe rechazar las manifestaciones que excedan de diez, según el orden de llegada.", "El reglamento no prevé rechazar manifestaciones por orden de llegada; la limitación, si se usa, se hace por sorteo.", false], ["B", "debe terminar el proceso y convertirlo en licitación pública por el exceso de interesados.", "Recibir muchas manifestaciones de interés no cambia la modalidad; la norma ofrece continuar o sortear.", false], ["C", "puede continuar con todos los interesados o hacer un sorteo para escoger máximo diez, como lo previó el pliego.", "El artículo 2.2.1.2.1.2.20 del Decreto 1082 de 2015 dispone que, si se reciben más de diez manifestaciones de interés, la entidad puede continuar el proceso o sortear para seleccionar máximo diez interesados, según lo previsto en el pliego.", true]]}, {"id": "GP-162", "niv": 3, "e": "En el proceso de menor cuantía, el informe de evaluación de las ofertas debe publicarse durante", "f": "Decreto 1082 de 2015, art. 2.2.1.2.1.2.20, num. 4", "o": [["A", "un día hábil.", "Un día hábil es el término mínimo previsto para el informe de evaluación en la mínima cuantía, no en la selección abreviada de menor cuantía.", false], ["B", "tres días hábiles.", "El numeral 4 del artículo 2.2.1.2.1.2.20 del Decreto 1082 de 2015 ordena publicar el informe de evaluación de ofertas de la selección abreviada de menor cuantía durante tres días hábiles.", true], ["C", "cinco días hábiles.", "El reglamento no fija cinco días hábiles para este informe; para la menor cuantía el término es de tres días hábiles.", false]]}]}, {"comp": "gestion_publica", "rol": "tecnico", "tag": "Gestión pública, MIPG, contratación y documentos · Nivel técnico · Contratación: liquidación, garantías y RUP", "texto": "Usted es técnico de la oficina de contratación de una corporación autónoma regional y revisa tres expedientes: un contrato de prestación de servicios profesionales con un ingeniero ambiental, que ya terminó; un contrato interadministrativo con un municipio para reforestar una microcuenca; y un proceso de contratación directa que se adelanta porque no existe pluralidad de oferentes en el mercado. El jefe de la oficina le pide verificar los requisitos de cada uno.", "items": [{"id": "GP-188", "niv": 3, "e": "Sobre el contrato terminado con el ingeniero ambiental, la liquidación", "f": "Ley 80 de 1993, art. 60 (texto vigente)", "o": [["A", "no es obligatoria, por tratarse de prestación de servicios profesionales.", "El artículo 60 de la Ley 80 de 1993, en su texto vigente, dispone que la liquidación no es obligatoria en los contratos de prestación de servicios profesionales y de apoyo a la gestión.", true], ["B", "es obligatoria solo si el contrato tuvo adiciones o prórrogas.", "La norma no condiciona la excepción a que el contrato no haya tenido adiciones o prórrogas.", false], ["C", "es obligatoria y debe hacerse de mutuo acuerdo dentro de los cuatro meses siguientes a la terminación.", "La ley exceptúa de la liquidación obligatoria a los contratos de prestación de servicios profesionales y de apoyo a la gestión.", false]]}, {"id": "GP-189", "niv": 3, "e": "En el contrato interadministrativo con el municipio, las garantías", "f": "Ley 1150 de 2007, art. 7; Decreto 1082 de 2015, art. 2.2.1.2.1.4.5", "o": [["A", "son obligatorias, porque el contrato compromete recursos públicos de dos entidades estatales distintas.", "La ley excluye expresamente a los contratos interadministrativos de la obligatoriedad de garantías.", false], ["B", "no son obligatorias, y la decisión de exigirlas o no debe justificarse en los estudios previos.", "El artículo 7 de la Ley 1150 de 2007 dispone que las garantías no son obligatorias en los contratos interadministrativos, y el artículo 2.2.1.2.1.4.5 del Decreto 1082 de 2015 exige que en la contratación directa la justificación para exigirlas o no esté en los estudios previos.", true], ["C", "están prohibidas, porque una entidad pública no puede garantizar obligaciones ante otra.", "No existe tal prohibición: las garantías no son obligatorias, pero la entidad puede exigirlas si lo justifica.", false]]}, {"id": "GP-190", "niv": 3, "e": "En el proceso por inexistencia de pluralidad de oferentes, al contratista", "f": "Ley 1150 de 2007, art. 6", "o": [["A", "no se le exige el Registro Único de Proponentes; la corporación verifica directamente sus condiciones.", "El artículo 6 de la Ley 1150 de 2007 exceptúa del RUP, entre otros, los casos de contratación directa y la mínima cuantía, y dispone que en esos eventos la entidad verifique las condiciones de los proponentes.", true], ["B", "se le exige el RUP solo si el valor del contrato supera la mínima cuantía de la corporación.", "La excepción del RUP en la contratación directa no depende del valor del contrato.", false], ["C", "se le exige el RUP vigente, porque toda contratación de la corporación lo requiere sin excepción alguna.", "El RUP no se exige en todos los casos; la ley excluye, entre otros, la contratación directa.", false]]}]}, {"comp": "gestion_publica", "rol": "general", "tag": "Gestión pública, MIPG, contratación y documentos · Contrato de prestación de servicios", "texto": "Usted trabaja en la Secretaría General de un municipio de cuarta categoría. La Secretaría de Desarrollo Social pide vincular mediante contrato de prestación de servicios a una trabajadora social para un programa de atención a personas mayores que durará cinco meses. En la planta hay dos trabajadoras sociales, pero ambas están dedicadas por completo a otro programa. La secretaria propone pactar el contrato por dos años «para no repetir el trámite», fijarle el mismo horario de los servidores de planta y reconocerle vacaciones remuneradas.", "items": [{"id": "GP-191", "niv": 2, "e": "Para celebrar este contrato con una persona natural, debe acreditarse que", "f": "Ley 80 de 1993, art. 32, num. 3", "o": [["A", "la trabajadora social no tiene vínculos previos con otra entidad pública.", "Haber tenido vínculos con otras entidades no es el presupuesto legal de este contrato; lo relevante es la insuficiencia de la planta o la necesidad de conocimientos especializados.", false], ["B", "el valor del contrato no supera la mínima cuantía del municipio.", "La procedencia de este contrato no depende de su cuantía; los servicios profesionales se contratan directamente con independencia del valor.", false], ["C", "la actividad no puede realizarse con el personal de planta o requiere conocimientos especializados.", "El numeral 3 del artículo 32 de la Ley 80 de 1993 permite celebrar contratos de prestación de servicios con personas naturales solo cuando la actividad no puede realizarse con personal de planta o requiere conocimientos especializados.", true]]}, {"id": "GP-192", "niv": 1, "e": "Sobre la duración propuesta por la secretaria, el contrato debe pactarse", "f": "Ley 80 de 1993, art. 32, num. 3", "o": [["A", "por el término estrictamente indispensable para ejecutar el programa.", "El numeral 3 del artículo 32 de la Ley 80 de 1993 ordena que los contratos de prestación de servicios se celebren por el término estrictamente indispensable; si el programa dura cinco meses, pactar dos años lo desconoce.", true], ["B", "por un plazo mínimo de un año, para garantizar la continuidad del servicio.", "La ley no fija un plazo mínimo; por el contrario, limita la duración a lo estrictamente indispensable.", false], ["C", "por el período que le resta al alcalde, por tratarse de un programa del plan de desarrollo.", "El período del alcalde no es el criterio legal; la duración depende de la necesidad concreta, que aquí es de cinco meses.", false]]}, {"id": "GP-193", "niv": 2, "e": "En cuanto a las vacaciones remuneradas propuestas, usted advierte que", "f": "Ley 80 de 1993, art. 32, num. 3", "o": [["A", "proceden si el contrato se celebra con una persona natural y no con una persona jurídica o un consorcio.", "La naturaleza del contratista no cambia la regla: los contratos de prestación de servicios no generan prestaciones sociales.", false], ["B", "los contratos de prestación de servicios no generan relación laboral ni prestaciones sociales.", "El numeral 3 del artículo 32 de la Ley 80 de 1993 dispone que estos contratos en ningún caso generan relación laboral ni prestaciones sociales; reconocer vacaciones y fijar horario de planta desnaturaliza el contrato.", true], ["C", "proceden de manera proporcional, siempre que el contrato supere seis meses.", "Las vacaciones son una prestación propia de la relación laboral; la duración del contrato no las hace procedentes en un contrato de prestación de servicios.", false]]}]}, {"comp": "entidades_territoriales", "rol": "general", "tag": "Entidades territoriales, Bogotá D.C. y CAR · Juntas administradoras locales", "texto": "Usted es auxiliar administrativo de la Secretaría de Planeación de un municipio de primera categoría del Meta dividido en comunas y corregimientos. La Junta Administradora Local (JAL) de la Comuna 4 radicó varias solicitudes: quiere presentar al Concejo un proyecto de acuerdo sobre ferias comunitarias, pide información sobre las partidas presupuestales para la comuna antes de que el alcalde radique el presupuesto y pregunta cuántos cabildos abiertos debe celebrar.", "items": [{"id": "ET-120", "niv": 2, "e": "Sobre el proyecto de acuerdo de ferias comunitarias, usted informa a la JAL que", "f": "Ley 136 de 1994, art. 131, num. 1; Constitución Política, art. 318", "o": [["A", "no puede presentarlo, porque las JAL solo emiten conceptos y no tienen iniciativa normativa.", "Las JAL sí tienen iniciativa para presentar proyectos de acuerdo relacionados con sus funciones (art. 131, num. 1 de la Ley 136 de 1994).", false], ["B", "debe presentarlo por conducto del alcalde, único autorizado para radicar proyectos ante el Concejo.", "El alcalde no tiene iniciativa exclusiva en todos los asuntos; la ley reconoce iniciativa a las JAL en temas relacionados con sus funciones.", false], ["C", "puede presentarlo al Concejo municipal, siempre que se relacione con el objeto de sus funciones.", "El art. 131, numeral 1 de la Ley 136 de 1994 faculta a las JAL para presentar proyectos de acuerdo al Concejo relacionados con el objeto de sus funciones.", true]]}, {"id": "ET-121", "niv": 2, "e": "Frente a las partidas presupuestales de la comuna, a la JAL le corresponde", "f": "Ley 136 de 1994, art. 131, num. 8", "o": [["A", "esperar la aprobación del presupuesto por el Concejo y luego ejercer control político sobre su ejecución en la comuna, mediante citaciones a los secretarios del despacho municipal.", "La ley le asigna a la JAL una intervención previa (concepto) antes de que el proyecto llegue al Concejo, no solo un control posterior.", false], ["B", "rendir concepto sobre la conveniencia de las partidas antes de que el proyecto se presente al Concejo, para lo cual el alcalde debe suministrarle la información disponible.", "El art. 131, numeral 8 de la Ley 136 de 1994 asigna a las JAL rendir concepto sobre las partidas presupuestales antes de la presentación del proyecto al Concejo, y obliga al alcalde a brindar la información disponible.", true], ["C", "aprobar el presupuesto de la comuna una vez el Concejo apruebe el presupuesto general del municipio.", "En los municipios la JAL no aprueba el presupuesto; emite concepto previo sobre las partidas y distribuye partidas globales conforme al plan de desarrollo.", false]]}, {"id": "ET-122", "niv": 1, "e": "Sobre los cabildos abiertos, usted le indica a la JAL que debe celebrar", "f": "Ley 136 de 1994, art. 131, num. 12", "o": [["A", "los que convoque el alcalde, pues la JAL no puede convocarlos por iniciativa propia.", "La ley impone a la propia JAL el deber de celebrar cabildos abiertos y de convocar audiencias públicas.", false], ["B", "uno al año, coincidiendo con la discusión del plan de desarrollo.", "La ley fija un mínimo mayor: al menos dos cabildos abiertos por cada periodo de sesiones.", false], ["C", "al menos dos por periodo de sesiones.", "El art. 131, numeral 12 de la Ley 136 de 1994 ordena a las JAL celebrar al menos dos cabildos abiertos por periodo de sesiones.", true]]}]}, {"comp": "entidades_territoriales", "rol": "general", "tag": "Entidades territoriales, Bogotá D.C. y CAR · Corporaciones Autónomas Regionales: naturaleza y órganos", "texto": "Usted es profesional universitario de la Secretaría General de una corporación autónoma regional del Eje Cafetero. En la jornada de inducción, varios servidores nuevos preguntan cómo está gobernada la corporación, quién elige al director general y por cuánto tiempo, y qué órgano decide la ampliación de la planta de personal que propone la dirección para atender el aumento de solicitudes de permisos ambientales.", "items": [{"id": "ET-144", "niv": 1, "e": "Al explicar los órganos principales de dirección y administración de la corporación, usted señala que son", "f": "Ley 99 de 1993, arts. 23 y 24", "o": [["A", "la asamblea corporativa, el consejo directivo y el director general.", "El art. 24 de la Ley 99 de 1993 señala como órganos principales de dirección y administración de las CAR la asamblea corporativa, el consejo directivo y el director general.", true], ["B", "el consejo directivo, el revisor fiscal y la oficina de control interno.", "El revisor fiscal y la oficina de control interno son instancias de control, no órganos principales de dirección y administración.", false], ["C", "el Ministerio de Ambiente, la junta de gobernadores y el director general.", "El Ministerio orienta la política ambiental, pero no es órgano de dirección de la CAR, y no existe una «junta de gobernadores» como órgano previsto en el art. 24.", false]]}, {"id": "ET-145", "niv": 2, "e": "Sobre la designación del director general, usted precisa que lo designa", "f": "Ley 99 de 1993, art. 28 (modificado por el art. 1 de la Ley 1263 de 2008)", "o": [["A", "la asamblea corporativa, para un periodo de tres años, sin posibilidad de reelección.", "La designación corresponde al consejo directivo, el periodo es de cuatro años y la ley permite la reelección por una sola vez.", false], ["B", "el consejo directivo, para un periodo de cuatro años, y puede ser reelegido por una sola vez.", "El art. 28 de la Ley 99 de 1993 (modificado por el art. 1 de la Ley 1263 de 2008) dispone que el director general es designado por el consejo directivo para un periodo de cuatro años y puede ser reelegido por una sola vez.", true], ["C", "el Presidente de la República, de terna enviada por el consejo directivo, para un periodo de cuatro años.", "El director de una CAR no lo nombra el Presidente: lo designa el consejo directivo, en desarrollo de la autonomía de la corporación.", false]]}, {"id": "ET-146", "niv": 2, "e": "La decisión sobre la ampliación de la planta de personal propuesta por la dirección corresponde a", "f": "Ley 99 de 1993, arts. 25, 27, lit. b), y 29, nums. 3 y 8", "o": [["A", "el consejo directivo, a partir del proyecto que presente el director general.", "El art. 27, literal b) de la Ley 99 de 1993 asigna al consejo directivo determinar la planta de personal, y el art. 29, numeral 3 ordena al director presentarle los proyectos de planta.", true], ["B", "la asamblea corporativa, porque es el principal órgano de dirección de la corporación.", "Aunque es el principal órgano de dirección, sus funciones (elegir parte del consejo, aprobar informes y estatutos) no incluyen determinar la planta.", false], ["C", "el director general, porque nombra y remueve el personal de la corporación.", "Nombrar y remover el personal (art. 29, num. 8) es distinto de determinar la planta; el director presenta el proyecto, pero quien la determina es el consejo directivo.", false]]}]}, {"comp": "entidades_territoriales", "rol": "tecnico", "tag": "Entidades territoriales, Bogotá D.C. y CAR · Nivel técnico · Concesión de aguas", "texto": "Usted es técnico operativo de la subdirección de recursos naturales de una corporación autónoma regional de Cundinamarca. Esta semana atiende tres solicitudes: una empresa avícola quiere instalar una bocatoma y una motobomba para tomar agua de una quebrada para su proceso productivo; un campesino pregunta si necesita trámite para que su ganado beba directamente en el río que pasa junto a su finca; y la empresa de servicios públicos del municipio pide concesión para el acueducto urbano.", "items": [{"id": "ET-150", "niv": 1, "e": "Frente a la empresa avícola, usted le informa que", "f": "Decreto 1076 de 2015, arts. 2.2.3.2.5.3 (modificado por el art. 2 del Decreto 875 de 2026) y 2.2.3.2.9.1", "o": [["A", "solo debe inscribirse en el registro de usuarios del recurso hídrico, sin necesidad de concesión.", "La sola inscripción no sustituye la concesión para un uso industrial con derivación (art. 2.2.3.2.9.1 del Decreto 1076 de 2015).", false], ["B", "puede usar el agua sin trámite, pues las aguas que discurren por cauces naturales son de uso público.", "Que las aguas sean de uso público no autoriza a derivarlas para un proceso productivo; el uso sin autorización se limita a los usos por ministerio de la ley.", false], ["C", "debe solicitar concesión de aguas ante la corporación antes de derivar el agua.", "Los arts. 2.2.3.2.5.3 (modificado por el Decreto 875 de 2026) y 2.2.3.2.9.1 del Decreto 1076 de 2015 exigen concesión o permiso de la autoridad ambiental para usar aguas públicas con fines distintos de los que se ejercen por ministerio de la ley, como el uso industrial con derivación.", true]]}, {"id": "ET-151", "niv": 2, "e": "Al campesino que pregunta por el abrevadero de su ganado directamente en el río, usted le responde que", "f": "Decreto 1076 de 2015, art. 2.2.3.2.6.1", "o": [["A", "debe tramitar concesión de aguas, porque todo uso pecuario requiere autorización de la corporación.", "No todo uso pecuario requiere concesión: abrevar animales en el cauce natural, sin derivación, es un uso por ministerio de la ley.", false], ["B", "no requiere concesión, porque abrevar animales en aguas que discurren por cauces naturales es un uso por ministerio de la ley.", "El art. 2.2.3.2.6.1 del Decreto 1076 de 2015 permite a todos los habitantes usar las aguas mientras discurran por cauces naturales para beber, bañarse, abrevar animales y lavar ropa, de acuerdo con las normas sanitarias y de protección de recursos.", true], ["C", "debe pagar la tasa por utilización del agua y luego solicitar ante la corporación la legalización del uso que viene haciendo en su finca.", "La tasa excluye a quienes usan el agua por ministerio de la ley, y en este caso no hay nada que legalizar.", false]]}, {"id": "ET-152", "niv": 3, "e": "Sobre el término de la concesión para el acueducto urbano, usted explica que", "f": "Decreto 1076 de 2015, art. 2.2.3.2.7.4", "o": [["A", "se otorga a término indefinido, mientras la empresa preste el servicio público domiciliario de acueducto en el municipio.", "No existen concesiones indefinidas: incluso las de servicios públicos tienen un tope de cincuenta años.", false], ["B", "no puede exceder de diez años, como cualquier otra concesión de aguas.", "El límite de diez años es la regla general, pero la norma exceptúa las concesiones destinadas a servicios públicos.", false], ["C", "puede otorgarse por un periodo de hasta cincuenta años, por tratarse de la prestación de un servicio público.", "El art. 2.2.3.2.7.4 del Decreto 1076 de 2015 fija un término no mayor de diez años, salvo las concesiones destinadas a servicios públicos u obras de interés público o social, que pueden otorgarse hasta por cincuenta años.", true]]}]}, {"comp": "comportamental", "rol": "general", "tag": "Competencias comportamentales (Decreto 815 de 2018) · Orientación a resultados", "texto": "Usted es servidor de la Secretaría de Planeación de un municipio de cuarta categoría y tiene a cargo la meta del Plan de Desarrollo de responder 600 solicitudes de certificados de uso del suelo en el año. Al 30 de septiembre ha respondido 380 y, en promedio, tarda 18 días por solicitud, aunque el procedimiento interno fija un máximo de 10 días. Una de las causas del retraso es que el aplicativo de consulta cartográfica, indispensable para expedir los certificados, presenta fallas frecuentes que pueden durar varias horas.", "items": [{"id": "CO-107", "niv": 1, "e": "Ante el rezago en la meta anual, la conducta que mejor refleja la orientación a resultados es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Orientación a resultados)", "o": [["A", "calcular cuántas solicitudes debe responder cada mes en el último trimestre y organizar su trabajo semanal con base en esa cifra.", "Refleja la competencia «Orientación a resultados» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en cumplir las funciones y los compromisos de la organización con eficacia, calidad y oportunidad. Refleja las conductas de asumir la responsabilidad por sus resultados y trabajar con objetivos claros y realistas: le faltan 220 solicitudes en tres meses, unas 74 por mes, y planear con esa cifra hace medible el esfuerzo.", true], ["B", "dar prioridad a las solicitudes más sencillas para subir rápido el número de respuestas y dejar las complejas para el año siguiente.", "Mejora la cifra, pero sacrifica la oportunidad y la calidad en los casos complejos. La competencia exige cumplir con eficacia, calidad y oportunidad, no solo con el número.", false], ["C", "solicitar a su jefe que gestione la reducción de la meta anual y que se reconozca en el informe el efecto de las fallas del aplicativo.", "No asume la responsabilidad por el resultado: busca ajustar la meta antes de intentar cumplirla. La competencia pide trabajar con objetivos claros y obtener los resultados esperados.", false]]}, {"id": "CO-108", "niv": 2, "e": "Para medir y comprobar si el rezago se está corrigiendo, la conducta más acorde con la orientación a resultados es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Orientación a resultados)", "o": [["A", "revisar el avance al cierre del año, cuando la oficina de planeación solicita el informe anual de gestión del Plan de Desarrollo municipal vigente.", "La revisión llega cuando ya no hay tiempo de corregir. La competencia incluye evaluar de forma regular el grado de consecución de los objetivos.", false], ["B", "preguntar a los usuarios en ventanilla si perciben que los certificados están saliendo más rápido que antes.", "Recoger la percepción del usuario es útil para el servicio, pero no mide con precisión el avance frente a la meta ni frente al tiempo del procedimiento.", false], ["C", "llevar un registro semanal de solicitudes recibidas, respondidas y días de respuesta, y compararlo con la meta y con el plazo del procedimiento.", "Refleja la competencia «Orientación a resultados» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en cumplir las funciones y los compromisos de la organización con eficacia, calidad y oportunidad. Corresponde a diseñar y utilizar indicadores para medir y comprobar los resultados y a evaluar regularmente la consecución de los objetivos, tanto en cantidad como en oportunidad.", true]]}, {"id": "CO-109", "niv": 3, "e": "Frente a las fallas frecuentes del aplicativo cartográfico, la conducta que mejor refleja la orientación a resultados es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Orientación a resultados)", "o": [["A", "documentar las fallas con fecha y efecto en los tiempos, y proponer a su jefe un mecanismo alterno de consulta mientras se corrige el aplicativo.", "Refleja la competencia «Orientación a resultados» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en cumplir las funciones y los compromisos de la organización con eficacia, calidad y oportunidad. Reúne las conductas de adoptar medidas para minimizar riesgos y plantear estrategias para alcanzar los resultados: la evidencia permite gestionar la solución y la alternativa evita que el rezago crezca.", true], ["B", "reportar cada falla a la mesa de ayuda de sistemas y esperar la solución, pues el retraso no depende de su gestión.", "Reportar es necesario, pero se limita a esperar y no asume la responsabilidad por sus resultados ni adopta medidas para reducir el riesgo de incumplir.", false], ["C", "expedir los certificados de predios ya consultados con la información guardada de la última consulta, aunque pueda estar desactualizada.", "Gana tiempo, pero expone a la entidad a expedir certificados con información imprecisa. La competencia exige que los productos se enmarquen en las normas y estándares de calidad de la entidad.", false]]}]}, {"comp": "comportamental", "rol": "general", "tag": "Competencias comportamentales (Decreto 815 de 2018) · Compromiso con la organización", "texto": "Usted es servidor de la oficina de talento humano de un municipio de sexta categoría. Una ola invernal dejó a cientos de familias damnificadas y la alcaldía necesita apoyo de todas las dependencias para registrar a las familias afectadas durante el fin de semana y los días siguientes. Usted tiene a cargo la liquidación de la nómina, que debe quedar lista el jueves para pagarse el viernes. Mientras tanto, en redes sociales circulan publicaciones que afirman, sin pruebas, que la alcaldía no ha entregado ninguna ayuda.", "items": [{"id": "CO-119", "niv": 1, "e": "El coordinador de gestión del riesgo pide voluntarios para el registro del sábado y usted no tiene tareas urgentes ese día. La conducta que mejor refleja el compromiso con la organización es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Compromiso con la organización)", "o": [["A", "esperar a que la alcaldía expida una orden formal de apoyo, ya que la gestión del riesgo no hace parte de sus funciones.", "Prioriza la formalidad sobre una necesidad urgente de la organización. La competencia incluye apoyar a la entidad en situaciones difíciles.", false], ["B", "ofrecerse para apoyar el registro del sábado, porque la emergencia lo requiere, e informarlo a su jefe inmediato.", "Refleja la competencia «Compromiso con la organización» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en alinear el propio comportamiento con las necesidades, prioridades y metas de la organización. Corresponde a apoyar a la organización en situaciones difíciles y tomar la iniciativa de colaborar con otras áreas cuando se requiere, manteniendo informado a su jefe.", true], ["C", "recomendar que la alcaldía contrate personal temporal para el registro, pues los servidores de otras áreas no conocen el procedimiento.", "Plantea una alternativa, pero no se involucra en la necesidad de la organización y supone un tiempo y un costo que la emergencia no permite.", false]]}, {"id": "CO-120", "niv": 2, "e": "El lunes le piden dedicar toda la semana al registro de damnificados. La conducta más acorde con el compromiso con la organización es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Compromiso con la organización)", "o": [["A", "dedicarse por completo al registro durante la semana, pues atender la emergencia prima sobre cualquier trámite interno de la dependencia.", "Apoya la emergencia, pero descuida la nómina, cuyo pago también es una prioridad de la entidad. La conducta asociada pide colaborar sin descuidar las propias tareas.", false], ["B", "excusarse de apoyar el registro para no poner en riesgo la nómina y explicar que no tiene disponibilidad esa semana.", "Protege su tarea, pero no colabora con la organización en una situación difícil cuando sí podría hacerlo en parte de su tiempo.", false], ["C", "asegurar que la nómina quede liquidada el jueves y apoyar el registro en el tiempo restante, avisando a ambos.", "Refleja la competencia «Compromiso con la organización» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en alinear el propio comportamiento con las necesidades, prioridades y metas de la organización. Refleja la conducta de tomar la iniciativa de colaborar con otras áreas cuando se requiere, sin descuidar las propias tareas: atiende las dos prioridades de la organización.", true]]}, {"id": "CO-121", "niv": 3, "e": "Un vecino le pregunta a usted si es cierto lo que dicen las redes sobre las ayudas. La conducta que mejor refleja el compromiso con la organización es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Compromiso con la organización)", "o": [["A", "contarle lo que le consta sobre las entregas y orientarlo al reporte oficial de ayudas que publica la alcaldía.", "Refleja la competencia «Compromiso con la organización» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en alinear el propio comportamiento con las necesidades, prioridades y metas de la organización. Corresponde a demostrar sentido de pertenencia y apoyar a la organización en situaciones difíciles, sin asumir una vocería que no le corresponde: da información cierta y remite a la fuente oficial.", true], ["B", "decirle que prefiere no opinar sobre el tema y que esos asuntos los maneja directamente la oficina de prensa de la alcaldía.", "Es prudente, pero pierde la oportunidad de apoyar a la organización con información que conoce de primera mano y de orientar al ciudadano hacia la fuente oficial.", false], ["C", "publicar desde su cuenta personal fotos de las entregas para desmentir las críticas y defender la gestión de la alcaldía.", "Busca defender a la entidad, pero asume una vocería institucional que no le corresponde y puede difundir información sin el respaldo de los canales oficiales.", false]]}]}, {"comp": "comportamental", "rol": "general", "tag": "Competencias comportamentales (Decreto 815 de 2018) · Orientación al usuario y al ciudadano", "texto": "Usted atiende el chat y el correo de la Secretaría de Tránsito de un municipio de primera categoría. Recibe a diario decenas de consultas: muchas están mal planteadas, y cerca del 40 % se refiere a cómo solicitar un acuerdo de pago de multas. Hoy un ciudadano le escribe preguntando si una fotodetección que recibió puede anularse porque, según él, la señal no era visible; usted no conoce el criterio que aplica la entidad en esos casos.", "items": [{"id": "CO-131", "niv": 1, "e": "Cuando una consulta llega mal planteada, la conducta que mejor refleja la orientación al usuario y al ciudadano es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Orientación al usuario y al ciudadano)", "o": [["A", "responderle con la información general de todos los trámites de la secretaría para que él elija el que corresponde.", "Muestra disposición, pero traslada al ciudadano el trabajo de interpretar y no atiende su necesidad específica.", false], ["B", "hacerle preguntas puntuales antes de responder, para identificar con precisión qué información necesita.", "Refleja la competencia «Orientación al usuario y al ciudadano» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en dirigir las decisiones y acciones a satisfacer las necesidades e intereses de los usuarios internos y externos y de los ciudadanos, según las responsabilidades de la entidad. Corresponde a escuchar activamente y valorar las necesidades del ciudadano: aclarar la consulta permite dar una respuesta pertinente y veraz.", true], ["C", "enviarle el enlace de preguntas frecuentes de la página web para que identifique allí la respuesta que necesita.", "Informa, pero sin comprender la necesidad concreta del ciudadano, que puede no estar cubierta en las preguntas frecuentes.", false]]}, {"id": "CO-132", "niv": 3, "e": "Frente al alto volumen de consultas sobre acuerdos de pago, la conducta más acorde con la orientación al usuario y al ciudadano es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Orientación al usuario y al ciudadano)", "o": [["A", "responder cada consulta sobre acuerdos de pago con el enlace al acto administrativo que regula ese trámite.", "Responde, pero remite a un texto normativo que difícilmente resuelve la duda práctica del ciudadano, y no incorpora la necesidad detectada en la gestión de la entidad.", false], ["B", "remitir esas consultas al área de cobro para que sean sus servidores quienes respondan directamente a los ciudadanos.", "Traslada la carga a otra área sin aportar una solución que facilite el trámite a los ciudadanos.", false], ["C", "proponer, con base en las preguntas recibidas, que se publique una guía paso a paso del trámite en los canales de la entidad.", "Refleja la competencia «Orientación al usuario y al ciudadano» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en dirigir las decisiones y acciones a satisfacer las necesidades e intereses de los usuarios internos y externos y de los ciudadanos, según las responsabilidades de la entidad. Refleja la conducta de incorporar las necesidades de usuarios y ciudadanos en los proyectos institucionales con visión de servicio a mediano plazo: lo que observa en el chat se convierte en una mejora para todos.", true]]}, {"id": "CO-133", "niv": 2, "e": "Ante la pregunta sobre la posible anulación de la fotodetección, la conducta que mejor refleja la orientación al usuario y al ciudadano es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Orientación al usuario y al ciudadano)", "o": [["A", "indicarle que no tiene certeza sobre ese punto y explicarle cómo presentar su solicitud para que el área competente la estudie.", "Refleja la competencia «Orientación al usuario y al ciudadano» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en dirigir las decisiones y acciones a satisfacer las necesidades e intereses de los usuarios internos y externos y de los ciudadanos, según las responsabilidades de la entidad. Corresponde a informar con veracidad y atender de forma oportuna la necesidad: reconoce el límite de lo que sabe y le da la ruta concreta para obtener una respuesta de fondo.", true], ["B", "responderle que, por regla general, las fotodetecciones no se anulan por ese motivo.", "Pretende evitar expectativas, pero afirma algo que usted no conoce. También falta a la veracidad.", false], ["C", "decirle que en casos parecidos las fotodetecciones suelen anularse, para darle tranquilidad mientras presenta formalmente su solicitud.", "Busca tranquilizarlo, pero da una información que no le consta. La competencia exige informar con veracidad.", false]]}]}, {"comp": "comportamental", "rol": "general", "tag": "Competencias comportamentales (Decreto 815 de 2018) · Adaptación al cambio", "texto": "La alcaldía de un municipio de primera categoría adoptó un nuevo modelo de atención: desde el próximo mes, las solicitudes se recibirán únicamente por la ventanilla única virtual, y los servidores de la ventanilla presencial pasarán a orientar a los ciudadanos en el uso de computadores de autoservicio instalados en la sede. Usted lleva 12 años recibiendo documentos en la ventanilla presencial. Algunos compañeros están inconformes con el cambio y temen que los ciudadanos mayores no logren usar la plataforma.", "items": [{"id": "CO-143", "niv": 2, "e": "Ante el anuncio del nuevo modelo, la conducta que mejor refleja la adaptación al cambio es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Adaptación al cambio)", "o": [["A", "seguir recibiendo en papel los documentos de los adultos mayores que lo prefieran, aunque el nuevo modelo no lo contemple.", "Tiene intención de servicio, pero se aparta de la decisión institucional. La competencia pide apoyar las nuevas decisiones; la necesidad de los mayores se atiende acompañándolos en el autoservicio.", false], ["B", "aprender el manejo de la plataforma antes de la fecha de inicio y practicar con compañeros cómo orientar a los ciudadanos.", "Refleja la competencia «Adaptación al cambio» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en afrontar con flexibilidad las situaciones nuevas y manejar los cambios de forma positiva y constructiva. Corresponde a aceptar y adaptarse a las nuevas situaciones y cooperar activamente en la implementación de nuevas formas de trabajo.", true], ["C", "pedir traslado a una dependencia que mantenga la atención presencial, donde su experiencia sea mejor aprovechada.", "Evita el cambio en lugar de afrontarlo con flexibilidad.", false]]}, {"id": "CO-144", "niv": 1, "e": "Frente a la inconformidad de algunos compañeros, la conducta más acorde con la adaptación al cambio es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Adaptación al cambio)", "o": [["A", "unirse a la solicitud de aplazar la implementación hasta que todos se sientan preparados para el nuevo modelo.", "Comprende la preocupación, pero no apoya a la entidad en la nueva decisión y retrasa su implementación.", false], ["B", "evitar opinar sobre el cambio con sus compañeros para no generar tensiones en el grupo de trabajo.", "Es prudente, pero desaprovecha la oportunidad de ayudar a sus compañeros a adaptarse.", false], ["C", "compartirles lo que ha aprendido de la plataforma y mostrarles cómo puede facilitar su trabajo.", "Refleja la competencia «Adaptación al cambio» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en afrontar con flexibilidad las situaciones nuevas y manejar los cambios de forma positiva y constructiva. Refleja la conducta de promover al grupo para que se adapte a las nuevas condiciones.", true]]}, {"id": "CO-145", "niv": 3, "e": "En las primeras semanas la plataforma presenta fallas intermitentes. La conducta que mejor refleja la adaptación al cambio es", "f": "Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018 (competencia común: Adaptación al cambio)", "o": [["A", "suspender la orientación en los computadores de autoservicio y pedir a los ciudadanos que regresen cuando la plataforma funcione bien.", "Ante la dificultad abandona el nuevo modelo y deja sin atención a los ciudadanos.", false], ["B", "registrar las fallas, reportarlas por el canal definido y orientar a los ciudadanos con las alternativas dispuestas por la entidad.", "Refleja la competencia «Adaptación al cambio» (Decreto 1083 de 2015, art. 2.2.4.7, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en afrontar con flexibilidad las situaciones nuevas y manejar los cambios de forma positiva y constructiva. Corresponde a responder al cambio con flexibilidad y cooperar activamente en la implementación de los nuevos procedimientos: aporta información para corregir y mantiene la atención.", true], ["C", "recibir de nuevo los documentos en papel mientras la plataforma se estabiliza, para no perjudicar a los ciudadanos.", "Su intención es proteger al ciudadano, pero revierte por su cuenta la decisión institucional en lugar de usar las alternativas dispuestas por la entidad.", false]]}]}, {"comp": "comportamental", "rol": "tecnico", "tag": "Competencias comportamentales (Decreto 815 de 2018) · Nivel técnico · Confiabilidad técnica", "texto": "Usted es técnico de sistemas de la alcaldía de un municipio de segunda categoría y da soporte a los equipos de todas las dependencias. Cada mes, el servidor de archivos compartidos se llena y los servidores no pueden guardar documentos. La alcaldía migrará los computadores a una nueva versión del sistema operativo dentro de dos meses. Además, el secretario general le pidió un concepto técnico sobre cuál de tres ofertas de licencias de software ofimático conviene adquirir; la alcaldía tiene una política de seguridad digital adoptada.", "items": [{"id": "CO-185", "niv": 2, "e": "Frente al servidor de archivos que se llena cada mes, la conducta que mejor refleja la confiabilidad técnica es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 4, sustituido por el art. 1 del Decreto 815 de 2018 (nivel técnico: Confiabilidad técnica)", "o": [["A", "analizar qué tipo de archivos ocupa el espacio y proponer, con sustento técnico, reglas de almacenamiento y depuración.", "Refleja la competencia «Confiabilidad técnica» (Decreto 1083 de 2015, art. 2.2.4.8, num. 4, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en contar con los conocimientos técnicos requeridos y aplicarlos a situaciones concretas de trabajo con altos estándares de calidad. Corresponde a resolver problemas utilizando los conocimientos técnicos de su especialidad para apoyar el cumplimiento de los objetivos.", true], ["B", "solicitar la compra de un disco de mayor capacidad para el servidor de archivos compartidos de la alcaldía.", "Aumenta la capacidad, pero sin diagnóstico el problema se repetirá cuando el nuevo disco se llene.", false], ["C", "borrar los archivos más antiguos de cada carpeta compartida hasta liberar el espacio necesario.", "Libera espacio, pero puede eliminar información institucional sin criterio técnico ni autorización.", false]]}, {"id": "CO-186", "niv": 1, "e": "Ante la migración del sistema operativo, la conducta más acorde con la confiabilidad técnica es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 4, sustituido por el art. 1 del Decreto 815 de 2018 (nivel técnico: Confiabilidad técnica)", "o": [["A", "estudiar la documentación técnica de la nueva versión y probarla en un equipo antes de la migración, para prever fallas.", "Refleja la competencia «Confiabilidad técnica» (Decreto 1083 de 2015, art. 2.2.4.8, num. 4, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en contar con los conocimientos técnicos requeridos y aplicarlos a situaciones concretas de trabajo con altos estándares de calidad. Refleja la conducta de mantener actualizado su conocimiento técnico para apoyar su gestión.", true], ["B", "pedir al proveedor que realice toda la migración, porque conoce mejor la nueva versión.", "Delega una tarea de su especialidad en lugar de actualizar sus conocimientos para el soporte posterior.", false], ["C", "aprender el manejo de la nueva versión durante la migración, a medida que se presenten los problemas en cada dependencia.", "Aprende de forma reactiva y expone a las dependencias a fallas que pudieron preverse.", false]]}, {"id": "CO-187", "niv": 3, "e": "Para el concepto sobre las licencias, la conducta que mejor refleja la confiabilidad técnica es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 4, sustituido por el art. 1 del Decreto 815 de 2018 (nivel técnico: Confiabilidad técnica)", "o": [["A", "recomendar la marca que usted ha usado durante años y cuyo desempeño conoce de primera mano.", "Se basa en su experiencia, pero no en una comparación objetiva frente a los requerimientos de la alcaldía.", false], ["B", "recomendar la oferta de menor precio, ya que las tres cumplen con las funciones básicas de ofimática.", "El precio es relevante, pero el concepto no compara los aspectos técnicos ni los lineamientos de la entidad.", false], ["C", "comparar las ofertas frente a criterios técnicos y a la política de seguridad digital, y emitir una recomendación sustentada.", "Refleja la competencia «Confiabilidad técnica» (Decreto 1083 de 2015, art. 2.2.4.8, num. 4, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en contar con los conocimientos técnicos requeridos y aplicarlos a situaciones concretas de trabajo con altos estándares de calidad. Corresponde a emitir conceptos técnicos claros, precisos, pertinentes y ajustados a los lineamientos normativos y organizacionales.", true]]}]}, {"comp": "comportamental", "rol": "tecnico", "tag": "Competencias comportamentales (Decreto 815 de 2018) · Nivel técnico · Disciplina", "texto": "Usted es técnico del laboratorio de calidad de agua de una corporación autónoma regional. El coordinador del laboratorio dio la instrucción de registrar cada muestra en el formato de cadena de custodia antes de abrir la nevera de transporte. El laboratorio está en proceso de auditoría de seguimiento a su acreditación, y esta semana un auditor observará directamente el trabajo de los técnicos. Además, hace diez días se publicó una nueva versión del procedimiento de uno de los métodos analíticos que usted aplica; un compañero sigue usando la versión anterior.", "items": [{"id": "CO-197", "niv": 1, "e": "Al final de la tarde llegan 15 muestras y usted tiene poco tiempo. La conducta que mejor refleja la disciplina es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 4, sustituido por el art. 1 del Decreto 815 de 2018 (nivel técnico: Disciplina)", "o": [["A", "registrar ahora solo las muestras de los trámites más urgentes y dejar las demás para la mañana siguiente.", "Prioriza con buena intención, pero aplica la instrucción solo en parte.", false], ["B", "diligenciar primero el formato de custodia de cada una de las 15 muestras y solo después abrir la nevera.", "Refleja la competencia «Disciplina» (Decreto 1083 de 2015, art. 2.2.4.8, num. 4, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en adaptarse a las políticas institucionales y generar información acorde con los procesos. Corresponde a recibir instrucciones y desarrollar las actividades de acuerdo con ellas, generando la información que exige el proceso.", true], ["C", "refrigerar primero todas las muestras y registrarlas en la cadena de custodia a primera hora del día siguiente.", "Busca conservar las muestras, pero altera el orden fijado en la instrucción del coordinador.", false]]}, {"id": "CO-198", "niv": 2, "e": "Frente a la observación directa del auditor, la conducta más acorde con la disciplina es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 4, sustituido por el art. 1 del Decreto 815 de 2018 (nivel técnico: Disciplina)", "o": [["A", "solicitar que la auditoría se haga sobre registros ya cerrados, para no interrumpir los análisis del día.", "Busca proteger la operación, pero limita una supervisión que forma parte del proceso de acreditación.", false], ["B", "pedir que la observación se haga a un técnico con más experiencia, que pueda responder mejor las preguntas del auditor.", "Evita exponerse, pero no acepta la supervisión sobre su propio trabajo.", false], ["C", "permitir la observación y trabajar como de costumbre, pues la supervisión hace parte de la acreditación.", "Refleja la competencia «Disciplina» (Decreto 1083 de 2015, art. 2.2.4.8, num. 4, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en adaptarse a las políticas institucionales y generar información acorde con los procesos. Refleja la conducta de aceptar la supervisión constante como parte del trabajo.", true]]}, {"id": "CO-199", "niv": 3, "e": "Respecto de la nueva versión del procedimiento analítico, la conducta que mejor refleja la disciplina es", "f": "Decreto 1083 de 2015, art. 2.2.4.8, num. 4, sustituido por el art. 1 del Decreto 815 de 2018 (nivel técnico: Disciplina)", "o": [["A", "aplicar la versión vigente del procedimiento y avisar a su compañero que fue publicada una nueva.", "Refleja la competencia «Disciplina» (Decreto 1083 de 2015, art. 2.2.4.8, num. 4, sustituido por el art. 1 del Decreto 815 de 2018), que consiste en adaptarse a las políticas institucionales y generar información acorde con los procesos. Corresponde a revisar de manera permanente los cambios en los procesos y adaptarse a las políticas institucionales.", true], ["B", "aplicar en paralelo las dos versiones durante un mes, para comparar resultados antes de adoptar la nueva versión.", "Busca seguridad técnica, pero mantiene en uso una versión que ya no está vigente.", false], ["C", "continuar con la versión anterior hasta que el coordinador programe la capacitación sobre los cambios.", "Espera una capacitación que no es condición para aplicar el procedimiento vigente ya publicado.", false]]}]}];
const CFG = {"titulo": "Simulacro 2 · Nivel técnico · CNSC Empleo Público", "modo": "simulacro", "minutos": 160, "componentes": {"estado_constitucion": "Estado y Constitución", "empleo_publico": "Empleo público, carrera y régimen disciplinario", "atencion_procedimiento": "Atención al ciudadano y procedimiento administrativo", "gestion_publica": "Gestión pública, MIPG, contratación y documentos", "entidades_territoriales": "Entidades territoriales, Bogotá D.C. y CAR", "comportamental": "Competencias comportamentales (Decreto 815 de 2018)"}, "niveles": {"1": "Básico", "2": "Intermedio", "3": "Avanzado"}, "roles": {"general": "Todos los niveles", "asistencial": "Nivel asistencial", "tecnico": "Nivel técnico", "profesional": "Nivel profesional"}, "clave": "tecnico-02.html"};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY = 'sim-cnsc:' + CFG.clave;
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}

const ITEMS = [];
DATA.forEach(c => c.items.forEach(it => { it.caso = c; ITEMS.push(it); }));

function justHTML(it){
  return '<div class="just">' + it.o.map(o => `<div><b>${o[0]}.</b> <span class="${o[3]?'okt':'not'}">${o[3]?'Es correcta.':'Es incorrecta.'}</span> ${esc(o[2])}</div>`).join('') +
    `<div class="src">Referencia: ${esc(it.f)}</div></div>`;
}
function itemHTML(it, n, mode){
  const r = ST.r[it.id];
  const reveal = mode === 'review' || (CFG.modo === 'practica' && r);
  let h = `<div class="item" id="i-${it.id}"><p class="enun"><span class="n">${n}.</span> <span class="niv">${CFG.niveles[it.niv]}</span> ${esc(it.e)}</p>`;
  it.o.forEach(o => {
    let cls = '';
    if (reveal) { if (o[3]) cls = 'ok'; else if (r === o[0]) cls = 'no'; }
    else if (r === o[0]) cls = 'sel';
    h += `<button class="op ${cls}" data-id="${it.id}" data-l="${o[0]}" ${reveal?'disabled':''}><span class="l">${o[0]}.</span><span>${esc(o[1])}</span></button>`;
  });
  if (reveal) {
    if (mode === 'review') h += `<div class="${r===keyOf(it)?'res-ok':'res-no'}" style="font-size:14px;margin-top:4px">${r ? (r===keyOf(it)?'Respondiste ' + r + ': correcto.':'Respondiste ' + r + '. La respuesta correcta es ' + keyOf(it) + '.') : 'Sin responder. La respuesta correcta es ' + keyOf(it) + '.'}</div>`;
    h += justHTML(it);
  }
  return h + '</div>';
}
const keyOf = it => it.o.find(o => o[3])[0];

function renderList(list, mode){
  let h = '', last = null, n = 0;
  list.forEach(it => {
    n++;
    if (it.caso !== last) { last = it.caso; h += `<div class="caso"><div class="tag">${esc(it.caso.tag)}</div><p>${esc(it.caso.texto)}</p></div>`; }

  });
  return h;
}

  const comps = Object.entries(CFG.componentes).map(([k,v]) => `<option value="${k}" ${FILTRO.comp===k?'selected':''}>${esc(v)}</option>`).join('');

  const list = ITEMS.filter(it => (!FILTRO.comp || it.caso.comp===FILTRO.comp) && (!FILTRO.niv || String(it.niv)===FILTRO.niv) && (!FILTRO.rol || it.caso.rol===FILTRO.rol || it.caso.rol==='general'));
  const resp = list.filter(it => ST.r[it.id]); const ok = resp.filter(it => ST.r[it.id]===keyOf(it));
  $('#main').innerHTML = `<div class="panel"><p style="margin-top:0">Elige un tema, tu nivel de empleo y la dificultad. Al responder verás de inmediato si acertaste y la explicación de cada opción.</p>
  <div class="row"><select id="fc"><option value="">Todos los temas</option>${comps}</select>
  <select id="fn"><option value="">Todas las dificultades</option>${nivs}</select>
  <select id="fr"><option value="">Todos los niveles de empleo</option>${['asistencial','tecnico','profesional'].map(k => `<option value="${k}" ${FILTRO.rol===k?'selected':''}>${esc(CFG.roles[k])} (y temas comunes)</option>`).join('')}</select>
  <button class="btn sec" id="borrar">Borrar mis respuestas</button></div>
  <p class="stat" id="pst" style="margin-bottom:0">${list.length} preguntas · respondidas ${resp.length} · aciertos ${ok.length}${resp.length? ' (' + Math.round(100*ok.length/resp.length) + ' %)':''}</p></div>` + renderList(list, 'practica');
  $('#prog').textContent = `${ok.length}/${resp.length} aciertos`;
  ['fc','fn','fr'].forEach((id,i) => $('#'+id).onchange = e => { FILTRO[['comp','niv','rol'][i]] = e.target.value; ST.f = FILTRO; save(); practica(); });
  LIST = list;
  $('#borrar').onclick = () => { list.forEach(it => delete ST.r[it.id]); save(); practica(); };
}

// ---------- SIMULACRO ----------
let tick = null;
function inicio(){
  const n = ITEMS.length, cnt = {};
  ITEMS.forEach(it => cnt[it.caso.comp] = (cnt[it.caso.comp]||0) + 1);
  const h = Math.floor(CFG.minutos/60), m = CFG.minutos%60;
  $('#main').innerHTML = `<div class="panel"><h2 style="margin-top:0;color:var(--pri)">Instrucciones</h2>
  <p>Este simulacro tiene <b>${n} preguntas</b> en el formato de Prueba de Juicio Situacional: un caso, enunciados que se completan y tres opciones con una sola respuesta correcta.</p>
  <table>${Object.entries(cnt).map(([k,v]) => `<tr><td>${esc(CFG.componentes[k])}</td><td class="r">${v}</td></tr>`).join('')}</table>
  <p>Tiempo sugerido: <b>${h ? h + ' h ' : ''}${m ? m + ' min' : ''}</b> (unos ${Math.round(CFG.minutos*60/n/6)/10} minutos por pregunta). Cuando se acaba el tiempo puedes seguir, pero el cronómetro lo indica.</p>
  <p>Tus respuestas se guardan en este navegador. Al terminar verás tu puntaje por componente y por dificultad, y la explicación de cada pregunta.</p>
  <button class="btn" id="go">${ST.t0 ? 'Continuar el simulacro' : 'Comenzar'}</button></div>`;
  $('#prog').textContent = `${n} preguntas`;
  $('#go').onclick = () => { if (!ST.t0) { ST.t0 = Date.now(); save(); } examen(); };
}
function reloj(){
  const rest = CFG.minutos*60 - Math.floor((Date.now() - ST.t0)/1000);
  const a = Math.abs(rest), hh = Math.floor(a/3600), mm = Math.floor(a%3600/60), ss = a%60;
  const t = (rest < 0 ? '+' : '') + (hh ? hh + ':' : '') + String(mm).padStart(2,'0') + ':' + String(ss).padStart(2,'0');
  $('#timer').textContent = rest < 0 ? 'Tiempo cumplido ' + t : '⏱ ' + t;
  $('#timer').classList.toggle('low', rest < 600);
}
function examen(){
  $('#main').innerHTML = renderList(ITEMS, 'examen') + `<div class="panel"><button class="btn" id="fin">Terminar y calificar</button></div>`;
  progreso(); reloj(); clearInterval(tick); tick = setInterval(reloj, 1000);
  $('#fin').onclick = () => {
    const faltan = ITEMS.length - Object.keys(ST.r).filter(k => ITEMS.some(i => i.id===k)).length;
    $('#mtxt').textContent = faltan ? `Te faltan ${faltan} preguntas por responder. ¿Quieres calificar de todos modos?` : '¿Quieres terminar y ver tu calificación?';
    $('#modal').classList.remove('hide');
  };
}
function progreso(){
  const r = ITEMS.filter(it => ST.r[it.id]).length;
  $('#prog').textContent = `Respondidas ${r}/${ITEMS.length}`;
}
$('#mno').onclick = () => $('#modal').classList.add('hide');
$('#msi').onclick = () => { $('#modal').classList.add('hide'); ST.fin = Date.now(); save(); resultados(); };
function resultados(){
  clearInterval(tick);
  const ok = ITEMS.filter(it => ST.r[it.id] === keyOf(it)).length;
  const pct = Math.round(1000*ok/ITEMS.length)/10;
  const g = (fn, lab) => { const m = {}; ITEMS.forEach(it => { const k = fn(it); m[k] = m[k] || [0,0]; m[k][1]++; if (ST.r[it.id]===keyOf(it)) m[k][0]++; });
    return Object.entries(m).map(([k,v]) => `<tr><td>${esc(lab(k))}</td><td class="r">${v[0]}/${v[1]}</td><td class="r">${Math.round(100*v[0]/v[1])} %</td></tr>`).join(''); };
  const mins = Math.round(((ST.fin||Date.now()) - ST.t0)/60000);
  $('#timer').textContent = `Tiempo usado: ${Math.floor(mins/60) ? Math.floor(mins/60) + ' h ' : ''}${mins%60} min`;
  $('#prog').textContent = `${ok}/${ITEMS.length} aciertos`;
  $('#main').innerHTML = `<div class="panel"><div class="big">${String(pct).replace('.',',')} %</div>
  <p style="margin-top:4px">${ok} de ${ITEMS.length} respuestas correctas. ${pct >= 75 ? 'Muy buen resultado: repasa las explicaciones de tus errores para afianzarlo.' : pct >= 65 ? 'Vas bien, pero con poco margen: refuerza los componentes con menor porcentaje.' : 'Todavía no estás en zona segura: practica por tema los componentes con menor porcentaje.'}</p>
  <p class="aviso">Referencia: en los procesos Distrito Capital 7, Territorial 14 y CAR, la prueba de competencias funcionales es eliminatoria con mínimo de 65 puntos, y la comportamental es clasificatoria. Este porcentaje de aciertos es una guía de preparación; la CNSC calcula su puntaje con su propia escala, comparando con los demás aspirantes al mismo empleo.</p>
  <h3>Por componente</h3><table>${g(it => it.caso.comp, k => CFG.componentes[k])}</table>
  <h3>Por dificultad</h3><table>${g(it => it.niv, k => CFG.niveles[k])}</table>
  <div class="row" style="margin-top:14px"><button class="btn" id="solo">Ver solo mis errores</button><button class="btn sec" id="todas">Ver todas</button><button class="btn sec" id="otra">Reiniciar el simulacro</button></div></div><div id="rev"></div>`;
  const rev = errs => { const l = errs ? ITEMS.filter(it => ST.r[it.id] !== keyOf(it)) : ITEMS; $('#rev').innerHTML = renderList(l, 'review'); };
  rev(true);
  $('#solo').onclick = () => rev(true); $('#todas').onclick = () => rev(false);
  $('#otra').onclick = () => { ST = {r:{}}; save(); inicio(); window.scrollTo(0,0); };
}

document.addEventListener('click', e => {
  const b = e.target.closest('button.op'); if (!b || b.disabled) return;
  ST.r[b.dataset.id] = b.dataset.l; save();
  const it = ITEMS.find(i => i.id === b.dataset.id);
  const n = b.closest('.item').querySelector('.n').textContent.replace('.','');
  b.closest('.item').outerHTML = itemHTML(it, n, CFG.modo === 'practica' ? 'practica' : 'examen');
  if (CFG.modo === 'practica') { const resp = LIST.filter(i => ST.r[i.id]); const ok = resp.filter(i => ST.r[i.id]===keyOf(i)).length; $('#prog').textContent = `${ok}/${resp.length} aciertos`; $('#pst').textContent = `${LIST.length} preguntas · respondidas ${resp.length} · aciertos ${ok} (${Math.round(100*ok/resp.length)} %)`; }
  else progreso();
});

if (CFG.modo === 'practica') practica();
else if (ST.fin) resultados();
else if (ST.t0) examen();
else inicio();
</script>
</body>
</html>
