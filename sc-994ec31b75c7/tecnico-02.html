<!doctype html>

<title>Simulacro 2 · Nivel técnico · CNSC Empleo Público</title>
<style>
:root{--bg:#f6f8fb;--card:#fff;--ink:#1d2433;--mute:#5a6478;--line:#dbe1ea;--pri:#0b3d6e;--pri2:#1660a8;--ok:#0d6b3a;--okbg:#e6f4ec;--no:#9b1c1c;--nobg:#fbeaea;--sel:#e8f0fa}
@media (prefers-color-scheme: dark){:root{--bg:#10151d;--card:#18202b;--ink:#e6ebf2;--mute:#9aa6b8;--line:#2a3545;--pri:#7fb3ea;--pri2:#9cc6f2;--ok:#7fd3a3;--okbg:#16301f;--no:#f2a3a3;--nobg:#3a1c1c;--sel:#1e2d40}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px}
.hwrap{max-width:860px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
h1{font-size:17px;margin:0;color:var(--pri)}
.stat{font-size:14px;color:var(--mute)}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--pri)}
.timer.low{color:var(--no)}
main{max-width:860px;margin:0 auto;padding:16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin:0 0 16px}
.caso{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--pri);border-radius:10px;padding:14px 16px;margin:22px 0 10px}
.tag{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--pri);font-weight:700}
.caso p{margin:6px 0 0;white-space:pre-line}
.item{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0}
.enun{margin:0 0 8px}
.n{font-weight:700;color:var(--pri)}
.niv{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-right:4px;white-space:nowrap}
.op{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:6px 0;cursor:pointer;background:transparent;width:100%;text-align:left;color:inherit;font:inherit}
.op:hover{border-color:var(--pri2)}
.op .l{font-weight:700;min-width:20px}
.op.sel{background:var(--sel);border-color:var(--pri2)}
.op.ok{background:var(--okbg);border-color:var(--ok)}
.op.no{background:var(--nobg);border-color:var(--no)}
.op[disabled]{cursor:default}
.just{font-size:14px;margin:8px 0 0;padding:8px 10px;border-top:1px dashed var(--line)}
.just div{margin:4px 0}
.just .okt{color:var(--ok);font-weight:700}
.just .not{color:var(--no);font-weight:700}
.src{font-size:13px;color:var(--mute);margin-top:6px}
button.btn{background:var(--pri);color:var(--card);border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer}
button.btn.sec{background:transparent;color:var(--pri);border:1px solid var(--pri)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
select{font:inherit;padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);max-width:100%}
table{border-collapse:collapse;width:100%;font-size:15px}
td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
.big{font-size:40px;font-weight:800;color:var(--pri);line-height:1.1}
.aviso{font-size:13px;color:var(--mute)}
.hide{display:none !important}
.res-ok{color:var(--ok);font-weight:700}.res-no{color:var(--no);font-weight:700}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal .panel{max-width:420px}
footer{max-width:860px;margin:0 auto;padding:8px 16px 40px;font-size:12px;color:var(--mute)}
</style>
</head>

<header><div class="hwrap"><h1 id="tit"></h1><div class="row stat"><span id="prog"></span><span id="timer" class="timer"></span></div></div></header>
<main id="main"></main>
<div id="modal" class="modal hide"><div class="panel"><p id="mtxt"></p><div class="row"><button class="btn" id="msi">Sí, calificar</button><button class="btn sec" id="mno">Seguir respondiendo</button></div></div></div>
<footer><a href="./" style="color:var(--pri);font-weight:600">← Volver al menú</a><br><br>Material de preparación independiente. No está afiliado a la Comisión Nacional del Servicio Civil (CNSC) ni a ninguna entidad pública, y no contiene preguntas reales de la prueba.</footer>
<script>
const DATA = [{"comp": "estado_constitucion", "rol": "general", "tag": "Estado y Constitución · Igualdad y enfoque diferencial", "texto": "Usted es auxiliar administrativo de una subdirección local de la Secretaría Distrital de Integración Social de Bogotá, encargada de inscribir personas en cursos gratuitos de alfabetización digital. Durante la jornada ocurre lo siguiente: un compañero se niega a inscribir a un ciudadano porque este llevaba una camiseta de un partido político contrario al suyo; una ciudadana con discapacidad visual pide que la guía del curso se le entregue en un formato que pueda leer con su lector de pantalla; y un contratista propone excluir de los cursos a los mayores de 60 años porque, según él, «aprenden más lento y ocupan cupos».", "items": [{"id": "EC-104", "niv": 1, "e": "Ante la negativa del compañero a inscribir al ciudadano por su afinidad política, usted debe advertirle que", "f": "Constitución Política, art. 13", "o": [["A", "debe remitir al ciudadano a otra subdirección local para evitar un conflicto de intereses.", "No existe conflicto de intereses por la afinidad política del ciudadano. Remitirlo a otra sede es un trato diferente basado en su opinión política, prohibido por el artículo 13.", false], ["B", "todas las personas deben recibir la misma protección y trato de las autoridades, sin discriminación por opinión política.", "El artículo 13 de la Constitución dispone que todas las personas recibirán la misma protección y trato de las autoridades, sin discriminación por razones, entre otras, de opinión política o filosófica.", true], ["C", "puede negarse si el ciudadano hace propaganda dentro de la sede, pues los servidores públicos deben mantener la neutralidad política.", "La neutralidad política es un deber del servidor, no un motivo para negar un servicio al ciudadano. Llevar una prenda alusiva a un partido no autoriza un trato diferente en el acceso al curso.", false]]}, {"id": "EC-105", "niv": 2, "e": "Frente a la solicitud de la ciudadana con discapacidad visual, la actuación que corresponde es", "f": "Ley 1618 de 2013, art. 1; Constitución Política, art. 13", "o": [["A", "entregarle la guía en un formato accesible, como un ajuste razonable que le permita participar en igualdad de condiciones.", "La Ley 1618 de 2013 (art. 1) tiene por objeto garantizar el ejercicio efectivo de los derechos de las personas con discapacidad mediante medidas de inclusión, acción afirmativa y ajustes razonables, eliminando toda forma de discriminación por discapacidad. Adaptar el formato es un ajuste razonable.", true], ["B", "inscribirla en un grupo separado solo para personas con discapacidad, con un horario distinto.", "Separarla del curso general no elimina la barrera (el formato de la guía) y crea una segregación no solicitada. La inclusión busca que participe junto con los demás, con los apoyos necesarios.", false], ["C", "pedirle que asista con un acompañante que le lea la guía, pues la entidad no está obligada a modificar sus formatos.", "Trasladar a la ciudadana la carga de conseguir un lector desconoce el deber de eliminar barreras. La Ley 1618 de 2013 ordena garantizar sus derechos mediante medidas de inclusión, acción afirmativa y ajustes razonables.", false]]}, {"id": "EC-106", "niv": 3, "e": "Sobre la propuesta del contratista de excluir a los mayores de 60 años, lo correcto es señalar que", "f": "Constitución Política, art. 13 (jurisprudencia constitucional sobre el carácter enunciativo de los criterios del inciso 1)", "o": [["A", "es válida si se publica en la convocatoria antes de abrir las inscripciones.", "Publicar una regla discriminatoria no la vuelve constitucional. La publicidad no sustituye la justificación objetiva y razonable que exige cualquier trato diferente.", false], ["B", "es válida, porque la edad no figura entre los criterios de discriminación que enumera expresamente el artículo 13.", "La lista del artículo 13 no es taxativa; cualquier trato diferente debe tener una justificación objetiva y razonable. La ausencia de la edad en la enumeración no vuelve legítima una exclusión arbitraria.", false], ["C", "es contraria a la igualdad, porque introduce un trato diferente sin justificación objetiva y razonable.", "El artículo 13 garantiza los mismos derechos y oportunidades a todas las personas. Excluir a un grupo por un prejuicio sobre su capacidad de aprender, en un curso gratuito sin requisitos técnicos, es un trato diferente sin justificación objetiva y razonable, aunque la edad no esté en la lista del artículo.", true]]}]}, {"comp": "estado_constitucion", "rol": "general", "tag": "Estado y Constitución · Estructura del Estado: ramas y órganos autónomos", "texto": "Usted es técnico del área de talento humano de una alcaldía de segunda categoría y prepara el módulo de inducción para el personal que ingresará por concurso. El borrador heredado de una administración anterior contiene varias afirmaciones dudosas: que «el poder público tiene cuatro ramas, incluida la de control»; que «la personería es una oficina de la Secretaría de Gobierno»; y que «la carrera administrativa del municipio la administra el Departamento Administrativo de la Función Pública». Su jefe le pide corregir el material antes de la jornada.", "items": [{"id": "EC-125", "niv": 1, "e": "Al explicar la estructura del Estado según la Constitución, el módulo debe indicar que", "f": "Constitución Política, art. 113", "o": [["A", "existen cuatro ramas del poder público: legislativa, ejecutiva, judicial y de control fiscal y disciplinario.", "La Constitución reconoce solo tres ramas. Los órganos de control no forman una rama; son órganos autónomos e independientes (arts. 113 y 117).", false], ["B", "los órganos de control hacen parte de la rama ejecutiva, porque vigilan a la administración pública.", "Vigilar a la administración no convierte a los órganos de control en parte de la rama ejecutiva. El artículo 113 los ubica fuera de las ramas, como órganos autónomos e independientes.", false], ["C", "además de las tres ramas existen órganos autónomos e independientes, y todos colaboran armónicamente.", "El artículo 113 de la Constitución dispone que son ramas del poder público la legislativa, la ejecutiva y la judicial, que además existen otros órganos autónomos e independientes para las demás funciones del Estado, y que los órganos tienen funciones separadas pero colaboran armónicamente.", true]]}, {"id": "EC-126", "niv": 2, "e": "Sobre la personería municipal, el módulo debe presentarla como", "f": "Constitución Política, art. 118; Ley 136 de 1994, art. 178", "o": [["A", "la entidad que ejerce en el municipio funciones de Ministerio Público, bajo dirección del Procurador.", "El artículo 118 de la Constitución menciona a los personeros municipales entre quienes ejercen el Ministerio Público, y el artículo 178 de la Ley 136 de 1994 dispone que el personero ejerce esas funciones en el municipio bajo la dirección suprema del Procurador General de la Nación.", true], ["B", "una dependencia de la Secretaría de Gobierno, sometida a la dirección jerárquica del alcalde y a su manual de funciones.", "La personería no depende del alcalde. El artículo 118 la incluye en el Ministerio Público y el artículo 178 de la Ley 136 de 1994 señala que el personero actúa bajo la dirección suprema del Procurador General.", false], ["C", "una oficina seccional de la Contraloría General de la República en el municipio.", "La Contraloría es el otro órgano de control, encargado de la gestión fiscal (art. 119). La personería pertenece al Ministerio Público, no a la Contraloría.", false]]}, {"id": "EC-127", "niv": 1, "e": "Respecto de la entidad responsable de administrar y vigilar la carrera administrativa de los empleados de la alcaldía, el módulo debe corregirse para indicar que es", "f": "Constitución Política, art. 130", "o": [["A", "la Procuraduría General de la Nación, por medio de los personeros.", "La Procuraduría vigila la conducta oficial de los servidores; no administra la carrera administrativa, función que el artículo 130 asigna a la Comisión Nacional del Servicio Civil.", false], ["B", "la Comisión Nacional del Servicio Civil, por mandato constitucional.", "El artículo 130 de la Constitución dispone que la Comisión Nacional del Servicio Civil es responsable de la administración y vigilancia de las carreras de los servidores públicos, excepto las que tengan carácter especial.", true], ["C", "el Departamento Administrativo de la Función Pública.", "Función Pública formula políticas de empleo público, pero la Constitución asigna la administración y vigilancia de la carrera a la Comisión Nacional del Servicio Civil (art. 130).", false]]}]}, {"comp": "estado_constitucion", "rol": "general", "tag": "Estado y Constitución · Contralorías territoriales y responsabilidad fiscal", "texto": "Usted es técnico de la oficina de control interno de un instituto descentralizado de Bogotá. La Contraloría de Bogotá detectó pagos duplicados a un contratista por 85 millones de pesos y anunció que abrirá un proceso. Un directivo pregunta qué autoridad establece la responsabilidad por ese detrimento y quién vigila, a su vez, la gestión fiscal de la propia Contraloría de Bogotá. Además, una veeduría ciudadana considera que la contraloría territorial ha actuado sin objetividad en otro asunto y pregunta qué puede hacer.", "items": [{"id": "EC-140", "niv": 1, "e": "Para establecer la responsabilidad derivada del detrimento por los pagos duplicados, la autoridad competente es", "f": "Constitución Política, arts. 268, num. 5, y 272", "o": [["A", "la Personería de Bogotá, mediante un proceso disciplinario contra el servidor que ordenó los pagos.", "El proceso disciplinario juzga la conducta del servidor frente a sus deberes, pero no establece la responsabilidad fiscal por el detrimento patrimonial.", false], ["B", "la Fiscalía General, mediante una investigación penal.", "La Fiscalía investiga delitos. La responsabilidad fiscal por el detrimento corresponde a la contraloría competente; ambos procesos pueden coexistir.", false], ["C", "la Contraloría de Bogotá, mediante el proceso de responsabilidad fiscal a su cargo.", "El numeral 5 del artículo 268 atribuye al Contralor establecer la responsabilidad derivada de la gestión fiscal, imponer sanciones pecuniarias y ejercer jurisdicción coactiva; el artículo 272 asigna esas funciones, en lo pertinente, a los contralores distritales.", true]]}, {"id": "EC-141", "niv": 2, "e": "Sobre quién vigila la gestión fiscal de la Contraloría de Bogotá, lo correcto es responder que corresponde", "f": "Constitución Política, art. 274", "o": [["A", "a la Contraloría General de la República, como superior de las contralorías territoriales.", "La Contraloría General no es superior jerárquico de las contralorías territoriales, y la vigilancia de la gestión fiscal de estas corresponde a la Auditoría General (art. 274).", false], ["B", "a la Auditoría General de la República, por disposición constitucional.", "El artículo 274 de la Constitución dispone que la vigilancia de la gestión fiscal de la Contraloría General y de todas las contralorías territoriales la ejerce el Auditor General de la República.", true], ["C", "al Concejo de Bogotá, que eligió al contralor distrital.", "El concejo elige al contralor (art. 272), pero no vigila la gestión fiscal de la contraloría; esa función es del Auditor General.", false]]}, {"id": "EC-142", "niv": 3, "e": "Ante la falta de objetividad que la veeduría atribuye a la contraloría territorial, una vía prevista en el ordenamiento es", "f": "Constitución Política, art. 268, num. 14 (modificado por el Acto Legislativo 4 de 2019); los casos excepcionales los define la ley", "o": [["A", "pedir a la Contraloría General que intervenga en los casos excepcionales previstos por la ley.", "El numeral 14 del artículo 268 de la Constitución, modificado por el Acto Legislativo 4 de 2019, permite al Contralor General intervenir en los casos excepcionales previstos por la ley en las funciones de vigilancia y control de las contralorías territoriales, y señala que esa intervención puede ser solicitada, entre otros, por la ciudadanía mediante cualquiera de los mecanismos de participación ciudadana. La ley define los casos y el procedimiento.", true], ["B", "solicitar al concejo distrital que realice directamente la auditoría fiscal del caso.", "El concejo ejerce control político; no realiza auditorías fiscales, que son función técnica de las contralorías.", false], ["C", "pedir a la Procuraduría que asuma el control fiscal de los asuntos en los que la contraloría no fue objetiva.", "La Procuraduría ejerce control disciplinario y no puede asumir el control fiscal. La intervención en las funciones de las contralorías territoriales corresponde a la Contraloría General.", false]]}]}, {"comp": "estado_constitucion", "rol": "general", "tag": "Estado y Constitución · Desconcentración y descentralización", "texto": "Usted es técnico administrativo de la oficina de planeación de un departamento. La corporación autónoma regional con jurisdicción en el departamento trasladó a sus direcciones territoriales, ubicadas en tres municipios alejados, la recepción y el trámite de solicitudes, sin que el director general deje de orientarlas. A su vez, la asamblea estudia crear un instituto departamental de deportes como establecimiento público, y el gobernador quiere crear otra entidad que preste servicios de impresión y publicaciones en competencia con empresas privadas.", "items": [{"id": "EC-152", "niv": 2, "e": "La decisión de la corporación de radicar funciones en sus direcciones territoriales corresponde a la figura de", "f": "Ley 489 de 1998, art. 8", "o": [["A", "la delegación, porque el director general transfiere funciones a otros servidores mediante acto escrito.", "La delegación transfiere el ejercicio de funciones a colaboradores o a otras autoridades. El artículo 8 de la Ley 489 aclara que la desconcentración no implica delegación.", false], ["B", "la descentralización por servicios, porque las direcciones territoriales adquieren autonomía.", "La descentralización por servicios crea entidades con personería jurídica y autonomía propias. Las direcciones territoriales siguen siendo parte de la misma corporación.", false], ["C", "la desconcentración, porque radica competencias en dependencias ubicadas fuera de la sede principal.", "El artículo 8 de la Ley 489 de 1998 define la desconcentración como la radicación de competencias y funciones en dependencias ubicadas fuera de la sede principal del organismo, sin perjuicio de las potestades de orientación de los jefes superiores; no implica delegación.", true]]}, {"id": "EC-153", "niv": 1, "e": "Para crear el instituto departamental de deportes como establecimiento público se requiere", "f": "Ley 489 de 1998, art. 69", "o": [["A", "una ordenanza de la asamblea departamental, o su autorización, por ser entidad del departamento.", "El artículo 69 de la Ley 489 de 1998 dispone que las entidades descentralizadas se crean, en el orden nacional, por la ley, y en el orden departamental, distrital y municipal, por la ordenanza o el acuerdo, o con su autorización.", true], ["B", "una ley de la República, por tratarse de una entidad descentralizada.", "La ley crea las entidades descentralizadas del orden nacional. Las del orden departamental se crean por ordenanza o con su autorización (art. 69).", false], ["C", "un decreto del gobernador, sin necesidad de autorización previa de la asamblea departamental.", "El gobernador no puede crear por sí solo entidades descentralizadas. El artículo 69 exige la ordenanza o la autorización de la asamblea.", false]]}, {"id": "EC-154", "niv": 3, "e": "La entidad que prestará servicios de impresión en competencia con empresas privadas, conforme a las reglas del derecho privado, corresponde a la figura de", "f": "Ley 489 de 1998, arts. 70 y 85", "o": [["A", "establecimiento público, porque presta un servicio con patrimonio independiente.", "Los establecimientos públicos atienden principalmente funciones administrativas y prestan servicios públicos conforme al derecho público (art. 70), no actividades comerciales regidas por el derecho privado.", false], ["B", "empresa industrial y comercial del Estado, por su actividad comercial regida por el derecho privado.", "El artículo 85 de la Ley 489 de 1998 define las empresas industriales y comerciales del Estado como organismos que desarrollan actividades de naturaleza industrial o comercial y de gestión económica conforme a las reglas del derecho privado, con personería jurídica, autonomía y capital independiente.", true], ["C", "unidad administrativa especial sin personería jurídica, adscrita a la secretaría de hacienda.", "Una unidad sin personería jurídica pertenece al sector central y no es la figura prevista para actividades comerciales en competencia regidas por el derecho privado.", false]]}]}, {"comp": "estado_constitucion", "rol": "general", "tag": "Estado y Constitución · Rendición de cuentas", "texto": "Usted es profesional universitario de la oficina de planeación de una gobernación y apoya la preparación de la rendición de cuentas anual del gobernador. En la reunión de preparación surgen tres asuntos: el jefe de prensa propone que el ejercicio consista solo en publicar un video con las cifras de gestión; durante la audiencia los ciudadanos formularán preguntas que no alcanzarán a responderse en el evento; y un asesor pregunta en qué instrumento de planeación debe quedar la estrategia de rendición de cuentas.", "items": [{"id": "EC-164", "niv": 1, "e": "Frente a la propuesta del jefe de prensa, debe señalarse que la rendición de cuentas se fundamenta en los elementos de", "f": "Ley 1757 de 2015, art. 49", "o": [["A", "información y transparencia, que se satisfacen con la publicación en la página web de la entidad.", "La información es solo uno de los elementos. La Ley 1757 exige además lenguaje comprensible, diálogo e incentivos.", false], ["B", "información, lenguaje comprensible al ciudadano, diálogo e incentivos.", "El artículo 49 de la Ley 1757 de 2015 establece que la rendición de cuentas se fundamenta en los elementos de información, lenguaje comprensible al ciudadano, diálogo e incentivos. Un video sin espacio de diálogo no cumple todos ellos.", true], ["C", "publicidad, eficacia y economía, que se cumplen con la difusión de las cifras de gestión.", "Publicidad, eficacia y economía son principios de la función administrativa (art. 209 C. P.), no los elementos de la rendición de cuentas que fija la Ley 1757.", false]]}, {"id": "EC-165", "niv": 1, "e": "Las preguntas de los ciudadanos que no se respondan en el evento deben contestarse por escrito en el término de", "f": "Ley 1757 de 2015, art. 56, lit. f", "o": [["A", "cinco días, y publicarse en la página web.", "La ley no fija cinco días. El literal f del artículo 56 establece quince días para las respuestas escritas.", false], ["B", "quince días, y publicarse en la página web o en los medios oficiales de difusión.", "El literal f del artículo 56 de la Ley 1757 de 2015 prevé respuestas escritas, en el término de quince días, a las preguntas de los ciudadanos formuladas en el marco del proceso de rendición de cuentas, y su publicación en la página web o en los medios oficiales de la entidad.", true], ["C", "treinta días, y remitirse a la asamblea departamental para su evaluación.", "El término es de quince días y la respuesta se publica en los medios de la entidad. La asamblea evalúa el informe anual del gobernador, no cada respuesta.", false]]}, {"id": "EC-166", "niv": 2, "e": "Al asesor debe responderse que la estrategia anual de rendición de cuentas debe incluirse en", "f": "Ley 1757 de 2015, art. 52; Ley 1474 de 2011, art. 73 (modificado por el art. 31 de la Ley 2195 de 2022); Decreto 1081 de 2015, art. 2.1.4.4.1.5 (adicionado por el Decreto 1122 de 2024)", "o": [["A", "el plan anual de adquisiciones, porque implica contratar la logística de la audiencia.", "El plan de adquisiciones programa compras; no es el instrumento donde la ley ordena incluir la estrategia de rendición de cuentas.", false], ["B", "el plan de desarrollo departamental, como un programa del componente estratégico.", "La Ley 1757 no ordena incluir la estrategia anual en el plan de desarrollo cuatrienal, sino en el instrumento anticorrupción de la entidad, hoy el Programa de Transparencia y Ética Pública (antes Plan Anticorrupción y de Atención al Ciudadano).", false], ["C", "el Programa de Transparencia y Ética Pública (antes Plan Anticorrupción y de Atención al Ciudadano), según la ley de participación y su reglamentación vigente.", "El artículo 52 de la Ley 1757 de 2015 ordena a las entidades nacionales y territoriales elaborar anualmente una estrategia de rendición de cuentas, conforme al Manual Único, que debe incluirse en el Plan Anticorrupción y de Atención a los Ciudadanos. Desde el Decreto 1122 de 2024 (art. 2.1.4.4.1.5 del Decreto 1081 de 2015), que reglamenta el artículo 73 de la Ley 1474 de 2011 modificado por la Ley 2195 de 2022, ese plan fue reemplazado por el Programa de Transparencia y Ética Pública, y toda mención al plan se entiende referida al programa.", true]]}]}, {"comp": "estado_constitucion", "rol": "general", "tag": "Estado y Constitución · Acción de cumplimiento: titulares y trámite", "texto": "Usted es técnico administrativo de una corporación autónoma regional. Un acuerdo del consejo directivo de la corporación le impone publicar semestralmente en su sitio web el informe de seguimiento a las concesiones de agua otorgadas, y no se ha publicado en dos años. El personero de un municipio de la jurisdicción reclamó por escrito el cumplimiento, sin respuesta en más de diez días, y anuncia una acción de cumplimiento. En paralelo, un usuario presentó una «acción de cumplimiento» cuyo verdadero propósito es que se responda un derecho de petición suyo.", "items": [{"id": "EC-179", "niv": 1, "e": "Sobre si el personero puede presentar la acción de cumplimiento, lo correcto es afirmar que", "f": "Ley 393 de 1997, art. 4", "o": [["A", "sí puede, porque la ley la concede a cualquier persona y, en especial, a servidores públicos como los personeros.", "El artículo 4 de la Ley 393 de 1997 dispone que cualquier persona puede ejercer la acción de cumplimiento y menciona expresamente a los servidores públicos, en especial a los personeros municipales, entre otros.", true], ["B", "solo puede hacerlo como apoderado de un usuario de las concesiones de agua que le otorgue poder.", "El personero está legitimado por sí mismo como servidor público (art. 4); no necesita poder de un ciudadano.", false], ["C", "no puede, porque la acción de cumplimiento es exclusiva de los ciudadanos directamente afectados por el incumplimiento de la norma.", "La Ley 393 no limita la acción a los afectados; la concede a cualquier persona y expresamente a servidores públicos y organizaciones.", false]]}, {"id": "EC-180", "niv": 3, "e": "Ante la «acción de cumplimiento» del usuario que busca la respuesta a su derecho de petición, el juez", "f": "Ley 393 de 1997, art. 9", "o": [["A", "la tramitará como acción de cumplimiento, porque el usuario eligió ese mecanismo y el juez no puede cambiarlo.", "La elección del accionante no prevalece: la acción de cumplimiento no procede para proteger derechos que puedan garantizarse por tutela (art. 9).", false], ["B", "la rechazará y ordenará al usuario presentar una tutela por separado.", "La ley no ordena el rechazo: el artículo 9 dispone que el juez le dará a la solicitud el trámite de tutela.", false], ["C", "le dará el trámite de tutela, porque busca proteger un derecho garantizable por esa vía.", "El artículo 9 de la Ley 393 de 1997 dispone que la acción de cumplimiento no procede para proteger derechos que puedan ser garantizados mediante la tutela, y que en esos eventos el juez dará a la solicitud el trámite correspondiente a la tutela. El derecho de petición es fundamental.", true]]}, {"id": "EC-181", "niv": 2, "e": "Si el juez ordena a la corporación publicar el informe, el plazo para cumplir, salvo que el juez justifique uno mayor, no podrá exceder de", "f": "Ley 393 de 1997, art. 21, num. 5", "o": [["A", "cuarenta y ocho horas desde la notificación del fallo.", "Cuarenta y ocho horas es el plazo máximo de cumplimiento de un fallo de tutela (Decreto 2591, art. 29), no de cumplimiento.", false], ["B", "diez días hábiles contados a partir de la ejecutoria del fallo.", "El numeral 5 del artículo 21 de la Ley 393 de 1997 dispone que el plazo para cumplir lo resuelto no podrá exceder de diez días hábiles contados a partir de la ejecutoria del fallo; si se requiere uno mayor, el juez lo sustenta en la sentencia.", true], ["C", "treinta días calendario contados desde la ejecutoria del fallo.", "La ley fija un máximo de diez días hábiles desde la ejecutoria, salvo que el juez justifique un término mayor.", false]]}]}, {"comp": "estado_constitucion", "rol": "general", "tag": "Estado y Constitución · Veedurías y control fiscal", "texto": "Usted es técnico administrativo de un instituto distrital de Bogotá que ejecuta un programa de comedores comunitarios con recursos públicos, operado por una fundación privada. Una veeduría ciudadana vigila el programa y presentó una denuncia ante la Contraloría de Bogotá por posibles sobrecostos. El director del instituto propone pagar honorarios a los veedores «para que hagan mejor su trabajo», y la fundación operadora sostiene que, por ser privada, la veeduría no puede vigilarla.", "items": [{"id": "EC-194", "niv": 2, "e": "Recibida la denuncia de la veeduría, la primera etapa del proceso común de atención de denuncias en el organismo de control fiscal es", "f": "Ley 850 de 2003, art. 16A (adicionado por la Ley 1757 de 2015, art. 70)", "o": [["A", "la evaluación de la denuncia y la determinación de la competencia del organismo.", "El artículo 16A de la Ley 850 de 2003, adicionado por el artículo 70 de la Ley 1757 de 2015, establece un proceso común de atención de denuncias en los organismos de control fiscal cuya primera etapa es la evaluación y determinación de competencia, seguida de la atención inicial, el traslado y la respuesta al ciudadano.", true], ["B", "el traslado inmediato al proceso de responsabilidad fiscal contra el ordenador del gasto.", "El traslado al proceso auditor o de responsabilidad fiscal es la tercera etapa, después de evaluar la competencia y recaudar pruebas.", false], ["C", "la respuesta al ciudadano informándole el archivo o la apertura del proceso.", "La respuesta al ciudadano es la última etapa del proceso común previsto en el artículo 16A.", false]]}, {"id": "EC-195", "niv": 2, "e": "Frente a la propuesta del director de pagar honorarios a los veedores, usted debe advertir que", "f": "Ley 850 de 2003, art. 8", "o": [["A", "es viable, siempre que lo autorice previamente la personería que inscribió la veeduría.", "La personería no puede autorizar lo que la ley prohíbe; el pago desconoce la autonomía de la veeduría.", false], ["B", "es viable, siempre que el pago se haga mediante un contrato de prestación de servicios.", "La forma de vinculación no cambia la conclusión: los veedores no pueden ser pagados por las entidades, por el principio de autonomía (art. 8).", false], ["C", "contraría la autonomía de las veedurías, cuyos miembros no dependen de las entidades públicas ni son pagados por ellas.", "El artículo 8 de la Ley 850 de 2003 dispone que las veedurías gozan de plena autonomía frente a las entidades públicas y los organismos de control, por lo que los veedores no dependen de ellas ni son pagados por ellas. Si la entidad vigilada pagara a los veedores, la veeduría perdería su independencia frente a quien debe vigilar.", true]]}, {"id": "EC-196", "niv": 3, "e": "Frente a la posición de la fundación operadora, lo correcto es señalar que la veeduría", "f": "Ley 850 de 2003, arts. 1 y 5", "o": [["A", "puede vigilarla en la ejecución del programa, porque este se financia con recursos públicos.", "El artículo 1 de la Ley 850 de 2003 permite a las veedurías vigilar a entidades públicas o privadas encargadas de ejecutar un programa, proyecto o contrato, en los ámbitos en que se empleen recursos públicos, y el artículo 5 extiende la vigilancia a particulares que cumplan funciones públicas.", true], ["B", "puede vigilarla en todas sus actividades, incluidas las que financia con recursos propios.", "La vigilancia se ejerce en los ámbitos en que se emplean recursos públicos (art. 1), no sobre toda la actividad privada de la fundación.", false], ["C", "no puede vigilarla, porque las veedurías solo ejercen vigilancia sobre entidades y servidores públicos.", "La Ley 850 permite vigilar también a entidades privadas y organizaciones no gubernamentales encargadas de ejecutar programas, proyectos o contratos con recursos públicos (art. 1).", false]]}]}, {"comp": "empleo_publico", "rol": "general", "tag": "Empleo público, carrera y régimen disciplinario · Comisión para desempeñar empleos de libre nombramiento", "texto": "Ricardo es profesional universitario con derechos de carrera en una secretaría de Movilidad de Bogotá y su última evaluación del desempeño fue sobresaliente. El secretario de Ambiente lo invitó a ocupar el empleo de jefe de oficina, de libre nombramiento y remoción, en esa otra entidad del distrito. Ricardo le consulta a usted, que trabaja en la Dirección de Talento Humano de Movilidad, cómo puede aceptar sin perder su empleo de carrera y qué pasa si después renuncia al empleo directivo.", "items": [{"id": "EP-120", "niv": 2, "e": "Para conservar su empleo de carrera mientras ocupa el cargo de jefe de oficina, Ricardo debe", "f": "Ley 909 de 2004, art. 26", "o": [["A", "solicitar un encargo en el empleo de jefe de oficina, porque es la figura que protege los derechos de carrera.", "El encargo es un movimiento dentro de la planta de la entidad; para ocupar un empleo de libre nombramiento en otra entidad con nombramiento ordinario, la figura prevista es la comisión del art. 26 de la Ley 909 de 2004.", false], ["B", "obtener comisión para desempeñar el empleo de libre nombramiento, a la cual tiene derecho por su evaluación sobresaliente.", "El art. 26 de la Ley 909 de 2004 reconoce a los empleados de carrera con evaluación sobresaliente el derecho a comisión hasta por tres años, prorrogable por un término igual, para desempeñar empleos de libre nombramiento y remoción en la misma entidad o en otra.", true], ["C", "renunciar al empleo de carrera, porque la ley prohíbe tener derechos de carrera y ocupar un empleo de libre nombramiento.", "La ley no exige renunciar: el art. 26 de la Ley 909 de 2004 prevé precisamente la comisión para que el empleado de carrera desempeñe empleos de libre nombramiento sin perder sus derechos.", false]]}, {"id": "EP-121", "niv": 2, "e": "Si Ricardo se posesionara en el empleo de jefe de oficina sin que se le haya otorgado la comisión, la consecuencia sería", "f": "Ley 909 de 2004, art. 42, num. 2", "o": [["A", "una falta disciplinaria leve, pero conservaría su inscripción en el registro de carrera.", "La consecuencia prevista en la ley no es disciplinaria sino la pérdida de los derechos de carrera (art. 42, num. 2, de la Ley 909 de 2004).", false], ["B", "una vacancia temporal del empleo de carrera hasta que Ricardo regrese a Movilidad.", "Sin comisión no se genera vacancia temporal con derecho a regresar; la ley prevé la pérdida de los derechos de carrera.", false], ["C", "el retiro de la carrera administrativa y la pérdida de los derechos inherentes a ella.", "El art. 42, num. 2, de la Ley 909 de 2004 establece que el empleado pierde los derechos de carrera cuando toma posesión de un cargo de libre nombramiento y remoción sin haber mediado la comisión respectiva.", true]]}, {"id": "EP-122", "niv": 3, "e": "Si, ya en comisión, Ricardo renuncia al empleo de jefe de oficina antes de que venza la comisión, deberá", "f": "Ley 909 de 2004, art. 26", "o": [["A", "asumir el empleo respecto del cual tiene derechos de carrera; si no lo hace, la entidad declarará la vacancia y lo proveerá en forma definitiva.", "El art. 26 de la Ley 909 de 2004 dispone que, al terminar la comisión o cuando el empleado renuncie o sea retirado del cargo de libre nombramiento antes del vencimiento, debe asumir el empleo de carrera; de no hacerlo, la entidad declara la vacancia, lo provee definitivamente e informa a la CNSC.", true], ["B", "solicitar a la CNSC su reubicación en un empleo de libre nombramiento equivalente en Movilidad.", "La comisión no da derecho a ser reubicado en otro empleo de libre nombramiento; su efecto es que el empleado regrese al empleo respecto del cual tiene derechos de carrera.", false], ["C", "esperar a que venza el término de la comisión para regresar, porque la comisión no puede interrumpirse.", "La ley prevé expresamente que, si el empleado renuncia al cargo de libre nombramiento antes del vencimiento de la comisión, debe asumir el empleo de carrera; no tiene que esperar el vencimiento.", false]]}]}, {"comp": "empleo_publico", "rol": "general", "tag": "Empleo público, carrera y régimen disciplinario · Comisiones", "texto": "La subdirección de gestión ambiental de una corporación autónoma regional del Eje Cafetero debe atender varias solicitudes. Un técnico de carrera debe viajar a municipios de la jurisdicción para apoyar visitas de seguimiento a permisos de vertimientos durante varias semanas. Además, dos servidores piden comisión de estudios para cursar una especialización: Paula, nombrada en provisionalidad desde hace tres años, con evaluación de gestión excelente; y Tomás, empleado de carrera, con evaluación sobresaliente en su último año, que se vinculó a la corporación hace ocho meses. Usted, que trabaja en talento humano, debe orientar a la subdirectora.", "items": [{"id": "EP-144", "niv": 2, "e": "Respecto del viaje del técnico, usted indica que la comisión de servicios al interior del país puede otorgarse", "f": "Decreto 1083 de 2015, art. 2.2.5.5.26", "o": [["A", "hasta por quince días calendario, sin posibilidad de prórroga.", "El término reglamentario es de treinta días hábiles con una posible prórroga, no de quince días calendario improrrogables.", false], ["B", "hasta por treinta días hábiles, prorrogable por razones del servicio y por una sola vez hasta por treinta días hábiles más.", "El art. 2.2.5.5.26 del Decreto 1083 de 2015 dispone que la comisión de servicios al interior se otorga hasta por treinta días hábiles, prorrogable por razones del servicio y por una sola vez hasta por treinta días hábiles más.", true], ["C", "por tiempo indefinido mientras duren las visitas, porque la comisión de servicios es una forma de provisión del empleo.", "La comisión de servicios tiene término reglamentario y no es una forma de provisión de empleos; solo las de inspección o vigilancia o las que por naturaleza exijan más tiempo escapan al término general, a juicio del nominador.", false]]}, {"id": "EP-145", "niv": 2, "e": "Frente a la solicitud de Paula, usted concluye que", "f": "Decreto 1083 de 2015, arts. 2.2.5.5.31 y siguientes", "o": [["A", "no procede la comisión de estudios, porque se exige estar en un empleo de libre nombramiento y remoción o tener derechos de carrera.", "El Decreto 1083 de 2015 (arts. 2.2.5.5.31 y siguientes) exige para la comisión de estudios estar vinculado en un empleo de libre nombramiento y remoción o acreditar derechos de carrera, un año continuo de servicio en la entidad y nivel sobresaliente en la calificación del último año; Paula es provisional.", true], ["B", "procede la comisión, siempre que Paula firme el convenio de prestación de servicios por el doble del tiempo.", "El convenio de permanencia es una obligación del comisionado, pero no suple los requisitos de acceso; Paula no cumple el de estar en un empleo de libre nombramiento o tener derechos de carrera.", false], ["C", "procede la comisión, porque lleva más de un año en la entidad y su gestión ha sido excelente.", "Aunque Paula lleve más de un año, la comisión de estudios exige además estar en un empleo de libre nombramiento o tener derechos de carrera, condición que no tiene una servidora provisional.", false]]}, {"id": "EP-146", "niv": 3, "e": "Frente a la solicitud de Tomás, usted concluye que", "f": "Decreto 1083 de 2015, arts. 2.2.5.5.19 y 2.2.5.5.31 y siguientes", "o": [["A", "procede, pero solo como permiso académico compensado de hasta dos horas diarias.", "El permiso académico compensado es una figura distinta que Tomás podría pedir, pero no es una forma de conceder la comisión de estudios; la comisión no procede porque falta el año de servicio.", false], ["B", "procede, porque los derechos de carrera y la evaluación sobresaliente son los únicos requisitos exigidos.", "Omite el requisito de antigüedad: el reglamento exige por lo menos un año continuo de servicio en la entidad que otorga la comisión.", false], ["C", "todavía no procede, porque no acredita un año continuo de servicio en la corporación.", "Además de tener derechos de carrera y evaluación sobresaliente, el Decreto 1083 de 2015 exige acreditar por lo menos un año continuo de servicio en la respectiva entidad; Tomás lleva ocho meses.", true]]}]}, {"comp": "empleo_publico", "rol": "tecnico", "tag": "Empleo público, carrera y régimen disciplinario · Nivel técnico · Deberes del servidor", "texto": "Usted es técnico operativo de la Secretaría de Infraestructura de un municipio de sexta categoría. Presentó renuncia a su empleo para trabajar en el sector privado, y el alcalde aún no la ha aceptado ni ha designado a quien lo reemplace. Mientras tanto, un compañero le propone salir dos horas en la jornada, sin permiso, a un asunto personal, «porque igual ya se va». Además, su jefe inmediato le ha pedido varias veces que, en horario laboral, haga diligencias bancarias personales de él.", "items": [{"id": "EP-169", "niv": 2, "e": "Mientras la renuncia no se acepte ni llegue su reemplazo, usted debe", "f": "Ley 1952 de 2019, art. 38, num. 18; Ley 909 de 2004, art. 41, lit. d", "o": [["A", "entregar el puesto a cualquier compañero de la dependencia y retirarse, porque así se garantiza la continuidad del servicio.", "La entrega a un compañero no equivale al relevo por quien deba reemplazarlo ni a una autorización de quien provee el cargo.", false], ["B", "dejar de asistir desde el día siguiente a la radicación, porque la renuncia surte efectos con su sola presentación.", "La renuncia produce el retiro solo cuando es regularmente aceptada; dejar el cargo antes vulnera el deber de permanecer hasta ser reemplazado.", false], ["C", "permanecer en el desempeño de sus labores, salvo autorización legal, reglamentaria o de quien deba proveer el cargo.", "El art. 38, num. 18, de la Ley 1952 de 2019 impone el deber de permanecer en el desempeño de las labores mientras no se haga cargo de ellas quien deba reemplazarlo, salvo autorización legal, reglamentaria o de quien deba proveer el cargo; además, el retiro solo se produce con la renuncia regularmente aceptada (Ley 909 de 2004, art. 41).", true]]}, {"id": "EP-170", "niv": 1, "e": "Frente a la propuesta de su compañero de salir dos horas sin permiso, usted debe tener en cuenta que", "f": "Ley 1952 de 2019, arts. 38, num. 12, y 39, num. 9", "o": [["A", "está prohibido ausentarse del cumplimiento de la función sin justificación.", "El art. 39, num. 9, de la Ley 1952 de 2019 prohíbe ausentarse del cumplimiento de la función, cargo o servicio sin justificación, y el art. 38, num. 12, exige dedicar la totalidad del tiempo reglamentario a las funciones.", true], ["B", "puede hacerlo, porque el empleado que renunció ya no está obligado a cumplir el horario.", "Mientras no se acepte la renuncia sigue siendo servidor y conserva todos sus deberes, incluido el de dedicar el tiempo reglamentario a sus funciones.", false], ["C", "puede hacerlo si luego repone las horas al final del mes, aunque no avise a nadie.", "Reponer tiempo sin autorización no justifica la ausencia; ausentarse sin justificación está prohibido.", false]]}, {"id": "EP-171", "niv": 2, "e": "Las órdenes reiteradas de su jefe para hacer diligencias bancarias personales constituyen", "f": "Ley 1952 de 2019, arts. 38, num. 8, y 39, num. 2", "o": [["A", "un ejercicio legítimo de la subordinación, porque el servidor debe cumplir las órdenes del superior.", "El deber de cumplir órdenes se limita a las que el superior adopte en ejercicio de sus atribuciones (art. 38, num. 8); encargar asuntos personales no lo es.", false], ["B", "una conducta prohibida, porque está prohibido imponer a otro servidor trabajos ajenos a sus funciones.", "El art. 39, num. 2, de la Ley 1952 de 2019 prohíbe imponer a otro servidor público trabajos ajenos a sus funciones; las diligencias personales del jefe no hacen parte de las funciones del técnico.", true], ["C", "una situación permitida si el jefe le reconoce horas extra por el tiempo que dedica a las diligencias.", "El pago de horas extra no convierte en funciones del empleo las diligencias personales del jefe; la conducta sigue estando prohibida.", false]]}]}, {"comp": "empleo_publico", "rol": "general", "tag": "Empleo público, carrera y régimen disciplinario · Inhabilidades, incompatibilidades y prohibiciones", "texto": "En la Secretaría de Gobierno de un departamento surgen varias consultas que llegan a la oficina jurídica, donde usted trabaja: un profesional de planta quiere aceptar un segundo empleo de medio tiempo en la personería de un municipio vecino; la entidad rematará vehículos dados de baja y un técnico que se retiró hace cinco meses quiere participar en la subasta; una auxiliar pregunta si puede firmar un contrato de prestación de servicios con la alcaldía de su municipio para dictar talleres los fines de semana; y el secretario de despacho quiere nombrar en un empleo de carrera, en provisionalidad, a una persona que no cumple el requisito de experiencia del manual de funciones.", "items": [{"id": "EP-172", "niv": 1, "e": "Sobre el segundo empleo en la personería, usted conceptúa que", "f": "Ley 1952 de 2019, art. 39, num. 13; Constitución Política, art. 128", "o": [["A", "puede aceptarlo si el horario de la personería no se cruza con el de la secretaría.", "La compatibilidad de horarios no elimina la prohibición de desempeñar simultáneamente más de un empleo público.", false], ["B", "puede aceptarlo, porque se trata de una entidad de otro nivel territorial.", "La prohibición cubre cualquier empleo público y cualquier asignación del tesoro, que incluye el de la nación, las entidades territoriales y las descentralizadas.", false], ["C", "no puede aceptarlo, porque está prohibido desempeñar simultáneamente más de un empleo público, salvo excepción legal.", "El art. 39, num. 13, de la Ley 1952 de 2019 prohíbe desempeñar simultáneamente más de un empleo público o recibir más de una asignación del tesoro, salvo los casos determinados por la ley, en desarrollo del art. 128 de la Constitución.", true]]}, {"id": "EP-173", "niv": 3, "e": "Sobre la participación del extécnico en el remate de los vehículos, usted conceptúa que", "f": "Ley 1952 de 2019, art. 43, num. 2", "o": [["A", "no puede participar, porque la incompatibilidad para intervenir en remates de bienes de la entidad se extiende hasta doce meses después del retiro.", "El art. 43, num. 2, de la Ley 1952 de 2019 establece la incompatibilidad para adquirir o intervenir en remates o ventas de bienes de la entidad donde se labora, desde la vinculación y hasta doce meses después del retiro; el técnico se retiró hace cinco meses.", true], ["B", "puede participar si presenta la oferta a través de un familiar, porque la incompatibilidad es personal.", "La incompatibilidad cubre la intervención directa o indirecta; usar a un familiar para participar no la elude.", false], ["C", "puede participar, porque las incompatibilidades terminan el día en que el servidor se retira.", "Esta incompatibilidad tiene una extensión expresa después del retiro: se mantiene hasta doce meses después de dejar el servicio.", false]]}, {"id": "EP-174", "niv": 2, "e": "Sobre el contrato de prestación de servicios que quiere firmar la auxiliar, usted conceptúa que", "f": "Ley 1952 de 2019, art. 43, num. 3", "o": [["A", "puede celebrarlo, porque los talleres se dictarán por fuera de la jornada laboral.", "Que la actividad se realice fuera de la jornada no elimina la incompatibilidad para contratar con el Estado.", false], ["B", "no puede celebrarlo, porque los servidores públicos tienen incompatibilidad para contratar con el Estado, salvo excepciones constitucionales o legales.", "El art. 43, num. 3, de la Ley 1952 de 2019 establece como incompatibilidad para todo servidor público contratar con el Estado, salvo las excepciones constitucionales o legales, ninguna de las cuales se configura en el caso.", true], ["C", "puede celebrarlo si informa previamente a su jefe inmediato y este no se opone.", "La autorización del jefe no crea una excepción a la incompatibilidad; las excepciones deben ser constitucionales o legales.", false]]}, {"id": "EP-175", "niv": 2, "e": "Sobre el nombramiento provisional que quiere hacer el secretario, usted le advierte que", "f": "Ley 1952 de 2019, arts. 38, num. 10, y 39, num. 15", "o": [["A", "está prohibido nombrar a quien no reúna los requisitos del empleo, aunque el nombramiento sea provisional.", "El art. 39, num. 15, de la Ley 1952 de 2019 prohíbe nombrar en cargos públicos a personas que no reúnan los requisitos constitucionales, legales o reglamentarios; el nombramiento provisional también exige cumplir los requisitos del empleo.", true], ["B", "puede hacerlo si la persona se compromete por escrito a acreditar la experiencia exigida durante el primer año de servicio.", "No es posible posesionar a alguien con el compromiso de completar después los requisitos; deben acreditarse para la posesión y el desempeño del cargo (art. 38, num. 10).", false], ["C", "puede hacerlo, porque en la provisionalidad los requisitos del manual de funciones son opcionales.", "El nombramiento provisional no exime de cumplir los requisitos del empleo; nombrar sin ellos está prohibido.", false]]}]}, {"comp": "empleo_publico", "rol": "general", "tag": "Empleo público, carrera y régimen disciplinario · Conductas que no constituyen acoso laboral", "texto": "En una corporación autónoma regional, el subdirector de gestión ambiental expidió un memorando que exige a su equipo cumplir un estándar técnico para los conceptos de concesiones de agua y anuncia que el desempeño se evaluará con indicadores objetivos aplicables a todos. Días después, por una emergencia por inundaciones, pidió a varios servidores apoyar fuera de su rutina habitual la atención de la emergencia durante una semana. Un servidor considera que ambas medidas son acoso laboral. Además, otra servidora relata que una sola vez su jefe la agredió físicamente en una reunión.", "items": [{"id": "EP-179", "niv": 2, "e": "Respecto del memorando con estándares técnicos e indicadores objetivos, el comité concluye que", "f": "Ley 1010 de 2006, art. 8", "o": [["A", "constituye acoso, porque toda exigencia escrita del superior genera presión indebida sobre el equipo.", "La ley excluye expresamente del acoso los memorandos encaminados a exigencias técnicas, a mejorar la eficiencia y a evaluar con indicadores objetivos y generales.", false], ["B", "constituye acoso solo si el servidor afectado obtiene después una evaluación no satisfactoria en su desempeño.", "El resultado posterior de la evaluación no convierte en acoso una medida que la ley excluye expresamente de ese concepto.", false], ["C", "no constituye acoso, porque busca exigencias técnicas y una evaluación con indicadores objetivos y generales.", "El art. 8, lit. d, de la Ley 1010 de 2006 dispone que no constituye acoso la formulación de circulares o memorandos de servicio encaminados a solicitar exigencias técnicas o mejorar la eficiencia laboral y la evaluación de subalternos con indicadores objetivos y generales de rendimiento.", true]]}, {"id": "EP-180", "niv": 1, "e": "Respecto de la solicitud de apoyo durante la emergencia por inundaciones, el comité concluye que", "f": "Ley 1010 de 2006, art. 8", "o": [["A", "es acoso, porque la ley prohíbe pedir colaboración por fuera del manual de funciones en cualquier caso.", "No existe esa prohibición absoluta; la ley admite la solicitud de deberes extra de colaboración en situaciones como la emergencia descrita.", false], ["B", "no es acoso, porque son deberes extra de colaboración necesarios para la continuidad del servicio.", "El art. 8, lit. e, de la Ley 1010 de 2006 establece que no constituye acoso la solicitud de cumplir deberes extras de colaboración cuando sean necesarios para la continuidad del servicio o para solucionar situaciones difíciles de la institución.", true], ["C", "es acoso, porque cualquier tarea distinta de las habituales es ajena a las obligaciones laborales.", "La ley distingue: los deberes ostensiblemente extraños sin fundamento pueden ser acoso, pero los deberes extra necesarios para la continuidad del servicio están excluidos.", false]]}, {"id": "EP-181", "niv": 3, "e": "Sobre la agresión física ocurrida una sola vez, el comité debe tener en cuenta que", "f": "Ley 1010 de 2006, art. 7", "o": [["A", "no puede considerarse acoso, porque la ley exige que la conducta sea persistente y repetida.", "La regla general exige conductas persistentes, pero la ley admite que excepcionalmente un solo acto hostil acredite el acoso.", false], ["B", "debe remitirse a la Fiscalía para que decida, porque una agresión física es un asunto penal y no de convivencia laboral.", "La agresión física aparece en la propia Ley 1010 de 2006 como conducta constitutiva de acoso (art. 7, lit. a); su posible relevancia penal no impide aplicar también esta ley.", false], ["C", "puede configurar acoso si, por su gravedad, ofende por sí sola la dignidad o la integridad de la servidora.", "El art. 7 de la Ley 1010 de 2006 dispone que excepcionalmente un solo acto hostil bastará para acreditar el acoso laboral, lo que la autoridad apreciará según la gravedad de la conducta y su capacidad de ofender por sí sola la dignidad, la vida e integridad física y otros derechos fundamentales.", true]]}]}, {"comp": "atencion_procedimiento", "rol": "tecnico", "tag": "Atención al ciudadano y procedimiento administrativo · Nivel técnico · Notificación de actos administrativos", "texto": "Usted es técnico administrativo del instituto municipal de deportes de un municipio de primera categoría. El martes 25 de mayo de 2027 el director expidió una resolución que niega a una liga deportiva el apoyo económico que había solicitado. En el expediente figura la dirección física de la liga, pero su representante legal no ha aceptado notificaciones electrónicas. No existe norma especial sobre la notificación de este acto. El representante no compareció a notificarse personalmente, por lo que el aviso con copia íntegra de la resolución se entregó en la sede de la liga el jueves 3 de junio de 2027. El instituto atiende de lunes a viernes; el lunes 7 de junio de 2027 es festivo y no hay otros festivos en junio antes del día 28.", "items": [{"id": "AP-125", "niv": 1, "e": "Para notificar la resolución, si no hay otro medio más eficaz de informar a la liga, la primera actuación del instituto es", "f": "Ley 1437 de 2011, arts. 67 y 68", "o": [["A", "enviar, dentro de los cinco días siguientes a la expedición, una citación para que el representante comparezca a notificarse.", "El artículo 68 del CPACA ordena enviar una citación a la dirección, fax o correo del expediente para que el interesado comparezca a la notificación personal. El envío se hace dentro de los cinco días siguientes a la expedición del acto y se deja constancia en el expediente.", true], ["B", "publicar la resolución en la página web del instituto durante diez días, con lo cual queda notificada.", "La publicación es el medio para los actos de carácter general. Un acto particular se notifica personalmente y, en subsidio, por aviso (arts. 66 a 69 del CPACA).", false], ["C", "enviar copia de la resolución al correo electrónico de la liga, que se entiende notificada al día siguiente del envío.", "La notificación electrónica exige que el interesado haya aceptado ese medio (art. 56 del CPACA), y el caso indica que no lo hizo.", false]]}, {"id": "AP-126", "niv": 2, "e": "Ante la inasistencia del representante, la notificación por aviso procedía", "f": "Ley 1437 de 2011, arts. 68 y 69", "o": [["A", "al cabo de diez días del envío de la citación, siempre que el aviso se publique además en un diario de amplia circulación.", "La ley fija un plazo de cinco días y no exige publicar el aviso en un diario cuando se conoce la dirección del destinatario.", false], ["B", "al cabo de cinco días del envío de la citación, remitiendo el aviso con copia íntegra del acto a la dirección del expediente.", "El artículo 69 del CPACA dispone que, si la notificación personal no puede hacerse al cabo de los cinco días del envío de la citación, se hace por aviso, remitido a la dirección que figure en el expediente y acompañado de copia íntegra del acto.", true], ["C", "una vez publicada la citación en la página web del instituto durante cinco días.", "La publicación de la citación en la página web solo procede cuando se desconoce la información del destinatario (art. 68, inciso 3). Aquí la dirección de la liga figura en el expediente.", false]]}, {"id": "AP-127", "niv": 3, "e": "Si la liga quiere presentar recurso de reposición, el último día para hacerlo es el", "f": "Ley 1437 de 2011, arts. 69 y 76; cálculo de días hábiles", "o": [["A", "jueves 17 de junio de 2027.", "Resulta de contar desde el día de la entrega del aviso y de tomar el lunes 7 de junio como hábil. El aviso solo surte efectos al finalizar el día siguiente a la entrega, y el 7 de junio es festivo.", false], ["B", "viernes 18 de junio de 2027.", "Resulta de contar el viernes 4 de junio como primer día del término. Ese día la notificación todavía no se ha surtido: se surte al finalizar el día siguiente al de la entrega.", false], ["C", "lunes 21 de junio de 2027.", "Según el artículo 69 del CPACA, la notificación se surte al finalizar el viernes 4 de junio, día siguiente a la entrega. Los diez días del artículo 76 corren desde el 8 de junio (el 7 es festivo): 8 a 11 (4), 14 a 18 (9) y lunes 21 (10).", true]]}]}, {"comp": "atencion_procedimiento", "rol": "general", "tag": "Atención al ciudadano y procedimiento administrativo · Deberes de las autoridades en la atención al público", "texto": "La alcaldía de un municipio de quinta categoría revisa su protocolo de atención a la ciudadanía. Un borrador propone atender al público de lunes a jueves de 8:00 a. m. a 12:00 m. y de 2:00 a 4:00 p. m., y cerrar la puerta a las 4:00 p. m. dejando sin atender a quienes estén dentro. También propone no publicar la carta de trato digno porque nadie la ha solicitado y exigir la presentación personal ante notario de las peticiones de certificados laborales, aunque ninguna ley lo exige.", "items": [{"id": "AP-165", "niv": 1, "e": "Sobre el horario propuesto, que suma 24 horas semanales, el protocolo debe ajustarse para", "f": "Ley 1437 de 2011, art. 7, num. 2", "o": [["A", "garantizar atención personal al público durante al menos 30 horas a la semana.", "El CPACA fija un mínimo mayor: 40 horas semanales de atención personal.", false], ["B", "garantizar atención personal al público durante al menos 40 horas a la semana.", "El numeral 2 del artículo 7 del CPACA obliga a garantizar atención personal al público como mínimo durante cuarenta horas a la semana, distribuidas en horarios que satisfagan las necesidades del servicio.", true], ["C", "garantizar atención personal al público durante al menos 48 horas a la semana.", "La ley fija un mínimo de 40 horas. Nada impide ampliar la atención, pero 48 horas no es el mínimo legal.", false]]}, {"id": "AP-166", "niv": 1, "e": "Sobre las personas que estén dentro de la oficina a la hora del cierre, el protocolo debe disponer que", "f": "Ley 1437 de 2011, art. 7, num. 3", "o": [["A", "se atienda a todas las que ingresaron dentro del horario normal de atención.", "El numeral 3 del artículo 7 del CPACA impone el deber de atender a todas las personas que hayan ingresado a las oficinas dentro del horario normal de atención.", true], ["B", "se atienda solo a quienes vengan a radicar peticiones con términos próximos a vencer.", "La ley no permite seleccionar a quiénes atender: el deber cubre a todas las personas que ingresaron dentro del horario.", false], ["C", "se les entregue un turno preferente para que regresen al día siguiente.", "Diferir la atención de quienes ya ingresaron dentro del horario incumple el deber del numeral 3 del artículo 7.", false]]}, {"id": "AP-167", "niv": 2, "e": "En cuanto a la carta de trato digno, la alcaldía debe", "f": "Ley 1437 de 2011, art. 7, num. 5", "o": [["A", "expedirla al inicio de cada periodo de gobierno y actualizarla con el plan de desarrollo.", "La ley exige actualizarla anualmente, no cada cuatro años.", false], ["B", "expedirla cuando la Personería o un ciudadano la soliciten, y mantenerla en el archivo de la entidad.", "La carta de trato digno no depende de que alguien la solicite. La ley exige expedirla, hacerla visible y actualizarla anualmente.", false], ["C", "expedirla, hacerla visible y actualizarla cada año, con los derechos de los usuarios y los medios para garantizarlos.", "El numeral 5 del artículo 7 del CPACA obliga a expedir, hacer visible y actualizar anualmente una carta de trato digno que especifique los derechos de los usuarios y los medios dispuestos para garantizarlos.", true]]}, {"id": "AP-168", "niv": 2, "e": "Sobre la presentación personal ante notario de las peticiones de certificados laborales, el protocolo", "f": "Ley 1437 de 2011, art. 9, num. 3; Decreto Ley 019 de 2012, art. 5", "o": [["A", "no puede incluirla, porque está prohibido exigir presentación personal de peticiones cuando la ley no lo exige.", "El numeral 3 del artículo 9 del CPACA prohíbe a las autoridades exigir la presentación personal de peticiones, recursos o documentos cuando la ley no lo exija, y el artículo 5 del Decreto Ley 019 de 2012 proscribe las notas de presentación personal no ordenadas por la ley.", true], ["B", "puede incluirla, siempre que se trate de certificados que contengan datos personales del servidor.", "Proteger datos personales no justifica exigir presentación personal. Basta verificar la identidad o la autorización de quien pide el certificado.", false], ["C", "puede incluirla, si se aprueba mediante resolución del alcalde publicada en la página web.", "Las autoridades no pueden crear requisitos o formalidades adicionales a los previstos en la ley (art. 84 de la Constitución y art. 9, num. 5, del CPACA), aunque los adopten por acto administrativo.", false]]}]}, {"comp": "atencion_procedimiento", "rol": "tecnico", "tag": "Atención al ciudadano y procedimiento administrativo · Nivel técnico · Información clasificada y reservada", "texto": "Usted es técnico administrativo de la Secretaría de Seguridad de un distrito. Un ciudadano solicita el documento técnico que describe la ubicación y los puntos ciegos de las cámaras de vigilancia del centro de la ciudad. El jefe de la oficina propone responder que la secretaría no confirma ni niega si el documento existe, declarar la información reservada de manera indefinida y responder sin explicar los motivos. Una ley vigente prohíbe expresamente divulgar este tipo de información por razones de seguridad pública.", "items": [{"id": "AP-178", "niv": 2, "e": "Frente a la propuesta de no confirmar si el documento existe, debe advertirse que", "f": "Ley 1712 de 2014, art. 21", "o": [["A", "es correcta, siempre que el jefe de la oficina lo decida mediante resolución motivada publicada en la página web.", "Una resolución no cambia la regla legal: la reserva recae sobre el contenido y no sobre la existencia del documento.", false], ["B", "por regla general debe indicarse si el documento obra en poder de la entidad, porque la reserva recae sobre su contenido.", "El artículo 21 de la Ley 1712 de 2014 dispone que la reserva opera respecto del contenido de un documento público, pero no de su existencia, y que ninguna autoridad puede negarse a indicar si un documento obra en su poder, salvo que el daño al interés protegido sea mayor al interés público de acceder.", true], ["C", "es correcta, porque revelar la existencia de un documento reservado equivale a divulgar su contenido.", "La ley separa ambos aspectos: la reserva cubre el contenido de un documento público, pero no su existencia.", false]]}, {"id": "AP-179", "niv": 1, "e": "La reserva de esta información, basada en la seguridad pública, no puede extenderse por más de", "f": "Ley 1712 de 2014, arts. 19 y 22", "o": [["A", "seis (6) meses.", "Seis meses es la reserva especial de los documentos sobre operaciones de crédito público y tesorería de la Nación (art. 24, num. 4, del CPACA), no la de la información reservada por seguridad pública.", false], ["B", "diez (10) años.", "La ley no fija un límite de diez años para la información reservada del artículo 19.", false], ["C", "quince (15) años.", "El artículo 22 de la Ley 1712 de 2014 dispone que la reserva de la información amparada por el artículo 19 no debe extenderse por un período mayor a quince años.", true]]}, {"id": "AP-180", "niv": 3, "e": "Si la secretaría niega el acceso, la carga de demostrar que la información debe permanecer reservada le corresponde", "f": "Ley 1712 de 2014, arts. 19 y 28", "o": [["A", "al solicitante, que debe acreditar un interés legítimo y directo en conocer la información.", "La ley no exige al solicitante demostrar interés alguno; la carga de justificar la reserva es de quien la invoca.", false], ["B", "a la secretaría, que debe demostrar que divulgarla causaría un daño presente, probable y específico.", "El artículo 28 de la Ley 1712 de 2014 asigna al sujeto obligado la carga de la prueba: debe demostrar que la información se relaciona con un objetivo legítimo, establecer la excepción aplicable y probar que su revelación causaría un daño presente, probable y específico que excede el interés público del acceso. Además, el rechazo debe ser motivado y por escrito (art. 19).", true], ["C", "al juez administrativo, que debe establecer de oficio si existe la reserva, sin que la secretaría deba motivar.", "El rechazo debe ser motivado y por escrito (art. 19), y la carga de la prueba recae en el sujeto obligado (art. 28), no en el juez.", false]]}]}, {"comp": "atencion_procedimiento", "rol": "tecnico", "tag": "Atención al ciudadano y procedimiento administrativo · Nivel técnico · Información reservada en el derecho de petición", "texto": "Usted es técnico administrativo de la oficina de talento humano de una gobernación. Una periodista, sin autorización del titular, solicita copia completa de la historia laboral de un exsecretario de despacho, incluidas sus evaluaciones médicas ocupacionales y los datos de su núcleo familiar. En la misma solicitud pide los decretos de nombramiento y el acta de posesión del exsecretario, que están archivados dentro de esa historia laboral. Días después, la Procuraduría Provincial solicita la historia laboral completa para una investigación disciplinaria en curso.", "items": [{"id": "AP-206", "niv": 2, "e": "Frente a la solicitud de la historia laboral completa, la gobernación debe", "f": "Ley 1755 de 2015, art. 1 (arts. 24, num. 3 y parágrafo, y 25 de la Ley 1437 de 2011)", "o": [["A", "rechazar su entrega mediante decisión motivada que indique las normas que la impiden, porque la periodista no es titular ni está autorizada.", "El numeral 3 del artículo 24 del CPACA reserva la historia laboral y su parágrafo permite pedirla solo al titular, sus apoderados o personas autorizadas con facultad expresa. El artículo 25 exige que el rechazo sea motivado, indique las disposiciones legales que impiden la entrega y se notifique.", true], ["B", "entregarla completa, porque el exsecretario fue un servidor público de alto nivel.", "La condición de servidor público no elimina la reserva de la historia laboral, que solo puede pedir el titular, su apoderado o una persona autorizada con facultad expresa.", false], ["C", "negarla sin necesidad de motivación, porque la reserva de la historia laboral es evidente.", "Toda decisión que rechace una petición de informaciones o documentos debe ser motivada e indicar las disposiciones legales que impiden la entrega (art. 25 del CPACA).", false]]}, {"id": "AP-207", "niv": 3, "e": "Frente a la solicitud de la Procuraduría Provincial, la gobernación debe", "f": "Ley 1755 de 2015, art. 1 (art. 27 de la Ley 1437 de 2011)", "o": [["A", "negarla, porque la historia laboral solo puede entregarse al titular o a quien este autorice.", "La reserva no es oponible a las autoridades administrativas legalmente competentes que pidan la información para el debido ejercicio de sus funciones (art. 27 del CPACA).", false], ["B", "entregarla, porque la reserva no es oponible a las autoridades competentes que la piden para ejercer sus funciones, las cuales deben mantenerla.", "El artículo 27 del CPACA dispone que el carácter reservado de una información no es oponible a las autoridades judiciales, legislativas ni administrativas legalmente competentes que la soliciten para el debido ejercicio de sus funciones. Esas autoridades deben asegurar la reserva.", true], ["C", "entregarla solo si la Procuraduría presenta autorización escrita del exsecretario investigado.", "La ley no exige autorización del titular cuando la información la pide una autoridad competente para ejercer sus funciones.", false]]}, {"id": "AP-208", "niv": 3, "e": "Respecto de los decretos de nombramiento y el acta de posesión archivados en la historia laboral, la gobernación debe", "f": "Ley 1755 de 2015, art. 1 (art. 25, inciso 2, de la Ley 1437 de 2011); Ley 1712 de 2014, art. 21", "o": [["A", "entregarlos, porque la reserva no se extiende a piezas del expediente que no están cubiertas por ella.", "El inciso 2 del artículo 25 del CPACA dispone que la restricción por reserva legal no se extiende a otras piezas del expediente que no estén cubiertas por ella, y el artículo 21 de la Ley 1712 de 2014 ordena entregar la información que no cae en ninguna excepción. Los actos de nombramiento y posesión no son reservados.", true], ["B", "entregarlos solo si el exsecretario lo autoriza por escrito, porque forman parte de su historia laboral.", "La autorización del titular se exige para la información reservada. Los actos de nombramiento y posesión no lo son.", false], ["C", "negarlos, porque al estar archivados en la historia laboral quedan cubiertos por la misma reserva.", "La ubicación física de un documento no le da carácter reservado. La reserva se aplica por su contenido y no se extiende a las piezas no cubiertas.", false]]}]}, {"comp": "gestion_publica", "rol": "general", "tag": "Gestión pública, MIPG, contratación y documentos · Control interno: responsables (Ley 87 de 1993)", "texto": "Usted trabaja en la Secretaría de Hacienda de un municipio de quinta categoría. En una auditoría, la Oficina de Control Interno encontró que en la dependencia no se verificaban los soportes de los pagos antes de girarlos. En la reunión de cierre, el secretario de Hacienda sostiene que el control interno «es asunto exclusivo de la Oficina de Control Interno» y que su dependencia solo debe atender lo que esa oficina le pida. Para corregir la falla, propone además que la jefe de control interno firme como visto bueno cada orden de pago antes del giro.", "items": [{"id": "GP-110", "niv": 1, "e": "Según la Ley 87 de 1993, el establecimiento y desarrollo del sistema de control interno del municipio es responsabilidad", "f": "Ley 87 de 1993, arts. 3 y 6", "o": [["A", "de la jefe de la Oficina de Control Interno, por ser la encargada de evaluarlo.", "La oficina de control interno evalúa el sistema de forma independiente y recomienda mejoras (art. 3, lit. d), pero no es la responsable de establecerlo.", false], ["B", "del concejo municipal, como órgano de control político de la administración.", "El control político del concejo es distinto del control interno; la Ley 87 de 1993 no asigna al concejo el establecimiento del sistema de control interno de la alcaldía.", false], ["C", "del representante legal o máximo directivo, en este caso el alcalde.", "El artículo 6 de la Ley 87 de 1993 atribuye al representante legal o máximo directivo la responsabilidad de establecer y desarrollar el sistema de control interno; en el municipio, ese papel lo cumple el alcalde.", true]]}, {"id": "GP-111", "niv": 2, "e": "Frente a la afirmación del secretario de Hacienda, usted le recuerda que", "f": "Ley 87 de 1993, arts. 1, 3 (lit. c) y 6", "o": [["A", "la responsabilidad de los controles de su área recae en el Comité de Coordinación de Control Interno.", "El comité coordina el sistema al más alto nivel, pero no traslada a esa instancia la responsabilidad por los controles de cada dependencia, que la ley asigna a su jefe.", false], ["B", "tiene razón, porque los jefes de dependencia solo deben cumplir los planes de mejoramiento que fije la oficina.", "La ley concibe el control interno como intrínseco a las funciones de todos los cargos, en especial de quienes tienen mando; el jefe de dependencia no es un simple destinatario de los planes de la oficina.", false], ["C", "como jefe de dependencia, él también responde por la aplicación y la calidad de los controles de su área.", "El artículo 6 de la Ley 87 de 1993 extiende a los jefes de cada dependencia la responsabilidad por la aplicación de los métodos y procedimientos, y por la calidad y eficacia del control interno; el artículo 3, literal c, los hace responsables ante su jefe inmediato.", true]]}, {"id": "GP-112", "niv": 3, "e": "La propuesta de que la jefe de control interno dé visto bueno a cada orden de pago", "f": "Ley 87 de 1993, art. 12 y parágrafo", "o": [["A", "no procede, porque firmar cada pago comprometería la independencia que la ley exige a quien audita.", "El parágrafo del artículo 12 de la Ley 87 de 1993 prohíbe al jefe de control interno intervenir en los procedimientos administrativos con autorizaciones o refrendaciones; dar visto bueno a cada orden de pago sería una refrendación y le restaría independencia para evaluar ese mismo proceso.", true], ["B", "procede si el alcalde la delega por escrito y la jefe de control interno la acepta.", "La prohibición del parágrafo del artículo 12 de la Ley 87 de 1993 opera «en ningún caso», de modo que no se supera con una delegación ni con la aceptación de la jefe de control interno.", false], ["C", "procede, porque verificar los controles de los procesos financieros es una de sus funciones legales.", "Verificar los controles es una función de evaluación posterior e independiente; refrendar cada pago la convertiría en parte del procedimiento que luego debe evaluar, lo que la ley prohíbe.", false]]}]}, {"comp": "gestion_publica", "rol": "tecnico", "tag": "Gestión pública, MIPG, contratación y documentos · Nivel técnico · Plan de desarrollo territorial: contenido y aprobación", "texto": "Usted es técnico de la Secretaría de Planeación de un departamento de la Orinoquía. El gobernador radicó el proyecto de plan de desarrollo en la asamblea el 20 de abril, dentro de los primeros cuatro meses de su período. Durante el debate, una diputada propone incluir un programa de vías terciarias que no estaba en el proyecto, sin que el gobernador se haya pronunciado. Otro diputado pide saber qué partes debe contener el plan y qué ocurre si la asamblea no decide a tiempo.", "items": [{"id": "GP-128", "niv": 1, "e": "Sobre el contenido, usted explica que los planes de desarrollo de las entidades territoriales están conformados por", "f": "Ley 152 de 1994, art. 31", "o": [["A", "una parte estratégica y el plan anual de adquisiciones de la gobernación.", "El plan anual de adquisiciones es un instrumento de la gestión contractual de cada entidad; no es componente del plan de desarrollo.", false], ["B", "una parte estratégica y un plan de inversiones de mediano y corto plazo.", "El artículo 31 de la Ley 152 de 1994 dispone que los planes de desarrollo territoriales se conforman por una parte estratégica y un plan de inversiones a mediano y corto plazo.", true], ["C", "un diagnóstico, el plan de ordenamiento territorial y el presupuesto anual.", "El plan de ordenamiento territorial es un instrumento distinto, regido por normas especiales (art. 41, inciso final), y el presupuesto anual se armoniza con el plan, pero no lo integra.", false]]}, {"id": "GP-129", "niv": 2, "e": "Frente a la propuesta de la diputada, la modificación", "f": "Ley 152 de 1994, art. 40", "o": [["A", "requiere la aceptación previa y por escrito del gobernador.", "El artículo 40 de la Ley 152 de 1994 dispone que toda modificación que pretenda introducir la asamblea o el concejo debe contar con la aceptación previa y por escrito del gobernador o alcalde.", true], ["B", "puede aprobarse por mayoría de la asamblea sin intervención del gobernador.", "La ley exige la aceptación previa y escrita del mandatario para cualquier modificación que pretenda introducir la corporación, de modo que la sola mayoría no basta.", false], ["C", "exige un concepto previo favorable del Departamento Nacional de Planeación.", "El artículo 40 de la Ley 152 de 1994 no somete las modificaciones de la asamblea a concepto del DNP; el requisito es la aceptación del gobernador.", false]]}, {"id": "GP-130", "niv": 2, "e": "Si la asamblea no decide sobre el plan dentro del mes siguiente a su presentación,", "f": "Ley 152 de 1994, art. 40", "o": [["A", "sigue ri
