 se va a preparar.", false], ["B", "2,25 g.", "0,9 g por cada 100 mL; para 250 mL: 0,9 × 250 ÷ 100 = 2,25 g.", true], ["C", "9 g.", "Es la masa necesaria para 1.000 mL de suero, no para 250 mL.", false], ["D", "22,5 g.", "Corre la coma: corresponde a una solución al 9 % m/v, diez veces más concentrada.", false]]}, {"id": "CNB-123", "niv": 3, "cp": "cn_indagacion", "cn": "quimico", "e": "Se prepara una solución saturada de la sal X con 100 g de agua a 60 °C y luego se enfría hasta 20 °C. Según la gráfica, ¿qué masa de sal X se cristaliza (deja de estar disuelta), si toda la sal en exceso se cristaliza?", "f": "Curva de solubilidad", "vis": "", "o": [["A", "32 g.", "Es la masa que permanece disuelta a 20 °C, no la que se cristaliza.", false], ["B", "46 g.", "Resta la solubilidad a 40 °C (110 − 64), pero la solución se enfrió hasta 20 °C.", false], ["C", "78 g.", "A 60 °C había 110 g disueltos; a 20 °C solo pueden quedar disueltos 32 g. Se cristalizan 110 − 32 = 78 g.", true], ["D", "110 g.", "Supone que toda la sal se cristaliza, pero a 20 °C todavía quedan 32 g disueltos.", false]]}, {"id": "CNB-124", "niv": 2, "cp": "cn_indagacion", "cn": "quimico", "e": "Un estudiante afirma que en 100 g de agua a 40 °C se pueden disolver por completo 80 g de la sal X. Según la gráfica, ¿es correcta su afirmación?", "f": "Curva de solubilidad", "vis": "", "o": [["A", "No, porque a 40 °C solo se disuelven unos 64 g y el resto quedaría sin disolver.", "La gráfica indica una solubilidad de 64 g por 100 g de agua a 40 °C; los 16 g restantes no se disolverían.", true], ["B", "Sí, porque a 40 °C se pueden disolver hasta 110 g de la sal X.", "110 g es la solubilidad a 60 °C; a 40 °C el valor es 64 g.", false], ["C", "Sí, porque la solubilidad de la sal X aumenta a medida que aumenta la temperatura.", "Que la solubilidad aumente con la temperatura no implica que a 40 °C alcance para 80 g.", false], ["D", "No, porque la sal X no se disuelve en agua a temperaturas menores de 60 °C.", "La gráfica muestra que la sal X se disuelve a todas las temperaturas medidas, incluso a 0 °C (13 g).", false]]}]}, {"comp": "ciencias_naturales", "sim": "s11-2", "ses": 1, "ind": "Movimiento de un bus intermunicipal", "tt": "", "texto": "La gráfica muestra la posición de un bus intermunicipal, medida desde la terminal de salida, durante las primeras 4 horas de un viaje por una carretera recta.", "vis": "<div class=\"vfig\"><svg class=\"vg\" viewBox=\"0 0 560 320\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Gráfica 7. Posición del bus en el tiempo\" font-family=\"Arial, sans-serif\" font-size=\"12\"><rect width=\"560\" height=\"320\" fill=\"#ffffff\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"13\" fill=\"#1d2433\">Gráfica 7. Posición del bus en el tiempo<\/text><line x1=\"60\" y1=\"258.0\" x2=\"540\" y2=\"258.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"262.0\" text-anchor=\"end\" fill=\"#3a4356\">0<\/text><line x1=\"60\" y1=\"202.5\" x2=\"540\" y2=\"202.5\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"206.5\" text-anchor=\"end\" fill=\"#3a4356\">50<\/text><line x1=\"60\" y1=\"147.0\" x2=\"540\" y2=\"147.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"151.0\" text-anchor=\"end\" fill=\"#3a4356\">100<\/text><line x1=\"60\" y1=\"91.5\" x2=\"540\" y2=\"91.5\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"95.5\" text-anchor=\"end\" fill=\"#3a4356\">150<\/text><line x1=\"60\" y1=\"36.0\" x2=\"540\" y2=\"36.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"40.0\" text-anchor=\"end\" fill=\"#3a4356\">200<\/text><line x1=\"60\" y1=\"258\" x2=\"540\" y2=\"258\" stroke=\"#3a4356\"/><line x1=\"60\" y1=\"258\" x2=\"60\" y2=\"36\" stroke=\"#3a4356\"/><text transform=\"translate(14,147.0) rotate(-90)\" text-anchor=\"middle\" fill=\"#3a4356\">Posición (km)<\/text><text x=\"300.0\" y=\"312\" text-anchor=\"middle\" fill=\"#3a4356\">Tiempo (h)<\/text><text x=\"108.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">0<\/text><text x=\"204.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">1<\/text><text x=\"300.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">2<\/text><text x=\"396.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">3<\/text><text x=\"492.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">4<\/text><polyline fill=\"none\" stroke=\"#1660a8\" stroke-width=\"2.5\" points=\"108.0,258.0 204.0,191.4 300.0,124.8 396.0,124.8 492.0,36.0\"/><circle cx=\"108.0\" cy=\"258.0\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"108.0\" y=\"250.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">0<\/text><circle cx=\"204.0\" cy=\"191.4\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"204.0\" y=\"183.4\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">60<\/text><circle cx=\"300.0\" cy=\"124.8\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"300.0\" y=\"116.8\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">120<\/text><circle cx=\"396.0\" cy=\"124.8\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"396.0\" y=\"116.8\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">120<\/text><circle cx=\"492.0\" cy=\"36.0\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"492.0\" y=\"28.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">200<\/text><\/svg><\/div>", "items": [{"id": "CNB-128", "niv": 1, "cp": "cn_uso_comprensivo", "cn": "fisico", "e": "¿Cuál fue la rapidez del bus durante la primera hora de viaje?", "f": "Rapidez media", "vis": "", "o": [["A", "30 km/h.", "Divide los 60 km recorridos entre 2 horas, pero ese tramo duró solo 1 hora.", false], ["B", "60 km/h.", "En la primera hora la posición pasó de 0 km a 60 km: 60 km ÷ 1 h = 60 km/h.", true], ["C", "120 km/h.", "Es la posición del bus a las 2 horas, no su rapidez en la primera hora.", false], ["D", "200 km/h.", "Es la posición final a las 4 horas; no corresponde a la rapidez de ningún tramo.", false]]}, {"id": "CNB-129", "niv": 1, "cp": "cn_indagacion", "cn": "fisico", "e": "Según la gráfica, ¿en qué intervalo de tiempo el bus tuvo la mayor rapidez?", "f": "Interpretación de gráficas posición-tiempo", "vis": "", "o": [["A", "Entre 0 h y 1 h.", "En ese intervalo recorrió 60 km, menos que los 80 km del último intervalo.", false], ["B", "Entre 1 h y 2 h.", "Recorrió 60 km en ese intervalo (de 60 km a 120 km), menos que en el último.", false], ["C", "Entre 2 h y 3 h.", "En ese intervalo la posición no cambió (120 km): el bus estuvo detenido.", false], ["D", "Entre 3 h y 4 h.", "La posición pasó de 120 km a 200 km: 80 km en 1 h, la mayor pendiente de la gráfica.", true]]}, {"id": "CNB-130", "niv": 1, "cp": "cn_explicacion", "cn": "fisico", "e": "Cuando el bus frena de repente, los pasajeros que van de pie se inclinan hacia adelante. ¿Cómo se explica esto?", "f": "Primera ley de Newton (inercia)", "vis": "", "o": [["A", "Por inercia, el cuerpo de los pasajeros tiende a seguir moviéndose aunque el bus disminuya su velocidad.", "Según la primera ley de Newton, un cuerpo en movimiento conserva su velocidad si nada lo detiene; el bus frena, pero el cuerpo tiende a seguir adelante.", true], ["B", "Al frenar aparece una fuerza que empuja a los pasajeros hacia adelante desde la parte trasera del bus.", "No hay una fuerza hacia adelante sobre los pasajeros; es el bus el que se detiene mientras ellos tienden a seguir.", false], ["C", "La fuerza de gravedad sobre los pasajeros aumenta en el momento del frenado.", "La gravedad actúa hacia abajo y no cambia cuando el bus frena.", false], ["D", "El aire que está dentro del bus empuja a los pasajeros hacia adelante al frenar.", "El aire dentro del bus no produce un empuje que explique la inclinación de los pasajeros.", false]]}]}, {"comp": "ciencias_naturales", "sim": "s11-2", "ses": 1, "ind": "Energía de una pelota que cae", "tt": "", "texto": "Se deja caer una pelota desde una altura de 5 m. Considere g = 10 m/s². Mientras cae, su energía potencial gravitacional (m·g·h) se transforma en energía cinética (½·m·v²).", "vis": "", "items": [{"id": "CNB-131", "niv": 1, "cp": "cn_uso_comprensivo", "cn": "fisico", "e": "Si se desprecia la resistencia del aire, ¿con qué rapidez llega la pelota al suelo?", "f": "Conservación de la energía mecánica", "vis": "", "o": [["A", "5 m/s.", "Iguala la rapidez con la altura (5 m); no aplica la conservación de la energía.", false], ["B", "10 m/s.", "m·g·h = ½·m·v² → v = √(2·g·h) = √(2 × 10 × 5) = √100 = 10 m/s.", true], ["C", "50 m/s.", "Calcula g × h = 50 sin aplicar la relación completa con la energía cinética.", false], ["D", "100 m/s.", "Calcula 2·g·h = 100 pero olvida sacar la raíz cuadrada.", false]]}, {"id": "CNB-132", "niv": 1, "cp": "cn_explicacion", "cn": "fisico", "e": "Después de chocar con el piso, la pelota rebota pero no alcanza la altura de 5 m. ¿Por qué?", "f": "Transformación de la energía", "vis": "", "o": [["A", "Porque en cada rebote la energía se destruye y desaparece.", "La energía no se destruye; se transforma en otras formas.", false], ["B", "Porque la masa de la pelota aumenta un poco cada vez que choca contra el piso.", "La masa de la pelota no cambia al rebotar; además, la altura alcanzada no depende de la masa.", false], ["C", "Porque parte de la energía mecánica se transforma en energía térmica y sonora.", "En el choque y por el rozamiento con el aire, parte de la energía se transforma en calor y sonido, y queda menos para subir.", true], ["D", "Porque la fuerza de gravedad aumenta después de cada rebote.", "La gravedad sobre la pelota es la misma antes y después del rebote.", false]]}]}, {"comp": "ciencias_naturales", "sim": "s11-2", "ses": 1, "ind": "Mercurio de la minería de oro en una ciénaga", "tt": "", "texto": "En algunas zonas de minería de oro se usa mercurio para separar el oro de la arena. Parte de ese mercurio llega a ríos y ciénagas, donde bacterias lo transforman en metilmercurio, una forma que los organismos absorben y eliminan con dificultad. Una universidad midió el mercurio en organismos de una ciénaga cercana a zonas mineras.", "vis": "<table class=\"vt\"><caption>Tabla 9. Mercurio total en organismos de la ciénaga<\/caption><thead><tr><th>Organismo<\/th><th>Alimentación<\/th><th>Mercurio (mg/kg)<\/th><\/tr><\/thead><tbody><tr><td>Algas<\/td><td>Fotosíntesis<\/td><td>0,02<\/td><\/tr><tr><td>Pez herbívoro<\/td><td>Algas<\/td><td>0,08<\/td><\/tr><tr><td>Pez carnívoro pequeño<\/td><td>Peces herbívoros<\/td><td>0,30<\/td><\/tr><tr><td>Pez carnívoro grande<\/td><td>Peces carnívoros pequeños<\/td><td>0,95<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Datos ficticios.<\/div>", "items": [{"id": "CNB-133", "niv": 2, "cp": "cn_explicacion", "cn": "cts", "e": "¿Por qué las personas que comen con frecuencia peces carnívoros grandes de esta ciénaga corren mayor riesgo de intoxicación?", "f": "Biomagnificación del mercurio (estudios en ciénagas de Colombia)", "vis": "", "o": [["A", "Porque el mercurio se acumula y su concentración aumenta en cada nivel de la cadena alimentaria.", "Es la biomagnificación: cada depredador consume muchas presas con mercurio y lo retiene, como muestra la tabla.", true], ["B", "Porque los peces carnívoros producen mercurio dentro de su propio organismo.", "Los peces no producen mercurio; lo obtienen del agua y de su alimento.", false], ["C", "Porque los peces herbívoros no absorben mercurio, ya que solo comen algas.", "La tabla muestra que las algas y los peces herbívoros sí contienen mercurio, aunque en menor concentración.", false], ["D", "Porque al cocinar el pescado el mercurio se elimina, excepto en los peces más grandes.", "Cocinar el pescado no elimina el metilmercurio, y la tabla no compara pescado crudo y cocido.", false]]}, {"id": "CNB-134", "niv": 3, "cp": "cn_indagacion", "cn": "cts", "e": "La autoridad ambiental quiere comprobar que la minería es la principal fuente del mercurio de esta ciénaga. ¿Qué información adicional sería la más útil?", "f": "Diseño de investigaciones: grupo de comparación", "vis": "", "o": [["A", "Medir el mercurio en un número mayor de peces carnívoros grandes de la misma ciénaga.", "Más datos de la misma ciénaga no permiten compararla con un lugar sin minería.", false], ["B", "Preguntar a los pescadores de la zona cuáles peces prefieren comer.", "Informa sobre la exposición de las personas, pero no sobre el origen del mercurio.", false], ["C", "Registrar todos los días la temperatura del agua de la ciénaga durante un año.", "La temperatura no indica de dónde proviene el mercurio.", false], ["D", "Medir el mercurio en las mismas especies en una ciénaga similar sin minería en su cuenca.", "Funciona como grupo de comparación: si allí los niveles son mucho menores, se refuerza que la minería es la fuente.", true]]}]}, {"comp": "ciencias_naturales", "sim": "s11-2", "ses": 1, "ind": "Regulación de la glucosa en la sangre", "tt": "", "texto": "Después de comer, la concentración de glucosa en la sangre aumenta. El páncreas responde liberando insulina, una hormona que facilita que las células del cuerpo tomen la glucosa de la sangre. En la diabetes, el páncreas produce poca insulina o el cuerpo no responde bien a ella. La gráfica muestra la glucosa en la sangre de dos personas, A y B, en ayunas (minuto 0) y después de beber una solución con 75 g de glucosa. Como referencia clínica, una glucosa en ayunas de 126 mg/dL o más, o de 200 mg/dL o más 120 minutos después de beber la solución, es compatible con diabetes.", "vis": "<div class=\"vfig\"><svg class=\"vg\" viewBox=\"0 0 560 320\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Gráfica 8. Glucosa en la sangre después de beber la solución\" font-family=\"Arial, sans-serif\" font-size=\"12\"><rect width=\"560\" height=\"320\" fill=\"#ffffff\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"13\" fill=\"#1d2433\">Gráfica 8. Glucosa en la sangre después de beber la solución<\/text><line x1=\"60\" y1=\"258.0\" x2=\"540\" y2=\"258.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"262.0\" text-anchor=\"end\" fill=\"#3a4356\">0<\/text><line x1=\"60\" y1=\"221.0\" x2=\"540\" y2=\"221.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"225.0\" text-anchor=\"end\" fill=\"#3a4356\">50<\/text><line x1=\"60\" y1=\"184.0\" x2=\"540\" y2=\"184.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"188.0\" text-anchor=\"end\" fill=\"#3a4356\">100<\/text><line x1=\"60\" y1=\"147.0\" x2=\"540\" y2=\"147.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"151.0\" text-anchor=\"end\" fill=\"#3a4356\">150<\/text><line x1=\"60\" y1=\"110.0\" x2=\"540\" y2=\"110.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"114.0\" text-anchor=\"end\" fill=\"#3a4356\">200<\/text><line x1=\"60\" y1=\"73.0\" x2=\"540\" y2=\"73.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"77.0\" text-anchor=\"end\" fill=\"#3a4356\">250<\/text><line x1=\"60\" y1=\"36.0\" x2=\"540\" y2=\"36.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"40.0\" text-anchor=\"end\" fill=\"#3a4356\">300<\/text><line x1=\"60\" y1=\"258\" x2=\"540\" y2=\"258\" stroke=\"#3a4356\"/><line x1=\"60\" y1=\"258\" x2=\"60\" y2=\"36\" stroke=\"#3a4356\"/><text transform=\"translate(14,147.0) rotate(-90)\" text-anchor=\"middle\" fill=\"#3a4356\">Glucosa (mg/dL)<\/text><text x=\"300.0\" y=\"312\" text-anchor=\"middle\" fill=\"#3a4356\">Tiempo (min)<\/text><text x=\"108.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">0<\/text><text x=\"204.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">30<\/text><text x=\"300.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">60<\/text><text x=\"396.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">90<\/text><text x=\"492.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">120<\/text><polyline fill=\"none\" stroke=\"#1660a8\" stroke-width=\"2.5\" points=\"108.0,195.1 204.0,154.4 300.0,169.2 396.0,184.0 492.0,191.4\"/><circle cx=\"108.0\" cy=\"195.1\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"108.0\" y=\"187.1\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">85<\/text><circle cx=\"204.0\" cy=\"154.4\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"204.0\" y=\"146.4\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">140<\/text><circle cx=\"300.0\" cy=\"169.2\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"300.0\" y=\"161.2\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">120<\/text><circle cx=\"396.0\" cy=\"184.0\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"396.0\" y=\"176.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">100<\/text><circle cx=\"492.0\" cy=\"191.4\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"492.0\" y=\"183.4\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">90<\/text><polyline fill=\"none\" stroke=\"#d9822b\" stroke-width=\"2.5\" points=\"108.0,161.8 204.0,87.8 300.0,65.6 396.0,73.0 492.0,84.1\"/><circle cx=\"108.0\" cy=\"161.8\" r=\"3.5\" fill=\"#d9822b\"/><text x=\"108.0\" y=\"178.8\" text-anchor=\"middle\" font-size=\"11\" fill=\"#d9822b\" font-weight=\"bold\">130<\/text><circle cx=\"204.0\" cy=\"87.8\" r=\"3.5\" fill=\"#d9822b\"/><text x=\"204.0\" y=\"104.8\" text-anchor=\"middle\" font-size=\"11\" fill=\"#d9822b\" font-weight=\"bold\">230<\/text><circle cx=\"300.0\" cy=\"65.6\" r=\"3.5\" fill=\"#d9822b\"/><text x=\"300.0\" y=\"82.6\" text-anchor=\"middle\" font-size=\"11\" fill=\"#d9822b\" font-weight=\"bold\">260<\/text><circle cx=\"396.0\" cy=\"73.0\" r=\"3.5\" fill=\"#d9822b\"/><text x=\"396.0\" y=\"90.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#d9822b\" font-weight=\"bold\">250<\/text><circle cx=\"492.0\" cy=\"84.1\" r=\"3.5\" fill=\"#d9822b\"/><text x=\"492.0\" y=\"101.1\" text-anchor=\"middle\" font-size=\"11\" fill=\"#d9822b\" font-weight=\"bold\">235<\/text><rect x=\"60\" y=\"286\" width=\"12\" height=\"12\" fill=\"#1660a8\"/><text x=\"76\" y=\"296\" fill=\"#1d2433\">Persona A<\/text><rect x=\"149\" y=\"286\" width=\"12\" height=\"12\" fill=\"#d9822b\"/><text x=\"165\" y=\"296\" fill=\"#1d2433\">Persona B<\/text><\/svg><\/div>", "items": [{"id": "CNB-135", "niv": 2, "cp": "cn_uso_comprensivo", "cn": "biologico", "e": "Varias horas después del registro, la persona A no ha comido y su glucosa empieza a bajar por debajo de su valor normal. ¿Qué respuesta del organismo ayuda a mantener la homeostasis?", "f": "Homeostasis de la glucosa: insulina y glucagón", "vis": "", "o": [["A", "El hígado guarda más glucosa en forma de glucógeno para ahorrarla.", "Guardar glucosa como glucógeno la retira de la sangre; ese proceso ocurre cuando la glucosa está alta, no baja.", false], ["B", "Los riñones devuelven a la sangre la glucosa que ya se había eliminado en la orina.", "En una persona sana prácticamente no se pierde glucosa en la orina; la reserva que se usa en ayunas está en el hígado.", false], ["C", "El páncreas libera glucagón, que estimula al hígado a liberar glucosa a la sangre.", "El glucagón actúa de forma opuesta a la insulina: hace que el hígado descomponga glucógeno y libere glucosa.", true], ["D", "El páncreas libera más insulina para que la glucosa vuelva a subir.", "La insulina hace bajar la glucosa en la sangre; liberarla en ayunas empeoraría la situación.", false]]}, {"id": "CNB-136", "niv": 2, "cp": "cn_explicacion", "cn": "biologico", "e": "¿Por qué la glucosa de la persona A vuelve a un valor cercano al inicial dos horas después de beber la solución?", "f": "Acción de la insulina", "vis": "", "o": [["A", "Porque la insulina destruye las moléculas de glucosa que sobran en la sangre.", "La insulina no destruye la glucosa: facilita que las células la tomen y la usen o la almacenen.", false], ["B", "Porque toda la glucosa se eliminó por la orina en pocos minutos.", "En una persona sana la glucosa no se elimina por la orina en estas condiciones; la disminución se debe a que las células la toman.", false], ["C", "Porque el agua de la solución se repartió en la sangre y diluyó la glucosa.", "El volumen bebido apenas diluye la sangre; además, la persona B bebió lo mismo y su glucosa siguió alta. La baja se debe a que las células toman la glucosa.", false], ["D", "Porque su páncreas liberó insulina y las células tomaron la glucosa.", "La insulina facilita la entrada de glucosa a las células, lo que hace bajar su concentración en la sangre.", true]]}, {"id": "CNB-137", "niv": 1, "cp": "cn_indagacion", "cn": "biologico", "e": "¿Qué dato de la gráfica es consistente con que la persona B tenga diabetes?", "f": "Interpretación de gráficas: curva de glucosa", "vis": "", "o": [["A", "Su glucosa estaba alta en ayunas y seguía alta a los 120 minutos.", "Partió de 130 mg/dL y a los 120 minutos tenía 235 mg/dL, sin regresar al valor inicial, lo que indica poca acción de la insulina.", true], ["B", "Su glucosa aumentó después de beber la solución.", "La glucosa de la persona A también aumentó; ese dato no distingue a las dos personas.", false], ["C", "Su glucosa a los 120 minutos fue igual a la de A en ayunas.", "Es falso: B tenía 235 mg/dL a los 120 minutos y A tenía 85 mg/dL en ayunas.", false], ["D", "Su glucosa a los 30 minutos fue menor que la que tenía la persona A.", "Es falso: a los 30 minutos B tenía 230 mg/dL y A tenía 140 mg/dL.", false]]}]}, {"comp": "ciencias_naturales", "sim": "s11-2", "ses": 1, "ind": "Ósmosis en tejido de papa", "tt": "", "texto": "Unos estudiantes cortaron cilindros de papa de tamaño similar, midieron su masa y colocaron cada uno en una solución de sacarosa de distinta concentración. Después de 24 horas volvieron a medir la masa y calcularon el cambio porcentual. Una masa que aumenta indica que el tejido ganó agua; una que disminuye, que perdió agua.", "vis": "<table class=\"vt\"><caption>Tabla 10. Cambio de masa de los cilindros de papa<\/caption><thead><tr><th>Concentración de sacarosa (mol/L)<\/th><th>Cambio de masa (%)<\/th><\/tr><\/thead><tbody><tr><td>0 (agua destilada)<\/td><td>+12<\/td><\/tr><tr><td>0,2<\/td><td>+5<\/td><\/tr><tr><td>0,4<\/td><td>−3<\/td><\/tr><tr><td>0,6<\/td><td>−9<\/td><\/tr><tr><td>0,8<\/td><td>−14<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Datos ficticios.<\/div>", "items": [{"id": "CNB-140", "niv": 1, "cp": "cn_indagacion", "cn": "biologico", "e": "Según la tabla, ¿en qué rango de concentración de sacarosa la papa no ganaría ni perdería masa?", "f": "Análisis de datos: ósmosis", "vis": "", "o": [["A", "Entre 0 y 0,2 mol/L.", "En ese rango la papa ganó masa en los dos extremos (+12 % y +5 %), así que el punto sin cambio está más arriba.", false], ["B", "Entre 0,2 y 0,4 mol/L.", "La papa ganó masa a 0,2 mol/L (+5 %) y perdió a 0,4 mol/L (−3 %); el cambio nulo está entre esas dos concentraciones.", true], ["C", "Entre 0,4 y 0,6 mol/L.", "En ese rango la papa perdió masa en los dos extremos (−3 % y −9 %).", false], ["D", "Por encima de 0,8 mol/L.", "A concentraciones mayores la pérdida de masa es cada vez más grande; no se acercaría a cero.", false]]}, {"id": "CNB-141", "niv": 2, "cp": "cn_indagacion", "cn": "biologico", "e": "¿Por qué los estudiantes compararon el cambio porcentual de masa y no solo la masa final de cada cilindro?", "f": "Diseño experimental: registro de datos", "vis": "", "o": [["A", "Porque la masa final de los cilindros fue la misma en todas las soluciones.", "Si la masa final fuera igual en todas, no habría diferencias que analizar; los datos muestran cambios distintos.", false], ["B", "Porque calcular el porcentaje evita tener que usar una balanza en el experimento.", "Para calcular el porcentaje hay que medir la masa inicial y final con una balanza.", false], ["C", "Porque las masas iniciales podían diferir un poco y el porcentaje las hace comparables.", "El cambio porcentual expresa la variación respecto a la masa de cada cilindro; así las pequeñas diferencias iniciales no distorsionan la comparación.", true], ["D", "Porque el porcentaje permite saber qué sustancia entró o salió de cada cilindro de papa.", "El cambio de masa no identifica la sustancia que se movió; eso se deduce del modelo de ósmosis.", false]]}, {"id": "CNB-142", "niv": 2, "cp": "cn_uso_comprensivo", "cn": "biologico", "e": "En los hospitales, muchos medicamentos que se aplican en la vena se diluyen en suero fisiológico (NaCl al 0,9 % m/v) y no en agua destilada. ¿Por qué?", "f": "Ósmosis y soluciones isotónicas", "vis": "", "o": [["A", "Porque el suero es isotónico: los glóbulos rojos no ganan ni pierden agua en él.", "El suero es isotónico con la sangre; el agua destilada es hipotónica y haría entrar agua a las células hasta romperlas.", true], ["B", "Porque el agua destilada haría que los glóbulos rojos perdieran agua y se arrugaran.", "Invierte la dirección de la ósmosis: en agua destilada el agua entra a los glóbulos rojos, que se hinchan y pueden romperse.", false], ["C", "Porque la sal del suero elimina las bacterias que pudiera tener el medicamento.", "La concentración de sal del suero no es un desinfectante; su función es igualar la concentración de solutos con la de las células.", false], ["D", "Porque el agua destilada no puede atravesar la membrana de los glóbulos rojos.", "El agua atraviesa la membrana; justamente por eso el agua destilada sería peligrosa.", false]]}]}, {"comp": "ciencias_naturales", "sim": "s11-2", "ses": 1, "ind": "Deforestación y potreros en un municipio amazónico", "tt": "", "texto": "Una organización ambiental registró, con imágenes de satélite, la superficie de bosque talada cada año en un municipio amazónico y la superficie de potreros para ganado que apareció cada año en el mismo municipio. Los datos son ficticios.", "vis": "<div class=\"vfig\"><svg class=\"vg\" viewBox=\"0 0 560 320\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Gráfica 9. Bosque talado y potreros nuevos por año\" font-family=\"Arial, sans-serif\" font-size=\"12\"><rect width=\"560\" height=\"320\" fill=\"#ffffff\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"13\" fill=\"#1d2433\">Gráfica 9. Bosque talado y potreros nuevos por año<\/text><line x1=\"60\" y1=\"258.0\" x2=\"540\" y2=\"258.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"262.0\" text-anchor=\"end\" fill=\"#3a4356\">0<\/text><line x1=\"60\" y1=\"213.6\" x2=\"540\" y2=\"213.6\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"217.6\" text-anchor=\"end\" fill=\"#3a4356\">500<\/text><line x1=\"60\" y1=\"169.2\" x2=\"540\" y2=\"169.2\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"173.2\" text-anchor=\"end\" fill=\"#3a4356\">1.000<\/text><line x1=\"60\" y1=\"124.8\" x2=\"540\" y2=\"124.8\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"128.8\" text-anchor=\"end\" fill=\"#3a4356\">1.500<\/text><line x1=\"60\" y1=\"80.4\" x2=\"540\" y2=\"80.4\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"84.4\" text-anchor=\"end\" fill=\"#3a4356\">2.000<\/text><line x1=\"60\" y1=\"36.0\" x2=\"540\" y2=\"36.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"40.0\" text-anchor=\"end\" fill=\"#3a4356\">2.500<\/text><line x1=\"60\" y1=\"258\" x2=\"540\" y2=\"258\" stroke=\"#3a4356\"/><line x1=\"60\" y1=\"258\" x2=\"60\" y2=\"36\" stroke=\"#3a4356\"/><text transform=\"translate(14,147.0) rotate(-90)\" text-anchor=\"middle\" fill=\"#3a4356\">Superficie (ha)<\/text><text x=\"300.0\" y=\"312\" text-anchor=\"middle\" fill=\"#3a4356\">Año<\/text><text x=\"100.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">2019<\/text><text x=\"180.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">2020<\/text><text x=\"260.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">2021<\/text><text x=\"340.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">2022<\/text><text x=\"420.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">2023<\/text><text x=\"500.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">2024<\/text><rect x=\"72.0\" y=\"151.4\" width=\"28.0\" height=\"106.6\" fill=\"#1660a8\"/><text x=\"86.0\" y=\"147.4\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">1.200<\/text><rect x=\"152.0\" y=\"124.8\" width=\"28.0\" height=\"133.2\" fill=\"#1660a8\"/><text x=\"166.0\" y=\"120.8\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">1.500<\/text><rect x=\"232.0\" y=\"89.3\" width=\"28.0\" height=\"168.7\" fill=\"#1660a8\"/><text x=\"246.0\" y=\"85.3\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">1.900<\/text><rect x=\"312.0\" y=\"71.5\" width=\"28.0\" height=\"186.5\" fill=\"#1660a8\"/><text x=\"326.0\" y=\"67.5\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">2.100<\/text><rect x=\"392.0\" y=\"115.9\" width=\"28.0\" height=\"142.1\" fill=\"#1660a8\"/><text x=\"406.0\" y=\"111.9\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">1.600<\/text><rect x=\"472.0\" y=\"142.6\" width=\"28.0\" height=\"115.4\" fill=\"#1660a8\"/><text x=\"486.0\" y=\"138.6\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">1.300<\/text><rect x=\"100.0\" y=\"169.2\" width=\"28.0\" height=\"88.8\" fill=\"#d9822b\"/><text x=\"114.0\" y=\"165.2\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">1.000<\/text><rect x=\"180.0\" y=\"142.6\" width=\"28.0\" height=\"115.4\" fill=\"#d9822b\"/><text x=\"194.0\" y=\"138.6\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">1.300<\/text><rect x=\"260.0\" y=\"107.0\" width=\"28.0\" height=\"151.0\" fill=\"#d9822b\"/><text x=\"274.0\" y=\"103.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">1.700<\/text><rect x=\"340.0\" y=\"89.3\" width=\"28.0\" height=\"168.7\" fill=\"#d9822b\"/><text x=\"354.0\" y=\"85.3\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">1.900<\/text><rect x=\"420.0\" y=\"133.7\" width=\"28.0\" height=\"124.3\" fill=\"#d9822b\"/><text x=\"434.0\" y=\"129.7\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">1.400<\/text><rect x=\"500.0\" y=\"160.3\" width=\"28.0\" height=\"97.7\" fill=\"#d9822b\"/><text x=\"514.0\" y=\"156.3\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">1.100<\/text><rect x=\"60\" y=\"286\" width=\"12\" height=\"12\" fill=\"#1660a8\"/><text x=\"76\" y=\"296\" fill=\"#1d2433\">Bosque talado<\/text><rect x=\"177\" y=\"286\" width=\"12\" height=\"12\" fill=\"#d9822b\"/><text x=\"193\" y=\"296\" fill=\"#1d2433\">Potreros nuevos<\/text><\/svg><\/div>", "items": [{"id": "CNB-157", "niv": 2, "cp": "cn_indagacion", "cn": "cts", "e": "¿Qué afirmación se apoya en los datos de la gráfica?", "f": "Interpretación de gráficas", "vis": "", "o": [["A", "La deforestación de 2024 fue menor que la de 2019.", "En 2024 se talaron 1.300 ha y en 2019, 1.200 ha: fue mayor.", false], ["B", "La superficie de potreros nuevos superó a la superficie deforestada en todos los años.", "En todos los años la superficie talada fue mayor que la de potreros nuevos.", false], ["C", "El año con más deforestación fue también el año con más potreros nuevos.", "Las dos series suben y bajan juntas: el máximo de ambas está en 2022 y los valores altos coinciden.", true], ["D", "La deforestación aumentó todos los años entre 2019 y 2024.", "Desde 2022 la deforestación disminuyó (2.100, 1.600 y 1.300 ha).", false]]}, {"id": "CNB-158", "niv": 3, "cp": "cn_indagacion", "cn": "cts", "e": "Un concejal afirma: «Los datos prueban que la ganadería es la única causa de la deforestación en el municipio». ¿Por qué esta conclusión no está justificada?", "f": "Correlación y causalidad", "vis": "", "o": [["A", "Porque la deforestación bajó en 2023 y 2024, lo que demuestra que la ganadería ya no la causa.", "Una disminución no demuestra que la ganadería haya dejado de influir; los potreros nuevos también bajaron en esos años.", false], ["B", "Porque los potreros nuevos aparecieron después de la tala, así que la tala no pudo hacerse para la ganadería.", "La gráfica muestra datos anuales del mismo año, no el orden de los hechos; y que los potreros aparezcan después de talar es compatible con que la tala se haga para ganadería.", false], ["C", "Porque la superficie de potreros nuevos fue menor que la talada cada año, lo que prueba que la ganadería no influye en la tala.", "Que los potreros sean algo menores que la tala no prueba que la ganadería no influya; las dos series suben y bajan juntas.", false], ["D", "Porque una relación entre dos variables no demuestra que una sea la única causa de la otra.", "Los datos muestran que las dos variables cambian juntas, pero no incluyen información sobre otras actividades que también podrían talar bosque.", true]]}]}, {"comp": "matematicas", "sim": "s11-2", "ses": 2, "ind": "Préstamos de bicicletas públicas", "tt": "", "texto": "La empresa que administra el sistema de bicicletas públicas de un municipio registró el número de préstamos realizados cada día durante una semana. Los resultados se muestran en la gráfica.", "vis": "<div class=\"vfig\"><svg class=\"vg\" viewBox=\"0 0 560 320\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Gráfica 10. Préstamos de bicicletas por día\" font-family=\"Arial, sans-serif\" font-size=\"12\"><rect width=\"560\" height=\"320\" fill=\"#ffffff\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"13\" fill=\"#1d2433\">Gráfica 10. Préstamos de bicicletas por día<\/text><line x1=\"60\" y1=\"258.0\" x2=\"540\" y2=\"258.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"262.0\" text-anchor=\"end\" fill=\"#3a4356\">0<\/text><line x1=\"60\" y1=\"221.0\" x2=\"540\" y2=\"221.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"225.0\" text-anchor=\"end\" fill=\"#3a4356\">250<\/text><line x1=\"60\" y1=\"184.0\" x2=\"540\" y2=\"184.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"188.0\" text-anchor=\"end\" fill=\"#3a4356\">500<\/text><line x1=\"60\" y1=\"147.0\" x2=\"540\" y2=\"147.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"151.0\" text-anchor=\"end\" fill=\"#3a4356\">750<\/text><line x1=\"60\" y1=\"110.0\" x2=\"540\" y2=\"110.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"114.0\" text-anchor=\"end\" fill=\"#3a4356\">1.000<\/text><line x1=\"60\" y1=\"73.0\" x2=\"540\" y2=\"73.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"77.0\" text-anchor=\"end\" fill=\"#3a4356\">1.250<\/text><line x1=\"60\" y1=\"36.0\" x2=\"540\" y2=\"36.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"40.0\" text-anchor=\"end\" fill=\"#3a4356\">1.500<\/text><line x1=\"60\" y1=\"258\" x2=\"540\" y2=\"258\" stroke=\"#3a4356\"/><line x1=\"60\" y1=\"258\" x2=\"60\" y2=\"36\" stroke=\"#3a4356\"/><text transform=\"translate(14,147.0) rotate(-90)\" text-anchor=\"middle\" fill=\"#3a4356\">Número de préstamos<\/text><text x=\"300.0\" y=\"312\" text-anchor=\"middle\" fill=\"#3a4356\">Día<\/text><text x=\"94.3\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Lun<\/text><text x=\"162.9\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Mar<\/text><text x=\"231.4\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Mié<\/text><text x=\"300.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Jue<\/text><text x=\"368.6\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Vie<\/text><text x=\"437.1\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Sáb<\/text><text x=\"505.7\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Dom<\/text><rect x=\"70.3\" y=\"87.8\" width=\"48.0\" height=\"170.2\" fill=\"#1660a8\"/><text x=\"94.3\" y=\"83.8\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">1.150<\/text><rect x=\"138.9\" y=\"74.5\" width=\"48.0\" height=\"183.5\" fill=\"#1660a8\"/><text x=\"162.9\" y=\"70.5\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">1.240<\/text><rect x=\"207.4\" y=\"64.1\" width=\"48.0\" height=\"193.9\" fill=\"#1660a8\"/><text x=\"231.4\" y=\"60.1\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">1.310<\/text><rect x=\"276.0\" y=\"83.4\" width=\"48.0\" height=\"174.6\" fill=\"#1660a8\"/><text x=\"300.0\" y=\"79.4\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">1.180<\/text><rect x=\"344.6\" y=\"47.8\" width=\"48.0\" height=\"210.2\" fill=\"#1660a8\"/><text x=\"368.6\" y=\"43.8\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">1.420<\/text><rect x=\"413.1\" y=\"124.8\" width=\"48.0\" height=\"133.2\" fill=\"#1660a8\"/><text x=\"437.1\" y=\"120.8\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">900<\/text><rect x=\"481.7\" y=\"163.3\" width=\"48.0\" height=\"94.7\" fill=\"#1660a8\"/><text x=\"505.7\" y=\"159.3\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">640<\/text><\/svg><\/div>", "items": [{"id": "MTB-101", "niv": 1, "cp": "mt_interpretacion", "cn": "", "e": "El promedio diario de préstamos de esa semana fue 1.120. ¿En cuántos días el número de préstamos superó ese promedio?", "f": "Cálculo propio", "vis": "", "o": [["A", "3.", "Solo cuenta los días que superan 1.200 (martes, miércoles y viernes); el lunes (1.150) y el jueves (1.180) también superan 1.120.", false], ["B", "4.", "Omite uno de los días por encima del promedio; son lunes, martes, miércoles, jueves y viernes.", false], ["C", "5.", "Superan 1.120 el lunes (1.150), el martes (1.240), el miércoles (1.310), el jueves (1.180) y el viernes (1.420).", true], ["D", "6.", "Incluye el sábado, pero 900 es menor que el promedio de 1.120.", false]]}, {"id": "MTB-102", "niv": 2, "cp": "mt_formulacion", "cn": "", "e": "¿Cuántos préstamos más se hicieron, en promedio por día, de lunes a viernes que durante el fin de semana?", "f": "Cálculo propio", "vis": "", "o": [["A", "140.", "Compara el promedio de toda la semana (1.120) con el de lunes a viernes (1.260).", false], ["B", "350.", "Compara el promedio de toda la semana (1.120) con el del fin de semana (770).", false], ["C", "490.", "Lunes a viernes: 6.300 ÷ 5 = 1.260. Fin de semana: 1.540 ÷ 2 = 770. Diferencia: 1.260 − 770 = 490.", true], ["D", "4.760.", "Resta los totales (6.300 − 1.540) en lugar de los promedios diarios.", false]]}, {"id": "MTB-103", "niv": 2, "cp": "mt_argumentacion", "cn": "", "e": "Un funcionario afirma: «Durante el fin de semana (sábado y domingo) se hizo menos del 20 % de los préstamos de toda la semana». ¿Es correcta su afirmación?", "f": "Cálculo propio", "vis": "", "o": [["A", "Sí, porque el sábado y el domingo son 2 de los 7 días, menos del 20 % de la semana.", "2 de 7 días equivale a cerca del 28,6 %, y además la afirmación trata de préstamos, no de días.", false], ["B", "Sí, porque el fin de semana suma 1.540 préstamos y el 20 % del total es 1.568.", "900 + 640 = 1.540 y 0,2 × 7.840 = 1.568; como 1.540 < 1.568, el fin de semana representa cerca del 19,6 % del total.", true], ["C", "No, porque el fin de semana suma 1.540 préstamos, que son el 22 % de 7.000.", "Suma mal el total semanal: es 7.840, no 7.000. Con el total correcto, 1.540 es cerca del 19,6 %.", false], ["D", "No, porque el domingo hubo menos préstamos que cualquier otro día.", "Es cierto, pero no dice nada sobre qué porcentaje del total representa el fin de semana.", false]]}]}, {"comp": "matematicas", "sim": "s11-2", "ses": 2, "ind": "Pista de trote de un club", "tt": "", "texto": "Un club de atletismo tiene una pista de trote formada por dos tramos rectos de 100 m y dos semicircunferencias de 60 m de diámetro en los extremos, como muestra la figura (la cota de 60 m, a la derecha, indica el diámetro de cada semicircunferencia). Dentro de la pista hay una zona de pasto formada por un rectángulo de 100 m × 60 m y dos semicírculos de 60 m de diámetro.\n\nUse π ≈ 3,14.", "vis": "<div class=\"vfig\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 460 220\" width=\"460\" height=\"220\" font-family=\"Arial, sans-serif\" font-size=\"14\"><rect width=\"460\" height=\"220\" fill=\"#ffffff\"/><path d=\"M110,50 H310 A60,60 0 0 1 310,170 H110 A60,60 0 0 1 110,50 Z\" fill=\"#e8f3e8\" stroke=\"#1d2433\" stroke-width=\"3\"/><line x1=\"110\" y1=\"50\" x2=\"110\" y2=\"170\" stroke=\"#1d2433\" stroke-dasharray=\"5,4\"/><line x1=\"310\" y1=\"50\" x2=\"310\" y2=\"170\" stroke=\"#1d2433\" stroke-dasharray=\"5,4\"/><text x=\"210\" y=\"40\" text-anchor=\"middle\" fill=\"#1d2433\">100 m<\/text><text x=\"210\" y=\"192\" text-anchor=\"middle\" fill=\"#1d2433\">100 m<\/text><text x=\"210\" y=\"115\" text-anchor=\"middle\" fill=\"#1d2433\">Zona de pasto<\/text><line x1=\"312\" y1=\"50\" x2=\"396\" y2=\"50\" stroke=\"#1d2433\" stroke-width=\"1\"/><line x1=\"312\" y1=\"170\" x2=\"396\" y2=\"170\" stroke=\"#1d2433\" stroke-width=\"1\"/><line x1=\"390\" y1=\"60\" x2=\"390\" y2=\"160\" stroke=\"#1d2433\" stroke-width=\"1.5\"/><polygon points=\"390,51 385,61 395,61\" fill=\"#1d2433\"/><polygon points=\"390,169 385,159 395,159\" fill=\"#1d2433\"/><text x=\"398\" y=\"115\" fill=\"#1d2433\">60 m<\/text><\/svg><\/div>", "items": [{"id": "MTB-104", "niv": 2, "cp": "mt_formulacion", "cn": "", "e": "¿Cuál es la longitud de una vuelta completa a la pista?", "f": "Cálculo propio", "vis": "", "o": [["A", "294,2 m.", "Suma solo una semicircunferencia (3,14 × 30 = 94,2 m) a los dos tramos rectos; faltan los otros 94,2 m.", false], ["B", "320 m.", "Es el perímetro del rectángulo de 100 m × 60 m; los extremos de la pista son curvos, no segmentos de 60 m.", false], ["C", "388,4 m.", "Las dos semicircunferencias forman una circunferencia de 60 m de diámetro: 3,14 × 60 = 188,4 m; más 200 m de rectas: 388,4 m.", true], ["D", "576,8 m.", "Usa 60 m como radio en lugar de diámetro: 2 × 3,14 × 60 = 376,8 m, más 200 m.", false]]}, {"id": "MTB-105", "niv": 3, "cp": "mt_formulacion", "cn": "", "e": "¿Cuál es el área de la zona de pasto?", "f": "Cálculo propio", "vis": "", "o": [["A", "6.094,2 m².", "Suma al rectángulo 3,14 × 30, que es π·r y no el área del círculo (π·r²).", false], ["B", "7.413 m².", "Suma al rectángulo el área de un solo semicírculo (1.413 m²); hay dos semicírculos.", false], ["C", "8.826 m².", "Rectángulo: 100 × 60 = 6.000 m². Los dos semicírculos forman un círculo de radio 30 m: 3,14 × 30² = 2.826 m². Total: 8.826 m².", true], ["D", "17.304 m².", "Usa el diámetro (60 m) como radio: 3,14 × 60² = 11.304 m².", false]]}, {"id": "MTB-106", "niv": 3, "cp": "mt_argumentacion", "cn": "", "e": "El entrenador afirma: «Si se mantienen los tramos rectos de 100 m y se duplica el diámetro de las semicircunferencias, la parte curva de la pista duplicará su longitud, pero la vuelta completa no se duplicará». ¿Es válida la afirmación?", "f": "Cálculo propio", "vis": "", "o": [["A", "Sí, porque la parte curva es proporcional al diámetro y se duplica, pero los 200 m de rectas no cambian.", "Al duplicar el diámetro se duplica la longitud de la circunferencia; como las rectas siguen midiendo 200 m, la vuelta aumenta menos que el doble.", true], ["B", "No, porque al duplicar el diámetro también se duplican los tramos rectos de la pista.", "El enunciado dice que los tramos rectos se mantienen en 100 m.", false], ["C", "No, porque la parte curva se cuadruplica, como el área de un círculo al duplicar su diámetro.", "Confunde longitud con área: la longitud de una circunferencia se duplica al duplicar el diámetro; el área sí se cuadruplica.", false], ["D", "Sí, porque la vuelta solo cambia en las curvas, que aumentan 3,14 × 30 = 94,2 m.", "La conclusión coincide, pero el cálculo es erróneo: las curvas aumentan 3,14 × 60 = 188,4 m, no 94,2 m.", false]]}]}, {"comp": "matematicas", "sim": "s11-2", "ses": 2, "ind": "Producción en una finca cafetera", "tt": "", "texto": "La gráfica muestra la producción mensual de café pergamino seco de una finca cafetera entre abril y septiembre.", "vis": "<div class=\"vfig\"><svg class=\"vg\" viewBox=\"0 0 560 320\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Gráfica 11. Producción de café pergamino seco\" font-family=\"Arial, sans-serif\" font-size=\"12\"><rect width=\"560\" height=\"320\" fill=\"#ffffff\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"13\" fill=\"#1d2433\">Gráfica 11. Producción de café pergamino seco<\/text><line x1=\"60\" y1=\"258.0\" x2=\"540\" y2=\"258.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"262.0\" text-anchor=\"end\" fill=\"#3a4356\">0<\/text><line x1=\"60\" y1=\"202.5\" x2=\"540\" y2=\"202.5\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"206.5\" text-anchor=\"end\" fill=\"#3a4356\">200<\/text><line x1=\"60\" y1=\"147.0\" x2=\"540\" y2=\"147.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"151.0\" text-anchor=\"end\" fill=\"#3a4356\">400<\/text><line x1=\"60\" y1=\"91.5\" x2=\"540\" y2=\"91.5\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"95.5\" text-anchor=\"end\" fill=\"#3a4356\">600<\/text><line x1=\"60\" y1=\"36.0\" x2=\"540\" y2=\"36.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"40.0\" text-anchor=\"end\" fill=\"#3a4356\">800<\/text><line x1=\"60\" y1=\"258\" x2=\"540\" y2=\"258\" stroke=\"#3a4356\"/><line x1=\"60\" y1=\"258\" x2=\"60\" y2=\"36\" stroke=\"#3a4356\"/><text transform=\"translate(14,147.0) rotate(-90)\" text-anchor=\"middle\" fill=\"#3a4356\">Producción (kg)<\/text><text x=\"300.0\" y=\"312\" text-anchor=\"middle\" fill=\"#3a4356\">Mes<\/text><text x=\"100.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Abr<\/text><text x=\"180.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">May<\/text><text x=\"260.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Jun<\/text><text x=\"340.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Jul<\/text><text x=\"420.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Ago<\/text><text x=\"500.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Sep<\/text><polyline fill=\"none\" stroke=\"#1660a8\" stroke-width=\"2.5\" points=\"100.0,169.2 180.0,144.2 260.0,152.6 340.0,174.8 420.0,133.1 500.0,85.9\"/><circle cx=\"100.0\" cy=\"169.2\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"100.0\" y=\"161.2\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">320<\/text><circle cx=\"180.0\" cy=\"144.2\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"180.0\" y=\"136.2\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">410<\/text><circle cx=\"260.0\" cy=\"152.6\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"260.0\" y=\"144.6\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">380<\/text><circle cx=\"340.0\" cy=\"174.8\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"340.0\" y=\"166.8\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">300<\/text><circle cx=\"420.0\" cy=\"133.1\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"420.0\" y=\"125.1\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">450<\/text><circle cx=\"500.0\" cy=\"85.9\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"500.0\" y=\"77.9\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">620<\/text><\/svg><\/div>", "items": [{"id": "MTB-108", "niv": 2, "cp": "mt_interpretacion", "cn": "", "e": "¿Entre qué par de meses consecutivos se presentó el mayor aumento de la producción?", "f": "Cálculo propio", "vis": "", "o": [["A", "Entre abril y mayo.", "El aumento fue de 410 − 320 = 90 kg, menor que otros aumentos del periodo.", false], ["B", "Entre junio y julio.", "En ese intervalo la producción disminuyó 80 kg (de 380 a 300); no es un aumento.", false], ["C", "Entre julio y agosto.", "El aumento fue de 150 kg, pero entre agosto y septiembre fue mayor.", false], ["D", "Entre agosto y septiembre.", "La producción pasó de 450 a 620 kg: un aumento de 170 kg, el mayor del periodo.", true]]}, {"id": "MTB-109", "niv": 1, "cp": "mt_argumentacion", "cn": "", "e": "El administrador afirma que la producción de septiembre fue más del doble de la de julio. ¿Tiene razón?", "f": "Cálculo propio", "vis": "", "o": [["A", "Sí, porque septiembre fue el mes de mayor producción de todo el periodo.", "Ser el mayor valor no basta para afirmar que es más del doble de otro; hay que comparar con 2 × 300.", false], ["B", "Sí, porque el doble de la producción de julio es 600 kg y en septiembre fue de 620 kg.", "2 × 300 = 600 y 620 > 600: septiembre supera el doble de julio.", true], ["C", "No, porque el doble de la producción de julio es 760 kg y en septiembre fue de 620 kg.", "Lee mal la gráfica: toma 380 kg (junio) como producción de julio, que fue de 300 kg.", false], ["D", "No, porque de julio a septiembre la producción solo aumentó 170 kg.", "170 kg es el aumento de agosto a septiembre; de julio a septiembre aumentó 320 kg.", false]]}]}, {"comp": "matematicas", "sim": "s11-2", "ses": 2, "ind": "Dos planes de ahorro", "tt": "", "texto": "Una familia quiere ahorrar $ 2.000.000 durante varios años y compara dos planes:\n\nPlan A: interés simple del 7,9 % anual (cada año se suma el 7,9 % del valor inicial).\n\nPlan B: interés compuesto del 7 % anual (cada año se suma el 7 % del saldo acumulado hasta ese momento).\n\nLa gráfica muestra el saldo de cada plan, en miles de pesos, redondeado a la unidad de mil.", "vis": "<div class=\"vfig\"><svg class=\"vg\" viewBox=\"0 0 560 320\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Gráfica 12. Saldo de los planes de ahorro\" font-family=\"Arial, sans-serif\" font-size=\"12\"><rect width=\"560\" height=\"320\" fill=\"#ffffff\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"13\" fill=\"#1d2433\">Gráfica 12. Saldo de los planes de ahorro<\/text><line x1=\"60\" y1=\"258.0\" x2=\"540\" y2=\"258.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"262.0\" text-anchor=\"end\" fill=\"#3a4356\">0<\/text><line x1=\"60\" y1=\"221.0\" x2=\"540\" y2=\"221.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"225.0\" text-anchor=\"end\" fill=\"#3a4356\">500<\/text><line x1=\"60\" y1=\"184.0\" x2=\"540\" y2=\"184.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"188.0\" text-anchor=\"end\" fill=\"#3a4356\">1.000<\/text><line x1=\"60\" y1=\"147.0\" x2=\"540\" y2=\"147.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"151.0\" text-anchor=\"end\" fill=\"#3a4356\">1.500<\/text><line x1=\"60\" y1=\"110.0\" x2=\"540\" y2=\"110.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"114.0\" text-anchor=\"end\" fill=\"#3a4356\">2.000<\/text><line x1=\"60\" y1=\"73.0\" x2=\"540\" y2=\"73.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"77.0\" text-anchor=\"end\" fill=\"#3a4356\">2.500<\/text><line x1=\"60\" y1=\"36.0\" x2=\"540\" y2=\"36.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"40.0\" text-anchor=\"end\" fill=\"#3a4356\">3.000<\/text><line x1=\"60\" y1=\"258\" x2=\"540\" y2=\"258\" stroke=\"#3a4356\"/><line x1=\"60\" y1=\"258\" x2=\"60\" y2=\"36\" stroke=\"#3a4356\"/><text transform=\"translate(14,147.0) rotate(-90)\" text-anchor=\"middle\" fill=\"#3a4356\">Saldo (miles de pesos)<\/text><text x=\"300.0\" y=\"312\" text-anchor=\"middle\" fill=\"#3a4356\">Año<\/text><text x=\"100.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">0<\/text><text x=\"180.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">1<\/text><text x=\"260.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">2<\/text><text x=\"340.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">3<\/text><text x=\"420.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">4<\/text><text x=\"500.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">5<\/text><polyline fill=\"none\" stroke=\"#1660a8\" stroke-width=\"2.5\" points=\"100.0,110.0 180.0,98.3 260.0,86.6 340.0,74.9 420.0,63.2 500.0,51.5\"/><circle cx=\"100.0\" cy=\"110.0\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"100.0\" y=\"102.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">2.000<\/text><circle cx=\"180.0\" cy=\"98.3\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"180.0\" y=\"90.3\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">2.158<\/text><circle cx=\"260.0\" cy=\"86.6\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"260.0\" y=\"78.6\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">2.316<\/text><circle cx=\"340.0\" cy=\"74.9\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"340.0\" y=\"66.9\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">2.474<\/text><circle cx=\"420.0\" cy=\"63.2\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"420.0\" y=\"55.2\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">2.632<\/text><circle cx=\"500.0\" cy=\"51.5\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"500.0\" y=\"43.5\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">2.790<\/text><polyline fill=\"none\" stroke=\"#d9822b\" stroke-width=\"2.5\" points=\"100.0,110.0 180.0,99.6 260.0,88.5 340.0,76.7 420.0,64.0 500.0,50.4\"/><circle cx=\"100.0\" cy=\"110.0\" r=\"3.5\" fill=\"#d9822b\"/><text x=\"100.0\" y=\"127.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#d9822b\" font-weight=\"bold\">2.000<\/text><circle cx=\"180.0\" cy=\"99.6\" r=\"3.5\" fill=\"#d9822b\"/><text x=\"180.0\" y=\"116.6\" text-anchor=\"middle\" font-size=\"11\" fill=\"#d9822b\" font-weight=\"bold\">2.140<\/text><circle cx=\"260.0\" cy=\"88.5\" r=\"3.5\" fill=\"#d9822b\"/><text x=\"260.0\" y=\"105.5\" text-anchor=\"middle\" font-size=\"11\" fill=\"#d9822b\" font-weight=\"bold\">2.290<\/text><circle cx=\"340.0\" cy=\"76.7\" r=\"3.5\" fill=\"#d9822b\"/><text x=\"340.0\" y=\"93.7\" text-anchor=\"middle\" font-size=\"11\" fill=\"#d9822b\" font-weight=\"bold\">2.450<\/text><circle cx=\"420.0\" cy=\"64.0\" r=\"3.5\" fill=\"#d9822b\"/><text x=\"420.0\" y=\"81.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#d9822b\" font-weight=\"bold\">2.622<\/text><circle cx=\"500.0\" cy=\"50.4\" r=\"3.5\" fill=\"#d9822b\"/><text x=\"500.0\" y=\"67.4\" text-anchor=\"middle\" font-size=\"11\" fill=\"#d9822b\" font-weight=\"bold\">2.805<\/text><rect x=\"60\" y=\"286\" width=\"12\" height=\"12\" fill=\"#1660a8\"/><text x=\"76\" y=\"296\" fill=\"#1d2433\">Plan A<\/text><rect x=\"128\" y=\"286\" width=\"12\" height=\"12\" fill=\"#d9822b\"/><text x=\"144\" y=\"296\" fill=\"#1d2433\">Plan B<\/text><\/svg><\/div>", "items": [{"id": "MTB-116", "niv": 2, "cp": "mt_formulacion", "cn": "", "e": "Un vecino deposita $ 5.000.000 en el plan B. ¿Cuánto dinero tendrá al cabo de 2 años?", "f": "Cálculo propio", "vis": "", "o": [["A", "$ 5.350.000.", "Es el saldo al cabo de 1 año (5.000.000 × 1,07).", false], ["B", "$ 5.700.000.", "Aplica interés simple del 7 %: suma 2 × 350.000; en el plan B los intereses del primer año también generan intereses.", false], ["C", "$ 5.724.500.", "5.000.000 × 1,07 × 1,07 = 5.000.000 × 1,1449 = $ 5.724.500.", true], ["D", "$ 5.790.000.", "Calcula con las condiciones del plan A (7,9 % simple: 5.000.000 + 2 × 395.000), no con las del plan B.", false]]}, {"id": "MTB-117", "niv": 2, "cp": "mt_interpretacion", "cn": "", "e": "Según la gráfica, ¿a partir de qué año el saldo del plan B es mayor que el del plan A?", "f": "Cálculo propio", "vis": "", "o": [["A", "Desde el año 2.", "En el año 2 el plan A tiene 2.316 y el B 2.290: todavía es mayor el A.", false], ["B", "Desde el año 3.", "En el año 3 el plan A tiene 2.474 y el B 2.450.", false], ["C", "Desde el año 4.", "En el año 4 el plan A (2.632) aún supera al B (2.622) por unos 10 mil pesos.", false], ["D", "Desde el año 5.", "En el año 5 el plan B tiene 2.805 miles de pesos y el A 2.790: B supera a A por unos 15 mil pesos.", true]]}, {"id": "MTB-118", "niv": 3, "cp": "mt_argumentacion", "cn": "", "e": "Un asesor afirma: «Como la tasa del plan A (7,9 %) es mayor que la del plan B (7 %), el plan A siempre producirá un saldo mayor». ¿Es válida la afirmación?", "f": "Cálculo propio", "vis": "", "o": [["A", "No: en el B los intereses generan intereses y, con los años, supera al A.", "El plan A crece $ 158.000 fijos por año; el B crece cada año más que el anterior y termina superándolo dentro del periodo de la gráfica.", true], ["B", "No, porque desde el año 1 el saldo del plan B es mayor que el del plan A.", "Es falso: en el año 1 el plan A tiene 2.158 y el B 2.140 miles de pesos.", false], ["C", "Sí, porque el 7,9 % de 2.000 es 158 y el 7 % solo da 140 cada año.", "Trata el plan B como interés simple; en el B el 7 % se calcula sobre el saldo acumulado, que crece cada año.", false], ["D", "Sí, porque en el año 1 el plan A tiene 2.158 y el B 2.140 miles de pesos.", "El dato es cierto, pero un año no prueba que A sea mayor siempre.", false]]}]}, {"comp": "matematicas", "sim": "s11-2", "ses": 2, "ind": "Crecimiento de un cultivo de bacterias", "tt": "", "texto": "En un laboratorio se estudia un cultivo de bacterias que, en condiciones controladas, duplica su número cada 20 minutos. Al iniciar la observación había 500 bacterias.", "vis": "", "items": [{"id": "MTB-119", "niv": 2, "cp": "mt_formulacion", "cn": "", "e": "¿Cuántas bacterias habrá 2 horas después de iniciar la observación?", "f": "Cálculo propio", "vis": "", "o": [["A", "2.000.", "Duplica solo 2 veces (una por hora); en 2 horas hay 6 periodos de 20 minutos.", false], ["B", "6.000.", "Supone un crecimiento lineal: 500 × 2 × 6; la población se multiplica por 2 en cada periodo.", false], ["C", "16.000.", "Calcula 500 × 2⁵: cuenta solo 5 duplicaciones.", false], ["D", "32.000.", "En 120 minutos hay 120 ÷ 20 = 6 duplicaciones: 500 × 2⁶ = 500 × 64 = 32.000.", true]]}, {"id": "MTB-120", "niv": 3, "cp": "mt_interpretacion", "cn": "", "e": "¿Cuál expresión representa el número N de bacterias t horas después de iniciar la observación?", "f": "Cálculo propio", "vis": "", "o": [["A", "N = 2^(3t) + 500.", "Suma la cantidad inicial en lugar de multiplicarla; con t = 0 daría 501 bacterias.", false], ["B", "N = 500 · 2^(3t).", "En cada hora hay 3 periodos de 20 minutos, así que en t horas hay 3t duplicaciones.", true], ["C", "N = 500 · 2^(20t).", "Usa el 20 de los minutos como número de duplicaciones por hora.", false], ["D", "N = 500 · 2^(t/3).", "Esta expresión duplica la población cada 3 horas, no cada 20 minutos.", false]]}]}, {"comp": "matematicas", "sim": "s11-2", "ses": 2, "ind": "Tiempo de desplazamiento al trabajo", "tt": "", "texto": "Para planear nuevas rutas de transporte, la alcaldía de un municipio encuestó a 100 personas que estaban en la terminal de buses sobre el tiempo que tardan en llegar a su trabajo. Los resultados se muestran en la tabla.", "vis": "<table class=\"vt\"><caption>Tabla 11. Tiempo de desplazamiento al trabajo<\/caption><thead><tr><th>Tiempo (minutos)<\/th><th>Número de personas<\/th><\/tr><\/thead><tbody><tr><td>Menos de 15<\/td><td>30<\/td><\/tr><tr><td>De 15 a menos de 30<\/td><td>24<\/td><\/tr><tr><td>De 30 a menos de 45<\/td><td>12<\/td><\/tr><tr><td>De 45 a menos de 60<\/td><td>20<\/td><\/tr><tr><td>De 60 a menos de 75<\/td><td>14<\/td><\/tr><tr><td>Total<\/td><td>100<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Datos ficticios.<\/div>", "items": [{"id": "MTB-121", "niv": 1, "cp": "mt_interpretacion", "cn": "", "e": "¿Qué porcentaje de los encuestados tarda 45 minutos o más en llegar a su trabajo?", "f": "Cálculo propio", "vis": "", "o": [["A", "14 %.", "Solo tiene en cuenta el intervalo de 60 a menos de 75 minutos.", false], ["B", "20 %.", "Solo tiene en cuenta el intervalo de 45 a menos de 60 minutos.", false], ["C", "34 %.", "Tardan 45 minutos o más 20 + 14 = 34 de 100 personas, es decir, el 34 %.", true], ["D", "46 %.", "Incluye también el intervalo de 30 a menos de 45 minutos.", false]]}, {"id": "MTB-122", "niv": 2, "cp": "mt_formulacion", "cn": "", "e": "¿En qué intervalo de tiempo se encuentra la mediana de los datos?", "f": "Cálculo propio", "vis": "", "o": [["A", "Menos de 15 minutos.", "Es el intervalo con más personas (la moda), pero allí solo están los primeros 30 datos.", false], ["B", "De 15 a menos de 30 minutos.", "La mediana está entre los datos 50 y 51; los acumulados son 30 y 54, así que ambos están en este intervalo.", true], ["C", "De 30 a menos de 45 minutos.", "Es el intervalo central de la tabla, pero la mediana se ubica con las frecuencias acumuladas, no por la posición del intervalo.", false], ["D", "De 45 a menos de 60 minutos.", "Al llegar a este intervalo ya se han acumulado 66 datos; la mediana quedó antes.", false]]}, {"id": "MTB-123", "niv": 2, "cp": "mt_argumentacion", "cn": "", "e": "Con estos resultados, el alcalde afirma que el 12 % de todos los habitantes del municipio que trabajan tarda entre 30 y 45 minutos en llegar a su trabajo. ¿Es válida esta conclusión?", "f": "Cálculo propio", "vis": "", "o": [["A", "No, porque solo se encuestó a personas que estaban en la terminal de buses.", "Quienes no pasan por la terminal (por ejemplo, quienes caminan o van en bicicleta) no quedaron representados; con una muestra sesgada no se puede inferir el porcentaje de toda la población.", true], ["B", "Sí, porque 12 de las 100 personas encuestadas tardan de 30 a menos de 45 minutos.", "El dato es correcto para la muestra, pero no justifica generalizarlo a todos los trabajadores del municipio.", false], ["C", "Sí, porque con 100 personas el margen de error es pequeño, sin importar dónde se encueste.", "El tamaño de la muestra no corrige el sesgo que produce encuestar solo en la terminal.", false], ["D", "No, porque el porcentaje correcto es 24 %, el del intervalo de 15 a 30 minutos.", "Lee la fila equivocada: 24 personas tardan de 15 a menos de 30 minutos.", false]]}]}, {"comp": "matematicas", "sim": "s11-2", "ses": 2, "ind": "Tanque de agua para riego", "tt": "", "texto": "Para el riego de un cultivo de hortalizas se instaló un tanque cilíndrico de 2 m de diámetro y 1,5 m de altura (medidas interiores).\n\nRecuerde que 1 m³ equivale a 1.000 litros. Use π ≈ 3,14.", "vis": "", "items": [{"id": "MTB-124", "niv": 2, "cp": "mt_formulacion", "cn": "", "e": "¿Cuál es la capacidad del tanque, en litros?", "f": "Cálculo propio", "vis": "", "o": [["A", "4,71 litros.", "Es el volumen en metros cúbicos (4,71 m³); falta multiplicar por 1.000 para pasarlo a litros.", false], ["B", "4.710 litros.", "V = π · r² · h = 3,14 × 1² × 1,5 = 4,71 m³ = 4.710 litros.", true], ["C", "9.420 litros.", "Calcula 2 · π · r · h, que es el área lateral del cilindro, no su volumen.", false], ["D", "18.840 litros.", "Usa el diámetro (2 m) como radio: 3,14 × 2² × 1,5 = 18,84 m³.", false]]}, {"id": "MTB-125", "niv": 3, "cp": "mt_formulacion", "cn": "", "e": "Se quiere construir un segundo tanque cilíndrico de la misma altura y con el doble de capacidad. ¿Por cuál número se debe multiplicar el radio del tanque actual?", "f": "Cálculo propio", "vis": "", "o": [["A", "Por 1,41 (≈ √2).", "El volumen es proporcional a r²; para que r² se duplique, r debe multiplicarse por √2 ≈ 1,41.", true], ["B", "Por 1,50 (= 3/2).", "Con ese factor el volumen se multiplicaría por 1,5² = 2,25, no por 2.", false], ["C", "Por 2,00 (= 2/1).", "Al duplicar el radio, el volumen se multiplica por 2² = 4.", false], ["D", "Por 4,00 (= 2²).", "Con ese factor el volumen se multiplicaría por 16.", false]]}]}, {"comp": "matematicas", "sim": "s11-2", "ses": 2, "ind": "Ruta de un dron de fumigación", "tt": "", "texto": "Un dron de fumigación recorre un terreno representado en un plano cartesiano en el que cada unidad equivale a 10 metros. El dron debe pasar por los puntos A(1, 2), B(4, 2) y C(4, 6), que forman un triángulo rectángulo con el ángulo recto en B.", "vis": "", "items": [{"id": "MTB-132", "niv": 1, "cp": "mt_interpretacion", "cn": "", "e": "Para fumigar un terreno vecino se programa una ruta que es el reflejo de la original respecto al eje y. ¿Cuáles son las coordenadas del punto que corresponde a C en la nueva ruta?", "f": "Cálculo propio", "vis": "", "o": [["A", "(4, −6), en el cuarto cuadrante.", "Es la reflexión respecto al eje x, no respecto al eje y.", false], ["B", "(6, 4), en el primer cuadrante.", "Es la reflexión respecto a la recta y = x: se intercambian las coordenadas.", false], ["C", "(−4, −6), en el tercer cuadrante.", "Es la reflexión respecto al origen: cambian de signo las dos coordenadas.", false], ["D", "(−4, 6), en el segundo cuadrante.", "En una reflexión respecto al eje y, la abscisa cambia de signo y la ordenada se conserva: (4, 6) → (−4, 6).", true]]}, {"id": "MTB-133", "niv": 2, "cp": "mt_formulacion", "cn": "", "e": "Si el dron va de A a B, luego de B a C y regresa en línea recta de C a A, ¿cuántos metros recorre?", "f": "Cálculo propio", "vis": "", "o": [["A", "60 m.", "Es el área del triángulo (6 unidades cuadradas) multiplicada por 10; no es una longitud.", false], ["B", "70 m.", "Solo suma AB (30 m) y BC (40 m); falta el regreso de C a A.", false], ["C", "120 m.", "AB = 3, BC = 4 y, por Pitágoras, CA = √(3² + 4²) = 5 unidades; el total es 12 unidades × 10 m = 120 m.", true], ["D", "250 m.", "Suma los cuadrados de los catetos (9 + 16 = 25) en lugar de calcular el perímetro.", false]]}, {"id": "MTB-134", "niv": 3, "cp": "mt_argumentacion", "cn": "", "e": "Un técnico afirma que si al triángulo ABC se le aplica una homotecia de razón 2 con centro en A, el área del nuevo triángulo será el doble del área original (en unidades cuadradas del plano). ¿Es correcta la afirmación?", "f": "Cálculo propio", "vis": "", "o": [["A", "No: cada cateto se duplica y el área se multiplica por 2² = 4, no por 2.", "El área de un triángulo es producto de dos longitudes; si cada una se multiplica por 2, el área se multiplica por 4.", true], ["B", "Sí: si cada cateto se duplica, el área del triángulo también se duplica.", "Las longitudes se duplican, pero el área, que es producto de dos longitudes, se multiplica por 2 × 2.", false], ["C", "Sí, porque la homotecia conserva la forma del triángulo y su ángulo recto.", "Conservar la forma no implica que el área se duplique; la razón de las áreas es el cuadrado de la razón de semejanza.", false], ["D", "No, porque una homotecia con centro en A traslada el triángulo sin cambiar su tamaño.", "Una homotecia de razón 2 sí cambia el tamaño; la que conserva el tamaño es la traslación.", false]]}]}, {"comp": "matematicas", "sim": "s11-2", "ses": 2, "ind": "Presupuesto familiar mensual", "tt": "", "texto": "Una familia tiene ingresos mensuales de $ 3.200.000 y los distribuye como muestra la gráfica.", "vis": "<div class=\"vfig\"><svg class=\"vg\" viewBox=\"0 0 560 320\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Gráfica 13. Distribución de los ingresos mensuales\" font-family=\"Arial, sans-serif\" font-size=\"12\"><rect width=\"560\" height=\"320\" fill=\"#ffffff\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"13\" fill=\"#1d2433\">Gráfica 13. Distribución de los ingresos mensuales<\/text><path d=\"M170,175 L170.0,60.0 A115,115 0 0,1 263.0,242.6 Z\" fill=\"#1660a8\" stroke=\"#fff\" stroke-width=\"1.5\"/><path d=\"M170,175 L263.0,242.6 A115,115 0 0,1 77.0,242.6 Z\" fill=\"#d9822b\" stroke=\"#fff\" stroke-width=\"1.5\"/><path d=\"M170,175 L77.0,242.6 A115,115 0 0,1 55.9,160.6 Z\" fill=\"#2e8b57\" stroke=\"#fff\" stroke-width=\"1.5\"/><path d=\"M170,175 L55.9,160.6 A115,115 0 0,1 86.2,96.3 Z\" fill=\"#8e44ad\" stroke=\"#fff\" stroke-width=\"1.5\"/><path d=\"M170,175 L86.2,96.3 A115,115 0 0,1 134.5,65.6 Z\" fill=\"#c0392b\" stroke=\"#fff\" stroke-width=\"1.5\"/><path d=\"M170,175 L134.5,65.6 A115,115 0 0,1 170.0,60.0 Z\" fill=\"#7f8c8d\" stroke=\"#fff\" stroke-width=\"1.5\"/><rect x=\"320\" y=\"59\" width=\"14\" height=\"14\" fill=\"#1660a8\"/><text x=\"340\" y=\"70\" fill=\"#1d2433\">Vivienda: 35 %<\/text><rect x=\"320\" y=\"83\" width=\"14\" height=\"14\" fill=\"#d9822b\"/><text x=\"340\" y=\"94\" fill=\"#1d2433\">Alimentación: 30 %<\/text><rect x=\"320\" y=\"107\" width=\"14\" height=\"14\" fill=\"#2e8b57\"/><text x=\"340\" y=\"118\" fill=\"#1d2433\">Transporte: 12 %<\/text><rect x=\"320\" y=\"131\" width=\"14\" height=\"14\" fill=\"#8e44ad\"/><text x=\"340\" y=\"142\" fill=\"#1d2433\">Educación: 10 %<\/text><rect x=\"320\" y=\"155\" width=\"14\" height=\"14\" fill=\"#c0392b\"/><text x=\"340\" y=\"166\" fill=\"#1d2433\">Ahorro: 8 %<\/text><rect x=\"320\" y=\"179\" width=\"14\" height=\"14\" fill=\"#7f8c8d\"/><text x=\"340\" y=\"190\" fill=\"#1d2433\">Otros: 5 %<\/text><\/svg><\/div>", "items": [{"id": "MTB-145", "niv": 1, "cp": "mt_formulacion", "cn": "", "e": "¿Cuánto dinero más destina la familia cada mes a vivienda que a transporte y educación juntos?", "f": "Cálculo propio", "vis": "", "o": [["A", "$ 416.000.", "Vivienda: 35 %; transporte y educación: 12 % + 10 % = 22 %. La diferencia es 13 % de $ 3.200.000 = $ 416.000.", true], ["B", "$ 704.000.", "Es lo que destina a transporte y educación juntos (22 %), no la diferencia con vivienda.", false], ["C", "$ 736.000.", "Solo resta transporte (35 % − 12 % = 23 %); olvida restar también el 10 % de educación.", false], ["D", "$ 1.120.000.", "Es lo que destina a vivienda (35 %), no la diferencia.", false]]}, {"id": "MTB-146", "niv": 2, "cp": "mt_argumentacion", "cn": "", "e": "La familia afirma que el dinero para vivienda y alimentación, sumado, supera al de todos los demás rubros juntos. ¿Es correcta la afirmación?", "f": "Cálculo propio", "vis": "", "o": [["A", "No, porque vivienda y alimentación suman $ 1.120.000, menos que los demás rubros.", "$ 1.120.000 es solo el 35 % de vivienda; los dos rubros suman 0,65 × 3.200.000 = $ 2.080.000.", false], ["B", "Sí, porque vivienda es el rubro con el mayor porcentaje de la gráfica.", "Ser el mayor rubro no basta; hay que comparar la suma de los dos con la suma de los otros cuatro.", false], ["C", "No, porque transporte, educación, ahorro y otros suman el 45 % de los ingresos.", "Esos rubros suman 12 + 10 + 8 + 5 = 35 %, no 45 %.", false], ["D", "Sí, porque vivienda y alimentación suman el 65 % y los demás rubros, el 35 %.", "35 % + 30 % = 65 %, y 12 % + 10 % + 8 % + 5 % = 35 %; 65 % > 35 %.", true]]}, {"id": "MTB-147", "niv": 1, "cp": "mt_interpretacion", "cn": "", "e": "Si se dibuja de nuevo la gráfica circular, ¿cuánto debe medir el ángulo central del sector de Educación?", "f": "Cálculo propio", "vis": "", "o": [["A", "3,6°.", "Es el 1 % de 360°; el sector de Educación corresponde al 10 %.", false], ["B", "10°.", "Usa el porcentaje como si fuera la medida del ángulo; el círculo completo tiene 360°, no 100°.", false], ["C", "18°.", "Calcula el 10 % de 180°, como si el círculo completo midiera 180°.", false], ["D", "36°.", "El 10 % de 360° es 0,10 × 360° = 36°.", true]]}]}, {"comp": "matematicas", "sim": "s11-2", "ses": 2, "ind": "Pago a recolectores de café", "tt": "", "texto": "En una finca cafetera se paga a los recolectores $ 950 por cada kilogramo de café cereza recogido.", "vis": "", "items": [{"id": "MTB-107", "niv": 1, "cp": "mt_formulacion", "cn": "", "e": "Un recolector recoge en promedio 85 kg de café cereza diarios y trabaja 6 días a la semana. ¿Cuánto dinero recibe en una semana?", "f": "Cálculo propio", "vis": "", "o": [["A", "$ 80.750.", "Es el pago de un solo día: 85 × 950.", false], ["B", "$ 403.750.", "Calcula el pago de 5 días en lugar de 6.", false], ["C", "$ 484.500.", "85 kg × 6 días = 510 kg; 510 × $ 950 = $ 484.500.", true], ["D", "$ 565.250.", "Calcula el pago de 7 días, pero el recolector trabaja 6.", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "s11-2", "ses": 2, "ind": "Acción de tutela frente a una EPS", "tt": "", "texto": "Valentina tiene 17 años y padece una enfermedad crónica. Su médico tratante le ordenó un medicamento indispensable para controlar la enfermedad, pero la EPS a la que está afiliada se niega a entregarlo con el argumento de que es costoso. Sin el medicamento, la salud de Valentina se deteriora día a día. Su madre quiere acudir a un juez para que la EPS cumpla de inmediato.", "vis": "", "items": [{"id": "SCB-101", "niv": 1, "cp": "sc_pensamiento_social", "cn": "", "e": "¿Qué mecanismo constitucional es el más adecuado para que un juez proteja de forma inmediata los derechos de Valentina?", "f": "Constitución Política, arts. 86, 87 y 88", "vis": "", "o": [["A", "La acción de cumplimiento.", "La acción de cumplimiento (art. 87) busca que una autoridad cumpla una ley o un acto administrativo; no es el medio para proteger de inmediato un derecho fundamental frente a una EPS.", false], ["B", "La acción de tutela.", "El artículo 86 de la Constitución establece la tutela para reclamar la protección inmediata de derechos fundamentales vulnerados o amenazados; procede contra particulares que prestan un servicio público, como una EPS.", true], ["C", "La acción popular.", "La acción popular (art. 88) protege derechos e intereses colectivos, como el ambiente o el espacio público; aquí se vulnera el derecho individual de una persona.", false], ["D", "La revocatoria del mandato.", "La revocatoria del mandato es un mecanismo de participación para terminar el periodo de un alcalde o gobernador; no tiene relación con la entrega de un medicamento.", false]]}, {"id": "SCB-102", "niv": 2, "cp": "sc_pensamiento_social", "cn": "", "e": "Si la madre de Valentina presenta la solicitud ante un juez, ¿cuál es el plazo máximo que fija la Constitución entre la solicitud y la decisión?", "f": "Constitución Política, arts. 30 y 86", "vis": "", "o": [["A", "Quince días hábiles.", "Quince días hábiles es el plazo general de respuesta a un derecho de petición fijado por la ley, no el de la tutela.", false], ["B", "Diez días.", "El artículo 86 dispone que en ningún caso podrán transcurrir más de diez días entre la solicitud de tutela y su resolución.", true], ["C", "Seis meses.", "Seis meses no corresponde al trámite preferente y sumario de la tutela; ese plazo contradiría la protección inmediata que busca el artículo 86.", false], ["D", "Treinta y seis horas.", "Treinta y seis horas es el término para resolver el habeas corpus (art. 30), que protege la libertad de quien está privado de ella ilegalmente.", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "s11-2", "ses": 2, "ind": "Órganos de control ante un contrato público", "tt": "", "texto": "En el municipio ficticio de Santa Inés, la alcaldía contrató la construcción de un puente peatonal por $ 900 millones, financiado en su totalidad con recursos transferidos por la Nación para ese proyecto. Dos años después, el puente no está terminado y una veeduría ciudadana encontró pagos por materiales que nunca llegaron a la obra. Además, la veeduría señala que el secretario de obras públicas, empleado de la alcaldía, firmó actas de avance de obra sin visitar el lugar.", "vis": "", "items": [{"id": "SCB-103", "niv": 2, "cp": "sc_pensamiento_social", "cn": "", "e": "¿Qué entidad tiene la función constitucional de vigilar la gestión fiscal y establecer la responsabilidad por el posible daño a los recursos públicos destinados al puente?", "f": "Constitución Política, arts. 117, 119, 267, 268, 277 y 282", "vis": "", "o": [["A", "La Defensoría del Pueblo.", "La Defensoría se ocupa de la promoción, el ejercicio y la divulgación de los derechos humanos (art. 282), no del manejo de los recursos públicos.", false], ["B", "La Registraduría Nacional del Estado Civil.", "La Registraduría organiza las elecciones y se encarga del registro civil y la identificación de las personas; no controla el gasto público.", false], ["C", "La Procuraduría General de la Nación.", "La Procuraduría vigila la conducta oficial de los servidores y ejerce el poder disciplinario (art. 277); la gestión fiscal y la responsabilidad fiscal corresponden a la Contraloría.", false], ["D", "La Contraloría General de la República.", "Según los artículos 119, 267 y 268, la Contraloría General de la República vigila la gestión fiscal de quienes manejan fondos o bienes de la Nación y establece la responsabilidad fiscal; como el puente se financió con recursos nacionales, le corresponde este control.", true]]}, {"id": "SCB-104", "niv": 2, "cp": "sc_pensamiento_social", "cn": "", "e": "Para investigar si el secretario de obras faltó a sus deberes como servidor público al firmar actas sin verificar la obra, la veeduría puede acudir al órgano que ejerce la vigilancia de la conducta oficial y el poder disciplinario. Ese órgano es", "f": "Constitución Política, arts. 118, 120 y 277", "vis": "", "o": [["A", "la Procuraduría General de la Nación.", "El artículo 277, numeral 6, asigna al Procurador la vigilancia superior de la conducta oficial de quienes desempeñan funciones públicas y el ejercicio preferente del poder disciplinario.", true], ["B", "la Fiscalía General de la Nación.", "La Fiscalía investiga delitos y acusa ante los jueces penales; la falta a los deberes del servidor se investiga por la vía disciplinaria, que preferentemente ejerce la Procuraduría.", false], ["C", "el concejo municipal, mediante un debate de control político.", "El concejo puede citar y debatir la gestión de los funcionarios (control político), pero no ejerce el poder disciplinario ni impone sanciones disciplinarias.", false], ["D", "la Auditoría General de la República.", "La Auditoría General vigila la gestión fiscal de las contralorías; no investiga disciplinariamente a los empleados de una alcaldía.", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "s11-2", "ses": 2, "ind": "Mecanismos de participación en un municipio", "tt": "", "texto": "En un municipio ficticio, muchos habitantes están inconformes porque, después de año y medio de gobierno, el alcalde no ha cumplido ninguno de los puntos del programa que inscribió cuando era candidato. Al mismo tiempo, los vecinos de un barrio quieren que el concejo municipal discuta en una sesión pública, con participación directa de la comunidad, el problema de la recolección de basuras.", "vis": "", "items": [{"id": "SCB-105", "niv": 1, "cp": "sc_pensamiento_social", "cn": "", "e": "¿Qué mecanismo de participación permite a los ciudadanos dar por terminado el mandato del alcalde?", "f": "Constitución Política, art. 103; Ley 134 de 1994, arts. 6, 7 y 9", "vis": "", "o": [["A", "El cabildo abierto municipal.", "El cabildo abierto es una sesión pública de una corporación para discutir asuntos de la comunidad; no tiene el efecto de retirar a un gobernante.", false], ["B", "La revocatoria del mandato.", "La revocatoria del mandato (art. 103 de la Constitución; Ley 134 de 1994, art. 6) es el derecho político de los ciudadanos de dar por terminado el mandato conferido a un alcalde o gobernador.", true], ["C", "El plebiscito.", "El plebiscito lo convoca el Presidente de la República para que el pueblo apoye o rechace una decisión del Ejecutivo; no sirve para retirar a un alcalde.", false], ["D", "La iniciativa legislativa.", "La iniciativa legislativa permite a los ciudadanos presentar proyectos de ley, ordenanza o acuerdo; no termina el periodo de un mandatario.", false]]}, {"id": "SCB-106", "niv": 2, "cp": "sc_pensamiento_social", "cn": "", "e": "¿Qué mecanismo corresponde a lo que buscan los vecinos del barrio para el tema de las basuras?", "f": "Ley 134 de 1994, arts. 5, 6, 8 y 9; Ley 1757 de 2015, art. 22", "vis": "", "o": [["A", "El cabildo abierto, porque permite a los residentes intervenir en una reunión del concejo sobre un asunto de interés común.", "La Ley 134 de 1994 (art. 9) y la Ley 1757 de 2015 (art. 22) definen el cabildo abierto como la reunión pública del concejo (o asamblea o JAL) para tratar asuntos de interés de la comunidad con participación directa de los residentes.", true], ["B", "El referendo, porque los vecinos someten un proyecto de acuerdo municipal sobre basuras a la aprobación del pueblo en las urnas.", "El referendo somete a votación una norma; los vecinos no proponen una norma, sino un espacio de discusión con el concejo.", false], ["C", "La consulta popular, porque el alcalde, con concepto del concejo, formula una pregunta que la comunidad responde con su voto.", "En la consulta popular se vota una pregunta general; los vecinos no buscan votar sino discutir el problema con el concejo, con intervención de los residentes.", false], ["D", "La revocatoria del mandato, porque el servicio de aseo no ha funcionado bien durante todo el periodo del actual alcalde.", "La revocatoria busca retirar al mandatario; el texto dice que los vecinos quieren discutir el problema con el concejo, no terminar el mandato del alcalde.", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "s11-2", "ses": 2, "ind": "El Frente Nacional (1958-1974)", "tt": "", "texto": "Después de la llamada época de La Violencia y del gobierno militar de Gustavo Rojas Pinilla, los partidos Liberal y Conservador pactaron un acuerdo que fue aprobado en el plebiscito del 1 de diciembre de 1957 y que rigió entre 1958 y 1974.\
