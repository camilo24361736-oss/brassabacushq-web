n\nHistoriadora 1 (opinión ficticia): «El acuerdo logró que los dos partidos dejaran de matarse por el poder y que el país volviera a tener gobiernos civiles».\n\nHistoriador 2 (opinión ficticia): «El acuerdo cerró la puerta a cualquier fuerza política distinta de los dos partidos tradicionales, y muchos grupos excluidos buscaron otros caminos para hacerse oír».", "vis": "", "items": [{"id": "SCB-107", "niv": 1, "cp": "sc_pensamiento_social", "cn": "", "e": "¿Cuál fue una característica central del acuerdo que rigió entre 1958 y 1974, conocido como Frente Nacional?", "f": "Enciclopedia Banrepcultural, «El Frente Nacional»; Biblioteca Nacional, Historia de Colombia, cap. 12", "vis": "", "o": [["A", "La organización del país en estados soberanos con amplia autonomía federal.", "El federalismo de estados soberanos corresponde a los Estados Unidos de Colombia (1863-1886), no al periodo 1958-1974.", false], ["B", "El gobierno de una junta militar que dirigió el país durante dieciséis años.", "La junta militar gobernó solo como transición entre 1957 y 1958; el Frente Nacional fue un régimen de gobiernos civiles.", false], ["C", "La apertura del sistema político a todos los partidos y movimientos que quisieran presentar candidatos a la presidencia.", "Ocurrió lo contrario: el pacto excluyó a las fuerzas distintas de los dos partidos tradicionales.", false], ["D", "La alternancia presidencial entre liberales y conservadores y la paridad en los cargos públicos.", "El Frente Nacional estableció que la presidencia se alternaría cada cuatro años entre los dos partidos y que los cargos del Estado se repartirían por mitades (Banrepcultural; Biblioteca Nacional).", true]]}, {"id": "SCB-108", "niv": 3, "cp": "sc_perspectivas", "cn": "", "e": "¿Con cuál de las siguientes afirmaciones estarían de acuerdo los dos historiadores?", "f": "Análisis de las perspectivas del caso", "vis": "", "o": [["A", "El Frente Nacional fue la principal causa del surgimiento de La Violencia en Colombia.", "Ninguno lo afirma, y el texto ubica La Violencia antes del acuerdo; la historiadora 1 incluso dice que el pacto ayudó a frenarla.", false], ["B", "El Frente Nacional no tuvo ningún efecto sobre la violencia entre liberales y conservadores.", "La historiadora 1 sostiene que el acuerdo sí logró que los partidos dejaran de enfrentarse violentamente.", false], ["C", "El Frente Nacional tuvo como mayor acierto la inclusión de nuevas fuerzas políticas.", "El historiador 2 afirma exactamente lo contrario: el acuerdo cerró la puerta a otras fuerzas.", false], ["D", "El Frente Nacional fue un pacto que repartió el poder entre los dos partidos tradicionales.", "La historiadora 1 lo presenta como un acuerdo entre los dos partidos y el historiador 2 critica que dejó por fuera a los demás; ambos parten de que el poder quedó en manos de los dos partidos.", true]]}]}, {"comp": "sociales_ciudadanas", "sim": "s11-2", "ses": 2, "ind": "Instituciones coloniales", "tt": "", "texto": "Durante el periodo colonial en el Nuevo Reino de Granada, la Corona española creó varias instituciones para organizar el trabajo y el tributo de la población indígena.", "vis": "", "items": [{"id": "SCB-109", "niv": 2, "cp": "sc_pensamiento_social", "cn": "", "e": "Una institución consistía en asignar a un español un grupo de indígenas, quienes debían entregarle tributo en especie o en trabajo; a cambio, el español se comprometía a evangelizarlos y protegerlos. Esta institución se conoce como", "f": "Historia colonial de la Nueva Granada (Banrepcultural, enciclopedia)", "vis": "", "o": [["A", "la encomienda.", "En la encomienda la Corona «encomendaba» a un español un grupo de indígenas que le pagaban tributo, a cambio de la obligación de evangelizarlos y protegerlos.", true], ["B", "el resguardo indígena.", "El resguardo era una porción de tierra de propiedad colectiva reservada a una comunidad indígena; no era un sistema de tributo a un español.", false], ["C", "la mita.", "La mita era un trabajo obligatorio por turnos, sobre todo en minas y obras, que cumplían los indígenas de los pueblos; no implicaba la asignación de un grupo a un encomendero.", false], ["D", "el cabildo.", "El cabildo era el gobierno municipal de las ciudades y villas; no asignaba indígenas a particulares.", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "s11-2", "ses": 2, "ind": "Guerra Fría: alianzas y Plan Marshall", "tt": "", "texto": "Después de la Segunda Guerra Mundial, Estados Unidos ofreció a los países europeos un programa de ayuda económica para su reconstrucción (Plan Marshall, 1948). En 1949 se creó la Organización del Tratado del Atlántico Norte (OTAN) y en 1955 la Unión Soviética y sus aliados firmaron el Pacto de Varsovia.\n\nFragmento ficticio de un editorial publicado en un periódico de Europa oriental en 1948: «Los dólares que llegan con el llamado plan de recuperación no son un regalo. Quien acepta el dinero acepta también las condiciones de Washington, y pronto descubrirá que sus fábricas, su comercio y hasta sus gobiernos dependen de las decisiones que se toman al otro lado del océano».", "vis": "", "items": [{"id": "SCB-111", "niv": 2, "cp": "sc_pensamiento_social", "cn": "", "e": "La creación de la OTAN y del Pacto de Varsovia es una expresión de", "f": "CCH-UNAM, Crisis de Berlín; deutschland.de, «La posguerra: de la Guerra Fría a la Revolución Pacífica»", "vis": "", "o": [["A", "los acuerdos de paz que pusieron fin a la Primera Guerra Mundial.", "La Primera Guerra Mundial terminó con el Tratado de Versalles de 1919, décadas antes de estas alianzas.", false], ["B", "la cooperación militar entre Estados Unidos y la Unión Soviética para evitar una nueva guerra mundial.", "Las dos alianzas se crearon una frente a la otra; no eran una cooperación entre las dos potencias, sino bloques opuestos.", false], ["C", "la división del mundo en dos bloques enfrentados, liderados por Estados Unidos y la Unión Soviética.", "La OTAN (1949) agrupó a Estados Unidos y sus aliados occidentales y el Pacto de Varsovia (1955) a la URSS y sus aliados; ambas alianzas reflejan el orden bipolar de la Guerra Fría.", true], ["D", "el fin de la Guerra Fría y la reunificación de Alemania.", "La reunificación alemana ocurrió después de la caída del Muro de Berlín en 1989; las alianzas de 1949 y 1955 marcan, por el contrario, la consolidación de la Guerra Fría.", false]]}, {"id": "SCB-112", "niv": 2, "cp": "sc_perspectivas", "cn": "", "e": "¿Qué perspectiva sobre el Plan Marshall expresa el editorial?", "f": "Análisis de la fuente ficticia del caso", "vis": "", "o": [["A", "La ayuda debería repartirse también entre los países de América Latina.", "El editorial no menciona a América Latina ni propone ampliar el programa.", false], ["B", "La ayuda es una forma de extender la influencia política y económica de Estados Unidos sobre Europa.", "El editorial afirma que quien acepta el dinero acepta las condiciones de Washington y termina dependiendo de sus decisiones; ve la ayuda como un instrumento de influencia.", true], ["C", "La ayuda es insuficiente porque la cantidad de dólares ofrecida no alcanza para reconstruir las fábricas europeas.", "El editorial no discute el monto de la ayuda; su crítica se refiere a la dependencia que generaría.", false], ["D", "La ayuda es un gesto desinteresado que los países europeos deberían agradecer.", "El texto dice expresamente que los dólares «no son un regalo»; su postura es crítica, no de agradecimiento.", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "s11-2", "ses": 2, "ind": "Estado social de derecho y medidas a favor de grupos en desventaja", "tt": "", "texto": "El concejo de un municipio ficticio aprobó un subsidio de transporte para estudiantes de colegios públicos que viven en zonas rurales alejadas y pertenecen a familias de bajos ingresos. Un ciudadano protestó: «Es injusto; si el Estado ayuda a unos, debe ayudar a todos por igual».\n\nLa Constitución Política establece que Colombia es un Estado social de derecho (art. 1) y que el Estado promoverá las condiciones para que la igualdad sea real y efectiva y adoptará medidas en favor de grupos discriminados o marginados (art. 13).", "vis": "", "items": [{"id": "SCB-123", "niv": 2, "cp": "sc_reflexivo_sistemico", "cn": "", "e": "De acuerdo con el modelo de Estado social de derecho descrito, ¿por qué el subsidio es coherente con la Constitución?", "f": "Constitución Política, arts. 1, 13 y 121", "vis": "", "o": [["A", "Porque el Estado busca una igualdad real, lo que justifica apoyar a quienes tienen más barreras para estudiar.", "El Estado social de derecho persigue la igualdad material: tratar de manera diferente a quienes están en desventaja (distancia y bajos ingresos) para que puedan ejercer en igualdad su derecho a la educación.", true], ["B", "Porque el derecho a la educación solo se garantiza a quienes viven en las zonas rurales más alejadas.", "El derecho a la educación es de todas las personas; el subsidio no restringe el derecho, sino que ayuda a quienes tienen más dificultades para ejercerlo.", false], ["C", "Porque la igualdad ante la ley exige que el Estado trate de la misma manera a todos los estudiantes del municipio.", "Esa es la igualdad formal que invoca el ciudadano que protesta; el artículo 13 añade la igualdad real, que permite medidas diferenciadas a favor de quienes están en desventaja.", false], ["D", "Porque el subsidio compensa a las familias rurales por pagar más impuestos que las familias urbanas.", "El texto no menciona impuestos; el subsidio se justifica por la distancia y los bajos ingresos, no como una compensación tributaria.", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "s11-2", "ses": 2, "ind": "Restricción vehicular en una ciudad", "tt": "", "texto": "Una ciudad ficticia decidió ampliar la restricción a la circulación de carros particulares («pico y placa») de 4 a 8 horas diarias, con el fin de reducir la contaminación del aire y los trancones. La medida no se aplica a vehículos de transporte público.", "vis": "", "items": [{"id": "SCB-124", "niv": 1, "cp": "sc_reflexivo_sistemico", "cn": "", "e": "¿Qué efecto esperado de la medida corresponde a la dimensión ambiental?", "f": "Análisis de dimensiones de una medida pública", "vis": "", "o": [["A", "La aparición de quejas de los conductores ante la alcaldía.", "Las quejas son una reacción política o social, no un efecto sobre el ambiente.", false], ["B", "El aumento de las ventas de carros nuevos en la ciudad.", "Las ventas de vehículos son un efecto económico, no ambiental.", false], ["C", "La disminución de las emisiones contaminantes de los carros particulares.", "Menos carros circulando durante más horas implica menos emisiones, que es el objetivo ambiental de la medida.", true], ["D", "El ajuste de los horarios de entrada en algunas empresas para evitar las horas de restricción.", "Es un efecto en la organización del trabajo (dimensión social y económica), no un efecto sobre el ambiente.", false]]}, {"id": "SCB-125", "niv": 3, "cp": "sc_reflexivo_sistemico", "cn": "", "e": "Algunos hogares con ingresos altos podrían comprar un segundo carro con otra placa para evitar la restricción. Si esto ocurre en muchos hogares, ¿qué consecuencia tendría para la medida?", "f": "Análisis de efectos no previstos de una intervención", "vis": "", "o": [["A", "La medida seguiría igual de eficaz, porque cada carro sigue teniendo restricción en sus horas asignadas.", "Cada placa sigue restringida, pero el hogar usa el otro carro en esas horas; por eso no disminuye el número de carros que circulan.", false], ["B", "Se reduciría su eficacia, porque los carros en circulación no disminuirían como se esperaba.", "Si los hogares sortean la restricción con otro carro, siguen circulando casi los mismos vehículos; además, la medida afectaría sobre todo a quienes no pueden comprar otro carro.", true], ["C", "Se cumpliría mejor el objetivo ambiental, porque los segundos carros suelen ser modelos nuevos y menos contaminantes.", "Aunque algunos carros sean nuevos, los hogares tendrían más vehículos disponibles y la circulación no se reduciría, que es lo que busca la medida.", false], ["D", "Aumentaría el uso del transporte público, porque los hogares de ingresos altos dejarían el carro en casa.", "El enunciado plantea lo contrario: esos hogares compran otro carro precisamente para no dejar de usarlo.", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "s11-2", "ses": 2, "ind": "Banco de la República e inflación", "tt": "", "texto": "La Constitución Política dispone que el Banco de la República ejerce las funciones de banca central (art. 371) y que el Estado, por intermedio de este banco, velará por el mantenimiento de la capacidad adquisitiva de la moneda (art. 373). Durante un año ficticio, los precios de la canasta familiar subieron mucho más que la meta de inflación, y la Junta Directiva del Banco decidió aumentar su tasa de interés de referencia.", "vis": "", "items": [{"id": "SCB-126", "niv": 1, "cp": "sc_pensamiento_social", "cn": "", "e": "Según la Constitución, ¿cuál es el propósito central que el Estado persigue por intermedio del Banco de la República?", "f": "Constitución Política, arts. 267, 371 y 373", "vis": "", "o": [["A", "Prestar dinero directamente a las familias para que compren vivienda.", "El Banco de la República es banca central: no presta a los hogares; actúa sobre el sistema financiero y la moneda.", false], ["B", "Vigilar la gestión fiscal de las entidades que manejan recursos públicos.", "La vigilancia de la gestión fiscal corresponde a la Contraloría General de la República (art. 267).", false], ["C", "Recaudar los impuestos nacionales y fijar sus tarifas.", "Los impuestos los establece el Congreso y los recauda la administración tributaria; no es función del banco central.", false], ["D", "Mantener la capacidad adquisitiva de la moneda.", "El artículo 373 establece que el Estado, por intermedio del Banco de la República, velará por el mantenimiento de la capacidad adquisitiva de la moneda; es decir, controlar la inflación.", true]]}, {"id": "SCB-127", "niv": 3, "cp": "sc_reflexivo_sistemico", "cn": "", "e": "Según el razonamiento económico que sustenta la decisión de la Junta, al subir la tasa de interés de referencia se espera que", "f": "Constitución Política, arts. 372 y 373; modelo de política monetaria", "vis": "", "o": [["A", "el Gobierno pueda fijar por decreto el precio máximo de todos los productos de la canasta familiar.", "La tasa de interés no fija precios por decreto; actúa indirectamente sobre el crédito y la demanda.", false], ["B", "aumente la cantidad de billetes en circulación para que las familias puedan pagar los precios más altos.", "Emitir más dinero alimentaría la inflación; es lo contrario de lo que busca una tasa de interés más alta.", false], ["C", "los créditos se encarezcan, disminuya el gasto en consumo e inversión y así se modere el alza de los precios.", "Con tasas más altas, endeudarse cuesta más; hogares y empresas gastan menos, la demanda se enfría y la inflación tiende a bajar. Un posible costo es un menor crecimiento económico.", true], ["D", "los créditos se abaraten, las familias compren más y los precios bajen por la mayor competencia entre tiendas.", "Subir la tasa de interés encarece el crédito, no lo abarata; y un mayor consumo presionaría los precios al alza.", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "s11-2", "ses": 2, "ind": "Origen de la Constitución de 1991", "tt": "", "texto": "En las elecciones del 11 de marzo de 1990, un movimiento en el que participaron muchos estudiantes universitarios promovió que los votantes depositaran una papeleta adicional, no oficial, para pedir una reforma de la Constitución vigente desde 1886.\n\nTestimonio ficticio de una estudiante de la época: «Repartíamos papeletas en las esquinas. Sentíamos que el Congreso no había podido hacer los cambios que el país necesitaba y que la violencia nos estaba ahogando».\n\nTestimonio ficticio de un congresista de la época: «Respeto el entusiasmo de los jóvenes, pero la Constitución de 1886 establece cómo se reforma, y ese camino pasa por el Congreso».", "vis": "", "items": [{"id": "SCB-131", "niv": 2, "cp": "sc_pensamiento_social", "cn": "", "e": "El movimiento descrito, conocido como la «séptima papeleta», contribuyó a", "f": "Corte Constitucional, «Constitución Política de 1991»; BBC Mundo (11-03-2020); Centro de Memoria, «Memorias para la democracia y la paz»", "vis": "", "o": [["A", "la aprobación del plebiscito de 1957, que dio origen al Frente Nacional.", "El plebiscito de 1957 ocurrió más de treinta años antes de la séptima papeleta.", false], ["B", "la restauración de la Constitución de 1886 después de un largo periodo de gobierno militar.", "El movimiento buscaba reemplazar o reformar profundamente la Constitución de 1886, no restaurarla.", false], ["C", "la creación de la Gran Colombia en el Congreso de Cúcuta.", "El Congreso de Cúcuta se reunió en 1821; no tiene relación con las elecciones de 1990.", false], ["D", "la elección de una Asamblea Nacional Constituyente que expidió la Constitución de 1991.", "Tras la séptima papeleta y la votación del 27 de mayo de 1990, el 9 de diciembre de 1990 se eligieron 70 constituyentes; la Asamblea proclamó la nueva Constitución el 4 de julio de 1991.", true]]}, {"id": "SCB-132", "niv": 3, "cp": "sc_perspectivas", "cn": "", "e": "¿Qué diferencia de fondo hay entre las posturas de la estudiante y del congresista?", "f": "Análisis de perspectivas del caso", "vis": "", "o": [["A", "La estudiante prioriza la urgencia del cambio, mientras que el congresista prioriza el procedimiento de reforma ya establecido.", "La estudiante justifica la papeleta porque el Congreso no había logrado los cambios necesarios; el congresista sostiene que la reforma debe seguir el camino previsto en la Constitución vigente.", true], ["B", "La estudiante cree que la violencia había terminado, mientras que el congresista cree que continuaba.", "La estudiante dice que la violencia «nos estaba ahogando», es decir, que seguía; el congresista no habla de la violencia.", false], ["C", "Ambos rechazan que la Constitución deba cambiar, pero discrepan sobre quién debe decidirlo.", "La estudiante sí quiere el cambio; el congresista no se opone a reformar, sino a la vía utilizada.", false], ["D", "La estudiante defiende la Constitución de 1886 tal como está, mientras que el congresista quiere reemplazarla de inmediato por otra.", "Es al revés: la estudiante promueve el cambio y el congresista defiende los procedimientos de la Constitución de 1886.", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "s11-2", "ses": 2, "ind": "Carretera y territorio indígena", "tt": "", "texto": "El departamento ficticio de Altamira planea una carretera que atravesaría el territorio de un resguardo indígena y pasaría junto a una laguna.\n\nIngeniero del proyecto: «Esta ruta es la más corta y la más barata. Ahorraría tres horas de viaje a miles de personas».\n\nGobernador indígena: «La laguna es un lugar sagrado donde reposan nuestros ancestros y donde hacemos nuestros rituales. Para nosotros el territorio no es un terreno vacío: es parte de nuestra vida como pueblo».\n\nLa Constitución reconoce y protege la diversidad étnica y cultural de la Nación (art. 7).", "vis": "", "items": [{"id": "SCB-139", "niv": 2, "cp": "sc_perspectivas", "cn": "", "e": "¿Qué explica mejor la diferencia entre las posiciones del ingeniero y del gobernador indígena?", "f": "Análisis de cosmovisiones; Constitución Política, art. 7", "vis": "", "o": [["A", "El gobernador considera que la carretera no ahorraría tiempo de viaje a los habitantes del departamento.", "El gobernador no discute el ahorro de tiempo; su objeción es que la ruta afecta un lugar sagrado.", false], ["B", "Valoran el territorio de modo distinto: uno por distancia y costo, el otro como lugar sagrado de su pueblo.", "El ingeniero evalúa la ruta por distancia y costo; el gobernador entiende la laguna y el territorio desde su cosmovisión, como parte de la vida del pueblo.", true], ["C", "El gobernador aceptaría la ruta si la gobernación pagara una compensación económica a la comunidad.", "El gobernador no menciona ninguna compensación; afirma que el territorio no es un terreno vacío, lo que no se resuelve con dinero según su argumento.", false], ["D", "El ingeniero prioriza el ahorro de tiempo y el gobernador, la reducción del costo de la obra.", "El gobernador no habla del costo de la obra; su argumento es el carácter sagrado de la laguna y del territorio.", false]]}, {"id": "SCB-140", "niv": 3, "cp": "sc_reflexivo_sistemico", "cn": "", "e": "El departamento evalúa una ruta alterna que no pasa junto a la laguna, pero es 15 kilómetros más larga y más costosa. ¿Qué implica elegir esta alternativa?", "f": "Análisis de efectos de alternativas de solución", "vis": "", "o": [["A", "Se mantiene el mismo tiempo de viaje, pero aumenta el costo de construcción de la carretera.", "Es cierto que aumenta el costo, pero una ruta 15 kilómetros más larga también aumenta el tiempo de viaje.", false], ["B", "Se favorece la dimensión económica, porque una ruta más larga conecta más poblaciones en su recorrido.", "El caso no dice que la ruta alterna conecte más poblaciones; en lo económico, la ruta es más costosa y más larga.", false], ["C", "Se protege la laguna, pero el pueblo indígena pierde su derecho a ser consultado sobre el proyecto.", "Cambiar la ruta para proteger el lugar sagrado no elimina ningún derecho de la comunidad; al contrario, atiende su reclamo.", false], ["D", "Se protegen el lugar sagrado y los derechos del pueblo indígena, a cambio de más costo y un viaje más largo.", "La ruta alterna evita afectar el lugar sagrado (dimensión cultural y derechos étnicos) pero exige más inversión y más tiempo de viaje: una decisión favorece una dimensión a costa de otra.", true]]}]}, {"comp": "sociales_ciudadanas", "sim": "s11-2", "ses": 2, "ind": "Oferta, demanda y precios máximos", "tt": "", "texto": "Una fuerte helada destruyó buena parte de los cultivos de papa en varias zonas productoras. En los días siguientes, el precio de la papa en las plazas de mercado subió notablemente. Un sondeo en esas plazas mostró que el número de compradores de papa fue similar al de los meses anteriores.", "vis": "", "items": [{"id": "SCB-141", "niv": 3, "cp": "sc_reflexivo_sistemico", "cn": "", "e": "Para proteger a los consumidores, una autoridad ficticia propone fijar un precio máximo para la papa, muy por debajo del precio actual. Según el modelo de oferta y demanda, ¿qué consecuencia es probable?", "f": "Modelo económico de oferta y demanda (control de precios)", "vis": "", "o": [["A", "Los productores ofrecerán más papa en las plazas, porque el precio máximo les asegura que venderán toda su cosecha.", "Vender toda la cosecha a un precio muy bajo reduce el incentivo para producir y ofrecer; el modelo predice menos oferta, no más.", false], ["B", "La papa se venderá al precio máximo sin cambios en la cantidad que llega a las plazas.", "El precio máximo cambia los incentivos de los productores; la cantidad ofrecida disminuye respecto de la que se quiere comprar.", false], ["C", "Habrá escasez, porque a ese precio se querrá comprar más papa de la que los productores estarán dispuestos a vender.", "Con un precio por debajo del de equilibrio, la cantidad demandada supera a la ofrecida; aparecen escasez, filas o ventas por fuera del precio oficial.", true], ["D", "Los precios bajarán y la cantidad disponible aumentará, porque más familias podrán comprar.", "Que más familias quieran comprar aumenta la cantidad demandada, no la disponible; la oferta se reduce con un precio bajo.", false]]}, {"id": "SCB-142", "niv": 1, "cp": "sc_reflexivo_sistemico", "cn": "", "e": "Según el modelo de oferta y demanda, ¿por qué subió el precio de la papa?", "f": "Modelo económico de oferta y demanda", "vis": "", "o": [["A", "Porque aumentó la cantidad de papa disponible en el mercado.", "Ocurrió lo contrario: la helada redujo la cantidad disponible.", false], ["B", "Porque disminuyó la oferta mientras la demanda se mantuvo.", "Con menos papa en el mercado y la misma necesidad de las familias, la escasez relativa hace subir el precio.", true], ["C", "Porque el Banco de la República fijó un nuevo precio para la papa.", "El Banco de la República no fija precios de productos agrícolas; el alza se explica por la reducción de la oferta.", false], ["D", "Porque las familias dejaron de comprar papa después de la helada.", "El sondeo indica que el número de compradores fue similar al de meses anteriores; si la demanda hubiera caído, el precio tendería a bajar.", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "s11-2", "ses": 2, "ind": "Diario de una votante de 1957", "tt": "", "texto": "Fragmento del diario ficticio de una maestra de Tunja, fechado el 1 de diciembre de 1957:\n\n«Hoy, por primera vez en mi vida, voté. Mi madre nunca pudo hacerlo. Hice fila con mis vecinas desde temprano; algunas estaban nerviosas porque sus maridos no querían que vinieran. La pregunta era si aprobábamos el acuerdo de los dos partidos. Marqué que sí, pensando que así terminaría la matanza en los campos».", "vis": "", "items": [{"id": "SCB-148", "niv": 1, "cp": "sc_perspectivas", "cn": "", "e": "¿En qué acontecimiento histórico se inscribe el fragmento?", "f": "Biblioteca Nacional, Historia de Colombia, cap. 12; Banrepcultural, «El Frente Nacional»", "vis": "", "o": [["A", "En el plebiscito que aprobó el acuerdo bipartidista conocido como Frente Nacional.", "El 1 de diciembre de 1957 se votó el plebiscito que aprobó el Frente Nacional; fue la primera vez que las mujeres colombianas votaron.", true], ["B", "En la votación de la séptima papeleta durante las elecciones de 1990.", "La séptima papeleta fue en marzo de 1990; el diario está fechado en 1957.", false], ["C", "En la elección de los setenta miembros de la Asamblea Nacional Constituyente de 1990.", "Esa elección ocurrió el 9 de diciembre de 1990.", false], ["D", "En el cabildo abierto del 20 de julio de 1810 en Santafé.", "En 1810 no había votaciones de mujeres, y el diario habla de un acuerdo de «dos partidos», que no existían en ese momento.", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "s11-2", "ses": 2, "ind": "Libertad de expresión y buen nombre en el colegio", "tt": "", "texto": "Un estudiante publicó en redes sociales que un profesor de su colegio «roba el dinero de las salidas pedagógicas». No presentó ninguna prueba. La publicación se difundió entre padres y estudiantes, y el profesor pidió que fuera retirada. El estudiante respondió: «Tengo derecho a decir lo que pienso».\n\nLa Constitución garantiza la libertad de expresar y difundir el pensamiento y la de informar y recibir información veraz e imparcial (art. 20), así como el derecho de toda persona a su buen nombre (art. 15) y a la honra (art. 21).", "vis": "", "items": [{"id": "SCB-149", "niv": 1, "cp": "sc_perspectivas", "cn": "", "e": "¿Qué derechos invocan, respectivamente, el estudiante y el profesor?", "f": "Constitución Política, arts. 15, 20 y 21", "vis": "", "o": [["A", "El estudiante, la libertad de expresión; el profesor, el derecho al trabajo.", "La primera parte es correcta, pero el profesor no invoca el derecho al trabajo: pide retirar una acusación que afecta su reputación.", false], ["B", "El estudiante, el derecho a recibir información veraz; el profesor, la libertad de expresión.", "El estudiante defiende su derecho a difundir lo que piensa, y es el profesor quien pide retirar la publicación; la opción invierte los papeles.", false], ["C", "El estudiante, el derecho de petición; el profesor, el derecho a la intimidad.", "El estudiante no hizo ninguna petición a una autoridad; y el profesor no reclama por la divulgación de su vida privada, sino por una acusación sin pruebas que afecta su buen nombre.", false], ["D", "El estudiante, la libertad de expresión; el profesor, el buen nombre y la honra.", "El estudiante dice que tiene derecho a decir lo que piensa (art. 20); el profesor pide retirar una acusación sin pruebas que afecta su buen nombre y su honra (arts. 15 y 21).", true]]}, {"id": "SCB-150", "niv": 2, "cp": "sc_reflexivo_sistemico", "cn": "", "e": "Ante el caso, el colegio estudia varias medidas. ¿Cuál restringe la libertad de expresión de manera más amplia de lo necesario para proteger el buen nombre del profesor?", "f": "Constitución Política, arts. 15, 20 y 21; análisis de proporcionalidad de medidas", "vis": "", "o": [["A", "Invitar al estudiante a presentar sus sospechas ante las directivas, junto con las pruebas que tenga.", "Esta medida canaliza la denuncia por una vía adecuada; no limita la expresión, sino que la orienta.", false], ["B", "Abrir un espacio de diálogo entre el estudiante, el profesor y sus familias.", "El diálogo no restringe la libertad de expresión; busca resolver el conflicto escuchando a las partes.", false], ["C", "Prohibir a todos los estudiantes publicar cualquier opinión sobre el colegio en redes sociales.", "Es una restricción general que afecta a todos los estudiantes y a cualquier opinión, incluso las verdaderas o respetuosas; va mucho más allá de proteger al profesor afectado.", true], ["D", "Pedir al estudiante que retire la acusación mientras no tenga pruebas.", "Es una medida dirigida a la publicación concreta que afecta al profesor; no prohíbe expresarse sobre otros asuntos.", false]]}]}, {"comp": "ciencias_naturales", "sim": "s11-2", "ses": 2, "ind": "El páramo y la regulación del agua", "tt": "", "texto": "Los páramos son ecosistemas de alta montaña de los Andes. Colombia alberga cerca de la mitad de los páramos del mundo. En ellos crecen frailejones, musgos y pajonales, y sus suelos, ricos en materia orgánica y muy porosos, retienen gran cantidad de agua de la lluvia y de la niebla. Esa agua se libera poco a poco hacia quebradas y ríos que abastecen a muchas ciudades y municipios.", "vis": "", "items": [{"id": "CNB-104", "niv": 2, "cp": "cn_explicacion", "cn": "biologico", "e": "En una vereda se drenaron y araron los suelos de un páramo para sembrar papa. Desde entonces, la quebrada que nace allí crece mucho en temporada de lluvias y casi se seca en temporada seca. ¿Qué explica mejor este cambio?", "f": "Funcionamiento hidrológico del páramo (Instituto Humboldt; Minambiente)", "vis": "", "o": [["A", "El arado aumentó la temperatura del páramo y el agua se evapora antes de llegar a la quebrada.", "No explica la crecida en lluvias y atribuye la falta de agua a una evaporación que no se relaciona con el cambio en la retención del suelo.", false], ["B", "Se perdió la capacidad del suelo de retener el agua y liberarla poco a poco, y ahora la lluvia escurre rápido.", "El texto indica que los suelos porosos y la vegetación retienen el agua y la liberan poco a poco; al destruirlos, el agua corre de inmediato en lluvias y no queda reserva para la época seca.", true], ["C", "Los cultivos de papa liberan por transpiración más agua que la vegetación original, lo que aumenta el caudal en la época seca.", "El problema descrito es que el caudal baja en época seca; además, la transpiración devuelve agua a la atmósfera, no aumenta el caudal de la quebrada.", false], ["D", "Los frailejones consumían el agua de la quebrada y, al retirarlos, el caudal quedó sin control.", "Los frailejones no extraen el agua de la quebrada; según el texto, la vegetación del páramo contribuye a retener y regular el agua.", false]]}, {"id": "CNB-105", "niv": 3, "cp": "cn_explicacion", "cn": "cts", "e": "En un municipio se discute si permitir una mina a cielo abierto en el páramo del que nace el río que abastece el acueducto. ¿Cuál de los siguientes argumentos es coherente con el funcionamiento del páramo descrito en el texto?", "f": "Servicios ecosistémicos del páramo (Instituto Humboldt; Minambiente)", "vis": "", "o": [["A", "Dañar el páramo afectaría a las poblaciones que se abastecen aguas abajo, no solo a la zona de la mina.", "El texto explica que los suelos del páramo almacenan agua y la liberan lentamente hacia ríos que abastecen ciudades y municipios.", true], ["B", "El páramo debe protegerse porque produce la mayor parte del oxígeno que respiran los habitantes de las ciudades andinas.", "El oxígeno de la atmósfera proviene de la fotosíntesis de todos los ecosistemas, en gran parte de los océanos; el texto no atribuye esa función al páramo.", false], ["C", "La mina no afectaría el acueducto si se conservan los frailejones, porque son ellos los que producen el agua del páramo.", "Según el texto, la regulación depende también de los suelos porosos y ricos en materia orgánica, que la mina removería.", false], ["D", "La mina aumentaría el agua disponible en la temporada seca, porque al remover los suelos el agua retenida llegaría más rápido a los ríos.", "Si el agua retenida sale rápido, se pierde en la temporada de lluvias y falta en la seca; el texto indica que el valor del páramo es liberar el agua poco a poco.", false]]}]}, {"comp": "ciencias_naturales", "sim": "s11-2", "ses": 2, "ind": "Temperatura y germinación de semillas", "tt": "", "texto": "Unos estudiantes sembraron 50 semillas de fríjol en cada una de seis bandejas iguales, con el mismo tipo y la misma cantidad de suelo, y les dieron el mismo riego diario. Cada bandeja se mantuvo a una temperatura constante distinta durante 10 días; al final contaron las semillas germinadas.", "vis": "", "items": [{"id": "CNB-108", "niv": 2, "cp": "cn_indagacion", "cn": "biologico", "e": "¿Qué conclusión se apoya en los resultados de la gráfica?", "f": "Análisis de datos experimentales", "vis": "<div class=\"vfig\"><svg class=\"vg\" viewBox=\"0 0 560 320\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Gráfica 14. Semillas germinadas según la temperatura\" font-family=\"Arial, sans-serif\" font-size=\"12\"><rect width=\"560\" height=\"320\" fill=\"#ffffff\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"13\" fill=\"#1d2433\">Gráfica 14. Semillas germinadas según la temperatura<\/text><line x1=\"60\" y1=\"258.0\" x2=\"540\" y2=\"258.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"262.0\" text-anchor=\"end\" fill=\"#3a4356\">0<\/text><line x1=\"60\" y1=\"213.6\" x2=\"540\" y2=\"213.6\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"217.6\" text-anchor=\"end\" fill=\"#3a4356\">10<\/text><line x1=\"60\" y1=\"169.2\" x2=\"540\" y2=\"169.2\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"173.2\" text-anchor=\"end\" fill=\"#3a4356\">20<\/text><line x1=\"60\" y1=\"124.8\" x2=\"540\" y2=\"124.8\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"128.8\" text-anchor=\"end\" fill=\"#3a4356\">30<\/text><line x1=\"60\" y1=\"80.4\" x2=\"540\" y2=\"80.4\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"84.4\" text-anchor=\"end\" fill=\"#3a4356\">40<\/text><line x1=\"60\" y1=\"36.0\" x2=\"540\" y2=\"36.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"40.0\" text-anchor=\"end\" fill=\"#3a4356\">50<\/text><line x1=\"60\" y1=\"258\" x2=\"540\" y2=\"258\" stroke=\"#3a4356\"/><line x1=\"60\" y1=\"258\" x2=\"60\" y2=\"36\" stroke=\"#3a4356\"/><text transform=\"translate(14,147.0) rotate(-90)\" text-anchor=\"middle\" fill=\"#3a4356\">Semillas germinadas (de 50)<\/text><text x=\"300.0\" y=\"312\" text-anchor=\"middle\" fill=\"#3a4356\">Temperatura (°C)<\/text><text x=\"100.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">10<\/text><text x=\"180.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">15<\/text><text x=\"260.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">20<\/text><text x=\"340.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">25<\/text><text x=\"420.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">30<\/text><text x=\"500.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">35<\/text><rect x=\"72.0\" y=\"240.2\" width=\"56.0\" height=\"17.8\" fill=\"#1660a8\"/><text x=\"100.0\" y=\"236.2\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">4<\/text><rect x=\"152.0\" y=\"164.8\" width=\"56.0\" height=\"93.2\" fill=\"#1660a8\"/><text x=\"180.0\" y=\"160.8\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">21<\/text><rect x=\"232.0\" y=\"89.3\" width=\"56.0\" height=\"168.7\" fill=\"#1660a8\"/><text x=\"260.0\" y=\"85.3\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">38<\/text><rect x=\"312.0\" y=\"53.8\" width=\"56.0\" height=\"204.2\" fill=\"#1660a8\"/><text x=\"340.0\" y=\"49.8\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">46<\/text><rect x=\"392.0\" y=\"62.6\" width=\"56.0\" height=\"195.4\" fill=\"#1660a8\"/><text x=\"420.0\" y=\"58.6\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">44<\/text><rect x=\"472.0\" y=\"182.5\" width=\"56.0\" height=\"75.5\" fill=\"#1660a8\"/><text x=\"500.0\" y=\"178.5\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">17<\/text><\/svg><\/div>", "o": [["A", "La germinación fue mayor entre 25 °C y 30 °C que en las temperaturas extremas.", "Los mayores valores (46 y 44) se dieron a 25 °C y 30 °C; a 10 °C y 35 °C germinaron muchas menos semillas.", true], ["B", "La germinación aumenta siempre que aumenta la temperatura.", "A 35 °C germinaron menos semillas que a 25 °C y a 30 °C; el aumento no es constante.", false], ["C", "A 40 °C no germinará ninguna semilla de fríjol.", "Es una extrapolación fuera del rango medido; los datos no permiten afirmar qué pasa a 40 °C.", false], ["D", "La temperatura no influye en la germinación, porque en todas las bandejas germinaron semillas.", "Que germinen algunas semillas en todas las bandejas no significa que la temperatura no influya: el número varió de 4 a 46.", false]]}, {"id": "CNB-109", "niv": 2, "cp": "cn_indagacion", "cn": "biologico", "e": "Para ahorrar semillas, un estudiante propone repetir el experimento con solo 5 semillas por bandeja. ¿Cuál sería la principal desventaja?", "f": "Diseño experimental: tamaño de la muestra", "vis": "", "o": [["A", "Germinaría un porcentaje mayor de semillas, porque habría menos competencia por el agua del riego.", "No hay evidencia de que las semillas compitan por el agua en la germinación; el problema real es la confiabilidad de una muestra pequeña.", false], ["B", "Las diferencias entre bandejas podrían deberse al azar y no a la temperatura.", "Con muestras pequeñas, una o dos semillas defectuosas cambian mucho el resultado; con 50 semillas el efecto del azar es menor.", true], ["C", "La temperatura dejaría de ser la variable independiente del experimento.", "La temperatura seguiría siendo la variable que se cambia a propósito; el número de semillas no altera eso.", false], ["D", "Ya no se podría calcular el porcentaje de germinación de cada bandeja.", "El porcentaje se puede calcular con cualquier número de semillas; lo que se pierde es confiabilidad.", false]]}]}, {"comp": "ciencias_naturales", "sim": "s11-2", "ses": 2, "ind": "Ondas sonoras y cuerdas", "tt": "", "texto": "El sonido es una onda mecánica: se produce por la vibración de un objeto y se propaga por un medio material, como el aire, el agua o un sólido. Para una onda se cumple que v = λ × f, donde v es la rapidez de propagación, λ la longitud de onda y f la frecuencia.", "vis": "", "items": [{"id": "CNB-110", "niv": 1, "cp": "cn_uso_comprensivo", "cn": "fisico", "e": "Un diapasón vibra con una frecuencia de 425 Hz. Si la rapidez del sonido en el aire es 340 m/s, ¿cuál es la longitud de onda del sonido que produce?", "f": "Relación v = λf", "vis": "", "o": [["A", "0,4 m.", "Corresponde a la mitad del valor correcto; resulta de dividir mal o de tomar media longitud de onda.", false], ["B", "0,8 m.", "λ = v / f = 340 m/s ÷ 425 Hz = 0,8 m.", true], ["C", "1,25 m.", "Se obtiene al invertir la fórmula (f / v = 425 ÷ 340), que no da una longitud.", false], ["D", "144.500 m.", "Resulta de multiplicar v × f, cuando la longitud de onda se obtiene dividiendo v entre f.", false]]}, {"id": "CNB-111", "niv": 2, "cp": "cn_explicacion", "cn": "fisico", "e": "Dos astronautas en una caminata espacial, fuera de la nave, no pueden oírse cuando hablan separados; pero si juntan sus cascos, sí se oyen. ¿Cómo se explica esto?", "f": "Naturaleza mecánica del sonido", "vis": "", "o": [["A", "En el espacio el sonido solo alcanza a viajar unos pocos centímetros antes de apagarse.", "En el vacío el sonido no viaja ninguna distancia; no se trata de que se apague pronto.", false], ["B", "Los cascos amplifican la voz, y separados no se oyen porque el sonido es demasiado débil.", "Aunque el sonido fuera intenso, no se propagaría por el vacío entre los astronautas.", false], ["C", "Al tocarse los cascos, la vibración pasa por el material sólido; separados, no hay un medio entre ellos.", "El sonido es una onda mecánica que necesita un medio; los cascos en contacto forman ese medio, mientras que el espacio entre ellos es prácticamente vacío.", true], ["D", "Al juntar los cascos el sonido viaja más rápido y alcanza a llegar antes de que se desvanezca.", "La clave no es la rapidez, sino la existencia de un medio material por el cual propagarse.", false]]}, {"id": "CNB-112", "niv": 3, "cp": "cn_indagacion", "cn": "fisico", "e": "En un laboratorio se usó una misma cuerda, siempre con la misma longitud, y se midió la frecuencia de su vibración para diferentes tensiones. ¿Qué relación muestran los datos de la tabla?", "f": "Análisis de datos: cuerdas vibrantes", "vis": "<table class=\"vt\"><caption>Tabla 12. Frecuencia de vibración de la cuerda<\/caption><thead><tr><th>Tensión (N)<\/th><th>Frecuencia (Hz)<\/th><\/tr><\/thead><tbody><tr><td>25<\/td><td>100<\/td><\/tr><tr><td>100<\/td><td>200<\/td><\/tr><tr><td>225<\/td><td>300<\/td><\/tr><tr><td>400<\/td><td>400<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Datos ficticios.<\/div>", "o": [["A", "Al duplicar la tensión, la frecuencia también se duplica.", "De 100 N a 400 N la tensión se cuadruplica y la frecuencia pasa de 200 Hz a 400 Hz; duplicar la frecuencia exige cuadruplicar la tensión.", false], ["B", "La frecuencia es directamente proporcional a la tensión.", "Si fuera proporcional, al cuadruplicar la tensión (de 25 N a 100 N) la frecuencia se cuadruplicaría, pero solo se duplica.", false], ["C", "La frecuencia disminuye cuando aumenta la tensión.", "Los datos muestran lo contrario: a mayor tensión, mayor frecuencia.", false], ["D", "Al cuadruplicar la tensión, la frecuencia se duplica.", "De 25 N a 100 N, y de 100 N a 400 N, la tensión se multiplica por 4 y la frecuencia por 2 (de 100 a 200 Hz y de 200 a 400 Hz).", true]]}]}, {"comp": "ciencias_naturales", "sim": "s11-2", "ses": 2, "ind": "Comportamiento de los gases", "tt": "", "texto": "Los gases están formados por partículas en movimiento constante que chocan contra las paredes del recipiente; esos choques producen la presión del gas. Cuando la cantidad de gas y la temperatura se mantienen constantes, P1 × V1 = P2 × V2. Cuando la cantidad de gas y la presión se mantienen constantes, el volumen es directamente proporcional a la temperatura absoluta (en kelvin).", "vis": "", "items": [{"id": "CNB-116", "niv": 1, "cp": "cn_uso_comprensivo", "cn": "quimico", "e": "Una jeringa sellada contiene 60 mL de aire a 1 atm. Si se empuja el émbolo lentamente, sin cambiar la temperatura, hasta que el volumen es 20 mL, ¿cuál es la nueva presión del aire?", "f": "Ley de Boyle", "vis": "", "o": [["A", "0,33 atm.", "Supone que la presión disminuye en la misma proporción que el volumen; a temperatura constante, P y V son inversamente proporcionales.", false], ["B", "1 atm.", "Supone que la presión no cambia porque la cantidad de aire es la misma; al reducir el volumen, la presión aumenta.", false], ["C", "3 atm.", "P2 = P1 × V1 / V2 = 1 atm × 60 mL ÷ 20 mL = 3 atm.", true], ["D", "40 atm.", "Confunde la reducción de volumen (60 mL − 20 mL = 40 mL) con el valor de la presión.", false]]}, {"id": "CNB-117", "niv": 2, "cp": "cn_explicacion", "cn": "quimico", "e": "Un globo inflado se guarda en el congelador y, después de un rato, se ve más pequeño, aunque no ha perdido aire. ¿Cuál es la explicación?", "f": "Teoría cinético-molecular de los gases", "vis": "", "o": [["A", "Las partículas del gas se encogen al enfriarse y por eso ocupan menos espacio dentro del globo.", "Las partículas no cambian de tamaño con la temperatura; lo que cambia es su movimiento.", false], ["B", "Al enfriarse, el gas gana masa y se vuelve más pesado, de modo que el globo se comprime bajo su propio peso.", "La masa del gas no cambia al enfriarse; solo cambia su volumen.", false], ["C", "El frío hace que parte del gas escape lentamente a través de los poros del caucho del globo.", "El enunciado aclara que no se perdió aire; la reducción se explica por el comportamiento de las partículas que siguen dentro.", false], ["D", "Las partículas se mueven más despacio, chocan con menos fuerza contra el globo y este se contrae.", "A menor energía cinética de las partículas, la presión interna baja y el globo se contrae hasta equilibrarse con la presión exterior.", true]]}, {"id": "CNB-118", "niv": 3, "cp": "cn_indagacion", "cn": "quimico", "e": "Un estudiante calentó un gas en un recipiente con un émbolo libre (presión constante) y midió su volumen. Si la tendencia de los datos se mantiene, ¿qué volumen se espera a 80 °C?", "f": "Ley de Charles: análisis de datos", "vis": "<div class=\"vfig\"><svg class=\"vg\" viewBox=\"0 0 560 320\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Gráfica 15. Volumen del gas según la temperatura\" font-family=\"Arial, sans-serif\" font-size=\"12\"><rect width=\"560\" height=\"320\" fill=\"#ffffff\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"13\" fill=\"#1d2433\">Gráfica 15. Volumen del gas según la temperatura<\/text><line x1=\"60\" y1=\"258.0\" x2=\"540\" y2=\"258.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"262.0\" text-anchor=\"end\" fill=\"#3a4356\">0<\/text><line x1=\"60\" y1=\"202.5\" x2=\"540\" y2=\"202.5\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"206.5\" text-anchor=\"end\" fill=\"#3a4356\">20<\/text><line x1=\"60\" y1=\"147.0\" x2=\"540\" y2=\"147.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"151.0\" text-anchor=\"end\" fill=\"#3a4356\">40<\/text><line x1=\"60\" y1=\"91.5\" x2=\"540\" y2=\"91.5\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"95.5\" text-anchor=\"end\" fill=\"#3a4356\">60<\/text><line x1=\"60\" y1=\"36.0\" x2=\"540\" y2=\"36.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"40.0\" text-anchor=\"end\" fill=\"#3a4356\">80<\/text><line x1=\"60\" y1=\"258\" x2=\"540\" y2=\"258\" stroke=\"#3a4356\"/><line x1=\"60\" y1=\"258\" x2=\"60\" y2=\"36\" stroke=\"#3a4356\"/><text transform=\"translate(14,147.0) rotate(-90)\" text-anchor=\"middle\" fill=\"#3a4356\">Volumen (mL)<\/text><text x=\"300.0\" y=\"312\" text-anchor=\"middle\" fill=\"#3a4356\">Temperatura (°C)<\/text><text x=\"120.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">0<\/text><text x=\"240.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">20<\/text><text x=\"360.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">40<\/text><text x=\"480.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">60<\/text><polyline fill=\"none\" stroke=\"#1660a8\" stroke-width=\"2.5\" points=\"120.0,106.5 240.0,95.4 360.0,84.3 480.0,73.2\"/><circle cx=\"120.0\" cy=\"106.5\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"120.0\" y=\"98.5\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">54,6<\/text><circle cx=\"240.0\" cy=\"95.4\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"240.0\" y=\"87.4\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">58,6<\/text><circle cx=\"360.0\" cy=\"84.3\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"360.0\" y=\"76.3\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">62,6<\/text><circle cx=\"480.0\" cy=\"73.2\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"480.0\" y=\"65.2\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">66,6<\/text><\/svg><\/div>", "o": [["A", "68,6 mL.", "Suma solo 2 mL al último dato; el volumen aumenta 4 mL por cada 20 °C, así que de 60 °C a 80 °C debe sumar 4 mL.", false], ["B", "70,6 mL.", "El volumen aumenta 4,0 mL por cada 20 °C (0,2 mL por grado); de 66,6 mL a 60 °C se pasa a 66,6 + 4,0 = 70,6 mL a 80 °C.", true], ["C", "125,2 mL.", "Supone que al pasar de 40 °C a 80 °C el volumen se duplica; el volumen es proporcional a la temperatura en kelvin, no en grados Celsius.", false], ["D", "234,4 mL.", "Multiplica el volumen a 20 °C por 4 porque 80 °C es cuatro veces 20 °C; ese razonamiento usa la escala Celsius, que no es absoluta.", false]]}]}, {"comp": "ciencias_naturales", "sim": "s11-2", "ses": 2, "ind": "Reacciones químicas y conservación de la masa", "tt": "", "texto": "En una reacción química los átomos se reorganizan: no se crean ni se destruyen. Por eso, en un sistema cerrado, la masa total de los reactivos es igual a la masa total de los productos (ley de conservación de la masa).", "vis": "", "items": [{"id": "CNB-125", "niv": 2, "cp": "cn_uso_comprensivo", "cn": "quimico", "e": "El metano arde según la ecuación CH₄ + 2 O₂ → CO₂ + 2 H₂O. Si 16 g de metano reaccionan completamente con 64 g de oxígeno y se forman 44 g de dióxido de carbono, ¿qué masa de agua se forma?", "f": "Ley de conservación de la masa", "vis": "", "o": [["A", "20 g.", "Resta solo la masa de CO₂ a la del oxígeno (64 − 44) y olvida incluir la masa del metano.", false], ["B", "36 g.", "Masa de reactivos = 16 + 64 = 80 g; masa de agua = 80 − 44 = 36 g.", true], ["C", "44 g.", "Supone que se forma la misma masa de agua que de CO₂; las masas de los productos no tienen por qué ser iguales.", false], ["D", "80 g.", "Es la masa total de los reactivos; de ella hay que restar los 44 g de CO₂.", false]]}, {"id": "CNB-126", "niv": 3, "cp": "cn_explicacion", "cn": "quimico", "e": "Se coloca lana de acero (hierro) en un plato metálico sobre una balanza, al aire libre, y se quema. Al terminar, la balanza registra una masa mayor que la inicial. ¿Cuál es la explicación?", "f": "Combustión del hierro y conservación de la masa", "vis": "", "o": [["A", "El hierro se combina con el oxígeno del aire, y la masa de ese oxígeno queda en el producto.", "Se forma óxido de hierro; el oxígeno que antes estaba en el aire ahora está en el sólido sobre la balanza, por eso la masa medida aumenta.", true], ["B", "Al quemarse, el hierro libera gases y la balanza deja de medir correctamente.", "Si el hierro liberara gases, la masa sobre la balanza disminuiría, no aumentaría.", false], ["C", "El calor de la llama tiene masa y queda almacenado en el hierro quemado.", "El calor es energía transferida, no una sustancia con masa que se acumule en el producto.", false], ["D", "La combustión produce materia nueva, por lo que la masa del sistema aumenta.", "En una reacción química no se crea materia; la masa adicional proviene de otra sustancia que se incorporó.", false]]}, {"id": "CNB-127", "niv": 2, "cp": "cn_indagacion", "cn": "quimico", "e": "Se colocaron tiras de magnesio de igual masa en 50 mL de ácido clorhídrico de tres concentraciones distintas, todas a la misma temperatura, y se midió el tiempo que tardó cada tira en desaparecer. En todos los casos el ácido estaba en exceso. ¿Qué conclusión se apoya en los resultados?", "f": "Velocidad de reacción: análisis de datos", "vis": "<table class=\"vt\"><caption>Tabla 13. Tiempo de reacción del magnesio<\/caption><thead><tr><th>Concentración del HCl (mol/L)<\/th><th>Tiempo hasta que desaparece el magnesio (s)<\/th><\/tr><\/thead><tbody><tr><td>0,5<\/td><td>180<\/td><\/tr><tr><td>1,0<\/td><td>90<\/td><\/tr><tr><td>2,0<\/td><td>45<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Datos ficticios.<\/div>", "o": [["A", "A mayor concentración del ácido, la reacción ocurrió más rápido.", "Al duplicar la concentración, el tiempo se redujo a la mitad (180 s, 90 s, 45 s): la reacción fue más rápida con ácido más concentrado.", true], ["B", "A mayor concentración del ácido, se produjo más hidrógeno en total.", "El experimento midió tiempos, no cantidad de gas; además, con ácido en exceso y la misma masa de magnesio, el hidrógeno total es el mismo.", false], ["C", "La concentración del ácido no influye en la reacción, porque en los tres casos el magnesio desapareció.", "Aunque en todos los casos el magnesio reaccionó, el tiempo cambió mucho con la concentración.", false], ["D", "A mayor concentración del ácido, la reacción ocurrió más lentamente.", "Los tiempos disminuyeron al aumentar la concentración, lo que indica una reacción más rápida, no más lenta.", false]]}]}, {"comp": "ciencias_naturales", "sim": "s11-2", "ses": 2, "ind": "Resistencia de las bacterias a los antibióticos", "tt": "", "texto": "En una población grande de bacterias puede haber, por mutaciones ocurridas al azar, unas pocas bacterias con una variante genética que les permite sobrevivir a un antibiótico. Cuando una población está expuesta al antibiótico durante mucho tiempo, la proporción de bacterias resistentes aumenta.", "vis": "", "items": [{"id": "CNB-138", "niv": 3, "cp": "cn_explicacion", "cn": "biologico", "e": "¿Qué explicación del aumento de bacterias resistentes es correcta?", "f": "Selección natural", "vis": "", "o": [["A", "Las bacterias deciden cambiar sus genes para defenderse del antibiótico.", "Las bacterias no deciden cambiar sus genes; las variantes surgen al azar.", false], ["B", "El antibiótico produce en cada bacteria la mutación exacta que necesita para resistirlo.", "El texto indica que las mutaciones ocurren al azar; el antibiótico no las dirige.", false], ["C", "Las bacterias se acostumbran poco a poco al antibiótico durante su vida y transmiten esa costumbre a su descendencia.", "Las características adquiridas por acostumbrarse no se heredan; lo que se hereda es la variante genética.", false], ["D", "El antibiótico elimina a las sensibles, y las resistentes, que ya existían, sobreviven y se reproducen.", "Es selección natural: la variante resistente ya estaba presente y deja más descendientes cuando el antibiótico elimina a las demás.", true]]}, {"id": "CNB-139", "niv": 2, "cp": "cn_uso_comprensivo", "cn": "cts", "e": "En algunos países se agregaban antibióticos al alimento de pollos y cerdos sanos para que crecieran más rápido. ¿Por qué las autoridades de salud recomiendan dejar de hacerlo?", "f": "Recomendaciones de la OMS sobre antibióticos en animales", "vis": "", "o": [["A", "Porque los pollos y los cerdos se vuelven resistentes a todos los antibióticos.", "Los que se vuelven resistentes son las bacterias, no los animales.", false], ["B", "Porque los antibióticos fortalecen a los virus que causan enfermedades a los animales.", "Los antibióticos actúan sobre bacterias, no sobre virus.", false], ["C", "Porque esa práctica selecciona bacterias resistentes que pueden llegar a las personas.", "El uso constante de antibióticos en animales sanos selecciona bacterias resistentes, que pueden pasar a las personas y hacer ineficaces los tratamientos.", true], ["D", "Porque los antibióticos hacen que la carne de los animales pierda sus proteínas.", "Los antibióticos no eliminan las proteínas de la carne; esa no es la razón de la recomendación.", false]]}]}, {"comp": "ciencias_naturales", "sim": "s11-2", "ses": 2, "ind": "Fotosíntesis en una planta acuática", "tt": "", "texto": "Una estudiante colocó una ramita de elodea, una planta acuática, dentro de un tubo con agua. Ubicó una lámpara a diferentes distancias del tubo y, en cada caso, contó las burbujas de gas (principalmente oxígeno) que salían de la planta durante un minuto.", "vis": "<table class=\"vt\"><caption>Tabla 14. Burbujas producidas por la elodea<\/caption><thead><tr><th>Distancia de la lámpara (cm)<\/th><th>Burbujas por minuto<\/th><\/tr><\/thead><tbody><tr><td>10<\/td><td>42<\/td><\/tr><tr><td>20<\/td><td>25<\/td><\/tr><tr><td>30<\/td><td>14<\/td><\/tr><tr><td>40<\/td><td>8<\/td><\/tr><tr><td>50<\/td><td>5<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Datos ficticios.<\/div>", "items": [{"id": "CNB-143", "niv": 1, "cp": "cn_indagacion", "cn": "biologico", "e": "Si la lámpara se ubicara a 15 cm del tubo, ¿qué resultado es el más consistente con los datos?", "f": "Predicción a partir de datos", "vis": "", "o": [["A", "Más de 42 burbujas por minuto.", "A 10 cm se obtuvieron 42 burbujas; al alejar la lámpara a 15 cm, la tendencia indica menos burbujas, no más.", false], ["B", "Entre 25 y 42 burbujas por minuto.", "15 cm está entre 10 cm (42 burbujas) y 20 cm (25 burbujas), y las burbujas disminuyen de forma continua al alejar la lámpara.", true], ["C", "Entre 14 y 25 burbujas por minuto.", "Ese rango corresponde a distancias entre 20 cm y 30 cm.", false], ["D", "Menos de 14 burbujas por minuto.", "Ese valor corresponde a distancias mayores de 30 cm.", false]]}, {"id": "CNB-144", "niv": 3, "cp": "cn_indagacion", "cn": "biologico", "e": "Un compañero advierte que la lámpara también calienta el agua, más cuando está cerca. ¿Qué cambio permitiría saber si el aumento de burbujas se debe a la luz y no a la temperatura?", "f": "Control de variables", "vis": "", "o": [["A", "Usar una lámpara más potente para que la planta produzca muchas más burbujas en cada distancia.", "Una lámpara más potente también calienta más el agua; no separa el efecto de la luz del de la temperatura.", false], ["B", "Contar las burbujas durante 10 minutos, pero solo con la lámpara a 10 cm.", "Medir más tiempo en una sola distancia no permite comparar ni controla la temperatura.", false], ["C", "Mantener igual la temperatura del agua en todos los ensayos y repetir las mediciones.", "Si la temperatura es igual en todos los ensayos, las diferencias en las burbujas solo pueden atribuirse a la luz.", true], ["D", "Usar una planta diferente en cada distancia para comparar más especies.", "Cambiar la planta introduce otra variable y hace imposible atribuir los cambios a la luz.", false]]}, {"id": "CNB-145", "niv": 2, "cp": "cn_uso_comprensivo", "cn": "biologico", "e": "La estudiante repite el ensayo con la lámpara a 30 cm, pero agrega bicarbonato al agua, lo que aumenta el CO₂ disuelto. Si la temperatura no cambia, ¿qué resultado es esperable?", "f": "Factores que afectan la fotosíntesis", "vis": "", "o": [["A", "Menos de 14 burbujas por minuto, porque la planta liberaría CO₂ en lugar de oxígeno.", "Con más CO₂ disponible, la planta lo usa en la fotosíntesis; no pasa a liberarlo en vez de oxígeno.", false], ["B", "Menos de 14 burbujas por minuto, porque el CO₂ es un producto de la fotosíntesis y frena la reacción.", "El CO₂ es un reactivo de la fotosíntesis, no un producto.", false], ["C", "Exactamente 14 burbujas por minuto, porque solo la luz influye en la fotosíntesis.", "La fotosíntesis depende de la luz, pero también de la disponibilidad de CO₂ y de la temperatura.", false], ["D", "Más de 14 burbujas por minuto, porque habría más CO₂ disponible para la fotosíntesis.", "El CO₂ es un reactivo de la fotosíntesis; si era un factor limitante, al aumentarlo se libera más oxígeno.", true]]}]}, {"comp": "ciencias_naturales", "sim": "s11-2", "ses": 2, "ind": "Calor y temperatura", "tt": "", "texto": "Cuando dos cuerpos a distinta temperatura están en contacto, se transfiere energía térmica (calor) del más caliente al más frío hasta que alcanzan la misma temperatura (equilibrio térmico).", "vis": "", "items": [{"id": "CNB-146", "niv": 3, "cp": "cn_uso_comprensivo", "cn": "fisico", "e": "Se mezclan 200 g de agua a 80 °C con 300 g de agua a 20 °C en un recipiente aislado. ¿Cuál es la temperatura final de la mezcla?", "f": "Equilibrio térmico", "vis": "", "o": [["A", "44 °C.", "El calor cedido por el agua caliente es igual al ganado por la fría: 200(80 − T) = 300(T − 20), de donde T = 22.000 ÷ 500 = 44 °C.", true], ["B", "50 °C.", "Es el promedio simple de 80 °C y 20 °C; no tiene en cuenta que hay más masa de agua fría.", false], ["C", "56 °C.", "Pondera al revés: asigna los 300 g a la temperatura de 80 °C y los 200 g a la de 20 °C.", false], ["D", "100 °C.", "Suma las temperaturas; la temperatura no se suma al mezclar.", false]]}, {"id": "CNB-147", "niv": 1, "cp": "cn_explicacion", "cn": "fisico", "e": "Una cuchara metálica y una de madera llevan horas sobre la misma mesa. Al tocarlas, la metálica se siente más fría. ¿Por qué?", "f": "Conducción térmica", "vis": "", "o": [["A", "Porque la madera produce su propio calor y por eso se siente más tibia.", "La madera no produce calor; está a la misma temperatura que el metal.", false], ["B", "Porque el metal transmite frío a la mano.", "No se transmite «frío»; lo que se transfiere es calor, desde la mano hacia el metal.", false], ["C", "Porque la cuchara metálica está a una temperatura más baja que la cuchara de madera.", "Después de horas sobre la mesa, ambas están a la temperatura del ambiente.", false], ["D", "Porque el metal conduce mejor el calor y retira más rápido el calor de la mano.", "La sensación de frío depende de la rapidez con que la mano pierde calor; el metal, buen conductor, lo retira más rápido.", true]]}, {"id": "CNB-148", "niv": 1, "cp": "cn_indagacion", "cn": "fisico", "e": "Se sirvió café a 80 °C en un vaso de icopor y en un vaso metálico, y se midió su temperatura cada 5 minutos (gráfica 16). Si el café del vaso de icopor siguiera enfriándose al mismo ritmo que entre los minutos 15 y 20, ¿hacia qué minuto llegaría a 60 °C?", "f": "Interpretación de gráficas: predicción", "vis": "<div class=\"vfig\"><svg class=\"vg\" viewBox=\"0 0 560 320\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Gráfica 16. Temperatura del café en dos vasos\" font-family=\"Arial, sans-serif\" font-size=\"12\"><rect width=\"560\" height=\"320\" fill=\"#ffffff\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"13\" fill=\"#1d2433\">Gráfica 16. Temperatura del café en dos vasos<\/text><line x1=\"60\" y1=\"258.0\" x2=\"540\" y2=\"258.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"262.0\" text-anchor=\"end\" fill=\"#3a4356\">0<\/text><line x1=\"60\" y1=\"202.5\" x2=\"540\" y2=\"202.5\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"206.5\" text-anchor=\"end\" fill=\"#3a4356\">20<\/text><line x1=\"60\" y1=\"147.0\" x2=\"540\" y2=\"147.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"151.0\" text-anchor=\"end\" fill=\"#3a4356\">40<\/text><line x1=\"60\" y1=\"91.5\" x2=\"540\" y2=\"91.5\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"95.5\" text-anchor=\"end\" fill=\"#3a4356\">60<\/text><line x1=\"60\" y1=\"36.0\" x2=\"540\" y2=\"36.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"40.0\" text-anchor=\"end\" fill=\"#3a4356\">80<\/text><line x1=\"60\" y1=\"258\" x2=\"540\" y2=\"258\" stroke=\"#3a4356\"/><line x1=\"60\" y1=\"258\" x2=\"60\" y2=\"36\" stroke=\"#3a4356\"/><text transform=\"translate(14,147.0) rotate(-90)\" text-anchor=\"middle\" fill=\"#3a4356\">Temperatura (°C)<\/text><text x=\"300.0\" y=\"312\" text-anchor=\"middle\" fill=\"#3a4356\">Tiempo (min)<\/text><text x=\"108.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">0<\/text><text x=\"204.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">5<\/text><text x=\"300.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">10<\/text><text x=\"396.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">15<\/text><text x=\"492.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">20<\/text><polyline fill=\"none\" stroke=\"#1660a8\" stroke-width=\"2.5\" points=\"108.0,36.0 204.0,47.1 300.0,58.2 396.0,66.5 492.0,74.8\"/><circle cx=\"108.0\" cy=\"36.0\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"108.0\" y=\"28.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">80<\/text><circle cx=\"204.0\" cy=\"47.1\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"204.0\" y=\"39.1\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">76<\/text><circle cx=\"300.0\" cy=\"58.2\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"300.0\" y=\"50.2\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">72<\/text><circle cx=\"396.0\" cy=\"66.5\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"396.0\" y=\"58.5\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">69<\/text><circle cx=\"492.0\" cy=\"74.8\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"492.0\" y=\"66.8\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">66<\/text><polyline fill=\"none\" stroke=\"#d9822b\" stroke-width=\"2.5\" points=\"108.0,36.0 204.0,69.3 300.0,97.1 396.0,119.2 492.0,135.9\"/><circle cx=\"108.0\" cy=\"36.0\" r=\"3.5\" fill=\"#d9822b\"/><text x=\"108.0\" y=\"53.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#d9822b\" font-weight=\"bold\">80<\/text><circle cx=\"204.0\" cy=\"69.3\" r=\"3.5\" fill=\"#d9822b\"/><text x=\"204.0\" y=\"86.3\" text-anchor=\"middle\" font-size=\"11\" fill=\"#d9822b\" font-weight=\"bold\">68<\/text><circle cx=\"300.0\" cy=\"97.1\" r=\"3.5\" fill=\"#d9822b\"/><text x=\"300.0\" y=\"114.1\" text-anchor=\"middle\" font-size=\"11\" fill=\"#d9822b\" font-weight=\"bold\">58<\/text><circle cx=\"396.0\" cy=\"119.2\" r=\"3.5\" fill=\"#d9822b\"/><text x=\"396.0\" y=\"136.2\" text-anchor=\"middle\" font-size=\"11\" fill=\"#d9822b\" font-weight=\"bold\">50<\/text><circle cx=\"492.0\" cy=\"135.9\" r=\"3.5\" fill=\"#d9822b\"/><text x=\"492.0\" y=\"152.9\" text-anchor=\"middle\" font-size=\"11\" fill=\"#d9822b\" font-weight=\"bold\">44<\/text><rect x=\"60\" y=\"286\" width=\"12\" height=\"12\" fill=\"#1660a8\"/><text x=\"76\" y=\"296\" fill=\"#1d2433\">Vaso de icopor<\/text><rect x=\"184\" y=\"286\" width=\"12\" height=\"12\" fill=\"#d9822b\"/><text x=\"200\" y=\"296\" fill=\"#1d2433\">Vaso metálico<\/text><\/svg><\/div>", "o": [["A", "Hacia el minuto 25.", "Usa el ritmo del vaso metálico entre los minutos 15 y 20 (6 °C cada 5 minutos), que se enfría mucho más rápido.", false], ["B", "Hacia el minuto 26.", "Supone que el café baja 1 °C por minuto; en el vaso de icopor bajó 3 °C en 5 minutos.", false], ["C", "Hacia el minuto 28.", "Usa el ritmo de los primeros 5 minutos (4 °C cada 5 minutos) y no el de los minutos 15 a 20.", false], ["D", "Hacia el minuto 30.", "Entre los minutos 15 y 20 bajó de 69 °C a 66 °C (3 °C en 5 min); para bajar 6 °C más se necesitan 10 minutos: minuto 30.", true]]}]}, {"comp": "ciencias_naturales", "sim": "s11-2", "ses": 2, "ind": "Segunda ley de Newton con carritos", "tt": "", "texto": "Para estudiar la segunda ley de Newton, unos estudiantes halaron carritos de distinta masa sobre una superficie horizontal, siempre con la misma fuerza neta de 6 N, y midieron la aceleración de cada uno.", "vis": "<table class=\"vt\"><caption>Tabla 15. Aceleración de carritos con una fuerza neta de 6 N<\/caption><thead><tr><th>Masa del carrito (kg)<\/th><th>Aceleración (m/s²)<\/th><\/tr><\/thead><tbody><tr><td>0,5<\/td><td>12<\/td><\/tr><tr><td>1,0<\/td><td>6<\/td><\/tr><tr><td>1,5<\/td><td>4<\/td><\/tr><tr><td>2,0<\/td><td>3<\/td><\/tr><tr><td>3,0<\/td><td>2<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Datos ficticios.<\/div>", "items": [{"id": "CNB-149", "niv": 3, "cp": "cn_indagacion", "cn": "fisico", "e": "¿Qué relación entre la masa y la aceleración muestran los datos?", "f": "Segunda ley de Newton: análisis de datos", "vis": "", "o": [["A", "La aceleración no depende de la masa del carrito.", "La aceleración cambió de 12 m/s² a 2 m/s² al cambiar la masa.", false], ["B", "Al duplicar la masa, la aceleración también se duplica.", "Los datos muestran lo contrario: de 1,0 kg a 2,0 kg la aceleración baja de 6 a 3 m/s².", false], ["C", "Al duplicar la masa, la aceleración se reduce a la mitad.", "De 0,5 a 1,0 kg la aceleración pasa de 12 a 6 m/s², y de 1,0 a 2,0 kg pasa de 6 a 3 m/s²: es una relación inversamente proporcional.", true], ["D", "La aceleración disminuye 6 m/s² por cada kilogramo que se agrega.", "La disminución no es constante: de 1,0 kg a 2,0 kg la aceleración baja solo 3 m/s².", false]]}, {"id": "CNB-150", "niv": 1, "cp": "cn_indagacion", "cn": "fisico", "e": "Un estudiante propone que, en lugar de usar siempre 6 N, cada compañero hale el carrito con la fuerza que pueda. ¿Por qué esto afectaría la validez del experimento?", "f": "Control de variables", "vis": "", "o": [["A", "Porque la aceleración dependería también de la fuerza, no solo de la masa.", "Si varían a la vez la fuerza y la masa, no se sabe cuál de las dos causó el cambio en la aceleración.", true], ["B", "Porque con la mano la fuerza sería mayor de 6 N y los carritos se dañarían.", "El problema no es la magnitud de la fuerza, sino que deje de ser igual en todos los ensayos.", false], ["C", "Porque la masa de los carritos cambiaría al halarlos con la mano en cada ensayo.", "Halar con la mano no cambia la masa de los carritos.", false], ["D", "Porque la aceleración depende solo de la masa y no de la fuerza aplicada.", "La aceleración sí depende de la fuerza (a = F/m); por eso la fuerza debe mantenerse constante.", false]]}, {"id": "CNB-151", "niv": 3, "cp": "cn_indagacion", "cn": "fisico", "e": "Si se repitiera el experimento con un carrito de 4,0 kg y la misma fuerza neta, ¿qué aceleración se esperaría?", "f": "Segunda ley de Newton: predicción", "vis": "", "o": [["A", "1 m/s².", "Supone que la aceleración baja 1 m/s² por cada kilogramo, como entre 2,0 y 3,0 kg; esa disminución no es constante.", false], ["B", "1,5 m/s².", "Los datos cumplen a = F/m = 6 N ÷ masa; para 4,0 kg, a = 6 ÷ 4 = 1,5 m/s².", true], ["C", "2 m/s².", "Supone que la aceleración deja de cambiar a partir de 3,0 kg, lo que contradice la tendencia de los datos.", false], ["D", "24 m/s².", "Multiplica la fuerza por la masa (6 × 4) en lugar de dividir.", false]]}]}, {"comp": "ciencias_naturales", "sim": "s11-2", "ses": 2, "ind": "Enlace iónico y conductividad", "tt": "", "texto": "El sodio (Na) es un metal del grupo 1 de la tabla periódica y el cloro (Cl) es un no metal del grupo 17. Para comprobar qué soluciones conducen la electricidad, unos estudiantes conectaron un bombillo, una pila y dos electrodos sumergidos en cada solución.", "vis": "<table class=\"vt\"><caption>Tabla 16. Prueba de conductividad<\/caption><thead><tr><th>Solución<\/th><th>¿Encendió el bombillo?<\/th><\/tr><\/thead><tbody><tr><td>Agua destilada<\/td><td>No<\/td><\/tr><tr><td>Agua con sal<\/td><td>Sí, con brillo intenso<\/td><\/tr><tr><td>Agua con azúcar<\/td><td>No<\/td><\/tr><tr><td>Vinagre<\/td><td>Sí, con brillo débil<\/td><\/tr><tr><td>Alcohol<\/td><td>No<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Resultados de una práctica escolar.<\/div>", "items": [{"id": "CNB-152", "niv": 2, "cp": "cn_uso_comprensivo", "cn": "quimico", "e": "¿Qué ocurre cuando el sodio y el cloro forman cloruro de sodio (NaCl)?", "f": "Enlace iónico", "vis": "", "o": [["A", "El sodio cede un electrón al cloro y se forman los iones Na⁺ y Cl⁻.", "El sodio pierde su único electrón externo y el cloro lo gana para completar ocho; se forman iones de carga opuesta que se atraen (enlace iónico).", true], ["B", "Ambos átomos comparten un par de electrones, como en un enlace covalente.", "Entre un metal del grupo 1 y un no metal del grupo 17 la diferencia de electronegatividad es grande y el enlace es iónico.", false], ["C", "El sodio gana siete electrones del cloro para completar ocho en su último nivel.", "Ganar siete electrones requeriría muchísima energía; el sodio alcanza una configuración estable perdiendo su único electrón externo.", false], ["D", "El cloro cede un electrón al sodio y se forman los iones Na⁻ y Cl⁺.", "Invierte el proceso: el cloro, muy electronegativo, gana electrones; el sodio los pierde.", false]]}, {"id": "CNB-153", "niv": 2, "cp": "cn_explicacion", "cn": "quimico", "e": "Según la tabla, el agua con sal conduce la electricidad y el agua con azúcar no. ¿Por qué?", "f": "Electrolitos y no electrolitos", "vis": "", "o": [["A", "Porque los cristales de sal ya conducen la corriente antes de disolverse.", "La sal sólida no conduce: sus iones están fijos en el cristal; solo conducen cuando quedan libres al disolverse.", false], ["B", "Porque la sal aumenta la temperatura del agua y ese calentamiento permite el paso de la corriente.", "Disolver sal no calienta el agua de manera apreciable; la conducción se debe a los iones.", false], ["C", "Porque la sal se disocia en iones móviles, y el azúcar queda como moléculas sin carga.", "En una solución la corriente la transportan los iones, no electrones libres; el azúcar se disuelve como moléculas neutras que no transportan carga.", true], ["D", "Porque el azúcar forma una solución más espesa que frena el paso de los electrones.", "En una solución la corriente la transportan iones, no electrones libres; el azúcar no aporta iones, sin importar la viscosidad.", false]]}, {"id": "CNB-154", "niv": 2, "cp": "cn_indagacion", "cn": "quimico", "e": "Los estudiantes concluyen que el vinagre tiene menos iones libres que el agua con sal porque el bombillo brilló menos. ¿Qué haría más confiable esta comparación?", "f": "Instrumentos adecuados para reunir datos", "vis": "", "o": [["A", "Repetir la prueba del vinagre con un vinagre más concentrado, para que el bombillo brille más.", "Cambiar la concentración solo en una de las soluciones introduce otra diferencia y hace la comparación menos justa.", false], ["B", "Repetir la prueba con agua destilada hasta lograr que el bombillo encienda.", "El agua destilada no forma parte de la comparación entre el vinagre y el agua con sal.", false], ["C", "Usar una pila de mayor voltaje solo en la prueba del vinagre, para notar mejor su brillo.", "Usar distinto voltaje en cada prueba impide comparar las soluciones en las mismas condiciones.", false], ["D", "Medir la corriente con un amperímetro en ambas, con los electrodos a igual distancia.", "El brillo es una observación cualitativa; medir la corriente en condiciones iguales permite comparar cuantitativamente.", true]]}]}, {"comp": "ciencias_naturales", "sim": "s11-2", "ses": 2, "ind": "Separación de mezclas", "tt": "", "texto": "Las mezclas pueden separarse aprovechando diferencias en las propiedades de sus componentes, como el tamaño de las partículas, la solubilidad o el punto de ebullición. En la cromatografía en papel, las sustancias de una tinta avanzan a distinta velocidad con el solvente y quedan como manchas separadas.", "vis": "", "items": [{"id": "CNB-155", "niv": 1, "cp": "cn_explicacion", "cn": "quimico", "e": "Una mezcla contiene arena, sal y agua. ¿Qué secuencia permite recuperar por separado la arena y la sal?", "f": "Separación de mezclas: filtración y evaporación", "vis": "", "o": [["A", "Filtrar para retener la arena y luego evaporar el agua para recuperar la sal.", "La arena queda en el filtro porque no se disuelve; la sal pasa disuelta y queda como sólido al evaporarse el agua.", true], ["B", "Dejar reposar, pasar el agua salada a otro recipiente y filtrarla para retener la sal.", "La sal está disuelta: atraviesa el papel de filtro con el agua y no queda retenida.", false], ["C", "Evaporar primero el agua y después filtrar para separar la sal de la arena.", "Si se evapora primero el agua, queda una mezcla sólida de sal y arena que ya no se puede filtrar.", false], ["D", "Filtrar dos veces seguidas, para que el papel retenga primero la arena y después la sal.", "Filtrar de nuevo no retiene la sal disuelta, porque sus partículas atraviesan el papel.", false]]}, {"id": "CNB-156", "niv": 2, "cp": "cn_indagacion", "cn": "quimico", "e": "Se hizo una cromatografía en papel con tres tintas y se obtuvieron los resultados de la tabla. ¿Qué conclusión es válida?", "f": "Cromatografía en papel", "vis": "<table class=\"vt\"><caption>Tabla 17. Manchas obtenidas en la cromatografía<\/caption><thead><tr><th>Tinta<\/th><th>Manchas observadas<\/th><\/tr><\/thead><tbody><tr><td>Negra<\/td><td>Azul, amarilla y roja<\/td><\/tr><tr><td>Azul<\/td><td>Azul<\/td><\/tr><tr><td>Roja<\/td><td>Roja<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Resultados de una práctica escolar.<\/div>", "o": [["A", "La tinta negra está hecha únicamente de las tintas azul y roja analizadas.", "La tinta negra también dio una mancha amarilla, que no aparece en las tintas azul ni roja.", false], ["B", "La tinta negra es una sustancia pura, porque a simple vista se ve de un solo color.", "La cromatografía separó la tinta negra en tres manchas; verse de un color no indica que sea pura.", false], ["C", "La tinta negra es una mezcla de al menos tres sustancias.", "Se separó en tres manchas de distinto color; podría tener más componentes que no se separaron con este solvente.", true], ["D", "Las tintas azul y roja son mezclas de tres sustancias cada una.", "Cada una produjo una sola mancha; con estos datos no hay evidencia de que sean mezclas.", false]]}]}, {"comp": "ingles", "sim": "s11-2", "ses": 2, "ind": "Parte 1 · Vocabulario: profesiones y oficios", "tt": "", "texto": "Read the descriptions of some words. What is the word for each description? Choose the correct word (A–G). There are more words than you need.\n\nA. pilot\nB. nurse\nC. lawyer\nD. firefighter\nE. waiter\nF. farmer\nG. librarian", "vis": "", "items": [{"id": "EN1-118", "niv": 1, "cp": "en_p1", "cn": "", "e": "This person flies planes.", "f": "Vocabulario del campo semántico «Profesiones y oficios» (redacción propia)", "vis": "", "o": [["A", "pilot", "Correcta. «pilot» significa «piloto»: persona que conduce aviones. La descripción dice: «Esta persona pilotea aviones».", true], ["B", "nurse", "«nurse» significa «enfermero(a)»: persona que cuida a los pacientes y ayuda a los médicos; no corresponde a «Esta persona pilotea aviones».", false], ["C", "lawyer", "«lawyer» significa «abogado(a)»: persona que asesora sobre la ley y defiende a otros ante un juez; no corresponde a «Esta persona pilotea aviones».", false], ["D", "firefighter", "«firefighter» significa «bombero(a)»: persona que apaga incendios; no corresponde a «Esta persona pilotea aviones».", false], ["E", "waiter", "«waiter» significa «mesero»: persona que lleva la comida a la mesa en un restaurante; no corresponde a «Esta persona pilotea aviones».", false], ["F", "farmer", "«farmer» significa «agricultor(a) / granjero(a)»: persona que cultiva la tierra y cría animales; no corresponde a «Esta persona pilotea aviones».", false], ["G", "librarian", "«librarian» significa «bibliotecario(a)»: persona que organiza y presta libros en una biblioteca; no corresponde a «Esta persona pilotea aviones».", false]]}, {"id": "EN1-119", "niv": 1, "cp": "en_p1", "cn": "", "e": "This person brings food to your table in a restaurant.", "f": "Vocabulario del campo semántico «Profesiones y oficios» (redacción propia)", "vis": "", "o": [["A", "pilot", "«pilot» significa «piloto»: persona que conduce aviones; no corresponde a «Esta persona le lleva la comida a la mesa en un restaurante».", false], ["B", "nurse", "«nurse» significa «enfermero(a)»: persona que cuida a los pacientes y ayuda a los médicos; no corresponde a «Esta persona le lleva la comida a la mesa en un restaurante».", false], ["C", "lawyer", "«lawyer» significa «abogado(a)»: persona que asesora sobre la ley y defiende a otros ante un juez; no corresponde a «Esta persona le lleva la comida a la mesa en un restaurante».", false], ["D", "firefighter", "«firefighter» significa «bombero(a)»: persona que apaga incendios; no corresponde a «Esta persona le lleva la comida a la mesa en un restaurante».", false], ["E", "waiter", "Correcta. «waiter» significa «mesero»: persona que lleva la comida a la mesa en un restaurante. La descripción dice: «Esta persona le lleva la comida a la mesa en un restaurante».", true], ["F", "farmer", "«farmer» significa «agricultor(a) / granjero(a)»: persona que cultiva la tierra y cría animales; no corresponde a «Esta persona le lleva la comida a la mesa en un restaurante».", false], ["G", "librarian", "«librarian» significa «bibliotecario(a)»: persona que organiza y presta libros en una biblioteca; no co
