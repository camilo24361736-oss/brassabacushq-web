<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulacro 2 · Saber 11</title>
<style>
:root{--bg:#f3f6f8;--card:#fff;--ink:#1d2433;--mute:#5a6478;--line:#d6dee4;--pri:#0b4f6c;--pri2:#1f7aa3;--ok:#0d6b3a;--okbg:#e6f4ec;--no:#9b1c1c;--nobg:#fbeaea;--sel:#e4f1f8}
@media (prefers-color-scheme: dark){:root{--bg:#0f1418;--card:#172026;--ink:#e3eaee;--mute:#97a6b0;--line:#2c3a44;--pri:#7cc3e6;--pri2:#a3d6ef;--ok:#7fd3a3;--okbg:#16301f;--no:#f2a3a3;--nobg:#3a1c1c;--sel:#1d3442}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overflow-wrap:anywhere}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px}
.hwrap{max-width:860px;margin:0 auto;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;justify-content:space-between}
h1{font-size:17px;margin:0;color:var(--pri)}
h2{color:var(--pri)}
.stat{font-size:14px;color:var(--mute)}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--pri)}
.timer.low{color:var(--no)}
main{max-width:860px;margin:0 auto;padding:16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin:0 0 16px}
.mod{background:var(--pri);color:var(--card);border-radius:10px;padding:10px 14px;margin:28px 0 6px;font-weight:700;font-size:18px}
.inst{font-size:13px;font-weight:700;color:var(--pri);text-transform:uppercase;letter-spacing:.03em;margin:18px 0 4px}
.caso{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--pri);border-radius:10px;padding:14px 16px;margin:10px 0}
.tag{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--pri);font-weight:700}
.caso p{margin:6px 0 0;white-space:pre-line}
.item{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0}
.enun{margin:0 0 8px;white-space:pre-line}
.n{font-weight:700;color:var(--pri)}
.niv{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-right:4px;white-space:nowrap}
.op{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:6px 0;cursor:pointer;background:transparent;width:100%;text-align:left;color:inherit;font:inherit}
.ops8{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.ops8 .op{margin:0}
.op:hover{border-color:var(--pri2)}
.op .l{font-weight:700;min-width:20px}
.op.sel{background:var(--sel);border-color:var(--pri2)}
.op.ok{background:var(--okbg);border-color:var(--ok)}
.op.no{background:var(--nobg);border-color:var(--no)}
.op[disabled]{cursor:default}
.just{font-size:14px;margin:8px 0 0;padding:8px 10px;border-top:1px dashed var(--line)}
.just div{margin:4px 0}
.just .okt{color:var(--ok);font-weight:700}
.just .not{color:var(--no);font-weight:700}
.src{font-size:13px;color:var(--mute);margin-top:6px}
button.btn{background:var(--pri);color:var(--card);border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer}
button.btn.sec{background:transparent;color:var(--pri);border:1px solid var(--pri)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
select{font:inherit;padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);max-width:100%}
table{border-collapse:collapse;width:100%;font-size:15px}
td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.sub td{font-size:13px;color:var(--mute);padding-left:22px}
.vt{width:auto;max-width:100%;margin:10px 0;font-size:14px;display:block;overflow-x:auto}
.vt caption{text-align:left;font-weight:700;padding-bottom:4px}
.vt th,.vt td{border:1px solid var(--line);padding:4px 8px}
.vt th{background:var(--sel)}
.vnota{font-size:12px;color:var(--mute)}
.vfig{margin:10px 0}
.vfig svg{width:100%;max-width:560px;height:auto;border-radius:6px;border:1px solid var(--line);background:#fff}
.big{font-size:40px;font-weight:800;color:var(--pri);line-height:1.1}
.aviso{font-size:13px;color:var(--mute)}
.hide{display:none !important}
.res-ok{color:var(--ok);font-weight:700}.res-no{color:var(--no);font-weight:700}
textarea{width:100%;min-height:320px;font:inherit;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);resize:vertical}
.chk label{display:flex;gap:8px;align-items:flex-start;margin:6px 0;font-size:15px}
.chk input{margin-top:4px;width:18px;height:18px;flex:none}
.modelo{white-space:pre-line;background:var(--bg);border-radius:8px;padding:10px 12px;margin:6px 0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal .panel{max-width:420px}
.nav{padding:6px 0;display:flex;gap:6px;flex-wrap:wrap}
.nav a{font-size:13px;color:var(--pri);border:1px solid var(--line);border-radius:999px;padding:3px 10px;text-decoration:none;background:var(--card)}
footer{max-width:860px;margin:0 auto;padding:8px 16px 40px;font-size:12px;color:var(--mute)}
</style>
</head>
<body>
<header><div class="hwrap"><h1 id="tit"></h1><div class="row stat"><span id="prog"></span><span id="timer" class="timer"></span></div></div></header>
<main id="main"></main>
<div id="modal" class="modal hide"><div class="panel"><p id="mtxt"></p><div class="row"><button class="btn" id="msi">Sí, calificar</button><button class="btn sec" id="mno">Seguir respondiendo</button></div></div></div>
<footer>Material de preparación independiente. No está afiliado al Icfes ni a ninguna entidad pública. Preguntas y textos originales; no son preguntas reales del examen. Soporte: brassabacuscontact@gmail.com</footer>
<script>
const DATA = [{"comp": "matematicas", "sim": "s11-2", "ses": 1, "ind": "Rampa de acceso a un centro de salud", "tt": "", "texto": "Un maestro de obra construye el acceso para sillas de ruedas de un centro de salud. El reglamento que debe cumplir exige que la rampa tenga una pendiente máxima de 1:12; es decir, que por cada 12 cm de recorrido horizontal la rampa suba como máximo 1 cm. La puerta de entrada está 0,9 m por encima del nivel del andén.", "vis": "", "items": [{"id": "MTB-110", "niv": 1, "cp": "mt_formulacion", "cn": "", "e": "¿Cuál es la longitud horizontal mínima que debe tener la rampa para llegar hasta la puerta?", "f": "Cálculo propio", "vis": "", "o": [["A", "0,075 m.", "Divide 0,9 entre 12; la longitud horizontal debe ser 12 veces la altura, no la doceava parte.", false], ["B", "7,5 m.", "Interpreta 1:12 como una pendiente del 12 % (0,9 ÷ 0,12); 1:12 equivale a cerca del 8,3 %.", false], ["C", "10,8 m.", "Por cada unidad de altura se necesitan 12 de recorrido horizontal: 0,9 × 12 = 10,8 m.", true], ["D", "13,3 m.", "Invierte la razón: calcula 12 ÷ 0,9 en lugar de 0,9 × 12.", false]]}, {"id": "MTB-112", "niv": 1, "cp": "mt_interpretacion", "cn": "", "e": "¿A qué porcentaje de pendiente equivale aproximadamente la razón 1:12?", "f": "Cálculo propio", "vis": "", "o": [["A", "0,83 %.", "Corresponde a 1 ÷ 120; equivale a 1 cm de subida por cada 120 cm de recorrido.", false], ["B", "1,2 %.", "Toma el 12 de la razón y lo divide entre 10; no corresponde a 1 ÷ 12.", false], ["C", "8,3 %.", "1 ÷ 12 ≈ 0,083, es decir, cerca de 8,3 cm de subida por cada 100 cm de recorrido horizontal.", true], ["D", "12 %.", "Confunde la razón 1:12 con 12 por cada 100.", false]]}]}, {"comp": "matematicas", "sim": "s11-2", "ses": 1, "ind": "Índice de masa corporal", "tt": "", "texto": "En un programa de salud, el índice de masa corporal (IMC) de un adulto se calcula dividiendo su masa, en kilogramos, entre el cuadrado de su estatura, en metros:\n\nIMC = m / h²\n\nLa tabla muestra la clasificación usada en el programa.", "vis": "<table class=\"vt\"><caption>Tabla 1. Clasificación del IMC en adultos<\/caption><thead><tr><th>Clasificación<\/th><th>IMC (kg/m²)<\/th><\/tr><\/thead><tbody><tr><td>Bajo peso<\/td><td>Menor que 18,5<\/td><\/tr><tr><td>Peso adecuado<\/td><td>De 18,5 a 24,9<\/td><\/tr><tr><td>Sobrepeso<\/td><td>De 25,0 a 29,9<\/td><\/tr><tr><td>Obesidad<\/td><td>30,0 o más<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Fuente: rangos de la Organización Mundial de la Salud.<\/div>", "items": [{"id": "MTB-113", "niv": 3, "cp": "mt_formulacion", "cn": "", "e": "Laura mide 1,70 m y tiene una masa de 78 kg, por lo que está en la categoría de sobrepeso. ¿Cuántos kilogramos debe disminuir su masa para que su IMC sea exactamente 25?", "f": "Cálculo propio", "vis": "", "o": [["A", "1,99 kg.", "Es la diferencia entre su IMC actual (≈ 26,99) y 25; son unidades de IMC, no kilogramos.", false], ["B", "5,75 kg.", "Con IMC 25 la masa sería 25 × 1,70² = 25 × 2,89 = 72,25 kg; 78 − 72,25 = 5,75 kg.", true], ["C", "35,5 kg.", "No eleva la estatura al cuadrado: 25 × 1,70 = 42,5 kg y 78 − 42,5 = 35,5.", false], ["D", "72,25 kg.", "Es la masa que tendría con IMC 25, no la cantidad que debe disminuir.", false]]}, {"id": "MTB-114", "niv": 3, "cp": "mt_argumentacion", "cn": "", "e": "Un estudiante afirma: «Si dos adultos tienen la misma masa, el de mayor estatura tiene un IMC mayor». ¿Es correcta la afirmación?", "f": "Cálculo propio", "vis": "", "o": [["A", "No: con 70 kg, quien mide 1,80 m tiene IMC ≈ 21,6 y quien mide 1,60 m, ≈ 27,3.", "70 ÷ 1,80² ≈ 21,6 y 70 ÷ 1,60² ≈ 27,3: con igual masa, a mayor estatura el IMC es menor, porque la estatura está en el denominador.", true], ["B", "No, porque si dos personas tienen igual masa, también tienen igual IMC.", "El IMC también depende de la estatura: IMC = m / h².", false], ["C", "Sí, porque el IMC aumenta cuando aumenta cualquiera de las dos medidas.", "El IMC aumenta con la masa, pero disminuye cuando aumenta la estatura.", false], ["D", "Sí: con 70 kg, 70 × 1,80² ≈ 226,8 es mayor que 70 × 1,60² ≈ 179,2.", "Multiplica por el cuadrado de la estatura en lugar de dividir; la fórmula es m / h².", false]]}, {"id": "MTB-115", "niv": 2, "cp": "mt_interpretacion", "cn": "", "e": "¿Cuál expresión permite calcular la masa m, en kilogramos, de un adulto de estatura h, en metros, cuyo IMC es 22?", "f": "Cálculo propio", "vis": "", "o": [["A", "m = 22/h².", "Divide entre h² en lugar de multiplicar; despeja mal la ecuación.", false], ["B", "m = 22h.", "Omite el cuadrado de la estatura que aparece en la fórmula del IMC.", false], ["C", "m = h²/22.", "Invierte la relación: esta expresión daría h² / m = 22.", false], ["D", "m = 22h².", "Si m / h² = 22, al multiplicar ambos lados por h² se obtiene m = 22h².", true]]}]}, {"comp": "matematicas", "sim": "s11-2", "ses": 1, "ind": "Travesía de una ciclista", "tt": "", "texto": "Una ciclista hace una travesía de 4 horas por una vía rural. Su reloj deportivo registra la distancia total recorrida al final de cada hora. En una de esas horas se detuvo por completo para reparar un pinchazo. La gráfica muestra los registros.", "vis": "<div class=\"vfig\"><svg class=\"vg\" viewBox=\"0 0 560 320\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Gráfica 1. Distancia recorrida por la ciclista\" font-family=\"Arial, sans-serif\" font-size=\"12\"><rect width=\"560\" height=\"320\" fill=\"#ffffff\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"13\" fill=\"#1d2433\">Gráfica 1. Distancia recorrida por la ciclista<\/text><line x1=\"60\" y1=\"258.0\" x2=\"540\" y2=\"258.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"262.0\" text-anchor=\"end\" fill=\"#3a4356\">0<\/text><line x1=\"60\" y1=\"221.0\" x2=\"540\" y2=\"221.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"225.0\" text-anchor=\"end\" fill=\"#3a4356\">10<\/text><line x1=\"60\" y1=\"184.0\" x2=\"540\" y2=\"184.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"188.0\" text-anchor=\"end\" fill=\"#3a4356\">20<\/text><line x1=\"60\" y1=\"147.0\" x2=\"540\" y2=\"147.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"151.0\" text-anchor=\"end\" fill=\"#3a4356\">30<\/text><line x1=\"60\" y1=\"110.0\" x2=\"540\" y2=\"110.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"114.0\" text-anchor=\"end\" fill=\"#3a4356\">40<\/text><line x1=\"60\" y1=\"73.0\" x2=\"540\" y2=\"73.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"77.0\" text-anchor=\"end\" fill=\"#3a4356\">50<\/text><line x1=\"60\" y1=\"36.0\" x2=\"540\" y2=\"36.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"40.0\" text-anchor=\"end\" fill=\"#3a4356\">60<\/text><line x1=\"60\" y1=\"258\" x2=\"540\" y2=\"258\" stroke=\"#3a4356\"/><line x1=\"60\" y1=\"258\" x2=\"60\" y2=\"36\" stroke=\"#3a4356\"/><text transform=\"translate(14,147.0) rotate(-90)\" text-anchor=\"middle\" fill=\"#3a4356\">Distancia recorrida (km)<\/text><text x=\"300.0\" y=\"312\" text-anchor=\"middle\" fill=\"#3a4356\">Tiempo (horas)<\/text><text x=\"108.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">0<\/text><text x=\"204.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">1<\/text><text x=\"300.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">2<\/text><text x=\"396.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">3<\/text><text x=\"492.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">4<\/text><polyline fill=\"none\" stroke=\"#1660a8\" stroke-width=\"2.5\" points=\"108.0,258.0 204.0,169.2 300.0,169.2 396.0,102.6 492.0,58.2\"/><circle cx=\"108.0\" cy=\"258.0\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"108.0\" y=\"250.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">0<\/text><circle cx=\"204.0\" cy=\"169.2\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"204.0\" y=\"161.2\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">24<\/text><circle cx=\"300.0\" cy=\"169.2\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"300.0\" y=\"161.2\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">24<\/text><circle cx=\"396.0\" cy=\"102.6\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"396.0\" y=\"94.6\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">42<\/text><circle cx=\"492.0\" cy=\"58.2\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"492.0\" y=\"50.2\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">54<\/text><\/svg><\/div>", "items": [{"id": "MTB-126", "niv": 1, "cp": "mt_interpretacion", "cn": "", "e": "¿En qué intervalo de tiempo la ciclista no avanzó?", "f": "Cálculo propio", "vis": "", "o": [["A", "Entre la hora 0 y la hora 1.", "En la primera hora la distancia pasó de 0 a 24 km: la ciclista avanzó.", false], ["B", "Entre la hora 1 y la hora 2.", "La distancia se mantuvo en 24 km: el tramo horizontal indica que no avanzó.", true], ["C", "Entre la hora 2 y la hora 3.", "La distancia aumentó de 24 a 42 km; estaba en movimiento.", false], ["D", "Entre la hora 3 y la hora 4.", "La distancia aumentó de 42 a 54 km; estaba en movimiento.", false]]}, {"id": "MTB-127", "niv": 2, "cp": "mt_formulacion", "cn": "", "e": "¿Cuál fue la rapidez media de la ciclista en toda la travesía, incluido el tiempo en que estuvo detenida?", "f": "Cálculo propio", "vis": "", "o": [["A", "13,5 km/h.", "Rapidez media = distancia total ÷ tiempo total = 54 km ÷ 4 h = 13,5 km/h.", true], ["B", "18 km/h.", "Divide 54 km entre 3 h: descuenta la hora detenida, que el enunciado pide incluir.", false], ["C", "21 km/h.", "Promedia la rapidez de la primera hora (24 km/h) y la de la tercera (18 km/h); no usa los totales.", false], ["D", "24 km/h.", "Es la rapidez de la primera hora (24 km en 1 h), no la de toda la travesía.", false]]}, {"id": "MTB-128", "niv": 2, "cp": "mt_argumentacion", "cn": "", "e": "La ciclista afirma que fue más rápida en la primera hora de la travesía que en la última. ¿Tiene razón?", "f": "Cálculo propio", "vis": "", "o": [["A", "No, porque en la última hora recorrió 54 − 24 = 30 km, más que en la primera.", "Resta el registro equivocado: al comienzo de la última hora llevaba 42 km, no 24 km.", false], ["B", "Sí, porque la parada para reparar el pinchazo ocurrió en la última hora.", "La razón es falsa: la parada fue entre las horas 1 y 2; en la última hora avanzó 12 km.", false], ["C", "No, porque al final de la última hora llegó a 54 km, la mayor distancia registrada.", "54 km es la distancia acumulada, no lo recorrido en la última hora (54 − 42 = 12 km).", false], ["D", "Sí, porque en la primera hora recorrió 24 km y en la última, solo 12 km.", "En tiempos iguales (1 h) recorrió el doble al comienzo: 24 km/h frente a 12 km/h.", true]]}]}, {"comp": "matematicas", "sim": "s11-2", "ses": 1, "ind": "Puntajes de dos gimnastas", "tt": "", "texto": "Dos gimnastas de una liga departamental, P y Q, obtuvieron los siguientes puntajes en cinco competencias. El promedio de cada una es 8,3 puntos.", "vis": "<table class=\"vt\"><caption>Tabla 2. Puntajes por competencia<\/caption><thead><tr><th>Gimnasta<\/th><th>1<\/th><th>2<\/th><th>3<\/th><th>4<\/th><th>5<\/th><\/tr><\/thead><tbody><tr><td>P<\/td><td>8,2<\/td><td>8,4<\/td><td>8,3<\/td><td>8,5<\/td><td>8,1<\/td><\/tr><tr><td>Q<\/td><td>9,0<\/td><td>7,6<\/td><td>8,8<\/td><td>7,9<\/td><td>8,2<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Datos ficticios.<\/div>", "items": [{"id": "MTB-129", "niv": 1, "cp": "mt_interpretacion", "cn": "", "e": "¿Cuál afirmación describe correctamente el rango de los puntajes de cada gimnasta?", "f": "Cálculo propio", "vis": "", "o": [["A", "El rango de ambas es 8,3, porque tienen el mismo promedio.", "El rango no depende del promedio; mide la diferencia entre el mayor y el menor dato.", false], ["B", "El rango de P es 1,4 y el de Q es 0,4.", "Intercambia los valores: los puntajes de P están más cerca entre sí que los de Q.", false], ["C", "El rango de Q es 1,4 y el de P es 0,4.", "Rango = máximo − mínimo. Q: 9,0 − 7,6 = 1,4. P: 8,5 − 8,1 = 0,4.", true], ["D", "El rango de Q es 9,0 y el de P es 8,5.", "Confunde el rango con el puntaje máximo de cada gimnasta.", false]]}, {"id": "MTB-130", "niv": 3, "cp": "mt_argumentacion", "cn": "", "e": "El entrenador afirma: «Como las dos gimnastas tienen el mismo promedio, su desempeño ha sido igual de constante». ¿Es correcta la afirmación?", "f": "Cálculo propio", "vis": "", "o": [["A", "Sí, porque las dos suman 41,5 puntos y su promedio es 8,3.", "El promedio indica el valor central, pero no cuánto se alejan los datos de él.", false], ["B", "Sí, porque sus puntajes máximos solo difieren en 0,5 puntos.", "Comparar los máximos (9,0 y 8,5) no mide la dispersión de cada gimnasta.", false], ["C", "No, porque el promedio de Q es 8,5 y el de P es 8,3.", "Suma mal los puntajes de Q: suman 41,5, así que su promedio también es 8,3.", false], ["D", "No: los puntajes de Q se alejan del promedio mucho más que los de P.", "Con el mismo promedio, los datos de Q están mucho más dispersos que los de P: P es más constante.", true]]}, {"id": "MTB-131", "niv": 3, "cp": "mt_formulacion", "cn": "", "e": "¿Qué puntaje debe obtener la gimnasta P en una sexta competencia para que el promedio de sus seis puntajes sea 8,4?", "f": "Cálculo propio", "vis": "", "o": [["A", "8,4.", "Si obtiene 8,4, el promedio de los seis puntajes sería (41,5 + 8,4) ÷ 6 ≈ 8,32, no 8,4.", false], ["B", "8,8.", "Calcula 8,4 × 5 − 41,5 = 0,5 y lo suma a 8,3; usa 5 datos en lugar de 6.", false], ["C", "8,9.", "Los seis puntajes deben sumar 8,4 × 6 = 50,4. Los cinco actuales suman 41,5; faltan 50,4 − 41,5 = 8,9.", true], ["D", "9,0.", "Calcula (8,4 − 8,3) × 6 = 0,6 y lo suma a 8,4; el aumento necesario se suma a 8,3.", false]]}]}, {"comp": "matematicas", "sim": "s11-2", "ses": 1, "ind": "Dosis de un jarabe pediátrico", "tt": "", "texto": "Un pediatra formula a un niño de 18 kg un jarabe con esta indicación: 15 mg del medicamento por cada kilogramo de masa corporal al día, repartidos en 3 tomas iguales. El jarabe contiene 250 mg del medicamento por cada 5 mL.\n\n(Situación ficticia con fines de práctica; no es una recomendación médica.)", "vis": "", "items": [{"id": "MTB-135", "niv": 2, "cp": "mt_formulacion", "cn": "", "e": "¿Cuántos mililitros de jarabe debe tomar el niño en cada toma?", "f": "Cálculo propio", "vis": "", "o": [["A", "0,36 mL.", "Calcula 90 ÷ 250 sin tener en cuenta que los 250 mg están en 5 mL.", false], ["B", "1,8 mL.", "Dosis diaria: 15 × 18 = 270 mg; por toma: 270 ÷ 3 = 90 mg; como hay 50 mg por mL (250 ÷ 5), 90 ÷ 50 = 1,8 mL.", true], ["C", "5,4 mL.", "Es el volumen de la dosis diaria completa (270 mg); falta repartirla en 3 tomas.", false], ["D", "18 mL.", "Divide 90 mg entre 5 mL; la concentración es de 50 mg por cada mL.", false]]}, {"id": "MTB-136", "niv": 1, "cp": "mt_interpretacion", "cn": "", "e": "¿Cuál afirmación describe la relación entre la masa m del niño, en kilogramos, y la dosis diaria D, en miligramos, según la indicación del pediatra?", "f": "Cálculo propio", "vis": "", "o": [["A", "D = 15m; su gráfica es una recta que pasa por el origen.", "La dosis es 15 mg por cada kg: es una proporcionalidad directa, y con m = 0 la dosis es 0.", true], ["B", "D = 15/m; a mayor masa, menor dosis diaria.", "Representa una proporcionalidad inversa; según la indicación, a más masa corresponde más dosis.", false], ["C", "D = m + 15; su gráfica es una recta que corta el eje vertical en 15.", "Suma 15 en lugar de multiplicar por 15; con 18 kg daría solo 33 mg al día.", false], ["D", "D = 5m; porque la dosis diaria se reparte en 3 tomas.", "5m es la dosis de cada toma (15 ÷ 3), no la dosis diaria.", false]]}]}, {"comp": "matematicas", "sim": "s11-2", "ses": 1, "ind": "Enchape del piso de un salón comunal", "tt": "", "texto": "Se va a enchapar el piso de un salón comunal rectangular de 6 m de largo y 4,8 m de ancho con baldosas cuadradas de 30 cm de lado, colocadas sin dejar espacios entre ellas y sin cortar ninguna.", "vis": "", "items": [{"id": "MTB-137", "niv": 1, "cp": "mt_formulacion", "cn": "", "e": "¿Cuántas baldosas se necesitan para cubrir todo el piso?", "f": "Cálculo propio", "vis": "", "o": [["A", "24 baldosas.", "Divide el área (28,8 m²) entre el perímetro de una baldosa (1,2 m); se debe dividir entre su área.", false], ["B", "96 baldosas.", "Divide 28,8 m² entre 0,3 m; falta elevar al cuadrado el lado de la baldosa (0,09 m²).", false], ["C", "320 baldosas.", "En el largo caben 600 ÷ 30 = 20 baldosas y en el ancho 480 ÷ 30 = 16; en total 20 × 16 = 320.", true], ["D", "2.880 baldosas.", "Es el área del salón expresada en decímetros cuadrados (28,8 m² = 2.880 dm²), no el número de baldosas.", false]]}, {"id": "MTB-138", "niv": 2, "cp": "mt_argumentacion", "cn": "", "e": "El maestro de obra afirma que, si usa baldosas cuadradas de 60 cm de lado, necesitará la cuarta parte de las baldosas. ¿Es correcta la afirmación?", "f": "Cálculo propio", "vis": "", "o": [["A", "No, porque el área del salón sigue siendo la misma, 28,8 m².", "El área del salón no cambia, pero cada baldosa cubre más área, así que se necesitan menos.", false], ["B", "No, porque cada baldosa de 60 cm cubre el doble de área, así que se necesita la mitad.", "Al duplicar el lado, el área se multiplica por 4, no por 2.", false], ["C", "Sí, porque cada baldosa tiene el doble de lado y, por eso, el doble de área.", "La conclusión es correcta, pero la razón no: al duplicar el lado, el área se multiplica por 4, no por 2.", false], ["D", "Sí, porque cada baldosa de 60 cm cubre 4 veces el área de una de 30 cm.", "60 × 60 = 3.600 cm² = 4 × 900 cm², y ambas medidas del salón son múltiplos de 60 cm, así que no hay que cortar baldosas.", true]]}, {"id": "MTB-139", "niv": 1, "cp": "mt_interpretacion", "cn": "", "e": "En el plano del salón, dibujado a escala 1:50, ¿cuánto mide el largo del salón?", "f": "Cálculo propio", "vis": "", "o": [["A", "0,12 cm.", "Divide 6 entre 50 sin convertir los metros a centímetros; 0,12 sería el resultado en metros.", false], ["B", "1,2 cm.", "Comete un error al convertir: 6 m son 600 cm, y 600 ÷ 50 = 12.", false], ["C", "12 cm.", "Escala 1:50: cada centímetro del plano representa 50 cm reales; 600 cm ÷ 50 = 12 cm.", true], ["D", "300 cm.", "Multiplica 6 × 50 en lugar de dividir: aplica la escala al revés.", false]]}]}, {"comp": "matematicas", "sim": "s11-2", "ses": 1, "ind": "Torneo intercolegiado de microfútbol", "tt": "", "texto": "En un torneo intercolegiado de microfútbol participan 8 equipos. En la primera fase, cada equipo juega exactamente un partido contra cada uno de los demás. Por cada partido ganado se obtienen 3 puntos; por cada empate, 1 punto, y por cada derrota, 0 puntos. La tabla muestra los resultados de cuatro de los equipos al terminar la primera fase (7 partidos cada uno).", "vis": "<table class=\"vt\"><caption>Tabla 3. Resultados de la primera fase<\/caption><thead><tr><th>Equipo<\/th><th>Ganados<\/th><th>Empatados<\/th><th>Perdidos<\/th><\/tr><\/thead><tbody><tr><td>A<\/td><td>4<\/td><td>2<\/td><td>1<\/td><\/tr><tr><td>B<\/td><td>5<\/td><td>0<\/td><td>2<\/td><\/tr><tr><td>C<\/td><td>3<\/td><td>4<\/td><td>0<\/td><\/tr><tr><td>D<\/td><td>2<\/td><td>5<\/td><td>0<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Datos ficticios.<\/div>", "items": [{"id": "MTB-140", "niv": 2, "cp": "mt_formulacion", "cn": "", "e": "¿Cuántos partidos se juegan en total en la primera fase?", "f": "Cálculo propio", "vis": "", "o": [["A", "16 partidos.", "Multiplica 8 × 2; no cuenta todas las parejas posibles de equipos.", false], ["B", "28 partidos.", "Cada partido es una pareja de equipos sin importar el orden: C(8, 2) = (8 × 7) ÷ 2 = 28.", true], ["C", "56 partidos.", "Calcula 8 × 7 y cuenta cada partido dos veces (A contra B y B contra A).", false], ["D", "64 partidos.", "Calcula 8 × 8: incluye partidos de un equipo contra sí mismo y cuenta dos veces cada partido.", false]]}, {"id": "MTB-141", "niv": 3, "cp": "mt_formulacion", "cn": "", "e": "Para la segunda fase, los 8 equipos se reparten al azar en dos grupos de 4. Dos de los equipos pertenecen al mismo colegio. ¿Cuál es la probabilidad de que esos dos equipos queden en el mismo grupo?", "f": "Cálculo propio", "vis": "", "o": [["A", "1/4.", "Supone que hay 4 posiciones equiprobables, pero el segundo equipo puede ocupar cualquiera de 7 lugares.", false], ["B", "3/7.", "Una vez ubicado el primer equipo, quedan 7 lugares para el segundo y 3 de ellos están en su mismo grupo: 3/7.", true], ["C", "1/2.", "Supone que, como hay dos grupos, ambos casos son igualmente probables; pero quedan 3 lugares en un grupo y 4 en el otro.", false], ["D", "4/7.", "Es la probabilidad de que los dos equipos queden en grupos diferentes.", false]]}, {"id": "MTB-142", "niv": 1, "cp": "mt_interpretacion", "cn": "", "e": "Según la tabla, ¿cuál de estos cuatro equipos obtuvo más puntos en la primera fase?", "f": "Cálculo propio", "vis": "", "o": [["A", "El equipo A.", "A obtuvo 4 × 3 + 2 × 1 = 14 puntos, uno menos que B.", false], ["B", "El equipo B.", "B obtuvo 5 × 3 + 0 = 15 puntos; A tiene 14, C 13 y D 11.", true], ["C", "El equipo C.", "C no perdió ningún partido, pero sus 4 empates solo suman 4 puntos: 3 × 3 + 4 = 13.", false], ["D", "El equipo D.", "D tampoco perdió, pero con 5 empates obtuvo 2 × 3 + 5 = 11 puntos.", false]]}]}, {"comp": "matematicas", "sim": "s11-2", "ses": 1, "ind": "Temperatura y altitud", "tt": "", "texto": "En una región montañosa, la temperatura media del aire disminuye 0,6 °C por cada 100 m de aumento en la altitud. La tabla muestra algunos registros de temperatura media en lugares de esa región.", "vis": "<table class=\"vt\"><caption>Tabla 4. Temperatura media según la altitud<\/caption><thead><tr><th>Altitud (m)<\/th><th>Temperatura media (°C)<\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td>28<\/td><\/tr><tr><td>1.000<\/td><td>22<\/td><\/tr><tr><td>1.500<\/td><td>19<\/td><\/tr><tr><td>2.500<\/td><td>13<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Datos ficticios.<\/div>", "items": [{"id": "MTB-143", "niv": 2, "cp": "mt_interpretacion", "cn": "", "e": "¿Cuál expresión representa la temperatura media T, en °C, en función de la altitud h, en metros?", "f": "Cálculo propio", "vis": "", "o": [["A", "T = 28 − 0,006h.", "Baja 0,6 °C por cada 100 m, es decir, 0,006 °C por metro, a partir de 28 °C a 0 m. Con h = 1.000 da 22 °C.", true], ["B", "T = 28 − 6h.", "Usa 6 °C por metro; con h = 1.000 daría −5.972 °C, en contradicción con la tabla.", false], ["C", "T = 0,006h + 28.", "Hace que la temperatura aumente con la altitud, contrario a lo que muestra la tabla.", false], ["D", "T = 22 − 0,006h.", "Usa como valor inicial la temperatura a 1.000 m; con h = 0 daría 22 °C y no 28 °C.", false]]}, {"id": "MTB-144", "niv": 3, "cp": "mt_formulacion", "cn": "", "e": "Según este modelo, ¿a qué altitud la temperatura media sería de 7 °C?", "f": "Cálculo propio", "vis": "", "o": [["A", "1.167 m.", "Divide 7 entre 0,006; la temperatura debe bajar 28 − 7 = 21 °C.", false], ["B", "3.500 m.", "Debe bajar 28 − 7 = 21 °C; a 0,006 °C por metro: 21 ÷ 0,006 = 3.500 m.", true], ["C", "4.667 m.", "Divide 28 entre 0,006: esa es la altitud a la que la temperatura sería 0 °C.", false], ["D", "5.833 m.", "Suma 28 + 7 en lugar de restar y divide 35 entre 0,006.", false]]}]}, {"comp": "matematicas", "sim": "s11-2", "ses": 1, "ind": "Señal de tránsito de PARE", "tt": "", "texto": "Las señales de tránsito de PARE tienen forma de octágono regular, es decir, de un polígono de 8 lados iguales y 8 ángulos interiores iguales, como muestra la figura.", "vis": "<div class=\"vfig\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 220 220\" width=\"220\" height=\"220\" font-family=\"Arial, sans-serif\" font-size=\"16\"><rect width=\"220\" height=\"220\" fill=\"#ffffff\"/><polygon points=\"68.58,10 151.42,10 210,68.58 210,151.42 151.42,210 68.58,210 10,151.42 10,68.58\" fill=\"#f4d6d6\" stroke=\"#1d2433\" stroke-width=\"3\"/><text x=\"110\" y=\"117\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#1d2433\">PARE<\/text><\/svg><\/div>", "items": [{"id": "MTB-148", "niv": 2, "cp": "mt_formulacion", "cn": "", "e": "¿Cuánto mide cada ángulo interior de la señal?", "f": "Cálculo propio", "vis": "", "o": [["A", "45°.", "Es el ángulo exterior (360° ÷ 8), o el ángulo central; el interior es su suplemento.", false], ["B", "120°.", "Es el ángulo interior de un hexágono regular, no de un octágono.", false], ["C", "135°.", "La suma de los ángulos interiores es (8 − 2) × 180° = 1.080°; cada uno mide 1.080° ÷ 8 = 135°.", true], ["D", "1.080°.", "Es la suma de los 8 ángulos interiores, no la medida de uno de ellos.", false]]}, {"id": "MTB-149", "niv": 2, "cp": "mt_interpretacion", "cn": "", "e": "Si se trazan segmentos desde el centro de la señal hasta cada uno de sus vértices, ¿qué figuras se obtienen?", "f": "Cálculo propio", "vis": "", "o": [["A", "8 triángulos equiláteros, cada uno con tres ángulos de 60°.", "Eso ocurre en el hexágono regular; en el octágono el ángulo central es 45°, no 60°.", false], ["B", "8 triángulos isósceles congruentes, cada uno con un ángulo de 135° en el centro.", "135° es el ángulo interior del octágono, no el ángulo central.", false], ["C", "6 triángulos congruentes, cada uno con un ángulo de 60° en el centro.", "Se forman tantos triángulos como lados tiene el polígono: 8, no 6.", false], ["D", "8 triángulos isósceles congruentes, cada uno con un ángulo de 45° en el centro.", "Cada triángulo tiene dos lados iguales (los radios) y el ángulo central es 360° ÷ 8 = 45°.", true]]}]}, {"comp": "matematicas", "sim": "s11-2", "ses": 1, "ind": "Entrenamiento y salto largo", "tt": "", "texto": "Un preparador físico registró, para 8 atletas juveniles, las horas semanales de entrenamiento y la mejor marca de cada uno en la prueba de salto largo. La gráfica muestra los datos.", "vis": "<div class=\"vfig\"><svg class=\"vg\" viewBox=\"0 0 560 320\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Gráfica 2. Horas de entrenamiento y marca en salto largo\" font-family=\"Arial, sans-serif\" font-size=\"12\"><rect width=\"560\" height=\"320\" fill=\"#ffffff\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"13\" fill=\"#1d2433\">Gráfica 2. Horas de entrenamiento y marca en salto largo<\/text><line x1=\"60\" y1=\"258.0\" x2=\"540\" y2=\"258.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"262.0\" text-anchor=\"end\" fill=\"#3a4356\">0<\/text><line x1=\"60\" y1=\"221.0\" x2=\"540\" y2=\"221.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"225.0\" text-anchor=\"end\" fill=\"#3a4356\">100<\/text><line x1=\"60\" y1=\"184.0\" x2=\"540\" y2=\"184.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"188.0\" text-anchor=\"end\" fill=\"#3a4356\">200<\/text><line x1=\"60\" y1=\"147.0\" x2=\"540\" y2=\"147.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"151.0\" text-anchor=\"end\" fill=\"#3a4356\">300<\/text><line x1=\"60\" y1=\"110.0\" x2=\"540\" y2=\"110.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"114.0\" text-anchor=\"end\" fill=\"#3a4356\">400<\/text><line x1=\"60\" y1=\"73.0\" x2=\"540\" y2=\"73.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"77.0\" text-anchor=\"end\" fill=\"#3a4356\">500<\/text><line x1=\"60\" y1=\"36.0\" x2=\"540\" y2=\"36.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"40.0\" text-anchor=\"end\" fill=\"#3a4356\">600<\/text><line x1=\"60\" y1=\"258\" x2=\"540\" y2=\"258\" stroke=\"#3a4356\"/><line x1=\"60\" y1=\"258\" x2=\"60\" y2=\"36\" stroke=\"#3a4356\"/><text transform=\"translate(14,147.0) rotate(-90)\" text-anchor=\"middle\" fill=\"#3a4356\">Mejor marca (cm)<\/text><text x=\"300.0\" y=\"312\" text-anchor=\"middle\" fill=\"#3a4356\">Horas de entrenamiento por semana<\/text><text x=\"60.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">0<\/text><text x=\"140.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">2<\/text><text x=\"220.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">4<\/text><text x=\"300.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">6<\/text><text x=\"380.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">8<\/text><text x=\"460.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">10<\/text><text x=\"540.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">12<\/text><circle cx=\"220.0\" cy=\"106.3\" r=\"4\" fill=\"#1660a8\"/><circle cx=\"260.0\" cy=\"98.9\" r=\"4\" fill=\"#1660a8\"/><circle cx=\"300.0\" cy=\"93.3\" r=\"4\" fill=\"#1660a8\"/><circle cx=\"340.0\" cy=\"84.1\" r=\"4\" fill=\"#1660a8\"/><circle cx=\"380.0\" cy=\"80.4\" r=\"4\" fill=\"#1660a8\"/><circle cx=\"420.0\" cy=\"71.2\" r=\"4\" fill=\"#1660a8\"/><circle cx=\"460.0\" cy=\"67.4\" r=\"4\" fill=\"#1660a8\"/><circle cx=\"540.0\" cy=\"58.2\" r=\"4\" fill=\"#1660a8\"/><\/svg><\/div>", "items": [{"id": "MTB-150", "niv": 2, "cp": "mt_interpretacion", "cn": "", "e": "¿Cuál afirmación describe correctamente la relación que muestran los datos?", "f": "Cálculo propio", "vis": "", "o": [["A", "Hay una correlación positiva: los atletas que entrenan más horas tienden a tener mejores marcas.", "Los puntos siguen una tendencia creciente: al aumentar las horas de entrenamiento aumenta la marca.", true], ["B", "Los datos prueban que entrenar 12 horas semanales garantiza saltar más de 5 metros.", "Una correlación en 8 atletas no prueba causalidad ni garantiza resultados para otras personas.", false], ["C", "No hay relación entre las variables, porque cada atleta tiene una marca diferente.", "Que los valores sean distintos no impide que sigan una tendencia; los puntos se alinean de forma creciente.", false], ["D", "Hay una correlación negativa entre las horas de entrenamiento y la marca obtenida.", "En una correlación negativa una variable disminuye cuando la otra aumenta; aquí ambas aumentan juntas.", false]]}]}, {"comp": "matematicas", "sim": "s11-2", "ses": 1, "ind": "Tablón para subir materiales", "tt": "", "texto": "En la misma obra, para subir carretillas a una plataforma de 1,5 m de altura, el maestro apoya un tablón recto desde el piso hasta el borde de la plataforma. El extremo inferior del tablón queda a 3,6 m, medidos horizontalmente, de la base de la plataforma.", "vis": "", "items": [{"id": "MTB-111", "niv": 3, "cp": "mt_formulacion", "cn": "", "e": "¿Cuál es la longitud del tablón entre el piso y el borde de la plataforma?", "f": "Cálculo propio", "vis": "", "o": [["A", "3,27 m.", "Resta los cuadrados (3,6² − 1,5²); el tablón es la hipotenusa, así que los cuadrados se suman.", false], ["B", "3,9 m.", "Por el teorema de Pitágoras: √(1,5² + 3,6²) = √(2,25 + 12,96) = √15,21 = 3,9 m.", true], ["C", "5,1 m.", "Suma las longitudes de los catetos (1,5 + 3,6); eso no es la longitud de la hipotenusa.", false], ["D", "15,21 m.", "Es la suma de los cuadrados de los catetos; falta sacar la raíz cuadrada.", false]]}]}, {"comp": "lectura_critica", "sim": "s11-2", "ses": 1, "ind": "Cuento fantástico: los libros que adelgazan", "tt": "Texto literario", "texto": "LOS LIBROS QUE ADELGAZAN\n\n(1) Cuando la bibliotecaria Rosalba Quintero cumplió treinta años en el oficio, notó que los libros de la Biblioteca Municipal de San Telmo estaban adelgazando. No era una impresión: la edición del Quijote que en 1990 pesaba casi un kilo cabía ahora en el bolsillo de un delantal.\n\n(2) Al principio culpó a la humedad, después a los ratones, al final a sí misma. Pero una tarde de lluvia, mientras sellaba devoluciones, vio cómo un tomo de poemas que un joven acababa de entregar —sin abrirlo siquiera, porque las páginas seguían pegadas por el borde— soltaba una hoja que se deshacía en el aire como ceniza tibia.\n\n(3) Desde entonces Rosalba llevó un cuaderno. Anotó títulos, fechas y lectores. Descubrió que los libros no perdían páginas por el tiempo, sino por el abandono: cada vez que alguien se llevaba uno a casa y lo devolvía sin leerlo, el libro olvidaba una parte de sí. Los diccionarios, que todo el mundo consultaba a pedazos, estaban gordísimos; las novelas largas que se prestaban por obligación escolar parecían folletos.\n\n(4) No se lo contó a nadie. ¿Quién le iba a creer? En cambio, empezó a hacer trampas pequeñas. A los estudiantes que devolvían un libro les preguntaba, antes de recibirlo, qué les había gustado de la primera página. A los señores que se llevaban periódicos viejos para envolver loza les ofrecía, a cambio, leerles en voz alta un cuento corto. Algunos se reían de ella; otros se quedaban.\n\n(5) Un sábado llegó una niña con una caja de zapatos. Dentro venía un libro diminuto, del tamaño de una estampilla.\n—Era de mi abuelo —dijo—. Dice mi mamá que era un libro de aventuras, pero ya nadie se acuerda de cuál.\nRosalba lo tomó con dos dedos. Tenía una sola página, y en ella una sola frase: «Y entonces el barco volvió a puerto».\n\n(6) Esa noche la bibliotecaria no durmió. Al día siguiente se sentó con la niña y le leyó la frase cien veces, preguntándole qué barco sería ese, de dónde vendría, qué habría pasado antes. La niña inventó tormentas, un loro tuerto y un capitán con miedo al agua. Al cerrar la biblioteca, el libro ya no cabía en la caja de zapatos.\n\n(7) Rosalba nunca supo si había recuperado el libro del abuelo o si había nacido otro. Tampoco le importó. Anotó en su cuaderno: «Los libros no guardan lo que dicen; guardan lo que se les dice».\n\nCuento original escrito para este simulacro.", "vis": "", "items": [{"id": "LCB-101", "niv": 1, "cp": "lc_local", "cn": "", "e": "Según el párrafo 3, los libros de la biblioteca perdían páginas cuando", "f": "Párrafo 3", "vis": "", "o": [["A", "alguien se los llevaba a casa y los devolvía sin haberlos leído.", "El párrafo 3 lo dice explícitamente: «cada vez que alguien se llevaba uno a casa y lo devolvía sin leerlo, el libro olvidaba una parte de sí».", true], ["B", "se consultaban a pedazos, como sucedía con los diccionarios de la biblioteca.", "Es lo contrario: los diccionarios, consultados a pedazos, «estaban gordísimos», es decir, no perdían páginas.", false], ["C", "se mojaban con la humedad o los roían los ratones de la biblioteca.", "Esas eran las primeras sospechas de Rosalba (párrafo 2), que luego su cuaderno desmiente.", false], ["D", "envejecían, porque el papel se deshace con el paso de los años.", "El párrafo 3 descarta esa causa: los libros «no perdían páginas por el tiempo, sino por el abandono».", false]]}, {"id": "LCB-102", "niv": 1, "cp": "lc_local", "cn": "", "e": "¿Quién lleva el libro diminuto a la biblioteca en el párrafo 5?", "f": "Párrafo 5", "vis": "", "o": [["A", "El joven que antes había devuelto un libro de poemas.", "Ese joven aparece en el párrafo 2, con otro libro; no tiene relación con el libro diminuto.", false], ["B", "El abuelo que había leído el libro de joven.", "El abuelo es el antiguo dueño del libro, pero no aparece en la biblioteca; quien llega es su nieta.", false], ["C", "La madre de una niña que conocía el libro.", "La madre solo se menciona en lo que cuenta la niña («Dice mi mamá…»); no va a la biblioteca.", false], ["D", "Una niña, nieta del antiguo dueño del libro.", "El párrafo 5 dice que «llegó una niña con una caja de zapatos» y que el libro «era de mi abuelo».", true]]}, {"id": "LCB-103", "niv": 1, "cp": "lc_global", "cn": "", "e": "¿Qué función cumple el párrafo 2 en el desarrollo del cuento?", "f": "Párrafos 2 y 3", "vis": "", "o": [["A", "Narra el momento en que Rosalba ve a un libro perder una hoja, lo que la lleva a investigar.", "En el párrafo 2 Rosalba presencia cómo se deshace una hoja de un libro recién devuelto; el párrafo 3 empieza «Desde entonces Rosalba llevó un cuaderno», es decir, ese hecho desencadena su investigación.", true], ["B", "Cierra la historia con la reflexión que Rosalba escribe en su cuaderno.", "La reflexión final del cuaderno está en el párrafo 7; el párrafo 2 está al comienzo del relato.", false], ["C", "Presenta al joven lector que, más adelante en el cuento, ayudará a Rosalba a resolver el misterio de los libros.", "El joven no vuelve a aparecer en el cuento ni ayuda a Rosalba.", false], ["D", "Explica la causa por la cual los libros de la biblioteca adelgazan.", "La causa (el abandono, devolver sin leer) se explica en el párrafo 3, no en el 2.", false]]}, {"id": "LCB-104", "niv": 2, "cp": "lc_global", "cn": "", "e": "La frase que Rosalba anota al final, «Los libros no guardan lo que dicen; guardan lo que se les dice», se relaciona con lo ocurrido en el párrafo 6 porque", "f": "Párrafos 6 y 7", "vis": "", "o": [["A", "el libro recuperó su tamaño original en el momento en que la niña lo devolvió a la biblioteca de San Telmo.", "El libro no crece por ser devuelto, sino durante la conversación; además, devolver sin leer era lo que hacía adelgazar los libros.", false], ["B", "la niña recordó la historia exacta que su abuelo había leído en ese libro.", "La niña no recuerda nada: «inventó» la historia, y el párrafo 7 dice que Rosalba nunca supo si recuperó el libro original.", false], ["C", "Rosalba memorizó la única frase que quedaba en el libro del abuelo.", "Rosalba lee la frase muchas veces, pero el libro no crece por memorizarla sino por las historias que inventa la niña.", false], ["D", "el libro creció mientras la niña imaginaba y contaba lo que pudo pasar antes de esa frase.", "En el párrafo 6 la niña «inventó tormentas, un loro tuerto y un capitán…» y el libro «ya no cabía en la caja»: crece con lo que se le dice, no con lo que ya tenía escrito.", true]]}, {"id": "LCB-105", "niv": 2, "cp": "lc_reflexion", "cn": "", "e": "¿Cuál de los siguientes enunciados expresa mejor una idea sobre la lectura que sugiere el cuento?", "f": "Interpretación global del cuento", "vis": "", "o": [["A", "Cada texto guarda un significado que el lector debe descubrir sin añadirle nada propio.", "El cierre («guardan lo que se les dice») y la historia inventada por la niña contradicen esa idea: el libro crece con lo que el lector le aporta.", false], ["B", "Los libros conservan mejor su contenido cuando se leen en silencio y a solas.", "El cuento muestra lo contrario: el libro del abuelo crece cuando Rosalba lo lee en voz alta y conversa sobre él con la niña (párrafo 6).", false], ["C", "La lectura por obligación escolar mantiene los libros más completos que la lectura libre.", "Las novelas prestadas «por obligación escolar parecían folletos» (párrafo 3): esa lectura no los mantenía vivos.", false], ["D", "Leer es una actividad en la que el lector participa en dar vida al texto.", "Los libros adelgazan cuando nadie los lee y crecen cuando alguien los lee, conversa e imagina con ellos (párrafos 4 y 6); el lector participa en la existencia del texto.", true]]}]}, {"comp": "lectura_critica", "sim": "s11-2", "ses": 1, "ind": "Teatro: el retrato por encargo", "tt": "Texto literario", "texto": "EL RETRATO (fragmento)\n\nPersonajes: LUCÍA, pintora; TOMÁS, su hijo de diecisiete años; DON EFRAÍN, comerciante.\n\n(Un taller pequeño. Lienzos apoyados contra la pared. LUCÍA limpia pinceles. Entra DON EFRAÍN con un paquete bajo el brazo; TOMÁS lo sigue).\n\nDON EFRAÍN: Señora Lucía, vengo por lo del retrato de mi madre. Le traje la foto. (Desenvuelve el paquete). Es de hace dos años, cuando ya estaba enferma.\nLUCÍA: (Mira la foto largo rato). Tiene unos ojos muy despiertos para estar enferma.\nDON EFRAÍN: Por eso vengo donde usted. Pero quiero pedirle algo: quítele las arrugas. Píntela como era a los cuarenta, con el pelo negro. Así la quiero recordar.\nLUCÍA: Yo no la conocí a los cuarenta, don Efraín.\nDON EFRAÍN: Invente. Para eso es artista, ¿no? Le pago el doble.\n(TOMÁS, detrás del comerciante, le hace a su madre señas desesperadas: señala la nevera vacía, se frota los dedos).\nLUCÍA: Si le quito las arrugas, le quito también estas dos rayitas junto a la boca. Son de reírse. Su mamá se reía mucho, ¿verdad?\nDON EFRAÍN: (Pausa). Se reía de todo. Hasta de los médicos.\nLUCÍA: Entonces no me pida que la pinte como alguien que no se reía.\nTOMÁS: Mamá, el señor sabe lo que quiere. Además, nadie va a notar la diferencia.\nLUCÍA: El señor lo va a notar, Tomás. Cada vez que mire el cuadro.\nDON EFRAÍN: (Seco). Yo vine a comprar un cuadro, no un sermón.\nLUCÍA: Y yo le voy a vender un cuadro. Pero uno donde su mamá se parezca a su mamá.\n(Silencio. DON EFRAÍN recoge la foto, duda, la vuelve a dejar sobre la mesa).\nDON EFRAÍN: Haga lo que le parezca. Pero si no me gusta, no lo pago.\n(Sale. TOMÁS se deja caer en una silla).\nTOMÁS: Acabas de regalar la mitad del arriendo.\nLUCÍA: (Toma la foto y la pone junto al caballete). No, mijo. Acabo de ganarme el derecho a firmar el cuadro.\n\nFragmento teatral original escrito para este simulacro.", "vis": "", "items": [{"id": "LCB-106", "niv": 1, "cp": "lc_local", "cn": "", "e": "Según el diálogo, don Efraín quiere que el retrato muestre a su madre", "f": "Parlamentos de don Efraín", "vis": "", "o": [["A", "como era a los cuarenta años, sin arrugas y con el pelo negro.", "Don Efraín lo pide de forma explícita: «quítele las arrugas. Píntela como era a los cuarenta, con el pelo negro».", true], ["B", "tal como aparece en la foto que tomaron hace dos años.", "La foto es de cuando ya estaba enferma; él pide justamente que la pintora cambie esa imagen.", false], ["C", "enferma, pero con los ojos despiertos que se ven en la foto.", "Los «ojos despiertos» son una observación de Lucía; don Efraín quiere borrar las huellas de la edad.", false], ["D", "riéndose de todo, como solía hacerlo cuando estaba sana.", "Es Lucía quien recuerda la risa de la madre a partir de las arrugas; don Efraín no pide eso.", false]]}, {"id": "LCB-107", "niv": 2, "cp": "lc_global", "cn": "", "e": "Por lo que ocurre en la escena, las señas de Tomás (señalar la nevera vacía y frotarse los dedos) buscan que su madre", "f": "Acotaciones y parlamentos de Tomás", "vis": "", "o": [["A", "le ofrezca al visitante algo de beber mientras conversan sobre el encargo.", "Se queda en el objeto (la nevera) y no considera que está vacía ni que Tomás después presiona para aceptar.", false], ["B", "le pida al comerciante una foto más reciente y más clara de su madre.", "Nada en las señas ni en los parlamentos de Tomás se refiere a la foto.", false], ["C", "acepte la petición del comerciante, porque en la casa hace falta dinero.", "La nevera vacía y el gesto de frotar los dedos aluden a la necesidad de dinero, y luego Tomás lo confirma: «el señor sabe lo que quiere» y «Acabas de regalar la mitad del arriendo».", true], ["D", "rechace el encargo, porque el comerciante quiere pagar muy poco por él.", "Don Efraín ofrece «el doble»; Tomás quiere que su madre acepte, no que rechace.", false]]}, {"id": "LCB-108", "niv": 2, "cp": "lc_global", "cn": "", "e": "¿Qué cambio se produce en la actitud de don Efraín a lo largo del fragmento?", "f": "Desarrollo de la escena", "vis": "", "o": [["A", "Pasa de dudar si encargar el cuadro a ofrecer el doble del precio para que se lo hagan rápido.", "Invierte el orden: la oferta del doble aparece al comienzo y la duda (recoger y dejar la foto) al final; tampoco habla de rapidez.", false], ["B", "Pasa de tratar a Lucía con frialdad a disculparse con ella por haberla ofendido.", "Don Efraín no se disculpa; al final sigue seco y pone una condición: «si no me gusta, no lo pago».", false], ["C", "Pasa de imponer cómo quiere el cuadro a dejar que la pintora decida, con una condición.", "Al comienzo pide quitar arrugas; al final dice «Haga lo que le parezca. Pero si no me gusta, no lo pago», y deja la foto sobre la mesa.", true], ["D", "Pasa de admirar el trabajo de Lucía a despreciarlo abiertamente, y por eso se lleva la foto de su madre al salir.", "Aunque se muestra seco, al final deja la foto sobre la mesa y mantiene el encargo.", false]]}, {"id": "LCB-109", "niv": 3, "cp": "lc_reflexion", "cn": "", "e": "La última frase de Lucía, «Acabo de ganarme el derecho a firmar el cuadro», sugiere que para ella firmar una obra significa", "f": "Último parlamento de Lucía", "vis": "", "o": [["A", "demostrar que el cuadro ya es de ella porque el comprador tal vez no lo pague.", "Confunde firma con propiedad; Lucía habla de un «derecho» ganado por su decisión, no de quedarse con la obra.", false], ["B", "aceptar que es el cliente quien decide si una obra merece llevar la firma del autor.", "Lucía hace lo contrario: no deja que el cliente imponga cómo debe ser la obra.", false], ["C", "aumentar el precio del cuadro para poder pagar la mitad del arriendo que se perdió.", "Lucía responde precisamente a la queja de Tomás sobre el dinero diciendo «No, mijo»: su razón no es económica.", false], ["D", "responder por la honestidad de lo que se pinta, y no solo haberlo pintado.", "Lucía se niega a falsear el rostro de la madre y dice que así «se ganó» el derecho a firmar: la firma compromete su honestidad como artista, más allá de la autoría material.", true]]}, {"id": "LCB-110", "niv": 2, "cp": "lc_reflexion", "cn": "", "e": "Un crítico ficticio afirma: «El retrato por encargo es un servicio: el artista debe entregar exactamente lo que el cliente pide». ¿Qué relación tiene esta afirmación con la postura de Lucía?", "f": "Relación del texto con un enunciado externo", "vis": "", "o": [["A", "La confirma, porque Lucía pide al cliente que le traiga la foto de su madre.", "Es don Efraín quien trae la foto por iniciativa propia; además, eso no muestra obediencia a lo que él pide.", false], ["B", "La contradice, porque Lucía acepta el encargo, pero no falsea a la retratada.", "Lucía sí vende el cuadro («le voy a vender un cuadro»), pero rehúsa pintar a la madre «como alguien que no se reía»: no entrega exactamente lo que el cliente pide.", true], ["C", "La contradice, porque Lucía se niega a vender cuadros hechos por encargo.", "Lucía no rechaza el encargo; solo rechaza la condición de rejuvenecer a la retratada.", false], ["D", "La confirma, porque Lucía termina aceptando el encargo de don Efraín.", "Aceptar el encargo no es lo mismo que entregar lo que el cliente pide; Lucía no lo hace.", false]]}]}, {"comp": "lectura_critica", "sim": "s11-2", "ses": 1, "ind": "Ensayo de estética: el juicio de gusto", "tt": "Texto filosófico", "texto": "¿ES LA BELLEZA CUESTIÓN DE GUSTO?\n\n(1) Solemos cerrar las discusiones sobre arte con una frase: «Eso es cuestión de gustos». Con ella queremos decir que no hay nada que discutir, que la belleza depende de cada quien, como depende de cada quien preferir el mango al banano. Sin embargo, basta observar cómo hablamos para sospechar que no creemos del todo en esa frase.\n\n(2) Cuando digo «me gusta el mango», no espero que nadie me dé la razón; si a mi vecino no le gusta, no pienso que esté equivocado. Pero cuando salgo de un concierto y digo «esa interpretación fue bellísima», hablo como si describiera algo que los demás también deberían reconocer. Si alguien responde que fue un ruido insoportable, no me limito a encogerme de hombros: intento convencerlo, le pido que escuche otra vez el segundo movimiento, le señalo un detalle que se le escapó.\n\n(3) El filósofo alemán Immanuel Kant dedicó buena parte de su reflexión sobre el arte a esta rareza. Según él, el juicio sobre lo bello se apoya en un sentimiento de placer y, en ese sentido, es subjetivo: no hay una regla ni una fórmula que demuestre que una obra es bella, como se demuestra un teorema. Y, sin embargo, quien juzga que algo es bello reclama el acuerdo de todos; habla, según Kant, como si la belleza fuera una propiedad de la cosa.\n\n(4) ¿Cómo puede un placer personal aspirar a valer para todos? Kant propuso que el placer de lo bello es «desinteresado»: no depende de que deseemos poseer el objeto ni de que nos sea útil. El mango me gusta porque tengo hambre o porque se me antoja; la pintura me parece bella aunque no pueda llevármela a casa y aunque no me sirva para nada. Al no estar atado a mis deseos particulares, ese placer puede pensarse como uno que cualquier otra persona, puesta ante la misma obra, podría compartir.\n\n(5) Esta idea no resuelve todas las disputas. Las personas siguen discrepando sobre canciones, películas y edificios, y ninguna votación decidirá quién tiene razón. Pero sí explica por qué discutimos: no lo haríamos si de verdad creyéramos que todo es cuestión de gustos. Discutir sobre arte es, en el fondo, una forma de confiar en que los demás pueden llegar a ver lo que vemos.\n\nEnsayo original escrito para este simulacro; expone con palabras propias ideas de la Crítica del juicio (1790) de Kant.", "vis": "", "items": [{"id": "LCB-111", "niv": 1, "cp": "lc_local", "cn": "", "e": "Según el párrafo 4, el placer que produce lo bello es «desinteresado» porque", "f": "Párrafo 4", "vis": "", "o": [["A", "no depende del deseo de poseer el objeto ni de su utilidad.", "El párrafo 4 lo define así: «no depende de que deseemos poseer el objeto ni de que nos sea útil».", true], ["B", "es exactamente igual en todas las personas que observan la misma obra.", "Generaliza en exceso: el texto dice que «podría» compartirse, no que sea idéntico en todos; además, admite que la gente discrepa (párrafo 5).", false], ["C", "no produce ninguna emoción ni sentimiento en quien contempla la obra.", "El texto dice que el juicio sobre lo bello «se apoya en un sentimiento de placer» (párrafo 3); desinteresado no significa sin emoción.", false], ["D", "lo experimentan solo las personas que no tienen intereses económicos.", "Confunde el sentido filosófico de «desinteresado» con la falta de interés económico de las personas.", false]]}, {"id": "LCB-112", "niv": 2, "cp": "lc_global", "cn": "", "e": "En el texto, el ejemplo del mango (párrafos 1, 2 y 4) sirve para", "f": "Párrafos 1, 2 y 4", "vis": "", "o": [["A", "contrastar las preferencias personales, que no reclaman acuerdo, con el juicio sobre lo bello.", "El autor opone «me gusta el mango», donde no espera que le den la razón, a «esa interpretación fue bellísima», donde habla como si los demás debieran reconocerlo.", true], ["B", "ilustrar que la utilidad de un objeto es lo que lo vuelve bello.", "El párrafo 4 dice lo contrario: lo bello agrada «aunque no me sirva para nada».", false], ["C", "probar que los alimentos también pueden ser juzgados como bellos.", "El texto no afirma eso; el mango es ejemplo de lo agradable, que se opone a lo bello.", false], ["D", "mostrar que la belleza, igual que la preferencia por una fruta u otra, es solo una cuestión de gustos personales.", "Esa es la frase que el autor cuestiona desde el párrafo 1; el ejemplo sirve para marcar la diferencia, no la semejanza.", false]]}, {"id": "LCB-113", "niv": 2, "cp": "lc_global", "cn": "", "e": "¿Cuál es la tesis que defiende el autor del texto?", "f": "Estructura global del ensayo", "vis": "", "o": [["A", "La belleza es una propiedad objetiva de las cosas, de modo que puede demostrarse con reglas precisas, como se demuestra un teorema.", "El párrafo 3 niega que exista «una regla ni una fórmula» que demuestre la belleza.", false], ["B", "El juicio de belleza nace de un sentimiento, pero reclama el acuerdo de otros; por eso tiene sentido discutir sobre arte.", "El texto avanza desde la sospecha del párrafo 1 hasta la conclusión del 5: el juicio de belleza es subjetivo pero reclama acuerdo, y eso explica por qué discutimos.", true], ["C", "Todo es cuestión de gustos, de modo que discutir sobre arte es inútil.", "Es justamente la creencia que el autor pone en duda en todo el texto.", false], ["D", "Las disputas sobre arte deben resolverse por votación entre las personas.", "El párrafo 5 afirma que «ninguna votación decidirá quién tiene razón».", false]]}, {"id": "LCB-114", "niv": 3, "cp": "lc_global", "cn": "", "e": "¿Qué relación hay entre los párrafos 3 y 4?", "f": "Párrafos 3 y 4", "vis": "", "o": [["A", "El párrafo 3 da un ejemplo concreto y el párrafo 4 saca de él una conclusión general.", "El párrafo 3 no presenta un ejemplo sino una idea general; los ejemplos concretos (mango, pintura) aparecen en el 4.", false], ["B", "El párrafo 4 refuta la idea de Kant que se expone en el párrafo 3.", "Ambos párrafos exponen ideas de Kant; el 4 desarrolla el 3, no lo refuta.", false], ["C", "El párrafo 4 repite con otras palabras lo que ya se había dicho en el párrafo 3, sin añadir información nueva.", "El párrafo 4 añade un concepto nuevo, el placer «desinteresado», que no aparece en el 3.", false], ["D", "El 3 plantea una tensión del juicio de belleza y el 4 presenta la explicación que propuso Kant.", "El párrafo 4 abre con la pregunta «¿Cómo puede un placer personal aspirar a valer para todos?», que recoge la tensión del 3, y responde con la idea del placer desinteresado.", true]]}, {"id": "LCB-115", "niv": 3, "cp": "lc_reflexion", "cn": "", "e": "En el párrafo 5 el autor reconoce que la idea de Kant «no resuelve todas las disputas» y que «ninguna votación decidirá quién tiene razón». Con estas afirmaciones, el autor", "f": "Párrafo 5: estrategia de concesión", "vis": "", "o": [["A", "sugiere que las discusiones sobre arte deberían evitarse porque no llevan a ninguna parte.", "Ocurre lo contrario: el autor presenta la discusión sobre arte como «una forma de confiar en que los demás pueden llegar a ver lo que vemos».", false], ["B", "contradice la tesis que había venido sosteniendo a lo largo del ensayo.", "No hay contradicción: la concesión va seguida de «Pero sí explica…», que reafirma la tesis.", false], ["C", "admite un límite de la idea expuesta sin renunciar a la conclusión que defiende.", "Después de la concesión, el autor añade «Pero sí explica por qué discutimos» y mantiene su tesis: es una concesión parcial, no un abandono.", true], ["D", "demuestra que la belleza es objetiva y que el desacuerdo es solo aparente.", "El texto no dice que el desacuerdo sea aparente; reconoce que «las personas siguen discrepando».", false]]}, {"id": "LCB-116", "niv": 2, "cp": "lc_reflexion", "cn": "", "e": "¿Cuál de las siguientes situaciones ilustra mejor lo que el texto llama placer «desinteresado»?", "f": "Aplicación del concepto del párrafo 4", "vis": "", "o": [["A", "Un coleccionista compra un cuadro de un pintor famoso porque espera venderlo mucho más caro dentro de unos años.", "Su placer depende de poseer el cuadro y de obtener ganancia: es un placer interesado.", false], ["B", "Una mujer contempla cada mañana un mural de su barrio, aunque no puede comprarlo ni le reporta beneficio.", "Coincide con el párrafo 4: agrada «aunque no pueda llevármela a casa y aunque no me sirva para nada».", true], ["C", "Un joven disfruta una arepa porque lleva toda la tarde sin comer.", "Es el caso del mango: un placer ligado a una necesidad o deseo («porque tengo hambre»).", false], ["D", "Un estudiante elogia una canción que no le gusta para quedar bien con sus amigos.", "No hay placer ante la obra y el elogio obedece a un interés social.", false]]}]}, {"comp": "lectura_critica", "sim": "s11-2", "ses": 1, "ind": "Filosofía política: el velo de ignorancia", "tt": "Texto filosófico", "texto": "REPARTIR SIN SABER QUIÉN ERES\n\n(1) Imagine que un grupo de amigos debe repartir una torta y acuerda una regla sencilla: quien corta, escoge de último. Nadie tiene que vigilar al que corta; la regla misma lo lleva a cortar porciones iguales, porque sabe que le tocará la que nadie quiera. La justicia, en este caso, no depende de la bondad de quien tiene el cuchillo, sino del diseño del procedimiento.\n\n(2) El filósofo estadounidense John Rawls propuso llevar una intuición parecida al terreno de la sociedad entera. Preguntó: ¿qué principios elegiríamos para organizar las instituciones básicas —las leyes, la economía, la educación— si no supiéramos qué lugar ocuparíamos en ellas? Para pensarlo, imaginó una situación hipotética en la que las personas deciden detrás de un «velo de ignorancia»: no saben si serán ricas o pobres, hombres o mujeres, sanas o enfermas, ni qué religión profesarán o cuáles serán sus talentos.\n\n(3) La gracia del experimento está en lo que el velo impide. Quien sabe que es dueño de una gran empresa tenderá a defender reglas que favorezcan a los empresarios; quien sabe que es campesino, reglas que favorezcan al campo. Detrás del velo, en cambio, nadie puede inclinar la balanza a su favor, porque nadie sabe cuál es su favor. Lo que se escoja así, sostiene Rawls, puede considerarse imparcial.\n\n(4) Según él, personas razonables en esa situación protegerían primero ciertas libertades básicas iguales para todos —pensar, expresarse, participar en política— y solo aceptarían desigualdades económicas si estas mejoraran la situación de quienes quedan en peor lugar. Al fin y al cabo, cualquiera podría resultar siendo uno de ellos.\n\n(5) Las críticas no se han hecho esperar. Algunos objetan que nadie decide realmente sin saber quién es, y que un experimento imaginario no obliga a nadie. Otros dicen que no todos apostarían con tanta prudencia: habría quien prefiriera arriesgarse a una sociedad muy desigual con la esperanza de quedar arriba. Rawls respondió que su escenario no pretende describir una asamblea real, sino ofrecer un punto de vista desde el cual examinar si nuestras reglas resistirían la prueba de la imparcialidad.\n\n(6) Quizá la mayor virtud de la idea es que se puede usar en pequeño. Antes de aprobar el reglamento de un colegio, una tarifa o una ley, vale la pena preguntarse: ¿lo aceptaría si no supiera de qué lado me va a tocar estar?\n\nEnsayo original escrito para este simulacro; expone con palabras propias ideas de Teoría de la justicia (1971) de John Rawls.", "vis": "", "items": [{"id": "LCB-117", "niv": 1, "cp": "lc_local", "cn": "", "e": "Según el párrafo 2, quienes deciden detrás del «velo de ignorancia» no saben", "f": "Párrafo 2", "vis": "", "o": [["A", "cuáles instituciones básicas deben organizar con los principios que escojan.", "El párrafo 2 nombra esas instituciones (leyes, economía, educación) como el objeto conocido de la decisión.", false], ["B", "qué reglas usaron los amigos para repartir la torta del primer párrafo.", "La torta es un ejemplo del autor para el lector; no tiene relación con lo que ignoran las partes.", false], ["C", "si la sociedad que organizan tendrá leyes, economía y sistema educativo.", "Saben que van a organizar esas instituciones; lo que ignoran es el lugar que ocuparán en ellas.", false], ["D", "su lugar en la sociedad, sus rasgos personales ni sus creencias.", "Resume con otras palabras la enumeración del párrafo 2: no saben si serán ricas o pobres (lugar social), hombres o mujeres, sanas o enfermas, ni sus talentos (rasgos personales), ni qué religión profesarán (creencias)", true]]}, {"id": "LCB-118", "niv": 2, "cp": "lc_global", "cn": "", "e": "El ejemplo de la torta del párrafo 1 cumple en el texto la función de", "f": "Párrafos 1 y 2", "vis": "", "o": [["A", "ilustrar que una regla bien diseñada puede asegurar un reparto justo sin vigilar a quien decide.", "El párrafo 1 concluye que la justicia «no depende de la bondad de quien tiene el cuchillo, sino del diseño del procedimiento», y el párrafo 2 dice que Rawls lleva «una intuición parecida» a la sociedad.", true], ["B", "contar una anécdota de la vida del filósofo que inspiró su teoría.", "El texto presenta la torta como una situación imaginaria («Imagine que…»), no como anécdota biográfica.", false], ["C", "presentar una crítica a Rawls que luego se responde en el párrafo 5.", "Las críticas aparecen en el párrafo 5 y no tienen que ver con la torta, que apoya la idea de Rawls.", false], ["D", "demostrar que, en una sociedad justa, todos los bienes deben repartirse en porciones exactamente iguales.", "El párrafo 4 muestra que Rawls admite desigualdades económicas en ciertas condiciones; la torta no prueba igualdad absoluta.", false]]}, {"id": "LCB-119", "niv": 2, "cp": "lc_global", "cn": "", "e": "Según el texto, ¿por qué las decisiones tomadas detrás del velo de ignorancia serían imparciales?", "f": "Párrafo 3", "vis": "", "o": [["A", "Porque obligan a que todas las personas reciban exactamente los mismos ingresos.", "El párrafo 4 admite desigualdades económicas si mejoran la situación de quienes están peor.", false], ["B", "Porque en esa situación solo participan personas bondadosas y desinteresadas.", "Igual que en el ejemplo de la torta, la imparcialidad depende del procedimiento, no de la bondad de los participantes.", false], ["C", "Porque nadie puede proponer reglas a su favor si ignora cuál será su situación.", "El párrafo 3: «nadie puede inclinar la balanza a su favor, porque nadie sabe cuál es su favor».", true], ["D", "Porque las reglas se aprueban por mayoría en una asamblea real.", "El párrafo 5 aclara que el escenario «no pretende describir una asamblea real»; tampoco se habla de votación.", false]]}, {"id": "LCB-120", "niv": 2, "cp": "lc_reflexion", "cn": "", "e": "Frente a la crítica de que «nadie decide realmente sin saber quién es», la respuesta de Rawls presentada en el párrafo 5 consiste en", "f": "Párrafo 5: crítica y respuesta", "vis": "", "o": [["A", "aceptar que su teoría es imposible de aplicar y proponer otra teoría distinta.", "Rawls no abandona su teoría; precisa cómo debe entenderse.", false], ["B", "sostener que en la vida real casi todos deciden sin saber quiénes son.", "Rawls no discute ese hecho; cambia el plano de la discusión al decir que el escenario es hipotético.", false], ["C", "demostrar que todas las personas apuestan siempre con la misma prudencia.", "Esa sería respuesta a la otra crítica (la de la prudencia), y el texto no dice que Rawls la demuestre.", false], ["D", "aclarar que su escenario sirve para examinar reglas, no para describir hechos reales.", "El párrafo 5: el escenario «no pretende describir una asamblea real, sino ofrecer un punto de vista» para examinar las reglas.", true]]}, {"id": "LCB-121", "niv": 3, "cp": "lc_reflexion", "cn": "", "e": "La junta de un edificio debe decidir cómo asignar los pocos parqueaderos disponibles. Aplicar la pregunta que propone el párrafo 6 implicaría", "f": "Párrafo 6 aplicado a una situación nueva", "vis": "", "o": [["A", "dar prioridad a quienes llevan más años viviendo en el edificio, porque son ellos quienes conocen mejor las necesidades de todos.", "Introduce un criterio de antigüedad que el texto no plantea y que no implica ponerse en el lugar de cualquiera.", false], ["B", "aprobar la regla que prefiera la mayoría de los residentes presentes en la reunión.", "La mayoría vota sabiendo su situación; el texto no identifica imparcialidad con mayoría.", false], ["C", "evaluar cada propuesta imaginando que se podría ser cualquier residente, por ejemplo uno sin carro o con movilidad reducida.", "La pregunta del párrafo 6 («¿lo aceptaría si no supiera de qué lado me va a tocar estar?») exige ponerse en la posición de cualquiera de los afectados.", true], ["D", "dejar que decidan los propietarios que tienen más carros, pues son los más interesados.", "Es lo opuesto: decide quien conoce su posición y puede inclinar la balanza a su favor (párrafo 3).", false]]}, {"id": "LCB-122", "niv": 3, "cp": "lc_reflexion", "cn": "", "e": "Un lector afirma: «La teoría de Rawls defiende que todas las personas deben tener exactamente los mismos ingresos». Según el texto, esta lectura es", "f": "Párrafo 4", "vis": "", "o": [["A", "correcta, pues el párrafo 4 afirma que las libertades básicas deben ser iguales para todos.", "Confunde la igualdad de libertades básicas con igualdad de ingresos; el texto las trata por separado.", false], ["B", "incorrecta, pues el párrafo 4 acepta desigualdades que mejoren la situación de los peor ubicados.", "El párrafo 4 dice que se «aceptarían desigualdades económicas si estas mejoraran la situación de quienes quedan en peor lugar»: no exige ingresos idénticos.", true], ["C", "incorrecta, pues según el párrafo 5 cada uno debe conservar lo que gane, sin condiciones.", "El párrafo 5 no dice eso: trata de las críticas a Rawls; y el párrafo 4 condiciona las desigualdades a que beneficien a quienes están peor.", false], ["D", "correcta, pues el párrafo 1 muestra con la torta que todo debe repartirse en porciones iguales.", "La torta ilustra el valor de un buen procedimiento, no una regla de igualdad total de ingresos.", false]]}]}, {"comp": "lectura_critica", "sim": "s11-2", "ses": 1, "ind": "Columna sobre educación: evaluar el error", "tt": "Texto informativo", "texto": "EL ERROR QUE SÍ CUENTA\n\n(1) Durante años, en muchos colegios, el examen ha funcionado como una sentencia: el estudiante responde, el profesor califica y la nota queda escrita para siempre. Lo que pase después —si el estudiante entendió por qué se equivocó, si volvió a intentarlo— rara vez cuenta. Sin embargo, quien haya aprendido a montar en bicicleta sabe que la caída no es lo contrario del aprendizaje, sino una parte de él.\n\n(2) Los especialistas en educación distinguen entre dos usos de la evaluación. La evaluación sumativa mide lo que alguien sabe al final de un proceso y sirve para certificar: aprobar un curso, obtener un título. La evaluación formativa, en cambio, ocurre durante el proceso y sirve para orientar: le muestra al estudiante dónde está, qué le falta y cómo avanzar. Ambas son necesarias; el problema aparece cuando la primera se come a la segunda.\n\n(3) Conozco a una profesora de química que hizo un experimento modesto. Durante un semestre, después de cada prueba, devolvió las hojas sin nota, solo con comentarios, y dio a sus estudiantes una semana para corregir sus errores y explicar por escrito qué habían entendido mal. La nota se ponía después. Los primeros días hubo quejas: «Profe, díganos cuánto sacamos y ya». Al final del semestre, varios le dijeron que era la primera vez que leían los comentarios de un profesor.\n\n(4) No pretendo que esa anécdota pruebe nada sobre todos los colegios del país. Es una sola aula, una sola profesora y un solo semestre. Pero ilustra algo que cualquiera puede comprobar en su propia experiencia: cuando la nota llega primero, la mirada se queda en el número; cuando llega después, hay espacio para mirar el error.\n\n(5) Cambiar esto no exige grandes reformas. Exige, sobre todo, que profesores, estudiantes y familias dejemos de tratar cada equivocación como una mancha en el expediente y empecemos a tratarla como información. Un error bien analizado dice más de lo que alguien está aprendiendo que diez respuestas correctas copiadas del compañero de al lado.\n\nColumna de opinión original escrita para este simulacro.", "vis": "", "items": [{"id": "LCB-123", "niv": 1, "cp": "lc_local", "cn": "", "e": "Según el párrafo 2, la evaluación formativa se caracteriza por", "f": "Párrafo 2", "vis": "", "o": [["A", "ocurrir mientras el estudiante aprende y servirle para orientarse sobre cómo avanzar.", "El párrafo 2: la formativa «ocurre durante el proceso y sirve para orientar».", true], ["B", "medir lo aprendido al final de un proceso para certificarlo con una nota o un título.", "Esa es la definición de la evaluación sumativa en el mismo párrafo, no de la formativa.", false], ["C", "revisar, al terminar el año, cuánto avanzó el grupo frente al año anterior.", "Ocurre al final y mira resultados del grupo; la formativa, según el párrafo 2, ocurre durante el proceso y orienta al estudiante.", false], ["D", "comparar el desempeño de cada estudiante con el de sus compañeros de curso.", "El párrafo 2 no define la evaluación formativa por la comparación entre estudiantes, sino por orientar a cada uno durante el proceso.", false]]}, {"id": "LCB-124", "niv": 1, "cp": "lc_local", "cn": "", "e": "En el experimento de la profesora de química (párrafo 3), los estudiantes recibían la nota de cada prueba", "f": "Párrafo 3", "vis": "", "o": [["A", "después de corregir sus errores y explicar por escrito qué habían entendido mal.", "El párrafo 3 dice que les dio una semana para corregir y explicar, y que «la nota se ponía después».", true], ["B", "solo al final del semestre, cuando la profesora sumaba todas las calificaciones.", "El texto no dice eso: la nota se ponía después de la semana de corrección de cada prueba.", false], ["C", "nunca, pues el experimento consistía en reemplazar las notas por comentarios.", "La nota sí se ponía, solo que después de la corrección.", false], ["D", "el mismo día de la prueba, junto con los comentarios escritos por la profesora.", "Las hojas se devolvían «sin nota, solo con comentarios»; la nota llegaba después.", false]]}, {"id": "LCB-125", "niv": 2, "cp": "lc_global", "cn": "", "e": "En el párrafo 2, con la expresión «el problema aparece cuando la primera se come a la segunda», el autor se refiere a que", "f": "Párrafo 2: referencia de «la primera» y «la segunda»", "vis": "", "o": [["A", "la evaluación formativa termina reemplazando a la sumativa y los estudiantes dejan de recibir títulos o certificados.", "Invierte el orden de los referentes: «la primera» es la sumativa, que es la que se «come» a la formativa.", false], ["B", "los estudiantes copian las respuestas de sus compañeros durante los exámenes.", "La copia se menciona en el párrafo 5 con otro propósito; no es el sentido de esta expresión.", false], ["C", "la evaluación sumativa desplaza a la formativa y la nota termina importando más que la orientación.", "«La primera» es la sumativa y «la segunda» la formativa, en el orden en que se presentan; el resto de la columna critica que la nota ocupe todo el espacio.", true], ["D", "las dos clases de evaluación sobran y conviene eliminarlas de los colegios.", "Contradice la frase previa: «Ambas son necesarias».", false]]}, {"id": "LCB-126", "niv": 2, "cp": "lc_global", "cn": "", "e": "¿Cuál es la intención principal de la columna?", "f": "Párrafos 1 y 5", "vis": "", "o": [["A", "Exigir que el Ministerio de Educación elimine los exámenes finales de todos los cursos.", "El autor dice que «no exige grandes reformas» y que ambas evaluaciones son necesarias.", false], ["B", "Demostrar, con datos recogidos en muchos colegios, que la evaluación formativa mejora los resultados en todo el país.", "El párrafo 4 aclara que la anécdota no prueba nada sobre todos los colegios; el texto no presenta datos generales.", false], ["C", "Contar la trayectoria profesional de una profesora de química y sus logros en un colegio.", "La profesora es un ejemplo dentro del argumento, no el tema central.", false], ["D", "Proponer que el error se trate como información para aprender y no solo como algo que se castiga con una nota.", "Lo resume el párrafo 5: dejar de tratar la equivocación «como una mancha en el expediente» y «tratarla como información».", true]]}, {"id": "LCB-127", "niv": 2, "cp": "lc_reflexion", "cn": "", "e": "En el párrafo 4, el autor advierte que su anécdota no prueba «nada sobre todos los colegios del país». Con esa advertencia,", "f": "Párrafo 4: estrategia argumentativa", "vis": "", "o": [["A", "contradice la tesis que había defendido en los párrafos anteriores.", "Inmediatamente después reafirma su idea («Pero ilustra algo…»).", false], ["B", "reconoce el alcance limitado de su ejemplo y lo presenta como ilustración, no como prueba.", "Señala «una sola aula, una sola profesora y un solo semestre» y añade «Pero ilustra algo…»: limita el alcance sin abandonar su punto.", true], ["C", "sugiere que el método solo sirve en la clase de química.", "No restringe el método a una materia; limita la generalización estadística, no el área.", false], ["D", "pone en duda la honestidad de la profesora y de los resultados que ella obtuvo con sus estudiantes.", "El autor no cuestiona a la profesora; solo delimita lo que su caso permite concluir.", false]]}, {"id": "LCB-128", "niv": 3, "cp": "lc_reflexion", "cn": "", "e": "¿Cuál de los siguientes hechos, si fuera cierto, debilitaría más la idea central del párrafo 4?", "f": "Evaluación de un argumento", "vis": "", "o": [["A", "Algunos estudiantes se quejaron al principio porque querían conocer su nota cuanto antes.", "El texto ya menciona esas quejas (párrafo 3), y el desenlace del experimento las supera; no debilita la idea.", false], ["B", "La evaluación sumativa sigue siendo necesaria para certificar cursos y otorgar títulos.", "El autor está de acuerdo:
