 «Ambas son necesarias».", false], ["C", "Un estudio en otro colegio encontró que, con el mismo método, los estudiantes también empezaron a leer los comentarios con atención.", "Ese hecho apoyaría la idea del autor, no la debilitaría.", false], ["D", "Un estudio con miles de estudiantes encontró que quienes recibían primero los comentarios no los leían más que quienes recibían de inmediato la nota.", "El párrafo 4 sostiene que, si la nota llega después, «hay espacio para mirar el error». Un estudio amplio que no encuentre diferencia en la lectura de comentarios ataca directamente esa idea.", true]]}]}, {"comp": "lectura_critica", "sim": "s11-2", "ses": 1, "ind": "Lenguaje y comunicación: los préstamos lingüísticos", "tt": "Texto informativo", "texto": "PALABRAS CON PASAPORTE\n\n(1) Cuando un colombiano se acuesta en una hamaca, se come una papa criolla con tomate o apoya la cabeza en una almohada para ver un partido de fútbol, ha usado palabras de al menos cinco lenguas distintas sin salir del español. Hamaca viene del taíno, la lengua que se hablaba en las Antillas; tomate, del náhuatl de México; papa, del quechua de los Andes; almohada, del árabe hablado en la península ibérica durante la Edad Media; y fútbol, del inglés football.\n\n(2) Los lingüistas llaman préstamos a las palabras que una lengua toma de otra. Lejos de ser una rareza, son la regla: ninguna lengua viva está aislada, porque sus hablantes comercian, migran, se casan, pelean y aprenden unos de otros. Las palabras viajan con las cosas y con las personas. Cuando los españoles conocieron en el Caribe una cama colgante que no existía en Europa, no inventaron un nombre: adoptaron el que ya tenía.\n\n(3) Con el tiempo, muchos préstamos se adaptan tanto que nadie los siente extranjeros. Football se convirtió en fútbol, con tilde y con la pronunciación del español; nadie piensa hoy en el árabe cuando pide una almohada. Otros préstamos, en cambio, conservan durante años su forma original y conviven con alternativas propias, como ocurre con muchos términos de la tecnología.\n\n(4) Ante esta última situación suelen aparecer dos actitudes. Una ve en cada palabra extranjera una amenaza y propone sustituirlas todas por equivalentes castizos. Otra acepta cualquier término nuevo sin preguntarse si ya existía uno claro en español. Ambas, quizá, olvidan lo mismo: que la lengua no la deciden por sí solos los diccionarios ni los puristas, sino el uso de millones de hablantes que, sin proponérselo, eligen qué palabras se quedan y cuáles se van.\n\n(5) Eso no significa que todo dé igual. Quien escribe un contrato, una noticia o una instrucción médica tiene la responsabilidad de que su lector entienda; si un extranjerismo oscurece el mensaje y existe una palabra conocida por todos, la elección parece clara. Pero quien quiera una lengua sin préstamos tendría que renunciar a la hamaca, a la papa y a la almohada. Y eso, para un colombiano, sería pedir demasiado.\n\nArtículo divulgativo original escrito para este simulacro. Etimologías según el Diccionario de la lengua española (RAE-ASALE).", "vis": "", "items": [{"id": "LCB-129", "niv": 2, "cp": "lc_local", "cn": "", "e": "En el párrafo 1, la expresión «sin salir del español» significa que quien dice esas palabras", "f": "Párrafo 1", "vis": "", "o": [["A", "traduce al español palabras que aprendió en otros idiomas.", "No hay traducción: hamaca, tomate o fútbol ya son palabras del español, aunque su origen sea otro.", false], ["B", "está hablando en español, aunque esas palabras vengan de otras lenguas.", "El párrafo 1 explica que esas palabras vienen de cinco lenguas distintas, pero quien las usa sigue hablando español: son préstamos ya incorporados.", true], ["C", "nunca ha viajado fuera de un país donde se hable español.", "Toma en sentido literal la expresión: «salir» no se refiere a viajar, sino a cambiar de idioma.", false], ["D", "evita a propósito usar palabras que provengan de otros idiomas.", "Es lo contrario: el texto dice que esa persona usa palabras de por lo menos cinco lenguas.", false]]}, {"id": "LCB-130", "niv": 1, "cp": "lc_global", "cn": "", "e": "¿Qué función cumple en el párrafo 2 el ejemplo de la cama colgante que los españoles conocieron en el Caribe?", "f": "Párrafo 2", "vis": "", "o": [["A", "Ilustrar que las palabras suelen llegar a una lengua junto con las cosas que nombran.", "El ejemplo sigue a la idea «Las palabras viajan con las cosas y con las personas»: un objeto nuevo trajo consigo su nombre, hamaca.", true], ["B", "Explicar que el taíno es la lengua más antigua de todas las que han aportado palabras al español.", "El texto no compara la antigüedad de las lenguas.", false], ["C", "Demostrar que los españoles de esa época eran incapaces de inventar palabras nuevas para las cosas.", "El texto no juzga la capacidad de los españoles; explica por qué adoptaron un nombre que ya existía.", false], ["D", "Mostrar que los préstamos son casos raros y excepcionales dentro de una lengua.", "El párrafo dice lo contrario: los préstamos «lejos de ser una rareza, son la regla».", false]]}, {"id": "LCB-131", "niv": 2, "cp": "lc_global", "cn": "", "e": "Según el párrafo 3, palabras como fútbol y almohada se diferencian de muchos términos de la tecnología en que", "f": "Párrafo 3", "vis": "", "o": [["A", "fueron impuestas por los diccionarios, mientras que los términos tecnológicos llegaron por el uso de los hablantes.", "El párrafo 4 dice que no son los diccionarios sino el uso de los hablantes lo que decide.", false], ["B", "se usan solo en Colombia, mientras que los términos tecnológicos se usan en todo el mundo hispánico.", "El texto no afirma que fútbol o almohada sean exclusivas de Colombia.", false], ["C", "ya se adaptaron al español y no se sienten extranjeras, mientras que esos términos conservan su forma original.", "El párrafo 3 contrasta los préstamos que «nadie los siente extranjeros» con otros que «conservan durante años su forma original», como los de la tecnología.", true], ["D", "provienen de lenguas indígenas americanas, mientras que los términos tecnológicos vienen de lenguas europeas.", "Fútbol viene del inglés y almohada del árabe; ninguna de las dos es de origen indígena americano.", false]]}, {"id": "LCB-132", "niv": 3, "cp": "lc_global", "cn": "", "e": "¿Cuál es la posición del autor frente a las dos actitudes que describe en el párrafo 4?", "f": "Párrafo 4", "vis": "", "o": [["A", "Considera que ambas olvidan que es el uso de los hablantes el que decide qué palabras se quedan.", "El párrafo 4: «Ambas, quizá, olvidan lo mismo: que la lengua no la deciden por sí solos los diccionarios ni los puristas, sino el uso de millones de hablantes».", true], ["B", "Considera que los diccionarios deben decidir cuál de las dos actitudes es la correcta.", "El autor niega que los diccionarios por sí solos decidan sobre la lengua.", false], ["C", "Apoya la segunda, porque cree que cualquier término nuevo debe aceptarse sin más, sin preguntarse si ya existía otro en español.", "El autor también critica esa actitud, y en el párrafo 5 defiende elegir la palabra que el lector entienda.", false], ["D", "Apoya la primera, pues cree que los extranjerismos deben sustituirse todos por palabras castizas.", "El autor critica a ambas y en el párrafo 5 muestra que una lengua sin préstamos sería absurda.", false]]}, {"id": "LCB-133", "niv": 2, "cp": "lc_reflexion", "cn": "", "e": "¿Qué recurso usa el autor en la última oración del texto («Y eso, para un colombiano, sería pedir demasiado»)?", "f": "Párrafo 5: estrategia discursiva", "vis": "", "o": [["A", "Una crítica a quienes llenan sus escritos de extranjerismos innecesarios.", "El cierre no se dirige a quienes abusan de los extranjerismos: alude, con humor, a quien quisiera una lengua sin préstamos y tendría que renunciar a la hamaca, la papa y la almohada.", false], ["B", "Un dato estadístico sobre el uso de préstamos en Colombia.", "No hay cifras ni datos en esa oración.", false], ["C", "Una cita de autoridad de un lingüista reconocido que respalda la tesis.", "La oración no cita a nadie; es la voz del propio autor.", false], ["D", "Un cierre con humor que retoma los ejemplos del comienzo del texto.", "La oración vuelve a la hamaca, la papa y la almohada del párrafo 1 y, con un tono de humor, muestra que renunciar a los préstamos sería inaceptable.", true]]}, {"id": "LCB-134", "niv": 3, "cp": "lc_reflexion", "cn": "", "e": "De acuerdo con el criterio del párrafo 5, ¿en cuál de las siguientes situaciones sería más pertinente reemplazar un extranjerismo por una palabra en español?", "f": "Párrafo 5 aplicado a situaciones nuevas", "vis": "", "o": [["A", "Un programador conversa con sus colegas usando un término técnico en inglés que todos ellos conocen y usan a diario.", "No se cumple la condición de que el extranjerismo oscurezca el mensaje: los interlocutores lo entienden.", false], ["B", "Una poeta usa la palabra hamaca en un poema sobre las tardes de su infancia en la casa de sus abuelos.", "Hamaca es un préstamo plenamente integrado; el autor dice que renunciar a ella «sería pedir demasiado».", false], ["C", "Un folleto de hospital explica la dosis de un medicamento con un término en inglés que pocos pacientes entienden.", "Es el caso que señala el párrafo 5: una instrucción médica en la que el extranjerismo oscurece el mensaje para su lector; ahí conviene una palabra que todos entiendan.", true], ["D", "Un grupo de amigos usa la palabra fútbol mientras conversa sobre el partido que vieron juntos el domingo en la tarde.", "Fútbol es un préstamo ya adaptado (párrafo 3) y la conversación no presenta problema de comprensión.", false]]}]}, {"comp": "lectura_critica", "sim": "s11-2", "ses": 1, "ind": "Historieta sobre el arte abstracto", "tt": "Caricatura o cómic", "texto": "HISTORIETA: «ESTO LO HACE CUALQUIERA»\n\nViñeta 1: En la sala de un museo, un señor de bigote observa un lienzo enorme, completamente blanco, con un pequeño punto rojo cerca de una esquina. A su lado, su nieta de unos diez años. El señor dice, burlón: —¡Esto lo hace cualquiera!\n\nViñeta 2: La nieta lo mira con las manos en la cintura: —¿Y entonces por qué no lo hiciste tú, abuelo? El abuelo se rasca la cabeza, sin saber qué contestar.\n\nViñeta 3: En la sala de una casa. El abuelo, con delantal, frente a un lienzo blanco en un caballete, sostiene un pincel untado de pintura roja. Suda. En el piso hay muchos lienzos arrugados, cada uno con un punto rojo en un lugar distinto. Un gato lo mira desde el sofá.\n\nViñeta 4: En la pared, una hoja pegada dice: «DÍA 3». El abuelo, con ojeras y la camisa manchada, le habla al gato: —El problema no es el punto... es saber dónde ponerlo.\n\nHistorieta original descrita para este simulacro.", "vis": "", "items": [{"id": "LCB-135", "niv": 1, "cp": "lc_local", "cn": "", "e": "¿Qué hace el abuelo en la viñeta 3?", "f": "Viñeta 3", "vis": "", "o": [["A", "Arruga el cuadro que compró en el museo porque no le gustó.", "No compra ningún cuadro; los lienzos arrugados son sus propios intentos.", false], ["B", "Intenta pintar un cuadro con un punto rojo, rodeado de lienzos arrugados.", "La viñeta 3 lo muestra frente a un lienzo, con un pincel con pintura roja y muchos lienzos arrugados en el piso.", true], ["C", "Le explica a su gato por qué el arte moderno no tiene ningún valor.", "En la viñeta 3 no habla; en la 4 le dice al gato algo muy distinto.", false], ["D", "Observa en el museo el cuadro blanco junto a su nieta.", "Eso ocurre en las viñetas 1 y 2, no en la 3.", false]]}, {"id": "LCB-136", "niv": 1, "cp": "lc_global", "cn": "", "e": "Los lienzos arrugados de la viñeta 3 y la hoja con el letrero «DÍA 3» de la viñeta 4 permiten inferir que el abuelo", "f": "Viñetas 3 y 4", "vis": "", "o": [["A", "se rindió al primer intento y decidió no volver a pintar.", "Los muchos lienzos y los tres días indican insistencia, no abandono.", false], ["B", "lleva varios días intentándolo sin lograr un resultado que lo satisfaga.", "Cada lienzo arrugado tiene el punto en un lugar distinto (intentos descartados) y el letrero indica que ya va en el tercer día.", true], ["C", "pintó en tres días tres cuadros idénticos al que vio en el museo con su nieta.", "Los lienzos están arrugados, es decir, descartados, y el punto está «en un lugar distinto» en cada uno: no son idénticos ni terminados.", false], ["D", "recibió de su nieta un plazo de tres días para terminar su propio cuadro.", "Nada en la historieta indica un plazo impuesto por la nieta.", false]]}, {"id": "LCB-137", "niv": 3, "cp": "lc_reflexion", "cn": "", "e": "¿Qué idea sobre el arte transmite la historieta?", "f": "Sentido global de la historieta", "vis": "", "o": [["A", "Para hacer arte basta con tener los materiales adecuados, como un buen pincel y un lienzo.", "El abuelo tiene los materiales y aun así no lo logra; la historieta pone el énfasis en las decisiones.", false], ["B", "Los museos deberían exhibir obras hechas por aficionados en lugar de las de artistas.", "La historieta no hace ninguna propuesta sobre qué deben exhibir los museos.", false], ["C", "Una obra que parece sencilla puede exigir decisiones difíciles que no ve quien solo la mira.", "El abuelo cree que la obra «lo hace cualquiera», pero al intentarlo descubre que lo difícil es «saber dónde ponerlo»: la aparente sencillez oculta decisiones.", true], ["D", "Las obras de arte moderno no tienen valor, porque cualquier persona podría hacerlas con muy poco esfuerzo.", "Es la opinión inicial del abuelo, que la historieta desmiente en las viñetas 3 y 4.", false]]}]}, {"comp": "lectura_critica", "sim": "s11-2", "ses": 1, "ind": "Infografía de economía cotidiana: formas de pago", "tt": "Texto discontinuo", "texto": "¿CÓMO PAGAR UN CELULAR DE $ 1.200.000?\n\nInfografía de una campaña de educación financiera (datos ficticios). La tabla compara cuatro formas de pagar el mismo celular.\n\nAntes de decidir:\n1. Compare el total pagado, no solo el valor de la cuota.\n2. Una cuota baja con muchos meses puede salir más cara.\n3. Si no necesita el celular de inmediato, ahorrar o usar un plan separe evita pagar intereses.", "vis": "<table class=\"vt\"><caption>Tabla 5. Formas de pago del mismo celular<\/caption><thead><tr><th>Opción<\/th><th>Cuota inicial<\/th><th>Número de cuotas mensuales<\/th><th>Valor de cada cuota<\/th><th>Total pagado<\/th><th>Requisitos y condiciones<\/th><\/tr><\/thead><tbody><tr><td>De contado<\/td><td>$ 1.200.000<\/td><td>0<\/td><td>—<\/td><td>$ 1.200.000<\/td><td>Ninguno<\/td><\/tr><tr><td>Crédito en el almacén<\/td><td>$ 200.000<\/td><td>12<\/td><td>$ 110.000<\/td><td>$ 1.520.000<\/td><td>Cédula y un codeudor<\/td><\/tr><tr><td>Tarjeta de crédito<\/td><td>$ 0<\/td><td>6<\/td><td>$ 225.000<\/td><td>$ 1.350.000<\/td><td>Tener tarjeta con cupo disponible<\/td><\/tr><tr><td>Plan separe<\/td><td>$ 300.000<\/td><td>3<\/td><td>$ 300.000<\/td><td>$ 1.200.000<\/td><td>El celular se entrega al pagar la última cuota<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Fuente: datos ficticios elaborados para este simulacro.<\/div>", "items": [{"id": "LCB-138", "niv": 2, "cp": "lc_local", "cn": "", "e": "Según la tabla, ¿cuál de las opciones obliga al comprador a conseguir a otra persona que responda por la deuda si él no paga?", "f": "Tabla 5, columna de requisitos", "vis": "", "o": [["A", "El crédito en el almacén.", "Esa persona es un codeudor, y la fila «Crédito en el almacén» exige «Cédula y un codeudor».", true], ["B", "El pago de contado.", "De contado no hay deuda, y la tabla indica «Ninguno» en requisitos.", false], ["C", "El plan separe.", "Su condición es que el celular se entrega al pagar la última cuota; no involucra a otra persona.", false], ["D", "La tarjeta de crédito.", "Su requisito es «Tener tarjeta con cupo disponible»; no pide que otra persona responda por la deuda.", false]]}, {"id": "LCB-139", "niv": 1, "cp": "lc_global", "cn": "", "e": "Según la infografía, ¿qué opción permite pagar por cuotas sin pagar en total más que el precio de contado?", "f": "Tabla 5, columnas de cuotas y total", "vis": "", "o": [["A", "El crédito en el almacén, porque su cuota mensual es la más baja.", "Su total es $ 1.520.000, el más alto de todos.", false], ["B", "Ninguna, porque todas las opciones con cuotas cobran intereses.", "El plan separe tiene cuotas y su total es igual al de contado.", false], ["C", "La tarjeta de crédito, porque no exige cuota inicial.", "Aunque no tiene cuota inicial, el total pagado es $ 1.350.000, más que el precio de contado.", false], ["D", "El plan separe, porque su total es igual al precio de contado.", "Es la única opción con cuotas cuyo total ($ 1.200.000 = $ 300.000 + 3 × $ 300.000) iguala el precio de contado.", true]]}, {"id": "LCB-140", "niv": 3, "cp": "lc_global", "cn": "", "e": "Una persona elige el crédito en el almacén «porque la cuota es la más baja». De acuerdo con la infografía, ¿qué está dejando de considerar?", "f": "Tabla 5 y consejo 2", "vis": "", "o": [["A", "Que la tarjeta de crédito tiene una cuota mensual todavía más baja que la del crédito en el almacén.", "La cuota de la tarjeta ($ 225.000) es más alta que la del almacén ($ 110.000).", false], ["B", "Que el plan separe exige un codeudor, lo que lo hace más difícil de conseguir que el crédito.", "El plan separe no exige codeudor; quien lo exige es el crédito en el almacén.", false], ["C", "Que la opción de contado se paga en cuotas más cómodas que las del crédito en el almacén.", "El pago de contado no tiene cuotas: se paga todo de una vez.", false], ["D", "Que con esa opción paga $ 320.000 más que de contado, la mayor diferencia entre las opciones.", "$ 200.000 + 12 × $ 110.000 = $ 1.520.000; $ 1.520.000 − $ 1.200.000 = $ 320.000, más que la diferencia de la tarjeta ($ 150.000). Es lo que advierte el consejo 2.", true]]}, {"id": "LCB-141", "niv": 2, "cp": "lc_reflexion", "cn": "", "e": "Un lector concluye: «El plan separe es la mejor opción para cualquier persona». Esta conclusión es", "f": "Tabla 5 y consejo 3", "vis": "", "o": [["A", "apresurada, porque el plan separe es la opción con la que más se paga en total.", "Es falso: la opción con mayor total es el crédito en el almacén.", false], ["B", "correcta, porque el plan separe es la opción más barata de todas, incluso más barata que el pago de contado.", "Su total ($ 1.200.000) es igual al de contado, no menor.", false], ["C", "apresurada, porque el plan separe entrega el celular solo al final y no le sirve a quien lo necesita ya.", "La tabla indica que el celular «se entrega al pagar la última cuota», y el consejo 3 lo recomienda solo «si no necesita el celular de inmediato».", true], ["D", "correcta, porque es la única opción que no exige ningún requisito ni condición a quien la elige.", "El plan separe tiene una condición: el celular se entrega al final. La que no tiene requisitos es el pago de contado.", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "s11-2", "ses": 1, "ind": "Línea de tiempo de la Independencia", "tt": "", "texto": "Un profesor pide a sus estudiantes ordenar cronológicamente cuatro acontecimientos del proceso de Independencia de la Nueva Granada:\n\n1. Rebelión de los Comuneros en el Socorro contra nuevos impuestos.\n2. Batalla del Puente de Boyacá.\n3. Formación de la Junta Suprema en Santafé tras los hechos del 20 de julio.\n4. Reconquista española dirigida por Pablo Morillo.", "vis": "", "items": [{"id": "SCB-110", "niv": 2, "cp": "sc_pensamiento_social", "cn": "", "e": "¿Cuál es el orden cronológico correcto, del más antiguo al más reciente?", "f": "Banrepcultural, Credencial Historia n.º 240 y 241; Museo Nacional, «La Batalla de Boyacá»", "vis": "", "o": [["A", "1, 3, 4, 2.", "Comuneros (1781), Junta Suprema tras el 20 de julio (1810), Reconquista de Morillo (1815-1816) y Batalla de Boyacá (7 de agosto de 1819).", true], ["B", "3, 1, 4, 2.", "Ubica la Junta de 1810 antes de la rebelión comunera, que ocurrió casi treinta años antes, en 1781.", false], ["C", "1, 4, 3, 2.", "La Reconquista (1815-1816) fue una respuesta de la Corona a los gobiernos surgidos desde 1810; no pudo ocurrir antes de la Junta.", false], ["D", "1, 3, 2, 4.", "La Batalla de Boyacá (1819) puso fin al dominio restaurado por la Reconquista; por eso es posterior a la campaña de Morillo.", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "s11-2", "ses": 1, "ind": "Proyecto minero cerca de un páramo", "tt": "", "texto": "En el municipio ficticio de San Rafael del Alto, una empresa propone abrir una mina de oro a cielo abierto cerca del páramo que abastece de agua a la cabecera municipal y a tres veredas. Estas son algunas opiniones recogidas por la emisora comunitaria:\n\nGerente de la empresa: «La mina generará 400 empleos directos y el municipio recibirá regalías para pavimentar sus vías».\n\nLíder del acueducto veredal: «Sin el páramo no hay agua. Ningún empleo compensa que nuestros hijos se queden sin agua para tomar y para regar los cultivos».\n\nComerciante del pueblo: «Más gente con salario significa más ventas para mi tienda, pero me preocupa que, con la llegada de trabajadores de afuera, suban los arriendos y la comida».\n\nConcejal: «Esta decisión es demasiado importante para que la tomen unos pocos. La comunidad debería pronunciarse».", "vis": "", "items": [{"id": "SCB-113", "niv": 1, "cp": "sc_perspectivas", "cn": "", "e": "¿Qué supuesto está detrás de la afirmación del líder del acueducto de que «ningún empleo compensa» la pérdida del agua?", "f": "Identificación de supuestos en un argumento", "vis": "", "o": [["A", "Que las regalías no alcanzarán para pavimentar todas las vías del municipio.", "El líder no discute las regalías; su argumento valdría aunque alcanzaran para todas las vías.", false], ["B", "Que el agua es un bien indispensable cuyo daño no se repara con ingresos.", "Para afirmar que ningún empleo compensa la pérdida, el líder da por hecho que el agua es vital y que su pérdida no se puede reponer con dinero.", true], ["C", "Que los empleos de la mina serán ocupados solo por personas de otras regiones.", "El líder no habla de quién ocuparía los empleos; la llegada de trabajadores de afuera la menciona el comerciante.", false], ["D", "Que la empresa minera no cumplirá su promesa de generar 400 empleos.", "El argumento no depende de que los empleos sean menos: aunque fueran 400, dice que no compensarían la pérdida del agua.", false]]}, {"id": "SCB-114", "niv": 2, "cp": "sc_perspectivas", "cn": "", "e": "¿Qué caracteriza la posición del comerciante frente al proyecto?", "f": "Análisis de las opiniones del caso", "vis": "", "o": [["A", "Apoya el proyecto sin ninguna reserva porque considera que aumentarán las ventas de su tienda.", "El comerciante expresa una preocupación explícita (alza de arriendos y comida), así que su apoyo no es sin reservas.", false], ["B", "Rechaza el proyecto por sus efectos sobre el páramo.", "El comerciante no menciona el páramo ni el agua; sus consideraciones son económicas.", false], ["C", "Propone que la decisión se someta a votación de la comunidad.", "Esa propuesta es del concejal, no del comerciante.", false], ["D", "Ve un beneficio para su negocio, pero también un riesgo para el costo de vida.", "Reconoce que habrá más ventas, pero teme que suban los arriendos y la comida; su postura combina una expectativa favorable y un riesgo.", true]]}, {"id": "SCB-115", "niv": 2, "cp": "sc_reflexivo_sistemico", "cn": "", "e": "Las opiniones del gerente y del líder del acueducto muestran, principalmente, una tensión entre", "f": "Análisis de dimensiones del problema", "vis": "", "o": [["A", "la dimensión jurídica, por los contratos de la empresa, y la dimensión cultural, por las fiestas del municipio.", "Las opiniones no se refieren a contratos ni a fiestas; la tensión es entre beneficios económicos y riesgos para el agua.", false], ["B", "la dimensión demográfica, por el crecimiento de la población, y la dimensión tecnológica, por la maquinaria minera.", "El crecimiento de población lo sugiere el comerciante, no el gerente ni el líder; tampoco se discute la maquinaria.", false], ["C", "la dimensión económica, por los empleos y las regalías, y la dimensión ambiental, por la protección del agua.", "El gerente argumenta con empleos y regalías (económica) y el líder con la conservación del páramo y el agua (ambiental); el conflicto enfrenta esas dos dimensiones.", true], ["D", "la dimensión cultural, por las tradiciones religiosas, y la dimensión política, por las elecciones.", "Ninguno de los dos habla de tradiciones religiosas ni de elecciones.", false]]}, {"id": "SCB-116", "niv": 3, "cp": "sc_perspectivas", "cn": "", "e": "Un estudiante quiere evaluar qué tan sólido es el argumento del gerente. ¿Cuál de las siguientes informaciones le sería más útil?", "f": "Análisis de la solidez de un argumento", "vis": "", "o": [["A", "La cantidad de oro que produjo Colombia en el último año.", "Es un dato nacional que no permite saber si los empleos y las regalías prometidos en este municipio son reales.", false], ["B", "Cuántos de los 400 empleos serían para habitantes del municipio y durante cuántos años existirían.", "El argumento del gerente se apoya en los 400 empleos; saber cuántos serían para la población local y cuánto durarían permite comprobar su beneficio real.", true], ["C", "La opinión que tienen los habitantes de la cabecera municipal sobre la gestión del alcalde que gobierna actualmente.", "La opinión sobre el alcalde no tiene relación con la promesa de empleos y regalías del gerente.", false], ["D", "El número de veredas que reciben agua del páramo.", "Ese dato sirve para valorar el argumento del líder del acueducto, no el del gerente.", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "s11-2", "ses": 1, "ind": "Fuente primaria de 1809", "tt": "", "texto": "Fragmento de una carta ficticia escrita en Santafé en 1809 por un abogado criollo a un amigo en Popayán:\n\n«Nos dicen que somos parte de la monarquía con iguales derechos que los reinos de España, pero cuando se trata de elegir representantes ante la Junta que gobierna en nombre del rey cautivo, a cada provincia de la península le dan dos diputados y a todo este Nuevo Reino uno solo. Los cargos más altos siguen en manos de los nacidos en Europa, aunque aquí sobran hombres instruidos. No pedimos dejar de ser vasallos; pedimos que no se nos trate como inferiores».", "vis": "", "items": [{"id": "SCB-117", "niv": 2, "cp": "sc_perspectivas", "cn": "", "e": "¿En qué contexto se inscribe mejor la queja del autor de la carta?", "f": "Contextualización de la fuente; Banrepcultural, «¿Ha leído el acta de la revolución del 20 de julio de 1810?»", "vis": "", "o": [["A", "El reclamo criollo por la desigual representación y el limitado acceso a cargos frente a los peninsulares.", "La carta se queja de que la Nueva Granada recibe menos diputados que las provincias españolas y de que los altos cargos quedan en manos de europeos: es el reclamo criollo previo a la Independencia.", true], ["B", "El rechazo de los esclavizados a las condiciones de trabajo en las minas.", "La carta trata de representación política y cargos, no de la situación de las personas esclavizadas.", false], ["C", "La exigencia de las comunidades indígenas de recuperar las tierras de sus resguardos frente a los hacendados.", "El autor es un abogado criollo y no menciona tierras ni resguardos indígenas.", false], ["D", "La lucha de los partidos Liberal y Conservador por el control del Estado.", "Los partidos Liberal y Conservador se formaron a mediados del siglo XIX, después de la Independencia.", false]]}, {"id": "SCB-118", "niv": 3, "cp": "sc_perspectivas", "cn": "", "e": "Un estudiante usa esta carta para afirmar que «en 1809 toda la población de la Nueva Granada quería separarse de España». ¿Por qué la carta NO sirve para sostener esa afirmación?", "f": "Evaluación del alcance de una fuente primaria", "vis": "", "o": [["A", "Porque el destinatario vivía en Popayán, una provincia donde hubo fuerte apoyo a la causa realista.", "El lugar donde vivía el destinatario no determina lo que la carta puede probar; el problema es que expresa la visión de un sector y no pide la separación.", false], ["B", "Porque en 1809 ya se había firmado la independencia definitiva después de la victoria patriota en la Batalla de Boyacá.", "La Batalla de Boyacá ocurrió en 1819, diez años después de la carta.", false], ["C", "Porque la carta solo habla de la representación ante la Junta y no menciona los impuestos que cobraba la Corona.", "Que la carta no trate los impuestos no es lo que impide la generalización; aunque los mencionara, seguiría siendo la voz de un solo sector que, además, no pide separarse.", false], ["D", "Porque el autor pide igualdad dentro de la monarquía y su carta expresa la visión de un solo sector social.", "La carta pide igualdad dentro de la monarquía («No pedimos dejar de ser vasallos») y refleja la mirada de un sector; no permite generalizar a indígenas, esclavizados, mestizos ni a todos los criollos.", true]]}]}, {"comp": "sociales_ciudadanas", "sim": "s11-2", "ses": 1, "ind": "Columnas sobre libre comercio", "tt": "", "texto": "Dos columnas de opinión ficticias publicadas en un diario regional sobre un tratado de libre comercio que reduce los aranceles a la importación de arroz:\n\nColumnista A: «Cuando baja el arancel, el arroz importado llega más barato y las familias pagan menos por un alimento básico. Además, la competencia obliga a los productores nacionales a ser más eficientes. Los beneficios para millones de consumidores son mayores que los costos para un sector».\n\nColumnista B: «Nuestros arroceros no compiten en igualdad: en otros países los productores reciben grandes subsidios. Si el arroz importado inunda el mercado, miles de familias campesinas del Tolima, el Huila y los Llanos perderán su sustento y tendrán que migrar a las ciudades».", "vis": "", "items": [{"id": "SCB-119", "niv": 2, "cp": "sc_perspectivas", "cn": "", "e": "¿En qué punto se diferencian principalmente las dos columnas?", "f": "Análisis de perspectivas del caso", "vis": "", "o": [["A", "En si el tratado de libre comercio reduce o aumenta los aranceles que paga el arroz importado al entrar al país.", "Ambos parten de que el tratado reduce los aranceles; en eso coinciden.", false], ["B", "En si los productores de otros países reciben subsidios de sus gobiernos.", "Solo B menciona los subsidios; A no lo niega ni lo discute, así que no es el punto de desacuerdo.", false], ["C", "En cuál grupo consideran más relevante: los consumidores beneficiados o los productores nacionales afectados.", "A destaca el beneficio para los consumidores por precios más bajos; B enfatiza el daño a los productores campesinos; la diferencia está en el grupo cuyo interés privilegian.", true], ["D", "En si el arroz es o no un alimento importante en la dieta diaria de la mayoría de las familias colombianas de todas las regiones.", "Ninguno de los dos discute la importancia del arroz; A incluso lo llama «alimento básico».", false]]}, {"id": "SCB-120", "niv": 3, "cp": "sc_perspectivas", "cn": "", "e": "¿Cuál es un supuesto en el que se apoya el argumento del columnista A?", "f": "Identificación de supuestos en un argumento", "vis": "", "o": [["A", "El arroz importado será de mejor calidad que el arroz nacional.", "A no habla de calidad, sino de precio y eficiencia.", false], ["B", "La baja del arancel se reflejará en el precio que pagan los consumidores finales.", "A da por hecho que, si baja el arancel, las familias pagarán menos; si los intermediarios no trasladaran la reducción al precio final, su argumento perdería fuerza.", true], ["C", "Los productores de arroz de otros países no reciben subsidios.", "El argumento de A no depende de la existencia o ausencia de subsidios; esa cuestión la plantea B.", false], ["D", "Los campesinos arroceros podrán emplearse fácilmente en las fábricas y comercios de las ciudades.", "A no se refiere al destino de los campesinos; esa consecuencia la menciona B.", false]]}, {"id": "SCB-121", "niv": 2, "cp": "sc_reflexivo_sistemico", "cn": "", "e": "Si, como teme el columnista B, muchas familias arroceras abandonan el campo y migran a las ciudades, ¿qué efecto se podría esperar en las ciudades receptoras?", "f": "Análisis de efectos entre dimensiones", "vis": "", "o": [["A", "Una mayor demanda de vivienda, empleo y servicios públicos.", "La llegada de nuevas familias incrementa la necesidad de vivienda, empleo, salud y educación en las ciudades receptoras: un efecto social y económico de una decisión comercial.", true], ["B", "Una reducción de los precios de la vivienda, por la llegada de más habitantes a la ciudad.", "Con más habitantes aumenta la demanda de vivienda, lo que tiende a subir los precios, no a bajarlos.", false], ["C", "Una disminución del trabajo informal, porque los recién llegados tendrían empleo asegurado.", "Nada garantiza empleo a quienes llegan; si no lo encuentran, lo esperable es que el trabajo informal aumente.", false], ["D", "Una disminución de la demanda de vivienda y de servicios públicos.", "Con más población llegando, la demanda de vivienda y servicios aumenta, no disminuye.", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "s11-2", "ses": 1, "ind": "Prejuicios en un argumento", "tt": "", "texto": "En un foro escolar sobre la pobreza en Colombia, un participante afirmó: «La región de la que vengo está atrasada porque su gente es perezosa. Si trabajaran más, no serían pobres».", "vis": "", "items": [{"id": "SCB-122", "niv": 2, "cp": "sc_perspectivas", "cn": "", "e": "¿Cuál es el principal problema de esta afirmación?", "f": "Identificación de prejuicios en enunciados", "vis": "", "o": [["A", "Usa datos estadísticos inexactos sobre el ingreso de la región.", "La afirmación no presenta ningún dato estadístico; su problema es la generalización, no un cálculo.", false], ["B", "Reconoce que en Colombia hay regiones con distintos niveles de pobreza.", "Reconocer diferencias entre regiones no es un error; el problema es la explicación que se da de esas diferencias.", false], ["C", "Propone que el trabajo constante puede mejorar las condiciones de vida de las personas de la región.", "Valorar el trabajo no es el problema; lo cuestionable es suponer que la pobreza se explica solo por pereza colectiva.", false], ["D", "Atribuye un rasgo negativo a todo un grupo y lo presenta como la única causa de la pobreza.", "Es un prejuicio: generaliza un rasgo («perezosa») a toda la población de una región y descarta causas como el acceso a vías, mercados, educación o tierra.", true]]}]}, {"comp": "sociales_ciudadanas", "sim": "s11-2", "ses": 1, "ind": "Precipitación y regiones naturales de Colombia", "tt": "", "texto": "Un grupo de estudiantes recopiló la precipitación promedio anual de cuatro estaciones meteorológicas de Colombia, identificadas con letras.", "vis": "<div class=\"vfig\"><svg class=\"vg\" viewBox=\"0 0 560 320\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Gráfica 3. Precipitación promedio anual por estación\" font-family=\"Arial, sans-serif\" font-size=\"12\"><rect width=\"560\" height=\"320\" fill=\"#ffffff\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"13\" fill=\"#1d2433\">Gráfica 3. Precipitación promedio anual por estación<\/text><line x1=\"60\" y1=\"258.0\" x2=\"540\" y2=\"258.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"262.0\" text-anchor=\"end\" fill=\"#3a4356\">0<\/text><line x1=\"60\" y1=\"213.6\" x2=\"540\" y2=\"213.6\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"217.6\" text-anchor=\"end\" fill=\"#3a4356\">2.000<\/text><line x1=\"60\" y1=\"169.2\" x2=\"540\" y2=\"169.2\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"173.2\" text-anchor=\"end\" fill=\"#3a4356\">4.000<\/text><line x1=\"60\" y1=\"124.8\" x2=\"540\" y2=\"124.8\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"128.8\" text-anchor=\"end\" fill=\"#3a4356\">6.000<\/text><line x1=\"60\" y1=\"80.4\" x2=\"540\" y2=\"80.4\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"84.4\" text-anchor=\"end\" fill=\"#3a4356\">8.000<\/text><line x1=\"60\" y1=\"36.0\" x2=\"540\" y2=\"36.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"40.0\" text-anchor=\"end\" fill=\"#3a4356\">10.000<\/text><line x1=\"60\" y1=\"258\" x2=\"540\" y2=\"258\" stroke=\"#3a4356\"/><line x1=\"60\" y1=\"258\" x2=\"60\" y2=\"36\" stroke=\"#3a4356\"/><text transform=\"translate(14,147.0) rotate(-90)\" text-anchor=\"middle\" fill=\"#3a4356\">Milímetros por año<\/text><text x=\"300.0\" y=\"312\" text-anchor=\"middle\" fill=\"#3a4356\">Estación<\/text><text x=\"120.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">A<\/text><text x=\"240.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">B<\/text><text x=\"360.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">C<\/text><text x=\"480.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">D<\/text><rect x=\"78.0\" y=\"244.7\" width=\"84.0\" height=\"13.3\" fill=\"#1660a8\"/><text x=\"120.0\" y=\"240.7\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">600<\/text><rect x=\"198.0\" y=\"218.0\" width=\"84.0\" height=\"40.0\" fill=\"#1660a8\"/><text x=\"240.0\" y=\"214.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">1.800<\/text><rect x=\"318.0\" y=\"204.7\" width=\"84.0\" height=\"53.3\" fill=\"#1660a8\"/><text x=\"360.0\" y=\"200.7\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">2.400<\/text><rect x=\"438.0\" y=\"69.3\" width=\"84.0\" height=\"188.7\" fill=\"#1660a8\"/><text x=\"480.0\" y=\"65.3\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">8.500<\/text><\/svg><\/div>", "items": [{"id": "SCB-128", "niv": 1, "cp": "sc_pensamiento_social", "cn": "", "e": "¿Dónde es más probable que se ubique la estación D?", "f": "Datos de la gráfica ficticios; IDEAM, regiones naturales", "vis": "", "o": [["A", "En el altiplano cundiboyacense, en la región Andina.", "El altiplano tiene lluvias moderadas (alrededor de 1.000 mm o menos en muchas zonas), muy inferiores a las de la estación D.", false], ["B", "En el departamento del Chocó, en la región Pacífica.", "La región Pacífica, especialmente el Chocó, tiene una de las precipitaciones más altas del mundo, con zonas que superan ampliamente los 8.000 mm al año (IDEAM).", true], ["C", "En la península de La Guajira, en la región Caribe.", "La alta Guajira es la zona más seca del país (bioma de desierto tropical); correspondería mejor a la estación A, con muy poca lluvia.", false], ["D", "En las sabanas de Casanare, en la Orinoquía.", "Los Llanos tienen lluvias importantes, pero muy lejos de los 8.500 mm anuales; tienen además una temporada seca marcada.", false]]}, {"id": "SCB-129", "niv": 3, "cp": "sc_pensamiento_social", "cn": "", "e": "En muchas zonas de la región donde se ubica la estación D, las personas y las mercancías se movilizan principalmente en lanchas por los ríos. ¿Qué característica del espacio geográfico ayuda a explicar esta práctica?", "f": "Servicio Geológico Colombiano (2020); IDEAM, región Pacífica", "vis": "", "o": [["A", "La presencia de las nieves perpetuas de la Sierra Nevada de Santa Marta.", "La Sierra Nevada de Santa Marta está en la región Caribe, no en la Pacífica.", false], ["B", "La gran extensión de llanuras secas dedicadas a la ganadería extensiva de sabana.", "Las llanuras de sabana ganadera son propias de la Orinoquía, no de una región con 8.500 mm de lluvia al año.", false], ["C", "La abundancia de ríos caudalosos y de selva húmeda, que dificulta construir carreteras.", "Las lluvias intensas alimentan ríos caudalosos (Atrato, San Juan, Baudó) y mantienen una selva húmeda en suelos inestables; por eso las vías terrestres son escasas y el río es el principal medio de transporte.", true], ["D", "La existencia de grandes desiertos y dunas que impiden el paso de vehículos por tierra.", "La región Pacífica no tiene desiertos; es una de las zonas más húmedas del planeta.", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "s11-2", "ses": 1, "ind": "Pisos térmicos en la región Andina", "tt": "", "texto": "En un recorrido de apenas 60 kilómetros por una carretera de la cordillera Oriental, un viajero observa cultivos de caña de azúcar y plátano en el valle, cafetales en las laderas intermedias y cultivos de papa cerca de los páramos.", "vis": "", "items": [{"id": "SCB-130", "niv": 1, "cp": "sc_pensamiento_social", "cn": "", "e": "¿Qué explica principalmente la variedad de cultivos en una distancia tan corta?", "f": "Concepto de pisos térmicos; Servicio Geológico Colombiano (2020)", "vis": "", "o": [["A", "Los cambios de temperatura asociados a la altitud, conocidos como pisos térmicos.", "En las cordilleras, la temperatura disminuye a medida que aumenta la altitud; cada piso térmico (cálido, templado, frío, páramo) favorece cultivos distintos.", true], ["B", "La cantidad de horas de luz solar, que es mucho mayor en el valle que en las laderas.", "En una distancia tan corta y a la misma latitud, la duración del día es prácticamente igual; lo que cambia con la altitud es la temperatura.", false], ["C", "Los distintos tipos de propiedad de la tierra en el valle y en la montaña.", "La forma de propiedad puede influir en el tamaño de los cultivos, pero no en qué plantas pueden crecer; eso depende de la temperatura, que varía con la altitud.", false], ["D", "La distancia de cada zona a los mercados de las grandes ciudades.", "Las tres franjas están a pocos kilómetros entre sí; la distancia a los mercados no explica que la papa se dé solo cerca de los páramos y la caña solo en el valle.", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "s11-2", "ses": 1, "ind": "Declaración de los Derechos del Hombre y del Ciudadano (1789)", "tt": "", "texto": "Paráfrasis de algunos artículos de la Declaración de los Derechos del Hombre y del Ciudadano, aprobada por la Asamblea Nacional de Francia en agosto de 1789:\n\n• Los hombres nacen y permanecen libres e iguales en derechos.\n• La soberanía reside esencialmente en la Nación; ninguna persona puede ejercer una autoridad que no emane de ella.\n• Una sociedad en la que no esté asegurada la garantía de los derechos ni determinada la separación de poderes no tiene Constitución.", "vis": "", "items": [{"id": "SCB-133", "niv": 2, "cp": "sc_perspectivas", "cn": "", "e": "¿Contra qué forma de organización política se dirigían principalmente estas ideas?", "f": "Conseil constitutionnel, Declaración de 1789 (arts. 1, 3 y 16)", "vis": "", "o": [["A", "Contra el federalismo de los Estados Unidos, que el gobierno de Francia consideraba en ese momento una amenaza militar para Europa.", "La Declaración no se dirige contra Estados Unidos; de hecho, la independencia estadounidense fue una de sus influencias.", false], ["B", "Contra la monarquía absoluta, en la que el rey concentraba el poder y la sociedad se dividía en estamentos privilegiados.", "Afirmar que la soberanía reside en la Nación, que todos son iguales en derechos y que debe haber separación de poderes cuestiona el poder concentrado del rey y los privilegios de nobleza y clero del Antiguo Régimen.", true], ["C", "Contra el sistema de partidos comunistas que gobernaba Europa oriental.", "Los partidos comunistas en el poder aparecieron en el siglo XX; es un anacronismo.", false], ["D", "Contra la democracia representativa que existía en Francia desde la Edad Media.", "En la Francia anterior a 1789 no existía una democracia representativa; la Declaración buscaba precisamente fundar un orden basado en la soberanía nacional.", false]]}, {"id": "SCB-134", "niv": 3, "cp": "sc_perspectivas", "cn": "", "e": "Una estudiante concluye, a partir solo de este texto, que «en la Francia de 1789 todas las personas gozaron de igualdad de derechos en la práctica». ¿Por qué esta conclusión no está bien sustentada?", "f": "Evaluación de los alcances de una fuente normativa", "vis": "", "o": [["A", "Porque los historiadores no consideran la Declaración una fuente primaria del periodo revolucionario.", "La Declaración es una fuente primaria; su limitación está en lo que puede demostrar, no en su carácter.", false], ["B", "Porque la Declaración establece de manera expresa que los hombres nacen desiguales en derechos.", "Es falso: la Declaración afirma que los hombres nacen libres e iguales en derechos.", false], ["C", "Porque el texto fue escrito en francés y su traducción cambia su sentido.", "El problema no es la traducción: aun en su idioma original, una declaración de principios no prueba cómo se aplicaron.", false], ["D", "Porque una declaración enuncia principios, pero no muestra cómo se aplicaron a cada grupo social.", "Un texto normativo expresa lo que debe ser; para saber si la igualdad se cumplió en la práctica (por ejemplo, para las mujeres o las personas esclavizadas de las colonias) se necesitan otras fuentes.", true]]}]}, {"comp": "sociales_ciudadanas", "sim": "s11-2", "ses": 1, "ind": "Presupuesto participativo municipal", "tt": "", "texto": "Un municipio ficticio destinó $ 800 millones para que la comunidad decida, mediante presupuesto participativo, en qué invertirlos. Solo alcanza para un proyecto. Se presentaron tres propuestas:\n\nJunta de acción comunal del barrio El Prado: construir un polideportivo «para que los jóvenes tengan dónde ocupar su tiempo libre».\n\nJunta de la vereda La Esperanza: arreglar 6 kilómetros de vía terciaria «porque en invierno los camiones no entran y se nos pierden las cosechas de mora».\n\nAsociación de mujeres cabeza de hogar: abrir una guardería comunitaria «para que podamos trabajar o estudiar sabiendo que nuestros hijos están bien cuidados».", "vis": "", "items": [{"id": "SCB-135", "niv": 1, "cp": "sc_perspectivas", "cn": "", "e": "¿Qué supone la junta de la vereda La Esperanza al pedir que se arregle la vía?", "f": "Análisis de perspectivas del caso", "vis": "", "o": [["A", "Que el mal estado de la vía, y no la falta de compradores, hace perder las cosechas.", "La vereda atribuye la pérdida de la mora a que los camiones no entran en invierno; da por hecho que hay quién compre y que el problema es el transporte.", true], ["B", "Que el polideportivo dejaría a la vereda más beneficios económicos que el arreglo de la vía.", "La vereda no compara su propuesta con el polideportivo y, si pensara eso, no pediría la vía.", false], ["C", "Que la mora puede almacenarse por meses sin dañarse mientras pasa el invierno.", "Si la mora pudiera guardarse por meses, no se perdería cuando los camiones no entran; la vereda supone lo contrario.", false], ["D", "Que la guardería comunitaria también debería construirse en la misma vereda.", "La vereda no menciona la guardería; esa propuesta es de la asociación de mujeres.", false]]}, {"id": "SCB-136", "niv": 2, "cp": "sc_perspectivas", "cn": "", "e": "¿Qué tienen en común las tres propuestas?", "f": "Análisis de perspectivas del caso", "vis": "", "o": [["A", "Todas proponen soluciones a los problemas ambientales que enfrenta actualmente el municipio.", "Ninguna de las propuestas tiene como fin resolver un problema ambiental.", false], ["B", "Todas rechazan el mecanismo de presupuesto participativo.", "Al contrario: las tres participan en el mecanismo presentando su propuesta.", false], ["C", "Todas responden a una necesidad del propio grupo y compiten por los mismos recursos limitados.", "Cada organización plantea una necesidad de su comunidad (recreación, transporte de cosechas, cuidado infantil), y como solo alcanza para un proyecto, compiten por el mismo dinero.", true], ["D", "Todas buscan beneficiar principalmente a la población rural y campesina que vive en las veredas del municipio.", "Solo la propuesta de la vereda se dirige a la población rural; el polideportivo es para un barrio.", false]]}, {"id": "SCB-137", "niv": 1, "cp": "sc_reflexivo_sistemico", "cn": "", "e": "Si se elige arreglar la vía de la vereda, ¿cuál sería un efecto económico esperado?", "f": "Análisis de efectos de una intervención", "vis": "", "o": [["A", "Mayor posibilidad de que las madres de la asociación puedan estudiar.", "Ese sería un efecto de la guardería, no del arreglo de la vía.", false], ["B", "Menores pérdidas de cosechas y menores costos de transporte para los productores.", "Con una vía transitable, los camiones pueden entrar todo el año; los productores pierden menos cosecha y gastan menos en sacarla.", true], ["C", "Una reducción inmediata del número de concejales que integran el concejo del municipio.", "El arreglo de una vía no modifica la composición del concejo.", false], ["D", "Más espacios para que los jóvenes del barrio El Prado practiquen deporte.", "Ese sería un efecto del polideportivo, no de la vía.", false]]}, {"id": "SCB-138", "niv": 2, "cp": "sc_reflexivo_sistemico", "cn": "", "e": "Si se elige la guardería comunitaria, ¿qué relación entre dimensiones se puede esperar?", "f": "Análisis de relaciones entre dimensiones", "vis": "", "o": [["A", "Un efecto social (cuidado de los niños) ligado a uno territorial (mejores vías de acceso a la vereda).", "El cuidado de los niños sí es un efecto de la guardería, pero las mejores vías corresponden a la propuesta de la vereda, no a esta.", false], ["B", "Un efecto cultural (nuevas actividades para los niños) ligado a uno ambiental (menos contaminación en el barrio).", "Las actividades infantiles podrían darse, pero nada en el caso relaciona la guardería con la contaminación del barrio; la relación esperable es con el trabajo de las madres.", false], ["C", "Un efecto político (apoyo electoral al alcalde) ligado a uno social (más niños con cuidado diario).", "El cuidado de los niños sí es esperable, pero el caso no permite deducir un efecto electoral; la relación que se sigue del texto es con el trabajo de las madres.", false], ["D", "Un efecto social (cuidado de los niños) ligado a uno económico (más madres pueden trabajar).", "La guardería atiende una necesidad social de cuidado y, al liberar tiempo de las madres, permite que trabajen o estudien, con efectos en los ingresos del hogar.", true]]}]}, {"comp": "sociales_ciudadanas", "sim": "s11-2", "ses": 1, "ind": "Trabajo en plataformas digitales", "tt": "", "texto": "En una ciudad ficticia se debate sobre las personas que hacen domicilios a través de aplicaciones digitales.\n\nVocera de una empresa de aplicaciones: «Ofrecemos ingresos a quien los necesite, sin horarios fijos. Si nos obligan a contratar a todos con salario fijo, tendremos que reducir el número de repartidores».\n\nRepartidor: «Trabajo diez horas diarias y si tengo un accidente en la moto nadie me responde. No pido un jefe encima, pido protección».\n\nDueña de un restaurante: «Gracias a los domicilios sobreviví a la crisis, pero la comisión que me cobra la aplicación es muy alta».\n\nUna encuesta ficticia preguntó a 50 repartidores de esa ciudad por la razón principal para trabajar en aplicaciones:", "vis": "<div class=\"vfig\"><svg class=\"vg\" viewBox=\"0 0 560 320\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Gráfica 4. Razón principal para trabajar en aplicaciones (50 repartidores de una ciudad)\" font-family=\"Arial, sans-serif\" font-size=\"12\"><rect width=\"560\" height=\"320\" fill=\"#ffffff\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"13\" fill=\"#1d2433\">Gráfica 4. Razón principal para trabajar en aplicaciones (50 repartidores de una ciudad)<\/text><line x1=\"60\" y1=\"258.0\" x2=\"540\" y2=\"258.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"262.0\" text-anchor=\"end\" fill=\"#3a4356\">0<\/text><line x1=\"60\" y1=\"202.5\" x2=\"540\" y2=\"202.5\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"206.5\" text-anchor=\"end\" fill=\"#3a4356\">5<\/text><line x1=\"60\" y1=\"147.0\" x2=\"540\" y2=\"147.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"151.0\" text-anchor=\"end\" fill=\"#3a4356\">10<\/text><line x1=\"60\" y1=\"91.5\" x2=\"540\" y2=\"91.5\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"95.5\" text-anchor=\"end\" fill=\"#3a4356\">15<\/text><line x1=\"60\" y1=\"36.0\" x2=\"540\" y2=\"36.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"40.0\" text-anchor=\"end\" fill=\"#3a4356\">20<\/text><line x1=\"60\" y1=\"258\" x2=\"540\" y2=\"258\" stroke=\"#3a4356\"/><line x1=\"60\" y1=\"258\" x2=\"60\" y2=\"36\" stroke=\"#3a4356\"/><text transform=\"translate(14,147.0) rotate(-90)\" text-anchor=\"middle\" fill=\"#3a4356\">Número de repartidores<\/text><text x=\"300.0\" y=\"312\" text-anchor=\"middle\" fill=\"#3a4356\">Razón<\/text><text x=\"120.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Flexibilidad de horario<\/text><text x=\"240.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">No encontró otro empleo<\/text><text x=\"360.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Complementar ingresos<\/text><text x=\"480.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Otra<\/text><rect x=\"78.0\" y=\"58.2\" width=\"84.0\" height=\"199.8\" fill=\"#1660a8\"/><text x=\"120.0\" y=\"54.2\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">18<\/text><rect x=\"198.0\" y=\"36.0\" width=\"84.0\" height=\"222.0\" fill=\"#1660a8\"/><text x=\"240.0\" y=\"32.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">20<\/text><rect x=\"318.0\" y=\"158.1\" width=\"84.0\" height=\"99.9\" fill=\"#1660a8\"/><text x=\"360.0\" y=\"154.1\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">9<\/text><rect x=\"438.0\" y=\"224.7\" width=\"84.0\" height=\"33.3\" fill=\"#1660a8\"/><text x=\"480.0\" y=\"220.7\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">3<\/text><\/svg><\/div>", "items": [{"id": "SCB-143", "niv": 1, "cp": "sc_perspectivas", "cn": "", "e": "¿Qué reclama principalmente el repartidor?", "f": "Análisis de perspectivas del caso", "vis": "", "o": [["A", "Tener un jefe que le asigne horarios fijos.", "El repartidor dice expresamente «No pido un jefe encima».", false], ["B", "Que la aplicación cobre menos comisión a los restaurantes.", "La queja por la comisión es de la dueña del restaurante.", false], ["C", "Contar con respaldo si sufre un accidente u otro riesgo en su trabajo.", "El repartidor señala que si tiene un accidente nadie le responde y afirma: «pido protección».", true], ["D", "Que se reduzca el número total de repartidores que trabajan en la ciudad.", "La reducción de repartidores es una consecuencia que plantea la vocera de la empresa, no una petición del repartidor.", false]]}, {"id": "SCB-144", "niv": 3, "cp": "sc_perspectivas", "cn": "", "e": "Un columnista afirma: «Todas las personas que trabajan en aplicaciones lo hacen porque prefieren la flexibilidad». ¿Qué se puede decir de esta afirmación a partir de la gráfica?", "f": "Datos ficticios de la gráfica; evaluación de generalizaciones", "vis": "", "o": [["A", "Que no se sostiene: solo 18 de 50 eligieron la flexibilidad, y una encuesta de una ciudad no basta para hablar de todos.", "La flexibilidad fue la razón del 36 % de los encuestados (18 de 50); además, una muestra pequeña de una sola ciudad no permite generalizar a todos los trabajadores de aplicaciones.", true], ["B", "Que no se puede evaluar, porque la gráfica no muestra cuántas personas fueron encuestadas.", "La gráfica sí indica que se encuestó a 50 repartidores, y los valores suman 50.", false], ["C", "Que se confirma, porque la flexibilidad de horario aparece entre las razones mencionadas por los repartidores encuestados.", "Que la flexibilidad aparezca como una razón no prueba que sea la razón de todos; 32 de los 50 encuestados dieron otra.", false], ["D", "Que se confirma, porque la mayor parte de los encuestados afirmó que no había encontrado ningún otro empleo en la ciudad.", "No haber encontrado otro empleo es una razón distinta de la flexibilidad (20 de 50, que además no son la mayoría); ese dato contradice la afirmación en lugar de confirmarla.", false]]}, {"id": "SCB-145", "niv": 2, "cp": "sc_reflexivo_sistemico", "cn": "", "e": "Si se aprueba una norma que obliga a las empresas de aplicaciones a pagar los aportes a la seguridad social de los repartidores, ¿qué combinación de efectos es coherente con las opiniones del caso?", "f": "Análisis de efectos de una intervención", "vis": "", "o": [["A", "Mayor protección para los repartidores y posible reducción del número de repartidores vinculados.", "La norma responde a la petición de protección del repartidor; la vocera advierte que, con mayores costos, la empresa podría reducir el número de repartidores.", true], ["B", "Menores costos para las empresas de aplicaciones y más ingresos netos para los repartidores.", "Pagar los aportes aumenta los costos de las empresas; no los reduce.", false], ["C", "Mayor protección para los repartidores y aumento del número de repartidores, porque el trabajo sería más atractivo.", "La vocera advierte lo contrario: con más costos, la empresa reduciría el número de repartidores.", false], ["D", "Mayor protección para los restaurantes y una reducción de la comisión que les cobra la aplicación.", "La norma se refiere a la seguridad social de los repartidores; no regula las comisiones de los restaurantes.", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "s11-2", "ses": 1, "ind": "Deforestación en la Amazonía", "tt": "", "texto": "Un informe ficticio sobre un municipio amazónico describe esta cadena: personas que buscan tierra tumban el bosque, siembran pasto y meten ganado; luego venden o arriendan los predios para ganadería extensiva. Al desaparecer el bosque, se pierden especies, los ríos cercanos llevan más sedimentos y las comunidades indígenas vecinas ven reducidas sus zonas de caza y recolección.", "vis": "", "items": [{"id": "SCB-146", "niv": 1, "cp": "sc_reflexivo_sistemico", "cn": "", "e": "Según el informe, ¿qué relación existe entre la ganadería extensiva y las comunidades indígenas vecinas?", "f": "Análisis de relaciones entre dimensiones", "vis": "", "o": [["A", "La ganadería da empleo a las comunidades, lo que compensa la pérdida de sus zonas de caza.", "El informe no menciona empleos para las comunidades indígenas; solo señala que pierden zonas de caza y recolección.", false], ["B", "Las comunidades indígenas tumban el bosque para sembrar pasto y criar ganado.", "Según el informe, quienes tumban el bosque son personas que buscan tierra; las comunidades indígenas son afectadas, no causantes.", false], ["C", "La ganadería afecta a las comunidades principalmente por los sedimentos que llegan a sus ríos.", "El informe menciona los sedimentos, pero el efecto que atribuye a las comunidades es la reducción de sus zonas de caza y recolección.", false], ["D", "La ganadería reemplaza el bosque del que dependen las comunidades para cazar y recolectar.", "La tala para sembrar pasto elimina el bosque; así, una actividad económica genera un efecto ambiental que a su vez afecta la vida de las comunidades indígenas.", true]]}, {"id": "SCB-147", "niv": 3, "cp": "sc_reflexivo_sistemico", "cn": "", "e": "Una entidad ambiental propone pagar a las familias campesinas de la zona por conservar el bosque que aún queda en sus predios. ¿Cuál es la lógica de esta propuesta?", "f": "Análisis de modelos de decisión ambiental (incentivos económicos)", "vis": "", "o": [["A", "Compensar a las familias por las pérdidas que les causa la ganadería extensiva en sus predios.", "El pago no es una indemnización por pérdidas; se entrega a cambio de conservar el bosque.", false], ["B", "Hacer que conservar el bosque genere ingresos, para que talarlo deje de ser la opción más rentable.", "Si el bosque en pie produce un ingreso, las familias tienen un incentivo económico para conservarlo; la propuesta busca unir la dimensión económica con la ambiental.", true], ["C", "Cobrar a quienes ya talaron el bosque para que paguen los daños ambientales causados.", "La propuesta paga a quienes conservan; no cobra a quienes talaron.", false], ["D", "Financiar la compra de ganado para que las familias aumenten su producción de leche y carne.", "Pagar por conservar busca justamente que el bosque no se convierta en potrero para ganado.", false]]}]}, {"comp": "ciencias_naturales", "sim": "s11-2", "ses": 1, "ind": "Herencia de la forma de la semilla en la arveja", "tt": "", "texto": "En la arveja, la forma de la semilla depende de un gen con dos alelos. El alelo R es dominante y produce semillas lisas; el alelo r es recesivo y produce semillas rugosas. Por tanto, los individuos RR y Rr tienen semillas lisas, y solo los individuos rr tienen semillas rugosas.", "vis": "", "items": [{"id": "CNB-101", "niv": 1, "cp": "cn_uso_comprensivo", "cn": "biologico", "e": "Si se cruza una planta de arveja Rr con una planta rr, ¿qué porcentaje de la descendencia se espera que tenga semillas rugosas?", "f": "Leyes de Mendel: cruce monohíbrido de prueba", "vis": "", "o": [["A", "0 %.", "Ese resultado corresponde a un cruce RR × rr, en el que todos los descendientes son Rr; aquí un progenitor sí aporta el alelo r.", false], ["B", "25 %.", "Es la proporción de descendientes rr en un cruce Rr × Rr, no en el cruce Rr × rr planteado.", false], ["C", "50 %.", "El progenitor Rr produce gametos R y r en igual proporción, y el progenitor rr solo produce gametos r; la mitad de los descendientes será Rr (lisa) y la otra mitad rr (rugosa).", true], ["D", "75 %.", "Confunde el cruce con Rr × Rr y además toma la fracción de semillas lisas (3/4) como si fuera la de rugosas.", false]]}, {"id": "CNB-102", "niv": 2, "cp": "cn_indagacion", "cn": "biologico", "e": "Para conocer el genotipo de dos plantas de arveja de semilla lisa, P1 y P2, un investigador cruzó cada una con una planta de semilla rugosa (rr). Obtuvo los resultados de la tabla. ¿Qué conclusión es la más consistente con estos datos?", "f": "Cruce de prueba (Mendel)", "vis": "<table class=\"vt\"><caption>Tabla 6. Descendencia de los cruces con una planta rr<\/caption><thead><tr><th>Cruce<\/th><th>Descendientes de semilla lisa<\/th><th>Descendientes de semilla rugosa<\/th><\/tr><\/thead><tbody><tr><td>P1 × rr<\/td><td>61<\/td><td>0<\/td><\/tr><tr><td>P2 × rr<\/td><td>39<\/td><td>41<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Datos ficticios.<\/div>", "o": [["A", "Ambas plantas son heterocigotas (Rr).", "Si P1 fuera Rr se esperaría alrededor de la mitad de descendientes con semilla rugosa, y P1 no tuvo ninguno.", false], ["B", "P1 es heterocigota (Rr) y P2 es homocigota dominante (RR).", "Invierte los genotipos: un progenitor RR cruzado con rr solo produce descendientes de semilla lisa, que es lo que ocurrió con P1, no con P2.", false], ["C", "P1 es homocigota dominante (RR) y P2 es heterocigota (Rr).", "Si P1 fuera Rr, cerca de la mitad de sus 61 descendientes serían rugosos; no apareció ninguno, lo que indica RR. P2 dio una proporción cercana a 1:1 (39:41), que es lo esperado para Rr × rr.", true], ["D", "Ambas plantas son homocigotas dominantes (RR).", "Si P2 fuera RR, todos sus descendientes con la planta rr tendrían semillas lisas, pero 41 fueron rugosas.", false]]}, {"id": "CNB-103", "niv": 3, "cp": "cn_explicacion", "cn": "biologico", "e": "Dos plantas de arveja de semilla lisa se cruzan entre sí y algunos de sus descendientes tienen semillas rugosas. ¿Cuál es la explicación de este resultado?", "f": "Leyes de Mendel: segregación de alelos", "vis": "", "o": [["A", "Los descendientes de semilla rugosa son Rr, pero el ambiente impidió que el alelo R se expresara en ellos.", "Según el texto, los individuos Rr tienen semillas lisas; las semillas rugosas indican genotipo rr.", false], ["B", "Ambos progenitores eran Rr y cada uno aportó un alelo recesivo (r) a esos descendientes.", "Las plantas Rr tienen semillas lisas pero portan el alelo recesivo; si ambas aportan r, el descendiente es rr y tiene semillas rugosas (en promedio, 1 de cada 4).", true], ["C", "Los progenitores eran RR, y las semillas rugosas aparecieron por una mutación nueva en cada descendiente rugoso.", "Varias mutaciones independientes idénticas son muy improbables; el resultado se explica con alelos que ya portaban los progenitores.", false], ["D", "Un progenitor era RR y el otro Rr, y basta que el descendiente reciba un alelo r para tener semillas rugosas.", "El alelo r es recesivo: un descendiente con un solo alelo r (Rr) tiene semillas lisas; además, RR × Rr no produce plantas rr.", false]]}]}, {"comp": "ciencias_naturales", "sim": "s11-2", "ses": 1, "ind": "Red alimentaria de un manglar", "tt": "", "texto": "En un manglar del Pacífico colombiano, un grupo de biólogos registró las siguientes relaciones alimentarias, simplificadas en la tabla.", "vis": "<table class=\"vt\"><caption>Tabla 7. Relaciones alimentarias en el manglar<\/caption><thead><tr><th>Organismo<\/th><th>Se alimenta de<\/th><\/tr><\/thead><tbody><tr><td>Mangle<\/td><td>Produce su alimento (fotosíntesis)<\/td><\/tr><tr><td>Fitoplancton<\/td><td>Produce su alimento (fotosíntesis)<\/td><\/tr><tr><td>Cangrejo<\/td><td>Hojas de mangle<\/td><\/tr><tr><td>Pez pequeño<\/td><td>Fitoplancton<\/td><\/tr><tr><td>Mapache<\/td><td>Cangrejos<\/td><\/tr><tr><td>Garza<\/td><td>Cangrejos y peces pequeños<\/td><\/tr><tr><td>Babilla<\/td><td>Garzas y peces pequeños<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Red simplificada con fines didácticos.<\/div>", "items": [{"id": "CNB-106", "niv": 1, "cp": "cn_uso_comprensivo", "cn": "biologico", "e": "Según la tabla, ¿cuál de estos organismos ocupa dos niveles tróficos distintos en la red?", "f": "Niveles tróficos en una red alimentaria", "vis": "", "o": [["A", "La babilla.", "Al comer peces pequeños (consumidores primarios) es consumidor secundario, y al comer garzas (consumidores secundarios) es consumidor terciario.", true], ["B", "El cangrejo.", "El cangrejo solo come hojas de mangle (un productor); es únicamente consumidor primario.", false], ["C", "La garza.", "La garza come cangrejos y peces pequeños, que son ambos consumidores primarios; por eso solo es consumidor secundario.", false], ["D", "El mapache.", "El mapache solo come cangrejos, que son consumidores primarios; es únicamente consumidor secundario.", false]]}, {"id": "CNB-107", "niv": 3, "cp": "cn_explicacion", "cn": "biologico", "e": "Si una enfermedad eliminara casi todos los cangrejos del manglar, ¿cuál sería el efecto más probable a corto plazo sobre la red?", "f": "Dinámica de redes tróficas", "vis": "", "o": [["A", "El fitoplancton disminuiría, porque los cangrejos lo producen.", "El fitoplancton es un productor; no depende de los cangrejos para existir.", false], ["B", "Los peces pequeños aumentarían, porque las garzas dejarían de comerlos.", "Ocurriría lo contrario: sin cangrejos, las garzas dependerían más de los peces pequeños como alimento.", false], ["C", "Las babillas aumentarían, porque tendrían más garzas disponibles para cazar.", "Las garzas perderían una de sus fuentes de alimento, así que no habría más garzas; la babilla no se beneficiaría.", false], ["D", "Los mapaches disminuirían, porque los cangrejos son su único alimento.", "Según la tabla, los mapaches solo comen cangrejos; al desaparecer su único recurso, su población se reduciría.", true]]}]}, {"comp": "ciencias_naturales", "sim": "s11-2", "ses": 1, "ind": "Circuitos en serie y en paralelo", "tt": "", "texto": "Una batería de 12 V se conecta a dos resistencias, R1 = 6 Ω y R2 = 12 Ω, conectadas en paralelo. En un circuito en paralelo, cada rama recibe el voltaje completo de la fuente, y la corriente total es la suma de las corrientes de las ramas. Según la ley de Ohm, I = V / R.", "vis": "", "items": [{"id": "CNB-113", "niv": 2, "cp": "cn_uso_comprensivo", "cn": "fisico", "e": "¿Cuál es la corriente total que entrega la batería?", "f": "Ley de Ohm y circuitos en paralelo", "vis": "", "o": [["A", "0,67 A.", "Se obtiene al sumar las resistencias como si estuvieran en serie (12 V ÷ 18 Ω), pero están en paralelo.", false], ["B", "1 A.", "Es solo la corriente de la rama de R2 (12 V ÷ 12 Ω); falta sumar la de R1.", false], ["C", "2 A.", "Es solo la corriente de la rama de R1 (12 V ÷ 6 Ω); falta sumar la de R2.", false], ["D", "3 A.", "I1 = 12 ÷ 6 = 2 A e I2 = 12 ÷ 12 = 1 A; la corriente total es 2 A + 1 A = 3 A.", true]]}, {"id": "CNB-114", "niv": 3, "cp": "cn_explicacion", "cn": "fisico", "e": "En una casa, un bombillo de 60 W y otro de 100 W están conectados en paralelo a una red de 120 V. ¿Cuál afirmación es correcta?", "f": "Circuitos en paralelo: voltaje, corriente y potencia", "vis": "", "o": [["A", "El bombillo de 100 W recibe más voltaje, porque consume más potencia.", "En paralelo ambas ramas reciben el voltaje completo de la red, 120 V.", false], ["B", "Por los dos bombillos circula la misma corriente, porque están conectados a la misma fuente.", "Corriente igual en todos los elementos es propia de los circuitos en serie; en paralelo cada rama tiene su propia corriente.", false], ["C", "Ambos reciben 120 V, y por el bombillo de 100 W circula más corriente.", "En paralelo el voltaje es el mismo en cada rama; como P = V·I, con igual voltaje el de mayor potencia lleva más corriente (100/120 A frente a 60/120 A).", true], ["D", "El bombillo de 60 W tiene menor resistencia, y por eso consume menos potencia.", "Con igual voltaje, P = V²/R: el de menor potencia (60 W) tiene mayor resistencia, no menor.", false]]}, {"id": "CNB-115", "niv": 2, "cp": "cn_indagacion", "cn": "fisico", "e": "Una estudiante aplicó distintos voltajes a un conductor metálico, a temperatura constante, y midió la corriente. ¿Qué conclusión se apoya en los datos de la gráfica?", "f": "Ley de Ohm: análisis de gráficas", "vis": "<div class=\"vfig\"><svg class=\"vg\" viewBox=\"0 0 560 320\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Gráfica 5. Corriente en el conductor según el voltaje\" font-family=\"Arial, sans-serif\" font-size=\"12\"><rect width=\"560\" height=\"320\" fill=\"#ffffff\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"13\" fill=\"#1d2433\">Gráfica 5. Corriente en el conductor según el voltaje<\/text><line x1=\"60\" y1=\"258.0\" x2=\"540\" y2=\"258.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"262.0\" text-anchor=\"end\" fill=\"#3a4356\">0<\/text><line x1=\"60\" y1=\"202.5\" x2=\"540\" y2=\"202.5\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"206.5\" text-anchor=\"end\" fill=\"#3a4356\">0,5<\/text><line x1=\"60\" y1=\"147.0\" x2=\"540\" y2=\"147.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"151.0\" text-anchor=\"end\" fill=\"#3a4356\">1<\/text><line x1=\"60\" y1=\"91.5\" x2=\"540\" y2=\"91.5\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"95.5\" text-anchor=\"end\" fill=\"#3a4356\">1,5<\/text><line x1=\"60\" y1=\"36.0\" x2=\"540\" y2=\"36.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"40.0\" text-anchor=\"end\" fill=\"#3a4356\">2<\/text><line x1=\"60\" y1=\"258\" x2=\"540\" y2=\"258\" stroke=\"#3a4356\"/><line x1=\"60\" y1=\"258\" x2=\"60\" y2=\"36\" stroke=\"#3a4356\"/><text transform=\"translate(14,147.0) rotate(-90)\" text-anchor=\"middle\" fill=\"#3a4356\">Corriente (A)<\/text><text x=\"300.0\" y=\"312\" text-anchor=\"middle\" fill=\"#3a4356\">Voltaje (V)<\/text><text x=\"60.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">0<\/text><text x=\"180.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">2<\/text><text x=\"300.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">4<\/text><text x=\"420.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">6<\/text><text x=\"540.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">8<\/text><circle cx=\"60.0\" cy=\"258.0\" r=\"4\" fill=\"#1660a8\"/><circle cx=\"120.0\" cy=\"230.2\" r=\"4\" fill=\"#1660a8\"/><circle cx=\"180.0\" cy=\"202.5\" r=\"4\" fill=\"#1660a8\"/><circle cx=\"300.0\" cy=\"147.0\" r=\"4\" fill=\"#1660a8\"/><circle cx=\"420.0\" cy=\"91.5\" r=\"4\" fill=\"#1660a8\"/><circle cx=\"540.0\" cy=\"36.0\" r=\"4\" fill=\"#1660a8\"/><\/svg><\/div>", "o": [["A", "La corriente es proporcional al voltaje y la resistencia es de 4 Ω.", "Los puntos forman una recta que pasa por el origen y V / I es siempre 4 (por ejemplo, 8 V ÷ 2 A = 4 Ω).", true], ["B", "La resistencia del conductor aumenta a medida que aumenta el voltaje aplicado por la fuente.", "El cociente V / I es el mismo (4 Ω) para todos los puntos, así que la resistencia no cambia.", false], ["C", "La corriente es inversamente proporcional al voltaje.", "La corriente aumenta cuando aumenta el voltaje; no es una relación inversa.", false], ["D", "La resistencia del conductor es de 0,25 Ω.", "0,25 es el cociente I / V; la resistencia es V / I.", false]]}]}, {"comp": "ciencias_naturales", "sim": "s11-2", "ses": 1, "ind": "pH de sustancias de uso cotidiano", "tt": "", "texto": "En una práctica de laboratorio, un grupo de estudiantes midió el pH de varias sustancias de uso diario. Recuerde que una disminución de una unidad de pH corresponde a una concentración de iones H⁺ diez veces mayor.", "vis": "<table class=\"vt\"><caption>Tabla 8. pH medido de algunas sustancias<\/caption><thead><tr><th>Sustancia<\/th><th>pH<\/th><\/tr><\/thead><tbody><tr><td>Jugo de limón<\/td><td>2,3<\/td><\/tr><tr><td>Vinagre<\/td><td>3,0<\/td><\/tr><tr><td>Café<\/td><td>5,0<\/td><\/tr><tr><td>Agua pura<\/td><td>7,0<\/td><\/tr><tr><td>Bicarbonato disuelto en agua<\/td><td>8,3<\/td><\/tr><tr><td>Jabón de baño<\/td><td>10,0<\/td><\/tr><tr><td>Blanqueador<\/td><td>12,5<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Valores aproximados medidos en la práctica.<\/div>", "items": [{"id": "CNB-119", "niv": 2, "cp": "cn_uso_comprensivo", "cn": "quimico", "e": "Se mezclan volúmenes iguales de vinagre y de agua pura. ¿Qué valor de pH es el más probable para la mezcla?", "f": "Escala de pH y dilución", "vis": "", "o": [["A", "7,0, porque el agua pura neutraliza el ácido del vinagre.", "El agua diluye el ácido, pero no lo neutraliza; para neutralizarlo se necesita una base.", false], ["B", "Un poco mayor que 3,0, pero menor que 7,0.", "Al diluir, la concentración de iones H⁺ disminuye y el pH sube; pero sigue habiendo ácido, así que la mezcla continúa siendo ácida.", true], ["C", "Menor que 3,0, porque al agregar agua hay más líquido con ácido.", "Agregar agua disminuye la concentración de H⁺, por lo que el pH aumenta, no disminuye.", false], ["D", "Exactamente 5,0, el promedio entre 3,0 y 7,0.", "El pH no se promedia al mezclar; al diluir el ácido a la mitad, el pH sube solo unas décimas.", false]]}, {"id": "CNB-120", "niv": 2, "cp": "cn_uso_comprensivo", "cn": "quimico", "e": "¿Cómo es la concentración de iones H⁺ del vinagre comparada con la del café?", "f": "Escala logarítmica de pH", "vis": "", "o": [["A", "La del café es 100 veces mayor que la del vinagre.", "Invierte la relación: el café tiene mayor pH y, por tanto, menor concentración de H⁺.", false], ["B", "La del vinagre es 1.000 veces mayor que la del café.", "Usa tres factores de 10, pero la diferencia de pH es de solo 2 unidades.", false], ["C", "La del vinagre es 2 veces mayor que la del café.", "Resta los valores de pH (5 − 3 = 2) como si la escala fuera lineal; la escala de pH es logarítmica.", false], ["D", "La del vinagre es 100 veces mayor que la del café.", "Hay 2 unidades de pH de diferencia (5,0 − 3,0); cada unidad equivale a un factor de 10, así que el factor es 10 × 10 = 100.", true]]}, {"id": "CNB-121", "niv": 2, "cp": "cn_explicacion", "cn": "quimico", "e": "Una persona con acidez estomacal toma un antiácido de hidróxido de magnesio, Mg(OH)₂. ¿Por qué este medicamento alivia la acidez?", "f": "Reacciones de neutralización", "vis": "", "o": [["A", "Porque recubre las paredes del estómago e impide que se produzca más ácido.", "El hidróxido de magnesio no actúa como recubrimiento ni detiene la producción de ácido; reacciona químicamente con el ácido ya presente.", false], ["B", "Porque es una base que reacciona con el ácido del estómago y forma una sal y agua.", "Es una neutralización: Mg(OH)₂ + 2 HCl → MgCl₂ + 2 H₂O; al consumirse parte del ácido, el pH del estómago sube.", true], ["C", "Porque aumenta la cantidad de iones H⁺ en el estómago.", "Aumentar los iones H⁺ haría el contenido del estómago más ácido, lo contrario de lo que se busca.", false], ["D", "Porque absorbe el exceso de ácido, como una esponja, sin reaccionar con él.", "El Mg(OH)₂ no retiene el ácido físicamente: es una base que reacciona con él y lo neutraliza.", false]]}]}, {"comp": "ciencias_naturales", "sim": "s11-2", "ses": 1, "ind": "Concentración y solubilidad", "tt": "", "texto": "La concentración porcentual masa/volumen (% m/v) indica los gramos de soluto que hay en 100 mL de solución. La solubilidad indica la máxima cantidad de soluto que se disuelve en cierta cantidad de solvente a una temperatura dada; una solución que contiene esa máxima cantidad está saturada.", "vis": "<div class=\"vfig\"><svg class=\"vg\" viewBox=\"0 0 560 320\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Gráfica 6. Solubilidad de la sal X en agua\" font-family=\"Arial, sans-serif\" font-size=\"12\"><rect width=\"560\" height=\"320\" fill=\"#ffffff\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"13\" fill=\"#1d2433\">Gráfica 6. Solubilidad de la sal X en agua<\/text><line x1=\"60\" y1=\"258.0\" x2=\"540\" y2=\"258.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"262.0\" text-anchor=\"end\" fill=\"#3a4356\">0<\/text><line x1=\"60\" y1=\"202.5\" x2=\"540\" y2=\"202.5\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"206.5\" text-anchor=\"end\" fill=\"#3a4356\">50<\/text><line x1=\"60\" y1=\"147.0\" x2=\"540\" y2=\"147.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"151.0\" text-anchor=\"end\" fill=\"#3a4356\">100<\/text><line x1=\"60\" y1=\"91.5\" x2=\"540\" y2=\"91.5\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"95.5\" text-anchor=\"end\" fill=\"#3a4356\">150<\/text><line x1=\"60\" y1=\"36.0\" x2=\"540\" y2=\"36.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"40.0\" text-anchor=\"end\" fill=\"#3a4356\">200<\/text><line x1=\"60\" y1=\"258\" x2=\"540\" y2=\"258\" stroke=\"#3a4356\"/><line x1=\"60\" y1=\"258\" x2=\"60\" y2=\"36\" stroke=\"#3a4356\"/><text transform=\"translate(14,147.0) rotate(-90)\" text-anchor=\"middle\" fill=\"#3a4356\">g de sal X por 100 g de agua<\/text><text x=\"300.0\" y=\"312\" text-anchor=\"middle\" fill=\"#3a4356\">Temperatura (°C)<\/text><text x=\"108.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">0<\/text><text x=\"204.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">20<\/text><text x=\"300.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">40<\/text><text x=\"396.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">60<\/text><text x=\"492.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">80<\/text><polyline fill=\"none\" stroke=\"#1660a8\" stroke-width=\"2.5\" points=\"108.0,243.6 204.0,222.5 300.0,187.0 396.0,135.9 492.0,70.4\"/><circle cx=\"108.0\" cy=\"243.6\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"108.0\" y=\"235.6\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">13<\/text><circle cx=\"204.0\" cy=\"222.5\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"204.0\" y=\"214.5\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">32<\/text><circle cx=\"300.0\" cy=\"187.0\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"300.0\" y=\"179.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">64<\/text><circle cx=\"396.0\" cy=\"135.9\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"396.0\" y=\"127.9\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">110<\/text><circle cx=\"492.0\" cy=\"70.4\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"492.0\" y=\"62.4\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">169<\/text><\/svg><\/div>", "items": [{"id": "CNB-122", "niv": 1, "cp": "cn_uso_comprensivo", "cn": "quimico", "e": "El suero fisiológico es una solución de cloruro de sodio (NaCl) al 0,9 % m/v. ¿Cuántos gramos de NaCl se necesitan para preparar 250 mL de suero?", "f": "Concentración % m/v", "vis": "", "o": [["A", "0,9 g.", "Toma el porcentaje como si fueran gramos totales, sin tener en cuenta el volumen que
