rresponde a «Esta persona le lleva la comida a la mesa en un restaurante».", false]]}, {"id": "EN1-120", "niv": 2, "cp": "en_p1", "cn": "", "e": "This person grows vegetables and keeps animals on a farm.", "f": "Vocabulario del campo semántico «Profesiones y oficios» (redacción propia)", "vis": "", "o": [["A", "pilot", "«pilot» significa «piloto»: persona que conduce aviones; no corresponde a «Esta persona cultiva verduras y cría animales en una granja».", false], ["B", "nurse", "«nurse» significa «enfermero(a)»: persona que cuida a los pacientes y ayuda a los médicos; no corresponde a «Esta persona cultiva verduras y cría animales en una granja».", false], ["C", "lawyer", "«lawyer» significa «abogado(a)»: persona que asesora sobre la ley y defiende a otros ante un juez; no corresponde a «Esta persona cultiva verduras y cría animales en una granja».", false], ["D", "firefighter", "«firefighter» significa «bombero(a)»: persona que apaga incendios; no corresponde a «Esta persona cultiva verduras y cría animales en una granja».", false], ["E", "waiter", "«waiter» significa «mesero»: persona que lleva la comida a la mesa en un restaurante; no corresponde a «Esta persona cultiva verduras y cría animales en una granja».", false], ["F", "farmer", "Correcta. «farmer» significa «agricultor(a) / granjero(a)»: persona que cultiva la tierra y cría animales. La descripción dice: «Esta persona cultiva verduras y cría animales en una granja».", true], ["G", "librarian", "«librarian» significa «bibliotecario(a)»: persona que organiza y presta libros en una biblioteca; no corresponde a «Esta persona cultiva verduras y cría animales en una granja».", false]]}, {"id": "EN1-121", "niv": 2, "cp": "en_p1", "cn": "", "e": "This person helps doctors and takes care of patients in a hospital.", "f": "Vocabulario del campo semántico «Profesiones y oficios» (redacción propia)", "vis": "", "o": [["A", "pilot", "«pilot» significa «piloto»: persona que conduce aviones; no corresponde a «Esta persona ayuda a los médicos y cuida a los pacientes en un hospital».", false], ["B", "nurse", "Correcta. «nurse» significa «enfermero(a)»: persona que cuida a los pacientes y ayuda a los médicos. La descripción dice: «Esta persona ayuda a los médicos y cuida a los pacientes en un hospital».", true], ["C", "lawyer", "«lawyer» significa «abogado(a)»: persona que asesora sobre la ley y defiende a otros ante un juez; no corresponde a «Esta persona ayuda a los médicos y cuida a los pacientes en un hospital».", false], ["D", "firefighter", "«firefighter» significa «bombero(a)»: persona que apaga incendios; no corresponde a «Esta persona ayuda a los médicos y cuida a los pacientes en un hospital».", false], ["E", "waiter", "«waiter» significa «mesero»: persona que lleva la comida a la mesa en un restaurante; no corresponde a «Esta persona ayuda a los médicos y cuida a los pacientes en un hospital».", false], ["F", "farmer", "«farmer» significa «agricultor(a) / granjero(a)»: persona que cultiva la tierra y cría animales; no corresponde a «Esta persona ayuda a los médicos y cuida a los pacientes en un hospital».", false], ["G", "librarian", "«librarian» significa «bibliotecario(a)»: persona que organiza y presta libros en una biblioteca; no corresponde a «Esta persona ayuda a los médicos y cuida a los pacientes en un hospital».", false]]}, {"id": "EN1-122", "niv": 3, "cp": "en_p1", "cn": "", "e": "This person gives advice about the law and can defend you in court.", "f": "Vocabulario del campo semántico «Profesiones y oficios» (redacción propia)", "vis": "", "o": [["A", "pilot", "«pilot» significa «piloto»: persona que conduce aviones; no corresponde a «Esta persona da consejos sobre la ley y puede defenderlo a usted en un juicio».", false], ["B", "nurse", "«nurse» significa «enfermero(a)»: persona que cuida a los pacientes y ayuda a los médicos; no corresponde a «Esta persona da consejos sobre la ley y puede defenderlo a usted en un juicio».", false], ["C", "lawyer", "Correcta. «lawyer» significa «abogado(a)»: persona que asesora sobre la ley y defiende a otros ante un juez. La descripción dice: «Esta persona da consejos sobre la ley y puede defenderlo a usted en un juicio».", true], ["D", "firefighter", "«firefighter» significa «bombero(a)»: persona que apaga incendios; no corresponde a «Esta persona da consejos sobre la ley y puede defenderlo a usted en un juicio».", false], ["E", "waiter", "«waiter» significa «mesero»: persona que lleva la comida a la mesa en un restaurante; no corresponde a «Esta persona da consejos sobre la ley y puede defenderlo a usted en un juicio».", false], ["F", "farmer", "«farmer» significa «agricultor(a) / granjero(a)»: persona que cultiva la tierra y cría animales; no corresponde a «Esta persona da consejos sobre la ley y puede defenderlo a usted en un juicio».", false], ["G", "librarian", "«librarian» significa «bibliotecario(a)»: persona que organiza y presta libros en una biblioteca; no corresponde a «Esta persona da consejos sobre la ley y puede defenderlo a usted en un juicio».", false]]}]}, {"comp": "ingles", "sim": "s11-2", "ses": 2, "ind": "Parte 2 · Avisos y lugares", "tt": "", "texto": "Read the notices. Where can you see each one? Choose the correct place (A, B or C).", "vis": "", "items": [{"id": "EN1-123", "niv": 1, "cp": "en_p2", "cn": "", "e": "Notice: \"Quiet, please. Exams in progress.\"\n\nWhere can you see this notice?", "f": "Conocimiento pragmático: propósito y lugar del aviso (redacción propia)", "vis": "", "o": [["A", "in a soccer stadium", "En un estadio no se presentan exámenes y el ruido es normal.", false], ["B", "in a school", "Correcta. El aviso dice: «Silencio, por favor. Exámenes en curso». Los exámenes en curso son propios de un colegio; por eso se pide silencio.", true], ["C", "in a supermarket", "En un supermercado no se presentan exámenes.", false]]}, {"id": "EN1-124", "niv": 2, "cp": "en_p2", "cn": "", "e": "Notice: \"Check-out time is 12 noon. Please leave your key at the front desk.\"\n\nWhere can you see this notice?", "f": "Conocimiento pragmático: propósito y lugar del aviso (redacción propia)", "vis": "", "o": [["A", "in an office building", "En un edificio de oficinas no hay hora de «check-out» para entregar una habitación.", false], ["B", "in a hospital", "Un hospital da de alta a los pacientes, pero no les entrega una llave que deban devolver en recepción.", false], ["C", "in a hotel room", "Correcta. El aviso dice: «La hora de salida es a las 12 del mediodía. Por favor deje su llave en la recepción». «Check-out time» es la hora de entregar la habitación de un hotel, y la llave se deja en la recepción.", true]]}, {"id": "EN1-125", "niv": 3, "cp": "en_p2", "cn": "", "e": "Notice: \"Keep your ticket. Pay at the machine before returning to your car.\"\n\nWhere can you see this notice?", "f": "Conocimiento pragmático: propósito y lugar del aviso (redacción propia)", "vis": "", "o": [["A", "in a parking lot", "Correcta. El aviso dice: «Guarde su tiquete. Pague en la máquina antes de volver a su carro». En un parqueadero (parking lot) se guarda el tiquete y se paga en la máquina antes de volver al carro.", true], ["B", "at a bicycle repair store", "En un taller de bicicletas no hay un parqueadero de carros del que se salga con tiquete.", false], ["C", "at a bus stop", "En un paradero de bus no se deja el carro ni se paga un tiquete para volver a él.", false]]}, {"id": "EN1-126", "niv": 2, "cp": "en_p2", "cn": "", "e": "Notice: \"Lifeguard on duty from 8 a.m. to 5 p.m. No swimming after these hours.\"\n\nWhere can you see this notice?", "f": "Conocimiento pragmático: propósito y lugar del aviso (redacción propia)", "vis": "", "o": [["A", "in a shoe store", "En una zapatería no se nada ni hay salvavidas.", false], ["B", "at a soccer stadium", "En un estadio de fútbol no hay agua para nadar.", false], ["C", "at a beach", "Correcta. El aviso dice: «Salvavidas de turno de 8 a. m. a 5 p. m. Prohibido nadar después de esas horas». El salvavidas (lifeguard) y la prohibición de nadar indican una playa.", true]]}, {"id": "EN1-127", "niv": 2, "cp": "en_p2", "cn": "", "e": "Notice: \"Fitting rooms: maximum four items per person.\"\n\nWhere can you see this notice?", "f": "Conocimiento pragmático: propósito y lugar del aviso (redacción propia)", "vis": "", "o": [["A", "in a clothing store", "Correcta. El aviso dice: «Probadores: máximo cuatro prendas por persona». Los «fitting rooms» (probadores) están en las tiendas de ropa, donde se limita el número de prendas.", true], ["B", "in a hotel", "Un hotel tiene habitaciones, no probadores de ropa.", false], ["C", "in a fast food restaurant", "En un restaurante de comida rápida no hay probadores de ropa.", false]]}, {"id": "EN1-128", "niv": 3, "cp": "en_p2", "cn": "", "e": "Notice: \"Out of order. Please use the stairs.\"\n\nWhere can you see this notice?", "f": "Conocimiento pragmático: propósito y lugar del aviso (redacción propia)", "vis": "", "o": [["A", "on a computer screen", "Un computador dañado no se reemplaza usando escaleras.", false], ["B", "next to an elevator", "Correcta. El aviso dice: «Fuera de servicio. Por favor use las escaleras». Si el ascensor está fuera de servicio, se pide usar las escaleras: el aviso va junto al ascensor.", true], ["C", "on a ticket machine", "Si una máquina de tiquetes falla, las escaleras no la reemplazan.", false]]}]}, {"comp": "ingles", "sim": "s11-2", "ses": 2, "ind": "Parte 3 · Conversaciones breves", "tt": "", "texto": "Complete the conversations. Read what the first person says and choose the best answer (A, B or C).", "vis": "", "items": [{"id": "EN1-129", "niv": 1, "cp": "en_p3", "cn": "", "e": "\"Where are you from?\"", "f": "Conocimiento comunicativo: respuesta adecuada en una conversación breve (redacción propia)", "vis": "", "o": [["A", "I'm from Medellín.", "Correcta. «Where are you from?» = «¿De dónde eres?». Responde el origen: «Soy de Medellín».", true], ["B", "I'm a student at a public school.", "Dice la ocupación («soy estudiante de un colegio público»), no el lugar de origen.", false], ["C", "I'm fine, thanks.", "Responde «How are you?» (¿cómo estás?), no de dónde es.", false]]}, {"id": "EN1-130", "niv": 1, "cp": "en_p3", "cn": "", "e": "\"Can I borrow your pen?\"", "f": "Conocimiento comunicativo: respuesta adecuada en una conversación breve (redacción propia)", "vis": "", "o": [["A", "No, it isn't.", "«No, it isn't» responde a una pregunta con «Is it…?», no a una petición con «Can I…?».", false], ["B", "Yes, you can lend it.", "Confunde «borrow» (pedir prestado) con «lend» (prestar): quien presta es el que responde.", false], ["C", "Sure, here you are.", "Correcta. «Can I borrow your pen?» = «¿Me prestas tu lapicero?». Acepta y entrega el objeto: «Claro, aquí tienes».", true]]}, {"id": "EN1-131", "niv": 2, "cp": "en_p3", "cn": "", "e": "\"What does your sister look like?\"", "f": "Conocimiento comunicativo: respuesta adecuada en una conversación breve (redacción propia)", "vis": "", "o": [["A", "She likes pop music and dancing.", "Responde «What does she like?» (le gusta el pop y bailar), no cómo es físicamente.", false], ["B", "She's tall with curly hair.", "Correcta. «What does your sister look like?» = «¿Cómo es tu hermana (físicamente)?». «Look like» pide la apariencia física: «Es alta y de pelo crespo».", true], ["C", "She's very well.", "Responde «How is she?» (cómo está de salud), no su apariencia.", false]]}, {"id": "EN1-132", "niv": 2, "cp": "en_p3", "cn": "", "e": "\"Shall we meet at the park at four?\"", "f": "Conocimiento comunicativo: respuesta adecuada en una conversación breve (redacción propia)", "vis": "", "o": [["A", "I meet at four.", "Presente simple sin sentido para aceptar una propuesta; no dice si está de acuerdo.", false], ["B", "Yes, we met there last Sunday.", "Usa pasado («nos vimos allá el domingo pasado») para responder a un plan futuro.", false], ["C", "Good idea. See you there.", "Correcta. «Shall we meet at the park at four?» = «¿Nos vemos en el parque a las cuatro?». Acepta la propuesta: «Buena idea. Nos vemos allá».", true]]}, {"id": "EN1-133", "niv": 3, "cp": "en_p3", "cn": "", "e": "\"How long have you lived here?\"", "f": "Conocimiento comunicativo: respuesta adecuada en una conversación breve (redacción propia)", "vis": "", "o": [["A", "Two years ago.", "«Ago» indica cuándo ocurrió algo terminado; para presente perfecto se usa «for two years».", false], ["B", "Since 2019.", "Correcta. «How long have you lived here?» = «¿Cuánto tiempo llevas viviendo aquí?». «How long have you…?» pide duración desde un punto: «Desde 2019».", true], ["C", "Next month.", "Indica un momento futuro; no responde cuánto tiempo lleva viviendo allí.", false]]}, {"id": "EN1-134", "niv": 2, "cp": "en_p3", "cn": "", "e": "\"I've lost my keys again!\"", "f": "Conocimiento comunicativo: respuesta adecuada en una conversación breve (redacción propia)", "vis": "", "o": [["A", "Oh no! Where did you last see them?", "Correcta. «I've lost my keys again!» = «¡Perdí las llaves otra vez!». Reacción natural de apoyo: «¡Ay, no! ¿Dónde las viste por última vez?».", true], ["B", "Congratulations! That's wonderful news for you.", "«¡Felicitaciones! Qué noticia tan buena» no corresponde a una mala noticia.", false], ["C", "Yes, they're mine.", "Responde a «Are these your keys?», no a la queja de haberlas perdido.", false]]}]}, {"comp": "ingles", "sim": "s11-2", "ses": 2, "ind": "Carta de una estudiante de intercambio en Canadá", "tt": "", "texto": "Read the text and choose the word that best fills each numbered gap.\n\nDear Grandma,\n\nI have been in Winnipeg for two months now, and I am finally getting used (1) ______ the cold. Yesterday it was minus twenty degrees! My host family is very kind. Their son, Liam, is (2) ______ same age as me, and we go to school together on the bus. School here is different from school in Cali: we (3) ______ wear a uniform, and we can call our teachers by their first names. On Saturday Liam's father is going to teach us (4) ______ to skate on a frozen lake. I am a bit nervous, but I promise (5) ______ tell you all about it next week.\n\nHugs,\nValentina", "vis": "", "items": [{"id": "EN2-201", "niv": 3, "cp": "en_p4", "cn": "", "e": "Gap (1)", "f": "Gramática: get used to + sustantivo", "vis": "", "o": [["A", "with", "«used with» es un calco del español «acostumbrarse con»; en inglés es «used to».", false], ["B", "at", "«used at» no existe como expresión; «get used» siempre va con la preposición «to».", false], ["C", "to", "Correcta: la expresión es «get used to» + sustantivo o -ing (acostumbrarse a): «getting used to the cold».", true]]}, {"id": "EN2-202", "niv": 1, "cp": "en_p4", "cn": "", "e": "Gap (2)", "f": "Gramática: artículos (the same ... as)", "vis": "", "o": [["A", "the", "Correcta: «the same» siempre lleva artículo definido: «the same age as me» (la misma edad que yo).", true], ["B", "an", "«an» se usa antes de sonido vocálico y, además, «same» no admite artículo indefinido.", false], ["C", "a", "«a same» no es correcto; «same» se usa con «the».", false]]}, {"id": "EN2-203", "niv": 1, "cp": "en_p4", "cn": "", "e": "Gap (3)", "f": "Gramática: negación del presente simple", "vis": "", "o": [["A", "doesn't", "«doesn't» es para tercera persona del singular (he, she, it), no para «we».", false], ["B", "don't", "Correcta: negación del presente simple con «we»: «we don't wear a uniform» (no usamos uniforme).", true], ["C", "aren't", "«aren't» es negación de «be»; no se combina con otro verbo en forma base (aren't wear).", false]]}, {"id": "EN2-204", "niv": 2, "cp": "en_p4", "cn": "", "e": "Gap (4)", "f": "Gramática: palabra interrogativa + infinitivo (how to)", "vis": "", "o": [["A", "what", "«what to skate» no tiene sentido: patinar no lleva un objeto que se elija.", false], ["B", "how", "Correcta: «teach someone how to do something» (enseñar a alguien cómo hacer algo): «teach us how to skate».", true], ["C", "which", "«which» requiere elegir entre opciones (which skates to use); aquí no hay un sustantivo que lo complete.", false]]}, {"id": "EN2-205", "niv": 2, "cp": "en_p4", "cn": "", "e": "Gap (5)", "f": "Gramática: verbo + infinitivo (promise to)", "vis": "", "o": [["A", "for", "«for» es preposición; no puede ir seguida de un verbo en forma base (for tell).", false], ["B", "that", "«that» introduciría una oración completa con sujeto (that I will tell you); «that tell» no es gramatical.", false], ["C", "to", "Correcta: «promise» va seguido de infinitivo con to: «I promise to tell you» (prometo contarte).", true]]}]}, {"comp": "ingles", "sim": "s11-2", "ses": 2, "ind": "Texto informativo: biblioteca comunitaria", "tt": "", "texto": "Read the text and choose the word that best fills each numbered gap.\n\nA library for everyone\n\nThe San Isidro Community Library opened in 2019 in an old house near the market. At that time, it had only three hundred books, most of (1) ______ were donated by neighbors. Since then, the collection has grown a lot, and now the library (2) ______ more than four thousand books. Every Saturday, volunteers read stories to young children, (3) ______ teenagers use the computers to do their homework. The library is open to everyone, but visitors (4) ______ return books within two weeks. If the library (5) ______ more money, it would also open on Sundays.", "vis": "", "items": [{"id": "EN2-206", "niv": 3, "cp": "en_p4", "cn": "", "e": "Gap (1)", "f": "Gramática: relativos con cuantificador (most of which)", "vis": "", "o": [["A", "which", "Correcta: tras «most of» se usa el relativo de cosas «which»: «most of which were donated» (la mayoría de los cuales fueron donados).", true], ["B", "whom", "«whom» se refiere a personas; el antecedente son libros (books).", false], ["C", "what", "«what» no funciona como relativo con antecedente; no puede referirse a «three hundred books».", false]]}, {"id": "EN2-207", "niv": 1, "cp": "en_p4", "cn": "", "e": "Gap (2)", "f": "Gramática: concordancia en presente simple", "vis": "", "o": [["A", "has", "Correcta: sujeto singular «the library» + presente simple de «have»: «the library has» (la biblioteca tiene).", true], ["B", "having", "«having» es gerundio; sin auxiliar no puede ser el verbo principal de la oración.", false], ["C", "have", "«have» se usa con I, you, we, they; «the library» es tercera persona del singular.", false]]}, {"id": "EN2-208", "niv": 2, "cp": "en_p4", "cn": "", "e": "Gap (3)", "f": "Gramática: conjunción while frente a la preposición during", "vis": "", "o": [["A", "during", "«during» es preposición y va seguida de un sustantivo (during the afternoon), no de una oración con sujeto y verbo.", false], ["B", "unless", "«unless» (a menos que) expresa condición; no tiene sentido decir que leen cuentos a menos que los adolescentes usen los computadores.", false], ["C", "while", "Correcta: «while» (mientras) une dos oraciones con acciones simultáneas: los voluntarios leen cuentos mientras los adolescentes usan los computadores.", true]]}, {"id": "EN2-209", "niv": 2, "cp": "en_p4", "cn": "", "e": "Gap (4)", "f": "Gramática: verbos modales de obligación", "vis": "", "o": [["A", "should to", "«should» es modal y nunca lleva «to» antes del verbo; lo correcto sería «should return».", false], ["B", "must", "Correcta: el modal «must» (deber) va seguido del verbo en forma base: «visitors must return books» (deben devolver los libros).", true], ["C", "have", "«have» con sentido de obligación necesita «to» (have to return); «have return» no es correcto.", false]]}, {"id": "EN2-210", "niv": 3, "cp": "en_p4", "cn": "", "e": "Gap (5)", "f": "Gramática: segundo condicional", "vis": "", "o": [["A", "will have", "En la cláusula con «if» no se usa «will»; además, no concuerda con «would» en la otra cláusula.", false], ["B", "had", "Correcta: segundo condicional (if + pasado simple, would + verbo): «If the library had more money, it would open» (si tuviera más dinero, abriría).", true], ["C", "has", "«has» (presente) correspondería al primer condicional con «will», no con «would».", false]]}]}, {"comp": "ingles", "sim": "s11-2", "ses": 2, "ind": "Artículo: aplicación para recicladores", "tt": "", "texto": "Read the text and answer the questions.\n\nAn app for the recyclers\n\nSamuel Ortiz, a 17-year-old student from Bucaramanga, noticed something strange in his neighborhood: many families wanted to recycle, but they did not know when the recycling collectors passed by their street. As a result, bags of plastic and paper often stayed on the sidewalk for days.\n\nSamuel had learned some programming in an after-school club, so he decided to create a simple phone app. Collectors use it to share their route each morning, and families receive a message about thirty minutes before the collector arrives on their street.\n\nHe tested the app for three months with twelve collectors and about two hundred homes. According to the collectors, they now pick up almost twice as much material as before, and they spend less time waiting. One of them, Mr. Luis Carreño, says the app has also helped him in another way: \"Now people come out to say hello and give me the bags themselves. I know my neighbors' names for the first time.\"\n\nSamuel does not charge anything for the app. His next goal is to add a map that shows where people can take old batteries and electronic devices, which should not go in regular trash.", "vis": "", "items": [{"id": "EN2-211", "niv": 1, "cp": "en_p5", "cn": "", "e": "What problem did Samuel notice in his neighborhood?", "f": "Párrafo 1", "vis": "", "o": [["A", "Nobody in the area was interested in recycling paper or plastic.", "El texto dice lo contrario: «many families wanted to recycle».", false], ["B", "The collectors refused to take paper and plastic.", "Las bolsas se quedaban en el andén porque nadie sabía cuándo pasaban, no porque los recicladores las rechazaran.", false], ["C", "People did not know the time when recycling was collected.", "Correcta: párrafo 1, las familias «did not know when the recycling collectors passed by their street».", true]]}, {"id": "EN2-212", "niv": 2, "cp": "en_p5", "cn": "", "e": "Where did Samuel learn programming?", "f": "Párrafo 2", "vis": "", "o": [["A", "In a club that meets after classes.", "Correcta: párrafo 2, «in an after-school club» (en un club después del colegio).", true], ["B", "In an online course for teenagers.", "No se menciona ningún curso en línea.", false], ["C", "From one of the recycling collectors.", "Los recicladores usan la aplicación; no le enseñaron a programar.", false]]}, {"id": "EN2-213", "niv": 2, "cp": "en_p5", "cn": "", "e": "What happens before a collector arrives on a street?", "f": "Párrafo 2", "vis": "", "o": [["A", "The collector phones every family.", "No hay llamadas: la aplicación envía un mensaje automáticamente.", false], ["B", "Families are warned about half an hour earlier.", "Correcta: párrafo 2, reciben un mensaje «about thirty minutes before» (unos treinta minutos, media hora antes).", true], ["C", "Families receive a message the night before.", "El mensaje llega unos treinta minutos antes, no la noche anterior.", false]]}, {"id": "EN2-214", "niv": 2, "cp": "en_p5", "cn": "", "e": "According to the collectors, what has changed since they started using the app?", "f": "Párrafo 3", "vis": "", "o": [["A", "They collect nearly double the amount of material.", "Correcta: párrafo 3, «they now pick up almost twice as much material as before» (recogen casi el doble de material).", true], ["B", "They earn twice as much money as they did before the app.", "El texto habla del doble de material, no del doble de dinero.", false], ["C", "They work with two hundred more homes.", "Doscientos hogares fue el total de la prueba, no un aumento.", false]]}, {"id": "EN2-215", "niv": 3, "cp": "en_p5", "cn": "", "e": "What does Mr. Carreño say about the app?", "f": "Párrafo 3", "vis": "", "o": [["A", "It shows him where people can take their old batteries.", "El mapa para pilas es un plan futuro de Samuel, no algo que la app ya haga.", false], ["B", "It makes him wait longer in each street.", "Contradice el párrafo 3: ahora esperan menos («spend less time waiting»).", false], ["C", "It has helped him to meet the people on his route.", "Correcta: dice que ahora la gente sale a saludarlo y que por primera vez sabe los nombres de sus vecinos.", true]]}]}, {"comp": "ingles", "sim": "s11-2", "ses": 2, "ind": "Crónica: club de astronomía escolar", "tt": "", "texto": "Read the text and answer the questions.\n\nNights on the roof\n\nOn the second Friday of every month, the Astronomy Club at Colegio Santa Teresa meets on the school roof after dark. The club was started six years ago by Ms. Gloria Ramírez, a physics teacher, who brought her own telescope from home for the first meeting. Today the club has two telescopes: the old one and a bigger one that the parents' association bought last year.\n\nMeetings begin at 7 p.m. with a short talk by one of the students about a planet, a star or a recent space mission. Then members take turns to look through the telescopes. Ms. Ramírez asks everyone to draw what they see in a notebook, because she believes that drawing helps them observe details they would otherwise miss.\n\nNot every night is successful. \"In the rainy season, we sometimes go up to the roof and see only clouds,\" says Tomás, a member in grade 10. \"Then we go back to the classroom and watch videos about space instead.\"\n\nIn March, the club is organizing an \"Open Sky Night\" for families. Visitors will be able to look at the Moon and, if the weather allows it, at Jupiter and its largest moons.", "vis": "", "items": [{"id": "EN2-216", "niv": 1, "cp": "en_p5", "cn": "", "e": "How often does the club meet?", "f": "Párrafo 1", "vis": "", "o": [["A", "Every Friday.", "No es cada viernes, solo el segundo viernes del mes.", false], ["B", "Twice a month.", "Confunde «second» (segundo viernes) con «dos veces»; se reúnen solo el segundo viernes.", false], ["C", "Once a month.", "Correcta: «On the second Friday of every month» = el segundo viernes de cada mes, es decir, una vez al mes.", true]]}, {"id": "EN2-217", "niv": 1, "cp": "en_p5", "cn": "", "e": "Who bought the bigger telescope?", "f": "Párrafo 1", "vis": "", "o": [["A", "Ms. Ramírez.", "La profesora llevó su propio telescopio, que es el viejo, no el grande.", false], ["B", "The parents' association.", "Correcta: párrafo 1, «a bigger one that the parents' association bought last year» (la asociación de padres).", true], ["C", "The members of the club.", "El texto no dice que los estudiantes compraran ningún telescopio.", false]]}, {"id": "EN2-218", "niv": 2, "cp": "en_p5", "cn": "", "e": "Why does Ms. Ramírez ask members to draw what they see?", "f": "Párrafo 2", "vis": "", "o": [["A", "She thinks it helps them notice more details.", "Correcta: párrafo 2, cree que dibujar les ayuda a observar detalles que de otro modo no verían.", true], ["B", "She wants to show the drawings to the families.", "No se menciona mostrar los dibujos a las familias.", false], ["C", "The telescopes cannot take photographs.", "El texto no habla de fotografías; la razón es pedagógica.", false]]}, {"id": "EN2-219", "niv": 2, "cp": "en_p5", "cn": "", "e": "What does the club do when the sky is cloudy?", "f": "Párrafo 3", "vis": "", "o": [["A", "It watches videos about space in a classroom.", "Correcta: párrafo 3, Tomás dice que vuelven al salón y ven videos sobre el espacio.", true], ["B", "It meets again on the following Friday.", "El texto no dice que repitan la reunión otro día.", false], ["C", "It cancels the meeting and members go home.", "No se van a casa: bajan al salón a ver videos.", false]]}, {"id": "EN2-220", "niv": 3, "cp": "en_p5", "cn": "", "e": "What is true about the \"Open Sky Night\"?", "f": "Párrafo 4", "vis": "", "o": [["A", "It will happen only if the weather is good.", "El buen clima es condición para ver Júpiter, no para que se haga el evento.", false], ["B", "Visitors will be able to observe the Moon.", "Correcta: párrafo 4, «Visitors will be able to look at the Moon»; Júpiter depende del clima, la Luna no.", true], ["C", "Only students in grade 10 can attend it.", "El evento es para familias («for families»); grado 10 es el curso de Tomás.", false]]}]}, {"comp": "ingles", "sim": "s11-2", "ses": 2, "ind": "Relato: la nota en el libro de geografía", "tt": "", "texto": "Read the text and answer the questions. Choose the correct answer (A, B, C or D).\n\nThe note in the geography book\n\nWhen Daniela returned the old geography book to the school library, Mr. Pérez, the librarian, opened it and stopped. Between pages 88 and 89 there was a folded piece of paper, yellow at the edges. \"Is this yours?\" he asked. Daniela shook her head. The note was written in pencil, in neat, careful letters: \"To whoever finds this: I failed this exam twice. The third time, I passed. Don't give up. L.M., 1987.\"\n\nDaniela read it twice. She had borrowed the book because she had a geography exam on Monday, and she had already decided that she would probably fail it again. She had not told anybody, not even her mother.\n\nMr. Pérez smiled. \"You know,\" he said, \"the library keeps the old borrowing cards in a box downstairs. We could look for those initials.\" Daniela wanted to say it didn't matter, but she followed him anyway.\n\nIt took them forty minutes. The card showed that the book had been borrowed in 1987 by Luisa Montaño. Mr. Pérez laughed so loudly that a student at the computers turned around. \"Luisa Montaño,\" he said, \"is the director of this school.\"\n\nOn Monday morning, Daniela walked into the exam room with the yellow note in her pocket. She didn't know if she would pass. But for the first time in weeks, she wasn't sure that she would fail, either.", "vis": "", "items": [{"id": "EN3-119", "niv": 2, "cp": "en_p6", "cn": "", "e": "Before Daniela read the note, how did she feel about her exam?", "f": "Inferencia: párrafo 2", "vis": "", "o": [["A", "She was angry with her geography teacher.", "El texto no menciona al profesor ni ningún enojo.", false], ["B", "She expected to get a bad result.", "Correcta. «she had already decided that she would probably fail it again» (ya había decidido que probablemente volvería a perderlo).", true], ["C", "She was confident that she would pass.", "Lo contrario: pensaba que lo perdería otra vez.", false], ["D", "She was excited to tell her mother about it.", "El texto dice lo contrario: no se lo había contado a nadie, «not even her mother».", false]]}, {"id": "EN3-120", "niv": 1, "cp": "en_p6", "cn": "", "e": "Why did Mr. Pérez suggest looking in the box downstairs?", "f": "Inferencia: párrafo 3", "vis": "", "o": [["A", "He wanted to give the note to the school director.", "Todavía no sabía que L.M. era la directora; lo descubre después.", false], ["B", "He wanted to find a newer copy of the book.", "En la caja hay tarjetas de préstamo, no libros; el objetivo eran las iniciales.", false], ["C", "He wanted to find out who had written the note.", "Correcta. Propone buscar en las tarjetas de préstamo antiguas «those initials» (esas iniciales), es decir, a la persona que firmó L.M.", true], ["D", "He needed to check Daniela's borrowing card.", "Daniela acababa de devolver el libro; las tarjetas que buscan son las viejas, de 1987.", false]]}, {"id": "EN3-121", "niv": 2, "cp": "en_p6", "cn": "", "e": "Why did Mr. Pérez laugh so loudly?", "f": "Inferencia de causa: párrafo 4", "vis": "", "o": [["A", "A student at the computers had told him a joke.", "El estudiante solo se voltea por el ruido de la risa; no causó la risa.", false], ["B", "He was surprised to discover who had written the note.", "Correcta. Se ríe justo al leer el nombre y explica que Luisa Montaño es la directora del colegio: un descubrimiento inesperado.", true], ["C", "He thought Daniela had written the note as a joke.", "Daniela ya había dicho con la cabeza que la nota no era suya, y la risa llega justo al leer el nombre de la tarjeta, no por sospechar de ella.", false], ["D", "He thought the old borrowing card looked funny.", "Lo que provoca la risa es el nombre que aparece, no el aspecto de la tarjeta.", false]]}, {"id": "EN3-122", "niv": 3, "cp": "en_p6", "cn": "", "e": "What does the last sentence suggest about Daniela?", "f": "Inferencia: párrafo 5", "vis": "", "o": [["A", "She had decided not to take the exam.", "Entró al salón del examen; sí lo presentó.", false], ["B", "She was certain that she would get an excellent grade.", "Exageración: el texto dice «She didn't know if she would pass» (no sabía si aprobaría).", false], ["C", "She was still sure that she would fail.", "Lo contrario: precisamente ya no estaba segura de fallar.", false], ["D", "She felt a little more hopeful about the exam.", "Correcta. «she wasn't sure that she would fail, either» (tampoco estaba segura de que fuera a perder): antes daba por hecho el fracaso; ahora tiene algo de esperanza.", true]]}, {"id": "EN3-123", "niv": 3, "cp": "en_p6", "cn": "", "e": "What is the main message of the story?", "f": "Inferencia del tema global", "vis": "", "o": [["A", "Failing at something does not mean you cannot succeed later.", "Correcta. La nota («I failed this exam twice. The third time, I passed») y el hecho de que su autora sea hoy la directora muestran que fracasar no impide triunfar después.", true], ["B", "Geography is the most difficult subject at school.", "El relato no compara materias; la geografía es solo el contexto.", false], ["C", "Students should always ask librarians for help with exams.", "El bibliotecario no ayuda a estudiar; además, «always» generaliza sin apoyo en el texto.", false], ["D", "Libraries should keep their old documents in order.", "Las tarjetas antiguas son solo un recurso de la trama, no el mensaje del relato.", false]]}, {"id": "EN3-124", "niv": 2, "cp": "en_p6", "cn": "", "e": "What can we infer about Luisa Montaño?", "f": "Inferencia: párrafos 1 y 4", "vis": "", "o": [["A", "She knew that Daniela would find the note one day.", "La nota es para cualquier persona; no pudo saber en 1987 quién la leería.", false], ["B", "She hid the note so that Mr. Pérez would find it.", "La nota va dirigida «To whoever finds this» (a quien la encuentre), no al bibliotecario.", false], ["C", "She once had problems with an exam but later reached an important position.", "Correcta. Ella escribió que perdió dos veces el examen, y hoy es la directora del colegio.", true], ["D", "She never had any difficulties at school.", "Su propia nota dice que perdió el examen dos veces.", false]]}]}, {"comp": "ingles", "sim": "s11-2", "ses": 2, "ind": "Texto con espacios: correo a una familia anfitriona", "tt": "", "texto": "Read the text and choose the best word (A, B, C or D) for each gap.\n\nDear Mr. and Mrs. Taylor,\n\nMy name is Andrés and I am the exchange student who will stay (1) ___ you next month. I am seventeen years old and I live in Pasto, a city in the south of Colombia. I am writing to (2) ___ myself and to tell you a little about my habits. On school days I usually wake (3) ___ at 5:00 because my classes start at 6:30. I love soccer and I also play the guitar, but don't worry, I am not very loud! I (4) ___ never traveled outside Colombia, so I am very excited. My mother asked me to tell you that I am allergic (5) ___ peanuts. I am really looking forward to (6) ___ you.\n\nBest wishes,\nAndrés", "vis": "", "items": [{"id": "EN3-125", "niv": 2, "cp": "en_p7", "cn": "", "e": "Gap (1)", "f": "Preposición: stay with", "vis": "", "o": [["A", "at", "«stay at» va seguido de un lugar (stay at a hotel), no de una persona (you).", false], ["B", "by", "«stay by you» significaría «quedarse a su lado (físicamente)»; no expresa alojamiento.", false], ["C", "for", "«stay for you» significaría «quedarse por ustedes / a causa de ustedes», que no es el sentido.", false], ["D", "with", "Correcta. «stay with someone» significa alojarse en casa de alguien: «who will stay with you» (que se quedará con ustedes).", true]]}, {"id": "EN3-126", "niv": 1, "cp": "en_p7", "cn": "", "e": "Gap (2)", "f": "Vocabulario: introduce oneself", "vis": "", "o": [["A", "introduce", "Correcta. «introduce myself» (presentarme) es la expresión para darse a conocer.", true], ["B", "know", "«know myself» significa «conocerme» en sentido personal, no presentarse a otros.", false], ["C", "show", "«show myself» significa «dejarme ver / aparecer», no presentarse por carta.", false], ["D", "meet", "«meet myself» (conocerme a mí mismo) no tiene sentido en este contexto.", false]]}, {"id": "EN3-127", "niv": 1, "cp": "en_p7", "cn": "", "e": "Gap (3)", "f": "Phrasal verb: wake up", "vis": "", "o": [["A", "off", "«wake off» no existe; «off» no forma phrasal verb con «wake».", false], ["B", "up", "Correcta. «wake up» (despertarse): se levanta temprano porque las clases empiezan a las 6:30.", true], ["C", "on", "«wake on» no es un phrasal verb en inglés.", false], ["D", "out", "«wake out» no existe como phrasal verb.", false]]}, {"id": "EN3-128", "niv": 2, "cp": "en_p7", "cn": "", "e": "Gap (4)", "f": "Presente perfecto", "vis": "", "o": [["A", "have", "Correcta. Presente perfecto con «never» para la experiencia hasta hoy: «I have never traveled» (nunca he viajado).", true], ["B", "had", "El pasado perfecto exige un momento pasado de referencia; aquí habla de su experiencia hasta ahora, con consecuencia presente (so I am very excited).", false], ["C", "has", "«has» corresponde a tercera persona (he/she/it); con «I» se usa «have».", false], ["D", "am", "«am never traveled» mezcla «be» con el participio; sería voz pasiva sin sentido.", false]]}, {"id": "EN3-129", "niv": 2, "cp": "en_p7", "cn": "", "e": "Gap (5)", "f": "Adjetivo + preposición", "vis": "", "o": [["A", "with", "«allergic with» es incorrecto, aunque en español se diga «alérgico con» de manera informal.", false], ["B", "of", "«allergic of» es un error frecuente; la preposición correcta es «to».", false], ["C", "for", "«allergic for» no es la preposición que rige este adjetivo.", false], ["D", "to", "Correcta. El adjetivo «allergic» se construye con «to»: «allergic to peanuts» (alérgico al maní).", true]]}, {"id": "EN3-130", "niv": 3, "cp": "en_p7", "cn": "", "e": "Gap (6)", "f": "Look forward to + -ing", "vis": "", "o": [["A", "to meet", "Repetiría «to»: «looking forward to to meet», incorrecto.", false], ["B", "met", "El participio pasado no puede ir después de la preposición «to».", false], ["C", "meeting", "Correcta. En «look forward to», «to» es preposición y va seguida de -ing: «looking forward to meeting you» (con ganas de conocerlos).", true], ["D", "meet", "Error típico: tratar «to» como parte del infinitivo; aquí es preposición.", false]]}]}, {"comp": "ingles", "sim": "s11-2", "ses": 2, "ind": "Texto con espacios: ahorrar agua en casa", "tt": "", "texto": "Read the text and choose the best word (A, B, C or D) for each gap.\n\nSave water, start at home\n\nMost families waste water without (1) ___ it. A faucet that drips all night, a garden hose that someone forgot to turn (2) ___, a washing machine that runs half empty: small habits like these add up. The good news is that saving water is (3) ___ than most people think. First, check your faucets and pipes; a small leak is cheap to (4) ___ but expensive to ignore. Second, collect rainwater in buckets and use it to water plants or clean the patio. Finally, talk to the people you live with. Changes only (5) ___ when everyone in the house agrees with them, (6) ___ make saving water a family project.", "vis": "", "items": [{"id": "EN3-131", "niv": 3, "cp": "en_p7", "cn": "", "e": "Gap (1)", "f": "Preposición + -ing", "vis": "", "o": [["A", "realize", "El infinitivo sin «to» no puede seguir a la preposición «without».", false], ["B", "realizing", "Correcta. Después de una preposición (without) el verbo va en -ing: «without realizing it» (sin darse cuenta).", true], ["C", "realized", "El participio pasado no funciona después de «without» en esta oración.", false], ["D", "to realize", "«without to realize» es un calco del español «sin darse cuenta»; tras preposición se usa -ing.", false]]}, {"id": "EN3-132", "niv": 1, "cp": "en_p7", "cn": "", "e": "Gap (2)", "f": "Phrasal verb: turn off", "vis": "", "o": [["A", "away", "«turn away» significa «apartar la mirada» o «no dejar entrar»; no tiene relación con la manguera.", false], ["B", "down", "«turn down» significa «bajar el volumen» o «rechazar»; no se usa para cerrar el agua.", false], ["C", "off", "Correcta. «turn off» (cerrar/apagar): una manguera que alguien olvidó cerrar.", true], ["D", "out", "«turn out» significa «resultar» o «apagar luces» (BrE), no cerrar una manguera.", false]]}, {"id": "EN3-133", "niv": 1, "cp": "en_p7", "cn": "", "e": "Gap (3)", "f": "Comparativos", "vis": "", "o": [["A", "easier", "Correcta. Comparativo de adjetivo corto terminado en -y: «easy → easier than» (más fácil que).", true], ["B", "more easy", "Con adjetivos de dos sílabas terminados en -y se usa -ier; «more easy» no es la forma estándar.", false], ["C", "easiest", "«easiest» es superlativo; no se combina con «than».", false], ["D", "easy", "Ante «than» se necesita la forma comparativa, no el adjetivo simple.", false]]}, {"id": "EN3-134", "niv": 2, "cp": "en_p7", "cn": "", "e": "Gap (4)", "f": "Vocabulario: fix", "vis": "", "o": [["A", "break", "«cheap to break» (barata de romper) no tiene sentido; la fuga ya es un daño.", false], ["B", "lose", "«lose» (perder) no se aplica a una fuga.", false], ["C", "spend", "«spend» (gastar) necesita un objeto como dinero o tiempo; no tiene sentido con «leak».", false], ["D", "fix", "Correcta. Una fuga pequeña es barata de arreglar (fix) pero cara de ignorar.", true]]}, {"id": "EN3-135", "niv": 3, "cp": "en_p7", "cn": "", "e": "Gap (5)", "f": "Vocabulario: work = funcionar", "vis": "", "o": [["A", "make", "«make» también exige objeto; «changes only make» no tiene sentido.", false], ["B", "work", "Correcta. «work» intransitivo = funcionar: los cambios solo funcionan cuando todos en la casa están de acuerdo.", true], ["C", "do", "«do» necesita complemento (do something); «changes only do» queda incompleto.", false], ["D", "play", "«play» (jugar, tocar) no expresa que los cambios den resultado.", false]]}, {"id": "EN3-136", "niv": 2, "cp": "en_p7", "cn": "", "e": "Gap (6)", "f": "Conectores de consecuencia", "vis": "", "o": [["A", "so", "Correcta. «so» introduce la consecuencia: como los cambios requieren acuerdo, conviértelo en un proyecto familiar.", true], ["B", "unless", "«unless» (a menos que) no puede introducir una orden como «make saving water a family project».", false], ["C", "because", "«because» introduciría una causa, pero «make it a family project» es la consecuencia, no la causa.", false], ["D", "although", "«although» (aunque) expresa contraste y no hay contraste entre las dos ideas.", false]]}]}];

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])).replace(/\^(\([^()]{1,20}\)|[0-9A-Za-z]+(?:,[0-9]+)?)/g, (m, g) => '<sup>' + (g[0] === '(' ? g.slice(1, -1) : g) + '</sup>');
const KEY = 'sim-saber11:' + CFG.clave;
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}
function save(){try{localStorage.setItem(KEY, JSON.stringify(ST))}catch(e){}}
let ST = load();
ST.r = ST.r || {};
$('#tit').textContent = CFG.titulo;
const ITEMS = [];
DATA.forEach(c => c.items.forEach(it => { it.caso = c; ITEMS.push(it); }));
const keyOf = it => it.o.find(o => o[3])[0];
const palabras = t => (t.trim().match(/\S+/g) || []).length;

function justHTML(it){
  const many = it.o.length > 4;
  return '<div class="just">' + it.o.filter(o => !many || o[3] || ST.r[it.id] === o[0]).map(o => `<div><b>${o[0]}.</b> <span class="${o[3]?'okt':'not'}">${o[3]?'Es correcta.':'Es incorrecta.'}</span> ${esc(o[2])}</div>`).join('') +
    `<div class="src">${esc(CFG.competencias[it.cp])} · Referencia: ${esc(it.f)}</div></div>`;
}
function itemHTML(it, n, mode){
  const r = ST.r[it.id];
  const reveal = mode === 'review' || (CFG.modo === 'practica' && r);
  let h = `<div class="item" id="i-${it.id}"><p class="enun"><span class="n">${n}.</span> <span class="niv">${CFG.niveles[it.niv]}</span> ${esc(it.e)}</p>${it.vis||''}<div class="${it.o.length>4?'ops8':''}">`;
  it.o.forEach(o => {
    let cls = '';
    if (reveal) { if (o[3]) cls = 'ok'; else if (r === o[0]) cls = 'no'; }
    else if (r === o[0]) cls = 'sel';
    h += `<button class="op ${cls}" data-id="${it.id}" data-l="${o[0]}" ${reveal?'disabled':''}><span class="l">${o[0]}.</span><span>${esc(o[1])}</span></button>`;
  });
  h += '</div>';
  if (reveal) {
    if (mode === 'review') h += `<div class="${r===keyOf(it)?'res-ok':'res-no'}" style="font-size:14px;margin-top:4px">${r ? (r===keyOf(it)?'Respondiste ' + r + ': correcto.':'Respondiste ' + r + '. La respuesta correcta es ' + keyOf(it) + '.') : 'Sin responder. La respuesta correcta es ' + keyOf(it) + '.'}</div>`;
    h += justHTML(it);
  }
  return h + '</div>';
}
function renderList(list, mode){
  let h = '', last = null, comp = null, parte = null, n = 0;
  const showMods = CFG.modo !== 'practica' || mode === 'review';
  list.forEach((it, idx) => {
    n++;
    if (it.caso !== last) {
      last = it.caso;
      if (it.caso.comp !== comp) { comp = it.caso.comp; parte = null; if (showMods) h += `<div class="mod" id="m-${comp}">${esc(CFG.componentes[comp])}</div>`; }
      if (comp === 'ingles' && it.cp !== parte) { parte = it.cp; h += `<div class="inst">${esc(CFG.instr[parte])}</div>`; }
      const k = last.items.filter(x => list.includes(x)).length;
      if (k > 1) h += `<div class="inst">Responda las preguntas ${n} a ${n + k - 1} de acuerdo con la siguiente información</div>`;
      let tag = CFG.modo === 'practica' ? CFG.componentes[comp] + (last.tt ? ' · ' + last.tt : '') + (last.ind ? ' · ' + last.ind : '') : (last.tt || '');
      h += `<div class="caso">${tag ? `<div class="tag">${esc(tag)}</div>` : ''}<p>${esc(last.texto)}</p>${last.vis||''}</div>`;
    }
    h += itemHTML(it, n, mode);
  });
  return h;
}

let LIST = [];
let FILTRO = Object.assign({comp:'', cp:'', niv:'', ex:''}, ST.f || {});
function practica(){
  const comps = Object.entries(CFG.componentes).filter(([k]) => ITEMS.some(i => i.caso.comp === k)).map(([k,v]) => `<option value="${k}" ${FILTRO.comp===k?'selected':''}>${esc(v)}</option>`).join('');
  const cps = Object.entries(CFG.competencias).filter(([k]) => ITEMS.some(i => i.cp === k && (!FILTRO.comp || i.caso.comp === FILTRO.comp))).map(([k,v]) => `<option value="${k}" ${FILTRO.cp===k?'selected':''}>${esc(v)}</option>`).join('');
  if (FILTRO.cp && !ITEMS.some(i => i.cp === FILTRO.cp && (!FILTRO.comp || i.caso.comp === FILTRO.comp))) FILTRO.cp = '';
  const nivs = Object.entries(CFG.niveles).map(([k,v]) => `<option value="${k}" ${FILTRO.niv===k?'selected':''}>${esc(v)}</option>`).join('');
  const list = ITEMS.filter(it => (!FILTRO.comp || it.caso.comp===FILTRO.comp) && (!FILTRO.cp || it.cp===FILTRO.cp) && (!FILTRO.niv || String(it.niv)===FILTRO.niv) && (!FILTRO.ex || it.caso.sim.startsWith(FILTRO.ex)));
  const resp = list.filter(it => ST.r[it.id]); const ok = resp.filter(it => ST.r[it.id]===keyOf(it));
  $('#main').innerHTML = `<div class="panel"><p style="margin-top:0">Elige prueba, competencia y dificultad. Al responder verás de inmediato si acertaste y la explicación. Las preguntas de los simulacros también están aquí: si quieres presentarlos «en limpio», hazlos antes de practicar.</p>
  <div class="row"><select id="fc"><option value="">Todas las pruebas</option>${comps}</select>
  <select id="fp"><option value="">Todas las competencias</option>${cps}</select>
  <select id="fn"><option value="">Todas las dificultades</option>${nivs}</select>
  <select id="fe"><option value="">Todas las preguntas</option><option value="s11" ${FILTRO.ex==='s11'?'selected':''}>De los simulacros Saber 11</option><option value="val" ${FILTRO.ex==='val'?'selected':''}>De los simulacros de Validación</option><option value="practica" ${FILTRO.ex==='practica'?'selected':''}>Solo banco extra de práctica</option></select>
  <button class="btn sec" id="borrar">Borrar mis respuestas</button></div>
  <p class="stat" id="pst" style="margin-bottom:0">${list.length} preguntas · respondidas ${resp.length} · aciertos ${ok.length}${resp.length? ' (' + Math.round(100*ok.length/resp.length) + ' %)':''}</p></div>` + renderList(list, 'practica');
  $('#prog').textContent = `${ok.length}/${resp.length} aciertos`;
  [['fc','comp'],['fp','cp'],['fn','niv'],['fe','ex']].forEach(([id,k]) => $('#'+id).onchange = e => { FILTRO[k] = e.target.value; if (k==='comp') FILTRO.cp=''; ST.f = FILTRO; save(); practica(); });
  LIST = list;
  $('#borrar').onclick = () => { list.forEach(it => delete ST.r[it.id]); save(); practica(); };
}

// ---------- SIMULACRO (dos sesiones) ----------
let tick = null;
ST.t = ST.t || {}; ST.fin = ST.fin || {};
const SES = s => ITEMS.filter(it => it.caso.ses === s);
const nombreS = s => 'Sesión ' + s;
const PESO = {lectura_critica:3, matematicas:3, sociales_ciudadanas:3, ciencias_naturales:3, ingles:1};
let ACT = ST.act || 0;
function cuenta(list){ const m = {}; list.forEach(it => m[it.caso.comp] = (m[it.caso.comp]||0) + 1); return m; }
function estadoS(s){ return ST.fin[s] ? 'terminada' : ST.t[s] ? 'en curso' : 'sin empezar'; }
function inicio(){
  clearInterval(tick); $('#timer').textContent = '';
  const c1 = cuenta(SES(1)), c2 = cuenta(SES(2));
  const comps = Object.keys(CFG.componentes).filter(k => c1[k] || c2[k]);
  const h = Math.floor(CFG.minutos/60), m = CFG.minutos%60;
  const val = CFG.cuad === 'validantes';
  const btn = s => ST.fin[s] ? `<button class="btn sec" data-res="1">Ver resultados</button>` : `<button class="btn${s===2 && !ST.fin[1] ? ' sec' : ''}" data-ses="${s}">${ST.t[s] ? 'Continuar' : 'Comenzar'} la ${nombreS(s).toLowerCase()}</button>`;
  $('#main').innerHTML = `<div class="panel"><h2 style="margin-top:0">Instrucciones</h2>
  <p>Este simulacro reproduce la estructura del ${val ? '<b>cuadernillo de validantes</b> (Validación del Bachillerato)' : '<b>cuadernillo estándar de Saber 11</b>'}: <b>${ITEMS.length} preguntas</b> de selección múltiple con única respuesta, en <b>dos sesiones de ${h} h ${m ? m + ' min' : ''}</b>, como el examen real.</p>
  <table><tr><th>Prueba</th><th class="r">Sesión 1</th><th class="r">Sesión 2</th></tr>${comps.map(k => `<tr><td>${esc(CFG.componentes[k])}</td><td class="r">${c1[k]||'–'}</td><td class="r">${c2[k]||'–'}</td></tr>`).join('')}
  <tr><td><b>Total</b></td><td class="r"><b>${SES(1).length}</b></td><td class="r"><b>${SES(2).length}</b></td></tr></table>
  <p>Cada sesión tiene su propio cronómetro. Puedes hacerlas el mismo día con un descanso (como en el examen) o en días distintos. Tus respuestas se guardan en este navegador: puedes cerrar y continuar después. Cuando se acaba el tiempo puedes seguir, pero el cronómetro lo indica.</p>
  <p>Al terminar verás tu porcentaje por prueba, competencia y dificultad, ${val ? 'una estimación de qué tan cerca estás del puntaje de aprobación' : 'un indicador global ponderado como el del Icfes'} y la explicación de cada pregunta.</p>
  <table><tr><td>${nombreS(1)} · ${estadoS(1)}</td><td class="r">${btn(1)}</td></tr><tr><td>${nombreS(2)} · ${estadoS(2)}</td><td class="r">${btn(2)}</td></tr></table>
  ${(ST.fin[1] || ST.fin[2]) ? '<div class="row" style="margin-top:12px"><button class="btn sec" id="otra">Reiniciar el simulacro</button></div>' : ''}</div>`;
  $('#prog').textContent = `${ITEMS.length} preguntas`;
  document.querySelectorAll('[data-ses]').forEach(b => b.onclick = () => { const s = +b.dataset.ses; if (!ST.t[s]) ST.t[s] = Date.now(); ACT = ST.act = s; save(); examen(); window.scrollTo(0,0); });
  document.querySelectorAll('[data-res]').forEach(b => b.onclick = () => { resultados(); window.scrollTo(0,0); });
  const o = $('#otra'); if (o) o.onclick = reiniciar;
}
function reiniciar(){ ST = {r:{}, t:{}, fin:{}}; ACT = 0; save(); inicio(); window.scrollTo(0,0); }
function reloj(){
  const rest = CFG.minutos*60 - Math.floor((Date.now() - ST.t[ACT])/1000);
  const a = Math.abs(rest), hh = Math.floor(a/3600), mm = Math.floor(a%3600/60), ss = a%60;
  const t = (rest < 0 ? '+' : '') + (hh ? hh + ':' : '') + String(mm).padStart(2,'0') + ':' + String(ss).padStart(2,'0');
  $('#timer').textContent = rest < 0 ? 'Tiempo cumplido ' + t : '⏱ ' + t;
  $('#timer').classList.toggle('low', rest < 600);
}
function navHTML(list){
  const comps = [...new Set(list.map(i => i.caso.comp))];
  return '<div class="nav">' + comps.map(c => `<a href="#m-${c}">${esc(CFG.componentes[c])}</a>`).join('') + '</div>';
}
function examen(){
  const L = SES(ACT);
  $('#main').innerHTML = `<div class="mod" style="margin-top:0">${nombreS(ACT)}</div>` + navHTML(L) + renderList(L, 'examen') + `<div class="panel"><button class="btn" id="fin">Terminar la ${nombreS(ACT).toLowerCase()}</button> <button class="btn sec" id="volver">Volver al inicio</button></div>`;
  progreso(); reloj(); clearInterval(tick); tick = setInterval(reloj, 1000);
  $('#volver').onclick = () => { ST.act = ACT = 0; save(); inicio(); window.scrollTo(0,0); };
  $('#fin').onclick = () => {
    const faltan = L.length - L.filter(i => ST.r[i.id]).length;
    $('#mtxt').textContent = (faltan ? `Te faltan ${faltan} preguntas por responder en esta sesión. ¿Quieres terminarla de todos modos?` : '¿Quieres terminar esta sesión?');
    $('#modal').classList.remove('hide');
  };
}
function progreso(){
  const L = SES(ACT);
  const r = L.filter(it => ST.r[it.id]).length;
  $('#prog').textContent = `${nombreS(ACT)} · respondidas ${r}/${L.length}`;
}
$('#mno').onclick = () => $('#modal').classList.add('hide');
$('#msi').onclick = () => { $('#modal').classList.add('hide'); ST.fin[ACT] = Date.now(); ST.act = ACT = 0; save(); clearInterval(tick); if (ST.fin[1] && ST.fin[2]) resultados(); else inicio(); window.scrollTo(0,0); };
const fmt = x => String(Math.round(x*10)/10).replace('.', ',');
function resultados(){
  clearInterval(tick);
  const L = ITEMS.filter(it => ST.fin[it.caso.ses]);
  const completo = ST.fin[1] && ST.fin[2];
  const ok = L.filter(it => ST.r[it.id] === keyOf(it)).length;
  const pct = 100*ok/L.length;
  const agrupa = (lst, fn) => { const m = {}; lst.forEach(it => { const k = fn(it); m[k] = m[k] || [0,0]; m[k][1]++; if (ST.r[it.id]===keyOf(it)) m[k][0]++; }); return m; };
  const fila = (lab, v, cls) => `<tr class="${cls||''}"><td>${esc(lab)}</td><td class="r">${v[0]}/${v[1]}</td><td class="r">${Math.round(100*v[0]/v[1])} %</td></tr>`;
  const porMod = agrupa(L, it => it.caso.comp), porNiv = agrupa(L, it => it.niv);
  let tabla = '';
  Object.keys(CFG.componentes).filter(m => porMod[m]).forEach(m => { tabla += fila(CFG.componentes[m], porMod[m]);
    const sub = agrupa(L.filter(i => i.caso.comp === m), it => it.cp);
    Object.keys(CFG.competencias).filter(k => sub[k]).forEach(k => tabla += fila(CFG.competencias[k], sub[k], 'sub'));
    if (m === 'ciencias_naturales') { const cn = agrupa(L.filter(i => i.caso.comp === m), it => it.cn); Object.keys(CFG.comp_cn).filter(k => cn[k]).forEach(k => tabla += fila('Componente ' + CFG.comp_cn[k].toLowerCase(), cn[k], 'sub')); } });
  let ind = '';
  if (completo) {
    let num = 0, den = 0; Object.entries(porMod).forEach(([m, v]) => { num += PESO[m] * v[0]/v[1]; den += PESO[m]; });
    const pond = 100*num/den;
    ind = CFG.cuad === 'validantes'
      ? `<p><b>Indicador ponderado de aciertos: ${fmt(pond)} %</b> (Lectura Crítica, Matemáticas, Sociales y Ciencias pesan 3; Inglés pesa 1, igual que en el puntaje total de la Validación).</p><p class="aviso">Para aprobar la Validación necesitas un puntaje total de 30 o más en una escala de 0 a 60, que el Icfes calcula con un modelo estadístico (30 es el promedio de los validantes). Ningún simulacro puede convertir aciertos en ese puntaje exacto: usa el indicador para medir tu avance entre simulacros y refuerza primero las pruebas con peso 3 que tengas más bajas.</p>`
      : `<p><b>Indicador global ponderado: ${Math.round(5*pond)} de 500</b> (${fmt(pond)} % de aciertos ponderados: Lectura Crítica, Matemáticas, Sociales y Ciencias pesan 3; Inglés pesa 1, como en el puntaje global).</p><p class="aviso">El Icfes calcula el puntaje de cada prueba (0 a 100) y el global (0 a 500) con un modelo estadístico que tiene en cuenta la dificultad de cada pregunta y compara a todos los evaluados. Por eso este indicador no es tu puntaje oficial: sirve para medir tu avance entre simulacros.</p>`;
  }
  const mins = s => ST.fin[s] ? Math.round((ST.fin[s] - ST.t[s])/60000) : null;
  const tUso = [1,2].filter(s => ST.fin[s]).map(s => { const x = mins(s); return `${nombreS(s)}: ${Math.floor(x/60) ? Math.floor(x/60) + ' h ' : ''}${x%60} min`; }).join(' · ');
  $('#timer').textContent = '';
  $('#prog').textContent = `${ok}/${L.length} aciertos`;
  const peor = Object.entries(porMod).sort((a,b) => a[1][0]/a[1][1] - b[1][0]/b[1][1])[0];
  $('#main').innerHTML = `<div class="panel">${completo ? '' : `<p class="aviso" style="margin-top:0"><b>Resultado parcial:</b> solo has terminado la ${[1,2].filter(s=>ST.fin[s]).map(nombreS).join(' y ').toLowerCase()}. Termina la otra sesión para ver el resultado completo.</p>`}
  <div class="big">${fmt(pct)} %</div>
  <p style="margin-top:4px">${ok} de ${L.length} respuestas correctas. ${pct >= 75 ? 'Muy buen resultado: repasa tus errores para afianzarlo.' : pct >= 55 ? 'Vas por buen camino: refuerza las pruebas y competencias con menor porcentaje.' : 'Hay que reforzar: practica por prueba y competencia, empezando por la más baja.'} Tu prueba más baja: <b>${esc(CFG.componentes[peor[0]])}</b>.</p>
  ${ind}<p class="stat">Tiempo usado · ${tUso}</p>
  <h3>Por prueba y competencia</h3><table>${tabla}</table>
  <h3>Por dificultad</h3><table>${Object.entries(porNiv).map(([k,v]) => fila(CFG.niveles[k], v)).join('')}</table>
  <div class="row" style="margin-top:14px"><button class="btn sec" id="solo">Ver solo mis errores</button><button class="btn sec" id="todas">Ver todas</button><button class="btn sec" id="ini">Volver al inicio</button><button class="btn sec" id="otra">Reiniciar el simulacro</button></div></div><div id="rev"></div>`;
  const rev = errs => { let h = ''; [1,2].filter(s => ST.fin[s]).forEach(s => { const l = SES(s).filter(it => !errs || ST.r[it.id] !== keyOf(it)); h += `<div class="mod">${nombreS(s)}</div>` + (l.length ? renderList(l, 'review') : '<div class="panel">¡No tuviste errores en esta sesión!</div>'); }); $('#rev').innerHTML = h; };
  rev(true);
  $('#solo').onclick = () => rev(true); $('#todas').onclick = () => rev(false);
  $('#ini').onclick = () => { inicio(); window.scrollTo(0,0); };
  $('#otra').onclick = reiniciar;
}

document.addEventListener('click', e => {
  const b = e.target.closest('button.op'); if (!b || b.disabled) return;
  if (CFG.modo === 'simulacro' && (!ACT || ST.fin[ACT])) return;
  ST.r[b.dataset.id] = b.dataset.l; save();
  const it = ITEMS.find(i => i.id === b.dataset.id);
  const n = b.closest('.item').querySelector('.n').textContent.replace('.','');
  b.closest('.item').outerHTML = itemHTML(it, n, CFG.modo === 'practica' ? 'practica' : 'examen');
  if (CFG.modo === 'practica') { const resp = LIST.filter(i => ST.r[i.id]); const ok = resp.filter(i => ST.r[i.id]===keyOf(i)).length; $('#prog').textContent = `${ok}/${resp.length} aciertos`; $('#pst').textContent = `${LIST.length} preguntas · respondidas ${resp.length} · aciertos ${ok} (${Math.round(100*ok/resp.length)} %)`; }
  else progreso();
});
if (CFG.modo === 'practica') practica();
else if (ACT && ST.t[ACT] && !ST.fin[ACT]) examen();
else inicio();
</script>
</body>
</html>
