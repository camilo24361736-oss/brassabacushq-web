e la prueba.", true], ["B", "Entre el minuto 5 y el minuto 10.", "Aumentó de 110 a 135: 25 latidos por minuto, menos que en el primer intervalo.", false], ["C", "Entre el minuto 10 y el minuto 15.", "Aumentó solo 5 latidos por minuto, aunque allí se alcanza el valor más alto.", false], ["D", "Entre el minuto 20 y el minuto 25.", "En ese intervalo la frecuencia disminuyó 34 latidos por minuto; fue una bajada, no un aumento.", false]]}, {"id": "MTB-208", "niv": 2, "cp": "mt_formulacion", "cn": "", "e": "Para controlar la intensidad del ejercicio, el médico usa la regla aproximada: frecuencia cardíaca máxima = 220 − edad. ¿En qué minuto de la prueba el paciente alcanzó exactamente el 80 % de su frecuencia cardíaca máxima?", "f": "Cálculo propio", "vis": "", "o": [["A", "En el minuto 10.", "En el minuto 10 la frecuencia fue de 135, menor que 140.", false], ["B", "En el minuto 15.", "Máxima: 220 − 45 = 175; el 80 % es 0,8 × 175 = 140, valor registrado en el minuto 15.", true], ["C", "En el minuto 20.", "En el minuto 20 la frecuencia fue de 138, cercana pero distinta de 140.", false], ["D", "En el minuto 25.", "En el minuto 25 la frecuencia fue de 104, muy por debajo de 140; en ese momento el paciente ya estaba bajando la intensidad.", false]]}, {"id": "MTB-209", "niv": 1, "cp": "mt_argumentacion", "cn": "", "e": "El paciente afirma que al terminar la prueba, en el minuto 30, su frecuencia cardíaca ya había regresado al valor que tenía al comenzar. ¿Es cierto?", "f": "Cálculo propio", "vis": "", "o": [["A", "Sí, porque en el minuto 30 marcaba 72 latidos por minuto, igual que al inicio.", "Lee mal la gráfica: en el minuto 30 la frecuencia era de 80.", false], ["B", "No, porque en el minuto 30 la frecuencia era mayor que en el minuto 25.", "En el minuto 25 era de 104, mayor que 80; el dato es falso.", false], ["C", "Sí, porque del minuto 15 al minuto 30 la frecuencia bajó 60 latidos por minuto.", "140 − 80 = 60 es cierto, pero eso no indica que haya llegado al valor inicial de 72.", false], ["D", "No, porque en el minuto 30 marcaba 80 latidos por minuto y al inicio, 72.", "80 > 72: la frecuencia todavía estaba 8 latidos por minuto por encima del valor inicial.", true]]}]}, {"comp": "matematicas", "sim": "val-2", "ses": 2, "ind": "Lote para sembrar maíz", "tt": "", "texto": "Un agricultor tiene un lote rectangular de 120 m de largo y 80 m de ancho, donde sembrará maíz.", "vis": "", "items": [{"id": "MTB-213", "niv": 2, "cp": "mt_formulacion", "cn": "", "e": "Va a cercar el lote con 4 hilos de alambre de púas, cada uno alrededor de todo el perímetro; los tramos de alambre se pueden empalmar. Si el alambre se vende en rollos de 500 m, ¿cuántos rollos debe comprar como mínimo?", "f": "Cálculo propio", "vis": "", "o": [["A", "1 rollo.", "Calcula el alambre para un solo hilo (400 m); se necesitan 4 hilos.", false], ["B", "3 rollos.", "Divide 1.600 entre 500 (3,2) y redondea hacia abajo; con 3 rollos (1.500 m) faltarían 100 m.", false], ["C", "4 rollos.", "Perímetro: 2 × (120 + 80) = 400 m; 4 hilos: 1.600 m; 1.600 ÷ 500 = 3,2, así que se necesitan 4 rollos.", true], ["D", "20 rollos.", "Usa el área del lote (9.600 m²) en lugar del perímetro.", false]]}, {"id": "MTB-214", "niv": 2, "cp": "mt_formulacion", "cn": "", "e": "Para la siembra se recomiendan 25 kg de semilla por hectárea (1 hectárea = 10.000 m²). ¿Cuántos kilogramos de semilla necesita para todo el lote?", "f": "Cálculo propio", "vis": "", "o": [["A", "2,4 kg.", "Divide el área entre 100.000 en lugar de 10.000 al convertir a hectáreas.", false], ["B", "24 kg.", "Área: 120 × 80 = 9.600 m² = 0,96 ha; 0,96 × 25 = 24 kg.", true], ["C", "240 kg.", "Convierte mal el área: toma 9,6 hectáreas en lugar de 0,96.", false], ["D", "240.000 kg.", "Multiplica los metros cuadrados por 25 sin convertirlos a hectáreas.", false]]}, {"id": "MTB-215", "niv": 1, "cp": "mt_interpretacion", "cn": "", "e": "Si dibuja el lote en un plano a escala 1:2.000, ¿cuáles serán sus medidas en el plano?", "f": "Cálculo propio", "vis": "", "o": [["A", "0,6 cm × 0,4 cm.", "Divide entre 20.000 en lugar de 2.000.", false], ["B", "6 cm × 4 cm.", "120 m = 12.000 cm y 12.000 ÷ 2.000 = 6 cm; 80 m = 8.000 cm y 8.000 ÷ 2.000 = 4 cm.", true], ["C", "60 cm × 40 cm.", "Divide los metros entre 2 sin aplicar la escala de 1:2.000.", false], ["D", "24 cm × 16 cm.", "Divide los centímetros entre 500 en lugar de 2.000.", false]]}]}, {"comp": "matematicas", "sim": "val-2", "ses": 2, "ind": "La luz del Sol y los microorganismos", "tt": "", "texto": "La luz viaja en el vacío a una velocidad aproximada de 3 × 10⁸ m/s, y la distancia media entre la Tierra y el Sol es de aproximadamente 1,5 × 10¹¹ m.", "vis": "", "items": [{"id": "MTB-219", "niv": 2, "cp": "mt_formulacion", "cn": "", "e": "¿Cuánto tiempo tarda aproximadamente la luz del Sol en llegar a la Tierra?", "f": "Cálculo propio", "vis": "", "o": [["A", "5 minutos.", "Calcula bien 500 segundos, pero los divide entre 100 en lugar de 60 para pasarlos a minutos.", false], ["B", "8,3 minutos.", "t = d ÷ v = (1,5 × 10¹¹) ÷ (3 × 10⁸) = 0,5 × 10³ = 500 s; 500 ÷ 60 ≈ 8,3 minutos.", true], ["C", "50 minutos.", "Resta mal los exponentes (11 − 8 = 4) y obtiene 0,5 × 10⁴ = 5.000 s; luego divide entre 100 en lugar de 60.", false], ["D", "500 minutos.", "El resultado de la división, 500, está en segundos, no en minutos.", false]]}, {"id": "MTB-220", "niv": 2, "cp": "mt_interpretacion", "cn": "", "e": "En un laboratorio se observa una bacteria que mide 4,5 × 10⁻⁶ m de largo. ¿Aproximadamente cuántas bacterias como esta, puestas en fila una tras otra, ocupan 1 mm (10⁻³ m)?", "f": "Cálculo propio", "vis": "", "o": [["A", "22.", "Resta mal los exponentes: obtiene 10¹ en lugar de 10².", false], ["B", "222.", "10⁻³ ÷ (4,5 × 10⁻⁶) = (1 ÷ 4,5) × 10³ ≈ 0,222 × 10³ ≈ 222.", true], ["C", "2.222.", "Toma 1 mm como 10⁻² m; 1 mm es 10⁻³ m.", false], ["D", "4.500.", "Multiplica 4,5 por 10³ en lugar de dividir 10⁻³ entre 4,5 × 10⁻⁶.", false]]}]}, {"comp": "matematicas", "sim": "val-2", "ses": 2, "ind": "Dos ciclistas en la misma vía", "tt": "", "texto": "En una competencia de ciclismo recreativo, Andrea sale a las 7:00 a. m. y mantiene una velocidad constante de 30 km/h. Julián sale del mismo punto a las 7:20 a. m., por la misma vía y en el mismo sentido, a una velocidad constante de 36 km/h.", "vis": "", "items": [{"id": "MTB-221", "niv": 3, "cp": "mt_formulacion", "cn": "", "e": "¿A qué hora alcanza Julián a Andrea?", "f": "Cálculo propio", "vis": "", "o": [["A", "A las 7:29 a. m.", "Suma las velocidades (66 km/h); como van en el mismo sentido, la distancia entre ellos se reduce a razón de 36 − 30 = 6 km/h.", false], ["B", "A las 7:40 a. m.", "Divide los 10 km de ventaja entre 30 km/h; debe dividirlos entre la diferencia de velocidades.", false], ["C", "A las 8:40 a. m.", "Calcula bien los 100 minutos, pero los cuenta desde las 7:00 a. m. y no desde la salida de Julián.", false], ["D", "A las 9:00 a. m.", "A las 7:20 Andrea lleva 30 × 1/3 = 10 km de ventaja; Julián la reduce a 6 km/h: 10 ÷ 6 h = 100 min después de las 7:20, es decir, a las 9:00 a. m.", true]]}, {"id": "MTB-222", "niv": 2, "cp": "mt_interpretacion", "cn": "", "e": "¿Cuál expresión da la distancia d, en km, que lleva recorrida Julián t horas después de las 7:00 a. m., para t ≥ 1/3?", "f": "Cálculo propio", "vis": "", "o": [["A", "d = 36(t − 1/3).", "Julián empieza a pedalear 1/3 de hora (20 minutos) después de las 7:00, así que su tiempo en movimiento es t − 1/3.", true], ["B", "d = 36t − 1/3.", "Resta 1/3 a la distancia y no al tiempo; con t = 1/3 daría 11,67 km en el momento de la salida.", false], ["C", "d = 36t + 10.", "Suma la ventaja de Andrea a la distancia de Julián; esa expresión no corresponde a ninguno de los dos.", false], ["D", "d = 36(t − 20).", "Mezcla unidades: resta 20 minutos a un tiempo medido en horas.", false]]}]}, {"comp": "matematicas", "sim": "val-2", "ses": 2, "ind": "Comité de seguridad en el trabajo", "tt": "", "texto": "En una empresa se deben elegir representantes de los trabajadores para el comité de seguridad y salud en el trabajo. Se postularon 6 trabajadores.", "vis": "", "items": [{"id": "MTB-226", "niv": 2, "cp": "mt_formulacion", "cn": "", "e": "Si se eligen 2 representantes que tendrán las mismas funciones, ¿cuántas parejas distintas de representantes se pueden formar?", "f": "Cálculo propio", "vis": "", "o": [["A", "12.", "Multiplica 6 × 2; no cuenta todas las parejas posibles.", false], ["B", "15.", "No importa el orden: C(6, 2) = (6 × 5) ÷ 2 = 15 parejas.", true], ["C", "30.", "Calcula 6 × 5, que cuenta cada pareja dos veces, como si importara el orden.", false], ["D", "36.", "Calcula 6 × 6: permite que un trabajador forme pareja consigo mismo.", false]]}, {"id": "MTB-227", "niv": 3, "cp": "mt_argumentacion", "cn": "", "e": "Un trabajador afirma que, si entre los 6 postulados se eligen un presidente y un secretario, hay 30 formas distintas de asignar esos dos cargos. ¿Es correcta la afirmación?", "f": "Cálculo propio", "vis": "", "o": [["A", "No, porque el orden no importa y hay menos de 30 formas de elegirlos.", "Al asignar cargos distintos sí importa quién ocupa cada uno.", false], ["B", "Sí, porque 6 candidatos por 5 cargos del comité dan 30 posibilidades.", "La conclusión coincide, pero la razón no: hay 2 cargos; el 5 corresponde a los candidatos que quedan para secretario.", false], ["C", "Sí, porque hay 6 candidatos para presidente y, para cada uno, 5 para secretario.", "Por el principio multiplicativo: 6 × 5 = 30 formas de asignar los dos cargos.", true], ["D", "No, porque hay 6 × 6 = 36 formas de asignar los dos cargos.", "Una misma persona no puede ocupar los dos cargos; para secretario quedan 5 opciones, no 6.", false]]}]}, {"comp": "matematicas", "sim": "val-2", "ses": 2, "ind": "Ubicación de servicios en una ciudad", "tt": "", "texto": "En un plano de una ciudad con coordenadas cartesianas, en el que cada unidad equivale a 1 km, el hospital está en el punto H(−2, 1) y la terminal de transporte en el punto T(4, 9).", "vis": "", "items": [{"id": "MTB-234", "niv": 2, "cp": "mt_formulacion", "cn": "", "e": "¿Cuál es la distancia en línea recta entre el hospital y la terminal?", "f": "Cálculo propio", "vis": "", "o": [["A", "6 km.", "Es solo la diferencia horizontal entre los puntos (4 − (−2) = 6).", false], ["B", "10 km.", "d = √((4 − (−2))² + (9 − 1)²) = √(36 + 64) = √100 = 10 km.", true], ["C", "14 km.", "Suma las diferencias horizontal y vertical (6 + 8); esa sería la distancia recorriendo calles en cuadrícula, no en línea recta.", false], ["D", "100 km.", "Olvida sacar la raíz cuadrada de 36 + 64.", false]]}, {"id": "MTB-235", "niv": 1, "cp": "mt_interpretacion", "cn": "", "e": "Se construirá una estación de ambulancias en el punto medio del segmento que une el hospital con la terminal. ¿Cuáles son las coordenadas de ese punto?", "f": "Cálculo propio", "vis": "", "o": [["A", "(6, 8).", "Calcula las diferencias entre las coordenadas; ese es el desplazamiento de H a T, no un punto del segmento.", false], ["B", "(3, 4).", "Calcula la mitad de las diferencias (6 ÷ 2, 8 ÷ 2) y no el promedio de las coordenadas.", false], ["C", "(2, 10).", "Suma las coordenadas de los dos puntos, pero no las divide entre 2.", false], ["D", "(1, 5).", "Punto medio: ((−2 + 4) ÷ 2, (1 + 9) ÷ 2) = (1, 5).", true]]}, {"id": "MTB-236", "niv": 3, "cp": "mt_interpretacion", "cn": "", "e": "¿Cuál ecuación representa la recta que pasa por el hospital y por la terminal?", "f": "Cálculo propio", "vis": "", "o": [["A", "y = (4/3)x + 11/3.", "Pendiente: (9 − 1) ÷ (4 − (−2)) = 8/6 = 4/3. Con H: 1 = (4/3)(−2) + b, de donde b = 11/3. T también cumple: (4/3)(4) + 11/3 = 9.", true], ["B", "y = (4/3)x + 1.", "Usa la ordenada de H como intercepto, pero H no está sobre el eje y.", false], ["C", "y = −(4/3)x − 5/3.", "Cambia el signo de la pendiente; la recta pasa por H, pero no por T.", false], ["D", "y = (3/4)x + 5/2.", "Usa la pendiente invertida (6/8); la recta pasa por H, pero no por T.", false]]}]}, {"comp": "matematicas", "sim": "val-2", "ses": 2, "ind": "Balón de fútbol", "tt": "", "texto": "Un balón de fútbol tiene forma de esfera de 11 cm de radio. Use π ≈ 3,14.", "vis": "", "items": [{"id": "MTB-237", "niv": 2, "cp": "mt_formulacion", "cn": "", "e": "¿Cuál es el área de la superficie del balón?", "f": "Cálculo propio", "vis": "", "o": [["A", "138,16 cm².", "Calcula 4 · π · r, sin elevar el radio al cuadrado.", false], ["B", "379,94 cm².", "Calcula π · r², que es el área de un círculo de radio 11 cm, no la de la esfera.", false], ["C", "759,88 cm².", "Calcula 2 · π · r²; el área de la esfera es 4 · π · r².", false], ["D", "1.519,76 cm².", "A = 4 · π · r² = 4 × 3,14 × 121 = 1.519,76 cm².", true]]}, {"id": "MTB-238", "niv": 1, "cp": "mt_argumentacion", "cn": "", "e": "Un vendedor afirma que en una caja con forma de prisma rectangular, de medidas interiores 66 cm × 44 cm × 22 cm, caben 6 balones como este en una sola capa. ¿Es correcta la afirmación?", "f": "Cálculo propio", "vis": "", "o": [["A", "Sí: 66 ÷ 22 = 3 y 44 ÷ 22 = 2, y la altura es 22 cm; caben 3 × 2 = 6 balones.", "El diámetro del balón (22 cm) cabe 3 veces en el largo, 2 en el ancho y 1 en la altura.", true], ["B", "Sí: 63.888 cm³ ÷ 6 = 10.648 cm³, que es más que el volumen de un balón.", "La conclusión coincide, pero comparar volúmenes no prueba que los balones quepan; hay que comparar longitudes.", false], ["C", "No: con el radio, 66 ÷ 11 = 6 y 44 ÷ 11 = 4, así que caben 24 balones.", "Usa el radio en lugar del diámetro; cada balón ocupa 22 cm de largo y de ancho.", false], ["D", "No: la caja tiene 63.888 cm³ y un balón ≈ 5.572 cm³, así que caben 11.", "Las esferas no llenan todo el espacio; el número de balones se decide comparando el diámetro con las medidas de la caja.", false]]}]}, {"comp": "matematicas", "sim": "val-2", "ses": 2, "ind": "Número de hijos por familia en una vereda", "tt": "", "texto": "En una vereda se preguntó a 50 familias cuántos hijos tienen. Los resultados se muestran en la tabla.", "vis": "<table class=\"vt\"><caption>Tabla 10. Número de hijos por familia<\/caption><thead><tr><th>Número de hijos<\/th><th>Número de familias<\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td>8<\/td><\/tr><tr><td>1<\/td><td>15<\/td><\/tr><tr><td>2<\/td><td>12<\/td><\/tr><tr><td>3<\/td><td>10<\/td><\/tr><tr><td>4<\/td><td>5<\/td><\/tr><tr><td>Total<\/td><td>50<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Datos ficticios.<\/div>", "items": [{"id": "MTB-242", "niv": 2, "cp": "mt_formulacion", "cn": "", "e": "¿Cuál es el número promedio de hijos por familia?", "f": "Cálculo propio", "vis": "", "o": [["A", "1.", "Es la moda: el número de hijos más frecuente (15 familias).", false], ["B", "1,78.", "Total de hijos: 0 × 8 + 1 × 15 + 2 × 12 + 3 × 10 + 4 × 5 = 89; 89 ÷ 50 = 1,78.", true], ["C", "2.", "Es la mediana: los datos 25 y 26, ordenados, corresponden a familias con 2 hijos; no es el promedio.", false], ["D", "10.", "Es el promedio de las frecuencias (50 ÷ 5), no el promedio del número de hijos.", false]]}]}, {"comp": "matematicas", "sim": "val-2", "ses": 2, "ind": "Compra a crédito de una nevera", "tt": "", "texto": "Un almacén vende una nevera en $ 1.800.000 de contado. Para comprarla a crédito, el cliente paga una cuota inicial del 20 % del precio de contado y luego cuotas mensuales de $ 135.000.", "vis": "", "items": [{"id": "MTB-244", "niv": 1, "cp": "mt_interpretacion", "cn": "", "e": "¿Cuál expresión representa el valor total T, en pesos, que paga un cliente a crédito después de pagar n cuotas mensuales?", "f": "Cálculo propio", "vis": "", "o": [["A", "T = 1.800.000 + 135.000n.", "Suma el precio de contado completo en lugar de la cuota inicial del 20 %.", false], ["B", "T = 495.000n.", "Multiplica por n también la cuota inicial, que se paga una sola vez.", false], ["C", "T = 360.000 + 135.000n.", "La cuota inicial es el 20 % de 1.800.000 = 360.000, y a ella se suman n cuotas de 135.000.", true], ["D", "T = 135.000n − 360.000.", "Resta la cuota inicial, que en realidad es un pago adicional a las cuotas mensuales.", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "val-2", "ses": 2, "ind": "Habeas corpus", "tt": "", "texto": "Un trabajador de una bodega fue retenido por unas autoridades sin que existiera una orden judicial ni una captura en flagrancia. Su familia lleva dos días sin saber por qué sigue detenido y considera que la privación de la libertad es ilegal.", "vis": "", "items": [{"id": "SCB-202", "niv": 2, "cp": "sc_pensamiento_social", "cn": "", "e": "¿Qué mecanismo específico prevé la Constitución para que una persona que considera estar privada ilegalmente de su libertad pida a un juez que la revise de inmediato?", "f": "Constitución Política, arts. 30, 86, 87 y 88", "vis": "", "o": [["A", "El habeas corpus.", "El artículo 30 establece que quien esté privado de la libertad y crea estarlo ilegalmente puede invocar el habeas corpus ante cualquier autoridad judicial, en todo tiempo, por sí o por otra persona.", true], ["B", "La acción de tutela.", "La tutela es subsidiaria: solo procede cuando no existe otro medio de defensa judicial (art. 86), y para la libertad la Constitución prevé un mecanismo específico, el habeas corpus.", false], ["C", "La acción de cumplimiento.", "La acción de cumplimiento (art. 87) busca que una autoridad cumpla una ley o un acto administrativo; no está diseñada para revisar una detención.", false], ["D", "La acción popular.", "La acción popular (art. 88) protege derechos colectivos como el ambiente o el espacio público, no la libertad personal de un individuo.", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "val-2", "ses": 2, "ind": "Acción de cumplimiento", "tt": "", "texto": "Una ley ordena a las entidades públicas adecuar sus edificios para que las personas con discapacidad puedan acceder a ellos. Han pasado varios años desde el plazo fijado y la sede de una entidad ficticia sigue sin rampas ni ascensor. Una asociación de personas con discapacidad ya pidió por escrito a la entidad que cumpliera la ley y no obtuvo respuesta. Ahora quiere que un juez ordene a la entidad cumplir lo que dice la ley.", "vis": "", "items": [{"id": "SCB-205", "niv": 2, "cp": "sc_pensamiento_social", "cn": "", "e": "¿Qué mecanismo está diseñado específicamente para que un juez ordene a una autoridad cumplir una ley que ha dejado de aplicar, como busca la asociación?", "f": "Constitución Política, arts. 23, 86, 87 y 88", "vis": "", "o": [["A", "La acción popular, para que un juez proteja derechos e intereses colectivos de la comunidad.", "La acción popular (art. 88) protege derechos colectivos como el ambiente o el espacio público; el mecanismo específico para que se cumpla una ley es la acción de cumplimiento.", false], ["B", "El derecho de petición, para que la entidad responda por escrito si construirá las rampas.", "El derecho de petición se ejerce ante la propia entidad, no ante un juez; además, la asociación ya lo usó y no obtuvo respuesta.", false], ["C", "La acción de cumplimiento, para que el juez ordene a la autoridad cumplir el deber que la ley le impone.", "El artículo 87 permite acudir ante un juez para hacer efectivo el cumplimiento de una ley o un acto administrativo; la sentencia ordena a la autoridad renuente cumplir el deber omitido.", true], ["D", "La acción de tutela, para que un juez proteja de inmediato un derecho fundamental vulnerado.", "La tutela protege derechos fundamentales y es subsidiaria; el mecanismo diseñado para exigir judicialmente el cumplimiento de una ley es la acción de cumplimiento (art. 87).", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "val-2", "ses": 2, "ind": "Referendo aprobatorio", "tt": "", "texto": "Un comité de ciudadanos redactó un proyecto de ley para endurecer las sanciones a quienes contaminen los ríos. Lo presentó al Congreso con las firmas exigidas, pero el Congreso no lo aprobó. Ahora el comité quiere que sean los ciudadanos quienes decidan en las urnas si ese proyecto se convierte en ley.", "vis": "", "items": [{"id": "SCB-208", "niv": 3, "cp": "sc_pensamiento_social", "cn": "", "e": "¿Qué mecanismo de participación corresponde a lo que busca el comité?", "f": "Constitución Política, art. 103; Ley 134 de 1994, arts. 5, 7, 8 y 9", "vis": "", "o": [["A", "El cabildo abierto, porque en él los ciudadanos deliberan con el Congreso sobre los proyectos de ley.", "El cabildo abierto se realiza en asambleas, concejos o juntas administradoras locales, no en el Congreso, y en él no se vota la aprobación de una ley.", false], ["B", "El plebiscito, porque permite al pueblo pronunciarse sobre un tema de interés nacional.", "El plebiscito lo convoca el Presidente de la República para que el pueblo apoye o rechace una decisión del Ejecutivo; no lo activan los ciudadanos para aprobar un proyecto de ley.", false], ["C", "La consulta popular, porque en ella los ciudadanos responden una pregunta general sobre un asunto importante.", "La consulta popular la someten el Presidente, el gobernador o el alcalde, y consiste en una pregunta general; el comité quiere someter a votación el texto de un proyecto concreto.", false], ["D", "El referendo aprobatorio, porque somete a votación un proyecto de iniciativa popular que no fue adoptado.", "Según el artículo 5 de la Ley 134 de 1994, el referendo aprobatorio somete a consideración del pueblo un proyecto de iniciativa popular que no fue adoptado por la corporación pública, para que lo apruebe o lo rechace.", true]]}]}, {"comp": "sociales_ciudadanas", "sim": "val-2", "ses": 2, "ind": "Testimonio de la Revolución Industrial", "tt": "", "texto": "Testimonio ficticio de una obrera textil de Mánchester, Inglaterra, recogido hacia 1835:\n\n«Entro a la fábrica a las seis de la mañana y salgo cuando ya es de noche. Las máquinas de vapor no se detienen, y nosotras tampoco. Mi hija de nueve años trabaja conmigo recogiendo los hilos que caen debajo de los telares. Antes, mi madre tejía en casa y vendía las telas en el mercado; ahora nadie compra telas hechas a mano, porque las de la fábrica son más baratas».", "vis": "", "items": [{"id": "SCB-213", "niv": 2, "cp": "sc_perspectivas", "cn": "", "e": "¿Qué problema social de la época refleja este testimonio?", "f": "Contextualización de una fuente primaria (ficticia)", "vis": "", "o": [["A", "La prohibición de que las mujeres y los niños trabajaran en las fábricas.", "El testimonio muestra lo contrario: mujeres y niños trabajaban en la fábrica.", false], ["B", "El aumento del precio de las telas producidas en las fábricas inglesas.", "La obrera dice que las telas de fábrica son más baratas, no más caras.", false], ["C", "Las largas jornadas y el trabajo infantil en las fábricas.", "La obrera trabaja desde las seis de la mañana hasta la noche y su hija de nueve años trabaja con ella: son dos problemas característicos de las primeras fábricas industriales.", true], ["D", "La falta de máquinas en las fábricas, que obligaba a tejer todo a mano.", "El testimonio menciona máquinas de vapor que no se detienen; el problema no es la falta de máquinas.", false]]}, {"id": "SCB-214", "niv": 3, "cp": "sc_perspectivas", "cn": "", "e": "Un estudiante quiere usar solo este testimonio para afirmar que «en toda Europa, en 1835, la mayoría de la población trabajaba en fábricas». ¿Cuál es la principal limitación de la fuente para sostener esa afirmación?", "f": "Evaluación de los alcances de una fuente", "vis": "", "o": [["A", "Que el testimonio de una obrera de una ciudad industrial no muestra cómo trabajaba la mayoría de los europeos.", "El testimonio muestra la experiencia de una obrera en Mánchester, uno de los centros industriales; para hablar de toda Europa se necesitan datos sobre muchas regiones, varias de ellas todavía mayoritariamente rurales.", true], ["B", "Que la industria textil, en la que trabaja la obrera, todavía no se había mecanizado en Inglaterra hacia 1835.", "Es falso: la industria textil fue una de las primeras en mecanizarse, y la obrera menciona las máquinas de vapor.", false], ["C", "Que la obrera no indica su salario, dato necesario para saber si las fábricas pagaban bien.", "El salario no permite saber cuántas personas trabajaban en fábricas en toda Europa; es un dato irrelevante para la afirmación.", false], ["D", "Que el testimonio muestra que en 1835 todavía se tejía a mano en las casas de Mánchester.", "La obrera dice lo contrario: ahora nadie compra telas hechas a mano.", false]]}, {"id": "SCB-215", "niv": 1, "cp": "sc_pensamiento_social", "cn": "", "e": "El cambio que describe la obrera entre el trabajo de su madre y el suyo corresponde a", "f": "Concepto de Revolución Industrial", "vis": "", "o": [["A", "el paso de la economía industrial a la economía basada en servicios digitales.", "Los servicios digitales son propios de finales del siglo XX y del XXI, no de 1835.", false], ["B", "el paso de la producción en fábricas a la producción artesanal en el hogar.", "Es el cambio inverso al que describe el testimonio: la madre trabajaba en casa y la hija en la fábrica.", false], ["C", "el paso del trabajo asalariado al trabajo esclavizado en las colonias.", "El testimonio describe a una obrera de fábrica en Inglaterra, no un tránsito hacia la esclavitud.", false], ["D", "el paso de la producción artesanal a la producción en fábricas con máquinas.", "La Revolución Industrial reemplazó el trabajo manual en el hogar o el taller por la producción mecanizada en fábricas, como muestra el contraste entre la madre tejedora y la obrera.", true]]}]}, {"comp": "sociales_ciudadanas", "sim": "val-2", "ses": 2, "ind": "Revolución de los Comuneros", "tt": "", "texto": "En marzo de 1781, en la villa del Socorro, una multitud rompió el edicto que anunciaba nuevos cobros ordenados por el regente visitador enviado por la Corona. El levantamiento se extendió por varias poblaciones y miles de personas marcharon hacia Santafé.", "vis": "", "items": [{"id": "SCB-219", "niv": 2, "cp": "sc_pensamiento_social", "cn": "", "e": "¿Cuál fue la causa principal de este levantamiento, conocido como la Revolución de los Comuneros?", "f": "Banrepcultural, Credencial Historia n.º 240, «Revolución de los comuneros»", "vis": "", "o": [["A", "La disputa entre los partidos Liberal y Conservador por el control del gobierno central.", "Los partidos Liberal y Conservador surgieron a mediados del siglo XIX.", false], ["B", "La decisión de la Corona de abolir la esclavitud en todo el territorio del Nuevo Reino de Granada.", "La esclavitud en Colombia se abolió en 1851, en la época republicana, no por decisión de la Corona en 1781.", false], ["C", "El aumento de impuestos, como la alcabala, y de los controles sobre productos como el tabaco.", "Los comuneros protestaron contra el alza de la alcabala y los estancos (tabaco, aguardiente) impuestos por el visitador Gutiérrez de Piñeres para financiar a la Corona.", true], ["D", "La llegada de las tropas de Pablo Morillo para reconquistar el territorio.", "La Reconquista de Morillo ocurrió entre 1815 y 1816, después de los primeros gobiernos independientes.", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "val-2", "ses": 2, "ind": "Globalización y centros de llamadas", "tt": "", "texto": "Una empresa multinacional de telecomunicaciones tiene un centro de atención telefónica en Barranquilla con 900 empleados bilingües. La empresa anunció que trasladará la mitad de esos puestos a otro país, donde los salarios son más bajos, y que en Barranquilla conservará los cargos que requieren mayor formación técnica.\n\nVocera de la empresa: «Competimos en un mercado global; si nuestros costos son más altos que los de la competencia, perdemos clientes en todo el mundo».\n\nOperadora de la empresa: «Aprendimos inglés, cumplimos las metas y aun así nos reemplazan por un salario más bajo en otro lugar».", "vis": "", "items": [{"id": "SCB-220", "niv": 1, "cp": "sc_reflexivo_sistemico", "cn": "", "e": "¿Qué característica de la globalización se observa en la decisión de la empresa?", "f": "Concepto de globalización económica", "vis": "", "o": [["A", "La desaparición del comercio internacional de servicios.", "El caso muestra lo contrario: los servicios de atención telefónica se prestan desde distintos países.", false], ["B", "El aumento obligatorio de los salarios en todos los países.", "La empresa se traslada precisamente porque en otro país los salarios son más bajos.", false], ["C", "La prohibición de que las empresas extranjeras de telecomunicaciones operen en Colombia.", "La empresa es multinacional y opera en Colombia; nada en el texto indica una prohibición.", false], ["D", "La facilidad con que las empresas trasladan actividades entre países según los costos.", "La empresa reubica puestos de trabajo en otro país porque allí los salarios son menores: es la movilidad de la producción y los servicios propia de la globalización.", true]]}, {"id": "SCB-221", "niv": 3, "cp": "sc_reflexivo_sistemico", "cn": "", "e": "Ante el anuncio, la alcaldía de Barranquilla propone ofrecer cursos gratuitos de formación técnica a los operadores que serían despedidos. ¿Cuál es la lógica de esta propuesta frente al problema?", "f": "Análisis de alternativas de solución", "vis": "", "o": [["A", "Preparar a los trabajadores para los cargos que sí permanecerán en la ciudad.", "La empresa conservará en Barranquilla los cargos de mayor formación técnica; capacitar a los operadores aumenta sus posibilidades de ocupar esos puestos u otros similares.", true], ["B", "Convencer a la empresa de que el inglés de los operadores no es suficiente para el mercado global.", "Los cursos son técnicos y buscan mejorar la empleabilidad; no pretenden demostrar deficiencias en el inglés de los trabajadores.", false], ["C", "Reducir los salarios de los operadores para que la empresa no se vaya.", "La propuesta no toca los salarios; se trata de formación.", false], ["D", "Impedir legalmente que la empresa traslade los puestos a otro país.", "Los cursos no tienen efecto jurídico sobre la decisión de la empresa; buscan otra cosa.", false]]}, {"id": "SCB-222", "niv": 2, "cp": "sc_perspectivas", "cn": "", "e": "¿Por qué la operadora considera injusta la decisión de la empresa?", "f": "Análisis de perspectivas del caso", "vis": "", "o": [["A", "Porque la razón del traslado es el menor costo salarial y no el desempeño de los trabajadores.", "La operadora resalta que aprendieron inglés y cumplieron las metas, y que aun así los reemplazan por un salario más bajo; percibe injusto que el desempeño no cuente frente al costo.", true], ["B", "Porque la empresa conservará en Barranquilla solo los cargos de quienes no aprendieron inglés.", "El texto dice que se conservarán los cargos de mayor formación técnica, no los de quienes no saben inglés.", false], ["C", "Porque cree que en el otro país los operadores no hablarán inglés tan bien como ellos.", "La operadora no compara su inglés con el de los trabajadores del otro país; destaca el costo salarial.", false], ["D", "Porque la empresa no le reconoció el esfuerzo de aprender inglés con un aumento de salario.", "La operadora no habla de aumentos salariales; su queja es que los reemplazan pese a su desempeño.", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "val-2", "ses": 2, "ind": "Batalla de Boyacá", "tt": "", "texto": "El 7 de agosto de 1819, en el puente de Boyacá, unos kilómetros al sur de Tunja, el ejército patriota dirigido por Simón Bolívar y Francisco de Paula Santander derrotó a la Tercera División del ejército realista, comandada por José María Barreiro.", "vis": "", "items": [{"id": "SCB-223", "niv": 1, "cp": "sc_pensamiento_social", "cn": "", "e": "¿Cuál fue una consecuencia de esta batalla?", "f": "Museo Nacional de Colombia, «Hace 200 años… La Batalla de Boyacá»", "vis": "", "o": [["A", "El estallido de la rebelión de los Comuneros contra los nuevos impuestos en la villa del Socorro.", "La rebelión comunera ocurrió en 1781, casi cuarenta años antes de la batalla.", false], ["B", "La firma del acuerdo bipartidista que dio origen al Frente Nacional.", "El Frente Nacional se pactó en la década de 1950, más de un siglo después.", false], ["C", "El inicio de la Reconquista española dirigida por Pablo Morillo.", "La Reconquista de Morillo ocurrió en 1815-1816, antes de la batalla; Boyacá fue una derrota para el poder español restaurado.", false], ["D", "El debilitamiento decisivo del dominio español en la Nueva Granada.", "La derrota realista en Boyacá abrió a los patriotas el camino a Santafé y fue decisiva para la independencia de la Nueva Granada (Museo Nacional).", true]]}]}, {"comp": "sociales_ciudadanas", "sim": "val-2", "ses": 2, "ind": "Tratado de Versalles y organizaciones internacionales", "tt": "", "texto": "En 1919, el Tratado de Versalles puso fin oficialmente a la Primera Guerra Mundial entre los Aliados y Alemania. Alemania tuvo que aceptar la responsabilidad por los daños de la guerra (artículo 231), pagar reparaciones, ceder territorios y reducir su ejército a 100.000 hombres. El mismo tratado creó la Sociedad de Naciones.\n\nEditorial ficticio de un diario francés, 1919: «Nuestras regiones del norte quedaron arrasadas por la invasión. Es justo que quien causó la destrucción pague por reconstruirlas».\n\nEditorial ficticio de un diario alemán, 1919: «No nos dejaron negociar: nos impusieron un tratado que nos culpa de todo y arruina a nuestro pueblo. Una paz así solo siembra rencor».", "vis": "", "items": [{"id": "SCB-224", "niv": 2, "cp": "sc_pensamiento_social", "cn": "", "e": "El Tratado de Versalles creó la Sociedad de Naciones para preservar la paz entre los Estados. Esa organización no logró evitar una nueva guerra mundial, y en 1945 se creó una organización de alcance mundial, con un propósito similar, que la reemplazó. Esa organización es", "f": "un.org, «Precursora: la Sociedad de las Naciones»; Noticias ONU (27-01-2020)", "vis": "", "o": [["A", "la Organización de los Estados Americanos (OEA).", "La OEA es una organización regional del continente americano; no fue la sucesora mundial de la Sociedad de Naciones.", false], ["B", "la Comunidad Europea del Carbón y del Acero.", "La CECA (1951) fue una organización europea de integración económica, no una organización mundial para la paz.", false], ["C", "la Organización de las Naciones Unidas (ONU).", "La ONU nació formalmente el 24 de octubre de 1945, tras la firma de su Carta en San Francisco; la Sociedad de Naciones se disolvió en abril de 1946 y le traspasó sus bienes y archivos.", true], ["D", "la Organización del Tratado del Atlántico Norte (OTAN).", "La OTAN (1949) es una alianza militar de defensa colectiva entre Estados Unidos y sus aliados, no una organización de alcance mundial sucesora de la Sociedad de Naciones.", false]]}, {"id": "SCB-225", "niv": 2, "cp": "sc_perspectivas", "cn": "", "e": "¿Qué explica mejor la diferencia entre los dos editoriales?", "f": "Análisis de perspectivas; Tratado de Versalles (dipublico.org; UK Parliament, 2019)", "vis": "", "o": [["A", "Ambos diarios coinciden en que Alemania no debía pagar ninguna reparación por los daños causados durante la guerra.", "El editorial francés afirma que es justo que Alemania pague; no coinciden en ese punto.", false], ["B", "Cada diario juzga desde la situación de su país: Francia, invadida, exige reparación; Alemania, vencida, se siente castigada.", "El editorial francés parte de la destrucción sufrida y pide que el responsable pague; el alemán, desde la derrota, critica que el tratado se impuso y lo culpa de todo.", true], ["C", "El editorial francés rechaza el tratado por injusto y el alemán lo celebra como una paz equilibrada para ambos países.", "Es al revés: el francés lo considera justo y el alemán lo rechaza.", false], ["D", "Los dos editoriales discuten sobre cuántos soldados debía conservar el ejército alemán.", "Ninguno de los dos editoriales menciona el tamaño del ejército; discuten si el tratado es justo o injusto para cada país.", false]]}, {"id": "SCB-226", "niv": 3, "cp": "sc_perspectivas", "cn": "", "e": "Un estudiante usa el editorial alemán para afirmar que «el Tratado de Versalles fue la única causa de la Segunda Guerra Mundial». ¿Por qué esta conclusión no está bien sustentada?", "f": "Evaluación de los alcances de una fuente", "vis": "", "o": [["A", "Porque es una opinión de 1919 que anticipa rencor, pero no informa sobre otros factores de los años siguientes.", "Un editorial expresa una predicción y una postura; no aporta evidencia sobre lo que ocurrió después ni sobre otros factores, por lo que no basta para afirmar que el tratado fue la única causa.", true], ["B", "Porque el editorial francés muestra que el tratado era justo, y un tratado justo no puede causar otra guerra.", "El editorial francés también es una opinión de parte; que lo considere justo no demuestra nada sobre sus consecuencias.", false], ["C", "Porque el editorial alemán no menciona las reparaciones, que fueron la cláusula más dura del tratado.", "Que no se nombren las reparaciones no es la razón del problema: aunque las mencionara, una opinión de 1919 no prueba cuáles fueron todas las causas de la guerra de 1939.", false], ["D", "Porque el editorial alemán es parcial, y una fuente parcial no sirve para estudiar cómo se vio el tratado en Alemania.", "Una fuente parcial sí sirve para conocer cómo se percibió el tratado en Alemania; el problema es usarla para probar una causa única de una guerra posterior.", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "val-2", "ses": 2, "ind": "El río Magdalena", "tt": "", "texto": "El río Magdalena nace en el sur del país y desemboca en el mar Caribe. Durante siglos fue la principal vía de comunicación entre el interior andino y la costa, y hoy la macrocuenca Magdalena-Cauca concentra una gran parte de la población y de las actividades económicas del país. En los últimos años, la tala de bosques en la cuenca alta y en las laderas ha aumentado la cantidad de sedimentos que arrastra el río.", "vis": "", "items": [{"id": "SCB-229", "niv": 1, "cp": "sc_pensamiento_social", "cn": "", "e": "En la región Andina, el río Magdalena corre por el valle ubicado entre", "f": "Servicio Geológico Colombiano (Gómez Tapias et al., 2020)", "vis": "", "o": [["A", "la cordillera Occidental y la cordillera Central.", "Entre las cordilleras Occidental y Central corre el río Cauca.", false], ["B", "la cordillera Oriental y los Llanos Orientales.", "Al oriente de la cordillera Oriental está el piedemonte llanero y la Orinoquía, cuyos ríos van al Orinoco, no al Caribe.", false], ["C", "la cordillera Central y la cordillera Oriental.", "Las tres cordilleras están separadas por los valles interandinos del Cauca (entre la Occidental y la Central) y del Magdalena (entre la Central y la Oriental) (Servicio Geológico Colombiano).", true], ["D", "la cordillera Occidental y el océano Pacífico.", "Entre la cordillera Occidental y el Pacífico se encuentra la llanura de la región Pacífica, no el valle del Magdalena.", false]]}, {"id": "SCB-230", "niv": 2, "cp": "sc_reflexivo_sistemico", "cn": "", "e": "¿Qué cadena de efectos se puede esperar a partir de la tala de bosques en la cuenca?", "f": "IDEAM, Informe del estado del ambiente 2023 (cuenca Magdalena-Cauca); análisis de relaciones entre dimensiones", "vis": "", "o": [["A", "Más sedimentos en el río, aguas más limpias para los acueductos y menores costos de potabilización.", "Más sedimentos hacen el agua más turbia y encarecen su tratamiento.", false], ["B", "Más sedimentos en el río, mayor profundidad del cauce y mejores condiciones para la navegación de carga.", "Los sedimentos se depositan en el cauce y reducen la profundidad; no la aumentan.", false], ["C", "Menos lluvias en la cuenca, menor caudal en la desembocadura y menos pesca en el mar Caribe.", "El texto relaciona la tala con más sedimentos, no con una reducción de las lluvias; esa cadena no se sigue del caso.", false], ["D", "Más sedimentos, menor profundidad en algunos tramos, más dificultad para navegar y transporte de carga más caro.", "La tala deja el suelo expuesto a la erosión; los sedimentos se acumulan en el cauce, reducen su profundidad y dificultan la navegación, lo que encarece el transporte fluvial: un efecto ambiental con consecuencias económicas.", true]]}]}, {"comp": "sociales_ciudadanas", "sim": "val-2", "ses": 2, "ind": "Desempleo juvenil y adulto", "tt": "", "texto": "La gráfica muestra la tasa de desempleo de una ciudad ficticia para dos grupos de edad entre 2021 y 2025. En un debate, un candidato al concejo afirmó: «El desempleo de los jóvenes ya está resuelto en nuestra ciudad, porque bajó todos los años».", "vis": "<div class=\"vfig\"><svg class=\"vg\" viewBox=\"0 0 560 320\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Gráfica 6. Tasa de desempleo por grupo de edad (%)\" font-family=\"Arial, sans-serif\" font-size=\"12\"><rect width=\"560\" height=\"320\" fill=\"#ffffff\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"13\" fill=\"#1d2433\">Gráfica 6. Tasa de desempleo por grupo de edad (%)<\/text><line x1=\"60\" y1=\"258.0\" x2=\"540\" y2=\"258.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"262.0\" text-anchor=\"end\" fill=\"#3a4356\">0<\/text><line x1=\"60\" y1=\"213.6\" x2=\"540\" y2=\"213.6\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"217.6\" text-anchor=\"end\" fill=\"#3a4356\">5<\/text><line x1=\"60\" y1=\"169.2\" x2=\"540\" y2=\"169.2\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"173.2\" text-anchor=\"end\" fill=\"#3a4356\">10<\/text><line x1=\"60\" y1=\"124.8\" x2=\"540\" y2=\"124.8\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"128.8\" text-anchor=\"end\" fill=\"#3a4356\">15<\/text><line x1=\"60\" y1=\"80.4\" x2=\"540\" y2=\"80.4\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"84.4\" text-anchor=\"end\" fill=\"#3a4356\">20<\/text><line x1=\"60\" y1=\"36.0\" x2=\"540\" y2=\"36.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"40.0\" text-anchor=\"end\" fill=\"#3a4356\">25<\/text><line x1=\"60\" y1=\"258\" x2=\"540\" y2=\"258\" stroke=\"#3a4356\"/><line x1=\"60\" y1=\"258\" x2=\"60\" y2=\"36\" stroke=\"#3a4356\"/><text transform=\"translate(14,147.0) rotate(-90)\" text-anchor=\"middle\" fill=\"#3a4356\">Tasa de desempleo (%)<\/text><text x=\"300.0\" y=\"312\" text-anchor=\"middle\" fill=\"#3a4356\">Año<\/text><text x=\"108.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">2021<\/text><text x=\"204.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">2022<\/text><text x=\"300.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">2023<\/text><text x=\"396.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">2024<\/text><text x=\"492.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">2025<\/text><polyline fill=\"none\" stroke=\"#1660a8\" stroke-width=\"2.5\" points=\"108.0,62.6 204.0,89.3 300.0,107.0 396.0,115.9 492.0,124.8\"/><circle cx=\"108.0\" cy=\"62.6\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"108.0\" y=\"54.6\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">22<\/text><circle cx=\"204.0\" cy=\"89.3\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"204.0\" y=\"81.3\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">19<\/text><circle cx=\"300.0\" cy=\"107.0\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"300.0\" y=\"99.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">17<\/text><circle cx=\"396.0\" cy=\"115.9\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"396.0\" y=\"107.9\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">16<\/text><circle cx=\"492.0\" cy=\"124.8\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"492.0\" y=\"116.8\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">15<\/text><polyline fill=\"none\" stroke=\"#d9822b\" stroke-width=\"2.5\" points=\"108.0,160.3 204.0,169.2 300.0,178.1 396.0,178.1 492.0,187.0\"/><circle cx=\"108.0\" cy=\"160.3\" r=\"3.5\" fill=\"#d9822b\"/><text x=\"108.0\" y=\"177.3\" text-anchor=\"middle\" font-size=\"11\" fill=\"#d9822b\" font-weight=\"bold\">11<\/text><circle cx=\"204.0\" cy=\"169.2\" r=\"3.5\" fill=\"#d9822b\"/><text x=\"204.0\" y=\"186.2\" text-anchor=\"middle\" font-size=\"11\" fill=\"#d9822b\" font-weight=\"bold\">10<\/text><circle cx=\"300.0\" cy=\"178.1\" r=\"3.5\" fill=\"#d9822b\"/><text x=\"300.0\" y=\"195.1\" text-anchor=\"middle\" font-size=\"11\" fill=\"#d9822b\" font-weight=\"bold\">9<\/text><circle cx=\"396.0\" cy=\"178.1\" r=\"3.5\" fill=\"#d9822b\"/><text x=\"396.0\" y=\"195.1\" text-anchor=\"middle\" font-size=\"11\" fill=\"#d9822b\" font-weight=\"bold\">9<\/text><circle cx=\"492.0\" cy=\"187.0\" r=\"3.5\" fill=\"#d9822b\"/><text x=\"492.0\" y=\"204.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#d9822b\" font-weight=\"bold\">8<\/text><rect x=\"60\" y=\"286\" width=\"12\" height=\"12\" fill=\"#1660a8\"/><text x=\"76\" y=\"296\" fill=\"#1d2433\">Jóvenes de 18 a 28 años<\/text><rect x=\"247\" y=\"286\" width=\"12\" height=\"12\" fill=\"#d9822b\"/><text x=\"263\" y=\"296\" fill=\"#1d2433\">Adultos de 29 a 55 años<\/text><\/svg><\/div>", "items": [{"id": "SCB-234", "niv": 1, "cp": "sc_perspectivas", "cn": "", "e": "¿Cuál de las siguientes afirmaciones se apoya en los datos de la gráfica?", "f": "Datos ficticios de la gráfica", "vis": "", "o": [["A", "La tasa de desempleo de los adultos aumentó todos los años entre 2021 y 2025.", "La tasa de los adultos bajó de 11 % a 8 %, con un año sin cambio (2023 a 2024).", false], ["B", "La tasa de desempleo de los jóvenes se mantuvo igual durante los cinco años.", "La tasa de los jóvenes cambió cada año: bajó de 22 % a 15 %.", false], ["C", "En 2025, la tasa de desempleo de los adultos superó por primera vez la tasa de desempleo de los jóvenes.", "En 2025 los jóvenes tienen 15 % y los adultos 8 %; los adultos nunca superan a los jóvenes.", false], ["D", "En todos los años, la tasa de desempleo de los jóvenes fue mayor que la de los adultos.", "En cada año la línea de los jóvenes (22, 19, 17, 16 y 15 %) está por encima de la de los adultos (11, 10, 9, 9 y 8 %).", true]]}, {"id": "SCB-235", "niv": 3, "cp": "sc_perspectivas", "cn": "", "e": "¿Cómo se puede evaluar la afirmación del candidato a partir de la gráfica?", "f": "Datos ficticios de la gráfica; evaluación de afirmaciones", "vis": "", "o": [["A", "Exagera: la tasa bajó cada año, pero en 2025 seguía siendo casi el doble de la de los adultos.", "El dato de la reducción es cierto (de 22 % a 15 %), pero en 2025 la tasa juvenil (15 %) era casi el doble de la adulta (8 %); decir que el problema está «resuelto» no se sostiene.", true], ["B", "Es correcta, porque una tasa que baja todos los años indica que el problema del desempleo juvenil desapareció.", "Que una tasa baje no significa que el problema haya desaparecido: en 2025 todavía el 15 % de los jóvenes estaba desempleado.", false], ["C", "No se puede evaluar, porque la gráfica no muestra datos de desempleo de los jóvenes.", "La gráfica sí incluye una línea para jóvenes de 18 a 28 años.", false], ["D", "Es incorrecta, porque la tasa de desempleo juvenil aumentó entre 2021 y 2025.", "La tasa juvenil sí bajó todos los años; el error del candidato no está en ese dato.", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "val-2", "ses": 2, "ind": "Subsidio a la gasolina", "tt": "", "texto": "En un país ficticio, el gobierno paga una parte del precio de la gasolina para que los consumidores la compren más barata. Se discute eliminar ese subsidio de forma gradual.\n\nMinistra de Hacienda: «Cada año gastamos en este subsidio una suma enorme. Ese dinero podría invertirse en hospitales y colegios».\n\nTaxista: «Si sube la gasolina, tengo que subir la tarifa o ganar menos».\n\nEconomista: «El subsidio beneficia más a quien más gasolina consume, y en este país los hogares que más consumen son los que tienen más vehículos, que suelen ser los de mayores ingresos».", "vis": "", "items": [{"id": "SCB-239", "niv": 2, "cp": "sc_reflexivo_sistemico", "cn": "", "e": "Si el subsidio se elimina, ¿qué combinación de efectos es coherente con las opiniones del caso?", "f": "Análisis de efectos de una decisión económica", "vis": "", "o": [["A", "Los hogares de mayores ingresos serían los menos afectados, porque consumen menos gasolina.", "El economista afirma lo contrario: los hogares de mayores ingresos son los que más gasolina consumen.", false], ["B", "El Estado ahorraría recursos y bajarían las tarifas de transporte, porque habría menos carros en las calles.", "La primera parte es coherente, pero el taxista anticipa que subiría su tarifa o ganaría menos, no que las tarifas bajarían.", false], ["C", "El Estado tendría más recursos para otros gastos, pero subirían los costos de transporte.", "La ministra señala que el dinero del subsidio podría ir a salud y educación; el taxista advierte que la gasolina más cara aumentaría sus costos o reduciría su ingreso.", true], ["D", "Subiría el precio de la gasolina, y el Estado tendría que gastar más para compensar a los taxistas.", "El caso no menciona compensaciones a los taxistas; el efecto fiscal que plantea la ministra es un ahorro.", false]]}, {"id": "SCB-240", "niv": 3, "cp": "sc_perspectivas", "cn": "", "e": "¿Qué información permitiría comprobar mejor el argumento del economista?", "f": "Evaluación de la solidez de un argumento", "vis": "", "o": [["A", "El número de taxis que circulan en la capital del país.", "Ese dato no permite comparar el consumo entre hogares de distintos ingresos.", false], ["B", "El consumo de gasolina de los hogares según su nivel de ingresos.", "El economista afirma que los hogares de mayores ingresos consumen más gasolina; datos de consumo por nivel de ingreso permiten verificar si eso es cierto.", true], ["C", "La opinión de los ciudadanos sobre la gestión de la ministra.", "Una opinión sobre la ministra no comprueba quién se beneficia del subsidio.", false], ["D", "El precio internacional del petróleo durante los últimos diez años.", "El precio internacional explica el costo del subsidio, pero no muestra quiénes se benefician más de él.", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "val-2", "ses": 2, "ind": "Paneles solares en una vereda", "tt": "", "texto": "Una vereda ficticia de la Orinoquía no tiene conexión a la red eléctrica. La gobernación instaló paneles solares con baterías en las 40 viviendas y en la escuela. Antes, las familias usaban velas y una planta de diésel que solo encendían pocas horas a la semana.", "vis": "", "items": [{"id": "SCB-243", "niv": 1, "cp": "sc_reflexivo_sistemico", "cn": "", "e": "¿Cuál es un efecto esperable de la instalación de los paneles en la vida de la vereda?", "f": "Análisis de efectos de una intervención", "vis": "", "o": [["A", "Las familias dejarían las velas, pero tendrían que encender la planta de diésel más horas.", "Los paneles reemplazan en buena parte la planta de diésel; lo esperable es que se use menos, no más.", false], ["B", "La vereda podría vender a la red nacional la energía que produzcan los paneles.", "El texto dice que la vereda no tiene conexión a la red; los paneles con baterías son un sistema aislado.", false], ["C", "Los niños podrían estudiar de noche y las familias tendrían luz y podrían cargar aparatos.", "Con paneles y baterías, las casas y la escuela tienen iluminación y pueden cargar celulares o radios; esto beneficia el estudio y la comunicación.", true], ["D", "Las familias podrían usar electricidad sin límite, como en las ciudades conectadas a la red.", "Un sistema de paneles con baterías tiene una capacidad limitada; no ofrece electricidad ilimitada.", false]]}, {"id": "SCB-244", "niv": 2, "cp": "sc_reflexivo_sistemico", "cn": "", "e": "Dos años después, varias baterías están dañadas y nadie en la vereda sabe repararlas. ¿Qué aspecto debió incluir el proyecto para que la solución fuera sostenible?", "f": "Análisis de la sostenibilidad de una alternativa de solución", "vis": "", "o": [["A", "La capacitación de personas de la vereda para el mantenimiento y un plan para reponer las baterías.", "La sostenibilidad depende de que la comunidad pueda mantener los equipos y reponer las piezas que se desgastan; sin ello, la inversión pierde su efecto con el tiempo.", true], ["B", "La instalación de los paneles solares solo en la escuela, y no en las viviendas de las familias.", "Reducir la cobertura no resuelve la falta de mantenimiento; solo disminuye los beneficios.", false], ["C", "La prohibición de usar electrodomésticos en las viviendas para que las baterías duren más tiempo.", "Prohibir el uso de la energía va en contra del propósito del proyecto y no resuelve el daño de las baterías.", false], ["D", "La compra de más velas y de combustible diésel para usarlos cada vez que fallen los paneles solares.", "Volver a las velas no resuelve el problema; significa aceptar que el proyecto fracase.", false]]}]}, {"comp": "ciencias_naturales", "sim": "val-2", "ses": 2, "ind": "Herencia de grupos sanguíneos y del daltonismo", "tt": "", "texto": "El grupo sanguíneo ABO depende de tres alelos: IA, IB e i. (Se usa la notación simplificada IA, IB e i.) Los alelos IA e IB son codominantes entre sí y ambos son dominantes sobre i. Así, una persona IAIB es del grupo AB, y una persona ii es del grupo O. Por otra parte, el daltonismo más común se debe a un alelo recesivo ubicado en el cromosoma X; las mujeres tienen dos cromosomas X y los hombres tienen un cromosoma X y uno Y.", "vis": "", "items": [{"id": "CNB-201", "niv": 2, "cp": "cn_uso_comprensivo", "cn": "biologico", "e": "Un hombre del grupo AB y una mujer del grupo O tienen hijos. ¿Qué grupos sanguíneos pueden tener sus hijos?", "f": "Herencia del sistema ABO", "vis": "", "o": [["A", "AB u O.", "Supone que los hijos heredan el grupo completo de uno de los padres; cada hijo recibe un solo alelo de cada progenitor.", false], ["B", "A, B, AB u O.", "Los grupos AB y O son imposibles: la madre no aporta IA ni IB, y el padre no tiene el alelo i.", false], ["C", "Solamente AB.", "Para ser AB el hijo necesitaría recibir IA de un progenitor e IB del otro, pero la madre solo tiene alelos i.", false], ["D", "A o B.", "El padre aporta IA o IB y la madre siempre aporta i; los hijos serán IAi (grupo A) o IBi (grupo B).", true]]}, {"id": "CNB-202", "niv": 3, "cp": "cn_explicacion", "cn": "biologico", "e": "¿Por qué el daltonismo es mucho más frecuente en hombres que en mujeres?", "f": "Herencia ligada al cromosoma X", "vis": "", "o": [["A", "Porque el alelo del daltonismo está en el cromosoma Y, que solo tienen los hombres.", "El texto indica que el alelo está en el cromosoma X, no en el Y.", false], ["B", "Porque los hombres tienen un solo cromosoma X y les basta un alelo recesivo.", "En los hombres no hay un segundo X con un alelo dominante que lo compense; en las mujeres se necesitan dos alelos recesivos.", true], ["C", "Porque los hombres reciben de su padre el cromosoma X.", "Los hombres reciben el cromosoma X de su madre y el Y de su padre.", false], ["D", "Porque las mujeres no pueden heredar el alelo del daltonismo.", "Las mujeres sí lo heredan; si tienen un solo alelo son portadoras y, si tienen dos, son daltónicas.", false]]}]}, {"comp": "ciencias_naturales", "sim": "val-2", "ses": 2, "ind": "Fertilizantes y oxígeno en una ciénaga", "tt": "", "texto": "Junto a una ciénaga hay cultivos que usan fertilizantes con nitratos y fosfatos. La lluvia arrastra parte de esos fertilizantes hasta un caño que desemboca en la ciénaga. Un grupo de pescadores notó en el último año que el agua cerca de la desembocadura se volvió verde y que aparecieron peces muertos. Una corporación ambiental midió el oxígeno disuelto a diferentes distancias de la desembocadura.", "vis": "<table class=\"vt\"><caption>Tabla 11. Oxígeno disuelto en la ciénaga<\/caption><thead><tr><th>Distancia a la desembocadura del caño (km)<\/th><th>Oxígeno disuelto (mg/L)<\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td>2,1<\/td><\/tr><tr><td>1<\/td><td>3,4<\/td><\/tr><tr><td>3<\/td><td>5,8<\/td><\/tr><tr><td>5<\/td><td>7,2<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Datos ficticios.<\/div>", "items": [{"id": "CNB-203", "niv": 2, "cp": "cn_explicacion", "cn": "biologico", "e": "¿Qué explicación es la más adecuada para la muerte de los peces cerca de la desembocadura?", "f": "Eutrofización", "vis": "", "o": [["A", "Las algas proliferan con los nutrientes, y su descomposición agota el oxígeno.", "Es la eutrofización: las bacterias que descomponen la gran cantidad de algas muertas usan el oxígeno disuelto, y los peces se asfixian.", true], ["B", "Las algas consumen todo el oxígeno del agua durante el día al hacer fotosíntesis.", "La fotosíntesis produce oxígeno; no lo consume.", false], ["C", "Los fertilizantes aumentan la temperatura del agua y los peces mueren por el calor.", "Los nitratos y fosfatos no calientan el agua; el problema descrito es el bajo oxígeno disuelto.", false], ["D", "Los peces se envenenan porque se alimentan directamente de los gránulos de fertilizante que caen al agua.", "Los peces no se alimentan de fertilizantes; el efecto ocurre a través del crecimiento de las algas y la pérdida de oxígeno.", false]]}, {"id": "CNB-204", "niv": 2, "cp": "cn_indagacion", "cn": "biologico", "e": "¿Qué conclusión se apoya en los datos de la tabla?", "f": "Análisis de datos ambientales", "vis": "", "o": [["A", "El oxígeno disuelto aumenta 1,3 mg/L por cada kilómetro de distancia.", "El aumento no es constante: entre 1 km y 3 km sube 2,4 mg/L (1,2 por km) y entre 3 km y 5 km sube 1,4 mg/L (0,7 por km).", false], ["B", "A 10 km de la desembocadura el oxígeno disuelto será de unos 14 mg/L.", "Es una extrapolación lejos del rango medido; los datos no permiten predecir ese valor.", false], ["C", "El oxígeno disuelto es menor cerca de la desembocadura y aumenta al alejarse.", "Los valores pasan de 2,1 mg/L en la desembocadura a 7,2 mg/L a 5 km.", true], ["D", "Los fertilizantes reducen el oxígeno disuelto en la misma proporción en toda la ciénaga.", "La tabla muestra valores muy distintos según la distancia, no una reducción igual en toda la ciénaga.", false]]}]}, {"comp": "ciencias_naturales", "sim": "val-2", "ses": 2, "ind": "El cuerpo durante el trabajo físico", "tt": "", "texto": "Un trabajador de bodega usó un reloj que mide la frecuencia cardiaca (latidos por minuto) mientras descargaba bultos y luego mientras descansaba. Los datos se muestran en la gráfica.", "vis": "<div class=\"vfig\"><svg class=\"vg\" viewBox=\"0 0 560 320\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Gráfica 7. Frecuencia cardiaca del trabajador\" font-family=\"Arial, sans-serif\" font-size=\"12\"><rect width=\"560\" height=\"320\" fill=\"#ffffff\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"13\" fill=\"#1d2433\">Gráfica 7. Frecuencia cardiaca del trabajador<\/text><line x1=\"60\" y1=\"258.0\" x2=\"540\" y2=\"258.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"262.0\" text-anchor=\"end\" fill=\"#3a4356\">0<\/text><line x1=\"60\" y1=\"213.6\" x2=\"540\" y2=\"213.6\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"217.6\" text-anchor=\"end\" fill=\"#3a4356\">25<\/text><line x1=\"60\" y1=\"169.2\" x2=\"540\" y2=\"169.2\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"173.2\" text-anchor=\"end\" fill=\"#3a4356\">50<\/text><line x1=\"60\" y1=\"124.8\" x2=\"540\" y2=\"124.8\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"128.8\" text-anchor=\"end\" fill=\"#3a4356\">75<\/text><line x1=\"60\" y1=\"80.4\" x2=\"540\" y2=\"80.4\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"84.4\" text-anchor=\"end\" fill=\"#3a4356\">100<\/text><line x1=\"60\" y1=\"36.0\" x2=\"540\" y2=\"36.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"40.0\" text-anchor=\"end\" fill=\"#3a4356\">125<\/text><line x1=\"60\" y1=\"258\" x2=\"540\" y2=\"258\" stroke=\"#3a4356\"/><line x1=\"60\" y1=\"258\" x2=\"60\" y2=\"36\" stroke=\"#3a4356\"/><text transform=\"translate(14,147.0) rotate(-90)\" text-anchor=\"middle\" fill=\"#3a4356\">Latidos por minuto<\/text><text x=\"300.0\" y=\"312\" text-anchor=\"middle\" fill=\"#3a4356\">Momento del registro<\/text><text x=\"108.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Reposo<\/text><text x=\"204.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Esfuerzo 10 min<\/text><text x=\"300.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Esfuerzo 20 min<\/text><text x=\"396.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Descanso 5 min<\/text><text x=\"492.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Descanso 10 min<\/text><polyline fill=\"none\" stroke=\"#1660a8\" stroke-width=\"2.5\" points=\"108.0,133.7 204.0,44.9 300.0,36.0 396.0,89.3 492.0,124.8\"/><circle cx=\"108.0\" cy=\"133.7\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"108.0\" y=\"125.7\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">70<\/text><circle cx=\"204.0\" cy=\"44.9\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"204.0\" y=\"36.9\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">120<\/text><circle cx=\"300.0\" cy=\"36.0\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"300.0\" y=\"28.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">125<\/text><circle cx=\"396.0\" cy=\"89.3\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"396.0\" y=\"81.3\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">95<\/text><circle cx=\"492.0\" cy=\"124.8\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"492.0\" y=\"116.8\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">75<\/text><\/svg><\/div>", "items": [{"id": "CNB-207", "niv": 2, "cp": "cn_indagacion", "cn": "biologico", "e": "¿En cuál de los registros de descanso la frecuencia cardiaca ya estaba a menos de 10 latidos por minuto del valor de reposo?", "f": "Interpretación de gráficas", "vis": "", "o": [["A", "En el registro de 5 minutos de descanso.", "A los 5 minutos de descanso la frecuencia era 95, es decir, 25 latidos por encima del reposo (70).", false], ["B", "En el registro de 10 minutos de descanso.", "A los 10 minutos de descanso la frecuencia era 75, solo 5 latidos por encima del valor de reposo (70).", true], ["C", "En los dos registros de descanso.", "En el registro de 5 minutos la frecuencia (95) seguía 25 latidos por encima del reposo.", false], ["D", "En ninguno de los dos registros de descanso.", "En el registro de 10 minutos la frecuencia (75) ya estaba a solo 5 latidos del reposo (70).", false]]}, {"id": "CNB-208", "niv": 2, "cp": "cn_explicacion", "cn": "biologico", "e": "¿Por qué aumenta la frecuencia cardiaca durante el esfuerzo físico?", "f": "Sistema circulatorio y ejercicio", "vis": "", "o": [["A", "Porque al hacer esfuerzo los pulmones toman menos aire y el corazón debe compensarlo.", "Durante el esfuerzo la respiración se hace más rápida y profunda; los pulmones toman más aire, no menos.", false], ["B", "Porque durante el esfuerzo el corazón necesita para sí mismo más oxígeno que los músculos.", "El mayor consumo de oxígeno está en los músculos que trabajan; el corazón acelera para abastecerlos a ellos.", false], ["C", "Porque el esfuerzo eleva la temperatura del cuerpo y el corazón late más rápido para producir el sudor.", "El sudor lo producen las glándulas sudoríparas; el aumento de la frecuencia cardiaca responde sobre todo a la demanda de oxígeno de los músculos.", false], ["D", "Porque los músculos necesitan más oxígeno y nutrientes, y la sangre debe llevarlos más rápido.", "La respiración celular de los músculos aumenta; al latir más rápido, el corazón aumenta el flujo de sangre con oxígeno y glucosa.", true]]}, {"id": "CNB-209", "niv": 1, "cp": "cn_uso_comprensivo", "cn": "biologico", "e": "Mientras trabaja, el trabajador suda. ¿Cómo ayuda el sudor a regular la temperatura del cuerpo?", "f": "Termorregulación", "vis": "", "o": [["A", "El sudor sale más frío que el cuerpo y lo enfría por contacto.", "El sudor sale aproximadamente a la temperatura del cuerpo; el enfriamiento se debe a su evaporación.", false], ["B", "El sudor forma una capa aislante que impide que entre el calor del ambiente.", "El sudor no actúa como aislante; enfría al evaporarse.", false], ["C", "El sudor elimina la grasa del cuerpo, que es la que produce el calor.", "El sudor es principalmente agua con sales; no elimina la grasa ni es esa la forma de enfriar el cuerpo.", false], ["D", "Al evaporarse de la piel, el sudor absorbe calor del cuerpo.", "La evaporación del agua requiere energía, que toma de la piel; así el cuerpo pierde calor.", true]]}]}, {"comp": "ciencias_naturales", "sim": "val-2", "ses": 2, "ind": "Cómo funcionan las vacunas", "tt": "", "texto": "En una jornada de vacunación de una empresa, una enfermera explica a los trabajadores que la vacuna no cura una enfermedad que ya se tiene, sino que prepara al cuerpo para defenderse de un microorganismo en el futuro.", "vis": "", "items": [{"id": "CNB-210", "niv": 2, "cp": "cn_uso_comprensivo", "cn": "biologico", "e": "¿Cómo prepara una vacuna al cuerpo para defenderse?", "f": "Sistema inmunitario y vacunas", "vis": "", "o": [["A", "Contiene antibióticos que eliminan los virus que entren después al cuerpo de la persona.", "Los antibióticos no actúan contra virus, y las vacunas no son antibióticos.", false], ["B", "Expone al cuerpo a antígenos del microorganismo para generar memoria inmunitaria.", "Las células de memoria reconocen después al microorganismo real y permiten una respuesta más rápida y fuerte.", true], ["C", "Debilita al microorganismo dentro del cuerpo de la persona que ya está enferma.", "Según el texto, la vacuna no cura una enfermedad que ya se tiene; prepara al cuerpo antes del contagio.", false], ["D", "Contiene anticuerpos ya formados que permanecen en la sangre durante toda la vida.", "Los anticuerpos recibidos ya formados duran poco; la protección duradera de la vacuna se debe a que el propio cuerpo genera memoria inmunitaria.", false]]}]}, {"comp": "ciencias_naturales", "sim": "val-2", "ses": 2, "ind": "Consumo de energía eléctrica en el hogar", "tt": "", "texto": "La energía eléctrica que consume un aparato es igual a su potencia multiplicada por el tiempo de uso. Las facturas la cobran en kilovatios hora (kWh); 1 kWh = 1.000 Wh.", "vis": "", "items": [{"id": "CNB-211", "niv": 1, "cp": "cn_uso_comprensivo", "cn": "fisico", "e": "Un televisor de 150 W permanece encendido 4 horas al día durante 30 días. ¿Cuánta energía consume en ese mes?", "f": "Energía eléctrica: potencia × tiempo", "vis": "", "o": [["A", "0,6 kWh.", "Es el consumo de un solo día (150 W × 4 h = 600 Wh); falta multiplicar por los 30 días.", false], ["B", "18 kWh.", "150 W × 4 h × 30 días = 18.000 Wh = 18 kWh.", true], ["C", "600 kWh.", "Toma los 600 Wh de un día como si fueran kilovatios hora y no multiplica por los días.", false], ["D", "18.000 kWh.", "Calcula bien 18.000, pero esas son unidades de vatios hora; falta dividir entre 1.000.", false]]}, {"id": "CNB-212", "niv": 1, "cp": "cn_explicacion", "cn": "fisico", "e": "¿Por qué es peligroso conectar varios aparatos de alta potencia, como una plancha y un horno, en una misma extensión delgada?", "f": "Seguridad eléctrica", "vis": "", "o": [["A", "Porque la corriente total aumenta y el cable se calienta, lo que puede causar un incendio.", "Cada aparato en paralelo suma su corriente; un cable delgado con mucha corriente se calienta y puede derretir el aislante.", true], ["B", "Porque cada aparato adicional aumenta la resistencia total y el cable recibe más voltaje.", "En paralelo, cada aparato añadido disminuye la resistencia total, y el voltaje se mantiene; lo que aumenta es la corriente.", false], ["C", "Porque el voltaje del tomacorriente se multiplica por el número de aparatos que se conectan.", "El voltaje del tomacorriente se mantiene; lo que aumenta es la corriente total.", false], ["D", "Porque los aparatos se quitan energía unos a otros hasta que todos se dañan.", "Los aparatos en paralelo no se quitan energía entre sí; el riesgo está en el calentamiento del cable.", false]]}, {"id": "CNB-213", "niv": 1, "cp": "cn_indagacion", "cn": "fisico", "e": "Un almacén compara dos bombillos que producen una cantidad de luz similar. Según la tabla, ¿qué conclusión es correcta?", "f": "Análisis de datos: eficiencia energética", "vis": "<table class=\"vt\"><caption>Tabla 12. Comparación de dos bombillos (5 horas al día durante 30 días)<\/caption><thead><tr><th>Bombillo<\/th><th>Potencia (W)<\/th><th>Luz producida (lúmenes)<\/th><th>Consumo mensual (kWh)<\/th><\/tr><\/thead><tbody><tr><td>Incandescente<\/td><td>60<\/td><td>800<\/td><td>9<\/td><\/tr><tr><td>LED<\/td><td>9<\/td><td>800<\/td><td>1,35<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Valores aproximados.<\/div>", "o": [["A", "El bombillo incandescente convierte toda su energía en luz.", "La tabla no muestra eso, y en realidad gran parte de su energía se transforma en calor.", false], ["B", "El bombillo LED produce mucha más luz que el incandescente.", "Ambos producen alrededor de 800 lúmenes; la cantidad de luz es similar.", false], ["C", "Para dar una luz similar, el bombillo LED consume mucha menos energía.", "Con la misma luz, el LED usa 9 W frente a 60 W del incandescente, y en un mes consume 1,35 kWh frente a 9 kWh.", true], ["D", "Los dos bombillos consumen la misma energía, porque producen la misma luz.", "En un mes, el incandescente consume 9 kWh y el LED 1,35 kWh.", false]]}]}, {"comp": "ciencias_naturales", "sim": "val-2", "ses": 2, "ind": "Movimiento de una moto de domicilios", "tt": "", "texto": "Una empresa de domicilios analiza los recorridos y el frenado de las motos de sus repartidores para mejorar la seguridad vial.", "vis": "", "items": [{"id": "CNB-217", "niv": 1, "cp": "cn_uso_comprensivo", "cn": "fisico", "e": "Un repartidor recorre 18 km en 24 minutos. ¿Cuál fue su rapidez media en kilómetros por hora?", "f": "Rapidez media", "vis": "", "o": [["A", "0,75 km/h.", "Divide 18 km entre 24 minutos, lo que da 0,75 km por minuto, no por hora.", false], ["B", "7,2 km/h.", "Multiplica la distancia por el tiempo en horas (18 × 0,4), en lugar de dividir.", false], ["C", "45 km/h.", "24 min = 0,4 h; rapidez = 18 km ÷ 0,4 h = 45 km/h.", true], ["D", "432 km/h.", "Multiplica la distancia por los minutos (18 × 24).", false]]}, {"id": "CNB-218", "niv": 2, "cp": "cn_explicacion", "cn": "fisico", "e": "¿Por qué una moto necesita más distancia para detenerse sobre el pavimento mojado que sobre el pavimento seco?", "f": "Fuerza de fricción", "vis": "", "o": [["A", "Porque el agua empuja la moto hacia adelante mientras esta frena.", "El agua del pavimento no ejerce un empuje hacia adelante sobre la moto.", false], ["B", "Porque el agua aumenta la fricción entre las llantas y el pavimento.", "Ocurre lo contrario: el agua disminuye la fricción.", false], ["C", "Porque el agua aumenta la masa de la moto y por eso es más difícil detenerla a tiempo.", "El agua del pavimento no aumenta de forma apreciable la masa de la moto.", false], ["D", "Porque el agua reduce la fricción con el pavimento y la moto desacelera menos.", "La fuerza de fricción es la que detiene la moto; si es menor, la desaceleración es menor y la distancia de frenado aumenta.", true]]}, {"id": "CNB-219", "niv": 3, "cp": "cn_indagacion", "cn": "fisico", "e": "En una pista seca se midió la distancia de frenado de una moto a diferentes rapideces. ¿Qué relación muestran los datos?", "f": "Análisis de datos: distancia de frenado", "vis": "<table class=\"vt\"><caption>Tabla 13. Distancia de frenado en pista seca<\/caption><thead><tr><th>Rapidez (km/h)<\/th><th>Distancia de frenado (m)<\/th><\/tr><\/thead><tbody><tr><td>20<\/td><td>2<\/td><\/tr><tr><td>40<\/td><td>8<\/td><\/tr><tr><td>60<\/td><td>18<\/td><\/tr><tr><td>80<\/td><td>32<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Datos ficticios.<\/div>", "o": [["A", "Al duplicar la rapidez, la distancia de frenado se cuadruplica.", "De 20 a 40 km/h la distancia pasa de 2 a 8 m, y de 40 a 80 km/h, de 8 a 32 m: en ambos casos se multiplica por 4.", true], ["B", "La distancia de frenado aumenta 6 m por cada 20 km/h de rapidez.", "Solo de 20 a 40 km/h aumenta 6 m; de 40 a 60 km/h aumenta 10 m.", false], ["C", "La distancia de frenado es directamente proporcional a la rapidez.", "Si lo fuera, al pasar de 20 a 40 km/h la distancia se duplicaría, pero se cuadruplica (de 2 m a 8 m).", false], ["D", "A mayor rapidez, la moto necesita menos distancia para frenar.", "Los datos muestran que la distancia aumenta con la rapidez.", false]]}]}, {"comp": "ciencias_naturales", "sim": "val-2", "ses": 2, "ind": "Residuos sólidos de un municipio", "tt": "", "texto": "La gráfica muestra la composición de los residuos sólidos que un municipio envía cada semana al relleno sanitario.", "vis": "<div class=\"vfig\"><svg class=\"vg\" viewBox=\"0 0 560 320\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Gráfica 8. Composición de los residuos enviados al relleno\" font-family=\"Arial, sans-serif\" font-size=\"12\"><rect width=\"560\" height=\"320\" fill=\"#ffffff\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"13\" fill=\"#1d2433\">Gráfica 8. Composición de los residuos enviados al relleno<\/text><path d=\"M170,175 L170.0,60.0 A115,115 0 1,1 134.5,284.4 Z\" fill=\"#1660a8\" stroke=\"#fff\" stroke-width=\"1.5\"/><path d=\"M170,175 L134.5,284.4 A115,115 0 0,1 60.6,210.5 Z\" fill=\"#d9822b\" stroke=\"#fff\" stroke-width=\"1.5\"/><path d=\"M170,175 L60.6,210.5 A115,115 0 0,1 65.9,126.0 Z\" fill=\"#2e8b57\" stroke=\"#fff\" stroke-width=\"1.5\"/><path d=\"M170,175 L65.9,126.0 A115,115 0 0,1 91.3,91.2 Z\" fill=\"#8e44ad\" stroke=\"#fff\" stroke-width=\"1.5\"/><path d=\"M170,175 L91.3,91.2 A115,115 0 0,1 114.6,74.2 Z\" fill=\"#c0392b\" stroke=\"#fff\" stroke-width=\"1.5\"/><path d=\"M170,175 L114.6,74.2 A115,115 0 0,1 170.0,60.0 Z\" fill=\"#7f8c8d\" stroke=\"#fff\" stroke-width=\"1.5\"/><rect x=\"320\" y=\"59\" width=\"14\" height=\"14\" fill=\"#1660a8\"/><text x=\"340\" y=\"70\" fill=\"#1d2433\">Orgánicos: 55 %<\/text><rect x=\"320\" y=\"83\" width=\"14\" height=\"14\" fill=\"#d9822b\"/><text x=\"340\" y=\"94\" fill=\"#1d2433\">Plásticos: 15 %<\/text><rect x=\"320\" y=\"107\" width=\"14\" height=\"14\" fill=\"#2e8b57\"/><text x=\"340\" y=\"118\" fill=\"#1d2433\">Papel y cartón: 12 %<\/text><rect x=\"320\" y=\"131\" width=\"14\" height=\"14\" fill=\"#8e44ad\"/><text x=\"340\" y=\"142\" fill=\"#1d2433\">Vidrio: 6 %<\/text><rect x=\"320\" y=\"155\" width=\"14\" height=\"14\" fill=\"#c0392b\"/><text x=\"340\" y=\"166\" fill=\"#1d2433\">Metales: 4 %<\/text><rect x=\"320\" y=\"179\" width=\"14\" height=\"14\" fill=\"#7f8c8d\"/><text x=\"340\" y=\"190\" fill=\"#1d2433\">Otros: 8 %<\/text><\/svg><\/div>", "items": [{"id": "CNB-231", "niv": 2, "cp": "cn_indagacion", "cn": "cts", "e": "Si el municipio compostara todos los residuos orgánicos y reciclara todo el plástico, ¿qué porcentaje de los residuos actuales seguiría llegando al relleno?", "f": "Interpretación de gráficas circulares", "vis": "", "o": [["A", "30 %.", "Se dejarían de enviar los orgánicos (55 %) y los plásticos (15 %): 100 − 55 − 15 = 30 %.", true], ["B", "45 %.", "Solo resta los orgánicos (100 − 55); olvida descontar el plástico reciclado.", false], ["C", "70 %.", "Es el porcentaje que se dejaría de enviar (55 + 15), no el que seguiría llegando.", false], ["D", "85 %.", "Solo resta el plástico (100 − 15); olvida descontar los orgánicos compostados.", false]]}, {"id": "CNB-232", "niv": 1, "cp": "cn_uso_comprensivo", "cn": "cts", "e": "¿Por qué no se recomienda quemar basura a cielo abierto?", "f": "Impactos de la quema de residuos", "vis": "", "o": [["A", "Porque la quema produce oxígeno en exceso y altera la composición del aire.", "Quemar residuos gasta oxígeno del aire; no genera un exceso de este gas.", false], ["B", "Porque la quema solo elimina los residuos orgánicos y deja intactos los plásticos.", "Los plásticos también arden y, al hacerlo, liberan sustancias tóxicas; no quedan intactos.", false], ["C", "Porque el fuego convierte el plástico en abono orgánico para el suelo.", "Quemar plástico no produce abono; produce gases y residuos contaminantes.", false], ["D", "Porque libera gases y partículas que contaminan el aire y afectan la salud.", "La quema incompleta de residuos produce humo, partículas finas y sustancias tóxicas.", true]]}, {"id": "CNB-233", "niv": 3, "cp": "cn_indagacion", "cn": "cts", "e": "Tras iniciar la separación de residuos en la fuente, el municipio pasó de enviar 120 a 95 toneladas semanales al relleno. Un concejal concluye que la reducción se debe a la separación. ¿Qué información adicional sería más útil para evaluar esta conclusión?", "f": "Evaluación de conclusiones", "vis": "", "o": [["A", "El porcentaje de residuos orgánicos en la gráfica.", "Ese dato ya está en la gráfica y no explica la reducción.", false], ["B", "Si cambió la cantidad total de residuos que generó el municipio en ese periodo.", "Si se generaron menos residuos por otras razones (por ejemplo, menos población flotante), la reducción no se debería solo a la separación.", true], ["C", "El número de camiones recolectores que tiene el municipio y la frecuencia de sus recorridos.", "El número de camiones no indica por qué cambió la cantidad de residuos.", false], ["D", "La distancia entre el municipio y el relleno sanitario.", "La distancia no influye en la cantidad de residuos que se envían.", false]]}]}, {"comp": "ciencias_naturales", "sim": "val-2", "ses": 2, "ind": "Fermentación de la levadura", "tt": "", "texto": "En una panadería se hizo una prueba: en cuatro botellas iguales se pusieron 200 mL de agua tibia (a la misma temperatura) y 10 g de levadura; luego se agregó una cantidad distinta de azúcar a cada botella y se cubrió la boca con un globo. Se midió la circunferencia de cada globo al inicio y a los 30 minutos, y se calculó cuánto aumentó.", "vis": "<table class=\"vt\"><caption>Tabla 14. Tamaño de los globos a los 30 minutos<\/caption><thead><tr><th>Azúcar agregado (g)<\/th><th>Aumento de la circunferencia del globo (cm)<\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td>1<\/td><\/tr><tr><td>5<\/td><td>14<\/td><\/tr><tr><td>10<\/td><td>23<\/td><\/tr><tr><td>20<\/td><td>29<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Datos ficticios.<\/div>", "items": [{"id": "CNB-234", "niv": 2, "cp": "cn_indagacion", "cn": "biologico", "e": "¿Qué hipótesis se pone a prueba con este experimento?", "f": "Hipótesis y variables", "vis": "", "o": [["A", "El tamaño de la botella influye en la actividad de la levadura.", "Las botellas eran iguales; su tamaño no varió.", false], ["B", "La temperatura del agua influye en la actividad de la levadura dentro de cada botella.", "La temperatura fue la misma en todas las botellas; no se puso a prueba.", false], ["C", "La cantidad de azúcar influye en el gas que produce la levadura.", "Lo único que cambió entre botellas fue el azúcar, y se midió el gas a través del tamaño del globo.", true], ["D", "La levadura produce oxígeno cuando se mezcla con agua tibia.", "El experimento no identifica el gas ni compara con y sin agua tibia.", false]]}, {"id": "CNB-235", "niv": 3, "cp": "cn_indagacion", "cn": "biologico", "e": "¿Para qué sirve la botella a la que no se le agregó azúcar?", "f": "Grupo de control", "vis": "", "o": [["A", "Para que el experimento tenga más datos y sea más fácil construir la gráfica de resultados.", "Su función principal no es aumentar los datos, sino servir de referencia.", false], ["B", "Para comprobar que la levadura muere cuando no hay azúcar en el agua.", "El experimento no mide si la levadura vive o muere.", false], ["C", "Para medir la temperatura del agua sin que el azúcar la altere.", "En el experimento no se midió temperatura en esa botella.", false], ["D", "Como control: muestra qué ocurre sin azúcar para comparar con las demás.", "La botella sin azúcar sirve de referencia
