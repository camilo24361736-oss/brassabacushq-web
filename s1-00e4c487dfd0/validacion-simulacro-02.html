<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulacro 2 · Validación del Bachillerato</title>
<style>
:root{--bg:#f3f6f8;--card:#fff;--ink:#1d2433;--mute:#5a6478;--line:#d6dee4;--pri:#0b4f6c;--pri2:#1f7aa3;--ok:#0d6b3a;--okbg:#e6f4ec;--no:#9b1c1c;--nobg:#fbeaea;--sel:#e4f1f8}
@media (prefers-color-scheme: dark){:root{--bg:#0f1418;--card:#172026;--ink:#e3eaee;--mute:#97a6b0;--line:#2c3a44;--pri:#7cc3e6;--pri2:#a3d6ef;--ok:#7fd3a3;--okbg:#16301f;--no:#f2a3a3;--nobg:#3a1c1c;--sel:#1d3442}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overflow-wrap:anywhere}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px}
.hwrap{max-width:860px;margin:0 auto;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;justify-content:space-between}
h1{font-size:17px;margin:0;color:var(--pri)}
h2{color:var(--pri)}
.stat{font-size:14px;color:var(--mute)}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--pri)}
.timer.low{color:var(--no)}
main{max-width:860px;margin:0 auto;padding:16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin:0 0 16px}
.mod{background:var(--pri);color:var(--card);border-radius:10px;padding:10px 14px;margin:28px 0 6px;font-weight:700;font-size:18px}
.inst{font-size:13px;font-weight:700;color:var(--pri);text-transform:uppercase;letter-spacing:.03em;margin:18px 0 4px}
.caso{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--pri);border-radius:10px;padding:14px 16px;margin:10px 0}
.tag{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--pri);font-weight:700}
.caso p{margin:6px 0 0;white-space:pre-line}
.item{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0}
.enun{margin:0 0 8px;white-space:pre-line}
.n{font-weight:700;color:var(--pri)}
.niv{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-right:4px;white-space:nowrap}
.op{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:6px 0;cursor:pointer;background:transparent;width:100%;text-align:left;color:inherit;font:inherit}
.ops8{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.ops8 .op{margin:0}
.op:hover{border-color:var(--pri2)}
.op .l{font-weight:700;min-width:20px}
.op.sel{background:var(--sel);border-color:var(--pri2)}
.op.ok{background:var(--okbg);border-color:var(--ok)}
.op.no{background:var(--nobg);border-color:var(--no)}
.op[disabled]{cursor:default}
.just{font-size:14px;margin:8px 0 0;padding:8px 10px;border-top:1px dashed var(--line)}
.just div{margin:4px 0}
.just .okt{color:var(--ok);font-weight:700}
.just .not{color:var(--no);font-weight:700}
.src{font-size:13px;color:var(--mute);margin-top:6px}
button.btn{background:var(--pri);color:var(--card);border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer}
button.btn.sec{background:transparent;color:var(--pri);border:1px solid var(--pri)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
select{font:inherit;padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);max-width:100%}
table{border-collapse:collapse;width:100%;font-size:15px}
td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.sub td{font-size:13px;color:var(--mute);padding-left:22px}
.vt{width:auto;max-width:100%;margin:10px 0;font-size:14px;display:block;overflow-x:auto}
.vt caption{text-align:left;font-weight:700;padding-bottom:4px}
.vt th,.vt td{border:1px solid var(--line);padding:4px 8px}
.vt th{background:var(--sel)}
.vnota{font-size:12px;color:var(--mute)}
.vfig{margin:10px 0}
.vfig svg{width:100%;max-width:560px;height:auto;border-radius:6px;border:1px solid var(--line);background:#fff}
.big{font-size:40px;font-weight:800;color:var(--pri);line-height:1.1}
.aviso{font-size:13px;color:var(--mute)}
.hide{display:none !important}
.res-ok{color:var(--ok);font-weight:700}.res-no{color:var(--no);font-weight:700}
textarea{width:100%;min-height:320px;font:inherit;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);resize:vertical}
.chk label{display:flex;gap:8px;align-items:flex-start;margin:6px 0;font-size:15px}
.chk input{margin-top:4px;width:18px;height:18px;flex:none}
.modelo{white-space:pre-line;background:var(--bg);border-radius:8px;padding:10px 12px;margin:6px 0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal .panel{max-width:420px}
.nav{padding:6px 0;display:flex;gap:6px;flex-wrap:wrap}
.nav a{font-size:13px;color:var(--pri);border:1px solid var(--line);border-radius:999px;padding:3px 10px;text-decoration:none;background:var(--card)}
footer{max-width:860px;margin:0 auto;padding:8px 16px 40px;font-size:12px;color:var(--mute)}
</style>
</head>
<body>
<header><div class="hwrap"><h1 id="tit"></h1><div class="row stat"><span id="prog"></span><span id="timer" class="timer"></span></div></div></header>
<main id="main"></main>
<div id="modal" class="modal hide"><div class="panel"><p id="mtxt"></p><div class="row"><button class="btn" id="msi">Sí, calificar</button><button class="btn sec" id="mno">Seguir respondiendo</button></div></div></div>
<footer>Material de preparación independiente. No está afiliado al Icfes ni a ninguna entidad pública. Preguntas y textos originales; no son preguntas reales del examen. Soporte: brassabacuscontact@gmail.com</footer>
<script>
const DATA = [{"comp": "matematicas", "sim": "val-2", "ses": 1, "ind": "Factura de energía de un hogar", "tt": "", "texto": "La empresa de energía de un municipio cobra a cada hogar un cargo fijo mensual de $ 9.500 más $ 780 por cada kilovatio hora (kWh) consumido en el mes.", "vis": "", "items": [{"id": "MTB-201", "niv": 1, "cp": "mt_formulacion", "cn": "", "e": "Un hogar consumió 160 kWh en un mes. ¿Cuánto debe pagar por ese mes?", "f": "Cálculo propio", "vis": "", "o": [["A", "$ 124.800.", "Es solo el valor del consumo (160 × 780); falta sumar el cargo fijo de $ 9.500.", false], ["B", "$ 134.300.", "160 × $ 780 = $ 124.800; más el cargo fijo: 124.800 + 9.500 = $ 134.300.", true], ["C", "$ 143.800.", "Suma dos veces el cargo fijo de $ 9.500 al valor del consumo.", false], ["D", "$ 1.644.800.", "Multiplica por 160 tanto el precio del kWh como el cargo fijo: (9.500 + 780) × 160.", false]]}, {"id": "MTB-202", "niv": 1, "cp": "mt_interpretacion", "cn": "", "e": "¿Cuál expresión permite calcular cuántos kWh, k, consumió un hogar a partir del valor C, en pesos, de su factura mensual?", "f": "Cálculo propio", "vis": "", "o": [["A", "k = (9.500 + C)/780.", "Suma el cargo fijo en lugar de restarlo.", false], ["B", "k = C/780 − 9.500.", "Resta el cargo fijo después de dividir; el cargo fijo está en pesos y debe restarse antes de dividir.", false], ["C", "k = (C − 9.500)/780.", "Al valor de la factura se le resta el cargo fijo y el resto se divide entre el precio de cada kWh.", true], ["D", "k = 780(C − 9.500).", "Multiplica por el precio del kWh en lugar de dividir.", false]]}, {"id": "MTB-203", "niv": 1, "cp": "mt_argumentacion", "cn": "", "e": "Otro hogar consumió 200 kWh este mes. Su dueño afirma: «Si el próximo mes consumo el doble, 400 kWh, mi factura aumentará en $ 156.000». ¿Tiene razón?", "f": "Cálculo propio", "vis": "", "o": [["A", "Sí, porque los 200 kWh adicionales cuestan 200 × $ 780 = $ 156.000.", "El cargo fijo se paga igual los dos meses; la diferencia es solo el valor del consumo adicional.", true], ["B", "No, porque el aumento sería de 400 × $ 780 = $ 312.000.", "Calcula el valor de todo el consumo del mes siguiente, no el aumento respecto al mes actual.", false], ["C", "No, porque al consumir más sube el precio del kWh y aumentaría más.", "La tarifa descrita tiene un precio fijo de $ 780 por kWh; esa razón no se deduce de la información.", false], ["D", "No, porque al aumento del consumo se le sumaría otro cargo fijo de $ 9.500.", "El cargo fijo se cobra una sola vez al mes, sin importar el consumo.", false]]}]}, {"comp": "matematicas", "sim": "val-2", "ses": 1, "ind": "Escalera de un pintor", "tt": "", "texto": "Un pintor apoya una escalera recta de 5 m de longitud contra la pared vertical de una casa. El pie de la escalera queda sobre el piso horizontal, a 1,4 m de la pared, como muestra la figura.", "vis": "<div class=\"vfig\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 260 240\" width=\"260\" height=\"240\" font-family=\"Arial, sans-serif\" font-size=\"14\"><rect width=\"260\" height=\"240\" fill=\"#ffffff\"/><line x1=\"200\" y1=\"5\" x2=\"200\" y2=\"220\" stroke=\"#1d2433\" stroke-width=\"4\"/><line x1=\"20\" y1=\"220\" x2=\"240\" y2=\"220\" stroke=\"#1d2433\" stroke-width=\"3\"/><line x1=\"140\" y1=\"220\" x2=\"200\" y2=\"14\" stroke=\"#8a5a2b\" stroke-width=\"5\"/><text x=\"150\" y=\"120\" text-anchor=\"end\" fill=\"#1d2433\">5 m<\/text><text x=\"170\" y=\"238\" text-anchor=\"middle\" fill=\"#1d2433\">1,4 m<\/text><text x=\"210\" y=\"130\" fill=\"#1d2433\">Pared<\/text><text x=\"155\" y=\"212\" fill=\"#1d2433\">θ<\/text><\/svg><\/div>", "items": [{"id": "MTB-210", "niv": 2, "cp": "mt_formulacion", "cn": "", "e": "¿A qué altura de la pared llega el extremo superior de la escalera?", "f": "Cálculo propio", "vis": "", "o": [["A", "3,6 m.", "Resta las longitudes (5 − 1,4); el teorema de Pitágoras relaciona los cuadrados de los lados.", false], ["B", "4,8 m.", "Por Pitágoras: altura = √(5² − 1,4²) = √(25 − 1,96) = √23,04 = 4,8 m.", true], ["C", "5,19 m.", "Suma los cuadrados (25 + 1,96); la escalera es la hipotenusa, así que se debe restar.", false], ["D", "6,4 m.", "Suma las longitudes de la escalera y la distancia a la pared.", false]]}, {"id": "MTB-211", "niv": 3, "cp": "mt_argumentacion", "cn": "", "e": "El pintor afirma que, si aleja el pie de la escalera hasta 2,8 m de la pared, el extremo superior quedará a la mitad de la altura anterior. ¿Es correcta la afirmación?", "f": "Cálculo propio", "vis": "", "o": [["A", "Sí, porque al duplicar la distancia a la pared, la altura se reduce a la mitad.", "La altura no es inversamente proporcional a la distancia; se calcula con el teorema de Pitágoras.", false], ["B", "Sí: con la base a 2,8 m, la altura es 5 − 2,8 = 2,2 m.", "Resta las longitudes; el teorema de Pitágoras relaciona sus cuadrados.", false], ["C", "No: con la base a 2,8 m, la altura sube a unos 5,73 m.", "Suma los cuadrados en lugar de restarlos; al alejar el pie de la escalera la altura disminuye.", false], ["D", "No: con la base a 2,8 m, la altura queda en unos 4,14 m.", "Con la escalera como hipotenusa, la nueva altura es de unos 4,14 m, mucho más que la mitad de la altura anterior.", true]]}, {"id": "MTB-212", "niv": 2, "cp": "mt_interpretacion", "cn": "", "e": "Si θ es el ángulo que forma la escalera con el piso, ¿cuál expresión permite calcularlo con los datos dados?", "f": "Cálculo propio", "vis": "", "o": [["A", "cos θ = 1,4/5.", "El coseno es el cateto adyacente a θ (1,4 m) sobre la hipotenusa (5 m).", true], ["B", "sen θ = 1,4/5.", "El seno es el cateto opuesto sobre la hipotenusa; 1,4 m es el cateto adyacente a θ.", false], ["C", "tan θ = 5/1,4.", "La tangente es cateto opuesto sobre cateto adyacente; 5 m es la hipotenusa.", false], ["D", "cos θ = 5/1,4.", "Invierte la razón: el coseno de un ángulo agudo es menor que 1, y 5/1,4 es mayor que 1.", false]]}]}, {"comp": "matematicas", "sim": "val-2", "ses": 1, "ind": "Tiempos de espera en urgencias", "tt": "", "texto": "Un hospital registró el tiempo de espera, en minutos, de 9 pacientes atendidos en el servicio de urgencias durante una mañana.", "vis": "<table class=\"vt\"><caption>Tabla 1. Tiempo de espera por paciente<\/caption><thead><tr><th>Paciente<\/th><th>1<\/th><th>2<\/th><th>3<\/th><th>4<\/th><th>5<\/th><th>6<\/th><th>7<\/th><th>8<\/th><th>9<\/th><\/tr><\/thead><tbody><tr><td>Minutos<\/td><td>15<\/td><td>22<\/td><td>18<\/td><td>45<\/td><td>20<\/td><td>16<\/td><td>120<\/td><td>25<\/td><td>19<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Datos ficticios.<\/div>", "items": [{"id": "MTB-216", "niv": 1, "cp": "mt_formulacion", "cn": "", "e": "¿Cuál es la mediana de los tiempos de espera?", "f": "Cálculo propio", "vis": "", "o": [["A", "19 minutos.", "Al ordenar los datos (15, 16, 18, 19, 20, 22, 25, 45, 120), 19 ocupa el cuarto lugar, no el central.", false], ["B", "20 minutos.", "Con los 9 datos ordenados, el valor central es el quinto: 20 minutos.", true], ["C", "33,3 minutos.", "Es el promedio (300 ÷ 9), no la mediana.", false], ["D", "105 minutos.", "Es el rango (120 − 15), no la mediana.", false]]}, {"id": "MTB-217", "niv": 3, "cp": "mt_argumentacion", "cn": "", "e": "En un informe, el hospital afirma que el tiempo de espera típico de esa mañana fue de 33,3 minutos. ¿Es adecuada esta medida para describir la espera típica?", "f": "Cálculo propio", "vis": "", "o": [["A", "No, porque sin el dato de 120 minutos el promedio sería de 25 minutos exactos.", "Sin ese dato el promedio sería 180 ÷ 8 = 22,5 minutos; el cálculo es erróneo.", false], ["B", "Sí, porque 33,3 está entre el menor (15) y el mayor (120) de los tiempos registrados.", "Cualquier promedio está entre el mínimo y el máximo; eso no lo hace representativo de la mayoría.", false], ["C", "No: el dato de 120 min eleva el promedio; la mediana es más representativa de la mayoría.", "7 de los 9 pacientes esperaron 25 minutos o menos; el valor atípico de 120 distorsiona el promedio, y la mediana no se ve afectada por él.", true], ["D", "Sí, porque 300 ÷ 9 ≈ 33,3 minutos es el promedio de los nueve tiempos registrados.", "El cálculo es correcto, pero el promedio no es la mejor medida de lo típico cuando hay un dato extremo.", false]]}, {"id": "MTB-218", "niv": 2, "cp": "mt_interpretacion", "cn": "", "e": "¿Qué porcentaje de los pacientes esperó más de 30 minutos?", "f": "Cálculo propio", "vis": "", "o": [["A", "11,1 %.", "Cuenta solo al paciente que esperó 120 minutos; también esperó más de 30 el que esperó 45.", false], ["B", "22,2 %.", "Esperaron más de 30 minutos 2 de 9 pacientes (45 y 120 minutos): 2 ÷ 9 ≈ 0,222, es decir, 22,2 %.", true], ["C", "33,3 %.", "Confunde el promedio de los tiempos (33,3 minutos) con el porcentaje pedido.", false], ["D", "77,8 %.", "Es el porcentaje de pacientes que esperó 30 minutos o menos (7 de 9).", false]]}]}, {"comp": "matematicas", "sim": "val-2", "ses": 1, "ind": "Medios de transporte de los trabajadores", "tt": "", "texto": "Una empresa de alimentos con 400 trabajadores preguntó a cada uno qué medio de transporte usa principalmente para llegar al trabajo. Cada trabajador eligió una sola opción.", "vis": "<div class=\"vfig\"><svg class=\"vg\" viewBox=\"0 0 560 320\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Gráfica 1. Medio de transporte principal\" font-family=\"Arial, sans-serif\" font-size=\"12\"><rect width=\"560\" height=\"320\" fill=\"#ffffff\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"13\" fill=\"#1d2433\">Gráfica 1. Medio de transporte principal<\/text><line x1=\"60\" y1=\"258.0\" x2=\"540\" y2=\"258.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"262.0\" text-anchor=\"end\" fill=\"#3a4356\">0<\/text><line x1=\"60\" y1=\"221.0\" x2=\"540\" y2=\"221.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"225.0\" text-anchor=\"end\" fill=\"#3a4356\">25<\/text><line x1=\"60\" y1=\"184.0\" x2=\"540\" y2=\"184.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"188.0\" text-anchor=\"end\" fill=\"#3a4356\">50<\/text><line x1=\"60\" y1=\"147.0\" x2=\"540\" y2=\"147.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"151.0\" text-anchor=\"end\" fill=\"#3a4356\">75<\/text><line x1=\"60\" y1=\"110.0\" x2=\"540\" y2=\"110.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"114.0\" text-anchor=\"end\" fill=\"#3a4356\">100<\/text><line x1=\"60\" y1=\"73.0\" x2=\"540\" y2=\"73.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"77.0\" text-anchor=\"end\" fill=\"#3a4356\">125<\/text><line x1=\"60\" y1=\"36.0\" x2=\"540\" y2=\"36.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"40.0\" text-anchor=\"end\" fill=\"#3a4356\">150<\/text><line x1=\"60\" y1=\"258\" x2=\"540\" y2=\"258\" stroke=\"#3a4356\"/><line x1=\"60\" y1=\"258\" x2=\"60\" y2=\"36\" stroke=\"#3a4356\"/><text transform=\"translate(14,147.0) rotate(-90)\" text-anchor=\"middle\" fill=\"#3a4356\">Número de trabajadores<\/text><text x=\"300.0\" y=\"312\" text-anchor=\"middle\" fill=\"#3a4356\">Medio de transporte<\/text><text x=\"108.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Bus<\/text><text x=\"204.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Moto<\/text><text x=\"300.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Bicicleta<\/text><text x=\"396.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Carro<\/text><text x=\"492.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">A pie<\/text><rect x=\"74.4\" y=\"50.8\" width=\"67.2\" height=\"207.2\" fill=\"#1660a8\"/><text x=\"108.0\" y=\"46.8\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">140<\/text><rect x=\"170.4\" y=\"115.9\" width=\"67.2\" height=\"142.1\" fill=\"#1660a8\"/><text x=\"204.0\" y=\"111.9\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">96<\/text><rect x=\"266.4\" y=\"163.3\" width=\"67.2\" height=\"94.7\" fill=\"#1660a8\"/><text x=\"300.0\" y=\"159.3\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">64<\/text><rect x=\"362.4\" y=\"169.2\" width=\"67.2\" height=\"88.8\" fill=\"#1660a8\"/><text x=\"396.0\" y=\"165.2\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">60<\/text><rect x=\"458.4\" y=\"198.8\" width=\"67.2\" height=\"59.2\" fill=\"#1660a8\"/><text x=\"492.0\" y=\"194.8\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">40<\/text><\/svg><\/div>", "items": [{"id": "MTB-223", "niv": 1, "cp": "mt_interpretacion", "cn": "", "e": "¿Qué porcentaje de los trabajadores usa principalmente la moto o la bicicleta?", "f": "Cálculo propio", "vis": "", "o": [["A", "16 %.", "Es el porcentaje de quienes usan la bicicleta (64 ÷ 400).", false], ["B", "24 %.", "Es el porcentaje de quienes usan la moto (96 ÷ 400).", false], ["C", "40 %.", "96 + 64 = 160 trabajadores; 160 ÷ 400 = 0,40, es decir, el 40 %.", true], ["D", "160 %.", "Toma el número de trabajadores (160) como si fuera un porcentaje.", false]]}, {"id": "MTB-224", "niv": 2, "cp": "mt_formulacion", "cn": "", "e": "Si se elige al azar a uno de los trabajadores, ¿cuál es la probabilidad de que no use principalmente ni el carro ni la moto?", "f": "Cálculo propio", "vis": "", "o": [["A", "0,24.", "Es la probabilidad de que use la moto.", false], ["B", "0,39.", "Es la probabilidad de que use el carro o la moto (156 ÷ 400), el evento contrario.", false], ["C", "0,61.", "Usan otros medios 400 − 60 − 96 = 244 trabajadores; 244 ÷ 400 = 0,61.", true], ["D", "0,85.", "Solo descuenta a quienes usan carro (1 − 60 ÷ 400); falta descontar a quienes usan moto.", false]]}, {"id": "MTB-225", "niv": 2, "cp": "mt_argumentacion", "cn": "", "e": "La gerencia afirma que más del 70 % de los trabajadores llega en un vehículo motorizado (bus, moto o carro). ¿Es correcta la afirmación?", "f": "Cálculo propio", "vis": "", "o": [["A", "Sí, porque el bus, que es motorizado, es el medio más usado por los trabajadores.", "Que el bus sea el más usado no indica qué porcentaje usa vehículos motorizados en total.", false], ["B", "No, porque 140 + 96 = 236 trabajadores, que son solo el 59 % del total.", "Omite a los 60 trabajadores que usan carro, que también es un vehículo motorizado.", false], ["C", "No, porque 296 trabajadores no alcanzan las tres cuartas partes del total (300).", "Es cierto que 296 < 300, pero la afirmación habla del 70 %, no del 75 %; el 70 % de 400 es 280.", false], ["D", "Sí, porque 140 + 96 + 60 = 296 trabajadores, que son el 74 % del total.", "296 ÷ 400 = 0,74, es decir, 74 %, que supera el 70 %.", true]]}]}, {"comp": "matematicas", "sim": "val-2", "ses": 1, "ind": "Producción de leche de dos fincas", "tt": "", "texto": "Dos fincas lecheras de un municipio registraron su producción mensual de leche durante cuatro meses.", "vis": "<div class=\"vfig\"><svg class=\"vg\" viewBox=\"0 0 560 320\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Gráfica 2. Producción mensual de leche\" font-family=\"Arial, sans-serif\" font-size=\"12\"><rect width=\"560\" height=\"320\" fill=\"#ffffff\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"13\" fill=\"#1d2433\">Gráfica 2. Producción mensual de leche<\/text><line x1=\"60\" y1=\"258.0\" x2=\"540\" y2=\"258.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"262.0\" text-anchor=\"end\" fill=\"#3a4356\">0<\/text><line x1=\"60\" y1=\"202.5\" x2=\"540\" y2=\"202.5\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"206.5\" text-anchor=\"end\" fill=\"#3a4356\">1.000<\/text><line x1=\"60\" y1=\"147.0\" x2=\"540\" y2=\"147.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"151.0\" text-anchor=\"end\" fill=\"#3a4356\">2.000<\/text><line x1=\"60\" y1=\"91.5\" x2=\"540\" y2=\"91.5\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"95.5\" text-anchor=\"end\" fill=\"#3a4356\">3.000<\/text><line x1=\"60\" y1=\"36.0\" x2=\"540\" y2=\"36.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"40.0\" text-anchor=\"end\" fill=\"#3a4356\">4.000<\/text><line x1=\"60\" y1=\"258\" x2=\"540\" y2=\"258\" stroke=\"#3a4356\"/><line x1=\"60\" y1=\"258\" x2=\"60\" y2=\"36\" stroke=\"#3a4356\"/><text transform=\"translate(14,147.0) rotate(-90)\" text-anchor=\"middle\" fill=\"#3a4356\">Producción (litros)<\/text><text x=\"300.0\" y=\"312\" text-anchor=\"middle\" fill=\"#3a4356\">Mes<\/text><text x=\"120.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Enero<\/text><text x=\"240.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Febrero<\/text><text x=\"360.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Marzo<\/text><text x=\"480.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Abril<\/text><rect x=\"78.0\" y=\"80.4\" width=\"42.0\" height=\"177.6\" fill=\"#1660a8\"/><text x=\"99.0\" y=\"76.4\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">3.200<\/text><rect x=\"198.0\" y=\"91.5\" width=\"42.0\" height=\"166.5\" fill=\"#1660a8\"/><text x=\"219.0\" y=\"87.5\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">3.000<\/text><rect x=\"318.0\" y=\"69.3\" width=\"42.0\" height=\"188.7\" fill=\"#1660a8\"/><text x=\"339.0\" y=\"65.3\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">3.400<\/text><rect x=\"438.0\" y=\"58.2\" width=\"42.0\" height=\"199.8\" fill=\"#1660a8\"/><text x=\"459.0\" y=\"54.2\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">3.600<\/text><rect x=\"120.0\" y=\"113.7\" width=\"42.0\" height=\"144.3\" fill=\"#d9822b\"/><text x=\"141.0\" y=\"109.7\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">2.600<\/text><rect x=\"240.0\" y=\"85.9\" width=\"42.0\" height=\"172.1\" fill=\"#d9822b\"/><text x=\"261.0\" y=\"81.9\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">3.100<\/text><rect x=\"360.0\" y=\"63.8\" width=\"42.0\" height=\"194.2\" fill=\"#d9822b\"/><text x=\"381.0\" y=\"59.8\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">3.500<\/text><rect x=\"480.0\" y=\"47.1\" width=\"42.0\" height=\"210.9\" fill=\"#d9822b\"/><text x=\"501.0\" y=\"43.1\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">3.800<\/text><rect x=\"60\" y=\"286\" width=\"12\" height=\"12\" fill=\"#1660a8\"/><text x=\"76\" y=\"296\" fill=\"#1d2433\">Finca A<\/text><rect x=\"135\" y=\"286\" width=\"12\" height=\"12\" fill=\"#d9822b\"/><text x=\"151\" y=\"296\" fill=\"#1d2433\">Finca B<\/text><\/svg><\/div>", "items": [{"id": "MTB-228", "niv": 1, "cp": "mt_interpretacion", "cn": "", "e": "¿En qué mes la producción de la finca B superó por más litros a la de la finca A?", "f": "Cálculo propio", "vis": "", "o": [["A", "Enero.", "En enero la finca B produjo 600 litros menos que la A; no la superó.", false], ["B", "Febrero.", "En febrero la finca B superó a la A por 100 litros.", false], ["C", "Marzo.", "En marzo la diferencia a favor de la finca B fue de 100 litros.", false], ["D", "Abril.", "En abril la finca B produjo 3.800 litros y la A 3.600: la diferencia a favor de B fue de 200 litros, la mayor.", true]]}, {"id": "MTB-229", "niv": 2, "cp": "mt_formulacion", "cn": "", "e": "¿En qué porcentaje aumentó la producción de la finca B de enero a abril?", "f": "Cálculo propio", "vis": "", "o": [["A", "31,6 %.", "Divide el aumento (1.200 litros) entre la producción de abril; se debe dividir entre la de enero, el valor inicial.", false], ["B", "46,2 %.", "Aumento: 3.800 − 2.600 = 1.200 litros; 1.200 ÷ 2.600 ≈ 0,462, es decir, 46,2 %.", true], ["C", "68,4 %.", "Calcula 2.600 ÷ 3.800: la producción de enero como porcentaje de la de abril.", false], ["D", "146,2 %.", "Calcula 3.800 ÷ 2.600: es el porcentaje que representa abril respecto a enero, no el aumento.", false]]}, {"id": "MTB-230", "niv": 1, "cp": "mt_interpretacion", "cn": "", "e": "¿Cuál afirmación describe correctamente la producción de la finca B en esos cuatro meses?", "f": "Cálculo propio", "vis": "", "o": [["A", "Aumentó cada mes, aunque cada vez en menor cantidad.", "Los aumentos fueron de 500, 400 y 300 litros: siempre aumentó, pero cada vez menos.", true], ["B", "Aumentó cada mes en la misma cantidad de litros.", "Los aumentos fueron de 500, 400 y 300 litros; no son iguales.", false], ["C", "Fue mayor que la de la finca A en todos los meses.", "En enero la finca A produjo más (3.200 frente a 2.600 litros).", false], ["D", "Disminuyó entre enero y febrero.", "La que disminuyó entre enero y febrero fue la finca A; la B pasó de 2.600 a 3.100 litros.", false]]}]}, {"comp": "matematicas", "sim": "val-2", "ses": 1, "ind": "Tanque de agua de un colegio rural", "tt": "", "texto": "Para el sistema de agua de un colegio rural se construirá un tanque de concreto con forma de prisma rectangular, abierto en la parte superior. Sus medidas interiores son 8 m de largo, 4 m de ancho y 1,5 m de profundidad.\n\nRecuerde que 1 m³ equivale a 1.000 litros.", "vis": "", "items": [{"id": "MTB-231", "niv": 1, "cp": "mt_formulacion", "cn": "", "e": "¿Cuántos litros de agua caben en el tanque lleno?", "f": "Cálculo propio", "vis": "", "o": [["A", "4.800 litros.", "Convierte mal: 48 m³ equivalen a 48.000 litros, no a 4.800.", false], ["B", "13.500 litros.", "Suma las tres medidas (8 + 4 + 1,5) en lugar de multiplicarlas.", false], ["C", "48.000 litros.", "V = 8 × 4 × 1,5 = 48 m³ = 48.000 litros.", true], ["D", "480.000 litros.", "Multiplica por 10.000 en lugar de 1.000 al convertir a litros.", false]]}, {"id": "MTB-232", "niv": 3, "cp": "mt_formulacion", "cn": "", "e": "El interior del tanque (el fondo y las cuatro paredes) se cubrirá con impermeabilizante. ¿Cuál es el área total que se debe cubrir?", "f": "Cálculo propio", "vis": "", "o": [["A", "36 m².", "Solo suma las cuatro paredes (24 + 12); falta el fondo de 32 m².", false], ["B", "50 m².", "Suma el fondo y solo una pared de cada tipo (32 + 12 + 6); hay dos paredes de cada tipo.", false], ["C", "68 m².", "Fondo: 8 × 4 = 32 m². Paredes: 2 × (8 × 1,5) + 2 × (4 × 1,5) = 24 + 12 = 36 m². Total: 68 m².", true], ["D", "100 m².", "Incluye una tapa de 32 m², pero el tanque es abierto en la parte superior.", false]]}, {"id": "MTB-233", "niv": 3, "cp": "mt_argumentacion", "cn": "", "e": "El constructor afirma que, si construye otro tanque con todas las medidas al doble, necesitará el doble de impermeabilizante. ¿Es correcta la afirmación?", "f": "Cálculo propio", "vis": "", "o": [["A", "Sí: cada medida se duplica, así que cada área también se duplica.", "Las longitudes se duplican, pero cada área es producto de dos longitudes.", false], ["B", "No: el área se multiplica por 2 × 2 × 2 = 8, igual que el volumen.", "El volumen sí se multiplica por 2³ = 8, pero el área se multiplica por 2² = 4.", false], ["C", "Sí, porque el nuevo tanque también tiene un fondo y cuatro paredes.", "Tener las mismas caras no implica que el área solo se duplique; cada cara crece 4 veces.", false], ["D", "No: cada área se multiplica por 2 × 2 = 4; necesitará el cuádruple.", "Cada cara es un rectángulo con dos medidas duplicadas; su área se multiplica por 4.", true]]}]}, {"comp": "matematicas", "sim": "val-2", "ses": 1, "ind": "Eliminación de un medicamento", "tt": "", "texto": "Después de aplicar una dosis de 400 mg de un medicamento, el organismo de un paciente elimina cada hora el 20 % de la cantidad de medicamento que hay en ese momento en la sangre.\n\n(Situación ficticia con fines de práctica.)", "vis": "", "items": [{"id": "MTB-239", "niv": 2, "cp": "mt_formulacion", "cn": "", "e": "¿Qué cantidad de medicamento queda en la sangre 3 horas después de aplicar la dosis?", "f": "Cálculo propio", "vis": "", "o": [["A", "3,2 mg.", "Multiplica por 0,2 en cada hora; 0,2 es la parte que se elimina, y la que queda es 0,8.", false], ["B", "160 mg.", "Resta cada hora el 20 % de la dosis inicial (80 mg); el 20 % se calcula sobre lo que queda.", false], ["C", "204,8 mg.", "Cada hora queda el 80 %: 400 × 0,8³ = 400 × 0,512 = 204,8 mg.", true], ["D", "320 mg.", "Es la cantidad que queda después de 1 hora, no de 3.", false]]}, {"id": "MTB-240", "niv": 2, "cp": "mt_interpretacion", "cn": "", "e": "¿Cuál expresión representa la cantidad Q, en mg, que queda en la sangre t horas después de aplicar la dosis?", "f": "Cálculo propio", "vis": "", "o": [["A", "Q = 400 · (0,8)^t.", "Cada hora la cantidad se multiplica por 0,8 (queda el 80 %), así que después de t horas se ha multiplicado t veces.", true], ["B", "Q = 400 · (0,2)^t.", "Usa la fracción que se elimina (0,2) en lugar de la que queda (0,8).", false], ["C", "Q = 400 − 0,2t.", "Resta 0,2 mg por hora; confunde el porcentaje con una cantidad fija en miligramos.", false], ["D", "Q = 400 − 80t.", "Supone que cada hora se eliminan 80 mg fijos; el 20 % se aplica sobre la cantidad que queda.", false]]}, {"id": "MTB-241", "niv": 3, "cp": "mt_argumentacion", "cn": "", "e": "Un estudiante afirma que el medicamento se elimina por completo a las 5 horas, porque 5 × 20 % = 100 %. ¿Es correcta la afirmación?", "f": "Cálculo propio", "vis": "", "o": [["A", "No, porque cada hora se elimina menos medicamento, ya que el porcentaje baja un 20 % cada hora.", "El porcentaje que se elimina se mantiene en 20 %; lo que disminuye es la cantidad sobre la que se calcula.", false], ["B", "No, porque a las 5 horas queda el 20 % de la dosis inicial, es decir, 80 mg.", "La cantidad que queda a las 5 horas es mayor que 80 mg; ese valor no corresponde al modelo.", false], ["C", "Sí, porque cada hora se eliminan 80 mg y 5 × 80 = 400 mg.", "80 mg es el 20 % de la dosis inicial; cada hora el porcentaje se calcula sobre lo que queda, que es cada vez menos.", false], ["D", "No: según este modelo, la cantidad disminuye cada hora, pero no llega a 0.", "El porcentaje se aplica sobre una cantidad cada vez menor, así que en el modelo siempre queda algo de medicamento.", true]]}]}, {"comp": "matematicas", "sim": "val-2", "ses": 1, "ind": "Altura de un edificio por su sombra", "tt": "", "texto": "Para estimar la altura de un edificio en construcción, una ingeniera mide su sombra sobre el terreno plano: 18 m. En el mismo momento, un poste vertical de 2,5 m de altura proyecta una sombra de 3 m.", "vis": "", "items": [{"id": "MTB-243", "niv": 2, "cp": "mt_formulacion", "cn": "", "e": "¿Cuál es la altura del edificio?", "f": "Cálculo propio", "vis": "", "o": [["A", "15 m.", "Los triángulos que forman cada objeto con su sombra son semejantes: h ÷ 18 = 2,5 ÷ 3, de donde h = 18 × 2,5 ÷ 3 = 15 m.", true], ["B", "17,5 m.", "Supone una relación aditiva: como la sombra del poste supera su altura en 0,5 m, resta 0,5 a 18.", false], ["C", "21,6 m.", "Invierte la razón: calcula 18 × 3 ÷ 2,5.", false], ["D", "45 m.", "Multiplica la sombra del edificio por la altura del poste y no divide entre la sombra del poste.", false]]}]}, {"comp": "lectura_critica", "sim": "val-2", "ses": 1, "ind": "Cuento: el taller de modistería", "tt": "Texto literario", "texto": "AQUÍ NO SE BOTA NADA\n\n(1) Fabiola Ardila llevaba veintidós años abriendo el taller de modistería a las siete en punto, aunque desde hacía meses nadie llegaba antes de las diez. Subía la persiana metálica, encendía la radio, regaba la mata de sábila de la entrada y se sentaba frente a la máquina como quien se sienta a esperar un bus que ya no pasa por esa calle.\n\n(2) Antes le encargaban vestidos de quince, uniformes de colegio, trajes para matrimonios. Ahora la gente compraba la ropa hecha, barata, en los almacenes del centro o por internet, y cuando se le descosía un botón la botaba. Fabiola había hecho cuentas en un cuaderno de tapas azules: con lo que entraba en una semana apenas pagaba la luz y el arriendo del local.\n\n(3) Un martes entró Yeison, el hijo de la vecina, con una chaqueta de jean rota en el codo.\n—Doña Fabiola, ¿esto tiene arreglo? Es que era de mi papá.\nElla la miró por dentro y por fuera, pasó el dedo por las costuras.\n—Todo tiene arreglo, mijo. Lo que no siempre hay es quién lo arregle.\n\n(4) Le cobró poco y le pidió que volviera el jueves. Pero el miércoles Yeison ya estaba en la puerta a las siete, mirando cómo ella cortaba un parche del mismo azul gastado. Al día siguiente volvió con un amigo que tenía un pantalón sin cremallera. El viernes llegaron tres muchachos más, con mochilas, camisas y unos tenis despegados que Fabiola no sabía arreglar, pero que intentó.\n\n(5) A la semana, Yeison preguntó si podía aprender. Fabiola le dijo que no tenía con qué pagarle. Él respondió que no estaba pidiendo plata, que estaba pidiendo aguja.\n\n(6) Ahora, en el vidrio del taller, debajo del viejo letrero de «Modistería Fabiola», hay un cartón escrito con marcador: «Aquí no se bota nada. Se arregla». La radio sigue sonando, la sábila sigue en la entrada. Fabiola todavía hace cuentas en el cuaderno azul, y todavía no le alcanzan del todo. Pero ya no se sienta a esperar el bus: ahora lo maneja ella, y van varios pasajeros.\n\nCuento original escrito para este simulacro.", "vis": "", "items": [{"id": "LCB-201", "niv": 1, "cp": "lc_local", "cn": "", "e": "Según el párrafo 2, ¿por qué habían disminuido los encargos en el taller de Fabiola?", "f": "Párrafo 2", "vis": "", "o": [["A", "Porque Fabiola abría el taller muy tarde y los clientes encontraban la persiana cerrada.", "Es al revés: ella abría a las siete en punto y eran los clientes quienes no llegaban.", false], ["B", "Porque Fabiola había subido los precios para poder pagar la luz y el arriendo del local.", "El texto habla de sus cuentas, pero no dice que haya subido precios.", false], ["C", "Porque el taller se trasladó a una calle por donde ya no pasaban buses.", "El bus que no pasa es una comparación (párrafo 1), no un hecho; el taller no se trasladó.", false], ["D", "Porque la gente prefería comprar ropa hecha y barata y botaba la que se dañaba.", "El párrafo 2: «Ahora la gente compraba la ropa hecha, barata […] y cuando se le descosía un botón la botaba».", true]]}, {"id": "LCB-202", "niv": 1, "cp": "lc_local", "cn": "", "e": "En el párrafo 5, ¿qué le pide Yeison a Fabiola?", "f": "Párrafo 5", "vis": "", "o": [["A", "Aprender el oficio, sin que ella le pague.", "Yeison «preguntó si podía aprender» y aclaró que «no estaba pidiendo plata, que estaba pidiendo aguja».", true], ["B", "Que le arregle los tenis despegados que llevó uno de sus amigos.", "Los tenis se mencionan en el párrafo 4 y no los pide Yeison en el párrafo 5.", false], ["C", "Que le preste una aguja y la máquina para coser en su casa.", "«Pedir aguja» es una forma figurada de pedir que le enseñe el oficio; no pide prestados los objetos.", false], ["D", "Que le pague un sueldo por ayudarle con los arreglos del taller.", "Él aclara explícitamente que no pide plata.", false]]}, {"id": "LCB-203", "niv": 2, "cp": "lc_global", "cn": "", "e": "La comparación del párrafo 1 (esperar «un bus que ya no pasa») y su retoma al final del cuento («ahora lo maneja ella, y van varios pasajeros») expresan", "f": "Párrafos 1 y 6", "vis": "", "o": [["A", "que Fabiola cambió de oficio y ahora trabaja como conductora de bus en el barrio.", "Toma en sentido literal una imagen figurada; Fabiola sigue en el taller.", false], ["B", "el paso de una espera pasiva a una situación en la que Fabiola impulsa su trabajo junto con otros.", "Al comienzo Fabiola espera clientes que no llegan; al final dirige un taller de arreglos al que se han sumado Yeison y otros jóvenes («varios pasajeros»).", true], ["C", "que el taller resolvió por completo sus problemas económicos y ya le sobra el dinero.", "El párrafo 6 dice que las cuentas «todavía no le alcanzan del todo».", false], ["D", "la nostalgia de Fabiola por la época en que le encargaban vestidos de quince y trajes de matrimonio.", "El final no expresa nostalgia; muestra un cambio de actitud hacia algo nuevo.", false]]}, {"id": "LCB-204", "niv": 3, "cp": "lc_global", "cn": "", "e": "La frase de Fabiola «Todo tiene arreglo, mijo. Lo que no siempre hay es quién lo arregle» (párrafo 3) anticipa en el cuento", "f": "Párrafos 3 y 5", "vis": "", "o": [["A", "que Fabiola no logrará arreglar la chaqueta de jean que le llevó Yeison.", "El párrafo 4 muestra que ella sí trabaja en la chaqueta (corta un parche del mismo azul).", false], ["B", "la aparición de personas, como Yeison, dispuestas a aprender a reparar.", "La frase señala que lo escaso es quien arregle; luego llegan jóvenes al taller y en el párrafo 5 Yeison pide aprender: aparece justamente quien arregle.", true], ["C", "el cierre definitivo del taller por falta de clientes y de dinero para el arriendo.", "El taller no cierra; al final tiene un cartón nuevo y más gente.", false], ["D", "la llegada de nuevos almacenes de ropa barata al centro de la ciudad.", "Los almacenes ya estaban presentes desde el párrafo 2; la frase no anticipa eso.", false]]}, {"id": "LCB-205", "niv": 2, "cp": "lc_reflexion", "cn": "", "e": "¿Qué valoración sobre el consumo se puede reconocer en el cartón «Aquí no se bota nada. Se arregla»?", "f": "Párrafos 2 y 6", "vis": "", "o": [["A", "Una promoción de precios bajos para atraer a los clientes de los almacenes del centro.", "El cartón no habla de precios; se refiere a reparar en lugar de botar.", false], ["B", "Una advertencia a los clientes para que no traigan al taller ropa vieja o muy gastada.", "Ocurre lo contrario: el taller invita a traer la ropa dañada para arreglarla.", false], ["C", "Un rechazo a comprar ropa nueva en cualquier circunstancia, aun cuando la vieja ya no sirva.", "El cartón valora arreglar, pero el texto no condena toda compra de ropa nueva.", false], ["D", "Una crítica a la costumbre de botar objetos que todavía pueden repararse y seguir usando.", "El cartón responde a lo descrito en el párrafo 2 («cuando se le descosía un botón la botaba») y valora reparar en lugar de botar.", true]]}]}, {"comp": "lectura_critica", "sim": "val-2", "ses": 1, "ind": "Poema sobre la familia: las manos del padre", "tt": "Texto literario", "texto": "LAS MANOS DE MI PADRE\n\nMi padre no decía «te quiero».\nDecía «¿ya almorzó?»,\ndecía «échese la ruana, que va a llover»,\ndecía «llámeme cuando llegue».\n\nTenía las manos agrietadas como tierra en verano\nde tanto cargar bultos en la plaza de mercado,\ny con esas mismas manos\nme enseñó a amarrarme los zapatos:\ndos orejas de conejo, una vuelta, un nudo.\n\nYo pensaba entonces que el amor\nera una palabra que se dice en las películas.\nTardé treinta años en entender\nque también es una pregunta a la hora del almuerzo,\nuna ruana extendida antes del aguacero,\nun teléfono que no se apaga hasta que uno llega.\n\nHoy mi hija sale de la casa\ny me oigo decir, sin pensarlo:\n«llámeme cuando llegue».\nElla se ríe, me dice que soy igualito a mi papá.\nNo sabe que acaba de decirme\nlo más bonito que me han dicho en la vida.\n\nPoema original escrito para este simulacro.", "vis": "", "items": [{"id": "LCB-206", "niv": 1, "cp": "lc_local", "cn": "", "e": "Según el poema, el padre trabajaba", "f": "Segunda estrofa", "vis": "", "o": [["A", "cargando bultos en la plaza de mercado.", "El poema dice que tenía las manos agrietadas «de tanto cargar bultos en la plaza de mercado».", true], ["B", "sembrando la tierra en el campo durante el verano.", "«Tierra en verano» es una comparación para describir las manos, no su oficio.", false], ["C", "reparando teléfonos en un local cercano a la casa.", "El teléfono alude a la costumbre de pedir que lo llamen al llegar; no es su oficio.", false], ["D", "tejiendo ruanas para venderlas antes de la temporada de lluvias.", "La ruana aparece en un consejo del padre, no como su trabajo.", false]]}, {"id": "LCB-207", "niv": 2, "cp": "lc_global", "cn": "", "e": "En el poema, expresiones como «¿ya almorzó?» y «llámeme cuando llegue» se presentan como", "f": "Primera y tercera estrofas", "vis": "", "o": [["A", "palabras que a la voz poética le molestaban entonces y que todavía hoy le siguen molestando.", "Al final la voz poética repite esas mismas palabras con su hija y las valora.", false], ["B", "muestras de que el padre desconfiaba de su hijo y quería controlar todo lo que hacía.", "Ninguna parte del poema sugiere desconfianza o control.", false], ["C", "formas cotidianas en las que el padre expresaba su cariño sin decir «te quiero».", "La primera estrofa las opone a «te quiero», y la tercera las identifica con el amor: «también es una pregunta a la hora del almuerzo…».", true], ["D", "órdenes que mostraban lo estricto y distante que era el padre con su familia.", "El poema no las presenta como muestras de dureza, sino de cuidado.", false]]}, {"id": "LCB-208", "niv": 2, "cp": "lc_global", "cn": "", "e": "¿Qué cambio experimenta la voz poética a lo largo del poema?", "f": "Tercera estrofa", "vis": "", "o": [["A", "Pasa de creer que el amor era solo una palabra de película a reconocerlo en gestos de la vida diaria.", "Tercera estrofa: «Yo pensaba entonces que el amor / era una palabra que se dice en las películas. / Tardé treinta años en entender / que también es…».", true], ["B", "Pasa de admirar profundamente a su padre a criticarlo por no haberle dicho nunca que lo quería.", "El poema avanza en sentido contrario: hacia la comprensión y la valoración del padre.", false], ["C", "Pasa de no saber amarrarse los zapatos a enseñarle a su propia hija a hacerlo de la misma forma.", "El poema no dice que le enseñe a su hija a amarrarse los zapatos; lo que repite es «llámeme cuando llegue».", false], ["D", "Pasa de vivir con su familia a vivir lejos de ella, sin ningún contacto con sus seres queridos.", "La última estrofa muestra a la voz poética en su casa, con su hija.", false]]}, {"id": "LCB-209", "niv": 3, "cp": "lc_reflexion", "cn": "", "e": "¿Por qué la voz poética considera que lo que le dice su hija es «lo más bonito que me han dicho en la vida»?", "f": "Última estrofa en relación con el poema completo", "vis": "", "o": [["A", "Porque la hija se ríe, algo que casi nunca hace cuando está con él en la casa.", "El poema no dice que la hija rara vez se ría; la risa no es la razón de la emoción.", false], ["B", "Porque la comparación con su padre le confirma que heredó de él su forma de amar.", "La hija lo compara con el padre por decir «llámeme cuando llegue»; como el poema ya mostró que esa frase es una forma de amor, la comparación significa que ese amor continúa en él.", true], ["C", "Porque la hija por fin le dice «te quiero», la palabra que el padre nunca pronunciaba.", "La hija no dice «te quiero»; dice que es «igualito a mi papá».", false], ["D", "Porque la hija le promete que lo va a llamar apenas llegue al lugar a donde va.", "La hija no promete nada en el poema; solo se ríe y hace la comparación.", false]]}]}, {"comp": "lectura_critica", "sim": "val-2", "ses": 1, "ind": "Filosofía del trabajo: labor, fabricación y acción", "tt": "Texto filosófico", "texto": "LABOR, FABRICACIÓN Y ACCIÓN\n\n(1) En la vida diaria usamos la palabra «trabajo» para casi todo: trabaja la señora que barre la calle, el carpintero que hace una mesa y la líder comunal que convoca a una reunión para exigir que arreglen el acueducto. La filósofa Hannah Arendt, en su libro La condición humana (1958), propuso que detrás de esa palabra se esconden tres actividades distintas, cada una con su propio sentido.\n\n(2) La primera es la labor: las tareas que mantienen viva a una persona y que nunca terminan del todo, porque lo que producen se consume enseguida. Se cocina y se come; se lava la ropa y se vuelve a ensuciar; se barre la calle y al otro día hay hojas otra vez. La labor responde a necesidades del cuerpo y se repite en ciclos, como la vida misma.\n\n(3) La segunda es la fabricación: hacer objetos que duran más que el acto de hacerlos. La mesa del carpintero seguirá en la casa cuando él ya esté en otro encargo, y quizá la usen sus nietos. Para Arendt, la fabricación construye un mundo de cosas estables que nos da un lugar común donde habitar.\n\n(4) La tercera es la acción: lo que hacemos y decimos ante otros, en público, para iniciar algo nuevo. La líder comunal no fabrica un objeto ni satisface una necesidad del cuerpo; reúne a sus vecinos, habla, propone, y con ello muestra quién es y pone en marcha algo cuyo final nadie puede prever. La acción requiere la presencia de otras personas: nadie actúa, en este sentido, completamente solo.\n\n(5) Arendt consideraba que las tres actividades son necesarias para una vida humana completa, pero advertía un riesgo en las sociedades modernas: que todo se reduzca a la labor, es decir, a producir y consumir para seguir produciendo y consumiendo. Una persona que pasa el día entero ganándose el sustento puede quedar sin tiempo ni fuerzas para la acción, y una comunidad en la que nadie actúa queda a merced de lo que otros decidan por ella.\n\n(6) La distinción no pretende ordenar a las personas por importancia: la misma mujer que barre la calle en la mañana puede ser, en la tarde, la líder que convoca la reunión. Lo que propone es una pregunta para cualquiera: en mi semana, ¿cuánto tiempo dedico a sostener la vida, cuánto a construir algo que dure y cuánto a participar con otros en lo común?\n\nTexto expositivo original escrito para este simulacro; presenta con palabras propias ideas de La condición humana (1958) de Hannah Arendt.", "vis": "", "items": [{"id": "LCB-210", "niv": 1, "cp": "lc_local", "cn": "", "e": "Según el párrafo 2, la labor se caracteriza porque", "f": "Párrafo 2", "vis": "", "o": [["A", "solo la realizan las personas que no han tenido acceso a la educación formal.", "El texto no relaciona la labor con el nivel de estudio; el párrafo 6 dice que la distinción no ordena a las personas.", false], ["B", "produce objetos que duran más que el acto de hacerlos, como una mesa de madera.", "Esa es la definición de fabricación (párrafo 3).", false], ["C", "consiste en hablar y proponer ante otros, en público, para iniciar algo nuevo.", "Esa es la definición de acción (párrafo 4).", false], ["D", "lo que produce se consume enseguida, y por eso sus tareas se repiten en ciclos.", "El párrafo 2: las tareas de la labor «nunca terminan del todo, porque lo que producen se consume enseguida» y se repiten «en ciclos».", true]]}, {"id": "LCB-211", "niv": 1, "cp": "lc_global", "cn": "", "e": "En el texto, los ejemplos de la señora que barre, el carpintero y la líder comunal (párrafo 1) cumplen la función de", "f": "Párrafos 1 a 4", "vis": "", "o": [["A", "anticipar las tres actividades que el texto distingue después.", "Cada ejemplo reaparece luego: barrer en la labor (párrafo 2), la mesa en la fabricación (párrafo 3) y la líder en la acción (párrafo 4).", true], ["B", "criticar que se use la palabra «trabajo» para referirse a actividades del hogar.", "El texto no critica ese uso; observa que la palabra abarca actividades distintas.", false], ["C", "mostrar que algunos oficios valen más que otros y merecen un mejor salario.", "El párrafo 6 aclara que la distinción no ordena a las personas por importancia, y no se habla de salarios.", false], ["D", "demostrar que todas las ocupaciones son iguales y que no tiene sentido distinguirlas.", "El texto hace justamente lo contrario: distingue tres actividades.", false]]}, {"id": "LCB-212", "niv": 2, "cp": "lc_global", "cn": "", "e": "De acuerdo con el texto, ¿cuál de las siguientes actividades corresponde a la fabricación?", "f": "Párrafo 3 aplicado a ejemplos nuevos", "vis": "", "o": [["A", "Un padre prepara el almuerzo de la familia, que se consumirá ese mismo mediodía.", "Lo producido se consume enseguida: es labor (párrafo 2).", false], ["B", "Un trabajador lava los platos de un restaurante, que volverán a ensuciarse en la noche.", "Es una tarea cíclica que no deja un producto durable: labor.", false], ["C", "Un grupo de vecinos discute en asamblea cómo exigir que arreglen el alumbrado del barrio.", "Hablar y proponer ante otros para iniciar algo nuevo es acción (párrafo 4).", false], ["D", "Una albañila levanta el muro de una escuela que seguirá en pie y en uso durante décadas.", "Produce un objeto que «dura más que el acto de hacerlo» y que da «un lugar común donde habitar» (párrafo 3).", true]]}, {"id": "LCB-213", "niv": 3, "cp": "lc_global", "cn": "", "e": "Según el párrafo 5, ¿qué relación establece Arendt entre la labor y la acción en las sociedades modernas?", "f": "Párrafo 5", "vis": "", "o": [["A", "La labor es más importante que la acción, porque de ella depende la supervivencia de todos.", "El texto dice que las tres son necesarias; no pone la labor por encima de la acción.", false], ["B", "El exceso de labor puede dejar a las personas sin tiempo ni fuerzas para la acción.", "El párrafo 5: «Una persona que pasa el día entero ganándose el sustento puede quedar sin tiempo ni fuerzas para la acción».", true], ["C", "La acción solo puede darse cuando una persona ha dejado por completo de realizar labores.", "El párrafo 6 muestra que la misma persona puede barrer en la mañana y actuar en la tarde.", false], ["D", "En las sociedades modernas la labor y la acción se volvieron la misma actividad.", "El riesgo señalado es que la labor desplace a la acción, no que se fusionen.", false]]}, {"id": "LCB-214", "niv": 2, "cp": "lc_reflexion", "cn": "", "e": "En el párrafo 6 se aclara que la distinción «no pretende ordenar a las personas por importancia». Esta aclaración busca", "f": "Párrafo 6: estrategia discursiva", "vis": "", "o": [["A", "mostrar que Arendt despreciaba la labor y a quienes se dedican principalmente a ella.", "El texto dice que las tres actividades son necesarias; no hay desprecio por la labor.", false], ["B", "afirmar que la acción es una actividad reservada para los líderes de la comunidad.", "Es lo contrario: la misma mujer que barre puede ser la líder; la acción no es exclusiva de nadie.", false], ["C", "evitar que la distinción se lea como una jerarquía entre las personas o los oficios.", "Anticipa una posible mala interpretación y la corrige con el ejemplo de la mujer que barre y luego lidera la reunión.", true], ["D", "corregir lo dicho en el párrafo 5 sobre los riesgos de las sociedades modernas.", "La aclaración no contradice el párrafo 5; precisa el sentido general de la distinción.", false]]}, {"id": "LCB-215", "niv": 3, "cp": "lc_reflexion", "cn": "", "e": "Una vecina afirma: «Organizar con otros una reunión pacífica para pedir alumbrado público no es acción, porque al final no se fabricó nada». Según el texto, la vecina", "f": "Párrafo 4 aplicado a un enunciado", "vis": "", "o": [["A", "se equivoca, porque organizar una reunión es una forma de labor que se repite en ciclos.", "Reconoce el error, pero clasifica mal la actividad: no es labor sino acción.", false], ["B", "tiene razón, porque organizar una reunión es una tarea que satisface necesidades del cuerpo.", "Satisfacer necesidades del cuerpo define la labor, y una reunión comunitaria no es eso.", false], ["C", "tiene razón, porque según Arendt toda actividad humana valiosa debe producir algo durable.", "El texto dice que las tres actividades son necesarias y que la acción no produce objetos.", false], ["D", "se equivoca, porque la acción no se define por fabricar objetos, sino por iniciar algo nuevo con otros.", "El párrafo 4 dice que la líder comunal «no fabrica un objeto» y aun así actúa: reúne, habla, propone y pone en marcha algo nuevo.", true]]}]}, {"comp": "lectura_critica", "sim": "val-2", "ses": 1, "ind": "Filosofía política: el principio del daño en la comunidad", "tt": "Texto filosófico", "texto": "¿HASTA DÓNDE PUEDE MANDAR LA COMUNIDAD?\n\n(1) En muchos conjuntos residenciales y juntas de vecinos se discuten reglas que van más allá del ruido o las basuras: si se puede pintar la fachada de un color llamativo, si los residentes deben asistir a todas las actividades, si es aceptable que alguien lleve una vida que a los demás les parece desordenada. Detrás de esas discusiones hay una pregunta antigua: ¿cuándo tiene derecho un grupo a obligar a uno de sus miembros?\n\n(2) El filósofo inglés John Stuart Mill propuso en Sobre la libertad (1859) una respuesta conocida como el principio del daño. Según él, la única razón legítima para ejercer poder sobre un adulto en contra de su voluntad es impedir que cause daño a otros. El propio bien de esa persona, físico o moral, no basta: se le puede aconsejar, razonar con ella o tratar de persuadirla, pero no obligarla.\n\n(3) Mill distinguía así entre la parte de la conducta que concierne a los demás y la que solo concierne a uno mismo. Sobre la primera, la comunidad puede intervenir; sobre la segunda, decía, el individuo es soberano. Además, advertía que la presión no viene solo de las leyes: también la opinión pública, el chisme y el rechazo social pueden convertirse en una forma de tiranía cuando se usan para imponer a todos una misma manera de vivir.\n\n(4) Aplicado a la vida en comunidad, el principio ofrece un criterio útil. Prohibir que alguien deje basuras en la zona común se justifica, porque afecta a los vecinos; obligar a alguien a asistir a la novena de diciembre no, porque no participar no perjudica a nadie. Quienes deseen que asista pueden invitarlo, incluso insistirle; lo que no pueden es multarlo ni aislarlo por ello.\n\n(5) El principio, sin embargo, no resuelve todos los casos. Casi cualquier conducta afecta de algún modo a otros, y la frontera entre daño y simple molestia no siempre es clara: ¿perjudica a los vecinos una fachada pintada de morado, o solo les disgusta? Mill mismo separaba las conductas que perjudican intereses importantes de otros de las que simplemente les disgustan. Decidir en qué lado cae cada caso exige deliberar, y no hay fórmula que ahorre esa conversación.\n\nTexto argumentativo original escrito para este simulacro; presenta con palabras propias ideas de Sobre la libertad (1859) de John Stuart Mill.", "vis": "", "items": [{"id": "LCB-216", "niv": 1, "cp": "lc_local", "cn": "", "e": "Según el párrafo 2, cuando se trata solo del propio bien de un adulto, los demás pueden", "f": "Párrafo 2", "vis": "", "o": [["A", "no decirle nada, ni siquiera un consejo, pues cualquier comentario sería una forma de tiranía.", "El texto sí permite aconsejar y persuadir; la tiranía se refiere a usar la presión social para imponer una manera de vivir.", false], ["B", "aconsejarlo, razonar con él o tratar de persuadirlo, pero no obligarlo a cambiar.", "El párrafo 2: «se le puede aconsejar, razonar con ella o tratar de persuadirla, pero no obligarla».", true], ["C", "obligarlo a cambiar su conducta, siempre que sea por su propio bien físico o moral.", "El párrafo 2 dice que el propio bien de la persona «no basta» para obligarla.", false], ["D", "imponerle una multa moderada, para que reflexione sobre lo que está haciendo.", "Multar es una forma de obligar; el párrafo 4 lo descarta expresamente.", false]]}, {"id": "LCB-217", "niv": 2, "cp": "lc_global", "cn": "", "e": "¿Qué función cumple el ejemplo de la novena de diciembre en el párrafo 4?", "f": "Párrafo 4", "vis": "", "o": [["A", "Mostrar una conducta que solo concierne a la persona, en la que la comunidad no debe imponer sanciones.", "El párrafo 4 dice que obligar a asistir no se justifica «porque no participar no perjudica a nadie», y que no se puede multar ni aislar por ello.", true], ["B", "Criticar las celebraciones religiosas que se organizan en los conjuntos residenciales.", "El texto no critica la novena; critica obligar a asistir a ella.", false], ["C", "Mostrar uno de los casos difíciles en los que el principio del daño no ofrece una respuesta clara.", "El caso difícil es el de la fachada morada (párrafo 5); el de la novena es presentado como claro.", false], ["D", "Ilustrar un caso en el que la conducta de un residente sí causa un daño a los demás vecinos.", "El ejemplo del daño a los vecinos es el de las basuras en la zona común.", false]]}, {"id": "LCB-218", "niv": 3, "cp": "lc_global", "cn": "", "e": "¿Qué relación hay entre el párrafo 4 y el párrafo 5?", "f": "Párrafos 4 y 5", "vis": "", "o": [["A", "El 4 presenta objeciones al principio del daño y el 5 las responde una por una.", "El párrafo 4 no presenta objeciones, sino aplicaciones del principio.", false], ["B", "El 5 repite los mismos ejemplos del 4 para reforzar la idea sin añadir información.", "El párrafo 5 trae un ejemplo nuevo (la fachada) y la diferencia entre perjudicar a otros y simplemente disgustarlos.", false], ["C", "El 4 aplica el principio a casos claros y el 5 señala casos en los que la frontera no es evidente.", "El párrafo 4 presenta las basuras y la novena como casos resueltos; el 5 empieza «El principio, sin embargo, no resuelve todos los casos» y da el ejemplo de la fachada.", true], ["D", "El 5 refuta el principio del daño que el 4 había aplicado, y propone reemplazarlo por otro criterio.", "El párrafo 5 señala un límite, pero no refuta el principio ni propone otro.", false]]}, {"id": "LCB-219", "niv": 2, "cp": "lc_reflexion", "cn": "", "e": "Según el texto, ¿cuál de las siguientes medidas de un conjunto residencial sería difícil de justificar con el principio del daño?", "f": "Párrafo 4 aplicado a medidas nuevas", "vis": "", "o": [["A", "Cobrar una sanción económica a quien no participa en las actividades recreativas del conjunto.", "No asistir no perjudica a nadie, y el párrafo 4 dice que no se puede «multarlo ni aislarlo por ello».", true], ["B", "Sancionar a quien pone música a todo volumen de madrugada e impide dormir a los vecinos.", "Impedir el descanso de otros es una conducta que les concierne; se justifica la sanción.", false], ["C", "Prohibir que se quemen basuras en el parqueadero, porque el humo llega a los apartamentos vecinos.", "El humo afecta a otros; se justifica con el principio del daño.", false], ["D", "Exigir a los dueños de mascotas que recojan los excrementos en las zonas comunes del conjunto.", "Las zonas comunes afectan a todos; la medida se justifica, como en el caso de las basuras.", false]]}, {"id": "LCB-220", "niv": 3, "cp": "lc_reflexion", "cn": "", "e": "En el párrafo 3 se afirma que la opinión pública, el chisme y el rechazo social pueden ser «una forma de tiranía». Con esta idea, el texto sugiere que", "f": "Párrafo 3", "vis": "", "o": [["A", "la opinión pública suele proteger a quienes eligen vivir de una manera distinta.", "El texto advierte lo contrario: la opinión pública puede usarse para imponer a todos una misma manera de vivir.", false], ["B", "la libertad puede verse amenazada no solo por las leyes, sino también por la presión de los demás.", "El párrafo 3: «la presión no viene solo de las leyes»; también la presión social puede imponer «una misma manera de vivir».", true], ["C", "las leyes del Estado son la principal amenaza para la libertad dentro de una comunidad.", "El párrafo 3 no jerarquiza las amenazas: dice que la presión «no viene solo de las leyes», y amplía la amenaza a la presión social.", false], ["D", "el chisme debería sancionarse con multas en los conjuntos residenciales.", "El texto no propone castigos para el chisme; lo usa para mostrar otra forma de presión.", false]]}]}, {"comp": "lectura_critica", "sim": "val-2", "ses": 1, "ind": "Economía cotidiana: el préstamo gota a gota", "tt": "Texto informativo", "texto": "EL PRÉSTAMO QUE SALE CARO\n\n(1) Doña Marleny tiene un puesto de arepas en una esquina de su barrio. Hace un año necesitaba $ 500.000 para comprar una plancha nueva y, como en el banco le pedían papeles que no tenía, aceptó la oferta de un hombre que pasaba en moto por los negocios: le prestaba la plata ese mismo día, sin preguntas, y ella pagaba $ 25.000 diarios durante 24 días.\n\n(2) Parecía cómodo: $ 25.000 al día era lo que vendía en una mañana floja. Pero al final de los 24 días había pagado $ 600.000, es decir, $ 100.000 más de lo que recibió, en menos de un mes. Y cuando una semana de lluvia le bajó las ventas y se atrasó en dos cuotas, el cobrador dejó de ser amable.\n\n(3) Este tipo de préstamo informal, conocido en Colombia como «gota a gota», atrae precisamente por lo que parece su mayor ventaja: la rapidez y la falta de requisitos. Esa misma facilidad es la que lo vuelve peligroso. Como no hay contrato ni una entidad vigilada detrás, el deudor no tiene a quién reclamar si le cambian las condiciones, y la presión para cobrar puede llegar a las amenazas.\n\n(4) ¿Qué alternativas existen? Algunas cooperativas y fondos de empleados prestan montos pequeños con requisitos sencillos. Muchas comunidades organizan grupos de ahorro en los que cada miembro aporta una suma fija semanal y, por turnos o según un reglamento acordado, recibe un préstamo del fondo común. Y, aunque suene obvio, un ahorro pequeño y constante —separar cada día una parte de lo vendido— puede convertirse en la plancha nueva sin deberle nada a nadie, aunque tome más tiempo.\n\n(5) Ninguna de estas opciones es tan rápida como la moto que llega a la puerta. Pero la rapidez tiene un precio, y conviene calcularlo antes de aceptar. La pregunta útil no es «¿cuánto me toca pagar al día?», sino «¿cuánto termino pagando en total, y qué pasa si un día no puedo pagar?».\n\nColumna original escrita para este simulacro. El caso de doña Marleny es ficticio.", "vis": "", "items": [{"id": "LCB-221", "niv": 1, "cp": "lc_local", "cn": "", "e": "Según el párrafo 1, doña Marleny pidió el préstamo para", "f": "Párrafo 1", "vis": "", "o": [["A", "pagar unas cuotas atrasadas que debía en el banco.", "El banco se menciona porque le pedía papeles que no tenía; no tenía deudas con él.", false], ["B", "cubrir lo que dejó de vender en una semana de lluvia.", "La semana de lluvia ocurrió después, cuando ya estaba pagando el préstamo (párrafo 2).", false], ["C", "comprar una plancha nueva para su puesto de arepas.", "El párrafo 1: «necesitaba $ 500.000 para comprar una plancha nueva».", true], ["D", "comprar una moto para repartir arepas a domicilio.", "La moto es la del prestamista, no algo que ella quisiera comprar.", false]]}, {"id": "LCB-222", "niv": 2, "cp": "lc_global", "cn": "", "e": "En el párrafo 3, la rapidez y la falta de requisitos del préstamo «gota a gota» se presentan como", "f": "Párrafo 3", "vis": "", "o": [["A", "una desventaja que lleva a muchos comerciantes a preferir los bancos.", "El texto dice que esas características atraen a los deudores, no que los alejen; además, Marleny acudió al gota a gota porque el banco le pedía papeles.", false], ["B", "una ventaja que compensa el dinero adicional que cobra el prestamista.", "El párrafo 3 no dice que compense el costo: dice que esa misma facilidad «lo vuelve peligroso», y el párrafo 5 insiste en que la rapidez «tiene un precio».", false], ["C", "un requisito legal que deben cumplir todas las entidades que prestan dinero en Colombia.", "Confunde la falta de requisitos con un requisito; además, el texto no habla de normas legales.", false], ["D", "lo que atrae a los deudores y, a la vez, lo que los deja sin protección.", "El párrafo 3 dice que atrae por esa «mayor ventaja» y que «esa misma facilidad es la que lo vuelve peligroso», porque no hay contrato ni a quién reclamar.", true]]}, {"id": "LCB-223", "niv": 1, "cp": "lc_global", "cn": "", "e": "¿Qué función cumple la historia de doña Marleny dentro del texto?", "f": "Párrafos 1 a 3", "vis": "", "o": [["A", "Contar una historia de éxito de una comerciante que logró crecer gracias a un préstamo.", "La historia muestra los problemas del préstamo, no un éxito.", false], ["B", "Presentar un caso concreto que ilustra los riesgos que luego se explican en general.", "Los párrafos 1 y 2 narran el caso (costo de $ 100.000 y presión del cobrador); el 3 explica en términos generales por qué este préstamo es riesgoso.", true], ["C", "Señalar a los bancos como los únicos responsables de que existan los préstamos informales.", "El banco aparece solo como contexto; el texto no lo culpa de la existencia del gota a gota.", false], ["D", "Demostrar con estadísticas que la mayoría de los comerciantes del país usa préstamos informales.", "El texto no presenta estadísticas; es un solo caso, y además ficticio.", false]]}, {"id": "LCB-224", "niv": 2, "cp": "lc_reflexion", "cn": "", "e": "En el párrafo 5, el autor propone cambiar la pregunta «¿cuánto me toca pagar al día?» por «¿cuánto termino pagando en total, y qué pasa si un día no puedo pagar?». Con ello busca que el lector", "f": "Párrafo 5", "vis": "", "o": [["A", "evalúe el costo total y el riesgo del préstamo, no solo la comodidad de la cuota.", "El caso de Marleny mostró que la cuota parecía cómoda ($ 25.000), pero el total fue $ 100.000 más y el atraso trajo presión: la nueva pregunta apunta a eso.", true], ["B", "se convenza de que pedir dinero prestado suele ser una mala decisión.", "El texto propone alternativas de préstamo (cooperativas, grupos de ahorro); no rechaza todo préstamo.", false], ["C", "prefiera los préstamos con cuotas diarias, que resultan más fáciles de recordar.", "Es lo contrario: el autor advierte que fijarse en la cuota diaria es engañoso.", false], ["D", "compruebe que las cuotas diarias están prohibidas por la ley en todo el país.", "El texto no menciona ninguna prohibición legal de las cuotas diarias.", false]]}, {"id": "LCB-225", "niv": 3, "cp": "lc_reflexion", "cn": "", "e": "¿Cuál de las siguientes afirmaciones es coherente con la postura del autor?", "f": "Párrafos 3 a 5", "vis": "", "o": [["A", "El problema del gota a gota se resolvería negociando con el prestamista una cuota diaria menor.", "Una cuota menor no elimina los riesgos que señala el párrafo 3: no hay contrato, no hay a quién reclamar y puede haber amenazas.", false], ["B", "Conviene aceptar el préstamo que entregue el dinero el mismo día, para no perder la oportunidad.", "Contradice el párrafo 5: la rapidez «tiene un precio» y conviene calcularlo antes de aceptar.", false], ["C", "Los grupos de ahorro comunitarios entregan el dinero aún más rápido que los prestamistas gota a gota.", "El párrafo 5 dice que ninguna alternativa «es tan rápida como la moto que llega a la puerta».", false], ["D", "La rapidez de un préstamo no compensa por sí sola sus costos y riesgos, aunque sea una ventaja real.", "El párrafo 5 reconoce que las alternativas no son tan rápidas, pero afirma que «la rapidez tiene un precio, y conviene calcularlo antes de aceptar».", true]]}]}, {"comp": "lectura_critica", "sim": "val-2", "ses": 1, "ind": "Crónica comunitaria: la huerta del barrio", "tt": "Texto informativo", "texto": "LA HUERTA DEL LOTE BALDÍO\n\n(1) Durante quince años, el lote de la esquina del barrio Los Almendros fue un problema: allí se acumulaban escombros, colchones viejos y bolsas de basura que nadie reconocía como propias. Los vecinos se quejaban, la junta de acción comunal enviaba cartas a la alcaldía, y el lote seguía igual.\n\n(2) El cambio no empezó con una carta sino con una pala. En marzo, Rubiela Mosquera, enfermera pensionada, y su vecino Arnulfo, que había sido agricultor antes de llegar a la ciudad, limpiaron un rincón de cuatro metros y sembraron cilantro, cebolla y tomate. Al principio los miraban con desconfianza: «Eso se lo roban en una semana», les dijeron.\n\n(3) No se lo robaron. Lo que pasó fue otra cosa: los niños empezaron a preguntar qué era cada mata, una señora llegó con semillas de ají, un muchacho que trabajaba en construcción trajo tablas para hacer las eras. Para junio, la huerta ocupaba la mitad del lote y tenía un turno de riego con nombres pegados en un tablero.\n\n(4) No todo ha sido fácil. Hubo una discusión larga sobre cómo repartir la cosecha: algunos querían que cada quien se llevara lo que necesitara; otros, que solo recibieran quienes trabajaban. Al final acordaron en asamblea que la mitad se reparte entre quienes cumplen turnos y la otra mitad se lleva al comedor comunitario del barrio. Tampoco han resuelto qué pasará si el dueño del lote, a quien nadie ha podido contactar, aparece algún día.\n\n(5) Rubiela dice que lo mejor de la huerta no son las cebollas. «Antes uno pasaba por aquí tapándose la nariz y sin saludar a nadie. Ahora uno se queda conversando. Yo conocí a vecinos que tenían diez años de vivir en la misma cuadra que yo».\n\nCrónica original escrita para este simulacro; el barrio y las personas son ficticios.", "vis": "", "items": [{"id": "LCB-226", "niv": 1, "cp": "lc_local", "cn": "", "e": "Según el párrafo 2, ¿qué sembraron Rubiela y Arnulfo en el rincón que limpiaron?", "f": "Párrafo 2", "vis": "", "o": [["A", "Maíz y frijol, como en el campo de Arnulfo.", "El texto no menciona maíz ni frijol.", false], ["B", "Tomate y ají, en eras hechas con tablas.", "Mezcla datos: el ají y las tablas llegaron más tarde, por cuenta de otros vecinos (párrafo 3).", false], ["C", "Cilantro, cebolla y tomate.", "El párrafo 2 lo dice textualmente: «sembraron cilantro, cebolla y tomate».", true], ["D", "Ají, con las semillas que trajo una vecina.", "El ají llegó después, traído por otra señora (párrafo 3).", false]]}, {"id": "LCB-227", "niv": 2, "cp": "lc_global", "cn": "", "e": "La frase «El cambio no empezó con una carta sino con una pala» (párrafo 2) contrasta", "f": "Párrafos 1 y 2", "vis": "", "o": [["A", "el trabajo intelectual de los funcionarios con el trabajo manual de los campesinos del país.", "Generaliza más allá del texto, que habla de un barrio concreto, no de dos tipos de trabajo en general.", false], ["B", "la junta de acción comunal con la alcaldía, que nunca respondió a sus solicitudes.", "La frase no opone a esas dos instituciones; opone dos formas de buscar el cambio.", false], ["C", "las quejas escritas que no dieron resultado con la acción directa que transformó el lote.", "El párrafo 1 cuenta que la junta «enviaba cartas» y «el lote seguía igual»; el 2 muestra que el cambio llegó cuando dos vecinos se pusieron a limpiar y sembrar.", true], ["D", "dos maneras de comunicarse entre los vecinos: por escrito y en persona.", "La «pala» no es una forma de comunicación, sino de acción directa sobre el lote.", false]]}, {"id": "LCB-228", "niv": 2, "cp": "lc_global", "cn": "", "e": "¿Qué muestra el párrafo 4 sobre la experiencia de la huerta?", "f": "Párrafo 4", "vis": "", "o": [["A", "Que todos los vecinos estuvieron de acuerdo desde el principio sobre cómo repartir lo cosechado.", "El párrafo dice que hubo «una discusión larga».", false], ["B", "Que, junto a los logros, hubo desacuerdos que se resolvieron en asamblea y asuntos que siguen abiertos.", "El párrafo 4 narra la discusión sobre la cosecha, el acuerdo en asamblea y la pregunta sin resolver sobre el dueño del lote.", true], ["C", "Que el proyecto fracasó porque los vecinos no lograron ponerse de acuerdo sobre la cosecha.", "Sí llegaron a un acuerdo en asamblea, y la huerta sigue funcionando.", false], ["D", "Que el dueño del lote apareció y autorizó a los vecinos a seguir usando el terreno.", "El dueño no ha aparecido: «nadie ha podido contactar» con él.", false]]}, {"id": "LCB-229", "niv": 2, "cp": "lc_reflexion", "cn": "", "e": "Al cerrar la crónica con las palabras textuales de Rubiela, el cronista", "f": "Párrafo 5: estrategia discursiva", "vis": "", "o": [["A", "destaca, con la voz de una protagonista, que el mayor efecto de la huerta fue unir a los vecinos.", "Rubiela dice que lo mejor «no son las cebollas» y que ahora conoce a vecinos de diez años: la cita resalta el efecto en la convivencia.", true], ["B", "pone en duda la versión de Rubiela, porque ella es una de las fundadoras de la huerta.", "El cronista no cuestiona a Rubiela; usa su voz para cerrar.", false], ["C", "ofrece cifras exactas sobre cuántas personas participan hoy en los turnos de la huerta.", "La cita no trae cifras sobre participantes.", false], ["D", "contradice todo lo que había contado antes sobre los beneficios de la huerta.", "La cita confirma y amplía los beneficios; no los contradice.", false]]}, {"id": "LCB-230", "niv": 1, "cp": "lc_reflexion", "cn": "", "e": "¿Cuál de los siguientes hechos, mencionados en la crónica, podría poner en riesgo que la huerta continúe?", "f": "Párrafo 4", "vis": "", "o": [["A", "Que los niños del barrio pregunten por el nombre de cada mata.", "Es una muestra del interés que despertó la huerta, no una amenaza.", false], ["B", "Que exista un tablero con los turnos de riego y los nombres de los vecinos.", "El tablero muestra organización, lo que favorece la continuidad.", false], ["C", "Que la mitad de la cosecha se lleve al comedor comunitario del barrio.", "Es parte del acuerdo alcanzado en asamblea, no un riesgo.", false], ["D", "Que aparezca el dueño del lote, con quien nadie ha podido hablar.", "El párrafo 4 lo plantea como asunto no resuelto: si el dueño aparece, podría reclamar el terreno donde está la huerta.", true]]}]}, {"comp": "lectura_critica", "sim": "val-2", "ses": 1, "ind": "Historieta sobre trabajo en casa y familia", "tt": "Caricatura o cómic", "texto": "HISTORIETA: «CINCO MINUTICOS»\n\nViñeta 1: Una mujer trabaja en la mesa del comedor con un computador portátil. En la pantalla, su jefe le dice por videollamada: —Necesito el informe hoy antes de las seis. Detrás de ella, su hijo de unos cuatro años juega en el piso con una olla y una cuchara de palo.\n\nViñeta 2: El reloj de la pared marca las 5:45. La mujer escribe rápido. El niño la jala de la manga con la olla en la otra mano. Ella, sin dejar de mirar la pantalla, le dice: —Ya casi, mi amor. Cinco minuticos.\n\nViñeta 3: El reloj marca las 7:30. La mujer, despeinada, sigue frente al portátil. En la pantalla aparece un mensaje nuevo del jefe: «Gracias. Ahora, ¿puedes revisar esto otro?». El niño duerme en el sofá, abrazado a la olla.\n\nViñeta 4: La mujer cierra el portátil, carga al niño dormido y le dice en voz baja: —Mañana sí. Cinco minuticos de verdad.\n\nHistorieta original descrita para este simulacro.", "vis": "", "items": [{"id": "LCB-231", "niv": 2, "cp": "lc_local", "cn": "", "e": "En la viñeta 3, ¿qué indica que la madre lleva mucho tiempo trabajando?", "f": "Viñetas 2 y 3", "vis": "", "o": [["A", "El jefe le agradece por el informe en un mensaje nuevo.", "El agradecimiento indica que entregó el informe, no cuánto tiempo le tomó.", false], ["B", "El reloj marca las 7:30 y ella aparece despeinada frente al portátil.", "En la viñeta 2 el reloj marcaba las 5:45; en la 3 marca las 7:30 y ella sigue trabajando, despeinada: lleva casi dos horas más.", true], ["C", "El niño juega en el piso con una olla y una cuchara de palo.", "Eso ocurre en la viñeta 1, al comienzo de la jornada.", false], ["D", "Ella cierra el portátil y carga a su hijo en brazos.", "Eso ocurre en la viñeta 4 y muestra que deja de trabajar, no cuánto trabajó.", false]]}, {"id": "LCB-232", "niv": 1, "cp": "lc_global", "cn": "", "e": "La expresión «cinco minuticos», en las viñetas 2 y 4, sugiere que", "f": "Viñetas 2, 3 y 4", "vis": "", "o": [["A", "el informe que pidió el jefe le tomó a la madre solo cinco minutos, como ella había calculado.", "Pasan casi dos horas entre las viñetas 2 y 3, y luego llega otra tarea.", false], ["B", "el niño le pidió a su mamá que lo dejara jugar cinco minutos más con la olla antes de dormir.", "Es la madre quien dice «cinco minuticos», no el niño.", false], ["C", "el jefe le concedió a la madre cinco minutos de descanso entre el informe y la siguiente tarea.", "El jefe no le da descanso; le pide revisar «esto otro».", false], ["D", "la madre aplazó por el trabajo el tiempo con su hijo y promete cumplirle al día siguiente.", "En la viñeta 2 pide cinco minutos, pero a las 7:30 sigue trabajando y el niño ya se durmió; en la 4 promete «cinco minuticos de verdad».", true]]}, {"id": "LCB-233", "niv": 1, "cp": "lc_reflexion", "cn": "", "e": "¿Qué problema de la vida laboral plantea la historieta?", "f": "Sentido global de la historieta", "vis": "", "o": [["A", "La mala relación entre una madre y su hijo pequeño, que casi no conversan entre ellos.", "La madre trata al niño con cariño («mi amor», lo carga y le habla en voz baja).", false], ["B", "La falta de computadores y de una buena conexión a internet en muchos hogares del país.", "La historieta no muestra problemas tecnológicos: la videollamada y el portátil funcionan.", false], ["C", "La dificultad de separar el trabajo del tiempo en familia cuando se trabaja en casa.", "El trabajo ocurre en la mesa del comedor, se extiende más allá de la hora acordada y desplaza el tiempo con el hijo.", true], ["D", "Los b
