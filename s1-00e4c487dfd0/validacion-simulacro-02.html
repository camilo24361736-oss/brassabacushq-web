: casi no produjo gas (aumento de 1 cm), lo que muestra el efecto del azúcar.", true]]}, {"id": "CNB-236", "niv": 2, "cp": "cn_uso_comprensivo", "cn": "biologico", "e": "Si se repitiera el ensayo con 20 g de azúcar, pero con agua helada en lugar de agua tibia, ¿qué resultado sería esperable a los 30 minutos?", "f": "Fermentación y temperatura", "vis": "", "o": [["A", "Un aumento de unos 29 cm, porque la cantidad de azúcar es la misma.", "La cantidad de azúcar es igual, pero la temperatura también influye en la actividad de la levadura.", false], ["B", "Un aumento mayor que 29 cm, porque el agua helada disuelve mejor el azúcar.", "El azúcar se disuelve más lento en agua fría, y el frío reduce la actividad de la levadura.", false], ["C", "Un aumento menor que 29 cm, porque el frío reduce la actividad de la levadura.", "Las enzimas de la levadura trabajan más lento a baja temperatura; en el mismo tiempo se produce menos dióxido de carbono.", true], ["D", "Un aumento mayor que 29 cm, porque el frío acelera la fermentación.", "El frío hace más lenta la fermentación; por eso la masa de pan se deja leudar en lugares tibios.", false]]}]}, {"comp": "ciencias_naturales", "sim": "val-2", "ses": 2, "ind": "Estructura de la materia", "tt": "", "texto": "Las propiedades de las sustancias dependen de su estructura: de cómo están formados sus átomos y de cómo se unen y se atraen sus moléculas.", "vis": "", "items": [{"id": "CNB-246", "niv": 2, "cp": "cn_uso_comprensivo", "cn": "quimico", "e": "El carbono-14 se usa para estimar la edad de restos orgánicos. Un átomo de carbono-14 tiene 6 protones. ¿Cuántos neutrones tiene y por qué sigue siendo carbono?", "f": "Isótopos y número atómico", "vis": "", "o": [["A", "Tiene 6 neutrones, y es carbono porque tiene igual número de protones y de neutrones.", "Con 6 neutrones sería carbono-12; además, igualar protones y neutrones no es lo que define a un elemento.", false], ["B", "Tiene 8 neutrones, y es carbono porque tiene 6 protones.", "Neutrones = número de masa − protones = 14 − 6 = 8; el elemento lo define el número de protones (número atómico 6).", true], ["C", "Tiene 8 neutrones, y es carbono porque tiene 8 electrones.", "El átomo neutro de carbono tiene 6 electrones, y el elemento se define por los protones, no por los electrones.", false], ["D", "Tiene 14 neutrones, y es carbono porque su número de masa es 14.", "El número de masa (14) es la suma de protones y neutrones: 14 − 6 = 8 neutrones; y el elemento no lo define la masa.", false]]}, {"id": "CNB-247", "niv": 1, "cp": "cn_explicacion", "cn": "quimico", "e": "Al echar aceite en agua, se forman dos capas que no se mezclan. ¿Por qué?", "f": "Polaridad y solubilidad", "vis": "", "o": [["A", "Porque el agua es polar y el aceite es apolar, y no se atraen lo suficiente.", "Las moléculas de agua se atraen fuertemente entre sí y no con las del aceite, por eso no se disuelven.", true], ["B", "Porque el agua y el aceite reaccionan químicamente y forman dos sustancias nuevas.", "No hay reacción química: las dos capas siguen siendo agua y aceite.", false], ["C", "Porque las moléculas del aceite son tan grandes que no caben entre las moléculas del agua.", "La separación no se debe al tamaño de las moléculas, sino a que unas son polares y otras apolares.", false], ["D", "Porque el aceite es más denso que el agua y se va al fondo.", "El aceite es menos denso que el agua y queda arriba; además, la densidad no explica que no se mezclen.", false]]}, {"id": "CNB-248", "niv": 3, "cp": "cn_explicacion", "cn": "quimico", "e": "El hielo flota sobre el agua líquida, aunque ambos son la misma sustancia. ¿Cuál es la explicación?", "f": "Puentes de hidrógeno y densidad del hielo", "vis": "", "o": [["A", "Cada molécula de hielo tiene menos masa que una molécula de agua líquida.", "La masa de una molécula de H₂O no cambia al congelarse.", false], ["B", "Al congelarse, las moléculas de agua se agrandan y por eso el hielo ocupa más volumen.", "Las moléculas de H₂O tienen el mismo tamaño en ambos estados; cambia la distancia entre ellas.", false], ["C", "El hielo tiene aire atrapado en su interior y, si no lo tuviera, se hundiría en el agua líquida.", "El hielo sin burbujas de aire también flota; la causa está en el ordenamiento de sus moléculas.", false], ["D", "Las moléculas forman una red con espacios vacíos y el hielo queda menos denso.", "Los puentes de hidrógeno ordenan las moléculas en una estructura abierta; la misma masa ocupa más volumen.", true]]}]}, {"comp": "ciencias_naturales", "sim": "val-2", "ses": 2, "ind": "Combustibles fósiles y calentamiento global", "tt": "", "texto": "La quema de carbón, petróleo y gas natural libera dióxido de carbono (CO₂) a la atmósfera. La concentración de CO₂ en el aire ha aumentado de forma sostenida desde la Revolución Industrial, y este aumento se asocia con el calentamiento global.", "vis": "", "items": [{"id": "CNB-252", "niv": 2, "cp": "cn_explicacion", "cn": "cts", "e": "¿Por qué el aumento del CO₂ en la atmósfera contribuye al calentamiento global?", "f": "Efecto invernadero (IPCC)", "vis": "", "o": [["A", "Porque el CO₂ absorbe parte de la radiación infrarroja que emite la Tierra y retiene calor.", "Es el efecto invernadero: el CO₂ absorbe y reemite radiación infrarroja, y así parte del calor no escapa al espacio.", true], ["B", "Porque el CO₂ destruye la capa de ozono y deja entrar más luz del Sol.", "Confunde dos problemas distintos: el adelgazamiento de la capa de ozono no es la causa del efecto invernadero del CO₂.", false], ["C", "Porque el CO₂ reduce la cantidad de oxígeno del aire y eso aumenta la temperatura.", "La temperatura no aumenta por la disminución del oxígeno; aumenta por la absorción de radiación infrarroja.", false], ["D", "Porque el CO₂ sale caliente de los motores y calienta directamente el aire del planeta.", "El calor directo de los motores es mínimo frente al efecto invernadero; el problema es la capacidad del CO₂ de retener calor.", false]]}]}, {"comp": "ciencias_naturales", "sim": "val-2", "ses": 2, "ind": "Presión al cortar alimentos", "tt": "", "texto": "En la cocina de un restaurante, el chef pide afilar los cuchillos con frecuencia, porque con un cuchillo desafilado hay que hacer más fuerza y es más fácil que se resbale.", "vis": "", "items": [{"id": "CNB-241", "niv": 1, "cp": "cn_explicacion", "cn": "fisico", "e": "¿Por qué un cuchillo afilado corta los alimentos con menos esfuerzo que uno desafilado?", "f": "Presión: P = F/A", "vis": "", "o": [["A", "Porque un cuchillo afilado tiene más masa que uno desafilado.", "Afilar un cuchillo le quita material; no aumenta su masa.", false], ["B", "Porque la fuerza se concentra en un área menor, lo que produce mayor presión.", "Presión = fuerza ÷ área; con un filo muy delgado, la misma fuerza produce una presión mucho mayor.", true], ["C", "Porque el filo aumenta el área de contacto y así reparte mejor la fuerza aplicada.", "Es al contrario: el filo reduce el área de contacto; repartir la fuerza disminuiría la presión.", false], ["D", "Porque el filo hace que la fuerza aplicada aumente al llegar al alimento.", "El filo no aumenta la fuerza: con la misma fuerza, lo que aumenta es la presión, porque el área es menor.", false]]}]}, {"comp": "ciencias_naturales", "sim": "val-2", "ses": 2, "ind": "Punto de ebullición y altitud", "tt": "", "texto": "En Bogotá, a unos 2.600 m de altitud, el agua hierve a unos 92 °C; en Cartagena, al nivel del mar, hierve a unos 100 °C. La diferencia se debe a que en Bogotá la presión atmosférica es menor. Por eso, en una olla abierta, los fríjoles tardan más en ablandarse en Bogotá que en Cartagena.", "vis": "", "items": [{"id": "CNB-242", "niv": 3, "cp": "cn_explicacion", "cn": "fisico", "e": "Teniendo en cuenta lo anterior, ¿por qué una olla a presión reduce el tiempo de cocción de los alimentos, incluso en Bogotá?", "f": "Presión y punto de ebullición", "vis": "", "o": [["A", "Porque la olla impide que el agua hierva y así la mantiene a menor temperatura.", "Dentro de la olla el agua sí hierve, pero a una temperatura más alta.", false], ["B", "Porque la presión hace que el agua hierva a menor temperatura y así se ahorra gas.", "Al aumentar la presión, el punto de ebullición sube, no baja.", false], ["C", "Porque al aumentar la presión, el agua hierve a mayor temperatura y cocina más rápido.", "A mayor presión sobre el líquido, mayor temperatura de ebullición; el agua alcanza más de 100 °C y los alimentos se cocinan antes.", true], ["D", "Porque la presión aplasta los alimentos y los ablanda sin necesidad de calor.", "La olla no cocina por aplastamiento; lo hace porque el agua alcanza una temperatura mayor.", false]]}]}, {"comp": "ingles", "sim": "val-2", "ses": 2, "ind": "Parte 1 · Vocabulario: medios de transporte", "tt": "", "texto": "Read the descriptions of some words. What is the word for each description? Choose the correct word (A–G). There are more words than you need.\n\nA. ambulance\nB. bicycle\nC. ship\nD. plane\nE. truck\nF. taxi\nG. subway", "vis": "", "items": [{"id": "EN1-167", "niv": 1, "cp": "en_p1", "cn": "", "e": "It has two wheels. You ride it and push the pedals with your feet.", "f": "Vocabulario del campo semántico «Medios de transporte» (redacción propia)", "vis": "", "o": [["A", "ambulance", "«ambulance» significa «ambulancia»: vehículo con sirena que lleva enfermos y heridos al hospital; no corresponde a «Tiene dos ruedas. Uno se monta y empuja los pedales con los pies».", false], ["B", "bicycle", "Correcta. «bicycle» significa «bicicleta»: vehículo de dos ruedas que se mueve con los pedales, con la fuerza de las piernas. La descripción dice: «Tiene dos ruedas. Uno se monta y empuja los pedales con los pies».", true], ["C", "ship", "«ship» significa «barco (buque)»: embarcación grande que lleva personas o mercancías por el mar; no corresponde a «Tiene dos ruedas. Uno se monta y empuja los pedales con los pies».", false], ["D", "plane", "«plane» significa «avión»: vehículo que vuela; no corresponde a «Tiene dos ruedas. Uno se monta y empuja los pedales con los pies».", false], ["E", "truck", "«truck» significa «camión»: vehículo grande que transporta carga por carretera; no corresponde a «Tiene dos ruedas. Uno se monta y empuja los pedales con los pies».", false], ["F", "taxi", "«taxi» significa «taxi»: carro con conductor al que se le paga por llevarlo a un lugar; no corresponde a «Tiene dos ruedas. Uno se monta y empuja los pedales con los pies».", false], ["G", "subway", "«subway» significa «metro (subterráneo)»: tren que circula bajo tierra en una ciudad grande; no corresponde a «Tiene dos ruedas. Uno se monta y empuja los pedales con los pies».", false]]}, {"id": "EN1-168", "niv": 1, "cp": "en_p1", "cn": "", "e": "This vehicle has a siren and takes sick or injured people to the hospital.", "f": "Vocabulario del campo semántico «Medios de transporte» (redacción propia)", "vis": "", "o": [["A", "ambulance", "Correcta. «ambulance» significa «ambulancia»: vehículo con sirena que lleva enfermos y heridos al hospital. La descripción dice: «Este vehículo tiene sirena y lleva a personas enfermas o heridas al hospital».", true], ["B", "bicycle", "«bicycle» significa «bicicleta»: vehículo de dos ruedas que se mueve con los pedales, con la fuerza de las piernas; no corresponde a «Este vehículo tiene sirena y lleva a personas enfermas o heridas al hospital».", false], ["C", "ship", "«ship» significa «barco (buque)»: embarcación grande que lleva personas o mercancías por el mar; no corresponde a «Este vehículo tiene sirena y lleva a personas enfermas o heridas al hospital».", false], ["D", "plane", "«plane» significa «avión»: vehículo que vuela; no corresponde a «Este vehículo tiene sirena y lleva a personas enfermas o heridas al hospital».", false], ["E", "truck", "«truck» significa «camión»: vehículo grande que transporta carga por carretera; no corresponde a «Este vehículo tiene sirena y lleva a personas enfermas o heridas al hospital».", false], ["F", "taxi", "«taxi» significa «taxi»: carro con conductor al que se le paga por llevarlo a un lugar; no corresponde a «Este vehículo tiene sirena y lleva a personas enfermas o heridas al hospital».", false], ["G", "subway", "«subway» significa «metro (subterráneo)»: tren que circula bajo tierra en una ciudad grande; no corresponde a «Este vehículo tiene sirena y lleva a personas enfermas o heridas al hospital».", false]]}, {"id": "EN1-169", "niv": 2, "cp": "en_p1", "cn": "", "e": "You pay the driver of this car to take you to a place in the city.", "f": "Vocabulario del campo semántico «Medios de transporte» (redacción propia)", "vis": "", "o": [["A", "ambulance", "«ambulance» significa «ambulancia»: vehículo con sirena que lleva enfermos y heridos al hospital; no corresponde a «Se le paga al conductor de este carro para que lo lleve a un lugar de la ciudad».", false], ["B", "bicycle", "«bicycle» significa «bicicleta»: vehículo de dos ruedas que se mueve con los pedales, con la fuerza de las piernas; no corresponde a «Se le paga al conductor de este carro para que lo lleve a un lugar de la ciudad».", false], ["C", "ship", "«ship» significa «barco (buque)»: embarcación grande que lleva personas o mercancías por el mar; no corresponde a «Se le paga al conductor de este carro para que lo lleve a un lugar de la ciudad».", false], ["D", "plane", "«plane» significa «avión»: vehículo que vuela; no corresponde a «Se le paga al conductor de este carro para que lo lleve a un lugar de la ciudad».", false], ["E", "truck", "«truck» significa «camión»: vehículo grande que transporta carga por carretera; no corresponde a «Se le paga al conductor de este carro para que lo lleve a un lugar de la ciudad».", false], ["F", "taxi", "Correcta. «taxi» significa «taxi»: carro con conductor al que se le paga por llevarlo a un lugar. La descripción dice: «Se le paga al conductor de este carro para que lo lleve a un lugar de la ciudad».", true], ["G", "subway", "«subway» significa «metro (subterráneo)»: tren que circula bajo tierra en una ciudad grande; no corresponde a «Se le paga al conductor de este carro para que lo lleve a un lugar de la ciudad».", false]]}, {"id": "EN1-170", "niv": 2, "cp": "en_p1", "cn": "", "e": "It is a very large boat that carries people or goods across the sea.", "f": "Vocabulario del campo semántico «Medios de transporte» (redacción propia)", "vis": "", "o": [["A", "ambulance", "«ambulance» significa «ambulancia»: vehículo con sirena que lleva enfermos y heridos al hospital; no corresponde a «Es un bote muy grande que lleva personas o mercancías a través del mar».", false], ["B", "bicycle", "«bicycle» significa «bicicleta»: vehículo de dos ruedas que se mueve con los pedales, con la fuerza de las piernas; no corresponde a «Es un bote muy grande que lleva personas o mercancías a través del mar».", false], ["C", "ship", "Correcta. «ship» significa «barco (buque)»: embarcación grande que lleva personas o mercancías por el mar. La descripción dice: «Es un bote muy grande que lleva personas o mercancías a través del mar».", true], ["D", "plane", "«plane» significa «avión»: vehículo que vuela; no corresponde a «Es un bote muy grande que lleva personas o mercancías a través del mar».", false], ["E", "truck", "«truck» significa «camión»: vehículo grande que transporta carga por carretera; no corresponde a «Es un bote muy grande que lleva personas o mercancías a través del mar».", false], ["F", "taxi", "«taxi» significa «taxi»: carro con conductor al que se le paga por llevarlo a un lugar; no corresponde a «Es un bote muy grande que lleva personas o mercancías a través del mar».", false], ["G", "subway", "«subway» significa «metro (subterráneo)»: tren que circula bajo tierra en una ciudad grande; no corresponde a «Es un bote muy grande que lleva personas o mercancías a través del mar».", false]]}, {"id": "EN1-171", "niv": 3, "cp": "en_p1", "cn": "", "e": "It is a train that travels under the ground in a big city.", "f": "Vocabulario del campo semántico «Medios de transporte» (redacción propia)", "vis": "", "o": [["A", "ambulance", "«ambulance» significa «ambulancia»: vehículo con sirena que lleva enfermos y heridos al hospital; no corresponde a «Es un tren que viaja bajo tierra en una ciudad grande».", false], ["B", "bicycle", "«bicycle» significa «bicicleta»: vehículo de dos ruedas que se mueve con los pedales, con la fuerza de las piernas; no corresponde a «Es un tren que viaja bajo tierra en una ciudad grande».", false], ["C", "ship", "«ship» significa «barco (buque)»: embarcación grande que lleva personas o mercancías por el mar; no corresponde a «Es un tren que viaja bajo tierra en una ciudad grande».", false], ["D", "plane", "«plane» significa «avión»: vehículo que vuela; no corresponde a «Es un tren que viaja bajo tierra en una ciudad grande».", false], ["E", "truck", "«truck» significa «camión»: vehículo grande que transporta carga por carretera; no corresponde a «Es un tren que viaja bajo tierra en una ciudad grande».", false], ["F", "taxi", "«taxi» significa «taxi»: carro con conductor al que se le paga por llevarlo a un lugar; no corresponde a «Es un tren que viaja bajo tierra en una ciudad grande».", false], ["G", "subway", "Correcta. «subway» significa «metro (subterráneo)»: tren que circula bajo tierra en una ciudad grande. La descripción dice: «Es un tren que viaja bajo tierra en una ciudad grande».", true]]}]}, {"comp": "ingles", "sim": "val-2", "ses": 2, "ind": "Parte 2 · Avisos y lugares", "tt": "", "texto": "Read the notices. Where can you see each one? Choose the correct place (A, B or C).", "vis": "", "items": [{"id": "EN1-172", "niv": 1, "cp": "en_p2", "cn": "", "e": "Notice: \"Emergency entrance. Open 24 hours.\"\n\nWhere can you see this notice?", "f": "Conocimiento pragmático: propósito y lugar del aviso (redacción propia)", "vis": "", "o": [["A", "at a hospital", "Correcta. El aviso dice: «Entrada de urgencias. Abierto las 24 horas». La entrada de urgencias (emergency) abierta las 24 horas es propia de un hospital.", true], ["B", "at a natural history museum", "Un museo de historia natural tiene horario limitado y no atiende urgencias.", false], ["C", "at a school", "Un colegio no tiene entrada de urgencias ni abre las 24 horas.", false]]}, {"id": "EN1-173", "niv": 2, "cp": "en_p2", "cn": "", "e": "Notice: \"Please have your passport ready for immigration control.\"\n\nWhere can you see this notice?", "f": "Conocimiento pragmático: propósito y lugar del aviso (redacción propia)", "vis": "", "o": [["A", "at a hospital front desk", "En la recepción de un hospital piden documentos, pero no hay control de migración.", false], ["B", "at a bank", "En un banco pueden pedir documento, pero no hay control de migración.", false], ["C", "at an airport", "Correcta. El aviso dice: «Por favor tenga listo su pasaporte para el control de migración». El control de migración (immigration control) con pasaporte está en los aeropuertos internacionales.", true]]}, {"id": "EN1-174", "niv": 2, "cp": "en_p2", "cn": "", "e": "Notice: \"No smoking. Flammable materials.\"\n\nWhere can you see this notice?", "f": "Conocimiento pragmático: propósito y lugar del aviso (redacción propia)", "vis": "", "o": [["A", "at a swimming pool", "En una piscina no se almacenan materiales inflamables.", false], ["B", "at a gas station", "Correcta. El aviso dice: «Prohibido fumar. Materiales inflamables». En una estación de gasolina hay materiales inflamables (flammable): por eso no se puede fumar.", true], ["C", "at a clothing store", "Una tienda de ropa no tiene avisos de materiales inflamables.", false]]}, {"id": "EN1-175", "niv": 2, "cp": "en_p2", "cn": "", "e": "Notice: \"Thank you for shopping with us! Returns accepted within 30 days with this slip.\"\n\nWhere can you see this notice?", "f": "Conocimiento pragmático: propósito y lugar del aviso (redacción propia)", "vis": "", "o": [["A", "on a bus timetable", "Un horario de buses no es un recibo ni sirve para cambiar artículos.", false], ["B", "on a store receipt", "Correcta. El aviso dice: «¡Gracias por comprar con nosotros! Se aceptan devoluciones dentro de 30 días con este comprobante». «This slip» (este comprobante) y las devoluciones indican que el aviso está impreso en el recibo de compra de una tienda.", true], ["C", "on a medicine box", "La caja de un medicamento trae dosis, no condiciones para devolver compras.", false]]}, {"id": "EN1-176", "niv": 3, "cp": "en_p2", "cn": "", "e": "Notice: \"Interviews for the receptionist position: second floor, room 204.\"\n\nWhere can you see this notice?", "f": "Conocimiento pragmático: propósito y lugar del aviso (redacción propia)", "vis": "", "o": [["A", "at a sports stadium", "Un estadio no es lugar para indicar dónde son las entrevistas de un cargo de oficina.", false], ["B", "in a supermarket aisle", "En un pasillo de supermercado no hay pisos ni salas de entrevista.", false], ["C", "in an office building", "Correcta. El aviso dice: «Entrevistas para el cargo de recepcionista: segundo piso, sala 204». Las entrevistas de trabajo (position = cargo) se hacen en un edificio de oficinas con pisos y salas.", true]]}]}, {"comp": "ingles", "sim": "val-2", "ses": 2, "ind": "Parte 3 · Conversaciones breves", "tt": "", "texto": "Complete the conversations. Read what the first person says and choose the best answer (A, B or C).", "vis": "", "items": [{"id": "EN1-177", "niv": 1, "cp": "en_p3", "cn": "", "e": "\"How much is this shirt?\"", "f": "Conocimiento comunicativo: respuesta adecuada en una conversación breve (redacción propia)", "vis": "", "o": [["A", "It's forty thousand pesos.", "Correcta. «How much is this shirt?» = «¿Cuánto cuesta esta camisa?». «How much» pide el precio: «Cuesta cuarenta mil pesos».", true], ["B", "There are three in that size.", "Dice cuántas hay de esa talla («How many»), no cuánto cuesta.", false], ["C", "It's blue.", "Dice el color, no el precio.", false]]}, {"id": "EN1-178", "niv": 2, "cp": "en_p3", "cn": "", "e": "\"Would you like to leave a message?\"", "f": "Conocimiento comunicativo: respuesta adecuada en una conversación breve (redacción propia)", "vis": "", "o": [["A", "Yes, please. Tell him I called.", "Correcta. «Would you like to leave a message?» = «¿Quiere dejar un mensaje?». Acepta y deja el mensaje: «Sí, por favor. Dígale que llamé».", true], ["B", "Yes, I leave.", "Presente simple incorrecto; se diría «Yes, I'd like to» o «Yes, please».", false], ["C", "No, I'd like.", "Incompleta y contradictoria: «I'd like» necesita complemento y no concuerda con «No».", false]]}, {"id": "EN1-179", "niv": 2, "cp": "en_p3", "cn": "", "e": "\"Is there a pharmacy near here?\"", "f": "Conocimiento comunicativo: respuesta adecuada en una conversación breve (redacción propia)", "vis": "", "o": [["A", "It's a medicine.", "Habla de un medicamento; no dice si hay una droguería cerca.", false], ["B", "Yes, there are a pharmacy on the next corner.", "Incorrecta: con un sustantivo singular se usa «there is», no «there are».", false], ["C", "Yes, there's one on the next corner.", "Correcta. «Is there a pharmacy near here?» = «¿Hay una droguería cerca de aquí?». Usa «there's one» y da la ubicación: «Sí, hay una en la próxima esquina».", true]]}, {"id": "EN1-180", "niv": 3, "cp": "en_p3", "cn": "", "e": "\"I'm afraid the doctor is busy right now.\"", "f": "Conocimiento comunicativo: respuesta adecuada en una conversación breve (redacción propia)", "vis": "", "o": [["A", "Don't be afraid.", "Mismo error: interpreta «I'm afraid» como miedo y no responde a la información.", false], ["B", "That's OK. I can wait.", "Correcta. «I'm afraid the doctor is busy right now.» = «Lo siento, el doctor está ocupado en este momento.». «I'm afraid» aquí es «lamento decirle»; la respuesta natural es «Está bien, puedo esperar».", true], ["C", "Yes, I'm afraid of doctors too.", "Toma «afraid» como «tener miedo»; pero «I'm afraid…» es una forma cortés de dar una mala noticia.", false]]}, {"id": "EN1-181", "niv": 1, "cp": "en_p3", "cn": "", "e": "\"Did you pay the electricity bill?\"", "f": "Conocimiento comunicativo: respuesta adecuada en una conversación breve (redacción propia)", "vis": "", "o": [["A", "Yes, I pay it yesterday.", "Incorrecta: con «yesterday» se usa el pasado «paid», no el presente «pay».", false], ["B", "Yes, I paid it yesterday.", "Correcta. «Did you pay the electricity bill?» = «¿Pagaste el recibo de la luz?». Pasado simple correcto: «Sí, lo pagué ayer».", true], ["C", "No, it isn't very expensive this month.", "Habla del costo del recibo, no de si lo pagó.", false]]}]}, {"comp": "ingles", "sim": "val-2", "ses": 2, "ind": "Reportaje: emprendimiento de arepas por internet", "tt": "", "texto": "Read the text and choose the word that best fills each numbered gap.\n\nArepas from Doña Beatriz's kitchen\n\nThree years ago, Beatriz Cárdenas lost her job at a clothing store in Bogotá (1) ______ the store closed. She has always loved cooking, so she decided to sell arepas from her kitchen. At first, she only sold them to her neighbors, but soon her daughter suggested selling them online. \"I didn't know (2) ______ to use social media,\" Beatriz says, \"so my daughter opened an account for me.\" Now she receives orders every day, and she (3) ______ two people to help her in the mornings. Her cheese arepas are (4) ______ most popular product. Customers can pay in cash or by bank transfer. Delivery is free, (5) ______ only for orders of more than ten arepas. Last month a local newspaper (6) ______ an article about her business. Beatriz is proud, but she is also careful: \"I don't want to grow too fast. If I (7) ______ too many orders, the quality would go down.\" Her dream is to open a small restaurant (8) ______ the next two years.", "vis": "", "items": [{"id": "EN2-501", "niv": 1, "cp": "en_p4", "cn": "", "e": "Gap (1)", "f": "Gramática: conectores de causa y contraste", "vis": "", "o": [["A", "because", "Correcta: el cierre de la tienda es la causa de perder el empleo: «lost her job because the store closed» (porque la tienda cerró).", true], ["B", "although", "«although» (aunque) indicaría contraste, pero el cierre explica la pérdida del empleo; no la contradice.", false], ["C", "unless", "«unless» (a menos que) expresa condición y no se usa para narrar un hecho pasado que ya ocurrió.", false]]}, {"id": "EN2-502", "niv": 1, "cp": "en_p4", "cn": "", "e": "Gap (2)", "f": "Gramática: know how to", "vis": "", "o": [["A", "what", "«what to use social media» no es gramatical: «use» ya tiene su objeto (social media).", false], ["B", "who", "«who» pregunta por personas; no encaja con «to use social media».", false], ["C", "how", "Correcta: «know how to + verbo» (saber cómo hacer algo): «I didn't know how to use social media».", true]]}, {"id": "EN2-503", "niv": 2, "cp": "en_p4", "cn": "", "e": "Gap (3)", "f": "Gramática: tercera persona del presente simple", "vis": "", "o": [["A", "employ", "Falta la -s de tercera persona del singular: con «she» es «employs».", false], ["B", "employing", "«employing» sin el auxiliar «is» no forma un verbo completo.", false], ["C", "employs", "Correcta: presente simple con sujeto «she» lleva -s: «she now employs two people» (ahora emplea a dos personas).", true]]}, {"id": "EN2-504", "niv": 1, "cp": "en_p4", "cn": "", "e": "Gap (4)", "f": "Gramática: adjetivo posesivo frente a pronombre", "vis": "", "o": [["A", "her", "Correcta: el adjetivo posesivo va antes del sustantivo: «her most popular product» (su producto más popular).", true], ["B", "she", "«she» es pronombre sujeto; no puede indicar posesión antes de un sustantivo.", false], ["C", "hers", "«hers» es pronombre posesivo que reemplaza al sustantivo (the product is hers); no va antes de él.", false]]}, {"id": "EN2-505", "niv": 2, "cp": "en_p4", "cn": "", "e": "Gap (5)", "f": "Gramática: conectores de contraste (but only)", "vis": "", "o": [["A", "so", "«so» (así que) indicaría consecuencia; que el domicilio sea gratis no tiene como consecuencia «solo para pedidos grandes».", false], ["B", "but", "Correcta: «free, but only for...» (gratis, pero solo para...) introduce una restricción que contrasta con «free».", true], ["C", "or", "«or» presenta alternativas; «Delivery is free, or only for orders...» no ofrece dos opciones coherentes y no es gramatical.", false]]}, {"id": "EN2-506", "niv": 1, "cp": "en_p4", "cn": "", "e": "Gap (6)", "f": "Gramática: pasado simple con marcadores de tiempo", "vis": "", "o": [["A", "published", "Correcta: «Last month» exige pasado simple: «a local newspaper published an article» (publicó un artículo).", true], ["B", "publishing", "«publishing» sin auxiliar (was) no puede ser el verbo principal.", false], ["C", "publishes", "«publishes» es presente; no concuerda con «Last month».", false]]}, {"id": "EN2-507", "niv": 3, "cp": "en_p4", "cn": "", "e": "Gap (7)", "f": "Gramática: segundo condicional", "vis": "", "o": [["A", "will receive", "En la cláusula con «if» no se usa «will», y con «would» en la otra parte se necesita pasado.", false], ["B", "received", "Correcta: segundo condicional (if + pasado, would + verbo): «If I received too many orders, the quality would go down» (si recibiera demasiados pedidos, la calidad bajaría).", true], ["C", "receive", "«receive» (presente) corresponde al primer condicional, que usa «will», no «would».", false]]}, {"id": "EN2-508", "niv": 3, "cp": "en_p4", "cn": "", "e": "Gap (8)", "f": "Gramática: preposiciones de tiempo (within, since, ago)", "vis": "", "o": [["A", "since", "«since» señala el inicio de un periodo pasado (since 2020); no se usa con un plazo futuro.", false], ["B", "ago", "«ago» va después de una cantidad de tiempo pasado (two years ago); no puede ir antes de «the next two years».", false], ["C", "within", "Correcta: «within the next two years» (en el transcurso de los próximos dos años) indica un plazo futuro.", true]]}]}, {"comp": "ingles", "sim": "val-2", "ses": 2, "ind": "Perfil: enfermera de brigadas de salud rurales", "tt": "", "texto": "Read the text and answer the questions.\n\nA nurse on the river\n\nNelly Mosquera is a nurse at the hospital in Istmina, Chocó. Once a month, she leaves the hospital and travels with a health brigade to villages along the San Juan River, where there are no doctors. The trip is made by boat and can take up to six hours.\n\nThe brigade usually has five members: a doctor, two nurses, a dentist and a boat driver who also helps to carry the equipment. In each village they vaccinate children, check pregnant women and give medicines to people with long-term illnesses such as high blood pressure.\n\n\"The most difficult part is the weather,\" Nelly explains. \"When it rains a lot, the river rises and we have to wait until it is safe to travel.\" Electricity is another problem. Some vaccines must be kept cold, so the team carries special boxes with ice packs.\n\nNelly grew up in a village like the ones she visits now. When she was a child, a nurse came to her community only twice a year. \"I remember waiting for her all day in front of the school,\" she says. That nurse is the reason she decided to study nursing.\n\nThis year Nelly started training two young women from the villages as health promoters. They will teach families how to prevent common illnesses and will contact the hospital when someone needs urgent help.", "vis": "", "items": [{"id": "EN2-509", "niv": 1, "cp": "en_p5", "cn": "", "e": "How often does Nelly travel with the health brigade?", "f": "Párrafo 1", "vis": "", "o": [["A", "Once a month.", "Correcta: párrafo 1, «Once a month, she leaves the hospital and travels with a health brigade» (una vez al mes).", true], ["B", "Twice a year.", "«Twice a year» era la frecuencia con que una enfermera visitaba su pueblo cuando era niña.", false], ["C", "Every week.", "El texto no dice que viaje cada semana.", false]]}, {"id": "EN2-510", "niv": 2, "cp": "en_p5", "cn": "", "e": "How does the brigade get to the villages?", "f": "Párrafo 1", "vis": "", "o": [["A", "It flies there by helicopter.", "No se menciona ningún helicóptero.", false], ["B", "It travels along the river.", "Correcta: párrafo 1, «The trip is made by boat» y los pueblos están a orillas del río San Juan.", true], ["C", "It goes by road in a car.", "No se menciona carretera ni carro; el viaje es en bote.", false]]}, {"id": "EN2-511", "niv": 2, "cp": "en_p5", "cn": "", "e": "Who helps to carry the equipment?", "f": "Párrafo 2", "vis": "", "o": [["A", "The dentist.", "El dentista hace parte de la brigada, pero el texto no le asigna cargar el equipo.", false], ["B", "The two nurses.", "El texto no dice que las enfermeras carguen el equipo.", false], ["C", "The person who drives the boat.", "Correcta: párrafo 2, «a boat driver who also helps to carry the equipment» (el conductor del bote también ayuda a cargar).", true]]}, {"id": "EN2-512", "niv": 2, "cp": "en_p5", "cn": "", "e": "What does the brigade do when the river is very high?", "f": "Párrafo 3", "vis": "", "o": [["A", "It travels at night, when the river is calmer.", "No se menciona viajar de noche.", false], ["B", "It waits until the trip is safe.", "Correcta: párrafo 3, «we have to wait until it is safe to travel» (tienen que esperar hasta que sea seguro viajar).", true], ["C", "It cancels that month's visit.", "El texto habla de esperar, no de cancelar la visita.", false]]}, {"id": "EN2-513", "niv": 2, "cp": "en_p5", "cn": "", "e": "Why does the team carry boxes with ice packs?", "f": "Párrafo 3", "vis": "", "o": [["A", "To keep the team's food fresh.", "El texto no habla de la comida del equipo.", false], ["B", "To treat patients with high blood pressure.", "A esos pacientes se les dan medicamentos; las cajas son para las vacunas.", false], ["C", "To keep some of the vaccines cold.", "Correcta: párrafo 3, algunas vacunas deben mantenerse frías y no hay electricidad, por eso llevan cajas con hielo.", true]]}, {"id": "EN2-514", "niv": 2, "cp": "en_p5", "cn": "", "e": "Why did Nelly decide to study nursing?", "f": "Párrafo 4", "vis": "", "o": [["A", "A nurse who visited her village inspired her.", "Correcta: párrafo 4, «That nurse is the reason she decided to study nursing» (esa enfermera es la razón por la que estudió enfermería).", true], ["B", "Her mother worked as a nurse.", "El texto no menciona a la madre de Nelly.", false], ["C", "There was a big hospital near the school in her village.", "El texto menciona la escuela donde esperaba a la enfermera, pero no habla de ningún hospital cerca de ella.", false]]}, {"id": "EN2-515", "niv": 3, "cp": "en_p5", "cn": "", "e": "What will the new health promoters do?", "f": "Párrafo 5", "vis": "", "o": [["A", "Vaccinate the children in their villages.", "Vacunar es tarea de la brigada; el texto no se la asigna a las promotoras.", false], ["B", "Replace the brigade's monthly visits to all the villages along the San Juan River.", "El texto no dice que las promotoras reemplacen a la brigada.", false], ["C", "Teach families how to prevent illness and contact the hospital in emergencies.", "Correcta: párrafo 5, enseñarán a prevenir enfermedades comunes y contactarán al hospital cuando alguien necesite ayuda urgente.", true]]}]}, {"comp": "ingles", "sim": "val-2", "ses": 2, "ind": "Artículo de consejo: préstamos y contratos", "tt": "", "texto": "Read the text and answer the questions. Choose the correct answer (A, B, C or D).\n\nThink twice before you borrow\n\nEvery week, I meet people who come to my office with the same story. They needed money quickly for a motorcycle, a new phone or a family celebration, and someone offered them an easy loan: no papers, no questions, money in one hour. A few months later, they owe almost double what they borrowed.\n\nI am not against loans. Credit can help a family buy a house or start a business, and many banks and cooperatives offer fair conditions. The problem is not borrowing; it is borrowing without reading. Many people sign contracts they have not read because they feel embarrassed to ask questions, or because the salesperson seems friendly and in a hurry.\n\nBefore you sign anything, ask three questions. How much will I pay in total, not just each month? What happens if I pay late? Can I pay everything early without a penalty? If the lender cannot or will not answer clearly, walk away. A good offer can wait until tomorrow; a bad one usually cannot.\n\nFinally, be careful with offers that arrive by text message or social media. A real bank will never ask you to send a photo of your ID to an unknown number. When in doubt, call the institution directly, using the number on its official website.", "vis": "", "items": [{"id": "EN3-170", "niv": 2, "cp": "en_p6", "cn": "", "e": "What is the main purpose of the text?", "f": "Inferencia del propósito global", "vis": "", "o": [["A", "to warn readers about the risks of signing loans without understanding them", "Correcta. La idea central es «The problem is not borrowing; it is borrowing without reading», y el texto da preguntas y precauciones para evitarlo.", true], ["B", "to explain how banks calculate interest rates", "El texto no explica cálculos de intereses; da consejos prácticos.", false], ["C", "to convince readers never to ask for a loan", "El autor dice «I am not against loans» y reconoce que el crédito puede ayudar.", false], ["D", "to advertise the services of a particular cooperative that offers fair loans", "No se promociona ninguna entidad; las cooperativas se mencionan en general.", false]]}, {"id": "EN3-171", "niv": 2, "cp": "en_p6", "cn": "", "e": "What is the writer's attitude toward loans in general?", "f": "Inferencia de actitud: párrafo 2", "vis": "", "o": [["A", "They are acceptable only for buying a house.", "También menciona empezar un negocio; no limita el crédito a la vivienda.", false], ["B", "They are always a trap for families with little money.", "Generalización que el texto contradice: muchas entidades ofrecen condiciones justas.", false], ["C", "They should be given without papers to help people quickly.", "Lo contrario: «no papers, no questions» describe los préstamos peligrosos del primer párrafo.", false], ["D", "They can help people when the terms are reasonable and well understood.", "Correcta. «Credit can help a family buy a house or start a business, and many banks and cooperatives offer fair conditions».", true]]}, {"id": "EN3-172", "niv": 3, "cp": "en_p6", "cn": "", "e": "What does the writer mean by \"A good offer can wait until tomorrow; a bad one usually cannot\"?", "f": "Inferencia de sentido implícito: párrafo 3", "vis": "", "o": [["A", "Customers should accept offers before they expire.", "Es lo contrario del consejo: el autor recomienda no apresurarse.", false], ["B", "Good offers are usually more expensive than bad ones.", "La frase habla del tiempo para decidir, no del precio.", false], ["C", "Pressure to decide immediately is often a sign of a bad offer.", "Correcta. Una oferta honesta sigue disponible si uno se toma tiempo para pensar; la que exige decidir ya suele esconder malas condiciones.", true], ["D", "Banks only make good offers in the morning.", "Lectura literal de «tomorrow»; la frase es figurada y no se refiere a horarios.", false]]}, {"id": "EN3-173", "niv": 1, "cp": "en_p6", "cn": "", "e": "What can be inferred about the people described in the first paragraph?", "f": "Inferencia: párrafos 1 y 2", "vis": "", "o": [["A", "They had read their contracts carefully.", "El segundo párrafo indica que el problema es firmar sin leer.", false], ["B", "They did not understand the real cost of their loans.", "Correcta. Pidieron préstamos «fáciles» sin preguntas y meses después deben casi el doble: no conocían el costo real.", true], ["C", "They got their loans from cooperatives with fair conditions.", "Las cooperativas aparecen como ejemplo de condiciones justas, no de los préstamos del primer párrafo.", false], ["D", "They borrowed money to buy houses.", "Los ejemplos son una moto, un teléfono o una celebración.", false]]}, {"id": "EN3-174", "niv": 2, "cp": "en_p6", "cn": "", "e": "Why does the writer include the last paragraph?", "f": "Inferencia sobre la organización del texto", "vis": "", "o": [["A", "to explain how to open a bank account online", "No se habla de abrir cuentas; solo de llamar a la entidad por su número oficial.", false], ["B", "to repeat the three questions from the previous paragraph in a shorter way", "El último párrafo no repite las preguntas; trata un tema nuevo.", false], ["C", "to add a warning about a different risk: fraud through messages", "Correcta. Con «Finally» pasa a otro peligro: ofertas por mensaje o redes que piden fotos del documento a números desconocidos.", true], ["D", "to recommend one specific bank to readers", "No se nombra ningún banco.", false]]}]}, {"comp": "ingles", "sim": "val-2", "ses": 2, "ind": "Texto con espacios: anuncio de curso para adultos", "tt": "", "texto": "Read the text and choose the best word (A, B, C or D) for each gap.\n\nFREE COMPUTER COURSE FOR ADULTS\n\nDo you want to (1) ___ your digital skills? The Community Learning Center is offering a free twelve-week course for adults who have never (2) ___ a computer before. You will learn how to write documents, send emails, (3) ___ forms online and protect your personal information. Classes take place on Tuesday and Thursday evenings, so you can attend (4) ___ you work during the day. Places are limited, so we recommend that you (5) ___ before June 30.", "vis": "", "items": [{"id": "EN3-175", "niv": 1, "cp": "en_p7", "cn": "", "e": "Gap (1)", "f": "Vocabulario: improve", "vis": "", "o": [["A", "grow up", "«grow up» (crecer, hacerse adulto) se dice de personas y no lleva objeto.", false], ["B", "arise", "«arise» (surgir) es intransitivo y no tiene sentido aquí.", false], ["C", "rise", "«rise» (subir) es intransitivo; no puede llevar «your digital skills» como objeto.", false], ["D", "improve", "Correcta. «improve your skills» (mejorar sus ha function justHTML(it){

    `<div class="src">${esc(CFG.competencias[it.cp])} · Referencia: ${esc(it.f)}</div></div>`;

function itemHTML(it, n, mode){
  const r = ST.r[it.id];
  const reveal = mode === 'review' || (CFG.modo === 'practica' && r);
  let h = `<div class="item" id="i-${it.id}"><p class="enun"><span class="n">${n}.</span> <span class="niv">${CFG.niveles[it.niv]}</span> ${esc(it.e)}</p>${it.vis||''}<div class="${it.o.length>4?'ops8':''}">`;
  it.o.forEach(o => {
    let cls = '';

    else if (r === o[0]) cls = 'sel';
    h += `<button class="op ${cls}" data-id="${it.id}" data-l="${o[0]}" ${reveal?'disabled':''}><span class="l">${o[0]}.</span><span>${esc(o[1])}</span></button>`;
  });
  h += '</div>';
  if (reveal) {
    if (mode === 'review') h += `<div class="${r===keyOf(it)?'res-ok':'res-no'}" style="font-size:14px;margin-top:4px">${r ? (r===keyOf(it)?'Respondiste ' + r + ': correcto.':'Respondiste ' + r + '. La respuesta correcta es ' + keyOf(it) + '.') : 'Sin responder. La respuesta correcta es ' + keyOf(it) + '.'}</div>`;

function renderList(list, mode){
  let h = '', last = null, comp = null, parte = null, n = 0;

      if (k > 1) h += `<div class="inst">Responda las preguntas ${n} a ${n + k - 1} de acuerdo con la siguiente información</div>`;

function reiniciar(){ ST = {r:{}, t:{}, fin:{}}; ACT = 0; save(); inicio(); window.scrollTo(0,0); }

  const rest = CFG.minutos*60 - Math.floor((Date.now() - ST.t[ACT])/1000);

function examen(){
  const L = SES(ACT);
  $('#main').innerHTML = `<div class="mod" style="margin-top:0">${nombreS(ACT)}</div>` + navHTML(L) + renderList(L, 'examen') + `<div class="panel"><button class="btn" id="fin">Terminar la ${nombreS(ACT).toLowerCase()}</button> <button class="btn sec" id="volver">Volver al inicio</button></div>`;
  progreso(); reloj(); clearInterval(tick); tick = setInterval(reloj, 1000);
  $('#volver').onclick = () => { ST.act = ACT = 0; save(); inicio(); window.scrollTo(0,0); };
  $('#fin').onclick = () => {
    const faltan = L.length - L.filter(i => ST.r[i.id]).length;
    $('#mtxt').textContent = (faltan ? `Te faltan ${faltan} preguntas por responder en esta sesión. ¿Quieres terminarla de todos modos?` : '¿Quieres terminar esta sesión?');
    $('#modal').classList.remove('hide');
  };
}
function progreso(){
  const L = SES(ACT);
  const r = L.filter(it => ST.r[it.id]).length;
  $('#prog').textContent = `${nombreS(ACT)} · respondidas ${r}/${L.length}`;
}
$('#mno').onclick = () => $('#modal').classList.add('hide');
$('#msi').onclick = () => { $('#modal').classList.add('hide'); ST.fin[ACT] = Date.now(); ST.act = ACT = 0; save(); clearInterval(tick); if (ST.fin[1] && ST.fin[2]) resultados(); else inicio(); window.scrollTo(0,0); };
const fmt = x => String(Math.round(x*10)/10).replace('.', ',');
function resultados(){
  clearInterval(tick);
  const L = ITEMS.filter(it => ST.fin[it.caso.ses]);
  const completo = ST.fin[1] && ST.fin[2];
  const ok = L.filter(it => ST.r[it.id] === keyOf(it)).length;
  const pct = 100*ok/L.length;
  const agrupa = (lst, fn) => { const m = {}; lst.forEach(it => { const k = fn(it); m[k] = m[k] || [0,0]; m[k][1]++; if (ST.r[it.id]===keyOf(it)) m[k][0]++; }); return m; };
  const fila = (lab, v, cls) => `<tr class="${cls||''}"><td>${esc(lab)}</td><td class="r">${v[0]}/${v[1]}</td><td class="r">${Math.round(100*v[0]/v[1])} %</td></tr>`;
  const porMod = agrupa(L, it => it.caso.comp), porNiv = agrupa(L, it => it.niv);
  let tabla = '';
  Object.keys(CFG.componentes).filter(m => porMod[m]).forEach(m => { tabla += fila(CFG.componentes[m], porMod[m]);
    const sub = agrupa(L.filter(i => i.caso.comp === m), it => it.cp);
    Object.keys(CFG.competencias).filter(k => sub[k]).forEach(k => tabla += fila(CFG.competencias[k], sub[k], 'sub'));
    if (m === 'ciencias_naturales') { const cn = agrupa(L.filter(i => i.caso.comp === m), it => it.cn); Object.keys(CFG.comp_cn).filter(k => cn[k]).forEach(k => tabla += fila('Componente ' + CFG.comp_cn[k].toLowerCase(), cn[k], 'sub')); } });
  let ind = '';
  if (completo) {
    let num = 0, den = 0; Object.entries(porMod).forEach(([m, v]) => { num += PESO[m] * v[0]/v[1]; den += PESO[m]; });
    const pond = 100*num/den;
    ind = CFG.cuad === 'validantes'
      ? `<p><b>Indicador ponderado de aciertos: ${fmt(pond)} %</b> (Lectura Crítica, Matemáticas, Sociales y Ciencias pesan 3; Inglés pesa 1, igual que en el puntaje total de la Validación).</p><p class="aviso">Para aprobar la Validación necesitas un puntaje total de 30 o más en una escala de 0 a 60, que el Icfes calcula con un modelo estadístico (30 es el promedio de los validantes). Ningún simulacro puede convertir aciertos en ese puntaje exacto: usa el indicador para medir tu avance entre simulacros y refuerza primero las pruebas con peso 3 que tengas más bajas.</p>`
      : `<p><b>Indicador global ponderado: ${Math.round(5*pond)} de 500</b> (${fmt(pond)} % de aciertos ponderados: Lectura Crítica, Matemáticas, Sociales y Ciencias pesan 3; Inglés pesa 1, como en el puntaje global).</p><p class="aviso">El Icfes calcula el puntaje de cada prueba (0 a 100) y el global (0 a 500) con un modelo estadístico que tiene en cuenta la dificultad de cada pregunta y compara a todos los evaluados. Por eso este indicador no es tu puntaje oficial: sirve para medir tu avance entre simulacros.</p>`;
  }
  const mins = s => ST.fin[s] ? Math.round((ST.fin[s] - ST.t[s])/60000) : null;
  const tUso = [1,2].filter(s => ST.fin[s]).map(s => { const x = mins(s); return `${nombreS(s)}: ${Math.floor(x/60) ? Math.floor(x/60) + ' h ' : ''}${x%60} min`; }).join(' · ');
  $('#timer').textContent = '';
  $('#prog').textContent = `${ok}/${L.length} aciertos`;
  const peor = Object.entries(porMod).sort((a,b) => a[1][0]/a[1][1] - b[1][0]/b[1][1])[0];
  $('#main').innerHTML = `<div class="panel">${completo ? '' : `<p class="aviso" style="margin-top:0"><b>Resultado parcial:</b> solo has terminado la ${[1,2].filter(s=>ST.fin[s]).map(nombreS).join(' y ').toLowerCase()}. Termina la otra sesión para ver el resultado completo.</p>`}
  <div class="big">${fmt(pct)} %</div>
  <p style="margin-top:4px">${ok} de ${L.length} respuestas correctas. ${pct >= 75 ? 'Muy buen resultado: repasa tus errores para afianzarlo.' : pct >= 55 ? 'Vas por buen camino: refuerza las pruebas y competencias con menor porcentaje.' : 'Hay que reforzar: practica por prueba y competencia, empezando por la más baja.'} Tu prueba más baja: <b>${esc(CFG.componentes[peor[0]])}</b>.</p>
  ${ind}<p class="stat">Tiempo usado · ${tUso}</p>
  <h3>Por prueba y competencia</h3><table>${tabla}</table>
  <h3>Por dificultad</h3><table>${Object.entries(porNiv).map(([k,v]) => fila(CFG.niveles[k], v)).join('')}</table>
  <div class="row" style="margin-top:14px"><button class="btn sec" id="solo">Ver solo mis errores</button><button class="btn sec" id="todas">Ver todas</button><button class="btn sec" id="ini">Volver al inicio</button><button class="btn sec" id="otra">Reiniciar el simulacro</button></div></div><div id="rev"></div>`;
  const rev = errs => { let h = ''; [1,2].filter(s => ST.fin[s]).forEach(s => { const l = SES(s).filter(it => !errs || ST.r[it.id] !== keyOf(it)); h += `<div class="mod">${nombreS(s)}</div>` + (l.length ? renderList(l, 'review') : '<div class="panel">¡No tuviste errores en esta sesión!</div>'); }); $('#rev').innerHTML = h; };
  rev(true);
  $('#solo').onclick = () => rev(true); $('#todas').onclick = () => rev(false);
  $('#ini').onclick = () => { inicio(); window.scrollTo(0,0); };
  $('#otra').onclick = reiniciar;
}

document.addEventListener('click', e => {
  const b = e.target.closest('button.op'); if (!b || b.disabled) return;
  if (CFG.modo === 'simulacro' && (!ACT || ST.fin[ACT])) return;
  ST.r[b.dataset.id] = b.dataset.l; save();
  const it = ITEMS.find(i => i.id === b.dataset.id);
  const n = b.closest('.item').querySelector('.n').textContent.replace('.','');
  b.closest('.item').outerHTML = itemHTML(it, n, CFG.modo === 'practica' ? 'practica' : 'examen');
  if (CFG.modo === 'practica') { const resp = LIST.filter(i => ST.r[i.id]); const ok = resp.filter(i => ST.r[i.id]===keyOf(i)).length; $('#prog').textContent = `${ok}/${resp.length} aciertos`; $('#pst').textContent = `${LIST.length} preguntas · respondidas ${resp.length} · aciertos ${ok} (${Math.round(100*ok/resp.length)} %)`; }
  else progreso();
});
if (CFG.modo === 'practica') practica();
else if (ACT && ST.t[ACT] && !ST.fin[ACT]) examen();
else inicio();
</script>
</body>
</html>
