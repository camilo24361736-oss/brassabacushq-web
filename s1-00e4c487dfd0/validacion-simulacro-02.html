ajos salarios que suelen recibir quienes trabajan desde su casa para una empresa.", "La historieta no hace ninguna referencia al salario.", false]]}]}, {"comp": "lectura_critica", "sim": "val-2", "ses": 1, "ind": "Reglamento del salón comunal", "tt": "Texto discontinuo", "texto": "REGLAMENTO PARA EL USO DEL SALÓN COMUNAL\n\nJunta de Acción Comunal del barrio La Esperanza (documento ficticio).\n\nNota: quien incumpla este reglamento pierde el depósito y no podrá reservar el salón durante seis meses.", "vis": "<table class=\"vt\"><caption>Condiciones de uso del salón comunal<\/caption><thead><tr><th>Aspecto<\/th><th>Condición<\/th><\/tr><\/thead><tbody><tr><td>Quién puede reservar<\/td><td>Afiliados a la Junta con las cuotas al día<\/td><\/tr><tr><td>Cómo reservar<\/td><td>Con 8 días de anticipación, en la oficina de la Junta (martes y jueves, de 5:00 p. m. a 7:00 p. m.)<\/td><\/tr><tr><td>Horario de uso<\/td><td>Lunes a domingo, de 8:00 a. m. a 10:00 p. m.<\/td><\/tr><tr><td>Aporte por uso<\/td><td>$ 50.000 para eventos familiares; sin costo para actividades comunitarias abiertas (reuniones, talleres, jornadas de salud)<\/td><\/tr><tr><td>Depósito<\/td><td>$ 100.000; se devuelve si el salón se entrega limpio y sin daños<\/td><\/tr><tr><td>Prohibiciones<\/td><td>Venta de licor; música a alto volumen después de las 9:00 p. m.<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Fuente: documento ficticio elaborado para este simulacro.<\/div>", "items": [{"id": "LCB-234", "niv": 1, "cp": "lc_local", "cn": "", "e": "Según el reglamento, ¿hasta qué hora se puede usar el salón comunal?", "f": "Fila «Horario de uso»", "vis": "", "o": [["A", "Hasta las 10:00 p. m.", "La fila «Horario de uso» indica «de 8:00 a. m. a 10:00 p. m.».", true], ["B", "Hasta las 5:00 p. m.", "Las 5:00 p. m. es la hora en que abre la oficina para reservas los martes y jueves.", false], ["C", "Hasta las 9:00 p. m.", "Las 9:00 p. m. es la hora desde la cual se prohíbe la música a alto volumen, no el cierre del salón.", false], ["D", "Hasta las 7:00 p. m.", "Las 7:00 p. m. es la hora de cierre de la oficina para hacer reservas.", false]]}, {"id": "LCB-235", "niv": 2, "cp": "lc_global", "cn": "", "e": "Don Hernán, afiliado con sus cuotas al día, quiere usar el salón para el cumpleaños de su mamá y, una semana después, para un taller gratuito de primeros auxilios abierto a todo el barrio. Sin contar los depósitos, ¿cuánto debe pagar en total por concepto de aporte?", "f": "Fila «Aporte por uso»", "vis": "", "o": [["A", "$ 0", "Olvida que el cumpleaños es un evento familiar, que paga $ 50.000.", false], ["B", "$ 50.000", "El cumpleaños es un evento familiar ($ 50.000) y el taller abierto al barrio es una actividad comunitaria sin costo: $ 50.000 + $ 0 = $ 50.000.", true], ["C", "$ 100.000", "Cobra $ 50.000 por cada uso, sin tener en cuenta que el taller comunitario no tiene costo, o confunde el aporte con el depósito.", false], ["D", "$ 150.000", "Suma el aporte del cumpleaños y un depósito, cuando la pregunta pide no contar los depósitos.", false]]}, {"id": "LCB-236", "niv": 2, "cp": "lc_reflexion", "cn": "", "e": "¿Cuál es el propósito más probable de exigir un depósito que se devuelve si el salón se entrega limpio y sin daños?", "f": "Filas «Depósito» y nota", "vis": "", "o": [["A", "Motivar a los usuarios a cuidar el salón, ya que si no lo hacen pierden ese dinero.", "El depósito se devuelve solo si el salón queda limpio y sin daños; la nota añade que quien incumpla lo pierde: es un incentivo para cuidarlo.", true], ["B", "Cobrar también por las actividades comunitarias, que de otro modo serían gratuitas.", "El depósito no es un cobro por el uso: se devuelve si se cumplen las condiciones.", false], ["C", "Aumentar los ingresos de la Junta, que se queda con ese dinero después de cada evento.", "El depósito se devuelve cuando el salón se entrega bien; no es un ingreso fijo para la Junta.", false], ["D", "Impedir que las personas que no están afiliadas a la Junta puedan reservar el salón.", "Esa restricción la establece la fila «Quién puede reservar», no el depósito.", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "val-2", "ses": 1, "ind": "Derecho de petición ante la alcaldía", "tt": "", "texto": "Don Arturo, de 52 años, trabaja como maestro de obra. Quiere saber si cumple los requisitos para un subsidio de mejoramiento de vivienda que anunció la alcaldía, así que radicó una carta en la que solicita respetuosamente esa información.", "vis": "", "items": [{"id": "SCB-201", "niv": 1, "cp": "sc_pensamiento_social", "cn": "", "e": "Al radicar la carta ante la alcaldía, don Arturo ejerció", "f": "Constitución Política, art. 23", "vis": "", "o": [["A", "la acción de tutela.", "La tutela se presenta ante un juez para proteger derechos fundamentales vulnerados; don Arturo se dirigió a la alcaldía para pedir información.", false], ["B", "la iniciativa popular legislativa.", "La iniciativa legislativa sirve para presentar proyectos de ley, ordenanza o acuerdo; don Arturo solo pidió información sobre un subsidio.", false], ["C", "el cabildo abierto.", "El cabildo abierto es una sesión pública de una corporación con participación de la comunidad, no una solicitud individual por escrito.", false], ["D", "el derecho de petición.", "El artículo 23 de la Constitución reconoce a toda persona el derecho a presentar peticiones respetuosas a las autoridades, por motivos de interés general o particular, y a obtener pronta resolución.", true]]}]}, {"comp": "sociales_ciudadanas", "sim": "val-2", "ses": 1, "ind": "Contaminación de una quebrada", "tt": "", "texto": "Una curtiembre de un municipio ficticio vierte sus aguas residuales sin tratar en la quebrada La Clara. Los habitantes del barrio vecino se quejan de malos olores, de la muerte de los peces y de que los niños ya no pueden bañarse allí. La curtiembre emplea a 60 personas, muchas de ellas del mismo barrio.", "vis": "", "items": [{"id": "SCB-203", "niv": 2, "cp": "sc_pensamiento_social", "cn": "", "e": "La Constitución prevé un mecanismo judicial específico para proteger derechos e intereses colectivos, como el ambiente. Para el caso de la quebrada, ese mecanismo es", "f": "Constitución Política, arts. 15, 87 y 88", "vis": "", "o": [["A", "el habeas data.", "El habeas data protege el derecho a conocer, actualizar y rectificar la información personal en bases de datos.", false], ["B", "la acción de cumplimiento.", "La acción de cumplimiento busca que una autoridad cumpla una ley o un acto administrativo; no es el mecanismo diseñado para los derechos colectivos.", false], ["C", "la acción popular.", "El artículo 88 establece las acciones populares para proteger derechos e intereses colectivos relacionados, entre otros, con la salubridad pública y el ambiente.", true], ["D", "la revocatoria del mandato.", "La revocatoria del mandato sirve para terminar el periodo de un alcalde o gobernador, no para detener una contaminación.", false]]}, {"id": "SCB-204", "niv": 2, "cp": "sc_reflexivo_sistemico", "cn": "", "e": "Si un juez ordena cerrar la curtiembre de inmediato y de forma definitiva, ¿qué tensión entre dimensiones se presentaría?", "f": "Análisis de dimensiones de una decisión", "vis": "", "o": [["A", "Mejoraría la situación ambiental de la quebrada, pero se perderían empleos de personas del barrio.", "El cierre beneficia la dimensión ambiental y la salud, pero afecta la dimensión económica de las 60 familias que dependen de la curtiembre.", true], ["B", "No habría ningún efecto, porque la curtiembre no tiene relación con la economía del barrio.", "El texto dice que la curtiembre emplea a 60 personas, muchas del barrio; sí hay relación económica.", false], ["C", "Se resolvería un problema cultural del barrio, sin consecuencias para la salud de los habitantes.", "El problema es ambiental y de salud (olores, muerte de peces), no cultural; y el cierre sí tendría efectos sobre la salud.", false], ["D", "Empeoraría la calidad del agua de la quebrada, pero aumentarían los empleos en el barrio.", "Cerrar la fuente de contaminación mejora el agua y, en lo inmediato, reduce los empleos; la opción invierte ambos efectos.", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "val-2", "ses": 1, "ind": "Ramas del poder público en un programa de radio", "tt": "", "texto": "En un programa de una emisora comunitaria dedicado a la Constitución, un oyente llamó molesto: «Yo voté por el presidente para que hiciera las leyes que el país necesita, y todavía no las saca».\n\nLa locutora le respondió que la Constitución distribuye el poder público entre tres ramas —legislativa, ejecutiva y judicial (art. 113)— y otros órganos autónomos, y que no todas las funciones le corresponden al presidente.", "vis": "", "items": [{"id": "SCB-206", "niv": 1, "cp": "sc_pensamiento_social", "cn": "", "e": "Para aclarar la confusión del oyente, ¿qué función corresponde a la rama legislativa, ejercida por el Congreso de la República?", "f": "Constitución Política, arts. 113, 114, 119 y 189", "vis": "", "o": [["A", "Dirigir la Policía y las Fuerzas Militares.", "La dirección de la fuerza pública corresponde al Presidente de la República, jefe de la rama ejecutiva.", false], ["B", "Vigilar la gestión fiscal de las entidades públicas.", "La vigilancia de la gestión fiscal la ejerce la Contraloría, que es un órgano de control, no la rama legislativa.", false], ["C", "Hacer las leyes y ejercer control político sobre el gobierno.", "El artículo 114 establece que corresponde al Congreso reformar la Constitución, hacer las leyes y ejercer control político sobre el gobierno y la administración.", true], ["D", "Resolver los conflictos entre particulares mediante sentencias judiciales.", "Administrar justicia y dictar sentencias es función de la rama judicial.", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "val-2", "ses": 1, "ind": "Defensoría del Pueblo", "tt": "", "texto": "Marta llegó hace pocos meses a una ciudad intermedia con sus dos hijos. No conoce sus derechos ni sabe ante qué entidades puede reclamarlos cuando le niegan un servicio. Una vecina le recomienda buscar orientación en una entidad pública cuya misión es la promoción, el ejercicio y la divulgación de los derechos humanos.", "vis": "", "items": [{"id": "SCB-207", "niv": 1, "cp": "sc_pensamiento_social", "cn": "", "e": "¿A qué entidad se refiere la vecina?", "f": "Constitución Política, arts. 119, 120, 282 y 371", "vis": "", "o": [["A", "A la Registraduría Nacional del Estado Civil.", "La Registraduría organiza las elecciones y expide documentos de identidad; no tiene la misión de promover los derechos humanos.", false], ["B", "A la Contraloría General de la República.", "La Contraloría vigila el manejo de los recursos públicos; no orienta a las personas sobre sus derechos.", false], ["C", "Al Banco de la República.", "El Banco de la República es el banco central del país y se ocupa de la moneda, no de la orientación sobre derechos.", false], ["D", "A la Defensoría del Pueblo.", "El artículo 282 establece que el Defensor del Pueblo vela por la promoción, el ejercicio y la divulgación de los derechos humanos y debe orientar e instruir a los habitantes en su defensa.", true]]}]}, {"comp": "sociales_ciudadanas", "sim": "val-2", "ses": 1, "ind": "Vendedores informales y espacio público", "tt": "", "texto": "La alcaldía de una ciudad ficticia anunció que retirará a los vendedores informales de los andenes del centro. Estas son algunas opiniones:\n\nVendedora de frutas, 48 años: «Llevo quince años en esta esquina. Con lo que vendo pago el arriendo y el estudio de mis hijos. Si me quitan de aquí, ¿de qué vivo?».\n\nComerciante con local formal: «Yo pago impuestos, arriendo y servicios. Ellos venden lo mismo que yo en la puerta de mi negocio, sin pagar nada».\n\nUsuario en silla de ruedas: «Muchas veces tengo que bajarme a la calle porque los puestos ocupan todo el andén».\n\nFuncionario de la alcaldía: «El espacio público es de todos. Pero no queremos solo desalojar: ofreceremos a los vendedores módulos en una plaza cercana y cursos de formación».", "vis": "", "items": [{"id": "SCB-209", "niv": 1, "cp": "sc_perspectivas", "cn": "", "e": "¿En qué coinciden la opinión del usuario en silla de ruedas y la del funcionario de la alcaldía?", "f": "Análisis de perspectivas del caso", "vis": "", "o": [["A", "En que se deben ofrecer cursos de formación a las personas con discapacidad.", "Los cursos que menciona el funcionario son para los vendedores, y el usuario no habla de cursos.", false], ["B", "En que el andén debe quedar disponible para que circulen todas las personas.", "El usuario se queja de que los puestos le impiden usar el andén y el funcionario afirma que el espacio público es de todos: ambos defienden el uso común del andén.", true], ["C", "En que los vendedores deben trasladarse a módulos de una plaza cercana.", "La reubicación en módulos la propone solo el funcionario; el usuario no dice a dónde deberían ir los vendedores.", false], ["D", "En que los vendedores informales no pagan impuestos ni arriendo.", "Esa queja es del comerciante con local formal.", false]]}, {"id": "SCB-210", "niv": 2, "cp": "sc_perspectivas", "cn": "", "e": "¿Qué diferencia principal hay entre el argumento del comerciante formal y el de la vendedora?", "f": "Análisis de perspectivas del caso", "vis": "", "o": [["A", "El comerciante pide subsidios para su local; la vendedora pide que le cobren impuestos para poder vender.", "Ninguno de los dos hace esas peticiones; la opción inventa demandas que no están en el texto.", false], ["B", "El comerciante se queja de una competencia que considera desigual; la vendedora defiende el ingreso del que depende su familia.", "El comerciante argumenta que él paga impuestos y costos que los vendedores no pagan; la vendedora argumenta desde la necesidad de sustento de su hogar.", true], ["C", "Ambos están de acuerdo en que los vendedores deben quedarse en los andenes del centro.", "El comerciante se queja de que los vendedores estén frente a su negocio; no está de acuerdo con que se queden.", false], ["D", "El comerciante defiende la movilidad de las personas con discapacidad; la vendedora defiende los cursos de formación.", "La movilidad la plantea el usuario en silla de ruedas y los cursos los propone el funcionario.", false]]}, {"id": "SCB-211", "niv": 2, "cp": "sc_reflexivo_sistemico", "cn": "", "e": "La propuesta del funcionario busca conciliar dos aspectos del problema. ¿Cuáles?", "f": "Análisis de alternativas de solución", "vis": "", "o": [["A", "La construcción de nuevas vías y el aumento del número de carros en el centro de la ciudad.", "La propuesta no tiene relación con vías ni con el número de carros.", false], ["B", "La ampliación de los andenes y la prohibición definitiva de toda venta en la ciudad.", "La propuesta no prohíbe toda venta; ofrece reubicar a los vendedores en una plaza cercana.", false], ["C", "El aumento de los impuestos al comercio formal y la reducción de los arriendos del centro.", "El funcionario no propone cambios en impuestos ni en arriendos.", false], ["D", "La recuperación del espacio público y la protección del sustento de los vendedores.", "El funcionario quiere liberar los andenes (espacio público) y, a la vez, ofrecer módulos y cursos para que los vendedores sigan generando ingresos.", true]]}, {"id": "SCB-212", "niv": 3, "cp": "sc_perspectivas", "cn": "", "e": "La vendedora afirma que en la plaza ofrecida «no pasa nadie» y que allí no venderá lo suficiente. ¿Qué información permitiría evaluar mejor si su reacción frente a la propuesta está justificada?", "f": "Evaluación de la solidez de una reacción ante una propuesta", "vis": "", "o": [["A", "El flujo de personas que pasan por la plaza comparado con el de la esquina actual.", "La objeción de la vendedora se basa en que por la plaza no pasa nadie; comparar el flujo de compradores potenciales en ambos lugares permite verificar si su temor es fundado.", true], ["B", "El valor de los impuestos que paga mensualmente el comerciante con local formal.", "Los impuestos del comerciante no informan sobre las ventas posibles en la plaza.", false], ["C", "La cantidad de personas en silla de ruedas que viven en toda la ciudad.", "Ese dato sirve para el argumento del usuario en silla de ruedas, no para evaluar las ventas en la plaza.", false], ["D", "El número de años que la vendedora lleva trabajando en la misma esquina del centro.", "La antigüedad explica su arraigo, pero no permite saber si en la plaza podría vender lo suficiente.", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "val-2", "ses": 1, "ind": "Negociación entre sindicato y empresa", "tt": "", "texto": "Una fábrica ficticia de empaques quiere cambiar los turnos de trabajo: en lugar de tres turnos de ocho horas de lunes a viernes, propone turnos que incluyan sábados y domingos para atender un nuevo contrato de exportación.\n\nGerente: «Si no cumplimos con el cliente extranjero, perderemos el contrato y tendremos que reducir personal».\n\nPresidenta del sindicato: «No nos oponemos a crecer, pero muchos compañeros estudian los fines de semana o cuidan a sus hijos. Pedimos que los turnos de fin de semana sean voluntarios y se paguen con el recargo que corresponde».\n\nTrabajador joven, no sindicalizado: «A mí me sirve trabajar el fin de semana si me pagan más; necesito el dinero».", "vis": "", "items": [{"id": "SCB-216", "niv": 1, "cp": "sc_perspectivas", "cn": "", "e": "¿Qué argumento usa el gerente para defender el cambio de turnos?", "f": "Análisis de perspectivas del caso", "vis": "", "o": [["A", "Que los trabajadores quieren estudiar los fines de semana.", "Ese es un argumento de la presidenta del sindicato para pedir que los turnos sean voluntarios.", false], ["B", "Que el sindicato debe desaparecer para que la empresa pueda crecer en el mercado.", "El gerente no dice nada sobre el sindicato; su argumento se refiere al contrato.", false], ["C", "Que perder el contrato de exportación obligaría a reducir personal.", "El gerente advierte que, si no se cumple con el cliente extranjero, se perderá el contrato y habrá que reducir personal.", true], ["D", "Que los turnos del fin de semana deben pagarse con recargo.", "Esa es una petición del sindicato, no un argumento del gerente.", false]]}, {"id": "SCB-217", "niv": 2, "cp": "sc_perspectivas", "cn": "", "e": "¿En qué coinciden la presidenta del sindicato y el trabajador joven?", "f": "Análisis de perspectivas del caso", "vis": "", "o": [["A", "En que el trabajo del fin de semana debe pagarse con un valor adicional.", "La presidenta pide el recargo correspondiente y el joven dice que le sirve trabajar el fin de semana si le pagan más: ambos coinciden en el pago adicional.", true], ["B", "En que todos los trabajadores tienen hijos pequeños que cuidar durante los fines de semana.", "La presidenta habla de «muchos compañeros», no de todos, y el joven no menciona hijos.", false], ["C", "En que la empresa debe rechazar el contrato de exportación para proteger a sus trabajadores.", "La presidenta dice que no se oponen a crecer, y el joven quiere trabajar más; ninguno pide rechazar el contrato.", false], ["D", "En que nadie debería trabajar los fines de semana, sin importar el pago.", "El trabajador joven sí quiere trabajar los fines de semana, y la presidenta acepta esos turnos si son voluntarios.", false]]}, {"id": "SCB-218", "niv": 2, "cp": "sc_reflexivo_sistemico", "cn": "", "e": "Si la empresa acepta que los turnos de fin de semana sean voluntarios y con recargo, ¿qué efectos son esperables?", "f": "Análisis de efectos de una alternativa de solución", "vis": "", "o": [["A", "La empresa perdería con seguridad el contrato, porque ningún trabajador aceptaría el cambio.", "Al menos el trabajador joven manifiesta interés; no hay base para afirmar que nadie aceptaría.", false], ["B", "Los costos laborales de la empresa disminuirían y nadie trabajaría los fines de semana.", "Pagar recargos aumenta los costos, no los disminuye; y el trabajador joven muestra que habría voluntarios.", false], ["C", "Los trabajadores que estudian los fines de semana tendrían que abandonar sus estudios.", "Al ser voluntarios los turnos, quienes estudian pueden no tomarlos; esa consecuencia no se sigue de la medida.", false], ["D", "La empresa pagaría más por esos turnos, pero podría cumplir el contrato con quienes quieran trabajarlos.", "El recargo eleva el costo laboral, pero la voluntariedad atrae a trabajadores interesados, como el joven, y respeta a quienes estudian o cuidan a sus hijos.", true]]}]}, {"comp": "sociales_ciudadanas", "sim": "val-2", "ses": 1, "ind": "Jurisdicción especial indígena", "tt": "", "texto": "En un resguardo indígena del Cauca, un comunero tomó sin permiso las herramientas de trabajo de otra familia de la comunidad. El cabildo indígena lo juzgó según las normas y procedimientos propios del pueblo y le impuso como sanción trabajar durante un mes en la huerta comunitaria y devolver las herramientas. Un visitante comentó que «solo los jueces de la Rama Judicial pueden juzgar a alguien en Colombia».\n\nArtículo 246 de la Constitución: «Las autoridades de los pueblos indígenas podrán ejercer funciones jurisdiccionales dentro de su ámbito territorial, de conformidad con sus propias normas y procedimientos, siempre que no sean contrarios a la Constitución y leyes de la República».", "vis": "", "items": [{"id": "SCB-227", "niv": 2, "cp": "sc_pensamiento_social", "cn": "", "e": "¿Tiene razón el visitante?", "f": "Constitución Política, arts. 7 y 246", "vis": "", "o": [["A", "Sí, porque los cabildos solo pueden juzgar a personas que no pertenezcan a la comunidad indígena.", "Ocurre más bien lo contrario: la jurisdicción indígena se ejerce sobre asuntos de la comunidad y en su territorio.", false], ["B", "No, porque la Constitución permite a las autoridades indígenas juzgar en su territorio según sus propias normas.", "El artículo 246 autoriza a las autoridades indígenas a juzgar dentro de su territorio según sus normas y procedimientos, siempre que no contraríen la Constitución y las leyes; la sanción impuesta respeta ese marco.", true], ["C", "Sí, porque la Constitución solo reconoce a los jueces de la Rama Judicial la facultad de administrar justicia en el país.", "La Constitución reconoce jurisdicciones especiales, entre ellas la indígena (art. 246).", false], ["D", "No, porque los resguardos indígenas no están sometidos a la Constitución ni a las leyes de la República.", "El propio artículo 246 establece como límite que las normas indígenas no sean contrarias a la Constitución y las leyes.", false]]}, {"id": "SCB-228", "niv": 3, "cp": "sc_reflexivo_sistemico", "cn": "", "e": "Supongamos que una autoridad indígena decidiera imponer la pena de muerte a un comunero. Según el modelo de Estado descrito en el artículo 246, ¿qué ocurriría con esa decisión?", "f": "Constitución Política, arts. 11 y 246", "vis": "", "o": [["A", "Sería válida si el condenado pertenece a otra comunidad indígena distinta.", "La pertenencia del condenado a otra comunidad no cambia la prohibición constitucional de la pena de muerte.", false], ["B", "Sería válida, porque la autonomía de los pueblos indígenas no tiene ningún límite dentro del territorio del resguardo.", "El artículo 246 sí fija un límite: las decisiones no pueden ser contrarias a la Constitución y las leyes.", false], ["C", "No sería admisible, porque la Constitución, que limita la jurisdicción indígena, prohíbe la pena de muerte.", "El artículo 11 dispone que el derecho a la vida es inviolable y que no habrá pena de muerte; como la jurisdicción indígena no puede contrariar la Constitución (art. 246), esa sanción no es admisible.", true], ["D", "Sería válida solo si la mayoría de la comunidad la aprueba en una asamblea.", "Una mayoría no puede autorizar lo que la Constitución prohíbe; el derecho a la vida no depende de una votación.", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "val-2", "ses": 1, "ind": "Acueducto comunitario y empresa de flores", "tt": "", "texto": "En una vereda ficticia de la Sabana de Bogotá, la comunidad administra su propio acueducto, que se abastece de un pozo. Una empresa de flores que da empleo a 300 personas, la mayoría mujeres de la vereda, pidió permiso para perforar un pozo profundo y ampliar sus cultivos.\n\nTesorera del acueducto: «Si la empresa saca tanta agua, nuestro pozo se puede secar en verano. Primero está el agua para las casas».\n\nGerente de la empresa: «Con la ampliación podríamos contratar a 100 personas más de la zona».\n\nFuncionario de la autoridad ambiental: «Solo autorizaremos el pozo si un estudio técnico demuestra que no pone en riesgo el agua subterránea de la que dependen las familias».", "vis": "", "items": [{"id": "SCB-231", "niv": 1, "cp": "sc_perspectivas", "cn": "", "e": "¿Qué prioridad expresa la tesorera al decir «Primero está el agua para las casas»?", "f": "Análisis de perspectivas del caso", "vis": "", "o": [["A", "Que la autoridad ambiental haga el estudio técnico antes de que empiece el verano.", "El estudio técnico lo menciona el funcionario; la tesorera no habla de estudios ni de plazos.", false], ["B", "Que la empresa contrate primero a las mujeres de la vereda y luego a otras personas.", "La tesorera no habla de contrataciones; la frase se refiere al uso del agua.", false], ["C", "Que el consumo de las familias debe estar por encima del uso del agua para cultivar flores.", "Ante el riesgo de que el pozo se seque, la tesorera antepone el agua para el consumo doméstico al uso productivo de la empresa.", true], ["D", "Que las casas de la vereda paguen menos que la empresa por el servicio de agua.", "La tesorera no se refiere a tarifas; habla de qué uso del agua debe tener prioridad.", false]]}, {"id": "SCB-232", "niv": 2, "cp": "sc_perspectivas", "cn": "", "e": "¿Qué caracteriza la posición del funcionario de la autoridad ambiental?", "f": "Análisis de perspectivas del caso", "vis": "", "o": [["A", "Propone que la empresa y el acueducto compartan el pozo nuevo por partes iguales.", "El funcionario no propone compartir el pozo; condiciona la autorización a un estudio técnico.", false], ["B", "Condiciona su decisión a la evidencia técnica sobre el efecto del pozo en el agua de las familias.", "El funcionario dice que solo autorizará el pozo si un estudio técnico demuestra que no pone en riesgo el agua subterránea de la comunidad.", true], ["C", "Respalda a la empresa con la condición de que los nuevos empleos sean para personas de la vereda.", "El funcionario no pone condiciones sobre el empleo; su condición es un estudio técnico sobre el agua.", false], ["D", "Rechaza el pozo de antemano, sin esperar los resultados de ningún estudio técnico.", "El funcionario no rechaza el pozo de antemano: dice que lo autorizará si el estudio técnico demuestra que no hay riesgo para el agua.", false]]}, {"id": "SCB-233", "niv": 2, "cp": "sc_reflexivo_sistemico", "cn": "", "e": "La decisión sobre el pozo involucra principalmente una tensión entre", "f": "Análisis de dimensiones del problema", "vis": "", "o": [["A", "la generación de empleo para la vereda y la disponibilidad de agua para el consumo de las familias.", "La ampliación promete 100 empleos más (dimensión económica y social), pero podría reducir el agua del acueducto comunitario (dimensión ambiental y de acceso a un servicio básico).", true], ["B", "la autonomía del acueducto comunitario y el poder de la alcaldía sobre los servicios públicos.", "La alcaldía no interviene en el caso; quien decide es la autoridad ambiental.", false], ["C", "el derecho de las mujeres al trabajo y el derecho de la empresa a exportar sin pagar impuestos.", "Los impuestos de la empresa no forman parte del conflicto, que gira en torno al agua del pozo.", false], ["D", "la generación de empleo para la vereda y el precio de las flores en los mercados de exportación.", "El empleo sí está en juego, pero el precio de exportación de las flores no aparece en el conflicto; la otra parte de la tensión es el agua de las familias.", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "val-2", "ses": 1, "ind": "Recicladores de oficio", "tt": "", "texto": "Una ciudad ficticia planea contratar a una empresa privada con camiones compactadores para recoger todo el material reciclable de los hogares. Hoy, ese material lo recogen cerca de 2.000 recicladores de oficio, muchos de ellos organizados en una asociación, que lo venden en bodegas para obtener su ingreso diario.\n\nRecicladora con veinte años de oficio: «Nosotros hacemos este trabajo desde antes de que existieran las campañas de reciclaje. Si nos quitan el material, quedamos en la calle».\n\nIntegrante de un grupo ambientalista: «Lo que importa es que se recupere más material y llegue menos basura al relleno sanitario».\n\nFuncionario de la alcaldía: «La empresa privada garantiza rutas fijas y camiones adecuados».", "vis": "", "items": [{"id": "SCB-236", "niv": 1, "cp": "sc_reflexivo_sistemico", "cn": "", "e": "Si la alcaldía entrega toda la recolección a la empresa privada sin incluir a los recicladores, ¿qué efecto social es esperable?", "f": "Análisis de efectos de una intervención", "vis": "", "o": [["A", "Los recicladores pasarían a trabajar en la empresa privada, que necesitaría su experiencia.", "El caso no dice que la empresa vaya a contratarlos; la alcaldía los dejaría por fuera.", false], ["B", "Disminuiría la basura en el relleno, porque la empresa reciclaría más material que los recicladores.", "Es un efecto ambiental supuesto, no social, y el caso no permite afirmar que la empresa recuperaría más material.", false], ["C", "Aumentaría el número de bodegas de reciclaje en los barrios de la ciudad.", "Si el material lo recoge una empresa, lo esperable es que las bodegas que compran a los recicladores reciban menos, no que aumenten.", false], ["D", "Muchos recicladores perderían la fuente de ingreso de la que viven.", "Los recicladores obtienen su ingreso vendiendo el material que recogen; si la empresa recoge todo, se quedan sin esa fuente, como advierte la recicladora.", true]]}, {"id": "SCB-237", "niv": 3, "cp": "sc_reflexivo_sistemico", "cn": "", "e": "Una concejala propone que el contrato incluya a la asociación de recicladores, con pago por tonelada recuperada, uniformes y rutas asignadas. ¿Qué logra esta propuesta frente a las posiciones del caso?", "f": "Análisis de alternativas de solución", "vis": "", "o": [["A", "Organiza el servicio con rutas fijas, pero excluye a la asociación del contrato de recolección.", "La propuesta incluye a la asociación en el contrato; no la excluye.", false], ["B", "Atiende solo una de las posiciones del caso: la del funcionario que pide un servicio con rutas organizadas.", "La propuesta no se limita a las rutas: también incluye a la asociación de recicladores y paga por tonelada recuperada, lo que atiende otras posiciones del caso.", false], ["C", "Incluye a los recicladores en el contrato, aunque renuncia a organizar el servicio con rutas definidas.", "La propuesta incluye rutas asignadas; sí organiza el servicio.", false], ["D", "Combina la inclusión de los recicladores con la recuperación de material y con rutas organizadas.", "Al pagar por tonelada y asignar rutas, protege el ingreso de los recicladores (preocupación de la recicladora), incentiva recuperar más material (meta ambiental) y organiza el servicio (interés del funcionario).", true]]}, {"id": "SCB-238", "niv": 1, "cp": "sc_perspectivas", "cn": "", "e": "¿Qué prioriza el integrante del grupo ambientalista?", "f": "Análisis de perspectivas del caso", "vis": "", "o": [["A", "Que aumente el material recuperado y disminuya la basura en el relleno.", "El ambientalista dice que lo importante es recuperar más material y que llegue menos basura al relleno sanitario.", true], ["B", "Que los recicladores conserven su ingreso diario.", "Esa es la preocupación de la recicladora; el ambientalista no se refiere al ingreso de los recicladores.", false], ["C", "Que las bodegas paguen un mejor precio a los recicladores por el material que recogen.", "Nadie en el caso menciona el precio que pagan las bodegas.", false], ["D", "Que la empresa privada tenga camiones con rutas fijas.", "Las rutas fijas y los camiones son el argumento del funcionario de la alcaldía.", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "val-2", "ses": 1, "ind": "Testimonio sobre el Muro de Berlín", "tt": "", "texto": "Testimonio ficticio de una mujer de Berlín oriental, recogido en noviembre de 1989:\n\n«Durante veintiocho años vi el muro desde mi ventana. Mi hermana vivía a pocas cuadras, del otro lado. Durante años solo pude verla cuando ella conseguía un permiso para cruzar a nuestro sector; yo nunca pude ir a su casa. Anoche la gente empezó a cruzar los puestos de control y nadie la detuvo. Crucé con mis hijos y, por primera vez en veintiocho años, entré a la casa de mi hermana».", "vis": "", "items": [{"id": "SCB-241", "niv": 1, "cp": "sc_perspectivas", "cn": "", "e": "¿En qué acontecimiento se inscribe el testimonio?", "f": "IRI (UNLP), «13 de agosto de 1961: construcción del Muro de Berlín»; BBC Mundo (09-11-2019)", "vis": "", "o": [["A", "En la creación de la OTAN por Estados Unidos y sus aliados occidentales.", "La OTAN se creó en 1949; el testimonio es de 1989 y habla del cruce del muro.", false], ["B", "En el final de la Primera Guerra Mundial y la firma del Tratado de Versalles.", "El Tratado de Versalles es de 1919; el muro y los puestos de control del testimonio corresponden a la Guerra Fría.", false], ["C", "En la apertura y caída del Muro de Berlín, que había dividido la ciudad desde 1961.", "El Muro de Berlín se levantó el 13 de agosto de 1961 y cayó el 9 de noviembre de 1989: veintiocho años, como dice el testimonio.", true], ["D", "En la Revolución Industrial, cuando las familias migraron del campo a las fábricas.", "La Revolución Industrial ocurrió en los siglos XVIII y XIX; no tiene relación con un muro que dividía Berlín.", false]]}, {"id": "SCB-242", "niv": 2, "cp": "sc_perspectivas", "cn": "", "e": "¿Qué aporta este testimonio al estudio de la Guerra Fría que no aportaría una lista de fechas y tratados?", "f": "Evaluación de usos de una fuente primaria", "vis": "", "o": [["A", "La cifra exacta de personas que cruzaron el muro en noviembre de 1989.", "El testimonio no da cifras; narra una experiencia personal.", false], ["B", "La experiencia cotidiana de una familia separada por la división política de la ciudad.", "El testimonio muestra cómo la división entre bloques afectó la vida diaria (hermanas que solo se veían con permisos, una casa a pocas cuadras a la que no se podía ir), algo que una cronología no permite ver.", true], ["C", "La opinión de los gobiernos de Estados Unidos y la Unión Soviética sobre la apertura del muro.", "El testimonio es de una ciudadana, no de un gobierno; no expone posiciones oficiales.", false], ["D", "Las razones militares por las que la Unión Soviética construyó el muro en 1961.", "La mujer no explica las razones de la construcción del muro; habla de su vivencia.", false]]}]}, {"comp": "ciencias_naturales", "sim": "val-2", "ses": 1, "ind": "Abejas y cultivos de café", "tt": "", "texto": "En una finca cafetera, las abejas visitan las flores del café: obtienen néctar y polen como alimento y, al moverse de flor en flor, transportan polen. Para saber si estas visitas influyen en la producción, el caficultor cubrió con una malla fina algunas ramas, de modo que los insectos no pudieran llegar a sus flores, y dejó otras ramas descubiertas. Todas las ramas eran de plantas de la misma edad y variedad.", "vis": "", "items": [{"id": "CNB-205", "niv": 1, "cp": "cn_uso_comprensivo", "cn": "biologico", "e": "¿Qué tipo de relación hay entre las abejas y las plantas de café?", "f": "Relaciones ecológicas", "vis": "", "o": [["A", "Competencia.", "La competencia ocurre cuando dos especies usan el mismo recurso escaso; aquí no compiten.", false], ["B", "Mutualismo.", "Ambas especies se benefician: las abejas obtienen alimento y las plantas reciben polinización adicional, aunque el café también puede autopolinizarse.", true], ["C", "Parasitismo.", "En el parasitismo una especie se beneficia y la otra resulta perjudicada; aquí la planta no se perjudica.", false], ["D", "Depredación.", "En la depredación un organismo caza y consume a otro; las abejas no consumen la planta.", false]]}, {"id": "CNB-206", "niv": 2, "cp": "cn_indagacion", "cn": "biologico", "e": "Según la tabla, ¿qué conclusión es válida?", "f": "Análisis de resultados experimentales", "vis": "<table class=\"vt\"><caption>Tabla 2. Flores que se convirtieron en fruto<\/caption><thead><tr><th>Ramas<\/th><th>Flores observadas<\/th><th>Flores que dieron fruto (%)<\/th><\/tr><\/thead><tbody><tr><td>Cubiertas con malla<\/td><td>400<\/td><td>55<\/td><\/tr><tr><td>Descubiertas<\/td><td>400<\/td><td>72<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Datos ficticios.<\/div>", "o": [["A", "La visita de insectos se asoció con un mayor porcentaje de flores que dieron fruto.", "Las ramas descubiertas dieron fruto en el 72 % de las flores, frente al 55 % de las ramas cubiertas.", true], ["B", "Sin la visita de los insectos, la mayoría de las flores de café no logra producir fruto.", "Las ramas cubiertas también produjeron frutos en el 55 % de las flores, es decir, en la mayoría.", false], ["C", "El aumento de frutos se debió a las abejas y no a otros insectos visitantes.", "La malla excluyó a todos los insectos; el experimento no permite distinguir el aporte de las abejas del de otros visitantes.", false], ["D", "Los insectos disminuyen la producción de frutos del café.", "Los datos muestran lo contrario: con insectos hubo un mayor porcentaje de frutos.", false]]}]}, {"comp": "ciencias_naturales", "sim": "val-2", "ses": 1, "ind": "El sonido en un taller", "tt": "", "texto": "En un taller de carpintería, la jefa de seguridad explica a los trabajadores algunas características del sonido. Considere que la rapidez del sonido en el aire es 340 m/s.", "vis": "", "items": [{"id": "CNB-214", "niv": 1, "cp": "cn_uso_comprensivo", "cn": "fisico", "e": "Un sonido agudo, como el de una sierra pequeña, se diferencia de un sonido grave en que tiene", "f": "Características del sonido", "vis": "", "o": [["A", "mayor longitud de onda.", "Es al contrario: a mayor frecuencia, menor longitud de onda.", false], ["B", "mayor rapidez en el aire.", "En un mismo medio, los sonidos agudos y graves viajan con la misma rapidez.", false], ["C", "mayor frecuencia.", "El tono (agudo o grave) depende de la frecuencia: los sonidos agudos tienen mayor frecuencia.", true], ["D", "mayor amplitud.", "La amplitud se relaciona con la intensidad (volumen), no con el tono.", false]]}, {"id": "CNB-215", "niv": 1, "cp": "cn_uso_comprensivo", "cn": "fisico", "e": "Un trabajador grita frente a una pared y escucha el eco 0,4 s después. ¿A qué distancia está la pared?", "f": "Eco: distancia = rapidez × tiempo", "vis": "", "o": [["A", "68 m.", "En 0,4 s el sonido recorre 340 × 0,4 = 136 m, que corresponde a ir y volver; la distancia a la pared es 136 ÷ 2 = 68 m.", true], ["B", "136 m.", "Es la distancia total de ida y vuelta; falta dividir entre 2.", false], ["C", "170 m.", "Divide la rapidez entre 2 sin tener en cuenta el tiempo del eco.", false], ["D", "850 m.", "Divide la rapidez entre el tiempo (340 ÷ 0,4), cuando la distancia es rapidez por tiempo.", false]]}, {"id": "CNB-216", "niv": 3, "cp": "cn_indagacion", "cn": "fisico", "e": "La jefa de seguridad midió el nivel de sonido a diferentes distancias de una máquina cepilladora. Según la tabla, ¿qué ocurre con el nivel de sonido cada vez que se duplica la distancia?", "f": "Análisis de datos: nivel sonoro", "vis": "<table class=\"vt\"><caption>Tabla 3. Nivel de sonido de la cepilladora<\/caption><thead><tr><th>Distancia a la máquina (m)<\/th><th>Nivel de sonido (dB)<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>100<\/td><\/tr><tr><td>2<\/td><td>94<\/td><\/tr><tr><td>4<\/td><td>88<\/td><\/tr><tr><td>8<\/td><td>82<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Datos ficticios.<\/div>", "o": [["A", "Disminuye 12 dB.", "Cada vez que la distancia se duplica el nivel baja 6 dB; 12 dB corresponde a cuadruplicar la distancia.", false], ["B", "Aumenta 6 dB.", "El nivel de sonido disminuye al alejarse de la máquina.", false], ["C", "Se reduce a la mitad.", "De 1 m a 2 m el nivel pasa de 100 dB a 94 dB, que no es la mitad.", false], ["D", "Disminuye 6 dB.", "De 1 a 2 m baja de 100 a 94 dB; de 2 a 4 m, de 94 a 88 dB; y de 4 a 8 m, de 88 a 82 dB.", true]]}]}, {"comp": "ciencias_naturales", "sim": "val-2", "ses": 1, "ind": "Productos de limpieza y seguridad", "tt": "", "texto": "El blanqueador de uso doméstico es una solución de hipoclorito de sodio. Su etiqueta advierte: «No mezclar con otros productos de limpieza». Muchos limpiadores de baños contienen ácidos.", "vis": "", "items": [{"id": "CNB-220", "niv": 2, "cp": "cn_explicacion", "cn": "quimico", "e": "¿Por qué es peligroso mezclar el blanqueador con un limpiador ácido?", "f": "Reactividad del hipoclorito (fichas de salud pública)", "vis": "", "o": [["A", "Porque la mezcla libera mucho calor y puede explotar dentro del recipiente.", "El riesgo reconocido de esta mezcla no es una explosión, sino la liberación de un gas tóxico.", false], ["B", "Porque reaccionan y liberan cloro gaseoso, que es tóxico al respirarlo.", "El hipoclorito en medio ácido libera cloro (Cl₂), un gas que irrita gravemente los ojos y las vías respiratorias.", true], ["C", "Porque la mezcla se calienta hasta hervir y puede causar quemaduras en la piel.", "El peligro principal reconocido de esta mezcla es el gas tóxico que se libera, no la ebullición.", false], ["D", "Porque se forma amoníaco, un gas irritante para las vías respiratorias.", "El amoníaco no se forma en esta mezcla; lo que se libera al mezclar hipoclorito con un ácido es cloro gaseoso.", false]]}, {"id": "CNB-221", "niv": 2, "cp": "cn_uso_comprensivo", "cn": "quimico", "e": "El blanqueador tiene un pH cercano a 12. Si se diluye una taza de blanqueador en un balde con agua, ¿qué ocurre con el pH?", "f": "Escala de pH y dilución", "vis": "", "o": [["A", "Sube por encima de 12, porque al diluirlo el blanqueador actúa con más fuerza.", "Al diluir una base, la concentración de iones OH⁻ disminuye y el pH baja hacia 7; no sube.", false], ["B", "Queda exactamente en 7, porque el agua neutraliza el blanqueador.", "El agua diluye la base, pero no la neutraliza; para neutralizarla haría falta un ácido.", false], ["C", "Baja, pero la mezcla sigue siendo básica (pH mayor que 7).", "La dilución reduce la concentración de la base, así que el pH se acerca a 7 sin llegar a él: la mezcla sigue siendo básica.", true], ["D", "Pasa a ser ácida, porque el blanqueador es corrosivo.", "Ser corrosivo no lo hace ácido: muchas bases fuertes son corrosivas, y el blanqueador diluido sigue siendo básico.", false]]}]}, {"comp": "ciencias_naturales", "sim": "val-2", "ses": 1, "ind": "Diluciones y disolución", "tt": "", "texto": "En una empresa de aseo se preparan soluciones desinfectantes diluyendo un producto concentrado con agua. Al diluir, la cantidad de soluto no cambia: C₁ × V₁ = C₂ × V₂, donde C es la concentración y V el volumen.", "vis": "", "items": [{"id": "CNB-222", "niv": 1, "cp": "cn_uso_comprensivo", "cn": "quimico", "e": "Se necesita preparar 1.000 mL de desinfectante al 0,5 % a partir de un producto concentrado al 5 %. ¿Qué volumen del producto concentrado se debe usar?", "f": "Diluciones: C₁V₁ = C₂V₂", "vis": "", "o": [["A", "10 mL.", "Corresponde a una dilución de 1 en 100; la relación entre 5 % y 0,5 % es de 1 en 10.", false], ["B", "50 mL.", "Con 50 mL de concentrado la solución quedaría al 0,25 %, la mitad de la concentración pedida.", false], ["C", "100 mL.", "V₁ = C₂ × V₂ ÷ C₁ = 0,5 × 1.000 ÷ 5 = 100 mL de concentrado, y se completa con agua hasta 1.000 mL.", true], ["D", "500 mL.", "Usaría la mitad del volumen final como concentrado; la solución quedaría al 2,5 %, cinco veces más concentrada de lo pedido.", false]]}, {"id": "CNB-223", "niv": 2, "cp": "cn_indagacion", "cn": "quimico", "e": "En la cafetería de la empresa se midió el tiempo que tardan 10 g de azúcar en disolverse por completo en 200 mL de agua a diferentes temperaturas, agitando siempre de la misma manera. Una compañera concluye: «Estos datos demuestran que a mayor temperatura se puede disolver más cantidad de azúcar». ¿Es válida esta conclusión?", "f": "Validez de conclusiones", "vis": "<table class=\"vt\"><caption>Tabla 4. Tiempo de disolución del azúcar<\/caption><thead><tr><th>Temperatura del agua (°C)<\/th><th>Tiempo de disolución (s)<\/th><\/tr><\/thead><tbody><tr><td>10<\/td><td>120<\/td><\/tr><tr><td>30<\/td><td>70<\/td><\/tr><tr><td>50<\/td><td>40<\/td><\/tr><tr><td>70<\/td><td>20<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Datos ficticios.<\/div>", "o": [["A", "Sí, porque el tiempo de disolución disminuyó al aumentar la temperatura.", "Que se disuelva más rápido no indica que se pueda disolver más cantidad; rapidez y solubilidad son propiedades distintas.", false], ["B", "No, porque los datos muestran que el azúcar se disuelve igual a cualquier temperatura.", "Los tiempos cambiaron mucho con la temperatura (de 120 s a 20 s).", false], ["C", "Sí, porque a 70 °C se disolvieron más de 10 g de azúcar.", "En todos los ensayos se disolvieron exactamente 10 g; no se probó con más azúcar.", false], ["D", "No, porque se midió el tiempo en disolver 10 g, no la cantidad máxima que se disuelve.", "Los datos muestran que la disolución es más rápida con agua caliente, pero no informan sobre la solubilidad máxima.", true]]}]}, {"comp": "ciencias_naturales", "sim": "val-2", "ses": 1, "ind": "Reacciones con bicarbonato y combustión del gas propano", "tt": "", "texto": "El bicarbonato de sodio reacciona con el ácido acético del vinagre y produce acetato de sodio, agua y dióxido de carbono (un gas). En una práctica de laboratorio se hicieron dos montajes con las mismas cantidades: en el primero la reacción ocurrió en un vaso abierto y, en el segundo, dentro de una bolsa plástica cerrada. Ambos se pesaron antes y después de la reacción.", "vis": "", "items": [{"id": "CNB-224", "niv": 1, "cp": "cn_explicacion", "cn": "quimico", "e": "En el vaso abierto la masa final fue menor que la inicial, mientras que en la bolsa cerrada se mantuvo igual. ¿Cómo se explica esta diferencia?", "f": "Conservación de la masa en sistemas abiertos y cerrados", "vis": "", "o": [["A", "En el vaso abierto escapó el dióxido de carbono; en la bolsa quedó atrapado.", "La masa total se conserva; en el sistema abierto el gas formado sale al aire y la balanza ya no lo registra.", true], ["B", "En el vaso abierto parte de la materia se destruyó durante la reacción.", "La materia no se destruye en una reacción química; la masa faltante salió del vaso.", false], ["C", "En la bolsa cerrada no ocurrió ninguna reacción química y por eso la masa no cambió.", "La reacción sí ocurrió en la bolsa (se formó gas); la masa se mantuvo porque nada salió.", false], ["D", "La bolsa plástica añadió su propia masa a los productos de la reacción.", "La bolsa se pesó también al inicio; su masa no cambia durante la reacción.", false]]}, {"id": "CNB-225", "niv": 3, "cp": "cn_indagacion", "cn": "quimico", "e": "En otra prueba se pusieron 50 mL de vinagre comercial en cinco botellas, se agregó una masa distinta de bicarbonato a cada una y se tapó la boca con un globo. ¿Qué conclusión se apoya en los resultados de la gráfica?", "f": "Reactivo límite: análisis de datos", "vis": "<div class=\"vfig\"><svg class=\"vg\" viewBox=\"0 0 560 320\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Gráfica 3. Tamaño del globo según la masa de bicarbonato\" font-family=\"Arial, sans-serif\" font-size=\"12\"><rect width=\"560\" height=\"320\" fill=\"#ffffff\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"13\" fill=\"#1d2433\">Gráfica 3. Tamaño del globo según la masa de bicarbonato<\/text><line x1=\"60\" y1=\"258.0\" x2=\"540\" y2=\"258.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"262.0\" text-anchor=\"end\" fill=\"#3a4356\">0<\/text><line x1=\"60\" y1=\"202.5\" x2=\"540\" y2=\"202.5\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"206.5\" text-anchor=\"end\" fill=\"#3a4356\">10<\/text><line x1=\"60\" y1=\"147.0\" x2=\"540\" y2=\"147.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"151.0\" text-anchor=\"end\" fill=\"#3a4356\">20<\/text><line x1=\"60\" y1=\"91.5\" x2=\"540\" y2=\"91.5\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"95.5\" text-anchor=\"end\" fill=\"#3a4356\">30<\/text><line x1=\"60\" y1=\"36.0\" x2=\"540\" y2=\"36.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"40.0\" text-anchor=\"end\" fill=\"#3a4356\">40<\/text><line x1=\"60\" y1=\"258\" x2=\"540\" y2=\"258\" stroke=\"#3a4356\"/><line x1=\"60\" y1=\"258\" x2=\"60\" y2=\"36\" stroke=\"#3a4356\"/><text transform=\"translate(14,147.0) rotate(-90)\" text-anchor=\"middle\" fill=\"#3a4356\">Circunferencia del globo (cm)<\/text><text x=\"300.0\" y=\"312\" text-anchor=\"middle\" fill=\"#3a4356\">Bicarbonato agregado (g)<\/text><text x=\"108.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">1<\/text><text x=\"204.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">2<\/text><text x=\"300.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">3<\/text><text x=\"396.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">4<\/text><text x=\"492.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">5<\/text><rect x=\"74.4\" y=\"147.0\" width=\"67.2\" height=\"111.0\" fill=\"#1660a8\"/><text x=\"108.0\" y=\"143.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">20<\/text><rect x=\"170.4\" y=\"102.6\" width=\"67.2\" height=\"155.4\" fill=\"#1660a8\"/><text x=\"204.0\" y=\"98.6\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">28<\/text><rect x=\"266.4\" y=\"69.3\" width=\"67.2\" height=\"188.7\" fill=\"#1660a8\"/><text x=\"300.0\" y=\"65.3\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">34<\/text><rect x=\"362.4\" y=\"52.7\" width=\"67.2\" height=\"205.3\" fill=\"#1660a8\"/><text x=\"396.0\" y=\"48.7\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">37<\/text><rect x=\"458.4\" y=\"52.7\" width=\"67.2\" height=\"205.3\" fill=\"#1660a8\"/><text x=\"492.0\" y=\"48.7\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">37<\/text><\/svg><\/div>", "o": [["A", "Con 6 g de bicarbonato el globo alcanzaría unos 41 cm de circunferencia.", "Los datos muestran que el tamaño se estabilizó en 37 cm; no hay base para esperar 41 cm.", false], ["B", "La cantidad de gas producido es siempre proporcional a la masa de bicarbonato.", "De 4 g a 5 g el globo no creció más, así que la proporcionalidad no se mantiene.", false], ["C", "La cantidad de vinagre no influye en la cantidad de gas que se produce.", "El experimento no varió el vinagre; además, la estabilización sugiere que el vinagre limitó la reacción.", false], ["D", "Pasar de 4 g a 5 g no aumentó el tamaño del globo ni, por tanto, el gas.", "La circunferencia fue de 37 cm con 4 g y con 5 g: el ácido del vinagre se agotó y limitó la reacción.", true]]}, {"id": "CNB-226", "niv": 2, "cp": "cn_uso_comprensivo", "cn": "quimico", "e": "El gas propano de los cilindros de cocina arde según la ecuación C₃H₈ + x O₂ → 3 CO₂ + 4 H₂O. ¿Qué valor debe tener x para que la ecuación quede balanceada?", "f": "Balanceo de ecuaciones", "vis": "", "o": [["A", "2.", "Copia el coeficiente de la combustión del metano; con propano no se igualan los átomos de oxígeno.", false], ["B", "5.", "En los productos hay 3 × 2 + 4 × 1 = 10 átomos de oxígeno; se necesitan 10 ÷ 2 = 5 moléculas de O₂.", true], ["C", "7.", "Suma los coeficientes de los productos (3 + 4) en lugar de contar los átomos de oxígeno.", false], ["D", "10.", "Cuenta los átomos de oxígeno (10), pero cada molécula de O₂ aporta dos átomos.", false]]}]}, {"comp": "ciencias_naturales", "sim": "val-2", "ses": 1, "ind": "Presión de las llantas y temperatura", "tt": "", "texto": "Un conductor de un camión revisa la presión de las llantas en la mañana y después de varias horas de viaje bajo el sol. Considere que el volumen de aire dentro de cada llanta prácticamente no cambia y que, a volumen constante, la presión absoluta de un gas (la del medidor más la atmosférica) es directamente proporcional a su temperatura absoluta (T en kelvin = T en °C + 273).", "vis": "", "items": [{"id": "CNB-227", "niv": 2, "cp": "cn_explicacion", "cn": "quimico", "e": "Después del viaje, la presión de las llantas es mayor que en la mañana, aunque no se les agregó aire. ¿Por qué?", "f": "Teoría cinético-molecular", "vis": "", "o": [["A", "Porque al calentarse aumenta la cantidad de aire dentro de la llanta.", "No entra aire nuevo; la cantidad de gas es la misma.", false], ["B", "Porque el caucho de la llanta se contrae con el calor y comprime el aire.", "El caucho tiende a dilatarse con el calor, no a contraerse.", false], ["C", "Porque al calentarse, las partículas del aire chocan con más fuerza y frecuencia contra la llanta.", "A mayor temperatura, mayor energía cinética de las partículas; con el volumen casi constante, la presión aumenta.", true], ["D", "Porque el aire caliente pesa más que el aire frío y por eso empuja con más fuerza las paredes de la llanta.", "La masa del aire no cambia al calentarse; el aumento de presión se debe al movimiento de las partículas.", false]]}, {"id": "CNB-228", "niv": 3, "cp": "cn_uso_comprensivo", "cn": "quimico", "e": "La presión absoluta del aire de una llanta es 300 kPa a 27 °C. Si al final del viaje el aire de la llanta está a 57 °C, ¿cuál es su presión absoluta aproximada?", "f": "Ley de Gay-Lussac (presión absoluta)", "vis": "", "o": [["A", "272,7 kPa.", "Invierte la proporción (300 × 300 ÷ 330); al aumentar la temperatura la presión debe aumentar.", false], ["B", "300 kPa.", "Supone que la presión no cambia, pero a volumen constante aumenta con la temperatura.", false], ["C", "330 kPa.", "P₂ = P₁ × T₂ ÷ T₁ = 300 kPa × 330 K ÷ 300 K = 330 kPa.", true], ["D", "633,3 kPa.", "Usa las temperaturas en grados Celsius (300 × 57 ÷ 27); la proporcionalidad solo vale en kelvin.", false]]}, {"id": "CNB-229", "niv": 2, "cp": "cn_indagacion", "cn": "quimico", "e": "En un laboratorio se calentó un tanque rígido con gas y se registró su presión. ¿Qué afirmación se apoya en la gráfica?", "f": "Interpretación de gráficas: gases", "vis": "<div class=\"vfig\"><svg class=\"vg\" viewBox=\"0 0 560 320\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Gráfica 4. Presión del gas en el tanque rígido\" font-family=\"Arial, sans-serif\" font-size=\"12\"><rect width=\"560\" height=\"320\" fill=\"#ffffff\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"13\" fill=\"#1d2433\">Gráfica 4. Presión del gas en el tanque rígido<\/text><line x1=\"60\" y1=\"258.0\" x2=\"540\" y2=\"258.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"262.0\" text-anchor=\"end\" fill=\"#3a4356\">0<\/text><line x1=\"60\" y1=\"221.0\" x2=\"540\" y2=\"221.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"225.0\" text-anchor=\"end\" fill=\"#3a4356\">0,5<\/text><line x1=\"60\" y1=\"184.0\" x2=\"540\" y2=\"184.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"188.0\" text-anchor=\"end\" fill=\"#3a4356\">1<\/text><line x1=\"60\" y1=\"147.0\" x2=\"540\" y2=\"147.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"151.0\" text-anchor=\"end\" fill=\"#3a4356\">1,5<\/text><line x1=\"60\" y1=\"110.0\" x2=\"540\" y2=\"110.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"114.0\" text-anchor=\"end\" fill=\"#3a4356\">2<\/text><line x1=\"60\" y1=\"73.0\" x2=\"540\" y2=\"73.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"77.0\" text-anchor=\"end\" fill=\"#3a4356\">2,5<\/text><line x1=\"60\" y1=\"36.0\" x2=\"540\" y2=\"36.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"40.0\" text-anchor=\"end\" fill=\"#3a4356\">3<\/text><line x1=\"60\" y1=\"258\" x2=\"540\" y2=\"258\" stroke=\"#3a4356\"/><line x1=\"60\" y1=\"258\" x2=\"60\" y2=\"36\" stroke=\"#3a4356\"/><text transform=\"translate(14,147.0) rotate(-90)\" text-anchor=\"middle\" fill=\"#3a4356\">Presión (atm)<\/text><text x=\"300.0\" y=\"312\" text-anchor=\"middle\" fill=\"#3a4356\">Temperatura (°C)<\/text><text x=\"108.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">0<\/text><text x=\"204.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">25<\/text><text x=\"300.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">50<\/text><text x=\"396.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">75<\/text><text x=\"492.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">100<\/text><polyline fill=\"none\" stroke=\"#1660a8\" stroke-width=\"2.5\" points=\"108.0,110.0 204.0,96.7 300.0,82.6 396.0,69.3 492.0,56.0\"/><circle cx=\"108.0\" cy=\"110.0\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"108.0\" y=\"102.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">2<\/text><circle cx=\"204.0\" cy=\"96.7\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"204.0\" y=\"88.7\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">2,18<\/text><circle cx=\"300.0\" cy=\"82.6\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"300.0\" y=\"74.6\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">2,37<\/text><circle cx=\"396.0\" cy=\"69.3\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"396.0\" y=\"61.3\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">2,55<\/text><circle cx=\"492.0\" cy=\"56.0\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"492.0\" y=\"48.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">2,73<\/text><\/svg><\/div>", "o": [["A", "La presión disminuyó a medida que aumentó la temperatura.", "Todos los valores de presión aumentan con la temperatura.", false], ["B", "Al pasar de 50 °C a 100 °C, la presión se duplicó.", "La presión pasó de 2,37 atm a 2,73 atm, que no es el doble.", false], ["C", "La presión del gas no depende de su temperatura.", "La presión cambió de 2,00 atm a 2,73 atm al calentar el gas.", false], ["D", "La presión aumentó de manera lineal con la temperatura.", "Por cada 25 °C la presión aumenta casi lo mismo (alrededor de 0,18 atm): los puntos siguen una recta.", true]]}]}, {"comp": "ciencias_naturales", "sim": "val-2", "ses": 1, "ind": "Calentadores de gas en espacios cerrados", "tt": "", "texto": "Cada año se reportan intoxicaciones por el uso de calentadores de agua a gas instalados en baños o cocinas sin ventilación. El gas natural es principalmente metano; cuando arde con suficiente oxígeno produce dióxido de carbono y agua.", "vis": "", "items": [{"id": "CNB-230", "niv": 2, "cp": "cn_explicacion", "cn": "cts", "e": "¿Por qué es peligroso usar un calentador a gas en un espacio cerrado y sin ventilación?", "f": "Combustión completa e incompleta", "vis": "", "o": [["A", "Porque con poco oxígeno la combustión es incompleta y produce monóxido de carbono.", "Al faltar oxígeno se forma CO, gas sin olor que impide el transporte de oxígeno en la sangre.", true], ["B", "Porque se acumula dióxido de carbono, que es el gas más tóxico que produce la combustión.", "El gas más peligroso aquí es el monóxido de carbono, mucho más tóxico que el dióxido de carbono.", false], ["C", "Porque el gas natural que sale del calentador es venenoso al respirarlo, aunque sea en pequeñas cantidades.", "El metano no es tóxico en pequeñas cantidades; el riesgo de estas intoxicaciones proviene del monóxido de carbono.", false], ["D", "Porque la combustión completa del metano produce monóxido de carbono como producto principal.", "La combustión completa produce CO₂ y agua; el CO aparece cuando la combustión es incompleta.", false]]}]}, {"comp": "ciencias_naturales", "sim": "val-2", "ses": 1, "ind": "Prevención del dengue", "tt": "", "texto": "El dengue es causado por un virus que se transmite a las personas por la picadura de hembras del mosquito Aedes aegypti. Las hembras ponen sus huevos en las paredes de recipientes con agua; las larvas y las pupas viven en el agua, y de ellas salen los mosquitos adultos. Una secretaría de salud inspeccionó recipientes en un barrio y registró casos de dengue en el municipio.", "vis": "", "items": [{"id": "CNB-237", "niv": 1, "cp": "cn_explicacion", "cn": "biologico", "e": "¿Por qué tapar los tanques y eliminar los recipientes con agua estancada ayuda a reducir los casos de dengue?", "f": "Ciclo de vida de Aedes aegypti (CDC; Minsalud)", "vis": "", "o": [["A", "Porque los mosquitos adultos necesitan beber agua estancada para poder picar.", "Lo que se interrumpe es el desarrollo de las larvas y pupas en el agua, no la alimentación de los adultos.", false], ["B", "Porque impide que el mosquito complete su ciclo de vida, que necesita agua.", "Sin agua disponible, las hembras no tienen dónde poner huevos que se desarrollen en larvas y pupas, y nacen menos mosquitos.", true], ["C", "Porque las larvas del mosquito son las que pican a las personas y les transmiten el virus.", "Las larvas viven en el agua y no pican; son las hembras adultas las que pican y transmiten el virus.", false], ["D", "Porque el virus del dengue vive en el agua estancada y se transmite al beberla.", "El dengue se transmite por la picadura del mosquito, no por beber agua.", false]]}, {"id": "CNB-238", "niv": 1, "cp": "cn_indagacion", "cn": "biologico", "e": "Según la tabla, ¿qué conclusión se apoya en los datos de la inspección?", "f": "Análisis de datos de vigilancia entomológica", "vis": "<table class=\"vt\"><caption>Tabla 5. Recipientes inspeccionados en el barrio<\/caption><thead><tr><th>Tipo de recipiente<\/th><th>Revisados<\/th><th>Con larvas<\/th><\/tr><\/thead><tbody><tr><td>Tanques tapados<\/td><td>40<\/td><td>2<\/td><\/tr><tr><td>Tanques destapados<\/td><td>40<\/td><td>18<\/td><\/tr><tr><td>Llantas viejas<\/td><td>25<\/td><td>14<\/td><\/tr><tr><td>Floreros<\/td><td>30<\/td><td>9<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Datos ficticios.<\/div>", "o": [["A", "Los tanques destapados tuvieron larvas con más frecuencia que los tapados.", "Hubo larvas en 18 de 40 tanques destapados y solo en 2 de 40 tapados.", true], ["B", "Los floreros tuvieron larvas en mayor proporción que las llantas viejas.", "Los floreros tuvieron larvas en 9 de 30 (30 %) y las llantas en 14 de 25 (56 %).", false], ["C", "Los floreros no sirven como criaderos del mosquito.", "En 9 de los 30 floreros se encontraron larvas.", false], ["D", "Las llantas viejas tuvieron más recipientes con larvas, en total, que los tanques destapados.", "En total hubo 14 llantas con larvas, menos que los 18 tanques destapados.", false]]}, {"id": "CNB-239", "niv": 3, "cp": "cn_indagacion", "cn": "biologico", "e": "La tabla 6 muestra la lluvia mensual y los casos de dengue en el municipio. ¿Qué observación sugiere que los casos responden a la lluvia con cierto retraso?", "f": "Interpretación de datos epidemiológicos", "vis": "<table class=\"vt\"><caption>Tabla 6. Lluvia y casos de dengue por mes<\/caption><thead><tr><th>Mes<\/th><th>Lluvia (mm)<\/th><th>Casos de dengue<\/th><\/tr><\/thead><tbody><tr><td>Enero<\/td><td>40<\/td><td>12<\/td><\/tr><tr><td>Febrero<\/td><td>60<\/td><td>15<\/td><\/tr><tr><td>Marzo<\/td><td>150<\/td><td>30<\/td><\/tr><tr><td>Abril<\/td><td>220<\/td><td>58<\/td><\/tr><tr><td>Mayo<\/td><td>180<\/td><td>64<\/td><\/tr><tr><td>Junio<\/td><td>70<\/td><td>25<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Datos ficticios.<\/div>", "o": [["A", "En enero hubo más casos de dengue que en junio.", "En enero hubo 12 casos y en junio, 25.", false], ["B", "En mayo la lluvia disminuyó, pero los casos siguieron aumentando.", "La lluvia bajó de 220 a 180 mm, mientras los casos subieron de 58 a 64; el aumento de casos sigue a la lluvia con un desfase.", true], ["C", "En abril, la lluvia y los casos alcanzaron su valor máximo al mismo tiempo.", "Los casos alcanzaron su máximo en mayo (64), no en abril.", false], ["D", "En marzo los casos se redujeron a la mitad respecto a febrero.", "En marzo los casos se duplicaron (de 15 a 30).", false]]}]}, {"comp": "ciencias_naturales", "sim": "val-2", "ses": 1, "ind": "Generación hidroeléctrica", "tt": "", "texto": "Buena parte de la electricidad que se consume en Colombia se genera en centrales hidroeléctricas, construidas junto a embalses en zonas de montaña.", "vis": "", "items": [{"id": "CNB-240", "niv": 1, "cp": "cn_uso_comprensivo", "cn": "fisico", "e": "En una central hidroeléctrica, el agua de un embalse cae por tuberías y mueve turbinas conectadas a generadores. ¿Qué secuencia de transformaciones de energía ocurre?", "f": "Transformaciones de la energía", "vis": "", "o": [["A", "Química → térmica → eléctrica.", "Esa secuencia corresponde a una central termoeléctrica que quema combustibles.", false], ["B", "Eléctrica → cinética → potencial gravitacional.", "Es la secuencia inversa; la central produce electricidad, no la consume para subir el agua.", false], ["C", "Nuclear → térmica → eléctrica.", "Esa secuencia corresponde a una central nuclear.", false], ["D", "Potencial gravitacional → cinética → eléctrica.", "El agua almacenada en altura tiene energía potencial; al caer gana energía cinética, que las turbinas y generadores convierten en eléctrica.", true]]}]}, {"comp": "ciencias_naturales", "sim": "val-2", "ses": 1, "ind": "El periodo de un péndulo", "tt": "", "texto": "En una clase de física se colgaron masas de un hilo y se midió el periodo del péndulo (tiempo de una oscilación completa) con diferentes longitudes y masas, soltándolo siempre desde un ángulo pequeño.", "vis": "<table class=\"vt\"><caption>Tabla 7. Periodo del péndulo<\/caption><thead><tr><th>Ensayo<\/th><th>Longitud (m)<\/th><th>Masa (g)<\/th><th>Periodo (s)<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>0,25<\/td><td>50<\/td><td>1,0<\/td><\/tr><tr><td>2<\/td><td>0,25<\/td><td>100<\/td><td>1,0<\/td><\/tr><tr><td>3<\/td><td>1,00<\/td><td>50<\/td><td>2,0<\/td><\/tr><tr><td>4<\/td><td>1,00<\/td><td>100<\/td><td>2,0<\/td><\/tr><tr><td>5<\/td><td>0,50<\/td><td>50<\/td><td>1,4<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Datos redondeados.<\/div>", "items": [{"id": "CNB-243", "niv": 1, "cp": "cn_indagacion", "cn": "fisico", "e": "Según los ensayos 1 y 2, ¿qué se puede concluir?", "f": "Análisis de datos: péndulo simple", "vis": "", "o": [["A", "Al aumentar la longitud, el periodo disminuyó.", "En los ensayos 1 y 2 la longitud no cambió.", false], ["B", "Al duplicar la masa, el periodo se duplicó.", "El periodo fue de 1,0 s en los dos ensayos.", false], ["C", "Con la misma longitud, cambiar la masa no cambió el periodo.", "En ambos ensayos la longitud fue 0,25 m y el periodo fue 1,0 s, aunque la masa pasó de 50 g a 100 g.", true], ["D", "El periodo depende únicamente de la masa del péndulo.", "Los ensayos 1 y 2 muestran que la masa no cambió el periodo.", false]]}, {"id": "CNB-244", "niv": 2, "cp": "cn_indagacion", "cn": "fisico", "e": "¿Qué par de ensayos permite estudiar el efecto de la longitud sobre el periodo?", "f": "Diseño experimental: control de variables", "vis": "", "o": [["A", "Los ensayos 1 y 2.", "Tienen la misma longitud; solo cambia la masa.", false], ["B", "Los ensayos 1 y 3.", "Tienen la misma masa (50 g) y distinta longitud (0,25 m y 1,00 m); solo cambia la variable que se quiere estudiar.", true], ["C", "Los ensayos 2 y 3.", "Cambian a la vez la longitud y la masa, así que no se sabría cuál produjo el cambio.", false], ["D", "Los ensayos 3 y 4.", "Tienen la misma longitud; solo cambia la masa.", false]]}, {"id": "CNB-245", "niv": 2, "cp": "cn_indagacion", "cn": "fisico", "e": "Si se usara un hilo de 4,00 m con una masa de 50 g, ¿qué periodo se esperaría?", "f": "Predicción a partir de patrones", "vis": "", "o": [["A", "3,0 s.", "Suma 1 s al periodo de 1,00 m, pero el periodo no aumenta de forma constante con la longitud.", false], ["B", "4,0 s.", "En los datos, al cuadruplicar la longitud (de 0,25 m a 1,00 m) el periodo se duplica (de 1,0 s a 2,0 s); de 1,00 m a 4,00 m se duplica otra vez: 4,0 s.", true], ["C", "8,0 s.", "Supone que el periodo es proporcional a la longitud; los datos muestran que se duplica cuando la longitud se cuadruplica.", false], ["D", "16,0 s.", "Supone que el periodo crece con el cuadrado de la longitud (4² = 16); los datos muestran que crece mucho menos que la longitud.", false]]}]}, {"comp": "ciencias_naturales", "sim": "val-2", "ses": 1, "ind": "Oscurecimiento de la manzana cortada", "tt": "", "texto": "Cuando se corta una manzana, su pulpa se va poniendo de color marrón: es una reacción química en la que participan sustancias de la propia fruta. Para estudiarla, se pusieron tajadas iguales de una misma manzana en cuatro platos y se observaron durante una hora a temperatura ambiente. Plato 1: tajada sin tratar, dentro de una bolsa sellada al vacío (sin aire). Plato 2: tajada rociada con jugo de limón, al aire. Plato 3: tajada sin tratar, al aire. Plato 4: tajada sumergida 2 minutos en agua hirviendo y luego dejada al aire.", "vis": "<table class=\"vt\"><caption>Tabla 8. Aspecto de las tajadas después de una hora<\/caption><thead><tr><th>Plato<\/th><th>Condiciones<\/th><th>Resultado<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>Sin tratar, sin aire<\/td><td>Sin cambio de color<\/td><\/tr><tr><td>2<\/td><td>Con jugo de limón, al aire<\/td><td>Casi sin cambio de color<\/td><\/tr><tr><td>3<\/td><td>Sin tratar, al aire<\/td><td>Marrón<\/td><\/tr><tr><td>4<\/td><td>Hervida 2 minutos, al aire<\/td><td>Sin cambio de color<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Resultados de una práctica de laboratorio.<\/div>", "items": [{"id": "CNB-249", "niv": 2, "cp": "cn_indagacion", "cn": "quimico", "e": "¿Qué platos se deben comparar para saber si el contacto con el aire influye en que la manzana sin tratar se oscurezca?", "f": "Diseño experimental: comparación de condiciones", "vis": "", "o": [["A", "Los platos 1 y 3.", "Ambas tajadas están sin tratar; la única diferencia es que la del plato 3 estuvo al aire. Solo esa se oscureció.", true], ["B", "Los platos 1 y 2.", "Ninguna de las dos se oscureció de forma apreciable, y difieren en dos condiciones (aire y limón), así que su comparación no aísla el efecto del aire.", false], ["C", "Los platos 2 y 3.", "Las dos estuvieron al aire; lo que cambia es el jugo de limón.", false], ["D", "Los platos 3 y 4.", "Las dos estuvieron al aire; lo que cambia es el tratamiento con agua hirviendo.", false]]}, {"id": "CNB-250", "niv": 1, "cp": "cn_indagacion", "cn": "quimico", "e": "¿Qué conclusión se apoya en los resultados de la tabla?", "f": "Análisis de resultados: oscurecimiento de la fruta", "vis": "", "o": [["A", "Hervir la tajada fue necesario para que se oscureciera.", "La tajada del plato 3 se oscureció sin haber sido hervida.", false], ["B", "El jugo de limón acelera el oscurecimiento de la manzana.", "La tajada con jugo de limón (plato 2) casi no se oscureció.", false], ["C", "La tajada sin tratar se oscurece aunque no tenga contacto con el aire.", "En el plato 1, sin aire, la tajada no se oscureció.", false], ["D", "La tajada sin tratar se oscureció al aire, pero no sin aire.", "De las dos tajadas sin tratar, solo la que estuvo al aire (plato 3) se oscureció; la del plato 1, sin aire, no cambió.", true]]}, {"id": "CNB-251", "niv": 2, "cp": "cn_indagacion", "cn": "quimico", "e": "En un puesto de ensalada de frutas, la vendedora rocía la manzana picada con jugo de limón y dice que así se ve fresca más tiempo. ¿Es coherente su afirmación con los resultados?", "f": "Aplicación de resultados experimentales", "vis": "", "o": [["A", "Sí, porque en el experimento la tajada con jugo de limón casi no se oscureció.", "Con el mismo tiempo al aire, la tajada con limón cambió muy poco y la del plato 3 se oscureció; el limón retrasó la reacción.", true], ["B", "Sí, porque el jugo de limón elimina todo el oxígeno del aire que rodea la fruta.", "El limón no retira el oxígeno del aire; el experimento solo muestra que la tajada con limón casi no se oscureció.", false], ["C", "No, porque en el experimento el jugo de limón aumentó el oscurecimiento.", "La tajada con limón (plato 2) casi no se oscureció, a diferencia de la del plato 3.", false], ["D", "No, porque el experimento demostró que el aire no influye en el oscurecimiento.", "El experimento mostró lo contrario: sin aire (plato 1) la tajada sin tratar no se oscureció.", false]]}]}, {"comp": "matematicas", "sim": "val-2", "ses": 2, "ind": "Rendimiento de combustible de un camión", "tt": "", "texto": "El conductor de un camión de carga registró la distancia recorrida y el combustible gastado en cuatro rutas.", "vis": "<table class=\"vt\"><caption>Tabla 9. Distancia y combustible por ruta<\/caption><thead><tr><th>Ruta<\/th><th>Distancia (km)<\/th><th>Combustible (galones)<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>150<\/td><td>12<\/td><\/tr><tr><td>2<\/td><td>240<\/td><td>20<\/td><\/tr><tr><td>3<\/td><td>90<\/td><td>6<\/td><\/tr><tr><td>4<\/td><td>300<\/td><td>24<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Datos ficticios.<\/div>", "items": [{"id": "MTB-204", "niv": 1, "cp": "mt_interpretacion", "cn": "", "e": "¿En cuál ruta el camión recorrió más kilómetros por cada galón de combustible?", "f": "Cálculo propio", "vis": "", "o": [["A", "Ruta 1.", "En la ruta 1 el rendimiento fue de 150 ÷ 12 = 12,5 km por galón.", false], ["B", "Ruta 2.", "En la ruta 2 gastó más combustible, pero su rendimiento fue de 240 ÷ 20 = 12 km por galón, el menor.", false], ["C", "Ruta 3.", "En la ruta 3 el rendimiento fue de 90 ÷ 6 = 15 km por galón, el mayor de las cuatro rutas.", true], ["D", "Ruta 4.", "En la ruta 4 recorrió más kilómetros, pero su rendimiento fue de 300 ÷ 24 = 12,5 km por galón.", false]]}, {"id": "MTB-205", "niv": 2, "cp": "mt_formulacion", "cn": "", "e": "Si el galón de combustible cuesta $ 16.000, ¿cuánto gastó el conductor en combustible en las cuatro rutas?", "f": "Cálculo propio", "vis": "", "o": [["A", "$ 384.000.", "Es solo el costo de la ruta 4 (24 galones).", false], ["B", "$ 896.000.", "Omite los 6 galones de la ruta 3: usa 56 galones en lugar de 62.", false], ["C", "$ 992.000.", "En total gastó 12 + 20 + 6 + 24 = 62 galones; 62 × $ 16.000 = $ 992.000.", true], ["D", "$ 12.480.000.", "Multiplica los kilómetros (780) por el precio del galón, en lugar de los galones.", false]]}, {"id": "MTB-206", "niv": 3, "cp": "mt_argumentacion", "cn": "", "e": "El conductor afirma: «En las cuatro rutas juntas, el camión rindió 13 km por galón, porque ese es el promedio de los rendimientos de las rutas». ¿Es correcta la afirmación?", "f": "Cálculo propio", "vis": "", "o": [["A", "No, porque el rendimiento total se obtiene dividiendo el combustible total entre la distancia total.", "Ese cociente da galones por kilómetro, no kilómetros por galón.", false], ["B", "Sí, porque 13 está entre el menor y el mayor de los rendimientos de las rutas.", "Estar entre el mínimo y el máximo no prueba que sea el rendimiento total.", false], ["C", "Sí, porque el promedio de los rendimientos de las cuatro rutas es 13 km/gal.", "El promedio de los rendimientos es 13, pero no es el rendimiento total, porque las rutas tienen distancias distintas.", false], ["D", "No, porque el rendimiento total es la distancia total entre el combustible total: ≈ 12,6 km/gal.", "El promedio simple de los rendimientos da el mismo peso a una ruta corta que a una larga; el rendimiento real es el cociente de los totales.", true]]}]}, {"comp": "matematicas", "sim": "val-2", "ses": 2, "ind": "Prueba de esfuerzo", "tt": "", "texto": "Un médico deportólogo registró la frecuencia cardíaca de un paciente de 45 años, en latidos por minuto, durante una prueba de esfuerzo de 30 minutos en una bicicleta estática.", "vis": "<div class=\"vfig\"><svg class=\"vg\" viewBox=\"0 0 560 320\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Gráfica 5. Frecuencia cardíaca durante la prueba\" font-family=\"Arial, sans-serif\" font-size=\"12\"><rect width=\"560\" height=\"320\" fill=\"#ffffff\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"13\" fill=\"#1d2433\">Gráfica 5. Frecuencia cardíaca durante la prueba<\/text><line x1=\"60\" y1=\"258.0\" x2=\"540\" y2=\"258.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"262.0\" text-anchor=\"end\" fill=\"#3a4356\">0<\/text><line x1=\"60\" y1=\"221.0\" x2=\"540\" y2=\"221.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"225.0\" text-anchor=\"end\" fill=\"#3a4356\">25<\/text><line x1=\"60\" y1=\"184.0\" x2=\"540\" y2=\"184.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"188.0\" text-anchor=\"end\" fill=\"#3a4356\">50<\/text><line x1=\"60\" y1=\"147.0\" x2=\"540\" y2=\"147.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"151.0\" text-anchor=\"end\" fill=\"#3a4356\">75<\/text><line x1=\"60\" y1=\"110.0\" x2=\"540\" y2=\"110.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"114.0\" text-anchor=\"end\" fill=\"#3a4356\">100<\/text><line x1=\"60\" y1=\"73.0\" x2=\"540\" y2=\"73.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"77.0\" text-anchor=\"end\" fill=\"#3a4356\">125<\/text><line x1=\"60\" y1=\"36.0\" x2=\"540\" y2=\"36.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"40.0\" text-anchor=\"end\" fill=\"#3a4356\">150<\/text><line x1=\"60\" y1=\"258\" x2=\"540\" y2=\"258\" stroke=\"#3a4356\"/><line x1=\"60\" y1=\"258\" x2=\"60\" y2=\"36\" stroke=\"#3a4356\"/><text transform=\"translate(14,147.0) rotate(-90)\" text-anchor=\"middle\" fill=\"#3a4356\">Latidos por minuto<\/text><text x=\"300.0\" y=\"312\" text-anchor=\"middle\" fill=\"#3a4356\">Tiempo (minutos)<\/text><text x=\"94.3\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">0<\/text><text x=\"162.9\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">5<\/text><text x=\"231.4\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">10<\/text><text x=\"300.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">15<\/text><text x=\"368.6\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">20<\/text><text x=\"437.1\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">25<\/text><text x=\"505.7\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">30<\/text><polyline fill=\"none\" stroke=\"#1660a8\" stroke-width=\"2.5\" points=\"94.3,151.4 162.9,95.2 231.4,58.2 300.0,50.8 368.6,53.8 437.1,104.1 505.7,139.6\"/><circle cx=\"94.3\" cy=\"151.4\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"94.3\" y=\"143.4\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">72<\/text><circle cx=\"162.9\" cy=\"95.2\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"162.9\" y=\"87.2\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">110<\/text><circle cx=\"231.4\" cy=\"58.2\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"231.4\" y=\"50.2\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">135<\/text><circle cx=\"300.0\" cy=\"50.8\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"300.0\" y=\"42.8\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">140<\/text><circle cx=\"368.6\" cy=\"53.8\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"368.6\" y=\"45.8\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">138<\/text><circle cx=\"437.1\" cy=\"104.1\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"437.1\" y=\"96.1\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">104<\/text><circle cx=\"505.7\" cy=\"139.6\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"505.7\" y=\"131.6\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">80<\/text><\/svg><\/div>", "items": [{"id": "MTB-207", "niv": 1, "cp": "mt_interpretacion", "cn": "", "e": "¿En qué intervalo de 5 minutos la frecuencia cardíaca aumentó más?", "f": "Cálculo propio", "vis": "", "o": [["A", "Entre el minuto 0 y el minuto 5.", "Pasó de 72 a 110 latidos por minuto: un aumento de 38, el mayor d
