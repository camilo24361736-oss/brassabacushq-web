 "ind": "Comportamiento de los gases", "tt": "", "texto": "Los gases cambian su volumen cuando cambian la presión o la temperatura. En las siguientes situaciones el aire se comporta aproximadamente como un gas ideal.", "vis": "", "items": [{"id": "CNC-151", "niv": 2, "cp": "cn_uso_comprensivo", "cn": "quimico", "e": "Una jeringa sellada contiene 40 mL de aire a 1 atm. Se empuja el émbolo lentamente, a temperatura constante, hasta que el aire ocupa 10 mL. ¿Cuál es la nueva presión del aire?", "f": "Ley de Boyle.", "vis": "", "o": [["A", "0,25 atm.", "Incorrecta. Supone que la presión disminuye al disminuir el volumen; a temperatura constante ocurre lo contrario.", false], ["B", "1 atm.", "Incorrecta. Supone que la presión no cambia, pero al reducir el volumen de un gas a temperatura constante su presión aumenta.", false], ["C", "4 atm.", "Correcta. Ley de Boyle: P₁·V₁ = P₂·V₂; 1 atm × 40 mL = P₂ × 10 mL, así que P₂ = 4 atm.", true], ["D", "30 atm.", "Incorrecta. Resta los volúmenes (40 − 10) en lugar de usar la relación inversa entre presión y volumen.", false]]}, {"id": "CNC-152", "niv": 1, "cp": "cn_explicacion", "cn": "quimico", "e": "Un globo inflado se guarda en el congelador y, una hora después, se ve más pequeño, aunque no tiene ningún escape. ¿Qué explica el cambio?", "f": "Ley de Charles; modelo cinético de los gases.", "vis": "", "o": [["A", "El aire se escapa lentamente por los poros del globo, pero únicamente cuando la temperatura del ambiente es muy baja.", "Incorrecta. El texto indica que el globo no tiene escapes; además, si al sacarlo se calienta, recupera su tamaño.", false], ["B", "Cada molécula de aire se encoge al enfriarse y por eso ocupa menos espacio.", "Incorrecta. El tamaño de las moléculas no cambia; lo que disminuye es su movimiento y el espacio entre ellas.", false], ["C", "El frío destruye parte de las moléculas de aire que hay dentro del globo.", "Incorrecta. Las moléculas no se destruyen por enfriamiento; la cantidad de gas dentro del globo es la misma.", false], ["D", "Al enfriarse, el gas reduce su volumen a presión casi constante, porque sus partículas se mueven más lento.", "Correcta. Según la ley de Charles, a presión constante el volumen de un gas es proporcional a su temperatura absoluta; al enfriarse, el volumen se reduce.", true]]}]}, {"comp": "ciencias_naturales", "sim": "s11-3", "ses": 2, "ind": "Transporte y emisiones de dióxido de carbono", "tt": "", "texto": "Una ciudad ficticia publicó la tabla 21 con las emisiones promedio de CO₂ por pasajero en cada kilómetro recorrido, según el medio de transporte. Los valores incluyen solo las emisiones del combustible usado durante el viaje.", "vis": "<table class=\"vt\"><caption>Tabla 21. Emisiones de CO₂ por pasajero y por kilómetro<\/caption><thead><tr><th>Medio de transporte<\/th><th>Emisiones (g de CO₂ por pasajero-km)<\/th><\/tr><\/thead><tbody><tr><td>Automóvil particular con 1 ocupante<\/td><td>150<\/td><\/tr><tr><td>Motocicleta con 1 ocupante<\/td><td>90<\/td><\/tr><tr><td>Bus urbano lleno<\/td><td>30<\/td><\/tr><tr><td>Bicicleta<\/td><td>0<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Fuente: datos ficticios.<\/div>", "items": [{"id": "CNC-156", "niv": 2, "cp": "cn_indagacion", "cn": "cts", "e": "Un trabajador recorre 20 km al día solo en su automóvil particular. Si durante una semana de 5 días hábiles hace ese mismo recorrido en bus urbano lleno, ¿cuánto CO₂ deja de emitir esa semana por su transporte, según la tabla?", "f": "Cálculo propio con los datos de la tabla 21.", "vis": "", "o": [["A", "3 kg.", "Incorrecta. Es lo que emitiría viajando en bus: 20 km × 5 días × 30 g = 3.000 g; no es lo que deja de emitir.", false], ["B", "12 kg.", "Correcta. Cada kilómetro ahorra 150 − 30 = 120 g; en la semana recorre 20 × 5 = 100 km, así que deja de emitir 100 × 120 = 12.000 g = 12 kg.", true], ["C", "15 kg.", "Incorrecta. Es lo que emitiría en automóvil durante la semana (100 km × 150 g = 15.000 g); falta restar lo que emite en bus.", false], ["D", "18 kg.", "Incorrecta. Suma las emisiones del automóvil y del bus (15 kg + 3 kg) en lugar de restarlas.", false]]}, {"id": "CNC-157", "niv": 3, "cp": "cn_indagacion", "cn": "cts", "e": "La alcaldía de esa ciudad promovió el uso de la bicicleta durante una semana. Al final, midió que la concentración de partículas contaminantes en una avenida fue 8 % menor que la de la semana anterior y concluyó que la medida reduce la contaminación de forma permanente. ¿Por qué esa conclusión no está justificada?", "f": "Evaluación de conclusiones: suficiencia de la evidencia.", "vis": "", "o": [["A", "Porque una sola semana de comparación no permite descartar otros factores, como la lluvia o el viento, ni saber si el efecto se mantiene.", "Correcta. Con una única comparación de corto plazo, la reducción podría deberse al clima u otros factores; además, no hay datos sobre lo que pasa después de esa semana.", true], ["B", "Porque la contaminación del aire en las ciudades no depende del número de vehículos que circulan, sino solo de la actividad de las fábricas cercanas.", "Incorrecta. Los vehículos con motor de combustión sí son una fuente importante de contaminantes urbanos.", false], ["C", "Porque una reducción del 8 % es demasiado pequeña para que pueda medirse con instrumentos.", "Incorrecta. El texto indica que la reducción sí se midió; el problema no es la sensibilidad del instrumento sino el diseño de la comparación.", false], ["D", "Porque debieron medir la concentración de oxígeno en el aire y no la de partículas contaminantes.", "Incorrecta. La concentración de partículas es una medida adecuada de contaminación del aire; el oxígeno no indica contaminación.", false]]}]}, {"comp": "ciencias_naturales", "sim": "s11-3", "ses": 2, "ind": "Deforestación y dióxido de carbono", "tt": "", "texto": "En algunas zonas se talan y queman bosques para abrir terrenos para potreros. Los científicos señalan que esta práctica contribuye al aumento del dióxido de carbono (CO₂) en la atmósfera.", "vis": "", "items": [{"id": "CNC-158", "niv": 1, "cp": "cn_explicacion", "cn": "cts", "e": "¿Por qué la tala y quema de bosques contribuye al aumento del CO₂ en la atmósfera?", "f": "Ciclo del carbono: deforestación y efecto invernadero.", "vis": "", "o": [["A", "Porque sin árboles el agua de los ríos libera de golpe todo el CO₂ que tenía disuelto.", "Incorrecta. La tala no hace que los ríos liberen todo su CO₂ disuelto; la explicación principal es la combustión y la menor fotosíntesis.", false], ["B", "Porque el oxígeno que liberan los bosques se convierte en CO₂ cuando llega a la atmósfera.", "Incorrecta. El oxígeno no se convierte por sí solo en CO₂; para formar CO₂ hace falta carbono, por ejemplo en una combustión.", false], ["C", "Porque los árboles talados dejan de liberar CO₂ en su respiración, y entonces ese gas se queda acumulado en el aire de la zona deforestada.", "Incorrecta. Si los árboles dejan de respirar liberan menos CO₂, no más; el razonamiento no explica el aumento.", false], ["D", "Porque al quemar la madera se libera como CO₂ el carbono almacenado, y quedan menos árboles que lo absorban por fotosíntesis.", "Correcta. La combustión de la biomasa libera CO₂ y, al desaparecer el bosque, disminuye la absorción de CO₂ mediante la fotosíntesis.", true]]}]}, {"comp": "ingles", "sim": "s11-3", "ses": 2, "ind": "Parte 1 · Vocabulario: lugares de la ciudad", "tt": "", "texto": "Read the descriptions of some words. What is the word for each description? Choose the correct word (A–G). There are more words than you need.\n\nA. bakery\nB. pharmacy\nC. museum\nD. post office\nE. stadium\nF. library\nG. bank", "vis": "", "items": [{"id": "EN1-135", "niv": 1, "cp": "en_p1", "cn": "", "e": "You can buy medicine here.", "f": "Vocabulario del campo semántico «Lugares de la ciudad» (redacción propia)", "vis": "", "o": [["A", "bakery", "«bakery» significa «panadería»: lugar donde se hace y se vende pan; no corresponde a «Aquí se pueden comprar medicamentos».", false], ["B", "pharmacy", "Correcta. «pharmacy» significa «farmacia / droguería»: lugar donde se venden medicamentos. La descripción dice: «Aquí se pueden comprar medicamentos».", true], ["C", "museum", "«museum» significa «museo»: lugar donde se exhiben objetos antiguos, obras de arte e historia; no corresponde a «Aquí se pueden comprar medicamentos».", false], ["D", "post office", "«post office» significa «oficina de correos»: lugar desde donde se envían cartas y paquetes; no corresponde a «Aquí se pueden comprar medicamentos».", false], ["E", "stadium", "«stadium» significa «estadio»: lugar donde se ven partidos y eventos deportivos; no corresponde a «Aquí se pueden comprar medicamentos».", false], ["F", "library", "«library» significa «biblioteca»: lugar donde se prestan libros y se estudia en silencio; no corresponde a «Aquí se pueden comprar medicamentos».", false], ["G", "bank", "«bank» significa «banco»: lugar donde se guarda y se retira dinero; no corresponde a «Aquí se pueden comprar medicamentos».", false]]}, {"id": "EN1-136", "niv": 1, "cp": "en_p1", "cn": "", "e": "People watch soccer games here.", "f": "Vocabulario del campo semántico «Lugares de la ciudad» (redacción propia)", "vis": "", "o": [["A", "bakery", "«bakery» significa «panadería»: lugar donde se hace y se vende pan; no corresponde a «Aquí la gente ve partidos de fútbol».", false], ["B", "pharmacy", "«pharmacy» significa «farmacia / droguería»: lugar donde se venden medicamentos; no corresponde a «Aquí la gente ve partidos de fútbol».", false], ["C", "museum", "«museum» significa «museo»: lugar donde se exhiben objetos antiguos, obras de arte e historia; no corresponde a «Aquí la gente ve partidos de fútbol».", false], ["D", "post office", "«post office» significa «oficina de correos»: lugar desde donde se envían cartas y paquetes; no corresponde a «Aquí la gente ve partidos de fútbol».", false], ["E", "stadium", "Correcta. «stadium» significa «estadio»: lugar donde se ven partidos y eventos deportivos. La descripción dice: «Aquí la gente ve partidos de fútbol».", true], ["F", "library", "«library» significa «biblioteca»: lugar donde se prestan libros y se estudia en silencio; no corresponde a «Aquí la gente ve partidos de fútbol».", false], ["G", "bank", "«bank» significa «banco»: lugar donde se guarda y se retira dinero; no corresponde a «Aquí la gente ve partidos de fútbol».", false]]}, {"id": "EN1-137", "niv": 2, "cp": "en_p1", "cn": "", "e": "You go here to see old objects, paintings and history exhibitions.", "f": "Vocabulario del campo semántico «Lugares de la ciudad» (redacción propia)", "vis": "", "o": [["A", "bakery", "«bakery» significa «panadería»: lugar donde se hace y se vende pan; no corresponde a «Se va aquí a ver objetos antiguos, pinturas y exposiciones de historia».", false], ["B", "pharmacy", "«pharmacy» significa «farmacia / droguería»: lugar donde se venden medicamentos; no corresponde a «Se va aquí a ver objetos antiguos, pinturas y exposiciones de historia».", false], ["C", "museum", "Correcta. «museum» significa «museo»: lugar donde se exhiben objetos antiguos, obras de arte e historia. La descripción dice: «Se va aquí a ver objetos antiguos, pinturas y exposiciones de historia».", true], ["D", "post office", "«post office» significa «oficina de correos»: lugar desde donde se envían cartas y paquetes; no corresponde a «Se va aquí a ver objetos antiguos, pinturas y exposiciones de historia».", false], ["E", "stadium", "«stadium» significa «estadio»: lugar donde se ven partidos y eventos deportivos; no corresponde a «Se va aquí a ver objetos antiguos, pinturas y exposiciones de historia».", false], ["F", "library", "«library» significa «biblioteca»: lugar donde se prestan libros y se estudia en silencio; no corresponde a «Se va aquí a ver objetos antiguos, pinturas y exposiciones de historia».", false], ["G", "bank", "«bank» significa «banco»: lugar donde se guarda y se retira dinero; no corresponde a «Se va aquí a ver objetos antiguos, pinturas y exposiciones de historia».", false]]}, {"id": "EN1-138", "niv": 2, "cp": "en_p1", "cn": "", "e": "You can borrow books here and study in silence.", "f": "Vocabulario del campo semántico «Lugares de la ciudad» (redacción propia)", "vis": "", "o": [["A", "bakery", "«bakery» significa «panadería»: lugar donde se hace y se vende pan; no corresponde a «Aquí se pueden pedir libros prestados y estudiar en silencio».", false], ["B", "pharmacy", "«pharmacy» significa «farmacia / droguería»: lugar donde se venden medicamentos; no corresponde a «Aquí se pueden pedir libros prestados y estudiar en silencio».", false], ["C", "museum", "«museum» significa «museo»: lugar donde se exhiben objetos antiguos, obras de arte e historia; no corresponde a «Aquí se pueden pedir libros prestados y estudiar en silencio».", false], ["D", "post office", "«post office» significa «oficina de correos»: lugar desde donde se envían cartas y paquetes; no corresponde a «Aquí se pueden pedir libros prestados y estudiar en silencio».", false], ["E", "stadium", "«stadium» significa «estadio»: lugar donde se ven partidos y eventos deportivos; no corresponde a «Aquí se pueden pedir libros prestados y estudiar en silencio».", false], ["F", "library", "Correcta. «library» significa «biblioteca»: lugar donde se prestan libros y se estudia en silencio. La descripción dice: «Aquí se pueden pedir libros prestados y estudiar en silencio».", true], ["G", "bank", "«bank» significa «banco»: lugar donde se guarda y se retira dinero; no corresponde a «Aquí se pueden pedir libros prestados y estudiar en silencio».", false]]}, {"id": "EN1-139", "niv": 3, "cp": "en_p1", "cn": "", "e": "You go here to send letters and packages.", "f": "Vocabulario del campo semántico «Lugares de la ciudad» (redacción propia)", "vis": "", "o": [["A", "bakery", "«bakery» significa «panadería»: lugar donde se hace y se vende pan; no corresponde a «Se va aquí a enviar cartas y paquetes».", false], ["B", "pharmacy", "«pharmacy» significa «farmacia / droguería»: lugar donde se venden medicamentos; no corresponde a «Se va aquí a enviar cartas y paquetes».", false], ["C", "museum", "«museum» significa «museo»: lugar donde se exhiben objetos antiguos, obras de arte e historia; no corresponde a «Se va aquí a enviar cartas y paquetes».", false], ["D", "post office", "Correcta. «post office» significa «oficina de correos»: lugar desde donde se envían cartas y paquetes. La descripción dice: «Se va aquí a enviar cartas y paquetes».", true], ["E", "stadium", "«stadium» significa «estadio»: lugar donde se ven partidos y eventos deportivos; no corresponde a «Se va aquí a enviar cartas y paquetes».", false], ["F", "library", "«library» significa «biblioteca»: lugar donde se prestan libros y se estudia en silencio; no corresponde a «Se va aquí a enviar cartas y paquetes».", false], ["G", "bank", "«bank» significa «banco»: lugar donde se guarda y se retira dinero; no corresponde a «Se va aquí a enviar cartas y paquetes».", false]]}]}, {"comp": "ingles", "sim": "s11-3", "ses": 2, "ind": "Parte 2 · Avisos y lugares", "tt": "", "texto": "Read the notices. Where can you see each one? Choose the correct place (A, B or C).", "vis": "", "items": [{"id": "EN1-140", "niv": 1, "cp": "en_p2", "cn": "", "e": "Notice: \"Today's special: fish soup and green salad.\"\n\nWhere can you see this notice?", "f": "Conocimiento pragmático: propósito y lugar del aviso (redacción propia)", "vis": "", "o": [["A", "in a sports equipment store", "En una tienda de artículos deportivos no se sirve comida.", false], ["B", "in a bookstore", "En una librería se venden libros, no platos del día.", false], ["C", "in a restaurant", "Correcta. El aviso dice: «Especial del día: sopa de pescado y ensalada verde». «Today's special» es el plato del día de un restaurante.", true]]}, {"id": "EN1-141", "niv": 2, "cp": "en_p2", "cn": "", "e": "Notice: \"Visiting hours: 2 p.m. to 6 p.m. Maximum two visitors per patient.\"\n\nWhere can you see this notice?", "f": "Conocimiento pragmático: propósito y lugar del aviso (redacción propia)", "vis": "", "o": [["A", "in a hospital", "Correcta. El aviso dice: «Horario de visitas: 2 p. m. a 6 p. m. Máximo dos visitantes por paciente». La palabra «patient» (paciente) indica que es un hospital.", true], ["B", "in a primary school", "En una escuela primaria hay estudiantes, no pacientes con visitantes.", false], ["C", "in a museum", "Un museo tiene horario de visitas, pero no pacientes.", false]]}, {"id": "EN1-142", "niv": 2, "cp": "en_p2", "cn": "", "e": "Notice: \"Please do not touch the paintings.\"\n\nWhere can you see this notice?", "f": "Conocimiento pragmático: propósito y lugar del aviso (redacción propia)", "vis": "", "o": [["A", "in a hardware store", "En una ferretería se vende pintura para paredes, no se exhiben cuadros (paintings).", false], ["B", "in an art gallery", "Correcta. El aviso dice: «Por favor no toque las pinturas (los cuadros)». «Paintings» son cuadros; en una galería de arte se pide no tocarlos.", true], ["C", "in a paint store", "Trampa léxica: una tienda de pinturas vende «paint» (pintura para paredes), no «paintings» (cuadros) exhibidos.", false]]}, {"id": "EN1-143", "niv": 2, "cp": "en_p2", "cn": "", "e": "Notice: \"Books must be returned within 15 days.\"\n\nWhere can you see this notice?", "f": "Conocimiento pragmático: propósito y lugar del aviso (redacción propia)", "vis": "", "o": [["A", "in a library", "Correcta. El aviso dice: «Los libros deben devolverse en un plazo de 15 días». Solo en una biblioteca se prestan libros que deben devolverse.", true], ["B", "in a bookstore", "En una librería los libros se compran, no se prestan.", false], ["C", "at a newsstand", "En un puesto de revistas se venden periódicos, no se prestan libros.", false]]}, {"id": "EN1-144", "niv": 2, "cp": "en_p2", "cn": "", "e": "Notice: \"Seat belts must be fastened while the vehicle is moving.\"\n\nWhere can you see this notice?", "f": "Conocimiento pragmático: propósito y lugar del aviso (redacción propia)", "vis": "", "o": [["A", "in a gas station store", "La tienda de una estación de servicio no se mueve ni tiene cinturones.", false], ["B", "on a bicycle", "Una bicicleta no tiene cinturones de seguridad.", false], ["C", "inside a taxi", "Correcta. El aviso dice: «Los cinturones de seguridad deben estar abrochados mientras el vehículo esté en movimiento». Un taxi es un vehículo con cinturones de seguridad (seat belts).", true]]}, {"id": "EN1-145", "niv": 3, "cp": "en_p2", "cn": "", "e": "Notice: \"Keep frozen. Once thawed, do not refreeze.\"\n\nWhere can you see this notice?", "f": "Conocimiento pragmático: propósito y lugar del aviso (redacción propia)", "vis": "", "o": [["A", "at an ice-skating rink", "Trampa léxica: en una pista de hielo hay hielo, pero «once thawed, do not refreeze» se refiere a un producto que se guarda.", false], ["B", "on a box of ice cream", "Correcta. El aviso dice: «Mantener congelado. Una vez descongelado, no volver a congelar». Las instrucciones de conservación (mantener congelado, no recongelar) van en el empaque de un alimento congelado como el helado.", true], ["C", "on the door of a kitchen oven", "Un horno calienta; no se congela ni se descongela.", false]]}]}, {"comp": "ingles", "sim": "s11-3", "ses": 2, "ind": "Parte 3 · Conversaciones breves", "tt": "", "texto": "Complete the conversations. Read what the first person says and choose the best answer (A, B or C).", "vis": "", "items": [{"id": "EN1-146", "niv": 1, "cp": "en_p3", "cn": "", "e": "\"Is this your backpack?\"", "f": "Conocimiento comunicativo: respuesta adecuada en una conversación breve (redacción propia)", "vis": "", "o": [["A", "Yes, I'm.", "Incorrecta: «I'm» no puede ir al final de una respuesta corta (se dice «Yes, I am»), y además no responde de quién es.", false], ["B", "Yes, it's me.", "«It's me» significa «soy yo»; identifica a una persona, no a un objeto.", false], ["C", "Yes, it's mine.", "Correcta. «Is this your backpack?» = «¿Esta es tu maleta (morral)?». Usa el pronombre posesivo correcto: «Sí, es mía».", true]]}, {"id": "EN1-147", "niv": 1, "cp": "en_p3", "cn": "", "e": "\"What's the weather like today?\"", "f": "Conocimiento comunicativo: respuesta adecuada en una conversación breve (redacción propia)", "vis": "", "o": [["A", "It's sunny and warm.", "Correcta. «What's the weather like today?» = «¿Cómo está el clima hoy?». Describe el clima: «Está soleado y cálido».", true], ["B", "It's Tuesday.", "Dice el día de la semana, no el clima.", false], ["C", "Yes, I like it very much.", "Malinterpreta «like»: en «What's… like?» se pide una descripción, no un gusto.", false]]}, {"id": "EN1-148", "niv": 2, "cp": "en_p3", "cn": "", "e": "\"Could you help me carry these boxes?\"", "f": "Conocimiento comunicativo: respuesta adecuada en una conversación breve (redacción propia)", "vis": "", "o": [["A", "Yes, I could carry them yesterday afternoon.", "«Could» aquí es una petición cortés, no la habilidad pasada; «ayer por la tarde» no tiene sentido.", false], ["B", "Of course. Where do you want them?", "Correcta. «Could you help me carry these boxes?» = «¿Me podrías ayudar a cargar estas cajas?». Acepta y pregunta dónde ponerlas: «Claro. ¿Dónde las quieres?».", true], ["C", "Yes, I carried.", "Pasado sin objeto («I carried them») y no acepta ayudar ahora.", false]]}, {"id": "EN1-149", "niv": 2, "cp": "en_p3", "cn": "", "e": "\"Why didn't you come to the party?\"", "f": "Conocimiento comunicativo: respuesta adecuada en una conversación breve (redacción propia)", "vis": "", "o": [["A", "Yes, it was great.", "«Sí, estuvo genial» no explica por qué no fue; una pregunta con «Why» no se responde con «Yes».", false], ["B", "Because I will be busy that night.", "Usa futuro («estaré ocupado esa noche») para explicar algo que ya pasó.", false], ["C", "I was sick in bed.", "Correcta. «Why didn't you come to the party?» = «¿Por qué no viniste a la fiesta?». Da una razón en pasado: «Estaba enfermo en cama».", true]]}, {"id": "EN1-150", "niv": 3, "cp": "en_p3", "cn": "", "e": "\"I think we should take a taxi.\"", "f": "Conocimiento comunicativo: respuesta adecuada en una conversación breve (redacción propia)", "vis": "", "o": [["A", "Yes, we should took.", "Incorrecta: después de «should» va el verbo en forma base («take»), no en pasado.", false], ["B", "But the bus is much cheaper.", "Correcta. «I think we should take a taxi.» = «Creo que deberíamos tomar un taxi.». Respuesta natural que presenta un contraargumento: «Pero el bus es mucho más barato».", true], ["C", "No, I don't take.", "Gramaticalmente incompleta («take» necesita objeto) y no responde a la sugerencia.", false]]}, {"id": "EN1-151", "niv": 3, "cp": "en_p3", "cn": "", "e": "\"Excuse me, is anyone sitting here?\"", "f": "Conocimiento comunicativo: respuesta adecuada en una conversación breve (redacción propia)", "vis": "", "o": [["A", "No, go ahead.", "Correcta. «Excuse me, is anyone sitting here?» = «Disculpa, ¿hay alguien sentado aquí?». «No (no hay nadie), siéntate»: responde y da permiso.", true], ["B", "No, I'm not.", "Responde sobre sí mismo («yo no estoy»), no sobre si alguien ocupa el puesto.", false], ["C", "Yes, please sit down.", "Contradictoria: «sí» significa que el puesto está ocupado, pero luego invita a sentarse.", false]]}]}, {"comp": "ingles", "sim": "s11-3", "ses": 2, "ind": "Diario: primer día de trabajo en una panadería", "tt": "", "texto": "Read the text and choose the word that best fills each numbered gap.\n\nMonday, June 3\n\nToday was my first day at Panadería La Espiga. I had to get up at four o'clock, which is much earlier (1) ______ I usually get up for school! When I arrived, Mrs. Ortega showed me how to make bread rolls. She works very (2) ______, and she never seems tired. At first my rolls were too big, but after an hour I (3) ______ able to make them the right size. At eleven o'clock we sold the last bag of rolls. Before I left, Mrs. Ortega said I (4) ______ done a good job. I'm exhausted now, so I'm going to bed. Tomorrow I (5) ______ to be back at the bakery at half past four.", "vis": "", "items": [{"id": "EN2-301", "niv": 1, "cp": "en_p4", "cn": "", "e": "Gap (1)", "f": "Gramática: comparativo + than", "vis": "", "o": [["A", "that", "«that» no introduce el segundo término de una comparación; es un error frecuente por parecido con «than».", false], ["B", "than", "Correcta: el comparativo «earlier» va seguido de «than» (que): «much earlier than I usually get up».", true], ["C", "then", "«then» significa «entonces/luego»; se confunde con «than» por la ortografía.", false]]}, {"id": "EN2-302", "niv": 2, "cp": "en_p4", "cn": "", "e": "Gap (2)", "f": "Gramática: adjetivo frente a adverbio", "vis": "", "o": [["A", "quickly", "Correcta: para modificar el verbo «works» se necesita un adverbio: «works very quickly» (trabaja muy rápido).", true], ["B", "quicker", "«quicker» es comparativo y no se usa con «very» ni sin un término de comparación.", false], ["C", "quick", "«quick» es adjetivo; describe sustantivos (a quick worker), no el verbo «works».", false]]}, {"id": "EN2-303", "niv": 2, "cp": "en_p4", "cn": "", "e": "Gap (3)", "f": "Gramática: was/were able to", "vis": "", "o": [["A", "were", "«were» se usa con you, we, they; con «I» el pasado de «be» es «was».", false], ["B", "did", "«did» no forma la expresión «be able to»; «did able» no es gramatical.", false], ["C", "was", "Correcta: «be able to» en pasado con «I»: «I was able to make them» (pude hacerlos).", true]]}, {"id": "EN2-304", "niv": 3, "cp": "en_p4", "cn": "", "e": "Gap (4)", "f": "Gramática: estilo indirecto (said + past perfect)", "vis": "", "o": [["A", "did", "«did» es auxiliar del pasado simple y va con la forma base (did do); «did done» no es gramatical.", false], ["B", "has", "«has» no concuerda con el sujeto «I» (sería «I have»); además, el relato en pasado con «said» pide «had».", false], ["C", "had", "Correcta: en estilo indirecto con «said», el presente perfecto pasa a pasado perfecto: «she said I had done a good job» (dijo que yo había hecho un buen trabajo).", true]]}, {"id": "EN2-305", "niv": 1, "cp": "en_p4", "cn": "", "e": "Gap (5)", "f": "Gramática: have to (obligación)", "vis": "", "o": [["A", "has", "«has» es para tercera persona del singular (he, she, it), no para «I».", false], ["B", "have", "Correcta: «have to» expresa obligación; con «I» en presente: «Tomorrow I have to be back» (mañana tengo que volver).", true], ["C", "having", "«having» es una forma -ing; «I having to be back» carece de verbo conjugado.", false]]}]}, {"comp": "ingles", "sim": "s11-3", "ses": 2, "ind": "Texto informativo: festival de cometas", "tt": "", "texto": "Read the text and choose the word that best fills each numbered gap.\n\nThe Kite Festival\n\nEvery August, the small town of El Carmen celebrates its Kite Festival. The festival began in 1998, when a group of farmers decided to compete to see whose kite could fly (1) ______ highest. Nowadays, kites (2) ______ by children and adults from all over the region, and some of them are as big as a car. The most popular event is the night flight, (3) ______ starts at eight o'clock, when kites with small lights fly over the main square. Visitors who want to take part (4) ______ register before 10 a.m. on the first day. The festival is free, (5) ______ visitors have to pay for food and parking.", "vis": "", "items": [{"id": "EN2-306", "niv": 2, "cp": "en_p4", "cn": "", "e": "Gap (1)", "f": "Gramática: superlativo con the", "vis": "", "o": [["A", "the", "Correcta: el superlativo lleva artículo definido: «fly the highest» (volar más alto que todas).", true], ["B", "a", "El superlativo no se usa con artículo indefinido: «a highest» no es correcto.", false], ["C", "most", "«highest» ya es superlativo; «most highest» es un doble superlativo incorrecto.", false]]}, {"id": "EN2-307", "niv": 3, "cp": "en_p4", "cn": "", "e": "Gap (2)", "f": "Gramática: voz pasiva en presente simple", "vis": "", "o": [["A", "make", "En voz activa diría que las cometas fabrican algo; con «by children» se necesita la pasiva.", false], ["B", "are made", "Correcta: las cometas reciben la acción y aparece el agente con «by»: voz pasiva en presente, «kites are made by children and adults» (son hechas por).", true], ["C", "are making", "«are making» es presente continuo activo: significaría que las cometas están fabricando algo, lo cual no tiene sentido con «by».", false]]}, {"id": "EN2-308", "niv": 3, "cp": "en_p4", "cn": "", "e": "Gap (3)", "f": "Gramática: pronombres relativos (which, where, what)", "vis": "", "o": [["A", "where", "«where» es adverbio relativo de lugar y no puede ser sujeto del verbo «starts»; la cláusula quedaría sin sujeto.", false], ["B", "what", "«what» no se usa como relativo después de un antecedente (the night flight); equivale a «lo que» y aquí no es gramatical.", false], ["C", "which", "Correcta: «which» es el relativo para cosas o eventos y aquí funciona como sujeto de «starts»: «the night flight, which starts at eight o'clock» (el vuelo nocturno, que empieza a las ocho).", true]]}, {"id": "EN2-309", "niv": 2, "cp": "en_p4", "cn": "", "e": "Gap (4)", "f": "Gramática: must frente a have to", "vis": "", "o": [["A", "must", "Correcta: «must» + verbo base expresa obligación: «Visitors ... must register» (deben inscribirse).", true], ["B", "has", "«has» no concuerda con el sujeto plural «Visitors» y, además, para obligación necesitaría «to» (have to register).", false], ["C", "have", "«have» con sentido de obligación exige «to»: «have to register»; «have register» no es correcto.", false]]}, {"id": "EN2-310", "niv": 1, "cp": "en_p4", "cn": "", "e": "Gap (5)", "f": "Gramática: conectores (but, so, because)", "vis": "", "o": [["A", "because", "«because» (porque) presentaría el pago de comida como causa de que el festival sea gratis, lo cual es ilógico.", false], ["B", "so", "«so» (así que) indicaría consecuencia: que sea gratis no causa que haya que pagar.", false], ["C", "but", "Correcta: «but» (pero) marca el contraste entre «free» (gratis) y tener que pagar comida y parqueadero.", true]]}]}, {"comp": "ingles", "sim": "s11-3", "ses": 2, "ind": "Perfil: entrenadora de perros guía", "tt": "", "texto": "Read the text and answer the questions.\n\nTraining eyes with four legs\n\nMarta Liliana Gómez has trained guide dogs for blind people for fifteen years. She works at a training center in Medellín, where the dogs arrive when they are about two months old.\n\nDuring their first year, the puppies do not live at the center. Instead, they stay with volunteer families who teach them basic things, like walking calmly on a leash and staying quiet in shops and on buses. \"The families are essential,\" Marta says. \"A dog that has never been on a bus will be afraid of one later.\"\n\nWhen the dogs return to the center, Marta trains them for about six more months. They learn to stop at every street corner, to avoid obstacles and even to disobey an order if it is dangerous. For example, if their owner says \"Forward!\" but a car is coming, the dog must not move.\n\nNot all dogs finish the training. Some are too nervous or too easily distracted. These dogs are not sent away, though: many of them are adopted by the volunteer families who raised them.\n\nMarta's favorite part of the job is the day a dog meets its new owner. \"They spend two weeks training together here,\" she explains. \"On the last day, I watch them walk out of the door as a team.\"", "vis": "", "items": [{"id": "EN2-311", "niv": 1, "cp": "en_p5", "cn": "", "e": "Where do the puppies live during their first year?", "f": "Párrafo 2", "vis": "", "o": [["A", "With families who look after them as volunteers.", "Correcta: párrafo 2, «they stay with volunteer families» (se quedan con familias voluntarias).", true], ["B", "With the blind people who will become their owners later.", "Los futuros dueños los conocen al final del entrenamiento, no el primer año.", false], ["C", "At the training center in Medellín.", "El párrafo 2 dice que durante el primer año «do not live at the center».", false]]}, {"id": "EN2-312", "niv": 2, "cp": "en_p5", "cn": "", "e": "Why does Marta say the families are important?", "f": "Párrafo 2", "vis": "", "o": [["A", "They pay for all the costs of the dog's food and training.", "El texto no menciona que las familias paguen nada.", false], ["B", "Young dogs need to get used to places such as buses.", "Correcta: Marta explica que un perro que nunca ha estado en un bus le tendrá miedo después; las familias los acostumbran desde pequeños.", true], ["C", "They choose the dog's future owner.", "No se dice que las familias elijan al dueño.", false]]}, {"id": "EN2-313", "niv": 2, "cp": "en_p5", "cn": "", "e": "What may a trained dog do if there is danger?", "f": "Párrafo 3", "vis": "", "o": [["A", "Refuse to follow its owner's instruction.", "Correcta: párrafo 3, aprenden «to disobey an order if it is dangerous» (a desobedecer una orden peligrosa).", true], ["B", "Take its owner back home at once.", "No se habla de volver a casa; el ejemplo es quedarse quieto si viene un carro.", false], ["C", "Bark loudly to warn the people who are around it.", "El texto no menciona ladrar; dice que el perro no debe moverse.", false]]}, {"id": "EN2-314", "niv": 3, "cp": "en_p5", "cn": "", "e": "What happens to dogs that do not finish the training?", "f": "Párrafo 4", "vis": "", "o": [["A", "They start the whole training again at the center the next year.", "El texto no dice que repitan el entrenamiento.", false], ["B", "Many go to live with the families that raised them.", "Correcta: párrafo 4, «many of them are adopted by the volunteer families who raised them».", true], ["C", "They are sent to another training center.", "El texto dice justamente que «are not sent away» (no los mandan a otra parte).", false]]}, {"id": "EN2-315", "niv": 2, "cp": "en_p5", "cn": "", "e": "How long does a dog train with its new owner?", "f": "Párrafo 5", "vis": "", "o": [["A", "Six months.", "Seis meses es el entrenamiento del perro con Marta en el centro, antes de conocer al dueño.", false], ["B", "One year.", "Un año es el tiempo que el cachorro pasa con la familia voluntaria.", false], ["C", "Two weeks.", "Correcta: párrafo 5, «They spend two weeks training together here» (pasan dos semanas entrenando juntos).", true]]}]}, {"comp": "ingles", "sim": "s11-3", "ses": 2, "ind": "Crónica: emisora escolar", "tt": "", "texto": "Read the text and answer the questions.\n\nOn air before the bell\n\nAt Institución Educativa La Esperanza, students do not need to wait for the break to hear music. Since 2022, the school has had its own radio station, \"Onda Esperanza\", which broadcasts for twenty minutes every morning before classes begin and again during the long break.\n\nThe station is run by a team of fourteen students from grades 9 to 11. Some of them write the news, others interview teachers and visitors, and two students are in charge of the sound equipment. The team meets every Wednesday afternoon to plan the programs for the following week.\n\nThe idea came from Julián Mesa, a former student who now studies journalism at university. \"At first we only had an old microphone and a borrowed computer,\" he remembers. In 2023 the station won a prize in a regional competition for school media, and the school used the money to buy better speakers for the playground.\n\nThe team's most successful program is \"Voices from Home\", in which students' grandparents tell stories about how the town was when they were young. According to the school's coordinator, many students now ask their grandparents questions they had never asked before.", "vis": "", "items": [{"id": "EN2-316", "niv": 1, "cp": "en_p5", "cn": "", "e": "When does the radio station broadcast?", "f": "Párrafo 1", "vis": "", "o": [["A", "Only on Wednesday afternoons.", "El miércoles en la tarde el equipo se reúne a planear; no es cuando transmite.", false], ["B", "Before lessons start and in the long break.", "Correcta: párrafo 1, transmite «every morning before classes begin and again during the long break».", true], ["C", "During the last class of the day, before students go home.", "El texto no menciona la última clase del día.", false]]}, {"id": "EN2-317", "niv": 1, "cp": "en_p5", "cn": "", "e": "What do two of the students in the team do?", "f": "Párrafo 2", "vis": "", "o": [["A", "They interview the teachers.", "Entrevistar lo hacen «others», sin indicar que sean dos.", false], ["B", "They plan every program alone.", "La planeación la hace todo el equipo los miércoles.", false], ["C", "They look after the sound equipment.", "Correcta: párrafo 2, «two students are in charge of the sound equipment» (están a cargo del equipo de sonido).", true]]}, {"id": "EN2-318", "niv": 2, "cp": "en_p5", "cn": "", "e": "Who had the idea of starting the station?", "f": "Párrafo 3", "vis": "", "o": [["A", "Someone who used to study at the school.", "Correcta: párrafo 3, la idea fue de Julián Mesa, «a former student» (un exalumno).", true], ["B", "A journalism teacher at the school.", "Julián estudia periodismo en la universidad; no es profesor del colegio.", false], ["C", "The school's coordinator, who works with the team.", "El coordinador solo opina sobre el programa «Voices from Home».", false]]}, {"id": "EN2-319", "niv": 2, "cp": "en_p5", "cn": "", "e": "What did the school do with the prize money?", "f": "Párrafo 3", "vis": "", "o": [["A", "It bought a new microphone and computer.", "El micrófono viejo y el computador prestado describen el comienzo; el premio se usó en parlantes.", false], ["B", "It paid for a trip to a regional competition.", "La competencia regional es donde ganaron el premio, no en lo que gastaron el dinero.", false], ["C", "It improved the speakers in the playground.", "Correcta: párrafo 3, «used the money to buy better speakers for the playground».", true]]}, {"id": "EN2-320", "niv": 3, "cp": "en_p5", "cn": "", "e": "According to the coordinator, what effect has \"Voices from Home\" had?", "f": "Párrafo 4", "vis": "", "o": [["A", "Grandparents now visit the school to speak every week.", "El texto no dice que los abuelos visiten el colegio semanalmente.", false], ["B", "Students ask their grandparents new questions.", "Correcta: párrafo 4, muchos estudiantes ahora hacen a sus abuelos preguntas que nunca les habían hecho.", true], ["C", "Students have written a book about the town.", "No se menciona ningún libro sobre el pueblo.", false]]}]}, {"comp": "ingles", "sim": "s11-3", "ses": 2, "ind": "Columna de opinión: turismo en un pueblo costero (ficticio)", "tt": "", "texto": "Read the text and answer the questions. Choose the correct answer (A, B, C or D).\n\nWho is this growth for?\n\nWhen I was a child, Puerto Claro was a fishing village of about two thousand people. Everybody knew everybody, and the only hotel had eight rooms and a parrot that greeted the guests every morning. Then, about ten years ago, a travel magazine called our beach \"the best-kept secret of the Caribbean\". It is not a secret anymore.\n\nTourism has brought real benefits, and it would be dishonest to deny them. My sister, who used to sell fish at the market, now runs a small restaurant with six employees. The road to the city was finally paved. Young people who once had to leave to find work can now stay.\n\nBut something has also been lost. Rents near the beach have tripled, and many families who lived there for generations have moved to the hills, where there is still no regular water service. During the high season, the beach is so crowded that fishermen have trouble pulling their boats onto the sand. And the parrot? The old hotel was sold to a company from the capital and replaced by a building with ninety rooms. Nobody knows what happened to the parrot.\n\nI do not want tourists to stop coming. I simply want the town council to ask a question it has avoided for ten years: who is this growth really for? Before approving more hotels, the council should guarantee water for the hills and reserve part of the beach for the people who have worked on it all their lives.", "vis": "", "items": [{"id": "EN3-137", "niv": 2, "cp": "en_p6", "cn": "", "e": "What is the writer's attitude toward tourism in Puerto Claro?", "f": "Inferencia de actitud: párrafos 2 a 4", "vis": "", "o": [["A", "It has helped the town in some ways but harmed many residents.", "Correcta. El autor reconoce beneficios («it would be dishonest to deny them») y luego enumera pérdidas («something has also been lost»): actitud equilibrada y crítica.", true], ["B", "It has solved all of the town's main problems.", "Ignora el tercer párrafo: alquileres triplicados, familias sin agua y pescadores sin espacio.", false], ["C", "It is completely negative, and the town should close its doors to visitors.", "El autor dice «I do not want tourists to stop coming» (no quiero que los turistas dejen de venir).", false], ["D", "It has not really changed life in the town.", "Todo el texto describe cambios profundos, positivos y negativos.", false]]}, {"id": "EN3-138", "niv": 2, "cp": "en_p6", "cn": "", "e": "What is the main purpose of the last paragraph?", "f": "Inferencia del propósito: párrafo 4", "vis": "", "o": [["A", "to criticize the travel magazine for its article", "La revista aparece en el primer párrafo; el último se dirige al concejo municipal.", false], ["B", "to explain why the old hotel was sold to a company", "La venta del hotel está en el tercer párrafo y no se explica su causa.", false], ["C", "to invite tourists to visit the hills instead of the beach", "Las colinas se mencionan por la falta de agua de las familias, no como destino turístico.", false], ["D", "to ask the local authorities to plan growth with local needs in mind", "Correcta. Pide al concejo preguntarse para quién es el crecimiento y, antes de aprobar hoteles, garantizar agua y reservar playa para la gente local.", true]]}, {"id": "EN3-139", "niv": 3, "cp": "en_p6", "cn": "", "e": "Why does the writer mention the parrot?", "f": "Inferencia de la función de un detalle: párrafos 1 y 3", "vis": "", "o": [["A", "to show, in a personal way, how the old town has disappeared", "Correcta. El loro del hotel de ocho habitaciones simboliza el pueblo de la infancia; al final nadie sabe qué pasó con él, igual que con ese pueblo, en el párrafo sobre lo que se perdió.", true], ["B", "to show that tourists are cruel to animals", "El texto no dice nada sobre el trato de los turistas a los animales.", false], ["C", "to suggest that the hotel company stole the bird", "«Nobody knows what happened to the parrot»: no se acusa a nadie de robarlo.", false], ["D", "to prove that the old hotel was better organized than the new one", "No se compara la organización de los hoteles; el loro no prueba eso.", false]]}, {"id": "EN3-140", "niv": 1, "cp": "en_p6", "cn": "", "e": "Why does the writer mention his or her sister?", "f": "Inferencia de la función de un ejemplo: párrafo 2", "vis": "", "o": [["A", "to complain that fishing is no longer possible", "La hermana cambió de actividad por una oportunidad; el problema de los pescadores es otro tema.", false], ["B", "to give an example of how tourism has helped some local people", "Correcta. Está en el párrafo de los beneficios: antes vendía pescado y ahora tiene un restaurante con seis empleados.", true], ["C", "to show that many local businesses have closed", "Ocurre lo contrario: la hermana abrió un negocio.", false], ["D", "to explain why rents near the beach have tripled during the last ten years", "El texto no relaciona el restaurante con el alza de los alquileres.", false]]}, {"id": "EN3-141", "niv": 3, "cp": "en_p6", "cn": "", "e": "In the phrase \"a question it has avoided for ten years\", the writer suggests that the town council", "f": "Inferencia de sentido implícito: párrafo 4", "vis": "", "o": [["A", "was created ten years ago.", "Los diez años se refieren al tiempo desde el artículo de la revista, no a la creación del concejo.", false], ["B", "does not know how many tourists visit the town.", "La pregunta es para quién es el crecimiento, no cuántos turistas llegan.", false], ["C", "has not seriously asked itself which people tourism is helping.", "Correcta. «avoid» (evitar) indica que el concejo no se ha hecho esa pregunta en los diez años de crecimiento turístico.", true], ["D", "has answered the question many times.", "«avoided» significa lo contrario: no la ha enfrentado.", false]]}, {"id": "EN3-142", "niv": 2, "cp": "en_p6", "cn": "", "e": "What can be inferred about the families who moved to the hills?", "f": "Inferencia de causa: párrafo 3", "vis": "", "o": [["A", "They moved because they wanted a quieter life away from the noise of the tourists.", "El texto no habla de tranquilidad; la causa que sugiere es el costo.", false], ["B", "They now run restaurants near the beach.", "Quien tiene restaurante es la hermana del autor; las familias se fueron de la playa.", false], ["C", "They have better water service than before.", "El texto dice que en las colinas «there is still no regular water service».", false], ["D", "They left mainly because living near the beach became too expensive.", "Correcta. La misma oración une las dos ideas: los alquileres cerca de la playa se triplicaron y muchas familias se mudaron a las colinas.", true]]}]}, {"comp": "ingles", "sim": "s11-3", "ses": 2, "ind": "Texto con espacios: circular de salida escolar", "tt": "", "texto": "Read the text and choose the best word (A, B, C or D) for each gap.\n\nDear students,\n\nOur trip to the coffee farm is (1) ___ Friday, May 14. The bus will leave the school at 6:00 a.m. sharp, so please (2) ___ late, because we cannot wait for anyone. Bring comfortable shoes, a raincoat and enough water for the day. You (3) ___ bring money for lunch, because the school has already paid for it, but you can take some for souvenirs. Remember that you must (4) ___ your parents' permission form before Wednesday. Students who do not return the form will (5) ___ to stay at school. If you have any questions, you can find me in the teachers' lounge (6) ___ the break.\n\nMs. Gómez", "vis": "", "items": [{"id": "EN3-143", "niv": 1, "cp": "en_p7", "cn": "", "e": "Gap (1)", "f": "Preposiciones de tiempo", "vis": "", "o": [["A", "in", "«in» se usa con meses, años o partes del día (in May), no con un día concreto.", false], ["B", "at", "«at» se usa con horas (at 6:00), no con días.", false], ["C", "on", "Correcta. Con días de la semana y fechas se usa «on»: «on Friday, May 14».", true], ["D", "by", "«by Friday» significa «a más tardar el viernes»; un viaje no ocurre «a más tardar» un día.", false]]}, {"id": "EN3-144", "niv": 2, "cp": "en_p7", "cn": "", "e": "Gap (2)", "f": "Imperativo negativo", "vis": "", "o": [["A", "not be", "Falta el auxiliar «do»; el imperativo negativo necesita «don't».", false], ["B", "don't be", "Correcta. Imperativo negativo: «don't + be»: «please don't be late» (por favor no lleguen tarde).", true], ["C", "no be", "«no» no niega verbos en inglés; es un calco del español «no lleguen».", false], ["D", "aren't", "«aren't» es una forma conjugada (you aren't); sin sujeto no funciona como imperativo.", false]]}, {"id": "EN3-145", "niv": 3, "cp": "en_p7", "cn": "", "e": "Gap (3)", "f": "Modales: ausencia de obligación", "vis": "", "o": [["A", "don't need to", "Correcta. Expresa ausencia de obligación: no necesitan llevar dinero para el almuerzo porque ya está pagado, pero pueden llevar para recuerdos.", true], ["B", "mustn't", "«mustn't» es prohibición; contradice «but you can take some for souvenirs» (pueden llevar algo para recuerdos).", false], ["C", "have to", "Indicaría obligación, pero el almuerzo ya está pagado («because the school has already paid for it»).", false], ["D", "should", "Sería una recomendación de llevar dinero para el almuerzo, lo cual no tiene sentido si ya está pagado.", false]]}, {"id": "EN3-146", "niv": 2, "cp": "en_p7", "cn": "", "e": "Gap (4)", "f": "Phrasal verb: hand in", "vis": "", "o": [["A", "turn down", "«turn down» significa «rechazar»; contradice la necesidad de entregar el permiso.", false], ["B", "take off", "«take off» significa «quitarse» (ropa) o «despegar».", false], ["C", "hand in", "Correcta. «hand in» (entregar) un formulario o una tarea; se confirma con «Students who do not return the form».", true], ["D", "give up", "«give up» significa «rendirse» o «dejar algo»; no se entrega así un formulario.", false]]}, {"id": "EN3-147", "niv": 2, "cp": "en_p7", "cn": "", "e": "Gap (5)", "f": "Will have to", "vis": "", "o": [["A", "should", "«will should» combina dos modales; es agramatical.", false], ["B", "have", "Correcta. Futuro de obligación: «will have to stay» (tendrán que quedarse).", true], ["C", "must", "Dos modales no pueden ir juntos: «will must» es incorrecto.", false], ["D", "can", "«will can» es agramatical; el futuro de «can» es «will be able to».", false]]}, {"id": "EN3-148", "niv": 1, "cp": "en_p7", "cn": "", "e": "Gap (6)", "f": "During / while", "vis": "", "o": [["A", "along", "«along» indica movimiento a lo largo de algo (along the road), no tiempo.", false], ["B", "while", "«while» va seguido de una oración (while you are on break), no de un sustantivo solo.", false], ["C", "between", "«between» exige dos referencias (between 9 and 10); «between the break» no tiene sentido.", false], ["D", "during", "Correcta. «during» + sustantivo indica el periodo: «during the break» (durante el descanso).", true]]}]}, {"comp": "ingles", "sim": "s11-3", "ses": 2, "ind": "Texto con espacios: joven emprendedora (ficticia)", "tt": "", "texto": "Read the text and choose the best word (A, B, C or D) for each gap.\n\nFrom plastic bottles to flower pots\n\nAt nineteen, Camila Rojas already runs her own small business. It all (1) ___ when she was in tenth grade and her school asked students to design a product that solved a local problem. Camila noticed that her neighbors threw away large numbers of plastic bottles, and she had the idea of (2) ___ them into colorful flower pots. Her teacher loved the project and encouraged her to keep (3) ___ even after the school year ended. At first, she sold her pots only to relatives, but soon a garden shop (4) ___ an order for 300 pots. Today she employs three former classmates and has (5) ___ two regional awards. \"The hardest part,\" she says, \"was believing in myself. Once I did that, everything else became (6) ___.\"", "vis": "", "items": [{"id": "EN3-149", "niv": 1, "cp": "en_p7", "cn": "", "e": "Gap (1)", "f": "Expresión fija: it all started", "vis": "", "o": [["A", "started", "Correcta. «It all started when…» (todo empezó cuando…) es la expresión fija para contar un origen.", true], ["B", "created", "«create» también exige objeto; «it all created when» queda incompleto.", false], ["C", "opened", "«open» (abrir) necesita algo que se abra (a shop, a door); «it all opened» no tiene sentido.", false], ["D", "founded", "«found» (fundar) es transitivo: se funda una empresa; «it all founded» es incorrecto.", false]]}, {"id": "EN3-150", "niv": 3, "cp": "en_p7", "cn": "", "e": "Gap (2)", "f": "Preposición + -ing", "vis": "", "o": [["A", "turning", "Correcta. «the idea of» + -ing: después de la preposición «of» el verbo va en -ing; «turn into» = convertir en.", true], ["B", "turned", "El pasado no puede ir después de «the idea of».", false], ["C", "to turn", "Tras la preposición «of» no puede ir infinitivo con «to».", false], ["D", "turn", "La forma base no puede seguir a una preposición.", false]]}, {"id": "EN3-151", "niv": 2, "cp": "en_p7", "cn": "", "e": "Gap (3)", "f": "Keep + -ing", "vis": "", "o": [["A", "go", "«keep go» es incorrecto; «keep» exige -ing.", false], ["B", "going", "Correcta. «keep going» (seguir adelante, continuar): «keep» + -ing.", true], ["C", "gone", "El participio no completa «keep» en este sentido.", false], ["D", "to go", "«keep» no va seguido de infinitivo con «to».", false]]}, {"id": "EN3-152", "niv": 2, "cp": "en_p7", "cn": "", "e": "Gap (4)", "f": "Colocación: place an order", "vis": "", "o": [["A", "said", "«say an order» no tiene sentido: «say» se usa con palabras, no con pedidos comerciales.", false], ["B", "did", "«do an order» no es una colocación en inglés; con pedidos se usa «place».", false], ["C", "spoke", "«speak» es intransitivo en este uso; «spoke an order» es agramatical.", false], ["D", "placed", "Correcta. «place an order (for something)» (hacer un pedido): la tienda de jardinería hizo un pedido de 300 macetas.", true]]}, {"id": "EN3-153", "niv": 1, "cp": "en_p7", "cn": "", "e": "Gap (5)", "f": "Colocación: win an award", "vis": "", "o": [["A", "succeeded", "«succeed» es intransitivo (succeed in something); no lleva «awards» como objeto.", false], ["B", "reached", "«reach» (alcanzar) se usa con metas o lugares, no con premios.", false], ["C", "won", "Correcta. «win an award» (ganar un premio): «has won two regional awards».", true], ["D", "beaten", "«beat» se usa con rivales (beat a team), no con premios.", false]]}, {"id": "EN3-154", "niv": 3, "cp": "en_p7", "cn": "", "e": "Gap (6)", "f": "Formación de palabras y sentido", "vis": "", "o": [["A", "possible", "Correcta. Después de «become» va un adjetivo, y el sentido es positivo: tras creer en sí misma, todo lo demás se volvió posible.", true], ["B", "impossible", "Es gramatical, pero contradice el sentido: superar lo más difícil no vuelve todo imposible.", false], ["C", "possibly", "«possibly» es adverbio; no puede ser el complemento de «became».", false], ["D", "possibility", "«possibility» es sustantivo y necesitaría artículo; además no encaja con «everything else became».", false]]}]}];

    h += `<button class="op ${cls}" data-id="${it.id}" data-l="${o[0]}" ${reveal?'disabled':''}><span class="l">${o[0]}.</span><span>${esc(o[1])}</span></button>`;

  $('#main').innerHTML = `<div class="panel">${completo ? '' : `<p class="aviso" style="margin-top:0"><b>Resultado parcial:</b> solo has terminado la ${[1,2].filter(s=>ST.fin[s]).map(nombreS).join(' y ').toLowerCase()}. Termina la otra sesión para ver el resultado completo.</p>`}
  <div class="big">${fmt(pct)} %</div>
  <p style="margin-top:4px">${ok} de ${L.length} respuestas correctas. ${pct >= 75 ? 'Muy buen resultado: repasa tus errores para afianzarlo.' : pct >= 55 ? 'Vas por buen camino: refuerza las pruebas y competencias con menor porcentaje.' : 'Hay que reforzar: practica por prueba y competencia, empezando por la más baja.'} Tu prueba más baja: <b>${esc(CFG.componentes[peor[0]])}</b>.</p>
  ${ind}<p class="stat">Tiempo usado · ${tUso}</p>
  <h3>Por prueba y competencia</h3><table>${tabla}</table>
  <h3>Por dificultad</h3><table>${Object.entries(porNiv).map(([k,v]) => fila(CFG.niveles[k], v)).join('')}</table>
  <div class="row" style="margin-top:14px"><button class="btn sec" id="solo">Ver solo mis errores</button><button class="btn sec" id="todas">Ver todas</button><button class="btn sec" id="ini">Volver al inicio</button><button class="btn sec" id="otra">Reiniciar el simulacro</button></div></div><div id="rev"></div>`;
  const rev = errs => { let h = ''; [1,2].filter(s => ST.fin[s]).forEach(s => { const l = SES(s).filter(it => !errs || ST.r[it.id] !== keyOf(it)); h += `<div class="mod">${nombreS(s)}</div>` + (l.length ? renderList(l, 'review') : '<div class="panel">¡No tuviste errores en esta sesión!</div>'); }); $('#rev').innerHTML = h; };
  rev(true);
  $('#solo').onclick = () => rev(true); $('#todas').onclick = () => rev(false);
  $('#ini').onclick = () => { inicio(); window.scrollTo(0,0); };
  $('#otra').onclick = reiniciar;
}

document.addEventListener('click', e => {
  const b = e.target.closest('button.op'); if (!b || b.disabled) return;
  if (CFG.modo === 'simulacro' && (!ACT || ST.fin[ACT])) return;
  ST.r[b.dataset.id] = b.dataset.l; save();
  const it = ITEMS.find(i => i.id === b.dataset.id);
  const n = b.closest('.item').querySelector('.n').textContent.replace('.','');
  b.closest('.item').outerHTML = itemHTML(it, n, CFG.modo === 'practica' ? 'practica' : 'examen');
  if (CFG.modo === 'practica') { const resp = LIST.filter(i => ST.r[i.id]); const ok = resp.filter(i => ST.r[i.id]===keyOf(i)).length; $('#prog').textContent = `${ok}/${resp.length} aciertos`; $('#pst').textContent = `${LIST.length} preguntas · respondidas ${resp.length} · aciertos ${ok} (${Math.round(100*ok/resp.length)} %)`; }
  else progreso();
});
if (CFG.modo === 'practica') practica();
else if (ACT && ST.t[ACT] && !ST.fin[ACT]) examen();
else inicio();
</script>
</body>
</html>
