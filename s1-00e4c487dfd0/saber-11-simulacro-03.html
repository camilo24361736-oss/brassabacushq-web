<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulacro 3 · Saber 11</title>
<style>
:root{--bg:#f3f6f8;--card:#fff;--ink:#1d2433;--mute:#5a6478;--line:#d6dee4;--pri:#0b4f6c;--pri2:#1f7aa3;--ok:#0d6b3a;--okbg:#e6f4ec;--no:#9b1c1c;--nobg:#fbeaea;--sel:#e4f1f8}
@media (prefers-color-scheme: dark){:root{--bg:#0f1418;--card:#172026;--ink:#e3eaee;--mute:#97a6b0;--line:#2c3a44;--pri:#7cc3e6;--pri2:#a3d6ef;--ok:#7fd3a3;--okbg:#16301f;--no:#f2a3a3;--nobg:#3a1c1c;--sel:#1d3442}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overflow-wrap:anywhere}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px}
.hwrap{max-width:860px;margin:0 auto;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;justify-content:space-between}
h1{font-size:17px;margin:0;color:var(--pri)}
h2{color:var(--pri)}
.stat{font-size:14px;color:var(--mute)}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--pri)}
.timer.low{color:var(--no)}
main{max-width:860px;margin:0 auto;padding:16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin:0 0 16px}
.mod{background:var(--pri);color:var(--card);border-radius:10px;padding:10px 14px;margin:28px 0 6px;font-weight:700;font-size:18px}
.inst{font-size:13px;font-weight:700;color:var(--pri);text-transform:uppercase;letter-spacing:.03em;margin:18px 0 4px}
.caso{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--pri);border-radius:10px;padding:14px 16px;margin:10px 0}
.tag{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--pri);font-weight:700}
.caso p{margin:6px 0 0;white-space:pre-line}
.item{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0}
.enun{margin:0 0 8px;white-space:pre-line}
.n{font-weight:700;color:var(--pri)}
.niv{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-right:4px;white-space:nowrap}
.op{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:6px 0;cursor:pointer;background:transparent;width:100%;text-align:left;color:inherit;font:inherit}
.ops8{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.ops8 .op{margin:0}
.op:hover{border-color:var(--pri2)}
.op .l{font-weight:700;min-width:20px}
.op.sel{background:var(--sel);border-color:var(--pri2)}
.op.ok{background:var(--okbg);border-color:var(--ok)}
.op.no{background:var(--nobg);border-color:var(--no)}
.op[disabled]{cursor:default}
.just{font-size:14px;margin:8px 0 0;padding:8px 10px;border-top:1px dashed var(--line)}
.just div{margin:4px 0}
.just .okt{color:var(--ok);font-weight:700}
.just .not{color:var(--no);font-weight:700}
.src{font-size:13px;color:var(--mute);margin-top:6px}
button.btn{background:var(--pri);color:var(--card);border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer}
button.btn.sec{background:transparent;color:var(--pri);border:1px solid var(--pri)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
select{font:inherit;padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);max-width:100%}
table{border-collapse:collapse;width:100%;font-size:15px}
td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.sub td{font-size:13px;color:var(--mute);padding-left:22px}
.vt{width:auto;max-width:100%;margin:10px 0;font-size:14px;display:block;overflow-x:auto}
.vt caption{text-align:left;font-weight:700;padding-bottom:4px}
.vt th,.vt td{border:1px solid var(--line);padding:4px 8px}
.vt th{background:var(--sel)}
.vnota{font-size:12px;color:var(--mute)}
.vfig{margin:10px 0}
.vfig svg{width:100%;max-width:560px;height:auto;border-radius:6px;border:1px solid var(--line);background:#fff}
.big{font-size:40px;font-weight:800;color:var(--pri);line-height:1.1}
.aviso{font-size:13px;color:var(--mute)}
.hide{display:none !important}
.res-ok{color:var(--ok);font-weight:700}.res-no{color:var(--no);font-weight:700}
textarea{width:100%;min-height:320px;font:inherit;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);resize:vertical}
.chk label{display:flex;gap:8px;align-items:flex-start;margin:6px 0;font-size:15px}
.chk input{margin-top:4px;width:18px;height:18px;flex:none}
.modelo{white-space:pre-line;background:var(--bg);border-radius:8px;padding:10px 12px;margin:6px 0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal .panel{max-width:420px}
.nav{padding:6px 0;display:flex;gap:6px;flex-wrap:wrap}
.nav a{font-size:13px;color:var(--pri);border:1px solid var(--line);border-radius:999px;padding:3px 10px;text-decoration:none;background:var(--card)}
footer{max-width:860px;margin:0 auto;padding:8px 16px 40px;font-size:12px;color:var(--mute)}
</style>
</head>

<header><div class="hwrap"><h1 id="tit"></h1><div class="row stat"><span id="prog"></span><span id="timer" class="timer"></span></div></div></header>
<main id="main"></main>

<footer>Material de preparación independiente. No está afiliado al Icfes ni a ninguna entidad pública. Preguntas y textos originales; no son preguntas reales del examen. Soporte: brassabacuscontact@gmail.com</footer>
<script>
const DATA = [{"comp": "matematicas", "sim": "s11-3", "ses": 1, "ind": "Tarifa de un sistema de bicicletas compartidas", "tt": "", "texto": "Un sistema de bicicletas eléctricas compartidas de una ciudad cobra a sus usuarios una suscripción mensual de $ 12.600 más $ 700 por cada minuto de uso. La gráfica muestra los minutos de uso de una usuaria durante el primer semestre del año.", "vis": "<div class=\"vfig\"><svg class=\"vg\" viewBox=\"0 0 560 320\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Gráfica 1. Minutos de uso mensuales de una usuaria\" font-family=\"Arial, sans-serif\" font-size=\"12\"><rect width=\"560\" height=\"320\" fill=\"#ffffff\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"13\" fill=\"#1d2433\">Gráfica 1. Minutos de uso mensuales de una usuaria<\/text><line x1=\"60\" y1=\"258.0\" x2=\"540\" y2=\"258.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"262.0\" text-anchor=\"end\" fill=\"#3a4356\">0<\/text><line x1=\"60\" y1=\"213.6\" x2=\"540\" y2=\"213.6\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"217.6\" text-anchor=\"end\" fill=\"#3a4356\">25<\/text><line x1=\"60\" y1=\"169.2\" x2=\"540\" y2=\"169.2\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"173.2\" text-anchor=\"end\" fill=\"#3a4356\">50<\/text><line x1=\"60\" y1=\"124.8\" x2=\"540\" y2=\"124.8\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"128.8\" text-anchor=\"end\" fill=\"#3a4356\">75<\/text><line x1=\"60\" y1=\"80.4\" x2=\"540\" y2=\"80.4\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"84.4\" text-anchor=\"end\" fill=\"#3a4356\">100<\/text><line x1=\"60\" y1=\"36.0\" x2=\"540\" y2=\"36.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"40.0\" text-anchor=\"end\" fill=\"#3a4356\">125<\/text><line x1=\"60\" y1=\"258\" x2=\"540\" y2=\"258\" stroke=\"#3a4356\"/><line x1=\"60\" y1=\"258\" x2=\"60\" y2=\"36\" stroke=\"#3a4356\"/><text transform=\"translate(14,147.0) rotate(-90)\" text-anchor=\"middle\" fill=\"#3a4356\">Minutos de uso<\/text><text x=\"300.0\" y=\"312\" text-anchor=\"middle\" fill=\"#3a4356\">Mes<\/text><text x=\"100.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Ene<\/text><text x=\"180.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Feb<\/text><text x=\"260.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Mar<\/text><text x=\"340.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Abr<\/text><text x=\"420.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">May<\/text><text x=\"500.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Jun<\/text><polyline fill=\"none\" stroke=\"#1660a8\" stroke-width=\"2.5\" points=\"100.0,112.4 180.0,119.5 260.0,78.6 340.0,59.1 420.0,71.5 500.0,39.6\"/><circle cx=\"100.0\" cy=\"112.4\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"100.0\" y=\"104.4\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">82<\/text><circle cx=\"180.0\" cy=\"119.5\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"180.0\" y=\"111.5\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">78<\/text><circle cx=\"260.0\" cy=\"78.6\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"260.0\" y=\"70.6\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">101<\/text><circle cx=\"340.0\" cy=\"59.1\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"340.0\" y=\"51.1\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">112<\/text><circle cx=\"420.0\" cy=\"71.5\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"420.0\" y=\"63.5\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">105<\/text><circle cx=\"500.0\" cy=\"39.6\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"500.0\" y=\"31.6\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">123<\/text><\/svg><\/div>", "items": [{"id": "MTC-107", "niv": 1, "cp": "mt_interpretacion", "cn": "", "e": "¿Cuál expresión representa el valor mensual C, en pesos, que paga un usuario que usa las bicicletas m minutos en el mes?", "f": "Modelo afín construido con los datos del caso", "vis": "", "o": [["A", "C = 12.600 + 700m.", "La suscripción se suma una sola vez y los $ 700 se multiplican por el número de minutos.", true], ["B", "C = 700m − 12.600.", "Resta la suscripción en lugar de sumarla, como si fuera un descuento sobre el valor de los minutos.", false], ["C", "C = 700 + 12.600m.", "Intercambia los papeles: multiplica la suscripción por los minutos y suma el precio del minuto una sola vez.", false], ["D", "C = 13.300m.", "Suma la suscripción y el precio del minuto (12.600 + 700) y multiplica todo por los minutos, como si la suscripción se cobrara por cada minuto.", false]]}, {"id": "MTC-108", "niv": 2, "cp": "mt_formulacion", "cn": "", "e": "Si un usuario pagó $ 117.600 en un mes, ¿cuántos minutos usó las bicicletas?", "f": "Cálculo propio", "vis": "", "o": [["A", "132 minutos.", "Resta dos veces la suscripción: (117.600 − 25.200) ÷ 700 = 132.", false], ["B", "150 minutos.", "Se descuenta la suscripción y se divide entre el precio del minuto: (117.600 − 12.600) ÷ 700 = 150.", true], ["C", "168 minutos.", "Divide todo el pago entre 700 sin descontar la suscripción: 117.600 ÷ 700 = 168.", false], ["D", "186 minutos.", "Suma la suscripción en vez de restarla: (117.600 + 12.600) ÷ 700 = 186.", false]]}, {"id": "MTC-109", "niv": 2, "cp": "mt_interpretacion", "cn": "", "e": "Según la gráfica, ¿entre cuáles meses consecutivos tuvo la usuaria el mayor aumento de minutos de uso?", "f": "Cálculo propio", "vis": "", "o": [["A", "De abril a mayo.", "De abril a mayo el uso bajó de 112 a 105 minutos; no hubo aumento.", false], ["B", "De marzo a abril.", "El aumento fue de 101 a 112 minutos, es decir, 11 minutos, menor que el de febrero a marzo.", false], ["C", "De mayo a junio.", "Junio tiene el mayor uso (123 minutos), pero el aumento desde mayo fue de 18 minutos, menor que 23.", false], ["D", "De febrero a marzo.", "El uso pasó de 78 a 101 minutos: un aumento de 23 minutos, el mayor entre meses consecutivos.", true]]}]}, {"comp": "matematicas", "sim": "s11-3", "ses": 1, "ind": "Juego de dados en una feria escolar", "tt": "", "texto": "En un juego de una feria escolar, el participante lanza dos dados corrientes de seis caras, numeradas del 1 al 6, y suma los puntos obtenidos. Las seis caras de cada dado tienen la misma probabilidad de salir.", "vis": "", "items": [{"id": "MTC-110", "niv": 3, "cp": "mt_formulacion", "cn": "", "e": "¿Cuál es la probabilidad de que la suma de los dos dados sea 8?", "f": "Cálculo propio", "vis": "", "o": [["A", "1/12.", "Cuenta solo 3 casos (2 y 6, 3 y 5, 4 y 4) sin distinguir el orden de los dados; en realidad 2-6 y 6-2 son resultados distintos.", false], ["B", "1/11.", "Supone que las 11 sumas posibles (de 2 a 12) son igualmente probables, lo cual es falso.", false], ["C", "5/36.", "Hay 36 resultados igualmente probables; dan suma 8: (2,6), (3,5), (4,4), (5,3) y (6,2). Probabilidad: 5/36.", true], ["D", "1/7.", "Usa 21 resultados sin orden y 3 favorables (3/21); esos 21 resultados no son igualmente probables.", false]]}, {"id": "MTC-111", "niv": 3, "cp": "mt_argumentacion", "cn": "", "e": "Un participante dice: «Me conviene más apostar a que la suma será 7 que apostar a que la suma será un número par, porque 7 es la suma más probable». ¿Es correcto su razonamiento?", "f": "Cálculo propio", "vis": "", "o": [["A", "No, porque la suma 7 sale en 6 de los 36 resultados y una suma par sale en 18 de los 36.", "Sumas pares (2, 4, 6, 8, 10, 12): 1 + 3 + 5 + 5 + 3 + 1 = 18 resultados; suma 7: 6 resultados. Apostar a par es mejor.", true], ["B", "No, porque hay 11 sumas posibles, de 2 a 12, y cada una tiene la misma probabilidad, 1/11.", "Las sumas no son equiprobables: la suma 7 se obtiene de 6 formas y la suma 2 de una sola.", false], ["C", "Sí, porque hay 6 sumas pares (2, 4, 6, 8, 10 y 12) y cada una es menos probable que el 7.", "Cada suma par por separado es menos probable que 7, pero el evento «suma par» las reúne todas: 18/36 > 6/36.", false], ["D", "Sí, porque la suma 7 sale en 6 de los 36 resultados, más que cualquier otra suma individual.", "Es cierto para sumas individuales, pero «suma par» agrupa seis sumas y reúne 18 de los 36 resultados.", false]]}]}, {"comp": "matematicas", "sim": "s11-3", "ses": 1, "ind": "Inscritos en un club deportivo comunitario", "tt": "", "texto": "Un club deportivo comunitario tiene 120 inscritos. De ellos, 68 practican fútbol, 45 practican natación y 18 practican ambos deportes. Los demás inscritos asisten solo a actividades recreativas y no practican ninguno de los dos deportes.", "vis": "", "items": [{"id": "MTC-117", "niv": 2, "cp": "mt_formulacion", "cn": "", "e": "¿Cuántos inscritos no practican ninguno de los dos deportes?", "f": "Cálculo propio", "vis": "", "o": [["A", "7", "Resta 68 y 45 de 120 sin tener en cuenta que los 18 que practican ambos quedaron restados dos veces.", false], ["B", "25", "Practican al menos un deporte 68 + 45 − 18 = 95 inscritos; no practican ninguno 120 − 95 = 25.", true], ["C", "27", "Es el número de inscritos que practican solo natación (45 − 18), no el de quienes no practican ningún deporte.", false], ["D", "50", "Es el número de inscritos que practican solo fútbol (68 − 18), no el de quienes no practican ningún deporte.", false]]}, {"id": "MTC-118", "niv": 3, "cp": "mt_argumentacion", "cn": "", "e": "El coordinador afirma: «En el club hay más inscritos que practican solo fútbol que inscritos que practican natación». ¿Es correcta la afirmación?", "f": "Cálculo propio", "vis": "", "o": [["A", "Sí, porque el fútbol lo practican 68 inscritos y la natación solamente 27.", "27 es el número de quienes practican solo natación; natación la practican 45, y la comparación debía hacerse con «solo fútbol».", false], ["B", "No, porque solo fútbol lo practican 68 − 18 − 25 = 25 inscritos, menos que los 45 de natación.", "Resta también a quienes no practican ningún deporte, que no hacen parte del grupo de fútbol.", false], ["C", "Sí, porque solo fútbol lo practican 68 − 18 = 50 inscritos, y natación la practican 45.", "Quienes practican solo fútbol son 68 − 18 = 50, y quienes practican natación (solo natación o ambos) son 45; 50 > 45.", true], ["D", "No, porque natación la practican 45 inscritos y solo fútbol lo practican 68 − 45 = 23.", "Para hallar «solo fútbol» se debe restar la intersección (18), no el total de natación (45).", false]]}]}, {"comp": "matematicas", "sim": "s11-3", "ses": 1, "ind": "Ahorro con interés compuesto", "tt": "", "texto": "Una cooperativa ofrece a sus asociados una cuenta de ahorro con interés compuesto del 1 % mensual: al final de cada mes, el saldo aumenta en un 1 % y los intereses ganados se suman al saldo. Rosa deposita $ 2.000.000 y durante un año no hace retiros ni nuevos depósitos.", "vis": "", "items": [{"id": "MTC-123", "niv": 3, "cp": "mt_formulacion", "cn": "", "e": "¿Cuál expresión permite calcular el saldo de Rosa, en pesos, al cabo de 12 meses?", "f": "Modelo de interés compuesto; cálculo propio", "vis": "", "o": [["A", "2.000.000 × (1,12)¹².", "Aplica una tasa del 12 % en cada uno de los 12 meses, cuando la tasa mensual es del 1 %.", false], ["B", "2.000.000 × (1 + 0,01 × 12).", "Corresponde a interés simple: calcula siempre el 1 % sobre el depósito inicial y no sobre el saldo acumulado.", false], ["C", "2.000.000 × 1,01 × 12.", "Multiplica por 12 en lugar de elevar a la 12: daría más de 24 millones de pesos.", false], ["D", "2.000.000 × (1,01)¹².", "Cada mes el saldo se multiplica por 1,01 (100 % + 1 %); después de 12 meses se ha multiplicado 12 veces por 1,01.", true]]}, {"id": "MTC-124", "niv": 3, "cp": "mt_argumentacion", "cn": "", "e": "Rosa afirma: «Como el interés es del 1 % mensual, al cabo de 12 meses mi saldo habrá crecido exactamente un 12 %». ¿Es correcta su afirmación?", "f": "Cálculo propio", "vis": "", "o": [["A", "No, porque con interés compuesto también se ganan intereses sobre los intereses, y el total supera el 12 %.", "Los intereses de cada mes se suman al saldo y generan nuevos intereses; por eso el crecimiento anual es algo mayor que 12 %.", true], ["B", "No, porque el saldo solo crecería exactamente el 12 % si Rosa hiciera nuevos depósitos cada mes.", "Los nuevos depósitos no tienen relación con la tasa; el crecimiento supera 12 % porque los intereses se capitalizan.", false], ["C", "No, porque con interés compuesto el saldo crece menos del 12 %, ya que parte de los intereses se descuenta.", "En el interés compuesto no se descuentan intereses: se suman al saldo y generan nuevos intereses, así que el crecimiento es mayor que 12 %.", false], ["D", "Sí, porque los intereses de un año equivalen siempre a la tasa mensual multiplicada por el número de meses.", "Eso solo ocurre con interés simple; en el compuesto los intereses se acumulan y el crecimiento anual supera 12 %.", false]]}]}, {"comp": "matematicas", "sim": "s11-3", "ses": 1, "ind": "Crecimiento de una colonia de bacterias", "tt": "", "texto": "En el laboratorio de un colegio se cultiva una colonia de bacterias. Al iniciar el registro hay 500 bacterias y se observa que, mientras las condiciones se mantienen constantes, la población se duplica cada 3 horas. La tabla muestra algunos registros.", "vis": "<table class=\"vt\"><caption>Tabla 1. Población de bacterias<\/caption><thead><tr><th>Tiempo (horas)<\/th><th>0<\/th><th>3<\/th><th>6<\/th><th>9<\/th><\/tr><\/thead><tbody><tr><td>Número de bacterias<\/td><td>500<\/td><td>1.000<\/td><td>2.000<\/td><td>4.000<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Datos ficticios.<\/div>", "items": [{"id": "MTC-126", "niv": 2, "cp": "mt_interpretacion", "cn": "", "e": "¿Cuál expresión representa el número de bacterias P después de t horas?", "f": "Modelo exponencial; tabla del caso", "vis": "", "o": [["A", "P(t) = 500 · 2^(3t).", "Duplica la población 3 veces por hora: para t = 3 daría 500 · 2⁹ = 256.000 bacterias.", false], ["B", "P(t) = 500 · 3^(t/2).", "Intercambia los papeles de 2 y 3: para t = 2 la población se triplicaría, lo que no corresponde a la tabla.", false], ["C", "P(t) = 500 · 2^(t/3).", "En t horas hay t/3 periodos de duplicación; por eso 500 se multiplica t/3 veces por 2. Para t = 3, 6 y 9 da 1.000, 2.000 y 4.000.", true], ["D", "P(t) = 500 + 500t/3.", "Es un modelo lineal: da 1.000 para t = 3, pero 1.500 para t = 6, y la tabla indica 2.000.", false]]}, {"id": "MTC-127", "niv": 2, "cp": "mt_formulacion", "cn": "", "e": "Si las condiciones no cambian, ¿cuántas bacterias habrá 15 horas después de iniciar el registro?", "f": "Cálculo propio", "vis": "", "o": [["A", "2.500", "Multiplica 500 por el número de periodos (5) en lugar de duplicar la población 5 veces.", false], ["B", "8.000", "Cuenta solo 4 duplicaciones; en 15 horas hay 15 ÷ 3 = 5 periodos de 3 horas.", false], ["C", "16.000", "En 15 horas hay 5 duplicaciones: 500 × 2⁵ = 500 × 32 = 16.000 bacterias.", true], ["D", "32.000", "Cuenta 6 duplicaciones; en 15 horas solo caben 5 periodos de 3 horas.", false]]}, {"id": "MTC-128", "niv": 3, "cp": "mt_argumentacion", "cn": "", "e": "Un estudiante afirma: «Como en las primeras 3 horas la población aumentó en 500 bacterias, en las primeras 6 horas aumentará en 1.000 bacterias». ¿Es correcta su afirmación?", "f": "Cálculo propio", "vis": "", "o": [["A", "No, porque la población se duplica y en 6 horas aumenta en 500 × 2³ = 4.000 bacterias.", "En 6 horas hay 2 duplicaciones, no 3; además, 500 × 2² = 2.000 es la población final, y el aumento es 1.500.", false], ["B", "Sí, porque cada 3 horas se suman 500 bacterias: 500 + 500 = 1.000 de aumento en 6 horas.", "Cada periodo duplica la población actual: en el segundo periodo se pasa de 1.000 a 2.000 (se suman 1.000).", false], ["C", "Sí, porque el aumento es proporcional al tiempo: 500 × (6 ÷ 3) = 1.000 bacterias en 6 horas.", "Eso supone un crecimiento lineal; aquí la población se duplica, y en el segundo periodo aumenta en 1.000, no en 500.", false], ["D", "No, porque pasa de 500 a 1.000 y luego a 2.000: en 6 horas aumenta 2.000 − 500 = 1.500.", "El crecimiento es exponencial: cada periodo duplica lo que hay. Aumento en 6 horas: 2.000 − 500 = 1.500 bacterias.", true]]}]}, {"comp": "matematicas", "sim": "s11-3", "ses": 1, "ind": "Distancias en el mapa de un municipio", "tt": "", "texto": "En el mapa cuadriculado de un municipio, cada unidad de los ejes equivale a 1 km. La escuela está en el punto E(1, 2) y el puesto de salud en el punto S(7, 10).", "vis": "", "items": [{"id": "MTC-133", "niv": 2, "cp": "mt_formulacion", "cn": "", "e": "¿Cuál es la distancia en línea recta entre la escuela y el puesto de salud?", "f": "Distancia entre dos puntos (Pitágoras)", "vis": "", "o": [["A", "10 km.", "Diferencias: 7 − 1 = 6 y 10 − 2 = 8; por Pitágoras, d = √(6² + 8²) = √100 = 10 km.", true], ["B", "14 km.", "Suma las diferencias (6 + 8): es la distancia recorriendo las calles de la cuadrícula, no en línea recta.", false], ["C", "14,4 km.", "Suma las coordenadas en lugar de restarlas: √((7 + 1)² + (10 + 2)²) = √208 ≈ 14,4.", false], ["D", "100 km.", "Calcula 6² + 8² = 100, pero olvida sacar la raíz cuadrada.", false]]}, {"id": "MTC-134", "niv": 1, "cp": "mt_interpretacion", "cn": "", "e": "Se quiere ubicar una bodega de alimentos exactamente en el punto medio del segmento que une la escuela y el puesto de salud. ¿En qué punto debe ubicarse?", "f": "Punto medio en el plano cartesiano", "vis": "", "o": [["A", "(3, 4).", "Es la mitad de las diferencias (6/2, 8/2); falta sumarle esas mitades a las coordenadas de la escuela.", false], ["B", "(4, 6).", "Punto medio: ((1 + 7)/2, (2 + 10)/2) = (4, 6).", true], ["C", "(8, 12).", "Suma las coordenadas pero no divide entre 2.", false], ["D", "(6, 8).", "Son las diferencias entre las coordenadas (7 − 1, 10 − 2), no el punto medio.", false]]}]}, {"comp": "matematicas", "sim": "s11-3", "ses": 1, "ind": "Elección al azar de estudiantes sin reposición", "tt": "", "texto": "Una escuela rural multigrado tiene un grupo de 12 estudiantes: 5 de grado 11.°, 4 de grado 10.° y 3 de grado 9.°. Para representar a la escuela en un concurso se eligen al azar dos estudiantes, uno tras otro; el primer elegido no puede volver a ser elegido.", "vis": "", "items": [{"id": "MTC-137", "niv": 3, "cp": "mt_formulacion", "cn": "", "e": "¿Cuál es la probabilidad de que los dos estudiantes elegidos sean de grado 11.°?", "f": "Probabilidad de eventos dependientes", "vis": "", "o": [["A", "5/36.", "Calcula 5/12 × 4/12: descuenta al primer elegido del numerador, pero no del total de estudiantes.", false], ["B", "5/33.", "Primero de 11.°: 5/12; segundo de 11.°, con 11 estudiantes y 4 de 11.°: 4/11. Producto: 20/132 = 5/33.", true], ["C", "25/144.", "Calcula 5/12 × 5/12, como si el primer elegido pudiera volver a ser elegido.", false], ["D", "5/12.", "Es la probabilidad de que el primer elegido sea de grado 11.°; no tiene en cuenta la segunda elección.", false]]}]}, {"comp": "matematicas", "sim": "s11-3", "ses": 1, "ind": "Chorro de agua de una fuente", "tt": "", "texto": "Una fuente de un parque lanza un chorro de agua desde el nivel del suelo. La altura h del chorro, en metros, a una distancia horizontal x metros de la boquilla, está dada por h(x) = 2x − 0,5x². La gráfica muestra algunos valores de esta función.", "vis": "<div class=\"vfig\"><svg class=\"vg\" viewBox=\"0 0 560 320\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Gráfica 2. Altura del chorro de agua\" font-family=\"Arial, sans-serif\" font-size=\"12\"><rect width=\"560\" height=\"320\" fill=\"#ffffff\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"13\" fill=\"#1d2433\">Gráfica 2. Altura del chorro de agua<\/text><line x1=\"60\" y1=\"258.0\" x2=\"540\" y2=\"258.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"262.0\" text-anchor=\"end\" fill=\"#3a4356\">0<\/text><line x1=\"60\" y1=\"202.5\" x2=\"540\" y2=\"202.5\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"206.5\" text-anchor=\"end\" fill=\"#3a4356\">0,5<\/text><line x1=\"60\" y1=\"147.0\" x2=\"540\" y2=\"147.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"151.0\" text-anchor=\"end\" fill=\"#3a4356\">1<\/text><line x1=\"60\" y1=\"91.5\" x2=\"540\" y2=\"91.5\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"95.5\" text-anchor=\"end\" fill=\"#3a4356\">1,5<\/text><line x1=\"60\" y1=\"36.0\" x2=\"540\" y2=\"36.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"40.0\" text-anchor=\"end\" fill=\"#3a4356\">2<\/text><line x1=\"60\" y1=\"258\" x2=\"540\" y2=\"258\" stroke=\"#3a4356\"/><line x1=\"60\" y1=\"258\" x2=\"60\" y2=\"36\" stroke=\"#3a4356\"/><text transform=\"translate(14,147.0) rotate(-90)\" text-anchor=\"middle\" fill=\"#3a4356\">Altura (m)<\/text><text x=\"300.0\" y=\"312\" text-anchor=\"middle\" fill=\"#3a4356\">Distancia horizontal (m)<\/text><text x=\"86.7\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">0<\/text><text x=\"140.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">0,5<\/text><text x=\"193.3\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">1<\/text><text x=\"246.7\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">1,5<\/text><text x=\"300.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">2<\/text><text x=\"353.3\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">2,5<\/text><text x=\"406.7\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">3<\/text><text x=\"460.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">3,5<\/text><text x=\"513.3\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">4<\/text><polyline fill=\"none\" stroke=\"#1660a8\" stroke-width=\"2.5\" points=\"86.7,258.0 140.0,160.9 193.3,91.5 246.7,49.9 300.0,36.0 353.3,49.9 406.7,91.5 460.0,160.9 513.3,258.0\"/><circle cx=\"86.7\" cy=\"258.0\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"86.7\" y=\"250.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">0<\/text><circle cx=\"140.0\" cy=\"160.9\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"140.0\" y=\"152.9\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">0,875<\/text><circle cx=\"193.3\" cy=\"91.5\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"193.3\" y=\"83.5\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">1,5<\/text><circle cx=\"246.7\" cy=\"49.9\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"246.7\" y=\"41.9\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">1,875<\/text><circle cx=\"300.0\" cy=\"36.0\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"300.0\" y=\"28.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">2<\/text><circle cx=\"353.3\" cy=\"49.9\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"353.3\" y=\"41.9\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">1,875<\/text><circle cx=\"406.7\" cy=\"91.5\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"406.7\" y=\"83.5\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">1,5<\/text><circle cx=\"460.0\" cy=\"160.9\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"460.0\" y=\"152.9\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">0,875<\/text><circle cx=\"513.3\" cy=\"258.0\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"513.3\" y=\"250.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">0<\/text><\/svg><\/div>", "items": [{"id": "MTC-138", "niv": 2, "cp": "mt_interpretacion", "cn": "", "e": "Según la gráfica, ¿a lo largo de cuántos metros horizontales está el chorro a 1,5 m de altura o más?", "f": "Lectura de gráfica", "vis": "", "o": [["A", "1 metro.", "Cuenta solo desde x = 1 hasta el punto más alto (x = 2); el chorro sigue a 1,5 m o más mientras baja, hasta x = 3.", false], ["B", "2 metros.", "La altura es 1,5 m en x = 1 y en x = 3, y es mayor entre esos puntos: 3 − 1 = 2 metros.", true], ["C", "3 metros.", "Toma la posición x = 3 como si fuera la longitud del tramo; el chorro alcanza 1,5 m por primera vez en x = 1.", false], ["D", "4 metros.", "Es el alcance total del chorro, de x = 0 a x = 4, no el tramo en que está a 1,5 m o más.", false]]}, {"id": "MTC-139", "niv": 3, "cp": "mt_formulacion", "cn": "", "e": "Si se aumenta la presión de la fuente, de modo que la altura del chorro sea h(x) = 2,5x − 0,5x², ¿cuál será su altura máxima?", "f": "Vértice de una función cuadrática", "vis": "", "o": [["A", "3 m.", "Evalúa la función en x = 2 (2,5 × 2 − 0,5 × 4 = 3), pero la altura máxima ocurre en x = 2,5 m.", false], ["B", "3,125 m.", "El vértice está en x = 2,5/(2 × 0,5) = 2,5 m; h(2,5) = 6,25 − 3,125 = 3,125 m.", true], ["C", "6,25 m.", "Evalúa solo el término 2,5x en x = 2,5 y olvida restar 0,5x² = 3,125.", false], ["D", "12,5 m.", "Calcula 2,5²/0,5 = 12,5: usa la fórmula del vértice sin el factor 4 del denominador (2,5²/(4 × 0,5) = 3,125).", false]]}]}, {"comp": "matematicas", "sim": "s11-3", "ses": 1, "ind": "Altura de un tanque elevado por medio de sombras", "tt": "", "texto": "Para estimar la altura del tanque elevado del acueducto veredal, Andrés mide la sombra del tanque a cierta hora de la mañana: 12 m. A la misma hora, la sombra de su compañera Luisa, que mide 1,6 m de estatura, es de 2 m. El tanque y Luisa están verticales sobre un terreno horizontal.", "vis": "", "items": [{"id": "MTC-140", "niv": 1, "cp": "mt_formulacion", "cn": "", "e": "¿Cuál es la altura del tanque?", "f": "Semejanza de triángulos", "vis": "", "o": [["A", "7,5 m.", "Divide 12 entre 1,6; la proporción correcta compara altura con sombra en ambos casos.", false], ["B", "9,6 m.", "Altura/sombra es igual en ambos: h/12 = 1,6/2, así que h = 12 × 0,8 = 9,6 m.", true], ["C", "11,6 m.", "Supone que la diferencia entre sombra y altura es la misma (12 − 2 + 1,6); la relación es proporcional, no aditiva.", false], ["D", "15 m.", "Invierte la razón: 12 × 2 ÷ 1,6 = 15.", false]]}, {"id": "MTC-141", "niv": 2, "cp": "mt_argumentacion", "cn": "", "e": "¿Por qué es válido usar una proporción entre las alturas y las sombras?", "f": "Criterio de semejanza ángulo-ángulo", "vis": "", "o": [["A", "Porque la diferencia entre sombra y altura, 2 − 1,6 = 0,4 m, es la misma para todos los objetos verticales.", "La relación es multiplicativa: lo que se conserva es la razón altura/sombra, no la diferencia.", false], ["B", "Porque los dos triángulos que forman los objetos con sus sombras tienen la misma área y el mismo perímetro.", "Las áreas y perímetros son muy distintos (12 m frente a 2 m de sombra); la proporción se justifica por la igualdad de ángulos.", false], ["C", "Porque la sombra de cualquier objeto mide siempre 2 ÷ 1,6 = 1,25 veces su altura, a cualquier hora del día.", "La razón sombra/altura cambia durante el día; solo es la misma para objetos medidos a la misma hora.", false], ["D", "Porque los rayos del sol son paralelos y ambos están verticales: los triángulos tienen ángulos iguales.", "Ambos triángulos tienen un ángulo recto y el mismo ángulo de inclinación de los rayos: son semejantes por el criterio ángulo-ángulo.", true]]}]}, {"comp": "matematicas", "sim": "s11-3", "ses": 1, "ind": "Encuesta sobre separación de residuos", "tt": "", "texto": "Una fundación quiere saber cuántos de los 1.600 hogares de un barrio separan los residuos reciclables. Para ello encuestó a 200 hogares, todos ubicados en la calle donde funciona el centro de acopio de reciclaje. De ellos, 60 respondieron que separan sus residuos.", "vis": "", "items": [{"id": "MTC-142", "niv": 2, "cp": "mt_formulacion", "cn": "", "e": "Si la proporción observada en la muestra se aplicara a todo el barrio, ¿cuántos hogares separarían sus residuos?", "f": "Cálculo propio", "vis": "", "o": [["A", "60", "Es el número de hogares de la muestra que separa residuos; no se extendió la proporción a los 1.600 hogares.", false], ["B", "480", "Proporción en la muestra: 60/200 = 0,3; en el barrio: 0,3 × 1.600 = 480 hogares.", true], ["C", "1.400", "Resta 200 de 1.600: cuenta los hogares no encuestados, que no tiene relación con la proporción.", false], ["D", "1.540", "Resta 60 de 1.600, como si todos los hogares no registrados como recicladores separaran residuos.", false]]}, {"id": "MTC-143", "niv": 3, "cp": "mt_argumentacion", "cn": "", "e": "Un funcionario afirma: «La estimación es confiable porque se encuestó a más del 10 % de los hogares del barrio». ¿Es válido su argumento?", "f": "Noción de muestra representativa", "vis": "", "o": [["A", "No, porque los 200 hogares encuestados viven junto al centro de acopio y pueden reciclar más que el resto.", "La muestra tiene sesgo de ubicación; aumentar el tamaño no corrige una muestra que no representa a la población.", true], ["B", "No, porque para que sea confiable habría que encuestar a más de la mitad del barrio, es decir, a más de 800 hogares.", "No existe tal requisito; una muestra más pequeña pero elegida al azar en todo el barrio puede dar una buena estimación.", false], ["C", "Sí, porque los hogares respondieron con sinceridad y, con más del 10 % encuestado, no importa dónde vivan.", "La sinceridad no corrige el sesgo de ubicación: si todos viven junto al centro de acopio, la muestra no representa al barrio.", false], ["D", "Sí, porque 200 de 1.600 es el 12,5 %, y una muestra de ese tamaño produce siempre estimaciones confiables.", "El tamaño ayuda, pero no basta: una muestra grande pero sesgada produce estimaciones poco confiables.", false]]}]}, {"comp": "matematicas", "sim": "s11-3", "ses": 1, "ind": "Transformaciones del logotipo de un club", "tt": "", "texto": "El logotipo de un club de ajedrez se dibuja en un plano cartesiano como el triángulo con vértices A(1, 1), B(4, 1) y C(1, 3).", "vis": "<div class=\"vfig\"><svg viewBox=\"0 0 360 260\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Arial\" font-size=\"12\"><rect width=\"360\" height=\"260\" fill=\"#ffffff\"/><line x1=\"30\" y1=\"40\" x2=\"30\" y2=\"250\" stroke=\"#d5dae2\"/><line x1=\"60\" y1=\"40\" x2=\"60\" y2=\"250\" stroke=\"#d5dae2\"/><line x1=\"90\" y1=\"40\" x2=\"90\" y2=\"250\" stroke=\"#d5dae2\"/><line x1=\"120\" y1=\"40\" x2=\"120\" y2=\"250\" stroke=\"#d5dae2\"/><line x1=\"150\" y1=\"40\" x2=\"150\" y2=\"250\" stroke=\"#d5dae2\"/><line x1=\"180\" y1=\"40\" x2=\"180\" y2=\"250\" stroke=\"#d5dae2\"/><line x1=\"210\" y1=\"40\" x2=\"210\" y2=\"250\" stroke=\"#d5dae2\"/><line x1=\"240\" y1=\"40\" x2=\"240\" y2=\"250\" stroke=\"#d5dae2\"/><line x1=\"270\" y1=\"40\" x2=\"270\" y2=\"250\" stroke=\"#d5dae2\"/><line x1=\"300\" y1=\"40\" x2=\"300\" y2=\"250\" stroke=\"#d5dae2\"/><line x1=\"330\" y1=\"40\" x2=\"330\" y2=\"250\" stroke=\"#d5dae2\"/><line x1=\"30\" y1=\"250\" x2=\"330\" y2=\"250\" stroke=\"#d5dae2\"/><line x1=\"30\" y1=\"220\" x2=\"330\" y2=\"220\" stroke=\"#d5dae2\"/><line x1=\"30\" y1=\"190\" x2=\"330\" y2=\"190\" stroke=\"#d5dae2\"/><line x1=\"30\" y1=\"160\" x2=\"330\" y2=\"160\" stroke=\"#d5dae2\"/><line x1=\"30\" y1=\"130\" x2=\"330\" y2=\"130\" stroke=\"#d5dae2\"/><line x1=\"30\" y1=\"100\" x2=\"330\" y2=\"100\" stroke=\"#d5dae2\"/><line x1=\"30\" y1=\"70\" x2=\"330\" y2=\"70\" stroke=\"#d5dae2\"/><line x1=\"30\" y1=\"40\" x2=\"330\" y2=\"40\" stroke=\"#d5dae2\"/><line x1=\"30\" y1=\"220\" x2=\"340\" y2=\"220\" stroke=\"#1d2433\" stroke-width=\"1.5\"/><line x1=\"180\" y1=\"30\" x2=\"180\" y2=\"255\" stroke=\"#1d2433\" stroke-width=\"1.5\"/><polygon points=\"210,190 300,190 210,130\" fill=\"#d6e6f5\" fill-opacity=\"0.8\" stroke=\"#1d2433\" stroke-width=\"2\"/><circle cx=\"210\" cy=\"190\" r=\"3\" fill=\"#1d2433\"/><circle cx=\"300\" cy=\"190\" r=\"3\" fill=\"#1d2433\"/><circle cx=\"210\" cy=\"130\" r=\"3\" fill=\"#1d2433\"/><text x=\"210\" y=\"236\" text-anchor=\"middle\" fill=\"#1d2433\">1<\/text><text x=\"150\" y=\"236\" text-anchor=\"middle\" fill=\"#1d2433\">−1<\/text><text x=\"240\" y=\"236\" text-anchor=\"middle\" fill=\"#1d2433\">2<\/text><text x=\"120\" y=\"236\" text-anchor=\"middle\" fill=\"#1d2433\">−2<\/text><text x=\"270\" y=\"236\" text-anchor=\"middle\" fill=\"#1d2433\">3<\/text><text x=\"90\" y=\"236\" text-anchor=\"middle\" fill=\"#1d2433\">−3<\/text><text x=\"300\" y=\"236\" text-anchor=\"middle\" fill=\"#1d2433\">4<\/text><text x=\"60\" y=\"236\" text-anchor=\"middle\" fill=\"#1d2433\">−4<\/text><text x=\"330\" y=\"236\" text-anchor=\"middle\" fill=\"#1d2433\">5<\/text><text x=\"30\" y=\"236\" text-anchor=\"middle\" fill=\"#1d2433\">−5<\/text><text x=\"172\" y=\"194\" text-anchor=\"end\" fill=\"#1d2433\">1<\/text><text x=\"172\" y=\"164\" text-anchor=\"end\" fill=\"#1d2433\">2<\/text><text x=\"172\" y=\"134\" text-anchor=\"end\" fill=\"#1d2433\">3<\/text><text x=\"172\" y=\"104\" text-anchor=\"end\" fill=\"#1d2433\">4<\/text><text x=\"172\" y=\"74\" text-anchor=\"end\" fill=\"#1d2433\">5<\/text><text x=\"196\" y=\"186\" font-size=\"13\" font-weight=\"bold\" fill=\"#1d2433\">A<\/text><text x=\"304\" y=\"186\" font-size=\"13\" font-weight=\"bold\" fill=\"#1d2433\">B<\/text><text x=\"196\" y=\"126\" font-size=\"13\" font-weight=\"bold\" fill=\"#1d2433\">C<\/text><text x=\"344\" y=\"224\" fill=\"#1d2433\">x<\/text><text x=\"186\" y=\"34\" fill=\"#1d2433\">y<\/text><text x=\"172\" y=\"236\" text-anchor=\"end\" fill=\"#1d2433\">0<\/text><\/svg><\/div>", "items": [{"id": "MTC-146", "niv": 1, "cp": "mt_interpretacion", "cn": "", "e": "Para un banderín, el logotipo se traslada 3 unidades hacia la izquierda y 2 unidades hacia arriba. ¿Cuáles son los vértices del triángulo trasladado?", "f": "Transformaciones en el plano", "vis": "", "o": [["A", "A′(4, 3), B′(7, 3) y C′(4, 5).", "Suma 3 a la abscisa: eso traslada el triángulo hacia la derecha, no hacia la izquierda.", false], ["B", "A′(−2, −1), B′(1, −1) y C′(−2, 1).", "Resta 2 a la ordenada: eso mueve el triángulo hacia abajo, no hacia arriba.", false], ["C", "A′(−1, 4), B′(2, 4) y C′(−1, 6).", "Intercambia los desplazamientos: mueve 2 unidades a la izquierda y 3 hacia arriba.", false], ["D", "A′(−2, 3), B′(1, 3) y C′(−2, 5).", "Moverse 3 unidades a la izquierda resta 3 a la abscisa y subir 2 unidades suma 2 a la ordenada: (x, y) → (x − 3, y + 2).", true]]}, {"id": "MTC-147", "niv": 2, "cp": "mt_interpretacion", "cn": "", "e": "Para un afiche, el logotipo original se amplía con una homotecia de centro en el origen y razón 2. ¿Cuáles son las coordenadas del vértice C′ que corresponde a C?", "f": "Homotecia con centro en el origen", "vis": "", "o": [["A", "(2, 3).", "Multiplica por 2 solo la abscisa; la homotecia afecta las dos coordenadas por igual.", false], ["B", "(3, 5).", "Suma 2 a cada coordenada: eso es una traslación, no una homotecia.", false], ["C", "(2, 6).", "En una homotecia de centro (0, 0) y razón 2, cada coordenada se multiplica por 2: C(1, 3) → (2, 6).", true], ["D", "(0,5; 1,5).", "Divide las coordenadas entre 2: sería una reducción de razón 1/2, no una ampliación de razón 2.", false]]}]}, {"comp": "matematicas", "sim": "s11-3", "ses": 1, "ind": "Distancias entre tres veredas", "tt": "", "texto": "Tres veredas, A, B y C, no están sobre una misma línea recta. En línea recta, de A a B hay 7 km y de B a C hay 4 km.", "vis": "", "items": [{"id": "MTC-148", "niv": 1, "cp": "mt_formulacion", "cn": "", "e": "¿Cuál de las siguientes puede ser la distancia en línea recta entre las veredas A y C?", "f": "Desigualdad triangular", "vis": "", "o": [["A", "2 km.", "Si AC = 2, entonces AC + BC = 6 < 7 = AB, lo que viola la desigualdad triangular.", false], ["B", "9 km.", "Por la desigualdad triangular, 7 − 4 < AC < 7 + 4, es decir, 3 < AC < 11; 9 km cumple la condición.", true], ["C", "11 km.", "Con AC = 11 = 7 + 4 las tres veredas estarían alineadas, y el enunciado dice que no lo están.", false], ["D", "15 km.", "Supera la suma de los otros dos lados (7 + 4 = 11), así que no puede formarse el triángulo.", false]]}]}, {"comp": "matematicas", "sim": "s11-3", "ses": 1, "ind": "Producción de una planta solar comunitaria", "tt": "", "texto": "Una planta solar comunitaria produce en promedio 3,6 × 10⁵ kWh de energía al mes. En la región, un hogar consume en promedio 150 kWh al mes.", "vis": "", "items": [{"id": "MTC-149", "niv": 1, "cp": "mt_formulacion", "cn": "", "e": "¿A cuántos hogares podría abastecer en promedio la planta cada mes?", "f": "Notación científica; cálculo propio", "vis": "", "o": [["A", "240", "Interpreta 3,6 × 10⁵ como 36.000 (un cero de menos) antes de dividir entre 150.", false], ["B", "2.400", "3,6 × 10⁵ = 360.000 kWh; 360.000 ÷ 150 = 2.400 hogares.", true], ["C", "24.000", "Interpreta 3,6 × 10⁵ como 3.600.000 (un cero de más) antes de dividir entre 150.", false], ["D", "54.000.000", "Multiplica la producción por el consumo de un hogar en lugar de dividir.", false]]}]}, {"comp": "lectura_critica", "sim": "s11-3", "ses": 1, "ind": "Poema sobre la memoria de una casa demolida", "tt": "Texto literario", "texto": "Inventario\n\n(1) En el cajón de arriba guardo\nla llave de una puerta que ya no existe.\nLa casa la tumbaron en abril\npara ensanchar la avenida,\npero la llave sigue abriendo\ncada noche\nel mismo patio con su limonero.\n\n(2) Mi madre dice que olvidar es sano,\nque la memoria pesa como un baúl mojado.\nYo le muestro la llave\ny ella cambia de tema,\npero la he visto, a escondidas,\napretarla en el puño\ncomo quien sostiene un pájaro.\n\n(3) No sé si recordar es vivir dos veces\no morir un poco cada tarde.\nSé que en el plano nuevo de la ciudad\nla casa es apenas una línea punteada,\ny que nadie mide en metros\nlo que cabía en ese patio:\ntres generaciones, un perro, la lluvia.\n\n(4) Por eso no boto la llave.\nNo es nostalgia, es un recibo:\nla prueba de que algo estuvo,\nde que la avenida pasa\npor encima de una vida.\n\nPoema inédito escrito para este simulacro.", "vis": "", "items": [{"id": "LCC-101", "niv": 1, "cp": "lc_local", "cn": "", "e": "En la estrofa (3), la expresión «la casa es apenas una línea punteada» indica que", "f": "Estrofas (1), (3) y (4)", "vis": "", "o": [["A", "la casa queda en las afueras, lejos de la nueva avenida.", "La avenida pasa justamente por donde estaba la casa: «la avenida pasa / por encima de una vida».", false], ["B", "quienes dibujaron el plano cometieron un error al trazar la casa.", "La línea punteada no es un error: señala que la casa ya no existe.", false], ["C", "en los planos actuales la casa solo figura como rastro de algo que ya no está.", "La casa fue tumbada para ensanchar la avenida (estrofa 1); en el «plano nuevo de la ciudad» queda reducida a una línea punteada, la marca de lo que existió.", true], ["D", "la casa todavía no se ha terminado de construir en el nuevo barrio.", "El poema habla de una casa demolida, no de una en construcción.", false]]}, {"id": "LCC-102", "niv": 2, "cp": "lc_global", "cn": "", "e": "En la estrofa (1), los versos «pero la llave sigue abriendo / cada noche / el mismo patio con su limonero» significan que", "f": "Estrofas (1) y (3)", "vis": "", "o": [["A", "el hablante regresa cada noche al terreno donde estuvo la casa.", "El texto no narra visitas al lugar; además, allí ahora pasa una avenida.", false], ["B", "la llave sirve ahora para abrir la puerta de la casa nueva de la familia.", "Lectura literal sin apoyo: el poema no habla de una casa nueva y dice que la puerta «ya no existe».", false], ["C", "la casa fue reconstruida en otro lugar con el mismo patio.", "Nada indica una reconstrucción; en el plano nuevo la casa es solo «una línea punteada».", false], ["D", "el hablante sigue evocando cada noche, en su memoria, la casa desaparecida.", "La puerta ya no existe; lo que la llave «abre» cada noche es el recuerdo del patio. El sentido es figurado y se relaciona con el tema de la memoria que recorre todo el poema.", true]]}, {"id": "LCC-103", "niv": 2, "cp": "lc_global", "cn": "", "e": "En la estrofa (2), la actitud de la madre frente al recuerdo de la casa se caracteriza por", "f": "Estrofa (2)", "vis": "", "o": [["A", "una contradicción entre lo que dice y lo que hace a escondidas.", "Dice que «olvidar es sano» y cambia de tema, pero a escondidas aprieta la llave «como quien sostiene un pájaro», gesto de cuidado y apego.", true], ["B", "una nostalgia que expresa abiertamente ante su familia.", "Ocurre lo contrario: en público cambia de tema y solo muestra su apego «a escondidas».", false], ["C", "una indiferencia completa frente a la demolición de la casa familiar.", "El gesto de apretar la llave a escondidas muestra que la pérdida sí le importa.", false], ["D", "un reproche al hablante por haber conservado la llave.", "La madre no reprocha nada; solo evita la conversación.", false]]}, {"id": "LCC-104", "niv": 3, "cp": "lc_reflexion", "cn": "", "e": "En la estrofa (4), al llamar a la llave «un recibo», el hablante", "f": "Estrofa (4)", "vis": "", "o": [["A", "la convierte en constancia de que la casa y lo vivido en ella fueron reales.", "Los versos siguientes explican la metáfora: «la prueba de que algo estuvo». Como un recibo, la llave certifica algo que ocurrió.", true], ["B", "sugiere que la llave le permite volver a la casa cada vez que quiera.", "Aunque en la estrofa (1) la llave «abre» el recuerdo cada noche, en la estrofa (4) el «recibo» se explica como «la prueba de que algo estuvo», no como un medio para regresar.", false], ["C", "sugiere que la casa podrá recuperarse algún día.", "La llave prueba que algo «estuvo», en pasado; no anuncia ninguna recuperación.", false], ["D", "anuncia que reclamará una indemnización económica por la demolición.", "Toma «recibo» en sentido comercial literal; el poema no habla de dinero ni de reclamos.", false]]}]}, {"comp": "lectura_critica", "sim": "s11-3", "ses": 1, "ind": "Cuento: un penalti en la final del torneo del barrio", "tt": "Texto literario", "texto": "(1) En el torneo del barrio La Esperanza la cancha era de tierra y los arcos no tenían malla, así que cada gol había que ir a buscarlo calle abajo. Aquel domingo, el equipo de Marlene llegó a la final sin haber perdido un partido, y ella, que tapaba desde los nueve años, no había recibido un solo gol en el tiempo reglamentario de ningún partido.\n\n(2) El partido terminó cero a cero y se fue a penaltis. Después de cinco cobros por bando seguían igualados, y empezó la muerte súbita. El equipo de Marlene anotó el sexto. Si el siguiente cobrador fallaba, el torneo era suyo. Entonces, del otro lado, salió a patear Julián, su primo, el mismo que le había enseñado a tirarse a los pies del rival cuando ninguno de los dos era todavía tan alto como para alcanzar el travesaño.\n\n(3) —Te lo voy a poner a la izquierda —le dijo él, sonriendo, mientras acomodaba el balón.\n—Eso mismo me dijiste en el patio de la abuela, y lo pateaste a la derecha —contestó ella.\n\n(4) Nadie más los oyó. Las graderías, que eran en realidad tres filas de ladrillos y una moto parqueada, gritaban nombres y apuestas. Marlene pensó que su primo conocía todos sus trucos, y que ella conocía todos los de él, de modo que en ese instante no servía ninguno. Decidió no pensar. Se quedó quieta en el centro, con los brazos abiertos, como cuando de niños jugaban a que el arco era una iglesia y ella el santo de la puerta.\n\n(5) Julián tomó carrera. Pateó al centro, suave, con la confianza de quien espera ver al arquero lanzarse a un lado. El balón le pegó a Marlene en el pecho y quedó dormido a sus pies.\n\n(6) Hubo un segundo de silencio y después el estruendo. Sus compañeros la levantaron en hombros; alguien sacó una olla y empezó a golpearla con una cuchara. Desde arriba, Marlene buscó a Julián. Lo encontró sentado en la tierra, sacudiéndose las rodillas y riéndose solo.\n\n(7) Esa noche, en la casa de la abuela, él le preguntó por qué no se había movido.\n—Porque los dos sabíamos demasiado —dijo ella—. Y cuando uno sabe demasiado, lo único que queda es esperar.\n\nCuento inédito escrito para este simulacro.", "vis": "", "items": [{"id": "LCC-105", "niv": 1, "cp": "lc_local", "cn": "", "e": "En el cuento, Julián es", "f": "Párrafo (2)", "vis": "", "o": [["A", "el entrenador del equipo rival, que había sido arquero en su juventud.", "Julián es un jugador que cobra el penalti; el cuento no menciona entrenadores.", false], ["B", "el hermano menor de Marlene, que jugaba su primer torneo.", "El texto dice que es su primo, no su hermano, y no menciona que fuera su primer torneo.", false], ["C", "un familiar de Marlene que jugaba en el equipo contrario.", "El párrafo (2) lo presenta así: sale a patear «del otro lado», es «su primo» y le había enseñado «a tirarse a los pies del rival».", true], ["D", "un compañero del equipo de Marlene que cobró el sexto penalti.", "Julián patea por el equipo contrario («del otro lado»); el sexto cobro del equipo de Marlene lo hizo otra persona que el texto no nombra.", false]]}, {"id": "LCC-106", "niv": 1, "cp": "lc_local", "cn": "", "e": "¿Cómo termina el cobro de Julián?", "f": "Párrafo (5)", "vis": "", "o": [["A", "Patea a la izquierda, como había anunciado, y Marlene lo ataja.", "Julián anunció la izquierda, pero pateó al centro.", false], ["B", "Patea a la derecha, como en el patio de la abuela, y Marlene se lanza a ese lado.", "Lo de la derecha ocurrió en la infancia; esta vez pateó al centro y Marlene no se lanzó.", false], ["C", "El balón pega en el travesaño y sale calle abajo.", "El balón no toca el arco: lo detiene el cuerpo de Marlene.", false], ["D", "Marlene lo detiene sin moverse, porque el tiro va directo hacia ella.", "Párrafo (5): «Pateó al centro, suave […]. El balón le pegó a Marlene en el pecho y quedó dormido a sus pies».", true]]}, {"id": "LCC-107", "niv": 2, "cp": "lc_global", "cn": "", "e": "Dentro del relato, el diálogo del párrafo (3) sirve para", "f": "Párrafos (3) y (4)", "vis": "", "o": [["A", "indicar que Julián y Marlene estaban peleados desde que eran niños.", "El tono es de complicidad: Julián habla «sonriendo», ella le recuerda un juego de infancia y esa noche conversan en casa de la abuela.", false], ["B", "revelar que el público conocía de antemano la estrategia de cada jugador.", "El párrafo (4) aclara que «nadie más los oyó».", false], ["C", "demostrar que Julián suele cumplir lo que anuncia antes de patear.", "Marlene recuerda justamente lo contrario: él anunció la izquierda y pateó a la derecha.", false], ["D", "mostrar que se conocen desde niños y que el anuncio puede ser un engaño.", "Marlene recuerda que en el patio de la abuela él anunció un lado y pateó al otro: el diálogo revela la historia compartida y siembra la duda sobre el anuncio.", true]]}, {"id": "LCC-108", "niv": 2, "cp": "lc_global", "cn": "", "e": "Según el relato, Marlene decide quedarse quieta en el centro porque", "f": "Párrafos (4) y (7)", "vis": "", "o": [["A", "concluye que, como cada uno conoce los trucos del otro, adivinar no sirve.", "Párrafo (4): «su primo conocía todos sus trucos, y […] ella conocía todos los de él, de modo que en ese instante no servía ninguno. Decidió no pensar»; lo confirma su respuesta final del párrafo (7).", true], ["B", "recuerda que Julián, cuando eran niños, siempre pateaba al centro en el patio.", "El único recuerdo que menciona el texto es un cobro de la infancia que fue a la derecha, no al centro.", false], ["C", "estaba agotada después de atajar todos los cobros anteriores.", "El texto no menciona cansancio; su decisión se explica por el razonamiento sobre los trucos que ambos conocían.", false], ["D", "Julián le había anunciado que patearía al centro.", "Julián anunció que patearía a la izquierda.", false]]}, {"id": "LCC-109", "niv": 2, "cp": "lc_reflexion", "cn": "", "e": "Al describir las graderías como «tres filas de ladrillos y una moto parqueada» (párrafo 4), el narrador", "f": "Párrafos (1) y (4)", "vis": "", "o": [["A", "denuncia el abandono en que las autoridades tienen los escenarios deportivos del barrio.", "El texto no hace ninguna denuncia ni menciona autoridades; es una valoración ajena al relato.", false], ["B", "muestra que al público no le interesaba el partido.", "El mismo párrafo dice que las graderías «gritaban nombres y apuestas», y el párrafo (6) narra el estruendo de la celebración.", false], ["C", "contrasta con humor la palabra «graderías» con la modestia del escenario del barrio.", "La expresión «que eran en realidad» desmiente con ironía la palabra «graderías», en coherencia con la cancha de tierra y los arcos sin malla del párrafo (1).", true], ["D", "exagera la cantidad de público para darle grandeza al partido.", "Ocurre lo contrario: la descripción reduce las «graderías» a unos ladrillos y una moto.", false]]}, {"id": "LCC-110", "niv": 3, "cp": "lc_reflexion", "cn": "", "e": "¿Cuál de los siguientes enunciados expresa mejor la idea que sugiere la respuesta final de Marlene?", "f": "Párrafo (7)", "vis": "", "o": [["A", "Entre rivales que se conocen bien, la paciencia vale más que los trucos.", "Marlene explica que «los dos sabíamos demasiado» y que entonces «lo único que queda es esperar»: el conocimiento mutuo anula los trucos y la espera tranquila resulta decisiva.", true], ["B", "Conocer bien al rival es la única manera segura de vencerlo.", "La frase sugiere lo contrario: conocerse demasiado hizo inútiles los trucos de ambos.", false], ["C", "En el deporte, la experiencia de los mayores vence a la de los más jóvenes.", "El cuento no plantea una diferencia de edad decisiva entre los primos.", false], ["D", "Los lazos familiares deberían quedar por fuera de las competencias deportivas, incluso en el barrio.", "Es una opinión que el relato no expresa; los primos terminan el día juntos en casa de la abuela, sin conflicto.", false]]}]}, {"comp": "lectura_critica", "sim": "s11-3", "ses": 1, "ind": "Ensayo: la duda metódica de Descartes", "tt": "Texto filosófico", "texto": "(1) Imaginemos a alguien que quiere construir una casa que no se derrumbe. Antes de poner un ladrillo revisará el terreno; si sospecha que hay arena movediza, no le bastará con que la mayor parte del suelo parezca firme: cavará hasta encontrar la roca. Algo semejante propuso el filósofo francés René Descartes, en el siglo XVII, para el conocimiento. Si queremos saber algo con certeza, pensaba, debemos examinar los cimientos de todo lo que creemos y apartar, al menos por un tiempo, cualquier creencia de la que sea posible dudar, aunque sea un poco.\n\n(2) El procedimiento es radical. Los sentidos nos engañan a veces —una torre cuadrada puede parecer redonda a lo lejos—, y no es prudente confiar del todo en quien nos ha engañado alguna vez. Además, en los sueños creemos ver y tocar cosas que no existen, y no hay una señal segura que distinga la vigilia del sueño. Descartes llega a imaginar incluso un genio maligno, muy poderoso, que se dedicara a engañarnos hasta en las verdades matemáticas más simples.\n\n(3) Conviene aclarar que esta duda no es la del escéptico que se rinde. Descartes no duda porque crea que nada puede saberse, sino para encontrar algo que resista a la duda. Es una duda metódica: un instrumento, no un destino.\n\n(4) Y lo encuentra. Por mucho que dude, por mucho que el genio me engañe, hay algo que no puede ser falso mientras lo pienso: que yo, el que duda, existo. Para ser engañado hay que ser algo. De ahí la conclusión que suele resumirse en la fórmula «pienso, luego existo». Esta certeza no depende de los sentidos ni de que el mundo exterior sea real; se sostiene sola.\n\n(5) Muchos críticos han señalado que, una vez en la roca, a Descartes le cuesta volver a levantar la casa: para demostrar que el mundo exterior existe tiene que apoyarse en la existencia de un Dios que no engaña, un paso que pocos lectores actuales aceptan. Pero incluso quienes rechazan esa reconstrucción reconocen el valor del gesto inicial: no aceptar algo como verdadero solo porque siempre lo hemos creído.\n\nTexto escrito para este simulacro a partir de ideas de René Descartes.", "vis": "", "items": [{"id": "LCC-111", "niv": 1, "cp": "lc_local", "cn": "", "e": "Según el párrafo (2), no es prudente confiar del todo en los sentidos porque", "f": "Párrafo (2)", "vis": "", "o": [["A", "no pueden distinguir los objetos cercanos de los lejanos.", "El ejemplo de la torre muestra un engaño ocasional a la distancia, no una incapacidad general de distinguir lo cercano de lo lejano.", false], ["B", "solo funcionan correctamente mientras soñamos.", "El texto dice que en los sueños creemos percibir cosas que no existen, no que los sentidos funcionen mejor al soñar.", false], ["C", "únicamente la matemática informa sobre el mundo.", "El texto no afirma eso; de hecho, el genio maligno pone en duda incluso las verdades matemáticas.", false], ["D", "ya nos han fallado alguna vez, como con la torre vista a lo lejos.", "El párrafo dice: «Los sentidos nos engañan a veces […], y no es prudente confiar del todo en quien nos ha engañado alguna vez».", true]]}, {"id": "LCC-112", "niv": 2, "cp": "lc_global", "cn": "", "e": "¿Qué función cumple el párrafo (3) dentro del texto?", "f": "Párrafo (3)", "vis": "", "o": [["A", "Presentar una objeción que los críticos han formulado contra el método de duda de Descartes.", "Las objeciones de los críticos aparecen en el párrafo (5), no en el (3).", false], ["B", "Exponer la primera certeza que Descartes encuentra.", "La certeza de la propia existencia se presenta en el párrafo (4).", false], ["C", "Aclarar que la duda de Descartes es un medio para llegar a la certeza, no escepticismo.", "El párrafo distingue la duda cartesiana de la del «escéptico que se rinde» y la define como «un instrumento, no un destino».", true], ["D", "Dar ejemplos de los engaños de los sentidos y de los sueños.", "Esos ejemplos están en el párrafo (2).", false]]}, {"id": "LCC-113", "niv": 2, "cp": "lc_global", "cn": "", "e": "En la comparación que abre y cierra el texto, la «roca» corresponde a", "f": "Párrafos (1), (4) y (5)", "vis": "", "o": [["A", "la certeza de que existe quien duda, aun si lo demás falla.", "La roca es lo que se busca al cavar (párrafo 1) y, según el párrafo (5), Descartes llega a ella con la certeza del párrafo (4): «yo, el que duda, existo».", true], ["B", "la existencia de un Dios que no engaña a quien piensa.", "Según el párrafo (5), a Dios recurre Descartes después, para «volver a levantar la casa», no como el fondo firme que encuentra al dudar.", false], ["C", "la información que llega a través de los sentidos.", "Los sentidos son parte del terreno dudoso, como la arena movediza, según el párrafo (2).", false], ["D", "las creencias que la mayoría de la gente acepta.", "Justamente esas creencias son las que se ponen en duda; el texto valora no aceptar algo «solo porque siempre lo hemos creído».", false]]}, {"id": "LCC-114", "niv": 3, "cp": "lc_reflexion", "cn": "", "e": "¿Cuál de las siguientes situaciones aplica mejor el «gesto inicial» que el autor valora en el párrafo (5)?", "f": "Párrafos (3) y (5)", "vis": "", "o": [["A", "Un joven cree una noticia porque la han compartido miles de personas.", "Aceptar algo por la cantidad de personas que lo creen no implica examinar sus fundamentos.", false], ["B", "Una persona da por cierto un hecho porque lo vio con sus propios ojos.", "Confiar sin examen en los sentidos es lo contrario de la duda metódica (párrafo 2).", false], ["C", "Un investigador rechaza todas las teorías porque está convencido de que nada puede saberse con certeza.", "Esa es la actitud del «escéptico que se rinde» (párrafo 3), que el texto distingue de la duda cartesiana.", false], ["D", "Una estudiante examina si tiene fundamento una regla que su familia repite desde hace años.", "El gesto valorado es «no aceptar algo como verdadero solo porque siempre lo hemos creído»: examinar los fundamentos de una creencia heredada.", true]]}]}, {"comp": "lectura_critica", "sim": "s11-3", "ses": 1, "ind": "Ensayo: Hume, la causalidad y la costumbre", "tt": "Texto filosófico", "texto": "(1) Cuando una bola de billar golpea a otra y esta se mueve, decimos sin dudarlo que la primera causó el movimiento de la segunda. Pero ¿qué vemos exactamente? El filósofo escocés David Hume, en el siglo XVIII, propuso mirar con calma. Vemos una bola que avanza, el contacto y luego la otra bola en movimiento. Vemos una cosa tras otra. Lo que no vemos por ningún lado es una fuerza, un lazo o una «necesidad» que obligue a la segunda bola a moverse.\n\n(2) ¿De dónde sale, entonces, nuestra seguridad? No de la razón sola: si nunca hubiéramos visto chocar dos objetos, ningún razonamiento nos permitiría adivinar qué pasará; podríamos imaginar sin contradicción que la segunda bola se queda quieta o que la primera rebota hacia atrás. Tampoco de una sola observación, pues un único choque no nos enseña que siempre ocurrirá lo mismo.\n\n(3) Según Hume, la respuesta está en la costumbre. Después de ver muchas veces que a un tipo de suceso le sigue otro, la mente se acostumbra a pasar del primero al segundo, y esa expectativa es lo que llamamos conexión causal. La necesidad no está en las bolas, sino en nosotros: es un hábito que se ha formado con la repetición.\n\n(4) La consecuencia es incómoda. Todo lo que esperamos del futuro —que el sol salga mañana, que el pan alimente, que el fuego queme— se apoya en el supuesto de que la naturaleza seguirá comportándose como hasta ahora. Y ese supuesto no puede demostrarse sin caer en un círculo: decir que el futuro se parecerá al pasado porque hasta ahora siempre ha sido así es usar como prueba justamente lo que se quería probar.\n\n(5) Hume no concluye que debamos dejar de comer pan o acercar la mano al fuego. La costumbre, sostiene, es la gran guía de la vida humana, y sin ella no sabríamos actuar. Lo que pide es modestia: reconocer que nuestras creencias más firmes sobre el mundo descansan menos en demostraciones que en hábitos bien asentados.\n\nTexto escrito para este simulacro a partir de ideas de David Hume.", "vis": "", "items": [{"id": "LCC-115", "niv": 1, "cp": "lc_local", "cn": "", "e": "Según el párrafo (1), cuando se observa el choque de dos bolas de billar, lo que realmente se ve es", "f": "Párrafo (1)", "vis": "", "o": [["A", "la conexión necesaria que une los dos movimientos.", "La «necesidad» es justamente lo que el texto dice que no se ve.", false], ["B", "la fuerza que la primera bola le transmite a la segunda al tocarla.", "El texto dice expresamente que no vemos «una fuerza».", false], ["C", "un hecho seguido de otro, sin un vínculo visible entre ellos.", "El párrafo enumera lo que vemos: «una bola que avanza, el contacto y luego la otra bola en movimiento. Vemos una cosa tras otra».", true], ["D", "la ley física que explica por qué se mueve la segunda bola.", "El párrafo no menciona leyes físicas; solo describe la sucesión de lo observado.", false]]}, {"id": "LCC-116", "niv": 2, "cp": "lc_global", "cn": "", "e": "De acuerdo con el texto, para Hume la «necesidad» que atribuimos a las relaciones de causa y efecto", "f": "Párrafos (2), (3) y (5)", "vis": "", "o": [["A", "es una expectativa que la mente forma a partir de experiencias repetidas.", "Párrafo (3): la mente «se acostumbra a pasar del primero al segundo»; la necesidad «no está en las bolas, sino en nosotros», como hábito formado por la repetición.", true], ["B", "se conoce plenamente desde la primera vez que se observa un suceso.", "El párrafo (2) dice que un único choque no nos enseña que siempre ocurrirá lo mismo.", false], ["C", "es una ilusión que debemos abandonar para poder actuar de manera racional.", "El párrafo (5) dice lo contrario: la costumbre es la guía de la vida y sin ella no sabríamos actuar.", false], ["D", "es una propiedad de los objetos que la razón descubre al analizarlos.", "El párrafo (2) niega que la razón sola permita adivinar los efectos, y el (3) ubica la necesidad en nosotros, no en los objetos.", false]]}, {"id": "LCC-117", "niv": 3, "cp": "lc_reflexion", "cn": "", "e": "Según el párrafo (4), el razonamiento «el futuro se parecerá al pasado porque hasta ahora siempre ha sido así» es defectuoso porque", "f": "Párrafo (4)", "vis": "", "o": [["A", "confunde la causa de un suceso con su efecto.", "El texto no describe una inversión entre causa y efecto, sino un razonamiento que presupone su conclusión.", false], ["B", "contradice lo que muestra la experiencia diaria.", "El texto no dice que contradiga la experiencia; la experiencia diaria parece confirmarlo, y aun así no lo demuestra.", false], ["C", "se basa en un número demasiado pequeño de observaciones.", "El problema señalado no es la cantidad de casos: aunque fueran muchísimos, el razonamiento seguiría siendo circular.", false], ["D", "da por supuesto aquello que pretende demostrar.", "El texto lo califica de «círculo»: usa «como prueba justamente lo que se quería probar», es decir, que la naturaleza seguirá comportándose igual.", true]]}, {"id": "LCC-118", "niv": 2, "cp": "lc_reflexion", "cn": "", "e": "¿Cuál de las siguientes situaciones ilustra mejor la tesis de Hume tal como la presenta el texto?", "f": "Párrafos (1), (2) y (3)", "vis": "", "o": [["A", "Un viajero prueba una vez una fruta desconocida y asegura que todas las de su especie son dulces.", "El párrafo (2) dice que una sola observación no enseña que siempre ocurrirá lo mismo; la tesis de Hume habla de la repetición.", false], ["B", "Un científico observa con un microscopio el lazo invisible que une una causa con su efecto.", "Contradice el texto, según el cual esa fuerza o lazo no se ve «por ningún lado».", false], ["C", "Un niño que se ha quemado varias veces con la estufa retira la mano al acercarse a ella.", "Ilustra la tesis del párrafo (3): la repetición de una experiencia crea en la mente la expectativa del efecto, sin que medie una demostración.", true], ["D", "Una matemática demuestra un teorema sin hacer ningún experimento.", "Es un caso de razonamiento puro; el texto trata de las expectativas sobre hechos del mundo, que según Hume no salen de la razón sola.", false]]}]}, {"comp": "lectura_critica", "sim": "s11-3", "ses": 1, "ind": "Ensayo: el giro de Kant en la teoría del conocimiento", "tt": "Texto filosófico", "texto": "(1) A finales del siglo XVIII, la filosofía del conocimiento parecía atrapada entre dos bandos. De un lado, los racionalistas, como Descartes, confiaban en que la razón por sí sola podía alcanzar verdades sobre el mundo. Del otro, los empiristas, como Hume, sostenían que todo conocimiento viene de la experiencia, y con ello dejaban sin piso firme muchas de nuestras certezas. El alemán Immanuel Kant pensó que ambos tenían parte de razón y que el error estaba en una suposición compartida: que conocer consiste en que la mente se ajuste a los objetos.\n\n(2) Kant propuso invertir el planteamiento: ¿y si son los objetos, tal como los conocemos, los que se ajustan a la manera en que la mente los recibe? Él mismo comparó este giro con el de Copérnico, quien, al no poder explicar el movimiento de los astros suponiendo que giraban alrededor del observador, probó a suponer que era el observador el que giraba.\n\n(3) Según Kant, la experiencia aporta el material: colores, sonidos, texturas. Pero ese material llega ya organizado por formas que pone el sujeto. Todo lo que percibimos lo percibimos en el espacio y en el tiempo, y todo lo que comprendemos lo enlazamos con conceptos como el de causa. No aprendemos esas formas de la experiencia; son la condición para que haya experiencia. Una imagen escolar, imperfecta como todas, ayuda: es como si lleváramos unas gafas que no podemos quitarnos y que dan cierta forma a todo lo que vemos.\n\n(4) Esta idea tiene un precio. Si solo conocemos las cosas tal como se nos aparecen, nunca podremos saber cómo son en sí mismas, independientemente de nosotros. Kant distingue así entre el fenómeno, lo que aparece a nuestras facultades, y la cosa en sí, que podemos pensar pero no conocer. A cambio, gana algo valioso: puesto que el espacio, el tiempo y la causalidad los pone la mente, podemos tener conocimientos universales y necesarios sobre todo lo que llegue a aparecernos, algo que el empirismo de Hume parecía haber vuelto imposible.\n\n(5) En un pasaje muy citado, Kant afirma que los pensamientos sin contenido son vacíos y las intuiciones sin conceptos son ciegas. Ni la razón sola ni la experiencia sola bastan: el conocimiento nace de su encuentro.\n\nTexto escrito para este simulacro a partir de ideas de Immanuel Kant.", "vis": "", "items": [{"id": "LCC-119", "niv": 1, "cp": "lc_local", "cn": "", "e": "Según el párrafo (4), la «cosa en sí» es", "f": "Párrafo (4)", "vis": "", "o": [["A", "una forma, como el espacio o el tiempo, que la mente impone a lo percibido.", "Las formas las pone el sujeto (párrafo 3); la cosa en sí es lo que quedaría fuera de ellas.", false], ["B", "lo que algo es por sí mismo, más allá de cómo lo percibimos.", "El párrafo define la cosa en sí como lo que algo es «independientemente de nosotros» y dice que «podemos pensar pero no conocer».", true], ["C", "lo que aparece a nuestras facultades de conocimiento.", "Esa es la definición de fenómeno que da el mismo párrafo.", false], ["D", "el material de colores, sonidos y texturas que aporta la experiencia.", "Ese material se describe en el párrafo (3) y forma parte de lo que se nos aparece.", false]]}, {"id": "LCC-120", "niv": 2, "cp": "lc_global", "cn": "", "e": "Según el texto, ¿qué relación tiene la propuesta de Kant con las posiciones de racionalistas y empiristas?", "f": "Párrafos (1), (3), (4) y (5)", "vis": "", "o": [["A", "Toma algo de ambas: la experiencia da el material y la mente, las formas.", "El párrafo (1) dice que «ambos tenían parte de razón»; el (3) atribuye el material a la experiencia y las formas al sujeto, y el (5) concluye que ni la razón sola ni la experiencia sola bastan.", true], ["B", "Refuta el empirismo y confirma que la razón sola alcanza verdades sobre el mundo.", "El párrafo (5) niega que la razón sola baste para conocer.", false], ["C", "Acepta el empirismo de Hume y renuncia a los conocimientos universales.", "El párrafo (4) dice que Kant recupera conocimientos universales y necesarios que el empirismo de Hume parecía haber vuelto imposibles.", false], ["D", "Rechaza ambas posiciones y concluye que ningún conocimiento es posible.", "Kant no niega el conocimiento: lo limita a los fenómenos y explica cómo es posible.", false]]}, {"id": "LCC-121", "niv": 3, "cp": "lc_global", "cn": "", "e": "En el párrafo (2), la referencia a Copérnico cumple la función de", "f": "Párrafo (2)", "vis": "", "o": [["A", "mostrar que Kant se dedicó principalmente a la astronomía y no a la filosofía.", "El texto presenta a Kant como filósofo del conocimiento; la mención de Copérnico es una comparación.", false], ["B", "ilustrar con un giro de perspectiva semejante la inversión que propone Kant.", "Copérnico dejó de suponer que los astros giraban alrededor del observador; Kant deja de suponer que la mente se ajusta a los objetos. La comparación ilustra el giro, no lo prueba.", true], ["C", "contraponer la ciencia moderna a la filosofía especulativa.", "La comparación acerca ambas ideas en lugar de oponerlas.", false], ["D", "demostrar con un hecho astronómico que la teoría de Kant es verdadera.", "Una analogía aclara una idea, pero no la demuestra; el texto no presenta el dato astronómico como prueba.", false]]}, {"id": "LCC-122", "niv": 3, "cp": "lc_reflexion", "cn": "", "e": "De acuerdo con la posición de Kant expuesta en el texto, ¿cuál de los siguientes enunciados es una consecuencia válida?", "f": "Párrafos (3), (4) y (5)", "vis": "", "o": [["A", "Como la razón organiza la experiencia, puede conocer el mundo sin necesidad de percibirlo.", "Contradice el párrafo (5): los pensamientos sin contenido son vacíos; la razón sola no basta.", false], ["B", "Ninguna afirmación sobre la causa de los fenómenos puede ser universal, porque la causalidad se aprende por costumbre.", "Esa es la consecuencia del empirismo de Hume; el texto dice que Kant considera la causalidad una forma que pone la mente y que por eso permite conocimientos universales.", false], ["C", "Una ciencia de los fenómenos puede tener leyes universales, pero no conocer el mundo tal como es en sí.", "Se sigue del párrafo (4): las formas que pone la mente permiten conocimientos universales sobre lo que aparece, a cambio de no conocer la cosa en sí.", true], ["D", "Con instrumentos suficientemente precisos, la ciencia llegará a conocer las cosas en sí.", "Para Kant la cosa en sí no puede conocerse, pues todo lo que conocemos pasa por las formas de la mente; un instrumento no cambia eso.", false]]}]}, {"comp": "lectura_critica", "sim": "s11-3", "ses": 1, "ind": "Crónica: un archivo de voces en un pueblo ribereño", "tt": "Texto informativo", "texto": "La caja de zapatos\n\n(1) En Puerto Cedro, un pueblo de pescadores a orillas de un río que pocos fuera de la región saben nombrar, la memoria cabe en una caja de zapatos. Adentro hay cuarenta y dos casetes, una grabadora con la tapa pegada con cinta y un cuaderno escolar en el que la profesora Aurora Quintero apuntó, durante once años, quién hablaba en cada cinta y de qué.\n\n(2) Empezó por accidente. En 1998 pidió a sus alumnos de quinto que preguntaran a sus abuelos cómo era el pueblo antes de la carretera. Esperaba dibujos y frases cortas; recibió una avalancha. Los abuelos no querían contestar en tres renglones: querían venir al salón. Al tercer visitante, Aurora pidió prestada una grabadora.\n\n(3) Así quedaron guardadas la historia de la creciente que se llevó la iglesia vieja, las canciones que se cantaban para remendar redes y los nombres de los barcos que traían sal y se llevaban plátano. También quedaron versiones que no coinciden. Don Eliécer jura que la creciente fue en Semana Santa; su hermana Rosa, en la cinta siguiente, asegura que fue en diciembre, «porque ya estaban los pesebres armados». Aurora no corrigió a ninguno. En el cuaderno escribió, simplemente: «Los dos estaban ahí».\n\n(4) Hoy la mayoría de esas voces ya no existe fuera de la caja. El año pasado llegó un estudiante de historia de la universidad departamental a digitalizar las cintas, y lo primero que preguntó fue cuál de los dos hermanos tenía razón. Aurora le contestó que esa no era la pregunta. «Lo que importa», le dijo, «es por qué cada uno se acuerda de lo que se acuerda: él era monaguillo y ella hacía los pesebres».\n\n(5) Los archivos oficiales de Puerto Cedro guardan otras cosas: escrituras, actas del concejo, un censo. Allí la creciente ocupa una línea con fecha exacta. En la caja de zapatos ocupa catorce cintas. Ninguno de los dos archivos sobra; pero si uno quiere saber qué se sintió al ver flotar las bancas de la iglesia, solo hay un lugar donde buscar.\n\nCrónica escrita para este simulacro. Puerto Cedro y sus personajes son ficticios.", "vis": "", "items": [{"id": "LCC-123", "niv": 1, "cp": "lc_local", "cn": "", "e": "Según la crónica, la colección de grabaciones comenzó con", "f": "Párrafo (2)", "vis": "", "o": [["A", "una petición del concejo para registrar la historia de la creciente.", "El concejo aparece solo como parte de los archivos oficiales; no pidió grabaciones.", false], ["B", "un proyecto de la universidad departamental para digitalizar testimonios orales.", "El estudiante universitario llegó muchos años después (párrafo 4) a digitalizar unas cintas que ya existían.", false], ["C", "la iniciativa de los pescadores, que querían dejar grabadas sus canciones de trabajo.", "Las canciones quedaron grabadas, pero la iniciativa no fue de los pescadores sino una tarea escolar.", false], ["D", "una tarea escolar sobre cómo era el pueblo antes, según los abuelos.", "Párrafo (2): Aurora pidió a sus alumnos de quinto que preguntaran a sus abuelos cómo era el pueblo antes de la carretera; los abuelos quisieron ir al salón y ella consiguió una grabadora.", true]]}, {"id": "LCC-124", "niv": 2, "cp": "lc_global", "cn": "", "e": "En el párrafo (3), la nota de Aurora «Los dos estaban ahí» expresa que", "f": "Párrafos (3) y (4)", "vis": "", "o": [["A", "Rosa tiene razón, porque su recuerdo de los pesebres es una prueba concreta.", "Aurora no da la razón a ninguno; precisamente no corrige a ninguno de los dos.", false], ["B", "los hermanos presenciaron dos crecientes distintas en épocas diferentes del año.", "El texto habla de una sola creciente, la que se llevó la iglesia vieja, recordada en fechas distintas.", false], ["C", "ambos testimonios valen como relatos de testigos, aunque no coincidan.", "Aurora no corrige a ninguno y anota que los dos presenciaron la creciente; en el párrafo (4) aclara que lo importante no es quién tiene razón.", true], ["D", "ninguno de los dos hermanos recuerda bien y sus testimonios deben descartarse.", "Aurora conserva ambas versiones; no las descarta.", false]]}, {"id": "LCC-125", "niv": 2, "cp": "lc_global", "cn": "", "e": "¿Qué relación establece el párrafo (5) entre los archivos oficiales y la caja de zapatos?", "f": "Párrafo (5)", "vis": "", "o": [["A", "Se complementan: unos dan datos precisos y la otra, la experiencia vivida.", "El párrafo dice que en los oficiales la creciente es «una línea con fecha exacta», que en la caja ocupa catorce cintas y que «ninguno de los dos archivos sobra».", true], ["B", "Los archivos oficiales hacen innecesaria la colección de la profesora.", "Contradice la frase «ninguno de los dos archivos sobra».", false], ["C", "La caja de zapatos corrige los errores de fecha que contienen los archivos oficiales.", "El texto no dice que los archivos oficiales tengan errores; atribuye a estos la fecha exacta.", false], ["D", "Ambos guardan la misma información sobre la creciente, en formatos distintos.", "Guardan información diferente: una fecha precisa frente a catorce cintas de experiencias.", false]]}, {"id": "LCC-126", "niv": 3, "cp": "lc_reflexion", "cn": "", "e": "¿Cuál de las siguientes afirmaciones se opone a la manera en que Aurora entiende la memoria?", "f": "Párrafos (3), (4) y (5)", "vis": "", "o": [["A", "Conservar las voces de los mayores es una forma de cuidar la memoria de una comunidad.", "Coincide con la labor de Aurora, que guardó durante once años las voces del pueblo.", false], ["B", "Los recuerdos revelan tanto del suceso como de la persona que lo recuerda.", "Coincide con Aurora: explica la
