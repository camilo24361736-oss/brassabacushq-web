f": "Análisis de fuentes primarias", "vis": "", "o": [["A", "Que la posición del autor lo inclinaba a defender el orden señorial y a juzgar con dureza a los campesinos.", "El monje vivía bajo la protección de un señor feudal y presenta la revuelta como una ofensa al orden divino; su rol social influye en el relato, por lo que debe contrastarse con otras fuentes.", true], ["B", "Que la crónica demuestra que en la Edad Media los campesinos no pagaban tributos.", "El texto dice que se negaron a pagar los tributos, lo que indica que estaban obligados a pagarlos.", false], ["C", "Que debe descartarse por completo, porque solo los propios campesinos podían escribir con veracidad sobre la revuelta.", "Una fuente sesgada no se descarta: se analiza críticamente. Además, en la Edad Media la mayoría de los campesinos no sabía escribir.", false], ["D", "Que, por haber sido escrita por un religioso, la crónica es neutral y no necesita contrastarse.", "Ser religioso no hace neutral al autor; el texto muestra una valoración explícita («castigados como merecían»).", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "s11-3", "ses": 2, "ind": "Modelo de Estado social de derecho", "tt": "", "texto": "El artículo 1 de la Constitución establece que Colombia es un Estado social de derecho, fundado en el respeto de la dignidad humana, en el trabajo y la solidaridad de las personas que la integran y en la prevalencia del interés general.", "vis": "", "items": [{"id": "SCC-121", "niv": 2, "cp": "sc_reflexivo_sistemico", "cn": "", "e": "¿Cuál de las siguientes decisiones es más coherente con ese modelo de Estado?", "f": "Constitución Política de 1991, arts. 1, 6 y 121", "vis": "", "o": [["A", "Destinar recursos públicos para que las personas en situación de pobreza accedan a salud y educación.", "El Estado social no se limita a reconocer libertades: también actúa para garantizar condiciones materiales de vida digna, con base en la dignidad humana y la solidaridad.", true], ["B", "Dar prioridad a las decisiones del gobierno sobre los fallos de los jueces cuando se trate de obras de interés general.", "La prevalencia del interés general no autoriza a desconocer las decisiones judiciales: en un Estado de derecho las autoridades están sometidas a la ley y a los jueces.", false], ["C", "Suspender los derechos de las minorías cuando así lo decida la mayoría en una votación.", "Contradice el respeto de la dignidad humana y el carácter pluralista del Estado (artículo 1); los derechos fundamentales no dependen de una votación.", false], ["D", "Permitir que las autoridades amplíen sus propias funciones cuando lo consideren conveniente para el interés general.", "Viola el componente «de derecho»: ninguna autoridad puede ejercer funciones distintas de las que le atribuyen la Constitución y la ley (artículos 6 y 121).", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "s11-3", "ses": 2, "ind": "Separación de poderes", "tt": "", "texto": "En un país ficticio se propone una reforma con estas medidas:\n\n(1) El presidente nombrará y podrá destituir libremente a todos los jueces.\n(2) El presidente podrá cerrar el Congreso cuando este rechace sus proyectos.\n(3) Los ciudadanos elegirán al presidente cada cuatro años.", "vis": "", "items": [{"id": "SCC-124", "niv": 2, "cp": "sc_reflexivo_sistemico", "cn": "", "e": "Desde el modelo de separación de poderes formulado por pensadores de la Ilustración como Montesquieu, ¿qué se puede afirmar de la reforma?", "f": "Montesquieu, Del espíritu de las leyes (1748), según Britannica; Constitución de 1991, art. 113", "vis": "", "o": [["A", "Las tres medidas lo fortalecen, porque un ejecutivo fuerte garantiza el equilibrio entre las ramas.", "La concentración de poder en el ejecutivo rompe el equilibrio que busca el modelo.", false], ["B", "Las medidas 1 y 2 lo contradicen, porque concentran en el ejecutivo el control sobre las otras ramas.", "La separación de poderes exige que legislativo, ejecutivo y judicial sean independientes; nombrar y destituir jueces a voluntad y cerrar el Congreso concentran el poder en el presidente.", true], ["C", "Solo la medida 3 lo contradice, porque elegir al presidente por voto popular es incompatible con la separación de poderes.", "La elección popular del jefe del ejecutivo es compatible con la separación de poderes; no afecta la independencia de las otras ramas.", false], ["D", "Ninguna medida lo contradice, porque las tres ramas siguen existiendo formalmente.", "No basta con que las ramas existan: el modelo exige que sean independientes y se controlen mutuamente.", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "s11-3", "ses": 2, "ind": "Descentralización y capacidad municipal", "tt": "", "texto": "La Constitución de 1991 define a Colombia como una república unitaria, descentralizada y con autonomía de sus entidades territoriales; según el artículo 287, estas tienen derecho, entre otros, a gobernarse por autoridades propias. Un municipio pequeño (ficticio) recibe la responsabilidad de administrar sus colegios y su red de salud, pero tiene pocos funcionarios capacitados y bajos ingresos propios.", "vis": "", "items": [{"id": "SCC-125", "niv": 3, "cp": "sc_reflexivo_sistemico", "cn": "", "e": "¿Qué consecuencia es más probable si el municipio asume esas responsabilidades sin apoyo técnico ni financiero adicional?", "f": "Constitución Política de 1991, arts. 1, 286 y 287", "vis": "", "o": [["A", "Los servicios mejorarían, porque al conocer mejor las necesidades locales el municipio administraría con más eficiencia que la Nación.", "Conocer las necesidades locales ayuda, pero el caso señala pocos funcionarios capacitados y bajos ingresos, lo que limita esa ventaja.", false], ["B", "Los servicios no cambiarían, porque la Nación seguiría financiando los colegios y hospitales con recursos adicionales.", "Contradice el supuesto del enunciado: el municipio los asume sin apoyo financiero adicional.", false], ["C", "El municipio perdería autonomía, porque al recibir más funciones quedaría bajo el control directo del departamento.", "Asumir competencias no elimina la autonomía ni cambia su naturaleza de entidad territorial (artículos 286 y 287).", false], ["D", "Las decisiones se acercarían a la comunidad, pero los servicios podrían empeorar por falta de capacidad.", "La descentralización acerca las decisiones a la población, pero su resultado depende de la capacidad técnica y financiera del municipio, que en el caso es baja.", true]]}]}, {"comp": "sociales_ciudadanas", "sim": "s11-3", "ses": 2, "ind": "Origen de la separación de poderes", "tt": "", "texto": "El artículo 113 de la Constitución establece que son ramas del poder público la legislativa, la ejecutiva y la judicial, y que los diferentes órganos del Estado tienen funciones separadas pero colaboran armónicamente para la realización de sus fines.", "vis": "", "items": [{"id": "SCC-126", "niv": 1, "cp": "sc_pensamiento_social", "cn": "", "e": "La idea de dividir el poder para evitar que se concentre en una sola persona o institución fue formulada de manera moderna, en el siglo XVIII, por", "f": "Britannica, «Separation of powers»; Constitución de 1991, art. 113", "vis": "", "o": [["A", "Tomás de Aquino, teólogo de la Edad Media.", "Tomás de Aquino vivió en el siglo XIII y pertenece a la filosofía escolástica medieval.", false], ["B", "Nicolás Maquiavelo, autor renacentista de El príncipe.", "Maquiavelo vivió en los siglos XV y XVI; El príncipe trata sobre cómo se obtiene y conserva el poder, no sobre su división.", false], ["C", "Montesquieu, pensador francés de la Ilustración.", "Montesquieu expuso la separación de los poderes legislativo, ejecutivo y judicial en Del espíritu de las leyes (1748), obra que influyó en las constituciones modernas.", true], ["D", "Karl Marx, crítico del capitalismo en el siglo XIX.", "Marx escribió en el siglo XIX sobre la lucha de clases y el capitalismo, no sobre la separación de poderes.", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "s11-3", "ses": 2, "ind": "Feudalismo", "tt": "", "texto": "En la Europa de la Edad Media se consolidó un sistema en el que un noble, llamado vasallo, juraba fidelidad a otro más poderoso, su señor, mediante una ceremonia conocida como homenaje.", "vis": "", "items": [{"id": "SCC-127", "niv": 1, "cp": "sc_pensamiento_social", "cn": "", "e": "¿Qué recibía normalmente el vasallo a cambio de su fidelidad y de su ayuda militar?", "f": "Concepto de feudalismo y vasallaje (historia medieval)", "vis": "", "o": [["A", "La propiedad de las fábricas textiles del reino.", "Las fábricas se asocian con la Revolución Industrial (siglos XVIII y XIX), no con la Edad Media.", false], ["B", "Un feudo, por lo general tierras, y la protección del señor.", "En el vasallaje feudal, el señor entregaba un feudo (generalmente tierras) y protección al vasallo, quien le debía fidelidad, consejo y ayuda militar.", true], ["C", "Un salario mensual en dinero fijado por un contrato de trabajo.", "El vasallaje era un vínculo personal de fidelidad, no un contrato laboral asalariado, propio de épocas posteriores.", false], ["D", "El derecho a votar en la asamblea de ciudadanos de la ciudad.", "La asamblea de ciudadanos es propia de la democracia ateniense de la Antigüedad, no del vasallaje medieval.", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "s11-3", "ses": 2, "ind": "Democracia ateniense y democracia colombiana", "tt": "", "texto": "En la Atenas del siglo V a. C., la Asamblea (ekklesía) reunía a los ciudadanos para debatir y votar directamente sobre leyes, guerra y paz. En la Colombia actual, según el artículo 3 de la Constitución, la soberanía reside exclusivamente en el pueblo, que la ejerce en forma directa o por medio de sus representantes.", "vis": "", "items": [{"id": "SCC-128", "niv": 2, "cp": "sc_pensamiento_social", "cn": "", "e": "¿Cuál es una diferencia entre la democracia ateniense y la colombiana actual?", "f": "Constitución Política de 1991, arts. 3 y 103; «Democracia ateniense» (ciudadanía y voto)", "vis": "", "o": [["A", "En Atenas un rey hereditario decidía las leyes y la Asamblea solo lo aconsejaba.", "En la Atenas democrática del siglo V a. C. no gobernaba un rey; la Asamblea tomaba las decisiones.", false], ["B", "En Colombia los ciudadanos no pueden decidir ningún asunto de forma directa, porque la Constitución solo establece la democracia representativa.", "El artículo 3 dice que el pueblo ejerce la soberanía en forma directa o por representantes, y el artículo 103 enumera mecanismos de participación directa como el referendo.", false], ["C", "En Atenas solo votaban los varones adultos con ciudadanía; quedaban excluidos las mujeres, los esclavos y los extranjeros residentes.", "En Atenas el derecho a votar se limitaba a los varones adultos ciudadanos; esclavos, mujeres y metecos (extranjeros residentes) no participaban. En Colombia la ciudadanía no excluye por sexo ni por condición social.", true], ["D", "En Atenas el pueblo solo elegía representantes y nunca votaba directamente las leyes.", "Es al revés: en la Asamblea ateniense los ciudadanos votaban directamente.", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "s11-3", "ses": 2, "ind": "Inflación y poder adquisitivo", "tt": "", "texto": "Durante un año, el precio de la canasta de bienes y servicios que compra la familia de Andrés aumentó 10 %, mientras que el ingreso mensual de la familia aumentó 5 %.", "vis": "", "items": [{"id": "SCC-130", "niv": 1, "cp": "sc_pensamiento_social", "cn": "", "e": "¿Qué ocurrió con el poder adquisitivo de esa familia?", "f": "Concepto de inflación y poder adquisitivo; cálculo propio", "vis": "", "o": [["A", "Disminuyó, porque sus ingresos crecieron menos que los precios.", "El poder adquisitivo depende del ingreso frente a los precios: 1,05 / 1,10 ≈ 0,95, así que con su ingreso la familia puede comprar alrededor de 5 % menos que antes.", true], ["B", "Se mantuvo igual, porque tanto los precios como los ingresos subieron.", "Subieron en proporciones distintas (10 % frente a 5 %), así que el poder de compra cambia.", false], ["C", "Aumentó al doble, porque los precios subieron el doble que los ingresos.", "Interpreta al revés la relación: que los precios suban más que el ingreso reduce el poder adquisitivo.", false], ["D", "Aumentó, porque ahora recibe más dinero cada mes.", "Confunde el ingreso nominal con el real: recibir más pesos no implica poder comprar más si los precios subieron aún más.", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "s11-3", "ses": 2, "ind": "Banco de la República", "tt": "", "texto": "Según el artículo 371 de la Constitución, el Banco de la República ejerce las funciones de banca central y está organizado con autonomía administrativa, patrimonial y técnica.", "vis": "", "items": [{"id": "SCC-131", "niv": 2, "cp": "sc_pensamiento_social", "cn": "", "e": "¿Cuál de las siguientes es una de sus funciones básicas según ese artículo?", "f": "Constitución Política de 1991, arts. 119 y 371", "vis": "", "o": [["A", "Aprobar el presupuesto general de la Nación.", "Aprobar el presupuesto es una decisión del Congreso, no del Banco de la República.", false], ["B", "Vigilar la gestión fiscal de las entidades públicas.", "La vigilancia de la gestión fiscal corresponde a la Contraloría General de la República (artículo 119).", false], ["C", "Recaudar el impuesto de renta de las personas y empresas.", "El recaudo de impuestos nacionales lo hace una entidad de la Rama Ejecutiva (la DIAN), no el banco central.", false], ["D", "Administrar las reservas internacionales del país.", "El artículo 371 incluye entre sus funciones básicas regular la moneda, los cambios internacionales y el crédito; emitir la moneda legal; administrar las reservas internacionales y servir como agente fiscal del gobierno.", true]]}]}, {"comp": "sociales_ciudadanas", "sim": "s11-3", "ses": 2, "ind": "Fuentes para decidir sobre seguridad en un parque", "tt": "", "texto": "La junta de acción comunal de un barrio debe decidir si pide a la alcaldía instalar cámaras de seguridad en el parque. Para saber si los robos en el parque han aumentado, cuenta con tres fuentes:\n\n(1) Un video que circula en redes sociales, sin fecha, en el que se ve un robo en un parque que algunos vecinos reconocen como el del barrio.\n(2) El número de denuncias por robo en el parque registradas mes a mes por la Policía durante los dos últimos años.\n(3) Una encuesta hecha por la junta a 50 vecinos sobre qué tan seguros se sienten en el parque.", "vis": "", "items": [{"id": "SCC-133", "niv": 2, "cp": "sc_perspectivas", "cn": "", "e": "¿Qué fuente permite comparar mejor si los robos en el parque aumentaron o disminuyeron?", "f": "Análisis de fuentes: confiabilidad y pertinencia", "vis": "", "o": [["A", "La 1, porque muestra directamente un robo ocurrido en el parque del barrio.", "Un solo video sin fecha muestra un hecho aislado, y ni siquiera es seguro que sea ese parque; no permite comparar periodos.", false], ["B", "La 2, porque registra hechos denunciados de forma comparable a lo largo del tiempo.", "Para saber si algo aumentó se necesitan datos del mismo tipo en distintos momentos; las denuncias mes a mes lo permiten, aunque no recojan los robos que nadie denunció.", true], ["C", "La 1, porque al difundirse mucho en redes ya fue verificada por miles de personas.", "Que un video se comparta mucho no significa que alguien haya verificado su fecha ni su lugar.", false], ["D", "La 3, porque recoge la opinión de los vecinos que usan el parque todos los días del año.", "La encuesta mide la percepción de seguridad, que es útil, pero no registra cuántos robos ocurren ni cómo cambian.", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "s11-3", "ses": 2, "ind": "Páramo y encuesta radial", "tt": "", "texto": "En un municipio de alta montaña se discute si se permite ampliar los cultivos de papa hacia una zona de páramo donde nacen las quebradas que abastecen el acueducto. Una emisora local hizo una encuesta entre 400 personas que llamaron durante su programa de la mañana. La gráfica muestra los resultados (datos ficticios).", "vis": "", "items": [{"id": "SCC-134", "niv": 3, "cp": "sc_perspectivas", "cn": "", "e": "Un concejal afirma: «La encuesta demuestra que la mayoría de los habitantes del municipio apoya ampliar los cultivos». ¿Cuál es la principal limitación de esa conclusión?", "f": "Análisis de fuentes: representatividad de una muestra", "vis": "<div class=\"vfig\"><svg class=\"vg\" viewBox=\"0 0 560 320\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Gráfica 9. ¿Está de acuerdo con ampliar los cultivos de papa hacia el páramo?\" font-family=\"Arial, sans-serif\" font-size=\"12\"><rect width=\"560\" height=\"320\" fill=\"#ffffff\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"13\" fill=\"#1d2433\">Gráfica 9. ¿Está de acuerdo con ampliar los cultivos de papa hacia el páramo?<\/text><line x1=\"60\" y1=\"258.0\" x2=\"540\" y2=\"258.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"262.0\" text-anchor=\"end\" fill=\"#3a4356\">0<\/text><line x1=\"60\" y1=\"221.0\" x2=\"540\" y2=\"221.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"225.0\" text-anchor=\"end\" fill=\"#3a4356\">10<\/text><line x1=\"60\" y1=\"184.0\" x2=\"540\" y2=\"184.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"188.0\" text-anchor=\"end\" fill=\"#3a4356\">20<\/text><line x1=\"60\" y1=\"147.0\" x2=\"540\" y2=\"147.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"151.0\" text-anchor=\"end\" fill=\"#3a4356\">30<\/text><line x1=\"60\" y1=\"110.0\" x2=\"540\" y2=\"110.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"114.0\" text-anchor=\"end\" fill=\"#3a4356\">40<\/text><line x1=\"60\" y1=\"73.0\" x2=\"540\" y2=\"73.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"77.0\" text-anchor=\"end\" fill=\"#3a4356\">50<\/text><line x1=\"60\" y1=\"36.0\" x2=\"540\" y2=\"36.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"40.0\" text-anchor=\"end\" fill=\"#3a4356\">60<\/text><line x1=\"60\" y1=\"258\" x2=\"540\" y2=\"258\" stroke=\"#3a4356\"/><line x1=\"60\" y1=\"258\" x2=\"60\" y2=\"36\" stroke=\"#3a4356\"/><text transform=\"translate(14,147.0) rotate(-90)\" text-anchor=\"middle\" fill=\"#3a4356\">Porcentaje de las respuestas (%)<\/text><text x=\"300.0\" y=\"312\" text-anchor=\"middle\" fill=\"#3a4356\">Respuesta<\/text><text x=\"140.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Sí, ampliar cultivos<\/text><text x=\"300.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">No, proteger el páramo<\/text><text x=\"460.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">No sabe<\/text><rect x=\"84.0\" y=\"43.4\" width=\"112.0\" height=\"214.6\" fill=\"#1660a8\"/><text x=\"140.0\" y=\"39.4\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">58<\/text><rect x=\"244.0\" y=\"128.5\" width=\"112.0\" height=\"129.5\" fill=\"#1660a8\"/><text x=\"300.0\" y=\"124.5\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">35<\/text><rect x=\"404.0\" y=\"232.1\" width=\"112.0\" height=\"25.9\" fill=\"#1660a8\"/><text x=\"460.0\" y=\"228.1\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">7<\/text><\/svg><\/div>", "o": [["A", "Las encuestas nunca sirven para conocer las opiniones de la población sobre asuntos ambientales o económicos.", "Es una generalización: una encuesta con una muestra bien diseñada sí puede servir.", false], ["B", "El 58 % no es una mayoría, porque no alcanza las dos terceras partes de las respuestas.", "Un 58 % sí es mayoría de las respuestas; el problema no es el porcentaje sino quiénes respondieron.", false], ["C", "La muestra no es representativa, porque solo incluye a quienes llamaron a la emisora en ese horario.", "Quienes escuchan ese programa y deciden llamar no representan necesariamente a toda la población; con esa muestra no se puede generalizar al municipio.", true], ["D", "La gráfica no permite saber cuál opción obtuvo más respuestas.", "La gráfica muestra claramente que «Sí, ampliar cultivos» obtuvo el 58 %.", false]]}, {"id": "SCC-135", "niv": 2, "cp": "sc_perspectivas", "cn": "", "e": "De acuerdo con la información del caso, ¿qué interés defendería con mayor probabilidad la empresa de acueducto del municipio?", "f": "Análisis de intereses de actores", "vis": "", "o": [["A", "Construir vías hacia la zona de páramo para facilitar el turismo.", "El caso no relaciona al acueducto con vías ni turismo.", false], ["B", "Ampliar los cultivos para aumentar la producción y la venta de papa del municipio.", "Ese es el interés de quienes cultivan papa, no el de la empresa de acueducto.", false], ["C", "Reemplazar los cultivos de papa del páramo por ganadería, que no afecta las quebradas.", "Cualquier actividad agropecuaria en el páramo afecta su capacidad de regular el agua; el interés del acueducto es conservarlo.", false], ["D", "Conservar el páramo para asegurar el agua que distribuye a la población.", "El texto indica que en el páramo nacen las quebradas que abastecen el acueducto; afectar esa zona pondría en riesgo el agua que la empresa debe suministrar.", true]]}]}, {"comp": "sociales_ciudadanas", "sim": "s11-3", "ses": 2, "ind": "Turismo en un territorio colectivo", "tt": "", "texto": "Un consejo comunitario de una comunidad negra del Pacífico administra un territorio colectivo con playas y manglares. Una empresa de turismo propone construir allí un hotel ecológico. Opiniones (ficticias):\n\nRepresentante legal del consejo comunitario: «El turismo puede traer ingresos, pero las decisiones sobre nuestro territorio las tomamos en asamblea. Queremos que los empleos sean para la comunidad y que no se corte el manglar».\n\nGerente de la empresa: «Necesitamos un contrato de 30 años para que la inversión sea rentable. Capacitaremos a jóvenes de la comunidad como guías».\n\nPescadora de la comunidad: «Si el hotel cierra el acceso a la playa, ¿por dónde vamos a sacar las canoas?».", "vis": "", "items": [{"id": "SCC-138", "niv": 2, "cp": "sc_perspectivas", "cn": "", "e": "¿Qué aspecto genera tensión entre la posición de la pescadora y el proyecto de la empresa?", "f": "Análisis de perspectivas", "vis": "", "o": [["A", "El posible cierre del acceso a la playa que la comunidad usa para pescar.", "La pescadora teme que el hotel bloquee el paso a la playa por donde sacan las canoas, lo que afectaría su trabajo.", true], ["B", "La condición de que no se corte el manglar durante la obra.", "Esa condición la plantea el representante legal del consejo comunitario, no la pescadora.", false], ["C", "La duración del contrato de 30 años que pide la empresa.", "La pescadora no se refiere al contrato.", false], ["D", "La capacitación de jóvenes de la comunidad como guías turísticos del hotel.", "Es una oferta de la empresa que la pescadora no menciona ni cuestiona.", false]]}, {"id": "SCC-139", "niv": 2, "cp": "sc_perspectivas", "cn": "", "e": "La afirmación del representante legal («las decisiones sobre nuestro territorio las tomamos en asamblea») se explica principalmente porque", "f": "Ley 70 de 1993, arts. 4 y 5; Constitución Política de 1991, art. 286", "vis": "", "o": [["A", "el territorio es colectivo y el consejo comunitario es su forma de administración interna.", "La Ley 70 de 1993 reconoce la propiedad colectiva de estas comunidades y establece el consejo comunitario como su forma de administración interna (arts. 4 y 5).", true], ["B", "la empresa ya es dueña de las playas y la comunidad solo puede opinar sobre el diseño del hotel.", "El territorio es colectivo de la comunidad, no de la empresa.", false], ["C", "la Ley 70 de 1993 prohíbe el turismo en los territorios colectivos de las comunidades negras.", "La ley no prohíbe el turismo; además, el representante dice que el turismo puede traer ingresos.", false], ["D", "el consejo comunitario es una entidad territorial, como los municipios, con alcalde y concejo propios.", "Los consejos comunitarios no son entidades territoriales (artículo 286); son la forma de administración interna de las tierras colectivas.", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "s11-3", "ses": 2, "ind": "Una laguna, dos miradas", "tt": "", "texto": "Dos personas opinan sobre una laguna de la Sierra Nevada de Santa Marta (opiniones ficticias):\n\nMamo (autoridad espiritual) de un pueblo indígena de la Sierra: «La laguna es un lugar sagrado: allí se hacen pagamentos para mantener el equilibrio entre las personas y la naturaleza. No puede tratarse como un objeto».\n\nInversionista: «La laguna tiene un gran potencial turístico; un buen hotel cerca generaría muchos ingresos para la región».", "vis": "", "items": [{"id": "SCC-140", "niv": 2, "cp": "sc_perspectivas", "cn": "", "e": "¿A qué se debe principalmente la diferencia entre las dos posiciones?", "f": "Análisis de cosmovisiones y perspectivas", "vis": "", "o": [["A", "A que el mamo se opone al turismo por razones económicas, pues teme perder ingresos de su pueblo.", "El mamo no habla de dinero; su argumento es espiritual.", false], ["B", "A que parten de cosmovisiones distintas sobre el sentido del lugar.", "El mamo valora la laguna por su sentido espiritual y su papel en el equilibrio con la naturaleza; el inversionista, por los ingresos que podría generar.", true], ["C", "A que ambos buscan los ingresos del turismo, pero discrepan sobre quién debe administrarlos.", "El mamo no busca ingresos: se opone a tratar la laguna como un objeto.", false], ["D", "A que el inversionista conoce mejor que el mamo la historia cultural de la laguna.", "Nada en el texto permite inferirlo.", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "s11-3", "ses": 2, "ind": "Deforestación y ganadería", "tt": "", "texto": "En algunos municipios de la Amazonía ha aumentado la tala de bosque para establecer potreros de ganado. Muchas familias de la zona obtienen sus ingresos de la ganadería, pero la pérdida de bosque reduce la biodiversidad y altera el ciclo del agua en la región.", "vis": "", "items": [{"id": "SCC-145", "niv": 1, "cp": "sc_reflexivo_sistemico", "cn": "", "e": "Una autoridad propone prohibir la ganadería en toda la región de inmediato, sin ofrecer otras alternativas de ingreso. ¿Qué crítica a la propuesta está bien fundamentada?", "f": "Análisis de dimensiones de un problema; Constitución Política de 1991, arts. 80 y 333", "vis": "", "o": [["A", "Es innecesaria, porque los potreros recuperan solos la biodiversidad del bosque en pocos años.", "Un potrero no recupera en poco tiempo la biodiversidad del bosque talado; el texto señala que la pérdida de bosque reduce la biodiversidad.", false], ["B", "Es inútil, porque la tala se debe sobre todo a la minería.", "El texto afirma que la tala se hace para establecer potreros de ganado.", false], ["C", "Protege el bosque, pero ignora sus efectos sobre los ingresos de las familias.", "Detener la expansión de potreros protege el bosque y el agua, pero sin alternativas deja sin ingresos a quienes viven de la ganadería.", true], ["D", "Es inconstitucional, porque la libertad de empresa no admite límites por motivos ambientales.", "El artículo 333 permite que la ley delimite la libertad económica cuando lo exijan, entre otros, el interés social y el ambiente.", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "s11-3", "ses": 2, "ind": "Peatonalización de una calle comercial", "tt": "", "texto": "Una ciudad intermedia cerró al tránsito de vehículos una calle comercial del centro y la convirtió en zona peatonal. Un año después, un informe de la alcaldía reporta los datos de la tabla. En esa calle funcionan restaurantes y cafés, y también ferreterías y depósitos de materiales de construcción.", "vis": "<table class=\"vt\"><caption>Tabla 13. Indicadores de la calle antes y un año después de la peatonalización<\/caption><thead><tr><th>Indicador<\/th><th>Antes<\/th><th>Un año después<\/th><\/tr><\/thead><tbody><tr><td>Peatones diarios en la calle<\/td><td>8.000<\/td><td>14.000<\/td><\/tr><tr><td>Ventas promedio de restaurantes y cafés (millones de pesos al mes)<\/td><td>20<\/td><td>26<\/td><\/tr><tr><td>Ventas promedio de ferreterías y depósitos (millones de pesos al mes)<\/td><td>30<\/td><td>21<\/td><\/tr><tr><td>Vehículos por hora en las calles vecinas en hora pico<\/td><td>600<\/td><td>900<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Fuente: datos ficticios.<\/div>", "items": [{"id": "SCC-146", "niv": 2, "cp": "sc_reflexivo_sistemico", "cn": "", "e": "¿Qué explica mejor que las ventas de los restaurantes subieran y las de las ferreterías bajaran?", "f": "Análisis de efectos de una política pública local", "vis": "", "o": [["A", "La peatonalización redujo el número de personas que pasan por la calle, y eso afectó más a las ferreterías.", "Contradice la tabla: los peatones pasaron de 8.000 a 14.000 al día.", false], ["B", "Las ferreterías subieron sus precios después de la peatonalización y perdieron clientes frente a los restaurantes del centro.", "La tabla no da información sobre precios; la diferencia se explica por el tipo de cliente de cada negocio.", false], ["C", "Los restaurantes recibieron un subsidio de la alcaldía por la peatonalización, y las ferreterías no.", "El caso no menciona subsidios; es una explicación sin respaldo en la información.", false], ["D", "Los restaurantes viven del paso de peatones, y las ferreterías, de clientes que llegan en vehículo a cargar materiales.", "La peatonalización aumentó el paso de personas, que favorece a restaurantes y cafés, pero dificultó el acceso en vehículo que necesitan quienes compran materiales pesados.", true]]}, {"id": "SCC-147", "niv": 2, "cp": "sc_reflexivo_sistemico", "cn": "", "e": "¿Qué medida complementaria respondería al problema de las ferreterías sin eliminar los beneficios de la peatonalización?", "f": "Análisis de alternativas de solución", "vis": "", "o": [["A", "Prohibir también la circulación de vehículos en las calles vecinas para descongestionarlas.", "Haría aún más difícil que los clientes lleguen en vehículo a las ferreterías y trasladaría el tráfico a otras calles.", false], ["B", "Ampliar el horario de funcionamiento de los restaurantes y cafés hasta la madrugada.", "Beneficia a restaurantes y cafés, pero no responde al problema de acceso de los clientes de las ferreterías.", false], ["C", "Permitir el cargue y descargue de vehículos en la calle en un horario restringido de la mañana.", "Facilita el acceso en vehículo que necesitan los clientes de las ferreterías, sin devolver el tránsito permanente que afectaría a peatones y restaurantes.", true], ["D", "Volver a abrir la calle a todos los vehículos durante todo el día para recuperar las ventas de las ferreterías.", "Podría ayudar a las ferreterías, pero eliminaría el aumento de peatones que benefició a restaurantes y cafés.", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "s11-3", "ses": 2, "ind": "IVA y equidad", "tt": "", "texto": "El impuesto al valor agregado (IVA) es un impuesto indirecto: lo pagan los consumidores al comprar bienes y servicios, con la misma tarifa para todos, sin importar su ingreso. Un país ficticio analiza cobrar IVA a los alimentos básicos, que hoy no lo pagan. La tabla muestra los ingresos y el gasto en alimentos de dos hogares.", "vis": "<table class=\"vt\"><caption>Tabla 14. Ingreso y gasto mensual en alimentos de dos hogares<\/caption><thead><tr><th>Hogar<\/th><th>Ingreso mensual<\/th><th>Gasto mensual en alimentos<\/th><\/tr><\/thead><tbody><tr><td>A<\/td><td>$ 1.500.000<\/td><td>$ 600.000<\/td><\/tr><tr><td>B<\/td><td>$ 9.000.000<\/td><td>$ 1.200.000<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Fuente: datos ficticios.<\/div>", "items": [{"id": "SCC-148", "niv": 3, "cp": "sc_reflexivo_sistemico", "cn": "", "e": "Si se aplica una tarifa de 10 % a los alimentos y ambos hogares mantienen sus compras, ¿qué se puede concluir?", "f": "Concepto de impuesto indirecto; cálculo propio", "vis": "", "o": [["A", "El hogar B se vería más afectado en proporción a su ingreso, porque paga más dinero de impuesto.", "Paga más pesos ($ 120.000 frente a $ 60.000), pero eso es una proporción menor de su ingreso (≈1,3 % frente a 4 %).", false], ["B", "El hogar A destinaría al nuevo impuesto una proporción mayor de su ingreso que el hogar B.", "El hogar A pagaría $ 60.000, el 4 % de su ingreso; el hogar B pagaría $ 120.000, cerca del 1,3 % del suyo. El impuesto pesa más, en proporción, sobre el hogar de menor ingreso.", true], ["C", "Ambos hogares destinarían la misma proporción de su ingreso, porque la tarifa es igual para los dos.", "La misma tarifa sobre el consumo no equivale a la misma proporción del ingreso, porque los hogares gastan en alimentos partes distintas de lo que ganan.", false], ["D", "Ninguno se vería afectado, porque el IVA lo pagan los comerciantes y no los consumidores.", "El texto indica que el IVA lo pagan los consumidores al comprar.", false]]}]}, {"comp": "ciencias_naturales", "sim": "s11-3", "ses": 2, "ind": "Selección natural en una población de polillas", "tt": "", "texto": "En una región industrial vive una especie de polilla que presenta dos formas heredables: clara y oscura. Durante el día las polillas descansan sobre los troncos de los árboles, donde las aves las cazan. Entre 1990 y 2005, el hollín de varias fábricas cercanas oscureció la corteza de los troncos. Un grupo de biólogos capturó cada cinco años unas 500 polillas y registró el porcentaje de cada forma.", "vis": "<table class=\"vt\"><caption>Tabla 15. Porcentaje de cada forma de polilla en las muestras<\/caption><thead><tr><th>Año<\/th><th>Forma clara (%)<\/th><th>Forma oscura (%)<\/th><\/tr><\/thead><tbody><tr><td>1990<\/td><td>92<\/td><td>8<\/td><\/tr><tr><td>1995<\/td><td>70<\/td><td>30<\/td><\/tr><tr><td>2000<\/td><td>38<\/td><td>62<\/td><\/tr><tr><td>2005<\/td><td>19<\/td><td>81<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Fuente: datos ficticios.<\/div>", "items": [{"id": "CNC-101", "niv": 2, "cp": "cn_indagacion", "cn": "biologico", "e": "¿Cuál de las siguientes conclusiones es coherente con los datos de la tabla?", "f": "Interpretación de datos (tabla 15).", "vis": "", "o": [["A", "La forma oscura apareció por primera vez en 1995 como respuesta a la contaminación.", "Incorrecta. En 1990 ya había un 8 % de polillas oscuras, de modo que esa forma existía antes de que aumentara el hollín.", false], ["B", "El hollín hizo que aumentara el número total de polillas que viven en la región.", "Incorrecta. La tabla solo presenta porcentajes de cada forma en muestras de igual tamaño; no informa el tamaño total de la población.", false], ["C", "Las polillas claras se oscurecieron al posarse repetidamente sobre los troncos cubiertos de hollín.", "Incorrecta. Los datos describen cambios en los porcentajes de la población a lo largo de los años, no cambios de color en individuos; el color es un rasgo heredable que no se adquiere por contacto con el hollín.", false], ["D", "La frecuencia de la forma oscura en la población aumentó a medida que los troncos se oscurecieron.", "Correcta. La tabla muestra que el porcentaje de polillas oscuras pasó de 8 % en 1990 a 81 % en 2005, en el mismo periodo en que el hollín oscureció los troncos.", true]]}, {"id": "CNC-102", "niv": 2, "cp": "cn_explicacion", "cn": "biologico", "e": "Según la teoría de la selección natural, ¿cuál es la explicación más adecuada del cambio observado?", "f": "Teoría de la selección natural (Darwin y Wallace).", "vis": "", "o": [["A", "Sobre troncos oscuros, las aves veían más a las polillas claras; las oscuras sobrevivían, se reproducían más y transmitían su color.", "Correcta. Es el mecanismo de selección natural: una variación heredable que ya existía (color oscuro) da mayor supervivencia y reproducción en el nuevo ambiente, por lo que su frecuencia aumenta generación tras generación.", true], ["B", "Las polillas claras emigraron a bosques con troncos claros, y su lugar lo ocuparon polillas oscuras que llegaron desde otras regiones industriales.", "Incorrecta. Una migración no es selección natural y el texto no aporta ninguna evidencia de ella; la explicación pedida se basa en la supervivencia diferencial dentro de la población.", false], ["C", "El hollín servía de alimento a las polillas oscuras, que por eso crecían más y dejaban más descendientes que las claras.", "Incorrecta. El texto no indica que las polillas se alimenten de hollín; el factor que diferencia la supervivencia de las dos formas es la depredación por las aves, que depende del contraste con el tronco.", false], ["D", "Las aves prefirieron cazar polillas oscuras, por lo que las claras tuvieron más alimento disponible.", "Incorrecta. Si las aves cazaran más polillas oscuras, la forma oscura disminuiría, lo contrario de lo que muestran los datos.", false]]}, {"id": "CNC-103", "niv": 1, "cp": "cn_uso_comprensivo", "cn": "biologico", "e": "¿Cuál es el origen último de variaciones heredables como la forma clara y la forma oscura de estas polillas?", "f": "Concepto de mutación como fuente de variabilidad genética.", "vis": "", "o": [["A", "La caza que realizan las aves sobre las polillas claras.", "Incorrecta. La depredación es el factor que selecciona entre variantes; no es la fuente que las produce.", false], ["B", "Las mutaciones en el ADN, que pueden pasar a la descendencia.", "Correcta. Las mutaciones son la fuente primaria de nuevos alelos; si ocurren en las células que forman los gametos, se heredan.", true], ["C", "El contacto de cada polilla adulta con el hollín de los troncos.", "Incorrecta. El hollín ensucia o cambia el ambiente, pero no genera variaciones heredables en las polillas.", false], ["D", "La alimentación que recibe cada larva durante su desarrollo.", "Incorrecta. La alimentación puede influir en el aspecto de un individuo, pero esos cambios no modifican su ADN ni se heredan.", false]]}]}, {"comp": "ciencias_naturales", "sim": "s11-3", "ses": 2, "ind": "Antibióticos y enfermedades virales", "tt": "", "texto": "Una persona tiene gripe, una enfermedad causada por un virus, y le pide a un familiar que le preste unos antibióticos que le sobraron de un tratamiento anterior.", "vis": "", "items": [{"id": "CNC-106", "niv": 1, "cp": "cn_uso_comprensivo", "cn": "biologico", "e": "¿Qué razón científica explica por qué los antibióticos no sirven para curar la gripe?", "f": "Mecanismo de acción de los antibióticos.", "vis": "", "o": [["A", "Los virus son mucho más grandes que las bacterias, y por eso el antibiótico no alcanza a rodearlos ni a destruirlos.", "Incorrecta. Los virus son, en general, mucho más pequeños que las bacterias; el problema no es el tamaño sino que carecen de las estructuras sobre las que actúa el antibiótico.", false], ["B", "Los antibióticos solo funcionan si se aplican como vacuna antes de que aparezca la enfermedad.", "Incorrecta. Los antibióticos no son vacunas: no generan memoria inmunológica; se usan para tratar infecciones bacterianas ya presentes.", false], ["C", "Los antibióticos actúan sobre estructuras o procesos propios de las bacterias, que los virus no tienen.", "Correcta. Los antibióticos atacan, por ejemplo, la pared celular o los ribosomas bacterianos; los virus no tienen esas estructuras porque no son células.", true], ["D", "Los antibióticos destruyen los anticuerpos que el cuerpo produce contra el virus.", "Incorrecta. Los antibióticos no actúan sobre los anticuerpos; simplemente no tienen blanco de acción en los virus.", false]]}]}, {"comp": "ciencias_naturales", "sim": "s11-3", "ses": 2, "ind": "Regulación de la glucosa en la sangre", "tt": "", "texto": "Dos personas en ayunas bebieron la misma cantidad de una solución de glucosa. Luego se midió su glucosa en la sangre cada media hora. La persona 1 está sana; la persona 2 tiene una enfermedad en la que su páncreas no produce insulina.", "vis": "<div class=\"vfig\"><svg class=\"vg\" viewBox=\"0 0 560 320\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Gráfica 10. Glucosa en la sangre después de beber la solución\" font-family=\"Arial, sans-serif\" font-size=\"12\"><rect width=\"560\" height=\"320\" fill=\"#ffffff\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"13\" fill=\"#1d2433\">Gráfica 10. Glucosa en la sangre después de beber la solución<\/text><line x1=\"60\" y1=\"258.0\" x2=\"540\" y2=\"258.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"262.0\" text-anchor=\"end\" fill=\"#3a4356\">0<\/text><line x1=\"60\" y1=\"213.6\" x2=\"540\" y2=\"213.6\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"217.6\" text-anchor=\"end\" fill=\"#3a4356\">50<\/text><line x1=\"60\" y1=\"169.2\" x2=\"540\" y2=\"169.2\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"173.2\" text-anchor=\"end\" fill=\"#3a4356\">100<\/text><line x1=\"60\" y1=\"124.8\" x2=\"540\" y2=\"124.8\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"128.8\" text-anchor=\"end\" fill=\"#3a4356\">150<\/text><line x1=\"60\" y1=\"80.4\" x2=\"540\" y2=\"80.4\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"84.4\" text-anchor=\"end\" fill=\"#3a4356\">200<\/text><line x1=\"60\" y1=\"36.0\" x2=\"540\" y2=\"36.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"40.0\" text-anchor=\"end\" fill=\"#3a4356\">250<\/text><line x1=\"60\" y1=\"258\" x2=\"540\" y2=\"258\" stroke=\"#3a4356\"/><line x1=\"60\" y1=\"258\" x2=\"60\" y2=\"36\" stroke=\"#3a4356\"/><text transform=\"translate(14,147.0) rotate(-90)\" text-anchor=\"middle\" fill=\"#3a4356\">Glucosa (mg/dL)<\/text><text x=\"300.0\" y=\"312\" text-anchor=\"middle\" fill=\"#3a4356\">Tiempo (horas)<\/text><text x=\"94.3\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">0<\/text><text x=\"162.9\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">0,5<\/text><text x=\"231.4\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">1<\/text><text x=\"300.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">1,5<\/text><text x=\"368.6\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">2<\/text><text x=\"437.1\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">2,5<\/text><text x=\"505.7\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">3<\/text><polyline fill=\"none\" stroke=\"#1660a8\" stroke-width=\"2.5\" points=\"94.3,178.1 162.9,133.7 231.4,151.4 300.0,169.2 368.6,176.3 437.1,178.1 505.7,179.9\"/><circle cx=\"94.3\" cy=\"178.1\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"94.3\" y=\"170.1\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">90<\/text><circle cx=\"162.9\" cy=\"133.7\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"162.9\" y=\"125.7\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">140<\/text><circle cx=\"231.4\" cy=\"151.4\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"231.4\" y=\"143.4\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">120<\/text><circle cx=\"300.0\" cy=\"169.2\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"300.0\" y=\"161.2\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">100<\/text><circle cx=\"368.6\" cy=\"176.3\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"368.6\" y=\"168.3\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">92<\/text><circle cx=\"437.1\" cy=\"178.1\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"437.1\" y=\"170.1\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">90<\/text><circle cx=\"505.7\" cy=\"179.9\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"505.7\" y=\"171.9\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">88<\/text><polyline fill=\"none\" stroke=\"#d9822b\" stroke-width=\"2.5\" points=\"94.3,173.6 162.9,98.2 231.4,62.6 300.0,53.8 368.6,58.2 437.1,67.1 505.7,76.0\"/><circle cx=\"94.3\" cy=\"173.6\" r=\"3.5\" fill=\"#d9822b\"/><text x=\"94.3\" y=\"190.6\" text-anchor=\"middle\" font-size=\"11\" fill=\"#d9822b\" font-weight=\"bold\">95<\/text><circle cx=\"162.9\" cy=\"98.2\" r=\"3.5\" fill=\"#d9822b\"/><text x=\"162.9\" y=\"115.2\" text-anchor=\"middle\" font-size=\"11\" fill=\"#d9822b\" font-weight=\"bold\">180<\/text><circle cx=\"231.4\" cy=\"62.6\" r=\"3.5\" fill=\"#d9822b\"/><text x=\"231.4\" y=\"79.6\" text-anchor=\"middle\" font-size=\"11\" fill=\"#d9822b\" font-weight=\"bold\">220<\/text><circle cx=\"300.0\" cy=\"53.8\" r=\"3.5\" fill=\"#d9822b\"/><text x=\"300.0\" y=\"70.8\" text-anchor=\"middle\" font-size=\"11\" fill=\"#d9822b\" font-weight=\"bold\">230<\/text><circle cx=\"368.6\" cy=\"58.2\" r=\"3.5\" fill=\"#d9822b\"/><text x=\"368.6\" y=\"75.2\" text-anchor=\"middle\" font-size=\"11\" fill=\"#d9822b\" font-weight=\"bold\">225<\/text><circle cx=\"437.1\" cy=\"67.1\" r=\"3.5\" fill=\"#d9822b\"/><text x=\"437.1\" y=\"84.1\" text-anchor=\"middle\" font-size=\"11\" fill=\"#d9822b\" font-weight=\"bold\">215<\/text><circle cx=\"505.7\" cy=\"76.0\" r=\"3.5\" fill=\"#d9822b\"/><text x=\"505.7\" y=\"93.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#d9822b\" font-weight=\"bold\">205<\/text><rect x=\"60\" y=\"286\" width=\"12\" height=\"12\" fill=\"#1660a8\"/><text x=\"76\" y=\"296\" fill=\"#1d2433\">Persona 1<\/text><rect x=\"149\" y=\"286\" width=\"12\" height=\"12\" fill=\"#d9822b\"/><text x=\"165\" y=\"296\" fill=\"#1d2433\">Persona 2<\/text><\/svg><\/div>", "items": [{"id": "CNC-112", "niv": 1, "cp": "cn_indagacion", "cn": "biologico", "e": "¿Qué se puede afirmar a partir de la gráfica?", "f": "Interpretación de la gráfica 10.", "vis": "", "o": [["A", "A las 3 horas, la glucosa de la persona 1 volvió cerca de su valor inicial y la de la persona 2 no.", "Correcta. La persona 1 pasa de 90 a 88 mg/dL; la persona 2 pasa de 95 a 205 mg/dL, muy por encima de su valor inicial.", true], ["B", "Antes de beber la solución, las dos personas tenían valores de glucosa muy diferentes.", "Incorrecta. Al inicio los valores eran 90 y 95 mg/dL, muy parecidos.", false], ["C", "La glucosa de la persona 2 empezó a bajar desde la primera media hora.", "Incorrecta. La glucosa de la persona 2 siguió subiendo hasta la hora y media (230 mg/dL) y solo después bajó un poco.", false], ["D", "La persona 1 absorbió menos glucosa que la persona 2, porque su valor máximo fue menor.", "Incorrecta. La gráfica mide la glucosa que queda en la sangre, no cuánta se absorbió en el intestino; un valor máximo menor se explica porque la glucosa sale de la sangre hacia las células.", false]]}, {"id": "CNC-113", "niv": 1, "cp": "cn_explicacion", "cn": "biologico", "e": "¿Por qué la glucosa de la persona 1 baja después de la primera media hora?", "f": "Homeostasis de la glucosa: insulina y glucagón.", "vis": "", "o": [["A", "Su páncreas libera glucagón, una hormona que hace que el hígado retire la glucosa de la sangre y la guarde como reserva.", "Incorrecta. El glucagón tiene el efecto contrario: estimula al hígado a liberar glucosa y la aumenta en la sangre.", false], ["B", "Sus riñones eliminan por la orina toda la glucosa que sobra en la sangre.", "Incorrecta. En una persona sana los riñones reabsorben la glucosa y casi no aparece en la orina; la regulación la hace la insulina.", false], ["C", "La glucosa se transforma en insulina dentro de los vasos sanguíneos.", "Incorrecta. La insulina es una hormona proteica producida por el páncreas; la glucosa no se convierte en ella.", false], ["D", "Su páncreas libera insulina, que favorece la entrada de glucosa a las células y su almacenamiento como glucógeno.", "Correcta. La insulina permite que células del músculo y del tejido graso tomen glucosa y estimula al hígado y los músculos a almacenarla como glucógeno.", true]]}]}, {"comp": "ciencias_naturales", "sim": "s11-3", "ses": 2, "ind": "Ósmosis en tejido de papa", "tt": "", "texto": "Unos estudiantes cortaron cubos de papa del mismo tamaño, los pesaron y los sumergieron durante dos horas en soluciones de sacarosa de distinta concentración. Luego los secaron con papel y los volvieron a pesar. La tabla muestra el cambio porcentual de masa (el signo menos indica pérdida de masa).", "vis": "<table class=\"vt\"><caption>Tabla 16. Cambio de masa de los cubos de papa<\/caption><thead><tr><th>Concentración de sacarosa (mol/L)<\/th><th>Cambio de masa (%)<\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td>+12<\/td><\/tr><tr><td>0,2<\/td><td>+5<\/td><\/tr><tr><td>0,4<\/td><td>−3<\/td><\/tr><tr><td>0,6<\/td><td>−9<\/td><\/tr><tr><td>0,8<\/td><td>−14<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Fuente: datos ficticios.<\/div>", "items": [{"id": "CNC-116", "niv": 3, "cp": "cn_indagacion", "cn": "biologico", "e": "Según los datos, ¿entre qué concentraciones de sacarosa estaría la solución en la que los cubos de papa no ganarían ni perderían masa?", "f": "Interpretación de la tabla 16 (interpolación).", "vis": "", "o": [["A", "Entre 0,4 y 0,6 mol/L.", "Incorrecta. En ambas concentraciones los cubos perdieron masa (−3 % y −9 %).", false], ["B", "Entre 0 y 0,2 mol/L.", "Incorrecta. En ambas concentraciones los cubos ganaron masa (+12 % y +5 %), por lo que el cambio no pasa por cero en ese intervalo.", false], ["C", "Entre 0,2 y 0,4 mol/L.", "Correcta. A 0,2 mol/L los cubos ganan masa (+5 %) y a 0,4 mol/L la pierden (−3 %); el cambio nulo debe estar entre esas dos concentraciones.", true], ["D", "Exactamente en 0,8 mol/L.", "Incorrecta. En 0,8 mol/L se registró la mayor pérdida de masa (−14 %).", false]]}, {"id": "CNC-117", "niv": 2, "cp": "cn_explicacion", "cn": "biologico", "e": "¿Por qué los cubos que estuvieron en la solución de 0,8 mol/L perdieron masa?", "f": "Ósmosis; soluciones hipertónicas e hipotónicas.", "vis": "", "o": [["A", "Porque el agua entró a las células, las hizo estallar y estas perdieron su contenido.", "Incorrecta. En una solución más concentrada el agua sale, no entra; además, las células vegetales tienen pared celular que evita que estallen.", false], ["B", "Porque el agua salió de las células de la papa hacia la solución, que tenía mayor concentración de solutos.", "Correcta. Por ósmosis, el agua atraviesa la membrana desde donde hay menos soluto (interior celular) hacia donde hay más (solución hipertónica), y la papa pierde masa.", true], ["C", "Porque la sacarosa de la solución entró a las células y desplazó el almidón hacia afuera.", "Incorrecta. El fenómeno principal es el paso de agua por ósmosis; si entrara sacarosa, la masa no disminuiría por esa causa.", false], ["D", "Porque las células usaron la sacarosa como alimento y consumieron su propia masa.", "Incorrecta. En dos horas la pérdida de masa no se explica por consumo de alimento, sino por la salida de agua.", false]]}]}, {"comp": "ciencias_naturales", "sim": "s11-3", "ses": 2, "ind": "Empujar una caja sobre el piso", "tt": "", "texto": "Ana empuja horizontalmente una caja de 40 kg sobre un piso plano con una fuerza de 120 N. La caja se desliza en línea recta con velocidad constante.", "vis": "", "items": [{"id": "CNC-122", "niv": 2, "cp": "cn_explicacion", "cn": "fisico", "e": "¿Qué se puede afirmar sobre la fuerza de fricción que el piso ejerce sobre la caja?", "f": "Primera ley de Newton (equilibrio de fuerzas).", "vis": "", "o": [["A", "Mide 120 N y se opone al movimiento, porque la fuerza neta sobre la caja es cero.", "Correcta. Con velocidad constante la aceleración es cero; por la primera ley de Newton, la fuerza neta es cero y la fricción equilibra exactamente el empuje de 120 N.", true], ["B", "Mide menos de 120 N, porque si fuera igual al empuje de Ana la caja no podría seguir moviéndose.", "Incorrecta. Es un error frecuente: no se necesita una fuerza neta para mantener el movimiento, solo para cambiar la velocidad.", false], ["C", "Es cero, porque la caja ya está en movimiento.", "Incorrecta. La fricción cinética actúa mientras la caja se desliza sobre el piso.", false], ["D", "Mide más de 120 N, porque la caja se resiste a moverse.", "Incorrecta. Si la fricción fuera mayor que el empuje, la fuerza neta se opondría al movimiento y la caja frenaría.", false]]}, {"id": "CNC-123", "niv": 1, "cp": "cn_uso_comprensivo", "cn": "fisico", "e": "Si Ana aumenta su empuje a 200 N y la fricción no cambia, ¿cuál será la aceleración de la caja?", "f": "Segunda ley de Newton.", "vis": "", "o": [["A", "0,5 m/s².", "Incorrecta. Resulta de dividir la masa entre la fuerza neta (40/80), en lugar de la fuerza neta entre la masa.", false], ["B", "2 m/s².", "Correcta. Fuerza neta = 200 N − 120 N = 80 N; a = F/m = 80 N / 40 kg = 2 m/s².", true], ["C", "3 m/s².", "Incorrecta. Resulta de dividir 120 N entre 40 kg: usa la fricción en lugar de la fuerza neta.", false], ["D", "5 m/s².", "Incorrecta. Resulta de dividir 200 N entre 40 kg, olvidando restar la fricción.", false]]}, {"id": "CNC-124", "niv": 3, "cp": "cn_explicacion", "cn": "fisico", "e": "Ana afirma: «Según la tercera ley de Newton, la caja me empuja con una fuerza igual a la mía y opuesta; entonces las dos fuerzas se anulan y la caja no debería moverse». ¿Por qué este razonamiento es incorrecto?", "f": "Tercera ley de Newton.", "vis": "", "o": [["A", "Porque la fuerza de reacción aparece un instante después de la acción y no alcanza a frenar la caja.", "Incorrecta. Acción y reacción son simultáneas; ninguna aparece después de la otra.", false], ["B", "Porque la caja no ejerce ninguna fuerza sobre Ana, ya que es un objeto inanimado que no puede empujar.", "Incorrecta. Todo cuerpo que recibe una fuerza de otro ejerce sobre él una fuerza igual y opuesta, esté vivo o no.", false], ["C", "Porque la fuerza que Ana ejerce sobre la caja es mayor que la fuerza que la caja ejerce sobre Ana.", "Incorrecta. Según la tercera ley, las dos fuerzas tienen siempre la misma magnitud.", false], ["D", "Porque las dos fuerzas actúan sobre cuerpos distintos, una sobre la caja y otra sobre Ana, así que no se anulan entre sí.", "Correcta. Las fuerzas de acción y reacción actúan sobre cuerpos diferentes; para saber si la caja acelera solo se suman las fuerzas que actúan sobre la caja.", true]]}]}, {"comp": "ciencias_naturales", "sim": "s11-3", "ses": 2, "ind": "Caída libre de esferas", "tt": "", "texto": "Unos estudiantes soltaron desde el reposo una esfera de acero desde distintas alturas y midieron el tiempo de caída con un sensor. En estas condiciones el efecto del aire es despreciable. La tabla 17 resume los resultados (promedio de cinco repeticiones).", "vis": "<table class=\"vt\"><caption>Tabla 17. Tiempo de caída de la esfera de acero<\/caption><thead><tr><th>Altura (m)<\/th><th>Tiempo de caída (s)<\/th><\/tr><\/thead><tbody><tr><td>1,25<\/td><td>0,50<\/td><\/tr><tr><td>5,00<\/td><td>1,00<\/td><\/tr><tr><td>11,25<\/td><td>1,50<\/td><\/tr><tr><td>20,00<\/td><td>2,00<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Fuente: datos ficticios calculados con g = 10 m/s².<\/div>", "items": [{"id": "CNC-125", "niv": 2, "cp": "cn_indagacion", "cn": "fisico", "e": "¿Qué relación entre la altura y el tiempo de caída muestran los datos?", "f": "Interpretación de la tabla 17 (h = g·t²/2).", "vis": "", "o": [["A", "Cuando la altura se multiplica por 4, el tiempo de caída se duplica.", "Correcta. De 1,25 m a 5,00 m (×4) el tiempo pasa de 0,50 s a 1,00 s (×2); de 5,00 m a 20,00 m (×4), de 1,00 s a 2,00 s (×2).", true], ["B", "Cuando la altura se duplica, el tiempo de caída también se duplica.", "Incorrecta. Duplicar el tiempo requiere cuadruplicar la altura (por ejemplo, de 5,00 m a 20,00 m).", false], ["C", "El tiempo de caída no depende de la altura.", "Incorrecta. La tabla muestra que a mayor altura el tiempo de caída es mayor.", false], ["D", "El tiempo de caída es directamente proporcional a la altura desde la que se suelta la esfera.", "Incorrecta. Si fueran proporcionales, al multiplicar la altura por 4 el tiempo también se multiplicaría por 4, y solo se duplica.", false]]}, {"id": "CNC-126", "niv": 3, "cp": "cn_indagacion", "cn": "fisico", "e": "Si el patrón se mantiene, ¿cuánto tardaría la esfera en caer desde 45 m?", "f": "Cálculo propio a partir del patrón de la tabla 17.", "vis": "", "o": [["A", "2,50 s.", "Incorrecta. Supone que el tiempo sigue aumentando 0,50 s por cada fila de la tabla, sin tener en cuenta cuánto aumenta la altura.", false], ["B", "3,00 s.", "Correcta. Los datos cumplen h = 5·t² (con h en metros y t en segundos): 45 = 5·t², t² = 9, t = 3,00 s. También: 45 m es 9 veces 5 m, así que el tiempo es √9 = 3 veces 1,00 s.", true], ["C", "4,50 s.", "Incorrecta. Supone que el tiempo es proporcional a la altura (45 m ÷ 10 m/s), lo que contradice los datos.", false], ["D", "9,00 s.", "Incorrecta. Resulta de dividir 45 entre 5 sin sacar la raíz cuadrada.", false]]}, {"id": "CNC-127", "niv": 2, "cp": "cn_indagacion", "cn": "fisico", "e": "Después, los estudiantes soltaron desde 5,00 m dos esferas del mismo tamaño: una de acero (400 g) y otra de aluminio (140 g). Ambas tardaron 1,00 s en promedio. ¿Qué conclusión apoyan estos resultados?", "f": "Análisis de resultados; la aceleración de caída libre no depende de la masa.", "vis": "", "o": [["A", "La resistencia del aire fue mayor sobre la esfera de acero que sobre la de aluminio.", "Incorrecta. El texto indica que el efecto del aire es despreciable y los tiempos fueron iguales.", false], ["B", "La aceleración de la gravedad fue mayor para la esfera de acero, por tener más masa.", "Incorrecta. Si la aceleración fuera mayor, la esfera de acero habría tardado menos tiempo.", false], ["C", "En estas condiciones, el tiempo de caída no depende de la masa de la esfera.", "Correcta. Dos esferas de masas muy distintas tardaron lo mismo en caer desde la misma altura, así que su aceleración fue la misma.", true], ["D", "Los cuerpos más pesados caen más rápido, aunque la diferencia es demasiado pequeña para medirla con el sensor.", "Incorrecta. Los datos no muestran ninguna diferencia; afirmar una diferencia que no se midió no se apoya en la evidencia.", false]]}]}, {"comp": "ciencias_naturales", "sim": "s11-3", "ses": 2, "ind": "Mezcla de agua a distintas temperaturas", "tt": "", "texto": "En un recipiente térmicamente aislado se mezclan 200 g de agua a 80 °C con 200 g de agua a 20 °C. Se desprecia el calor que absorbe el recipiente.", "vis": "", "items": [{"id": "CNC-128", "niv": 2, "cp": "cn_uso_comprensivo", "cn": "fisico", "e": "¿Cuál será la temperatura final de la mezcla cuando alcance el equilibrio térmico?", "f": "Calorimetría: equilibrio térmico (Q cedido = Q absorbido).", "vis": "", "o": [["A", "30 °C.", "Incorrecta. Es la mitad de la diferencia de temperaturas (60 °C / 2), no la temperatura final.", false], ["B", "50 °C.", "Correcta. Como las masas son iguales y se trata de la misma sustancia, el calor que cede el agua caliente es igual al que gana la fría: 200·c·(80 − T) = 200·c·(T − 20), de donde T = 50 °C.", true], ["C", "60 °C.", "Incorrecta. Es la diferencia entre las temperaturas iniciales (80 − 20), no la temperatura de equilibrio.", false], ["D", "100 °C.", "Incorrecta. Las temperaturas no se suman; la mezcla no puede quedar más caliente que el agua más caliente.", false]]}, {"id": "CNC-129", "niv": 1, "cp": "cn_explicacion", "cn": "fisico", "e": "¿Qué ocurre con la energía mientras la mezcla llega a la temperatura final?", "f": "Calor como energía en tránsito; conservación de la energía.", "vis": "", "o": [["A", "El agua caliente pierde temperatura y el agua fría gana calor, pero al final la energía total del sistema es mayor que al inicio.", "Incorrecta. En un sistema aislado la energía total se conserva: lo que pierde el agua caliente lo gana el agua fría.", false], ["B", "El agua fría transfiere «frío» al agua caliente hasta que las dos alcanzan la misma temperatura.", "Incorrecta. El «frío» no es una forma de energía que se transfiera; lo que se transfiere es calor, del cuerpo caliente al frío.", false], ["C", "La energía del agua caliente se destruye y en el agua fría se crea nueva energía.", "Incorrecta. La energía no se crea ni se destruye; solo se transfiere o se transforma.", false], ["D", "El agua caliente transfiere energía en forma de calor al agua fría hasta que las dos quedan a la misma temperatura.", "Correcta. El calor fluye espontáneamente del cuerpo de mayor temperatura al de menor temperatura hasta alcanzar el equilibrio térmico; en un sistema aislado la energía total se conserva.", true]]}]}, {"comp": "ciencias_naturales", "sim": "s11-3", "ses": 2, "ind": "Calentamiento de agua y aceite", "tt": "", "texto": "Para comparar dos líquidos, un estudiante calentó 100 g de agua y 100 g de aceite vegetal, ambos inicialmente a 20 °C, en recipientes iguales y con dos calentadores idénticos que entregan la misma cantidad de energía por minuto. Registró la temperatura de cada líquido cada minuto.", "vis": "<div class=\"vfig\"><svg class=\"vg\" viewBox=\"0 0 560 320\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Gráfica 11. Temperatura de los líquidos durante el calentamiento\" font-family=\"Arial, sans-serif\" font-size=\"12\"><rect width=\"560\" height=\"320\" fill=\"#ffffff\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"13\" fill=\"#1d2433\">Gráfica 11. Temperatura de los líquidos durante el calentamiento<\/text><line x1=\"60\" y1=\"258.0\" x2=\"540\" y2=\"258.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"262.0\" text-anchor=\"end\" fill=\"#3a4356\">0<\/text><line x1=\"60\" y1=\"202.5\" x2=\"540\" y2=\"202.5\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"206.5\" text-anchor=\"end\" fill=\"#3a4356\">20<\/text><line x1=\"60\" y1=\"147.0\" x2=\"540\" y2=\"147.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"151.0\" text-anchor=\"end\" fill=\"#3a4356\">40<\/text><line x1=\"60\" y1=\"91.5\" x2=\"540\" y2=\"91.5\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"95.5\" text-anchor=\"end\" fill=\"#3a4356\">60<\/text><line x1=\"60\" y1=\"36.0\" x2=\"540\" y2=\"36.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"40.0\" text-anchor=\"end\" fill=\"#3a4356\">80<\/text><line x1=\"60\" y1=\"258\" x2=\"540\" y2=\"258\" stroke=\"#3a4356\"/><line x1=\"60\" y1=\"258\" x2=\"60\" y2=\"36\" stroke=\"#3a4356\"/><text transform=\"translate(14,147.0) rotate(-90)\" text-anchor=\"middle\" fill=\"#3a4356\">Temperatura (°C)<\/text><text x=\"300.0\" y=\"312\" text-anchor=\"middle\" fill=\"#3a4356\">Tiempo (min)<\/text><text x=\"100.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">0<\/text><text x=\"180.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">1<\/text><text x=\"260.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">2<\/text><text x=\"340.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">3<\/text><text x=\"420.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">4<\/text><text x=\"500.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">5<\/text><polyline fill=\"none\" stroke=\"#1660a8\" stroke-width=\"2.5\" points=\"100.0,202.5 180.0,188.6 260.0,174.8 340.0,160.9 420.0,147.0 500.0,133.1\"/><circle cx=\"100.0\" cy=\"202.5\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"100.0\" y=\"194.5\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">20<\/text><circle cx=\"180.0\" cy=\"188.6\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"180.0\" y=\"180.6\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">25<\/text><circle cx=\"260.0\" cy=\"174.8\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"260.0\" y=\"166.8\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">30<\/text><circle cx=\"340.0\" cy=\"160.9\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"340.0\" y=\"152.9\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">35<\/text><circle cx=\"420.0\" cy=\"147.0\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"420.0\" y=\"139.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">40<\/text><circle cx=\"500.0\" cy=\"133.1\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"500.0\" y=\"125.1\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">45<\/text><polyline fill=\"none\" stroke=\"#d9822b\" stroke-width=\"2.5\" points=\"100.0,202.5 180.0,174.8 260.0,147.0 340.0,119.2 420.0,91.5 500.0,63.8\"/><circle cx=\"100.0\" cy=\"202.5\" r=\"3.5\" fill=\"#d9822b\"/><text x=\"100.0\" y=\"219.5\" text-anchor=\"middle\" font-size=\"11\" fill=\"#d9822b\" font-weight=\"bold\">20<\/text><circle cx=\"180.0\" cy=\"174.8\" r=\"3.5\" fill=\"#d9822b\"/><text x=\"180.0\" y=\"191.8\" text-anchor=\"middle\" font-size=\"11\" fill=\"#d9822b\" font-weight=\"bold\">30<\/text><circle cx=\"260.0\" cy=\"147.0\" r=\"3.5\" fill=\"#d9822b\"/><text x=\"260.0\" y=\"164.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#d9822b\" font-weight=\"bold\">40<\/text><circle cx=\"340.0\" cy=\"119.2\" r=\"3.5\" fill=\"#d9822b\"/><text x=\"340.0\" y=\"136.2\" text-anchor=\"middle\" font-size=\"11\" fill=\"#d9822b\" font-weight=\"bold\">50<\/text><circle cx=\"420.0\" cy=\"91.5\" r=\"3.5\" fill=\"#d9822b\"/><text x=\"420.0\" y=\"108.5\" text-anchor=\"middle\" font-size=\"11\" fill=\"#d9822b\" font-weight=\"bold\">60<\/text><circle cx=\"500.0\" cy=\"63.8\" r=\"3.5\" fill=\"#d9822b\"/><text x=\"500.0\" y=\"80.8\" text-anchor=\"middle\" font-size=\"11\" fill=\"#d9822b\" font-weight=\"bold\">70<\/text><rect x=\"60\" y=\"286\" width=\"12\" height=\"12\" fill=\"#1660a8\"/><text x=\"76\" y=\"296\" fill=\"#1d2433\">Agua<\/text><rect x=\"114\" y=\"286\" width=\"12\" height=\"12\" fill=\"#d9822b\"/><text x=\"130\" y=\"296\" fill=\"#1d2433\">Aceite vegetal<\/text><\/svg><\/div>", "items": [{"id": "CNC-130", "niv": 3, "cp": "cn_indagacion", "cn": "fisico", "e": "¿Qué conclusión es válida a partir de la gráfica?", "f": "Interpretación de la gráfica 11; concepto de calor específico.", "vis": "", "o": [["A", "El aceite tiene menor calor específico que el agua: necesita menos energía por gramo para subir 1 °C.", "Correcta. Ambos recibieron la misma energía en el mismo tiempo; el aceite subió 10 °C por minuto y el agua 5 °C por minuto, así que el aceite requiere menos energía por gramo y por grado.", true], ["B", "El agua conduce mal el calor y por eso nunca podrá llegar a 70 °C.", "Incorrecta. Con más tiempo de calentamiento el agua sí alcanzaría 70 °C; la gráfica solo muestra que tarda más.", false], ["C", "El aceite tiene mayor calor específico que el agua, porque su temperatura aumenta más rápido con la misma energía.", "Incorrecta. Un calor específico mayor significa que se necesita más energía para subir la temperatura, lo que haría que el aceite se calentara más lento.", false], ["D", "Los dos líquidos absorbieron diferentes cantidades de energía y por eso su temperatura cambió de manera distinta.", "Incorrecta. El texto indica que los calentadores son idénticos y entregan la misma energía por minuto a cada líquido.", false]]}]}, {"comp": "ciencias_naturales", "sim": "s11-3", "ses": 2, "ind": "Energía de una esfera que cae", "tt": "", "texto": "Una esfera de 2 kg se suelta desde el reposo a 5 m de altura sobre el suelo. Desprecie la resistencia del aire y use g = 10 m/s².", "vis": "", "items": [{"id": "CNC-131", "niv": 2, "cp": "cn_uso_comprensivo", "cn": "fisico", "e": "¿Con qué rapidez llega la esfera al suelo?", "f": "Conservación de la energía mecánica.", "vis": "", "o": [["A", "5 m/s.", "Incorrecta. Confunde la altura (5 m) con la rapidez.", false], ["B", "10 m/s.", "Correcta. La energía potencial se transforma en cinética: m·g·h = m·v²/2, así que v = √(2·g·h) = √(2 × 10 × 5) = √100 = 10 m/s.", true], ["C", "50 m/s.", "Incorrecta. Resulta de multiplicar g·h (10 × 5) sin aplicar la conservación de la energía correctamente ni sacar la raíz.", false], ["D", "100 m/s.", "Incorrecta. Es el valor de v² (2·g·h = 100); falta sacar la raíz cuadrada.", false]]}]}, {"comp": "ciencias_naturales", "sim": "s11-3", "ses": 2, "ind": "Sonido de distintas frecuencias", "tt": "", "texto": "Con un generador de sonido y un micrófono, un grupo de estudiantes midió la longitud de onda de sonidos de distintas frecuencias que viajaban por el aire del laboratorio, a temperatura constante.", "vis": "<table class=\"vt\"><caption>Tabla 18. Frecuencia y longitud de onda del sonido en el aire<\/caption><thead><tr><th>Frecuencia (Hz)<\/th><th>Longitud de onda (m)<\/th><\/tr><\/thead><tbody><tr><td>170<\/td><td>2,00<\/td><\/tr><tr><td>340<\/td><td>1,00<\/td><\/tr><tr><td>680<\/td><td>0,50<\/td><\/tr><tr><td>1.360<\/td><td>0,25<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Fuente: datos ficticios.<\/div>", "items": [{"id": "CNC-135", "niv": 2, "cp": "cn_indagacion", "cn": "fisico", "e": "¿Qué conclusión se puede obtener de los datos de la tabla?", "f": "Interpretación de la tabla 18; relación v = f·λ.", "vis": "", "o": [["A", "La frecuencia y la longitud de onda no tienen ninguna relación, porque cada una depende solo del generador.", "Incorrecta. Están relacionadas de forma inversa (su producto es constante); la longitud de onda depende de la frecuencia y del medio.", false], ["B", "La rapidez del sonido aumenta con la frecuencia, porque las ondas son más numerosas cada segundo.", "Incorrecta. Al calcular f × λ se obtiene siempre 340 m/s; la rapidez no aumenta.", false], ["C", "La longitud de onda aumenta cuando aumenta la frecuencia, porque las dos variables son directamente proporcionales.", "Incorrecta. La tabla muestra lo contrario: al duplicar la frecuencia, la longitud de onda se reduce a la mitad.", false], ["D", "La rapidez del sonido en el aire fue la misma para todas las frecuencias medidas.", "Correcta. En todos los casos f × λ = 340 m/s (por ejemplo, 170 Hz × 2,00 m y 1.360 Hz × 0,25 m); como v = f·λ, la rapidez del sonido en el aire fue constante.", true]]}]}, {"comp": "ciencias_naturales", "sim": "s11-3", "ses": 2, "ind": "Solubilidad y temperatura", "tt": "", "texto": "La gráfica muestra la cantidad máxima de nitrato de potasio (KNO₃) y de cloruro de sodio (NaCl) que se disuelve en 100 g de agua a distintas temperaturas (valores redondeados).", "vis": "<div class=\"vfig\"><svg class=\"vg\" viewBox=\"0 0 560 320\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Gráfica 12. Solubilidad en agua (g de sustancia por 100 g de agua)\" font-family=\"Arial, sans-serif\" font-size=\"12\"><rect width=\"560\" height=\"320\" fill=\"#ffffff\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"13\" fill=\"#1d2433\">Gráfica 12. Solubilidad en agua (g de sustancia por 100 g de agua)<\/text><line x1=\"60\" y1=\"258.0\" x2=\"540\" y2=\"258.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"262.0\" text-anchor=\"end\" fill=\"#3a4356\">0<\/text><line x1=\"60\" y1=\"202.5\" x2=\"540\" y2=\"202.5\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"206.5\" text-anchor=\"end\" fill=\"#3a4356\">50<\/text><line x1=\"60\" y1=\"147.0\" x2=\"540\" y2=\"147.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"151.0\" text-anchor=\"end\" fill=\"#3a4356\">100<\/text><line x1=\"60\" y1=\"91.5\" x2=\"540\" y2=\"91.5\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"95.5\" text-anchor=\"end\" fill=\"#3a4356\">150<\/text><line x1=\"60\" y1=\"36.0\" x2=\"540\" y2=\"36.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"40.0\" text-anchor=\"end\" fill=\"#3a4356\">200<\/text><line x1=\"60\" y1=\"258\" x2=\"540\" y2=\"258\" stroke=\"#3a4356\"/><line x1=\"60\" y1=\"258\" x2=\"60\" y2=\"36\" stroke=\"#3a4356\"/><text transform=\"translate(14,147.0) rotate(-90)\" text-anchor=\"middle\" fill=\"#3a4356\">Solubilidad (g/100 g de agua)<\/text><text x=\"300.0\" y=\"312\" text-anchor=\"middle\" fill=\"#3a4356\">Temperatura (°C)<\/text><text x=\"120.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">20<\/text><text x=\"240.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">40<\/text><text x=\"360.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">60<\/text><text x=\"480.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">80<\/text><polyline fill=\"none\" stroke=\"#1660a8\" stroke-width=\"2.5\" points=\"120.0,222.5 240.0,187.0 360.0,135.9 480.0,70.4\"/><circle cx=\"120.0\" cy=\"222.5\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"120.0\" y=\"214.5\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">32<\/text><circle cx=\"240.0\" cy=\"187.0\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"240.0\" y=\"179.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">64<\/text><circle cx=\"360.0\" cy=\"135.9\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"360.0\" y=\"127.9\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">110<\/text><circle cx=\"480.0\" cy=\"70.4\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"480.0\" y=\"62.4\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">169<\/text><polyline fill=\"none\" stroke=\"#d9822b\" stroke-width=\"2.5\" points=\"120.0,218.0 240.0,218.0 360.0,216.9 480.0,215.8\"/><circle cx=\"120.0\" cy=\"218.0\" r=\"3.5\" fill=\"#d9822b\"/><text x=\"120.0\" y=\"235.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#d9822b\" font-weight=\"bold\">36<\/text><circle cx=\"240.0\" cy=\"218.0\" r=\"3.5\" fill=\"#d9822b\"/><text x=\"240.0\" y=\"235.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#d9822b\" font-weight=\"bold\">36<\/text><circle cx=\"360.0\" cy=\"216.9\" r=\"3.5\" fill=\"#d9822b\"/><text x=\"360.0\" y=\"233.9\" text-anchor=\"middle\" font-size=\"11\" fill=\"#d9822b\" font-weight=\"bold\">37<\/text><circle cx=\"480.0\" cy=\"215.8\" r=\"3.5\" fill=\"#d9822b\"/><text x=\"480.0\" y=\"232.8\" text-anchor=\"middle\" font-size=\"11\" fill=\"#d9822b\" font-weight=\"bold\">38<\/text><rect x=\"60\" y=\"286\" width=\"12\" height=\"12\" fill=\"#1660a8\"/><text x=\"76\" y=\"296\" fill=\"#1d2433\">KNO₃<\/text><rect x=\"114\" y=\"286\" width=\"12\" height=\"12\" fill=\"#d9822b\"/><text x=\"130\" y=\"296\" fill=\"#1d2433\">NaCl<\/text><\/svg><\/div>", "items": [{"id": "CNC-145", "niv": 3, "cp": "cn_indagacion", "cn": "quimico", "e": "Se disuelven completamente 80 g de KNO₃ en 100 g de agua a 60 °C y luego la solución se enfría lentamente hasta 20 °C. ¿Qué masa de KNO₃ se separa en forma de cristales, aproximadamente?", "f": "Interpretación de curvas de solubilidad (gráfica 12).", "vis": "", "o": [["A", "16 g.", "Incorrecta. Corresponde a enfriar solo hasta 40 °C (80 g − 64 g).", false], ["B", "32 g.", "Incorrecta. Es la masa que sigue disuelta a 20 °C, no la que cristaliza.", false], ["C", "48 g.", "Correcta. A 20 °C solo se pueden disolver 32 g en 100 g de agua; de los 80 g iniciales cristalizan 80 − 32 = 48 g.", true], ["D", "78 g.", "Incorrecta. Resta las solubilidades a 60 °C y 20 °C (110 − 32), pero en la solución solo había 80 g, no 110 g.", false]]}, {"id": "CNC-146", "niv": 2, "cp": "cn_indagacion", "cn": "quimico", "e": "¿Qué conclusión se puede sacar de la gráfica?", "f": "Interpretación de la gráfica 12.", "vis": "", "o": [["A", "El NaCl deja de disolverse en agua cuando la temperatura supera los 40 °C.", "Incorrecta. A 60 °C y 80 °C se siguen disolviendo 37 g y 38 g de NaCl.", false], ["B", "A 20 °C el KNO₃ es más soluble en agua que el NaCl.", "Incorrecta. A 20 °C se disuelven 32 g de KNO₃ y 36 g de NaCl; el NaCl es un poco más soluble a esa temperatura.", false], ["C", "La solubilidad del KNO₃ depende mucho más de la temperatura que la del NaCl.", "Correcta. Entre 20 °C y 80 °C la solubilidad del KNO₃ pasa de 32 g a 169 g, mientras que la del NaCl apenas cambia de 36 g a 38 g.", true], ["D", "La solubilidad de todos los sólidos aumenta mucho cuando aumenta la temperatura.", "Incorrecta. Es una generalización que los datos contradicen: la solubilidad del NaCl casi no cambia; además, solo se estudiaron dos sustancias.", false]]}]}, {"comp": "ciencias_naturales", "sim": "s11-3", "ses": 2, "ind": "Separación de una mezcla de arena y sal", "tt": "", "texto": "En una cocina se mezclaron por accidente 2 kg de sal de mesa con arena fina, cuyos granos tienen un tamaño parecido al de los granos de sal. Se quiere recuperar la sal para usarla en otro proceso que no es alimenticio.", "vis": "", "items": [{"id": "CNC-147", "niv": 1, "cp": "cn_explicacion", "cn": "quimico", "e": "¿Qué procedimiento permite separar la sal de la arena, y por qué funciona?", "f": "Métodos de separación de mezclas (disolución, filtración, evaporación).", "vis": "", "o": [["A", "Agregar agua y dejar reposar, porque la sal es más densa que la arena y se acumula en el fondo.", "Incorrecta. Al agregar agua la sal se disuelve; no forma una capa en el fondo. La que se deposita es la arena.", false], ["B", "Calentar la mezcla seca hasta que la sal se evapore y quede solo la arena.", "Incorrecta. La sal de mesa hierve a más de 1.400 °C, temperatura imposible de alcanzar en una cocina; no se separa por evaporación de la sal.", false], ["C", "Pasar la mezcla seca por un tamiz fino, porque los granos de sal son más pequeños que los de arena.", "Incorrecta. El texto indica que los granos de sal y de arena fina tienen tamaños parecidos, así que un tamiz no los separa; la diferencia útil es la solubilidad en agua.", false], ["D", "Agregar agua, filtrar y evaporar el líquido filtrado, porque la sal se disuelve en agua y la arena no.", "Correcta. La sal pasa a la solución y atraviesa el filtro; la arena queda retenida. Al evaporar el agua del filtrado se recupera la sal.", true]]}]}, {"comp": "ciencias_naturales", "sim": "s11-3", "ses": 2, "ind": "pH de sustancias de uso doméstico", "tt": "", "texto": "Con un medidor de pH, unos estudiantes midieron el pH de varias sustancias a 25 °C (tabla 19). Después prepararon una solución de ácido clorhídrico diluido y le agregaron, de cinco en cinco gotas, una suspensión de antiácido; midieron el pH después de cada adición (tabla 20).", "vis": "<table class=\"vt\"><caption>Tabla 19. pH de algunas sustancias<\/caption><thead><tr><th>Sustancia<\/th><th>pH<\/th><\/tr><\/thead><tbody><tr><td>Jugo de limón<\/td><td>2,3<\/td><\/tr><tr><td>Vinagre<\/td><td>2,9<\/td><\/tr><tr><td>Agua pura<\/td><td>7,0<\/td><\/tr><tr><td>Bicarbonato de sodio disuelto en agua<\/td><td>8,3<\/td><\/tr><tr><td>Limpiador con amoníaco<\/td><td>11,5<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Fuente: datos ficticios.<\/div><table class=\"vt\"><caption>Tabla 20. pH de la solución ácida al agregar antiácido<\/caption><thead><tr><th>Gotas de antiácido agregadas<\/th><th>pH<\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td>1,5<\/td><\/tr><tr><td>5<\/td><td>2,1<\/td><\/tr><tr><td>10<\/td><td>3,0<\/td><\/tr><tr><td>15<\/td><td>5,2<\/td><\/tr><tr><td>20<\/td><td>7,0<\/td><\/tr><tr><td>25<\/td><td>8,6<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Fuente: datos ficticios.<\/div>", "items": [{"id": "CNC-148", "niv": 1, "cp": "cn_indagacion", "cn": "quimico", "e": "Según la tabla 19, ¿cuál de las sustancias es la más ácida?", "f": "Interpretación de la escala de pH (tabla 19).", "vis": "", "o": [["A", "El jugo de limón.", "Correcta. Tiene el pH más bajo (2,3); cuanto menor es el pH, mayor es la acidez.", true], ["B", "El vinagre.", "Incorrecta. El vinagre es ácido (pH 2,9), pero menos que el jugo de limón (pH 2,3).", false], ["C", "El agua pura.", "Incorrecta. Con pH 7,0 el agua pura es neutra a 25 °C.", false], ["D", "El limpiador con amoníaco.", "Incorrecta. Su pH es 11,5, mayor que 7: es una sustancia básica.", false]]}, {"id": "CNC-149", "niv": 2, "cp": "cn_indagacion", "cn": "quimico", "e": "Según la tabla 20, ¿qué ocurre al agregar el antiácido a la solución ácida?", "f": "Interpretación de la tabla 20; neutralización ácido-base.", "vis": "", "o": [["A", "El pH disminuye a medida que se agrega antiácido, porque el antiácido también es una sustancia ácida.", "Incorrecta. El pH aumenta en todas las adiciones; el antiácido se comporta como base.", false], ["B", "Con 25 gotas la solución se volvió más ácida que al comienzo.", "Incorrecta. Con 25 gotas el pH es 8,6: la solución es ligeramente básica, no más ácida.", false], ["C", "El pH aumenta a medida que se agrega antiácido, y con 20 gotas la solución queda neutra.", "Correcta. El pH sube de 1,5 a 7,0 con 20 gotas; el antiácido es una base que neutraliza el ácido.", true], ["D", "El pH aumenta la misma cantidad cada vez que se agregan 5 gotas de antiácido.", "Incorrecta. Los aumentos son distintos: 0,6; 0,9; 2,2; 1,8 y 1,6 unidades.", false]]}]}, {"comp": "ciencias_naturales", "sim": "s11-3", "ses": 2,
