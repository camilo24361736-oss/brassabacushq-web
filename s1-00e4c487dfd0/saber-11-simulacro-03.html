s diferencias por lo que cada hermano hacía (monaguillo, pesebres).", false], ["C", "Las fuentes orales complementan la información que guardan los documentos escritos.", "Coincide con el párrafo (5): «ninguno de los dos archivos sobra».", false], ["D", "Hay que averiguar cuál de los dos testimonios contradictorios es el verdadero.", "Aurora dice que preguntar quién tenía razón «no era la pregunta» y valora ambas versiones; esta afirmación sostiene lo contrario.", true]]}]}, {"comp": "lectura_critica", "sim": "s11-3", "ses": 1, "ind": "Artículo divulgativo: el sueño en la adolescencia", "tt": "Texto informativo", "texto": "¿Por qué los adolescentes no se duermen temprano?\n\n(1) Muchos padres creen que sus hijos adolescentes se acuestan tarde por pereza o por culpa del celular. La explicación es más compleja. Durante la adolescencia, el reloj biológico, el sistema que regula los ciclos de sueño y vigilia a lo largo del día, se desplaza: la melatonina, una hormona que favorece el sueño, empieza a liberarse más tarde en la noche que durante la infancia. Por eso un joven de quince años puede no sentir sueño a las diez de la noche aunque esté cansado.\n\n(2) El problema es que la hora de entrada al colegio no se desplaza con él. Las sociedades de medicina del sueño recomiendan que los adolescentes duerman entre ocho y diez horas cada noche. Un estudiante que se duerme a medianoche y se levanta a las cinco y media para llegar a clase a las seis y media duerme apenas cinco horas y media. Esa deuda de sueño, acumulada día tras día, se ha asociado en distintas investigaciones con problemas de atención y aprendizaje, cambios en el estado de ánimo y mayor riesgo de accidentes.\n\n(3) Las pantallas no son las culpables originales, pero sí empeoran la situación. La luz que emiten y, sobre todo, la actividad que invitan a continuar —un video más, un mensaje más— pueden retrasar todavía más la hora de dormir. Así, la biología abre la puerta y los hábitos la empujan.\n\n(4) ¿Qué se puede hacer? Algunas medidas dependen de cada persona: mantener horarios regulares también el fin de semana, recibir luz natural en la mañana, dejar el celular fuera del cuarto. Otras dependen de las instituciones. En varios países, algunos colegios han retrasado la hora de inicio de clases y han reportado que sus estudiantes duermen más. La discusión sigue abierta, porque cambiar los horarios afecta el transporte, el trabajo de los padres y la jornada de los docentes.\n\n(5) Lo que sí parece claro es que regañar a un adolescente por no dormirse temprano, sin entender lo que pasa en su cuerpo, se parece a reprocharle a alguien con fiebre que tenga la frente caliente.\n\nArtículo escrito para este simulacro. Recomendación de sueño: Academia Estadounidense de Medicina del Sueño (8 a 10 horas para jóvenes de 13 a 18 años).", "vis": "", "items": [{"id": "LCC-127", "niv": 1, "cp": "lc_local", "cn": "", "e": "Según el párrafo (1), la melatonina es", "f": "Párrafo (1)", "vis": "", "o": [["A", "una sustancia que liberan las pantallas de los celulares en la noche.", "Las pantallas emiten luz (párrafo 3); la melatonina la produce el cuerpo.", false], ["B", "una sustancia que produce el cuerpo y que ayuda a conciliar el sueño.", "El párrafo la define así: «la melatonina, una hormona que favorece el sueño».", true], ["C", "el sistema que regula los ciclos de sueño y vigilia a lo largo del día.", "Esa es la definición del reloj biológico, no de la melatonina.", false], ["D", "una hormona que mantiene despiertos a los jóvenes hasta medianoche.", "Es al contrario: favorece el sueño; lo que cambia en la adolescencia es la hora en que se libera.", false]]}, {"id": "LCC-128", "niv": 2, "cp": "lc_global", "cn": "", "e": "¿Qué relación establece el texto entre los cambios biológicos de la adolescencia y el uso de pantallas?", "f": "Párrafo (3)", "vis": "", "o": [["A", "Los cambios biológicos originan el retraso del sueño y las pantallas lo agravan.", "Párrafo (3): las pantallas «no son las culpables originales, pero sí empeoran la situación»; «la biología abre la puerta y los hábitos la empujan».", true], ["B", "Las pantallas son la causa principal del retraso y la biología solo es un factor menor.", "Invierte la relación: el texto dice que las pantallas no son las culpables originales.", false], ["C", "Son dos factores independientes que no se influyen entre sí.", "El texto los relaciona: los hábitos «empujan» la puerta que abrió la biología.", false], ["D", "Los cambios biológicos protegen a los adolescentes de los efectos de la luz de las pantallas.", "El texto no menciona ninguna protección; dice que la luz puede retrasar aún más el sueño.", false]]}, {"id": "LCC-129", "niv": 2, "cp": "lc_global", "cn": "", "e": "El caso del estudiante que se duerme a medianoche y se levanta a las cinco y media (párrafo 2) sirve para", "f": "Párrafo (2)", "vis": "", "o": [["A", "criticar a los estudiantes que deciden acostarse a medianoche por gusto.", "El texto explica el retraso por causas biológicas y evita culpar a los jóvenes (párrafo 5).", false], ["B", "ilustrar el choque entre el sueño recomendado y el horario de clases.", "El ejemplo da cinco horas y media de sueño frente a las ocho o diez recomendadas, justo después de afirmar que la hora de entrada no se desplaza.", true], ["C", "explicar por qué la melatonina se libera más tarde durante la adolescencia.", "El ejemplo no explica la causa de ese cambio; muestra su choque con el horario escolar.", false], ["D", "demostrar que todos los estudiantes del país duermen cinco horas y media.", "Es un ejemplo hipotético de un estudiante, no un dato sobre todos.", false]]}, {"id": "LCC-130", "niv": 2, "cp": "lc_reflexion", "cn": "", "e": "Con la comparación final entre el adolescente regañado y la persona con fiebre a la que se le reprocha tener la frente caliente, el autor busca", "f": "Párrafos (1), (4) y (5)", "vis": "", "o": [["A", "recomendar un tratamiento médico para los adolescentes que no se duermen temprano.", "El texto propone hábitos y cambios institucionales, no tratamientos médicos.", false], ["B", "sostener que la responsabilidad de que los jóvenes duerman bien recae sobre todo en los padres.", "El texto no atribuye la responsabilidad principal a los padres: propone medidas personales del adolescente y cambios de las instituciones (párrafo 4).", false], ["C", "mostrar que no es justo culpar a alguien por un efecto que se origina en su cuerpo.", "Así como la frente caliente es efecto de la fiebre, el no tener sueño temprano es efecto del cambio biológico; regañar sin entender eso sería injusto.", true], ["D", "afirmar que la falta de sueño de los adolescentes es una enfermedad como la fiebre.", "La comparación se refiere a lo injusto del reproche; el texto no presenta el retraso del sueño como enfermedad.", false]]}]}, {"comp": "lectura_critica", "sim": "s11-3", "ses": 1, "ind": "Columna de opinión: las redes sociales y la plaza pública", "tt": "Texto informativo", "texto": "La plaza que no es plaza\n\n(1) Se repite con frecuencia que las redes sociales son la nueva plaza pública: el lugar donde los ciudadanos se encuentran, discuten y forman opinión. La comparación es atractiva, pero engañosa. En la plaza de un pueblo nadie decide quién se para en el centro y quién queda en una esquina; en una red social, eso lo decide un programa diseñado por una empresa.\n\n(2) Ese programa, que solemos llamar algoritmo, no tiene opiniones políticas, pero sí un objetivo: que pasemos el mayor tiempo posible en la aplicación, porque de ese tiempo depende la venta de publicidad. Y pocas cosas nos retienen tanto como lo que nos indigna. Un mensaje sereno y bien argumentado compite en desventaja con una frase ofensiva que obliga a responder. No hace falta suponer mala intención; basta con que el sistema premie lo que funciona.\n\n(3) Los defensores de las plataformas recuerdan, con razón, que gracias a ellas personas que nunca habrían tenido un micrófono pueden denunciar abusos, organizarse y hacerse escuchar. Es cierto, y sería injusto olvidarlo. Pero que una herramienta tenga usos valiosos no significa que su diseño sea neutral: un megáfono también sirve para pedir auxilio, y aun así alguien decidió cuánto volumen tiene.\n\n(4) Hay quien responde que la solución es individual: si no te gusta lo que ves, cierra la aplicación. El argumento se parece al de decirle a quien vive junto a una fábrica contaminante que, si no le gusta el humo, no respire. Las decisiones personales importan, pero no reemplazan la pregunta de cómo están hechas las cosas que todos usamos.\n\n(5) No propongo prohibir nada. Propongo algo más modesto y más difícil: dejar de hablar de las redes como si fueran un espacio natural, igual que el clima, y empezar a discutirlas como lo que son: productos con reglas que alguien escribió y que, por lo tanto, alguien podría escribir de otra manera.\n\nColumna de opinión escrita para este simulacro.", "vis": "", "items": [{"id": "LCC-131", "niv": 2, "cp": "lc_global", "cn": "", "e": "¿Cuál es la tesis principal de la columna?", "f": "Párrafos (1) y (5)", "vis": "", "o": [["A", "La solución a los problemas de las redes depende de que cada usuario cierre la aplicación.", "Es la postura que el autor critica en el párrafo (4) con la comparación de la fábrica.", false], ["B", "Las redes sociales deberían prohibirse porque su diseño premia los mensajes que indignan.", "El autor lo descarta: «No propongo prohibir nada».", false], ["C", "Las redes sociales se han convertido en la nueva plaza pública de las sociedades actuales.", "Es la idea que el autor cuestiona desde el primer párrafo: la comparación es «engañosa».", false], ["D", "Las redes no son espacios neutrales, sino productos cuyas reglas pueden discutirse.", "El párrafo (1) rechaza la comparación con la plaza y el (5) concluye que las redes son «productos con reglas que alguien escribió» y que podrían escribirse de otra manera.", true]]}, {"id": "LCC-132", "niv": 1, "cp": "lc_reflexion", "cn": "", "e": "En el párrafo (3), el autor", "f": "Párrafo (3)", "vis": "", "o": [["A", "niega que las redes sociales hayan permitido a mucha gente denunciar abusos o hacerse escuchar.", "No lo niega: dice que es cierto y que «sería injusto olvidarlo».", false], ["B", "reconoce un argumento de los defensores de las plataformas y matiza su alcance.", "Admite que gracias a las redes muchas personas pueden denunciar y organizarse («Es cierto»), pero añade que eso no hace neutral su diseño.", true], ["C", "abandona su tesis inicial y pasa a defender a las plataformas digitales.", "Mantiene su tesis: con el «Pero» insiste en que el diseño no es neutral.", false], ["D", "presenta datos estadísticos sobre las denuncias hechas en redes sociales.", "El párrafo no contiene cifras ni estadísticas.", false]]}, {"id": "LCC-133", "niv": 3, "cp": "lc_reflexion", "cn": "", "e": "La comparación con la persona que vive junto a una fábrica contaminante (párrafo 4) busca mostrar que", "f": "Párrafo (4)", "vis": "", "o": [["A", "no basta con soluciones individuales si la falla está en cómo se hizo el producto.", "El autor dice que las decisiones personales importan, «pero no reemplazan la pregunta de cómo están hechas las cosas que todos usamos».", true], ["B", "las decisiones de cada usuario pesan más que el diseño de las plataformas.", "El autor dice lo contrario: las decisiones personales importan, pero «no reemplazan» la pregunta por el diseño.", false], ["C", "las redes sociales producen contaminación ambiental, igual que las fábricas.", "La comparación es una analogía sobre la responsabilidad, no una afirmación sobre contaminación real.", false], ["D", "los usuarios deberían abandonar las redes como quien se muda lejos de una fábrica.", "El autor critica precisamente la solución individual de alejarse o cerrar la aplicación.", false]]}, {"id": "LCC-134", "niv": 3, "cp": "lc_reflexion", "cn": "", "e": "¿Cuál de los siguientes hallazgos, de ser cierto, debilitaría más el argumento del párrafo (2)?", "f": "Párrafo (2)", "vis": "", "o": [["A", "Los programadores de los algoritmos no tienen la intención de favorecer la indignación.", "El autor ya lo admite («No hace falta suponer mala intención»), así que no debilita su argumento.", false], ["B", "Muchos usuarios dicen que les molestan los mensajes ofensivos que ven en las redes.", "Que les molesten no contradice que los retengan; el autor dice que esos mensajes «obligan a responder».", false], ["C", "Los mensajes serenos retienen a los usuarios tanto tiempo como los ofensivos.", "El argumento depende de que la indignación retenga más que los mensajes serenos; si no fuera así, el algoritmo no tendría por qué favorecerla.", true], ["D", "La mayor parte de los ingresos de las plataformas proviene de la venta de publicidad.", "Esto refuerza el argumento: confirma el interés en retener a los usuarios.", false]]}]}, {"comp": "lectura_critica", "sim": "s11-3", "ses": 1, "ind": "Historieta: un videojuego y un trompo de verdad", "tt": "Caricatura o cómic", "texto": "Historieta: «El campeón»\n\nViñeta 1: Tomás, un niño de unos diez años, está sentado frente al televisor con un control de videojuego en las manos. En la pantalla brilla el letrero «NIVEL 50». Tomás grita: «¡Soy el mejor del mundo en Trompo Extremo!». Desde la puerta, su abuelo lo observa con las manos escondidas detrás de la espalda.\n\nViñeta 2: El abuelo muestra lo que escondía: un trompo de madera y una cuerda. Abuelo: «¿Y con uno de verdad?». Tomás, sin dejar de mirar la pantalla: «Eso es fácil, abuelo. Es lo mismo».\n\nViñeta 3: En el patio. Tomás lanza el trompo con fuerza; el trompo sale volando de lado y cae sobre una matera de barro, que se rompe. Una onomatopeya grande dice «¡CRASH!». El abuelo se tapa los ojos con una mano.\n\nViñeta 4: Los dos están sentados en el andén. El abuelo enrolla la cuerda con calma. Abuelo: «En mis tiempos, pasar el nivel 1 tomaba un mes». Tomás, con el trompo en la mano, sonríe: «¿Y cuántas vidas tenías?». Abuelo: «Las que aguantaran las materas de tu abuela».\n\nHistorieta original escrita para este simulacro.", "vis": "", "items": [{"id": "LCC-135", "niv": 1, "cp": "lc_local", "cn": "", "e": "En la viñeta 3, ¿por qué el abuelo se tapa los ojos?", "f": "Viñeta 3", "vis": "", "o": [["A", "Porque teme que Tomás descubra que él tampoco sabe lanzar el trompo.", "Nada lo sugiere: en la viñeta 4 el abuelo enrolla la cuerda con calma, como quien sabe usarla.", false], ["B", "Porque el sol del patio lo encandila y no lo deja ver el trompo.", "La historieta no menciona el sol en el patio; el gesto coincide con el ruido de la matera rota.", false], ["C", "Porque Tomás lanzó el trompo directamente contra él.", "El trompo sale volando de lado y cae sobre una matera, no contra el abuelo.", false], ["D", "Porque presencia el mal lanzamiento de Tomás, que termina rompiendo una matera.", "En la misma viñeta el trompo sale volando de lado y rompe una matera de barro («¡CRASH!»); el gesto del abuelo es una reacción ante ese desastre.", true]]}, {"id": "LCC-136", "niv": 2, "cp": "lc_global", "cn": "", "e": "La frase de Tomás «Es lo mismo» (viñeta 2) contrasta con lo que ocurre después porque", "f": "Viñetas 2 y 3", "vis": "", "o": [["A", "Tomás prefiere volver a su videojuego después de romper la matera.", "La historieta no lo muestra; en la viñeta 4 Tomás sigue con el trompo en la mano, conversando con su abuelo.", false], ["B", "el abuelo tampoco consigue que el trompo de madera baile en el patio.", "La historieta no muestra al abuelo lanzando el trompo.", false], ["C", "su destreza en el videojuego no le sirve con un trompo de verdad.", "Tomás cree que el trompo real es igual al del videojuego, pero en la viñeta 3 su lanzamiento fracasa.", true], ["D", "el videojuego resulta mucho más difícil para Tomás que el trompo de madera.", "Ocurre lo contrario: Tomás domina el videojuego y fracasa con el trompo real.", false]]}, {"id": "LCC-137", "niv": 2, "cp": "lc_reflexion", "cn": "", "e": "El humor de la última respuesta del abuelo se basa en que", "f": "Viñeta 4", "vis": "", "o": [["A", "explica a Tomás las reglas oficiales que tenía el juego del trompo en su época.", "El abuelo no enuncia reglas; responde en broma a la pregunta por las vidas.", false], ["B", "aplica una idea de los videojuegos a un límite real: las materas de la abuela.", "Tomás pregunta por «vidas» como en un videojuego, y el abuelo responde que el número de intentos lo ponían las materas de la abuela que se podían romper, uniendo los dos mundos.", true], ["C", "se burla de Tomás por haber roto la matera y lo amenaza con un castigo.", "El abuelo responde con calma y complicidad; no hay amenaza ni burla.", false], ["D", "demuestra que los juegos de antes eran más peligrosos que los videojuegos de hoy.", "La respuesta no compara peligros; hace un chiste sobre las materas.", false]]}]}, {"comp": "lectura_critica", "sim": "s11-3", "ses": 1, "ind": "Infografía: campaña de actividad física escolar", "tt": "Texto discontinuo", "texto": "Campaña escolar «Muévete 60»\n\nLa Organización Mundial de la Salud recomienda que niños y adolescentes de 5 a 17 años hagan, en promedio, al menos 60 minutos diarios de actividad física moderada a vigorosa a lo largo de la semana.\n\n¿Cómo saber la intensidad? Usa la prueba del habla:\n• Moderada: puedes hablar, pero no cantar.\n• Vigorosa: te cuesta decir más de unas pocas palabras sin parar a respirar.\n\nRecuerda: algo de actividad es mejor que nada. Empieza poco a poco y súmale minutos a tu día.", "vis": "<table class=\"vt\"><caption>Tabla 2. Ejemplos de actividades según su intensidad<\/caption><thead><tr><th>Actividad<\/th><th>Intensidad habitual<\/th><\/tr><\/thead><tbody><tr><td>Caminar rápido al colegio<\/td><td>Moderada<\/td><\/tr><tr><td>Pasear en bicicleta por terreno plano<\/td><td>Moderada<\/td><\/tr><tr><td>Bailar<\/td><td>Moderada o vigorosa, según el ritmo<\/td><\/tr><tr><td>Jugar un partido de fútbol o de baloncesto<\/td><td>Vigorosa<\/td><\/tr><tr><td>Saltar lazo<\/td><td>Vigorosa<\/td><\/tr><tr><td>Ver un partido por televisión<\/td><td>No cuenta<\/td><\/tr><\/tbody><\/table><table class=\"vt\"><caption>Tabla 3. Mitos y realidades<\/caption><thead><tr><th>Mito<\/th><th>Realidad<\/th><\/tr><\/thead><tbody><tr><td>«Con dos clases de educación física a la semana ya cumplo».<\/td><td>Dos clases rara vez alcanzan el promedio de 60 minutos diarios. Súmales el camino, el recreo y el juego.<\/td><\/tr><tr><td>«Solo cuenta si voy a un gimnasio».<\/td><td>Las tareas de la casa, el baile y los juegos de barrio también cuentan si te hacen respirar más rápido.<\/td><\/tr><tr><td>«Los 60 minutos tienen que ser seguidos».<\/td><td>Puedes repartirlos a lo largo del día.<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Campaña ficticia elaborada para este simulacro. Recomendación basada en las directrices de la OMS sobre actividad física (2020).<\/div>", "items": [{"id": "LCC-138", "niv": 1, "cp": "lc_local", "cn": "", "e": "Según la infografía, una actividad es de intensidad vigorosa cuando", "f": "Prueba del habla", "vis": "", "o": [["A", "hablar se vuelve difícil porque al cuerpo le falta el aire.", "Es la descripción de «vigorosa» en la prueba del habla.", true], ["B", "se hace con implementos deportivos, como un balón o una cuerda.", "La intensidad no depende de los implementos sino de la respiración; bailar puede ser vigoroso sin ningún implemento.", false], ["C", "hace sudar, aunque todavía se pueda conversar sin esfuerzo.", "Si se puede conversar sin esfuerzo, la actividad no es vigorosa según la prueba del habla; el sudor no es el criterio.", false], ["D", "se puede hablar con normalidad, pero no cantar.", "Esa es la descripción de la intensidad moderada.", false]]}, {"id": "LCC-139", "niv": 2, "cp": "lc_global", "cn": "", "e": "Según la información de la infografía, ¿cuál de los siguientes estudiantes suma ese día al menos los 60 minutos recomendados?", "f": "Tablas 1 y 2", "vis": "", "o": [["A", "Lucía ve un partido de fútbol de 90 minutos por televisión.", "La tabla 2 indica que ver un partido por televisión no cuenta.", false], ["B", "Sara salta lazo 10 minutos y después ve series durante dos horas.", "Solo suma 10 minutos de actividad vigorosa; ver series no cuenta.", false], ["C", "Mateo pasea 40 minutos en bicicleta por terreno plano y luego hace tareas en su escritorio.", "Solo suma 40 minutos de actividad moderada; las tareas en el escritorio no son actividad física.", false], ["D", "Andrés camina rápido 20 minutos de ida, 20 de regreso y juega 25 de baloncesto.", "Caminar rápido es moderada y el baloncesto vigoroso: 20 + 20 + 25 = 65 minutos. La tabla 3 aclara que los minutos pueden repartirse.", true]]}, {"id": "LCC-140", "niv": 1, "cp": "lc_global", "cn": "", "e": "La sección «Mitos y realidades» tiene como propósito principal", "f": "Tabla 3", "vis": "", "o": [["A", "clasificar las actividades más comunes según su nivel de intensidad.", "Esa es la función de la tabla 2, no de la tabla de mitos.", false], ["B", "corregir creencias erradas que dificultan cumplir la recomendación.", "Cada fila presenta una creencia errónea (que bastan dos clases, que solo cuenta el gimnasio, que deben ser seguidos) y la corrige.", true], ["C", "presentar los resultados de una encuesta hecha a estudiantes del colegio.", "La tabla no contiene datos de encuestas; enfrenta creencias con aclaraciones.", false], ["D", "demostrar que el gimnasio es la mejor opción para hacer actividad física.", "Una de las realidades dice justamente que no solo cuenta el gimnasio.", false]]}, {"id": "LCC-141", "niv": 3, "cp": "lc_reflexion", "cn": "", "e": "Después de leer la infografía, un estudiante concluye: «Ver deportes no sirve para nada». ¿Es válida su conclusión?", "f": "Tabla 2", "vis": "", "o": [["A", "No, porque «no cuenta» se refiere a la actividad física, no a cualquier valor.", "La tabla 2 dice «No cuenta» en relación con los 60 minutos de actividad; generalizar a «no sirve para nada» va más allá de lo que afirma el texto.", true], ["B", "No, porque ver un partido es actividad moderada si quien lo ve grita y se emociona.", "Contradice la tabla 2, que clasifica ver un partido por televisión como «No cuenta».", false], ["C", "Sí, porque la tabla dice que ver un partido por televisión no cuenta.", "La tabla dice que no cuenta como actividad física, no que no tenga ninguna utilidad.", false], ["D", "Sí, porque la infografía propone cambiar el tiempo de televisión por movimiento.", "La infografía no dice eso; e incluso si lo dijera, no se seguiría que ver deportes carezca de todo valor.", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "s11-3", "ses": 1, "ind": "Acción popular y ambiente", "tt": "", "texto": "Los habitantes de un barrio denuncian que una empresa vierte residuos sin tratar en la quebrada que atraviesa el sector, un bien de uso público. Hasta ahora ninguna persona ha sufrido daños en su salud ni en sus bienes; lo que está en riesgo es el estado de la quebrada y del ambiente del sector. Los vecinos quieren que un juez ordene detener el vertimiento.", "vis": "", "items": [{"id": "SCC-102", "niv": 2, "cp": "sc_pensamiento_social", "cn": "", "e": "¿Qué acción judicial prevé la Constitución para este tipo de situación?", "f": "Constitución Política de 1991, arts. 86, 87 y 88", "vis": "", "o": [["A", "La acción de cumplimiento.", "La acción de cumplimiento (artículo 87) exige que una autoridad cumpla una ley o un acto administrativo; aquí quien contamina es una empresa y no se menciona una norma incumplida por una autoridad.", false], ["B", "La acción de grupo.", "La acción de grupo (artículo 88, inciso 2) busca reparar daños ya causados a un número plural de personas; en el caso todavía no hay personas afectadas.", false], ["C", "La acción popular.", "El artículo 88 establece las acciones populares para proteger derechos e intereses colectivos, entre ellos el ambiente y el espacio público; aquí lo amenazado es un bien colectivo y no hay daño individual.", true], ["D", "La acción de tutela.", "La tutela protege derechos fundamentales de personas concretas; el texto aclara que nadie ha sufrido daños en su salud ni en sus bienes.", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "s11-3", "ses": 1, "ind": "Jurisdicción especial indígena", "tt": "", "texto": "En un resguardo del Cauca, las autoridades tradicionales de la comunidad resolvieron un conflicto por linderos entre dos familias aplicando sus propias normas y procedimientos.", "vis": "", "items": [{"id": "SCC-107", "niv": 2, "cp": "sc_pensamiento_social", "cn": "", "e": "Según el artículo 246 de la Constitución, esta actuación es válida siempre que", "f": "Constitución Política de 1991, art. 246", "vis": "", "o": [["A", "las autoridades indígenas apliquen el Código Penal colombiano en lugar de sus propias normas.", "Contradice el artículo 246, que reconoce que actúan «de conformidad con sus propias normas y procedimientos».", false], ["B", "un juez de la República revise y apruebe previamente cada una de las decisiones que tomen las autoridades del resguardo.", "El artículo 246 no exige aprobación previa de un juez; dice que la ley establecerá formas de coordinación entre esta jurisdicción y el sistema judicial nacional.", false], ["C", "el conflicto haya ocurrido fuera del resguardo, en el casco urbano del municipio.", "Es al revés: la jurisdicción indígena se ejerce dentro del ámbito territorial de la comunidad.", false], ["D", "se realice dentro de su ámbito territorial y sus normas no sean contrarias a la Constitución y las leyes.", "El artículo 246 permite a las autoridades indígenas ejercer funciones jurisdiccionales dentro de su ámbito territorial, según sus propias normas y procedimientos, siempre que no sean contrarios a la Constitución y leyes de la República.", true]]}]}, {"comp": "sociales_ciudadanas", "sim": "s11-3", "ses": 1, "ind": "Plebiscito y referendo", "tt": "", "texto": "El 2 de octubre de 2016 los colombianos respondieron en las urnas esta pregunta: «¿Apoya usted el acuerdo final para la terminación del conflicto y la construcción de una paz estable y duradera?». El mecanismo fue convocado por el presidente de la República. Según el preconteo de la Registraduría, el resultado fue 50,21 % por el No y 49,78 % por el Sí.", "vis": "", "items": [{"id": "SCC-108", "niv": 3, "cp": "sc_pensamiento_social", "cn": "", "e": "¿Por qué este mecanismo corresponde a un plebiscito y no a un referendo?", "f": "Ley 134 de 1994, arts. 3 y 7; resultados: preconteo de la Registraduría, boletín 53", "vis": "", "o": [["A", "Porque en un plebiscito solo pueden votar los ciudadanos que residen en las zonas más afectadas por el conflicto.", "No existe esa restricción; en 2016 votaron ciudadanos de todo el país. El criterio que distingue los mecanismos es qué se somete a votación y quién convoca.", false], ["B", "Porque el resultado de un plebiscito debe superar el 60 % de los votos para producir algún efecto.", "Es un requisito inventado; no corresponde a la definición de ninguno de los dos mecanismos.", false], ["C", "Porque el pueblo se pronunció para apoyar o rechazar una decisión del Ejecutivo, no para aprobar o derogar una norma jurídica.", "La Ley 134 de 1994 define el plebiscito (art. 7) como el pronunciamiento del pueblo convocado por el Presidente para apoyar o rechazar una decisión del Ejecutivo, y el referendo (art. 3) como la convocatoria para aprobar o rechazar un proyecto de norma jurídica o derogar una norma vigente.", true], ["D", "Porque un referendo solo lo puede convocar el Congreso, mientras que un plebiscito lo puede convocar cualquier ciudadano inscrito en el censo electoral.", "El plebiscito lo convoca el Presidente de la República (Ley 134 de 1994, art. 7), no cualquier ciudadano; y un referendo puede originarse, por ejemplo, en una iniciativa popular.", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "s11-3", "ses": 1, "ind": "Relleno sanitario regional", "tt": "", "texto": "El gobierno departamental propone construir un relleno sanitario regional en una vereda de un municipio agrícola, para recibir las basuras de ocho municipios. Estas son algunas posiciones (ficticias):\n\nPresidenta de la junta de acción comunal de la vereda: «Aquí vivimos de cultivar. Tememos los malos olores y que los lixiviados contaminen el nacimiento de agua de la vereda. Si el proyecto sigue, exigimos participar desde el diseño».\n\nAlcalde del municipio receptor: «Mi municipio cargaría con la basura de otros ocho. Pido una compensación económica para invertir en la vereda».\n\nAlcaldesa de un municipio vecino: «Nuestro botadero actual está a punto de colapsar; necesitamos una solución en menos de dos años».\n\nGerente de la empresa operadora: «Con un buen manejo técnico, los lixiviados se tratan antes de salir del relleno. Además, el costo por tonelada baja si llegan más municipios».", "vis": "", "items": [{"id": "SCC-109", "niv": 1, "cp": "sc_perspectivas", "cn": "", "e": "Además de la presidenta de la junta, ¿qué otro actor plantea una exigencia en favor de la vereda, y en qué consiste?", "f": "Análisis de los testimonios del caso", "vis": "", "o": [["A", "El alcalde del municipio receptor, que pide una compensación para invertir en la vereda.", "El alcalde pide una compensación económica «para invertir en la vereda», por recibir la basura de otros ocho municipios.", true], ["B", "La alcaldesa vecina, que pide ubicar el relleno lejos del nacimiento de agua de la vereda.", "La alcaldesa no habla de la ubicación ni del agua; su preocupación es el colapso del botadero de su municipio.", false], ["C", "El gerente de la empresa, que exige tratar los lixiviados como condición para el proyecto.", "El gerente no exige nada en favor de la vereda: afirma que su manejo técnico trata los lixiviados y destaca la reducción de costos.", false], ["D", "La alcaldesa vecina, que exige dos años de plazo para que la vereda participe en el diseño.", "Lee mal el plazo: los dos años son el tiempo en que su municipio necesita una solución, no un plazo de participación para la vereda.", false]]}, {"id": "SCC-110", "niv": 3, "cp": "sc_perspectivas", "cn": "", "e": "¿Qué propuesta atiende las preocupaciones expresadas por un mayor número de actores?", "f": "Análisis de perspectivas y propuestas de solución", "vis": "", "o": [["A", "Aplazar el relleno regional hasta que cada uno de los ocho municipios construya y opere su propio relleno sanitario.", "Puede aliviar a la vereda, pero no responde a la urgencia de la alcaldesa ni al interés de la empresa en un proyecto regional.", false], ["B", "Construirlo con la vereda participando en el diseño y en el control del agua, y compensar al municipio receptor.", "Atiende a la presidenta (participación y agua), al alcalde (compensación), a la alcaldesa (una solución regional) y a la empresa (el proyecto sigue con varios municipios).", true], ["C", "Construirlo de inmediato con la tecnología de la empresa, porque esa tecnología ya resuelve el tratamiento de los lixiviados.", "Atiende a la empresa y a la alcaldesa, pero deja sin respuesta la participación que exige la vereda y la compensación que pide el alcalde.", false], ["D", "Compensar al municipio receptor y construir el relleno en la vereda tal como está diseñado, sin abrir espacios de participación.", "Atiende al alcalde, a la alcaldesa y a la empresa, pero no a la presidenta de la junta, que exige participar desde el diseño.", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "s11-3", "ses": 1, "ind": "Testimonio de desplazamiento forzado", "tt": "", "texto": "Testimonio (ficticio) de una mujer, recogido en 2024 por el grupo de memoria histórica de un colegio:\n\n«En 1998 vivíamos en una vereda del Magdalena Medio. Teníamos una finca pequeña con plátano y gallinas. Una noche llegaron hombres armados y nos dijeron que teníamos 48 horas para irnos. Salimos con lo que pudimos cargar. Llegamos a Barrancabermeja y vivimos varios años en una pieza alquilada; mi esposo trabajaba en lo que saliera. Mis hijos tuvieron que dejar la escuela un año. Nunca supimos bien por qué nos sacaron: algunos vecinos decían que querían la tierra; otros, que era por el control de la zona».", "vis": "", "items": [{"id": "SCC-111", "niv": 2, "cp": "sc_perspectivas", "cn": "", "e": "¿Para cuál de los siguientes propósitos es más adecuado usar este testimonio como fuente?", "f": "Análisis de fuentes primarias", "vis": "", "o": [["A", "Para conocer la posición de los grupos armados sobre la tenencia de la tierra en la región.", "El testimonio recoge la voz de una víctima; no contiene la versión ni los objetivos declarados de los grupos armados.", false], ["B", "Para calcular cuántas personas fueron desplazadas en Colombia durante 1998.", "Un solo testimonio no permite cifras nacionales; para eso se necesitan registros estadísticos.", false], ["C", "Para explicar las causas del desplazamiento en el Magdalena Medio a partir de lo que comentaban los vecinos.", "La mujer solo reporta rumores contradictorios («algunos decían… otros…»); un testimonio basado en lo que se oía no basta para explicar las causas.", false], ["D", "Para comprender cómo vivió una familia el desplazamiento forzado y sus efectos en la vida cotidiana.", "Un testimonio es una fuente primaria valiosa para conocer la experiencia vivida: la salida forzada, la vivienda, el trabajo y la interrupción escolar de los hijos.", true]]}, {"id": "SCC-112", "niv": 1, "cp": "sc_perspectivas", "cn": "", "e": "Teniendo en cuenta la fecha y los hechos que narra, este testimonio se inscribe en el contexto de", "f": "Ley 1448 de 2011, art. 3; historia de Colombia en el siglo XX", "vis": "", "o": [["A", "el conflicto armado interno, que provocó desplazamientos forzados del campo a las ciudades.", "Los hechos (1998, hombres armados, salida forzada hacia una ciudad) corresponden al desplazamiento forzado en el marco del conflicto armado interno; la Ley 1448 de 2011 reconoce como víctimas a quienes sufrieron daños por hechos ocurridos desde el 1 de enero de 1985.", true], ["B", "la bonanza petrolera de Barrancabermeja, que atrajo trabajadores de otras regiones del país.", "La familia no llegó atraída por empleo petrolero: salió de su finca bajo amenaza de hombres armados.", false], ["C", "la Violencia bipartidista, que enfrentó a liberales y conservadores y expulsó a muchos campesinos.", "La Violencia bipartidista se ubica a mediados del siglo XX; el testimonio narra hechos de 1998.", false], ["D", "la migración del campo a la ciudad de mediados del siglo XX, motivada por la búsqueda de empleo industrial.", "No es una migración voluntaria ni de mediados del siglo XX: la familia fue obligada a salir en 1998.", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "s11-3", "ses": 1, "ind": "Sanciones propias de la JEP", "tt": "", "texto": "En una clase de ciencias sociales, dos estudiantes discuten sobre las sanciones propias de la Jurisdicción Especial para la Paz (JEP), creada a partir del Acuerdo Final de 2016. Estas sanciones se imponen a quienes aportan verdad plena y aceptan su responsabilidad por crímenes graves. No son prisión en una cárcel: consisten en trabajos, obras y actividades reparadoras, con restricción efectiva de libertades y derechos durante 5 a 8 años para quienes tuvieron una participación determinante, y de 2 a 5 años para los demás.\n\nSamuel: «Me preocupa que los responsables de crímenes muy graves no vayan a la cárcel. Muchas víctimas pueden sentir que el castigo no corresponde al daño que sufrieron».\n\nValentina: «Entiendo esa preocupación, pero sin estas sanciones muchos responsables no contarían lo que pasó, y muchas víctimas nunca sabrían la verdad sobre sus familiares».", "vis": "", "items": [{"id": "SCC-113", "niv": 2, "cp": "sc_perspectivas", "cn": "", "e": "¿Con qué criterio principal evalúa cada estudiante las sanciones propias?", "f": "Análisis de argumentos; sanciones propias: Ley 1957 de 2019 y JEP, «ABC de las sanciones propias»", "vis": "", "o": [["A", "Samuel, por su aporte al conocimiento de la verdad; Valentina, por la proporción entre el castigo y el daño.", "Invierte los criterios: es Valentina quien habla de la verdad y Samuel quien habla de la correspondencia entre castigo y daño.", false], ["B", "Ambos, por el número de responsables que terminarían en una cárcel.", "Valentina no evalúa las sanciones por la cárcel; su argumento se centra en la verdad.", false], ["C", "Samuel, por la proporción entre el castigo y el daño; Valentina, por su aporte al conocimiento de la verdad.", "Samuel se pregunta si el castigo corresponde al daño sufrido por las víctimas; Valentina valora que las sanciones motivan a los responsables a contar lo que pasó.", true], ["D", "Ambos, por el costo económico que tienen las sanciones para el Estado.", "Ninguno de los dos menciona costos económicos.", false]]}, {"id": "SCC-114", "niv": 3, "cp": "sc_perspectivas", "cn": "", "e": "¿Qué supuesto comparten los dos estudiantes, aunque lleguen a valoraciones distintas?", "f": "Análisis de argumentos y supuestos", "vis": "", "o": [["A", "Que la cárcel es la única forma legítima de sancionar a los responsables de crímenes graves.", "Samuel echa de menos la cárcel, pero Valentina defiende sanciones distintas de la prisión; no es un supuesto compartido.", false], ["B", "Que la respuesta a los crímenes graves debe tener en cuenta lo que necesitan las víctimas.", "Samuel apela a lo que sienten las víctimas frente al castigo y Valentina a que las víctimas conozcan la verdad: ambos evalúan las sanciones desde las víctimas.", true], ["C", "Que las sanciones propias deberían eliminarse y reemplazarse por amnistías generales.", "Ninguno propone eliminar las sanciones ni conceder amnistías.", false], ["D", "Que conocer la verdad es más importante que cualquier forma de castigo.", "Es la prioridad de Valentina, no la de Samuel, a quien le preocupa la proporción del castigo.", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "s11-3", "ses": 1, "ind": "Los Derechos del Hombre en la Nueva Granada", "tt": "", "texto": "En diciembre de 1793, en Santafé (hoy Bogotá), Antonio Nariño tradujo al castellano e imprimió en secreto la Declaración de los Derechos del Hombre y del Ciudadano, aprobada en Francia en agosto de 1789. Entre otras ideas, ese documento sostenía que los hombres nacen y permanecen libres e iguales en derechos, que el principio de toda soberanía reside esencialmente en la nación y que la ley es la expresión de la voluntad general. En agosto de 1794 Nariño fue arrestado y procesado por las autoridades del virreinato.", "vis": "", "items": [{"id": "SCC-116", "niv": 2, "cp": "sc_perspectivas", "cn": "", "e": "¿En qué contexto cultural y político se inscribe este documento?", "f": "Biblioteca Nacional de Colombia, «La impresión de los Derechos del Hombre»; Banrepcultural, «Palabras que nos cambiaron: 1794»", "vis": "", "o": [["A", "El Renacimiento italiano, que recuperó el arte y la literatura grecorromanos.", "El Renacimiento (siglos XV y XVI) es anterior y se asocia sobre todo con el arte y el humanismo, no con la soberanía nacional ni con los derechos del ciudadano.", false], ["B", "La Reforma protestante, que buscó cambiar la organización de la Iglesia católica.", "La Reforma fue un movimiento religioso del siglo XVI; la Declaración trata de derechos políticos y de la soberanía.", false], ["C", "La Revolución Industrial, que transformó la producción de bienes con fábricas y máquinas de vapor.", "La Revolución Industrial fue un proceso económico y técnico; no es la fuente de los principios políticos que contiene la Declaración.", false], ["D", "La Ilustración y la Revolución francesa, que cuestionaron el poder absoluto de los reyes.", "La Declaración fue aprobada en 1789 por la Asamblea Nacional de Francia, al inicio de la Revolución, y recoge ideas ilustradas: igualdad de derechos, soberanía de la nación y ley como voluntad general.", true]]}, {"id": "SCC-117", "niv": 3, "cp": "sc_perspectivas", "cn": "", "e": "¿Por qué las autoridades del virreinato consideraron peligroso este impreso?", "f": "Biblioteca Nacional de Colombia; Declaración de 1789, arts. 1, 3 y 6", "vis": "", "o": [["A", "Porque proponía que la Iglesia católica eligiera a los virreyes y a los gobernadores de las provincias.", "El texto no dice eso; sus ideas apuntan a la soberanía de la nación, no a un poder eclesiástico.", false], ["B", "Porque, al declarar a los hombres libres e iguales en derechos, abolía de inmediato la esclavitud en el virreinato.", "La Declaración era un texto de principios francés; no tenía fuerza legal en el virreinato ni abolió allí la esclavitud.", false], ["C", "Porque había sido escrito por Nariño y no por la Asamblea francesa, lo que lo hacía un texto falsificado.", "Nariño solo lo tradujo; el documento fue aprobado por la Asamblea Nacional de Francia.", false], ["D", "Porque atribuir el poder supremo a la nación ponía en duda la autoridad del rey.", "En la monarquía española el poder residía en el rey; sostener que la soberanía reside en la nación cuestionaba la base del orden colonial, y por eso Nariño fue procesado.", true]]}]}, {"comp": "sociales_ciudadanas", "sim": "s11-3", "ses": 1, "ind": "Construcción de una represa", "tt": "", "texto": "El gobierno de un departamento evalúa construir una represa para generar energía eléctrica en un cañón donde viven unas 300 familias campesinas. El estudio preliminar (ficticio) señala:\n\n• La represa abastecería de energía a cerca de 400.000 hogares y reduciría la compra de energía a otras regiones.\n• El embalse inundaría 2.000 hectáreas de bosque seco y de tierras de cultivo.\n• Las familias tendrían que ser reasentadas; muchas viven de la pesca artesanal y de los cultivos en las orillas del río.\n• Durante la construcción se crearían unos 3.000 empleos temporales.", "vis": "", "items": [{"id": "SCC-119", "niv": 1, "cp": "sc_reflexivo_sistemico", "cn": "", "e": "Un funcionario afirma: «Los 3.000 empleos de la obra compensan a las familias que serán reasentadas». ¿Por qué ese argumento es insuficiente?", "f": "Análisis de dimensiones de un problema", "vis": "", "o": [["A", "Porque esos empleos son temporales y no reemplazan los medios de vida permanentes de las familias.", "El estudio dice que los empleos son de la etapa de construcción, mientras que las familias pierden de forma permanente la pesca y los cultivos de la orilla.", true], ["B", "Porque los empleos de construcción benefician sobre todo a la dimensión ambiental del proyecto.", "Los empleos son un efecto económico, no ambiental.", false], ["C", "Porque 3.000 empleos son menos que el número de familias afectadas por la represa.", "Es al revés: 3.000 empleos superan a las unas 300 familias; el problema no es la cantidad sino la duración y el tipo de empleo.", false], ["D", "Porque el estudio no informa cuántos hogares recibirían energía de la represa.", "El estudio sí lo informa: cerca de 400.000 hogares.", false]]}, {"id": "SCC-120", "niv": 3, "cp": "sc_reflexivo_sistemico", "cn": "", "e": "Si se construye la represa y se reasienta a las familias en una zona urbana lejos del río, ¿qué efecto probable debería prever el gobierno?", "f": "Análisis de efectos de una intervención", "vis": "", "o": [["A", "Que los empleos de la construcción se vuelvan permanentes cuando termine la obra.", "El estudio indica que son empleos temporales, propios de la etapa de construcción.", false], ["B", "Que muchas familias pierdan su fuente de ingresos, porque sus oficios dependen del río y de las tierras de la orilla.", "El estudio dice que muchas familias viven de la pesca artesanal y de cultivos en las orillas; lejos del río no podrían seguir con esos oficios.", true], ["C", "Que disminuya la energía disponible en el departamento, porque la represa consumiría cada año más energía de la que produce.", "Contradice el estudio, que prevé abastecer a unos 400.000 hogares.", false], ["D", "Que las familias aumenten sus ingresos, porque en la ciudad encontrarían con facilidad empleos formales mejor pagados.", "Nada garantiza ese empleo: sus saberes son la pesca y los cultivos de ribera, que no tienen uso directo en la ciudad.", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "s11-3", "ses": 1, "ind": "Política comercial en un país ficticio", "tt": "", "texto": "El gobierno de Valdora, un país ficticio, decide eliminar el arancel (impuesto a las importaciones) que pagaba el arroz importado. Antes de la medida, el arroz nacional costaba $ 4.000 el kilo y el importado, con arancel, $ 4.200. Sin arancel, el importado pasaría a costar $ 3.200 el kilo.", "vis": "", "items": [{"id": "SCC-122", "niv": 2, "cp": "sc_reflexivo_sistemico", "cn": "", "e": "La medida es coherente principalmente con un modelo económico que", "f": "Conceptos de economía: libre comercio y proteccionismo", "vis": "", "o": [["A", "propone que el Estado fije todos los precios y controle la producción.", "Es propio de una economía de planificación centralizada; aquí el precio lo define el mercado.", false], ["B", "prohíbe el intercambio comercial con otros países para lograr la autosuficiencia.", "Eso describe la autarquía; la medida, por el contrario, facilita las importaciones.", false], ["C", "promueve el libre comercio y la reducción de barreras a las importaciones.", "Eliminar aranceles reduce las barreras al comercio internacional, que es el principio central del libre comercio.", true], ["D", "busca proteger la producción nacional frente a la competencia extranjera.", "El proteccionismo mantendría o aumentaría el arancel para encarecer el producto importado.", false]]}, {"id": "SCC-123", "niv": 2, "cp": "sc_reflexivo_sistemico", "cn": "", "e": "¿Qué efecto es más probable en el corto plazo?", "f": "Análisis de efectos de una política económica", "vis": "", "o": [["A", "El precio del arroz importado se mantendría en $ 4.200, igual que antes de la medida.", "El texto indica que sin arancel costaría $ 3.200.", false], ["B", "Nadie se vería afectado, porque el arancel no influye en los precios.", "El caso muestra que el arancel sí cambia el precio: de $ 4.200 a $ 3.200.", false], ["C", "Los consumidores pagarían menos por el arroz, y los productores nacionales enfrentarían más competencia.", "El importado bajaría a $ 3.200, por debajo del nacional ($ 4.000): beneficia al consumidor y presiona a los productores locales.", true], ["D", "Los productores nacionales venderían más, porque el arroz importado se volvería más caro que el suyo.", "El importado se vuelve más barato, no más caro.", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "s11-3", "ses": 1, "ind": "Ley 70 de 1993 y territorios del Pacífico", "tt": "", "texto": "La Ley 70 de 1993 desarrolló el artículo transitorio 55 de la Constitución. Su objeto es reconocer a las comunidades negras que han venido ocupando tierras baldías en las zonas rurales ribereñas de los ríos de la Cuenca del Pacífico, de acuerdo con sus prácticas tradicionales de producción, el derecho a la propiedad colectiva; también se aplica a otras zonas del país que presenten condiciones similares. Para recibir las tierras, cada comunidad forma un consejo comunitario.", "vis": "", "items": [{"id": "SCC-129", "niv": 3, "cp": "sc_pensamiento_social", "cn": "", "e": "¿Por qué la ley se refiere en primer lugar a las zonas ribereñas de los ríos del Pacífico?", "f": "Ley 70 de 1993, arts. 1, 3 y 5; Constitución de 1991, art. transitorio 55", "vis": "", "o": [["A", "Porque en esa región los ríos estructuran el poblamiento, el transporte y la producción tradicional.", "La ley reconoce una ocupación ligada a los ríos «de acuerdo con sus prácticas tradicionales de producción»: en el Pacífico los asentamientos, la movilidad, la pesca y la agricultura se organizan a lo largo de los ríos.", true], ["B", "Porque en las riberas no hay ecosistemas frágiles, así que podían titularse sin consecuencias ambientales.", "Es falso; entre los principios de la Ley 70 está la protección del medio ambiente.", false], ["C", "Porque las riberas eran las únicas tierras baldías del país, ya que el resto pertenecía a particulares.", "Hay baldíos en muchas regiones del país; la ley se refiere a los ribereños del Pacífico por la forma de ocupación de estas comunidades.", false], ["D", "Porque la ley buscaba trasladar a las comunidades negras hacia el Pacífico.", "La ley reconoce tierras que las comunidades «han venido ocupando»; no ordena traslados.", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "s11-3", "ses": 1, "ind": "Reforma de la Constitución", "tt": "", "texto": "Un grupo de ciudadanos quiere modificar un artículo de la Constitución Política y busca saber quién puede hacer esa reforma.", "vis": "", "items": [{"id": "SCC-132", "niv": 2, "cp": "sc_pensamiento_social", "cn": "", "e": "Según el artículo 374, la Constitución puede ser reformada por", "f": "Constitución Política de 1991, arts. 241, 374 y 375", "vis": "", "o": [["A", "los concejos municipales, cuando la mayoría de ellos lo aprueben.", "El 20 % de los concejales puede presentar proyectos de acto legislativo (artículo 375), pero los concejos no reforman la Constitución.", false], ["B", "el Congreso, una Asamblea Constituyente o el pueblo mediante referendo.", "Es lo que dispone textualmente el artículo 374.", true], ["C", "la Corte Constitucional, cuando un ciudadano se lo pida mediante una acción de tutela.", "La Corte guarda la integridad y supremacía de la Constitución (artículo 241), pero no la reforma; la tutela protege derechos fundamentales.", false], ["D", "el presidente de la República, por medio de un decreto.", "El presidente no figura entre quienes pueden reformar la Constitución según el artículo 374; el Gobierno puede presentar proyectos de acto legislativo (artículo 375), pero no aprobarlos.", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "s11-3", "ses": 1, "ind": "Debate sobre el salario mínimo", "tt": "", "texto": "Cada año, en Colombia, el aumento del salario mínimo se discute en una comisión tripartita con representantes del Gobierno, de los empleadores y de los trabajadores. Estas son tres opiniones (ficticias):\n\nDirigente de un gremio de pequeñas empresas: «Un aumento muy alto obligaría a muchas pequeñas empresas a contratar menos personas o a pasar a la informalidad».\n\nDirigente sindical: «Si el salario sube menos que el costo de vida, los trabajadores pierden capacidad de compra. El aumento debe compensar al menos la inflación».\n\nEconomista universitaria: «Ambos efectos son posibles. El impacto depende de cuánto suba el salario frente a la inflación y a la productividad».", "vis": "", "items": [{"id": "SCC-136", "niv": 1, "cp": "sc_perspectivas", "cn": "", "e": "¿Qué preocupa principalmente al dirigente sindical?", "f": "Análisis de perspectivas; Ley 278 de 1996 (comisión tripartita)", "vis": "", "o": [["A", "Que la productividad del país crezca demasiado rápido y haga innecesario cualquier aumento salarial.", "El dirigente sindical no menciona la productividad; la menciona la economista, y no como un problema.", false], ["B", "Que las pequeñas empresas contraten menos trabajadores.", "Esa es la preocupación del dirigente gremial.", false], ["C", "Que la comisión no incluya representantes del Gobierno.", "El texto dice que la comisión sí incluye al Gobierno, y el sindicalista no habla de eso.", false], ["D", "Que los trabajadores pierdan poder adquisitivo si el salario sube menos que los precios.", "El dirigente dice que si el salario sube menos que el costo de vida, los trabajadores pierden capacidad de compra.", true]]}, {"id": "SCC-137", "niv": 3, "cp": "sc_perspectivas", "cn": "", "e": "¿Qué afirmación describe mejor la posición de la economista frente a las otras dos?", "f": "Análisis de perspectivas", "vis": "", "o": [["A", "Apoya al dirigente gremial y propone congelar el salario mínimo.", "No toma partido por ninguno ni propone congelar el salario.", false], ["B", "Reconoce que ambos argumentos señalan riesgos posibles y sostiene que su peso depende de las condiciones económicas.", "Dice «ambos efectos son posibles» y que el impacto depende de la relación del aumento con la inflación y la productividad.", true], ["C", "Apoya al dirigente sindical y propone un aumento del doble de la inflación.", "No propone ninguna cifra de aumento.", false], ["D", "Rechaza los dos argumentos, porque considera que el salario mínimo no tiene ningún efecto sobre el empleo ni sobre los precios.", "Ella afirma lo contrario: que los dos efectos son posibles.", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "s11-3", "ses": 1, "ind": "Uso del celular en el colegio", "tt": "", "texto": "En un colegio, el consejo directivo decidió prohibir el uso de celulares durante toda la jornada, incluidos los descansos. Algunas reacciones:\n\nPersonero estudiantil: «Entendemos que el celular distrae en clase, pero la decisión se tomó sin escuchar a los estudiantes. Proponemos prohibirlo en clase y permitirlo en los descansos».\n\nCoordinadora académica: «Desde que se usan tanto los celulares, bajó la atención en clase. Necesitamos reglas claras».\n\nMadre de familia: «Mi hija usa el celular en el descanso para avisarme si necesita algo; prohibirlo del todo me preocupa».", "vis": "", "items": [{"id": "SCC-141", "niv": 1, "cp": "sc_perspectivas", "cn": "", "e": "¿Qué reconoce el personero que también afirma la coordinadora?", "f": "Análisis de perspectivas", "vis": "", "o": [["A", "Que se debió consultar a los padres.", "El personero habla de los estudiantes, no de los padres, y la coordinadora no critica la forma de la decisión.", false], ["B", "Que el celular debe permitirse durante toda la jornada.", "El personero propone prohibirlo en clase y la coordinadora pide reglas; ninguno pide permitirlo siempre.", false], ["C", "Que los estudiantes necesitan el celular para emergencias.", "Esa razón la da la madre de familia.", false], ["D", "Que el celular puede afectar la atención en clase.", "El personero admite que «el celular distrae en clase» y la coordinadora dice que «bajó la atención en clase».", true]]}, {"id": "SCC-142", "niv": 2, "cp": "sc_perspectivas", "cn": "", "e": "¿Qué propuesta respondería mejor a las preocupaciones de los tres actores?", "f": "Análisis de perspectivas y propuestas de solución", "vis": "", "o": [["A", "Prohibirlo en clase y permitirlo en los descansos, por decisión del consejo directivo.", "Resuelve el uso del celular, pero no responde a la queja del personero de que la decisión se tomó sin escuchar a los estudiantes.", false], ["B", "Prohibirlo siempre, pero instalar un teléfono fijo para emergencias.", "Atiende en parte a la madre y a la coordinadora, pero mantiene la prohibición total y no da participación a los estudiantes, como pide el personero.", false], ["C", "Prohibirlo en clase, permitirlo en los descansos y construir las normas con estudiantes y familias.", "Atiende la atención en clase (coordinadora), la comunicación en el descanso (madre) y la participación en la decisión (personero).", true], ["D", "Permitir el celular en los descansos y dejar que cada docente fije, por su cuenta, las reglas de su clase.", "No ofrece las reglas claras y comunes que pide la coordinadora ni incluye a estudiantes y familias en la decisión.", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "s11-3", "ses": 1, "ind": "Formalización de la propiedad rural", "tt": "", "texto": "El primer punto del Acuerdo Final de 2016, «Hacia un nuevo campo colombiano: Reforma Rural Integral», incluye la formalización de la propiedad rural, es decir, entregar títulos a campesinos que ocupan y trabajan predios que no están a su nombre. En una vereda (ficticia), la mayoría de los campesinos cultiva desde hace décadas tierras sin título.", "vis": "", "items": [{"id": "SCC-143", "niv": 2, "cp": "sc_reflexivo_sistemico", "cn": "", "e": "¿Qué efecto económico podría tener la formalización para estos campesinos?", "f": "Acuerdo Final (2016), punto 1; minjusticia.gov.co", "vis": "", "o": [["A", "Facilitar el acceso a créditos, porque un título puede servir como garantía ante los bancos.", "Con un título registrado, el campesino puede respaldar un préstamo con su predio, lo que facilita invertir en la producción.", true], ["B", "Asegurar la venta de sus cosechas, porque los compradores pagan más por productos de predios titulados.", "El título se refiere a la propiedad de la tierra; no determina a quién ni a qué precio se vende la cosecha.", false], ["C", "Aumentar sus cosechas, porque el título mejora la fertilidad y la productividad de la tierra.", "El título da seguridad jurídica, pero no cambia las condiciones físicas del suelo ni las cosechas.", false], ["D", "Reducir sus ingresos, porque los predios titulados dejan de recibir apoyos públicos para la producción.", "Nada en el caso ni en la formalización implica perder apoyos; por el contrario, el título suele facilitar el acceso a programas y créditos.", false]]}, {"id": "SCC-144", "niv": 3, "cp": "sc_reflexivo_sistemico", "cn": "", "e": "Si la formalización se hiciera sin verificar quiénes ocupaban las tierras antes del conflicto, ¿qué problema podría surgir?", "f": "Acuerdo Final (2016), punto 1; Ley 1448 de 2011 (restitución de tierras)", "vis": "", "o": [["A", "Que el proceso de titulación tarde mucho más, porque revisar la historia de cada predio exige tiempo.", "La demora sería consecuencia de verificar, no de omitir la verificación, que es el escenario planteado.", false], ["B", "Que se titulen tierras despojadas a personas desplazadas, en perjuicio de las víctimas.", "Durante el conflicto hubo despojo de tierras; titular sin revisar la historia de los predios podría legalizar ese despojo y afectar la restitución a las víctimas.", true], ["C", "Que suba el precio de la tierra en la vereda, lo que encarecería los arriendos para quienes no tienen título.", "Eso podría pasar con cualquier titulación; no es un problema que se derive de omitir la verificación del pasado de los predios.", false], ["D", "Que los campesinos titulados pierdan el acceso a los programas de vivienda rural del Estado.", "No hay relación entre omitir la verificación y la pérdida de programas de vivienda.", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "s11-3", "ses": 1, "ind": "Estrategias frente a los cultivos de uso ilícito", "tt": "", "texto": "El punto 4 del Acuerdo Final de 2016, «Solución al problema de las drogas ilícitas», incluyó un programa de sustitución voluntaria de cultivos de uso ilícito. En una región ficticia se comparan dos estrategias para reducir los cultivos de coca:\n\nEstrategia 1: erradicación forzosa y manual de los cultivos por parte de la fuerza pública. Reduce rápido las hectáreas sembradas, pero si las familias no tienen otros ingresos puede haber resiembra y tensiones con la fuerza pública.\n\nEstrategia 2: acuerdos con las familias cultivadoras para que arranquen voluntariamente la coca, a cambio de apoyo económico temporal y proyectos productivos legales. Cuenta con la participación de las familias, pero depende de que los pagos y los proyectos lleguen a tiempo; si se demoran o se incumplen, las familias pueden volver a sembrar.", "vis": "", "items": [{"id": "SCC-149", "niv": 2, "cp": "sc_reflexivo_sistemico", "cn": "", "e": "Según el texto, ¿qué riesgo comparten ambas estrategias?", "f": "Análisis de efectos de una intervención; Acuerdo Final (2016), punto 4", "vis": "", "o": [["A", "Que los pagos y los proyectos productivos lleguen tarde o no se cumplan.", "Es un riesgo propio de la estrategia 2; la estrategia 1 no incluye pagos ni proyectos.", false], ["B", "Que se presenten tensiones entre las familias y la fuerza pública durante la erradicación.", "El texto menciona ese riesgo solo para la estrategia 1, en la que actúa la fuerza pública.", false], ["C", "Que las familias vuelvan a sembrar coca si no cuentan con ingresos legales estables.", "Para la estrategia 1, el texto advierte resiembra si no hay otros ingresos; para la 2, si los pagos o proyectos se demoran o incumplen.", true], ["D", "Que la reducción de las hectáreas sembradas sea demasiado rápida.", "El texto presenta la rapidez como una ventaja de la estrategia 1, no como un riesgo de ambas.", false]]}, {"id": "SCC-150", "niv": 1, "cp": "sc_reflexivo_sistemico", "cn": "", "e": "Según el texto, ¿qué condición es clave para que la estrategia 2 no termine en resiembra?", "f": "Análisis de condiciones de una política; Acuerdo Final (2016), punto 4", "vis": "", "o": [["A", "Que el Estado cumpla oportunamente lo pactado con las familias.", "El texto advierte que si los pagos y proyectos se demoran o se incumplen, las familias pueden volver a sembrar; el cumplimiento oportuno es la condición clave.", true], ["B", "Que arranquen la coca antes de firmar un acuerdo.", "La estrategia 2 parte de un acuerdo previo con las familias a cambio de apoyos.", false], ["C", "Que los proyectos productivos se ubiquen lejos de las veredas cultivadoras.", "El texto no lo plantea; alejar los proyectos dificultaría que las familias accedan a ellos.", false], ["D", "Que la fuerza pública acompañe el arranque para reducir rápido las hectáreas.", "La rapidez con la fuerza pública es la ventaja de la estrategia 1; la 2 se basa en la participación voluntaria.", false]]}]}, {"comp": "ciencias_naturales", "sim": "s11-3", "ses": 1, "ind": "Respuesta inmune a dos dosis de una vacuna", "tt": "", "texto": "Un laboratorio midió la concentración de anticuerpos contra un antígeno en la sangre de un voluntario sano. El voluntario recibió una primera dosis de una vacuna el día 0 y una segunda dosis, igual a la primera, el día 60. La gráfica muestra los resultados.", "vis": "<div class=\"vfig\"><svg class=\"vg\" viewBox=\"0 0 560 320\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Gráfica 3. Concentración de anticuerpos en la sangre del voluntario\" font-family=\"Arial, sans-serif\" font-size=\"12\"><rect width=\"560\" height=\"320\" fill=\"#ffffff\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"13\" fill=\"#1d2433\">Gráfica 3. Concentración de anticuerpos en la sangre del voluntario<\/text><line x1=\"60\" y1=\"258.0\" x2=\"540\" y2=\"258.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"262.0\" text-anchor=\"end\" fill=\"#3a4356\">0<\/text><line x1=\"60\" y1=\"202.5\" x2=\"540\" y2=\"202.5\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"206.5\" text-anchor=\"end\" fill=\"#3a4356\">20<\/text><line x1=\"60\" y1=\"147.0\" x2=\"540\" y2=\"147.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"151.0\" text-anchor=\"end\" fill=\"#3a4356\">40<\/text><line x1=\"60\" y1=\"91.5\" x2=\"540\" y2=\"91.5\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"95.5\" text-anchor=\"end\" fill=\"#3a4356\">60<\/text><line x1=\"60\" y1=\"36.0\" x2=\"540\" y2=\"36.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"40.0\" text-anchor=\"end\" fill=\"#3a4356\">80<\/text><line x1=\"60\" y1=\"258\" x2=\"540\" y2=\"258\" stroke=\"#3a4356\"/><line x1=\"60\" y1=\"258\" x2=\"60\" y2=\"36\" stroke=\"#3a4356\"/><text transform=\"translate(14,147.0) rotate(-90)\" text-anchor=\"middle\" fill=\"#3a4356\">Concentración de anticuerpos (unidades arbitrarias)<\/text><text x=\"300.0\" y=\"312\" text-anchor=\"middle\" fill=\"#3a4356\">Día<\/text><text x=\"81.8\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">0<\/text><text x=\"125.5\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">10<\/text><text x=\"169.1\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">20<\/text><text x=\"212.7\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">30<\/text><text x=\"256.4\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">40<\/text><text x=\"300.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">50<\/text><text x=\"343.6\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">60<\/text><text x=\"387.3\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">70<\/text><text x=\"430.9\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">80<\/text><text x=\"474.5\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">90<\/text><text x=\"518.2\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">100<\/text><polyline fill=\"none\" stroke=\"#1660a8\" stroke-width=\"2.5\" points=\"81.8,258.0 125.5,244.1 169.1,224.7 212.7,235.8 256.4,246.9 300.0,249.7 343.6,249.7 387.3,63.8 430.9,91.5 474.5,113.7 518.2,133.1\"/><circle cx=\"81.8\" cy=\"258.0\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"81.8\" y=\"250.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">0<\/text><circle cx=\"125.5\" cy=\"244.1\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"125.5\" y=\"236.1\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">5<\/text><circle cx=\"169.1\" cy=\"224.7\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"169.1\" y=\"216.7\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">12<\/text><circle cx=\"212.7\" cy=\"235.8\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"212.7\" y=\"227.8\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">8<\/text><circle cx=\"256.4\" cy=\"246.9\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"256.4\" y=\"238.9\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">4<\/text><circle cx=\"300.0\" cy=\"249.7\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"300.0\" y=\"241.7\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">3<\/text><circle cx=\"343.6\" cy=\"249.7\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"343.6\" y=\"241.7\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">3<\/text><circle cx=\"387.3\" cy=\"63.8\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"387.3\" y=\"55.8\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">70<\/text><circle cx=\"430.9\" cy=\"91.5\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"430.9\" y=\"83.5\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">60<\/text><circle cx=\"474.5\" cy=\"113.7\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"474.5\" y=\"105.7\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">52<\/text><circle cx=\"518.2\" cy=\"133.1\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"518.2\" y=\"125.1\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">45<\/text><\/svg><\/div>", "items": [{"id": "CNC-104", "niv": 2, "cp": "cn_indagacion", "cn": "biologico", "e": "Según la gráfica, ¿qué diferencia hay entre la respuesta a la primera dosis y la respuesta a la segunda dosis?", "f": "Interpretación de la gráfica 3.", "vis": "", "o": [["A", "Las dos dosis producen la misma concentración máxima, pero la segunda dura más tiempo.", "Incorrecta. Los máximos son muy diferentes: 12 después de la primera dosis y 70 después de la segunda.", false], ["B", "Tras la primera dosis, los anticuerpos suben más que tras la segunda, porque el cuerpo aún no estaba protegido.", "Incorrecta. La gráfica muestra lo contrario: la respuesta a la primera dosis es la más débil.", false], ["C", "Tras la segunda dosis, los anticuerpos tardan más en subir, aunque llegan a un valor mayor.", "Incorrecta. La subida tras la segunda dosis es más rápida, no más lenta: en solo 10 días pasa de 3 a 70, su valor máximo.", false], ["D", "Tras la segunda dosis, los anticuerpos aumentan más rápido y alcanzan una concentración mayor.", "Correcta. La segunda respuesta alcanza su máximo (70) apenas 10 días después de la dosis, mientras que la primera tardó 20 días en llegar a su máximo, que fue solo 12.", true]]}, {"id": "CNC-105", "niv": 2, "cp": "cn_explicacion", "cn": "biologico", "e": "¿Qué explica mejor la respuesta observada después de la segunda dosis?", "f": "Respuesta inmune primaria y secundaria; memoria inmunológica.", "vis": "", "o": [["A", "Los anticuerpos producidos tras la primera dosis se reprodujeron dentro de la sangre y siguieron acumulándose hasta el día 60, cuando llegó la segunda.", "Incorrecta. Los anticuerpos son proteínas, no células: no se reproducen. De hecho, la gráfica muestra que su concentración bajó entre los días 20 y 60.", false], ["B", "Los glóbulos rojos aprendieron a fabricar anticuerpos después de la primera dosis.", "Incorrecta. Los anticuerpos los producen las células plasmáticas, derivadas de linfocitos B; los glóbulos rojos transportan oxígeno.", false], ["C", "La primera dosis originó linfocitos de memoria que, al reconocer de nuevo el antígeno, se activan con rapidez y producen muchos anticuerpos.", "Correcta. La respuesta secundaria es más rápida e intensa porque la primera exposición dejó linfocitos B y T de memoria específicos para ese antígeno.", true], ["D", "La segunda dosis tenía un antígeno más agresivo, lo que obligó al cuerpo a reaccionar con más fuerza.", "Incorrecta. El texto indica que la segunda dosis fue igual a la primera; la diferencia está en la memoria del sistema inmune.", false]]}]}, {"comp": "ciencias_naturales", "sim": "s11-3", "ses": 1, "ind": "Herencia del color del pelaje en cuyes", "tt": "", "texto": "En los cuyes, el pelaje con color depende de un gen con dos alelos. El alelo A (pelaje con color) es completamente dominante sobre el alelo a (pelaje albino, blanco y sin pigmento), de modo que los animales AA y Aa tienen el mismo pelaje con color. Un criadero cruza varias veces cuyes heterocigotos (Aa) entre sí y, a lo largo de varios años, registra 400 crías de esos cruces.", "vis": "", "items": [{"id": "CNC-107", "niv": 2, "cp": "cn_uso_comprensivo", "cn": "biologico", "e": "¿Cuántas crías albinas se espera obtener, aproximadamente, entre las 400 crías?", "f": "Primera ley de Mendel; cuadro de Punnett.", "vis": "", "o": [["A", "25 crías.", "Incorrecta. Corresponde a 1/16 de las crías, proporción propia de un cruce con dos genes, no de un cruce monohíbrido.", false], ["B", "100 crías.", "Correcta. En el cruce Aa × Aa, la probabilidad de obtener aa es 1/4; 400 × 1/4 = 100 crías albinas.", true], ["C", "200 crías.", "Incorrecta. 200 es la cantidad esperada de heterocigotas (Aa, probabilidad 1/2), que tienen pelaje con color.", false], ["D", "300 crías.", "Incorrecta. 300 es la cantidad esperada de crías con pelaje con color (AA + Aa, probabilidad 3/4).", false]]}, {"id": "CNC-108", "niv": 3, "cp": "cn_indagacion", "cn": "biologico", "e": "El criadero tiene otro cuy con pelaje de color y no sabe si su genotipo es AA o Aa. ¿Qué experimento le permite averiguarlo?", "f": "Cruce de prueba (retrocruce con el homocigoto recesivo).", "vis": "", "o": [["A", "Alimentar a sus crías con dietas diferentes y comparar el color de su pelaje.", "Incorrecta. Este diseño estudia el efecto del ambiente (la dieta), no permite deducir el genotipo del cuy.", false], ["B", "Cruzarlo con un cuy de pelaje con color AA y observar el pelaje de las crías.", "Incorrecta. Con un progenitor AA, todas las crías reciben un alelo A y tienen pelaje con color, sea el cuy desconocido AA o Aa; el resultado no permite distinguir.", false], ["C", "Comparar la intensidad del color de su pelaje, ya que los cuyes AA tienen un tono más intenso que los Aa.", "Incorrecta. El texto dice que la dominancia es completa: AA y Aa tienen el mismo pelaje, por lo que el color no los diferencia.", false], ["D", "Cruzarlo varias veces con cuyes albinos y observar si alguna de las crías nace albina.", "Correcta. Es un cruce de prueba: si el cuy es Aa, cerca de la mitad de las crías será aa (albina); si es AA, todas serán Aa (con color).", true]]}]}, {"comp": "ciencias_naturales", "sim": "s11-3", "ses": 1, "ind": "Fotosíntesis en una planta acuática", "tt": "", "texto": "Unos estudiantes colocaron una rama de Elodea (planta acuática) dentro de un tubo con agua y la iluminaron con una lámpara. Cambiaron la distancia entre la lámpara y la planta y, en cada caso, contaron las burbujas de gas que salían de la rama durante un minuto. Los resultados se muestran en la tabla.", "vis": "<table class=\"vt\"><caption>Tabla 4. Burbujas liberadas por la Elodea<\/caption><thead><tr><th>Distancia lámpara-planta (cm)<\/th><th>Burbujas por minuto<\/th><\/tr><\/thead><tbody><tr><td>10<\/td><td>48<\/td><\/tr><tr><td>20<\/td><td>30<\/td><\/tr><tr><td>30<\/td><td>17<\/td><\/tr><tr><td>40<\/td><td>10<\/td><\/tr><tr><td>50<\/td><td>6<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Fuente: datos ficticios.<\/div>", "items": [{"id": "CNC-109", "niv": 1, "cp": "cn_indagacion", "cn": "biologico", "e": "En este experimento, ¿cuál es la variable que los estudiantes cambiaron a propósito (variable independiente)?", "f": "Variables en un diseño experimental.", "vis": "", "o": [["A", "La distancia entre la lámpara y la planta.", "Correcta. Es la condición que los estudiantes modificaron deliberadamente (10, 20, 30, 40 y 50 cm) para ver su efecto.", true], ["B", "El tipo de planta usada en cada medición.", "Incorrecta. Siempre se usó la misma rama de Elodea; el tipo de planta no se cambió.", false], ["C", "El volumen de agua dentro del tubo.", "Incorrecta. El texto no indica que se haya modificado el volumen de agua; no es la variable que se estudia.", false], ["D", "El número de burbujas por minuto.", "Incorrecta. Es la variable dependiente: lo que se mide como respuesta al cambio de distancia.", false]]}, {"id": "CNC-110", "niv": 1, "cp": "cn_indagacion", "cn": "biologico", "e": "Las lámparas también calientan el agua cuando están cerca. Para que la comparación entre las mediciones sea válida, ¿qué condición debe mantenerse igual en todas ellas?", "f": "Control de variables en un experimento.", "vis": "", "o": [["A", "La temperatura del agua del tubo.", "Correcta. La temperatura también afecta la rapidez de la fotosíntesis; si no se mantiene constante, no se sabría si el cambio en las burbujas se debe a la luz o al calor.", true], ["B", "La cantidad de burbujas producidas por la planta.", "Incorrecta. Las burbujas son el resultado que se mide; no se pueden fijar de antemano.", false], ["C", "La intensidad de la luz que recibe la planta.", "Incorrecta. Cambiar la distancia sirve precisamente para variar la intensidad de luz; mantenerla igual anularía el experimento.", false], ["D", "La distancia entre la lámpara y la planta.", "Incorrecta. La distancia es justamente la variable independiente; si se mantuviera igual no habría nada que comparar.", false]]}, {"id": "CNC-111", "niv": 2, "cp": "cn_explicacion", "cn": "biologico", "e": "¿Por qué disminuye el número de burbujas cuando la lámpara se aleja de la planta?", "f": "Fotosíntesis: factores limitantes (intensidad de luz).", "vis": "", "o": [["A", "La planta fabrica menos clorofila cada vez que la lámpara se aleja unos centímetros.", "Incorrecta. La cantidad de clorofila no cambia en los pocos minutos que dura cada medición.", false], ["B", "Llega menos luz a la planta, la fotosíntesis es más lenta y se libera menos oxígeno.", "Correcta. La luz aporta la energía para la fotosíntesis, que libera oxígeno; con menos luz, el proceso se hace más lento y salen menos burbujas.", true], ["C", "Llega menos luz a la planta, por lo que respira más rápido y libera más dióxido de carbono.", "Incorrecta. Con menos luz no se liberan más burbujas sino menos; además, la respiración no se acelera por la falta de luz.", false], ["D", "Las burbujas son vapor de agua, que se forma menos cuando la lámpara calienta menos.", "Incorrecta. El agua del tubo no hierve; las burbujas son principalmente oxígeno producido en la fotosíntesis.", false]]}]}, {"comp": "ciencias_naturales", "sim": "s11-3", "ses": 1, "ind": "Flujo de energía en un manglar", "tt": "", "texto": "En un manglar de la costa se estudió la siguiente cadena alimentaria: algas → camarones → peces pequeños → garzas. Las algas (productores) almacenan 50.000 kJ de energía por metro cuadrado al año. En promedio, solo alrededor del 10 % de la energía de un nivel trófico pasa al nivel siguiente; el resto se pierde principalmente como calor en la respiración o queda en restos no consumidos.", "vis": "", "items": [{"id": "CNC-114", "niv": 2, "cp": "cn_uso_comprensivo", "cn": "biologico", "e": "¿Cuánta energía, por metro cuadrado al año, llega aproximadamente al nivel de los peces pequeños (es decir, queda almacenada en ellos)?", "f": "Regla aproximada del 10 % en la transferencia de energía entre niveles tróficos.", "vis": "", "o": [["A", "50 kJ.", "Incorrecta. Es la energía que llegaría a las garzas, un nivel más arriba que los peces.", false], ["B", "500 kJ.", "Correcta. Algas → camarones: 10 % de 50.000 = 5.000 kJ; camarones → peces: 10 % de 5.000 = 500 kJ.", true], ["C", "5.000 kJ.", "Incorrecta. Es la energía que pasa a los camarones (consumidores primarios), no a los peces.", false], ["D", "45.000 kJ.", "Incorrecta. Es la energía que no pasa de las algas a los camarones; corresponde a lo que se pierde en la primera transferencia.", false]]}, {"id": "CNC-115", "niv": 3, "cp": "cn_explicacion", "cn": "biologico", "e": "Si en el manglar solo existiera esta cadena alimentaria y la caza eliminara casi todas las garzas, ¿qué sería más probable que ocurriera con el tiempo?", "f": "Relaciones depredador-presa y efectos en cascada en una cadena trófica.", "vis": "", "o": [["A", "Disminuiría la población de peces, porque dejarían de recibir la energía que les aportaban las garzas.", "Incorrecta. La energía fluye de las algas hacia las garzas, no al revés: los peces no obtienen energía de las garzas.", false], ["B", "No cambiaría ninguna población, porque las garzas son el último eslabón de la cadena.", "Incorrecta. Aunque sean el último eslabón, controlan la población de peces; su eliminación se propaga a los niveles inferiores.", false], ["C", "Aumentaría la población de peces pequeños, lo que reduciría la de camarones y favorecería a las algas.", "Correcta. Sin su depredador, los peces aumentan; más peces consumen más camarones, y con menos camarones se consumen menos algas.", true], ["D", "Aumentaría la población de camarones, porque las garzas se alimentaban directamente de ellos.", "Incorrecta. En esta cadena las garzas comen peces pequeños, no camarones.", false]]}]}, {"comp": "ciencias_naturales", "sim": "s11-3", "ses": 1, "ind": "Obtención de energía en la célula", "tt": "", "texto": "Las células musculares necesitan ATP para contraerse. Este ATP se obtiene, sobre todo, de la degradación de la glucosa en presencia de oxígeno (respiración celular aerobia).", "vis": "", "items": [{"id": "CNC-118", "niv": 1, "cp": "cn_uso_comprensivo", "cn": "biologico", "e": "¿En qué organelo de la célula muscular se produce la mayor parte del ATP durante la respiración celular aerobia?", "f": "Respiración celular: función de la mitocondria.", "vis": "", "o": [["A", "En los cloroplastos.", "Incorrecta. Las células animales no tienen cloroplastos; estos organelos realizan la fotosíntesis en las plantas.", false], ["B", "En los ribosomas.", "Incorrecta. Los ribosomas sintetizan proteínas; no producen la mayor parte del ATP.", false], ["C", "En el núcleo.", "Incorrecta. El núcleo guarda el ADN y controla la célula, pero no es el sitio principal de producción de ATP.", false], ["D", "En las mitocondrias.", "Correcta. En las mitocondrias ocurren el ciclo de Krebs y la cadena de transporte de electrones, donde se produce la mayor parte del ATP.", true]]}]}, {"comp": "ciencias_naturales", "sim": "s11-3", "ses": 1, "ind": "Movimiento de un bus entre dos paradas", "tt": "", "texto": "La gráfica muestra cómo cambió la velocidad de un bus que se movió en línea recta entre dos paradas, desde que arrancó hasta que se detuvo.", "vis": "<div class=\"vfig\"><svg class=\"vg\" viewBox=\"0 0 560 320\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Gráfica 4. Velocidad del bus en función del tiempo\" font-family=\"Arial, sans-serif\" font-size=\"12\"><rect width=\"560\" height=\"320\" fill=\"#ffffff\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"13\" fill=\"#1d2433\">Gráfica 4. Velocidad del bus en función del
