tiempo<\/text><line x1=\"60\" y1=\"258.0\" x2=\"540\" y2=\"258.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"262.0\" text-anchor=\"end\" fill=\"#3a4356\">0<\/text><line x1=\"60\" y1=\"202.5\" x2=\"540\" y2=\"202.5\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"206.5\" text-anchor=\"end\" fill=\"#3a4356\">5<\/text><line x1=\"60\" y1=\"147.0\" x2=\"540\" y2=\"147.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"151.0\" text-anchor=\"end\" fill=\"#3a4356\">10<\/text><line x1=\"60\" y1=\"91.5\" x2=\"540\" y2=\"91.5\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"95.5\" text-anchor=\"end\" fill=\"#3a4356\">15<\/text><line x1=\"60\" y1=\"36.0\" x2=\"540\" y2=\"36.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"40.0\" text-anchor=\"end\" fill=\"#3a4356\">20<\/text><line x1=\"60\" y1=\"258\" x2=\"540\" y2=\"258\" stroke=\"#3a4356\"/><line x1=\"60\" y1=\"258\" x2=\"60\" y2=\"36\" stroke=\"#3a4356\"/><text transform=\"translate(14,147.0) rotate(-90)\" text-anchor=\"middle\" fill=\"#3a4356\">Velocidad (m/s)<\/text><text x=\"300.0\" y=\"312\" text-anchor=\"middle\" fill=\"#3a4356\">Tiempo (s)<\/text><text x=\"94.3\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">0<\/text><text x=\"162.9\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">10<\/text><text x=\"231.4\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">20<\/text><text x=\"300.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">30<\/text><text x=\"368.6\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">40<\/text><text x=\"437.1\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">50<\/text><text x=\"505.7\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">60<\/text><polyline fill=\"none\" stroke=\"#1660a8\" stroke-width=\"2.5\" points=\"94.3,258.0 162.9,147.0 231.4,36.0 300.0,36.0 368.6,36.0 437.1,147.0 505.7,258.0\"/><circle cx=\"94.3\" cy=\"258.0\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"94.3\" y=\"250.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">0<\/text><circle cx=\"162.9\" cy=\"147.0\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"162.9\" y=\"139.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">10<\/text><circle cx=\"231.4\" cy=\"36.0\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"231.4\" y=\"28.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">20<\/text><circle cx=\"300.0\" cy=\"36.0\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"300.0\" y=\"28.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">20<\/text><circle cx=\"368.6\" cy=\"36.0\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"368.6\" y=\"28.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">20<\/text><circle cx=\"437.1\" cy=\"147.0\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"437.1\" y=\"139.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">10<\/text><circle cx=\"505.7\" cy=\"258.0\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"505.7\" y=\"250.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">0<\/text><\/svg><\/div>", "items": [{"id": "CNC-119", "niv": 2, "cp": "cn_indagacion", "cn": "fisico", "e": "¿En qué intervalo de tiempo la aceleración del bus fue cero?", "f": "Interpretación de la gráfica velocidad-tiempo.", "vis": "", "o": [["A", "Entre 20 s y 40 s.", "Correcta. En ese intervalo la velocidad se mantuvo en 20 m/s; si la velocidad no cambia, la aceleración es cero.", true], ["B", "Entre 40 s y 60 s.", "Incorrecta. En ese intervalo la velocidad disminuyó de 20 a 0 m/s: el bus frenaba, es decir, tenía aceleración negativa.", false], ["C", "Entre 0 s y 20 s.", "Incorrecta. En ese intervalo la velocidad aumentó de 0 a 20 m/s, así que hubo aceleración (1 m/s²).", false], ["D", "En los instantes 0 s y 60 s, cuando el bus tenía velocidad cero.", "Incorrecta. Que la velocidad sea cero en un instante no significa que la aceleración sea cero: alrededor de esos instantes la velocidad estaba cambiando.", false]]}, {"id": "CNC-120", "niv": 3, "cp": "cn_uso_comprensivo", "cn": "fisico", "e": "¿Qué distancia recorrió el bus entre las dos paradas?", "f": "Cálculo propio: área bajo la curva velocidad-tiempo.", "vis": "", "o": [["A", "400 m.", "Incorrecta. Es solo la distancia recorrida a velocidad constante (20 m/s × 20 s); faltan los tramos de arranque y frenado.", false], ["B", "600 m.", "Incorrecta. Es la distancia recorrida en los primeros 40 s (200 m + 400 m); falta el tramo de frenado.", false], ["C", "800 m.", "Correcta. La distancia es el área bajo la gráfica: triángulo (20 × 20)/2 = 200 m, rectángulo 20 × 20 = 400 m y triángulo (20 × 20)/2 = 200 m; total 800 m.", true], ["D", "1.200 m.", "Incorrecta. Resulta de multiplicar la velocidad máxima por el tiempo total (20 m/s × 60 s), como si el bus hubiera ido siempre a 20 m/s.", false]]}, {"id": "CNC-121", "niv": 1, "cp": "cn_uso_comprensivo", "cn": "fisico", "e": "¿Cuál fue la aceleración del bus durante los primeros 20 s?", "f": "Definición de aceleración media.", "vis": "", "o": [["A", "0,5 m/s².", "Incorrecta. Resulta de dividir 20 m/s entre 40 s, un tiempo que incluye el tramo de velocidad constante.", false], ["B", "1 m/s².", "Correcta. a = Δv/Δt = (20 m/s − 0 m/s)/(20 s) = 1 m/s².", true], ["C", "2 m/s².", "Incorrecta. Resulta de un error al dividir; el cambio de velocidad (20 m/s) dividido entre el tiempo (20 s) da 1 m/s².", false], ["D", "20 m/s².", "Incorrecta. 20 m/s es la velocidad que alcanzó el bus, no su aceleración; falta dividir entre el tiempo.", false]]}]}, {"comp": "ciencias_naturales", "sim": "s11-3", "ses": 1, "ind": "Oscilaciones de un péndulo", "tt": "", "texto": "Un estudiante suelta un péndulo desde 30 cm de altura respecto a su punto más bajo. Después de varias oscilaciones observa que el péndulo solo sube hasta 22 cm.", "vis": "", "items": [{"id": "CNC-132", "niv": 3, "cp": "cn_explicacion", "cn": "fisico", "e": "¿Qué explica la disminución de la altura máxima del péndulo?", "f": "Transformación y conservación de la energía; disipación por fricción.", "vis": "", "o": [["A", "La gravedad disminuye a medida que el péndulo oscila.", "Incorrecta. La aceleración de la gravedad en el lugar es prácticamente constante; no cambia por el movimiento del péndulo.", false], ["B", "La masa del péndulo disminuye con cada oscilación.", "Incorrecta. La masa del péndulo no cambia; además, la altura que alcanza no depende de su masa.", false], ["C", "La energía mecánica del péndulo se destruye poco a poco en cada oscilación hasta que el péndulo se detiene.", "Incorrecta. La energía no se destruye; se transforma en otras formas, principalmente energía térmica.", false], ["D", "Parte de la energía mecánica se transforma en energía térmica por la fricción con el aire y en el punto de sujeción.", "Correcta. La energía total se conserva, pero la fricción convierte parte de la energía mecánica en energía térmica; por eso queda menos energía potencial en cada extremo.", true]]}]}, {"comp": "ciencias_naturales", "sim": "s11-3", "ses": 1, "ind": "Bombillos conectados en paralelo", "tt": "", "texto": "Dos bombillos iguales, cada uno con una resistencia de 6 Ω, se conectan en paralelo a una batería ideal de 12 V. Suponga que la resistencia de los bombillos no cambia.", "vis": "", "items": [{"id": "CNC-133", "niv": 2, "cp": "cn_uso_comprensivo", "cn": "fisico", "e": "¿Cuál es la corriente total que entrega la batería?", "f": "Ley de Ohm; resistencias en paralelo.", "vis": "", "o": [["A", "1 A.", "Incorrecta. Corresponde a conectar los bombillos en serie (resistencia total 12 Ω; 12 V/12 Ω = 1 A).", false], ["B", "2 A.", "Incorrecta. Es la corriente que pasa por uno solo de los bombillos (12 V/6 Ω); falta sumar la del otro.", false], ["C", "3 A.", "Incorrecta. 3 Ω es la resistencia equivalente del circuito; se confunde ese valor con la corriente.", false], ["D", "4 A.", "Correcta. En paralelo, 1/R = 1/6 + 1/6, así que R = 3 Ω; I = V/R = 12 V/3 Ω = 4 A (2 A por cada bombillo).", true]]}, {"id": "CNC-134", "niv": 2, "cp": "cn_explicacion", "cn": "fisico", "e": "Si uno de los bombillos se funde, ¿qué ocurre con el otro?", "f": "Circuitos en paralelo.", "vis": "", "o": [["A", "Sigue encendido con el mismo brillo, porque su rama sigue conectada a los 12 V de la batería.", "Correcta. En paralelo cada bombillo está conectado directamente a la batería; si una rama se abre, la otra conserva el mismo voltaje y la misma corriente.", true], ["B", "Brilla el doble, porque ahora recibe toda la corriente que antes se repartía entre los dos bombillos.", "Incorrecta. La corriente de cada rama depende del voltaje y de su resistencia (12 V/6 Ω = 2 A), que no cambian.", false], ["C", "Brilla menos, porque el voltaje de la batería se reparte de otra forma.", "Incorrecta. En paralelo cada rama recibe el voltaje completo de la batería ideal, antes y después de que se funda el otro bombillo.", false], ["D", "Se apaga, porque la corriente ya no puede circular por el circuito.", "Incorrecta. Eso ocurre en un circuito en serie; en paralelo la otra rama sigue cerrada.", false]]}]}, {"comp": "ciencias_naturales", "sim": "s11-3", "ses": 1, "ind": "Combustión del metano y conservación de la masa", "tt": "", "texto": "El metano (CH₄), principal componente del gas natural, se quema según la ecuación balanceada:\n\nCH₄ + 2 O₂ → CO₂ + 2 H₂O\n\nMasas molares: C = 12 g/mol, H = 1 g/mol, O = 16 g/mol (CH₄ = 16 g/mol; CO₂ = 44 g/mol).", "vis": "", "items": [{"id": "CNC-136", "niv": 2, "cp": "cn_uso_comprensivo", "cn": "quimico", "e": "¿Qué masa de CO₂ se produce al quemar completamente 32 g de metano?", "f": "Cálculo estequiométrico con masas molares.", "vis": "", "o": [["A", "32 g.", "Incorrecta. Supone que la masa del producto es igual a la del metano, sin hacer la relación en moles.", false], ["B", "44 g.", "Incorrecta. Es la masa de CO₂ que se obtiene de 1 mol (16 g) de metano; aquí se queman 2 mol.", false], ["C", "64 g.", "Incorrecta. Es la masa de O₂ que reacciona con 16 g de metano (2 mol × 32 g/mol), no la de CO₂ producida.", false], ["D", "88 g.", "Correcta. 32 g de CH₄ ÷ 16 g/mol = 2 mol; la ecuación indica 1 mol de CO₂ por mol de CH₄, así que se forman 2 mol × 44 g/mol = 88 g.", true]]}, {"id": "CNC-137", "niv": 2, "cp": "cn_indagacion", "cn": "quimico", "e": "En otra práctica, unos estudiantes hicieron reaccionar vinagre con bicarbonato de sodio, una reacción que produce dióxido de carbono gaseoso. Lo hicieron en dos montajes y midieron la masa total antes y después de la reacción (tabla 5). ¿Qué conclusión es coherente con los resultados?", "f": "Interpretación de la tabla 5; ley de conservación de la masa (Lavoisier).", "vis": "<table class=\"vt\"><caption>Tabla 5. Masa total de cada montaje<\/caption><thead><tr><th>Montaje<\/th><th>Masa inicial (g)<\/th><th>Masa final (g)<\/th><\/tr><\/thead><tbody><tr><td>Frasco con tapa hermética<\/td><td>250,0<\/td><td>250,0<\/td><\/tr><tr><td>Vaso abierto<\/td><td>250,0<\/td><td>248,7<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Fuente: datos ficticios.<\/div>", "o": [["A", "El frasco cerrado ganó masa del ambiente y compensó la que se perdió durante la reacción.", "Incorrecta. Un frasco con tapa hermética no intercambia materia con el ambiente; su masa no cambió porque los productos quedaron dentro.", false], ["B", "La ley de conservación de la masa solo se cumple en algunas reacciones químicas, como la del frasco cerrado.", "Incorrecta. La ley se cumple en todas las reacciones químicas; el vaso abierto no permite medir la masa de todos los productos.", false], ["C", "En el vaso abierto la masa disminuyó porque parte de los productos, un gas, escapó; en el frasco cerrado la masa se conservó.", "Correcta. En el sistema cerrado la masa total no cambió (250,0 g); en el abierto falta la masa del CO₂ que salió al aire, lo que es coherente con la ley de conservación de la masa.", true], ["D", "En el vaso abierto se destruyó parte de la materia durante la reacción química.", "Incorrecta. En las reacciones químicas la materia no se destruye; la masa «perdida» corresponde al gas que salió del vaso.", false]]}, {"id": "CNC-138", "niv": 3, "cp": "cn_uso_comprensivo", "cn": "quimico", "e": "El hidrógeno reacciona con el oxígeno según la ecuación 2 H₂ + O₂ → 2 H₂O. Si se mezclan 4 mol de H₂ con 3 mol de O₂ y la reacción es completa, ¿cuántos moles de agua se forman?", "f": "Reactivo límite.", "vis": "", "o": [["A", "3 mol.", "Incorrecta. Iguala los moles de agua a los moles de O₂ disponibles, sin usar la proporción de la ecuación.", false], ["B", "4 mol.", "Correcta. 4 mol de H₂ solo necesitan 2 mol de O₂; el H₂ es el reactivo límite (sobra 1 mol de O₂) y produce 4 mol de H₂O, porque la relación H₂ : H₂O es 2 : 2.", true], ["C", "6 mol.", "Incorrecta. Toma el O₂ como reactivo límite (3 mol × 2); pero para gastar 3 mol de O₂ se necesitarían 6 mol de H₂ y solo hay 4.", false], ["D", "7 mol.", "Incorrecta. Suma los moles de los reactivos; los moles no se conservan en una reacción, lo que se conserva es la masa.", false]]}]}, {"comp": "ciencias_naturales", "sim": "s11-3", "ses": 1, "ind": "Propiedades de los metales alcalinos", "tt": "", "texto": "La tabla 6 presenta información de cuatro elementos del grupo 1 de la tabla periódica. La primera energía de ionización es la energía necesaria para quitar el electrón más externo de un mol de átomos en estado gaseoso.", "vis": "<table class=\"vt\"><caption>Tabla 6. Algunos elementos del grupo 1<\/caption><thead><tr><th>Elemento<\/th><th>Número atómico<\/th><th>Electrones de valencia<\/th><th>Primera energía de ionización (kJ/mol)<\/th><\/tr><\/thead><tbody><tr><td>Litio (Li)<\/td><td>3<\/td><td>1<\/td><td>520<\/td><\/tr><tr><td>Sodio (Na)<\/td><td>11<\/td><td>1<\/td><td>496<\/td><\/tr><tr><td>Potasio (K)<\/td><td>19<\/td><td>1<\/td><td>419<\/td><\/tr><tr><td>Rubidio (Rb)<\/td><td>37<\/td><td>1<\/td><td>403<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Fuente: valores redondeados de tablas de referencia (Chemistry LibreTexts).<\/div>", "items": [{"id": "CNC-139", "niv": 1, "cp": "cn_uso_comprensivo", "cn": "quimico", "e": "Estos cuatro elementos tienen propiedades químicas parecidas porque...", "f": "Organización de la tabla periódica: grupos y electrones de valencia.", "vis": "", "o": [["A", "están ubicados en el mismo periodo de la tabla periódica, es decir, en la misma fila.", "Incorrecta. Están en el mismo grupo (columna), no en el mismo periodo (fila); cada uno está en un periodo distinto.", false], ["B", "tienen el mismo número de protones en el núcleo.", "Incorrecta. El número de protones (número atómico) es diferente en cada uno: 3, 11, 19 y 37.", false], ["C", "tienen el mismo número de electrones en su último nivel de energía.", "Correcta. Todos tienen un electrón de valencia; el comportamiento químico depende principalmente de los electrones de valencia.", true], ["D", "tienen la misma masa atómica.", "Incorrecta. Su masa atómica es muy diferente; la masa no determina las propiedades químicas del grupo.", false]]}, {"id": "CNC-140", "niv": 2, "cp": "cn_indagacion", "cn": "quimico", "e": "¿Qué patrón muestran los datos de la tabla?", "f": "Interpretación de la tabla 6; tendencias periódicas (energía de ionización).", "vis": "", "o": [["A", "Al descender en el grupo, la primera energía de ionización disminuye.", "Correcta. Los valores bajan de 520 (Li) a 496 (Na), 419 (K) y 403 kJ/mol (Rb): al aumentar el número atómico dentro del grupo se necesita menos energía.", true], ["B", "La energía de ionización no depende de la posición del elemento dentro del grupo.", "Incorrecta. Los datos muestran una tendencia clara relacionada con la posición en el grupo.", false], ["C", "La energía de ionización disminuye en la misma cantidad de un elemento al siguiente.", "Incorrecta. Las disminuciones son distintas: 24, 77 y 16 kJ/mol.", false], ["D", "Al descender en el grupo aumenta la energía necesaria para quitar el electrón más externo.", "Incorrecta. La tabla muestra lo contrario: la energía de ionización disminuye de Li a Rb.", false]]}, {"id": "CNC-141", "niv": 1, "cp": "cn_explicacion", "cn": "quimico", "e": "El sodio reacciona con el cloro y forma cloruro de sodio (NaCl), la sal de cocina. ¿Qué explica la formación de este compuesto?", "f": "Enlace iónico.", "vis": "", "o": [["A", "Los átomos se unen mediante una nube de electrones libres, como ocurre en los metales.", "Incorrecta. Eso describe el enlace metálico; el NaCl es un compuesto iónico.", false], ["B", "El sodio y el cloro comparten un par de electrones por igual, así que se forma un enlace covalente apolar entre los dos átomos.", "Incorrecta. Compartir por igual ocurre entre átomos de electronegatividad igual o muy parecida; la diferencia entre sodio y cloro es grande y el enlace es iónico.", false], ["C", "El cloro cede un electrón al sodio y se forman los iones Cl⁺ y Na⁻.", "Incorrecta. Es al revés: el sodio pierde un electrón (Na⁺) y el cloro lo gana (Cl⁻).", false], ["D", "El sodio cede su electrón de valencia al cloro, y los iones Na⁺ y Cl⁻ que se forman se atraen: es un enlace iónico.", "Correcta. El sodio tiene baja energía de ionización y el cloro gran tendencia a ganar un electrón; se transfieren electrones y los iones de carga opuesta se atraen.", true]]}]}, {"comp": "ciencias_naturales", "sim": "s11-3", "ses": 1, "ind": "Compuestos orgánicos de uso cotidiano", "tt": "", "texto": "La tabla 7 presenta dos compuestos orgánicos. El etanol se usa en el alcohol antiséptico y el propano es uno de los componentes del gas que se vende en cilindros.", "vis": "<table class=\"vt\"><caption>Tabla 7. Dos compuestos orgánicos<\/caption><thead><tr><th>Compuesto<\/th><th>Fórmula<\/th><th>Masa molar (g/mol)<\/th><th>Punto de ebullición a 1 atm (°C)<\/th><\/tr><\/thead><tbody><tr><td>Etanol<\/td><td>CH₃–CH₂–OH<\/td><td>46<\/td><td>78<\/td><\/tr><tr><td>Propano<\/td><td>CH₃–CH₂–CH₃<\/td><td>44<\/td><td>−42<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Fuente: valores redondeados de tablas de referencia.<\/div>", "items": [{"id": "CNC-142", "niv": 1, "cp": "cn_uso_comprensivo", "cn": "quimico", "e": "¿A qué función química pertenece el etanol?", "f": "Grupos funcionales en química orgánica.", "vis": "", "o": [["A", "Base, porque su grupo –OH se libera en el agua como ion hidróxido.", "Incorrecta. En el etanol el –OH está unido covalentemente al carbono y no se libera como OH⁻; el etanol no es una base como el NaOH.", false], ["B", "Alcano, porque entre sus átomos de carbono solo hay enlaces sencillos.", "Incorrecta. Los alcanos solo tienen carbono e hidrógeno; el etanol contiene oxígeno en un grupo –OH.", false], ["C", "Alcohol, porque tiene un grupo hidroxilo (–OH) unido a un carbono.", "Correcta. Los alcoholes se caracterizan por el grupo funcional –OH unido a un átomo de carbono saturado.", true], ["D", "Ácido carboxílico, porque en su molécula hay un átomo de oxígeno.", "Incorrecta. Un ácido carboxílico tiene el grupo –COOH; tener un oxígeno no basta.", false]]}, {"id": "CNC-143", "niv": 3, "cp": "cn_explicacion", "cn": "quimico", "e": "Las masas molares del etanol y del propano son casi iguales, pero el etanol hierve a una temperatura mucho mayor. ¿Qué explica esta diferencia?", "f": "Fuerzas intermoleculares (puentes de hidrógeno) y punto de ebullición.", "vis": "", "o": [["A", "El etanol tiene más átomos de carbono que el propano, por eso sus moléculas pesan más y hierven más tarde.", "Incorrecta. El etanol tiene 2 carbonos y el propano 3; además, sus masas molares son casi iguales (46 y 44 g/mol).", false], ["B", "Las moléculas de etanol forman puentes de hidrógeno entre sí gracias al grupo –OH, y separarlas requiere más energía.", "Correcta. El –OH permite puentes de hidrógeno entre moléculas de etanol, atracciones más fuertes que las débiles fuerzas entre moléculas de propano, que es apolar.", true], ["C", "Al hervir, el etanol rompe sus enlaces covalentes C–C y el propano no.", "Incorrecta. En la ebullición no se rompen enlaces covalentes dentro de las moléculas; solo se separan unas moléculas de otras.", false], ["D", "El propano es un compuesto iónico y sus iones se separan con facilidad.", "Incorrecta. El propano es un compuesto covalente formado solo por carbono e hidrógeno; no tiene iones.", false]]}, {"id": "CNC-144", "niv": 2, "cp": "cn_uso_comprensivo", "cn": "quimico", "e": "El butano y el metilpropano tienen la misma fórmula molecular, C₄H₁₀, pero sus átomos de carbono están unidos de forma diferente (uno en cadena recta y otro ramificado). Estos dos compuestos son...", "f": "Isomería estructural.", "vis": "", "o": [["A", "isómeros estructurales.", "Correcta. Los isómeros tienen la misma fórmula molecular y distinta estructura, y por eso tienen propiedades diferentes.", true], ["B", "isótopos de un mismo elemento.", "Incorrecta. Los isótopos son átomos de un mismo elemento con distinto número de neutrones; aquí se trata de compuestos.", false], ["C", "formas alotrópicas del carbono, como el grafito y el diamante.", "Incorrecta. Los alótropos son formas distintas de un mismo elemento puro; el butano y el metilpropano contienen carbono e hidrógeno.", false], ["D", "la misma sustancia con dos nombres distintos.", "Incorrecta. Su estructura es diferente, por lo que son sustancias distintas, con propiedades distintas (por ejemplo, su punto de ebullición).", false]]}]}, {"comp": "ciencias_naturales", "sim": "s11-3", "ses": 1, "ind": "Rapidez de una reacción química", "tt": "", "texto": "Un estudiante quiere saber si la temperatura afecta la rapidez de la reacción entre el mármol (carbonato de calcio) y el ácido clorhídrico, que produce dióxido de carbono gaseoso. Realizó dos ensayos y midió el volumen de gas producido durante el primer minuto.", "vis": "", "items": [{"id": "CNC-150", "niv": 3, "cp": "cn_indagacion", "cn": "quimico", "e": "El estudiante concluye que el aumento en el volumen de gas se debe solo al aumento de temperatura. ¿Por qué sus resultados no permiten llegar a esa conclusión?", "f": "Diseño experimental: control de variables; factores que afectan la rapidez de reacción.", "vis": "<table class=\"vt\"><caption>Tabla 8. Ensayos realizados<\/caption><thead><tr><th>Ensayo<\/th><th>Temperatura (°C)<\/th><th>Mármol (5 g)<\/th><th>Ácido<\/th><th>CO₂ en el primer minuto (mL)<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>20<\/td><td>Trozos grandes<\/td><td>50 mL, 1 mol/L<\/td><td>20<\/td><\/tr><tr><td>2<\/td><td>40<\/td><td>Polvo fino<\/td><td>50 mL, 1 mol/L<\/td><td>95<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Fuente: datos ficticios.<\/div>", "o": [["A", "Porque también cambió el tamaño de las partículas de mármol, que influye en la rapidez de la reacción.", "Correcta. En el ensayo 2 cambiaron dos variables a la vez (temperatura y tamaño de partícula); el polvo tiene más superficie de contacto, así que no se puede atribuir el efecto solo a la temperatura.", true], ["B", "Porque en el ensayo 2 se produjo más gas, lo que indica que se usó más mármol que en el ensayo 1.", "Incorrecta. La tabla muestra que en ambos ensayos se usaron 5 g de mármol; producir más gas en el primer minuto indica una reacción más rápida, no más reactivo.", false], ["C", "Porque midió el volumen de gas producido en lugar de medir la masa del mármol.", "Incorrecta. El volumen de gas producido por unidad de tiempo es una forma válida de medir la rapidez de la reacción.", false], ["D", "Porque la temperatura no influye en la rapidez de las reacciones químicas.", "Incorrecta. La temperatura sí influye: al aumentar, las partículas chocan con más frecuencia y energía. El problema es el diseño del experimento.", false]]}]}, {"comp": "ciencias_naturales", "sim": "s11-3", "ses": 1, "ind": "Maíz transgénico Bt y resistencia de plagas", "tt": "", "texto": "Algunas variedades de maíz transgénico (maíz Bt) producen una proteína de la bacteria Bacillus thuringiensis que es tóxica para las larvas de ciertas polillas que dañan el cultivo. En una región ficticia, unos agrónomos registraron durante cinco años el daño en lotes de maíz Bt y de maíz convencional, y el porcentaje de larvas resistentes a la toxina en muestras tomadas de los lotes Bt. En esa región no se sembraron zonas de maíz convencional junto a los lotes Bt.", "vis": "<table class=\"vt\"><caption>Tabla 9. Seguimiento de lotes de maíz durante cinco años<\/caption><thead><tr><th>Año<\/th><th>Plantas dañadas en lotes Bt (%)<\/th><th>Plantas dañadas en lotes convencionales (%)<\/th><th>Larvas resistentes en lotes Bt (%)<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>4<\/td><td>35<\/td><td>0,5<\/td><\/tr><tr><td>2<\/td><td>5<\/td><td>33<\/td><td>1<\/td><\/tr><tr><td>3<\/td><td>7<\/td><td>36<\/td><td>3<\/td><\/tr><tr><td>4<\/td><td>12<\/td><td>34<\/td><td>8<\/td><\/tr><tr><td>5<\/td><td>21<\/td><td>35<\/td><td>17<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Fuente: datos ficticios.<\/div>", "items": [{"id": "CNC-153", "niv": 2, "cp": "cn_indagacion", "cn": "cts", "e": "¿Qué conclusión apoyan los datos de la tabla?", "f": "Interpretación de la tabla 9.", "vis": "", "o": [["A", "El maíz Bt modificó los genes de las polillas y así produjo las larvas resistentes.", "Incorrecta. Los datos no muestran ese mecanismo; la resistencia aumenta porque la toxina selecciona a las larvas que ya eran resistentes, no porque las modifique.", false], ["B", "El maíz Bt redujo el daño frente al convencional, pero esa ventaja disminuyó a medida que aumentaron las larvas resistentes.", "Correcta. El daño en los lotes Bt fue siempre menor que en los convencionales (cerca del 35 %), pero subió de 4 % a 21 % mientras las larvas resistentes pasaron de 0,5 % a 17 %.", true], ["C", "El daño en los lotes convencionales aumentó cada año a causa del maíz Bt.", "Incorrecta. El daño en los lotes convencionales se mantuvo casi constante, entre 33 % y 36 %.", false], ["D", "El maíz Bt no sirvió desde el primer año, porque en todos los años hubo plantas dañadas dentro de sus lotes, igual que en los convencionales.", "Incorrecta. En el primer año el daño en lotes Bt fue 4 % frente a 35 % en los convencionales: una reducción muy grande.", false]]}, {"id": "CNC-154", "niv": 3, "cp": "cn_explicacion", "cn": "cts", "e": "Para retrasar la aparición de resistencia se recomienda sembrar «refugios»: franjas de maíz no Bt cerca de los lotes de maíz Bt. ¿Por qué funciona esta estrategia?", "f": "Estrategia de refugios para manejar la resistencia (EPA; Tabashnik et al., 2023).", "vis": "", "o": [["A", "El maíz no Bt absorbe la toxina que producen las plantas Bt cercanas y la vuelve inofensiva, de modo que las larvas ya no son seleccionadas.", "Incorrecta. La toxina está dentro de los tejidos de las plantas Bt; el maíz convencional no la absorbe ni la neutraliza.", false], ["B", "Los refugios hacen que las larvas resistentes vuelvan a mutar hacia la forma susceptible, lo que reduce la frecuencia de la resistencia en la población.", "Incorrecta. Los refugios no causan mutaciones; actúan sobre las frecuencias de los alelos mediante el apareamiento.", false], ["C", "Las polillas prefieren alimentarse en los refugios y nunca vuelven a entrar a los lotes de maíz Bt, así que estos quedan libres de la plaga.", "Incorrecta. Las polillas se mueven entre lotes; de hecho, la estrategia necesita que los insectos de ambos lugares se encuentren y se apareen.", false], ["D", "En los refugios sobreviven muchas polillas susceptibles que se aparean con las pocas resistentes y mantienen baja la frecuencia de la resistencia.", "Correcta. Los refugios mantienen una población grande de insectos susceptibles; al cruzarse con los escasos resistentes que salen de los lotes Bt, diluyen los alelos de resistencia en la población.", true]]}, {"id": "CNC-155", "niv": 3, "cp": "cn_indagacion", "cn": "cts", "e": "Un grupo de vecinos afirma que el polen del maíz Bt perjudica a las abejas de la región. ¿Cuál de los siguientes estudios permitiría poner a prueba esa afirmación?", "f": "Diseño experimental con grupo control.", "vis": "", "o": [["A", "Medir cuánto polen produce cada planta de maíz Bt frente al maíz convencional en la misma región.", "Incorrecta. La cantidad de polen producida no informa si ese polen perjudica o no a las abejas.", false], ["B", "Encuestar a los apicultores de la región para saber si creen que el polen del maíz Bt afecta a sus abejas.", "Incorrecta. Las opiniones de los apicultores no son evidencia experimental sobre el efecto del polen en la salud de las abejas.", false], ["C", "Comparar la supervivencia de colonias de abejas iguales alimentadas con polen de maíz Bt o con polen de maíz convencional.", "Correcta. Compara un grupo expuesto con un grupo control y mantiene iguales las demás condiciones, de modo que cualquier diferencia se puede atribuir al tipo de polen.", true], ["D", "Contar durante un año las abejas que visitan los lotes de maíz Bt de la región, sin compararlas con las de ningún otro lote.", "Incorrecta. Sin un grupo de comparación (lotes de maíz convencional) no se puede saber si el número de abejas se debe al maíz Bt o a otros factores.", false]]}]}, {"comp": "matematicas", "sim": "s11-3", "ses": 2, "ind": "Horas sin servicio de agua en un barrio", "tt": "", "texto": "La junta de acción comunal de un barrio encuestó a 40 hogares sobre el número de horas por semana que estuvieron sin servicio de agua durante el último mes. Cada hogar reportó una sola cifra. Los resultados se muestran en la tabla.", "vis": "<table class=\"vt\"><caption>Tabla 10. Horas semanales sin servicio de agua<\/caption><thead><tr><th>Horas sin agua por semana<\/th><th>Número de hogares<\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td>6<\/td><\/tr><tr><td>2<\/td><td>10<\/td><\/tr><tr><td>4<\/td><td>12<\/td><\/tr><tr><td>6<\/td><td>8<\/td><\/tr><tr><td>8<\/td><td>4<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Datos ficticios.<\/div>", "items": [{"id": "MTC-101", "niv": 1, "cp": "mt_interpretacion", "cn": "", "e": "¿Qué porcentaje de los hogares encuestados estuvo 6 horas o más por semana sin servicio de agua?", "f": "Cálculo propio", "vis": "", "o": [["A", "10 %", "Corresponde solo a los 4 hogares con 8 horas (4/40); falta sumar los 8 hogares que reportaron 6 horas.", false], ["B", "20 %", "Corresponde solo a los 8 hogares con 6 horas (8/40); «6 horas o más» incluye también a los 4 hogares con 8 horas.", false], ["C", "30 %", "Los hogares con 6 u 8 horas son 8 + 4 = 12, y 12/40 = 0,30, es decir, el 30 %.", true], ["D", "60 %", "Resulta de sumar también los 12 hogares con 4 horas (24/40); esos hogares estuvieron menos de 6 horas sin agua.", false]]}, {"id": "MTC-102", "niv": 2, "cp": "mt_formulacion", "cn": "", "e": "¿Cuál es el promedio de horas semanales sin servicio de agua de los 40 hogares encuestados?", "f": "Cálculo propio", "vis": "", "o": [["A", "3,7 horas.", "Se multiplica cada número de horas por su número de hogares: 0·6 + 2·10 + 4·12 + 6·8 + 8·4 = 148; luego 148/40 = 3,7 horas.", true], ["B", "4 horas.", "Es la mediana (y la moda) de los datos, no el promedio; el promedio ponderado por el número de hogares es 3,7.", false], ["C", "8 horas.", "Es 40/5: se dividió el total de hogares entre el número de filas de la tabla, lo cual no da un promedio de horas.", false], ["D", "29,6 horas.", "Es 148/5: se sumaron bien los productos, pero se dividió entre las 5 filas de la tabla y no entre los 40 hogares.", false]]}, {"id": "MTC-103", "niv": 2, "cp": "mt_argumentacion", "cn": "", "e": "Un integrante de la junta afirma: «Como el promedio de horas sin agua es bajo, más de la mitad de los hogares estuvo menos de 4 horas por semana sin agua». ¿Es correcta su afirmación?", "f": "Cálculo propio", "vis": "", "o": [["A", "Sí, porque si el promedio es bajo, la mayoría de los hogares tiene que estar por debajo de 4 horas.", "Un promedio bajo puede deberse a pocos datos muy pequeños (aquí, 6 hogares con 0 horas); no obliga a que la mayoría esté por debajo de 4.", false], ["B", "Sí, porque con 0, 2 o 4 horas hay 6 + 10 + 12 = 28 hogares, que es más de la mitad de los 40.", "Incluye a los 12 hogares con exactamente 4 horas, que no estuvieron «menos de 4 horas» sin agua.", false], ["C", "No, porque los 4 hogares con 8 horas sin agua hacen que el promedio quede por encima de la mediana.", "Es falso: el promedio queda por debajo de la mediana (4 horas). La conclusión «no» es correcta, pero la razón no.", false], ["D", "No, porque con 0 o 2 horas hay 6 + 10 = 16 hogares, que es menos de la mitad de los 40.", "Los hogares con menos de 4 horas son 6 + 10 = 16 < 20. El promedio no divide los datos en dos mitades; eso lo hace la mediana.", true]]}]}, {"comp": "matematicas", "sim": "s11-3", "ses": 2, "ind": "Escala en el mapa de un parque natural", "tt": "", "texto": "El mapa de un parque natural está elaborado a escala 1:50.000; es decir, cada centímetro del mapa representa 50.000 centímetros en la realidad. En el mapa, el sendero recto que va de la entrada al mirador mide 6,4 cm, y la zona de conservación es un rectángulo de 3 cm de largo por 2 cm de ancho. Recuerde que 1 km = 100.000 cm.", "vis": "", "items": [{"id": "MTC-104", "niv": 1, "cp": "mt_formulacion", "cn": "", "e": "¿Cuál es la longitud real del sendero entre la entrada y el mirador?", "f": "Cálculo propio", "vis": "", "o": [["A", "0,32 km.", "Se dividieron los 320.000 cm entre 1.000.000; la conversión correcta es entre 100.000, porque 1 km tiene 100.000 cm.", false], ["B", "3,2 km.", "6,4 × 50.000 = 320.000 cm, y 320.000 ÷ 100.000 = 3,2 km.", true], ["C", "32 km.", "Se dividieron los 320.000 cm entre 10.000 en lugar de 100.000 al convertir a kilómetros.", false], ["D", "320 km.", "Se dividieron los 320.000 cm entre 1.000, como si fueran metros, y no centímetros.", false]]}, {"id": "MTC-105", "niv": 2, "cp": "mt_argumentacion", "cn": "", "e": "Un guía afirma: «Como la escala es 1:50.000, los 6 cm² que ocupa la zona de conservación en el mapa corresponden a 6 × 50.000 = 300.000 cm² en la realidad». ¿Es correcto el razonamiento del guía?", "f": "Cálculo propio", "vis": "", "o": [["A", "No, porque las medidas reales se obtienen dividiendo entre la escala y no multiplicando por ella.", "Las medidas reales son mayores que las del mapa; no se divide entre la escala, se multiplica (al cuadrado, en el caso de las áreas).", false], ["B", "No, porque la escala se aplica a cada longitud, de modo que el área cambia con el cuadrado de la escala.", "Largo y ancho se amplían por la escala; el área, que es su producto, se amplía por el cuadrado de la escala, no por la escala.", true], ["C", "Sí, porque el perímetro real crece 50.000 veces y el área crece en esa misma proporción.", "El perímetro sí crece 50.000 veces, pero el área crece 50.000² veces; no cambian en la misma proporción.", false], ["D", "Sí, porque, según la escala, cada centímetro cuadrado del mapa equivale a 50.000 cm² reales.", "La escala es de longitudes: 1 cm equivale a 50.000 cm, de modo que 1 cm² equivale a 50.000² cm², no a 50.000 cm².", false]]}, {"id": "MTC-106", "niv": 3, "cp": "mt_formulacion", "cn": "", "e": "¿Cuál es el área real de la zona de conservación?", "f": "Cálculo propio", "vis": "", "o": [["A", "1,5 km².", "Largo real: 3 × 50.000 = 150.000 cm = 1,5 km; ancho real: 2 × 50.000 = 100.000 cm = 1 km. Área: 1,5 × 1 = 1,5 km².", true], ["B", "2,5 km².", "Se sumaron las dos dimensiones reales (1,5 km + 1 km) en vez de multiplicarlas.", false], ["C", "5 km².", "Es el perímetro del rectángulo real, 2 × (1,5 + 1) = 5 km, no su área.", false], ["D", "15 km².", "Se convirtió el largo de 150.000 cm a 15 km (dividiendo entre 10.000), lo que da un área 10 veces mayor.", false]]}]}, {"comp": "matematicas", "sim": "s11-3", "ses": 2, "ind": "Pendiente de una rampa de acceso", "tt": "", "texto": "La junta de un salón comunal construirá una rampa recta para que las personas en silla de ruedas lleguen a la entrada, que está 0,6 m por encima del nivel del andén. La junta decidió que la pendiente de la rampa, es decir, la razón entre la altura que sube y su avance horizontal, no debe superar el 8 %.", "vis": "", "items": [{"id": "MTC-112", "niv": 2, "cp": "mt_formulacion", "cn": "", "e": "¿Cuál es el menor avance horizontal que puede tener la rampa?", "f": "Cálculo propio", "vis": "", "o": [["A", "0,75 m.", "Divide 0,6 entre 0,8 en lugar de 0,08: confunde 8 % con 0,8.", false], ["B", "4,8 m.", "Multiplica 0,6 × 8; la pendiente es altura ÷ avance, así que el avance se obtiene dividiendo.", false], ["C", "7,5 m.", "Avance mínimo = altura ÷ pendiente máxima = 0,6 ÷ 0,08 = 7,5 m. Con un avance menor la pendiente superaría el 8 %.", true], ["D", "13,3 m.", "Calcula 8 ÷ 0,6: invierte la razón entre la altura y el porcentaje.", false]]}]}, {"comp": "matematicas", "sim": "s11-3", "ses": 2, "ind": "Cable tensor de un poste de energía", "tt": "", "texto": "Para sostener un poste de energía de 8 m de altura, una cuadrilla instala un cable tensor recto desde la punta del poste hasta un anclaje en el suelo, ubicado a 6 m de la base del poste. El poste es perpendicular al suelo, que es horizontal. La figura representa la situación (no está a escala).", "vis": "<div class=\"vfig\"><svg viewBox=\"0 0 320 260\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Arial\" font-size=\"14\"><rect width=\"320\" height=\"260\" fill=\"#ffffff\"/><line x1=\"20\" y1=\"220\" x2=\"300\" y2=\"220\" stroke=\"#1d2433\" stroke-width=\"2\"/><line x1=\"80\" y1=\"220\" x2=\"80\" y2=\"40\" stroke=\"#1d2433\" stroke-width=\"5\"/><line x1=\"80\" y1=\"40\" x2=\"215\" y2=\"220\" stroke=\"#1d2433\" stroke-width=\"2\" stroke-dasharray=\"6 4\"/><rect x=\"80\" y=\"206\" width=\"14\" height=\"14\" fill=\"none\" stroke=\"#1d2433\"/><path d=\"M 193 220 A 22 22 0 0 1 202 203\" fill=\"none\" stroke=\"#1d2433\"/><text x=\"44\" y=\"135\" fill=\"#1d2433\">8 m<\/text><text x=\"135\" y=\"242\" fill=\"#1d2433\">6 m<\/text><text x=\"156\" y=\"120\" fill=\"#1d2433\">cable<\/text><text x=\"60\" y=\"32\" fill=\"#1d2433\">Poste<\/text><text x=\"178\" y=\"212\" fill=\"#1d2433\">θ<\/text><text x=\"222\" y=\"214\" fill=\"#1d2433\">Anclaje<\/text><\/svg><\/div>", "items": [{"id": "MTC-113", "niv": 1, "cp": "mt_formulacion", "cn": "", "e": "¿Cuál es la longitud del cable tensor?", "f": "Teorema de Pitágoras; cálculo propio", "vis": "", "o": [["A", "5,3 m.", "Resta los cuadrados (64 − 36 = 28) y saca la raíz; así se halla un cateto, no la hipotenusa.", false], ["B", "10 m.", "Por el teorema de Pitágoras: √(8² + 6²) = √(64 + 36) = √100 = 10 m.", true], ["C", "14 m.", "Suma las longitudes de los catetos (8 + 6); la hipotenusa no es la suma de los catetos.", false], ["D", "100 m.", "Calcula 8² + 6² = 100, pero olvida sacar la raíz cuadrada.", false]]}, {"id": "MTC-114", "niv": 2, "cp": "mt_interpretacion", "cn": "", "e": "Si θ es el ángulo que forma el cable con el suelo, como muestra la figura, ¿cuál de las siguientes igualdades es correcta?", "f": "Razones trigonométricas en el triángulo rectángulo", "vis": "", "o": [["A", "tan θ = 6/8.", "Invierte la razón: 6/8 sería la tangente del ángulo que forma el cable con el poste, no con el suelo.", false], ["B", "sen θ = 8/6.", "El seno es cateto opuesto ÷ hipotenusa = 8/10; además, un seno nunca puede ser mayor que 1.", false], ["C", "cos θ = 8/10.", "El coseno es cateto adyacente ÷ hipotenusa = 6/10; 8/10 corresponde al seno de θ.", false], ["D", "tan θ = 8/6.", "Desde el ángulo θ, el poste (8 m) es el cateto opuesto y la distancia en el suelo (6 m) es el adyacente: tan θ = 8/6.", true]]}]}, {"comp": "matematicas", "sim": "s11-3", "ses": 2, "ind": "Medios de transporte de los estudiantes", "tt": "", "texto": "En un colegio se preguntó a sus 500 estudiantes cómo llegan cada mañana. Cada estudiante eligió una sola opción. La gráfica muestra el porcentaje de estudiantes que eligió cada medio de transporte.", "vis": "<div class=\"vfig\"><svg class=\"vg\" viewBox=\"0 0 560 320\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Gráfica 5. Medio de transporte para llegar al colegio\" font-family=\"Arial, sans-serif\" font-size=\"12\"><rect width=\"560\" height=\"320\" fill=\"#ffffff\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"13\" fill=\"#1d2433\">Gráfica 5. Medio de transporte para llegar al colegio<\/text><path d=\"M170,175 L170.0,60.0 A115,115 0 0,1 237.6,268.0 Z\" fill=\"#1660a8\" stroke=\"#fff\" stroke-width=\"1.5\"/><path d=\"M170,175 L237.6,268.0 A115,115 0 0,1 77.0,242.6 Z\" fill=\"#d9822b\" stroke=\"#fff\" stroke-width=\"1.5\"/><path d=\"M170,175 L77.0,242.6 A115,115 0 0,1 60.6,139.5 Z\" fill=\"#2e8b57\" stroke=\"#fff\" stroke-width=\"1.5\"/><path d=\"M170,175 L60.6,139.5 A115,115 0 0,1 114.6,74.2 Z\" fill=\"#8e44ad\" stroke=\"#fff\" stroke-width=\"1.5\"/><path d=\"M170,175 L114.6,74.2 A115,115 0 0,1 170.0,60.0 Z\" fill=\"#c0392b\" stroke=\"#fff\" stroke-width=\"1.5\"/><rect x=\"320\" y=\"59\" width=\"14\" height=\"14\" fill=\"#1660a8\"/><text x=\"340\" y=\"70\" fill=\"#1d2433\">Caminando: 40 %<\/text><rect x=\"320\" y=\"83\" width=\"14\" height=\"14\" fill=\"#d9822b\"/><text x=\"340\" y=\"94\" fill=\"#1d2433\">Bus: 25 %<\/text><rect x=\"320\" y=\"107\" width=\"14\" height=\"14\" fill=\"#2e8b57\"/><text x=\"340\" y=\"118\" fill=\"#1d2433\">Bicicleta: 15 %<\/text><rect x=\"320\" y=\"131\" width=\"14\" height=\"14\" fill=\"#8e44ad\"/><text x=\"340\" y=\"142\" fill=\"#1d2433\">Moto: 12 %<\/text><rect x=\"320\" y=\"155\" width=\"14\" height=\"14\" fill=\"#c0392b\"/><text x=\"340\" y=\"166\" fill=\"#1d2433\">Carro: 8 %<\/text><\/svg><\/div>", "items": [{"id": "MTC-115", "niv": 1, "cp": "mt_interpretacion", "cn": "", "e": "¿Cuántos estudiantes más llegan caminando que en bus?", "f": "Cálculo propio", "vis": "", "o": [["A", "15", "Es la diferencia de porcentajes (40 % − 25 %), no de estudiantes; falta calcular el 15 % de 500.", false], ["B", "75", "Caminando: 40 % de 500 = 200; en bus: 25 % de 500 = 125; diferencia: 200 − 125 = 75.", true], ["C", "125", "Es el número de estudiantes que llegan en bus, no la diferencia con los que llegan caminando.", false], ["D", "200", "Es el número de estudiantes que llegan caminando; falta restar los que llegan en bus.", false]]}, {"id": "MTC-116", "niv": 2, "cp": "mt_interpretacion", "cn": "", "e": "Si se quisiera dibujar a mano la misma gráfica circular, ¿qué ángulo central debería tener el sector «Bicicleta»?", "f": "Cálculo propio", "vis": "", "o": [["A", "15°.", "Toma el porcentaje como si fuera directamente la medida del ángulo; el círculo completo tiene 360°, no 100°.", false], ["B", "24°.", "Divide 360 entre 15 en lugar de calcular el 15 % de 360°.", false], ["C", "54°.", "El sector debe ocupar el 15 % del círculo: 0,15 × 360° = 54°.", true], ["D", "75°.", "Usa el número de estudiantes en bicicleta (15 % de 500 = 75) como si fuera el ángulo en grados.", false]]}]}, {"comp": "matematicas", "sim": "s11-3", "ses": 2, "ind": "Figuras con palillos", "tt": "", "texto": "Mariana arma una fila de triángulos con palillos, como en un juego de ingenio. Cada triángulo nuevo comparte un lado con el anterior. La tabla muestra cuántos palillos usa según el número de triángulos de la fila.", "vis": "<table class=\"vt\"><caption>Tabla 11. Palillos usados<\/caption><thead><tr><th>Número de triángulos<\/th><th>1<\/th><th>2<\/th><th>3<\/th><th>4<\/th><\/tr><\/thead><tbody><tr><td>Número de palillos<\/td><td>3<\/td><td>5<\/td><td>7<\/td><td>9<\/td><\/tr><\/tbody><\/table>", "items": [{"id": "MTC-119", "niv": 2, "cp": "mt_interpretacion", "cn": "", "e": "¿Cuál expresión permite calcular el número P de palillos necesarios para formar una fila de n triángulos?", "f": "Regularidad de la tabla", "vis": "", "o": [["A", "P = 2n + 1.", "Cada triángulo agrega 2 palillos y hay 1 palillo inicial: n = 1, 2, 3, 4 da 3, 5, 7, 9, como en la tabla.", true], ["B", "P = 3n.", "Solo funciona para n = 1; no tiene en cuenta que cada triángulo nuevo comparte un lado y usa solo 2 palillos más.", false], ["C", "P = n + 2.", "Da 3 palillos para n = 1, pero 4 para n = 2, cuando la tabla indica 5.", false], ["D", "P = 3n − 1.", "Da 2 palillos para n = 1, y un triángulo necesita 3 palillos.", false]]}, {"id": "MTC-120", "niv": 2, "cp": "mt_formulacion", "cn": "", "e": "Si Mariana tiene 101 palillos y los usa todos, ¿cuántos triángulos tendrá la fila?", "f": "Cálculo propio", "vis": "", "o": [["A", "33", "Divide 101 entre 3, como si cada triángulo usara 3 palillos propios, sin compartir lados.", false], ["B", "49", "Resta los 3 palillos del primer triángulo y divide entre 2, pero olvida contar ese primer triángulo.", false], ["C", "50", "Se resuelve 2n + 1 = 101: 2n = 100, n = 50 triángulos.", true], ["D", "51", "Divide 101 entre 2 y redondea hacia arriba, sin descontar el palillo inicial.", false]]}]}, {"comp": "matematicas", "sim": "s11-3", "ses": 2, "ind": "Cancha de fútbol del barrio", "tt": "", "texto": "La cancha de fútbol del barrio es un rectángulo de 90 m de largo y 60 m de ancho. En su centro hay un círculo de 9 m de radio. Use π ≈ 3,14.", "vis": "", "items": [{"id": "MTC-121", "niv": 1, "cp": "mt_formulacion", "cn": "", "e": "Se va a pintar únicamente el borde del círculo central. ¿Cuál es la longitud de ese borde?", "f": "Cálculo propio", "vis": "", "o": [["A", "28,26 m.", "Calcula π × 9; la longitud de la circunferencia es 2πr, así que falta multiplicar por 2.", false], ["B", "56,52 m.", "Longitud de la circunferencia: 2πr = 2 × 3,14 × 9 = 56,52 m.", true], ["C", "113,04 m.", "Usa el diámetro (18 m) en lugar del radio en la fórmula 2πr.", false], ["D", "254,34 m.", "Calcula el área del círculo (π × 9² = 254,34 m²), no la longitud de su borde.", false]]}, {"id": "MTC-122", "niv": 1, "cp": "mt_interpretacion", "cn": "", "e": "Un estudiante dibuja la cancha en un plano cartesiano con una esquina en el origen (0, 0), el largo sobre el eje x positivo y el ancho sobre el eje y positivo, de modo que 1 unidad equivale a 1 m. ¿Cuáles son las coordenadas del centro del círculo?", "f": "Sistema de coordenadas cartesianas", "vis": "", "o": [["A", "(90, 60).", "Es la esquina opuesta al origen; el centro está en la mitad de cada dimensión.", false], ["B", "(60, 90).", "Usa las dimensiones completas y además las intercambia; ese punto queda fuera de la cancha.", false], ["C", "(30, 45).", "Intercambia las coordenadas: el largo (90 m) está sobre el eje x, así que la mitad del largo va en la primera coordenada.", false], ["D", "(45, 30).", "El centro está en la mitad del largo y en la mitad del ancho: (90/2, 60/2) = (45, 30).", true]]}]}, {"comp": "matematicas", "sim": "s11-3", "ses": 2, "ind": "Entrenamiento de un ciclista", "tt": "", "texto": "La gráfica muestra la distancia total recorrida por un ciclista durante un entrenamiento de 40 minutos, medida cada 10 minutos. Entre cada par de mediciones consecutivas, el ciclista se movió a velocidad constante o permaneció detenido.", "vis": "<div class=\"vfig\"><svg class=\"vg\" viewBox=\"0 0 560 320\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Gráfica 6. Distancia total recorrida por el ciclista\" font-family=\"Arial, sans-serif\" font-size=\"12\"><rect width=\"560\" height=\"320\" fill=\"#ffffff\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"13\" fill=\"#1d2433\">Gráfica 6. Distancia total recorrida por el ciclista<\/text><line x1=\"60\" y1=\"258.0\" x2=\"540\" y2=\"258.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"262.0\" text-anchor=\"end\" fill=\"#3a4356\">0<\/text><line x1=\"60\" y1=\"213.6\" x2=\"540\" y2=\"213.6\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"217.6\" text-anchor=\"end\" fill=\"#3a4356\">2<\/text><line x1=\"60\" y1=\"169.2\" x2=\"540\" y2=\"169.2\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"173.2\" text-anchor=\"end\" fill=\"#3a4356\">4<\/text><line x1=\"60\" y1=\"124.8\" x2=\"540\" y2=\"124.8\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"128.8\" text-anchor=\"end\" fill=\"#3a4356\">6<\/text><line x1=\"60\" y1=\"80.4\" x2=\"540\" y2=\"80.4\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"84.4\" text-anchor=\"end\" fill=\"#3a4356\">8<\/text><line x1=\"60\" y1=\"36.0\" x2=\"540\" y2=\"36.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"40.0\" text-anchor=\"end\" fill=\"#3a4356\">10<\/text><line x1=\"60\" y1=\"258\" x2=\"540\" y2=\"258\" stroke=\"#3a4356\"/><line x1=\"60\" y1=\"258\" x2=\"60\" y2=\"36\" stroke=\"#3a4356\"/><text transform=\"translate(14,147.0) rotate(-90)\" text-anchor=\"middle\" fill=\"#3a4356\">Distancia total (km)<\/text><text x=\"300.0\" y=\"312\" text-anchor=\"middle\" fill=\"#3a4356\">Tiempo (min)<\/text><text x=\"108.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">0<\/text><text x=\"204.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">10<\/text><text x=\"300.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">20<\/text><text x=\"396.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">30<\/text><text x=\"492.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">40<\/text><polyline fill=\"none\" stroke=\"#1660a8\" stroke-width=\"2.5\" points=\"108.0,258.0 204.0,191.4 300.0,124.8 396.0,124.8 492.0,36.0\"/><circle cx=\"108.0\" cy=\"258.0\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"108.0\" y=\"250.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">0<\/text><circle cx=\"204.0\" cy=\"191.4\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"204.0\" y=\"183.4\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">3<\/text><circle cx=\"300.0\" cy=\"124.8\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"300.0\" y=\"116.8\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">6<\/text><circle cx=\"396.0\" cy=\"124.8\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"396.0\" y=\"116.8\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">6<\/text><circle cx=\"492.0\" cy=\"36.0\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"492.0\" y=\"28.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">10<\/text><\/svg><\/div>", "items": [{"id": "MTC-125", "niv": 1, "cp": "mt_interpretacion", "cn": "", "e": "¿Entre cuáles minutos el ciclista permaneció detenido?", "f": "Lectura de gráfica", "vis": "", "o": [["A", "Entre los minutos 0 y 10.", "En ese intervalo la distancia total pasó de 0 a 3 km, así que el ciclista avanzó.", false], ["B", "Entre los minutos 10 y 20.", "En ese intervalo la distancia total pasó de 3 a 6 km, así que el ciclista avanzó.", false], ["C", "Entre los minutos 20 y 30.", "La distancia total se mantuvo en 6 km: el ciclista no avanzó, es decir, estuvo detenido.", true], ["D", "Entre los minutos 30 y 40.", "En ese intervalo la distancia pasó de 6 a 10 km: fue el tramo en que más avanzó, no en el que se detuvo.", false]]}]}, {"comp": "matematicas", "sim": "s11-3", "ses": 2, "ind": "Selección de libros en un club de lectura", "tt": "", "texto": "El club de lectura de una biblioteca municipal tiene una lista de 9 novelas finalistas, todas distintas. Los integrantes deben escoger algunas de ellas para leer durante el semestre.", "vis": "", "items": [{"id": "MTC-129", "niv": 2, "cp": "mt_formulacion", "cn": "", "e": "Si se escogerán 3 novelas para leerlas, sin importar el orden, ¿de cuántas maneras distintas puede hacerse la selección?", "f": "Combinaciones; cálculo propio", "vis": "", "o": [["A", "27", "Multiplica 9 × 3; ese producto no cuenta los grupos posibles de 3 novelas.", false], ["B", "84", "El orden no importa: C(9, 3) = (9 × 8 × 7)/(3 × 2 × 1) = 504/6 = 84 maneras.", true], ["C", "504", "Es 9 × 8 × 7: cuenta como distintas las mismas 3 novelas escogidas en otro orden.", false], ["D", "729", "Es 9³: permite escoger la misma novela varias veces y además tiene en cuenta el orden.", false]]}, {"id": "MTC-130", "niv": 3, "cp": "mt_argumentacion", "cn": "", "e": "Una integrante afirma: «Si además de escoger las 3 novelas se decide cuál se lee en agosto, cuál en septiembre y cuál en octubre, el número de maneras posibles es 6 veces el número de maneras de escoger las 3 novelas sin orden». ¿Es correcta su afirmación?", "f": "Permutaciones y combinaciones", "vis": "", "o": [["A", "No, porque con meses asignados cualquier novela puede leerse en los tres meses, lo que da 9 × 9 × 9 maneras.", "Una misma novela no se lee en dos meses distintos; las elecciones son 9, luego 8 y luego 7.", false], ["B", "No, porque al asignar los meses el orden no importa, y el número de maneras es el mismo que sin orden.", "Al asignar meses distintos sí importa qué novela va en cada uno; por eso el número de maneras aumenta.", false], ["C", "No, porque cada grupo de 3 novelas puede repartirse en los meses de solo 3 formas, una por mes.", "Tres novelas se reparten en tres meses de 3 × 2 × 1 = 6 formas, no de 3.", false], ["D", "Sí, porque cada grupo de 3 novelas puede repartirse en los tres meses de 3 × 2 × 1 = 6 formas distintas.", "Con meses asignados importa el orden: cada grupo de 3 novelas da lugar a 3! = 6 calendarios distintos.", true]]}]}, {"comp": "matematicas", "sim": "s11-3", "ses": 2, "ind": "Tanque de agua lluvia de una vereda", "tt": "", "texto": "Una vereda almacena agua lluvia en un tanque con forma de cilindro recto de 2 m de diámetro y 1,5 m de altura. Recuerde que 1 m³ equivale a 1.000 litros y use π ≈ 3,14.", "vis": "", "items": [{"id": "MTC-131", "niv": 2, "cp": "mt_formulacion", "cn": "", "e": "¿Cuál es la capacidad aproximada del tanque?", "f": "Cálculo propio", "vis": "", "o": [["A", "471 litros.", "Calcula bien el volumen (4,71 m³), pero multiplica por 100 en lugar de 1.000 al pasar a litros.", false], ["B", "4.710 litros.", "Radio = 1 m; V = π r² h = 3,14 × 1² × 1,5 = 4,71 m³ = 4.710 litros.", true], ["C", "9.420 litros.", "Usa 2πrh = 9,42, que es el área lateral del cilindro, no su volumen.", false], ["D", "18.840 litros.", "Usa el diámetro (2 m) como si fuera el radio: 3,14 × 2² × 1,5 = 18,84 m³.", false]]}, {"id": "MTC-132", "niv": 2, "cp": "mt_argumentacion", "cn": "", "e": "Un habitante afirma: «Si construimos otro tanque con el doble de diámetro y la misma altura, tendrá el doble de capacidad». ¿Es correcta su afirmación?", "f": "Cálculo propio", "vis": "", "o": [["A", "No, porque el radio también se duplica y el volumen, que depende de r², se multiplica por 2² = 4.", "V = π r² h: al duplicar el diámetro se duplica el radio y el área de la base se multiplica por 4; con la misma altura, el volumen también.", true], ["B", "Sí, porque el volumen es π · r · h, y si el radio se duplica, el volumen se multiplica por 2.", "La fórmula del volumen del cilindro es π r² h, no π r h; el radio interviene al cuadrado.", false], ["C", "No, porque al duplicar el diámetro el volumen se multiplica por 2³ = 8, como ocurre en los cubos.", "El factor 8 aparece si se duplican las tres dimensiones; aquí la altura no cambia y el factor es 4.", false], ["D", "Sí, porque solo cambia el diámetro, de 2 m a 4 m, y la altura de 1,5 m se mantiene igual.", "Aunque cambie una sola medida, el radio interviene al cuadrado en el volumen: el factor es 4, no 2.", false]]}]}, {"comp": "matematicas", "sim": "s11-3", "ses": 2, "ind": "Precipitación en dos municipios", "tt": "", "texto": "Una estación meteorológica comparó la precipitación mensual, en milímetros (mm), de dos municipios, A y B, durante el primer semestre de un año.", "vis": "<div class=\"vfig\"><svg class=\"vg\" viewBox=\"0 0 560 320\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Gráfica 7. Precipitación mensual\" font-family=\"Arial, sans-serif\" font-size=\"12\"><rect width=\"560\" height=\"320\" fill=\"#ffffff\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"13\" fill=\"#1d2433\">Gráfica 7. Precipitación mensual<\/text><line x1=\"60\" y1=\"258.0\" x2=\"540\" y2=\"258.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"262.0\" text-anchor=\"end\" fill=\"#3a4356\">0<\/text><line x1=\"60\" y1=\"213.6\" x2=\"540\" y2=\"213.6\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"217.6\" text-anchor=\"end\" fill=\"#3a4356\">50<\/text><line x1=\"60\" y1=\"169.2\" x2=\"540\" y2=\"169.2\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"173.2\" text-anchor=\"end\" fill=\"#3a4356\">100<\/text><line x1=\"60\" y1=\"124.8\" x2=\"540\" y2=\"124.8\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"128.8\" text-anchor=\"end\" fill=\"#3a4356\">150<\/text><line x1=\"60\" y1=\"80.4\" x2=\"540\" y2=\"80.4\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"84.4\" text-anchor=\"end\" fill=\"#3a4356\">200<\/text><line x1=\"60\" y1=\"36.0\" x2=\"540\" y2=\"36.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"40.0\" text-anchor=\"end\" fill=\"#3a4356\">250<\/text><line x1=\"60\" y1=\"258\" x2=\"540\" y2=\"258\" stroke=\"#3a4356\"/><line x1=\"60\" y1=\"258\" x2=\"60\" y2=\"36\" stroke=\"#3a4356\"/><text transform=\"translate(14,147.0) rotate(-90)\" text-anchor=\"middle\" fill=\"#3a4356\">Precipitación (mm)<\/text><text x=\"300.0\" y=\"312\" text-anchor=\"middle\" fill=\"#3a4356\">Mes<\/text><text x=\"100.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Ene<\/text><text x=\"180.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Feb<\/text><text x=\"260.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Mar<\/text><text x=\"340.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Abr<\/text><text x=\"420.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">May<\/text><text x=\"500.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Jun<\/text><rect x=\"72.0\" y=\"151.4\" width=\"28.0\" height=\"106.6\" fill=\"#1660a8\"/><text x=\"86.0\" y=\"147.4\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">120<\/text><rect x=\"152.0\" y=\"133.7\" width=\"28.0\" height=\"124.3\" fill=\"#1660a8\"/><text x=\"166.0\" y=\"129.7\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">140<\/text><rect x=\"232.0\" y=\"142.6\" width=\"28.0\" height=\"115.4\" fill=\"#1660a8\"/><text x=\"246.0\" y=\"138.6\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">130<\/text><rect x=\"312.0\" y=\"124.8\" width=\"28.0\" height=\"133.2\" fill=\"#1660a8\"/><text x=\"326.0\" y=\"120.8\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">150<\/text><rect x=\"392.0\" y=\"160.3\" width=\"28.0\" height=\"97.7\" fill=\"#1660a8\"/><text x=\"406.0\" y=\"156.3\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">110<\/text><rect x=\"472.0\" y=\"142.6\" width=\"28.0\" height=\"115.4\" fill=\"#1660a8\"/><text x=\"486.0\" y=\"138.6\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">130<\/text><rect x=\"100.0\" y=\"204.7\" width=\"28.0\" height=\"53.3\" fill=\"#d9822b\"/><text x=\"114.0\" y=\"200.7\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">60<\/text><rect x=\"180.0\" y=\"80.4\" width=\"28.0\" height=\"177.6\" fill=\"#d9822b\"/><text x=\"194.0\" y=\"76.4\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">200<\/text><rect x=\"260.0\" y=\"178.1\" width=\"28.0\" height=\"79.9\" fill=\"#d9822b\"/><text x=\"274.0\" y=\"174.1\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">90<\/text><rect x=\"340.0\" y=\"71.5\" width=\"28.0\" height=\"186.5\" fill=\"#d9822b\"/><text x=\"354.0\" y=\"67.5\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">210<\/text><rect x=\"420.0\" y=\"169.2\" width=\"28.0\" height=\"88.8\" fill=\"#d9822b\"/><text x=\"434.0\" y=\"165.2\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">100<\/text><rect x=\"500.0\" y=\"151.4\" width=\"28.0\" height=\"106.6\" fill=\"#d9822b\"/><text x=\"514.0\" y=\"147.4\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">120<\/text><rect x=\"60\" y=\"286\" width=\"12\" height=\"12\" fill=\"#1660a8\"/><text x=\"76\" y=\"296\" fill=\"#1d2433\">Municipio A<\/text><rect x=\"163\" y=\"286\" width=\"12\" height=\"12\" fill=\"#d9822b\"/><text x=\"179\" y=\"296\" fill=\"#1d2433\">Municipio B<\/text><\/svg><\/div>", "items": [{"id": "MTC-135", "niv": 1, "cp": "mt_interpretacion", "cn": "", "e": "¿En cuántos de los seis meses la precipitación del municipio A fue mayor que la del municipio B?", "f": "Lectura de gráfica", "vis": "", "o": [["A", "En 2 meses.", "Cuenta solo los meses en que la diferencia a favor de A es grande (enero y marzo); también A supera a B en mayo y junio.", false], ["B", "En 3 meses.", "Omite alguno de los meses en que A supera a B: enero, marzo, mayo y junio.", false], ["C", "En 4 meses.", "A supera a B en enero (120 > 60), marzo (130 > 90), mayo (110 > 100) y junio (130 > 120).", true], ["D", "En 5 meses.", "En febrero (140 < 200) y abril (150 < 210) la precipitación de B fue mayor; A solo supera a B en 4 meses.", false]]}, {"id": "MTC-136", "niv": 3, "cp": "mt_argumentacion", "cn": "", "e": "Un funcionario afirma: «Como los dos municipios tuvieron un promedio de 130 mm mensuales, la lluvia fue igual de estable de un mes a otro en ambos». ¿Es correcta su afirmación?", "f": "Cálculo propio", "vis": "", "o": [["A", "No, porque aunque los promedios coinciden, el rango de B es 210 − 60 = 150 mm y el de A, 40 mm.", "Promedio de ambos: 780/6 = 130 mm, pero B tiene un rango mucho mayor: su lluvia fue más variable.", true], ["B", "Sí, porque la diferencia entre los dos promedios es 130 − 130 = 0 mm, así que la lluvia varió igual.", "Que los promedios sean iguales no dice nada sobre la variación; el rango de B (150 mm) es mucho mayor que el de A (40 mm).", false], ["C", "No, porque B tiene un promedio mayor: (200 + 210) ÷ 2 = 205 mm, frente a (140 + 150) ÷ 2 = 145 mm de A.", "Promedia solo los dos meses más lluviosos de cada municipio; con los seis meses ambos promedios son 130 mm.", false], ["D", "Sí, porque ambos municipios suman 780 mm en el semestre y, por tanto, tienen la misma dispersión mensual.", "Igual total (e igual promedio) no implica igual dispersión: B pasó de 60 a 210 mm y A solo de 110 a 150 mm.", false]]}]}, {"comp": "matematicas", "sim": "s11-3", "ses": 2, "ind": "Comparación de planes de telefonía", "tt": "", "texto": "Un operador de telefonía ofrece dos planes mensuales. Plan Básico: $ 18.000 de cargo fijo más $ 150 por cada minuto de llamadas. Plan Ilimitado: $ 45.000 fijos, sin importar los minutos usados.", "vis": "", "items": [{"id": "MTC-144", "niv": 2, "cp": "mt_formulacion", "cn": "", "e": "Un usuario del Plan Básico no quiere pagar más de $ 39.000 al mes. ¿Cuántos minutos de llamadas puede usar como máximo?", "f": "Cálculo propio", "vis": "", "o": [["A", "120", "Es 18.000 ÷ 150: los minutos que se pagarían con el cargo fijo; no tiene en cuenta el presupuesto de $ 39.000.", false], ["B", "140", "Se descuenta el cargo fijo: (39.000 − 18.000) ÷ 150 = 21.000 ÷ 150 = 140 minutos.", true], ["C", "260", "Es 39.000 ÷ 150: no descuenta el cargo fijo de $ 18.000.", false], ["D", "380", "Es (39.000 + 18.000) ÷ 150: suma el cargo fijo en lugar de restarlo.", false]]}, {"id": "MTC-145", "niv": 2, "cp": "mt_interpretacion", "cn": "", "e": "La gráfica muestra el costo mensual de cada plan. ¿Para qué consumos mensuales resulta más barato el Plan Básico?", "f": "Lectura de gráfica y modelo lineal", "vis": "<div class=\"vfig\"><svg class=\"vg\" viewBox=\"0 0 560 320\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Gráfica 8. Costo mensual de los planes\" font-family=\"Arial, sans-serif\" font-size=\"12\"><rect width=\"560\" height=\"320\" fill=\"#ffffff\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"13\" fill=\"#1d2433\">Gráfica 8. Costo mensual de los planes<\/text><line x1=\"60\" y1=\"258.0\" x2=\"540\" y2=\"258.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"262.0\" text-anchor=\"end\" fill=\"#3a4356\">0<\/text><line x1=\"60\" y1=\"202.5\" x2=\"540\" y2=\"202.5\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"206.5\" text-anchor=\"end\" fill=\"#3a4356\">20.000<\/text><line x1=\"60\" y1=\"147.0\" x2=\"540\" y2=\"147.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"151.0\" text-anchor=\"end\" fill=\"#3a4356\">40.000<\/text><line x1=\"60\" y1=\"91.5\" x2=\"540\" y2=\"91.5\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"95.5\" text-anchor=\"end\" fill=\"#3a4356\">60.000<\/text><line x1=\"60\" y1=\"36.0\" x2=\"540\" y2=\"36.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"40.0\" text-anchor=\"end\" fill=\"#3a4356\">80.000<\/text><line x1=\"60\" y1=\"258\" x2=\"540\" y2=\"258\" stroke=\"#3a4356\"/><line x1=\"60\" y1=\"258\" x2=\"60\" y2=\"36\" stroke=\"#3a4356\"/><text transform=\"translate(14,147.0) rotate(-90)\" text-anchor=\"middle\" fill=\"#3a4356\">Costo (pesos)<\/text><text x=\"300.0\" y=\"312\" text-anchor=\"middle\" fill=\"#3a4356\">Minutos de llamadas al mes<\/text><text x=\"100.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">0<\/text><text x=\"180.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">60<\/text><text x=\"260.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">120<\/text><text x=\"340.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">180<\/text><text x=\"420.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">240<\/text><text x=\"500.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">300<\/text><polyline fill=\"none\" stroke=\"#1660a8\" stroke-width=\"2.5\" points=\"100.0,208.1 180.0,183.1 260.0,158.1 340.0,133.1 420.0,108.2 500.0,83.2\"/><circle cx=\"100.0\" cy=\"208.1\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"100.0\" y=\"200.1\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">18.000<\/text><circle cx=\"180.0\" cy=\"183.1\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"180.0\" y=\"175.1\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">27.000<\/text><circle cx=\"260.0\" cy=\"158.1\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"260.0\" y=\"150.1\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">36.000<\/text><circle cx=\"340.0\" cy=\"133.1\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"340.0\" y=\"125.1\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">45.000<\/text><circle cx=\"420.0\" cy=\"108.2\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"420.0\" y=\"100.2\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">54.000<\/text><circle cx=\"500.0\" cy=\"83.2\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"500.0\" y=\"75.2\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">63.000<\/text><polyline fill=\"none\" stroke=\"#d9822b\" stroke-width=\"2.5\" points=\"100.0,133.1 180.0,133.1 260.0,133.1 340.0,133.1 420.0,133.1 500.0,133.1\"/><circle cx=\"100.0\" cy=\"133.1\" r=\"3.5\" fill=\"#d9822b\"/><text x=\"100.0\" y=\"150.1\" text-anchor=\"middle\" font-size=\"11\" fill=\"#d9822b\" font-weight=\"bold\">45.000<\/text><circle cx=\"180.0\" cy=\"133.1\" r=\"3.5\" fill=\"#d9822b\"/><text x=\"180.0\" y=\"150.1\" text-anchor=\"middle\" font-size=\"11\" fill=\"#d9822b\" font-weight=\"bold\">45.000<\/text><circle cx=\"260.0\" cy=\"133.1\" r=\"3.5\" fill=\"#d9822b\"/><text x=\"260.0\" y=\"150.1\" text-anchor=\"middle\" font-size=\"11\" fill=\"#d9822b\" font-weight=\"bold\">45.000<\/text><circle cx=\"340.0\" cy=\"133.1\" r=\"3.5\" fill=\"#d9822b\"/><text x=\"340.0\" y=\"150.1\" text-anchor=\"middle\" font-size=\"11\" fill=\"#d9822b\" font-weight=\"bold\">45.000<\/text><circle cx=\"420.0\" cy=\"133.1\" r=\"3.5\" fill=\"#d9822b\"/><text x=\"420.0\" y=\"150.1\" text-anchor=\"middle\" font-size=\"11\" fill=\"#d9822b\" font-weight=\"bold\">45.000<\/text><circle cx=\"500.0\" cy=\"133.1\" r=\"3.5\" fill=\"#d9822b\"/><text x=\"500.0\" y=\"150.1\" text-anchor=\"middle\" font-size=\"11\" fill=\"#d9822b\" font-weight=\"bold\">45.000<\/text><rect x=\"60\" y=\"286\" width=\"12\" height=\"12\" fill=\"#1660a8\"/><text x=\"76\" y=\"296\" fill=\"#1d2433\">Plan Básico<\/text><rect x=\"163\" y=\"286\" width=\"12\" height=\"12\" fill=\"#d9822b\"/><text x=\"179\" y=\"296\" fill=\"#1d2433\">Plan Ilimitado<\/text><\/svg><\/div>", "o": [["A", "Para consumos menores que 300 minutos.", "Con 300 minutos el Básico cuesta $ 63.000; entre 180 y 300 minutos ya es más caro que el Ilimitado.", false], ["B", "Para consumos mayores que 180 minutos.", "Después de 180 minutos el Básico supera los $ 45.000 (240 min cuestan $ 54.000); ahí conviene el Ilimitado.", false], ["C", "Para cualquier consumo, porque su cargo fijo es menor.", "El cargo fijo es menor, pero el costo por minuto hace que el Básico supere al Ilimitado después de 180 minutos.", false], ["D", "Para consumos menores que 180 minutos.", "Antes de 180 minutos la línea del Básico está por debajo de la del Ilimitado (por ejemplo, 120 min cuestan $ 36.000).", true]]}]}, {"comp": "matematicas", "sim": "s11-3", "ses": 2, "ind": "Consumo diario de electrodomésticos", "tt": "", "texto": "La tabla muestra la potencia promedio de algunos electrodomésticos de un hogar (en el caso de la nevera, el promedio a lo largo del día, porque su motor se enciende y se apaga) y el tiempo que funcionan cada día. La energía consumida, en kWh, se obtiene multiplicando la potencia en kilovatios (1 kW = 1.000 W) por el número de horas de uso.", "vis": "<table class=\"vt\"><caption>Tabla 12. Uso diario de electrodomésticos<\/caption><thead><tr><th>Electrodoméstico<\/th><th>Potencia promedio (W)<\/th><th>Horas de uso al día<\/th><\/tr><\/thead><tbody><tr><td>Nevera<\/td><td>150<\/td><td>24<\/td><\/tr><tr><td>Televisor<\/td><td>100<\/td><td>5<\/td><\/tr><tr><td>Plancha<\/td><td>1.200<\/td><td>0,5<\/td><\/tr><tr><td>Ducha eléctrica<\/td><td>3.000<\/td><td>0,4<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Datos ficticios.<\/div>", "items": [{"id": "MTC-150", "niv": 1, "cp": "mt_interpretacion", "cn": "", "e": "¿Cuál de los electrodomésticos de la tabla consume más energía al día?", "f": "Cálculo propio", "vis": "", "o": [["A", "La plancha.", "Tiene alta potencia, pero se usa media hora: 1,2 kW × 0,5 h = 0,6 kWh.", false], ["B", "La ducha eléctrica.", "Tiene la mayor potencia, pero funciona solo 0,4 h: 3 kW × 0,4 h = 1,2 kWh, menos que la nevera.", false], ["C", "El televisor.", "Consume 0,1 kW × 5 h = 0,5 kWh, el menor consumo diario de la tabla.", false], ["D", "La nevera.", "Nevera: 0,15 kW × 24 h = 3,6 kWh, más que la ducha (1,2), la plancha (0,6) y el televisor (0,5).", true]]}]}, {"comp": "sociales_ciudadanas", "sim": "s11-3", "ses": 2, "ind": "Acción de tutela y derecho a la educación", "tt": "", "texto": "Lucía tiene 16 años y una discapacidad motriz. El colegio público de su barrio le negó el cupo con el argumento de que no tiene rampas y de que «no está preparado para recibirla». Su familia considera que se está vulnerando su derecho fundamental a la educación y necesita una protección rápida, porque el año escolar ya comenzó.", "vis": "", "items": [{"id": "SCC-101", "niv": 1, "cp": "sc_pensamiento_social", "cn": "", "e": "¿Qué mecanismo establece la Constitución para que la familia de Lucía pida a un juez la protección inmediata de ese derecho?", "f": "Constitución Política de 1991, arts. 86, 87 y 88", "vis": "", "o": [["A", "La acción de tutela.", "El artículo 86 da a toda persona la acción de tutela para reclamar ante los jueces, mediante un procedimiento preferente y sumario, la protección inmediata de sus derechos fundamentales; el juez debe resolver en máximo diez días.", true], ["B", "La acción de cumplimiento.", "La acción de cumplimiento (artículo 87) busca que una autoridad cumpla una ley o un acto administrativo concreto; no es el mecanismo para la protección inmediata de un derecho fundamental vulnerado.", false], ["C", "La acción de grupo.", "La acción de grupo (artículo 88, inciso 2) se refiere a daños ocasionados a un número plural de personas y busca su reparación; aquí se trata de una sola persona que necesita protección inmediata.", false], ["D", "La acción popular.", "La acción popular (artículo 88) protege derechos e intereses colectivos; aquí está en juego el derecho fundamental de una persona concreta.", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "s11-3", "ses": 2, "ind": "Funciones del Congreso", "tt": "", "texto": "En una sesión del Senado, varios congresistas citaron al ministro de Transporte para que explicara por qué se retrasaron las obras de una vía nacional. Al final del debate, los senadores dejaron constancia de sus críticas a la gestión del ministerio.", "vis": "", "items": [{"id": "SCC-103", "niv": 1, "cp": "sc_pensamiento_social", "cn": "", "e": "Con esta actuación, el Congreso está ejerciendo su función de", "f": "Constitución Política de 1991, arts. 114 y 119", "vis": "", "o": [["A", "creación de una ley sobre infraestructura de transporte.", "En el caso no se tramita ningún proyecto de ley; solo se pide explicación a un ministro sobre su gestión.", false], ["B", "control fiscal sobre el dinero invertido en la vía.", "La vigilancia de la gestión fiscal corresponde a la Contraloría General de la República (artículo 119), no al Congreso mediante un debate.", false], ["C", "juzgamiento penal del ministro por los retrasos de la obra.", "Un debate de control no es un proceso penal; además, el caso no menciona delitos. Juzgar delitos corresponde a la Rama Judicial.", false], ["D", "control político sobre el gobierno y la administración.", "El artículo 114 asigna al Congreso reformar la Constitución, hacer las leyes y ejercer control político sobre el gobierno y la administración; citar a un ministro para que rinda cuentas es control político.", true]]}]}, {"comp": "sociales_ciudadanas", "sim": "s11-3", "ses": 2, "ind": "Órganos de control: Contraloría", "tt": "", "texto": "Una auditoría encontró que un ministerio pagó por unos computadores un precio muy superior al del mercado, lo que causó una pérdida de dinero público.", "vis": "", "items": [{"id": "SCC-104", "niv": 1, "cp": "sc_pensamiento_social", "cn": "", "e": "¿Qué entidad tiene a su cargo, según la Constitución, la vigilancia de la gestión fiscal en este caso?", "f": "Constitución Política de 1991, arts. 117, 119, 120, 241 y 282", "vis": "", "o": [["A", "La Defensoría del Pueblo.", "La Defensoría vela por la promoción, el ejercicio y la divulgación de los derechos humanos (artículo 282); no vigila el manejo de los recursos públicos.", false], ["B", "La Corte Constitucional.", "A la Corte Constitucional se le confía la guarda de la integridad y supremacía de la Constitución (artículo 241), no el control fiscal.", false], ["C", "La Contraloría General de la República.", "Según los artículos 117 y 119, la Contraloría es un órgano de control y tiene a su cargo la vigilancia de la gestión fiscal y el control de resultado de la administración.", true], ["D", "La Registraduría Nacional del Estado Civil.", "La Registraduría hace parte de la organización electoral, encargada de las elecciones y de la identidad de las personas (artículo 120).", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "s11-3", "ses": 2, "ind": "Entidades territoriales", "tt": "", "texto": "Un estudiante elabora un mapa conceptual sobre la organización territorial de Colombia y quiere incluir únicamente las entidades territoriales que enumera el artículo 286 de la Constitución.", "vis": "", "items": [{"id": "SCC-105", "niv": 2, "cp": "sc_pensamiento_social", "cn": "", "e": "¿Cuál de las siguientes listas es correcta?", "f": "Constitución Política de 1991, arts. 286 y 329; Ley 70 de 1993, art. 5", "vis": "", "o": [["A", "Departamentos, distritos, municipios y territorios indígenas.", "Es la enumeración del artículo 286: «Son entidades territoriales los departamentos, los distritos, los municipios y los territorios indígenas».", true], ["B", "Departamentos, municipios, resguardos y consejos comunitarios.", "El resguardo es una forma de propiedad colectiva (artículo 329) y el consejo comunitario es la forma de administración interna de las tierras de comunidades negras (Ley 70 de 1993, art. 5); ninguno figura en el artículo 286.", false], ["C", "Departamentos, municipios, corregimientos y veredas.", "Corregimientos y veredas son divisiones internas de los municipios, no entidades territoriales; además falta incluir distritos y territorios indígenas.", false], ["D", "La Nación, las gobernaciones, las alcaldías y los concejos.", "Gobernaciones, alcaldías y concejos son órganos o autoridades de las entidades territoriales, no entidades en sí mismas; la Nación no aparece en el artículo 286.", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "s11-3", "ses": 2, "ind": "Lenguas de los grupos étnicos", "tt": "", "texto": "En una institución educativa ubicada en un resguardo wayuu de La Guajira, las clases se dictan en wayuunaiki y en castellano. Un funcionario que visita el colegio opina que debería enseñarse solo en castellano «porque es el idioma oficial del país».", "vis": "", "items": [{"id": "SCC-106", "niv": 1, "cp": "sc_pensamiento_social", "cn": "", "e": "De acuerdo con la Constitución, la opinión del funcionario es", "f": "Constitución Política de 1991, arts. 7 y 10", "vis": "", "o": [["A", "acertada, porque la enseñanza en lenguas indígenas solo se permite en los cursos de primaria.", "No existe esa restricción; el artículo 10 ordena que la enseñanza sea bilingüe en las comunidades con tradiciones lingüísticas propias, sin limitarla a un nivel.", false], ["B", "equivocada, porque en los resguardos el wayuunaiki debe reemplazar al castellano como única lengua de enseñanza.", "El artículo 10 habla de enseñanza bilingüe, no de reemplazar el castellano por la lengua propia.", false], ["C", "acertada, porque el artículo 10 establece el castellano como idioma oficial y la educación pública debe impartirse en él.", "Lee solo la primera frase del artículo 10 y omite que las lenguas de los grupos étnicos son también oficiales en sus territorios y que allí la enseñanza será bilingüe.", false], ["D", "equivocada, porque las lenguas de los grupos étnicos también son oficiales en sus territorios.", "El artículo 10 dice que el castellano es el idioma oficial, pero que las lenguas y dialectos de los grupos étnicos también son oficiales en sus territorios y que la enseñanza en comunidades con tradiciones lingüísticas propias será bilingüe.", true]]}]}, {"comp": "sociales_ciudadanas", "sim": "s11-3", "ses": 2, "ind": "Prejuicios sobre la población rural", "tt": "", "texto": "En una red social, un usuario comentó una noticia sobre la baja participación electoral en una vereda: «Es normal que allá casi nadie vote: la gente del campo no entiende de política y le da igual quién gobierne».", "vis": "", "items": [{"id": "SCC-115", "niv": 1, "cp": "sc_perspectivas", "cn": "", "e": "¿Qué debilidad tiene el comentario como explicación de la baja participación electoral?", "f": "Análisis de argumentos y generalizaciones", "vis": "", "o": [["A", "Confunde la abstención con el voto en blanco, que también es una forma de participar.", "El comentario no habla del voto en blanco; se refiere a que «casi nadie vote», es decir, a la abstención.", false], ["B", "Culpa a las autoridades por no instalar puestos de votación en la vereda.", "El comentario no menciona a las autoridades ni los puestos; atribuye la abstención a los votantes.", false], ["C", "Atribuye a toda la población rural un rasgo negativo y no considera otras causas posibles.", "Generaliza sin evidencia a «la gente del campo» e ignora explicaciones como la distancia a los puestos de votación o la falta de transporte.", true], ["D", "Explica bien la causa, aunque debería apoyarse en cifras de la Registraduría.", "No explica bien la causa: la atribuye a una supuesta incapacidad de los votantes sin ninguna evidencia, y añadir cifras de votación no probaría esa causa.", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "s11-3", "ses": 2, "ind": "Una crónica medieval", "tt": "", "texto": "Fragmento (ficticio) de una crónica escrita hacia 1360 por un monje que vivía en un monasterio protegido por un gran señor feudal:\n\n«Los campesinos, olvidando el orden que Dios estableció, se levantaron contra sus señores, quemaron graneros y se negaron a pagar los tributos. Fueron castigados como merecían, y la paz volvió a los campos».", "vis": "", "items": [{"id": "SCC-118", "niv": 3, "cp": "sc_perspectivas", "cn": "", "e": "¿Qué debe tener en cuenta un historiador al usar esta crónica para estudiar la revuelta?", "
