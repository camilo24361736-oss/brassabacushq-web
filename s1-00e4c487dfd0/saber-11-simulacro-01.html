<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulacro 1 · Saber 11</title>
<style>
:root{--bg:#f3f6f8;--card:#fff;--ink:#1d2433;--mute:#5a6478;--line:#d6dee4;--pri:#0b4f6c;--pri2:#1f7aa3;--ok:#0d6b3a;--okbg:#e6f4ec;--no:#9b1c1c;--nobg:#fbeaea;--sel:#e4f1f8}
@media (prefers-color-scheme: dark){:root{--bg:#0f1418;--card:#172026;--ink:#e3eaee;--mute:#97a6b0;--line:#2c3a44;--pri:#7cc3e6;--pri2:#a3d6ef;--ok:#7fd3a3;--okbg:#16301f;--no:#f2a3a3;--nobg:#3a1c1c;--sel:#1d3442}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overflow-wrap:anywhere}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px}
.hwrap{max-width:860px;margin:0 auto;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;justify-content:space-between}
h1{font-size:17px;margin:0;color:var(--pri)}
h2{color:var(--pri)}
.stat{font-size:14px;color:var(--mute)}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--pri)}
.timer.low{color:var(--no)}
main{max-width:860px;margin:0 auto;padding:16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin:0 0 16px}
.mod{background:var(--pri);color:var(--card);border-radius:10px;padding:10px 14px;margin:28px 0 6px;font-weight:700;font-size:18px}
.inst{font-size:13px;font-weight:700;color:var(--pri);text-transform:uppercase;letter-spacing:.03em;margin:18px 0 4px}
.caso{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--pri);border-radius:10px;padding:14px 16px;margin:10px 0}
.tag{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--pri);font-weight:700}
.caso p{margin:6px 0 0;white-space:pre-line}
.item{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0}
.enun{margin:0 0 8px;white-space:pre-line}
.n{font-weight:700;color:var(--pri)}
.niv{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-right:4px;white-space:nowrap}
.op{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:6px 0;cursor:pointer;background:transparent;width:100%;text-align:left;color:inherit;font:inherit}
.ops8{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.ops8 .op{margin:0}
.op:hover{border-color:var(--pri2)}
.op .l{font-weight:700;min-width:20px}
.op.sel{background:var(--sel);border-color:var(--pri2)}
.op.ok{background:var(--okbg);border-color:var(--ok)}
.op.no{background:var(--nobg);border-color:var(--no)}
.op[disabled]{cursor:default}
.just{font-size:14px;margin:8px 0 0;padding:8px 10px;border-top:1px dashed var(--line)}
.just div{margin:4px 0}
.just .okt{color:var(--ok);font-weight:700}
.just .not{color:var(--no);font-weight:700}
.src{font-size:13px;color:var(--mute);margin-top:6px}
button.btn{background:var(--pri);color:var(--card);border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer}
button.btn.sec{background:transparent;color:var(--pri);border:1px solid var(--pri)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
select{font:inherit;padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);max-width:100%}
table{border-collapse:collapse;width:100%;font-size:15px}
td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.sub td{font-size:13px;color:var(--mute);padding-left:22px}
.vt{width:auto;max-width:100%;margin:10px 0;font-size:14px;display:block;overflow-x:auto}
.vt caption{text-align:left;font-weight:700;padding-bottom:4px}
.vt th,.vt td{border:1px solid var(--line);padding:4px 8px}
.vt th{background:var(--sel)}
.vnota{font-size:12px;color:var(--mute)}
.vfig{margin:10px 0}
.vfig svg{width:100%;max-width:560px;height:auto;border-radius:6px;border:1px solid var(--line);background:#fff}
.big{font-size:40px;font-weight:800;color:var(--pri);line-height:1.1}
.aviso{font-size:13px;color:var(--mute)}
.hide{display:none !important}
.res-ok{color:var(--ok);font-weight:700}.res-no{color:var(--no);font-weight:700}
textarea{width:100%;min-height:320px;font:inherit;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);resize:vertical}
.chk label{display:flex;gap:8px;align-items:flex-start;margin:6px 0;font-size:15px}
.chk input{margin-top:4px;width:18px;height:18px;flex:none}
.modelo{white-space:pre-line;background:var(--bg);border-radius:8px;padding:10px 12px;margin:6px 0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal .panel{max-width:420px}
.nav{padding:6px 0;display:flex;gap:6px;flex-wrap:wrap}
.nav a{font-size:13px;color:var(--pri);border:1px solid var(--line);border-radius:999px;padding:3px 10px;text-decoration:none;background:var(--card)}
footer{max-width:860px;margin:0 auto;padding:8px 16px 40px;font-size:12px;color:var(--mute)}
</style>
</head>
<body>
<header><div class="hwrap"><h1 id="tit"></h1><div class="row stat"><span id="prog"></span><span id="timer" class="timer"></span></div></div></header>
<main id="main"></main>
<div id="modal" class="modal hide"><div class="panel"><p id="mtxt"></p><div class="row"><button class="btn" id="msi">Sí, calificar</button><button class="btn sec" id="mno">Seguir respondiendo</button></div></div></div>
<footer>Material de preparación independiente. No está afiliado al Icfes ni a ninguna entidad pública. Preguntas y textos originales; no son preguntas reales del examen. Soporte: brassabacuscontact@gmail.com</footer>
<script>
const DATA = [{"comp": "matematicas", "sim": "s11-1", "ses": 1, "ind": "Ventas diarias de una tienda de barrio", "tt": "", "texto": "Doña Rosa registró las ventas de su tienda durante una semana. La gráfica muestra el valor vendido cada día, en miles de pesos.", "vis": "<div class=\"vfig\"><svg class=\"vg\" viewBox=\"0 0 560 320\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Gráfica 1. Ventas diarias de la tienda\" font-family=\"Arial, sans-serif\" font-size=\"12\"><rect width=\"560\" height=\"320\" fill=\"#ffffff\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"13\" fill=\"#1d2433\">Gráfica 1. Ventas diarias de la tienda<\/text><line x1=\"60\" y1=\"258.0\" x2=\"540\" y2=\"258.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"262.0\" text-anchor=\"end\" fill=\"#3a4356\">0<\/text><line x1=\"60\" y1=\"202.5\" x2=\"540\" y2=\"202.5\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"206.5\" text-anchor=\"end\" fill=\"#3a4356\">200<\/text><line x1=\"60\" y1=\"147.0\" x2=\"540\" y2=\"147.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"151.0\" text-anchor=\"end\" fill=\"#3a4356\">400<\/text><line x1=\"60\" y1=\"91.5\" x2=\"540\" y2=\"91.5\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"95.5\" text-anchor=\"end\" fill=\"#3a4356\">600<\/text><line x1=\"60\" y1=\"36.0\" x2=\"540\" y2=\"36.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"40.0\" text-anchor=\"end\" fill=\"#3a4356\">800<\/text><line x1=\"60\" y1=\"258\" x2=\"540\" y2=\"258\" stroke=\"#3a4356\"/><line x1=\"60\" y1=\"258\" x2=\"60\" y2=\"36\" stroke=\"#3a4356\"/><text transform=\"translate(14,147.0) rotate(-90)\" text-anchor=\"middle\" fill=\"#3a4356\">Ventas (miles de pesos)<\/text><text x=\"300.0\" y=\"312\" text-anchor=\"middle\" fill=\"#3a4356\">Día<\/text><text x=\"100.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Lun<\/text><text x=\"180.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Mar<\/text><text x=\"260.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Mié<\/text><text x=\"340.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Jue<\/text><text x=\"420.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Vie<\/text><text x=\"500.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Sáb<\/text><rect x=\"72.0\" y=\"169.2\" width=\"56.0\" height=\"88.8\" fill=\"#1660a8\"/><text x=\"100.0\" y=\"165.2\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">320<\/text><rect x=\"152.0\" y=\"180.3\" width=\"56.0\" height=\"77.7\" fill=\"#1660a8\"/><text x=\"180.0\" y=\"176.3\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">280<\/text><rect x=\"232.0\" y=\"160.9\" width=\"56.0\" height=\"97.1\" fill=\"#1660a8\"/><text x=\"260.0\" y=\"156.9\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">350<\/text><rect x=\"312.0\" y=\"144.2\" width=\"56.0\" height=\"113.8\" fill=\"#1660a8\"/><text x=\"340.0\" y=\"140.2\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">410<\/text><rect x=\"392.0\" y=\"113.7\" width=\"56.0\" height=\"144.3\" fill=\"#1660a8\"/><text x=\"420.0\" y=\"109.7\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">520<\/text><rect x=\"472.0\" y=\"88.7\" width=\"56.0\" height=\"169.3\" fill=\"#1660a8\"/><text x=\"500.0\" y=\"84.7\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">610<\/text><\/svg><\/div>", "items": [{"id": "MTA-101", "niv": 1, "cp": "mt_interpretacion", "cn": "", "e": "¿Entre qué par de días consecutivos se presentó el mayor aumento en las ventas?", "f": "Lectura de la gráfica", "vis": "", "o": [["A", "Del martes al miércoles.", "Del martes al miércoles las ventas subieron de 280 a 350 mil pesos, un aumento de solo 70 mil.", false], ["B", "Del jueves al viernes.", "Del jueves al viernes las ventas pasaron de 410 a 520 mil pesos: un aumento de 110 mil, el mayor entre días consecutivos (los demás aumentos son 70, 60 y 90 mil).", true], ["C", "Del viernes al sábado.", "El sábado tiene la barra más alta, pero el aumento respecto al viernes fue de 610 − 520 = 90 mil pesos, menor que 110 mil.", false], ["D", "Del miércoles al jueves.", "Del miércoles al jueves el aumento fue de 410 − 350 = 60 mil pesos, menor que el de otros días.", false]]}, {"id": "MTA-102", "niv": 2, "cp": "mt_formulacion", "cn": "", "e": "¿Cuál fue el promedio de ventas diarias de la tienda en esa semana?", "f": "Cálculo propio", "vis": "", "o": [["A", "$ 415.000.", "El total vendido es 320 + 280 + 350 + 410 + 520 + 610 = 2.490 mil pesos; al dividir entre los 6 días se obtiene 415 mil pesos.", true], ["B", "$ 445.000.", "Es el punto medio entre el valor mínimo (280) y el máximo (610); el promedio debe usar todos los datos.", false], ["C", "$ 498.000.", "Se dividió el total, 2.490 mil pesos, entre 5 en vez de entre los 6 días registrados.", false], ["D", "$ 2.490.000.", "Es el total vendido en la semana; falta dividirlo entre el número de días.", false]]}, {"id": "MTA-103", "niv": 2, "cp": "mt_argumentacion", "cn": "", "e": "Doña Rosa afirma que el sábado vendió más del doble de lo que vendió el lunes. ¿Es correcta su afirmación?", "f": "Cálculo propio", "vis": "", "o": [["A", "Sí, porque el sábado vendió 610 − 320 = $ 290.000 más que el lunes, casi lo mismo que el lunes.", "Una diferencia no indica cuántas veces cabe un valor en otro: para ser el doble, el sábado debería superar al lunes en al menos 320 mil pesos.", false], ["B", "Sí, porque el sábado vendió 610 ÷ 280 ≈ 2,2 veces lo vendido el martes.", "El cociente está bien calculado, pero compara el sábado con el martes; la afirmación es sobre el lunes (610 ÷ 320 ≈ 1,9).", false], ["C", "No, porque el sábado vendió solo 610 − 520 = $ 90.000 más que el viernes.", "El dato es cierto, pero compara el sábado con el viernes; no dice nada sobre la relación entre sábado y lunes.", false], ["D", "No, porque el doble de lo del lunes es 2 × 320 = $ 640.000, más que $ 610.000.", "El lunes se vendieron 320 mil pesos; el doble es 640 mil, y el sábado se vendieron 610 mil, que es menos que el doble.", true]]}]}, {"comp": "matematicas", "sim": "s11-1", "ses": 1, "ind": "Deportes que practican los estudiantes", "tt": "", "texto": "En un colegio se preguntó a 120 estudiantes de grado 11 qué deportes practican. Los resultados fueron:\n\n• 70 estudiantes practican fútbol.\n• 50 estudiantes practican baloncesto.\n• 20 estudiantes no practican ninguno de los dos deportes.", "vis": "", "items": [{"id": "MTA-109", "niv": 2, "cp": "mt_formulacion", "cn": "", "e": "¿Cuántos de los estudiantes encuestados practican ambos deportes?", "f": "Unión e intersección de conjuntos", "vis": "", "o": [["A", "20 estudiantes.", "Practican al menos un deporte 120 − 20 = 100 estudiantes. Como 70 + 50 = 120, hay 120 − 100 = 20 estudiantes contados dos veces: son los que practican ambos.", true], ["B", "30 estudiantes.", "Es 100 − 70, el número de estudiantes que practican solo baloncesto, no ambos deportes.", false], ["C", "50 estudiantes.", "Es 120 − 70: descuenta a quienes practican fútbol, pero no considera a quienes no practican ningún deporte.", false], ["D", "100 estudiantes.", "Es el número de estudiantes que practican al menos uno de los dos deportes.", false]]}, {"id": "MTA-110", "niv": 2, "cp": "mt_interpretacion", "cn": "", "e": "Se escoge al azar uno de los estudiantes que practican fútbol. ¿Cuál es la probabilidad de que también practique baloncesto?", "f": "Probabilidad condicional", "vis": "", "o": [["A", "1/6.", "Divide los 20 que practican ambos deportes entre los 120 encuestados; la elección se hace solo entre los 70 futbolistas.", false], ["B", "1/5.", "Divide 20 entre los 100 que practican al menos un deporte; el grupo del que se escoge son los 70 que practican fútbol.", false], ["C", "2/7.", "Entre los 70 que practican fútbol, 20 practican también baloncesto (70 + 50 − 100 = 20): 20/70 = 2/7.", true], ["D", "2/5.", "Divide 20 entre los 50 que practican baloncesto; esa sería la probabilidad si se escogiera entre los basquetbolistas.", false]]}]}, {"comp": "matematicas", "sim": "s11-1", "ses": 1, "ind": "Elección de un comité", "tt": "", "texto": "La junta de acción comunal de un barrio tiene 8 integrantes. Para organizar un bazar deben elegir un comité de 3 de ellos.", "vis": "", "items": [{"id": "MTA-111", "niv": 3, "cp": "mt_formulacion", "cn": "", "e": "Si en el comité todos tienen la misma función, ¿cuántos comités diferentes se pueden formar?", "f": "Combinaciones", "vis": "", "o": [["A", "24.", "Multiplica 8 × 3; no corresponde a ningún principio de conteo para escoger 3 de 8 personas.", false], ["B", "56.", "Como el orden no importa, es una combinación: C(8, 3) = 8 × 7 × 6 ÷ (3 × 2 × 1) = 336 ÷ 6 = 56.", true], ["C", "336.", "Es 8 × 7 × 6, que cuenta grupos ordenados; cada comité se estaría contando 6 veces (las 3! formas de ordenar a sus integrantes).", false], ["D", "512.", "Es 8³, que permite escoger a la misma persona varias veces; en un comité cada integrante se elige una sola vez.", false]]}, {"id": "MTA-112", "niv": 3, "cp": "mt_argumentacion", "cn": "", "e": "Andrés afirma que, si el comité tuviera presidente, secretario y tesorero, el número de comités posibles se multiplicaría por 6. ¿Es correcta su afirmación?", "f": "Permutaciones y combinaciones", "vis": "", "o": [["A", "No, porque al haber tres cargos el número de comités posibles solo se triplica.", "Tres cargos distintos pueden asignarse a tres personas de 3 × 2 × 1 = 6 formas, no de 3.", false], ["B", "Sí, porque hay 3 integrantes y 3 cargos, y 3 + 3 = 6 formas de asignarlos.", "El resultado 6 coincide por casualidad, pero el razonamiento es erróneo: las asignaciones se cuentan multiplicando, 3 × 2 × 1 = 3! = 6, no sumando integrantes y cargos.", false], ["C", "Sí, porque cada grupo de tres personas puede repartirse los tres cargos de 3! = 6 maneras distintas.", "Con cargos importa el orden: hay 8 × 7 × 6 = 336 posibilidades, y 336 = 56 × 6, porque cada uno de los 56 grupos admite 6 asignaciones de cargos.", true], ["D", "No, porque los cargos no cambian quiénes integran el comité, así que el número de posibilidades es el mismo.", "Aunque las personas sean las mismas, cambiar quién ocupa cada cargo produce comités distintos, por lo que el conteo aumenta.", false]]}]}, {"comp": "matematicas", "sim": "s11-1", "ses": 1, "ind": "Altura de un balón lanzado hacia arriba", "tt": "", "texto": "En una clase de física, la altura h, en metros, de un balón lanzado verticalmente hacia arriba desde el suelo está dada por h(t) = −5t² + 20t, donde t es el tiempo en segundos. La gráfica muestra algunos valores.", "vis": "<div class=\"vfig\"><svg class=\"vg\" viewBox=\"0 0 560 320\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Gráfica 2. Altura del balón\" font-family=\"Arial, sans-serif\" font-size=\"12\"><rect width=\"560\" height=\"320\" fill=\"#ffffff\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"13\" fill=\"#1d2433\">Gráfica 2. Altura del balón<\/text><line x1=\"60\" y1=\"258.0\" x2=\"540\" y2=\"258.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"262.0\" text-anchor=\"end\" fill=\"#3a4356\">0<\/text><line x1=\"60\" y1=\"202.5\" x2=\"540\" y2=\"202.5\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"206.5\" text-anchor=\"end\" fill=\"#3a4356\">5<\/text><line x1=\"60\" y1=\"147.0\" x2=\"540\" y2=\"147.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"151.0\" text-anchor=\"end\" fill=\"#3a4356\">10<\/text><line x1=\"60\" y1=\"91.5\" x2=\"540\" y2=\"91.5\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"95.5\" text-anchor=\"end\" fill=\"#3a4356\">15<\/text><line x1=\"60\" y1=\"36.0\" x2=\"540\" y2=\"36.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"40.0\" text-anchor=\"end\" fill=\"#3a4356\">20<\/text><line x1=\"60\" y1=\"258\" x2=\"540\" y2=\"258\" stroke=\"#3a4356\"/><line x1=\"60\" y1=\"258\" x2=\"60\" y2=\"36\" stroke=\"#3a4356\"/><text transform=\"translate(14,147.0) rotate(-90)\" text-anchor=\"middle\" fill=\"#3a4356\">Altura (m)<\/text><text x=\"300.0\" y=\"312\" text-anchor=\"middle\" fill=\"#3a4356\">Tiempo (s)<\/text><text x=\"108.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">0<\/text><text x=\"204.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">1<\/text><text x=\"300.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">2<\/text><text x=\"396.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">3<\/text><text x=\"492.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">4<\/text><polyline fill=\"none\" stroke=\"#1660a8\" stroke-width=\"2.5\" points=\"108.0,258.0 204.0,91.5 300.0,36.0 396.0,91.5 492.0,258.0\"/><circle cx=\"108.0\" cy=\"258.0\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"108.0\" y=\"250.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">0<\/text><circle cx=\"204.0\" cy=\"91.5\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"204.0\" y=\"83.5\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">15<\/text><circle cx=\"300.0\" cy=\"36.0\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"300.0\" y=\"28.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">20<\/text><circle cx=\"396.0\" cy=\"91.5\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"396.0\" y=\"83.5\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">15<\/text><circle cx=\"492.0\" cy=\"258.0\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"492.0\" y=\"250.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">0<\/text><\/svg><\/div>", "items": [{"id": "MTA-115", "niv": 1, "cp": "mt_interpretacion", "cn": "", "e": "¿En qué intervalo de tiempo la altura del balón aumenta?", "f": "Lectura de la gráfica", "vis": "", "o": [["A", "Entre 1 s y 3 s.", "Entre 1 s y 3 s la altura primero sube y luego baja (15 m, 20 m, 15 m); no aumenta en todo el intervalo.", false], ["B", "Entre 2 s y 4 s.", "En ese intervalo la altura baja de 20 m a 0 m: el balón está cayendo.", false], ["C", "Entre 0 s y 4 s.", "Incluye la bajada; la altura solo aumenta hasta el punto más alto, en t = 2 s.", false], ["D", "Entre 0 s y 2 s.", "La gráfica sube de 0 m a 20 m entre t = 0 s y t = 2 s; después de 2 s la altura disminuye.", true]]}, {"id": "MTA-116", "niv": 2, "cp": "mt_formulacion", "cn": "", "e": "¿A qué altura se encuentra el balón 0,5 segundos después del lanzamiento?", "f": "Evaluación de una función cuadrática", "vis": "", "o": [["A", "7,5 m.", "Multiplica −5 por 0,5 sin elevar al cuadrado: −5 × 0,5 + 10 = 7,5.", false], ["B", "8,75 m.", "h(0,5) = −5 × 0,25 + 20 × 0,5 = −1,25 + 10 = 8,75 m.", true], ["C", "10 m.", "Solo calcula 20 × 0,5 y olvida el término −5t².", false], ["D", "11,25 m.", "Suma el término cuadrático en lugar de restarlo: 1,25 + 10.", false]]}]}, {"comp": "matematicas", "sim": "s11-1", "ses": 1, "ind": "Escala de un mapa municipal", "tt": "", "texto": "Un mapa turístico de un municipio está dibujado a escala 1 : 50.000. En el mapa, la distancia en línea recta entre la plaza principal y el embalse es de 7,4 cm.", "vis": "", "items": [{"id": "MTA-117", "niv": 1, "cp": "mt_formulacion", "cn": "", "e": "¿Cuál es la distancia real en línea recta entre la plaza y el embalse?", "f": "Escalas", "vis": "", "o": [["A", "0,37 km.", "Al pasar de centímetros a kilómetros divide entre 1.000.000 en lugar de entre 100.000.", false], ["B", "3,7 km.", "7,4 cm × 50.000 = 370.000 cm; como 1 km = 100.000 cm, la distancia es 3,7 km.", true], ["C", "37 km.", "Divide 370.000 cm entre 10.000; 1 km tiene 100.000 cm.", false], ["D", "370 km.", "Divide entre 1.000, como si los 370.000 estuvieran en metros y no en centímetros.", false]]}, {"id": "MTA-118", "niv": 1, "cp": "mt_interpretacion", "cn": "", "e": "¿Qué significa la escala 1 : 50.000 de este mapa?", "f": "Escalas", "vis": "", "o": [["A", "Que 1 cm en el mapa equivale a 50 km en la realidad.", "50.000 cm son 500 m, no 50 km (50 km serían 5.000.000 cm).", false], ["B", "Que 50.000 cm del mapa equivalen a 1 cm en la realidad.", "Invierte la escala: el primer número corresponde al mapa y el segundo a la realidad.", false], ["C", "Que 1 cm en el mapa equivale a 500 m en la realidad.", "1 cm del mapa representa 50.000 cm reales, y 50.000 cm = 500 m.", true], ["D", "Que 1 cm en el mapa equivale a 5 km en la realidad.", "5 km son 500.000 cm, diez veces más de lo que indica la escala.", false]]}]}, {"comp": "matematicas", "sim": "s11-1", "ses": 1, "ind": "Altura de un árbol a partir de su sombra", "tt": "", "texto": "Para estimar la altura de un árbol del parque, unos estudiantes clavaron verticalmente un poste de 2 m. A la misma hora, el poste proyectó una sombra de 1,5 m y el árbol, una sombra de 9 m. El suelo es horizontal.", "vis": "", "items": [{"id": "MTA-121", "niv": 2, "cp": "mt_formulacion", "cn": "", "e": "¿Cuál es la altura del árbol?", "f": "Semejanza de triángulos (teorema de Tales)", "vis": "", "o": [["A", "6,75 m.", "Plantea la proporción invertida: 9 × 1,5 ÷ 2. La razón altura/sombra debe ser la misma para ambos objetos: 2/1,5 = h/9.", false], ["B", "10,5 m.", "Suma la sombra del poste a la sombra del árbol; las medidas de objetos semejantes se relacionan multiplicando por un factor, no sumando.", false], ["C", "12 m.", "Por semejanza de triángulos, 2/1,5 = h/9, de donde h = 9 × 2 ÷ 1,5 = 12 m.", true], ["D", "13,5 m.", "Multiplica la sombra del árbol por la del poste (9 × 1,5); no usa la altura del poste.", false]]}, {"id": "MTA-122", "niv": 3, "cp": "mt_argumentacion", "cn": "", "e": "¿Por qué es válido el procedimiento de los estudiantes para hallar la altura del árbol?", "f": "Criterios de semejanza", "vis": "", "o": [["A", "Porque los rayos del sol llegan casi paralelos y así los dos triángulos son semejantes.", "Ambos triángulos tienen un ángulo recto (objeto vertical sobre suelo horizontal) y el mismo ángulo de inclinación de los rayos; por eso son semejantes y sus lados son proporcionales.", true], ["B", "Porque en los dos objetos la altura supera a la sombra en la misma cantidad: 2 − 1,5 = 0,5 m.", "No es así: en el árbol la diferencia es 12 − 9 = 3 m. Lo que se conserva es la razón altura ÷ sombra, no la diferencia.", false], ["C", "Porque los dos triángulos son congruentes, ya que ambos tienen un ángulo recto de 90°.", "Los triángulos no son congruentes (sus lados son distintos); son semejantes, y un ángulo recto no basta para afirmarlo.", false], ["D", "Porque a la misma hora todos los objetos proyectan sombras de igual longitud, sin importar su altura.", "Las sombras no son iguales (1,5 m y 9 m); lo que se mantiene igual es la razón entre la altura y la sombra.", false]]}]}, {"comp": "matematicas", "sim": "s11-1", "ses": 1, "ind": "Crecimiento de un cultivo de bacterias", "tt": "", "texto": "En un laboratorio se observa un cultivo de bacterias cuya cantidad se duplica cada 3 horas. La tabla muestra algunos registros.", "vis": "<table class=\"vt\"><caption>Tabla 1. Número de bacterias en el cultivo<\/caption><thead><tr><th>Tiempo (horas)<\/th><th>0<\/th><th>3<\/th><th>6<\/th><th>9<\/th><\/tr><\/thead><tbody><tr><td>Número de bacterias<\/td><td>500<\/td><td>1.000<\/td><td>2.000<\/td><td>4.000<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Datos ficticios.<\/div>", "items": [{"id": "MTA-126", "niv": 1, "cp": "mt_interpretacion", "cn": "", "e": "Si el patrón se mantiene, ¿cuántas bacterias habrá a las 12 horas?", "f": "Patrones en tablas", "vis": "", "o": [["A", "4.500.", "Suma la cantidad inicial (500) al último registro; la cantidad no aumenta lo mismo en cada periodo, sino que se duplica.", false], ["B", "5.000.", "Suma 1.000 al último valor como si el crecimiento fuera constante.", false], ["C", "6.000.", "Repite el último aumento (2.000) en vez de duplicar la cantidad; los aumentos también se duplican.", false], ["D", "8.000.", "Cada 3 horas la cantidad se duplica: a las 12 horas habrá 4.000 × 2 = 8.000 bacterias.", true]]}, {"id": "MTA-127", "niv": 3, "cp": "mt_formulacion", "cn": "", "e": "¿Cuál expresión permite calcular el número N de bacterias t horas después del inicio del registro?", "f": "Modelación con funciones exponenciales", "vis": "", "o": [["A", "N = 500 · 2^(t/3).", "Cada 3 horas se multiplica por 2, así que al cabo de t horas se ha duplicado t/3 veces: con t = 3, 6 y 9 da 1.000, 2.000 y 4.000.", true], ["B", "N = 500 · 2^(3t).", "Con t = 3 daría 500 · 2⁹, mucho más que 1.000; el exponente debe contar cuántos periodos de 3 horas han pasado (t ÷ 3).", false], ["C", "N = 500 + (500/3)·t.", "Es un modelo lineal: acierta con t = 3 (1.000), pero con t = 6 da 1.500 en vez de 2.000, porque supone aumentos iguales en tiempos iguales.", false], ["D", "N = 500 · (t/3)².", "Es una función cuadrática: con t = 0 da 0 y no 500, y con t = 9 da 4.500 en vez de 4.000.", false]]}, {"id": "MTA-128", "niv": 3, "cp": "mt_argumentacion", "cn": "", "e": "Sofía razona así: «Si en 9 horas la cantidad se multiplicó por 8, en la mitad de ese tiempo, 4,5 horas, se habrá multiplicado por 4». ¿Es correcto su razonamiento?", "f": "Propiedades de la función exponencial", "vis": "", "o": [["A", "No, porque en 4,5 horas la cantidad se multiplica por 3, valor entre el 2 de las 3 horas y el 4 de las 6 horas.", "Interpola de forma lineal entre los factores 2 y 4; como el crecimiento es exponencial, el factor en 4,5 horas es 2^1,5 ≈ 2,8.", false], ["B", "Sí, porque en la mitad del tiempo el factor también es la mitad: 8 ÷ 2 = 4.", "Eso solo ocurriría si el crecimiento fuera proporcional al tiempo; en el crecimiento exponencial los factores se multiplican, no se reparten.", false], ["C", "Sí, porque a las 6 horas el factor ya es 4, y 4,5 horas es un tiempo cercano a 6.", "El factor 4 corresponde exactamente a 6 horas; a las 4,5 horas la cantidad todavía no se ha cuadruplicado.", false], ["D", "No, porque en 4,5 horas la cantidad se multiplica por cerca de 2,8, no por 4.", "En 4,5 horas hay 1,5 periodos de duplicación, de modo que el factor es 2^1,5 ≈ 2,83; como 2,83 × 2,83 ≈ 8, se recupera el factor de 9 horas.", true]]}]}, {"comp": "matematicas", "sim": "s11-1", "ses": 1, "ind": "Plano de un parque en coordenadas", "tt": "", "texto": "En el plano cartesiano de un parque, cada unidad equivale a 10 m. La entrada está en el punto A(1, 2), la fuente en B(7, 2) y el quiosco en C(7, 10).", "vis": "", "items": [{"id": "MTA-129", "niv": 2, "cp": "mt_formulacion", "cn": "", "e": "¿Cuál es la distancia en línea recta entre la entrada y el quiosco?", "f": "Distancia entre puntos (teorema de Pitágoras)", "vis": "", "o": [["A", "60 m.", "Solo considera la diferencia horizontal (7 − 1 = 6 unidades); falta la diferencia vertical.", false], ["B", "70 m.", "Promedia las diferencias (6 + 8) ÷ 2 = 7 unidades; la distancia se calcula con el teorema de Pitágoras.", false], ["C", "80 m.", "Solo considera la diferencia vertical (10 − 2 = 8 unidades); falta la diferencia horizontal.", false], ["D", "100 m.", "Las diferencias son 6 y 8 unidades; por Pitágoras, √(6² + 8²) = √100 = 10 unidades, que equivalen a 100 m.", true]]}, {"id": "MTA-130", "niv": 2, "cp": "mt_interpretacion", "cn": "", "e": "Se quiere instalar una banca exactamente en la mitad del camino recto entre la entrada y el quiosco. ¿En qué punto del plano debe ubicarse?", "f": "Punto medio en el plano cartesiano", "vis": "", "o": [["A", "(6, 8).", "Son las diferencias entre las coordenadas de C y A, no un punto del camino.", false], ["B", "(4, 6).", "El punto medio se obtiene promediando las coordenadas: ((1 + 7) ÷ 2, (2 + 10) ÷ 2) = (4, 6).", true], ["C", "(3, 4).", "Divide entre 2 las diferencias de coordenadas (6 y 8) en lugar de promediar las coordenadas de los extremos.", false], ["D", "(8, 12).", "Suma las coordenadas de A y C pero no divide entre 2.", false]]}]}, {"comp": "matematicas", "sim": "s11-1", "ses": 1, "ind": "Temperatura y altitud", "tt": "", "texto": "Un grupo de estudiantes registró la temperatura promedio de varias poblaciones ubicadas sobre una misma montaña y observó que cambia de manera lineal con la altitud. La tabla resume los datos (ficticios).", "vis": "<table class=\"vt\"><caption>Tabla 2. Temperatura promedio según la altitud<\/caption><thead><tr><th>Altitud (m)<\/th><th>0<\/th><th>1.000<\/th><th>2.000<\/th><th>3.000<\/th><\/tr><\/thead><tbody><tr><td>Temperatura (°C)<\/td><td>28<\/td><td>22<\/td><td>16<\/td><td>10<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Datos ficticios.<\/div>", "items": [{"id": "MTA-143", "niv": 2, "cp": "mt_interpretacion", "cn": "", "e": "¿Cuál es la razón de cambio de la temperatura con respecto a la altitud?", "f": "Razón de cambio", "vis": "", "o": [["A", "Disminuye 18 °C por cada 1.000 m de altitud.", "18 °C es la disminución total entre 0 m y 3.000 m, no por cada 1.000 m.", false], ["B", "Disminuye 6 °C por cada metro de altitud.", "Confunde las unidades: la disminución de 6 °C ocurre cada 1.000 m, no cada metro.", false], ["C", "Disminuye 6 °C por cada 1.000 m de altitud.", "Cada vez que la altitud aumenta 1.000 m, la temperatura baja 6 °C (28 → 22 → 16 → 10).", true], ["D", "Aumenta 6 °C por cada 1.000 m de altitud.", "Lee mal el sentido del cambio: a mayor altitud, menor temperatura.", false]]}, {"id": "MTA-144", "niv": 2, "cp": "mt_formulacion", "cn": "", "e": "¿Cuál es la temperatura promedio esperada en una población ubicada a 2.600 m de altitud?", "f": "Cálculo propio", "vis": "", "o": [["A", "10 °C.", "Es la temperatura a 3.000 m, no a 2.600 m.", false], ["B", "12,4 °C.", "La temperatura baja 0,006 °C por metro: 28 − 0,006 × 2.600 = 28 − 15,6 = 12,4 °C.", true], ["C", "13 °C.", "Toma el punto medio entre 16 °C y 10 °C, que corresponde a 2.500 m, no a 2.600 m.", false], ["D", "15,6 °C.", "Es la disminución de temperatura desde el nivel del mar, no la temperatura a 2.600 m.", false]]}, {"id": "MTA-145", "niv": 3, "cp": "mt_interpretacion", "cn": "", "e": "¿Cuál expresión representa la temperatura T, en °C, en función de la altitud a, en metros?", "f": "Modelación con funciones lineales", "vis": "", "o": [["A", "T = 28 − 0,006a.", "La temperatura inicial (a = 0) es 28 °C y disminuye 6 °C cada 1.000 m, es decir, 0,006 °C por metro; con a = 2.000 da 16 °C.", true], ["B", "T = 28 − 6a.", "Usa una disminución de 6 °C por metro; con a = 1.000 daría −5.972 °C.", false], ["C", "T = 0,006a − 28.", "Con a = 0 daría −28 °C en vez de 28 °C; los signos están invertidos.", false], ["D", "T = 28 − 0,06a.", "Usa 6 °C cada 100 m en lugar de cada 1.000 m; con a = 1.000 daría −32 °C.", false]]}]}, {"comp": "matematicas", "sim": "s11-1", "ses": 1, "ind": "Encuesta sobre el refrigerio escolar", "tt": "", "texto": "Para conocer las preferencias de los 2.400 estudiantes de un colegio sobre el refrigerio, se encuestó a 200 estudiantes escogidos al azar. De ellos, 60 prefirieron fruta picada.", "vis": "", "items": [{"id": "MTA-146", "niv": 2, "cp": "mt_formulacion", "cn": "", "e": "Con base en la encuesta, ¿cuántos estudiantes del colegio se estima que prefieren fruta picada?", "f": "Inferencia a partir de una muestra", "vis": "", "o": [["A", "30.", "Toma el 30 % de la muestra como si fuera un número de estudiantes.", false], ["B", "60.", "Es el número de estudiantes de la muestra; la pregunta pide la estimación para todo el colegio.", false], ["C", "200.", "Es el tamaño de la muestra, no el número estimado de estudiantes que prefieren fruta picada.", false], ["D", "720.", "En la muestra, 60 ÷ 200 = 30 % prefiere fruta picada; el 30 % de 2.400 es 720.", true]]}, {"id": "MTA-147", "niv": 1, "cp": "mt_interpretacion", "cn": "", "e": "En este estudio, ¿cuál es la población y cuál es la muestra?", "f": "Población y muestra", "vis": "", "o": [["A", "La población son los 60 estudiantes que prefieren fruta picada y la muestra, los 200 encuestados.", "La población no puede ser más pequeña que la muestra; además, el estudio busca conocer a todo el colegio.", false], ["B", "La población son los 200 estudiantes encuestados y la muestra, los 60 que prefieren fruta picada.", "Los 200 encuestados son la muestra; los 60 son solo una parte de las respuestas obtenidas.", false], ["C", "La población son los 2.400 estudiantes del colegio y la muestra, los 200 estudiantes encuestados.", "La población es el grupo completo sobre el que se quiere concluir (2.400 estudiantes); la muestra es el subgrupo que se encuestó (200).", true], ["D", "La población son los 200 estudiantes encuestados y la muestra, los 2.400 estudiantes del colegio.", "Invierte los conceptos: la muestra es una parte de la población, no al revés.", false]]}]}, {"comp": "matematicas", "sim": "s11-1", "ses": 1, "ind": "Transformaciones de un triángulo", "tt": "", "texto": "En el plano cartesiano se dibujó el triángulo PQR con vértices P(2, 1), Q(5, 1) y R(5, 4), como muestra la figura.", "vis": "<div class=\"vfig\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 200\" width=\"320\" height=\"200\" font-family=\"Arial, sans-serif\" font-size=\"12\"><rect width=\"320\" height=\"200\" fill=\"#ffffff\"/><line x1=\"28\" y1=\"38\" x2=\"28\" y2=\"170\" stroke=\"#e1e5ec\"/><line x1=\"50\" y1=\"38\" x2=\"50\" y2=\"170\" stroke=\"#e1e5ec\"/><line x1=\"72\" y1=\"38\" x2=\"72\" y2=\"170\" stroke=\"#e1e5ec\"/><line x1=\"94\" y1=\"38\" x2=\"94\" y2=\"170\" stroke=\"#e1e5ec\"/><line x1=\"116\" y1=\"38\" x2=\"116\" y2=\"170\" stroke=\"#e1e5ec\"/><line x1=\"138\" y1=\"38\" x2=\"138\" y2=\"170\" stroke=\"#e1e5ec\"/><line x1=\"160\" y1=\"38\" x2=\"160\" y2=\"170\" stroke=\"#e1e5ec\"/><line x1=\"182\" y1=\"38\" x2=\"182\" y2=\"170\" stroke=\"#e1e5ec\"/><line x1=\"204\" y1=\"38\" x2=\"204\" y2=\"170\" stroke=\"#e1e5ec\"/><line x1=\"226\" y1=\"38\" x2=\"226\" y2=\"170\" stroke=\"#e1e5ec\"/><line x1=\"248\" y1=\"38\" x2=\"248\" y2=\"170\" stroke=\"#e1e5ec\"/><line x1=\"270\" y1=\"38\" x2=\"270\" y2=\"170\" stroke=\"#e1e5ec\"/><line x1=\"292\" y1=\"38\" x2=\"292\" y2=\"170\" stroke=\"#e1e5ec\"/><line x1=\"28\" y1=\"170\" x2=\"292\" y2=\"170\" stroke=\"#e1e5ec\"/><line x1=\"28\" y1=\"148\" x2=\"292\" y2=\"148\" stroke=\"#e1e5ec\"/><line x1=\"28\" y1=\"126\" x2=\"292\" y2=\"126\" stroke=\"#e1e5ec\"/><line x1=\"28\" y1=\"104\" x2=\"292\" y2=\"104\" stroke=\"#e1e5ec\"/><line x1=\"28\" y1=\"82\" x2=\"292\" y2=\"82\" stroke=\"#e1e5ec\"/><line x1=\"28\" y1=\"60\" x2=\"292\" y2=\"60\" stroke=\"#e1e5ec\"/><line x1=\"28\" y1=\"38\" x2=\"292\" y2=\"38\" stroke=\"#e1e5ec\"/><line x1=\"20\" y1=\"170\" x2=\"300\" y2=\"170\" stroke=\"#1d2433\" stroke-width=\"1.5\"/><line x1=\"160\" y1=\"30\" x2=\"160\" y2=\"178\" stroke=\"#1d2433\" stroke-width=\"1.5\"/><text x=\"304\" y=\"174\" fill=\"#1d2433\">x<\/text><text x=\"164\" y=\"30\" fill=\"#1d2433\">y<\/text><text x=\"160\" y=\"190\" text-anchor=\"middle\" fill=\"#1d2433\">0<\/text><text x=\"270\" y=\"190\" text-anchor=\"middle\" fill=\"#1d2433\">5<\/text><text x=\"50\" y=\"190\" text-anchor=\"middle\" fill=\"#1d2433\">−5<\/text><polygon points=\"204,148 270,148 270,82\" fill=\"#dce8f5\" stroke=\"#1660a8\" stroke-width=\"2\"/><text x=\"196\" y=\"144\" text-anchor=\"end\" fill=\"#1d2433\">P<\/text><text x=\"278\" y=\"160\" fill=\"#1d2433\">Q<\/text><text x=\"278\" y=\"80\" fill=\"#1d2433\">R<\/text><\/svg><\/div>", "items": [{"id": "MTA-148", "niv": 1, "cp": "mt_interpretacion", "cn": "", "e": "Se refleja el triángulo PQR respecto al eje y. ¿Cuáles son las coordenadas de R′, la imagen de R?", "f": "Transformaciones en el plano", "vis": "", "o": [["A", "(−5, 4), en el segundo cuadrante.", "Al reflejar respecto al eje y, la coordenada x cambia de signo y la coordenada y se conserva: R(5, 4) → R′(−5, 4).", true], ["B", "(4, 5), en el primer cuadrante.", "Intercambia las coordenadas, lo que corresponde a una reflexión respecto a la recta y = x.", false], ["C", "(5, −4), en el cuarto cuadrante.", "Es la reflexión respecto al eje x, que cambia el signo de la coordenada y.", false], ["D", "(−5, −4), en el tercer cuadrante.", "Cambia el signo de ambas coordenadas, lo que corresponde a una rotación de 180° alrededor del origen.", false]]}, {"id": "MTA-149", "niv": 3, "cp": "mt_interpretacion", "cn": "", "e": "Ahora se rota el triángulo PQR 90° en sentido antihorario alrededor del origen. ¿Cuáles son las coordenadas de Q′, la imagen de Q?", "f": "Transformaciones en el plano", "vis": "", "o": [["A", "(−5, −1), en el tercer cuadrante.", "Corresponde a una rotación de 180°: (x, y) → (−x, −y).", false], ["B", "(−1, 5), en el segundo cuadrante.", "Una rotación de 90° antihoraria alrededor del origen transforma (x, y) en (−y, x): Q(5, 1) → Q′(−1, 5).", true], ["C", "(1, −5), en el cuarto cuadrante.", "Corresponde a una rotación de 90° en sentido horario: (x, y) → (y, −x).", false], ["D", "(−5, 1), en el segundo cuadrante.", "Corresponde a una reflexión respecto al eje y, no a una rotación.", false]]}]}, {"comp": "lectura_critica", "sim": "s11-1", "ses": 1, "ind": "Cuento: la abuela y la estación meteorológica", "tt": "Texto literario", "texto": "La nariz de Teodora (cuento)\n\n(1) El día en que llegó la estación meteorológica a San Isidro del Alto, el alcalde mandó pintar de blanco la cerca del parque y contrató una banda de vientos. La estación era un poste delgado coronado por unas cucharitas que giraban con el viento y una pantalla que, según el técnico, sabía de lluvias más que cualquier cristiano. Mi abuela Teodora la miró desde la puerta de la tienda, se limpió las manos en el delantal y dijo que un aparato sin nariz no podía saber nada del agua.\n\n(2) Durante semanas, la pantalla y mi abuela compitieron sin saberlo. Los cultivadores de café, que secaban el grano en los patios, consultaban primero el poste y después, por si acaso, pasaban por la tienda. La abuela salía, olía el aire como quien revisa una olla, y daba su veredicto: «Hoy no», «Hoy sí, pero tarde», «Hoy recojan antes del almuerzo». El técnico, un muchacho de Medellín llamado Julián, se reía con educación. «Doña Teodora, la ciencia no huele», le decía. Ella le respondía que entonces la ciencia se perdía de lo mejor.\n\n(3) Un jueves de agosto la pantalla anunció cielo despejado durante todo el día. Julián lo leyó en voz alta en el parque, satisfecho. A las diez de la mañana mi abuela salió de la tienda, se quedó quieta un rato largo y luego caminó hasta el patio de los Ospina y empezó, ella sola, a recoger el café en costales. Nadie le preguntó nada: la gente la vio agacharse y la imitó. A las once el cielo seguía limpio y algunos se burlaron. A las once y media cayó un aguacero que hizo correr el agua por las calles como si fueran quebradas.\n\n(4) Esa tarde Julián llegó a la tienda empapado. Traía una libreta. No venía a reírse ni a pedir perdón; venía a preguntar. Quería saber qué olía ella exactamente, a qué hora, desde qué lado venía el olor. Mi abuela, que nunca había explicado nada porque nadie le había preguntado de verdad, se demoró en contestar. Al final dijo que la tierra, antes de la lluvia, huele como pan que todavía no está listo.\n\n(5) Julián lo anotó con la misma seriedad con que anotaba las cifras del poste. Desde entonces, cada mañana, los dos se paran en el parque: él mira la pantalla, ella mira el cielo, y después se consultan en voz baja, como dos médicos frente a un enfermo difícil.", "vis": "", "items": [{"id": "LCA-101", "niv": 1, "cp": "lc_local", "cn": "", "e": "Según el párrafo (3), ¿qué hizo la abuela antes de que empezara a llover?", "f": "Párrafo (3)", "vis": "", "o": [["A", "Advirtió a Julián, en el parque, que la pantalla estaba equivocada.", "El texto no dice que la abuela hablara con Julián ese día; Julián leyó el pronóstico, pero ella no le respondió.", false], ["B", "Pidió a los vecinos que recogieran el café antes del almuerzo.", "El texto aclara que «Nadie le preguntó nada» y que la gente la imitó al verla; ella no pidió nada a nadie.", false], ["C", "Cerró la tienda y se sentó a observar el cielo desde el parque.", "Se dice que se quedó quieta un rato al salir de la tienda, pero no que la cerrara ni que fuera al parque.", false], ["D", "Empezó a recoger en costales el café del patio de los Ospina.", "El párrafo (3) dice que caminó hasta el patio de los Ospina y «empezó, ella sola, a recoger el café en costales».", true]]}, {"id": "LCA-102", "niv": 1, "cp": "lc_local", "cn": "", "e": "En el párrafo (2), la expresión «olía el aire como quien revisa una olla» indica que la abuela olía el aire", "f": "Párrafo (2)", "vis": "", "o": [["A", "con la atención de quien realiza una tarea doméstica que domina.", "La comparación con revisar una olla asocia el gesto a una labor doméstica que se hace con cuidado y experiencia.", true], ["B", "con desconfianza, porque temía que la lluvia dañara el café de los vecinos.", "La comparación no expresa temor ni desconfianza; describe la manera habitual y segura de hacerlo.", false], ["C", "con la intención de burlarse del técnico y de su pantalla.", "Quien se reía era Julián; la comparación no tiene sentido burlesco.", false], ["D", "con prisa, porque tenía que volver a la cocina a terminar el almuerzo.", "El texto no menciona que la abuela estuviera cocinando; la olla es solo el término de la comparación.", false]]}, {"id": "LCA-103", "niv": 2, "cp": "lc_global", "cn": "", "e": "¿Cuál es la función del párrafo (4) dentro del relato?", "f": "Párrafos (2) y (4)", "vis": "", "o": [["A", "Presentar la disculpa formal que Julián le ofrece a la abuela por haberse burlado.", "El texto dice expresamente que Julián no venía «a pedir perdón».", false], ["B", "Explicar con argumentos científicos por qué llovió aunque la pantalla anunciaba sol.", "En el párrafo no hay ninguna explicación científica; solo preguntas de Julián y la respuesta de la abuela.", false], ["C", "Mostrar que Julián pasa de la burla al interés genuino por el saber de la abuela.", "Antes Julián «se reía con educación»; en (4) llega con una libreta «a preguntar» qué olía ella, a qué hora y desde dónde: su actitud cambia.", true], ["D", "Mostrar que la abuela se niega a compartir su conocimiento con el técnico.", "La abuela se demora, pero finalmente contesta y describe el olor de la tierra.", false]]}, {"id": "LCA-104", "niv": 2, "cp": "lc_global", "cn": "", "e": "Del relato se puede inferir que los habitantes de San Isidro del Alto", "f": "Párrafos (2) y (3)", "vis": "", "o": [["A", "veían a Julián como la persona más confiable para decidir cuándo recoger el café.", "El jueves la gente siguió a la abuela y no el pronóstico que Julián leyó en el parque.", false], ["B", "tenían en cuenta el juicio de la abuela, al punto de seguir su ejemplo sin preguntar.", "En (2) consultan a la abuela «por si acaso», y en (3) la gente la ve recoger el café y la imita sin preguntar: le tienen confianza.", true], ["C", "consideraron ridículo lo que hacía la abuela y no la siguieron.", "El texto dice que la gente la vio agacharse «y la imitó»; solo «algunos se burlaron» después.", false], ["D", "rechazaban la estación meteorológica y por eso nunca consultaban lo que anunciaba su pantalla.", "El párrafo (2) dice que los cultivadores consultaban «primero el poste».", false]]}, {"id": "LCA-105", "niv": 3, "cp": "lc_reflexion", "cn": "", "e": "Al final del cuento, el narrador compara a la abuela y a Julián con «dos médicos frente a un enfermo difícil». Con esta comparación sugiere que", "f": "Párrafo (5)", "vis": "", "o": [["A", "la abuela acabó aceptando que la ciencia era superior a su olfato.", "Ella sigue mirando el cielo; no renuncia a su saber ni lo subordina al de Julián.", false], ["B", "el clima del pueblo se volvió tan cambiante que nadie puede predecirlo ya.", "El «enfermo difícil» alude a lo complejo del clima, no a que sea imposible de predecir; la comparación destaca la colaboración.", false], ["C", "los dos saberes se complementan y ninguno basta solo ante un problema complejo.", "Los dos observan cada uno a su manera y luego «se consultan», como colegas que unen criterios ante un caso difícil (el clima).", true], ["D", "Julián dejó la estación de lado para seguir el método de la abuela.", "El texto dice que Julián sigue mirando la pantalla cada mañana.", false]]}]}, {"comp": "lectura_critica", "sim": "s11-1", "ses": 1, "ind": "Poema: el río de la infancia", "tt": "Texto literario", "texto": "Inventario del río\n\nI\nCuando yo era niño, el río tenía nombre de persona:\nle decíamos don Lucas, y nos dejaba\nbañarnos en su espalda los domingos.\nTraía guayabas, sombreros, alguna gallina sorprendida,\ny una voz grave que se oía hasta la escuela.\n\nII\nHoy lo visito y no me reconoce.\nHabla bajito, como los viejos en los hospitales,\ny entre sus piedras guarda lo que le dimos:\nuna llanta, tres botellas, la suela de un zapato\nque tal vez fue mío.\n\nIII\nNo le pido perdón: el perdón es una palabra\ndemasiado corta para un río tan largo.\nMe siento en la orilla y hago su inventario,\ncomo hacen los hijos con las cosas del padre\ncuando ya es tarde para preguntarle\nde dónde sacó tanta paciencia.\n\nIV\nMañana vendrán otros con sus listas,\ncon sus metros y sus frascos de muestras.\nYo solo traigo esto: la memoria de su voz\ny la vergüenza de haberla oído\nsin pensar que alguna vez podía callarse.", "vis": "", "items": [{"id": "LCA-106", "niv": 1, "cp": "lc_local", "cn": "", "e": "En la estrofa II, lo que el río «guarda» entre sus piedras son", "f": "Estrofa II", "vis": "", "o": [["A", "frutos y objetos que el río arrastraba en la época de la infancia.", "Las guayabas y los sombreros aparecen en la estrofa I, como cosas que el río «traía», no que guarda hoy.", false], ["B", "recuerdos que el río conserva con cariño de los niños que se bañaban.", "El poema no presenta esos objetos como recuerdos afectivos, sino como lo que la gente le arrojó.", false], ["C", "muestras que dejaron los investigadores que estudian el agua.", "Los investigadores con frascos aparecen en la estrofa IV y en futuro («vendrán»); no dejaron nada en el río.", false], ["D", "desechos y basura que la gente fue arrojando al río con los años.", "La llanta, las botellas y la suela son basura: «lo que le dimos», es decir, lo que las personas tiraron al río.", true]]}, {"id": "LCA-107", "niv": 2, "cp": "lc_global", "cn": "", "e": "El contraste entre la estrofa I y la estrofa II muestra principalmente", "f": "Estrofas I y II", "vis": "", "o": [["A", "el paso de un río caudaloso y lleno de vida a uno debilitado y contaminado.", "En I el río tiene «voz grave», trae frutos y permite bañarse; en II «habla bajito» y guarda basura.", true], ["B", "el cambio del hablante, que antes temía al río y ahora lo quiere.", "En la estrofa I el hablante no expresa temor: se bañaba en el río los domingos.", false], ["C", "la diferencia entre el río en temporada de lluvias y en temporada seca.", "El poema no menciona estaciones; el cambio se debe al paso de los años y a la contaminación.", false], ["D", "el paso de un río peligroso para los niños a uno seguro y tranquilo.", "El río de la infancia no se presenta como peligroso, y el de hoy no aparece como seguro sino enfermo.", false]]}, {"id": "LCA-108", "niv": 3, "cp": "lc_global", "cn": "", "e": "En la estrofa III, el hablante compara su inventario con el que hacen los hijos con las cosas del padre «cuando ya es tarde para preguntarle». Esta comparación sugiere que", "f": "Estrofa III", "vis": "", "o": [["A", "el río se está muriendo y el hablante no supo valorarlo a tiempo.", "Los hijos hacen inventario cuando el padre ya no puede responder; así, el hablante revisa al río cuando su vida se ha apagado y lamenta no haberlo conocido antes.", true], ["B", "el hablante espera heredar las tierras que rodean la orilla del río.", "La comparación no se refiere a bienes materiales heredados; alude a la pérdida y al arrepentimiento.", false], ["C", "el hablante quiere averiguar quién contaminó el río para denunciarlo.", "El hablante no busca culpables ajenos; incluso reconoce su propia responsabilidad («lo que le dimos», «tal vez fue mío»).", false], ["D", "el río fue para el hablante un padre severo que lo castigaba de niño.", "En la estrofa I el río es generoso y juguetón; nada indica severidad.", false]]}, {"id": "LCA-109", "niv": 2, "cp": "lc_reflexion", "cn": "", "e": "La actitud que predomina en el hablante del poema es de", "f": "Estrofas III y IV", "vis": "", "o": [["A", "esperanza en que los estudios científicos logren salvar el río.", "Los que vienen «con sus metros» aparecen como contraste con su memoria, no como motivo de esperanza.", false], ["B", "nostalgia por el río de la infancia y remordimiento por su deterioro.", "Recuerda con añoranza el río de su infancia y confiesa «la vergüenza» de no haber pensado que podía callarse.", true], ["C", "indiferencia, pues afirma que no le pide perdón al río.", "No pide perdón porque la palabra le parece «demasiado corta» para el daño: es una forma de intensificar la culpa, no de mostrar indiferencia.", false], ["D", "indignación contra las autoridades que no protegieron el río.", "El poema no menciona autoridades; el hablante se incluye entre los responsables.", false]]}, {"id": "LCA-110", "niv": 2, "cp": "lc_reflexion", "cn": "", "e": "Un crítico literario escribió: «En este poema, la naturaleza no es paisaje sino pariente». ¿Qué elemento del poema respalda mejor esta lectura?", "f": "Estrofas I, II y III", "vis": "", "o": [["A", "El río arrastra guayabas, sombreros y una gallina sorprendida.", "Estos detalles describen lo que el río llevaba, pero no lo presentan como pariente.", false], ["B", "El hablante se sienta en la orilla a hacer una lista de objetos.", "El acto de sentarse a mirar no basta por sí mismo para mostrar un vínculo de parentesco; lo que lo establece es la comparación con el padre.", false], ["C", "Unos visitantes llegarán al río con sus metros, sus listas y sus frascos de muestras.", "Esta imagen muestra una relación técnica con el río, opuesta a la relación familiar del hablante.", false], ["D", "El río recibe nombre de persona y se compara con un anciano y con un padre.", "«Don Lucas», «como los viejos en los hospitales» y «las cosas del padre» presentan al río como un familiar, no como un simple paisaje.", true]]}]}, {"comp": "lectura_critica", "sim": "s11-1", "ses": 1, "ind": "Ensayo: Aristóteles, la virtud y el hábito", "tt": "Texto filosófico", "texto": "¿Se aprende a ser bueno?\n\n(1) Solemos pensar que la bondad es un rasgo con el que se nace, como el color de los ojos: hay personas generosas y personas mezquinas, y poco se puede hacer al respecto. Aristóteles, el filósofo griego del siglo IV antes de nuestra era, propuso una idea distinta, que todavía hoy resulta incómoda. Para él, las virtudes del carácter no vienen dadas por la naturaleza ni se adquieren solo con instrucción: se forman con la práctica, así como uno se vuelve constructor construyendo y músico tocando un instrumento.\n\n(2) Esto significa que nadie se vuelve justo leyendo sobre la justicia, del mismo modo que nadie aprende a nadar con un manual. Se llega a ser justo realizando actos justos, una y otra vez, hasta que esos actos dejan de costar esfuerzo y se convierten en una disposición estable. Por eso, sostenía Aristóteles, no es poca cosa acostumbrarse desde joven a obrar de una manera o de otra: los hábitos tempranos pesan muchísimo en lo que llegamos a ser.\n\n(3) Pero ¿qué actos hay que repetir? Aquí aparece su conocida doctrina del término medio. Cada virtud se ubica entre dos vicios, uno por exceso y otro por defecto. La valentía, por ejemplo, está entre la cobardía, que huye de todo peligro, y la temeridad, que se lanza a cualquiera sin medirlo. La generosidad está entre la tacañería y el derroche.\n\n(4) Conviene evitar un malentendido. El término medio no es un promedio aritmético ni una invitación a la tibieza. Si diez porciones de comida son demasiadas y dos son muy pocas, no se sigue que todos deban comer seis: lo adecuado para un atleta no es lo adecuado para un niño. El medio depende de la persona y de las circunstancias, y encontrarlo exige juicio. A veces la respuesta virtuosa es una indignación intensa; lo vicioso sería no sentir nada ante una injusticia grave.\n\n(5) La propuesta tiene una consecuencia exigente: si el carácter se forma con la práctica, somos en buena parte responsables de él. Quien dice «yo soy así» para justificar su mal genio olvida que ese «así» es, en parte, el resultado de muchas pequeñas decisiones. La buena noticia es la misma que la mala: lo que se ha formado con hábitos también puede transformarse con hábitos, aunque nunca de un día para otro.", "vis": "", "items": [{"id": "LCA-111", "niv": 1, "cp": "lc_local", "cn": "", "e": "Según el párrafo (3), el temerario es alguien que", "f": "Párrafo (3)", "vis": "", "o": [["A", "gasta sus propios recursos sin ningún control.", "Eso es el derroche, vicio relacionado con la generosidad, no con la valentía.", false], ["B", "evita toda situación de riesgo por exceso de temor.", "Esa es la descripción de la cobardía, el vicio opuesto por defecto.", false], ["C", "se arriesga ante cualquier amenaza sin evaluarla.", "El texto define la temeridad como el vicio que «se lanza a cualquiera [peligro] sin medirlo»: arriesgarse sin evaluar.", true], ["D", "enfrenta únicamente los riesgos que merecen afrontarse.", "Esa descripción corresponde a la valentía, la virtud situada entre los dos vicios.", false]]}, {"id": "LCA-112", "niv": 2, "cp": "lc_global", "cn": "", "e": "¿Qué función cumple el ejemplo de las porciones de comida en el párrafo (4)?", "f": "Párrafo (4)", "vis": "", "o": [["A", "Aclarar que el término medio no es igual para todos, sino que depende de cada caso.", "El ejemplo muestra que seis porciones (el promedio entre diez y dos) no son lo adecuado para todos: el medio cambia del atleta al niño.", true], ["B", "Demostrar que la moderación al comer es la más importante de las virtudes.", "La comida es solo un ejemplo para explicar el término medio; el texto no jerarquiza las virtudes.", false], ["C", "Mostrar que el término medio se obtiene sumando los dos extremos y dividiendo entre dos.", "Es justamente lo contrario: el texto niega que el medio sea un «promedio aritmético».", false], ["D", "Señalar que los atletas necesitan más virtudes que los niños para vivir bien.", "El ejemplo compara cantidades adecuadas de comida, no la cantidad de virtudes que necesita cada persona.", false]]}, {"id": "LCA-113", "niv": 2, "cp": "lc_global", "cn": "", "e": "De acuerdo con el texto, la relación entre los actos y la virtud es que", "f": "Párrafos (1) y (2)", "vis": "", "o": [["A", "los actos virtuosos se vuelven más difíciles a medida que se repiten.", "Es lo contrario de lo que dice el texto: con la repetición los actos «dejan de costar esfuerzo».", false], ["B", "una virtud con la que se nace es lo que permite realizar actos buenos.", "Esa es la idea común que el autor presenta al inicio para contrastarla con la de Aristóteles.", false], ["C", "los actos virtuosos cuestan esfuerzo al comienzo y luego se vuelven naturales.", "El párrafo (2) dice que se repiten los actos justos «hasta que esos actos dejan de costar esfuerzo y se convierten en una disposición estable».", true], ["D", "conocer bien la definición de una virtud basta para actuar de forma virtuosa.", "El texto dice que «nadie se vuelve justo leyendo sobre la justicia».", false]]}, {"id": "LCA-114", "niv": 3, "cp": "lc_global", "cn": "", "e": "¿Qué relación hay entre el párrafo (3) y el párrafo (4)?", "f": "Párrafos (3) y (4)", "vis": "", "o": [["A", "El (4) ofrece un ejemplo que contradice la doctrina expuesta en el (3).", "El ejemplo de las porciones no contradice la doctrina: la precisa.", false], ["B", "El (4) previene una lectura equivocada de la doctrina que el (3) presenta.", "El (3) expone el término medio entre dos vicios; el (4) empieza «Conviene evitar un malentendido» y aclara que no es un promedio aritmético ni tibieza.", true], ["C", "El (4) expone la postura de otro filósofo, opuesta a la de Aristóteles.", "Todo el texto expone a Aristóteles; el (4) no introduce a otro autor.", false], ["D", "El (4) resume lo dicho en el (3) sin añadir ninguna idea nueva.", "El (4) añade ideas nuevas: el medio depende de la persona y exige juicio.", false]]}, {"id": "LCA-115", "niv": 2, "cp": "lc_reflexion", "cn": "", "e": "Según las ideas expuestas en el texto, ¿cuál de las siguientes personas está mejor encaminada a volverse generosa?", "f": "Párrafos (2) y (3)", "vis": "", "o": [["A", "Una que regala todo su sueldo en un solo día para demostrar su desprendimiento.", "Es un acto aislado y excesivo: se acerca al derroche, uno de los vicios entre los que está la generosidad.", false], ["B", "Una que lee varios tratados sobre la generosidad y memoriza sus definiciones.", "El texto afirma que la virtud no se adquiere «solo con instrucción», del mismo modo que no se aprende a nadar con un manual.", false], ["C", "Una que espera a sentir de manera espontánea el deseo de dar antes de intentarlo.", "Supone que la virtud surge naturalmente; el texto sostiene que se forma practicándola.", false], ["D", "Una que se acostumbra a compartir parte de lo que tiene en su vida diaria.", "Es la única que repite actos generosos ajustados a sus circunstancias, que es como, según el texto, se forma una virtud.", true]]}, {"id": "LCA-116", "niv": 3, "cp": "lc_reflexion", "cn": "", "e": "Alguien afirma: «No puedo evitarlo; tengo mal genio desde niño, así que no se me puede reprochar». Desde la postura del texto, esta afirmación es cuestionable porque", "f": "Párrafos (2), (4) y (5)", "vis": "", "o": [["A", "reprochar a alguien es un exceso y lo virtuoso sería una actitud de tibieza.", "El texto rechaza expresamente que el término medio sea «una invitación a la tibieza».", false], ["B", "supone un carácter fijo, cuando este se forma en buena parte con nuestras decisiones.", "El párrafo (5) dice que quien usa «yo soy así» para justificar su mal genio olvida que ese carácter resulta, en parte, de sus propias decisiones y puede transformarse.", true], ["C", "los hábitos adquiridos en la niñez, según el texto, no influyen en el carácter adulto.", "El texto afirma lo contrario: «los hábitos tempranos pesan muchísimo en lo que llegamos a ser».", false], ["D", "el mal genio no es un vicio para Aristóteles, sino una forma de indignación virtuosa.", "El texto admite que la indignación intensa puede ser virtuosa ante una injusticia grave, pero no dice que el mal genio en general lo sea.", false]]}]}, {"comp": "lectura_critica", "sim": "s11-1", "ses": 1, "ind": "Ensayo: utilitarismo y Kant ante una mentira", "tt": "Texto filosófico", "texto": "¿Puede una mentira ser correcta?\n\n(1) Imaginemos que un amigo nos prestó dinero para pagar una matrícula y, meses después, como no podemos devolvérselo, le decimos que ya se lo consignamos y que debe de ser un error del banco. Ganamos tiempo y evitamos una conversación incómoda. ¿Hicimos mal? Dos tradiciones de la ética moderna responden de maneras distintas, y vale la pena distinguirlas con cuidado.\n\n(2) Para el utilitarismo, cuya formulación clásica se asocia con Jeremy Bentham y John Stuart Mill, una acción es correcta en la medida en que tiende a producir la mayor felicidad para el mayor número de afectados. Lo que importa, entonces, son las consecuencias. Un utilitarista no condena la mentira por ser mentira: la condena si, sumados todos sus efectos, causa más sufrimiento que bienestar. En nuestro ejemplo, tendría en cuenta la angustia del amigo que busca un dinero que no existe, el daño a la confianza entre ambos y el riesgo de que, si muchos actuaran así, nadie volviera a prestar. Probablemente concluiría que la mentira es incorrecta, pero porque sus efectos son malos.\n\n(3) Immanuel Kant propuso otro criterio. Para él, el valor moral de una acción no depende de sus resultados, sino del principio que la guía. Una de las formulaciones de su imperativo categórico exige tratar a la humanidad, en uno mismo y en los demás, siempre al mismo tiempo como un fin y nunca solamente como un medio. Quien engaña a otro para obtener algo lo usa como un simple instrumento: decide por él, sin darle la oportunidad de aceptar o rechazar lo que realmente está pasando. Por eso, desde esta perspectiva, la mentira al amigo es incorrecta aunque nunca se descubriera y aunque, por azar, no causara ningún daño.\n\n(4) La diferencia no es un detalle académico. Supongamos ahora que la mentira produjera, de verdad, más bienestar que la verdad. El utilitarista tendría que aceptarla; el kantiano seguiría rechazándola. Cada postura tiene su precio: la primera parece permitir cualquier cosa si las cuentas salen bien; la segunda parece indiferente a las consecuencias, incluso cuando estas son graves.\n\n(5) Quizá por eso la mayoría de nosotros razona a veces como utilitarista y a veces como kantiano, sin notarlo. Hacer explícitas estas dos lógicas no resuelve los dilemas, pero sí nos ayuda a saber qué estamos defendiendo cuando defendemos una decisión.", "vis": "", "items": [{"id": "LCA-117", "niv": 1, "cp": "lc_local", "cn": "", "e": "Según el párrafo (2), para el utilitarismo una acción es correcta cuando", "f": "Párrafo (2)", "vis": "", "o": [["A", "sus efectos producen el mayor bienestar total para los afectados.", "Es la definición que da el párrafo (2) de la formulación clásica del utilitarismo.", true], ["B", "trata a las personas siempre como fines y nunca solo como medios.", "Ese es el criterio de Kant, expuesto en el párrafo (3).", false], ["C", "beneficia principalmente a la persona que la realiza.", "El utilitarismo considera la felicidad del «mayor número de afectados», no solo la de quien actúa.", false], ["D", "se realiza por un principio correcto, sin importar sus resultados.", "El texto atribuye esta idea a Kant; el utilitarismo se fija justamente en las consecuencias.", false]]}, {"id": "LCA-118", "niv": 2, "cp": "lc_global", "cn": "", "e": "En el texto, el caso del préstamo para la matrícula cumple la función de", "f": "Párrafos (1) a (3)", "vis": "", "o": [["A", "demostrar que pedir dinero prestado a un amigo es moralmente incorrecto.", "Lo que se discute es la mentira sobre la devolución, no el hecho de pedir prestado.", false], ["B", "denunciar los errores frecuentes de los bancos en las consignaciones.", "El «error del banco» es la excusa falsa del ejemplo, no un problema que el texto denuncie.", false], ["C", "ilustrar un caso en el que el utilitarismo aprueba la mentira y Kant la rechaza.", "En el caso del préstamo, según el texto, el utilitarista probablemente también concluiría que la mentira es incorrecta.", false], ["D", "ofrecer una situación concreta para comparar cómo razonan dos teorías éticas.", "El autor plantea el caso en (1) y luego lo analiza desde el utilitarismo (2) y desde Kant (3).", true]]}, {"id": "LCA-119", "niv": 2, "cp": "lc_global", "cn": "", "e": "Según el texto, tanto el utilitarista como el kantiano considerarían probablemente incorrecta la mentira al amigo. La diferencia está en que", "f": "Párrafos (2) y (3)", "vis": "", "o": [["A", "el primero piensa en el bienestar de quien miente, y el segundo en el del banco.", "El utilitarista considera a todos los afectados, y el banco no es un afectado relevante en el análisis kantiano.", false], ["B", "el primero la rechaza en todos los casos, y el segundo solo cuando el engaño se descubre.", "Es al revés: el kantiano la rechaza «aunque nunca se descubriera», y el utilitarista no condena la mentira por ser mentira.", false], ["C", "el primero la rechaza por sus efectos, y el segundo porque usa al amigo como simple medio.", "El utilitarista la condena «porque sus efectos son malos»; el kantiano, porque engañar es usar al otro como instrumento, «aunque no causara ningún daño».", true], ["D", "el primero se fija en la intención de quien miente, y el segundo en los resultados.", "Las posturas están invertidas: el utilitarismo atiende a las consecuencias y Kant al principio que guía la acción.", false]]}, {"id": "LCA-120", "niv": 2, "cp": "lc_reflexion", "cn": "", "e": "En el párrafo (4), el autor propone suponer que la mentira «produjera, de verdad, más bienestar que la verdad». Con esta estrategia busca", "f": "Párrafo (4)", "vis": "", "o": [["A", "defender que mentir es aceptable siempre que la mentira produzca más bienestar que la verdad.", "El autor no defiende esa conclusión; la atribuye al utilitarista y señala que tiene «su precio».", false], ["B", "mostrar un caso en que las dos teorías llegan a conclusiones opuestas.", "Con esa suposición, el utilitarista «tendría que aceptarla» y el kantiano «seguiría rechazándola»: el caso hace visible la diferencia.", true], ["C", "reconocer que el ejemplo inicial del préstamo era poco realista.", "La suposición no corrige el ejemplo inicial; lo modifica para comparar mejor las teorías.", false], ["D", "probar que la ética kantiana es superior a la utilitarista.", "El autor señala debilidades en ambas posturas; no declara a ninguna superior.", false]]}, {"id": "LCA-121", "niv": 3, "cp": "lc_reflexion", "cn": "", "e": "Una tienda virtual decide publicar reseñas positivas falsas de un producto, porque calcula que así venderá más, los compradores quedarán satisfechos con lo que reciben y nadie saldrá perjudicado. ¿Cuál afirmación es coherente con el texto?", "f": "Párrafos (2), (3) y (4)", "vis": "", "o": [["A", "Un kantiano rechazaría la decisión aunque el cálculo fuera cierto, porque engaña a los compradores.", "Según el párrafo (3), engañar es usar al otro como simple medio, y es incorrecto «aunque, por azar, no causara ningún daño».", true], ["B", "Un kantiano la aceptaría, pues según el cálculo de la tienda nadie resulta perjudicado.", "Para Kant el valor moral no depende de los resultados; la ausencia de daño no justifica el engaño.", false], ["C", "Un utilitarista la rechazaría necesariamente, porque toda mentira causa más sufrimiento que bienestar.", "El texto dice que el utilitarista «no condena la mentira por ser mentira»: depende del balance de efectos.", false], ["D", "Un utilitarista la rechazaría solo porque engañar es incorrecto en sí mismo.", "Ese es un razonamiento de tipo kantiano; el utilitarista «no condena la mentira por ser mentira», sino por sus efectos.", false]]}, {"id": "LCA-122", "niv": 2, "cp": "lc_reflexion", "cn": "", "e": "¿Cuál es la intención principal del autor del texto?", "f": "Párrafos (4) y (5)", "vis": "", "o": [["A", "Demostrar que la ética de Kant es más rigurosa y, por tanto, preferible.", "El autor señala que la postura kantiana «parece indiferente a las consecuencias»; no la declara preferible.", false], ["B", "Convencer al lector de que adopte el utilitarismo en sus decisiones cotidianas.", "El autor critica también al utilitarismo («parece permitir cualquier cosa si las cuentas salen bien»).", false], ["C", "Criticar a quienes mezclan las dos lógicas cuando toman decisiones.", "El autor reconoce que la mayoría razona así «sin notarlo», pero no lo reprocha.", false], ["D", "Aclarar dos maneras de razonar en ética, sin declarar ganadora a ninguna.", "El autor expone ambas teorías, señala que «cada postura tiene su precio» y concluye que distinguirlas ayuda a saber qué defendemos.", true]]}]}, {"comp": "lectura_critica", "sim": "s11-1", "ses": 1, "ind": "Artículo divulgativo: los polinizadores y la comida", "tt": "Texto informativo", "texto": "Los trabajadores invisibles del mercado\n\n(1) Una visita a cualquier plaza de mercado colombiana basta para hacer un inventario de colores: maracuyá, gulupa, aguacate, guayaba, tomate de árbol. Lo que no se ve en los puestos es a los responsables de buena parte de esa abundancia. Muchas de estas plantas necesitan que el polen viaje de una flor a otra para producir frutos y semillas, y en la mayoría de los casos ese viaje lo hacen animales: abejas, sobre todo, pero también moscas, mariposas, escarabajos, murciélagos y aves.\n\n(2) La magnitud de este trabajo se conoce mejor desde que la Plataforma Intergubernamental sobre Biodiversidad y Servicios de los Ecosistemas (IPBES) publicó, en 2016, una evaluación mundial sobre el tema. Según ese informe, alrededor del 75 % de los tipos de cultivos alimentarios más importantes del mundo dependen en alguna medida de la polinización animal. La cifra suele repetirse como si significara que tres de cada cuatro bocados dependen de las abejas, pero no es así. Cereales como el arroz, el trigo y el maíz, que aportan gran parte de los alimentos en volumen, se polinizan por el viento o se autopolinizan. Por eso, cuando se mide en toneladas, la proporción de la producción mundial que viene de cultivos dependientes de polinizadores es menor: cerca del 35 %.\n\n(3) Que la cifra sea menor no significa que el asunto sea menor. Los cultivos que dependen de los polinizadores son, en buena medida, los que aportan vitaminas y minerales a la dieta: frutas, hortalizas, semillas, nueces. Un mundo sin polinizadores no se quedaría sin comida, pero sí con una comida más pobre, más monótona y probablemente más cara.\n\n(4) El mismo informe advierte que en varias regiones las poblaciones de polinizadores silvestres están disminuyendo. Entre las causas señala la pérdida de hábitat, el uso de algunos plaguicidas, las enfermedades y el cambio climático. También destaca un hallazgo menos conocido: la diversidad importa. Aun donde hay muchas abejas de cría, como la abeja melífera, una comunidad variada de polinizadores silvestres mejora la polinización.\n\n(5) Esto tiene una consecuencia práctica para un país como Colombia. Conservar los bordes de bosque, los rastrojos y las flores silvestres cerca de los cultivos no es un lujo ambientalista, sino una forma de proteger la productividad del campo. Los trabajadores invisibles no cobran, pero tampoco pueden trabajar donde no tienen casa.", "vis": "", "items": [{"id": "LCA-123", "niv": 1, "cp": "lc_local", "cn": "", "e": "Según el párrafo (2), ¿qué proporción de la producción mundial de alimentos, medida en toneladas, proviene de cultivos que dependen de polinizadores?", "f": "Párrafo (2)", "vis": "", "o": [["A", "Cerca del 25 %.", "Esta cifra no aparece en el texto; podría salir de restar 75 % a 100 %.", false], ["B", "Cerca del 75 %.", "El 75 % corresponde a los tipos de cultivos, no al volumen producido en toneladas.", false], ["C", "Cerca del 35 %.", "El párrafo (2) dice que, medida en toneladas, la proporción «es menor: cerca del 35 %».", true], ["D", "Cerca del 90 %.", "El texto no menciona esta cifra.", false]]}, {"id": "LCA-124", "niv": 1, "cp": "lc_local", "cn": "", "e": "En el párrafo (2), la expresión «pero no es así» rechaza la idea de que", "f": "Párrafo (2)", "vis": "", "o": [["A", "la IPBES publicó en 2016 una evaluación mundial sobre la polinización.", "Es un dato que el autor afirma, no algo que rechace.", false], ["B", "la mayor parte de lo que comemos depende del trabajo de las abejas.", "La expresión responde directamente a la lectura errónea de la cifra: «como si significara que tres de cada cuatro bocados dependen de las abejas».", true], ["C", "el arroz, el trigo y el maíz se polinizan por el viento o se autopolinizan.", "Esta información viene después y el autor la presenta como cierta.", false], ["D", "muchas plantas del mercado necesitan que el polen viaje de una flor a otra.", "Es una idea que el autor afirma en el párrafo (1); no es lo que rechaza la expresión.", false]]}, {"id": "LCA-125", "niv": 2, "cp": "lc_global", "cn": "", "e": "¿Qué relación hay entre los párrafos (2) y (3)?", "f": "Párrafos (2) y (3)", "vis": "", "o": [["A", "El (3) repite con otras palabras la información numérica del (2) para que se recuerde mejor.", "El (3) no repite cifras: aporta una idea nueva sobre la calidad de la dieta.", false], ["B", "El (3) refuta los datos del informe presentados en el (2) con estudios más recientes.", "El (3) no trae datos nuevos ni cuestiona la cifra; la acepta y la matiza.", false], ["C", "El (2) presenta un problema y el (3) propone una solución técnica para resolverlo.", "La propuesta práctica aparece en el párrafo (5), no en el (3).", false], ["D", "El (2) matiza una cifra muy citada, y el (3) explica por qué el tema sigue importando.", "El (3) empieza «Que la cifra sea menor no significa que el asunto sea menor» y añade el valor nutricional de esos cultivos.", true]]}, {"id": "LCA-126", "niv": 2, "cp": "lc_global", "cn": "", "e": "¿Qué relación establece el texto entre las abejas de cría y los polinizadores silvestres?", "f": "Párrafo (4)", "vis": "", "o": [["A", "Las abejas de cría no reemplazan el aporte de una comunidad variada de silvestres.", "El párrafo (4) dice que, «aun donde hay muchas abejas de cría», una comunidad variada de polinizadores silvestres mejora la polinización.", true], ["B", "Las abejas de cría desplazan a las silvestres y son la causa de su disminución.", "Entre las causas del declive, el texto menciona hábitat, plaguicidas, enfermedades y clima, no la competencia con las abejas de cría.", false], ["C", "Los polinizadores silvestres solo hacen falta donde no hay abejas de cría.", "El texto afirma lo contrario: mejoran la polinización incluso donde abundan las abejas de cría.", false], ["D", "Las abejas de cría polinizan mejor porque son más numerosas y fáciles de manejar.", "El texto no compara su eficacia de ese modo; destaca el valor de la diversidad.", false]]}, {"id": "LCA-127", "niv": 3, "cp": "lc_global", "cn": "", "e": "¿Cuál de los siguientes enunciados resume mejor el texto?", "f": "Texto completo", "vis": "", "o": [["A", "Sin abejas la humanidad perdería tres cuartas partes de su comida, por lo que urge prohibir todos los plaguicidas.", "El texto rechaza la idea de las «tres cuartas partes» y no propone prohibir todos los plaguicidas.", false], ["B", "La IPBES demostró que los cereales son los cultivos más nutritivos y los menos vulnerables del mundo.", "El texto no dice que los cereales sean los más nutritivos; asocia las vitaminas a frutas, hortalizas y semillas.", false], ["C", "Los polinizadores sostienen una dieta variada y nutritiva, y protegerlos exige conservar sus hábitats.", "Recoge las ideas centrales: la importancia nutricional (3), su declive y la diversidad (4), y la conservación de bordes de bosque y flores (5).", true], ["D", "Las abejas de cría bastan para garantizar la polinización de los cultivos si se controlan sus enfermedades.", "El texto afirma que, aun con muchas abejas de cría, la diversidad de polinizadores silvestres mejora la polinización.", false]]}, {"id": "LCA-128", "niv": 2, "cp": "lc_reflexion", "cn": "", "e": "La frase final «Los trabajadores invisibles no cobran, pero tampoco pueden trabajar donde no tienen casa» busca principalmente", "f": "Párrafo (5)", "vis": "", "o": [["A", "señalar que los polinizadores prefieren los cultivos a los bosques para vivir.", "La frase dice lo contrario: necesitan los hábitats naturales («casa») para poder polinizar.", false], ["B", "denunciar que los trabajadores del campo no reciben salarios justos por su labor.", "La metáfora se refiere a los polinizadores, presentados como «trabajadores invisibles» desde el título.", false], ["C", "resumir, con una imagen, que sin hábitat no hay polinizadores para el campo.", "Los «trabajadores invisibles» son los polinizadores y su «casa» son los bordes de bosque y las flores silvestres que el párrafo (5) pide conservar.", true], ["D", "proponer que se construyan colmenas artificiales en las ciudades del país.", "El texto propone conservar hábitats naturales cerca de los cultivos, no colmenas urbanas.", false]]}]}, {"comp": "lectura_critica", "sim": "s11-1", "ses": 1, "ind": "Columna de opinión: islas de calor y árboles en los barrios", "tt": "Texto informativo", "texto": "La sombra también es un derecho (columna de opinión)\n\n(1) En mi barrio, como en tantos barrios populares de nuestras ciudades, la temperatura se mide por la cantidad de gente que está en la calle a las dos de la tarde: nadie. Las aceras de cemento, los techos de zinc y las calles sin un solo árbol convierten el mediodía en un castigo. Mientras tanto, a pocos kilómetros, los barrios con parques arborizados y separadores llenos de guayacanes viven otro cl
