xt><circle cx=\"505.7\" cy=\"36.0\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"505.7\" y=\"28.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">100<\/text><\/svg><\/div>", "o": [["A", "La temperatura del agua subió cada vez más rápido a medida que pasaba el tiempo.", "Hasta el minuto 6 subió 22 °C cada 2 minutos (ritmo constante) y luego dejó de subir; nunca aumentó cada vez más rápido.", false], ["B", "La estufa dejó de calentar el agua a partir del minuto 8, y por eso la temperatura ya no aumentó.", "El enunciado indica que la estufa entregó energía de manera constante durante todo el experimento.", false], ["C", "Mientras el agua hierve, su temperatura se mantiene constante aunque la estufa le siga entregando energía.", "Desde el minuto 8 la temperatura queda en 100 °C con la estufa encendida: la energía se usa en el cambio de fase de líquido a vapor.", true], ["D", "Al llegar a 100 °C el agua dejó de absorber energía de la estufa, porque ya estaba completamente caliente.", "El agua sigue absorbiendo energía, que se invierte en evaporarla (calor latente), no en subir su temperatura.", false]]}]}, {"comp": "ciencias_naturales", "sim": "s11-1", "ses": 1, "ind": "Materiales aislantes", "tt": "", "texto": "Para comparar materiales aislantes, se envolvieron tres vasos iguales con lana, papel aluminio y espuma de poliestireno (icopor); un cuarto vaso quedó sin envoltura. Cada vaso recibió 200 mL de agua a 80 °C y se midió la temperatura del agua 20 minutos después, en el mismo salón.", "vis": "", "items": [{"id": "CNA-135", "niv": 1, "cp": "cn_indagacion", "cn": "fisico", "e": "¿Qué conclusión se apoya en los datos de la tabla?", "f": "Indagación: conclusiones a partir de datos; conducción térmica", "vis": "<table class=\"vt\"><caption>Tabla 5. Temperatura del agua después de 20 minutos<\/caption><thead><tr><th>Envoltura del vaso<\/th><th>Temperatura inicial (°C)<\/th><th>Temperatura final (°C)<\/th><\/tr><\/thead><tbody><tr><td>Lana<\/td><td>80<\/td><td>62<\/td><\/tr><tr><td>Papel aluminio<\/td><td>80<\/td><td>51<\/td><\/tr><tr><td>Icopor<\/td><td>80<\/td><td>66<\/td><\/tr><tr><td>Sin envoltura<\/td><td>80<\/td><td>49<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Datos ficticios.<\/div>", "o": [["A", "De los materiales probados, el papel aluminio fue el mejor aislante, porque los metales reflejan el calor hacia el agua.", "El agua del vaso con aluminio terminó en 51 °C, casi igual que sin envoltura (49 °C) y más fría que con lana o icopor.", false], ["B", "De los materiales probados, el icopor fue el mejor aislante, porque el agua de ese vaso perdió menos temperatura.", "El agua del vaso con icopor terminó en 66 °C, la temperatura más alta: fue el que menos calor dejó escapar.", true], ["C", "Las envolturas casi no influyeron, porque el agua de los cuatro vasos se enfrió durante los 20 minutos.", "El agua se enfrió en todos, pero en cantidades distintas: 14 °C con icopor frente a 31 °C sin envoltura.", false], ["D", "De los materiales probados, la lana fue el mejor aislante, porque es la que se usa en la ropa para conservar el calor.", "El agua del vaso con lana terminó en 62 °C, más fría que la del vaso con icopor (66 °C); los datos, no el uso cotidiano, deciden.", false]]}]}, {"comp": "ciencias_naturales", "sim": "s11-1", "ses": 1, "ind": "Clasificación de la materia", "tt": "", "texto": "En el laboratorio de un colegio hay cuatro recipientes rotulados: agua destilada, agua con sal completamente disuelta, agua con arena y un cilindro de oxígeno gaseoso (O₂).", "vis": "", "items": [{"id": "CNA-136", "niv": 1, "cp": "cn_uso_comprensivo", "cn": "quimico", "e": "¿Cuál de los cuatro recipientes contiene una mezcla homogénea?", "f": "Concepto: sustancias puras y mezclas", "vis": "", "o": [["A", "El de agua con sal completamente disuelta, porque tiene dos sustancias y se ve uniforme.", "Tiene dos sustancias (agua y sal) y su composición es uniforme: no se distinguen fases a simple vista. Es una solución, es decir, una mezcla homogénea.", true], ["B", "El de agua con arena, porque tiene dos sustancias mezcladas en el mismo recipiente.", "Tiene dos sustancias, pero la arena se distingue y se deposita en el fondo: es una mezcla heterogénea.", false], ["C", "El cilindro de oxígeno, porque los gases se reparten de manera uniforme en el recipiente.", "El O₂ es un elemento (sustancia pura); que un gas se reparta de manera uniforme no lo convierte en mezcla.", false], ["D", "El de agua destilada, porque es transparente y tiene la misma composición en todas sus partes.", "El agua destilada es uniforme, pero es una sustancia pura (un compuesto, H₂O), no una mezcla.", false]]}]}, {"comp": "ciencias_naturales", "sim": "s11-1", "ses": 1, "ind": "Formación de agua", "tt": "", "texto": "El hidrógeno reacciona con el oxígeno según la ecuación balanceada 2H₂ + O₂ → 2H₂O. Masas atómicas: H = 1 y O = 16.", "vis": "", "items": [{"id": "CNA-137", "niv": 2, "cp": "cn_uso_comprensivo", "cn": "quimico", "e": "Si reaccionan completamente 4 g de hidrógeno con suficiente oxígeno, ¿qué masa de agua se forma?", "f": "Cálculo propio: estequiometría (masa molar del H₂O = 18 g/mol)", "vis": "", "o": [["A", "4 g.", "Supone que la masa de agua es igual a la del hidrógeno; olvida la masa del oxígeno que se incorpora al agua.", false], ["B", "18 g.", "Es la masa de 1 mol de agua; pero 4 g de H₂ son 2 mol, que producen 2 mol de agua.", false], ["C", "36 g.", "4 g de H₂ ÷ 2 g/mol = 2 mol de H₂. Según la ecuación, 2 mol de H₂ producen 2 mol de H₂O: 2 × 18 g/mol = 36 g.", true], ["D", "72 g.", "Toma los 4 g de H₂ como si fueran 4 mol (olvida dividir entre la masa molar, 2 g/mol): 4 × 18 = 72.", false]]}]}, {"comp": "ciencias_naturales", "sim": "s11-1", "ses": 1, "ind": "Formación del cloruro de sodio", "tt": "", "texto": "El sodio (Na) está en el grupo 1 de la tabla periódica y tiene un electrón en su capa externa. El cloro (Cl) está en el grupo 17 y tiene siete electrones en su capa externa. Ambos elementos reaccionan y forman cloruro de sodio (NaCl).", "vis": "", "items": [{"id": "CNA-138", "niv": 2, "cp": "cn_uso_comprensivo", "cn": "quimico", "e": "¿Qué ocurre con los electrones cuando se forma el cloruro de sodio?", "f": "Concepto: enlace iónico y formación de iones", "vis": "", "o": [["A", "Los dos átomos comparten un par de electrones por igual y forman un enlace covalente apolar.", "El enlace covalente apolar se da entre átomos de electronegatividad igual o muy parecida; entre Na y Cl la diferencia es grande y el enlace es iónico.", false], ["B", "El cloro cede un electrón al sodio y se forman los iones Na⁻ y Cl⁺, que se atraen entre sí.", "Invierte el proceso: el cloro, muy electronegativo, gana electrones; el sodio, que tiene un electrón externo, lo pierde.", false], ["C", "El sodio cede siete electrones al cloro para que este complete su capa externa con catorce electrones.", "El sodio solo tiene un electrón externo y el cloro necesita uno para completar ocho; nadie completa catorce electrones externos.", false], ["D", "El sodio cede su electrón externo al cloro y se forman los iones Na⁺ y Cl⁻, que se atraen entre sí.", "El sodio pierde su único electrón externo y queda como Na⁺; el cloro lo gana, completa ocho electrones externos y queda como Cl⁻. La atracción entre iones de carga opuesta es el enlace iónico.", true]]}]}, {"comp": "ciencias_naturales", "sim": "s11-1", "ses": 1, "ind": "Gaseosa caliente y fría", "tt": "", "texto": "Dos botellas iguales de gaseosa se destapan al mismo tiempo: una recién sacada de la nevera y otra que estuvo al sol. La gaseosa caliente pierde el gas (CO₂) mucho más rápido.", "vis": "", "items": [{"id": "CNA-143", "niv": 2, "cp": "cn_explicacion", "cn": "quimico", "e": "¿Qué explica esta diferencia?", "f": "Concepto: solubilidad de gases y temperatura", "vis": "", "o": [["A", "El calor convierte el azúcar de la gaseosa en dióxido de carbono, que luego escapa de la botella.", "El calor del sol no transforma el azúcar en CO₂; el gas que escapa es el que se disolvió al fabricar la bebida.", false], ["B", "En la botella caliente la presión del gas es menor, y por eso el CO₂ escapa con más facilidad al destaparla.", "En la botella caliente la presión del gas es mayor, no menor, porque el agua retiene menos CO₂ disuelto; la causa es la menor solubilidad.", false], ["C", "La solubilidad de los gases en el agua aumenta con la temperatura, y por eso el CO₂ reacciona y desaparece.", "La solubilidad de los gases en agua disminuye, no aumenta, al subir la temperatura; además, el CO₂ no desaparece, sale como gas.", false], ["D", "La solubilidad de los gases en el agua disminuye cuando aumenta la temperatura, y el CO₂ escapa más rápido.", "A mayor temperatura el líquido puede mantener disuelta menos cantidad de gas, así que el CO₂ escapa más rápido de la gaseosa caliente.", true]]}]}, {"comp": "ciencias_naturales", "sim": "s11-1", "ses": 1, "ind": "Conductividad del cloruro de sodio", "tt": "", "texto": "Un grupo de estudiantes prueba un circuito con un bombillo pequeño. Al poner los electrodos en cloruro de sodio sólido, el bombillo no enciende; al ponerlos en una solución de cloruro de sodio en agua, el bombillo enciende. Con agua destilada sola, tampoco enciende.", "vis": "", "items": [{"id": "CNA-145", "niv": 3, "cp": "cn_explicacion", "cn": "quimico", "e": "¿Qué explica estos resultados?", "f": "Concepto: compuestos iónicos y conductividad", "vis": "", "o": [["A", "Al disolverse, los iones Na⁺ y Cl⁻ quedan libres para moverse y transportar la carga eléctrica.", "En el sólido los iones existen pero están fijos en la red cristalina; en la solución se separan y se mueven hacia los electrodos, lo que permite el paso de corriente.", true], ["B", "Al disolverse, el agua separa la sal en átomos neutros de sodio y de cloro, que llevan la corriente.", "La sal se separa en iones con carga (Na⁺ y Cl⁻), no en átomos neutros; las partículas sin carga no transportan corriente.", false], ["C", "En el sólido no hay iones; estos solo aparecen cuando la sal reacciona químicamente con el agua.", "El cloruro de sodio sólido ya está formado por iones Na⁺ y Cl⁻; al disolverse no reacciona, solo se separan.", false], ["D", "Al disolverse la sal, el agua aporta electrones libres que viajan por la solución como en un metal.", "El agua destilada sola no encendió el bombillo; la corriente en la solución la llevan iones, no electrones libres del agua.", false]]}]}, {"comp": "ciencias_naturales", "sim": "s11-1", "ses": 1, "ind": "Tableta efervescente y temperatura", "tt": "", "texto": "Para estudiar la rapidez de una reacción, un estudiante puso una tableta efervescente en agua a distintas temperaturas y midió el tiempo desde que la tableta tocó el agua hasta que terminó el burbujeo.", "vis": "<div class=\"vfig\"><svg class=\"vg\" viewBox=\"0 0 560 320\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Gráfica 5. Tiempo de reacción de la tableta según la temperatura\" font-family=\"Arial, sans-serif\" font-size=\"12\"><rect width=\"560\" height=\"320\" fill=\"#ffffff\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"13\" fill=\"#1d2433\">Gráfica 5. Tiempo de reacción de la tableta según la temperatura<\/text><line x1=\"60\" y1=\"258.0\" x2=\"540\" y2=\"258.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"262.0\" text-anchor=\"end\" fill=\"#3a4356\">0<\/text><line x1=\"60\" y1=\"202.5\" x2=\"540\" y2=\"202.5\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"206.5\" text-anchor=\"end\" fill=\"#3a4356\">20<\/text><line x1=\"60\" y1=\"147.0\" x2=\"540\" y2=\"147.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"151.0\" text-anchor=\"end\" fill=\"#3a4356\">40<\/text><line x1=\"60\" y1=\"91.5\" x2=\"540\" y2=\"91.5\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"95.5\" text-anchor=\"end\" fill=\"#3a4356\">60<\/text><line x1=\"60\" y1=\"36.0\" x2=\"540\" y2=\"36.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"40.0\" text-anchor=\"end\" fill=\"#3a4356\">80<\/text><line x1=\"60\" y1=\"258\" x2=\"540\" y2=\"258\" stroke=\"#3a4356\"/><line x1=\"60\" y1=\"258\" x2=\"60\" y2=\"36\" stroke=\"#3a4356\"/><text transform=\"translate(14,147.0) rotate(-90)\" text-anchor=\"middle\" fill=\"#3a4356\">Tiempo de burbujeo (s)<\/text><text x=\"300.0\" y=\"312\" text-anchor=\"middle\" fill=\"#3a4356\">Temperatura del agua (°C)<\/text><text x=\"120.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">10<\/text><text x=\"240.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">25<\/text><text x=\"360.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">40<\/text><text x=\"480.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">55<\/text><rect x=\"78.0\" y=\"49.9\" width=\"84.0\" height=\"208.1\" fill=\"#1660a8\"/><text x=\"120.0\" y=\"45.9\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">75<\/text><rect x=\"198.0\" y=\"141.4\" width=\"84.0\" height=\"116.5\" fill=\"#1660a8\"/><text x=\"240.0\" y=\"137.4\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">42<\/text><rect x=\"318.0\" y=\"191.4\" width=\"84.0\" height=\"66.6\" fill=\"#1660a8\"/><text x=\"360.0\" y=\"187.4\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">24<\/text><rect x=\"438.0\" y=\"216.4\" width=\"84.0\" height=\"41.6\" fill=\"#1660a8\"/><text x=\"480.0\" y=\"212.4\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">15<\/text><\/svg><\/div>", "items": [{"id": "CNA-146", "niv": 1, "cp": "cn_indagacion", "cn": "quimico", "e": "¿Qué conclusión se apoya en los datos?", "f": "Indagación: conclusiones a partir de datos; factores que afectan la rapidez de reacción", "vis": "", "o": [["A", "A 10 °C una parte de la tableta queda sin reaccionar, porque el agua fría la disuelve menos.", "A 10 °C el burbujeo terminó a los 75 s; la reacción fue más lenta, pero los datos no indican que quedara tableta sin reaccionar.", false], ["B", "A mayor temperatura del agua, la reacción de la tableta terminó antes en estas pruebas.", "El tiempo baja de 75 s a 10 °C a 15 s a 55 °C: al aumentar la temperatura la reacción es más rápida.", true], ["C", "A mayor temperatura del agua, la tableta produce una mayor cantidad total de gas.", "El experimento mide el tiempo de reacción, no la cantidad de gas producida.", false], ["D", "La temperatura del agua no influye en la rapidez con la que reacciona la tableta.", "Los tiempos cambian claramente con la temperatura (de 75 s a 15 s).", false]]}, {"id": "CNA-147", "niv": 2, "cp": "cn_indagacion", "cn": "quimico", "e": "¿Qué variables debía mantener constantes el estudiante para que la comparación fuera válida?", "f": "Indagación: control de variables", "vis": "", "o": [["A", "La masa de la tableta y el volumen de agua.", "Además de la temperatura, la masa de la tableta y la cantidad de agua podrían cambiar el tiempo de reacción; para atribuir las diferencias a la temperatura deben ser iguales en todas las pruebas.", true], ["B", "La temperatura del agua y el volumen de agua.", "La temperatura es justamente la variable que se cambia a propósito para estudiar su efecto.", false], ["C", "La temperatura del agua y el tiempo de burbujeo.", "La temperatura es la variable independiente y el tiempo es la dependiente; ninguna de las dos debe mantenerse constante.", false], ["D", "El tiempo de burbujeo y la masa de la tableta.", "El tiempo de burbujeo es lo que se mide (variable dependiente), así que no puede mantenerse constante.", false]]}, {"id": "CNA-148", "niv": 2, "cp": "cn_indagacion", "cn": "quimico", "e": "Si la tendencia de los datos se mantiene, ¿qué tiempo se esperaría con agua a 70 °C?", "f": "Indagación: predicciones a partir de patrones", "vis": "", "o": [["A", "Un tiempo entre 24 s y 42 s.", "Ese intervalo corresponde a temperaturas entre 25 y 40 °C, más bajas que 70 °C.", false], ["B", "Un tiempo mayor de 75 s.", "Un tiempo mayor que a 10 °C contradiría la tendencia: a mayor temperatura, menor tiempo.", false], ["C", "Un tiempo menor de 15 s.", "El tiempo disminuye siempre al subir la temperatura; a 70 °C se espera un tiempo menor que a 55 °C (15 s).", true], ["D", "Un tiempo entre 15 s y 24 s, porque el tiempo baja cada vez menos.", "Que el tiempo baje cada vez menos no hace que suba; a 70 °C se espera un tiempo menor que a 55 °C (15 s), no mayor.", false]]}]}, {"comp": "ciencias_naturales", "sim": "s11-1", "ses": 1, "ind": "Condiciones para la oxidación del hierro", "tt": "", "texto": "Para estudiar la oxidación del hierro, se pusieron clavos de hierro idénticos en tres tubos y se observaron durante una semana. Tubo 1: clavo en agua de la llave, con el tubo abierto al aire. Tubo 2: clavo en agua hervida (sin aire disuelto) cubierta con una capa de aceite que impide la entrada de aire. Tubo 3: clavo en aire seco, en un tubo tapado que contiene cloruro de calcio, sustancia que absorbe la humedad. Resultado: solo el clavo del tubo 1 se oxidó.", "vis": "", "items": [{"id": "CNA-152", "niv": 3, "cp": "cn_indagacion", "cn": "quimico", "e": "¿Qué conclusión permiten estos resultados?", "f": "Indagación: conclusiones de un diseño con varias condiciones; concepto de corrosión", "vis": "", "o": [["A", "El aire es suficiente para que el hierro se oxide, y la humedad solo acelera un poco el proceso.", "En el tubo 3 había aire pero no humedad, y el clavo no se oxidó.", false], ["B", "El agua es suficiente para que el hierro se oxide, y el aire solo acelera un poco el proceso.", "En el tubo 2 había agua pero no aire, y el clavo no se oxidó.", false], ["C", "El agua hervida protege al hierro, porque al hervirla se eliminan las sales que causan la oxidación.", "En el tubo 2 se quitó también el aire, y en el tubo 3 (sin agua) tampoco hubo oxidación; los resultados apuntan a la necesidad de agua y aire, no a las sales.", false], ["D", "Para que el hierro se oxide se necesitan tanto el agua como el oxígeno del aire, y uno solo no basta.", "El clavo se oxidó solo donde había agua y aire (tubo 1); sin aire (tubo 2) o sin agua (tubo 3) no se oxidó.", true]]}]}, {"comp": "ciencias_naturales", "sim": "s11-1", "ses": 1, "ind": "Efecto invernadero", "tt": "", "texto": "La superficie de la Tierra se calienta con la luz del Sol y emite energía en forma de radiación infrarroja. Algunos gases de la atmósfera, como el dióxido de carbono (CO₂), el vapor de agua y el metano, influyen en cuánta de esa energía escapa al espacio.", "vis": "", "items": [{"id": "CNA-153", "niv": 2, "cp": "cn_uso_comprensivo", "cn": "cts", "e": "¿Cómo contribuye el CO₂ al efecto invernadero?", "f": "Concepto: efecto invernadero", "vis": "", "o": [["A", "Destruye la capa de ozono y deja pasar más radiación ultravioleta, que es la que calienta la Tierra.", "Confunde el efecto invernadero con el adelgazamiento de la capa de ozono, causado sobre todo por compuestos como los CFC, no por el CO₂.", false], ["B", "Absorbe parte de la radiación infrarroja que emite la superficie y la reemite, y así retiene calor.", "Los gases de efecto invernadero absorben radiación infrarroja y la reemiten en todas las direcciones, en parte de vuelta hacia la superficie; así disminuye la energía que escapa al espacio.", true], ["C", "Refleja hacia el espacio la luz visible del Sol, y esa luz reflejada calienta las capas altas del aire.", "Reflejar la luz solar hacia el espacio enfriaría el planeta; el CO₂ actúa sobre la radiación infrarroja, no reflejando la luz visible.", false], ["D", "Reacciona con el vapor de agua de la atmósfera en una reacción que libera calor hacia la superficie.", "Su efecto es físico (absorción y reemisión de radiación infrarroja), no una reacción química con el vapor de agua.", false]]}]}, {"comp": "ciencias_naturales", "sim": "s11-1", "ses": 1, "ind": "Deforestación de una cuenca", "tt": "", "texto": "En la parte alta de una cuenca, se talan varias hectáreas de bosque para abrir potreros. El terreno es inclinado y llueve con frecuencia.", "vis": "", "items": [{"id": "CNA-154", "niv": 1, "cp": "cn_uso_comprensivo", "cn": "cts", "e": "¿Cuál es un efecto esperado de esta deforestación?", "f": "Concepto: deforestación, suelo y ciclo del agua", "vis": "", "o": [["A", "Aumenta la erosión, porque el suelo inclinado ya no está protegido por las raíces ni por la vegetación.", "Las raíces sujetan el suelo y la cobertura vegetal amortigua el golpe de la lluvia; sin ellas, el agua arrastra la tierra cuesta abajo.", true], ["B", "Aumenta la biodiversidad de la cuenca, porque llegan nuevas especies a ocupar los espacios abiertos.", "La tala destruye el hábitat de muchas especies del bosque; la biodiversidad suele disminuir.", false], ["C", "Aumenta la absorción de CO₂ en la zona, porque los pastos de los potreros fijan más carbono que el bosque.", "Un bosque almacena y fija mucho más carbono que un potrero; talarlo reduce la absorción y libera carbono.", false], ["D", "Disminuye el agua que corre por la superficie, porque el suelo sin árboles absorbe más lluvia que antes.", "Sin árboles el suelo se compacta y retiene menos agua; la escorrentía superficial aumenta, no disminuye.", false]]}]}, {"comp": "ciencias_naturales", "sim": "s11-1", "ses": 1, "ind": "Mercurio en la cadena alimentaria", "tt": "", "texto": "En algunas zonas de minería de oro se usa mercurio, que termina en los ríos. Los análisis muestran que los peces carnívoros grandes tienen concentraciones de mercurio mucho más altas que los peces pequeños que se alimentan de plancton, aunque todos viven en la misma agua.", "vis": "", "items": [{"id": "CNA-156", "niv": 3, "cp": "cn_explicacion", "cn": "cts", "e": "¿Qué explica esta diferencia en la concentración de mercurio?", "f": "Concepto: bioacumulación y biomagnificación", "vis": "", "o": [["A", "El mercurio se descompone dentro de los peces pequeños y desaparece antes de llegar a los grandes.", "El mercurio es un elemento y no se descompone; precisamente por eso se transmite y acumula en la cadena.", false], ["B", "Los peces grandes beben más agua del río, y por eso absorben más mercurio disuelto que los pequeños.", "La concentración se mide por kilogramo de tejido; la gran diferencia entre niveles se explica por lo que comen (biomagnificación), no por el agua que beben.", false], ["C", "El mercurio se acumula en los tejidos y su concentración aumenta en cada nivel de la cadena alimentaria.", "Es la biomagnificación: el mercurio se elimina con dificultad y cada depredador consume muchas presas con mercurio y lo retiene, de modo que los niveles tróficos superiores acumulan más.", true], ["D", "Los peces grandes tienen más masa corporal, y a mayor masa, mayor concentración de cualquier sustancia.", "La concentración es cantidad por unidad de masa: tener más masa no la aumenta por sí solo. La diferencia se debe a la acumulación a través de la dieta.", false]]}]}, {"comp": "ciencias_naturales", "sim": "s11-1", "ses": 1, "ind": "Monitoreo de un río cerca de una mina", "tt": "", "texto": "Una corporación ambiental midió la concentración de mercurio en un río en dos puntos: aguas arriba y aguas abajo de una mina que empezó a operar en 2020. Las muestras se tomaron en la misma época del año.", "vis": "", "items": [{"id": "CNA-157", "niv": 3, "cp": "cn_indagacion", "cn": "cts", "e": "¿Qué conclusión es la más adecuada a partir de estos datos?", "f": "Indagación: conclusiones con datos de monitoreo; correlación y causalidad", "vis": "<table class=\"vt\"><caption>Tabla 6. Mercurio disuelto en el río (µg/L)<\/caption><thead><tr><th>Punto de muestreo<\/th><th>2019<\/th><th>2023<\/th><\/tr><\/thead><tbody><tr><td>Aguas arriba de la mina<\/td><td>0,2<\/td><td>0,2<\/td><\/tr><tr><td>Aguas abajo de la mina<\/td><td>0,2<\/td><td>1,8<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Datos ficticios.<\/div>", "o": [["A", "Los datos permiten afirmar que toda la contaminación por mercurio de la región proviene de esta mina.", "Generaliza en exceso: dos puntos de muestreo no permiten descartar otras fuentes ni hablar de toda la región.", false], ["B", "Los datos apoyan que la mina aporta mercurio: el aumento solo aparece aguas abajo y después de 2020.", "Aguas arriba el valor no cambió; aguas abajo pasó de 0,2 a 1,8 µg/L después de que empezó la mina. Los datos apoyan esa explicación, aunque no prueban por sí solos que sea la única causa.", true], ["C", "La mina no afecta el río, porque aguas arriba el mercurio no cambió entre 2019 y 2023.", "Aguas arriba de la mina no se espera su efecto; el cambio importante está aguas abajo.", false], ["D", "El mercurio del río aumentó por igual en todos los puntos de muestreo, debido a causas naturales.", "Aguas arriba la concentración se mantuvo en 0,2 µg/L; el aumento no fue igual en todos los puntos.", false]]}]}, {"comp": "ciencias_naturales", "sim": "s11-1", "ses": 1, "ind": "Maíz transgénico en una comunidad", "tt": "", "texto": "En una comunidad campesina se discute si conviene sembrar una variedad de maíz transgénico o seguir con la variedad local. Un grupo de estudiantes quiere aportar a la discusión con una investigación científica.", "vis": "", "items": [{"id": "CNA-158", "niv": 2, "cp": "cn_indagacion", "cn": "cts", "e": "¿Cuál de las siguientes preguntas puede responderse mediante una investigación científica?", "f": "Indagación: preguntas que pueden responderse científicamente", "vis": "", "o": [["A", "¿Es moralmente aceptable que los seres humanos modifiquen los genes de las plantas que cultivan para alimentarse?", "Es una pregunta ética: los datos pueden informarla, pero no responderla por sí solos.", false], ["B", "¿Es justo que una empresa sea dueña de las semillas que siembran los campesinos de la comunidad?", "Es una pregunta de justicia y valores; puede informarse con datos, pero no se resuelve con un experimento.", false], ["C", "¿Deberían los campesinos preferir las semillas tradicionales, aunque produzcan menos grano por hectárea?", "Es una pregunta de valores y decisiones; no se resuelve únicamente con un experimento.", false], ["D", "¿Produce la variedad transgénica más grano por hectárea que la local, si se cultivan en las mismas condiciones?", "Es una pregunta sobre un hecho medible (rendimiento por hectárea) que puede responderse con un experimento controlado.", true]]}]}, {"comp": "matematicas", "sim": "s11-1", "ses": 2, "ind": "Planes de alquiler de bicicletas", "tt": "", "texto": "Un parque ofrece dos planes para alquilar bicicletas:\n\nPlan 1: $ 6.000 por cada hora.\nPlan 2: un cargo fijo de $ 10.000 más $ 4.000 por cada hora.\n\nLa gráfica muestra el costo de cada plan, en miles de pesos, según el número de horas de alquiler.", "vis": "<div class=\"vfig\"><svg class=\"vg\" viewBox=\"0 0 560 320\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Gráfica 6. Costo del alquiler según el plan\" font-family=\"Arial, sans-serif\" font-size=\"12\"><rect width=\"560\" height=\"320\" fill=\"#ffffff\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"13\" fill=\"#1d2433\">Gráfica 6. Costo del alquiler según el plan<\/text><line x1=\"60\" y1=\"258.0\" x2=\"540\" y2=\"258.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"262.0\" text-anchor=\"end\" fill=\"#3a4356\">0<\/text><line x1=\"60\" y1=\"202.5\" x2=\"540\" y2=\"202.5\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"206.5\" text-anchor=\"end\" fill=\"#3a4356\">10<\/text><line x1=\"60\" y1=\"147.0\" x2=\"540\" y2=\"147.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"151.0\" text-anchor=\"end\" fill=\"#3a4356\">20<\/text><line x1=\"60\" y1=\"91.5\" x2=\"540\" y2=\"91.5\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"95.5\" text-anchor=\"end\" fill=\"#3a4356\">30<\/text><line x1=\"60\" y1=\"36.0\" x2=\"540\" y2=\"36.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"40.0\" text-anchor=\"end\" fill=\"#3a4356\">40<\/text><line x1=\"60\" y1=\"258\" x2=\"540\" y2=\"258\" stroke=\"#3a4356\"/><line x1=\"60\" y1=\"258\" x2=\"60\" y2=\"36\" stroke=\"#3a4356\"/><text transform=\"translate(14,147.0) rotate(-90)\" text-anchor=\"middle\" fill=\"#3a4356\">Costo (miles de pesos)<\/text><text x=\"300.0\" y=\"312\" text-anchor=\"middle\" fill=\"#3a4356\">Horas de alquiler<\/text><text x=\"100.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">1<\/text><text x=\"180.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">2<\/text><text x=\"260.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">3<\/text><text x=\"340.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">4<\/text><text x=\"420.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">5<\/text><text x=\"500.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">6<\/text><polyline fill=\"none\" stroke=\"#1660a8\" stroke-width=\"2.5\" points=\"100.0,224.7 180.0,191.4 260.0,158.1 340.0,124.8 420.0,91.5 500.0,58.2\"/><circle cx=\"100.0\" cy=\"224.7\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"100.0\" y=\"216.7\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">6<\/text><circle cx=\"180.0\" cy=\"191.4\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"180.0\" y=\"183.4\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">12<\/text><circle cx=\"260.0\" cy=\"158.1\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"260.0\" y=\"150.1\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">18<\/text><circle cx=\"340.0\" cy=\"124.8\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"340.0\" y=\"116.8\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">24<\/text><circle cx=\"420.0\" cy=\"91.5\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"420.0\" y=\"83.5\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">30<\/text><circle cx=\"500.0\" cy=\"58.2\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"500.0\" y=\"50.2\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">36<\/text><polyline fill=\"none\" stroke=\"#d9822b\" stroke-width=\"2.5\" points=\"100.0,180.3 180.0,158.1 260.0,135.9 340.0,113.7 420.0,91.5 500.0,69.3\"/><circle cx=\"100.0\" cy=\"180.3\" r=\"3.5\" fill=\"#d9822b\"/><text x=\"100.0\" y=\"197.3\" text-anchor=\"middle\" font-size=\"11\" fill=\"#d9822b\" font-weight=\"bold\">14<\/text><circle cx=\"180.0\" cy=\"158.1\" r=\"3.5\" fill=\"#d9822b\"/><text x=\"180.0\" y=\"175.1\" text-anchor=\"middle\" font-size=\"11\" fill=\"#d9822b\" font-weight=\"bold\">18<\/text><circle cx=\"260.0\" cy=\"135.9\" r=\"3.5\" fill=\"#d9822b\"/><text x=\"260.0\" y=\"152.9\" text-anchor=\"middle\" font-size=\"11\" fill=\"#d9822b\" font-weight=\"bold\">22<\/text><circle cx=\"340.0\" cy=\"113.7\" r=\"3.5\" fill=\"#d9822b\"/><text x=\"340.0\" y=\"130.7\" text-anchor=\"middle\" font-size=\"11\" fill=\"#d9822b\" font-weight=\"bold\">26<\/text><circle cx=\"420.0\" cy=\"91.5\" r=\"3.5\" fill=\"#d9822b\"/><text x=\"420.0\" y=\"108.5\" text-anchor=\"middle\" font-size=\"11\" fill=\"#d9822b\" font-weight=\"bold\">30<\/text><circle cx=\"500.0\" cy=\"69.3\" r=\"3.5\" fill=\"#d9822b\"/><text x=\"500.0\" y=\"86.3\" text-anchor=\"middle\" font-size=\"11\" fill=\"#d9822b\" font-weight=\"bold\">34<\/text><rect x=\"60\" y=\"286\" width=\"12\" height=\"12\" fill=\"#1660a8\"/><text x=\"76\" y=\"296\" fill=\"#1d2433\">Plan 1<\/text><rect x=\"128\" y=\"286\" width=\"12\" height=\"12\" fill=\"#d9822b\"/><text x=\"144\" y=\"296\" fill=\"#1d2433\">Plan 2<\/text><\/svg><\/div>", "items": [{"id": "MTA-104", "niv": 1, "cp": "mt_interpretacion", "cn": "", "e": "¿Para cuántas horas de alquiler los dos planes cuestan lo mismo?", "f": "Lectura de la gráfica", "vis": "", "o": [["A", "3 horas.", "Con 3 horas el plan 1 cuesta $ 18.000 y el plan 2 cuesta $ 22.000; no son iguales.", false], ["B", "4 horas.", "Con 4 horas el plan 1 cuesta $ 24.000 y el plan 2, $ 26.000; todavía es más barato el plan 1.", false], ["C", "5 horas.", "Con 5 horas ambos planes cuestan $ 30.000 (6.000 × 5 = 30.000 y 10.000 + 4.000 × 5 = 30.000); en la gráfica las dos líneas se cruzan en ese punto.", true], ["D", "6 horas.", "Con 6 horas el plan 1 cuesta $ 36.000 y el plan 2, $ 34.000; ya no son iguales.", false]]}, {"id": "MTA-105", "niv": 2, "cp": "mt_formulacion", "cn": "", "e": "¿Cuál expresión permite calcular el costo C, en pesos, de alquilar una bicicleta durante h horas con el plan 2?", "f": "Modelación de la situación", "vis": "", "o": [["A", "C = 10.000 + 4.000h.", "El cargo fijo de 10.000 se paga una sola vez y a él se suman 4.000 pesos por cada hora; por ejemplo, con 2 horas: 10.000 + 8.000 = 18.000.", true], ["B", "C = 14.000h.", "Toma el costo de la primera hora (14.000) como si fuera el valor de cada hora; con 2 horas daría 28.000, pero el plan 2 cobra 18.000.", false], ["C", "C = (10.000 + 4.000)h.", "Multiplica también el cargo fijo por las horas, como si se cobrara de nuevo cada hora; eso equivale a C = 14.000h.", false], ["D", "C = 4.000 + 10.000h.", "Intercambia el cargo fijo con el valor por hora: con 1 hora daría 14.000, pero con 2 horas daría 24.000 en lugar de 18.000.", false]]}, {"id": "MTA-106", "niv": 3, "cp": "mt_argumentacion", "cn": "", "e": "Camila afirma: «Si voy a alquilar la bicicleta más de 5 horas completas, me conviene el plan 2». ¿Es correcta su afirmación?", "f": "Comparación de modelos lineales", "vis": "", "o": [["A", "Sí, porque el plan 2 sube $ 4.000 por hora y el plan 1, $ 6.000, así que el plan 2 es más barato desde la primera hora.", "La conclusión sobre más de 5 horas es correcta, pero la razón es falsa: con 1 hora el plan 2 cuesta $ 14.000 y el plan 1, $ 6.000.", false], ["B", "No, porque con 6 horas el plan 2 cuesta $ 34.000, más que los $ 30.000 que cuesta el plan 1 con 5 horas.", "Compara costos con distinto número de horas; con las mismas 6 horas, el plan 1 cuesta $ 36.000 y el plan 2, $ 34.000.", false], ["C", "No, porque el cargo fijo de $ 10.000 equivale a 10.000 ÷ 4.000 = 2,5 horas del plan 2 que nunca se recuperan.", "El cargo fijo sí se recupera: cada hora el plan 2 ahorra $ 2.000 frente al plan 1, y a las 5 horas el ahorro acumulado llega a $ 10.000.", false], ["D", "Sí, porque la diferencia de costos es 10.000 − 2.000h, negativa para h > 5: con 6 horas, $ 34.000 frente a $ 36.000.", "Plan 2 − plan 1 = (10.000 + 4.000h) − 6.000h = 10.000 − 2.000h, que vale cero en h = 5 y es negativa desde 6 horas: el plan 2 resulta más barato.", true]]}]}, {"comp": "matematicas", "sim": "s11-1", "ses": 2, "ind": "Rampa de acceso en un conjunto residencial", "tt": "", "texto": "En la entrada de un conjunto residencial se construyó una rampa que salva una altura de 0,9 m y ocupa 4 m de longitud horizontal, como muestra la figura. El reglamento interno del conjunto exige que la pendiente de una rampa, calculada como (altura ÷ longitud horizontal) × 100, no supere el 12 %.", "vis": "<div class=\"vfig\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 170\" width=\"400\" height=\"170\" font-family=\"Arial, sans-serif\" font-size=\"14\"><rect width=\"400\" height=\"170\" fill=\"#ffffff\"/><polygon points=\"40,130 340,130 340,62\" fill=\"#e8eef6\" stroke=\"#1d2433\" stroke-width=\"2\"/><polyline points=\"328,130 328,118 340,118\" fill=\"none\" stroke=\"#1d2433\" stroke-width=\"1.5\"/><text x=\"190\" y=\"152\" text-anchor=\"middle\" fill=\"#1d2433\">4 m (horizontal)<\/text><text x=\"348\" y=\"101\" fill=\"#1d2433\">0,9 m<\/text><text x=\"170\" y=\"86\" text-anchor=\"middle\" fill=\"#1d2433\" transform=\"rotate(-12.7 170 86)\">rampa<\/text><\/svg><\/div>", "items": [{"id": "MTA-107", "niv": 2, "cp": "mt_formulacion", "cn": "", "e": "¿Cuál es, aproximadamente, la longitud de la superficie inclinada de la rampa?", "f": "Teorema de Pitágoras", "vis": "", "o": [["A", "4,1 m.", "Por el teorema de Pitágoras: √(0,9² + 4²) = √(0,81 + 16) = √16,81 = 4,1 m.", true], ["B", "4,9 m.", "Suma directamente los catetos (0,9 + 4); el teorema de Pitágoras suma sus cuadrados y luego saca la raíz.", false], ["C", "9,8 m.", "Usa 9 en lugar de 0,9 (no convierte bien la altura): √(9² + 4²) = √97 ≈ 9,8.", false], ["D", "16,81 m.", "Es la suma de los cuadrados de los catetos; falta sacar la raíz cuadrada.", false]]}, {"id": "MTA-108", "niv": 2, "cp": "mt_argumentacion", "cn": "", "e": "El constructor afirma que, si se duplica la longitud horizontal de la rampa y se mantiene su altura, la rampa cumplirá el reglamento. ¿Es correcta su afirmación?", "f": "Razones y porcentajes", "vis": "", "o": [["A", "No, porque la pendiente solo disminuye si también se reduce la altura de la rampa.", "La pendiente también disminuye cuando aumenta la longitud horizontal con la misma altura, porque el denominador del cociente crece.", false], ["B", "Sí, porque la pendiente pasaría a 0,9 ÷ 8 × 100 = 11,25 %, que no supera el 12 %.", "Con 8 m horizontales la pendiente es 11,25 %, menor que el máximo permitido de 12 %; la actual es 0,9 ÷ 4 × 100 = 22,5 %.", true], ["C", "No, porque al duplicar la longitud horizontal la pendiente sigue siendo 22,5 %, ya que la altura no cambia.", "La pendiente es el cociente altura ÷ longitud horizontal: si el denominador se duplica y la altura se mantiene, el cociente se reduce a la mitad.", false], ["D", "Sí, porque al duplicar la longitud horizontal la pendiente se reduce a la cuarta parte, es decir, a cerca de 5,6 %.", "La pendiente es inversamente proporcional a la longitud horizontal: al duplicarla se reduce a la mitad (11,25 %), no a la cuarta parte.", false]]}]}, {"comp": "matematicas", "sim": "s11-1", "ses": 2, "ind": "Tanque de reserva de agua", "tt": "", "texto": "Una familia instaló un tanque cilíndrico de reserva de agua con 0,5 m de radio y 1,2 m de altura. Recuerde que 1 m³ equivale a 1.000 litros. Use π ≈ 3,14.", "vis": "", "items": [{"id": "MTA-113", "niv": 2, "cp": "mt_formulacion", "cn": "", "e": "¿Cuál es la capacidad del tanque, en litros?", "f": "Volumen del cilindro", "vis": "", "o": [["A", "9,42 litros.", "Convierte mal las unidades: multiplica 0,942 m³ por 10 en lugar de por 1.000.", false], ["B", "94,2 litros.", "Convierte mal las unidades: multiplica 0,942 m³ por 100 en lugar de por 1.000.", false], ["C", "314 litros.", "Usa la fórmula del volumen del cono (π · r² · h ÷ 3); el tanque es un cilindro.", false], ["D", "942 litros.", "V = π · r² · h = 3,14 × 0,5² × 1,2 = 0,942 m³, que equivalen a 942 litros.", true]]}, {"id": "MTA-114", "niv": 3, "cp": "mt_formulacion", "cn": "", "e": "En otra ocasión, el tanque contiene 900 litros de agua. La familia consume 180 litros diarios y, además, por una fuga se pierden 45 litros cada día. Si no entra más agua, ¿durante cuántos días completos alcanza el agua del tanque?", "f": "Cálculo propio", "vis": "", "o": [["A", "4 días.", "Cada día salen 180 + 45 = 225 litros; 900 ÷ 225 = 4 días completos.", true], ["B", "5 días.", "Ignora la fuga: 900 ÷ 180 = 5. Los 45 litros diarios que se pierden también vacían el tanque.", false], ["C", "6 días.", "Resta la fuga del consumo en lugar de sumarla: 900 ÷ (180 − 45) ≈ 6,7, y toma 6 días.", false], ["D", "20 días.", "Divide solo entre la fuga (900 ÷ 45 = 20) y olvida el consumo de la familia.", false]]}]}, {"comp": "matematicas", "sim": "s11-1", "ses": 2, "ind": "Descuentos sucesivos en un televisor", "tt": "", "texto": "Un almacén vende un televisor en $ 1.200.000. Durante una promoción aplica un descuento del 20 % y, sobre el precio ya rebajado, un descuento adicional del 10 % para quienes pagan en efectivo.", "vis": "", "items": [{"id": "MTA-119", "niv": 2, "cp": "mt_formulacion", "cn": "", "e": "¿Cuánto paga por el televisor una persona que recibe los dos descuentos?", "f": "Cálculo propio", "vis": "", "o": [["A", "$ 840.000.", "Suma los porcentajes y aplica un solo descuento del 30 %; el segundo descuento se calcula sobre el precio ya rebajado.", false], ["B", "$ 864.000.", "Con el 20 %: 1.200.000 × 0,8 = 960.000. Con el 10 % adicional: 960.000 × 0,9 = 864.000.", true], ["C", "$ 960.000.", "Solo aplica el primer descuento del 20 % y olvida el 10 % por pago en efectivo.", false], ["D", "$ 1.080.000.", "Solo aplica el descuento del 10 % sobre el precio original y olvida el del 20 %.", false]]}, {"id": "MTA-120", "niv": 2, "cp": "mt_argumentacion", "cn": "", "e": "Luis afirma que recibir los dos descuentos equivale a recibir un único descuento del 30 %. ¿Es correcta su afirmación?", "f": "Cálculo propio", "vis": "", "o": [["A", "Sí, porque 20 % + 10 % = 30 % y los dos descuentos se aplican al mismo televisor.", "Los porcentajes sucesivos se multiplican (0,8 × 0,9), no se suman, porque el segundo se calcula sobre una base menor.", false], ["B", "Sí, porque aplicar primero el 10 % y luego el 20 % da el mismo precio que aplicarlos al revés.", "Es cierto que el orden no altera el precio final, pero eso no prueba que el descuento total sea del 30 %; de hecho, es del 28 %.", false], ["C", "No, porque el 10 % se calcula sobre un precio ya rebajado, y en total el descuento equivale a un 28 %.", "Se paga 0,8 × 0,9 = 0,72 del precio original, es decir, el 72 %: el descuento total es del 28 %, no del 30 %.", true], ["D", "No, porque el segundo descuento es el 10 % del 20 %, de modo que el descuento total es solo del 22 %.", "El segundo descuento es el 10 % del precio ya rebajado (el 80 % del original), no el 10 % del primer descuento; el total es 28 %.", false]]}]}, {"comp": "matematicas", "sim": "s11-1", "ses": 2, "ind": "Tiempo de desplazamiento al colegio", "tt": "", "texto": "Nueve estudiantes registraron cuánto tiempo tardan en llegar al colegio. Los datos aparecen en la tabla.", "vis": "<table class=\"vt\"><caption>Tabla 7. Tiempo de desplazamiento (minutos)<\/caption><thead><tr><th>Estudiante<\/th><th>1<\/th><th>2<\/th><th>3<\/th><th>4<\/th><th>5<\/th><th>6<\/th><th>7<\/th><th>8<\/th><th>9<\/th><\/tr><\/thead><tbody><tr><td>Tiempo<\/td><td>15<\/td><td>22<\/td><td>12<\/td><td>30<\/td><td>18<\/td><td>75<\/td><td>20<\/td><td>15<\/td><td>25<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Datos ficticios.<\/div>", "items": [{"id": "MTA-123", "niv": 2, "cp": "mt_interpretacion", "cn": "", "e": "¿Cuál es la mediana de los tiempos registrados?", "f": "Medidas de tendencia central", "vis": "", "o": [["A", "15 minutos.", "Es la moda (el dato que más se repite), no la mediana.", false], ["B", "20 minutos.", "Al ordenar los 9 datos (12, 15, 15, 18, 20, 22, 25, 30, 75), el dato central es el quinto: 20 minutos.", true], ["C", "25,8 minutos.", "Es la media aritmética (232 ÷ 9 ≈ 25,8); la mediana es el dato central de los datos ordenados.", false], ["D", "63 minutos.", "Es el rango (75 − 12), una medida de dispersión, no de tendencia central.", false]]}, {"id": "MTA-124", "niv": 3, "cp": "mt_argumentacion", "cn": "", "e": "Un estudiante afirma que, para describir el tiempo típico que tarda este grupo en llegar al colegio, la media es más representativa que la mediana. ¿Es correcta su afirmación?", "f": "Medidas de tendencia central y datos extremos", "vis": "", "o": [["A", "Sí, porque en estos datos la media y la mediana difieren en menos de 6 minutos.", "Que la diferencia sea pequeña no muestra que la media sea mejor; la media está desplazada hacia arriba por el dato de 75 minutos.", false], ["B", "No, porque la moda, 15 minutos, es la única medida que representa bien el tiempo típico del grupo.", "La moda no es la única medida válida, y aquí solo dos estudiantes tardan 15 minutos; el argumento no compara media y mediana.", false], ["C", "No, porque el dato extremo de 75 min eleva la media, mientras que a la mediana casi no la afecta.", "Ocho de los nueve datos están entre 12 y 30 minutos; el valor de 75 min sube la media (≈ 25,8), mientras la mediana (20) refleja mejor el tiempo central del grupo.", true], ["D", "Sí, porque la media se calcula con los nueve datos, mientras que la mediana usa solo uno de ellos.", "Usar todos los datos hace a la media sensible a valores extremos; con un valor muy alto como 75 min, la mediana describe mejor el tiempo típico.", false]]}]}, {"comp": "matematicas", "sim": "s11-1", "ses": 2, "ind": "Distribución del presupuesto familiar", "tt": "", "texto": "La gráfica muestra cómo distribuye una familia su ingreso mensual.", "vis": "<div class=\"vfig\"><svg class=\"vg\" viewBox=\"0 0 560 320\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Gráfica 7. Distribución del ingreso familiar\" font-family=\"Arial, sans-serif\" font-size=\"12\"><rect width=\"560\" height=\"320\" fill=\"#ffffff\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"13\" fill=\"#1d2433\">Gráfica 7. Distribución del ingreso familiar<\/text><path d=\"M170,175 L170.0,60.0 A115,115 0 0,1 263.0,242.6 Z\" fill=\"#1660a8\" stroke=\"#fff\" stroke-width=\"1.5\"/><path d=\"M170,175 L263.0,242.6 A115,115 0 0,1 77.0,242.6 Z\" fill=\"#d9822b\" stroke=\"#fff\" stroke-width=\"1.5\"/><path d=\"M170,175 L77.0,242.6 A115,115 0 0,1 60.6,139.5 Z\" fill=\"#2e8b57\" stroke=\"#fff\" stroke-width=\"1.5\"/><path d=\"M170,175 L60.6,139.5 A115,115 0 0,1 102.4,82.0 Z\" fill=\"#8e44ad\" stroke=\"#fff\" stroke-width=\"1.5\"/><path d=\"M170,175 L102.4,82.0 A115,115 0 0,1 170.0,60.0 Z\" fill=\"#c0392b\" stroke=\"#fff\" stroke-width=\"1.5\"/><rect x=\"320\" y=\"59\" width=\"14\" height=\"14\" fill=\"#1660a8\"/><text x=\"340\" y=\"70\" fill=\"#1d2433\">Arriendo: 35 %<\/text><rect x=\"320\" y=\"83\" width=\"14\" height=\"14\" fill=\"#d9822b\"/><text x=\"340\" y=\"94\" fill=\"#1d2433\">Alimentación: 30 %<\/text><rect x=\"320\" y=\"107\" width=\"14\" height=\"14\" fill=\"#2e8b57\"/><text x=\"340\" y=\"118\" fill=\"#1d2433\">Transporte: 15 %<\/text><rect x=\"320\" y=\"131\" width=\"14\" height=\"14\" fill=\"#8e44ad\"/><text x=\"340\" y=\"142\" fill=\"#1d2433\">Servicios: 10 %<\/text><rect x=\"320\" y=\"155\" width=\"14\" height=\"14\" fill=\"#c0392b\"/><text x=\"340\" y=\"166\" fill=\"#1d2433\">Otros: 10 %<\/text><\/svg><\/div>", "items": [{"id": "MTA-125", "niv": 1, "cp": "mt_interpretacion", "cn": "", "e": "¿Cuáles rubros representan juntos exactamente la mitad del ingreso mensual?", "f": "Lectura de la gráfica", "vis": "", "o": [["A", "Alimentación y servicios.", "Alimentación (30 %) y servicios (10 %) suman 40 %, no 50 %.", false], ["B", "Transporte, servicios y otros.", "Transporte (15 %), servicios (10 %) y otros (10 %) suman 35 %, menos de la mitad.", false], ["C", "Arriendo y alimentación.", "Arriendo (35 %) y alimentación (30 %) suman 65 %, más de la mitad.", false], ["D", "Arriendo y transporte.", "Arriendo (35 %) y transporte (15 %) suman 50 %, es decir, la mitad del ingreso.", true]]}]}, {"comp": "matematicas", "sim": "s11-1", "ses": 2, "ind": "Escalera apoyada en una pared", "tt": "", "texto": "Un pintor apoya una escalera de 6 m de longitud contra una pared vertical, de modo que la escalera forma un ángulo de 60° con el suelo horizontal. Use: sen 60° ≈ 0,87; cos 60° = 0,5; tan 60° ≈ 1,73; sen 30° = 0,5.", "vis": "", "items": [{"id": "MTA-131", "niv": 2, "cp": "mt_formulacion", "cn": "", "e": "¿A qué altura de la pared llega el extremo superior de la escalera?", "f": "Razones trigonométricas", "vis": "", "o": [["A", "5,22 m.", "La altura es el cateto opuesto al ángulo de 60°: 6 × sen 60° ≈ 6 × 0,87 = 5,22 m.", true], ["B", "6 m.", "Toma la longitud de la escalera como si fuera la altura; la escalera es la hipotenusa y está inclinada.", false], ["C", "6,9 m.", "Divide 6 entre 0,87; la altura no puede ser mayor que la longitud de la escalera, que es la hipotenusa.", false], ["D", "10,38 m.", "Multiplica por la tangente (6 × 1,73); la tangente relaciona los dos catetos, no la hipotenusa con un cateto.", false]]}, {"id": "MTA-132", "niv": 3, "cp": "mt_argumentacion", "cn": "", "e": "Un ayudante afirma: «Si la escalera formara un ángulo de 30° con el suelo, en lugar de 60°, llegaría exactamente a la mitad de la altura». ¿Es correcta su afirmación?", "f": "Razones trigonométricas", "vis": "", "o": [["A", "Sí, porque sen 30° = 0,5 y 0,5 es la mitad de 1.", "Que sen 30° valga 0,5 no implica que la altura sea la mitad de la que se obtiene con 60°; habría que comparar con sen 60° ≈ 0,87.", false], ["B", "No, porque con 30° alcanzaría 6 × sen 30° = 3 m, más que la mitad de lo que alcanza con 60°.", "La mitad de 5,22 m es 2,61 m, y con 30° la altura es 6 × 0,5 = 3 m; por tanto, no llega exactamente a la mitad.", true], ["C", "No, porque con 30° la escalera alcanzaría una altura mayor que con 60°.", "Al disminuir el ángulo con el suelo la escalera queda más inclinada y alcanza menos altura (3 m frente a 5,22 m).", false], ["D", "Sí, porque al reducir el ángulo a la mitad, la altura que alcanza la escalera también se reduce a la mitad.", "La altura depende del seno del ángulo, y el seno no es proporcional al ángulo: sen 30° no es la mitad de sen 60°.", false]]}]}, {"comp": "matematicas", "sim": "s11-1", "ses": 2, "ind": "Plan de ahorro semanal", "tt": "", "texto": "Mariana decidió ahorrar para comprar un computador. La primera semana ahorró $ 20.000 y cada semana ahorra $ 5.000 más que la semana anterior. La tabla muestra sus primeras semanas.", "vis": "<table class=\"vt\"><caption>Tabla 8. Ahorro de Mariana<\/caption><thead><tr><th>Semana<\/th><th>1<\/th><th>2<\/th><th>3<\/th><th>4<\/th><\/tr><\/thead><tbody><tr><td>Ahorro de la semana<\/td><td>$ 20.000<\/td><td>$ 25.000<\/td><td>$ 30.000<\/td><td>$ 35.000<\/td><\/tr><\/tbody><\/table>", "items": [{"id": "MTA-133", "niv": 1, "cp": "mt_interpretacion", "cn": "", "e": "¿Cuánto dinero ahorrará Mariana en la semana 6?", "f": "Sucesiones aritméticas", "vis": "", "o": [["A", "$ 30.000.", "Suma solo los aumentos (6 × 5.000) y olvida el ahorro inicial de $ 20.000.", false], ["B", "$ 35.000.", "Es lo que ahorra en la semana 4, el último valor de la tabla.", false], ["C", "$ 40.000.", "Es lo que ahorra en la semana 5 (20.000 + 4 × 5.000).", false], ["D", "$ 45.000.", "En la semana 6 se han hecho 5 aumentos de $ 5.000 desde la primera semana: 20.000 + 5 × 5.000 = 45.000.", true]]}, {"id": "MTA-134", "niv": 3, "cp": "mt_formulacion", "cn": "", "e": "¿Cuánto dinero habrá ahorrado Mariana en total al terminar la semana 10?", "f": "Suma de una sucesión aritmética", "vis": "", "o": [["A", "$ 65.000.", "Es lo que ahorra solo en la semana 10 (20.000 + 9 × 5.000), no el total acumulado.", false], ["B", "$ 250.000.", "Calcula 10 × 20.000 + 10 × 5.000, como si cada semana el aumento fuera de solo $ 5.000 sobre el valor inicial.", false], ["C", "$ 425.000.", "Los ahorros van de 20.000 a 65.000; la suma es 10 × (20.000 + 65.000) ÷ 2 = 425.000.", true], ["D", "$ 850.000.", "Multiplica 10 × (20.000 + 65.000) y olvida dividir entre 2.", false]]}]}, {"comp": "matematicas", "sim": "s11-1", "ses": 2, "ind": "Desempeño de dos cursos en un simulacro", "tt": "", "texto": "La gráfica muestra cuántos estudiantes de los cursos 11A (30 estudiantes) y 11B (25 estudiantes) quedaron en cada nivel de desempeño de un simulacro de Matemáticas.", "vis": "<div class=\"vfig\"><svg class=\"vg\" viewBox=\"0 0 560 320\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Gráfica 8. Estudiantes por nivel de desempeño\" font-family=\"Arial, sans-serif\" font-size=\"12\"><rect width=\"560\" height=\"320\" fill=\"#ffffff\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"13\" fill=\"#1d2433\">Gráfica 8. Estudiantes por nivel de desempeño<\/text><line x1=\"60\" y1=\"258.0\" x2=\"540\" y2=\"258.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"262.0\" text-anchor=\"end\" fill=\"#3a4356\">0<\/text><line x1=\"60\" y1=\"221.0\" x2=\"540\" y2=\"221.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"225.0\" text-anchor=\"end\" fill=\"#3a4356\">2<\/text><line x1=\"60\" y1=\"184.0\" x2=\"540\" y2=\"184.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"188.0\" text-anchor=\"end\" fill=\"#3a4356\">4<\/text><line x1=\"60\" y1=\"147.0\" x2=\"540\" y2=\"147.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"151.0\" text-anchor=\"end\" fill=\"#3a4356\">6<\/text><line x1=\"60\" y1=\"110.0\" x2=\"540\" y2=\"110.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"114.0\" text-anchor=\"end\" fill=\"#3a4356\">8<\/text><line x1=\"60\" y1=\"73.0\" x2=\"540\" y2=\"73.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"77.0\" text-anchor=\"end\" fill=\"#3a4356\">10<\/text><line x1=\"60\" y1=\"36.0\" x2=\"540\" y2=\"36.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"40.0\" text-anchor=\"end\" fill=\"#3a4356\">12<\/text><line x1=\"60\" y1=\"258\" x2=\"540\" y2=\"258\" stroke=\"#3a4356\"/><line x1=\"60\" y1=\"258\" x2=\"60\" y2=\"36\" stroke=\"#3a4356\"/><text transform=\"translate(14,147.0) rotate(-90)\" text-anchor=\"middle\" fill=\"#3a4356\">Número de estudiantes<\/text><text x=\"300.0\" y=\"312\" text-anchor=\"middle\" fill=\"#3a4356\">Nivel de desempeño<\/text><text x=\"120.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Insuficiente<\/text><text x=\"240.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Mínimo<\/text><text x=\"360.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Satisfactorio<\/text><text x=\"480.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Avanzado<\/text><rect x=\"78.0\" y=\"184.0\" width=\"42.0\" height=\"74.0\" fill=\"#1660a8\"/><text x=\"99.0\" y=\"180.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">4<\/text><rect x=\"198.0\" y=\"73.0\" width=\"42.0\" height=\"185.0\" fill=\"#1660a8\"/><text x=\"219.0\" y=\"69.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">10<\/text><rect x=\"318.0\" y=\"36.0\" width=\"42.0\" height=\"222.0\" fill=\"#1660a8\"/><text x=\"339.0\" y=\"32.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">12<\/text><rect x=\"438.0\" y=\"184.0\" width=\"42.0\" height=\"74.0\" fill=\"#1660a8\"/><text x=\"459.0\" y=\"180.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">4<\/text><rect x=\"120.0\" y=\"221.0\" width=\"42.0\" height=\"37.0\" fill=\"#d9822b\"/><text x=\"141.0\" y=\"217.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">2<\/text><rect x=\"240.0\" y=\"110.0\" width=\"42.0\" height=\"148.0\" fill=\"#d9822b\"/><text x=\"261.0\" y=\"106.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">8<\/text><rect x=\"360.0\" y=\"73.0\" width=\"42.0\" height=\"185.0\" fill=\"#d9822b\"/><text x=\"381.0\" y=\"69.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">10<\/text><rect x=\"480.0\" y=\"165.5\" width=\"42.0\" height=\"92.5\" fill=\"#d9822b\"/><text x=\"501.0\" y=\"161.5\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">5<\/text><rect x=\"60\" y=\"286\" width=\"12\" height=\"12\" fill=\"#1660a8\"/><text x=\"76\" y=\"296\" fill=\"#1d2433\">11A<\/text><rect x=\"107\" y=\"286\" width=\"12\" height=\"12\" fill=\"#d9822b\"/><text x=\"123\" y=\"296\" fill=\"#1d2433\">11B<\/text><\/svg><\/div>", "items": [{"id": "MTA-135", "niv": 2, "cp": "mt_argumentacion", "cn": "", "e": "El coordinador afirma que en 11A hay una mayor proporción de estudiantes en los niveles Satisfactorio o Avanzado, porque allí hay 16 estudiantes en esos niveles y en 11B hay 15. ¿Es correcta su afirmación?", "f": "Lectura de la gráfica y porcentajes", "vis": "", "o": [["A", "No, porque en ambos cursos 16 ÷ 30 y 15 ÷ 25 dan aproximadamente la mitad, 50 %.", "Los cocientes no son iguales ni cercanos a 50 % en ambos casos: 15 ÷ 25 = 60 % y 16 ÷ 30 ≈ 53,3 %.", false], ["B", "Sí, porque 16 > 15: en 11A hay 16 − 15 = 1 estudiante más en esos niveles.", "Comparar cantidades absolutas no basta cuando los cursos tienen distinto número de estudiantes; hay que comparar porcentajes.", false], ["C", "No, porque en 11B la proporción es 15 ÷ 25 = 60 %, y en 11A, 16 ÷ 30 ≈ 53 %.", "Aunque 11A tiene más estudiantes en esos niveles, respecto al tamaño de cada curso la proporción es mayor en 11B (60 % frente a ≈ 53,3 %).", true], ["D", "Sí, porque en Satisfactorio 11A tiene 12 estudiantes y 11B solo 10, es decir, 20 % más.", "Sigue comparando cantidades y no proporciones, y deja por fuera el nivel Avanzado, donde 11B tiene más estudiantes.", false]]}, {"id": "MTA-136", "niv": 1, "cp": "mt_interpretacion", "cn": "", "e": "¿Cuántos estudiantes de 11A quedaron en el nivel Mínimo o en uno inferior?", "f": "Lectura de la gráfica", "vis": "", "o": [["A", "4 estudiantes.", "Solo cuenta el nivel Insuficiente.", false], ["B", "10 estudiantes.", "Solo cuenta el nivel Mínimo; falta incluir el nivel Insuficiente, que es inferior.", false], ["C", "12 estudiantes.", "Lee la barra de 11A en el nivel Satisfactorio, que es superior a Mínimo.", false], ["D", "14 estudiantes.", "En 11A hay 4 estudiantes en Insuficiente y 10 en Mínimo: 4 + 10 = 14.", true]]}]}, {"comp": "matematicas", "sim": "s11-1", "ses": 2, "ind": "Lote en forma de trapecio", "tt": "", "texto": "Una cooperativa compró un lote con forma de trapecio rectángulo. Sus lados paralelos miden 18 m y 26 m, y el lado perpendicular a ellos mide 15 m, como muestra la figura.", "vis": "<div class=\"vfig\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 380 250\" width=\"380\" height=\"250\" font-family=\"Arial, sans-serif\" font-size=\"14\"><rect width=\"380\" height=\"250\" fill=\"#ffffff\"/><polygon points=\"40,210 340,210 248,37 40,37\" fill=\"#eef3e6\" stroke=\"#1d2433\" stroke-width=\"2\"/><polyline points=\"40,198 52,198 52,210\" fill=\"none\" stroke=\"#1d2433\" stroke-width=\"1.5\"/><polyline points=\"40,49 52,49 52,37\" fill=\"none\" stroke=\"#1d2433\" stroke-width=\"1.5\"/><text x=\"190\" y=\"232\" text-anchor=\"middle\" fill=\"#1d2433\">26 m<\/text><text x=\"144\" y=\"29\" text-anchor=\"middle\" fill=\"#1d2433\">18 m<\/text><text x=\"34\" y=\"128\" text-anchor=\"end\" fill=\"#1d2433\">15 m<\/text><\/svg><\/div>", "items": [{"id": "MTA-137", "niv": 1, "cp": "mt_formulacion", "cn": "", "e": "¿Cuál es el área del lote?", "f": "Área del trapecio", "vis": "", "o": [["A", "195 m².", "Calcula solo 26 × 15 ÷ 2, como si el lote fuera un triángulo de base 26 m.", false], ["B", "270 m².", "Multiplica solo la base menor por la altura (18 × 15).", false], ["C", "330 m².", "Área del trapecio = (B + b) × h ÷ 2 = (26 + 18) × 15 ÷ 2 = 330 m².", true], ["D", "390 m².", "Multiplica solo la base mayor por la altura (26 × 15), como si el lote fuera un rectángulo.", false]]}, {"id": "MTA-138", "niv": 2, "cp": "mt_formulacion", "cn": "", "e": "Para encerrar todo el lote con malla, ¿cuántos metros de malla se necesitan?", "f": "Perímetro y teorema de Pitágoras", "vis": "", "o": [["A", "59 m.", "Suma solo tres lados (18 + 26 + 15) y omite el lado inclinado.", false], ["B", "74 m.", "Supone que el lado inclinado mide 15 m, igual que el lado perpendicular; el lado inclinado es más largo.", false], ["C", "76 m.", "El lado inclinado es la hipotenusa de un triángulo de catetos 26 − 18 = 8 m y 15 m: √(64 + 225) = 17 m. Perímetro: 18 + 26 + 15 + 17 = 76 m.", true], ["D", "82 m.", "Toma el lado inclinado como 8 + 15 = 23 m, sumando los catetos en lugar de aplicar el teorema de Pitágoras.", false]]}]}, {"comp": "matematicas", "sim": "s11-1", "ses": 2, "ind": "Balotas en una bolsa", "tt": "", "texto": "Para una actividad, un profesor coloca en una bolsa 10 balotas del mismo tamaño: 6 rojas, 3 azules y 1 verde. Se saca una balota al azar.", "vis": "", "items": [{"id": "MTA-139", "niv": 1, "cp": "mt_formulacion", "cn": "", "e": "¿Cuál es la probabilidad de que la balota extraída no sea roja?", "f": "Probabilidad clásica", "vis": "", "o": [["A", "1/10.", "Es la probabilidad de sacar la balota verde únicamente.", false], ["B", "3/10.", "Es la probabilidad de sacar una balota azul; faltó contar la verde.", false], ["C", "2/5.", "No son rojas 3 + 1 = 4 de las 10 balotas: 4/10 = 2/5.", true], ["D", "3/5.", "Es la probabilidad de sacar una balota roja (6/10), lo contrario de lo que se pregunta.", false]]}, {"id": "MTA-140", "niv": 2, "cp": "mt_argumentacion", "cn": "", "e": "Juan afirma que, si se sacan dos balotas una tras otra sin devolver la primera, la probabilidad de que ambas sean rojas es 6/10 × 6/10. ¿Es correcta su afirmación?", "f": "Probabilidad de sucesos dependientes", "vis": "", "o": [["A", "No, porque sin devolución quedan 5 rojas entre 9 balotas: 6/10 × 5/9 = 1/3.", "Tras sacar una roja quedan 5 rojas entre 9 balotas; la probabilidad es 6/10 × 5/9 = 30/90 = 1/3, distinta de 36/100.", true], ["B", "Sí, porque la probabilidad de sacar roja es 6/10 en cada extracción, aunque no se devuelva.", "Eso solo es cierto si la primera balota se devuelve; sin devolverla cambian el total y el número de rojas.", false], ["C", "Sí, porque 6/10 × 6/10 = 36/100, que es menor que 6/10, como debe ser.", "Que el resultado sea menor que 6/10 no prueba que sea correcto; sin devolución, la segunda probabilidad es 5/9 y no 6/10.", false], ["D", "No, porque sin devolución las probabilidades se suman: 6/10 + 5/9.", "Para que ocurran ambos sucesos se multiplican las probabilidades; además, esa suma da más de 1.", false]]}]}, {"comp": "matematicas", "sim": "s11-1", "ses": 2, "ind": "Cambio de pesos a dólares", "tt": "", "texto": "La gráfica muestra la tasa de cambio de referencia (pesos por cada dólar) durante seis meses, con datos ficticios. Las casas de cambio venden los dólares por encima de esa tasa de referencia.", "vis": "<div class=\"vfig\"><svg class=\"vg\" viewBox=\"0 0 560 320\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Gráfica 9. Tasa de cambio (pesos por dólar)\" font-family=\"Arial, sans-serif\" font-size=\"12\"><rect width=\"560\" height=\"320\" fill=\"#ffffff\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"13\" fill=\"#1d2433\">Gráfica 9. Tasa de cambio (pesos por dólar)<\/text><line x1=\"60\" y1=\"258.0\" x2=\"540\" y2=\"258.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"262.0\" text-anchor=\"end\" fill=\"#3a4356\">0<\/text><line x1=\"60\" y1=\"213.6\" x2=\"540\" y2=\"213.6\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"217.6\" text-anchor=\"end\" fill=\"#3a4356\">1.000<\/text><line x1=\"60\" y1=\"169.2\" x2=\"540\" y2=\"169.2\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"173.2\" text-anchor=\"end\" fill=\"#3a4356\">2.000<\/text><line x1=\"60\" y1=\"124.8\" x2=\"540\" y2=\"124.8\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"128.8\" text-anchor=\"end\" fill=\"#3a4356\">3.000<\/text><line x1=\"60\" y1=\"80.4\" x2=\"540\" y2=\"80.4\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"84.4\" text-anchor=\"end\" fill=\"#3a4356\">4.000<\/text><line x1=\"60\" y1=\"36.0\" x2=\"540\" y2=\"36.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"40.0\" text-anchor=\"end\" fill=\"#3a4356\">5.000<\/text><line x1=\"60\" y1=\"258\" x2=\"540\" y2=\"258\" stroke=\"#3a4356\"/><line x1=\"60\" y1=\"258\" x2=\"60\" y2=\"36\" stroke=\"#3a4356\"/><text transform=\"translate(14,147.0) rotate(-90)\" text-anchor=\"middle\" fill=\"#3a4356\">Pesos por dólar<\/text><text x=\"300.0\" y=\"312\" text-anchor=\"middle\" fill=\"#3a4356\">Mes<\/text><text x=\"100.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Ene<\/text><text x=\"180.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Feb<\/text><text x=\"260.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Mar<\/text><text x=\"340.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Abr<\/text><text x=\"420.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">May<\/text><text x=\"500.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Jun<\/text><polyline fill=\"none\" stroke=\"#1660a8\" stroke-width=\"2.5\" points=\"100.0,76.0 180.0,78.2 260.0,81.3 340.0,82.6 420.0,79.5 500.0,75.1\"/><circle cx=\"100.0\" cy=\"76.0\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"100.0\" y=\"68.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">4.100<\/text><circle cx=\"180.0\" cy=\"78.2\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"180.0\" y=\"70.2\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">4.050<\/text><circle cx=\"260.0\" cy=\"81.3\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"260.0\" y=\"73.3\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">3.980<\/text><circle cx=\"340.0\" cy=\"82.6\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"340.0\" y=\"74.6\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">3.950<\/text><circle cx=\"420.0\" cy=\"79.5\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"420.0\" y=\"71.5\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">4.020<\/text><circle cx=\"500.0\" cy=\"75.1\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"500.0\" y=\"67.1\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">4.120<\/text><\/svg><\/div>", "items": [{"id": "MTA-141", "niv": 2, "cp": "mt_formulacion", "cn": "", "e": "Una persona va a viajar y necesita dólares. En junio, una casa de cambio vende cada dólar a $ 80 por encima de la tasa de referencia que muestra la gráfica y descuenta una comisión del 2 % de los pesos entregados antes de hacer el cambio. Si la persona entrega $ 2.100.000, ¿cuántos dólares recibe?", "f": "Cálculo propio", "vis": "", "o": [["A", "490 dólares.", "La casa vende a 4.120 + 80 = 4.200 pesos por dólar. Después de la comisión quedan 2.100.000 × 0,98 = 2.058.000 pesos; 2.058.000 ÷ 4.200 = 490 dólares.", true], ["B", "499,5 dólares.", "Usa la tasa de referencia (4.120) en lugar del precio de venta de la casa de cambio: 2.058.000 ÷ 4.120 ≈ 499,5.", false], ["C", "500 dólares.", "Divide 2.100.000 ÷ 4.200 y olvida descontar la comisión del 2 %.", false], ["D", "510 dólares.", "Suma la comisión en lugar de restarla: 2.100.000 × 1,02 ÷ 4.200 = 510.", false]]}, {"id": "MTA-142", "niv": 1, "cp": "mt_interpretacion", "cn": "", "e": "Otra persona tenía dólares y quería venderlos para recibir la mayor cantidad posible de pesos. Si el precio de compra sigue la tasa de referencia, ¿en qué mes le convenía más venderlos?", "f": "Lectura de la gráfica", "vis": "", "o": [["A", "En marzo.", "Marzo tuvo una de las tasas más bajas ($ 3.980); allí recibiría menos pesos por cada dólar.", false], ["B", "En junio.", "En junio la tasa fue la más alta ($ 4.120): cada dólar se cambiaba por más pesos que en los demás meses.", true], ["C", "En enero.", "En enero la tasa fue de $ 4.100, menor que la de junio.", false], ["D", "En abril.", "Abril tuvo la tasa más baja ($ 3.950); sería el peor mes para vender dólares.", false]]}]}, {"comp": "matematicas", "sim": "s11-1", "ses": 2, "ind": "Organización de libros en un estante", "tt": "", "texto": "Una bibliotecaria va a ubicar en fila 5 libros distintos en un estante. Dos de ellos forman una colección y deben quedar uno al lado del otro.", "vis": "", "items": [{"id": "MTA-150", "niv": 2, "cp": "mt_formulacion", "cn": "", "e": "¿De cuántas maneras distintas puede ordenar los 5 libros cumpliendo esa condición?", "f": "Permutaciones", "vis": "", "o": [["A", "24.", "Trata los dos libros de la colección como un bloque (4! = 24), pero olvida que dentro del bloque pueden intercambiarse.", false], ["B", "48.", "El bloque de la colección y los otros 3 libros se ordenan de 4! = 24 maneras, y los dos libros del bloque, de 2 maneras: 24 × 2 = 48.", true], ["C", "120.", "Es 5! = 120, el número de ordenamientos sin ninguna condición.", false], ["D", "240.", "Multiplica 5! por 2: cuenta ordenamientos en los que la colección no queda junta.", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "s11-1", "ses": 2, "ind": "Contaminación de un humedal urbano", "tt": "", "texto": "En un barrio de una ciudad intermedia, una fábrica vierte residuos al humedal que rodea el sector. Los vecinos han notado malos olores, muerte de peces y la desaparición de aves. Hasta ahora ningún habitante ha sufrido un daño de salud individual comprobado, pero la junta de acción comunal quiere que un juez ordene detener los vertimientos para proteger el ambiente, que es un bien de todos.", "vis": "", "items": [{"id": "SCA-103", "niv": 2, "cp": "sc_pensamiento_social", "cn": "", "e": "¿Qué mecanismo judicial está diseñado específicamente para el propósito de la junta de acción comunal?", "f": "Constitución Política de Colombia, art. 88 (acciones populares).", "vis": "", "o": [["A", "La acción de tutela, porque protege los derechos de cada vecino que presente la demanda.", "La tutela protege derechos fundamentales de personas determinadas; el caso dice que no hay un daño individual comprobado y lo que se busca proteger es un bien colectivo.", false], ["B", "El habeas corpus, porque los vecinos tienen derecho a vivir en un ambiente libre.", "El habeas corpus protege a quien está privado de la libertad de manera ilegal (art. 30); no tiene relación con la contaminación.", false], ["C", "El plebiscito, porque la comunidad decide por votación si la fábrica puede seguir operando.", "El plebiscito es un mecanismo de participación convocado por el Presidente para que el pueblo apoye o rechace una decisión del Ejecutivo; no es una acción judicial.", false], ["D", "La acción popular, porque protege derechos e intereses colectivos como el ambiente.", "Correcta. El artículo 88 de la Constitución señala que la ley regulará las acciones populares para proteger derechos e intereses colectivos relacionados, entre otros, con el ambiente y la salubridad pública.", true]]}]}, {"comp": "sociales_ciudadanas", "sim": "s11-1", "ses": 2, "ind": "Órganos de control del Estado", "tt": "", "texto": "En un municipio se denunció que el contrato para construir un puente se pagó por el doble de su valor real y que la obra quedó sin terminar. Al mismo tiempo, en una vereda del mismo municipio, varias familias desplazadas por la violencia no saben ante quién acudir para conocer y hacer valer sus derechos humanos.", "vis": "", "items": [{"id": "SCA-104", "niv": 2, "cp": "sc_pensamiento_social", "cn": "", "e": "¿Qué tipo de entidad tiene a su cargo vigilar la forma en que se manejaron los recursos públicos del contrato del puente?", "f": "Constitución Política de Colombia, arts. 117, 119, 241, 267, 272 y 282.", "vis": "", "o": [["A", "Una registraduría, como órgano de la organización electoral.", "La Registraduría se ocupa de la identificación de las personas y de organizar las elecciones; no vigila contratos ni gastos públicos.", false], ["B", "Una contraloría, como órgano de control fiscal.", "Correcta. Las contralorías vigilan la gestión fiscal, es decir, el manejo de los dineros públicos (art. 119 para la Contraloría General; art. 272 para las contralorías departamentales y municipales). La vigilancia fiscal de un contrato municipal corresponde a la contraloría territorial, en forma concurrente con la Contraloría General (art. 272, modificado por el Acto Legislativo 4 de 2019).", true], ["C", "Un tribunal constitucional, como guardián de la Constitución.", "La Corte Constitucional tiene la guarda de la integridad y supremacía de la Constitución (art. 241); no revisa cuentas ni contratos de los municipios.", false], ["D", "Una procuraduría, como órgano de control disciplinario.", "La Procuraduría vigila la conducta de los servidores públicos y adelanta procesos disciplinarios (art. 277); la vigilancia de la gestión fiscal, es decir, del manejo de los dineros, corresponde a las contralorías.", false]]}, {"id": "SCA-105", "niv": 1, "cp": "sc_pensamiento_social", "cn": "", "e": "¿A qué entidad podrían acudir las familias desplazadas para recibir orientación sobre el ejercicio y la defensa de sus derechos humanos?", "f": "Constitución Política de Colombia, arts. 118 y 282.", "vis": "", "o": [["A", "A la Defensoría del Pueblo.", "Correcta. El artículo 282 dispone que el Defensor del Pueblo vela por la promoción, el ejercicio y la divulgación de los derechos humanos, y debe orientar e instruir a los habitantes en el ejercicio y defensa de sus derechos.", true], ["B", "Al Consejo Nacional Electoral.", "El Consejo Nacional Electoral regula y vigila la actividad electoral y los partidos; no orienta a víctimas sobre sus derechos.", false], ["C", "A la Registraduría Nacional del Estado Civil.", "La Registraduría se encarga de la identificación de las personas y de organizar las elecciones; no orienta sobre la defensa de los derechos humanos.", false], ["D", "Al Banco de la República.", "El Banco de la República ejerce las funciones de banca central (art. 371); no atiende la defensa de derechos humanos.", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "s11-1", "ses": 2, "ind": "Constituciones de 1863 y 1886", "tt": "", "texto": "La tabla resume algunos rasgos de dos constituciones de Colombia en el siglo XIX.", "vis": "<table class=\"vt\"><caption>Tabla 9. Rasgos de dos constituciones<\/caption><thead><tr><th>Rasgo<\/th><th>Constitución de Rionegro (1863)<\/th><th>Constitución de 1886<\/th><\/tr><\/thead><tbody><tr><td>Nombre del país<\/td><td>Estados Unidos de Colombia<\/td><td>República de Colombia<\/td><\/tr><tr><td>Organización territorial<\/td><td>Estados soberanos con amplia autonomía<\/td><td>Departamentos sujetos al gobierno central<\/td><\/tr><tr><td>Religión<\/td><td>Libertad de cultos<\/td><td>La religión católica, reconocida como la de la nación<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Fuente: elaboración propia con base en los textos constitucionales.<\/div>", "items": [{"id": "SCA-110", "niv": 1, "cp": "sc_pensamiento_social", "cn": "", "e": "¿Qué cambio en la organización del Estado muestra la tabla?", "f": "Constituciones de 1863 (Rionegro) y 1886; Registraduría Nacional, «Historia del voto en Colombia».", "vis": "", "o": [["A", "El paso de un modelo centralista a uno federal.", "Es el cambio inverso: el federalismo corresponde a 1863 y el centralismo a 1886.", false], ["B", "El paso de la unión con Venezuela y Ecuador a un país independiente.", "La unión con Venezuela y Ecuador (la Gran Colombia) se disolvió hacia 1830, décadas antes de 1863; la tabla no trata ese cambio.", false], ["C", "El paso de una monarquía a una república.", "Ambas constituciones organizaron repúblicas; Colombia no fue una monarquía después de la independencia.", false], ["D", "El paso de un modelo federal a uno centralista.", "Correcta. La Constitución de Rionegro organizó el país en estados soberanos (federalismo) y la de 1886 lo convirtió en una república unitaria con departamentos y poder concentrado en el gobierno central.", true]]}, {"id": "SCA-111", "niv": 2, "cp": "sc_perspectivas", "cn": "", "e": "Un periódico ficticio de 1886 publicó: «Más de veinte años de estados soberanos nos dejaron guerras entre regiones y un gobierno nacional sin fuerza para imponer el orden. La nueva Carta devuelve a la nación la autoridad que perdió». ¿Qué postura expresa este texto?", "f": "Fuente primaria ficticia; contexto: la Regeneración y la Constitución de 1886.", "vis": "", "o": [["A", "La de quienes pedían ampliar el derecho al voto de las mujeres en todo el país.", "El texto no menciona el sufragio ni a las mujeres.", false], ["B", "La de quienes defendían que los estados conservaran su soberanía frente al gobierno nacional.", "El autor critica precisamente los «estados soberanos»; defiende lo contrario.", false], ["C", "La de quienes buscaban la separación definitiva entre la Iglesia y el Estado.", "El fragmento no habla de la relación con la Iglesia; además, la Constitución de 1886 no separó la Iglesia del Estado.", false], ["D", "La de quienes veían en la centralización del poder una forma de lograr orden y estabilidad.", "Correcta. El texto atribuye las guerras a la autonomía de los estados y celebra que la nueva Constitución devuelva autoridad al gobierno nacional, postura propia de los defensores de la Regeneración.", true]]}]}, {"comp": "sociales_ciudadanas", "sim": "s11-1", "ses": 2, "ind": "Inflación y política monetaria", "tt": "", "texto": "Un informe ficticio señala que, durante el último año, los precios de los alimentos, el arriendo y el transporte subieron mucho más rápido que los salarios. Para enfrentar la situación, la Junta Directiva del Banco de la República decidió subir su tasa de interés de intervención, lo que encarece los préstamos que los bancos ofrecen a hogares y empresas.", "vis": "", "items": [{"id": "SCA-114", "niv": 2, "cp": "sc_pensamiento_social", "cn": "", "e": "Según la Constitución, ¿cuál es el propósito del Banco de la República que explica esta decisión?", "f": "Constitución Política de Colombia, arts. 371 y 373.", "vis": "", "o": [["A", "Financiar directamente los programas sociales del Gobierno nacional.", "Financiar programas sociales no es el propósito constitucional del Banco; su función central es cuidar el poder de compra de la moneda.", false], ["B", "Velar por el mantenimiento de la capacidad adquisitiva de la moneda.", "Correcta. El artículo 373 de la Constitución dispone que el Estado, por intermedio del Banco de la República, velará por el mantenimiento de la capacidad adquisitiva de la moneda; controlar la inflación es la forma de cumplirlo.", true], ["C", "Vigilar la gestión fiscal de las entidades públicas.", "La vigilancia de la gestión fiscal corresponde a la Contraloría (art. 119), no al Banco de la República.", false], ["D", "Fijar los salarios de los trabajadores del sector privado.", "El Banco de la República no fija salarios; esa no es una de sus funciones.", false]]}, {"id": "SCA-115", "niv": 3, "cp": "sc_reflexivo_sistemico", "cn": "", "e": "¿Cuál de las siguientes es una consecuencia esperable de la medida en distintas dimensiones de la economía?", "f": "Concepto económico: tasa de interés de política monetaria y sus efectos.", "vis": "", "o": [["A", "Frena el alza de precios al reducir el crédito, pero también desacelera la inversión y el empleo.", "Correcta. Si los préstamos son más caros, hogares y empresas piden menos crédito y gastan menos; eso reduce la presión sobre los precios, pero también puede frenar la inversión y el empleo.", true], ["B", "Reduce la inflación, pero también obliga por norma a los comercios a bajar el precio de los alimentos.", "La tasa de interés no fija precios por orden de la autoridad: actúa encareciendo el crédito y moderando el gasto, lo que reduce la presión sobre los precios.", false], ["C", "Reduce la inflación y, como el crédito queda más barato, impulsa la inversión de las empresas y el empleo.", "Subir la tasa de interés encarece el crédito, no lo abarata; por eso tiende a frenar la inversión y el empleo, no a impulsarlos.", false], ["D", "Aumenta el consumo de los hogares, pero también eleva los precios, porque los préstamos se abaratan.", "Es al revés: subir la tasa encarece los préstamos y tiende a reducir el consumo financiado con crédito, lo que modera los precios.", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "s11-1", "ses": 2, "ind": "Prohibición de plásticos de un solo uso", "tt": "", "texto": "El concejo de un municipio costero estudia prohibir la venta de vasos, platos y pitillos de plástico de un solo uso, porque gran parte de la basura que llega a las playas es de este material. En el municipio funcionan tres pequeñas fábricas que producen esos artículos y emplean a unas ochenta personas. Los vendedores de comida en la playa temen que los empaques alternativos, como los de cartón o fibras vegetales, sean más caros.", "vis": "", "items": [{"id": "SCA-118", "niv": 1, "cp": "sc_reflexivo_sistemico", "cn": "", "e": "¿Qué dimensión del problema motiva principalmente la propuesta del concejo?", "f": "Análisis de dimensiones de una problemática.", "vis": "", "o": [["A", "La ambiental, por la acumulación de residuos plásticos en las playas.", "Correcta. El caso dice que la propuesta surge porque gran parte de la basura que llega a las playas es de plástico de un solo uso.", true], ["B", "La laboral, por el número de personas empleadas en las fábricas.", "El empleo en las fábricas es un efecto que preocupa, no el motivo de la propuesta.", false], ["C", "La política, por la rivalidad entre los partidos del concejo.", "El texto no habla de rivalidades partidistas.", false], ["D", "La cultural, por las costumbres alimentarias de los turistas.", "El caso no menciona costumbres alimentarias como motivo de la medida.", false]]}, {"id": "SCA-119", "niv": 2, "cp": "sc_reflexivo_sistemico", "cn": "", "e": "Si se aprueba la prohibición sin ninguna otra medida, ¿qué efecto en la dimensión económica es más probable a corto plazo?", "f": "Análisis de efectos de una intervención en distintas dimensiones.",
