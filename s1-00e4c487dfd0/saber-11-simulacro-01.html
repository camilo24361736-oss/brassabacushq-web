 "vis": "", "o": [["A", "Que aumente la demanda de vasos plásticos producidos por las tres pequeñas fábricas del municipio.", "Si se prohíbe su venta, la demanda de esos productos cae; no aumenta.", false], ["B", "Que las fábricas locales produzcan menos y los vendedores paguen más por los empaques.", "Correcta. Las fábricas perderían el mercado de esos productos y los vendedores tendrían que comprar empaques alternativos que, según el caso, temen que sean más caros.", true], ["C", "Que los vendedores de comida bajen sus precios por usar empaques nuevos.", "El caso indica que los empaques alternativos podrían ser más caros, lo que presionaría los precios hacia arriba.", false], ["D", "Que las fábricas vendan más fuera del municipio y compensen así toda la pérdida.", "Nada en el caso indica que las fábricas tengan mercados por fuera del municipio; a corto plazo, lo esperable es que pierdan ventas.", false]]}, {"id": "SCA-120", "niv": 3, "cp": "sc_reflexivo_sistemico", "cn": "", "e": "En lugar de la prohibición, las fábricas proponen seguir produciendo y encargarse de recoger y reciclar los vasos y platos usados en las playas. Frente a la prohibición, ¿qué efecto tendría esta propuesta?", "f": "Análisis de alternativas de solución y sus efectos.", "vis": "", "o": [["A", "Tendría el mismo efecto ambiental que la prohibición, siempre que las fábricas recojan una parte de los vasos.", "Recoger solo una parte de los vasos no equivale a dejar de venderlos: el resto puede seguir llegando a las playas.", false], ["B", "Obligaría a los vendedores de comida a comprar empaques de cartón o de fibras vegetales.", "Ese sería un efecto de la prohibición; con la propuesta de las fábricas los vendedores podrían seguir usando plástico.", false], ["C", "Eliminaría los empleos de las fábricas igual que la prohibición, aunque reduciría más la basura en las playas.", "Con esta propuesta las fábricas siguen produciendo, de modo que sus empleos se mantienen; y como el plástico sigue circulando, no reduciría más la basura que la prohibición.", false], ["D", "Mantendría los empleos, pero su efecto ambiental dependería de cuántos residuos se logren recoger.", "Correcta. Las fábricas seguirían operando, de modo que los empleos se conservan; pero el plástico seguiría circulando y la reducción de basura en las playas dependería de que la recolección funcione.", true]]}]}, {"comp": "sociales_ciudadanas", "sim": "s11-1", "ses": 2, "ind": "El Frente Nacional", "tt": "", "texto": "Después de la década de violencia entre liberales y conservadores y del gobierno militar de Gustavo Rojas Pinilla, los dirigentes de los dos partidos tradicionales firmaron acuerdos que dieron origen al Frente Nacional, vigente entre 1958 y 1974.", "vis": "", "items": [{"id": "SCA-128", "niv": 2, "cp": "sc_pensamiento_social", "cn": "", "e": "¿Cuál fue una característica central del Frente Nacional?", "f": "Enciclopedia de la Red Cultural del Banco de la República, «El Frente Nacional».", "vis": "", "o": [["A", "La entrega del poder a una junta militar por un período de dieciséis años.", "El Frente Nacional fue un pacto entre partidos civiles; la junta militar gobernó solo durante la transición de 1957 a 1958.", false], ["B", "La creación de un sistema federal con estados soberanos en todo el territorio.", "El federalismo con estados soberanos corresponde a la Constitución de Rionegro (1863), no al Frente Nacional.", false], ["C", "La alternancia presidencial entre liberales y conservadores y la paridad en los cargos públicos.", "Correcta. Durante 16 años la presidencia se alternó cada cuatro años entre un liberal y un conservador, y los cargos se repartieron por partes iguales entre los dos partidos.", true], ["D", "La participación de todos los partidos políticos en igualdad de condiciones con los dos tradicionales.", "Ocurrió lo contrario: el acuerdo repartía el poder solo entre liberales y conservadores, lo que limitó a otras fuerzas políticas.", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "s11-1", "ses": 2, "ind": "Ventas informales en el espacio público", "tt": "", "texto": "En el centro de una ciudad, decenas de vendedores informales ocupan los andenes de una calle comercial. Estas son algunas posiciones:\n\nVendedora informal: «Esta venta es lo único que tengo para mantener a mis hijos. Si me quitan de aquí, no tengo de qué vivir».\n\nDueño de un almacén: «Yo pago impuestos y arriendo, y ellos venden lo mismo frente a mi local sin pagar nada. Además, los clientes no pueden pasar».\n\nPeatón con discapacidad: «Con mi silla de ruedas no puedo usar el andén; me toca bajarme a la calle, entre los carros».\n\nFuncionaria de la alcaldía: «Proponemos trasladar a los vendedores a una plaza de mercado cubierta, a tres cuadras, con módulos gratuitos durante el primer año».", "vis": "", "items": [{"id": "SCA-137", "niv": 1, "cp": "sc_perspectivas", "cn": "", "e": "¿Qué tienen en común las preocupaciones del dueño del almacén y del peatón con discapacidad?", "f": "Análisis de las posiciones del caso.", "vis": "", "o": [["A", "Ambos proponen trasladar a los vendedores a una plaza de mercado.", "La propuesta de la plaza es de la funcionaria de la alcaldía; ni el comerciante ni el peatón la plantean.", false], ["B", "Ambos dependen de las ventas en la calle para vivir.", "Esa es la situación de la vendedora informal, no la del comerciante ni la del peatón.", false], ["C", "Ambos reclaman que los vendedores no pagan impuestos.", "Solo el dueño del almacén menciona los impuestos; el peatón no habla de eso.", false], ["D", "Ambos se ven afectados por la ocupación de los andenes.", "Correcta. El comerciante dice que los clientes no pueden pasar y el peatón no puede usar el andén con su silla de ruedas: a los dos les afecta que el andén esté ocupado.", true]]}, {"id": "SCA-138", "niv": 2, "cp": "sc_perspectivas", "cn": "", "e": "¿Qué inquietud de la vendedora debería resolver la propuesta de la alcaldía para que ella la acepte?", "f": "Relación entre perspectivas y propuestas de solución.", "vis": "", "o": [["A", "Que la plaza quede lejos del almacén para que no le haga competencia al comerciante.", "Esa sería una preocupación del comerciante, no de la vendedora.", false], ["B", "Que en la plaza de mercado pueda seguir obteniendo ingresos suficientes para mantener a su familia.", "Correcta. La vendedora se opone a ser retirada porque teme quedarse sin ingresos; la propuesta será aceptable para ella si garantiza que podrá seguir vendiendo y viviendo de su trabajo.", true], ["C", "Que la alcaldía cobre a los vendedores los mismos impuestos que pagan los almacenes.", "Cobrar impuestos no responde a la inquietud de la vendedora, que es conservar su sustento.", false], ["D", "Que los módulos de la plaza tengan espacio suficiente para que circulen sin problema las sillas de ruedas.", "La circulación de sillas de ruedas es la preocupación del peatón, no la de la vendedora.", false]]}, {"id": "SCA-139", "niv": 2, "cp": "sc_reflexivo_sistemico", "cn": "", "e": "Si la alcaldía retira a los vendedores sin ofrecerles ninguna alternativa, ¿qué efecto es más probable?", "f": "Análisis de efectos de una intervención en distintas dimensiones.", "vis": "", "o": [["A", "Mejoraría la circulación en los andenes, pero las familias de los vendedores perderían su fuente de ingresos.", "Correcta. La medida resolvería el problema de movilidad, pero afectaría la dimensión económica y social de los vendedores, que según la vendedora dependen de esa venta.", true], ["B", "Los peatones con discapacidad seguirían sin poder usar los andenes del centro.", "Si se retiran los vendedores, los andenes quedarían libres; el efecto sería el contrario.", false], ["C", "Los vendedores se formalizarían, porque tendrían que arrendar locales en el centro.", "Sin una alternativa, nada indica que los vendedores puedan pagar un local; lo más probable es que pierdan ingresos.", false], ["D", "Aumentarían las ventas de los vendedores informales, porque tendrían menos competencia de los almacenes del centro.", "Si se les retira sin alternativa, los vendedores no podrían vender allí; sus ventas no aumentarían.", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "s11-1", "ses": 2, "ind": "Discursos de la Guerra Fría", "tt": "", "texto": "Dos discursos ficticios de la década de 1950:\n\nDiscurso 1: «Nuestro sistema garantiza que cada persona pueda emprender, comprar, vender y acumular según su esfuerzo. La libertad económica es la base de las demás libertades. El modelo del bloque contrario, donde el Estado decide qué se produce, es una amenaza para el mundo libre».\n\nDiscurso 2: «En nuestro sistema los medios de producción pertenecen a la sociedad y el Estado planifica la economía para que nadie acumule a costa del trabajo ajeno. El modelo del bloque contrario, basado en la ganancia privada, es una amenaza para los trabajadores del mundo».", "vis": "", "items": [{"id": "SCA-140", "niv": 2, "cp": "sc_perspectivas", "cn": "", "e": "¿Qué modelos defienden los dos discursos?", "f": "Historia universal: Guerra Fría; conceptos de capitalismo y socialismo.", "vis": "", "o": [["A", "Los dos defienden el socialismo, pero con distinto grado de planificación estatal.", "El discurso 1 defiende la libertad de emprender y acumular y critica la planificación estatal; no es socialista.", false], ["B", "El discurso 1 defiende el socialismo y el discurso 2, el capitalismo de libre mercado.", "Es al revés: quien defiende la acumulación según el esfuerzo es el discurso 1 (capitalismo), y la planificación estatal es propia del discurso 2.", false], ["C", "El discurso 1 defiende el capitalismo y el discurso 2, el socialismo de planificación estatal.", "Correcta. El discurso 1 exalta la libertad de emprender y acumular; el discurso 2 defiende la propiedad social de los medios de producción y la planificación estatal.", true], ["D", "Los dos defienden el capitalismo, pero con diferentes niveles de impuestos.", "El discurso 2 rechaza la ganancia privada y defiende la planificación estatal; no es un defensor del capitalismo.", false]]}, {"id": "SCA-141", "niv": 3, "cp": "sc_perspectivas", "cn": "", "e": "¿Qué tienen en común las estrategias discursivas de los dos textos?", "f": "Análisis de discursos: estrategias e intenciones.", "vis": "", "o": [["A", "Los dos se apoyan en estadísticas económicas para comparar los resultados de los bloques.", "Los discursos no presentan cifras ni estadísticas; se basan en afirmaciones de principio.", false], ["B", "Los dos proponen negociar un acuerdo para unificar los sistemas económicos.", "No hay ninguna propuesta de negociación ni de unificación en los textos.", false], ["C", "Los dos reconocen que el modelo contrario tiene ventajas que su propio bloque haría bien en imitar cuanto antes.", "Ninguno reconoce ventajas en el modelo rival; ambos lo presentan como amenaza.", false], ["D", "Cada uno presenta su propio modelo como garantía de bienestar y describe el modelo rival como una amenaza.", "Correcta. Ambos discursos exaltan las virtudes de su sistema y califican al bloque contrario de «amenaza», un recurso típico de la confrontación ideológica de la Guerra Fría.", true]]}]}, {"comp": "sociales_ciudadanas", "sim": "s11-1", "ses": 2, "ind": "Proyecto minero y comunidad indígena", "tt": "", "texto": "Una empresa obtuvo un título para explorar oro en un área cercana al territorio de una comunidad indígena. En una reunión se expresaron estas posiciones:\n\nGobernador indígena: «En esa montaña nacen las quebradas que nos dan agua y allí están nuestros sitios sagrados. Queremos que se nos consulte y que se respete nuestra decisión».\n\nRepresentante de la empresa: «Cumpliremos los estudios ambientales y daremos empleo a la gente de la zona. La explotación traerá recursos para la región».\n\nFuncionario del Ministerio: «Necesitamos que el proyecto avance, pero también garantizar que la comunidad participe en las decisiones que la afectan».", "vis": "", "items": [{"id": "SCA-142", "niv": 1, "cp": "sc_perspectivas", "cn": "", "e": "¿Qué tipo de argumentos usa el gobernador indígena para oponerse a que el proyecto avance sin consulta?", "f": "Análisis de las posiciones del caso.", "vis": "", "o": [["A", "Argumentos económicos y laborales.", "Los argumentos económicos y laborales (empleo, recursos para la región) son los del representante de la empresa.", false], ["B", "Argumentos ambientales y culturales.", "Correcta. El gobernador se refiere al nacimiento de las quebradas que les dan agua (ambiental) y a sus sitios sagrados (cultural).", true], ["C", "Argumentos sobre el progreso de la región.", "El progreso y los recursos para la región son parte del discurso de la empresa, no del gobernador.", false], ["D", "Argumentos técnicos sobre los estudios ambientales.", "Los estudios ambientales los menciona el representante de la empresa; el gobernador no discute aspectos técnicos.", false]]}, {"id": "SCA-143", "niv": 2, "cp": "sc_perspectivas", "cn": "", "e": "¿En qué coinciden el gobernador indígena y el funcionario del Ministerio?", "f": "Comparación de perspectivas de actores.", "vis": "", "o": [["A", "En que la comunidad indígena debe tener voz sobre el futuro del proyecto.", "Correcta. El gobernador pide que se les consulte y el funcionario dice que hay que garantizar que la comunidad participe en las decisiones que la afectan.", true], ["B", "En que la empresa ya cumplió todos los estudios ambientales exigidos.", "El representante dice que cumplirá los estudios, en futuro; ninguno afirma que ya se cumplieron.", false], ["C", "En que la explotación traerá recursos económicos para la región.", "Esa idea la expresa el representante de la empresa, no el gobernador.", false], ["D", "En que el proyecto minero debe avanzar lo más rápido posible para generar empleo.", "El funcionario quiere que el proyecto avance, pero el gobernador no expresa ese deseo.", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "s11-1", "ses": 2, "ind": "Restricción vehicular en una ciudad", "tt": "", "texto": "Una ciudad con graves problemas de trancones decide que los carros particulares no podrán circular dos días a la semana en horas pico, según el último número de su placa. La medida busca reducir el tiempo de los desplazamientos y la contaminación del aire.", "vis": "", "items": [{"id": "SCA-144", "niv": 1, "cp": "sc_reflexivo_sistemico", "cn": "", "e": "La alcaldía quiere saber, después de un año, si la medida cumplió sus objetivos. ¿Qué par de datos le serviría más para evaluarla?", "f": "Análisis de dimensiones de una medida pública.", "vis": "", "o": [["A", "La venta de carros nuevos y el precio de la gasolina.", "Estos datos pueden estar relacionados con el tráfico, pero no miden directamente los dos objetivos de la medida.", false], ["B", "El número de multas impuestas y el dinero recaudado con ellas.", "Las multas muestran cuánto se ha incumplido o controlado la medida, pero no si bajaron los tiempos de viaje o la contaminación.", false], ["C", "La duración promedio de los viajes y el nivel de contaminación del aire.", "Correcta. La medida busca reducir el tiempo de los desplazamientos y la contaminación del aire; esos dos datos permiten saber si lo logró.", true], ["D", "El número de accidentes de tránsito y de peatones heridos.", "La seguridad vial es importante, pero no es uno de los objetivos que el caso atribuye a la medida.", false]]}, {"id": "SCA-145", "niv": 2, "cp": "sc_reflexivo_sistemico", "cn": "", "e": "Después de varios años, se observa que muchas familias compraron un segundo carro con otro número de placa para circular todos los días. ¿Qué muestra esta situación?", "f": "Análisis de efectos no previstos de una política pública.", "vis": "", "o": [["A", "Que la medida afectó sobre todo a quienes se movilizan en transporte público.", "La restricción se aplica a carros particulares; la situación descrita no habla de los usuarios del transporte público.", false], ["B", "Que la medida logró su objetivo, porque cada carro circula menos días a la semana.", "Aunque cada carro circule menos días, hay más carros: las familias con dos vehículos circulan todos los días, así que el objetivo se debilita.", false], ["C", "Que la medida redujo la cantidad de carros particulares en la ciudad.", "La compra de segundos carros aumenta el número de vehículos, no lo reduce.", false], ["D", "Que la reacción de las personas debilitó el efecto buscado por la medida.", "Correcta. Al comprar un segundo vehículo, las familias evitan la restricción y vuelve a aumentar el número de carros en circulación, lo que reduce la eficacia de la medida.", true]]}]}, {"comp": "sociales_ciudadanas", "sim": "s11-1", "ses": 2, "ind": "Deforestación en la Amazonía", "tt": "", "texto": "En un municipio amazónico, grandes extensiones de selva se han talado para convertirlas en potreros para ganado. Algunos campesinos dicen que no tienen otra forma de ganarse la vida, mientras que científicos advierten que la pérdida de bosque altera la humedad del aire y el ciclo de las lluvias, y afecta la biodiversidad y a los pueblos indígenas que viven de la selva.", "vis": "", "items": [{"id": "SCA-146", "niv": 3, "cp": "sc_reflexivo_sistemico", "cn": "", "e": "¿Cuál de estas propuestas atiende a la vez la dimensión ambiental y la económica del problema?", "f": "Análisis de alternativas de solución en distintas dimensiones.", "vis": "", "o": [["A", "Dar créditos para comprar más ganado y ampliar los potreros existentes.", "Podría mejorar ingresos a corto plazo, pero aumentaría la presión para talar; empeora la dimensión ambiental.", false], ["B", "Declarar toda la zona como área protegida, sin definir de qué vivirán los campesinos.", "Atiende lo ambiental, pero deja sin alternativa de ingresos a los campesinos; no considera la dimensión económica.", false], ["C", "Ayudar a producir más leche y carne en los potreros que ya existen, a cambio de no talar más selva.", "Correcta. Si los potreros actuales producen más, los campesinos pueden mejorar sus ingresos (dimensión económica) sin abrir nuevos potreros, y el compromiso de no talar protege la selva (dimensión ambiental).", true], ["D", "Construir una carretera nueva que atraviese la selva para sacar el ganado más rápido hacia los mercados.", "Facilita la comercialización del ganado, pero las vías en la selva suelen abrir paso a más tala; no protege la dimensión ambiental.", false]]}, {"id": "SCA-147", "niv": 2, "cp": "sc_reflexivo_sistemico", "cn": "", "e": "¿Por qué la deforestación de la Amazonía puede afectar a poblaciones que viven lejos de ella?", "f": "Relación entre dimensiones ambientales y espaciales de una problemática.", "vis": "", "o": [["A", "Porque los bosques intervienen en procesos del clima que abarcan regiones extensas.", "Correcta. El bosque aporta humedad al aire y participa en la formación de lluvias; esos procesos atmosféricos tienen alcance regional, más allá del área talada, como advierten los científicos del caso.", true], ["B", "Porque los indígenas de la selva se trasladan a vivir a esas poblaciones lejanas.", "El caso menciona que los pueblos indígenas resultan afectados, pero no habla de su traslado.", false], ["C", "Porque la carne de los nuevos potreros se vende sobre todo en ciudades lejanas.", "El caso no dice dónde se vende la carne, y eso no explica un efecto ambiental a distancia.", false], ["D", "Porque la tala reduce la cantidad de ganado en las regiones vecinas al municipio.", "La tala se hace para ampliar potreros, lo que aumentaría el ganado; además, no es lo que plantean los científicos.", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "s11-1", "ses": 2, "ind": "Aumento del salario mínimo", "tt": "", "texto": "Un país discute cuánto debe aumentar el salario mínimo del próximo año. Los sindicatos piden un alza alta para que los trabajadores recuperen poder de compra; las asociaciones de pequeños negocios advierten que un alza muy grande puede hacer que algunas empresas no puedan pagar a todos sus empleados formales.", "vis": "", "items": [{"id": "SCA-148", "niv": 3, "cp": "sc_reflexivo_sistemico", "cn": "", "e": "¿Qué relación entre dimensiones permite entender por qué la decisión es difícil?", "f": "Análisis de dimensiones y tensiones en una decisión económica.", "vis": "", "o": [["A", "Los sindicatos y los pequeños negocios coinciden en preferir un alza alta.", "El caso muestra intereses distintos: los sindicatos piden un alza alta y los pequeños negocios temen un alza muy grande.", false], ["B", "Un alza mejora el ingreso de quienes ganan el mínimo, pero encarece la nómina de los pequeños negocios.", "Correcta. La decisión implica una tensión: favorece el poder de compra de los trabajadores (dimensión social) y, al mismo tiempo, encarece la nómina de las empresas pequeñas (dimensión económica).", true], ["C", "Los sindicatos piden un alza alta porque así crecería el empleo formal en los pequeños negocios del país.", "El caso dice que los sindicatos buscan recuperar poder de compra, y que los pequeños negocios temen precisamente lo contrario: no poder pagar a todos sus empleados formales.", false], ["D", "Los pequeños negocios temen que un alza haga bajar los precios de lo que venden.", "Los pequeños negocios no hablan de sus precios de venta; su preocupación es el costo de pagar a sus empleados.", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "s11-1", "ses": 2, "ind": "Presupuesto participativo", "tt": "", "texto": "Una alcaldía decide que una parte del presupuesto de inversión de cada barrio se asignará a proyectos elegidos directamente por sus habitantes en asambleas abiertas y votaciones.", "vis": "", "items": [{"id": "SCA-149", "niv": 1, "cp": "sc_reflexivo_sistemico", "cn": "", "e": "El artículo 1 de la Constitución enumera varias características del Estado colombiano. ¿Cuál de ellas se expresa de manera directa en esta decisión?", "f": "Constitución Política de Colombia, art. 1.", "vis": "", "o": [["A", "Su carácter confesional.", "El artículo 1 no establece una religión oficial; la Constitución de 1991 garantiza la libertad de cultos (art. 19). Nada en el caso tiene que ver con religión.", false], ["B", "Su carácter presidencialista.", "El artículo 1 no menciona el presidencialismo; y la decisión de la alcaldía no fortalece al Presidente, sino la participación directa de los habitantes.", false], ["C", "Su carácter participativo.", "Correcta. El artículo 1 define a Colombia como una república democrática, participativa y pluralista; permitir que los habitantes decidan sobre parte del presupuesto amplía su participación directa.", true], ["D", "Su carácter federal.", "El artículo 1 define a Colombia como república unitaria, no federal; además, el federalismo se refiere a la organización territorial, no a la participación ciudadana.", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "s11-1", "ses": 2, "ind": "Sequía y racionamiento de agua", "tt": "", "texto": "Durante un fenómeno de El Niño, las lluvias en la región andina fueron mucho menores que lo normal. Los embalses que abastecen a una ciudad bajaron de nivel y la empresa de acueducto anunció cortes de agua por sectores.", "vis": "", "items": [{"id": "SCA-150", "niv": 1, "cp": "sc_reflexivo_sistemico", "cn": "", "e": "¿Qué relación se establece en el caso?", "f": "IDEAM, comunicados sobre el fenómeno de El Niño (disminución de lluvias en las regiones Andina, Caribe y Pacífica).", "vis": "", "o": [["A", "Un fenómeno climático redujo la disponibilidad de agua y eso afectó el servicio para la población.", "Correcta. La disminución de las lluvias (dimensión ambiental) bajó el nivel de los embalses y obligó a racionar el agua (dimensión social y de servicios públicos).", true], ["B", "Los cortes de agua de la ciudad provocaron la disminución de las lluvias en la región.", "La relación causal está invertida: la falta de lluvias causó los cortes, no al revés.", false], ["C", "El aumento de las lluvias llenó los embalses y obligó a cerrar las compuertas.", "El caso dice que las lluvias fueron menores que lo normal, no mayores.", false], ["D", "El aumento del número de usuarios en la ciudad obligó a la empresa a racionar el agua.", "El caso no menciona un aumento de usuarios; vincula los cortes con el descenso de los embalses por la falta de lluvias.", false]]}]}, {"comp": "ciencias_naturales", "sim": "s11-1", "ses": 2, "ind": "Origen de la masa de un árbol", "tt": "", "texto": "Una semilla de pocos gramos se convierte, al cabo de varios años, en un árbol cuya madera seca pesa cientos de kilogramos. La madera está formada principalmente por celulosa, un compuesto de carbono, hidrógeno y oxígeno que la planta fabrica a partir de la glucosa.", "vis": "", "items": [{"id": "CNA-103", "niv": 2, "cp": "cn_uso_comprensivo", "cn": "biologico", "e": "¿De dónde proviene la mayor parte de la masa seca que gana el árbol al crecer?", "f": "Concepto: fotosíntesis y fijación de carbono", "vis": "", "o": [["A", "Del agua que absorbe por las raíces y que se va acumulando poco a poco en sus tejidos.", "El agua acumulada no forma parte de la masa seca; el agua aporta hidrógeno a la glucosa, pero el carbono, que es la base de la celulosa, procede del CO₂.", false], ["B", "Del dióxido de carbono que la planta toma del aire y fija mediante la fotosíntesis.", "En la fotosíntesis la planta fija el carbono (y el oxígeno) del CO₂ atmosférico en glucosa, con la que fabrica celulosa; el carbono y el oxígeno constituyen la mayor parte de la masa seca de la madera.", true], ["C", "De los minerales que las raíces absorben del suelo durante el crecimiento.", "Los minerales (nitrógeno, fósforo, potasio, etc.) son indispensables, pero representan una fracción pequeña de la masa seca; la celulosa está hecha sobre todo de carbono y oxígeno.", false], ["D", "Del oxígeno del aire que la planta absorbe por las hojas para respirar.", "El oxígeno que la planta usa en la respiración se combina para liberar energía y sale como CO₂ y agua; no es la fuente de la masa que se acumula en la madera.", false]]}]}, {"comp": "ciencias_naturales", "sim": "s11-1", "ses": 2, "ind": "Regulación de la temperatura corporal", "tt": "", "texto": "Durante una carrera en un día caluroso, la temperatura corporal de una atleta tiende a subir. Su organismo responde, entre otras cosas, produciendo sudor.", "vis": "", "items": [{"id": "CNA-106", "niv": 1, "cp": "cn_explicacion", "cn": "biologico", "e": "¿Cómo ayuda el sudor a regular la temperatura del cuerpo?", "f": "Concepto: homeostasis y termorregulación", "vis": "", "o": [["A", "El sudor forma una capa sobre la piel que impide que el calor del ambiente entre al cuerpo.", "El sudor no funciona como aislante; su efecto refrigerante se debe a que se evapora y absorbe calor.", false], ["B", "El sudor elimina las sales minerales que producen el calor dentro del cuerpo.", "Las sales que se pierden con el sudor no son la fuente del calor corporal, que proviene sobre todo del metabolismo celular.", false], ["C", "El sudor sale más frío que la sangre y transfiere ese frío a la piel.", "El sudor sale a la temperatura del cuerpo; además, lo que se transfiere es calor, no «frío». El enfriamiento ocurre por la evaporación.", false], ["D", "Al evaporarse sobre la piel, el agua del sudor absorbe calor del cuerpo y así lo enfría.", "La evaporación requiere energía (calor de vaporización), que el agua toma de la piel; por eso el cuerpo pierde calor.", true]]}]}, {"comp": "ciencias_naturales", "sim": "s11-1", "ses": 2, "ind": "Glóbulos rojos en distintas soluciones", "tt": "", "texto": "En un laboratorio se colocan glóbulos rojos en tres soluciones: agua destilada, solución salina al 0,9 % (con la misma concentración de solutos que el plasma sanguíneo) y solución salina al 5 %. Al observarlos al microscopio, los glóbulos rojos en agua destilada aparecen hinchados y algunos han estallado.", "vis": "", "items": [{"id": "CNA-107", "niv": 2, "cp": "cn_explicacion", "cn": "biologico", "e": "¿Qué explica lo que les ocurrió a los glóbulos rojos en el agua destilada?", "f": "Concepto: ósmosis y membrana celular", "vis": "", "o": [["A", "El agua entró a las células por ósmosis, pues su citoplasma tiene más solutos que el agua destilada.", "En la ósmosis el agua atraviesa la membrana desde donde hay menos solutos (agua destilada) hacia donde hay más (citoplasma); la célula se llena de agua y puede romperse.", true], ["B", "El agua salió de las células hacia el medio, porque por ósmosis el agua se mueve hacia donde hay menos solutos.", "Invierte el sentido de la ósmosis: el agua se mueve hacia donde hay más solutos. Además, si el agua saliera, las células se encogerían, no se hincharían.", false], ["C", "Las células absorbieron el agua por transporte activo para obtener energía de ella.", "La ósmosis es un transporte pasivo que no gasta ATP, y el agua no es una fuente de energía para la célula.", false], ["D", "La sal salió de las células hacia el agua destilada y el espacio que dejó fue ocupado por aire.", "El hinchamiento se debe a la entrada de agua, no de aire; la membrana no deja pasar aire para «llenar» espacios.", false]]}]}, {"comp": "ciencias_naturales", "sim": "s11-1", "ses": 2, "ind": "Desaparición de un depredador", "tt": "", "texto": "En un bosque andino, un ave rapaz se alimenta casi exclusivamente de un roedor herbívoro, que a su vez come semillas y brotes de plantas nativas. Durante varios años, la cacería ilegal hace desaparecer al ave rapaz de la zona; ningún otro depredador consume a ese roedor en cantidades importantes.", "vis": "", "items": [{"id": "CNA-108", "niv": 2, "cp": "cn_explicacion", "cn": "biologico", "e": "¿Cuál es el efecto más probable en los años siguientes?", "f": "Concepto: relaciones depredador-presa y cascadas tróficas", "vis": "", "o": [["A", "Las plantas nativas aumentan, porque el ave rapaz también se alimentaba de ellas.", "El texto dice que el ave se alimenta casi exclusivamente del roedor; no consume plantas.", false], ["B", "La población del roedor disminuye, porque al faltar el depredador la cadena alimentaria se rompe y le falta alimento.", "El alimento del roedor son las plantas, que no dependen del ave rapaz; quitar el depredador elimina una causa de muerte del roedor, no su alimento.", false], ["C", "La población del roedor aumenta y disminuyen los brotes y semillas de las plantas que consume.", "Sin su principal depredador, la población de roedores crece y aumenta la presión de consumo sobre las plantas de las que se alimenta.", true], ["D", "Otros depredadores ocupan el lugar del ave rapaz y mantienen estable la población del roedor.", "El texto indica que ningún otro depredador consume al roedor en cantidades importantes; no hay quién reemplace al ave rapaz.", false]]}]}, {"comp": "ciencias_naturales", "sim": "s11-1", "ses": 2, "ind": "Luz y producción de oxígeno en Elodea", "tt": "", "texto": "Para estudiar la fotosíntesis, un grupo de estudiantes colocó una rama de Elodea (planta acuática) dentro de un tubo con agua e iluminó el tubo con una lámpara situada a distintas distancias. En cada caso contaron las burbujas de oxígeno liberadas por minuto. Entre la lámpara y el tubo pusieron un recipiente con agua.", "vis": "<div class=\"vfig\"><svg class=\"vg\" viewBox=\"0 0 560 320\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Gráfica 10. Burbujas de oxígeno según la distancia a la lámpara\" font-family=\"Arial, sans-serif\" font-size=\"12\"><rect width=\"560\" height=\"320\" fill=\"#ffffff\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"13\" fill=\"#1d2433\">Gráfica 10. Burbujas de oxígeno según la distancia a la lámpara<\/text><line x1=\"60\" y1=\"258.0\" x2=\"540\" y2=\"258.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"262.0\" text-anchor=\"end\" fill=\"#3a4356\">0<\/text><line x1=\"60\" y1=\"213.6\" x2=\"540\" y2=\"213.6\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"217.6\" text-anchor=\"end\" fill=\"#3a4356\">10<\/text><line x1=\"60\" y1=\"169.2\" x2=\"540\" y2=\"169.2\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"173.2\" text-anchor=\"end\" fill=\"#3a4356\">20<\/text><line x1=\"60\" y1=\"124.8\" x2=\"540\" y2=\"124.8\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"128.8\" text-anchor=\"end\" fill=\"#3a4356\">30<\/text><line x1=\"60\" y1=\"80.4\" x2=\"540\" y2=\"80.4\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"84.4\" text-anchor=\"end\" fill=\"#3a4356\">40<\/text><line x1=\"60\" y1=\"36.0\" x2=\"540\" y2=\"36.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"40.0\" text-anchor=\"end\" fill=\"#3a4356\">50<\/text><line x1=\"60\" y1=\"258\" x2=\"540\" y2=\"258\" stroke=\"#3a4356\"/><line x1=\"60\" y1=\"258\" x2=\"60\" y2=\"36\" stroke=\"#3a4356\"/><text transform=\"translate(14,147.0) rotate(-90)\" text-anchor=\"middle\" fill=\"#3a4356\">Burbujas por minuto<\/text><text x=\"300.0\" y=\"312\" text-anchor=\"middle\" fill=\"#3a4356\">Distancia lámpara-planta (cm)<\/text><text x=\"120.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">10<\/text><text x=\"240.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">20<\/text><text x=\"360.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">30<\/text><text x=\"480.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">40<\/text><polyline fill=\"none\" stroke=\"#1660a8\" stroke-width=\"2.5\" points=\"120.0,44.9 240.0,124.8 360.0,182.5 480.0,218.0\"/><circle cx=\"120.0\" cy=\"44.9\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"120.0\" y=\"36.9\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">48<\/text><circle cx=\"240.0\" cy=\"124.8\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"240.0\" y=\"116.8\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">30<\/text><circle cx=\"360.0\" cy=\"182.5\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"360.0\" y=\"174.5\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">17<\/text><circle cx=\"480.0\" cy=\"218.0\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"480.0\" y=\"210.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">9<\/text><\/svg><\/div>", "items": [{"id": "CNA-111", "niv": 1, "cp": "cn_indagacion", "cn": "biologico", "e": "¿Cuál es la variable independiente en este experimento?", "f": "Indagación: identificación de variables", "vis": "", "o": [["A", "El número de burbujas producidas por minuto.", "Es la variable dependiente: lo que se mide como respuesta al cambio de distancia.", false], ["B", "La temperatura del agua dentro del tubo.", "No es la variable que se cambió a propósito; el recipiente con agua buscaba precisamente que no variara (variable controlada).", false], ["C", "La especie de planta acuática utilizada.", "Se usó siempre Elodea; la especie no se varió, así que no es la variable independiente.", false], ["D", "La distancia entre la lámpara y la planta.", "Es la variable que los estudiantes cambiaron a propósito (10, 20, 30 y 40 cm) para ver su efecto.", true]]}, {"id": "CNA-112", "niv": 2, "cp": "cn_indagacion", "cn": "biologico", "e": "¿Qué conclusión se apoya en los resultados de la gráfica?", "f": "Indagación: conclusiones a partir de datos", "vis": "", "o": [["A", "La temperatura del agua fue el factor que más influyó en la cantidad de oxígeno que produjo la planta.", "El experimento no varió la temperatura a propósito (el montaje buscaba mantenerla), así que no permite evaluar su efecto.", false], ["B", "Al alejar la lámpara baja la producción de oxígeno: la intensidad de la luz influye en la fotosíntesis.", "Al aumentar la distancia llega menos luz a la planta y el número de burbujas baja de 48 a 9 por minuto, con un montaje pensado para evitar cambios de temperatura.", true], ["C", "La producción es inversamente proporcional a la distancia, de modo que al duplicarla se reduce a la mitad.", "De 10 a 20 cm las burbujas pasan de 48 a 30, y de 20 a 40 cm, de 30 a 9: al duplicar la distancia no se reducen a la mitad.", false], ["D", "A partir de 30 cm la luz ya no influye en la planta, porque las burbujas cambian poco entre 30 y 40 cm.", "De 30 a 40 cm las burbujas pasan de 17 a 9 por minuto, casi la mitad: la luz sigue influyendo.", false]]}, {"id": "CNA-113", "niv": 3, "cp": "cn_indagacion", "cn": "biologico", "e": "¿Por qué era importante poner el recipiente con agua entre la lámpara y el tubo?", "f": "Indagación: control de variables", "vis": "", "o": [["A", "Porque el agua del recipiente aporta el dióxido de carbono que la planta necesita para realizar la fotosíntesis en el tubo.", "El agua del recipiente no está en contacto con la planta; la planta toma el CO₂ del agua del tubo.", false], ["B", "Porque la lámpara también calienta, y así se evitaba que un cambio de temperatura explicara la diferencia en las burbujas.", "El agua absorbe parte del calor de la lámpara; al mantener la temperatura constante, el cambio en las burbujas puede atribuirse a la luz y no al calentamiento.", true], ["C", "Porque el agua del recipiente ampliaba la imagen del tubo y facilitaba contar las burbujas.", "Contar burbujas no depende de ese recipiente; su propósito era controlar la temperatura, como confirma el termómetro.", false], ["D", "Porque así la luz llegaba con mayor intensidad a la planta cuando la lámpara estaba lejos.", "El agua no aumenta la intensidad de la luz; su función en el montaje es absorber calor.", false]]}]}, {"comp": "ciencias_naturales", "sim": "s11-1", "ses": 2, "ind": "Condiciones para la germinación del fríjol", "tt": "", "texto": "Un estudiante puso 50 semillas de fríjol en cada uno de cuatro recipientes con algodón y registró el porcentaje de semillas que germinaron al cabo de 7 días. La única diferencia entre los recipientes fueron las condiciones que muestra la tabla.", "vis": "<table class=\"vt\"><caption>Tabla 10. Germinación de semillas de fríjol en 7 días<\/caption><thead><tr><th>Grupo<\/th><th>Agua<\/th><th>Luz<\/th><th>Temperatura<\/th><th>Semillas germinadas (%)<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>Sí<\/td><td>Sí<\/td><td>25 °C<\/td><td>90<\/td><\/tr><tr><td>2<\/td><td>No<\/td><td>Sí<\/td><td>25 °C<\/td><td>0<\/td><\/tr><tr><td>3<\/td><td>Sí<\/td><td>No (oscuridad)<\/td><td>25 °C<\/td><td>88<\/td><\/tr><tr><td>4<\/td><td>Sí<\/td><td>Sí<\/td><td>5 °C<\/td><td>6<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Datos ficticios.<\/div>", "items": [{"id": "CNA-114", "niv": 1, "cp": "cn_indagacion", "cn": "biologico", "e": "¿Qué grupos debe comparar el estudiante para saber si la temperatura afecta la germinación?", "f": "Indagación: diseño experimental y comparación de grupos", "vis": "", "o": [["A", "Los grupos 1 y 3.", "Difieren en la luz; sirven para estudiar si la luz es necesaria.", false], ["B", "Los grupos 2 y 4.", "Difieren en dos variables a la vez (agua y temperatura), así que no se puede saber cuál causa la diferencia.", false], ["C", "Los grupos 1 y 2.", "Difieren en el agua, no en la temperatura; sirven para estudiar el efecto del agua.", false], ["D", "Los grupos 1 y 4.", "Solo difieren en la temperatura (25 °C y 5 °C); el agua y la luz son iguales en ambos.", true]]}, {"id": "CNA-115", "niv": 2, "cp": "cn_indagacion", "cn": "biologico", "e": "¿Qué conclusión es válida para estas semillas, según los resultados?", "f": "Indagación: conclusiones a partir de datos", "vis": "", "o": [["A", "El agua y la luz son igualmente necesarias para que estas semillas germinen.", "Sin agua la germinación fue 0 %, pero sin luz fue 88 %; la luz no resultó necesaria.", false], ["B", "La temperatura influye más que el agua, porque a 5 °C germinaron menos semillas que en la oscuridad.", "Sin agua germinó el 0 % y a 5 °C el 6 %; la falta de agua tuvo un efecto mayor. Además, comparar con el grupo en oscuridad mezcla dos variables.", false], ["C", "La luz no es necesaria para que germinen, pero el agua sí lo es, según los grupos 1, 2 y 3.", "En oscuridad germinó el 88 % (frente al 90 % con luz), una diferencia muy pequeña; sin agua no germinó ninguna.", true], ["D", "La oscuridad impide la germinación, porque las semillas necesitan luz para hacer fotosíntesis.", "En oscuridad germinó el 88 %; la semilla germina con las reservas que tiene almacenadas, sin depender de la fotosíntesis.", false]]}]}, {"comp": "ciencias_naturales", "sim": "s11-1", "ses": 2, "ind": "Producción de gas por levaduras", "tt": "", "texto": "Una estudiante preparó tres botellas con 200 mL de agua tibia (35 °C) cada una: la botella A con levadura y azúcar, la botella B con levadura sin azúcar y la botella C con azúcar sin levadura. Puso un globo desinflado en la boca de cada botella y midió cuánto aumentó la circunferencia de cada globo durante 40 minutos.", "vis": "", "items": [{"id": "CNA-116", "niv": 2, "cp": "cn_indagacion", "cn": "biologico", "e": "¿Qué pregunta de investigación responde mejor este experimento?", "f": "Indagación: preguntas investigables", "vis": "<div class=\"vfig\"><svg class=\"vg\" viewBox=\"0 0 560 320\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Gráfica 11. Aumento de la circunferencia de los globos\" font-family=\"Arial, sans-serif\" font-size=\"12\"><rect width=\"560\" height=\"320\" fill=\"#ffffff\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"13\" fill=\"#1d2433\">Gráfica 11. Aumento de la circunferencia de los globos<\/text><line x1=\"60\" y1=\"258.0\" x2=\"540\" y2=\"258.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"262.0\" text-anchor=\"end\" fill=\"#3a4356\">0<\/text><line x1=\"60\" y1=\"221.0\" x2=\"540\" y2=\"221.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"225.0\" text-anchor=\"end\" fill=\"#3a4356\">5<\/text><line x1=\"60\" y1=\"184.0\" x2=\"540\" y2=\"184.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"188.0\" text-anchor=\"end\" fill=\"#3a4356\">10<\/text><line x1=\"60\" y1=\"147.0\" x2=\"540\" y2=\"147.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"151.0\" text-anchor=\"end\" fill=\"#3a4356\">15<\/text><line x1=\"60\" y1=\"110.0\" x2=\"540\" y2=\"110.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"114.0\" text-anchor=\"end\" fill=\"#3a4356\">20<\/text><line x1=\"60\" y1=\"73.0\" x2=\"540\" y2=\"73.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"77.0\" text-anchor=\"end\" fill=\"#3a4356\">25<\/text><line x1=\"60\" y1=\"36.0\" x2=\"540\" y2=\"36.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"40.0\" text-anchor=\"end\" fill=\"#3a4356\">30<\/text><line x1=\"60\" y1=\"258\" x2=\"540\" y2=\"258\" stroke=\"#3a4356\"/><line x1=\"60\" y1=\"258\" x2=\"60\" y2=\"36\" stroke=\"#3a4356\"/><text transform=\"translate(14,147.0) rotate(-90)\" text-anchor=\"middle\" fill=\"#3a4356\">Aumento de circunferencia (cm)<\/text><text x=\"300.0\" y=\"312\" text-anchor=\"middle\" fill=\"#3a4356\">Tiempo (min)<\/text><text x=\"108.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">0<\/text><text x=\"204.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">10<\/text><text x=\"300.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">20<\/text><text x=\"396.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">30<\/text><text x=\"492.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">40<\/text><polyline fill=\"none\" stroke=\"#1660a8\" stroke-width=\"2.5\" points=\"108.0,258.0 204.0,213.6 300.0,161.8 396.0,110.0 492.0,65.6\"/><circle cx=\"108.0\" cy=\"258.0\" r=\"3.5\" fill=\"#1660a8\"/><circle cx=\"204.0\" cy=\"213.6\" r=\"3.5\" fill=\"#1660a8\"/><circle cx=\"300.0\" cy=\"161.8\" r=\"3.5\" fill=\"#1660a8\"/><circle cx=\"396.0\" cy=\"110.0\" r=\"3.5\" fill=\"#1660a8\"/><circle cx=\"492.0\" cy=\"65.6\" r=\"3.5\" fill=\"#1660a8\"/><polyline fill=\"none\" stroke=\"#d9822b\" stroke-width=\"2.5\" points=\"108.0,258.0 204.0,258.0 300.0,258.0 396.0,258.0 492.0,258.0\"/><circle cx=\"108.0\" cy=\"258.0\" r=\"3.5\" fill=\"#d9822b\"/><circle cx=\"204.0\" cy=\"258.0\" r=\"3.5\" fill=\"#d9822b\"/><circle cx=\"300.0\" cy=\"258.0\" r=\"3.5\" fill=\"#d9822b\"/><circle cx=\"396.0\" cy=\"258.0\" r=\"3.5\" fill=\"#d9822b\"/><circle cx=\"492.0\" cy=\"258.0\" r=\"3.5\" fill=\"#d9822b\"/><polyline fill=\"none\" stroke=\"#2e8b57\" stroke-width=\"2.5\" points=\"108.0,258.0 204.0,258.0 300.0,258.0 396.0,258.0 492.0,258.0\"/><circle cx=\"108.0\" cy=\"258.0\" r=\"3.5\" fill=\"#2e8b57\"/><circle cx=\"204.0\" cy=\"258.0\" r=\"3.5\" fill=\"#2e8b57\"/><circle cx=\"300.0\" cy=\"258.0\" r=\"3.5\" fill=\"#2e8b57\"/><circle cx=\"396.0\" cy=\"258.0\" r=\"3.5\" fill=\"#2e8b57\"/><circle cx=\"492.0\" cy=\"258.0\" r=\"3.5\" fill=\"#2e8b57\"/><rect x=\"60\" y=\"286\" width=\"12\" height=\"12\" fill=\"#1660a8\"/><text x=\"76\" y=\"296\" fill=\"#1d2433\">A: levadura + azúcar<\/text><rect x=\"226\" y=\"286\" width=\"12\" height=\"12\" fill=\"#d9822b\"/><text x=\"242\" y=\"296\" fill=\"#1d2433\">B: solo levadura<\/text><rect x=\"364\" y=\"286\" width=\"12\" height=\"12\" fill=\"#2e8b57\"/><text x=\"380\" y=\"296\" fill=\"#1d2433\">C: solo azúcar<\/text><\/svg><\/div>", "o": [["A", "¿Se necesitan a la vez levadura y azúcar para que se produzca gas en la botella?", "Las botellas comparan levadura con azúcar, levadura sola y azúcar sola; solo el globo de A se infló, lo que responde esta pregunta.", true], ["B", "¿Qué tipo de azúcar produce más gas al ser consumido por la levadura en agua tibia?", "Se usó un solo tipo de azúcar, así que no se pueden comparar azúcares.", false], ["C", "¿A qué temperatura del agua produce más gas la levadura cuando se le agrega azúcar?", "Todas las botellas estaban a 35 °C; la temperatura no se varió.", false], ["D", "¿Qué gas produce la levadura cuando consume el azúcar disuelto en el agua tibia?", "El experimento mide cuánto se infla el globo, pero no identifica el gas producido.", false]]}]}, {"comp": "ciencias_naturales", "sim": "s11-1", "ses": 2, "ind": "Actividad de una enzima y temperatura", "tt": "", "texto": "Una enzima extraída de hígado de res descompone el peróxido de hidrógeno (agua oxigenada) y libera oxígeno. En un experimento se midió el volumen de oxígeno liberado en 2 minutos a distintas temperaturas, usando siempre la misma cantidad de enzima y de peróxido de hidrógeno.", "vis": "", "items": [{"id": "CNA-117", "niv": 3, "cp": "cn_indagacion", "cn": "biologico", "e": "¿Qué conclusión se apoya en los datos de la gráfica?", "f": "Indagación: análisis de gráficas; concepto de desnaturalización enzimática", "vis": "<div class=\"vfig\"><svg class=\"vg\" viewBox=\"0 0 560 320\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Gráfica 12. Oxígeno liberado en 2 minutos según la temperatura\" font-family=\"Arial, sans-serif\" font-size=\"12\"><rect width=\"560\" height=\"320\" fill=\"#ffffff\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"13\" fill=\"#1d2433\">Gráfica 12. Oxígeno liberado en 2 minutos según la temperatura<\/text><line x1=\"60\" y1=\"258.0\" x2=\"540\" y2=\"258.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"262.0\" text-anchor=\"end\" fill=\"#3a4356\">0<\/text><line x1=\"60\" y1=\"221.0\" x2=\"540\" y2=\"221.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"225.0\" text-anchor=\"end\" fill=\"#3a4356\">5<\/text><line x1=\"60\" y1=\"184.0\" x2=\"540\" y2=\"184.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"188.0\" text-anchor=\"end\" fill=\"#3a4356\">10<\/text><line x1=\"60\" y1=\"147.0\" x2=\"540\" y2=\"147.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"151.0\" text-anchor=\"end\" fill=\"#3a4356\">15<\/text><line x1=\"60\" y1=\"110.0\" x2=\"540\" y2=\"110.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"114.0\" text-anchor=\"end\" fill=\"#3a4356\">20<\/text><line x1=\"60\" y1=\"73.0\" x2=\"540\" y2=\"73.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"77.0\" text-anchor=\"end\" fill=\"#3a4356\">25<\/text><line x1=\"60\" y1=\"36.0\" x2=\"540\" y2=\"36.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"40.0\" text-anchor=\"end\" fill=\"#3a4356\">30<\/text><line x1=\"60\" y1=\"258\" x2=\"540\" y2=\"258\" stroke=\"#3a4356\"/><line x1=\"60\" y1=\"258\" x2=\"60\" y2=\"36\" stroke=\"#3a4356\"/><text transform=\"translate(14,147.0) rotate(-90)\" text-anchor=\"middle\" fill=\"#3a4356\">Oxígeno liberado (mL)<\/text><text x=\"300.0\" y=\"312\" text-anchor=\"middle\" fill=\"#3a4356\">Temperatura (°C)<\/text><text x=\"100.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">10<\/text><text x=\"180.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">20<\/text><text x=\"260.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">30<\/text><text x=\"340.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">40<\/text><text x=\"420.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">50<\/text><text x=\"500.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">60<\/text><rect x=\"72.0\" y=\"198.8\" width=\"56.0\" height=\"59.2\" fill=\"#1660a8\"/><text x=\"100.0\" y=\"194.8\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">8<\/text><rect x=\"152.0\" y=\"154.4\" width=\"56.0\" height=\"103.6\" fill=\"#1660a8\"/><text x=\"180.0\" y=\"150.4\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">14<\/text><rect x=\"232.0\" y=\"95.2\" width=\"56.0\" height=\"162.8\" fill=\"#1660a8\"/><text x=\"260.0\" y=\"91.2\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">22<\/text><rect x=\"312.0\" y=\"58.2\" width=\"56.0\" height=\"199.8\" fill=\"#1660a8\"/><text x=\"340.0\" y=\"54.2\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">27<\/text><rect x=\"392.0\" y=\"147.0\" width=\"56.0\" height=\"111.0\" fill=\"#1660a8\"/><text x=\"420.0\" y=\"143.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">15<\/text><rect x=\"472.0\" y=\"235.8\" width=\"56.0\" height=\"22.2\" fill=\"#1660a8\"/><text x=\"500.0\" y=\"231.8\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">3<\/text><\/svg><\/div>", "o": [["A", "A 60 °C la enzima libera más oxígeno, porque a mayor temperatura las moléculas chocan con más frecuencia.", "A 60 °C se liberó el menor volumen (3 mL): a temperaturas altas la enzima se desnaturaliza y pierde actividad.", false], ["B", "Los datos demuestran que la temperatura óptima es 40 °C y no otra cercana, como 38 o 45 °C.", "Solo se midió cada 10 °C; el máximo real podría estar en cualquier punto entre 30 y 50 °C. Los datos no permiten precisar tanto.", false], ["C", "La mayor actividad medida fue a 40 °C, y a temperaturas más altas la actividad disminuyó.", "El mayor volumen (27 mL) se obtuvo a 40 °C; a 50 y 60 °C bajó a 15 y 3 mL. La conclusión se limita a las temperaturas medidas.", true], ["D", "Entre 10 y 60 °C, la actividad de la enzima aumenta a medida que aumenta la temperatura.", "Por encima de 40 °C la actividad disminuye; el aumento solo se observa entre 10 y 40 °C.", false]]}]}, {"comp": "ciencias_naturales", "sim": "s11-1", "ses": 2, "ind": "Longitud de onda de un sonido", "tt": "", "texto": "Un parlante emite un sonido de 680 Hz en un lugar donde la rapidez del sonido en el aire es 340 m/s.", "vis": "", "items": [{"id": "CNA-122", "niv": 2, "cp": "cn_uso_comprensivo", "cn": "fisico", "e": "¿Cuál es la longitud de onda de ese sonido?", "f": "Cálculo propio: relación v = λf", "vis": "", "o": [["A", "0,5 m.", "v = λ·f, así que λ = v/f = 340 m/s / 680 Hz = 0,5 m.", true], ["B", "2 m.", "Divide la frecuencia entre la rapidez (680/340); la relación correcta es λ = v/f.", false], ["C", "340 m.", "Toma la rapidez del sonido como si fuera la longitud de onda.", false], ["D", "231.200 m.", "Multiplica rapidez por frecuencia (340 × 680); la longitud de onda es el cociente v/f.", false]]}]}, {"comp": "ciencias_naturales", "sim": "s11-1", "ses": 2, "ind": "Fuerzas sobre un libro en reposo", "tt": "", "texto": "Un libro está en reposo sobre una mesa horizontal.", "vis": "", "items": [{"id": "CNA-123", "niv": 1, "cp": "cn_uso_comprensivo", "cn": "fisico", "e": "¿Qué afirmación describe correctamente las fuerzas que actúan sobre el libro?", "f": "Concepto: leyes de Newton y fuerza normal", "vis": "", "o": [["A", "La fuerza normal es mayor que el peso, y por eso el libro no se hunde en la mesa.", "Si la normal fuera mayor, habría una fuerza neta hacia arriba y el libro se aceleraría hacia arriba.", false], ["B", "No actúa ninguna fuerza sobre el libro, porque se encuentra en reposo sobre la mesa.", "Estar en reposo significa que la fuerza neta es cero, no que no haya fuerzas: el peso actúa siempre.", false], ["C", "Solo actúa el peso, porque la mesa es un objeto inmóvil que no puede ejercer fuerza sobre el libro.", "Si solo actuara el peso, la fuerza neta no sería cero y el libro aceleraría hacia abajo; la mesa sí ejerce la fuerza normal.", false], ["D", "Actúan el peso, hacia abajo, y la fuerza normal de la mesa, hacia arriba, con igual magnitud.", "Como el libro está en reposo, la fuerza neta es cero (primera ley de Newton): la normal equilibra exactamente al peso.", true]]}]}, {"comp": "ciencias_naturales", "sim": "s11-1", "ses": 2, "ind": "Frenado de un bus", "tt": "", "texto": "Un bus que viaja por una avenida frena de forma brusca. Los pasajeros que van de pie, sin agarrarse, se desplazan hacia adelante.", "vis": "", "items": [{"id": "CNA-124", "niv": 1, "cp": "cn_explicacion", "cn": "fisico", "e": "¿Qué explica el movimiento de los pasajeros hacia adelante?", "f": "Concepto: primera ley de Newton (inercia)", "vis": "", "o": [["A", "El frenado genera una fuerza que empuja a los pasajeros hacia la parte delantera del bus.", "No hay ninguna fuerza que empuje a los pasajeros hacia adelante; lo que ocurre es que el bus se detiene y ellos tienden a conservar su movimiento.", false], ["B", "Por inercia, sus cuerpos tienden a seguir moviéndose con la velocidad que llevaba el bus.", "Primera ley de Newton: un cuerpo mantiene su estado de movimiento si no actúa una fuerza neta. El bus frena, pero los pies de los pasajeros apenas reciben fuerza y su cuerpo sigue hacia adelante.", true], ["C", "El aire que hay dentro del bus se mueve hacia adelante y arrastra a los pasajeros consigo.", "El aire del interior no ejerce una fuerza suficiente para desplazar a una persona; la causa es la inercia.", false], ["D", "La gravedad aumenta durante el frenado y desequilibra a los pasajeros hacia adelante.", "La gravedad no cambia cuando el bus frena, y además actúa hacia abajo, no hacia adelante.", false]]}]}, {"comp": "ciencias_naturales", "sim": "s11-1", "ses": 2, "ind": "Cucharas de metal y de madera", "tt": "", "texto": "En una mañana fría, una cuchara metálica y una de madera llevan varias horas sobre la misma mesa. Al tocarlas con la mano, la cuchara metálica se siente más fría que la de madera.", "vis": "", "items": [{"id": "CNA-125", "niv": 3, "cp": "cn_explicacion", "cn": "fisico", "e": "¿Qué explica esta diferencia?", "f": "Concepto: conducción térmica y equilibrio térmico", "vis": "", "o": [["A", "El metal tiene mayor calor específico, así que necesita más energía para calentarse y por eso se siente frío.", "Los metales comunes tienen menor calor específico que la madera; la sensación de frío se debe a su mayor conductividad térmica.", false], ["B", "El metal está a menor temperatura que la madera, porque los metales se enfrían más que la madera durante la noche.", "Tras horas en el mismo ambiente, ambas cucharas alcanzan el equilibrio térmico y tienen la misma temperatura.", false], ["C", "El metal transmite frío a la mano, mientras que la madera, por ser aislante, no deja pasar el frío a la piel.", "No se transmite «frío»: el calor pasa de la mano a la cuchara, y el metal lo conduce más rápido que la madera.", false], ["D", "Ambas están a la misma temperatura, pero el metal conduce el calor mejor y retira calor de la mano más rápido.", "Tras horas en el mismo ambiente, las dos cucharas alcanzan el equilibrio térmico. La sensación de frío depende de la rapidez con que se pierde calor de la piel, y el metal es mejor conductor térmico que la madera.", true]]}]}, {"comp": "ciencias_naturales", "sim": "s11-1", "ses": 2, "ind": "Periodo de un péndulo", "tt": "", "texto": "En una clase se estudió el periodo de un péndulo simple, es decir, el tiempo de una oscilación completa. En cada medición se soltó el péndulo desde un ángulo pequeño (10°), se midió el tiempo de 10 oscilaciones y se dividió entre 10. Primero se cambió la longitud del hilo manteniendo una masa de 50 g (tabla 11) y después se cambió la masa manteniendo una longitud de 1,00 m (tabla 12).", "vis": "<table class=\"vt\"><caption>Tabla 11. Periodo según la longitud (masa de 50 g)<\/caption><thead><tr><th>Longitud (m)<\/th><th>0,25<\/th><th>0,50<\/th><th>1,00<\/th><th>2,00<\/th><\/tr><\/thead><tbody><tr><td>Periodo (s)<\/td><td>1,00<\/td><td>1,42<\/td><td>2,01<\/td><td>2,84<\/td><\/tr><\/tbody><\/table><table class=\"vt\"><caption>Tabla 12. Periodo según la masa (longitud de 1,00 m)<\/caption><thead><tr><th>Masa (g)<\/th><th>20<\/th><th>50<\/th><th>100<\/th><th>200<\/th><\/tr><\/thead><tbody><tr><td>Periodo (s)<\/td><td>2,01<\/td><td>2,00<\/td><td>2,01<\/td><td>2,01<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Datos ficticios, coherentes con g = 9,8 m/s².<\/div>", "items": [{"id": "CNA-129", "niv": 3, "cp": "cn_indagacion", "cn": "fisico", "e": "Según la tabla 11, ¿qué relación hay entre la longitud del hilo y el periodo?", "f": "Indagación: patrones en datos; modelo del péndulo simple T = 2π√(L/g)", "vis": "", "o": [["A", "El periodo no depende de la longitud del hilo, porque el ángulo de 10° fue el mismo en todas las mediciones.", "Aunque el ángulo fue el mismo, en la tabla 11 el periodo cambia de 1,00 s a 2,84 s al cambiar la longitud.", false], ["B", "El periodo crece con la longitud, pero más despacio que ella: al duplicar la longitud, el periodo aumenta menos del doble.", "De 0,50 m a 1,00 m el periodo pasa de 1,42 s a 2,01 s, y de 1,00 m a 2,00 m, de 2,01 s a 2,84 s: aumenta unas 1,4 veces, no 2 veces.", true], ["C", "El periodo es directamente proporcional a la longitud: al duplicar la longitud, el periodo también se duplica.", "De 0,50 m a 1,00 m el periodo pasa de 1,42 s a 2,01 s; aumenta, pero no se duplica.", false], ["D", "El periodo disminuye a medida que la longitud aumenta, porque el péndulo largo debe recorrer un arco más grande.", "Los datos muestran lo contrario: con más longitud el periodo es mayor.", false]]}, {"id": "CNA-130", "niv": 2, "cp": "cn_indagacion", "cn": "fisico", "e": "¿Qué se puede concluir de la tabla 12?", "f": "Indagación: conclusiones a partir de datos", "vis": "", "o": [["A", "En el rango estudiado, la masa no afecta de manera apreciable el periodo del péndulo.", "Con masas de 20 a 200 g el periodo varía entre 2,00 y 2,01 s, una diferencia comparable al error de medición.", true], ["B", "El periodo aumenta con la masa, ya que el péndulo de 200 g tuvo el mayor periodo de la tabla.", "El péndulo de 200 g tuvo 2,01 s, igual que los de 20 g y 100 g; no hay una tendencia a aumentar.", false], ["C", "La masa y la longitud afectan el periodo en la misma medida, según las dos tablas.", "La longitud cambia mucho el periodo (tabla 11), mientras que la masa casi no lo cambia (tabla 12).", false], ["D", "Los péndulos de mayor masa oscilan más rápido, porque la gravedad los atrae con una fuerza mayor.", "Los periodos son prácticamente iguales para todas las masas; no hay oscilaciones más rápidas con más masa.", false]]}, {"id": "CNA-131", "niv": 3, "cp": "cn_indagacion", "cn": "fisico", "e": "Si se construye, en las mismas condiciones, un péndulo con un hilo de 4,00 m, ¿cuál es el periodo más probable?", "f": "Indagación: predicción a partir de patrones; T = 2π√(L/g)", "vis": "", "o": [["A", "2,8 s.", "Es el periodo del péndulo de 2,00 m; supone que el periodo deja de cambiar con la longitud.", false], ["B", "4,0 s.", "Al cuadruplicar la longitud el periodo se duplica: de 1,00 m (2,01 s) a 4,00 m se espera cerca de 4,0 s.", true], ["C", "5,7 s.", "Duplica el periodo de 2,00 m (2 × 2,84 s) porque la longitud se duplica; pero duplicar la longitud no duplica el periodo.", false], ["D", "8,0 s.", "Supone proporcionalidad directa con la longitud desde 1,00 m (4 × 2,01 s), lo que contradice los datos.", false]]}]}, {"comp": "ciencias_naturales", "sim": "s11-1", "ses": 2, "ind": "Carrito en una rampa", "tt": "", "texto": "Un carrito parte del reposo y baja por una rampa. Con un sensor de movimiento se registró la distancia total recorrida al final de cada segundo.", "vis": "<div class=\"vfig\"><svg class=\"vg\" viewBox=\"0 0 560 320\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Gráfica 13. Distancia recorrida por el carrito\" font-family=\"Arial, sans-serif\" font-size=\"12\"><rect width=\"560\" height=\"320\" fill=\"#ffffff\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"13\" fill=\"#1d2433\">Gráfica 13. Distancia recorrida por el carrito<\/text><line x1=\"60\" y1=\"258.0\" x2=\"540\" y2=\"258.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"262.0\" text-anchor=\"end\" fill=\"#3a4356\">0<\/text><line x1=\"60\" y1=\"202.5\" x2=\"540\" y2=\"202.5\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"206.5\" text-anchor=\"end\" fill=\"#3a4356\">2<\/text><line x1=\"60\" y1=\"147.0\" x2=\"540\" y2=\"147.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"151.0\" text-anchor=\"end\" fill=\"#3a4356\">4<\/text><line x1=\"60\" y1=\"91.5\" x2=\"540\" y2=\"91.5\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"95.5\" text-anchor=\"end\" fill=\"#3a4356\">6<\/text><line x1=\"60\" y1=\"36.0\" x2=\"540\" y2=\"36.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"40.0\" text-anchor=\"end\" fill=\"#3a4356\">8<\/text><line x1=\"60\" y1=\"258\" x2=\"540\" y2=\"258\" stroke=\"#3a4356\"/><line x1=\"60\" y1=\"258\" x2=\"60\" y2=\"36\" stroke=\"#3a4356\"/><text transform=\"translate(14,147.0) rotate(-90)\" text-anchor=\"middle\" fill=\"#3a4356\">Distancia (m)<\/text><text x=\"300.0\" y=\"312\" text-anchor=\"middle\" fill=\"#3a4356\">Tiempo (s)<\/text><text x=\"108.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">0<\/text><text x=\"204.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">1<\/text><text x=\"300.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">2<\/text><text x=\"396.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">3<\/text><text x=\"492.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">4<\/text><polyline fill=\"none\" stroke=\"#1660a8\" stroke-width=\"2.5\" points=\"108.0,258.0 204.0,244.1 300.0,202.5 396.0,133.1 492.0,36.0\"/><circle cx=\"108.0\" cy=\"258.0\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"108.0\" y=\"250.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">0<\/text><circle cx=\"204.0\" cy=\"244.1\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"204.0\" y=\"236.1\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">0,5<\/text><circle cx=\"300.0\" cy=\"202.5\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"300.0\" y=\"194.5\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">2<\/text><circle cx=\"396.0\" cy=\"133.1\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"396.0\" y=\"125.1\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">4,5<\/text><circle cx=\"492.0\" cy=\"36.0\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"492.0\" y=\"28.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">8<\/text><\/svg><\/div>", "items": [{"id": "CNA-132", "niv": 2, "cp": "cn_indagacion", "cn": "fisico", "e": "¿Qué describe mejor el movimiento del carrito, según la gráfica?", "f": "Indagación: interpretación de gráficas distancia-tiempo", "vis": "", "o": [["A", "Su rapidez disminuye, porque en cada segundo le queda menos rampa por recorrer hasta el final.", "Lo que queda por recorrer no determina la rapidez; los datos muestran que en cada segundo recorre más distancia (0,5; 1,5; 2,5; 3,5 m).", false], ["B", "Se detiene al final del registro, porque 8 m es la mayor distancia que aparece en la gráfica.", "Que 8 m sea el último valor medido no indica que se detenga; entre 3 y 4 s recorrió 3,5 m, más que nunca.", false], ["C", "Su rapidez aumenta, porque en cada segundo recorre más distancia que en el segundo anterior.", "En los segundos sucesivos recorre 0,5 m; 1,5 m; 2,5 m y 3,5 m: cada vez más distancia en el mismo tiempo, es decir, acelera.", true], ["D", "Se mueve con rapidez constante, porque la distancia recorrida aumenta durante todo el registro.", "Que la distancia aumente solo indica que se mueve; con rapidez constante recorrería la misma distancia cada segundo, y no es así.", false]]}, {"id": "CNA-133", "niv": 1, "cp": "cn_indagacion", "cn": "fisico", "e": "La estudiante quiere averiguar si la inclinación de la rampa influye en la rapidez con que baja el carrito. ¿Qué debe hacer?", "f": "Indagación: diseño experimental y control de variables", "vis": "", "o": [["A", "Repetir la prueba con distintas inclinaciones, usando el mismo carrito, la misma rampa y el mismo punto de partida.", "Solo se cambia la variable que se quiere estudiar (la inclinación) y se mantienen las demás constantes.", true], ["B", "Repetir la prueba con la misma inclinación, pero cambiando el carrito por otros de distinta masa y tamaño.", "Así se estudiaría el efecto de la masa, no el de la inclinación.", false], ["C", "Medir varias veces la misma bajada, con la misma inclinación, y calcular el promedio de las distancias cada segundo.", "Repetir mejora la precisión, pero sin cambiar la inclinación no se puede saber si esta influye.", false], ["D", "Cambiar a la vez la inclinación y el material de la rampa, para que las diferencias en la rapidez sean más notorias.", "Al cambiar dos variables no se sabría cuál de ellas causa las diferencias observadas.", false]]}]}, {"comp": "ciencias_naturales", "sim": "s11-1", "ses": 2, "ind": "Comparación de acidez", "tt": "", "texto": "Un jugo de fruta tiene pH 3 y una taza de café tiene pH 5. El pH se define como el logaritmo negativo de la concentración de iones H⁺, de modo que cada unidad de pH corresponde a un factor de 10 en esa concentración.", "vis": "", "items": [{"id": "CNA-139", "niv": 3, "cp": "cn_uso_comprensivo", "cn": "quimico", "e": "¿Cuántas veces mayor es la concentración de iones H⁺ en el jugo que en el café?", "f": "Cálculo propio: escala logarítmica de pH", "vis": "", "o": [["A", "0,01 veces.", "Invierte la relación: 0,01 sería la concentración del café comparada con la del jugo. El jugo, con menor pH, tiene más H⁺.", false], ["B", "2 veces.", "Trata la escala de pH como lineal (5 − 3 = 2); pero es logarítmica: cada unidad multiplica por 10.", false], ["C", "100 veces.", "La diferencia es de 2 unidades de pH: 10² = 100. A menor pH, mayor concentración de H⁺.", true], ["D", "1.000 veces.", "Corresponde a una diferencia de 3 unidades de pH (10³); aquí la diferencia es de 2 unidades.", false]]}]}, {"comp": "ciencias_naturales", "sim": "s11-1", "ses": 2, "ind": "Obtención de sal", "tt": "", "texto": "En una salina se quiere obtener la sal que está disuelta en el agua de mar.", "vis": "", "items": [{"id": "CNA-140", "niv": 1, "cp": "cn_uso_comprensivo", "cn": "quimico", "e": "¿Qué método de separación es el más adecuado para recuperar la sal?", "f": "Concepto: métodos de separación de mezclas", "vis": "", "o": [["A", "Dejar reposar el agua de mar varios días, para que la sal se deposite en el fondo por decantación.", "La decantación separa sólidos no disueltos o líquidos inmiscibles; la sal disuelta no se deposita por reposo.", false], ["B", "Pasar un imán por el agua de mar, para que la sal quede adherida a él y luego retirarla.", "La separación magnética solo sirve para materiales atraídos por un imán, como el hierro; la sal no lo es.", false], ["C", "Filtrar el agua de mar con papel de filtro, para que la sal quede retenida en el papel.", "La sal disuelta está en forma de iones que atraviesan el papel de filtro; la filtración separa sólidos no disueltos.", false], ["D", "Evaporar el agua, para que la sal disuelta quede como un sólido cristalino en el recipiente.", "La sal disuelta no se separa por métodos mecánicos; al evaporarse el agua (por el sol o por calentamiento), la sal queda en forma de cristales.", true]]}]}, {"comp": "ciencias_naturales", "sim": "s11-1", "ses": 2, "ind": "Combustión de papel en una balanza", "tt": "", "texto": "Un estudiante pone un trozo de papel en un plato abierto sobre una balanza y lo quema. Al terminar, las cenizas pesan mucho menos que el papel inicial.", "vis": "", "items": [{"id": "CNA-141", "niv": 2, "cp": "cn_explicacion", "cn": "quimico", "e": "¿Qué explica la disminución de la masa registrada por la balanza?", "f": "Concepto: ley de conservación de la masa (Lavoisier)", "vis": "", "o": [["A", "La combustión destruyó parte de la materia del papel y la convirtió en la energía de la llama.", "En las reacciones químicas la materia no se destruye; la energía liberada proviene de la ruptura y formación de enlaces.", false], ["B", "La masa no se conserva en las combustiones al aire libre; la ley solo se cumple en recipientes cerrados.", "La ley de conservación de la masa se cumple siempre; el recipiente cerrado solo permite medir todos los productos.", false], ["C", "El fuego hizo que las cenizas fueran menos densas que el papel, y por eso pesan menos.", "La densidad no determina la masa total; la masa faltante corresponde a los gases que se formaron y escaparon.", false], ["D", "Parte de la materia se transformó en gases, como CO₂ y vapor de agua, que escaparon al aire.", "La masa se conserva, pero los productos gaseosos de la combustión salen del plato abierto y la balanza no los registra. En un sistema cerrado la masa total no cambiaría.", true]]}]}, {"comp": "ciencias_naturales", "sim": "s11-1", "ses": 2, "ind": "Globo en el congelador", "tt": "", "texto": "Un globo inflado y bien amarrado se mete al congelador. Una hora después se observa que el globo es más pequeño. Al sacarlo y dejarlo a temperatura ambiente, recupera su tamaño inicial.", "vis": "", "items": [{"id": "CNA-142", "niv": 1, "cp": "cn_explicacion", "cn": "quimico", "e": "¿Qué explica que el globo se haya reducido en el congelador?", "f": "Concepto: ley de Charles y modelo cinético de los gases", "vis": "", "o": [["A", "El frío hizo que parte del aire se escapara por los poros del globo, y por eso perdió tamaño en el congelador.", "Si el aire se hubiera escapado, el globo no recuperaría su tamaño al volver a la temperatura ambiente.", false], ["B", "El aire frío del congelador es más denso y pesado, y por eso aplastó el globo desde afuera.", "Un aire exterior más denso no explica que el globo recupere su tamaño ni es la causa principal; lo que cambia es el volumen del gas de adentro al enfriarse.", false], ["C", "Al bajar la temperatura, las partículas del gas se mueven más lento y el gas ocupa menos volumen.", "A presión aproximadamente constante, el volumen de un gas disminuye cuando baja su temperatura (ley de Charles); al calentarse, se recupera.", true], ["D", "El aire del globo se convirtió en agua líquida por el frío del congelador.", "El aire (nitrógeno y oxígeno, principalmente) no se condensa a la temperatura de un congelador doméstico.", false]]}]}, {"comp": "ciencias_naturales", "sim": "s11-1", "ses": 2, "ind": "Ebullición del agua en Bogotá", "tt": "", "texto": "A nivel del mar, el agua pura hierve a unos 100 °C. En Bogotá, a unos 2.600 m sobre el nivel del mar, el agua pura hierve a una temperatura menor.", "vis": "", "items": [{"id": "CNA-144", "niv": 2, "cp": "cn_explicacion", "cn": "quimico", "e": "¿Por qué el agua hierve a menor temperatura en Bogotá?", "f": "Concepto: presión de vapor y ebullición. Fuente: tabla de punto de ebullición según altitud (es.wikipedia.org/wiki/Punto_de_ebullición)", "vis": "", "o": [["A", "Porque allí la presión atmosférica es menor, y el agua hierve cuando su presión de vapor la iguala.", "Un líquido hierve cuando su presión de vapor iguala la presión externa. En Bogotá la presión atmosférica es menor que a nivel del mar, así que basta una temperatura menor.", true], ["B", "Porque el agua de Bogotá tiene más sales disueltas que el agua que se hierve a nivel del mar.", "El enunciado habla de agua pura; además, los solutos elevan la temperatura de ebullición, no la bajan.", false], ["C", "Porque en Bogotá el aire es más frío, y el ambiente frío le resta calor al agua y baja su temperatura de ebullición.", "La temperatura de ebullición depende de la presión, no de la temperatura del aire; en un día caluroso en Bogotá el agua tampoco hierve a 100 °C.", false], ["D", "Porque a mayor altitud hay menos oxígeno disuelto en el agua, y eso reduce la energía necesaria para que hierva.", "La ebullición es un cambio de fase que no depende del oxígeno disuelto; depende de la presión externa.", false]]}]}, {"comp": "ciencias_naturales", "sim": "s11-1", "ses": 2, "ind": "Curva de solubilidad de una sal", "tt": "", "texto": "La gráfica muestra la máxima masa de una sal X que se puede disolver en 100 g de agua a distintas temperaturas.", "vis": "<div class=\"vfig\"><svg class=\"vg\" viewBox=\"0 0 560 320\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Gráfica 14. Solubilidad de la sal X en agua\" font-family=\"Arial, sans-serif\" font-size=\"12\"><rect width=\"560\" height=\"320\" fill=\"#ffffff\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"13\" fill=\"#1d2433\">Gráfica 14. Solubilidad de la sal X en agua<\/text><line x1=\"60\" y1=\"258.0\" x2=\"540\" y2=\"258.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"262.0\" text-anchor=\"end\" fill=\"#3a4356\">0<\/text><line x1=\"60\" y1=\"202.5\" x2=\"540\" y2=\"202.5\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"206.5\" text-anchor=\"end\" fill=\"#3a4356\">50<\/text><line x1=\"60\" y1=\"147.0\" x2=\"540\" y2=\"147.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"151.0\" text-anchor=\"end\" fill=\"#3a4356\">100<\/text><line x1=\"60\" y1=\"91.5\" x2=\"540\" y2=\"91.5\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"95.5\" text-anchor=\"end\" fill=\"#3a4356\">150<\/text><line x1=\"60\" y1=\"36.0\" x2=\"540\" y2=\"36.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"40.0\" text-anchor=\"end\" fill=\"#3a4356\">200<\/text><line x1=\"60\" y1=\"258\" x2=\"540\" y2=\"258\" stroke=\"#3a4356\"/><line x1=\"60\" y1=\"258\" x2=\"60\" y2=\"36\" stroke=\"#3a4356\"/><text transform=\"translate(14,147.0) rotate(-90)\" text-anchor=\"middle\" fill=\"#3a4356\">Sal X disuelta en 100 g de agua (g)<\/text><text x=\"300.0\" y=\"312\" text-anchor=\"middle\" fill=\"#3a4356\">Temperatura (°C)<\/text><text x=\"120.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">20<\/text><text x=\"240.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">40<\/text><text x=\"360.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">60<\/text><text x=\"480.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">80<\/text><polyline fill=\"none\" stroke=\"#1660a8\" stroke-width=\"2.5\" points=\"120.0,224.7 240.0,191.4 360.0,141.4 480.0,74.8\"/><circle cx=\"120.0\" cy=\"224.7\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"120.0\" y=\"216.7\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">30<\/text><circle cx=\"240.0\" cy=\"191.4\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"240.0\" y=\"183.4\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">60<\/text><circle cx=\"360.0\" cy=\"141.4\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"360.0\" y=\"133.4\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">105<\/text><circle cx=\"480.0\" cy=\"74.8\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"480.0\" y=\"66.8\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">165<\/text><\/svg><\/div>", "items": [{"id": "CNA-149", "niv": 3, "cp": "cn_indagacion", "cn": "quimico", "e": "Se disuelven completamente 80 g de sal X en 100 g de agua a 60 °C y luego la solución se enfría lentamente hasta 20 °C. ¿Qué masa de sal X se espera que cristalice?", "f": "Cálculo propio a partir de la curva de solubilidad", "vis": "", "o": [["A", "30 g.", "Es la masa que permanece disuelta a 20 °C, no la que cristaliza.", false], ["B", "50 g.", "A 20 °C solo se disuelven 30 g en 100 g de agua; de los 80 g, cristalizan 80 − 30 = 50 g.", true], ["C", "80 g.", "Supone que toda la sal cristaliza; pero a 20 °C todavía quedan 30 g disueltos.", false], ["D", "105 g.", "Es la solubilidad a 60 °C; la solución no contenía 105 g, sino 80 g.", false]]}, {"id": "CNA-150", "niv": 2, "cp": "cn_indagacion", "cn": "quimico", "e": "A 40 °C, una solución tiene 45 g de sal X disueltos en 100 g de agua. ¿Cómo se clasifica esta solución?", "f": "Indagación: interpretación de curvas de solubilidad", "vis": "", "o": [["A", "Sobresaturada, porque contiene más de los 30 g de sal que se disuelven a 20 °C.", "Compara con la solubilidad a 20 °C, pero la solución está a 40 °C; a esa temperatura admite 60 g.", false], ["B", "Saturada, porque contiene la máxima cantidad de sal que se puede disolver a 40 °C.", "La máxima cantidad a 40 °C es 60 g, no 45 g.", false], ["C", "Saturada, porque 45 g está entre los valores de solubilidad a 20 °C y a 60 °C.", "Estar entre dos valores de la curva no la hace saturada; hay que comparar con la solubilidad a su propia temperatura (60 g a 40 °C).", false], ["D", "Insaturada, porque a 40 °C se disuelven hasta 60 g de la sal X en 100 g de agua.", "Tiene menos sal (45 g) que la máxima que admite a 40 °C (60 g); todavía puede disolver 15 g más.", true]]}]}, {"comp": "ciencias_naturales", "sim": "s11-1", "ses": 2, "ind": "Indicador de pH de origen vegetal", "tt": "", "texto": "Con un extracto vegetal se preparó un indicador ácido-base. Primero se probó con sustancias de pH conocido y se registró el color que tomaba. Luego se agregaron unas gotas a un limpiador de cocina de pH desconocido, y la mezcla tomó un color azul verdoso.", "vis": "", "items": [{"id": "CNA-151", "niv": 2, "cp": "cn_indagacion", "cn": "quimico", "e": "¿Qué se puede concluir sobre el limpiador de cocina?", "f": "Indagación: uso de indicadores y comparación con patrones", "vis": "<table class=\"vt\"><caption>Tabla 13. Color del indicador con sustancias de pH conocido<\/caption><thead><tr><th>Sustancia<\/th><th>pH<\/th><th>Color del indicador<\/th><\/tr><\/thead><tbody><tr><td>Ácido clorhídrico diluido<\/td><td>1<\/td><td>Rojo<\/td><\/tr><tr><td>Vinagre<\/td><td>3<\/td><td>Rosado<\/td><\/tr><tr><td>Agua destilada<\/td><td>7<\/td><td>Morado<\/td><\/tr><tr><td>Solución de bicarbonato de sodio<\/td><td>9<\/td><td>Azul verdoso<\/td><\/tr><tr><td>Soda cáustica diluida<\/td><td>13<\/td><td>Amarillo<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Colores de un indicador ficticio.<\/div>", "o": [["A", "Es más básico que la soda cáustica diluida, con un pH mayor que 13.", "Con pH 13 el indicador se vuelve amarillo; el limpiador dio azul verdoso, que corresponde a un pH menor.", false], ["B", "Es básico, con un pH cercano al de la solución de bicarbonato (alrededor de 9).", "El color azul verdoso coincide con el de la solución de bicarbonato (pH 9), que está entre el neutro (7, morado) y el muy básico (13, amarillo).", true], ["C", "Es neutro, con un pH cercano al del agua destilada, porque su color no es rojo.", "Que el color no sea rojo no lo hace neutro; con pH 7 el indicador da morado, no azul verdoso.", false], ["D", "Es ácido, con un pH cercano al de la solución de vinagre (alrededor de 3).", "Con pH 3 (vinagre) el indicador toma color rosado, no azul verdoso.", false]]}]}, {"comp": "ciencias_naturales", "sim": "s11-1", "ses": 2, "ind": "Residuos orgánicos y metano", "tt": "", "texto": "En un relleno sanitario, los residuos orgánicos (restos de comida, cáscaras) quedan enterrados bajo capas de otros residuos y producen metano (CH₄), un gas de efecto invernadero. Un municipio propone separar los residuos orgánicos en las casas y llevarlos a una planta donde se convierten en compost en pilas que se voltean con frecuencia para airearlas.", "vis": "", "items": [{"id": "CNA-155", "niv": 3, "cp": "cn_explicacion", "cn": "cts", "e": "¿Por qué esta propuesta reduce la producción de metano?", "f": "Concepto: descomposición aerobia y anaerobia; gestión de residuos", "vi
