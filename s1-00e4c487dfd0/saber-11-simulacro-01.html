s": "", "o": [["A", "Porque al voltear las pilas se deja salir el metano antes de que los residuos lleguen al relleno sanitario.", "Dejar salir el metano no reduciría la emisión; lo que hace el volteo es aportar oxígeno para que no se forme metano.", false], ["B", "Porque en el compost los residuos se descomponen a mayor temperatura, y ese calor destruye el metano que se forma.", "El calor del compost no destruye el metano; lo que evita su formación es la presencia de oxígeno.", false], ["C", "Porque en las pilas aireadas la descomposición es aerobia, y el metano se forma cuando falta oxígeno.", "Los microorganismos que producen metano actúan en ausencia de oxígeno, como en el interior de un relleno; en pilas aireadas predomina la descomposición aerobia, que produce sobre todo CO₂ y agua.", true], ["D", "Porque en el compostaje la materia orgánica se convierte en abono sólido sin liberar gases de efecto invernadero.", "El compostaje libera CO₂ y vapor de agua; reduce el metano, pero no evita toda emisión de gases.", false]]}]}, {"comp": "ingles", "sim": "s11-1", "ses": 2, "ind": "Parte 1 · Vocabulario: objetos de la cocina", "tt": "", "texto": "Read the descriptions of some words. What is the word for each description? Choose the correct word (A–G). There are more words than you need.\n\nA. fridge\nB. oven\nC. spoon\nD. kettle\nE. knife\nF. frying pan\nG. plate", "vis": "", "items": [{"id": "EN1-101", "niv": 2, "cp": "en_p1", "cn": "", "e": "You use this to boil water for tea or coffee.", "f": "Vocabulario del campo semántico «Objetos de la cocina» (redacción propia)", "vis": "", "o": [["A", "fridge", "«fridge» significa «nevera»: electrodoméstico que mantiene fríos los alimentos y las bebidas; no corresponde a «Se usa para hervir agua para el té o el café».", false], ["B", "oven", "«oven» significa «horno»: aparato cerrado donde se hornean pasteles, pan o carnes; no corresponde a «Se usa para hervir agua para el té o el café».", false], ["C", "spoon", "«spoon» significa «cuchara»: cubierto con el que se come sopa o se revuelve; no corresponde a «Se usa para hervir agua para el té o el café».", false], ["D", "kettle", "Correcta. «kettle» significa «hervidor / tetera eléctrica»: recipiente para hervir agua. La descripción dice: «Se usa para hervir agua para el té o el café».", true], ["E", "knife", "«knife» significa «cuchillo»: cubierto o utensilio para cortar; no corresponde a «Se usa para hervir agua para el té o el café».", false], ["F", "frying pan", "«frying pan» significa «sartén»: recipiente plano para freír; no corresponde a «Se usa para hervir agua para el té o el café».", false], ["G", "plate", "«plate» significa «plato»: pieza plana donde se sirve la comida; no corresponde a «Se usa para hervir agua para el té o el café».", false]]}, {"id": "EN1-102", "niv": 1, "cp": "en_p1", "cn": "", "e": "This keeps food and drinks cold.", "f": "Vocabulario del campo semántico «Objetos de la cocina» (redacción propia)", "vis": "", "o": [["A", "fridge", "Correcta. «fridge» significa «nevera»: electrodoméstico que mantiene fríos los alimentos y las bebidas. La descripción dice: «Mantiene fríos la comida y las bebidas».", true], ["B", "oven", "«oven» significa «horno»: aparato cerrado donde se hornean pasteles, pan o carnes; no corresponde a «Mantiene fríos la comida y las bebidas».", false], ["C", "spoon", "«spoon» significa «cuchara»: cubierto con el que se come sopa o se revuelve; no corresponde a «Mantiene fríos la comida y las bebidas».", false], ["D", "kettle", "«kettle» significa «hervidor / tetera eléctrica»: recipiente para hervir agua; no corresponde a «Mantiene fríos la comida y las bebidas».", false], ["E", "knife", "«knife» significa «cuchillo»: cubierto o utensilio para cortar; no corresponde a «Mantiene fríos la comida y las bebidas».", false], ["F", "frying pan", "«frying pan» significa «sartén»: recipiente plano para freír; no corresponde a «Mantiene fríos la comida y las bebidas».", false], ["G", "plate", "«plate» »: cubierto con el que se come sopa o se revuelve; no corresponde a «Se mete un pastel o un pan dentro de esto para hornearlo».", false], ["D", "kettle", "«kettle» significa «hervidor / tetera eléctrica»: recipiente para hervir agua; no corresponde a «Se mete un pastel o un pan dentro de esto para hornearlo».", false], ["E", "knife", "«knife» significa «cuchillo»: cubierto o utensilio para cortar; no corresponde a «Se mete un pastel o un pan dentro de esto para hornearlo».", false], ["F", "frying pan", "«frying pan» significa «sartén»: recipiente plano para freír; no corresponde a «Se mete un pastel o un pan dentro de esto para hornearlo».", false], ["G", "plate", "«plate» significa «plato»: pieza plana donde se sirve la comida; no corresponde a «Se mete un pastel o un pan dentro de esto para hornearlo».", false]]}, {"id": "EN1-105", "niv": 2, "cp": "en_p1", "cn": "", "e": "You use this to cut vegetables or meat.", "f": "Vocabulario del campo semántico «Objetos de la cocina» (redacción propia)", "vis": "", "o": [["A", "fridge", "«fridge» significa «nevera»: electrodoméstico que mantiene fríos los alimentos y las bebidas; no corresponde a «Se usa para cortar verduras o carne».", false], ["B", "oven", "«oven» significa «horno»: aparato cerrado donde se hornean pasteles, pan o carnes; no corresponde a «Se usa para cortar verduras o carne».", false], ["C", "spoon", "«spoon» significa «cuchara»: cubierto con el que se come sopa o se revuelve; no corresponde a «Se usa para cortar verduras o carne».", false], ["D", "kettle", "«kettle» significa «hervidor / tetera eléctrica»: recipiente para hervir agua; no corresponde a «Se usa para cortar verduras o carne».", false], ["E", "knife", "Correcta. «knife» significa «cuchillo»: cubierto o utensilio para cortar. La descripción dice: «Se usa para cortar verduras o carne».", true], ["F", "frying pan", "«frying pan» significa «sartén»: recipiente plano para freír; no corresponde a «Se usa para cortar verduras o carne».", false], ["G", "plate", "«plate» significa «plato»: pieza plana donde se sirve la comida; no corresponde a «Se usa para cortar verduras o carne».", false]]}]}, {"comp": "ingles", "sim": "s11-1", "ses": 2, "ind": "Parte 2 · Avisos y lugares", "tt": "", "texto": "Read the notices. Where can you see each one? Choose the correct place (A, B or C).", "vis": "", "items": [{"id": "EN1-106", "niv": 1, "cp": "en_p2", "cn": "", "e": "Notice: \"Please return your tray to the counter when you finish eating.\"\n\nWhere can you see this notice?", "f": "Conocimiento pragmático: propósito y lugar del aviso (redacción propia)", "vis": "", "o": [["A", "in a school computer room", "En la sala de computadores del colegio no se come ni hay bandejas que devolver al mostrador.", false], ["B", "in a school cafeteria", "Correcta. El aviso dice: «Por favor devuelva su bandeja al mostrador cuando termine de comer». En la cafetería del colegio se come en bandejas (tray) que se devuelven al mostrador (counter).", true], ["C", "in a school library", "En una biblioteca normalmente no se come; no hay bandejas que devolver.", false]]}, {"id": "EN1-107", "niv": 2, "cp": "en_p2", "cn": "", "e": "Notice: \"Show your boarding pass and ID at the gate.\"\n\nWhere can you see this notice?", "f": "Conocimiento pragmático: propósito y lugar del aviso (redacción propia)", "vis": "", "o": [["A", "at an airport", "Correcta. El aviso dice: «Muestre su pase de abordar y su documento de identidad en la puerta de embarque». El «boarding pass» (pase de abordar) y la «gate» (puerta de embarque) son propios de un aeropuerto.", true], ["B", "at a cinema", "En el cine se muestra una boleta, no un pase de abordar.", false], ["C", "at a hotel front desk", "En la recepción de un hotel pueden pedir el documento, pero no un pase de abordar en una puerta de embarque.", false]]}, {"id": "EN1-108", "niv": 2, "cp": "en_p2", "cn": "", "e": "Notice: \"Caps must be worn in the water at all times. No diving.\"\n\nWhere can you see this notice?", "f": "Conocimiento pragmático: propósito y lugar del aviso (redacción propia)", "vis": "", "o": [["A", "in a baseball stadium", "Trampa léxica: en un estadio de béisbol se usan gorras (caps), pero no hay agua ni se prohíbe clavarse.", false], ["B", "in a sports clothing store", "Una tienda de ropa deportiva puede vender gorros, pero no tiene agua donde exigir su uso ni prohibir clavarse.", false], ["C", "at a swimming pool", "Correcta. El aviso dice: «Es obligatorio usar gorro dentro del agua en todo momento. Prohibido clavarse». «Caps» aquí son gorros de natación; «in the water» y «no diving» (no clavarse) indican una piscina.", true]]}, {"id": "EN1-109", "niv": 2, "cp": "en_p2", "cn": "", "e": "Notice: \"Wash at 30 °C. Do not iron.\"\n\nWhere can you see this notice?", "f": "Conocimiento pragmático: propósito y lugar del aviso (redacción propia)", "vis": "", "o": [["A", "on a T-shirt label", "Correcta. El aviso dice: «Lavar a 30 °C. No planchar». Las instrucciones de lavado y planchado aparecen en la etiqueta de una prenda.", true], ["B", "on a microwave oven door", "Un horno microondas no se lava a 30 °C ni se plancha; «do not iron» solo tiene sentido para ropa.", false], ["C", "on a pizza box", "Una caja de pizza no se lava ni se plancha; sus avisos hablan de calentar o comer.", false]]}, {"id": "EN1-110", "niv": 2, "cp": "en_p2", "cn": "", "e": "Notice: \"Take one tablet every eight hours. Do not take more than the dose stated.\"\n\nWhere can you see this notice?", "f": "Conocimiento pragmático: propósito y lugar del aviso (redacción propia)", "vis": "", "o": [["A", "on a supermarket receipt", "Un recibo de supermercado muestra precios y productos, no instrucciones de dosis.", false], ["B", "on a medicine box", "Correcta. El aviso dice: «Tome una tableta cada ocho horas. No tome más de la dosis indicada». La dosis («one tablet every eight hours») es una instrucción que va en la caja de un medicamento.", true], ["C", "on a hospital visiting-hours sign", "Un letrero de horarios de visita indica horas para visitar pacientes, no dosis de tabletas.", false]]}, {"id": "EN1-111", "niv": 3, "cp": "en_p2", "cn": "", "e": "Notice: \"Watch the gap between the train and the platform.\"\n\nWhere can you see this notice?", "f": "Conocimiento pragmático: propósito y lugar del aviso (redacción propia)", "vis": "", "o": [["A", "at a car rental office", "En una oficina de alquiler de carros no hay trenes ni andén (platform).", false], ["B", "at a shopping mall", "En un centro comercial no hay trenes ni andenes (platform).", false], ["C", "at a subway station", "Correcta. El aviso dice: «Cuidado con el espacio entre el tren y el andén». «Watch the gap» significa «cuidado con el espacio»; el tren y el andén (platform) indican una estación de metro.", true]]}]}, {"comp": "ingles", "sim": "s11-1", "ses": 2, "ind": "Parte 3 · Conversaciones breves", "tt": "", "texto": "Complete the conversations. Read what the first person says and choose the best answer (A, B or C).", "vis": "", "items": [{"id": "EN1-112", "niv": 1, "cp": "en_p3", "cn": "", "e": "\"How old is your brother?\"", "f": "Conocimiento comunicativo: respuesta adecuada en una conversación breve (redacción propia)", "vis": "", "o": [["A", "He's tall.", "Describe la estatura («es alto»), no la edad que se pregunta con «How old».", false], ["B", "He's fifteen.", "Correcta. «How old is your brother?» = «¿Cuántos años tiene tu hermano?». Responde la edad: «Tiene quince años».", true], ["C", "He's at school.", "Dice dónde está («está en el colegio»), no cuántos años tiene.", false]]}, {"id": "EN1-113", "niv": 3, "cp": "en_p3", "cn": "", "e": "\"Would you like some more juice?\"", "f": "Conocimiento comunicativo: respuesta adecuada en una conversación breve (redacción propia)", "vis": "", "o": [["A", "No, thanks.", "Correcta. «Would you like some more juice?» = «¿Quieres un poco más de jugo?». Rechaza la oferta con cortesía: «No, gracias».", true], ["B", "No, I don't like.", "Incorrecta: «like» necesita objeto («I don't like it») y además no responde a un ofrecimiento.", false], ["C", "Yes, I would like.", "Incorrecta: «would like» necesita complemento («Yes, I would» o «Yes, I'd like some»).", false]]}, {"id": "EN1-114", "niv": 2, "cp": "en_p3", "cn": "", "e": "\"I'm sorry I'm late.\"", "f": "Conocimiento comunicativo: respuesta adecuada en una conversación breve (redacción propia)", "vis": "", "o": [["A", "You're welcome. It was a pleasure to help you.", "«De nada. Fue un placer ayudarte» responde a un agradecimiento, no a una disculpa.", false], ["B", "Thank you very much.", "Agradecer no tiene sentido cuando alguien se disculpa por llegar tarde.", false], ["C", "Don't worry. We haven't started yet.", "Correcta. «I'm sorry I'm late.» = «Perdón por llegar tarde.». Respuesta natural a una disculpa: «Tranquilo. Todavía no hemos empezado».", true]]}, {"id": "EN1-115", "niv": 1, "cp": "en_p3", "cn": "", "e": "\"What time does the bus leave?\"", "f": "Conocimiento comunicativo: respuesta adecuada en una conversación breve (redacción propia)", "vis": "", "o": [["A", "For two hours.", "Indica duración («durante dos horas»), no la hora de salida.", false], ["B", "At half past seven.", "Correcta. «What time does the bus leave?» = «¿A qué hora sale el bus?». «What time» pide una hora: «A las siete y media».", true], ["C", "By the train station.", "Indica un lugar («junto a la estación del tren»), no una hora.", false]]}, {"id": "EN1-116", "niv": 3, "cp": "en_p3", "cn": "", "e": "\"Have you ever been to Cartagena?\"", "f": "Conocimiento comunicativo: respuesta adecuada en una conversación breve (redacción propia)", "vis": "", "o": [["A", "Yes, I went there last year.", "Correcta. «Have you ever been to Cartagena?» = «¿Alguna vez has estado en Cartagena?». Responde afirmativamente y da el momento en pasado simple: «Sí, fui el año pasado».", true], ["B", "Yes, I will go there next month.", "Habla de un plan futuro («iré el próximo mes»), lo que contradice el «sí» sobre una experiencia pasada.", false], ["C", "No, I didn't.", "Incorrecta: a una pregunta en presente perfecto («Have you…?») se responde «No, I haven't».", false]]}, {"id": "EN1-117", "niv": 3, "cp": "en_p3", "cn": "", "e": "\"Do you mind if I open the window?\"", "f": "Conocimiento comunicativo: respuesta adecuada en una conversación breve (redacción propia)", "vis": "", "o": [["A", "No, I don't open it.", "Cambia el sujeto: la otra persona es quien quiere abrirla; «yo no la abro» no responde.", false], ["B", "Yes, you're welcome. Thanks for asking me.", "«You're welcome» responde a un «gracias»; además «Yes» significaría que sí le molesta, y agradecer no tiene sentido aquí.", false], ["C", "Not at all. It's very hot in here.", "Correcta. «Do you mind if I open the window?» = «¿Te molesta si abro la ventana?». «Not at all» = «para nada (no me molesta)»; da permiso y explica que hace calor.", true]]}]}, {"comp": "ingles", "sim": "s11-1", "ses": 2, "ind": "Blog: viaje en bicicleta (tiempos, preposiciones, comparativos)", "tt": "", "texto": "Read the text and choose the word that best fills each numbered gap.\n\nA weekend on two wheels\n\nLast month my cousin Andrés and I (1) ______ on a bike trip from Tunja to Villa de Leyva. We left very early in the morning because we wanted to arrive (2) ______ lunchtime. The road was quiet, but some of the hills were much (3) ______ than we expected. At one point Andrés had a flat tire, so we stopped and fixed it (4) ______. When we finally arrived, we were tired but very happy. That night, before we went to bed, we (5) ______ already planning our next trip.", "vis": "", "items": [{"id": "EN2-101", "niv": 1, "cp": "en_p4", "cn": "", "e": "Gap (1)", "f": "Gramática: pasado simple de verbos irregulares (go - went - gone)", "vis": "", "o": [["A", "gone", "«gone» es participio pasado; solo funciona con un auxiliar (have gone), que aquí no aparece.", false], ["B", "went", "Correcta: el relato ocurre en el pasado («Last month»), así que se usa el pasado simple de «go»: «we went on a bike trip» (fuimos de paseo en bicicleta).", true], ["C", "go", "«go» es presente; no concuerda con el marcador temporal «Last month», que exige pasado.", false]]}, {"id": "EN2-102", "niv": 3, "cp": "en_p4", "cn": "", "e": "Gap (2)", "f": "Gramática: preposiciones de tiempo (before, until, since)", "vis": "", "o": [["A", "before", "Correcta: «arrive before lunchtime» = llegar antes de la hora del almuerzo; explica por qué salieron muy temprano.", true], ["B", "since", "«since» (desde) se usa con tiempos perfectos para marcar el inicio de un periodo; «arrive since lunchtime» no tiene sentido ni estructura correcta.", false], ["C", "until", "«until» (hasta) indica que una acción dura hasta un momento; «arrive» es una acción puntual, por lo que «arrive until lunchtime» no es correcto.", false]]}, {"id": "EN2-103", "niv": 1, "cp": "en_p4", "cn": "", "e": "Gap (3)", "f": "Gramática: comparativo de adjetivos cortos (-er + than)", "vis": "", "o": [["A", "steep", "«steep» es el adjetivo en grado positivo; delante de «than» se necesita la forma comparativa.", false], ["B", "steepest", "«steepest» es superlativo (la más empinada); no se combina con «than», que es propio del comparativo.", false], ["C", "steeper", "Correcta: «much ... than» pide el comparativo de superioridad; «steep» (empinado) es corto, así que se forma con -er: «much steeper than» (mucho más empinadas que).", true]]}, {"id": "EN2-104", "niv": 2, "cp": "en_p4", "cn": "", "e": "Gap (4)", "f": "Gramática: pronombres reflexivos (myself, ourselves)", "vis": "", "o": [["A", "ourselves", "Correcta: el pronombre reflexivo «ourselves» enfatiza que lo hicieron ellos mismos, sin ayuda: «we fixed it ourselves».", true], ["B", "our", "«our» es adjetivo posesivo y siempre va antes de un sustantivo (our bike); no puede cerrar la oración solo.", false], ["C", "us", "«us» es pronombre objeto; «fixed it us» deja dos objetos sin preposición y no es gramatical.", false]]}, {"id": "EN2-105", "niv": 1, "cp": "en_p4", "cn": "", "e": "Gap (5)", "f": "Gramática: pasado continuo y concordancia sujeto-verbo", "vis": "", "o": [["A", "been", "«been» es participio; necesitaría «had» o «have» delante (we had been planning), que no aparece.", false], ["B", "were", "Correcta: pasado continuo con sujeto plural «we»: «we were already planning» (ya estábamos planeando).", true], ["C", "was", "«was» se usa con I, he, she, it; con «we» el pasado de «be» es «were».", false]]}]}, {"comp": "ingles", "sim": "s11-1", "ses": 2, "ind": "Correo sobre una feria de ciencias (futuro, for/since, relativos, condicional)", "tt": "", "texto": "Read the text and choose the word that best fills each numbered gap.\n\nHi Laura,\n\nI'm writing to tell you about our school science fair. It (1) ______ place next Friday in the school gym. We have been working on our project (2) ______ three weeks. We built a small water filter (3) ______ uses sand, stones and charcoal. Our teacher has a plan: if the water is clean enough, we (4) ______ show it to the mayor at the town fair in June. I hope you can come, (5) ______ I know you are very busy with your exams.\n\nLove,\nMarcela", "vis": "", "items": [{"id": "EN2-106", "niv": 1, "cp": "en_p4", "cn": "", "e": "Gap (1)", "f": "Gramática: futuro con will (take place)", "vis": "", "o": [["A", "taken", "«taken» es participio; sin auxiliar (has/was) no forma un verbo completo.", false], ["B", "taking", "«taking» es gerundio; sin el auxiliar «is» no puede funcionar como verbo principal de «It».", false], ["C", "will take", "Correcta: el evento es futuro («next Friday»); «will take place» = tendrá lugar.", true]]}, {"id": "EN2-107", "niv": 2, "cp": "en_p4", "cn": "", "e": "Gap (2)", "f": "Gramática: for / since con presente perfecto", "vis": "", "o": [["A", "since", "«since» exige un punto de inicio (since Monday), no una duración como «three weeks».", false], ["B", "for", "Correcta: con el presente perfecto continuo, «for» introduce la duración: «for three weeks» (durante tres semanas).", true], ["C", "during", "«during» indica dentro de qué periodo ocurre algo, pero no se usa con el presente perfecto para medir cuánto lleva una acción.", false]]}, {"id": "EN2-108", "niv": 2, "cp": "en_p4", "cn": "", "e": "Gap (3)", "f": "Gramática: pronombres relativos (who, which, where)", "vis": "", "o": [["A", "where", "«where» se refiere a lugares y va seguido de sujeto + verbo; aquí falta el sujeto de «uses», que debe ser el relativo.", false], ["B", "who", "«who» se refiere a personas; el antecedente «filter» es una cosa.", false], ["C", "which", "Correcta: el pronombre relativo para cosas es «which» (o that): «a water filter which uses sand...» (un filtro que usa arena).", true]]}, {"id": "EN2-109", "niv": 3, "cp": "en_p4", "cn": "", "e": "Gap (4)", "f": "Gramática: primer condicional", "vis": "", "o": [["A", "will", "Correcta: primer condicional (if + presente, will + verbo): «if the water is clean enough, we will show it» (si el agua queda lo bastante limpia, la mostraremos).", true], ["B", "did", "«did show» sería pasado enfático; no concuerda con una situación futura que depende de una condición.", false], ["C", "would", "«would» corresponde al segundo condicional, que exige pasado en la cláusula con if («if the water were...»); aquí la condición es real y está en presente («is»), y el plan del profesor se expresa en futuro.", false]]}, {"id": "EN2-110", "niv": 3, "cp": "en_p4", "cn": "", "e": "Gap (5)", "f": "Gramática: conectores de contraste, causa y consecuencia", "vis": "", "o": [["A", "so", "«so» (así que) indica consecuencia; saber que está ocupada no es consecuencia de esperar que venga.", false], ["B", "because", "«because» (porque) presentaría el estar ocupada como causa de esperar que venga, lo cual es ilógico.", false], ["C", "although", "Correcta: «although» (aunque) introduce un contraste: espera que venga, aunque sabe que está ocupada.", true]]}]}, {"comp": "ingles", "sim": "s11-1", "ses": 2, "ind": "Artículo: cooperativa de caficultores", "tt": "", "texto": "Read the text and answer the questions.\n\nCoffee with their own name\n\nTwenty years ago, Rosa Pineda's family grew coffee on a small farm near Salento. They sold all their beans to a company in the nearest city, but the price changed every month and the family often lost money.\n\nIn 2015, Rosa and eleven other farmers decided to create a cooperative. Together they bought a machine to dry the beans, which none of them could afford alone. They also started roasting part of their coffee and selling it in bags with their own label.\n\nAt first, it was difficult. The farmers had to learn about packaging, prices and online sales, and some of them wanted to leave the group after the first year. Rosa's daughter, Camila, who was studying business in Pereira, offered to help with the website. Today, the cooperative sells coffee to customers in Bogotá, Medellín and even to two small shops in Germany.\n\nRosa says the biggest change is not the money. \"Before, we only knew how to grow coffee,\" she explains. \"Now we know what happens to it after it leaves the farm, and we decide its price together.\" Next year, the cooperative plans to open a small café on the main road so that tourists can taste their coffee.", "vis": "", "items": [{"id": "EN2-111", "niv": 1, "cp": "en_p5", "cn": "", "e": "Why did Rosa's family often lose money in the past?", "f": "Párrafo 1", "vis": "", "o": [["A", "The company in the city closed down.", "El texto no dice que la empresa cerrara; dice que le vendían todo el café a ella.", false], ["B", "The price they were paid kept changing.", "Correcta: el párrafo 1 dice «the price changed every month» (el precio cambiaba cada mes); la opción lo parafrasea.", true], ["C", "Their small farm did not produce enough beans to sell.", "El texto no habla de la cantidad producida por la finca; solo del precio inestable.", false]]}, {"id": "EN2-112", "niv": 2, "cp": "en_p5", "cn": "", "e": "What did the farmers buy together?", "f": "Párrafo 2", "vis": "", "o": [["A", "Equipment for drying the coffee beans.", "Correcta: párrafo 2, «they bought a machine to dry the beans» (compraron una máquina para secar los granos).", true], ["B", "A shop where they sell their own coffee.", "Venden café con su propia etiqueta y planean abrir un café, pero no compraron una tienda.", false], ["C", "A truck to take their coffee to the city.", "No se menciona ningún camión; lo que compraron en grupo fue una máquina.", false]]}, {"id": "EN2-113", "niv": 2, "cp": "en_p5", "cn": "", "e": "What problem did the cooperative have at the beginning?", "f": "Párrafo 3", "vis": "", "o": [["A", "The bank refused to lend the farmers any money.", "El texto no menciona bancos ni préstamos.", false], ["B", "Some members thought about leaving it.", "Correcta: párrafo 3, «some of them wanted to leave the group after the first year» (algunos querían salirse del grupo).", true], ["C", "Tourists did not like its coffee.", "Los turistas aparecen solo en el plan futuro del café; no hay quejas de ellos.", false]]}, {"id": "EN2-114", "niv": 2, "cp": "en_p5", "cn": "", "e": "How did Camila help the cooperative?", "f": "Párrafo 3", "vis": "", "o": [["A", "She found the shops in Germany.", "El texto dice que venden a tiendas en Alemania, pero no dice que Camila las consiguiera.", false], ["B", "She taught the farmers to grow coffee.", "Los caficultores ya sabían cultivar café; Camila estudiaba administración (business).", false], ["C", "She worked on its website.", "Correcta: párrafo 3, Camila «offered to help with the website» (se ofreció a ayudar con la página web).", true]]}, {"id": "EN2-115", "niv": 3, "cp": "en_p5", "cn": "", "e": "According to Rosa, what is the most important change?", "f": "Párrafo 4", "vis": "", "o": [["A", "They know their coffee better and set its price together.", "Correcta: Rosa dice que ahora saben qué pasa con el café después de salir de la finca (lo conocen mejor) y deciden juntos su precio (párrafo 4).", true], ["B", "Her family now earns a lot more money than it did twenty years ago.", "Rosa dice explícitamente lo contrario: «the biggest change is not the money».", false], ["C", "Many tourists now visit the farm.", "El café para turistas es un plan para el próximo año, no un cambio que ya ocurrió.", false]]}]}, {"comp": "ingles", "sim": "s11-1", "ses": 2, "ind": "Perfil: bióloga marina en San Andrés", "tt": "", "texto": "Read the text and answer the questions.\n\nThe reef keeper\n\nWhen Daniela Archbold was eight years old, she saw a sea turtle for the first time on a beach in San Andrés. \"It was trapped in a fishing net,\" she remembers. \"My grandfather cut the net and the turtle swam away. I never forgot it.\"\n\nNow 27, Daniela works for a small organization that protects the coral reefs around the island. Three mornings a week, she dives with a team to measure the temperature of the water and to count the fish that live on the reef. In the afternoons, she visits schools and teaches children how plastic trash reaches the sea.\n\nHer job is not always easy. Diving is impossible when there are storms, and the team's boat is old and often needs repairs. Also, the organization depends on donations, so Daniela sometimes spends whole weekends writing letters to companies to ask for money.\n\nStill, she says she would not change her job for any other. Her favorite moment of the year is in September, when volunteers from all over the island help to clean the beaches. \"Last year more than 400 people came,\" she says proudly. \"Many of them were children I had visited at school.\"", "vis": "", "items": [{"id": "EN2-116", "niv": 1, "cp": "en_p5", "cn": "", "e": "What happened the first time Daniela saw a sea turtle?", "f": "Párrafo 1", "vis": "", "o": [["A", "Her grandfather set it free from a net.", "Correcta: párrafo 1, «My grandfather cut the net and the turtle swam away» (su abuelo cortó la red y la tortuga se fue nadando).", true], ["B", "It was lying hurt on the sand.", "El texto no dice que la tortuga estuviera herida en la arena, sino atrapada en una red.", false], ["C", "She helped a local fisherman to catch it for food.", "Nadie quería atrapar la tortuga; al contrario, la liberaron.", false]]}, {"id": "EN2-117", "niv": 2, "cp": "en_p5", "cn": "", "e": "What does Daniela do three mornings a week?", "f": "Párrafo 2", "vis": "", "o": [["A", "She repairs the team's boat.", "El bote necesita reparaciones a menudo, pero no se dice que ella lo repare.", false], ["B", "She collects information under the water.", "Correcta: párrafo 2, bucea para medir la temperatura del agua y contar los peces del arrecife, es decir, recoge datos bajo el agua.", true], ["C", "She teaches children in the island's schools.", "Las visitas a colegios son en las tardes («In the afternoons»), no en las mañanas.", false]]}, {"id": "EN2-118", "niv": 2, "cp": "en_p5", "cn": "", "e": "Which difficulty of Daniela's job does the text mention?", "f": "Párrafo 3", "vis": "", "o": [["A", "The children at the schools do not listen to her talks.", "El texto no dice nada negativo sobre la actitud de los niños.", false], ["B", "The island does not allow diving near the reef.", "No se menciona ninguna prohibición; ella bucea tres veces por semana.", false], ["C", "Bad weather sometimes stops the team from diving.", "Correcta: párrafo 3, «Diving is impossible when there are storms» (no se puede bucear cuando hay tormentas).", true]]}, {"id": "EN2-119", "niv": 2, "cp": "en_p5", "cn": "", "e": "Why does Daniela write letters to companies?", "f": "Párrafo 3", "vis": "", "o": [["A", "To ask them to give money to the organization.", "Correcta: párrafo 3, la organización depende de donaciones, así que escribe cartas «to ask for money» (para pedir dinero).", true], ["B", "To complain about plastic in the sea.", "El plástico es el tema de sus charlas en colegios, no de las cartas a empresas.", false], ["C", "To invite them to help clean the beaches in September.", "La limpieza de playas la hacen voluntarios de la isla; las cartas no son invitaciones.", false]]}, {"id": "EN2-120", "niv": 3, "cp": "en_p5", "cn": "", "e": "What makes Daniela proud about the September beach cleaning?", "f": "Párrafo 4", "vis": "", "o": [["A", "She organized it alone for the first time.", "El texto no dice quién organiza el evento ni que ella lo hiciera sola.", false], ["B", "It is the largest event of its kind in all of Colombia.", "Solo se dice que fueron más de 400 personas; no se compara con otros eventos del país.", false], ["C", "Many of the volunteers were children she had taught.", "Correcta: lo dice con orgullo («proudly»): muchos voluntarios eran niños a quienes ella había visitado en el colegio.", true]]}]}, {"comp": "ingles", "sim": "s11-1", "ses": 2, "ind": "Blog personal: conciertos sin celular", "tt": "", "texto": "Read the text and answer the questions. Choose the correct answer (A, B, C or D).\n\nThree songs without a phone\nby Laura, 17\n\nLast summer I went to see my favorite band for the third time. Halfway through the second song, I realized I was watching the whole show through a five-inch screen. My arm was tired, my battery was at twelve percent, and the girl behind me had given up trying to see the stage. That night, back home, I scrolled through my gallery and counted: 412 concert videos from the last three years. I had opened maybe ten of them more than once. The sound was terrible in all of them.\n\nSo at the next concert I tried an experiment. I left my phone in my bag, except for one photo with my friends before the show started. At first it felt strange, almost as if I was forgetting to do something important. By the fourth song, though, I was singing, dancing and noticing things I had always missed: the drummer laughing at his own mistake, the lights changing color with every chorus, a stranger next to me who knew every word in Portuguese.\n\nI'm not saying that recording is always wrong. My cousin films short clips for our grandmother, who can't travel anymore, and I think that's lovely. But for me, the camera had become a habit, not a choice. I wasn't saving memories; I was collecting files.\n\nIf you have a concert coming up, try keeping your phone away for just three songs. You can always take it out again. I'm curious to know whether you notice the same things I did.", "vis": "", "items": [{"id": "EN3-101", "niv": 2, "cp": "en_p6", "cn": "", "e": "What is the writer's main purpose in this text?", "f": "Inferencia del propósito: párrafos 1, 2 y 4", "vis": "", "o": [["A", "to share a personal change and encourage readers to try it", "Correcta. La autora (Laura, según la firma) cuenta cómo dejó de grabar los conciertos y al final invita al lector: «try keeping your phone away for just three songs» (intenta guardar el teléfono solo tres canciones).", true], ["B", "to convince readers that filming at concerts should be completely banned", "Generalización excesiva: la autora dice «I'm not saying that recording is always wrong» (no digo que grabar siempre esté mal); no propone prohibirlo.", false], ["C", "to complain about the poor sound quality of phone videos", "El mal sonido de los videos («The sound was terrible») es solo un detalle de apoyo, no el propósito general del texto.", false], ["D", "to describe the best concert she has ever been to", "El texto no compara conciertos ni dice cuál fue el mejor; el concierto es solo el escenario de su experimento.", false]]}, {"id": "EN3-102", "niv": 2, "cp": "en_p6", "cn": "", "e": "How does the writer feel about her old habit of recording whole concerts?", "f": "Inferencia de actitud: párrafos 1 a 3", "vis": "", "o": [["A", "She believes it was the only way to remember the shows.", "Ella concluye lo opuesto: «I wasn't saving memories» (no estaba guardando recuerdos).", false], ["B", "She thinks it was unfair to her cousin's grandmother.", "La abuela aparece en el ejemplo de la prima, que graba por una buena razón; no tiene relación con el hábito de la autora.", false], ["C", "She thinks it made her miss a large part of the experience.", "Correcta. Sin el teléfono empezó a notar «things I had always missed» (cosas que siempre se había perdido); deduce que grabar le quitaba la experiencia.", true], ["D", "She is proud of the large collection of videos she made.", "Lo contrario: menciona los 412 videos para mostrar que casi nunca los veía, no con orgullo.", false]]}, {"id": "EN3-103", "niv": 1, "cp": "en_p6", "cn": "", "e": "What can we infer about the 412 videos on the writer's phone?", "f": "Inferencia: párrafo 1", "vis": "", "o": [["A", "Most of them were filmed for her family.", "Quien graba para la familia es la prima, no la autora; el texto no dice para quién eran sus videos.", false], ["B", "She deleted them after her experiment.", "El texto no menciona que los haya borrado; es una suposición sin apoyo.", false], ["C", "They were all recorded at the same concert.", "El texto dice que son de «the last three years» (los últimos tres años), es decir, de varios conciertos.", false], ["D", "She hardly ever watched them again.", "Correcta. «I had opened maybe ten of them more than once» (había abierto quizá diez más de una vez): casi nunca los volvía a ver.", true]]}, {"id": "EN3-104", "niv": 3, "cp": "en_p6", "cn": "", "e": "Why does the writer mention the girl behind her?", "f": "Inferencia de la intención del autor: párrafo 1", "vis": "", "o": [["A", "to show that her filming also affected other people in the audience", "Correcta. La chica «had given up trying to see the stage» (había dejado de intentar ver el escenario) porque el brazo levantado de la autora le tapaba la vista.", true], ["B", "to suggest that the girl was rude and kept complaining about her during the show", "No se describe ninguna actitud grosera de la chica; ella es la afectada, no la causante.", false], ["C", "to explain why her phone battery was so low", "La batería baja es otro detalle de la misma frase, pero no tiene relación causal con la chica.", false], ["D", "to show that the girl was also recording the concert", "El texto no dice que la chica grabara; solo que no podía ver el escenario.", false]]}, {"id": "EN3-105", "niv": 3, "cp": "en_p6", "cn": "", "e": "Why does the writer mention her cousin?", "f": "Inferencia de la función de un ejemplo: párrafo 3", "vis": "", "o": [["A", "to explain where she learned the habit of filming", "El texto no dice que la autora aprendiera el hábito de su prima.", false], ["B", "to show that recording can sometimes have a good reason", "Correcta. Justo después de decir que grabar no siempre está mal, da el ejemplo de la prima que graba para la abuela que ya no puede viajar: «I think that's lovely».", true], ["C", "to show that older people do not enjoy concerts", "La abuela no puede viajar; el texto no habla de si le gustan o no los conciertos.", false], ["D", "to give an example of someone who records too much", "La prima graba «short clips» (videos cortos) con un fin concreto; no es un ejemplo de exceso.", false]]}, {"id": "EN3-106", "niv": 2, "cp": "en_p6", "cn": "", "e": "What does the writer mean by \"I wasn't saving memories; I was collecting files\"?", "f": "Inferencia de sentido figurado: párrafo 3", "vis": "", "o": [["A", "Her recordings had little real value for her.", "Correcta. Los videos eran archivos acumulados que no volvía a ver ni recordaba con gusto; por eso «collecting files» (coleccionar archivos) se opone a «saving memories».", true], ["B", "She preferred to keep her memories on a computer.", "El texto no menciona ningún computador; «files» se usa en sentido figurado.", false], ["C", "She recorded concerts mainly to share them with friends.", "No se dice que compartiera los videos; solo se menciona una foto con amigos en el experimento.", false], ["D", "Her phone did not have enough space for new videos.", "Interpretación literal equivocada: la frase no habla de la memoria del teléfono sino del valor de los videos.", false]]}]}, {"comp": "ingles", "sim": "s11-1", "ses": 2, "ind": "Texto con espacios: huerta comunitaria", "tt": "", "texto": "Read the text and choose the best word (A, B, C or D) for each gap.\n\nOur neighborhood garden\n\nTwo years ago, the empty lot at the end of our street was full of trash. Today it is a garden where twenty families grow vegetables and herbs. The idea came (1) ___ Mrs. Ortega, a retired teacher who was tired of seeing plastic bags every time she walked to the bakery. She knocked on every door and asked people to (2) ___ part in a cleaning day. Only six people came the first weekend, but they filled forty bags. The next month, a local hardware store gave us tools and seeds, and more neighbors (3) ___ to help. We had (4) ___ experience, so many of our first plants died. Little by little, we learned from our mistakes. Now we (5) ___ a meeting on the first Sunday of every month to decide what to plant. Last year we harvested (6) ___ tomatoes that we gave boxes of them to the school cafeteria.", "vis": "", "items": [{"id": "EN3-107", "niv": 2, "cp": "en_p7", "cn": "", "e": "Gap (1)", "f": "Preposición: come from", "vis": "", "o": [["A", "with", "«come with» significa «venir con / acompañar»; la idea no «vino con» la señora Ortega.", false], ["B", "by", "«come by» significa «pasar por un lugar» o «conseguir algo»; no expresa el origen de una idea.", false], ["C", "from", "Correcta. «The idea came from Mrs. Ortega»: la idea vino de (provino de) la señora Ortega; «come from» indica origen.", true], ["D", "of", "«come of» significa «resultar de algo» (nothing came of it) y no se usa para decir de quién fue la idea.", false]]}, {"id": "EN3-108", "niv": 1, "cp": "en_p7", "cn": "", "e": "Gap (2)", "f": "Colocación: take part in", "vis": "", "o": [["A", "have", "«have part in» no se usa para expresar participación en una actividad.", false], ["B", "make", "«make part» no existe en inglés; es un calco del español «hacer parte».", false], ["C", "do", "«do part in» no es una expresión correcta; el verbo que acompaña a «part» es «take».", false], ["D", "take", "Correcta. La colocación es «take part in» (participar en).", true]]}, {"id": "EN3-109", "niv": 2, "cp": "en_p7", "cn": "", "e": "Gap (3)", "f": "Verbo + infinitivo", "vis": "", "o": [["A", "kept", "«keep» exige -ing (kept helping); «kept to help» es incorrecto.", false], ["B", "decided", "Correcta. «decide + to + infinitivo»: «more neighbors decided to help» (más vecinos decidieron ayudar).", true], ["C", "enjoyed", "«enjoy» va seguido de verbo en -ing (enjoy helping), no de «to help».", false], ["D", "avoided", "«avoid» también exige -ing (avoid helping) y además el sentido sería el contrario.", false]]}, {"id": "EN3-110", "niv": 3, "cp": "en_p7", "cn": "", "e": "Gap (4)", "f": "Cuantificadores con incontables", "vis": "", "o": [["A", "many", "«many» acompaña contables en plural y además contradice que las plantas murieran por falta de experiencia.", false], ["B", "few", "«few» se usa con sustantivos contables en plural (few plants), no con «experience» incontable.", false], ["C", "a lot", "Faltaría «of»: la forma correcta sería «a lot of experience», y además el sentido contradice la consecuencia.", false], ["D", "little", "Correcta. «experience» (experiencia) es incontable y «little» significa «poca»; encaja con la consecuencia: muchas plantas murieron.", true]]}, {"id": "EN3-111", "niv": 2, "cp": "en_p7", "cn": "", "e": "Gap (5)", "f": "Colocación: hold a meeting", "vis": "", "o": [["A", "put", "«put a meeting» es incorrecto; «put» no forma colocación con «meeting» en este sentido.", false], ["B", "make", "«make a meeting» es un calco del español «hacer una reunión»; no es natural en inglés.", false], ["C", "hold", "Correcta. «hold a meeting» (realizar o celebrar una reunión) es la colocación habitual (Cambridge Dictionary).", true], ["D", "give", "«give a meeting» no existe; se dice «give a talk» (dar una charla), no una reunión.", false]]}, {"id": "EN3-112", "niv": 3, "cp": "en_p7", "cn": "", "e": "Gap (6)", "f": "Estructura so … that", "vis": "", "o": [["A", "so many", "Correcta. Estructura «so many + sustantivo plural + that» (tantos … que): «so many tomatoes that we gave boxes away».", true], ["B", "too many", "«too many» (demasiados) no se combina con una cláusula de resultado «that»; iría con «to + infinitivo».", false], ["C", "such many", "«such» no va con «many»; se diría «such a lot of tomatoes that».", false], ["D", "very many", "«very many» no puede introducir una consecuencia con «that».", false]]}]}, {"comp": "ingles", "sim": "s11-1", "ses": 2, "ind": "Texto con espacios: primera entrevista de trabajo", "tt": "", "texto": "Read the text and choose the best word (A, B, C or D) for each gap.\n\nMy first job interview\n\nLast month I applied for a part-time job at a bookstore near my school. It was my (1) ___ job interview ever, so I was really (2) ___. The night before, my older brother helped me (3) ___ for it. He asked me typical questions and gave me some useful (4) ___: speak slowly, smile and look the interviewer in the eye. On the day, I arrived ten minutes early, (5) ___ the manager was already waiting for me at the door. She asked why I wanted to work there, and I told her the truth: reading has been my favorite hobby (6) ___ I was a child. At the end, she said she would call me by Friday. On Thursday afternoon, my phone rang. I got the job!", "vis": "", "items": [{"id": "EN3-113", "niv": 1, "cp": "en_p7", "cn": "", "e": "Gap (1)", "f": "Ordinales / adjetivos", "vis": "", "o": [["A", "early", "«my early job interview» no tiene sentido aquí; «early» significa «temprano».", false], ["B", "first", "Correcta. «my first job interview ever»: mi primera entrevista de trabajo; explica por qué estaba nervioso.", true], ["C", "before", "«before» es preposición o adverbio; no puede funcionar como adjetivo antes de «job interview».", false], ["D", "once", "«once» es adverbio (una vez) y no puede ir entre «my» y un sustantivo.", false]]}, {"id": "EN3-114", "niv": 1, "cp": "en_p7", "cn": "", "e": "Gap (2)", "f": "Formación de palabras: adjetivo", "vis": "", "o": [["A", "nervously", "«nervously» es adverbio; modifica verbos, no puede ir después de «was».", false], ["B", "nervous", "Correcta. Después del verbo «be» va un adjetivo: «I was really nervous» (estaba muy nervioso).", true], ["C", "nervousness", "«nervousness» es sustantivo (nerviosismo); no puede ser el complemento de «was really».", false], ["D", "nerves", "«nerves» es sustantivo plural (nervios); «I was really nerves» es incorrecto.", false]]}, {"id": "EN3-115", "niv": 2, "cp": "en_p7", "cn": "", "e": "Gap (3)", "f": "Help + objeto + infinitivo", "vis": "", "o": [["A", "prepare", "Correcta. «help + objeto + infinitivo sin to»: «helped me prepare» (me ayudó a preparar).", true], ["B", "prepared", "El participio no puede seguir a «helped me»; ya hay un verbo conjugado.", false], ["C", "preparing", "«help someone preparing» es incorrecto; «help» no va seguido de -ing en esta estructura.", false], ["D", "to preparing", "«to» + -ing no es la forma del infinitivo; se diría «to prepare».", false]]}, {"id": "EN3-116", "niv": 3, "cp": "en_p7", "cn": "", "e": "Gap (4)", "f": "Sustantivos incontables", "vis": "", "o": [["A", "advices", "«advice» no tiene plural; «advices» es un error típico de hispanohablantes.", false], ["B", "adviser", "«adviser» es la persona que aconseja; el hermano no le dio «asesores» sino consejos.", false], ["C", "advise", "«advise» es el verbo (aconsejar); después de «some useful» se necesita un sustantivo.", false], ["D", "advice", "Correcta. «advice» (consejo) es incontable: «some useful advice» (Cambridge Dictionary: noun [U]).", true]]}, {"id": "EN3-117", "niv": 2, "cp": "en_p7", "cn": "", "e": "Gap (5)", "f": "Conectores", "vis": "", "o": [["A", "because", "«because» indicaría causa: no llegó temprano porque la gerente lo esperara.", false], ["B", "unless", "«unless» (a menos que) expresa condición y no tiene sentido en una narración en pasado.", false], ["C", "but", "Correcta. «but» expresa contraste: llegó temprano, pero la gerente ya lo estaba esperando.", true], ["D", "so", "«so» indicaría consecuencia; que la gerente ya esperara no es resultado de que él llegara temprano.", false]]}, {"id": "EN3-118", "niv": 1, "cp": "en_p7", "cn": "", "e": "Gap (6)", "f": "Since / for con presente perfecto", "vis": "", "o": [["A", "from", "«from I was a child» es un calco del español «desde que»; no es gramatical.", false], ["B", "since", "Correcta. Con presente perfecto se usa «since» + punto de inicio: «has been my favorite hobby since I was a child» (desde que era niño).", true], ["C", "for", "«for» va seguido de un periodo de tiempo (for ten years), no de una oración como «I was a child».", false], ["D", "during", "«during» va seguido de un sustantivo (during my childhood), no de una oración.", false]]}]}];

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])).replace(/\^(\([^()]{1,20}\)|[0-9A-Za-z]+(?:,[0-9]+)?)/g, (m, g) => '<sup>' + (g[0] === '(' ? g.slice(1, -1) : g) + '</sup>');
const KEY = 'sim-saber11:' + CFG.clave;
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}
function save(){try{localStorage.setItem(KEY, JSON.stringify(ST))}catch(e){}}
let ST = load();
ST.r = ST.r || {};
$('#tit').textContent = CFG.titulo;
const ITEMS = [];
DATA.forEach(c => c.items.forEach(it => { it.caso = c; ITEMS.push(it); }));
const keyOf = it => it.o.find(o => o[3])[0];
const palabras = t => (t.trim().match(/\S+/g) || []).length;

function justHTML(it){
  const many = it.o.length > 4;
  return '<div class="just">' + it.o.filter(o => !many || o[3] || ST.r[it.id] === o[0]).map(o => `<div><b>${o[0]}.</b> <span class="${o[3]?'okt':'not'}">${o[3]?'Es correcta.':'Es incorrecta.'}</span> ${esc(o[2])}</div>`).join('') +
    `<div class="src">${esc(CFG.competencias[it.cp])} · Referencia: ${esc(it.f)}</div></div>`;
}
function itemHTML(it, n, mode){
  const r = ST.r[it.id];
  const reveal = mode === 'review' || (CFG.modo === 'practica' && r);
  let h = `<div class="item" id="i-${it.id}"><p class="enun"><span class="n">${n}.</span> <span class="niv">${CFG.niveles[it.niv]}</span> ${esc(it.e)}</p>${it.vis||''}<div class="${it.o.length>4?'ops8':''}">`;
  it.o.forEach(o => {
    let cls = '';
    if (reveal) { if (o[3]) cls = 'ok'; else if (r === o[0]) cls = 'no'; }
    else if (r === o[0]) cls = 'sel';
    h += `<button class="op ${cls}" data-id="${it.id}" data-l="${o[0]}" ${reveal?'disabled':''}><span class="l">${o[0]}.</span><span>${esc(o[1])}</span></button>`;
  });
  h += '</div>';
  if (reveal) {
    if (mode === 'review') h += `<div class="${r===keyOf(it)?'res-ok':'res-no'}" style="font-size:14px;margin-top:4px">${r ? (r===keyOf(it)?'Respondiste ' + r + ': correcto.':'Respondiste ' + r + '. La respuesta correcta es ' + keyOf(it) + '.') : 'Sin responder. La respuesta correcta es ' + keyOf(it) + '.'}</div>`;
    h += justHTML(it);
  }
  return h + '</div>';
}
function renderList(list, mode){
  let h = '', last = null, comp = null, parte = null, n = 0;
  const showMods = CFG.modo !== 'practica' || mode === 'review';
  list.forEach((it, idx) => {
    n++;
    if (it.caso !== last) {
      last = it.caso;
      if (it.caso.comp !== comp) { comp = it.caso.comp; parte = null; if (showMods) h += `<div class="mod" id="m-${comp}">${esc(CFG.componentes[comp])}</div>`; }
      if (comp === 'ingles' && it.cp !== parte) { parte = it.cp; h += `<div class="inst">${esc(CFG.instr[parte])}</div>`; }
      const k = last.items.filter(x => list.includes(x)).length;
      if (k > 1) h += `<div class="inst">Responda las preguntas ${n} a ${n + k - 1} de acuerdo con la siguiente información</div>`;
      let tag = CFG.modo === 'practica' ? CFG.componentes[comp] + (last.tt ? ' · ' + last.tt : '') + (last.ind ? ' · ' + last.ind : '') : (last.tt || '');
      h += `<div class="caso">${tag ? `<div class="tag">${esc(tag)}</div>` : ''}<p>${esc(last.texto)}</p>${last.vis||''}</div>`;
    }
    h += itemHTML(it, n, mode);
  });
  return h;
}

// ---------- PRÁCTICA ----------
let LIST = [];
let FILTRO = Object.assign({comp:'', cp:'', niv:'', ex:''}, ST.f || {});
function practica(){
  const comps = Object.entries(CFG.componentes).filter(([k]) => ITEMS.some(i => i.caso.comp === k)).map(([k,v]) => `<option value="${k}" ${FILTRO.comp===k?'selected':''}>${esc(v)}</option>`).join('');
  const cps = Object.entries(CFG.competencias).filter(([k]) => ITEMS.some(i => i.cp === k && (!FILTRO.comp || i.caso.comp === FILTRO.comp))).map(([k,v]) => `<option value="${k}" ${FILTRO.cp===k?'selected':''}>${esc(v)}</option>`).join('');
  if (FILTRO.cp && !ITEMS.some(i => i.cp === FILTRO.cp && (!FILTRO.comp || i.caso.comp === FILTRO.comp))) FILTRO.cp = '';
  const nivs = Object.entries(CFG.niveles).map(([k,v]) => `<option value="${k}" ${FILTRO.niv===k?'selected':''}>${esc(v)}</option>`).join('');
  const list = ITEMS.filter(it => (!FILTRO.comp || it.caso.comp===FILTRO.comp) && (!FILTRO.cp || it.cp===FILTRO.cp) && (!FILTRO.niv || String(it.niv)===FILTRO.niv) && (!FILTRO.ex || it.caso.sim.startsWith(FILTRO.ex)));
  const resp = list.filter(it => ST.r[it.id]); const ok = resp.filter(it => ST.r[it.id]===keyOf(it));
  $('#main').innerHTML = `<div class="panel"><p style="margin-top:0">Elige prueba, competencia y dificultad. Al responder verás de inmediato si acertaste y la explicación. Las preguntas de los simulacros también están aquí: si quieres presentarlos «en limpio», hazlos antes de practicar.</p>
  <div class="row"><select id="fc"><option value="">Todas las pruebas</option>${comps}</select>
  <select id="fp"><option value="">Todas las competencias</option>${cps}</select>
  <select id="fn"><option value="">Todas las dificultades</option>${nivs}</select>
  <select id="fe"><option value="">Todas las preguntas</option><option value="s11" ${FILTRO.ex==='s11'?'selected':''}>De los simulacros Saber 11</option><option value="val" ${FILTRO.ex==='val'?'selected':''}>De los simulacros de Validación</option><option value="practica" ${FILTRO.ex==='practica'?'selected':''}>Solo banco extra de práctica</option></select>
  <button class="btn sec" id="borrar">Borrar mis respuestas</button></div>
  <p class="stat" id="pst" style="margin-bottom:0">${list.length} preguntas · respondidas ${resp.length} · aciertos ${ok.length}${resp.length? ' (' + Math.round(100*ok.length/resp.length) + ' %)':''}</p></div>` + renderList(list, 'practica');
  $('#prog').textContent = `${ok.length}/${resp.length} aciertos`;
  [['fc','comp'],['fp','cp'],['fn','niv'],['fe','ex']].forEach(([id,k]) => $('#'+id).onchange = e => { FILTRO[k] = e.target.value; if (k==='comp') FILTRO.cp=''; ST.f = FILTRO; save(); practica(); });
  LIST = list;
  $('#borrar').onclick = () => { list.forEach(it => delete ST.r[it.id]); save(); practica(); };
}

// ---------- SIMULACRO (dos sesiones) ----------
let tick = null;
ST.t = ST.t || {}; ST.fin = ST.fin || {};
const SES = s => ITEMS.filter(it => it.caso.ses === s);
const nombreS = s => 'Sesión ' + s;
const PESO = {lectura_critica:3, matematicas:3, sociales_ciudadanas:3, ciencias_naturales:3, ingles:1};
let ACT = ST.act || 0;
function cuenta(list){ const m = {}; list.forEach(it => m[it.caso.comp] = (m[it.caso.comp]||0) + 1); return m; }
function estadoS(s){ return ST.fin[s] ? 'terminada' : ST.t[s] ? 'en curso' : 'sin empezar'; }
function inicio(){
  clearInterval(tick); $('#timer').textContent = '';
  const c1 = cuenta(SES(1)), c2 = cuenta(SES(2));
  const comps = Object.keys(CFG.componentes).filter(k => c1[k] || c2[k]);
  const h = Math.floor(CFG.minutos/60), m = CFG.minutos%60;
  const val = CFG.cuad === 'validantes';
  const btn = s => ST.fin[s] ? `<button class="btn sec" data-res="1">Ver resultados</button>` : `<button class="btn${s===2 && !ST.fin[1] ? ' sec' : ''}" data-ses="${s}">${ST.t[s] ? 'Continuar' : 'Comenzar'} la ${nombreS(s).toLowerCase()}</button>`;
  $('#main').innerHTML = `<div class="panel"><h2 style="margin-top:0">Instrucciones</h2>
  <p>Este simulacro reproduce la estructura del ${val ? '<b>cuadernillo de validantes</b> (Validación del Bachillerato)' : '<b>cuadernillo estándar de Saber 11</b>'}: <b>${ITEMS.length} preguntas</b> de selección múltiple con única respuesta, en <b>dos sesiones de ${h} h ${m ? m + ' min' : ''}</b>, como el examen real.</p>
  <table><tr><th>Prueba</th><th class="r">Sesión 1</th><th class="r">Sesión 2</th></tr>${comps.map(k => `<tr><td>${esc(CFG.componentes[k])}</td><td class="r">${c1[k]||'–'}</td><td class="r">${c2[k]||'–'}</td></tr>`).join('')}
  <tr><td><b>Total</b></td><td class="r"><b>${SES(1).length}</b></td><td class="r"><b>${SES(2).length}</b></td></tr></table>
  <p>Cada sesión tiene su propio cronómetro. Puedes hacerlas el mismo día con un descanso (como en el examen) o en días distintos. Tus respuestas se guardan en este navegador: puedes cerrar y continuar después. Cuando se acaba el tiempo puedes seguir, pero el cronómetro lo indica.</p>
  <p>Al terminar verás tu porcentaje por prueba, competencia y dificultad, ${val ? 'una estimación de qué tan cerca estás del puntaje de aprobación' : 'un indicador global ponderado como el del Icfes'} y la explicación de cada pregunta.</p>
  <table><tr><td>${nombreS(1)} · ${estadoS(1)}</td><td class="r">${btn(1)}</td></tr><tr><td>${nombreS(2)} · ${estadoS(2)}</td><td class="r">${btn(2)}</td></tr></table>
  ${(ST.fin[1] || ST.fin[2]) ? '<div class="row" style="margin-top:12px"><button class="btn sec" id="otra">Reiniciar el simulacro</button></div>' : ''}</div>`;
  $('#prog').textContent = `${ITEMS.length} preguntas`;
  document.querySelectorAll('[data-ses]').forEach(b => b.onclick = () => { const s = +b.dataset.ses; if (!ST.t[s]) ST.t[s] = Date.now(); ACT = ST.act = s; save(); examen(); window.scrollTo(0,0); });
  document.querySelectorAll('[data-res]').forEach(b => b.onclick = () => { resultados(); window.scrollTo(0,0); });
  const o = $('#otra'); if (o) o.onclick = reiniciar;
}
function reiniciar(){ ST = {r:{}, t:{}, fin:{}}; ACT = 0; save(); inicio(); window.scrollTo(0,0); }
function reloj(){
  const rest = CFG.minutos*60 - Math.floor((Date.now() - ST.t[ACT])/1000);
  const a = Math.abs(rest), hh = Math.floor(a/3600), mm = Math.floor(a%3600/60), ss = a%60;
  const t = (rest < 0 ? '+' : '') + (hh ? hh + ':' : '') + String(mm).padStart(2,'0') + ':' + String(ss).padStart(2,'0');
  $('#timer').textContent = rest < 0 ? 'Tiempo cumplido ' + t : '⏱ ' + t;
  $('#timer').classList.toggle('low', rest < 600);
}
function navHTML(list){
  const comps = [...new Set(list.map(i => i.caso.comp))];
  return '<div class="nav">' + comps.map(c => `<a href="#m-${c}">${esc(CFG.componentes[c])}</a>`).join('') + '</div>';
}
function examen(){
  const L = SES(ACT);
  $('#main').innerHTML = `<div class="mod" style="margin-top:0">${nombreS(ACT)}</div>` + navHTML(L) + renderList(L, 'examen') + `<div class="panel"><button class="btn" id="fin">Terminar la ${nombreS(ACT).toLowerCase()}</button> <button class="btn sec" id="volver">Volver al inicio</button></div>`;
  progreso(); reloj(); clearInterval(tick); tick = setInterval(reloj, 1000);
  $('#volver').onclick = () => { ST.act = ACT = 0; save(); inicio(); window.scrollTo(0,0); };
  $('#fin').onclick = () => {
    const faltan = L.length - L.filter(i => ST.r[i.id]).length;
    $('#mtxt').textContent = (faltan ? `Te faltan ${faltan} preguntas por responder en esta sesión. ¿Quieres terminarla de todos modos?` : '¿Quieres terminar esta sesión?');
    $('#modal').classList.remove('hide');
  };
}
function progreso(){
  const L = SES(ACT);
  const r = L.filter(it => ST.r[it.id]).length;
  $('#prog').textContent = `${nombreS(ACT)} · respondidas ${r}/${L.length}`;
}
$('#mno').onclick = () => $('#modal').classList.add('hide');
$('#msi').onclick = () => { $('#modal').classList.add('hide'); ST.fin[ACT] = Date.now(); ST.act = ACT = 0; save(); clearInterval(tick); if (ST.fin[1] && ST.fin[2]) resultados(); else inicio(); window.scrollTo(0,0); };
const fmt = x => String(Math.round(x*10)/10).replace('.', ',');
function resultados(){
  clearInterval(tick);
  const L = ITEMS.filter(it => ST.fin[it.caso.ses]);
  const completo = ST.fin[1] && ST.fin[2];
  const ok = L.filter(it => ST.r[it.id] === keyOf(it)).length;
  const pct = 100*ok/L.length;
  const agrupa = (lst, fn) => { const m = {}; lst.forEach(it => { const k = fn(it); m[k] = m[k] || [0,0]; m[k][1]++; if (ST.r[it.id]===keyOf(it)) m[k][0]++; }); return m; };
  const fila = (lab, v, cls) => `<tr class="${cls||''}"><td>${esc(lab)}</td><td class="r">${v[0]}/${v[1]}</td><td class="r">${Math.round(100*v[0]/v[1])} %</td></tr>`;
  const porMod = agrupa(L, it => it.caso.comp), porNiv = agrupa(L, it => it.niv);
  let tabla = '';
  Object.keys(CFG.componentes).filter(m => porMod[m]).forEach(m => { tabla += fila(CFG.componentes[m], porMod[m]);
    const sub = agrupa(L.filter(i => i.caso.comp === m), it => it.cp);
    Object.keys(CFG.competencias).filter(k => sub[k]).forEach(k => tabla += fila(CFG.competencias[k], sub[k], 'sub'));
    if (m === 'ciencias_naturales') { const cn = agrupa(L.filter(i => i.caso.comp === m), it => it.cn); Object.keys(CFG.comp_cn).filter(k => cn[k]).forEach(k => tabla += fila('Componente ' + CFG.comp_cn[k].toLowerCase(), cn[k], 'sub')); } });
  let ind = '';
  if (completo) {
    let num = 0, den = 0; Object.entries(porMod).forEach(([m, v]) => { num += PESO[m] * v[0]/v[1]; den += PESO[m]; });
    const pond = 100*num/den;
    ind = CFG.cuad === 'validantes'
      ? `<p><b>Indicador ponderado de aciertos: ${fmt(pond)} %</b> (Lectura Crítica, Matemáticas, Sociales y Ciencias pesan 3; Inglés pesa 1, igual que en el puntaje total de la Validación).</p><p class="aviso">Para aprobar la Validación necesitas un puntaje total de 30 o más en una escala de 0 a 60, que el Icfes calcula con un modelo estadístico (30 es el promedio de los validantes). Ningún simulacro puede convertir aciertos en ese puntaje exacto: usa el indicador para medir tu avance entre simulacros y refuerza primero las pruebas con peso 3 que tengas más bajas.</p>`
      : `<p><b>Indicador global ponderado: ${Math.round(5*pond)} de 500</b> (${fmt(pond)} % de aciertos ponderados: Lectura Crítica, Matemáticas, Sociales y Ciencias pesan 3; Inglés pesa 1, como en el puntaje global).</p><p class="aviso">El Icfes calcula el puntaje de cada prueba (0 a 100) y el global (0 a 500) con un modelo estadístico que tiene en cuenta la dificultad de cada pregunta y compara a todos los evaluados. Por eso este indicador no es tu puntaje oficial: sirve para medir tu avance entre simulacros.</p>`;
  }
  const mins = s => ST.fin[s] ? Math.round((ST.fin[s] - ST.t[s])/60000) : null;
  const tUso = [1,2].filter(s => ST.fin[s]).map(s => { const x = mins(s); return `${nombreS(s)}: ${Math.floor(x/60) ? Math.floor(x/60) + ' h ' : ''}${x%60} min`; }).join(' · ');
  $('#timer').textContent = '';
  $('#prog').textContent = `${ok}/${L.length} aciertos`;
  const peor = Object.entries(porMod).sort((a,b) => a[1][0]/a[1][1] - b[1][0]/b[1][1])[0];
  $('#main').innerHTML = `<div class="panel">${completo ? '' : `<p class="aviso" style="margin-top:0"><b>Resultado parcial:</b> solo has terminado la ${[1,2].filter(s=>ST.fin[s]).map(nombreS).join(' y ').toLowerCase()}. Termina la otra sesión para ver el resultado completo.</p>`}
  <div class="big">${fmt(pct)} %</div>
  <p style="margin-top:4px">${ok} de ${L.length} respuestas correctas. ${pct >= 75 ? 'Muy buen resultado: repasa tus errores para afianzarlo.' : pct >= 55 ? 'Vas por buen camino: refuerza las pruebas y competencias con menor porcentaje.' : 'Hay que reforzar: practica por prueba y competencia, empezando por la más baja.'} Tu prueba más baja: <b>${esc(CFG.componentes[peor[0]])}</b>.</p>
  ${ind}<p class="stat">Tiempo usado · ${tUso}</p>
  <h3>Por prueba y competencia</h3><table>${tabla}</table>
  <h3>Por dificultad</h3><table>${Object.entries(porNiv).map(([k,v]) => fila(CFG.niveles[k], v)).join('')}</table>
  <div class="row" style="margin-top:14px"><button class="btn sec" id="solo">Ver solo mis errores</button><button class="btn sec" id="todas">Ver todas</button><button class="btn sec" id="ini">Volver al inicio</button><button class="btn sec" id="otra">Reiniciar el simulacro</button></div></div><div id="rev"></div>`;
  const rev = errs => { let h = ''; [1,2].filter(s => ST.fin[s]).forEach(s => { const l = SES(s).filter(it => !errs || ST.r[it.id] !== keyOf(it)); h += `<div class="mod">${nombreS(s)}</div>` + (l.length ? renderList(l, 'review') : '<div class="panel">¡No tuviste errores en esta sesión!</div>'); }); $('#rev').innerHTML = h; };
  rev(true);
  $('#solo').onclick = () => rev(true); $('#todas').onclick = () => rev(false);
  $('#ini').onclick = () => { inicio(); window.scrollTo(0,0); };
  $('#otra').onclick = reiniciar;
}

document.addEventListener('click', e => {
  const b = e.target.closest('button.op'); if (!b || b.disabled) return;
  if (CFG.modo === 'simulacro' && (!ACT || ST.fin[ACT])) return;
  ST.r[b.dataset.id] = b.dataset.l; save();
  const it = ITEMS.find(i => i.id === b.dataset.id);
  const n = b.closest('.item').querySelector('.n').textContent.replace('.','');
  b.closest('.item').outerHTML = itemHTML(it, n, CFG.modo === 'practica' ? 'practica' : 'examen');
  if (CFG.modo === 'practica') { const resp = LIST.filter(i => ST.r[i.id]); const ok = resp.filter(i => ST.r[i.id]===keyOf(i)).length; $('#prog').textContent = `${ok}/${resp.length} aciertos`; $('#pst').textContent = `${LIST.length} preguntas · respondidas ${resp.length} · aciertos ${ok} (${Math.round(100*ok/resp.length)} %)`; }
  else progreso();
});
if (CFG.modo === 'practica') practica();
else if (ACT && ST.t[ACT] && !ST.fin[ACT]) examen();
else inicio();
</script>
</body>
</html>
