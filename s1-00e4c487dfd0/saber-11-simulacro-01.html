ima. No es una exageración: es lo que los científicos llaman «isla de calor urbana».\n\n(2) El fenómeno está bien estudiado. Las superficies duras y oscuras, como el asfalto y muchos techos, absorben buena parte de la energía del sol y la liberan lentamente, incluso después del atardecer. Los árboles, en cambio, enfrían el ambiente de dos maneras: dan sombra y transpiran, es decir, liberan vapor de agua por las hojas; convertir el agua en vapor consume energía y enfría las hojas y el aire. Por eso una ciudad no tiene una sola temperatura: dentro de ella hay zonas más frescas y zonas más calientes, y esas diferencias suelen coincidir con la cantidad de verde.\n\n(3) Lo que me interesa señalar es que esas diferencias no se reparten al azar. Los barrios con menos árboles suelen ser también los de menores ingresos, donde menos hogares pueden pagar un ventilador potente o un aire acondicionado y donde más personas trabajan a pleno sol. El calor, entonces, no es solo un asunto del clima: es también un asunto de quién tiene sombra y quién no.\n\n(4) Se dirá que hay problemas más urgentes que sembrar árboles. Pero un árbol no es un adorno: reduce el consumo de energía, protege del sol a quienes esperan el bus y vuelve habitable un espacio que hoy se evita. Y no hay que esperar a que una ola de calor deje víctimas para entenderlo.\n\n(5) Propongo, por eso, que los planes de arborización dejen de medirse solo por el número total de árboles sembrados en la ciudad y empiecen a medirse por barrio. Sembrar mil árboles en un parque que ya tiene sombra se ve bien en un informe, pero no cambia la vida de quien camina a mediodía por una calle desnuda. La sombra, como el agua y la luz, debería repartirse con un criterio de justicia.", "vis": "", "items": [{"id": "LCA-129", "niv": 1, "cp": "lc_local", "cn": "", "e": "Según el párrafo (2), los árboles enfrían el ambiente porque", "f": "Párrafo (2)", "vis": "", "o": [["A", "absorben la energía del sol y la liberan lentamente después del atardecer.", "Eso es lo que hacen las superficies duras como el asfalto, según el mismo párrafo.", false], ["B", "bloquean el sol y, al pasar agua a vapor en sus hojas, le quitan calor al aire.", "El texto dice que enfrían «de dos maneras»: dan sombra y transpiran; convertir el agua en vapor «consume energía y enfría las hojas y el aire».", true], ["C", "reflejan el calor del mediodía hacia los techos de zinc de las casas vecinas.", "El texto no atribuye a los árboles esa función; los techos de zinc se mencionan como parte del problema.", false], ["D", "hacen que menos personas salgan a la calle en las horas de más calor.", "Que nadie salga a la calle es un efecto del calor en barrios sin árboles, no una forma de enfriar.", false]]}, {"id": "LCA-130", "niv": 2, "cp": "lc_global", "cn": "", "e": "En el texto, el párrafo (2) cumple la función de", "f": "Párrafos (1) y (2)", "vis": "", "o": [["A", "responder a quienes piensan que hay problemas más urgentes que sembrar árboles.", "Esa objeción y su respuesta están en el párrafo (4).", false], ["B", "presentar la propuesta concreta que el autor hace a quienes planean la arborización.", "La propuesta (medir la arborización por barrio) aparece en el párrafo (5).", false], ["C", "mostrar que el calor urbano afecta más a los barrios de menores ingresos de la ciudad.", "Esa idea, central para el autor, se desarrolla en el párrafo (3).", false], ["D", "explicar científicamente lo que el autor describió en el (1) desde su experiencia.", "El (1) narra el calor del barrio y nombra la «isla de calor urbana»; el (2) explica sus causas y el papel de los árboles.", true]]}, {"id": "LCA-131", "niv": 2, "cp": "lc_global", "cn": "", "e": "¿Cuál es la tesis que defiende el autor de la columna?", "f": "Párrafo (5)", "vis": "", "o": [["A", "La siembra de árboles debe favorecer primero a los barrios que hoy no tienen sombra.", "El autor lo dice en el párrafo (5): medir la siembra por barrio, porque la sombra «debería repartirse con un criterio de justicia».", true], ["B", "Las islas de calor son el principal problema de salud pública de las ciudades del país.", "Es una generalización que el texto no hace; el autor habla de un problema importante, no del principal.", false], ["C", "Conviene sembrar los árboles en parques grandes, porque allí crecen mejor y se ven más.", "El autor critica precisamente sembrar «mil árboles en un parque que ya tiene sombra».", false], ["D", "Las ciudades deben reemplazar el asfalto oscuro por materiales claros que reflejen el sol.", "El texto explica que las superficies oscuras absorben calor, pero no propone reemplazarlas.", false]]}, {"id": "LCA-132", "niv": 1, "cp": "lc_reflexion", "cn": "", "e": "En el párrafo (4), la frase «Se dirá que hay problemas más urgentes que sembrar árboles» sirve para", "f": "Párrafo (4)", "vis": "", "o": [["A", "señalar cuál es la causa principal de las islas de calor.", "Las causas se explican en el párrafo (2); la frase del (4) no trata de causas.", false], ["B", "admitir que la arborización debe esperar hasta que se resuelvan otros problemas.", "El autor no acepta la objeción; la refuta en las frases siguientes.", false], ["C", "adelantarse a una posible crítica a su propuesta para luego rebatirla.", "El autor presenta una posible crítica a su postura e inmediatamente la contesta («Pero un árbol no es un adorno…»).", true], ["D", "presentar la opinión de las autoridades ambientales de la ciudad.", "La frase no atribuye la idea a ninguna autoridad; es una objeción hipotética.", false]]}, {"id": "LCA-133", "niv": 3, "cp": "lc_reflexion", "cn": "", "e": "En el párrafo (3), el autor afirma que los barrios con menos árboles suelen ser los de menores ingresos. ¿Qué información serviría mejor para sustentar esa afirmación?", "f": "Párrafo (3)", "vis": "", "o": [["A", "Una lista de las especies de árboles que mejor resisten el calor de la ciudad.", "Sirve para planear la siembra, pero no dice nada sobre la relación entre árboles e ingresos.", false], ["B", "Datos de árboles y de ingresos de los hogares en muchos barrios de la ciudad.", "La afirmación relaciona dos variables en toda la ciudad; para sostenerla hacen falta datos de ambas en muchos barrios.", true], ["C", "Testimonios de vecinos del barrio del autor que trabajan a pleno sol cada día.", "Son experiencias de un solo barrio; no muestran una tendencia entre árboles e ingresos en la ciudad.", false], ["D", "El número total de árboles sembrados en la ciudad durante el último año.", "Un total no permite saber cómo se reparten los árboles entre barrios de distintos ingresos.", false]]}, {"id": "LCA-134", "niv": 2, "cp": "lc_reflexion", "cn": "", "e": "Un funcionario anuncia: «Este año superamos la meta: sembramos 20.000 árboles en la ciudad». Desde la perspectiva del autor, este anuncio es insuficiente porque", "f": "Párrafo (5)", "vis": "", "o": [["A", "mide el éxito por la cantidad sembrada y no por el lugar donde quedaron los árboles.", "El autor propone medir la arborización «por barrio», porque lo importante es si los árboles llegan a las calles sin sombra, no el total.", true], ["B", "los árboles, según la columna, tienen un efecto muy pequeño sobre la temperatura de la ciudad.", "La columna afirma que los árboles sí enfrían el ambiente y reducen el consumo de energía.", false], ["C", "el autor considera más útil destinar ese dinero a comprar ventiladores para los hogares.", "El autor menciona los ventiladores para mostrar la desigualdad, no como alternativa a los árboles.", false], ["D", "20.000 árboles es una cantidad demasiado baja para enfriar una ciudad entera.", "El autor no discute si la cifra total es alta o baja; critica que se mida solo el total.", false]]}]}, {"comp": "lectura_critica", "sim": "s11-1", "ses": 1, "ind": "Historieta: el mirador", "tt": "Caricatura o cómic", "texto": "Historieta: «El mirador»\n\nViñeta 1: Atardecer en un mirador sobre una gran ciudad. Un letrero dice: «Mirador Los Cerros. La mejor vista de la ciudad». Una fila de personas está de espaldas al paisaje; cada una sostiene el celular en alto para tomarse una foto con la ciudad detrás.\n\nViñeta 2: En una banca, una niña con una libreta le pregunta a su abuelo: «Abuelo, ¿por qué todos le dan la espalda a la vista?». El abuelo, sonriendo, responde: «Para poder mostrar después que la vieron».\n\nViñeta 3: El sol ya se ocultó. Las personas de la fila revisan sus fotos en las pantallas, con caras de satisfacción. El abuelo y la niña siguen en la banca, mirando cómo se encienden las luces de la ciudad. La niña dibuja en su libreta.\n\nViñeta 4: Una mujer de la fila se acerca a la niña y mira el dibujo de la ciudad iluminada. Dice: «¡Qué lindo! ¿Me dejas tomarle una foto?».", "vis": "", "items": [{"id": "LCA-135", "niv": 1, "cp": "lc_local", "cn": "", "e": "Según la viñeta 1, ¿por qué las personas de la fila están de espaldas a la ciudad?", "f": "Viñeta 1", "vis": "", "o": [["A", "Porque están mirando a la niña y al abuelo sentados en la banca.", "Miran sus celulares, no a la niña y al abuelo.", false], ["B", "Porque están haciendo fila para entrar a otra parte del mirador.", "La fila no se dirige a ningún lugar; todas se toman fotos con la ciudad detrás.", false], ["C", "Porque el sol del atardecer les da directamente en la cara.", "La historieta no menciona que el sol las moleste; explica que se están tomando fotos.", false], ["D", "Porque quieren salir en una foto con el paisaje de fondo.", "La viñeta 1 dice que cada una sostiene el celular «para tomarse una foto con la ciudad detrás».", true]]}, {"id": "LCA-136", "niv": 3, "cp": "lc_global", "cn": "", "e": "¿Qué relación hay entre la respuesta del abuelo en la viñeta 2 y lo que ocurre en la viñeta 4?", "f": "Viñetas 2 y 4", "vis": "", "o": [["A", "La mujer, arrepentida, decide dibujar en lugar de usar el celular para registrar la vista.", "La mujer no dibuja ni guarda el celular; pide permiso para usarlo.", false], ["B", "La mujer contradice al abuelo, pues demuestra que la gente sí se detiene a contemplar el paisaje.", "La mujer no contempla el paisaje: mira un dibujo y enseguida pide fotografiarlo.", false], ["C", "En la viñeta 4 se repite, ante el dibujo, la actitud que el abuelo describió ante el paisaje.", "La mujer, en lugar de solo mirar el dibujo, quiere fotografiarlo: convierte de nuevo la experiencia en una foto, como el abuelo explicó en la viñeta 2.", true], ["D", "La viñeta 4 muestra que la niña también prefiere las fotos a la vista directa de la ciudad.", "La niña dibuja mientras observa la ciudad; es la mujer quien quiere tomar la foto.", false]]}, {"id": "LCA-137", "niv": 1, "cp": "lc_reflexion", "cn": "", "e": "¿Cuál es la crítica principal que plantea la historieta?", "f": "Viñetas 1 a 4", "vis": "", "o": [["A", "La dificultad de las personas mayores para aprender a usar la tecnología.", "El abuelo no intenta usar el celular ni muestra dificultad con él; su respuesta es irónica sobre los demás.", false], ["B", "El hábito de registrar las experiencias para mostrarlas, en vez de vivirlas.", "Las personas dan la espalda a la vista para fotografiarse y la mujer quiere fotografiar el dibujo; el abuelo y la niña, en cambio, miran la ciudad.", true], ["C", "La falta de miradores y espacios públicos para disfrutar del paisaje urbano.", "El mirador existe y está lleno de gente; la historieta no critica su ausencia.", false], ["D", "La contaminación lumínica que producen las grandes ciudades al anochecer.", "Las luces de la ciudad aparecen como algo que se contempla con gusto, no como un problema.", false]]}]}, {"comp": "lectura_critica", "sim": "s11-1", "ses": 1, "ind": "Tabla: encuesta de movilidad de una ciudad ficticia", "tt": "Texto discontinuo", "texto": "La Secretaría de Movilidad de Villa Serena, una ciudad intermedia imaginaria, publicó los resultados de su encuesta de movilidad con el siguiente mensaje: «Moverse en bus es lo que más tiempo cuesta. Por eso este año ampliaremos los carriles exclusivos para buses en las vías principales».", "vis": "<table class=\"vt\"><caption>Tabla 3. ¿Cómo viajan al trabajo o al estudio los habitantes de Villa Serena?<\/caption><thead><tr><th>Modo de transporte<\/th><th>Porcentaje de viajes<\/th><th>Tiempo promedio por viaje (minutos)<\/th><th>Costo promedio por viaje<\/th><\/tr><\/thead><tbody><tr><td>A pie<\/td><td>24 %<\/td><td>18<\/td><td>$ 0<\/td><\/tr><tr><td>Bicicleta<\/td><td>9 %<\/td><td>22<\/td><td>$ 0<\/td><\/tr><tr><td>Bus urbano<\/td><td>38 %<\/td><td>47<\/td><td>$ 2.900<\/td><\/tr><tr><td>Moto<\/td><td>17 %<\/td><td>25<\/td><td>$ 1.800<\/td><\/tr><tr><td>Carro particular<\/td><td>12 %<\/td><td>35<\/td><td>$ 6.500<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Fuente: encuesta ficticia a 2.000 hogares, 2026. El costo incluye pasaje o combustible y parqueadero; no incluye la compra ni el mantenimiento del vehículo.<\/div>", "items": [{"id": "LCA-138", "niv": 1, "cp": "lc_local", "cn": "", "e": "Según la tabla, ¿cuántos minutos más tarda, en promedio, un viaje en bus urbano que un viaje en carro particular?", "f": "Tabla 3 (cálculo propio)", "vis": "", "o": [["A", "10 minutos.", "No corresponde a ninguna diferencia entre los dos modos; resulta de una lectura o resta equivocada.", false], ["B", "12 minutos.", "Bus urbano: 47 minutos; carro particular: 35 minutos. 47 − 35 = 12.", true], ["C", "22 minutos.", "Es la diferencia entre el bus (47) y la moto (25), no entre el bus y el carro.", false], ["D", "25 minutos.", "Es la diferencia entre el bus (47) y la bicicleta (22), no entre el bus y el carro.", false]]}, {"id": "LCA-139", "niv": 2, "cp": "lc_global", "cn": "", "e": "¿Qué se puede afirmar al comparar el porcentaje de viajes con el tiempo promedio de cada modo?", "f": "Tabla 3", "vis": "", "o": [["A", "El modo más usado es también el que más tiempo tarda en promedio.", "El bus urbano tiene el mayor porcentaje de viajes (38 %) y el mayor tiempo promedio (47 minutos).", true], ["B", "Los modos que no tienen costo son los menos usados por la población.", "Ir a pie, que no tiene costo, es el segundo modo más usado (24 %).", false], ["C", "A mayor costo por viaje, mayor es el tiempo promedio que se tarda.", "El carro es el más costoso ($ 6.500) pero tarda menos (35 min) que el bus ($ 2.900; 47 min).", false], ["D", "Los modos más usados son, en general, los más rápidos de la ciudad.", "El más usado, el bus, es el más lento según la tabla.", false]]}, {"id": "LCA-140", "niv": 3, "cp": "lc_global", "cn": "", "e": "De acuerdo con la tabla, ¿cuál afirmación es correcta?", "f": "Tabla 3 (cálculo propio)", "vis": "", "o": [["A", "Más de la mitad de los viajes de la ciudad se hace en bus urbano.", "El bus representa el 38 % de los viajes, menos de la mitad.", false], ["B", "La mayoría de los viajes se hace en moto o en carro particular.", "Moto y carro suman 17 % + 12 % = 29 %, muy lejos de la mayoría.", false], ["C", "Quienes viajan más de 30 minutos prefieren el carro particular.", "La tabla da promedios por modo; no permite saber qué prefieren quienes hacen viajes largos.", false], ["D", "Cerca de uno de cada tres viajes se hace sin pagar pasaje ni combustible.", "A pie (24 %) y en bicicleta (9 %) suman 33 %, con costo de $ 0: aproximadamente un tercio de los viajes.", true]]}, {"id": "LCA-141", "niv": 3, "cp": "lc_reflexion", "cn": "", "e": "La Secretaría concluye: «Moverse en bus es lo que más tiempo cuesta. Por eso ampliaremos los carriles exclusivos para buses». ¿Se sigue esa decisión de los datos de la tabla?", "f": "Tabla 3 y mensaje de la Secretaría", "vis": "", "o": [["A", "No del todo: la tabla muestra que el bus es lento, pero no si la causa es la congestión.", "La tabla da tiempos promedio por viaje, pero no distingue espera, distancia recorrida ni congestión; los carriles exclusivos solo ayudan si el problema es el tráfico.", true], ["B", "Sí, porque los datos prueban que los carriles exclusivos reducen el tiempo de viaje.", "La tabla no contiene información sobre el efecto de los carriles exclusivos.", false], ["C", "No, porque según la tabla la mayoría de los viajes en la ciudad se hace a pie.", "Los viajes a pie son el 24 %; el modo más usado es el bus (38 %).", false], ["D", "Sí, porque el bus es a la vez el modo más usado y el más costoso de la ciudad.", "El bus no es el más costoso: el carro particular cuesta $ 6.500 por viaje y el bus $ 2.900.", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "s11-1", "ses": 1, "ind": "Acción de tutela por un medicamento negado", "tt": "", "texto": "Doña Mercedes, de 67 años, tiene una enfermedad cardíaca. Su médico tratante le formuló un medicamento, pero la entidad promotora de salud (EPS) se negó a entregarlo con el argumento de que «resulta muy costoso». Sin ese tratamiento, su vida corre peligro. Su nieto quiere ayudarla a reclamar ante un juez la protección inmediata de su derecho a la salud y a la vida.", "vis": "", "items": [{"id": "SCA-101", "niv": 1, "cp": "sc_pensamiento_social", "cn": "", "e": "¿Cuál es el mecanismo constitucional que corresponde a la situación de doña Mercedes?", "f": "Constitución Política de Colombia, art. 86 (acción de tutela) y art. 87 (acción de cumplimiento).", "vis": "", "o": [["A", "La revocatoria del mandato.", "La revocatoria del mandato es un mecanismo de participación política para retirar del cargo a un gobernador o alcalde elegido; no protege derechos de una persona ante una EPS.", false], ["B", "El cabildo abierto.", "El cabildo abierto es una reunión pública de concejos o juntas administradoras locales para discutir asuntos de la comunidad; no es un mecanismo judicial de protección de derechos.", false], ["C", "La acción de cumplimiento.", "La acción de cumplimiento (art. 87) sirve para exigir que una autoridad cumpla una ley o un acto administrativo; aquí lo que se busca es proteger de inmediato derechos fundamentales de una persona.", false], ["D", "La acción de tutela.", "Correcta. El artículo 86 de la Constitución consagra la tutela para reclamar ante los jueces, mediante un procedimiento preferente y sumario, la protección inmediata de derechos fundamentales amenazados o vulnerados, como la vida y la salud.", true]]}, {"id": "SCA-102", "niv": 2, "cp": "sc_pensamiento_social", "cn": "", "e": "El nieto presenta la tutela el 3 de marzo, y el juez la resuelve el 28 de marzo. Según la Constitución, ¿qué se puede afirmar de esa demora?", "f": "Constitución Política de Colombia, art. 86 (plazo de diez días) y art. 30 (habeas corpus).", "vis": "", "o": [["A", "Es válida, porque la Constitución da a los jueces seis meses para resolver las tutelas sobre salud.", "La Constitución no fija seis meses; ese plazo no existe para la tutela. El plazo es de diez días.", false], ["B", "Incumple el término de treinta y seis horas que la Constitución fija para resolver toda tutela.", "Treinta y seis horas es el término para resolver el habeas corpus (art. 30), no la acción de tutela.", false], ["C", "Incumple el plazo máximo de diez días que fija la Constitución para resolver la tutela.", "Correcta. El artículo 86 establece que «en ningún caso podrán transcurrir más de diez días entre la solicitud de tutela y su resolución»; 25 días superan ese límite.", true], ["D", "Es válida, porque la Constitución deja que cada juez fije el plazo según la complejidad del caso.", "La Constitución sí fija un plazo máximo para la tutela (diez días); no lo deja al criterio del juez.", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "s11-1", "ses": 1, "ind": "Conflicto por un proyecto de embalse", "tt": "", "texto": "En un municipio ribereño se discute la construcción de un embalse para generar energía eléctrica. Estas son algunas opiniones recogidas en una audiencia pública:\n\nGerente de la empresa: «El embalse producirá energía para medio millón de hogares y dejará regalías al municipio. En otro municipio del país un proyecto parecido trajo progreso, así que aquí ocurrirá lo mismo».\n\nPescadora artesanal: «Mi familia ha vivido del río por cuatro generaciones. Si represan el agua, los peces no podrán subir a desovar. Ninguna plata reemplaza el río: es nuestra forma de vida».\n\nAgricultor de la vega: «Mis cultivos dependen de las crecientes que abonan la tierra. Si el río deja de crecer, la tierra se empobrece».\n\nComerciante del pueblo: «Durante la obra llegarán trabajadores que comprarán en las tiendas. Lo importante es que haya empleo y dinero circulando».", "vis": "", "items": [{"id": "SCA-106", "niv": 1, "cp": "sc_perspectivas", "cn": "", "e": "¿Qué preocupación comparten la pescadora y el agricultor?", "f": "Análisis de las intervenciones del caso.", "vis": "", "o": [["A", "Que el embalse altere el comportamiento natural del río del que dependen sus actividades.", "Correcta. La pescadora teme que los peces no puedan subir a desovar y el agricultor teme que el río deje de crecer y abonar la tierra: ambos dependen del funcionamiento natural del río.", true], ["B", "Que la energía producida no alcance para los hogares del municipio.", "Nadie en la audiencia expresa esa preocupación; el gerente, por el contrario, destaca la cantidad de energía que se producirá.", false], ["C", "Que durante la obra no lleguen suficientes trabajadores a comprar en el pueblo.", "Esa es la perspectiva del comerciante, centrada en el comercio durante la obra, no la de la pescadora ni la del agricultor.", false], ["D", "Que el embalse no deje regalías suficientes para invertir en las necesidades del municipio.", "Las regalías las menciona el gerente como beneficio; ni la pescadora ni el agricultor hablan de ellas.", false]]}, {"id": "SCA-107", "niv": 2, "cp": "sc_perspectivas", "cn": "", "e": "La empresa propone mantener el proyecto tal como está y pagar a cada familia afectada una indemnización en dinero. ¿Cuál de los participantes es más probable que rechace esta propuesta, según lo que expresó?", "f": "Análisis de las intervenciones del caso.", "vis": "", "o": [["A", "El agricultor, porque considera que el embalse inundará sus tierras de cultivo.", "El agricultor no habla de inundaciones: teme que el río deje de crecer y la tierra se empobrezca. Además, a diferencia de la pescadora, no dice que el dinero sea incapaz de compensar la pérdida.", false], ["B", "El gerente, porque considera que las indemnizaciones reducirían las regalías del municipio.", "El gerente representa a la empresa que hace la propuesta; no hay indicios de que la rechace.", false], ["C", "La pescadora, porque considera que el río es una forma de vida que el dinero no puede reemplazar.", "Correcta. La pescadora afirma que «ninguna plata reemplaza el río»; una compensación solo económica no responde a lo que ella valora.", true], ["D", "El comerciante, porque considera que el dinero de las indemnizaciones no circulará en el pueblo.", "El comerciante valora que haya «empleo y dinero circulando»; nada de lo que dijo permite suponer que rechazaría pagos en dinero.", false]]}, {"id": "SCA-108", "niv": 3, "cp": "sc_perspectivas", "cn": "", "e": "¿Qué debilidad tiene el argumento del gerente sobre el progreso que traerá el embalse?", "f": "Análisis de argumentos: generalización apresurada.", "vis": "", "o": [["A", "Acude a las emociones de la comunidad en lugar de presentar hechos verificables.", "El gerente no apela a emociones; presenta un ejemplo y una predicción. Su problema es la generalización, no un llamado emocional.", false], ["B", "Contradice lo que afirma el comerciante sobre el empleo durante la obra.", "Las intervenciones del gerente y del comerciante son compatibles: ambos ven beneficios económicos. No hay contradicción entre ellas.", false], ["C", "Se basa en datos sobre la energía producida, que no tienen relación con el municipio.", "El dato sobre la energía no es la parte débil del argumento sobre el progreso; la debilidad está en el paso de un caso a otro.", false], ["D", "Generaliza desde un único caso sin probar que los municipios sean comparables.", "Correcta. El gerente concluye que «aquí ocurrirá lo mismo» porque ocurrió en otro municipio; un solo ejemplo no basta si no se prueba que las condiciones (río, economía, población) son semejantes.", true]]}, {"id": "SCA-109", "niv": 2, "cp": "sc_reflexivo_sistemico", "cn": "", "e": "¿Qué dimensiones del problema se contraponen principalmente en esta discusión?", "f": "Análisis de dimensiones de una problemática social.", "vis": "", "o": [["A", "La política y jurídica, frente a la laboral y comercial.", "Ni la alcaldía ni los permisos de la obra aparecen en las intervenciones; además, lo laboral y comercial está del lado de quienes apoyan el proyecto, no frente a ellos.", false], ["B", "La económica y energética, frente a la ambiental y cultural.", "Correcta. La empresa y el comerciante destacan beneficios económicos y energéticos; la pescadora y el agricultor resaltan efectos sobre el ecosistema del río y sobre formas de vida tradicionales.", true], ["C", "La energética y regional, frente a la económica y comercial.", "La energía y el comercio están del mismo lado: el gerente y el comerciante los presentan como beneficios. No se contraponen entre sí.", false], ["D", "La laboral y sanitaria, frente a la de seguridad y vivienda.", "Nadie en la audiencia plantea problemas de salud, seguridad o vivienda; la tensión expresada es entre beneficios económicos y efectos sobre el río y las formas de vida.", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "s11-1", "ses": 1, "ind": "Separación de Panamá", "tt": "", "texto": "A comienzos del siglo XX Colombia perdió el istmo de Panamá. Dos historiadores ficticios explican el hecho así:\n\nHistoriador A: «La separación fue posible porque Estados Unidos, interesado en construir un canal interoceánico, respaldó a los separatistas cuando el Congreso colombiano rechazó el tratado que le daba esa concesión».\n\nHistoriador B: «Los panameños llevaban años quejándose del abandono del gobierno central. La guerra civil que acababa de terminar había arruinado la región, y sus élites vieron en la separación una salida económica».", "vis": "", "items": [{"id": "SCA-112", "niv": 2, "cp": "sc_pensamiento_social", "cn": "", "e": "¿Cuál es el orden cronológico correcto de estos hechos?\n\n1. Rechazo del tratado Herrán-Hay por el Congreso colombiano.\n2. Expedición de la Constitución centralista de 1886.\n3. Separación de Panamá.\n4. Inicio de la Guerra de los Mil Días.", "f": "Banco de la República (cronología de hechos de paz); Biblioteca Nacional de Panamá, «El Panamá colombiano 1821-1903», cap. XI.", "vis": "", "o": [["A", "2, 4, 3, 1.", "La separación de Panamá fue posterior al rechazo del tratado; ese rechazo fue uno de sus antecedentes.", false], ["B", "2, 1, 4, 3.", "El rechazo del tratado (1903) ocurrió después de iniciada la Guerra de los Mil Días (1899).", false], ["C", "4, 2, 1, 3.", "La Guerra de los Mil Días (1899-1902) es posterior a la Constitución de 1886, no anterior.", false], ["D", "2, 4, 1, 3.", "Correcta. La Constitución es de 1886; la Guerra de los Mil Días comenzó en 1899; el Congreso rechazó el tratado Herrán-Hay en agosto de 1903, y Panamá se separó el 3 de noviembre de 1903.", true]]}, {"id": "SCA-113", "niv": 3, "cp": "sc_perspectivas", "cn": "", "e": "¿Qué relación hay entre las dos explicaciones?", "f": "Análisis de fuentes secundarias ficticias.", "vis": "", "o": [["A", "Las dos atribuyen la separación únicamente a la Guerra de los Mil Días.", "Solo B menciona la guerra, y como uno de varios factores; A no la menciona.", false], ["B", "A destaca un factor externo y B, factores internos; las dos explicaciones pueden complementarse.", "Correcta. A pone el énfasis en el interés de Estados Unidos y B en el abandono del istmo y la crisis tras la guerra; ninguna niega a la otra, por lo que pueden integrarse en una explicación más completa.", true], ["C", "A sostiene que los panameños no tenían quejas contra el gobierno central.", "A no se refiere a las quejas de los panameños; atribuirle esa afirmación es leer más de lo que dice.", false], ["D", "B niega que Estados Unidos haya tenido algún interés económico o político en construir un canal por Panamá.", "B no menciona a Estados Unidos; no decir algo no equivale a negarlo.", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "s11-1", "ses": 1, "ind": "Declaración de los Derechos del Hombre y del Ciudadano", "tt": "", "texto": "En agosto de 1789, la Asamblea Nacional de Francia aprobó la Declaración de los Derechos del Hombre y del Ciudadano. Su primer artículo afirma, en esencia, que los hombres nacen y permanecen libres e iguales en derechos, y que las distinciones sociales solo pueden fundarse en la utilidad común.", "vis": "", "items": [{"id": "SCA-116", "niv": 2, "cp": "sc_perspectivas", "cn": "", "e": "¿Contra qué orden social se dirigía principalmente esta idea en la Francia de 1789?", "f": "Historia universal: Revolución francesa (1789) y Antiguo Régimen.", "vis": "", "o": [["A", "Contra un orden en el que el poder del rey estaba limitado por una constitución escrita.", "La crítica se dirigía a una monarquía absoluta y a los privilegios estamentales, no a un poder ya limitado por una constitución.", false], ["B", "Contra un orden en el que todos los habitantes tenían los mismos derechos políticos.", "Si todos hubieran tenido los mismos derechos, la declaración de igualdad no habría sido una ruptura; la sociedad del Antiguo Régimen era desigual.", false], ["C", "Contra un orden en el que el clero y la nobleza tenían privilegios por nacimiento.", "Correcta. En el Antiguo Régimen la sociedad se dividía en estamentos y el clero y la nobleza gozaban de privilegios heredados; afirmar que las distinciones solo se fundan en la utilidad común atacaba esos privilegios.", true], ["D", "Contra un orden en el que los obreros industriales controlaban el gobierno.", "En 1789 los obreros industriales no controlaban el gobierno de Francia; ese escenario no corresponde al contexto.", false]]}, {"id": "SCA-117", "niv": 3, "cp": "sc_perspectivas", "cn": "", "e": "Una estudiante usa solo este documento para afirmar que «desde 1789 todas las personas en Francia tuvieron, en la práctica, los mismos derechos». ¿Cuál es la principal limitación de usar esta fuente para sostener esa afirmación?", "f": "Análisis crítico de fuentes primarias.", "vis": "", "o": [["A", "Una declaración expresa principios, pero por sí sola no demuestra cómo se aplicaron en la vida real.", "Correcta. Un texto normativo dice lo que debería ser; para saber cómo se vivió en la práctica se necesitan otras fuentes, como leyes posteriores, registros o testimonios.", true], ["B", "Recoge solo la opinión de un diputado y no la de la Asamblea que la aprobó.", "El caso indica que la Declaración fue aprobada por la Asamblea Nacional; no es la opinión de un solo diputado.", false], ["C", "Es una fuente secundaria, escrita muchos años después de la Revolución francesa por historiadores de otros países.", "La declaración es una fuente primaria: fue producida en 1789 por los propios protagonistas.", false], ["D", "Fue escrita en otro idioma y por eso su contenido no puede conocerse con certeza.", "El idioma no impide conocer el contenido de una fuente traducida; esa no es la limitación central.", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "s11-1", "ses": 1, "ind": "Testimonios del 9 de abril de 1948", "tt": "", "texto": "El 9 de abril de 1948 fue asesinado en Bogotá el dirigente liberal Jorge Eliécer Gaitán, lo que desató una ola de disturbios conocida como el Bogotazo. Estos son dos testimonios ficticios de la época:\n\nTestimonio 1 (dueño de un almacén del centro): «Saquearon mi negocio en pocas horas. Era una turba sin control; no había policía que nos protegiera. Lo perdí todo y temo que esto se repita».\n\nTestimonio 2 (obrero seguidor de Gaitán): «Mataron al hombre que hablaba por los pobres. La gente salió a la calle con rabia porque sentimos que nos habían quitado la única esperanza de cambio».", "vis": "", "items": [{"id": "SCA-121", "niv": 2, "cp": "sc_perspectivas", "cn": "", "e": "¿Qué explica mejor la diferencia entre los dos testimonios?", "f": "Análisis de fuentes primarias ficticias; contexto: 9 de abril de 1948.", "vis": "", "o": [["A", "Los dos testigos se refieren a días distintos y por eso no coinciden.", "Ambos se refieren al 9 de abril y a los disturbios posteriores al asesinato; no hay indicio de fechas diferentes.", false], ["B", "La posición social y la experiencia de cada uno frente a los hechos influyen en lo que destaca.", "Correcta. El comerciante resalta los saqueos y la pérdida de su negocio; el obrero, la indignación por la muerte de un líder con el que se identificaba. Su lugar en la sociedad y lo que vivieron orientan su relato.", true], ["C", "El comerciante apoyaba a Gaitán y el obrero se oponía a él.", "Es al contrario: el obrero se declara seguidor de Gaitán, y del comerciante no se dice su filiación política.", false], ["D", "Uno de los dos testimonios es falso, porque los hechos solo pueden contarse de una manera.", "Dos relatos distintos sobre el mismo hecho no implican que uno sea falso; pueden reflejar experiencias y puntos de vista diferentes.", false]]}, {"id": "SCA-122", "niv": 3, "cp": "sc_perspectivas", "cn": "", "e": "Un investigador quiere establecer cuántos establecimientos fueron saqueados en Bogotá ese día. ¿Para qué le sirve el testimonio 1?", "f": "Análisis crítico de fuentes: alcance y límites de un testimonio.", "vis": "", "o": [["A", "Le sirve para conocer la experiencia de un afectado, pero no para establecer la cifra total de saqueos.", "Correcta. Un testimonio individual aporta información valiosa sobre cómo se vivieron los hechos, pero para una cifra de la ciudad se requieren fuentes más amplias, como registros oficiales, prensa o archivos.", true], ["B", "Le sirve para comprobar que los saqueos se concentraron en los barrios del centro de Bogotá.", "El testigo solo cuenta lo que le pasó a su negocio; no compara barrios ni permite saber dónde se concentraron los saqueos.", false], ["C", "Le sirve para saber cuántos almacenes había en el centro, pero no cuántos fueron saqueados.", "El testigo solo habla de su propio negocio; no informa cuántos almacenes había en el centro.", false], ["D", "Le sirve como dato principal, aunque debe completarse con el relato de otro comerciante del centro.", "Dos o tres testimonios siguen siendo experiencias individuales; para una cifra de toda la ciudad se necesitan registros oficiales, prensa o archivos.", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "s11-1", "ses": 1, "ind": "Becas para jóvenes rurales", "tt": "", "texto": "Una gobernación decide reservar el 30 % de las becas de su fondo de educación superior para jóvenes de zonas rurales, porque los datos muestran que, aunque tienen buenos resultados escolares, muy pocos logran entrar a la universidad por falta de recursos y por la distancia. Un ciudadano de la capital protesta: «Esto es discriminación: todos debemos competir exactamente en las mismas condiciones».", "vis": "", "items": [{"id": "SCA-123", "niv": 3, "cp": "sc_reflexivo_sistemico", "cn": "", "e": "¿Con qué principio de la Constitución de 1991 es coherente la decisión de la gobernación?", "f": "Constitución Política de Colombia, arts. 1, 13 y 67.", "vis": "", "o": [["A", "Con la prohibición de que las entidades territoriales manejen recursos para la educación.", "No existe esa prohibición; las gobernaciones pueden invertir en educación.", false], ["B", "Con la idea de que la igualdad consiste solo en aplicar a todos la misma regla, sin importar su situación.", "Esa idea es la que defiende el ciudadano que protesta; la decisión de la gobernación se aparta de ella para compensar desventajas.", false], ["C", "Con el principio de que la educación es un servicio que el Estado no debe financiar.", "El artículo 67 define la educación como derecho y servicio público con función social; la decisión no se basa en que el Estado no deba financiarla.", false], ["D", "Con el deber estatal de promover la igualdad real y efectiva y proteger a grupos marginados.", "Correcta. El artículo 13 dice que el Estado promoverá las condiciones para que la igualdad sea real y efectiva y adoptará medidas en favor de grupos discriminados o marginados; reservar becas para quienes tienen desventajas de acceso responde a ese mandato.", true]]}]}, {"comp": "sociales_ciudadanas", "sim": "s11-1", "ses": 1, "ind": "Reducción de aranceles", "tt": "", "texto": "Un país decide reducir los aranceles, es decir, los impuestos que pagan los productos importados al entrar a su territorio. El objetivo declarado es que los consumidores accedan a productos más baratos y que las empresas nacionales se vuelvan más competitivas.", "vis": "", "items": [{"id": "SCA-124", "niv": 2, "cp": "sc_reflexivo_sistemico", "cn": "", "e": "De acuerdo con el modelo de libre comercio que orienta esta decisión, ¿cuál de los siguientes efectos es esperable?", "f": "Concepto económico: aranceles y libre comercio.", "vis": "", "o": [["A", "Las empresas nacionales quedarán protegidas de la competencia extranjera.", "La protección frente a la competencia extranjera es el efecto de los aranceles altos, no de su reducción.", false], ["B", "Los productos importados serán más caros para los consumidores.", "Los aranceles encarecen los importados; si se reducen, esos productos tienden a abaratarse.", false], ["C", "Los productores nacionales enfrentarán más competencia de productos importados.", "Correcta. Al bajar los aranceles, los productos extranjeros entran más baratos y compiten con los nacionales; esa competencia es precisamente lo que el modelo busca para presionar la eficiencia.", true], ["D", "El Estado recaudará más dinero por cada producto importado.", "Al bajar el impuesto por producto, el recaudo por unidad importada disminuye.", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "s11-1", "ses": 1, "ind": "Columna sobre los jóvenes y la información", "tt": "", "texto": "Columna de opinión ficticia: «Los jóvenes de hoy solo se informan por videos de treinta segundos y creen cualquier cosa que ven en las redes. Por eso no tiene sentido bajar la edad para votar: una generación que no lee no puede decidir el futuro del país. Lo digo con conocimiento de causa: mi sobrino de 17 años compartió la semana pasada una noticia falsa».", "vis": "", "items": [{"id": "SCA-125", "niv": 2, "cp": "sc_perspectivas", "cn": "", "e": "¿Qué error de razonamiento se presenta en la columna?", "f": "Análisis de argumentos: generalización apresurada.", "vis": "", "o": [["A", "Atacar a la persona que propone bajar la edad para votar, en lugar de discutir sus razones.", "La columna no menciona a ningún proponente ni lo descalifica personalmente; no hay un ataque a la persona.", false], ["B", "Apoyarse en la opinión de un experto que no conoce el tema del voto juvenil.", "La columna no cita a ningún experto; la única «prueba» que ofrece es la conducta del sobrino del autor.", false], ["C", "Atribuir a todos los jóvenes un comportamiento observado en un solo caso.", "Correcta. El autor pasa de lo que hizo su sobrino a afirmar cómo son «los jóvenes de hoy»: es una generalización a partir de un ejemplo, es decir, una generalización apresurada.", true], ["D", "Presentar como causa de un hecho algo que solo ocurrió antes que él.", "La columna no establece una relación de causa por simple sucesión en el tiempo; su error es pasar de un caso a todo un grupo.", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "s11-1", "ses": 1, "ind": "Mecanismos de participación ciudadana", "tt": "", "texto": "En un municipio, la alcaldesa elegida prometió en su programa de gobierno construir un acueducto veredal, pero después de más de un año no ha iniciado la obra ni ha explicado por qué. Al mismo tiempo, en otra parte del país, una organización de recicladores reúne firmas para presentar directamente ante el Congreso un proyecto de ley que regule su oficio.", "vis": "", "items": [{"id": "SCA-126", "niv": 1, "cp": "sc_pensamiento_social", "cn": "", "e": "Los habitantes del municipio quieren retirar del cargo a la alcaldesa por incumplir el programa con el que fue elegida. ¿Qué mecanismo de participación corresponde?", "f": "Constitución Política de Colombia, arts. 103 y 259.", "vis": "", "o": [["A", "La acción de tutela.", "La tutela protege derechos fundamentales ante un juez; no es un mecanismo para retirar del cargo a una alcaldesa.", false], ["B", "El referendo constitucional.", "El referendo somete a votación una norma o una reforma; no es el mecanismo previsto para revocar el mandato de un alcalde.", false], ["C", "La iniciativa legislativa.", "La iniciativa legislativa permite a los ciudadanos presentar proyectos de normas; no sirve para retirar a un gobernante de su cargo.", false], ["D", "La revocatoria del mandato.", "Correcta. La revocatoria del mandato es uno de los mecanismos de participación del artículo 103 y se relaciona con el voto programático (art. 259): quienes eligen alcaldes y gobernadores les imponen como mandato el programa que presentaron.", true]]}, {"id": "SCA-127", "niv": 1, "cp": "sc_pensamiento_social", "cn": "", "e": "¿Qué mecanismo de participación están usando los recicladores?", "f": "Constitución Política de Colombia, arts. 103 y 154.", "vis": "", "o": [["A", "La acción de cumplimiento.", "La acción de cumplimiento busca que una autoridad cumpla una ley ya existente; los recicladores quieren que se expida una ley nueva.", false], ["B", "La iniciativa legislativa.", "Correcta. El artículo 103 incluye la iniciativa legislativa entre los mecanismos de participación, y el artículo 154 permite que las leyes tengan origen en la iniciativa popular.", true], ["C", "La consulta popular.", "En la consulta popular la autoridad somete una pregunta de interés general a la decisión del pueblo; aquí son los ciudadanos quienes presentan un proyecto de ley.", false], ["D", "El cabildo abierto.", "El cabildo abierto es una sesión pública de un concejo o junta administradora local en la que los habitantes discuten asuntos de interés; no es la presentación de un proyecto de ley ante el Congreso.", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "s11-1", "ses": 1, "ind": "Reforma de la Constitución", "tt": "", "texto": "En un debate escolar, un estudiante afirma: «La Constitución de 1991 no se puede cambiar nunca; es intocable».", "vis": "", "items": [{"id": "SCA-129", "niv": 1, "cp": "sc_pensamiento_social", "cn": "", "e": "¿Cuál de las siguientes es una vía prevista en la Constitución para reformarla?", "f": "Constitución Política de Colombia, arts. 374 y 375.", "vis": "", "o": [["A", "Un acto legislativo aprobado por el Congreso de la República.", "Correcta. El artículo 374 establece que la Constitución puede ser reformada por el Congreso, por una Asamblea Constituyente o por el pueblo mediante referendo; el Congreso lo hace mediante actos legislativos.", true], ["B", "Una sentencia de un juez municipal en un caso de tutela.", "Los jueces aplican la Constitución en sus decisiones, pero no la reforman.", false], ["C", "Una ordenanza expedida por una asamblea departamental.", "Las asambleas departamentales expiden ordenanzas para su departamento; no pueden reformar la Constitución.", false], ["D", "Un decreto firmado por el Presidente de la República con sus ministros.", "El Presidente no puede reformar la Constitución por decreto; el artículo 374 no contempla esa vía.", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "s11-1", "ses": 1, "ind": "Jurisdicción especial indígena", "tt": "", "texto": "En un resguardo indígena del Cauca, un comunero fue acusado de destruir los cultivos de una familia vecina. Las autoridades tradicionales del resguardo lo juzgaron según sus propias normas y le impusieron como sanción trabajar durante varias semanas en las parcelas afectadas. Un funcionario de otra ciudad cuestionó la decisión porque «solo los jueces de la República pueden juzgar».", "vis": "", "items": [{"id": "SCA-130", "niv": 3, "cp": "sc_pensamiento_social", "cn": "", "e": "De acuerdo con la Constitución, ¿bajo qué condición es válida la actuación de las autoridades del resguardo?", "f": "Constitución Política de Colombia, arts. 7 y 246.", "vis": "", "o": [["A", "Que la persona juzgada no pertenezca a la comunidad indígena ni resida dentro del resguardo.", "La condición es la contraria a lo que plantea esta opción: la jurisdicción especial se ejerce sobre asuntos de la comunidad en su territorio.", false], ["B", "Que la sanción impuesta sea siempre la cárcel, como en la justicia ordinaria.", "La Constitución reconoce que las autoridades indígenas aplican sus propias normas y procedimientos; no les impone las mismas penas de la justicia ordinaria.", false], ["C", "Que actúen en su territorio y sus normas no contraríen la Constitución ni las leyes.", "Correcta. El artículo 246 permite a las autoridades indígenas ejercer funciones jurisdiccionales dentro de su ámbito territorial, según sus normas y procedimientos, siempre que no sean contrarios a la Constitución y a las leyes.", true], ["D", "Que un juez de la República autorice antes cada una de sus decisiones.", "El artículo 246 no exige autorización previa de un juez para cada caso; prevé que la ley establezca formas de coordinación entre esta jurisdicción y el sistema judicial nacional.", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "s11-1", "ses": 1, "ind": "Altitud y clima en Colombia", "tt": "", "texto": "Dos ciudades colombianas están casi a la misma distancia de la línea ecuatorial. La ciudad P está a unos 2.600 metros sobre el nivel del mar y tiene una temperatura promedio cercana a 14 °C; la ciudad Q está a unos 300 metros sobre el nivel del mar y su temperatura promedio es cercana a 28 °C. (Datos aproximados con fines didácticos.)", "vis": "", "items": [{"id": "SCA-131", "niv": 1, "cp": "sc_pensamiento_social", "cn": "", "e": "¿Qué factor explica principalmente la diferencia de temperatura entre las dos ciudades?", "f": "Concepto geográfico: pisos térmicos y relación entre altitud y temperatura.", "vis": "", "o": [["A", "La vegetación, porque las ciudades rodeadas de bosques son más frescas que las demás.", "El caso no informa sobre la vegetación de las ciudades; además, una diferencia de unos 14 °C se explica por los cerca de 2.300 metros de diferencia de altitud.", false], ["B", "La altitud, porque la temperatura disminuye a medida que se asciende sobre el nivel del mar.", "Correcta. En la zona intertropical la temperatura cambia sobre todo con la altitud: a mayor altura, menor temperatura. Esto da origen a los pisos térmicos.", true], ["C", "La latitud, porque la ciudad P está mucho más lejos de la línea ecuatorial.", "El caso indica que ambas ciudades están casi a la misma distancia de la línea ecuatorial; la latitud no explica la diferencia.", false], ["D", "La cercanía al mar, porque las brisas marinas elevan la temperatura de las ciudades costeras.", "El caso no dice que alguna de las dos ciudades esté en la costa; la diferencia que sí informa es de unos 2.300 metros de altitud, que explica la diferencia de temperatura.", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "s11-1", "ses": 1, "ind": "La región Pacífica y sus ríos", "tt": "", "texto": "La región Pacífica colombiana es una de las zonas más lluviosas del planeta. Está cubierta en gran parte por selva húmeda y la atraviesan numerosos ríos caudalosos. En muchas de sus poblaciones, la gente se desplaza en lancha o en canoa y los ríos son el principal camino para llevar productos a los mercados.", "vis": "", "items": [{"id": "SCA-132", "niv": 2, "cp": "sc_pensamiento_social", "cn": "", "e": "¿Qué relación entre las características del espacio geográfico y una práctica social se describe en el caso?", "f": "Concepto geográfico: relación entre espacio y prácticas sociales; descripción del caso.", "vis": "", "o": [["A", "Muchos ríos y una selva lluviosa difícil de atravesar por tierra favorecen el transporte fluvial.", "Correcta. El texto relaciona las lluvias, la selva húmeda y los ríos caudalosos con el uso de los ríos como principales vías de comunicación.", true], ["B", "Las lluvias abundantes hacen que los ríos se desborden, por lo que se prefiere viajar por carretera.", "El caso dice lo contrario: la gente se desplaza en lancha o canoa y los ríos son el principal camino.", false], ["C", "La selva húmeda permite abrir caminos con facilidad, lo que favorece el comercio por tierra.", "La selva húmeda y muy lluviosa dificulta abrir y mantener caminos; el caso describe el uso de los ríos, no de caminos.", false], ["D", "La alta pluviosidad favorece cultivos de exportación que se sacan principalmente por avión.", "El caso no habla de cultivos de exportación ni de transporte aéreo; describe el uso de lanchas y canoas por los ríos.", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "s11-1", "ses": 1, "ind": "Huelga y masacre de las bananeras (1928)", "tt": "", "texto": "A finales de 1928, miles de trabajadores de la zona bananera del Magdalena, que producían fruta para la United Fruit Company, se declararon en huelga para exigir mejores condiciones laborales. El 6 de diciembre de 1928, en Ciénaga, tropas del Ejército dispararon contra los huelguistas reunidos. Estas son dos fuentes ficticias sobre los hechos:\n\nFuente 1 (informe de un oficial al Gobierno): «Se restableció el orden en la zona. Los revoltosos, instigados por agitadores, desobedecieron la orden de dispersarse. Las bajas fueron pocas».\n\nFuente 2 (relato de un sobreviviente, recogido años después): «Estábamos esperando al gobernador para negociar. Cuando sonaron los disparos, la plaza estaba llena de familias enteras. Nunca supimos cuántos murieron».", "vis": "", "items": [{"id": "SCA-133", "niv": 2, "cp": "sc_perspectivas", "cn": "", "e": "¿Qué intereses en conflicto dieron origen a la huelga?", "f": "Descripción del caso; Scielo, «La masacre obrera de 1928 en la zona bananera del Magdalena» (2011).", "vis": "", "o": [["A", "Los de los liberales y los conservadores, que se disputaban el control del gobierno departamental.", "El caso no presenta la huelga como un enfrentamiento entre partidos, sino como un conflicto laboral.", false], ["B", "Los de Colombia y Panamá, que se disputaban las tierras de la zona bananera del Magdalena.", "La zona bananera del Magdalena no estaba en disputa con Panamá; el conflicto es laboral.", false], ["C", "Los de los agricultores de café, que querían exportar por el puerto de Ciénaga en lugar del banano de la compañía.", "Los caficultores no aparecen en el caso; el conflicto es entre trabajadores bananeros y la compañía.", false], ["D", "Los de los obreros, que pedían mejores condiciones, frente a los de la compañía, que cuidaba sus costos.", "Correcta. El caso dice que los trabajadores exigían mejores condiciones laborales a la empresa que comercializaba la fruta; mejorar esas condiciones implicaba mayores costos para la compañía.", true]]}, {"id": "SCA-134", "niv": 3, "cp": "sc_perspectivas", "cn": "", "e": "¿Por qué un historiador debería contrastar la fuente 1 con otras antes de aceptar que «las bajas fueron pocas»?", "f": "Análisis crítico de fuentes primarias ficticias.", "vis": "", "o": [["A", "Porque contradice la versión que la United Fruit Company dio sobre el número de víctimas.", "El caso no presenta ninguna versión de la compañía; la razón para contrastar el informe es el posible interés de su autor.", false], ["B", "Porque contradice a la fuente 2 en la fecha en que ocurrieron los disparos en la plaza.", "Ninguna de las dos fuentes da una fecha distinta; la diferencia está en cómo valoran lo ocurrido.", false], ["C", "Porque fue escrita mucho tiempo después de los hechos y el autor ya no recordaba bien lo ocurrido en Ciénaga.", "Esa limitación corresponde a la fuente 2, recogida años después; el informe del oficial fue producido en el momento.", false], ["D", "Porque quien la escribió hacía parte de la fuerza que disparó y podía tener interés en minimizar lo ocurrido.", "Correcta. El autor del informe pertenece a la institución responsable de los disparos; su posición puede llevarlo a justificar la acción y a reducir la gravedad de los hechos, por lo que su afirmación debe corroborarse.", true]]}]}, {"comp": "sociales_ciudadanas", "sim": "s11-1", "ses": 1, "ind": "Encuesta de confianza institucional", "tt": "", "texto": "Un estudiante aplicó una encuesta a 400 habitantes adultos de su municipio. Les preguntó si confiaban en varias instituciones. La gráfica muestra el porcentaje de personas que respondió «sí confío» en cada una.", "vis": "<div class=\"vfig\"><svg class=\"vg\" viewBox=\"0 0 560 320\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Gráfica 3. Personas que confían en cada institución (%)\" font-family=\"Arial, sans-serif\" font-size=\"12\"><rect width=\"560\" height=\"320\" fill=\"#ffffff\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"13\" fill=\"#1d2433\">Gráfica 3. Personas que confían en cada institución (%)<\/text><line x1=\"60\" y1=\"258.0\" x2=\"540\" y2=\"258.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"262.0\" text-anchor=\"end\" fill=\"#3a4356\">0<\/text><line x1=\"60\" y1=\"202.5\" x2=\"540\" y2=\"202.5\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"206.5\" text-anchor=\"end\" fill=\"#3a4356\">20<\/text><line x1=\"60\" y1=\"147.0\" x2=\"540\" y2=\"147.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"151.0\" text-anchor=\"end\" fill=\"#3a4356\">40<\/text><line x1=\"60\" y1=\"91.5\" x2=\"540\" y2=\"91.5\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"95.5\" text-anchor=\"end\" fill=\"#3a4356\">60<\/text><line x1=\"60\" y1=\"36.0\" x2=\"540\" y2=\"36.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"40.0\" text-anchor=\"end\" fill=\"#3a4356\">80<\/text><line x1=\"60\" y1=\"258\" x2=\"540\" y2=\"258\" stroke=\"#3a4356\"/><line x1=\"60\" y1=\"258\" x2=\"60\" y2=\"36\" stroke=\"#3a4356\"/><text transform=\"translate(14,147.0) rotate(-90)\" text-anchor=\"middle\" fill=\"#3a4356\">Porcentaje<\/text><text x=\"300.0\" y=\"312\" text-anchor=\"middle\" fill=\"#3a4356\">Institución<\/text><text x=\"108.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Registraduría<\/text><text x=\"204.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Alcaldía<\/text><text x=\"300.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Concejo municipal<\/text><text x=\"396.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Policía<\/text><text x=\"492.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Partidos políticos<\/text><rect x=\"74.4\" y=\"85.9\" width=\"67.2\" height=\"172.1\" fill=\"#1660a8\"/><text x=\"108.0\" y=\"81.9\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">62<\/text><rect x=\"170.4\" y=\"127.6\" width=\"67.2\" height=\"130.4\" fill=\"#1660a8\"/><text x=\"204.0\" y=\"123.6\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">47<\/text><rect x=\"266.4\" y=\"144.2\" width=\"67.2\" height=\"113.8\" fill=\"#1660a8\"/><text x=\"300.0\" y=\"140.2\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">41<\/text><rect x=\"362.4\" y=\"160.9\" width=\"67.2\" height=\"97.1\" fill=\"#1660a8\"/><text x=\"396.0\" y=\"156.9\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">35<\/text><rect x=\"458.4\" y=\"208.1\" width=\"67.2\" height=\"50.0\" fill=\"#1660a8\"/><text x=\"492.0\" y=\"204.1\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">18<\/text><\/svg><\/div>", "items": [{"id": "SCA-135", "niv": 1, "cp": "sc_perspectivas", "cn": "", "e": "Según la gráfica, ¿en cuál institución confía el mayor porcentaje de los encuestados?", "f": "Lectura de la gráfica (datos ficticios).", "vis": "", "o": [["A", "En la alcaldía.", "La alcaldía tiene 47 %, por debajo de la Registraduría.", false], ["B", "En el concejo municipal.", "El concejo municipal tiene 41 %, por debajo de la Registraduría.", false], ["C", "En la Registraduría.", "Correcta. La Registraduría tiene el valor más alto de la gráfica (62 %).", true], ["D", "En los partidos políticos.", "Los partidos políticos tienen el valor más bajo (18 %).", false]]}, {"id": "SCA-136", "niv": 3, "cp": "sc_perspectivas", "cn": "", "e": "Con base en esta encuesta, un periodista publicó: «Los colombianos desconfían de los partidos políticos más que de cualquier otra institución del país». ¿Es válida esta conclusión?", "f": "Análisis crítico de fuentes: validez de generalizaciones.", "vis": "", "o": [["A", "No, porque la encuesta se hizo en un solo municipio y solo preguntó por cinco instituciones.", "Correcta. Los datos provienen de 400 habitantes de un municipio y de una lista limitada de instituciones; no permiten generalizar a todos los colombianos ni a «cualquier otra institución del país».", true], ["B", "Sí, porque 400 personas son suficientes para representar la opinión de todo el país.", "El problema no es solo el número: todas las personas son de un mismo municipio, así que la muestra no representa al país.", false], ["C", "Sí, porque en la gráfica los partidos políticos tienen el porcentaje de confianza más bajo.", "Es cierto que tienen el valor más bajo, pero solo en esa muestra y entre esas cinco instituciones; la conclusión del periodista va más allá de los datos.", false], ["D", "No, porque la gráfica muestra que los partidos tienen más confianza que la alcaldía.", "La gráfica muestra lo contrario: los partidos (18 %) tienen menos confianza que la alcaldía (47 %).", false]]}]}, {"comp": "ciencias_naturales", "sim": "s11-1", "ses": 1, "ind": "Herencia del color de la flor", "tt": "", "texto": "En una especie de planta, el color de la flor depende de un solo gen con dos alelos: el alelo P produce flores púrpuras y es dominante sobre el alelo p, que produce flores blancas. Las plantas pp tienen flores blancas.", "vis": "", "items": [{"id": "CNA-101", "niv": 1, "cp": "cn_uso_comprensivo", "cn": "biologico", "e": "Se cruzan dos plantas heterocigotas (Pp) y germinan 400 semillas de ese cruce. ¿Cuántas plantas de flor blanca se esperan aproximadamente?", "f": "Leyes de Mendel: cruce monohíbrido", "vis": "", "o": [["A", "0", "Supone que el carácter recesivo no aparece en la descendencia de dos plantas púrpuras; pero cada progenitor Pp aporta el alelo p con probabilidad 1/2, y 1/4 de los hijos será pp.", false], ["B", "100", "El cruce Pp × Pp produce en proporción 1 PP : 2 Pp : 1 pp. Solo las pp (1/4) tienen flor blanca: 400 × 1/4 = 100.", true], ["C", "200", "Corresponde a la mitad de las semillas, que es la fracción esperada de heterocigotos Pp; estas plantas tienen flores púrpuras, no blancas.", false], ["D", "300", "Es el número esperado de plantas púrpuras (PP y Pp, 3/4 del total), no el de blancas.", false]]}, {"id": "CNA-102", "niv": 2, "cp": "cn_uso_comprensivo", "cn": "biologico", "e": "Una planta de flor púrpura cuyo genotipo se desconoce se cruza con una planta de flor blanca. Cerca de la mitad de la descendencia tiene flores blancas. ¿Cuál es el genotipo de la planta púrpura?", "f": "Leyes de Mendel: cruce de prueba", "vis": "", "o": [["A", "PP, porque tiene flores púrpuras y el alelo púrpura es dominante.", "Si fuera PP, todos los descendientes recibirían P y serían Pp de flor púrpura; no aparecería ninguna planta blanca.", false], ["B", "No es posible saberlo, porque las flores blancas solo pueden provenir de la planta blanca.", "Una planta blanca es pp y necesita un alelo p de cada progenitor; los hijos blancos prueban que la planta púrpura también aportó p, lo que permite deducir su genotipo.", false], ["C", "Pp, porque transmite el alelo p a cerca de la mitad de sus descendientes.", "La planta blanca (pp) solo aporta p. Para que la mitad de los hijos sea pp, la planta púrpura debe aportar p en la mitad de los casos: es Pp (cruce de prueba Pp × pp → 1 Pp : 1 pp).", true], ["D", "pp, porque la mitad de sus descendientes resultó con flores blancas.", "Una planta pp tiene flores blancas, y el enunciado dice que esta planta es púrpura; por tanto, tiene al menos un alelo P.", false]]}]}, {"comp": "ciencias_naturales", "sim": "s11-1", "ses": 1, "ind": "Flujo de energía en una cadena alimentaria", "tt": "", "texto": "En un lago, los productores (algas) fijan en un año 20.000 kcal por metro cuadrado. La cadena alimentaria es: algas → pequeños crustáceos → peces pequeños → garzas. En cada paso de un nivel trófico al siguiente se transfiere aproximadamente el 10 % de la energía; el resto se pierde principalmente como calor en la respiración.", "vis": "", "items": [{"id": "CNA-104", "niv": 2, "cp": "cn_uso_comprensivo", "cn": "biologico", "e": "¿Cuánta energía llega aproximadamente a los peces pequeños, que son consumidores secundarios?", "f": "Cálculo propio: regla del 10 % en las pirámides de energía", "vis": "", "o": [["A", "20 kcal por m².", "Es la energía que llegaría a las garzas, que son consumidores terciarios (tres transferencias del 10 %).", false], ["B", "200 kcal por m².", "Algas → crustáceos: 20.000 × 0,10 = 2.000 kcal. Crustáceos → peces pequeños: 2.000 × 0,10 = 200 kcal.", true], ["C", "2.000 kcal por m².", "Es la energía que llega a los crustáceos (consumidores primarios); falta la segunda transferencia.", false], ["D", "18.000 kcal por m².", "Es la energía de los productores que no pasa al primer consumidor; confunde la energía perdida con la transferida.", false]]}]}, {"comp": "ciencias_naturales", "sim": "s11-1", "ses": 1, "ind": "Resistencia a antibióticos", "tt": "", "texto": "En un laboratorio se aplica un antibiótico a un cultivo de bacterias. La mayoría muere, pero unas pocas sobreviven y se reproducen. Días después, casi todas las bacterias de la nueva población son resistentes a ese antibiótico.", "vis": "", "items": [{"id": "CNA-105", "niv": 2, "cp": "cn_uso_comprensivo", "cn": "biologico", "e": "Según la teoría de la evolución por selección natural, ¿qué explica mejor este resultado?", "f": "Concepto: selección natural (Darwin y Wallace)", "vis": "", "o": [["A", "El antibiótico provocó en todas las bacterias los cambios necesarios para resistirlo, y luego estas los heredaron a sus descendientes.", "Es una idea lamarckiana: el antibiótico no induce a propósito la resistencia; si todas hubieran cambiado, no habría muerto la mayoría.", false], ["B", "Las bacterias sobrevivientes eran las más grandes, y el tamaño por sí solo impide la entrada de cualquier antibiótico.", "Nada en la situación indica que el tamaño sea la causa, y la resistencia a un antibiótico concreto depende de rasgos genéticos específicos, no del tamaño.", false], ["C", "Las bacterias sobrevivientes aprendieron a evitar el antibiótico y transmitieron ese comportamiento a su descendencia.", "Las bacterias no aprenden ni enseñan conductas; la resistencia se debe a características genéticas que se heredan.", false], ["D", "Ya existían bacterias con variantes genéticas de resistencia, y el antibiótico favoreció su supervivencia y reproducción.", "La selección natural actúa sobre variación que ya existe: el antibiótico elimina a las sensibles y las resistentes, que sobreviven, transmiten sus genes a la siguiente generación.", true]]}]}, {"comp": "ciencias_naturales", "sim": "s11-1", "ses": 1, "ind": "Glucosa e insulina después de comer", "tt": "", "texto": "A una persona sana, en ayunas, se le midieron la glucosa y la insulina en sangre antes y después de consumir un desayuno rico en carbohidratos. La insulina es una hormona producida por el páncreas.", "vis": "", "items": [{"id": "CNA-109", "niv": 3, "cp": "cn_explicacion", "cn": "biologico", "e": "Según la tabla, la glucosa en sangre empieza a bajar a partir de los 30 minutos. ¿Qué explica esta disminución?", "f": "Concepto: regulación hormonal de la glucemia", "vis": "<table class=\"vt\"><caption>Tabla 4. Glucosa e insulina en sangre después del desayuno<\/caption><thead><tr><th>Tiempo (min)<\/th><th>0<\/th><th>30<\/th><th>60<\/th><th>90<\/th><th>120<\/th><th>180<\/th><\/tr><\/thead><tbody><tr><td>Glucosa (mg/dL)<\/td><td>85<\/td><td>140<\/td><td>125<\/td><td>105<\/td><td>92<\/td><td>86<\/td><\/tr><tr><td>Insulina (µU/mL)<\/td><td>6<\/td><td>45<\/td><td>38<\/td><td>22<\/td><td>12<\/td><td>7<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Datos ficticios.<\/div>", "o": [["A", "La insulina hace que las células tomen glucosa de la sangre y que el hígado la almacene como glucógeno.", "La insulina sube cuando sube la glucosa y estimula su entrada a músculos y tejido adiposo y su almacenamiento como glucógeno en el hígado; por eso la glucosa vuelve a valores cercanos a los de ayunas.", true], ["B", "La insulina degrada la glucosa en la sangre y la convierte en CO₂ y agua antes de que llegue a las células.", "La insulina es una señal hormonal que actúa sobre receptores de las células; no degrada la glucosa en la sangre. La glucosa se oxida dentro de las células.", false], ["C", "La insulina estimula al hígado a liberar glucosa almacenada, lo que hace que la glucosa de la sangre disminuya.", "Liberar glucosa a la sangre la aumentaría; esa es la acción del glucagón, no de la insulina.", false], ["D", "El páncreas retira la glucosa de la sangre y la elimina por la orina, a medida que aumenta la insulina.", "El páncreas produce insulina, pero no retira la glucosa; en una persona sana prácticamente no se elimina glucosa en la orina.", false]]}]}, {"comp": "ciencias_naturales", "sim": "s11-1", "ses": 1, "ind": "Daltonismo ligado al cromosoma X", "tt": "", "texto": "La forma más común de daltonismo (dificultad para distinguir el rojo del verde) se debe a un alelo recesivo ubicado en el cromosoma X. En la especie humana, las mujeres tienen dos cromosomas X (XX) y los hombres tienen un cromosoma X y uno Y (XY).", "vis": "", "items": [{"id": "CNA-110", "niv": 3, "cp": "cn_explicacion", "cn": "biologico", "e": "¿Por qué este tipo de daltonismo es mucho más frecuente en hombres que en mujeres?", "f": "Concepto: herencia ligada al sexo", "vis": "", "o": [["A", "Las mujeres no pueden heredar el alelo, porque los padres solo lo transmiten a sus hijos varones.", "Las mujeres sí heredan el alelo (de la madre, del padre o de ambos); son daltónicas cuando reciben dos copias.", false], ["B", "El alelo del daltonismo está en el cromosoma Y, que solo tienen los hombres.", "El texto indica que el alelo está en el cromosoma X; si estuviera en el Y, ninguna mujer podría ser daltónica.", false], ["C", "Los hombres heredan su cromosoma X del padre, que es quien con mayor frecuencia porta el alelo del daltonismo en la familia.", "Los hombres reciben el cromosoma X de la madre y el Y del padre; por eso un hombre daltónico hereda el alelo de su madre.", false], ["D", "Los hombres tienen un solo X: basta un alelo recesivo para que se manifieste, mientras que las mujeres necesitan dos.", "En los hombres no hay un segundo X con un alelo dominante que enmascare al recesivo; una mujer con un solo alelo es portadora, pero normalmente ve los colores.", true]]}]}, {"comp": "ciencias_naturales", "sim": "s11-1", "ses": 1, "ind": "Diseño de un experimento con abono", "tt": "", "texto": "Un estudiante quiere saber si un abono orgánico aumenta el crecimiento de plantas de tomate. Cuenta con 20 plántulas de tomate de la misma variedad y del mismo tamaño.", "vis": "", "items": [{"id": "CNA-118", "niv": 1, "cp": "cn_indagacion", "cn": "biologico", "e": "¿Cuál de los siguientes diseños es el más adecuado para responder su pregunta?", "f": "Indagación: diseño experimental, grupo control y tamaño de muestra", "vis": "", "o": [["A", "Abonar 10 plántulas ubicadas al sol, dejar 10 sin abono a la sombra y comparar su altura después de un mes.", "Cambian dos variables a la vez (abono y luz); no se podría saber cuál causó la diferencia.", false], ["B", "Abonar 10 plántulas y dejar 10 sin abono, con igual suelo, riego y luz, y comparar su altura después de un mes.", "Tiene un grupo control sin abono, varias plantas por grupo y las demás condiciones iguales; así la diferencia de altura se puede atribuir al abono.", true], ["C", "Abonar las 20 plántulas con igual suelo, riego y luz, y comparar su altura antes y después de un mes.", "No hay grupo control: las plantas crecen aunque no se abonen, así que la diferencia antes-después no muestra el efecto del abono.", false], ["D", "Abonar una plántula y dejar otra sin abono, con igual suelo, riego y luz, y comparar su altura después de un mes.", "Con una planta por grupo, una diferencia puede deberse a la variación natural entre individuos; se necesitan varias plantas por grupo.", false]]}]}, {"comp": "ciencias_naturales", "sim": "s11-1", "ses": 1, "ind": "Bombillos en serie y en paralelo", "tt": "", "texto": "Una estudiante tiene una batería de 6 V y dos bombillos idénticos. Primero conecta los dos bombillos en serie a la batería; después, los conecta en paralelo a la misma batería.", "vis": "", "items": [{"id": "CNA-119", "niv": 2, "cp": "cn_uso_comprensivo", "cn": "fisico", "e": "¿En cuál de los dos montajes brilla más cada bombillo?", "f": "Concepto: circuitos en serie y en paralelo", "vis": "", "o": [["A", "En paralelo, porque cada bombillo queda conectado a los 6 V de la batería, en lugar de solo a 3 V.", "En paralelo cada bombillo recibe el voltaje completo de la batería (6 V); en serie se reparten el voltaje (3 V cada uno), así que disipan menos potencia y brillan menos.", true], ["B", "Brillan igual en ambos montajes, porque la batería y los bombillos son los mismos en los dos casos.", "Aunque los elementos sean los mismos, la forma de conectarlos cambia el voltaje y la corriente en cada bombillo.", false], ["C", "En serie, porque la resistencia total del circuito es mayor y eso hace que aumente la corriente.", "Una resistencia total mayor disminuye la corriente (I = V/R), no la aumenta.", false], ["D", "En serie, porque la corriente pasa primero por un bombillo y luego por el otro, y así suman su energía.", "En serie la misma corriente atraviesa ambos bombillos, pero cada uno recibe solo la mitad del voltaje; la energía no se «suma» en cada bombillo.", false]]}]}, {"comp": "ciencias_naturales", "sim": "s11-1", "ses": 1, "ind": "Ley de Ohm", "tt": "", "texto": "En un laboratorio se conecta una resistencia de 6 Ω a una fuente de 12 V. Se considera despreciable la resistencia de los cables.", "vis": "", "items": [{"id": "CNA-120", "niv": 1, "cp": "cn_uso_comprensivo", "cn": "fisico", "e": "¿Qué corriente circula por la resistencia?", "f": "Cálculo propio: ley de Ohm (I = V/R)", "vis": "", "o": [["A", "0,5 A.", "Resulta de dividir la resistencia entre el voltaje (6/12); la ley de Ohm es I = V/R, no R/V.", false], ["B", "2 A.", "Por la ley de Ohm, I = V/R = 12 V / 6 Ω = 2 A.", true], ["C", "18 A.", "Resulta de sumar voltaje y resistencia (12 + 6), operación que no tiene sentido físico.", false], ["D", "72 A.", "Resulta de multiplicar voltaje por resistencia (12 × 6); ese producto no es la corriente.", false]]}]}, {"comp": "ciencias_naturales", "sim": "s11-1", "ses": 1, "ind": "Energía potencial gravitacional", "tt": "", "texto": "Una caja de 2 kg está sobre un estante, a 5 m de altura respecto al suelo. Use g = 9,8 m/s².", "vis": "", "items": [{"id": "CNA-121", "niv": 1, "cp": "cn_uso_comprensivo", "cn": "fisico", "e": "¿Cuál es la energía potencial gravitacional de la caja respecto al suelo?", "f": "Cálculo propio: Ep = mgh", "vis": "", "o": [["A", "10 J.", "Multiplica solo masa por altura (2 × 5) y omite la aceleración de la gravedad.", false], ["B", "19,6 J.", "Multiplica masa por gravedad (2 × 9,8), que es el peso en newtons, y omite la altura.", false], ["C", "49 J.", "Multiplica gravedad por altura (9,8 × 5) y omite la masa.", false], ["D", "98 J.", "Ep = m·g·h = 2 kg × 9,8 m/s² × 5 m = 98 J.", true]]}]}, {"comp": "ciencias_naturales", "sim": "s11-1", "ses": 1, "ind": "Pelota lanzada hacia arriba", "tt": "", "texto": "Se lanza una pelota verticalmente hacia arriba. Considere despreciable la resistencia del aire.", "vis": "", "items": [{"id": "CNA-126", "niv": 3, "cp": "cn_explicacion", "cn": "fisico", "e": "¿Qué ocurre con la velocidad y la aceleración de la pelota en el punto más alto de su trayectoria?", "f": "Concepto: caída libre y lanzamiento vertical", "vis": "", "o": [["A", "Su velocidad es cero y su aceleración apunta hacia arriba, porque conserva la fuerza del lanzamiento.", "Durante todo el vuelo la aceleración apunta hacia abajo; ninguna fuerza hacia arriba actúa después del lanzamiento.", false], ["B", "Su velocidad y su aceleración son cero, porque la pelota se detiene completamente en ese punto.", "Si la aceleración fuera cero, la pelota quedaría quieta en el aire; la gravedad sigue actuando y la hace caer.", false], ["C", "Su velocidad es cero por un instante, y su aceleración es la de la gravedad, dirigida hacia abajo.", "En el punto más alto la pelota cambia de sentido, por eso su velocidad es cero en ese instante; la única fuerza es el peso, así que la aceleración sigue siendo g hacia abajo.", true], ["D", "Su velocidad es máxima y su aceleración es cero, porque allí se acaba la fuerza del lanzamiento.", "La velocidad es mínima (cero) en el punto más alto; además, después de soltarla no hay una «fuerza del lanzamiento» actuando sobre la pelota.", false]]}]}, {"comp": "ciencias_naturales", "sim": "s11-1", "ses": 1, "ind": "Relámpago y trueno", "tt": "", "texto": "Durante una tormenta, una persona ve el destello de un rayo y unos segundos después oye el trueno, aunque ambos se producen al mismo tiempo.", "vis": "", "items": [{"id": "CNA-127", "niv": 1, "cp": "cn_explicacion", "cn": "fisico", "e": "¿Por qué se percibe primero el destello que el trueno?", "f": "Concepto: rapidez de la luz y del sonido", "vis": "", "o": [["A", "Porque la luz viaja muchísimo más rápido que el sonido en el aire, así que llega antes al observador.", "La luz viaja a unos 300.000 km/s y el sonido en el aire a unos 340 m/s; por eso el trueno llega varios segundos después.", true], ["B", "Porque el trueno se produce cuando el aire calentado por el rayo se enfría, varios segundos después.", "El enunciado indica que destello y trueno se producen al mismo tiempo; el retraso se debe a la menor rapidez del sonido.", false], ["C", "Porque la luz y el sonido viajan igual de rápido, pero las nubes desvían el sonido y alargan su recorrido.", "La luz y el sonido tienen rapideces muy distintas; la diferencia en el tiempo de llegada no se debe a que las nubes desvíen el sonido.", false], ["D", "Porque el trueno se produce varios segundos después del destello, cuando el rayo toca el suelo.", "El enunciado indica que ambos se producen al mismo tiempo; la diferencia se debe a la rapidez con que viajan.", false]]}]}, {"comp": "ciencias_naturales", "sim": "s11-1", "ses": 1, "ind": "Instalación eléctrica de una casa", "tt": "", "texto": "En una casa, cuando se funde el bombillo de la sala, los demás bombillos y los electrodomésticos siguen funcionando normalmente.", "vis": "", "items": [{"id": "CNA-128", "niv": 2, "cp": "cn_explicacion", "cn": "fisico", "e": "¿Qué explica esta situación?", "f": "Concepto: circuitos en paralelo", "vis": "", "o": [["A", "Cada bombillo de la casa tiene su propia fuente de energía instalada dentro de la pared.", "Todos los aparatos se alimentan de la misma red eléctrica; no hay una fuente por bombillo.", false], ["B", "Al fundirse un bombillo, su corriente se reparte y los demás aparatos funcionan con más voltaje.", "En paralelo el voltaje de cada rama no cambia al abrirse otra rama; los aparatos siguen con el mismo voltaje de la red.", false], ["C", "Los aparatos están conectados en paralelo, así que cada uno tiene su propio camino para la corriente.", "En paralelo, cada aparato forma una rama independiente conectada al mismo voltaje; si una rama se abre, las otras siguen cerradas.", true], ["D", "Los aparatos están conectados en serie, y la corriente salta el bombillo dañado para llegar a los demás.", "En serie hay un solo camino: si un elemento se abre, se interrumpe la corriente en todo el circuito.", false]]}]}, {"comp": "ciencias_naturales", "sim": "s11-1", "ses": 1, "ind": "Calentamiento del agua", "tt": "", "texto": "Se calentó agua en un recipiente abierto, a nivel del mar, con una estufa que entregó energía de manera constante durante todo el experimento. Cada 2 minutos se registró la temperatura del agua.", "vis": "", "items": [{"id": "CNA-134", "niv": 2, "cp": "cn_indagacion", "cn": "fisico", "e": "¿Qué conclusión se apoya en los datos?", "f": "Indagación: interpretación de gráficas; concepto de calor latente", "vis": "<div class=\"vfig\"><svg class=\"vg\" viewBox=\"0 0 560 320\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Gráfica 4. Temperatura del agua durante el calentamiento\" font-family=\"Arial, sans-serif\" font-size=\"12\"><rect width=\"560\" height=\"320\" fill=\"#ffffff\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"13\" fill=\"#1d2433\">Gráfica 4. Temperatura del agua durante el calentamiento<\/text><line x1=\"60\" y1=\"258.0\" x2=\"540\" y2=\"258.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"262.0\" text-anchor=\"end\" fill=\"#3a4356\">0<\/text><line x1=\"60\" y1=\"213.6\" x2=\"540\" y2=\"213.6\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"217.6\" text-anchor=\"end\" fill=\"#3a4356\">20<\/text><line x1=\"60\" y1=\"169.2\" x2=\"540\" y2=\"169.2\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"173.2\" text-anchor=\"end\" fill=\"#3a4356\">40<\/text><line x1=\"60\" y1=\"124.8\" x2=\"540\" y2=\"124.8\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"128.8\" text-anchor=\"end\" fill=\"#3a4356\">60<\/text><line x1=\"60\" y1=\"80.4\" x2=\"540\" y2=\"80.4\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"84.4\" text-anchor=\"end\" fill=\"#3a4356\">80<\/text><line x1=\"60\" y1=\"36.0\" x2=\"540\" y2=\"36.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"40.0\" text-anchor=\"end\" fill=\"#3a4356\">100<\/text><line x1=\"60\" y1=\"258\" x2=\"540\" y2=\"258\" stroke=\"#3a4356\"/><line x1=\"60\" y1=\"258\" x2=\"60\" y2=\"36\" stroke=\"#3a4356\"/><text transform=\"translate(14,147.0) rotate(-90)\" text-anchor=\"middle\" fill=\"#3a4356\">Temperatura (°C)<\/text><text x=\"300.0\" y=\"312\" text-anchor=\"middle\" fill=\"#3a4356\">Tiempo (min)<\/text><text x=\"94.3\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">0<\/text><text x=\"162.9\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">2<\/text><text x=\"231.4\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">4<\/text><text x=\"300.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">6<\/text><text x=\"368.6\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">8<\/text><text x=\"437.1\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">10<\/text><text x=\"505.7\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">12<\/text><polyline fill=\"none\" stroke=\"#1660a8\" stroke-width=\"2.5\" points=\"94.3,213.6 162.9,164.8 231.4,115.9 300.0,67.1 368.6,36.0 437.1,36.0 505.7,36.0\"/><circle cx=\"94.3\" cy=\"213.6\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"94.3\" y=\"205.6\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">20<\/text><circle cx=\"162.9\" cy=\"164.8\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"162.9\" y=\"156.8\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">42<\/text><circle cx=\"231.4\" cy=\"115.9\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"231.4\" y=\"107.9\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">64<\/text><circle cx=\"300.0\" cy=\"67.1\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"300.0\" y=\"59.1\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">86<\/text><circle cx=\"368.6\" cy=\"36.0\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"368.6\" y=\"28.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">100<\/text><circle cx=\"437.1\" cy=\"36.0\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"437.1\" y=\"28.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">100<\/te
