<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulacro 1 · Validación del Bachillerato</title>
<style>
:root{--bg:#f3f6f8;--card:#fff;--ink:#1d2433;--mute:#5a6478;--line:#d6dee4;--pri:#0b4f6c;--pri2:#1f7aa3;--ok:#0d6b3a;--okbg:#e6f4ec;--no:#9b1c1c;--nobg:#fbeaea;--sel:#e4f1f8}
@media (prefers-color-scheme: dark){:root{--bg:#0f1418;--card:#172026;--ink:#e3eaee;--mute:#97a6b0;--line:#2c3a44;--pri:#7cc3e6;--pri2:#a3d6ef;--ok:#7fd3a3;--okbg:#16301f;--no:#f2a3a3;--nobg:#3a1c1c;--sel:#1d3442}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overflow-wrap:anywhere}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px}
.hwrap{max-width:860px;margin:0 auto;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;justify-content:space-between}
h1{font-size:17px;margin:0;color:var(--pri)}
h2{color:var(--pri)}
.stat{font-size:14px;color:var(--mute)}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--pri)}
.timer.low{color:var(--no)}
main{max-width:860px;margin:0 auto;padding:16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin:0 0 16px}
.mod{background:var(--pri);color:var(--card);border-radius:10px;padding:10px 14px;margin:28px 0 6px;font-weight:700;font-size:18px}
.inst{font-size:13px;font-weight:700;color:var(--pri);text-transform:uppercase;letter-spacing:.03em;margin:18px 0 4px}
.caso{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--pri);border-radius:10px;padding:14px 16px;margin:10px 0}
.tag{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--pri);font-weight:700}
.caso p{margin:6px 0 0;white-space:pre-line}
.item{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0}
.enun{margin:0 0 8px;white-space:pre-line}
.n{font-weight:700;color:var(--pri)}
.niv{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-right:4px;white-space:nowrap}
.op{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:6px 0;cursor:pointer;background:transparent;width:100%;text-align:left;color:inherit;font:inherit}
.ops8{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.ops8 .op{margin:0}
.op:hover{border-color:var(--pri2)}
.op .l{font-weight:700;min-width:20px}
.op.sel{background:var(--sel);border-color:var(--pri2)}
.op.ok{background:var(--okbg);border-color:var(--ok)}
.op.no{background:var(--nobg);border-color:var(--no)}
.op[disabled]{cursor:default}
.just{font-size:14px;margin:8px 0 0;padding:8px 10px;border-top:1px dashed var(--line)}
.just div{margin:4px 0}
.just .okt{color:var(--ok);font-weight:700}
.just .not{color:var(--no);font-weight:700}
.src{font-size:13px;color:var(--mute);margin-top:6px}
button.btn{background:var(--pri);color:var(--card);border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer}
button.btn.sec{background:transparent;color:var(--pri);border:1px solid var(--pri)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
select{font:inherit;padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);max-width:100%}
table{border-collapse:collapse;width:100%;font-size:15px}
td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.sub td{font-size:13px;color:var(--mute);padding-left:22px}
.vt{width:auto;max-width:100%;margin:10px 0;font-size:14px;display:block;overflow-x:auto}
.vt caption{text-align:left;font-weight:700;padding-bottom:4px}
.vt th,.vt td{border:1px solid var(--line);padding:4px 8px}
.vt th{background:var(--sel)}
.vnota{font-size:12px;color:var(--mute)}
.vfig{margin:10px 0}
.vfig svg{width:100%;max-width:560px;height:auto;border-radius:6px;border:1px solid var(--line);background:#fff}
.big{font-size:40px;font-weight:800;color:var(--pri);line-height:1.1}
.aviso{font-size:13px;color:var(--mute)}
.hide{display:none !important}
.res-ok{color:var(--ok);font-weight:700}.res-no{color:var(--no);font-weight:700}
textarea{width:100%;min-height:320px;font:inherit;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);resize:vertical}
.chk label{display:flex;gap:8px;align-items:flex-start;margin:6px 0;font-size:15px}
.chk input{margin-top:4px;width:18px;height:18px;flex:none}
.modelo{white-space:pre-line;background:var(--bg);border-radius:8px;padding:10px 12px;margin:6px 0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal .panel{max-width:420px}
.nav{padding:6px 0;display:flex;gap:6px;flex-wrap:wrap}
.nav a{font-size:13px;color:var(--pri);border:1px solid var(--line);border-radius:999px;padding:3px 10px;text-decoration:none;background:var(--card)}
footer{max-width:860px;margin:0 auto;padding:8px 16px 40px;font-size:12px;color:var(--mute)}
</style>
</head>
<body>
<header><div class="hwrap"><h1 id="tit"></h1><div class="row stat"><span id="prog"></span><span id="timer" class="timer"></span></div></div></header>
<main id="main"></main>
<div id="modal" class="modal hide"><div class="panel"><p id="mtxt"></p><div class="row"><button class="btn" id="msi">Sí, calificar</button><button class="btn sec" id="mno">Seguir respondiendo</button></div></div></div>
<footer>Material de preparación independiente. No está afiliado al Icfes ni a ninguna entidad pública. Preguntas y textos originales; no son preguntas reales del examen. Soporte: brassabacuscontact@gmail.com</footer>

\"312\" text-anchor=\"middle\" fill=\"#3a4356\">Integrante<\/text><text x=\"108.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Ana<\/text><text x=\"204.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Beto<\/text><text x=\"300.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Carla<\/text><text x=\"396.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Diego<\/text><text x=\"492.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Elena<\/text><rect x=\"74.4\" y=\"80.4\" width=\"67.2\" height=\"177.6\" fill=\"#1660a8\"/><text x=\"108.0\" y=\"76.4\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">12<\/text><rect x=\"170.4\" y=\"139.6\" width=\"67.2\" height=\"118.4\" fill=\"#1660a8\"/><text x=\"204.0\" y=\"135.6\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">8<\/text><rect x=\"266.4\" y=\"36.0\" width=\"67.2\" height=\"222.0\" fill=\"#1660a8\"/><text x=\"300.0\" y=\"32.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">15<\/text><rect x=\"362.4\" y=\"110.0\" width=\"67.2\" height=\"148.0\" fill=\"#1660a8\"/><text x=\"396.0\" y=\"106.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">10<\/text><rect x=\"458.4\" y=\"184.0\" width=\"67.2\" height=\"74.0\" fill=\"#1660a8\"/><text x=\"492.0\" y=\"180.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">5<\/text><\/svg><\/div>", "items": [{"id": "MTA-206", "niv": 1, "cp": "mt_formulacion", "cn": "", "e": "¿Qué porcentaje del total de unidades vendidas corresponde a Carla?", "f": "Lectura de la gráfica y porcentajes", "vis": "", "o": [["A", "15 %.", "Toma el número de unidades de Carla como si fuera el porcentaje.", false], ["B", "20 %.", "Supone que cada uno de los 5 vendedores aporta la misma parte (100 % ÷ 5).", false], ["C", "30 %.", "El total vendido es 12 + 8 + 15 + 10 + 5 = 50 unidades; 15 ÷ 50 = 0,30, es decir, 30 %.", true], ["D", "50 %.", "Confunde el total de unidades vendidas (50) con el porcentaje de Carla.", false]]}, {"id": "MTA-207", "niv": 1, "cp": "mt_argumentacion", "cn": "", "e": "El gerente afirma que Ana y Diego juntos vendieron más unidades que Carla y Elena juntas. ¿Es correcta su afirmación?", "f": "Lectura de la gráfica", "vis": "", "o": [["A", "No, porque Carla fue la integrante del equipo que más unidades vendió.", "Que Carla sea la mejor vendedora no basta: hay que comparar las sumas de cada pareja.", false], ["B", "Sí, porque Ana y Diego vendieron 22 unidades, y Carla y Elena, 20.", "Ana (12) + Diego (10) = 22 unidades; Carla (15) + Elena (5) = 20 unidades; 22 > 20.", true], ["C", "No, porque Ana y Diego vendieron 20 unidades, y Carla y Elena, 22.", "Las sumas están intercambiadas: Ana y Diego suman 22 y Carla y Elena suman 20.", false], ["D", "Sí, porque Ana vendió más unidades que Carla.", "Ana vendió 12 unidades y Carla 15; el dato es falso y además no compara las parejas.", false]]}, {"id": "MTA-208", "niv": 2, "cp": "mt_interpretacion", "cn": "", "e": "¿Cuál de las siguientes afirmaciones sobre la mediana de las unidades vendidas por los integrantes del equipo es correcta?", "f": "Mediana y promedio", "vis": "", "o": [["A", "La mediana es 10 unidades, igual que el promedio.", "Ordenados, los datos son 5, 8, 10, 12 y 15: el dato central es 10. El promedio es 50 ÷ 5 = 10, así que coinciden.", true], ["B", "La mediana es 12 unidades, mayor que el promedio.", "12 unidades es el cuarto dato al ordenar de menor a mayor; la mediana es el dato central, el tercero.", false], ["C", "La mediana es 15 unidades, mayor que el promedio.", "15 es la barra central de la gráfica, pero la mediana se halla con los datos ordenados por valor, no por el orden de los nombres.", false], ["D", "La mediana es 8 unidades, menor que el promedio.", "8 unidades es el dato de Beto, que ocupa el segundo lugar al ordenar los datos de menor a mayor; la mediana es el tercero.", false]]}]}, {"comp": "matematicas", "sim": "val-1", "ses": 1, "ind": "Recorrido de un camión de reparto", "tt": "", "texto": "La gráfica muestra la distancia total recorrida por un camión de reparto desde que salió de la bodega, durante 5 horas.", "vis": "<div class=\"vfig\"><svg class=\"vg\" viewBox=\"0 0 560 320\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Gráfica 2. Distancia recorrida por el camión\" font-family=\"Arial, sans-serif\" font-size=\"12\"><rect width=\"560\" height=\"320\" fill=\"#ffffff\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"13\" fill=\"#1d2433\">Gráfica 2. Distancia recorrida por el camión<\/text><line x1=\"60\" y1=\"258.0\" x2=\"540\" y2=\"258.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"262.0\" text-anchor=\"end\" fill=\"#3a4356\">0<\/text><line x1=\"60\" y1=\"213.6\" x2=\"540\" y2=\"213.6\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"217.6\" text-anchor=\"end\" fill=\"#3a4356\">50<\/text><line x1=\"60\" y1=\"169.2\" x2=\"540\" y2=\"169.2\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"173.2\" text-anchor=\"end\" fill=\"#3a4356\">100<\/text><line x1=\"60\" y1=\"124.8\" x2=\"540\" y2=\"124.8\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"128.8\" text-anchor=\"end\" fill=\"#3a4356\">150<\/text><line x1=\"60\" y1=\"80.4\" x2=\"540\" y2=\"80.4\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"84.4\" text-anchor=\"end\" fill=\"#3a4356\">200<\/text><line x1=\"60\" y1=\"36.0\" x2=\"540\" y2=\"36.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"40.0\" text-anchor=\"end\" fill=\"#3a4356\">250<\/text><line x1=\"60\" y1=\"258\" x2=\"540\" y2=\"258\" stroke=\"#3a4356\"/><line x1=\"60\" y1=\"258\" x2=\"60\" y2=\"36\" stroke=\"#3a4356\"/><text transform=\"translate(14,147.0) rotate(-90)\" text-anchor=\"middle\" fill=\"#3a4356\">Distancia (km)<\/text><text x=\"300.0\" y=\"312\" text-anchor=\"middle\" fill=\"#3a4356\">Tiempo (horas)<\/text><text x=\"100.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">0<\/text><text x=\"180.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">1<\/text><text x=\"260.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">2<\/text><text x=\"340.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">3<\/text><text x=\"420.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">4<\/text><text x=\"500.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">5<\/text><polyline fill=\"none\" stroke=\"#1660a8\" stroke-width=\"2.5\" points=\"100.0,258.0 180.0,222.5 260.0,151.4 340.0,151.4 420.0,107.0 500.0,44.9\"/><circle cx=\"100.0\" cy=\"258.0\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"100.0\" y=\"250.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">0<\/text><circle cx=\"180.0\" cy=\"222.5\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"180.0\" y=\"214.5\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">40<\/text><circle cx=\"260.0\" cy=\"151.4\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"260.0\" y=\"143.4\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">120<\/text><circle cx=\"340.0\" cy=\"151.4\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"340.0\" y=\"143.4\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">120<\/text><circle cx=\"420.0\" cy=\"107.0\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"420.0\" y=\"99.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">170<\/text><circle cx=\"500.0\" cy=\"44.9\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"500.0\" y=\"36.9\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">240<\/text><\/svg><\/div>", "items": [{"id": "MTA-209", "niv": 2, "cp": "mt_interpretacion", "cn": "", "e": "¿En cuál de los siguientes intervalos de una hora fue mayor la rapidez del camión?", "f": "Lectura de la gráfica (pendiente)", "vis": "", "o": [["A", "Entre la hora 3 y la hora 4.", "En esa hora la distancia pasó de 120 a 170 km: recorrió 50 km. Que el punto esté más alto no indica mayor rapidez.", false], ["B", "Entre la hora 0 y la hora 1.", "En esa hora la distancia pasó de 0 a 40 km: recorrió solo 40 km.", false], ["C", "Entre la hora 2 y la hora 3.", "En ese intervalo la distancia se mantuvo en 120 km: el camión estuvo detenido.", false], ["D", "Entre la hora 1 y la hora 2.", "En esa hora la distancia pasó de 40 a 120 km: recorrió 80 km, la mayor rapidez del recorrido (los demás tramos de una hora son de 40, 0, 50 y 70 km).", true]]}, {"id": "MTA-210", "niv": 2, "cp": "mt_formulacion", "cn": "", "e": "¿Cuál fue la rapidez media del camión en las 5 horas?", "f": "Razón de cambio (rapidez media)", "vis": "", "o": [["A", "48 km/h.", "Rapidez media = distancia total recorrida ÷ tiempo total = 240 km ÷ 5 h = 48 km/h; el tiempo detenido también cuenta.", true], ["B", "60 km/h.", "Divide 240 km entre las 4 horas en movimiento; la rapidez media de todo el trayecto incluye la hora en que estuvo detenido.", false], ["C", "80 km/h.", "Divide 240 km entre 3 h; no hay ningún intervalo de 3 horas que justifique esa división.", false], ["D", "240 km/h.", "Es la distancia total; falta dividir entre el tiempo.", false]]}, {"id": "MTA-211", "niv": 3, "cp": "mt_argumentacion", "cn": "", "e": "El conductor afirma que en las primeras 2 horas condujo más rápido, en promedio, que en las últimas 2 horas. ¿Es correcta su afirmación?", "f": "Interpretación de la pendiente", "vis": "", "o": [["A", "Sí, porque en las primeras 2 horas no se detuvo, mientras que en las últimas 2 sí lo hizo.", "El camión se detuvo entre la hora 2 y la 3, que no pertenece a ninguno de los dos tramos; en las últimas 2 horas no se detuvo.", false], ["B", "Sí, porque a las 2 horas ya llevaba 120 km, la mitad de todo el recorrido.", "El dato es cierto, pero no compara los dos tramos: en las últimas 2 horas también recorrió 120 km (de 120 a 240 km).", false], ["C", "No, porque en las últimas 2 horas llegó a 240 km, el doble de los 120 km del primer tramo.", "240 km es la distancia acumulada al final; en las últimas 2 horas recorrió 240 − 120 = 120 km.", false], ["D", "No, porque en ambos tramos recorrió 120 km en 2 horas, es decir, 60 km/h en promedio.", "De la hora 0 a la 2 pasó de 0 a 120 km, y de la hora 3 a la 5, de 120 a 240 km: 120 km en 2 h en ambos casos, la misma rapidez media.", true]]}]}, {"comp": "matematicas", "sim": "val-1", "ses": 1, "ind": "Cajas para almacenamiento", "tt": "", "texto": "Una empresa de mudanzas usa cajas con forma de paralelepípedo recto de 40 cm de largo, 30 cm de ancho y 20 cm de alto. Recuerde que 1 litro equivale a 1.000 cm³.", "vis": "", "items": [{"id": "MTA-212", "niv": 1, "cp": "mt_formulacion", "cn": "", "e": "¿Cuál es el volumen de cada caja, en litros?", "f": "Volumen del paralelepípedo", "vis": "", "o": [["A", "2,4 litros.", "Divide 24.000 cm³ entre 10.000 en lugar de entre 1.000.", false], ["B", "24 litros.", "V = 40 × 30 × 20 = 24.000 cm³; como 1 L = 1.000 cm³, el volumen es 24 litros.", true], ["C", "240 litros.", "Divide 24.000 cm³ entre 100 en lugar de entre 1.000.", false], ["D", "24.000 litros.", "No convierte las unidades: 24.000 es el volumen en centímetros cúbicos.", false]]}, {"id": "MTA-213", "niv": 2, "cp": "mt_formulacion", "cn": "", "e": "Las cajas se guardan en un contenedor de 2 m de largo, 1,2 m de ancho y 1 m de alto, todas en la misma posición: el largo de la caja a lo largo del contenedor, el ancho de la caja a lo ancho y el alto de la caja hacia arriba. ¿Cuántas cajas caben como máximo?", "f": "Cálculo propio", "vis": "", "o": [["A", "20 cajas.", "Cuenta solo las cajas de la capa del piso (5 × 4); faltan las 5 capas que caben hacia arriba.", false], ["B", "100 cajas.", "A lo largo caben 200 ÷ 40 = 5, a lo ancho 120 ÷ 30 = 4 y hacia arriba 100 ÷ 20 = 5: 5 × 4 × 5 = 100 cajas.", true], ["C", "125 cajas.", "Supone que en cada dirección caben 5 cajas; a lo ancho solo caben 120 ÷ 30 = 4.", false], ["D", "1.000 cajas.", "Convierte mal el volumen de la caja a metros cúbicos (0,0024 m³ en lugar de 0,024 m³) y divide 2,4 ÷ 0,0024 = 1.000.", false]]}, {"id": "MTA-214", "niv": 1, "cp": "mt_argumentacion", "cn": "", "e": "El jefe de bodega afirma que si se fabricara una caja con el mismo largo y el mismo ancho, pero con el doble de alto, su volumen sería el doble. ¿Es correcta su afirmación?", "f": "Volumen y proporcionalidad", "vis": "", "o": [["A", "No, porque el volumen solo aumenta 20 cm³, lo mismo que aumenta la altura de la caja.", "Confunde el aumento de una longitud (20 cm) con el aumento del volumen, que es 24.000 cm³.", false], ["B", "Sí, porque el volumen aumenta exactamente lo mismo que la altura.", "La altura aumenta 20 cm y el volumen aumenta 24.000 cm³; no aumentan lo mismo, sino en la misma proporción.", false], ["C", "Sí, porque V = largo × ancho × alto y solo uno de esos factores se multiplica por 2.", "V = 40 × 30 × 40 = 48.000 cm³, que es el doble de 24.000 cm³: al multiplicar un solo factor por 2, el producto se duplica.", true], ["D", "No, porque al duplicar una dimensión el volumen se multiplica por 2³ = 8.", "El volumen se multiplica por 8 solo si se duplican las tres dimensiones; aquí solo cambia el alto.", false]]}]}, {"comp": "matematicas", "sim": "val-1", "ses": 1, "ind": "Satisfacción de los clientes", "tt": "", "texto": "Un restaurante encuestó a 400 clientes sobre la atención recibida. La gráfica muestra el porcentaje de clientes en cada nivel de satisfacción.", "vis": "<div class=\"vfig\"><svg class=\"vg\" viewBox=\"0 0 560 320\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Gráfica 3. Satisfacción de los clientes\" font-family=\"Arial, sans-serif\" font-size=\"12\"><rect width=\"560\" height=\"320\" fill=\"#ffffff\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"13\" fill=\"#1d2433\">Gráfica 3. Satisfacción de los clientes<\/text><path d=\"M170,175 L170.0,60.0 A115,115 0 0,1 285.0,175.0 Z\" fill=\"#1660a8\" stroke=\"#fff\" stroke-width=\"1.5\"/><path d=\"M170,175 L285.0,175.0 A115,115 0 0,1 77.0,242.6 Z\" fill=\"#d9822b\" stroke=\"#fff\" stroke-width=\"1.5\"/><path d=\"M170,175 L77.0,242.6 A115,115 0 0,1 77.0,107.4 Z\" fill=\"#2e8b57\" stroke=\"#fff\" stroke-width=\"1.5\"/><path d=\"M170,175 L77.0,107.4 A115,115 0 0,1 170.0,60.0 Z\" fill=\"#8e44ad\" stroke=\"#fff\" stroke-width=\"1.5\"/><rect x=\"320\" y=\"59\" width=\"14\" height=\"14\" fill=\"#1660a8\"/><text x=\"340\" y=\"70\" fill=\"#1d2433\">Muy satisfecho: 25 %<\/text><rect x=\"320\" y=\"83\" width=\"14\" height=\"14\" fill=\"#d9822b\"/><text x=\"340\" y=\"94\" fill=\"#1d2433\">Satisfecho: 40 %<\/text><rect x=\"320\" y=\"107\" width=\"14\" height=\"14\" fill=\"#2e8b57\"/><text x=\"340\" y=\"118\" fill=\"#1d2433\">Neutral: 20 %<\/text><rect x=\"320\" y=\"131\" width=\"14\" height=\"14\" fill=\"#8e44ad\"/><text x=\"340\" y=\"142\" fill=\"#1d2433\">Insatisfecho: 15 %<\/text><\/svg><\/div>", "items": [{"id": "MTA-215", "niv": 2, "cp": "mt_interpretacion", "cn": "", "e": "En la gráfica circular, ¿cuántos grados mide el sector que corresponde a los clientes satisfechos?", "f": "Representación en gráficas circulares", "vis": "", "o": [["A", "40°.", "Toma el porcentaje (40 %) como si fuera la medida en grados; el círculo completo mide 360°, no 100.", false], ["B", "90°.", "Supone que cada una de las cuatro categorías ocupa un cuarto del círculo, sin tener en cuenta los porcentajes.", false], ["C", "144°.", "El sector es proporcional al porcentaje: 40 % de 360° = 0,4 × 360° = 144°.", true], ["D", "160°.", "Es el número de clientes satisfechos (40 % de 400), no la medida del ángulo del sector.", false]]}, {"id": "MTA-216", "niv": 2, "cp": "mt_interpretacion", "cn": "", "e": "¿Cuál opción presenta correctamente el número de clientes en cada nivel de satisfacción?", "f": "Transformación de representaciones", "vis": "", "o": [["A", "Muy satisfecho: 100; Satisfecho: 160; Neutral: 80; Insatisfecho: 60.", "Al aplicar cada porcentaje a 400: 25 % → 100, 40 % → 160, 20 % → 80 y 15 % → 60, que suman 400.", true], ["B", "Muy satisfecho: 100; Satisfecho: 140; Neutral: 80; Insatisfecho: 60.", "El 40 % de 400 es 160, no 140; además, los valores suman 380 y no 400.", false], ["C", "Muy satisfecho: 100; Satisfecho: 160; Neutral: 60; Insatisfecho: 80.", "Intercambia los valores de neutral e insatisfecho: el 20 % de 400 es 80 y el 15 % es 60.", false], ["D", "Muy satisfecho: 25; Satisfecho: 40; Neutral: 20; Insatisfecho: 15.", "Copia los porcentajes como si fueran números de clientes; esos valores suman 100 y no 400.", false]]}]}, {"comp": "matematicas", "sim": "val-1", "ses": 1, "ind": "Edades de los empleados de una empresa", "tt": "", "texto": "La tabla muestra la distribución de las edades de los 40 empleados de una empresa de confecciones.", "vis": "<table class=\"vt\"><caption>Tabla 1. Edades de los empleados<\/caption><thead><tr><th>Edad (años)<\/th><th>Número de empleados<\/th><\/tr><\/thead><tbody><tr><td>20 a 29<\/td><td>5<\/td><\/tr><tr><td>30 a 39<\/td><td>16<\/td><\/tr><tr><td>40 a 49<\/td><td>11<\/td><\/tr><tr><td>50 a 59<\/td><td>6<\/td><\/tr><tr><td>60 a 69<\/td><td>2<\/td><\/tr><tr><td>Total<\/td><td>40<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Datos ficticios.<\/div>", "items": [{"id": "MTA-217", "niv": 3, "cp": "mt_interpretacion", "cn": "", "e": "¿En qué intervalo de edad se encuentra la mediana de las edades de los empleados?", "f": "Mediana en datos agrupados", "vis": "", "o": [["A", "De 20 a 29 años.", "Ese intervalo solo contiene a los 5 empleados más jóvenes; la mediana está en las posiciones 20 y 21.", false], ["B", "De 50 a 59 años.", "Es el intervalo central de la tabla, pero la mediana depende de las frecuencias, no de la posición del intervalo en la tabla.", false], ["C", "De 40 a 49 años.", "Al acumular frecuencias, el intervalo de 40 a 49 años va del dato 22 al 32; los datos 20 y 21 están antes.", false], ["D", "De 30 a 39 años.", "Con 40 datos ordenados, la mediana está entre los datos 20 y 21. Las frecuencias acumuladas son 5 y 21, así que ambos datos están en el intervalo de 30 a 39 años.", true]]}, {"id": "MTA-218", "niv": 1, "cp": "mt_interpretacion", "cn": "", "e": "¿Qué porcentaje de los empleados tiene 50 años o más?", "f": "Lectura de tablas y porcentajes", "vis": "", "o": [["A", "2 %.", "Toma solo la frecuencia del último intervalo como si fuera un porcentaje.", false], ["B", "8 %.", "Toma el número de empleados (6 + 2 = 8) como si fuera el porcentaje.", false], ["C", "15 %.", "Calcula solo el intervalo de 50 a 59 años (6 ÷ 40); falta el de 60 a 69.", false], ["D", "20 %.", "Tienen 50 años o más 6 + 2 = 8 empleados; 8 ÷ 40 = 0,20, es decir, 20 %.", true]]}]}, {"comp": "matematicas", "sim": "val-1", "ses": 1, "ind": "Inversión con interés compuesto", "tt": "", "texto": "Una trabajadora invierte $ 5.000.000 en un producto financiero que paga un interés compuesto del 10 % anual: al final de cada año, los intereses se suman al capital y el año siguiente también generan intereses.", "vis": "", "items": [{"id": "MTA-223", "niv": 2, "cp": "mt_formulacion", "cn": "", "e": "Si no retira dinero, ¿cuánto dinero tendrá al cabo de 2 años?", "f": "Interés compuesto", "vis": "", "o": [["A", "$ 5.500.000.", "Es el valor al cabo de un solo año (5.000.000 × 1,1).", false], ["B", "$ 6.000.000.", "Calcula interés simple (500.000 cada año) y olvida que en el segundo año también generan interés los intereses del primero.", false], ["C", "$ 6.050.000.", "Primer año: 5.000.000 × 1,1 = 5.500.000. Segundo año: 5.500.000 × 1,1 = 6.050.000, es decir, 5.000.000 × 1,1².", true], ["D", "$ 11.000.000.", "Multiplica 5.000.000 × 1,1 × 2 en lugar de elevar 1,1 al cuadrado.", false]]}, {"id": "MTA-224", "niv": 3, "cp": "mt_argumentacion", "cn": "", "e": "Un asesor le dice: «Con este producto, en 5 años su dinero se duplica». ¿Es correcta la afirmación del asesor?", "f": "Interés compuesto", "vis": "", "o": [["A", "No, porque en 5 años el capital se multiplica por cerca de 1,61: crece unos 61 %.", "1,1⁵ = 1,61051; el capital pasa de 5.000.000 a unos 8.052.550, lejos de 10.000.000.", true], ["B", "Sí, porque en 5 años el capital se multiplica por cerca de 2,1, algo más del doble.", "El cálculo es incorrecto: 1,1⁵ = 1,61051, no 2,1.", false], ["C", "Sí, porque 5 años al 10 % dan 50 %, y el interés sobre los intereses aporta el otro 50 %.", "Los intereses sobre intereses aportan mucho menos: en 5 años el factor total es 1,1⁵ ≈ 1,61, es decir, unos 11 puntos más que el 50 %.", false], ["D", "No, porque en 5 años el capital se multiplica por cerca de 1,5: crece solo 50 %.", "La conclusión es correcta, pero el cálculo no: 1,1⁵ ≈ 1,61, no 1,5 (1,5 sería el interés simple).", false]]}, {"id": "MTA-225", "niv": 2, "cp": "mt_interpretacion", "cn": "", "e": "¿Cuál expresión representa el dinero V que tendrá la trabajadora al cabo de n años?", "f": "Modelación exponencial", "vis": "", "o": [["A", "V = 5.000.000 × 0,1ⁿ.", "Multiplica cada año por 0,1, con lo que el dinero se reduciría al 10 % cada año.", false], ["B", "V = 5.000.000 × 1,1ⁿ.", "Cada año el dinero se multiplica por 1,1 (100 % + 10 %); después de n años se ha multiplicado n veces: 5.000.000 × 1,1ⁿ.", true], ["C", "V = 5.000.000 × 1,1 × n.", "Multiplica por el número de años en lugar de elevar 1,1 a la n: con n = 2 daría 11.000.000 en vez de 6.050.000.", false], ["D", "V = 5.000.000 × (1 + 0,1n).", "Corresponde al interés simple: los intereses no se suman al capital para generar nuevos intereses.", false]]}]}, {"comp": "matematicas", "sim": "val-1", "ses": 1, "ind": "Consumo de energía de un hogar", "tt": "", "texto": "La gráfica muestra el consumo mensual de energía eléctrica de un hogar durante el primer semestre del año.", "vis": "<div class=\"vfig\"><svg class=\"vg\" viewBox=\"0 0 560 320\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Gráfica 4. Consumo mensual de energía\" font-family=\"Arial, sans-serif\" font-size=\"12\"><rect width=\"560\" height=\"320\" fill=\"#ffffff\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"13\" fill=\"#1d2433\">Gráfica 4. Consumo mensual de energía<\/text><line x1=\"60\" y1=\"258.0\" x2=\"540\" y2=\"258.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"262.0\" text-anchor=\"end\" fill=\"#3a4356\">0<\/text><line x1=\"60\" y1=\"202.5\" x2=\"540\" y2=\"202.5\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"206.5\" text-anchor=\"end\" fill=\"#3a4356\">50<\/text><line x1=\"60\" y1=\"147.0\" x2=\"540\" y2=\"147.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"151.0\" text-anchor=\"end\" fill=\"#3a4356\">100<\/text><line x1=\"60\" y1=\"91.5\" x2=\"540\" y2=\"91.5\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"95.5\" text-anchor=\"end\" fill=\"#3a4356\">150<\/text><line x1=\"60\" y1=\"36.0\" x2=\"540\" y2=\"36.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"40.0\" text-anchor=\"end\" fill=\"#3a4356\">200<\/text><line x1=\"60\" y1=\"258\" x2=\"540\" y2=\"258\" stroke=\"#3a4356\"/><line x1=\"60\" y1=\"258\" x2=\"60\" y2=\"36\" stroke=\"#3a4356\"/><text transform=\"translate(14,147.0) rotate(-90)\" text-anchor=\"middle\" fill=\"#3a4356\">Consumo (kWh)<\/text><text x=\"300.0\" y=\"312\" text-anchor=\"middle\" fill=\"#3a4356\">Mes<\/text><text x=\"100.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Ene<\/text><text x=\"180.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Feb<\/text><text x=\"260.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Mar<\/text><text x=\"340.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Abr<\/text><text x=\"420.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">May<\/text><text x=\"500.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Jun<\/text><rect x=\"72.0\" y=\"91.5\" width=\"56.0\" height=\"166.5\" fill=\"#1660a8\"/><text x=\"100.0\" y=\"87.5\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">150<\/text><rect x=\"152.0\" y=\"102.6\" width=\"56.0\" height=\"155.4\" fill=\"#1660a8\"/><text x=\"180.0\" y=\"98.6\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">140<\/text><rect x=\"232.0\" y=\"74.8\" width=\"56.0\" height=\"183.2\" fill=\"#1660a8\"/><text x=\"260.0\" y=\"70.8\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">165<\/text><rect x=\"312.0\" y=\"58.2\" width=\"56.0\" height=\"199.8\" fill=\"#1660a8\"/><text x=\"340.0\" y=\"54.2\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">180<\/text><rect x=\"392.0\" y=\"63.8\" width=\"56.0\" height=\"194.2\" fill=\"#1660a8\"/><text x=\"420.0\" y=\"59.8\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">175<\/text><rect x=\"472.0\" y=\"47.1\" width=\"56.0\" height=\"210.9\" fill=\"#1660a8\"/><text x=\"500.0\" y=\"43.1\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">190<\/text><\/svg><\/div>", "items": [{"id": "MTA-232", "niv": 2, "cp": "mt_formulacion", "cn": "", "e": "¿En qué porcentaje aumentó el consumo de junio con respecto al de enero?", "f": "Variación porcentual", "vis": "", "o": [["A", "21,1 %.", "Divide el aumento (40 kWh) entre el consumo de junio (190) en lugar de entre el de enero, que es el valor de referencia.", false], ["B", "26,7 %.", "El aumento fue de 190 − 150 = 40 kWh; respecto a enero: 40 ÷ 150 ≈ 0,267, es decir, 26,7 %.", true], ["C", "40 %.", "Toma el aumento en kWh (40) como si fuera un porcentaje.", false], ["D", "126,7 %.", "Es la razón 190 ÷ 150 expresada en porcentaje: indica que junio es el 126,7 % de enero, no el aumento.", false]]}, {"id": "MTA-233", "niv": 1, "cp": "mt_formulacion", "cn": "", "e": "La familia quiere que el consumo de julio sea al menos 10 % menor que el de junio. ¿Cuál debe ser, como máximo, el consumo de julio?", "f": "Cálculo propio", "vis": "", "o": [["A", "171 kWh.", "El 10 % de 190 es 19; 190 − 19 = 171 kWh (es decir, 190 × 0,9).", true], ["B", "172,7 kWh.", "Divide 190 entre 1,1; esa operación no reduce el valor en un 10 % (172,7 es solo 9,1 % menos).", false], ["C", "180 kWh.", "Resta 10 kWh en lugar del 10 %.", false], ["D", "209 kWh.", "Aumenta el consumo en 10 % en lugar de reducirlo.", false]]}]}, {"comp": "matematicas", "sim": "val-1", "ses": 1, "ind": "Pantallas semejantes", "tt": "", "texto": "Una tienda vende pantallas rectangulares con la misma forma (semejantes) y distintos tamaños. Una pantalla mide 80 cm de ancho y 60 cm de alto, por lo que su diagonal mide 100 cm. Otra pantalla, semejante a la primera, tiene una diagonal de 125 cm.", "vis": "", "items": [{"id": "MTA-236", "niv": 2, "cp": "mt_formulacion", "cn": "", "e": "¿Cuál es el ancho de la pantalla de 125 cm de diagonal?", "f": "Semejanza", "vis": "", "o": [["A", "64 cm.", "Usa la razón invertida (100 ÷ 125 = 0,8): 80 × 0,8 = 64 cm, que sería el ancho de una pantalla más pequeña.", false], ["B", "75 cm.", "Es el alto de la pantalla grande (60 × 1,25), no su ancho.", false], ["C", "80 cm.", "Supone que las pantallas semejantes tienen las mismas medidas; la semejanza conserva la forma, no el tamaño.", false], ["D", "100 cm.", "La razón de semejanza es 125 ÷ 100 = 1,25; el ancho es 80 × 1,25 = 100 cm.", true]]}, {"id": "MTA-237", "niv": 2, "cp": "mt_argumentacion", "cn": "", "e": "Un cliente afirma que la pantalla de 125 cm tiene un área 25 % mayor que la de 100 cm, porque su diagonal es 25 % mayor. ¿Es correcta su afirmación?", "f": "Semejanza y áreas", "vis": "", "o": [["A", "No, porque el área aumenta el doble que la diagonal: 2 × 25 % = 50 %.", "El área no aumenta el doble del porcentaje: 1,25² = 1,5625, es decir, aumenta 56,25 %.", false], ["B", "Sí, porque si la diagonal aumenta (125 − 100) ÷ 100 = 25 %, el área también aumenta 25 %.", "En figuras semejantes el área cambia con el cuadrado de la razón de semejanza, no en la misma proporción que las longitudes.", false], ["C", "No, porque el área se multiplica por 1,25² = 1,5625, es decir, aumenta cerca de 56 %.", "Área pequeña: 80 × 60 = 4.800 cm²; área grande: 100 × 75 = 7.500 cm²; 7.500 ÷ 4.800 = 1,5625.", true], ["D", "Sí, porque el perímetro aumenta 25 %, y en figuras semejantes el área cambia igual que el perímetro.", "El perímetro sí aumenta 25 %, pero el área no cambia igual: en figuras semejantes el área se multiplica por el cuadrado de la razón, 1,25² = 1,5625.", false]]}]}, {"comp": "matematicas", "sim": "val-1", "ses": 1, "ind": "Capacitación y productividad", "tt": "", "texto": "Una empresa registró las horas de capacitación que recibió cada uno de seis operarios y el número de unidades que produce por día. La gráfica muestra los datos (ficticios).", "vis": "<div class=\"vfig\"><svg class=\"vg\" viewBox=\"0 0 560 320\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Gráfica 5. Capacitación y producción diaria\" font-family=\"Arial, sans-serif\" font-size=\"12\"><rect width=\"560\" height=\"320\" fill=\"#ffffff\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"13\" fill=\"#1d2433\">Gráfica 5. Capacitación y producción diaria<\/text><line x1=\"60\" y1=\"258.0\" x2=\"540\" y2=\"258.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"262.0\" text-anchor=\"end\" fill=\"#3a4356\">0<\/text><line x1=\"60\" y1=\"213.6\" x2=\"540\" y2=\"213.6\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"217.6\" text-anchor=\"end\" fill=\"#3a4356\">10<\/text><line x1=\"60\" y1=\"169.2\" x2=\"540\" y2=\"169.2\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"173.2\" text-anchor=\"end\" fill=\"#3a4356\">20<\/text><line x1=\"60\" y1=\"124.8\" x2=\"540\" y2=\"124.8\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"128.8\" text-anchor=\"end\" fill=\"#3a4356\">30<\/text><line x1=\"60\" y1=\"80.4\" x2=\"540\" y2=\"80.4\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"84.4\" text-anchor=\"end\" fill=\"#3a4356\">40<\/text><line x1=\"60\" y1=\"36.0\" x2=\"540\" y2=\"36.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"40.0\" text-anchor=\"end\" fill=\"#3a4356\">50<\/text><line x1=\"60\" y1=\"258\" x2=\"540\" y2=\"258\" stroke=\"#3a4356\"/><line x1=\"60\" y1=\"258\" x2=\"60\" y2=\"36\" stroke=\"#3a4356\"/><text transform=\"translate(14,147.0) rotate(-90)\" text-anchor=\"middle\" fill=\"#3a4356\">Unidades por día<\/text><text x=\"300.0\" y=\"312\" text-anchor=\"middle\" fill=\"#3a4356\">Horas de capacitación<\/text><text x=\"60.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">0<\/text><text x=\"156.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">2<\/text><text x=\"252.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">4<\/text><text x=\"348.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">6<\/text><text x=\"444.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">8<\/text><text x=\"540.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">10<\/text><circle cx=\"156.0\" cy=\"124.8\" r=\"4\" fill=\"#1660a8\"/><circle cx=\"252.0\" cy=\"107.0\" r=\"4\" fill=\"#1660a8\"/><circle cx=\"300.0\" cy=\"93.7\" r=\"4\" fill=\"#1660a8\"/><circle cx=\"348.0\" cy=\"89.3\" r=\"4\" fill=\"#1660a8\"/><circle cx=\"444.0\" cy=\"58.2\" r=\"4\" fill=\"#1660a8\"/><circle cx=\"540.0\" cy=\"44.9\" r=\"4\" fill=\"#1660a8\"/><\/svg><\/div>", "items": [{"id": "MTA-243", "niv": 2, "cp": "mt_interpretacion", "cn": "", "e": "¿Qué describe mejor la relación entre las horas de capacitación y la productividad de estos operarios?", "f": "Diagrama de dispersión y correlación", "vis": "", "o": [["A", "No hay ninguna relación entre las horas de capacitación y la producción diaria.", "Los puntos muestran una tendencia clara a aumentar, no una nube sin patrón.", false], ["B", "A más horas de capacitación, en general, menor producción diaria.", "Describe una relación decreciente (correlación negativa), pero los puntos suben de izquierda a derecha.", false], ["C", "Cada hora adicional de capacitación aumenta la producción exactamente en 2 unidades.", "Los aumentos no son constantes: de 4 a 5 horas sube 3 unidades y de 5 a 6 horas sube solo 1.", false], ["D", "A más horas de capacitación, en general, mayor producción diaria.", "Los puntos forman una tendencia creciente: los operarios con más horas de capacitación tienden a producir más unidades (correlación positiva).", true]]}, {"id": "MTA-244", "niv": 2, "cp": "mt_argumentacion", "cn": "", "e": "El gerente concluye que la capacitación es la única causa de las diferencias de productividad entre los operarios. ¿Es válida esta conclusión?", "f": "Correlación y causalidad", "vis": "", "o": [["A", "Sí, porque el operario con 10 horas de capacitación es el que más produce: 48 unidades.", "Un solo caso no establece la causa; otros factores pueden explicar también su productividad.", false], ["B", "No, porque la relación es negativa: a más horas de capacitación, menos unidades produce cada operario.", "La relación es positiva: los operarios con más horas de capacitación tienden a producir más.", false], ["C", "No, porque los datos muestran relación, pero no descartan otros factores, como la experiencia.", "La correlación no implica causalidad: con solo estos datos no se pueden descartar otras causas (experiencia, máquina asignada, turno, etc.).", true], ["D", "Sí, porque los puntos suben de 30 a 48 unidades cuando las horas pasan de 2 a 10.", "Una tendencia creciente muestra correlación, pero no prueba que la capacitación sea la causa, y menos la única.", false]]}]}, {"comp": "lectura_critica", "sim": "val-1", "ses": 1, "ind": "Cuento: la madre que vuelve a estudiar", "tt": "Texto literario", "texto": "Las tareas de mi mamá (cuento)\n\n(1) Mi mamá volvió a estudiar a los cuarenta y siete años, el mismo año en que yo entré a la universidad. Durante el día trabajaba en el taller de confección de doña Rubiela, pegando bolsillos a pantalones que nunca íbamos a ver puestos, y de siete a diez de la noche se sentaba en un pupitre del colegio del barrio, en el programa para adultos, con un cuaderno forrado en papel de regalo.\n\n(2) Al principio no quería que nadie supiera. Decía que iba a una reunión de la junta de acción comunal y llegaba a la casa con la cara de quien ha cargado bultos. Yo la descubrí una noche porque dejó el cuaderno en la mesa del comedor: en la primera página, con letra muy apretada, había escrito «Ecuaciones» y, debajo, más pequeño, «no tener miedo».\n\n(3) Desde entonces hicimos un trato. Yo le explicaba matemáticas los domingos y ella me corregía la ortografía de los trabajos de la universidad, porque había leído, en los ratos libres del taller, más novelas que todos mis compañeros juntos. Discutíamos mucho. Ella quería entender por qué funcionaban las fórmulas antes de usarlas; yo le decía que eso no importaba, que había que practicar. Un domingo me preguntó por qué, al pasar un número al otro lado del igual, cambiaba de signo, y me di cuenta de que yo tampoco lo sabía. Lo buscamos juntas.\n\n(4) El día del examen de validación se levantó a las cuatro y planchó dos veces la misma blusa. No desayunó. Antes de salir me pidió que le revisara la cédula, el lápiz, el borrador, como si fuera ella la hija.\n\n(5) Los resultados llegaron en un correo que abrimos en el celular de mi hermano menor, los tres apretados en la cocina. Mi mamá no leyó el puntaje. Leyó solo la palabra «aprobado», se sentó y dijo que ahora sí iba a aprender bien por qué cambian los signos.", "vis": "", "items": [{"id": "LCA-201", "niv": 1, "cp": "lc_local", "cn": "", "e": "Según el párrafo (2), la narradora descubrió que su mamá estaba estudiando porque", "f": "Párrafo (2)", "vis": "", "o": [["A", "encontró el cuaderno de su mamá olvidado en la mesa del comedor.", "El párrafo (2) dice: «Yo la descubrí una noche porque dejó el cuaderno en la mesa del comedor».", true], ["B", "su mamá se lo confesó al volver de la reunión de la junta.", "La mamá decía que iba a la junta precisamente para ocultarlo; no lo confesó.", false], ["C", "la vio entrar una noche al colegio del barrio con un cuaderno.", "El texto no dice que la narradora la viera entrar al colegio.", false], ["D", "doña Rubiela, la dueña del taller, se lo contó un domingo.", "Doña Rubiela solo se menciona como dueña del taller; no revela nada.", false]]}, {"id": "LCA-202", "niv": 1, "cp": "lc_local", "cn": "", "e": "De acuerdo con el trato descrito en el párrafo (3), la mamá se comprometía a", "f": "Párrafo (3)", "vis": "", "o": [["A", "acompañar a su hija a la universidad en sus ratos libres.", "El trato no incluye nada parecido.", false], ["B", "corregir la ortografía de los trabajos universitarios de su hija.", "El texto dice que «ella me corregía la ortografía de los trabajos de la universidad».", true], ["C", "prestarle a su hija las novelas que leía en el taller de confección.", "El texto menciona que leía muchas novelas, pero no que se comprometiera a prestarlas.", false], ["D", "explicarle matemáticas a su hija los domingos por la tarde.", "Era la hija quien le explicaba matemáticas a la mamá, no al revés.", false]]}, {"id": "LCA-203", "niv": 2, "cp": "lc_global", "cn": "", "e": "En el párrafo (4), la expresión «como si fuera ella la hija» muestra que ese día", "f": "Párrafo (4)", "vis": "", "o": [["A", "la madre se sentía más joven y despreocupada que su hija.", "Planchar dos veces la blusa y no desayunar muestran nervios, no despreocupación.", false], ["B", "la madre había olvidado sus documentos en exámenes anteriores.", "El texto no menciona exámenes anteriores ni olvidos; la petición se explica por los nervios.", false], ["C", "se invirtieron los papeles habituales entre madre e hija.", "Normalmente es la madre quien revisa que los hijos lleven sus cosas; ese día la mamá, nerviosa, le pide a la hija que la revise a ella.", true], ["D", "la hija le reprochó a su madre el desorden con sus útiles.", "La hija no le reprocha nada; es la madre quien pide ayuda.", false]]}, {"id": "LCA-204", "niv": 2, "cp": "lc_global", "cn": "", "e": "¿Qué rasgo de la mamá se mantiene desde el párrafo (3) hasta el final del relato?", "f": "Párrafos (3) y (5)", "vis": "", "o": [["A", "Su interés por demostrar que sabía más matemáticas que su hija universitaria.", "El relato no muestra competencia entre ellas; muestra colaboración («Lo buscamos juntas»).", false], ["B", "Su deseo de comprender el porqué de lo que estudia, y no solo de aprobar.", "En (3) quiere saber «por qué funcionaban las fórmulas»; en (5), tras aprobar, dice que ahora aprenderá «por qué cambian los signos».", true], ["C", "Su preferencia por practicar las fórmulas sin preguntarse por qué funcionan.", "Esa era la postura de la hija; la madre quería entender antes de usar las fórmulas.", false], ["D", "Su intención de ocultarle a la familia que estaba estudiando de noche.", "Ese rasgo aparece al principio (párrafo 2), pero desaparece cuando la hija la descubre y hacen el trato.", false]]}, {"id": "LCA-205", "niv": 2, "cp": "lc_reflexion", "cn": "", "e": "¿Qué idea sobre el aprendizaje se desprende de la relación entre madre e hija?", "f": "Párrafo (3)", "vis": "", "o": [["A", "Aprender puede ser un intercambio en el que cada una enseña lo que la otra no sabe.", "La hija enseña matemáticas y la madre corrige ortografía; además, investigan juntas lo que ninguna sabía.", true], ["B", "Los adultos aprenden más lentamente que los jóvenes y por eso necesitan más ayuda.", "El relato no compara velocidades de aprendizaje; la madre incluso corrige la ortografía de su hija.", false], ["C", "Estudiar en la edad adulta es un motivo de vergüenza que conviene ocultar.", "Aunque al principio la madre lo oculta, el relato termina celebrando su logro, no presentándolo como vergonzoso.", false], ["D", "Lo más importante de un examen es el puntaje que se obtiene en él.", "La mamá «no leyó el puntaje»; el relato no valora el examen por la cifra.", false]]}]}, {"comp": "lectura_critica", "sim": "val-1", "ses": 1, "ind": "Obra de teatro: la junta decide qué hacer con un lote", "tt": "Texto literario", "texto": "El lote de la esquina (fragmento de una obra de teatro)\n\n(Salón comunal de un barrio. Sillas plásticas en desorden. En el tablero alguien escribió: «Lote de la esquina: ¿qué hacemos?». DOÑA CARMEN, presidenta de la junta, sostiene un cuaderno. WÍLMAR, de veinte años, lleva un balón bajo el brazo. DON EFRAÍN, sentado adelante, tiene las manos llenas de tierra).\n\nDOÑA CARMEN: Bueno, ya somos suficientes para votar. Hay dos propuestas: la cancha y la huerta. Cada uno tiene tres minutos.\nWÍLMAR: No necesito tres. Los muchachos del barrio no tienen dónde jugar. Si no les damos una cancha, la esquina se la queda otra gente, y ya sabemos qué gente.\nDON EFRAÍN: (Sin levantarse). Yo tampoco necesito tres. Una huerta da comida. Una cancha da… (busca la palabra) …gritos.\nWÍLMAR: Los gritos también alimentan, don Efraín. Usted gritaba en los partidos del barrio cuando yo era niño. Yo lo oía desde mi casa.\nDON EFRAÍN: (Sonríe a su pesar). Eso era otra época. Uno tenía rodillas.\nDOÑA CARMEN: Por favor, sin desviarse. ¿Alguien tiene una propuesta distinta?\n(Silencio. Una NIÑA, sentada en el piso al fondo del salón, levanta la mano).\nNIÑA: ¿Y si la huerta queda alrededor de la cancha?\n(Todos la miran. WÍLMAR y DON EFRAÍN se miran entre sí).\nDON EFRAÍN: El balón me va a tumbar las matas.\nWÍLMAR: Ponemos malla. Los muchachos ayudamos a ponerla.\nDON EFRAÍN: ¿Y quién riega en vacaciones?\nWÍLMAR: (Después de pensarlo). Los que juegan. El que no riega, no juega.\nDOÑA CARMEN: (Anota en el cuaderno, despacio). Entonces… ¿votamos la propuesta de la niña?\nDON EFRAÍN: (Se levanta y se sacude las manos). Votemos. Pero que conste en el acta que la idea no fue de ninguno de nosotros dos.", "vis": "", "items": [{"id": "LCA-206", "niv": 1, "cp": "lc_local", "cn": "", "e": "Según el diálogo, ¿qué solución propone Wílmar para el riego de la huerta en vacaciones?", "f": "Parlamentos finales de Wílmar", "vis": "", "o": [["A", "Que don Efraín se encargue de regar, porque fue él quien propuso la huerta.", "Wílmar no le asigna esa tarea a don Efraín; la asigna a los jugadores.", false], ["B", "Que la junta contrate a una persona para regar durante las vacaciones.", "En la escena nadie propone contratar a alguien.", false], ["C", "Que se instale una malla alrededor para proteger las matas del balón.", "La malla es la solución de Wílmar a otro problema: que el balón tumbe las matas.", false], ["D", "Que quienes usen la cancha rieguen, como condición para poder jugar.", "Wílmar responde: «Los que juegan. El que no riega, no juega».", true]]}, {"id": "LCA-207", "niv": 2, "cp": "lc_global", "cn": "", "e": "Cuando Wílmar dice «Los gritos también alimentan, don Efraín», su propósito es", "f": "Diálogo entre Wílmar y don Efraín", "vis": "", "o": [["A", "proponer que la huerta se haga en otro lote, lejos de la cancha.", "Wílmar no propone otro lugar; la combinación de ambas surge después, de la niña.", false], ["B", "aceptar que la cancha no tiene ninguna utilidad práctica para el barrio.", "Al contrario, Wílmar defiende el valor de la cancha frente a la crítica de don Efraín.", false], ["C", "burlarse de don Efraín porque ya está viejo y no puede jugar fútbol como antes.", "Wílmar no menciona la edad de don Efraín; es este quien bromea sobre sus rodillas.", false], ["D", "defender el valor de la cancha recordándole su propio gusto por el fútbol.", "Wílmar usa la palabra «alimentan» para contestar a «Una huerta da comida» y le recuerda que él mismo gritaba en los partidos del barrio.", true]]}, {"id": "LCA-208", "niv": 2, "cp": "lc_global", "cn": "", "e": "¿Cómo cambia la relación entre Wílmar y don Efraín a lo largo de la escena?", "f": "Escena completa", "vis": "", "o": [["A", "Pasan de colaborar en una sola propuesta a enfrentarse por el uso del lote.", "El orden es el inverso: empiezan enfrentados y terminan colaborando.", false], ["B", "Wílmar convence a don Efraín de renunciar a la huerta y apoyar la cancha.", "La huerta no se abandona: la propuesta final combina huerta y cancha.", false], ["C", "Pasan de defender cada uno lo suyo a buscar juntos cómo hacer viable otra idea.", "Al principio cada uno defiende la suya; después de la propuesta de la niña, don Efraín plantea objeciones y Wílmar ofrece soluciones (malla, riego).", true], ["D", "Ambos se niegan a votar la propuesta de la niña y abandonan molestos la reunión.", "Don Efraín dice «Votemos»; nadie abandona la reunión.", false]]}, {"id": "LCA-209", "niv": 3, "cp": "lc_reflexion", "cn": "", "e": "Con la última frase de don Efraín, «que conste en el acta que la idea no fue de ninguno de nosotros dos», la obra sugiere que", "f": "Último parlamento", "vis": "", "o": [["A", "la solución vino de alguien ajeno a la disputa, así que ninguno siente que el otro ganó.", "Don Efraín acepta votar, pero deja claro que ni él ni Wílmar ganaron: la idea fue de la niña, lo que facilita el acuerdo entre ambos.", true], ["B", "Wílmar y don Efraín siguen enfrentados y piensan rechazar el resultado de la votación.", "Don Efraín pide votar y ambos han propuesto soluciones juntos; no hay señal de que rechacen el resultado.", false], ["C", "don Efraín desconfía de que doña Carmen escriba el acta de forma fiel a lo ocurrido.", "Nada en la escena indica desconfianza hacia doña Carmen.", false], ["D", "el acta de la junta debe registrar siempre el nombre de quien propone cada idea.", "La frase no trata de una regla sobre las actas; expresa con humor cómo se siente don Efraín.", false]]}]}, {"comp": "lectura_critica", "sim": "val-1", "ses": 1, "ind": "Ensayo: Epicteto y lo que depende de nosotros", "tt": "Texto filosófico", "texto": "Lo que depende de mí\n\n(1) Epicteto nació esclavo en el siglo I de nuestra era y llegó a ser uno de los maestros más influyentes del estoicismo, una escuela filosófica que buscaba enseñar a vivir con serenidad. Su punto de partida es una distinción sencilla de enunciar y difícil de practicar: entre las cosas, unas dependen de nosotros y otras no.\n\n(2) Según Epicteto, dependen de nosotros nuestros juicios, nuestros deseos, nuestras aversiones y nuestras decisiones; en una palabra, lo que hacemos con nuestra propia mente. No dependen de nosotros el cuerpo, los bienes, la reputación ni los cargos: podemos influir en ellos, pero el resultado final no está en nuestras manos. El error que nos hace sufrir, decía, consiste en tratar lo segundo como si fuera lo primero.\n\n(3) Pensemos en una trabajadora que espera un ascenso. Si pone toda su tranquilidad en obtenerlo, quedará a merced de factores que no controla: la decisión del jefe, el presupuesto de la empresa, la llegada de otro candidato. Un estoico le diría que dirija su esfuerzo a lo que sí depende de ella, como preparar bien su trabajo, cumplir con honestidad y presentar su candidatura con claridad, y que acepte con calma el resultado, sea cual sea.\n\n(4) Esta enseñanza suele malinterpretarse como una invitación a la resignación o a la indiferencia. No lo es. Epicteto no pide dejar de actuar, sino actuar sin atar la paz interior a lo que escapa de nuestro poder. La trabajadora estoica no deja de aspirar al ascenso; simplemente no permite que su valor como persona dependa de conseguirlo.\n\n(5) Con todo, la propuesta tiene límites que vale la pena discutir. Hay situaciones en las que lo que «no depende de mí» sí depende de nosotros, como colectivo: una persona sola no puede cambiar las condiciones de su empresa, pero varias, organizadas, quizá sí. Tomada sin matices, la distinción de Epicteto podría llevar a aceptar como inevitable lo que en realidad es injusto y modificable. Tal vez su mayor utilidad no esté en decirnos qué aceptar, sino en obligarnos a preguntar, cada vez, dónde termina de verdad nuestro poder.", "vis": "", "items": [{"id": "LCA-210", "niv": 1, "cp": "lc_local", "cn": "", "e": "Según el párrafo (2), ¿cuál de los siguientes elementos depende de nosotros para Epicteto?", "f": "Párrafo (2)", "vis": "", "o": [["A", "Nuestra reputación entre los demás.", "La reputación aparece entre lo que «no depende de nosotros».", false], ["B", "Nuestros juicios sobre lo que nos ocurre.", "El párrafo (2) incluye «nuestros juicios» entre lo que depende de nosotros.", true], ["C", "El cargo que ocupamos en la empresa.", "Los cargos están en la lista de lo que no depende de nosotros.", false], ["D", "La salud de nuestro propio cuerpo.", "El cuerpo figura entre lo que no depende de nosotros, aunque podamos influir en él.", false]]}, {"id": "LCA-211", "niv": 1, "cp": "lc_global", "cn": "", "e": "¿Qué función cumple el ejemplo de la trabajadora que espera un ascenso (párrafo 3)?", "f": "Párrafo (3)", "vis": "", "o": [["A", "Probar que el estoicismo conduce a la resignación frente a los problemas laborales.", "El párrafo (4) aclara que la enseñanza estoica no es una invitación a la resignación.", false], ["B", "Mostrar cómo se aplica la distinción de Epicteto a una situación cotidiana.", "Tras exponer la distinción en (2), el autor la ilustra con un caso laboral: qué depende de la trabajadora y qué no.", true], ["C", "Criticar a las empresas que no ascienden a las mujeres que lo merecen.", "El texto no habla de discriminación; usa el caso para ilustrar una idea filosófica.", false], ["D", "Demostrar que los ascensos dependen únicamente del esfuerzo de cada trabajador.", "El ejemplo dice lo contrario: el ascenso depende también del jefe, del presupuesto y de otros candidatos.", false]]}, {"id": "LCA-212", "niv": 2, "cp": "lc_global", "cn": "", "e": "De acuerdo con el párrafo (4), la diferencia entre la actitud estoica y la resignación es que el estoico", "f": "Párrafo (4)", "vis": "", "o": [["A", "solo desea lo que ya tiene y evita proponerse metas nuevas en su trabajo.", "Nada en el texto indica que el estoico renuncie a nuevas metas.", false], ["B", "deja de aspirar a lo que no controla, mientras que el resignado sigue intentándolo.", "El texto afirma que la trabajadora estoica «no deja de aspirar al ascenso».", false], ["C", "se mantiene indiferente ante el resultado, porque considera que nada depende de él.", "El texto rechaza que la enseñanza sea una invitación a la indiferencia, y reconoce que algunas cosas sí dependen de nosotros.", false], ["D", "sigue actuando por sus metas, pero no ata su tranquilidad al resultado.", "El texto dice que Epicteto «no pide dejar de actuar, sino actuar sin atar la paz interior a lo que escapa de nuestro poder».", true]]}, {"id": "LCA-213", "niv": 2, "cp": "lc_reflexion", "cn": "", "e": "En el párrafo (5), el autor del texto", "f": "Párrafo (5)", "vis": "", "o": [["A", "demuestra que Epicteto se contradice cuando habla del trabajo y de los cargos.", "El autor no señala ninguna contradicción interna en Epicteto; señala un posible mal uso de su idea.", false], ["B", "abandona su exposición inicial y adopta la postura contraria a la de Epicteto.", "El autor no adopta una postura contraria; matiza la distinción y le reconoce valor.", false], ["C", "plantea una objeción a la idea de Epicteto sin rechazarla por completo.", "Señala un límite (lo que depende de nosotros como colectivo), pero reconoce una «utilidad» en la distinción.", true], ["D", "resume los argumentos anteriores sin añadir ninguna idea nueva al texto.", "El párrafo (5) añade una idea nueva: la dimensión colectiva de lo que depende de nosotros.", false]]}, {"id": "LCA-214", "niv": 3, "cp": "lc_reflexion", "cn": "", "e": "En una fábrica, los salarios llevan meses de retraso. Un trabajador dice: «Eso no depende de mí; solo me queda aceptarlo con serenidad». ¿Cómo valoraría esta postura el autor del texto?", "f": "Párrafo (5)", "vis": "", "o": [["A", "Como un uso sin matices de la distinción, pues el problema puede tener solución colectiva.", "El párrafo (5) advierte que lo que no depende de uno solo puede depender «de nosotros, como colectivo», y que aceptar todo sin matices puede llevar a tolerar lo injusto.", true], ["B", "Como un ejemplo de la sabiduría estoica que el autor recomienda seguir.", "El autor sí tiene reservas: el párrafo (5) discute los límites de la distinción.", false], ["C", "Como una actitud correcta, porque los bienes no dependen de nadie y es inútil reclamar.", "El autor critica justamente aceptar como inevitable lo que puede ser «injusto y modificable».", false], ["D", "Como una actitud que el propio Epicteto rechazaba, pues él pedía rebelarse ante la injusticia.", "El texto no atribuye a Epicteto un llamado a la rebelión; la objeción colectiva es del autor.", false]]}, {"id": "LCA-215", "niv": 2, "cp": "lc_reflexion", "cn": "", "e": "¿Cuál de los siguientes enunciados es compatible con la idea de Epicteto tal como la presenta el texto?", "f": "Párrafos (2) y (4)", "vis": "", "o": [["A", "«No puedo impedir que me critiquen, pero sí decidir cómo respondo».", "Distingue lo que no depende de uno (la crítica ajena, ligada a la reputación) de lo que sí (el propio juicio y la propia decisión).", true], ["B", "«Si me esfuerzo lo suficiente, cualquier resultado depende de mí».", "Contradice la idea de que hay cosas cuyo resultado final «no está en nuestras manos».", false], ["C", "«Mi valor como persona se mide por los cargos que consigo».", "Para Epicteto, los cargos no dependen de nosotros, y el texto dice que el valor personal no debe depender de ellos.", false], ["D", "«Como no controlo el resultado, no vale la pena intentarlo».", "El texto aclara que Epicteto «no pide dejar de actuar».", false]]}]}, {"comp": "lectura_critica", "sim": "val-1", "ses": 1, "ind": "Ensayo: Mill y el principio del daño en la convivencia", "tt": "Texto filosófico", "texto": "¿Hasta dónde llega mi libertad?\n\n(1) En casi todos los conjuntos residenciales y barrios hay discusiones parecidas: el vecino que pone música a todo volumen, la señora que tiene doce gatos, el muchacho que se pinta el pelo de verde, la familia que no asiste a la misa del barrio. ¿Cuáles de estas conductas pueden ser objeto de reproche o de sanción por parte de la comunidad y cuáles no? El filósofo inglés John Stuart Mill propuso, en su ensayo Sobre la libertad (1859), un criterio para responder.\n\n(2) Su propuesta, conocida como el principio del daño, sostiene que la única razón legítima para limitar la libertad de una persona contra su voluntad es evitar que dañe a otros. El bien de la propia persona, físico o moral, no es por sí solo una razón suficiente. Podemos aconsejarla, discutir con ella, intentar persuadirla; pero no obligarla, si lo que hace solo la afecta a ella.\n\n(3) Mill defendía este principio con varios argumentos. Uno es que cada persona suele conocer mejor que nadie sus propios intereses. Otro es que la diversidad de formas de vida es valiosa para la sociedad: los «experimentos de vida», incluso los que parecen extraños, permiten descubrir maneras mejores de vivir. Mill temía especialmente la presión de la opinión mayoritaria, que, sin necesidad de leyes, puede volverse tan opresiva como un gobierno.\n\n(4) Aplicado a nuestros ejemplos, el criterio distingue con bastante claridad. El pelo verde y la ausencia en la misa no dañan a nadie; molestan, a lo sumo, el gusto o las convicciones de algunos, y eso no basta para sancionarlos. La música a todo volumen a medianoche es distinta: afecta el descanso y la salud de otros, y la comunidad puede regularla.\n\n(5) Los doce gatos, en cambio, muestran que el principio no siempre es fácil de aplicar. Si están bien cuidados, parece un asunto privado; si los olores o el ruido invaden las viviendas vecinas, empieza a haber un daño. La frontera entre lo que «solo me afecta a mí» y lo que afecta a otros no viene dada: hay que discutirla caso por caso.", "vis": "", "items": [{"id": "LCA-216", "niv": 1, "cp": "lc_local", "cn": "", "e": "Según el párrafo (2), ¿qué se puede hacer, de acuerdo con Mill, con una persona cuya conducta solo la afecta a ella?", "f": "Párrafo (2)", "vis": "", "o": [["A", "Sancionarla si su conducta molesta el gusto de la mayoría.", "El texto dice que molestar el gusto de algunos «no basta para sancionar».", false], ["B", "Obligarla a cambiar de conducta si es por su propio bien.", "Mill sostiene que el bien de la propia persona «no es por sí solo una razón suficiente» para obligarla.", false], ["C", "Evitar discutir con ella, porque nadie debe opinar sobre su vida.", "El texto afirma que sí se puede discutir con ella.", false], ["D", "Tratar de convencerla con razones, sin imponerle un cambio.", "El texto dice: «Podemos aconsejarla, discutir con ella, intentar persuadirla; pero no obligarla».", true]]}, {"id": "LCA-217", "niv": 1, "cp": "lc_global", "cn": "", "e": "¿Cuál es la función del párrafo (3) en el texto?", "f": "Párrafo (3)", "vis": "", "o": [["A", "Aplicar el principio del daño a los ejemplos de la vida en el barrio.", "La aplicación a los ejemplos se hace en los párrafos (4) y (5).", false], ["B", "Exponer las objeciones que otros filósofos le hicieron a Mill.", "El texto no menciona objeciones de otros filósofos.", false], ["C", "Presentar las razones con las que Mill defendía su principio.", "El párrafo empieza «Mill defendía este principio con varios argumentos» y los expone.", true], ["D", "Señalar las dificultades prácticas de aplicar el principio del daño.", "Las dificultades aparecen en el párrafo (5), con el caso de los gatos.", false]]}, {"id": "LCA-218", "niv": 2, "cp": "lc_global", "cn": "", "e": "Según el texto, ¿por qué el caso de los doce gatos es distinto de los demás ejemplos?", "f": "Párrafo (5)", "vis": "", "o": [["A", "Porque tener animales es un derecho que la comunidad nunca puede regular.", "El texto admite que, si hay daño a otros, la conducta puede regularse.", false], ["B", "Porque puede ser un asunto privado o dañar a los vecinos, según el caso.", "El párrafo (5) dice que, si están bien cuidados, «parece un asunto privado», pero si los olores o el ruido invaden otras viviendas, «empieza a haber un daño».", true], ["C", "Porque es el único que afecta la salud de quien convive con los animales.", "El texto no habla de la salud de la dueña; la diferencia está en que el daño a otros depende de las circunstancias.", false], ["D", "Porque es el único ejemplo que Mill analizó directamente en su ensayo.", "Los ejemplos son del autor del texto, no de Mill.", false]]}, {"id": "LCA-219", "niv": 3, "cp": "lc_reflexion", "cn": "", "e": "Un vecino argumenta: «Hay que prohibir que el muchacho se pinte el pelo de verde, porque a la mayoría del conjunto le parece de mal gusto». Desde la perspectiva de Mill expuesta en el texto, este argumento es débil porque", "f": "Párrafos (3) y (4)", "vis": "", "o": [["A", "el pelo verde podría afectar la salud del muchacho, y eso es lo único que debe importar.", "Para Mill, el bien de la propia persona no basta para limitar su libertad.", false], ["B", "Mill sostenía que en los asuntos de convivencia la mayoría tiene siempre la razón.", "Es lo contrario: Mill temía la presión de la opinión mayoritaria.", false], ["C", "trata como un daño lo que solo es una molestia de gusto para la mayoría.", "El párrafo (4) dice que el pelo verde no daña a nadie y solo molesta el gusto; el (3), que Mill temía la opresión de la opinión mayoritaria.", true], ["D", "solo el gobierno, y nunca la comunidad, puede prohibir conductas de las personas.", "El texto reconoce que la comunidad sí puede regular conductas que dañan a otros, como la música a medianoche.", false]]}, {"id": "LCA-220", "niv": 2, "cp": "lc_reflexion", "cn": "", "e": "El autor usa ejemplos de la vida en un conjunto residencial con el fin de", "f": "Párrafos (1), (4) y (5)", "vis": "", "o": [["A", "ridiculizar las discusiones que suelen tener los vecinos de un mismo barrio.", "El tono del texto es explicativo, no burlesco.", false], ["B", "mostrar, con casos cotidianos, el alcance y los límites del principio de Mill.", "Con esos ejemplos muestra casos en que el principio distingue con claridad (4) y uno en que no es fácil de aplicar (5).", true], ["C", "probar que el principio del daño resuelve todos los conflictos sin ninguna dificultad.", "El párrafo (5) reconoce que el principio «no siempre es fácil de aplicar».", false], ["D", "demostrar que los conjuntos residenciales necesitan reglamentos más estrictos.", "El texto no pide más reglas; incluso defiende conductas que no deben sancionarse.", false]]}]}, {"comp": "lectura_critica", "sim": "val-1", "ses": 1, "ind": "Crónica: el oficio de una recicladora", "tt": "Texto informativo", "texto": "El oficio de Gloria (crónica)\n\n(1) Son las cinco y media de la mañana y Gloria ya lleva una hora caminando. Empuja un carro de balineras por las calles de un barrio residencial y, antes de que pase el camión de la basura, revisa las bolsas que los vecinos han dejado en las esquinas. Separa el cartón, el plástico, el vidrio y el aluminio con una rapidez que solo dan los años: lleva veintidós en el oficio, el mismo que aprendió de su madre.\n\n(2) Durante mucho tiempo, su trabajo fue invisible. Para la mayoría, Gloria era alguien que «escarbaba la basura». Nadie pensaba que, gracias a ella y a miles de personas como ella, toneladas de materiales volvían a las fábricas en lugar de terminar en un relleno sanitario. Ese aporte no tenía nombre ni pago: Gloria vivía de lo que le daban las bodegas por kilo de material, a precios que ella no podía negociar.\n\n(3) Las cosas empezaron a cambiar por la presión de las propias organizaciones de recicladores. Desde 2003, la Corte Constitucional ha reconocido en varias decisiones a los recicladores de oficio como sujetos de especial protección y ha exigido acciones afirmativas en su favor. En 2016, el Gobierno nacional expidió el Decreto 596, que reglamentó la actividad de aprovechamiento dentro del servicio público de aseo y el proceso para que las organizaciones de recicladores se formalicen como prestadoras de ese servicio, lo que les permite recibir una remuneración a través de la tarifa de aseo.\n\n(4) Gloria hoy pertenece a una asociación del barrio. Lleva un chaleco con su nombre, tiene un horario y una ruta asignados, y cada mes recibe un pago que, aunque modesto, ya no depende solo de lo que diga la bodega. «Lo que más me cambió no fue la plata», dice. «Fue que ahora la gente me saluda».\n\n(5) Sin embargo, el reconocimiento legal no lo resuelve todo. Gloria cuenta que muchas familias todavía mezclan los restos de comida con el papel y el cartón, y que ese material, una vez mojado y sucio, ya no sirve. «La ley me reconoce a mí», dice mientras amarra un fardo de cartón, «pero el reciclaje empieza en la cocina de cada casa».", "vis": "", "items": [{"id": "LCA-221", "niv": 1, "cp": "lc_local", "cn": "", "e": "Según el párrafo (2), antes de pertenecer a la asociación, Gloria obtenía sus ingresos de", "f": "Párrafo (2)", "vis": "", "o": [["A", "el precio que le daban las bodegas por el material que llevaba.", "El texto dice que «vivía de lo que le daban las bodegas por kilo de material».", true], ["B", "un salario fijo que le pagaba la empresa de aseo de la ciudad.", "El texto aclara que su aporte «no tenía nombre ni pago»; no tenía salario.", false], ["C", "las propinas que le daban los vecinos del barrio residencial.", "La crónica no menciona propinas de los vecinos.", false], ["D", "una remuneración incluida en la tarifa de aseo que pagan los hogares.", "Ese pago llegó después, con la formalización de las organizaciones (párrafos 3 y 4).", false]]}, {"id": "LCA-222", "niv": 2, "cp": "lc_global", "cn": "", "e": "En la crónica, el párrafo (3) cumple la función de", "f": "Párrafo (3)", "vis": "", "o": [["A", "señalar los problemas que siguen existiendo a pesar de la ley.", "Esos problemas se plantean en el párrafo (5).", false], ["B", "presentar el testimonio de Gloria sobre los cambios en su vida.", "Los testimonios de Gloria aparecen en los párrafos (4) y (5).", false], ["C", "describir con detalle la rutina diaria de Gloria durante la madrugada en el barrio.", "La rutina se describe en el párrafo (1).", false], ["D", "explicar el marco legal que permitió el cambio en el trabajo de Gloria.", "Entre la situación anterior (2) y la actual (4), el (3) expone las decisiones de la Corte y el decreto que permitieron formalizar y remunerar a los recicladores.", true]]}, {"id": "LCA-223", "niv": 1, "cp": "lc_global", "cn": "", "e": "Según el texto, ¿qué cambió en el trabajo de Gloria al entrar a la asociación?", "f": "Párrafo (4)", "vis": "", "o": [["A", "Gana lo suficiente para dejar el reciclaje y dedicarse a otro oficio.", "El pago se describe como «modesto» y ella sigue reciclando.", false], ["B", "Dejó de recorrer las calles porque ahora trabaja dentro de una bodega.", "Sigue recorriendo las calles con una ruta asignada; no se dice que trabaje en una bodega.", false], ["C", "Tiene ruta, horario y pago mensual, y siente más reconocimiento.", "El párrafo (4) menciona el chaleco, el horario, la ruta, el pago mensual y que «ahora la gente me saluda».", true], ["D", "Ya no tiene que separar materiales porque los vecinos lo hacen por ella.", "El párrafo (5) dice que muchas familias todavía mezclan los residuos.", false]]}, {"id": "LCA-224", "niv": 3, "cp": "lc_global", "cn": "", "e": "¿Qué relación hay entre lo que dice Gloria en el párrafo (4) y lo que dice en el párrafo (5)?", "f": "Párrafos (4) y (5)", "vis": "", "o": [["A", "En el (4) critica la ley que la formalizó y en el (5) termina por defenderla.", "En ninguno de los dos critica la ley; en (5) reconoce que la ley la reconoce.", false], ["B", "Valora el reconocimiento logrado y luego advierte que no basta sin los hogares.", "En (4) destaca que ahora la saludan; en (5) señala que, aunque la ley la reconoce, el reciclaje depende de que las familias separen en casa.", true], ["C", "En ambos párrafos expresa su inconformidad con el pago mensual que recibe.", "En (4) dice que «lo que más me cambió no fue la plata»; no se queja del pago.", false], ["D", "En el (5) contradice lo que dijo en el (4), pues afirma que la gente no la respeta.", "En (5) no habla de respeto; habla de cómo las familias separan los residuos.", false]]}, {"id": "LCA-225", "niv": 2, "cp": "lc_reflexion", "cn": "", "e": "La crónica empieza con una escena del trabajo de Gloria a las cinco y media de la mañana. Con esta estrategia, el autor busca", "f": "Párrafo (1)", "vis": "", "o": [["A", "demostrar que los recicladores trabajan más horas que cualquier otro trabajador.", "El texto no compara jornadas con otros oficios.", false], ["B", "presentar el reciclaje como un oficio peligroso que debería prohibirse.", "El texto no presenta el oficio como peligroso ni propone prohibirlo; valora su aporte.", false], ["C", "criticar a los vecinos que sacan la basura a la calle durante la madrugada.", "La escena no critica a los vecinos por la hora en que sacan la basura.", false], ["D", "acercar al lector al tema a partir de la vida de una persona concreta del oficio.", "El texto parte de una escena concreta (1) y solo después presenta las decisiones judiciales y el decreto (3).", true]]}]}, {"comp": "lectura_critica", "sim": "val-1", "ses": 1, "ind": "Columna de opinión: el chat del trabajo y la desconexión laboral", "tt": "Texto informativo", "texto": "El chat que nunca duerme (columna de opinión)\n\n(1) A las diez y cuarenta de la noche, mientras mi hijo terminaba una tarea y yo lavaba los platos, sonó el celular. Era el grupo del trabajo. Mi jefe pedía «para mañana a primera hora» un informe que podía haberse pedido a las cuatro de la tarde. Nadie respondió de inmediato, pero en menos de diez minutos ya había seis mensajes de «listo, jefe», y yo, con las manos mojadas, escribí el séptimo.\n\n(2) No cuento esto para quejarme de un jefe en particular. Lo cuento porque la escena se repite en miles de hogares. Las aplicaciones de mensajería borraron la frontera física entre la oficina y la casa: el trabajo ya no se queda en el escritorio, viaja en el bolsillo. Y como cada mensaje parece pequeño, nadie siente que esté pidiendo demasiado.\n\n(3) En Colombia existe, desde 2022, una ley que reconoce el derecho a la desconexión laboral: la Ley 2191. Según esta norma, los trabajadores tienen derecho a no ser contactados por asuntos de trabajo fuera de su jornada, ni en vacaciones o descansos, y las empresas deben tener una política interna sobre el tema. La ley prevé algunas excepciones: los trabajadores de dirección, confianza y manejo; los que, por la naturaleza de su función, deben tener disponibilidad permanente, y las situaciones de fuerza mayor o caso fortuito que exijan cumplir deberes extra.\n\n(4) El problema es que una ley no cambia por sí sola una costumbre. Muchos trabajadores no reclaman ese derecho por miedo a parecer poco comprometidos, y muchos jefes escriben de noche sin pensar que están haciendo algo indebido. La desconexión, por eso, no depende solo de la norma, sino de acuerdos concretos: horarios para el chat, mensajes programados para el día siguiente, la costumbre de no esperar respuesta fuera de la jornada.\n\n(5) Esa noche le pregunté a mi hijo si sabía qué era un informe. Me dijo que sí: «Es eso que te pone brava cuando estamos comiendo». Tal vez la mejor razón para defender la desconexión no esté en ninguna norma, sino en esa respuesta.", "vis": "", "items": [{"id": "LCA-226", "niv": 1, "cp": "lc_local", "cn": "", "e": "Según el párrafo (3), la Ley 2191 de 2022 establece que", "f": "Párrafo (3)", "vis": "", "o": [["A", "hay derecho a no ser contactado por trabajo fuera de la jornada, salvo excepciones.", "El párrafo (3) dice que los trabajadores «tienen derecho a no ser contactados por asuntos de trabajo fuera de su jornada».", true], ["B", "los jefes deben pagar un recargo por cada mensaje enviado después de la jornada.", "El texto no menciona ningún recargo por mensaje.", false], ["C", "las empresas deben prohibir el uso de aplicaciones de mensajería entre sus empleados.", "La ley, según el texto, exige una política interna de desconexión, no prohibir las aplicaciones.", false], ["D", "solo los cargos de dirección y confianza tienen derecho a la desconexión.", "Es al revés: esos cargos aparecen entre las excepciones de la ley.", false]]}, {"id": "LCA-227", "niv": 2, "cp": "lc_global", "cn": "", "e": "¿Qué relación existe entre el párrafo (3) y el párrafo (4)?", "f": "Párrafos (3) y (4)", "vis": "", "o": [["A", "El (3) narra una anécdota personal y el (4) presenta los datos de la ley.", "La anécdota está en los párrafos (1) y (5); la ley se presenta en el (3).", false], ["B", "El (3) expone la ley y el (4) advierte que la ley sola no cambia costumbres.", "El (4) empieza «una ley no cambia por sí sola una costumbre» y propone acuerdos concretos además de la norma.", true], ["C", "El (4) amplía la lista de excepciones de la ley presentada en el (3).", "El (4) no habla de excepciones, sino de costumbres y acuerdos.", false], ["D", "El (4) contradice la información legal del (3) y demuestra que la ley no existe.", "El (4) no niega la existencia de la ley; señala que no basta.", false]]}, {"id": "LCA-228", "niv": 2, "cp": "lc_global", "cn": "", "e": "En el párrafo (1), el detalle de que la autora escribe «el séptimo» mensaje de «listo, jefe» muestra que ella", "f": "Párrafo (1)", "vis": "", "o": [["A", "ya tenía listo el informe desde la tarde y solo debía enviarlo.", "El texto no dice que el informe estuviera listo; dice que pudo pedirse más temprano.", false], ["B", "era la jefa del grupo y debía confirmar que todos habían leído.", "Quien pedía el informe era su jefe; ella era una más del grupo.", false], ["C", "fue la única persona del grupo que se negó a responder esa noche.", "El texto dice lo contrario: ella escribió el séptimo mensaje de aceptación.", false], ["D", "también terminó haciendo lo mismo que los demás, aunque lo critica.", "Aunque cuestiona la práctica, ella respondió como los otros seis, con las manos mojadas y a deshoras.", true]]}, {"id": "LCA-229", "niv": 2, "cp": "lc_reflexion", "cn": "", "e": "¿Con qué intención cierra la autora la columna con la respuesta de su hijo?", "f": "Párrafo (5)", "vis": "", "o": [["A", "Demostrar que los niños entienden mejor las leyes laborales que los adultos.", "El hijo no habla de leyes; describe lo que ve en casa.", false], ["B", "Burlarse de la ignorancia de su hijo sobre lo que es un informe de trabajo.", "La autora no se burla; toma la respuesta como un argumento serio.", false], ["C", "Mostrar que la falta de desconexión también afecta la vida familiar.", "La resp
