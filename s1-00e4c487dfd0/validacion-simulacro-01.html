uesta del niño («eso que te pone brava cuando estamos comiendo») muestra el efecto en la familia, y la autora dice que esa es quizá «la mejor razón».", true], ["D", "Reconocer que se equivocó al criticar a su jefe por escribir de noche.", "La autora no se retracta; al contrario, refuerza su defensa de la desconexión.", false]]}, {"id": "LCA-230", "niv": 3, "cp": "lc_reflexion", "cn": "", "e": "La autora afirma que «como cada mensaje parece pequeño, nadie siente que esté pidiendo demasiado». ¿Cuál de las siguientes situaciones ilustra mejor esa idea?", "f": "Párrafo (2)", "vis": "", "o": [["A", "Una supervisora envía cada noche una pregunta «rápida» sin notar cuánto suman.", "Cada pregunta parece mínima, pero juntas ocupan mucho tiempo de descanso: es justo lo que describe la frase.", true], ["B", "Una empresa prohíbe a sus jefes escribir en el chat del grupo después de las seis.", "Es una medida contra el problema, no un ejemplo de la idea que describe la frase.", false], ["C", "Un empleado trabaja un sábado por la mañana y recibe el pago de sus horas extra.", "Es trabajo fuera de la jornada, pero acordado y pagado; no ilustra la acumulación de pequeños mensajes.", false], ["D", "Un jefe llama a medianoche por una emergencia real en la planta, sin otra salida.", "Es una situación de urgencia, cercana a las excepciones que la ley admite; además, no es un mensaje «pequeño» repetido.", false]]}]}, {"comp": "lectura_critica", "sim": "val-1", "ses": 1, "ind": "Historieta: un padre, su hija y el celular", "tt": "Caricatura o cómic", "texto": "Historieta: «Horas extra»\n\nViñeta 1: De noche, un padre llega a la casa con overol de trabajo y cara de cansancio. El reloj de la pared marca las 9:30. Su hija pequeña lo espera en la puerta con una hoja en la mano.\n\nViñeta 2: El padre está sentado en el sofá, mirando el celular. En la pantalla se lee: «Grupo Turno Planta – 23 mensajes nuevos». La niña le muestra un dibujo. Él dice, sin levantar la vista: «Qué lindo, mi amor. Mañana lo miro bien».\n\nViñeta 3: La niña, sola en su cuarto, sigue dibujando sobre la misma hoja. No hay diálogo.\n\nViñeta 4: A la mañana siguiente, el padre encuentra el dibujo pegado en la nevera. Muestra a una familia de tres personas; la figura del papá tiene un celular en lugar de cara. Debajo, con letra infantil, dice: «Mi familia». El padre tiene los ojos muy abiertos y la taza de café detenida a medio camino.", "vis": "", "items": [{"id": "LCA-231", "niv": 1, "cp": "lc_local", "cn": "", "e": "En la viñeta 2, ¿qué le promete el padre a su hija?", "f": "Viñeta 2", "vis": "", "o": [["A", "Pegar el dibujo en la nevera esa misma noche.", "El padre no menciona la nevera; el dibujo aparece pegado a la mañana siguiente, sin que se diga quién lo pegó.", false], ["B", "Dibujar con ella cuando termine de leer los mensajes.", "El padre no propone dibujar juntos.", false], ["C", "Llevarla al otro día a comprar colores nuevos.", "El padre no promete ninguna compra.", false], ["D", "Mirar el dibujo con atención al día siguiente.", "El padre dice: «Mañana lo miro bien».", true]]}, {"id": "LCA-232", "niv": 1, "cp": "lc_global", "cn": "", "e": "¿Qué se puede inferir de las viñetas 3 y 4?", "f": "Viñetas 3 y 4", "vis": "", "o": [["A", "Que la niña rompió el primer dibujo y por la mañana hizo uno distinto.", "La viñeta 3 dice que siguió dibujando sobre la misma hoja; nada indica que la rompiera.", false], ["B", "Que el padre, arrepentido, pegó el dibujo en la nevera antes de dormir.", "El padre «encuentra» el dibujo en la nevera por la mañana, sorprendido; no lo pegó él.", false], ["C", "Que, sola, la niña completó el dibujo mostrando cómo ve a su padre.", "En la 3 sigue dibujando «sobre la misma hoja»; en la 4 el dibujo muestra al papá con un celular en lugar de cara: así lo percibe ella.", true], ["D", "Que la mamá ayudó a la niña a terminar el dibujo durante la noche.", "En la viñeta 3 la niña está sola; la historieta no muestra a la mamá.", false]]}, {"id": "LCA-233", "niv": 3, "cp": "lc_reflexion", "cn": "", "e": "El título de la historieta, «Horas extra», se relaciona con la historia porque", "f": "Título y viñetas 2 y 4", "vis": "", "o": [["A", "sugiere que el padre, ya en casa, sigue atento a su trabajo en la planta.", "En la viñeta 2 el padre mira los mensajes del «Grupo Turno Planta» en lugar del dibujo: el trabajo invade el tiempo familiar.", true], ["B", "señala que la niña tiene tareas pendientes del colegio por hacer de noche.", "La niña dibuja por iniciativa propia; no se mencionan tareas escolares.", false], ["C", "anuncia que la familia pasará más tiempo junta al día siguiente.", "La historieta termina con la sorpresa del padre; no anuncia ese cambio.", false], ["D", "indica que el padre recibe un pago adicional que justifica no atender a su hija.", "La historieta no habla de pagos ni presenta la actitud del padre como justificada.", false]]}]}, {"comp": "lectura_critica", "sim": "val-1", "ses": 1, "ind": "Factura de servicio de acueducto (ficticia)", "tt": "Texto discontinuo", "texto": "Una familia recibe la siguiente factura de su servicio de acueducto. Al final aparece este mensaje de la empresa: «Su consumo de este mes es superior en un 50 % a su promedio. Revise posibles fugas: cierre todas las llaves y observe si el medidor sigue girando. Si encuentra una fuga, puede solicitar una revisión gratuita en nuestras oficinas».", "vis": "<table class=\"vt\"><caption>Tabla 2. Factura del servicio de acueducto (datos ficticios)<\/caption><thead><tr><th>Concepto<\/th><th>Valor<\/th><\/tr><\/thead><tbody><tr><td>Período facturado<\/td><td>1 al 30 de septiembre de 2026<\/td><\/tr><tr><td>Consumo del mes<\/td><td>18 m³<\/td><\/tr><tr><td>Consumo promedio de los últimos 6 meses<\/td><td>12 m³<\/td><\/tr><tr><td>Cargo fijo de acueducto<\/td><td>$ 9.800<\/td><\/tr><tr><td>Consumo de acueducto (18 m³ × $ 2.150)<\/td><td>$ 38.700<\/td><\/tr><tr><td>Alcantarillado<\/td><td>$ 31.500<\/td><\/tr><tr><td>Total a pagar<\/td><td>$ 80.000<\/td><\/tr><tr><td>Fecha límite de pago<\/td><td>15 de octubre de 2026<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Empresa y valores ficticios.<\/div>", "items": [{"id": "LCA-234", "niv": 1, "cp": "lc_local", "cn": "", "e": "Según los datos de la factura, ¿cuánto habría costado el concepto «Consumo de acueducto» si la familia hubiera gastado exactamente su consumo promedio?", "f": "Tabla 2 (cálculo propio)", "vis": "", "o": [["A", "$ 12.900", "Es el valor de los 6 m³ de diferencia entre el consumo del mes y el promedio (6 × 2.150), no del consumo promedio.", false], ["B", "$ 25.800", "La factura cobra $ 2.150 por m³ y el promedio es 12 m³: 12 × 2.150 = 25.800.", true], ["C", "$ 35.600", "Suma al consumo promedio el cargo fijo ($ 9.800); la pregunta pide solo el concepto «Consumo de acueducto».", false], ["D", "$ 38.700", "Es el valor cobrado por los 18 m³ de este mes, no por el consumo promedio.", false]]}, {"id": "LCA-235", "niv": 2, "cp": "lc_global", "cn": "", "e": "La empresa afirma que el consumo del mes es «superior en un 50 % a su promedio». Esta afirmación se basa en la relación entre", "f": "Tabla 2 (cálculo propio)", "vis": "", "o": [["A", "el consumo del mes y el precio de cada metro cúbico de agua.", "El precio por m³ ($ 2.150) sirve para calcular el valor del consumo, no para compararlo con el promedio.", false], ["B", "el valor del consumo de acueducto y el valor que se cobra por el alcantarillado.", "Son valores en pesos de dos conceptos distintos; no se comparan con el promedio de consumo.", false], ["C", "los 18 m³ del mes y el promedio de 12 m³ de los últimos seis meses.", "18 m³ es 1,5 veces 12 m³: el consumo del mes supera el promedio en 6 m³, es decir, en un 50 %.", true], ["D", "el cargo fijo del acueducto y el total a pagar en la factura.", "El cargo fijo no depende del consumo y no sirve para calcular el aumento.", false]]}, {"id": "LCA-236", "niv": 3, "cp": "lc_reflexion", "cn": "", "e": "Una usuaria lee el mensaje y concluye: «La empresa me está acusando de desperdiciar agua». ¿Es adecuada esta interpretación?", "f": "Mensaje de la empresa y Tabla 2", "vis": "", "o": [["A", "No, porque el mensaje informa un aumento y sugiere buscar fugas, sin culpar a nadie.", "El mensaje solo compara el consumo con el promedio y recomienda revisar posibles fugas; no atribuye el aumento a un mal uso.", true], ["B", "No, porque el mensaje indica que el medidor de la vivienda está dañado.", "El mensaje no dice que el medidor esté dañado; pide observar si sigue girando con las llaves cerradas.", false], ["C", "Sí, porque la empresa afirma que la usuaria consumió el doble de su promedio habitual.", "El aumento es del 50 %, no del doble; y la empresa no lo atribuye a desperdicio.", false], ["D", "Sí, porque el mensaje le exige pagar una multa por el exceso de consumo del mes.", "La factura no incluye ninguna multa: solo cargo fijo, consumo y alcantarillado.", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "val-1", "ses": 1, "ind": "Reporte en una central de riesgo", "tt": "", "texto": "Lucía pagó hace un año la totalidad de un crédito de una tienda de electrodomésticos. Sin embargo, cuando solicitó un préstamo en un banco, se lo negaron porque en una base de datos financiera todavía aparece como deudora morosa.", "vis": "", "items": [{"id": "SCA-203", "niv": 2, "cp": "sc_pensamiento_social", "cn": "", "e": "¿Qué derecho constitucional respalda a Lucía para exigir que se corrija esa información?", "f": "Constitución Política de Colombia, art. 15.", "vis": "", "o": [["A", "El derecho a la libertad de cultos.", "La libertad de cultos protege las creencias religiosas; no tiene relación con un reporte financiero.", false], ["B", "El derecho a actualizar y rectificar sus datos personales.", "Correcta. El artículo 15 de la Constitución reconoce a todas las personas el derecho a conocer, actualizar y rectificar las informaciones que se hayan recogido sobre ellas en bancos de datos y archivos públicos y privados (habeas data).", true], ["C", "El derecho a presentar proyectos de ley ante el Congreso de la República.", "La iniciativa legislativa sirve para proponer leyes; no corrige la información de una persona en una base de datos.", false], ["D", "El derecho a la libre competencia económica entre la tienda y el banco.", "La libre competencia es un interés colectivo del mercado; no se relaciona con la corrección de un dato personal.", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "val-1", "ses": 1, "ind": "Captura ilegal", "tt": "", "texto": "Un vendedor ambulante fue llevado a una estación de policía y permanece allí desde hace dos días. No hay orden de un juez en su contra ni lo han acusado de ningún delito. Su hermana quiere que un juez revise de inmediato si su detención es legal.", "vis": "", "items": [{"id": "SCA-204", "niv": 1, "cp": "sc_pensamiento_social", "cn": "", "e": "¿Qué mecanismo constitucional protege específicamente a quien cree estar privado de su libertad de manera ilegal?", "f": "Constitución Política de Colombia, art. 30.", "vis": "", "o": [["A", "El plebiscito.", "El plebiscito es un mecanismo de participación para que el pueblo apoye o rechace una decisión del Ejecutivo; no protege a una persona detenida.", false], ["B", "La acción de cumplimiento.", "La acción de cumplimiento busca que una autoridad cumpla una ley o un acto administrativo; no es el mecanismo específico frente a una detención ilegal.", false], ["C", "La revocatoria del mandato.", "La revocatoria retira del cargo a gobernadores o alcaldes; no resuelve la situación de una persona detenida.", false], ["D", "El habeas corpus.", "Correcta. Según el artículo 30, quien estuviere privado de su libertad y creyere estarlo ilegalmente puede invocar el habeas corpus ante cualquier autoridad judicial, y debe resolverse en treinta y seis horas.", true]]}]}, {"comp": "sociales_ciudadanas", "sim": "val-1", "ses": 1, "ind": "Abolición de la esclavitud en la Nueva Granada", "tt": "", "texto": "En el siglo XIX, el Congreso expidió una ley que declaró libres a todas las personas esclavizadas del territorio de la República. La libertad no sería inmediata: empezaría a regir el primer día del año siguiente al de la expedición de la ley. Para compensar a los antiguos propietarios, el Estado les entregaría unos vales de manumisión que iría pagando poco a poco.\n\nCarta ficticia de un hacendado, fechada en junio de 1851, pocas semanas después de expedida la ley: «No me opongo a la libertad que la ley proclama, pero exijo que el Estado me pague sin demora el valor de mis esclavos. Sin brazos para las minas y las haciendas, nuestra provincia quedará en la ruina».", "vis": "", "items": [{"id": "SCA-205", "niv": 2, "cp": "sc_pensamiento_social", "cn": "", "e": "Con base en el caso y en lo que sabe de la historia de Colombia, ¿cuál afirmación sobre esta ley es correcta?", "f": "Archivo General de la Nación, exposición «La esclavitud en Colombia»; Ley 2 de 1851 (Función Pública, Gestor Normativo).", "vis": "", "o": [["A", "Se expidió en 1851, bajo el gobierno de Tomás Cipriano de Mosquera, y rigió desde 1852.", "En 1851 el presidente era José Hilario López (1849-1853), quien sancionó la ley; Mosquera gobernó en otros períodos.", false], ["B", "Se expidió en 1851, bajo el gobierno de José Hilario López, y rigió desde 1852, salvo en las minas del Pacífico.", "La ley declaró libres a todas las personas esclavizadas del territorio de la República desde el 1 de enero de 1852; no exceptuó las minas del Pacífico.", false], ["C", "Se expidió en 1851, bajo el gobierno de Rafael Núñez, y rigió desde 1852.", "Rafael Núñez gobernó en las décadas de 1880 y 1890 (la Regeneración); en 1851 el presidente era José Hilario López.", false], ["D", "Se expidió en 1851, bajo el gobierno de José Hilario López, y rigió desde 1852.", "Correcta. La ley del 21 de mayo de 1851, sancionada por el presidente José Hilario López, dispuso que desde el 1 de enero de 1852 serían libres todos los esclavos del territorio de la República.", true]]}, {"id": "SCA-206", "niv": 3, "cp": "sc_perspectivas", "cn": "", "e": "¿Qué interés defiende principalmente el autor de la carta?", "f": "Fuente primaria ficticia; contexto: Ley de 1851 y vales de manumisión (Archivo General de la Nación).", "vis": "", "o": [["A", "Recibir pronto la compensación económica por las personas esclavizadas que perdía.", "Correcta. El hacendado dice no oponerse a la libertad, pero exige que el Estado le pague «sin demora» el valor de sus esclavos: su interés central es la compensación económica.", true], ["B", "Que el Estado le asigne trabajadores libres para sus minas y haciendas.", "El hacendado menciona la falta de «brazos», pero lo que exige expresamente es que el Estado le pague sin demora; no pide que le asignen trabajadores.", false], ["C", "Conseguir que el Estado invierta en escuelas para las familias recién liberadas.", "El texto no trata de educación; el autor se preocupa por su pago y por la falta de mano de obra.", false], ["D", "Lograr que los libertos reciban tierras.", "La carta no menciona tierras para los libertos; habla de los intereses del propietario.", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "val-1", "ses": 1, "ind": "El voto de las mujeres en Colombia", "tt": "", "texto": "Durante buena parte de su historia republicana, las mujeres colombianas no pudieron votar en las elecciones nacionales. El derecho a elegir y ser elegidas se les reconoció mediante el Acto Legislativo 3 de 1954, expedido durante el gobierno de Gustavo Rojas Pinilla, que no convocó elecciones en los años siguientes.", "vis": "", "items": [{"id": "SCA-207", "niv": 1, "cp": "sc_pensamiento_social", "cn": "", "e": "¿En qué votación nacional acudieron las mujeres colombianas a las urnas por primera vez?", "f": "Registraduría Nacional del Estado Civil, «Cronología del voto en Colombia»; Centro Nacional de Memoria Histórica (2023).", "vis": "", "o": [["A", "En la votación de 1990 para convocar la Asamblea Constituyente.", "La consulta de 1990 es muy posterior; para entonces las mujeres ya votaban desde hacía más de tres décadas.", false], ["B", "En la elección presidencial de 1958, que ganó Alberto Lleras Camargo.", "La elección de Alberto Lleras Camargo (1958) fue posterior al plebiscito de 1957, que fue la primera votación de las mujeres.", false], ["C", "En el plebiscito del 1 de diciembre de 1957.", "Correcta. Según la Registraduría Nacional, el 1 de diciembre de 1957 las mujeres votaron por primera vez, en el plebiscito que aprobó la reforma que dio origen al Frente Nacional.", true], ["D", "En las elecciones de Congreso de 1958.", "Las elecciones de 1958 fueron posteriores al plebiscito del 1 de diciembre de 1957, en el que las mujeres ya habían votado.", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "val-1", "ses": 1, "ind": "Origen de la Constitución de 1991", "tt": "", "texto": "A finales de los años ochenta, Colombia vivía una profunda crisis: varios candidatos presidenciales fueron asesinados y crecía la desconfianza en las instituciones. En las elecciones del 11 de marzo de 1990, un movimiento impulsado por estudiantes promovió depositar un voto adicional, no oficial, para pedir cambios institucionales de fondo.", "vis": "", "items": [{"id": "SCA-208", "niv": 2, "cp": "sc_pensamiento_social", "cn": "", "e": "¿Cuál fue la consecuencia más importante de ese movimiento?", "f": "BBC Mundo (2020) y Corte Constitucional (2024) sobre la séptima papeleta; Constitución Política de 1991.", "vis": "", "o": [["A", "Llevó a convocar una Asamblea Constituyente que se limitó a reformar algunos artículos de la Constitución de 1886.", "La Asamblea Nacional Constituyente no se limitó a reformar la Constitución de 1886: expidió una nueva Constitución en 1991.", false], ["B", "Abrió el camino para convocar la Asamblea Nacional Constituyente que expidió la Constitución de 1991.", "Correcta. La llamada «séptima papeleta» creó un hecho político que llevó a consultar oficialmente al pueblo en mayo de 1990 y a convocar la Asamblea Nacional Constituyente, que expidió la Constitución de 1991.", true], ["C", "Llevó a que el Congreso expidiera en 1991 una reforma de la Constitución de 1886 mediante un acto legislativo.", "La nueva Constitución no la expidió el Congreso mediante un acto legislativo, sino la Asamblea Nacional Constituyente.", false], ["D", "Logró que la Registraduría contara oficialmente, en marzo de 1990, los votos de esa papeleta.", "La Registraduría no contó oficialmente esa papeleta, porque no era una votación reglada; el conteo oficial llegó con la consulta de mayo de 1990, autorizada por decreto.", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "val-1", "ses": 1, "ind": "Ingresos y nivel educativo", "tt": "", "texto": "Una fundación encuestó a 300 trabajadores de una ciudad y calculó su ingreso mensual promedio según el último nivel educativo que terminaron. La gráfica muestra los resultados (datos ficticios, en miles de pesos).", "vis": "<div class=\"vfig\"><svg class=\"vg\" viewBox=\"0 0 560 320\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Gráfica 6. Ingreso mensual promedio según nivel educativo (miles de pesos)\" font-family=\"Arial, sans-serif\" font-size=\"12\"><rect width=\"560\" height=\"320\" fill=\"#ffffff\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"13\" fill=\"#1d2433\">Gráfica 6. Ingreso mensual promedio según nivel educativo (miles de pesos)<\/text><line x1=\"60\" y1=\"258.0\" x2=\"540\" y2=\"258.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"262.0\" text-anchor=\"end\" fill=\"#3a4356\">0<\/text><line x1=\"60\" y1=\"213.6\" x2=\"540\" y2=\"213.6\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"217.6\" text-anchor=\"end\" fill=\"#3a4356\">1.000<\/text><line x1=\"60\" y1=\"169.2\" x2=\"540\" y2=\"169.2\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"173.2\" text-anchor=\"end\" fill=\"#3a4356\">2.000<\/text><line x1=\"60\" y1=\"124.8\" x2=\"540\" y2=\"124.8\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"128.8\" text-anchor=\"end\" fill=\"#3a4356\">3.000<\/text><line x1=\"60\" y1=\"80.4\" x2=\"540\" y2=\"80.4\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"84.4\" text-anchor=\"end\" fill=\"#3a4356\">4.000<\/text><line x1=\"60\" y1=\"36.0\" x2=\"540\" y2=\"36.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"40.0\" text-anchor=\"end\" fill=\"#3a4356\">5.000<\/text><line x1=\"60\" y1=\"258\" x2=\"540\" y2=\"258\" stroke=\"#3a4356\"/><line x1=\"60\" y1=\"258\" x2=\"60\" y2=\"36\" stroke=\"#3a4356\"/><text transform=\"translate(14,147.0) rotate(-90)\" text-anchor=\"middle\" fill=\"#3a4356\">Miles de pesos<\/text><text x=\"300.0\" y=\"312\" text-anchor=\"middle\" fill=\"#3a4356\">Último nivel terminado<\/text><text x=\"120.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Primaria<\/text><text x=\"240.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Bachillerato<\/text><text x=\"360.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Técnico o tecnólogo<\/text><text x=\"480.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Universitario<\/text><rect x=\"78.0\" y=\"200.3\" width=\"84.0\" height=\"57.7\" fill=\"#1660a8\"/><text x=\"120.0\" y=\"196.3\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">1.300<\/text><rect x=\"198.0\" y=\"182.5\" width=\"84.0\" height=\"75.5\" fill=\"#1660a8\"/><text x=\"240.0\" y=\"178.5\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">1.700<\/text><rect x=\"318.0\" y=\"155.9\" width=\"84.0\" height=\"102.1\" fill=\"#1660a8\"/><text x=\"360.0\" y=\"151.9\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">2.300<\/text><rect x=\"438.0\" y=\"71.5\" width=\"84.0\" height=\"186.5\" fill=\"#1660a8\"/><text x=\"480.0\" y=\"67.5\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">4.200<\/text><\/svg><\/div>", "items": [{"id": "SCA-212", "niv": 2, "cp": "sc_perspectivas", "cn": "", "e": "Según la gráfica, ¿cuál es la diferencia entre el ingreso promedio de quienes terminaron un técnico o tecnólogo y el de quienes terminaron el bachillerato?", "f": "Lectura de la gráfica y cálculo propio (datos ficticios).", "vis": "", "o": [["A", "$ 400.000.", "Esta es la diferencia entre bachillerato ($ 1.700.000) y primaria ($ 1.300.000), no la que se pregunta.", false], ["B", "$ 600.000.", "Correcta. Técnico o tecnólogo: $ 2.300.000; bachillerato: $ 1.700.000. La diferencia es 2.300 − 1.700 = 600 miles de pesos, es decir, $ 600.000.", true], ["C", "$ 1.000.000.", "Esta es la diferencia entre técnico o tecnólogo y primaria; se tomó un nivel equivocado.", false], ["D", "$ 1.900.000.", "Esta es la diferencia entre universitario ($ 4.200.000) y técnico o tecnólogo; se leyó otra barra.", false]]}, {"id": "SCA-213", "niv": 3, "cp": "sc_perspectivas", "cn": "", "e": "Un aviso publicitario de una institución educativa dice: «Estudia con nosotros: la gráfica demuestra que estudiar más hace que cualquier persona gane más». ¿Por qué esta afirmación va más allá de lo que muestran los datos?", "f": "Análisis crítico de fuentes: correlación y causalidad.", "vis": "", "o": [["A", "Porque los ingresos aparecen en miles de pesos y no en pesos.", "La unidad de medida no cambia la comparación entre niveles; el problema del aviso es atribuir una causa a partir de promedios.", false], ["B", "Porque la gráfica muestra que quienes estudian más ganan menos que quienes solo terminaron primaria.", "La gráfica muestra lo contrario: el promedio sube con el nivel educativo.", false], ["C", "Porque la diferencia entre bachillerato y primaria es mayor que entre técnico y bachillerato.", "Es falso según la gráfica (400 frente a 600 miles de pesos) y, en todo caso, no tiene relación con el problema del aviso.", false], ["D", "Porque asociar estudio e ingresos no prueba que el estudio cause más ingreso en cada persona.", "Correcta. La gráfica muestra promedios asociados a niveles educativos; otros factores (sector, experiencia, contactos, región) pueden influir, y un promedio no garantiza lo que pasará con «cualquier persona».", true]]}]}, {"comp": "sociales_ciudadanas", "sim": "val-1", "ses": 1, "ind": "Impuesto a las bebidas azucaradas", "tt": "", "texto": "Un país estudia cobrar un impuesto especial a las gaseosas y otras bebidas con mucho azúcar.\n\nAsociación médica: «El consumo excesivo de azúcar se asocia con obesidad y diabetes. Si estas bebidas cuestan más, la gente comprará menos».\n\nGremio de tenderos: «Las gaseosas son de lo que más vendemos. Si suben de precio, nuestras ventas caerán».\n\nMinisterio de Hacienda: «Lo que se recaude podría destinarse a programas de salud».", "vis": "", "items": [{"id": "SCA-220", "niv": 1, "cp": "sc_perspectivas", "cn": "", "e": "¿Qué supuesto comparten la asociación médica y el gremio de tenderos?", "f": "Análisis de las posiciones del caso.", "vis": "", "o": [["A", "Que si las bebidas suben de precio, la gente comprará menos.", "Correcta. La asociación médica espera que la gente compre menos si las bebidas cuestan más, y los tenderos temen que sus ventas caigan si suben de precio: ambos suponen que el precio más alto reduce las compras.", true], ["B", "Que las gaseosas son el producto que más venden las tiendas.", "Eso lo afirman solo los tenderos; la asociación médica no habla de lo que venden las tiendas.", false], ["C", "Que el impuesto mejorará la salud de los consumidores.", "Esa expectativa es de la asociación médica; los tenderos no hablan de salud.", false], ["D", "Que el recaudo debe destinarse a programas de salud.", "Esa idea la plantea el Ministerio de Hacienda, no la asociación médica ni los tenderos.", false]]}, {"id": "SCA-221", "niv": 1, "cp": "sc_reflexivo_sistemico", "cn": "", "e": "¿Qué dimensión del problema sustenta principalmente la propuesta, según la asociación médica?", "f": "Análisis de dimensiones de una medida pública.", "vis": "", "o": [["A", "El recaudo fiscal.", "El recaudo lo menciona el Ministerio de Hacienda, no la asociación médica.", false], ["B", "El empleo en las tiendas.", "Ni la asociación médica ni otro actor del caso hablan del empleo en las tiendas.", false], ["C", "La salud pública.", "Correcta. La asociación médica justifica el impuesto por la relación entre el consumo excesivo de azúcar, la obesidad y la diabetes.", true], ["D", "Las ventas del comercio.", "Las ventas son la preocupación de los tenderos, no el argumento de la asociación médica.", false]]}, {"id": "SCA-222", "niv": 3, "cp": "sc_reflexivo_sistemico", "cn": "", "e": "Si el impuesto se aprueba y funciona como espera la asociación médica, ¿qué tensión entre sus efectos es esperable?", "f": "Análisis de efectos contrapuestos de una política pública.", "vis": "", "o": [["A", "Aumentaría el recaudo del Ministerio, y por eso subiría también el consumo de bebidas.", "El recaudo no hace subir el consumo; si el impuesto funciona como espera la asociación médica, el consumo baja.", false], ["B", "Bajaría el consumo de azúcar y, al mismo tiempo, aumentarían las ventas de los tenderos.", "Si la gente compra menos bebidas, las ventas de los tenderos tienden a bajar, no a subir; no hay tensión sino una contradicción.", false], ["C", "Bajaría el consumo de azúcar, pero el recaudo sería menor que si el consumo no cambiara.", "Correcta. Si la gente compra menos bebidas, se logra el objetivo de salud, pero se venden menos unidades gravadas y el recaudo es menor que si el consumo no cambiara: los dos objetivos tiran en direcciones distintas.", true], ["D", "Subiría el precio de las bebidas, pero los tenderos venderían más unidades que antes.", "Con precios más altos, la gente compra menos unidades, según esperan tanto la asociación médica como los tenderos.", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "val-1", "ses": 1, "ind": "Ramas del poder público", "tt": "", "texto": "En una capacitación para líderes comunales, la facilitadora explica que el poder público en Colombia se divide en ramas con funciones separadas que colaboran entre sí, y que además existen órganos autónomos e independientes.", "vis": "", "items": [{"id": "SCA-225", "niv": 1, "cp": "sc_pensamiento_social", "cn": "", "e": "¿A qué rama del poder público le corresponde principalmente hacer las leyes?", "f": "Constitución Política de Colombia, arts. 113, 114 y 150.", "vis": "", "o": [["A", "A la rama legislativa, por medio del Congreso.", "Correcta. Según los artículos 114 y 150 de la Constitución, corresponde al Congreso de la República hacer las leyes; el Congreso integra la rama legislativa.", true], ["B", "A los órganos de control, por medio de la Contraloría.", "La Contraloría vigila la gestión fiscal (art. 119); no hace leyes.", false], ["C", "A la rama ejecutiva, por medio de los ministerios.", "La rama ejecutiva gobierna y ejecuta las leyes; los ministerios pueden presentar proyectos, pero no aprueban las leyes.", false], ["D", "A la rama judicial, por medio de los jueces.", "Los jueces aplican las leyes a casos concretos; no las expiden.", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "val-1", "ses": 1, "ind": "Organización de las Naciones Unidas", "tt": "", "texto": "Al terminar la Segunda Guerra Mundial, que dejó millones de muertos y reveló crímenes masivos contra poblaciones civiles, varios Estados crearon la Organización de las Naciones Unidas (ONU). Pocos años después, su Asamblea General aprobó la Declaración Universal de Derechos Humanos.", "vis": "", "items": [{"id": "SCA-231", "niv": 2, "cp": "sc_pensamiento_social", "cn": "", "e": "¿Qué relación hay entre la Segunda Guerra Mundial y estos hechos?", "f": "Historia universal: fundación de la ONU (1945) y Declaración Universal de Derechos Humanos (1948).", "vis": "", "o": [["A", "La Declaración fue el tratado con el que se dividió Alemania entre las potencias vencedoras.", "La Declaración Universal de Derechos Humanos no es un tratado de división territorial; proclama derechos de todas las personas.", false], ["B", "La guerra llevó a crear instituciones para mantener la paz y proteger los derechos humanos.", "Correcta. La ONU se fundó en 1945 con el propósito de mantener la paz y la seguridad internacionales, y en 1948 su Asamblea General aprobó la Declaración Universal de Derechos Humanos, como respuesta a los horrores de la guerra.", true], ["C", "La ONU y la Declaración se crearon antes de la guerra para evitar que estallara.", "La ONU se creó en 1945 y la Declaración se aprobó en 1948, ambas después de la guerra (1939-1945).", false], ["D", "La guerra hizo desaparecer las organizaciones internacionales y desde entonces no se han creado otras.", "Ocurrió lo contrario: después de la guerra se creó la ONU.", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "val-1", "ses": 1, "ind": "Reglas sobre mascotas en un conjunto residencial", "tt": "", "texto": "La asamblea de copropietarios de un conjunto residencial discute una nueva regla sobre las mascotas.\n\nPropietaria con perro: «Mi perro es parte de mi familia. Recojo sus desechos y lo saco con traílla. No es justo que se prohíba tenerlo».\n\nPropietario de la torre 3: «Hay vecinos que no recogen los desechos y los perros ladran de noche. No pido que se prohíban, pido que se cumplan normas».\n\nAdministradora: «Propongo multar a quien no recoja los desechos y crear una zona para mascotas en el parque del conjunto».", "vis": "", "items": [{"id": "SCA-234", "niv": 1, "cp": "sc_perspectivas", "cn": "", "e": "¿En qué coinciden la propietaria con perro y el propietario de la torre 3?", "f": "Comparación de perspectivas de actores.", "vis": "", "o": [["A", "En que los perros del conjunto ladran de noche.", "Solo el propietario de la torre 3 se queja de los ladridos.", false], ["B", "En que se debe multar a todos los dueños de perros.", "La multa la propone la administradora y solo para quien no recoja los desechos.", false], ["C", "En que todos los vecinos recogen los desechos.", "El propietario de la torre 3 afirma que hay vecinos que no los recogen.", false], ["D", "En que no es necesario prohibir las mascotas en el conjunto.", "Correcta. La propietaria dice que no es justo prohibirlas y el propietario de la torre 3 aclara que no pide que se prohíban, sino que se cumplan normas.", true]]}, {"id": "SCA-235", "niv": 2, "cp": "sc_perspectivas", "cn": "", "e": "¿Por qué es probable que la propuesta de la administradora sea aceptada por los dos propietarios?", "f": "Relación entre perspectivas y propuestas de solución.", "vis": "", "o": [["A", "Porque elimina por completo los ladridos de los perros durante la noche.", "La propuesta no trata los ladridos; además, nada garantiza que los elimine.", false], ["B", "Porque prohíbe tener perros en las torres pero los permite en el parque.", "La administradora no propone prohibir perros en las torres; propone multas y una zona para mascotas.", false], ["C", "Porque sanciona las conductas que molestan sin prohibir tener mascotas.", "Correcta. La multa ataca el problema que señala el propietario de la torre 3 (desechos sin recoger) y la propuesta no prohíbe las mascotas, que es lo que defiende la propietaria.", true], ["D", "Porque obliga a la propietaria con perro a pagar una multa mensual fija.", "La multa es solo para quien no recoja los desechos, y la propietaria dice que sí los recoge.", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "val-1", "ses": 1, "ind": "Columnas sobre trabajadores migrantes", "tt": "", "texto": "Columna A (ficticia): «Desde que llegaron los migrantes, el barrio se volvió inseguro. La semana pasada robaron una tienda y dicen que el ladrón tenía acento extranjero. Ellos vienen a quitarnos el trabajo y a delinquir».\n\nColumna B (ficticia): «Según la encuesta de la cámara de comercio local, el 70 % de los migrantes del municipio trabaja en la construcción y en el campo, oficios en los que los empleadores reportaban falta de mano de obra. Aun así, hay que vigilar que no se les pague menos que a los demás».", "vis": "", "items": [{"id": "SCA-236", "niv": 2, "cp": "sc_perspectivas", "cn": "", "e": "¿Qué problema tiene el razonamiento de la columna A?", "f": "Análisis de argumentos: prejuicios y generalizaciones.", "vis": "", "o": [["A", "Reconoce que los migrantes ocupan empleos en los que faltaban trabajadores.", "Eso lo dice la columna B, no la A.", false], ["B", "Atribuye a todo un grupo la conducta de una persona, con base en un rumor.", "Correcta. La columna pasa de un robo cuyo autor solo «dicen» que tenía acento extranjero a afirmar que los migrantes en general vienen a delinquir: es una generalización basada en un rumor, que expresa un prejuicio.", true], ["C", "Usa estadísticas de una encuesta que no corresponden al municipio estudiado.", "La columna A no presenta estadísticas; quien cita una encuesta es la columna B.", false], ["D", "Defiende que a los migrantes se les pague lo mismo que a los demás trabajadores.", "Esa preocupación aparece en la columna B; la A no la plantea.", false]]}, {"id": "SCA-237", "niv": 3, "cp": "sc_perspectivas", "cn": "", "e": "¿Qué efecto podría tener la columna A en los lectores del barrio?", "f": "Análisis del efecto de un discurso en grupos sociales.", "vis": "", "o": [["A", "Fomentar que los lectores verifiquen con datos oficiales si la inseguridad aumentó.", "La columna A no ofrece datos ni invita a verificarlos; da por cierto un rumor, lo que favorece la desconfianza más que la verificación.", false], ["B", "Fomentar que los empleadores contraten a más migrantes por su experiencia laboral.", "La columna A presenta a los migrantes como una amenaza; es poco probable que anime a contratarlos. La idea de la mano de obra aparece en la columna B.", false], ["C", "Fomentar una investigación judicial seria sobre el robo de la tienda del barrio.", "La columna no pide una investigación; da por cierto un rumor y lo generaliza.", false], ["D", "Fomentar la desconfianza y el rechazo hacia las personas migrantes en general.", "Correcta. Al presentar a los migrantes como un grupo que viene a «delinquir», el texto puede generar desconfianza y rechazo hacia todos ellos, sin que haya pruebas de que sea así.", true]]}]}, {"comp": "sociales_ciudadanas", "sim": "val-1", "ses": 1, "ind": "Publicidad electoral", "tt": "", "texto": "Valla ficticia de un candidato a la alcaldía: «O votas por Ramírez, o el municipio se hundirá en el caos. No hay otra opción».", "vis": "", "items": [{"id": "SCA-238", "niv": 3, "cp": "sc_perspectivas", "cn": "", "e": "¿Qué estrategia usa la valla para convencer a los votantes?", "f": "Análisis de argumentos: falso dilema.", "vis": "", "o": [["A", "Plantea solo dos posibilidades extremas, como si no existieran otras alternativas.", "Correcta. La valla presenta un falso dilema: votar por Ramírez o el caos, ignorando que hay otros candidatos y otros resultados posibles.", true], ["B", "Reconoce las fortalezas de los otros candidatos antes de pedir el voto.", "La valla no menciona a los otros candidatos; dice que «no hay otra opción».", false], ["C", "Explica en detalle el programa de gobierno con el que Ramírez se inscribió.", "La valla no menciona ningún punto del programa.", false], ["D", "Compara con datos las propuestas de Ramírez y las de los demás candidatos.", "La valla no presenta datos ni compara propuestas.", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "val-1", "ses": 1, "ind": "Una vía terciaria para la vereda", "tt": "", "texto": "Para sacar sus productos al pueblo, los campesinos de una vereda deben cargar las mulas durante cinco horas por un camino de herradura. La gobernación anuncia que construirá una vía terciaria pavimentada que reducirá el recorrido a cuarenta minutos en carro. La vía atravesará un bosque donde nacen dos quebradas que abastecen a la vereda.", "vis": "", "items": [{"id": "SCA-239", "niv": 1, "cp": "sc_reflexivo_sistemico", "cn": "", "e": "¿Qué supuesto hay detrás de la decisión de construir la vía?", "f": "Análisis de dimensiones de una obra pública.", "vis": "", "o": [["A", "Que en el pueblo hacen falta productos agrícolas traídos de otras regiones.", "El caso no habla de escasez en el pueblo ni de productos de otras regiones; habla de la dificultad de los campesinos para llevar los suyos.", false], ["B", "Que el bosque de la vereda se recuperará solo una vez terminada la obra.", "El caso no dice nada sobre la recuperación del bosque; la vía se justifica por el transporte de los productos.", false], ["C", "Que reducir el tiempo de transporte mejorará la venta de los productos campesinos.", "Correcta. La gobernación justifica la vía porque hoy sacar los productos toma cinco horas en mula; supone que un transporte más rápido facilitará venderlos.", true], ["D", "Que los campesinos dejarán de cultivar para trabajar en el pueblo.", "El caso no plantea que la vía busque llevar a los campesinos a trabajar en el pueblo; se refiere a sacar sus productos.", false]]}, {"id": "SCA-240", "niv": 2, "cp": "sc_reflexivo_sistemico", "cn": "", "e": "Según la información del caso, ¿qué efecto no deseado podría tener la vía si se construye sin medidas de protección?", "f": "Análisis de efectos de una intervención en distintas dimensiones.", "vis": "", "o": [["A", "Disminuir la producción agrícola, porque los campesinos tendrían que pagar peajes.", "El caso no menciona peajes ni relaciona la vía con una caída de la producción.", false], ["B", "Aislar más a la vereda, porque el camino de herradura dejaría de usarse.", "Una vía que reduce el recorrido a cuarenta minutos acerca la vereda al pueblo; no la aísla.", false], ["C", "Encarecer el transporte de los productos, porque el viaje en carro cuesta más que en mula.", "El caso no da información sobre costos de transporte; el riesgo que sí se desprende del caso es el del bosque y las quebradas.", false], ["D", "Reducir el agua disponible para la vereda, aunque mejore el transporte.", "Correcta. La vía atravesaría el bosque donde nacen las dos quebradas que abastecen a la vereda; si se deteriora el bosque, puede verse afectada el agua, aunque el transporte mejore.", true]]}]}, {"comp": "sociales_ciudadanas", "sim": "val-1", "ses": 1, "ind": "Cierre de una mina de carbón", "tt": "", "texto": "En un municipio, la principal fuente de empleo es una mina de carbón que da trabajo a 600 personas. Por la caída de la demanda internacional de carbón y por compromisos para reducir emisiones de gases de efecto invernadero, la empresa anunció que cerrará la mina en cinco años.", "vis": "", "items": [{"id": "SCA-241", "niv": 2, "cp": "sc_reflexivo_sistemico", "cn": "", "e": "¿Qué relación entre dimensiones muestra el caso?", "f": "Análisis de relaciones entre dimensiones de una problemática.", "vis": "", "o": [["A", "Los compromisos ambientales obligan a la empresa a contratar más trabajadores antes del cierre.", "El caso no dice eso; los compromisos ambientales contribuyen al cierre de la principal fuente de empleo.", false], ["B", "Decisiones ambientales y del mercado mundial tienen efectos sobre el empleo local.", "Correcta. La caída de la demanda internacional y los compromisos ambientales llevan al cierre de la mina, que afectará a 600 trabajadores del municipio.", true], ["C", "El cierre se debe a que los trabajadores del municipio pidieron reducir las emisiones.", "El caso atribuye el cierre a la caída de la demanda internacional y a compromisos de reducción de emisiones; no dice que los trabajadores lo pidieran.", false], ["D", "El empleo local de la mina es la causa de la caída de la demanda internacional del carbón.", "La relación está invertida: la demanda internacional afecta a la mina, no al revés.", false]]}, {"id": "SCA-242", "niv": 3, "cp": "sc_reflexivo_sistemico", "cn": "", "e": "La alcaldía quiere preparar un plan para los cinco años que faltan antes del cierre. ¿Qué información le resultaría más útil para diseñarlo?", "f": "Análisis de alternativas de solución.", "vis": "", "o": [["A", "Qué saben hacer los trabajadores y qué otras actividades económicas son viables en el municipio.", "Correcta. Para reducir los efectos sociales del cierre, el plan necesita saber qué saben hacer los 600 trabajadores y qué actividades económicas alternativas son viables en el municipio.", true], ["B", "Cuántos años lleva la empresa minera funcionando en el municipio.", "La antigüedad de la empresa no indica qué alternativas de empleo existen para los trabajadores.", false], ["C", "En qué países se consume hoy la mayor parte del carbón del mundo y a qué precio se vende.", "Explica en parte la caída de la demanda, pero no orienta un plan local para los trabajadores; el cierre ya está anunciado.", false], ["D", "Cuántas toneladas de carbón produjo la mina durante su primer año de operación.", "Es un dato histórico de producción; no ayuda a decidir qué harán los trabajadores después del cierre.", false]]}]}, {"comp": "ciencias_naturales", "sim": "val-1", "ses": 1, "ind": "Cómo protegen las vacunas", "tt": "", "texto": "En una jornada de vacunación, una enfermera explica que muchas vacunas contienen microorganismos inactivados o debilitados, o solo algunas de sus partes, que no causan la enfermedad.", "vis": "", "items": [{"id": "CNA-201", "niv": 1, "cp": "cn_uso_comprensivo", "cn": "biologico", "e": "¿Cómo protege una vacuna de este tipo contra una enfermedad?", "f": "Concepto: sistema inmune y memoria inmunológica", "vis": "", "o": [["A", "Mata directamente a los microorganismos que ya están dentro del cuerpo, como lo hace un antibiótico.", "La vacuna es preventiva y no destruye directamente microorganismos; además, los antibióticos actúan contra bacterias, no contra virus.", false], ["B", "Aumenta la producción de glóbulos rojos, que llevan más oxígeno a los tejidos y destruyen los microorganismos.", "Los glóbulos rojos transportan oxígeno, no combaten infecciones; la vacuna activa a los glóbulos blancos (linfocitos) que producen anticuerpos.", false], ["C", "Estimula al sistema inmune a producir anticuerpos y células de memoria contra el microorganismo.", "La vacuna presenta antígenos sin causar la enfermedad; el cuerpo genera una respuesta inmune y células de memoria que actúan rápido si llega el microorganismo real.", true], ["D", "Contiene anticuerpos ya fabricados que se quedan en la sangre de la persona durante toda la vida.", "Eso describe una inmunización pasiva (por ejemplo, un suero), cuyos anticuerpos duran poco; la vacuna hace que el propio cuerpo produzca la defensa.", false]]}]}, {"comp": "ciencias_naturales", "sim": "val-1", "ses": 1, "ind": "Grupos sanguíneos en una familia", "tt": "", "texto": "El grupo sanguíneo ABO depende de tres alelos: A, B y O. Los alelos A y B son dominantes sobre O, y A y B son codominantes entre sí (una persona AB tiene grupo AB). Una mujer de grupo A tiene genotipo AO, y su pareja, de grupo B, tiene genotipo BO.", "vis": "", "items": [{"id": "CNA-202", "niv": 3, "cp": "cn_uso_comprensivo", "cn": "biologico", "e": "¿Cuál es la probabilidad de que un hijo de esta pareja tenga grupo sanguíneo O?", "f": "Leyes de Mendel: alelos múltiples del sistema ABO", "vis": "", "o": [["A", "0 %", "Supone que dos padres A y B no pueden tener un hijo O; pero ambos portan el alelo O y pueden transmitirlo.", false], ["B", "25 %", "Cada progenitor transmite O con probabilidad 1/2; el hijo es OO con probabilidad 1/2 × 1/2 = 1/4, es decir, 25 %. Los otros genotipos posibles son AB, AO y BO.", true], ["C", "50 %", "Es la probabilidad de que uno solo de los padres transmita el alelo O; para ser grupo O se necesita recibir O de ambos.", false], ["D", "75 %", "Es la probabilidad de que el hijo no sea grupo O (AB, AO o BO), no la de que lo sea.", false]]}]}, {"comp": "ciencias_naturales", "sim": "val-1", "ses": 1, "ind": "Absorción de nutrientes", "tt": "", "texto": "Durante la digestión, los alimentos se descomponen en moléculas pequeñas, como glucosa y aminoácidos, que pasan a la sangre.", "vis": "", "items": [{"id": "CNA-203", "niv": 1, "cp": "cn_uso_comprensivo", "cn": "biologico", "e": "¿En qué órgano se absorbe la mayor parte de los nutrientes de los alimentos?", "f": "Concepto: sistema digestivo", "vis": "", "o": [["A", "En el intestino delgado, cuyas vellosidades aumentan mucho la superficie disponible para la absorción.", "El intestino delgado completa la digestión y absorbe la mayoría de los nutrientes gracias a sus vellosidades y microvellosidades.", true], ["B", "En el páncreas, que produce los jugos digestivos y absorbe las moléculas que resultan de la digestión.", "El páncreas vierte jugos digestivos al intestino delgado, pero no absorbe nutrientes; la absorción ocurre en el intestino delgado.", false], ["C", "En el intestino grueso, donde se forma la materia fecal y se recupera gran parte de los alimentos.", "El intestino grueso absorbe sobre todo agua y sales; la mayoría de los nutrientes ya se absorbió en el intestino delgado.", false], ["D", "En el estómago, porque allí los alimentos permanecen más tiempo y se mezclan con los ácidos.", "En el estómago se inicia la digestión de proteínas, pero la absorción de nutrientes allí es mínima (algunas sustancias como el alcohol).", false]]}]}, {"comp": "ciencias_naturales", "sim": "val-1", "ses": 1, "ind": "Antibióticos y ribosomas", "tt": "", "texto": "Algunos antibióticos, como las tetraciclinas, se unen a los ribosomas de las bacterias e impiden que funcionen. Las células humanas también tienen ribosomas, pero son diferentes y el antibiótico los afecta mucho menos.", "vis": "", "items": [{"id": "CNA-205", "niv": 2, "cp": "cn_uso_comprensivo", "cn": "biologico", "e": "¿Qué proceso de la bacteria bloquean directamente estos antibióticos?", "f": "Concepto: ribosomas y síntesis de proteínas", "vis": "", "o": [["A", "La replicación de su ADN.", "La copia del ADN la realizan enzimas como la ADN polimerasa, no los ribosomas.", false], ["B", "La síntesis de su pared celular.", "La pared celular la fabrican enzimas, no los ribosomas directamente; antibióticos como la penicilina actúan sobre ella, pero no son los que se unen a los ribosomas.", false], ["C", "La entrada de nutrientes a través de su membrana.", "El paso de nutrientes por la membrana depende de proteínas transportadoras ya presentes en ella; los ribosomas no realizan ese transporte, solo fabrican proteínas.", false], ["D", "La síntesis de proteínas.", "Los ribosomas son los organelos donde se traduce el ARN mensajero y se fabrican las proteínas; sin proteínas la bacteria no puede crecer ni reproducirse.", true]]}]}, {"comp": "ciencias_naturales", "sim": "val-1", "ses": 1, "ind": "Respiración durante el ejercicio", "tt": "", "texto": "Un trabajador sube varios pisos por las escaleras cargando una caja. Al llegar, nota que respira más rápido y más profundo que en reposo.", "vis": "", "items": [{"id": "CNA-206", "niv": 1, "cp": "cn_explicacion", "cn": "biologico", "e": "¿Por qué aumenta la respiración durante el esfuerzo?", "f": "Concepto: respiración celular y sistema respiratorio", "vis": "", "o": [["A", "Los pulmones necesitan más energía para moverse, y esa energía la obtienen directamente del aire.", "El aire no aporta energía directamente; aporta oxígeno, que las células usan para liberar la energía de los nutrientes.", false], ["B", "El corazón deja de llevar oxígeno a los músculos durante el esfuerzo y los pulmones deben reemplazarlo.", "El corazón no deja de bombear; al contrario, late más rápido para llevar más sangre oxigenada a los músculos.", false], ["C", "La sangre se calienta durante el esfuerzo y necesita aire frío para enfriarse dentro de los pulmones.", "La respiración no aumenta para enfriar la sangre; la regulación de la temperatura se hace sobre todo con el sudor y la circulación en la piel.", false], ["D", "Los músculos usan más oxígeno y producen más CO₂ en la respiración celular, y el cuerpo ventila más.", "Para obtener más energía, las células musculares aumentan la respiración celular, que consume O₂ y produce CO₂; el aumento de la ventilación aporta O₂ y elimina el CO₂.", true]]}]}, {"comp": "ciencias_naturales", "sim": "val-1", "ses": 1, "ind": "Conservación de la carne con sal", "tt": "", "texto": "Desde hace siglos se conserva carne cubriéndola con abundante sal, como en la carne salada o la cecina. Así la carne tarda mucho más en descomponerse.", "vis": "", "items": [{"id": "CNA-207", "niv": 2, "cp": "cn_explicacion", "cn": "biologico", "e": "¿Por qué la sal ayuda a conservar la carne?", "f": "Concepto: ósmosis aplicada a la conservación de alimentos", "vis": "", "o": [["A", "La alta concentración de sal saca agua de las bacterias por ósmosis y dificulta su crecimiento.", "El medio muy salado es hipertónico: el agua sale de las células bacterianas por ósmosis y estas no pueden multiplicarse; además, la carne queda con menos agua disponible.", true], ["B", "La sal aumenta la cantidad de agua disponible en la carne, y eso favorece su conservación.", "Ocurre lo contrario: la sal retira agua, y la falta de agua disponible es lo que frena a los microorganismos.", false], ["C", "La sal sella la superficie de la carne e impide que el aire llegue al interior, donde crecen las bacterias.", "La sal no forma un sello hermético, y muchas bacterias crecen sin aire; su efecto es retirar agua por ósmosis.", false], ["D", "La sal actúa como un antibiótico que destruye el ADN de las bacterias presentes en la carne.", "La sal no destruye el ADN bacteriano; su efecto es osmótico y reduce el agua disponible.", false]]}]}, {"comp": "ciencias_naturales", "sim": "val-1", "ses": 1, "ind": "Insecticidas y polinización", "tt": "", "texto": "En una zona de cultivos de aguacate, la fumigación frecuente con un insecticida redujo mucho la población de abejas. Al año siguiente, con el mismo clima, el mismo riego y los mismos árboles, la producción de aguacate bajó.", "vis": "", "items": [{"id": "CNA-208", "niv": 2, "cp": "cn_explicacion", "cn": "biologico", "e": "¿Cuál es la explicación más probable de la caída en la producción?", "f": "Concepto: polinización y relaciones entre especies", "vis": "", "o": [["A", "Las abejas producían miel que caía al suelo y servía de abono para los árboles de aguacate.", "La miel no es un abono para los árboles; el aporte de las abejas a la producción es la polinización.", false], ["B", "Con menos abejas se polinizaron menos flores, y las flores sin polinizar no llegaron a formar frutos.", "Las abejas transportan polen entre flores; sin polinización no hay fecundación y la flor no forma fruto.", true], ["C", "El insecticida se acumuló en los frutos y los hizo más pequeños, aunque fueran igual de numerosos.", "El texto no informa sobre el tamaño de los frutos ni sobre residuos en ellos; la causa relacionada con las abejas es la polinización.", false], ["D", "Las abejas se comían las plagas del aguacate, y sin ellas las plagas destruyeron la cosecha.", "Las abejas se alimentan de néctar y polen, no de plagas; su papel en el cultivo es polinizar.", false]]}]}, {"comp": "ciencias_naturales", "sim": "val-1", "ses": 1, "ind": "Intolerancia a la lactosa", "tt": "", "texto": "Algunas personas adultas sienten gases, hinchazón y diarrea después de tomar leche. A muchas de ellas se les diagnostica intolerancia a la lactosa: su intestino delgado produce poca lactasa, la enzima que descompone la lactosa (el azúcar de la leche) en glucosa y galactosa.", "vis": "", "items": [{"id": "CNA-209", "niv": 3, "cp": "cn_explicacion", "cn": "biologico", "e": "¿Qué explica los síntomas de estas personas?", "f": "Concepto: enzimas digestivas", "vis": "", "o": [["A", "La lactosa se absorbe sin digerir y provoca una reacción alérgica del sistema inmune en la sangre.", "La intolerancia no es una alergia: no involucra al sistema inmune; además, la lactosa sin digerir no se absorbe.", false], ["B", "La leche contiene bacterias que se multiplican en el estómago cuando falta la enzima lactasa.", "La lactasa actúa en el intestino delgado y su falta no hace multiplicar bacterias en el estómago; la fermentación ocurre en el intestino grueso.", false], ["C", "La lactosa no digerida llega al intestino grueso, donde las bacterias la fermentan y producen gases.", "Sin suficiente lactasa la lactosa no se absorbe; en el intestino grueso las bacterias la fermentan y producen gases, y la lactosa retiene agua, lo que favorece la diarrea.", true], ["D", "La lactasa convierte la lactosa en glucosa y galactosa, y esa galactosa irrita la pared del intestino.", "Estas personas producen poca lactasa, así que la lactosa no se descompone; los síntomas se deben a la lactosa sin digerir, no a la galactosa.", false]]}]}, {"comp": "ciencias_naturales", "sim": "val-1", "ses": 1, "ind": "Botellas plásticas en el relleno", "tt": "", "texto": "Una botella de plástico PET que llega a un relleno sanitario puede tardar cientos de años en degradarse, mientras que una cáscara de fruta se descompone en pocas semanas.", "vis": "", "items": [{"id": "CNA-217", "niv": 1, "cp": "cn_uso_comprensivo", "cn": "cts", "e": "¿Por qué el plástico PET permanece tanto tiempo en el ambiente?", "f": "Concepto: biodegradabilidad de los materiales", "vis": "", "o": [["A", "Porque el PET está formado por moléculas muy pequeñas que se dispersan en el suelo sin cambiar.", "El PET está formado por moléculas muy largas (polímeros); al fragmentarse forma microplásticos, pero las cadenas siguen sin degradarse.", false], ["B", "Porque muy pocos microorganismos tienen enzimas para descomponerlo, así que se degrada muy lentamente.", "Los descomponedores degradan con facilidad la materia orgánica natural, pero casi no tienen enzimas capaces de romper este polímero sintético.", true], ["C", "Porque el PET es un material inorgánico, como el vidrio, y los microorganismos solo degradan materia orgánica.", "El PET es un polímero orgánico (de carbono) derivado del petróleo; el problema es que casi ningún microorganismo tiene enzimas para romperlo.", false], ["D", "Porque el PET libera sustancias tóxicas que matan a los microorganismos que intentan descomponerlo.", "La lentitud no se debe a que el PET mate a los descomponedores, sino a que casi no tienen enzimas capaces de degradarlo.", false]]}]}, {"comp": "ciencias_naturales", "sim": "val-1", "ses": 1, "ind": "Restricción vehicular y calidad del aire", "tt": "", "texto": "Una ciudad ficticia amplió en 2024 la restricción a la circulación de vehículos particulares. Ese mismo año también cerraron dos fábricas de ladrillos ubicadas cerca de la ciudad. La gráfica muestra el promedio anual de material particulado fino (PM2,5) medido por la red de monitoreo.", "vis": "", "items": [{"id": "CNA-220", "niv": 2, "cp": "cn_indagacion", "cn": "cts", "e": "¿Qué conclusión es la más adecuada a partir de esta información?", "f": "Indagación: varias causas posibles; correlación y causalidad", "vis": "<div class=\"vfig\"><svg class=\"vg\" viewBox=\"0 0 560 320\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Gráfica 7. Promedio anual de PM2,5\" font-family=\"Arial, sans-serif\" font-size=\"12\"><rect width=\"560\" height=\"320\" fill=\"#ffffff\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"13\" fill=\"#1d2433\">Gráfica 7. Promedio anual de PM2,5<\/text><line x1=\"60\" y1=\"258.0\" x2=\"540\" y2=\"258.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"262.0\" text-anchor=\"end\" fill=\"#3a4356\">0<\/text><line x1=\"60\" y1=\"221.0\" x2=\"540\" y2=\"221.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"225.0\" text-anchor=\"end\" fill=\"#3a4356\">5<\/text><line x1=\"60\" y1=\"184.0\" x2=\"540\" y2=\"184.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"188.0\" text-anchor=\"end\" fill=\"#3a4356\">10<\/text><line x1=\"60\" y1=\"147.0\" x2=\"540\" y2=\"147.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"151.0\" text-anchor=\"end\" fill=\"#3a4356\">15<\/text><line x1=\"60\" y1=\"110.0\" x2=\"540\" y2=\"110.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"114.0\" text-anchor=\"end\" fill=\"#3a4356\">20<\/text><line x1=\"60\" y1=\"73.0\" x2=\"540\" y2=\"73.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"77.0\" text-anchor=\"end\" fill=\"#3a4356\">25<\/text><line x1=\"60\" y1=\"36.0\" x2=\"540\" y2=\"36.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"40.0\" text-anchor=\"end\" fill=\"#3a4356\">30<\/text><line x1=\"60\" y1=\"258\" x2=\"540\" y2=\"258\" stroke=\"#3a4356\"/><line x1=\"60\" y1=\"258\" x2=\"60\" y2=\"36\" stroke=\"#3a4356\"/><text transform=\"translate(14,147.0) rotate(-90)\" text-anchor=\"middle\" fill=\"#3a4356\">PM2,5 (µg/m³)<\/text><text x=\"300.0\" y=\"312\" text-anchor=\"middle\" fill=\"#3a4356\">Año<\/text><text x=\"108.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">2021<\/text><text x=\"204.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">2022<\/text><text x=\"300.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">2023<\/text><text x=\"396.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">2024<\/text><text x=\"492.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">2025<\/text><rect x=\"74.4\" y=\"50.8\" width=\"67.2\" height=\"207.2\" fill=\"#1660a8\"/><text x=\"108.0\" y=\"46.8\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">28<\/text><rect x=\"170.4\" y=\"58.2\" width=\"67.2\" height=\"199.8\" fill=\"#1660a8\"/><text x=\"204.0\" y=\"54.2\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">27<\/text><rect x=\"266.4\" y=\"58.2\" width=\"67.2\" height=\"199.8\" fill=\"#1660a8\"/><text x=\"300.0\" y=\"54.2\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">27<\/text><rect x=\"362.4\" y=\"87.8\" width=\"67.2\" height=\"170.2\" fill=\"#1660a8\"/><text x=\"396.0\" y=\"83.8\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">23<\/text><rect x=\"458.4\" y=\"95.2\" width=\"67.2\" height=\"162.8\" fill=\"#1660a8\"/><text x=\"492.0\" y=\"91.2\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">22<\/text><\/svg><\/div>", "o": [["A", "El cierre de las ladrilleras fue la causa principal, porque las fábricas contaminan más que los carros.", "La información no permite comparar el aporte de las fábricas y de los carros; ambas medidas ocurrieron a la vez.", false], ["B", "La restricción no funcionó, porque en 2025 el PM2,5 siguió por encima del valor que tenía en 2021.", "En 2025 el PM2,5 fue 22 µg/m³, menor que los 28 µg/m³ de 2021; la afirmación contradice la gráfica.", false], ["C", "La baja coincide con la restricción, pero también pudo deberse al cierre de las ladrilleras.", "Dos cambios ocurrieron al mismo tiempo; los datos muestran la disminución, pero no permiten separar el efecto de cada medida.", true], ["D", "La ampliación de la restricción vehicular causó la disminución del PM2,5, como lo muestra la gráfica.", "La gráfica muestra que la disminución coincide con 2024, pero ese año también cerraron las ladrilleras; no permite atribuirla solo a la restricción.", false]]}]}, {"comp": "ciencias_naturales", "sim": "val-1", "ses": 1, "ind": "Llave para aflojar una tuerca", "tt": "", "texto": "Un mecánico no logra aflojar una tuerca muy apretada con una llave corta. Toma una llave más larga, la agarra por el extremo y, haciendo la misma fuerza, la tuerca se afloja.", "vis": "", "items": [{"id": "CNA-224", "niv": 2, "cp": "cn_uso_comprensivo", "cn": "fisico", "e": "¿Por qué la llave larga permite aflojar la tuerca con la misma fuerza?", "f": "Concepto: torque o momento de una fuerza", "vis": "", "o": [["A", "Porque al aplicar la fuerza más lejos del eje de giro aumenta el torque, aunque la fuerza sea la misma.", "El torque (momento de fuerza) es el producto de la fuerza por la distancia al eje de giro; con un brazo más largo, la misma fuerza produce mayor torque.", true], ["B", "Porque con la llave larga la fuerza que hace el mecánico se vuelve mayor sin que él lo note.", "El enunciado dice que la fuerza es la misma; lo que aumenta es el torque, no la fuerza.", false], ["C", "Porque la llave larga pesa más, y su peso se suma a la fuerza que hace el mecánico sobre la tuerca.", "El peso de la llave es pequeño y no es la razón; la diferencia la produce la mayor distancia al eje.", false], ["D", "Porque la llave larga reduce la fricción entre la tuerca y el tornillo, y así gira con más facilidad.", "La llave no cambia la fricción entre las roscas; cambia el torque aplicado.", false]]}]}, {"comp": "ciencias_naturales", "sim": "val-1", "ses": 1, "ind": "Central hidroeléctrica", "tt": "", "texto": "En una central hidroeléctrica, el agua almacenada en un embalse cae por tuberías hasta unas turbinas. Las turbinas giran y mueven generadores que producen electricidad.", "vis": "", "items": [{"id": "CNA-225", "niv": 1, "cp": "cn_uso_comprensivo", "cn": "fisico", "e": "¿Cuál secuencia describe las principales transformaciones de energía en la central?", "f": "Concepto: transformaciones de la energía", "vis": "", "o": [["A", "Química, luego térmica y luego eléctrica.", "Es la secuencia de una central térmica que quema combustibles; en la hidroeléctrica no hay combustión.", false], ["B", "Eléctrica, luego cinética y luego potencial gravitacional.", "Es el orden inverso: describe un sistema que usa electricidad para bombear agua hacia arriba, no uno que la produce.", false], ["C", "Nuclear, luego térmica y luego eléctrica.", "Es la secuencia de una central nuclear; en la hidroeléctrica la energía proviene de la caída del agua.", false], ["D", "Potencial gravitacional, luego cinética y luego eléctrica.", "El agua elevada tiene energía potencial; al caer la convierte en cinética, que mueve las turbinas, y el generador la transforma en energía eléctrica.", true]]}]}, {"comp": "ciencias_naturales", "sim": "val-1", "ses": 1, "ind": "Corriente de un horno microondas", "tt": "", "texto": "La placa de un horno microondas indica 1.200 W y 120 V.", "vis": "", "items": [{"id": "CNA-226", "niv": 2, "cp": "cn_uso_comprensivo", "cn": "fisico", "e": "¿Qué corriente toma el microondas de la red cuando funciona a esa potencia?", "f": "Cálculo propio: P = V·I", "vis": "", "o": [["A", "0,1 A.", "Divide el voltaje entre la potencia (120/1.200); la relación es I = P/V.", false], ["B", "10 A.", "P = V·I, así que I = P/V = 1.200 W / 120 V = 10 A.", true], ["C", "1.080 A.", "Resta el voltaje de la potencia (1.200 − 120), una operación sin sentido físico.", false], ["D", "144.000 A.", "Multiplica potencia por voltaje; la corriente es el cociente P/V.", false]]}]}, {"comp": "ciencias_naturales", "sim": "val-1", "ses": 1, "ind": "Frenado de un camión cargado", "tt": "", "texto": "Un conductor nota que su camión necesita más distancia para detenerse cuando va cargado que cuando va vacío, aunque vaya a la misma velocidad y los frenos ejerzan la misma fuerza.", "vis": "", "items": [{"id": "CNA-227", "niv": 2, "cp": "cn_explicacion", "cn": "fisico", "e": "¿Qué explica esta diferencia en la distancia de frenado?", "f": "Concepto: segunda ley de Newton", "vis": "", "o": [["A", "Con más masa el camión tiene más inercia, y la inercia es una fuerza que lo empuja hacia adelante al frenar.", "La inercia no es una fuerza: es la tendencia a conservar el movimiento. La diferencia se explica porque la misma fuerza de frenado produce menor desaceleración.", false], ["B", "La carga empuja al camión hacia adelante con una fuerza que se suma a la del motor durante el frenado.", "La carga no ejerce una fuerza neta hacia adelante sobre el camión; la diferencia se explica por la inercia de una masa mayor.", false], ["C", "Con más masa y la misma fuerza de frenado, la desaceleración es menor y el camión recorre más distancia.", "Según la segunda ley de Newton (a = F/m), la misma fuerza produce menor aceleración sobre una masa mayor; al frenar más despacio, recorre más distancia.", true], ["D", "Con más masa aumenta la fricción de las llantas con el suelo, y esa fricción alarga la distancia de frenado.", "La fricción con el suelo ayuda a detener el vehículo; si aumentara, acortaría la distancia, no la alargaría.", false]]}]}, {"comp": "ciencias_naturales", "sim": "val-1", "ses": 1, "ind": "Tanques de agua blancos y negros", "tt": "", "texto": "En una zona calurosa, dos tanques de agua iguales, uno pintado de blanco y otro de negro, se dejan al sol durante el día. El agua del tanque negro se calienta bastante más.", "vis": "", "items": [{"id": "CNA-228", "niv": 2, "cp": "cn_explicacion", "cn": "fisico", "e": "¿Qué explica esta diferencia de temperatura?", "f": "Concepto: absorción y reflexión de la radiación", "vis": "", "o": [["A", "La superficie blanca refleja la mayor parte de la radiación solar, y la negra absorbe más energía.", "Las superficies claras reflejan gran parte de la luz que reciben; las oscuras absorben más radiación y la transforman en energía térmica que pasa al agua.", true], ["B", "La pintura blanca es más gruesa que la negra y funciona como un aislante que bloquea todo el calor.", "No se indica que la pintura sea más gruesa; la diferencia se debe al color, que determina cuánta radiación se absorbe.", false], ["C", "El negro conduce mejor el calor por ser una pintura más densa, y lo lleva al agua más rápido.", "La diferencia no se debe a la densidad de la pintura sino a cuánta radiación absorbe cada color; el negro absorbe más.", false], ["D", "La pintura blanca deja escapar el calor del agua por radiación, mientras que la negra lo retiene.", "Las superficies negras también emiten radiación con más facilidad; la causa principal es que la blanca refleja la luz solar y absorbe menos.", false]]}]}, {"comp": "ciencias_naturales", "sim": "val-1", "ses": 1, "ind": "Prueba de un resorte", "tt": "", "texto": "En un taller que repara básculas se prueba un resorte: se cuelgan distintas masas y se mide cuánto se estira el resorte en cada caso.", "vis": "<table class=\"vt\"><caption>Tabla 3. Estiramiento del resorte según la masa colgada<\/caption><thead><tr><th>Masa (g)<\/th><th>100<\/th><th>200<\/th><th>300<\/th><th>400<\/th><\/tr><\/thead><tbody><tr><td>Estiramiento (cm)<\/td><td>2,0<\/td><td>4,0<\/td><td>6,1<\/td><td>7,9<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Datos ficticios.<\/div>", "items": [{"id": "CNA-232", "niv": 1, "cp": "cn_indagacion", "cn": "fisico", "e": "¿Qué conclusión se apoya en los datos de la tabla?", "f": "Indagación: patrones en datos; ley de Hooke", "vis": "", "o": [["A", "El estiramiento aumenta con la masa, a razón de unos 4 cm por cada 100 g adicionales.", "Cada 100 g adicionales estiran unos 2 cm (de 2,0 a 4,0 cm, de 4,0 a 6,1 cm), no 4 cm.", false], ["B", "El estiramiento disminuye a medida que aumenta la masa, porque el resorte se pone más rígido.", "Los datos muestran lo contrario: a más masa, más estiramiento.", false], ["C", "El estiramiento no depende de la masa colgada, porque el resorte es el mismo en todas las pruebas.", "Aunque el resorte es el mismo, el estiramiento cambia de 2,0 cm a 7,9 cm al cambiar la masa.", false], ["D", "El estiramiento aumenta de manera aproximadamente uniforme a medida que aumenta la masa colgada.", "Cada 100 g adicionales estiran el resorte unos 2 cm (2,0; 4,0; 6,1; 7,9 cm): el aumento es casi constante, como describe la ley de Hooke.", true]]}, {"id": "CNA-233", "niv": 2, "cp": "cn_indagacion", "cn": "fisico", "e": "Si se cuelga una masa de 250 g, ¿cuál es el estiramiento más probable?", "f": "Indagación: predicción por interpolación", "vis": "", "o": [["A", "2,5 cm.", "Toma el número 250 como si fueran 2,5 cm, sin usar la relación de los datos (unos 2 cm por cada 100 g).", false], ["B", "4,0 cm.", "Es el estiramiento con 200 g; con 250 g el resorte se estira más.", false], ["C", "5,0 cm.", "El resorte se estira unos 2 cm por cada 100 g; con 250 g se esperan 2,5 × 2 = 5,0 cm, entre 4,0 cm (200 g) y 6,1 cm (300 g).", true], ["D", "6,1 cm.", "Es el estiramiento con 300 g; con 250 g debe ser menor.", false]]}]}, {"comp": "ciencias_naturales", "sim": "val-1", "ses": 1, "ind": "Distancia de frenado de un automóvil", "tt": "", "texto": "Una escuela de conducción midió la distancia de frenado de un mismo automóvil, con el mismo conductor, a tres velocidades, en pavimento seco y en pavimento mojado. La distancia de frenado es la que recorre el carro desde que se pisa el freno hasta que se detiene.", "vis": "<table class=\"vt\"><caption>Tabla 4. Distancia de frenado (m)<\/caption><thead><tr><th>Velocidad (km/h)<\/th><th>Pavimento seco<\/th><th>Pavimento mojado<\/th><\/tr><\/thead><tbody><tr><td>30<\/td><td>6<\/td><td>9<\/td><\/tr><tr><td>60<\/td><td>24<\/td><td>36<\/td><\/tr><tr><td>90<\/td><td>54<\/td><td>81<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Datos ficticios.<\/div>", "items": [{"id": "CNA-234", "niv": 3, "cp": "cn_indagacion", "cn": "fisico", "e": "En pavimento seco, ¿qué ocurre con la distancia de frenado cuando la velocidad se duplica de 30 a 60 km/h?", "f": "Indagación: análisis de tablas y relaciones no lineales", "vis": "", "o": [["A", "Se reduce a la mitad.", "La distancia aumenta con la velocidad; no disminuye.", false], ["B", "Se cuadruplica.", "Pasa de 6 m a 24 m, es decir, 4 veces. También al triplicar la velocidad (90 km/h) la distancia es 9 veces mayor (54 m): crece con el cuadrado de la velocidad.", true], ["C", "Se duplica.", "Supone una relación directamente proporcional; con el doble de velocidad la distancia sería 12 m, pero es 24 m.", false], ["D", "No cambia.", "La distancia cambia de 6 m a 24 m.", false]]}, {"id": "CNA-235", "niv": 2, "cp": "cn_indagacion", "cn": "fisico", "e": "¿Qué se puede concluir al comparar el pavimento seco con el mojado?", "f": "Indagación: comparación de datos y razones", "vis": "", "o": [["A", "En las tres velocidades, la distancia en pavimento mojado es 1,5 veces la del seco.", "9/6 = 1,5; 36/24 = 1,5; 81/54 = 1,5. La relación se mantiene en las tres velocidades.", true], ["B", "En pavimento mojado la distancia aumenta en 3 m respecto a la del seco, en cada una de las velocidades.", "El aumento es de 3 m a 30 km/h, pero de 12 m a 60 km/h y de 27 m a 90 km/h; no es constante.", false], ["C", "El estado del pavimento influye más que la velocidad en la distancia de frenado.", "Triplicar la velocidad multiplica la distancia por 9, mientras que mojar el pavimento la multiplica por 1,5; la velocidad influye más.", false], ["D", "El pavimento mojado solo aumenta la distancia de frenado cuando la velocidad es alta.", "Incluso a 30 km/h la distancia aumenta de 6 m a 9 m con el pavimento mojado.", false]]}]}, {"comp": "ciencias_naturales", "sim": "val-1", "ses": 1, "ind": "Dilución de un blanqueador", "tt": "", "texto": "Una persona que trabaja en aseo tiene un blanqueador con hipoclorito de sodio al 5 %. Toma 200 mL de ese blanqueador y le agrega agua hasta completar 1.000 mL de solución.", "vis": "", "items": [{"id": "CNA-237", "niv": 2, "cp": "cn_uso_comprensivo", "cn": "quimico", "e": "¿Cuál es la concentración de la solución que preparó?", "f": "Cálculo propio: dilución (C₁V₁ = C₂V₂)", "vis": "", "o": [["A", "0,2 %", "Divide 200 mL entre 1.000 mL y olvida que el blanqueador original estaba al 5 %.", false], ["B", "1 %", "La cantidad de soluto no cambia al diluir: 5 % × 200 mL = C × 1.000 mL, así que C = 1 %.", true], ["C", "5 %", "Supone que agregar agua no cambia la concentración; al diluir, la misma cantidad de soluto queda en más volumen.", false], ["D", "25 %", "Invierte la relación de volúmenes (5 × 1.000 / 200); al diluir la concentración disminuye, no aumenta.", false]]}]}, {"comp": "ciencias_naturales", "sim": "val-1", "ses": 1, "ind": "Concentración de una bebida", "tt": "", "texto": "Para preparar una bebida hidratante casera, se disuelven 10 g de azúcar en agua y se completa hasta un volumen de 250 mL de solución.", "vis": "", "items": [{"id": "CNA-239", "niv": 2, "cp": "cn_uso_comprensivo", "cn": "quimico", "e": "¿Cuál es la concentración de azúcar de la bebida en gramos por litro?", "f": "Cálculo propio: concentración masa/volumen", "vis": "", "o": [["A", "0,04 g/L.", "0,04 es la concentración en g/mL (10/250); al pasar a litros hay que multiplicar por 1.000, no dejar el mismo número.", false], ["B", "25 g/L.", "Divide el volumen entre la masa (250/10); la concentración es masa de soluto entre volumen de solución.", false], ["C", "40 g/L.", "250 mL = 0,25 L. Concentración = 10 g / 0,25 L = 40 g/L.", true], ["D", "2.500 g/L.", "Multiplica masa por volumen (10 × 250); la concentración es un cociente.", false]]}]}, {"comp": "ciencias_naturales", "sim": "val-1", "ses": 1, "ind": "Advertencia en un blanqueador", "tt": "", "texto": "La etiqueta de un blanqueador con hipoclorito de sodio dice: «No mezclar con productos que contengan amoníaco ni con ácidos, como algunos limpiadores de baño o el vinagre».", "vis": "", "items": [{"id": "CNA-242", "niv": 2, "cp": "cn_explicacion", "cn": "quimico", "e": "¿Por qué no se debe mezclar el blanqueador con esos productos?", "f": "Concepto: reacciones peligrosas y uso seguro de productos. Fuente: Health Canada; Washington State Department of Health", "vis": "", "o": [["A", "Porque el blanqueador pierde su poder desinfectante y la mezcla deja de servir, aunque no sea peligrosa.", "La advertencia es por seguridad: la mezcla sí es peligrosa porque libera gases tóxicos.", false], ["B", "Porque al mezclarse forman una sal que mancha y daña las superficies que se están limpiando.", "El riesgo principal no es dañar superficies sino la liberación de gases tóxicos (cloro o cloraminas).", false], ["C", "Porque la mezcla pierde su olor y ya no se puede saber si el producto todavía está sirviendo para limpiar.", "El riesgo no tiene que ver con el olor; la advertencia se debe a la formación de gases tóxicos.", false], ["D", "Porque al mezclarse reaccionan y liberan gases tóxicos, como cloro o cloraminas, que irritan los pulmones.", "El hipoclorito con ácidos libera cloro gaseoso, y con amoníaco forma cloraminas; ambos son irritantes respiratorios y pueden ser peligrosos en espacios cerrados.", true]]}]}, {"comp": "ciencias_naturales", "sim": "val-1", "ses": 1, "ind": "Pintura en rejas de hierro", "tt": "", "texto": "Las rejas de hierro de las casas se oxidan con el tiempo y se cubren de herrumbre. Para evitarlo, se recomienda mantenerlas pintadas.", "vis": "", "items": [{"id": "CNA-243", "niv": 1, "cp": "cn_explicacion", "cn": "quimico", "e": "¿Por qué la pintura protege al hierro de la oxidación?", "f": "Concepto: corrosión y su prevención", "vis": "", "o": [["A", "Porque impide que el oxígeno y la humedad del aire entren en contacto con el hierro.", "La oxidación del hierro requiere oxígeno y agua; la capa de pintura actúa como barrera entre el metal y el ambiente.", true], ["B", "Porque la pintura reacciona con el hierro y forma una aleación que ya no puede oxidarse.", "La pintura no forma una aleación con el hierro; si se raya, el hierro expuesto se oxida. Actúa como barrera.", false], ["C", "Porque la pintura absorbe el oxígeno del aire y lo consume antes de que llegue al metal.", "La pintura no consume el oxígeno del aire; simplemente cubre el metal y evita su contacto con el oxígeno y la humedad.", false], ["D", "Porque le aporta oxígeno al hierro y así el metal ya no necesita tomarlo del aire.", "La oxidación se produce justamente por la reacción con el oxígeno; aportar oxígeno la favorecería.", false]]}]}, {"comp": "ciencias_naturales", "sim": "val-1", "ses": 1, "ind": "Dureza del agua", "tt": "", "texto": "El agua dura contiene sales disueltas de calcio y magnesio que dificultan la formación de espuma con el jabón. Para comparar la dureza de varias muestras, se agregaron gotas de una misma solución de jabón a 10 mL de cada una, agitando, hasta que se formó una espuma que duró 30 segundos. Cuanto más dura es el agua, más gotas de jabón se necesitan.", "vis": "<table class=\"vt\"><caption>Tabla 5. Gotas de solución de jabón necesarias para formar espuma<\/caption><thead><tr><th>Muestra (10 mL)<\/th><th>Gotas de jabón<\/th><\/tr><\/thead><tbody><tr><td>Agua destilada<\/td><td>2<\/td><\/tr><tr><td>Agua de lluvia<\/td><td>3<\/td><\/tr><tr><td>Agua del acueducto<\/td><td>12<\/td><\/tr><tr><td>Agua de pozo sin hervir<\/td><td>25<\/td><\/tr><tr><td>Agua de pozo hervida y filtrada<\/td><td>10<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Datos ficticios.<\/div>", "items": [{"id": "CNA-249", "niv": 1, "cp": "cn_indagacion", "cn": "quimico", "e": "¿Cuál de las muestras es la más dura?", "f": "Indagación: lectura de tablas", "vis": "", "o": [["A", "El agua de pozo hervida y filtrada.", "Necesitó 10 gotas, menos de la mitad que el agua de pozo sin hervir.", false], ["B", "El agua del acueducto.", "Necesitó 12 gotas, menos que el agua de pozo sin hervir.", false], ["C", "El agua destilada.", "Necesitó solo 2 gotas: es la menos dura, pues no tiene sales disueltas.", false], ["D", "El agua de pozo sin hervir.", "Necesitó 25 gotas, la mayor cantidad de jabón de todas las muestras.", true]]}, {"id": "CNA-250", "niv": 2, "cp": "cn_indagacion", "cn": "quimico", "e": "¿Qué se puede concluir sobre el efecto de hervir y filtrar el agua de pozo?", "f": "Indagación: conclusiones a partir de datos; dureza temporal del agua", "vis": "", "o": [["A", "Redujo su dureza, aunque no la dejó tan blanda como el agua de lluvia o la destilada.", "Pasó de 25 a 10 gotas: la dureza bajó, pero sigue necesitando más jabón que el agua de lluvia (3) o la destilada (2).", true], ["B", "No cambió su dureza, porque las sales disueltas en el agua no se ven afectadas por el calor.", "Los datos muestran una disminución clara (de 25 a 10 gotas); parte de las sales precipita al hervir y queda retenida al filtrar.", false], ["C", "Aumentó su dureza, porque al hervirla se evaporó parte del agua y se concentraron las sales.", "El número de gotas bajó de 25 a 10, lo que indica menor dureza, no mayor.", false], ["D", "La dejó tan blanda como el agua de lluvia, porque al hervirla se eliminaron todas sus sales.", "El agua de pozo hervida necesitó 10 gotas y la de lluvia 3; no quedó igual de blanda.", false]]}]}, {"comp": "ciencias_naturales", "sim": "val-1", "ses": 1, "ind": "Acidez de tres vinagres", "tt": "", "texto": "Para comparar la acidez de tres marcas de vinagre, en un laboratori
