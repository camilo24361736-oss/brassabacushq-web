o se tomaron 10 mL de cada una y se les agregó, gota a gota, una solución de hidróxido de sodio (una base) de la misma concentración, hasta que un indicador mostró que el ácido se había neutralizado.", "vis": "", "items": [{"id": "CNA-251", "niv": 2, "cp": "cn_indagacion", "cn": "quimico", "e": "¿Qué se puede concluir de los resultados?", "f": "Indagación: interpretación de una titulación ácido-base", "vis": "<table class=\"vt\"><caption>Tabla 6. Volumen de base necesario para neutralizar 10 mL de vinagre<\/caption><thead><tr><th>Vinagre<\/th><th>Hidróxido de sodio agregado (mL)<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>8<\/td><\/tr><tr><td>2<\/td><td>12<\/td><\/tr><tr><td>3<\/td><td>6<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Datos ficticios.<\/div>", "o": [["A", "Los tres vinagres tienen la misma concentración de ácido, porque los tres lograron neutralizarse.", "Todos se neutralizaron, pero con volúmenes distintos de base (6, 8 y 12 mL); sus concentraciones son diferentes.", false], ["B", "El vinagre 3 tiene la mayor concentración de ácido, porque se neutralizó con menos cantidad de base.", "Neutralizarse con menos base indica que tiene menos ácido; el vinagre 3 (6 mL) es el menos concentrado.", false], ["C", "No se pueden comparar las concentraciones, porque no se midió el pH de cada vinagre con un pH-metro.", "No hace falta el pH: con el mismo volumen de vinagre, el volumen de base necesario para neutralizarlo compara directamente la cantidad de ácido.", false], ["D", "El vinagre 2 tiene la mayor concentración de ácido, porque necesitó más base para neutralizarse.", "Con el mismo volumen de vinagre y la misma base, se necesita más base cuanto más ácido haya; el vinagre 2 necesitó 12 mL, la mayor cantidad.", true]]}]}, {"comp": "matematicas", "sim": "val-1", "ses": 2, "ind": "Pago mensual con horas extra", "tt": "", "texto": "Andrés trabaja en una bodega con un salario básico de $ 1.800.000 mensuales. La empresa le paga cada hora extra a $ 12.000 y, del total devengado (salario más horas extra), le descuenta el 8 %. La gráfica muestra las horas extra que trabajó cada semana del mes.", "vis": "<div class=\"vfig\"><svg class=\"vg\" viewBox=\"0 0 560 320\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Gráfica 8. Horas extra trabajadas por semana\" font-family=\"Arial, sans-serif\" font-size=\"12\"><rect width=\"560\" height=\"320\" fill=\"#ffffff\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"13\" fill=\"#1d2433\">Gráfica 8. Horas extra trabajadas por semana<\/text><line x1=\"60\" y1=\"258.0\" x2=\"540\" y2=\"258.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"262.0\" text-anchor=\"end\" fill=\"#3a4356\">0<\/text><line x1=\"60\" y1=\"213.6\" x2=\"540\" y2=\"213.6\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"217.6\" text-anchor=\"end\" fill=\"#3a4356\">1<\/text><line x1=\"60\" y1=\"169.2\" x2=\"540\" y2=\"169.2\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"173.2\" text-anchor=\"end\" fill=\"#3a4356\">2<\/text><line x1=\"60\" y1=\"124.8\" x2=\"540\" y2=\"124.8\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"128.8\" text-anchor=\"end\" fill=\"#3a4356\">3<\/text><line x1=\"60\" y1=\"80.4\" x2=\"540\" y2=\"80.4\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"84.4\" text-anchor=\"end\" fill=\"#3a4356\">4<\/text><line x1=\"60\" y1=\"36.0\" x2=\"540\" y2=\"36.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"40.0\" text-anchor=\"end\" fill=\"#3a4356\">5<\/text><line x1=\"60\" y1=\"258\" x2=\"540\" y2=\"258\" stroke=\"#3a4356\"/><line x1=\"60\" y1=\"258\" x2=\"60\" y2=\"36\" stroke=\"#3a4356\"/><text transform=\"translate(14,147.0) rotate(-90)\" text-anchor=\"middle\" fill=\"#3a4356\">Horas extra<\/text><text x=\"300.0\" y=\"312\" text-anchor=\"middle\" fill=\"#3a4356\">Semana<\/text><text x=\"120.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Semana 1<\/text><text x=\"240.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Semana 2<\/text><text x=\"360.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Semana 3<\/text><text x=\"480.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Semana 4<\/text><rect x=\"78.0\" y=\"124.8\" width=\"84.0\" height=\"133.2\" fill=\"#1660a8\"/><text x=\"120.0\" y=\"120.8\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">3<\/text><rect x=\"198.0\" y=\"36.0\" width=\"84.0\" height=\"222.0\" fill=\"#1660a8\"/><text x=\"240.0\" y=\"32.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">5<\/text><rect x=\"318.0\" y=\"80.4\" width=\"84.0\" height=\"177.6\" fill=\"#1660a8\"/><text x=\"360.0\" y=\"76.4\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">4<\/text><rect x=\"438.0\" y=\"124.8\" width=\"84.0\" height=\"133.2\" fill=\"#1660a8\"/><text x=\"480.0\" y=\"120.8\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">3<\/text><\/svg><\/div>", "items": [{"id": "MTA-201", "niv": 2, "cp": "mt_formulacion", "cn": "", "e": "¿Cuánto dinero recibe Andrés ese mes después del descuento?", "f": "Cálculo propio", "vis": "", "o": [["A", "$ 1.656.000.", "Aplica el descuento solo al salario básico y olvida sumar las horas extra.", false], ["B", "$ 1.821.600.", "Trabajó 3 + 5 + 4 + 3 = 15 horas extra: 15 × 12.000 = 180.000. Total devengado: 1.980.000; con el descuento del 8 %: 1.980.000 × 0,92 = 1.821.600.", true], ["C", "$ 1.836.000.", "Descuenta el 8 % solo del salario básico (1.656.000) y suma completas las horas extra; el descuento se aplica al total devengado.", false], ["D", "$ 1.980.000.", "Es el total devengado; falta restar el descuento del 8 %.", false]]}, {"id": "MTA-202", "niv": 2, "cp": "mt_interpretacion", "cn": "", "e": "¿Qué porcentaje de las horas extra del mes trabajó Andrés en las semanas en que hizo 4 horas extra o más?", "f": "Lectura de la gráfica y porcentajes", "vis": "", "o": [["A", "9 %.", "Toma el número de horas de esas semanas (5 + 4 = 9) como si fuera el porcentaje.", false], ["B", "40 %.", "Calcula el porcentaje de las semanas con menos de 4 horas extra: (3 + 3) ÷ 15 = 40 %.", false], ["C", "50 %.", "Cuenta semanas y no horas: 2 de las 4 semanas son el 50 %, pero la pregunta es sobre las horas extra.", false], ["D", "60 %.", "Las semanas 2 (5 horas) y 3 (4 horas) suman 9 de las 15 horas extra del mes: 9 ÷ 15 = 0,6, es decir, 60 %.", true]]}]}, {"comp": "matematicas", "sim": "val-1", "ses": 2, "ind": "Pintura de una pared con ventana", "tt": "", "texto": "Un pintor va a pintar una pared rectangular de 6 m de largo y 2,5 m de alto que tiene una ventana rectangular de 1,5 m de ancho y 1,2 m de alto, como muestra la figura. La ventana no se pinta.", "vis": "<div class=\"vfig\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 380 190\" width=\"380\" height=\"190\" font-family=\"Arial, sans-serif\" font-size=\"14\"><rect width=\"380\" height=\"190\" fill=\"#ffffff\"/><rect x=\"40\" y=\"30\" width=\"300\" height=\"125\" fill=\"#f3ecdf\" stroke=\"#1d2433\" stroke-width=\"2\"/><rect x=\"210\" y=\"60\" width=\"75\" height=\"60\" fill=\"#ffffff\" stroke=\"#1d2433\" stroke-width=\"2\"/><line x1=\"247.5\" y1=\"60\" x2=\"247.5\" y2=\"120\" stroke=\"#1d2433\"/><text x=\"190\" y=\"176\" text-anchor=\"middle\" fill=\"#1d2433\">6 m<\/text><text x=\"34\" y=\"97\" text-anchor=\"end\" fill=\"#1d2433\">2,5 m<\/text><text x=\"247\" y=\"54\" text-anchor=\"middle\" fill=\"#1d2433\">1,5 m<\/text><text x=\"292\" y=\"95\" fill=\"#1d2433\">1,2 m<\/text><text x=\"120\" y=\"97\" text-anchor=\"middle\" fill=\"#1d2433\">pared<\/text><\/svg><\/div>", "items": [{"id": "MTA-203", "niv": 1, "cp": "mt_formulacion", "cn": "", "e": "¿Cuántos metros cuadrados de pared se deben pintar?", "f": "Área de rectángulos", "vis": "", "o": [["A", "1,8 m².", "Es el área de la ventana, que justamente no se pinta.", false], ["B", "13,2 m².", "Área de la pared: 6 × 2,5 = 15 m²; área de la ventana: 1,5 × 1,2 = 1,8 m². Se pintan 15 − 1,8 = 13,2 m².", true], ["C", "15 m².", "Es el área total de la pared; falta restar la ventana.", false], ["D", "16,8 m².", "Suma el área de la ventana en lugar de restarla.", false]]}, {"id": "MTA-204", "niv": 3, "cp": "mt_formulacion", "cn": "", "e": "El pintor también pintará otra pared rectangular, sin ventanas, de 5 m de largo y 3,2 m de alto. Necesita dos manos de pintura y cada galón alcanza para cubrir 12 m² en una mano. Si la pintura solo se vende por galones completos, ¿cuántos galones debe comprar como mínimo para esa pared?", "f": "Cálculo propio", "vis": "", "o": [["A", "1 galón.", "Calcula para una sola mano y redondea hacia abajo: 16 ÷ 12 ≈ 1,3.", false], ["B", "2 galones.", "Redondea hacia abajo 2,67 galones; con 2 galones solo se cubren 24 m² y se necesitan 32 m².", false], ["C", "3 galones.", "El área es 5 × 3,2 = 16 m²; con dos manos se cubren 32 m², y 32 ÷ 12 ≈ 2,67 galones, así que se deben comprar 3 galones completos.", true], ["D", "4 galones.", "Redondea cada mano por separado (16 ÷ 12 ≈ 1,3 → 2 galones por mano); la pintura que sobra de la primera mano sirve para la segunda, así que con 3 galones basta.", false]]}, {"id": "MTA-205", "niv": 2, "cp": "mt_argumentacion", "cn": "", "e": "El dueño de la casa afirma que, si la ventana tuviera el doble de ancho y el doble de alto, su área sería el doble. ¿Es correcta su afirmación?", "f": "Área y cambio de escala", "vis": "", "o": [["A", "No, porque la ventana mediría 3 m × 2,4 m, y su área sería 4 veces la original.", "La nueva ventana mide 3 m × 2,4 m = 7,2 m², que es 4 veces el área original de 1,5 × 1,2 = 1,8 m².", true], ["B", "No, porque al duplicar el ancho y el alto el área se triplica: una vez por cada dimensión, más la original.", "Los factores de cada dimensión se multiplican, no se suman: el área queda multiplicada por 2 × 2 = 4.", false], ["C", "Sí, porque el área es proporcional al ancho, y el ancho pasaría de 1,5 m a 3 m.", "El área es proporcional al ancho solo si el alto no cambia; al duplicar también el alto, el área se multiplica por 2 × 2 = 4.", false], ["D", "Sí, porque el perímetro de la ventana pasaría de 5,4 m a 10,8 m, que es justo el doble.", "Es cierto que el perímetro se duplica, pero la afirmación es sobre el área, que se multiplica por 4.", false]]}]}, {"comp": "matematicas", "sim": "val-1", "ses": 2, "ind": "Tarifa de un servicio técnico", "tt": "", "texto": "Un técnico de electrodomésticos cobra $ 50.000 por la visita a domicilio más $ 30.000 por cada hora de trabajo. El costo total C depende del número h de horas trabajadas: C = 50.000 + 30.000h.", "vis": "", "items": [{"id": "MTA-219", "niv": 1, "cp": "mt_interpretacion", "cn": "", "e": "Si se representa en una gráfica el costo total en función de las horas trabajadas, ¿qué representa el valor $ 50.000?", "f": "Interpretación de la función lineal", "vis": "", "o": [["A", "La pendiente de la recta, es decir, cuánto aumenta el costo por cada hora de trabajo.", "La pendiente es 30.000: es lo que aumenta el costo por cada hora adicional.", false], ["B", "El costo de una hora de trabajo, incluida la visita.", "Una hora de trabajo con la visita cuesta 50.000 + 30.000 = 80.000.", false], ["C", "El punto donde la recta corta el eje vertical, es decir, el costo cuando se trabajan 0 horas.", "Con h = 0, C = 50.000: es el valor inicial (cobro de la visita), que corresponde al corte con el eje vertical.", true], ["D", "El punto donde la recta corta el eje horizontal.", "El corte con el eje horizontal sería un costo de 0 pesos, que no ocurre: el costo mínimo es 50.000.", false]]}, {"id": "MTA-220", "niv": 2, "cp": "mt_formulacion", "cn": "", "e": "Un cliente pagó en total $ 155.000. ¿Cuántas horas trabajó el técnico?", "f": "Ecuación lineal", "vis": "", "o": [["A", "3 horas.", "Con 3 horas el costo sería 50.000 + 90.000 = 140.000, menos de lo pagado.", false], ["B", "3,5 horas.", "Se resuelve 50.000 + 30.000h = 155.000: 30.000h = 105.000, h = 3,5 horas.", true], ["C", "4 horas.", "Con 4 horas el costo sería 50.000 + 120.000 = 170.000, más de lo pagado.", false], ["D", "5,2 horas.", "Divide 155.000 entre 30.000 sin restar primero el cobro de la visita.", false]]}]}, {"comp": "matematicas", "sim": "val-1", "ses": 2, "ind": "Control de piezas defectuosas", "tt": "", "texto": "En una fábrica de tornillos, un inspector revisó una muestra aleatoria de 500 piezas y encontró 15 defectuosas.", "vis": "", "items": [{"id": "MTA-221", "niv": 1, "cp": "mt_formulacion", "cn": "", "e": "Si el proceso de producción no cambia, ¿cuántas piezas defectuosas se esperan en un lote de 8.000 piezas?", "f": "Proporcionalidad e inferencia", "vis": "", "o": [["A", "15 piezas.", "Es el número de defectuosas de la muestra de 500, no del lote de 8.000.", false], ["B", "120 piezas.", "Usa una tasa de 1,5 % en lugar de 3 % (15 ÷ 500 = 0,03).", false], ["C", "240 piezas.", "La proporción de defectuosas es 15 ÷ 500 = 3 %; el 3 % de 8.000 es 240.", true], ["D", "7.760 piezas.", "Es el número esperado de piezas en buen estado (8.000 − 240).", false]]}]}, {"comp": "matematicas", "sim": "val-1", "ses": 2, "ind": "Marco triangular con listones", "tt": "", "texto": "Un carpintero tiene tres listones de madera de 30 cm, 45 cm y 80 cm, y quiere unirlos por sus extremos, sin cortarlos, para formar un marco triangular.", "vis": "", "items": [{"id": "MTA-222", "niv": 3, "cp": "mt_argumentacion", "cn": "", "e": "El carpintero afirma que con esos tres listones sí puede formar el marco triangular. ¿Es correcta su afirmación?", "f": "Desigualdad triangular", "vis": "", "o": [["A", "No, porque los dos listones cortos suman 30 + 45 = 75 cm, menos que el largo, de 80 cm.", "Por la desigualdad triangular, cada lado debe ser menor que la suma de los otros dos; como 75 < 80, los extremos no alcanzan a unirse.", true], ["B", "No, porque para formar un triángulo dos lados deben ser iguales, y 30, 45 y 80 son distintos.", "Falso: existen triángulos escalenos, con los tres lados de distinta medida.", false], ["C", "Sí, porque los tres listones suman 30 + 45 + 80 = 155 cm, más que los 80 cm del más largo.", "La condición correcta compara el lado mayor con la suma de los otros dos (75 cm), no con la suma de los tres.", false], ["D", "Sí, porque 80 − 45 = 35 cm, que es mayor que los 30 cm del listón más corto.", "El cálculo es correcto, pero lleva a la conclusión contraria: si 80 − 45 supera a 30, el listón más corto no alcanza a cerrar el triángulo.", false]]}]}, {"comp": "matematicas", "sim": "val-1", "ses": 2, "ind": "Plano de una bodega", "tt": "", "texto": "El plano de una bodega rectangular está dibujado a escala 1 : 200. En el plano, la bodega mide 15 cm de largo y 9 cm de ancho.", "vis": "", "items": [{"id": "MTA-226", "niv": 1, "cp": "mt_formulacion", "cn": "", "e": "¿Cuál es el área real de la bodega?", "f": "Escalas y área", "vis": "", "o": [["A", "2,7 m².", "Multiplica el área del plano (135 cm²) por 200 una sola vez; el factor de escala se aplica a cada una de las dos dimensiones.", false], ["B", "96 m².", "Es el perímetro real (2 × 30 + 2 × 18 = 96 m), no el área.", false], ["C", "135 m².", "Es el área del plano (15 × 9 = 135) expresada en m², sin aplicar la escala.", false], ["D", "540 m².", "Medidas reales: 15 × 200 = 3.000 cm = 30 m y 9 × 200 = 1.800 cm = 18 m. Área: 30 × 18 = 540 m².", true]]}, {"id": "MTA-227", "niv": 1, "cp": "mt_interpretacion", "cn": "", "e": "En la bodega se instalará una estantería de 4 m de largo. ¿Cuánto debe medir su largo en el plano?", "f": "Escalas", "vis": "", "o": [["A", "0,2 cm.", "Convierte 4 m en 40 cm en lugar de 400 cm antes de dividir entre 200.", false], ["B", "2 cm.", "4 m = 400 cm; en el plano, 400 ÷ 200 = 2 cm.", true], ["C", "8 cm.", "Multiplica 4 × 2 sin hacer la conversión de unidades ni dividir entre la escala.", false], ["D", "20 cm.", "Divide 4.000 entre 200, como si 4 m fueran 4.000 cm.", false]]}]}, {"comp": "matematicas", "sim": "val-1", "ses": 2, "ind": "Control de calidad en una planta empacadora", "tt": "", "texto": "En una planta se empacan bolsas de arroz que deben pesar 500 g. Un supervisor pesó 5 bolsas de cada una de las dos máquinas empacadoras. La tabla muestra los resultados.", "vis": "<table class=\"vt\"><caption>Tabla 7. Peso de las bolsas (gramos)<\/caption><thead><tr><th>Bolsa<\/th><th>1<\/th><th>2<\/th><th>3<\/th><th>4<\/th><th>5<\/th><\/tr><\/thead><tbody><tr><td>Máquina 1<\/td><td>498<\/td><td>500<\/td><td>502<\/td><td>499<\/td><td>501<\/td><\/tr><tr><td>Máquina 2<\/td><td>490<\/td><td>510<\/td><td>495<\/td><td>505<\/td><td>500<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Datos ficticios.<\/div>", "items": [{"id": "MTA-228", "niv": 1, "cp": "mt_interpretacion", "cn": "", "e": "¿Qué se puede afirmar a partir de los datos de la tabla?", "f": "Medidas de tendencia central y de dispersión", "vis": "", "o": [["A", "Las dos máquinas tienen el mismo peso promedio, y sus pesos están igual de dispersos alrededor de él.", "El promedio es igual, pero el rango de la máquina 2 (20 g) es mucho mayor que el de la máquina 1 (4 g).", false], ["B", "La máquina 1 tiene un peso promedio menor que la máquina 2, porque su peso máximo es menor.", "Su peso máximo es menor, pero también su peso mínimo es mayor; ambas promedian 500 g.", false], ["C", "Las dos máquinas tienen el mismo peso promedio, pero los pesos de la máquina 1 están menos dispersos.", "Ambas suman 2.500 g, así que el promedio es 500 g en las dos; los pesos de la máquina 1 varían entre 498 y 502 g, y los de la máquina 2, entre 490 y 510 g.", true], ["D", "La máquina 2 tiene un peso promedio mayor, porque en ella se registró el peso más alto.", "Tener el dato más alto no implica tener mayor promedio; ambas máquinas promedian 500 g.", false]]}, {"id": "MTA-229", "niv": 3, "cp": "mt_formulacion", "cn": "", "e": "La varianza de un conjunto de datos es el promedio de los cuadrados de las diferencias entre cada dato y la media. ¿Cuál es la varianza de los pesos de la máquina 1?", "f": "Varianza", "vis": "", "o": [["A", "0 g².", "Es la suma de las diferencias sin elevarlas al cuadrado (−2 + 0 + 2 − 1 + 1 = 0), que siempre da cero.", false], ["B", "1,4 g².", "Es aproximadamente la desviación estándar (√2 ≈ 1,4 g), la raíz de la varianza.", false], ["C", "2 g².", "Diferencias con la media (500): −2, 0, 2, −1, 1. Cuadrados: 4, 0, 4, 1, 1, que suman 10; 10 ÷ 5 = 2 g².", true], ["D", "10 g².", "Suma los cuadrados de las diferencias pero olvida dividir entre el número de datos.", false]]}, {"id": "MTA-230", "niv": 3, "cp": "mt_argumentacion", "cn": "", "e": "Un técnico ajusta la máquina 2 de modo que cada bolsa pese 3 g más que antes, y afirma que la varianza de sus pesos no cambia. ¿Es correcta su afirmación?", "f": "Propiedades de la varianza", "vis": "", "o": [["A", "No, porque la varianza sube 3² = 9 g², ya que en ella se elevan al cuadrado las diferencias.", "Lo que se eleva al cuadrado son las diferencias con la media, y estas no cambian; por eso la varianza sigue igual.", false], ["B", "No, porque si cada peso sube 3 g, la varianza de los pesos también sube 3 g².", "Sumar una constante desplaza los datos pero no cambia su separación; la varianza no aumenta.", false], ["C", "Sí, porque al sumar 3 g a todas las bolsas la media de sus pesos no cambia.", "La conclusión es correcta, pero la razón es falsa: la media sí cambia, aumenta 3 g.", false], ["D", "Sí, porque la media también sube 3 g y cada diferencia entre un dato y la media queda igual.", "Si cada dato y la media aumentan 3 g, cada diferencia (dato − media) es igual que antes; por tanto, el promedio de sus cuadrados, la varianza, no cambia.", true]]}]}, {"comp": "matematicas", "sim": "val-1", "ses": 2, "ind": "Andén alrededor de una fuente", "tt": "", "texto": "En un parque hay una fuente circular de 6 m de diámetro. Alrededor de ella se construirá un andén de 1 m de ancho, como muestra la figura. Use π ≈ 3,14.", "vis": "<div class=\"vfig\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 380 210\" width=\"380\" height=\"210\" font-family=\"Arial, sans-serif\" font-size=\"14\"><rect width=\"380\" height=\"210\" fill=\"#ffffff\"/><circle cx=\"190\" cy=\"105\" r=\"88\" fill=\"#e6e1d6\" stroke=\"#1d2433\" stroke-width=\"2\"/><circle cx=\"190\" cy=\"105\" r=\"66\" fill=\"#dce8f5\" stroke=\"#1d2433\" stroke-width=\"2\"/><line x1=\"124\" y1=\"105\" x2=\"256\" y2=\"105\" stroke=\"#1d2433\" stroke-width=\"1.5\" stroke-dasharray=\"5,4\"/><text x=\"190\" y=\"98\" text-anchor=\"middle\" fill=\"#1d2433\">6 m<\/text><text x=\"190\" y=\"130\" text-anchor=\"middle\" fill=\"#1d2433\">fuente<\/text><line x1=\"256\" y1=\"105\" x2=\"278\" y2=\"105\" stroke=\"#c0392b\" stroke-width=\"2\"/><text x=\"300\" y=\"100\" fill=\"#1d2433\">1 m<\/text><text x=\"190\" y=\"30\" text-anchor=\"middle\" fill=\"#1d2433\">andén<\/text><\/svg><\/div>", "items": [{"id": "MTA-234", "niv": 2, "cp": "mt_formulacion", "cn": "", "e": "¿Cuál es el área del andén?", "f": "Área del círculo", "vis": "", "o": [["A", "3,14 m².", "Calcula el área de un círculo de 1 m de radio, tomando el ancho del andén como radio.", false], ["B", "18,84 m².", "Es la longitud del borde de la fuente (2 × 3,14 × 3), una medida en metros y no un área.", false], ["C", "21,98 m².", "El andén es la región entre dos círculos de radios 4 m y 3 m: 3,14 × (4² − 3²) = 3,14 × 7 = 21,98 m².", true], ["D", "28,26 m².", "Es el área de la fuente (3,14 × 3²), no la del andén.", false]]}, {"id": "MTA-235", "niv": 2, "cp": "mt_interpretacion", "cn": "", "e": "Si el andén tuviera un ancho de a metros en lugar de 1 m, ¿cuál expresión representaría su área, en metros cuadrados?", "f": "Expresiones algebraicas y área del círculo", "vis": "", "o": [["A", "π(a² + 6a).", "El radio exterior sería 3 + a, así que el área es π(3 + a)² − π · 3² = π(9 + 6a + a² − 9) = π(a² + 6a). Con a = 1 da 7π, como en el caso.", true], ["B", "π(a² + 9).", "Suma las áreas de radios a y 3 en lugar de restar el área de la fuente al área del círculo exterior.", false], ["C", "2π(3 + a).", "Es la longitud del borde exterior del andén, no su área.", false], ["D", "πa².", "Es el área de un círculo de radio a; el andén no es un círculo, sino un anillo alrededor de la fuente.", false]]}]}, {"comp": "matematicas", "sim": "val-1", "ses": 2, "ind": "Códigos de identificación de empleados", "tt": "", "texto": "Una empresa asigna a cada empleado un código formado por una letra, escogida entre A, B, C, D y E, seguida de dos dígitos (del 0 al 9). Por ejemplo: B07 o E55.", "vis": "", "items": [{"id": "MTA-238", "niv": 1, "cp": "mt_formulacion", "cn": "", "e": "¿Cuántos códigos diferentes se pueden formar?", "f": "Principio de multiplicación", "vis": "", "o": [["A", "25 códigos.", "Suma las posibilidades (5 + 10 + 10) en lugar de multiplicarlas.", false], ["B", "50 códigos.", "Multiplica solo la letra por un dígito (5 × 10); falta el segundo dígito.", false], ["C", "500 códigos.", "Por el principio de multiplicación: 5 letras × 10 dígitos × 10 dígitos = 500 códigos.", true], ["D", "1.000 códigos.", "Es 10³, como si las tres posiciones fueran dígitos; la primera posición solo admite 5 letras.", false]]}, {"id": "MTA-239", "niv": 3, "cp": "mt_formulacion", "cn": "", "e": "Si se exige que los dos dígitos del código sean diferentes, ¿cuántos códigos se pueden formar?", "f": "Principio de multiplicación (sin repetición)", "vis": "", "o": [["A", "450 códigos.", "Hay 5 opciones para la letra, 10 para el primer dígito y 9 para el segundo (que no puede repetir el primero): 5 × 10 × 9 = 450.", true], ["B", "490 códigos.", "Resta solo 10 códigos (00, 11, …, 99) una vez; esos 10 casos repetidos se presentan con cada una de las 5 letras, así que hay que restar 50.", false], ["C", "495 códigos.", "Resta un código con dígitos repetidos por cada letra (5); en realidad hay 10 por cada letra (00, 11, …, 99).", false], ["D", "500 códigos.", "Es el total sin restricción; no descuenta los códigos con dígitos repetidos.", false]]}]}, {"comp": "matematicas", "sim": "val-1", "ses": 2, "ind": "Utilidad de un taller de muebles", "tt": "", "texto": "La utilidad mensual U, en miles de pesos, de un taller que fabrica x sillas al mes está dada por U(x) = −x² + 40x − 300. La tabla muestra algunos valores.", "vis": "<table class=\"vt\"><caption>Tabla 8. Utilidad mensual del taller<\/caption><thead><tr><th>Sillas (x)<\/th><th>10<\/th><th>15<\/th><th>20<\/th><th>25<\/th><th>30<\/th><\/tr><\/thead><tbody><tr><td>Utilidad U(x) (miles de pesos)<\/td><td>0<\/td><td>75<\/td><td>100<\/td><td>75<\/td><td>0<\/td><\/tr><\/tbody><\/table>", "items": [{"id": "MTA-240", "niv": 2, "cp": "mt_interpretacion", "cn": "", "e": "¿Para qué cantidades de sillas el taller obtiene utilidad positiva?", "f": "Función cuadrática: ceros y signo", "vis": "", "o": [["A", "Exactamente 20 sillas.", "Con 20 sillas la utilidad es máxima (100 mil pesos), pero también es positiva con otras cantidades, como 15 o 25.", false], ["B", "Más de 30 sillas.", "Después de 30 sillas la utilidad es negativa: por ejemplo, U(35) = −125.", false], ["C", "Más de 0 y menos de 20 sillas.", "Con menos de 10 sillas la utilidad es negativa: por ejemplo, U(5) = −25 + 200 − 300 = −125.", false], ["D", "Más de 10 y menos de 30 sillas.", "U(10) = 0 y U(30) = 0; la parábola abre hacia abajo, así que entre 10 y 30 sillas los valores son positivos (por ejemplo, 75, 100 y 75).", true]]}, {"id": "MTA-241", "niv": 2, "cp": "mt_formulacion", "cn": "", "e": "Recuerde que U está en miles de pesos. ¿Cuál es la utilidad del taller si fabrica 12 sillas en un mes?", "f": "Evaluación de una función cuadrática", "vis": "", "o": [["A", "$ 36.000.", "U(12) = −144 + 480 − 300 = 36 mil pesos, es decir, $ 36.000.", true], ["B", "$ 180.000.", "Omite el término −x²: 480 − 300 = 180.", false], ["C", "$ 324.000.", "Toma −12² como +144: 144 + 480 − 300 = 324.", false], ["D", "$ 924.000.", "Suma todos los términos sin tener en cuenta los signos: 144 + 480 + 300.", false]]}, {"id": "MTA-242", "niv": 3, "cp": "mt_argumentacion", "cn": "", "e": "El administrador razona: «Con 20 sillas obtenemos la utilidad máxima; si fabricamos 40, el doble, la utilidad también será el doble». ¿Es correcto su razonamiento?", "f": "Función cuadrática: máximo", "vis": "", "o": [["A", "No, porque U(40) = 0, ya que 40 sillas está por fuera de los valores de la tabla.", "Que un valor no esté en la tabla no lo hace cero; al evaluar la fórmula, U(40) = −300.", false], ["B", "No, porque U(40) = −300, es decir, con 40 sillas el taller pierde $ 300.000.", "Al evaluar: −40² + 40 × 40 − 300 = −1.600 + 1.600 − 300 = −300 mil pesos, una pérdida.", true], ["C", "Sí, porque la utilidad es proporcional al número de sillas fabricadas.", "La utilidad no es proporcional: está dada por una función cuadrática, no por una función de la forma U = kx.", false], ["D", "Sí, porque U(40) = 200, el doble de la utilidad máxima, que es 100.", "U(40) = −1.600 + 1.600 − 300 = −300, no 200; además, si 100 es la utilidad máxima, ningún valor puede ser mayor.", false]]}]}, {"comp": "matematicas", "sim": "val-1", "ses": 2, "ind": "Empaque en forma de pirámide", "tt": "", "texto": "Una fábrica de chocolates diseñó un empaque con forma de pirámide de base cuadrada, como el de la figura.", "vis": "<div class=\"vfig\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 190\" width=\"360\" height=\"190\" font-family=\"Arial, sans-serif\" font-size=\"13\"><rect width=\"360\" height=\"190\" fill=\"#ffffff\"/><polyline points=\"80,160 230,160 290,115\" fill=\"none\" stroke=\"#1d2433\" stroke-width=\"2\"/><polygon points=\"185,25 80,160 230,160\" fill=\"none\" stroke=\"#1d2433\" stroke-width=\"2\"/><polygon points=\"185,25 230,160 290,115\" fill=\"none\" stroke=\"#1d2433\" stroke-width=\"2\"/><line x1=\"80\" y1=\"160\" x2=\"140\" y2=\"115\" stroke=\"#3a4356\" stroke-width=\"1.5\" stroke-dasharray=\"5,4\"/><line x1=\"140\" y1=\"115\" x2=\"290\" y2=\"115\" stroke=\"#3a4356\" stroke-width=\"1.5\" stroke-dasharray=\"5,4\"/><line x1=\"185\" y1=\"25\" x2=\"140\" y2=\"115\" stroke=\"#3a4356\" stroke-width=\"1.5\" stroke-dasharray=\"5,4\"/><text x=\"180\" y=\"182\" text-anchor=\"middle\" fill=\"#1d2433\">base cuadrada<\/text><\/svg><\/div>", "items": [{"id": "MTA-231", "niv": 2, "cp": "mt_interpretacion", "cn": "", "e": "La fábrica diseñará otro empaque con forma de pirámide, pero de base hexagonal. ¿Cuántas caras, aristas y vértices tendrá ese nuevo empaque?", "f": "Elementos de los poliedros", "vis": "", "o": [["A", "7 caras, 12 aristas y 6 vértices.", "Cuenta solo los 6 vértices de la base y olvida el vértice superior (cúspide).", false], ["B", "8 caras, 18 aristas y 12 vértices.", "Son los elementos de un prisma de base hexagonal, no de una pirámide.", false], ["C", "6 caras, 12 aristas y 7 vértices.", "Cuenta solo las 6 caras laterales triangulares y olvida la base hexagonal.", false], ["D", "7 caras, 12 aristas y 7 vértices.", "Tiene 6 caras triangulares y la base (7 caras), 6 aristas en la base y 6 laterales (12 aristas), y 6 vértices en la base más la cúspide (7 vértices). Se cumple 7 − 12 + 7 = 2.", true]]}]}, {"comp": "sociales_ciudadanas", "sim": "val-1", "ses": 2, "ind": "Derecho de petición ante la alcaldía", "tt": "", "texto": "Jairo, maestro de obra de 45 años, envió una carta a la alcaldía de su municipio para preguntar por qué su familia no aparece en la lista de beneficiarios de un subsidio de vivienda, si cumple los requisitos. Han pasado tres meses y no ha recibido ninguna respuesta.", "vis": "", "items": [{"id": "SCA-201", "niv": 1, "cp": "sc_pensamiento_social", "cn": "", "e": "Al enviar la carta a la alcaldía, ¿qué derecho ejerció Jairo?", "f": "Constitución Política de Colombia, arts. 23, 30 y 103.", "vis": "", "o": [["A", "El derecho al habeas corpus.", "El habeas corpus protege a quien está privado ilegalmente de la libertad (art. 30); Jairo no está detenido.", false], ["B", "El derecho de petición ante las autoridades.", "Correcta. El artículo 23 de la Constitución dice que toda persona tiene derecho a presentar peticiones respetuosas a las autoridades por motivos de interés general o particular y a obtener pronta resolución.", true], ["C", "El derecho a la revocatoria del mandato del alcalde.", "La revocatoria del mandato es un mecanismo para retirar del cargo a un alcalde o gobernador; Jairo solo pidió información sobre un subsidio.", false], ["D", "El derecho a convocar un cabildo abierto.", "El cabildo abierto es una reunión pública de un concejo o junta administradora local; Jairo hizo una solicitud individual por escrito.", false]]}, {"id": "SCA-202", "niv": 2, "cp": "sc_pensamiento_social", "cn": "", "e": "Como la alcaldía no le responde, ¿qué mecanismo judicial puede usar Jairo para que un juez proteja su derecho a obtener una respuesta?", "f": "Constitución Política de Colombia, arts. 23, 86, 88 y 103.", "vis": "", "o": [["A", "La acción de tutela.", "Correcta. El derecho de petición es un derecho fundamental (capítulo 1 del título II); cuando una autoridad no responde, la tutela (art. 86) permite pedir a un juez su protección inmediata.", true], ["B", "El plebiscito.", "El plebiscito lo convoca el Presidente para que el pueblo apoye o rechace una decisión del Ejecutivo; no protege derechos individuales.", false], ["C", "La acción popular.", "La acción popular protege derechos colectivos como el ambiente o el espacio público; aquí se vulnera el derecho individual de Jairo a obtener respuesta.", false], ["D", "La revocatoria del mandato.", "La revocatoria del mandato es un mecanismo de participación para retirar del cargo a un alcalde; no es una acción judicial ni obliga a responder la petición de Jairo.", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "val-1", "ses": 2, "ind": "Propuesta de trabajo en casa", "tt": "", "texto": "Una empresa de servicios propone que sus 200 empleados de oficina trabajen desde la casa tres días a la semana. Estas son algunas reacciones:\n\nGerente: «Ahorraremos en arriendo y energía, y los empleados ganarán tiempo al no desplazarse».\n\nMadre cabeza de familia: «Me ahorraría dos horas diarias de bus y podría estar más pendiente de mis hijos».\n\nRepresentante del sindicato: «Estamos de acuerdo si la empresa paga parte del internet y la energía que usaremos en la casa, y si respeta el horario: no queremos recibir mensajes a medianoche».\n\nDueña de un restaurante frente a la oficina: «Si los empleados no vienen, perderé buena parte de mis clientes del almuerzo».", "vis": "", "items": [{"id": "SCA-209", "niv": 1, "cp": "sc_perspectivas", "cn": "", "e": "¿Qué beneficio de la propuesta reconocen tanto el gerente como la madre cabeza de familia?", "f": "Análisis de las posiciones del caso.", "vis": "", "o": [["A", "El aumento de clientes en los restaurantes cercanos.", "La dueña del restaurante teme lo contrario: perder clientes.", false], ["B", "El ahorro de la empresa en arriendo y energía.", "Ese beneficio lo menciona solo el gerente; la madre no habla de los gastos de la empresa.", false], ["C", "El pago del internet por parte de la empresa.", "Es una condición que pide el sindicato, no un beneficio que mencionen el gerente o la madre.", false], ["D", "El ahorro de tiempo en los desplazamientos.", "Correcta. El gerente dice que los empleados ganarán tiempo al no desplazarse y la madre menciona que se ahorraría dos horas diarias de bus.", true]]}, {"id": "SCA-210", "niv": 2, "cp": "sc_perspectivas", "cn": "", "e": "¿Qué ajuste a la propuesta haría más probable que el sindicato la apoyara?", "f": "Relación entre perspectivas y propuestas de solución.", "vis": "", "o": [["A", "Que los empleados almuercen en el restaurante de enfrente los días de oficina.", "Esto atendería la preocupación de la dueña del restaurante, no la del sindicato.", false], ["B", "Que la empresa asuma algunos costos del trabajo remoto y limite los contactos fuera de la jornada.", "Correcta. El sindicato dice estar de acuerdo si la empresa paga parte del internet y la energía y respeta el horario; ese ajuste atiende sus dos condiciones.", true], ["C", "Que la empresa ahorre más en arriendo trasladándose a una oficina más pequeña y lejana.", "El ahorro de la empresa es un interés del gerente; no responde a las condiciones del sindicato.", false], ["D", "Que el trabajo en casa sea de cinco días y no de tres días a la semana.", "Aumentar los días en casa no resuelve los gastos ni el respeto del horario que reclama el sindicato.", false]]}, {"id": "SCA-211", "niv": 2, "cp": "sc_reflexivo_sistemico", "cn": "", "e": "¿Qué muestra la intervención de la dueña del restaurante sobre los efectos de la decisión?", "f": "Análisis de efectos de una decisión en distintos actores.", "vis": "", "o": [["A", "Que la dueña del restaurante apoyaría la propuesta si la empresa le paga sus pérdidas.", "La dueña del restaurante no plantea ninguna condición ni pide compensación; solo anticipa que perderá clientes.", false], ["B", "Que el trabajo en casa aumenta las ventas de los negocios ubicados cerca de las oficinas.", "La dueña del restaurante anticipa lo contrario: una caída en sus ventas.", false], ["C", "Que la decisión de la empresa tiene efectos sobre actores externos a ella.", "Correcta. La dueña del restaurante no es parte de la empresa, pero la decisión reduciría sus clientes: los efectos de una medida pueden alcanzar a otros actores de la economía local.", true], ["D", "Que los efectos de la propuesta se limitan a los empleados de la oficina.", "La intervención de la dueña del restaurante muestra justamente que hay efectos fuera de la empresa.", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "val-1", "ses": 2, "ind": "Préstamos «gota a gota»", "tt": "", "texto": "En la puerta de una tienda de barrio apareció este aviso:\n\n«¿NECESITA PLATA YA? Préstamos inmediatos. Sin papeles, sin fiador, sin consultar centrales de riesgo. Usted paga una cuota diaria pequeñita. ¡Llame ya!»\n\nVarias familias del barrio que tomaron estos préstamos cuentan que terminaron pagando mucho más de lo que recibieron, porque los intereses eran muy altos, y que los cobradores las amenazaban cuando se atrasaban.", "vis": "", "items": [{"id": "SCA-214", "niv": 2, "cp": "sc_perspectivas", "cn": "", "e": "¿Qué estrategia usa el aviso para atraer clientes?", "f": "Análisis de la intención comunicativa de un texto publicitario ficticio.", "vis": "", "o": [["A", "Advierte a los clientes que comparen ofertas de varios bancos antes de endeudarse.", "El aviso invita a «llamar ya»; no recomienda comparar opciones.", false], ["B", "Presenta testimonios de familias que pagaron el préstamo sin ninguna dificultad.", "El aviso no incluye testimonios; los relatos de las familias aparecen aparte y son negativos.", false], ["C", "Explica con detalle la tasa de interés y las consecuencias de atrasarse en los pagos.", "El aviso no menciona la tasa de interés ni las consecuencias del atraso; precisamente las omite.", false], ["D", "Destaca la facilidad y rapidez del préstamo y omite cuánto se paga en total.", "Correcta. El aviso resalta que el dinero es inmediato, sin requisitos y con «cuota pequeñita», pero no informa la tasa de interés ni el valor total que se termina pagando.", true]]}, {"id": "SCA-215", "niv": 2, "cp": "sc_reflexivo_sistemico", "cn": "", "e": "Según los relatos de las familias, ¿en qué dimensiones afecta este tipo de préstamos a quienes los toman?", "f": "Análisis de dimensiones de una problemática social.", "vis": "", "o": [["A", "En la económica, por el sobrecosto de los intereses, y en la de seguridad, por las amenazas.", "Correcta. Las familias cuentan que pagaron mucho más de lo recibido (dimensión económica) y que los cobradores las amenazaban (seguridad e integridad personal).", true], ["B", "En la de seguridad, por las amenazas, y en la jurídica, por los reportes en centrales de riesgo.", "Las amenazas sí aparecen, pero no los reportes: el aviso dice que estos préstamos se dan sin consultar centrales de riesgo, y las familias no mencionan reportes.", false], ["C", "En la política, porque los prestamistas controlan la junta de acción comunal del barrio.", "Nada en el caso se refiere a la junta de acción comunal ni a la vida política del barrio.", false], ["D", "En la económica, por los intereses, y en la laboral, porque las familias pierden su empleo.", "El sobrecosto de los intereses sí aparece, pero los relatos no dicen que las familias pierdan el empleo.", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "val-1", "ses": 2, "ind": "Conflicto por el agua en una vereda", "tt": "", "texto": "En una vereda, el acueducto comunitario capta agua de una quebrada para abastecer a 120 familias. Una finca vecina instaló un sistema de riego para un cultivo de aguacate de exportación que toma agua de la misma quebrada, río arriba. En época seca, el agua no alcanza para todos.\n\nPresidenta del acueducto: «El agua es primero para el consumo de las familias. Desde que llegó el riego, los tanques quedan vacíos en la tarde».\n\nAdministrador de la finca: «Tenemos permiso de la corporación ambiental y damos trabajo a 40 personas de la vereda. Sin riego, el cultivo se pierde».\n\nTrabajador de la finca: «Vivo en la vereda: necesito el empleo, pero también necesito agua en mi casa».", "vis": "", "items": [{"id": "SCA-216", "niv": 1, "cp": "sc_perspectivas", "cn": "", "e": "¿Qué argumento usa el administrador de la finca para defender el riego?", "f": "Análisis de las posiciones del caso.", "vis": "", "o": [["A", "Que el acueducto comunitario capta más agua de la que necesita.", "El administrador no acusa al acueducto de captar agua de más.", false], ["B", "Que tiene permiso de la autoridad ambiental y genera empleo en la vereda.", "Correcta. El administrador afirma que tienen permiso de la corporación ambiental y que dan trabajo a 40 personas de la vereda.", true], ["C", "Que el aguacate requiere menos agua que los cultivos tradicionales.", "El administrador no compara el consumo del aguacate con el de otros cultivos.", false], ["D", "Que el agua debe usarse primero para el consumo de las familias.", "Ese es el argumento de la presidenta del acueducto, no el del administrador.", false]]}, {"id": "SCA-217", "niv": 2, "cp": "sc_perspectivas", "cn": "", "e": "¿Por qué la posición del trabajador de la finca es especialmente relevante para buscar una solución?", "f": "Comparación de perspectivas de actores.", "vis": "", "o": [["A", "Porque en su situación se reúnen los intereses de los dos lados del conflicto.", "Correcta. El trabajador depende del empleo de la finca y, como habitante de la vereda, necesita agua en su casa; su situación muestra que una solución debe atender las dos necesidades.", true], ["B", "Porque propone cerrar la finca y entregar las tierras al acueducto.", "El trabajador no propone cerrar la finca; dice que necesita el empleo.", false], ["C", "Porque representa a las 120 familias que reciben agua del acueducto.", "Quien habla por el acueducto es la presidenta; el trabajador habla de su propia situación.", false], ["D", "Porque es el único que tiene un permiso de la corporación ambiental.", "El permiso lo menciona el administrador para la finca, no el trabajador.", false]]}, {"id": "SCA-218", "niv": 1, "cp": "sc_reflexivo_sistemico", "cn": "", "e": "¿Qué dimensiones de la vida de la vereda se ven involucradas en este conflicto?", "f": "Análisis de dimensiones de una problemática.", "vis": "", "o": [["A", "La social, la turística y la de seguridad.", "El abastecimiento de las familias es social, pero el caso no menciona turismo ni problemas de seguridad.", false], ["B", "La ambiental, la cultural y la religiosa.", "La dimensión ambiental sí está presente, pero el caso no plantea aspectos culturales ni religiosos del agua.", false], ["C", "La ambiental, la económica y la social.", "Correcta. Está en juego un recurso natural (el agua de la quebrada), una actividad productiva que genera empleo y el abastecimiento de las familias.", true], ["D", "La económica, la electoral y la educativa.", "La dimensión económica sí está presente (empleos de la finca), pero el caso no trata de elecciones ni de educación.", false]]}, {"id": "SCA-219", "niv": 3, "cp": "sc_reflexivo_sistemico", "cn": "", "e": "¿Cuál de estas medidas atendería el consumo de las familias sin eliminar los empleos de la finca?", "f": "Análisis de alternativas de solución y sus efectos.", "vis": "", "o": [["A", "Suspender el riego de la finca durante toda la temporada seca de cada año.", "Garantizaría el agua de las familias, pero el administrador advierte que sin riego el cultivo se pierde, y con él los 40 empleos.", false], ["B", "Limitar el riego en época seca a un caudal medido, dejando pasar primero el agua del acueducto.", "Correcta. Un límite medido al riego en los meses secos asegura que el agua llegue primero al acueducto, y la finca puede seguir regando con el caudal restante, de modo que el cultivo y los empleos se mantienen.", true], ["C", "Trasladar el acueducto comunitario a otra quebrada que esté más lejos de la vereda y de la finca.", "Esta opción no resuelve el conflicto por la quebrada actual y supone costos que el caso no permite asumir; tampoco garantiza que la nueva fuente alcance.", false], ["D", "Mantener el riego como está, porque la finca tiene un permiso ambiental vigente.", "Mantendría los empleos, pero los tanques del acueducto seguirían quedando vacíos en época seca.", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "val-1", "ses": 2, "ind": "Independencia de la Nueva Granada", "tt": "", "texto": "Después de la reconquista española de 1816, el ejército patriota, que había cruzado los Andes desde los Llanos, derrotó a las tropas realistas en el puente de Boyacá. Pocos días después, los patriotas entraron a Santafé.", "vis": "", "items": [{"id": "SCA-223", "niv": 1, "cp": "sc_pensamiento_social", "cn": "", "e": "¿En qué fecha ocurrió la batalla descrita?", "f": "Historia de Colombia: Batalla de Boyacá (7 de agosto de 1819); Banco de la República, cronología del bicentenario.", "vis": "", "o": [["A", "El 20 de julio de 1810.", "El 20 de julio de 1810 es la fecha de los hechos que iniciaron el proceso de independencia en Santafé, no de la Batalla de Boyacá.", false], ["B", "El 3 de noviembre de 1903.", "El 3 de noviembre de 1903 corresponde a la separación de Panamá.", false], ["C", "El 9 de abril de 1948.", "El 9 de abril de 1948 fue asesinado Jorge Eliécer Gaitán; no tiene relación con la independencia.", false], ["D", "El 7 de agosto de 1819.", "Correcta. La Batalla de Boyacá, que selló la independencia de la Nueva Granada frente al dominio español, se libró el 7 de agosto de 1819.", true]]}]}, {"comp": "sociales_ciudadanas", "sim": "val-1", "ses": 2, "ind": "Deberes de la persona y del ciudadano", "tt": "", "texto": "Un comerciante comenta en una reunión de vecinos: «Pagar impuestos es un regalo que uno le hace al Estado; la Constitución solo habla de derechos, no de obligaciones de los ciudadanos».", "vis": "", "items": [{"id": "SCA-224", "niv": 1, "cp": "sc_pensamiento_social", "cn": "", "e": "Según la Constitución, ¿qué se puede responder al comerciante?", "f": "Constitución Política de Colombia, art. 95, num. 9.", "vis": "", "o": [["A", "Que el pago de impuestos es voluntario y depende de la voluntad de cada contribuyente.", "La Constitución no lo deja a la voluntad de cada persona: lo establece como un deber (art. 95).", false], ["B", "Que la Constitución obliga a pagar impuestos solo a quienes ocupan cargos públicos.", "La Constitución no limita este deber a los servidores públicos.", false], ["C", "Que contribuir a financiar los gastos del Estado es un deber constitucional.", "Correcta. El artículo 95, numeral 9, establece como deber de la persona y del ciudadano contribuir al financiamiento de los gastos e inversiones del Estado dentro de conceptos de justicia y equidad.", true], ["D", "Que solo las empresas extranjeras están obligadas por la Constitución a pagar impuestos.", "El deber del artículo 95 se refiere a la persona y al ciudadano en general, no solo a empresas extranjeras.", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "val-1", "ses": 2, "ind": "Lenguas en una escuela wayuu", "tt": "", "texto": "En una escuela de un territorio wayuu, en La Guajira, los docentes enseñan tanto en wayuunaiki, la lengua de la comunidad, como en castellano. Un visitante sostiene que en las escuelas del país solo puede usarse el castellano porque es el idioma oficial.", "vis": "", "items": [{"id": "SCA-226", "niv": 3, "cp": "sc_pensamiento_social", "cn": "", "e": "¿Qué establece la Constitución sobre esta situación?", "f": "Constitución Política de Colombia, arts. 7 y 10.", "vis": "", "o": [["A", "El castellano es la única lengua oficial y las demás solo pueden enseñarse como materias optativas.", "El artículo 10 reconoce como oficiales en sus territorios las lenguas de los grupos étnicos; no las reduce a materias optativas.", false], ["B", "Las lenguas de los grupos étnicos son oficiales en sus territorios, y su enseñanza allí será bilingüe.", "Correcta. El artículo 10 dice que el castellano es el idioma oficial, que las lenguas y dialectos de los grupos étnicos son también oficiales en sus territorios y que la enseñanza en comunidades con tradiciones lingüísticas propias será bilingüe.", true], ["C", "Las lenguas indígenas son oficiales en todo el territorio nacional al mismo nivel del castellano.", "El artículo 10 las reconoce como oficiales en sus territorios, no en todo el país.", false], ["D", "Cada escuela del país puede escoger libremente un idioma oficial distinto del castellano.", "La Constitución no permite que cualquier escuela fije otro idioma oficial; el reconocimiento se refiere a las lenguas de los grupos étnicos en sus territorios.", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "val-1", "ses": 2, "ind": "La Revolución Industrial", "tt": "", "texto": "Testimonio ficticio de un niño obrero, Inglaterra, hacia 1840: «Entro a la fábrica de hilados antes del amanecer y salgo cuando ya es de noche. El capataz nos castiga si nos dormimos junto a las máquinas. Mi padre era tejedor en su casa, pero ya nadie le compra telas porque las de la fábrica son más baratas».", "vis": "", "items": [{"id": "SCA-227", "niv": 2, "cp": "sc_pensamiento_social", "cn": "", "e": "¿Qué proceso histórico explica el cambio que vivió la familia del niño?", "f": "Historia universal: Revolución Industrial.", "vis": "", "o": [["A", "La sustitución de la producción artesanal por la producción mecanizada en fábricas.", "Correcta. Durante la Revolución Industrial, iniciada en Gran Bretaña en el siglo XVIII, las máquinas y las fábricas produjeron telas más baratas que los tejedores domésticos, que perdieron su mercado.", true], ["B", "El paso de la producción industrial a una economía basada solo en la agricultura.", "Es el proceso inverso: la industria desplazó a la producción doméstica, no la agricultura a la industria.", false], ["C", "La prohibición del trabajo infantil en todas las fábricas inglesas de la época.", "El testimonio muestra a un niño trabajando largas jornadas; no describe una prohibición.", false], ["D", "La llegada de la economía digital y del trabajo por medio de plataformas en internet.", "La economía digital es un fenómeno de finales del siglo XX y del XXI, no de 1840.", false]]}, {"id": "SCA-228", "niv": 2, "cp": "sc_perspectivas", "cn": "", "e": "¿Qué aspecto de las condiciones de trabajo de la época permite conocer este testimonio?", "f": "Análisis de fuentes primarias ficticias.", "vis": "", "o": [["A", "La protección que los sindicatos daban a los trabajadores menores de edad.", "No se menciona ningún sindicato ni protección; se describen castigos.", false], ["B", "Los altos salarios que recibían los niños por su trabajo nocturno en las fábricas de hilados.", "El testimonio no habla de salarios, y menos de que fueran altos.", false], ["C", "El descanso obligatorio de dos días a la semana para todos los obreros.", "Nada en el testimonio indica descanso; describe jornadas extensas.", false], ["D", "Las jornadas muy largas y la disciplina dura que se imponía a los niños en las fábricas.", "Correcta. El niño cuenta que trabaja desde antes del amanecer hasta la noche y que el capataz los castiga si se duermen.", true]]}, {"id": "SCA-229", "niv": 3, "cp": "sc_perspectivas", "cn": "", "e": "Un historiador quiere saber cuántos niños trabajaban en las fábricas inglesas en 1840. ¿Qué limitación tiene este testimonio para ese propósito?", "f": "Análisis crítico de fuentes: alcance de un testimonio.", "vis": "", "o": [["A", "Es una fuente secundaria, y para obtener cifras se necesitan fuentes primarias.", "El testimonio es una fuente primaria: lo da un protagonista de la época. Su limitación es el alcance, no el tipo de fuente.", false], ["B", "Proviene de un niño, y la edad del testigo hace que su relato no sea creíble.", "La edad del testigo puede influir en su relato, pero no lo invalida; además, la pregunta es por una cifra que ningún testimonio individual puede aportar.", false], ["C", "Menciona castigos, lo que muestra que el autor tenía interés en exagerar.", "Mencionar castigos no prueba que el testigo exagere; y aunque fuera exacto, el relato de una persona no permite saber cuántos niños trabajaban.", false], ["D", "Narra la experiencia de una persona y no aporta datos sobre el conjunto de las fábricas.", "Correcta. Un testimonio individual ilustra cómo se vivía el trabajo, pero para conocer cuántos niños trabajaban se necesitan fuentes como censos, informes oficiales o registros de las fábricas.", true]]}, {"id": "SCA-230", "niv": 2, "cp": "sc_reflexivo_sistemico", "cn": "", "e": "Durante la industrialización, muchas familias campesinas se trasladaron a las ciudades industriales en busca de empleo. ¿Qué efecto fue esperable en las ciudades?", "f": "Relación entre dimensiones económicas y sociales de la industrialización.", "vis": "", "o": [["A", "Una mejora inmediata de las viviendas obreras gracias a la abundancia de espacio en las ciudades.", "Con la llegada masiva de familias, el espacio escaseaba; la mejora no fue inmediata.", false], ["B", "Un crecimiento rápido de la población urbana que presionó la vivienda y los servicios.", "Correcta. La llegada masiva de trabajadores hizo crecer las ciudades más rápido que la construcción de viviendas y servicios, lo que generó hacinamiento y problemas de salubridad.", true], ["C", "La desaparición del trabajo asalariado en las ciudades industriales de Inglaterra.", "La industrialización expandió el trabajo asalariado; no lo hizo desaparecer.", false], ["D", "Una disminución de la población urbana porque las fábricas se ubicaron en el campo.", "El caso plantea el traslado hacia las ciudades industriales, por lo que la población urbana crecía.", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "val-1", "ses": 2, "ind": "Repartidores de plataformas digitales", "tt": "", "texto": "En una ciudad, miles de personas trabajan repartiendo pedidos en moto o bicicleta a través de aplicaciones.\n\nRepartidor: «Me gusta escoger mis horarios, pero si tengo un accidente no tengo quién me responda. Pago mi seguridad social con lo poco que gano».\n\nVocera de la aplicación: «Los repartidores son independientes: deciden cuándo y cuánto trabajan. Si los volviéramos empleados con horario fijo, perderían esa libertad y muchos quedarían por fuera».\n\nDueño de un restaurante: «Gracias a la aplicación vendo el doble, pero la comisión que me cobran es alta».", "vis": "", "items": [{"id": "SCA-232", "niv": 1, "cp": "sc_perspectivas", "cn": "", "e": "¿Qué tensión expresa el repartidor sobre su trabajo?", "f": "Análisis de las posiciones del caso.", "vis": "", "o": [["A", "Valora la protección ante accidentes, pero no puede escoger sus horarios.", "Es al revés: sí escoge sus horarios y es la protección ante accidentes lo que le falta.", false], ["B", "Valora tener un horario fijo, pero quisiera pagar menos seguridad social.", "El repartidor no tiene horario fijo ni lo pide; valora precisamente escoger sus horarios.", false], ["C", "Valora la libertad de horario, pero carece de protección ante un accidente.", "Correcta. El repartidor dice que le gusta escoger sus horarios, pero que si tiene un accidente no tiene quién le responda.", true], ["D", "Valora sus altos ingresos, pero le molesta la comisión de la aplicación.", "El repartidor dice que gana poco; la queja por la comisión es del dueño del restaurante.", false]]}, {"id": "SCA-233", "niv": 2, "cp": "sc_perspectivas", "cn": "", "e": "¿Qué argumento usa la vocera de la aplicación para oponerse a que los repartidores sean empleados con horario fijo?", "f": "Análisis de argumentos de los actores.", "vis": "", "o": [["A", "Que perderían la libertad de decidir cuándo trabajar y algunos quedarían sin trabajo.", "Correcta. La vocera afirma que, con horario fijo, perderían esa libertad y muchos quedarían por fuera.", true], ["B", "Que los repartidores no quieren escoger sus horarios ni trabajar de forma independiente.", "La vocera sostiene lo contrario: que valoran decidir cuándo y cuánto trabajan.", false], ["C", "Que los repartidores ya cuentan con un seguro de accidentes pagado por la empresa.", "La vocera no menciona ningún seguro; el repartidor, de hecho, dice que no tiene quién le responda.", false], ["D", "Que la comisión cobrada a los restaurantes es demasiado baja para pagar salarios.", "La vocera no habla de la comisión; la menciona el dueño del restaurante, quien la considera alta.", false]]}]}, {"comp": "sociales_ciudadanas", "sim": "val-1", "ses": 2, "ind": "Formalización de una microempresa", "tt": "", "texto": "Doña Gloria tiene un taller de confección con cuatro empleadas. Aún no está registrada ante la cámara de comercio ni paga seguridad social a sus trabajadoras. Un programa de la alcaldía ofrece asesoría gratuita y reducción temporal de algunos costos a los negocios que se formalicen.", "vis": "", "items": [{"id": "SCA-243", "niv": 1, "cp": "sc_reflexivo_sistemico", "cn": "", "e": "¿Qué busca principalmente el programa de la alcaldía?", "f": "Análisis de los objetivos de una política pública.", "vis": "", "o": [["A", "Que los talleres pequeños aumenten su producción para exportar a otros países.", "El programa ofrece asesoría y reducción de costos para formalizarse; no menciona exportaciones.", false], ["B", "Que los negocios informales paguen de inmediato todos los impuestos atrasados.", "El programa ofrece reducir temporalmente algunos costos; no exige pagos inmediatos de deudas pasadas.", false], ["C", "Que los negocios informales se registren y cumplan sus obligaciones legales.", "Correcta. El programa ofrece asesoría y reducción de costos a quienes se formalicen, es decir, a quienes se registren y cumplan sus obligaciones.", true], ["D", "Que doña Gloria contrate más empleadas con lo que ahorre en costos.", "El programa busca la formalización, no que los negocios aumenten su número de empleadas.", false]]}, {"id": "SCA-244", "niv": 2, "cp": "sc_reflexivo_sistemico", "cn": "", "e": "Si doña Gloria se formaliza, ¿qué efecto es esperable para sus trabajadoras y para su negocio?", "f": "Análisis de efectos de una decisión en distintas dimensiones.", "vis": "", "o": [["A", "Nada cambiaría para las trabajadoras, porque la formalización solo afecta a la dueña.", "La formalización incluye afiliar a las trabajadoras a la seguridad social, así que sí las afecta.", false], ["B", "Las trabajadoras tendrían seguridad social, y el taller asumiría nuevos costos.", "Correcta. Al formalizarse, el taller debe afiliar a sus trabajadoras a la seguridad social, lo que las protege, pero también implica costos que el programa busca aliviar temporalmente.", true], ["C", "Las trabajadoras perderían su seguridad social, y el taller ahorraría dinero.", "Las trabajadoras hoy no tienen seguridad social; con la formalización la obtendrían.", false], ["D", "El taller dejaría de pagar impuestos, y las trabajadoras ganarían menos.", "Formalizarse implica cumplir obligaciones, no dejar de pagarlas.", false]]}]}, {"comp": "ciencias_naturales", "sim": "val-1", "ses": 2, "ind": "Compost en una finca", "tt": "", "texto": "En una finca se hace compost amontonando restos de cosecha, hojas y estiércol. Después de varias semanas, el material se transforma en un abono oscuro que se usa en los cultivos. En el proceso participan hongos y bacterias.", "vis": "", "items": [{"id": "CNA-204", "niv": 1, "cp": "cn_uso_comprensivo", "cn": "biologico", "e": "¿Qué papel cumplen los hongos y las bacterias en la elaboración del compost?", "f": "Concepto: descomponedores y ciclos de la materia", "vis": "", "o": [["A", "Atacan a los cultivos como parásitos, y por eso el compost se debe usar en poca cantidad.", "Los organismos del compost actúan sobre materia muerta; no son los parásitos de los cultivos.", false], ["B", "Retiran del abono los nutrientes del suelo para que no crezcan malezas en los cultivos.", "Su efecto es el contrario: liberan nutrientes que quedan disponibles para las plantas.", false], ["C", "Fabrican materia orgánica a partir de la luz del sol, tal como lo hacen las plantas del cultivo.", "Los hongos y la mayoría de las bacterias del compost no hacen fotosíntesis; obtienen energía descomponiendo materia orgánica.", false], ["D", "Descomponen la materia orgánica y liberan nutrientes que las plantas pueden volver a usar.", "Son descomponedores: transforman restos orgánicos en sustancias más simples y devuelven nutrientes minerales al suelo, cerrando el ciclo de la materia.", true]]}]}, {"comp": "ciencias_naturales", "sim": "val-1", "ses": 2, "ind": "Ensayo de fertilizante en maíz", "tt": "", "texto": "Una asociación de agricultores ensayó cinco dosis de un fertilizante en cinco parcelas del mismo tamaño, una parcela por dosis. Todas se sembraron el mismo día con la misma semilla de maíz y recibieron el mismo riego. Al final se midió el rendimiento de cada parcela.", "vis": "<div class=\"vfig\"><svg class=\"vg\" viewBox=\"0 0 560 320\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Gráfica 9. Rendimiento del maíz según la dosis de fertilizante\" font-family=\"Arial, sans-serif\" font-size=\"12\"><rect width=\"560\" height=\"320\" fill=\"#ffffff\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"13\" fill=\"#1d2433\">Gráfica 9. Rendimiento del maíz según la dosis de fertilizante<\/text><line x1=\"60\" y1=\"258.0\" x2=\"540\" y2=\"258.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"262.0\" text-anchor=\"end\" fill=\"#3a4356\">0<\/text><line x1=\"60\" y1=\"221.0\" x2=\"540\" y2=\"221.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"225.0\" text-anchor=\"end\" fill=\"#3a4356\">1<\/text><line x1=\"60\" y1=\"184.0\" x2=\"540\" y2=\"184.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"188.0\" text-anchor=\"end\" fill=\"#3a4356\">2<\/text><line x1=\"60\" y1=\"147.0\" x2=\"540\" y2=\"147.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"151.0\" text-anchor=\"end\" fill=\"#3a4356\">3<\/text><line x1=\"60\" y1=\"110.0\" x2=\"540\" y2=\"110.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"114.0\" text-anchor=\"end\" fill=\"#3a4356\">4<\/text><line x1=\"60\" y1=\"73.0\" x2=\"540\" y2=\"73.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"77.0\" text-anchor=\"end\" fill=\"#3a4356\">5<\/text><line x1=\"60\" y1=\"36.0\" x2=\"540\" y2=\"36.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"40.0\" text-anchor=\"end\" fill=\"#3a4356\">6<\/text><line x1=\"60\" y1=\"258\" x2=\"540\" y2=\"258\" stroke=\"#3a4356\"/><line x1=\"60\" y1=\"258\" x2=\"60\" y2=\"36\" stroke=\"#3a4356\"/><text transform=\"translate(14,147.0) rotate(-90)\" text-anchor=\"middle\" fill=\"#3a4356\">Rendimiento (t/ha)<\/text><text x=\"300.0\" y=\"312\" text-anchor=\"middle\" fill=\"#3a4356\">Dosis de fertilizante (kg/ha)<\/text><text x=\"108.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">0<\/text><text x=\"204.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">50<\/text><text x=\"300.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">100<\/text><text x=\"396.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">150<\/text><text x=\"492.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">200<\/text><polyline fill=\"none\" stroke=\"#1660a8\" stroke-width=\"2.5\" points=\"108.0,147.0 204.0,102.6 300.0,69.3 396.0,58.2 492.0,61.9\"/><circle cx=\"108.0\" cy=\"147.0\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"108.0\" y=\"139.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">3<\/text><circle cx=\"204.0\" cy=\"102.6\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"204.0\" y=\"94.6\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">4,2<\/text><circle cx=\"300.0\" cy=\"69.3\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"300.0\" y=\"61.3\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">5,1<\/text><circle cx=\"396.0\" cy=\"58.2\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"396.0\" y=\"50.2\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">5,4<\/text><circle cx=\"492.0\" cy=\"61.9\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"492.0\" y=\"53.9\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">5,3<\/text><\/svg><\/div>", "items": [{"id": "CNA-210", "niv": 2, "cp": "cn_indagacion", "cn": "biologico", "e": "¿Qué conclusión se apoya en los resultados?", "f": "Indagación: interpretación de gráficas y conclusiones", "vis": "", "o": [["A", "El rendimiento aumentó con la dosis hasta 150 kg/ha, y con 200 kg/ha se mantuvo casi igual.", "El rendimiento sube de 3,0 a 5,4 t/ha entre 0 y 150 kg/ha; con 200 kg/ha es 5,3 t/ha, prácticamente el mismo valor (con una sola parcela por dosis, esa pequeña diferencia no es concluyente).", true], ["B", "El fertilizante tuvo poco efecto, porque la parcela sin fertilizante también produjo bastante maíz.", "Con 150 kg/ha el rendimiento fue 5,4 t/ha frente a 3,0 t/ha sin fertilizante: un aumento de 80 %, que no es un efecto pequeño.", false], ["C", "La dosis de 200 kg/ha fue la más rentable, porque es la que más fertilizante aporta al suelo.", "El ensayo no da información sobre costos ni precios, y con esa dosis el rendimiento no aumentó.", false], ["D", "Cuanto más fertilizante se aplique, más rendimiento se obtendrá, según la tendencia de la gráfica.", "Con 200 kg/ha el rendimiento no aumentó respecto a 150 kg/ha; la relación no es creciente en todo el rango.", false]]}, {"id": "CNA-211", "niv": 1, "cp": "cn_indagacion", "cn": "biologico", "e": "¿Para qué sirvió la parcela en la que no se aplicó fertilizante?", "f": "Indagación: grupo control", "vis": "", "o": [["A", "Para reemplazar a otra parcela en caso de que se perdiera su cosecha.", "Una parcela con otro tratamiento no puede reemplazar a otra; cada una aporta un dato distinto.", false], ["B", "Para saber qué dosis de fertilizante necesita el suelo según su contenido de nutrientes.", "Eso requiere un análisis del suelo; la parcela sin fertilizante sirve para comparar con las tratadas (grupo control).", false], ["C", "Como control, para comparar el rendimiento con y sin fertilizante.", "La parcela sin fertilizante es el grupo control: muestra cuánto produce el maíz sin el tratamiento.", true], ["D", "Para medir cuánto fertilizante absorbe el suelo de forma natural.", "En esa parcela no se aplicó fertilizante, así que no se puede medir su absorción.", false]]}, {"id": "CNA-212", "niv": 2, "cp": "cn_indagacion", "cn": "biologico", "e": "Un asesor dice que los resultados son poco confiables. ¿Qué cambio haría más confiable el ensayo?", "f": "Indagación: replicación y confiabilidad de los resultados", "vis": "", "o": [["A", "Aplicar todas las dosis de fertilizante en una misma parcela grande para ahorrar terreno.", "Si todas las dosis se aplican en la misma parcela, no se pueden medir por separado sus efectos.", false], ["B", "Medir el rendimiento solo en la parcela de 150 kg/ha, que fue la que mejor resultado tuvo.", "Medir una sola parcela elimina las comparaciones y no aumenta la confiabilidad.", false], ["C", "Usar una semilla distinta en cada parcela, para tener una mayor variedad de datos en el ensayo.", "Cambiar la semilla agrega otra variable y haría imposible saber si la diferencia se debe al fertilizante.", false], ["D", "Repetir cada dosis en varias parcelas con el mismo tipo de suelo y comparar los promedios.", "Con una sola parcela por dosis, una diferencia puede deberse a variaciones del terreno; las repeticiones permiten distinguir el efecto del fertilizante de la variación casual.", true]]}]}, {"comp": "ciencias_naturales", "sim": "val-1", "ses": 2, "ind": "Moho en el pan", "tt": "", "texto": "En una panadería se quiso saber qué condiciones favorecen la aparición de moho. Se pusieron tajadas del mismo pan, sin conservantes, en bolsas cerradas bajo cuatro condiciones y se registró cuántos días tardó en verse moho. El seguimiento duró 14 días.", "vis": "<table class=\"vt\"><caption>Tabla 9. Días hasta la aparición de moho<\/caption><thead><tr><th>Condición<\/th><th>Pan<\/th><th>Luz<\/th><th>Temperatura<\/th><th>Días hasta ver moho<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>Humedecido<\/td><td>Oscuridad<\/td><td>25 °C<\/td><td>4<\/td><\/tr><tr><td>2<\/td><td>Seco<\/td><td>Oscuridad<\/td><td>25 °C<\/td><td>No apareció en 14 días<\/td><\/tr><tr><td>3<\/td><td>Humedecido<\/td><td>Oscuridad<\/td><td>4 °C<\/td><td>12<\/td><\/tr><tr><td>4<\/td><td>Humedecido<\/td><td>Luz<\/td><td>25 °C<\/td><td>4<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Datos ficticios.<\/div>", "items": [{"id": "CNA-213", "niv": 2, "cp": "cn_indagacion", "cn": "biologico", "e": "Según la tabla, ¿qué factor no mostró un efecto apreciable en la aparición del moho?", "f": "Indagación: análisis de tablas y comparación de condiciones", "vis": "", "o": [["A", "La humedad.", "Al comparar 1 y 2 (solo difieren en la humedad), el pan seco no mostró moho en 14 días: la humedad sí tuvo efecto.", false], ["B", "La temperatura.", "Al comparar 1 y 3 (solo difieren en la temperatura), a 4 °C el moho tardó 12 días en vez de 4: la temperatura sí tuvo efecto.", false], ["C", "La luz.", "Las condiciones 1 y 4 solo difieren en la luz y en ambas el moho apareció a los 4 días.", true], ["D", "Ninguno; los tres factores modificaron el tiempo de aparición del moho.", "Con y sin luz (condiciones 1 y 4) el moho apareció a los 4 días: la luz no modificó el tiempo.", false]]}, {"id": "CNA-214", "niv": 1, "cp": "cn_indagacion", "cn": "biologico", "e": "¿Qué par de condiciones permite estudiar el efecto de la temperatura?", "f": "Indagación: control de variables", "vis": "", "o": [["A", "Las condiciones 2 y 3.", "Difieren a la vez en la humedad y en la temperatura, así que no se sabría cuál causa la diferencia.", false], ["B", "Las condiciones 1 y 3.", "Ambas tienen pan humedecido y oscuridad; solo cambia la temperatura (25 °C y 4 °C).", true], ["C", "Las condiciones 1 y 2.", "Difieren en la humedad del pan, no en la temperatura.", false], ["D", "Las condiciones 1 y 4.", "Difieren en la luz, no en la temperatura.", false]]}]}, {"comp": "ciencias_naturales", "sim": "val-1", "ses": 2, "ind": "Lavado de manos", "tt": "", "texto": "En un restaurante, 30 trabajadores tocaron la misma superficie y luego se dividieron en tres grupos de 10: uno no se lavó las manos, otro se las lavó solo con agua durante 20 segundos y otro con agua y jabón durante 20 segundos. Después, cada persona apoyó los dedos en una caja con medio de cultivo y, dos días más tarde, se contaron las colonias de bacterias.", "vis": "", "items": [{"id": "CNA-215", "niv": 1, "cp": "cn_indagacion", "cn": "biologico", "e": "¿Qué conclusión se apoya en los resultados?", "f": "Indagación: conclusiones a partir de datos", "vis": "<div class=\"vfig\"><svg class=\"vg\" viewBox=\"0 0 560 320\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Gráfica 10. Colonias de bacterias según el lavado de manos (promedio de 10 personas)\" font-family=\"Arial, sans-serif\" font-size=\"12\"><rect width=\"560\" height=\"320\" fill=\"#ffffff\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"13\" fill=\"#1d2433\">Gráfica 10. Colonias de bacterias según el lavado de manos (promedio de 10 personas)<\/text><line x1=\"60\" y1=\"258.0\" x2=\"540\" y2=\"258.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"262.0\" text-anchor=\"end\" fill=\"#3a4356\">0<\/text><line x1=\"60\" y1=\"221.0\" x2=\"540\" y2=\"221.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"225.0\" text-anchor=\"end\" fill=\"#3a4356\">20<\/text><line x1=\"60\" y1=\"184.0\" x2=\"540\" y2=\"184.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"188.0\" text-anchor=\"end\" fill=\"#3a4356\">40<\/text><line x1=\"60\" y1=\"147.0\" x2=\"540\" y2=\"147.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"151.0\" text-anchor=\"end\" fill=\"#3a4356\">60<\/text><line x1=\"60\" y1=\"110.0\" x2=\"540\" y2=\"110.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"114.0\" text-anchor=\"end\" fill=\"#3a4356\">80<\/text><line x1=\"60\" y1=\"73.0\" x2=\"540\" y2=\"73.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"77.0\" text-anchor=\"end\" fill=\"#3a4356\">100<\/text><line x1=\"60\" y1=\"36.0\" x2=\"540\" y2=\"36.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"40.0\" text-anchor=\"end\" fill=\"#3a4356\">120<\/text><line x1=\"60\" y1=\"258\" x2=\"540\" y2=\"258\" stroke=\"#3a4356\"/><line x1=\"60\" y1=\"258\" x2=\"60\" y2=\"36\" stroke=\"#3a4356\"/><text transform=\"translate(14,147.0) rotate(-90)\" text-anchor=\"middle\" fill=\"#3a4356\">Colonias de bacterias<\/text><text x=\"300.0\" y=\"312\" text-anchor=\"middle\" fill=\"#3a4356\">Tratamiento<\/text><text x=\"140.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Sin lavado<\/text><text x=\"300.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Solo agua<\/text><text x=\"460.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Agua y jabón<\/text><rect x=\"84.0\" y=\"36.0\" width=\"112.0\" height=\"222.0\" fill=\"#1660a8\"/><text x=\"140.0\" y=\"32.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">120<\/text><rect x=\"244.0\" y=\"128.5\" width=\"112.0\" height=\"129.5\" fill=\"#1660a8\"/><text x=\"300.0\" y=\"124.5\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">70<\/text><rect x=\"404.0\" y=\"230.2\" width=\"112.0\" height=\"27.8\" fill=\"#1660a8\"/><text x=\"460.0\" y=\"226.2\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">15<\/text><\/svg><\/div>", "o": [["A", "Lavarse con agua y jabón redujo las bacterias más que lavarse solo con agua.", "El promedio bajó de 120 colonias (sin lavado) a 70 con agua y a 15 con agua y jabón.", true], ["B", "El jabón funciona porque mata las bacterias, mientras que el agua sola solo las arrastra.", "El experimento cuenta las bacterias que quedan, pero no permite saber si el jabón las mata o las desprende; esa conclusión no está respaldada por los datos.", false], ["C", "Lavarse solo con agua tiene un efecto parecido a no lavarse, porque el agua sola no arrastra las bacterias.", "Con agua el promedio bajó de 120 a 70 colonias; sí tuvo efecto, aunque menor que con jabón.", false], ["D", "Lavarse solo con agua es tan efectivo como lavarse con agua y jabón.", "Con agua quedaron 70 colonias y con agua y jabón 15; la diferencia es grande.", false]]}]}, {"comp": "ciencias_naturales", "sim": "val-1", "ses": 2, "ind": "Sal y presión arterial", "tt": "", "texto": "Un médico quiere poner a prueba la hipótesis de que reducir la sal en la dieta disminuye la presión arterial de adultos con hipertensión leve. Cuenta con 200 pacientes voluntarios.", "vis": "", "items": [{"id": "CNA-216", "niv": 3, "cp": "cn_indagacion", "cn": "biologico", "e": "¿Cuál de los siguientes diseños es el más adecuado para poner a prueba la hipótesis?", "f": "Indagación: diseño experimental con asignación aleatoria y grupo control", "vis": "", "o": [["A", "Medir la presión de todos los pacientes, darles a todos una dieta baja en sal y medirla otra vez después de varias semanas.", "No hay grupo control: en varias semanas la presión puede cambiar por otros factores (estación, medicamentos, actividad), y no se sabría si fue por la sal.", false], ["B", "Comparar la presión de quienes ya comen poca sal con la de quienes comen mucha, sin considerar otras diferencias.", "Los grupos pueden diferir en otros factores (edad, peso, ejercicio), así que no se sabría si la diferencia se debe a la sal.", false], ["C", "Preguntar a los 200 pacientes si creen que la sal les sube la presión y contar cuántos responden que sí.", "Una opinión no es una medición; la hipótesis debe ponerse a prueba midiendo la presión arterial.", false], ["D", "Asignar al azar a los pacientes a una dieta baja en sal o a su dieta habitual, y comparar su presión después de varias semanas.", "La asignación al azar hace que los grupos sean parecidos en edad, peso y otros factores; el grupo con dieta habitual es el control y varias semanas permiten observar el efecto.", true]]}]}, {"comp": "ciencias_naturales", "sim": "val-1", "ses": 2, "ind": "Monóxido de carbono en el hogar", "tt": "", "texto": "En una vivienda, un calentador de agua a gas funcionó durante largo tiempo en un baño cerrado y sin ventilación. Una persona que estaba allí sintió dolor de cabeza, náuseas y mareo. El diagnóstico fue intoxicación por monóxido de carbono (CO), un gas que se forma cuando la combustión ocurre con poco oxígeno.", "vis": "", "items": [{"id": "CNA-218", "niv": 2, "cp": "cn_explicacion", "cn": "cts", "e": "¿Por qué el monóxido de carbono es tan peligroso para las personas?", "f": "Concepto: combustión incompleta y transporte de oxígeno. Fuente: StatPearls, NCBI (afinidad del CO por la hemoglobina)", "vis": "", "o": [["A", "Porque tiene un olor muy fuerte que irrita la nariz, y esa irritación es la que causa el mareo.", "El CO no tiene olor ni color; por eso es tan peligroso y se recomiendan detectores y buena ventilación.", false], ["B", "Porque se une a la hemoglobina mucho más que el oxígeno y reduce el oxígeno que llega a los tejidos.", "El CO tiene una afinidad por la hemoglobina unas 200 veces mayor que el O₂; forma carboxihemoglobina y los tejidos, como el cerebro, reciben menos oxígeno.", true], ["C", "Porque destruye los pulmones al reaccionar con el agua que contienen y formar ácidos muy fuertes.", "El efecto tóxico del CO no se debe a formar ácidos en los pulmones, sino a su unión con la hemoglobina.", false], ["D", "Porque se forma cuando sobra oxígeno en la combustión, y ese exceso de oxígeno quema la piel y los ojos.", "El CO se forma cuando falta oxígeno (combustión incompleta), y no causa quemaduras.", false]]}]}, {"comp": "ciencias_naturales", "sim": "val-1", "ses": 2, "ind": "Fertilizantes y vida en un lago", "tt": "", "texto": "Un lago rodeado de cultivos recibe, con el agua de lluvia que escurre, fertilizantes ricos en nitrógeno y fósforo. Meses después, la superficie del lago se cubre de algas y aparecen muchos peces muertos.", "vis": "", "items": [{"id": "CNA-219", "niv": 3, "cp": "cn_explicacion", "cn": "cts", "e": "¿Qué explica la muerte de los peces?", "f": "Concepto: eutrofización", "vis": "", "o": [["A", "Los nutrientes hacen crecer demasiado las algas, y al descomponerse estas se agota el oxígeno del agua.", "Es la eutrofización: el exceso de algas muertas alimenta a bacterias descomponedoras que consumen el oxígeno disuelto, y los peces mueren por falta de oxígeno.", true], ["B", "Los fertilizantes son venenos que matan directamente a los peces en el momento en que llegan al lago.", "El texto describe un efecto que aparece meses después y está ligado al crecimiento de algas, no un envenenamiento inmediato.", false], ["C", "Las algas de la superficie impiden que la luz llegue a los peces, y sin luz los peces no pueden respirar.", "Los peces no necesitan luz para respirar; mueren por falta del oxígeno disuelto que consumen las bacterias al descomponer las algas.", false], ["D", "Las algas producen tanto oxígeno durante el día que los peces se intoxican al respirarlo.", "El problema de la eutrofización es la falta de oxígeno, no su exceso.", false]]}]}, {"comp": "ciencias_naturales", "sim": "val-1", "ses": 2, "ind": "Potabilización del agua en una vereda", "tt": "", "texto": "En una vereda se compararon dos formas de tratar el agua de una quebrada: hervirla durante 3 minutos y pasarla por un filtro casero de arena y grava. Se analizaron varias muestras de cada tipo y se contaron las bacterias coliformes, indicadoras de contaminación fecal.", "vis": "", "items": [{"id": "CNA-221", "niv": 1, "cp": "cn_indagacion", "cn": "cts", "e": "¿Qué conclusión se apoya en los resultados?", "f": "Indagación: conclusiones a partir de datos", "vis": "<table class=\"vt\"><caption>Tabla 10. Bacterias coliformes en el agua (promedio por cada 100 mL)<\/caption><thead><tr><th>Muestra<\/th><th>Coliformes<\/th><\/tr><\/thead><tbody><tr><td>Agua sin tratar<\/td><td>250<\/td><\/tr><tr><td>Agua hervida 3 minutos<\/td><td>0<\/td><\/tr><tr><td>Agua del filtro de arena y grava<\/td><td>40<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Datos ficticios.<\/div>", "o": [["A", "Ninguno de los dos tratamientos cambió la cantidad de coliformes del agua de la quebrada.", "Los dos tratamientos redujeron las coliformes respecto a las 250 del agua sin tratar.", false], ["B", "El filtro casero eliminó más coliformes que hervir el agua durante 3 minutos.", "Al hervir quedaron 0 coliformes y con el filtro 40; hervir eliminó más.", false], ["C", "Ambos tratamientos redujeron las coliformes, pero solo en el agua hervida no se detectaron.", "Las coliformes bajaron de 250 a 40 con el filtro y a 0 al hervir: los dos métodos redujeron la contaminación, pero solo hervir la eliminó en estas muestras.", true], ["D", "El filtro casero dejó el agua libre de coliformes, igual que hervirla durante 3 minutos.", "Con el filtro quedaron 40 coliformes por cada 100 mL; no quedó libre de ellas.", false]]}]}, {"comp": "ciencias_naturales", "sim": "val-1", "ses": 2, "ind": "Consumo de energía de un electrodoméstico", "tt": "", "texto": "Un horno eléctrico tiene una po
