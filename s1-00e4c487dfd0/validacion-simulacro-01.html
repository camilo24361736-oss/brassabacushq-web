tencia de 1.500 W. En una cafetería se usa 2 horas diarias durante 30 días.", "vis": "", "items": [{"id": "CNA-222", "niv": 2, "cp": "cn_uso_comprensivo", "cn": "fisico", "e": "¿Cuánta energía eléctrica consume el horno en esos 30 días?", "f": "Cálculo propio: E = P·t", "vis": "", "o": [["A", "3 kWh.", "Es el consumo de un solo día (1,5 kW × 2 h); falta multiplicar por los 30 días.", false], ["B", "45 kWh.", "Multiplica 1,5 kW por 30 días y olvida las 2 horas diarias de uso.", false], ["C", "90 kWh.", "1.500 W = 1,5 kW. Energía = potencia × tiempo = 1,5 kW × (2 h × 30) = 1,5 × 60 = 90 kWh.", true], ["D", "90.000 kWh.", "Usa 1.500 W sin convertir a kilovatios (1.500 × 60 = 90.000 Wh, que son 90 kWh).", false]]}]}, {"comp": "ciencias_naturales", "sim": "val-1", "ses": 2, "ind": "Rapidez media de un camión", "tt": "", "texto": "Un camión de carga recorre 180 km entre dos municipios en 2 horas y media.", "vis": "", "items": [{"id": "CNA-223", "niv": 1, "cp": "cn_uso_comprensivo", "cn": "fisico", "e": "¿Cuál fue la rapidez media del camión en ese recorrido?", "f": "Cálculo propio: v = d/t", "vis": "", "o": [["A", "60 km/h.", "Divide entre 3 horas, redondeando el tiempo hacia arriba; el tiempo fue 2,5 h.", false], ["B", "72 km/h.", "Rapidez media = distancia / tiempo = 180 km / 2,5 h = 72 km/h.", true], ["C", "90 km/h.", "Divide entre 2 horas y olvida la media hora adicional.", false], ["D", "450 km/h.", "Multiplica distancia por tiempo (180 × 2,5); la rapidez es el cociente entre distancia y tiempo.", false]]}]}, {"comp": "ciencias_naturales", "sim": "val-1", "ses": 2, "ind": "Sonido en el vacío", "tt": "", "texto": "En una demostración se pone un despertador sonando dentro de una campana de vidrio y se va extrayendo el aire con una bomba de vacío. El sonido se oye cada vez más débil, aunque se sigue viendo vibrar el martillo del despertador.", "vis": "", "items": [{"id": "CNA-229", "niv": 1, "cp": "cn_explicacion", "cn": "fisico", "e": "¿Qué explica que el sonido se debilite?", "f": "Concepto: ondas mecánicas y medio de propagación", "vis": "", "o": [["A", "Al sacar el aire, el despertador deja de vibrar y ya no produce sonido.", "El enunciado indica que el martillo sigue vibrando; lo que falla es la transmisión.", false], ["B", "El vidrio de la campana absorbe más sonido a medida que se saca el aire de su interior.", "El vidrio no cambia su capacidad de absorber sonido; el problema es que falta el aire que lo transmite.", false], ["C", "Sin aire la luz tampoco se propaga, y por eso dejan de llegar las ondas del despertador.", "La luz sí se propaga en el vacío: por eso se sigue viendo el despertador.", false], ["D", "El sonido necesita un medio material para propagarse, y al sacar el aire casi no queda medio.", "El sonido es una onda mecánica: se transmite por la vibración de las partículas del medio. Sin aire, la vibración del despertador no llega al vidrio ni al oído.", true]]}]}, {"comp": "ciencias_naturales", "sim": "val-1", "ses": 2, "ind": "Clavar una puntilla", "tt": "", "texto": "Un carpintero golpea con un martillo una puntilla, que entra con facilidad en la madera por su punta. Si la pusiera al revés, con la cabeza contra la madera, no entraría aunque la golpeara con la misma fuerza.", "vis": "", "items": [{"id": "CNA-230", "niv": 1, "cp": "cn_explicacion", "cn": "fisico", "e": "¿Por qué la puntilla entra en la madera por la punta y no por la cabeza?", "f": "Concepto: presión", "vis": "", "o": [["A", "Porque la misma fuerza sobre el área mucho menor de la punta produce una presión mayor.", "La presión es fuerza sobre área (P = F/A); la punta tiene un área muy pequeña y concentra la fuerza, lo que permite atravesar la madera.", true], ["B", "Porque la punta tiene más masa que la cabeza y por eso empuja la madera con más fuerza.", "La punta tiene menos masa que la cabeza; la diferencia está en el área de contacto.", false], ["C", "Porque la madera es más blanda en el lugar donde toca la punta que donde tocaría la cabeza.", "La madera es la misma en ambos casos; lo que cambia es el área sobre la que se reparte la fuerza.", false], ["D", "Porque la punta, al ser de acero afilado, es más dura que la cabeza de la puntilla.", "La puntilla es de un solo material; la diferencia está en el área de contacto, no en la dureza.", false]]}]}, {"comp": "ciencias_naturales", "sim": "val-1", "ses": 2, "ind": "Extensión sobrecargada", "tt": "", "texto": "En una oficina conectan a una misma extensión eléctrica (multitoma) un calentador, un hervidor de agua y una impresora, que funcionan al mismo tiempo. Al rato, el cable de la extensión está muy caliente.", "vis": "", "items": [{"id": "CNA-231", "niv": 3, "cp": "cn_explicacion", "cn": "fisico", "e": "¿Qué explica el calentamiento del cable de la extensión?", "f": "Concepto: circuitos en paralelo y efecto Joule", "vis": "", "o": [["A", "Como los aparatos están en paralelo, el voltaje se reparte entre ellos y el cable recibe el voltaje sobrante.", "En paralelo cada aparato recibe el voltaje completo de la red; no hay un voltaje «sobrante». El cable se calienta por la suma de las corrientes.", false], ["B", "El calor que producen los aparatos viaja por los cables de regreso hasta la extensión y la calienta.", "El calentamiento del cable se produce en el propio cable por la corriente que lo recorre (efecto Joule).", false], ["C", "Al conectar más aparatos, el voltaje de la red aumenta mucho y es ese voltaje adicional el que calienta el cable.", "Conectar aparatos no aumenta el voltaje de la red; lo que aumenta es la corriente total por el cable.", false], ["D", "Como los aparatos están en paralelo, sus corrientes se suman en el cable, y una corriente alta disipa mucho calor en él.", "En una multitoma los aparatos se conectan en paralelo y la corriente total por el cable común es la suma de sus corrientes; el calor disipado (efecto Joule) crece con la corriente y puede dañar el cable.", true]]}]}, {"comp": "ciencias_naturales", "sim": "val-1", "ses": 2, "ind": "Medición de la corriente en un motor", "tt": "", "texto": "Un técnico de mantenimiento necesita saber qué corriente eléctrica pasa por el motor de una bomba de agua mientras funciona.", "vis": "", "items": [{"id": "CNA-236", "niv": 2, "cp": "cn_indagacion", "cn": "fisico", "e": "¿Qué instrumento debe usar y cómo debe conectarlo?", "f": "Indagación: elección y uso de instrumentos de medición", "vis": "", "o": [["A", "Un voltímetro, conectado en serie con el motor.", "El voltímetro mide diferencia de potencial (voltaje), no corriente, y se conecta en paralelo.", false], ["B", "Un amperímetro, conectado en serie con el motor.", "El amperímetro mide corriente y se conecta en serie para que toda la corriente del motor pase a través de él.", true], ["C", "Un amperímetro, conectado en paralelo con el motor.", "Un amperímetro en paralelo no mide la corriente del motor y, por su baja resistencia, puede provocar un cortocircuito.", false], ["D", "Un termómetro, colocado sobre la carcasa del motor.", "El termómetro mide temperatura; un motor caliente no indica el valor de la corriente.", false]]}]}, {"comp": "ciencias_naturales", "sim": "val-1", "ses": 2, "ind": "Combustión del gas natural", "tt": "", "texto": "El gas natural que se usa en las estufas de muchos hogares está formado principalmente por metano (CH₄). Cuando la llama es azul y hay suficiente oxígeno, el metano tiene una combustión completa.", "vis": "", "items": [{"id": "CNA-238", "niv": 1, "cp": "cn_uso_comprensivo", "cn": "quimico", "e": "¿Cuáles son los productos de la combustión completa del metano?", "f": "Concepto: reacciones de combustión", "vis": "", "o": [["A", "Dióxido de carbono y agua.", "En la combustión completa de un hidrocarburo, el carbono forma CO₂ y el hidrógeno forma H₂O: CH₄ + 2O₂ → CO₂ + 2H₂O.", true], ["B", "Monóxido de carbono e hidrógeno gaseoso.", "El CO aparece en combustiones incompletas (con poco oxígeno), y el hidrógeno no queda libre: forma agua.", false], ["C", "Oxígeno y agua.", "El oxígeno es un reactivo que se consume, no un producto, y falta el compuesto que forma el carbono (CO₂).", false], ["D", "Carbono sólido e hidrógeno gaseoso.", "Separar el metano en carbono e hidrógeno no es una combustión; en la combustión los elementos se combinan con el oxígeno.", false]]}]}, {"comp": "ciencias_naturales", "sim": "val-1", "ses": 2, "ind": "Elementos de un mismo grupo", "tt": "", "texto": "En la tabla periódica, el potasio (K) está en el mismo grupo que el sodio (Na), el grupo 1 o de los metales alcalinos. El sodio reacciona con el agua, forma iones Na⁺ y se combina con el cloro para formar NaCl.", "vis": "", "items": [{"id": "CNA-240", "niv": 2, "cp": "cn_uso_comprensivo", "cn": "quimico", "e": "¿Qué se puede esperar del potasio?", "f": "Concepto: tabla periódica y grupos", "vis": "", "o": [["A", "Que tenga la misma masa atómica que el sodio, pues los elementos de un grupo tienen igual número de protones.", "Cada elemento tiene un número de protones distinto; los de un mismo grupo comparten la configuración de la capa externa, no la masa.", false], ["B", "Que sea menos reactivo que el sodio, pues al tener más capas de electrones retiene con más fuerza su electrón externo.", "Es al revés: el electrón externo del potasio está más lejos del núcleo y se pierde con más facilidad, así que el potasio es más reactivo que el sodio.", false], ["C", "Que tenga propiedades químicas parecidas a las del sodio, pues tiene un electrón en su capa externa.", "Los elementos de un mismo grupo tienen la misma cantidad de electrones de valencia, por eso se comportan químicamente de forma similar: el potasio forma K⁺ y KCl.", true], ["D", "Que forme iones con carga 2−, pues necesita ganar electrones para completar su capa externa.", "Con un electrón externo, al potasio le resulta más fácil perderlo: forma iones K⁺, como el sodio forma Na⁺.", false]]}]}, {"comp": "ciencias_naturales", "sim": "val-1", "ses": 2, "ind": "Producción de cal viva", "tt": "", "texto": "En un horno de cal se calienta piedra caliza (carbonato de calcio) para obtener cal viva (óxido de calcio), según la ecuación CaCO₃ → CaO + CO₂. Masas atómicas: Ca = 40, C = 12, O = 16.", "vis": "", "items": [{"id": "CNA-241", "niv": 3, "cp": "cn_uso_comprensivo", "cn": "quimico", "e": "Si se descomponen completamente 200 g de carbonato de calcio, ¿qué masa de óxido de calcio se obtiene?", "f": "Cálculo propio: estequiometría y conservación de la masa", "vis": "", "o": [["A", "44 g.", "Es la masa de 1 mol de CO₂; no corresponde al óxido de calcio.", false], ["B", "56 g.", "Es la masa de 1 mol de CaO, que se obtendría de 100 g de CaCO₃; aquí hay 200 g (2 mol).", false], ["C", "88 g.", "Es la masa de CO₂ que se libera con 200 g de CaCO₃ (2 × 44 g), no la del CaO.", false], ["D", "112 g.", "Masa molar del CaCO₃ = 40 + 12 + 3 × 16 = 100 g/mol, así que 200 g son 2 mol. Cada mol produce 1 mol de CaO (56 g/mol): 2 × 56 = 112 g. Comprobación: 112 g + 88 g de CO₂ = 200 g.", true]]}]}, {"comp": "ciencias_naturales", "sim": "val-1", "ses": 2, "ind": "Vinagre contra el sarro", "tt": "", "texto": "En el fondo de una olla donde se hierve agua dura se forma una capa blanca de sarro, compuesta principalmente por carbonato de calcio (CaCO₃). Al dejar vinagre en la olla, se ven burbujas y la capa blanca desaparece poco a poco.", "vis": "", "items": [{"id": "CNA-244", "niv": 2, "cp": "cn_explicacion", "cn": "quimico", "e": "¿Qué explica lo que ocurre con el sarro?", "f": "Concepto: reacción de ácidos con carbonatos", "vis": "", "o": [["A", "Las burbujas son vapor de agua, porque el vinagre hierve cuando entra en contacto con el sarro.", "El vinagre no hierve a temperatura ambiente; las burbujas son de dióxido de carbono.", false], ["B", "El ácido del vinagre reacciona con el carbonato, forma una sal soluble y libera dióxido de carbono.", "El vinagre contiene ácido acético. Los ácidos reaccionan con los carbonatos y producen una sal, agua y CO₂; las burbujas son el CO₂ y el acetato de calcio formado es soluble en agua.", true], ["C", "El vinagre es una base que neutraliza el sarro, porque el carbonato de calcio es un ácido.", "Es al revés: el vinagre es ácido y el carbonato de calcio es la sustancia básica que reacciona con él.", false], ["D", "El vinagre disuelve el sarro como el agua disuelve el azúcar, sin que ocurra ninguna reacción química.", "Las burbujas indican la formación de un gas nuevo (CO₂), señal de una reacción química, no de una simple disolución.", false]]}]}, {"comp": "ciencias_naturales", "sim": "val-1", "ses": 2, "ind": "Olla a presión", "tt": "", "texto": "Un cocinero observa que los fríjoles se ablandan en mucho menos tiempo en una olla a presión que en una olla destapada. La olla a presión está cerrada herméticamente y tiene una válvula que deja escapar vapor solo cuando la presión interna es alta.", "vis": "", "items": [{"id": "CNA-245", "niv": 3, "cp": "cn_explicacion", "cn": "quimico", "e": "¿Por qué los alimentos se cocinan más rápido en la olla a presión?", "f": "Concepto: presión y punto de ebullición", "vis": "", "o": [["A", "Porque con mayor presión el agua hierve a una temperatura más alta, y el calor cocina más rápido.", "La temperatura de ebullición aumenta con la presión externa; en la olla a presión el agua líquida y el vapor superan los 100 °C y la cocción es más rápida.", true], ["B", "Porque la olla cerrada hace que el vapor se enfríe más rápido y así cocina los alimentos con más fuerza.", "El vapor atrapado no se enfría más rápido; el efecto clave es que la presión eleva la temperatura de cocción.", false], ["C", "Porque la presión alta hace que el agua hierva a menor temperatura, lo que permite ahorrar gas en la cocción.", "Ocurre lo contrario: una presión mayor eleva la temperatura de ebullición.", false], ["D", "Porque la presión aplasta los fríjoles y los ablanda directamente, sin que el calor tenga mucha importancia.", "La presión del vapor no aplasta los alimentos; los ablanda la temperatura más alta del agua.", false]]}]}, {"comp": "ciencias_naturales", "sim": "val-1", "ses": 2, "ind": "Mármol en trozos y en polvo", "tt": "", "texto": "Para estudiar la rapidez de una reacción, se pusieron 5 g de mármol (carbonato de calcio) en trozos en un recipiente y 5 g de mármol en polvo en otro. A cada uno se le agregaron 100 mL de ácido clorhídrico de la misma concentración, en exceso, y a la misma temperatura. Se midió la masa de dióxido de carbono liberada cada minuto.", "vis": "<div class=\"vfig\"><svg class=\"vg\" viewBox=\"0 0 560 320\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Gráfica 11. Dióxido de carbono liberado\" font-family=\"Arial, sans-serif\" font-size=\"12\"><rect width=\"560\" height=\"320\" fill=\"#ffffff\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"13\" fill=\"#1d2433\">Gráfica 11. Dióxido de carbono liberado<\/text><line x1=\"60\" y1=\"258.0\" x2=\"540\" y2=\"258.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"262.0\" text-anchor=\"end\" fill=\"#3a4356\">0<\/text><line x1=\"60\" y1=\"213.6\" x2=\"540\" y2=\"213.6\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"217.6\" text-anchor=\"end\" fill=\"#3a4356\">0,5<\/text><line x1=\"60\" y1=\"169.2\" x2=\"540\" y2=\"169.2\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"173.2\" text-anchor=\"end\" fill=\"#3a4356\">1<\/text><line x1=\"60\" y1=\"124.8\" x2=\"540\" y2=\"124.8\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"128.8\" text-anchor=\"end\" fill=\"#3a4356\">1,5<\/text><line x1=\"60\" y1=\"80.4\" x2=\"540\" y2=\"80.4\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"84.4\" text-anchor=\"end\" fill=\"#3a4356\">2<\/text><line x1=\"60\" y1=\"36.0\" x2=\"540\" y2=\"36.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"40.0\" text-anchor=\"end\" fill=\"#3a4356\">2,5<\/text><line x1=\"60\" y1=\"258\" x2=\"540\" y2=\"258\" stroke=\"#3a4356\"/><line x1=\"60\" y1=\"258\" x2=\"60\" y2=\"36\" stroke=\"#3a4356\"/><text transform=\"translate(14,147.0) rotate(-90)\" text-anchor=\"middle\" fill=\"#3a4356\">CO₂ liberado (g)<\/text><text x=\"300.0\" y=\"312\" text-anchor=\"middle\" fill=\"#3a4356\">Tiempo (min)<\/text><text x=\"100.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">0<\/text><text x=\"180.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">1<\/text><text x=\"260.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">2<\/text><text x=\"340.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">3<\/text><text x=\"420.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">4<\/text><text x=\"500.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">5<\/text><polyline fill=\"none\" stroke=\"#1660a8\" stroke-width=\"2.5\" points=\"100.0,258.0 180.0,187.0 260.0,133.7 340.0,98.2 420.0,71.5 500.0,62.6\"/><circle cx=\"100.0\" cy=\"258.0\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"100.0\" y=\"250.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">0<\/text><circle cx=\"180.0\" cy=\"187.0\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"180.0\" y=\"179.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">0,8<\/text><circle cx=\"260.0\" cy=\"133.7\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"260.0\" y=\"125.7\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">1,4<\/text><circle cx=\"340.0\" cy=\"98.2\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"340.0\" y=\"90.2\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">1,8<\/text><circle cx=\"420.0\" cy=\"71.5\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"420.0\" y=\"63.5\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">2,1<\/text><circle cx=\"500.0\" cy=\"62.6\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"500.0\" y=\"54.6\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">2,2<\/text><polyline fill=\"none\" stroke=\"#d9822b\" stroke-width=\"2.5\" points=\"100.0,258.0 180.0,115.9 260.0,71.5 340.0,62.6 420.0,62.6 500.0,62.6\"/><circle cx=\"100.0\" cy=\"258.0\" r=\"3.5\" fill=\"#d9822b\"/><text x=\"100.0\" y=\"275.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#d9822b\" font-weight=\"bold\">0<\/text><circle cx=\"180.0\" cy=\"115.9\" r=\"3.5\" fill=\"#d9822b\"/><text x=\"180.0\" y=\"132.9\" text-anchor=\"middle\" font-size=\"11\" fill=\"#d9822b\" font-weight=\"bold\">1,6<\/text><circle cx=\"260.0\" cy=\"71.5\" r=\"3.5\" fill=\"#d9822b\"/><text x=\"260.0\" y=\"88.5\" text-anchor=\"middle\" font-size=\"11\" fill=\"#d9822b\" font-weight=\"bold\">2,1<\/text><circle cx=\"340.0\" cy=\"62.6\" r=\"3.5\" fill=\"#d9822b\"/><text x=\"340.0\" y=\"79.6\" text-anchor=\"middle\" font-size=\"11\" fill=\"#d9822b\" font-weight=\"bold\">2,2<\/text><circle cx=\"420.0\" cy=\"62.6\" r=\"3.5\" fill=\"#d9822b\"/><text x=\"420.0\" y=\"79.6\" text-anchor=\"middle\" font-size=\"11\" fill=\"#d9822b\" font-weight=\"bold\">2,2<\/text><circle cx=\"500.0\" cy=\"62.6\" r=\"3.5\" fill=\"#d9822b\"/><text x=\"500.0\" y=\"79.6\" text-anchor=\"middle\" font-size=\"11\" fill=\"#d9822b\" font-weight=\"bold\">2,2<\/text><rect x=\"60\" y=\"286\" width=\"12\" height=\"12\" fill=\"#1660a8\"/><text x=\"76\" y=\"296\" fill=\"#1d2433\">Trozos<\/text><rect x=\"128\" y=\"286\" width=\"12\" height=\"12\" fill=\"#d9822b\"/><text x=\"144\" y=\"296\" fill=\"#1d2433\">Polvo<\/text><\/svg><\/div>", "items": [{"id": "CNA-246", "niv": 2, "cp": "cn_indagacion", "cn": "quimico", "e": "¿Qué conclusión se apoya en la gráfica?", "f": "Indagación: interpretación de gráficas; superficie de contacto y rapidez de reacción", "vis": "", "o": [["A", "El mármol en trozos reacciona más rápido, porque cada pedazo tiene más masa que un grano de polvo.", "La gráfica muestra que los trozos liberan el gas más despacio; además, la masa total de mármol es la misma.", false], ["B", "El polvo reacciona más rápido que los trozos, pero ambos liberan la misma masa total de CO₂.", "En el primer minuto el polvo libera 1,6 g y los trozos 0,8 g; al final ambos llegan a 2,2 g. Mayor superficie de contacto, mayor rapidez, igual cantidad final.", true], ["C", "El mármol en polvo libera más dióxido de carbono en total que el mármol en trozos.", "Ambas curvas terminan en 2,2 g: la cantidad total es la misma; solo cambia la rapidez.", false], ["D", "La forma en que se presenta el mármol no influye en la rapidez de la reacción con el ácido.", "Las curvas son distintas al comienzo: el polvo alcanza 2,2 g a los 3 minutos y los trozos a los 5.", false]]}, {"id": "CNA-247", "niv": 3, "cp": "cn_indagacion", "cn": "quimico", "e": "¿Por qué las dos curvas terminan en el mismo valor, 2,2 g?", "f": "Indagación: conclusiones con base en la estequiometría (CaCO₃ + 2HCl → CaCl₂ + H₂O + CO₂)", "vis": "", "o": [["A", "Porque en ambos recipientes reaccionó toda la masa de mármol (5 g), ya que el ácido estaba en exceso.", "Con el ácido en exceso, el reactivo que se agota es el mármol; como en ambos casos había 5 g de CaCO₃ (0,05 mol), se forman 0,05 mol de CO₂ = 2,2 g.", true], ["B", "Porque 2,2 g es la máxima masa de gas que puede registrar el instrumento usado en el experimento.", "Nada indica un límite del instrumento; el valor coincide con el CO₂ que producen 5 g de carbonato de calcio.", false], ["C", "Porque en ambos recipientes el ácido clorhídrico se agotó justo cuando se habían liberado 2,2 g de gas.", "El enunciado indica que el ácido estaba en exceso; el que se agotó fue el mármol.", false], ["D", "Porque el mármol en polvo y el mármol en trozos tienen la misma superficie de contacto con el ácido.", "El polvo tiene mucha más superficie de contacto; por eso reacciona más rápido, aunque la cantidad final sea igual.", false]]}, {"id": "CNA-248", "niv": 1, "cp": "cn_indagacion", "cn": "quimico", "e": "¿Cuál es la variable independiente de este experimento?", "f": "Indagación: identificación de variables", "vis": "", "o": [["A", "La concentración del ácido clorhídrico.", "Fue la misma en ambos recipientes; es una variable controlada.", false], ["B", "La masa de dióxido de carbono liberada.", "Es la variable dependiente: lo que se mide como resultado.", false], ["C", "El tamaño de las partículas del mármol.", "Es lo único que se cambió a propósito entre los dos recipientes: trozos o polvo.", true], ["D", "La temperatura del ácido clorhídrico.", "Fue la misma en ambos recipientes; es una variable controlada.", false]]}]}, {"comp": "ciencias_naturales", "sim": "val-1", "ses": 2, "ind": "Sal y temperatura de ebullición", "tt": "", "texto": "Una cocinera afirma que agregar sal al agua hace que esta hierva a una temperatura mayor. Su ayudante quiere comprobarlo con un experimento.", "vis": "", "items": [{"id": "CNA-252", "niv": 3, "cp": "cn_indagacion", "cn": "quimico", "e": "¿Cuál de los siguientes experimentos permite poner a prueba la afirmación?", "f": "Indagación: diseño experimental; concepto de aumento del punto de ebullición", "vis": "", "o": [["A", "Agregar una cucharada de sal al agua que ya está hirviendo, observar si deja de hervir y medir cuánto tarda en volver a hervir.", "Lo que se observe al echar la sal no indica la temperatura de ebullición; no se mide ninguna temperatura ni se compara con un control.", false], ["B", "Calentar agua con sal y agua sin sal en la misma estufa y medir con un reloj cuál de las dos empieza a hervir primero.", "Mide tiempo, no temperatura; la afirmación es sobre la temperatura a la que hierve el agua, no sobre cuánto tarda.", false], ["C", "Calentar agua con sal en Bogotá y agua sin sal en Cartagena, en ollas iguales, y medir con termómetro a qué temperatura hierve cada una.", "Cambian dos variables a la vez: la sal y la altitud (presión atmosférica), que también afecta la temperatura de ebullición.", false], ["D", "Calentar volúmenes iguales de agua con distintas cantidades de sal, y una sin sal, y medir con termómetro a qué temperatura hierven.", "Varía solo la cantidad de sal, incluye un control sin sal, mantiene el lugar y el volumen, y mide la variable de la afirmación: la temperatura de ebullición.", true]]}]}, {"comp": "ingles", "sim": "val-1", "ses": 2, "ind": "Parte 1 · Vocabulario: objetos de oficina", "tt": "", "texto": "Read the descriptions of some words. What is the word for each description? Choose the correct word (A–G). There are more words than you need.\n\nA. stapler\nB. printer\nC. calendar\nD. scissors\nE. envelope\nF. folder\nG. keyboard", "vis": "", "items": [{"id": "EN1-152", "niv": 2, "cp": "en_p1", "cn": "", "e": "You use this to join sheets of paper with small pieces of metal.", "f": "Vocabulario del campo semántico «Objetos de oficina» (redacción propia)", "vis": "", "o": [["A", "stapler", "Correcta. «stapler» significa «cosedora / grapadora»: aparato que une hojas con grapas de metal. La descripción dice: «Se usa para unir hojas de papel con pequeñas piezas de metal».", true], ["B", "printer", "«printer» significa «impresora»: máquina que pasa los documentos del computador al papel; no corresponde a «Se usa para unir hojas de papel con pequeñas piezas de metal».", false], ["C", "calendar", "«calendar» significa «calendario»: hoja o aplicación que muestra los días y los meses; no corresponde a «Se usa para unir hojas de papel con pequeñas piezas de metal».", false], ["D", "scissors", "«scissors» significa «tijeras»: herramienta de dos hojas para cortar papel; no corresponde a «Se usa para unir hojas de papel con pequeñas piezas de metal».", false], ["E", "envelope", "«envelope» significa «sobre»: funda de papel donde se mete una carta para enviarla; no corresponde a «Se usa para unir hojas de papel con pequeñas piezas de metal».", false], ["F", "folder", "«folder» significa «carpeta»: cubierta para guardar y ordenar papeles; no corresponde a «Se usa para unir hojas de papel con pequeñas piezas de metal».", false], ["G", "keyboard", "«keyboard» significa «teclado»: conjunto de teclas para escribir en el computador; no corresponde a «Se usa para unir hojas de papel con pequeñas piezas de metal».", false]]}, {"id": "EN1-153", "niv": 2, "cp": "en_p1", "cn": "" corresponde a «Se mete una carta dentro de esto antes de enviarla».", false], ["C", "calendar", "«calendar» significa «calendario»: hoja o aplicación que muestra los días y los meses; no corresponde a «Se mete una carta dentro de esto antes de enviarla».", false], ["D", "scissors", "«scissors» significa «tijeras»: herramienta de dos hojas para cortar papel; no corresponde a «Se mete una carta dentro de esto antes de enviarla».", false], ["E", "envelope", "Correcta. «envelope» significa «sobre»: funda de papel donde se mete una carta para enviarla. La descripción dice: «Se mete una carta dentro de esto antes de enviarla».", true], ["F", "folder", "«folder» significa «carpeta»: cubierta para guardar y ordenar papeles; no corresponde a «Se mete una carta dentro de esto antes de enviarla».", false], ["G", "keyboard", "«keyboard» significa «teclado»: conjunto de teclas para escribir en el computador; no corresponde a «Se mete una carta dentro de esto antes de enviarla».", false]]}, {"id": "EN1-155", "niv": 1, "cp": "en_p1", "cn": "", "e": "You press the keys on this to write on a computer.", "f": "Vocabulario del campo semántico «Objetos de oficina» (redacción propia)", "vis": "", "o": [["A", "stapler", "«stapler» significa «cosedora / grapadora»: aparato que une hojas con grapas de metal; no corresponde a «Se presionan las teclas de esto para escribir en un computador».", false], ["B", "printer", "«printer» significa «impresora»: máquina que pasa los documentos del computador al papel; no corresponde a «Se presionan las teclas de esto para escribir en un computador».", false], ["C", "calendar", "«calendar» significa «calendario»: hoja o aplicación que muestra los días y los meses; no corresponde a «Se presionan las teclas de esto para escribir en un computador».", false], ["D", "scissors", "«scissors» significa «tijeras»: herramienta de dos hojas para cortar papel; no corresponde a «Se presionan las teclas de esto para escribir en un computador».", false], ["E", "envelope", "«envelope» significa «sobre»: funda de papel donde se mete una carta para enviarla; no corresponde a «Se presionan las teclas de esto para escribir en un computador».", false], ["F", "folder", "«folder» significa «carpeta»: cubierta para guardar y ordenar papeles; no corresponde a «Se presionan las teclas de esto para escribir en un computador».", false], ["G", "keyboard", "Correcta. «keyboard» significa «teclado»: conjunto de teclas para escribir en el computador. La descripción dice: «Se presionan las teclas de esto para escribir en un computador».", true]]}, {"id": "EN1-156", "niv": 2, "cp": "en_p1", "cn": "", "e": "You look at this to see the days of the month and plan your meetings.", "f": "Vocabulario del campo semántico «Objetos de oficina» (redacción propia)", "vis": "", "o": [["A", "stapler", "«stapler» significa «cosedora / grapadora»: aparato que une hojas con grapas de metal; no corresponde a «Se mira esto para ver los días del mes y planear las reuniones».", false], ["B", "printer", "«printer» significa «impresora»: máquina que pasa los documentos del computador al papel; no corresponde a «Se mira esto para ver los días del mes y planear las reuniones».", false], ["C", "calendar", "Correcta. «calendar» significa «calendario»: hoja o aplicación que muestra los días y los meses. La descripción dice: «Se mira esto para ver los días del mes y planear las reuniones».", true], ["D", "scissors", "«scissors» significa «tijeras»: herramienta de dos hojas para cortar papel; no corresponde a «Se mira esto para ver los días del mes y planear las reuniones».", false], ["E", "envelope", "«envelope» significa «sobre»: funda de papel donde se mete una carta para enviarla; no corresponde a «Se mira esto para ver los días del mes y planear las reuniones».", false], ["F", "folder", "«folder» significa «carpeta»: cubierta para guardar y ordenar papeles; no corresponde a «Se mira esto para ver los días del mes y planear las reuniones».", false], ["G", "keyboard", "«keyboard» significa «teclado»: conjunto de teclas para escribir en el computador; no corresponde a «Se mira esto para ver los días del mes y planear las reuniones».", false]]}]}, {"comp": "ingles", "sim": "val-1", "ses": 2, "ind": "Parte 2 · Avisos y lugares", "tt": "", "texto": "Read the notices. Where can you see each one? Choose the correct place (A, B or C).", "vis": "", "items": [{"id": "EN1-157", "niv": 2, "cp": "en_p2", "cn": "", "e": "Notice: \"Staff only. Authorized personnel beyond this point.\"\n\nWhere can you see this notice?", "f": "Conocimiento pragmático: propósito y lugar del aviso (redacción propia)", "vis": "", "o": [["A", "on a box of cereal", "Una caja de cereal no restringe el paso de personas.", false], ["B", "on a birthday party invitation", "Una invitación de cumpleaños invita, no prohíbe pasar.", false], ["C", "on a door in a factory", "Correcta. El aviso dice: «Solo personal. Solo personal autorizado a partir de este punto». El aviso restringe el paso a empleados autorizados: va en una puerta interna de una fábrica.", true]]}, {"id": "EN1-158", "niv": 3, "cp": "en_p2", "cn": "", "e": "Notice: \"Please wash your hands before returning to work.\"\n\nWhere can you see this notice?", "f": "Conocimiento pragmático: propósito y lugar del aviso (redacción propia)", "vis": "", "o": [["A", "on the window of a car dealership", "En la vitrina de un concesionario se anuncian carros, no se dan instrucciones de higiene.", false], ["B", "in a restaurant's staff restroom", "Correcta. El aviso dice: «Por favor lávese las manos antes de volver al trabajo». «Before returning to work» se dirige a empleados; en restaurantes es obligatorio lavarse las manos en el baño del personal.", true], ["C", "in the waiting room of a bank", "En la sala de espera de un banco están los clientes, que no van a «volver al trabajo».", false]]}, {"id": "EN1-159", "niv": 2, "cp": "en_p2", "cn": "", "e": "Notice: \"Please take a number and wait until it appears on the screen.\"\n\nWhere can you see this notice?", "f": "Conocimiento pragmático: propósito y lugar del aviso (redacción propia)", "vis": "", "o": [["A", "in a bank", "Correcta. El aviso dice: «Por favor tome un turno y espere hasta que aparezca en la pantalla». En un banco se toma un turno (number) y se espera a que aparezca en la pantalla.", true], ["B", "in a park", "En un parque no se toman turnos ni hay pantalla de llamado.", false], ["C", "in a cinema", "En el cine hay pantalla, pero no se toman turnos para ser atendido.", false]]}, {"id": "EN1-160", "niv": 2, "cp": "en_p2", "cn": "", "e": "Notice: \"Hard hats must be worn in this area at all times.\"\n\nWhere can you see this notice?", "f": "Conocimiento pragmático: propósito y lugar del aviso (redacción propia)", "vis": "", "o": [["A", "at a public swimming pool", "En una piscina pública se usa gorro de natación, no casco.", false], ["B", "at a construction site", "Correcta. El aviso dice: «Es obligatorio usar casco en esta zona en todo momento». «Hard hat» es casco de seguridad, obligatorio en las obras en construcción.", true], ["C", "in a hat store", "Trampa léxica: en una tienda de sombreros hay «hats», pero no se exige llevarlos puestos.", false]]}, {"id": "EN1-161", "niv": 3, "cp": "en_p2", "cn": "", "e": "Notice: \"Salaries will be paid on the last working day of each month.\"\n\nWhere can you see this notice?", "f": "Conocimiento pragmático: propósito y lugar del aviso (redacción propia)", "vis": "", "o": [["A", "at a supermarket checkout", "En la caja de un supermercado los clientes pagan; allí no se anuncia a quién se le paga el sueldo.", false], ["B", "in a doctor's waiting room", "En la sala de espera de un médico están pacientes, no empleados que reciben salario.", false], ["C", "in a company office", "Correcta. El aviso dice: «Los salarios se pagarán el último día hábil de cada mes». «Salaries» son los sueldos; el aviso es para los empleados de una empresa.", true]]}]}, {"comp": "ingles", "sim": "val-1", "ses": 2, "ind": "Parte 3 · Conversaciones breves", "tt": "", "texto": "Complete the conversations. Read what the first person says and choose the best answer (A, B or C).", "vis": "", "items": [{"id": "EN1-162", "niv": 1, "cp": "en_p3", "cn": "", "e": "\"Good morning. Could I speak to Ms. Rojas, please?\"", "f": "Conocimiento comunicativo: respuesta adecuada en una conversación breve (redacción propia)", "vis": "", "o": [["A", "Sure. One moment, please.", "Correcta. «Good morning. Could I speak to Ms. Rojas, please?» = «Buenos días. ¿Podría hablar con la señora Rojas, por favor?». Respuesta telefónica natural: «Claro. Un momento, por favor».", true], ["B", "Good morning. I'm fine, thanks.", "Responde a «How are you?», que no se preguntó.", false], ["C", "Yes, you are speaking.", "«Usted está hablando» no tiene sentido; si fuera ella diría «Speaking» (con ella habla).", false]]}, {"id": "EN1-163", "niv": 1, "cp": "en_p3", "cn": "", "e": "\"When does the meeting start?\"", "f": "Conocimiento comunicativo: respuesta adecuada en una conversación breve (redacción propia)", "vis": "", "o": [["A", "For an hour.", "Indica la duración, no la hora de inicio.", false], ["B", "In the meeting room on the third floor.", "Indica el lugar (la sala del tercer piso), no el momento.", false], ["C", "At nine o'clock.", "Correcta. «When does the meeting start?» = «¿Cuándo empieza la reunión?». «When» pide un momento: «A las nueve».", true]]}, {"id": "EN1-164", "niv": 2, "cp": "en_p3", "cn": "", "e": "\"Could you send me the report by Friday?\"", "f": "Conocimiento comunicativo: respuesta adecuada en una conversación breve (redacción propia)", "vis": "", "o": [["A", "It's on Friday.", "Diría que algo ocurre el viernes, pero no acepta ni rechaza la petición.", false], ["B", "No problem. I'll email it to you on Thursday.", "Correcta. «Could you send me the report by Friday?» = «¿Me podrías enviar el informe a más tardar el viernes?». Acepta y propone un día antes del plazo: «Sin problema. Se lo envío por correo el jueves».", true], ["C", "Yes, I'm sending it to you last week by email.", "Mezcla presente continuo con «last week» (semana pasada): agramatical.", false]]}, {"id": "EN1-165", "niv": 1, "cp": "en_p3", "cn": "", "e": "\"Thank you for your help today.\"", "f": "Conocimiento comunicativo: respuesta adecuada en una conversación breve (redacción propia)", "vis": "", "o": [["A", "You're welcome.", "Correcta. «Thank you for your help today.» = «Gracias por tu ayuda hoy.». Respuesta a un agradecimiento: «Con gusto» / «De nada».", true], ["B", "Me too. Thank you very much.", "«Yo también. Muchas gracias» no tiene sentido cuando el otro agradece una ayuda recibida.", false], ["C", "Yes, please.", "«Sí, por favor» acepta un ofrecimiento; no responde a un agradecimiento.", false]]}, {"id": "EN1-166", "niv": 3, "cp": "en_p3", "cn": "", "e": "\"How long have you worked for this company?\"", "f": "Conocimiento comunicativo: respuesta adecuada en una conversación breve (redacción propia)", "vis": "", "o": [["A", "For about six years.", "Correcta. «How long have you worked for this company?» = «¿Cuánto tiempo llevas trabajando en esta empresa?». Con presente perfecto se indica la duración con «for»: «Hace unos seis años».", true], ["B", "Since six years.", "Incorrecta: «since» va con un punto en el tiempo (since 2020); con una cantidad se usa «for».", false], ["C", "Six years ago, in March.", "«Ago» indica un momento terminado en el pasado (hace seis años, en marzo); no la duración hasta hoy.", false]]}]}, {"comp": "ingles", "sim": "val-1", "ses": 2, "ind": "Correo de un estudiante adulto a su profesor", "tt": "", "texto": "Read the text and choose the word that best fills each numbered gap.\n\nDear Professor Molina,\n\nMy name is Hernán Ruiz, and I am one of the students in your Saturday class. I am writing (1) ______ I will not be able to attend next Saturday. My company has asked me to work that day because two of my colleagues (2) ______ sick. I have worked at the factory (3) ______ 2011, and this is the first time I have missed a class. I know the exam is in April, so I do not want to fall behind. Could you please tell me (4) ______ pages I should study at home? I can also ask my classmate Gloria to lend me her notes. She is (5) ______ organized than me and always writes everything down.\n\nI left school when I (6) ______ fifteen years old, and finishing high school is very important to me and to my children. Thank you for (7) ______ understanding. I look forward to (8) ______ you the following Saturday.\n\nBest regards,\nHernán Ruiz", "vis": "", "items": [{"id": "EN2-401", "niv": 1, "cp": "en_p4", "cn": "", "e": "Gap (1)", "f": "Gramática: conectores de causa", "vis": "", "o": [["A", "unless", "«unless» (a menos que) expresa una condición negativa; «escribo a menos que no pueda asistir» no tiene sentido.", false], ["B", "because", "Correcta: «because» (porque) introduce la razón del correo: escribe porque no podrá asistir.", true], ["C", "although", "«although» (aunque) expresa contraste; no hay contraste entre escribir y no poder asistir.", false]]}, {"id": "EN2-402", "niv": 1, "cp": "en_p4", "cn": "", "e": "Gap (2)", "f": "Gramática: concordancia con sujeto plural", "vis": "", "o": [["A", "is", "«is» es singular; el sujeto «two of my colleagues» es plural.", false], ["B", "be", "«be» es la forma base; después de un sujeto necesita conjugarse (are).", false], ["C", "are", "Correcta: el sujeto «two of my colleagues» es plural, así que el verbo «be» va en «are»: «two of my colleagues are sick».", true]]}, {"id": "EN2-403", "niv": 3, "cp": "en_p4", "cn": "", "e": "Gap (3)", "f": "Gramática: since / for / ago", "vis": "", "o": [["A", "for", "«for» introduce una duración (for fifteen years), no un año de inicio como 2011.", false], ["B", "since", "Correcta: con el presente perfecto, «since» marca el punto de inicio: «I have worked at the factory since 2011» (desde 2011).", true], ["C", "ago", "«ago» va después de una cantidad de tiempo (fifteen years ago) y con pasado simple, no antes de un año ni con presente perfecto.", false]]}, {"id": "EN2-404", "niv": 2, "cp": "en_p4", "cn": "", "e": "Gap (4)", "f": "Gramática: palabras interrogativas en preguntas indirectas", "vis": "", "o": [["A", "whose", "«whose» pregunta por el dueño (de quién); no tiene sentido preguntar de quién son las páginas a estudiar.", false], ["B", "who", "«who» pregunta por personas, no por páginas.", false], ["C", "which", "Correcta: «which pages» (qué páginas) pregunta por una selección dentro de un grupo de cosas.", true]]}, {"id": "EN2-405", "niv": 1, "cp": "en_p4", "cn": "", "e": "Gap (5)", "f": "Gramática: comparativo de adjetivos largos", "vis": "", "o": [["A", "more", "Correcta: «organized» es un adjetivo largo, así que su comparativo es «more organized than» (más organizada que).", true], ["B", "most", "«most» forma el superlativo y no se usa con «than».", false], ["C", "much", "«much organized than» no es correcto; «much» podría reforzar un comparativo (much more organized), pero no lo reemplaza.", false]]}, {"id": "EN2-406", "niv": 2, "cp": "en_p4", "cn": "", "e": "Gap (6)", "f": "Gramática: pasado de be y edad (I was ... years old)", "vis": "", "o": [["A", "am", "«am» es presente; no concuerda con un hecho del pasado.", false], ["B", "were", "«I were» no es correcto en una oración que narra un hecho real del pasado; con «I» se usa «was».", false], ["C", "was", "Correcta: la acción es pasada («I left school») y el sujeto es «I»: «when I was fifteen years old» (cuando tenía quince años).", true]]}, {"id": "EN2-407", "niv": 2, "cp": "en_p4", "cn": "", "e": "Gap (7)", "f": "Gramática: adjetivos y pronombres posesivos", "vis": "", "o": [["A", "you", "«you» es pronombre sujeto/objeto; no puede ir antes de un sustantivo para indicar posesión.", false], ["B", "your", "Correcta: antes del sustantivo «understanding» va el adjetivo posesivo «your»: «Thank you for your understanding» (gracias por su comprensión).", true], ["C", "yours", "«yours» es pronombre posesivo y reemplaza al sustantivo (it is yours); no va antes de él.", false]]}, {"id": "EN2-408", "niv": 3, "cp": "en_p4", "cn": "", "e": "Gap (8)", "f": "Gramática: look forward to + -ing (Cambridge Dictionary, English Grammar Today)", "vis": "", "o": [["A", "seeing", "Correcta: en «look forward to», «to» es preposición, por lo que va seguida de -ing: «I look forward to seeing you» (espero verlo).", true], ["B", "see", "Es el error más común: se confunde «to» con el infinitivo; tras «look forward to» no va la forma base.", false], ["C", "saw", "«saw» es pasado de «see»; no puede seguir a una preposición y además el encuentro es futuro.", false]]}]}, {"comp": "ingles", "sim": "val-1", "ses": 2, "ind": "Historia de vida: conductor que aprendió inglés para trabajar en turismo", "tt": "", "texto": "Read the text and answer the questions.\n\nFrom the city bus to the tourist route\n\nFor twelve years, Óscar Villamil drove a city bus in Cartagena. The job was stable, but the hours were long and he rarely saw his family during the week. In 2021, a friend told him that a tourism company needed drivers for its tours to the beaches and the old forts near the city. There was one condition: drivers had to speak basic English.\n\nÓscar had studied a little English at school, but he had forgotten almost everything. For eight months, he studied for an hour every night with a free app on his phone. On Sundays, he practiced with his niece Paula, who was studying to be a teacher. \"She was very patient,\" he says, \"but she never let me speak Spanish during our lessons.\"\n\nHe passed the company's interview on his second try. Now he drives a minibus for groups of up to twenty tourists. Besides driving, he welcomes the passengers, explains the plan for the day and answers simple questions. A professional guide travels with each group to give the historical information.\n\nÓscar works fewer hours than before and earns a little more, but what he enjoys most is talking to people from other countries. His advice for adults who want to learn a language is simple: \"Study a little every day. One hour each night is better than seven hours on Sunday.\"", "vis": "", "items": [{"id": "EN2-409", "niv": 1, "cp": "en_p5", "cn": "", "e": "What was a problem with Óscar's job as a city bus driver?", "f": "Párrafo 1", "vis": "", "o": [["A", "He had little time with his family on weekdays.", "Correcta: párrafo 1, las jornadas eran largas y «he rarely saw his family during the week» (casi no veía a su familia entre semana).", true], ["B", "The job was not stable.", "El texto dice lo contrario: «The job was stable» (era estable).", false], ["C", "He had to drive through a dangerous part of the city.", "No se menciona peligro en la ruta.", false]]}, {"id": "EN2-410", "niv": 1, "cp": "en_p5", "cn": "", "e": "What did the tourism company require from its drivers?", "f": "Párrafo 1", "vis": "", "o": [["A", "Knowledge of the history of the forts.", "La información histórica la da el guía, no el conductor.", false], ["B", "Some experience as a tour guide.", "No se pide experiencia como guía; de hecho, un guía profesional acompaña a cada grupo.", false], ["C", "A basic level of English.", "Correcta: párrafo 1, «drivers had to speak basic English» (debían hablar inglés básico).", true]]}, {"id": "EN2-411", "niv": 2, "cp": "en_p5", "cn": "", "e": "How did Óscar study every night?", "f": "Párrafo 2", "vis": "", "o": [["A", "He took evening classes at a language school.", "No se menciona ninguna academia de idiomas.", false], ["B", "He used a free phone application for an hour.", "Correcta: párrafo 2, estudió una hora cada noche «with a free app on his phone» (con una aplicación gratuita en el celular).", true], ["C", "He practiced with his niece, who was studying to be a teacher.", "Con su sobrina Paula practicaba los domingos, no todas las noches.", false]]}, {"id": "EN2-412", "niv": 2, "cp": "en_p5", "cn": "", "e": "What rule did Paula have during the lessons?", "f": "Párrafo 2", "vis": "", "o": [["A", "Óscar had to finish the app exercises first.", "El texto no relaciona las clases de Paula con la aplicación.", false], ["B", "Each lesson had to last one hour.", "La hora diaria era de estudio con la aplicación, no una regla de Paula.", false], ["C", "Óscar was not allowed to use Spanish.", "Correcta: párrafo 2, «she never let me speak Spanish during our lessons» (nunca lo dejaba hablar español).", true]]}, {"id": "EN2-413", "niv": 2, "cp": "en_p5", "cn": "", "e": "What do we learn about Óscar's interview with the company?", "f": "Párrafo 3", "vis": "", "o": [["A", "His niece went with him.", "El texto no dice que Paula lo acompañara a la entrevista.", false], ["B", "He did not pass it the first time he tried.", "Correcta: párrafo 3, pasó la entrevista «on his second try», así que en el primer intento no la pasó.", true], ["C", "He passed it easily on the first day he tried.", "Lo pasó «on his second try», es decir, en el segundo intento, no en el primero.", false]]}, {"id": "EN2-414", "niv": 2, "cp": "en_p5", "cn": "", "e": "Who gives the historical information on the tours?", "f": "Párrafo 3", "vis": "", "o": [["A", "A guide who travels with the group.", "Correcta: párrafo 3, «A professional guide travels with each group to give the historical information».", true], ["B", "Óscar himself.", "Óscar da la bienvenida, explica el plan y responde preguntas sencillas, pero la historia la cuenta el guía.", false], ["C", "A recording on the minibus.", "No se menciona ninguna grabación.", false]]}, {"id": "EN2-415", "niv": 3, "cp": "en_p5", "cn": "", "e": "What does Óscar like most about his new job?", "f": "Párrafo 4", "vis": "", "o": [["A", "He earns more money than before.", "Gana un poco más, pero «but» introduce lo que más disfruta: hablar con extranjeros.", false], ["B", "He talks with people from other countries.", "Correcta: párrafo 4, «what he enjoys most is talking to people from other countries» (lo que más disfruta es hablar con extranjeros).", true], ["C", "He now works fewer hours than he did on the city bus.", "Es un beneficio que menciona, pero el texto aclara con «but» que no es lo que más le gusta.", false]]}]}, {"comp": "ingles", "sim": "val-1", "ses": 2, "ind": "Testimonio: terminar el bachillerato a los 42 años", "tt": "", "texto": "Read the text and answer the questions. Choose the correct answer (A, B, C or D).\n\nI finished school at forty-two\n\nFor twenty years, whenever someone asked about my education, I changed the subject. I left school in ninth grade to help my parents at their shop, and later I got married, had two children and worked in a factory. I told myself I was too busy, but the truth is that I was afraid. Afraid of failing, and afraid of sitting in a classroom with people half my age.\n\nWhat changed? My daughter. One night she asked me to help her with her math homework, and I couldn't. She didn't say anything, but I saw her face. The next week I signed up for evening classes.\n\nThe first months were hard. I studied after my shift, often with my eyes half closed, and I failed my first practice test. My husband started cooking dinner on weekdays, something he had never done before, and my son made flash cards for me with words in English.\n\nLast year I passed the exam. At the ceremony, I was the oldest person in the room, and I realized I didn't care at all. Now I am studying to become a nursing assistant. My daughter still asks me for help with her homework sometimes. Now, I can say yes.", "vis": "", "items": [{"id": "EN3-155", "niv": 2, "cp": "en_p6", "cn": "", "e": "What does the writer suggest about the reason she used to give for not studying (\"I was too busy\")?", "f": "Inferencia: párrafo 1", "vis": "", "o": [["A", "It was the complete and only truth.", "«but the truth is» muestra que estar ocupada no era la verdadera razón.", false], ["B", "It was an excuse that hid her real fear.", "Correcta. Ella misma lo dice: «I told myself I was too busy, but the truth is that I was afraid» (me decía que estaba muy ocupada, pero la verdad es que tenía miedo).", true], ["C", "Her husband had told her to say it.", "El texto no dice que el esposo le pidiera dar esa razón.", false], ["D", "It was the reason her parents gave her for leaving school.", "Dejó el colegio para ayudar en la tienda; la frase «too busy» es lo que ella se decía después.", false]]}, {"id": "EN3-156", "niv": 1, "cp": "en_p6", "cn": "", "e": "What made the writer decide to go back to school?", "f": "Inferencia de causa: párrafo 2", "vis": "", "o": [["A", "realizing that she could not help her daughter with homework", "Correcta. «What changed? My daughter»: no pudo ayudarla con las tareas de matemáticas y a la semana siguiente se inscribió.", true], ["B", "a suggestion from her husband", "El esposo la apoyó después, cocinando; no fue quien la impulsó a estudiar.", false], ["C", "losing her job at the factory", "El texto no dice que perdiera su empleo; estudiaba después de su turno («after my shift»).", false], ["D", "an advertisement for evening classes that she saw near the factory", "No se menciona ningún anuncio.", false]]}, {"id": "EN3-157", "niv": 2, "cp": "en_p6", "cn": "", "e": "What does the third paragraph suggest about the writer's family?", "f": "Inferencia: párrafo 3", "vis": "", "o": [["A", "They thought she should stop studying.", "Sus acciones muestran apoyo, no oposición.", false], ["B", "They did not know that she was studying.", "Si le hacían tarjetas y cocinaban para darle tiempo, sí lo sabían.", false], ["C", "They paid for all of her classes.", "El texto no habla de quién pagó las clases.", false], ["D", "They supported her by changing their own routines.", "Correcta. El esposo empezó a cocinar entre semana, algo que nunca había hecho, y el hijo le hizo tarjetas de vocabulario.", true]]}, {"id": "EN3-158", "niv": 3, "cp": "en_p6", "cn": "", "e": "\"I was the oldest person in the room, and I realized I didn't care at all.\" This shows that the writer", "f": "Inferencia: párrafos 1 y 4", "vis": "", "o": [["A", "wanted to leave the ceremony as soon as possible.", "«I didn't care at all» indica tranquilidad, no deseo de irse.", false], ["B", "had not noticed the age of the other people.", "Sí lo notó: dice que era la persona de más edad del salón.", false], ["C", "had overcome one of her earlier fears.", "Correcta. En el primer párrafo temía «sitting in a classroom with people half my age»; en la ceremonia ya no le importa ser la mayor.", true], ["D", "was angry that younger people had also passed the exam.", "No hay ningún indicio de enojo hacia los demás.", false]]}, {"id": "EN3-159", "niv": 3, "cp": "en_p6", "cn": "", "e": "Why does the writer end the text by mentioning her daughter's homework again?", "f": "Inferencia sobre la estructura del texto", "vis": "", "o": [["A", "to explain why she failed her first practice test", "El examen de práctica pertenece al tercer párrafo y no se relaciona con el final.", false], ["B", "to suggest that her daughter is now studying nursing", "Quien estudia para auxiliar de enfermería es la autora, no la hija.", false], ["C", "to show how much she has changed since the night that made her go back to school", "Correcta. El final retoma la escena inicial: antes no pudo ayudar; ahora «I can say yes». El cierre muestra el cambio.", true], ["D", "to complain that her daughter still depends on her too much for help with homework", "Dice «sometimes» (a veces) y lo presenta como algo positivo, no como queja.", false]]}]}, {"comp": "ingles", "sim": "val-1", "ses": 2, "ind": "Texto con espacios: correo laboral sobre nuevo horario", "tt": "", "texto": "Read the text and choose the best word (A, B, C or D) for each gap.\n\nTo: All warehouse staff\nSubject: New schedule from Monday\n\nDear team,\n\nStarting next Monday, the warehouse will open one hour earlier, at 6:00 a.m., because we have received many new orders. Each worker will const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])).replace(/\^(\([^()]{1,20}\)|[0-9A-Za-z]+(?:,[0-9]+)?)/g, (m, g) => '<sup>' + (g[0] === '(' ? g.slice(1, -1) : g) + '</sup>');
const KEY = 'sim-saber11:' + CFG.clave;

const keyOf = it => it.o.find(o => o[3])[0];

function justHTML(it){
  const many = it.o.length > 4;
  return '<div class="just">' + it.o.filter(o => !many || o[3] || ST.r[it.id] === o[0]).map(o => `<div><b>${o[0]}.</b> <span class="${o[3]?'okt':'not'}">${o[3]?'Es correcta.':'Es incorrecta.'}</span> ${esc(o[2])}</div>`).join('') +
    `<div class="src">${esc(CFG.competencias[it.cp])} · Referencia: ${esc(it.f)}</div></div>`;
}
function itemHTML(it, n, mode){
  const r = ST.r[it.id];
  const reveal = mode === 'review' || (CFG.modo === 'practica' && r);
  let h = `<div class="item" id="i-${it.id}"><p class="enun"><span class="n">${n}.</span> <span class="niv">${CFG.niveles[it.niv]}</span> ${esc(it.e)}</p>${it.vis||''}<div class="${it.o.length>4?'ops8':''}">`;
  it.o.forEach(o => {
    let cls = '';
    if (reveal) { if (o[3]) cls = 'ok'; else if (r === o[0]) cls = 'no'; }
    else if (r === o[0]) cls = 'sel';
    h += `<button class="op ${cls}" data-id="${it.id}" data-l="${o[0]}" ${reveal?'disabled':''}><span class="l">${o[0]}.</span><span>${esc(o[1])}</span></button>`;
  });
  h += '</div>';
  if (reveal) {
    if (mode === 'review') h += `<div class="${r===keyOf(it)?'res-ok':'res-no'}" style="font-size:14px;margin-top:4px">${r ? (r===keyOf(it)?'Respondiste ' + r + ': correcto.':'Respondiste ' + r + '. La respuesta correcta es ' + keyOf(it) + '.') : 'Sin responder. La respuesta correcta es ' + keyOf(it) + '.'}</div>`;
    h += justHTML(it);
  }
  return h + '</div>';
}
function renderList(list, mode){
  let h = '', last = null, comp = null, parte = null, n = 0;
  const showMods = CFG.modo !== 'practica' || mode === 'review';
  list.forEach((it, idx) => {
    n++;
    if (it.caso !== last) {
      last = it.caso;
      if (it.caso.comp !== comp) { comp = it.caso.comp; parte = null; if (showMods) h += `<div class="mod" id="m-${comp}">${esc(CFG.componentes[comp])}</div>`; }
      if (comp === 'ingles' && it.cp !== parte) { parte = it.cp; h += `<div class="inst">${esc(CFG.instr[parte])}</div>`; }
      const k = last.items.filter(x => list.includes(x)).length;
      if (k > 1) h += `<div class="inst">Responda las preguntas ${n} a ${n + k - 1} de acuerdo con la siguiente información</div>`;
      let tag = CFG.modo === 'practica' ? CFG.componentes[comp] + (last.tt ? ' · ' + last.tt : '') + (last.ind ? ' · ' + last.ind : '') : (last.tt || '');
      h += `<div class="caso">${tag ? `<div class="tag">${esc(tag)}</div>` : ''}<p>${esc(last.texto)}</p>${last.vis||''}</div>`;
    }
    h += itemHTML(it, n, mode);
  });
  return h;
}

let LIST = [];

function practica(){
  const comps = Object.entries(CFG.componentes).filter(([k]) => ITEMS.some(i => i.caso.comp === k)).map(([k,v]) => `<option value="${k}" ${FILTRO.comp===k?'selected':''}>${esc(v)}</option>`).join('');

  if (FILTRO.cp && !ITEMS.some(i => i.cp === FILTRO.cp && (!FILTRO.comp || i.caso.comp === FILTRO.comp))) FILTRO.cp = '';
  const nivs = Object.entries(CFG.niveles).map(([k,v]) => `<option value="${k}" ${FILTRO.niv===k?'selected':''}>${esc(v)}</option>`).join('');
  const list = ITEMS.filter(it => (!FILTRO.comp || it.caso.comp===FILTRO.comp) && (!FILTRO.cp || it.cp===FILTRO.cp) && (!FILTRO.niv || String(it.niv)===FILTRO.niv) && (!FILTRO.ex || it.caso.sim.startsWith(FILTRO.ex)));
  const resp = list.filter(it => ST.r[it.id]); const ok = resp.filter(it => ST.r[it.id]===keyOf(it));
  $('#main').innerHTML = `<div class="panel"><p style="margin-top:0">Elige prueba, competencia y dificultad. Al responder verás de inmediato si acertaste y la explicación. Las preguntas de los simulacros también están aquí: si quieres presentarlos «en limpio», hazlos antes de practicar.</p>

  <select id="fp"><option value="">Todas las competencias</option>${cps}</select>
  <select id="fn"><option value="">Todas las dificultades</option>${nivs}</select>
  <select id="fe"><option value="">Todas las preguntas</option><option value="s11" ${FILTRO.ex==='s11'?'selected':''}>De los simulacros Saber 11</option><option value="val" ${FILTRO.ex==='val'?'selected':''}>De los simulacros de Validación</option><option value="practica" ${FILTRO.ex==='practica'?'selected':''}>Solo banco extra de práctica</option></select>
  <button class="btn sec" id="borrar">Borrar mis respuestas</button></div>
  <p class="stat" id="pst" style="margin-bottom:0">${list.length} preguntas · respondidas ${resp.length} · aciertos ${ok.length}${resp.length? ' (' + Math.round(100*ok.length/resp.length) + ' %)':''}</p></div>` + renderList(list, 'practica');
  $('#prog').textContent = `${ok.length}/${resp.length} aciertos`;
  [['fc','comp'],['fp','cp'],['fn','niv'],['fe','ex']].forEach(([id,k]) => $('#'+id).onchange = e => { FILTRO[k] = e.target.value; if (k==='comp') FILTRO.cp=''; ST.f = FILTRO; save(); practica(); });
  LIST = list;
  $('#borrar').onclick = () => { list.forEach(it => delete ST.r[it.id]); save(); practica(); };
}

  document.querySelectorAll('[data-ses]').forEach(b => b.onclick = () => { const s = +b.dataset.ses; if (!ST.t[s]) ST.t[s] = Date.now(); ACT = ST.act = s; save(); examen(); window.scrollTo(0,0); });
  document.querySelectorAll('[data-res]').forEach(b => b.onclick = () => { resultados(); window.scrollTo(0,0); });
  const o = $('#otra'); if (o) o.onclick = reiniciar;
}
function reiniciar(){ ST = {r:{}, t:{}, fin:{}}; ACT = 0; save(); inicio(); window.scrollTo(0,0); }
function reloj(){
  const rest = CFG.minutos*60 - Math.floor((Date.now() - ST.t[ACT])/1000);
  const a = Math.abs(rest), hh = Math.floor(a/3600), mm = Math.floor(a%3600/60), ss = a%60;
  const t = (rest < 0 ? '+' : '') + (hh ? hh + ':' : '') + String(mm).padStart(2,'0') + ':' + String(ss).padStart(2,'0');
  $('#timer').textContent = rest < 0 ? 'Tiempo cumplido ' + t : '⏱ ' + t;
  $('#timer').classList.toggle('low', rest < 600);
}
function navHTML(list){
  const comps = [...new Set(list.map(i => i.caso.comp))];
  return '<div class="nav">' + comps.map(c => `<a href="#m-${c}">${esc(CFG.componentes[c])}</a>`).join('') + '</div>';
}
function examen(){
  const L = SES(ACT);
  $('#main').innerHTML = `<div class="mod" style="margin-top:0">${nombreS(ACT)}</div>` + navHTML(L) + renderList(L, 'examen') + `<div class="panel"><button class="btn" id="fin">Terminar la ${nombreS(ACT).toLowerCase()}</button> <button class="btn sec" id="volver">Volver al inicio</button></div>`;
  progreso(); reloj(); clearInterval(tick); tick = setInterval(reloj, 1000);
  $('#volver').onclick = () => { ST.act = ACT = 0; save(); inicio(); window.scrollTo(0,0); };
  $('#fin').onclick = () => {
    const faltan = L.length - L.filter(i => ST.r[i.id]).length;
    $('#mtxt').textContent = (faltan ? `Te faltan ${faltan} preguntas por responder en esta sesión. ¿Quieres terminarla de todos modos?` : '¿Quieres terminar esta sesión?');
    $('#modal').classList.remove('hide');
  };
}
function progreso(){
  const L = SES(ACT);
  const r = L.filter(it => ST.r[it.id]).length;
  $('#prog').textContent = `${nombreS(ACT)} · respondidas ${r}/${L.length}`;
}
$('#mno').onclick = () => $('#modal').classList.add('hide');
$('#msi').onclick = () => { $('#modal').classList.add('hide'); ST.fin[ACT] = Date.now(); ST.act = ACT = 0; save(); clearInterval(tick); if (ST.fin[1] && ST.fin[2]) resultados(); else inicio(); window.scrollTo(0,0); };
const fmt = x => String(Math.round(x*10)/10).replace('.', ',');
function resultados(){
  clearInterval(tick);
  const L = ITEMS.filter(it => ST.fin[it.caso.ses]);
  const completo = ST.fin[1] && ST.fin[2];
  const ok = L.filter(it => ST.r[it.id] === keyOf(it)).length;
  const pct = 100*ok/L.length;
  const agrupa = (lst, fn) => { const m = {}; lst.forEach(it => { const k = fn(it); m[k] = m[k] || [0,0]; m[k][1]++; if (ST.r[it.id]===keyOf(it)) m[k][0]++; }); return m; };
  const fila = (lab, v, cls) => `<tr class="${cls||''}"><td>${esc(lab)}</td><td class="r">${v[0]}/${v[1]}</td><td class="r">${Math.round(100*v[0]/v[1])} %</td></tr>`;
  const porMod = agrupa(L, it => it.caso.comp), porNiv = agrupa(L, it => it.niv);
  let tabla = '';
  Object.keys(CFG.componentes).filter(m => porMod[m]).forEach(m => { tabla += fila(CFG.componentes[m], porMod[m]);
    const sub = agrupa(L.filter(i => i.caso.comp === m), it => it.cp);
    Object.keys(CFG.competencias).filter(k => sub[k]).forEach(k => tabla += fila(CFG.competencias[k], sub[k], 'sub'));
    if (m === 'ciencias_naturales') { const cn = agrupa(L.filter(i => i.caso.comp === m), it => it.cn); Object.keys(CFG.comp_cn).filter(k => cn[k]).forEach(k => tabla += fila('Componente ' + CFG.comp_cn[k].toLowerCase(), cn[k], 'sub')); } });
  let ind = '';
  if (completo) {
    let num = 0, den = 0; Object.entries(porMod).forEach(([m, v]) => { num += PESO[m] * v[0]/v[1]; den += PESO[m]; });
    const pond = 100*num/den;
    ind = CFG.cuad === 'validantes'
      ? `<p><b>Indicador ponderado de aciertos: ${fmt(pond)} %</b> (Lectura Crítica, Matemáticas, Sociales y Ciencias pesan 3; Inglés pesa 1, igual que en el puntaje total de la Validación).</p><p class="aviso">Para aprobar la Validación necesitas un puntaje total de 30 o más en una escala de 0 a 60, que el Icfes calcula con un modelo estadístico (30 es el promedio de los validantes). Ningún simulacro puede convertir aciertos en ese puntaje exacto: usa el indicador para medir tu avance entre simulacros y refuerza primero las pruebas con peso 3 que tengas más bajas.</p>`
      : `<p><b>Indicador global ponderado: ${Math.round(5*pond)} de 500</b> (${fmt(pond)} % de aciertos ponderados: Lectura Crítica, Matemáticas, Sociales y Ciencias pesan 3; Inglés pesa 1, como en el puntaje global).</p><p class="aviso">El Icfes calcula el puntaje de cada prueba (0 a 100) y el global (0 a 500) con un modelo estadístico que tiene en cuenta la dificultad de cada pregunta y compara a todos los evaluados. Por eso este indicador no es tu puntaje oficial: sirve para medir tu avance entre simulacros.</p>`;
  }
  const mins = s => ST.fin[s] ? Math.round((ST.fin[s] - ST.t[s])/60000) : null;
  const tUso = [1,2].filter(s => ST.fin[s]).map(s => { const x = mins(s); return `${nombreS(s)}: ${Math.floor(x/60) ? Math.floor(x/60) + ' h ' : ''}${x%60} min`; }).join(' · ');
  $('#timer').textContent = '';
  $('#prog').textContent = `${ok}/${L.length} aciertos`;
  const peor = Object.entries(porMod).sort((a,b) => a[1][0]/a[1][1] - b[1][0]/b[1][1])[0];
  $('#main').innerHTML = `<div class="panel">${completo ? '' : `<p class="aviso" style="margin-top:0"><b>Resultado parcial:</b> solo has terminado la ${[1,2].filter(s=>ST.fin[s]).map(nombreS).join(' y ').toLowerCase()}. Termina la otra sesión para ver el resultado completo.</p>`}
  <div class="big">${fmt(pct)} %</div>
  <p style="margin-top:4px">${ok} de ${L.length} respuestas correctas. ${pct >= 75 ? 'Muy buen resultado: repasa tus errores para afianzarlo.' : pct >= 55 ? 'Vas por buen camino: refuerza las pruebas y competencias con menor porcentaje.' : 'Hay que reforzar: practica por prueba y competencia, empezando por la más baja.'} Tu prueba más baja: <b>${esc(CFG.componentes[peor[0]])}</b>.</p>
  ${ind}<p class="stat">Tiempo usado · ${tUso}</p>
  <h3>Por prueba y competencia</h3><table>${tabla}</table>
  <h3>Por dificultad</h3><table>${Object.entries(porNiv).map(([k,v]) => fila(CFG.niveles[k], v)).join('')}</table>
  <div class="row" style="margin-top:14px"><button class="btn sec" id="solo">Ver solo mis errores</button><button class="btn sec" id="todas">Ver todas</button><button class="btn sec" id="ini">Volver al inicio</button><button class="btn sec" id="otra">Reiniciar el simulacro</button></div></div><div id="rev"></div>`;
  const rev = errs => { let h = ''; [1,2].filter(s => ST.fin[s]).forEach(s => { const l = SES(s).filter(it => !errs || ST.r[it.id] !== keyOf(it)); h += `<div class="mod">${nombreS(s)}</div>` + (l.length ? renderList(l, 'review') : '<div class="panel">¡No tuviste errores en esta sesión!</div>'); }); $('#rev').innerHTML = h; };
  rev(true);
  $('#solo').onclick = () => rev(true); $('#todas').onclick = () => rev(false);
  $('#ini').onclick = () => { inicio(); window.scrollTo(0,0); };
  $('#otra').onclick = reiniciar;
}

document.addEventListener('click', e => {
  const b = e.target.closest('button.op'); if (!b || b.disabled) return;
  if (CFG.modo === 'simulacro' && (!ACT || ST.fin[ACT])) return;
  ST.r[b.dataset.id] = b.dataset.l; save();
  const it = ITEMS.find(i => i.id === b.dataset.id);
  const n = b.closest('.item').querySelector('.n').textContent.replace('.','');
  b.closest('.item').outerHTML = itemHTML(it, n, CFG.modo === 'practica' ? 'practica' : 'examen');
  if (CFG.modo === 'practica') { const resp = LIST.filter(i => ST.r[i.id]); const ok = resp.filter(i => ST.r[i.id]===keyOf(i)).length; $('#prog').textContent = `${ok}/${resp.length} aciertos`; $('#pst').textContent = `${LIST.length} preguntas · respondidas ${resp.length} · aciertos ${ok} (${Math.round(100*ok/resp.length)} %)`; }
  else progreso();
});
if (CFG.modo === 'practica') practica();
else if (ACT && ST.t[ACT] && !ST.fin[ACT]) examen();
else inicio();
</script>
</body>
</html>
