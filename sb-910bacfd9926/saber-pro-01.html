ón es falsa, porque las dos sedes tienen exactamente la misma proporción de empleados remotos.", "Las proporciones son 40 % en la Norte y cerca de 41,7 % en la Sur: no son iguales.", false]]}]}, {"comp": "razonamiento_cuantitativo", "sim": "pro-1", "ind": "Ahorro con interés simple y compuesto", "tt": "", "texto": "Camilo tiene $ 2.000.000 para ahorrar durante cuatro años y compara dos opciones con la misma tasa del 10 % anual. En la opción 1 (interés simple), los intereses de cada año se calculan siempre sobre el capital inicial. En la opción 2 (interés compuesto), los intereses de cada año se suman al saldo y los del año siguiente se calculan sobre ese nuevo saldo. La tabla muestra el saldo al final de cada año.", "vis": "<table class=\"vt\"><caption>Tabla 1. Saldo al final de cada año (pesos)<\/caption><thead><tr><th>Año<\/th><th>Opción 1 (simple)<\/th><th>Opción 2 (compuesto)<\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td>$ 2.000.000<\/td><td>$ 2.000.000<\/td><\/tr><tr><td>1<\/td><td>$ 2.200.000<\/td><td>$ 2.200.000<\/td><\/tr><tr><td>2<\/td><td>$ 2.400.000<\/td><td>$ 2.420.000<\/td><\/tr><tr><td>3<\/td><td>$ 2.600.000<\/td><td>$ 2.662.000<\/td><\/tr><tr><td>4<\/td><td>$ 2.800.000<\/td><td>$ 2.928.200<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Fuente: datos ficticios.<\/div>", "items": [{"id": "RCP-113", "niv": 2, "cp": "rc_interpretacion", "e": "¿Al final de qué año la diferencia entre los saldos de las dos opciones supera por primera vez $ 100.000?", "f": "Lectura de la tabla y cálculo propio.", "vis": "", "o": [["A", "Al final del año 2.", "Al final del año 2 la diferencia es 2.420.000 − 2.400.000 = $ 20.000.", false], ["B", "En ninguno de los cuatro años la diferencia supera $ 100.000.", "Al final del año 4 la diferencia es de $ 128.200, mayor que $ 100.000.", false], ["C", "Al final del año 3.", "Al final del año 3 la diferencia es 2.662.000 − 2.600.000 = $ 62.000, todavía menor que $ 100.000.", false], ["D", "Al final del año 4.", "Al final del año 4 la diferencia es 2.928.200 − 2.800.000 = $ 128.200; es la primera vez que supera $ 100.000.", true]]}, {"id": "RCP-114", "niv": 2, "cp": "rc_interpretacion", "e": "¿Qué expresión permite calcular el saldo S de la opción 2 al final del año n?", "f": "Tabla del caso y definición de interés compuesto.", "vis": "", "o": [["A", "S = 2.000.000 × (1,1)ⁿ.", "Cada año el saldo se multiplica por 1,1 (100 % + 10 %); por ejemplo, para n = 2: 2.000.000 × 1,21 = 2.420.000, como en la tabla.", true], ["B", "S = 2.000.000 × (1 + 0,1n).", "Esta expresión corresponde al interés simple (opción 1): para n = 2 da 2.400.000 y no 2.420.000.", false], ["C", "S = 2.000.000 + 200.000 × (1,1)ⁿ.", "No coincide con la tabla: para n = 0 daría 2.200.000 y para n = 1 daría 2.220.000.", false], ["D", "S = 2.000.000 × 1,1 × n.", "Multiplica por n en lugar de elevar a n: para n = 2 daría 4.400.000.", false]]}, {"id": "RCP-115", "niv": 3, "cp": "rc_argumentacion", "e": "Laura, que piensa ahorrar con la opción 2, afirma: «Mi dinero se duplicará justo al final del año 10, porque 10 años × 10 % = 100 %». ¿Es válido su razonamiento?", "f": "Cálculo propio a partir de los datos del caso.", "vis": "", "o": [["A", "Sí, porque cada año gana el 10 % de $ 2.000.000, y 10 × $ 200.000 = $ 2.000.000.", "Calcular siempre el 10 % del capital inicial corresponde al interés simple, no a la opción 2.", false], ["B", "No, porque ese cálculo supone interés simple; con interés compuesto se duplica antes del año 10.", "Con interés compuesto el saldo se multiplica por 1,1 cada año: 1,1⁸ ≈ 2,14, así que el dinero ya se duplicó al final del año 8.", true], ["C", "No, porque con interés compuesto el saldo del año 10 sería 2.000.000 × 1,1 × 10 = 22.000.000.", "Multiplica por 10 en lugar de elevar 1,1 a la 10; el saldo sería 2.000.000 × 1,1¹⁰ ≈ 5.187.485.", false], ["D", "No, porque con interés compuesto cada año gana menos intereses y tarda unos 20 años en duplicarse.", "Es al contrario: los intereses crecen cada año porque se calculan sobre un saldo mayor.", false]]}]}, {"comp": "razonamiento_cuantitativo", "sim": "pro-1", "ind": "Ubicación de lugares en un plano cartesiano", "tt": "", "texto": "En el plano de un municipio, cada unidad de los ejes equivale a 10 m. La biblioteca está en el punto (1, 2), la escuela en el punto (7, 2) y el parque en el punto (7, 10).", "vis": "<div class=\"vfig\"><svg class=\"vg\" viewBox=\"0 0 560 320\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Gráfica 1. Plano del municipio (1 unidad = 10 m)\" font-family=\"Arial, sans-serif\" font-size=\"12\"><rect width=\"560\" height=\"320\" fill=\"#ffffff\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"13\" fill=\"#1d2433\">Gráfica 1. Plano del municipio (1 unidad = 10 m)<\/text><line x1=\"60\" y1=\"258.0\" x2=\"540\" y2=\"258.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"262.0\" text-anchor=\"end\" fill=\"#3a4356\">0<\/text><line x1=\"60\" y1=\"213.6\" x2=\"540\" y2=\"213.6\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"217.6\" text-anchor=\"end\" fill=\"#3a4356\">2<\/text><line x1=\"60\" y1=\"169.2\" x2=\"540\" y2=\"169.2\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"173.2\" text-anchor=\"end\" fill=\"#3a4356\">4<\/text><line x1=\"60\" y1=\"124.8\" x2=\"540\" y2=\"124.8\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"128.8\" text-anchor=\"end\" fill=\"#3a4356\">6<\/text><line x1=\"60\" y1=\"80.4\" x2=\"540\" y2=\"80.4\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"84.4\" text-anchor=\"end\" fill=\"#3a4356\">8<\/text><line x1=\"60\" y1=\"36.0\" x2=\"540\" y2=\"36.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"40.0\" text-anchor=\"end\" fill=\"#3a4356\">10<\/text><line x1=\"60\" y1=\"258\" x2=\"540\" y2=\"258\" stroke=\"#3a4356\"/><line x1=\"60\" y1=\"258\" x2=\"60\" y2=\"36\" stroke=\"#3a4356\"/><text transform=\"translate(14,147.0) rotate(-90)\" text-anchor=\"middle\" fill=\"#3a4356\">y (unidades)<\/text><text x=\"300.0\" y=\"312\" text-anchor=\"middle\" fill=\"#3a4356\">x (unidades)<\/text><text x=\"60.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">0<\/text><text x=\"180.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">2<\/text><text x=\"300.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">4<\/text><text x=\"420.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">6<\/text><text x=\"540.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">8<\/text><circle cx=\"120.0\" cy=\"213.6\" r=\"4\" fill=\"#1660a8\"/><circle cx=\"480.0\" cy=\"213.6\" r=\"4\" fill=\"#d9822b\"/><circle cx=\"480.0\" cy=\"36.0\" r=\"4\" fill=\"#2e8b57\"/><rect x=\"60\" y=\"286\" width=\"12\" height=\"12\" fill=\"#1660a8\"/><text x=\"76\" y=\"296\" fill=\"#1d2433\">Biblioteca<\/text><rect x=\"156\" y=\"286\" width=\"12\" height=\"12\" fill=\"#d9822b\"/><text x=\"172\" y=\"296\" fill=\"#1d2433\">Escuela<\/text><rect x=\"231\" y=\"286\" width=\"12\" height=\"12\" fill=\"#2e8b57\"/><text x=\"247\" y=\"296\" fill=\"#1d2433\">Parque<\/text><\/svg><\/div>", "items": [{"id": "RCP-116", "niv": 2, "cp": "rc_formulacion", "e": "¿Cuál es la distancia en línea recta entre la biblioteca y el parque?", "f": "Cálculo propio a partir de los datos del caso.", "vis": "", "o": [["A", "10 m.", "10 es la distancia en unidades del plano; falta multiplicar por 10 m que vale cada unidad.", false], ["B", "14 m.", "Suma los catetos (6 + 8 = 14 unidades) en lugar de aplicar el teorema de Pitágoras, y además no aplica la escala.", false], ["C", "100 m.", "Las diferencias de coordenadas son 6 y 8 unidades; por Pitágoras, √(6² + 8²) = √100 = 10 unidades, es decir, 10 × 10 = 100 m.", true], ["D", "140 m.", "Es el recorrido pasando por la escuela (60 m + 80 m), no la distancia en línea recta.", false]]}, {"id": "RCP-117", "niv": 1, "cp": "rc_interpretacion", "e": "Según el plano, ¿cuál de las siguientes afirmaciones es correcta?", "f": "Lectura del plano del caso.", "vis": "", "o": [["A", "La biblioteca y el parque tienen la misma coordenada y, igual a 2.", "La biblioteca tiene y = 2 y el parque y = 10.", false], ["B", "El parque está más cerca de la escuela que la biblioteca.", "El parque está a 8 unidades de la escuela y la biblioteca a 6.", false], ["C", "El parque es el lugar con la menor coordenada y.", "El parque tiene la mayor coordenada y (10); la biblioteca y la escuela tienen y = 2.", false], ["D", "La biblioteca está más cerca de la escuela que del parque.", "La biblioteca y la escuela están a 6 unidades, y el parque queda más lejos de la biblioteca: tiene que avanzar 6 unidades en x y además 8 en y.", true]]}, {"id": "RCP-118", "niv": 2, "cp": "rc_argumentacion", "e": "Un concejal afirma que el triángulo cuyos vértices son la biblioteca, la escuela y el parque es un triángulo rectángulo, porque el segmento que va de la biblioteca a la escuela es horizontal y el que va de la escuela al parque es vertical. ¿Es válido su argumento?", "f": "Propiedades de las rectas en el plano cartesiano.", "vis": "", "o": [["A", "Sí, porque los tres puntos tienen coordenadas enteras.", "Tener coordenadas enteras no determina si el triángulo tiene un ángulo recto.", false], ["B", "No, porque el ángulo recto tendría que estar en la biblioteca, el punto más a la izquierda.", "El ángulo recto está donde se cortan el segmento horizontal y el vertical, es decir, en la escuela.", false], ["C", "Sí, porque un segmento horizontal y uno vertical son perpendiculares.", "Las rectas horizontales y verticales forman ángulos rectos, así que el ángulo en la escuela mide 90°.", true], ["D", "No, porque en un triángulo rectángulo los tres lados deben tener la misma medida.", "Un triángulo con tres lados iguales es equilátero; un triángulo rectángulo solo necesita un ángulo de 90°.", false]]}]}, {"comp": "razonamiento_cuantitativo", "sim": "pro-1", "ind": "Distancias de los planetas al Sol", "tt": "", "texto": "Una revista de divulgación científica publicó la siguiente tabla con las distancias medias aproximadas de algunos planetas al Sol. En el mismo artículo se indica que la luz viaja a unos 3 × 10⁵ km por segundo.", "vis": "<table class=\"vt\"><caption>Tabla 1. Distancia media aproximada al Sol<\/caption><thead><tr><th>Planeta<\/th><th>Distancia media al Sol (km)<\/th><\/tr><\/thead><tbody><tr><td>Mercurio<\/td><td>5,8 × 10⁷<\/td><\/tr><tr><td>Venus<\/td><td>1,08 × 10⁸<\/td><\/tr><tr><td>Tierra<\/td><td>1,5 × 10⁸<\/td><\/tr><tr><td>Marte<\/td><td>2,28 × 10⁸<\/td><\/tr><tr><td>Júpiter<\/td><td>7,78 × 10⁸<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Valores redondeados a partir de datos de la NASA.<\/div>", "items": [{"id": "RCP-119", "niv": 2, "cp": "rc_formulacion", "e": "Con los datos del artículo, ¿cuánto tiempo tarda aproximadamente la luz del Sol en llegar a la Tierra?", "f": "Cálculo propio a partir de los datos del caso.", "vis": "", "o": [["A", "50 s.", "Error al restar los exponentes: (1,5 × 10⁸) ÷ (3 × 10⁵) = 0,5 × 10³, no 0,5 × 10².", false], ["B", "500 s.", "Tiempo = distancia ÷ velocidad = (1,5 × 10⁸) ÷ (3 × 10⁵) = 0,5 × 10³ = 500 s (algo más de 8 minutos).", true], ["C", "5.000 s.", "Error al operar las potencias: 0,5 × 10³ es 500, no 5.000.", false], ["D", "4,5 × 10¹³ s.", "Multiplica la distancia por la velocidad en lugar de dividirla.", false]]}, {"id": "RCP-120", "niv": 1, "cp": "rc_interpretacion", "e": "¿Cuál es la distancia media de Marte al Sol escrita sin notación científica?", "f": "Tabla del caso.", "vis": "", "o": [["A", "2.280.000 km.", "Corresponde a 2,28 × 10⁶: la coma se desplazó solo seis lugares.", false], ["B", "22.800.000 km.", "Corresponde a 2,28 × 10⁷: la coma se desplazó siete lugares en lugar de ocho.", false], ["C", "228.000.000 km.", "2,28 × 10⁸ = 2,28 × 100.000.000 = 228.000.000 km (228 millones de kilómetros).", true], ["D", "2.280.000.000 km.", "Corresponde a 2,28 × 10⁹: la coma se desplazó nueve lugares.", false]]}, {"id": "RCP-121", "niv": 2, "cp": "rc_argumentacion", "e": "Juliana afirma que Mercurio está más lejos del Sol que Venus, porque en la tabla 5,8 es mayor que 1,08. ¿Es válido su razonamiento?", "f": "Tabla del caso.", "vis": "", "o": [["A", "Sí, porque 5,8 ÷ 1,08 ≈ 5,4, así que Mercurio está unas cinco veces más lejos.", "Divide solo los coeficientes e ignora que las potencias de 10 son distintas.", false], ["B", "No, porque los dos están a la misma distancia, ya que 5,8 × 10⁷ = 1,08 × 10⁸.", "5,8 × 10⁷ = 0,58 × 10⁸, que no es igual a 1,08 × 10⁸.", false], ["C", "Sí, porque 10⁷ y 10⁸ son prácticamente iguales, así que basta comparar 5,8 con 1,08.", "10⁸ es diez veces 10⁷; la diferencia entre las potencias es determinante.", false], ["D", "No, porque 1,08 × 10⁸ = 10,8 × 10⁷, que es mayor que 5,8 × 10⁷.", "Para comparar números en notación científica primero se comparan las potencias de 10: 5,8 × 10⁷ = 0,58 × 10⁸, menor que 1,08 × 10⁸.", true]]}]}, {"comp": "razonamiento_cuantitativo", "sim": "pro-1", "ind": "Encuesta sobre medios de transporte", "tt": "", "texto": "La oficina de movilidad de un municipio encuestó a 400 habitantes sobre el medio de transporte que más usan para ir a su trabajo o lugar de estudio. Cada persona eligió una sola opción. Los resultados se muestran en la gráfica.", "vis": "<div class=\"vfig\"><svg class=\"vg\" viewBox=\"0 0 560 320\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Gráfica 1. Medio de transporte más usado (400 encuestados)\" font-family=\"Arial, sans-serif\" font-size=\"12\"><rect width=\"560\" height=\"320\" fill=\"#ffffff\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"13\" fill=\"#1d2433\">Gráfica 1. Medio de transporte más usado (400 encuestados)<\/text><path d=\"M170,175 L170.0,60.0 A115,115 0 0,1 205.5,284.4 Z\" fill=\"#1660a8\" stroke=\"#fff\" stroke-width=\"1.5\"/><path d=\"M170,175 L205.5,284.4 A115,115 0 0,1 77.0,242.6 Z\" fill=\"#d9822b\" stroke=\"#fff\" stroke-width=\"1.5\"/><path d=\"M170,175 L77.0,242.6 A115,115 0 0,1 60.6,139.5 Z\" fill=\"#2e8b57\" stroke=\"#fff\" stroke-width=\"1.5\"/><path d=\"M170,175 L60.6,139.5 A115,115 0 0,1 114.6,74.2 Z\" fill=\"#8e44ad\" stroke=\"#fff\" stroke-width=\"1.5\"/><path d=\"M170,175 L114.6,74.2 A115,115 0 0,1 170.0,60.0 Z\" fill=\"#c0392b\" stroke=\"#fff\" stroke-width=\"1.5\"/><rect x=\"320\" y=\"59\" width=\"14\" height=\"14\" fill=\"#1660a8\"/><text x=\"340\" y=\"70\" fill=\"#1d2433\">Bus: 45 %<\/text><rect x=\"320\" y=\"83\" width=\"14\" height=\"14\" fill=\"#d9822b\"/><text x=\"340\" y=\"94\" fill=\"#1d2433\">Moto: 20 %<\/text><rect x=\"320\" y=\"107\" width=\"14\" height=\"14\" fill=\"#2e8b57\"/><text x=\"340\" y=\"118\" fill=\"#1d2433\">Bicicleta: 15 %<\/text><rect x=\"320\" y=\"131\" width=\"14\" height=\"14\" fill=\"#8e44ad\"/><text x=\"340\" y=\"142\" fill=\"#1d2433\">Carro: 12 %<\/text><rect x=\"320\" y=\"155\" width=\"14\" height=\"14\" fill=\"#c0392b\"/><text x=\"340\" y=\"166\" fill=\"#1d2433\">A pie: 8 %<\/text><\/svg><\/div>", "items": [{"id": "RCP-122", "niv": 2, "cp": "rc_interpretacion", "e": "Si se construyera esta gráfica circular a mano, ¿qué ángulo central correspondería al sector «Carro»?", "f": "Cálculo propio a partir de los datos del caso.", "vis": "", "o": [["A", "4,32°.", "Multiplica 0,12 por 36 en lugar de por 360°.", false], ["B", "12°.", "Usa el porcentaje directamente como si fuera la medida del ángulo.", false], ["C", "43,2°.", "El círculo completo mide 360° y al carro le corresponde el 12 %: 0,12 × 360° = 43,2°.", true], ["D", "48°.", "48 es el número de personas que usan carro (12 % de 400), no la medida del ángulo.", false]]}, {"id": "RCP-123", "niv": 3, "cp": "rc_formulacion", "e": "Si 30 de las personas encuestadas que usan carro empezaran a usar bicicleta, ¿qué porcentaje de los encuestados usaría bicicleta?", "f": "Cálculo propio a partir de los datos del caso.", "vis": "", "o": [["A", "7,5 %", "30 ÷ 400 = 7,5 % solo corresponde a las personas que cambiarían; faltan las que ya usaban bicicleta.", false], ["B", "22,5 %", "Hoy usan bicicleta 15 % de 400 = 60 personas; con 30 más serían 90, y 90 ÷ 400 = 22,5 %.", true], ["C", "27 %", "Suma los porcentajes de bicicleta y carro (15 % + 12 %), pero no todos los que usan carro cambiarían.", false], ["D", "45 %", "Suma 30 personas como si fueran 30 puntos porcentuales (15 % + 30 %).", false]]}, {"id": "RCP-124", "niv": 2, "cp": "rc_argumentacion", "e": "Un periodista local escribe: «La mayoría de los encuestados usa el bus para movilizarse». ¿Es correcta esta afirmación?", "f": "Lectura de la gráfica.", "vis": "", "o": [["A", "No, porque el 45 % no supera la mitad de los encuestados.", "La mayoría exige más del 50 %; el bus tiene 45 % (180 de 400 personas).", true], ["B", "No, porque solo 45 personas usan el bus.", "El 45 % de 400 son 180 personas, no 45; además, el argumento correcto es que 45 % no supera el 50 %.", false], ["C", "Sí, porque el bus y la moto suman el 65 % de los encuestados.", "Sumar la moto no tiene sentido: la afirmación habla solo del bus.", false], ["D", "Sí, porque el bus tiene el sector más grande de la gráfica.", "Ser la opción más frecuente no equivale a ser elegida por la mayoría (más de la mitad).", false]]}]}, {"comp": "razonamiento_cuantitativo", "sim": "pro-1", "ind": "Tarifa de un servicio de plomería", "tt": "", "texto": "Un plomero cobra $ 40.000 por la visita, sin importar la duración del trabajo, más $ 25.000 por cada hora de trabajo. La gráfica muestra el costo total de un servicio según las horas trabajadas.", "vis": "<div class=\"vfig\"><svg class=\"vg\" viewBox=\"0 0 560 320\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Gráfica 1. Costo total del servicio según las horas\" font-family=\"Arial, sans-serif\" font-size=\"12\"><rect width=\"560\" height=\"320\" fill=\"#ffffff\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"13\" fill=\"#1d2433\">Gráfica 1. Costo total del servicio según las horas<\/text><line x1=\"60\" y1=\"258.0\" x2=\"540\" y2=\"258.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"262.0\" text-anchor=\"end\" fill=\"#3a4356\">0<\/text><line x1=\"60\" y1=\"202.5\" x2=\"540\" y2=\"202.5\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"206.5\" text-anchor=\"end\" fill=\"#3a4356\">50.000<\/text><line x1=\"60\" y1=\"147.0\" x2=\"540\" y2=\"147.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"151.0\" text-anchor=\"end\" fill=\"#3a4356\">100.000<\/text><line x1=\"60\" y1=\"91.5\" x2=\"540\" y2=\"91.5\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"95.5\" text-anchor=\"end\" fill=\"#3a4356\">150.000<\/text><line x1=\"60\" y1=\"36.0\" x2=\"540\" y2=\"36.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"40.0\" text-anchor=\"end\" fill=\"#3a4356\">200.000<\/text><line x1=\"60\" y1=\"258\" x2=\"540\" y2=\"258\" stroke=\"#3a4356\"/><line x1=\"60\" y1=\"258\" x2=\"60\" y2=\"36\" stroke=\"#3a4356\"/><text transform=\"translate(14,147.0) rotate(-90)\" text-anchor=\"middle\" fill=\"#3a4356\">Costo total (pesos)<\/text><text x=\"300.0\" y=\"312\" text-anchor=\"middle\" fill=\"#3a4356\">Horas de trabajo<\/text><text x=\"100.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">1<\/text><text x=\"180.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">2<\/text><text x=\"260.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">3<\/text><text x=\"340.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">4<\/text><text x=\"420.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">5<\/text><text x=\"500.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">6<\/text><polyline fill=\"none\" stroke=\"#1660a8\" stroke-width=\"2.5\" points=\"100.0,185.8 180.0,158.1 260.0,130.3 340.0,102.6 420.0,74.8 500.0,47.1\"/><circle cx=\"100.0\" cy=\"185.8\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"100.0\" y=\"177.8\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">65.000<\/text><circle cx=\"180.0\" cy=\"158.1\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"180.0\" y=\"150.1\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">90.000<\/text><circle cx=\"260.0\" cy=\"130.3\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"260.0\" y=\"122.3\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">115.000<\/text><circle cx=\"340.0\" cy=\"102.6\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"340.0\" y=\"94.6\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">140.000<\/text><circle cx=\"420.0\" cy=\"74.8\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"420.0\" y=\"66.8\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">165.000<\/text><circle cx=\"500.0\" cy=\"47.1\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"500.0\" y=\"39.1\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">190.000<\/text><\/svg><\/div>", "items": [{"id": "RCP-125", "niv": 2, "cp": "rc_interpretacion", "e": "¿Qué expresión representa el costo total C, en pesos, de un servicio de h horas?", "f": "Gráfica y datos del caso.", "vis": "", "o": [["A", "C = 65.000h.", "Toma el costo de un servicio de una hora como tarifa por hora: para h = 2 daría 130.000, no 90.000.", false], ["B", "C = 25.000 + 40.000h.", "Intercambia el valor fijo y la tarifa por hora: para h = 1 daría 65.000, pero para h = 2 daría 105.000.", false], ["C", "C = 40.000 + 65.000h.", "Suma la visita dos veces: para h = 1 daría 105.000 y no 65.000.", false], ["D", "C = 40.000 + 25.000h.", "El valor de la visita es fijo (40.000) y a él se suman 25.000 por cada hora; para h = 2 da 90.000, como en la gráfica.", true]]}, {"id": "RCP-126", "niv": 3, "cp": "rc_formulacion", "e": "Un cliente pagó $ 202.500 por un servicio. ¿Cuántas horas trabajó el plomero?", "f": "Cálculo propio a partir de los datos del caso.", "vis": "", "o": [["A", "5,5 horas.", "Resta el costo de un servicio de una hora (65.000) en lugar de restar solo la visita: (202.500 − 65.000) ÷ 25.000 = 5,5.", false], ["B", "6,5 horas.", "Sin la visita quedan 202.500 − 40.000 = 162.500 pesos, y 162.500 ÷ 25.000 = 6,5 horas.", true], ["C", "8,1 horas.", "Divide el total entre 25.000 sin descontar el valor de la visita.", false], ["D", "9,7 horas.", "Suma el valor de la visita en lugar de restarlo: (202.500 + 40.000) ÷ 25.000 = 9,7.", false]]}, {"id": "RCP-127", "niv": 3, "cp": "rc_argumentacion", "e": "Un cliente afirma: «Si el trabajo dura el doble de horas, el costo total también será el doble». ¿Es correcta su afirmación?", "f": "Cálculo propio a partir de los datos del caso.", "vis": "", "o": [["A", "No, porque la visita se cobra una sola vez: 6 horas no cuestan el doble que 3 horas.", "El costo tiene una parte fija: 3 horas cuestan $ 115.000 y 6 horas $ 190.000, no $ 230.000.", true], ["B", "No, porque al duplicar las horas el costo se triplica: 1 hora cuesta $ 65.000 y 2 horas $ 195.000.", "Según la gráfica, 2 horas cuestan $ 90.000, no $ 195.000.", false], ["C", "Sí, porque cada hora cuesta $ 25.000, y 2 × $ 25.000 = $ 50.000 por cada 2 horas.", "Que la tarifa por hora sea constante no basta: el cargo fijo impide que el costo sea proporcional a las horas.", false], ["D", "Sí, porque 3 horas cuestan $ 115.000 y 6 horas cuestan 2 × $ 115.000 = $ 230.000.", "En la gráfica, 6 horas cuestan $ 190.000: la visita de $ 40.000 no se cobra dos veces.", false]]}, {"id": "RCP-135", "niv": 1, "cp": "rc_interpretacion", "e": "Según la gráfica, ¿cuál es el mayor número de horas completas de trabajo que se pueden pagar con $ 150.000?", "f": "Lectura de la gráfica.", "vis": "", "o": [["A", "3 horas.", "Tres horas cuestan $ 115.000, pero con $ 150.000 alcanza también para una cuarta hora.", false], ["B", "4 horas.", "Cuatro horas cuestan $ 140.000 y cinco horas $ 165.000; con $ 150.000 alcanza como máximo para 4 horas.", true], ["C", "5 horas.", "Cinco horas cuestan $ 165.000, más de $ 150.000.", false], ["D", "6 horas.", "Resulta de 150.000 ÷ 25.000, sin descontar los $ 40.000 de la visita.", false]]}]}, {"comp": "razonamiento_cuantitativo", "sim": "pro-1", "ind": "Actividades extracurriculares de un grado", "tt": "", "texto": "En un colegio se preguntó a los 60 estudiantes de grado once si practican algún deporte o si toman clases de música por fuera del horario escolar. Los resultados fueron: 35 practican deporte, 28 toman clases de música y 10 hacen ambas actividades.", "vis": "", "items": [{"id": "RCP-128", "niv": 2, "cp": "rc_formulacion", "e": "¿Cuántos estudiantes no practican deporte ni toman clases de música?", "f": "Cálculo propio a partir de los datos del caso.", "vis": "", "o": [["A", "7 estudiantes.", "Hacen al menos una actividad 35 + 28 − 10 = 53 estudiantes (los 10 de ambas se contaban dos veces); no hacen ninguna 60 − 53 = 7.", true], ["B", "10 estudiantes.", "10 son los que hacen ambas actividades, no los que no hacen ninguna.", false], ["C", "17 estudiantes.", "Resta solo a quienes hacen únicamente deporte (25) o únicamente música (18), y olvida restar a los 10 que hacen ambas.", false], ["D", "25 estudiantes.", "Resta solo a quienes practican deporte (60 − 35) y olvida a los que toman solo música.", false]]}, {"id": "RCP-129", "niv": 1, "cp": "rc_interpretacion", "e": "¿Cuántos estudiantes toman clases de música, pero no practican deporte?", "f": "Datos del caso.", "vis": "", "o": [["A", "10 estudiantes.", "10 es el número de estudiantes que hacen ambas actividades.", false], ["B", "18 estudiantes.", "De los 28 que toman música, 10 también practican deporte; solo música: 28 − 10 = 18.", true], ["C", "25 estudiantes.", "25 son los que practican deporte, pero no música (35 − 10).", false], ["D", "28 estudiantes.", "28 son todos los que toman música, incluidos los 10 que también practican deporte.", false]]}]}, {"comp": "razonamiento_cuantitativo", "sim": "pro-1", "ind": "Conclusiones a partir de encuestas", "tt": "", "texto": "En una clase de estadística se analizaron dos situaciones.\n\nSituación 1. Para estimar qué porcentaje de los habitantes de una ciudad aprueba la ciclovía dominical, un equipo encuestó a 500 personas que estaban usando la ciclovía un domingo. El 92 % de ellas dijo aprobarla.\n\nSituación 2. Una encuesta de intención de voto para la alcaldía de un municipio, con un margen de error de ± 3 puntos porcentuales, arrojó los resultados de la tabla.", "vis": "<table class=\"vt\"><caption>Tabla 1. Encuesta de intención de voto (situación 2)<\/caption><thead><tr><th>Opción<\/th><th>Intención de voto<\/th><\/tr><\/thead><tbody><tr><td>Candidato A<\/td><td>48 %<\/td><\/tr><tr><td>Candidato B<\/td><td>45 %<\/td><\/tr><tr><td>Voto en blanco o indecisos<\/td><td>7 %<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Margen de error: ± 3 puntos porcentuales. Datos ficticios.<\/div>", "items": [{"id": "RCP-131", "niv": 3, "cp": "rc_argumentacion", "e": "Con base en la situación 1, un concejal concluye: «El 92 % de los habitantes de la ciudad aprueba la ciclovía». ¿Es válida esta conclusión?", "f": "Nociones de población y muestra.", "vis": "", "o": [["A", "No, porque los resultados de una muestra no permiten sacar conclusiones sobre una población.", "Una muestra elegida al azar sí permite estimar características de la población; el problema aquí es el sesgo de selección.", false], ["B", "Sí, porque 500 personas es una muestra lo bastante grande para representar a cualquier ciudad del país.", "El tamaño de la muestra no corrige el sesgo en la forma de elegirla.", false], ["C", "Sí, porque el 92 % es un porcentaje muy alto.", "Que el porcentaje sea alto no hace que la muestra represente a toda la ciudad.", false], ["D", "No, porque la muestra solo incluye a usuarios de la ciclovía y no representa a toda la ciudad.", "La muestra está sesgada: se eligió solo a usuarios de la ciclovía, así que el resultado no puede generalizarse a toda la ciudad.", true]]}, {"id": "RCP-132", "niv": 3, "cp": "rc_argumentacion", "e": "Con base en la situación 2, un periodista titula: «El candidato A ganará con seguridad». ¿Está justificado este titular?", "f": "Datos de la tabla y noción de error de estimación.", "vis": "", "o": [["A", "No, porque con ese margen de error B podría tener más intención de voto que A.", "El apoyo de A podría estar entre 45 % y 51 % y el de B entre 42 % y 48 %: los intervalos se superponen (por ejemplo, 46 % frente a 47 %).", true], ["B", "Sí, porque A supera a B por 3 puntos, una diferencia igual al margen de error.", "Cada resultado puede variar 3 puntos hacia arriba o hacia abajo; una ventaja de 3 puntos no basta.", false], ["C", "Sí, porque aun restando 3 puntos, A tendría 45 %, más que el 42 % mínimo de B.", "Compara el mínimo de A con el mínimo de B; habría que compararlo con el máximo de B (48 %).", false], ["D", "No, porque A podría bajar a 45 % y B subir a 48 %, así que B ganaría con seguridad.", "Ese es solo uno de los escenarios posibles: tampoco puede asegurarse que gane B.", false]]}]}, {"comp": "razonamiento_cuantitativo", "sim": "pro-1", "ind": "Capacidad de un tanque cilíndrico", "tt": "", "texto": "En una finca se instaló un tanque cilíndrico para almacenar agua lluvia. El tanque mide 1 m de diámetro y 1,2 m de altura, como muestra la figura. Recuerde que 1 m³ equivale a 1.000 litros y use π ≈ 3,14.", "vis": "<div class=\"vfig\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 300 260\" font-family=\"Arial\" font-size=\"14\"><rect width=\"300\" height=\"260\" fill=\"#ffffff\"/><ellipse cx=\"130\" cy=\"50\" rx=\"80\" ry=\"20\" fill=\"none\" stroke=\"#1d2433\" stroke-width=\"2\"/><line x1=\"50\" y1=\"50\" x2=\"50\" y2=\"210\" stroke=\"#1d2433\" stroke-width=\"2\"/><line x1=\"210\" y1=\"50\" x2=\"210\" y2=\"210\" stroke=\"#1d2433\" stroke-width=\"2\"/><path d=\"M50,210 A80,20 0 0,0 210,210\" fill=\"none\" stroke=\"#1d2433\" stroke-width=\"2\"/><line x1=\"50\" y1=\"50\" x2=\"210\" y2=\"50\" stroke=\"#1d2433\" stroke-dasharray=\"4 3\"/><text x=\"130\" y=\"44\" text-anchor=\"middle\" fill=\"#1d2433\">1 m<\/text><text x=\"220\" y=\"135\" fill=\"#1d2433\">1,2 m<\/text><\/svg><\/div>", "items": [{"id": "RCP-133", "niv": 3, "cp": "rc_formulacion", "e": "¿Cuál es la capacidad aproximada del tanque, en litros?", "f": "Cálculo propio a partir de los datos del caso.", "vis": "", "o": [["A", "471 L.", "Es la mitad del volumen: divide entre 2 después de usar correctamente el radio.", false], ["B", "942 L.", "El radio es 0,5 m: V = π × r² × h = 3,14 × 0,25 × 1,2 = 0,942 m³ = 942 L.", true], ["C", "1.884 L.", "Olvida elevar el radio al cuadrado: 3,14 × 0,5 × 1,2 = 1,884 m³.", false], ["D", "3.768 L.", "Usa el diámetro (1 m) como si fuera el radio: 3,14 × 1² × 1,2 = 3,768 m³.", false]]}, {"id": "RCP-134", "niv": 3, "cp": "rc_argumentacion", "e": "El encargado de la finca afirma: «Un tanque de la misma altura, pero con el doble de diámetro, tendrá exactamente el doble de capacidad». ¿Es correcta su afirmación?", "f": "Cálculo propio a partir de los datos del caso.", "vis": "", "o": [["A", "No, porque al duplicar el diámetro la capacidad se multiplica por 8, ya que 2³ = 8.", "Se multiplicaría por 8 si se duplicaran las tres medidas; aquí la altura no cambia.", false], ["B", "Sí, porque con 2 m de diámetro el volumen es 3,14 × 2 × 1,2 = 7,536 m³, el doble que con 1 m.", "Multiplica por el diámetro sin elevar el radio al cuadrado; la fórmula usa π × r² × h.", false], ["C", "No, porque la capacidad depende del radio al cuadrado: se multiplicaría por 4.", "En V = π × r² × h el radio está al cuadrado: si el radio se duplica, r² se multiplica por 4 y, con la misma altura, el volumen también.", true], ["D", "Sí, porque el radio pasa de 0,5 m a 1 m, es decir, se duplica, y la capacidad con él.", "El radio sí se duplica, pero como está al cuadrado en la fórmula, el volumen se multiplica por 4.", false]]}]}, {"comp": "razonamiento_cuantitativo", "sim": "pro-1", "ind": "Combinaciones de un almuerzo", "tt": "", "texto": "Para una salida pedagógica, el colegio contrató un servicio de almuerzos. Cada estudiante arma su almuerzo eligiendo una sopa, un plato fuerte y una bebida de la carta que muestra la tabla.", "vis": "<table class=\"vt\"><caption>Tabla 1. Carta del almuerzo<\/caption><thead><tr><th>Sopas<\/th><th>Platos fuertes<\/th><th>Bebidas<\/th><\/tr><\/thead><tbody><tr><td>Ajiaco<\/td><td>Pollo asado<\/td><td>Jugo de mora<\/td><\/tr><tr><td>Sopa de verduras<\/td><td>Carne en bistec<\/td><td>Limonada<\/td><\/tr><tr><td>Crema de ahuyama<\/td><td>Pescado frito<\/td><td><\/td><\/tr><tr><td><\/td><td>Lentejas con arroz<\/td><td><\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Cada estudiante elige una opción de cada columna. Datos ficticios.<\/div>", "items": [{"id": "RCP-130", "niv": 1, "cp": "rc_formulacion", "e": "Según la carta, ¿cuántos almuerzos diferentes se pueden armar?", "f": "Cálculo propio a partir de los datos del caso.", "vis": "", "o": [["A", "8 almuerzos.", "Multiplica solo platos fuertes y bebidas (4 × 2) y olvida las sopas.", false], ["B", "9 almuerzos.", "Suma las opciones (3 + 4 + 2); como se elige una de cada grupo, el principio de multiplicación exige multiplicarlas.", false], ["C", "12 almuerzos.", "Multiplica sopas y platos fuertes (3 × 4) y olvida las bebidas.", false], ["D", "24 almuerzos.", "Por el principio de multiplicación: 3 × 4 × 2 = 24 combinaciones.", true]]}]}, {"comp": "competencias_ciudadanas", "sim": "pro-1", "ind": "Forma del Estado y autonomía territorial", "tt": "", "texto": "En un foro universitario, un estudiante afirma: «Como Colombia es una república unitaria, los municipios no tienen ninguna autonomía: solo deben cumplir las órdenes del Gobierno nacional».", "vis": "", "items": [{"id": "CCP-101", "niv": 1, "cp": "cc_conocimientos", "e": "La afirmación del estudiante es incorrecta porque, según el artículo 1 de la Constitución, Colombia está organizada en forma de república", "f": "Constitución Política de Colombia (texto vigente, secretariasenado.gov.co/senado/basedoc/constitucion_politica_1991.html), artículos 1, 260 y 314", "vis": "", "o": [["A", "unitaria, descentralizada y con autonomía de sus entidades territoriales.", "El artículo 1 define a Colombia como «República unitaria, descentralizada, con autonomía de sus entidades territoriales». Ser unitaria no excluye esa autonomía, así que los municipios no se limitan a cumplir órdenes del Gobierno nacional.", true], ["B", "unitaria, en la que los concejos municipales eligen a los alcaldes entre sus miembros.", "Los alcaldes se eligen popularmente (arts. 260 y 314), no los eligen los concejos.", false], ["C", "unitaria, en la que los gobernadores nombran a los alcaldes y supervisan su gestión.", "Los alcaldes no son nombrados por los gobernadores: se eligen popularmente (arts. 260 y 314).", false], ["D", "unitaria, en la que las entidades territoriales solo ejercen las funciones que les delegue el Gobierno nacional.", "El artículo 1 reconoce autonomía a las entidades territoriales; no se limitan a ejercer funciones delegadas. Esta opción, además, le daría la razón al estudiante.", false]]}]}, {"comp": "competencias_ciudadanas", "sim": "pro-1", "ind": "Lenguas de los grupos étnicos", "tt": "", "texto": "Una comunidad indígena del Vaupés solicita que en la escuela de su resguardo las clases se dicten en su lengua y en castellano. Un funcionario responde que, como el castellano es el idioma oficial de Colombia, la enseñanza debe impartirse solo en castellano.", "vis": "", "items": [{"id": "CCP-102", "niv": 2, "cp": "cc_conocimientos", "e": "De acuerdo con la Constitución, la respuesta del funcionario es", "f": "Constitución Política de Colombia (texto vigente, secretariasenado.gov.co/senado/basedoc/constitucion_politica_1991.html), artículos 7 y 10", "vis": "", "o": [["A", "correcta, porque el castellano es el idioma oficial de Colombia y la enseñanza pública debe impartirse en el idioma oficial.", "Es cierto que el artículo 10 declara el castellano idioma oficial, pero el mismo artículo agrega que las lenguas de los grupos étnicos también son oficiales en sus territorios y que allí la enseñanza será bilingüe.", false], ["B", "incorrecta, porque en los resguardos la lengua indígena reemplaza al castellano como idioma de la enseñanza.", "La Constitución no dispone que la lengua indígena reemplace al castellano; dice que la enseñanza será bilingüe.", false], ["C", "correcta, porque la protección de la diversidad étnica se limita a las costumbres y no incluye la lengua.", "El artículo 7 protege la diversidad étnica y cultural, y el artículo 10 incluye expresamente la lengua dentro de esa protección.", false], ["D", "incorrecta, porque las lenguas de los grupos étnicos también son oficiales en sus territorios y allí la enseñanza será bilingüe.", "El artículo 10 establece que el castellano es el idioma oficial, pero que «las lenguas y dialectos de los grupos étnicos son también oficiales en sus territorios» y que la enseñanza en esas comunidades «será bilingüe». Esto desarrolla el artículo 7 (diversidad étnica y cultural).", true]]}]}, {"comp": "competencias_ciudadanas", "sim": "pro-1", "ind": "Plazo de la acción de tutela", "tt": "", "texto": "Un paciente presenta una acción de tutela porque considera que se está vulnerando su derecho fundamental a la salud. Quiere saber cuánto tiempo puede tardar el juez en decidir.", "vis": "", "items": [{"id": "CCP-103", "niv": 1, "cp": "cc_conocimientos", "e": "Según la Constitución, ¿cuál es el plazo máximo que puede transcurrir entre la solicitud de tutela y su resolución?", "f": "Constitución Política de Colombia (texto vigente, secretariasenado.gov.co/senado/basedoc/constitucion_politica_1991.html), artículo 86", "vis": "", "o": [["A", "Quince días hábiles.", "Quince días hábiles es el término general que la ley fija para responder un derecho de petición, no el plazo constitucional de la tutela.", false], ["B", "Treinta y seis horas.", "Treinta y seis horas es el término para resolver el habeas corpus (art. 30), no la tutela.", false], ["C", "Diez días.", "El artículo 86 dispone: «En ningún caso podrán transcurrir más de diez días entre la solicitud de tutela y su resolución».", true], ["D", "Un mes.", "La Constitución fija un plazo mucho más corto para la tutela, porque es un procedimiento preferente y sumario (art. 86).", false]]}]}, {"comp": "competencias_ciudadanas", "sim": "pro-1", "ind": "Igualdad real y efectiva", "tt": "", "texto": "Una universidad pública reserva un número de cupos para aspirantes de comunidades que históricamente han tenido menor acceso a la educación superior. Un aspirante que no pertenece a esas comunidades alega que la medida viola el derecho a la igualdad.", "vis": "", "items": [{"id": "CCP-104", "niv": 2, "cp": "cc_conocimientos", "e": "¿Qué disposición del artículo 13 de la Constitución permite considerar que una medida como esta puede ser compatible con el derecho a la igualdad?", "f": "Constitución Política de Colombia (texto vigente, secretariasenado.gov.co/senado/basedoc/constitucion_politica_1991.html), artículo 13", "vis": "", "o": [["A", "La que obliga al Estado a buscar que la igualdad se cumpla en la práctica y a favorecer a grupos discriminados o marginados.", "El inciso segundo del artículo 13 dice: «El Estado promoverá las condiciones para que la igualdad sea real y efectiva y adoptará medidas en favor de grupos discriminados o marginados». Por eso un trato diferenciado a favor de esos grupos puede ser constitucional.", true], ["B", "La que prohíbe la discriminación por razones de lengua, religión u opinión política o filosófica.", "Esa parte del artículo 13 prohíbe discriminar; por sí sola no justifica tratos diferenciados a favor de ciertos grupos, que es lo que fundamenta el inciso segundo.", false], ["C", "La que establece la autonomía de las universidades para fijar libremente sus criterios sin límites constitucionales.", "La autonomía universitaria no está en el artículo 13 y, en todo caso, se ejerce dentro de la Constitución; no es la disposición que fundamenta la igualdad material.", false], ["D", "La que establece que todas las personas recibirán la misma protección y trato de las autoridades, lo que prohíbe cualquier diferencia entre aspirantes.", "Esta lectura ignora el segundo inciso del artículo 13, que admite medidas a favor de grupos discriminados o marginados; además, llevaría a concluir que la medida es inconstitucional, no compatible.", false]]}]}, {"comp": "competencias_ciudadanas", "sim": "pro-1", "ind": "Derechos sociales, económicos y culturales", "tt": "", "texto": "En una clase se pide clasificar algunos derechos según el capítulo del título II de la Constitución en el que están consagrados.", "vis": "", "items": [{"id": "CCP-105", "niv": 1, "cp": "cc_conocimientos", "e": "¿Cuál de los siguientes derechos está consagrado en el capítulo «De los derechos sociales, económicos y culturales»?", "f": "Constitución Política de Colombia (texto vigente, secretariasenado.gov.co/senado/basedoc/constitucion_politica_1991.html), título II, capítulos 1 y 2; artículos 20, 23, 30 y 67", "vis": "", "o": [["A", "El habeas corpus.", "El habeas corpus (art. 30) está en el capítulo 1 del título II, «De los derechos fundamentales».", false], ["B", "El derecho de petición.", "El derecho de petición (art. 23) está en el capítulo 1 del título II, «De los derechos fundamentales».", false], ["C", "La libertad de expresión.", "La libertad de expresión (art. 20) está en el capítulo 1 del título II, «De los derechos fundamentales».", false], ["D", "El derecho a la educación.", "El artículo 67, que consagra la educación como derecho de la persona y servicio público con función social, hace parte del capítulo 2 del título II, «De los derechos sociales, económicos y culturales».", true]]}]}, {"comp": "competencias_ciudadanas", "sim": "pro-1", "ind": "Protección de derechos colectivos", "tt": "", "texto": "Los habitantes de un municipio denuncian que una empresa vierte residuos sin tratar en el río que abastece el acueducto. Quieren que un juez ordene detener los vertimientos para proteger el ambiente y la salubridad pública de toda la comunidad.", "vis": "", "items": [{"id": "CCP-106", "niv": 2, "cp": "cc_conocimientos", "e": "¿Cuál es el mecanismo que la Constitución prevé específicamente para proteger derechos e intereses colectivos como el ambiente y la salubridad pública?", "f": "Constitución Política de Colombia (texto vigente, secretariasenado.gov.co/senado/basedoc/constitucion_politica_1991.html), artículos 79 y 88; Ley 472 de 1998, artículos 2 y 3", "vis": "", "o": [["A", "El habeas corpus.", "El habeas corpus (art. 30) protege la libertad de quien está privado de ella ilegalmente.", false], ["B", "La acción de cumplimiento.", "La acción de cumplimiento (art. 87) busca que una autoridad renuente cumpla una ley o un acto administrativo; no es el mecanismo específico para la protección de derechos colectivos.", false], ["C", "La acción popular.", "El artículo 88 dispone que la ley regulará las acciones populares «para la protección de los derechos e intereses colectivos, relacionados con el patrimonio, el espacio, la seguridad y la salubridad públicos, la moral administrativa, el ambiente…». La Ley 472 de 1998 (art. 2) las define como los medios procesales para proteger esos derechos.", true], ["D", "La acción de grupo.", "La acción de grupo (art. 88, inciso 2, y Ley 472 de 1998, art. 3) sirve para obtener la indemnización de perjuicios individuales causados a un número plural de personas, no para hacer cesar la amenaza a un derecho colectivo.", false]]}]}, {"comp": "competencias_ciudadanas", "sim": "pro-1", "ind": "Deberes de la persona y del ciudadano", "tt": "", "texto": "El artículo 95 de la Constitución señala que el ejercicio de los derechos y libertades implica responsabilidades, y enumera los deberes de la persona y del ciudadano.", "vis": "", "items": [{"id": "CCP-107", "niv": 1, "cp": "cc_conocimientos", "e": "¿Cuál de las siguientes conductas corresponde a uno de esos deberes?", "f": "Constitución Política de Colombia (texto vigente, secretariasenado.gov.co/senado/basedoc/constitucion_politica_1991.html), artículo 95", "vis": "", "o": [["A", "Contribuir a financiar los gastos e inversiones del Estado mediante el pago de los tributos.", "Corresponde al numeral 9 del artículo 95: «Contribuir al financiamiento de los gastos e inversiones del Estado dentro de conceptos de justicia y equidad».", true], ["B", "Prestar servicio voluntario en una entidad pública del municipio cuando la autoridad local lo solicite por escrito.", "No figura entre los deberes del artículo 95; la Constitución no obliga a prestar servicios en entidades públicas a solicitud de las autoridades.", false], ["C", "Denunciar ante las autoridades a los vecinos que no paguen sus impuestos.", "El artículo 95 impone contribuir al financiamiento del Estado, pero no el deber de denunciar a quienes no paguen impuestos.", false], ["D", "Pertenecer a la junta de acción comunal del barrio donde se reside.", "La Constitución no impone el deber de pertenecer a una junta de acción comunal; la participación comunitaria es un deber general que no exige esa afiliación.", false]]}]}, {"comp": "competencias_ciudadanas", "sim": "pro-1", "ind": "Separación de poderes y control político", "tt": "", "texto": "La Cámara de Representantes cita a un ministro para que explique por qué se retrasó la ejecución de un programa de vivienda. Un ciudadano opina: «Con esa citación, el Congreso invade las funciones de la rama ejecutiva y viola la separación de poderes».", "vis": "", "items": [{"id": "CCP-108", "niv": 3, "cp": "cc_conocimientos", "e": "¿Es acertada la opinión del ciudadano?", "f": "Constitución Política de Colombia (texto vigente, secretariasenado.gov.co/senado/basedoc/constitucion_politica_1991.html), artículos 113, 114 y 208", "vis": "", "o": [["A", "No, porque el Congreso es el superior jerárquico de los ministros y, por eso, puede darles órdenes directas sobre la forma de ejecutar los programas.", "El Congreso no es superior jerárquico de los ministros; estos trabajan bajo la dirección del Presidente (art. 208). El control político no equivale a dar órdenes administrativas.", false], ["B", "No, porque al Congreso le corresponde ejercer control político sobre el gobierno, y los órganos del Estado colaboran armónicamente.", "El artículo 114 asigna al Congreso la función de «ejercer control político sobre el gobierno y la administración», y el artículo 113 señala que los órganos del Estado «tienen funciones separadas pero colaboran armónicamente». Citar a un ministro es una forma de control político, no de invasión de funciones.", true], ["C", "Sí, porque las funciones del Congreso se limitan a hacer las leyes y reformar la Constitución.", "Es una lectura incompleta del artículo 114, que también le atribuye el control político sobre el gobierno y la administración.", false], ["D", "Sí, porque la vigilancia sobre la gestión de los ministros le corresponde a la Contraloría General de la República.", "La Contraloría ejerce el control fiscal (art. 267), pero eso no le impide al Congreso ejercer el control político sobre el gobierno (art. 114).", false]]}]}, {"comp": "competencias_ciudadanas", "sim": "pro-1", "ind": "Órganos de control", "tt": "", "texto": "Un ciudadano tiene pruebas de que un funcionario de carrera de una secretaría departamental incumple de manera reiterada sus deberes y quiere que se le investigue disciplinariamente.", "vis": "", "items": [{"id": "CCP-109", "niv": 2, "cp": "cc_conocimientos", "e": "Según la Constitución, ¿qué entidad ejerce la vigilancia superior de la conducta oficial de quienes desempeñan funciones públicas y, de manera preferente, el poder disciplinario?", "f": "Constitución Política de Colombia (texto vigente, secretariasenado.gov.co/senado/basedoc/constitucion_politica_1991.html), artículos 117, 118, 250, 266, 267 y 277", "vis": "", "o": [["A", "La Registraduría Nacional del Estado Civil.", "La Registraduría dirige y organiza las elecciones y se encarga del registro civil y la identificación (art. 266).", false], ["B", "La Fiscalía General de la Nación.", "La Fiscalía ejerce la acción penal e investiga delitos (art. 250); el control disciplinario no le corresponde.", false], ["C", "La Procuraduría General de la Nación.", "El artículo 277, numeral 6, atribuye al Procurador General, por sí o por medio de sus delegados y agentes, «ejercer vigilancia superior de la conducta oficial de quienes desempeñen funciones públicas […]; ejercer preferentemente el poder disciplinario». Los artículos 117 y 118 lo ubican en el Ministerio Público, que es órgano de control.", true], ["D", "La Contraloría General de la República.", "La Contraloría ejerce la vigilancia y el control fiscal sobre el manejo de fondos o bienes públicos (art. 267), no el poder disciplinario preferente.", false]]}]}, {"comp": "competencias_ciudadanas", "sim": "pro-1", "ind": "Organización electoral", "tt": "", "texto": "En un taller sobre la organización electoral, el facilitador presenta varias afirmaciones y pide identificar la que coincide con el texto vigente de la Constitución.", "vis": "", "items": [{"id": "CCP-110", "niv": 3, "cp": "cc_conocimientos", "e": "¿Cuál de las siguientes afirmaciones es correcta?", "f": "Constitución Política de Colombia (texto vigente, secretariasenado.gov.co/senado/basedoc/constitucion_politica_1991.html), artículos 108, 265 y 266", "vis": "", "o": [["A", "La Registraduría Nacional reconoce y revoca la personería jurídica de los partidos y movimientos políticos.", "Esa atribución corresponde al Consejo Nacional Electoral (arts. 108 y 265, numeral 9).", false], ["B", "El Consejo Nacional Electoral depende de la Registraduría, cuyo titular le da posesión a sus miembros.", "Es al revés en lo relativo a la posesión: el artículo 265, numeral 2, dispone que el Consejo Nacional Electoral da posesión al Registrador. Además, el CNE ejerce la suprema inspección, vigilancia y control de la organización electoral (art. 265, num. 1).", false], ["C", "El Registrador Nacional del Estado Civil es elegido por el Congreso en pleno, por mayoría absoluta, de una terna que le envía para ese fin el Presidente de la República.", "Ese no es el procedimiento: el artículo 266 establece la escogencia por los presidentes de las tres altas cortes mediante concurso de méritos.", false], ["D", "El Registrador Nacional del Estado Civil es escogido por los presidentes de la Corte Constitucional, la Corte Suprema y el Consejo de Estado, por concurso de méritos.", "Así lo dispone el artículo 266, modificado por el Acto Legislativo 1 de 2003.", true]]}]}, {"comp": "competencias_ciudadanas", "sim": "pro-1", "ind": "Voto programático y revocatoria del mandato", "tt": "", "texto": "Un grupo de habitantes de un municipio considera que el alcalde ha incumplido el programa de gobierno que presentó cuando se inscribió como candidato y quiere promover la revocatoria de su mandato.", "vis": "", "items": [{"id": "CCP-111", "niv": 3, "cp": "cc_conocimientos", "e": "¿En qué figura constitucional se fundamenta la posibilidad de exigirle al alcalde el cumplimiento de su programa?", "f": "Constitución Política de Colombia (texto vigente, secretariasenado.gov.co/senado/basedoc/constitucion_politica_1991.html), artículos 87, 103, 259 y 313; Ley 134 de 1994, artículo 9", "vis": "", "o": [["A", "En la moción de censura, que el concejo municipal puede aprobar contra el alcalde cuando este incumple el programa con el que fue elegido.", "Según el artículo 313, numeral 12, la moción de censura procede respecto de los secretarios del despacho del alcalde, no del alcalde.", false], ["B", "En la acción de cumplimiento, mediante la cual un juez puede retirar al alcalde del cargo.", "La acción de cumplimiento (art. 87) solo permite que el juez ordene a la autoridad renuente cumplir una ley o un acto administrativo; no retira a nadie del cargo.", false], ["C", "En el voto programático, según el cual quienes eligen alcaldes imponen por mandato al elegido el programa que presentó al inscribirse.", "El artículo 259 consagra el voto programático para gobernadores y alcaldes; la revocatoria del mandato es uno de los mecanismos de participación del artículo 103.", true], ["D", "En el cabildo abierto, en el que los asistentes pueden destituir al alcalde por mayoría.", "El cabildo abierto es una reunión pública del concejo o de la junta administradora local para discutir asuntos de interés de la comunidad (Ley 134 de 1994, art. 9); no permite destituir al alcalde.", false]]}]}, {"comp": "competencias_ciudadanas", "sim": "pro-1", "ind": "Concesión de agua en una vereda", "tt": "", "texto": "En la vereda El Roble, 140 familias se abastecen de un acueducto comunitario que toma el agua de la quebrada La Esmeralda. Una empresa agrícola compró dos fincas en la parte alta de la cuenca para sembrar aguacate de exportación y solicitó a la corporación autónoma regional una concesión para captar agua de la misma quebrada. En una reunión convocada por la alcaldía se escucharon estas intervenciones:\n\nPresidenta de la junta del acueducto: «En verano el caudal ya no alcanza para todos. Si se aprueba otra captación arriba, las familias de la parte baja se quedarán sin agua para el consumo diario».\n\nGerente de la empresa: «Vamos a generar 90 empleos y a comprar insumos en el pueblo. Estamos dispuestos a instalar riego por goteo y a reforestar los nacimientos».\n\nFuncionaria de la corporación autónoma: «La decisión depende del estudio de caudal. La norma da prioridad al consumo humano y doméstico sobre los usos agrícolas».\n\nComerciante del pueblo: «Desde que cerró el trapiche no hay trabajo para los jóvenes; muchos se están yendo a la ciudad».", "vis": "", "items": [{"id": "CCP-112", "niv": 1, "cp": "cc_multiperspectivismo", "e": "La principal preocupación de la presidenta de la junta del acueducto es que", "f": "Texto original elaborado para este simulacro, caso de la quebrada La Esmeralda, intervención de la presidenta de la junta", "vis": "", "o": [["A", "la empresa no contrate trabajadores de la vereda para el cultivo de aguacate.", "El empleo lo menciona el gerente y le preocupa al comerciante; la presidenta no habla de contratación.", false], ["B", "el riego por goteo contamine el agua de la quebrada.", "Nadie relaciona el riego por goteo con contaminación; la presidenta habla de cantidad de agua, no de calidad.", false], ["C", "la corporación autónoma se demore en realizar el estudio de caudal.", "El estudio de caudal lo menciona la funcionaria; la presidenta no se queja de demoras.", false], ["D", "una nueva captación reduzca el agua disponible para el consumo de las familias de la parte baja.", "Lo dice expresamente: si se aprueba otra captación, «las familias de la parte baja se quedarán sin agua para el consumo diario».", true]]}, {"id": "CCP-113", "niv": 2, "cp": "cc_multiperspectivismo", "e": "¿Qué propuesta tendría mayor probabilidad de ser aceptada tanto por la junta del acueducto como por la empresa?", "f": "Texto original elaborado para este simulacro, caso de la quebrada La Esmeralda", "vis": "", "o": [["A", "Otorgar la concesión completa desde ahora, con goteo y reforestación, y hacer el estudio de caudal después de un año de operación.", "Parece conciliadora, pero invierte el orden que señala la funcionaria: la decisión depende del estudio de caudal, y sin él no se garantiza el agua para consumo que preocupa a la junta.", false], ["B", "Otorgar la concesión solo por el caudal que sobre tras garantizar el consumo de las familias, con goteo y reforestación.", "Atiende la preocupación de la junta (asegurar primero el agua para consumo, en línea con la prioridad que menciona la funcionaria) y recoge lo que la empresa misma ofreció (goteo y reforestación), sin negarle el agua.", true], ["C", "Otorgar la concesión que pidió la empresa y crear un fondo para que la junta compre agua en carrotanques en verano.", "Parece conciliadora, pero no garantiza el agua de la quebrada para el consumo de las familias, que según la funcionaria tiene prioridad; la junta difícilmente la aceptaría.", false], ["D", "Aprobar el caudal que la empresa solicitó, a cambio de que contrate a 90 personas de la vereda y compre sus insumos en el pueblo.", "Agrada a la empresa y quizá al comerciante, pero no responde a la preocupación de la junta: el agua para consumo seguiría en riesgo.", false]]}, {"id": "CCP-114", "niv": 2, "cp": "cc_sistemico", "e": "Si la corporación autónoma negara la concesión, ¿cuál sería el efecto más probable según la información de las intervenciones?", "f": "Texto original elaborado para este simulacro, caso de la quebrada La Esmeralda", "vis": "", "o": [["A", "Se protegería el agua para consumo de las familias, pero se perdería una fuente de empleo en una zona donde, según el comerciante, falta trabajo.", "La decisión tendría efectos en dos dimensiones: favorece la dimensión ambiental y de consumo humano (preocupación de la junta) y afecta la económica (los 90 empleos ofrecidos, en un contexto de falta de trabajo).", true], ["B", "Se afectaría sobre todo la dimensión ambiental, porque el proyecto de aguacate no generaría empleo en la vereda.", "Contradice el texto: el gerente ofrece 90 empleos y el comerciante señala la falta de trabajo, así que la dimensión económica sí está en juego.", false], ["C", "Se protegería el empleo de los jóvenes, aunque las familias de la parte baja tendrían menos agua en verano.", "Invierte los efectos: negar la concesión protege el agua de las familias y es el empleo ofrecido por la empresa el que se perdería.", false], ["D", "Se resolverían a la vez el problema del agua y el del empleo, porque la empresa buscaría otra fuente de agua en la región sin abandonar su proyecto de aguacate.", "El texto no dice que exista otra fuente ni que la empresa continuaría; es un supuesto sin apoyo.", false]]}, {"id": "CCP-115", "niv": 3, "cp": "cc_argumentacion", "e": "El gerente argumenta que la empresa generará 90 empleos. Este argumento, por sí solo, NO basta para justificar que se otorgue la concesión porque", "f": "Texto original elaborado para este simulacro, caso de la quebrada La Esmeralda, intervenciones del gerente y de la funcionaria", "vis": "", "o": [["A", "los 90 empleos serían temporales, porque el cultivo de aguacate solo requiere trabajadores en la época de cosecha.", "El texto no dice que los empleos sean temporales; es una suposición sin apoyo en el caso.", false], ["B", "el empleo no es un asunto que le interese a la comunidad de la vereda.", "Contradice el texto: el comerciante muestra que el empleo sí preocupa a la comunidad.", false], ["C", "no responde a la pregunta de si el caudal alcanza para el consumo humano, que según la funcionaria tiene prioridad.", "El punto que debe decidirse es la disponibilidad de agua (estudio de caudal) y la prioridad del consumo humano. Los beneficios económicos son pertinentes, pero no resuelven esa cuestión.", true], ["D", "la cifra de empleos es menor que el número de familias que usan el acueducto.", "Comparar 90 empleos con 140 familias no tiene sentido lógico: son magnitudes distintas y la comparación no dice nada sobre el agua disponible.", false]]}]}, {"comp": "competencias_ciudadanas", "sim": "pro-1", "ind": "Robo en el parque y vendedores ambulantes", "tt": "", "texto": "Tras el robo de una bicicleta en el parque del barrio San Mateo, se publicaron estos mensajes en el grupo de chat de los vecinos:\n\nVecino 1: «Desde que llegaron los vendedores ambulantes al parque hay robos. Hay que sacarlos a todos».\n\nVecina 2: «Revisé la cámara de mi edificio: la bicicleta se la llevó un muchacho en moto que no se detuvo en ningún puesto de venta».\n\nVecino 3: «Yo le compro tinto todos los días a don Ernesto y nunca he tenido problemas. Además, los vendedores también han denunciado robos de su mercancía».\n\nPresidente de la junta de acción comunal: «Propongo pedir a la alcaldía más iluminación y una patrulla en las noches, y reunirnos con los vendedores para organizar los puestos sin bloquear el paso».", "vis": "", "items": [{"id": "CCP-116", "niv": 1, "cp": "cc_argumentacion", "e": "El mensaje del vecino 1 se basa en", "f": "Texto original elaborado para este simulacro, caso del chat del barrio San Mateo, mensaje del vecino 1", "vis": "", "o": [["A", "una generalización que atribuye a todo un grupo la responsabilidad de un hecho sin pruebas de quién lo cometió.", "El vecino 1 asocia los robos con la llegada de los vendedores y propone sacarlos «a todos», sin ninguna evidencia de que alguno de ellos haya robado: es un prejuicio.", true], ["B", "una estadística oficial sobre los delitos cometidos en el barrio.", "No cita ninguna estadística.", false], ["C", "una prueba directa de que fueron los vendedores ambulantes del parque quienes cometieron el robo de la bicicleta.", "No presenta prueba alguna; solo relaciona dos hechos en el tiempo.", false], ["D", "una propuesta acordada previamente con la junta de acción comunal.", "La propuesta de la junta es otra (iluminación, patrulla y diálogo) y la presenta su presidente.", false]]}, {"id": "CCP-117", "niv": 2, "cp": "cc_argumentacion", "e": "¿Cuál de los mensajes aporta la información más directa para evaluar la afirmación del vecino 1 sobre el robo?", "f": "Texto original elaborado para este simulacro, caso del chat del barrio San Mateo", "vis": "", "o": [["A", "El del propio vecino 1, porque relaciona la llegada de los vendedores con el inicio de los robos.", "Que dos hechos coincidan en el tiempo no prueba que uno cause el otro; además, es la misma afirmación que se quiere evaluar.", false], ["B", "El de la vecina 2, porque describe lo que registró una cámara en el momento del robo.", "Es el único mensaje con información sobre el hecho mismo: según la grabación, el responsable fue un muchacho en moto que no se detuvo en ningún puesto.", true], ["C", "El del presidente de la junta, porque propone medidas concretas de seguridad.", "Una propuesta de solución no es evidencia sobre lo que ocurrió.", false], ["D", "El del vecino 3, porque relata su experiencia diaria con uno de los vendedores.", "Es una experiencia personal con un vendedor; es pertinente, pero no informa sobre quién cometió el robo.", false]]}, {"id": "CCP-118", "niv": 2, "cp": "cc_multiperspectivismo", "e": "La propuesta del presidente de la junta de acción comunal busca principalmente", "f": "Texto original elaborado para este simulacro, caso del chat del barrio San Mateo, mensaje del presidente de la junta", "vis": "", "o": [["A", "expulsar a los vendedores del parque con el apoyo de la policía.", "Propone reunirse con los vendedores, no expulsarlos; la patrulla se pide para la seguridad nocturna.", false], ["B", "demostrar que la vecina 2 identificó correctamente al responsable del robo.", "El presidente no se pronuncia sobre quién cometió el robo.", false], ["C", "dejar la solución del problema en manos de la alcaldía local.", "Pide apoyo a la alcaldía, pero también propone que los vecinos se reúnan con los vendedores para organizar los puestos.", false], ["D", "atender la seguridad del parque y, a la vez, tener en cuenta los intereses de los vendedores.", "Propone medidas de seguridad (iluminación y patrulla) y un diálogo con los vendedores para organizar los puestos, sin expulsarlos.", true]]}, {"id": "CCP-119", "niv": 3, "cp": "cc_argumentacion", "e": "Al decir que los vendedores «también han denunciado robos de su mercancía», el vecino 3 busca mostrar que", "f": "Texto original elaborado para este simulacro, caso del chat del barrio San Mateo, mensaje del vecino 3", "vis": "", "o": [["A", "los vendedores también sufren la inseguridad, lo que debilita la idea de que la causan.", "El dato presenta a los vendedores como afectados por los robos, lo que va en contra de la generalización del vecino 1.", true], ["B", "la policía no atiende las denuncias que hacen los vecinos y los vendedores del barrio.", "El vecino 3 no habla de la respuesta de la policía.", false], ["C", "los robos del parque se deben a la presencia de los vendedores.", "Es lo contrario de lo que pretende mostrar el vecino 3.", false], ["D", "los vendedores venden mercancía de procedencia dudosa.", "Nada en el mensaje sugiere eso; habla de robos que ellos sufrieron.", false]]}]}, {"comp": "competencias_ciudadanas", "sim": "pro-1", "ind": "Ciclorruta en una avenida comercial", "tt": "", "texto": "La Secretaría de Movilidad de una ciudad intermedia anunció que convertirá uno de los tres carriles de la avenida Comercio en una ciclorruta separada del tráfico. Según la Secretaría, el año pasado se registraron en esa avenida 38 accidentes con ciclistas heridos, y el 35 % de quienes la recorren en hora pico lo hacen en bicicleta.\n\nLas reacciones fueron diversas:\n\n– La asociación de comerciantes de la avenida teme que, al reducirse los carriles, desaparezcan las zonas de cargue y descargue y bajen las ventas.\n\n– El colectivo de ciclistas urbanos apoya la medida y pide que se complemente con parqueaderos para bicicletas.\n\n– El gremio de taxistas advierte que la congestión aumentará, que los conductores harán menos carreras por turno y que los recorridos serán más largos y costosos para los usuarios.\n\n– La Secretaría propone horarios nocturnos de cargue y descargue y semáforos sincronizados para compensar la reducción de carriles.", "vis": "", "items": [{"id": "CCP-120", "niv": 1, "cp": "cc_multiperspectivismo", "e": "¿Qué tienen en común las posiciones de la asociación de comerciantes y del gremio de taxistas?", "f": "Texto original elaborado para este simulacro, caso de la avenida Comercio", "vis": "", "o": [["A", "Ambos piden que la medida se aplique en horario nocturno.", "Nadie pide eso; los horarios nocturnos los propone la Secretaría solo para el cargue y descargue.", false], ["B", "Ambos reconocen que la ciclorruta reducirá el número de accidentes con ciclistas heridos en la avenida.", "Ninguno de los dos se pronuncia sobre los accidentes.", false], ["C", "Ambos temen que la reducción de carriles afecte negativamente su actividad económica.", "Los comerciantes temen perder zonas de cargue y ventas; los taxistas, más congestión y menos carreras por turno. En ambos casos el temor es por su actividad.", true], ["D", "Ambos proponen que la ciclorruta se complemente con parqueaderos para bicicletas.", "Esa petición es del colectivo de ciclistas.", false]]}, {"id": "CCP-121", "niv": 2, "cp": "cc_argumentacion", "e": "Un taxista afirma: «La ciclorruta solo beneficia a unos pocos». Con base en la información de la Secretaría, esta afirmación es", "f": "Texto original elaborado para este simulacro, caso de la avenida Comercio, datos de la Secretaría de Movilidad", "vis": "", "o": [["A", "correcta, porque la ciclorruta la usarán principalmente los integrantes del colectivo de ciclistas urbanos que apoyaron la medida.", "Según la Secretaría, el 35 % de quienes recorren la avenida en hora pico lo hacen en bicicleta; los usuarios potenciales no se reducen a los miembros del colectivo.", false], ["B", "discutible, porque más de un tercio de quienes recorren la avenida en hora pico lo hacen en bicicleta.", "El 35 % de los usuarios de la avenida en hora pico no son «unos pocos»; además, los 38 accidentes muestran que hay un problema de seguridad que afecta a muchas personas.", true], ["C", "discutible, porque los taxistas también podrán usar la ciclorruta en las horas de menor tráfico.", "El texto no dice eso; la ciclorruta está separada del tráfico vehicular.", false], ["D", "correcta, porque entre los actores que opinaron, el colectivo de ciclistas fue el único que apoyó la medida.", "El dato es cierto, pero el número de actores que apoyan una medida no indica a cuántas personas beneficia.", false]]}, {"id": "CCP-122", "niv": 2, "cp": "cc_sistemico", "e": "La medida de la Secretaría privilegia principalmente", "f": "Texto original elaborado para este simulacro, caso de la avenida Comercio", "vis": "", "o": [["A", "la descongestión de la avenida, aunque se eliminen los espacios para las bicicletas.", "La medida reduce carriles para vehículos y crea un espacio para bicicletas, así que no busca descongestionar.", false], ["B", "la reducción de las tarifas de taxi, aunque disminuya el uso de la bicicleta.", "La medida no tiene relación con tarifas, y los taxistas prevén lo contrario: recorridos más costosos.", false], ["C", "la rentabilidad del comercio de la avenida, aunque aumente el riesgo de accidentes para quienes se movilizan en bicicleta.", "Es lo contrario: la medida busca reducir el riesgo de los ciclistas y los comerciantes temen verse perjudicados.", false], ["D", "la seguridad vial de los ciclistas, aunque pueda afectar la fluidez del tráfico y el comercio.", "La justificación de la medida son los accidentes con ciclistas; sus costos posibles recaen sobre el tráfico vehicular y la actividad comercial, que la Secretaría intenta compensar.", true]]}, {"id": "CCP-123", "niv": 3, "cp": "cc_sistemico", "e": "Si la ciudad quisiera aplicar la misma medida en otra avenida, ¿qué información sería más pertinente para evaluar si es adecuada allí?", "f": "Texto original elaborado para este simulacro, caso de la avenida Comercio", "vis": "", "o": [["A", "La opinión que tiene el colectivo de ciclistas urbanos sobre la ciclorruta de la avenida Comercio y sus parqueaderos.", "Se refiere a la avenida Comercio, no a la nueva avenida, y es la opinión de un solo actor.", false], ["B", "La cantidad de comerciantes afiliados a la asociación de la avenida Comercio.", "Se refiere a otra avenida y no permite evaluar la pertinencia de la medida en la nueva.", false], ["C", "Cuántos ciclistas usan esa avenida, cuántos accidentes con ciclistas ha habido en ella y si hay alternativas para el cargue y descargue.", "Son las mismas dimensiones que justifican la medida (uso y seguridad de los ciclistas) y la principal dificultad que genera (el cargue y descargue de los comercios).", true], ["D", "El número total de taxis que están registrados en la ciudad.", "Es un dato general de la ciudad que no indica si la nueva avenida tiene las condiciones que justifican la medida.", false]]}, {"id": "CCP-124", "niv": 3, "cp": "cc_multiperspectivismo", "e": "¿Qué explica mejor que el colectivo de ciclistas y la asociación de comerciantes evalúen de manera opuesta la misma medida?", "f": "Texto original elaborado para este simulacro, caso de la avenida Comercio", "vis": "", "o": [["A", "Los ciclistas no hacen compras en los negocios de la avenida.", "El texto no dice nada sobre los hábitos de compra de los ciclistas.", false], ["B", "Cada uno la juzga según su actividad: los ciclistas ganan un espacio seguro y los comerciantes pueden perder cargue y ventas.", "Los roles de cada actor determinan cómo evalúan la medida: lo que para unos es un beneficio para otros es un costo.", true], ["C", "Los ciclistas conocen las cifras de accidentes de la avenida, mientras que los comerciantes no han tenido acceso a esos datos.", "El texto no dice que los comerciantes desconozcan las cifras; las publicó la Secretaría.", false], ["D", "Los comerciantes prefieren que sus clientes lleguen en carro y no en bicicleta.", "El texto no dice nada sobre cómo prefieren los comerciantes que lleguen sus clientes; su preocupación es el cargue, el descargue y las ventas.", false]]}]}, {"comp": "competencias_ciudadanas", "sim": "pro-1", "ind": "Ecoturismo en una laguna sagrada", "tt": "", "texto": "La gobernación de un departamento andino diseñó un proyecto de ecoturismo en la laguna de Quinchá: senderos, un mirador, un restaurante y una zona de camping con capacidad para 400 visitantes diarios. La laguna está en un páramo y es considerada sagrada por el pueblo indígena que habita la zona. Su gobernador explicó: «Para nosotros la laguna es un lugar de origen; solo entramos en ella para hacer pagamentos, en silencio y con permiso de los mayores».\n\nUna asociación de campesinos de la vereda vecina apoya el proyecto porque podría vender alimentos y ofrecer servicio de guías. Un grupo de biólogos de la universidad regional advirtió que el páramo regula el agua de tres municipios y que el pisoteo y la basura podrían dañar los musgos y frailejones. La gobernación respondió que el proyecto generará ingresos para la región y que cada visitante recibirá una charla ambiental antes de entrar.", "vis": "", "items": [{"id": "CCP-125", "niv": 1, "cp": "cc_multiperspectivismo", "e": "La oposición del gobernador indígena al proyecto se explica principalmente por", "f": "Texto original elaborado para este simulacro, caso de la laguna de Quinchá, intervención del gobernador indígena", "vis": "", "o": [["A", "una cosmovisión en la que la laguna es un lugar sagrado con normas rituales de acceso.", "El gobernador explica que la laguna es un «lugar de origen» al que solo se entra para hacer pagamentos, en silencio y con permiso de los mayores.", true], ["B", "la evidencia científica de que el pisoteo destruye los frailejones.", "Ese argumento es de los biólogos, no del gobernador indígena.", false], ["C", "el temor de que los campesinos de la vereda vecina obtengan más ingresos que su comunidad con el turismo.", "El gobernador no habla de ingresos ni compara su situación con la de los campesinos.", false], ["D", "el interés en administrar el restaurante y la zona de camping.", "Nada en su intervención indica interés en administrar el proyecto.", false]]}, {"id": "CCP-126", "niv": 2, "cp": "cc_multiperspectivismo", "e": "¿En qué coinciden el gobernador indígena y los biólogos?", "f": "Texto original elaborado para este simulacro, caso de la laguna de Quinchá", "vis": "", "o": [["A", "En que el proyecto debe ejecutarse siempre que cada visitante reciba una charla ambiental antes de entrar.", "Esa es la respuesta de la gobernación, no una posición del gobernador indígena ni de los biólogos.", false], ["B", "En que los campesinos deben ser los guías del proyecto.", "Ninguno de los dos se pronuncia sobre quiénes deben ser los guías.", false], ["C", "En que el páramo debe protegerse porque regula el agua de tres municipios.", "Ese argumento es solo de los biólogos; el gobernador indígena se refiere al carácter sagrado de la laguna.", false], ["D", "En que la llegada masiva de visitantes a la laguna puede ser perjudicial, aunque por razones distintas.", "Para el gobernador, afecta un lugar sagrado; para los biólogos, daña un ecosistema que regula el agua. Coinciden en el rechazo al ingreso masivo, no en sus razones.", true]]}, {"id": "CCP-127", "niv": 3, "cp": "cc_multiperspectivismo", "e": "¿Cuál de las siguientes alternativas tendría mayor probabilidad de ser aceptada por la gobernación, la comunidad indígena, los campesinos y los biólogos?", "f": "Texto original elaborado para este simulacro, caso de la laguna de Quinchá", "vis": "", "o": [["A", "Ejecutar el proyecto tal como fue diseñado, con capacidad para 400 visitantes diarios, y ampliar la duración de la charla ambiental que reciben los visitantes antes de entrar a la laguna.", "No responde a la preocupación de los biólogos por el pisoteo ni al carácter sagrado de la laguna; la comunidad indígena y los biólogos la rechazarían.", false], ["B", "Ubicar el mirador y los servicios fuera del páramo, limitar los visitantes e impedir el acceso a la orilla, acordar las reglas con la comunidad indígena y contratar guías campesinos.", "Mantiene un proyecto que genera ingresos (gobernación y campesinos), reduce la presión sobre el páramo (biólogos) y respeta las normas de acceso a la laguna sagrada (comunidad indígena).", true], ["C", "Mantener la capacidad de 400 visitantes diarios, contratar guías campesinos y permitir los pagamentos indígenas en horarios especiales.", "Atiende a la gobernación y a los campesinos, pero mantiene la llegada masiva de visitantes a la laguna, que rechazan los biólogos (pisoteo y basura) y la comunidad indígena (lugar sagrado con normas de acceso).", false], ["D", "Cancelar el proyecto y declarar la laguna y sus alrededores zona de acceso exclusivo para la comunidad indígena, y suspender la actividad turística y el servicio de guías.", "Satisface a la comunidad indígena y posiblemente a los biólogos, pero no a la gobernación ni a los campesinos, que esperan ingresos.", false]]}, {"id": "CCP-128", "niv": 2, "cp": "cc_sistemico", "e": "La respuesta de la gobernación privilegia la dimensión económica del proyecto. ¿Qué aspecto del problema deja sin atender?", "f": "Texto original elaborado para este simulacro, caso de la laguna de Quinchá", "vis": "", "o": [["A", "El interés de los visitantes en conocer el páramo y la laguna.", "No es un aspecto desatendido: es justamente lo que el proyecto ofrece.", false], ["B", "La necesidad de informar a los visitantes sobre el cuidado del páramo.", "La charla ambiental está pensada precisamente para eso.", false], ["C", "La generación de ingresos para la asociación de campesinos que quiere vender alimentos y ofrecer guías.", "La gobernación sí atiende ese aspecto: defiende el proyecto porque generará ingresos para la región.", false], ["D", "El significado sagrado de la laguna para el pueblo indígena, que una charla ambiental no resuelve.", "La charla ambiental podría responder en parte a los biólogos, pero no al carácter sagrado de la laguna ni a las normas indígenas de acceso.", true]]}]}, {"comp": "competencias_ciudadanas", "sim": "pro-1", "ind": "Prohibición de bolsas plásticas", "tt": "", "texto": "El concejo de un municipio costero aprobó un acuerdo que prohíbe entregar bolsas plásticas de un solo uso en la plaza de mercado a partir de enero. La medida se justificó porque las bolsas taponan los canales de aguas lluvias, lo que agrava las inundaciones en temporada de lluvias, y porque buena parte de ellas termina en el mar, del que viven 300 familias de pescadores.\n\nLos vendedores de la plaza señalan que las bolsas de tela o de papel les cuestan cinco veces más y que muchos compradores llegan sin bolsa propia. Una distribuidora local de bolsas plásticas, que emplea a 25 personas, pidió un plazo de dos años para adaptarse. La asociación de pescadores respaldó el acuerdo y propuso que la alcaldía entregue bolsas reutilizables a los compradores durante los primeros meses.", "vis": "", "items": [{"id": "CCP-129", "niv": 2, "cp": "cc_sistemico", "e": "¿Cuál de las siguientes cadenas recoge las relaciones que el texto establece para justificar el acuerdo?", "f": "Texto original elaborado para este simulacro, caso de las bolsas plásticas en la plaza de mercado", "vis": "", "o": [["A", "Bolsas desechadas → menos ventas en la plaza de mercado → desempleo en la distribuidora de bolsas plásticas.", "Mezcla efectos que el texto atribuye a la prohibición (costos, plazo de adaptación) con la justificación de la medida; no es la relación que la justifica.", false], ["B", "Lluvias fuertes → inundaciones → bolsas arrastradas al mar; pesca intensiva → menos peces → menos ingresos de los pescadores.", "Invierte la relación entre bolsas e inundaciones (en el texto, las bolsas taponan los canales y agravan las inundaciones) y atribuye el daño a los pescadores a la sobrepesca, que el texto no menciona.", false], ["C", "Bolsas desechadas → canales taponados → inundaciones más graves; bolsas en el mar → daño a la actividad de los pescadores.", "Son las dos relaciones que el texto menciona como justificación: una entre residuos e inundaciones, y otra entre residuos en el mar y el sustento de 300 familias.", true], ["D", "Prohibición de bolsas → aumento de costos para los vendedores → inundaciones más graves.", "El texto no relaciona los costos de los vendedores con las inundaciones.", false]]}, {"id": "CCP-130", "niv": 3, "cp": "cc_sistemico", "e": "¿Qué efecto no deseado de la prohibición podría reducir la propuesta de la asociación de pescadores?", "f": "Texto original elaborado para este simulacro, caso de las bolsas plásticas en la plaza de mercado, propuesta de la asociación de pescadores", "vis": "", "o": [["A", "Que los compradores sin bolsa propia dejen de comprar o que los vendedores asuman el costo de las bolsas alternativas.", "En
