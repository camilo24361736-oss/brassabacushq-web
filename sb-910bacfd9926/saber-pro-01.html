<style>
:root{--bg:#f7f5f2;--card:#fff;--ink:#1d2433;--mute:#5a6478;--line:#e0dbd4;--pri:#7a2e0b;--pri2:#b0501c;--ok:#0d6b3a;--okbg:#e6f4ec;--no:#9b1c1c;--nobg:#fbeaea;--sel:#f8ece4}
@media (prefers-color-scheme: dark){:root{--bg:#14110f;--card:#1f1a17;--ink:#ece6e1;--mute:#a69c94;--line:#3a322c;--pri:#f0a47a;--pri2:#f5bb98;--ok:#7fd3a3;--okbg:#16301f;--no:#f2a3a3;--nobg:#3a1c1c;--sel:#3a2a20}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overflow-wrap:anywhere}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px}
.hwrap{max-width:860px;margin:0 auto;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;justify-content:space-between}
h1{font-size:17px;margin:0;color:var(--pri)}
h2{color:var(--pri)}
.stat{font-size:14px;color:var(--mute)}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--pri)}
.timer.low{color:var(--no)}
main{max-width:860px;margin:0 auto;padding:16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin:0 0 16px}
.mod{background:var(--pri);color:var(--card);border-radius:10px;padding:10px 14px;margin:28px 0 6px;font-weight:700;font-size:18px}
.inst{font-size:13px;font-weight:700;color:var(--pri);text-transform:uppercase;letter-spacing:.03em;margin:18px 0 4px}
.caso{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--pri);border-radius:10px;padding:14px 16px;margin:10px 0}
.tag{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--pri);font-weight:700}
.caso p{margin:6px 0 0;white-space:pre-line}
.item{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0}
.enun{margin:0 0 8px;white-space:pre-line}
.n{font-weight:700;color:var(--pri)}
.niv{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-right:4px;white-space:nowrap}
.op{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:6px 0;cursor:pointer;background:transparent;width:100%;text-align:left;color:inherit;font:inherit}
.ops8{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.ops8 .op{margin:0}
.op:hover{border-color:var(--pri2)}
.op .l{font-weight:700;min-width:20px}
.op.sel{background:var(--sel);border-color:var(--pri2)}
.op.ok{background:var(--okbg);border-color:var(--ok)}
.op.no{background:var(--nobg);border-color:var(--no)}
.op[disabled]{cursor:default}
.just{font-size:14px;margin:8px 0 0;padding:8px 10px;border-top:1px dashed var(--line)}
.just div{margin:4px 0}
.just .okt{color:var(--ok);font-weight:700}
.just .not{color:var(--no);font-weight:700}
.src{font-size:13px;color:var(--mute);margin-top:6px}
button.btn{background:var(--pri);color:var(--card);border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer}
button.btn.sec{background:transparent;color:var(--pri);border:1px solid var(--pri)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
select{font:inherit;padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);max-width:100%}
table{border-collapse:collapse;width:100%;font-size:15px}
td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.sub td{font-size:13px;color:var(--mute);padding-left:22px}
.vt{width:auto;max-width:100%;margin:10px 0;font-size:14px;display:block;overflow-x:auto}
.vt caption{text-align:left;font-weight:700;padding-bottom:4px}
.vt th,.vt td{border:1px solid var(--line);padding:4px 8px}
.vt th{background:var(--sel)}
.vnota{font-size:12px;color:var(--mute)}
.vfig{margin:10px 0}
.vfig svg{width:100%;max-width:560px;height:auto;border-radius:6px;border:1px solid var(--line);background:#fff}
.big{font-size:40px;font-weight:800;color:var(--pri);line-height:1.1}
.aviso{font-size:13px;color:var(--mute)}
.hide{display:none !important}
.res-ok{color:var(--ok);font-weight:700}.res-no{color:var(--no);font-weight:700}
textarea{width:100%;min-height:320px;font:inherit;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);resize:vertical}
.chk label{display:flex;gap:8px;align-items:flex-start;margin:6px 0;font-size:15px}
.chk input{margin-top:4px;width:18px;height:18px;flex:none}
.modelo{white-space:pre-line;background:var(--bg);border-radius:8px;padding:10px 12px;margin:6px 0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal .panel{max-width:420px}
.nav{padding:6px 0;display:flex;gap:6px;flex-wrap:wrap}
.nav a{font-size:13px;color:var(--pri);border:1px solid var(--line);border-radius:999px;padding:3px 10px;text-decoration:none;background:var(--card)}
footer{max-width:860px;margin:0 auto;padding:8px 16px 40px;font-size:12px;color:var(--mute)}
</style>
</head>

<script>
const DATA = [{"comp": "lectura_critica", "sim": "pro-1", "ind": "Cuento: el relojero y el reloj detenido", "tt": "Texto literario", "texto": "Anselmo Ruiz llevaba cuarenta años reparando relojes en un local tan angosto que los clientes debían esperar en la acera. Nadie recordaba haberlo visto mirar la hora: decía que quien arregla el tiempo de los demás no tiene derecho a consultar el propio.\n\nUn martes de lluvia entró una muchacha con un reloj de bolsillo envuelto en un pañuelo. Lo puso sobre el mostrador como quien deposita un pájaro herido.\n\n—Era de mi abuelo —dijo—. Se detuvo la noche en que él murió.\n\nAnselmo abrió la tapa con la uña. El mecanismo estaba intacto; solo faltaba darle cuerda. Lo supo en un segundo, pero se quedó mirando las agujas, detenidas en las tres y diez, como si leyera una carta ajena.\n\n—Puedo hacerlo andar hoy mismo —dijo al fin.\n\nLa muchacha tardó en responder. Afuera, un bus levantó una ola de agua sucia contra la vitrina.\n\n—Mi mamá quiere que lo arregle. Dice que un reloj parado trae mala suerte. Yo no sé. Si camina, va a marcar otras horas, y él ya no está en ninguna.\n\nAnselmo pensó en los cientos de relojes que había devuelto a la vida sin preguntar a sus dueños qué querían que midieran. Pensó también en el suyo, guardado en un cajón desde hacía años, con la cuerda vencida.\n\n—Hagamos una cosa —propuso—. Déjemelo una semana. Yo no le voy a tocar nada. Si al cabo de la semana usted vuelve y me dice que lo ponga a andar, lo pongo. Si no vuelve, se lo guardo hasta que vuelva.\n\n—¿Y si no vuelvo nunca?\n\n—Entonces habrá sido el reloj mejor guardado de este pueblo.\n\nLa muchacha sonrió por primera vez y se fue sin abrir el paraguas.\n\nEsa noche, cuando cerró el local, Anselmo sacó su propio reloj del cajón. Lo sostuvo un rato en la palma, sintiendo su peso de cosa quieta. Después, despacio, como quien pide permiso, le dio cuerda.", "vis": "", "items": [{"id": "LCP-101", "niv": 1, "cp": "lc_local", "e": "Según el relato, al abrir el reloj de bolsillo Anselmo supo de inmediato que", "f": "Texto original elaborado para este simulacro, párrafo 4 del cuento", "vis": "", "o": [["A", "no estaba dañado: solo necesitaba que le dieran cuerda.", "El narrador dice que «el mecanismo estaba intacto; solo faltaba darle cuerda» y que Anselmo «lo supo en un segundo».", true], ["B", "tendría que cambiarle varias piezas antes de hacerlo funcionar de nuevo.", "El mecanismo estaba intacto; no hacía falta cambiar piezas, bastaba con darle cuerda.", false], ["C", "se trataba de un reloj que él mismo había reparado años atrás.", "El relato no menciona que Anselmo hubiera reparado antes ese reloj; es un dato inventado.", false], ["D", "el mecanismo se había dañado la misma noche en que murió el abuelo de la muchacha.", "El reloj se detuvo esa noche, pero el texto aclara que el mecanismo estaba intacto; no hubo daño.", false]]}, {"id": "LCP-102", "niv": 2, "cp": "lc_global", "e": "¿Por qué duda la muchacha de que el reloj sea reparado?", "f": "Texto original elaborado para este simulacro, intervención de la muchacha («Si camina, va a marcar otras horas…»)", "vis": "", "o": [["A", "Porque no tiene dinero suficiente para pagar la reparación.", "El dinero no se menciona en el relato; es una suposición sin apoyo textual.", false], ["B", "Porque teme que, al volver a andar, el reloj deje de estar ligado al momento en que murió su abuelo.", "Ella explica: «Si camina, va a marcar otras horas, y él ya no está en ninguna»; detenido, el reloj conserva la hora de la muerte del abuelo.", true], ["C", "Porque, como su madre, cree que un reloj parado trae mala suerte.", "Esa creencia es de la madre y es una razón para repararlo, no para dudar; la muchacha dice «Yo no sé».", false], ["D", "Porque desconfía de la habilidad de Anselmo y preferiría llevar el reloj a otro taller del pueblo.", "Nada en el diálogo indica desconfianza hacia el relojero ni intención de buscar otro taller; su duda se refiere al sentido de que el reloj vuelva a andar.", false]]}, {"id": "LCP-103", "niv": 3, "cp": "lc_global", "e": "En la escena final, Anselmo le da cuerda a su propio reloj. A partir del relato completo, este gesto sugiere que", "f": "Texto original elaborado para este simulacro, párrafos inicial, octavo y final", "vis": "", "o": [["A", "comprobó que su reloj tenía una falla y quiso repararlo antes de abrir el local al día siguiente.", "El texto no habla de ninguna falla; solo dice que tenía «la cuerda vencida». Además, el gesto ocurre cuando ya cerró el local.", false], ["B", "decidió reparar a escondidas el reloj de la muchacha, aunque había prometido no tocarlo.", "El reloj al que da cuerda es el suyo, «guardado en un cajón desde hacía años», no el de la muchacha.", false], ["C", "el encuentro con la muchacha lo llevó a reconsiderar su relación con un tiempo propio que había dejado detenido.", "Tras la conversación, Anselmo piensa en su reloj parado y al final le da cuerda «como quien pide permiso»; el relato vincula su gesto con lo que vivió con la muchacha y con su costumbre de no mirar la propia hora.", true], ["D", "se arrepintió de haber aceptado guardar el reloj de la muchacha sin hacerlo funcionar, como quería la madre de ella.", "Nada sugiere arrepentimiento; su propuesta de guardar el reloj provoca la primera sonrisa de la muchacha y el gesto final no se refiere a ese reloj.", false]]}, {"id": "LCP-104", "niv": 2, "cp": "lc_global", "e": "La comparación «Lo puso sobre el mostrador como quien deposita un pájaro herido» indica que la muchacha", "f": "Texto original elaborado para este simulacro, párrafo 2 del cuento", "vis": "", "o": [["A", "quería deshacerse cuanto antes de un objeto que le recordaba la muerte de su abuelo.", "La comparación expresa cuidado, no rechazo; además, al final ella no entrega el reloj para deshacerse de él, sino para que se lo guarden.", false], ["B", "temía que Anselmo lo dañara al abrirlo con descuido.", "La comparación describe cómo ella deposita el reloj; nada en el texto indica desconfianza hacia el relojero.", false], ["C", "esperaba que Anselmo le devolviera el reloj funcionando ese mismo día.", "Ella duda incluso de que quiera verlo andar; la comparación no expresa una expectativa sobre la reparación.", false], ["D", "trataba el reloj con delicadeza, como algo frágil y valioso para ella.", "Depositar un pájaro herido exige cuidado y afecto; la comparación transmite la delicadeza con que ella maneja un objeto cargado de valor sentimental.", true]]}, {"id": "LCP-105", "niv": 3, "cp": "lc_reflexion", "e": "Un crítico ficticio escribe sobre este cuento: «Aquí reparar no siempre significa devolver el funcionamiento». ¿Qué elemento del relato respalda mejor esta lectura?", "f": "Texto original elaborado para este simulacro, propuesta de Anselmo («Hagamos una cosa…»)", "vis": "", "o": [["A", "La propuesta de Anselmo de guardar el reloj sin tocarlo hasta que la muchacha decida qué hacer con él.", "Anselmo atiende la necesidad de la muchacha sin poner a andar el reloj: lo cuida y respeta su duelo; es una «reparación» que no consiste en devolverle el funcionamiento.", true], ["B", "La descripción del local, tan angosto que los clientes deben esperar en la acera.", "Es un detalle de ambientación que no se relaciona con el sentido de «reparar» que propone el crítico.", false], ["C", "La creencia de la madre de que un reloj parado trae mala suerte.", "Esa creencia apoya justamente la idea contraria: que hay que hacer funcionar el reloj.", false], ["D", "La rapidez con que Anselmo diagnostica, apenas abre la tapa con la uña, que el mecanismo del reloj está en buen estado.", "El diagnóstico muestra la pericia técnica del relojero, pero no dice nada sobre otra forma de «reparar».", false]]}]}, {"comp": "lectura_critica", "sim": "pro-1", "ind": "Ensayo sobre la distracción digital y el diseño de las aplicaciones", "tt": "Texto informativo", "texto": "(1) Cada cierto tiempo aparece un nuevo manual para recuperar la concentración: apagar las notificaciones, dejar el teléfono en otra habitación, meditar diez minutos al despertar. Los consejos no son malos, pero comparten un supuesto discutible: que la distracción es, ante todo, una falla de la voluntad individual.\n\n(2) Ese supuesto ignora cómo se producen las aplicaciones que usamos. Buena parte de ellas no cobra al usuario; vende a anunciantes el tiempo que el usuario pasa frente a la pantalla. En ese modelo, cada minuto de atención es mercancía, y los equipos de diseño son evaluados según cuánto logran prolongarlo. El desplazamiento infinito, la reproducción automática y las alertas de colores llamativos no son accidentes estéticos: son herramientas pensadas para que interrumpir el uso cueste más que continuarlo.\n\n(3) Pedirle a una persona que resista sola esas herramientas equivale a pedirle a un nadador que avance contra una corriente que otros fabrican a propósito. Algunos lo lograrán, y sus testimonios alimentarán la idea de que basta con esforzarse. Pero el éxito de unos pocos no prueba que el problema sea personal; prueba, a lo sumo, que algunos tienen más tiempo, más recursos o menos obligaciones para dedicar a la resistencia.\n\n(4) Se dirá que nadie obliga a instalar una aplicación y que el adulto es responsable de sus hábitos. Es cierto que hay un margen de elección, pero ese margen se estrecha cuando el estudio, el trabajo y la vida familiar se organizan a través de las mismas plataformas. Renunciar a ellas no es una opción neutral: puede significar quedar por fuera de la reunión de padres, de la oferta de empleo o del grupo de estudio.\n\n(5) Por eso conviene desplazar la pregunta. En lugar de interrogar únicamente al usuario distraído, habría que examinar las reglas del diseño. Algunas medidas son modestas: que la reproducción automática venga desactivada por defecto, que las notificaciones no esenciales requieran autorización expresa, que las plataformas informen cuánto tiempo promedio pasan sus usuarios en ellas. Ninguna de estas medidas prohíbe nada; simplemente cambia el punto de partida.\n\n(6) La concentración seguirá exigiendo disciplina personal. Pero una sociedad que solo habla de disciplina, y nunca de diseño, termina culpando a los individuos de un resultado que fue planeado por otros.", "vis": "", "items": [{"id": "LCP-106", "niv": 2, "cp": "lc_global", "e": "¿Cuál es la tesis que defiende el autor?", "f": "Texto original elaborado para este simulacro, párrafos 1, 2 y 6", "vis": "", "o": [["A", "Los consejos para recuperar la concentración atacan el problema de fondo, aunque pocos los siguen.", "El autor dice que esos consejos comparten «un supuesto discutible» (que la distracción es una falla individual); no cree que ataquen el problema de fondo.", false], ["B", "El problema de la distracción se resuelve con medidas de diseño, sin necesidad de disciplina personal.", "El párrafo 6 afirma que «la concentración seguirá exigiendo disciplina personal»; el diseño se suma a la disciplina, no la reemplaza.", false], ["C", "La distracción digital es también un problema de diseño y no puede atribuirse solo a la voluntad de cada usuario.", "Es la idea que articula el texto: se cuestiona el supuesto individual (párrafo 1), se explica el modelo de negocio (párrafo 2) y se concluye que no se debe culpar solo a los individuos (párrafo 6).", true], ["D", "Las plataformas deberían cobrar a los usuarios para dejar de depender de la publicidad.", "El autor propone cambiar reglas de diseño (párrafo 5), no cambiar el modelo de cobro de las plataformas.", false]]}, {"id": "LCP-107", "niv": 2, "cp": "lc_global", "e": "¿Qué función cumple el párrafo 4 dentro del texto?", "f": "Texto original elaborado para este simulacro, párrafo 4", "vis": "", "o": [["A", "Resumir las medidas de diseño que se proponen al final.", "Las medidas aparecen en el párrafo 5, no en el 4.", false], ["B", "Plantear una objeción a la postura del autor y responderla.", "«Se dirá que nadie obliga a instalar una aplicación» introduce una objeción, y el resto del párrafo la responde mostrando que el margen de elección se estrecha.", true], ["C", "Presentar un ejemplo que confirma, sin discusión, lo afirmado en el párrafo 3.", "El párrafo no es un simple ejemplo: introduce una voz contraria («Se dirá que…») que luego se discute.", false], ["D", "Introducir una nueva tesis que contradice la explicación del modelo de negocio dada en el párrafo 2.", "El autor no cambia de tesis; la objeción se presenta para rebatirla y así reforzar su postura.", false]]}, {"id": "LCP-108", "niv": 3, "cp": "lc_reflexion", "e": "En el párrafo 3, el autor advierte que «el éxito de unos pocos no prueba que el problema sea personal». Con esta afirmación, el autor cuestiona principalmente el razonamiento que consiste en", "f": "Texto original elaborado para este simulacro, párrafo 3", "vis": "", "o": [["A", "suponer que las plataformas obtienen ingresos vendiendo a los anunciantes el tiempo que los usuarios pasan frente a la pantalla.", "Es una afirmación del párrafo 2 que el autor presenta como cierta, no un razonamiento que critique.", false], ["B", "proponer que la reproducción automática venga desactivada por defecto.", "Es una de las medidas que el autor propone en el párrafo 5; no la cuestiona.", false], ["C", "afirmar que el diseño de las aplicaciones está hecho a propósito para prolongar el uso.", "Esa es una idea que el propio autor defiende en el párrafo 2; no la cuestiona.", false], ["D", "generalizar a partir de casos exitosos para concluir que cualquiera puede superar el problema con esfuerzo.", "El autor señala que los testimonios de quienes resistieron «alimentarán la idea de que basta con esforzarse» y advierte que esos casos pueden deberse a más tiempo o recursos: critica una generalización apresurada.", true]]}, {"id": "LCP-109", "niv": 1, "cp": "lc_local", "e": "Según el párrafo 2, muchas aplicaciones obtienen ingresos", "f": "Texto original elaborado para este simulacro, párrafo 2", "vis": "", "o": [["A", "cobrando a los usuarios una suscripción mensual.", "El párrafo dice lo contrario: «Buena parte de ellas no cobra al usuario».", false], ["B", "cobrándoles a terceros por la atención que los usuarios dedican a la aplicación.", "El párrafo 2 explica que muchas aplicaciones no cobran al usuario, sino que venden a los anunciantes el tiempo que el usuario pasa frente a la pantalla.", true], ["C", "vendiendo a otras empresas los diseños de sus herramientas de desplazamiento infinito y reproducción automática.", "El texto menciona esas herramientas y dice que los equipos de diseño son evaluados, pero no que los diseños se vendan a otras empresas.", false], ["D", "cobrando a los usuarios por desactivar las notificaciones.", "No se menciona ningún cobro por desactivar notificaciones; es una invención.", false]]}]}, {"comp": "lectura_critica", "sim": "pro-1", "ind": "Columna sobre la peatonalización de un centro histórico", "tt": "Texto informativo", "texto": "(1) Hace dos años, la alcaldía de una ciudad intermedia cerró al tráfico vehicular las seis calles que rodean su plaza fundacional. La medida se anunció con una fotografía de familias caminando bajo árboles recién sembrados y la frase «El centro vuelve a ser de la gente». Hoy, cualquiera que recorra esas calles un martes a las tres de la tarde encontrará árboles más altos y bastante menos gente.\n\n(2) No escribo esto para defender el regreso de los carros. Las ciudades que han peatonalizado sus centros con éxito muestran que el espacio ganado al automóvil puede convertirse en comercio, encuentro y vida cultural. El problema no fue la idea, sino la manera de ejecutarla.\n\n(3) La primera falla fue de cálculo. Los comerciantes del sector dependían en buena medida de clientes que llegaban en carro desde los barrios periféricos, donde el transporte público pasa cada cuarenta minutos. Al cerrar las calles sin mejorar antes esas rutas, la alcaldía no transformó la clientela: simplemente la alejó. Según la asociación de comerciantes, una de cada cuatro tiendas del perímetro ha cerrado desde entonces.\n\n(4) La segunda falla fue de conversación. Las reuniones con los vecinos se convocaron cuando el diseño ya estaba aprobado, de modo que sirvieron para informar y no para decidir. Los vendedores ambulantes, que llevaban décadas en la plaza, se enteraron por un volante de que serían reubicados en un pasaje cubierto, lejos del paso de los transeúntes.\n\n(5) Algunos funcionarios responden que todo cambio urbano genera resistencia al principio y que en unos años nadie querrá volver atrás. Puede ser. Pero esa promesa no le paga el arriendo a quien cerró su negocio en el intermedio, y convierte una decisión pública en un acto de fe.\n\n(6) Aún hay tiempo de corregir. Una ruta de bus que conecte los barrios con el centro, horarios razonables de cargue y descargue y una mesa permanente con comerciantes y vendedores podrían devolverle a la peatonalización el sentido que prometía la fotografía. La gente vuelve al centro cuando tiene cómo llegar y razones para quedarse.", "vis": "", "items": [{"id": "LCP-110", "niv": 2, "cp": "lc_global", "e": "¿Cuál es la postura del columnista frente a la peatonalización del centro?", "f": "Texto original elaborado para este simulacro, párrafo 2", "vis": "", "o": [["A", "La respalda y atribuye el cierre de las tiendas a que los comerciantes no supieron adaptarse a la nueva clientela.", "El autor atribuye los problemas a fallas de la alcaldía (de cálculo y de conversación), no a la falta de adaptación de los comerciantes.", false], ["B", "Considera que fracasó porque los peatones prefieren otros lugares de la ciudad para pasear y comprar.", "El texto atribuye la baja afluencia a la falta de transporte y de concertación, no a preferencias de los peatones.", false], ["C", "Apoya la peatonalización como idea, pero sostiene que falló su ejecución por errores de cálculo y de consulta.", "El párrafo 2 dice: «El problema no fue la idea, sino la manera de ejecutarla»; los párrafos 3 y 4 describen la falla de cálculo y la de conversación.", true], ["D", "Pide que las calles se abran de nuevo al tráfico vehicular para recuperar a los clientes.", "En el párrafo 2 el autor aclara: «No escribo esto para defender el regreso de los carros».", false]]}, {"id": "LCP-111", "niv": 1, "cp": "lc_local", "e": "Según el párrafo 3, los comerciantes perdieron clientela porque", "f": "Texto original elaborado para este simulacro, párrafo 3", "vis": "", "o": [["A", "se cerró el acceso en carro sin ofrecer antes otra forma de llegar a quienes vivían en barrios lejanos.", "El párrafo 3 explica que los clientes llegaban en carro desde barrios donde el bus pasa cada cuarenta minutos y que, al cerrar las calles sin mejorar antes esas rutas, la alcaldía «simplemente la alejó».", true], ["B", "los vendedores ambulantes ocuparon las calles peatonales y les quitaron buena parte de las ventas a los almacenes.", "Los vendedores ambulantes fueron reubicados lejos (párrafo 4); el texto no dice que ocuparan las calles.", false], ["C", "la alcaldía aumentó los impuestos de los locales ubicados alrededor de la plaza.", "El texto no menciona impuestos; es un dato inventado.", false], ["D", "los comerciantes subieron sus precios para compensar los costos de las obras de peatonalización.", "El texto no menciona alzas de precios ni costos de obras; atribuye la pérdida al cierre sin mejorar el transporte.", false]]}, {"id": "LCP-112", "niv": 3, "cp": "lc_reflexion", "e": "En el párrafo 5, el columnista afirma que la respuesta de los funcionarios «convierte una decisión pública en un acto de fe». Con esta expresión critica que", "f": "Texto original elaborado para este simulacro, párrafo 5", "vis": "", "o": [["A", "la alcaldía haya usado una fotografía de familias caminando bajo los árboles para anunciar la medida.", "La fotografía se menciona en otros párrafos; la expresión del párrafo 5 se refiere a la respuesta de los funcionarios.", false], ["B", "los comerciantes se opongan a cualquier cambio urbano por simple costumbre.", "El autor no critica a los comerciantes; la crítica va dirigida a la justificación oficial.", false], ["C", "los funcionarios mezclen creencias religiosas con la administración de la ciudad.", "Es una lectura literal; la expresión es figurada y no alude a la religión.", false], ["D", "se justifique la medida con beneficios futuros no demostrados, sin atender los costos presentes.", "Los funcionarios prometen que «en unos años nadie querrá volver atrás»; el autor señala que esa promesa pide creer sin pruebas y no responde a quienes ya perdieron su negocio.", true]]}, {"id": "LCP-113", "niv": 2, "cp": "lc_reflexion", "e": "Sobre el dato «una de cada cuatro tiendas del perímetro ha cerrado», un lector crítico debería tener en cuenta que", "f": "Texto original elaborado para este simulacro, párrafo 3", "vis": "", "o": [["A", "contradice la tesis del columnista, porque muestra que la medida fue un éxito.", "El dato respalda la crítica del columnista a la ejecución; no muestra éxito.", false], ["B", "proviene de una parte interesada, por lo que convendría contrastarlo con otras fuentes.", "El texto atribuye la cifra a la asociación de comerciantes, que tiene interés en el asunto; evaluar la fuente es parte de una lectura crítica.", true], ["C", "no tiene relación con el argumento del párrafo en el que aparece.", "El dato sirve precisamente para ilustrar la «falla de cálculo» del párrafo 3.", false], ["D", "prueba que la peatonalización fue la causa de los cierres, pues estos ocurrieron después de la medida.", "Que los cierres ocurrieran después de la medida no prueba que se debieran a ella; sería confundir sucesión con causalidad.", false]]}]}, {"comp": "lectura_critica", "sim": "pro-1", "ind": "Cómic sobre las reuniones de oficina", "tt": "Caricatura o cómic", "texto": "Cómic de cuatro viñetas.\n\nViñeta 1: Una oficina. El jefe, de pie frente a un tablero, habla a cinco empleados sentados: «Desde hoy, para ahorrar tiempo, ninguna reunión durará más de quince minutos». En la pared, un reloj marca las 9:00.\n\nViñeta 2: Los empleados aplauden, sonrientes. Uno de ellos le susurra a otro: «¡Por fin!».\n\nViñeta 3: El jefe continúa, señalando el tablero: «Por eso tendremos dieciséis reuniones al día». Las sonrisas de los empleados se congelan. El reloj marca las 9:14.\n\nViñeta 4: Es de noche. Los empleados duermen sobre sus escritorios, rodeados de agendas. En el tablero se lee: «Reunión n.º 16: ¿Por qué no avanzamos con el trabajo?». El reloj marca las 18:00.", "vis": "", "items": [{"id": "LCP-114", "niv": 1, "cp": "lc_local", "e": "Según las viñetas 1 y 3, la nueva medida del jefe consiste en", "f": "Texto original elaborado para este simulacro, viñetas 1 y 3", "vis": "", "o": [["A", "limitar cada reunión a quince minutos y hacer dieciséis al día.", "En la viñeta 1 fija la duración máxima en quince minutos y en la viñeta 3 anuncia dieciséis reuniones diarias.", true], ["B", "permitir que los empleados decidan cuándo reunirse y cuánto debe durar cada una de las reuniones.", "Nada en las viñetas indica que los empleados puedan decidir; la medida la impone el jefe.", false], ["C", "hacer una sola reunión diaria de quince minutos.", "Confunde la duración máxima con el número de reuniones: serán dieciséis, no una.", false], ["D", "eliminar todas las reuniones para ahorrar tiempo.", "El jefe no elimina las reuniones; anuncia dieciséis al día.", false]]}, {"id": "LCP-115", "niv": 2, "cp": "lc_global", "e": "El humor del cómic se basa principalmente en", "f": "Texto original elaborado para este simulacro, viñetas 1 a 4", "vis": "", "o": [["A", "el entusiasmo exagerado de los empleados ante cualquier anuncio.", "El entusiasmo de la viñeta 2 es un paso del chiste, pero el humor nace del contraste entre la intención y el resultado.", false], ["B", "la incapacidad del jefe para leer correctamente la hora en el reloj.", "El reloj sirve para mostrar el paso del tiempo, no un error de lectura del jefe.", false], ["C", "la desobediencia de los empleados, que se quedan dormidos sobre sus escritorios para no asistir a las reuniones.", "Los empleados no desobedecen: se duermen agotados al final de la jornada de reuniones.", false], ["D", "la contradicción entre el propósito de ahorrar tiempo y el resultado que produce la medida.", "La medida se anuncia «para ahorrar tiempo», pero dieciséis reuniones ocupan toda la jornada y en la viñeta 4 se preguntan por qué no avanzan: el efecto contradice el propósito.", true]]}]}, {"comp": "lectura_critica", "sim": "pro-1", "ind": "Texto expositivo sobre los hongos del suelo y la fertilidad", "tt": "Texto informativo", "texto": "(1) Durante buena parte del siglo XX, la agricultura trató el suelo como un soporte: un medio inerte que sostenía las raíces y al que había que añadir nutrientes en forma de fertilizantes. Esa imagen ha cambiado. Hoy se sabe que en una cucharadita de suelo fértil puede haber más microorganismos que personas en el planeta, entre bacterias, hongos y protozoos, y que buena parte de lo que una planta obtiene del suelo pasa antes por ellos.\n\n(2) Uno de los ejemplos más estudiados es el de los hongos micorrícicos. Sus filamentos, mucho más delgados que una raíz, se extienden por el suelo y alcanzan poros a los que la planta no podría llegar. Allí absorben agua y nutrientes como el fósforo, que entregan a la planta; a cambio, reciben azúcares que ella produce mediante la fotosíntesis. No se trata de un favor desinteresado, sino de un intercambio: cuando el suelo tiene fósforo en abundancia, muchas plantas se vuelven menos receptivas a sus socios.\n\n(3) Este hallazgo tiene consecuencias prácticas. Si los nutrientes se aplican en exceso, la planta deja de necesitar a los hongos y la red que ellos forman se debilita. Algo parecido ocurre con la labranza intensiva: al voltear la tierra una y otra vez, se rompen los filamentos y se expone la materia orgánica al aire, lo que acelera su descomposición. El resultado puede ser un suelo que rinde bien mientras recibe insumos, pero que depende cada vez más de ellos.\n\n(4) Nada de esto significa que los fertilizantes deban abandonarse. En suelos muy pobres, su aplicación puede ser la diferencia entre una cosecha y ninguna. Lo que cambia es la pregunta: ya no basta con calcular cuánto nitrógeno o fósforo le falta a un cultivo; también hay que preguntarse qué efecto tendrá esa aplicación sobre los organismos que hacen posible la fertilidad a largo plazo.\n\n(5) Algunas prácticas buscan responder a esa pregunta: mantener el suelo cubierto con plantas entre cosechas, reducir la labranza o rotar cultivos. Sus resultados varían según el clima y el tipo de suelo, y no todos los estudios coinciden en su magnitud. Pero todas parten de la misma idea: el suelo no es un recipiente, sino un ecosistema.", "vis": "", "items": [{"id": "LCP-116", "niv": 1, "cp": "lc_local", "e": "Según el párrafo 2, ¿qué reciben los hongos micorrícicos de la planta?", "f": "Texto original elaborado para este simulacro, párrafo 2", "vis": "", "o": [["A", "Agua y fósforo.", "Es al revés: los hongos absorben agua y fósforo del suelo y los entregan a la planta.", false], ["B", "Nitrógeno proveniente de los fertilizantes aplicados al cultivo.", "El texto no dice que la planta entregue nitrógeno a los hongos.", false], ["C", "Los azúcares que la planta fabrica gracias a la luz del sol.", "El párrafo 2 dice que los hongos «reciben azúcares que ella produce mediante la fotosíntesis», proceso por el cual la planta aprovecha la luz solar.", true], ["D", "Materia orgánica que se descompone al voltear la tierra.", "La descomposición de la materia orgánica se menciona en el párrafo 3 como efecto de la labranza, no como algo que la planta dé al hongo.", false]]}, {"id": "LCP-117", "niv": 2, "cp": "lc_global", "e": "¿Qué relación hay entre el párrafo 2 y el párrafo 3?", "f": "Texto original elaborado para este simulacro, párrafos 2 y 3", "vis": "", "o": [["A", "El párrafo 3 introduce un tema distinto que no se relaciona con el anterior.", "Hay una conexión explícita: «Este hallazgo» remite a lo expuesto en el párrafo 2.", false], ["B", "El párrafo 3 refuta la explicación del intercambio entre plantas y hongos que se da en el párrafo 2.", "El párrafo 3 no refuta nada: parte de esa explicación como válida («Este hallazgo tiene consecuencias prácticas»).", false], ["C", "El párrafo 3 extrae consecuencias prácticas del funcionamiento descrito en el párrafo 2.", "El párrafo 3 abre con «Este hallazgo tiene consecuencias prácticas» y explica cómo el exceso de nutrientes y la labranza afectan el intercambio descrito antes.", true], ["D", "El párrafo 3 repite con otras palabras la información del párrafo 2.", "El párrafo 3 aporta información nueva (efectos del exceso de nutrientes y de la labranza), no repite.", false]]}, {"id": "LCP-118", "niv": 3, "cp": "lc_reflexion", "e": "Tras leer el texto, un agricultor concluye: «Si los fertilizantes debilitan a los hongos, lo mejor es dejar de usarlos en cualquier tipo de suelo». De acuerdo con el texto, esta conclusión es", "f": "Texto original elaborado para este simulacro, párrafo 4", "vis": "", "o": [["A", "adecuada, porque en el párrafo 5 se propone reemplazar los fertilizantes por la rotación de cultivos y la cobertura del suelo.", "El párrafo 5 menciona la rotación como práctica complementaria, no como reemplazo de los fertilizantes.", false], ["B", "inadecuada, porque el autor reconoce que en suelos muy pobres los fertilizantes pueden ser decisivos para la cosecha.", "El párrafo 4 dice que, en suelos muy pobres, la aplicación de fertilizantes «puede ser la diferencia entre una cosecha y ninguna».", true], ["C", "adecuada, porque el párrafo 3 muestra que los fertilizantes debilitan la red de hongos que sostiene la fertilidad del suelo.", "El párrafo 3 se refiere a nutrientes aplicados «en exceso», y el párrafo 4 aclara que los fertilizantes no deben abandonarse; la conclusión del agricultor va más allá del texto.", false], ["D", "inadecuada, porque el texto sostiene que la labranza daña a los hongos más que los fertilizantes.", "El texto menciona ambos efectos («algo parecido ocurre con la labranza»), pero no compara cuál daña más.", false]]}, {"id": "LCP-119", "niv": 2, "cp": "lc_reflexion", "e": "En el párrafo 5, el autor señala que los resultados de esas prácticas «varían según el clima y el tipo de suelo, y no todos los estudios coinciden en su magnitud». Con esta precisión, el autor busca", "f": "Texto original elaborado para este simulacro, párrafo 5", "vis": "", "o": [["A", "matizar el alcance de las prácticas mencionadas, reconociendo que la evidencia no es uniforme.", "La frase no descarta las prácticas: advierte sus límites y la variación de los resultados, lo que da prudencia a la exposición.", true], ["B", "indicar en qué climas y tipos de suelo conviene aplicar cada una de las prácticas mencionadas.", "El texto solo reconoce que los resultados varían según el clima y el suelo; no especifica dónde conviene cada práctica.", false], ["C", "contradecir la idea, expuesta antes, de que el suelo es un ecosistema.", "Inmediatamente después el autor reafirma esa idea: «el suelo no es un recipiente, sino un ecosistema».", false], ["D", "desacreditar las prácticas mencionadas y recomendar a los agricultores que no las apliquen en sus cultivos.", "El autor presenta esas prácticas como respuestas razonables; solo advierte que sus efectos varían.", false]]}]}, {"comp": "lectura_critica", "sim": "pro-1", "ind": "Ensayo filosófico sobre por qué obligan las promesas", "tt": "Texto informativo", "texto": "(1) Prometer es una acción curiosa: con unas pocas palabras, alguien se obliga hoy a hacer algo en un futuro que todavía no conoce. Quien promete visitar a un amigo el sábado no sabe si ese día lloverá, si estará enfermo o si habrá cambiado de opinión. Y, sin embargo, en cuanto pronuncia la promesa, algo cambia en el mundo: el amigo adquiere un derecho a esperar la visita, y el que prometió, un deber que antes no tenía.\n\n(2) Una explicación frecuente sostiene que cumplimos las promesas porque nos conviene: quien incumple pierde la confianza de los demás, y sin confianza no hay cooperación posible. Esta explicación capta algo importante, pero deja un cabo suelto. Si el valor de la promesa dependiera solo de sus consecuencias, entonces romper una promesa en secreto, sin que nadie lo supiera nunca, no tendría nada de malo. Y la mayoría de las personas siente que sí lo tiene.\n\n(3) Otra explicación pone el acento en la persona a quien se promete. Al prometer, no solo anuncio lo que haré: le entrego al otro una parte de mi libertad futura. Él puede liberarme de mi palabra —«no te preocupes, no vengas»—, pero yo no puedo liberarme solo. Romper la promesa, aunque nadie se entere, es tratar como mío algo que ya había cedido.\n\n(4) Esta segunda explicación ayuda a entender por qué algunas promesas no obligan. Una promesa arrancada bajo amenaza no transfiere nada, porque no hubo una entrega libre. Tampoco obliga la promesa de hacer algo gravemente injusto: no puedo ceder a otro un derecho sobre una acción que yo mismo no tenía derecho a realizar.\n\n(5) Queda, con todo, una dificultad. Las circunstancias cambian, y a veces cumplir lo prometido causaría un daño que nadie previó. ¿Debe quien prometió llevar a un amigo al aeropuerto abandonar a un desconocido herido en la carretera? Casi nadie lo cree. Pero de ahí no se sigue que la promesa nunca haya existido; se sigue que hay deberes más urgentes que pueden prevalecer sobre ella, y que quien la rompe por esa razón todavía le debe al otro una explicación.", "vis": "", "items": [{"id": "LCP-120", "niv": 2, "cp": "lc_global", "e": "Según el autor, ¿cuál es la principal debilidad de la explicación presentada en el párrafo 2?", "f": "Texto original elaborado para este simulacro, párrafo 2", "vis": "", "o": [["A", "Supone que las promesas se cumplen por miedo a recibir un castigo de las autoridades.", "La explicación del párrafo 2 habla de conveniencia y de pérdida de confianza, no de castigos de las autoridades.", false], ["B", "Confunde las promesas entre amigos con los contratos comerciales que se firman ante un notario.", "El texto no menciona contratos ni notarios; la crítica se centra en las promesas rotas en secreto.", false], ["C", "Ignora que la confianza entre las personas es una condición necesaria para que exista la cooperación.", "La explicación del párrafo 2 sí incluye esa idea («sin confianza no hay cooperación posible») y el autor reconoce que capta algo importante.", false], ["D", "No explica por qué romper una promesa en secreto también parece incorrecto.", "El autor señala el «cabo suelto»: si solo importaran las consecuencias, romper una promesa sin que nadie lo sepa no sería malo, y la mayoría siente que sí lo es.", true]]}, {"id": "LCP-121", "niv": 1, "cp": "lc_local", "e": "De acuerdo con el párrafo 3, ¿quién puede liberar de su palabra a la persona que prometió algo?", "f": "Texto original elaborado para este simulacro, párrafo 3", "vis": "", "o": [["A", "Un testigo que haya presenciado el momento en que se hizo la promesa.", "El texto no menciona testigos ni les atribuye ese poder.", false], ["B", "La misma persona que prometió, si cambia de opinión.", "El párrafo 3 dice lo contrario: «yo no puedo liberarme solo».", false], ["C", "Nadie distinto de quien prometió, porque la promesa es un compromiso consigo mismo.", "El párrafo 3 dice lo contrario: quien prometió no puede liberarse solo; es el otro quien puede liberarlo, porque la promesa le entrega a él una parte de la libertad futura.", false], ["D", "La persona a quien se le hizo la promesa.", "El párrafo 3 afirma: «Él puede liberarme de mi palabra —“no te preocupes, no vengas”—»; «él» es quien recibió la promesa.", true]]}, {"id": "LCP-122", "niv": 3, "cp": "lc_reflexion", "e": "Según la segunda explicación (párrafos 3 y 4), ¿en cuál de los siguientes casos la promesa NO genera obligación?", "f": "Texto original elaborado para este simulacro, párrafos 3 y 4", "vis": "", "o": [["A", "Pedro prometió visitar a su abuela el domingo, pero ese día prefiere ir al cine con unos compañeros.", "Cambiar de preferencia no anula la promesa: según el párrafo 3, quien prometió no puede liberarse solo.", false], ["B", "Laura prometió prestarle sus apuntes a un compañero solo porque él la amenazó con divulgar un secreto.", "El párrafo 4 dice que «una promesa arrancada bajo amenaza no transfiere nada, porque no hubo una entrega libre».", true], ["C", "Luis prometió ayudar en una mudanza sin saber que ese día iba a llover toda la tarde.", "El párrafo 1 presenta la incertidumbre sobre el futuro como algo propio de toda promesa; la lluvia no la anula.", false], ["D", "Ana prometió pagar una deuda a un amigo y sabe que nadie más se enteraría si no lo hiciera.", "Que nadie se entere no anula la obligación; el texto sostiene que romper una promesa en secreto sigue siendo incorrecto.", false]]}, {"id": "LCP-123", "niv": 3, "cp": "lc_global", "e": "¿Qué conclusión se desprende del párrafo 5?", "f": "Texto original elaborado para este simulacro, párrafo 5", "vis": "", "o": [["A", "Cuando cumplir una promesa causaría un daño imprevisto, se entiende que esa promesa nunca llegó a obligar.", "El autor dice expresamente que «de ahí no se sigue que la promesa nunca haya existido»: la promesa existía, pero cede ante un deber más urgente.", false], ["B", "Las promesas dejan de existir cuando las circunstancias cambian.", "El autor afirma que «de ahí no se sigue que la promesa nunca haya existido».", false], ["C", "Cuando otro deber más apremiante obliga a incumplir, la promesa sigue pesando: quien la rompe debe dar cuentas.", "El párrafo 5 concluye que otros deberes pueden prevalecer, pero «quien la rompe por esa razón todavía le debe al otro una explicación».", true], ["D", "Romper una promesa es inaceptable, aunque para cumplirla haya que abandonar a un desconocido herido en la carretera.", "El autor dice que casi nadie cree que deba abandonarse al herido y que hay deberes más urgentes.", false]]}]}, {"comp": "lectura_critica", "sim": "pro-1", "ind": "Crónica sobre una biblioteca rural que viaja en moto", "tt": "Texto informativo", "texto": "(1) A las seis de la mañana, Rosalba Quintero ya ha amarrado dos cajas plásticas a la parrilla de la moto. Una lleva libros de cuentos, manuales de cultivo y tres novelas que alguien pidió la semana anterior; la otra, una carpa, una lona y un termo con café. En la vereda donde ella trabaja, la biblioteca no es un edificio: es un recorrido de cuarenta kilómetros por caminos destapados que se hace dos veces por semana, si la lluvia lo permite.\n\n(2) El proyecto empezó hace nueve años con una donación de doscientos libros que nadie sabía dónde poner. La escuela no tenía espacio; la junta de acción comunal, tampoco. Rosalba, que entonces era auxiliar de enfermería, propuso llevarlos casa por casa. «Pensé que iba a durar un mes», dice. Hoy el catálogo supera los tres mil títulos y la lista de préstamos se lleva en un cuaderno de tapas verdes que ella cuida como si fuera un documento notarial.\n\n(3) Lo que más sorprende no es la cantidad de libros, sino lo que la gente hace con ellos. Don Efraín, de setenta y dos años, aprendió a leer con cartillas que le dejaba Rosalba y ahora pide libros sobre la historia de la Independencia. Una madre cabeza de familia usó un manual de apicultura para montar las colmenas que hoy le dan una parte de su ingreso. Los niños, en cambio, prefieren los cómics, y Rosalba no se los niega: «Primero que lean lo que les gusta; lo demás llega después».\n\n(4) No todo funciona. Hay libros que regresan mojados, otros que no regresan y meses enteros en que la vía se cierra por derrumbes. La alcaldía ha prometido dos veces un vehículo y una bodega; ninguna de las dos promesas se ha cumplido. Rosalba no lo dice con rabia, sino con la paciencia de quien aprendió a no esperar demasiado de los anuncios.\n\n(5) Antes de seguir su ruta, abre la carpa al borde del camino, extiende la lona y acomoda los libros por colores. En diez minutos hay una fila de cuatro personas. Una niña pregunta si llegó «el del dragón». Rosalba busca en la caja, lo encuentra y se lo entrega con la advertencia que repite a todos: «Me lo devuelve entero, que hay otros esperando».", "vis": "", "items": [{"id": "LCP-124", "niv": 1, "cp": "lc_local", "e": "Según la crónica, el proyecto de la biblioteca comenzó", "f": "Texto original elaborado para este simulacro, párrafo 2", "vis": "", "o": [["A", "con una donación de libros que no tenía dónde guardarse.", "El párrafo 2 dice: «El proyecto empezó hace nueve años con una donación de doscientos libros que nadie sabía dónde poner».", true], ["B", "por iniciativa de la alcaldía, que entregó una moto para repartir los libros.", "La alcaldía ha prometido un vehículo y una bodega, pero no ha cumplido (párrafo 4); no inició el proyecto.", false], ["C", "cuando la escuela de la vereda abrió una sala de lectura.", "El párrafo 2 dice que la escuela no tenía espacio para los libros.", false], ["D", "con los libros que Rosalba había reunido durante sus años como auxiliar de enfermería.", "El texto menciona su antiguo oficio, pero no dice que los libros fueran suyos: provenían de una donación.", false]]}, {"id": "LCP-125", "niv": 2, "cp": "lc_global", "e": "En la crónica, las historias de don Efraín, de la madre cabeza de familia y de los niños (párrafo 3) sirven para", "f": "Texto original elaborado para este simulacro, párrafo 3", "vis": "", "o": [["A", "criticar que los niños prefieran los cómics a los libros sobre la historia de la Independencia.", "Ni la cronista ni Rosalba critican esa preferencia; Rosalba la respeta.", false], ["B", "explicar cómo se organiza el catálogo en el cuaderno de tapas verdes.", "El cuaderno se menciona en el párrafo 2 y no se explica cómo se organiza el catálogo.", false], ["C", "mostrar los distintos usos y efectos que tienen los libros en la vida de los lectores.", "El párrafo 3 abre con «Lo que más sorprende no es la cantidad de libros, sino lo que la gente hace con ellos» y presenta tres casos distintos: alfabetización, ingreso económico y gusto lector.", true], ["D", "demostrar que los adultos de la vereda leen más que los niños y aprovechan mejor los libros.", "El texto no compara cuánto leen unos y otros; muestra usos diferentes.", false]]}, {"id": "LCP-126", "niv": 2, "cp": "lc_reflexion", "e": "¿Con cuál de los siguientes enunciados de una pedagoga ficticia coincide la frase de Rosalba «Primero que lean lo que les gusta; lo demás llega después»?", "f": "Texto original elaborado para este simulacro, párrafo 3", "vis": "", "o": [["A", "«La lectura obligatoria y evaluada es la manera más eficaz de formar lectores».", "Rosalba no obliga ni evalúa; deja que los niños elijan lo que les gusta.", false], ["B", "«El gusto por leer nace de experiencias placenteras, que luego abren paso a lecturas más exigentes».", "Ambas ideas coinciden: primero el placer de leer lo que gusta, y después («lo demás llega después») otras lecturas.", true], ["C", "«Los niños deben empezar por las obras clásicas, aunque al principio no les gusten».", "Es la postura opuesta: Rosalba empieza por los gustos de los niños, no por obras impuestas.", false], ["D", "«En las escuelas rurales, los cómics deberían reemplazar a los libros de texto».", "Rosalba no propone reemplazar los libros: parte de lo que gusta a los niños para que luego lleguen otras lecturas.", false]]}, {"id": "LCP-127", "niv": 3, "cp": "lc_reflexion", "e": "La crónica termina con la escena de la carpa al borde del camino y la advertencia de Rosalba a la niña. Con este cierre, el autor", "f": "Texto original elaborado para este simulacro, párrafo 5", "vis": "", "o": [["A", "muestra la biblioteca en funcionamiento a través de una escena concreta, en vez de una conclusión explícita.", "Es un recurso propio de la crónica: el texto termina narrando una escena (la fila, el libro «del dragón», la advertencia) que deja ver el sentido del proyecto sin enunciarlo.", true], ["B", "resume en una frase final los datos sobre el número de libros y préstamos de la biblioteca.", "El cierre no presenta datos ni cifras; las cifras aparecen en el párrafo 2.", false], ["C", "formula una denuncia explícita contra la alcaldía por no haber entregado el vehículo prometido.", "La alcaldía se menciona en el párrafo 4 y sin denuncia explícita; el cierre no se refiere a ella.", false], ["D", "introduce un personaje nuevo, la niña, que será el centro de una segunda parte de la historia.", "La niña aparece solo como parte de la escena final; nada anuncia una continuación.", false]]}]}, {"comp": "lectura_critica", "sim": "pro-1", "ind": "Texto argumentativo sobre los programas que seleccionan personal", "tt": "Texto informativo", "texto": "(1) Cada vez más empresas utilizan programas informáticos para filtrar hojas de vida. El argumento a su favor parece sólido: un programa no se cansa, no tiene simpatías personales y aplica los mismos criterios a todos los aspirantes. Si los seres humanos discriminan por el apellido, el barrio o el acento, una máquina que solo mira datos debería ser más justa.\n\n(2) El problema es que los programas de selección no se inventan sus criterios: los aprenden. Para decidir qué perfil tiene más probabilidades de éxito, se los entrena con información sobre las contrataciones pasadas de la empresa. Si durante veinte años la empresa contrató sobre todo a egresados de tres universidades, el programa aprenderá que haber estudiado en una de ellas es señal de buen desempeño, aunque nadie le haya dado esa instrucción. La máquina no corrige los sesgos del pasado; los convierte en regla.\n\n(3) Peor aún, el sesgo se vuelve más difícil de detectar. Cuando un jefe de personal rechaza a alguien por prejuicio, el aspirante puede reclamar, y el jefe tiene que dar razones. Cuando un programa asigna un puntaje bajo, la decisión aparece envuelta en la autoridad de las cifras. Pocos se atreven a discutir un número, y muchas veces ni siquiera la empresa sabe explicar cómo se llegó a él.\n\n(4) Esto no significa que la selección automatizada deba prohibirse. Significa que la neutralidad no es una propiedad de la tecnología, sino un resultado que hay que verificar. Una empresa que usa estos sistemas debería poder demostrar, con pruebas periódicas, que sus resultados no perjudican de manera sistemática a ciertos grupos, y los aspirantes deberían tener derecho a que una persona revise su caso.\n\n(5) Hay quien objeta que esas exigencias encarecerían los procesos y desestimularían la innovación. Es posible. Pero el mismo razonamiento podría usarse contra cualquier norma de seguridad: los frenos también encarecen los carros. La pregunta no es si la verificación cuesta, sino quién paga cuando no se hace.", "vis": "", "items": [{"id": "LCP-128", "niv": 2, "cp": "lc_global", "e": "¿Cuál es la idea central del texto?", "f": "Texto original elaborado para este simulacro, párrafos 2 y 4", "vis": "", "o": [["A", "Las empresas deberían contratar a egresados de distintas universidades para mejorar su desempeño.", "Las universidades aparecen como ejemplo de sesgo aprendido, no como recomendación de contratación.", false], ["B", "Los programas de selección deben prohibirse, porque discriminan más que los jefes de personal.", "El párrafo 4 dice: «Esto no significa que la selección automatizada deba prohibirse».", false], ["C", "Los programas de selección son más justos que las personas, porque aplican los mismos criterios a todos los aspirantes.", "Es el argumento a favor presentado en el párrafo 1, que el autor cuestiona a continuación.", false], ["D", "Los programas de selección pueden reproducir sesgos del pasado; por eso su neutralidad debe verificarse.", "El texto explica que los programas aprenden de contrataciones pasadas (párrafo 2) y concluye que la neutralidad «es un resultado que hay que verificar» (párrafo 4).", true]]}, {"id": "LCP-129", "niv": 1, "cp": "lc_local", "e": "Según el párrafo 2, los programas de selección aprenden sus criterios a partir de", "f": "Texto original elaborado para este simulacro, párrafo 2", "vis": "", "o": [["A", "las normas que fija el Estado para garantizar la igualdad en el empleo.", "El texto no menciona normas estatales como fuente de los criterios.", false], ["B", "el registro de las personas que la misma empresa ha contratado antes.", "El párrafo 2 dice que los programas se entrenan «con información sobre las contrataciones pasadas de la empresa».", true], ["C", "instrucciones explícitas que les dan los jefes de personal de cada empresa.", "El párrafo 2 aclara que el programa aprende «aunque nadie le haya dado esa instrucción».", false], ["D", "las preferencias que los aspirantes declaran en sus hojas de vida al postularse.", "El texto no menciona que los criterios salgan de lo que declaran los aspirantes.", false]]}, {"id": "LCP-130", "niv": 3, "cp": "lc_global", "e": "¿Qué función cumple el párrafo 1 en el texto?", "f": "Texto original elaborado para este simulacro, párrafos 1 y 2", "vis": "", "o": [["A", "Describe los resultados de un estudio sobre discriminación por apellido, barrio o acento en las empresas.", "El párrafo 1 no reporta ningún estudio; menciona esas formas de discriminación como premisa del argumento a favor.", false], ["B", "Presenta la tesis que el autor defiende a lo largo de todo el texto.", "El autor no defiende esa postura; la presenta para luego mostrar sus problemas.", false], ["C", "Expone una postura favorable a la selección automatizada que el autor cuestiona después.", "El párrafo 1 presenta «el argumento a su favor», y el párrafo 2 empieza con «El problema es que…», lo que muestra que el autor lo discute.", true], ["D", "Propone medidas concretas para regular el uso de los programas de selección.", "Las medidas aparecen en el párrafo 4.", false]]}, {"id": "LCP-131", "niv": 3, "cp": "lc_reflexion", "e": "En el párrafo 5, el autor responde a una objeción con la frase «los frenos también encarecen los carros». Con esta comparación busca", "f": "Texto original elaborado para este simulacro, párrafo 5", "vis": "", "o": [["A", "mostrar que un costo adicional no basta para rechazar una medida que protege a otros.", "Así como nadie rechaza los frenos por encarecer los carros, el sobrecosto de verificar no justifica dejar sin protección a los aspirantes; por eso cierra con «quién paga cuando no se hace».", true], ["B", "señalar que las normas de seguridad han frenado la innovación en la industria automotriz y en otras industrias.", "El texto no afirma que las normas de seguridad hayan frenado la innovación; es una lectura errónea de la analogía.", false], ["C", "reconocer que la objeción es correcta y que, por tanto, conviene abandonar la verificación.", "El autor admite que la verificación cuesta («Es posible»), pero no abandona su propuesta: la defiende con la analogía.", false], ["D", "demostrar que los programas de selección son tan peligrosos como los carros sin frenos.", "La comparación no iguala el grado de peligro; se refiere a la relación entre costo y protección.", false]]}, {"id": "LCP-132", "niv": 2, "cp": "lc_reflexion", "e": "Cuando el autor afirma en el párrafo 3 que «pocos se atreven a discutir un número», supone que", "f": "Texto original elaborado para este simulacro, párrafo 3", "vis": "", "o": [["A", "los puntajes de los programas son menos precisos que las evaluaciones hechas por personas.", "El autor no compara la precisión de unos y otros; su punto es que las cifras parecen tener una autoridad que desanima a discutirlas.", false], ["B", "los aspirantes rechazados por un programa no tienen derecho legal a reclamar.", "El texto no habla de derechos legales vigentes; propone que los aspirantes tengan derecho a revisión humana. La frase citada se refiere a la autoridad que se atribuye a los números.", false], ["C", "la mayoría de los aspirantes no entiende las operaciones matemáticas con las que trabajan los programas.", "El texto no se refiere a la capacidad matemática de los aspirantes, sino a la autoridad que se atribuye a los números.", false], ["D", "las cifras suelen percibirse como objetivas, aunque provengan de criterios discutibles.", "El autor habla de «la autoridad de las cifras»: da por sentado que un puntaje parece objetivo y por eso se discute menos que la decisión de una persona.", true]]}]}, {"comp": "lectura_critica", "sim": "pro-1", "ind": "Reglamento de préstamo de bicicletas en una universidad", "tt": "Texto discontinuo", "texto": "PROGRAMA BICI-CAMPUS · Universidad del Valle Alto (institución ficticia)\n\nReglamento de préstamo de bicicletas para la comunidad universitaria.\n\nRequisitos: carné vigente y registro previo en la plataforma del programa.\n\nEl préstamo se solicita en cualquiera de las tres estaciones del campus, y la bicicleta puede devolverse en cualquiera de ellas.\n\nImportante: el tiempo de préstamo se cuenta desde que se retira la bicicleta hasta que se registra su devolución. Se considera retraso devolver la bicicleta después del tiempo máximo de préstamo. Las sanciones por retraso se acumulan durante el semestre académico; al tercer retraso en un mismo semestre, el usuario pierde el servicio hasta que termine ese semestre.", "vis": "<table class=\"vt\"><caption>Tabla 1. Condiciones de préstamo por tipo de usuario<\/caption><thead><tr><th>Tipo de usuario<\/th><th>Tiempo máximo por préstamo<\/th><th>Préstamos por día<\/th><th>Sanción por cada retraso<\/th><\/tr><\/thead><tbody><tr><td>Estudiante de pregrado<\/td><td>2 horas<\/td><td>3<\/td><td>Suspensión de 3 días<\/td><\/tr><tr><td>Estudiante de posgrado<\/td><td>3 horas<\/td><td>3<\/td><td>Suspensión de 3 días<\/td><\/tr><tr><td>Docente o funcionario<\/td><td>4 horas<\/td><td>2<\/td><td>Suspensión de 5 días<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Datos ficticios elaborados para este simulacro.<\/div>", "items": [{"id": "LCP-133", "niv": 1, "cp": "lc_local", "e": "Un docente quiere usar una bicicleta durante 3 horas en la mañana y otras 3 horas en la tarde del mismo día. Según la tabla, ¿puede hacerlo?", "f": "Texto original elaborado para este simulacro, tabla 1", "vis": "", "o": [["A", "No, porque el tiempo máximo por préstamo para los docentes es de 2 horas.", "Las 2 horas corresponden a estudiantes de pregrado; para docentes el máximo es de 4 horas.", false], ["B", "Sí, porque los docentes tienen dos préstamos diarios de máximo 4 horas cada uno.", "La fila de docentes indica 4 horas por préstamo y 2 préstamos por día; dos préstamos de 3 horas cumplen ambas condiciones.", true], ["C", "No, porque los docentes o funcionarios tienen derecho a un único préstamo diario.", "La tabla indica 2 préstamos por día para docentes o funcionarios.", false], ["D", "Sí, porque los docentes o funcionarios no tienen límite de préstamos diarios.", "Sí tienen límite: 2 préstamos por día; la respuesta es afirmativa, pero por otra razón.", false]]}, {"id": "LCP-134", "niv": 2, "cp": "lc_global", "e": "Una estudiante de pregrado, que no tenía retrasos en el semestre, retiró una bicicleta a las 10:00 y registró su devolución a las 12:30 en otra estación. Según el reglamento, la estudiante", "f": "Texto original elaborado para este simulacro, texto del reglamento y tabla 1", "vis": "", "o": [["A", "recibe una suspensión de 5 días, porque devolvió la bicicleta en una estación diferente de aquella en la que la retiró.", "La suspensión de 5 días corresponde a docentes y funcionarios; además, devolver en otra estación está permitido.", false], ["B", "no recibe sanción, porque devolvió la bicicleta en una de las estaciones autorizadas.", "Devolver en otra estación está permitido, pero no la exime del límite de tiempo: usó 2,5 horas y el máximo es 2.", false], ["C", "pierde el servicio hasta que termine el semestre académico.", "La pérdida del servicio ocurre al tercer retraso; este es el primero.", false], ["D", "recibe una suspensión de 3 días, porque superó el tiempo máximo de su préstamo.", "Del retiro (10:00) a la devolución (12:30) pasan 2 horas y 30 minutos; el máximo para pregrado es 2 horas y la sanción por cada retraso es de 3 días.", true]]}, {"id": "LCP-135", "niv": 2, "cp": "lc_reflexion", "e": "¿Cuál es el propósito más probable de establecer que las sanciones se acumulan y que al tercer retraso se pierde el servicio?", "f": "Texto original elaborado para este simulacro, texto del reglamento", "vis": "", "o": [["A", "Obligar a los usuarios a devolver la bicicleta en la misma estación.", "El reglamento permite devolverla en cualquiera de las tres estaciones.", false], ["B", "Impedir que los docentes y funcionarios usen el servicio con la misma frecuencia que los estudiantes.", "La regla de acumulación se aplica a todos los usuarios; no está dirigida contra un grupo.", false], ["C", "Desestimular los retrasos repetidos, para que las bicicletas estén disponibles para más usuarios.", "Las sanciones crecientes castigan la reincidencia; como el servicio es compartido, su efecto esperable es que las bicicletas se devuelvan a tiempo y circulen entre más personas.", true], ["D", "Aumentar los ingresos del programa mediante el cobro de multas a los usuarios que se retrasan.", "El reglamento no establece multas en dinero; las sanciones son suspensiones.", false]]}]}, {"comp": "razonamiento_cuantitativo", "sim": "pro-1", "ind": "Material reciclable recogido por una junta de acción comunal", "tt": "", "texto": "La junta de acción comunal del barrio Los Almendros registra cada mes la cantidad de material reciclable, en kilogramos (kg), que recoge en su punto de acopio. La tabla muestra los datos del primer semestre del año.", "vis": "<table class=\"vt\"><caption>Tabla 1. Material reciclable recogido, enero a junio<\/caption><thead><tr><th>Mes<\/th><th>Material recogido (kg)<\/th><\/tr><\/thead><tbody><tr><td>Enero<\/td><td>420<\/td><\/tr><tr><td>Febrero<\/td><td>380<\/td><\/tr><tr><td>Marzo<\/td><td>510<\/td><\/tr><tr><td>Abril<\/td><td>460<\/td><\/tr><tr><td>Mayo<\/td><td>390<\/td><\/tr><tr><td>Junio<\/td><td>540<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Fuente: datos ficticios.<\/div>", "items": [{"id": "RCP-101", "niv": 1, "cp": "rc_interpretacion", "e": "¿Entre qué par de meses consecutivos se presentó el mayor aumento en la cantidad de material recogido?", "f": "Lectura de la tabla del caso.", "vis": "", "o": [["A", "Entre mayo y junio.", "De mayo (390 kg) a junio (540 kg) el aumento fue de 150 kg, el mayor entre meses consecutivos.", true], ["B", "Entre enero y febrero.", "De enero a febrero la cantidad pasó de 420 a 380 kg: disminuyó.", false], ["C", "Entre abril y mayo.", "De abril a mayo la cantidad pasó de 460 a 390 kg: disminuyó 70 kg.", false], ["D", "Entre febrero y marzo.", "De febrero a marzo hubo un aumento de 130 kg (de 380 a 510), menor que el de mayo a junio.", false]]}, {"id": "RCP-102", "niv": 2, "cp": "rc_formulacion", "e": "La junta quiere que, al incluir el mes de julio, el promedio mensual de los siete meses sea de 470 kg. ¿Cuántos kilogramos debe recoger en julio?", "f": "Cálculo propio a partir de los datos del caso.", "vis": "", "o": [["A", "120 kg.", "Resulta de 470 × 6 − 2.700: multiplica por 6 meses en lugar de 7, como si julio no contara en el nuevo promedio.", false], ["B", "470 kg.", "Recoger 470 kg en julio no basta: los seis meses anteriores promedian 450 kg, por debajo de la meta, y el promedio de los siete quedaría en unos 452,9 kg.", false], ["C", "490 kg.", "Suma a 470 kg la diferencia entre la meta y el promedio actual (20 kg), pero no compensa que cada uno de los seis meses anteriores está 20 kg por debajo de la meta.", false], ["D", "590 kg.", "Los siete meses deben sumar 470 × 7 = 3.290 kg; los seis primeros suman 2.700 kg, así que julio debe aportar 3.290 − 2.700 = 590 kg.", true]]}, {"id": "RCP-103", "niv": 2, "cp": "rc_argumentacion", "e": "Un integrante de la junta afirma que la mediana de los datos del semestre es 460 kg y explica: «Ordené los seis datos de menor a mayor y tomé el cuarto valor». ¿Es correcto su procedimiento?", "f": "Cálculo propio a partir de los datos del caso.", "vis": "", "o": [["A", "Sí, porque al ordenar los datos el cuarto valor deja tres datos por debajo de él.", "460 kg deja tres datos por debajo, pero solo dos por encima (510 y 540): no divide los datos en dos mitades iguales.", false], ["B", "No, porque con seis datos la mediana es el promedio de los dos valores centrales, 420 y 460: 440 kg.", "Ordenados, los datos son 380, 390, 420, 460, 510 y 540. Con una cantidad par de datos, la mediana es el promedio de los dos centrales: 440 kg.", true], ["C", "No, porque la mediana se obtiene sin ordenar los datos, tomando el valor que está en el centro de la tabla.", "La mediana exige ordenar los datos de menor a mayor; el orden cronológico de la tabla no sirve para calcularla.", false], ["D", "Sí, porque la mediana siempre es uno de los datos registrados.", "Con una cantidad par de datos la mediana es el promedio de los dos centrales y puede no coincidir con ningún dato; aquí es 440 kg, que no aparece en la tabla.", false]]}]}, {"comp": "razonamiento_cuantitativo", "sim": "pro-1", "ind": "Consumo de energía de un hogar", "tt": "", "texto": "La familia Rojas revisa el consumo de energía eléctrica de su casa. La gráfica muestra el consumo de los últimos cuatro meses, en kilovatios hora (kWh). El valor de cada kWh es de $ 850.", "vis": "<div class=\"vfig\"><svg class=\"vg\" viewBox=\"0 0 560 320\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Gráfica 1. Consumo mensual de energía\" font-family=\"Arial, sans-serif\" font-size=\"12\"><rect width=\"560\" height=\"320\" fill=\"#ffffff\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"13\" fill=\"#1d2433\">Gráfica 1. Consumo mensual de energía<\/text><line x1=\"60\" y1=\"258.0\" x2=\"540\" y2=\"258.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"262.0\" text-anchor=\"end\" fill=\"#3a4356\">0<\/text><line x1=\"60\" y1=\"202.5\" x2=\"540\" y2=\"202.5\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"206.5\" text-anchor=\"end\" fill=\"#3a4356\">50<\/text><line x1=\"60\" y1=\"147.0\" x2=\"540\" y2=\"147.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"151.0\" text-anchor=\"end\" fill=\"#3a4356\">100<\/text><line x1=\"60\" y1=\"91.5\" x2=\"540\" y2=\"91.5\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"95.5\" text-anchor=\"end\" fill=\"#3a4356\">150<\/text><line x1=\"60\" y1=\"36.0\" x2=\"540\" y2=\"36.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"40.0\" text-anchor=\"end\" fill=\"#3a4356\">200<\/text><line x1=\"60\" y1=\"258\" x2=\"540\" y2=\"258\" stroke=\"#3a4356\"/><line x1=\"60\" y1=\"258\" x2=\"60\" y2=\"36\" stroke=\"#3a4356\"/><text transform=\"translate(14,147.0) rotate(-90)\" text-anchor=\"middle\" fill=\"#3a4356\">Consumo (kWh)<\/text><text x=\"300.0\" y=\"312\" text-anchor=\"middle\" fill=\"#3a4356\">Mes<\/text><text x=\"120.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Julio<\/text><text x=\"240.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Agosto<\/text><text x=\"360.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Septiembre<\/text><text x=\"480.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Octubre<\/text><rect x=\"78.0\" y=\"91.5\" width=\"84.0\" height=\"166.5\" fill=\"#1660a8\"/><text x=\"120.0\" y=\"87.5\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">150<\/text><rect x=\"198.0\" y=\"74.8\" width=\"84.0\" height=\"183.2\" fill=\"#1660a8\"/><text x=\"240.0\" y=\"70.8\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">165<\/text><rect x=\"318.0\" y=\"58.2\" width=\"84.0\" height=\"199.8\" fill=\"#1660a8\"/><text x=\"360.0\" y=\"54.2\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">180<\/text><rect x=\"438.0\" y=\"98.2\" width=\"84.0\" height=\"159.8\" fill=\"#1660a8\"/><text x=\"480.0\" y=\"94.2\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">144<\/text><\/svg><\/div>", "items": [{"id": "RCP-104", "niv": 1, "cp": "rc_interpretacion", "e": "¿En qué porcentaje disminuyó el consumo de septiembre a octubre?", "f": "Lectura de la gráfica y cálculo propio.", "vis": "", "o": [["A", "20 %", "El consumo bajó 180 − 144 = 36 kWh, y 36 ÷ 180 = 0,20; el porcentaje se calcula respecto al valor inicial (septiembre).", true], ["B", "25 %", "Resulta de dividir 36 entre 144, el valor final; la variación porcentual se calcula respecto al valor inicial, 180 kWh.", false], ["C", "36 %", "Toma la diferencia de 36 kWh como si fuera un porcentaje, sin dividirla entre el consumo inicial.", false], ["D", "80 %", "144 ÷ 180 = 0,8 indica que en octubre se consumió el 80 % de lo de septiembre; la disminución es el 20 % restante.", false]]}, {"id": "RCP-105", "niv": 2, "cp": "rc_formulacion", "e": "Para noviembre, la familia se propone consumir 10 % menos energía que en octubre, y el valor del kWh no cambiará. Si lo logra, ¿cuánto pagará por la energía consumida en noviembre?", "f": "Cálculo propio a partir de los datos del caso.", "vis": "", "o": [["A", "$ 99.144", "Además de reducir el consumo en 10 %, rebaja también el precio del kWh en 10 % (129,6 × 765), pero el precio no cambia.", false], ["B", "$ 110.160", "El consumo sería 144 × 0,9 = 129,6 kWh, y 129,6 × 850 = $ 110.160.", true], ["C", "$ 113.900", "Resta 10 kWh (134 × 850) en lugar del 10 % del consumo.", false], ["D", "$ 122.400", "Es el valor del consumo de octubre (144 × 850), sin aplicar la reducción.", false]]}, {"id": "RCP-106", "niv": 2, "cp": "rc_argumentacion", "e": "La madre afirma: «En estos cuatro meses consumimos, en promedio, más de 160 kWh al mes». ¿Es correcta su afirmación?", "f": "Cálculo propio a partir de los datos del caso.", "vis": "", "o": [["A", "Sí, porque dos de los cuatro meses superan los 160 kWh.", "Que la mitad de los meses supere 160 kWh no garantiza que el promedio lo supere: julio y octubre están bastante por debajo.", false], ["B", "No, porque octubre fue el mes de menor consumo.", "El dato es cierto, pero no demuestra nada sobre el promedio; hay que sumar los cuatro consumos y dividir entre 4.", false], ["C", "No, porque el promedio de los cuatro meses es 159,75 kWh.", "La suma de los cuatro consumos es 639 kWh y 639 ÷ 4 = 159,75 kWh, un poco menos de 160 kWh.", true], ["D", "Sí, porque el promedio entre el mayor y el menor consumo es (180 + 144) ÷ 2 = 162 kWh.", "Promediar solo el valor máximo y el mínimo no da el promedio de los cuatro datos; deben sumarse los cuatro.", false]]}]}, {"comp": "razonamiento_cuantitativo", "sim": "pro-1", "ind": "Cambio del piso de una habitación", "tt": "", "texto": "Diana va a cambiar el piso de una habitación rectangular de 4 m de largo y 3,5 m de ancho. Usará baldosas cuadradas de 50 cm de lado y pondrá guardaescoba (un listón que se fija en la parte baja de las paredes) en todo el borde de la habitación, excepto en el espacio de la puerta, que mide 0,9 m de ancho. La figura muestra el plano de la habitación (no está a escala).", "vis": "<div class=\"vfig\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 260\" font-family=\"Arial\" font-size=\"14\"><rect width=\"360\" height=\"260\" fill=\"#ffffff\"/><polyline points=\"70,40 70,215 310,215 310,40 160,40\" fill=\"none\" stroke=\"#1d2433\" stroke-width=\"3\"/><line x1=\"106\" y1=\"40\" x2=\"70\" y2=\"40\" stroke=\"#1d2433\" stroke-width=\"3\"/><path d=\"M106,40 A54,54 0 0,1 160,94\" fill=\"none\" stroke=\"#1d2433\" stroke-width=\"1\" stroke-dasharray=\"4 3\"/><text x=\"133\" y=\"30\" text-anchor=\"middle\" fill=\"#1d2433\">puerta 0,9 m<\/text><text x=\"190\" y=\"240\" text-anchor=\"middle\" fill=\"#1d2433\">4 m<\/text><text x=\"318\" y=\"132\" fill=\"#1d2433\">3,5 m<\/text><\/svg><\/div>", "items": [{"id": "RCP-107", "niv": 1, "cp": "rc_formulacion", "e": "Si las baldosas se colocan sin cortes ni desperdicio, ¿cuántas baldosas se necesitan para cubrir el piso?", "f": "Cálculo propio a partir de los datos del caso.", "vis": "", "o": [["A", "14 baldosas.", "14 es el área del piso en metros cuadrados (4 × 3,5), no el número de baldosas; cada baldosa cubre solo 0,25 m².", false], ["B", "28 baldosas.", "Divide el área (14 m²) entre 0,5 m, el lado de la baldosa, en lugar de dividirla entre su área (0,25 m²).", false], ["C", "30 baldosas.", "Divide el perímetro (15 m) entre 0,5 m; así se contarían baldosas alrededor del borde, no las que cubren el piso.", false], ["D", "56 baldosas.", "A lo largo caben 4 ÷ 0,5 = 8 baldosas y a lo ancho 3,5 ÷ 0,5 = 7; en total 8 × 7 = 56 (equivale a 14 m² ÷ 0,25 m²).", true]]}, {"id": "RCP-108", "niv": 2, "cp": "rc_formulacion", "e": "¿Cuántos metros de guardaescoba se necesitan?", "f": "Cálculo propio a partir de los datos del caso.", "vis": "", "o": [["A", "6,6 m.", "Usa la mitad del perímetro (4 + 3,5 = 7,5 m) y le resta la puerta; el guardaescoba recorre los cuatro lados.", false], ["B", "13,2 m.", "Resta dos veces el ancho de la puerta (15 − 1,8), pero la puerta ocupa un solo espacio de 0,9 m.", false], ["C", "14,1 m.", "El perímetro es 2 × (4 + 3,5) = 15 m; sin el espacio de la puerta quedan 15 − 0,9 = 14,1 m.", true], ["D", "15 m.", "Es el perímetro completo; no descuenta los 0,9 m de la puerta.", false]]}, {"id": "RCP-109", "niv": 3, "cp": "rc_argumentacion", "e": "Andrés sugiere usar baldosas cuadradas de 25 cm de lado y afirma: «Como el lado mide la mitad, se necesitará el doble de baldosas que con las de 50 cm». ¿Es válido su razonamiento?", "f": "Área del cuadrado.", "vis": "", "o": [["A", "No, porque cada baldosa nueva cubre la cuarta parte del área: se necesita el cuádruple.", "El área de una baldosa de 25 cm es 0,25² = 0,0625 m², la cuarta parte de 0,5² = 0,25 m²; por eso se necesita cuatro veces esa cantidad de baldosas.", true], ["B", "No, porque con baldosas de 25 cm se necesita la mitad de baldosas, ya que 25 es la mitad de 50.", "Con baldosas más pequeñas se necesitan más baldosas, no menos.", false], ["C", "Sí, porque el perímetro de cada baldosa pasa de 2 m a 1 m, que es la mitad.", "El perímetro sí se reduce a la mitad, pero para cubrir el piso importa el área, que se reduce a la cuarta parte.", false], ["D", "Sí, porque el área de cada baldosa pasa de 0,25 m² a 0,125 m², es decir, a la mitad.", "0,25 × 0,25 = 0,0625 m², no 0,125 m²: al reducir el lado a la mitad el área se reduce a la cuarta parte.", false]]}]}, {"comp": "razonamiento_cuantitativo", "sim": "pro-1", "ind": "Modalidad de trabajo en dos sedes de una empresa", "tt": "", "texto": "Una empresa de servicios tiene 200 empleados distribuidos en dos sedes. La tabla muestra cuántos trabajan de manera presencial y cuántos en modalidad remota.", "vis": "<table class=\"vt\"><caption>Tabla 1. Empleados por sede y modalidad de trabajo<\/caption><thead><tr><th>Sede<\/th><th>Presencial<\/th><th>Remoto<\/th><th>Total<\/th><\/tr><\/thead><tbody><tr><td>Norte<\/td><td>48<\/td><td>32<\/td><td>80<\/td><\/tr><tr><td>Sur<\/td><td>70<\/td><td>50<\/td><td>120<\/td><\/tr><tr><td>Total<\/td><td>118<\/td><td>82<\/td><td>200<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Fuente: datos ficticios.<\/div>", "items": [{"id": "RCP-110", "niv": 2, "cp": "rc_interpretacion", "e": "Si se elige al azar un empleado de la sede Sur, ¿cuál es la probabilidad de que trabaje en modalidad remota?", "f": "Lectura de la tabla y cálculo propio.", "vis": "", "o": [["A", "5/7.", "Divide los 50 remotos entre los 70 presenciales de la sede Sur; el total de esa sede es 120.", false], ["B", "1/4.", "Divide los 50 remotos de la sede Sur entre los 200 empleados de toda la empresa, pero el empleado se elige solo entre los de la sede Sur.", false], ["C", "5/12.", "En la sede Sur hay 50 empleados remotos de 120: 50/120 = 5/12.", true], ["D", "41/100.", "82/200 es la proporción de empleados remotos en toda la empresa, no en la sede Sur.", false]]}, {"id": "RCP-111", "niv": 1, "cp": "rc_interpretacion", "e": "¿Cuál de las siguientes afirmaciones se deduce de la tabla?", "f": "Lectura de la tabla del caso.", "vis": "", "o": [["A", "En la empresa hay más empleados remotos que presenciales.", "En total hay 82 empleados remotos y 118 presenciales.", false], ["B", "En cada sede, más de la mitad de los empleados trabaja de manera presencial.", "En la sede Norte trabajan presencialmente 48 de 80 (60 %) y en la Sur 70 de 120 (cerca del 58 %); en ambas es más de la mitad.", true], ["C", "La sede Sur tiene el doble de empleados que la sede Norte, pues tiene 40 empleados más.", "La sede Sur tiene 120 empleados y la Norte 80: es 1,5 veces, no el doble.", false], ["D", "La sede Norte tiene más empleados en modalidad remota que la sede Sur.", "La sede Norte tiene 32 empleados remotos y la Sur 50.", false]]}, {"id": "RCP-112", "niv": 3, "cp": "rc_argumentacion", "e": "El gerente concluye que en la sede Sur la proporción de empleados remotos es mayor que en la sede Norte, y lo justifica así: «En la Sur hay 18 empleados remotos más que en la Norte». Sobre la conclusión y la justificación del gerente, es correcto afirmar que", "f": "Cálculo propio a partir de los datos del caso.", "vis": "", "o": [["A", "la conclusión es verdadera, pero la justificación no basta: deben compararse proporciones, no cantidades.", "La proporción depende del total de cada sede. Al dividir los remotos entre el total de cada sede, la Sur (≈ 41,7 %) supera a la Norte (40 %), aunque la razón dada no lo demuestra.", true], ["B", "la conclusión y la justificación son correctas, porque 18 empleados más equivalen a 18 puntos porcentuales más.", "Una diferencia de empleados no equivale a puntos porcentuales: depende del total de cada sede.", false], ["C", "la conclusión es falsa, porque 50 es el 25 % de 200 y 32 es el 16 % de 200, así que la Sur tiene menos.", "Divide entre los 200 empleados de la empresa y no entre el total de cada sede; además, 25 % es mayor que 16 %.", false], ["D", "la conclusi
