tregar bolsas reutilizables a los compradores responde a los dos problemas que señalan los vendedores: compradores que llegan sin bolsa y el alto costo de las alternativas.", true], ["B", "Que los canales de aguas lluvias sigan taponados con bolsas.", "Ese es el problema que justifica la prohibición, no un efecto no deseado de ella.", false], ["C", "Que la distribuidora de bolsas plásticas tenga que despedir a parte de sus 25 empleados por la caída de sus ventas.", "La entrega de bolsas reutilizables no atiende la situación de la distribuidora, que pidió un plazo para adaptarse.", false], ["D", "Que el plástico que ya está en el mar siga afectando la pesca.", "La propuesta de los pescadores no se refiere al plástico que ya está en el mar.", false]]}, {"id": "CCP-131", "niv": 2, "cp": "cc_multiperspectivismo", "e": "Frente al acuerdo, los vendedores de la plaza y la distribuidora de bolsas coinciden en que", "f": "Texto original elaborado para este simulacro, caso de las bolsas plásticas en la plaza de mercado", "vis": "", "o": [["A", "las bolsas plásticas no son la causa principal de las inundaciones del municipio en la temporada de lluvias.", "Ninguno de los dos discute la relación entre bolsas e inundaciones; sus objeciones son económicas.", false], ["B", "la alcaldía debe repartir bolsas reutilizables a los compradores.", "Esa propuesta es de la asociación de pescadores.", false], ["C", "la prohibición tendría efectos económicos negativos sobre su actividad.", "Los vendedores hablan del mayor costo de las bolsas alternativas y la distribuidora pide tiempo para adaptarse; ambos señalan un impacto económico.", true], ["D", "la prohibición debería aplicarse a los compradores y no a los vendedores.", "Ninguno de los dos actores propone eso.", false]]}, {"id": "CCP-132", "niv": 2, "cp": "cc_argumentacion", "e": "En una sesión del concejo, un vendedor dice: «Esta medida es inútil, porque en los supermercados también entregan bolsas plásticas y a ellos nadie se las prohíbe». Este argumento es débil porque", "f": "Texto original elaborado para este simulacro, caso de las bolsas plásticas en la plaza de mercado", "vis": "", "o": [["A", "las bolsas de los supermercados llegan al mar en menor cantidad que las de la plaza.", "El texto no da esa información, y aunque fuera cierta no explicaría la falla del razonamiento.", false], ["B", "que la medida no resuelva todo el problema no demuestra que no reduzca una parte de él.", "El vendedor concluye que la medida es «inútil» porque no abarca todas las fuentes de bolsas; pero una medida parcial puede reducir el problema aunque no lo elimine.", true], ["C", "en el municipio los supermercados no entregan bolsas plásticas a sus clientes desde hace varios años.", "El texto no da esa información; es un dato inventado.", false], ["D", "las bolsas de tela y de papel también terminan en los canales y agravan las inundaciones.", "El texto no da esa información, y no explica la falla del razonamiento del vendedor.", false]]}]}, {"comp": "competencias_ciudadanas", "sim": "pro-1", "ind": "Cierre nocturno de un parque", "tt": "", "texto": "En el barrio Los Almendros, un grupo de residentes recogió firmas para pedir a la alcaldía local que instale una reja alrededor del parque y lo cierre entre las 9:00 p. m. y las 6:00 a. m. Argumentan que en las noches se consume alcohol en el parque y que el ruido no los deja dormir.\n\nLos jóvenes del equipo de fútbol del barrio se oponen: trabajan o estudian durante el día y el único horario en que pueden entrenar es de 8:00 a 10:00 p. m.\n\nLa alcaldía local recordó que el parque es un espacio público destinado al uso común e informó que, en el último año, recibió 46 quejas por ruido en el sector, 40 de ellas por hechos ocurridos entre la medianoche y las 3:00 a. m.", "vis": "", "items": [{"id": "CCP-133", "niv": 2, "cp": "cc_multiperspectivismo", "e": "¿Cuál de las siguientes soluciones atendería mejor, a la vez, la preocupación de los residentes y la necesidad de los jóvenes?", "f": "Texto original elaborado para este simulacro, caso del parque de Los Almendros", "vis": "", "o": [["A", "Mantener el parque abierto hasta la medianoche y reforzar la vigilancia entre las 8:00 y las 10:00 p. m.", "Parece atender a ambos, pero vigila en el horario de los entrenamientos y no entre la medianoche y las 3:00 a. m., cuando ocurren 40 de las 46 quejas.", false], ["B", "Cerrar el parque desde las 9:00 p. m., como piden las firmas, y trasladar los entrenamientos de los jóvenes a las mañanas.", "Los jóvenes trabajan o estudian de día, así que no podrían entrenar en la mañana.", false], ["C", "Cerrar el parque desde las 9:00 p. m. y permitir que los jóvenes entrenen los fines de semana en la cancha de un colegio cercano.", "Atiende la petición de las firmas, pero no la necesidad de los jóvenes, que trabajan o estudian y solo pueden entrenar de 8:00 a 10:00 p. m.", false], ["D", "Cerrar el parque desde las 10:30 p. m. y reforzar la vigilancia en la madrugada.", "Permite los entrenamientos (8:00 a 10:00 p. m.) y actúa en las horas en que se concentran las quejas por ruido (medianoche a 3:00 a. m.).", true]]}, {"id": "CCP-134", "niv": 3, "cp": "cc_argumentacion", "e": "¿Qué conclusión se apoya mejor en los registros de la alcaldía local?", "f": "Texto original elaborado para este simulacro, caso del parque de Los Almendros, registros de la alcaldía local", "vis": "", "o": [["A", "La mayoría de las quejas por ruido corresponde a horas en que los jóvenes ya terminaron sus entrenamientos.", "40 de las 46 quejas se refieren a hechos entre la medianoche y las 3:00 a. m., mientras que los entrenamientos terminan a las 10:00 p. m.", true], ["B", "Cerrar el parque desde las 9:00 p. m. es la única forma de reducir el ruido.", "Los datos no excluyen otras soluciones; de hecho, sugieren actuar sobre la madrugada.", false], ["C", "Los jóvenes del equipo de fútbol son los responsables del consumo de alcohol en el parque durante las noches.", "Los registros no identifican a los responsables; atribuirlo a los jóvenes es una conclusión sin apoyo.", false], ["D", "Los residentes exageran el problema, porque 46 quejas en un año son pocas.", "Los registros no permiten valorar si 46 quejas son muchas o pocas; es un juicio sin fundamento en los datos.", false]]}, {"id": "CCP-135", "niv": 1, "cp": "cc_sistemico", "e": "Además de la convivencia, ¿qué otra dimensión del problema destaca la alcaldía local en su intervención?", "f": "Texto original elaborado para este simulacro, caso del parque de Los Almendros, intervención de la alcaldía local", "vis": "", "o": [["A", "La jurídica, porque el parque es un espacio público destinado al uso común.", "La alcaldía recuerda la naturaleza del parque como espacio público de uso común (cf. Constitución, art. 82), lo que limita la posibilidad de cerrarlo.", true], ["B", "La deportiva, porque el equipo de fútbol representa al barrio.", "La alcaldía no habla del equipo; esa perspectiva corresponde a los jóvenes.", false], ["C", "La política, porque la decisión depende del número de firmas que reunieron los residentes.", "La alcaldía no menciona las firmas; lo que destaca es la naturaleza del parque como espacio público.", false], ["D", "La económica, porque instalar una reja alrededor del parque tendría un costo alto para el presupuesto de la localidad.", "La alcaldía no menciona costos.", false]]}]}, {"comp": "ingles", "sim": "pro-1", "ind": "Objetos para acampar", "tt": "", "texto": "Read the descriptions of some things people take when they go camping. Which word (A–H) matches each description?\n\nA. tent   B. torch   C. compass   D. sleeping bag   E. map   F. matches   G. backpack   H. rope\n\nExample: You carry your things on your back in this. Answer: G (backpack).\n\nEach word can be used only once. The word in the example is not used again, and two words are not used at all.", "vis": "", "items": [{"id": "EN1-101", "niv": 1, "cp": "en_p1", "e": "This is a small house made of cloth that you put up when you camp.", "f": "Texto original: lista de objetos de campamento", "vis": "", "o": [["A", "tent", "«Tent» es «carpa»: una casita de tela que se arma («put up») al acampar.", true], ["B", "torch", "«torch» significa «linterna (inglés británico)»; no corresponde a esta descripción.", false], ["C", "compass", "«compass» significa «brújula»; no corresponde a esta descripción.", false], ["D", "sleeping bag", "«Sleeping bag» (saco de dormir) sirve para dormir, pero no es una casa de tela que se arma.", false], ["E", "map", "«map» significa «mapa»; no corresponde a esta descripción.", false], ["F", "matches", "«matches» significa «fósforos»; no corresponde a esta descripción.", false], ["G", "backpack", "«backpack» (morral) ya se usó en el ejemplo y no vuelve a usarse.", false], ["H", "rope", "«rope» significa «cuerda»; no corresponde a esta descripción.", false]]}, {"id": "EN1-102", "niv": 1, "cp": "en_p1", "e": "You strike one of these to start a fire.", "f": "Texto original: lista de objetos de campamento", "vis": "", "o": [["A", "tent", "«tent» significa «carpa»; no corresponde a esta descripción.", false], ["B", "torch", "«Torch» (linterna) da luz con pilas; no se raspa ni enciende fuego.", false], ["C", "compass", "«compass» significa «brújula»; no corresponde a esta descripción.", false], ["D", "sleeping bag", "«sleeping bag» significa «saco de dormir»; no corresponde a esta descripción.", false], ["E", "map", "«map» significa «mapa»; no corresponde a esta descripción.", false], ["F", "matches", "«Matches» son «fósforos»: se raspan («strike») para encender el fuego; «one of these» indica una palabra en plural.", true], ["G", "backpack", "«backpack» (morral) ya se usó en el ejemplo y no vuelve a usarse.", false], ["H", "rope", "«rope» significa «cuerda»; no corresponde a esta descripción.", false]]}, {"id": "EN1-103", "niv": 1, "cp": "en_p1", "e": "This shows you the roads, rivers and mountains of an area.", "f": "Texto original: lista de objetos de campamento", "vis": "", "o": [["A", "tent", "«tent» significa «carpa»; no corresponde a esta descripción.", false], ["B", "torch", "«torch» significa «linterna (inglés británico)»; no corresponde a esta descripción.", false], ["C", "compass", "«Compass» (brújula) indica el norte, pero no muestra carreteras ni ríos.", false], ["D", "sleeping bag", "«sleeping bag» significa «saco de dormir»; no corresponde a esta descripción.", false], ["E", "map", "«Map» es «mapa»: muestra («shows») carreteras, ríos y montañas de una zona.", true], ["F", "matches", "«matches» significa «fósforos»; no corresponde a esta descripción.", false], ["G", "backpack", "«backpack» (morral) ya se usó en el ejemplo y no vuelve a usarse.", false], ["H", "rope", "«rope» significa «cuerda»; no corresponde a esta descripción.", false]]}, {"id": "EN1-104", "niv": 1, "cp": "en_p1", "e": "You switch this on to see in the dark. It uses batteries.", "f": "Texto original: lista de objetos de campamento", "vis": "", "o": [["A", "tent", "«tent» significa «carpa»; no corresponde a esta descripción.", false], ["B", "torch", "«Torch» es «linterna» en inglés británico: se enciende («switch on»), usa pilas («batteries») y sirve para ver en la oscuridad.", true], ["C", "compass", "«compass» significa «brújula»; no corresponde a esta descripción.", false], ["D", "sleeping bag", "«sleeping bag» significa «saco de dormir»; no corresponde a esta descripción.", false], ["E", "map", "«map» significa «mapa»; no corresponde a esta descripción.", false], ["F", "matches", "«Matches» (fósforos) dan una llama breve, pero no se encienden con un interruptor ni usan pilas.", false], ["G", "backpack", "«backpack» (morral) ya se usó en el ejemplo y no vuelve a usarse.", false], ["H", "rope", "«rope» significa «cuerda»; no corresponde a esta descripción.", false]]}, {"id": "EN1-105", "niv": 2, "cp": "en_p1", "e": "Its needle always points north, so it helps you find your way.", "f": "Texto original: lista de objetos de campamento", "vis": "", "o": [["A", "tent", "«tent» significa «carpa»; no corresponde a esta descripción.", false], ["B", "torch", "«torch» significa «linterna (inglés británico)»; no corresponde a esta descripción.", false], ["C", "compass", "«Compass» es «brújula»: su aguja («needle») apunta al norte y ayuda a orientarse.", true], ["D", "sleeping bag", "«sleeping bag» significa «saco de dormir»; no corresponde a esta descripción.", false], ["E", "map", "«Map» (mapa) ayuda a orientarse, pero no tiene una aguja que apunte al norte.", false], ["F", "matches", "«matches» significa «fósforos»; no corresponde a esta descripción.", false], ["G", "backpack", "«backpack» (morral) ya se usó en el ejemplo y no vuelve a usarse.", false], ["H", "rope", "«rope» significa «cuerda»; no corresponde a esta descripción.", false]]}]}, {"comp": "ingles", "sim": "pro-1", "ind": "Avisos en lugares públicos", "tt": "", "texto": "Read each notice. Where can you see it? Choose the correct place.", "vis": "", "items": [{"id": "EN1-106", "niv": 1, "cp": "en_p2", "e": "\"Please return your books by the date stamped inside.\"\n\nWhere can you see this notice?", "f": "Aviso original", "vis": "", "o": [["A", "in a bank", "En un banco no se prestan libros ni se sellan fechas de devolución dentro de ellos.", false], ["B", "in a library", "El aviso pide devolver los libros («return your books») antes de la fecha sellada: es un aviso de biblioteca, donde se prestan libros.", true], ["C", "in a bakery", "En una panadería («bakery») se vende pan; no hay libros que devolver.", false]]}, {"id": "EN1-107", "niv": 1, "cp": "en_p2", "e": "\"Shower before entering the water. No running near the edge.\"\n\nWhere can you see this notice?", "f": "Aviso original", "vis": "", "o": [["A", "at a swimming pool", "Ducharse antes de entrar al agua y no correr cerca del borde («edge») son normas típicas de una piscina.", true], ["B", "at a cinema", "En un cine no hay agua en la que entrar ni borde por el que se pueda resbalar.", false], ["C", "at a post office", "En una oficina de correos no hay que ducharse ni hay agua para nadar.", false]]}, {"id": "EN1-108", "niv": 1, "cp": "en_p2", "e": "\"Please do not feed the animals. They follow a special diet.\"\n\nWhere can you see this notice?", "f": "Aviso original", "vis": "", "o": [["A", "in a supermarket", "En un supermercado se venden alimentos, pero no hay animales a los que el público pueda dar comida.", false], ["B", "at a hairdresser's", "En una peluquería («hairdresser's») no hay animales con dieta especial.", false], ["C", "at a zoo", "Prohibir alimentar a los animales («do not feed the animals») porque siguen una dieta especial es propio de un zoológico.", true]]}, {"id": "EN1-109", "niv": 2, "cp": "en_p2", "e": "\"Platform 4 is closed today. Passengers for Riverside, please use Platform 2.\"\n\nWhere can you see this notice?", "f": "Aviso original", "vis": "", "o": [["A", "at a train station", "«Platform» es «andén» y «passengers for Riverside» son los viajeros hacia un destino: el aviso está en una estación de tren.", true], ["B", "at a football stadium", "En un estadio hay tribunas y espectadores, no andenes ni pasajeros con destino.", false], ["C", "at an airport", "En un aeropuerto se habla de «gates» (puertas de embarque), no de andenes numerados.", false]]}, {"id": "EN1-110", "niv": 2, "cp": "en_p2", "e": "\"Flash photography is not allowed in this room. The paintings are very old and sensitive to light.\"\n\nWhere can you see this notice?", "f": "Aviso original", "vis": "", "o": [["A", "in a hospital ward", "En una sala de hospital («ward») hay pacientes, no pinturas antiguas que proteger.", false], ["B", "in an art gallery", "Se prohíbe el flash para proteger pinturas antiguas («paintings»): es un aviso de una galería o museo de arte.", true], ["C", "in a photo shop", "Aunque menciona la fotografía, una tienda de fotos no exhibe pinturas antiguas sensibles a la luz.", false]]}, {"id": "EN1-111", "niv": 2, "cp": "en_p2", "e": "\"Lift out of order. Patients for X-ray, please take the stairs to the first floor or ask a nurse for help.\"\n\nWhere can you see this notice?", "f": "Aviso original", "vis": "", "o": [["A", "at a shopping centre", "En un centro comercial hay clientes, no pacientes que se toman radiografías.", false], ["B", "in a hotel", "Un hotel puede tener ascensor, pero sus huéspedes no son pacientes ni van a rayos X con una enfermera.", false], ["C", "in a hospital", "«Patients», «X-ray» (rayos X) y «nurse» (enfermera) indican un hospital; el ascensor («lift») está dañado («out of order»).", true]]}]}, {"comp": "ingles", "sim": "pro-1", "ind": "Conversaciones cotidianas", "tt": "", "texto": "Complete the conversations. Choose the best reply to each sentence.", "vis": "", "items": [{"id": "EN1-112", "niv": 1, "cp": "en_p3", "e": "\"Nice to meet you. I'm Laura.\"", "f": "Conversación original", "vis": "", "o": [["A", "I'm fine, thanks. And you?", "«I'm fine, thanks» responde a «How are you?», no a una presentación.", false], ["B", "Nice to meet you too.", "Ante una presentación, lo natural es devolver el saludo: «Nice to meet you too» (mucho gusto también).", true], ["C", "Yes, I do.", "«Yes, I do» responde a una pregunta con «Do you…?»; aquí nadie hizo una pregunta.", false]]}, {"id": "EN1-113", "niv": 1, "cp": "en_p3", "e": "\"What time does the film start?\"", "f": "Conversación original", "vis": "", "o": [["A", "At half past seven.", "«What time» pregunta por la hora; «At half past seven» (a las siete y media) da una hora concreta.", true], ["B", "In the cinema.", "«In the cinema» indica lugar, pero la pregunta es por la hora.", false], ["C", "For about two hours.", "«For two hours» indica duración (cuánto dura), no la hora de inicio.", false]]}, {"id": "EN1-114", "niv": 2, "cp": "en_p3", "e": "\"Would you mind closing the window?\"", "f": "Conversación original", "vis": "", "o": [["A", "Yes, I'd love to.", "«I'd love to» acepta una invitación («Would you like to…?»); además, «Yes» a «Would you mind» significaría que sí le molesta.", false], ["B", "No, I haven't.", "«No, I haven't» responde a una pregunta con «Have you…?»; el auxiliar no concuerda con «Would you mind».", false], ["C", "Not at all.", "«Would you mind…?» significa «¿te molestaría…?»; «Not at all» (para nada) indica que no le molesta y que lo hará.", true]]}, {"id": "EN1-115", "niv": 2, "cp": "en_p3", "e": "\"I've lost my student ID card.\"", "f": "Conversación original", "vis": "", "o": [["A", "Thanks, that's really kind of you.", "Agradecer («that's really kind of you») no tiene sentido: la otra persona no ha ofrecido ninguna ayuda, solo contó que perdió su carné.", false], ["B", "Oh no! When did you last have it?", "Ante una mala noticia, mostrar preocupación y preguntar cuándo la tuvo por última vez es una respuesta natural y útil.", true], ["C", "Really? I've got two of them.", "No responde a la mala noticia: decir que uno tiene dos carnés no muestra preocupación ni ayuda, y no tiene relación con haber perdido el suyo.", false]]}, {"id": "EN1-116", "niv": 2, "cp": "en_p3", "e": "\"Shall we take the bus or walk to the museum?\"", "f": "Conversación original", "vis": "", "o": [["A", "Let's walk. It isn't far.", "La pregunta ofrece dos alternativas; «Let's walk» elige una y da una razón («no queda lejos»).", true], ["B", "It's right next to the museum.", "Describe la ubicación de algo, pero no responde si ir en bus o caminando.", false], ["C", "Yes, please.", "Una pregunta con «or» pide escoger entre dos opciones; «Yes, please» no elige ninguna.", false]]}, {"id": "EN1-117", "niv": 3, "cp": "en_p3", "e": "\"I can't believe I failed the driving test again.\"", "f": "Conversación original", "vis": "", "o": [["A", "Neither did I. It was easy.", "Es incoherente: «Neither did I» no concuerda con «I can't believe» y decir que fue fácil no consuela a quien perdió.", false], ["B", "Well done, you really deserve it!", "«Well done» (¡bien hecho!) felicita por un logro; es inapropiado ante un examen perdido.", false], ["C", "Never mind. Third time lucky!", "«Never mind» consuela y «Third time lucky» es una expresión de ánimo: si falló dos veces, la tercera será la vencida.", true]]}]}, {"comp": "ingles", "sim": "pro-1", "ind": "Los faros", "tt": "", "texto": "Read the text and choose the right word for each gap.\n\nLighthouses\n\nFor hundreds of years, lighthouses (1) ______ helped sailors at night. A lighthouse is a tall tower with a strong light at the top. Ships can see the light from far away, so sailors know that there are rocks or a coast near (2) ______. In the past, every lighthouse had a keeper. The keeper lived in a small house next to the tower and (3) ______ the lamp every evening. It was a lonely job, (4) ______ many keepers loved the sea. Today, most lighthouses are automatic, and nobody (5) ______ to live there. Some old towers are now museums or small hotels.", "vis": "", "items": [{"id": "EN1-118", "niv": 1, "cp": "en_p4", "e": "Gap (1)", "f": "Texto original «Lighthouses», espacio 1", "vis": "", "o": [["A", "has", "«Has» es para sujeto singular (he/she/it); «lighthouses» es plural.", false], ["B", "are", "«Are helped» sería voz pasiva («son ayudados»), pero los faros son los que ayudan a los marineros.", false], ["C", "have", "«For hundreds of years» pide presente perfecto, y con el sujeto plural «lighthouses» el auxiliar es «have»: «have helped».", true]]}, {"id": "EN1-119", "niv": 1, "cp": "en_p4", "e": "Gap (2)", "f": "Texto original «Lighthouses», espacio 2", "vis": "", "o": [["A", "their", "«Their» es posesivo y necesita un sustantivo después (their ship).", false], ["B", "them", "Después de la preposición «near» va un pronombre objeto: «near them» (cerca de ellos, los barcos).", true], ["C", "they", "«They» es pronombre sujeto; no puede ir después de una preposición.", false]]}, {"id": "EN1-120", "niv": 2, "cp": "en_p4", "e": "Gap (3)", "f": "Texto original «Lighthouses», espacio 3", "vis": "", "o": [["A", "lit", "El texto narra el pasado («In the past… lived»), así que se usa el pasado de «light»: «lit the lamp» (encendía la lámpara).", true], ["B", "lights", "«Lights» está en presente; no concuerda con «lived», que está en pasado en la misma oración.", false], ["C", "lighting", "«Lighting» (gerundio) no puede ser el verbo principal coordinado con «lived» sin un auxiliar.", false]]}, {"id": "EN1-121", "niv": 2, "cp": "en_p4", "e": "Gap (4)", "f": "Texto original «Lighthouses», espacio 4", "vis": "", "o": [["A", "because", "«Because» presentaría el amor por el mar como causa de la soledad, lo cual no tiene sentido.", false], ["B", "so", "«So» (así que) indicaría consecuencia: amar el mar no es un resultado de que el trabajo sea solitario.", false], ["C", "but", "Hay contraste: el trabajo era solitario, «pero» (but) muchos guardianes amaban el mar.", true]]}, {"id": "EN1-122", "niv": 2, "cp": "en_p4", "e": "Gap (5)", "f": "Texto original «Lighthouses», espacio 5", "vis": "", "o": [["A", "needing", "«Needing» es una forma -ing y no puede funcionar como verbo principal sin auxiliar.", false], ["B", "needs", "«Nobody» funciona como sujeto singular, por eso el verbo lleva -s: «nobody needs to live there».", true], ["C", "need", "«Need» sin -s sería para sujetos plurales o I/you/we/they; «nobody» es singular.", false]]}]}, {"comp": "ingles", "sim": "pro-1", "ind": "Los tardígrados", "tt": "", "texto": "Read the text and choose the right word for each gap.\n\nWater bears\n\nTardigrades are tiny animals that live almost everywhere: in moss, in the sea and even on mountain tops. Most of them are less than one millimetre long, so you need a microscope (1) ______ see them. A German pastor first described them in 1773 and called them 'little water bears' (2) ______ they walk slowly on eight short legs, like a bear.\n\nTardigrades are famous for surviving conditions that would kill most other animals. When their home dries out, they lose almost all the water in their bodies and curl up into a small ball. In this state, they can survive for years (3) ______ food or water. Scientists have even sent them into space, and some of them (4) ______ still alive when they returned to Earth. Researchers hope that learning (5) ______ tardigrades protect their cells could help us store medicines without refrigeration.", "vis": "", "items": [{"id": "EN1-123", "niv": 2, "cp": "en_p4", "e": "Gap (1)", "f": "Texto original «Water bears», espacio 1", "vis": "", "o": [["A", "to", "Para expresar propósito se usa el infinitivo con «to»: «you need a microscope to see them» (para verlos).", true], ["B", "for", "«For» + verbo base («for see») es incorrecto; «for» va con sustantivos o con -ing.", false], ["C", "of", "«Of see» no es una estructura posible en inglés para expresar finalidad.", false]]}, {"id": "EN1-124", "niv": 2, "cp": "en_p4", "e": "Gap (2)", "f": "Texto original «Water bears», espacio 2", "vis": "", "o": [["A", "unless", "«Unless» (a menos que) expresa una condición, no la razón del nombre.", false], ["B", "because", "La segunda parte explica la causa del nombre: los llamó «ositos de agua» porque (because) caminan despacio como un oso.", true], ["C", "although", "«Although» (aunque) introduce un contraste, pero caminar como un oso apoya el nombre en lugar de contradecirlo.", false]]}, {"id": "EN1-125", "niv": 2, "cp": "en_p4", "e": "Gap (3)", "f": "Texto original «Water bears», espacio 3", "vis": "", "o": [["A", "despite", "«Despite» (a pesar de) no tiene sentido aquí: no sobreviven «a pesar de la comida y el agua».", false], ["B", "within", "«Within» significa «dentro de» (un tiempo o lugar); «within food or water» no tiene sentido.", false], ["C", "without", "El texto dice que pierden casi toda el agua: sobreviven años «without food or water» (sin comida ni agua).", true]]}, {"id": "EN1-126", "niv": 3, "cp": "en_p4", "e": "Gap (4)", "f": "Texto original «Water bears», espacio 4", "vis": "", "o": [["A", "were", "El relato está en pasado («returned») y el sujeto «some of them» es plural: «some of them were still alive».", true], ["B", "was", "«Was» es singular; «some of them» (algunos de ellos) exige el plural «were».", false], ["C", "have", "«Have still alive» es agramatical: «alive» es un adjetivo y necesita el verbo «be».", false]]}, {"id": "EN1-127", "niv": 3, "cp": "en_p4", "e": "Gap (5)", "f": "Texto original «Water bears», espacio 5", "vis": "", "o": [["A", "how", "«Learning how tardigrades protect their cells» = aprender cómo protegen sus células; «how» introduce una oración completa sobre la manera.", true], ["B", "what", "«What» necesitaría que faltara un objeto en la oración («what they protect»), pero aquí la oración ya está completa («protect their cells»).", false], ["C", "which", "«Which» exige un sustantivo antecedente o una elección entre opciones; no encaja antes de «tardigrades protect their cells».", false]]}]}, {"comp": "ingles", "sim": "pro-1", "ind": "Una relojera de Popayán", "tt": "", "texto": "Read the text and answer the questions.\n\nTeresa's workshop\n\nTeresa Ríos repairs old clocks in a small workshop in the centre of Popayán. She learned the job from her grandfather when she was fifteen. At first, she only cleaned the parts, but after two years he let her open the clocks and fix them herself.\n\nTeresa works from Tuesday to Saturday. In the mornings she repairs clocks, and in the afternoons she meets customers. Most of her customers are older people who want to save a clock that belonged to their parents. \"The clock is not always valuable,\" she says, \"but the memories are.\"\n\nSome repairs take only an hour. Others take months, because Teresa has to make a new part by hand. She never uses plastic parts. Last year she started teaching a short weekend course for young people. Twelve students signed up, and two of them now help her in the workshop.", "vis": "", "items": [{"id": "EN1-128", "niv": 1, "cp": "en_p5", "e": "Who taught Teresa how to repair clocks?", "f": "Texto original «Teresa's workshop», párrafo 1", "vis": "", "o": [["A", "One of her customers.", "Los clientes llevan relojes para reparar; ninguno le enseñó el oficio.", false], ["B", "A school teacher.", "El texto no menciona a ningún profesor de colegio; aprendió con su abuelo.", false], ["C", "A relative.", "El texto dice «She learned the job from her grandfather»: su abuelo es un familiar («relative»).", true]]}, {"id": "EN1-129", "niv": 1, "cp": "en_p5", "e": "When does Teresa meet her customers?", "f": "Texto original «Teresa's workshop», párrafo 2", "vis": "", "o": [["A", "Early in the morning.", "Las mañanas las dedica a reparar relojes, no a atender clientes.", false], ["B", "In the afternoons.", "«In the afternoons she meets customers»: atiende a los clientes por la tarde.", true], ["C", "On Mondays.", "Trabaja de martes a sábado; el lunes no aparece como día de trabajo.", false]]}, {"id": "EN1-130", "niv": 2, "cp": "en_p5", "e": "According to Teresa, people want to repair their old clocks mainly because…", "f": "Texto original «Teresa's workshop», párrafo 2", "vis": "", "o": [["A", "the clocks are worth a lot of money today.", "Teresa afirma lo contrario: «The clock is not always valuable» (no siempre es valioso en dinero).", false], ["B", "new clocks are made of plastic.", "El plástico se menciona solo para decir que Teresa no usa piezas de plástico; no es la razón de los clientes.", false], ["C", "the clocks remind them of their family.", "Los relojes pertenecieron a sus padres y Teresa dice que lo valioso son los recuerdos («the memories»): les recuerdan a su familia.", true]]}, {"id": "EN1-131", "niv": 2, "cp": "en_p5", "e": "What happened after Teresa started her weekend course?", "f": "Texto original «Teresa's workshop», párrafo 3", "vis": "", "o": [["A", "A couple of the participants now assist her.", "«Two of them now help her in the workshop»: dos («a couple») de los participantes del curso ahora le ayudan («assist») en el taller.", true], ["B", "Twelve students joined her workshop as helpers.", "Doce estudiantes se inscribieron al curso, pero solo dos le ayudan en el taller.", false], ["C", "She stopped repairing clocks on Saturdays.", "El texto no dice que haya dejado de reparar los sábados; sigue trabajando de martes a sábado.", false]]}]}, {"comp": "ingles", "sim": "pro-1", "ind": "La bóveda global de semillas", "tt": "", "texto": "Read the text and answer the questions.\n\nA freezer for the world's crops\n\nOn the island of Spitsbergen, in the Norwegian Arctic, a long tunnel goes deep into a mountain. At the end of it there are three cold rooms, but only one of them is in use. Boxes are stored there on tall shelves. Inside the boxes are seeds: more than a million samples of rice, wheat, maize, beans and many other crops from almost every country in the world.\n\nThe Svalbard Global Seed Vault opened in 2008. It is not an ordinary seed bank: it is a backup. Seed banks in different countries send copies of their seeds here, so that if their own collection is lost because of a war, a flood or a simple power cut, the seeds still exist somewhere. The seeds still belong to the institution that sent them, and only that institution can take them out.\n\nThe room in use is kept at minus 18 degrees Celsius. The mountain itself is naturally frozen, so even if the cooling machines stopped working, the seeds would stay cold for a long time. The vault has space for 4.5 million samples, and each sample normally contains around 500 seeds.\n\nThe first withdrawal happened in 2015. Because of the war in Syria, a research centre that used to keep its seeds near Aleppo could no longer use its collection, so it took back some of its copies from Svalbard and planted them in Lebanon and Morocco.", "vis": "", "items": [{"id": "EN1-132", "niv": 2, "cp": "en_p5", "e": "Where are the seeds kept?", "f": "Texto original «A freezer for the world's crops», párrafo 1", "vis": "", "o": [["A", "In a building beside the mountain.", "Las salas no están en un edificio junto a la montaña: el túnel entra hasta el fondo de ella y allí están los cuartos fríos.", false], ["B", "In rooms inside a mountain.", "«A long tunnel goes deep into a mountain. At the end of it there are three cold rooms»: las cajas con semillas están en una sala dentro de la montaña.", true], ["C", "In a laboratory near Aleppo.", "Alepo es donde el centro de investigación guardaba antes su propia colección, no donde está la bóveda.", false]]}, {"id": "EN1-133", "niv": 2, "cp": "en_p5", "e": "The main purpose of the vault is to…", "f": "Texto original «A freezer for the world's crops», párrafo 2", "vis": "", "o": [["A", "sell seeds to farmers around the world.", "El texto no habla de vender semillas; cada institución sigue siendo dueña de las suyas.", false], ["B", "keep safe copies of other collections.", "«It is a backup… send copies of their seeds here»: es una copia de seguridad de colecciones guardadas en otros lugares.", true], ["C", "replace the seed banks of different countries.", "No reemplaza a los bancos nacionales: guarda copias por si estos pierden su colección.", false]]}, {"id": "EN1-134", "niv": 2, "cp": "en_p5", "e": "Who can take seeds out of the vault?", "f": "Texto original «A freezer for the world's crops», párrafo 2", "vis": "", "o": [["A", "The Norwegian government.", "El texto no dice que el gobierno noruego pueda retirar las semillas de otros.", false], ["B", "Any country in the world that needs them.", "Contradice el texto: no cualquier país, solo la institución depositante.", false], ["C", "The seed bank that deposited them.", "«The seeds still belong to the institution that sent them, and only that institution can take them out»: solo el banco que las depositó puede retirarlas.", true]]}, {"id": "EN1-135", "niv": 3, "cp": "en_p5", "e": "What would happen if the cooling machines stopped working?", "f": "Texto original «A freezer for the world's crops», párrafo 3", "vis": "", "o": [["A", "The seeds would remain cold for a long period.", "«Even if the cooling machines stopped working, the seeds would stay cold for a long time», porque la montaña está congelada de forma natural.", true], ["B", "The seeds would have to be moved to Lebanon at once.", "Líbano aparece solo en el caso del retiro de 2015, no como plan ante una falla del enfriamiento.", false], ["C", "The samples would be lost within a few hours.", "Es lo contrario de lo que dice el texto: las semillas seguirían frías mucho tiempo.", false]]}, {"id": "EN1-136", "niv": 3, "cp": "en_p5", "e": "Why did the research centre take back some of its seeds in 2015?", "f": "Texto original «A freezer for the world's crops», párrafo 4", "vis": "", "o": [["A", "War stopped it from using its own seeds.", "«Because of the war in Syria… could no longer use its collection»: la guerra (un conflicto) le impidió usar su colección.", true], ["B", "It wanted to sell them in Lebanon and Morocco.", "Las semillas se sembraron («planted») en Líbano y Marruecos; el texto no habla de venderlas.", false], ["C", "Its seeds had been damaged by a flood.", "La inundación se menciona como riesgo general, no como lo que le pasó a este centro.", false]]}]}, {"comp": "ingles", "sim": "pro-1", "ind": "Elogio de perderse", "tt": "", "texto": "Read the text and answer the questions.\n\nIn praise of getting lost\n\nThe last time I got truly lost was in a small town in the mountains, three years ago. My phone had died, the bus had left without me, and the only person in the square was an old man selling oranges. Half an hour later I knew the names of his grandchildren, the best place to eat soup, and a shortcut to the next village that no map had ever shown me.\n\nI am not against navigation apps. I use them almost every day, and they have saved me from many wasted hours. But I have noticed something: when the blue dot tells me exactly where to turn, I arrive everywhere and remember nothing. I could not draw a map of the neighbourhood where I have lived for two years. My grandmother, who never owned a phone, could describe every street of her town until the day she died.\n\nSome researchers suggest that people who rely heavily on step-by-step directions may use their spatial memory less. I am not a scientist, and I don't want to exaggerate what these studies say. What I can say is that something in me switches off when I follow instructions instead of looking around.\n\nSo I have started a small experiment. Once a week, I leave my phone in my bag and walk somewhere new using only street signs and my own sense of direction. I am late more often. I have walked in circles. I have also found a bookshop, a tiny park with a fountain, and a lot of conversations I would never have had.\n\nGetting lost, I think, is not the opposite of arriving. Sometimes it is the only way to find out where you are.", "vis": "", "items": [{"id": "EN1-137", "niv": 2, "cp": "en_p6", "e": "What is the main purpose of the text?", "f": "Texto original «In praise of getting lost», texto completo", "vis": "", "o": [["A", "To explain the results of a scientific study about memory.", "Los estudios se mencionan en una sola frase y el autor aclara que no es científico; no son el centro del texto.", false], ["B", "To describe the tourist attractions of a mountain town.", "El pueblo de montaña es solo la anécdota inicial; el texto no describe atracciones turísticas.", false], ["C", "To convince readers to stop using navigation apps completely.", "El autor dice «I am not against navigation apps» y los usa casi a diario; no pide abandonarlos.", false], ["D", "To reflect on what we gain by exploring without apps.", "El autor narra experiencias propias y concluye que perderse tiene valor; es una reflexión personal, no un estudio ni una guía.", true]]}, {"id": "EN1-138", "niv": 2, "cp": "en_p6", "e": "Why does the writer mention their grandmother?", "f": "Texto original «In praise of getting lost», párrafo 2", "vis": "", "o": [["A", "To show that older people are better at using technology.", "La abuela nunca tuvo teléfono; el ejemplo no trata de habilidad con la tecnología.", false], ["B", "To suggest that phones are dangerous for elderly people.", "No se habla de peligros para los ancianos; la abuela ni siquiera usó teléfono.", false], ["C", "To contrast her memory of places with the writer's own.", "Justo después de decir que no podría dibujar el mapa de su barrio, el autor cuenta que su abuela, sin teléfono, describía cada calle: es un contraste.", true], ["D", "To explain where the writer learned to walk without a phone.", "El texto no dice que la abuela le enseñara a orientarse; el experimento semanal es idea del autor.", false]]}, {"id": "EN1-139", "niv": 3, "cp": "en_p6", "e": "What is the writer's attitude towards the research mentioned in paragraph 3?", "f": "Texto original «In praise of getting lost», párrafo 3", "vis": "", "o": [["A", "Confused: the writer does not understand what the researchers found.", "Resume con claridad la idea de los estudios; que no sea científico no significa que no los entienda.", false], ["B", "Cautious: the writer finds it relevant but avoids overstating it.", "El autor la cita pero aclara «I don't want to exaggerate what these studies say»: actitud prudente.", true], ["C", "Dismissive: the writer thinks the studies are not serious.", "No los descalifica; los menciona porque coinciden con su experiencia.", false], ["D", "Enthusiastic: the writer believes it proves the argument completely.", "El autor no dice que los estudios prueben nada; usa «suggest» y «may», y evita exagerar.", false]]}, {"id": "EN1-140", "niv": 3, "cp": "en_p6", "e": "What can be inferred from the story about the old man selling oranges?", "f": "Texto original «In praise of getting lost», párrafo 1", "vis": "", "o": [["A", "Being without a phone led to useful local knowledge.", "Sin teléfono, el autor conversó con el anciano y conoció un atajo que «ningún mapa había mostrado»: información local inesperada.", true], ["B", "The writer was annoyed because the conversation took too long.", "El tono es positivo: el autor valora lo que aprendió en esa media hora.", false], ["C", "The old man helped the writer to charge the phone.", "El texto no menciona cargar el teléfono; lo valioso fue la conversación.", false], ["D", "The writer had planned to visit the old man's village.", "El autor estaba perdido y el bus se había ido; nada indica un plan previo.", false]]}, {"id": "EN1-141", "niv": 3, "cp": "en_p6", "e": "When the writer says \"something in me switches off\", they mean that they…", "f": "Texto original «In praise of getting lost», párrafo 3", "vis": "", "o": [["A", "feel physically tired after walking long distances.", "El texto no habla de cansancio físico; la expresión se refiere a la atención.", false], ["B", "stop noticing what is around them.", "La frase contrasta seguir instrucciones con «looking around»: al obedecer al GPS, deja de fijarse en lo que lo rodea.", true], ["C", "notice that their phone battery runs out quickly when using maps.", "Es una lectura literal de «switch off»; el autor habla de sí mismo («something in me»), no del teléfono.", false], ["D", "stop trusting the instructions given by the app.", "Al contrario: el problema es que sigue las instrucciones sin pensar, no que desconfíe de ellas.", false]]}, {"id": "EN1-142", "niv": 3, "cp": "en_p6", "e": "Which statement would the writer most probably agree with?", "f": "Texto original «In praise of getting lost», párrafos 4 y 5", "vis": "", "o": [["A", "Arriving on time matters more than enjoying the walk.", "Acepta llegar tarde con más frecuencia a cambio de lo que descubre; valora más la experiencia.", false], ["B", "People who use phones are unable to remember places.", "Es una generalización que el autor evita; él mismo dice no querer exagerar.", false], ["C", "Small inconveniences can be worth what you discover.", "El autor admite llegar tarde y caminar en círculos, pero valora la librería, el parque y las conversaciones: acepta pequeñas molestias a cambio de descubrir.", true], ["D", "Navigation apps cause more problems than they solve.", "El autor reconoce que las apps le han ahorrado muchas horas; no dice que causen más problemas que soluciones.", false]]}]}, {"comp": "ingles", "sim": "pro-1", "ind": "Bibliotecas libres de barrio", "tt": "", "texto": "Read the text and choose the right word for each gap.\n\nTake a book, leave a book\n\nIn 2009, a man called Todd Bol built a small wooden box in the shape of a school and (1) ______ it with books. It was a gift in memory of his mother, a teacher who loved reading. He put the box on a post in front of his house in Hudson, Wisconsin, with a simple idea: take a book, (2) ______ a book. His neighbours loved the idea, so he built more boxes and gave them away.\n\nToday there are thousands of these \"Little Free Libraries\" (3) ______ the world. They are usually (4) ______ after by volunteers, who check that the books are in good condition. Anyone can (5) ______ a book from the box without paying or filling in a form. Many people say the boxes help them (6) ______ to know their neighbours, because they often stop to talk about the books they have read.", "vis": "", "items": [{"id": "EN1-143", "niv": 1, "cp": "en_p7", "e": "Gap (1)", "f": "Texto original «Take a book, leave a book», espacio 1", "vis": "", "o": [["A", "kept", "«Kept it with books» no expresa la idea de llenar la caja; «keep» no se construye así.", false], ["B", "full", "«Full» es adjetivo (lleno); no puede funcionar como verbo después de «and».", false], ["C", "put", "«Put» necesita un lugar («put books in it»); «put it with books» no significa llenar.", false], ["D", "filled", "«Fill something with» = llenar algo de: «filled it with books» (la llenó de libros); va en pasado como «built».", true]]}, {"id": "EN1-144", "niv": 1, "cp": "en_p7", "e": "Gap (2)", "f": "Texto original «Take a book, leave a book», espacio 2", "vis": "", "o": [["A", "rest", "«Rest» (descansar) no expresa la acción de dejar un libro para otros.", false], ["B", "stay", "«Stay» (quedarse) es intransitivo y no puede llevar «a book» como objeto.", false], ["C", "leave", "El mensaje propone un intercambio: toma un libro, deja («leave») un libro.", true], ["D", "let", "«Let» significa permitir y necesita otra estructura («let someone do»); «let a book» no tiene sentido.", false]]}, {"id": "EN1-145", "niv": 1, "cp": "en_p7", "e": "Gap (3)", "f": "Texto original «Take a book, leave a book», espacio 3", "vis": "", "o": [["A", "along", "«Along» (a lo largo de) se usa con calles o ríos, no con el mundo.", false], ["B", "around", "«Around the world» = alrededor del mundo, en muchos países: es la expresión fija.", true], ["C", "between", "«Between» (entre) se usa con dos o más elementos separados, no con «the world».", false], ["D", "under", "«Under the world» (debajo del mundo) no tiene sentido.", false]]}, {"id": "EN1-146", "niv": 2, "cp": "en_p7", "e": "Gap (4)", "f": "Texto original «Take a book, leave a book», espacio 4", "vis": "", "o": [["A", "looked", "«Look after» = cuidar: las cajas son cuidadas («looked after») por voluntarios.", true], ["B", "kept", "«Keep after» no significa cuidar; no forma la expresión que pide el contexto.", false], ["C", "cared", "Se dice «care for», no «care after».", false], ["D", "taken", "«Take after» significa parecerse a un familiar; no significa cuidar.", false]]}, {"id": "EN1-147", "niv": 2, "cp": "en_p7", "e": "Gap (5)", "f": "Texto original «Take a book, leave a book», espacio 5", "vis": "", "o": [["A", "owe", "«Owe» significa deber (dinero o un favor); no encaja con tomar un libro.", false], ["B", "rent", "«Rent» (alquilar) implica pagar, lo que contradice «without paying».", false], ["C", "lend", "«Lend» = prestar a otro; quien saca un libro «from the box» (de la caja) no presta, toma prestado.", false], ["D", "borrow", "«Borrow» = pedir prestado / tomar prestado: cualquiera puede tomar un libro sin pagar.", true]]}, {"id": "EN1-148", "niv": 2, "cp": "en_p7", "e": "Gap (6)", "f": "Texto original «Take a book, leave a book», espacio 6", "vis": "", "o": [["A", "make", "«Make to know» no existe; con «make» no se forma esta expresión.", false], ["B", "get", "«Get to know» = llegar a conocer: las cajas ayudan a conocer a los vecinos.", true], ["C", "take", "«Take to know» no es una expresión del inglés.", false], ["D", "have", "«Have to know» significaría «tener que saber», que no tiene sentido aquí.", false]]}]}, {"comp": "ingles", "sim": "pro-1", "ind": "Cafés de reparación", "tt": "", "texto": "Read the text and choose the right word for each gap.\n\nRepair cafés\n\nIn 2009, a journalist named Martine Postma organised a small event in Amsterdam where volunteers helped people fix broken objects (1) ______ of throwing them away. The idea quickly (2) ______ on, and today repair cafés meet regularly in many countries. Visitors bring toasters, lamps, bicycles, clothes and even toys. A volunteer sits next to them and, instead of simply doing the job, (3) ______ them through each step of the repair. The aim is not only to save money, but to help people (4) ______ confidence in their own skills.\n\nOrganisers admit that not everything can be saved. Some products are designed in a way that makes them very hard to open, and spare parts are sometimes impossible to (5) ______ hold of. Even so, volunteers say that a surprising number of objects need only a small adjustment, such as a loose wire or a worn-out belt. (6) ______, many visitors leave with something that works again and a better understanding of how it works.\n\nSupporters believe that repair cafés also have a social value. At a time when many neighbours hardly know each other, sitting at the same table to fix a radio can be a surprisingly effective way to (7) ______ up conversations.", "vis": "", "items": [{"id": "EN1-149", "niv": 2, "cp": "en_p7", "e": "Gap (1)", "f": "Texto original «Repair cafés», espacio 1", "vis": "", "o": [["A", "rather", "Se dice «rather than», no «rather of».", false], ["B", "because", "«Because of throwing them away» diría que se arreglan «a causa de» botarlos, lo cual es ilógico.", false], ["C", "despite", "«Despite» no lleva «of» y significa «a pesar de», que no tiene sentido aquí.", false], ["D", "instead", "«Instead of» + -ing = en lugar de: arreglar objetos en lugar de botarlos.", true]]}, {"id": "EN1-150", "niv": 2, "cp": "en_p7", "e": "Gap (2)", "f": "Texto original «Repair cafés», espacio 2", "vis": "", "o": [["A", "got", "«Get on» significa llevarse bien o subirse a un vehículo; no encaja aquí.", false], ["B", "took", "«Take on» significa asumir una tarea o contratar; no significa volverse popular.", false], ["C", "caught", "«Catch on» = ponerse de moda, volverse popular: la idea se popularizó rápido (pasado: caught).", true], ["D", "picked", "«Pick on» significa molestar o meterse con alguien.", false]]}, {"id": "EN1-151", "niv": 3, "cp": "en_p7", "e": "Gap (3)", "f": "Texto original «Repair cafés», espacio 3", "vis": "", "o": [["A", "walks", "«Walk someone through something» = guiar a alguien paso a paso: el voluntario lo acompaña en cada paso.", true], ["B", "passes", "«Pass someone through» no significa guiar o explicar paso a paso.", false], ["C", "leaves", "«Leave» no forma con «through» una expresión de guiar: «leaves them through each step» es agramatical.", false], ["D", "goes", "«Go» es intransitivo aquí: «goes them through» es agramatical.", false]]}, {"id": "EN1-152", "niv": 3, "cp": "en_p7", "e": "Gap (4)", "f": "Texto original «Repair cafés», espacio 4", "vis": "", "o": [["A", "win", "«Win» se usa con premios o partidos; «win confidence in their own skills» no es una colocación natural.", false], ["B", "gain", "La colocación es «gain confidence» = ganar confianza en uno mismo.", true], ["C", "reach", "«Reach» (alcanzar) se usa con metas o lugares, no con «confidence».", false], ["D", "catch", "«Catch» (atrapar, contagiarse) no se combina con «confidence».", false]]}, {"id": "EN1-153", "niv": 3, "cp": "en_p7", "e": "Gap (5)", "f": "Texto original «Repair cafés», espacio 5", "vis": "", "o": [["A", "find", "«Find hold of» no existe en inglés: «find» (encontrar) no se combina con «hold of»; la expresión correcta es «get hold of».", false], ["B", "keep", "«Keep hold of» significa no soltar algo que ya se tiene.", false], ["C", "take", "«Take hold of» significa agarrar físicamente con la mano, no conseguir un repuesto.", false], ["D", "get", "«Get hold of something» = conseguir algo difícil de encontrar: los repuestos a veces son imposibles de conseguir.", true]]}, {"id": "EN1-154", "niv": 3, "cp": "en_p7", "e": "Gap (6)", "f": "Texto original «Repair cafés», espacio 6", "vis": "", "o": [["A", "As a result", "Como muchos objetos solo necesitan un pequeño ajuste, en consecuencia («As a result») muchos visitantes salen con algo que funciona.", true], ["B", "In contrast", "«In contrast» opone dos ideas, pero aquí ambas ideas van en la misma dirección.", false], ["C", "However", "«However» introduce un contraste, pero la oración es una consecuencia de la anterior.", false], ["D", "Otherwise", "«Otherwise» (de lo contrario) presenta lo que pasaría si no se cumpliera algo; no encaja.", false]]}, {"id": "EN1-155", "niv": 3, "cp": "en_p7", "e": "Gap (7)", "f": "Texto original «Repair cafés», espacio 7", "vis": "", "o": [["A", "hit", "«Hit up» es jerga para contactar a alguien; no se combina con «conversations».", false], ["B", "beat", "«Beat up» significa golpear a alguien.", false], ["C", "strike", "«Strike up a conversation» = entablar una conversación, en especial con un desconocido.", true], ["D", "knock", "«Knock up» tiene otros significados informales; no forma esta colocación.", false]]}]}];
const CFG = {"titulo": "Simulacro 1 · Saber Pro", "modo": "simulacro", "minutos": 280, "componentes": {"lectura_critica": "Lectura Crítica", "razonamiento_cuantitativo": "Razonamiento Cuantitativo", "competencias_ciudadanas": "Competencias Ciudadanas", "comunicacion_escrita": "Comunicación Escrita", "ingles": "Inglés"}, "competencias": {"lc_local": "Identifica y entiende los contenidos locales", "lc_global": "Comprende cómo se articulan las partes del texto", "lc_reflexion": "Reflexiona a partir del texto y evalúa su contenido", "rc_interpretacion": "Interpretación y representación", "rc_formulacion": "Formulación y ejecución", "rc_argumentacion": "Argumentación", "cc_conocimientos": "Conocimientos", "cc_argumentacion": "Argumentación", "cc_multiperspectivismo": "Multiperspectivismo", "cc_sistemico": "Pensamiento sistémico", "ce_planteamiento": "Planteamiento", "ce_organizacion": "Organización del texto", "ce_expresion": "Forma de expresión", "en_p1": "Parte 1 · Vocabulario (definiciones)", "en_p2": "Parte 2 · Avisos", "en_p3": "Parte 3 · Conversaciones", "en_p4": "Parte 4 · Texto con espacios (gramática)", "en_p5": "Parte 5 · Comprensión literal", "en_p6": "Parte 6 · Comprensión inferencial", "en_p7": "Parte 7 · Texto con espacios (vocabulario y gramática)"}, "niveles": {"1": "Básico", "2": "Intermedio", "3": "Avanzado"}, "instr": {"en_p1": "Parte 1. Relaciona cada descripción con la palabra correcta de la lista (A–H). Hay más palabras de las necesarias.", "en_p2": "Parte 2. ¿Dónde puedes ver cada aviso? Elige el lugar correcto (A, B o C).", "en_p3": "Parte 3. Completa cada conversación con la respuesta más adecuada (A, B o C).", "en_p4": "Parte 4. Lee el texto y elige la palabra correcta para cada espacio (A, B o C).", "en_p5": "Parte 5. Lee el texto y responde según la información que contiene (A, B o C).", "en_p6": "Parte 6. Lee el texto y responde las preguntas (A, B, C o D).", "en_p7": "Parte 7. Lee el texto y elige la palabra correcta para cada espacio (A, B, C o D)."}, "rubrica": [["Planteamiento", ["Respondo la pregunta y tomo una posición clara (de acuerdo, en desacuerdo o parcialmente) desde el primer párrafo.", "Doy al menos dos razones desarrolladas, con ejemplos o datos, y no me limito a repetir el contexto.", "Considero una postura contraria y explico por qué la mía es más sólida."]], ["Organización", ["Mi texto tiene introducción con tesis, desarrollo con un argumento por párrafo y conclusión.", "Uso conectores variados y precisos (además, sin embargo, por lo tanto, en consecuencia, por ejemplo).", "No hay ideas repetidas ni información que no aporte a mi tesis."]], ["Forma de expresión", ["Uso un registro formal y un vocabulario preciso, sin muletillas ni expresiones coloquiales.", "Reviso ortografía, tildes, puntuación y concordancia.", "Mi texto cabe en máximo dos páginas (unas 300 a 500 palabras)."]]], "ensayos": [{"id": "CE-E01", "sim": "pro-1", "tema": "Inteligencia artificial en los trabajos universitarios", "contexto": "Las herramientas de inteligencia artificial generativa pueden redactar ensayos, resumir lecturas y resolver ejercicios en pocos segundos. Su llegada ha dividido a las comunidades universitarias. Algunos profesores proponen prohibirlas en todos los trabajos académicos, pues consideran que impiden que el estudiante aprenda a pensar y a escribir por sí mismo, y que facilitan el plagio. Otros sostienen que estas herramientas ya forman parte del mundo laboral y que la universidad debe enseñar a usarlas con criterio, por ejemplo, exigiendo que el estudiante declare cómo las empleó. Un tercer grupo propone permitirlas solo en ciertas etapas, como la búsqueda de ideas, y evaluar con más pruebas orales y escritas presenciales.", "pregunta": "¿Está de acuerdo con que las universidades prohíban el uso de la inteligencia artificial generativa en todos los trabajos académicos? Escriba un texto argumentativo en el que exponga y justifique su posición.", "ideas": ["¿Es posible comprobar que un estudiante no usó estas herramientas? ¿Qué pasa con una norma que no se puede verificar?", "Qué habilidades necesita un profesional que trabajará con asistentes automáticos.", "El riesgo de que el estudiante deje de practicar la escritura y el razonamiento.", "Formas de evaluar que muestren el proceso y no solo el producto final.", "Diferencias entre cursos: no es lo mismo una clase de redacción que una de programación."], "modelo": "Cada vez que aparece una tecnología capaz de hacer en segundos lo que antes tomaba horas, surge la tentación de prohibirla. Ocurrió, en su momento, con la calculadora en las clases de matemáticas y ocurre hoy con la inteligencia artificial generativa en las universidades. Sin embargo, considero que prohibirla en todos los trabajos académicos sería un error: la universidad no debe cerrarle la puerta a esta herramienta, sino enseñar a usarla con honestidad y criterio.\n\nEn primer lugar, una prohibición total es prácticamente imposible de hacer cumplir. Los textos producidos por estas herramientas no siempre se distinguen de los escritos por una persona, y los programas que prometen detectarlos se equivocan con frecuencia. Una regla que no puede verificarse termina castigando al estudiante honesto, que la respeta, y premiando al que la ignora sin ser descubierto. Además, convierte la relación entre profesores y estudiantes en una persecución basada en la sospecha.\n\nEn segundo lugar, la formación profesional debe preparar para el mundo en el que los egresados trabajarán. Un ingeniero, un abogado o un comunicador usarán, con toda probabilidad, asistentes de inteligencia artificial en su trabajo diario. Si la universidad se niega a abordar el tema, sus estudiantes aprenderán solos y sin orientación ética: no sabrán verificar la información que reciben, reconocer los sesgos de una respuesta automática ni dar crédito adecuadamente al aporte de una máquina.\n\nEs cierto que quienes defienden la prohibición tienen una preocupación legítima: si una máquina escribe el ensayo, el estudiante no aprende a argumentar. No obstante, este riesgo no se resuelve con una prohibición, sino con un cambio en la manera de evaluar. Un profesor puede pedir que el estudiante entregue sus borradores, que explique oralmente las decisiones de su texto o que escriba en clase una parte del trabajo. Del mismo modo, puede exigir que se declare qué herramienta se usó, para qué y cómo se verificaron sus resultados. Así, la tecnología deja de ser un atajo oculto y se convierte en objeto de reflexión.\n\nPor supuesto, habrá cursos en los que limitar el uso de estas herramientas tenga sentido, como aquellos cuyo propósito es precisamente aprender a redactar sin ayuda. Pero esa decisión debe tomarse curso por curso, según los objetivos de aprendizaje, y no mediante una regla general para toda la universidad.\n\nEn conclusión, prohibir la inteligencia artificial generativa en todos los trabajos académicos ofrecería una falsa sensación de control y dejaría a los estudiantes sin la formación que más necesitan. La tarea de la universidad no es proteger a sus estudiantes de las herramientas de su época, sino formar personas capaces de usarlas sin renunciar a pensar por sí mismas.", "comentario_modelo": "Planteamiento: la tesis aparece al final del primer párrafo y responde directamente la pregunta (está en desacuerdo con la prohibición total y propone una alternativa). Además, aporta una perspectiva que el contexto no menciona: la imposibilidad de verificar la norma y su efecto injusto sobre el estudiante honesto. Organización: introducción, dos argumentos encabezados por «En primer lugar» y «En segundo lugar», un párrafo de contraargumento y refutación («Es cierto que…», «No obstante…»), una concesión limitada («Por supuesto…») y una conclusión que retoma la tesis. Forma de expresión: registro formal, vocabulario preciso, ejemplos concretos (borradores, sustentación oral) y una comparación histórica con la calculadora que hace el texto más persuasivo.", "debil": "La inteligencia artificial es un tema muy importante hoy en día ya que todos los estudiantes la usan. Algunos profesores dicen que hay que prohibirla porque impide que el estudiante aprenda a pensar y facilita el plagio, otros dicen que ya forma parte del mundo laboral y que hay que enseñar a usarla. Las dos posiciones tienen razón. La tecnología avanza muy rapido y no se puede detener. Los jóvenes de ahora todo lo hacen con el celular y con la inteligencia artificial y eso tiene cosas buenas y cosas malas. Hay que tener cuidado porque a veces la inteligencia artificial se equivoca. En conclusión la inteligencia artificial es una herramienta que puede ser buena o mala dependiendo de como se use y cada quien debe decidir.", "comentario_debil": "El texto es impertinente: nunca dice si está de acuerdo o no con la prohibición, y afirmar que «las dos posiciones tienen razón» no es una postura parcial argumentada, sino una evasión. La segunda oración copia casi literalmente el contexto. Generaliza sin pruebas («todos los estudiantes la usan», «los jóvenes de ahora todo lo hacen con el celular») y pasa de una idea a otra sin conectores. Tiene errores de tildación («rapido» por «rápido», «como» por «cómo»), une oraciones independientes con coma omite la coma antes de la causal «ya que» («hoy en día, ya que todos…») y la coma después de «En conclusión». Para mejorarlo: tomar posición en el primer párrafo, desarrollar dos razones propias con ejemplos, responder a la postura contraria y cerrar retomando la tesis."}], "clave": "saber-pro-01.html"};

function navHTML(){
  const comps = [...new Set(ITEMS.map(i => i.caso.comp))];
  return '<div class="nav">' + comps.map(c => `<a href="#m-${c}">${esc(CFG.componentes[c])}</a>`).join('') + (ENS ? '<a href="#m-escrita">Comunicación Escrita</a>' : '') + '</div>';
}
function examen(){
  $('#main').innerHTML = navHTML() + renderList(ITEMS, 'examen') + (ENS ? `<div class="mod" id="m-escrita">Comunicación Escrita</div>` + ensayoHTML(ENS, false) : '') + `<div class="panel"><button class="btn" id="fin">Terminar y calificar</button></div>`;
  progreso(); reloj(); clearInterval(tick); tick = setInterval(reloj, 1000);
  $('#fin').onclick = () => {
    const faltan = ITEMS.length - ITEMS.filter(i => ST.r[i.id]).length;
    const sinTexto = ENS && palabras(ST.ens[ENS.id] || '') < 50;
    $('#mtxt').textContent = (faltan ? `Te faltan ${faltan} preguntas por responder. ` : '') + (sinTexto ? 'Aún no has escrito el texto argumentativo. ' : '') + (faltan || sinTexto ? '¿Quieres calificar de todos modos?' : '¿Quieres terminar y ver tu calificación?');
    $('#modal').classList.remove('hide');
  };
}
function progreso(){
  const r = ITEMS.filter(it => ST.r[it.id]).length;
  $('#prog').textContent = `Respondidas ${r}/${ITEMS.length}`;
}
$('#mno').onclick = () => $('#modal').classList.add('hide');
$('#msi').onclick = () => { $('#modal').classList.add('hide'); ST.fin = Date.now(); save(); resultados(); window.scrollTo(0,0); };
function resultados(){
  clearInterval(tick);
  const ok = ITEMS.filter(it => ST.r[it.id] === keyOf(it)).length;
  const pct = Math.round(1000*ok/ITEMS.length)/10;
  const agrupa = fn => { const m = {}; ITEMS.forEach(it => { const k = fn(it); m[k] = m[k] || [0,0]; m[k][1]++; if (ST.r[it.id]===keyOf(it)) m[k][0]++; }); return m; };
  const fila = (lab, v, cls) => `<tr class="${cls||''}"><td>${esc(lab)}</td><td class="r">${v[0]}/${v[1]}</td><td class="r">${Math.round(100*v[0]/v[1])} %</td></tr>`;
  const porMod = agrupa(it => it.caso.comp), porCp = agrupa(it => it.cp), porNiv = agrupa(it => it.niv);
  let tabla = '';
  Object.entries(porMod).forEach(([m, v]) => { tabla += fila(CFG.componentes[m], v);
    Object.entries(porCp).filter(([k]) => ITEMS.some(i => i.cp === k && i.caso.comp === m)).forEach(([k, w]) => tabla += fila(CFG.competencias[k], w, 'sub')); });
  const mins = Math.round(((ST.fin||Date.now()) - ST.t0)/60000);
  $('#timer').textContent = `Tiempo usado: ${Math.floor(mins/60) ? Math.floor(mins/60) + ' h ' : ''}${mins%60} min`;
  $('#prog').textContent = `${ok}/${ITEMS.length} aciertos`;
  const peor = Object.entries(porMod).sort((a,b) => a[1][0]/a[1][1] - b[1][0]/b[1][1])[0];
  $('#main').innerHTML = `<div class="panel"><div class="big">${String(pct).replace('.',',')} %</div>
  <p style="margin-top:4px">${ok} de ${ITEMS.length} respuestas correctas en selección múltiple. ${pct >= 75 ? 'Muy buen resultado: repasa tus errores para afianzarlo.' : pct >= 55 ? 'Vas por buen camino: refuerza los módulos y competencias con menor porcentaje.' : 'Hay que reforzar: practica por módulo y competencia, empezando por el más bajo.'} Tu módulo más bajo: <b>${esc(CFG.componentes[peor[0]])}</b>.</p>
  <p class="aviso">El Icfes reporta un puntaje de 0 a 300 por módulo calculado con un modelo estadístico que compara a todos los evaluados, por lo que no existe una conversión exacta desde el porcentaje de aciertos. Usa este resultado para comparar tu avance entre simulacros.</p>
  <h3>Por módulo y competencia</h3><table>${tabla}</table>
  <h3>Por dificultad</h3><table>${Object.entries(porNiv).map(([k,v]) => fila(CFG.niveles[k], v)).join('')}</table>
  <div class="row" style="margin-top:14px">${ENS ? '<button class="btn" id="vtexto">Evaluar mi texto</button>' : ''}<button class="btn sec" id="solo">Ver solo mis errores</button><button class="btn sec" id="todas">Ver todas</button><button class="btn sec" id="otra">Reiniciar el simulacro</button></div></div><div id="rev"></div>`;
  const rev = errs => { const l = errs ? ITEMS.filter(it => ST.r[it.id] !== keyOf(it)) : ITEMS; $('#rev').innerHTML = (errs && !l.length ? '<div class="panel">¡No tuviste errores!</div>' : renderList(l, 'review')); };
  const texto = () => { $('#rev').innerHTML = ensayoHTML(ENS, true); puntajeRubrica(ENS.id); };
  if (ENS) { texto(); $('#vtexto').onclick = texto; } else rev(true);
  $('#solo').onclick = () => rev(true); $('#todas').onclick = () => rev(false);
  $('#otra').onclick = () => { ST = {r:{}, chk:{}, ens:{}}; save(); inicio(); window.scrollTo(0,0); };
}

document.addEventListener('click', e => {
  const v = e.target.closest('[data-ver]');
  if (v) { VER[v.dataset.ver] = true; ST.ver = VER; save(); escritura(); return; }
  const b = e.target.closest('button.op'); if (!b || b.disabled) return;
  if (CFG.modo === 'simulacro' && ST.fin) return;
  ST.r[b.dataset.id] = b.dataset.l; save();
  const it = ITEMS.find(i => i.id === b.dataset.id);
  const n = b.closest('.item').querySelector('.n').textContent.replace('.','');
  b.closest('.item').outerHTML = itemHTML(it, n, CFG.modo === 'practica' ? 'practica' : 'examen');
  if (CFG.modo === 'practica') { const resp = LIST.filter(i => ST.r[i.id]); const ok = resp.filter(i => ST.r[i.id]===keyOf(i)).length; $('#prog').textContent = `${ok}/${resp.length} aciertos`; $('#pst').textContent = `${LIST.length} preguntas · respondidas ${resp.length} · aciertos ${ok} (${Math.round(100*ok/resp.length)} %)`; }
  else progreso();
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset && t.dataset.ens) { ST.ens[t.dataset.ens] = t.value; save(); const p = $('#pc-' + t.dataset.ens); if (p) p.textContent = palabras(t.value) + ' palabras'; }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset && t.dataset.chk) { ST.chk[t.dataset.chk] = t.checked; save(); puntajeRubrica(t.dataset.chk.split(':')[0]); }
});

if (CFG.modo === 'practica') practica();
else if (CFG.modo === 'escritura') { if (CFG.ensayos.length) escritura(); else $('#main').innerHTML = '<div class="panel">Sin consignas.</div>'; }
else if (ST.fin) resultados();
else if (ST.t0) examen();
else inicio();
</script>
</body>
</html>
