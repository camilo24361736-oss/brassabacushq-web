: [["A", "Yes, I'm here.", "«I'm here» (estoy aquí) no tiene relación con de quién es la caja de herramientas.", false], ["B", "It's a hammer.", "Nombra otro objeto (un martillo) y no dice de quién es la caja.", false], ["C", "No, it's Carlos's.", "Correcta. Responde la pregunta de sí/no e indica el dueño: «No, es de Carlos».", true]]}, {"id": "EN2-214", "niv": 2, "cp": "en_p3", "e": "\"Could you show me how to use the new projector?\"", "f": "Texto original elaborado para este simulacro, conversación de la parte 3", "vis": "", "o": [["A", "Of course. I'll show you after lunch.", "Correcta. «Could you…?» es una petición cortés; «Of course» la acepta y propone un momento para hacerlo.", true], ["B", "Yes, it's quite new and very modern.", "Solo describe el proyector; no acepta ni rechaza la petición de enseñar a usarlo.", false], ["C", "Thanks, I'll show you how it works.", "Agradece como si le ofrecieran algo y luego invierte los papeles: es el otro quien pidió que le enseñaran.", false]]}, {"id": "EN2-215", "niv": 2, "cp": "en_p3", "e": "\"There's a customer on the phone asking for a refund.\"", "f": "Texto original elaborado para este simulacro, conversación de la parte 3", "vis": "", "o": [["A", "No, I don't have a phone at home.", "Habla de su teléfono de la casa; no responde a la llamada de la clienta.", false], ["B", "Yes, the refund was very fast.", "Habla de un reembolso ya hecho, pero la clienta apenas lo está pidiendo.", false], ["C", "Can you put her through to me, please?", "Correcta. Ante una clienta que llama a pedir un reembolso, lo natural es pedir que le pasen la llamada («put her through») para atenderla.", true]]}, {"id": "EN2-216", "niv": 2, "cp": "en_p3", "e": "\"How did the job interview go?\"", "f": "Texto original elaborado para este simulacro, conversación de la parte 3", "vis": "", "o": [["A", "Better than I expected.", "Correcta. «How did it go?» pregunta cómo le fue; «Better than I expected» (mejor de lo que esperaba) responde eso.", true], ["B", "By bus, it's faster.", "Interpreta «go» como desplazarse; la pregunta es por el resultado de la entrevista.", false], ["C", "It goes at ten tomorrow.", "Usa presente y futuro, pero la pregunta es sobre una entrevista que ya ocurrió.", false]]}, {"id": "EN2-217", "niv": 3, "cp": "en_p3", "e": "\"I'm afraid we've run out of spare parts for this model.\"", "f": "Texto original elaborado para este simulacro, conversación de la parte 3", "vis": "", "o": [["A", "Don't worry, they aren't dangerous.", "Toma «I'm afraid» literalmente (tener miedo); aquí es una forma cortés de dar una mala noticia («me temo que»).", false], ["B", "Then let's order some more.", "Correcta. «Run out of» = quedarse sin; si no hay repuestos, lo lógico es pedir más.", true], ["C", "Great, so we can fix it today.", "Si no hay repuestos, no se puede reparar hoy; la respuesta contradice la situación.", false]]}]}, {"comp": "ingles", "sim": "tyt-2", "ind": "Historia de un invento: el casco de seguridad", "tt": "", "texto": "Read the text and choose the right word for each gap.\n\nThe hat that went to work\n\nWhen Edward W. Bullard came back (1) ______ the First World War, he joined his father's company in San Francisco, which sold lamps and other equipment to miners. He knew that falling rocks were a serious danger (2) ______ the men who worked underground. Remembering the steel helmet he had worn as a soldier, he designed a cheaper hat for workers. It was made of canvas and glue, and the material was softened with steam, so he called it the \"Hard Boiled Hat\". The hat (3) ______ patented in 1919 and soon became popular with miners. In the 1930s, the chief engineer of the Golden Gate Bridge asked Bullard to adapt his hats for the bridge workers, who could be hit by falling rivets. The bridge became the first construction site in the United States with an official \"hard hat area\". Today, hard hats are made of plastic, and they protect millions of workers (4) ______ day. On most building sites they are compulsory: if you work on one, you (5) ______ wear a hard hat.", "vis": "", "items": [{"id": "EN2-218", "niv": 1, "cp": "en_p4", "e": "Gap (1)", "f": "Texto original elaborado para este simulacro (historia del casco de seguridad), espacio 1", "vis": "", "o": [["A", "from", "Correcta. «come back from» = regresar de: «came back from the First World War» (regresó de la Primera Guerra Mundial).", true], ["B", "of", "«come back of» no existe; el origen de un regreso se expresa con «from».", false], ["C", "at", "«at» indica un lugar fijo, no el punto de partida de un regreso.", false]]}, {"id": "EN2-219", "niv": 2, "cp": "en_p4", "e": "Gap (2)", "f": "Texto original elaborado para este simulacro (historia del casco de seguridad), espacio 2", "vis": "", "o": [["A", "on", "«a danger on the men» no es correcto; la preposición con «danger» es «to».", false], ["B", "to", "Correcta. Se dice «a danger to someone» (un peligro para alguien).", true], ["C", "at", "«a danger at the men» no es correcto; «at» no introduce a quien sufre el peligro.", false]]}, {"id": "EN2-220", "niv": 2, "cp": "en_p4", "e": "Gap (3)", "f": "Texto original elaborado para este simulacro (historia del casco de seguridad), espacio 3", "vis": "", "o": [["A", "were", "«were» es plural y no concuerda con «The hat».", false], ["B", "did", "«did patented» es incorrecto: la voz pasiva se forma con «be» + participio, no con «did».", false], ["C", "was", "Correcta. Voz pasiva en pasado con sujeto singular: «The hat was patented in 1919» (el casco fue patentado).", true]]}, {"id": "EN2-221", "niv": 1, "cp": "en_p4", "e": "Gap (4)", "f": "Texto original elaborado para este simulacro (historia del casco de seguridad), espacio 4", "vis": "", "o": [["A", "much", "«much» se usa con sustantivos incontables; «much day» es incorrecto.", false], ["B", "every", "Correcta. «every day» (todos los días): «every» va con un sustantivo contable en singular.", true], ["C", "many", "«many» exige plural («many days»); «many day» es incorrecto.", false]]}, {"id": "EN2-222", "niv": 2, "cp": "en_p4", "e": "Gap (5)", "f": "Texto original elaborado para este simulacro (historia del casco de seguridad), espacio 5", "vis": "", "o": [["A", "needn't", "«needn't» significa «no es necesario», lo contrario de una norma obligatoria.", false], ["B", "might", "«might» expresa solo posibilidad («quizás lo uses»), lo cual contradice que el casco sea obligatorio.", false], ["C", "must", "Correcta. Si el casco es obligatorio («compulsory») en la obra, quien trabaja allí «must wear one» (debe usar uno): «must» expresa obligación.", true]]}]}, {"comp": "ingles", "sim": "tyt-2", "ind": "Historia de un invento: el extintor portátil", "tt": "", "texto": "Read the text and choose the right word for each gap.\n\nFire in your hands\n\nFor centuries, people fought fires with buckets (1) ______ water, which were often passed from hand to hand. In the early 1800s, a British inventor called George William Manby designed (2) ______ different solution: a copper container that one person could carry. It held about 13 litres of a chemical solution, and compressed air inside it pushed the liquid out onto the fire. Later in the century, inventors created extinguishers (3) ______ used a chemical reaction to produce pressure. Today there are different extinguishers for different kinds of fire. For example, you should never use water on an electrical fire, (4) ______ water conducts electricity. That is why most workplaces must have the right extinguishers, and every worker should know how to use one before an emergency (5) ______.", "vis": "", "items": [{"id": "EN2-223", "niv": 1, "cp": "en_p4", "e": "Gap (1)", "f": "Texto original elaborado para este simulacro (historia del extintor), espacio 1", "vis": "", "o": [["A", "of", "Correcta. «buckets of water» (baldes de agua): «of» indica el contenido.", true], ["B", "at", "«at» indica lugar o momento; no expresa el contenido de un recipiente.", false], ["C", "on", "«buckets on water» significaría baldes sobre el agua, lo cual no tiene sentido.", false]]}, {"id": "EN2-224", "niv": 2, "cp": "en_p4", "e": "Gap (2)", "f": "Texto original elaborado para este simulacro (historia del extintor), espacio 2", "vis": "", "o": [["A", "an", "«an» se usa antes de sonido vocálico; «different» empieza por consonante.", false], ["B", "a", "Correcta. Se presenta por primera vez una solución (sustantivo contable singular), y «different» empieza por consonante: «a different solution».", true], ["C", "any", "«any» se usa en preguntas y negaciones; «designed any different solution» no es correcto en una afirmación.", false]]}, {"id": "EN2-225", "niv": 2, "cp": "en_p4", "e": "Gap (3)", "f": "Texto original elaborado para este simulacro (historia del extintor), espacio 3", "vis": "", "o": [["A", "who", "«who» se usa para personas; los extintores son cosas.", false], ["B", "where", "«where» se refiere a lugares y no puede ser sujeto de «used».", false], ["C", "that", "Correcta. «that» es el pronombre relativo para cosas: «extinguishers that used a chemical reaction».", true]]}, {"id": "EN2-226", "niv": 2, "cp": "en_p4", "e": "Gap (4)", "f": "Texto original elaborado para este simulacro (historia del extintor), espacio 4", "vis": "", "o": [["A", "because", "Correcta. «because» introduce la causa: no se usa agua en un incendio eléctrico porque el agua conduce la electricidad.", true], ["B", "although", "«although» (aunque) expresa contraste; no hay contraste entre la advertencia y su razón.", false], ["C", "so", "«so» introduce una consecuencia; invertiría la relación lógica de la oración.", false]]}, {"id": "EN2-227", "niv": 3, "cp": "en_p4", "e": "Gap (5)", "f": "Texto original elaborado para este simulacro (historia del extintor), espacio 5", "vis": "", "o": [["A", "will happen", "En inglés no se usa «will» después de «before» en oraciones temporales; se dice «before it happens».", false], ["B", "happens", "Correcta. Después de conjunciones de tiempo como «before» se usa presente simple con sentido futuro: «before an emergency happens».", true], ["C", "happened", "El pasado no encaja: el consejo se refiere a una emergencia futura.", false]]}]}, {"comp": "ingles", "sim": "tyt-2", "ind": "Oficios: una aprendiz de electricista", "tt": "", "texto": "Read the text and answer the questions.\n\nMy first month as an apprentice\n\n(1) My name is Daniela and I am 19. Last month I started an apprenticeship with a small electrical company in Medellín. I spend three days a week at work and two days at a technical training centre, where I study safety rules and electrical theory.\n\n(2) My supervisor, Don Hernán, has been an electrician for thirty years. On my first day, he did not let me touch any tools. Instead, he asked me to watch him carefully and write down every step. \"The most dangerous electrician is the one who is in a hurry,\" he told me.\n\n(3) In the second week, I helped him change the old wiring in a bakery. We had to start at five in the morning because the owner did not want to close the shop during the day. It was tiring, but I learned more in those three days than in a month of reading.\n\n(4) The hardest part for me is not the technical work. It is talking to customers. Some of them ask a lot of questions, and others are angry because the electricity is off. Don Hernán says that explaining things clearly is also part of the job, so now I practise with him before each visit.", "vis": "", "items": [{"id": "EN2-228", "niv": 1, "cp": "en_p5", "e": "How does Daniela divide her week?", "f": "Texto original elaborado para este simulacro (aprendiz de electricista), párrafo 1", "vis": "", "o": [["A", "She works three days and studies two days.", "Correcta. Párrafo 1: «three days a week at work and two days at a technical training centre».", true], ["B", "She works five days and studies at night.", "El texto no menciona estudios nocturnos; reparte la semana entre trabajo y centro de formación.", false], ["C", "She studies three days and works two days.", "Invierte los datos: son tres días de trabajo y dos de estudio.", false]]}, {"id": "EN2-229", "niv": 2, "cp": "en_p5", "e": "What did Don Hernán ask Daniela to do on her first day?", "f": "Texto original elaborado para este simulacro (aprendiz de electricista), párrafo 2", "vis": "", "o": [["A", "use the tools while he supervised her", "El texto dice lo contrario: «he did not let me touch any tools».", false], ["B", "read a safety manual at home", "El texto no menciona ningún manual; las normas de seguridad las estudia en el centro de formación.", false], ["C", "observe him and take notes on each step", "Correcta. Párrafo 2: «he asked me to watch him carefully and write down every step» (observarlo y anotar cada paso).", true]]}, {"id": "EN2-230", "niv": 2, "cp": "en_p5", "e": "Why did they start work early at the bakery?", "f": "Texto original elaborado para este simulacro (aprendiz de electricista), párrafo 3", "vis": "", "o": [["A", "The electricity was off in the afternoon.", "El texto no dice que la luz se fuera por la tarde.", false], ["B", "Daniela had classes later that day.", "El texto no relaciona el horario con las clases de Daniela.", false], ["C", "The owner wanted to keep the shop open during the day.", "Correcta. Párrafo 3: «the owner did not want to close the shop during the day».", true]]}, {"id": "EN2-231", "niv": 2, "cp": "en_p5", "e": "What does Daniela find most difficult?", "f": "Texto original elaborado para este simulacro (aprendiz de electricista), párrafo 4", "vis": "", "o": [["A", "communicating with customers", "Correcta. Párrafo 4: «The hardest part for me is not the technical work. It is talking to customers».", true], ["B", "understanding electrical theory", "El texto dice que lo más difícil no es lo técnico, sino hablar con los clientes.", false], ["C", "getting up early in the morning", "Madrugar fue cansado («tiring»), pero no es lo que ella señala como lo más difícil.", false]]}]}, {"comp": "ingles", "sim": "tyt-2", "ind": "Ciencia y trabajo técnico: el observatorio ALMA", "tt": "", "texto": "Read the text and answer the questions.\n\nWorking at 5,000 metres\n\n(1) In the Atacama Desert in northern Chile, one of the driest places on Earth, 66 large antennas point at the sky. Together they form ALMA, a radio telescope that studies cold gas and dust in space, where new stars and planets are born. The antennas stand on the Chajnantor plateau, about 5,000 metres above sea level, because the air there is very dry and thin, which gives the telescope a clearer view.\n\n(2) However, the same conditions that are good for astronomy are hard on people. At that altitude, each breath contains only about half the oxygen it contains at sea level. For this reason, most of the staff (engineers, technicians and astronomers) work at a base camp at 2,900 metres, where the control room, the laboratories and the offices are. From there, they can operate the antennas remotely.\n\n(3) Some jobs, of course, must be done on the plateau. Technicians always go up in teams of at least two, and paramedics check on them while they work. Their time at the high site is limited, and nobody is allowed to sleep there. When an antenna has to be moved, a giant transporter vehicle carries it slowly along a special road; the trip up from the base camp takes several hours.\n\n(4) The work schedule is also unusual. Many employees work for eight days in a row and then go home for six days of rest. For people who love both technology and wild landscapes, it is a job like no other.", "vis": "", "items": [{"id": "EN2-232", "niv": 1, "cp": "en_p5", "e": "Why are the ALMA antennas on the Chajnantor plateau?", "f": "Texto original elaborado para este simulacro (observatorio ALMA, Chile), párrafo 1", "vis": "", "o": [["A", "Because it is close to a large city.", "El texto no menciona ninguna ciudad cercana; habla del desierto.", false], ["B", "Because the dry, thin air gives a clearer view.", "Correcta. Párrafo 1: «because the air there is very dry and thin, which gives the telescope a clearer view».", true], ["C", "Because the weather there is warm all year.", "El texto no habla de temperatura cálida; la razón es el aire seco y enrarecido.", false]]}, {"id": "EN2-233", "niv": 2, "cp": "en_p5", "e": "Where do most ALMA employees work?", "f": "Texto original elaborado para este simulacro (observatorio ALMA, Chile), párrafo 2", "vis": "", "o": [["A", "next to the antennas on the plateau", "Solo algunos trabajos se hacen en la meseta; la mayoría del personal está en el campamento base.", false], ["B", "in offices in other countries", "El texto ubica al personal en el campamento base en Chile, no en otros países.", false], ["C", "at a base camp at a lower altitude", "Correcta. Párrafo 2: «most of the staff … work at a base camp at 2,900 metres», más abajo que las antenas.", true]]}, {"id": "EN2-234", "niv": 2, "cp": "en_p5", "e": "What does the text say about the antennas?", "f": "Texto original elaborado para este simulacro (observatorio ALMA, Chile), párrafo 2", "vis": "", "o": [["A", "They have to be moved every day.", "El texto dice cómo se mueven cuando es necesario, no que se muevan a diario.", false], ["B", "They can be controlled from far away.", "Correcta. Párrafo 2: «they can operate the antennas remotely» (pueden operarlas a distancia).", true], ["C", "Each one needs a person standing next to it.", "Se operan a distancia desde el campamento base; no necesitan a alguien al lado.", false]]}, {"id": "EN2-235", "niv": 3, "cp": "en_p5", "e": "Which rule applies to people who work on the plateau?", "f": "Texto original elaborado para este simulacro (observatorio ALMA, Chile), párrafo 3", "vis": "", "o": [["A", "They cannot stay there overnight.", "Correcta. Párrafo 3: «nobody is allowed to sleep there» (nadie puede dormir allí), es decir, no pueden pasar la noche.", true], ["B", "They must always work alone.", "El texto dice lo contrario: suben siempre «in teams of at least two».", false], ["C", "They can stay there as long as they want.", "El texto dice que «their time at the high site is limited» (su tiempo allí es limitado).", false]]}, {"id": "EN2-236", "niv": 3, "cp": "en_p5", "e": "According to paragraph 4, many ALMA employees…", "f": "Texto original elaborado para este simulacro (observatorio ALMA, Chile), párrafo 4", "vis": "", "o": [["A", "go home every evening after work.", "Trabajan ocho días seguidos antes de ir a casa; no regresan cada noche.", false], ["B", "have several days off after each work period.", "Correcta. Párrafo 4: trabajan «eight days in a row and then go home for six days of rest» (seis días de descanso).", true], ["C", "work for six days and rest for eight.", "Invierte los números: son ocho días de trabajo y seis de descanso.", false]]}]}, {"comp": "ingles", "sim": "tyt-2", "ind": "Oficios: de la oficina al taller de bicicletas", "tt": "", "texto": "Read the text and answer the questions.\n\nFrom spreadsheets to spokes\n\n(1) For six years I worked in the accounts department of a large insurance company. The salary was good, the office had air conditioning, and my parents were proud of me. Still, every Friday afternoon I felt the same thing: I could not remember anything I had actually made during the week.\n\n(2) At weekends I repaired bicycles for friends in my garage. It started as a favour, but soon neighbours I had never met were knocking on my door with flat tyres and broken brakes. When a customer once paid me with a bag of mangoes because she had no cash, I laughed, and I realised I was happier that afternoon than on any day at the office.\n\n(3) Two years ago I took a technical course in bicycle mechanics and opened a small workshop near the university. The first months were hard. I earned less than half of my old salary, and I made some expensive mistakes, like ordering parts that nobody needed. My father did not mention the shop for almost a year.\n\n(4) Today the workshop has two employees and a waiting list on Saturdays. I still use what I learned at the insurance company: I keep careful records, I know how to read a budget, and I never buy stock without checking the numbers first. People sometimes ask me if I regret leaving a \"real job\". I tell them that fixing something with your hands, and seeing a person ride away smiling, is as real as it gets.", "vis": "", "items": [{"id": "EN2-237", "niv": 2, "cp": "en_p6", "e": "What can we infer about how the writer felt at the insurance company?", "f": "Texto original elaborado para este simulacro (de oficinista a mecánico de bicicletas), párrafo 1", "vis": "", "o": [["A", "The writer was always afraid of losing the job at the company.", "Nada en el texto habla de miedo a perder el empleo.", false], ["B", "The salary was too low to cover the writer's monthly needs.", "El texto dice lo contrario: «The salary was good».", false], ["C", "The writer did not get along with the other people in the office.", "El texto no menciona problemas con los compañeros.", false], ["D", "The job did not give the writer a sense of creating anything.", "Correcta. Párrafo 1: cada viernes no podía recordar nada que hubiera «actually made» (hecho realmente) durante la semana; se infiere que el trabajo no le daba sensación de crear algo.", true]]}, {"id": "EN2-238", "niv": 2, "cp": "en_p6", "e": "Why does the writer mention the bag of mangoes?", "f": "Texto original elaborado para este simulacro (de oficinista a mecánico de bicicletas), párrafo 2", "vis": "", "o": [["A", "To show that the workshop was not profitable in its first months.", "La anécdota ocurre cuando arreglaba bicicletas como favor, antes de abrir el taller; las dificultades económicas se narran en el párrafo 3.", false], ["B", "To explain why the writer later started selling tropical fruit.", "El texto no dice que el autor vendiera fruta.", false], ["C", "To show when the writer discovered what brought real happiness.", "Correcta. Párrafo 2: tras ese pago con mangos «I realised I was happier that afternoon than on any day at the office»; es el momento en que descubre qué le da satisfacción.", true], ["D", "To complain that some customers did not pay a fair price.", "El autor se ríe de la situación; no es una queja.", false]]}, {"id": "EN2-239", "niv": 3, "cp": "en_p6", "e": "What does paragraph 3 suggest about the writer's father?", "f": "Texto original elaborado para este simulacro (de oficinista a mecánico de bicicletas), párrafo 3", "vis": "", "o": [["A", "He helped the writer to open the workshop.", "El texto no dice que el padre ayudara; su silencio sugiere lo contrario.", false], ["B", "He did not approve of the writer's decision at first.", "Correcta. Que el padre «did not mention the shop for almost a year» (no mencionó el taller durante casi un año) sugiere desaprobación inicial; además, los padres estaban orgullosos del empleo anterior (párrafo 1).", true], ["C", "He also worked as a bicycle mechanic.", "No hay ninguna información sobre el oficio del padre.", false], ["D", "He lent the writer money to buy spare parts.", "El texto no menciona ningún préstamo del padre.", false]]}, {"id": "EN2-240", "niv": 3, "cp": "en_p6", "e": "In paragraph 4, what does the writer suggest about the years at the insurance company?", "f": "Texto original elaborado para este simulacro (de oficinista a mecánico de bicicletas), párrafo 4", "vis": "", "o": [["A", "They are the main reason why the workshop now has a waiting list.", "El texto no relaciona la lista de espera con su experiencia en la aseguradora.", false], ["B", "They were a complete waste of time that taught the writer nothing.", "Contradice el párrafo 4, donde el autor dice que todavía usa lo que aprendió allí.", false], ["C", "They taught the writer how to repair bicycles and other machines.", "Lo aprendido fue contabilidad y manejo de números; la mecánica la aprendió en un curso técnico.", false], ["D", "They provided skills that are useful for running the workshop.", "Correcta. Párrafo 4: «I still use what I learned at the insurance company»: llevar registros, leer un presupuesto y revisar números antes de comprar.", true]]}, {"id": "EN2-241", "niv": 3, "cp": "en_p6", "e": "When the writer says that fixing things \"is as real as it gets\", the intention is to…", "f": "Texto original elaborado para este simulacro (de oficinista a mecánico de bicicletas), párrafo 4", "vis": "", "o": [["A", "reject the idea that manual work is less valuable than an office job.", "Correcta. Responde a quienes hablan de un «real job» (trabajo de verdad) afirmando que el trabajo manual es tan real como cualquiera; rechaza la idea de que valga menos.", true], ["B", "admit that the writer sometimes regrets leaving the office.", "La frase responde a la pregunta sobre arrepentimiento, pero para negarlo, no para admitirlo.", false], ["C", "show that the workshop now earns more than the insurance company.", "El texto no compara los ingresos del taller con los de la aseguradora.", false], ["D", "suggest that all office workers should become mechanics.", "Es una generalización que el texto no hace; el autor habla de su propia experiencia.", false]]}, {"id": "EN2-242", "niv": 3, "cp": "en_p6", "e": "Which of these best describes the writer's attitude in the text?", "f": "Texto original elaborado para este simulacro (de oficinista a mecánico de bicicletas), párrafo 1-4", "vis": "", "o": [["A", "sorry about leaving, but unwilling to admit it", "Cuando le preguntan si se arrepiente, responde defendiendo su nuevo oficio; nada sugiere un arrepentimiento oculto.", false], ["B", "happy with the change, though aware of its costs", "Correcta. El autor muestra satisfacción (párrafos 2 y 4) y reconoce los costos: menos ingresos, errores caros y el silencio del padre (párrafo 3).", true], ["C", "thankful for the office, but tired of manual work", "El autor valora lo que aprendió en la oficina, pero no está cansado del trabajo manual: lo considera lo más «real».", false], ["D", "proud of the workshop, but worried about money", "Las dificultades económicas fueron de los primeros meses; hoy el taller tiene empleados y lista de espera, y el autor no expresa preocupación por el dinero.", false]]}]}, {"comp": "ingles", "sim": "tyt-2", "ind": "Seguridad laboral en el taller", "tt": "", "texto": "Read the text and choose the best word for each gap.\n\nSafe habits in the workshop\n\nAccidents in a workshop rarely happen by chance. Most of them can be (1) ______ with a few simple habits. First, always (2) ______ protective equipment: safety glasses, gloves and closed shoes are not optional. Second, keep your work area tidy. Cables, tools and pieces of metal on the floor are easy to (3) ______ over. Third, never use a machine you have not been trained on, even if it looks simple. If you are not sure how something works, ask your supervisor (4) ______ of trying it yourself. Fourth, check your tools before you start. A damaged cable or a loose handle should be (5) ______ immediately. Finally, do not work when you are very tired: many mistakes happen at the end of a long shift, when people stop (6) ______ attention.", "vis": "", "items": [{"id": "EN2-243", "niv": 2, "cp": "en_p7", "e": "Gap (1)", "f": "Texto original elaborado para este simulacro (seguridad en el taller), espacio 1", "vis": "", "o": [["A", "lost", "«lose» (perder) no tiene sentido con accidentes.", false], ["B", "missed", "«miss» significa perder (un bus) o fallar (un tiro); no significa prevenir un accidente.", false], ["C", "avoided", "Correcta. «can be avoided» (pueden evitarse): la mayoría de los accidentes se evitan con hábitos sencillos.", true], ["D", "escaped", "«escape» significa escapar de un lugar o peligro; «accidents can be escaped» no es natural.", false]]}, {"id": "EN2-244", "niv": 1, "cp": "en_p7", "e": "Gap (2)", "f": "Texto original elaborado para este simulacro (seguridad en el taller), espacio 2", "vis": "", "o": [["A", "clothe", "«clothe» (vestir a alguien) es formal y no se usa con equipo de protección.", false], ["B", "put", "«put» necesita una partícula o un lugar («put on»); «put protective equipment» solo es incompleto.", false], ["C", "wear", "Correcta. Con ropa y equipo de protección se usa «wear» (llevar puesto): «wear protective equipment».", true], ["D", "dress", "«dress» significa vestirse o vestir a alguien; no lleva como objeto el equipo («dress equipment» es incorrecto).", false]]}, {"id": "EN2-245", "niv": 2, "cp": "en_p7", "e": "Gap (3)", "f": "Texto original elaborado para este simulacro (seguridad en el taller), espacio 3", "vis": "", "o": [["A", "trip", "Correcta. «trip over something» = tropezarse con algo: los cables y herramientas en el piso hacen que la gente se tropiece.", true], ["B", "throw", "«throw over» significa lanzar por encima; no describe el riesgo de tropezar.", false], ["C", "drop", "«drop over» no es una expresión correcta; «drop» significa dejar caer.", false], ["D", "slide", "«slide over» significa deslizarse por encima, no tropezar con algo.", false]]}, {"id": "EN2-246", "niv": 2, "cp": "en_p7", "e": "Gap (4)", "f": "Texto original elaborado para este simulacro (seguridad en el taller), espacio 4", "vis": "", "o": [["A", "because", "«because of trying it yourself» (a causa de intentarlo) no tiene sentido como consejo.", false], ["B", "instead", "Correcta. «instead of + -ing» (en lugar de): pregúntele al supervisor en lugar de intentarlo usted mismo.", true], ["C", "despite", "«despite» nunca va seguido de «of»; además, no expresa la idea de sustitución.", false], ["D", "rather", "«rather» se usa en «rather than»; «rather of» es incorrecto.", false]]}, {"id": "EN2-247", "niv": 2, "cp": "en_p7", "e": "Gap (5)", "f": "Texto original elaborado para este simulacro (seguridad en el taller), espacio 5", "vis": "", "o": [["A", "broken", "Romper una herramienta que ya está dañada no tiene sentido como consejo de seguridad.", false], ["B", "lent", "Prestar («lend») una herramienta dañada sería peligroso; no es lo que el texto aconseja.", false], ["C", "thrown", "«throw» solo significa lanzar; para «botar» se necesita «thrown away», que no aparece.", false], ["D", "replaced", "Correcta. Un cable dañado o un mango flojo deben «be replaced» (ser reemplazados) de inmediato.", true]]}, {"id": "EN2-248", "niv": 3, "cp": "en_p7", "e": "Gap (6)", "f": "Texto original elaborado para este simulacro (seguridad en el taller), espacio 6", "vis": "", "o": [["A", "making", "«make attention» no es una colocación posible en inglés.", false], ["B", "doing", "«do attention» no es una colocación posible en inglés.", false], ["C", "taking", "«take attention» no es la colocación correcta; se dice «pay attention».", false], ["D", "paying", "Correcta. La colocación es «pay attention» (prestar atención), y «stop + -ing» significa dejar de hacer algo: «stop paying attention».", true]]}]}, {"comp": "ingles", "sim": "tyt-2", "ind": "Oficios y viajes por Latinoamérica: el sombrero de paja toquilla", "tt": "", "texto": "Read the text and choose the best word for each gap.\n\nThe hat with the wrong name\n\nDespite its name, the Panama hat does not come from Panama. It is (1) ______ by hand in Ecuador, using fibres from the toquilla plant, which grows on the country's coast. The fibres are boiled, dried and cut into thin strips before the work can (2) ______. A simple hat can be finished in a day, but a very fine one may (3) ______ several months of work.\n\nIn the nineteenth century, many of these hats were shipped through Panama on their way to other countries, and later thousands of workers wore them to protect themselves from the sun while they were (4) ______ the Panama Canal. Buyers abroad started to call them \"Panama hats\", and the name (5) ______.\n\nToday, making these hats is still an important (6) ______ of income for many families. In 2012, UNESCO recognised this traditional craft as part of the Intangible Cultural Heritage of Humanity, which has helped to (7) ______ attention to the skills of Ecuadorian hat makers.", "vis": "", "items": [{"id": "EN2-249", "niv": 2, "cp": "en_p7", "e": "Gap (1)", "f": "Texto original elaborado para este simulacro (sombrero de paja toquilla), espacio 1", "vis": "", "o": [["A", "grown", "«grown» (cultivado) se aplica a la planta, no al sombrero.", false], ["B", "printed", "«printed» (impreso) no tiene relación con fabricar un sombrero con fibras.", false], ["C", "woven", "Correcta. «woven» es el participio de «weave» (tejer): el sombrero se teje a mano con fibras de la planta de toquilla cortadas en tiras delgadas.", true], ["D", "painted", "«painted» (pintado) no describe cómo se elabora un sombrero de fibras vegetales.", false]]}, {"id": "EN2-250", "niv": 2, "cp": "en_p7", "e": "Gap (2)", "f": "Texto original elaborado para este simulacro (sombrero de paja toquilla), espacio 2", "vis": "", "o": [["A", "begin", "Correcta. «before the work can begin» (antes de que pueda comenzar el trabajo): primero se prepara la fibra y después empieza la elaboración.", true], ["B", "open", "«open» (abrir) no se usa con un proceso como el tejido.", false], ["C", "turn", "«turn» (girar, volverse) no completa la idea de iniciar el tejido.", false], ["D", "arrive", "«arrive» (llegar) se usa con personas o cosas que se desplazan, no con un proceso.", false]]}, {"id": "EN2-251", "niv": 2, "cp": "en_p7", "e": "Gap (3)", "f": "Texto original elaborado para este simulacro (sombrero de paja toquilla), espacio 3", "vis": "", "o": [["A", "pass", "«pass» (pasar) no lleva como objeto «months of work» con este sentido.", false], ["B", "take", "Correcta. «take + tiempo» indica cuánto tiempo requiere algo: un sombrero fino puede tomar varios meses de trabajo.", true], ["C", "last", "«last» significa durar (cuánto tiempo existe o funciona algo), no cuánto tiempo toma hacerlo.", false], ["D", "spend", "«spend» exige una persona como sujeto («the weaver spends months»), no el sombrero.", false]]}, {"id": "EN2-252", "niv": 3, "cp": "en_p7", "e": "Gap (4)", "f": "Texto original elaborado para este simulacro (sombrero de paja toquilla), espacio 4", "vis": "", "o": [["A", "doing", "«do» no se usa con obras de infraestructura; «doing the canal» no es natural.", false], ["B", "rising", "«rise» es intransitivo (subir, elevarse) y no puede llevar «the Panama Canal» como objeto.", false], ["C", "growing", "«grow» (cultivar, crecer) no se aplica a un canal.", false], ["D", "building", "Correcta. Un canal se construye: «while they were building the Panama Canal» (mientras construían el canal).", true]]}, {"id": "EN2-253", "niv": 3, "cp": "en_p7", "e": "Gap (5)", "f": "Texto original elaborado para este simulacro (sombrero de paja toquilla), espacio 5", "vis": "", "o": [["A", "kept", "«keep» en este sentido necesita un objeto («they kept the name»).", false], ["B", "joined", "«join» (unirse) no expresa que un nombre se haya quedado en el uso.", false], ["C", "stuck", "Correcta. «the name stuck» = el nombre se quedó, se popularizó para siempre («stick» en sentido figurado).", true], ["D", "fixed", "«fix» (arreglar, fijar) necesita un objeto y no significa que el nombre perdurara.", false]]}, {"id": "EN2-254", "niv": 3, "cp": "en_p7", "e": "Gap (6)", "f": "Texto original elaborado para este simulacro (sombrero de paja toquilla), espacio 6", "vis": "", "o": [["A", "source", "Correcta. La colocación es «source of income» (fuente de ingresos).", true], ["B", "spring", "«spring» es una fuente de agua o un manantial; no se usa con «income».", false], ["C", "root", "«root» (raíz) no forma colocación con «income».", false], ["D", "origin", "«origin» (origen) no forma la colocación con «income»; se dice «source of income».", false]]}, {"id": "EN2-255", "niv": 3, "cp": "en_p7", "e": "Gap (7)", "f": "Texto original elaborado para este simulacro (sombrero de paja toquilla), espacio 7", "vis": "", "o": [["A", "pull", "«pull attention» no es una colocación usual en inglés.", false], ["B", "draw", "Correcta. La colocación es «draw attention to» (llamar la atención sobre algo).", true], ["C", "put", "«put attention to» no es correcto; se dice «draw attention to» o «pay attention to».", false], ["D", "take", "«take attention to» no es correcto; no forma colocación con «attention» en este sentido.", false]]}]}];
const CFG = {"titulo": "Simulacro 2 · Saber TyT", "modo": "simulacro", "minutos": 280, "componentes": {"lectura_critica": "Lectura Crítica", "razonamiento_cuantitativo": "Razonamiento Cuantitativo", "competencias_ciudadanas": "Competencias Ciudadanas", "comunicacion_escrita": "Comunicación Escrita", "ingles": "Inglés"}, "competencias": {"lc_local": "Identifica y entiende los contenidos locales", "lc_global": "Comprende cómo se articulan las partes del texto", "lc_reflexion": "Reflexiona a partir del texto y evalúa su contenido", "rc_interpretacion": "Interpretación y representación", "rc_formulacion": "Formulación y ejecución", "rc_argumentacion": "Argumentación", "cc_conocimientos": "Conocimientos", "cc_argumentacion": "Argumentación", "cc_multiperspectivismo": "Multiperspectivismo", "cc_sistemico": "Pensamiento sistémico", "ce_planteamiento": "Planteamiento", "ce_organizacion": "Organización del texto", "ce_expresion": "Forma de expresión", "en_p1": "Parte 1 · Vocabulario (definiciones)", "en_p2": "Parte 2 · Avisos", "en_p3": "Parte 3 · Conversaciones", "en_p4": "Parte 4 · Texto con espacios (gramática)", "en_p5": "Parte 5 · Comprensión literal", "en_p6": "Parte 6 · Comprensión inferencial", "en_p7": "Parte 7 · Texto con espacios (vocabulario y gramática)"}, "niveles": {"1": "Básico", "2": "Intermedio", "3": "Avanzado"}, "instr": {"en_p1": "Parte 1. Relaciona cada descripción con la palabra correcta de la lista (A–H). Hay más palabras de las necesarias.", "en_p2": "Parte 2. ¿Dónde puedes ver cada aviso? Elige el lugar correcto (A, B o C).", "en_p3": "Parte 3. Completa cada conversación con la respuesta más adecuada (A, B o C).", "en_p4": "Parte 4. Lee el texto y elige la palabra correcta para cada espacio (A, B o C).", "en_p5": "Parte 5. Lee el texto y responde según la información que contiene (A, B o C).", "en_p6": "Parte 6. Lee el texto y responde las preguntas (A, B, C o D).", "en_p7": "Parte 7. Lee el texto y elige la palabra correcta para cada espacio (A, B, C o D)."}, "rubrica": [["Planteamiento", ["Respondo la pregunta y tomo una posición clara (de acuerdo, en desacuerdo o parcialmente) desde el primer párrafo.", "Doy al menos dos razones desarrolladas, con ejemplos o datos, y no me limito a repetir el contexto.", "Considero una postura contraria y explico por qué la mía es más sólida."]], ["Organización", ["Mi texto tiene introducción con tesis, desarrollo con un argumento por párrafo y conclusión.", "Uso conectores variados y precisos (además, sin embargo, por lo tanto, en consecuencia, por ejemplo).", "No hay ideas repetidas ni información que no aporte a mi tesis."]], ["Forma de expresión", ["Uso un registro formal y un vocabulario preciso, sin muletillas ni expresiones coloquiales.", "Reviso ortografía, tildes, puntuación y concordancia.", "Mi texto cabe en máximo dos páginas (unas 300 a 500 palabras)."]]], "ensayos": [{"id": "CE-E05", "sim": "tyt-2", "tema": "Experiencia exigida a recién egresados", "contexto": "Muchos técnicos y tecnólogos recién graduados encuentran ofertas de empleo que piden uno o dos años de experiencia. Algunas empresas explican que necesitan personal capaz de rendir desde el primer día, pues no cuentan con tiempo ni recursos para entrenar. Los egresados responden que es imposible ganar experiencia si nadie les da la primera oportunidad. Algunos proponen que las prácticas, los proyectos de grado y los trabajos independientes se reconozcan como experiencia; otros sugieren que el Estado ofrezca incentivos a las empresas que contraten a jóvenes sin experiencia.", "pregunta": "¿Está de acuerdo con que las empresas exijan experiencia laboral previa a los técnicos y tecnólogos recién egresados? Escriba un texto argumentativo en el que exponga y justifique su posición.", "ideas": ["El componente práctico de la formación técnica y tecnológica.", "Otras formas de comprobar habilidades: pruebas técnicas, periodo de prueba.", "Qué gana una empresa al formar a un egresado y qué pierde si nunca lo hace.", "Cargos en los que la experiencia sí es indispensable.", "El costo de una vacante abierta durante meses."], "modelo": "Pocas situaciones resultan tan frustrantes para un recién graduado como leer una oferta de empleo que parece escrita para él, salvo por una línea: «Experiencia mínima de dos años». Se trata de un círculo vicioso: no se consigue empleo sin experiencia, y no se adquiere experiencia sin empleo. Por eso, estoy en desacuerdo con que las empresas exijan experiencia laboral previa a los técnicos y tecnólogos recién egresados, al menos para los cargos de entrada.\n\nEn primer lugar, la formación técnica y tecnológica ya incluye un componente práctico. Un tecnólogo en mantenimiento electrónico o un técnico en cocina suele haber pasado cientos de horas en talleres, laboratorios y prácticas en empresas reales. Exigirle además dos años de experiencia equivale a desconocer ese aprendizaje y a tratar el título como si no certificara nada. Si una empresa duda de las habilidades de un candidato, tiene herramientas más justas para comprobarlas, como una prueba técnica o un periodo de prueba.\n\nEn segundo lugar, la exigencia perjudica a las propias empresas. Al cerrarles la puerta a los recién egresados, renuncian a personas que llegan con conocimientos actualizados, disposición para aprender y menos vicios adquiridos. Además, un joven al que se le da la primera oportunidad puede desarrollar un sentido de pertenencia que reduce la rotación. Contratar a alguien con experiencia puede parecer más eficiente a corto plazo, pero una empresa que nunca forma a nadie depende siempre de lo que otros hayan formado.\n\nLas empresas argumentan que no tienen tiempo ni recursos para entrenar personal. Este argumento merece atención, sobre todo en el caso de los pequeños negocios. No obstante, el entrenamiento de un egresado técnico no parte de cero: se trata de adaptar a la rutina de la empresa a alguien que ya domina los fundamentos del oficio. Asignarle un compañero con experiencia durante las primeras semanas cuesta mucho menos que mantener una vacante abierta durante meses mientras aparece el candidato ideal.\n\nDesde luego, hay cargos en los que la experiencia es indispensable, como la supervisión de una obra o la dirección de un equipo de trabajo. En esos casos, pedirla es razonable. El problema aparece cuando el requisito se vuelve una costumbre y se aplica incluso a puestos de auxiliar o asistente, que, por su naturaleza, deberían ser la puerta de entrada al mundo laboral.\n\nEn conclusión, exigir experiencia a quien acaba de terminar su formación es cerrarle la única puerta por la que puede adquirirla. Las empresas que reconocen las prácticas, evalúan habilidades concretas y asumen una parte del entrenamiento no les hacen un favor a los jóvenes: invierten en su propio futuro.", "comentario_modelo": "Planteamiento: la tesis responde la pregunta y precisa su alcance («al menos para los cargos de entrada»); la idea del «círculo vicioso» resume el problema con claridad. El texto aporta argumentos que el contexto no menciona, como el costo de una vacante abierta o la existencia de pruebas técnicas para verificar habilidades. Organización: dos argumentos introducidos con ordinales («En primer lugar», «En segundo lugar»), un párrafo que responde a la objeción de las empresas («No obstante…»), una concesión que delimita la tesis («Desde luego…») y una conclusión que retoma la imagen de la puerta. Forma de expresión: ejemplos de oficios técnicos concretos, vocabulario preciso, uso correcto de los dos puntos y de las comillas para citar la oferta de empleo, y un cierre con un giro persuasivo («no les hacen un favor a los jóvenes: invierten en su propio futuro»).", "debil": "Las empresas necesitan personal capaz de rendir desde el primer día. Pero los egresados dicen que es imposible ganar experiencia si nadie les da la primera oportunidad. Es un problema muy grave en el país, la juventud está sin empleo y eso genera delincuencia, drogas y muchos problemas sociales. Los jóvenes de hoy no quieren trabajar y solo quieren estar en redes sociales. Las empresas deberían ser más conscientes. Tambien el estado debería ayudar. En mi barrio hay muchos muchachos que estudiaron y siguen sin trabajo. Yo creo que es un tema que se debe analizar desde muchos puntos de vista para encontrar una solución que beneficie a todos.", "comentario_debil": "Las dos primeras oraciones reproducen el contexto sin elaborarlo, y el texto nunca dice si está de acuerdo o en desacuerdo con exigir experiencia. Además, se contradice: pide que las empresas sean «más conscientes», pero afirma que «los jóvenes de hoy no quieren trabajar». Encadena consecuencias exageradas sin demostrarlas (desempleo, delincuencia, drogas). Hay errores de norma: «Tambien» sin tilde, «estado» con minúscula cuando se refiere a la institución y una coma que une dos oraciones independientes. Para mejorarlo: tomar posición desde el inicio, apoyarla con un ejemplo de un oficio técnico y responder al argumento de las empresas sobre el costo del entrenamiento."}], "clave": "saber-tyt-02.html"};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY = 'sim-saber:' + CFG.clave;
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}
function save(){try{localStorage.setItem(KEY, JSON.stringify(ST))}catch(e){}}
let ST = load();
ST.r = ST.r || {};
ST.chk = ST.chk || {};

$('#tit').textContent = CFG.titulo;
const ITEMS = [];
DATA.forEach(c => c.items.forEach(it => { it.caso = c; ITEMS.push(it); }));
const keyOf = it => it.o.find(o => o[3])[0];
const palabras = t => (t.trim().match(/\S+/g) || []).length;

function justHTML(it){
  const many = it.o.length > 4;
  return '<div class="just">' + it.o.filter(o => !many || o[3] || ST.r[it.id] === o[0]).map(o => `<div><b>${o[0]}.</b> <span class="${o[3]?'okt':'not'}">${o[3]?'Es correcta.':'Es incorrecta.'}</span> ${esc(o[2])}</div>`).join('') +
    `<div class="src">${esc(CFG.competencias[it.cp])} · Referencia: ${esc(it.f)}</div></div>`;
}
function itemHTML(it, n, mode){
  const r = ST.r[it.id];
  const reveal = mode === 'review' || (CFG.modo === 'practica' && r);
  let h = `<div class="item" id="i-${it.id}"><p class="enun"><span class="n">${n}.</span> <span class="niv">${CFG.niveles[it.niv]}</span> ${esc(it.e)}</p>${it.vis||''}<div class="${it.o.length>4?'ops8':''}">`;
  it.o.forEach(o => {
    let cls = '';
    if (reveal) { if (o[3]) cls = 'ok'; else if (r === o[0]) cls = 'no'; }
    else if (r === o[0]) cls = 'sel';
    h += `<button class="op ${cls}" data-id="${it.id}" data-l="${o[0]}" ${reveal?'disabled':''}><span class="l">${o[0]}.</span><span>${esc(o[1])}</span></button>`;
  });
  h += '</div>';
  if (reveal) {
    if (mode === 'review') h += `<div class="${r===keyOf(it)?'res-ok':'res-no'}" style="font-size:14px;margin-top:4px">${r ? (r===keyOf(it)?'Respondiste ' + r + ': correcto.':'Respondiste ' + r + '. La respuesta correcta es ' + keyOf(it) + '.') : 'Sin responder. La respuesta correcta es ' + keyOf(it) + '.'}</div>`;
    h += justHTML(it);
  }
  return h + '</div>';
}
function renderList(list, mode){
  let h = '', last = null, comp = null, parte = null, n = 0;
  const showMods = CFG.modo !== 'practica' || mode === 'review';
  list.forEach((it, idx) => {
    n++;
    if (it.caso !== last) {
      last = it.caso;
      if (it.caso.comp !== comp) { comp = it.caso.comp; parte = null; if (showMods) h += `<div class="mod" id="m-${comp}">${esc(CFG.componentes[comp])}</div>`; }
      if (comp === 'ingles' && it.cp !== parte) { parte = it.cp; h += `<div class="inst">${esc(CFG.instr[parte])}</div>`; }
      const k = last.items.filter(x => list.includes(x)).length;
      if (k > 1) h += `<div class="inst">Responda las preguntas ${n} a ${n + k - 1} de acuerdo con la siguiente información</div>`;
      let tag = CFG.modo === 'practica' ? CFG.componentes[comp] + (last.tt ? ' · ' + last.tt : '') + (last.ind ? ' · ' + last.ind : '') : (last.tt || '');
      h += `<div class="caso">${tag ? `<div class="tag">${esc(tag)}</div>` : ''}<p>${esc(last.texto)}</p>${last.vis||''}</div>`;
    }
    h += itemHTML(it, n, mode);
  });
  return h;
}

let LIST = [];
let FILTRO = Object.assign({comp:'', cp:'', niv:'', ex:''}, ST.f || {});
function practica(){
  const comps = Object.entries(CFG.componentes).filter(([k]) => ITEMS.some(i => i.caso.comp === k)).map(([k,v]) => `<option value="${k}" ${FILTRO.comp===k?'selected':''}>${esc(v)}</option>`).join('');
  const cps = Object.entries(CFG.competencias).filter(([k]) => ITEMS.some(i => i.cp === k && (!FILTRO.comp || i.caso.comp === FILTRO.comp))).map(([k,v]) => `<option value="${k}" ${FILTRO.cp===k?'selected':''}>${esc(v)}</option>`).join('');
  if (FILTRO.cp && !ITEMS.some(i => i.cp === FILTRO.cp && (!FILTRO.comp || i.caso.comp === FILTRO.comp))) FILTRO.cp = '';
  const nivs = Object.entries(CFG.niveles).map(([k,v]) => `<option value="${k}" ${FILTRO.niv===k?'selected':''}>${esc(v)}</option>`).join('');
  const list = ITEMS.filter(it => (!FILTRO.comp || it.caso.comp===FILTRO.comp) && (!FILTRO.cp || it.cp===FILTRO.cp) && (!FILTRO.niv || String(it.niv)===FILTRO.niv) && (!FILTRO.ex || it.caso.sim.startsWith(FILTRO.ex)));
  const resp = list.filter(it => ST.r[it.id]); const ok = resp.filter(it => ST.r[it.id]===keyOf(it));
  $('#main').innerHTML = `<div class="panel"><p style="margin-top:0">Elige módulo, competencia y dificultad. Al responder verás de inmediato si acertaste y la explicación. Las preguntas de los simulacros también están aquí: si quieres presentarlos «en limpio», hazlos antes de practicar.</p>
  <div class="row"><select id="fc"><option value="">Todos los módulos</option>${comps}</select>
  <select id="fp"><option value="">Todas las competencias</option>${cps}</select>
  <select id="fn"><option value="">Todas las dificultades</option>${nivs}</select>
  <select id="fe"><option value="">Saber Pro y TyT</option><option value="pro" ${FILTRO.ex==='pro'?'selected':''}>Preguntas de los simulacros Saber Pro</option><option value="tyt" ${FILTRO.ex==='tyt'?'selected':''}>Preguntas de los simulacros Saber TyT</option><option value="practica" ${FILTRO.ex==='practica'?'selected':''}>Solo banco extra de práctica</option></select>
  <button class="btn sec" id="borrar">Borrar mis respuestas</button></div>
  <p class="stat" id="pst" style="margin-bottom:0">${list.length} preguntas · respondidas ${resp.length} · aciertos ${ok.length}${resp.length? ' (' + Math.round(100*ok.length/resp.length) + ' %)':''}</p></div>` + renderList(list, 'practica');
  $('#prog').textContent = `${ok.length}/${resp.length} aciertos`;
  [['fc','comp'],['fp','cp'],['fn','niv'],['fe','ex']].forEach(([id,k]) => $('#'+id).onchange = e => { FILTRO[k] = e.target.value; if (k==='comp') FILTRO.cp=''; ST.f = FILTRO; save(); practica(); });
  LIST = list;
  $('#borrar').onclick = () => { list.forEach(it => delete ST.r[it.id]); save(); practica(); };
}

function ensayoHTML(e, mostrar){
  const txt = ST.ens[e.id] || '';
  let h = `<div class="panel" id="ens-${e.id}"><div class="tag">Comunicación Escrita · ${esc(e.tema)}</div><p style="white-space:pre-line">${esc(e.contexto)}</p><p><b>${esc(e.pregunta)}</b></p>
  <p class="aviso">Escribe un texto argumentativo de máximo dos páginas (unas 300 a 500 palabras). Tiempo sugerido: 30 a 40 minutos. Tu texto se guarda en este navegador.</p>

  if (mostrar) {
    h += `<h3 style="color:var(--pri)">Autoevalúa tu texto</h3><p class="aviso">El examen real lo califican evaluadores con estos tres aspectos. Marca lo que tu texto cumple; lo que quede sin marcar es lo que debes mejorar.</p>${rubricaHTML(e.id)}
    <p class="stat" id="pr-${e.id}"></p>
    <h3 style="color:var(--pri)">Texto modelo (nivel alto)</h3><div class="modelo">${esc(e.modelo)}</div><p class="src">${esc(e.comentario_modelo)}</p>
    <h3 style="color:var(--pri)">Respuesta débil y cómo mejorarla</h3><div class="modelo">${esc(e.debil)}</div><p class="src">${esc(e.comentario_debil)}</p>`;
  } else if (CFG.modo === 'escritura') {
    h += `<button class="btn" data-ver="${e.id}">Ver rúbrica y texto modelo</button>`;
  }
  return h + '</div>';
}
function puntajeRubrica(id){
  let n = 0, t = 0; CFG.rubrica.forEach(([a, xs], ai) => xs.forEach((x, i) => { t++; if (ST.chk[id+':'+ai+':'+i]) n++; }));
  const el = $('#pr-' + id); if (el) el.textContent = `Cumples ${n} de ${t} criterios.`;
}
let VER = ST.ver || {};
function escritura(){
  const sel = ST.sel || CFG.ensayos[0].id;
  const e = CFG.ensayos.find(x => x.id === sel) || CFG.ensayos[0];
  $('#main').innerHTML = `<div class="panel"><p style="margin-top:0">Elige una consigna, escribe tu texto y luego compáralo con la rúbrica y con el texto modelo. Las consignas de los seis simulacros también están aquí.</p>
  <select id="fs">${CFG.ensayos.map((x, i) => `<option value="${x.id}" ${x.id===e.id?'selected':''}>${i+1}. ${esc(x.tema)}</option>`).join('')}</select></div>` + ensayoHTML(e, !!VER[e.id]);
  $('#prog').textContent = `${CFG.ensayos.length} consignas`;
  $('#fs').onchange = ev => { ST.sel = ev.target.value; save(); escritura(); };
  puntajeRubrica(e.id);
}

// ---------- SIMULACRO ----------
let tick = null;
const ENS = CFG.ensayos[0];
function inicio(){
  const n = ITEMS.length, cnt = {};
  ITEMS.forEach(it => cnt[it.caso.comp] = (cnt[it.caso.comp]||0) + 1);
  const h = Math.floor(CFG.minutos/60), m = CFG.minutos%60;
  $('#main').innerHTML = `<div class="panel"><h2 style="margin-top:0">Instrucciones</h2>
  <p>Este simulacro reproduce la estructura de la primera sesión del examen (módulos genéricos): <b>${n} preguntas</b> de selección múltiple con única respuesta${ENS ? ' y <b>un texto argumentativo</b>' : ''}.</p>
  <table>${Object.entries(cnt).map(([k,v]) => `<tr><td>${esc(CFG.componentes[k])}</td><td class="r">${v} preguntas</td></tr>`).join('')}${ENS ? `<tr><td>Comunicación Escrita</td><td class="r">1 texto</td></tr>` : ''}</table>
  <p>Tiempo: <b>${h} h ${m ? m + ' min' : ''}</b>, como en el examen real. Distribúyelo: unos 50 minutos por módulo de 35 preguntas, 60 para Inglés y 35 para el texto. Cuando se acaba el tiempo puedes seguir, pero el cronómetro lo indica.</p>
  <p>Tus respuestas se guardan en este navegador: puedes cerrar y continuar después. Al terminar verás tu porcentaje por módulo, por competencia y por dificultad, la explicación de cada pregunta y una autoevaluación de tu texto con un modelo comentado.</p>
  <button class="btn" id="go">${ST.t0 ? 'Continuar el simulacro' : 'Comenzar'}</button></div>`;
  $('#prog').textContent = `${n} preguntas`;
  $('#go').onclick = () => { if (!ST.t0) { ST.t0 = Date.now(); save(); } examen(); };
}
function reloj(){
  const rest = CFG.minutos*60 - Math.floor((Date.now() - ST.t0)/1000);
  const a = Math.abs(rest), hh = Math.floor(a/3600), mm = Math.floor(a%3600/60), ss = a%60;
  const t = (rest < 0 ? '+' : '') + (hh ? hh + ':' : '') + String(mm).padStart(2,'0') + ':' + String(ss).padStart(2,'0');
  $('#timer').textContent = rest < 0 ? 'Tiempo cumplido ' + t : '⏱ ' + t;
  $('#timer').classList.toggle('low', rest < 600);
}
function navHTML(){
  const comps = [...new Set(ITEMS.map(i => i.caso.comp))];
  return '<div class="nav">' + comps.map(c => `<a href="#m-${c}">${esc(CFG.componentes[c])}</a>`).join('') + (ENS ? '<a href="#m-escrita">Comunicación Escrita</a>' : '') + '</div>';
}
function examen(){
  $('#main').innerHTML = navHTML() + renderList(ITEMS, 'examen') + (ENS ? `<div class="mod" id="m-escrita">Comunicación Escrita</div>` + ensayoHTML(ENS, false) : '') + `<div class="panel"><button class="btn" id="fin">Terminar y calificar</button></div>`;
  progreso(); reloj(); clearInterval(tick); tick = setInterval(reloj, 1000);
  $('#fin').onclick = () => {
    const faltan = ITEMS.length - ITEMS.filter(i => ST.r[i.id]).length;
    const sinTexto = ENS && palabras(ST.ens[ENS.id] || '') < 50;
    $('#mtxt').textContent = (faltan ? `Te faltan ${faltan} preguntas por responder. ` : '') + (sinTexto ? 'Aún no has escrito el texto argumentativo. ' : '') + (faltan || sinTexto ? '¿Quieres calificar de todos modos?' : '¿Quieres terminar y ver tu calificación?');
    $('#modal').classList.remove('hide');
  };
}
function progreso(){
  const r = ITEMS.filter(it => ST.r[it.id]).length;
  $('#prog').textContent = `Respondidas ${r}/${ITEMS.length}`;
}
$('#mno').onclick = () => $('#modal').classList.add('hide');
$('#msi').onclick = () => { $('#modal').classList.add('hide'); ST.fin = Date.now(); save(); resultados(); window.scrollTo(0,0); };
function resultados(){
  clearInterval(tick);
  const ok = ITEMS.filter(it => ST.r[it.id] === keyOf(it)).length;
  const pct = Math.round(1000*ok/ITEMS.length)/10;
  const agrupa = fn => { const m = {}; ITEMS.forEach(it => { const k = fn(it); m[k] = m[k] || [0,0]; m[k][1]++; if (ST.r[it.id]===keyOf(it)) m[k][0]++; }); return m; };
  const fila = (lab, v, cls) => `<tr class="${cls||''}"><td>${esc(lab)}</td><td class="r">${v[0]}/${v[1]}</td><td class="r">${Math.round(100*v[0]/v[1])} %</td></tr>`;
  const porMod = agrupa(it => it.caso.comp), porCp = agrupa(it => it.cp), porNiv = agrupa(it => it.niv);
  let tabla = '';
  Object.entries(porMod).forEach(([m, v]) => { tabla += fila(CFG.componentes[m], v);
    Object.entries(porCp).filter(([k]) => ITEMS.some(i => i.cp === k && i.caso.comp === m)).forEach(([k, w]) => tabla += fila(CFG.competencias[k], w, 'sub')); });
  const mins = Math.round(((ST.fin||Date.now()) - ST.t0)/60000);
  $('#timer').textContent = `Tiempo usado: ${Math.floor(mins/60) ? Math.floor(mins/60) + ' h ' : ''}${mins%60} min`;
  $('#prog').textContent = `${ok}/${ITEMS.length} aciertos`;
  const peor = Object.entries(porMod).sort((a,b) => a[1][0]/a[1][1] - b[1][0]/b[1][1])[0];
  $('#main').innerHTML = `<div class="panel"><div class="big">${String(pct).replace('.',',')} %</div>
  <p style="margin-top:4px">${ok} de ${ITEMS.length} respuestas correctas en selección múltiple. ${pct >= 75 ? 'Muy buen resultado: repasa tus errores para afianzarlo.' : pct >= 55 ? 'Vas por buen camino: refuerza los módulos y competencias con menor porcentaje.' : 'Hay que reforzar: practica por módulo y competencia, empezando por el más bajo.'} Tu módulo más bajo: <b>${esc(CFG.componentes[peor[0]])}</b>.</p>
  <p class="aviso">El Icfes reporta un puntaje de 0 a 300 por módulo calculado con un modelo estadístico que compara a todos los evaluados, por lo que no existe una conversión exacta desde el porcentaje de aciertos. Usa este resultado para comparar tu avance entre simulacros.</p>
  <h3>Por módulo y competencia</h3><table>${tabla}</table>
  <h3>Por dificultad</h3><table>${Object.entries(porNiv).map(([k,v]) => fila(CFG.niveles[k], v)).join('')}</table>
  <div class="row" style="margin-top:14px">${ENS ? '<button class="btn" id="vtexto">Evaluar mi texto</button>' : ''}<button class="btn sec" id="solo">Ver solo mis errores</button><button class="btn sec" id="todas">Ver todas</button><button class="btn sec" id="otra">Reiniciar el simulacro</button></div></div><div id="rev"></div>`;
  const rev = errs => { const l = errs ? ITEMS.filter(it => ST.r[it.id] !== keyOf(it)) : ITEMS; $('#rev').innerHTML = (errs && !l.length ? '<div class="panel">¡No tuviste errores!</div>' : renderList(l, 'review')); };
  const texto = () => { $('#rev').innerHTML = ensayoHTML(ENS, true); puntajeRubrica(ENS.id); };
  if (ENS) { texto(); $('#vtexto').onclick = texto; } else rev(true);
  $('#solo').onclick = () => rev(true); $('#todas').onclick = () => rev(false);
  $('#otra').onclick = () => { ST = {r:{}, chk:{}, ens:{}}; save(); inicio(); window.scrollTo(0,0); };
}

document.addEventListener('click', e => {
  const v = e.target.closest('[data-ver]');
  if (v) { VER[v.dataset.ver] = true; ST.ver = VER; save(); escritura(); return; }
  const b = e.target.closest('button.op'); if (!b || b.disabled) return;
  if (CFG.modo === 'simulacro' && ST.fin) return;
  ST.r[b.dataset.id] = b.dataset.l; save();
  const it = ITEMS.find(i => i.id === b.dataset.id);
  const n = b.closest('.item').querySelector('.n').textContent.replace('.','');
  b.closest('.item').outerHTML = itemHTML(it, n, CFG.modo === 'practica' ? 'practica' : 'examen');
  if (CFG.modo === 'practica') { const resp = LIST.filter(i => ST.r[i.id]); const ok = resp.filter(i => ST.r[i.id]===keyOf(i)).length; $('#prog').textContent = `${ok}/${resp.length} aciertos`; $('#pst').textContent = `${LIST.length} preguntas · respondidas ${resp.length} · aciertos ${ok} (${Math.round(100*ok/resp.length)} %)`; }
  else progreso();
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset && t.dataset.ens) { ST.ens[t.dataset.ens] = t.value; save(); const p = $('#pc-' + t.dataset.ens); if (p) p.textContent = palabras(t.value) + ' palabras'; }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset && t.dataset.chk) { ST.chk[t.dataset.chk] = t.checked; save(); puntajeRubrica(t.dataset.chk.split(':')[0]); }
});

if (CFG.modo === 'practica') practica();
else if (CFG.modo === 'escritura') { if (CFG.ensayos.length) escritura(); else $('#main').innerHTML = '<div class="panel">Sin consignas.</div>'; }
else if (ST.fin) resultados();
else if (ST.t0) examen();
else inicio();
</script>
</body>
</html>
