 ÷ 0,565) en lugar de entre el área de la lámina.", false], ["D", "78,5 %", "Es el porcentaje de la lámina que sí se aprovecha.", false]]}]}, {"comp": "razonamiento_cuantitativo", "sim": "tyt-2", "ind": "Códigos de ubicación en una bodega", "tt": "", "texto": "El sistema de inventario de una bodega asigna a cada estante un código formado por una letra, que puede ser A, B, C, D o E, seguida de dos dígitos del 0 al 9. Los dígitos pueden repetirse; por ejemplo, B07 y D44 son códigos válidos.", "vis": "", "items": [{"id": "RCT-225", "niv": 2, "cp": "rc_formulacion", "e": "¿Cuántos códigos distintos se pueden formar con este sistema?", "f": "Cálculo propio a partir de los datos del caso (datos ficticios).", "vis": "", "o": [["A", "25", "Suma las posibilidades (5 + 10 + 10); para posiciones sucesivas se multiplican.", false], ["B", "100", "Cuenta solo las combinaciones de los dos dígitos y olvida las 5 letras.", false], ["C", "450", "Calcula 5 × 10 × 9, como si los dígitos no pudieran repetirse.", false], ["D", "500", "Por el principio de multiplicación: 5 letras × 10 dígitos × 10 dígitos = 500.", true]]}, {"id": "RCT-226", "niv": 1, "cp": "rc_interpretacion", "e": "¿Cuál de los siguientes NO es un código válido en este sistema?", "f": "Cálculo propio a partir de los datos del caso (datos ficticios).", "vis": "", "o": [["A", "«F12»", "No es válido: la letra F no está entre las permitidas (A, B, C, D o E).", true], ["B", "«A00»", "Es válido: letra permitida (A) y dos dígitos, aunque se repitan.", false], ["C", "«C07»", "Es válido: la letra C está permitida y los dígitos 0 y 7 también.", false], ["D", "«E99»", "Es válido: la letra E está permitida y los dígitos pueden repetirse.", false]]}]}, {"comp": "razonamiento_cuantitativo", "sim": "tyt-2", "ind": "Combustible de un camión de reparto", "tt": "", "texto": "Un camión de reparto sale con el tanque lleno, con 60 litros de combustible. La gráfica 1 muestra cuánto combustible queda en el tanque según la distancia recorrida. El consumo por kilómetro es constante.", "vis": "<div class=\"vfig\"><svg class=\"vg\" viewBox=\"0 0 560 320\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Gráfica 1. Combustible en el tanque según la distancia\" font-family=\"Arial, sans-serif\" font-size=\"12\"><rect width=\"560\" height=\"320\" fill=\"#ffffff\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"13\" fill=\"#1d2433\">Gráfica 1. Combustible en el tanque según la distancia<\/text><line x1=\"60\" y1=\"258.0\" x2=\"540\" y2=\"258.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"262.0\" text-anchor=\"end\" fill=\"#3a4356\">0<\/text><line x1=\"60\" y1=\"221.0\" x2=\"540\" y2=\"221.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"225.0\" text-anchor=\"end\" fill=\"#3a4356\">10<\/text><line x1=\"60\" y1=\"184.0\" x2=\"540\" y2=\"184.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"188.0\" text-anchor=\"end\" fill=\"#3a4356\">20<\/text><line x1=\"60\" y1=\"147.0\" x2=\"540\" y2=\"147.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"151.0\" text-anchor=\"end\" fill=\"#3a4356\">30<\/text><line x1=\"60\" y1=\"110.0\" x2=\"540\" y2=\"110.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"114.0\" text-anchor=\"end\" fill=\"#3a4356\">40<\/text><line x1=\"60\" y1=\"73.0\" x2=\"540\" y2=\"73.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"77.0\" text-anchor=\"end\" fill=\"#3a4356\">50<\/text><line x1=\"60\" y1=\"36.0\" x2=\"540\" y2=\"36.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"40.0\" text-anchor=\"end\" fill=\"#3a4356\">60<\/text><line x1=\"60\" y1=\"258\" x2=\"540\" y2=\"258\" stroke=\"#3a4356\"/><line x1=\"60\" y1=\"258\" x2=\"60\" y2=\"36\" stroke=\"#3a4356\"/><text transform=\"translate(14,147.0) rotate(-90)\" text-anchor=\"middle\" fill=\"#3a4356\">Combustible (L)<\/text><text x=\"300.0\" y=\"312\" text-anchor=\"middle\" fill=\"#3a4356\">Distancia recorrida (km)<\/text><text x=\"100.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">0<\/text><text x=\"180.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">80<\/text><text x=\"260.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">160<\/text><text x=\"340.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">240<\/text><text x=\"420.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">320<\/text><text x=\"500.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">400<\/text><polyline fill=\"none\" stroke=\"#1660a8\" stroke-width=\"2.5\" points=\"100.0,36.0 180.0,73.0 260.0,110.0 340.0,147.0 420.0,184.0 500.0,221.0\"/><circle cx=\"100.0\" cy=\"36.0\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"100.0\" y=\"28.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">60<\/text><circle cx=\"180.0\" cy=\"73.0\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"180.0\" y=\"65.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">50<\/text><circle cx=\"260.0\" cy=\"110.0\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"260.0\" y=\"102.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">40<\/text><circle cx=\"340.0\" cy=\"147.0\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"340.0\" y=\"139.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">30<\/text><circle cx=\"420.0\" cy=\"184.0\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"420.0\" y=\"176.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">20<\/text><circle cx=\"500.0\" cy=\"221.0\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"500.0\" y=\"213.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">10<\/text><\/svg><\/div>", "items": [{"id": "RCT-227", "niv": 1, "cp": "rc_interpretacion", "e": "Según la gráfica, ¿cuánto combustible queda en el tanque después de recorrer 240 km?", "f": "Cálculo propio a partir de los datos del caso (datos ficticios).", "vis": "", "o": [["A", "20 L.", "Corresponde a 320 km recorridos, no a 240 km.", false], ["B", "30 L.", "La gráfica muestra 30 L para 240 km.", true], ["C", "40 L.", "Corresponde a 160 km recorridos.", false], ["D", "50 L.", "Corresponde a 80 km recorridos.", false]]}, {"id": "RCT-228", "niv": 2, "cp": "rc_interpretacion", "e": "¿Cuántos litros de combustible consume el camión por cada 100 km recorridos?", "f": "Cálculo propio a partir de los datos del caso (datos ficticios).", "vis": "", "o": [["A", "8 L.", "8 es el número de kilómetros que recorre con 1 litro (80 km ÷ 10 L), no los litros por cada 100 km.", false], ["B", "10 L.", "Son los litros que consume cada 80 km, no cada 100 km.", false], ["C", "12,5 L.", "Gasta 10 L cada 80 km, es decir, 10 ÷ 80 = 0,125 L por km; en 100 km: 12,5 L.", true], ["D", "80 L.", "Son los kilómetros recorridos con 10 L; además, 80 L superaría la capacidad del tanque.", false]]}, {"id": "RCT-229", "niv": 2, "cp": "rc_formulacion", "e": "Si mantiene el mismo consumo, ¿cuántos kilómetros puede recorrer el camión desde que sale con el tanque lleno hasta agotar el combustible?", "f": "Cálculo propio a partir de los datos del caso (datos ficticios).", "vis": "", "o": [["A", "400 km.", "Es el último valor que muestra la gráfica, pero en ese punto todavía quedan 10 L.", false], ["B", "480 km.", "Recorre 80 km por cada 10 L, o sea 8 km por litro: 60 × 8 = 480 km.", true], ["C", "600 km.", "Supone 10 km por litro; el camión recorre 8 km por litro.", false], ["D", "750 km.", "Multiplica 60 por 12,5 (litros por cada 100 km), como si fueran kilómetros por litro.", false]]}, {"id": "RCT-230", "niv": 2, "cp": "rc_argumentacion", "e": "El conductor afirma: «La cantidad de combustible en el tanque es inversamente proporcional a la distancia recorrida, porque cuando una aumenta la otra disminuye». ¿Es correcta su afirmación?", "f": "Cálculo propio a partir de los datos del caso (datos ficticios).", "vis": "", "o": [["A", "No, porque el producto no es constante: 80 × 50 = 4.000 y 160 × 40 = 6.400.", "En una proporcionalidad inversa el producto es constante; aquí cambia. La relación es lineal decreciente: combustible = 60 − distancia ÷ 8.", true], ["B", "Sí, porque cada 80 km el combustible baja 10 L, y eso es una proporción inversa.", "Una disminución constante describe una relación lineal decreciente, no una proporcionalidad inversa.", false], ["C", "No, porque el combustible baja siempre la misma cantidad, 10 L cada 80 km, y eso solo ocurre cuando dos cantidades son directamente proporcionales.", "Una disminución constante describe una relación lineal, no una proporcionalidad directa: en una proporcionalidad directa el cociente sería constante, y 50 ÷ 80 = 0,625 no es igual a 40 ÷ 160 = 0,25. Además, aquí una cantidad baja cuando la otra sube.", false], ["D", "Sí, porque al pasar de 80 a 160 km el combustible baja de 50 a 40 L: una sube y la otra baja.", "Que una cantidad baje cuando la otra sube no basta para que sean inversamente proporcionales.", false]]}]}, {"comp": "razonamiento_cuantitativo", "sim": "tyt-2", "ind": "Techo y rampa de una bodega", "tt": "", "texto": "Se está construyendo una bodega. Su techo es a dos aguas: tiene 8 m de ancho y la parte más alta (cumbrera) está 1,5 m por encima de los apoyos, justo en la mitad del ancho, como muestra la figura. L es la longitud de cada viga inclinada, desde el apoyo hasta la cumbrera.", "vis": "<div class=\"vfig\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 200\" font-family=\"Arial\" font-size=\"14\"><rect width=\"360\" height=\"200\" fill=\"#ffffff\"/><polygon points=\"40,150 320,150 180,97.5\" fill=\"#eef3f9\" stroke=\"#222\" stroke-width=\"2.5\"/><line x1=\"180\" y1=\"97.5\" x2=\"180\" y2=\"150\" stroke=\"#222\" stroke-dasharray=\"5,4\"/><polyline points=\"168,150 168,138 180,138\" fill=\"none\" stroke=\"#222\"/><text x=\"188\" y=\"130\" fill=\"#111\">1,5 m<\/text><text x=\"180\" y=\"175\" text-anchor=\"middle\" fill=\"#111\">8 m<\/text><text x=\"95\" y=\"112\" fill=\"#111\">L<\/text><\/svg><\/div>", "items": [{"id": "RCT-231", "niv": 2, "cp": "rc_formulacion", "e": "¿Cuál es la longitud L de cada viga inclinada, aproximadamente?", "f": "Cálculo propio con el teorema de Pitágoras.", "vis": "", "o": [["A", "2,5 m.", "Resta 4 − 1,5; en el triángulo rectángulo se aplica el teorema de Pitágoras, no una resta.", false], ["B", "4,27 m.", "Cada mitad forma un triángulo rectángulo de catetos 4 m y 1,5 m: L = √(4² + 1,5²) = √18,25 ≈ 4,27 m.", true], ["C", "5,5 m.", "Suma los catetos (4 + 1,5); la hipotenusa es menor que esa suma.", false], ["D", "8,14 m.", "Usa el ancho completo (8 m) como cateto; la viga va solo hasta la mitad del ancho (4 m).", false]]}, {"id": "RCT-232", "niv": 3, "cp": "rc_argumentacion", "e": "En la entrada de la bodega habrá una rampa para montacargas. El reglamento interno de la empresa exige que la pendiente (altura ÷ distancia horizontal) no supere el 10 %. Un trabajador afirma: «Una rampa con 7,2 m de distancia horizontal sirve para subir 0,9 m, porque 0,9 ÷ 7,2 = 0,125, que es menos de 10». ¿Es correcto su razonamiento?", "f": "Cálculo propio a partir de los datos del caso (datos ficticios).", "vis": "", "o": [["A", "Sí, porque el 10 % de 7,2 m es 0,72 m, y 0,9 m está por encima de ese valor.", "Interpreta el límite al revés: la altura debe ser como máximo 0,72 m, y 0,9 m lo supera.", false], ["B", "Sí, porque 0,125 es menor que 10, que es el límite que fija el reglamento de la empresa.", "Compara 0,125 con 10 sin convertir: 0,125 equivale a 12,5 %, que supera el 10 %.", false], ["C", "No, porque 0,125 equivale a 1,25 %, y la pendiente debe ser como mínimo del 10 %.", "Convierte mal (0,125 = 12,5 %) y lee el reglamento al revés: el 10 % es un máximo.", false], ["D", "No, porque 0,125 equivale a una pendiente de 12,5 %, que supera el 10 % permitido.", "0,9 ÷ 7,2 = 0,125 = 12,5 % > 10 %. El trabajador compara un decimal con un porcentaje sin convertirlo.", true]]}]}, {"comp": "razonamiento_cuantitativo", "sim": "tyt-2", "ind": "Encuesta sobre transporte de los empleados", "tt": "", "texto": "Una empresa tiene 1.000 empleados. Para planear un nuevo parqueadero, escogió al azar a 250 de ellos y les preguntó qué medio de transporte usan para llegar al trabajo. Cada empleado eligió una sola opción. La tabla 1 muestra los resultados.", "vis": "<table class=\"vt\"><caption>Tabla 1. Medio de transporte de los encuestados<\/caption><thead><tr><th>Medio de transporte<\/th><th>Número de encuestados<\/th><\/tr><\/thead><tbody><tr><td>Bus<\/td><td>110<\/td><\/tr><tr><td>Moto<\/td><td>60<\/td><\/tr><tr><td>Bicicleta<\/td><td>45<\/td><\/tr><tr><td>Carro particular<\/td><td>35<\/td><\/tr><tr><td>Total<\/td><td>250<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Datos ficticios.<\/div>", "items": [{"id": "RCT-233", "niv": 2, "cp": "rc_interpretacion", "e": "Con base en la muestra, ¿cuántos empleados de toda la empresa se estima que llegan en bicicleta?", "f": "Cálculo propio a partir de los datos del caso (datos ficticios).", "vis": "", "o": [["A", "18", "18 es el porcentaje de la muestra que usa bicicleta (45 de 250), no la cantidad estimada de empleados.", false], ["B", "45", "Es el número de personas de la muestra; falta llevarlo a los 1.000 empleados.", false], ["C", "180", "El 18 % de la muestra usa bicicleta (45 ÷ 250); el 18 % de 1.000 es 180 (equivale a 45 × 4).", true], ["D", "450", "Multiplica por 10 en lugar de por 4; la muestra es la cuarta parte de la empresa.", false]]}, {"id": "RCT-234", "niv": 1, "cp": "rc_interpretacion", "e": "¿Qué porcentaje de los encuestados llega en moto?", "f": "Cálculo propio a partir de los datos del caso (datos ficticios).", "vis": "", "o": [["A", "6 %", "Divide 60 entre los 1.000 empleados de la empresa; el porcentaje de la muestra se calcula sobre 250.", false], ["B", "24 %", "60 de los 250 encuestados: 60 ÷ 250 = 0,24 = 24 %.", true], ["C", "60 %", "60 es la cantidad de encuestados que llega en moto, no el porcentaje.", false], ["D", "76 %", "Es el porcentaje de encuestados que no llega en moto.", false]]}, {"id": "RCT-235", "niv": 3, "cp": "rc_argumentacion", "e": "El gerente afirma: «Como en la muestra 110 personas llegan en bus, en la empresa hay exactamente 440 empleados que llegan en bus». ¿Es válida su afirmación?", "f": "Cálculo propio a partir de los datos del caso (datos ficticios).", "vis": "", "o": [["A", "Sí, porque 110 × 4 = 440 y la muestra es la cuarta parte de la empresa.", "El cálculo da una estimación razonable, pero no garantiza el valor exacto en toda la empresa.", false], ["B", "No, porque si el bus es el medio más usado en la muestra, en la empresa no puede serlo.", "No hay razón para eso: lo esperable es que la muestra se parezca a la población, aunque no sea idéntica.", false], ["C", "No, porque el valor correcto es 110 × 10 = 1.100 empleados.", "Usa un factor equivocado (10) y además 1.100 superaría el total de empleados.", false], ["D", "No, porque 440 es solo una estimación a partir de una muestra; el número real de empleados que llegan en bus puede ser algo distinto.", "Una muestra al azar permite estimar, con cierto margen de error, el valor de la población; no lo determina con exactitud.", true]]}]}, {"comp": "competencias_ciudadanas", "sim": "tyt-2", "ind": "Fines esenciales del Estado", "tt": "", "texto": "En un curso de formación para técnicos que trabajarán en la atención al ciudadano de una alcaldía, el instructor pide identificar cuáles son los fines esenciales del Estado según el artículo 2.º de la Constitución.", "vis": "", "items": [{"id": "CCT-201", "niv": 1, "cp": "cc_conocimientos", "e": "¿Cuál de los siguientes es uno de los fines esenciales del Estado según el artículo 2.º de la Constitución?", "f": "Constitución Política de Colombia (texto vigente, Secretaría del Senado), art. 2", "vis": "", "o": [["A", "Facilitar la participación de todos en las decisiones que los afectan.", "El artículo 2.º incluye entre los fines esenciales del Estado «facilitar la participación de todos en las decisiones que los afectan y en la vida económica, política, administrativa y cultural de la Nación».", true], ["B", "Mantener una sola cultura nacional que unifique a toda la población del país.", "Contradice el artículo 7.º, que reconoce y protege la diversidad étnica y cultural; no es un fin del artículo 2.º.", false], ["C", "Garantizar a cada persona adulta un empleo en una entidad pública.", "El artículo 2.º habla de promover la prosperidad general, no de dar a cada persona un empleo público.", false], ["D", "Asegurar la rentabilidad de las empresas privadas que operan en el país.", "No figura entre los fines esenciales; el artículo 2.º se refiere a servir a la comunidad y promover la prosperidad general.", false]]}]}, {"comp": "competencias_ciudadanas", "sim": "tyt-2", "ind": "Igualdad real y acciones afirmativas", "tt": "", "texto": "Una alcaldía abre un programa gratuito de formación como técnico en mantenimiento de computadores y reserva el 20 % de los cupos para personas con discapacidad, población que en el municipio tiene tasas de desempleo mucho más altas que el promedio. Un aspirante sin discapacidad que no obtuvo cupo afirma que la medida viola el derecho a la igualdad.", "vis": "", "items": [{"id": "CCT-202", "niv": 2, "cp": "cc_conocimientos", "e": "De acuerdo con el artículo 13 de la Constitución, ¿es acertada la afirmación del aspirante?", "f": "Constitución Política de Colombia (texto vigente, Secretaría del Senado), art. 13", "vis": "", "o": [["A", "No, porque el Estado debe buscar la igualdad real y adoptar medidas en favor de grupos discriminados o marginados.", "El inciso 2.º del artículo 13 dice: «El Estado promoverá las condiciones para que la igualdad sea real y efectiva y adoptará medidas en favor de grupos discriminados o marginados»; la reserva de cupos es una medida de ese tipo.", true], ["B", "No, porque los programas de formación de las alcaldías no están obligados a respetar el derecho a la igualdad.", "Todas las autoridades deben respetar el derecho a la igualdad; la medida es válida por el inciso 2.º del artículo 13, no porque la alcaldía esté exenta.", false], ["C", "Sí, porque la igualdad exige que todas las personas reciban exactamente el mismo trato en cualquier circunstancia.", "El artículo 13 no se limita a la igualdad formal: también ordena medidas a favor de grupos discriminados o marginados.", false], ["D", "Sí, porque la Constitución prohíbe cualquier diferencia de trato basada en las condiciones personales de los aspirantes.", "La Constitución prohíbe la discriminación, pero ordena expresamente medidas diferenciales para lograr la igualdad real.", false]]}]}, {"comp": "competencias_ciudadanas", "sim": "tyt-2", "ind": "Libertad de información y rectificación", "tt": "", "texto": "Una emisora comunitaria informó, con nombre y apellido, que Julián Rojas, técnico de la empresa de energía del municipio, cobraba dinero a los usuarios por reconectarles el servicio. Días después se comprobó que la información era falsa: quien hacía esos cobros era otra persona ajena a la empresa.", "vis": "", "items": [{"id": "CCT-203", "niv": 1, "cp": "cc_conocimientos", "e": "¿Qué derecho, consagrado en el artículo 20 de la Constitución, puede invocar el técnico frente a la emisora?", "f": "Constitución Política de Colombia (texto vigente, Secretaría del Senado), art. 20", "vis": "", "o": [["A", "El derecho a conocer, actualizar y rectificar los datos sobre él guardados en los archivos de la emisora.", "Ese derecho está en el artículo 15 y se refiere a bancos de datos y archivos; el enunciado pide el derecho del artículo 20 frente a una información difundida.", false], ["B", "El derecho a exigir censura previa sobre las noticias que la emisora vaya a emitir.", "El artículo 20 dice expresamente «No habrá censura».", false], ["C", "El derecho de petición, para que la emisora le explique por escrito de dónde sacó la noticia.", "El derecho de petición está en el artículo 23, no en el 20, y una explicación sobre el origen de la noticia no corrige la información falsa ya difundida.", false], ["D", "El derecho a que la emisora corrija la información en condiciones equitativas.", "El artículo 20 garantiza la libertad de informar y recibir información veraz e imparcial y añade: «Se garantiza el derecho a la rectificación en condiciones de equidad».", true]]}]}, {"comp": "competencias_ciudadanas", "sim": "tyt-2", "ind": "Derecho de huelga", "tt": "", "texto": "Durante una negociación colectiva en una empresa de autopartes, un operario dice a sus compañeros: «Para qué hablamos de huelga si en Colombia está prohibida; la Constitución no la permite».", "vis": "", "items": [{"id": "CCT-204", "niv": 2, "cp": "cc_conocimientos", "e": "¿Qué establece la Constitución sobre el derecho de huelga?", "f": "Constitución Política de Colombia (texto vigente, Secretaría del Senado), art. 56", "vis": "", "o": [["A", "Solo se permite cuando el presidente de la República la autoriza mediante un decreto.", "La Constitución no exige autorización presidencial; deja la reglamentación a la ley.", false], ["B", "Está prohibida en todas las empresas privadas y solo se permite a los empleados públicos.", "Es lo contrario: la Constitución la garantiza en general, con la excepción de los servicios públicos esenciales.", false], ["C", "Se garantiza, salvo en los servicios públicos esenciales definidos por el legislador.", "El artículo 56 dispone: «Se garantiza el derecho de huelga, salvo en los servicios públicos esenciales definidos por el legislador. La ley reglamentará este derecho».", true], ["D", "Se garantiza sin ninguna excepción y la Constitución prohíbe que la ley la reglamente.", "Sí tiene excepción (servicios públicos esenciales) y el artículo 56 dice que la ley reglamentará este derecho.", false]]}]}, {"comp": "competencias_ciudadanas", "sim": "tyt-2", "ind": "Recursos naturales en territorios indígenas", "tt": "", "texto": "Una empresa obtuvo un título para explotar materiales de construcción en un área que forma parte de un resguardo indígena. Las autoridades tradicionales de la comunidad temen que la obra afecte sus sitios sagrados y sus cultivos de pancoger.", "vis": "", "items": [{"id": "CCT-205", "niv": 2, "cp": "cc_conocimientos", "e": "Según el parágrafo del artículo 330 de la Constitución, la explotación de recursos naturales en territorios indígenas", "f": "Constitución Política de Colombia (texto vigente, Secretaría del Senado), art. 330, parágrafo", "vis": "", "o": [["A", "exige que la comunidad sea trasladada a otras tierras, para que la explotación no la afecte en su vida diaria.", "Trasladar a la comunidad sería contrario a la protección de su integridad cultural, social y económica.", false], ["B", "requiere que la empresa compre a la comunidad las tierras del resguardo antes de iniciar la explotación.", "Las tierras de resguardo son inalienables (art. 63), así que no pueden venderse; el parágrafo del artículo 330 exige respetar la integridad de la comunidad y su participación.", false], ["C", "debe hacerse sin menoscabo de la integridad cultural, social y económica de las comunidades, con participación de sus representantes.", "El parágrafo del artículo 330 dispone que la explotación «se hará sin desmedro de la integridad cultural, social y económica de las comunidades indígenas» y que el Gobierno propiciará la participación de sus representantes.", true], ["D", "debe acordarse con el alcalde del municipio, que representa a las comunidades del resguardo ante el Gobierno nacional.", "La Constitución exige propiciar la participación de los representantes de las propias comunidades indígenas; el alcalde no las representa.", false]]}]}, {"comp": "competencias_ciudadanas", "sim": "tyt-2", "ind": "Funciones del Defensor del Pueblo", "tt": "", "texto": "En un barrio de invasión, varias familias que no saben cómo reclamar el acceso a la salud de sus hijos acuden a la oficina regional de un organismo del Estado. Allí les explican sus derechos y les ofrecen presentar acciones de tutela a su favor.", "vis": "", "items": [{"id": "CCT-206", "niv": 2, "cp": "cc_conocimientos", "e": "¿Cuál de las siguientes funciones corresponde, según la Constitución, al Defensor del Pueblo?", "f": "Constitución Política de Colombia (texto vigente, Secretaría del Senado), art. 282", "vis": "", "o": [["A", "Ejercer de manera preferente el poder disciplinario sobre los servidores públicos e imponerles sanciones.", "Esa función es del Procurador General de la Nación (art. 277, num. 6).", false], ["B", "Vigilar la gestión fiscal de la administración y de los particulares que manejen fondos públicos.", "Esa función corresponde a la Contraloría General de la República (art. 267).", false], ["C", "Investigar los delitos y acusar ante los jueces a los presuntos responsables de cometerlos.", "Esa función corresponde a la Fiscalía General de la Nación, no al Defensor del Pueblo.", false], ["D", "Asesorar a las personas sobre cómo defender sus derechos y presentar tutelas a su favor.", "El artículo 282 asigna al Defensor del Pueblo orientar e instruir a los habitantes en el ejercicio y defensa de sus derechos (num. 1), interponer tutelas (num. 3) y acciones populares (num. 5).", true]]}]}, {"comp": "competencias_ciudadanas", "sim": "tyt-2", "ind": "Acción de habeas corpus", "tt": "", "texto": "Un técnico en refrigeración es retenido en una estación de policía durante una noche sin que exista orden judicial ni flagrancia. Su hermana quiere acudir a un juez para que se revise de inmediato la legalidad de esa privación de la libertad.", "vis": "", "items": [{"id": "CCT-207", "niv": 1, "cp": "cc_conocimientos", "e": "¿Qué mecanismo constitucional debe usar la hermana y en qué plazo debe resolverse?", "f": "Constitución Política de Colombia (texto vigente, Secretaría del Senado), art. 30", "vis": "", "o": [["A", "El habeas corpus, que debe resolverse en un término de treinta y seis horas.", "El artículo 30 establece que quien esté privado de la libertad y crea estarlo ilegalmente puede invocar, por sí o por interpuesta persona, el habeas corpus, que «debe resolverse en el término de treinta y seis horas».", true], ["B", "La acción popular, que debe resolverse en un término máximo de diez días.", "La acción popular protege derechos colectivos (art. 88); no sirve para revisar una privación de la libertad.", false], ["C", "La acción de tutela, que debe resolverse en un término de treinta y seis horas.", "El término de 36 horas es el del habeas corpus; la tutela tiene un máximo de diez días (art. 86) y no es el mecanismo específico para la libertad.", false], ["D", "La acción de cumplimiento, que debe resolverse en un término de quince días.", "La acción de cumplimiento busca que una autoridad cumpla una ley o un acto administrativo (art. 87).", false]]}]}, {"comp": "competencias_ciudadanas", "sim": "tyt-2", "ind": "Acción de grupo", "tt": "", "texto": "La explosión de una tubería de gas en un barrio causó daños en 85 viviendas: vidrios rotos, muros agrietados y electrodomésticos dañados. El peligro ya fue controlado y la tubería, reparada. Ahora las 85 familias quieren reclamar juntas la indemnización de los perjuicios que sufrió cada una.", "vis": "", "items": [{"id": "CCT-208", "niv": 3, "cp": "cc_conocimientos", "e": "¿Qué mecanismo previsto en el artículo 88 de la Constitución corresponde a esta reclamación?", "f": "Constitución Política de Colombia (texto vigente, Secretaría del Senado), art. 88", "vis": "", "o": [["A", "La acción de tutela, para proteger el derecho fundamental a la vivienda de cada familia.", "La tutela da órdenes de protección inmediata de derechos fundamentales; no es el mecanismo para reclamar en conjunto la indemnización de perjuicios.", false], ["B", "La acción de cumplimiento, para que la empresa de gas cumpla las normas técnicas.", "La acción de cumplimiento (art. 87) busca que una autoridad cumpla una ley o un acto administrativo; no indemniza daños.", false], ["C", "La acción de grupo, para daños ocasionados a un número plural de personas.", "El inciso 2.º del artículo 88 prevé las acciones originadas en los daños ocasionados a un número plural de personas (acción de grupo), cuyo fin es la indemnización; el peligro colectivo ya cesó.", true], ["D", "La acción popular, para proteger la seguridad y la salubridad públicas.", "La acción popular protege derechos colectivos frente a un peligro o daño; aquí el peligro ya fue controlado y lo que se busca es indemnizar perjuicios individuales.", false]]}]}, {"comp": "competencias_ciudadanas", "sim": "tyt-2", "ind": "El Presidente de la República", "tt": "", "texto": "En una clase de un programa técnico, un estudiante afirma que en Colombia el Presidente de la República solo dirige las relaciones internacionales, mientras que el gobierno interno lo dirige el Congreso.", "vis": "", "items": [{"id": "CCT-209", "niv": 1, "cp": "cc_conocimientos", "e": "Según el artículo 115 de la Constitución, el Presidente de la República es", "f": "Constitución Política de Colombia (texto vigente, Secretaría del Senado), art. 115", "vis": "", "o": [["A", "jefe del Estado y jefe de la rama judicial del poder público.", "El Presidente no dirige la rama judicial; las ramas tienen funciones separadas (art. 113).", false], ["B", "jefe del Gobierno y presidente del Congreso de la República.", "El Congreso tiene sus propias mesas directivas; el Presidente encabeza la rama ejecutiva.", false], ["C", "suprema autoridad administrativa y director del Ministerio Público de la Nación.", "El supremo director del Ministerio Público es el Procurador General de la Nación (art. 275).", false], ["D", "jefe del Estado, jefe del Gobierno y suprema autoridad administrativa.", "El artículo 115 dispone textualmente: «El Presidente de la República es Jefe del Estado, Jefe del Gobierno y suprema autoridad administrativa».", true]]}]}, {"comp": "competencias_ciudadanas", "sim": "tyt-2", "ind": "Derecho de petición", "tt": "", "texto": "Una tecnóloga en construcción pidió por escrito a la alcaldía de su municipio una copia de los permisos de una obra que se adelanta junto a su casa. Han pasado varias semanas y no ha recibido ninguna respuesta.", "vis": "", "items": [{"id": "CCT-210", "niv": 1, "cp": "cc_conocimientos", "e": "¿Qué derecho fundamental le está desconociendo la alcaldía?", "f": "Constitución Política de Colombia (texto vigente, Secretaría del Senado), art. 23", "vis": "", "o": [["A", "El derecho de petición, que incluye obtener pronta resolución.", "El artículo 23 consagra el derecho a presentar peticiones respetuosas a las autoridades por motivos de interés general o particular «y a obtener pronta resolución».", true], ["B", "El derecho de huelga de los trabajadores de la construcción.", "La huelga (art. 56) es un derecho colectivo laboral sin relación con la solicitud.", false], ["C", "El derecho a circular libremente, porque la obra le impide entrar a su casa.", "El texto no dice que la obra le impida el paso; el problema es que su solicitud no ha sido respondida.", false], ["D", "El derecho a la intimidad, porque la obra vecina permite ver el interior de su casa.", "El texto no dice que la obra afecte su intimidad; lo que la alcaldía desconoce es su solicitud sin respuesta.", false]]}]}, {"comp": "competencias_ciudadanas", "sim": "tyt-2", "ind": "Control de constitucionalidad de las leyes", "tt": "", "texto": "Un tecnólogo en contabilidad considera que una ley recién expedida por el Congreso, que modifica el pago de un impuesto, contradice la Constitución. Quiere saber qué puede hacer como ciudadano para que se revise esa ley.", "vis": "", "items": [{"id": "CCT-211", "niv": 3, "cp": "cc_conocimientos", "e": "Según la Constitución, ¿qué puede hacer?", "f": "Constitución Política de Colombia (texto vigente, Secretaría del Senado), arts. 40, num. 6, y 241, num. 4", "vis": "", "o": [["A", "Pedir al Procurador General que derogue la ley por ser el supremo director del Ministerio Público.", "El Procurador no deroga leyes; derogarlas es función del Congreso (art. 150, num. 1) y juzgar su constitucionalidad, de la Corte Constitucional.", false], ["B", "Presentar una acción de tutela ante el Consejo Nacional Electoral para que suspenda la ley.", "El CNE es un órgano de la organización electoral (art. 265); no juzga la constitucionalidad de las leyes.", false], ["C", "Presentar una demanda de inconstitucionalidad ante la Corte Constitucional.", "El artículo 40 (num. 6) reconoce a los ciudadanos el derecho a interponer acciones públicas en defensa de la Constitución, y el artículo 241 (num. 4) asigna a la Corte Constitucional decidir las demandas de inconstitucionalidad que presenten los ciudadanos contra las leyes.", true], ["D", "Solicitar a la Contraloría General que anule la ley por afectar los recursos públicos.", "La Contraloría ejerce el control fiscal (art. 267); no puede anular leyes.", false]]}]}, {"comp": "competencias_ciudadanas", "sim": "tyt-2", "ind": "Publicidad de los medidores inteligentes", "tt": "", "texto": "Una empresa de energía publicó este anuncio: «Nuestro nuevo medidor inteligente ayuda a ahorrar: en el barrio donde hicimos la prueba piloto, la factura promedio bajó 18 % en los últimos seis meses».\n\nEn el concejo, una concejala señaló que, en esos mismos seis meses, la tarifa del kilovatio hora bajó 15 % para todos los usuarios de la ciudad, tuvieran o no el nuevo medidor.", "vis": "", "items": [{"id": "CCT-212", "niv": 2, "cp": "cc_argumentacion", "e": "Antes de conocer la intervención de la concejala, ¿qué información habría sido más útil para evaluar si el medidor causó la reducción de las facturas?", "f": "Situación original elaborada para este simulacro, párrafo 1", "vis": "", "o": [["A", "Cuánto bajaron las facturas, en el mismo periodo, en barrios donde no se instaló el nuevo medidor.", "Para atribuir el efecto al medidor hay que compararlo con lo que pasó donde no se instaló; sin ese punto de comparación, otras causas podrían explicar la baja.", true], ["B", "Cuántos usuarios del barrio piloto dicen estar satisfechos con el servicio de la empresa.", "La satisfacción de los usuarios no indica qué causó la reducción de la factura.", false], ["C", "Cuántos técnicos de la empresa participaron en la instalación de los medidores del barrio.", "El número de instaladores no dice nada sobre la causa de la baja en las facturas.", false], ["D", "Cuál es la marca y el país de origen de los medidores instalados en el barrio piloto.", "La marca no permite saber si la reducción se debe al medidor o a otra causa.", false]]}, {"id": "CCT-213", "niv": 3, "cp": "cc_argumentacion", "e": "Con base en la información de la concejala, ¿qué se puede concluir sobre el anuncio de la empresa?", "f": "Situación original elaborada para este simulacro, párrafo 2", "vis": "", "o": [["A", "La información de la concejala confirma que el medidor redujo por sí solo las facturas en un 18 %.", "Al contrario: muestra que la mayor parte de la reducción podría explicarse por la baja de la tarifa.", false], ["B", "El anuncio es correcto, porque la baja de la tarifa y el medidor son en realidad una misma causa.", "Son causas distintas: la tarifa bajó para todos los usuarios, tuvieran o no el medidor.", false], ["C", "La concejala demuestra que el medidor aumentó el consumo de energía en el barrio piloto.", "La concejala no da datos sobre el consumo; su información solo muestra otra posible causa de la baja.", false], ["D", "Exagera el efecto del medidor, pues buena parte de la baja podría deberse a la menor tarifa.", "Si la tarifa bajó 15 % para todos, una factura con igual consumo habría bajado cerca de 15 % aun sin el medidor; el anuncio le atribuye al medidor una reducción que en su mayor parte tiene otra causa posible.", true]]}]}, {"comp": "competencias_ciudadanas", "sim": "tyt-2", "ind": "Selección de personal en un taller", "tt": "", "texto": "En un taller de motos, el jefe le dice a la persona encargada de contratar: «No llamemos a la técnica en mecatrónica que se presentó. Las mujeres no entienden de motores». La candidata obtuvo el puntaje más alto en la prueba técnica del proceso.", "vis": "", "items": [{"id": "CCT-214", "niv": 1, "cp": "cc_argumentacion", "e": "¿Qué se puede afirmar sobre la frase del jefe?", "f": "Situación original elaborada para este simulacro", "vis": "", "o": [["A", "Expresa un prejuicio, pues descarta a la candidata por ser mujer y no por sus conocimientos.", "El jefe generaliza sobre todas las mujeres y no tiene en cuenta el desempeño de la candidata, que obtuvo el mejor puntaje técnico.", true], ["B", "Es una regla del reglamento interno del taller que el jefe se limita a hacer cumplir.", "El texto no menciona ningún reglamento; es una opinión personal del jefe.", false], ["C", "Es una conclusión basada en los resultados de la prueba técnica que presentó la candidata.", "Los resultados de la prueba contradicen la frase del jefe: ella obtuvo el puntaje más alto.", false], ["D", "Es una opinión respaldada por estadísticas del taller sobre el desempeño de las técnicas contratadas.", "El jefe no presenta ninguna estadística; hace una afirmación general sin pruebas.", false]]}]}, {"comp": "competencias_ciudadanas", "sim": "tyt-2", "ind": "Cámaras de seguridad en el barrio", "tt": "", "texto": "La junta de acción comunal de un barrio discute si pide a cada familia una cuota para instalar cámaras de seguridad.\n\nArgumento 1 (un vecino): «En el barrio de al lado instalaron cámaras y en seis meses los robos bajaron a la mitad. Así que aquí también bajarán».\n\nArgumento 2 (una vecina): «Las cámaras no sirven: mi primo vive en un barrio con cámaras y el mes pasado le robaron la moto».", "vis": "", "items": [{"id": "CCT-215", "niv": 3, "cp": "cc_argumentacion", "e": "¿Qué debilidad comparten los dos argumentos?", "f": "Situación original elaborada para este simulacro, argumentos 1 y 2", "vis": "", "o": [["A", "Ambos se basan en estadísticas oficiales de la Policía sobre los robos en la ciudad.", "Ninguno cita estadísticas oficiales: uno habla de un barrio vecino y otro de un caso familiar.", false], ["B", "Ambos contradicen la información que ellos mismos presentan para defender su posición.", "No hay contradicción interna: cada uno saca una conclusión coherente con su ejemplo, aunque insuficiente.", false], ["C", "Ambos sacan una conclusión general a partir de un único caso particular.", "El argumento 1 generaliza desde un solo barrio sin examinar si es comparable, y el 2, desde un solo robo; ninguno tiene datos suficientes para su conclusión.", true], ["D", "Ambos confunden el costo de las cámaras con su eficacia para reducir los robos del barrio.", "Ninguno de los dos argumentos habla del costo de las cámaras; ambos discuten su eficacia a partir de un solo caso.", false]]}, {"id": "CCT-216", "niv": 2, "cp": "cc_argumentacion", "e": "¿Qué información fortalecería más el argumento 1?", "f": "Situación original elaborada para este simulacro, argumento 1", "vis": "", "o": [["A", "Que muchas familias del barrio están dispuestas a pagar la cuota para comprar las cámaras.", "La disposición a pagar no dice nada sobre la eficacia de las cámaras.", false], ["B", "Que al primo de la vecina le robaron la moto en un sitio al que no llegaba la imagen de ninguna cámara.", "Debilitaría el argumento 2, pero no prueba que las cámaras reduzcan los robos en el barrio.", false], ["C", "Que las cámaras instaladas en el barrio de al lado son de una marca reconocida en el mercado.", "La marca no muestra que las cámaras hayan causado la reducción de los robos.", false], ["D", "Que en el barrio de al lado no hubo otros cambios en seguridad, como más patrullaje, en esos seis meses.", "Si no hubo otros cambios (más patrullaje, alumbrado, etc.), es más razonable atribuir la reducción de los robos a las cámaras.", true]]}]}, {"comp": "competencias_ciudadanas", "sim": "tyt-2", "ind": "Boletín sindical en una floricultora", "tt": "", "texto": "El sindicato de una empresa floricultora publicó en su boletín: «La empresa dice que no puede subir los salarios este año porque sus ventas bajaron. Pero el gerente estrenó camioneta en marzo. Por lo tanto, la empresa sí tiene dinero para el aumento».", "vis": "", "items": [{"id": "CCT-217", "niv": 1, "cp": "cc_argumentacion", "e": "¿En qué se apoya el boletín para llegar a su conclusión?", "f": "Situación original elaborada para este simulacro", "vis": "", "o": [["A", "En un gasto del gerente, que toma como prueba de la situación financiera de toda la empresa.", "El único dato que ofrece el boletín es la camioneta del gerente; con él concluye sobre las finanzas de toda la empresa.", true], ["B", "En los estados financieros de la empresa del último año, que muestran utilidades altas.", "El boletín no presenta estados financieros ni cifras de utilidades.", false], ["C", "En la opinión de un experto en economía agrícola consultado por el sindicato para el boletín.", "El boletín no cita a ningún experto.", false], ["D", "En una comparación de los salarios de la empresa con los de otras floricultoras de la región.", "No hay ninguna comparación con otras empresas.", false]]}, {"id": "CCT-218", "niv": 2, "cp": "cc_argumentacion", "e": "¿Cuál de las siguientes respuestas de la empresa sería la más pertinente frente al argumento del boletín?", "f": "Situación original elaborada para este simulacro", "vis": "", "o": [["A", "Anunciar que no responderá ninguna pregunta mientras el sindicato siga publicando boletines.", "Rechaza el diálogo y no aporta ninguna razón sobre la capacidad de pago de la empresa.", false], ["B", "Recordar que los salarios de la empresa están por encima del mínimo legal vigente en la región.", "Puede ser cierto, pero no responde a lo que afirma el boletín: si la empresa tiene o no dinero para el aumento.", false], ["C", "Mostrar las cifras de ingresos y costos de la empresa y explicar cómo se pagó la camioneta.", "Responde directamente al argumento: aporta información sobre la situación financiera y sobre el gasto que el sindicato usa como prueba.", true], ["D", "Comparar los salarios de la floricultora con los que pagan otras empresas del sector en la región.", "La comparación no dice nada sobre la capacidad de pago de la empresa ni sobre la camioneta que el boletín usa como prueba.", false]]}]}, {"comp": "competencias_ciudadanas", "sim": "tyt-2", "ind": "Planta de tratamiento de aguas residuales", "tt": "", "texto": "(1) La empresa de acueducto y alcantarillado de un municipio de 60.000 habitantes vierte sin tratar las aguas residuales al río Claro. Para cumplir una orden de la autoridad ambiental, planea construir una planta de tratamiento en un lote municipal vecino al barrio Villa Nueva.\n\n(2) El gerente de la empresa: «La planta es indispensable. Este lote es el único que tenemos; comprar otro, a dos kilómetros, encarecería la obra y tendríamos que subir la tarifa a todos los usuarios».\n\n(3) El presidente de la junta de acción comunal de Villa Nueva: «Estamos de acuerdo con limpiar el río, pero no queremos malos olores al lado de nuestras casas ni que las viviendas pierdan valor. Que la construyan lejos».\n\n(4) La líder de la asociación de pescadores de una vereda río abajo: «Cada año hay menos peces y más niños con problemas en la piel por bañarse en el río. Necesitamos la planta ya, donde sea».\n\n(5) El representante de una constructora que proyecta vender un conjunto de vivienda junto al lote: «Una planta allí afectaría el ambiente del sector; pedimos que el municipio busque otro lugar».", "vis": "", "items": [{"id": "CCT-219", "niv": 1, "cp": "cc_multiperspectivismo", "e": "¿Qué busca principalmente la asociación de pescadores?", "f": "Situación original elaborada para este simulacro, párrafo 4", "vis": "", "o": [["A", "Que la planta se construya lejos de las casas del barrio Villa Nueva.", "Esa es la petición de la junta de acción comunal y de la constructora, no la de los pescadores.", false], ["B", "Que la empresa no suba la tarifa del servicio de acueducto.", "La tarifa es una preocupación que menciona el gerente; los pescadores no hablan de ella.", false], ["C", "Que se prohíba a los niños de la vereda bañarse en el río.", "La líder menciona los problemas de piel como consecuencia de la contaminación, pero lo que pide es la planta.", false], ["D", "Que la planta se construya pronto, sin importar mucho dónde.", "La líder dice: «Necesitamos la planta ya, donde sea»; su prioridad es que el río deje de contaminarse cuanto antes (párrafo 4).", true]]}, {"id": "CCT-220", "niv": 2, "cp": "cc_multiperspectivismo", "e": "¿En qué se diferencian las posiciones de la junta de acción comunal y de los pescadores?", "f": "Situación original elaborada para este simulacro, párrafos 3 y 4", "vis": "", "o": [["A", "Ambos rechazan la construcción de la planta de tratamiento, aunque lo hacen por razones distintas.", "Ninguno rechaza la planta: la junta objeta su ubicación y los pescadores la piden con urgencia.", false], ["B", "La junta se opone a que se traten las aguas residuales del municipio, mientras que los pescadores apoyan el tratamiento.", "La junta dice expresamente: «Estamos de acuerdo con limpiar el río».", false], ["C", "Los pescadores exigen que la planta quede lejos de la vereda, y la junta acepta que se construya en cualquier lugar.", "Invierte las posiciones: es la junta la que pide que quede lejos y los pescadores los que aceptan cualquier lugar.", false], ["D", "Ambos quieren limpiar el río, pero la junta condiciona su apoyo a la ubicación y los pescadores priorizan la rapidez.", "La junta acepta limpiar el río pero pide que la planta quede lejos; los pescadores la quieren «ya, donde sea» (párrafos 3 y 4).", true]]}, {"id": "CCT-221", "niv": 2, "cp": "cc_multiperspectivismo", "e": "Según el gerente, si se acoge la petición de la junta y de la constructora, ¿quiénes asumirían el costo económico de la decisión?", "f": "Situación original elaborada para este simulacro, párrafo 2", "vis": "", "o": [["A", "Todos los usuarios del acueducto, porque habría que subir la tarifa para comprar el otro lote.", "El gerente afirma que comprar otro lote encarecería la obra y que tendrían que subir la tarifa «a todos los usuarios» (párrafo 2).", true], ["B", "Los pescadores de la vereda, porque tendrían que pagar con sus aportes la compra del nuevo lote.", "El gerente no dice que los pescadores paguen el lote; habla de la tarifa de todos los usuarios.", false], ["C", "La constructora, porque perdería el lote en el que proyecta construir el conjunto de vivienda.", "El lote de la planta es municipal; la constructora proyecta su conjunto junto a él, no en él.", false], ["D", "La autoridad ambiental, porque tendría que financiar la compra del lote que está a dos kilómetros.", "El texto no atribuye ningún costo a la autoridad ambiental.", false]]}, {"id": "CCT-222", "niv": 3, "cp": "cc_multiperspectivismo", "e": "Aunque la constructora usa un argumento ambiental, su petición puede relacionarse con su papel en el conflicto porque", "f": "Situación original elaborada para este simulacro, párrafo 5", "vis": "", "o": [["A", "la constructora representa a la asociación de pescadores ante las autoridades del municipio.", "La constructora habla por sí misma; los pescadores tienen su propia líder.", false], ["B", "la constructora sería la responsable de financiar la construcción de la planta de tratamiento.", "La planta la construye la empresa de acueducto; nada indica que la constructora la financie.", false], ["C", "una planta junto al lote podría dificultarle vender las viviendas que proyecta construir allí.", "La constructora proyecta vender un conjunto junto al lote; su interés comercial explica que pida otra ubicación, aunque lo exprese en términos ambientales (párrafo 5).", true], ["D", "la constructora es la entidad encargada de vigilar la calidad del agua que corre por el río Claro.", "Vigilar la calidad del agua no es función de una empresa constructora; el texto no le asigna ese papel.", false]]}]}, {"comp": "competencias_ciudadanas", "sim": "tyt-2", "ind": "Remodelación de la plaza de mercado", "tt": "", "texto": "La alcaldía remodelará la plaza de mercado, construida hace 50 años, porque tiene fallas en el techo, en las instalaciones eléctricas y en el manejo de residuos. Durante los 14 meses de obra, los 180 vendedores serán trasladados a una carpa en un lote ubicado a ocho cuadras.\n\nDoña Carmen, vendedora de verduras desde hace 30 años: «Mis clientes me buscan en este local. Si me llevan a ocho cuadras, muchos no me van a encontrar, y en 14 meses puedo perder el negocio».\n\nEl administrador de la plaza: «Si no remodelamos, el techo se puede caer; es un riesgo para vendedores y compradores. Además, la Secretaría de Salud nos ha hecho observaciones por los residuos».\n\nUna compradora habitual: «Me parece bien que la arreglen, porque hoy da miedo entrar cuando llueve. Pero el lote de la carpa queda lejos del paradero de buses».\n\nUn vendedor informal que trabaja en el andén de la plaza: «Si los vendedores se van, nosotros perdemos a los clientes que pasan por aquí. Ojalá en la plaza nueva haya puestos para nosotros».", "vis": "", "items": [{"id": "CCT-223", "niv": 1, "cp": "cc_multiperspectivismo", "e": "¿Qué preocupa principalmente a doña Carmen?", "f": "Situación original elaborada para este simulacro, párrafo 2", "vis": "", "o": [["A", "Que la Secretaría de Salud cierre la plaza por el manejo de residuos.", "Quien menciona las observaciones de la Secretaría de Salud es el administrador.", false], ["B", "Perder a sus clientes y su negocio durante el traslado temporal.", "Doña Carmen dice que sus clientes la buscan en el local actual y que, a ocho cuadras, no la encontrarán y podría perder el negocio.", true], ["C", "Que la remodelación no resuelva las fallas del techo de la plaza.", "Doña Carmen no habla del techo; esa preocupación la expresan el administrador y la compradora.", false], ["D", "Que en la plaza nueva no haya puestos para los vendedores del andén.", "Esa petición es del vendedor informal, no de doña Carmen.", false]]}, {"id": "CCT-224", "niv": 2, "cp": "cc_multiperspectivismo", "e": "¿En qué coinciden la compradora habitual y el administrador de la plaza?", "f": "Situación original elaborada para este simulacro, párrafos 3 y 4", "vis": "", "o": [["A", "Ambos piden que en la plaza nueva haya puestos para los vendedores informales.", "Esa es la petición del vendedor informal; ni el administrador ni la compradora la mencionan.", false], ["B", "Ambos rechazan el traslado temporal de los vendedores a la carpa del lote.", "El administrador defiende la remodelación y la compradora la aprueba; ninguno rechaza el traslado como tal.", false], ["C", "Ambos reconocen que el estado actual de la plaza es un riesgo para quienes la usan.", "El administrador dice que el techo se puede caer y la compradora, que da miedo entrar cuando llueve: ambos ven un riesgo en la plaza actual.", true], ["D", "Ambos consideran que el lote de la carpa está bien ubicado para los compradores habituales.", "La compradora se queja de que el lote queda lejos del paradero de buses.", false]]}, {"id": "CCT-225", "niv": 3, "cp": "cc_multiperspectivismo", "e": "¿Cuál de las siguientes medidas atendería a la vez las preocupaciones de doña Carmen y de la compradora, sin renunciar a la remodelación?", "f": "Situación original elaborada para este simulacro", "vis": "", "o": [["A", "Suspender la remodelación de la plaza hasta que todos los vendedores estén de acuerdo con el traslado.", "Implica renunciar o aplazar indefinidamente la remodelación, lo que la pregunta excluye; además, mantiene el riesgo del techo.", false], ["B", "Reducir el número de vendedores que podrán regresar a la plaza cuando termine la remodelación.", "No atiende a ninguna de las dos: doña Carmen podría quedar sin puesto y la compradora seguiría lejos del paradero.", false], ["C", "Construir en la plaza remodelada puestos nuevos para los vendedores informales que trabajan en el andén.", "Responde a la petición del vendedor informal, pero no a las preocupaciones de doña Carmen ni de la compradora.", false], ["D", "Ubicar la carpa cerca del paradero de buses y avisar a los clientes dónde estará cada vendedor.", "Un sitio cerca del paradero resuelve la queja de la compradora, y avisar la ubicación de cada vendedor ayuda a que los clientes de doña Carmen la encuentren; la obra sigue adelante.", true]]}]}, {"comp": "competencias_ciudadanas", "sim": "tyt-2", "ind": "Enfriamiento de la leche en una cooperativa", "tt": "", "texto": "Una nueva norma sanitaria exige que la leche se enfríe a 4 °C dentro de las dos horas siguientes al ordeño. La cooperativa lechera de un municipio recoge la leche de 200 socios.\n\nEl gerente de la cooperativa: «Si no cumplimos, la pasteurizadora deja de comprarnos. Propongo instalar tres tanques de enfriamiento comunitarios, uno por vereda, financiados con un descuento de $ 50 por litro a todos los socios durante dos años».\n\nDon Abelardo, pequeño productor que entrega 20 litros diarios: «Mi finca queda a hora y media a pie del sitio donde estaría el tanque de mi vereda. Además, con ese descuento me queda muy poco».\n\nDoña Teresa, productora que entrega 300 litros diarios: «Yo puedo comprar mi propio tanque. Prefiero eso a pagar un descuento por unos tanques que no voy a usar».\n\nLa inspectora sanitaria del departamento: «La norma protege a los consumidores: la leche sin frío se contamina con rapidez».", "vis": "", "items": [{"id": "CCT-226", "niv": 1, "cp": "cc_multiperspectivismo", "e": "¿Por qué doña Teresa no está de acuerdo con la propuesta del gerente?", "f": "Situación original elaborada para este simulacro, párrafo 4", "vis": "", "o": [["A", "Porque tendría que pagar un descuento por unos tanques comunitarios que no usaría.", "Doña Teresa dice que puede comprar su propio tanque y que no quiere pagar un descuento por tanques que no va a usar.", true], ["B", "Porque su finca queda demasiado lejos del sitio donde se instalaría el tanque de su vereda.", "La distancia es el problema de don Abelardo, no el de doña Teresa.", false], ["C", "Porque la pasteurizadora le compra la leche directamente sin pasar por la cooperativa.", "El texto no dice nada de eso; ella es socia de la cooperativa.", false], ["D", "Porque considera que la norma sanitaria es innecesaria para proteger a los consumidores.", "Doña Teresa no discute la norma; su objeción es al mecanismo de financiación.", false]]}, {"id": "CCT-227", "niv": 2, "cp": "cc_multiperspectivismo", "e": "¿Qué diferencia hay entre la situación de don Abelardo y la de doña Teresa frente a la norma?", "f": "Situación original elaborada para este simulacro, párrafos 3 y 4", "vis": "", "o": [["A", "Don Abelardo rechaza la norma por considerarla innecesaria, mientras que doña Teresa la apoya.", "Ninguno de los dos discute la necesidad de la norma; ambos hablan de cómo cumplirla.", false], ["B", "Doña Teresa vive más lejos del tanque comunitario que don Abelardo y por eso prefiere uno propio.", "El texto no dice dónde vive doña Teresa; su razón es que puede comprar su tanque y no quiere pagar por otros.", false], ["C", "Ambos tienen la misma dificultad para llevar la leche hasta el tanque comunitario de su vereda.", "Solo don Abelardo menciona la distancia; doña Teresa tendría su propio tanque.", false], ["D", "Doña Teresa puede cumplirla sola; a don Abelardo se le dificulta por la distancia y el costo.", "Doña Teresa afirma que puede comprar su tanque; don Abelardo señala que el tanque le queda lejos y que el descuento le deja muy poco (párrafos 3 y 4).", true]]}, {"id": "CCT-228", "niv": 3, "cp": "cc_multiperspectivismo", "e": "¿Qué ajuste a la propuesta del gerente tendría más probabilidad de ser aceptado por ambos productores?", "f": "Situación original elaborada para este simulacro", "vis": "", "o": [["A", "No cobrar el descuento a quien tenga tanque propio y poner más tanques cerca de las fincas alejadas.", "Atiende a doña Teresa, que no pagaría por tanques que no usa, y reduce la distancia que preocupa a don Abelardo, mientras la cooperativa cumple la norma.", true], ["B", "Pedir a la inspectora sanitaria que no aplique la norma en el municipio durante los próximos dos años.", "La inspectora defiende la norma para proteger a los consumidores, y sin cumplirla la pasteurizadora dejaría de comprar.", false], ["C", "Mantener el mismo descuento para todos los socios y conservar un solo tanque comunitario por vereda.", "Es la propuesta original, que ninguno de los dos acepta.", false], ["D", "Obligar a todos los socios a comprar su propio tanque de enfriamiento en un plazo de seis meses.", "Doña Teresa podría hacerlo, pero don Abelardo, con 20 litros diarios, difícilmente; él la rechazaría.", false]]}]}, {"comp": "competencias_ciudadanas", "sim": "tyt-2", "ind": "Pavimentación de una vía terciaria", "tt": "", "texto": "La gobernación pavimentará los 18 kilómetros de vía destapada que unen la cabecera municipal con la vereda Alto Bonito, donde viven 600 familias que cultivan aguacate y café. Hoy, un camión tarda dos horas en recorrerla y en invierno a veces no puede pasar.\n\nUn comerciante de aguacate estima que, con la vía pavimentada, los transportadores cobrarán menos por cada viaje y los campesinos recibirán mejor precio por su cosecha.\n\nLa presidenta de la junta de acción comunal teme que, al valorizarse las tierras, lleguen compradores de la ciudad a construir casas de recreo y que varias familias vendan sus fincas y se vayan de la vereda.\n\nEl inspector de tránsito advierte que, en otras vías pavimentadas de la región, aumentaron los accidentes por exceso de velocidad frente a las escuelas. Un concejal propone que la obra incluya reductores de velocidad y señalización frente a la escuela de la vereda.", "vis": "", "items": [{"id": "CCT-229", "niv": 1, "cp": "cc_sistemico", "e": "¿Qué relación establece el comerciante de aguacate?", "f": "Situación original elaborada para este simulacro, párrafo 2", "vis": "", "o": [["A", "Entre las lluvias del invierno y la calidad del aguacate que se cultiva en la vereda.", "El comerciante no habla de la calidad del aguacate.", false], ["B", "Entre la mejora de la vía y el ingreso de los campesinos, mediante un transporte más barato.", "El comerciante dice que, con la vía pavimentada, los transportadores cobrarán menos y los campesinos recibirán mejor precio (párrafo 2).", true], ["C", "Entre la pavimentación de la vía y la llegada de compradores de tierras que vienen desde la ciudad.", "Esa relación la plantea la presidenta de la junta de acción comunal, no el comerciante.", false], ["D", "Entre la velocidad de los vehículos en la vía y los accidentes frente a las escuelas.", "Esa relación la plantea el inspector de tránsito.", false]]}, {"id": "CCT-230", "niv": 2, "cp": "cc_sistemico", "e": "La preocupación de la presidenta de la junta muestra que la obra puede tener efectos en una dimensión distinta de la económica. ¿Cuál?", "f": "Situación original elaborada para este simulacro, párrafo 3", "vis": "", "o": [["A", "La de seguridad vial, porque los nuevos habitantes conducirían a mayor velocidad por la vía.", "El riesgo de accidentes lo plantea el inspector de tránsito, no la presidenta.", false], ["B", "La ambiental, porque el asfalto aumentaría la temperatura de los cultivos de aguacate y de café de la vereda.", "La presidenta no menciona efectos sobre el clima ni sobre los cultivos.", false], ["C", "La social y cultural, pues la venta de fincas podría cambiar la comunidad y su vida campesina.", "La presidenta teme que familias vendan y se vayan y que lleguen personas de la ciudad con casas de recreo: cambiaría quiénes viven en la vereda y su forma de vida.", true], ["D", "La de salud, porque las casas de recreo producirían residuos que contaminarían el agua.", "La presidenta no habla de residuos ni de contaminación del agua.", false]]}, {"id": "CCT-231", "niv": 2, "cp": "cc_sistemico", "e": "¿Qué aspecto del problema privilegia la propuesta del concejal?", "f": "Situación original elaborada para este simulacro, párrafo 4", "vis": "", "o": [["A", "El ingreso económico de los comerciantes de aguacate de la región.", "La propuesta no afecta precios ni costos de transporte.", false], ["B", "La seguridad vial de la comunidad, en especial la de los niños de la escuela.", "Los reductores y la señalización frente a la escuela responden al riesgo de accidentes por exceso de velocidad señalado por el inspector.", true], ["C", "La permanencia de las familias campesinas en sus fincas y en la vereda Alto Bonito.", "Esa es la preocupación de la presidenta de la junta, que la propuesta del concejal no aborda.", false], ["D", "La reducción de la contaminación del aire producida por los vehículos.", "La propuesta busca reducir la velocidad frente a la escuela, no las emisiones.", false]]}, {"id": "CCT-232", "niv": 3, "cp": "cc_sistemico", "e": "¿Cuál de las siguientes afirmaciones sobre la obra es la más adecuada según el texto?", "f": "Situación original elaborada para este simulacro", "vis": "", "o": [["A", "No tendrá ningún efecto en la vereda, porque los precios del aguacate dependen solo del mercado internacional.", "El texto no menciona el mercado internacional y sí describe varios efectos de la obra en la vereda.", false], ["B", "Solo tendrá efectos positivos, porque reducirá el tiempo que tardan los camiones en sacar la cosecha.", "Desconoce los riesgos que señalan la presidenta de la junta y el inspector de tránsito.", false], ["C", "Puede mejorar el ingreso campesino, pero sin otras medidas podría traer accidentes y presión sobre la tierra.", "El texto muestra un efecto económico positivo (comerciante) y dos riesgos (presidenta e inspector); por eso la obra requiere medidas complementarias como la que propone el concejal.", true], ["D", "Solo afectará a los comerciantes y transportadores, porque son quienes usan la vía con sus camiones.", "La obra afecta también a las familias, a la tenencia de la tierra y a los niños de la escuela.", false]]}]}, {"comp": "competencias_ciudadanas", "sim": "tyt-2", "ind": "Máquina de corte láser en una fábrica de ropa", "tt": "", "texto": "Una fábrica de ropa deportiva con 90 trabajadores compró una máquina de corte láser que hace en una hora el trabajo que hoy hacen seis cortadores en una jornada. La gerencia calcula que la máquina reducirá el desperdicio de tela del 15 % al 5 % y que, con la misma planta, la empresa podrá aceptar pedidos más grandes de exportación. La máquina requiere dos técnicos capacitados en programación y aumentará el consumo de energía.\n\nLa fábrica tiene hoy doce cortadores. El sindicato teme que la mayoría pierda su empleo; la gerencia responde que, si crecen los pedidos, se necesitarán más costureras y más personal de empaque.", "vis": "", "items": [{"id": "CCT-233", "niv": 1, "cp": "cc_sistemico", "e": "¿Qué dimensiones se relacionan en la reducción del desperdicio de tela?", "f": "Situación original elaborada para este simulacro, párrafo 1", "vis": "", "o": [["A", "La económica y la ambiental, porque se gasta menos material y se generan menos residuos.", "Desperdiciar menos tela ahorra costos de materia prima (económica) y reduce los retazos que se desechan (ambiental).", true], ["B", "La política y la jurídica, porque la empresa debe cumplir una norma sobre manejo de la tela.", "El texto no menciona ninguna norma sobre la tela.", false], ["C", "La laboral y la cultural, porque cambia la forma tradicional en que los cortadores hacen su oficio.", "La reducción del desperdicio se refiere al uso de la tela, no al oficio de los cortadores.", false], ["D", "La educativa y la de salud, porque los técnicos deben capacitarse para manejar la máquina.", "La capacitación de los técnicos no tiene relación con la reducción del desperdicio.", false]]}, {"id": "CCT-234", "niv": 2, "cp": "cc_sistemico", "e": "Según el texto, ¿de qué depende principalmente que se cumpla o no el temor del sindicato?", "f": "Situación original elaborada para este simulacro, párrafo 2", "vis": "", "o": [["A", "De que el desperdicio de tela baje efectivamente del 15 % al 5 % en los primeros meses.", "La reducción del desperdicio no determina por sí sola si se conservan los empleos.", false], ["B", "Del precio de la energía eléctrica, que determinará si la empresa usa o no la máquina de corte láser.", "El texto menciona el mayor consumo de energía, pero no lo relaciona con la decisión de usar la máquina.", false], ["C", "Del número de técnicos en programación que la empresa encuentre disponibles en la ciudad.", "La máquina solo requiere dos técnicos; eso no explica la suerte de los doce cortadores.", false], ["D", "De que de verdad crezcan los pedidos y se abran puestos en otras áreas, como costura y empaque.", "La gerencia sostiene que, si crecen los pedidos, se necesitará más personal de costura y empaque; si eso no ocurre, la máquina reemplazaría a la mayoría de los cortadores.", true]]}, {"id": "CCT-235", "niv": 3, "cp": "cc_sistemico", "e": "¿Qué decisión combinaría mejor los intereses de la gerencia y del sindicato, según el texto?", "f": "Situación original elaborada para este simulacro", "vis": "", "o": [["A", "Capacitar a algunos cortadores en la máquina y pasar a otros a costura o empaque si crecen los pedidos.", "La empresa aprovecha la máquina y cubre los dos cargos técnicos y los nuevos puestos con su personal; los cortadores conservan empleo.", true], ["B", "Despedir a los doce cortadores y contratar a dos técnicos externos para manejar la máquina.", "Es justamente lo que teme el sindicato; no combina los intereses de ambas partes.", false], ["C", "Mantener a los cortadores en la planta sin funciones asignadas hasta que se pensionen.", "Genera costos sin productividad para la empresa y no aprovecha la posibilidad de reubicarlos.", false], ["D", "Devolver la máquina de corte láser al proveedor para conservar los doce puestos de corte que existen hoy.", "Protege los empleos actuales, pero la gerencia renunciaría a los beneficios que busca con la máquina.", false]]}]}, {"comp": "ingles", "sim": "tyt-2", "ind": "Oficios técnicos", "tt": "", "texto": "Read the descriptions of some jobs. Which word (A–H) matches each description?\n\nA. baker   B. carpenter   C. electrician   D. mechanic   E. nurse   F. pilot   G. plumber   H. tailor\n\nExample: This person makes bread and cakes. Answer: A (baker).\n\nEach word can be used only once. The word in the example is not used again, and two words are not used at all.", "vis": "", "items": [{"id": "EN2-201", "niv": 1, "cp": "en_p1", "e": "This person repairs cars and motorcycles.", "f": "Texto original elaborado para este simulacro, lista de palabras de la parte 1", "vis": "", "o": [["A", "baker", "«baker» (panadero) es la palabra del ejemplo y no se vuelve a usar; además, hace pan y tortas, no alguien que repara carros y motos.", false], ["B", "carpenter", "«carpenter» (carpintero): fabrica muebles, puertas y otros objetos de madera; la descripción, en cambio, habla de alguien que repara carros y motos.", false], ["C", "electrician", "«electrician» (electricista): instala y repara cables, luces y tomas de corriente; la descripción, en cambio, habla de alguien que repara carros y motos.", false], ["D", "mechanic", "Correcta. «mechanic» (mecánico): «repairs cars and motorcycles» (repara carros y motos) es el trabajo del mecánico.", true], ["E", "nurse", "«nurse» (enfermero): cuida a los pacientes en un hospital; no corresponde a ninguna de las descripciones; la descripción, en cambio, habla de alguien que repara carros y motos.", false], ["F", "pilot", "«pilot» (piloto): maneja aviones; no corresponde a ninguna de las descripciones; la descripción, en cambio, habla de alguien que repara carros y motos.", false], ["G", "plumber", "«plumber» (plomero): arregla tuberías, lavamanos y sanitarios; la descripción, en cambio, habla de alguien que repara carros y motos.", false], ["H", "tailor", "«tailor» (sastre): confecciona y arregla ropa, como trajes y chaquetas; la descripción, en cambio, habla de alguien que repara carros y motos.", false]]}, {"id": "EN2-202", "niv": 1, "cp": "en_p1", "e": "This person makes and repairs clothes, for example suits and jackets.", "f": "Texto original elaborado para este simulacro, lista de palabras de la parte 1", "vis": "", "o": [["A", "baker", "«baker» (panadero) es la palabra del ejemplo y no se vuelve a usar; además, hace pan y tortas, no alguien que hace y arregla ropa.", false], ["B", "carpenter", "«carpenter» (carpintero): fabrica muebles, puertas y otros objetos de madera; la descripción, en cambio, habla de alguien que hace y arregla ropa.", false], ["C", "electrician", "«electrician» (electricista): instala y repara cables, luces y tomas de corriente; la descripción, en cambio, habla de alguien que hace y arregla ropa.", false], ["D", "mechanic", "«mechanic» (mecánico): repara carros y motos; la descripción, en cambio, habla de alguien que hace y arregla ropa.", false], ["E", "nurse", "«nurse» (enfermero): cuida a los pacientes en un hospital; no corresponde a ninguna de las descripciones; la descripción, en cambio, habla de alguien que hace y arregla ropa.", false], ["F", "pilot", "«pilot» (piloto): maneja aviones; no corresponde a ninguna de las descripciones; la descripción, en cambio, habla de alguien que hace y arregla ropa.", false], ["G", "plumber", "«plumber» (plomero): arregla tuberías, lavamanos y sanitarios; la descripción, en cambio, habla de alguien que hace y arregla ropa.", false], ["H", "tailor", "Correcta. «tailor» (sastre): «makes and repairs clothes» (hace y arregla ropa), como «suits and jackets» (trajes y chaquetas), es el trabajo del sastre.", true]]}, {"id": "EN2-203", "niv": 1, "cp": "en_p1", "e": "This person makes tables, chairs and doors from wood.", "f": "Texto original elaborado para este simulacro, lista de palabras de la parte 1", "vis": "", "o": [["A", "baker", "«baker» (panadero) es la palabra del ejemplo y no se vuelve a usar; además, hace pan y tortas, no alguien que hace mesas, sillas y puertas de madera.", false], ["B", "carpenter", "Correcta. «carpenter» (carpintero): «makes tables, chairs and doors from wood» (hace mesas, sillas y puertas de madera) es el trabajo del carpintero.", true], ["C", "electrician", "«electrician» (electricista): instala y repara cables, luces y tomas de corriente; la descripción, en cambio, habla de alguien que hace mesas, sillas y puertas de madera.", false], ["D", "mechanic", "«mechanic» (mecánico): repara carros y motos; la descripción, en cambio, habla de alguien que hace mesas, sillas y puertas de madera.", false], ["E", "nurse", "«nurse» (enfermero): cuida a los pacientes en un hospital; no corresponde a ninguna de las descripciones; la descripción, en cambio, habla de alguien que hace mesas, sillas y puertas de madera.", false], ["F", "pilot", "«pilot» (piloto): maneja aviones; no corresponde a ninguna de las descripciones; la descripción, en cambio, habla de alguien que hace mesas, sillas y puertas de madera.", false], ["G", "plumber", "«plumber» (plomero): arregla tuberías, lavamanos y sanitarios; la descripción, en cambio, habla de alguien que hace mesas, sillas y puertas de madera.", false], ["H", "tailor", "«tailor» (sastre): confecciona y arregla ropa, como trajes y chaquetas; la descripción, en cambio, habla de alguien que hace mesas, sillas y puertas de madera.", false]]}, {"id": "EN2-204", "niv": 1, "cp": "en_p1", "e": "This person fixes pipes, sinks and toilets when there is a water problem.", "f": "Texto original elaborado para este simulacro, lista de palabras de la parte 1", "vis": "", "o": [["A", "baker", "«baker» (panadero) es la palabra del ejemplo y no se vuelve a usar; además, hace pan y tortas, no alguien que arregla tuberías y sanitarios.", false], ["B", "carpenter", "«carpenter» (carpintero): fabrica muebles, puertas y otros objetos de madera; la descripción, en cambio, habla de alguien que arregla tuberías y sanitarios.", false], ["C", "electrician", "«electrician» (electricista): instala y repara cables, luces y tomas de corriente; la descripción, en cambio, habla de alguien que arregla tuberías y sanitarios.", false], ["D", "mechanic", "«mechanic» (mecánico): repara carros y motos; la descripción, en cambio, habla de alguien que arregla tuberías y sanitarios.", false], ["E", "nurse", "«nurse» (enfermero): cuida a los pacientes en un hospital; no corresponde a ninguna de las descripciones; la descripción, en cambio, habla de alguien que arregla tuberías y sanitarios.", false], ["F", "pilot", "«pilot» (piloto): maneja aviones; no corresponde a ninguna de las descripciones; la descripción, en cambio, habla de alguien que arregla tuberías y sanitarios.", false], ["G", "plumber", "Correcta. «plumber» (plomero): «fixes pipes, sinks and toilets» (arregla tuberías, lavamanos y sanitarios) cuando hay un problema de agua es el trabajo del plomero.", true], ["H", "tailor", "«tailor» (sastre): confecciona y arregla ropa, como trajes y chaquetas; la descripción, en cambio, habla de alguien que arregla tuberías y sanitarios.", false]]}, {"id": "EN2-205", "niv": 2, "cp": "en_p1", "e": "This person installs the wires that bring power to the lights and sockets in a building.", "f": "Texto original elaborado para este simulacro, lista de palabras de la parte 1", "vis": "", "o": [["A", "baker", "«baker» (panadero) es la palabra del ejemplo y no se vuelve a usar; además, hace pan y tortas, no alguien que instala el cableado eléctrico de un edificio.", false], ["B", "carpenter", "«carpenter» (carpintero): fabrica muebles, puertas y otros objetos de madera; la descripción, en cambio, habla de alguien que instala el cableado eléctrico de un edificio.", false], ["C", "electrician", "Correcta. «electrician» (electricista): «installs the wires that bring power» (instala los cables que llevan la energía) a las luces y tomas («sockets») es el trabajo del electricista.", true], ["D", "mechanic", "«mechanic» (mecánico): repara carros y motos; la descripción, en cambio, habla de alguien que instala el cableado eléctrico de un edificio.", false], ["E", "nurse", "«nurse» (enfermero): cuida a los pacientes en un hospital; no corresponde a ninguna de las descripciones; la descripción, en cambio, habla de alguien que instala el cableado eléctrico de un edificio.", false], ["F", "pilot", "«pilot» (piloto): maneja aviones; no corresponde a ninguna de las descripciones; la descripción, en cambio, habla de alguien que instala el cableado eléctrico de un edificio.", false], ["G", "plumber", "«plumber» (plomero): arregla tuberías, lavamanos y sanitarios; la descripción, en cambio, habla de alguien que instala el cableado eléctrico de un edificio.", false], ["H", "tailor", "«tailor» (sastre): confecciona y arregla ropa, como trajes y chaquetas; la descripción, en cambio, habla de alguien que instala el cableado eléctrico de un edificio.", false]]}]}, {"comp": "ingles", "sim": "tyt-2", "ind": "Avisos en lugares de trabajo", "tt": "", "texto": "Read each notice. Where can you see it? Choose the correct place.", "vis": "", "items": [{"id": "EN2-206", "niv": 1, "cp": "en_p2", "e": "\"Ear protection must be worn when the machines are running.\"\n\nWhere can you see this notice?", "f": "Texto original elaborado para este simulacro, aviso de la parte 2", "vis": "", "o": [["A", "in a library", "En una biblioteca se pide silencio; no hay máquinas ruidosas que exijan protección auditiva.", false], ["B", "in a factory", "Correcta. Protección auditiva («ear protection») mientras funcionan las máquinas («machines are running») es una norma típica de una fábrica ruidosa.", true], ["C", "in a cinema", "En un cine no hay máquinas de producción funcionando ni se exige protección auditiva.", false]]}, {"id": "EN2-207", "niv": 1, "cp": "en_p2", "e": "\"Free tyre pressure checks. Ask the mechanic inside.\"\n\nWhere can you see this notice?", "f": "Texto original elaborado para este simulacro, aviso de la parte 2", "vis": "", "o": [["A", "at a garage", "Correcta. Revisar la presión de las llantas («tyre pressure») y un mecánico («mechanic») indican un taller de vehículos.", true], ["B", "in a bakery", "En una panadería se vende pan; no hay mecánico ni servicio para llantas.", false], ["C", "at a bus stop", "En un paradero se espera el bus; no hay mecánico ni revisión de llantas.", false]]}, {"id": "EN2-208", "niv": 1, "cp": "en_p2", "e": "\"Meeting Room B is booked from 2 to 4 p.m. Please do not disturb.\"\n\nWhere can you see this notice?", "f": "Texto original elaborado para este simulacro, aviso de la parte 2", "vis": "", "o": [["A", "on a farm", "En una finca no suele haber salas de reuniones que se reserven por horas.", false], ["B", "in a park", "En un parque no hay salas de reuniones con reserva.", false], ["C", "in an office", "Correcta. Una sala de reuniones («meeting room») reservada por horas es típica de una oficina.", true]]}, {"id": "EN2-209", "niv": 1, "cp": "en_p2", "e": "\"Staff must wash their hands and wear a hairnet before touching any ingredients.\"\n\nWhere can you see this notice?", "f": "Texto original elaborado para este simulacro, aviso de la parte 2", "vis": "", "o": [["A", "in a restaurant kitchen", "Correcta. Lavarse las manos y usar malla para el cabello («hairnet») antes de tocar ingredientes («ingredients») es una norma de higiene para el personal de una cocina.", true], ["B", "in a hotel bedroom", "Una habitación de hotel no es un lugar donde el personal manipula ingredientes.", false], ["C", "in a car repair shop", "En un taller de carros no se manipulan ingredientes ni se exige malla para el cabello.", false]]}, {"id": "EN2-210", "niv": 2, "cp": "en_p2", "e": "\"Drivers: sign for your parcels and check your van's lights before you leave.\"\n\nWhere can you see this notice?", "f": "Texto original elaborado para este simulacro, aviso de la parte 2", "vis": "", "o": [["A", "in a school library", "En una biblioteca escolar no hay conductores ni furgonetas que salgan a repartir paquetes.", false], ["B", "in a hospital waiting room", "En una sala de espera de hospital no hay conductores que reciban paquetes ni revisen furgonetas.", false], ["C", "at a delivery company", "Correcta. El aviso se dirige a conductores («drivers») que firman por sus paquetes («parcels») y revisan su furgoneta antes de salir a repartir: es una empresa de entregas.", true]]}, {"id": "EN2-211", "niv": 2, "cp": "en_p2", "e": "\"Please return all tools to the correct shelf and report any damaged equipment to the supervisor.\"\n\nWhere can you see this notice?", "f": "Texto original elaborado para este simulacro, aviso de la parte 2", "vis": "", "o": [["A", "at a hotel reception", "En la recepción de un hotel no se guardan herramientas en estantes ni se reporta equipo dañado de trabajo.", false], ["B", "in a workshop", "Correcta. Devolver «tools» (herramientas) a su estante y reportar equipo dañado al «supervisor» es una norma de un taller.", true], ["C", "in a clothes shop", "Una tienda de ropa no presta herramientas que deban devolverse a un estante.", false]]}]}, {"comp": "ingles", "sim": "tyt-2", "ind": "Conversaciones en el trabajo", "tt": "", "texto": "Complete the conversations. Choose the best reply to each sentence.", "vis": "", "items": [{"id": "EN2-212", "niv": 1, "cp": "en_p3", "e": "\"When is the delivery coming?\"", "f": "Texto original elaborado para este simulacro, conversación de la parte 3", "vis": "", "o": [["A", "By lorry, I think.", "Responde «how» (cómo llega), no «when» (cuándo).", false], ["B", "Tomorrow morning, before ten.", "Correcta. «When» pregunta por el momento; «Tomorrow morning, before ten» (mañana en la mañana, antes de las diez) lo indica.", true], ["C", "Yes, it's coming.", "Una pregunta con «when» no se responde con «yes».", false]]}, {"id": "EN2-213", "niv": 1, "cp": "en_p3", "e": "\"Is this your toolbox?\"", "f": "Texto original elaborado para este simulacro, conversación de la parte 3", "vis": "", "o"
