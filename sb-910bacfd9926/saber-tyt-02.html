<style>
:root{--bg:#f7f5f2;--card:#fff;--ink:#1d2433;--mute:#5a6478;--line:#e0dbd4;--pri:#7a2e0b;--pri2:#b0501c;--ok:#0d6b3a;--okbg:#e6f4ec;--no:#9b1c1c;--nobg:#fbeaea;--sel:#f8ece4}
@media (prefers-color-scheme: dark){:root{--bg:#14110f;--card:#1f1a17;--ink:#ece6e1;--mute:#a69c94;--line:#3a322c;--pri:#f0a47a;--pri2:#f5bb98;--ok:#7fd3a3;--okbg:#16301f;--no:#f2a3a3;--nobg:#3a1c1c;--sel:#3a2a20}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overflow-wrap:anywhere}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px}
.hwrap{max-width:860px;margin:0 auto;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;justify-content:space-between}
h1{font-size:17px;margin:0;color:var(--pri)}
h2{color:var(--pri)}
.stat{font-size:14px;color:var(--mute)}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--pri)}
.timer.low{color:var(--no)}
main{max-width:860px;margin:0 auto;padding:16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin:0 0 16px}
.mod{background:var(--pri);color:var(--card);border-radius:10px;padding:10px 14px;margin:28px 0 6px;font-weight:700;font-size:18px}
.inst{font-size:13px;font-weight:700;color:var(--pri);text-transform:uppercase;letter-spacing:.03em;margin:18px 0 4px}
.caso{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--pri);border-radius:10px;padding:14px 16px;margin:10px 0}
.tag{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--pri);font-weight:700}
.caso p{margin:6px 0 0;white-space:pre-line}
.item{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0}
.enun{margin:0 0 8px;white-space:pre-line}
.n{font-weight:700;color:var(--pri)}
.niv{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-right:4px;white-space:nowrap}
.op{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:6px 0;cursor:pointer;background:transparent;width:100%;text-align:left;color:inherit;font:inherit}
.ops8{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.ops8 .op{margin:0}
.op:hover{border-color:var(--pri2)}
.op .l{font-weight:700;min-width:20px}
.op.sel{background:var(--sel);border-color:var(--pri2)}
.op.ok{background:var(--okbg);border-color:var(--ok)}
.op.no{background:var(--nobg);border-color:var(--no)}
.op[disabled]{cursor:default}
.just{font-size:14px;margin:8px 0 0;padding:8px 10px;border-top:1px dashed var(--line)}
.just div{margin:4px 0}
.just .okt{color:var(--ok);font-weight:700}
.just .not{color:var(--no);font-weight:700}
.src{font-size:13px;color:var(--mute);margin-top:6px}
button.btn{background:var(--pri);color:var(--card);border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer}
button.btn.sec{background:transparent;color:var(--pri);border:1px solid var(--pri)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
select{font:inherit;padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);max-width:100%}
table{border-collapse:collapse;width:100%;font-size:15px}
td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.sub td{font-size:13px;color:var(--mute);padding-left:22px}
.vt{width:auto;max-width:100%;margin:10px 0;font-size:14px;display:block;overflow-x:auto}
.vt caption{text-align:left;font-weight:700;padding-bottom:4px}
.vt th,.vt td{border:1px solid var(--line);padding:4px 8px}
.vt th{background:var(--sel)}
.vnota{font-size:12px;color:var(--mute)}
.vfig{margin:10px 0}
.vfig svg{width:100%;max-width:560px;height:auto;border-radius:6px;border:1px solid var(--line);background:#fff}
.big{font-size:40px;font-weight:800;color:var(--pri);line-height:1.1}
.aviso{font-size:13px;color:var(--mute)}
.hide{display:none !important}
.res-ok{color:var(--ok);font-weight:700}.res-no{color:var(--no);font-weight:700}
textarea{width:100%;min-height:320px;font:inherit;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);resize:vertical}
.chk label{display:flex;gap:8px;align-items:flex-start;margin:6px 0;font-size:15px}
.chk input{margin-top:4px;width:18px;height:18px;flex:none}
.modelo{white-space:pre-line;background:var(--bg);border-radius:8px;padding:10px 12px;margin:6px 0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal .panel{max-width:420px}
.nav{padding:6px 0;display:flex;gap:6px;flex-wrap:wrap}
.nav a{font-size:13px;color:var(--pri);border:1px solid var(--line);border-radius:999px;padding:3px 10px;text-decoration:none;background:var(--card)}
footer{max-width:860px;margin:0 auto;padding:8px 16px 40px;font-size:12px;color:var(--mute)}
</style>

<script>
const DATA = [{"comp": "lectura_critica", "sim": "tyt-2", "ind": "Fragmento teatral: un portero y un domiciliario", "tt": "Texto literario", "texto": "Turno de noche (fragmento de una obra de teatro)\n\nPortería de un edificio residencial. Once de la noche. DON EFRAÍN, portero de unos sesenta años, escucha un radio pequeño. Entra KEVIN, domiciliario de veinte años, con casco y una maleta térmica a la espalda.\n\nKEVIN: Buenas noches. Un pedido para el 802, a nombre de Patricia.\nDON EFRAÍN: (Toma el citófono, marca, espera.) No contestan.\nKEVIN: Márquele otra vez, por favor. La aplicación me da diez minutos de espera y ya llevo cuatro.\nDON EFRAÍN: (Marca de nuevo.) Nada. ¿Y si la llama usted al celular?\nKEVIN: Ya la llamé tres veces. Buzón. (Mira el celular.) Si se pasan los diez minutos, el pedido se cancela y me lo descuentan a mí.\nDON EFRAÍN: ¿A usted? ¿Y usted qué culpa tiene?\nKEVIN: Ninguna. Pero así funciona.\nDON EFRAÍN: (Apaga el radio.) Yo fui mensajero, ¿sabe? En bicicleta, cuando no había celulares. Me daban un sobre y una dirección escrita a mano. Si no había nadie, dejaba una nota debajo de la puerta y volvía al otro día.\nKEVIN: Al otro día. (Ríe sin ganas.) Aquí, al otro día ya me desactivaron.\nDON EFRAÍN: (Pausa.) Deje el pedido aquí. Yo se lo subo cuando ella baje.\nKEVIN: No puedo. Tengo que tomar una foto entregándoselo a la persona. Si no, no cuenta.\nDON EFRAÍN: ¿Una foto? ¿Y la palabra de uno no vale?\nKEVIN: La palabra no se puede subir a la aplicación, don Efraín.\n\n(Suena el citófono. DON EFRAÍN contesta.)\n\nDON EFRAÍN: Portería… Sí, señora. Aquí está el muchacho. (Cuelga.) Que ya baja. Que estaba en la ducha.\nKEVIN: (Mira el celular.) Ocho minutos. (Respira.) Gracias.\nDON EFRAÍN: No me dé las gracias a mí. Déselas a la ducha, que no fue tan larga.\n\n(KEVIN sonríe por primera vez. DON EFRAÍN vuelve a encender el radio. Se oye un bolero.)", "vis": "", "items": [{"id": "LCT-136", "niv": 1, "cp": "lc_local", "e": "Según Kevin, ¿qué ocurre si se cumplen los diez minutos de espera sin que la clienta reciba el pedido?", "f": "Texto original elaborado para este simulacro, parlamento de Kevin", "vis": "", "o": [["A", "El portero del edificio debe responder por el valor del pedido.", "Nadie atribuye esa responsabilidad a don Efraín; el descuento recae sobre Kevin.", false], ["B", "Se cancela la entrega y se lo descuentan a Kevin.", "Kevin lo dice expresamente: «Si se pasan los diez minutos, el pedido se cancela y me lo descuentan a mí».", true], ["C", "La aplicación le asigna el pedido a otro domiciliario más cercano.", "Kevin no menciona una reasignación; dice que el pedido se cancela.", false], ["D", "La clienta recibe el pedido sin pagarlo, como compensación por la demora.", "El fragmento no menciona ninguna compensación para la clienta.", false]]}, {"id": "LCT-137", "niv": 2, "cp": "lc_global", "e": "¿Qué función cumple en el fragmento el recuerdo de don Efraín sobre su trabajo como mensajero?", "f": "Texto original elaborado para este simulacro, parlamentos de don Efraín y Kevin", "vis": "", "o": [["A", "Demostrar que el trabajo de mensajero en bicicleta era más peligroso que el de domiciliario.", "El fragmento no compara peligros; compara plazos y formas de control del trabajo.", false], ["B", "Explicar por qué don Efraín decidió abandonar la mensajería y emplearse como portero de un edificio.", "El texto no cuenta por qué dejó de ser mensajero.", false], ["C", "Contrastar las condiciones de su antiguo oficio con la presión que hoy vive Kevin.", "Don Efraín recuerda que podía dejar una nota y «volver al otro día»; Kevin responde que «al otro día ya me desactivaron»: el recuerdo sirve para contrastar dos formas de trabajo.", true], ["D", "Convencer a Kevin de que trabaje sin usar la aplicación de domicilios.", "Don Efraín no le propone dejar la aplicación; solo comparte su experiencia.", false]]}, {"id": "LCT-138", "niv": 2, "cp": "lc_reflexion", "e": "Cuando Kevin dice «La palabra no se puede subir a la aplicación», da a entender que", "f": "Texto original elaborado para este simulacro, parlamentos finales antes del citófono", "vis": "", "o": [["A", "en su trabajo solo vale lo que la aplicación puede registrar, no la confianza entre personas.", "Responde a «¿Y la palabra de uno no vale?»: la entrega solo «cuenta» si hay una foto que la aplicación registre; la palabra del portero no sirve como prueba.", true], ["B", "don Efraín no sabe usar el celular para tomar y enviar fotografías.", "El fragmento no dice nada sobre la habilidad de don Efraín con el celular.", false], ["C", "la aplicación tiene fallas técnicas que le impiden enviar mensajes de texto a los clientes.", "Kevin no menciona fallas técnicas; habla de lo que la aplicación exige como prueba.", false], ["D", "Kevin desconfía de que don Efraín vaya a subirle el pedido a la clienta.", "Kevin no expresa desconfianza hacia el portero; explica una regla de la aplicación («Si no, no cuenta»).", false]]}, {"id": "LCT-139", "niv": 1, "cp": "lc_global", "e": "La acotación final indica que Kevin «sonríe por primera vez». Esto sugiere que", "f": "Texto original elaborado para este simulacro, acotación final", "vis": "", "o": [["A", "Kevin ha decidido renunciar esa misma noche a su trabajo de domiciliario.", "Nada en el texto indica que Kevin vaya a renunciar.", false], ["B", "Kevin se burla de don Efraín por haber trabajado en una época sin celulares.", "La sonrisa llega después de la broma de don Efraín, no como burla hacia él.", false], ["C", "Kevin se alegra porque la clienta le prometió una buena propina por haberla esperado tanto tiempo.", "En el fragmento nadie habla de propinas.", false], ["D", "la tensión se alivia al saber que la clienta bajará a tiempo y con la broma de don Efraín.", "Antes Kevin solo «ríe sin ganas»; tras saber que la clienta ya baja cuando van ocho minutos (dentro del plazo) y oír la broma sobre la ducha, sonríe: la tensión ha cedido.", true]]}, {"id": "LCT-140", "niv": 3, "cp": "lc_reflexion", "e": "¿Cuál de los siguientes enunciados expresa mejor una crítica que plantea el fragmento?", "f": "Texto original elaborado para este simulacro, parlamentos de Kevin y don Efraín", "vis": "", "o": [["A", "Los clientes de los domicilios suelen esconderse para no pagar lo que piden.", "La clienta estaba en la ducha y baja; el fragmento no acusa a los clientes.", false], ["B", "Los porteros deberían encargarse de recibir los domicilios cuando el cliente no conteste.", "Don Efraín ofrece hacerlo, pero el fragmento no lo plantea como crítica ni como solución: muestra que la aplicación no lo admite.", false], ["C", "Algunos sistemas de trabajo cargan al trabajador con las consecuencias de hechos que él no controla.", "Kevin pagaría el pedido cancelado aunque la clienta no conteste; ante «¿Y usted qué culpa tiene?», responde «Ninguna. Pero así funciona».", true], ["D", "La tecnología volvió más lento el trabajo de mensajería que antes se hacía en bicicleta.", "El texto sugiere lo contrario: hoy los plazos son más cortos y exigentes que antes.", false]]}]}, {"comp": "lectura_critica", "sim": "tyt-2", "ind": "Ensayo sobre la cultura de la reparación", "tt": "Texto informativo", "texto": "Antes de botar, preguntar\n\n(1) Hasta hace unas décadas, en casi cualquier barrio había un señor que arreglaba radios, una señora que remendaba zapatos y un taller donde una licuadora podía volver a la vida por una fracción de lo que costaba una nueva. Hoy muchos de esos oficios sobreviven con dificultad, y no solo porque los aparatos sean más complejos.\n\n(2) Una parte del problema está en el diseño. Hay productos que se ensamblan con pegantes en lugar de tornillos, que usan piezas exclusivas o que no traen manuales de servicio. Cuando abrir un aparato implica romperlo, repararlo deja de ser una opción razonable. Otra parte está en el precio: si un arreglo cuesta casi lo mismo que un equipo nuevo, la decisión parece obvia.\n\n(3) Pero esa cuenta suele estar incompleta. El precio de un aparato nuevo no incluye lo que cuesta deshacerse del viejo: los residuos electrónicos contienen metales y plásticos que, mal manejados, contaminan suelos y fuentes de agua. Tampoco incluye la energía y los materiales que se gastaron en fabricarlo. Lo barato, en este caso, lo paga alguien más, solo que más tarde.\n\n(4) Hay, además, una pérdida menos visible: la del conocimiento. Quien repara aprende cómo funcionan las cosas, y ese saber se transmite entre personas. Cada taller que cierra se lleva consigo años de experiencia que no están escritos en ningún manual.\n\n(5) No se trata de idealizar el pasado. Muchos aparatos de hoy son más eficientes y seguros que los de antes, y no todo merece ser reparado. Una nevera muy antigua, por ejemplo, puede consumir tanta energía que reemplazarla resulte la mejor decisión, incluso para el ambiente. Lo que se cuestiona aquí no es la compra de lo nuevo, sino la costumbre de no preguntarse siquiera si lo viejo tiene arreglo.\n\n(6) En algunos países ya se discuten normas que obligan a los fabricantes a ofrecer repuestos y manuales durante varios años. Mientras esas discusiones avanzan, cada persona puede hacer algo más sencillo: antes de botar, preguntar. A veces la respuesta sorprende.", "vis": "", "items": [{"id": "LCT-141", "niv": 1, "cp": "lc_local", "e": "Según el párrafo 2, ¿qué características de diseño dificultan la reparación de algunos productos?", "f": "Texto original elaborado para este simulacro, párrafo 2", "vis": "", "o": [["A", "Que consuman mucha energía y contengan metales que contaminan los suelos y el agua.", "El consumo de energía se refiere a las neveras antiguas (párrafo 5) y los metales a los residuos (párrafo 3); ninguno es un rasgo de diseño que impida reparar.", false], ["B", "Que sean más eficientes y más seguros que los aparatos que se fabricaban hace unas cuantas décadas.", "Esa característica aparece en el párrafo 5 como algo positivo de los aparatos actuales, no como obstáculo para repararlos.", false], ["C", "Que el fabricante ofrezca repuestos durante varios años.", "Ofrecer repuestos facilitaría la reparación; el párrafo 6 lo menciona como una norma en discusión.", false], ["D", "Que vayan pegados y no atornillados, usen piezas exclusivas o no tengan manual.", "El párrafo 2 menciona pegantes en lugar de tornillos, piezas exclusivas y ausencia de manuales de servicio; la opción lo parafrasea.", true]]}, {"id": "LCT-142", "niv": 2, "cp": "lc_global", "e": "¿Cuál es la idea principal que defiende el autor?", "f": "Texto original elaborado para este simulacro, párrafos 1 a 6", "vis": "", "o": [["A", "Antes de reemplazar un aparato conviene preguntar si tiene arreglo, pues desecharlo tiene costos ocultos.", "El autor muestra los costos ocultos de desechar (párrafos 3 y 4), aclara que no rechaza lo nuevo (párrafo 5) y concluye: «antes de botar, preguntar» (párrafo 6).", true], ["B", "Los talleres de barrio desaparecieron porque los aparatos actuales son demasiado complejos para repararlos.", "El párrafo 1 dice que esos oficios sobreviven con dificultad «no solo porque los aparatos sean más complejos»; la idea del autor es otra.", false], ["C", "Los aparatos dañados deben repararse aunque consuman mucha energía, porque reparar es mejor que comprar.", "El párrafo 5 lo niega: una nevera muy antigua puede consumir tanta energía que reemplazarla sea la mejor decisión.", false], ["D", "Los aparatos de antes eran mejores que los actuales y deberían volver a fabricarse.", "El autor dice «No se trata de idealizar el pasado» y reconoce que muchos aparatos de hoy son más eficientes y seguros.", false]]}, {"id": "LCT-143", "niv": 3, "cp": "lc_global", "e": "¿Qué función cumple el párrafo 5 en el desarrollo del texto?", "f": "Texto original elaborado para este simulacro, párrafo 5", "vis": "", "o": [["A", "Presentar el dato principal que demuestra que reparar resulta más barato que comprar.", "El párrafo 5 no da datos de precios; incluso pone un caso en el que reemplazar es mejor.", false], ["B", "Matizar la postura del autor para que no se entienda como un rechazo a todo lo nuevo.", "El párrafo reconoce ventajas de los aparatos actuales, admite que no todo merece repararse y precisa qué se cuestiona: no la compra de lo nuevo, sino no preguntar si lo viejo tiene arreglo.", true], ["C", "Contradecir lo expuesto en el párrafo 3 sobre los residuos electrónicos.", "El párrafo 5 no niega que los residuos contaminen; precisa los límites de la propuesta.", false], ["D", "Introducir un tema nuevo, el ahorro de energía en el hogar, que se desarrolla hasta el final del texto.", "La nevera es solo un ejemplo; el párrafo 6 vuelve a la reparación, no al ahorro de energía.", false]]}, {"id": "LCT-144", "niv": 2, "cp": "lc_reflexion", "e": "La afirmación «Lo barato, en este caso, lo paga alguien más, solo que más tarde» (párrafo 3) implica que", "f": "Texto original elaborado para este simulacro, párrafo 3", "vis": "", "o": [["A", "los costos ambientales de fabricar y desechar aparatos recaen sobre otros o aparecen en el futuro.", "El párrafo 3 explica que el precio no incluye la contaminación de los residuos ni la energía y los materiales de fabricación: esos costos no los paga el comprador en el momento, sino otros, después.", true], ["B", "los aparatos nuevos suelen comprarse a crédito y se terminan de pagar en cuotas durante varios meses.", "El texto no habla de crédito; «pagar» se usa en sentido figurado para los costos ocultos.", false], ["C", "los técnicos cobran más cuando el aparato llega tarde al taller.", "El párrafo 3 no trata del cobro de los técnicos.", false], ["D", "el comprador del aparato nuevo termina pagando el doble de su precio.", "El autor dice que paga «alguien más», no el propio comprador, y no menciona el doble del precio.", false]]}, {"id": "LCT-145", "niv": 3, "cp": "lc_reflexion", "e": "Un vendedor de electrodomésticos sostiene: «Si el arreglo cuesta casi lo mismo que un equipo nuevo, comprar el nuevo es siempre lo más económico». Desde el punto de vista del texto, la principal debilidad de este razonamiento es que", "f": "Texto original elaborado para este simulacro, párrafos 2 y 3", "vis": "", "o": [["A", "desconoce que el autor propone prohibir la venta de aparatos que no puedan repararse.", "El autor no propone ninguna prohibición; menciona normas que se discuten en otros países y sugiere preguntar antes de botar.", false], ["B", "supone que los aparatos nuevos son más eficientes, algo que el autor niega en el párrafo 5.", "El autor no lo niega: afirma que muchos aparatos de hoy son más eficientes y seguros.", false], ["C", "solo compara precios y deja por fuera costos como los residuos, la energía y los materiales.", "El párrafo 3 sostiene que «esa cuenta suele estar incompleta» porque el precio no incluye el costo de deshacerse del viejo ni la energía y los materiales de fabricación.", true], ["D", "olvida que los técnicos de barrio suelen cobrar menos que los almacenes por la instalación de equipos.", "El texto no compara lo que cobran técnicos y almacenes; además, el caso supone que el arreglo cuesta casi lo mismo que el equipo nuevo.", false]]}]}, {"comp": "lectura_critica", "sim": "tyt-2", "ind": "Texto expositivo sobre el curado del concreto", "tt": "Texto informativo", "texto": "¿Por qué se moja el concreto recién fundido?\n\n(1) Quien pasa junto a una obra puede ver algo que parece absurdo: trabajadores que riegan con manguera una placa de concreto recién fundida, o que la cubren con plásticos o costales húmedos durante varios días. ¿Por qué mojar algo que, se supone, debe secarse? La respuesta está en un error muy común: creer que el concreto se endurece porque se seca.\n\n(2) En realidad, el concreto gana resistencia gracias a una reacción química entre el cemento y el agua, llamada hidratación. Esta reacción no ocurre de una vez: es rápida en las primeras horas y continúa lentamente durante semanas. Para que siga avanzando, el cemento necesita agua disponible. Si la mezcla pierde humedad demasiado pronto, la reacción se frena y el concreto no alcanza la resistencia para la que fue diseñado.\n\n(3) Por eso existe el curado: el conjunto de medidas que mantienen la humedad y una temperatura adecuada en el concreto durante sus primeros días. Las formas más comunes son regar la superficie, cubrirla con materiales húmedos, sellarla con plástico o aplicar productos que forman una película que retiene el agua.\n\n(4) El sol fuerte, el viento y el aire seco aceleran la evaporación, y con ella aparecen dos problemas. El primero es la pérdida de resistencia. El segundo son las fisuras: cuando la superficie se seca más rápido que el interior, se contrae y se agrieta, como el barro de un charco que se seca. Esas grietas no solo afean el acabado; también abren caminos para que entren agua y otras sustancias que, con los años, deterioran la estructura.\n\n(5) Paradójicamente, el curado es una de las etapas que con más frecuencia se descuidan en obra. No requiere equipos costosos, pero sí constancia, y sus efectos no se ven de inmediato. Una placa mal curada puede parecer perfecta el día en que se retiran las formaletas y mostrar sus fallas meses después, cuando corregirlas cuesta mucho más.", "vis": "", "items": [{"id": "LCT-146", "niv": 1, "cp": "lc_local", "e": "Según el párrafo 2, el concreto gana resistencia gracias a", "f": "Texto original elaborado para este simulacro, párrafo 2", "vis": "", "o": [["A", "la evaporación rápida del agua que contiene la mezcla.", "Es justamente el error común que el texto corrige: el concreto no se endurece porque se seca.", false], ["B", "un proceso químico en el que el cemento reacciona con el agua.", "El párrafo 2 explica que la resistencia se debe a la hidratación, una reacción química entre el cemento y el agua.", true], ["C", "el calor del sol que recibe durante los primeros días después del fundido.", "El párrafo 4 presenta el sol fuerte como un factor que acelera la evaporación y causa problemas.", false], ["D", "la presión que ejercen las formaletas sobre la mezcla.", "Las formaletas se mencionan en el párrafo 5, pero no como causa de la resistencia.", false]]}, {"id": "LCT-147", "niv": 1, "cp": "lc_global", "e": "En el párrafo 4, la comparación con «el barro de un charco que se seca» sirve para", "f": "Texto original elaborado para este simulacro, párrafo 4", "vis": "", "o": [["A", "mostrar que el concreto y el barro tienen la misma composición química.", "La comparación se refiere a cómo se agrietan al secarse, no a su composición.", false], ["B", "advertir que el concreto no debe fundirse en lugares cercanos a charcos de agua.", "El texto no da ninguna recomendación sobre charcos cercanos; el charco es solo una imagen.", false], ["C", "explicar que el concreto pierde resistencia si se moja demasiado.", "El texto dice lo contrario: el problema es la pérdida de humedad, no el exceso de agua.", false], ["D", "ilustrar con un ejemplo cotidiano cómo se forman las fisuras por secado.", "La comparación acompaña la explicación de que la superficie que se seca más rápido que el interior se contrae y se agrieta, algo que cualquiera ha visto en el barro.", true]]}, {"id": "LCT-148", "niv": 2, "cp": "lc_global", "e": "¿Qué relación hay entre la pregunta del párrafo 1 y el contenido del párrafo 2?", "f": "Texto original elaborado para este simulacro, párrafos 1 y 2", "vis": "", "o": [["A", "El párrafo 2 muestra que mojar el concreto es una costumbre sin fundamento técnico.", "El párrafo 2 da precisamente el fundamento técnico de mojar el concreto.", false], ["B", "El párrafo 2 deja la pregunta sin responder y pasa a describir los tipos de curado que se usan en las obras.", "Los tipos de curado están en el párrafo 3; el 2 sí responde la pregunta.", false], ["C", "El párrafo 2 confirma que el concreto debe secarse rápidamente para endurecerse.", "Es lo contrario: si la mezcla pierde humedad pronto, la reacción se frena.", false], ["D", "El párrafo 2 responde la pregunta al corregir la creencia de que el concreto se endurece al secarse.", "El párrafo 1 pregunta por qué mojar el concreto; el 2, que empieza con «En realidad», explica que la resistencia proviene de una reacción que necesita agua.", true]]}, {"id": "LCT-149", "niv": 2, "cp": "lc_reflexion", "e": "De acuerdo con el texto, ¿cuál de estas situaciones aumenta más el riesgo de que una placa recién fundida se fisure?", "f": "Texto original elaborado para este simulacro, párrafos 3 y 4", "vis": "", "o": [["A", "Dejarla descubierta un día de sol fuerte y viento.", "El párrafo 4 dice que el sol fuerte y el viento aceleran la evaporación, y que el secado rápido de la superficie produce fisuras.", true], ["B", "Cubrirla con costales húmedos durante los primeros días después del fundido.", "Es una de las formas de curado del párrafo 3; reduce el riesgo de fisuras.", false], ["C", "Regarla con manguera varias veces durante las horas de más calor del día.", "Regar mantiene la humedad, que es el objetivo del curado según el párrafo 3.", false], ["D", "Sellarla con plástico para retener la humedad de la mezcla.", "Sellar con plástico es otra forma de curado mencionada en el párrafo 3.", false]]}, {"id": "LCT-150", "niv": 3, "cp": "lc_reflexion", "e": "En el párrafo 5, el autor califica de paradójico el descuido del curado porque esta etapa", "f": "Texto original elaborado para este simulacro, párrafo 5", "vis": "", "o": [["A", "exige equipos especializados que pocas obras están en capacidad de comprar.", "Contradice el párrafo 5: «No requiere equipos costosos».", false], ["B", "es barata y decisiva para la calidad, pero aun así se descuida con frecuencia.", "La paradoja está en que el curado «no requiere equipos costosos» y evita fallas costosas, y sin embargo es de las etapas que más se descuidan.", true], ["C", "es la más costosa de toda la obra y, sin embargo, también la que menos tiempo dura.", "El texto dice que el curado no requiere equipos costosos.", false], ["D", "produce efectos que se ven de inmediato, pero que nadie revisa.", "El texto afirma que sus efectos «no se ven de inmediato».", false]]}]}, {"comp": "lectura_critica", "sim": "tyt-2", "ind": "Dos opiniones sobre el celular en obras de construcción", "tt": "Texto informativo", "texto": "Dos opiniones sobre el uso del celular en obras de construcción\n\nOpinión 1. Una coordinadora de seguridad\n\n(1) En la obra, un segundo de distracción puede costar una vida. He visto a trabajadores caminar por el borde de una placa mirando la pantalla y a operadores contestar mensajes con la máquina encendida. Por eso defiendo que el celular personal se guarde en casilleros durante la jornada, salvo para quienes lo necesitan por su cargo. Las emergencias familiares se pueden atender a través de la oficina de obra, que tiene una línea fija disponible todo el día.\n\n(2) Sé que la medida es impopular. Pero las normas de seguridad casi nunca son populares al principio: tampoco lo fue el uso obligatorio del arnés.\n\nOpinión 2. Un maestro de obra\n\n(3) Nadie discute que operar una máquina mientras se chatea es peligroso. Eso ya está prohibido y debe sancionarse. Pero de ahí a quitarle el celular a todo el mundo hay mucha distancia. En mi cuadrilla el celular sirve para mandarle fotos de un problema al ingeniero, consultar un plano o avisar que falta material. Si lo guardamos en un casillero, cada consulta significa bajar cuatro pisos.\n\n(4) Además, muchos compañeros tienen hijos pequeños o padres enfermos. Decirles que llamen a una línea fija es desconocer cómo funciona la vida de hoy. Prefiero reglas claras: celular prohibido en zonas de riesgo y al operar equipos, y permitido en los descansos y para el trabajo. Eso se puede vigilar sin tratar a los trabajadores como niños.", "vis": "", "items": [{"id": "LCT-151", "niv": 1, "cp": "lc_local", "e": "Según el maestro de obra, ¿para qué usa su cuadrilla el celular durante el trabajo?", "f": "Texto original elaborado para este simulacro, párrafo 3", "vis": "", "o": [["A", "Para comunicarse con sus familias a través de la línea fija de la oficina de obra.", "La línea fija es la alternativa que propone la coordinadora, no un uso del celular de la cuadrilla.", false], ["B", "Para registrar la hora de entrada y salida de cada jornada.", "El maestro no menciona ese uso.", false], ["C", "Para resolver dudas con el ingeniero, revisar planos y pedir material.", "El párrafo 3 menciona mandarle fotos de un problema al ingeniero, consultar un plano y avisar que falta material; la opción lo parafrasea.", true], ["D", "Para manejar a distancia las máquinas y los equipos de la obra.", "El texto no menciona ese uso; al contrario, ambos rechazan usar el celular al operar equipos.", false]]}, {"id": "LCT-152", "niv": 2, "cp": "lc_global", "e": "¿En qué punto coinciden los dos autores?", "f": "Texto original elaborado para este simulacro, párrafos 1 y 3", "vis": "", "o": [["A", "El celular es una herramienta de trabajo necesaria para consultar los planos.", "Solo el maestro lo afirma; la coordinadora lo permite únicamente a quienes lo necesitan por su cargo.", false], ["B", "El celular personal debe guardarse en casilleros durante toda la jornada de trabajo.", "Es la propuesta de la coordinadora; el maestro la rechaza.", false], ["C", "Las emergencias familiares deben atenderse mediante la línea fija de la oficina de obra.", "Es la posición de la coordinadora; el maestro dice que eso «es desconocer cómo funciona la vida de hoy».", false], ["D", "Usar el celular mientras se opera una máquina es peligroso.", "La coordinadora critica a los operadores que contestan mensajes con la máquina encendida (párrafo 1) y el maestro dice: «Nadie discute que operar una máquina mientras se chatea es peligroso» (párrafo 3).", true]]}, {"id": "LCT-153", "niv": 2, "cp": "lc_global", "e": "¿Cuál es la diferencia principal entre las dos posiciones?", "f": "Texto original elaborado para este simulacro, párrafos 1, 3 y 4", "vis": "", "o": [["A", "La primera permite el celular en los descansos; la segunda lo restringe en casi toda la obra.", "Invierte las posiciones: es el maestro quien lo permite en los descansos.", false], ["B", "La primera lo restringe a todos, con excepciones; la segunda, solo en zonas de riesgo y al operar equipos.", "La coordinadora propone guardarlo en casilleros «salvo para quienes lo necesitan por su cargo»; el maestro, prohibirlo en zonas de riesgo y al operar equipos, y permitirlo en descansos y para trabajar.", true], ["C", "La primera se apoya en estadísticas de accidentes; la segunda, en las normas legales vigentes.", "Ninguna opinión cita estadísticas ni normas legales; ambas se apoyan en experiencias.", false], ["D", "La primera defiende a los trabajadores; la segunda, los intereses económicos de la empresa constructora.", "El maestro defiende las necesidades de los trabajadores; ninguno habla de intereses económicos de la empresa.", false]]}, {"id": "LCT-154", "niv": 3, "cp": "lc_reflexion", "e": "En el párrafo 2, la coordinadora menciona que el uso obligatorio del arnés tampoco fue popular al principio. Con esta comparación busca", "f": "Texto original elaborado para este simulacro, párrafo 2", "vis": "", "o": [["A", "proponer que el uso del arnés deje de ser obligatorio en las obras.", "Al contrario, usa el arnés como ejemplo de una norma valiosa.", false], ["B", "demostrar con datos que el celular causa tantos accidentes en las obras como las caídas de altura.", "La coordinadora no presenta datos ni compara cifras de accidentes.", false], ["C", "sugerir que la impopularidad inicial de una norma no prueba que sea equivocada.", "Anticipa la objeción de que su medida es impopular y recuerda una norma de seguridad que hoy se acepta y que también lo fue: la falta de popularidad no la invalida.", true], ["D", "reconocer que su propuesta no tiene relación con la seguridad de los trabajadores.", "Toda su opinión se basa en la seguridad («un segundo de distracción puede costar una vida»).", false]]}]}, {"comp": "lectura_critica", "sim": "tyt-2", "ind": "Cómic en un local de reparación de celulares", "tt": "Caricatura o cómic", "texto": "Cómic: «Se apagó solo»\n\nViñeta 1: Un local de reparación de celulares. Un cliente pone un celular sobre el mostrador y dice: «No prende. Yo no le hice nada, se apagó solo». Del bolsillo de su pantalón gotea agua y se forma un pequeño charco en el piso.\n\nViñeta 2: La técnica abre el celular con un destornillador. Del interior salen un chorro de agua y un pez pequeño. El cliente mira hacia el techo y silba.\n\nViñeta 3: La técnica, con el pez en la mano, pregunta: «¿Seguro que no se le mojó?». El cliente responde: «Bueno… tal vez le cayó un poquito de lluvia».\n\nViñeta 4: La técnica escribe en la orden de servicio: «Diagnóstico: lluvia con peces». En la pared, detrás de ella, hay un cartel que dice: «La garantía no cubre daños por humedad».", "vis": "", "items": [{"id": "LCT-155", "niv": 1, "cp": "lc_local", "e": "¿Qué encuentra la técnica al abrir el celular en la viñeta 2?", "f": "Texto original elaborado para este simulacro, viñeta 2", "vis": "", "o": [["A", "Agua en abundancia y, entre ella, un pequeño pez.", "La viñeta 2 dice: «Del interior salen un chorro de agua y un pez pequeño».", true], ["B", "Una pieza quemada por un cortocircuito.", "El cómic no menciona piezas quemadas.", false], ["C", "Arena y restos de hojas mojadas por la lluvia.", "No se habla de arena ni de hojas; la lluvia es la excusa del cliente en la viñeta 3.", false], ["D", "Un destornillador olvidado por otro técnico.", "El destornillador es la herramienta con la que la técnica abre el celular, no algo que encuentra adentro.", false]]}, {"id": "LCT-156", "niv": 1, "cp": "lc_global", "e": "¿Qué detalle de la viñeta 1 contradice desde el principio lo que dice el cliente?", "f": "Texto original elaborado para este simulacro, viñeta 1", "vis": "", "o": [["A", "El celular que pone sobre el mostrador.", "Dejar el celular en el mostrador es normal en un local de reparación; no contradice lo que dice.", false], ["B", "El cartel sobre la garantía que cuelga en la pared del local.", "El cartel aparece en la viñeta 4, no en la 1.", false], ["C", "El destornillador con el que la técnica abre el celular para revisarlo.", "El destornillador aparece en la viñeta 2, no en la 1, y no contradice al cliente.", false], ["D", "El agua que gotea de su bolsillo y forma un charco en el piso.", "El cliente asegura que no le hizo nada al celular, pero el agua que gotea de su bolsillo indica que el aparato se mojó.", true]]}, {"id": "LCT-157", "niv": 2, "cp": "lc_global", "e": "La anotación «Diagnóstico: lluvia con peces» de la viñeta 4 resulta humorística porque", "f": "Texto original elaborado para este simulacro, viñetas 3 y 4", "vis": "", "o": [["A", "convierte en diagnóstico la excusa del cliente, que es absurda frente a lo que se encontró.", "El cliente atribuye el daño a «un poquito de lluvia»; la técnica escribe esa excusa añadiendo los peces, lo que deja en evidencia que la explicación es inverosímil.", true], ["B", "indica que el celular podrá repararse sin costo, porque la garantía cubre los daños causados por la lluvia.", "El cartel dice que la garantía no cubre daños por humedad; nada indica una reparación gratuita.", false], ["C", "demuestra que la técnica está convencida de que el daño lo causó la lluvia.", "La pregunta «¿Seguro que no se le mojó?» muestra que la técnica no le cree al cliente; la anotación es irónica.", false], ["D", "revela que la técnica no sabe redactar diagnósticos técnicos.", "La anotación es una ironía intencional, no un error de redacción.", false]]}, {"id": "LCT-158", "niv": 3, "cp": "lc_reflexion", "e": "¿Qué función cumple el cartel que aparece en la viñeta 4?", "f": "Texto original elaborado para este simulacro, viñetas 1, 3 y 4", "vis": "", "o": [["A", "Informa que en ese local solo se reparan celulares que estén en garantía.", "El cartel indica qué no cubre la garantía; no dice qué equipos se reciben para reparar.", false], ["B", "Sugiere por qué el cliente insistía en negar que el celular se hubiera mojado.", "Si la garantía no cubre daños por humedad, el cliente tenía un motivo para negar el agua: así podría reclamarla. El cartel da sentido a su insistencia.", true], ["C", "Explica por qué la técnica encontró un pez dentro del celular del cliente.", "El cartel no explica la presencia del pez; trata de lo que cubre la garantía.", false], ["D", "Muestra que el cliente leyó las condiciones de la garantía antes de entrar al local.", "El cómic no indica que el cliente haya leído el cartel; esa afirmación no tiene apoyo.", false]]}, {"id": "LCT-159", "niv": 2, "cp": "lc_reflexion", "e": "¿Cuál de las siguientes situaciones se parece más a la que presenta el cómic?", "f": "Texto original elaborado para este simulacro, viñetas 1 a 4", "vis": "", "o": [["A", "Un técnico cobra más de lo acordado por una reparación sencilla y no le explica al cliente el motivo.", "En el cómic no hay un cobro abusivo; quien falta a la verdad es el cliente.", false], ["B", "Una tienda se niega a cambiar un producto con un defecto de fábrica que el técnico ya comprobó en su revisión.", "En el cómic no hay defecto de fábrica: la evidencia muestra que el aparato se mojó.", false], ["C", "Alguien pide la garantía de un portátil que, según él, falló sin causa, y el técnico halla café en el teclado.", "Igual que en el cómic, el cliente niega haber causado el daño y la evidencia encontrada al revisar el equipo lo contradice.", true], ["D", "Un cliente pide que le expliquen las condiciones de la garantía antes de comprar un celular.", "Es una conducta honesta y previa a la compra; no se parece al engaño del cómic.", false]]}]}, {"comp": "lectura_critica", "sim": "tyt-2", "ind": "Aviso de suspensión del servicio de acueducto", "tt": "Texto discontinuo", "texto": "Aviso publicado por una empresa de acueducto (ficticia) en las carteleras de los barrios.", "vis": "<table class=\"vt\"><caption>AVISO A LA COMUNIDAD · Suspensión programada del servicio de agua<\/caption><thead><tr><th>Aspecto<\/th><th>Detalle<\/th><\/tr><\/thead><tbody><tr><td>Motivo<\/td><td>Cambio de válvulas en la red principal.<\/td><\/tr><tr><td>Fecha y hora<\/td><td>Martes 9 de marzo, de 8:00 a. m. a 6:00 p. m.<\/td><\/tr><tr><td>Sectores afectados<\/td><td>Barrios La Esperanza, El Prado y San José (sector norte). El barrio San José (sector sur) NO se verá afectado.<\/td><\/tr><tr><td>Recomendaciones<\/td><td>Almacene agua en recipientes limpios y tapados. Cierre el registro de su vivienda durante la suspensión. Cuando se restablezca el servicio, deje correr el agua durante 2 minutos antes de consumirla, pues puede salir turbia.<\/td><\/tr><tr><td>Carrotanque<\/td><td>Habrá un carrotanque en el parque de El Prado de 10:00 a. m. a 4:00 p. m.<\/td><\/tr><tr><td>Información<\/td><td>Línea de atención de la empresa, las 24 horas.<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Aviso ficticio elaborado para este simulacro.<\/div>", "items": [{"id": "LCT-160", "niv": 1, "cp": "lc_local", "e": "Según el aviso, ¿en qué horario estará disponible el carrotanque?", "f": "Texto original elaborado para este simulacro, aviso, fila Carrotanque", "vis": "", "o": [["A", "De 10:00 a. m. a 6:00 p. m.", "Mezcla la hora de inicio del carrotanque con la hora de fin de la suspensión.", false], ["B", "De 8:00 a. m. a 6:00 p. m.", "Es el horario de la suspensión del servicio, no el del carrotanque.", false], ["C", "De 8:00 a. m. a 4:00 p. m.", "Mezcla la hora de inicio de la suspensión con la hora de cierre del carrotanque.", false], ["D", "De 10:00 a. m. a 4:00 p. m.", "La fila «Carrotanque» indica ese horario en el parque de El Prado.", true]]}, {"id": "LCT-161", "niv": 2, "cp": "lc_local", "e": "Una persona que vive en el barrio San José, sector sur, pregunta si se quedará sin agua el martes. Según el aviso,", "f": "Texto original elaborado para este simulacro, aviso, fila Sectores afectados", "vis": "", "o": [["A", "no, porque el carrotanque estará disponible en su barrio durante el corte.", "El carrotanque estará en El Prado y solo de 10:00 a. m. a 4:00 p. m.; la razón es otra: su sector no está afectado.", false], ["B", "no, porque el aviso indica que su sector no se verá afectado.", "La fila «Sectores afectados» dice: «El barrio San José (sector sur) NO se verá afectado».", true], ["C", "sí, pero únicamente entre las 10:00 a. m. y las 4:00 p. m.", "Ese es el horario del carrotanque, y además el sector sur no tendrá suspensión.", false], ["D", "sí, porque el barrio San José aparece en la lista de sectores afectados por la suspensión.", "Solo el sector norte de San José está afectado; la lectura parcial omite la aclaración sobre el sector sur.", false]]}, {"id": "LCT-162", "niv": 2, "cp": "lc_global", "e": "Doña Luz vive en El Prado y ese martes trabajará fuera de casa de 7:00 a. m. a 7:00 p. m. Según el aviso, ¿qué le conviene hacer?", "f": "Texto original elaborado para este simulacro, aviso, filas Recomendaciones y Carrotanque", "vis": "", "o": [["A", "Recoger agua del carrotanque cuando regrese de su trabajo por la noche.", "A las 7:00 p. m. el carrotanque ya no estará: funciona hasta las 4:00 p. m.", false], ["B", "Consumir el agua de la llave apenas llegue, sin dejarla correr.", "El aviso pide dejar correr el agua 2 minutos antes de consumirla, porque puede salir turbia.", false], ["C", "Almacenar agua antes de salir, porque estará fuera de casa mientras funcione el carrotanque.", "El carrotanque solo funciona de 10:00 a. m. a 4:00 p. m., cuando doña Luz estará trabajando; por eso le sirve la recomendación de almacenar agua en recipientes limpios y tapados.", true], ["D", "Dejar abierto el registro de su casa para que el agua llegue apenas se restablezca el servicio.", "El aviso recomienda lo contrario: cerrar el registro durante la suspensión.", false]]}, {"id": "LCT-163", "niv": 2, "cp": "lc_reflexion", "e": "¿Cuál es el propósito más probable de que el aviso destaque, con la palabra «NO» en mayúsculas, que el sector sur del barrio San José no se verá afectado?", "f": "Texto original elaborado para este simulacro, aviso, fila Sectores afectados", "vis": "", "o": [["A", "Evitar confusiones, porque otra parte del mismo barrio sí tendrá la suspensión.", "El sector norte de San José está en la lista de afectados; resaltar la excepción evita que los vecinos del sector sur crean que también se quedarán sin agua.", true], ["B", "Anunciar que el sector sur tendrá un carrotanque propio durante la suspensión.", "El aviso solo menciona un carrotanque, en El Prado.", false], ["C", "Indicar que la suspensión del sector sur se hará en otra fecha que se anunciará más adelante.", "El aviso no menciona otra fecha para el sector sur.", false], ["D", "Informar que el sector sur no cuenta con red de acueducto.", "Nada en el aviso permite concluir que el sector sur carezca de red.", false]]}]}, {"comp": "lectura_critica", "sim": "tyt-2", "ind": "Tabla de accidentes de trabajo en una planta de alimentos", "tt": "Texto discontinuo", "texto": "Informe anual del comité de seguridad y salud en el trabajo de una planta de alimentos (ficticia). La tabla resume los accidentes de trabajo registrados durante el año en cada área.", "vis": "<table class=\"vt\"><caption>Tabla 1. Accidentes de trabajo por área, año 2025<\/caption><thead><tr><th>Área<\/th><th>Trabajadores<\/th><th>Accidentes<\/th><th>Días de incapacidad<\/th><th>Causa más frecuente<\/th><\/tr><\/thead><tbody><tr><td>Empaque<\/td><td>40<\/td><td>6<\/td><td>18<\/td><td>Cortes con herramientas<\/td><\/tr><tr><td>Cocción<\/td><td>15<\/td><td>5<\/td><td>30<\/td><td>Quemaduras<\/td><\/tr><tr><td>Bodega<\/td><td>20<\/td><td>4<\/td><td>36<\/td><td>Golpes por caída de cajas<\/td><\/tr><tr><td>Mantenimiento<\/td><td>5<\/td><td>3<\/td><td>12<\/td><td>Contacto con partes móviles de máquinas<\/td><\/tr><tr><td>Total<\/td><td>80<\/td><td>18<\/td><td>96<\/td><td><\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Datos ficticios.<\/div>", "items": [{"id": "LCT-164", "niv": 1, "cp": "lc_local", "e": "Según la tabla, ¿cuál fue la causa más frecuente de accidentes en la bodega?", "f": "Texto original elaborado para este simulacro, tabla 1", "vis": "", "o": [["A", "Golpes por caída de cajas.", "Es la causa registrada para Bodega en la última columna.", true], ["B", "Cortes con herramientas.", "Es la causa más frecuente en Empaque.", false], ["C", "Quemaduras.", "Es la causa más frecuente en Cocción.", false], ["D", "Contacto con partes móviles de máquinas.", "Es la causa más frecuente en Mantenimiento.", false]]}, {"id": "LCT-165", "niv": 1, "cp": "lc_global", "e": "¿Qué área tuvo la mayor cantidad de días de incapacidad, aunque no fue la que tuvo más accidentes?", "f": "Texto original elaborado para este simulacro, tabla 1", "vis": "", "o": [["A", "Mantenimiento.", "Mantenimiento tuvo 12 días, el valor más bajo.", false], ["B", "Bodega.", "Bodega tuvo 36 días de incapacidad, el valor más alto, con 4 accidentes, menos que Empaque (6).", true], ["C", "Empaque.", "Empaque tuvo más accidentes (6), pero solo 18 días de incapacidad.", false], ["D", "Cocción.", "Cocción tuvo 30 días, menos que Bodega (36).", false]]}, {"id": "LCT-166", "niv": 3, "cp": "lc_reflexion", "e": "El jefe de producción afirma: «Empaque es el área más riesgosa de la planta, porque fue la que tuvo más accidentes». Si se tiene en cuenta el número de trabajadores de cada área, esta conclusión", "f": "Texto original elaborado para este simulacro, tabla 1; cálculo propio (6/40 = 15 %, 3/5 = 60 %)", "vis": "", "o": [["A", "es correcta, porque el número de accidentes basta para comparar el riesgo entre áreas.", "Comparar cifras absolutas ignora que Empaque tiene muchos más trabajadores; en proporción, es el área con menos accidentes.", false], ["B", "es correcta, porque Empaque también tuvo la mayor cantidad de días de incapacidad de toda la planta.", "Falso: Empaque tuvo 18 días; Bodega (36) y Cocción (30) tuvieron más.", false], ["C", "es apresurada, porque en proporción a su personal Mantenimiento tuvo más accidentes.", "Empaque tuvo 6 accidentes entre 40 trabajadores (15 %), mientras que Mantenimiento tuvo 3 entre 5 (60 %); también Cocción (5 de 15) y Bodega (4 de 20) superan a Empaque en proporción.", true], ["D", "es apresurada, porque Bodega tuvo más accidentes que Empaque.", "Falso: Bodega tuvo 4 accidentes y Empaque 6.", false]]}, {"id": "LCT-167", "niv": 2, "cp": "lc_global", "e": "¿Cuál de las siguientes afirmaciones se deriva correctamente de la tabla?", "f": "Texto original elaborado para este simulacro, tabla 1", "vis": "", "o": [["A", "En Mantenimiento hubo más accidentes que en Bodega durante el año.", "Mantenimiento tuvo 3 accidentes y Bodega 4.", false], ["B", "Empaque tuvo más días de incapacidad que Cocción.", "Empaque tuvo 18 días de incapacidad y Cocción, 30.", false], ["C", "Entre Bodega y Mantenimiento sumaron la mitad de los accidentes de la planta.", "Bodega y Mantenimiento suman 4 + 3 = 7 accidentes; la mitad de 18 es 9.", false], ["D", "En Cocción hubo menos accidentes que en Empaque, pero más días de incapacidad.", "Cocción: 5 accidentes y 30 días; Empaque: 6 accidentes y 18 días.", true]]}]}, {"comp": "lectura_critica", "sim": "tyt-2", "ind": "Condiciones de garantía de una lavadora", "tt": "Texto discontinuo", "texto": "Condiciones de garantía incluidas en el manual de una lavadora de uso doméstico (marca ficticia).", "vis": "<table class=\"vt\"><caption>Certificado de garantía<\/caption><thead><tr><th>Aspecto<\/th><th>Condición<\/th><\/tr><\/thead><tbody><tr><td>Cobertura<\/td><td>12 meses desde la fecha de compra para todas las piezas. El motor tiene una garantía de 5 años desde la fecha de compra.<\/td><\/tr><tr><td>Requisitos<\/td><td>Presentar la factura de compra. La instalación debe haber sido realizada por un técnico autorizado por la marca.<\/td><\/tr><tr><td>La garantía no cubre<\/td><td>Daños por golpes o por transporte después de la entrega; daños causados por variaciones de voltaje; uso comercial (por ejemplo, en lavanderías); piezas de desgaste normal, como mangueras y filtros.<\/td><\/tr><tr><td>Pérdida de la garantía<\/td><td>Si el equipo fue abierto o reparado por personal no autorizado.<\/td><\/tr><tr><td>Cómo solicitarla<\/td><td>Comuníquese con la línea de servicio. Un técnico lo visitará en un plazo máximo de 5 días hábiles.<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Documento ficticio elaborado para este simulacro.<\/div>", "items": [{"id": "LCT-168", "niv": 1, "cp": "lc_local", "e": "Según el certificado, ¿durante cuánto tiempo está cubierto el motor de la lavadora?", "f": "Texto original elaborado para este simulacro, certificado, fila Cobertura", "vis": "", "o": [["A", "12 meses desde la fecha de instalación.", "La cobertura se cuenta desde la fecha de compra, y la del motor es de 5 años.", false], ["B", "12 meses desde la fecha de compra, igual que las demás piezas.", "Los 12 meses corresponden a las piezas en general; el motor tiene una cobertura mayor.", false], ["C", "5 años desde la fecha de compra.", "La fila «Cobertura» indica: «El motor tiene una garantía de 5 años desde la fecha de compra».", true], ["D", "5 días hábiles desde que se solicita la garantía.", "Los 5 días hábiles son el plazo máximo para la visita del técnico.", false]]}, {"id": "LCT-169", "niv": 3, "cp": "lc_global", "e": "Dos años después de comprada, el motor de una lavadora se daña por una falla de fábrica. El equipo lo instaló un técnico autorizado, se usa en una casa y nunca ha sido abierto. Según el certificado,", "f": "Texto original elaborado para este simulacro, certificado, filas Cobertura y Requisitos", "vis": "", "o": [["A", "el daño no está cubierto, porque el motor es una pieza de desgaste normal.", "El certificado da como ejemplos de desgaste normal las mangueras y los filtros, y al motor le asigna una garantía especial.", false], ["B", "el daño está cubierto si el dueño presenta la factura de compra.", "El motor tiene 5 años de garantía; se cumplen el uso doméstico, la instalación autorizada y la ausencia de manipulación, y solo falta el requisito de presentar la factura.", true], ["C", "el daño no está cubierto, porque ya pasaron más de los 12 meses de garantía del equipo.", "Los 12 meses aplican a las piezas en general; el motor tiene 5 años.", false], ["D", "el daño está cubierto aunque el dueño no tenga la factura de compra.", "Presentar la factura es un requisito explícito de la garantía.", false]]}, {"id": "LCT-170", "niv": 3, "cp": "lc_reflexion", "e": "El dueño de una lavandería de barrio compró esta lavadora para su negocio y, a los tres meses, se dañó una pieza. Él sostiene que la garantía «debe cubrirlo, porque no han pasado 12 meses». Su argumento es", "f": "Texto original elaborado para este simulacro, certificado, filas Cobertura y La garantía no cubre", "vis": "", "o": [["A", "incorrecto, porque el certificado excluye el uso comercial, aunque no haya pasado un año.", "La fila «La garantía no cubre» menciona el uso comercial, con el ejemplo de las lavanderías; estar dentro de los 12 meses no basta.", true], ["B", "correcto, si la lavadora la instaló un técnico autorizado por la marca.", "Aunque la instalación fuera autorizada, el uso comercial está excluido de la garantía.", false], ["C", "correcto, porque las fallas de los primeros 12 meses quedan cubiertas por la garantía.", "Ignora las exclusiones: la cobertura de 12 meses no aplica al uso comercial.", false], ["D", "incorrecto, porque los 12 meses se cuentan desde la instalación y no desde la compra.", "Falso: la cobertura se cuenta desde la fecha de compra; el verdadero obstáculo es el uso comercial.", false]]}]}, {"comp": "razonamiento_cuantitativo", "sim": "tyt-2", "ind": "Plan de ahorro mensual", "tt": "", "texto": "Marta, auxiliar contable, abrió una cuenta de ahorro con $ 400.000 y deposita $ 150.000 al final de cada mes. La cuenta no paga intereses y Marta no hace retiros. La tabla 1 muestra el saldo de los primeros meses.", "vis": "<table class=\"vt\"><caption>Tabla 1. Saldo de la cuenta al final de cada mes<\/caption><thead><tr><th>Mes<\/th><th>0<\/th><th>1<\/th><th>2<\/th><th>3<\/th><th>4<\/th><th>5<\/th><th>6<\/th><\/tr><\/thead><tbody><tr><td>Saldo ($)<\/td><td>400.000<\/td><td>550.000<\/td><td>700.000<\/td><td>850.000<\/td><td>1.000.000<\/td><td>1.150.000<\/td><td>1.300.000<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Datos ficticios.<\/div>", "items": [{"id": "RCT-201", "niv": 1, "cp": "rc_interpretacion", "e": "Según la tabla, ¿al final de qué mes el saldo llega a $ 1.000.000?", "f": "Cálculo propio a partir de los datos del caso (datos ficticios).", "vis": "", "o": [["A", "Mes 3.", "Al final del mes 3 el saldo es $ 850.000; aún no llega a $ 1.000.000.", false], ["B", "Mes 4.", "La tabla muestra un saldo de $ 1.000.000 al final del mes 4 (400.000 + 4 × 150.000).", true], ["C", "Mes 5.", "Al final del mes 5 el saldo ya es $ 1.150.000; el millón se alcanzó un mes antes.", false], ["D", "Mes 6.", "Al final del mes 6 el saldo es $ 1.300.000.", false]]}, {"id": "RCT-202", "niv": 2, "cp": "rc_interpretacion", "e": "Si m es el número de meses transcurridos, ¿qué expresión representa el saldo S, en pesos, de la cuenta de Marta?", "f": "Cálculo propio a partir de los datos del caso (datos ficticios).", "vis": "", "o": [["A", "S = 150.000m.", "Omite el saldo inicial de $ 400.000; con m = 0 daría $ 0.", false], ["B", "S = 550.000m.", "Multiplica por m el saldo del primer mes; con m = 2 daría 1.100.000 y no 700.000.", false], ["C", "S = 150.000 + 400.000m.", "Intercambia los valores: lo que aumenta cada mes es 150.000 y lo fijo es 400.000.", false], ["D", "S = 400.000 + 150.000m.", "Parte de 400.000 y suma 150.000 por mes; reproduce la tabla (m = 2 → 700.000).", true]]}, {"id": "RCT-203", "niv": 2, "cp": "rc_formulacion", "e": "Marta quiere reunir $ 2.500.000 para la cuota inicial de una moto. Si sigue con el mismo plan, ¿al final de qué mes tendrá por primera vez un saldo de al menos $ 2.500.000?", "f": "Cálculo propio a partir de los datos del caso (datos ficticios).", "vis": "", "o": [["A", "Mes 13.", "Al final del mes 13 el saldo es 400.000 + 13 × 150.000 = 2.350.000; todavía falta dinero.", false], ["B", "Mes 14.", "Le faltan 2.500.000 − 400.000 = 2.100.000; 2.100.000 ÷ 150.000 = 14 meses.", true], ["C", "Mes 17.", "Ignora el saldo inicial: 2.500.000 ÷ 150.000 ≈ 16,7, y redondea a 17.", false], ["D", "Mes 20.", "Suma el saldo inicial a la meta en lugar de restarlo: 2.900.000 ÷ 150.000 ≈ 19,3.", false]]}, {"id": "RCT-204", "niv": 2, "cp": "rc_argumentacion", "e": "Marta afirma: «Si quisiera reunir $ 1.600.000 y depositara $ 300.000 cada mes en lugar de $ 150.000, lo lograría en la mitad del tiempo». ¿Es correcta su afirmación?", "f": "Cálculo propio a partir de los datos del caso (datos ficticios).", "vis": "", "o": [["A", "Sí, porque con $ 300.000 al mes, en 4 meses tendría 400.000 + 4 × 300.000 = $ 2.000.000.", "Error de cálculo: 400.000 + 4 × 300.000 = 1.600.000; además, la razón no compara con los 8 meses que tardaría depositando $ 150.000.", false], ["B", "No, porque 1.600.000 ÷ 300.000 ≈ 5,3 meses, que no es la mitad de 1.600.000 ÷ 150.000 ≈ 10,7.", "Olvida que ya tiene $ 400.000 ahorrados; solo debe completar $ 1.200.000.", false], ["C", "No, porque el saldo inicial de $ 400.000 no se duplica, así que el tiempo no se reduce a la mitad.", "El saldo inicial se resta de la meta antes de dividir; como el aporte se duplica, el tiempo queda exactamente a la mitad.", false], ["D", "Sí, porque le faltan $ 1.200.000: con $ 150.000 tarda 8 meses y con $ 300.000, 4 meses.", "El saldo inicial se descuenta de la meta (1.600.000 − 400.000 = 1.200.000); 1.200.000 ÷ 150.000 = 8 y 1.200.000 ÷ 300.000 = 4.", true]]}]}, {"comp": "razonamiento_cuantitativo", "sim": "tyt-2", "ind": "Cerramiento de un lote", "tt": "", "texto": "Una empresa va a cercar un lote rectangular de 24 m de largo por 16 m de ancho. Pondrá un poste en cada esquina y, además, postes a lo largo de todo el borde, de modo que entre dos postes vecinos haya siempre 2 m.", "vis": "", "items": [{"id": "RCT-205", "niv": 1, "cp": "rc_formulacion", "e": "¿Cuál es el perímetro del lote?", "f": "Cálculo propio a partir de los datos del caso (datos ficticios).", "vis": "", "o": [["A", "40 m.", "Es la suma de un largo y un ancho (24 + 16), es decir, la mitad del perímetro.", false], ["B", "80 m.", "Perímetro = 2 × 24 + 2 × 16 = 80 m.", true], ["C", "160 m.", "Duplica el perímetro: cuenta cada lado dos veces más de lo debido.", false], ["D", "384 m.", "Es el área del lote (24 × 16 = 384 m²), no su perímetro.", false]]}, {"id": "RCT-206", "niv": 2, "cp": "rc_formulacion", "e": "El borde del lote es cerrado: no hay puerta ni tramos sin postes. ¿Cuántos postes se necesitan en total?", "f": "Cálculo propio a partir de los datos del caso (datos ficticios).", "vis": "", "o": [["A", "20", "Divide la mitad del perímetro (40 m) entre 2 m; faltan los postes de los otros dos lados.", false], ["B", "40", "En un borde cerrado de 80 m con postes cada 2 m hay 80 ÷ 2 = 40 postes; las esquinas ya están incluidas porque 24 y 16 son múltiplos de 2.", true], ["C", "41", "Suma 1 como en una cerca abierta; en un contorno cerrado el último poste coincide con el primero.", false], ["D", "44", "Suma 4 postes de esquina a los 40, pero las esquinas ya están contadas.", false]]}, {"id": "RCT-207", "niv": 3, "cp": "rc_argumentacion", "e": "Un trabajador comenta: «Si el lote midiera 26 m de largo por 14 m de ancho, necesitaría la misma cantidad de cerca y tendría la misma área que el lote actual». ¿Es correcto su comentario?", "f": "Cálculo propio a partir de los datos del caso (datos ficticios).", "vis": "", "o": [["A", "Sí: 26 + 14 = 24 + 16, y cuando la cerca es la misma, el área también es la misma.", "La cerca sí es la misma, pero un mismo perímetro no garantiza la misma área: 364 m² ≠ 384 m².", false], ["B", "No: necesitaría más cerca, porque su largo de 26 m es mayor que el largo actual de 24 m.", "El ancho disminuye en la misma medida (de 16 a 14 m), así que el perímetro no cambia.", false], ["C", "No: necesitaría la misma cerca, pero su área sería 26 × 14 = 364 m², menor que 384 m².", "Perímetros iguales (2 × 26 + 2 × 14 = 2 × 24 + 2 × 16), pero áreas distintas: 364 m² frente a 24 × 16 = 384 m².", true], ["D", "No: tendría la misma área, 384 m², pero necesitaría 4 m más de cerca.", "Ambas partes son falsas: el área es 26 × 14 = 364 m² y la cerca es la misma.", false]]}]}, {"comp": "razonamiento_cuantitativo", "sim": "tyt-2", "ind": "Ventas diarias de una tienda de celulares", "tt": "", "texto": "Una tienda de celulares registró durante 20 días cuántos equipos vendió cada día. La tabla 1 muestra en cuántos días se vendió cada cantidad.", "vis": "<table class=\"vt\"><caption>Tabla 1. Celulares vendidos por día<\/caption><thead><tr><th>Celulares vendidos en el día<\/th><th>0<\/th><th>1<\/th><th>2<\/th><th>3<\/th><th>4<\/th><\/tr><\/thead><tbody><tr><td>Número de días<\/td><td>2<\/td><td>5<\/td><td>6<\/td><td>4<\/td><td>3<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Datos ficticios.<\/div>", "items": [{"id": "RCT-208", "niv": 1, "cp": "rc_interpretacion", "e": "¿En cuántos de los 20 días se vendieron al menos 3 celulares?", "f": "Cálculo propio a partir de los datos del caso (datos ficticios).", "vis": "", "o": [["A", "3", "Es el número de días en que se vendieron 4 celulares; faltan los días en que se vendieron 3.", false], ["B", "4", "Es el número de días en que se vendieron exactamente 3 celulares; faltan los días con 4.", false], ["C", "7", "«Al menos 3» incluye 3 y 4 celulares: 4 + 3 = 7 días.", true], ["D", "13", "Es el número de días en que se vendieron 2 celulares o menos (2 + 5 + 6).", false]]}, {"id": "RCT-209", "niv": 3, "cp": "rc_formulacion", "e": "¿Cuál fue el promedio de celulares vendidos por día en esos 20 días?", "f": "Cálculo propio a partir de los datos del caso (datos ficticios).", "vis": "", "o": [["A", "2", "Es la mediana (y también la moda) de los datos, no el promedio.", false], ["B", "2,05", "Total vendido: 0 × 2 + 1 × 5 + 2 × 6 + 3 × 4 + 4 × 3 = 41 celulares; 41 ÷ 20 = 2,05.", true], ["C", "4", "Promedia las frecuencias (20 días ÷ 5 valores) en lugar de los celulares vendidos.", false], ["D", "8,2", "Divide los 41 celulares entre los 5 valores posibles en lugar de entre los 20 días.", false]]}, {"id": "RCT-210", "niv": 2, "cp": "rc_argumentacion", "e": "El dueño de la tienda afirma: «Como el promedio fue de unos 2 celulares por día, en más de la mitad de los días se vendieron 2 celulares». ¿Es válida su afirmación?", "f": "Cálculo propio a partir de los datos del caso (datos ficticios).", "vis": "", "o": [["A", "No, porque solo en 6 de los 20 días se vendieron 2 celulares, y 6 es menos de la mitad.", "La tabla muestra 6 días con 2 ventas: menos de la mitad de los 20 días.", true], ["B", "Sí, porque el promedio redondeado es 2, y el promedio es el valor de la mayoría de los días.", "El promedio no indica qué valor ocurre en la mayoría de los días; el conteo directo muestra 6 de 20.", false], ["C", "Sí, porque 2 es el valor que más se repite, y el valor que más se repite es el de más de la mitad de los días.", "Confunde moda con mayoría: el valor más repetido (2, en 6 días) no tiene por qué darse en más de la mitad de los días, y aquí no se da.", false], ["D", "No, porque el promedio exacto es 2,05 celulares por día, no 2, y con ese promedio no se puede hablar de 2 celulares.", "El promedio exacto (41 ÷ 20 = 2,05) no es la razón: aunque fuera exactamente 2, el promedio no dice en cuántos días se vendieron 2 celulares; el conteo muestra 6 de 20.", false]]}, {"id": "RCT-211", "niv": 2, "cp": "rc_interpretacion", "e": "¿En qué porcentaje de los días se vendió como máximo 1 celular?", "f": "Cálculo propio a partir de los datos del caso (datos ficticios).", "vis": "", "o": [["A", "10 %", "Corresponde solo a los días sin ventas (2 de 20).", false], ["B", "25 %", "Corresponde solo a los días con exactamente 1 venta (5 de 20).", false], ["C", "35 %", "«Como máximo 1» incluye 0 y 1: 2 + 5 = 7 días; 7 ÷ 20 = 0,35 = 35 %.", true], ["D", "65 %", "Es el porcentaje de días con 2 o más ventas, el complemento del pedido.", false]]}]}, {"comp": "razonamiento_cuantitativo", "sim": "tyt-2", "ind": "Cajas sobre una estiba en una bodega", "tt": "", "texto": "En una bodega se despachan cajas de 40 cm de largo, 30 cm de ancho y 25 cm de alto. Las cajas se acomodan sobre una estiba (base de madera) de 120 cm por 80 cm.", "vis": "", "items": [{"id": "RCT-212", "niv": 1, "cp": "rc_formulacion", "e": "¿Cuál es el volumen de una caja?", "f": "Cálculo propio a partir de los datos del caso (datos ficticios).", "vis": "", "o": [["A", "95 cm³.", "Suma las tres medidas (40 + 30 + 25); el volumen es el producto.", false], ["B", "1.200 cm³.", "Es el área de la base (40 × 30); falta multiplicar por la altura.", false], ["C", "30.000 cm³.", "V = 40 × 30 × 25 = 30.000 cm³.", true], ["D", "300.000 cm³.", "Multiplica por 10 de más: 40 × 30 × 25 = 30.000.", false]]}, {"id": "RCT-213", "niv": 3, "cp": "rc_formulacion", "e": "Las cajas se colocan siempre apoyadas sobre su cara de 40 cm × 30 cm, con el lado de 40 cm paralelo al lado de 80 cm de la estiba, y la altura de las cajas apiladas, sin contar la estiba, no puede superar 110 cm. ¿Cuántas cajas completas caben como máximo sobre la estiba?", "f": "Cálculo propio a partir de los datos del caso (datos ficticios).", "vis": "", "o": [["A", "8", "Es la cantidad de cajas de una sola capa; caben 4 capas.", false], ["B", "32", "Por capa: (80 ÷ 40) × (120 ÷ 30) = 2 × 4 = 8 cajas; capas: 110 ÷ 25 = 4,4, es decir, 4 capas completas; 8 × 4 = 32.", true], ["C", "35", "Divide volúmenes (120 × 80 × 110 ÷ 30.000 ≈ 35,2); eso supone que las cajas se pueden partir para llenar los espacios.", false], ["D", "40", "Redondea 4,4 capas hacia arriba (5 capas); la quinta capa superaría los 110 cm.", false]]}]}, {"comp": "razonamiento_cuantitativo", "sim": "tyt-2", "ind": "Receta de arepas en una cocina", "tt": "", "texto": "La cocina de un comedor comunitario usa la receta de la tabla 1 para preparar arepas para 12 personas. Las cantidades de cada ingrediente son proporcionales al número de personas.", "vis": "<table class=\"vt\"><caption>Tabla 1. Receta para 12 personas<\/caption><thead><tr><th>Ingrediente<\/th><th>Cantidad<\/th><\/tr><\/thead><tbody><tr><td>Harina de maíz<\/td><td>750 g<\/td><\/tr><tr><td>Agua<\/td><td>900 mL<\/td><\/tr><tr><td>Sal<\/td><td>15 g<\/td><\/tr><tr><td>Queso rallado<\/td><td>300 g<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Receta ficticia.<\/div>", "items": [{"id": "RCT-214", "niv": 1, "cp": "rc_formulacion", "e": "¿Cuánta harina de maíz se necesita para preparar arepas para 20 personas?", "f": "Cálculo propio a partir de los datos del caso (datos ficticios).", "vis": "", "o": [["A", "450 g.", "Invierte la proporción (750 × 12 ÷ 20); para más personas se necesita más harina, no menos.", false], ["B", "758 g.", "Suma 8 g por las 8 personas adicionales; la relación es multiplicativa, no aditiva.", false], ["C", "1.250 g.", "750 g ÷ 12 = 62,5 g por persona; 62,5 × 20 = 1.250 g.", true], ["D", "1.500 g.", "Duplica la receta, que alcanza para 24 personas y no para 20.", false]]}, {"id": "RCT-215", "niv": 2, "cp": "rc_interpretacion", "e": "¿Qué relación entre el agua y la harina de maíz expresa la receta?", "f": "Cálculo propio a partir de los datos del caso (datos ficticios).", "vis": "", "o": [["A", "6 mL de agua por cada 5 g de harina.", "900 : 750 se simplifica dividiendo entre 150: 6 : 5.", true], ["B", "5 mL de agua por cada 6 g de harina.", "Invierte la razón: hay más agua (900) que harina (750).", false], ["C", "150 mL de agua por cada gramo de harina.", "150 es la diferencia entre 900 y 750, no una razón entre ellas.", false], ["D", "3 mL de agua por cada 2 g de harina.", "La razón 3 : 2 correspondería a 1.125 mL de agua para 750 g de harina.", false]]}, {"id": "RCT-216", "niv": 1, "cp": "rc_formulacion", "e": "La harina de maíz se compra en paquetes de 1 kg que cuestan $ 4.800. ¿Cuánto cuesta la harina que se usa en la receta para 12 personas?", "f": "Cálculo propio a partir de los datos del caso (datos ficticios).", "vis": "", "o": [["A", "$ 360", "Usa 0,075 kg en lugar de 0,75 kg (error al convertir gramos a kilogramos).", false], ["B", "$ 3.600", "750 g = 0,75 kg; 0,75 × 4.800 = 3.600.", true], ["C", "$ 4.800", "Es el precio del paquete completo, pero la receta usa solo 0,75 kg.", false], ["D", "$ 6.400", "Divide el precio entre 0,75 en lugar de multiplicarlo.", false]]}]}, {"comp": "razonamiento_cuantitativo", "sim": "tyt-2", "ind": "Consultas en un puesto de salud", "tt": "", "texto": "Un puesto de salud registró el número de consultas de medicina general y de odontología en cada trimestre del año. La gráfica 1 muestra los datos.", "vis": "<div class=\"vfig\"><svg class=\"vg\" viewBox=\"0 0 560 320\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Gráfica 1. Consultas por trimestre\" font-family=\"Arial, sans-serif\" font-size=\"12\"><rect width=\"560\" height=\"320\" fill=\"#ffffff\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"13\" fill=\"#1d2433\">Gráfica 1. Consultas por trimestre<\/text><line x1=\"60\" y1=\"258.0\" x2=\"540\" y2=\"258.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"262.0\" text-anchor=\"end\" fill=\"#3a4356\">0<\/text><line x1=\"60\" y1=\"221.0\" x2=\"540\" y2=\"221.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"225.0\" text-anchor=\"end\" fill=\"#3a4356\">100<\/text><line x1=\"60\" y1=\"184.0\" x2=\"540\" y2=\"184.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"188.0\" text-anchor=\"end\" fill=\"#3a4356\">200<\/text><line x1=\"60\" y1=\"147.0\" x2=\"540\" y2=\"147.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"151.0\" text-anchor=\"end\" fill=\"#3a4356\">300<\/text><line x1=\"60\" y1=\"110.0\" x2=\"540\" y2=\"110.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"114.0\" text-anchor=\"end\" fill=\"#3a4356\">400<\/text><line x1=\"60\" y1=\"73.0\" x2=\"540\" y2=\"73.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"77.0\" text-anchor=\"end\" fill=\"#3a4356\">500<\/text><line x1=\"60\" y1=\"36.0\" x2=\"540\" y2=\"36.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"40.0\" text-anchor=\"end\" fill=\"#3a4356\">600<\/text><line x1=\"60\" y1=\"258\" x2=\"540\" y2=\"258\" stroke=\"#3a4356\"/><line x1=\"60\" y1=\"258\" x2=\"60\" y2=\"36\" stroke=\"#3a4356\"/><text transform=\"translate(14,147.0) rotate(-90)\" text-anchor=\"middle\" fill=\"#3a4356\">Número de consultas<\/text><text x=\"300.0\" y=\"312\" text-anchor=\"middle\" fill=\"#3a4356\">Trimestre<\/text><text x=\"120.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Trimestre 1<\/text><text x=\"240.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Trimestre 2<\/text><text x=\"360.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Trimestre 3<\/text><text x=\"480.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Trimestre 4<\/text><rect x=\"78.0\" y=\"102.6\" width=\"42.0\" height=\"155.4\" fill=\"#1660a8\"/><text x=\"99.0\" y=\"98.6\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">420<\/text><rect x=\"198.0\" y=\"117.4\" width=\"42.0\" height=\"140.6\" fill=\"#1660a8\"/><text x=\"219.0\" y=\"113.4\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">380<\/text><rect x=\"318.0\" y=\"91.5\" width=\"42.0\" height=\"166.5\" fill=\"#1660a8\"/><text x=\"339.0\" y=\"87.5\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">450<\/text><rect x=\"438.0\" y=\"69.3\" width=\"42.0\" height=\"188.7\" fill=\"#1660a8\"/><text x=\"459.0\" y=\"65.3\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">510<\/text><rect x=\"120.0\" y=\"202.5\" width=\"42.0\" height=\"55.5\" fill=\"#d9822b\"/><text x=\"141.0\" y=\"198.5\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">150<\/text><rect x=\"240.0\" y=\"191.4\" width=\"42.0\" height=\"66.6\" fill=\"#d9822b\"/><text x=\"261.0\" y=\"187.4\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">180<\/text><rect x=\"360.0\" y=\"195.1\" width=\"42.0\" height=\"62.9\" fill=\"#d9822b\"/><text x=\"381.0\" y=\"191.1\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">170<\/text><rect x=\"480.0\" y=\"184.0\" width=\"42.0\" height=\"74.0\" fill=\"#d9822b\"/><text x=\"501.0\" y=\"180.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">200<\/text><rect x=\"60\" y=\"286\" width=\"12\" height=\"12\" fill=\"#1660a8\"/><text x=\"76\" y=\"296\" fill=\"#1d2433\">Medicina general<\/text><rect x=\"198\" y=\"286\" width=\"12\" height=\"12\" fill=\"#d9822b\"/><text x=\"214\" y=\"296\" fill=\"#1d2433\">Odontología<\/text><\/svg><\/div>", "items": [{"id": "RCT-217", "niv": 1, "cp": "rc_interpretacion", "e": "¿En qué trimestre disminuyeron las consultas de medicina general con respecto al trimestre anterior?", "f": "Cálculo propio a partir de los datos del caso (datos ficticios).", "vis": "", "o": [["A", "En el trimestre 2.", "Medicina general pasó de 420 consultas en el trimestre 1 a 380 en el trimestre 2: bajó 40.", true], ["B", "En el trimestre 3.", "En el trimestre 3 las consultas de medicina general subieron de 380 a 450.", false], ["C", "En el trimestre 4.", "En el trimestre 4 subieron de 450 a 510.", false], ["D", "En ningún trimestre.", "Sí hubo una disminución: del trimestre 1 (420) al trimestre 2 (380).", false]]}, {"id": "RCT-218", "niv": 1, "cp": "rc_interpretacion", "e": "¿En qué trimestre fue mayor el número total de consultas (medicina general más odontología)?", "f": "Cálculo propio a partir de los datos del caso (datos ficticios).", "vis": "", "o": [["A", "Trimestre 1.", "En el trimestre 1 hubo 420 + 150 = 570 consultas.", false], ["B", "Trimestre 2.", "En el trimestre 2 hubo 380 + 180 = 560 consultas; aunque odontología subió, el total bajó.", false], ["C", "Trimestre 3.", "En el trimestre 3 hubo 450 + 170 = 620 consultas, menos que en el trimestre 4.", false], ["D", "Trimestre 4.", "En el trimestre 4 hubo 510 + 200 = 710 consultas, el mayor total del año.", true]]}, {"id": "RCT-219", "niv": 3, "cp": "rc_interpretacion", "e": "En el trimestre 4, ¿cuántas consultas de medicina general hubo por cada consulta de odontología?", "f": "Cálculo propio a partir de los datos del caso (datos ficticios).", "vis": "", "o": [["A", "0,39", "Calcula la razón inversa: odontología entre medicina general (200 ÷ 510).", false], ["B", "1,55", "Divide la diferencia (510 − 200 = 310) entre 200: eso indica cuántas consultas de más, no cuántas en total.", false], ["C", "2,51", "Usa los totales del año (1.760 ÷ 700) en lugar de los datos del trimestre 4.", false], ["D", "2,55", "En el trimestre 4: 510 ÷ 200 = 2,55 consultas de medicina general por cada una de odontología.", true]]}, {"id": "RCT-220", "niv": 3, "cp": "rc_argumentacion", "e": "La coordinadora afirma: «Del trimestre 3 al trimestre 4, las consultas de odontología crecieron en mayor porcentaje que las de medicina general». ¿Cuál de las siguientes razones evalúa correctamente la afirmación?", "f": "Cálculo propio a partir de los datos del caso (datos ficticios).", "vis": "", "o": [["A", "Es correcta: odontología creció 30 ÷ 170 ≈ 17,6 %, y medicina general, 60 ÷ 450 ≈ 13,3 %.", "El crecimiento porcentual se calcula sobre el valor inicial de cada servicio: 17,6 % > 13,3 %.", true], ["B", "Es incorrecta: medicina general aumentó 60 consultas y odontología solo 30.", "Compara aumentos absolutos; la afirmación habla de porcentajes, que dependen del valor de partida.", false], ["C", "Es incorrecta: odontología tuvo menos consultas que medicina general en el trimestre 4.", "Tener menos consultas no impide crecer en mayor porcentaje.", false], ["D", "Es correcta: odontología aumentó 30 consultas y medicina general 60, y 30 es la mitad de 60.", "La razón no prueba nada sobre porcentajes; la conclusión es cierta solo porque 30 ÷ 170 > 60 ÷ 450.", false]]}]}, {"comp": "razonamiento_cuantitativo", "sim": "tyt-2", "ind": "Planes de internet y tiempo de descarga", "tt": "", "texto": "Una pequeña empresa de diseño compara planes de internet. La velocidad se mide en megabits por segundo (Mbps) y el tamaño de los archivos, en megabytes (MB). Recuerde que 1 byte equivale a 8 bits; por tanto, 1 MB equivale a 8 megabits. La tabla 1 muestra los planes disponibles.", "vis": "<table class=\"vt\"><caption>Tabla 1. Planes de internet<\/caption><thead><tr><th>Plan<\/th><th>Velocidad (Mbps)<\/th><th>Costo mensual<\/th><\/tr><\/thead><tbody><tr><td>Básico<\/td><td>50<\/td><td>$ 65.000<\/td><\/tr><tr><td>Medio<\/td><td>100<\/td><td>$ 89.000<\/td><\/tr><tr><td>Pro<\/td><td>300<\/td><td>$ 150.000<\/td><\/tr><tr><td>Ultra<\/td><td>500<\/td><td>$ 240.000<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Datos ficticios.<\/div>", "items": [{"id": "RCT-221", "niv": 2, "cp": "rc_formulacion", "e": "Con el Plan Básico, y suponiendo que la descarga se mantiene todo el tiempo a la velocidad del plan, ¿cuánto tarda en descargarse un archivo de 1.500 MB?", "f": "Cálculo propio a partir de los datos del caso (datos ficticios).", "vis": "", "o": [["A", "0,5 min.", "Divide 1.500 entre 50 (30 s) sin convertir megabytes a megabits (falta multiplicar por 8).", false], ["B", "4 min.", "1.500 MB × 8 = 12.000 megabits; 12.000 ÷ 50 = 240 s = 4 min.", true], ["C", "30 min.", "Toma 1.500 ÷ 50 = 30 como si fueran minutos y además omite la conversión de bytes a bits.", false], ["D", "240 min.", "240 es el tiempo en segundos; no lo convierte a minutos.", false]]}, {"id": "RCT-222", "niv": 3, "cp": "rc_interpretacion", "e": "¿Qué plan tiene el menor costo mensual por cada Mbps de velocidad?", "f": "Cálculo propio a partir de los datos del caso (datos ficticios).", "vis": "", "o": [["A", "Plan Básico.", "Cuesta 65.000 ÷ 50 = $ 1.300 por Mbps; es el más barato en total, pero el más caro por Mbps.", false], ["B", "Plan Medio.", "Cuesta 89.000 ÷ 100 = $ 890 por Mbps, más que los planes Pro y Ultra.", false], ["C", "Plan Pro.", "Cuesta 150.000 ÷ 300 = $ 500 por Mbps, un poco más que el Ultra ($ 480).", false], ["D", "Plan Ultra.", "Cuesta 240.000 ÷ 500 = $ 480 por Mbps, el menor valor de los cuatro planes.", true]]}]}, {"comp": "razonamiento_cuantitativo", "sim": "tyt-2", "ind": "Corte de discos en un taller de metalmecánica", "tt": "", "texto": "En un taller de metalmecánica se cortan discos de 30 cm de diámetro de una lámina rectangular de 1,2 m por 0,6 m. Los discos se disponen en filas y columnas, sin superponerse y sin salirse de la lámina. El resto de la lámina se considera desperdicio.", "vis": "", "items": [{"id": "RCT-223", "niv": 1, "cp": "rc_formulacion", "e": "¿Cuántos discos completos se pueden cortar de la lámina con esa disposición?", "f": "Cálculo propio a partir de los datos del caso (datos ficticios).", "vis": "", "o": [["A", "4", "Cuenta solo una fila: a lo largo caben 4 discos, pero a lo ancho caben 2 filas.", false], ["B", "8", "A lo largo caben 120 ÷ 30 = 4 discos y a lo ancho 60 ÷ 30 = 2 filas: 4 × 2 = 8.", true], ["C", "10", "Divide áreas (0,72 m² ÷ 0,0707 m² ≈ 10,2); los espacios entre discos no se pueden aprovechar.", false], ["D", "16", "Usa el radio (15 cm) en una de las medidas: 120 ÷ 30 = 4 y 60 ÷ 15 = 4.", false]]}, {"id": "RCT-224", "niv": 3, "cp": "rc_formulacion", "e": "Si se corta el mayor número posible de discos con esa disposición, ¿qué porcentaje del área de la lámina se desperdicia, aproximadamente? (Use π ≈ 3,14).", "f": "Cálculo propio a partir de los datos del caso (datos ficticios).", "vis": "", "o": [["A", "15,5 %", "0,155 m² es el área desperdiciada; la toma como porcentaje sin dividirla entre el área de la lámina (0,72 m²).", false], ["B", "21,5 %", "Área de los discos: 8 × 3,14 × 0,15² ≈ 0,565 m²; desperdicio: 0,72 − 0,565 = 0,155 m²; 0,155 ÷ 0,72 ≈ 21,5 %.", true], ["C", "27,4 %", "Divide el desperdicio entre el área de los discos (0,155
