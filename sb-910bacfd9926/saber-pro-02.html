<style>
:root{--bg:#f7f5f2;--card:#fff;--ink:#1d2433;--mute:#5a6478;--line:#e0dbd4;--pri:#7a2e0b;--pri2:#b0501c;--ok:#0d6b3a;--okbg:#e6f4ec;--no:#9b1c1c;--nobg:#fbeaea;--sel:#f8ece4}
@media (prefers-color-scheme: dark){:root{--bg:#14110f;--card:#1f1a17;--ink:#ece6e1;--mute:#a69c94;--line:#3a322c;--pri:#f0a47a;--pri2:#f5bb98;--ok:#7fd3a3;--okbg:#16301f;--no:#f2a3a3;--nobg:#3a1c1c;--sel:#3a2a20}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overflow-wrap:anywhere}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px}
.hwrap{max-width:860px;margin:0 auto;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;justify-content:space-between}
h1{font-size:17px;margin:0;color:var(--pri)}
h2{color:var(--pri)}
.stat{font-size:14px;color:var(--mute)}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--pri)}
.timer.low{color:var(--no)}
main{max-width:860px;margin:0 auto;padding:16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin:0 0 16px}
.mod{background:var(--pri);color:var(--card);border-radius:10px;padding:10px 14px;margin:28px 0 6px;font-weight:700;font-size:18px}
.inst{font-size:13px;font-weight:700;color:var(--pri);text-transform:uppercase;letter-spacing:.03em;margin:18px 0 4px}
.caso{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--pri);border-radius:10px;padding:14px 16px;margin:10px 0}
.tag{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--pri);font-weight:700}
.caso p{margin:6px 0 0;white-space:pre-line}
.item{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0}
.enun{margin:0 0 8px;white-space:pre-line}
.n{font-weight:700;color:var(--pri)}
.niv{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-right:4px;white-space:nowrap}
.op{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:6px 0;cursor:pointer;background:transparent;width:100%;text-align:left;color:inherit;font:inherit}
.ops8{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.ops8 .op{margin:0}
.op:hover{border-color:var(--pri2)}
.op .l{font-weight:700;min-width:20px}
.op.sel{background:var(--sel);border-color:var(--pri2)}
.op.ok{background:var(--okbg);border-color:var(--ok)}
.op.no{background:var(--nobg);border-color:var(--no)}
.op[disabled]{cursor:default}
.just{font-size:14px;margin:8px 0 0;padding:8px 10px;border-top:1px dashed var(--line)}
.just div{margin:4px 0}
.just .okt{color:var(--ok);font-weight:700}
.just .not{color:var(--no);font-weight:700}
.src{font-size:13px;color:var(--mute);margin-top:6px}
button.btn{background:var(--pri);color:var(--card);border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer}
button.btn.sec{background:transparent;color:var(--pri);border:1px solid var(--pri)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
select{font:inherit;padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);max-width:100%}
table{border-collapse:collapse;width:100%;font-size:15px}
td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.sub td{font-size:13px;color:var(--mute);padding-left:22px}
.vt{width:auto;max-width:100%;margin:10px 0;font-size:14px;display:block;overflow-x:auto}
.vt caption{text-align:left;font-weight:700;padding-bottom:4px}
.vt th,.vt td{border:1px solid var(--line);padding:4px 8px}
.vt th{background:var(--sel)}
.vnota{font-size:12px;color:var(--mute)}
.vfig{margin:10px 0}
.vfig svg{width:100%;max-width:560px;height:auto;border-radius:6px;border:1px solid var(--line);background:#fff}
.big{font-size:40px;font-weight:800;color:var(--pri);line-height:1.1}
.aviso{font-size:13px;color:var(--mute)}
.hide{display:none !important}
.res-ok{color:var(--ok);font-weight:700}.res-no{color:var(--no);font-weight:700}
textarea{width:100%;min-height:320px;font:inherit;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);resize:vertical}
.chk label{display:flex;gap:8px;align-items:flex-start;margin:6px 0;font-size:15px}
.chk input{margin-top:4px;width:18px;height:18px;flex:none}
.modelo{white-space:pre-line;background:var(--bg);border-radius:8px;padding:10px 12px;margin:6px 0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal .panel{max-width:420px}
.nav{padding:6px 0;display:flex;gap:6px;flex-wrap:wrap}
.nav a{font-size:13px;color:var(--pri);border:1px solid var(--line);border-radius:999px;padding:3px 10px;text-decoration:none;background:var(--card)}
footer{max-width:860px;margin:0 auto;padding:8px 16px 40px;font-size:12px;color:var(--mute)}
</style>

<script>
const DATA = [{"comp": "lectura_critica", "sim": "pro-2", "ind": "Fragmento teatral: dos hermanos y el piano de la madre", "tt": "Texto literario", "texto": "PERSONAJES: MARTA, 45 años. JULIÁN, su hermano menor, 40 años.\n\n(Sala de una casa vacía. Cajas apiladas y un piano cubierto con una sábana. Es de tarde.)\n\nJULIÁN.— (Leyendo una lista.) Los muebles del comedor se los lleva el de la compraventa el jueves. La nevera, la vecina. Solo falta decidir qué hacemos con eso. (Señala el piano sin mirarlo.)\n\nMARTA.— «Eso» tiene nombre.\n\nJULIÁN.— Un piano que nadie toca desde hace veinte años no necesita nombre. Necesita un comprador.\n\nMARTA.— Mamá lo tocaba los domingos.\n\nJULIÁN.— Mamá lo tocaba los domingos cuando tú tenías diez años. Después lo usó para poner los retratos.\n\nMARTA.— (Levanta una punta de la sábana. Pasa los dedos por las teclas sin hacer sonar ninguna.) Está desafinado.\n\nJULIÁN.— Razón de más.\n\nMARTA.— No dije que lo vendiéramos. Dije que está desafinado.\n\nJULIÁN.— Marta, tu apartamento es de cincuenta metros. El mío tiene escaleras. ¿Dónde lo vas a poner? ¿En el balcón, a que se moje?\n\nMARTA.— Podríamos afinarlo antes de venderlo. Al menos que se vaya sonando bien.\n\nJULIÁN.— (Ríe, cansado.) ¿Y eso a quién le importa? Al comprador le da igual. Lo va a afinar él.\n\nMARTA.— A mí me importa. (Pausa.) No quiero que la última vez que alguien lo oiga en esta casa suene así.\n\n(Silencio. JULIÁN deja la lista sobre una caja. Se acerca al piano y retira del todo la sábana. Se queda mirándolo.)\n\nJULIÁN.— Ella siempre empezaba con la misma. La del vals.\n\nMARTA.— Pensé que no te acordabas.\n\nJULIÁN.— Me acuerdo de que siempre se equivocaba en la misma parte. Y se reía.\n\nMARTA.— (Sonríe.) En el compás doce.\n\nJULIÁN.— (Toca una tecla. Suena desafinada. Retira la mano.) Llamo al afinador mañana. Pero el jueves se va.\n\nMARTA.— El jueves se va.\n\n(Los dos se quedan de pie junto al piano. La luz baja lentamente.)", "vis": "", "items": [{"id": "LCP-136", "niv": 1, "cp": "lc_local", "e": "Según Julián, ¿por qué no pueden quedarse con el piano?", "f": "Texto original elaborado para este simulacro, intervención de Julián sobre los apartamentos", "vis": "", "o": [["A", "Porque está tan dañado que ya no tiene arreglo y nadie podría volver a tocarlo.", "El piano solo está desafinado, y Julián acepta llamar al afinador; no está irreparable.", false], ["B", "Porque Marta nunca aprendió a tocarlo.", "El texto no dice nada sobre si Marta sabe tocar; no es la razón que da Julián.", false], ["C", "Porque ninguno de los dos tiene en su vivienda un lugar adecuado para ponerlo.", "Julián dice: «tu apartamento es de cincuenta metros. El mío tiene escaleras. ¿Dónde lo vas a poner?».", true], ["D", "Porque el comprador de la compraventa ya lo pagó por adelantado y se lo lleva el jueves.", "El fragmento dice que la compraventa se lleva los muebles del comedor; no menciona que alguien haya pagado el piano.", false]]}, {"id": "LCP-137", "niv": 2, "cp": "lc_global", "e": "Cuando Marta responde «“Eso” tiene nombre», le reprocha a su hermano que", "f": "Texto original elaborado para este simulacro, primeras intervenciones de Julián y Marta", "vis": "", "o": [["A", "se refiera al piano como a un objeto cualquiera, sin reconocer lo que significa para la familia.", "Julián lo llama «eso» y lo señala «sin mirarlo»; Marta reclama que el piano merece otro trato porque está ligado a la memoria de la madre.", true], ["B", "haya decidido venderle el piano a la vecina sin consultarla a ella primero.", "A la vecina se le da la nevera, no el piano; y en ese momento aún no se ha decidido qué hacer con él.", false], ["C", "haya olvidado incluir el piano en la lista de muebles.", "Julián sí se refiere al piano («Solo falta decidir qué hacemos con eso»); el reproche es por la forma de nombrarlo.", false], ["D", "no sepa cómo se llama el piano que compró su madre.", "Es una lectura literal; Marta no pregunta por un nombre propio del piano.", false]]}, {"id": "LCP-138", "niv": 3, "cp": "lc_global", "e": "¿Cómo cambia la actitud de Julián a lo largo del fragmento?", "f": "Texto original elaborado para este simulacro, fragmento completo", "vis": "", "o": [["A", "Primero acepta afinar el piano, pero después, al oír que suena desafinado, convence a Marta de que es inútil hacerlo.", "El orden es el inverso: primero considera inútil afinarlo y al final acepta llamar al afinador.", false], ["B", "Pasa de tratar el piano como un trámite a recordar con afecto a su madre, y acepta afinarlo antes de venderlo.", "Al inicio lee una lista y llama al piano «eso»; luego recuerda el vals y la risa de la madre, y dice «Llamo al afinador mañana. Pero el jueves se va».", true], ["C", "Empieza tranquilo y termina enojado con Marta por retrasar la entrega de la casa.", "No hay enojo al final: ambos quedan juntos, en silencio, junto al piano.", false], ["D", "Al principio quiere vender el piano cuanto antes, pero al final, conmovido por los recuerdos, decide llevárselo a su apartamento.", "Julián mantiene la venta: «Pero el jueves se va».", false]]}, {"id": "LCP-139", "niv": 1, "cp": "lc_local", "e": "Según Julián, después de dejar de tocar el piano, la madre lo usó", "f": "Texto original elaborado para este simulacro, tercera intervención de Julián", "vis": "", "o": [["A", "para dar clases a los niños del barrio los domingos.", "Los domingos eran los días en que ella lo tocaba; no se mencionan clases.", false], ["B", "para acompañar a Marta mientras practicaba el vals.", "El vals era la pieza con que empezaba la madre; no se dice que Marta lo practicara.", false], ["C", "como mueble para guardar partituras y cartas.", "El texto no menciona partituras ni cartas.", false], ["D", "como mueble sobre el cual exhibir retratos.", "Julián dice: «Después lo usó para poner los retratos»; es decir, dejó de tocarlo y lo usó como soporte para fotografías.", true]]}, {"id": "LCP-140", "niv": 3, "cp": "lc_reflexion", "e": "Acotaciones como «Pasa los dedos por las teclas sin hacer sonar ninguna» o «La luz baja lentamente» cumplen en el fragmento la función de", "f": "Texto original elaborado para este simulacro, acotaciones", "vis": "", "o": [["A", "informar al público sobre el precio que la familia espera recibir por el piano.", "Ninguna acotación menciona precios.", false], ["B", "comunicar emociones y un cierre que los personajes no expresan con palabras.", "Tocar sin hacer sonar sugiere el respeto y la nostalgia de Marta; la luz que baja marca un final sereno y triste. Las acotaciones transmiten lo que el diálogo calla.", true], ["C", "narrar la historia de la familia desde antes del comienzo de la escena.", "Las acotaciones describen acciones presentes; la historia familiar aparece en los diálogos.", false], ["D", "contradecir lo que los personajes afirman en sus diálogos para crear un efecto cómico.", "Las acotaciones refuerzan el tono emotivo de la escena; no la contradicen ni buscan un efecto cómico.", false]]}]}, {"comp": "lectura_critica", "sim": "pro-2", "ind": "Ensayo sobre la traducción y la visibilidad del traductor", "tt": "Texto informativo", "texto": "(1) Suele decirse que una buena traducción es aquella que no se nota: el lector debería tener la impresión de estar leyendo un texto escrito originalmente en su lengua. El ideal es comprensible, pero esconde una paradoja. Si la traducción no se nota, tampoco se nota el traductor, y con él desaparecen las decisiones que tomó.\n\n(2) Y las decisiones son inevitables. Ninguna palabra tiene un equivalente exacto en otra lengua. El inglés «home» no coincide del todo con «casa» ni con «hogar»; el portugués «saudade» se ha vuelto famoso precisamente porque no se deja traducir con una sola palabra. Cada vez que el traductor elige, gana algo y pierde algo: conserva el sentido y sacrifica el ritmo, o mantiene un juego de palabras a costa de cambiar una imagen.\n\n(3) Esto no convierte la traducción en una traición, como sostiene un viejo refrán italiano. La convierte en una interpretación, que es algo distinto. El intérprete de una partitura no inventa la música, pero tampoco se limita a reproducir las notas: decide el tempo, los matices, los silencios. Dos pianistas pueden tocar la misma obra de manera diferente, y ambos ser fieles a ella.\n\n(4) Reconocer esto tiene consecuencias prácticas. La primera es que vale la pena leer más de una traducción de una obra importante: cada una ilumina aspectos que la otra deja en la sombra. La segunda es que el nombre del traductor debería aparecer en la cubierta de los libros, y no escondido en la página de créditos, como sucede todavía en muchas editoriales. No se trata de vanidad, sino de honestidad con el lector, que tiene derecho a saber quién tomó las decisiones que está leyendo.\n\n(5) Hay quien teme que hacer visible al traductor rompa la ilusión de la lectura. Pero esa ilusión nunca fue completa. Cualquiera que haya leído a un novelista ruso en español sabe que no está leyendo exactamente lo que escribió el autor, sino lo que alguien pudo hacer con ello en otra lengua. Admitirlo no empobrece la experiencia; la hace más consciente.", "vis": "", "items": [{"id": "LCP-141", "niv": 2, "cp": "lc_global", "e": "¿Cuál es la tesis del texto?", "f": "Texto original elaborado para este simulacro, párrafos 2, 3 y 4", "vis": "", "o": [["A", "La traducción es una forma de traición, aunque a veces sea necesaria para conocer obras extranjeras.", "El párrafo 3 rechaza esta idea: «Esto no convierte la traducción en una traición»; la considera una interpretación.", false], ["B", "Una buena traducción debe pasar inadvertida, de modo que el lector olvide que lee una obra traducida.", "Es el ideal que el autor presenta en el párrafo 1 para cuestionarlo.", false], ["C", "Conviene leer las obras importantes en su lengua original antes que en traducción.", "El autor no hace esa recomendación; propone leer varias traducciones y hacer visible al traductor.", false], ["D", "Traducir supone tomar decisiones interpretativas; por eso el traductor debería hacerse visible.", "El texto sostiene que las decisiones son inevitables (párrafo 2), que traducir es interpretar (párrafo 3) y que el traductor debe aparecer en la cubierta (párrafo 4).", true]]}, {"id": "LCP-142", "niv": 1, "cp": "lc_local", "e": "Según el párrafo 2, la palabra portuguesa «saudade» se ha vuelto famosa porque", "f": "Texto original elaborado para este simulacro, párrafo 2", "vis": "", "o": [["A", "expresa un sentimiento que los hablantes de otras lenguas no experimentan.", "El texto habla de la dificultad de traducir la palabra, no de que el sentimiento sea exclusivo de los hablantes de portugués.", false], ["B", "es la palabra más usada por los novelistas de lengua portuguesa.", "El texto no hace ninguna afirmación sobre la frecuencia de uso de la palabra.", false], ["C", "no puede traducirse a otras lenguas con una sola palabra.", "El párrafo 2 dice que se volvió famosa «precisamente porque no se deja traducir con una sola palabra».", true], ["D", "significa exactamente lo mismo que la palabra «hogar» en español.", "«Hogar» se menciona a propósito de «home», no de «saudade».", false]]}, {"id": "LCP-143", "niv": 3, "cp": "lc_global", "e": "En el párrafo 3, la comparación entre el traductor y el intérprete de una partitura sirve para", "f": "Texto original elaborado para este simulacro, párrafo 3", "vis": "", "o": [["A", "ilustrar que una versión puede ser fiel a la obra y, a la vez, distinta de otras versiones.", "El párrafo concluye: «Dos pianistas pueden tocar la misma obra de manera diferente, y ambos ser fieles a ella»; así se explica que traducir es interpretar.", true], ["B", "sugerir que los traductores deberían recibir formación musical para hacer mejor su trabajo.", "La comparación es una analogía, no una recomendación de formación.", false], ["C", "mostrar que el intérprete, como el traductor, debe limitarse a reproducir las notas tal como están escritas.", "El párrafo 3 dice lo contrario: el intérprete «tampoco se limita a reproducir las notas», sino que decide el tempo, los matices y los silencios.", false], ["D", "demostrar que la música es más fácil de traducir que la literatura.", "El texto no compara la dificultad de traducir música y literatura.", false]]}, {"id": "LCP-144", "niv": 2, "cp": "lc_reflexion", "e": "¿Cuál de los siguientes hechos respaldaría mejor la primera consecuencia práctica que plantea el autor en el párrafo 4?", "f": "Texto original elaborado para este simulacro, párrafo 4", "vis": "", "o": [["A", "Dos traducciones de un mismo poema resaltan, cada una, matices distintos del original.", "La primera consecuencia es que vale la pena leer más de una traducción porque «cada una ilumina aspectos que la otra deja en la sombra»; este hecho lo confirma.", true], ["B", "La mayoría de los lectores no recuerda el nombre del traductor del último libro que leyó.", "Este dato podría relacionarse con la visibilidad del traductor, no con la conveniencia de leer varias traducciones.", false], ["C", "Algunos autores escriben sus obras directamente en dos lenguas distintas.", "El hecho no se relaciona con el valor de comparar traducciones de una misma obra.", false], ["D", "Una editorial vende más ejemplares cuando el nombre del traductor no aparece en la cubierta.", "Este hecho se refiere a la segunda consecuencia (la cubierta) y, en todo caso, no apoya la recomendación de leer varias traducciones.", false]]}]}, {"comp": "lectura_critica", "sim": "pro-2", "ind": "Columna sobre el turismo y los alquileres de corta duración", "tt": "Texto informativo", "texto": "(1) En Puerto Alba se ha vuelto común un letrero escrito a mano en algunas fachadas del barrio antiguo: «Esto era una casa». Lo ponen vecinos que vieron cómo, una tras otra, las viviendas de su cuadra se convertían en alojamientos para turistas. El letrero es ingenioso, pero corre el riesgo de apuntar al blanco equivocado.\n\n(2) El turista que llega con su maleta no decidió que la casa de la esquina dejara de ser una casa. Esa decisión la tomaron propietarios que descubrieron que alquilar por noches deja más que alquilar por años, y autoridades que no quisieron o no supieron poner reglas. Culpar al visitante es cómodo, porque es un desconocido que se irá en una semana; regular a los propietarios es más difícil, porque son vecinos, votan y tienen abogados.\n\n(3) Los efectos, en cambio, son reales. Un estudio de la universidad local encontró que, en los últimos cinco años, el arriendo mensual en el barrio antiguo subió mucho más rápido que los salarios de la ciudad. Las familias que se van no se mudan a otra calle del mismo barrio: se mudan a la periferia, y con ellas se van la tienda de la esquina, la escuela de barrio y la costumbre de saludarse.\n\n(4) Hay ciudades que han respondido prohibiendo por completo los alquileres de corta duración. La medida es tentadora, pero tiene costos: muchos pequeños propietarios dependen de ese ingreso, y una prohibición total suele empujar la actividad hacia la informalidad. Una alternativa más razonable es limitar el número de días al año que una vivienda puede alquilarse a turistas, exigir un registro público y cobrar un impuesto cuyo recaudo se destine a vivienda para residentes.\n\n(5) Nada de esto exige odiar al turismo, que sigue siendo una fuente de empleo para miles de personas en Puerto Alba. Exige, simplemente, recordar que una ciudad no es un decorado. Si sus habitantes se van, lo que los visitantes encontrarán será una escenografía bien pintada y sin nadie adentro.", "vis": "", "items": [{"id": "LCP-145", "niv": 2, "cp": "lc_global", "e": "Según el columnista, el letrero «Esto era una casa» corre el riesgo de apuntar al blanco equivocado porque", "f": "Texto original elaborado para este simulacro, párrafos 1 y 2", "vis": "", "o": [["A", "las autoridades de Puerto Alba prohibieron colgar letreros escritos a mano en las fachadas.", "El texto no menciona ninguna prohibición de letreros.", false], ["B", "las casas del barrio antiguo nunca fueron habitadas por familias residentes.", "El texto dice lo contrario: las familias se han ido mudando a la periferia.", false], ["C", "los turistas son los principales responsables del alza de los arriendos en el barrio antiguo.", "Es justo lo que el autor discute: el turista «no decidió» que la casa dejara de ser casa.", false], ["D", "la responsabilidad del cambio recae en propietarios y autoridades, no en los turistas.", "El párrafo 2 explica que la decisión la tomaron propietarios que prefirieron alquilar por noches y autoridades que no pusieron reglas; el letrero, en cambio, culpa al visitante.", true]]}, {"id": "LCP-146", "niv": 1, "cp": "lc_local", "e": "¿Qué propone el columnista en el párrafo 4?", "f": "Texto original elaborado para este simulacro, párrafo 4", "vis": "", "o": [["A", "Prohibir los alquileres de corta duración en el barrio antiguo, como han hecho otras ciudades.", "El autor menciona la prohibición, señala sus costos (informalidad, pérdida de ingresos de pequeños propietarios) y propone una «alternativa más razonable».", false], ["B", "Restringir y gravar el alquiler turístico, con un tope anual de días y un registro público.", "Es la alternativa planteada en el párrafo 4: límite de días, registro público e impuesto destinado a vivienda para residentes.", true], ["C", "Impedir la entrada de turistas al barrio antiguo durante los fines de semana.", "El texto no propone restringir la entrada de visitantes; incluso defiende el turismo como fuente de empleo.", false], ["D", "Congelar el precio de los arriendos del barrio antiguo durante los próximos años.", "No se propone ningún congelamiento de precios.", false]]}, {"id": "LCP-147", "niv": 3, "cp": "lc_reflexion", "e": "El párrafo 3 cita un estudio según el cual el arriendo del barrio antiguo subió mucho más rápido que los salarios. Para sostener que fue el alquiler turístico lo que causó esa alza, ¿qué información adicional sería más pertinente?", "f": "Texto original elaborado para este simulacro, párrafo 3", "vis": "", "o": [["A", "El número de letreros «Esto era una casa» colgados en las fachadas del barrio.", "El número de letreros refleja la inconformidad de los vecinos, no prueba la causa del alza.", false], ["B", "La opinión de los turistas sobre la calidad y el precio de los alojamientos del barrio antiguo.", "La opinión de los visitantes no permite establecer qué causó el alza de los arriendos para residentes.", false], ["C", "Una comparación con barrios similares de la ciudad que tengan pocos alojamientos turísticos.", "Si en barrios parecidos con poco alquiler turístico el arriendo subió menos, la explicación del columnista gana fuerza; sin esa comparación, el alza podría deberse a otras causas.", true], ["D", "El salario promedio de los trabajadores del sector turístico.", "Este dato no dice nada sobre la relación entre los alojamientos turísticos y el precio de los arriendos.", false]]}, {"id": "LCP-148", "niv": 2, "cp": "lc_reflexion", "e": "Con la imagen final de «una escenografía bien pintada y sin nadie adentro», el columnista busca", "f": "Texto original elaborado para este simulacro, párrafo 5", "vis": "", "o": [["A", "advertir que, sin residentes, la ciudad perdería la vida que la hace atractiva incluso para los visitantes.", "La imagen cierra la idea de que «una ciudad no es un decorado»: si los habitantes se van, queda una fachada vacía, lo que perjudica también al turismo.", true], ["B", "proponer que el barrio antiguo se convierta en un escenario para obras de teatro al aire libre.", "Es una lectura literal de una imagen figurada.", false], ["C", "sugerir que el turismo debería reducirse hasta que los residentes regresen al barrio.", "El autor aclara que «nada de esto exige odiar al turismo» y lo reconoce como fuente de empleo; la imagen advierte un riesgo, no pide reducir el turismo.", false], ["D", "denunciar que la alcaldía arregla las fachadas mientras descuida los servicios del barrio.", "El texto no menciona arreglos de fachadas ni servicios descuidados; la pintura es parte de la metáfora.", false]]}]}, {"comp": "lectura_critica", "sim": "pro-2", "ind": "Cómic sobre las fotografías de comida en redes sociales", "tt": "Caricatura o cómic", "texto": "Cómic de tres viñetas.\n\nViñeta 1: Una pareja en un restaurante. El mesero deja sobre la mesa dos platos humeantes. Ella exclama: «¡Se ve delicioso!». Los dos sacan el celular.\n\nViñeta 2: Ambos, de pie sobre las sillas, fotografían los platos desde arriba; él sostiene una lámpara para mejorar la luz. El reloj de la pared indica que han pasado veinte minutos. Los platos ya no humean.\n\nViñeta 3: El mesero retira los dos platos, intactos y fríos. La pareja mira las pantallas, sonriente. En el celular de ella se lee la publicación: «Cena perfecta. ¡No dejamos ni una miga!».", "vis": "", "items": [{"id": "LCP-149", "niv": 2, "cp": "lc_global", "e": "El humor del cómic surge principalmente de que", "f": "Texto original elaborado para este simulacro, viñetas 1 a 3", "vis": "", "o": [["A", "la comida del restaurante es de tan mala calidad que nadie quiere probarla.", "En la viñeta 1 ella dice «¡Se ve delicioso!»; no comen porque se dedican a fotografiar.", false], ["B", "la pareja no logra usar correctamente la cámara del celular.", "Nada indica que fallen con la cámara; al final miran las pantallas satisfechos.", false], ["C", "la publicación describe una experiencia que la pareja en realidad no vivió.", "La publicación dice «¡No dejamos ni una miga!», pero la viñeta 3 muestra los platos intactos: el contraste entre lo publicado y lo ocurrido produce el humor.", true], ["D", "el mesero se equivoca al retirar los platos antes de que la pareja termine de comer.", "El mesero retira los platos después de veinte minutos; el chiste no está en un error suyo.", false]]}, {"id": "LCP-150", "niv": 2, "cp": "lc_reflexion", "e": "¿Cuál de los siguientes enunciados expresa mejor la crítica que plantea el cómic?", "f": "Texto original elaborado para este simulacro, viñetas 1 a 3", "vis": "", "o": [["A", "Las fotografías de comida que se publican en redes sociales suelen tener mala iluminación.", "La lámpara es un detalle cómico del esfuerzo por la imagen; la crítica no es técnica.", false], ["B", "Los meseros deben esperar a que los clientes terminen de comer antes de recoger los platos.", "El comportamiento del mesero no es objeto de crítica en el cómic.", false], ["C", "Los restaurantes deberían prohibir el uso de celulares en sus mesas.", "El cómic no propone ninguna norma para los restaurantes; muestra un comportamiento.", false], ["D", "La búsqueda de una buena imagen para publicar puede desplazar la experiencia misma.", "La pareja dedica la cena a fotografiar y no come, pero publica que disfrutó: el cómic critica que la imagen de la experiencia reemplace a la experiencia.", true]]}]}, {"comp": "lectura_critica", "sim": "pro-2", "ind": "Texto expositivo sobre la proyección de Mercator", "tt": "Texto informativo", "texto": "(1) Todo mapa del mundo es, en un sentido estricto, una deformación. La superficie de la Tierra es curva, y no hay manera de extenderla sobre un plano sin estirarla o romperla en algún punto, del mismo modo que no se puede aplanar la cáscara de una naranja sin rasgarla. Los cartógrafos llaman «proyección» al procedimiento matemático que decide cómo se hará esa deformación, y cada proyección sacrifica algo para conservar otra cosa.\n\n(2) La más conocida es la que presentó el cartógrafo flamenco Gerardus Mercator en 1569. Su objetivo era práctico: ayudar a los navegantes. En su mapa se conservan los ángulos, de manera que una línea recta trazada entre dos puertos corresponde a un rumbo constante de brújula. Para un piloto del siglo XVI, que debía cruzar el océano guiándose por la brújula, esa propiedad era enormemente valiosa.\n\n(3) El precio de esa ventaja fue la distorsión de las áreas. Para conservar los ángulos, la proyección de Mercator agranda las regiones a medida que se alejan del ecuador. Por eso Groenlandia aparece de un tamaño parecido al de África, aunque África es unas catorce veces más grande. Las regiones cercanas a los polos ocupan en el mapa un espacio desproporcionado, y los propios polos no pueden representarse.\n\n(4) Durante siglos, este mapa diseñado para navegar se usó también en escuelas, libros y paredes de oficinas, donde nadie lo necesitaba para trazar rumbos. Algunos críticos han señalado que esa difusión contribuyó a una imagen distorsionada del mundo, en la que las regiones del norte parecen más extensas de lo que son. Otros responden que el problema no está en la proyección, sino en usarla para un fin distinto de aquel para el que fue creada.\n\n(5) Hoy existen proyecciones que conservan las áreas a cambio de deformar las formas, y otras que buscan un punto intermedio. Ninguna es perfecta. La pregunta pertinente no es cuál es el mapa verdadero, sino qué necesita mostrar quien lo usa.", "vis": "", "items": [{"id": "LCP-151", "niv": 1, "cp": "lc_local", "e": "Según el párrafo 2, Mercator diseñó su proyección con el objetivo de", "f": "Texto original elaborado para este simulacro, párrafo 2", "vis": "", "o": [["A", "mostrar con detalle las regiones cercanas a los polos.", "Los polos no pueden representarse en esta proyección (párrafo 3).", false], ["B", "facilitar la orientación de quienes cruzaban el océano con brújula.", "El párrafo 2 dice: «Su objetivo era práctico: ayudar a los navegantes».", true], ["C", "enseñar geografía en las escuelas y decorar las paredes de las oficinas.", "El párrafo 4 dice que ese uso se dio después y que allí «nadie lo necesitaba para trazar rumbos».", false], ["D", "representar con exactitud el tamaño real de los continentes.", "Su proyección distorsiona las áreas (párrafo 3); ese no era su objetivo.", false]]}, {"id": "LCP-152", "niv": 2, "cp": "lc_local", "e": "De acuerdo con el texto, en la proyección de Mercator Groenlandia aparece de un tamaño parecido al de África porque", "f": "Texto original elaborado para este simulacro, párrafo 3", "vis": "", "o": [["A", "la proyección exagera más el tamaño de una región cuanto más lejos del ecuador se encuentra.", "El párrafo 3 explica que, para conservar los ángulos, la proyección «agranda las regiones a medida que se alejan del ecuador», y por eso Groenlandia parece tan grande.", true], ["B", "ambos territorios tienen en realidad un área semejante.", "El texto dice que África es unas catorce veces más grande.", false], ["C", "la proyección reduce el tamaño de las regiones que están cerca de los polos.", "Es al contrario: las agranda a medida que se alejan del ecuador.", false], ["D", "en el siglo XVI Mercator desconocía el tamaño real de África.", "El texto no atribuye la distorsión a un desconocimiento, sino a la forma en que funciona la proyección.", false]]}, {"id": "LCP-153", "niv": 3, "cp": "lc_global", "e": "A partir del texto, en especial del párrafo 5, ¿qué posición asume el autor frente a la proyección de Mercator?", "f": "Texto original elaborado para este simulacro, párrafos 1, 4 y 5", "vis": "", "o": [["A", "Es el único mapa verdadero, pues las proyecciones que conservan las áreas deforman las formas.", "El autor dice que la pregunta pertinente «no es cuál es el mapa verdadero».", false], ["B", "Es un mapa engañoso, porque su autor quiso exagerar el tamaño de las regiones del norte.", "Según el párrafo 2, el objetivo de Mercator era ayudar a navegar; la distorsión de áreas fue el precio de conservar los ángulos, no una intención.", false], ["C", "Su utilidad depende del propósito, pues ningún mapa plano representa la Tierra sin alguna distorsión.", "El párrafo 1 explica que es imposible aplanar la superficie terrestre sin deformarla, y el párrafo 5 concluye que la pregunta es «qué necesita mostrar quien lo usa».", true], ["D", "Debería reemplazarse por una proyección que conserve a la vez las áreas y las formas.", "El párrafo 5 señala que unas proyecciones conservan las áreas a cambio de deformar las formas y que «ninguna es perfecta».", false]]}, {"id": "LCP-154", "niv": 2, "cp": "lc_reflexion", "e": "En el párrafo 1, el autor compara la superficie terrestre con la cáscara de una naranja. Esta comparación le sirve para", "f": "Texto original elaborado para este simulacro, párrafo 1", "vis": "", "o": [["A", "demostrar que la Tierra tiene una superficie irregular, con montañas y valles.", "La comparación no trata sobre el relieve, sino sobre la imposibilidad de aplanar una superficie curva sin deformarla.", false], ["B", "sugerir que los primeros mapas se dibujaban sobre materiales orgánicos y frágiles.", "El texto no menciona los materiales de los mapas.", false], ["C", "presentar un argumento de autoridad tomado de los cartógrafos.", "Una analogía cotidiana no es un argumento de autoridad.", false], ["D", "explicar con una imagen cotidiana por qué no puede aplanarse una superficie curva sin deformarla.", "Así como no se puede aplanar la cáscara sin rasgarla, no se puede pasar la superficie terrestre a un plano sin estirarla o romperla: la analogía hace comprensible un problema técnico.", true]]}]}, {"comp": "lectura_critica", "sim": "pro-2", "ind": "Ensayo sobre los límites de la meritocracia", "tt": "Texto informativo", "texto": "(1) Pocas ideas gozan de tan buena reputación como la del mérito. Que los cargos, las becas y los ascensos se repartan según el esfuerzo y la capacidad de cada quien, y no según el apellido o las amistades, parece el principio más justo imaginable. Y, en buena medida, lo es: frente a las sociedades en que el nacimiento decidía el destino, la meritocracia fue una conquista.\n\n(2) Sin embargo, el ideal tiene un punto ciego. Medimos el mérito por resultados —un puntaje, un título, un récord de ventas— y suponemos que esos resultados reflejan solo el esfuerzo y el talento de quien los obtuvo. Pero detrás de un buen puntaje hay también un colegio con biblioteca, una casa donde se podía estudiar en silencio, unos padres que pudieron pagar un curso de preparación. Nada de eso se eligió; se recibió.\n\n(3) Esto no significa que el esfuerzo no exista ni que el talento sea una ilusión. Significa que el resultado que premiamos mezcla lo que la persona hizo con lo que le tocó, y que no siempre es fácil separar una cosa de la otra. Cuando olvidamos esa mezcla, el mérito deja de ser un criterio para repartir oportunidades y se convierte en una justificación de las ventajas ya existentes.\n\n(4) El olvido tiene además un efecto moral. Quien triunfa tiende a creer que todo se lo debe a sí mismo, y de ahí es fácil pasar a creer que quien fracasa también se lo merece. Una sociedad que razona así puede volverse dura con los que quedan atrás y complaciente con los que llegan adelante.\n\n(5) La salida no es abandonar el mérito, sino tomarlo en serio. Si queremos premiar el esfuerzo, debemos asegurarnos de que todos puedan competir en condiciones parecidas: buena educación pública desde la infancia, apoyos para quienes empiezan con desventaja, procesos de selección que tengan en cuenta el punto de partida. Solo entonces los resultados dirán algo cierto sobre quienes los obtienen.", "vis": "", "items": [{"id": "LCP-155", "niv": 2, "cp": "lc_global", "e": "¿Cuál es la idea principal del texto?", "f": "Texto original elaborado para este simulacro, párrafos 1, 2, 3 y 5", "vis": "", "o": [["A", "Los puntajes altos se explican mejor por las ventajas familiares que por el esfuerzo.", "El párrafo 3 dice que el resultado mezcla ambas cosas y que no es fácil separarlas; el autor no afirma que pesen más las ventajas.", false], ["B", "El mérito solo es un criterio justo cuando todos compiten en condiciones parecidas.", "El texto reconoce la meritocracia como una conquista, muestra que los resultados mezclan esfuerzo y ventajas recibidas y concluye: «Solo entonces los resultados dirán algo cierto».", true], ["C", "La meritocracia debería reemplazarse por un sistema de cuotas según el origen social de cada persona.", "El autor no propone reemplazar el mérito: dice que la salida es «tomarlo en serio» con educación pública y apoyos.", false], ["D", "Los resultados académicos muestran con bastante precisión el talento de cada persona.", "Es el supuesto que el autor critica en el párrafo 2: detrás de un puntaje hay también ventajas recibidas.", false]]}, {"id": "LCP-156", "niv": 3, "cp": "lc_global", "e": "¿Qué relación hay entre el párrafo 2 y el párrafo 3?", "f": "Texto original elaborado para este simulacro, párrafos 2 y 3", "vis": "", "o": [["A", "El párrafo 3 precisa el alcance de la crítica del párrafo 2 para que no se entienda como una negación del esfuerzo.", "El párrafo 3 empieza con «Esto no significa que el esfuerzo no exista ni que el talento sea una ilusión» y luego explica qué sí significa la crítica anterior.", true], ["B", "El párrafo 3 introduce el efecto moral que tiene el triunfo sobre quienes lo alcanzan.", "El efecto moral se desarrolla en el párrafo 4.", false], ["C", "El párrafo 3 aporta datos estadísticos que confirman lo afirmado en el párrafo 2.", "El texto no presenta datos estadísticos.", false], ["D", "El párrafo 3 contradice la crítica del párrafo 2 y vuelve a defender el ideal meritocrático tal como se presentó al comienzo.", "El párrafo 3 no abandona la crítica: la matiza y la desarrolla (el mérito puede volverse justificación de ventajas).", false]]}, {"id": "LCP-157", "niv": 2, "cp": "lc_reflexion", "e": "En el párrafo 2, el autor menciona «un colegio con biblioteca, una casa donde se podía estudiar en silencio, unos padres que pudieron pagar un curso de preparación». Con esta enumeración busca", "f": "Texto original elaborado para este simulacro, párrafo 2", "vis": "", "o": [["A", "criticar a los padres que pagan cursos de preparación a sus hijos.", "El autor no reprocha a los padres; señala un factor que no depende del estudiante.", false], ["B", "demostrar que los buenos puntajes se deben al dinero de las familias y no al esfuerzo de los estudiantes.", "El autor dice que el resultado «mezcla» esfuerzo y ventajas, y el párrafo 3 aclara que el esfuerzo sí existe.", false], ["C", "mostrar con ejemplos concretos factores que influyen en los resultados y que la persona no eligió.", "La enumeración termina con «Nada de eso se eligió; se recibió»: ilustra las ventajas heredadas que se mezclan con el esfuerzo.", true], ["D", "relatar episodios de su propia infancia para ganarse la simpatía del lector.", "El autor no habla de su vida; los ejemplos son generales.", false]]}, {"id": "LCP-158", "niv": 3, "cp": "lc_reflexion", "e": "¿Con cuál de los siguientes enunciados, atribuidos a distintos opinadores ficticios, estaría en DESACUERDO el autor del texto?", "f": "Texto original elaborado para este simulacro, párrafos 1, 3, 4 y 5", "vis": "", "o": [["A", "«Repartir los cargos públicos según el apellido es una práctica injusta».", "El autor estaría de acuerdo: el párrafo 1 presenta la meritocracia como una conquista frente a ese tipo de prácticas.", false], ["B", "«Quien no consigue empleo es porque no se esforzó lo suficiente».", "El párrafo 4 critica justamente la creencia de que «quien fracasa también se lo merece», porque olvida las ventajas y desventajas recibidas.", true], ["C", "«Una educación pública de calidad desde la infancia amplía las oportunidades de competir».", "El autor estaría de acuerdo: es una de las medidas que propone en el párrafo 5.", false], ["D", "«El esfuerzo cuenta, pero no explica por sí solo el éxito de una persona».", "El autor estaría de acuerdo: el resultado mezcla lo que la persona hizo con lo que le tocó (párrafo 3).", false]]}]}, {"comp": "lectura_critica", "sim": "pro-2", "ind": "Crónica sobre la restauración del mural de una iglesia", "tt": "Texto informativo", "texto": "(1) La primera vez que Lucía Ortega subió al andamio de la iglesia de San Roque, en un pueblo del altiplano, el mural del ábside era apenas una mancha parda con algunas sombras que podían ser manos o nubes. Los vecinos lo llamaban «el cuadro oscuro», y muchos no sabían que debajo del hollín de dos siglos de velas había figuras.\n\n(2) Han pasado catorce meses. Lucía trabaja de siete de la mañana a cuatro de la tarde, con una lámpara en la frente y un estuche de bisturíes que parece de cirujana. Avanza a un ritmo que desespera a los visitantes: en una buena semana limpia una superficie del tamaño de una hoja de cuaderno. «Si me apuro, me llevo la pintura con la mugre», explica sin bajar la mirada.\n\n(3) A medida que el hollín cede, aparecen detalles que nadie esperaba. En una esquina, entre los santos, el pintor anónimo incluyó a un campesino con ruana que carga un bulto de papa. En otra, una mujer amamanta a un niño junto a un perro flaco. Los historiadores que han visitado la obra creen que el artista retrató a personas del pueblo, algo poco común en la pintura religiosa de su época.\n\n(4) No todos están contentos. Algunos fieles extrañan el templo en penumbra y se quejan de que el andamio les tapa la vista del altar desde hace más de un año. El párroco ha tenido que celebrar misa con un rumor de protesta al fondo. Otros, en cambio, suben los domingos por la tarde, con permiso, a buscar en las figuras parecidos con sus abuelos.\n\n(5) Lucía no opina sobre esas disputas. Dice que su trabajo no es decidir qué debe significar el mural, sino devolverle la posibilidad de significar algo. Cuando termine, si el dinero de la gobernación alcanza, el pueblo tendrá frente a sí una pintura que nadie vivo ha visto completa. Lo que haga con ella ya no será asunto de la restauradora.", "vis": "", "items": [{"id": "LCP-159", "niv": 1, "cp": "lc_local", "e": "Según la crónica, Lucía trabaja tan despacio porque", "f": "Texto original elaborado para este simulacro, párrafo 2", "vis": "", "o": [["A", "espera que los historiadores le indiquen qué figuras debe limpiar primero.", "El texto no dice que dependa de instrucciones de los historiadores.", false], ["B", "la gobernación solo le paga por unas pocas horas de trabajo a la semana.", "El texto dice que trabaja de siete a cuatro; el dinero de la gobernación se menciona como incierto, no como causa de la lentitud.", false], ["C", "los fieles le impiden subir al andamio durante la semana.", "Los fieles se quejan del andamio, pero no impiden el trabajo.", false], ["D", "si se apresura, podría retirar la pintura junto con la suciedad.", "Ella lo explica: «Si me apuro, me llevo la pintura con la mugre».", true]]}, {"id": "LCP-160", "niv": 2, "cp": "lc_global", "e": "Según el párrafo 3, el campesino con ruana y la mujer que amamanta a un niño llevan a los historiadores a pensar que", "f": "Texto original elaborado para este simulacro, párrafo 3", "vis": "", "o": [["A", "el mural fue pintado mucho después de lo que se creía.", "El texto no plantea ninguna discusión sobre la fecha del mural.", false], ["B", "Lucía añadió figuras nuevas al mural durante la restauración.", "Las figuras «aparecen» al retirar el hollín; no son añadidas por la restauradora.", false], ["C", "el pintor incluyó a habitantes del pueblo en una obra religiosa.", "El párrafo 3 dice que los historiadores «creen que el artista retrató a personas del pueblo, algo poco común en la pintura religiosa de su época».", true], ["D", "los santos originales fueron borrados y reemplazados por escenas de la vida cotidiana.", "Las figuras aparecen «entre los santos»; nada indica que los santos fueran borrados.", false]]}, {"id": "LCP-161", "niv": 2, "cp": "lc_global", "e": "¿Qué muestra el párrafo 4 sobre la relación entre la comunidad y la restauración?", "f": "Texto original elaborado para este simulacro, párrafo 4", "vis": "", "o": [["A", "La restauración despierta reacciones distintas entre los habitantes del pueblo.", "El párrafo contrasta a quienes se quejan del andamio y extrañan la penumbra con quienes suben a buscar parecidos con sus abuelos («Otros, en cambio…»).", true], ["B", "La mayoría de los fieles se opone a la restauración porque prefiere el templo en penumbra.", "El texto habla de «algunos fieles» sin indicar que sean mayoría, y menciona a otros que suben a mirar las figuras.", false], ["C", "El párroco decidió suspender las misas hasta que termine la restauración del mural.", "El párroco sigue celebrando misa, aunque con un rumor de protesta.", false], ["D", "La comunidad exigió que la gobernación retirara el dinero destinado al proyecto.", "No se menciona ninguna exigencia de ese tipo.", false]]}, {"id": "LCP-162", "niv": 3, "cp": "lc_reflexion", "e": "Lucía afirma que su trabajo no es decidir qué debe significar el mural, «sino devolverle la posibilidad de significar algo». Esta afirmación implica que ella", "f": "Texto original elaborado para este simulacro, párrafo 5", "vis": "", "o": [["A", "considera que el mural carece de valor artístico y que solo interesa a los historiadores.", "Nada indica que Lucía desprecie la obra; dedica catorce meses a recuperarla con sumo cuidado.", false], ["B", "piensa que la comunidad del pueblo no está preparada para interpretar una obra de arte.", "Al contrario: deja la interpretación en manos del pueblo («Lo que haga con ella ya no será asunto de la restauradora»).", false], ["C", "cree que los historiadores son quienes deben decidir el significado definitivo del mural.", "No atribuye esa decisión a los historiadores; el texto dice que será asunto del pueblo.", false], ["D", "concibe su labor como recuperar la obra para que otros la interpreten, sin imponerle un sentido.", "Distingue entre dar un significado y hacer posible que la obra signifique: limpia el mural para que la comunidad decida qué hace con él.", true]]}]}, {"comp": "lectura_critica", "sim": "pro-2", "ind": "Texto argumentativo sobre los subsidios al precio del agua", "tt": "Texto informativo", "texto": "(1) En muchas ciudades, el agua que sale del grifo cuesta menos que lo que cuesta llevarla hasta allí. La diferencia la cubren subsidios, y la justificación parece obvia: el agua es un bien esencial y nadie debería quedarse sin ella por no poder pagarla. Sin embargo, la forma en que se subsidia el agua a menudo produce lo contrario de lo que promete.\n\n(2) Cuando el precio de cada metro cúbico es bajo para todos, el subsidio beneficia más a quien más consume. Y quienes más consumen no suelen ser los hogares pobres, sino las casas con jardín, piscina o varios baños. Un subsidio general al precio es, en la práctica, un descuento proporcional al tamaño de la vivienda.\n\n(3) Además, el precio bajo envía una señal equivocada. Si el agua parece barata, hay pocos incentivos para reparar una fuga, cambiar un sanitario antiguo o regar de noche en lugar de al mediodía. En temporadas secas, cuando los embalses bajan, las empresas terminan recurriendo a racionamientos que afectan por igual a quien derrochó y a quien cuidó.\n\n(4) Una alternativa usada en distintos lugares es la tarifa por bloques. Los primeros metros cúbicos del mes, suficientes para beber, cocinar y asearse, se cobran a un precio muy bajo o incluso nulo; a partir de cierto consumo, el precio sube de manera escalonada. Así se protege el consumo básico de todos sin regalar el consumo suntuario de algunos.\n\n(5) Esta solución no está libre de problemas. En los inquilinatos, donde varias familias comparten un mismo contador, el consumo conjunto puede superar rápidamente el bloque básico y hacer que hogares pobres paguen tarifas altas. Por eso la tarifa por bloques debe acompañarse de medidores individuales o de ajustes según el número de personas por vivienda.\n\n(6) El objetivo no es encarecer el agua, sino dejar de subsidiar el desperdicio. Un bien esencial merece una política que distinga entre la necesidad y el lujo.", "vis": "", "items": [{"id": "LCP-163", "niv": 1, "cp": "lc_local", "e": "Según el párrafo 4, la tarifa por bloques consiste en", "f": "Texto original elaborado para este simulacro, párrafo 4", "vis": "", "o": [["A", "dividir la ciudad en bloques y racionar el agua por turnos.", "Confunde «bloques» de consumo con sectores de la ciudad; los racionamientos se mencionan en el párrafo 3 como un problema.", false], ["B", "un precio mínimo o nulo para el consumo básico del mes y precios crecientes para lo que lo supere.", "El párrafo 4 explica que los primeros metros cúbicos, suficientes para lo básico, se cobran a precio muy bajo o nulo, y que luego el precio sube de manera escalonada.", true], ["C", "cobrar el mismo precio por cada metro cúbico, sin importar cuánto consuma el hogar.", "Eso describe el esquema que el autor critica; en la tarifa por bloques el precio cambia según el consumo.", false], ["D", "cobrar más caro el agua durante las temporadas secas y más barato en las lluviosas.", "El texto no vincula los bloques con las temporadas del año.", false]]}, {"id": "LCP-164", "niv": 2, "cp": "lc_global", "e": "El autor afirma que un subsidio general al precio del agua es «un descuento proporcional al tamaño de la vivienda» porque", "f": "Texto original elaborado para este simulacro, párrafo 2", "vis": "", "o": [["A", "las viviendas pequeñas reciben un subsidio menor por cada metro cúbico que consumen.", "El subsidio por metro cúbico es igual para todos («el precio de cada metro cúbico es bajo para todos»); la diferencia está en el total, que crece con el consumo.", false], ["B", "al abaratar cada metro cúbico, favorece más a quien más consume, y suelen consumir más las viviendas grandes.", "El párrafo 2 explica que el subsidio «beneficia más a quien más consume» y que quienes más consumen son las casas con jardín, piscina o varios baños.", true], ["C", "las viviendas grandes pagan una tarifa por metro cúbico menor que la de las pequeñas, según la escala definida por la empresa.", "El texto dice que el precio bajo es igual para todos; el beneficio mayor de las viviendas grandes viene de que consumen más, no de una tarifa distinta.", false], ["D", "el valor de los subsidios se calcula a partir del número de habitaciones de cada vivienda.", "El texto no dice que el subsidio se calcule así; habla de un precio bajo por metro cúbico para todos.", false]]}, {"id": "LCP-165", "niv": 3, "cp": "lc_global", "e": "¿Qué función cumple el párrafo 5 en la argumentación?", "f": "Texto original elaborado para este simulacro, párrafo 5", "vis": "", "o": [["A", "Reconoce una limitación de la propuesta y plantea cómo corregirla.", "El párrafo admite que la tarifa por bloques puede perjudicar a familias que comparten contador y propone medidores individuales o ajustes por número de personas.", true], ["B", "Introduce la tesis principal del texto, que luego se resume en el párrafo 6.", "La tesis aparece desde el párrafo 1; el párrafo 5 discute un problema de la propuesta del párrafo 4.", false], ["C", "Presenta un caso que muestra que la tarifa por bloques beneficia especialmente a los inquilinatos.", "El caso de los inquilinatos muestra lo contrario: el riesgo de que hogares pobres paguen tarifas altas.", false], ["D", "Abandona la tarifa por bloques y la reemplaza por una nueva propuesta, la de los medidores individuales.", "Los medidores no reemplazan la tarifa por bloques: la acompañan («debe acompañarse de…»).", false]]}, {"id": "LCP-166", "niv": 2, "cp": "lc_reflexion", "e": "En el párrafo 3, el autor afirma que «el precio bajo envía una señal equivocada». Este argumento supone que", "f": "Texto original elaborado para este simulacro, párrafo 3", "vis": "", "o": [["A", "los racionamientos son inevitables, cualquiera que sea el precio que se cobre por el agua.", "El autor sugiere lo contrario: un mejor precio podría reducir el desperdicio que lleva a los racionamientos.", false], ["B", "las empresas de acueducto no hacen mantenimiento a sus redes.", "El párrafo habla de las fugas y sanitarios de los hogares, no del mantenimiento de las empresas.", false], ["C", "los hogares pobres desperdician más agua que los hogares con más ingresos.", "El párrafo 2 indica que quienes más consumen suelen ser las viviendas grandes.", false], ["D", "el precio del agua influye en las decisiones de consumo y de cuidado de los hogares.", "Para que un precio bajo desestimule reparar fugas o cambiar sanitarios, hay que suponer que los hogares ajustan su conducta según lo que pagan.", true]]}, {"id": "LCP-167", "niv": 3, "cp": "lc_reflexion", "e": "¿Cuál de los siguientes hallazgos debilitaría más el argumento del párrafo 3?", "f": "Texto original elaborado para este simulacro, párrafo 3", "vis": "", "o": [["A", "En las temporadas secas, el nivel de los embalses baja y aumentan los racionamientos.", "Este hecho coincide con lo que el mismo párrafo describe; no lo debilita.", false], ["B", "Algunos hogares reparan sus fugas apenas sube el valor de la factura del agua.", "Este hallazgo apoya el argumento: muestra que el precio sí influye en el cuidado del agua.", false], ["C", "Un estudio muestra que el consumo de los hogares casi no cambia cuando sube el precio del agua.", "Si el consumo no responde al precio, la idea de que un precio bajo «envía una señal equivocada» que fomenta el desperdicio pierde fuerza.", true], ["D", "Las casas con jardín y piscina consumen más agua que los apartamentos pequeños.", "Este hallazgo respalda el párrafo 2; no afecta la idea de que el precio orienta el consumo.", false]]}]}, {"comp": "lectura_critica", "sim": "pro-2", "ind": "Guía de separación de residuos en un campus", "tt": "Texto discontinuo", "texto": "GUÍA DE SEPARACIÓN DE RESIDUOS · Puntos ecológicos del campus (universidad ficticia)\n\nDesde 2021, en Colombia se usa un código nacional de tres colores para separar los residuos en la fuente. Esta guía adapta ese código a los puntos ecológicos del campus.\n\nRecuerde: los residuos aprovechables deben depositarse limpios y secos. Un envase con restos de comida o de bebida contamina el contenido de toda la caneca blanca.\n\nPilas, baterías, bombillos y aparatos electrónicos no van en ninguna de las tres canecas: llévelos al punto de recolección de la biblioteca.", "vis": "<table class=\"vt\"><caption>Tabla 1. ¿Qué va en cada caneca?<\/caption><thead><tr><th>Caneca<\/th><th>Tipo de residuo<\/th><th>Ejemplos<\/th><th>No depositar aquí<\/th><\/tr><\/thead><tbody><tr><td>Blanca<\/td><td>Aprovechables<\/td><td>Botellas plásticas, latas, frascos de vidrio, papel y cartón limpios y secos<\/td><td>Servilletas usadas, cajas de pizza con grasa<\/td><\/tr><tr><td>Negra<\/td><td>No aprovechables<\/td><td>Servilletas y papel higiénico usados, empaques metalizados, papel o cartón con grasa<\/td><td>Restos de fruta, botellas limpias<\/td><\/tr><tr><td>Verde<\/td><td>Orgánicos aprovechables<\/td><td>Cáscaras de fruta, restos de verduras, residuos de café, hojas de poda<\/td><td>Envases, servilletas<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Guía elaborada para este simulacro con base en el código nacional de colores (Resolución 2184 de 2019).<\/div>", "items": [{"id": "LCP-168", "niv": 1, "cp": "lc_local", "e": "Según la guía, ¿dónde debe depositarse una servilleta usada?", "f": "Texto original elaborado para este simulacro, tabla 1", "vis": "", "o": [["A", "En la caneca negra, porque es un residuo no aprovechable.", "La fila de la caneca negra incluye entre sus ejemplos «Servilletas y papel higiénico usados».", true], ["B", "En el punto de recolección de la biblioteca.", "Ese punto es para pilas, baterías, bombillos y aparatos electrónicos.", false], ["C", "En la caneca verde, porque es de origen vegetal.", "La tabla incluye las servilletas en la columna «No depositar aquí» de la caneca verde.", false], ["D", "En la caneca blanca, porque el papel es aprovechable.", "La tabla indica que las servilletas usadas no se depositan en la caneca blanca.", false]]}, {"id": "LCP-169", "niv": 1, "cp": "lc_global", "e": "Un estudiante terminó una gaseosa y quiere desechar la botella plástica, que todavía tiene un poco de líquido. Según la guía, lo adecuado es", "f": "Texto original elaborado para este simulacro, texto de la guía y tabla 1", "vis": "", "o": [["A", "depositarla así en la caneca blanca, porque las botellas plásticas son aprovechables.", "El texto advierte que un envase con restos de bebida contamina el contenido de la caneca blanca.", false], ["B", "llevarla al punto de recolección de la biblioteca para que allí la separen.", "Ese punto recibe pilas, baterías, bombillos y aparatos electrónicos, no botellas.", false], ["C", "vaciarla y dejarla secar antes de depositarla en la caneca blanca.", "Las botellas plásticas van en la caneca blanca, pero «limpios y secos», según el texto y la tabla.", true], ["D", "depositarla en la caneca verde, porque contiene restos de una bebida.", "La tabla indica que los envases no se depositan en la caneca verde.", false]]}, {"id": "LCP-170", "niv": 2, "cp": "lc_reflexion", "e": "¿Por qué la guía insiste en que los residuos de la caneca blanca estén limpios y secos?", "f": "Texto original elaborado para este simulacro, texto de la guía", "vis": "", "o": [["A", "Porque los envases con restos de comida corresponden a la caneca verde.", "La tabla excluye los envases de la caneca verde; un envase sucio debe limpiarse para ir a la blanca.", false], ["B", "Porque los envases limpios ocupan menos espacio en las canecas del campus.", "La guía no habla del espacio; su razón es evitar la contaminación del material.", false], ["C", "Porque así lo exige el punto de recolección de la biblioteca para recibir los residuos.", "El punto de la biblioteca recibe residuos especiales; no tiene relación con la caneca blanca.", false], ["D", "Porque los restos de un envase dañan el resto del material que se puede reciclar.", "La guía dice que un envase con restos «contamina el contenido de toda la caneca blanca», que es la de residuos aprovechables; ensuciarlos impide aprovecharlos.", true]]}]}, {"comp": "razonamiento_cuantitativo", "sim": "pro-2", "ind": "Ventas de pan en dos semanas", "tt": "", "texto": "Una panadería de barrio registró cuántas unidades de pan vendió cada día, de lunes a sábado, durante dos semanas seguidas. La gráfica compara las ventas de las dos semanas.", "vis": "<div class=\"vfig\"><svg class=\"vg\" viewBox=\"0 0 560 320\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Gráfica 1. Unidades de pan vendidas por día\" font-family=\"Arial, sans-serif\" font-size=\"12\"><rect width=\"560\" height=\"320\" fill=\"#ffffff\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"13\" fill=\"#1d2433\">Gráfica 1. Unidades de pan vendidas por día<\/text><line x1=\"60\" y1=\"258.0\" x2=\"540\" y2=\"258.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"262.0\" text-anchor=\"end\" fill=\"#3a4356\">0<\/text><line x1=\"60\" y1=\"213.6\" x2=\"540\" y2=\"213.6\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"217.6\" text-anchor=\"end\" fill=\"#3a4356\">50<\/text><line x1=\"60\" y1=\"169.2\" x2=\"540\" y2=\"169.2\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"173.2\" text-anchor=\"end\" fill=\"#3a4356\">100<\/text><line x1=\"60\" y1=\"124.8\" x2=\"540\" y2=\"124.8\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"128.8\" text-anchor=\"end\" fill=\"#3a4356\">150<\/text><line x1=\"60\" y1=\"80.4\" x2=\"540\" y2=\"80.4\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"84.4\" text-anchor=\"end\" fill=\"#3a4356\">200<\/text><line x1=\"60\" y1=\"36.0\" x2=\"540\" y2=\"36.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"40.0\" text-anchor=\"end\" fill=\"#3a4356\">250<\/text><line x1=\"60\" y1=\"258\" x2=\"540\" y2=\"258\" stroke=\"#3a4356\"/><line x1=\"60\" y1=\"258\" x2=\"60\" y2=\"36\" stroke=\"#3a4356\"/><text transform=\"translate(14,147.0) rotate(-90)\" text-anchor=\"middle\" fill=\"#3a4356\">Unidades vendidas<\/text><text x=\"300.0\" y=\"312\" text-anchor=\"middle\" fill=\"#3a4356\">Día<\/text><text x=\"100.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Lun<\/text><text x=\"180.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Mar<\/text><text x=\"260.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Mié<\/text><text x=\"340.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Jue<\/text><text x=\"420.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Vie<\/text><text x=\"500.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Sáb<\/text><rect x=\"72.0\" y=\"147.0\" width=\"28.0\" height=\"111.0\" fill=\"#1660a8\"/><text x=\"86.0\" y=\"143.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">125<\/text><rect x=\"152.0\" y=\"138.1\" width=\"28.0\" height=\"119.9\" fill=\"#1660a8\"/><text x=\"166.0\" y=\"134.1\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">135<\/text><rect x=\"232.0\" y=\"164.8\" width=\"28.0\" height=\"93.2\" fill=\"#1660a8\"/><text x=\"246.0\" y=\"160.8\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">105<\/text><rect x=\"312.0\" y=\"129.2\" width=\"28.0\" height=\"128.8\" fill=\"#1660a8\"/><text x=\"326.0\" y=\"125.2\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">145<\/text><rect x=\"392.0\" y=\"98.2\" width=\"28.0\" height=\"159.8\" fill=\"#1660a8\"/><text x=\"406.0\" y=\"94.2\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">180<\/text><rect x=\"472.0\" y=\"71.5\" width=\"28.0\" height=\"186.5\" fill=\"#1660a8\"/><text x=\"486.0\" y=\"67.5\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">210<\/text><rect x=\"100.0\" y=\"142.6\" width=\"28.0\" height=\"115.4\" fill=\"#d9822b\"/><text x=\"114.0\" y=\"138.6\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">130<\/text><rect x=\"180.0\" y=\"147.0\" width=\"28.0\" height=\"111.0\" fill=\"#d9822b\"/><text x=\"194.0\" y=\"143.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">125<\/text><rect x=\"260.0\" y=\"133.7\" width=\"28.0\" height=\"124.3\" fill=\"#d9822b\"/><text x=\"274.0\" y=\"129.7\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">140<\/text><rect x=\"340.0\" y=\"115.9\" width=\"28.0\" height=\"142.1\" fill=\"#d9822b\"/><text x=\"354.0\" y=\"111.9\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">160<\/text><rect x=\"420.0\" y=\"93.7\" width=\"28.0\" height=\"164.3\" fill=\"#d9822b\"/><text x=\"434.0\" y=\"89.7\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">185<\/text><rect x=\"500.0\" y=\"36.0\" width=\"28.0\" height=\"222.0\" fill=\"#d9822b\"/><text x=\"514.0\" y=\"32.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">250<\/text><rect x=\"60\" y=\"286\" width=\"12\" height=\"12\" fill=\"#1660a8\"/><text x=\"76\" y=\"296\" fill=\"#1d2433\">Semana 1<\/text><rect x=\"142\" y=\"286\" width=\"12\" height=\"12\" fill=\"#d9822b\"/><text x=\"158\" y=\"296\" fill=\"#1d2433\">Semana 2<\/text><\/svg><\/div>", "items": [{"id": "RCP-201", "niv": 1, "cp": "rc_interpretacion", "e": "¿Qué día se presentó la mayor diferencia entre las ventas de las dos semanas?", "f": "Lectura de la gráfica.", "vis": "", "o": [["A", "El miércoles.", "El miércoles la diferencia fue de 35 unidades (105 frente a 140), menor que la del sábado.", false], ["B", "El sábado.", "El sábado se vendieron 210 y 250 unidades: una diferencia de 40, la mayor de la semana.", true], ["C", "El viernes.", "El viernes la diferencia fue de solo 5 unidades (180 frente a 185).", false], ["D", "El martes.", "El martes la diferencia fue de 10 unidades (135 frente a 125).", false]]}, {"id": "RCP-202", "niv": 1, "cp": "rc_interpretacion", "e": "¿Cuál es el rango de las ventas diarias de la semana 1?", "f": "Lectura de la gráfica.", "vis": "", "o": [["A", "85 unidades.", "Resta las ventas del lunes (125) al máximo; el rango se calcula con el valor mínimo, que fue el del miércoles (105).", false], ["B", "105 unidades.", "El rango es el dato mayor menos el menor: 210 − 105 = 105 unidades.", true], ["C", "150 unidades.", "150 es el promedio diario de la semana 1 (900 ÷ 6), no el rango.", false], ["D", "210 unidades.", "210 es la venta máxima de la semana 1; falta restarle la mínima.", false]]}, {"id": "RCP-203", "niv": 2, "cp": "rc_argumentacion", "e": "El administrador afirma: «En la semana 2 vendimos más pan que en la semana 1 todos los días». ¿Es correcta su afirmación?", "f": "Lectura de la gráfica.", "vis": "", "o": [["A", "Sí, porque el miércoles de la semana 2 se vendieron 35 unidades más que en la semana 1.", "Un día con más ventas no prueba que todos los días hayan sido mejores.", false], ["B", "Sí, porque la venta más alta de la semana 2 fue mayor que la de la semana 1.", "Que el día de mayor venta haya sido mejor no dice nada sobre los demás días.", false], ["C", "No, porque el viernes de la semana 2 se vendieron 180 unidades, menos que las 185 de la semana 1.", "Invierte los datos: el viernes de la semana 2 se vendieron 185 unidades y el de la semana 1, 180.", false], ["D", "No, porque el martes de la semana 2 se vendió menos que el de la semana 1.", "Basta un contraejemplo para refutar una afirmación sobre «todos los días»: el martes las ventas bajaron de 135 a 125 unidades.", true]]}, {"id": "RCP-204", "niv": 2, "cp": "rc_interpretacion", "e": "¿Qué días de la semana 1 las ventas estuvieron por encima del promedio diario de esa semana?", "f": "Cálculo propio a partir de los datos del caso.", "vis": "", "o": [["A", "Solo el sábado.", "El viernes (180 unidades) también supera el promedio de 150.", false], ["B", "El lunes, el martes y el miércoles.", "Esos días las ventas (125, 135 y 105) estuvieron por debajo del promedio.", false], ["C", "El viernes y el sábado.", "El promedio de la semana 1 es 900 ÷ 6 = 150 unidades; solo el viernes (180) y el sábado (210) lo superan.", true], ["D", "El jueves, el viernes y el sábado.", "El jueves se vendieron 145 unidades, por debajo del promedio de 150.", false]]}]}, {"comp": "razonamiento_cuantitativo", "sim": "pro-2", "ind": "Escalera apoyada en una pared", "tt": "", "texto": "Un pintor apoya una escalera de 5 m de longitud contra una pared vertical. El pie de la escalera queda sobre el piso horizontal, a 1,4 m de la base de la pared, como muestra la figura (no está a escala). La altura que alcanza la escalera sobre la pared se llama h.", "vis": "<div class=\"vfig\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 300 260\" font-family=\"Arial\" font-size=\"14\"><rect width=\"300\" height=\"260\" fill=\"#ffffff\"/><line x1=\"80\" y1=\"20\" x2=\"80\" y2=\"220\" stroke=\"#1d2433\" stroke-width=\"4\"/><line x1=\"40\" y1=\"220\" x2=\"280\" y2=\"220\" stroke=\"#1d2433\" stroke-width=\"2\"/><line x1=\"80\" y1=\"40\" x2=\"140\" y2=\"220\" stroke=\"#1d2433\" stroke-width=\"3\"/><text x=\"122\" y=\"120\" fill=\"#1d2433\">5 m<\/text><text x=\"110\" y=\"240\" text-anchor=\"middle\" fill=\"#1d2433\">1,4 m<\/text><text x=\"60\" y=\"135\" text-anchor=\"end\" fill=\"#1d2433\">h<\/text><text x=\"20\" y=\"34\" fill=\"#1d2433\">pared<\/text><\/svg><\/div>", "items": [{"id": "RCP-205", "niv": 2, "cp": "rc_formulacion", "e": "¿Qué altura alcanza la escalera sobre la pared?", "f": "Cálculo propio a partir de los datos del caso.", "vis": "", "o": [["A", "3,6 m.", "Resta las longitudes (5 − 1,4) en lugar de aplicar el teorema de Pitágoras.", false], ["B", "4,8 m.", "h = √(5² − 1,4²) = √(25 − 1,96) = √23,04 = 4,8 m.", true], ["C", "5,2 m.", "Suma los cuadrados: √(25 + 1,96) ≈ 5,2 m; además, un cateto no puede ser mayor que la hipotenusa (5 m).", false], ["D", "6,4 m.", "Suma las longitudes (5 + 1,4); la altura no puede superar la longitud de la escalera.", false]]}, {"id": "RCP-206", "niv": 3, "cp": "rc_argumentacion", "e": "Un ayudante afirma: «Si alejamos el pie de la escalera al doble de distancia de la pared (2,8 m), la escalera alcanzará la mitad de la altura». ¿Es correcta su afirmación?", "f": "Cálculo propio a partir de los datos del caso.", "vis": "", "o": [["A", "No, porque con el pie a 2,8 m la escalera alcanzaría unos 4,14 m de altura.", "Con el teorema de Pitágoras: √(5² − 2,8²) = √17,16 ≈ 4,14 m, muy lejos de la mitad de 4,8 m (2,4 m).", true], ["B", "Sí, porque la longitud de la escalera no cambia al moverla.", "Que la escalera mida siempre 5 m es cierto, pero eso no implica que la altura se reduzca a la mitad.", false], ["C", "Sí, porque la altura y la distancia del pie a la pared son inversamente proporcionales.", "Si fueran inversamente proporcionales, el producto sería constante: 1,4 × 4,8 = 6,72, pero 2,8 × 4,14 ≈ 11,6.", false], ["D", "No, porque la altura sería de 2,2 m, la diferencia entre 5 m y 2,8 m.", "Resta longitudes en lugar de aplicar el teorema de Pitágoras.", false]]}, {"id": "RCP-207", "niv": 1, "cp": "rc_interpretacion", "e": "Si el pie de la escalera se acerca a la pared, sin cambiar de escalera, ¿qué ocurre con la altura h que alcanza?", "f": "Teorema de Pitágoras y figura del caso.", "vis": "", "o": [["A", "Aumenta.", "La escalera sigue midiendo 5 m: si el cateto del piso disminuye, el de la pared debe aumentar para que h² + d² siga siendo 25.", true], ["B", "No cambia, porque la escalera sigue midiendo 5 m.", "La longitud no cambia, pero sí su inclinación, y con ella la altura que alcanza.", false], ["C", "Disminuye.", "Al acercar el pie, la escalera queda más vertical y llega más alto.", false], ["D", "Aumenta exactamente lo mismo que se acerque el pie.", "No es así: por ejemplo, si el pie pasa de 1,4 m a 0,7 m, la altura pasa de 4,8 m a unos 4,95 m, solo 0,15 m más.", false]]}]}, {"comp": "razonamiento_cuantitativo", "sim": "pro-2", "ind": "Proporciones en una receta", "tt": "", "texto": "La receta de unos panqueques indica las cantidades de la tabla para preparar 6 porciones.", "vis": "<table class=\"vt\"><caption>Tabla 1. Ingredientes para 6 porciones<\/caption><thead><tr><th>Ingrediente<\/th><th>Cantidad<\/th><\/tr><\/thead><tbody><tr><td>Harina<\/td><td>300 g<\/td><\/tr><tr><td>Huevos<\/td><td>4<\/td><\/tr><tr><td>Leche<\/td><td>450 ml<\/td><\/tr><tr><td>Azúcar<\/td><td>90 g<\/td><\/tr><\/tbody><\/table>", "items": [{"id": "RCP-208", "niv": 1, "cp": "rc_formulacion", "e": "¿Cuánta harina se necesita para preparar 15 porciones?", "f": "Cálculo propio a partir de los datos del caso.", "vis": "", "o": [["A", "450 g.", "Agrega solo la mitad de la harina (300 + 150), pero 15 porciones son 2,5 veces la receta.", false], ["B", "600 g.", "Duplica la receta: alcanzaría para 12 porciones, no para 15.", false], ["C", "750 g.", "15 porciones son 15 ÷ 6 = 2,5 veces la receta: 300 × 2,5 = 750 g.", true], ["D", "900 g.", "Triplica la receta: alcanzaría para 18 porciones.", false]]}, {"id": "RCP-209", "niv": 3, "cp": "rc_formulacion", "e": "Solo hay 6 huevos, pero los demás ingredientes alcanzan. Si se usan los 6 huevos y se mantienen las proporciones de la receta, ¿cuánta leche se necesita?", "f": "Cálculo propio a partir de los datos del caso.", "vis": "", "o": [["A", "300 ml.", "Invierte la razón: multiplica 450 por 4/6 en lugar de por 6/4.", false], ["B", "452 ml.", "Suma los 2 huevos adicionales a la cantidad de leche, en lugar de aumentar en la misma proporción.", false], ["C", "675 ml.", "Con 6 huevos en lugar de 4, la receta se multiplica por 6 ÷ 4 = 1,5: 450 × 1,5 = 675 ml (alcanza para 9 porciones).", true], ["D", "900 ml.", "Duplica la leche, como si los huevos se hubieran duplicado; 6 huevos son 1,5 veces 4.", false]]}, {"id": "RCP-210", "niv": 2, "cp": "rc_argumentacion", "e": "Marta observa que en la receta la razón entre la harina y el azúcar es de 10 a 3, y afirma que si usa 500 g de harina y 150 g de azúcar mantiene esa misma razón. ¿Es correcta su afirmación?", "f": "Tabla del caso.", "vis": "", "o": [["A", "Sí, porque en los dos casos hay más harina que azúcar.", "Que haya más harina que azúcar no basta: también ocurre con razones distintas, como 400 : 90.", false], ["B", "No, porque si agrega 200 g de harina debe agregar también 200 g de azúcar.", "Mantener una razón exige multiplicar las cantidades por el mismo factor, no sumarles la misma cantidad.", false], ["C", "No, porque la razón 300 : 90 es equivalente a 3 : 1.", "300/90 = 3,33…, que equivale a 10 : 3, no a 3 : 1.", false], ["D", "Sí, porque 300/90 y 500/150 son ambas iguales a 10/3.", "300/90 = 10/3 y 500/150 = 10/3: las dos razones son equivalentes.", true]]}]}, {"comp": "razonamiento_cuantitativo", "sim": "pro-2", "ind": "Fichas de colores en una bolsa", "tt": "", "texto": "En una actividad de un club juvenil se usa una bolsa con 10 fichas del mismo tamaño: 5 rojas, 3 azules y 2 verdes. Antes de la actividad, un grupo sacó una ficha al azar 100 veces, devolviéndola cada vez a la bolsa, y registró los resultados de la tabla.", "vis": "<table class=\"vt\"><caption>Tabla 1. Resultados de 100 extracciones con devolución<\/caption><thead><tr><th>Color<\/th><th>Número de veces<\/th><\/tr><\/thead><tbody><tr><td>Roja<\/td><td>52<\/td><\/tr><tr><td>Azul<\/td><td>27<\/td><\/tr><tr><td>Verde<\/td><td>21<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Fuente: datos ficticios.<\/div>", "items": [{"id": "RCP-213", "niv": 1, "cp": "rc_interpretacion", "e": "Según la tabla, ¿cuál fue la frecuencia relativa con la que salió una ficha azul?", "f": "Lectura de la tabla.", "vis": "", "o": [["A", "0,21", "0,21 es la frecuencia relativa de las fichas verdes.", false], ["B", "0,27", "Salió azul 27 veces en 100 extracciones: 27 ÷ 100 = 0,27.", true], ["C", "0,3", "0,3 es la probabilidad teórica de sacar azul (3 de 10), no la frecuencia observada en el experimento.", false], ["D", "0,52", "0,52 es la frecuencia relativa de las fichas rojas.", false]]}, {"id": "RCP-211", "niv": 3, "cp": "rc_formulacion", "e": "Si se sacan al azar dos fichas de la bolsa, una tras otra y sin devolver la primera, ¿cuál es la probabilidad de que las dos sean rojas?", "f": "Cálculo propio a partir de los datos del caso.", "vis": "", "o": [["A", "4/9.", "4/9 es solo la probabilidad de que la segunda sea roja cuando la primera ya lo fue; falta multiplicar por 5/10.", false], ["B", "1/4.", "Calcula 1/2 × 1/2, como si la primera ficha se devolviera a la bolsa.", false], ["C", "1/5.", "Resulta de 2/10: toma las dos fichas como casos favorables sobre 10, sin considerar los colores.", false], ["D", "2/9.", "La primera es roja con probabilidad 5/10; quedan 4 rojas de 9, así que la segunda lo es con 4/9: 5/10 × 4/9 = 20/90 = 2/9.", true]]}, {"id": "RCP-212", "niv": 2, "cp": "rc_argumentacion", "e": "Tomás afirma: «Como en la bolsa hay tres colores, la probabilidad de sacar una ficha verde es 1/3». ¿Es correcta su afirmación?", "f": "Cálculo propio a partir de los datos del caso.", "vis": "", "o": [["A", "No, porque hay 2 fichas verdes de 10, así que la probabilidad de sacar verde es 1/5.", "La probabilidad clásica cuenta fichas, no colores: 2 casos favorables de 10 posibles, 2/10 = 1/5.", true], ["B", "No, porque en el experimento salió verde 21 veces de 100, así que la probabilidad es exactamente 21/100.", "La frecuencia relativa de un experimento se aproxima a la probabilidad, pero no es exactamente igual a ella.", false], ["C", "Sí, porque en el experimento salieron fichas de los tres colores.", "Que los tres colores aparezcan no significa que tengan la misma probabilidad.", false], ["D", "Sí, porque cada color es uno de los tres resultados posibles.", "Los colores no son resultados igualmente probables, pues no hay la misma cantidad de fichas de cada uno.", false]]}]}, {"comp": "razonamiento_cuantitativo", "sim": "pro-2", "ind": "Temperatura y altitud", "tt": "", "texto": "Un grupo de estudiantes registró la temperatura promedio al mediodía en varios lugares de una misma región ubicados a distintas altitudes. La gráfica resume sus datos; en ese rango de altitudes, la temperatura disminuye de manera uniforme a medida que aumenta la altitud.", "vis": "<div class=\"vfig\"><svg class=\"vg\" viewBox=\"0 0 560 320\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Gráfica 1. Temperatura promedio según la altitud\" font-family=\"Arial, sans-serif\" font-size=\"12\"><rect width=\"560\" height=\"320\" fill=\"#ffffff\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"13\" fill=\"#1d2433\">Gráfica 1. Temperatura promedio según la altitud<\/text><line x1=\"60\" y1=\"258.0\" x2=\"540\" y2=\"258.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"262.0\" text-anchor=\"end\" fill=\"#3a4356\">0<\/text><line x1=\"60\" y1=\"221.0\" x2=\"540\" y2=\"221.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"225.0\" text-anchor=\"end\" fill=\"#3a4356\">5<\/text><line x1=\"60\" y1=\"184.0\" x2=\"540\" y2=\"184.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"188.0\" text-anchor=\"end\" fill=\"#3a4356\">10<\/text><line x1=\"60\" y1=\"147.0\" x2=\"540\" y2=\"147.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"151.0\" text-anchor=\"end\" fill=\"#3a4356\">15<\/text><line x1=\"60\" y1=\"110.0\" x2=\"540\" y2=\"110.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"114.0\" text-anchor=\"end\" fill=\"#3a4356\">20<\/text><line x1=\"60\" y1=\"73.0\" x2=\"540\" y2=\"73.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"77.0\" text-anchor=\"end\" fill=\"#3a4356\">25<\/text><line x1=\"60\" y1=\"36.0\" x2=\"540\" y2=\"36.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"40.0\" text-anchor=\"end\" fill=\"#3a4356\">30<\/text><line x1=\"60\" y1=\"258\" x2=\"540\" y2=\"258\" stroke=\"#3a4356\"/><line x1=\"60\" y1=\"258\" x2=\"60\" y2=\"36\" stroke=\"#3a4356\"/><text transform=\"translate(14,147.0) rotate(-90)\" text-anchor=\"middle\" fill=\"#3a4356\">Temperatura (°C)<\/text><text x=\"300.0\" y=\"312\" text-anchor=\"middle\" fill=\"#3a4356\">Altitud (m)<\/text><text x=\"120.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">0<\/text><text x=\"240.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">1.000<\/text><text x=\"360.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">2.000<\/text><text x=\"480.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">3.000<\/text><polyline fill=\"none\" stroke=\"#1660a8\" stroke-width=\"2.5\" points=\"120.0,50.8 240.0,95.2 360.0,139.6 480.0,184.0\"/><circle cx=\"120.0\" cy=\"50.8\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"120.0\" y=\"42.8\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight
