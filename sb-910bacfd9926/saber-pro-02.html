 refiere a la conectividad.", false], ["C", "En el presupuesto de la Secretaría, que tendría que contratar más docentes para atender cada una de las 14 sedes rurales.", "La madre no habla del presupuesto, y la medida implica cerrar las sedes, no contratar más docentes para ellas.", false], ["D", "En los resultados de las pruebas del departamento vecino.", "Esos resultados los menciona el secretario y no dependen de esta medida.", false]]}]}, {"comp": "ingles", "sim": "pro-2", "ind": "Instrumentos musicales", "tt": "", "texto": "Read the descriptions of some musical instruments. Which word (A–H) matches each description?\n\nA. drum   B. flute   C. guitar   D. harp   E. piano   F. saxophone   G. trumpet   H. violin\n\nExample: You hit this with sticks or with your hands. Answer: A (drum).\n\nEach word can be used only once. The word in the example is not used again, and two words are not used at all.", "vis": "", "items": [{"id": "EN2-101", "niv": 1, "cp": "en_p1", "e": "This big instrument has black and white keys. You usually sit on a small seat to play it.", "f": "Texto original elaborado para este simulacro, lista de palabras de la parte 1", "vis": "", "o": [["A", "drum", "«drum» (tambor) es la palabra del ejemplo y no se vuelve a usar; además, se golpea con baquetas o con las manos, no un instrumento grande con teclas blancas y negras.", false], ["B", "flute", "«flute» (flauta): es un instrumento largo y delgado que se sostiene de lado y se toca soplando sobre un orificio; la descripción, en cambio, habla de un instrumento grande con teclas blancas y negras.", false], ["C", "guitar", "«guitar» (guitarra): tiene seis cuerdas y se toca a menudo en fiestas o alrededor de una fogata; la descripción, en cambio, habla de un instrumento grande con teclas blancas y negras.", false], ["D", "harp", "«harp» (arpa): es un instrumento alto que se apoya en el piso y tiene muchas cuerdas que se tocan con los dedos de ambas manos; la descripción, en cambio, habla de un instrumento grande con teclas blancas y negras.", false], ["E", "piano", "Correcta. «piano» (piano): «black and white keys» (teclas blancas y negras) y «sit on a small seat» (sentarse en un banquito) describen el piano.", true], ["F", "saxophone", "«saxophone» (saxofón): es un instrumento de viento de metal que se toca soplando por una boquilla; no corresponde a ninguna de las descripciones; la descripción, en cambio, habla de un instrumento grande con teclas blancas y negras.", false], ["G", "trumpet", "«trumpet» (trompeta): es un instrumento de viento de metal con pistones; no corresponde a ninguna de las descripciones; la descripción, en cambio, habla de un instrumento grande con teclas blancas y negras.", false], ["H", "violin", "«violin» (violín): se apoya bajo la barbilla y se toca con un arco; la descripción, en cambio, habla de un instrumento grande con teclas blancas y negras.", false]]}, {"id": "EN2-102", "niv": 1, "cp": "en_p1", "e": "This has six strings. People often play it at parties or around a campfire.", "f": "Texto original elaborado para este simulacro, lista de palabras de la parte 1", "vis": "", "o": [["A", "drum", "«drum» (tambor) es la palabra del ejemplo y no se vuelve a usar; además, se golpea con baquetas o con las manos, no un instrumento de seis cuerdas.", false], ["B", "flute", "«flute» (flauta): es un instrumento largo y delgado que se sostiene de lado y se toca soplando sobre un orificio; la descripción, en cambio, habla de un instrumento de seis cuerdas.", false], ["C", "guitar", "Correcta. «guitar» (guitarra): «six strings» (seis cuerdas) y «around a campfire» (alrededor de una fogata) describen la guitarra; el violín tiene cuatro cuerdas y el arpa muchas más.", true], ["D", "harp", "«harp» (arpa): es un instrumento alto que se apoya en el piso y tiene muchas cuerdas que se tocan con los dedos de ambas manos; la descripción, en cambio, habla de un instrumento de seis cuerdas.", false], ["E", "piano", "«piano» (piano): es un instrumento grande de teclas blancas y negras que se toca sentado; la descripción, en cambio, habla de un instrumento de seis cuerdas.", false], ["F", "saxophone", "«saxophone» (saxofón): es un instrumento de viento de metal que se toca soplando por una boquilla; no corresponde a ninguna de las descripciones; la descripción, en cambio, habla de un instrumento de seis cuerdas.", false], ["G", "trumpet", "«trumpet» (trompeta): es un instrumento de viento de metal con pistones; no corresponde a ninguna de las descripciones; la descripción, en cambio, habla de un instrumento de seis cuerdas.", false], ["H", "violin", "«violin» (violín): se apoya bajo la barbilla y se toca con un arco; la descripción, en cambio, habla de un instrumento de seis cuerdas.", false]]}, {"id": "EN2-103", "niv": 1, "cp": "en_p1", "e": "You hold this under your chin and play it with a bow.", "f": "Texto original elaborado para este simulacro, lista de palabras de la parte 1", "vis": "", "o": [["A", "drum", "«drum» (tambor) es la palabra del ejemplo y no se vuelve a usar; además, se golpea con baquetas o con las manos, no un instrumento que se pone bajo la barbilla y se toca con arco.", false], ["B", "flute", "«flute» (flauta): es un instrumento largo y delgado que se sostiene de lado y se toca soplando sobre un orificio; la descripción, en cambio, habla de un instrumento que se pone bajo la barbilla y se toca con arco.", false], ["C", "guitar", "«guitar» (guitarra): tiene seis cuerdas y se toca a menudo en fiestas o alrededor de una fogata; la descripción, en cambio, habla de un instrumento que se pone bajo la barbilla y se toca con arco.", false], ["D", "harp", "«harp» (arpa): es un instrumento alto que se apoya en el piso y tiene muchas cuerdas que se tocan con los dedos de ambas manos; la descripción, en cambio, habla de un instrumento que se pone bajo la barbilla y se toca con arco.", false], ["E", "piano", "«piano» (piano): es un instrumento grande de teclas blancas y negras que se toca sentado; la descripción, en cambio, habla de un instrumento que se pone bajo la barbilla y se toca con arco.", false], ["F", "saxophone", "«saxophone» (saxofón): es un instrumento de viento de metal que se toca soplando por una boquilla; no corresponde a ninguna de las descripciones; la descripción, en cambio, habla de un instrumento que se pone bajo la barbilla y se toca con arco.", false], ["G", "trumpet", "«trumpet» (trompeta): es un instrumento de viento de metal con pistones; no corresponde a ninguna de las descripciones; la descripción, en cambio, habla de un instrumento que se pone bajo la barbilla y se toca con arco.", false], ["H", "violin", "Correcta. «violin» (violín): «under your chin» (bajo la barbilla) y «with a bow» (con un arco) describen el violín.", true]]}, {"id": "EN2-104", "niv": 1, "cp": "en_p1", "e": "This is long and thin. You hold it to one side of your mouth and blow across a small hole.", "f": "Texto original elaborado para este simulacro, lista de palabras de la parte 1", "vis": "", "o": [["A", "drum", "«drum» (tambor) es la palabra del ejemplo y no se vuelve a usar; además, se golpea con baquetas o con las manos, no un instrumento largo y delgado que se sopla de lado sobre un orificio.", false], ["B", "flute", "Correcta. «flute» (flauta): «long and thin» (largo y delgado) y «blow across a small hole» (soplar sobre un orificio pequeño), sosteniéndolo a un lado de la boca, describen la flauta traversa; el saxofón y la trompeta se tocan soplando dentro de una boquilla, de frente.", true], ["C", "guitar", "«guitar» (guitarra): tiene seis cuerdas y se toca a menudo en fiestas o alrededor de una fogata; la descripción, en cambio, habla de un instrumento largo y delgado que se sopla de lado sobre un orificio.", false], ["D", "harp", "«harp» (arpa): es un instrumento alto que se apoya en el piso y tiene muchas cuerdas que se tocan con los dedos de ambas manos; la descripción, en cambio, habla de un instrumento largo y delgado que se sopla de lado sobre un orificio.", false], ["E", "piano", "«piano» (piano): es un instrumento grande de teclas blancas y negras que se toca sentado; la descripción, en cambio, habla de un instrumento largo y delgado que se sopla de lado sobre un orificio.", false], ["F", "saxophone", "«saxophone» (saxofón): es un instrumento de viento de metal que se toca soplando por una boquilla; no corresponde a ninguna de las descripciones; la descripción, en cambio, habla de un instrumento largo y delgado que se sopla de lado sobre un orificio.", false], ["G", "trumpet", "«trumpet» (trompeta): es un instrumento de viento de metal con pistones; no corresponde a ninguna de las descripciones; la descripción, en cambio, habla de un instrumento largo y delgado que se sopla de lado sobre un orificio.", false], ["H", "violin", "«violin» (violín): se apoya bajo la barbilla y se toca con un arco; la descripción, en cambio, habla de un instrumento largo y delgado que se sopla de lado sobre un orificio.", false]]}, {"id": "EN2-105", "niv": 2, "cp": "en_p1", "e": "This tall instrument stands on the floor next to the musician, who plays its many strings with the fingers of both hands.", "f": "Texto original elaborado para este simulacro, lista de palabras de la parte 1", "vis": "", "o": [["A", "drum", "«drum» (tambor) es la palabra del ejemplo y no se vuelve a usar; además, se golpea con baquetas o con las manos, no un instrumento alto, apoyado en el piso, con muchas cuerdas que se pulsan con las dos manos.", false], ["B", "flute", "«flute» (flauta): es un instrumento largo y delgado que se sostiene de lado y se toca soplando sobre un orificio; la descripción, en cambio, habla de un instrumento alto, apoyado en el piso, con muchas cuerdas que se pulsan con las dos manos.", false], ["C", "guitar", "«guitar» (guitarra): tiene seis cuerdas y se toca a menudo en fiestas o alrededor de una fogata; la descripción, en cambio, habla de un instrumento alto, apoyado en el piso, con muchas cuerdas que se pulsan con las dos manos.", false], ["D", "harp", "Correcta. «harp» (arpa): «tall instrument» (instrumento alto) que «stands on the floor» (se apoya en el piso) y cuyas «many strings» (muchas cuerdas) se tocan con los dedos de las dos manos es el arpa.", true], ["E", "piano", "«piano» (piano): es un instrumento grande de teclas blancas y negras que se toca sentado; la descripción, en cambio, habla de un instrumento alto, apoyado en el piso, con muchas cuerdas que se pulsan con las dos manos.", false], ["F", "saxophone", "«saxophone» (saxofón): es un instrumento de viento de metal que se toca soplando por una boquilla; no corresponde a ninguna de las descripciones; la descripción, en cambio, habla de un instrumento alto, apoyado en el piso, con muchas cuerdas que se pulsan con las dos manos.", false], ["G", "trumpet", "«trumpet» (trompeta): es un instrumento de viento de metal con pistones; no corresponde a ninguna de las descripciones; la descripción, en cambio, habla de un instrumento alto, apoyado en el piso, con muchas cuerdas que se pulsan con las dos manos.", false], ["H", "violin", "«violin» (violín): se apoya bajo la barbilla y se toca con un arco; la descripción, en cambio, habla de un instrumento alto, apoyado en el piso, con muchas cuerdas que se pulsan con las dos manos.", false]]}]}, {"comp": "ingles", "sim": "pro-2", "ind": "Avisos en lugares de viaje, cultura y deporte", "tt": "", "texto": "Read each notice. Where can you see it? Choose the correct place.", "vis": "", "items": [{"id": "EN2-106", "niv": 1, "cp": "en_p2", "e": "\"Please do not touch the instruments. You can take photos, but without flash.\"\n\nWhere can you see this notice?", "f": "Texto original elaborado para este simulacro, aviso de la parte 2", "vis": "", "o": [["A", "in a swimming pool", "En una piscina los avisos hablan de nadar, ducharse o no correr; no de no tocar instrumentos.", false], ["B", "at a bus stop", "En un paradero de bus no hay instrumentos en exhibición ni reglas sobre fotos con flash.", false], ["C", "in a museum", "Correcta. «Do not touch the instruments» (no toque los instrumentos) y «photos without flash» (fotos sin flash) son normas típicas de un museo, aquí uno con instrumentos en exhibición.", true]]}, {"id": "EN2-107", "niv": 1, "cp": "en_p2", "e": "\"Buy your ticket before you get on. The driver does not sell tickets.\"\n\nWhere can you see this notice?", "f": "Texto original elaborado para este simulacro, aviso de la parte 2", "vis": "", "o": [["A", "in a bank", "En un banco no hay conductor ni se «sube» a nada; «get on» se usa con vehículos.", false], ["B", "at a bus stop", "Correcta. «Get on» (subirse a un vehículo) y «the driver» (el conductor) indican que el aviso está donde se espera el bus.", true], ["C", "in a cinema", "En un cine se compran boletos, pero no hay conductor ni uno «se sube» (get on) a la sala.", false]]}, {"id": "EN2-108", "niv": 1, "cp": "en_p2", "e": "\"Tennis courts must be booked one day in advance. Rackets can be hired at reception.\"\n\nWhere can you see this notice?", "f": "Texto original elaborado para este simulacro, aviso de la parte 2", "vis": "", "o": [["A", "at a sports centre", "Correcta. «Tennis courts» (canchas de tenis) que se reservan («booked») y raquetas que se alquilan («hired») en la recepción corresponden a un centro deportivo.", true], ["B", "in a car park", "En un parqueadero no hay canchas ni recepción donde alquilar raquetas.", false], ["C", "in a bookshop", "Una librería no tiene canchas de tenis ni alquila raquetas; no confunda «booked» (reservado) con «book» (libro).", false]]}, {"id": "EN2-109", "niv": 1, "cp": "en_p2", "e": "\"Room 12 is closed today. Today's guitar class is in Room 5.\"\n\nWhere can you see this notice?", "f": "Texto original elaborado para este simulacro, aviso de la parte 2", "vis": "", "o": [["A", "at a petrol station", "En una estación de gasolina no se dictan clases de guitarra.", false], ["B", "at a music school", "Correcta. Un aviso sobre salones («Room 12», «Room 5») y una «guitar class» (clase de guitarra) se ve en una escuela de música.", true], ["C", "at a supermarket", "Un supermercado no tiene salones numerados para clases de guitarra.", false]]}, {"id": "EN2-110", "niv": 2, "cp": "en_p2", "e": "\"All climbers must register here and pay the park fee before going up the volcano.\"\n\nWhere can you see this notice?", "f": "Texto original elaborado para este simulacro, aviso de la parte 2", "vis": "", "o": [["A", "in a national park", "Correcta. «Climbers» (escaladores), «register» (registrarse), «park fee» (tarifa del parque) y «going up the volcano» (subir el volcán) indican la entrada de un parque natural.", true], ["B", "at a swimming pool", "Una piscina no cobra tarifa de parque ni da acceso a un volcán.", false], ["C", "in an art gallery", "Una galería de arte puede cobrar entrada, pero no tiene escaladores ni volcán que subir.", false]]}, {"id": "EN2-111", "niv": 2, "cp": "en_p2", "e": "\"Bags heavier than 10 kg cannot go in the cabin. Please check them in at the desk.\"\n\nWhere can you see this notice?", "f": "Texto original elaborado para este simulacro, aviso de la parte 2", "vis": "", "o": [["A", "in a library", "En una biblioteca no se pesan maletas ni hay cabina.", false], ["B", "at a post office", "En una oficina de correos se pesan paquetes, pero no existe una «cabin» ni se hace «check-in» de maletas.", false], ["C", "at an airport", "Correcta. «Cabin» (cabina del avión) y «check them in at the desk» (documentarlas en el mostrador) son vocabulario típico de un aeropuerto.", true]]}]}, {"comp": "ingles", "sim": "pro-2", "ind": "Conversaciones cotidianas", "tt": "", "texto": "Complete the conversations. Choose the best reply to each sentence.", "vis": "", "items": [{"id": "EN2-112", "niv": 1, "cp": "en_p3", "e": "\"Where are you from?\"", "f": "Texto original elaborado para este simulacro, conversación de la parte 3", "vis": "", "o": [["A", "I'm from Peru.", "Correcta. A «Where are you from?» (¿de dónde eres?) se responde con el lugar de origen: «I'm from Peru» (soy de Perú).", true], ["B", "Yes, I am.", "Una pregunta con «where» no se responde con «yes» o «no».", false], ["C", "I'm fine, thanks.", "Es la respuesta a «How are you?» (¿cómo estás?), no a una pregunta por el origen.", false]]}, {"id": "EN2-113", "niv": 1, "cp": "en_p3", "e": "\"Can I borrow your pen, please?\"", "f": "Texto original elaborado para este simulacro, conversación de la parte 3", "vis": "", "o": [["A", "No, I'm not.", "«I'm not» responde a una pregunta con «Are you…?», no a una pregunta con «Can I…?».", false], ["B", "It's on Tuesday.", "Indica una fecha; no tiene relación con prestar un esfero.", false], ["C", "Sure, here you are.", "Correcta. A una petición («¿me prestas tu esfera?») se responde aceptando: «Sure, here you are» (claro, aquí tienes).", true]]}, {"id": "EN2-114", "niv": 2, "cp": "en_p3", "e": "\"Have you ever been to Cartagena?\"", "f": "Texto original elaborado para este simulacro, conversación de la parte 3", "vis": "", "o": [["A", "No, I've been there twice.", "Es contradictoria: dice «No» (nunca he ido) y enseguida afirma que ha ido dos veces.", false], ["B", "Yes, twice. It's beautiful.", "Correcta. «Have you ever been…?» pregunta por una experiencia; «Yes, twice» (sí, dos veces) responde y agrega una opinión sobre la ciudad.", true], ["C", "Yes, I'm going there next week.", "Habla de un plan futuro; «Yes» a «Have you ever been…?» exige una experiencia pasada, así que la respuesta no es coherente.", false]]}, {"id": "EN2-115", "niv": 2, "cp": "en_p3", "e": "\"I'm sorry I'm late. The traffic was terrible.\"", "f": "Texto original elaborado para este simulacro, conversación de la parte 3", "vis": "", "o": [["A", "Don't worry, we haven't started yet.", "Correcta. Ante una disculpa por llegar tarde, lo natural es tranquilizar a la persona: «No te preocupes, todavía no hemos empezado».", true], ["B", "You're welcome, any time.", "«You're welcome» responde a un agradecimiento («Thank you»), no a una disculpa («I'm sorry»).", false], ["C", "Yes, it's very good, thanks.", "Responde como si le preguntaran por la calidad de algo; no reacciona a la disculpa ni al tráfico.", false]]}, {"id": "EN2-116", "niv": 2, "cp": "en_p3", "e": "\"The museum is closed on Mondays.\"", "f": "Texto original elaborado para este simulacro, conversación de la parte 3", "vis": "", "o": [["A", "I've never closed it.", "Malinterpreta «closed»: nadie habla de quién cierra el museo.", false], ["B", "Let's go on Tuesday, then.", "Correcta. Si el museo cierra los lunes, lo natural es proponer otro día: «entonces vamos el martes».", true], ["C", "Yes, it opens every Monday.", "Contradice la información: el museo está cerrado los lunes.", false]]}, {"id": "EN2-117", "niv": 3, "cp": "en_p3", "e": "\"I've been offered the job in Lima, but I'm not sure I want to move.\"", "f": "Texto original elaborado para este simulacro, conversación de la parte 3", "vis": "", "o": [["A", "Never mind, you'll find another job soon.", "Consuela como si no hubiera conseguido el trabajo, cuando en realidad se lo ofrecieron.", false], ["B", "Congratulations! When are you moving there?", "Felicita y da por hecho que se muda, ignorando que la persona no está segura de querer irse.", false], ["C", "Why not? Is it because of your family?", "Correcta. La persona expresa una duda; lo natural es preguntar por la razón de esa duda y mostrar interés.", true]]}]}, {"comp": "ingles", "sim": "pro-2", "ind": "Historia de un invento: el ascensor seguro", "tt": "", "texto": "Read the text and choose the right word for each gap.\n\nThe safe lift\n\nIn the early 1800s, most buildings had only a few floors. People did not want to climb a lot of stairs, and the machines that lifted goods and people were dangerous (1) ______ their ropes sometimes broke. In 1852, an American mechanic called Elisha Otis designed a safety brake. If the rope broke, the brake stopped the platform (2) ______ falling. Two years later, Otis showed his invention to the public at an exhibition (3) ______ New York. He stood on a platform high above the crowd and ordered a man to cut the rope. People screamed, but the platform (4) ______ not fall to the ground. Soon, shops and hotels began to install safe lifts, and architects (5) ______ able to design much taller buildings.", "vis": "", "items": [{"id": "EN2-118", "niv": 1, "cp": "en_p4", "e": "Gap (1)", "f": "Texto original elaborado para este simulacro (historia del ascensor seguro), espacio 1", "vis": "", "o": [["A", "because", "Correcta. «because» (porque) introduce la causa: las máquinas eran peligrosas porque sus cuerdas a veces se rompían.", true], ["B", "but", "«but» (pero) expresa contraste; aquí no hay contraste entre ser peligroso y romperse las cuerdas.", false], ["C", "so", "«so» (así que) indica consecuencia; invertiría la relación lógica (las cuerdas no se rompían a causa de ser peligrosas).", false]]}, {"id": "EN2-119", "niv": 2, "cp": "en_p4", "e": "Gap (2)", "f": "Texto original elaborado para este simulacro (historia del ascensor seguro), espacio 2", "vis": "", "o": [["A", "of", "«stop … of falling» no existe en inglés; la preposición que sigue a «stop» con este sentido es «from».", false], ["B", "from", "Correcta. La estructura es «stop something from + -ing» (impedir que algo haga algo): «stopped the platform from falling».", true], ["C", "at", "«at» indica lugar o momento; no forma la estructura «stop … from + -ing».", false]]}, {"id": "EN2-120", "niv": 1, "cp": "en_p4", "e": "Gap (3)", "f": "Texto original elaborado para este simulacro (historia del ascensor seguro), espacio 3", "vis": "", "o": [["A", "on", "«on» se usa con superficies, calles o días («on Monday»), no con ciudades.", false], ["B", "at", "«at» se usa con puntos o lugares concretos («at the station»), no delante del nombre de una ciudad en esta frase.", false], ["C", "in", "Correcta. Con ciudades se usa «in»: «in New York» (en Nueva York).", true]]}, {"id": "EN2-121", "niv": 2, "cp": "en_p4", "e": "Gap (4)", "f": "Texto original elaborado para este simulacro (historia del ascensor seguro), espacio 4", "vis": "", "o": [["A", "was", "«was not fall» es incorrecto: con «was» el verbo tendría que ir en -ing o participio, y «fall» está en forma base.", false], ["B", "had", "«had not fall» es incorrecto: el pasado perfecto exige participio («had not fallen»).", false], ["C", "did", "Correcta. La negación del pasado simple se forma con «did not + verbo base»: «did not fall».", true]]}, {"id": "EN2-122", "niv": 2, "cp": "en_p4", "e": "Gap (5)", "f": "Texto original elaborado para este simulacro (historia del ascensor seguro), espacio 5", "vis": "", "o": [["A", "were", "Correcta. «architects» es plural, así que el pasado de «be» es «were»: «were able to» (pudieron).", true], ["B", "did", "«did able to» no existe; «able» es un adjetivo que necesita el verbo «be».", false], ["C", "was", "«was» es singular y no concuerda con el sujeto plural «architects».", false]]}]}, {"comp": "ingles", "sim": "pro-2", "ind": "Deportes poco comunes: sepak takraw", "tt": "", "texto": "Read the text and choose the right word for each gap.\n\nVolleyball with your feet\n\nSepak takraw is a sport (1) ______ is very popular in Southeast Asia. It looks like volleyball, but players cannot use (2) ______ hands or arms. Instead, they kick the ball or hit it with their head, chest or knees. In the past, the ball (3) ______ made of rattan, a type of plant, but today most balls are made of plastic. Each team has three players, and the net is about as high (4) ______ a badminton net. (5) ______ you have ever watched a match, you will know that the players' jumps and kicks can be truly spectacular.", "vis": "", "items": [{"id": "EN2-123", "niv": 2, "cp": "en_p4", "e": "Gap (1)", "f": "Texto original elaborado para este simulacro (sepak takraw), espacio 1", "vis": "", "o": [["A", "who", "«who» se usa para personas, y «sport» es una cosa.", false], ["B", "which", "Correcta. «which» es el pronombre relativo para cosas: «a sport which is very popular» (un deporte que es muy popular).", true], ["C", "where", "«where» se refiere a lugares y no puede ser sujeto de «is very popular».", false]]}, {"id": "EN2-124", "niv": 1, "cp": "en_p4", "e": "Gap (2)", "f": "Texto original elaborado para este simulacro (sepak takraw), espacio 2", "vis": "", "o": [["A", "its", "«its» se usa para cosas o animales en singular, no para personas en plural.", false], ["B", "his", "«his» es singular masculino y no concuerda con «players».", false], ["C", "their", "Correcta. El posesivo que corresponde a «players» (plural) es «their»: «their hands» (sus manos).", true]]}, {"id": "EN2-125", "niv": 2, "cp": "en_p4", "e": "Gap (3)", "f": "Texto original elaborado para este simulacro (sepak takraw), espacio 3", "vis": "", "o": [["A", "were", "«were» es plural y no concuerda con «the ball».", false], ["B", "was", "Correcta. «In the past» exige pasado y «the ball» es singular: «the ball was made of rattan» (la bola estaba hecha de ratán).", true], ["C", "is", "«is» es presente y choca con «In the past» (en el pasado).", false]]}, {"id": "EN2-126", "niv": 2, "cp": "en_p4", "e": "Gap (4)", "f": "Texto original elaborado para este simulacro (sepak takraw), espacio 4", "vis": "", "o": [["A", "as", "Correcta. La comparación de igualdad es «as + adjetivo + as»: «as high as a badminton net» (tan alta como una red de bádminton).", true], ["B", "than", "«than» se usa con comparativos de superioridad («higher than»), no después de «as high».", false], ["C", "like", "«as high like» no es correcto; la estructura exige «as … as».", false]]}, {"id": "EN2-127", "niv": 3, "cp": "en_p4", "e": "Gap (5)", "f": "Texto original elaborado para este simulacro (sepak takraw), espacio 5", "vis": "", "o": [["A", "Unless", "«Unless» significa «a menos que»; «a menos que alguna vez hayas visto un partido, sabrás…» no tiene sentido.", false], ["B", "If", "Correcta. «If you have ever watched a match, you will know…» (si alguna vez has visto un partido, sabrás…) es una condicional lógica.", true], ["C", "Although", "«Although» (aunque) expresa contraste; no hay contraste entre ver un partido y saber que es espectacular.", false]]}]}, {"comp": "ingles", "sim": "pro-2", "ind": "Oficios: un cartógrafo (personaje ficticio)", "tt": "", "texto": "Read the text and answer the questions.\n\nMaps for neighbours\n\n(1) Andrés Pardo, 34, is a cartographer: he makes maps. People often imagine him walking through the mountains with a compass, but he spends most of his working day at a desk in Bogotá, in front of two large computer screens. \"The field trips are short,\" he says. \"The real work happens in the office.\"\n\n(2) Last year, Andrés was asked to map a small village in Boyacá. The village had grown quickly, and many of its new streets had no names. Delivery drivers got lost, letters arrived at the wrong houses, and once an ambulance took forty minutes to find a patient.\n\n(3) Andrés flew a small drone over the village to take photos from the air. Then he organised a meeting at the village school. He showed the first version of the map on a big screen, and the residents decided together what each street and square should be called. Some streets are named after local families; others after a tree or a view.\n\n(4) The project changed the way Andrés sees his job. \"Before, I thought I made maps for engineers and governments,\" he says. \"Now I know that a good map is something neighbours use every day.\"\n\n(Andrés Pardo is a fictional character.)", "vis": "", "items": [{"id": "EN2-128", "niv": 1, "cp": "en_p5", "e": "Where does Andrés do most of his work?", "f": "Texto original elaborado para este simulacro (cartógrafo), párrafo 1", "vis": "", "o": [["A", "Indoors, mostly at a computer.", "Correcta. Párrafo 1: pasa la mayor parte del día «at a desk in Bogotá, in front of two large computer screens»; el trabajo de verdad se hace bajo techo, frente al computador.", true], ["B", "Outdoors, in the mountains.", "Es lo que la gente imagina («People often imagine»), pero el texto dice que las salidas de campo son cortas.", false], ["C", "At a school, teaching children.", "La escuela solo aparece como lugar de la reunión con los vecinos; Andrés no enseña allí.", false]]}, {"id": "EN2-129", "niv": 2, "cp": "en_p5", "e": "Why did the village need a map?", "f": "Texto original elaborado para este simulacro (cartógrafo), párrafo 2", "vis": "", "o": [["A", "Tourists wanted to visit the views.", "El texto no menciona turistas; algunos nombres describen una vista, pero esa no es la razón del mapa.", false], ["B", "The village was building a new school.", "El texto no habla de construir una escuela; la escuela ya existía y allí se hizo la reunión.", false], ["C", "People had trouble finding houses.", "Correcta. Párrafo 2: muchas calles nuevas no tenían nombre; los repartidores se perdían, las cartas llegaban a casas equivocadas y una ambulancia tardó cuarenta minutos en encontrar a un paciente.", true]]}, {"id": "EN2-130", "niv": 2, "cp": "en_p5", "e": "What did the residents do at the meeting?", "f": "Texto original elaborado para este simulacro (cartógrafo), párrafo 3", "vis": "", "o": [["A", "They took photos of the village from above.", "Las fotos aéreas las tomó Andrés con el dron; los vecinos participaron después, en la reunión.", false], ["B", "They learnt how to fly a small drone.", "Quien voló el dron fue Andrés, antes de la reunión; el texto no dice que los vecinos aprendieran a volarlo.", false], ["C", "They chose names for streets and squares.", "Correcta. Párrafo 3: «the residents decided together what each street and square should be called» (decidieron juntos el nombre de cada calle y plaza).", true]]}, {"id": "EN2-131", "niv": 2, "cp": "en_p5", "e": "How has the project changed Andrés's view of his work?", "f": "Texto original elaborado para este simulacro (cartógrafo), párrafo 4", "vis": "", "o": [["A", "He sees maps as tools for ordinary people.", "Correcta. Párrafo 4: antes creía que hacía mapas para ingenieros y gobiernos; ahora sabe que un buen mapa es algo que los vecinos usan a diario.", true], ["B", "He wants to work only for the government.", "Es lo contrario: trabajar para gobiernos era su idea de antes del proyecto, no la de ahora.", false], ["C", "He now prefers field trips to office work.", "El texto no dice que haya cambiado de opinión sobre las salidas de campo ni sobre la oficina.", false]]}]}, {"comp": "ingles", "sim": "pro-2", "ind": "Historia del comercio de hielo", "tt": "", "texto": "Read the text and answer the questions.\n\nSelling winter\n\n(1) Two hundred years ago, ice in a hot country was a luxury that only very rich people could enjoy. In 1805, a young man from Boston called Frederic Tudor had an unusual business idea: he would cut ice from the frozen ponds near his city in winter and sell it in the Caribbean. Many people laughed at him. Ship owners refused to carry the ice, so he bought his own ship.\n\n(2) His first trip, in 1806, to the island of Martinique, was a disaster. The ice arrived, but there were no ice houses on the island, so it had nowhere to be stored and melted before he could sell most of it. Tudor lost a lot of money, and some years later his debts even sent him to prison.\n\n(3) But Tudor did not give up. He tested different materials to protect the ice and discovered that sawdust, which was cheap and easy to find, worked better than the others. He also built special storage houses in the ports where he sold his ice. In the 1820s, one of his workers, Nathaniel Wyeth, invented a cutter pulled by horses that divided the ice into blocks of the same size, which made the work much faster and cheaper.\n\n(4) By the 1830s, Tudor's ships were carrying ice as far as Calcutta, in India, a journey of several months. The business made him a very rich man. However, the ice trade did not last forever. In the early twentieth century, electric refrigerators allowed people to make ice at home, and the old ice houses slowly disappeared.", "vis": "", "items": [{"id": "EN2-132", "niv": 1, "cp": "en_p5", "e": "What was Frederic Tudor's business idea?", "f": "Texto original elaborado para este simulacro (historia del comercio de hielo), párrafo 1", "vis": "", "o": [["A", "To make ice with machines on islands.", "El hielo se cortaba de estanques congelados en Boston; las máquinas (refrigeradores) llegaron mucho después.", false], ["B", "To sell natural ice in warm countries.", "Correcta. Párrafo 1: «he would cut ice from the frozen ponds near his city in winter and sell it in the Caribbean» (vender hielo natural en lugares cálidos).", true], ["C", "To build ships for other businessmen.", "Tudor compró un barco para él mismo; no construía barcos para otros.", false]]}, {"id": "EN2-133", "niv": 2, "cp": "en_p5", "e": "Why did Tudor buy his own ship?", "f": "Texto original elaborado para este simulacro (historia del comercio de hielo), párrafo 1", "vis": "", "o": [["A", "Ship owners did not want to transport his ice.", "Correcta. Párrafo 1: «Ship owners refused to carry the ice, so he bought his own ship».", true], ["B", "It was cheaper than paying other people for transport.", "El texto no compara costos; la razón es que los dueños de barcos se negaron.", false], ["C", "He wanted to travel around the Caribbean himself.", "El texto no dice que Tudor quisiera viajar; compró el barco porque nadie quería llevar el hielo.", false]]}, {"id": "EN2-134", "niv": 2, "cp": "en_p5", "e": "What happened on Tudor's first trip?", "f": "Texto original elaborado para este simulacro (historia del comercio de hielo), párrafo 2", "vis": "", "o": [["A", "He built the first ice house in Martinique.", "El texto dice que en la isla no había casas de hielo; las construyó después en otros puertos (párrafo 3).", false], ["B", "He lost money because the ice melted before he could sell it.", "Correcta. Párrafo 2: no había casas de hielo, el hielo se derritió antes de venderlo («melted before he could sell most of it») y «Tudor lost a lot of money».", true], ["C", "He sold all the ice in a few hours.", "El texto dice que el hielo se derritió antes de que pudiera vender la mayor parte.", false]]}, {"id": "EN2-135", "niv": 3, "cp": "en_p5", "e": "What does paragraph 3 say about sawdust?", "f": "Texto original elaborado para este simulacro (historia del comercio de hielo), párrafo 3", "vis": "", "o": [["A", "It was too costly for long voyages.", "El texto dice lo contrario: el aserrín era barato.", false], ["B", "Wyeth's machine used it to cut ice.", "Wyeth cortaba el hielo con una máquina tirada por caballos; el aserrín servía para proteger el hielo.", false], ["C", "It did the job well and cost little.", "Correcta. Párrafo 3: el aserrín «was cheap and easy to find» (barato) y «worked better than the others» (funcionó mejor que los demás materiales).", true]]}, {"id": "EN2-136", "niv": 3, "cp": "en_p5", "e": "Why did the ice trade come to an end?", "f": "Texto original elaborado para este simulacro (historia del comercio de hielo), párrafo 4", "vis": "", "o": [["A", "The voyages to India cost too much.", "El viaje a la India era largo, pero el texto no lo presenta como la causa del fin del negocio.", false], ["B", "Families no longer needed to buy it.", "Correcta. Párrafo 4: los refrigeradores eléctricos «allowed people to make ice at home» (permitieron hacer hielo en casa), así que ya no hacía falta comprarlo.", true], ["C", "The ponds near Boston stopped freezing.", "El texto no dice nada sobre cambios en los estanques.", false]]}]}, {"comp": "ingles", "sim": "pro-2", "ind": "Arquitectura: la reutilización de edificios antiguos", "tt": "", "texto": "Read the text and answer the questions.\n\nSecond lives\n\n(1) When the last train left the old station in my hometown, everyone expected the building to disappear. It had been empty for nearly ten years, its roof was full of holes, and a supermarket chain had already offered to buy the land. Instead, a group of neighbours convinced the city council to try something different. Today the station is a public library with a café on the old platform, and on Saturday mornings its main hall fills with a farmers' market.\n\n(2) Stories like this are becoming more common. Around the world, architects are turning factories into flats, churches into concert halls and water tanks into museums. They call it \"adaptive reuse\", and its supporters say it has two clear advantages. First, the building already exists: keeping its walls and structure usually requires fewer new materials than building from scratch. Second, it keeps alive the places that give a neighbourhood its character.\n\n(3) I have to admit that I was sceptical at first. Old buildings are rarely easy to adapt. Their walls are often in the wrong place, their stairs are too narrow for modern safety rules, and nobody really knows what is hidden under the floor until the work begins. In our station, the builders discovered that part of the foundations had to be replaced, and the project ended up costing almost twice the original budget.\n\n(4) And yet, every time I walk past the big clock that still hangs above the entrance, I am glad the council took the risk. A new building might have been cheaper, but it would not have been ours.", "vis": "", "items": [{"id": "EN2-137", "niv": 2, "cp": "en_p6", "e": "What can we infer about the station before it became a library?", "f": "Texto original elaborado para este simulacro (reutilización de edificios), párrafo 1", "vis": "", "o": [["A", "The neighbours wanted to sell it as soon as possible.", "Los vecinos hicieron lo contrario: convencieron al concejo de darle otro uso.", false], ["B", "It had always belonged to a supermarket chain.", "La cadena solo «had offered to buy the land» (había ofrecido comprar el terreno); nunca fue suya.", false], ["C", "Many people thought it would be demolished.", "Correcta. Párrafo 1: «everyone expected the building to disappear» (todos esperaban que el edificio desapareciera), y una cadena de supermercados quería el terreno; se infiere que se esperaba su demolición.", true], ["D", "A few trains still stopped there every day.", "El texto dice que el último tren ya se había ido y que el edificio llevaba casi diez años vacío.", false]]}, {"id": "EN2-138", "niv": 2, "cp": "en_p6", "e": "Why does the writer mention factories, churches and water tanks in paragraph 2?", "f": "Texto original elaborado para este simulacro (reutilización de edificios), párrafo 2", "vis": "", "o": [["A", "To criticise architects who change historic buildings.", "El párrafo presenta la idea de forma favorable, con dos ventajas; no critica a los arquitectos.", false], ["B", "To list the buildings that were destroyed in the writer's town.", "Los ejemplos son de todo el mundo y hablan de edificios transformados, no destruidos.", false], ["C", "To explain which buildings are the easiest to adapt.", "El texto no dice que esos edificios sean fáciles de adaptar; el párrafo 3 señala que adaptar es difícil.", false], ["D", "To show that the idea is being applied to many kinds of buildings.", "Correcta. Los ejemplos ilustran que la «adaptive reuse» ocurre «around the world» con edificios muy distintos.", true]]}, {"id": "EN2-139", "niv": 3, "cp": "en_p6", "e": "What does the sentence \"I have to admit that I was sceptical at first\" suggest?", "f": "Texto original elaborado para este simulacro (reutilización de edificios), párrafo 3", "vis": "", "o": [["A", "The writer had never heard of adaptive reuse before.", "Ser escéptico es dudar de algo, no desconocerlo; el texto no dice que no conociera la idea.", false], ["B", "The writer's opinion has become more positive over time.", "Correcta. «Was sceptical at first» (al principio dudaba) implica un cambio, y el párrafo 4 confirma que ahora se alegra («I am glad») de la decisión.", true], ["C", "The writer still believes the project was a mistake.", "El párrafo 4 dice lo contrario: el autor se alegra de que el concejo se arriesgara.", false], ["D", "The writer was one of the builders of the project.", "Nada indica que el autor trabajara en la obra; habla de «the builders» en tercera persona.", false]]}, {"id": "EN2-140", "niv": 3, "cp": "en_p6", "e": "The problems described in paragraph 3 suggest that adapting old buildings…", "f": "Texto original elaborado para este simulacro (reutilización de edificios), párrafo 3", "vis": "", "o": [["A", "is always cheaper than building a new one.", "El texto sugiere lo contrario: «A new building might have been cheaper».", false], ["B", "can cost more than people first expect.", "Correcta. Los problemas ocultos (cimientos que hubo que cambiar) llevaron a que el proyecto costara «almost twice the original budget» (casi el doble del presupuesto).", true], ["C", "is not allowed by modern safety rules.", "Las normas de seguridad son una dificultad (escaleras estrechas), no una prohibición.", false], ["D", "should only be done by large companies.", "El texto no dice quién debería hacer este tipo de obras.", false]]}, {"id": "EN2-141", "niv": 3, "cp": "en_p6", "e": "Why does the writer mention the clock above the entrance?", "f": "Texto original elaborado para este simulacro (reutilización de edificios), párrafo 4", "vis": "", "o": [["A", "It shows that the building is still a working train station.", "El edificio es hoy una biblioteca; el reloj es un recuerdo de la estación, no prueba de que siga funcionando.", false], ["B", "It proves that the restoration was cheap.", "El texto dice que la obra costó casi el doble de lo previsto.", false], ["C", "It represents the community's connection to the old building.", "Correcta. El reloj que «still hangs» (sigue colgado) evoca la historia del lugar, y el autor concluye que un edificio nuevo «would not have been ours» (no habría sido nuestro).", true], ["D", "It is the only part of the station that was kept.", "El texto menciona también el andén (ahora café) y el hall principal; el reloj no es lo único que se conservó.", false]]}, {"id": "EN2-142", "niv": 3, "cp": "en_p6", "e": "What is the main purpose of the text?", "f": "Texto original elaborado para este simulacro (reutilización de edificios), párrafo 1-4", "vis": "", "o": [["A", "To argue that reusing old buildings is worth it despite its problems.", "Correcta. El autor presenta ventajas (párr. 2), reconoce dificultades y sobrecostos (párr. 3) y concluye que valió la pena (párr. 4).", true], ["B", "To complain about the cost of a public project in the writer's town.", "El sobrecosto se menciona, pero el autor termina contento con la decisión; no es una queja.", false], ["C", "To explain step by step how a station becomes a library.", "El texto no describe un procedimiento paso a paso; da una opinión sobre la reutilización.", false], ["D", "To convince readers that new buildings are always better.", "Es lo contrario de la conclusión del autor.", false]]}]}, {"comp": "ingles", "sim": "pro-2", "ind": "Viajes por Latinoamérica: la Carretera Austral", "tt": "", "texto": "Read the text and choose the best word for each gap.\n\nA road at the end of the world\n\nLast summer my sister and I spent three weeks (1) ______ along the Carretera Austral, a long road that crosses the wild south of Chile. We had very little money, so we (2) ______ to travel by bus. Many parts of the road are not paved, and after heavy rain the buses can arrive several hours (3) ______. However, nobody seemed to mind. At every stop, passengers got off to stretch their legs and (4) ______ photos of the mountains and glaciers. One night, when we could not find a hostel, a farmer (5) ______ us sleep in his barn. In the morning, his wife made us breakfast and refused to (6) ______ us anything for it.", "vis": "", "items": [{"id": "EN2-143", "niv": 2, "cp": "en_p7", "e": "Gap (1)", "f": "Texto original elaborado para este simulacro (viaje por la Carretera Austral, Chile), espacio 1", "vis": "", "o": [["A", "travel", "La forma base no puede seguir a «spent three weeks».", false], ["B", "travelled", "No puede haber un segundo verbo conjugado sin conector después de «spent three weeks».", false], ["C", "to travel", "«spend time to do» no es correcto; la estructura es «spend time doing».", false], ["D", "travelling", "Correcta. Después de «spend + tiempo» el verbo va en -ing: «spent three weeks travelling» (pasamos tres semanas viajando).", true]]}, {"id": "EN2-144", "niv": 2, "cp": "en_p7", "e": "Gap (2)", "f": "Texto original elaborado para este simulacro (viaje por la Carretera Austral, Chile), espacio 2", "vis": "", "o": [["A", "decided", "Correcta. «decide + to + verbo»: «we decided to travel by bus» (decidimos viajar en bus), lógico porque tenían poco dinero.", true], ["B", "avoided", "«avoid» va seguido de -ing y, además, no tiene sentido evitar el bus si no había dinero para otra cosa.", false], ["C", "suggested", "«suggest» no admite «to + verbo» en esta estructura; se dice «suggested travelling» o «suggested that we travel».", false], ["D", "enjoyed", "«enjoy» va seguido de -ing («enjoyed travelling»), no de «to + verbo».", false]]}, {"id": "EN2-145", "niv": 2, "cp": "en_p7", "e": "Gap (3)", "f": "Texto original elaborado para este simulacro (viaje por la Carretera Austral, Chile), espacio 3", "vis": "", "o": [["A", "slowly", "«arrive several hours slowly» no tiene sentido: una cantidad de horas no puede modificar a «slowly».", false], ["B", "last", "«arrive several hours last» no es una expresión posible en inglés.", false], ["C", "late", "Correcta. «arrive several hours late» (llegar varias horas tarde): «late» funciona como adverbio de tiempo tras «arrive».", true], ["D", "lately", "«lately» significa «últimamente», no «tarde».", false]]}, {"id": "EN2-146", "niv": 1, "cp": "en_p7", "e": "Gap (4)", "f": "Texto original elaborado para este simulacro (viaje por la Carretera Austral, Chile), espacio 4", "vis": "", "o": [["A", "make", "«make photos» no es la colocación usual en inglés; se dice «take photos».", false], ["B", "take", "Correcta. La colocación es «take photos» (tomar fotos).", true], ["C", "have", "«have photos» significa «tener fotos», no tomarlas.", false], ["D", "do", "«do photos» no se usa con el sentido de tomar fotos.", false]]}, {"id": "EN2-147", "niv": 3, "cp": "en_p7", "e": "Gap (5)", "f": "Texto original elaborado para este simulacro (viaje por la Carretera Austral, Chile), espacio 5", "vis": "", "o": [["A", "agreed", "«agree» no lleva objeto de persona seguido de verbo: «agreed us sleep» es incorrecto.", false], ["B", "allowed", "«allow» exige «to»: «allowed us to sleep»; sin «to» la frase es incorrecta.", false], ["C", "invited", "«invite» exige «to»: «invited us to sleep»; sin «to» es incorrecto.", false], ["D", "let", "Correcta. «let + objeto + verbo base»: «let us sleep in his barn» (nos dejó dormir en su granero).", true]]}, {"id": "EN2-148", "niv": 3, "cp": "en_p7", "e": "Gap (6)", "f": "Texto original elaborado para este simulacro (viaje por la Carretera Austral, Chile), espacio 6", "vis": "", "o": [["A", "spend", "«spend us anything» no es una estructura posible: «spend» no lleva a la persona como objeto.", false], ["B", "charge", "Correcta. «charge someone for something» = cobrarle a alguien por algo: la señora se negó a cobrarles el desayuno.", true], ["C", "cost", "«cost» tiene como sujeto la cosa («it cost us nothing»), no la persona que cobra.", false], ["D", "pay", "«pay us anything» significaría que ella les pagaba a ellos, lo cual no tiene sentido.", false]]}]}, {"comp": "ingles", "sim": "pro-2", "ind": "Música e inventos: el steelpan de Trinidad y Tobago", "tt": "", "texto": "Read the text and choose the best word for each gap.\n\nFrom rubbish to music\n\nThe steelpan is one of the few acoustic instruments (1) ______ in the twentieth century. Its story began in Trinidad and Tobago, where the colonial authorities had (2) ______ drums and, later, the bamboo instruments that people played at carnival. Musicians did not give (3) ______. In the 1930s, they started to beat biscuit tins, paint tins and other metal objects, and soon they realised that a hammered surface could produce different notes. Old oil drums, which were easy to find on the islands, (4) ______ out to be perfect for the job. Pan makers learned to stretch the top of a drum, divide it into sections and (5) ______ each section to a different note. In 1951, a steel band (6) ______ at the Festival of Britain in London, and today the steelpan is the national instrument of Trinidad and Tobago. Not bad for an instrument that was born from objects other people had thrown (7) ______.", "vis": "", "items": [{"id": "EN2-149", "niv": 2, "cp": "en_p7", "e": "Gap (1)", "f": "Texto original elaborado para este simulacro (historia del steelpan), espacio 1", "vis": "", "o": [["A", "founded", "«found» (fundar) se usa con instituciones, ciudades o empresas, no con instrumentos.", false], ["B", "discovered", "«discover» se usa para algo que ya existía (un lugar, una ley natural), no para un objeto creado por personas.", false], ["C", "explored", "«explore» (explorar) no se aplica a la creación de un instrumento.", false], ["D", "invented", "Correcta. Los instrumentos se «inventan» (invent): «acoustic instruments invented in the twentieth century».", true]]}, {"id": "EN2-150", "niv": 2, "cp": "en_p7", "e": "Gap (2)", "f": "Texto original elaborado para este simulacro (historia del steelpan), espacio 2", "vis": "", "o": [["A", "encouraged", "«encourage» (fomentar) contradice la idea de obstáculo que sigue en el texto.", false], ["B", "allowed", "Si las autoridades los hubieran permitido, no tendría sentido decir que los músicos «no se rindieron».", false], ["C", "banned", "Correcta. «ban» = prohibir. La frase siguiente («Musicians did not give up») muestra que hubo un obstáculo: las autoridades prohibieron tambores e instrumentos de bambú.", true], ["D", "avoided", "«avoid» (evitar) no expresa una acción de las autoridades sobre los instrumentos de otros.", false]]}, {"id": "EN2-151", "niv": 2, "cp": "en_p7", "e": "Gap (3)", "f": "Texto original elaborado para este simulacro (historia del steelpan), espacio 3", "vis": "", "o": [["A", "up", "Correcta. El phrasal verb «give up» significa «rendirse, darse por vencido».", true], ["B", "away", "«give away» significa «regalar» o «revelar» y necesita un objeto.", false], ["C", "back", "«give back» significa «devolver» y necesita un objeto (devolver algo).", false], ["D", "off", "«give off» significa «emitir, desprender» (olor, calor) y necesita un objeto.", false]]}, {"id": "EN2-152", "niv": 3, "cp": "en_p7", "e": "Gap (4)", "f": "Texto original elaborado para este simulacro (historia del steelpan), espacio 4", "vis": "", "o": [["A", "made", "«make out» significa «distinguir» o «entender»; «made out to be» cambiaría el sentido y no encaja.", false], ["B", "came", "«come out» significa «salir» o «publicarse»; «came out to be» no es la expresión correcta.", false], ["C", "found", "«found out» significa «descubrir» y necesita un sujeto que descubre algo; los barriles no descubren nada.", false], ["D", "turned", "Correcta. «turn out to be» = resultar ser: los barriles de petróleo resultaron perfectos para el trabajo.", true]]}, {"id": "EN2-153", "niv": 3, "cp": "en_p7", "e": "Gap (5)", "f": "Texto original elaborado para este simulacro (historia del steelpan), espacio 5", "vis": "", "o": [["A", "ring", "«ring» (sonar, timbrar) no significa ajustar la altura de un sonido.", false], ["B", "tune", "Correcta. «tune something to a note» = afinar algo en una nota: cada sección del barril se afina en una nota distinta.", true], ["C", "sound", "«sound» no se construye con «to a note» con el sentido de afinar.", false], ["D", "sing", "«sing» (cantar) no puede tener como objeto una sección de metal.", false]]}, {"id": "EN2-154", "niv": 3, "cp": "en_p7", "e": "Gap (6)", "f": "Texto original elaborado para este simulacro (his a convivir.", "Cómo resolver las emergencias familiares sin que el estudiante tenga el teléfono en la mano.", "Usos pedagógicos de la tecnología: ¿requieren el celular personal?", "Ventajas y desventajas de una regla institucional frente a reglas de cada docente."], "modelo": "Hace apenas veinte años, un descanso escolar era sinónimo de balones, gritos y conversaciones. Hoy, en muchos colegios, es frecuente ver grupos de estudiantes sentados en silencio, cada uno frente a su pantalla. Por esta razón, estoy de acuerdo con que se prohíba el uso, no el porte, de teléfonos celulares durante toda la jornada escolar, siempre que la medida se aplique con reglas claras y con alternativas para las situaciones que realmente requieran el teléfono, como las emergencias.\n\nEl primer argumento a favor de la prohibición es la atención. Aprender exige concentrarse durante periodos prolongados, y muchas aplicaciones del celular están diseñadas justamente para interrumpir: cada notificación compite con la explicación del profesor. Pedirle a un adolescente que tenga el teléfono sobre el pupitre y no lo mire es como pedirle a alguien que estudie con el televisor encendido. Guardar el aparato durante toda la jornada elimina esa tentación y libera al docente de la tarea agotadora de vigilar pantallas.\n\nEl segundo argumento tiene que ver con la convivencia. El colegio no es solo un lugar para aprender contenidos, sino también un espacio para aprender a relacionarse con otros. Los descansos sin celular obligan a conversar, a jugar y a resolver conflictos cara a cara. Además, reducir el uso del teléfono en la institución dificulta prácticas dañinas, como grabar a un compañero sin su permiso y difundir el video en redes sociales.\n\nQuienes se oponen a la medida señalan que los padres necesitan comunicarse con sus hijos en caso de emergencia. Es una preocupación comprensible, pero tiene solución: el estudiante puede llevar el teléfono, guardarlo apagado al llegar y recuperarlo a la salida, mientras que las familias pueden llamar a la secretaría del colegio ante cualquier urgencia. Tampoco resulta convincente el argumento pedagógico. Si un profesor necesita consultar información en línea o aplicar un cuestionario digital, el colegio puede ofrecer tabletas o computadores en una sala dispuesta para ello, de modo que la tecnología se use con un propósito definido y no como una distracción permanente.\n\nPor último, una norma general tiene la ventaja de la claridad. Cuando cada docente decide en su clase, los estudiantes ponen a prueba los límites todos los días, y los profesores más estrictos terminan vistos como los villanos. Una regla institucional, conocida por familias y estudiantes desde el comienzo del año, evita discusiones constantes.\n\nEn síntesis, prohibir el celular durante la jornada escolar no significa rechazar la tecnología, sino recuperar el colegio como un lugar para concentrarse y convivir. Los teléfonos seguirán ahí al terminar la jornada; las horas de clase y los descansos compartidos, en cambio, no se recuperan.", "comentario_modelo": "Planteamiento: el primer párrafo toma una posición explícita («estoy de acuerdo… siempre que…») y la delimita: se prohíbe el uso, no el porte, y se prevén alternativas para las emergencias. El texto no se limita a repetir el contexto: responde una por una las objeciones de padres y docentes con soluciones concretas (secretaría del colegio, sala de tabletas). Organización: cada párrafo desarrolla una sola idea anunciada en su primera oración («El primer argumento…», «El segundo argumento…», «Por último…»), y el contraargumento se refuta antes de la conclusión. Forma de expresión: registro formal, comparación eficaz (estudiar con el televisor encendido), uso correcto del punto y coma y un cierre con contraste («en cambio») que deja una idea memorable.", "debil": "Yo pienso que el celular tiene ventajas y desventajas. Por un lado el celular distrae en clase y favorece el ciberacoso pero por otro lado los padres necesitan comunicarse con sus hijos en caso de emergencia. Ademas los docentes lo usan como herramienta pedagógica. Los estudiantes de hoy en día son adictos al celular y no hacen nada más. Cuando yo estaba en el colegio habían muchos problemas con eso, una vez a un compañero le robaron el celular en el descanso y nadie hizo nada. Por eso los colegios deben tener más seguridad y vigilancia. En conclusión cada colegio debe ver que hace con el celular.", "comentario_debil": "No toma posición frente a la prohibición: enumera ventajas y desventajas copiadas del contexto y termina con una frase vaga («cada colegio debe ver que hace con el celular»). Generaliza sin fundamento («son adictos al celular y no hacen nada más») y se desvía hacia otro tema, la seguridad y los robos, que no responde la pregunta. Tiene errores de norma: «Ademas» sin tilde, «habían muchos problemas» (debe ser «había»), «que» sin tilde en la interrogativa indirecta, falta de coma antes de «pero» y después de «Por un lado» y «En conclusión», y una coma que une dos oraciones independientes («…con eso, una vez a un compañero…»). Para mejorarlo: decidir si está de acuerdo, en desacuerdo o parcialmente de acuerdo, justificarlo con dos razones desarrolladas y responder a la objeción más fuerte."}], "clave": "saber-pro-02.html"};

function itemHTML(it, n, mode){

    h += `<button class="op ${cls}" data-id="${it.id}" data-l="${o[0]}" ${reveal?'disabled':''}><span class="l">${o[0]}.</span><span>${esc(o[1])}</span></button>`;

function renderList(list, mode){

  const e = CFG.ensayos.find(x => x.id === sel) || CFG.ensayos[0];
  $('#main').innerHTML = `<div class="panel"><p style="margin-top:0">Elige una consigna, escribe tu texto y luego compáralo con la rúbrica y con el texto modelo. Las consignas de los seis simulacros también están aquí.</p>
  <select id="fs">${CFG.ensayos.map((x, i) => `<option value="${x.id}" ${x.id===e.id?'selected':''}>${i+1}. ${esc(x.tema)}</option>`).join('')}</select></div>` + ensayoHTML(e, !!VER[e.id]);
  $('#prog').textContent = `${CFG.ensayos.length} consignas`;
  $('#fs').onchange = ev => { ST.sel = ev.target.value; save(); escritura(); };
  puntajeRubrica(e.id);
}

// ---------- SIMULACRO ----------
let tick = null;
const ENS = CFG.ensayos[0];
function inicio(){
  const n = ITEMS.length, cnt = {};
  ITEMS.forEach(it => cnt[it.caso.comp] = (cnt[it.caso.comp]||0) + 1);
  const h = Math.floor(CFG.minutos/60), m = CFG.minutos%60;
  $('#main').innerHTML = `<div class="panel"><h2 style="margin-top:0">Instrucciones</h2>
  <p>Este simulacro reproduce la estructura de la primera sesión del examen (módulos genéricos): <b>${n} preguntas</b> de selección múltiple con única respuesta${ENS ? ' y <b>un texto argumentativo</b>' : ''}.</p>
  <table>${Object.entries(cnt).map(([k,v]) => `<tr><td>${esc(CFG.componentes[k])}</td><td class="r">${v} preguntas</td></tr>`).join('')}${ENS ? `<tr><td>Comunicación Escrita</td><td class="r">1 texto</td></tr>` : ''}</table>
  <p>Tiempo: <b>${h} h ${m ? m + ' min' : ''}</b>, como en el examen real. Distribúyelo: unos 50 minutos por módulo de 35 preguntas, 60 para Inglés y 35 para el texto. Cuando se acaba el tiempo puedes seguir, pero el cronómetro lo indica.</p>
  <p>Tus respuestas se guardan en este navegador: puedes cerrar y continuar después. Al terminar verás tu porcentaje por módulo, por competencia y por dificultad, la explicación de cada pregunta y una autoevaluación de tu texto con un modelo comentado.</p>
  <button class="btn" id="go">${ST.t0 ? 'Continuar el simulacro' : 'Comenzar'}</button></div>`;
  $('#prog').textContent = `${n} preguntas`;
  $('#go').onclick = () => { if (!ST.t0) { ST.t0 = Date.now(); save(); } examen(); };
}
function reloj(){
  const rest = CFG.minutos*60 - Math.floor((Date.now() - ST.t0)/1000);
  const a = Math.abs(rest), hh = Math.floor(a/3600), mm = Math.floor(a%3600/60), ss = a%60;
  const t = (rest < 0 ? '+' : '') + (hh ? hh + ':' : '') + String(mm).padStart(2,'0') + ':' + String(ss).padStart(2,'0');
  $('#timer').textContent = rest < 0 ? 'Tiempo cumplido ' + t : '⏱ ' + t;
  $('#timer').classList.toggle('low', rest < 600);
}
function navHTML(){
  const comps = [...new Set(ITEMS.map(i => i.caso.comp))];
  return '<div class="nav">' + comps.map(c => `<a href="#m-${c}">${esc(CFG.componentes[c])}</a>`).join('') + (ENS ? '<a href="#m-escrita">Comunicación Escrita</a>' : '') + '</div>';
}
function examen(){
  $('#main').innerHTML = navHTML() + renderList(ITEMS, 'examen') + (ENS ? `<div class="mod" id="m-escrita">Comunicación Escrita</div>` + ensayoHTML(ENS, false) : '') + `<div class="panel"><button class="btn" id="fin">Terminar y calificar</button></div>`;
  progreso(); reloj(); clearInterval(tick); tick = setInterval(reloj, 1000);
  $('#fin').onclick = () => {
    const faltan = ITEMS.length - ITEMS.filter(i => ST.r[i.id]).length;
    const sinTexto = ENS && palabras(ST.ens[ENS.id] || '') < 50;
    $('#mtxt').textContent = (faltan ? `Te faltan ${faltan} preguntas por responder. ` : '') + (sinTexto ? 'Aún no has escrito el texto argumentativo. ' : '') + (faltan || sinTexto ? '¿Quieres calificar de todos modos?' : '¿Quieres terminar y ver tu calificación?');
    $('#modal').classList.remove('hide');
  };
}
function progreso(){
  const r = ITEMS.filter(it => ST.r[it.id]).length;
  $('#prog').textContent = `Respondidas ${r}/${ITEMS.length}`;
}
$('#mno').onclick = () => $('#modal').classList.add('hide');
$('#msi').onclick = () => { $('#modal').classList.add('hide'); ST.fin = Date.now(); save(); resultados(); window.scrollTo(0,0); };
function resultados(){
  clearInterval(tick);
  const ok = ITEMS.filter(it => ST.r[it.id] === keyOf(it)).length;
  const pct = Math.round(1000*ok/ITEMS.length)/10;
  const agrupa = fn => { const m = {}; ITEMS.forEach(it => { const k = fn(it); m[k] = m[k] || [0,0]; m[k][1]++; if (ST.r[it.id]===keyOf(it)) m[k][0]++; }); return m; };
  const fila = (lab, v, cls) => `<tr class="${cls||''}"><td>${esc(lab)}</td><td class="r">${v[0]}/${v[1]}</td><td class="r">${Math.round(100*v[0]/v[1])} %</td></tr>`;
  const porMod = agrupa(it => it.caso.comp), porCp = agrupa(it => it.cp), porNiv = agrupa(it => it.niv);
  let tabla = '';
  Object.entries(porMod).forEach(([m, v]) => { tabla += fila(CFG.componentes[m], v);
    Object.entries(porCp).filter(([k]) => ITEMS.some(i => i.cp === k && i.caso.comp === m)).forEach(([k, w]) => tabla += fila(CFG.competencias[k], w, 'sub')); });
  const mins = Math.round(((ST.fin||Date.now()) - ST.t0)/60000);
  $('#timer').textContent = `Tiempo usado: ${Math.floor(mins/60) ? Math.floor(mins/60) + ' h ' : ''}${mins%60} min`;
  $('#prog').textContent = `${ok}/${ITEMS.length} aciertos`;
  const peor = Object.entries(porMod).sort((a,b) => a[1][0]/a[1][1] - b[1][0]/b[1][1])[0];
  $('#main').innerHTML = `<div class="panel"><div class="big">${String(pct).replace('.',',')} %</div>
  <p style="margin-top:4px">${ok} de ${ITEMS.length} respuestas correctas en selección múltiple. ${pct >= 75 ? 'Muy buen resultado: repasa tus errores para afianzarlo.' : pct >= 55 ? 'Vas por buen camino: refuerza los módulos y competencias con menor porcentaje.' : 'Hay que reforzar: practica por módulo y competencia, empezando por el más bajo.'} Tu módulo más bajo: <b>${esc(CFG.componentes[peor[0]])}</b>.</p>
  <p class="aviso">El Icfes reporta un puntaje de 0 a 300 por módulo calculado con un modelo estadístico que compara a todos los evaluados, por lo que no existe una conversión exacta desde el porcentaje de aciertos. Usa este resultado para comparar tu avance entre simulacros.</p>
  <h3>Por módulo y competencia</h3><table>${tabla}</table>
  <h3>Por dificultad</h3><table>${Object.entries(porNiv).map(([k,v]) => fila(CFG.niveles[k], v)).join('')}</table>
  <div class="row" style="margin-top:14px">${ENS ? '<button class="btn" id="vtexto">Evaluar mi texto</button>' : ''}<button class="btn sec" id="solo">Ver solo mis errores</button><button class="btn sec" id="todas">Ver todas</button><button class="btn sec" id="otra">Reiniciar el simulacro</button></div></div><div id="rev"></div>`;
  const rev = errs => { const l = errs ? ITEMS.filter(it => ST.r[it.id] !== keyOf(it)) : ITEMS; $('#rev').innerHTML = (errs && !l.length ? '<div class="panel">¡No tuviste errores!</div>' : renderList(l, 'review')); };
  const texto = () => { $('#rev').innerHTML = ensayoHTML(ENS, true); puntajeRubrica(ENS.id); };
  if (ENS) { texto(); $('#vtexto').onclick = texto; } else rev(true);
  $('#solo').onclick = () => rev(true); $('#todas').onclick = () => rev(false);
  $('#otra').onclick = () => { ST = {r:{}, chk:{}, ens:{}}; save(); inicio(); window.scrollTo(0,0); };
}

document.addEventListener('click', e => {
  const v = e.target.closest('[data-ver]');
  if (v) { VER[v.dataset.ver] = true; ST.ver = VER; save(); escritura(); return; }
  const b = e.target.closest('button.op'); if (!b || b.disabled) return;
  if (CFG.modo === 'simulacro' && ST.fin) return;
  ST.r[b.dataset.id] = b.dataset.l; save();
  const it = ITEMS.find(i => i.id === b.dataset.id);
  const n = b.closest('.item').querySelector('.n').textContent.replace('.','');
  b.closest('.item').outerHTML = itemHTML(it, n, CFG.modo === 'practica' ? 'practica' : 'examen');
  if (CFG.modo === 'practica') { const resp = LIST.filter(i => ST.r[i.id]); const ok = resp.filter(i => ST.r[i.id]===keyOf(i)).length; $('#prog').textContent = `${ok}/${resp.length} aciertos`; $('#pst').textContent = `${LIST.length} preguntas · respondidas ${resp.length} · aciertos ${ok} (${Math.round(100*ok/resp.length)} %)`; }
  else progreso();
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset && t.dataset.ens) { ST.ens[t.dataset.ens] = t.value; save(); const p = $('#pc-' + t.dataset.ens); if (p) p.textContent = palabras(t.value) + ' palabras'; }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset && t.dataset.chk) { ST.chk[t.dataset.chk] = t.checked; save(); puntajeRubrica(t.dataset.chk.split(':')[0]); }
});

if (CFG.modo === 'practica') practica();
else if (CFG.modo === 'escritura') { if (CFG.ensayos.length) escritura(); else $('#main').innerHTML = '<div class="panel">Sin consignas.</div>'; }
else if (ST.fin) resultados();
else if (ST.t0) examen();
else inicio();
</script>
</body>
</html>
