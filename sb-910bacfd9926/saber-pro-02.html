=\"bold\">28<\/text><circle cx=\"240.0\" cy=\"95.2\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"240.0\" y=\"87.2\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">22<\/text><circle cx=\"360.0\" cy=\"139.6\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"360.0\" y=\"131.6\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">16<\/text><circle cx=\"480.0\" cy=\"184.0\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"480.0\" y=\"176.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">10<\/text><\/svg><\/div>", "items": [{"id": "RCP-214", "niv": 1, "cp": "rc_interpretacion", "e": "¿Cómo cambia la temperatura por cada 1.000 m de altitud?", "f": "Lectura de la gráfica.", "vis": "", "o": [["A", "Disminuye 0,6 °C por cada 1.000 m de altitud.", "0,6 °C es la disminución por cada 100 m, no por cada 1.000 m.", false], ["B", "Disminuye 10 °C por cada 1.000 m de altitud.", "10 °C es la temperatura a 3.000 m, no el cambio por cada 1.000 m.", false], ["C", "Disminuye 6 °C por cada 1.000 m de altitud.", "Entre 0 y 1.000 m la temperatura baja de 28 °C a 22 °C, y lo mismo ocurre en cada tramo de 1.000 m: −6 °C por cada 1.000 m.", true], ["D", "Aumenta 6 °C por cada 1.000 m de altitud.", "La gráfica desciende: la temperatura disminuye con la altitud.", false]]}, {"id": "RCP-215", "niv": 2, "cp": "rc_formulacion", "e": "Según el modelo de los estudiantes, ¿cuál sería la temperatura promedio al mediodía en un lugar de la región ubicado a 2.600 m de altitud?", "f": "Cálculo propio a partir de los datos del caso.", "vis": "", "o": [["A", "2 °C.", "Resta 26 a 28, como si la temperatura bajara 1 °C por cada 100 m.", false], ["B", "10 °C.", "Aproxima la altitud a 3.000 m en lugar de calcular el valor para 2.600 m.", false], ["C", "12,4 °C.", "La temperatura baja 0,006 °C por metro: 28 − 0,006 × 2.600 = 28 − 15,6 = 12,4 °C.", true], ["D", "16 °C.", "Toma el valor de 2.000 m y no descuenta los 600 m adicionales (3,6 °C).", false]]}, {"id": "RCP-216", "niv": 3, "cp": "rc_argumentacion", "e": "Un estudiante afirma: «Como a mayor altitud la temperatura es menor, la temperatura es inversamente proporcional a la altitud». ¿Es válida su afirmación?", "f": "Cálculo propio a partir de los datos del caso.", "vis": "", "o": [["A", "No, porque es directamente proporcional: si la altitud aumenta, la temperatura también.", "Los datos muestran lo contrario: la temperatura disminuye al aumentar la altitud.", false], ["B", "No, porque el producto altitud × temperatura no es constante, como exigiría esa relación.", "En una proporcionalidad inversa el producto de las variables es constante; aquí 1.000 × 22 = 22.000 y 2.000 × 16 = 32.000. La relación es lineal decreciente.", true], ["C", "Sí, porque si la altitud se duplica de 1.000 m a 2.000 m, la temperatura se reduce a la mitad.", "Al duplicar la altitud, la temperatura pasa de 22 °C a 16 °C, que no es la mitad (11 °C).", false], ["D", "Sí, porque en todos los datos, cuanto mayor es la altitud, menor es la temperatura.", "Que una variable disminuya cuando la otra aumenta no basta para que sean inversamente proporcionales.", false]]}]}, {"comp": "razonamiento_cuantitativo", "sim": "pro-2", "ind": "Área y perímetro de un parque", "tt": "", "texto": "Un parque tiene la forma que muestra la figura: un rectángulo de 40 m de largo y 20 m de ancho, con un semicírculo de 20 m de diámetro unido a uno de sus lados cortos. La línea punteada separa las dos partes, pero no es un borde del parque. Use π ≈ 3,14.", "vis": "<div class=\"vfig\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 220\" font-family=\"Arial\" font-size=\"14\"><rect width=\"400\" height=\"220\" fill=\"#ffffff\"/><path d=\"M300,50 L60,50 L60,170 L300,170 A60,60 0 0,0 300,50\" fill=\"none\" stroke=\"#1d2433\" stroke-width=\"2.5\"/><line x1=\"300\" y1=\"50\" x2=\"300\" y2=\"170\" stroke=\"#1d2433\" stroke-dasharray=\"5 4\"/><text x=\"180\" y=\"40\" text-anchor=\"middle\" fill=\"#1d2433\">40 m<\/text><text x=\"52\" y=\"115\" text-anchor=\"end\" fill=\"#1d2433\">20 m<\/text><text x=\"292\" y=\"115\" text-anchor=\"end\" fill=\"#1d2433\">20 m<\/text><\/svg><\/div>", "items": [{"id": "RCP-217", "niv": 2, "cp": "rc_formulacion", "e": "¿Cuál es el área aproximada del parque?", "f": "Cálculo propio a partir de los datos del caso.", "vis": "", "o": [["A", "831,4 m².", "Suma al rectángulo la longitud del semicírculo (31,4 m) en lugar de su área.", false], ["B", "957 m².", "Rectángulo: 40 × 20 = 800 m². Semicírculo de radio 10 m: 3,14 × 10² ÷ 2 = 157 m². Total: 957 m².", true], ["C", "1.114 m².", "Suma el área de un círculo completo (314 m²) en lugar de la de un semicírculo.", false], ["D", "1.428 m².", "Usa el diámetro (20 m) como radio: 3,14 × 20² ÷ 2 = 628 m².", false]]}, {"id": "RCP-218", "niv": 3, "cp": "rc_formulacion", "e": "Se va a poner una cerca en todo el borde del parque. ¿Cuántos metros de cerca se necesitan?", "f": "Cálculo propio a partir de los datos del caso.", "vis": "", "o": [["A", "120 m.", "Es el perímetro del rectángulo completo: incluye el lado de 20 m que está dentro del parque y omite el semicírculo.", false], ["B", "131,4 m.", "El borde está formado por tres lados del rectángulo (40 + 20 + 40 = 100 m) y la semicircunferencia (3,14 × 20 ÷ 2 = 31,4 m): 131,4 m.", true], ["C", "151,4 m.", "Incluye el lado de 20 m que separa el rectángulo del semicírculo, que no es borde del parque.", false], ["D", "162,8 m.", "Suma una circunferencia completa (62,8 m) en lugar de la mitad.", false]]}, {"id": "RCP-219", "niv": 2, "cp": "rc_argumentacion", "e": "Un vecino afirma: «La zona en forma de semicírculo ocupa menos de la quinta parte del área total del parque». ¿Es correcta su afirmación?", "f": "Cálculo propio a partir de los datos del caso.", "vis": "", "o": [["A", "Sí, porque el semicírculo mide 3,14 × 10² ÷ 2 = 157 m², y el rectángulo mide más de cuatro veces esa área.", "El semicírculo mide 157 m². Como el rectángulo (800 m²) es más de 4 × 157 = 628 m², el semicírculo es menos de 1/5 del total (157 de 957 m², cerca del 16 %).", true], ["B", "No, porque el semicírculo mide 3,14 × 20² ÷ 2 = 628 m², casi la mitad del parque.", "Usa el diámetro (20 m) como si fuera el radio (10 m).", false], ["C", "No, porque el semicírculo mide 3,14 × 10² = 314 m², casi un tercio del área total.", "314 m² es el área del círculo completo; el semicírculo mide la mitad.", false], ["D", "Sí, porque el semicírculo mide 3,14 × 10 ÷ 2 = 15,7 m², menos del 2 % del área total.", "Olvida elevar el radio al cuadrado en la fórmula del área.", false]]}]}, {"comp": "razonamiento_cuantitativo", "sim": "pro-2", "ind": "Descuentos en un almacén de ropa", "tt": "", "texto": "Un almacén de ropa publicó la tabla con los precios de algunos productos antes y durante su temporada de descuentos. Además, los clientes con tarjeta de fidelidad reciben un 10 % de descuento adicional, que se aplica sobre el precio ya rebajado.", "vis": "<table class=\"vt\"><caption>Tabla 1. Precios antes y durante la temporada de descuentos<\/caption><thead><tr><th>Producto<\/th><th>Precio antes<\/th><th>Precio con descuento<\/th><\/tr><\/thead><tbody><tr><td>Chaqueta<\/td><td>$ 180.000<\/td><td>$ 144.000<\/td><\/tr><tr><td>Zapatos<\/td><td>$ 150.000<\/td><td>$ 117.000<\/td><\/tr><tr><td>Camisa<\/td><td>$ 60.000<\/td><td>$ 45.000<\/td><\/tr><tr><td>Bolso<\/td><td>$ 200.000<\/td><td>$ 160.000<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Fuente: datos ficticios.<\/div>", "items": [{"id": "RCP-222", "niv": 2, "cp": "rc_interpretacion", "e": "¿En cuál de los productos de la tabla el descuento porcentual de temporada fue mayor?", "f": "Lectura de la tabla y cálculo propio.", "vis": "", "o": [["A", "En la chaqueta.", "La chaqueta bajó $ 36.000 de $ 180.000: un 20 %.", false], ["B", "En el bolso.", "El bolso tuvo la mayor rebaja en pesos ($ 40.000), pero sobre $ 200.000 es solo un 20 %.", false], ["C", "En los zapatos.", "Los zapatos bajaron $ 33.000 de $ 150.000: un 22 %.", false], ["D", "En la camisa.", "La camisa bajó $ 15.000 de $ 60.000: un 25 %, el mayor porcentaje, aunque sea la rebaja más pequeña en pesos.", true]]}, {"id": "RCP-220", "niv": 2, "cp": "rc_formulacion", "e": "Un cliente con tarjeta de fidelidad compra los zapatos durante la temporada de descuentos. ¿Cuánto paga?", "f": "Cálculo propio a partir de los datos del caso.", "vis": "", "o": [["A", "$ 102.000", "Resta al precio inicial el 22 % de temporada más el 10 % (32 %), como si los descuentos se sumaran.", false], ["B", "$ 105.300", "El precio rebajado es $ 117.000 y el 10 % adicional se aplica sobre él: 117.000 × 0,9 = $ 105.300.", true], ["C", "$ 107.000", "Resta $ 10.000 en lugar del 10 % de $ 117.000 ($ 11.700).", false], ["D", "$ 135.000", "Aplica solo el 10 % sobre el precio inicial y olvida el descuento de temporada.", false]]}, {"id": "RCP-221", "niv": 3, "cp": "rc_argumentacion", "e": "Un cliente dice: «Con la tarjeta de fidelidad, la chaqueta queda con un descuento total del 30 % sobre su precio inicial». ¿Es correcta su afirmación?", "f": "Cálculo propio a partir de los datos del caso.", "vis": "", "o": [["A", "No, porque se paga el 72 % del precio: el descuento es del 28 %.", "Se paga 0,8 × 0,9 = 0,72 del precio inicial, así que el descuento total es 1 − 0,72 = 0,28, es decir, 28 %.", true], ["B", "No, porque el descuento total es del 32 %, ya que 1,2 × 1,1 = 1,32.", "Usa factores de aumento (1,2 y 1,1) en lugar de factores de descuento (0,8 y 0,9).", false], ["C", "Sí, porque el descuento de temporada más el 10 % de la tarjeta suman 30 %.", "Los porcentajes sucesivos no se suman: el segundo se calcula sobre una cantidad menor.", false], ["D", "Sí, porque los dos descuentos se aplican sobre el mismo producto.", "Que se apliquen al mismo producto no significa que se calculen sobre la misma base.", false]]}]}, {"comp": "razonamiento_cuantitativo", "sim": "pro-2", "ind": "Horas de sueño de estudiantes universitarios", "tt": "", "texto": "Un estudio de bienestar universitario preguntó a 40 estudiantes cuántas horas durmieron la noche anterior; todos respondieron con un número entero de horas. Los resultados se muestran en la gráfica.", "vis": "<div class=\"vfig\"><svg class=\"vg\" viewBox=\"0 0 560 320\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Gráfica 1. Horas de sueño la noche anterior\" font-family=\"Arial, sans-serif\" font-size=\"12\"><rect width=\"560\" height=\"320\" fill=\"#ffffff\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"13\" fill=\"#1d2433\">Gráfica 1. Horas de sueño la noche anterior<\/text><line x1=\"60\" y1=\"258.0\" x2=\"540\" y2=\"258.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"262.0\" text-anchor=\"end\" fill=\"#3a4356\">0<\/text><line x1=\"60\" y1=\"221.0\" x2=\"540\" y2=\"221.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"225.0\" text-anchor=\"end\" fill=\"#3a4356\">2,5<\/text><line x1=\"60\" y1=\"184.0\" x2=\"540\" y2=\"184.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"188.0\" text-anchor=\"end\" fill=\"#3a4356\">5<\/text><line x1=\"60\" y1=\"147.0\" x2=\"540\" y2=\"147.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"151.0\" text-anchor=\"end\" fill=\"#3a4356\">7,5<\/text><line x1=\"60\" y1=\"110.0\" x2=\"540\" y2=\"110.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"114.0\" text-anchor=\"end\" fill=\"#3a4356\">10<\/text><line x1=\"60\" y1=\"73.0\" x2=\"540\" y2=\"73.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"77.0\" text-anchor=\"end\" fill=\"#3a4356\">12,5<\/text><line x1=\"60\" y1=\"36.0\" x2=\"540\" y2=\"36.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"40.0\" text-anchor=\"end\" fill=\"#3a4356\">15<\/text><line x1=\"60\" y1=\"258\" x2=\"540\" y2=\"258\" stroke=\"#3a4356\"/><line x1=\"60\" y1=\"258\" x2=\"60\" y2=\"36\" stroke=\"#3a4356\"/><text transform=\"translate(14,147.0) rotate(-90)\" text-anchor=\"middle\" fill=\"#3a4356\">Número de estudiantes<\/text><text x=\"300.0\" y=\"312\" text-anchor=\"middle\" fill=\"#3a4356\">Horas de sueño<\/text><text x=\"108.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">5 h<\/text><text x=\"204.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">6 h<\/text><text x=\"300.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">7 h<\/text><text x=\"396.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">8 h<\/text><text x=\"492.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">9 h<\/text><rect x=\"74.4\" y=\"198.8\" width=\"67.2\" height=\"59.2\" fill=\"#1660a8\"/><text x=\"108.0\" y=\"194.8\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">4<\/text><rect x=\"170.4\" y=\"110.0\" width=\"67.2\" height=\"148.0\" fill=\"#1660a8\"/><text x=\"204.0\" y=\"106.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">10<\/text><rect x=\"266.4\" y=\"50.8\" width=\"67.2\" height=\"207.2\" fill=\"#1660a8\"/><text x=\"300.0\" y=\"46.8\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">14<\/text><rect x=\"362.4\" y=\"124.8\" width=\"67.2\" height=\"133.2\" fill=\"#1660a8\"/><text x=\"396.0\" y=\"120.8\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">9<\/text><rect x=\"458.4\" y=\"213.6\" width=\"67.2\" height=\"44.4\" fill=\"#1660a8\"/><text x=\"492.0\" y=\"209.6\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">3<\/text><\/svg><\/div>", "items": [{"id": "RCP-223", "niv": 3, "cp": "rc_formulacion", "e": "¿Cuál es el promedio de horas de sueño de los 40 estudiantes?", "f": "Cálculo propio a partir de los datos del caso.", "vis": "", "o": [["A", "6,925 h.", "Se pondera cada valor por su frecuencia: (5 × 4 + 6 × 10 + 7 × 14 + 8 × 9 + 9 × 3) ÷ 40 = 277 ÷ 40 = 6,925 h.", true], ["B", "7 h.", "Promedia los valores 5, 6, 7, 8 y 9 sin tener en cuenta cuántos estudiantes durmieron cada cantidad de horas.", false], ["C", "8 h.", "Promedia las frecuencias (40 ÷ 5 = 8): ese valor es el número promedio de estudiantes por barra, no de horas.", false], ["D", "55,4 h.", "Divide la suma ponderada (277) entre 5 barras en lugar de entre 40 estudiantes.", false]]}, {"id": "RCP-224", "niv": 1, "cp": "rc_interpretacion", "e": "¿Qué porcentaje de los estudiantes durmió 8 horas o más?", "f": "Lectura de la gráfica.", "vis": "", "o": [["A", "7,5 %", "Solo cuenta a quienes durmieron 9 horas (3 de 40).", false], ["B", "22,5 %", "Solo cuenta a quienes durmieron 8 horas (9 de 40).", false], ["C", "30 %", "Durmieron 8 o 9 horas 9 + 3 = 12 estudiantes, y 12 ÷ 40 = 30 %.", true], ["D", "65 %", "Incluye a quienes durmieron 7 horas (14 + 9 + 3 = 26), que no cumplen la condición.", false]]}, {"id": "RCP-225", "niv": 2, "cp": "rc_argumentacion", "e": "Se recomienda que los jóvenes duerman al menos 7 horas. Una médica afirma: «Según estos datos, más de la mitad de los estudiantes encuestados cumplió esa recomendación la noche anterior». ¿Es correcta su afirmación?", "f": "Lectura de la gráfica.", "vis": "", "o": [["A", "No, porque solo los 14 estudiantes que durmieron 7 horas cumplen, y 14 es menos de 20.", "Olvida a quienes durmieron 8 y 9 horas, que también cumplen la recomendación.", false], ["B", "No, porque ninguna barra de la gráfica llega a 20 estudiantes, la mitad de 40.", "Hay que sumar las barras de 7, 8 y 9 horas; no basta mirar cada barra por separado.", false], ["C", "Sí, porque el promedio de las horas registradas, (5 + 6 + 7 + 8 + 9) ÷ 5, es igual a 7.", "Promedia los valores sin ponderarlos por el número de estudiantes; además, un promedio no dice cuántos superan un valor.", false], ["D", "Sí, porque 26 de los 40 estudiantes durmieron 7 horas o más, y 26 es más que 20.", "«Al menos 7 horas» incluye 7, 8 y 9 horas: 14 + 9 + 3 = 26 estudiantes, más de la mitad (20).", true]]}]}, {"comp": "razonamiento_cuantitativo", "sim": "pro-2", "ind": "Crecimiento de un cultivo de bacterias", "tt": "", "texto": "En un laboratorio se estudia un cultivo que inicia con 3 × 10⁴ bacterias. En las condiciones del experimento, la cantidad de bacterias se duplica cada 20 minutos. La tabla muestra los primeros registros.", "vis": "<table class=\"vt\"><caption>Tabla 1. Cantidad de bacterias en el cultivo<\/caption><thead><tr><th>Tiempo (minutos)<\/th><th>Bacterias<\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td>30.000<\/td><\/tr><tr><td>20<\/td><td>60.000<\/td><\/tr><tr><td>40<\/td><td>120.000<\/td><\/tr><tr><td>60<\/td><td>240.000<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Fuente: datos ficticios.<\/div>", "items": [{"id": "RCP-226", "niv": 3, "cp": "rc_formulacion", "e": "¿Cuántas bacterias habrá en el cultivo 100 minutos después de iniciado el experimento?", "f": "Cálculo propio a partir de los datos del caso.", "vis": "", "o": [["A", "1,5 × 10⁵ (150.000) bacterias.", "Multiplica por 5, el número de periodos de 20 minutos, en lugar de duplicar cinco veces.", false], ["B", "4,8 × 10⁵ (480.000) bacterias.", "Cuenta 4 duplicaciones en lugar de 5 (100 minutos = 5 periodos de 20 minutos).", false], ["C", "9,6 × 10⁵ (960.000) bacterias.", "En 100 minutos hay 5 periodos de 20 minutos: 3 × 10⁴ × 2⁵ = 3 × 10⁴ × 32 = 960.000.", true], ["D", "1,92 × 10⁶ (1.920.000) bacterias.", "Cuenta 6 duplicaciones, que corresponden a 120 minutos, no a 100.", false]]}, {"id": "RCP-227", "niv": 2, "cp": "rc_interpretacion", "e": "¿Qué expresión permite calcular la cantidad N de bacterias t horas después de iniciado el experimento?", "f": "Tabla del caso.", "vis": "", "o": [["A", "N = 3 × 10⁴ × (1 + 3t).", "Es un modelo lineal: para t = 1 daría 120.000, pero el crecimiento es multiplicativo.", false], ["B", "N = 3 × 10⁴ × 3ᵗ.", "Usa el número de periodos por hora como factor; para t = 1 daría 90.000.", false], ["C", "N = 3 × 10⁴ × 2ᵗ.", "Corresponde a duplicar una vez por hora; para t = 1 daría 60.000 y no 240.000.", false], ["D", "N = 3 × 10⁴ × 8ᵗ.", "En una hora hay 3 duplicaciones, así que la cantidad se multiplica por 2³ = 8 cada hora; para t = 1 da 240.000, como en la tabla.", true]]}, {"id": "RCP-228", "niv": 3, "cp": "rc_argumentacion", "e": "Un estudiante observa en la tabla que en 40 minutos la cantidad de bacterias se multiplica por 4, y afirma: «Entonces, en 80 minutos se multiplicará por 8». ¿Es válido su razonamiento?", "f": "Cálculo propio a partir de los datos del caso.", "vis": "", "o": [["A", "No, porque en otros 40 minutos vuelve a multiplicarse por 4: en total, por 16.", "En 80 minutos hay 4 duplicaciones: 2⁴ = 16. El crecimiento es multiplicativo, así que 4 × 4 = 16.", true], ["B", "No, porque cada 40 minutos se suman 90.000 bacterias: en 80 minutos se multiplica por 7.", "Supone un aumento constante en cantidad; la tabla muestra que la cantidad se duplica, no que aumente siempre lo mismo.", false], ["C", "Sí, porque en 80 minutos hay 4 periodos de 20 minutos y en cada uno se agregan 2: 4 × 2 = 8.", "Multiplica 4 × 2 en lugar de calcular 2⁴; en cada periodo la cantidad se multiplica por 2.", false], ["D", "Sí, porque si el tiempo se duplica, el factor también se duplica: 4 × 2 = 8.", "Eso solo ocurriría en un crecimiento lineal; aquí los factores se multiplican.", false]]}]}, {"comp": "razonamiento_cuantitativo", "sim": "pro-2", "ind": "Códigos de identificación en una bodega", "tt": "", "texto": "Una bodega identifica cada caja con un código formado por dos vocales seguidas de tres dígitos (por ejemplo, AE-307 o UU-001). Las vocales y los dígitos pueden repetirse.", "vis": "", "items": [{"id": "RCP-229", "niv": 2, "cp": "rc_formulacion", "e": "¿Cuántos códigos diferentes se pueden formar?", "f": "Cálculo propio a partir de los datos del caso.", "vis": "", "o": [["A", "40 códigos.", "Suma las opciones de cada posición (5 + 5 + 10 + 10 + 10) en lugar de multiplicarlas.", false], ["B", "10.000 códigos.", "Suma las opciones de las dos vocales (5 + 5) en lugar de multiplicarlas: 10 × 1.000.", false], ["C", "14.400 códigos.", "Calcula 5 × 4 × 10 × 9 × 8, como si no se pudieran repetir vocales ni dígitos.", false], ["D", "25.000 códigos.", "Por el principio de multiplicación: 5 × 5 × 10 × 10 × 10 = 25.000.", true]]}, {"id": "RCP-230", "niv": 2, "cp": "rc_argumentacion", "e": "Para tener más códigos, un auxiliar afirma: «Agregar un dígito más al final produce más códigos que agregar una vocal más al principio». ¿Es correcta su afirmación?", "f": "Cálculo propio a partir de los datos del caso.", "vis": "", "o": [["A", "Sí, porque un dígito admite más valores posibles que una vocal.", "Cada posición nueva multiplica el total por el número de opciones de esa posición: 10 para un dígito y 5 para una vocal.", true], ["B", "Sí, porque el código ya tiene 3 dígitos y solo 2 vocales.", "Cuántos dígitos tenga ya el código es irrelevante; importa cuántas opciones tiene la nueva posición.", false], ["C", "No, porque una vocal más multiplica el total por 25, al combinarse con las otras dos vocales.", "La nueva vocal solo aporta 5 opciones; las combinaciones con las otras ya están contadas.", false], ["D", "No, porque en los dos casos se agrega una sola posición y el total se multiplica por 2.", "El total se multiplica por el número de opciones de la nueva posición, que no es 2.", false]]}]}, {"comp": "razonamiento_cuantitativo", "sim": "pro-2", "ind": "Calidad del aire durante una semana", "tt": "", "texto": "Una estación de monitoreo de un municipio registró la concentración promedio diaria de material particulado fino (PM2,5) durante una semana. En Colombia, la Resolución 2254 de 2017 fija en 37 µg/m³ el nivel máximo permisible de PM2,5 para un tiempo de exposición de 24 horas.", "vis": "<div class=\"vfig\"><svg class=\"vg\" viewBox=\"0 0 560 320\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Gráfica 1. Concentración diaria de PM2,5\" font-family=\"Arial, sans-serif\" font-size=\"12\"><rect width=\"560\" height=\"320\" fill=\"#ffffff\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"13\" fill=\"#1d2433\">Gráfica 1. Concentración diaria de PM2,5<\/text><line x1=\"60\" y1=\"258.0\" x2=\"540\" y2=\"258.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"262.0\" text-anchor=\"end\" fill=\"#3a4356\">0<\/text><line x1=\"60\" y1=\"213.6\" x2=\"540\" y2=\"213.6\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"217.6\" text-anchor=\"end\" fill=\"#3a4356\">10<\/text><line x1=\"60\" y1=\"169.2\" x2=\"540\" y2=\"169.2\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"173.2\" text-anchor=\"end\" fill=\"#3a4356\">20<\/text><line x1=\"60\" y1=\"124.8\" x2=\"540\" y2=\"124.8\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"128.8\" text-anchor=\"end\" fill=\"#3a4356\">30<\/text><line x1=\"60\" y1=\"80.4\" x2=\"540\" y2=\"80.4\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"84.4\" text-anchor=\"end\" fill=\"#3a4356\">40<\/text><line x1=\"60\" y1=\"36.0\" x2=\"540\" y2=\"36.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"40.0\" text-anchor=\"end\" fill=\"#3a4356\">50<\/text><line x1=\"60\" y1=\"258\" x2=\"540\" y2=\"258\" stroke=\"#3a4356\"/><line x1=\"60\" y1=\"258\" x2=\"60\" y2=\"36\" stroke=\"#3a4356\"/><text transform=\"translate(14,147.0) rotate(-90)\" text-anchor=\"middle\" fill=\"#3a4356\">PM2,5 (µg/m³)<\/text><text x=\"300.0\" y=\"312\" text-anchor=\"middle\" fill=\"#3a4356\">Día<\/text><text x=\"94.3\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Lun<\/text><text x=\"162.9\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Mar<\/text><text x=\"231.4\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Mié<\/text><text x=\"300.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Jue<\/text><text x=\"368.6\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Vie<\/text><text x=\"437.1\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Sáb<\/text><text x=\"505.7\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Dom<\/text><polyline fill=\"none\" stroke=\"#1660a8\" stroke-width=\"2.5\" points=\"94.3,133.7 162.9,76.0 231.4,84.8 300.0,102.6 368.6,62.6 437.1,124.8 505.7,160.3\"/><circle cx=\"94.3\" cy=\"133.7\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"94.3\" y=\"125.7\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">28<\/text><circle cx=\"162.9\" cy=\"76.0\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"162.9\" y=\"68.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">41<\/text><circle cx=\"231.4\" cy=\"84.8\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"231.4\" y=\"76.8\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">39<\/text><circle cx=\"300.0\" cy=\"102.6\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"300.0\" y=\"94.6\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">35<\/text><circle cx=\"368.6\" cy=\"62.6\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"368.6\" y=\"54.6\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">44<\/text><circle cx=\"437.1\" cy=\"124.8\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"437.1\" y=\"116.8\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">30<\/text><circle cx=\"505.7\" cy=\"160.3\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"505.7\" y=\"152.3\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">22<\/text><\/svg><\/div>", "items": [{"id": "RCP-231", "niv": 1, "cp": "rc_interpretacion", "e": "¿Cuántos días de la semana la concentración de PM2,5 superó el nivel máximo permisible?", "f": "Lectura de la gráfica y Resolución 2254 de 2017, art. 2, parágrafo 1.", "vis": "", "o": [["A", "2 días.", "Omite el miércoles (39 µg/m³), que también supera 37 µg/m³.", false], ["B", "3 días.", "Superaron 37 µg/m³ el martes (41), el miércoles (39) y el viernes (44).", true], ["C", "4 días.", "Cuenta también el jueves (35 µg/m³), que está por debajo del límite.", false], ["D", "5 días.", "Cuenta los días con 30 µg/m³ o más, en lugar de los que superan 37 µg/m³.", false]]}, {"id": "RCP-232", "niv": 2, "cp": "rc_interpretacion", "e": "¿Entre qué par de días consecutivos ocurrió la mayor disminución de la concentración de PM2,5?", "f": "Lectura de la gráfica.", "vis": "", "o": [["A", "Del sábado al domingo.", "Del sábado al domingo bajó 8 µg/m³, menos que del viernes al sábado.", false], ["B", "Del martes al miércoles.", "Entre el martes y el miércoles la concentración bajó solo 2 µg/m³.", false], ["C", "Del viernes al sábado.", "Del viernes (44) al sábado (30) bajó 14 µg/m³, la mayor disminución de la semana.", true], ["D", "Del miércoles al jueves.", "Entre el miércoles y el jueves bajó 4 µg/m³.", false]]}, {"id": "RCP-233", "niv": 3, "cp": "rc_argumentacion", "e": "Un funcionario concluye: «El promedio de la semana estuvo por debajo de 37 µg/m³, así que ningún día se superó el nivel máximo permisible». ¿Es válida su conclusión?", "f": "Cálculo propio a partir de los datos del caso.", "vis": "", "o": [["A", "Sí, porque el promedio de la semana es menor que 37 µg/m³.", "El promedio sí es menor que 37 µg/m³ (cerca de 34,1), pero el promedio no informa sobre cada dato.", false], ["B", "Sí, porque la mayoría de los días estuvieron por debajo del límite.", "Que la mayoría de los días esté por debajo no implica que ninguno lo supere.", false], ["C", "No, porque el promedio de la semana es mayor que 37 µg/m³.", "El promedio de los 7 días es cercano a 34,1 µg/m³, menor que 37.", false], ["D", "No, porque el promedio no indica si algún día se superó el límite.", "Un promedio puede estar por debajo de un valor aunque algunos datos lo superen; en esta semana varios días pasaron de 37 µg/m³.", true]]}]}, {"comp": "razonamiento_cuantitativo", "sim": "pro-2", "ind": "Medición de un edificio con sombras", "tt": "", "texto": "Para estimar la altura de un edificio sin subir a él, Camila midió, a la misma hora de un día soleado, la sombra del edificio (18 m) y la sombra de un bastón vertical de 1,2 m de alto (0,9 m).", "vis": "", "items": [{"id": "RCP-234", "niv": 2, "cp": "rc_argumentacion", "e": "Camila concluye que el edificio mide 24 m. ¿Es válida su conclusión?", "f": "Semejanza de triángulos.", "vis": "", "o": [["A", "No, porque el edificio mide 18 × 0,9 ÷ 1,2 = 13,5 m.", "Invierte la razón: el bastón es más alto que su sombra, así que el edificio también es más alto que la suya.", false], ["B", "Sí, porque un edificio siempre es más alto que su sombra.", "Eso depende de la hora del día; además, no justifica el valor de 24 m.", false], ["C", "No, porque la altura es 18 + 0,3 = 18,3 m, al sumar la diferencia entre el bastón y su sombra.", "En triángulos semejantes los lados son proporcionales; no se conserva la diferencia, sino la razón.", false], ["D", "Sí, porque los triángulos que forman los objetos y sus sombras son semejantes.", "Los rayos del sol llegan con el mismo ángulo, así que altura y sombra son proporcionales: h = 18 × 1,2 ÷ 0,9 = 24 m.", true]]}, {"id": "RCP-235", "niv": 1, "cp": "rc_interpretacion", "e": "Camila también quiere dibujar a escala 1 : 200 la casa vecina, que mide 9 m de altura. ¿Qué altura debe tener la casa en el dibujo?", "f": "Cálculo propio a partir de los datos del caso.", "vis": "", "o": [["A", "0,045 cm.", "9 ÷ 200 = 0,045 está en metros; en centímetros son 4,5 cm.", false], ["B", "4,5 cm.", "9 m = 900 cm, y a escala 1 : 200 se dibuja 900 ÷ 200 = 4,5 cm.", true], ["C", "18 cm.", "Multiplica 9 por 2 en lugar de dividir entre 200.", false], ["D", "45 cm.", "Divide 900 cm entre 20, como si la escala fuera 1 : 20.", false]]}]}, {"comp": "competencias_ciudadanas", "sim": "pro-2", "ind": "Supremacía constitucional", "tt": "", "texto": "Un concejo municipal expide un acuerdo que contradice abiertamente una disposición de la Constitución. Una funcionaria de la alcaldía debe decidir cuál de las dos normas aplicar en un caso concreto.", "vis": "", "items": [{"id": "CCP-201", "niv": 1, "cp": "cc_conocimientos", "e": "¿Qué principio constitucional le indica a la funcionaria cuál norma debe aplicar?", "f": "Constitución Política de Colombia (texto vigente, secretariasenado.gov.co/senado/basedoc/constitucion_politica_1991.html), artículos 4 y 287", "vis": "", "o": [["A", "La norma posterior prevalece sobre la anterior, de modo que el acuerdo municipal, por ser más reciente, debe aplicarse sobre la Constitución.", "El criterio de la norma posterior no sirve frente a la Constitución, que prevalece sobre cualquier otra norma (art. 4).", false], ["B", "Los acuerdos municipales prevalecen en su territorio gracias a la autonomía de las entidades territoriales.", "La autonomía territorial se ejerce «dentro de los límites de la Constitución y la ley» (art. 287); no permite desconocer la Constitución.", false], ["C", "La Constitución es norma de normas: si es incompatible con otra norma, se aplica la Constitución.", "El artículo 4 dispone: «La Constitución es norma de normas. En todo caso de incompatibilidad entre la Constitución y la ley u otra norma jurídica, se aplicarán las disposiciones constitucionales».", true], ["D", "La norma más específica se aplica de preferencia, aunque contradiga la Constitución.", "Ningún criterio de especialidad permite aplicar una norma contraria a la Constitución (art. 4).", false]]}]}, {"comp": "competencias_ciudadanas", "sim": "pro-2", "ind": "Privación ilegal de la libertad", "tt": "", "texto": "Un hombre fue capturado sin orden judicial y lleva tres días detenido en una estación de policía sin ser puesto a disposición de un juez. Su hermana quiere acudir a un juez para que revise de inmediato la legalidad de la detención.", "vis": "", "items": [{"id": "CCP-202", "niv": 2, "cp": "cc_conocimientos", "e": "¿Qué mecanismo constitucional corresponde a esta situación y en qué término debe resolverse?", "f": "Constitución Política de Colombia (texto vigente, secretariasenado.gov.co/senado/basedoc/constitucion_politica_1991.html), artículos 23, 28, 30, 86 y 87", "vis": "", "o": [["A", "El habeas corpus, que puede invocar un tercero y debe resolverse en treinta y seis horas.", "El artículo 30 dispone que quien esté privado de su libertad y crea estarlo ilegalmente puede invocar el habeas corpus «por sí o por interpuesta persona», y que «debe resolverse en el término de treinta y seis horas».", true], ["B", "La acción de tutela, que debe presentar el propio detenido y resolverse en diez días.", "La tutela puede presentarse por quien actúe a nombre del afectado (art. 86); además, para la privación ilegal de la libertad la Constitución prevé específicamente el habeas corpus.", false], ["C", "Un derecho de petición ante la estación de policía, que debe responderse en un plazo de diez días.", "El derecho de petición (art. 23) no es un mecanismo judicial para controlar la legalidad de una privación de la libertad.", false], ["D", "La acción de cumplimiento, para que la policía cumpla la ley y lo libere en un término de quince días.", "La acción de cumplimiento (art. 87) busca que una autoridad cumpla una ley o un acto administrativo; no es el mecanismo para controlar la legalidad de una detención.", false]]}]}, {"comp": "competencias_ciudadanas", "sim": "pro-2", "ind": "Libertad de información y rectificación", "tt": "", "texto": "Un periódico regional publicó que un comerciante vendía productos vencidos. Días después se comprobó que la información era falsa. El comerciante quiere saber qué le garantiza la Constitución frente al medio.", "vis": "", "items": [{"id": "CCP-203", "niv": 1, "cp": "cc_conocimientos", "e": "¿Qué derecho le garantiza expresamente la Constitución al comerciante en relación con el periódico?", "f": "Constitución Política de Colombia (texto vigente, secretariasenado.gov.co/senado/basedoc/constitucion_politica_1991.html), artículos 15 y 20", "vis": "", "o": [["A", "El derecho a la rectificación en condiciones de equidad.", "El artículo 20 dispone: «Se garantiza el derecho a la rectificación en condiciones de equidad». Además, el artículo 15 protege el buen nombre.", true], ["B", "El derecho a fijar por sí mismo la indemnización que el periódico debe pagarle.", "La Constitución no otorga a nadie el derecho de fijar su propia indemnización; eso, en su caso, lo decide un juez.", false], ["C", "El derecho a que el Estado revise previamente lo que el periódico vaya a publicar.", "El artículo 20 establece expresamente: «No habrá censura».", false], ["D", "El derecho a que la alcaldía ordene el cierre del periódico.", "La Constitución garantiza la libertad de fundar medios (art. 20); no prevé el cierre de un medio por orden de la alcaldía como respuesta a una información falsa.", false]]}]}, {"comp": "competencias_ciudadanas", "sim": "pro-2", "ind": "Derecho de petición", "tt": "", "texto": "Una ciudadana envió a la alcaldía una solicitud escrita y respetuosa para conocer cuánto dinero se ha invertido en la construcción de un parque de su barrio. Pasaron varias semanas y no ha recibido ninguna respuesta.", "vis": "", "items": [{"id": "CCP-204", "niv": 2, "cp": "cc_conocimientos", "e": "¿Qué derecho fundamental se le está desconociendo a la ciudadana?", "f": "Constitución Política de Colombia (texto vigente, secretariasenado.gov.co/senado/basedoc/constitucion_politica_1991.html), artículos 15, 20, 23 y 259", "vis": "", "o": [["A", "El derecho a la rectificación de informaciones en condiciones de equidad.", "La rectificación (art. 20) se refiere a informaciones publicadas por medios de comunicación.", false], ["B", "El derecho a la igualdad, porque la alcaldía sí responde las solicitudes de otros ciudadanos.", "El caso no dice que la alcaldía trate de manera distinta a otras personas; lo que falta es la respuesta a la solicitud.", false], ["C", "El derecho a conocer, actualizar y rectificar las informaciones que sobre ella se hayan recogido en bancos de datos.", "Ese derecho (art. 15, habeas data) se refiere a datos sobre la propia persona; aquí la ciudadana pide información sobre una obra pública.", false], ["D", "El derecho de petición, que incluye obtener una pronta resolución.", "La ciudadana ejerció el derecho de petición del artículo 23 y la alcaldía no le ha respondido; ese artículo no solo permite presentar peticiones respetuosas, sino que garantiza «obtener pronta resolución».", true]]}]}, {"comp": "competencias_ciudadanas", "sim": "pro-2", "ind": "Derecho a la salud", "tt": "", "texto": "En un debate sobre el sistema de salud, varios estudiantes citan el artículo 49 de la Constitución, modificado por el Acto Legislativo 2 de 2009.", "vis": "", "items": [{"id": "CCP-205", "niv": 2, "cp": "cc_conocimientos", "e": "¿Cuál de las siguientes afirmaciones corresponde a lo que establece ese artículo?", "f": "Constitución Política de Colombia (texto vigente, secretariasenado.gov.co/senado/basedoc/constitucion_politica_1991.html), artículos 49 (modificado por el Acto Legislativo 2 de 2009) y 50", "vis": "", "o": [["A", "La atención de la salud es un servicio que prestan los particulares y que el Estado se limita a vigilar.", "Contradice el artículo 49, que define la atención de la salud como servicio público a cargo del Estado.", false], ["B", "Los servicios de salud se organizan de manera centralizada y sin participación de la comunidad, para garantizar la uniformidad de la atención en todo el país.", "El artículo 49 dice lo contrario: los servicios se organizarán «en forma descentralizada, por niveles de atención y con participación de la comunidad».", false], ["C", "El Estado tiene a su cargo la atención de la salud como servicio público, y cada persona debe cuidar su salud y la de su comunidad.", "El artículo 49 establece que «la atención de la salud y el saneamiento ambiental son servicios públicos a cargo del Estado» y que «toda persona tiene el deber de procurar el cuidado integral de su salud y de su comunidad».", true], ["D", "Se garantiza a todas las personas atención gratuita en las instituciones de salud que reciban aportes del Estado.", "Esa gratuidad la consagra el artículo 50, pero solo para los niños menores de un año sin protección ni seguridad social; el artículo 49 deja a la ley fijar los términos en que la atención básica será gratuita.", false]]}]}, {"comp": "competencias_ciudadanas", "sim": "pro-2", "ind": "Daños a un número plural de personas", "tt": "", "texto": "Treinta familias de un barrio sufrieron daños en sus viviendas por un mismo deslizamiento de tierra, causado por una obra vial mal ejecutada. Las familias quieren reclamar juntas la indemnización de los perjuicios que cada una sufrió.", "vis": "", "items": [{"id": "CCP-206", "niv": 3, "cp": "cc_conocimientos", "e": "¿Qué mecanismo, previsto en el artículo 88 de la Constitución y desarrollado por la Ley 472 de 1998, es el adecuado para esta reclamación?", "f": "Constitución Política de Colombia (texto vigente, secretariasenado.gov.co/senado/basedoc/constitucion_politica_1991.html), artículos 51, 86, 87 y 88; Ley 472 de 1998, artículos 2 y 3", "vis": "", "o": [["A", "La acción de tutela, porque los daños afectan el derecho a la vivienda digna de cada familia.", "La vivienda digna (art. 51) está en el capítulo de derechos sociales, y la tutela procede cuando no hay otro medio de defensa judicial (art. 86); aquí existe un mecanismo específico para indemnizar a un grupo de afectados.", false], ["B", "La acción de grupo, que busca indemnizar los daños causados a un número plural de personas.", "El artículo 88 ordena regular las acciones originadas en los daños ocasionados a un número plural de personas; la Ley 472 de 1998 (art. 3) las denomina acciones de grupo y dispone que se ejercen «exclusivamente para obtener el reconocimiento y pago de indemnización de los perjuicios».", true], ["C", "La acción de cumplimiento, para que la constructora cumpla el contrato y pague a cada familia lo que pida.", "La acción de cumplimiento (art. 87) busca que una autoridad cumpla una ley o un acto administrativo; no sirve para cobrar perjuicios.", false], ["D", "La acción popular, que procede para obtener la indemnización individual de cada familia afectada.", "La acción popular protege derechos e intereses colectivos y busca evitar el daño, hacer cesar la amenaza o restituir las cosas (Ley 472, art. 2); no es la vía para indemnizar perjuicios individuales de un grupo.", false]]}]}, {"comp": "competencias_ciudadanas", "sim": "pro-2", "ind": "Guarda de la Constitución", "tt": "", "texto": "Un grupo de ciudadanos considera que una ley recién aprobada por el Congreso es contraria a la Constitución y quiere demandarla.", "vis": "", "items": [{"id": "CCP-207", "niv": 1, "cp": "cc_conocimientos", "e": "¿A qué entidad le confía la Constitución la guarda de su integridad y supremacía y la decisión sobre las demandas de inconstitucionalidad contra las leyes?", "f": "Constitución Política de Colombia (texto vigente, secretariasenado.gov.co/senado/basedoc/constitucion_politica_1991.html), artículos 234 y 241", "vis": "", "o": [["A", "A la Procuraduría General de la Nación.", "La Procuraduría es un órgano de control, no un tribunal que decida sobre la constitucionalidad de las leyes.", false], ["B", "A la Corte Suprema de Justicia.", "La Corte Suprema es el máximo tribunal de la jurisdicción ordinaria (art. 234); no decide las demandas de inconstitucionalidad contra las leyes.", false], ["C", "A la Corte Constitucional.", "El artículo 241 le confía «la guarda de la integridad y supremacía de la Constitución» y, en su numeral 4, la función de decidir las demandas de inconstitucionalidad que presenten los ciudadanos contra las leyes.", true], ["D", "Al Consejo de Estado.", "El Consejo de Estado es el tribunal supremo de lo contencioso administrativo; las demandas contra leyes corresponden a la Corte Constitucional (art. 241).", false]]}]}, {"comp": "competencias_ciudadanas", "sim": "pro-2", "ind": "Elección del Contralor General", "tt": "", "texto": "En una clase sobre órganos de control, el profesor pregunta cómo se elige hoy al Contralor General de la República, según el texto vigente de la Constitución.", "vis": "", "items": [{"id": "CCP-208", "niv": 3, "cp": "cc_conocimientos", "e": "¿Cuál es la respuesta correcta?", "f": "Constitución Política de Colombia (texto vigente, secretariasenado.gov.co/senado/basedoc/constitucion_politica_1991.html), artículos 266, 267 (modificado por el Acto Legislativo 4 de 2019) y 281", "vis": "", "o": [["A", "Lo elige el Congreso en pleno, por mayoría absoluta, de una lista de elegibles conformada por convocatoria pública.", "Así lo dispone el artículo 267, modificado por el Acto Legislativo 4 de 2019: «El Contralor será elegido por el Congreso en Pleno, por mayoría absoluta, […] de lista de elegibles conformada por convocatoria pública».", true], ["B", "Lo elige la Cámara de Representantes de una terna elaborada por el Presidente de la República.", "Así se elige al Defensor del Pueblo (art. 281), no al Contralor.", false], ["C", "Lo elige el Congreso en pleno de una terna integrada por la Corte Constitucional, la Corte Suprema de Justicia y el Consejo de Estado.", "Ese era el procedimiento anterior al Acto Legislativo 4 de 2019; el texto vigente exige una lista de elegibles conformada por convocatoria pública.", false], ["D", "Lo escogen los presidentes de las tres altas cortes mediante un concurso de méritos.", "Así se escoge al Registrador Nacional del Estado Civil (art. 266).", false]]}]}, {"comp": "competencias_ciudadanas", "sim": "pro-2", "ind": "Funciones del Defensor del Pueblo", "tt": "", "texto": "Una organización de personas con discapacidad busca apoyo de una entidad pública para conocer sus derechos y defenderlos ante las autoridades y ante entidades privadas.", "vis": "", "items": [{"id": "CCP-209", "niv": 2, "cp": "cc_conocimientos", "e": "¿Cuál de las siguientes funciones le asigna la Constitución al Defensor del Pueblo?", "f": "Constitución Política de Colombia (texto vigente, secretariasenado.gov.co/senado/basedoc/constitucion_politica_1991.html), artículos 250, 267 y 282", "vis": "", "o": [["A", "Adelantar la acción penal e investigar los hechos que revistan las características de un delito.", "Esa es función de la Fiscalía General de la Nación (art. 250).", false], ["B", "Vigilar la gestión fiscal de la administración y de los particulares que manejen fondos o bienes públicos.", "Esa es función de la Contraloría General de la República (art. 267).", false], ["C", "Juzgar y sancionar penalmente a los servidores públicos que violen los derechos humanos.", "El Defensor del Pueblo no juzga; juzgar corresponde a la rama judicial.", false], ["D", "Orientar e instruir a los habitantes para que ejerzan y defiendan sus derechos.", "Es la función del numeral 1 del artículo 282: «Orientar e instruir a los habitantes del territorio nacional y a los colombianos en el exterior en el ejercicio y defensa de sus derechos ante las autoridades competentes o entidades de carácter privado».", true]]}]}, {"comp": "competencias_ciudadanas", "sim": "pro-2", "ind": "Incumplimiento de un acto administrativo", "tt": "", "texto": "Un decreto municipal ordena a la Secretaría de Tránsito publicar cada mes en su página web las estadísticas de accidentalidad. Ha pasado un año y la Secretaría nunca las ha publicado. Un ciudadano ya le pidió por escrito a la Secretaría que cumpliera y no obtuvo respuesta; ahora quiere que un juez le ordene cumplir ese deber.", "vis": "", "items": [{"id": "CCP-210", "niv": 3, "cp": "cc_conocimientos", "e": "¿Qué mecanismo constitucional es el apropiado?", "f": "Constitución Política de Colombia (texto vigente, secretariasenado.gov.co/senado/basedoc/constitucion_politica_1991.html), artículos 30, 87, 88 y 103", "vis": "", "o": [["A", "El habeas corpus, porque la omisión de la Secretaría afecta la libertad de información.", "El habeas corpus protege a quien está privado ilegalmente de su libertad física (art. 30).", false], ["B", "La acción de cumplimiento, para que el juez ordene a la autoridad cumplir el deber omitido.", "El artículo 87 dispone que toda persona puede acudir ante la autoridad judicial «para hacer efectivo el cumplimiento de una ley o un acto administrativo» y que, si prospera, «la sentencia ordenará a la autoridad renuente el cumplimiento del deber omitido».", true], ["C", "La revocatoria del mandato del secretario de tránsito.", "La revocatoria del mandato procede respecto de cargos de elección popular, como gobernadores y alcaldes, no de un secretario designado.", false], ["D", "La acción popular, que es el mecanismo previsto para exigir el cumplimiento de los decretos municipales.", "La acción popular protege derechos e intereses colectivos (art. 88); el mecanismo que la Constitución prevé para exigir el cumplimiento de una ley o un acto administrativo es la acción de cumplimiento (art. 87).", false]]}]}, {"comp": "competencias_ciudadanas", "sim": "pro-2", "ind": "El voto", "tt": "", "texto": "Antes de unas elecciones, una campaña de la Registraduría recuerda a los ciudadanos lo que la Constitución dice sobre el voto.", "vis": "", "items": [{"id": "CCP-211", "niv": 1, "cp": "cc_conocimientos", "e": "Según el artículo 258 de la Constitución, el voto es", "f": "Constitución Política de Colombia (texto vigente, secretariasenado.gov.co/senado/basedoc/constitucion_politica_1991.html), artículos 107 y 258", "vis": "", "o": [["A", "un derecho que el Estado garantiza a los ciudadanos inscritos en un partido o movimiento político con personería jurídica.", "El voto es un derecho y un deber de los ciudadanos (art. 258), no de quienes estén inscritos en un partido; afiliarse es una libertad (art. 107).", false], ["B", "un derecho que puede ejercerse en forma pública si el votante así lo decide ante los jurados de mesa.", "La Constitución exige que el voto se ejerza en forma secreta, en cubículos individuales (art. 258).", false], ["C", "a la vez un derecho y una obligación de los ciudadanos, y el Estado debe garantizar que sea libre de presiones y secreto.", "El artículo 258 dispone: «El voto es un derecho y un deber ciudadano. El Estado velará porque se ejerza sin ningún tipo de coacción y en forma secreta».", true], ["D", "un derecho de los ciudadanos, pero no un deber.", "El artículo 258 dice expresamente que el voto es «un derecho y un deber ciudadano».", false]]}]}, {"comp": "competencias_ciudadanas", "sim": "pro-2", "ind": "Repartidores y espacio público", "tt": "", "texto": "En el centro de una ciudad, decenas de repartidores en moto esperan pedidos estacionados sobre los andenes, frente a los restaurantes. Los peatones —en especial las personas con movilidad reducida— se quejan de que deben caminar por la calzada. La alcaldía anunció que multará a quienes estacionen en los andenes.\n\nUn vocero de los repartidores explicó: «La aplicación nos asigna los pedidos según la cercanía al restaurante; si nos alejamos para parquear en un sitio permitido, perdemos pedidos y, con ellos, ingresos».\n\nLa asociación de restaurantes afirmó que el problema no es suyo, porque los repartidores no son sus empleados.\n\nLa empresa de la aplicación declaró que está dispuesta a crear «zonas de espera» virtuales si la alcaldía habilita bahías de parqueo cercanas.", "vis": "", "items": [{"id": "CCP-212", "niv": 1, "cp": "cc_multiperspectivismo", "e": "Según el vocero, los repartidores estacionan en los andenes principalmente porque", "f": "Texto original elaborado para este simulacro, caso de los repartidores en los andenes, intervención del vocero de los repartidores", "vis": "", "o": [["A", "desconocen la norma que prohíbe estacionar en los andenes.", "El vocero no alega desconocimiento; explica una razón económica.", false], ["B", "la aplicación asigna los pedidos por cercanía y alejarse les hace perder ingresos.", "Es la explicación literal del vocero.", true], ["C", "consideran que las multas de la alcaldía son demasiado bajas.", "El vocero no menciona el valor de las multas.", false], ["D", "los restaurantes les exigen esperar frente a la puerta del local para entregar los pedidos más rápido.", "El texto no dice que los restaurantes lo exijan.", false]]}, {"id": "CCP-213", "niv": 2, "cp": "cc_multiperspectivismo", "e": "¿Qué propuesta atendería a la vez el interés de los peatones y el de los repartidores?", "f": "Texto original elaborado para este simulacro, caso de los repartidores en los andenes", "vis": "", "o": [["A", "Habilitar bahías de parqueo cerca de los restaurantes y que la aplicación asigne pedidos a quienes esperen allí.", "Libera los andenes (peatones) sin que los repartidores pierdan pedidos, y coincide con lo que ofreció la empresa de la aplicación.", true], ["B", "Permitir el estacionamiento en los andenes solo durante las horas del almuerzo.", "Favorece a los repartidores, pero mantiene el problema de los peatones en las horas de mayor movimiento.", false], ["C", "Habilitar bahías de parqueo cerca de los restaurantes, de uso exclusivo para los repartidores contratados por cada restaurante.", "Parece conciliadora, pero según el texto los repartidores no son empleados de los restaurantes; casi ninguno podría usar las bahías y seguirían en los andenes.", false], ["D", "Habilitar bahías de parqueo a varias cuadras de los restaurantes y mantener la asignación de pedidos por cercanía.", "Despeja los andenes, pero con la asignación por cercanía los repartidores que esperen lejos seguirían perdiendo pedidos, según el vocero; por eso no atiende su interés.", false]]}, {"id": "CCP-214", "niv": 3, "cp": "cc_argumentacion", "e": "La asociación de restaurantes sostiene que el problema no es suyo porque los repartidores no son sus empleados. Este argumento es débil porque", "f": "Texto original elaborado para este simulacro, caso de los repartidores en los andenes, intervención de la asociación de restaurantes", "vis": "", "o": [["A", "los restaurantes deben pagar las multas que imponga la alcaldía.", "El texto no dice quién pagaría las multas; es una afirmación sin apoyo.", false], ["B", "la responsabilidad por el uso del espacio público le corresponde a la alcaldía, que es la que impone las multas.", "Esto no muestra una debilidad del argumento de los restaurantes; más bien lo apoya, al trasladar la responsabilidad a otra entidad.", false], ["C", "la asociación no presentó cifras sobre cuántos repartidores esperan cada día frente a los restaurantes que agremia.", "La falta de cifras no es la debilidad: el problema es suponer que, sin vínculo laboral, los restaurantes no tienen relación con el problema.", false], ["D", "no tener un vínculo laboral no impide que los restaurantes se beneficien de los domicilios ni que contribuyan a la solución.", "Que no exista relación laboral no prueba que los restaurantes sean ajenos al problema: los domicilios hacen parte de su negocio y los repartidores esperan frente a sus locales.", true]]}, {"id": "CCP-215", "niv": 2, "cp": "cc_sistemico", "e": "El caso muestra que una decisión de diseño de la aplicación (asignar pedidos por cercanía) tiene efectos sobre", "f": "Texto original elaborado para este simulacro, caso de los repartidores en los andenes", "vis": "", "o": [["A", "el uso del espacio público y la movilidad de los peatones.", "Por la forma de asignar pedidos, los repartidores esperan sobre los andenes, lo que obliga a los peatones a caminar por la calzada.", true], ["B", "la cantidad de multas que ha impuesto la alcaldía hasta ahora.", "La alcaldía apenas anunció que multará; el texto no informa que se hayan impuesto multas.", false], ["C", "las ventas de los restaurantes, que dependen de la rapidez de los domicilios.", "El texto no relaciona la asignación por cercanía con las ventas de los restaurantes.", false], ["D", "la calidad de la comida que preparan y venden los restaurantes del centro de la ciudad.", "El texto no relaciona la asignación de pedidos con la calidad de la comida.", false]]}]}, {"comp": "competencias_ciudadanas", "sim": "pro-2", "ind": "Debate sobre cámaras de fotomultas", "tt": "", "texto": "En un debate del concejo sobre seguridad vial se presentaron estas intervenciones:\n\nConcejal Ruiz: «Las cámaras de fotomultas solo sirven para recaudar dinero. Mi cuñado recibió tres multas en el mismo mes y nunca ha tenido un accidente».\n\nInvestigadora de la universidad: «En los 12 corredores donde se instalaron cámaras, las muertes en siniestros viales bajaron de 31 a 19 en dos años; en corredores similares sin cámaras, pasaron de 29 a 27 en el mismo periodo».\n\nRepresentante de los transportadores: «Las cámaras están mal señalizadas: en varios puntos el aviso aparece después de la cámara».\n\nSecretario de Movilidad: «El dinero de las multas se invierte en señalización y en educación vial».", "vis": "", "items": [{"id": "CCP-216", "niv": 1, "cp": "cc_argumentacion", "e": "El argumento del concejal Ruiz es débil porque", "f": "Texto original elaborado para este simulacro, caso del debate sobre cámaras de fotomultas, intervención del concejal Ruiz", "vis": "", "o": [["A", "no menciona la mala señalización de las cámaras.", "No mencionar un tema no hace débil un argumento sobre otro tema.", false], ["B", "se refiere a las cámaras de toda la ciudad y no solo a las de los 12 corredores que estudió la universidad.", "Hablar de todas las cámaras no es en sí un error; la debilidad está en la base de la conclusión: una sola anécdota.", false], ["C", "las cámaras de fotomultas no recaudan dinero.", "El texto indica lo contrario: el secretario explica en qué se invierte el dinero de las multas.", false], ["D", "saca una conclusión sobre todas las cámaras a partir de la experiencia de una sola persona.", "El caso del cuñado es una anécdota; no permite concluir para qué sirven las cámaras en general (generalización apresurada).", true]]}, {"id": "CCP-217", "niv": 3, "cp": "cc_argumentacion", "e": "¿Por qué la comparación con corredores similares sin cámaras fortalece la conclusión de la investigadora?", "f": "Texto original elaborado para este simulacro, caso del debate sobre cámaras de fotomultas, intervención de la investigadora", "vis": "", "o": [["A", "Porque muestra que en los corredores sin cámaras las muertes aumentaron.", "Falso: en los corredores sin cámaras las muertes bajaron levemente, de 29 a 27.", false], ["B", "Porque demuestra que las cámaras generan menos ingresos de los que supone el concejal Ruiz en su intervención.", "Los datos de la investigadora se refieren a muertes, no a ingresos.", false], ["C", "Porque permite descartar que la baja se deba solo a cambios que afectaron a toda la ciudad.", "En los corredores sin cámaras las muertes casi no cambiaron (29 a 27), mientras que en los corredores con cámaras bajaron mucho más (31 a 19); la diferencia apunta a un efecto de las cámaras y no solo a factores comunes.", true], ["D", "Porque prueba que las multas impuestas en los corredores con cámaras fueron justas.", "Las cifras de muertes no dicen nada sobre la justicia de las multas.", false]]}, {"id": "CCP-218", "niv": 2, "cp": "cc_multiperspectivismo", "e": "La intervención del representante de los transportadores sugiere que su principal interés es que", "f": "Texto original elaborado para este simulacro, caso del debate sobre cámaras de fotomultas, intervención del representante de los transportadores", "vis": "", "o": [["A", "el dinero de las multas se invierta en educación vial.", "Eso lo dice el secretario de Movilidad.", false], ["B", "las multas sean justas, con avisos que adviertan a tiempo a los conductores.", "Su queja es que el aviso aparece después de la cámara, es decir, que los conductores no reciben la advertencia a tiempo.", true], ["C", "se retiren las cámaras de los corredores y se devuelva el dinero recaudado a los conductores multados.", "El representante no pide retirar las cámaras ni devolver dinero; critica la señalización.", false], ["D", "se demuestre que las cámaras reducen las muertes.", "Eso corresponde a la intervención de la investigadora.", false]]}, {"id": "CCP-219", "niv": 2, "cp": "cc_argumentacion", "e": "La intervención del secretario de Movilidad responde principalmente a la afirmación de", "f": "Texto original elaborado para este simulacro, caso del debate sobre cámaras de fotomultas", "vis": "", "o": [["A", "ninguno de los participantes, porque introduce un tema que no se había mencionado.", "El tema del dinero ya lo había planteado el concejal Ruiz.", false], ["B", "el concejal Ruiz, porque responde a la idea de que las cámaras solo sirven para recaudar.", "El concejal afirma que las cámaras «solo sirven para recaudar dinero»; el secretario responde indicando el destino de ese dinero.", true], ["C", "el representante de los transportadores, porque explica dónde se ubican los avisos.", "El secretario no habla de la ubicación de los avisos, aunque mencione la señalización como destino del dinero.", false], ["D", "la investigadora, porque confirma con nuevas cifras que las muertes en los corredores con cámaras se redujeron en dos años.", "El secretario no menciona las cifras de muertes.", false]]}]}, {"comp": "competencias_ciudadanas", "sim": "pro-2", "ind": "Relleno sanitario regional", "tt": "", "texto": "El relleno sanitario que recibe la basura de cinco municipios llegará al límite de su capacidad en 18 meses. La gobernación propone construir uno nuevo en el municipio de San Bernardo, que tiene el terreno con las mejores condiciones técnicas: suelo arcilloso, lejos de fuentes de agua y a 12 km del casco urbano.\n\nEl alcalde de San Bernardo se opone: «Nuestro municipio produce apenas el 8 % de la basura de la región, pero cargaría con el olor, los camiones y la mala fama».\n\nLos alcaldes de los otros cuatro municipios apoyan la propuesta y ofrecen pagar a San Bernardo una compensación por cada tonelada recibida.\n\nUna cooperativa de recicladores pide que, antes de construir, se obligue a separar los residuos en la fuente, pues calcula que el 40 % de lo que llega al relleno actual es material aprovechable.\n\nLos habitantes de la vereda vecina al terreno temen que sus fincas pierdan valor y que el tránsito de camiones dañe la única vía.", "vis": "", "items": [{"id": "CCP-220", "niv": 1, "cp": "cc_multiperspectivismo", "e": "La posición del alcalde de San Bernardo se basa principalmente en", "f": "Texto original elaborado para este simulacro, caso del relleno sanitario regional, intervención del alcalde de San Bernardo", "vis": "", "o": [["A", "la desproporción entre la poca basura que produce su municipio y los perjuicios que recibiría.", "El alcalde contrasta el 8 % de la basura que produce San Bernardo con los efectos negativos (olor, camiones, mala fama) que soportaría.", true], ["B", "razones técnicas sobre la mala calidad del suelo del terreno propuesto por la gobernación.", "El texto dice lo contrario: el terreno tiene las mejores condiciones técnicas.", false], ["C", "la conveniencia de separar los residuos en la fuente.", "Esa es la propuesta de la cooperativa de recicladores.", false], ["D", "el bajo valor de la compensación por tonelada que se ofrece.", "El alcalde no menciona la compensación, que es una oferta posterior de los otros alcaldes.", false]]}, {"id": "CCP-221", "niv": 2, "cp": "cc_multiperspectivismo", "e": "¿Cuál de los siguientes actores podría seguir inconforme aunque los otros cuatro municipios paguen la compensación a San Bernardo?", "f": "Texto original elaborado para este simulacro, caso del relleno sanitario regional", "vis": "", "o": [["A", "Los habitantes urbanos de los otros municipios, porque el relleno quedaría lejos de ellos.", "Que el relleno quede lejos de ellos no es motivo de inconformidad; el texto no les atribuye ninguna queja.", false], ["B", "La gobernación, porque la compensación disminuiría la calidad técnica del terreno.", "Un pago no altera las condiciones técnicas del terreno.", false], ["C", "Los habitantes de la vereda vecina, cuyas preocupaciones no se resuelven necesariamente con un pago al municipio.", "Sus temores (desvalorización de las fincas y daño de la única vía) son concretos y locales; un pago al municipio no garantiza que se atiendan.", true], ["D", "Los alcaldes de los otros cuatro municipios, porque consideran demasiado alta la compensación que tendrían que pagar por tonelada.", "Son ellos quienes ofrecen la compensación; el texto no indica que la consideren excesiva.", false]]}, {"id": "CCP-222", "niv": 2, "cp": "cc_sistemico", "e": "A diferencia de la propuesta de la gobernación, la de la cooperativa de recicladores busca", "f": "Texto original elaborado para este simulacro, caso del relleno sanitario regional, propuesta de la cooperativa de recicladores", "vis": "", "o": [["A", "compensar económicamente al municipio que reciba la basura.", "Esa es la oferta de los otros cuatro alcaldes.", false], ["B", "que cada municipio construya su propio relleno.", "La cooperativa no propone eso.", false], ["C", "escoger el terreno con las mejores condiciones técnicas para construir el nuevo relleno sanitario de la región.", "Ese es el criterio de la gobernación, no de la cooperativa.", false], ["D", "reducir la cantidad de residuos que llega al relleno, lo que alargaría su vida útil.", "Si el 40 % de lo que llega es aprovechable, separarlo en la fuente reduciría el volumen que se dispone en el relleno.", true]]}, {"id": "CCP-223", "niv": 3, "cp": "cc_sistemico", "e": "Si se construyera el nuevo relleno sin separar los residuos en la fuente, ¿qué consecuencia sería más probable según los datos del texto?", "f": "Texto original elaborado para este simulacro, caso del relleno sanitario regional", "vis": "", "o": [["A", "El suelo arcilloso del terreno de San Bernardo dejaría de ser adecuado para recibir los residuos de la región.", "El texto no relaciona la separación en la fuente con las propiedades del suelo.", false], ["B", "San Bernardo pasaría a producir más del 8 % de la basura de la región.", "La separación de residuos no cambia la proporción de basura que produce cada municipio.", false], ["C", "El relleno se llenaría antes de tiempo, porque recibiría material aprovechable que podría reciclarse.", "Según la cooperativa, el 40 % de lo que llega al relleno actual es aprovechable; sin separación, ese material seguiría ocupando espacio en el nuevo.", true], ["D", "Los recicladores tendrían más material para aprovechar.", "Es lo contrario: sin separación en la fuente, el material aprovechable termina en el relleno.", false]]}, {"id": "CCP-224", "niv": 3, "cp": "cc_multiperspectivismo", "e": "¿Cuál de las siguientes afirmaciones describe mejor el conflicto entre San Bernardo y los otros cuatro municipios?", "f": "Texto original elaborado para este simulacro, caso del relleno sanitario regional", "vis": "", "o": [["A", "San Bernardo produce la mayor parte de la basura y se niega a asumir su responsabilidad.", "San Bernardo produce solo el 8 % de la basura de la región.", false], ["B", "Los beneficios del relleno se reparten entre todos, pero sus costos recaen en uno solo.", "Los cinco municipios necesitan dónde disponer su basura, pero los efectos negativos recaerían sobre San Bernardo, que además produce poca basura.", true], ["C", "Los cinco municipios rechazan el nuevo relleno, aunque cada uno lo hace por razones técnicas distintas.", "Los otros cuatro municipios apoyan la propuesta.", false], ["D", "Los cuatro municipios quieren el relleno en su territorio para recibir la compensación.", "Es al revés: ofrecen pagar para que el relleno quede en San Bernardo.", false]]}]}, {"comp": "competencias_ciudadanas", "sim": "pro-2", "ind": "Vivienda de interés social en un barrio", "tt": "", "texto": "La alcaldía de una ciudad aprobó construir 300 apartamentos de vivienda de interés social en un lote municipal del barrio Las Acacias. En la audiencia pública se oyeron estas posiciones:\n\nResidente 1: «No estamos de acuerdo. Esa gente viene de barrios peligrosos y va a traer la inseguridad».\n\nResidente 2: «Me preocupa otra cosa: el colegio y el centro de salud del barrio ya están llenos; con 300 familias más no van a dar abasto».\n\nRepresentante de las familias beneficiarias: «Somos trabajadores que hoy pagamos arriendo en inquilinatos. Queremos un hogar propio y ser buenos vecinos».\n\nFuncionario de la Secretaría de Planeación: «El proyecto incluye la ampliación del centro de salud y una nueva sede del colegio».", "vis": "", "items": [{"id": "CCP-225", "niv": 1, "cp": "cc_argumentacion", "e": "La intervención del residente 1 contiene un prejuicio porque", "f": "Texto original elaborado para este simulacro, caso de la vivienda de interés social en Las Acacias, intervención del residente 1", "vis": "", "o": [["A", "advierte que el colegio y el centro de salud del barrio no darán abasto con la llegada de 300 familias más.", "Esa preocupación es del residente 2 y se refiere a la capacidad de los servicios, no a las personas.", false], ["B", "reconoce que las familias beneficiarias son trabajadoras.", "Eso lo dice el representante de las familias, no el residente 1.", false], ["C", "se apoya en estadísticas sobre la seguridad del barrio Las Acacias.", "El residente 1 no presenta ninguna estadística.", false], ["D", "atribuye a todas las familias beneficiarias una conducta delictiva por el lugar de donde vienen.", "Asume, sin ninguna evidencia, que las familias traerán inseguridad solo por su procedencia: es un estereotipo.", true]]}, {"id": "CCP-226", "niv": 2, "cp": "cc_argumentacion", "e": "¿En qué se diferencia la preocupación del residente 2 de la del residente 1?", "f": "Texto original elaborado para este simulacro, caso de la vivienda de interés social en Las Acacias", "vis": "", "o": [["A", "La del residente 2 se refiere a la capacidad de los servicios y puede verificarse; la del residente 1 se basa en un estereotipo.", "Que el colegio y el centro de salud estén llenos es un hecho comprobable; la idea de que «esa gente» traerá inseguridad es una generalización sobre las personas.", true], ["B", "Ambas quedan resueltas con lo que dice el representante de las familias.", "El representante responde implícitamente al prejuicio, pero no a la capacidad de los servicios, que atiende el funcionario de Planeación.", false], ["C", "Ambas se basan en estereotipos sobre las familias beneficiarias.", "La del residente 2 no se refiere a las características de las familias sino a la capacidad de los servicios.", false], ["D", "La del residente 2 también se basa en una suposición sobre las familias, aunque la exprese en términos de servicios.", "El residente 2 no hace ninguna suposición sobre las características de las familias: se refiere a un hecho comprobable, la capacidad del colegio y del centro de salud.", false]]}, {"id": "CCP-227", "niv": 2, "cp": "cc_multiperspectivismo", "e": "La intervención del funcionario de la Secretaría de Planeación responde principalmente a la preocupación de", "f": "Texto original elaborado para este simulacro, caso de la vivienda de interés social en Las Acacias, intervención del funcionario de Planeación", "vis": "", "o": [["A", "el residente 2, sobre la capacidad del colegio y del centro de salud.", "El funcionario anuncia la ampliación del centro de salud y una nueva sede del colegio, que es justamente lo que preocupa al residente 2.", true], ["B", "el representante de las familias, sobre el costo del arriendo.", "El funcionario no se refiere al arriendo de las familias.", false], ["C", "el residente 1, sobre la inseguridad que según él traerían las nuevas familias que llegarían al barrio.", "El funcionario no habla de seguridad.", false], ["D", "los residentes 1 y 2, pues responde tanto a la inseguridad como a la capacidad de los servicios.", "Su respuesta se refiere a los servicios de salud y educación; no dice nada sobre la seguridad.", false]]}, {"id": "CCP-228", "niv": 2, "cp": "cc_sistemico", "e": "El caso muestra que construir vivienda de interés social, además de atender la necesidad de vivienda, involucra", "f": "Texto original elaborado para este simulacro, caso de la vivienda de interés social en Las Acacias", "vis": "", "o": [["A", "la dimensión ambiental, por la tala de árboles en el lote municipal.", "El texto no menciona árboles ni efectos ambientales.", false], ["B", "la dimensión de la movilidad, por el aumento del tráfico en las vías del barrio.", "El texto no menciona el tráfico ni las vías del barrio.", false], ["C", "los servicios sociales del sector, como educación y salud, que deben crecer con la nueva población.", "La llegada de 300 familias aumenta la demanda de colegio y centro de salud; por eso el proyecto incluye su ampliación.", true], ["D", "la dimensión económica, porque la discusión se centra en cuánto cuesta construir cada uno de los apartamentos del proyecto.", "El texto no menciona costos de construcción y muestra otras dimensiones en juego.", false]]}]}, {"comp": "competencias_ciudadanas", "sim": "pro-2", "ind": "Veda de pesca", "tt": "", "texto": "La autoridad pesquera estableció una veda que prohíbe pescar y vender bagre en un río durante dos meses al año, en la época en que la especie se reproduce. Los estudios muestran que la talla promedio del bagre capturado bajó de 85 cm a 52 cm en diez años y que la mayoría de los peces se pescan antes de reproducirse por primera vez.\n\nLos pescadores artesanales dicen que durante la veda no tienen otra fuente de ingresos y que el subsidio que reciben llega tarde. Los comerciantes del puerto afirman que en esos meses venden pescado traído de otras regiones a precios más altos. Una fundación ambiental propone, además de la veda, prohibir las redes de malla fina, que atrapan peces jóvenes.", "vis": "", "items": [{"id": "CCP-229", "niv": 3, "cp": "cc_sistemico", "e": "¿Qué relación entre la dimensión ecológica y la económica permite justificar la veda con la información del texto?", "f": "Texto original elaborado para este simulacro, caso de la veda del bagre", "vis": "", "o": [["A", "La veda aumenta de inmediato la talla de los bagres que se pescan el resto del año.", "El texto no dice que el efecto sea inmediato; se trata de proteger la reproducción a mediano y largo plazo.", false], ["B", "Si los bagres se pescan antes de reproducirse, la población futura disminuye, y con ella la pesca de la que viven los pescadores.", "El texto muestra que la mayoría de los peces se capturan antes de su primera reproducción y que la talla promedio ha caído; proteger la reproducción es condición para que la pesca siga siendo posible a largo plazo.", true], ["C", "Durante la veda los comerciantes venden pescado traído de otras regiones, lo que mantiene el abastecimiento del puerto.", "Describe un efecto de la veda sobre el comercio, pero no explica por qué la veda se justifica; además, los pescadores siguen sin ingresos.", false], ["D", "El subsidio a los pescadores es lo que permite que los bagres se reproduzcan.", "El subsidio atiende la dimensión económica de los pescadores, no la reproducción de la especie.", false]]}, {"id": "CCP-230", "niv": 1, "cp": "cc_multiperspectivismo", "e": "La queja de los pescadores artesanales se refiere principalmente a", "f": "Texto original elaborado para este simulacro, caso de la veda del bagre, queja de los pescadores artesanales", "vis": "", "o": [["A", "los altos precios del pescado traído de otras regiones.", "Esa situación la describen los comerciantes del puerto.", false], ["B", "la prohibición de las redes de malla fina que propone la fundación ambiental para proteger a los peces jóvenes.", "Los pescadores no se pronuncian sobre esa propuesta.", false], ["C", "la exactitud de los estudios sobre la talla del bagre.", "Los pescadores no cuestionan los estudios.", false], ["D", "la falta de ingresos oportunos durante los meses en que no pueden pescar.", "Dicen que en la veda no tienen otra fuente de ingresos y que el subsidio llega tarde.", true]]}, {"id": "CCP-231", "niv": 3, "cp": "cc_sistemico", "e": "Si se aplicara la propuesta de la fundación ambiental sin ningún apoyo adicional, ¿cuál sería el efecto más probable?", "f": "Texto original elaborado para este simulacro, caso de la veda del bagre, propuesta de la fundación ambiental", "vis": "", "o": [["A", "La talla promedio de los bagres capturados seguiría disminuyendo.", "Es lo contrario de lo esperable: si se capturan menos peces jóvenes, la talla de los capturados tendería a aumentar.", false], ["B", "Aumentarían los ingresos de los pescadores, aunque se capturarían más peces jóvenes.", "Es lo contrario de lo esperable: la prohibición de las redes de malla fina reduce la captura de peces jóvenes y, sin apoyo, implica un costo para los pescadores.", false], ["C", "Los comerciantes del puerto dejarían de traer pescado de otras regiones durante los meses de la veda.", "La prohibición de un tipo de red no cambia el hecho de que durante la veda no se puede vender bagre del río.", false], ["D", "Se protegería a los bagres jóvenes, pero quienes usan redes de malla fina tendrían que asumir el costo de cambiarlas.", "La prohibición favorece la dimensión ecológica (menos captura de peces jóvenes) y genera un costo económico para los pescadores que deban reemplazar sus redes.", true]]}, {"id": "CCP-232", "niv": 2, "cp": "cc_multiperspectivismo", "e": "¿Qué medida tendría mayor probabilidad de ser aceptada tanto por la autoridad pesquera como por los pescadores artesanales?", "f": "Texto original elaborado para este simulacro, caso de la veda del bagre", "vis": "", "o": [["A", "Pagar el subsidio al comienzo de la veda y trasladarla a los meses en que los pescadores venden menos.", "Atiende la queja del subsidio, pero la veda debe coincidir con la época de reproducción del bagre; trasladarla le quitaría su propósito y la autoridad no la aceptaría.", false], ["B", "Mantener la veda y garantizar que el subsidio se pague al comienzo de esta.", "Conserva el objetivo de la autoridad (proteger la reproducción) y resuelve la queja de los pescadores (ingresos que llegan tarde).", true], ["C", "Mantener la veda dos meses y permitir que, durante ella, los pescadores capturen bagre para su consumo familiar.", "Atiende en parte a los pescadores, pero permite pescar en plena época de reproducción, que es lo que la veda prohíbe; la autoridad la rechazaría.", false], ["D", "Reducir la veda a un mes y duplicar el subsidio durante ese mes.", "Parece conciliadora, pero un mes no cubre los dos meses de reproducción; la autoridad pesquera no la aceptaría.", false]]}]}, {"comp": "competencias_ciudadanas", "sim": "pro-2", "ind": "Cierre de sedes educativas rurales", "tt": "", "texto": "La Secretaría de Educación de un departamento anunció que cerrará 14 sedes rurales que tienen menos de diez estudiantes cada una y trasladará a esos niños a una institución central con biblioteca, laboratorio y conexión a internet. Ofrece transporte escolar diario.\n\nUna madre de familia de la vereda Alto Bonito comenta: «El colegio central está a hora y media por una trocha que se daña cuando llueve. Mi hijo de seis años tendría que salir a las 5:00 de la mañana».\n\nUn docente rural opina: «En las sedes pequeñas un solo profesor atiende varios grados al tiempo; en la institución central cada grado tendría su profesor».\n\nEl secretario de Educación afirma: «Con lo que cuesta mantener las 14 sedes podemos dotar mucho mejor una sola. Además, en el departamento vecino se hizo lo mismo y los resultados en las pruebas mejoraron».", "vis": "", "items": [{"id": "CCP-233", "niv": 3, "cp": "cc_argumentacion", "e": "El secretario usa como argumento la experiencia del departamento vecino. ¿Qué información haría falta para que ese argumento fuera sólido?", "f": "Texto original elaborado para este simulacro, caso del cierre de sedes rurales, intervención del secretario de Educación", "vis": "", "o": [["A", "Si las distancias y el estado de las vías en el departamento vecino eran comparables a los de las veredas afectadas.", "Para trasladar una experiencia de un lugar a otro, las condiciones relevantes deben ser parecidas; aquí la dificultad principal señalada es el desplazamiento por vías en mal estado.", true], ["B", "Si las sedes rurales del departamento vecino tenían bibliotecas.", "Es un dato secundario; no responde a la principal diferencia que podría existir entre los dos contextos (distancias y vías).", false], ["C", "Cuánto cuesta el transporte escolar en la capital del departamento.", "El costo en la capital no informa sobre las condiciones de las veredas rurales afectadas.", false], ["D", "Cuántos funcionarios trabajan en la Secretaría de Educación del departamento vecino y cuál es su nivel de formación profesional.", "Ese dato no permite saber si la medida funcionaría en las veredas afectadas.", false]]}, {"id": "CCP-234", "niv": 2, "cp": "cc_multiperspectivismo", "e": "¿Qué tienen en común las intervenciones del docente rural y del secretario de Educación?", "f": "Texto original elaborado para este simulacro, caso del cierre de sedes rurales", "vis": "", "o": [["A", "Ambas rechazan el cierre de las sedes rurales.", "Ninguna de las dos rechaza el cierre; ambas mencionan ventajas de la medida.", false], ["B", "Ambas se basan en la experiencia del departamento vecino.", "Solo el secretario menciona al departamento vecino.", false], ["C", "Ambas destacan ventajas de concentrar a los estudiantes en una sola institución.", "El docente señala que cada grado tendría su profesor; el secretario, que los recursos alcanzarían para dotar mejor una sola sede.", true], ["D", "Ambas se refieren a las dificultades del transporte escolar por una trocha que se daña cuando llueve.", "Esa dificultad la plantea la madre de familia.", false]]}, {"id": "CCP-235", "niv": 2, "cp": "cc_sistemico", "e": "La intervención de la madre de familia muestra que la medida, pensada para mejorar la calidad educativa, puede tener efectos en otra dimensión. ¿En cuál?", "f": "Texto original elaborado para este simulacro, caso del cierre de sedes rurales, intervención de la madre de familia", "vis": "", "o": [["A", "En el bienestar y la seguridad de los niños pequeños, por los largos trayectos en vías en mal estado.", "La madre señala que su hijo de seis años tendría que salir a las 5:00 a. m. y recorrer hora y media por una trocha que se daña con la lluvia.", true], ["B", "En la conexión a internet de la institución central.", "La madre no se
