<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulacro 3 · Saber TyT</title>
<style>
:root{--bg:#f7f5f2;--card:#fff;--ink:#1d2433;--mute:#5a6478;--line:#e0dbd4;--pri:#7a2e0b;--pri2:#b0501c;--ok:#0d6b3a;--okbg:#e6f4ec;--no:#9b1c1c;--nobg:#fbeaea;--sel:#f8ece4}
@media (prefers-color-scheme: dark){:root{--bg:#14110f;--card:#1f1a17;--ink:#ece6e1;--mute:#a69c94;--line:#3a322c;--pri:#f0a47a;--pri2:#f5bb98;--ok:#7fd3a3;--okbg:#16301f;--no:#f2a3a3;--nobg:#3a1c1c;--sel:#3a2a20}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overflow-wrap:anywhere}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px}
.hwrap{max-width:860px;margin:0 auto;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;justify-content:space-between}
h1{font-size:17px;margin:0;color:var(--pri)}
h2{color:var(--pri)}
.stat{font-size:14px;color:var(--mute)}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--pri)}
.timer.low{color:var(--no)}
main{max-width:860px;margin:0 auto;padding:16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin:0 0 16px}
.mod{background:var(--pri);color:var(--card);border-radius:10px;padding:10px 14px;margin:28px 0 6px;font-weight:700;font-size:18px}
.inst{font-size:13px;font-weight:700;color:var(--pri);text-transform:uppercase;letter-spacing:.03em;margin:18px 0 4px}
.caso{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--pri);border-radius:10px;padding:14px 16px;margin:10px 0}
.tag{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--pri);font-weight:700}
.caso p{margin:6px 0 0;white-space:pre-line}
.item{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0}
.enun{margin:0 0 8px;white-space:pre-line}
.n{font-weight:700;color:var(--pri)}
.niv{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-right:4px;white-space:nowrap}
.op{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:6px 0;cursor:pointer;background:transparent;width:100%;text-align:left;color:inherit;font:inherit}
.ops8{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.ops8 .op{margin:0}
.op:hover{border-color:var(--pri2)}
.op .l{font-weight:700;min-width:20px}
.op.sel{background:var(--sel);border-color:var(--pri2)}
.op.ok{background:var(--okbg);border-color:var(--ok)}
.op.no{background:var(--nobg);border-color:var(--no)}
.op[disabled]{cursor:default}
.just{font-size:14px;margin:8px 0 0;padding:8px 10px;border-top:1px dashed var(--line)}
.just div{margin:4px 0}
.just .okt{color:var(--ok);font-weight:700}
.just .not{color:var(--no);font-weight:700}
.src{font-size:13px;color:var(--mute);margin-top:6px}
button.btn{background:var(--pri);color:var(--card);border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer}
button.btn.sec{background:transparent;color:var(--pri);border:1px solid var(--pri)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
select{font:inherit;padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);max-width:100%}
table{border-collapse:collapse;width:100%;font-size:15px}
td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.sub td{font-size:13px;color:var(--mute);padding-left:22px}
.vt{width:auto;max-width:100%;margin:10px 0;font-size:14px;display:block;overflow-x:auto}
.vt caption{text-align:left;font-weight:700;padding-bottom:4px}
.vt th,.vt td{border:1px solid var(--line);padding:4px 8px}
.vt th{background:var(--sel)}
.vnota{font-size:12px;color:var(--mute)}
.vfig{margin:10px 0}
.vfig svg{width:100%;max-width:560px;height:auto;border-radius:6px;border:1px solid var(--line);background:#fff}
.big{font-size:40px;font-weight:800;color:var(--pri);line-height:1.1}
.aviso{font-size:13px;color:var(--mute)}
.hide{display:none !important}
.res-ok{color:var(--ok);font-weight:700}.res-no{color:var(--no);font-weight:700}
textarea{width:100%;min-height:320px;font:inherit;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);resize:vertical}
.chk label{display:flex;gap:8px;align-items:flex-start;margin:6px 0;font-size:15px}
.chk input{margin-top:4px;width:18px;height:18px;flex:none}
.modelo{white-space:pre-line;background:var(--bg);border-radius:8px;padding:10px 12px;margin:6px 0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal .panel{max-width:420px}
.nav{padding:6px 0;display:flex;gap:6px;flex-wrap:wrap}
.nav a{font-size:13px;color:var(--pri);border:1px solid var(--line);border-radius:999px;padding:3px 10px;text-decoration:none;background:var(--card)}
footer{max-width:860px;margin:0 auto;padding:8px 16px 40px;font-size:12px;color:var(--mute)}
</style>
</head>

<script>
const DATA = [{"comp": "lectura_critica", "sim": "tyt-3", "ind": "Cuento: la modista y la chaqueta nueva", "tt": "Texto literario", "texto": "El ruedo\n\n(1) La muchacha llegó al taller de Rubiela con una chaqueta nueva en una bolsa de almacén. Todavía tenía la etiqueta colgando.\n\n(2) —Me quedó larga de mangas —dijo—. ¿Cuánto me cobra por subirlas?\n\n(3) Rubiela se puso las gafas, tomó la manga entre los dedos y la volteó. Las costuras estaban hechas a la carrera, con un hilo tan delgado que se veía la tela a través de las puntadas. Pensó en las chaquetas que ella cosía cuando trabajaba en la fábrica de don Ernesto, treinta años atrás, cuando una prenda se hacía para durar lo que durara el dueño.\n\n(4) —Doce mil —dijo.\n\n(5) La muchacha abrió los ojos.\n\n(6) —¿Doce mil? Si la chaqueta me costó cuarenta.\n\n(7) Rubiela no respondió enseguida. Era una cuenta que había oído muchas veces y que nunca sabía cómo contestar sin parecer una vieja amargada. Le habría gustado explicarle que subir una manga no era cortar y ya: había que descoser el puño, medir dos veces, planchar, volver a coser y rematar para que no se soltara con la primera lavada. Que eran casi dos horas de trabajo. Que los doce mil no eran por la chaqueta, sino por las dos horas.\n\n(8) En vez de eso, le pasó la manga.\n\n(9) —Hálela aquí, en la costura.\n\n(10) La muchacha tiró con cuidado. El hilo cedió con un sonido seco, como de papel.\n\n(11) —Ah —dijo.\n\n(12) —Si se la subo, se la subo con hilo bueno —dijo Rubiela—. Y de una vez le refuerzo esta, que ya ve cómo está.\n\n(13) La muchacha se quedó mirando la manga abierta. Después sacó el celular, buscó algo, lo guardó.\n\n(14) —¿Para cuándo me la tiene?\n\n(15) —Para el jueves.\n\n(16) Cuando la muchacha se fue, Rubiela enhebró la aguja con el hilo grueso, el que guardaba en la lata de galletas, y se puso a trabajar. Afuera pasaban buses y vendedores. Ella no levantó la cabeza hasta que la luz de la ventana se puso naranja.", "vis": "", "items": [{"id": "LCT-171", "niv": 1, "cp": "lc_local", "e": "Según el párrafo 7, ¿qué pasos implica subir una manga?", "f": "Texto original elaborado para este simulacro, párrafo 7", "vis": "", "o": [["A", "Cortar la tela sobrante de la manga y coser el borde una sola vez, sin necesidad de planchar.", "Rubiela piensa justamente que subir una manga «no era cortar y ya».", false], ["B", "Reforzar con hilo bueno la costura de la otra manga.", "Rubiela ofrece reforzar una costura como trabajo adicional (párrafo 12); no es uno de los pasos para subir una manga del párrafo 7.", false], ["C", "Soltar el puño, tomar las medidas dos veces, planchar, coser de nuevo y asegurar la costura.", "El párrafo 7 enumera descoser el puño, medir dos veces, planchar, volver a coser y rematar; la opción lo parafrasea.", true], ["D", "Cambiar la tela de la manga por otra más resistente.", "El texto no menciona cambiar la tela; habla de reforzar con hilo bueno.", false]]}, {"id": "LCT-172", "niv": 2, "cp": "lc_global", "e": "¿Por qué Rubiela le pide a la muchacha que hale la manga por la costura (párrafo 9)?", "f": "Texto original elaborado para este simulacro, párrafos 7 a 10", "vis": "", "o": [["A", "Para que vea con sus propios ojos lo débil que es el hilo, sin necesidad de discutir.", "El párrafo 7 dice que le «habría gustado explicarle», y el 8 empieza con «En vez de eso, le pasó la manga»: Rubiela sustituye la explicación por una prueba. El hilo cede «como de papel».", true], ["B", "Para enseñarle a descoser la manga y que ella misma haga el arreglo en su casa.", "Rubiela no le enseña a coser; al final es ella quien hace el trabajo.", false], ["C", "Para demostrarle que la chaqueta estaba bien hecha y que el arreglo era sencillo.", "Ocurre lo contrario: la costura se suelta y queda en evidencia que está mal hecha.", false], ["D", "Para que la muchacha se diera cuenta de que la manga no era tan larga como creía y no valía la pena subirla.", "La prueba no tiene que ver con el largo de la manga, sino con la resistencia del hilo.", false]]}, {"id": "LCT-173", "niv": 1, "cp": "lc_global", "e": "Con la frase «¿Doce mil? Si la chaqueta me costó cuarenta» (párrafo 6), la muchacha da a entender que", "f": "Texto original elaborado para este simulacro, párrafos 6 y 7", "vis": "", "o": [["A", "quiere pagar el arreglo en cuotas porque no tiene el dinero completo.", "El relato no habla de cuotas ni de falta de dinero.", false], ["B", "piensa que la chaqueta valía menos de lo que pagó por ella en el almacén.", "Su frase no discute el precio de la chaqueta, sino el del arreglo.", false], ["C", "cree que Rubiela le está cobrando el valor completo de una chaqueta nueva.", "La muchacha distingue claramente doce mil de cuarenta mil; no cree que le cobren la chaqueta completa.", false], ["D", "el arreglo le parece caro en comparación con el precio de la chaqueta.", "Compara el costo del arreglo (doce mil) con el de la prenda (cuarenta mil) para expresar que le parece demasiado; Rubiela reconoce esa «cuenta» en el párrafo 7.", true]]}, {"id": "LCT-174", "niv": 2, "cp": "lc_reflexion", "e": "Rubiela piensa que «los doce mil no eran por la chaqueta, sino por las dos horas». Esta idea implica que", "f": "Texto original elaborado para este simulacro, párrafo 7", "vis": "", "o": [["A", "la chaqueta tenía un precio injusto porque no incluía el arreglo.", "Rubiela no discute el precio de la chaqueta ni dice que debiera incluir arreglos.", false], ["B", "el valor de un arreglo depende del trabajo que exige y no del precio de la prenda.", "Rubiela responde a la comparación de la muchacha: el cobro corresponde a las casi dos horas de trabajo descritas en el párrafo 7, no a lo que costó la chaqueta.", true], ["C", "Rubiela cobra por horas a otros clientes del taller.", "El texto no informa cómo cobra a otros clientes; la idea se refiere solo a este arreglo.", false], ["D", "las prendas baratas deberían arreglarse gratis en los talleres de barrio.", "Rubiela no plantea arreglos gratuitos; justifica su cobro.", false]]}, {"id": "LCT-175", "niv": 3, "cp": "lc_reflexion", "e": "El recuerdo de la fábrica de don Ernesto (párrafo 3) introduce en el relato un contraste entre", "f": "Texto original elaborado para este simulacro, párrafos 3 y 10", "vis": "", "o": [["A", "un empleo de fábrica bien pagado y un taller propio que no deja ganancias.", "El relato no habla de salarios en la fábrica ni de las ganancias del taller.", false], ["B", "una época en que Rubiela cosía mal y la habilidad que tiene hoy.", "El texto no sugiere que Rubiela cosiera mal; el recuerdo se refiere a la calidad de las prendas.", false], ["C", "prendas hechas para durar y prendas producidas a la carrera con materiales frágiles.", "Rubiela recuerda que antes «una prenda se hacía para durar lo que durara el dueño», justo después de ver costuras «hechas a la carrera» con hilo delgado; el hilo que cede «como de papel» confirma el contraste.", true], ["D", "clientes que antes regateaban mucho y clientes que hoy pagan sin discutir.", "Es al revés en el relato: la muchacha discute el precio, y nada se dice de los clientes de antes.", false]]}]}, {"comp": "lectura_critica", "sim": "tyt-3", "ind": "Ensayo sobre inteligencia artificial y oficios técnicos", "tt": "Texto informativo", "texto": "La herramienta y la mano\n\n(1) Cada vez que aparece una tecnología nueva, reaparece la misma pregunta: ¿qué trabajos van a desaparecer? Hoy la pregunta apunta a la inteligencia artificial, capaz de redactar informes, sugerir diagnósticos a partir de datos y responder consultas de clientes. Para muchos técnicos y tecnólogos, la inquietud es concreta: ¿seguirá habiendo lugar para lo que aprendí?\n\n(2) La historia sugiere una respuesta más matizada que el pánico o el entusiasmo. Cuando los talleres mecánicos empezaron a usar escáneres electrónicos, no desaparecieron los mecánicos; desaparecieron, más bien, algunas tareas, y aparecieron otras: interpretar los códigos del escáner, decidir cuál de varias fallas posibles revisar primero, explicarle al cliente por qué una reparación es necesaria. El escáner indica una falla en el sensor; el mecánico sabe si el problema es el sensor o el cable que llega hasta él.\n\n(3) Algo parecido podría ocurrir ahora. Un sistema de inteligencia artificial puede sugerir un diagnóstico, pero alguien tiene que verificarlo en el equipo real, asumir la responsabilidad de la decisión y responder si algo sale mal. Esa combinación de criterio, experiencia práctica y responsabilidad no se automatiza con facilidad.\n\n(4) Esto no significa que no haya motivos de preocupación. Las tareas más repetitivas —llenar formatos, clasificar solicitudes, redactar reportes rutinarios— sí pueden reducirse, y quienes dependen de ellas necesitarán formarse en otras. El riesgo no es tanto que la tecnología reemplace a las personas, sino que llegue más rápido que las oportunidades para aprender a usarla.\n\n(5) Por eso, la pregunta útil no es si la inteligencia artificial nos quitará el trabajo, sino qué parte de nuestro trabajo cambiará y qué necesitamos aprender para hacer bien la parte nueva. Un técnico que sabe usar estas herramientas, y que sabe cuándo no confiar en ellas, tendrá ventaja sobre quien las rechaza y también sobre quien las obedece sin pensar.", "vis": "", "items": [{"id": "LCT-176", "niv": 1, "cp": "lc_local", "e": "Según el párrafo 4, ¿qué tareas pueden reducirse con la inteligencia artificial?", "f": "Texto original elaborado para este simulacro, párrafo 4", "vis": "", "o": [["A", "Decidir cuál de varias fallas posibles se revisa primero.", "Es otra de las tareas nuevas del mecánico que menciona el párrafo 2.", false], ["B", "Verificar los diagnósticos en el equipo real y asumir la responsabilidad de las decisiones.", "El párrafo 3 presenta estas tareas como difíciles de automatizar.", false], ["C", "Interpretar los códigos del escáner y explicarle al cliente por qué una reparación es necesaria.", "Son tareas que, según el párrafo 2, aparecieron con el escáner; no las que pueden reducirse.", false], ["D", "Diligenciar formularios, ordenar peticiones y escribir informes de rutina.", "El párrafo 4 menciona llenar formatos, clasificar solicitudes y redactar reportes rutinarios; la opción lo parafrasea.", true]]}, {"id": "LCT-177", "niv": 2, "cp": "lc_global", "e": "¿Qué función cumple el ejemplo de los escáneres electrónicos en el párrafo 2?", "f": "Texto original elaborado para este simulacro, párrafo 2", "vis": "", "o": [["A", "Criticar a los mecánicos que se negaron a usar escáneres en sus talleres.", "El párrafo 2 no menciona mecánicos que rechazaran los escáneres.", false], ["B", "Mostrar con un caso pasado que una tecnología puede transformar tareas sin eliminar un oficio.", "El autor lo usa para sostener que «la historia sugiere una respuesta más matizada»: con el escáner no desaparecieron los mecánicos, cambiaron sus tareas.", true], ["C", "Demostrar que los escáneres electrónicos son más confiables que los sistemas de inteligencia artificial.", "El texto no compara la confiabilidad de ambas tecnologías.", false], ["D", "Explicar el funcionamiento técnico de los sensores de los vehículos.", "El sensor aparece como ilustración; el párrafo no explica su funcionamiento.", false]]}, {"id": "LCT-178", "niv": 2, "cp": "lc_global", "e": "Según el párrafo 2, ¿qué diferencia hay entre lo que aporta el escáner y lo que aporta el mecánico?", "f": "Texto original elaborado para este simulacro, párrafo 2", "vis": "", "o": [["A", "El escáner señala una posible falla; el mecánico, con su experiencia, ubica el problema.", "El párrafo dice que el escáner indica una falla en el sensor, pero el mecánico «sabe si el problema es el sensor o el cable que llega hasta él».", true], ["B", "El escáner repara la falla del vehículo; el mecánico la anota en la orden de trabajo.", "El escáner no repara nada; el texto le atribuye solo la indicación de una falla.", false], ["C", "El escáner y el mecánico cumplen la misma función en el taller.", "El párrafo marca una diferencia entre ambos con el ejemplo del sensor y el cable.", false], ["D", "El escáner le explica la falla al cliente; el mecánico decide cuánto se cobra por arreglarla.", "Explicar la reparación al cliente es, según el texto, una tarea del mecánico; el cobro no se menciona.", false]]}, {"id": "LCT-179", "niv": 2, "cp": "lc_reflexion", "e": "Según el párrafo 5, quien «obedece sin pensar» estas herramientas estará en desventaja. ¿Cuál de las siguientes situaciones ejemplifica mejor esa conducta?", "f": "Texto original elaborado para este simulacro, párrafos 3 y 5", "vis": "", "o": [["A", "Un técnico se niega a usar el sistema y diagnostica con sus propios instrumentos.", "Corresponde a quien «rechaza» las herramientas, el otro caso de desventaja que menciona el autor, no a quien las obedece sin pensar.", false], ["B", "Un técnico toma un curso para aprender a usar el sistema en su taller.", "Formarse es lo que el autor recomienda en el párrafo 5.", false], ["C", "Un técnico usa el sistema para obtener posibles diagnósticos y después los comprueba en el equipo.", "Es el uso que el autor valora: usar la herramienta y saber cuándo no confiar en ella.", false], ["D", "Un técnico aplica la reparación que sugiere el sistema sin verificar la falla en el equipo.", "Seguir la sugerencia sin comprobarla en el equipo real es obedecer sin pensar; el párrafo 3 insiste en que alguien debe verificar el diagnóstico.", true]]}, {"id": "LCT-180", "niv": 3, "cp": "lc_reflexion", "e": "Un lector resume así el texto: «Según el autor, la inteligencia artificial no afectará en nada el empleo de los técnicos». Este resumen es inexacto porque", "f": "Texto original elaborado para este simulacro, párrafo 4", "vis": "", "o": [["A", "el autor se refiere principalmente a los mecánicos y no a los técnicos en general.", "El texto habla de técnicos y tecnólogos en general (párrafos 1 y 5); los mecánicos son solo un ejemplo.", false], ["B", "el autor reconoce que ciertas labores rutinarias pueden disminuir y que habrá quien deba reentrenarse.", "El párrafo 4 reconoce «motivos de preocupación»: ciertas tareas sí pueden reducirse y quienes dependen de ellas necesitarán formarse.", true], ["C", "el autor sostiene que la inteligencia artificial reemplazará a buena parte de los técnicos en pocos años.", "El autor rechaza tanto el pánico como el entusiasmo; no anuncia la desaparición de los oficios técnicos.", false], ["D", "el autor afirma que la inteligencia artificial no es capaz de sugerir diagnósticos.", "El párrafo 3 dice lo contrario: «puede sugerir un diagnóstico».", false]]}]}, {"comp": "lectura_critica", "sim": "tyt-3", "ind": "Texto expositivo sobre las finanzas de los negocios pequeños", "tt": "Texto informativo", "texto": "La caja del negocio no es el bolsillo del dueño\n\n(1) En muchos negocios pequeños —una panadería, una miscelánea, un taller de motos— el dinero de las ventas y el de la casa salen del mismo cajón. El dueño paga el arriendo del local con lo que entró en la mañana y, por la tarde, saca de ahí mismo para el mercado familiar. Parece práctico. El problema es que, mezclados así, nadie sabe realmente si el negocio gana o pierde.\n\n(2) Pongamos un ejemplo. Una panadería vende en promedio un millón de pesos diarios. Su dueña ve entrar mucho dinero y siente que le va bien. Pero si no descuenta la harina, el gas, los salarios, el arriendo y los impuestos, ese millón no dice nada sobre su ganancia. Y si además retira cada semana dinero para gastos personales sin anotarlo, cuando llegue una deuda grande no sabrá si el negocio no alcanzó o si fue ella quien gastó de más.\n\n(3) Separar las cuentas no exige contratar a un contador desde el primer día. Basta con tres hábitos. El primero: tener una cuenta o una caja solo para el negocio. El segundo: asignarse un sueldo fijo, aunque sea modesto, y no sacar más de ahí. El tercero: anotar todos los días lo que entra y lo que sale, aunque sea en un cuaderno.\n\n(4) Estos hábitos tienen beneficios que van más allá del orden. Quien sabe cuánto gana puede decidir con fundamento si subir precios, contratar a alguien o pedir un préstamo. Y un banco o una cooperativa que estudia una solicitud de crédito confiará más en un negocio que puede mostrar sus números que en uno que solo puede decir «a mí me va bien».\n\n(5) Ninguno de estos pasos garantiza que el negocio prospere. Pero sin ellos el dueño toma decisiones a ciegas, y en un negocio pequeño una decisión equivocada puede pesar mucho.", "vis": "", "items": [{"id": "LCT-181", "niv": 1, "cp": "lc_local", "e": "Según el párrafo 3, ¿cuáles son los tres hábitos que propone el texto?", "f": "Texto original elaborado para este simulacro, párrafo 3", "vis": "", "o": [["A", "Vender un millón diario, descontar la harina y pagar los impuestos.", "Son datos del ejemplo de la panadería (párrafo 2), no los hábitos propuestos.", false], ["B", "Pagar el arriendo en la mañana, comprar el mercado familiar en la tarde y ahorrar lo que sobre al final de cada mes.", "Pagar el arriendo y comprar el mercado del mismo cajón es la práctica que el texto critica en el párrafo 1.", false], ["C", "Separar el dinero del negocio, fijarse un salario y registrar cada día ingresos y gastos.", "El párrafo 3 propone una cuenta o caja solo para el negocio, un sueldo fijo y anotar a diario lo que entra y sale; la opción lo parafrasea.", true], ["D", "Contratar a un contador, pedir un préstamo y subir los precios.", "El texto dice que no hace falta un contador desde el primer día; subir precios y pedir préstamos son decisiones que los hábitos ayudan a tomar (párrafo 4).", false]]}, {"id": "LCT-182", "niv": 1, "cp": "lc_global", "e": "¿Qué busca mostrar el ejemplo de la panadería en el párrafo 2?", "f": "Texto original elaborado para este simulacro, párrafo 2", "vis": "", "o": [["A", "Que vender mucho no equivale a ganar si no se descuentan los costos ni se anotan los retiros.", "El párrafo explica que el millón diario «no dice nada sobre su ganancia» si no se descuentan los costos, y que los retiros sin anotar impiden saber qué pasó.", true], ["B", "Que la dueña de la panadería gasta demasiado dinero en el mercado de su familia cada semana.", "El ejemplo plantea que, sin registros, ella no sabría si gastó de más; no afirma que lo haga.", false], ["C", "Que las panaderías son los negocios más rentables de un barrio.", "El texto no compara la rentabilidad de distintos negocios.", false], ["D", "Que un millón de pesos diarios es una cifra baja para un negocio de ese tipo.", "El texto no evalúa si la cifra es alta o baja; señala que por sí sola no indica la ganancia.", false]]}, {"id": "LCT-183", "niv": 3, "cp": "lc_global", "e": "¿Cuál de las siguientes opciones describe mejor la organización del texto?", "f": "Texto original elaborado para este simulacro, párrafos 1 a 5", "vis": "", "o": [["A", "Narra la historia de una panadera desde que abre su negocio hasta que este quiebra por las deudas.", "La panadería es un ejemplo hipotético («Pongamos un ejemplo»), no una historia narrada, y no se dice que quiebre.", false], ["B", "Compara dos negocios y concluye cuál de ellos es más rentable.", "El texto no compara negocios ni su rentabilidad.", false], ["C", "Plantea un problema, lo ilustra con un ejemplo, propone soluciones y expone sus beneficios y límites.", "Párrafo 1: el problema de mezclar dineros; 2: el ejemplo de la panadería; 3: los tres hábitos; 4: sus beneficios; 5: su límite («ninguno de estos pasos garantiza…»).", true], ["D", "Presenta una norma legal sobre los negocios y explica las sanciones por incumplirla.", "No se menciona ninguna norma legal ni sanción.", false]]}, {"id": "LCT-184", "niv": 3, "cp": "lc_reflexion", "e": "En el párrafo 5 el autor afirma: «Ninguno de estos pasos garantiza que el negocio prospere». Con esta afirmación, el autor", "f": "Texto original elaborado para este simulacro, párrafo 5", "vis": "", "o": [["A", "admite que los hábitos ayudan a decidir mejor, pero no aseguran el éxito del negocio.", "Reconoce un límite de su propuesta y, a continuación, aclara su valor: sin esos pasos «el dueño toma decisiones a ciegas».", true], ["B", "advierte que, sin la ayuda de un contador, es difícil que un negocio prospere.", "El párrafo 3 dice que separar las cuentas no exige contratar a un contador desde el primer día.", false], ["C", "contradice lo que había afirmado antes sobre los tres hábitos.", "No hay contradicción: matizar el alcance de una propuesta no la niega.", false], ["D", "reconoce que los hábitos que propuso resultan poco útiles para negocios pequeños como una panadería.", "El autor no los considera inútiles; dice que sin ellos se decide a ciegas.", false]]}, {"id": "LCT-185", "niv": 2, "cp": "lc_reflexion", "e": "Un tendero dice: «Yo no necesito anotar nada; sé que me va bien porque todos los días entra plata». Según el texto, este razonamiento es débil porque", "f": "Texto original elaborado para este simulacro, párrafos 2 y 4", "vis": "", "o": [["A", "debería contratar a un contador antes de evaluar cómo le va.", "El párrafo 3 dice que llevar cuentas no exige contratar a un contador desde el primer día; la debilidad del tendero es otra.", false], ["B", "los ingresos de una tienda de barrio suelen ser demasiado bajos para dejar ganancia.", "El texto no se pronuncia sobre el monto de los ingresos de las tiendas; dice que sin registros no se puede saber si hay ganancia.", false], ["C", "anotar las ventas sirve sobre todo para pagar menos impuestos.", "El texto no relaciona los registros con los impuestos; su valor está en saber si el negocio gana y decidir con fundamento.", false], ["D", "confunde el dinero que entra con la ganancia del negocio.", "El párrafo 2 explica que las ventas no dicen nada sobre la ganancia si no se descuentan los costos; ver entrar dinero no prueba que el negocio gane.", true]]}]}, {"comp": "lectura_critica", "sim": "tyt-3", "ind": "Columna sobre los guiones en las líneas de atención al cliente", "tt": "Texto informativo", "texto": "Lea el guion, pero escuche\n\n(1) Quien haya llamado a una línea de atención conoce la sensación: uno explica el problema con detalle y, del otro lado, una voz amable responde con una frase que no tiene nada que ver con lo que acaba de decir. No es mala voluntad. Muchas veces, el asesor está obligado a seguir un guion: una secuencia de frases y preguntas diseñada para que todas las llamadas se atiendan igual.\n\n(2) Los guiones tienen razones de ser. Garantizan que no se olvide un paso importante, como verificar la identidad del usuario, y permiten que una persona recién contratada atienda con seguridad desde el primer día. Además, facilitan medir la calidad: si todos dicen lo mismo, es fácil comparar.\n\n(3) El problema aparece cuando el guion se vuelve más importante que la persona que llama. En algunas empresas, al asesor se le evalúa por cumplir cada frase al pie de la letra y por terminar la llamada en pocos minutos, no por resolver el problema. El resultado es predecible: llamadas cortas, clientes que vuelven a llamar y asesores frustrados porque saben que no ayudaron.\n\n(4) Una alternativa razonable es tratar el guion como un mapa y no como una cárcel: que indique los pasos obligatorios, pero que permita al asesor salirse de las frases fijas para entender el caso. Eso exige confiar en el criterio de los asesores y formarlos para que lo tengan. También exige cambiar lo que se mide: menos minutos por llamada y más problemas resueltos en el primer contacto.\n\n(5) Al final, un cliente no recuerda si le dijeron la frase de bienvenida completa. Recuerda si colgó con su problema resuelto.", "vis": "", "items": [{"id": "LCT-186", "niv": 1, "cp": "lc_local", "e": "Según el párrafo 2, ¿qué ventaja ofrecen los guiones a una persona recién contratada?", "f": "Texto original elaborado para este simulacro, párrafo 2", "vis": "", "o": [["A", "La liberan de tener que verificar la identidad del usuario.", "Al contrario: el guion garantiza que no se olvide ese paso.", false], ["B", "Hacen que pueda atender con confianza aunque apenas esté empezando.", "El párrafo 2 dice que los guiones permiten que una persona recién contratada atienda con seguridad desde el primer día; la opción lo parafrasea.", true], ["C", "Le permiten terminar cada llamada en pocos minutos y recibir una buena evaluación.", "La duración corta aparece en el párrafo 3 como criterio de evaluación criticado, no como ventaja para el personal nuevo.", false], ["D", "Le aseguran una evaluación más alta que la de los asesores con experiencia.", "El texto no compara evaluaciones entre asesores nuevos y antiguos.", false]]}, {"id": "LCT-187", "niv": 2, "cp": "lc_global", "e": "¿Qué relación hay entre los párrafos 2 y 3?", "f": "Texto original elaborado para este simulacro, párrafos 2 y 3", "vis": "", "o": [["A", "El 2 presenta la propuesta del autor y el 3, sus beneficios.", "La propuesta del autor aparece en el párrafo 4.", false], ["B", "El 2 critica los guiones y el 3 los defiende con ejemplos.", "Invierte la relación: el 2 los justifica y el 3 señala su problema.", false], ["C", "El 2 expone las ventajas de los guiones y el 3, el problema que surge cuando se aplican con rigidez.", "El párrafo 2 empieza con «Los guiones tienen razones de ser» y el 3 con «El problema aparece cuando el guion se vuelve más importante que la persona».", true], ["D", "El 2 narra una llamada real y el 3 la analiza con datos de varias empresas del sector de las telecomunicaciones.", "Ninguno de los dos párrafos narra una llamada ni presenta datos.", false]]}, {"id": "LCT-188", "niv": 1, "cp": "lc_global", "e": "La expresión «tratar el guion como un mapa y no como una cárcel» (párrafo 4) significa", "f": "Texto original elaborado para este simulacro, párrafo 4", "vis": "", "o": [["A", "usar el guion para orientar los pasos necesarios, sin que impida adaptarse a cada caso.", "El mismo párrafo lo explica: que el guion «indique los pasos obligatorios, pero que permita al asesor salirse de las frases fijas para entender el caso».", true], ["B", "eliminar los guiones y permitir que cada asesor improvise libremente sus respuestas.", "El autor no propone eliminar el guion: el mapa sigue indicando los pasos obligatorios.", false], ["C", "obligar a los asesores a memorizar el guion completo antes de atender su primera llamada.", "Eso haría el guion aún más rígido, lo contrario de lo que propone la metáfora.", false], ["D", "usar el guion principalmente con los clientes que llaman por primera vez.", "El texto no distingue entre clientes nuevos y antiguos.", false]]}, {"id": "LCT-189", "niv": 3, "cp": "lc_reflexion", "e": "¿Qué supuesto sustenta la propuesta de medir «menos minutos por llamada y más problemas resueltos en el primer contacto»?", "f": "Texto original elaborado para este simulacro, párrafos 3 y 4", "vis": "", "o": [["A", "Que los asesores con experiencia necesitan menos formación que los nuevos.", "El texto no compara necesidades de formación; pide formar a los asesores para que tengan criterio.", false], ["B", "Que los clientes prefieren las llamadas largas a las cortas, aunque su problema no se resuelva.", "El párrafo 5 dice que al cliente le importa colgar con su problema resuelto, no la duración.", false], ["C", "Que verificar la identidad del usuario es un paso innecesario.", "El autor valora ese paso (párrafo 2) y quiere que el guion conserve los pasos obligatorios.", false], ["D", "Que lo que se mide orienta la manera en que los asesores hacen su trabajo.", "El párrafo 3 muestra que evaluar por duración produce llamadas cortas sin solución; el autor supone que, si se mide la solución, el trabajo se orientará a resolver.", true]]}]}, {"comp": "lectura_critica", "sim": "tyt-3", "ind": "Cómic sobre el uso del casco en una obra", "tt": "Caricatura o cómic", "texto": "Cómic: «Solo un minuto»\n\nViñeta 1: Entrada de una obra en construcción. Un letrero grande dice: «Uso obligatorio de casco». Un obrero joven, sin casco, le dice a su compañero, que sí lo lleva puesto: «Solo voy a subir un minuto a buscar el metro».\n\nViñeta 2: El obrero sube por la escalera de un andamio. Desde un piso más alto, otro trabajador grita: «¡Cuidado abajo!».\n\nViñeta 3: Un balde de plástico vacío cae y rebota en la cabeza del obrero con un sonoro «¡TONC!». El obrero, aturdido, ve estrellitas alrededor de su cabeza.\n\nViñeta 4: Puesto de primeros auxilios de la obra. El obrero está sentado, con un chichón en la frente y una bolsa de hielo en la cabeza. Su compañero, con casco, le dice: «Tuviste suerte: era el balde vacío». El obrero responde: «El minuto más largo de mi vida».", "vis": "", "items": [{"id": "LCT-190", "niv": 1, "cp": "lc_local", "e": "Según la viñeta 1, ¿qué justificación da el obrero para subir sin casco?", "f": "Texto original elaborado para este simulacro, viñeta 1", "vis": "", "o": [["A", "Que su compañero le dijo que no era necesario.", "El compañero no dice nada en la viñeta 1; además, él sí lleva casco.", false], ["B", "Que solo tardará un minuto en buscar el metro.", "En la viñeta 1 dice: «Solo voy a subir un minuto a buscar el metro»; justifica no ponerse el casco por la brevedad de la tarea.", true], ["C", "Que el letrero se refería a los trabajos en el primer piso.", "El letrero dice «Uso obligatorio de casco», sin limitarlo a un piso, y el obrero no menciona el letrero.", false], ["D", "Que su casco estaba dañado y no había otro disponible en la obra.", "El cómic no menciona ningún casco dañado.", false]]}, {"id": "LCT-191", "niv": 1, "cp": "lc_global", "e": "¿Qué relación hay entre el letrero de la viñeta 1 y lo que ocurre en la viñeta 3?", "f": "Texto original elaborado para este simulacro, viñetas 1 y 3", "vis": "", "o": [["A", "El letrero causa el accidente, porque distrae al obrero mientras sube por el andamio.", "El letrero está en la entrada; el accidente lo causa el balde que cae, no una distracción por el letrero.", false], ["B", "La viñeta 3 muestra el riesgo que el letrero buscaba prevenir.", "El letrero exige casco; en la viñeta 3, un objeto cae sobre la cabeza del obrero que no lo lleva: es el tipo de accidente que la norma pretende evitar.", true], ["C", "El accidente ocurre aunque el obrero cumplió lo que pedía el letrero.", "El obrero no cumplió: subió sin casco.", false], ["D", "El accidente demuestra que el letrero estaba ubicado en un lugar donde nadie podía leerlo.", "El obrero pasa junto al letrero; nada indica que no pudiera leerse.", false]]}, {"id": "LCT-192", "niv": 2, "cp": "lc_global", "e": "¿Qué sentido tiene la respuesta final del obrero, «El minuto más largo de mi vida»?", "f": "Texto original elaborado para este simulacro, viñetas 1 y 4", "vis": "", "o": [["A", "Explica que el obrero no recuerda lo que le pasó.", "La frase muestra que sí recuerda lo ocurrido y lo comenta.", false], ["B", "Muestra que el obrero está enojado con su compañero por no haberle avisado del peligro.", "El aviso lo dio otro trabajador («¡Cuidado abajo!»); la frase no expresa enojo con el compañero.", false], ["C", "Reconoce, con ironía, que su «minuto» resultó mucho más costoso de lo que creía.", "En la viñeta 1 justificó no usar casco porque sería «solo un minuto»; al final ese minuto terminó en un golpe y en primeros auxilios, y él mismo lo reconoce con ironía.", true], ["D", "Indica que el obrero tardó exactamente un minuto en recibir atención en el puesto de primeros auxilios.", "Es una lectura literal; la frase no mide el tiempo de atención.", false]]}, {"id": "LCT-193", "niv": 2, "cp": "lc_reflexion", "e": "En la viñeta 4, el compañero dice: «Tuviste suerte: era el balde vacío». Esta frase sugiere que", "f": "Texto original elaborado para este simulacro, viñeta 4", "vis": "", "o": [["A", "el obrero debió atrapar el balde con las manos.", "Nada en la frase ni en el cómic plantea esa idea.", false], ["B", "el balde vacío no le causó ninguna lesión al obrero.", "El cómic lo contradice: el obrero tiene un chichón y recibe primeros auxilios.", false], ["C", "el compañero se burla del obrero porque el accidente fue de poca importancia.", "La frase destaca que pudo ser peor, no que el accidente careciera de importancia.", false], ["D", "las consecuencias habrían sido mucho más graves si hubiera caído algo pesado.", "Hablar de «suerte» porque el balde estaba vacío implica que un objeto más pesado habría causado una lesión mayor que un chichón.", true]]}, {"id": "LCT-194", "niv": 3, "cp": "lc_reflexion", "e": "¿Cuál es el mensaje principal del cómic?", "f": "Texto original elaborado para este simulacro, viñetas 1 a 4", "vis": "", "o": [["A", "Las normas de seguridad deben cumplirse aun en las tareas que parecen breves.", "Toda la historia gira en torno a la excusa «solo un minuto»: una tarea corta fue suficiente para que ocurriera el accidente que el casco habría evitado.", true], ["B", "Los andamios son tan peligrosos que deberían prohibirse en las obras de construcción.", "El cómic no culpa al andamio; el problema es subir sin casco.", false], ["C", "Los trabajadores de los pisos altos deben responder por los accidentes que causan los objetos que caen.", "El cómic no culpa al trabajador de arriba, que incluso avisa del peligro; el foco está en que el obrero subió sin casco.", false], ["D", "El casco es más necesario en los trabajos largos que en los cortos.", "El cómic muestra lo contrario: el accidente ocurre en una tarea de «un minuto».", false]]}]}, {"comp": "lectura_critica", "sim": "tyt-3", "ind": "Etiquetas nutricionales de dos bebidas lácteas", "tt": "Texto discontinuo", "texto": "Información de las etiquetas de dos bebidas lácteas (marcas ficticias) que se venden en un supermercado. En el frente del empaque del producto B aparece, en letras grandes, la palabra «LIGHT» y, debajo, en letra más pequeña: «menos grasa».", "vis": "<table class=\"vt\"><caption>Información nutricional por porción de 200 mL<\/caption><thead><tr><th>Componente<\/th><th>Producto A: kumis natural<\/th><th>Producto B: kumis sabor a fresa «light»<\/th><\/tr><\/thead><tbody><tr><td>Calorías<\/td><td>120 kcal<\/td><td>110 kcal<\/td><\/tr><tr><td>Grasa total<\/td><td>6 g<\/td><td>2 g<\/td><\/tr><tr><td>Azúcares totales<\/td><td>9 g<\/td><td>14 g<\/td><\/tr><tr><td>Azúcares añadidos<\/td><td>0 g<\/td><td>6 g<\/td><\/tr><tr><td>Proteína<\/td><td>7 g<\/td><td>5 g<\/td><\/tr><tr><td>Sodio<\/td><td>95 mg<\/td><td>90 mg<\/td><\/tr><tr><td>Precio del envase de 1 L<\/td><td>$ 6.800<\/td><td>$ 7.400<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Productos y datos ficticios.<\/div>", "items": [{"id": "LCT-195", "niv": 1, "cp": "lc_local", "e": "Según la tabla, ¿cuántos gramos de azúcares añadidos tiene una porción del producto B?", "f": "Texto original elaborado para este simulacro, tabla, fila Azúcares añadidos", "vis": "", "o": [["A", "0 g.", "Es el valor de azúcares añadidos del producto A.", false], ["B", "6 g.", "La fila «Azúcares añadidos» indica 6 g para el producto B.", true], ["C", "9 g.", "Son los azúcares totales del producto A.", false], ["D", "14 g.", "Son los azúcares totales del producto B, no los añadidos.", false]]}, {"id": "LCT-196", "niv": 2, "cp": "lc_local", "e": "¿En cuál de los siguientes componentes el producto B tiene un valor MAYOR que el producto A?", "f": "Texto original elaborado para este simulacro, tabla", "vis": "", "o": [["A", "Sodio.", "B tiene 90 mg de sodio y A, 95 mg: B tiene menos.", false], ["B", "Calorías.", "B tiene 110 kcal y A, 120 kcal: B tiene menos.", false], ["C", "Proteína.", "B tiene 5 g de proteína y A, 7 g: B tiene menos.", false], ["D", "Azúcares totales.", "B tiene 14 g de azúcares totales y A, 9 g.", true]]}, {"id": "LCT-197", "niv": 2, "cp": "lc_global", "e": "Una persona a quien le recomendaron reducir el consumo de azúcar elige el producto B porque dice «light». Según la tabla, su elección", "f": "Texto original elaborado para este simulacro, tabla y texto del empaque", "vis": "", "o": [["A", "es acertada, porque B tiene menos calorías por porción que A.", "Es cierto que B tiene menos calorías, pero el objetivo es reducir el azúcar, y en eso B es peor.", false], ["B", "es acertada, porque la palabra «light» indica que el producto no contiene azúcar.", "El empaque aclara «menos grasa»; la tabla muestra que B sí tiene azúcar, incluso añadida.", false], ["C", "no es acertada, porque B tiene más azúcares totales y añadidos que A.", "B tiene 14 g de azúcares totales y 6 g añadidos; A tiene 9 g y 0 g. Para reducir el azúcar, A es mejor opción.", true], ["D", "no es acertada, porque B tiene más sodio por porción que el producto A.", "Falso: B tiene 90 mg de sodio y A, 95 mg.", false]]}, {"id": "LCT-198", "niv": 3, "cp": "lc_reflexion", "e": "¿Qué efecto puede producir en un comprador que la palabra «LIGHT» aparezca en letras grandes y la aclaración «menos grasa» en letra pequeña?", "f": "Texto original elaborado para este simulacro, texto del empaque y tabla", "vis": "", "o": [["A", "Hacerle creer que el producto es más saludable en general, incluso en azúcar.", "La palabra destacada sugiere un producto «ligero» en general, mientras que la aclaración pequeña limita la ventaja a la grasa; la tabla muestra que B tiene más azúcar que A.", true], ["B", "Indicarle que el producto B es más barato que el producto A.", "La palabra no se refiere al precio y, además, B es más caro ($ 7.400 frente a $ 6.800).", false], ["C", "Informarle con precisión que el producto B tiene menos azúcar que el A.", "Falso según la tabla: B tiene más azúcar que A.", false], ["D", "Advertirle de manera clara que el producto B contiene azúcares añadidos.", "El frente del empaque no menciona el azúcar; ese dato solo está en la tabla.", false]]}]}, {"comp": "lectura_critica", "sim": "tyt-3", "ind": "Infografía sobre el consumo de energía de electrodomésticos", "tt": "Texto discontinuo", "texto": "Infografía de una empresa de energía (ficticia): «¿Cuánto consume cada aparato en un hogar?». El consumo mensual de cada aparato se calcula así: potencia (W) × horas de uso al día × 30 días ÷ 1.000. El resultado se expresa en kilovatios hora (kWh), la unidad que aparece en la factura.", "vis": "<table class=\"vt\"><caption>Consumo estimado de un hogar en un mes<\/caption><thead><tr><th>Aparato<\/th><th>Potencia (W)<\/th><th>Horas de uso al día<\/th><th>Consumo al mes (kWh)<\/th><\/tr><\/thead><tbody><tr><td>Ducha eléctrica<\/td><td>3.500<\/td><td>0,4<\/td><td>42<\/td><\/tr><tr><td>Nevera (tiempo de funcionamiento del motor)<\/td><td>150<\/td><td>8<\/td><td>36<\/td><\/tr><tr><td>Televisor<\/td><td>100<\/td><td>5<\/td><td>15<\/td><\/tr><tr><td>Plancha<\/td><td>1.000<\/td><td>0,5<\/td><td>15<\/td><\/tr><tr><td>Computador portátil<\/td><td>60<\/td><td>8<\/td><td>14,4<\/td><\/tr><tr><td>Bombillo LED<\/td><td>10<\/td><td>5<\/td><td>1,5<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Datos ficticios con fines educativos.<\/div>", "items": [{"id": "LCT-199", "niv": 1, "cp": "lc_local", "e": "Según la tabla, ¿qué aparato tiene la mayor potencia?", "f": "Texto original elaborado para este simulacro, tabla, columna Potencia", "vis": "", "o": [["A", "La plancha.", "La plancha tiene 1.000 W, menos que la ducha.", false], ["B", "La nevera.", "La nevera tiene 150 W; es el segundo aparato que más consume al mes, pero no el de mayor potencia.", false], ["C", "La ducha eléctrica.", "La ducha tiene 3.500 W, la potencia más alta de la tabla.", true], ["D", "El computador portátil.", "El portátil tiene 60 W.", false]]}, {"id": "LCT-200", "niv": 2, "cp": "lc_global", "e": "La plancha tiene diez veces más potencia que el televisor y, sin embargo, ambos consumen 15 kWh al mes. Según la infografía, esto se explica porque", "f": "Texto original elaborado para este simulacro, fórmula y tabla; cálculo propio", "vis": "", "o": [["A", "la plancha se usa al día la décima parte del tiempo que el televisor.", "La plancha se usa 0,5 horas al día y el televisor 5 horas: 1.000 × 0,5 = 100 × 5, por lo que ambos dan 15 kWh al mes con la fórmula de la infografía.", true], ["B", "el televisor tiene en realidad más potencia que la plancha.", "Falso: el televisor tiene 100 W y la plancha 1.000 W.", false], ["C", "el consumo de la plancha se calcula con una unidad diferente a la del televisor.", "Todos los consumos se expresan en kWh y se calculan con la misma fórmula.", false], ["D", "la plancha se usa sobre todo los fines de semana, mientras que el televisor se usa a diario.", "La fórmula usa 30 días para todos los aparatos; la tabla no menciona fines de semana.", false]]}, {"id": "LCT-201", "niv": 3, "cp": "lc_global", "e": "Una familia quiere reducir su consumo de energía. Según la tabla, ¿cuál de las siguientes medidas produciría el mayor ahorro mensual?", "f": "Texto original elaborado para este simulacro, tabla; cálculo propio", "vis": "", "o": [["A", "Ver televisión la mitad del tiempo que la ven ahora.", "El televisor consume 15 kWh; usarlo la mitad del tiempo ahorra 7,5 kWh.", false], ["B", "Reducir a la mitad el tiempo diario de uso de la ducha eléctrica.", "La ducha consume 42 kWh; reducir su uso a la mitad ahorra 21 kWh, más que cualquiera de las otras medidas (7,5; 3,6 y 1,5 kWh).", true], ["C", "Dejar de usar por completo el bombillo LED.", "El bombillo LED solo consume 1,5 kWh al mes; es el ahorro más pequeño.", false], ["D", "Usar el computador portátil dos horas menos al día.", "Ahorra 60 × 2 × 30 ÷ 1.000 = 3,6 kWh al mes.", false]]}, {"id": "LCT-202", "niv": 3, "cp": "lc_reflexion", "e": "Un vendedor afirma: «Este aparato gasta poco porque es de baja potencia». Según la infografía, esta afirmación está incompleta porque", "f": "Texto original elaborado para este simulacro, fórmula y tabla", "vis": "", "o": [["A", "los aparatos de baja potencia suelen consumir más energía que los de alta potencia.", "La tabla no muestra esa tendencia: la ducha, la de mayor potencia, es la que más consume; lo que cuenta es la combinación de potencia y horas.", false], ["B", "el consumo depende sobre todo del precio del kWh que aparece en la factura.", "El precio del kWh influye en lo que se paga, no en la energía consumida; la fórmula usa potencia y horas de uso.", false], ["C", "la potencia de un aparato influye poco en la energía que consume cada mes.", "La potencia es uno de los factores de la fórmula; el problema de la afirmación es que no es el único.", false], ["D", "el consumo también depende de cuántas horas al día se usa el aparato.", "La fórmula multiplica la potencia por las horas de uso: la nevera, con solo 150 W, consume más que la plancha de 1.000 W porque funciona más horas.", true]]}]}, {"comp": "lectura_critica", "sim": "tyt-3", "ind": "Aviso de convocatoria para un cargo técnico", "tt": "Texto discontinuo", "texto": "Aviso de convocatoria publicado por una empresa de servicios técnicos (ficticia) en una bolsa de empleo.", "vis": "<table class=\"vt\"><caption>Se busca: técnico(a) en mantenimiento de equipos de refrigeración<\/caption><thead><tr><th>Aspecto<\/th><th>Detalle<\/th><\/tr><\/thead><tbody><tr><td>Requisitos<\/td><td>Título de técnico o tecnólogo en refrigeración, electricidad o electromecánica. Experiencia mínima de 1 año, certificada. Licencia de conducción de moto (deseable, no obligatoria).<\/td><\/tr><tr><td>Funciones<\/td><td>Mantenimiento preventivo y correctivo de neveras y cuartos fríos de clientes comerciales. Elaboración de reportes de servicio. Atención de emergencias por turnos.<\/td><\/tr><tr><td>Condiciones<\/td><td>Contrato a término indefinido. Salario de $ 2.400.000 más auxilio de transporte. Horario de lunes a sábado y disponibilidad un domingo al mes.<\/td><\/tr><tr><td>Cómo aplicar<\/td><td>Enviar la hoja de vida y los certificados laborales antes del 15 de febrero. Solo se contactará a los preseleccionados.<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Aviso ficticio elaborado para este simulacro.<\/div>", "items": [{"id": "LCT-203", "niv": 1, "cp": "lc_local", "e": "Según el aviso, ¿hasta cuándo se pueden enviar la hoja de vida y los certificados?", "f": "Texto original elaborado para este simulacro, aviso, fila Cómo aplicar", "vis": "", "o": [["A", "Antes del 15 de febrero.", "La fila «Cómo aplicar» lo indica expresamente.", true], ["B", "Hasta el 15 de marzo.", "El aviso fija como límite el 15 de febrero, no el 15 de marzo.", false], ["C", "Hasta que la empresa contacte a los preseleccionados.", "El aviso fija una fecha límite; el contacto a preseleccionados ocurre después.", false], ["D", "Hasta el día de la entrevista.", "El aviso no menciona entrevistas; fija una fecha límite: antes del 15 de febrero.", false]]}, {"id": "LCT-204", "niv": 2, "cp": "lc_global", "e": "Andrés es tecnólogo en electromecánica, tiene 2 años de experiencia certificada y no tiene licencia de conducción de moto. Según el aviso, Andrés", "f": "Texto original elaborado para este simulacro, aviso, fila Requisitos", "vis": "", "o": [["A", "no puede aplicar, porque el cargo exige un título específico en refrigeración.", "El aviso acepta títulos en refrigeración, electricidad o electromecánica.", false], ["B", "no puede aplicar, porque la licencia de conducción de moto es un requisito obligatorio.", "El aviso dice expresamente que la licencia es «deseable, no obligatoria».", false], ["C", "cumple los requisitos obligatorios del cargo, aunque no tenga licencia.", "Su título está entre los aceptados, su experiencia certificada supera el mínimo de 1 año y la licencia de moto es «deseable, no obligatoria».", true], ["D", "cumple los requisitos, pero sin licencia de moto no podría atender las emergencias por turnos.", "El aviso no limita las funciones según la licencia ni según el título.", false]]}, {"id": "LCT-205", "niv": 2, "cp": "lc_reflexion", "e": "¿Con qué propósito incluye el aviso la frase «Solo se contactará a los preseleccionados»?", "f": "Texto original elaborado para este simulacro, aviso, fila Cómo aplicar", "vis": "", "o": [["A", "Informar que la empresa llamará a cada aspirante para comunicarle el resultado.", "Contradice la palabra «solo»: no todos los aspirantes serán contactados.", false], ["B", "Indicar que las entrevistas del proceso se harán por teléfono.", "El aviso no dice cómo serán las entrevistas.", false], ["C", "Aclarar que la empresa únicamente acepta hojas de vida de personas recomendadas por sus empleados.", "El aviso no menciona recomendaciones; cualquiera puede enviar su hoja de vida.", false], ["D", "Anticipar que los aspirantes no elegidos en la primera selección no serán llamados.", "Si solo se contacta a los preseleccionados, los demás aspirantes no serán contactados; la frase les anticipa esa situación.", true]]}]}, {"comp": "razonamiento_cuantitativo", "sim": "tyt-3", "ind": "Aumento de precios en una tienda de barrio", "tt": "", "texto": "El dueño de una tienda de barrio comparó los precios de cuatro productos en 2025 y en 2026. La tabla 1 muestra los datos.", "vis": "<table class=\"vt\"><caption>Tabla 1. Precios de cuatro productos<\/caption><thead><tr><th>Producto<\/th><th>Precio 2025<\/th><th>Precio 2026<\/th><\/tr><\/thead><tbody><tr><td>Arroz (1 kg)<\/td><td>$ 4.000<\/td><td>$ 4.600<\/td><\/tr><tr><td>Aceite (1 L)<\/td><td>$ 12.000<\/td><td>$ 13.440<\/td><\/tr><tr><td>Café (500 g)<\/td><td>$ 18.000<\/td><td>$ 19.800<\/td><\/tr><tr><td>Panela (1 kg)<\/td><td>$ 3.000<\/td><td>$ 3.240<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Datos ficticios.<\/div>", "items": [{"id": "RCT-301", "niv": 1, "cp": "rc_interpretacion", "e": "¿Qué producto tuvo el mayor aumento de precio en pesos?", "f": "Cálculo propio a partir de los datos del caso (datos ficticios).", "vis": "", "o": [["A", "Arroz.", "Su precio subió $ 600 (de 4.000 a 4.600); tuvo el mayor aumento porcentual, no el mayor en pesos.", false], ["B", "Café.", "Su precio subió 19.800 − 18.000 = $ 1.800, el mayor aumento en pesos.", true], ["C", "Aceite.", "Su precio subió $ 1.440, menos que el del café.", false], ["D", "Panela.", "Su precio subió solo $ 240.", false]]}, {"id": "RCT-302", "niv": 2, "cp": "rc_interpretacion", "e": "¿Qué producto tuvo el mayor aumento porcentual de precio?", "f": "Cálculo propio a partir de los datos del caso (datos ficticios).", "vis": "", "o": [["A", "Café.", "Tuvo el mayor aumento en pesos, pero en porcentaje fue 1.800 ÷ 18.000 = 10 %.", false], ["B", "Arroz.", "Subió 600 ÷ 4.000 = 15 %, el mayor porcentaje (aceite 12 %, café 10 %, panela 8 %).", true], ["C", "Panela.", "Subió 240 ÷ 3.000 = 8 %, el menor porcentaje.", false], ["D", "Aceite.", "Subió 1.440 ÷ 12.000 = 12 %, menos que el arroz.", false]]}, {"id": "RCT-303", "niv": 3, "cp": "rc_argumentacion", "e": "Un cliente compra cada mes una unidad de cada uno de los cuatro productos. Él afirma: «Mi gasto en estos productos aumentó 11,25 %, porque ese es el promedio de los aumentos porcentuales de los cuatro productos». ¿Es correcta su afirmación?", "f": "Cálculo propio a partir de los datos del caso (datos ficticios).", "vis": "", "o": [["A", "Sí, porque compra una unidad de cada producto, así que cada aumento pesa lo mismo.", "Comprar una unidad de cada uno no hace que pesen igual: el café ($ 18.000) pesa mucho más que la panela ($ 3.000).", false], ["B", "Sí, porque el gasto sube $ 4.080, y 4.080 ÷ 37.000 ≈ 11,25 %.", "Error de cálculo: 4.080 ÷ 37.000 ≈ 0,110, es decir, 11,0 %.", false], ["C", "No, porque cada producto subió un porcentaje distinto, y así no se puede calcular el aumento total.", "Sí se puede calcular: basta comparar el gasto total de 2025 (37.000) con el de 2026 (41.080), lo que da cerca de 11,0 %.", false], ["D", "No, porque su gasto pasó de $ 37.000 a $ 41.080: subió cerca de 11,0 %.", "Gasto 2025: 37.000; gasto 2026: 41.080; aumento: 4.080 ÷ 37.000 ≈ 11,0 %. El promedio simple de porcentajes no pondera los precios.", true]]}, {"id": "RCT-304", "niv": 2, "cp": "rc_formulacion", "e": "Si en 2027 el precio del arroz vuelve a subir 15 % con respecto al de 2026, ¿cuál será su precio?", "f": "Cálculo propio a partir de los datos del caso (datos ficticios).", "vis": "", "o": [["A", "$ 690", "Es solo el aumento (15 % de 4.600); falta sumarlo al precio de 2026.", false], ["B", "$ 5.200", "Suma otra vez $ 600, el aumento de 2026; el 15 % se calcula ahora sobre $ 4.600.", false], ["C", "$ 5.290", "4.600 × 1,15 = 5.290.", true], ["D", "$ 5.980", "Aplica 30 % al precio de 2026 (4.600 × 1,30), sumando los dos aumentos.", false]]}]}, {"comp": "razonamiento_cuantitativo", "sim": "tyt-3", "ind": "Pintura de una pared", "tt": "", "texto": "Un pintor debe pintar una pared rectangular de 6 m de largo y 2,5 m de alto. En la pared hay una ventana de 1,5 m de ancho por 1,2 m de alto y una puerta de 0,9 m de ancho por 2 m de alto, que no se pintan. La figura muestra un esquema de la pared.", "vis": "<div class=\"vfig\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 380 200\" font-family=\"Arial\" font-size=\"13\"><rect width=\"380\" height=\"200\" fill=\"#ffffff\"/><rect x=\"40\" y=\"30\" width=\"300\" height=\"125\" fill=\"#eef3f9\" stroke=\"#222\" stroke-width=\"2.5\"/><rect x=\"90\" y=\"65\" width=\"75\" height=\"60\" fill=\"#ffffff\" stroke=\"#222\" stroke-width=\"2\"/><text x=\"127.5\" y=\"100\" text-anchor=\"middle\" fill=\"#111\">Ventana<\/text><rect x=\"240\" y=\"55\" width=\"45\" height=\"100\" fill=\"#ffffff\" stroke=\"#222\" stroke-width=\"2\"/><text x=\"262.5\" y=\"110\" text-anchor=\"middle\" fill=\"#111\" font-size=\"12\">Puerta<\/text><text x=\"190\" y=\"175\" text-anchor=\"middle\" fill=\"#111\">6 m<\/text><text x=\"34\" y=\"97\" text-anchor=\"end\" fill=\"#111\">2,5 m<\/text><\/svg><\/div>", "items": [{"id": "RCT-305", "niv": 1, "cp": "rc_formulacion", "e": "¿Cuál es el área de la pared que se debe pintar?", "f": "Cálculo propio a partir de los datos del caso (datos ficticios).", "vis": "", "o": [["A", "11,4 m².", "Pared: 6 × 2,5 = 15 m²; ventana: 1,5 × 1,2 = 1,8 m²; puerta: 0,9 × 2 = 1,8 m²; 15 − 1,8 − 1,8 = 11,4 m².", true], ["B", "13,2 m².", "Resta solo una de las dos aberturas (15 − 1,8).", false], ["C", "15 m².", "Es el área total de la pared, sin descontar la ventana ni la puerta.", false], ["D", "18,6 m².", "Suma las áreas de la ventana y la puerta en lugar de restarlas.", false]]}, {"id": "RCT-306", "niv": 3, "cp": "rc_formulacion", "e": "La pared necesita dos manos de pintura. Un galón alcanza para cubrir 12 m² con una mano y solo se venden galones completos. ¿Cuántos galones debe comprar el pintor, como mínimo?", "f": "Cálculo propio a partir de los datos del caso (datos ficticios).", "vis": "", "o": [["A", "1 galón.", "Alcanza para una sola mano (11,4 m²), pero se necesitan dos manos: 22,8 m².", false], ["B", "2 galones.", "Dos manos: 2 × 11,4 = 22,8 m²; 22,8 ÷ 12 = 1,9 galones, así que se compran 2 galones.", true], ["C", "3 galones.", "No descuenta la ventana ni la puerta: 2 × 15 = 30 m², 30 ÷ 12 = 2,5, es decir, 3 galones.", false], ["D", "4 galones.", "Suma las aberturas en lugar de restarlas: 2 × 18,6 = 37,2 m², 37,2 ÷ 12 = 3,1, es decir, 4 galones.", false]]}]}, {"comp": "razonamiento_cuantitativo", "sim": "tyt-3", "ind": "Encuesta de satisfacción en un taller", "tt": "", "texto": "Un taller de mecánica automotriz encuestó a 240 clientes sobre su satisfacción con el servicio. Cada cliente escogió una sola respuesta. La gráfica 1 muestra los resultados en porcentaje.", "vis": "<div class=\"vfig\"><svg class=\"vg\" viewBox=\"0 0 560 320\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Gráfica 1. Satisfacción de los clientes\" font-family=\"Arial, sans-serif\" font-size=\"12\"><rect width=\"560\" height=\"320\" fill=\"#ffffff\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"13\" fill=\"#1d2433\">Gráfica 1. Satisfacción de los clientes<\/text><path d=\"M170,175 L170.0,60.0 A115,115 0 0,1 263.0,242.6 Z\" fill=\"#1660a8\" stroke=\"#fff\" stroke-width=\"1.5\"/><path d=\"M170,175 L263.0,242.6 A115,115 0 0,1 55.0,175.0 Z\" fill=\"#d9822b\" stroke=\"#fff\" stroke-width=\"1.5\"/><path d=\"M170,175 L55.0,175.0 A115,115 0 0,1 102.4,82.0 Z\" fill=\"#2e8b57\" stroke=\"#fff\" stroke-width=\"1.5\"/><path d=\"M170,175 L102.4,82.0 A115,115 0 0,1 170.0,60.0 Z\" fill=\"#8e44ad\" stroke=\"#fff\" stroke-width=\"1.5\"/><rect x=\"320\" y=\"59\" width=\"14\" height=\"14\" fill=\"#1660a8\"/><text x=\"340\" y=\"70\" fill=\"#1d2433\">Muy satisfecho: 35 %<\/text><rect x=\"320\" y=\"83\" width=\"14\" height=\"14\" fill=\"#d9822b\"/><text x=\"340\" y=\"94\" fill=\"#1d2433\">Satisfecho: 40 %<\/text><rect x=\"320\" y=\"107\" width=\"14\" height=\"14\" fill=\"#2e8b57\"/><text x=\"340\" y=\"118\" fill=\"#1d2433\">Poco satisfecho: 15 %<\/text><rect x=\"320\" y=\"131\" width=\"14\" height=\"14\" fill=\"#8e44ad\"/><text x=\"340\" y=\"142\" fill=\"#1d2433\">Insatisfecho: 10 %<\/text><\/svg><\/div>", "items": [{"id": "RCT-307", "niv": 1, "cp": "rc_interpretacion", "e": "¿Cuántos de los clientes encuestados quedaron poco satisfechos o insatisfechos?", "f": "Cálculo propio a partir de los datos del caso (datos ficticios).", "vis": "", "o": [["A", "24", "Corresponde solo a los insatisfechos (10 % de 240).", false], ["B", "36", "Corresponde solo a los poco satisfechos (15 % de 240).", false], ["C", "60", "Poco satisfechos más insatisfechos: 15 % + 10 % = 25 %; 25 % de 240 = 60.", true], ["D", "180", "Corresponde a los clientes muy satisfechos o satisfechos (75 % de 240).", false]]}, {"id": "RCT-308", "niv": 2, "cp": "rc_interpretacion", "e": "¿Cuál de las siguientes listas presenta correctamente el número de clientes de cada categoría, en el orden muy satisfecho, satisfecho, poco satisfecho e insatisfecho?", "f": "Cálculo propio a partir de los datos del caso (datos ficticios).", "vis": "", "o": [["A", "70, 80, 30 y 20 clientes.", "Calcula los porcentajes sobre 200 clientes en lugar de 240.", false], ["B", "84, 96, 24 y 36 clientes.", "Intercambia las dos últimas categorías: los poco satisfechos (15 %) son 36 y los insatisfechos (10 %), 24.", false], ["C", "96, 84, 36 y 24 clientes.", "Intercambia las dos primeras categorías: los muy satisfechos (35 %) son 84 y los satisfechos (40 %), 96.", false], ["D", "84, 96, 36 y 24 clientes.", "35 %, 40 %, 15 % y 10 % de 240 son 84, 96, 36 y 24; suman 240.", true]]}, {"id": "RCT-309", "niv": 2, "cp": "rc_argumentacion", "e": "El administrador del taller afirma: «Cuatro de cada cinco clientes quedaron satisfechos o muy satisfechos». ¿Es correcta su afirmación?", "f": "Cálculo propio a partir de los datos del caso (datos ficticios).", "vis": "", "o": [["A", "No, porque esos clientes son el 75 %, es decir, 3 de cada 4, y no 4 de cada 5.", "35 % + 40 % = 75 % = 3/4; cuatro de cada cinco sería el 80 %.", true], ["B", "Sí, porque 35 % + 40 % = 75 %, que corresponde a 4 de cada 5 clientes.", "La suma es correcta, pero 4 de cada 5 es el 80 %, no el 75 %.", false], ["C", "No, porque esos clientes son el 35 % + 40 % = 70 %, es decir, 7 de cada 10.", "Error de suma: 35 % + 40 % = 75 %. La conclusión «No» es correcta, pero la razón es falsa.", false], ["D", "Sí, porque solo el 10 % quedó insatisfecho, así que el 90 % quedó al menos satisfecho.", "Olvida al 15 % de poco satisfechos, que no cuentan como satisfechos; el porcentaje correcto es 75 %.", false]]}]}, {"comp": "razonamiento_cuantitativo", "sim": "tyt-3", "ind": "Opciones de un préstamo personal", "tt": "", "texto": "Julián necesita un préstamo de $ 2.000.000 para comprar herramientas y lo pagará en 6 meses. La tabla 1 muestra las dos opciones que le ofrecen. En la opción 1, el interés simple se calcula cada mes sobre el valor prestado y se paga todo al final.", "vis": "<table class=\"vt\"><caption>Tabla 1. Opciones de préstamo por $ 2.000.000<\/caption><thead><tr><th>Opción<\/th><th>Condiciones<\/th><\/tr><\/thead><tbody><tr><td>Opción 1<\/td><td>Interés simple del 2 % mensual; el valor prestado y los intereses se pagan al final de los 6 meses<\/td><\/tr><tr><td>Opción 2<\/td><td>6 cuotas mensuales fijas de $ 380.000<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Datos ficticios.<\/div>", "items": [{"id": "RCT-310", "niv": 1, "cp": "rc_formulacion", "e": "Con la opción 1, ¿cuánto paga Julián en total al final de los 6 meses?", "f": "Cálculo propio a partir de los datos del caso (datos ficticios).", "vis": "", "o": [["A", "$ 2.040.000", "Incluye el interés de un solo mes; son 6 meses de interés.", false], ["B", "$ 2.240.000", "Interés: 2.000.000 × 0,02 × 6 = 240.000; total: 2.000.000 + 240.000 = 2.240.000.", true], ["C", "$ 2.252.325", "Calcula interés compuesto (2.000.000 × 1,02⁶); la opción 1 es de interés simple.", false], ["D", "$ 2.280.000", "Es el total que se paga con la opción 2, no con la opción 1.", false]]}, {"id": "RCT-311", "niv": 1, "cp": "rc_interpretacion", "e": "Según la tabla, ¿cuánto paga Julián en total con la opción 2?", "f": "Cálculo propio a partir de los datos del caso (datos ficticios).", "vis": "", "o": [["A", "$ 380.000", "Es el valor de una sola cuota; son 6 cuotas.", false], ["B", "$ 2.000.000", "Es el valor prestado; con las cuotas se paga más que eso.", false], ["C", "$ 2.240.000", "Es el total de la opción 1.", false], ["D", "$ 2.280.000", "6 cuotas de $ 380.000: 6 × 380.000 = 2.280.000.", true]]}, {"id": "RCT-312", "niv": 2, "cp": "rc_formulacion", "e": "¿Cuánto dinero más paga Julián si escoge la opción 2 en lugar de la opción 1?", "f": "Cálculo propio a partir de los datos del caso (datos ficticios).", "vis": "", "o": [["A", "$ 20.000", "Divide entre 2 la diferencia real; la diferencia entre 2.280.000 y 2.240.000 es 40.000.", false], ["B", "$ 40.000", "Opción 2: 6 × 380.000 = 2.280.000; opción 1: 2.240.000; diferencia: 40.000.", true], ["C", "$ 240.000", "Es el interés total de la opción 1, no la diferencia entre las opciones.", false], ["D", "$ 280.000", "Es el interés total de la opción 2 (2.280.000 − 2.000.000), no la diferencia.", false]]}, {"id": "RCT-313", "niv": 3, "cp": "rc_argumentacion", "e": "Un asesor afirma: «La opción 2 equivale a pagar un interés simple del 2,5 % mensual sobre el valor prestado». ¿Es correcta su afirmación?", "f": "Cálculo propio a partir de los datos del caso (datos ficticios).", "vis": "", "o": [["A", "Sí, porque cada cuota de $ 380.000 incluye un 2,5 % de interés sobre el valor prestado.", "El 2,5 % de 2.000.000 son 50.000 por mes; la parte de interés de cada cuota es menor (380.000 − 333.333 ≈ 46.667).", false], ["B", "Sí, porque la opción 1 cobra 2 % y la opción 2 cuesta un poco más, unos 0,5 puntos más.", "Supone la diferencia sin calcularla; el cálculo muestra que 2,5 % daría un total mayor que el de las cuotas.", false], ["C", "No, porque al 2,5 % mensual se pagarían $ 2.300.000, más de lo que suman las 6 cuotas.", "2.000.000 × (1 + 0,025 × 6) = 2.300.000, mientras que las 6 cuotas suman menos; el interés equivalente es menor que 2,5 %.", true], ["D", "No, porque al 2,5 % mensual se pagarían $ 2.050.000, menos de lo que suman las 6 cuotas.", "Cuenta el interés de un solo mes; con 6 meses al 2,5 % el total es 2.300.000.", false]]}]}, {"comp": "razonamiento_cuantitativo", "sim": "tyt-3", "ind": "Casos de dengue atendidos en un hospital", "tt": "", "texto": "Un hospital municipal registró el número de casos de dengue atendidos cada semana durante siete semanas. La gráfica 1 muestra los datos.", "vis": "<div class=\"vfig\"><svg class=\"vg\" viewBox=\"0 0 560 320\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Gráfica 1. Casos de dengue por semana\" font-family=\"Arial, sans-serif\" font-size=\"12\"><rect width=\"560\" height=\"320\" fill=\"#ffffff\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"13\" fill=\"#1d2433\">Gráfica 1. Casos de dengue por semana<\/text><line x1=\"60\" y1=\"258.0\" x2=\"540\" y2=\"258.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"262.0\" text-anchor=\"end\" fill=\"#3a4356\">0<\/text><line x1=\"60\" y1=\"202.5\" x2=\"540\" y2=\"202.5\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"206.5\" text-anchor=\"end\" fill=\"#3a4356\">10<\/text><line x1=\"60\" y1=\"147.0\" x2=\"540\" y2=\"147.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"151.0\" text-anchor=\"end\" fill=\"#3a4356\">20<\/text><line x1=\"60\" y1=\"91.5\" x2=\"540\" y2=\"91.5\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"95.5\" text-anchor=\"end\" fill=\"#3a4356\">30<\/text><line x1=\"60\" y1=\"36.0\" x2=\"540\" y2=\"36.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"40.0\" text-anchor=\"end\" fill=\"#3a4356\">40<\/text><line x1=\"60\" y1=\"258\" x2=\"540\" y2=\"258\" stroke=\"#3a4356\"/><line x1=\"60\" y1=\"258\" x2=\"60\" y2=\"36\" stroke=\"#3a4356\"/><text transform=\"translate(14,147.0) rotate(-90)\" text-anchor=\"middle\" fill=\"#3a4356\">Número de casos<\/text><text x=\"300.0\" y=\"312\" text-anchor=\"middle\" fill=\"#3a4356\">Semana<\/text><text x=\"94.3\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">1<\/text><text x=\"162.9\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">2<\/text><text x=\"231.4\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">3<\/text><text x=\"300.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">4<\/text><text x=\"368.6\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">5<\/text><text x=\"437.1\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">6<\/text><text x=\"505.7\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">7<\/text><polyline fill=\"none\" stroke=\"#1660a8\" stroke-width=\"2.5\" points=\"94.3,191.4 162.9,158.1 231.4,108.2 300.0,63.8 368.6,91.5 437.1,135.9 505.7,174.8\"/><circle cx=\"94.3\" cy=\"191.4\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"94.3\" y=\"183.4\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">12<\/text><circle cx=\"162.9\" cy=\"158.1\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"162.9\" y=\"150.1\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">18<\/text><circle cx=\"231.4\" cy=\"108.2\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"231.4\" y=\"100.2\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">27<\/text><circle cx=\"300.0\" cy=\"63.8\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"300.0\" y=\"55.8\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">35<\/text><circle cx=\"368.6\" cy=\"91.5\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"368.6\" y=\"83.5\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">30<\/text><circle cx=\"437.1\" cy=\"135.9\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"437.1\" y=\"127.9\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">22<\/text><circle cx=\"505.7\" cy=\"174.8\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"505.7\" y=\"166.8\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">15<\/text><\/svg><\/div>", "items": [{"id": "RCT-314", "niv": 1, "cp": "rc_interpretacion", "e": "¿En qué semana se atendió el mayor número de casos?", "f": "Cálculo propio a partir de los datos del caso (datos ficticios).", "vis": "", "o": [["A", "Semana 3.", "En la semana 3 hubo 27 casos, menos que en la semana 4.", false], ["B", "Semana 4.", "La semana 4 tiene el punto más alto de la gráfica: 35 casos.", true], ["C", "Semana 5.", "En la semana 5 hubo 30 casos; los casos ya habían empezado a bajar.", false], ["D", "Semana 7.", "La semana 7 es la última, pero tuvo apenas 15 casos.", false]]}, {"id": "RCT-315", "niv": 2, "cp": "rc_interpretacion", "e": "¿Cuál es la mediana del número de casos semanales?", "f": "Cálculo propio a partir de los datos del caso (datos ficticios).", "vis": "", "o": [["A", "22", "Datos ordenados: 12, 15, 18, 22, 27, 30, 35; el valor central (cuarto de siete) es 22.", true], ["B", "22,7", "Es aproximadamente el promedio (159 ÷ 7), no la mediana.", false], ["C", "23,5", "Es el punto medio entre el mínimo y el máximo ((12 + 35) ÷ 2).", false], ["D", "35", "Es el valor de la semana central (semana 4) sin ordenar los datos; la mediana exige ordenarlos primero.", false]]}, {"id": "RCT-316", "niv": 3, "cp": "rc_formulacion", "e": "¿En qué porcentaje aumentaron los casos de la semana 1 a la semana 4, aproximadamente?", "f": "Cálculo propio a partir de los datos del caso (datos ficticios).", "vis": "", "o": [["A", "23 %", "23 es el aumento en número de casos (35 − 12), no el porcentaje.", false], ["B", "65,7 %", "Divide el aumento entre el valor final (23 ÷ 35); el aumento porcentual se calcula sobre el valor inicial.", false], ["C", "191,7 %", "Aumento: 35 − 12 = 23; 23 ÷ 12 ≈ 1,917, es decir, cerca de 191,7 %.", true], ["D", "291,7 %", "Es la razón 35 ÷ 12 en porcentaje: indica que la semana 4 es el 291,7 % de la semana 1, no el aumento.", false]]}, {"id": "RCT-317", "niv": 2, "cp": "rc_argumentacion", "e": "Una enfermera afirma: «El promedio semanal de casos de las tres últimas semanas fue mayor que el de las tres primeras semanas». ¿Cuál de las siguientes razones evalúa correctamente la afirmación?", "f": "Cálculo propio a partir de los datos del caso (datos ficticios).", "vis": "", "o": [["A", "Es incorrecta: en las últimas semanas los casos bajaron de 30 a 15, y en las primeras subieron.", "La tendencia no decide cuál promedio es mayor; hay que comparar los promedios.", false], ["B", "Es incorrecta: las tres primeras semanas suman 57 casos y las tres últimas, 52.", "Error de suma: 30 + 22 + 15 = 67, no 52.", false], ["C", "Es correcta: las tres últimas semanas suman 72 casos y las tres primeras, 57.", "La conclusión es cierta, pero la suma es falsa: 30 + 22 + 15 = 67.", false], ["D", "Es correcta: las tres primeras promedian 19 casos y las tres últimas, cerca de 22,3.", "Semanas 1 a 3: (12 + 18 + 27) ÷ 3 = 19; semanas 5 a 7: (30 + 22 + 15) ÷ 3 ≈ 22,3.", true]]}]}, {"comp": "razonamiento_cuantitativo", "sim": "tyt-3", "ind": "Concreto para una placa", "tt": "", "texto": "En una obra se va a fundir una placa de concreto con forma de prisma rectangular de 5 m de largo, 4 m de ancho y 10 cm de espesor. El concreto premezclado cuesta $ 420.000 por metro cúbico y se puede pedir cualquier cantidad.", "vis": "", "items": [{"id": "RCT-318", "niv": 1, "cp": "rc_formulacion", "e": "¿Cuántos metros cúbicos de concreto ocupa la placa?", "f": "Cálculo propio a partir de los datos del caso (datos ficticios).", "vis": "", "o": [["A", "0,2 m³.", "Convierte 10 cm como 0,01 m; 10 cm = 0,1 m.", false], ["B", "2 m³.", "V = 5 × 4 × 0,1 = 2 m³.", true], ["C", "20 m³.", "Es el área de la placa (5 × 4 = 20 m²); falta multiplicar por el espesor.", false], ["D", "200 m³.", "Multiplica por 10 (los centímetros) sin convertirlos a metros.", false]]}, {"id": "RCT-319", "niv": 2, "cp": "rc_formulacion", "e": "El ingeniero ordena pedir un 5 % más de concreto del que ocupa la placa, por pérdidas. ¿Cuánto cuesta el concreto que se debe pedir?", "f": "Cálculo propio a partir de los datos del caso (datos ficticios).", "vis": "", "o": [["A", "$ 88.200", "Usa un espesor de 0,01 m en lugar de 0,1 m.", false], ["B", "$ 840.000", "Es el costo de 2 m³ sin el 5 % adicional.", false], ["C", "$ 861.000", "Suma el 5 % del precio de un solo metro cúbico (21.000), no el 5 % del pedido.", false], ["D", "$ 882.000", "Volumen a pedir: 2 × 1,05 = 2,1 m³; costo: 2,1 × 420.000 = 882.000.", true]]}, {"id": "RCT-320", "niv": 3, "cp": "rc_argumentacion", "e": "Un maestro de obra afirma: «Si la placa tuviera el doble de largo, el doble de ancho y el doble de espesor, se necesitaría el doble de concreto». ¿Es correcta su afirmación?", "f": "Cálculo propio a partir de los datos del caso (datos ficticios).", "vis": "", "o": [["A", "No, porque el volumen se multiplicaría por 2 × 2 × 2 = 8, no por 2.", "V = largo × ancho × espesor; si cada factor se duplica, el volumen se multiplica por 8.", true], ["B", "Sí, porque las tres medidas aumentan en la misma proporción: todas al doble.", "Que las tres medidas se dupliquen hace que el volumen se multiplique por 2 × 2 × 2, no por 2.", false], ["C", "No, porque el área se multiplica por 2 × 2 = 4, y el concreto también por 4.", "Olvida que el espesor también se duplica: el factor es 8.", false], ["D", "No, porque el volumen se multiplicaría por 2 + 2 + 2 = 6, el triple del doble.", "Los factores de escala se multiplican, no se suman: 2 × 2 × 2 = 8.", false]]}]}, {"comp": "razonamiento_cuantitativo", "sim": "tyt-3", "ind": "Punto de equilibrio en un taller de confección", "tt": "", "texto": "Un taller de confección tiene costos fijos de $ 1.200.000 al mes. Producir cada camisa le cuesta, además, $ 18.000, y la vende a $ 30.000. La gráfica 1 muestra los costos totales y los ingresos según el número de camisas producidas y vendidas en un mes. La ganancia es la diferencia entre los ingresos y los costos totales.", "vis": "<div class=\"vfig\"><svg class=\"vg\" viewBox=\"0 0 560 320\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Gráfica 1. Costos e ingresos mensuales\" font-family=\"Arial, sans-serif\" font-size=\"12\"><rect width=\"560\" height=\"320\" fill=\"#ffffff\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"13\" fill=\"#1d2433\">Gráfica 1. Costos e ingresos mensuales<\/text><line x1=\"60\" y1=\"258.0\" x2=\"540\" y2=\"258.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"262.0\" text-anchor=\"end\" fill=\"#3a4356\">0<\/text><line x1=\"60\" y1=\"221.0\" x2=\"540\" y2=\"221.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"225.0\" text-anchor=\"end\" fill=\"#3a4356\">1.000<\/text><line x1=\"60\" y1=\"184.0\" x2=\"540\" y2=\"184.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"188.0\" text-anchor=\"end\" fill=\"#3a4356\">2.000<\/text><line x1=\"60\" y1=\"147.0\" x2=\"540\" y2=\"147.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"151.0\" text-anchor=\"end\" fill=\"#3a4356\">3.000<\/text><line x1=\"60\" y1=\"110.0\" x2=\"540\" y2=\"110.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"114.0\" text-anchor=\"end\" fill=\"#3a4356\">4.000<\/text><line x1=\"60\" y1=\"73.0\" x2=\"540\" y2=\"73.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"77.0\" text-anchor=\"end\" fill=\"#3a4356\">5.000<\/text><line x1=\"60\" y1=\"36.0\" x2=\"540\" y2=\"36.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"40.0\" text-anchor=\"end\" fill=\"#3a4356\">6.000<\/text><line x1=\"60\" y1=\"258\" x2=\"540\" y2=\"258\" stroke=\"#3a4356\"/><line x1=\"60\" y1=\"258\" x2=\"60\" y2=\"36\" stroke=\"#3a4356\"/><text transform=\"translate(14,147.0) rotate(-90)\" text-anchor=\"middle\" fill=\"#3a4356\">Miles de pesos<\/text><text x=\"300.0\" y=\"312\" text-anchor=\"middle\" fill=\"#3a4356\">Camisas producidas y vendidas<\/text><text x=\"108.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">0<\/text><text x=\"204.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">50<\/text><text x=\"300.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">100<\/text><text x=\"396.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">150<\/text><text x=\"492.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">200<\/text><polyline fill=\"none\" stroke=\"#1660a8\" stroke-width=\"2.5\" points=\"108.0,213.6 204.0,180.3 300.0,147.0 396.0,113.7 492.0,80.4\"/><circle cx=\"108.0\" cy=\"213.6\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"108.0\" y=\"205.6\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">1.200<\/text><circle cx=\"204.0\" cy=\"180.3\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"204.0\" y=\"172.3\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">2.100<\/text><circle cx=\"300.0\" cy=\"147.0\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"300.0\" y=\"139.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">3.000<\/text><circle cx=\"396.0\" cy=\"113.7\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"396.0\" y=\"105.7\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">3.900<\/text><circle cx=\"492.0\" cy=\"80.4\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"492.0\" y=\"72.4\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">4.800<\/text><polyline fill=\"none\" stroke=\"#d9822b\" stroke-width=\"2.5\" points=\"108.0,
