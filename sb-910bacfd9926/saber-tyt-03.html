258.0 204.0,202.5 300.0,147.0 396.0,91.5 492.0,36.0\"/><circle cx=\"108.0\" cy=\"258.0\" r=\"3.5\" fill=\"#d9822b\"/><text x=\"108.0\" y=\"275.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#d9822b\" font-weight=\"bold\">0<\/text><circle cx=\"204.0\" cy=\"202.5\" r=\"3.5\" fill=\"#d9822b\"/><text x=\"204.0\" y=\"219.5\" text-anchor=\"middle\" font-size=\"11\" fill=\"#d9822b\" font-weight=\"bold\">1.500<\/text><circle cx=\"300.0\" cy=\"147.0\" r=\"3.5\" fill=\"#d9822b\"/><text x=\"300.0\" y=\"164.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#d9822b\" font-weight=\"bold\">3.000<\/text><circle cx=\"396.0\" cy=\"91.5\" r=\"3.5\" fill=\"#d9822b\"/><text x=\"396.0\" y=\"108.5\" text-anchor=\"middle\" font-size=\"11\" fill=\"#d9822b\" font-weight=\"bold\">4.500<\/text><circle cx=\"492.0\" cy=\"36.0\" r=\"3.5\" fill=\"#d9822b\"/><text x=\"492.0\" y=\"53.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#d9822b\" font-weight=\"bold\">6.000<\/text><rect x=\"60\" y=\"286\" width=\"12\" height=\"12\" fill=\"#1660a8\"/><text x=\"76\" y=\"296\" fill=\"#1d2433\">Costos totales<\/text><rect x=\"184\" y=\"286\" width=\"12\" height=\"12\" fill=\"#d9822b\"/><text x=\"200\" y=\"296\" fill=\"#1d2433\">Ingresos<\/text><\/svg><\/div>", "items": [{"id": "RCT-321", "niv": 1, "cp": "rc_interpretacion", "e": "Según la gráfica, ¿con cuántas camisas vendidas en el mes los ingresos son iguales a los costos totales?", "f": "Cálculo propio a partir de los datos del caso (datos ficticios).", "vis": "", "o": [["A", "50", "Con 50 camisas los costos ($ 2.100.000) superan a los ingresos ($ 1.500.000).", false], ["B", "100", "Con 100 camisas las dos líneas se cruzan: ingresos y costos son $ 3.000.000.", true], ["C", "150", "Con 150 camisas los ingresos ($ 4.500.000) ya superan a los costos ($ 3.900.000).", false], ["D", "200", "Con 200 camisas los ingresos son $ 6.000.000 y los costos $ 4.800.000; no son iguales.", false]]}, {"id": "RCT-322", "niv": 2, "cp": "rc_interpretacion", "e": "Según la gráfica, ¿cuál es la ganancia del taller si en un mes vende 150 camisas?", "f": "Cálculo propio a partir de los datos del caso (datos ficticios).", "vis": "", "o": [["A", "$ 600.000", "Con 150 camisas: ingresos 4.500.000 y costos 3.900.000; ganancia: 600.000.", true], ["B", "$ 1.800.000", "Multiplica 150 por la diferencia de 12.000 por camisa, pero no descuenta los costos fijos.", false], ["C", "$ 3.900.000", "Son los costos totales con 150 camisas, no la ganancia.", false], ["D", "$ 4.500.000", "Son los ingresos con 150 camisas, no la ganancia.", false]]}, {"id": "RCT-323", "niv": 3, "cp": "rc_formulacion", "e": "¿Cuántas camisas debe vender el taller en un mes para obtener una ganancia de $ 1.800.000?", "f": "Cálculo propio a partir de los datos del caso (datos ficticios).", "vis": "", "o": [["A", "60", "Divide 1.800.000 entre el precio de venta (30.000); no tiene en cuenta los costos.", false], ["B", "100", "Con 100 camisas la ganancia es 0: es el punto de equilibrio.", false], ["C", "150", "Divide 1.800.000 entre 12.000 y olvida que primero hay que cubrir los costos fijos.", false], ["D", "250", "Ganancia = 12.000x − 1.200.000 = 1.800.000; 12.000x = 3.000.000; x = 250.", true]]}, {"id": "RCT-324", "niv": 2, "cp": "rc_interpretacion", "e": "Si x es el número de camisas vendidas en el mes, ¿qué expresión representa la ganancia G del taller, en pesos?", "f": "Cálculo propio a partir de los datos del caso (datos ficticios).", "vis": "", "o": [["A", "G = 48.000x − 1.200.000.", "Suma el precio y el costo por camisa (30.000 + 18.000) en lugar de restarlos.", false], ["B", "G = 1.200.000 + 12.000x.", "Suma los costos fijos en lugar de restarlos; con x = 0 daría una ganancia positiva.", false], ["C", "G = 12.000x − 1.200.000.", "G = 30.000x − (1.200.000 + 18.000x) = 12.000x − 1.200.000.", true], ["D", "G = 30.000x − 1.200.000.", "Descuenta los costos fijos, pero olvida el costo de producir cada camisa (18.000x).", false]]}]}, {"comp": "razonamiento_cuantitativo", "sim": "tyt-3", "ind": "Ubicaciones en el plano de una bodega", "tt": "", "texto": "El plano de una bodega usa un sistema de coordenadas en metros. La entrada está en el punto (0, 0); el eje x apunta hacia el oriente y el eje y hacia el norte. La tabla 1 muestra las coordenadas de algunas ubicaciones.", "vis": "<table class=\"vt\"><caption>Tabla 1. Coordenadas de ubicaciones de la bodega (en metros)<\/caption><thead><tr><th>Ubicación<\/th><th>Coordenadas (x, y)<\/th><\/tr><\/thead><tbody><tr><td>Entrada<\/td><td>(0, 0)<\/td><\/tr><tr><td>Estante A<\/td><td>(6, 8)<\/td><\/tr><tr><td>Estante B<\/td><td>(12, 2)<\/td><\/tr><tr><td>Estante C<\/td><td>(2, 12)<\/td><\/tr><tr><td>Oficina<\/td><td>(12, 8)<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Datos ficticios.<\/div>", "items": [{"id": "RCT-325", "niv": 1, "cp": "rc_formulacion", "e": "¿Cuál es la distancia en línea recta desde la entrada hasta el estante A?", "f": "Cálculo propio con el teorema de Pitágoras.", "vis": "", "o": [["A", "2 m.", "Resta las coordenadas (8 − 6); la distancia se calcula con el teorema de Pitágoras.", false], ["B", "10 m.", "d = √(6² + 8²) = √100 = 10 m.", true], ["C", "14 m.", "Suma las coordenadas (6 + 8): es la distancia recorriendo primero hacia el oriente y luego hacia el norte, no en línea recta.", false], ["D", "48 m.", "Multiplica las coordenadas (6 × 8); eso no corresponde a ninguna distancia.", false]]}, {"id": "RCT-326", "niv": 1, "cp": "rc_interpretacion", "e": "¿Qué ubicación está 12 m al oriente y 2 m al norte de la entrada?", "f": "Lectura de la tabla 1 (datos ficticios).", "vis": "", "o": [["A", "Oficina.", "La oficina está en (12, 8): 12 m al oriente, pero 8 m al norte.", false], ["B", "Estante C.", "El estante C está en (2, 12): intercambia las coordenadas; está 2 m al oriente y 12 m al norte.", false], ["C", "Estante B.", "El estante B está en (12, 2): x = 12 (oriente) e y = 2 (norte).", true], ["D", "Estante A.", "El estante A está en (6, 8): 6 m al oriente y 8 m al norte.", false]]}]}, {"comp": "razonamiento_cuantitativo", "sim": "tyt-3", "ind": "Tornillos en una caja de un taller", "tt": "", "texto": "En una caja de un taller hay 50 tornillos del mismo tamaño: 24 de acero, 16 galvanizados y 10 de bronce. Un operario saca un tornillo al azar, sin mirar.", "vis": "", "items": [{"id": "RCT-327", "niv": 1, "cp": "rc_formulacion", "e": "¿Cuál es la probabilidad de que el tornillo sacado sea galvanizado?", "f": "Cálculo propio a partir de los datos del caso (datos ficticios).", "vis": "", "o": [["A", "0,16", "Divide 16 entre 100; el total de tornillos es 50.", false], ["B", "0,32", "Hay 16 galvanizados de 50: 16 ÷ 50 = 0,32.", true], ["C", "0,4", "Divide entre 40 (acero más galvanizados) y omite los 10 de bronce.", false], ["D", "0,67", "Compara galvanizados con tornillos de acero (16 ÷ 24); se debe dividir entre el total.", false]]}, {"id": "RCT-328", "niv": 2, "cp": "rc_argumentacion", "e": "El operario afirma: «Es más probable sacar un tornillo que no sea de acero que sacar uno de acero». ¿Es correcta su afirmación?", "f": "Cálculo propio a partir de los datos del caso (datos ficticios).", "vis": "", "o": [["A", "Sí, porque 26 de los 50 no son de acero y 24 sí: 0,52 frente a 0,48.", "No son de acero 16 + 10 = 26 de 50 tornillos; 0,52 > 0,48.", true], ["B", "Sí, porque hay tres tipos de tornillo y no sacar acero tiene probabilidad 2/3.", "Los tipos no son igualmente probables: hay cantidades distintas; la probabilidad correcta es 0,52.", false], ["C", "No, porque el acero, con 24 tornillos, es el tipo con más unidades en la caja.", "Ser el tipo más numeroso no basta: los otros dos tipos juntos (26) superan a los de acero (24).", false], ["D", "No, porque la probabilidad de sacar acero es 24 ÷ 26, que es mayor que 1/2.", "Divide entre los que no son de acero; la probabilidad de sacar acero es 24/50 = 0,48.", false]]}, {"id": "RCT-329", "niv": 3, "cp": "rc_formulacion", "e": "¿Cuántos tornillos de bronce hay que agregar a la caja para que la probabilidad de sacar uno de bronce sea 1/3?", "f": "Cálculo propio a partir de los datos del caso (datos ficticios).", "vis": "", "o": [["A", "5", "Piensa en 15 de bronce de 50 tornillos, olvida que el total también crece y tampoco llega a 1/3: con 5 más habría 15 de 55 (≈ 0,27).", false], ["B", "7", "Calcula 1/3 de 50 (≈ 16,7) y resta 10, sin tener en cuenta que el total de tornillos también aumenta.", false], ["C", "10", "Con 10 más habría 20 de bronce de 60 tornillos: 20 ÷ 60 = 1/3.", true], ["D", "20", "Es el número final de tornillos de bronce, no la cantidad que se agrega.", false]]}]}, {"comp": "razonamiento_cuantitativo", "sim": "tyt-3", "ind": "Almacenamiento de cámaras de seguridad", "tt": "", "texto": "En una empresa, una cámara de seguridad graba de forma continua y ocupa 2,5 GB de memoria por cada hora de video. La grabación se guarda en un disco de 1 TB. Tome 1 TB = 1.000 GB.", "vis": "", "items": [{"id": "RCT-330", "niv": 2, "cp": "rc_formulacion", "e": "¿Cuántos días completos de grabación continua caben en el disco?", "f": "Cálculo propio a partir de los datos del caso (datos ficticios).", "vis": "", "o": [["A", "16", "1.000 ÷ 2,5 = 400 horas; 400 ÷ 24 ≈ 16,7 días: caben 16 días completos.", true], ["B", "17", "Redondea 16,7 hacia arriba; el día 17 no alcanza a completarse.", false], ["C", "41", "Divide 1.000 GB entre 24 horas sin usar el consumo de 2,5 GB por hora.", false], ["D", "400", "400 es el número de horas de grabación, no de días.", false]]}, {"id": "RCT-331", "niv": 3, "cp": "rc_argumentacion", "e": "El técnico afirma: «Si la cámara grabara con menor calidad, ocupando 1,25 GB por hora, el disco alcanzaría para más de 35 días completos de grabación». ¿Es correcta su afirmación?", "f": "Cálculo propio a partir de los datos del caso (datos ficticios).", "vis": "", "o": [["A", "No, porque al bajar la calidad caben menos horas que antes: unas 200 horas.", "Es al revés: con menos memoria por hora caben más horas de grabación (800).", false], ["B", "Sí, porque cabrían 1.000 ÷ 1,25 = 800 horas, y 800 ÷ 20 = 40 días completos.", "Divide entre 20 horas; un día tiene 24 horas: 800 ÷ 24 ≈ 33,3.", false], ["C", "Sí, porque cabrían 800 horas (1.000 ÷ 1,25), y 800 ÷ 24 ≈ 36,7 días completos.", "Error de división: 800 ÷ 24 ≈ 33,3, así que caben 33 días completos, menos de 35.", false], ["D", "No, porque caben 800 horas (1.000 ÷ 1,25), que son 33 días completos.", "800 ÷ 24 ≈ 33,3; caben 33 días completos, menos de 35.", true]]}]}, {"comp": "razonamiento_cuantitativo", "sim": "tyt-3", "ind": "Vueltas de la rueda de una bicicleta de mensajería", "tt": "", "texto": "Un mensajero hace sus entregas en bicicleta. Cada rueda de su bicicleta tiene 0,7 m de diámetro. Recuerde que la longitud de una circunferencia es π × diámetro.", "vis": "", "items": [{"id": "RCT-332", "niv": 2, "cp": "rc_formulacion", "e": "Usando π ≈ 3,14, ¿cuántas vueltas da aproximadamente cada rueda cuando el mensajero recorre 220 m?", "f": "Cálculo propio a partir de los datos del caso (datos ficticios).", "vis": "", "o": [["A", "50", "Usa el doble de la circunferencia (2 × π × 0,7 ≈ 4,4 m), como si 0,7 m fuera el radio.", false], ["B", "100", "Circunferencia: 3,14 × 0,7 ≈ 2,2 m; 220 ÷ 2,2 ≈ 100 vueltas.", true], ["C", "200", "Usa π × radio (3,14 × 0,35 ≈ 1,1 m) como si fuera la circunferencia.", false], ["D", "314", "Divide 220 entre el diámetro (0,7 m) y olvida multiplicar por π.", false]]}]}, {"comp": "razonamiento_cuantitativo", "sim": "tyt-3", "ind": "Inventario de pintura en una bodega", "tt": "", "texto": "Una bodega de una ferretería registró cuántos galones de pintura de cada color tenía al iniciar y al terminar un mes. Durante el mes no llegó mercancía nueva, así que la diferencia corresponde a los galones vendidos. La gráfica 1 muestra los datos.", "vis": "<div class=\"vfig\"><svg class=\"vg\" viewBox=\"0 0 560 320\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Gráfica 1. Galones de pintura por color\" font-family=\"Arial, sans-serif\" font-size=\"12\"><rect width=\"560\" height=\"320\" fill=\"#ffffff\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"13\" fill=\"#1d2433\">Gráfica 1. Galones de pintura por color<\/text><line x1=\"60\" y1=\"258.0\" x2=\"540\" y2=\"258.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"262.0\" text-anchor=\"end\" fill=\"#3a4356\">0<\/text><line x1=\"60\" y1=\"221.0\" x2=\"540\" y2=\"221.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"225.0\" text-anchor=\"end\" fill=\"#3a4356\">20<\/text><line x1=\"60\" y1=\"184.0\" x2=\"540\" y2=\"184.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"188.0\" text-anchor=\"end\" fill=\"#3a4356\">40<\/text><line x1=\"60\" y1=\"147.0\" x2=\"540\" y2=\"147.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"151.0\" text-anchor=\"end\" fill=\"#3a4356\">60<\/text><line x1=\"60\" y1=\"110.0\" x2=\"540\" y2=\"110.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"114.0\" text-anchor=\"end\" fill=\"#3a4356\">80<\/text><line x1=\"60\" y1=\"73.0\" x2=\"540\" y2=\"73.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"77.0\" text-anchor=\"end\" fill=\"#3a4356\">100<\/text><line x1=\"60\" y1=\"36.0\" x2=\"540\" y2=\"36.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"40.0\" text-anchor=\"end\" fill=\"#3a4356\">120<\/text><line x1=\"60\" y1=\"258\" x2=\"540\" y2=\"258\" stroke=\"#3a4356\"/><line x1=\"60\" y1=\"258\" x2=\"60\" y2=\"36\" stroke=\"#3a4356\"/><text transform=\"translate(14,147.0) rotate(-90)\" text-anchor=\"middle\" fill=\"#3a4356\">Galones<\/text><text x=\"300.0\" y=\"312\" text-anchor=\"middle\" fill=\"#3a4356\">Color<\/text><text x=\"120.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Blanco<\/text><text x=\"240.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Gris<\/text><text x=\"360.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Azul<\/text><text x=\"480.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Rojo<\/text><rect x=\"78.0\" y=\"36.0\" width=\"42.0\" height=\"222.0\" fill=\"#1660a8\"/><text x=\"99.0\" y=\"32.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">120<\/text><rect x=\"198.0\" y=\"110.0\" width=\"42.0\" height=\"148.0\" fill=\"#1660a8\"/><text x=\"219.0\" y=\"106.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">80<\/text><rect x=\"318.0\" y=\"165.5\" width=\"42.0\" height=\"92.5\" fill=\"#1660a8\"/><text x=\"339.0\" y=\"161.5\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">50<\/text><rect x=\"438.0\" y=\"184.0\" width=\"42.0\" height=\"74.0\" fill=\"#1660a8\"/><text x=\"459.0\" y=\"180.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">40<\/text><rect x=\"120.0\" y=\"174.8\" width=\"42.0\" height=\"83.2\" fill=\"#d9822b\"/><text x=\"141.0\" y=\"170.8\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">45<\/text><rect x=\"240.0\" y=\"147.0\" width=\"42.0\" height=\"111.0\" fill=\"#d9822b\"/><text x=\"261.0\" y=\"143.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">60<\/text><rect x=\"360.0\" y=\"193.2\" width=\"42.0\" height=\"64.8\" fill=\"#d9822b\"/><text x=\"381.0\" y=\"189.2\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">35<\/text><rect x=\"480.0\" y=\"239.5\" width=\"42.0\" height=\"18.5\" fill=\"#d9822b\"/><text x=\"501.0\" y=\"235.5\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">10<\/text><rect x=\"60\" y=\"286\" width=\"12\" height=\"12\" fill=\"#1660a8\"/><text x=\"76\" y=\"296\" fill=\"#1d2433\">Inicio del mes<\/text><rect x=\"184\" y=\"286\" width=\"12\" height=\"12\" fill=\"#d9822b\"/><text x=\"200\" y=\"296\" fill=\"#1d2433\">Fin del mes<\/text><\/svg><\/div>", "items": [{"id": "RCT-333", "niv": 2, "cp": "rc_interpretacion", "e": "¿De qué color se vendieron más galones durante el mes?", "f": "Cálculo propio a partir de los datos del caso (datos ficticios).", "vis": "", "o": [["A", "Blanco.", "Se vendieron 120 − 45 = 75 galones de blanco, más que de cualquier otro color.", true], ["B", "Gris.", "Se vendieron 80 − 60 = 20 galones de gris.", false], ["C", "Azul.", "Se vendieron 50 − 35 = 15 galones de azul.", false], ["D", "Rojo.", "Rojo es el color con menos existencias al final (10), pero se vendieron 40 − 10 = 30 galones, menos que de blanco.", false]]}, {"id": "RCT-334", "niv": 3, "cp": "rc_interpretacion", "e": "¿De qué color se vendió la mayor proporción de los galones que había al iniciar el mes?", "f": "Cálculo propio a partir de los datos del caso (datos ficticios).", "vis": "", "o": [["A", "Blanco.", "Se vendieron 75 de 120 galones (62,5 %); es la mayor cantidad, pero no la mayor proporción.", false], ["B", "Gris.", "Se vendieron 20 de 80 galones (25 %).", false], ["C", "Azul.", "Se vendieron 15 de 50 galones (30 %).", false], ["D", "Rojo.", "Se vendieron 30 de 40 galones: 75 %, la mayor proporción.", true]]}, {"id": "RCT-335", "niv": 1, "cp": "rc_interpretacion", "e": "¿Cuántos galones de pintura, en total, quedaban en la bodega al terminar el mes?", "f": "Cálculo propio a partir de los datos del caso (datos ficticios).", "vis": "", "o": [["A", "60", "Es la cantidad de un solo color (gris) al final del mes.", false], ["B", "140", "Es el total de galones vendidos (75 + 20 + 15 + 30), no los que quedaron.", false], ["C", "150", "Al final: 45 + 60 + 35 + 10 = 150 galones.", true], ["D", "290", "Es el total de galones al iniciar el mes.", false]]}]}, {"comp": "competencias_ciudadanas", "sim": "tyt-3", "ind": "Supremacía de la Constitución", "tt": "", "texto": "Un técnico en gestión documental de una alcaldía encuentra que un acuerdo municipal antiguo contiene una disposición que contradice abiertamente un derecho consagrado en la Constitución. Su jefe le pregunta cuál de las dos normas debe prevalecer.", "vis": "", "items": [{"id": "CCT-301", "niv": 1, "cp": "cc_conocimientos", "e": "Según la Constitución, en caso de incompatibilidad entre la Constitución y otra norma jurídica, se aplica", "f": "Constitución Política de Colombia (texto vigente, Secretaría del Senado), art. 4", "vis": "", "o": [["A", "la norma más reciente, porque deroga a las anteriores.", "El criterio de la norma posterior no se aplica frente a la Constitución: ante una incompatibilidad, siempre prevalece la Constitución.", false], ["B", "la norma que escoja el funcionario según su criterio.", "El artículo 4.º no deja la decisión al criterio del funcionario: ordena aplicar la Constitución.", false], ["C", "la Constitución, porque es norma de normas.", "El artículo 4.º dispone: «La Constitución es norma de normas. En todo caso de incompatibilidad entre la Constitución y la ley u otra norma jurídica, se aplicarán las disposiciones constitucionales».", true], ["D", "el acuerdo municipal, porque es la norma más cercana a la comunidad.", "La cercanía de la norma a la comunidad no le da prevalencia sobre la Constitución.", false]]}]}, {"comp": "competencias_ciudadanas", "sim": "tyt-3", "ind": "Derechos de los niños y trabajo infantil", "tt": "", "texto": "En una vereda, el dueño de un chircal (pequeña fábrica artesanal de ladrillos) contrata a niños de 11 y 12 años para cargar ladrillos cerca de los hornos. Afirma que los padres están de acuerdo y que así los niños ayudan con los gastos de la casa.", "vis": "", "items": [{"id": "CCT-302", "niv": 1, "cp": "cc_conocimientos", "e": "¿Cuál de las siguientes afirmaciones es acorde con el artículo 44 de la Constitución?", "f": "Constitución Política de Colombia (texto vigente, Secretaría del Senado), art. 44", "vis": "", "o": [["A", "Aunque los padres lo acepten, los niños no deben hacer trabajos riesgosos, y sus derechos prevalecen.", "El artículo 44 dispone que los niños serán protegidos contra la «explotación laboral o económica y trabajos riesgosos» y que «los derechos de los niños prevalecen sobre los derechos de los demás».", true], ["B", "Los niños pueden hacer trabajos riesgosos si sus padres lo autorizan por escrito y el pago es justo.", "La autorización de los padres o el pago no hacen válido un trabajo riesgoso: el artículo 44 protege a los niños contra ese tipo de trabajo.", false], ["C", "Los derechos de los niños tienen el mismo peso que el interés económico de quien los contrata en su negocio.", "La Constitución establece que los derechos de los niños prevalecen sobre los derechos de los demás.", false], ["D", "La protección de los niños es asunto de su familia, y el Estado debe esperar a que los padres pidan ayuda.", "El artículo 44 dice que la familia, la sociedad y el Estado tienen la obligación de proteger al niño, y que cualquier persona puede exigir a la autoridad que actúe.", false]]}]}, {"comp": "competencias_ciudadanas", "sim": "tyt-3", "ind": "Principios de la seguridad social", "tt": "", "texto": "En una capacitación sobre afiliación de trabajadores, la instructora explica que el artículo 48 de la Constitución define la seguridad social como un servicio público de carácter obligatorio, prestado bajo la dirección, coordinación y control del Estado, y sujeto a tres principios.", "vis": "", "items": [{"id": "CCT-303", "niv": 2, "cp": "cc_conocimientos", "e": "¿Cuál de las siguientes descripciones corresponde a los tres principios a los que el artículo 48 sujeta la seguridad social?", "f": "Constitución Política de Colombia (texto vigente, Secretaría del Senado), art. 48", "vis": "", "o": [["A", "Prestar el servicio gratis, con afiliación voluntaria y como un acto de caridad.", "La seguridad social es de carácter obligatorio según el artículo 48, no voluntaria, y sus principios son eficiencia, universalidad y solidaridad.", false], ["B", "Dar a todos igual trato, actuar con rectitud moral y resolver los trámites con rapidez.", "Describe igualdad, moralidad y celeridad, que son principios de la función administrativa en general, no los que el artículo 48 fija para la seguridad social.", false], ["C", "Generar ganancias, hacer competir a las entidades y dejar que cada quien decida si se afilia.", "Ninguno de esos principios aparece en el artículo 48; la seguridad social es un servicio público, no un negocio sujeto a la rentabilidad.", false], ["D", "Usar bien los recursos, cubrir a toda la población y que unos aporten para proteger también a otros.", "El artículo 48 sujeta la seguridad social a los principios de eficiencia (usar bien los recursos), universalidad (cubrir a todos) y solidaridad (aportes que protegen también a otros).", true]]}]}, {"comp": "competencias_ciudadanas", "sim": "tyt-3", "ind": "Acción de cumplimiento", "tt": "", "texto": "Hace dos años, el concejo de un municipio aprobó un acuerdo que ordena a la alcaldía instalar alumbrado público en el camino que comunica la cabecera con la vereda El Retiro. Los habitantes de la vereda han enviado varias cartas, pero la alcaldía no ha hecho la obra ni ha dado razones. La junta de acción comunal quiere que un juez ordene a la alcaldía cumplir el acuerdo.", "vis": "", "items": [{"id": "CCT-304", "niv": 2, "cp": "cc_conocimientos", "e": "¿Qué acción constitucional corresponde a lo que busca la junta?", "f": "Constitución Política de Colombia (texto vigente, Secretaría del Senado), art. 87", "vis": "", "o": [["A", "La demanda de inconstitucionalidad, para que la Corte Constitucional anule el acuerdo municipal.", "La junta no quiere anular el acuerdo, sino que se cumpla; además, la Corte decide demandas contra leyes y decretos con fuerza de ley.", false], ["B", "El derecho de petición, para que el juez obligue a la alcaldía a responder las cartas enviadas.", "El derecho de petición (art. 23) se ejerce ante las autoridades, no es la acción judicial que pide la junta, y una respuesta a las cartas no garantiza que se haga la obra.", false], ["C", "La acción de grupo, para que el juez ordene indemnizar a cada familia de la vereda por la falta de alumbrado.", "La acción de grupo busca reparar daños a un número plural de personas; la junta no pide indemnización sino que se cumpla el acuerdo.", false], ["D", "La acción de cumplimiento, para que el juez ordene a la alcaldía hacer la obra que el acuerdo le impone.", "El artículo 87 permite a toda persona acudir al juez «para hacer efectivo el cumplimiento de una ley o un acto administrativo»; si prospera, la sentencia ordena a la autoridad renuente cumplir el deber omitido.", true]]}]}, {"comp": "competencias_ciudadanas", "sim": "tyt-3", "ind": "Deber de proteger los recursos naturales", "tt": "", "texto": "Un guía turístico, egresado de un programa técnico en ecoturismo, ve que un grupo de visitantes arranca orquídeas silvestres de un bosque para llevárselas de recuerdo. Les pide que las devuelvan y les explica que proteger el bosque no es solo tarea de las autoridades ambientales.", "vis": "", "items": [{"id": "CCT-305", "niv": 1, "cp": "cc_conocimientos", "e": "¿Qué deber consagrado en el artículo 95 de la Constitución se relaciona más directamente con la situación?", "f": "Constitución Política de Colombia (texto vigente, Secretaría del Senado), art. 95, num. 8", "vis": "", "o": [["A", "Contribuir al financiamiento de los gastos e inversiones del Estado con justicia y equidad.", "Es el deber del numeral 9, relacionado con los tributos, no con la protección del bosque.", false], ["B", "Respetar y apoyar a las autoridades democráticas legítimamente constituidas.", "Es el deber del numeral 3, sobre la independencia y la integridad nacionales; no es el más relacionado con la situación.", false], ["C", "Cuidar la riqueza natural y cultural del país y ayudar a conservar un ambiente sano.", "El numeral 8 del artículo 95 establece el deber de «proteger los recursos culturales y naturales del país y velar por la conservación de un ambiente sano».", true], ["D", "Colaborar para el buen funcionamiento de la administración de justicia en el país.", "Es el deber del numeral 7; la situación no se refiere a procesos judiciales.", false]]}]}, {"comp": "competencias_ciudadanas", "sim": "tyt-3", "ind": "Derecho de habeas data", "tt": "", "texto": "Una tecnóloga en logística solicita un crédito para comprar una moto y se lo niegan porque aparece reportada en una central de información financiera por una deuda que pagó completa hace un año.", "vis": "", "items": [{"id": "CCT-306", "niv": 2, "cp": "cc_conocimientos", "e": "¿Qué derecho consagrado en el artículo 15 de la Constitución puede invocar para corregir esa situación?", "f": "Constitución Política de Colombia (texto vigente, Secretaría del Senado), art. 15", "vis": "", "o": [["A", "El derecho a que se corrijan y pongan al día los datos que sobre ella guardan las bases de datos.", "El artículo 15 dispone que todas las personas tienen derecho «a conocer, actualizar y rectificar las informaciones que se hayan recogido sobre ellas en bancos de datos y en archivos de entidades públicas y privadas».", true], ["B", "El derecho a la rectificación en condiciones de equidad frente a los medios de comunicación.", "Ese derecho (art. 20) se refiere a informaciones difundidas por los medios; aquí se trata de un banco de datos financiero.", false], ["C", "El derecho de petición, para que el banco le explique por qué le negó el crédito.", "El derecho de petición está en el artículo 23, no en el 15, y una explicación del banco no corrige el dato desactualizado de la central.", false], ["D", "El habeas corpus, porque el reporte negativo le impide circular libremente con su moto.", "El habeas corpus protege a quien está privado ilegalmente de su libertad personal (art. 30); no es el caso.", false]]}]}, {"comp": "competencias_ciudadanas", "sim": "tyt-3", "ind": "Jurisdicción especial indígena", "tt": "", "texto": "Dos comuneros de un resguardo tienen un conflicto porque el ganado de uno destruyó los cultivos del otro dentro del territorio del resguardo. El cabildo convoca a las partes y decide el caso según los usos y procedimientos propios de la comunidad. Un funcionario municipal sostiene que solo un juez de la República podía resolverlo.", "vis": "", "items": [{"id": "CCT-307", "niv": 3, "cp": "cc_conocimientos", "e": "Según el artículo 246 de la Constitución, las autoridades de los pueblos indígenas", "f": "Constitución Política de Colombia (texto vigente, Secretaría del Senado), art. 246", "vis": "", "o": [["A", "pueden resolver conflictos en su territorio con sus propias reglas, siempre que respeten la Constitución y las leyes del país.", "El artículo 246 dispone que las autoridades indígenas «podrán ejercer funciones jurisdiccionales dentro de su ámbito territorial, de conformidad con sus propias normas y procedimientos, siempre que no sean contrarios a la Constitución y leyes de la República».", true], ["B", "pueden actuar como conciliadoras, pero sus decisiones necesitan la aprobación de un juez municipal de la República para valer.", "La Constitución les reconoce funciones jurisdiccionales propias; sus decisiones no requieren la aprobación de un juez municipal.", false], ["C", "pueden resolver asuntos espirituales de la comunidad, pero los conflictos sobre bienes y cultivos le corresponden a la Fiscalía.", "El artículo 246 no limita su jurisdicción a asuntos espirituales, y la Fiscalía investiga delitos, no resuelve conflictos entre vecinos por cultivos.", false], ["D", "pueden juzgar con sus normas y procedimientos aunque contradigan la Constitución, porque su jurisdicción es autónoma.", "Sí hay límite: el artículo 246 exige que sus normas y procedimientos no sean contrarios a la Constitución y a las leyes.", false]]}]}, {"comp": "competencias_ciudadanas", "sim": "tyt-3", "ind": "Usos del suelo en el municipio", "tt": "", "texto": "Una empresa de mensajería quiere instalar una bodega con cargue y descargue de camiones en una manzana que el municipio tiene destinada a vivienda. Los vecinos preguntan qué autoridad municipal define, según la Constitución, para qué se puede usar el suelo en cada zona.", "vis": "", "items": [{"id": "CCT-308", "niv": 2, "cp": "cc_conocimientos", "e": "Según el artículo 313 de la Constitución, la función de reglamentar los usos del suelo en el municipio corresponde", "f": "Constitución Política de Colombia (texto vigente, Secretaría del Senado), art. 313, num. 7", "vis": "", "o": [["A", "a la Registraduría municipal del Estado Civil, que lleva el registro de los predios.", "La Registraduría se ocupa de las elecciones, el registro civil y la identificación (art. 266); no lleva el registro de predios ni reglamenta el suelo.", false], ["B", "al alcalde, mediante decreto, por ser el jefe de la administración local.", "El alcalde es jefe de la administración local (art. 314), pero la Constitución asigna al concejo la función de reglamentar los usos del suelo.", false], ["C", "a la junta de acción comunal del barrio en que queda la manzana.", "Las juntas de acción comunal son organizaciones comunitarias; no tienen esa función constitucional.", false], ["D", "al concejo municipal, que lo hace mediante acuerdos de alcance local.", "El numeral 7 del artículo 313 asigna a los concejos «reglamentar los usos del suelo» y, dentro de los límites de la ley, vigilar y controlar actividades de construcción y enajenación de inmuebles destinados a vivienda.", true]]}]}, {"comp": "competencias_ciudadanas", "sim": "tyt-3", "ind": "Mecanismos de participación ciudadana", "tt": "", "texto": "En un taller con líderes comunales, el facilitador pide distinguir entre los mecanismos de participación del pueblo en ejercicio de su soberanía y los mecanismos judiciales de protección de derechos.", "vis": "", "items": [{"id": "CCT-309", "niv": 1, "cp": "cc_conocimientos", "e": "¿Cuál de los siguientes NO es uno de los mecanismos de participación enumerados en el artículo 103 de la Constitución?", "f": "Constitución Política de Colombia (texto vigente, Secretaría del Senado), art. 103", "vis": "", "o": [["A", "El cabildo abierto.", "El cabildo abierto sí aparece en el artículo 103.", false], ["B", "La revocatoria del mandato.", "La revocatoria del mandato sí aparece en el artículo 103.", false], ["C", "La acción de tutela.", "La tutela es un mecanismo judicial de protección de derechos fundamentales (art. 86); el artículo 103 enumera el voto, el plebiscito, el referendo, la consulta popular, el cabildo abierto, la iniciativa legislativa y la revocatoria del mandato.", true], ["D", "La consulta popular.", "La consulta popular sí aparece en el artículo 103.", false]]}]}, {"comp": "competencias_ciudadanas", "sim": "tyt-3", "ind": "Veeduría ciudadana a una obra pública", "tt": "", "texto": "Padres de familia y vecinos de un barrio conforman una veeduría ciudadana para hacer seguimiento a la construcción de un colegio financiado con recursos del municipio: revisan el avance de la obra, piden información sobre el contrato y publican informes para la comunidad.", "vis": "", "items": [{"id": "CCT-310", "niv": 3, "cp": "cc_conocimientos", "e": "¿Cuál de las siguientes afirmaciones sobre esta veeduría es correcta?", "f": "Constitución Política de Colombia (texto vigente, Secretaría del Senado), art. 270", "vis": "", "o": [["A", "Es una actuación indebida, porque la vigilancia de la gestión pública es exclusiva de la Contraloría.", "La Contraloría ejerce el control fiscal, pero el artículo 270 prevé expresamente la participación ciudadana en la vigilancia de la gestión pública.", false], ["B", "Es una forma de participación ciudadana para vigilar la gestión pública, que la ley debe organizar.", "El artículo 270 dispone que la ley organizará las formas y los sistemas de participación ciudadana que permitan vigilar la gestión pública que se cumpla en los diversos niveles administrativos y sus resultados.", true], ["C", "Es un órgano de control del Estado que puede imponer sanciones disciplinarias al contratista y a los funcionarios.", "La veeduría es ciudadana; el poder disciplinario preferente lo ejerce la Procuraduría (art. 277, num. 6).", false], ["D", "Es un mecanismo judicial que suspende la obra mientras un juez revisa el contrato del colegio.", "La veeduría no es una acción judicial ni puede suspender obras por sí misma.", false]]}]}, {"comp": "competencias_ciudadanas", "sim": "tyt-3", "ind": "Prestación de servicios públicos", "tt": "", "texto": "En una vereda, el acueducto es administrado desde hace veinte años por una asociación de usuarios. Un vecino recién llegado asegura que esa asociación es ilegal porque, según él, solo el Estado puede prestar servicios públicos.", "vis": "", "items": [{"id": "CCT-311", "niv": 1, "cp": "cc_conocimientos", "e": "¿Qué establece el artículo 365 de la Constitución al respecto?", "f": "Constitución Política de Colombia (texto vigente, Secretaría del Senado), art. 365", "vis": "", "o": [["A", "Solo los pueden prestar empresas particulares, y el Estado no puede intervenir en su funcionamiento.", "El Estado también puede prestarlos y, en todo caso, mantiene la regulación, el control y la vigilancia.", false], ["B", "Solo los puede prestar el Estado, directamente o por medio de sus empresas, en todo el territorio nacional.", "El artículo 365 permite expresamente que los presten comunidades organizadas y particulares.", false], ["C", "Pueden prestarlos el Estado, comunidades organizadas o particulares, con regulación y control estatal.", "El artículo 365 dispone que los servicios públicos «podrán ser prestados por el Estado, directa o indirectamente, por comunidades organizadas, o por particulares» y que el Estado mantendrá su regulación, control y vigilancia.", true], ["D", "Las comunidades organizadas pueden prestarlos sin ningún tipo de regulación ni control por parte del Estado.", "Pueden prestarlos, pero el artículo 365 señala que el Estado mantendrá en todo caso la regulación, el control y la vigilancia.", false]]}]}, {"comp": "competencias_ciudadanas", "sim": "tyt-3", "ind": "Certificación orgánica en una cooperativa cafetera", "tt": "", "texto": "En la asamblea de una cooperativa cafetera, un consultor afirma: «Las fincas con certificación orgánica en el departamento venden su café un 30 % más caro que las demás. Por lo tanto, si nuestros socios se certifican, ganarán un 30 % más».\n\nUn socio responde: «Eso no es cierto. Mi compadre se certificó hace dos años y terminó vendiendo la finca».", "vis": "", "items": [{"id": "CCT-312", "niv": 2, "cp": "cc_argumentacion", "e": "¿Qué supuesto no explícito hace el consultor para llegar a su conclusión?", "f": "Situación original elaborada para este simulacro, párrafo 1", "vis": "", "o": [["A", "Que el café con certificación orgánica se vende más caro que el café convencional.", "Eso no es un supuesto oculto: el consultor lo afirma expresamente como su premisa.", false], ["B", "Que en el departamento hay fincas cafeteras que ya tienen certificación orgánica.", "También es algo que el consultor dice de manera explícita al mencionar esas fincas.", false], ["C", "Que la cooperativa ya cuenta con la certificación orgánica para todas las fincas de sus socios.", "El consultor habla de que los socios se certifiquen en el futuro; supone lo contrario.", false], ["D", "Que los costos y la cantidad de café producido seguirán iguales después de certificarse.", "Pasar de «precio 30 % más alto» a «ganancia 30 % mayor» solo es válido si los costos y la producción no cambian; el consultor lo da por hecho sin decirlo.", true]]}, {"id": "CCT-313", "niv": 3, "cp": "cc_argumentacion", "e": "¿Cuál es la evaluación más adecuada de la respuesta del socio?", "f": "Situación original elaborada para este simulacro, párrafo 2", "vis": "", "o": [["A", "Un solo caso no basta para refutar al consultor, aunque sugiere que certificarse puede tener riesgos.", "La experiencia del compadre no demuestra que la certificación no aumente los ingresos en general, y además no se sabe por qué vendió la finca; aun así, es una señal para examinar costos y riesgos.", true], ["B", "Confirma lo dicho por el consultor, porque muestra que certificarse exige cambios importantes en la finca.", "No lo confirma: el consultor promete mayores ganancias y el caso del compadre apunta en sentido contrario, aunque sea un solo caso.", false], ["C", "Refuta por completo al consultor, porque prueba que certificarse lleva a los caficultores a vender sus fincas.", "Un caso aislado no prueba una relación general, y el socio no explica la causa de la venta.", false], ["D", "Es irrelevante, porque las experiencias de los familiares nunca sirven para discutir decisiones económicas.", "Generalización excesiva: una experiencia puede ser pertinente como indicio, aunque no baste para refutar.", false]]}]}, {"comp": "competencias_ciudadanas", "sim": "tyt-3", "ind": "Mensaje reenviado en un chat vecinal", "tt": "", "texto": "En el chat de la junta de acción comunal de un barrio, un miembro publica: «¡Reenvíen! El lunes la empresa de energía cortará la luz a todo el barrio durante una semana. Me llegó en un mensaje de otro grupo».", "vis": "", "items": [{"id": "CCT-314", "niv": 1, "cp": "cc_argumentacion", "e": "¿Qué tan confiable es la información del mensaje?", "f": "Situación original elaborada para este simulacro", "vis": "", "o": [["A", "Muy confiable, porque es probable que muchas personas ya la hayan reenviado en otros grupos de chat.", "Que un mensaje se reenvíe mucho no lo hace verdadero.", false], ["B", "Poco confiable, porque no indica una fuente verificable y quien la comparte solo dice que le llegó.", "El mensaje no menciona un comunicado de la empresa ni otra fuente comprobable; quien lo publica reconoce que lo recibió de otro grupo.", true], ["C", "Poco confiable, porque las empresas de energía nunca suspenden el servicio en un barrio completo.", "La conclusión es correcta, pero la razón es falsa y absoluta: las empresas sí pueden programar suspensiones.", false], ["D", "Muy confiable, porque la publica un miembro de la junta de acción comunal en el chat oficial del barrio.", "Ser miembro de la junta no hace verificable una información que él mismo recibió de otro grupo.", false]]}]}, {"comp": "competencias_ciudadanas", "sim": "tyt-3", "ind": "Venta de licor en el parque del barrio", "tt": "", "texto": "En la junta administradora local se discute prohibir la venta de licor en el parque de un barrio.\n\nUn comerciante dice: «Si hoy prohíben vender licor en el parque, mañana prohibirán la música, después las reuniones, y al final nadie podrá usar el parque».\n\nUna edil responde: «Según la estación de policía, desde que se permitió la venta de licor en el parque, las riñas allí pasaron de 2 a 9 por mes».", "vis": "", "items": [{"id": "CCT-315", "niv": 2, "cp": "cc_argumentacion", "e": "¿Qué problema tiene el argumento del comerciante?", "f": "Situación original elaborada para este simulacro, párrafo 2", "vis": "", "o": [["A", "Se contradice, porque defiende la venta de licor aunque reconoce que causa riñas.", "El comerciante no reconoce en ningún momento que la venta cause riñas.", false], ["B", "Usa cifras de la estación de policía que no corresponden a lo que de verdad ocurre en el parque.", "El comerciante no usa cifras; quien cita a la policía es la edil.", false], ["C", "Supone, sin pruebas, que esta prohibición traerá una cadena de prohibiciones cada vez mayores.", "El comerciante no muestra por qué prohibir el licor llevaría a prohibir la música y las reuniones; da por hecha una cadena de consecuencias.", true], ["D", "Confunde la venta de licor en el parque con su consumo, que es lo que en realidad causa las riñas.", "El comerciante no habla de consumo ni de riñas; su problema es la cadena de prohibiciones que supone sin pruebas.", false]]}, {"id": "CCT-316", "niv": 1, "cp": "cc_argumentacion", "e": "¿Qué tipo de respaldo usa la edil?", "f": "Situación original elaborada para este simulacro, párrafo 3", "vis": "", "o": [["A", "Una opinión personal sobre el consumo de licor en el barrio que no se apoya en ningún dato.", "La edil sí presenta datos: el número de riñas por mes.", false], ["B", "Un dato institucional que compara las riñas antes y después de permitir la venta.", "La edil cita a la estación de policía y compara el número de riñas antes (2) y después (9) de permitir la venta.", true], ["C", "Una norma nacional que prohíbe la venta de licor en los parques públicos.", "La edil no menciona ninguna norma.", false], ["D", "Una anécdota de un vecino que presenció una riña en el parque del barrio.", "No relata ninguna anécdota; cita cifras de la estación de policía.", false]]}]}, {"comp": "competencias_ciudadanas", "sim": "tyt-3", "ind": "Renuncias y trabajo en casa", "tt": "", "texto": "El área de recursos humanos de una empresa de logística presentó este informe: «Los empleados que trabajan desde la casa están menos comprometidos con la empresa: el 70 % de quienes renunciaron el año pasado trabajaba desde la casa».\n\nEn la misma empresa, el 80 % de los empleados trabaja desde la casa.", "vis": "", "items": [{"id": "CCT-317", "niv": 3, "cp": "cc_argumentacion", "e": "Teniendo en cuenta que el 80 % de los empleados trabaja desde la casa, ¿qué se puede concluir sobre el informe?", "f": "Situación original elaborada para este simulacro, párrafos 1 y 2", "vis": "", "o": [["A", "El informe queda confirmado, porque la mayoría de las personas que renunciaron trabajaba desde la casa.", "Que sean mayoría entre quienes renuncian es esperable si son el 80 % del personal; hay que comparar proporciones.", false], ["B", "Los empleados de oficina renuncian en menor proporción que los que trabajan desde la casa.", "Es al revés: los de oficina son el 20 % del personal y aportan el 30 % de las renuncias.", false], ["C", "No se puede concluir nada, porque los porcentajes nunca permiten comparar grupos de distinto tamaño.", "Los porcentajes sí permiten comparar grupos; precisamente muestran que la conclusión no se sostiene.", false], ["D", "Quienes trabajan desde la casa renuncian proporcionalmente menos, lo que no apoya la conclusión.", "Son el 80 % del personal y solo el 70 % de las renuncias; los de oficina son el 20 % y aportan el 30 % de las renuncias. Los que trabajan desde la casa renuncian en menor proporción.", true]]}, {"id": "CCT-318", "niv": 2, "cp": "cc_argumentacion", "e": "¿Qué debilidad tiene el informe?", "f": "Situación original elaborada para este simulacro, párrafo 1", "vis": "", "o": [["A", "Iguala renunciar con tener poco compromiso, sin considerar otras razones, como una mejor oferta.", "El informe toma la renuncia como prueba de falta de compromiso, pero una persona puede renunciar por muchas otras razones.", true], ["B", "Se basa en datos del año pasado, que no pueden usarse para sacar ninguna conclusión sobre la empresa.", "Los datos recientes sí pueden usarse; el problema es lo que se concluye de ellos.", false], ["C", "Mezcla las renuncias de dos años distintos, lo que impide comparar de forma justa los dos grupos.", "El informe se refiere solo a las renuncias del año pasado; no mezcla periodos.", false], ["D", "Presenta la información en porcentajes en lugar de números absolutos, lo cual siempre es engañoso.", "Los porcentajes no son engañosos por sí mismos; la debilidad está en la interpretación.", false]]}]}, {"comp": "competencias_ciudadanas", "sim": "tyt-3", "ind": "Recicladores de oficio y nueva ruta de reciclaje", "tt": "", "texto": "(1) La alcaldía de una ciudad intermedia contrató a una empresa privada para recoger en camiones el material reciclable de los conjuntos residenciales. Hasta ahora, ese material lo recogían unas 300 personas recicladoras de oficio, organizadas en la asociación Manos Verdes, que lo venden a bodegas de reciclaje.\n\n(2) La presidenta de Manos Verdes: «Llevamos 20 años viviendo del reciclaje. Si el camión se lleva el material, nos quitan el sustento. No pedimos limosna: queremos que nos contraten para hacer la ruta».\n\n(3) El gerente de la empresa contratista: «El contrato nos exige recoger 40 toneladas al mes. Con los camiones somos más rápidos y no dejamos bolsas regadas en los andenes».\n\n(4) La administradora de un conjunto residencial: «A los residentes les molestan las bolsas abiertas en la portería; prefieren un horario fijo de recolección».\n\n(5) El secretario de Ambiente: «La meta es aumentar el material que se aprovecha y reducir lo que llega al relleno sanitario, que está a punto de llenarse».", "vis": "", "items": [{"id": "CCT-319", "niv": 1, "cp": "cc_multiperspectivismo", "e": "¿Qué pide la asociación Manos Verdes?", "f": "Situación original elaborada para este simulacro, párrafo 2", "vis": "", "o": [["A", "Que la contraten para hacer la ruta de recolección del material reciclable.", "La presidenta dice: «No pedimos limosna: queremos que nos contraten para hacer la ruta» (párrafo 2).", true], ["B", "Que se suspenda toda recolección de material reciclable en los conjuntos residenciales.", "No pide suspender la recolección, sino hacerla ellos.", false], ["C", "Que los conjuntos residenciales establezcan un horario fijo para sacar el reciclaje.", "El horario fijo es lo que prefieren los residentes, según la administradora.", false], ["D", "Recibir un subsidio de la alcaldía mientras sus asociados buscan otro trabajo.", "La presidenta rechaza expresamente esa idea: «No pedimos limosna».", false]]}, {"id": "CCT-320", "niv": 2, "cp": "cc_multiperspectivismo", "e": "¿Qué interés comparten el secretario de Ambiente y la asociación Manos Verdes?", "f": "Situación original elaborada para este simulacro, párrafos 1, 2 y 5", "vis": "", "o": [["A", "Que los residentes dejen de separar en sus casas el material reciclable de la basura.", "Ninguno lo plantea, y separar el material favorece su aprovechamiento.", false], ["B", "Que el material reciclable se recupere y no termine en el relleno sanitario.", "La meta del secretario es aumentar el material aprovechado; los recicladores viven de recuperar ese material y venderlo a las bodegas (párrafos 1 y 5).", true], ["C", "Que los camiones de la empresa contratista hagan toda la recolección del material reciclable.", "Eso va contra lo que pide la asociación, que quiere hacer la ruta.", false], ["D", "Que se reduzca la cantidad de toneladas de material reciclable que se recogen cada mes.", "Ninguno de los dos quiere recoger menos material; el secretario quiere aprovechar más.", false]]}, {"id": "CCT-321", "niv": 2, "cp": "cc_multiperspectivismo", "e": "¿Por qué la administradora del conjunto podría simpatizar con la propuesta de la empresa contratista?", "f": "Situación original elaborada para este simulacro, párrafos 3 y 4", "vis": "", "o": [["A", "Porque la administradora quiere que el relleno sanitario reciba más material reciclable.", "Nadie quiere que llegue más material al relleno; además, la administradora no habla del relleno.", false], ["B", "Porque la empresa contratista promete pagar a los residentes por el material reciclable que entreguen.", "El texto no menciona pagos a los residentes.", false], ["C", "Porque la empresa ofrece una recolección ordenada, sin bolsas regadas, como piden los residentes.", "El gerente destaca que no dejan bolsas regadas, y la administradora dice que a los residentes les molestan las bolsas abiertas (párrafos 3 y 4).", true], ["D", "Porque los residentes del conjunto se oponen a que exista cualquier ruta de reciclaje.", "Los residentes no se oponen al reciclaje; piden orden y un horario fijo.", false]]}, {"id": "CCT-322", "niv": 3, "cp": "cc_multiperspectivismo", "e": "Si la alcaldía decidiera que la ruta la hagan los recicladores de Manos Verdes con horarios fijos y recipientes cerrados, ¿qué actor tendría más razones para objetar?", "f": "Situación original elaborada para este simulacro", "vis": "", "o": [["A", "El secretario de Ambiente, porque la medida aumentaría el material reciclable que llega al relleno sanitario.", "Nada indica que la medida aumente lo que llega al relleno; los recicladores viven de recuperar el material.", false], ["B", "La presidenta de Manos Verdes, porque la asociación se niega a trabajar con horarios fijos.", "La asociación pide justamente hacer la ruta; el texto no dice que rechace los horarios fijos.", false], ["C", "La administradora del conjunto, porque los residentes prefieren horarios variables de recolección.", "Es al revés: los residentes prefieren un horario fijo, y la medida lo incluye junto con recipientes cerrados.", false], ["D", "El gerente de la empresa, porque dejaría de recibir el material que necesita para su meta de 40 toneladas.", "La empresa tiene la obligación contractual de recoger 40 toneladas al mes; si la ruta pasa a los recicladores, pierde ese material (párrafo 3).", true]]}]}, {"comp": "competencias_ciudadanas", "sim": "tyt-3", "ind": "Monitoreo de asesores en un centro de contacto", "tt": "", "texto": "Un centro de contacto que atiende a los clientes de un banco instalará un programa que registra cada minuto que los asesores pasan fuera de llamada y toma capturas aleatorias de sus pantallas.\n\nEl gerente de operaciones: «El banco nos exige contestar el 90 % de las llamadas en menos de 30 segundos. Si no cumplimos, podemos perder el contrato y, con él, 400 empleos».\n\nEl sindicato: «Medir cada minuto aumenta el estrés, y las capturas de pantalla pueden mostrar información personal de los asesores. Pedimos que se informe qué datos se recogen y para qué».\n\nUna asesora, madre cabeza de familia: «A veces debo contestar un mensaje del colegio de mi hijo. Si cada minuto cuenta en mi contra, me pueden sancionar por eso».\n\nLa representante del banco: «Para nosotros lo importante es el tiempo de respuesta y la protección de los datos de nuestros clientes».", "vis": "", "items": [{"id": "CCT-323", "niv": 1, "cp": "cc_multiperspectivismo", "e": "¿Qué pide concretamente el sindicato?", "f": "Situación original elaborada para este simulacro, párrafo 3", "vis": "", "o": [["A", "Que el banco reduzca a la mitad el número de llamadas diarias.", "El texto no menciona esa petición.", false], ["B", "Que se sancione a los asesores que salgan de las llamadas.", "El sindicato cuestiona la medición de cada minuto; no pide sanciones.", false], ["C", "Que se cancele el contrato con el banco para evitar la presión laboral.", "El sindicato no pide cancelar el contrato, que además sostiene 400 empleos.", false], ["D", "Que se informe qué datos recoge el programa y con qué finalidad.", "El sindicato dice: «Pedimos que se informe qué datos se recogen y para qué».", true]]}, {"id": "CCT-324", "niv": 2, "cp": "cc_multiperspectivismo", "e": "¿En qué se parecen las posiciones del gerente de operaciones y de la representante del banco?", "f": "Situación original elaborada para este simulacro, párrafos 2 y 5", "vis": "", "o": [["A", "Ambos piden que se suspenda la instalación del programa de monitoreo.", "Ninguno pide suspenderlo; el gerente lo justifica.", false], ["B", "Ambos temen que el programa revele información personal de los asesores.", "Ese temor lo expresa el sindicato; la representante habla de los datos de los clientes.", false], ["C", "Ambos dan prioridad a cumplir el tiempo de respuesta de las llamadas.", "El gerente menciona la exigencia de contestar el 90 % en menos de 30 segundos, y la representante dice que lo importante es el tiempo de respuesta.", true], ["D", "Ambos proponen sancionar a los asesores que contestan mensajes personales.", "Ninguno propone sanciones; esa es una preocupación de la asesora.", false]]}, {"id": "CCT-325", "niv": 3, "cp": "cc_multiperspectivismo", "e": "¿Cómo se relaciona la preocupación de la representante del banco por los datos con la del sindicato?", "f": "Situación original elaborada para este simulacro, párrafos 3 y 5", "vis": "", "o": [["A", "Ambas se refieren a lo que captan las pantallas: el banco piensa en sus clientes y el sindicato, en los asesores.", "Las capturas de pantalla pueden contener datos de los clientes (interés del banco) y datos personales de los asesores (interés del sindicato); es el mismo tema visto desde dos perspectivas.", true], ["B", "Son contradictorias, porque el banco quiere que se capture más información personal de los asesores.", "La representante no pide más información de los asesores; habla de proteger los datos de los clientes.", false], ["C", "No tienen ninguna relación, porque las capturas de pantalla no contienen datos de ningún tipo.", "El sindicato advierte que las capturas sí pueden mostrar información personal.", false], ["D", "Son idénticas, porque las dos partes buscan proteger únicamente la información personal de los asesores del centro.", "El banco se refiere a los datos de sus clientes, no a los de los asesores.", false]]}]}, {"comp": "competencias_ciudadanas", "sim": "tyt-3", "ind": "Festival de música en el parque principal", "tt": "", "texto": "Un grupo de jóvenes organiza cada año, en el parque principal de un municipio, un festival de música gratuito de dos días. Este año, la alcaldía estudia trasladarlo al coliseo, ubicado a las afueras.\n\nLa organizadora del festival: «El parque es el corazón del pueblo; allí el festival es de todos. En el coliseo se pierde el ambiente y muchos no tendrán cómo llegar».\n\nEl presidente de la asociación de comerciantes del parque: «En esos dos días vendemos lo de un mes. Si se lo llevan, perdemos».\n\nUna vecina del parque, de 80 años: «No me opongo a la música, pero el año pasado hubo sonido hasta las tres de la mañana y no pude dormir».\n\nEl comandante de policía: «El parque no tiene salidas suficientes en caso de emergencia; en el coliseo es más fácil controlar el ingreso».", "vis": "", "items": [{"id": "CCT-326", "niv": 1, "cp": "cc_multiperspectivismo", "e": "¿Qué le preocupa a la vecina del parque?", "f": "Situación original elaborada para este simulacro, párrafo 4", "vis": "", "o": [["A", "Que los comerciantes del parque pierdan sus ventas.", "Esa preocupación es del presidente de la asociación de comerciantes.", false], ["B", "Que el sonido se prolongue hasta la madrugada y no la deje dormir.", "La vecina dice que no se opone a la música, sino a que el sonido se prolongue hasta las tres de la mañana.", true], ["C", "Que el festival se traslade al coliseo de las afueras.", "La vecina no habla del traslado; su queja es el horario del sonido.", false], ["D", "Que el parque no tenga salidas suficientes para emergencias.", "Esa preocupación la expresa el comandante de policía.", false]]}, {"id": "CCT-327", "niv": 2, "cp": "cc_multiperspectivismo", "e": "¿Qué actores coinciden en preferir que el festival siga en el parque?", "f": "Situación original elaborada para este simulacro, párrafos 2, 3 y 5", "vis": "", "o": [["A", "La vecina del parque y el comandante de policía.", "El comandante señala ventajas del coliseo, y la vecina no se pronuncia sobre el lugar.", false], ["B", "La organizadora del festival y el comandante de policía.", "El comandante considera que el coliseo es más seguro.", false], ["C", "El comandante de policía y el presidente de la asociación de comerciantes.", "El comandante prefiere el coliseo por razones de seguridad.", false], ["D", "La organizadora del festival y el presidente de la asociación de comerciantes.", "La organizadora defiende el parque como «corazón del pueblo» y los comerciantes temen perder las ventas si el festival se va.", true]]}, {"id": "CCT-328", "niv": 3, "cp": "cc_multiperspectivismo", "e": "¿Qué solución tendría mayor aceptación entre la organizadora, los comerciantes y la vecina?", "f": "Situación original elaborada para este simulacro", "vis": "", "o": [["A", "Mantener el festival en el parque, con sonido hasta las tres de la mañana pero a menor volumen.", "Conserva el parque, pero el sonido seguiría hasta la madrugada, que es la queja concreta de la vecina.", false], ["B", "Mantener el festival en el parque y fijar, para los dos días, un horario de sonido que termine a la medianoche.", "La organizadora y los comerciantes conservan el parque, y la vecina, que no se opone a la música, ve atendida su queja por el sonido en la madrugada.", true], ["C", "Hacer el festival en el coliseo, con sonido hasta la medianoche y puestos dentro para los comerciantes del parque.", "Parece conciliadora, pero la organizadora rechaza el coliseo porque el festival perdería su ambiente y muchos no tendrían cómo llegar.", false], ["D", "Dividir el festival: un día en el parque y otro en el coliseo, ambos con sonido hasta las tres de la mañana.", "Mantiene el sonido hasta las tres de la mañana, justo lo que impidió dormir a la vecina, y quita a los comerciantes uno de sus dos días de ventas.", false]]}]}, {"comp": "competencias_ciudadanas", "sim": "tyt-3", "ind": "Prohibición de plásticos de un solo uso en las playas", "tt": "", "texto": "El concejo de un municipio costero prohibió, desde enero, vender o entregar pitillos, vasos y bolsas plásticas de un solo uso en las playas. La medida busca reducir la basura que llega al mar y que afecta la pesca y el atractivo turístico.\n\nLos vendedores de jugos y raspados de la playa dicen que los vasos de cartón cuestan el triple que los de plástico y que tendrán que subir sus precios. Una pequeña fábrica local de bolsas plásticas, que emplea a 25 personas, teme tener que cerrar. La asociación de pescadores informa que cada vez salen más plásticos en sus redes.\n\nLa oficina de turismo propone crear un fondo, financiado con un aporte de los hoteles, para subsidiar durante un año los vasos de cartón de los vendedores informales y apoyar a la fábrica para que produzca empaques biodegradables.", "vis": "", "items": [{"id": "CCT-329", "niv": 1, "cp": "cc_sistemico", "e": "¿Qué dimensiones del problema entran en tensión en la queja de los vendedores de la playa?", "f": "Situación original elaborada para este simulacro, párrafos 1 y 2", "vis": "", "o": [["A", "La ambiental, que busca la medida, y la económica de los vendedores, cuyos costos aumentan.", "La prohibición persigue un fin ambiental (menos basura en el mar), pero eleva el costo de los vasos para los vendedores, que tendrán que subir precios.", true], ["B", "La de salud y la educativa, porque los vasos de cartón contaminan más los jugos que los de plástico.", "El texto no menciona efectos de los vasos de cartón en la salud.", false], ["C", "La política y la jurídica, porque los vendedores niegan que el concejo pueda expedir la norma.", "Los vendedores no cuestionan la competencia del concejo.", false], ["D", "La cultural y la religiosa, porque la medida cambia las costumbres de los turistas en la playa.", "Los vendedores no hablan de costumbres ni de religión; su queja es por costos y precios.", false]]}, {"id": "CCT-330", "niv": 2, "cp": "cc_sistemico", "e": "¿Qué efecto en cadena podría derivarse de la situación que describen los vendedores?", "f": "Situación original elaborada para este simulacro, párrafo 2", "vis": "", "o": [["A", "Al sacar menos plástico en las redes, los pescadores tendrán que cobrar más caro por el pescado.", "Menos plástico en las redes no implica mayores costos para los pescadores.", false], ["B", "Al reducirse el plástico en el mar, la fábrica local de bolsas contratará a más personas.", "La fábrica produce bolsas plásticas y teme cerrar; la medida no le genera más empleo.", false], ["C", "Al subir precios por el costo de los vasos, podrían vender menos y ver reducidos sus ingresos.", "Los vendedores anuncian que subirán precios por el costo de los vasos; precios más altos pueden reducir las ventas y, con ello, sus ingresos.", true], ["D", "Al ser más caros los vasos de cartón, la basura que llega al mar aumentará de inmediato.", "No hay razón para que un vaso más caro aumente la basura; la medida busca lo contrario.", false]]}, {"id": "CCT-331", "niv": 2, "cp": "cc_sistemico", "e": "La propuesta de la oficina de turismo busca principalmente", "f": "Situación original elaborada para este simulacro, párrafo 3", "vis": "", "o": [["A", "aliviar los costos de la medida para vendedores y fábrica sin renunciar a su fin ambiental.", "El fondo subsidia los vasos de cartón y apoya la conversión de la fábrica a empaques biodegradables, mientras se mantiene la prohibición.", true], ["B", "eliminar la prohibición de los plásticos para proteger los empleos de la fábrica local de bolsas.", "La propuesta no elimina la prohibición; ayuda a la fábrica a producir empaques biodegradables.", false], ["C", "trasladar a los pescadores el costo de comprar los vasos de cartón que usan los vendedores.", "El fondo lo financian los hoteles, no los pescadores.", false], ["D", "atraer más turistas al municipio mediante una reducción de las tarifas de los hoteles.", "La propuesta pide un aporte a los hoteles; no habla de bajar tarifas.", false]]}, {"id": "CCT-332", "niv": 3, "cp": "cc_sistemico", "e": "Otro municipio, sin turismo ni hoteles, quiere aplicar la misma prohibición con el mismo fondo. ¿Qué es lo más adecuado afirmar?", "f": "Situación original elaborada para este simulacro, párrafo 3", "vis": "", "o": [["A", "Ninguna parte de la medida podría aplicarse, porque la basura plástica solo es un problema en las playas del mar.", "La basura plástica afecta también ríos, calles y suelos; la prohibición podría tener sentido allí.", false], ["B", "La medida tendría los mismos efectos, porque todos los municipios tienen vendedores de jugos en playas.", "No todos los municipios tienen playas ni vendedores de playa; los efectos dependen del contexto.", false], ["C", "El fondo funcionaría exactamente igual, porque su financiación no depende de la actividad turística.", "Sí depende: el fondo se financia con el aporte de los hoteles.", false], ["D", "La prohibición podría aplicarse, pero el fondo debería financiarse de otro modo, pues allí no hay hoteles.", "La prohibición no depende del turismo, pero el fondo, tal como se diseñó, se financia con aportes de los hoteles; sin ellos habría que buscar otra fuente.", true]]}]}, {"comp": "competencias_ciudadanas", "sim": "tyt-3", "ind": "Citas médicas por aplicación móvil", "tt": "", "texto": "Un hospital departamental eliminó la asignación de citas en ventanilla y la reemplazó por una aplicación móvil y una línea telefónica. Antes, los pacientes hacían fila desde las 4 de la mañana.\n\nTres meses después, el hospital informa que las filas desaparecieron y que se redujeron las citas perdidas, porque la aplicación envía recordatorios. Sin embargo, la personería municipal ha recibido quejas de adultos mayores de zonas rurales que no tienen teléfono inteligente y no logran comunicarse con la línea, que suele estar ocupada. Las cuatro personas que atendían la ventanilla fueron trasladadas al área de facturación.", "vis": "", "items": [{"id": "CCT-333", "niv": 1, "cp": "cc_sistemico", "e": "¿Cuál de los siguientes es un efecto positivo de la medida sobre la organización del servicio?", "f": "Situación original elaborada para este simulacro, párrafo 2", "vis": "", "o": [["A", "La congestión de la línea telefónica, que suele estar ocupada durante el día.", "Es un efecto real de la medida, pero negativo: dificulta que los pacientes pidan sus citas.", false], ["B", "La reducción de las citas perdidas gracias a los recordatorios de la aplicación.", "El hospital informa que se redujeron las citas perdidas porque la aplicación envía recordatorios (párrafo 2).", true], ["C", "Una mejora en la salud de los pacientes, que ya no tienen que madrugar a hacer fila.", "El hospital no informa sobre la salud de los pacientes; además, sería un efecto sobre la salud, no sobre la organización del servicio.", false], ["D", "Una mayor rapidez en la facturación, gracias a las cuatro personas trasladadas a esa área.", "Suena positivo, pero el texto solo dice que esas personas fueron trasladadas; no informa que la facturación sea ahora más rápida.", false]]}, {"id": "CCT-334", "niv": 2, "cp": "cc_sistemico", "e": "¿Qué relación entre dimensiones del problema revelan las quejas recibidas por la personería?", "f": "Situación original elaborada para este simulacro, párrafo 2", "vis": "", "o": [["A", "Los adultos mayores de las zonas rurales prefieren no asistir a las citas médicas del hospital.", "Las quejas muestran lo contrario: quieren citas y no logran pedirlas.", false], ["B", "Las filas se debían a la falta de médicos, y no a la forma en que se asignaban las citas.", "Las filas se formaban para pedir citas en ventanilla y desaparecieron al cambiar el sistema de asignación.", false], ["C", "La dimensión tecnológica de la solución choca con el acceso a la salud de quienes no tienen medios para usarla.", "La medida tecnológica (aplicación y línea) dejó sin acceso a adultos mayores rurales sin teléfono inteligente: lo tecnológico afecta lo social y el derecho a la salud.", true], ["D", "La aplicación mejoró el acceso de los pacientes rurales, porque ya no tienen que viajar a hacer fila.", "Las quejas muestran lo contrario: adultos mayores rurales sin teléfono inteligente no logran pedir citas.", false]]}, {"id": "CCT-335", "niv": 3, "cp": "cc_sistemico", "e": "¿Qué ajuste conservaría los beneficios de la medida y atendería las quejas?", "f": "Situación original elaborada para este simulacro", "vis": "", "o": [["A", "Volver a asignar las citas en ventanilla a todos, pero enviar los recordatorios por mensaje de texto.", "Atiende a quienes no tienen teléfono inteligente, pero obliga a todos a volver a las filas que la medida había eliminado.", false], ["B", "Mantener la aplicación y entregar a los adultos mayores un folleto con instrucciones para usarla.", "Conserva los beneficios, pero no resuelve la queja: los afectados no tienen teléfono inteligente en el cual usar la aplicación.", false], ["C", "Mantener la aplicación y habilitar un horario de atención presencial para quienes no pueden usarla.", "Se conservan los recordatorios y la reducción de filas para la mayoría, y se abre una vía de acceso para quienes no tienen teléfono inteligente.", true], ["D", "Trasladar más personal al área de facturación para reducir los costos de la atención.", "No resuelve el problema de acceso de los adultos mayores ni se relaciona con las quejas.", false]]}]}, {"comp": "ingles", "sim": "tyt-3", "ind": "Parte 1: equipo de cocina de un restaurante", "tt": "", "texto": "Which word (A–H) matches each description? There is one word for each description. You will not use two of the words.\n\nWords:\nA. apron\nB. chopping board\nC. fridge\nD. frying pan\nE. kettle\nF. knife\nG. oven\nH. sink\n\nExample: Cooks wear this over their clothes to keep them clean.\nAnswer: apron\n\n(The word in the example cannot be used again.)", "vis": "", "items": [{"id": "EN3-156", "niv": 1, "cp": "en_p1", "e": "You keep food and drinks cold in this.", "f": "Texto original elaborado para este simulacro (parte 1, lista de palabras)", "vis": "", "o": [["A", "apron", "«apron» (delantal) es la palabra del ejemplo y no se vuelve a usar; además, la descripción habla de un aparato para mantener fríos los alimentos y las bebidas.", false], ["B", "chopping board", "«chopping board» significa tabla de picar; no corresponde, porque la descripción habla de un aparato para mantener fríos los alimentos y las bebidas.", false], ["C", "fridge", "Correcta: «fridge» significa nevera; coincide con la descripción, que habla de un aparato para mantener fríos los alimentos y las bebidas.", true], ["D", "frying pan", "«frying pan» significa sartén; no corresponde, porque la descripción habla de un aparato para mantener fríos los alimentos y las bebidas.", false], ["E", "kettle", "«kettle» significa hervidor o tetera eléctrica; no corresponde, porque la descripción habla de un aparato para mantener fríos los alimentos y las bebidas.", false], ["F", "knife", "«knife» significa cuchillo; no corresponde, porque la descripción habla de un aparato para mantener fríos los alimentos y las bebidas.", false], ["G", "oven", "«oven» significa horno; no corresponde, porque la descripción habla de un aparato para mantener fríos los alimentos y las bebidas.", false], ["H", "sink", "«sink» significa lavaplatos (la poceta); no corresponde, porque la descripción habla de un aparato para mantener fríos los alimentos y las bebidas.", false]]}, {"id": "EN3-157", "niv": 1, "cp": "en_p1", "e": "You use this to boil water for tea or coffee.", "f": "Texto original elaborado para este simulacro (parte 1, lista de palabras)", "vis": "", "o": [["A", "apron", "«apron» (delantal) es la palabra del ejemplo y no se vuelve a usar; además, la descripción habla de un aparato para hervir agua para té o café.", false], ["B", "chopping board", "«chopping board» significa tabla de picar; no corresponde, porque la descripción habla de un aparato para hervir agua para té o café.", false], ["C", "fridge", "«fridge» significa nevera; no corresponde, porque la descripción habla de un aparato para hervir agua para té o café.", false], ["D", "frying pan", "«frying pan» significa sartén; no corresponde, porque la descripción habla de un aparato para hervir agua para té o café.", false], ["E", "kettle", "Correcta: «kettle» significa hervidor o tetera eléctrica; coincide con la descripción, que habla de un aparato para hervir agua para té o café.", true], ["F", "knife", "«knife» significa cuchillo; no corresponde, porque la descripción habla de un aparato para hervir agua para té o café.", false], ["G", "oven", "«oven» significa horno; no corresponde, porque la descripción habla de un aparato para hervir agua para té o café.", false], ["H", "sink", "«sink» significa lavaplatos (la poceta); no corresponde, porque la descripción habla de un aparato para hervir agua para té o café.", false]]}, {"id": "EN3-158", "niv": 1, "cp": "en_p1", "e": "This sharp tool is used to cut meat or vegetables.", "f": "Texto original elaborado para este simulacro (parte 1, lista de palabras)", "vis": "", "o": [["A", "apron", "«apron» (delantal) es la palabra del ejemplo y no se vuelve a usar; además, la descripción habla de una herramienta afilada para cortar carne o verduras.", false], ["B", "chopping board", "«chopping board» significa tabla de picar; no corresponde, porque la descripción habla de una herramienta afilada para cortar carne o verduras.", false], ["C", "fridge", "«fridge» significa nevera; no corresponde, porque la descripción habla de una herramienta afilada para cortar carne o verduras.", false], ["D", "frying pan", "«frying pan» significa sartén; no corresponde, porque la descripción habla de una herramienta afilada para cortar carne o verduras.", false], ["E", "kettle", "«kettle» significa hervidor o tetera eléctrica; no corresponde, porque la descripción habla de una herramienta afilada para cortar carne o verduras.", false], ["F", "knife", "Correcta: «knife» significa cuchillo; coincide con la descripción, que habla de una herramienta afilada para cortar carne o verduras.", true], ["G", "oven", "«oven» significa horno; no corresponde, porque la descripción habla de una herramienta afilada para cortar carne o verduras.", false], ["H", "sink", "«sink» significa lavaplatos (la poceta); no corresponde, porque la descripción habla de una herramienta afilada para cortar carne o verduras.", false]]}, {"id": "EN3-159", "niv": 1, "cp": "en_p1", "e": "You wash the dirty plates and glasses in this.", "f": "Texto original elaborado para este simulacro (parte 1, lista de palabras)", "vis": "", "o": [["A", "apron", "«apron» (delantal) es la palabra del ejemplo y no se vuelve a usar; además, la descripción habla de el lugar donde se lavan los platos y vasos sucios.", false], ["B", "chopping board", "«chopping board» significa tabla de picar; no corresponde, porque la descripción habla de el lugar donde se lavan los platos y vasos sucios.", false], ["C", "fridge", "«fridge» significa nevera; no corresponde, porque la descripción habla de el lugar donde se lavan los platos y vasos sucios.", false], ["D", "frying pan", "«frying pan» significa sartén; no corresponde, porque la descripción habla de el lugar donde se lavan los platos y vasos sucios.", false], ["E", "kettle", "«kettle» significa hervidor o tetera eléctrica; no corresponde, porque la descripción habla de el lugar donde se lavan los platos y vasos sucios.", false], ["F", "knife", "«knife» significa cuchillo; no corresponde, porque la descripción habla de el lugar donde se lavan los platos y vasos sucios.", false], ["G", "oven", "«oven» significa horno; no corresponde, porque la descripción habla de el lugar donde se lavan los platos y vasos sucios.", false], ["H", "sink", "Correcta: «sink» significa lavaplatos (la poceta); coincide con la descripción, que habla de el lugar donde se lavan los platos y vasos sucios.", true]]}, {"id": "EN3-160", "niv": 2, "cp": "en_p1", "e": "You bake bread and cakes inside this.", "f": "Texto original elaborado para este simulacro (parte 1, lista de palabras)", "vis": "", "o": [["A", "apron", "«apron» (delantal) es la palabra del ejemplo y no se vuelve a usar; además, la descripción habla de un aparato dentro del cual se hornean pan y tortas.", false], ["B", "chopping board", "«chopping board» significa tabla de picar; no corresponde, porque la descripción habla de un aparato dentro del cual se hornean pan y tortas.", false], ["C", "fridge", "«fridge» significa nevera; no corresponde, porque la descripción habla de un aparato dentro del cual se hornean pan y tortas.", false], ["D", "frying pan", "«frying pan» significa sartén; no corresponde, porque la descripción habla de un aparato dentro del cual se hornean pan y tortas.", false], ["E", "kettle", "«kettle» significa hervidor o tetera eléctrica; no corresponde, porque la descripción habla de un aparato dentro del cual se hornean pan y tortas.", false], ["F", "knife", "«knife» significa cuchillo; no corresponde, porque la descripción habla de un aparato dentro del cual se hornean pan y tortas.", false], ["G", "oven", "Correcta: «oven» significa horno; coincide con la descripción, que habla de un aparato dentro del cual se hornean pan y tortas.", true], ["H", "sink", "«sink» significa lavaplatos (la poceta); no corresponde, porque la descripción habla de un aparato dentro del cual se hornean pan y tortas.", false]]}]}, {"comp": "ingles", "sim": "tyt-3", "ind": "Parte 2: avisos en lugares de trabajo", "tt": "", "texto": "Read each notice. Where can you see it? Choose the correct place.", "vis": "", "items": [{"id": "EN3-161", "niv": 1, "cp": "en_p2", "e": "\"Tractors cross here. Keep the gates closed: animals inside.\"\n\nWhere can you see this notice?", "f": "Texto original elaborado para este simulacro, aviso 1", "vis": "", "o": [["A", "at a hairdresser's", "En una peluquería no circulan tractores ni hay animales encerrados tras un portón.", false], ["B", "in a bank", "En un banco no hay tractores ni animales; el aviso no tiene sentido allí.", false], ["C", "on a farm", "Correcta: tractores que cruzan, portones que deben quedar cerrados y animales adentro son propios de una finca.", true]]}, {"id": "EN3-162", "niv": 1, "cp": "en_p2", "e": "\"Check-out time is 12 noon. Please leave your room key at reception.\"\n\nWhere can you see this notice?", "f": "Texto original elaborado para este simulacro, aviso 2", "vis": "", "o": [["A", "in a school", "En un colegio no hay horario de «check-out» ni llaves de habitación que se entreguen en recepción.", false], ["B", "in a hotel", "Correcta: «check-out time» (hora de salida), «room key» (llave de la habitación) y «reception» son propios de un hotel.", true], ["C", "at a bus station", "En una terminal de buses no hay habitaciones ni hora de «check-out»; «room key» no tiene sentido allí.", false]]}, {"id": "EN3-163", "niv": 1, "cp": "en_p2", "e": "\"Parcels over 2 kg must be weighed at the counter before posting.\"\n\nWhere can you see this notice?", "f": "Texto original elaborado para este simulacro, aviso 3", "vis": "", "o": [["A", "at a post office", "Correcta: pesar paquetes («parcels») en el mostrador antes de enviarlos («posting») es un trámite de la oficina de correos.", true], ["B", "at a petrol station", "En una estación de gasolina no se pesan ni se envían paquetes por correo.", false], ["C", "in a supermarket", "En un supermercado se pesan frutas y verduras, pero no se envían paquetes por correo.", false]]}, {"id": "EN3-164", "niv": 2, "cp": "en_p2", "e": "\"Packers: check each order twice before closing the box. Labels go on the top.\"\n\nWhere can you see this notice?", "f": "Texto original elaborado para este simulacro, aviso 4", "vis": "", "o": [["A", "in a warehouse", "Correcta: el aviso se dirige a empacadores («packers») que revisan pedidos («orders») y cierran cajas con etiquetas: es un almacén de despachos.", true], ["B", "in a library", "En una biblioteca se ordenan libros, pero no se empacan pedidos en cajas para enviarlos.", false], ["C", "at a car park", "En un parqueadero no hay empacadores ni pedidos que revisar.", false]]}, {"id": "EN3-165", "niv": 2, "cp": "en_p2", "e": "\"Every blood sample must be labelled with the patient's name before it is tested on these machines.\"\n\nWhere can you see this notice?", "f": "Texto original elaborado para este simulacro, aviso 5", "vis": "", "o": [["A", "in a supermarket", "En un supermercado se regalan muestras de productos, pero no se analizan muestras de sangre.", false], ["B", "at a hospital reception", "En la recepción se atiende a los pacientes, pero allí no hay máquinas para analizar muestras de sangre.", false], ["C", "in a hospital laboratory", "Correcta: las muestras de sangre se rotulan y se analizan en las máquinas que están allí mismo («these machines»): el aviso está dentro de un laboratorio clínico.", true]]}, {"id": "EN3-166", "niv": 2, "cp": "en_p2", "e": "\"Out of order. A technician is on the way. Please use the stairs.\"\n\nWhere can you see this notice?", "f": "Texto original elaborado para este simulacro, aviso 6", "vis": "", "o": [["A", "on a cash machine", "Un cajero dañado no se reemplaza usando las escaleras; el aviso indicaría buscar otro cajero.", false], ["B", "next to a lift", "Correcta: si algo está dañado y se pide usar las escaleras (stairs), lo que no funciona es el ascensor (lift).", true], ["C", "on a photocopier", "Una fotocopiadora dañada pue
