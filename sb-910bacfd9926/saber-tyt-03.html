de tener un aviso de «out of order», pero usar las escaleras no la reemplaza.", false]]}]}, {"comp": "ingles", "sim": "tyt-3", "ind": "Parte 3: conversaciones en el trabajo", "tt": "", "texto": "Complete the conversations. Choose the best reply to each sentence.", "vis": "", "items": [{"id": "EN3-167", "niv": 1, "cp": "en_p3", "e": "\"Is there a car park near the office?\"", "f": "Texto original elaborado para este simulacro, conversación 1", "vis": "", "o": [["A", "Yes, I park very well, thanks.", "Habla de su habilidad para parquear; no dice si hay un parqueadero cerca.", false], ["B", "No, it isn't my car.", "Nadie preguntó de quién es un carro; no responde a la pregunta.", false], ["C", "Yes, there's one behind the building.", "Correcta: la pregunta pide información sobre un parqueadero y la respuesta dice dónde hay uno: detrás del edificio.", true]]}, {"id": "EN3-168", "niv": 1, "cp": "en_p3", "e": "\"Which bus goes to the hospital?\"", "f": "Texto original elaborado para este simulacro, conversación 2", "vis": "", "o": [["A", "The number 12, I think.", "Correcta: «Which bus...?» pide identificar un bus, y la respuesta da su número.", true], ["B", "Yes, it goes there.", "Una pregunta con «which» no se responde con «yes»; hay que decir cuál bus.", false], ["C", "Every twenty minutes.", "Dice con qué frecuencia pasa un bus («How often...?»), no cuál va al hospital.", false]]}, {"id": "EN3-169", "niv": 1, "cp": "en_p3", "e": "\"Can we move the meeting to Thursday?\"", "f": "Texto original elaborado para este simulacro, conversación 3", "vis": "", "o": [["A", "No, I moved house last year.", "Toma «move» en el sentido de mudarse; la pregunta es sobre cambiar la reunión de día.", false], ["B", "Sure. Is ten o'clock OK?", "Correcta: acepta el cambio de día («Sure») y propone una hora para la reunión del jueves.", true], ["C", "Yes, it was a long meeting.", "Habla de una reunión pasada; no responde a la propuesta de cambiar la fecha.", false]]}, {"id": "EN3-170", "niv": 2, "cp": "en_p3", "e": "\"The lights in the storeroom keep flickering.\"", "f": "Texto original elaborado para este simulacro, conversación 4", "vis": "", "o": [["A", "I'll ask the electrician to check them.", "Correcta: «keep flickering» (no dejan de parpadear) describe una falla; lo natural es proponer una solución: pedir al electricista que las revise.", true], ["B", "Yes, they're very bright, aren't they?", "Comenta que son muy brillantes; no reconoce el problema de que parpadean.", false], ["C", "No, I never keep anything in there.", "Toma «keep» en el sentido de guardar; la frase habla de luces que fallan, no de guardar cosas.", false]]}, {"id": "EN3-171", "niv": 2, "cp": "en_p3", "e": "\"I'm afraid I can't come in on Saturday. My son is ill.\"", "f": "Texto original elaborado para este simulacro, conversación 5", "vis": "", "o": [["A", "Great, see you on Saturday, then.", "Contradice el mensaje: la persona acaba de decir que no puede ir el sábado.", false], ["B", "Don't worry, I'll ask Laura to cover your shift.", "Correcta: la persona avisa que no puede trabajar porque su hijo está enfermo; lo natural es tranquilizarla y buscar quién cubra el turno.", true], ["C", "That's good news. I'm happy for him.", "Trata como buena noticia que el hijo esté enfermo; la reacción no corresponde.", false]]}, {"id": "EN3-172", "niv": 3, "cp": "en_p3", "e": "\"If I'd known the client was coming, I would have prepared the presentation.\"", "f": "Texto original elaborado para este simulacro, conversación 6", "vis": "", "o": [["A", "Yes, it was a great presentation.", "La frase indica que la presentación no se preparó; elogiarla no tiene sentido.", false], ["B", "Don't worry, the client didn't come.", "La frase da a entender que el cliente sí vino sin aviso; decir que no vino contradice la situación.", false], ["C", "Don't worry. Nobody told me either.", "Correcta: la frase (tercer condicional) expresa que no sabía que vendría el cliente; responder que a uno tampoco le avisaron es natural y gramatical («either» en frase negativa).", true]]}]}, {"comp": "ingles", "sim": "tyt-3", "ind": "Parte 4: las abejas y la agricultura", "tt": "", "texto": "Read the text and choose the correct word for each space.\n\nBEES AT WORK\n\nBees are very important (1) ___ farmers. When a bee visits a flower to collect nectar, it carries pollen from one plant (2) ___ another. This process, called pollination, helps plants produce fruit and seeds.\n\nIn some countries, farmers even pay beekeepers to (3) ___ their hives to the fields when the trees are in flower. Almonds, for example, depend almost completely (4) ___ insects such as bees. If bees (5) ___, many of the fruits and vegetables we eat every day would be much more expensive.", "vis": "", "items": [{"id": "EN3-173", "niv": 1, "cp": "en_p4", "e": "Gap (1)", "f": "Texto original elaborado para este simulacro, texto «Bees at work», espacio 1", "vis": "", "o": [["A", "for", "Correcta: «important for someone» significa importante para alguien: las abejas son importantes para los agricultores.", true], ["B", "with", "«important with farmers» no expresa a quién beneficia algo; la preposición que se usa es «for».", false], ["C", "of", "«important of» no es una combinación correcta en inglés para indicar a quién beneficia algo.", false]]}, {"id": "EN3-174", "niv": 1, "cp": "en_p4", "e": "Gap (2)", "f": "Texto original elaborado para este simulacro, texto «Bees at work», espacio 2", "vis": "", "o": [["A", "at", "«at» indica un punto fijo, no el destino de un movimiento que empieza con «from».", false], ["B", "for", "«from ... for» no forma la estructura de origen y destino; con «from» se usa «to».", false], ["C", "to", "Correcta: la estructura es «from one place to another» (de una planta a otra).", true]]}, {"id": "EN3-175", "niv": 2, "cp": "en_p4", "e": "Gap (3)", "f": "Texto original elaborado para este simulacro, texto «Bees at work», espacio 3", "vis": "", "o": [["A", "takes", "Después de «to» no se conjuga el verbo; la -s de tercera persona es un error aquí.", false], ["B", "take", "Correcta: después de «pay someone to» va el verbo en forma base: «pay beekeepers to take their hives to the fields» (pagan a los apicultores para que lleven sus colmenas a los campos).", true], ["C", "took", "Después de «to» no se usa el pasado; se necesita la forma base del verbo.", false]]}, {"id": "EN3-176", "niv": 2, "cp": "en_p4", "e": "Gap (4)", "f": "Texto original elaborado para este simulacro, texto «Bees at work», espacio 4", "vis": "", "o": [["A", "on", "Correcta: el verbo «depend» se construye con «on»: «depend on insects» (dependen de los insectos).", true], ["B", "from", "«depend from» es incorrecto; la preposición que exige «depend» es «on».", false], ["C", "of", "Es un error frecuente por influencia del español («depender de»), pero en inglés se dice «depend on».", false]]}, {"id": "EN3-177", "niv": 2, "cp": "en_p4", "e": "Gap (5)", "f": "Texto original elaborado para este simulacro, texto «Bees at work», espacio 5", "vis": "", "o": [["A", "disappear", "El presente después de «if» corresponde al primer condicional, que se combina con «will», no con «would be».", false], ["B", "will disappear", "Después de «if» en una condicional no se usa «will»; además la segunda parte usa «would».", false], ["C", "disappeared", "Correcta: es un segundo condicional (situación hipotética): «If + pasado simple, ... would + verbo»: «If bees disappeared, ... would be».", true]]}]}, {"comp": "ingles", "sim": "tyt-3", "ind": "Parte 4: buses eléctricos", "tt": "", "texto": "Read the text and choose the correct word for each space.\n\nELECTRIC BUSES\n\nMany cities are buying electric buses for their public transport systems. Electric buses (1) ___ much less noise than diesel buses, and they do not produce smoke in the streets. Their batteries are usually charged at night, (2) ___ electricity is cheaper.\n\nHowever, electric buses are more expensive to buy, so transport companies need to calculate (3) ___ much money they will save over the years. (4) ___ they cost more at first, they are often cheaper to maintain, because their motors have fewer moving parts. The batteries of some early models (5) ___ replaced after only a few years, but modern batteries last much longer.", "vis": "", "items": [{"id": "EN3-178", "niv": 1, "cp": "en_p4", "e": "Gap (1)", "f": "Texto original elaborado para este simulacro, texto «Electric buses», espacio 1", "vis": "", "o": [["A", "do", "En inglés no se dice «do noise»; con «noise» se usa «make».", false], ["B", "make", "Correcta: la colocación es «make noise» (hacer ruido); el sujeto plural «electric buses» va con «make».", true], ["C", "does", "«does» es tercera persona del singular y, además, «do noise» no es una colocación correcta.", false]]}, {"id": "EN3-179", "niv": 2, "cp": "en_p4", "e": "Gap (2)", "f": "Texto original elaborado para este simulacro, texto «Electric buses», espacio 2", "vis": "", "o": [["A", "where", "«where» se refiere a lugares, pero el antecedente «at night» es un momento.", false], ["B", "who", "«who» se refiere a personas; aquí el antecedente es un momento del día.", false], ["C", "when", "Correcta: «when» es el relativo para momentos: «at night, when electricity is cheaper» (en la noche, cuando la electricidad es más barata).", true]]}, {"id": "EN3-180", "niv": 2, "cp": "en_p4", "e": "Gap (3)", "f": "Texto original elaborado para este simulacro, texto «Electric buses», espacio 3", "vis": "", "o": [["A", "how", "Correcta: «how much money» (cuánto dinero) introduce la cantidad que deben calcular.", true], ["B", "so", "«so much money» significa «tanto dinero» y no puede ser objeto de «calculate» en esta estructura.", false], ["C", "what", "«what much money» es agramatical; para preguntar por cantidad se usa «how much».", false]]}, {"id": "EN3-181", "niv": 3, "cp": "en_p4", "e": "Gap (4)", "f": "Texto original elaborado para este simulacro, texto «Electric buses», espacio 4", "vis": "", "o": [["A", "Despite", "«Despite» tiene el mismo sentido, pero va seguido de un sustantivo o de un verbo en -ing, no de una oración con sujeto y verbo.", false], ["B", "Although", "Correcta: «Although» (aunque) va seguido de una oración con verbo («they cost more») y expresa el contraste: cuestan más, pero su mantenimiento es más barato.", true], ["C", "Because of", "«Because of» expresa causa y va seguido de un sustantivo; aquí se necesita contraste y hay una oración completa.", false]]}, {"id": "EN3-182", "niv": 3, "cp": "en_p4", "e": "Gap (5)", "f": "Texto original elaborado para este simulacro, texto «Electric buses», espacio 5", "vis": "", "o": [["A", "had to be", "Correcta: se habla del pasado (los primeros modelos) y en voz pasiva: «had to be replaced» (tuvieron que ser reemplazadas).", true], ["B", "have to", "«have to replaced» es agramatical (falta «be» para la pasiva) y está en presente, mientras el texto habla de modelos antiguos.", false], ["C", "must", "«must replaced» es agramatical: después de «must» va la forma base y aquí se necesitaría la pasiva («must be replaced»), que además no es pasado.", false]]}]}, {"comp": "ingles", "sim": "tyt-3", "ind": "Parte 5: biografía de una operadora de maquinaria", "tt": "", "texto": "Read the text and answer the questions.\n\nFROM ACCOUNTING TO CRANES\n\nWhen Diana Moreno told her family that she wanted to drive heavy machinery, her father laughed. He thought it was a joke. Diana was nineteen and had just finished a course in accounting, but she had never wanted to work in an office.\n\nShe found a training programme at a technical institute in her city. For six months she studied safety rules and basic mechanics in the mornings and practised with excavators and loaders in the afternoons. She was the only woman in a group of twenty-two students.\n\nHer first job was on a road construction project, where she worked night shifts for almost two years. \"The hours were hard, but I learned more there than in any classroom,\" she says. Today, Diana is thirty-four and operates one of the largest cranes at the port. She also trains new operators, and last year four of her eight students were women.\n\nHer father no longer laughs. He keeps a photo of her crane on the wall of his living room.\n\n(Diana Moreno is a fictional person.)", "vis": "", "items": [{"id": "EN3-183", "niv": 1, "cp": "en_p5", "e": "How did Diana's father react to her plans at first?", "f": "Texto original elaborado para este simulacro, párrafo 1", "vis": "", "o": [["A", "He got angry with her.", "El texto dice que se rio, no que se enojara.", false], ["B", "He offered to pay for her course.", "El texto no menciona que el padre pagara nada.", false], ["C", "He did not take her seriously.", "Correcta: «her father laughed. He thought it was a joke»; si creyó que era un chiste, no la tomó en serio.", true]]}, {"id": "EN3-184", "niv": 2, "cp": "en_p5", "e": "What had Diana studied before she trained to drive machines?", "f": "Texto original elaborado para este simulacro, párrafos 1 y 2", "vis": "", "o": [["A", "Mechanics and engines at a technical university.", "Estudió mecánica básica en el programa técnico, que fue después, y en un instituto técnico, no en una universidad.", false], ["B", "A course about keeping financial records.", "Correcta: había terminado «a course in accounting»; la contabilidad consiste en llevar registros financieros.", true], ["C", "Office work for several years.", "El texto dice que nunca había querido trabajar en una oficina; no menciona experiencia en oficinas.", false]]}, {"id": "EN3-185", "niv": 2, "cp": "en_p5", "e": "What does Diana say about her first job?", "f": "Texto original elaborado para este simulacro, párrafo 3", "vis": "", "o": [["A", "She left it after a few months because of the night shifts.", "Trabajó allí casi dos años; el texto no dice que renunciara por los turnos nocturnos.", false], ["B", "The working hours were difficult, but it taught her a lot.", "Correcta: «The hours were hard, but I learned more there than in any classroom».", true], ["C", "It was easier than her training at the institute.", "Ella compara lo que aprendió, no la dificultad: dice que aprendió más allí que en cualquier salón de clase.", false]]}, {"id": "EN3-186", "niv": 2, "cp": "en_p5", "e": "What is true about Diana today?", "f": "Texto original elaborado para este simulacro, párrafo 3", "vis": "", "o": [["A", "Her father works with her at the port.", "El padre solo aparece con una foto de la grúa en su sala; no trabaja con ella.", false], ["B", "She still works on road construction projects.", "Las vías fueron su primer empleo; hoy opera una grúa en el puerto.", false], ["C", "She teaches other people to operate machines.", "Correcta: «She also trains new operators» (también capacita a nuevos operadores).", true]]}]}, {"comp": "ingles", "sim": "tyt-3", "ind": "Parte 5: el trabajo en un estudio de subtitulación", "tt": "", "texto": "Read the text and answer the questions.\n\nWords at the bottom of the screen\n\nAt Letra Viva, a small subtitling studio in Bogotá, eight translators prepare Spanish subtitles for films, series and documentaries. Most viewers never think about their work, but every line they write has to follow strict rules. A subtitle can have a maximum of two lines, and it must stay on the screen long enough for an average viewer to read it. This means that translators often have to shorten what the characters say.\n\n\"Beginners try to translate every word,\" says Marta Jiménez, who has trained new staff at the studio for nine years. \"But viewers don't need every word. They need to understand what the person means and still have time to watch the picture.\"\n\nNew translators spend their first months working on documentaries. People in documentaries usually speak more slowly and clearly than actors in a comedy or a thriller, and there are fewer jokes that are impossible to translate. When a trainee finishes a file, an experienced colleague reviews it. The colleague never corrects the file directly; instead, he or she writes comments, and the trainee makes the changes. \"It takes longer,\" Marta admits, \"but it is the only way people really learn.\"\n\nThe busiest moments come when an episode of a series arrives late and has to be ready in less than a day. On those occasions, translators work in pairs: one translates while the other checks the timing and the spelling. For Marta, however, the best moments have nothing to do with deadlines. \"Sometimes I go to the cinema and hear the whole audience laugh at a line I wrote,\" she says. \"That's when I know the subtitle worked.\"\n\n(Letra Viva is a fictional company.)", "vis": "", "items": [{"id": "EN3-187", "niv": 2, "cp": "en_p5", "e": "Why do translators often have to shorten what the characters say?", "f": "Texto original elaborado para este simulacro, párrafo 1", "vis": "", "o": [["A", "Subtitles must be short enough to read in time.", "Correcta: un subtítulo tiene máximo dos líneas y debe permanecer en pantalla el tiempo suficiente para leerlo; por eso hay que acortar lo que dicen los personajes.", true], ["B", "Most viewers do not like long conversations.", "El texto no dice que al público le disgusten las conversaciones largas; habla de reglas de espacio y tiempo de lectura.", false], ["C", "The studio wants to finish its work faster.", "El texto no relaciona acortar los diálogos con terminar más rápido; la razón son las reglas del subtítulo.", false]]}, {"id": "EN3-188", "niv": 2, "cp": "en_p5", "e": "What is Marta's main advice about translating subtitles?", "f": "Texto original elaborado para este simulacro, párrafo 2", "vis": "", "o": [["A", "Focus on the meaning rather than on each word.", "Correcta: Marta dice que el público no necesita cada palabra sino entender «what the person means».", true], ["B", "Watch the whole film before writing anything.", "El texto no menciona este consejo; «watch the picture» se refiere al público, que necesita tiempo para mirar la imagen.", false], ["C", "Translate every word so that nothing is lost.", "Es justo lo que hacen los principiantes («Beginners try to translate every word»), y Marta lo critica.", false]]}, {"id": "EN3-189", "niv": 3, "cp": "en_p5", "e": "Why do new translators start with documentaries?", "f": "Texto original elaborado para este simulacro, párrafo 3", "vis": "", "o": [["A", "They contain more jokes for trainees to practise.", "Es lo contrario: el texto dice que en los documentales hay menos chistes («fewer jokes») difíciles de traducir.", false], ["B", "They are shorter than most films and series.", "El texto no compara la duración de los documentales con la de películas o series.", false], ["C", "The speech in them is usually easier to follow.", "Correcta: en los documentales la gente suele hablar más despacio y con más claridad, y hay menos chistes imposibles de traducir.", true]]}, {"id": "EN3-190", "niv": 3, "cp": "en_p5", "e": "How does an experienced colleague help a trainee?", "f": "Texto original elaborado para este simulacro, párrafo 3", "vis": "", "o": [["A", "By translating the most difficult parts of the file again.", "El texto no dice que el colega vuelva a traducir nada; solo revisa y deja comentarios.", false], ["B", "By leaving notes so that the trainee can fix the problems.", "Correcta: el colega nunca corrige el archivo directamente; escribe comentarios y es el aprendiz quien hace los cambios.", true], ["C", "By correcting the mistakes directly in the trainee's file.", "El texto dice expresamente que el colega «never corrects the file directly».", false]]}, {"id": "EN3-191", "niv": 3, "cp": "en_p5", "e": "What gives Marta the most satisfaction in her work?", "f": "Texto original elaborado para este simulacro, párrafo 4", "vis": "", "o": [["A", "Finishing a late episode before the deadline.", "Los episodios atrasados son los momentos de más trabajo; Marta dice que los mejores momentos «have nothing to do with deadlines».", false], ["B", "Training new translators for the studio.", "Marta forma personal nuevo, pero no dice que eso sea lo que más la satisface.", false], ["C", "Knowing that her work has helped people enjoy a film.", "Correcta: para Marta, «however», los mejores momentos no tienen que ver con plazos, sino con comprobar en el cine que el público disfruta y se ríe gracias a su subtítulo.", true]]}]}, {"comp": "ingles", "sim": "tyt-3", "ind": "Parte 6: correo sobre una aplicación de turnos", "tt": "", "texto": "Read the text and answer the questions.\n\nSubject: New scheduling app from 1 March\n\nHi everyone,\n\nAs many of you know, our current system for organising shifts has caused a few headaches recently. Two weeks ago, three people turned up for the same Saturday morning shift while the evening shift had nobody, and I know that some of you have waited days for an answer to a simple request to change a shift.\n\nFrom 1 March, we will be using an app called ShiftMate. You will be able to see your schedule on your phone, request changes and swap shifts directly with colleagues, as long as both of you have the same training. Your supervisor will still need to approve every change, but this should now take hours, not days.\n\nI'm aware that not everyone feels comfortable with new technology, so we will hold two short training sessions next week in the staff room. If you can't attend either of them, Marco in HR has kindly offered to help anyone individually.\n\nThe paper schedule will stay on the noticeboard for the whole of March while everyone gets used to the app. After that, it will be removed.\n\nThanks for your patience,\nLaura Vélez\nOperations Manager\n\n(ShiftMate and the people in this email are fictional.)", "vis": "", "items": [{"id": "EN3-192", "niv": 2, "cp": "en_p6", "e": "Why does Laura mention what happened two weeks ago?", "f": "Texto original elaborado para este simulacro, párrafo 1 del correo", "vis": "", "o": [["A", "To explain why the training sessions will be on Saturday.", "El correo no dice qué día serán las capacitaciones, solo que serán la próxima semana.", false], ["B", "To criticise the workers who arrived on Saturday morning.", "Laura no culpa a esos trabajadores; presenta el hecho como una falla del sistema de turnos.", false], ["C", "To announce a new rule about weekend shifts.", "El correo no anuncia reglas para los fines de semana; anuncia una aplicación para todos los turnos.", false], ["D", "To show why the company needs to change its system.", "Correcta: el error de los turnos (tres personas en la mañana y nadie en la tarde) es un ejemplo de los «headaches» del sistema actual y justifica la nueva aplicación.", true]]}, {"id": "EN3-193", "niv": 2, "cp": "en_p6", "e": "What can be understood about swapping shifts with ShiftMate?", "f": "Texto original elaborado para este simulacro, párrafo 2 del correo", "vis": "", "o": [["A", "Workers will have to ask Marco in HR to approve each swap.", "Marco solo ayudará con el uso de la aplicación a quien no pueda asistir a la capacitación; quien aprueba los cambios es el supervisor.", false], ["B", "A worker's training limits who they can swap with.", "Correcta: el cambio directo se permite «as long as both of you have the same training»; por tanto, no se podrá con alguien que tenga otra formación.", true], ["C", "Workers will only be able to swap weekend shifts.", "El correo no limita los cambios a fines de semana; el ejemplo del sábado solo ilustra el problema anterior.", false], ["D", "Supervisors will no longer be part of the process.", "El correo dice lo contrario: «Your supervisor will still need to approve every change».", false]]}, {"id": "EN3-194", "niv": 3, "cp": "en_p6", "e": "What is Laura's attitude towards staff who find new technology difficult?", "f": "Texto original elaborado para este simulacro, párrafos 3 y 4 del correo", "vis": "", "o": [["A", "She is understanding and offers them practical support.", "Correcta: reconoce que no todos se sienten cómodos («I'm aware that...») y ofrece dos capacitaciones, ayuda personal de Marco y el horario en papel durante marzo.", true], ["B", "She expects them to learn to use the app on their own.", "Contradice el correo: organiza capacitaciones y ayuda individual, así que no espera que aprendan solos.", false], ["C", "She thinks they should continue using the paper schedule.", "El horario en papel se mantiene solo durante marzo y luego se retira; no es una alternativa permanente.", false], ["D", "She is impatient because they are slowing the change down.", "No hay ninguna queja hacia esas personas; incluso agradece la paciencia de todos.", false]]}]}, {"comp": "ingles", "sim": "tyt-3", "ind": "Parte 6: emprendimiento de reacondicionamiento de celulares", "tt": "", "texto": "Read the text and answer the questions.\n\nSELLING CONFIDENCE, NOT PHONES\n\nFive years ago, Andrés and Paula Rincón were repairing phones at a small table in their garage. Today, their company, SegundaVida, refurbishes around three thousand devices a month and employs forty technicians. Their success, however, did not come from fixing phones faster than anyone else.\n\n\"At the beginning, we competed on price, like everyone else,\" Paula remembers. \"We were working fourteen hours a day and barely paying the bills.\" The turning point came when a customer returned a phone, not because it was broken, but because she did not trust it. \"She told us she had no idea who had owned it before or what had been done to it. That's when we realised we weren't really selling phones. We were selling confidence.\"\n\nSince then, every device SegundaVida sells comes with a report that lists each part that was replaced, the results of a battery test and a one-year guarantee, which is longer than many shops offer on new phones. The company also publishes on its website the percentage of devices that customers return each month. Last month, it was 1.8 per cent.\n\nAndrés admits that the reports cost money and slow down the work. \"Some competitors think we're crazy,\" he says. \"But our customers come back, and they bring their friends.\"\n\n(SegundaVida and the people in this text are fictional.)", "vis": "", "items": [{"id": "EN3-195", "niv": 2, "cp": "en_p6", "e": "What is suggested about the company's first years?", "f": "Texto original elaborado para este simulacro, párrafos 1 y 2", "vis": "", "o": [["A", "The owners repaired phones faster than they do now.", "El texto dice que el éxito no vino de reparar más rápido, pero no compara la velocidad de antes con la de ahora.", false], ["B", "The business already had many customers and employees.", "Al principio trabajaban en una mesa en su garaje; los cuarenta técnicos son de hoy.", false], ["C", "The owners charged higher prices than their competitors.", "Paula dice que competían en precio «like everyone else», lo que sugiere precios bajos, no más altos.", false], ["D", "The owners worked very hard but earned little.", "Correcta: trabajaban catorce horas al día y «barely paying the bills» (apenas les alcanzaba para pagar las cuentas).", true]]}, {"id": "EN3-196", "niv": 3, "cp": "en_p6", "e": "What did the Rincóns learn from the customer who returned a phone?", "f": "Texto original elaborado para este simulacro, párrafo 2", "vis": "", "o": [["A", "People who buy used phones want to know the phone's history.", "Correcta: la clienta devolvió el teléfono porque no sabía quién lo había tenido ni qué le habían hecho; entendieron que debían vender confianza, informando la historia del equipo.", true], ["B", "Many of the phones they sold were badly repaired.", "El teléfono devuelto no estaba dañado («not because it was broken»).", false], ["C", "Most customers care only about getting the lowest possible price for a phone.", "La lección fue la contraria: competir solo en precio no funcionaba y lo que faltaba era confianza.", false], ["D", "Customers prefer to buy new phones instead of used ones.", "El texto no dice que los clientes prefieran teléfonos nuevos; la empresa siguió creciendo vendiendo usados.", false]]}, {"id": "EN3-197", "niv": 3, "cp": "en_p6", "e": "Why does SegundaVida most likely publish its monthly return rate?", "f": "Texto original elaborado para este simulacro, párrafos 2 y 3", "vis": "", "o": [["A", "Because the law requires all phone repair shops to publish this figure.", "El texto no menciona ninguna ley; presenta la publicación como una decisión de la empresa.", false], ["B", "To show customers that it is open about the quality of its work.", "Correcta: encaja con la idea de «selling confidence»: mostrar públicamente cuántos equipos se devuelven es una forma de transparencia que genera confianza.", true], ["C", "To prove that its competitors' phones are worse.", "Publica solo sus propios datos; no compara con las cifras de la competencia.", false], ["D", "To attract more technicians to work for the company.", "El texto relaciona la estrategia con los clientes que regresan, no con la contratación de técnicos.", false]]}]}, {"comp": "ingles", "sim": "tyt-3", "ind": "Parte 7: mantenimiento de paneles solares", "tt": "", "texto": "Read the text and choose the best word for each space.\n\nLOOKING AFTER SOLAR PANELS\n\nSolar panels (1) ___ electricity from sunlight. They are quiet, they have no moving parts, and they have a long (2) ___: many of them work well for twenty-five years or more. However, that does not mean they need no care at all.\n\nThe biggest enemy of a solar panel is dirt. Dust, leaves and bird droppings can (3) ___ the sunlight and reduce the amount of electricity the panel produces. In dry, dusty areas, the loss can be (4) ___ high. Most installers recommend cleaning panels regularly with soft brushes and plain water. Strong chemicals and high-pressure hoses should be (5) ___, as they can damage the surface.\n\nTechnicians also check the cables and connections for signs of wear. A small problem that nobody notices can (6) ___ into an expensive repair.", "vis": "", "items": [{"id": "EN3-198", "niv": 1, "cp": "en_p7", "e": "Gap (1)", "f": "Texto original elaborado para este simulacro sobre paneles solares, espacio 1", "vis": "", "o": [["A", "take", "«take electricity from sunlight» no expresa generar energía; «take» significa tomar o llevar.", false], ["B", "put", "«put» significa poner o colocar; «put electricity from sunlight» no tiene sentido.", false], ["C", "produce", "Correcta: «produce electricity» (producir electricidad) es la colocación usual para lo que hace un panel solar.", true], ["D", "do", "«do electricity» no se usa en inglés; «do» no se combina con «electricity».", false]]}, {"id": "EN3-199", "niv": 2, "cp": "en_p7", "e": "Gap (2)", "f": "Texto original elaborado para este simulacro sobre paneles solares, espacio 2", "vis": "", "o": [["A", "life", "Correcta: «have a long life» significa tener una vida útil larga; lo confirma que funcionan veinticinco años o más.", true], ["B", "age", "«a long age» no es una expresión inglesa para hablar de durabilidad.", false], ["C", "time", "«they have a long time» significaría que les queda mucho tiempo disponible, no que duren mucho.", false], ["D", "period", "«a long period» necesita un complemento («a long period of time») y no expresa vida útil por sí solo.", false]]}, {"id": "EN3-200", "niv": 2, "cp": "en_p7", "e": "Gap (3)", "f": "Texto original elaborado para este simulacro sobre paneles solares, espacio 3", "vis": "", "o": [["A", "shut", "«shut» también significa cerrar y no se combina con «sunlight».", false], ["B", "lock", "«lock» significa cerrar con llave; no tiene sentido con la luz.", false], ["C", "block", "Correcta: «block the sunlight» significa tapar o bloquear la luz del sol, que es lo que hacen el polvo y las hojas.", true], ["D", "close", "«close» significa cerrar (una puerta, una tienda); no se cierra la luz del sol.", false]]}, {"id": "EN3-201", "niv": 2, "cp": "en_p7", "e": "Gap (4)", "f": "Texto original elaborado para este simulacro sobre paneles solares, espacio 4", "vis": "", "o": [["A", "strongly", "«strongly» se usa con verbos u opiniones («strongly recommend»); «strongly high» no es natural.", false], ["B", "deeply", "«deeply» se usa con sentimientos («deeply worried»); no se combina con «high».", false], ["C", "heavily", "«heavily» se combina con verbos como «rain» o «depend»; «heavily high» es incorrecto.", false], ["D", "surprisingly", "Correcta: «surprisingly high» (sorprendentemente alta) es una combinación natural de adverbio + adjetivo para una cantidad.", true]]}, {"id": "EN3-202", "niv": 2, "cp": "en_p7", "e": "Gap (5)", "f": "Texto original elaborado para este simulacro sobre paneles solares, espacio 5", "vis": "", "o": [["A", "missed", "«miss» significa perder (un bus) o extrañar; no expresa evitar el uso de algo.", false], ["B", "avoided", "Correcta: «should be avoided» (deben evitarse) indica que no se deben usar químicos fuertes ni mangueras a presión.", true], ["C", "escaped", "«escape» significa escapar de un lugar o peligro; «chemicals should be escaped» no tiene sentido.", false], ["D", "prevented", "«prevent» significa impedir que algo ocurra; no se «impiden» los químicos, se evita usarlos.", false]]}, {"id": "EN3-203", "niv": 3, "cp": "en_p7", "e": "Gap (6)", "f": "Texto original elaborado para este simulacro sobre paneles solares, espacio 6", "vis": "", "o": [["A", "make", "«make into» necesita un objeto («make something into something») y el sujeto aquí no transforma nada.", false], ["B", "get", "«get into» significa entrar o meterse en algo, no convertirse en algo.", false], ["C", "turn", "Correcta: «turn into» significa convertirse en: un problema pequeño puede convertirse en una reparación costosa.", true], ["D", "become", "«become» tiene un significado parecido, pero no lleva «into»: se diría «become an expensive repair».", false]]}]}, {"comp": "ingles", "sim": "tyt-3", "ind": "Parte 7: entrenamiento de perros guía", "tt": "", "texto": "Read the text and choose the best word for each space.\n\nHOW A GUIDE DOG IS TRAINED\n\nGuide dogs help people who are blind or cannot see well to (1) ___ around safely. Training a guide dog is a long process. Puppies spend their first year with volunteer families, who teach them basic (2) ___ such as \"sit\" and \"wait\". (3) ___ a dog is about fourteen months old, it begins formal training with a professional instructor.\n\nThe hardest skill to learn is called \"intelligent disobedience\": the dog must (4) ___ to obey an order if following it would put its owner in danger, for example, when a car is coming. Not every dog is (5) ___ for this demanding job. Dogs that do not pass the final tests are not simply sent away. Many of them find a new (6) ___ as therapy dogs in hospitals or schools, and others are (7) ___ by families who have been waiting to give them a home.", "vis": "", "items": [{"id": "EN3-204", "niv": 1, "cp": "en_p7", "e": "Gap (1)", "f": "Texto original elaborado para este simulacro sobre perros guía, espacio 1", "vis": "", "o": [["A", "bring", "«bring around» necesita objeto y significa traer algo o convencer a alguien; no es desplazarse.", false], ["B", "put", "«put around» no expresa desplazarse; no tiene sentido en esta oración.", false], ["C", "take", "«take around» necesita un objeto («take someone around») y significa llevar a alguien de paseo.", false], ["D", "get", "Correcta: «get around» es un phrasal verb que significa desplazarse o moverse de un lugar a otro.", true]]}, {"id": "EN3-205", "niv": 2, "cp": "en_p7", "e": "Gap (2)", "f": "Texto original elaborado para este simulacro sobre perros guía, espacio 2", "vis": "", "o": [["A", "news", "«news» significa noticias; «sit» y «wait» no son noticias.", false], ["B", "commands", "Correcta: «sit» y «wait» son órdenes (commands) básicas que se enseñan a los perros.", true], ["C", "advice", "«advice» (consejo) es incontable y no puede ir en plural; además «sit» y «wait» son órdenes, no consejos.", false], ["D", "homework", "«homework» son las tareas escolares; no describe órdenes para un perro.", false]]}, {"id": "EN3-206", "niv": 2, "cp": "en_p7", "e": "Gap (3)", "f": "Texto original elaborado para este simulacro sobre perros guía, espacio 3", "vis": "", "o": [["A", "Once", "Correcta: «Once» significa «una vez que» o «cuando»: cuando el perro cumple unos catorce meses, empieza el entrenamiento formal.", true], ["B", "Until", "«Until» (hasta que) haría decir que empieza el entrenamiento hasta cumplir catorce meses, lo que contradice que antes vive con familias voluntarias.", false], ["C", "Despite", "«Despite» va seguido de un sustantivo, no de una oración, y expresa contraste, no un momento.", false], ["D", "Unless", "«Unless» (a menos que) introduce una condición negativa que no tiene sentido aquí.", false]]}, {"id": "EN3-207", "niv": 3, "cp": "en_p7", "e": "Gap (4)", "f": "Texto original elaborado para este simulacro sobre perros guía, espacio 4", "vis": "", "o": [["A", "deny", "«deny» significa negar un hecho y no se construye con «to + verbo»; «deny to obey» es incorrecto.", false], ["B", "avoid", "«avoid» se construye con -ing («avoid obeying»), no con «to + verbo».", false], ["C", "refuse", "Correcta: «refuse to + verbo» significa negarse a hacer algo: el perro debe negarse a obedecer si la orden pone en peligro a su dueño.", true], ["D", "reject", "«reject» lleva un objeto directo («reject an idea»); «reject to obey» es agramatical.", false]]}, {"id": "EN3-208", "niv": 3, "cp": "en_p7", "e": "Gap (5)", "f": "Texto original elaborado para este simulacro sobre perros guía, espacio 5", "vis": "", "o": [["A", "skilful", "«skilful» se construye con «at» o «in» («skilful at»), no con «for»; además describe destreza, no aptitud general.", false], ["B", "suitable", "Correcta: «suitable for» significa adecuado o apto para algo: no todos los perros son aptos para este trabajo.", true], ["C", "capable", "«capable» se construye con «of» («capable of doing»), no con «for».", false], ["D", "able", "«able» se construye con «to + verbo» («able to do»), no con «for this job».", false]]}, {"id": "EN3-209", "niv": 3, "cp": "en_p7", "e": "Gap (6)", "f": "Texto original elaborado para este simulacro sobre perros guía, espacio 6", "vis": "", "o": [["A", "play", "«play» es el verbo de «play a role»; como sustantivo significa obra de teatro y no encaja aquí.", false], ["B", "scene", "«scene» significa escena; «find a new scene as therapy dogs» no tiene sentido.", false], ["C", "paper", "«paper» significa papel como material o documento; el «papel» de alguien en inglés es «role».", false], ["D", "role", "Correcta: «find a new role as» significa encontrar un nuevo papel o función: trabajar como perros de terapia.", true]]}, {"id": "EN3-210", "niv": 3, "cp": "en_p7", "e": "Gap (7)", "f": "Texto original elaborado para este simulacro sobre perros guía, espacio 7", "vis": "", "o": [["A", "adopted", "Correcta: «adopt» significa adoptar: los perros son adoptados por familias que quieren darles un hogar.", true], ["B", "adjusted", "«adjust» significa ajustar algo; no se usa para recibir un animal en casa.", false], ["C", "adapted", "«adapt» significa adaptar; es un error frecuente por su parecido con «adopt», pero cambia el sentido.", false], ["D", "admitted", "«admit» significa admitir o dejar entrar a un lugar; no se usa para dar un hogar a un animal.", false]]}]}];
const CFG = {"titulo": "Simulacro 3 · Saber TyT", "modo": "simulacro", "minutos": 280, "componentes": {"lectura_critica": "Lectura Crítica", "razonamiento_cuantitativo": "Razonamiento Cuantitativo", "competencias_ciudadanas": "Competencias Ciudadanas", "comunicacion_escrita": "Comunicación Escrita", "ingles": "Inglés"}, "competencias": {"lc_local": "Identifica y entiende los contenidos locales", "lc_global": "Comprende cómo se articulan las partes del texto", "lc_reflexion": "Reflexiona a partir del texto y evalúa su contenido", "rc_interpretacion": "Interpretación y representación", "rc_formulacion": "Formulación y ejecución", "rc_argumentacion": "Argumentación", "cc_conocimientos": "Conocimientos", "cc_argumentacion": "Argumentación", "cc_multiperspectivismo": "Multiperspectivismo", "cc_sistemico": "Pensamiento sistémico", "ce_planteamiento": "Planteamiento", "ce_organizacion": "Organización del texto", "ce_expresion": "Forma de expresión", "en_p1": "Parte 1 · Vocabulario (definiciones)", "en_p2": "Parte 2 · Avisos", "en_p3": "Parte 3 · Conversaciones", "en_p4": "Parte 4 · Texto con espacios (gramática)", "en_p5": "Parte 5 · Comprensión literal", "en_p6": "Parte 6 · Comprensión inferencial", "en_p7": "Parte 7 · Texto con espacios (vocabulario y gramática)"}, "niveles": {"1": "Básico", "2": "Intermedio", "3": "Avanzado"}, "instr": {"en_p1": "Parte 1. Relaciona cada descripción con la palabra correcta de la lista (A–H). Hay más palabras de las necesarias.", "en_p2": "Parte 2. ¿Dónde puedes ver cada aviso? Elige el lugar correcto (A, B o C).", "en_p3": "Parte 3. Completa cada conversación con la respuesta más adecuada (A, B o C).", "en_p4": "Parte 4. Lee el texto y elige la palabra correcta para cada espacio (A, B o C).", "en_p5": "Parte 5. Lee el texto y responde según la información que contiene (A, B o C).", "en_p6": "Parte 6. Lee el texto y responde las preguntas (A, B, C o D).", "en_p7": "Parte 7. Lee el texto y elige la palabra correcta para cada espacio (A, B, C o D)."}, "rubrica": [["Planteamiento", ["Respondo la pregunta y tomo una posición clara (de acuerdo, en desacuerdo o parcialmente) desde el primer párrafo.", "Doy al menos dos razones desarrolladas, con ejemplos o datos, y no me limito a repetir el contexto.", "Considero una postura contraria y explico por qué la mía es más sólida."]], ["Organización", ["Mi texto tiene introducción con tesis, desarrollo con un argumento por párrafo y conclusión.", "Uso conectores variados y precisos (además, sin embargo, por lo tanto, en consecuencia, por ejemplo).", "No hay ideas repetidas ni información que no aporte a mi tesis."]], ["Forma de expresión", ["Uso un registro formal y un vocabulario preciso, sin muletillas ni expresiones coloquiales.", "Reviso ortografía, tildes, puntuación y concordancia.", "Mi texto cabe en máximo dos páginas (unas 300 a 500 palabras)."]]], "ensayos": [{"id": "CE-E06", "sim": "tyt-3", "tema": "Vigilancia de los trabajadores con tecnología", "contexto": "Algunas empresas instalan programas que registran la actividad de los empleados en sus computadores, como las páginas que visitan o el tiempo que pasan sin usar el teclado, y sistemas de localización en los vehículos y celulares de trabajo. Los empleadores argumentan que estas herramientas protegen la información de la compañía, mejoran la seguridad de los conductores y permiten medir el rendimiento. Muchos trabajadores, en cambio, sienten que la vigilancia constante genera desconfianza y estrés, y temen que se registren datos de su vida privada, por ejemplo, si el celular de trabajo sigue enviando su ubicación después de la jornada.", "pregunta": "¿Está de acuerdo con que las empresas vigilen de manera permanente la actividad de sus trabajadores mediante programas de monitoreo y sistemas de localización? Escriba un texto argumentativo en el que exponga y justifique su posición.", "ideas": ["¿Qué mide realmente un programa de monitoreo? ¿Actividad o resultados?", "Efecto de la vigilancia constante sobre la confianza y la motivación.", "Datos de la vida privada que pueden quedar registrados.", "Necesidades legítimas de seguridad: transporte de carga, datos de clientes.", "Controles limitados, conocidos y proporcionales."], "modelo": "Los empleadores que instalan programas de monitoreo no lo hacen, en general, por maldad. Una transportadora necesita saber dónde están sus vehículos para proteger a sus conductores y la carga, y una entidad financiera está obligada a cuidar los datos de sus clientes. Esas razones son legítimas, y conviene empezar por reconocerlo. Sin embargo, ninguna de ellas exige vigilar todo, todo el tiempo. Por eso, estoy en desacuerdo con que las empresas vigilen de manera permanente la actividad de sus trabajadores: considero que el control debe ser limitado, conocido por los empleados y proporcional a un riesgo concreto.\n\nLas necesidades de seguridad se atienden con controles específicos, no con una vigilancia total: localización activa solo durante los recorridos, registros de acceso a los archivos confidenciales y políticas escritas que los trabajadores conozcan y acepten desde el principio. La diferencia entre proteger la empresa y espiar a las personas está en esos límites. Cuando una empresa los sobrepasa, la vigilancia produce tres daños.\n\nEl primero es que mide lo que es fácil de medir, no lo que realmente importa. Un programa puede registrar cuántos minutos pasa un técnico frente a la pantalla o cuántas teclas oprime, pero no sabe si ese tiempo se dedicó a resolver un problema difícil o a fingir actividad. Cuando los trabajadores saben que se evalúa el movimiento del ratón, aprenden a producir movimiento, no resultados.\n\nEl segundo es el deterioro de la confianza, que es la base de cualquier equipo de trabajo. Un empleado que se siente observado todo el tiempo vive con estrés, deja de proponer ideas por temor a equivocarse y percibe que su jefe lo considera un sospechoso. Ninguna empresa contrataría a un supervisor para que se sentara detrás de cada empleado a anotar cuántas veces levanta la vista del escritorio; un programa que hace lo mismo de forma invisible no resulta menos ofensivo.\n\nEl tercero es la invasión de la vida privada. Si un celular corporativo envía la ubicación del trabajador a cualquier hora, la empresa termina sabiendo dónde vive, a qué consultorio médico acude o con quién se reúne los fines de semana, información que no le corresponde conocer.\n\nEn conclusión, una empresa puede y debe cuidar su información y a su personal, pero no a costa de convertir el lugar de trabajo en un espacio de sospecha permanente. Los controles proporcionados y transparentes cumplen ese propósito; la vigilancia constante, en cambio, sacrifica la confianza y la privacidad a cambio de datos que dicen muy poco sobre el verdadero desempeño.", "comentario_modelo": "Planteamiento: la tesis es clara (en desacuerdo con la vigilancia permanente) y se acompaña de un criterio propio: el control debe ser limitado, conocido y proporcional. Desarrolla una idea que el contexto no plantea: los programas miden actividad, no resultados. Organización: el texto invierte el orden habitual y empieza por la concesión y la refutación: reconoce las razones de los empleadores («Esas razones son legítimas») y las responde («Sin embargo, ninguna de ellas exige vigilar todo») antes de enunciar la tesis. Después propone una alternativa y anuncia «tres daños», que desarrolla en párrafos encabezados por «El primero», «El segundo» y «El tercero». Forma de expresión: la comparación con un supervisor sentado detrás del empleado hace visible el problema; el léxico es preciso (proporcional, transparente) y los ejemplos son propios del mundo laboral técnico.", "debil": "Hoy en día la tecnología está en todas partes y avanza cada vez más. Algunas empresas instalan programas que registran la actividad de los empleados en sus computadores y sistemas de localización. Esto tiene ventajas, como proteger la información, y desventajas, como el estrés. Los jefes siempre quieren controlarlo todo y nunca confían en nadie. Además, los computadores de las empresas a veces son muy lentos y se dañan. En mi opinión la tecnología debe usarse para el bien de la humanidad y no para hacer daño, como pasa con las redes sociales que causan adicción. Hay que usarla con responsabilidad. Cada persona tiene sus razones y hay que respetarlas.", "comentario_debil": "La frase «En mi opinión» no introduce una respuesta a la pregunta, sino una idea general sobre la tecnología; el texto nunca dice si acepta o rechaza la vigilancia permanente. Resume el contexto («tiene ventajas… y desventajas…») sin elaborarlo, generaliza («los jefes siempre quieren controlarlo todo y nunca confían en nadie») y se desvía hacia las redes sociales y la calidad de los equipos. Las oraciones no se conectan entre sí y el cierre es un lugar común. Falta la coma después de «En mi opinión». Para mejorarlo: responder la pregunta en la primera oración, distinguir entre controles razonables y vigilancia total, y apoyar cada razón con un ejemplo de un trabajo concreto."}], "clave": "saber-tyt-03.html"};
const $ = s => document.querySelector(s);

function justHTML(it){
  const many = it.o.length > 4;
  return '<div class="just">' + it.o.filter(o => !many || o[3] || ST.r[it.id] === o[0]).map(o => `<div><b>${o[0]}.</b> <span class="${o[3]?'okt':'not'}">${o[3]?'Es correcta.':'Es incorrecta.'}</span> ${esc(o[2])}</div>`).join('') +
    `<div class="src">${esc(CFG.competencias[it.cp])} · Referencia: ${esc(it.f)}</div></div>`;
}
function itemHTML(it, n, mode){
  const r = ST.r[it.id];
  const reveal = mode === 'review' || (CFG.modo === 'practica' && r);
  let h = `<div class="item" id="i-${it.id}"><p class="enun"><span class="n">${n}.</span> <span class="niv">${CFG.niveles[it.niv]}</span> ${esc(it.e)}</p>${it.vis||''}<div class="${it.o.length>4?'ops8':''}">`;
  it.o.forEach(o => {
    let cls = '';
    if (reveal) { if (o[3]) cls = 'ok'; else if (r === o[0]) cls = 'no'; }
    else if (r === o[0]) cls = 'sel';
    h += `<button class="op ${cls}" data-id="${it.id}" data-l="${o[0]}" ${reveal?'disabled':''}><span class="l">${o[0]}.</span><span>${esc(o[1])}</span></button>`;
  });
  h += '</div>';
  if (reveal) {
    if (mode === 'review') h += `<div class="${r===keyOf(it)?'res-ok':'res-no'}" style="font-size:14px;margin-top:4px">${r ? (r===keyOf(it)?'Respondiste ' + r + ': correcto.':'Respondiste ' + r + '. La respuesta correcta es ' + keyOf(it) + '.') : 'Sin responder. La respuesta correcta es ' + keyOf(it) + '.'}</div>`;
    h += justHTML(it);
  }
  return h + '</div>';
}
function renderList(list, mode){
  let h = '', last = null, comp = null, parte = null, n = 0;
  const showMods = CFG.modo !== 'practica' || mode === 'review';
  list.forEach((it, idx) => {
    n++;
    if (it.caso !== last) {
      last = it.caso;
      if (it.caso.comp !== comp) { comp = it.caso.comp; parte = null; if (showMods) h += `<div class="mod" id="m-${comp}">${esc(CFG.componentes[comp])}</div>`; }
      if (comp === 'ingles' && it.cp !== parte) { parte = it.cp; h += `<div class="inst">${esc(CFG.instr[parte])}</div>`; }
      const k = last.items.filter(x => list.includes(x)).length;
      if (k > 1) h += `<div class="inst">Responda las preguntas ${n} a ${n + k - 1} de acuerdo con la siguiente información</div>`;
      let tag = CFG.modo === 'practica' ? CFG.componentes[comp] + (last.tt ? ' · ' + last.tt : '') + (last.ind ? ' · ' + last.ind : '') : (last.tt || '');
      h += `<div class="caso">${tag ? `<div class="tag">${esc(tag)}</div>` : ''}<p>${esc(last.texto)}</p>${last.vis||''}</div>`;
    }
    h += itemHTML(it, n, mode);
  });
  return h;
}

let LIST = [];
let FILTRO = Object.assign({comp:'', cp:'', niv:'', ex:''}, ST.f || {});
function practica(){
  const comps = Object.entries(CFG.componentes).filter(([k]) => ITEMS.some(i => i.caso.comp === k)).map(([k,v]) => `<option value="${k}" ${FILTRO.comp===k?'selected':''}>${esc(v)}</option>`).join('');
  const cps = Object.entries(CFG.competencias).filter(([k]) => ITEMS.some(i => i.cp === k && (!FILTRO.comp || i.caso.comp === FILTRO.comp))).map(([k,v]) => `<option value="${k}" ${FILTRO.cp===k?'selected':''}>${esc(v)}</option>`).join('');
  if (FILTRO.cp && !ITEMS.some(i => i.cp === FILTRO.cp && (!FILTRO.comp || i.caso.comp === FILTRO.comp))) FILTRO.cp = '';
  const nivs = Object.entries(CFG.niveles).map(([k,v]) => `<option value="${k}" ${FILTRO.niv===k?'selected':''}>${esc(v)}</option>`).join('');
  const list = ITEMS.filter(it => (!FILTRO.comp || it.caso.comp===FILTRO.comp) && (!FILTRO.cp || it.cp===FILTRO.cp) && (!FILTRO.niv || String(it.niv)===FILTRO.niv) && (!FILTRO.ex || it.caso.sim.startsWith(FILTRO.ex)));
  const resp = list.filter(it => ST.r[it.id]); const ok = resp.filter(it => ST.r[it.id]===keyOf(it));
  $('#main').innerHTML = `<div class="panel"><p style="margin-top:0">Elige módulo, competencia y dificultad. Al responder verás de inmediato si acertaste y la explicación. Las preguntas de los simulacros también están aquí: si quieres presentarlos «en limpio», hazlos antes de practicar.</p>
  <div class="row"><select id="fc"><option value="">Todos los módulos</option>${comps}</select>
  <select id="fp"><option value="">Todas las competencias</option>${cps}</select>
  <select id="fn"><option value="">Todas las dificultades</option>${nivs}</select>
  <select id="fe"><option value="">Saber Pro y TyT</option><option value="pro" ${FILTRO.ex==='pro'?'selected':''}>Preguntas de los simulacros Saber Pro</option><option value="tyt" ${FILTRO.ex==='tyt'?'selected':''}>Preguntas de los simulacros Saber TyT</option><option value="practica" ${FILTRO.ex==='practica'?'selected':''}>Solo banco extra de práctica</option></select>
  <button class="btn sec" id="borrar">Borrar mis respuestas</button></div>
  <p class="stat" id="pst" style="margin-bottom:0">${list.length} preguntas · respondidas ${resp.length} · aciertos ${ok.length}${resp.length? ' (' + Math.round(100*ok.length/resp.length) + ' %)':''}</p></div>` + renderList(list, 'practica');
  $('#prog').textContent = `${ok.length}/${resp.length} aciertos`;
  [['fc','comp'],['fp','cp'],['fn','niv'],['fe','ex']].forEach(([id,k]) => $('#'+id).onchange = e => { FILTRO[k] = e.target.value; if (k==='comp') FILTRO.cp=''; ST.f = FILTRO; save(); practica(); });
  LIST = list;
  $('#borrar').onclick = () => { list.forEach(it => delete ST.r[it.id]); save(); practica(); };
}

// ---------- ENSAYO ----------
function rubricaHTML(id){
  return '<div class="chk">' + CFG.rubrica.map(([asp, xs], a) => `<p style="margin:10px 0 2px"><b>${esc(asp)}</b></p>` + xs.map((x, i) => { const k = id + ':' + a + ':' + i;
    return `<label><input type="checkbox" data-chk="${k}" ${ST.chk[k]?'checked':''}><span>${esc(x)}</span></label>`; }).join('')).join('') + '</div>';
}
function ensayoHTML(e, mostrar){
  const txt = ST.ens[e.id] || '';
  let h = `<div class="panel" id="ens-${e.id}"><div class="tag">Comunicación Escrita · ${esc(e.tema)}</div><p style="white-space:pre-line">${esc(e.contexto)}</p><p><b>${esc(e.pregunta)}</b></p>
  <p class="aviso">Escribe un texto argumentativo de máximo dos páginas (unas 300 a 500 palabras). Tiempo sugerido: 30 a 40 minutos. Tu texto se guarda en este navegador.</p>
  <textarea data-ens="${e.id}" placeholder="Escribe aquí tu texto…" ${mostrar && CFG.modo==='simulacro' ? 'readonly' : ''}>${esc(txt)}</textarea>
  <p class="stat" id="pc-${e.id}">${palabras(txt)} palabras</p>`;
  if (mostrar) {
    h += `<h3 style="color:var(--pri)">Autoevalúa tu texto</h3><p class="aviso">El examen real lo califican evaluadores con estos tres aspectos. Marca lo que tu texto cumple; lo que quede sin marcar es lo que debes mejorar.</p>${rubricaHTML(e.id)}
    <p class="stat" id="pr-${e.id}"></p>
    <h3 style="color:var(--pri)">Texto modelo (nivel alto)</h3><div class="modelo">${esc(e.modelo)}</div><p class="src">${esc(e.comentario_modelo)}</p>
    <h3 style="color:var(--pri)">Respuesta débil y cómo mejorarla</h3><div class="modelo">${esc(e.debil)}</div><p class="src">${esc(e.comentario_debil)}</p>`;
  } else if (CFG.modo === 'escritura') {
    h += `<button class="btn" data-ver="${e.id}">Ver rúbrica y texto modelo</button>`;
  }
  return h + '</div>';
}
function puntajeRubrica(id){
  let n = 0, t = 0; CFG.rubrica.forEach(([a, xs], ai) => xs.forEach((x, i) => { t++; if (ST.chk[id+':'+ai+':'+i]) n++; }));
  const el = $('#pr-' + id); if (el) el.textContent = `Cumples ${n} de ${t} criterios.`;
}
let VER = ST.ver || {};
function escritura(){
  const sel = ST.sel || CFG.ensayos[0].id;
  const e = CFG.ensayos.find(x => x.id === sel) || CFG.ensayos[0];
  $('#main').innerHTML = `<div class="panel"><p style="margin-top:0">Elige una consigna, escribe tu texto y luego compáralo con la rúbrica y con el texto modelo. Las consignas de los seis simulacros también están aquí.</p>
  <select id="fs">${CFG.ensayos.map((x, i) => `<option value="${x.id}" ${x.id===e.id?'selected':''}>${i+1}. ${esc(x.tema)}</option>`).join('')}</select></div>` + ensayoHTML(e, !!VER[e.id]);
  $('#prog').textContent = `${CFG.ensayos.length} consignas`;
  $('#fs').onchange = ev => { ST.sel = ev.target.value; save(); escritura(); };
  puntajeRubrica(e.id);
}

// ---------- SIMULACRO ----------
let tick = null;
const ENS = CFG.ensayos[0];
function inicio(){
  const n = ITEMS.length, cnt = {};
  ITEMS.forEach(it => cnt[it.caso.comp] = (cnt[it.caso.comp]||0) + 1);
  const h = Math.floor(CFG.minutos/60), m = CFG.minutos%60;
  $('#main').innerHTML = `<div class="panel"><h2 style="margin-top:0">Instrucciones</h2>
  <p>Este simulacro reproduce la estructura de la primera sesión del examen (módulos genéricos): <b>${n} preguntas</b> de selección múltiple con única respuesta${ENS ? ' y <b>un texto argumentativo</b>' : ''}.</p>
  <table>${Object.entries(cnt).map(([k,v]) => `<tr><td>${esc(CFG.componentes[k])}</td><td class="r">${v} preguntas</td></tr>`).join('')}${ENS ? `<tr><td>Comunicación Escrita</td><td class="r">1 texto</td></tr>` : ''}</table>
  <p>Tiempo: <b>${h} h ${m ? m + ' min' : ''}</b>, como en el examen real. Distribúyelo: unos 50 minutos por módulo de 35 preguntas, 60 para Inglés y 35 para el texto. Cuando se acaba el tiempo puedes seguir, pero el cronómetro lo indica.</p>
  <p>Tus respuestas se guardan en este navegador: puedes cerrar y continuar después. Al terminar verás tu porcentaje por módulo, por competencia y por dificultad, la explicación de cada pregunta y una autoevaluación de tu texto con un modelo comentado.</p>
  <button class="btn" id="go">${ST.t0 ? 'Continuar el simulacro' : 'Comenzar'}</button></div>`;
  $('#prog').textContent = `${n} preguntas`;
  $('#go').onclick = () => { if (!ST.t0) { ST.t0 = Date.now(); save(); } examen(); };
}
function reloj(){
  const rest = CFG.minutos*60 - Math.floor((Date.now() - ST.t0)/1000);
  const a = Math.abs(rest), hh = Math.floor(a/3600), mm = Math.floor(a%3600/60), ss = a%60;
  const t = (rest < 0 ? '+' : '') + (hh ? hh + ':' : '') + String(mm).padStart(2,'0') + ':' + String(ss).padStart(2,'0');
  $('#timer').textContent = rest < 0 ? 'Tiempo cumplido ' + t : '⏱ ' + t;
  $('#timer').classList.toggle('low', rest < 600);
}
function navHTML(){
  const comps = [...new Set(ITEMS.map(i => i.caso.comp))];
  return '<div class="nav">' + comps.map(c => `<a href="#m-${c}">${esc(CFG.componentes[c])}</a>`).join('') + (ENS ? '<a href="#m-escrita">Comunicación Escrita</a>' : '') + '</div>';
}
function examen(){
  $('#main').innerHTML = navHTML() + renderList(ITEMS, 'examen') + (ENS ? `<div class="mod" id="m-escrita">Comunicación Escrita</div>` + ensayoHTML(ENS, false) : '') + `<div class="panel"><button class="btn" id="fin">Terminar y calificar</button></div>`;
  progreso(); reloj(); clearInterval(tick); tick = setInterval(reloj, 1000);
  $('#fin').onclick = () => {
    const faltan = ITEMS.length - ITEMS.filter(i => ST.r[i.id]).length;
    const sinTexto = ENS && palabras(ST.ens[ENS.id] || '') < 50;
    $('#mtxt').textContent = (faltan ? `Te faltan ${faltan} preguntas por responder. ` : '') + (sinTexto ? 'Aún no has escrito el texto argumentativo. ' : '') + (faltan || sinTexto ? '¿Quieres calificar de todos modos?' : '¿Quieres terminar y ver tu calificación?');
    $('#modal').classList.remove('hide');
  };
}
function progreso(){
  const r = ITEMS.filter(it => ST.r[it.id]).length;
  $('#prog').textContent = `Respondidas ${r}/${ITEMS.length}`;
}
$('#mno').onclick = () => $('#modal').classList.add('hide');
$('#msi').onclick = () => { $('#modal').classList.add('hide'); ST.fin = Date.now(); save(); resultados(); window.scrollTo(0,0); };
function resultados(){
  clearInterval(tick);
  const ok = ITEMS.filter(it => ST.r[it.id] === keyOf(it)).length;
  const pct = Math.round(1000*ok/ITEMS.length)/10;
  const agrupa = fn => { const m = {}; ITEMS.forEach(it => { const k = fn(it); m[k] = m[k] || [0,0]; m[k][1]++; if (ST.r[it.id]===keyOf(it)) m[k][0]++; }); return m; };
  const fila = (lab, v, cls) => `<tr class="${cls||''}"><td>${esc(lab)}</td><td class="r">${v[0]}/${v[1]}</td><td class="r">${Math.round(100*v[0]/v[1])} %</td></tr>`;
  const porMod = agrupa(it => it.caso.comp), porCp = agrupa(it => it.cp), porNiv = agrupa(it => it.niv);
  let tabla = '';
  Object.entries(porMod).forEach(([m, v]) => { tabla += fila(CFG.componentes[m], v);
    Object.entries(porCp).filter(([k]) => ITEMS.some(i => i.cp === k && i.caso.comp === m)).forEach(([k, w]) => tabla += fila(CFG.competencias[k], w, 'sub')); });
  const mins = Math.round(((ST.fin||Date.now()) - ST.t0)/60000);
  $('#timer').textContent = `Tiempo usado: ${Math.floor(mins/60) ? Math.floor(mins/60) + ' h ' : ''}${mins%60} min`;
  $('#prog').textContent = `${ok}/${ITEMS.length} aciertos`;
  const peor = Object.entries(porMod).sort((a,b) => a[1][0]/a[1][1] - b[1][0]/b[1][1])[0];
  $('#main').innerHTML = `<div class="panel"><div class="big">${String(pct).replace('.',',')} %</div>
  <p style="margin-top:4px">${ok} de ${ITEMS.length} respuestas correctas en selección múltiple. ${pct >= 75 ? 'Muy buen resultado: repasa tus errores para afianzarlo.' : pct >= 55 ? 'Vas por buen camino: refuerza los módulos y competencias con menor porcentaje.' : 'Hay que reforzar: practica por módulo y competencia, empezando por el más bajo.'} Tu módulo más bajo: <b>${esc(CFG.componentes[peor[0]])}</b>.</p>
  <p class="aviso">El Icfes reporta un puntaje de 0 a 300 por módulo calculado con un modelo estadístico que compara a todos los evaluados, por lo que no existe una conversión exacta desde el porcentaje de aciertos. Usa este resultado para comparar tu avance entre simulacros.</p>
  <h3>Por módulo y competencia</h3><table>${tabla}</table>
  <h3>Por dificultad</h3><table>${Object.entries(porNiv).map(([k,v]) => fila(CFG.niveles[k], v)).join('')}</table>
  <div class="row" style="margin-top:14px">${ENS ? '<button class="btn" id="vtexto">Evaluar mi texto</button>' : ''}<button class="btn sec" id="solo">Ver solo mis errores</button><button class="btn sec" id="todas">Ver todas</button><button class="btn sec" id="otra">Reiniciar el simulacro</button></div></div><div id="rev"></div>`;
  const rev = errs => { const l = errs ? ITEMS.filter(it => ST.r[it.id] !== keyOf(it)) : ITEMS; $('#rev').innerHTML = (errs && !l.length ? '<div class="panel">¡No tuviste errores!</div>' : renderList(l, 'review')); };
  const texto = () => { $('#rev').innerHTML = ensayoHTML(ENS, true); puntajeRubrica(ENS.id); };
  if (ENS) { texto(); $('#vtexto').onclick = texto; } else rev(true);
  $('#solo').onclick = () => rev(true); $('#todas').onclick = () => rev(false);
  $('#otra').onclick = () => { ST = {r:{}, chk:{}, ens:{}}; save(); inicio(); window.scrollTo(0,0); };
}

document.addEventListener('click', e => {
  const v = e.target.closest('[data-ver]');
  if (v) { VER[v.dataset.ver] = true; ST.ver = VER; save(); escritura(); return; }
  const b = e.target.closest('button.op'); if (!b || b.disabled) return;
  if (CFG.modo === 'simulacro' && ST.fin) return;
  ST.r[b.dataset.id] = b.dataset.l; save();
  const it = ITEMS.find(i => i.id === b.dataset.id);
  const n = b.closest('.item').querySelector('.n').textContent.replace('.','');
  b.closest('.item').outerHTML = itemHTML(it, n, CFG.modo === 'practica' ? 'practica' : 'examen');
  if (CFG.modo === 'practica') { const resp = LIST.filter(i => ST.r[i.id]); const ok = resp.filter(i => ST.r[i.id]===keyOf(i)).length; $('#prog').textContent = `${ok}/${resp.length} aciertos`; $('#pst').textContent = `${LIST.length} preguntas · respondidas ${resp.length} · aciertos ${ok} (${Math.round(100*ok/resp.length)} %)`; }
  else progreso();
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset && t.dataset.ens) { ST.ens[t.dataset.ens] = t.value; save(); const p = $('#pc-' + t.dataset.ens); if (p) p.textContent = palabras(t.value) + ' palabras'; }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset && t.dataset.chk) { ST.chk[t.dataset.chk] = t.checked; save(); puntajeRubrica(t.dataset.chk.split(':')[0]); }
});

if (CFG.modo === 'practica') practica();
else if (CFG.modo === 'escritura') { if (CFG.ensayos.length) escritura(); else $('#main').innerHTML = '<div class="panel">Sin consignas.</div>'; }
else if (ST.fin) resultados();
else if (ST.t0) examen();
else inicio();
</script>
</body>
</html>
