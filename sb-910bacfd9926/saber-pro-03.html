 stroke=\"#e1e5ec\"/><text x=\"54\" y=\"188.0\" text-anchor=\"end\" fill=\"#3a4356\">100<\/text><line x1=\"60\" y1=\"147.0\" x2=\"540\" y2=\"147.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"151.0\" text-anchor=\"end\" fill=\"#3a4356\">150<\/text><line x1=\"60\" y1=\"110.0\" x2=\"540\" y2=\"110.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"114.0\" text-anchor=\"end\" fill=\"#3a4356\">200<\/text><line x1=\"60\" y1=\"73.0\" x2=\"540\" y2=\"73.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"77.0\" text-anchor=\"end\" fill=\"#3a4356\">250<\/text><line x1=\"60\" y1=\"36.0\" x2=\"540\" y2=\"36.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"40.0\" text-anchor=\"end\" fill=\"#3a4356\">300<\/text><line x1=\"60\" y1=\"258\" x2=\"540\" y2=\"258\" stroke=\"#3a4356\"/><line x1=\"60\" y1=\"258\" x2=\"60\" y2=\"36\" stroke=\"#3a4356\"/><text transform=\"translate(14,147.0) rotate(-90)\" text-anchor=\"middle\" fill=\"#3a4356\">Distancia (km)<\/text><text x=\"300.0\" y=\"312\" text-anchor=\"middle\" fill=\"#3a4356\">Tiempo (horas)<\/text><text x=\"100.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">0<\/text><text x=\"180.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">1<\/text><text x=\"260.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">2<\/text><text x=\"340.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">3<\/text><text x=\"420.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">4<\/text><text x=\"500.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">5<\/text><polyline fill=\"none\" stroke=\"#1660a8\" stroke-width=\"2.5\" points=\"100.0,258.0 180.0,213.6 260.0,169.2 340.0,169.2 420.0,110.0 500.0,65.6\"/><circle cx=\"100.0\" cy=\"258.0\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"100.0\" y=\"250.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">0<\/text><circle cx=\"180.0\" cy=\"213.6\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"180.0\" y=\"205.6\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">60<\/text><circle cx=\"260.0\" cy=\"169.2\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"260.0\" y=\"161.2\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">120<\/text><circle cx=\"340.0\" cy=\"169.2\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"340.0\" y=\"161.2\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">120<\/text><circle cx=\"420.0\" cy=\"110.0\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"420.0\" y=\"102.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">200<\/text><circle cx=\"500.0\" cy=\"65.6\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"500.0\" y=\"57.6\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">260<\/text><\/svg><\/div>", "items": [{"id": "RCP-312", "niv": 1, "cp": "rc_interpretacion", "e": "¿En qué intervalo de tiempo el camión no avanzó?", "f": "Lectura de la gráfica.", "vis": "", "o": [["A", "Entre la hora 1 y la hora 2.", "En la segunda hora pasó de 60 a 120 km: avanzó 60 km.", false], ["B", "Entre la hora 0 y la hora 1.", "En la primera hora el camión pasó de 0 a 60 km: avanzó 60 km.", false], ["C", "Entre la hora 2 y la hora 3.", "Al final de la hora 2 y al final de la hora 3 la distancia total era la misma, 120 km: en ese intervalo no avanzó.", true], ["D", "Entre la hora 4 y la hora 5.", "En la quinta hora pasó de 200 a 260 km: avanzó 60 km.", false]]}, {"id": "RCP-313", "niv": 2, "cp": "rc_formulacion", "e": "¿Cuál fue la velocidad media del camión durante toda la jornada?", "f": "Cálculo propio a partir de los datos del caso.", "vis": "", "o": [["A", "52 km/h.", "Velocidad media = distancia total ÷ tiempo total = 260 km ÷ 5 h = 52 km/h.", true], ["B", "60 km/h.", "Es la velocidad de la primera hora, no la de toda la jornada.", false], ["C", "65 km/h.", "Divide entre 4 horas, sin contar la hora en que el camión no avanzó; la velocidad media usa el tiempo total.", false], ["D", "80 km/h.", "Es la velocidad media de la cuarta hora, la mayor de la jornada.", false]]}, {"id": "RCP-314", "niv": 2, "cp": "rc_interpretacion", "e": "¿En qué intervalo la velocidad media del camión fue mayor?", "f": "Lectura de la gráfica.", "vis": "", "o": [["A", "Entre la hora 0 y la hora 1.", "En la primera hora la velocidad media fue de 60 km/h.", false], ["B", "Entre la hora 3 y la hora 4.", "Entre la hora 3 y la 4 pasó de 120 a 200 km: 80 km en una hora, la mayor pendiente de la gráfica.", true], ["C", "Entre la hora 1 y la hora 2.", "Entre la hora 1 y la 2 recorrió 60 km, es decir, 60 km/h.", false], ["D", "Entre la hora 4 y la hora 5.", "Entre la hora 4 y la 5 recorrió 60 km, menos que entre la hora 3 y la 4.", false]]}, {"id": "RCP-315", "niv": 2, "cp": "rc_argumentacion", "e": "El conductor afirma: «Entre la hora 3 y la hora 5 recorrí 140 km; como ese tramo abarca las horas 3, 4 y 5, mi velocidad media fue 140 ÷ 3 ≈ 46,7 km/h». ¿Es correcto su cálculo?", "f": "Cálculo propio a partir de los datos del caso.", "vis": "", "o": [["A", "No, porque de la hora 3 a la hora 5 transcurren 2 horas: 140 ÷ 2 = 70 km/h.", "El tiempo de un tramo es la diferencia entre la hora final y la inicial: 5 − 3 = 2 horas; contar las marcas de la gráfica da una hora de más.", true], ["B", "No, porque la velocidad se calcula con toda la jornada: 140 ÷ 5 = 28 km/h.", "La velocidad media de un tramo usa solo el tiempo de ese tramo, 2 horas.", false], ["C", "Sí, porque el tramo incluye las marcas de las horas 3, 4 y 5, es decir, 3 horas.", "Tres marcas en la gráfica delimitan solo 2 intervalos de una hora.", false], ["D", "No, porque al final de la hora 5 llevaba 260 km, y 260 ÷ 2 = 130 km/h.", "260 km es la distancia total de la jornada; en el tramo recorrió 260 − 120 = 140 km.", false]]}]}, {"comp": "razonamiento_cuantitativo", "sim": "pro-3", "ind": "Lote representado en un plano cartesiano", "tt": "", "texto": "En el plano de un lote, cada unidad de los ejes equivale a 10 m. Los vértices del lote son los puntos (0, 0), (12, 0), (12, 8) y (6, 8), como muestra la figura (no está a escala).", "vis": "<div class=\"vfig\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 260\" font-family=\"Arial\" font-size=\"13\"><rect width=\"400\" height=\"260\" fill=\"#ffffff\"/><line x1=\"40\" y1=\"220\" x2=\"380\" y2=\"220\" stroke=\"#7a8294\"/><line x1=\"40\" y1=\"220\" x2=\"40\" y2=\"20\" stroke=\"#7a8294\"/><polygon points=\"40,220 352,220 352,12 196,12\" fill=\"#e8eef7\" stroke=\"#1d2433\" stroke-width=\"2.5\"/><text x=\"44\" y=\"238\" fill=\"#1d2433\">(0, 0)<\/text><text x=\"330\" y=\"238\" fill=\"#1d2433\">(12, 0)<\/text><text x=\"300\" y=\"32\" fill=\"#1d2433\">(12, 8)<\/text><text x=\"200\" y=\"32\" fill=\"#1d2433\">(6, 8)<\/text><\/svg><\/div>", "items": [{"id": "RCP-316", "niv": 2, "cp": "rc_formulacion", "e": "¿Cuál es el área real del lote?", "f": "Cálculo propio a partir de los datos del caso.", "vis": "", "o": [["A", "720 m².", "Multiplica el área en unidades cuadradas (72) por 10; cada unidad cuadrada equivale a 10 m × 10 m = 100 m².", false], ["B", "4.800 m².", "Calcula el área de un rectángulo de 6 × 8 unidades, que no incluye el triángulo de la izquierda.", false], ["C", "7.200 m².", "Es un trapecio de bases 12 y 6 unidades y altura 8: (12 + 6) × 8 ÷ 2 = 72 unidades², y 72 × 100 m² = 7.200 m².", true], ["D", "9.600 m².", "Calcula el área del rectángulo de 12 × 8 unidades, que incluye un triángulo que no es parte del lote.", false]]}, {"id": "RCP-317", "niv": 3, "cp": "rc_formulacion", "e": "Se va a cercar todo el borde del lote. ¿Cuántos metros de cerca se necesitan?", "f": "Cálculo propio a partir de los datos del caso.", "vis": "", "o": [["A", "36 m.", "36 es el perímetro en unidades del plano; falta multiplicar por 10 m.", false], ["B", "340 m.", "Toma el lado inclinado como si midiera 8 unidades, igual que el lado vertical.", false], ["C", "360 m.", "Lados: 12, 8 y 6 unidades, y el inclinado, de (0, 0) a (6, 8), mide √(6² + 8²) = 10. Perímetro: 36 unidades = 360 m.", true], ["D", "400 m.", "Calcula el perímetro del rectángulo de 12 × 8 unidades (40 unidades).", false]]}, {"id": "RCP-318", "niv": 2, "cp": "rc_argumentacion", "e": "Un vecino afirma que el lote tiene forma de paralelogramo, porque su lado inferior y su lado superior son paralelos. ¿Es válido su argumento?", "f": "Coordenadas de la figura y definición de paralelogramo.", "vis": "", "o": [["A", "Sí, porque los lados de (0, 0) a (6, 8) y de (12, 0) a (12, 8) también son paralelos.", "Uno de esos lados es inclinado y el otro vertical: no son paralelos.", false], ["B", "No, porque un paralelogramo debe tener cuatro ángulos rectos, y en (0, 0) no lo hay.", "Esa es la condición de un rectángulo; hay paralelogramos sin ángulos rectos.", false], ["C", "Sí, porque los lados de (0, 0) a (12, 0) y de (6, 8) a (12, 8) son paralelos.", "Un par de lados paralelos define un trapecio; el paralelogramo exige dos pares.", false], ["D", "No, porque solo uno de sus pares de lados opuestos es paralelo.", "Un paralelogramo necesita dos pares de lados opuestos paralelos; el lado de (0, 0) a (6, 8) es inclinado y el de (12, 0) a (12, 8) es vertical, así que el lote es un trapecio.", true]]}]}, {"comp": "razonamiento_cuantitativo", "sim": "pro-3", "ind": "Evolución del salario de un trabajador", "tt": "", "texto": "La tabla muestra el salario mensual de Jorge, auxiliar administrativo de una empresa, entre 2022 y 2025.", "vis": "<table class=\"vt\"><caption>Tabla 1. Salario mensual de Jorge<\/caption><thead><tr><th>Año<\/th><th>Salario mensual<\/th><\/tr><\/thead><tbody><tr><td>2022<\/td><td>$ 1.500.000<\/td><\/tr><tr><td>2023<\/td><td>$ 1.680.000<\/td><\/tr><tr><td>2024<\/td><td>$ 1.848.000<\/td><\/tr><tr><td>2025<\/td><td>$ 2.051.280<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Fuente: datos ficticios.<\/div>", "items": [{"id": "RCP-319", "niv": 2, "cp": "rc_interpretacion", "e": "¿En qué año fue mayor el aumento del salario de Jorge en pesos, respecto al año anterior?", "f": "Lectura de la tabla y cálculo propio.", "vis": "", "o": [["A", "El aumento fue igual todos los años.", "Los aumentos fueron de $ 180.000, $ 168.000 y $ 203.280: no son iguales.", false], ["B", "En 2025.", "En 2025 el aumento fue de 2.051.280 − 1.848.000 = $ 203.280, mayor que los de 2023 ($ 180.000) y 2024 ($ 168.000).", true], ["C", "En 2024.", "En 2024 el aumento fue de $ 168.000, el menor de los tres.", false], ["D", "En 2023.", "En 2023 el aumento fue de $ 180.000.", false]]}, {"id": "RCP-320", "niv": 3, "cp": "rc_argumentacion", "e": "Jorge calcula el aumento porcentual de su salario en cada año, suma esos tres porcentajes y obtiene 33 %. Entonces concluye: «Entre 2022 y 2025 mi salario aumentó en total un 33 %». ¿Es válida su conclusión?", "f": "Cálculo propio a partir de los datos del caso.", "vis": "", "o": [["A", "Sí, porque los porcentajes de aumento de cada año se suman y se acumulan.", "Los porcentajes sucesivos se multiplican como factores, no se suman, porque cada uno se calcula sobre una base distinta.", false], ["B", "No, porque el aumento total es el promedio de los tres aumentos: 33 ÷ 3 = 11 %.", "El promedio de los aumentos anuales no es el aumento total del periodo.", false], ["C", "No, porque el aumento total es el producto de las tres tasas, menor que el 1 %.", "Multiplica las tasas en lugar de los factores (1 + tasa).", false], ["D", "No, porque cada aumento se aplicó sobre un salario mayor.", "Los aumentos fueron de 12 %, 10 % y 11 %, y se acumulan como factores: 1,12 × 1,10 × 1,11 = 1,36752 (también 2.051.280 ÷ 1.500.000). El aumento total fue de 36,752 %.", true]]}, {"id": "RCP-321", "niv": 1, "cp": "rc_formulacion", "e": "Si en 2026 Jorge ganara $ 2.200.000 y le descontaran el 4 % para salud y el 4 % para pensión, ambos calculados sobre ese salario, ¿cuánto recibiría después de los descuentos?", "f": "Cálculo propio a partir de los datos del caso.", "vis": "", "o": [["A", "$ 1.848.000", "Descuenta el 16 %, como si cada descuento fuera del 8 %.", false], ["B", "$ 2.024.000", "Los dos descuentos suman 8 % del salario: 2.200.000 × 0,92 = $ 2.024.000.", true], ["C", "$ 2.027.520", "Aplica el segundo descuento sobre el salario ya descontado (2.200.000 × 0,96 × 0,96), pero ambos se calculan sobre el salario.", false], ["D", "$ 2.112.000", "Aplica solo uno de los dos descuentos del 4 %.", false]]}]}, {"comp": "razonamiento_cuantitativo", "sim": "pro-3", "ind": "Cálculo de una nota definitiva", "tt": "", "texto": "La nota definitiva de una asignatura se calcula con los porcentajes de la tabla, en una escala de 0,0 a 5,0. Sofía ya conoce sus notas en tres de los cuatro componentes; le falta presentar el examen final.", "vis": "<table class=\"vt\"><caption>Tabla 1. Componentes de la nota de la asignatura<\/caption><thead><tr><th>Componente<\/th><th>Porcentaje<\/th><th>Nota de Sofía<\/th><\/tr><\/thead><tbody><tr><td>Parcial 1<\/td><td>25 %<\/td><td>3,2<\/td><\/tr><tr><td>Parcial 2<\/td><td>25 %<\/td><td>3,6<\/td><\/tr><tr><td>Trabajos<\/td><td>20 %<\/td><td>4,5<\/td><\/tr><tr><td>Examen final<\/td><td>30 %<\/td><td>Pendiente<\/td><\/tr><\/tbody><\/table>", "items": [{"id": "RCP-322", "niv": 1, "cp": "rc_interpretacion", "e": "¿Cuánto aporta la nota de trabajos de Sofía a su nota definitiva?", "f": "Tabla del caso.", "vis": "", "o": [["A", "0,2", "0,2 es el peso de los trabajos (20 %), no su aporte a la nota.", false], ["B", "0,45", "Calcula el 10 % de 4,5 en lugar del 20 %.", false], ["C", "0,9", "El aporte es la nota por su peso: 4,5 × 0,20 = 0,9.", true], ["D", "4,5", "4,5 es la nota de trabajos sin ponderar.", false]]}, {"id": "RCP-323", "niv": 3, "cp": "rc_formulacion", "e": "¿Qué nota mínima debe obtener Sofía en el examen final para que su nota definitiva sea al menos 3,5?", "f": "Cálculo propio a partir de los datos del caso.", "vis": "", "o": [["A", "1,2", "Divide lo que falta (3,5 − 2,6 = 0,9) entre 0,75, el peso de los componentes ya calificados, en lugar de entre 0,30, el peso del examen final.", false], ["B", "2,7", "Resuelve (3,2 + 3,6 + 4,5 + x) ÷ 4 = 3,5, como si todos los componentes pesaran lo mismo.", false], ["C", "3,0", "Lleva acumulado 3,2 × 0,25 + 3,6 × 0,25 + 4,5 × 0,20 = 2,6. Necesita 3,5 − 2,6 = 0,9 más, y 0,9 ÷ 0,30 = 3,0.", true], ["D", "3,5", "Supone que debe sacar en el examen la misma nota que quiere obtener como definitiva.", false]]}, {"id": "RCP-324", "niv": 2, "cp": "rc_argumentacion", "e": "Sofía afirma: «Ya tengo asegurada una nota definitiva mayor que 3,5, porque (3,2 + 3,6 + 4,5) ÷ 3 ≈ 3,77». ¿Es válido su razonamiento?", "f": "Cálculo propio a partir de los datos del caso.", "vis": "", "o": [["A", "No, porque las notas tienen pesos distintos y aún falta el examen final.", "Con los pesos de la tabla, sus tres notas aportan 2,6 puntos; la nota definitiva depende del examen final, que vale el 30 %.", true], ["B", "Sí, porque su nota de trabajos, 4,5, compensa las notas de los dos parciales.", "Los trabajos pesan solo el 20 %; además, falta el examen final.", false], ["C", "Sí, porque el promedio de las tres notas que conoce, 3,77, ya es mayor que 3,5.", "El promedio simple no tiene en cuenta los porcentajes ni el examen final pendiente.", false], ["D", "No, porque los parciales pesan más que los trabajos, así que su nota definitiva será menor que 3,5.", "Que los parciales pesen más no determina la nota definitiva: aún falta el examen final, que puede subirla o bajarla.", false]]}]}, {"comp": "razonamiento_cuantitativo", "sim": "pro-3", "ind": "Tamaños microscópicos", "tt": "", "texto": "Un artículo de divulgación científica presenta la tabla con el tamaño aproximado de algunos objetos muy pequeños.", "vis": "<table class=\"vt\"><caption>Tabla 1. Tamaños aproximados<\/caption><thead><tr><th>Objeto<\/th><th>Tamaño aproximado<\/th><\/tr><\/thead><tbody><tr><td>Grosor de un cabello humano<\/td><td>0,07 mm<\/td><\/tr><tr><td>Largo de una bacteria<\/td><td>2 × 10⁻⁶ m<\/td><\/tr><tr><td>Diámetro de un glóbulo rojo<\/td><td>7 × 10⁻⁶ m<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Valores aproximados con fines didácticos.<\/div>", "items": [{"id": "RCP-325", "niv": 1, "cp": "rc_interpretacion", "e": "¿Cuál es el grosor del cabello humano expresado en metros y en notación científica?", "f": "Tabla del caso.", "vis": "", "o": [["A", "7 × 10⁻² m.", "Equivale a 0,07 m: no convierte los milímetros a metros.", false], ["B", "7 × 10⁻⁴ m.", "Equivale a 0,0007 m = 0,7 mm: la coma se desplazó un lugar menos de lo necesario.", false], ["C", "7 × 10⁻⁵ m.", "0,07 mm = 0,07 ÷ 1.000 m = 0,00007 m = 7 × 10⁻⁵ m.", true], ["D", "7 × 10⁻⁶ m.", "Equivale a 0,007 mm, diez veces menos que el grosor del cabello.", false]]}, {"id": "RCP-326", "niv": 2, "cp": "rc_formulacion", "e": "¿Cuántas bacterias como las de la tabla, puestas una tras otra a lo largo, cubrirían aproximadamente el grosor de un cabello?", "f": "Cálculo propio a partir de los datos del caso.", "vis": "", "o": [["A", "3,5 bacterias.", "Error al dividir las potencias: 10⁻⁵ ÷ 10⁻⁶ = 10¹, no 10⁰.", false], ["B", "35 bacterias.", "(7 × 10⁻⁵) ÷ (2 × 10⁻⁶) = 3,5 × 10¹ = 35.", true], ["C", "350 bacterias.", "Error al dividir las potencias: toma 10⁻⁵ ÷ 10⁻⁶ como 10².", false], ["D", "3.500 bacterias.", "Toma el grosor del cabello como 7 × 10⁻³ m (confunde 0,07 mm con 0,007 m) antes de dividir.", false]]}, {"id": "RCP-327", "niv": 1, "cp": "rc_argumentacion", "e": "Un estudiante lee que un virus grande mide unos 3 × 10⁻⁷ m y afirma que es más grande que la bacteria de la tabla, porque 3 es mayor que 2 y el exponente 7 es mayor que 6. ¿Es válido su razonamiento?", "f": "Cálculo propio a partir de los datos del caso.", "vis": "", "o": [["A", "Sí, porque en las potencias de 10 un exponente mayor indica un número mayor.", "−7 es menor que −6, así que 10⁻⁷ es menor que 10⁻⁶.", false], ["B", "Sí, porque 3 × 10⁻⁷ m = 0,00003 m, que es más que 0,000002 m.", "Error al escribir el número: 3 × 10⁻⁷ = 0,0000003, no 0,00003.", false], ["C", "No, porque los dos miden lo mismo: 3 × 10⁻⁷ = 0,3 × 10⁻⁶ = 2 × 10⁻⁶.", "0,3 × 10⁻⁶ no es igual a 2 × 10⁻⁶: el virus mide menos de la sexta parte de la bacteria.", false], ["D", "No, porque 10⁻⁷ es menor que 10⁻⁶: el virus mide 0,0000003 m.", "3 × 10⁻⁷ m = 0,0000003 m y 2 × 10⁻⁶ m = 0,000002 m; con exponentes negativos, el de mayor valor absoluto indica un número menor.", true]]}]}, {"comp": "razonamiento_cuantitativo", "sim": "pro-3", "ind": "Rifa de una junta de acción comunal", "tt": "", "texto": "Una junta de acción comunal hace cada semana una rifa con los números de dos cifras del 00 al 99. En cada rifa, cada número se vende una sola vez y el ganador se define con un sorteo en el que todos los números tienen la misma probabilidad de salir.", "vis": "", "items": [{"id": "RCP-328", "niv": 2, "cp": "rc_argumentacion", "e": "Juan dice: «La semana pasada ganó el 47, así que esta semana no compraré el 47: es menos probable que vuelva a salir». ¿Es válido su razonamiento?", "f": "Noción de eventos independientes.", "vis": "", "o": [["A", "No, porque cada sorteo es independiente: el 47 sigue teniendo probabilidad 1/100.", "El resultado de la semana anterior no cambia las probabilidades del nuevo sorteo: el 47 tiene probabilidad 1/100, como cualquier otro número.", true], ["B", "Sí, porque si el 47 ya salió, su probabilidad ahora es 1/100 − 1/100 = 0.", "Los sorteos no tienen memoria: cada número conserva su probabilidad de 1/100.", false], ["C", "No, porque ahora el 47 tiene probabilidad 2/100, por haber ganado ya una vez.", "Tampoco aumenta su probabilidad: sigue siendo 1/100.", false], ["D", "Sí, porque la probabilidad de que el 47 gane dos semanas seguidas es solo de 1/10.000.", "Esa es la probabilidad calculada antes de ambos sorteos; sabiendo que ya ganó, en el nuevo sorteo su probabilidad es 1/100.", false]]}]}, {"comp": "razonamiento_cuantitativo", "sim": "pro-3", "ind": "Siembra de árboles nativos", "tt": "", "texto": "Una corporación ambiental registra el número de árboles nativos sembrados cada año en una cuenca. La gráfica muestra los datos de 2021 a 2025.", "vis": "<div class=\"vfig\"><svg class=\"vg\" viewBox=\"0 0 560 320\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Gráfica 1. Árboles nativos sembrados por año\" font-family=\"Arial, sans-serif\" font-size=\"12\"><rect width=\"560\" height=\"320\" fill=\"#ffffff\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"13\" fill=\"#1d2433\">Gráfica 1. Árboles nativos sembrados por año<\/text><line x1=\"60\" y1=\"258.0\" x2=\"540\" y2=\"258.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"262.0\" text-anchor=\"end\" fill=\"#3a4356\">0<\/text><line x1=\"60\" y1=\"221.0\" x2=\"540\" y2=\"221.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"225.0\" text-anchor=\"end\" fill=\"#3a4356\">500<\/text><line x1=\"60\" y1=\"184.0\" x2=\"540\" y2=\"184.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"188.0\" text-anchor=\"end\" fill=\"#3a4356\">1.000<\/text><line x1=\"60\" y1=\"147.0\" x2=\"540\" y2=\"147.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"151.0\" text-anchor=\"end\" fill=\"#3a4356\">1.500<\/text><line x1=\"60\" y1=\"110.0\" x2=\"540\" y2=\"110.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"114.0\" text-anchor=\"end\" fill=\"#3a4356\">2.000<\/text><line x1=\"60\" y1=\"73.0\" x2=\"540\" y2=\"73.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"77.0\" text-anchor=\"end\" fill=\"#3a4356\">2.500<\/text><line x1=\"60\" y1=\"36.0\" x2=\"540\" y2=\"36.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"40.0\" text-anchor=\"end\" fill=\"#3a4356\">3.000<\/text><line x1=\"60\" y1=\"258\" x2=\"540\" y2=\"258\" stroke=\"#3a4356\"/><line x1=\"60\" y1=\"258\" x2=\"60\" y2=\"36\" stroke=\"#3a4356\"/><text transform=\"translate(14,147.0) rotate(-90)\" text-anchor=\"middle\" fill=\"#3a4356\">Número de árboles<\/text><text x=\"300.0\" y=\"312\" text-anchor=\"middle\" fill=\"#3a4356\">Año<\/text><text x=\"108.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">2021<\/text><text x=\"204.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">2022<\/text><text x=\"300.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">2023<\/text><text x=\"396.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">2024<\/text><text x=\"492.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">2025<\/text><rect x=\"74.4\" y=\"169.2\" width=\"67.2\" height=\"88.8\" fill=\"#1660a8\"/><text x=\"108.0\" y=\"165.2\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">1.200<\/text><rect x=\"170.4\" y=\"147.0\" width=\"67.2\" height=\"111.0\" fill=\"#1660a8\"/><text x=\"204.0\" y=\"143.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">1.500<\/text><rect x=\"266.4\" y=\"124.8\" width=\"67.2\" height=\"133.2\" fill=\"#1660a8\"/><text x=\"300.0\" y=\"120.8\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">1.800<\/text><rect x=\"362.4\" y=\"80.4\" width=\"67.2\" height=\"177.6\" fill=\"#1660a8\"/><text x=\"396.0\" y=\"76.4\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">2.400<\/text><rect x=\"458.4\" y=\"58.2\" width=\"67.2\" height=\"199.8\" fill=\"#1660a8\"/><text x=\"492.0\" y=\"54.2\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">2.700<\/text><\/svg><\/div>", "items": [{"id": "RCP-331", "niv": 2, "cp": "rc_interpretacion", "e": "¿En qué año fue mayor el aumento porcentual de árboles sembrados respecto al año anterior?", "f": "Lectura de la gráfica y cálculo propio.", "vis": "", "o": [["A", "En 2024.", "En 2024 el aumento fue de 600 sobre 1.800, cerca del 33,3 %, el mayor de todos.", true], ["B", "En 2025.", "En 2025 el aumento fue de 300 sobre 2.400, es decir, 12,5 %.", false], ["C", "En 2023.", "En 2023 el aumento fue de 300 sobre 1.500, es decir, 20 %.", false], ["D", "En 2022.", "En 2022 el aumento fue de 300 sobre 1.200, es decir, 25 %.", false]]}, {"id": "RCP-332", "niv": 1, "cp": "rc_interpretacion", "e": "¿Cuántos árboles se sembraron en total entre 2021 y 2025?", "f": "Lectura de la gráfica.", "vis": "", "o": [["A", "1.920 árboles.", "1.920 es el promedio anual (9.600 ÷ 5), no el total.", false], ["B", "2.700 árboles.", "2.700 es solo lo sembrado en 2025.", false], ["C", "8.400 árboles.", "Suma de 2022 a 2025 y omite los 1.200 árboles de 2021.", false], ["D", "9.600 árboles.", "1.200 + 1.500 + 1.800 + 2.400 + 2.700 = 9.600 árboles.", true]]}, {"id": "RCP-333", "niv": 2, "cp": "rc_argumentacion", "e": "La corporación afirma que el número de árboles sembrados por año creció a un ritmo constante entre 2021 y 2025. ¿Es correcta esta afirmación?", "f": "Lectura de la gráfica.", "vis": "", "o": [["A", "Sí, porque cada año se sembraron más árboles que el año anterior.", "Crecer cada año no significa crecer a ritmo constante.", false], ["B", "No, porque en 2025 se sembraron 300 árboles menos que en 2024.", "En 2025 se sembraron 300 árboles más que en 2024, no menos.", false], ["C", "Sí, porque el aumento promedio fue de (2.700 − 1.200) ÷ 4 = 375 árboles por año.", "El aumento promedio existe para cualquier serie; no indica que los aumentos hayan sido iguales.", false], ["D", "No, porque los aumentos de un año a otro no fueron todos iguales.", "De 2021 a 2023 y de 2024 a 2025 el aumento anual fue de 300 árboles, pero de 2023 a 2024 fue de 600.", true]]}]}, {"comp": "razonamiento_cuantitativo", "sim": "pro-3", "ind": "Temperatura y venta de helados", "tt": "", "texto": "Un vendedor de helados registró durante ocho días la temperatura máxima del día y la cantidad de helados que vendió. La tabla presenta los datos y en la gráfica cada punto representa un día.", "vis": "<table class=\"vt\"><caption>Tabla 1. Temperatura máxima y helados vendidos<\/caption><thead><tr><th>Temperatura máxima (°C)<\/th><th>20<\/th><th>22<\/th><th>24<\/th><th>25<\/th><th>27<\/th><th>29<\/th><th>30<\/th><th>32<\/th><\/tr><\/thead><tbody><tr><td>Helados vendidos<\/td><td>45<\/td><td>52<\/td><td>60<\/td><td>58<\/td><td>70<\/td><td>78<\/td><td>85<\/td><td>90<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Fuente: datos ficticios.<\/div><div class=\"vfig\"><svg class=\"vg\" viewBox=\"0 0 560 320\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Gráfica 1. Helados vendidos según la temperatura\" font-family=\"Arial, sans-serif\" font-size=\"12\"><rect width=\"560\" height=\"320\" fill=\"#ffffff\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"13\" fill=\"#1d2433\">Gráfica 1. Helados vendidos según la temperatura<\/text><line x1=\"60\" y1=\"258.0\" x2=\"540\" y2=\"258.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"262.0\" text-anchor=\"end\" fill=\"#3a4356\">0<\/text><line x1=\"60\" y1=\"213.6\" x2=\"540\" y2=\"213.6\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"217.6\" text-anchor=\"end\" fill=\"#3a4356\">20<\/text><line x1=\"60\" y1=\"169.2\" x2=\"540\" y2=\"169.2\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"173.2\" text-anchor=\"end\" fill=\"#3a4356\">40<\/text><line x1=\"60\" y1=\"124.8\" x2=\"540\" y2=\"124.8\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"128.8\" text-anchor=\"end\" fill=\"#3a4356\">60<\/text><line x1=\"60\" y1=\"80.4\" x2=\"540\" y2=\"80.4\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"84.4\" text-anchor=\"end\" fill=\"#3a4356\">80<\/text><line x1=\"60\" y1=\"36.0\" x2=\"540\" y2=\"36.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"40.0\" text-anchor=\"end\" fill=\"#3a4356\">100<\/text><line x1=\"60\" y1=\"258\" x2=\"540\" y2=\"258\" stroke=\"#3a4356\"/><line x1=\"60\" y1=\"258\" x2=\"60\" y2=\"36\" stroke=\"#3a4356\"/><text transform=\"translate(14,147.0) rotate(-90)\" text-anchor=\"middle\" fill=\"#3a4356\">Helados vendidos<\/text><text x=\"300.0\" y=\"312\" text-anchor=\"middle\" fill=\"#3a4356\">Temperatura máxima (°C)<\/text><text x=\"60.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">0<\/text><text x=\"180.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">10<\/text><text x=\"300.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">20<\/text><text x=\"420.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">30<\/text><text x=\"540.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">40<\/text><circle cx=\"300.0\" cy=\"158.1\" r=\"4\" fill=\"#1660a8\"/><circle cx=\"324.0\" cy=\"142.6\" r=\"4\" fill=\"#1660a8\"/><circle cx=\"348.0\" cy=\"124.8\" r=\"4\" fill=\"#1660a8\"/><circle cx=\"360.0\" cy=\"129.2\" r=\"4\" fill=\"#1660a8\"/><circle cx=\"384.0\" cy=\"102.6\" r=\"4\" fill=\"#1660a8\"/><circle cx=\"408.0\" cy=\"84.8\" r=\"4\" fill=\"#1660a8\"/><circle cx=\"420.0\" cy=\"69.3\" r=\"4\" fill=\"#1660a8\"/><circle cx=\"444.0\" cy=\"58.2\" r=\"4\" fill=\"#1660a8\"/><\/svg><\/div>", "items": [{"id": "RCP-334", "niv": 2, "cp": "rc_interpretacion", "e": "¿Cuál de las siguientes afirmaciones describe mejor la relación entre las dos variables?", "f": "Lectura de la gráfica y de la tabla.", "vis": "", "o": [["A", "En general, en los días más calurosos se vendieron más helados.", "La nube de puntos muestra una tendencia creciente: a mayor temperatura, en general, mayores ventas.", true], ["B", "En general, en los días más calurosos se vendieron menos helados.", "La tendencia es creciente, no decreciente.", false], ["C", "Cada grado adicional de temperatura aumentó las ventas en 5 helados exactamente.", "La relación no es exacta: de 24 °C a 25 °C las ventas bajaron de 60 a 58.", false], ["D", "No hay relación entre la temperatura y la cantidad de helados vendidos.", "Los puntos muestran una tendencia creciente clara.", false]]}, {"id": "RCP-335", "niv": 1, "cp": "rc_interpretacion", "e": "¿En cuántos de los ocho días se vendieron más de 65 helados?", "f": "Lectura de la tabla.", "vis": "", "o": [["A", "3 días.", "Omite el día de 27 °C, en el que se vendieron 70 helados.", false], ["B", "4 días.", "Se vendieron más de 65 helados en los días de 27, 29, 30 y 32 °C (70, 78, 85 y 90 helados).", true], ["C", "5 días.", "Incluye un día con menos de 65 helados, como el de 24 °C (60).", false], ["D", "8 días.", "Cuenta todos los días registrados, no solo los que superaron 65 helados.", false]]}, {"id": "RCP-336", "niv": 3, "cp": "rc_argumentacion", "e": "El vendedor afirma: «Según mis registros, siempre que la temperatura máxima fue mayor, vendí más helados». ¿Es correcta su afirmación?", "f": "Lectura de la tabla.", "vis": "", "o": [["A", "Sí, porque el día de 32 °C, el más caluroso, fue el de mayores ventas: 90 helados.", "Que eso ocurra en el día más caluroso no prueba que se cumpla en todos los casos.", false], ["B", "No, porque hay un día más caluroso que otro en el que vendió menos helados.", "Una afirmación con «siempre» se refuta con un contraejemplo: el día de 25 °C vendió 58 helados, menos que los 60 del día de 24 °C.", true], ["C", "No, porque el día de 27 °C vendió menos helados que el día de 25 °C.", "El día de 27 °C vendió 70 helados, más que los 58 del día de 25 °C.", false], ["D", "Sí, porque de 20 °C a 32 °C las ventas pasaron de 45 a 90 helados.", "Comparar los extremos no prueba que las ventas aumenten en todos los casos.", false]]}]}, {"comp": "razonamiento_cuantitativo", "sim": "pro-3", "ind": "Elección de cargos en un comité", "tt": "", "texto": "El comité de deportes de un barrio tiene 7 integrantes. En su primera reunión deben elegir entre ellos a un presidente, un tesorero y un secretario. Una misma persona no puede ocupar dos cargos.", "vis": "", "items": [{"id": "RCP-329", "niv": 3, "cp": "rc_formulacion", "e": "¿De cuántas formas diferentes se pueden asignar los tres cargos?", "f": "Cálculo propio a partir de los datos del caso.", "vis": "", "o": [["A", "21 formas.", "Multiplica 7 × 3, como si cada cargo pudiera asignarse de forma independiente al número de personas.", false], ["B", "35 formas.", "Cuenta los grupos de 3 personas sin importar qué cargo ocupa cada una; aquí los cargos son distintos.", false], ["C", "210 formas.", "Hay 7 opciones para presidente, luego 6 para tesorero y 5 para secretario: 7 × 6 × 5 = 210.", true], ["D", "343 formas.", "Calcula 7 × 7 × 7, como si una misma persona pudiera ocupar varios cargos.", false]]}]}, {"comp": "competencias_ciudadanas", "sim": "pro-3", "ind": "Fines esenciales del Estado", "tt": "", "texto": "El artículo 2 de la Constitución enumera los fines esenciales del Estado colombiano.", "vis": "", "items": [{"id": "CCP-301", "niv": 1, "cp": "cc_conocimientos", "e": "¿Cuál de los siguientes es uno de esos fines?", "f": "Constitución Política de Colombia (texto vigente, secretariasenado.gov.co/senado/basedoc/constitucion_politica_1991.html), artículos 1 y 2", "vis": "", "o": [["A", "Facilitar la participación de todos en las decisiones que los afectan.", "El artículo 2 señala como fin esencial «facilitar la participación de todos en las decisiones que los afectan y en la vida económica, política, administrativa y cultural de la Nación».", true], ["B", "Garantizar a cada persona un empleo en el sector público.", "No figura entre los fines del artículo 2; la Constitución no garantiza un empleo público a cada persona.", false], ["C", "Asegurar la prevalencia del interés particular sobre el interés general.", "El artículo 1 establece lo contrario: el Estado se funda en «la prevalencia del interés general».", false], ["D", "Concentrar en el Gobierno nacional las decisiones que hoy toman las entidades territoriales.", "Contradice el artículo 1, que define a Colombia como república descentralizada, con autonomía de sus entidades territoriales.", false]]}]}, {"comp": "competencias_ciudadanas", "sim": "pro-3", "ind": "Jurisdicción especial indígena", "tt": "", "texto": "Dos comuneros de un resguardo indígena tienen un conflicto por los linderos de sus parcelas. Las autoridades del resguardo resuelven el caso según sus propias normas y procedimientos. Uno de ellos sostiene que solo un juez de la República podía decidir.", "vis": "", "items": [{"id": "CCP-302", "niv": 2, "cp": "cc_conocimientos", "e": "Según la Constitución, ¿qué pueden hacer las autoridades de los pueblos indígenas en casos como este?", "f": "Constitución Política de Colombia (texto vigente, secretariasenado.gov.co/senado/basedoc/constitucion_politica_1991.html), artículos 7, 116 y 246", "vis": "", "o": [["A", "Ejercer funciones jurisdiccionales conforme a sus usos y costumbres, que en su ámbito territorial prevalecen sobre la Constitución.", "El artículo 246 fija un límite expreso: las normas y procedimientos propios no pueden ser contrarios a la Constitución y las leyes.", false], ["B", "Resolver el conflicto según sus normas, pero un juez de la República debe aprobar luego la decisión para que tenga validez.", "El artículo 246 no exige que un juez apruebe cada decisión; dispone que la ley establezca formas de coordinación entre jurisdicciones.", false], ["C", "Conciliar entre las partes, pero no juzgar, porque la administración de justicia corresponde a los jueces y tribunales de la República.", "El artículo 116 enumera quiénes administran justicia, pero el artículo 246 reconoce expresamente funciones jurisdiccionales a las autoridades indígenas dentro de su ámbito territorial.", false], ["D", "Resolver el conflicto con sus propias reglas, dentro de su territorio, respetando los límites de la Constitución y de las leyes.", "Es lo que dispone el artículo 246; la ley establecerá las formas de coordinación de esa jurisdicción especial con el sistema judicial nacional.", true]]}]}, {"comp": "competencias_ciudadanas", "sim": "pro-3", "ind": "Recursos naturales en territorios indígenas", "tt": "", "texto": "El Gobierno estudia autorizar la explotación de un yacimiento ubicado dentro de un territorio indígena. La comunidad quiere saber qué dice la Constitución sobre este tipo de decisiones.", "vis": "", "items": [{"id": "CCP-303", "niv": 3, "cp": "cc_conocimientos", "e": "De acuerdo con el parágrafo del artículo 330 de la Constitución,", "f": "Constitución Política de Colombia (texto vigente, secretariasenado.gov.co/senado/basedoc/constitucion_politica_1991.html), artículos 329, 330 (parágrafo) y 332", "vis": "", "o": [["A", "los recursos del subsuelo de los territorios indígenas pertenecen a las comunidades, que son las que deciden sobre su explotación.", "El artículo 332 dispone que el Estado es propietario del subsuelo y de los recursos naturales no renovables; el artículo 330 exige participación de las comunidades, no decisión exclusiva de ellas.", false], ["B", "los resguardos son de propiedad colectiva y no enajenable, por lo que en ellos está prohibido explotar los recursos naturales del suelo y del subsuelo.", "Es cierto que los resguardos son de propiedad colectiva y no enajenable (art. 329), pero de ello no se sigue la prohibición: el artículo 330 regula cómo debe hacerse la explotación.", false], ["C", "el Gobierno decide la explotación, porque el Estado es propietario del subsuelo, y después informa a las comunidades lo resuelto.", "El Estado es propietario del subsuelo (art. 332), pero el parágrafo del artículo 330 exige que el Gobierno propicie la participación de las comunidades en las decisiones, no que solo les informe después.", false], ["D", "la explotación no debe afectar la integridad de la comunidad, y el Gobierno debe propiciar que sus representantes participen en la decisión.", "Es el contenido del parágrafo del artículo 330: «La explotación de los recursos naturales en los territorios indígenas se hará sin desmedro de la integridad cultural, social y económica de las comunidades indígenas. En las decisiones que se adopten respecto de dicha explotación, el Gobierno propiciará la participación de los representantes de las respectivas comunidades».", true]]}]}, {"comp": "competencias_ciudadanas", "sim": "pro-3", "ind": "Derecho a la vida", "tt": "", "texto": "En un debate escolar, un estudiante propone castigar con la muerte a los responsables de delitos muy graves. Otra estudiante le responde citando el artículo 11 de la Constitución.", "vis": "", "items": [{"id": "CCP-304", "niv": 1, "cp": "cc_conocimientos", "e": "¿Qué establece ese artículo?", "f": "Constitución Política de Colombia (texto vigente, secretariasenado.gov.co/senado/basedoc/constitucion_politica_1991.html), artículos 11, 12 y 214", "vis": "", "o": [["A", "Nadie será sometido a desaparición forzada, a torturas ni a tratos o penas crueles, inhumanos o degradantes.", "Es el texto del artículo 12, no del 11; el estudiante pedía el artículo que se refiere a la pena de muerte.", false], ["B", "La vida es un derecho inviolable y en Colombia no puede imponerse la pena de muerte.", "El artículo 11 dispone: «El derecho a la vida es inviolable. No habrá pena de muerte».", true], ["C", "La pena de muerte procede para los delitos de lesa humanidad.", "El artículo 11 no admite excepciones: «No habrá pena de muerte».", false], ["D", "El derecho a la vida puede suspenderse durante los estados de excepción.", "El artículo 214, numeral 2, dispone que en los estados de excepción no podrán suspenderse los derechos humanos ni las libertades fundamentales.", false]]}]}, {"comp": "competencias_ciudadanas", "sim": "pro-3", "ind": "Derechos de los niños", "tt": "", "texto": "Una comisaría de familia debe decidir sobre una situación en la que entran en tensión los derechos de un niño de ocho años y los intereses de un adulto de su familia.", "vis": "", "items": [{"id": "CCP-305", "niv": 2, "cp": "cc_conocimientos", "e": "¿Qué regla establece la Constitución para orientar esa decisión?", "f": "Constitución Política de Colombia (texto vigente, secretariasenado.gov.co/senado/basedoc/constitucion_politica_1991.html), artículos 44 y 45", "vis": "", "o": [["A", "Los derechos de los niños se protegen en la medida en que una ley los desarrolle.", "El artículo 44 los consagra directamente en la Constitución y añade los de las leyes y los tratados ratificados por Colombia.", false], ["B", "El adolescente tiene derecho a la protección y a la formación integral.", "Es el texto del artículo 45, referido a los adolescentes; no da una regla para resolver una tensión entre los derechos de un niño y los de un adulto.", false], ["C", "Cuando entran en conflicto, los derechos del niño tienen prioridad sobre los de los demás.", "El último inciso del artículo 44 dispone: «Los derechos de los niños prevalecen sobre los derechos de los demás».", true], ["D", "Los derechos de los niños se equiparan con los de los adultos de su familia.", "El artículo 44 no los equipara: establece su prevalencia.", false]]}]}, {"comp": "competencias_ciudadanas", "sim": "pro-3", "ind": "Función ecológica de la propiedad", "tt": "", "texto": "La autoridad ambiental le impide al dueño de una finca talar el bosque que rodea un nacimiento de agua. El propietario alega que la Constitución garantiza la propiedad privada y que, por tanto, puede hacer con su terreno lo que quiera.", "vis": "", "items": [{"id": "CCP-306", "niv": 2, "cp": "cc_conocimientos", "e": "¿Qué disposición del artículo 58 de la Constitución contradice el argumento del propietario?", "f": "Constitución Política de Colombia (texto vigente, secretariasenado.gov.co/senado/basedoc/constitucion_politica_1991.html), artículo 58 (modificado por el Acto Legislativo 1 de 1999)", "vis": "", "o": [["A", "La propiedad cumple una función social que impone obligaciones, entre ellas una función ecológica.", "Es el texto del artículo 58: la garantía de la propiedad privada no es absoluta; la propiedad implica obligaciones, entre ellas una función ecológica.", true], ["B", "Se garantizan la propiedad privada y los derechos adquiridos, que no pueden ser desconocidos por leyes posteriores.", "Es el primer inciso del artículo 58, pero no contradice al propietario: es justamente la parte que él invoca.", false], ["C", "Las limitaciones ambientales se aplican a las empresas y no a las personas naturales.", "El artículo 58 no hace esa distinción.", false], ["D", "La propiedad privada es un derecho absoluto, pero puede expropiarse sin indemnización.", "El artículo 58 no dice que la propiedad sea absoluta, y la expropiación exige, por regla general, indemnización previa.", false]]}]}, {"comp": "competencias_ciudadanas", "sim": "pro-3", "ind": "Rama ejecutiva", "tt": "", "texto": "En un taller de formación ciudadana se pregunta por el cargo que, según la Constitución, reúne tres calidades: Jefe del Estado, Jefe del Gobierno y suprema autoridad administrativa.", "vis": "", "items": [{"id": "CCP-307", "niv": 1, "cp": "cc_conocimientos", "e": "¿De qué cargo se trata?", "f": "Constitución Política de Colombia (texto vigente, secretariasenado.gov.co/senado/basedoc/constitucion_politica_1991.html), artículo 115", "vis": "", "o": [["A", "El Presidente de la República.", "El artículo 115 dispone: «El Presidente de la República es Jefe del Estado, Jefe del Gobierno y suprema autoridad administrativa».", true], ["B", "El presidente del Congreso.", "El presidente del Congreso dirige la rama legislativa; no es Jefe del Estado.", false], ["C", "El presidente de la Corte Constitucional.", "La Corte Constitucional pertenece a la rama judicial.", false], ["D", "El Vicepresidente de la República.", "El Vicepresidente no reúne esas calidades; las tiene el Presidente (art. 115).", false]]}]}, {"comp": "competencias_ciudadanas", "sim": "pro-3", "ind": "Órganos de control y Fiscalía", "tt": "", "texto": "Una veeduría ciudadana encontró sobrecostos en un contrato de una alcaldía y, además, indicios de que el funcionario que lo firmó se apropió de parte de los recursos, lo cual podría constituir un delito.", "vis": "", "items": [{"id": "CCP-308", "niv": 2, "cp": "cc_conocimientos", "e": "¿A qué entidad le corresponde ejercer la acción penal e investigar los hechos que podrían constituir un delito?", "f": "Constitución Política de Colombia (texto vigente, secretariasenado.gov.co/senado/basedoc/constitucion_politica_1991.html), artículos 250, 267, 271, 277 y 282", "vis": "", "o": [["A", "La Procuraduría General de la Nación.", "La Procuraduría ejerce el control disciplinario y otras funciones del Ministerio Público (art. 277), no la acción penal.", false], ["B", "La Fiscalía General de la Nación.", "El artículo 250 dispone que la Fiscalía «está obligada a adelantar el ejercicio de la acción penal y realizar la investigación de los hechos que revistan las características de un delito».", true], ["C", "La Contraloría General de la República.", "La Contraloría vigila la gestión fiscal (art. 267); sus hallazgos tienen valor probatorio ante la Fiscalía (art. 271), pero no ejerce la acción penal.", false], ["D", "La Defensoría del Pueblo.", "La Defensoría promueve y divulga los derechos humanos (art. 282); no investiga delitos.", false]]}]}, {"comp": "competencias_ciudadanas", "sim": "pro-3", "ind": "Reforma constitucional por iniciativa ciudadana", "tt": "", "texto": "Un grupo de ciudadanos quiere presentar ante el Congreso un proyecto de acto legislativo para reformar la Constitución.", "vis": "", "items": [{"id": "CCP-309", "niv": 3, "cp": "cc_conocimientos", "e": "Según el artículo 375 de la Constitución, ¿qué respaldo necesitan para presentarlo?", "f": "Constitución Política de Colombia (texto vigente, secretariasenado.gov.co/senado/basedoc/constitucion_politica_1991.html), artículos 375, 377 y 378", "vis": "", "o": [["A", "Ciudadanos en número equivalente, al menos, al diez por ciento del censo electoral vigente.", "El porcentaje que exige el artículo 375 es el cinco por ciento, no el diez.", false], ["B", "Ciudadanos en número equivalente, al menos, a la cuarta parte del censo electoral vigente.", "La cuarta parte del censo es un umbral de participación en ciertos referendos (arts. 377 y 378), no el requisito para presentar un proyecto de acto legislativo.", false], ["C", "Ciudadanos en número equivalente, al menos, al cinco por ciento del censo electoral vigente.", "El artículo 375 permite presentar proyectos de acto legislativo a «los ciudadanos en un número equivalente al menos, al cinco por ciento del censo electoral vigente».", true], ["D", "La firma de al menos un ministro del despacho que avale el proyecto.", "El Gobierno puede presentar proyectos de acto legislativo, pero la iniciativa ciudadana no requiere el aval de un ministro.", false]]}]}, {"comp": "competencias_ciudadanas", "sim": "pro-3", "ind": "Cabildo abierto", "tt": "", "texto": "Los habitantes de un municipio quieren que el concejo discuta, en una sesión pública en la que ellos puedan intervenir directamente, el proyecto de trasladar la plaza de mercado a las afueras del pueblo.", "vis": "", "items": [{"id": "CCP-310", "niv": 2, "cp": "cc_conocimientos", "e": "¿Qué mecanismo de participación corresponde a lo que buscan?", "f": "Constitución Política de Colombia (texto vigente, secretariasenado.gov.co/senado/basedoc/constitucion_politica_1991.html), artículos 88 y 103; Ley 134 de 1994, artículo 9", "vis": "", "o": [["A", "El plebiscito.", "El plebiscito es convocado por el Presidente para que el pueblo apoye o rechace una decisión del Ejecutivo; no es una sesión del concejo con participación de los habitantes.", false], ["B", "La acción popular.", "La acción popular es un mecanismo judicial de protección de derechos colectivos (art. 88), no un espacio de deliberación en el concejo.", false], ["C", "La revocatoria del mandato.", "La revocatoria busca terminar el mandato de un gobernante elegido, no discutir un asunto en el concejo.", false], ["D", "El cabildo abierto.", "El cabildo abierto es uno de los mecanismos de participación del artículo 103 y, según la Ley 134 de 1994 (art. 9), es «la reunión pública de los concejos […] en la cual los habitantes pueden participar directamente con el fin de discutir asuntos de interés para la comunidad».", true]]}]}, {"comp": "competencias_ciudadanas", "sim": "pro-3", "ind": "Espacio público", "tt": "", "texto": "La administración de un centro comercial instaló rejas sobre el andén que lo rodea y lo convirtió en parqueadero exclusivo para sus clientes. Los peatones deben bajar a la calzada para pasar.", "vis": "", "items": [{"id": "CCP-311", "niv": 3, "cp": "cc_conocimientos", "e": "¿Qué derecho se afecta y qué mecanismo prevé la Constitución para protegerlo?", "f": "Constitución Política de Colombia (texto vigente, secretariasenado.gov.co/senado/basedoc/constitucion_politica_1991.html), artículos 15, 30, 82, 87 y 88", "vis": "", "o": [["A", "El derecho a la propiedad privada del centro comercial, que puede protegerse mediante la acción de cumplimiento.", "El andén es espacio público, no propiedad del centro comercial, y la acción de cumplimiento busca que una autoridad cumpla una ley o un acto administrativo (art. 87).", false], ["B", "El derecho fundamental a la intimidad, que puede protegerse mediante el habeas data.", "La situación no tiene relación con la intimidad ni con datos personales (art. 15).", false], ["C", "El derecho colectivo al espacio público, que puede protegerse mediante el habeas corpus.", "El derecho afectado está bien identificado, pero el habeas corpus protege la libertad de quien está privado de ella ilegalmente (art. 30).", false], ["D", "El derecho colectivo al espacio público, que puede protegerse mediante una acción popular.", "El artículo 82 ordena al Estado velar por la integridad del espacio público y su destinación al uso común, que prevalece sobre el interés particular; el artículo 88 incluye el espacio público entre los derechos colectivos protegidos por las acciones populares.", true]]}]}, {"comp": "competencias_ciudadanas", "sim": "pro-3", "ind": "Alquiler turístico en un centro histórico", "tt": "", "texto": "En los últimos cinco años, el número de viviendas del centro histórico de una ciudad costera que se arriendan por días a turistas pasó de 120 a 900. En el mismo periodo, el arriendo mensual promedio de un apartamento en el sector subió un 70 %.\n\n– Doña Carmen, residente desde hace 40 años: «Mis vecinos de toda la vida se fueron porque no pudieron pagar el arriendo. Ahora cada fin de semana llegan desconocidos con maletas y hay fiestas hasta la madrugada».\n\n– Un propietario que alquila su apartamento por días: «Con lo que gano en temporada pago la educación de mis hijos. Es mi propiedad y tengo derecho a decidir cómo la uso».\n\n– El gremio hotelero: «Pagamos impuestos y cumplimos normas de seguridad que estos alojamientos informales no cumplen. Es competencia desleal».\n\n– La dueña de una tienda de artesanías: «Los turistas son nuestros principales clientes; gracias a ellos hemos contratado a dos personas más».", "vis": "", "items": [{"id": "CCP-312", "niv": 1, "cp": "cc_multiperspectivismo", "e": "¿Cuál de los siguientes actores ve en el aumento del turismo un beneficio económico directo para su negocio?", "f": "Texto original elaborado para este simulacro, caso del alquiler turístico en el centro histórico", "vis": "", "o": [["A", "Los vecinos que se fueron del sector.", "Según doña Carmen, se fueron porque no pudieron pagar el arriendo: fueron perjudicados.", false], ["B", "La dueña de la tienda de artesanías.", "Afirma que los turistas son sus principales clientes y que gracias a ellos contrató a dos personas más.", true], ["C", "El gremio hotelero.", "El gremio se queja de la competencia de los alojamientos informales; no describe un beneficio.", false], ["D", "Doña Carmen, residente del centro histórico desde hace cuarenta años.", "Doña Carmen describe efectos negativos: la salida de sus vecinos y el ruido.", false]]}, {"id": "CCP-313", "niv": 2, "cp": "cc_multiperspectivismo", "e": "El gremio hotelero y doña Carmen se oponen a la situación actual, pero por razones distintas. ¿Cuál opción describe esas razones?", "f": "Texto original elaborado para este simulacro, caso del alquiler turístico en el centro histórico", "vis": "", "o": [["A", "El gremio alude a una competencia desigual; doña Carmen, a la pérdida de sus vecinos y a la convivencia.", "El gremio habla de impuestos y normas que los alojamientos informales no cumplen; doña Carmen, de vecinos que se fueron y de fiestas hasta la madrugada.", true], ["B", "El gremio alude a la pérdida de los vecinos de toda la vida; doña Carmen, a la competencia desleal de los alojamientos.", "Invierte las razones de cada actor.", false], ["C", "El gremio rechaza el turismo en general; doña Carmen, la venta de artesanías.", "El gremio vive del turismo y doña Carmen no menciona las artesanías.", false], ["D", "Ambos se refieren a los impuestos que no pagan los alojamientos por días y a las normas de seguridad que incumplen.", "Solo el gremio hotelero menciona impuestos y normas de seguridad.", false]]}, {"id": "CCP-314", "niv": 2, "cp": "cc_multiperspectivismo", "e": "Una norma que obligue a registrar los alojamientos por días, cumplir normas de seguridad y pagar impuestos, sin prohibirlos, respondería principalmente a la queja de", "f": "Texto original elaborado para este simulacro, caso del alquiler turístico en el centro histórico", "vis": "", "o": [["A", "doña Carmen, porque haría que los arriendos del centro histórico bajaran de inmediato y sus antiguos vecinos regresaran.", "Nada en el texto permite concluir que esa norma bajaría los arriendos de inmediato ni que los vecinos regresarían.", false], ["B", "la dueña de la tienda, porque aumentaría el número de turistas.", "La norma no tiene como propósito atraer más turistas, y la dueña de la tienda no presenta una queja.", false], ["C", "el gremio hotelero, porque igualaría las condiciones de competencia.", "La queja del gremio es que los alojamientos informales no pagan impuestos ni cumplen normas de seguridad; la norma corregiría esa desigualdad.", true], ["D", "el propietario, porque podría cobrar tarifas más altas.", "La norma le impone obligaciones al propietario; no responde a una queja suya.", false]]}, {"id": "CCP-315", "niv": 3, "cp": "cc_argumentacion", "e": "Un concejal concluye: «Los datos prueban que el alquiler por días es la única causa del alza de los arriendos en el centro histórico». Esta conclusión", "f": "Texto original elaborado para este simulacro, caso del alquiler turístico en el centro histórico, datos del primer párrafo", "vis": "", "o": [["A", "es correcta, porque doña Carmen confirma que sus vecinos se fueron.", "El testimonio de doña Carmen describe una consecuencia, pero no demuestra que el alquiler por días sea la única causa del alza.", false], ["B", "es correcta, porque el número de viviendas que se alquilan por días creció más que el porcentaje en que subió el arriendo mensual promedio.", "Comparar un número de viviendas con un porcentaje de alza no tiene sentido y no demuestra causalidad.", false], ["C", "va más allá de los datos, que muestran que ambos fenómenos ocurrieron a la vez, pero no descartan otras causas.", "Los datos indican que el alquiler por días y los arriendos crecieron en el mismo periodo; esa coincidencia puede sugerir una relación, pero no prueba que sea la única causa.", true], ["D", "es incorrecta, porque los arriendos del sector bajaron en ese periodo.", "Falso: según el texto, el arriendo promedio subió un 70 %.", false]]}]}, {"comp": "competencias_ciudadanas", "sim": "pro-3", "ind": "Insecticidas, abejas y café", "tt": "", "texto": "En una región cafetera, los apicultores denunciaron la muerte de cerca de 600 colmenas en un mes. Un laboratorio encontró en las abejas muertas restos de un insecticida que algunos caficultores aplican para controlar la broca, una plaga que perfora el grano de café.\n\nLa federación de apicultores pide prohibir ese insecticida en la región. Los caficultores responden que, sin control de la broca, pueden perder hasta un tercio de la cosecha. Un agrónomo explica que existen controles alternativos, como recoger a tiempo los granos caídos y aplicar un hongo que ataca la broca, pero que exigen más mano de obra. Además, recuerda que las abejas polinizan los cafetos y que su presencia aumenta la producción de café.", "vis": "", "items": [{"id": "CCP-316", "niv": 2, "cp": "cc_sistemico", "e": "Según el texto, ¿qué relación hay entre los intereses de los caficultores y los de los apicultores?", "f": "Texto original elaborado para este simulacro, caso de las abejas y la broca del café", "vis": "", "o": [["A", "Coinciden en que ambos se oponen a la prohibición del insecticida.", "Contradice el texto: los apicultores piden prohibir el insecticida.", false], ["B", "Son opuestos, porque la producción de miel compite con la de café por el uso de la tierra de la región.", "El texto no menciona esa competencia; muestra, al contrario, que las abejas benefician al café.", false], ["C", "Se relacionan porque las abejas ayudan a controlar la broca del café.", "El texto no dice que las abejas controlen la broca; el control alternativo que menciona es un hongo.", false], ["D", "Están más ligados de lo que parece, porque las abejas polinizan los cafetos y aumentan la producción de café.", "El agrónomo señala que la presencia de abejas aumenta la producción de café; proteger las colmenas también beneficia a los caficultores.", true]]}, {"id": "CCP-317", "niv": 3, "cp": "cc_sistemico", "e": "Si se prohibiera el insecticida y los caficultores adoptaran los controles alternativos, ¿cuál sería el efecto más probable según el agrónomo?", "f": "Texto original elaborado para este simulacro, caso de las abejas y la broca del café, intervención del agrónomo", "vis": "", "o": [["A", "La broca desaparecería de la región y los caficultores reducirían sus costos de producción.", "El agrónomo advierte que los controles alternativos exigen más mano de obra, es decir, más costos, y no dice que la broca desaparezca.", false], ["B", "Aumentarían los costos de mano de obra de los caficultores, pero se protegerían las colmenas y la polinización.", "El agrónomo dice que los controles alternativos exigen más mano de obra; a la vez, sin el insecticida se protegería a las abejas, que polinizan el café.", true], ["C", "Los apicultores perderían más colmenas a causa del hongo que ataca la broca.", "El texto no dice que el hongo afecte a las abejas.", false], ["D", "Se protegerían las colmenas, pero la broca quedaría sin control y se perdería un tercio de la cosecha.", "Los caficultores advierten esa pérdida para el caso de no controlar la broca; con los controles alternativos que describe el agrónomo, la plaga sí se controla.", false]]}, {"id": "CCP-318", "niv": 1, "cp": "cc_multiperspectivismo", "e": "La posición de los caficultores frente a la prohibición se explica principalmente por", "f": "Texto original elaborado para este simulacro, caso de las abejas y la broca del café", "vis": "", "o": [["A", "el temor a perder parte de la cosecha si no pueden controlar la broca.", "Responden que, sin control de la broca, pueden perder hasta un tercio de la cosecha.", true], ["B", "su desconfianza en los resultados del laboratorio que analizó las abejas muertas de las colmenas de la región.", "Los caficultores no cuestionan los resultados del laboratorio.", false], ["C", "la convicción de que los controles alternativos no funcionan contra la broca.", "Los caficultores no se refieren a los controles alternativos; según el agrónomo, sí existen y funcionan, aunque exigen más mano de obra.", false], ["D", "la falta de trabajadores en la región.", "Los caficultores no mencionan la falta de trabajadores; la mano de obra la menciona el agrónomo como requisito de los controles alternativos.", false]]}, {"id": "CCP-319", "niv": 2, "cp": "cc_argumentacion", "e": "¿Qué información del texto respalda con mayor solidez que el insecticida está relacionado con la muerte de las colmenas?", "f": "Texto original elaborado para este simulacro, caso de las abejas y la broca del café", "vis": "", "o": [["A", "Que las abejas polinizan los cafetos.", "Explica la importancia de las abejas, pero no relaciona el insecticida con su muerte.", false], ["B", "Que los caficultores pueden perder hasta un tercio de la cosecha si no controlan la broca del café.", "Ese dato se refiere a los efectos de la broca, no a la causa de la muerte de las abejas.", false], ["C", "Que un laboratorio encontró restos del insecticida en las abejas muertas.", "Es una evidencia directa que vincula el insecticida con las abejas muertas.", true], ["D", "Que existe un hongo que ataca la broca.", "Muestra que hay alternativas de control, pero no dice nada sobre la causa de la muerte de las colmenas.", false]]}]}, {"comp": "competencias_ciudadanas", "sim": "pro-3", "ind": "Uso del celular en un colegio", "tt": "", "texto": "El consejo directivo de un colegio discute si prohíbe el uso del celular durante toda la jornada escolar.\n\nRectora: «Una encuesta a nuestros 600 estudiantes mostró que el 62 % usa el celular durante las clases para entrar a redes sociales. Los docentes reportan más distracción y peleas que empiezan en los chats».\n\nRepresentante de los estudiantes, una alumna de grado 11: «Muchos usamos el celular para consultar el material de clase y la plataforma del colegio. Una prohibición total nos castiga a todos por lo que hacen algunos».\n\nPadre de familia: «Yo necesito comunicarme con mi hija a la salida, porque vivimos lejos y ella se devuelve sola».\n\nDocente de informática: «En el colegio San Martín, el de mejores resultados de la ciudad, no prohíben los celulares; por lo tanto, prohibirlos aquí bajaría nuestros resultados».", "vis": "", "items": [{"id": "CCP-320", "niv": 3, "cp": "cc_argumentacion", "e": "El argumento del docente de informática es débil porque", "f": "Texto original elaborado para este simulacro, caso del celular en el colegio, intervención del docente de informática", "vis": "", "o": [["A", "supone que lo que funciona en otro colegio funcionaría igual en este y atribuye los resultados de aquel a una sola causa.", "El docente traslada la experiencia de otro colegio sin considerar las diferencias de contexto y asume que sus buenos resultados se deben a no prohibir el celular, cuando pueden depender de muchos otros factores (docentes, estudiantes, recursos).", true], ["B", "la encuesta de la rectora demuestra que prohibir el celular mejora los resultados.", "La encuesta muestra el uso del celular en clase, no el efecto de prohibirlo sobre los resultados.", false], ["C", "los resultados en las pruebas dependen sobre todo del número de estudiantes y del estrato socioeconómico de cada colegio.", "Es una afirmación que el texto no respalda y no señala la falla del razonamiento del docente.", false], ["D", "el colegio San Martín no obtiene buenos resultados en las pruebas.", "Contradice el texto: el docente lo presenta como el de mejores resultados de la ciudad. La debilidad está en el razonamiento, no en ese dato.", false]]}, {"id": "CCP-321", "niv": 2, "cp": "cc_argumentacion", "e": "La representante de los estudiantes sostiene que la prohibición total «nos castiga a todos por lo que hacen algunos». ¿Qué dato de la rectora debilita en parte esa objeción?", "f": "Texto original elaborado para este simulacro, caso del celular en el colegio", "vis": "", "o": [["A", "Que el colegio tiene 600 estudiantes matriculados en total.", "El total de estudiantes no indica cuántos usan mal el celular.", false], ["B", "Que el 62 % de los estudiantes usa el celular en clase para entrar a redes sociales.", "Si el uso en clase para redes sociales es mayoritario (62 %), no se trata solo de «algunos», como afirma la representante.", true], ["C", "Que los docentes reportan más distracción y peleas que empiezan en los chats de los estudiantes.", "Ese dato se refiere a los efectos del uso del celular, no a cuántos estudiantes lo usan indebidamente.", false], ["D", "Que el padre necesita comunicarse con su hija a la salida.", "No es un dato de la rectora y no se relaciona con la objeción.", false]]}, {"id": "CCP-322", "niv": 2, "cp": "cc_multiperspectivismo", "e": "¿Qué propuesta atendería a la vez las preocupaciones de la rectora, la representante de los estudiantes y el padre de familia?", "f": "Texto original elaborado para este simulacro, caso del celular en el colegio", "vis": "", "o": [["A", "Prohibir el celular en clase y en los descansos, y permitir que el padre llame a la rectoría para hablar con su hija.", "Parece atender a la rectora y al padre, pero impide el uso académico del celular que defiende la representante de los estudiantes.", false], ["B", "Permitir el celular en clase y sancionar las peleas que empiecen en los chats.", "No atiende la distracción en clase que preocupa a la rectora.", false], ["C", "Permitir el celular en clase solo para el material académico y prohibirlo a la salida para evitar las peleas en los chats.", "Atiende a la rectora y a la representante, pero impide justo lo que pide el padre: comunicarse con su hija a la salida.", false], ["D", "Restringir el celular en clase, salvo para actividades que indique el docente, y permitirlo a la salida.", "Reduce la distracción en clase (rectora), permite el uso académico (representante) y la comunicación a la salida (padre).", true]]}, {"id": "CCP-323", "niv": 1, "cp": "cc_multiperspectivismo", "e": "La intervención del padre de familia se basa principalmente en", "f": "Texto original elaborado para este simulacro, caso del celular en el colegio, intervención del padre de familia", "vis": "", "o": [["A", "el riesgo de que su hija se distraiga en clase con las redes sociales.", "La distracción en clase es la preocupación de la rectora; el padre habla de comunicarse con su hija a la salida.", false], ["B", "el derecho de los estudiantes a decidir cuándo usan el celular.", "El padre no plantea ese derecho; su argumento es una necesidad concreta de comunicación con su hija.", false], ["C", "el uso académico del celular para consultar el material de clase y la plataforma del colegio.", "Ese argumento es de la representante de los estudiantes.", false], ["D", "la necesidad de comunicarse con su hija y velar por su seguridad fuera de la jornada.", "El padre explica que necesita comunicarse con su hija a la salida porque viven lejos y ella regresa sola.", true]]}]}, {"comp": "competencias_ciudadanas", "sim": "pro-3", "ind": "Vivienda junto a un humedal", "tt": "", "texto": "Una constructora solicitó licencia para levantar 1.200 viviendas en un terreno contiguo a un humedal, en la periferia de una ciudad. La ciudad tiene un déficit de unas 15.000 viviendas, y el proyecto incluye un 40 % de vivienda de interés social.\n\nLa autoridad ambiental informa que el humedal almacena agua en la temporada de lluvias y que, en los barrios cercanos, las inundaciones aumentaron después de que se rellenó una parte de él hace diez años.\n\nLa constructora propone dejar una franja de protección de 30 metros alrededor del humedal. Un colectivo de vecinos pide que el humedal se declare área protegida y se convierta en parque ecológico. La oficina de planeación señala que la ciudad no tiene otros lotes grandes disponibles dentro del perímetro urbano.", "vis": "", "items": [{"id": "CCP-324", "niv": 2, "cp": "cc_sistemico", "e": "¿Qué relación entre dimensiones del problema muestra la información de la autoridad ambiental?", "f": "Texto original elaborado para este simulacro, caso del humedal y el proyecto de vivienda, informe de la autoridad ambiental", "vis": "", "o": [["A", "La pérdida de parte del humedal se asocia con más inundaciones en los barrios cercanos.", "La autoridad relaciona un hecho ambiental (el relleno de una parte del humedal) con un efecto social (más inundaciones en los barrios).", true], ["B", "La franja de 30 metros es suficiente para evitar nuevas inundaciones.", "La autoridad no evalúa la franja, y nada en el texto permite afirmarlo.", false], ["C", "El humedal impide que la ciudad tenga lotes disponibles.", "La falta de lotes la menciona la oficina de planeación, y no se atribuye al humedal.", false], ["D", "La construcción de vivienda de interés social reduce el déficit de vivienda que hoy tiene la ciudad.", "Puede ser cierto, pero no es información de la autoridad ambiental.", false]]}, {"id": "CCP-325", "niv": 3, "cp": "cc_sistemico", "e": "La oficina de planeación aporta un dato que hace más difícil rechazar el proyecto sin más. ¿Por qué?", "f": "Texto original elaborado para este simulacro, caso del humedal y el proyecto de vivienda, intervención de la oficina de planeación", "vis": "", "o": [["A", "Porque demuestra que el humedal no almacena agua en la temporada de lluvias.", "Planeación no dice nada sobre el humedal; la autoridad ambiental afirma lo contrario.", false], ["B", "Porque obliga a la autoridad ambiental a aprobar la licencia sin condiciones.", "Un dato sobre disponibilidad de lotes no obliga a ninguna autoridad a aprobar una licencia.", false], ["C", "Porque, sin otros lotes grandes en el perímetro urbano, negar la licencia podría dejar sin atender parte del déficit de vivienda.", "El dato de planeación conecta la decisión ambiental con la dimensión social de la vivienda: rechazar el proyecto tendría un costo en el acceso a vivienda.", true], ["D", "Porque indica que la franja de 30 metros que propone la constructora es suficiente para conservar las funciones del humedal.", "Planeación no se pronuncia sobre la franja de protección.", false]]}, {"id": "CCP-326", "niv": 2, "cp": "cc_multiperspectivismo", "e": "¿Qué diferencia hay entre la propuesta de la constructora y la del colectivo de vecinos?", "f": "Texto original elaborado para este simulacro, caso del humedal y el proyecto de vivienda", "vis": "", "o": [["A", "Ambas buscan convertir el humedal en parque ecológico; la diferencia está en el ancho de la franja de protección que cada una propone.", "Solo los vecinos proponen el parque ecológico; la constructora propone construir dejando una franja de 30 metros.", false], ["B", "La constructora busca construir protegiendo solo parte del entorno del humedal; los vecinos piden protegerlo como área protegida.", "La franja de 30 metros permite construir y proteger parte del entorno; los vecinos proponen declarar el humedal área protegida y parque ecológico.", true], ["C", "Ambas propuestas impiden construir viviendas junto al humedal, aunque una lo hace por razones ambientales y la otra por razones de costos.", "La constructora propone construir junto al humedal, dejando una franja de 30 metros; ninguna propuesta se basa en costos.", false], ["D", "Ambas propuestas buscan aumentar el número de viviendas de interés social, aunque proponen hacerlo en lugares distintos de la ciudad.", "Ninguna de las dos se refiere a ampliar la vivienda de interés social ni a otros lugares.", false]]}, {"id": "CCP-327", "niv": 2, "cp": "cc_sistemico", "e": "Para evaluar si la franja de protección que propone la constructora es una solución adecuada, la información más pertinente sería", "f": "Texto original elaborado para este simulacro, caso del humedal y el proyecto de vivienda", "vis": "", "o": [["A", "cuántos miembros tiene el colectivo de vecinos.", "El tamaño del colectivo no informa sobre el efecto ambiental de la franja.", false], ["B", "cuántas de las 1.200 viviendas del proyecto serán de interés social y cuántas se venderán a precio comercial.", "Es un dato sobre el proyecto de vivienda, no sobre la eficacia de la franja de protección.", false], ["C", "si una franja de 30 metros conserva la capacidad del humedal para almacenar agua en las lluvias.", "El problema ambiental señalado es la función del humedal como regulador del agua; la franja será adecuada si conserva esa función.", true], ["D", "cuál será el precio de venta de las viviendas.", "El precio no dice nada sobre la protección del humedal.", false]]}]}, {"comp": "competencias_ciudadanas", "sim": "pro-3", "ind": "Trabajo en casa en una entidad pública", "tt": "", "texto": "Una entidad pública evalúa si mantiene el trabajo en casa dos días por semana para sus 300 empleados.\n\n– Jefa de talento humano: «Desde que empezamos con esta modalidad, las incapacidades bajaron un 15 % y el gasto en servicios públicos de la sede se redujo».\n\n– Coordinador de atención al ciudadano: «Los usuarios se quejan de que no encuentran en la sede a los funcionarios que necesitan. Las quejas por demoras aumentaron».\n\n– Sindicato de empleados: «El trabajo en casa le ahorra a cada empleado unas dos horas diarias de transporte. Además, permite cuidar a hijos y familiares».\n\n– Comerciantes de los alrededores de la sede: «Los días en que los funcionarios no van, nuestras ventas de almuerzos caen a la mitad».", "vis": "", "items": [{"id": "CCP-328", "niv": 1, "cp": "cc_multiperspectivismo", "e": "El coordinador de atención al ciudadano evalúa el trabajo en casa desde el punto de vista de", "f": "Texto original elaborado para este simulacro, caso del trabajo en casa en una entidad pública, intervención del coordinador de atención al ciudadano", "vis": "", "o": [["A", "los usuarios que necesitan ser atendidos en la sede.", "Su intervención se refiere a las quejas de los usuarios que no encuentran a los funcionarios.", true], ["B", "las ventas de los negocios cercanos a la sede.", "Ese aspecto lo mencionan los comerciantes.", false], ["C", "el ahorro en servicios públicos que ha tenido la entidad desde que comenzó la modalidad de trabajo en casa.", "Ese aspecto lo menciona la jefa de talento humano.", false], ["D", "el tiempo que los empleados gastan en transporte.", "Ese aspecto lo menciona el sindicato.", false]]}, {"id": "CCP-329", "niv": 2, "cp": "cc_multiperspectivismo", "e": "¿Qué medida atendería tanto la preocupación del coordinador como la del sindicato?", "f": "Texto original elaborado para este simulacro, caso del trabajo en casa en una entidad pública", "vis": "", "o": [["A", "Mantener el trabajo en casa solo para quienes tengan hijos o familiares a cargo, y exigir presencialidad a los demás.", "Parece conciliadora, pero no asegura que haya funcionarios de cada área en la sede, que es lo que reclama el coordinador, y deja sin el ahorro de transporte a la mayoría, como defiende el sindicato.", false], ["B", "Mantener el trabajo en casa, con turnos para que en la sede siempre haya funcionarios de cada área de atención.", "Conserva los beneficios que defiende el sindicato y asegura la atención presencial que reclaman los usuarios.", true], ["C", "Mantener el trabajo en casa dos días y, en esos días, cerrar la sede y atender a los usuarios por correo.", "Conserva el beneficio para los empleados, pero agrava la queja del coordinador: los usuarios seguirían sin encontrar funcionarios en la sede.", false], ["D", "Eliminar el trabajo en casa y, a cambio, reconocer a los empleados un auxilio de transporte.", "Atiende al coordinador, pero no al sindicato: un auxilio no devuelve las dos horas diarias ni la posibilidad de cuidar a hijos y familiares.", false]]}, {"id": "CCP-330", "niv": 3, "cp": "cc_argumentacion", "e": "La jefa de talento humano atribuye al trabajo en casa la reducción de las incapacidades. ¿Qué información haría falta para fortalecer esa conclusión?", "f": "Texto original elaborado para este simulacro, caso del trabajo en casa en una entidad pública, intervención de la jefa de talento humano", "vis": "", "o": [["A", "Cuántos empleados están afiliados al sindicato.", "No tiene relación con la causa de la reducción de las incapacidades.", false], ["B", "Cuántos almuerzos venden los comerciantes los días de trabajo en casa.", "Es un dato sobre los comerciantes, no sobre las causas de las incapacidades.", false], ["C", "Cuántas quejas por demoras en la atención ha recibido la entidad desde que comenzó la modalidad de trabajo en casa dos días por semana.", "Es un dato sobre la atención al ciudadano, no sobre las incapacidades.", false], ["D", "Si en ese periodo hubo otros cambios que pudieran reducir las incapacidades, como el fin de una temporada de gripa.", "Para atribuir la reducción al trabajo en casa hay que descartar otras explicaciones que coincidieron en el tiempo.", true]]}, {"id": "CCP-331", "niv": 3, "cp": "cc_multiperspectivismo", "e": "¿Por qué los comerciantes y el sindicato valoran de manera distinta el trabajo en casa?", "f": "Texto original elaborado para este simulacro, caso del trabajo en casa en una entidad pública", "vis": "", "o": [["A", "Porque ambos quieren eliminar el trabajo en casa.", "El sindicato defiende el trabajo en casa.", false], ["B", "Porque el sindicato se preocupa por los usuarios de la sede y los comerciantes, por sus propios empleados.", "El sindicato representa a los empleados de la entidad, no a los usuarios, y los comerciantes hablan de sus ventas.", false], ["C", "Porque para los empleados significa ahorro de tiempo y posibilidad de cuidar a otros, y para los comerciantes, menos clientes.", "El lugar que ocupa cada actor determina cómo lo afecta la medida: beneficia a los empleados y reduce las ventas de los negocios cercanos.", true], ["D", "Porque los comerciantes calculan sus pérdidas con datos de ventas, mientras que el sindicato no presenta cifras.", "Falso y además irrelevante: el sindicato sí da una cifra (dos horas diarias de transporte), y la diferencia de valoración se explica por cómo la medida afecta a cada actor.", false]]}]}, {"comp": "competencias_ciudadanas", "sim": "pro-3", "ind": "Prohibición de la venta de pólvora", "tt": "", "texto": "Cada diciembre, el hospital de un municipio atiende a niños y adultos quemados con pólvora. El año pasado hubo 23 casos, 9 de ellos de menores de edad. El alcalde propone prohibir la venta de pólvora a particulares y reemplazar la tradición por un espectáculo de luces organizado por la alcaldía.\n\nUna familia que fabrica artículos pirotécnicos desde hace tres generaciones advierte que 40 personas del municipio viven de ese oficio y que la prohibición podría llevar la venta a la clandestinidad, donde los productos son menos seguros.\n\nUn concejal afirma: «Todo el que compra pólvora es un irresponsable que no quiere a sus hijos».\n\nLa directora del hospital señala que en los municipios vecinos donde se prohibió la venta a particulares, los casos de quemados disminuyeron, aunque no desaparecieron.", "vis": "", "items": [{"id": "CCP-332", "niv": 1, "cp": "cc_argumentacion", "e": "La afirmación del concejal es problemática porque", "f": "Texto original elaborado para este simulacro, caso de la pólvora en diciembre, intervención del concejal", "vis": "", "o": [["A", "presenta cifras falsas sobre el número de personas quemadas con pólvora en el municipio durante el último diciembre.", "El concejal no presenta ninguna cifra.", false], ["B", "generaliza un juicio negativo sobre todos los compradores de pólvora sin considerar sus razones ni circunstancias.", "Atribuye a todas las personas que compran pólvora irresponsabilidad y falta de afecto por sus hijos: es una generalización que expresa un prejuicio.", true], ["C", "defiende la tradición de la pólvora en diciembre.", "El concejal no defiende la tradición; critica a quienes compran pólvora.", false], ["D", "se basa en lo ocurrido en los municipios vecinos.", "La experiencia de los municipios vecinos la menciona la directora del hospital.", false]]}, {"id": "CCP-333", "niv": 2, "cp": "cc_argumentacion", "e": "¿Qué conclusión se apoya mejor en lo que señala la directora del hospital?", "f": "Texto original elaborado para este simulacro, caso de la pólvora en diciembre, intervención de la directora del hospital", "vis": "", "o": [["A", "La prohibición redujo los casos en los municipios vecinos, pero no tendría efecto en este municipio.", "Nada en lo que dice la directora permite concluir que la medida no funcionaría en este municipio.", false], ["B", "Prohibir la venta a particulares no reduce los casos de quemados.", "Contradice a la directora: los casos disminuyeron.", false], ["C", "Prohibir la venta a particulares basta para que no se vuelvan a presentar casos de quemados en el municipio.", "Contradice a la directora: los casos no desaparecieron.", false], ["D", "Prohibir la venta a particulares puede reducir los casos de quemados, aunque no basta para eliminarlos.", "Según la directora, en los municipios vecinos los casos «disminuyeron, aunque no desaparecieron».", true]]}, {"id": "CCP-334", "niv": 1, "cp": "cc_sistemico", "e": "La adverten
