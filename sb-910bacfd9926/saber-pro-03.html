<!doctype html>
<html lang="es">
<head>

<title>Simulacro 3 · Saber Pro</title>
<style>
:root{--bg:#f7f5f2;--card:#fff;--ink:#1d2433;--mute:#5a6478;--line:#e0dbd4;--pri:#7a2e0b;--pri2:#b0501c;--ok:#0d6b3a;--okbg:#e6f4ec;--no:#9b1c1c;--nobg:#fbeaea;--sel:#f8ece4}
@media (prefers-color-scheme: dark){:root{--bg:#14110f;--card:#1f1a17;--ink:#ece6e1;--mute:#a69c94;--line:#3a322c;--pri:#f0a47a;--pri2:#f5bb98;--ok:#7fd3a3;--okbg:#16301f;--no:#f2a3a3;--nobg:#3a1c1c;--sel:#3a2a20}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overflow-wrap:anywhere}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px}
.hwrap{max-width:860px;margin:0 auto;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;justify-content:space-between}
h1{font-size:17px;margin:0;color:var(--pri)}
h2{color:var(--pri)}
.stat{font-size:14px;color:var(--mute)}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--pri)}
.timer.low{color:var(--no)}
main{max-width:860px;margin:0 auto;padding:16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin:0 0 16px}
.mod{background:var(--pri);color:var(--card);border-radius:10px;padding:10px 14px;margin:28px 0 6px;font-weight:700;font-size:18px}
.inst{font-size:13px;font-weight:700;color:var(--pri);text-transform:uppercase;letter-spacing:.03em;margin:18px 0 4px}
.caso{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--pri);border-radius:10px;padding:14px 16px;margin:10px 0}
.tag{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--pri);font-weight:700}
.caso p{margin:6px 0 0;white-space:pre-line}
.item{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0}
.enun{margin:0 0 8px;white-space:pre-line}
.n{font-weight:700;color:var(--pri)}
.niv{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-right:4px;white-space:nowrap}
.op{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:6px 0;cursor:pointer;background:transparent;width:100%;text-align:left;color:inherit;font:inherit}
.ops8{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.ops8 .op{margin:0}
.op:hover{border-color:var(--pri2)}
.op .l{font-weight:700;min-width:20px}
.op.sel{background:var(--sel);border-color:var(--pri2)}
.op.ok{background:var(--okbg);border-color:var(--ok)}
.op.no{background:var(--nobg);border-color:var(--no)}
.op[disabled]{cursor:default}
.just{font-size:14px;margin:8px 0 0;padding:8px 10px;border-top:1px dashed var(--line)}
.just div{margin:4px 0}
.just .okt{color:var(--ok);font-weight:700}
.just .not{color:var(--no);font-weight:700}
.src{font-size:13px;color:var(--mute);margin-top:6px}
button.btn{background:var(--pri);color:var(--card);border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer}
button.btn.sec{background:transparent;color:var(--pri);border:1px solid var(--pri)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
select{font:inherit;padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);max-width:100%}
table{border-collapse:collapse;width:100%;font-size:15px}
td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.sub td{font-size:13px;color:var(--mute);padding-left:22px}
.vt{width:auto;max-width:100%;margin:10px 0;font-size:14px;display:block;overflow-x:auto}
.vt caption{text-align:left;font-weight:700;padding-bottom:4px}
.vt th,.vt td{border:1px solid var(--line);padding:4px 8px}
.vt th{background:var(--sel)}
.vnota{font-size:12px;color:var(--mute)}
.vfig{margin:10px 0}
.vfig svg{width:100%;max-width:560px;height:auto;border-radius:6px;border:1px solid var(--line);background:#fff}
.big{font-size:40px;font-weight:800;color:var(--pri);line-height:1.1}
.aviso{font-size:13px;color:var(--mute)}
.hide{display:none !important}
.res-ok{color:var(--ok);font-weight:700}.res-no{color:var(--no);font-weight:700}
textarea{width:100%;min-height:320px;font:inherit;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);resize:vertical}
.chk label{display:flex;gap:8px;align-items:flex-start;margin:6px 0;font-size:15px}
.chk input{margin-top:4px;width:18px;height:18px;flex:none}
.modelo{white-space:pre-line;background:var(--bg);border-radius:8px;padding:10px 12px;margin:6px 0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal .panel{max-width:420px}
.nav{padding:6px 0;display:flex;gap:6px;flex-wrap:wrap}
.nav a{font-size:13px;color:var(--pri);border:1px solid var(--line);border-radius:999px;padding:3px 10px;text-decoration:none;background:var(--card)}
footer{max-width:860px;margin:0 auto;padding:8px 16px 40px;font-size:12px;color:var(--mute)}
</style>
</head>

<script>
const DATA = [{"comp": "lectura_critica", "sim": "pro-3", "ind": "Cuento: las cartas dirigidas a la antigua inquilina", "tt": "Texto literario", "texto": "Durante el primer mes en el apartamento, Inés recibió tres cartas dirigidas a Teresa Valbuena. Venían sin remitente, escritas a mano, con estampillas de un pueblo cuyo nombre no encontró en ningún mapa. El portero le dijo que la señora Valbuena había vivido allí casi treinta años y que se había ido «a donde una hija», sin dejar dirección.\n\nInés guardó las cartas en un cajón. A la cuarta, la curiosidad pudo más y abrió una. La letra era temblorosa y amable. Quien escribía hablaba de la cosecha de mora, de una vaca que se había escapado dos veces, de un vecino que por fin había arreglado el puente. Al final decía: «No me contestes si no quieres. Me basta con saber que alguien las lee».\n\nInés se quedó mucho rato con el papel en la mano. Llevaba dos años en la ciudad y no había recibido una sola carta; los mensajes de su familia llegaban al celular, breves, a veces con fotos de un almuerzo al que ella no había ido.\n\nEsa noche escribió una respuesta. No fingió ser Teresa: explicó que Teresa ya no vivía allí y que ella, Inés, había abierto la carta sin permiso. Pidió disculpas. Después, casi sin darse cuenta, contó que a su ventana le daba el sol solo una hora por la tarde, que había aprendido a cocinar lentejas y que a veces extrañaba el ruido de los gallos.\n\nComo remitente escribió la dirección del apartamento. La echó al correo con la sensación de estar lanzando una botella al mar.\n\nPasaron cinco semanas. Inés ya casi lo había olvidado cuando el portero le entregó un sobre con la misma letra temblorosa. Esta vez estaba dirigido a ella.\n\n«Querida Inés —decía—: Teresa era mi hermana, y no sé si ya la perdí. Usted no tenía por qué contestarme. Pero contestó. Le cuento que el puente se volvió a caer».\n\nInés se rio sola en la cocina. Luego buscó papel, porque había que preguntar por la vaca.", "vis": "", "items": [{"id": "LCP-171", "niv": 1, "cp": "lc_local", "e": "Según la última carta, ¿quién era Teresa Valbuena?", "f": "Texto original elaborado para este simulacro, carta final", "vis": "", "o": [["A", "La hermana de quien escribía las cartas.", "La carta dice: «Teresa era mi hermana, y no sé si ya la perdí».", true], ["B", "Una vecina del pueblo que había arreglado el puente.", "Quien arregló el puente fue «un vecino» del pueblo, no Teresa.", false], ["C", "La hija de la mujer que vivía en el pueblo y cuidaba la vaca.", "El portero menciona que Teresa se fue «a donde una hija», es decir, que Teresa tenía una hija; no que fuera hija de quien escribía.", false], ["D", "La dueña del edificio donde trabaja el portero.", "El texto dice que Teresa vivió allí casi treinta años, no que fuera dueña del edificio.", false]]}, {"id": "LCP-172", "niv": 2, "cp": "lc_global", "e": "¿Qué motiva a Inés a responder la carta?", "f": "Texto original elaborado para este simulacro, párrafos 3 y 4", "vis": "", "o": [["A", "El portero le pide que avise a quien escribe que Teresa ya no vive allí.", "El portero solo le cuenta que Teresa se fue; no le pide nada.", false], ["B", "Quiere hacerse pasar por Teresa para que la autora de las cartas le siga enviando noticias del pueblo.", "El texto aclara: «No fingió ser Teresa».", false], ["C", "Necesita averiguar la nueva dirección de Teresa para entregarle sus cartas.", "Inés no pregunta por la dirección de Teresa; cuenta cosas de su propia vida.", false], ["D", "La carta le hace sentir una cercanía que echa de menos desde que vive en la ciudad.", "Tras leerla, el relato contrasta la carta con los mensajes breves de su familia y con dos años sin recibir cartas; luego Inés escribe y cuenta detalles íntimos de su vida.", true]]}, {"id": "LCP-173", "niv": 3, "cp": "lc_global", "e": "La frase final, «Luego buscó papel, porque había que preguntar por la vaca», sugiere que Inés", "f": "Texto original elaborado para este simulacro, párrafos 2 y final", "vis": "", "o": [["A", "sigue sin comprender por qué le escriben, pues las cartas eran para otra persona.", "La última carta va dirigida a Inés y ella reacciona con alegría; no hay confusión.", false], ["B", "ha comenzado una correspondencia propia con la autora de las cartas y se interesa por su vida cotidiana.", "La nueva carta ya va dirigida a ella, y Inés se dispone a contestar preguntando por un detalle cotidiano (la vaca que se escapaba): la relación continúa por cuenta propia.", true], ["C", "quiere ofrecer su ayuda para encontrar la vaca que se había escapado.", "Es una lectura literal; la pregunta por la vaca muestra interés y continuidad en la conversación.", false], ["D", "planea viajar al pueblo para conocer en persona a la autora de las cartas y ayudarle con la cosecha de mora.", "El texto no menciona ningún viaje; Inés busca papel para escribir.", false]]}, {"id": "LCP-174", "niv": 1, "cp": "lc_local", "e": "En su respuesta, Inés", "f": "Texto original elaborado para este simulacro, párrafo 4", "vis": "", "o": [["A", "pidió que dejaran de enviar cartas a esa dirección.", "Inés no pide que dejen de escribir; al contrario, cuenta cosas de su vida.", false], ["B", "se presentó como Teresa Valbuena para no preocupar ni entristecer a la persona que le escribía desde el pueblo.", "El texto dice expresamente: «No fingió ser Teresa».", false], ["C", "aclaró que la destinataria se había mudado y admitió que había leído la carta sin estar autorizada.", "El párrafo 4 dice que explicó que Teresa ya no vivía allí, que había abierto la carta sin permiso y que pidió disculpas.", true], ["D", "envió la dirección del lugar adonde se había mudado Teresa.", "Teresa se fue «sin dejar dirección»; Inés no podía enviarla.", false]]}, {"id": "LCP-175", "niv": 3, "cp": "lc_reflexion", "e": "Al contrastar las cartas escritas a mano con los mensajes «breves» que Inés recibe en el celular, el relato sugiere que", "f": "Texto original elaborado para este simulacro, párrafos 2, 3 y 4", "vis": "", "o": [["A", "una comunicación pausada y atenta puede crear una cercanía que los mensajes rápidos no siempre logran.", "Las cartas, lentas y llenas de detalles, conmueven a Inés y la llevan a abrirse, mientras los mensajes breves la dejan al margen («un almuerzo al que ella no había ido»).", true], ["B", "Inés rechaza la tecnología y quiere regresar a vivir en el campo.", "Extrañar el ruido de los gallos no equivale a rechazar la tecnología ni a querer regresar; es una sobreinterpretación.", false], ["C", "en los pueblos se escriben cartas porque sus habitantes no tienen acceso a teléfonos celulares ni a internet.", "El relato no da ninguna razón tecnológica para el uso de cartas en el pueblo.", false], ["D", "la familia de Inés no se interesa por ella y por eso casi no le escribe.", "El texto dice que los mensajes llegan, aunque breves; no afirma desinterés de la familia.", false]]}]}, {"comp": "lectura_critica", "sim": "pro-3", "ind": "Ensayo sobre la nostalgia y la memoria selectiva", "tt": "Texto informativo", "texto": "(1) La palabra «nostalgia» se inventó en 1688, cuando un estudiante de medicina suizo unió dos voces griegas —regreso y dolor— para nombrar una enfermedad: la que padecían los soldados y los jóvenes que vivían lejos de su tierra. Durante mucho tiempo se la trató como un mal que había que curar.\n\n(2) Hoy la palabra ha cambiado de sentido. Ya no designa sobre todo la añoranza de un lugar, sino la de un tiempo, y ha dejado de ser una enfermedad para convertirse en un producto. Se venden discos con sonido «como los de antes», series ambientadas en la década en que crecieron sus espectadores, dulces cuyo principal ingrediente parece ser el recuerdo.\n\n(3) Sería fácil burlarse de esta industria, pero la nostalgia no es en sí misma un error. Recordar con cariño el pasado puede dar continuidad a una vida que cambia demasiado rápido y ayudar a reconocer lo que valía la pena conservar. El problema empieza cuando el recuerdo se vuelve selectivo hasta la falsificación: cuando el pasado aparece sin enfermedades, sin censura, sin las injusticias que sus contemporáneos sí padecieron.\n\n(4) Esa versión depurada del pasado tiene consecuencias que van más allá del gusto personal. Quien cree que «antes todo era mejor» tiende a ver cualquier cambio como una pérdida, y es presa fácil de quienes prometen devolvernos a una época que nunca existió tal como la recordamos. La nostalgia, así, puede pasar de ser un sentimiento a ser un argumento, y uno bastante débil.\n\n(5) Tal vez la mejor manera de honrar el pasado sea recordarlo entero. Las canciones de nuestra infancia pueden seguir emocionándonos sin que tengamos que olvidar lo que ocurría mientras sonaban. La memoria que solo guarda lo amable no es más fiel que la que solo guarda lo terrible: es simplemente otra forma de olvido.", "vis": "", "items": [{"id": "LCP-176", "niv": 1, "cp": "lc_local", "e": "Según el párrafo 1, en su origen la palabra «nostalgia» designaba", "f": "Texto original elaborado para este simulacro, párrafo 1", "vis": "", "o": [["A", "un producto comercial dirigido a los estudiantes de medicina.", "La idea de producto corresponde al presente (párrafo 2); el estudiante de medicina fue quien creó la palabra.", false], ["B", "un tipo de canción popular que entonaban los soldados suizos cuando estaban lejos de casa.", "El texto no relaciona el origen de la palabra con canciones; la creó un estudiante de medicina para nombrar una enfermedad.", false], ["C", "la añoranza de una época pasada que se recuerda con cariño.", "Ese es el sentido actual que describe el párrafo 2, no el original.", false], ["D", "un mal que aquejaba a quienes se encontraban lejos de su país de origen.", "El párrafo 1 dice que se creó para nombrar «una enfermedad: la que padecían los soldados y los jóvenes que vivían lejos de su tierra».", true]]}, {"id": "LCP-177", "niv": 2, "cp": "lc_global", "e": "De acuerdo con los párrafos 1 y 2, el cambio de sentido de la palabra «nostalgia» consiste en que", "f": "Texto original elaborado para este simulacro, párrafos 1 y 2", "vis": "", "o": [["A", "dejó de usarse con su significado médico por decisión de la industria del entretenimiento.", "El texto no atribuye a la industria ninguna decisión sobre el uso médico; dice que la nostalgia se convirtió en producto.", false], ["B", "pasó a referirse sobre todo a los soldados que regresan de la guerra.", "Los soldados aparecen en el sentido original; el sentido actual se refiere a la añoranza de un tiempo.", false], ["C", "dejó de nombrar sobre todo la añoranza de un lugar para nombrar la de un tiempo, y pasó de enfermedad a producto.", "El párrafo 2 señala ambos cambios: de lugar a tiempo y de «enfermedad» a «producto», frente al sentido original del párrafo 1.", true], ["D", "dejó de considerarse una enfermedad para entenderse como una emoción pasajera y sin consecuencias.", "El párrafo 2 dice que pasó de enfermedad a producto; el texto no la describe como emoción pasajera y sin consecuencias.", false]]}, {"id": "LCP-178", "niv": 3, "cp": "lc_global", "e": "¿Cuál es la tesis del texto?", "f": "Texto original elaborado para este simulacro, párrafos 3, 4 y 5", "vis": "", "o": [["A", "El pasado fue, en general, mejor que el presente, aunque haya tenido algunas injusticias.", "El autor critica justamente la creencia de que «antes todo era mejor» (párrafo 4).", false], ["B", "Recordar el pasado es valioso, siempre que no se lo falsee borrando lo que en él hubo de injusto o doloroso.", "El párrafo 3 defiende el recuerdo afectuoso y critica el recuerdo «selectivo hasta la falsificación»; el párrafo 5 concluye que hay que «recordarlo entero».", true], ["C", "La nostalgia sigue siendo una enfermedad que debería tratarse como en el siglo XVII.", "El autor dice que la nostalgia «no es en sí misma un error»; no propone tratarla como enfermedad.", false], ["D", "La industria que vende discos, series y dulces nostálgicos debería desaparecer porque engaña a los consumidores.", "El autor advierte que «sería fácil burlarse de esta industria», pero no pide su desaparición ni la acusa de engañar.", false]]}, {"id": "LCP-179", "niv": 2, "cp": "lc_reflexion", "e": "En el párrafo 4, el autor dice que la nostalgia «puede pasar de ser un sentimiento a ser un argumento, y uno bastante débil». ¿Cuál de los siguientes enunciados ejemplifica ese argumento débil?", "f": "Texto original elaborado para este simulacro, párrafo 4", "vis": "", "o": [["A", "«Hace treinta años no teníamos estos problemas, así que debemos volver a hacer todo como entonces».", "Usa un pasado idealizado como razón para rechazar el cambio, justo lo que el párrafo 4 describe como un argumento débil.", true], ["B", "«Las cifras muestran que hoy viven más años las personas que hace medio siglo, gracias a los avances médicos».", "Es un argumento basado en datos, no en la idealización del pasado.", false], ["C", "«Conviene conservar algunas tradiciones si se demuestra que siguen siendo útiles».", "Propone evaluar las tradiciones según su utilidad; no se apoya en que el pasado fuera mejor.", false], ["D", "«Esta canción me recuerda mi infancia y por eso me emociona cada vez que la escucho».", "Expresa un sentimiento nostálgico, no un argumento para decidir algo; el autor considera legítimo ese sentimiento.", false]]}]}, {"comp": "lectura_critica", "sim": "pro-3", "ind": "Columna sobre la semana laboral de cuatro días", "tt": "Texto informativo", "texto": "(1) Cada vez que se publica un estudio sobre la semana laboral de cuatro días, las redes se llenan de entusiasmo. No es para menos: trabajar un día menos sin ganar menos suena a la promesa que el progreso técnico nos hizo hace un siglo y nunca terminó de cumplir.\n\n(2) Los resultados existen. En una prueba piloto realizada en el Reino Unido en 2022, la gran mayoría de las empresas participantes decidió mantener el esquema al terminar el ensayo, y muchos trabajadores reportaron menos agotamiento. Sería necio despreciar esos datos.\n\n(3) Pero conviene leerlos con cuidado. Las empresas que participaron en esa prueba se inscribieron voluntariamente; es razonable pensar que eran, de entrada, las que creían que el modelo les funcionaría. Concluir de ahí que funcionaría en cualquier empresa es como evaluar un método de estudio solo con los alumnos que ya querían aplicarlo.\n\n(4) Hay además una pregunta que el entusiasmo suele saltarse: ¿quiénes pueden trabajar cuatro días? Una oficina que reorganiza sus reuniones puede producir lo mismo en menos tiempo. Un hospital, un bus o una tienda de barrio no pueden atender en cuatro días a quienes los necesitan durante siete. Allí reducir la jornada exige contratar más personas, y alguien tiene que pagarlas.\n\n(5) Y luego están los millones de trabajadores informales que ni siquiera tienen una semana laboral que reducir. Para quien vende en la calle o trabaja por días, el debate sobre el viernes libre suena a conversación de otro planeta.\n\n(6) Nada de esto es un argumento contra la semana de cuatro días. Es un argumento contra presentarla como una solución universal. Donde funcione, bienvenida. Pero una política laboral seria tiene que empezar por los trabajadores que más horas trabajan por menos dinero, no por los que ya pueden darse el lujo de experimentar.", "vis": "", "items": [{"id": "LCP-180", "niv": 2, "cp": "lc_global", "e": "¿Cuál es la postura del columnista sobre la semana laboral de cuatro días?", "f": "Texto original elaborado para este simulacro, párrafos 2 y 6", "vis": "", "o": [["A", "La defiende y propone extenderla primero a los trabajadores informales.", "El autor dice que los informales «ni siquiera tienen una semana laboral que reducir»; no propone extenderles la semana de cuatro días.", false], ["B", "Propone aplicarla primero en hospitales y empresas de transporte.", "El párrafo 4 señala que en esos sectores es especialmente difícil reducir la jornada.", false], ["C", "Se opone a ella porque considera falsos los resultados de la prueba piloto británica.", "El autor dice: «Sería necio despreciar esos datos»; no los considera falsos.", false], ["D", "No se opone a ella, pero rechaza presentarla como una solución válida para todos.", "El párrafo 6 lo dice: «Nada de esto es un argumento contra la semana de cuatro días. Es un argumento contra presentarla como una solución universal».", true]]}, {"id": "LCP-181", "niv": 1, "cp": "lc_local", "e": "Según el párrafo 4, un hospital no puede pasar a trabajar cuatro días sin más porque", "f": "Texto original elaborado para este simulacro, párrafo 4", "vis": "", "o": [["A", "la ley prohíbe a los hospitales modificar los horarios de su personal médico y de enfermería sin autorización previa.", "El texto no menciona ninguna prohibición legal.", false], ["B", "sus usuarios lo necesitan los siete días, y reducir la jornada obligaría a contratar más personas.", "El párrafo 4 dice que esos servicios no pueden atender en cuatro días a quienes los necesitan durante siete, y que «reducir la jornada exige contratar más personas».", true], ["C", "sus trabajadores se oponen a reducir su jornada laboral.", "El texto no menciona oposición de los trabajadores.", false], ["D", "las reuniones del personal médico no se pueden reorganizar.", "La reorganización de reuniones se menciona como ejemplo de oficina, no de hospital.", false]]}, {"id": "LCP-182", "niv": 3, "cp": "lc_reflexion", "e": "En el párrafo 3, el columnista compara la prueba piloto con «evaluar un método de estudio solo con los alumnos que ya querían aplicarlo». Con esta comparación señala que", "f": "Texto original elaborado para este simulacro, párrafo 3", "vis": "", "o": [["A", "los datos de la prueba piloto fueron alterados por las empresas que participaron.", "El autor no acusa manipulación; cuestiona que los resultados se generalicen.", false], ["B", "los estudiantes aprenden mejor cuando estudian solo cuatro días a la semana.", "Es una lectura literal; el método de estudio es solo el término de la comparación.", false], ["C", "los resultados de quienes eligieron participar no pueden extenderse sin más a quienes no lo eligieron.", "Como las empresas se inscribieron voluntariamente y probablemente confiaban en el modelo, no representan a todas; generalizar sus resultados sería apresurado.", true], ["D", "las empresas participantes obtuvieron peores resultados que las empresas que decidieron no inscribirse en la prueba.", "El texto no compara resultados con empresas no participantes.", false]]}, {"id": "LCP-183", "niv": 2, "cp": "lc_reflexion", "e": "La frase final, «no por los que ya pueden darse el lujo de experimentar», revela que el columnista considera prioritario", "f": "Texto original elaborado para este simulacro, párrafo 6", "vis": "", "o": [["A", "que la semana de cuatro días se aplique por igual a trabajadores formales e informales.", "El columnista rechaza presentar los cuatro días como solución universal y señala que a los informales esa medida no les llega.", false], ["B", "atender primero a los trabajadores en condiciones más precarias.", "El autor pide empezar «por los trabajadores que más horas trabajan por menos dinero»; la frase final expresa ese criterio de prioridad.", true], ["C", "esperar nuevos estudios antes de discutir cambios en la política laboral.", "El texto no pide aplazar la discusión; plantea por dónde debería empezar una política laboral seria.", false], ["D", "prohibir que las empresas con mayores recursos hagan experimentos laborales.", "El autor dice «Donde funcione, bienvenida»; no propone prohibir los experimentos.", false]]}]}, {"comp": "lectura_critica", "sim": "pro-3", "ind": "Caricatura sobre las encuestas", "tt": "Caricatura o cómic", "texto": "Caricatura de dos viñetas.\n\nViñeta 1: A la salida de un supermercado, un encuestador con chaleco y tableta se acerca a un hombre cargado de bolsas. El encuestador pregunta: «Buenas tardes. ¿Usted responde encuestas?». El hombre, sin detenerse, contesta: «Nunca».\n\nViñeta 2: El hombre ya se ha ido. El encuestador, satisfecho, teclea en su tableta. En la pantalla se lee: «Resultado del estudio: el 100 % de los ciudadanos consultados responde encuestas».", "vis": "", "items": [{"id": "LCP-184", "niv": 2, "cp": "lc_global", "e": "La caricatura resulta humorística principalmente porque", "f": "Texto original elaborado para este simulacro, viñetas 1 y 2", "vis": "", "o": [["A", "el hombre se niega a decir qué productos compró en el supermercado.", "La pregunta no trata sobre las compras.", false], ["B", "la tableta del encuestador muestra un resultado por un error técnico.", "No hay indicio de falla técnica: el resultado lo teclea el propio encuestador.", false], ["C", "al contestar «Nunca», el hombre está respondiendo justamente la encuesta que dice no responder.", "La respuesta del hombre contradice su contenido: con ella participa en la encuesta. Por eso el encuestador registra que el 100 % responde encuestas.", true], ["D", "el encuestador se queda sin respuesta, porque el hombre sigue de largo sin detenerse a contestar.", "El hombre no se detiene, pero sí contesta («Nunca»); el chiste se basa en esa respuesta.", false]]}, {"id": "LCP-185", "niv": 2, "cp": "lc_reflexion", "e": "Además del chiste, el resultado que registra el encuestador en la viñeta 2 permite criticar", "f": "Texto original elaborado para este simulacro, viñeta 2", "vis": "", "o": [["A", "el uso de tabletas electrónicas en lugar de formularios de papel para registrar las respuestas de las encuestas.", "La herramienta usada no es objeto de crítica en la caricatura.", false], ["B", "que los supermercados permitan hacer encuestas a la salida de sus locales.", "El lugar de la encuesta es solo el escenario.", false], ["C", "que las encuestas pregunten a las personas por sus hábitos de consumo.", "La pregunta de la encuesta no se refiere a hábitos de consumo.", false], ["D", "que se presente como conclusión general lo que se obtuvo de una sola respuesta.", "El encuestador consultó a una persona y anuncia un resultado sobre «el 100 % de los ciudadanos consultados»: la caricatura se burla de las conclusiones sacadas de muestras mínimas.", true]]}]}, {"comp": "lectura_critica", "sim": "pro-3", "ind": "Texto expositivo sobre la historia del cero", "tt": "Texto informativo", "texto": "(1) Hoy nos parece natural que exista un número para nombrar la nada, pero durante la mayor parte de la historia no fue así. Muchas civilizaciones antiguas contaban, medían y comerciaban sin un cero. Los romanos, por ejemplo, no lo necesitaban, porque su sistema de numeración no era posicional: cada símbolo tenía un valor propio (X siempre valía diez) y los números se formaban sumando o restando esos valores, como en XI, once, o IX, nueve.\n\n(2) El cero se volvió necesario con los sistemas posicionales, en los que el valor de una cifra depende del lugar que ocupa. En el número 305, el 3 vale trescientos porque está en la tercera posición; sin algo que marque que no hay decenas, se confundiría con 35. Los babilonios, que usaban un sistema posicional, empezaron a dejar un signo para indicar esos lugares vacíos. Pero aquel signo era solo un marcador: nadie sumaba ni multiplicaba con él.\n\n(3) El paso decisivo se dio en la India. En el año 628, el astrónomo Brahmagupta escribió reglas para operar con el cero como con cualquier otro número: un número menos sí mismo da cero; un número multiplicado por cero da cero. Algunas de sus reglas, como las que propuso para la división por cero, no resistieron el tiempo; pero la idea de que la nada podía tratarse como una cantidad abrió un camino nuevo.\n\n(4) Desde la India, el sistema pasó al mundo islámico, donde matemáticos como al-Juarismi lo difundieron, y de allí llegó a Europa. En 1202, Leonardo de Pisa, conocido como Fibonacci, publicó un libro que explicaba a los comerciantes las ventajas de las nueve cifras indias y el cero. La adopción fue lenta: en 1299, el gremio de cambistas de Florencia prohibió el uso de esas cifras, entre otras razones por el temor a que fueran fáciles de falsificar.\n\n(5) La historia del cero muestra que las ideas matemáticas no caen del cielo ya terminadas. Son herramientas que distintas culturas inventan, corrigen y transmiten, y cuya aceptación depende tanto de su utilidad como de la confianza que inspiran.", "vis": "", "items": [{"id": "LCP-186", "niv": 1, "cp": "lc_local", "e": "Según el párrafo 1, los romanos no necesitaban el cero porque", "f": "Texto original elaborado para este simulacro, párrafo 1", "vis": "", "o": [["A", "su sistema no asignaba valores por posición, sino que sumaba o restaba símbolos de valor propio.", "El párrafo 1 dice que el sistema romano «no era posicional»: cada símbolo tenía un valor propio y los números se formaban sumando o restando (XI, IX).", true], ["B", "Brahmagupta todavía no había escrito sus reglas para operar con él.", "El texto explica la razón por el tipo de sistema, no por una cronología.", false], ["C", "no realizaban operaciones comerciales ni mediciones.", "El texto afirma que muchas civilizaciones antiguas «contaban, medían y comerciaban sin un cero».", false], ["D", "habían adoptado el signo de los babilonios para marcar los lugares vacíos en sus números.", "El texto no dice que los romanos usaran el signo babilonio.", false]]}, {"id": "LCP-187", "niv": 2, "cp": "lc_local", "e": "Según el texto, ¿en qué se diferencia el signo de los babilonios del cero de Brahmagupta?", "f": "Texto original elaborado para este simulacro, párrafos 2 y 3", "vis": "", "o": [["A", "El babilonio solo marcaba un lugar vacío; Brahmagupta trató el cero como un número para operar.", "El párrafo 2 dice que el signo babilonio «era solo un marcador: nadie sumaba ni multiplicaba con él»; el párrafo 3, que Brahmagupta escribió reglas para operar con el cero «como con cualquier otro número».", true], ["B", "El babilonio se usaba en un sistema de valor fijo, y el de Brahmagupta en un sistema posicional.", "El texto dice que los babilonios sí usaban un sistema posicional.", false], ["C", "El babilonio llegó a Europa en 1202, y el de Brahmagupta en 1299.", "Confunde las fechas: 1202 es el libro de Fibonacci y 1299 la prohibición del gremio de cambistas de Florencia.", false], ["D", "El babilonio servía para dividir por cero, mientras que el de Brahmagupta no lo permitía.", "El texto no atribuye operaciones al signo babilonio; las reglas de división por cero fueron de Brahmagupta.", false]]}, {"id": "LCP-188", "niv": 3, "cp": "lc_global", "e": "¿Qué relación hay entre la prohibición de Florencia, mencionada en el párrafo 4, y la conclusión del párrafo 5?", "f": "Texto original elaborado para este simulacro, párrafos 4 y 5", "vis": "", "o": [["A", "La prohibición contradice la conclusión, porque muestra que en Europa el cero se rechazó por inútil.", "Florencia prohibió las cifras por temor a la falsificación, no por inútiles; y el texto habla de una adopción lenta, no de un rechazo.", false], ["B", "La prohibición es un dato aislado que no se relaciona con las ideas del último párrafo.", "El dato ejemplifica directamente la idea de «confianza» del párrafo 5.", false], ["C", "La prohibición demuestra que el cero no era útil para los comerciantes europeos.", "El texto dice que Fibonacci explicaba sus ventajas a los comerciantes; la prohibición no se debió a falta de utilidad, sino a desconfianza.", false], ["D", "La prohibición ejemplifica que una herramienta útil puede tardar en aceptarse si despierta desconfianza.", "Florencia prohibió las cifras por temor a falsificaciones; el párrafo 5 concluye que la aceptación depende «tanto de su utilidad como de la confianza que inspiran».", true]]}, {"id": "LCP-189", "niv": 2, "cp": "lc_reflexion", "e": "Cuando el autor afirma que algunas reglas de Brahmagupta «no resistieron el tiempo», pero que su idea «abrió un camino nuevo», busca", "f": "Texto original elaborado para este simulacro, párrafo 3", "vis": "", "o": [["A", "sugerir que los babilonios ya habían resuelto el problema de la división por cero.", "El texto dice que con el signo babilonio nadie operaba.", false], ["B", "explicar que la división por cero fue la regla que Brahmagupta formuló con mayor acierto.", "Es al revés: el texto pone la división por cero como ejemplo de las reglas que «no resistieron el tiempo».", false], ["C", "reconocer los límites de su aporte sin restarle importancia histórica.", "La frase admite errores puntuales (la división por cero) y, a la vez, destaca la novedad de tratar la nada como cantidad: es una valoración matizada.", true], ["D", "desacreditar el aporte de la India frente al de los matemáticos europeos.", "El autor llama a ese aporte «el paso decisivo»; no lo desacredita.", false]]}]}, {"comp": "lectura_critica", "sim": "pro-3", "ind": "Ensayo sobre la ciencia ciudadana", "tt": "Texto informativo", "texto": "(1) Durante siglos, la ciencia fue cosa de especialistas: personas formadas durante años, con instrumentos costosos y un lenguaje propio. Hoy, sin embargo, miles de aficionados cuentan aves, fotografían insectos, miden la lluvia en sus patios o clasifican imágenes de galaxias desde el computador de su casa. A esta participación se la llama «ciencia ciudadana».\n\n(2) Sus defensores destacan, ante todo, la escala. Ningún equipo de investigación, por grande que sea, puede observar al mismo tiempo cientos de humedales o registrar durante décadas la fecha en que florecen los árboles de una región. Miles de voluntarios sí pueden. Gracias a ellos se han documentado cambios en las rutas migratorias de algunas especies que habrían pasado inadvertidos.\n\n(3) Los escépticos señalan un problema real: la calidad de los datos. Un aficionado puede confundir dos especies parecidas o anotar mal una fecha. Además, los voluntarios tienden a observar donde viven o donde les resulta agradable ir, de modo que las ciudades y los parques quedan sobrerrepresentados y las zonas remotas casi no aparecen.\n\n(4) Estas objeciones no invalidan la ciencia ciudadana; obligan a diseñarla bien. Muchos proyectos piden fotografías que luego revisan expertos, comparan las observaciones de varios voluntarios en un mismo lugar o usan métodos estadísticos para corregir el exceso de registros en ciertas zonas. Un dato aislado puede ser poco confiable; miles de datos revisados con método pueden ser muy valiosos.\n\n(5) Hay, además, un beneficio que no aparece en las publicaciones científicas. Quien pasa una mañana contando colibríes aprende a mirar de otra manera el lugar donde vive. Empieza a hacerse preguntas, a notar ausencias, a entender por qué un humedal no es un simple «potrero mojado». La ciencia ciudadana produce datos, pero también produce ciudadanos más atentos a su entorno.\n\n(6) Tal vez por eso su mayor riesgo no sea el error de los aficionados, sino la tentación de usarlos como mano de obra gratuita, sin devolverles los resultados ni reconocer su aporte. Una ciencia que pide la colaboración del público le debe, al menos, una explicación de lo que hizo con ella.", "vis": "", "items": [{"id": "LCP-190", "niv": 2, "cp": "lc_global", "e": "¿Qué relación hay entre el párrafo 3 y el párrafo 4?", "f": "Texto original elaborado para este simulacro, párrafos 3 y 4", "vis": "", "o": [["A", "El párrafo 4 cambia de tema y pasa a describir los beneficios personales de participar.", "Los beneficios personales se tratan en el párrafo 5.", false], ["B", "El párrafo 4 responde a las objeciones del párrafo 3 mostrando cómo pueden controlarse los errores.", "El párrafo 4 empieza con «Estas objeciones no invalidan la ciencia ciudadana; obligan a diseñarla bien» y describe revisiones de expertos, comparaciones y métodos estadísticos.", true], ["C", "El párrafo 4 presenta nuevas objeciones, más graves que las del párrafo 3, contra la participación de aficionados.", "El párrafo 4 no añade objeciones; propone soluciones.", false], ["D", "El párrafo 4 acepta las objeciones del párrafo 3 y propone que expertos reemplacen a los voluntarios en la toma de datos.", "El autor dice que las objeciones «no invalidan» la ciencia ciudadana; propone revisar los datos de los voluntarios, no reemplazarlos.", false]]}, {"id": "LCP-191", "niv": 3, "cp": "lc_global", "e": "¿Cuál de los siguientes enunciados recoge mejor la idea global del texto?", "f": "Texto original elaborado para este simulacro, párrafos 4, 5 y 6", "vis": "", "o": [["A", "Los datos de los aficionados sirven sobre todo para educar a los participantes, más que para investigar.", "El párrafo 4 afirma que «miles de datos revisados con método pueden ser muy valiosos» para la investigación; la formación de los participantes es un beneficio adicional.", false], ["B", "Bien diseñada, la ciencia ciudadana produce datos valiosos y ciudadanos más atentos, y les debe reconocimiento a sus voluntarios.", "El texto defiende su valor si se diseña bien (párrafo 4), destaca que forma ciudadanos atentos (párrafo 5) y afirma que le debe al público una explicación de lo que hizo con su colaboración (párrafo 6).", true], ["C", "La ciencia ciudadana debería reemplazar a los equipos de investigación profesionales, porque trabaja a mayor escala.", "El texto no propone reemplazar a los profesionales; de hecho, menciona que los expertos revisan los datos.", false], ["D", "El principal beneficio de la ciencia ciudadana es que permite a las universidades ahorrar dinero en personal.", "El párrafo 6 presenta el uso de voluntarios como «mano de obra gratuita» como un riesgo, no como su beneficio principal.", false]]}, {"id": "LCP-192", "niv": 3, "cp": "lc_reflexion", "e": "Un proyecto de ciencia ciudadana concluye, solo con los registros de sus voluntarios, que cierta especie de ave casi no existe en las zonas rurales más apartadas de una región. Según lo expuesto en el párrafo 3, esta conclusión es", "f": "Texto original elaborado para este simulacro, párrafo 3", "vis": "", "o": [["A", "dudosa, porque las aves de las zonas apartadas son más difíciles de fotografiar.", "El párrafo 3 no habla de dificultades para fotografiar; explica que los voluntarios observan donde viven o les resulta agradable ir, por eso las zonas remotas casi no aparecen.", false], ["B", "segura, porque en esos proyectos los expertos revisan con cuidado las fotografías que envían los voluntarios.", "La revisión de fotografías corrige errores de identificación, pero no la falta de observaciones en ciertas zonas.", false], ["C", "dudosa, porque la escasez de registros puede deberse a que pocos voluntarios observan en esas zonas.", "El párrafo 3 advierte que «las zonas remotas casi no aparecen» en los datos; la ausencia de registros no prueba la ausencia de la especie.", true], ["D", "segura, porque se basa en miles de registros hechos por voluntarios durante varios años.", "La cantidad de registros no corrige el sesgo de lugar: si casi nadie observa en las zonas remotas, faltarán datos de allí.", false]]}, {"id": "LCP-193", "niv": 2, "cp": "lc_reflexion", "e": "En el párrafo 5, el autor escribe entre comillas la expresión «potrero mojado». Con ello busca", "f": "Texto original elaborado para este simulacro, párrafo 5", "vis": "", "o": [["A", "citar textualmente la definición que da un científico especialista en humedales en una publicación.", "No se atribuye la expresión a ningún científico; tampoco es una definición técnica.", false], ["B", "burlarse de los voluntarios que no saben reconocer un humedal.", "El tono hacia los voluntarios es positivo: la participación los vuelve más atentos.", false], ["C", "presentar la definición técnica de humedal que usan los proyectos de ciencia ciudadana.", "El autor dice que un humedal «no es» un potrero mojado; no lo define así.", false], ["D", "mostrar una forma común de ver los humedales que la experiencia de observar ayuda a superar.", "Las comillas marcan una expresión ajena y despectiva; el autor afirma que quien participa llega a entender por qué un humedal no es eso.", true]]}]}, {"comp": "lectura_critica", "sim": "pro-3", "ind": "Texto argumentativo sobre la gratuidad de los museos", "tt": "Texto informativo", "texto": "(1) Cada cierto tiempo se reabre el debate sobre si los museos públicos deberían ser gratuitos. Los argumentos a favor suelen ser de principio: el patrimonio pertenece a todos, y cobrar la entrada convierte un derecho en una mercancía. Los argumentos en contra suelen ser de bolsillo: alguien tiene que pagar la luz, los vigilantes, la restauración de las obras.\n\n(2) Ambos lados tienen razón en algo, pero discuten casi siempre sobre la pregunta equivocada. Algunos estudios sobre museos que eliminaron el cobro indican que, en los meses siguientes, las visitas aumentan. Lo que no siempre cambia es quién visita. Si quienes llegan son, en su mayoría, las mismas personas de siempre —estudiantes universitarios, turistas, profesionales que ya tenían el hábito—, la gratuidad termina siendo un subsidio para quienes podían pagar.\n\n(3) La razón es que el precio de la entrada rara vez es la única barrera. Para una familia que vive al otro extremo de la ciudad, el costo real del museo incluye dos horas de bus, el almuerzo fuera de casa y la sensación de que ese lugar «no es para gente como nosotros». Ninguna de esas barreras desaparece cuando la taquilla deja de cobrar.\n\n(4) Por eso la pregunta útil no es «¿cobrar o no cobrar?», sino «¿qué impide que ciertos públicos lleguen?». Las respuestas sugieren medidas distintas: horarios nocturnos para quienes trabajan de día, programas con los colegios de los barrios alejados, salas que expongan obras relacionadas con la historia de esas comunidades, transporte gratuito ciertos días.\n\n(5) Nada de esto excluye la gratuidad. Una entrada libre puede ser parte de una política de acceso, pero no reemplaza el resto. Un museo gratuito al que solo llegan los de siempre ha cambiado su contabilidad, no su público.", "vis": "", "items": [{"id": "LCP-194", "niv": 1, "cp": "lc_local", "e": "Según el párrafo 3, para una familia que vive lejos, el costo real de ir al museo incluye", "f": "Texto original elaborado para este simulacro, párrafo 3", "vis": "", "o": [["A", "gastos de desplazamiento y de alimentación, además de una barrera de pertenencia social.", "El párrafo 3 menciona dos horas de bus, el almuerzo fuera de casa y la sensación de que el museo «no es para gente como nosotros».", true], ["B", "el valor de la entrada, el de la visita guiada y el de los recuerdos que se venden en la tienda del museo.", "El texto no menciona visitas guiadas ni tienda; y señala que el precio de la entrada rara vez es la única barrera.", false], ["C", "la luz, los vigilantes y la restauración de las obras.", "Esos son los costos del museo que mencionan quienes se oponen a la gratuidad (párrafo 1), no los de la familia.", false], ["D", "los permisos de trabajo que deben pedir los padres para asistir en horario diurno.", "El texto propone horarios nocturnos, pero no menciona permisos de trabajo como parte del costo.", false]]}, {"id": "LCP-195", "niv": 2, "cp": "lc_global", "e": "Según el autor, discutir solo si se debe «cobrar o no cobrar» es plantear la pregunta equivocada porque", "f": "Texto original elaborado para este simulacro, párrafos 2, 3 y 4", "vis": "", "o": [["A", "los museos públicos ya son gratuitos en la mayoría de las ciudades del país.", "El texto no da información sobre cuántos museos son gratuitos.", false], ["B", "los argumentos de principio sobre el patrimonio pesan menos que los costos de funcionamiento del museo.", "El autor no jerarquiza los argumentos: dice que «ambos lados tienen razón en algo» y que la discusión se centra en una pregunta equivocada.", false], ["C", "eliminar el cobro no basta para que lleguen los públicos que enfrentan otras barreras.", "El autor explica que el precio «rara vez es la única barrera» (párrafo 3) y que la pregunta útil es qué impide que ciertos públicos lleguen (párrafo 4).", true], ["D", "cobrar la entrada es la única forma de pagar la restauración de las obras de arte.", "El texto no afirma que el cobro sea la única fuente de financiación.", false]]}, {"id": "LCP-196", "niv": 3, "cp": "lc_global", "e": "La frase final, «Un museo gratuito al que solo llegan los de siempre ha cambiado su contabilidad, no su público», significa que", "f": "Texto original elaborado para este simulacro, párrafo 5", "vis": "", "o": [["A", "la gratuidad, por sí sola, cambia las finanzas del museo, pero no amplía la diversidad de sus visitantes.", "Dejar de cobrar modifica los ingresos («contabilidad»), pero si siguen llegando las mismas personas, el objetivo de ampliar el acceso no se cumple.", true], ["B", "los museos deberían volver a cobrar la entrada para mejorar sus finanzas.", "El párrafo 5 dice que «nada de esto excluye la gratuidad»; el autor no pide volver a cobrar.", false], ["C", "un museo gratuito pierde a sus visitantes habituales y gana visitantes nuevos.", "La frase dice que siguen llegando «los de siempre».", false], ["D", "los museos gratuitos suelen tener problemas para llevar sus cuentas de manera ordenada.", "Es una lectura literal de «contabilidad»; la frase no habla de desorden contable.", false]]}, {"id": "LCP-197", "niv": 2, "cp": "lc_reflexion", "e": "En el párrafo 2, el autor afirma que la gratuidad «termina siendo un subsidio para quienes podían pagar». Esta afirmación solo es válida si", "f": "Texto original elaborado para este simulacro, párrafo 2", "vis": "", "o": [["A", "las visitas al museo disminuyen en los meses posteriores a la eliminación del cobro de la entrada.", "El mismo párrafo dice que las visitas aumentan; la afirmación no depende de una disminución.", false], ["B", "el museo cobra precios muy altos por la entrada antes de volverse gratuito.", "El nivel del precio anterior no es la condición que plantea el autor.", false], ["C", "los turistas extranjeros pagan impuestos en el país.", "El texto no relaciona el argumento con los impuestos de los turistas.", false], ["D", "el público que acude con entrada libre es, en buena parte, el que ya iba y podía costearlo.", "El autor la formula como condicional: «Si quienes llegan son, en su mayoría, las mismas personas de siempre…»; solo en ese caso la gratuidad beneficia a quienes podían pagar.", true]]}, {"id": "LCP-198", "niv": 3, "cp": "lc_reflexion", "e": "¿Cuál de las siguientes iniciativas sería más coherente con la propuesta del autor?", "f": "Texto original elaborado para este simulacro, párrafos 4 y 5", "vis": "", "o": [["A", "Un museo que elimina la taquilla y, para atraer visitantes, amplía la cafetería y la tienda sin cambiar horarios ni salas.", "Es la gratuidad sin atacar las barreras que señala el autor (transporte, horarios, sensación de no pertenecer).", false], ["B", "Un museo que abre gratis los domingos y lleva, con transporte pagado, a colegios de barrios alejados.", "Combina la gratuidad con medidas del párrafo 4 (programas con colegios lejanos, transporte), como propone el autor en el párrafo 5.", true], ["C", "Un museo que cierra sus salas de historia local para exhibir obras internacionales más conocidas y atraer turistas.", "El autor propone salas relacionadas con la historia de las comunidades; cerrarlas va en sentido contrario.", false], ["D", "Un museo que abre gratis todos los días y lanza una campaña en redes sociales para invitar a toda la ciudad.", "Aunque amplía la difusión, no ataca las barreras que señala el autor (transporte, horarios, sensación de no pertenecer); se queda en la gratuidad.", false]]}]}, {"comp": "lectura_critica", "sim": "pro-3", "ind": "Crónica sobre una plaza de mercado", "tt": "Texto informativo", "texto": "(1) A las cuatro de la mañana, la plaza de mercado todavía no huele a fruta, sino a diésel. Los camiones llegan desde tierra caliente y desde el páramo, y en la penumbra los coteros descargan bultos de cincuenta kilos sobre la espalda, con una almohadilla de costal doblada en el hombro. Nadie habla mucho a esa hora. Se oyen el motor, los números y alguna grosería que nadie se toma a pecho.\n\n(2) Doña Aurora tiene el puesto 114 desde hace treinta y un años. Vende hierbas: cilantro, poleo, ruda, toronjil, manzanilla y otras que solo reconocen los clientes viejos. Explica para qué sirve cada una con una seguridad que ningún médico le ha discutido nunca en voz alta. «Yo no receto», aclara. «Yo recomiendo. La diferencia es que si no le sirve, no me demanda».\n\n(3) A las seis llegan los dueños de restaurantes, que compran por bultos y regatean por centavos. A las ocho, las amas de casa, que compran por libras y regatean por costumbre. A las diez, los turistas, que no regatean, toman fotos y preguntan si el lulo se come con cáscara. Doña Aurora atiende a todos con la misma paciencia, pero no con el mismo precio.\n\n(4) Desde hace unos años, la plaza tiene competencia. A tres cuadras abrió un supermercado con parqueadero y aire acondicionado, y la alcaldía habla de «modernizar» el mercado, palabra que los vendedores escuchan con desconfianza. La última vez que alguien la pronunció, recuerdan, se cambiaron los techos y se subieron los arriendos de los puestos.\n\n(5) Al mediodía, cuando el movimiento afloja, doña Aurora almuerza en el puesto de al lado, donde una vecina vende caldo y sancocho. Hablan de los precios, de los hijos, de un cotero que se lesionó la espalda. Si alguien quiere entender qué es una plaza de mercado, dice ella, no tiene que venir a las diez a tomar fotos: tiene que quedarse a almorzar.", "vis": "", "items": [{"id": "LCP-199", "niv": 1, "cp": "lc_local", "e": "Según la crónica, ¿qué vende doña Aurora en su puesto?", "f": "Texto original elaborado para este simulacro, párrafo 2", "vis": "", "o": [["A", "Caldo y sancocho para los trabajadores de la plaza.", "El caldo y el sancocho los vende la vecina del puesto de al lado.", false], ["B", "Medicamentos con fórmula médica.", "Ella aclara «Yo no receto»; vende hierbas, no medicamentos.", false], ["C", "Plantas aromáticas y medicinales.", "El párrafo 2 dice que vende hierbas (cilantro, poleo, ruda, toronjil, manzanilla) y que explica «para qué sirve cada una».", true], ["D", "Frutas de tierra caliente, como el lulo, a los turistas que visitan la plaza.", "Los turistas preguntan por el lulo, pero el texto no dice que doña Aurora venda frutas.", false]]}, {"id": "LCP-200", "niv": 2, "cp": "lc_global", "e": "¿Cómo está organizada la descripción del párrafo 3?", "f": "Texto original elaborado para este simulacro, párrafo 3", "vis": "", "o": [["A", "Según la hora del día y el tipo de cliente que llega a cada hora.", "El párrafo avanza por horas (seis, ocho, diez) y asocia cada una con un tipo de cliente y su manera de comprar.", true], ["B", "De la opinión más favorable a la más crítica sobre la plaza.", "No hay una gradación de opiniones sobre la plaza.", false], ["C", "De los precios más altos a los más bajos que cobra doña Aurora a sus distintos compradores.", "El texto insinúa que los precios varían, pero no los ordena ni los menciona.", false], ["D", "Según los productos que se venden en cada sección de la plaza de mercado.", "El párrafo no recorre secciones ni productos; describe clientes.", false]]}, {"id": "LCP-201", "niv": 2, "cp": "lc_global", "e": "¿Por qué los vendedores escuchan con desconfianza la palabra «modernizar»?", "f": "Texto original elaborado para este simulacro, párrafo 4", "vis": "", "o": [["A", "Porque los techos que se cambiaron en la modernización anterior se dañaron con las lluvias.", "El texto no dice que los techos nuevos se dañaran.", false], ["B", "Porque no quieren que la plaza tenga parqueadero ni aire acondicionado como el supermercado.", "El texto no dice que rechacen esas comodidades; su desconfianza se explica por una experiencia anterior.", false], ["C", "Porque la alcaldía anunció que la plaza será reemplazada por el supermercado de la esquina.", "El texto no menciona ningún anuncio de reemplazo.", false], ["D", "Porque una renovación anterior, con techos nuevos, terminó encareciendo el arriendo de los puestos.", "El párrafo 4 dice: «La última vez que alguien la pronunció, recuerdan, se cambiaron los techos y se subieron los arriendos de los puestos».", true]]}, {"id": "LCP-202", "niv": 3, "cp": "lc_reflexion", "e": "Doña Aurora afirma que para entender una plaza de mercado no hay que «venir a las diez a tomar fotos», sino «quedarse a almorzar». Con esta afirmación, que cierra la crónica, se sugiere que", "f": "Texto original elaborado para este simulacro, párrafos 3 y 5", "vis": "", "o": [["A", "a los turistas se les debería prohibir tomar fotografías dentro de la plaza.", "Doña Aurora no pide prohibir nada; contrasta dos formas de conocer la plaza.", false], ["B", "lo esencial de la plaza está en las relaciones entre quienes trabajan en ella, más que en su imagen.", "El almuerzo descrito en el párrafo 5 es un espacio de conversación sobre precios, hijos y compañeros; frente a la mirada rápida del turista, la crónica destaca esa vida compartida.", true], ["C", "la comida que se vende en la plaza es mejor y más barata que la de los restaurantes de la ciudad.", "Es una lectura literal; la frase no compara la comida con la de otros lugares.", false], ["D", "doña Aurora prefiere atender a los turistas porque no regatean los precios.", "La frase final contrasta la visita del turista con la experiencia de quedarse; no expresa una preferencia comercial.", false]]}]}, {"comp": "lectura_critica", "sim": "pro-3", "ind": "Convocatoria de becas de movilidad con tabla de puntajes", "tt": "Texto discontinuo", "texto": "CONVOCATORIA DE BECAS DE MOVILIDAD 2027 · Fundación Puentes (entidad ficticia)\n\nObjetivo: apoyar un semestre de intercambio en una universidad de otro país.\n\nRequisitos para postularse: estar matriculado en un programa de pregrado, haber cursado al menos el 40 % del plan de estudios y tener un promedio acumulado igual o superior a 3,8 (sobre 5,0).\n\nLas postulaciones que cumplan los requisitos se califican según la tabla 1. Las becas se otorgan a los puntajes más altos hasta agotar el presupuesto. En caso de empate, se prefiere a quien haya obtenido más puntos en el criterio «Condiciones socioeconómicas».", "vis": "<table class=\"vt\"><caption>Tabla 1. Criterios de calificación<\/caption><thead><tr><th>Criterio<\/th><th>Cómo se mide<\/th><th>Puntaje máximo<\/th><\/tr><\/thead><tbody><tr><td>Promedio académico<\/td><td>3,8 a 4,1: 15 puntos · 4,2 a 4,5: 25 puntos · 4,6 a 5,0: 35 puntos<\/td><td>35<\/td><\/tr><tr><td>Nivel de la lengua del país de destino<\/td><td>Inferior a B1: 0 puntos · B1: 10 puntos · B2: 20 puntos · C1 o superior: 25 puntos<\/td><td>25<\/td><\/tr><tr><td>Condiciones socioeconómicas<\/td><td>Estrato 1 o 2: 25 puntos · Estrato 3: 15 puntos · Estrato 4 o superior: 0 puntos<\/td><td>25<\/td><\/tr><tr><td>Carta de motivación<\/td><td>Evaluada por un comité<\/td><td>15<\/td><\/tr><tr><td>Total<\/td><td><\/td><td>100<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Datos ficticios elaborados para este simulacro.<\/div>", "items": [{"id": "LCP-203", "niv": 1, "cp": "lc_local", "e": "¿Cuál de los siguientes estudiantes de pregrado NO puede postularse a la beca?", "f": "Texto original elaborado para este simulacro, requisitos de la convocatoria", "vis": "", "o": [["A", "Uno con promedio de 3,8 que ha cursado el 40 % de su carrera.", "Cumple ambos requisitos: promedio «igual o superior a 3,8» y «al menos el 40 %».", false], ["B", "Uno con promedio de 4,9 que ha cursado el 45 % de su carrera.", "Cumple ambos requisitos.", false], ["C", "Uno con promedio de 3,7 que ha cursado el 60 % de su carrera.", "Su promedio es inferior al mínimo de 3,8 exigido, aunque cumpla el avance en el plan de estudios.", true], ["D", "Uno con promedio de 4,5 que ha cursado el 70 % de su carrera.", "Cumple ambos requisitos.", false]]}, {"id": "LCP-204", "niv": 1, "cp": "lc_global", "e": "Ana y Carlos obtuvieron 80 puntos cada uno. Ana es de estrato 3 y Carlos de estrato 2. Si solo queda presupuesto para una beca, ¿quién la recibe?", "f": "Texto original elaborado para este simulacro, texto de la convocatoria y tabla 1", "vis": "", "o": [["A", "Los dos, porque obtuvieron exactamente el mismo puntaje total en la convocatoria.", "Las becas se otorgan «hasta agotar el presupuesto»; si solo queda para una, se aplica el desempate.", false], ["B", "Carlos, porque tiene más puntos en el criterio de condiciones socioeconómicas.", "Según la tabla, el estrato 2 da 25 puntos y el estrato 3 da 15; la regla de desempate prefiere a quien tenga más puntos en ese criterio.", true], ["C", "Ana, porque pertenece a un estrato más alto y puede cubrir los gastos del viaje.", "La convocatoria no da preferencia a los estratos altos; el desempate favorece a quien tiene más puntos socioeconómicos.", false], ["D", "Ninguno de los dos, porque un empate anula ambas postulaciones.", "La convocatoria prevé una regla de desempate; no anula las postulaciones.", false]]}, {"id": "LCP-205", "niv": 2, "cp": "lc_reflexion", "e": "¿Qué intención puede atribuirse a la fundación al asignar hasta 25 puntos por condiciones socioeconómicas y usarlas como criterio de desempate?", "f": "Texto original elaborado para este simulacro, texto de la convocatoria y tabla 1", "vis": "", "o": [["A", "Favorecer el acceso de estudiantes con menos recursos, sin dejar de premiar el desempeño académico.", "La tabla otorga más puntos a los estratos bajos y los prefiere en el desempate, pero mantiene el promedio como el criterio de mayor peso.", true], ["B", "Reducir el número de estudiantes que se postulan cada año, para que el comité evalúe menos cartas de motivación.", "Nada en la convocatoria indica ese propósito; el criterio no limita quién puede postularse.", false], ["C", "Excluir de la convocatoria a los estudiantes de estrato 4 o superior.", "Pueden postularse; solo reciben 0 puntos en ese criterio.", false], ["D", "Dar más peso a la situación económica que al promedio académico.", "El promedio vale hasta 35 puntos y las condiciones socioeconómicas hasta 25; el criterio académico pesa más.", false]]}]}, {"comp": "razonamiento_cuantitativo", "sim": "pro-3", "ind": "Votación de presupuesto participativo", "tt": "", "texto": "En un ejercicio de presupuesto participativo, 1.200 habitantes de una comuna votaron por uno de cuatro proyectos. Cada persona votó una sola vez. La gráfica muestra los resultados.", "vis": "<div class=\"vfig\"><svg class=\"vg\" viewBox=\"0 0 560 320\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Gráfica 1. Votos por proyecto\" font-family=\"Arial, sans-serif\" font-size=\"12\"><rect width=\"560\" height=\"320\" fill=\"#ffffff\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"13\" fill=\"#1d2433\">Gráfica 1. Votos por proyecto<\/text><line x1=\"60\" y1=\"258.0\" x2=\"540\" y2=\"258.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"262.0\" text-anchor=\"end\" fill=\"#3a4356\">0<\/text><line x1=\"60\" y1=\"213.6\" x2=\"540\" y2=\"213.6\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"217.6\" text-anchor=\"end\" fill=\"#3a4356\">100<\/text><line x1=\"60\" y1=\"169.2\" x2=\"540\" y2=\"169.2\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"173.2\" text-anchor=\"end\" fill=\"#3a4356\">200<\/text><line x1=\"60\" y1=\"124.8\" x2=\"540\" y2=\"124.8\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"128.8\" text-anchor=\"end\" fill=\"#3a4356\">300<\/text><line x1=\"60\" y1=\"80.4\" x2=\"540\" y2=\"80.4\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"84.4\" text-anchor=\"end\" fill=\"#3a4356\">400<\/text><line x1=\"60\" y1=\"36.0\" x2=\"540\" y2=\"36.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"40.0\" text-anchor=\"end\" fill=\"#3a4356\">500<\/text><line x1=\"60\" y1=\"258\" x2=\"540\" y2=\"258\" stroke=\"#3a4356\"/><line x1=\"60\" y1=\"258\" x2=\"60\" y2=\"36\" stroke=\"#3a4356\"/><text transform=\"translate(14,147.0) rotate(-90)\" text-anchor=\"middle\" fill=\"#3a4356\">Número de votos<\/text><text x=\"300.0\" y=\"312\" text-anchor=\"middle\" fill=\"#3a4356\">Proyecto<\/text><text x=\"120.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Parque<\/text><text x=\"240.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Biblioteca<\/text><text x=\"360.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Vías<\/text><text x=\"480.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Centro de salud<\/text><rect x=\"78.0\" y=\"98.2\" width=\"84.0\" height=\"159.8\" fill=\"#1660a8\"/><text x=\"120.0\" y=\"94.2\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">360<\/text><rect x=\"198.0\" y=\"151.4\" width=\"84.0\" height=\"106.6\" fill=\"#1660a8\"/><text x=\"240.0\" y=\"147.4\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">240<\/text><rect x=\"318.0\" y=\"71.5\" width=\"84.0\" height=\"186.5\" fill=\"#1660a8\"/><text x=\"360.0\" y=\"67.5\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">420<\/text><rect x=\"438.0\" y=\"178.1\" width=\"84.0\" height=\"79.9\" fill=\"#1660a8\"/><text x=\"480.0\" y=\"174.1\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">180<\/text><\/svg><\/div>", "items": [{"id": "RCP-301", "niv": 1, "cp": "rc_interpretacion", "e": "¿Qué porcentaje de los votos obtuvo el proyecto de vías?", "f": "Lectura de la gráfica.", "vis": "", "o": [["A", "30 %", "30 % es el porcentaje del proyecto del parque (360 de 1.200).", false], ["B", "35 %", "El proyecto de vías obtuvo 420 de 1.200 votos: 420 ÷ 1.200 = 0,35, es decir, 35 %.", true], ["C", "42 %", "Divide 420 entre 1.000 en lugar de entre el total de votos (1.200).", false], ["D", "53,8 %", "Divide 420 entre los votos de los otros tres proyectos (780) en lugar de entre el total.", false]]}, {"id": "RCP-302", "niv": 2, "cp": "rc_formulacion", "e": "La comuna repartirá $ 600 millones entre los cuatro proyectos, en proporción a los votos que obtuvo cada uno. ¿Cuánto dinero recibirá el proyecto de la biblioteca?", "f": "Cálculo propio a partir de los datos del caso.", "vis": "", "o": [["A", "$ 120 millones.", "La biblioteca obtuvo 240 de 1.200 votos, es decir, la quinta parte: 600 × 240 ÷ 1.200 = $ 120 millones.", true], ["B", "$ 144 millones.", "Calcula 600 × 0,24, como si los 240 votos fueran el 24 % del total; en realidad son el 20 %.", false], ["C", "$ 150 millones.", "Reparte el dinero en partes iguales entre los cuatro proyectos, sin tener en cuenta los votos.", false], ["D", "$ 240 millones.", "Confunde el número de votos con la cantidad de millones.", false]]}, {"id": "RCP-303", "niv": 2, "cp": "rc_argumentacion", "e": "Un líder comunal afirma: «Si todas las personas que votaron por el centro de salud hubieran votado por el parque, el parque habría superado al proyecto de vías». ¿Es correcta su afirmación?", "f": "Lectura de la gráfica.", "vis": "", "o": [["A", "Sí, porque el parque ya tiene 360 votos y el proyecto de vías solo 240.", "Confunde los votos de vías (420) con los de la biblioteca (240).", false], ["B", "No, porque el parque y el centro de salud juntos suman 360 + 180 = 400 votos.", "Error de suma: 360 + 180 = 540, que supera los 420 votos de vías.", false], ["C", "No, porque el parque tendría 360 + 180 = 540 votos y vías 420 + 180 = 600.", "Suma los votos del centro de salud también a vías, pero esos votos solo pasarían al parque.", false], ["D", "Sí, porque el parque tendría 540 votos, más que los del proyecto de vías.", "Al sumar los 180 votos del centro de salud a los 360 del parque se obtienen 540 votos, más que los 420 de vías.", true]]}]}, {"comp": "razonamiento_cuantitativo", "sim": "pro-3", "ind": "Cajas en el área de carga de un camión", "tt": "", "texto": "Una empresa de mensajería empaca sus envíos en cajas con forma de paralelepípedo recto de 40 cm de largo, 30 cm de ancho y 25 cm de alto. Las cajas se acomodan en el área de carga de un camión, un espacio con forma de paralelepípedo recto de 2 m de largo, 1,2 m de ancho y 1 m de alto. Recuerde que 1 litro equivale a 1.000 cm³.", "vis": "<table class=\"vt\"><caption>Tabla 1. Medidas de la caja y del área de carga<\/caption><thead><tr><th>Objeto<\/th><th>Largo<\/th><th>Ancho<\/th><th>Alto<\/th><\/tr><\/thead><tbody><tr><td>Caja<\/td><td>40 cm<\/td><td>30 cm<\/td><td>25 cm<\/td><\/tr><tr><td>Área de carga<\/td><td>2 m<\/td><td>1,2 m<\/td><td>1 m<\/td><\/tr><\/tbody><\/table>", "items": [{"id": "RCP-304", "niv": 1, "cp": "rc_formulacion", "e": "¿Cuál es el volumen de una caja, en litros?", "f": "Cálculo propio a partir de los datos del caso.", "vis": "", "o": [["A", "0,3 L.", "Divide 30.000 cm³ entre 100.000 en lugar de entre 1.000.", false], ["B", "3 L.", "Divide 30.000 cm³ entre 10.000 en lugar de entre 1.000.", false], ["C", "30 L.", "V = 40 × 30 × 25 = 30.000 cm³, y 30.000 ÷ 1.000 = 30 L.", true], ["D", "300 L.", "Divide 30.000 cm³ entre 100 en lugar de entre 1.000.", false]]}, {"id": "RCP-305", "niv": 3, "cp": "rc_formulacion", "e": "Si todas las cajas se colocan en la misma posición, con su largo a lo largo del camión, su ancho a lo ancho y su altura hacia arriba, ¿cuántas cajas caben como máximo en el área de carga?", "f": "Cálculo propio a partir de los datos del caso.", "vis": "", "o": [["A", "13 cajas.", "Suma las cajas que caben en cada dirección (5 + 4 + 4) en lugar de multiplicarlas.", false], ["B", "20 cajas.", "Cuenta solo una capa de cajas (5 × 4) y olvida que caben 4 capas en 1 m de altura.", false], ["C", "60 cajas.", "Divide la altura del camión (100 cm) entre 30 cm, el ancho de la caja, en lugar de entre su altura (25 cm).", false], ["D", "80 cajas.", "A lo largo caben 200 ÷ 40 = 5, a lo ancho 120 ÷ 30 = 4 y hacia arriba 100 ÷ 25 = 4: 5 × 4 × 4 = 80 cajas.", true]]}, {"id": "RCP-306", "niv": 3, "cp": "rc_argumentacion", "e": "Un auxiliar afirma: «Para saber cuántas cajas caben en cualquier espacio, basta dividir el volumen del espacio entre el volumen de una caja». ¿Es válida su afirmación?", "f": "Cálculo propio a partir de los datos del caso.", "vis": "", "o": [["A", "No, porque en un espacio de 2 m × 1 m × 20 cm la división da más de 13 y no cabe ninguna caja.", "Ese espacio tiene 400.000 cm³, pero mide solo 20 cm de alto y la medida más pequeña de la caja es 25 cm: no cabe ninguna. Las cajas no se pueden partir ni deformar.", true], ["B", "Sí, porque en cualquier espacio lo que sobra es menos que una caja, así que basta redondear.", "El espacio sobrante puede ser mucho mayor que una caja si las medidas no encajan, como en un espacio más bajo que la caja.", false], ["C", "Sí, porque 1 m³ son 1.000 litros y cada caja ocupa siempre el mismo volumen.", "Que el volumen de cada caja sea fijo no garantiza que las cajas encajen en el espacio sin dejar huecos.", false], ["D", "No, porque se deben dividir las áreas de las bases y no los volúmenes, sin tener en cuenta la altura.", "Dividir áreas cuenta, a lo sumo, una sola capa de cajas y tampoco resuelve el problema de los espacios sobrantes.", false]]}]}, {"comp": "razonamiento_cuantitativo", "sim": "pro-3", "ind": "Comparación de dos planes de gimnasio", "tt": "", "texto": "Un gimnasio ofrece dos planes. Plan A: inscripción de $ 50.000 (se paga una sola vez) y mensualidad de $ 60.000. Plan B: sin inscripción y mensualidad de $ 75.000. La gráfica muestra el costo acumulado de cada plan según el número de meses.", "vis": "<div class=\"vfig\"><svg class=\"vg\" viewBox=\"0 0 560 320\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Gráfica 1. Costo acumulado de cada plan\" font-family=\"Arial, sans-serif\" font-size=\"12\"><rect width=\"560\" height=\"320\" fill=\"#ffffff\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"13\" fill=\"#1d2433\">Gráfica 1. Costo acumulado de cada plan<\/text><line x1=\"60\" y1=\"258.0\" x2=\"540\" y2=\"258.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"262.0\" text-anchor=\"end\" fill=\"#3a4356\">0<\/text><line x1=\"60\" y1=\"213.6\" x2=\"540\" y2=\"213.6\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"217.6\" text-anchor=\"end\" fill=\"#3a4356\">100.000<\/text><line x1=\"60\" y1=\"169.2\" x2=\"540\" y2=\"169.2\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"173.2\" text-anchor=\"end\" fill=\"#3a4356\">200.000<\/text><line x1=\"60\" y1=\"124.8\" x2=\"540\" y2=\"124.8\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"128.8\" text-anchor=\"end\" fill=\"#3a4356\">300.000<\/text><line x1=\"60\" y1=\"80.4\" x2=\"540\" y2=\"80.4\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"84.4\" text-anchor=\"end\" fill=\"#3a4356\">400.000<\/text><line x1=\"60\" y1=\"36.0\" x2=\"540\" y2=\"36.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"40.0\" text-anchor=\"end\" fill=\"#3a4356\">500.000<\/text><line x1=\"60\" y1=\"258\" x2=\"540\" y2=\"258\" stroke=\"#3a4356\"/><line x1=\"60\" y1=\"258\" x2=\"60\" y2=\"36\" stroke=\"#3a4356\"/><text transform=\"translate(14,147.0) rotate(-90)\" text-anchor=\"middle\" fill=\"#3a4356\">Costo acumulado (pesos)<\/text><text x=\"300.0\" y=\"312\" text-anchor=\"middle\" fill=\"#3a4356\">Mes<\/text><text x=\"100.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">1<\/text><text x=\"180.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">2<\/text><text x=\"260.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">3<\/text><text x=\"340.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">4<\/text><text x=\"420.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">5<\/text><text x=\"500.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">6<\/text><polyline fill=\"none\" stroke=\"#1660a8\" stroke-width=\"2.5\" points=\"100.0,209.2 180.0,182.5 260.0,155.9 340.0,129.2 420.0,102.6 500.0,76.0\"/><circle cx=\"100.0\" cy=\"209.2\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"100.0\" y=\"201.2\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">110.000<\/text><circle cx=\"180.0\" cy=\"182.5\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"180.0\" y=\"174.5\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">170.000<\/text><circle cx=\"260.0\" cy=\"155.9\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"260.0\" y=\"147.9\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">230.000<\/text><circle cx=\"340.0\" cy=\"129.2\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"340.0\" y=\"121.2\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">290.000<\/text><circle cx=\"420.0\" cy=\"102.6\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"420.0\" y=\"94.6\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">350.000<\/text><circle cx=\"500.0\" cy=\"76.0\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"500.0\" y=\"68.0\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">410.000<\/text><polyline fill=\"none\" stroke=\"#d9822b\" stroke-width=\"2.5\" points=\"100.0,224.7 180.0,191.4 260.0,158.1 340.0,124.8 420.0,91.5 500.0,58.2\"/><circle cx=\"100.0\" cy=\"224.7\" r=\"3.5\" fill=\"#d9822b\"/><text x=\"100.0\" y=\"241.7\" text-anchor=\"middle\" font-size=\"11\" fill=\"#d9822b\" font-weight=\"bold\">75.000<\/text><circle cx=\"180.0\" cy=\"191.4\" r=\"3.5\" fill=\"#d9822b\"/><text x=\"180.0\" y=\"208.4\" text-anchor=\"middle\" font-size=\"11\" fill=\"#d9822b\" font-weight=\"bold\">150.000<\/text><circle cx=\"260.0\" cy=\"158.1\" r=\"3.5\" fill=\"#d9822b\"/><text x=\"260.0\" y=\"175.1\" text-anchor=\"middle\" font-size=\"11\" fill=\"#d9822b\" font-weight=\"bold\">225.000<\/text><circle cx=\"340.0\" cy=\"124.8\" r=\"3.5\" fill=\"#d9822b\"/><text x=\"340.0\" y=\"141.8\" text-anchor=\"middle\" font-size=\"11\" fill=\"#d9822b\" font-weight=\"bold\">300.000<\/text><circle cx=\"420.0\" cy=\"91.5\" r=\"3.5\" fill=\"#d9822b\"/><text x=\"420.0\" y=\"108.5\" text-anchor=\"middle\" font-size=\"11\" fill=\"#d9822b\" font-weight=\"bold\">375.000<\/text><circle cx=\"500.0\" cy=\"58.2\" r=\"3.5\" fill=\"#d9822b\"/><text x=\"500.0\" y=\"75.2\" text-anchor=\"middle\" font-size=\"11\" fill=\"#d9822b\" font-weight=\"bold\">450.000<\/text><rect x=\"60\" y=\"286\" width=\"12\" height=\"12\" fill=\"#1660a8\"/><text x=\"76\" y=\"296\" fill=\"#1d2433\">Plan A<\/text><rect x=\"128\" y=\"286\" width=\"12\" height=\"12\" fill=\"#d9822b\"/><text x=\"144\" y=\"296\" fill=\"#1d2433\">Plan B<\/text><\/svg><\/div>", "items": [{"id": "RCP-307", "niv": 3, "cp": "rc_interpretacion", "e": "¿A partir de qué mes el costo acumulado del plan A es menor que el del plan B?", "f": "Lectura de la gráfica.", "vis": "", "o": [["A", "El plan A nunca resulta más económico que el B.", "Desde el mes 4 el plan A acumula menos dinero que el B.", false], ["B", "A partir del mes 3.", "En el mes 3 el plan A acumula $ 230.000 y el B $ 225.000: el A sigue siendo más costoso.", false], ["C", "A partir del mes 2.", "En el mes 2 el plan A acumula $ 170.000 y el B $ 150.000: el A todavía es más costoso.", false], ["D", "A partir del mes 4.", "En el mes 4 el plan A acumula $ 290.000 y el B $ 300.000; desde allí el A es más económico.", true]]}, {"id": "RCP-308", "niv": 2, "cp": "rc_formulacion", "e": "¿Cuánto paga en total, durante un año, una persona que toma el plan A?", "f": "Cálculo propio a partir de los datos del caso.", "vis": "", "o": [["A", "$ 720.000", "Calcula solo las 12 mensualidades y olvida la inscripción.", false], ["B", "$ 770.000", "50.000 + 60.000 × 12 = 50.000 + 720.000 = $ 770.000.", true], ["C", "$ 900.000", "Es el costo de un año en el plan B (75.000 × 12).", false], ["D", "$ 1.320.000", "Cobra la inscripción todos los meses: 110.000 × 12.", false]]}, {"id": "RCP-309", "niv": 3, "cp": "rc_argumentacion", "e": "Andrea va a usar el gimnasio solo durante 3 meses y afirma: «Me conviene el plan A, porque su mensualidad es más barata». ¿Es válido su razonamiento?", "f": "Cálculo propio a partir de los datos del caso.", "vis": "", "o": [["A", "Sí, porque en 3 meses ahorra 3 × $ 15.000 = $ 45.000 en mensualidades.", "Olvida restar la inscripción de $ 50.000, que solo se paga en el plan A.", false], ["B", "No, porque en 3 meses el plan A cuesta $ 50.000 más que el plan B.", "Toma solo la inscripción y olvida que en las mensualidades el plan A ahorra $ 45.000; la diferencia es de $ 5.000.", false], ["C", "No, porque en 3 meses lo que ahorra en mensualidades no compensa la inscripción.", "En 3 meses ahorra 3 × 15.000 = $ 45.000 en mensualidades, menos que la inscripción de $ 50.000: el plan A le sale $ 5.000 más caro.", true], ["D", "Sí, porque la mensualidad del plan A es $ 60.000 y la del B $ 75.000, un 20 % menos.", "Comparar solo las mensualidades ignora la inscripción del plan A.", false]]}]}, {"comp": "razonamiento_cuantitativo", "sim": "pro-3", "ind": "Resultados de una prueba diagnóstica", "tt": "", "texto": "Un estudio evaluó una nueva prueba rápida para detectar una enfermedad en 500 personas. Con exámenes de laboratorio más completos se sabía de antemano quiénes tenían la enfermedad. La tabla muestra los resultados de la prueba rápida.", "vis": "<table class=\"vt\"><caption>Tabla 1. Resultados de la prueba rápida<\/caption><thead><tr><th><\/th><th>Resultado positivo<\/th><th>Resultado negativo<\/th><th>Total<\/th><\/tr><\/thead><tbody><tr><td>Con la enfermedad<\/td><td>45<\/td><td>5<\/td><td>50<\/td><\/tr><tr><td>Sin la enfermedad<\/td><td>27<\/td><td>423<\/td><td>450<\/td><\/tr><tr><td>Total<\/td><td>72<\/td><td>428<\/td><td>500<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Fuente: datos ficticios.<\/div>", "items": [{"id": "RCP-310", "niv": 2, "cp": "rc_interpretacion", "e": "¿Qué porcentaje de las personas que tenían la enfermedad obtuvo un resultado positivo en la prueba rápida?", "f": "Lectura de la tabla.", "vis": "", "o": [["A", "9 %", "Divide 45 entre las 500 personas del estudio, en lugar de entre las 50 que tenían la enfermedad.", false], ["B", "14,4 %", "14,4 % es el porcentaje de resultados positivos entre todas las personas (72 de 500).", false], ["C", "62,5 %", "62,5 % es la proporción de enfermos entre quienes dieron positivo (45 de 72); la pregunta parte de quienes tenían la enfermedad.", false], ["D", "90 %", "De las 50 personas con la enfermedad, 45 dieron positivo: 45 ÷ 50 = 90 %.", true]]}, {"id": "RCP-311", "niv": 3, "cp": "rc_argumentacion", "e": "Un periodista escribe: «La prueba rápida se equivocó con el 10 % de las personas evaluadas». ¿Es correcta su afirmación?", "f": "Cálculo propio a partir de los datos del caso.", "vis": "", "o": [["A", "No, porque falló con 27 de las 450 personas sanas, es decir, con el 6 %.", "Cuenta solo los errores con personas sanas y divide entre 450, no entre las 500 evaluadas.", false], ["B", "No, porque falló con 32 de las 500 personas, es decir, con el 6,4 %.", "Los errores son los enfermos con resultado negativo (5) y los sanos con resultado positivo (27): 32 ÷ 500 = 0,064.", true], ["C", "No, porque solo falló con los 27 sanos que dieron positivo: el 5,4 %.", "Olvida a los 5 enfermos que obtuvieron un resultado negativo.", false], ["D", "Sí, porque 50 de las 500 personas, el 10 %, tenían la enfermedad.", "El porcentaje de personas enfermas no es el porcentaje de errores de la prueba.", false]]}]}, {"comp": "razonamiento_cuantitativo", "sim": "pro-3", "ind": "Recorrido de un camión de reparto", "tt": "", "texto": "La gráfica muestra la distancia total que había recorrido un camión de reparto al final de cada hora de una jornada de 5 horas.", "vis": "<div class=\"vfig\"><svg class=\"vg\" viewBox=\"0 0 560 320\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Gráfica 1. Distancia total recorrida\" font-family=\"Arial, sans-serif\" font-size=\"12\"><rect width=\"560\" height=\"320\" fill=\"#ffffff\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"13\" fill=\"#1d2433\">Gráfica 1. Distancia total recorrida<\/text><line x1=\"60\" y1=\"258.0\" x2=\"540\" y2=\"258.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"262.0\" text-anchor=\"end\" fill=\"#3a4356\">0<\/text><line x1=\"60\" y1=\"221.0\" x2=\"540\" y2=\"221.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"225.0\" text-anchor=\"end\" fill=\"#3a4356\">50<\/text><line x1=\"60\" y1=\"184.0\" x2=\"540\" y2=\"184.0\"
