cia de la familia de fabricantes muestra que la prohibición podría tener efectos en otras dimensiones. ¿En cuáles?", "f": "Texto original elaborado para este simulacro, caso de la pólvora en diciembre, intervención de la familia de fabricantes", "vis": "", "o": [["A", "En la económica, por los ingresos de quienes viven del oficio, y en la de seguridad, si la venta se vuelve clandestina.", "La familia menciona a 40 personas que viven de la pirotecnia y el riesgo de productos menos seguros en la clandestinidad.", true], ["B", "En la fiscal, porque el municipio dejaría de recaudar impuestos por la venta de pólvora.", "La familia no menciona impuestos ni el recaudo del municipio.", false], ["C", "En la ambiental, por el humo y los residuos que dejaría el espectáculo de luces organizado por la alcaldía.", "La familia no menciona efectos ambientales.", false], ["D", "En la turística, porque el municipio dejaría de recibir visitantes en diciembre.", "La familia no menciona el turismo ni a los visitantes.", false]]}, {"id": "CCP-335", "niv": 3, "cp": "cc_sistemico", "e": "La propuesta del alcalde privilegia principalmente", "f": "Texto original elaborado para este simulacro, caso de la pólvora en diciembre", "vis": "", "o": [["A", "la reducción del gasto del hospital, por encima de la salud de los habitantes.", "El texto no menciona el gasto del hospital, y la propuesta busca proteger la salud.", false], ["B", "el empleo de los fabricantes de pólvora, por encima del gasto que implica organizar el espectáculo de luces.", "La propuesta no protege el empleo de los fabricantes; podría afectarlo.", false], ["C", "la salud y la integridad de las personas, por encima de una tradición y de una actividad económica local.", "La propuesta responde a los quemados atendidos en el hospital, a costa de la tradición y del oficio de los fabricantes, aunque intenta compensar la tradición con un espectáculo de luces.", true], ["D", "la continuidad de la tradición de la pólvora, por encima de la seguridad de los menores.", "Es lo contrario de lo que propone el alcalde.", false]]}]}, {"comp": "ingles", "sim": "pro-3", "ind": "Parte 1: animales", "tt": "", "texto": "Which word (A–H) matches each description? There is one word for each description. You will not use two of the words.\n\nWords:\nA. bat\nB. camel\nC. dolphin\nD. frog\nE. owl\nF. parrot\nG. snail\nH. tortoise\n\nExample: This bird can learn to repeat the words that people say.\nAnswer: parrot\n\n(The word in the example cannot be used again.)", "vis": "", "items": [{"id": "EN3-101", "niv": 1, "cp": "en_p1", "e": "This animal lives in the desert and can go for many days without drinking water.", "f": "Texto original elaborado para este simulacro (parte 1, lista de palabras)", "vis": "", "o": [["A", "bat", "«bat» significa murciélago; no corresponde, porque la descripción habla de un animal del desierto que pasa muchos días sin beber agua.", false], ["B", "camel", "Correcta: «camel» significa camello; coincide con la descripción, que habla de un animal del desierto que pasa muchos días sin beber agua.", true], ["C", "dolphin", "«dolphin» significa delfín; no corresponde, porque la descripción habla de un animal del desierto que pasa muchos días sin beber agua.", false], ["D", "frog", "«frog» significa rana; no corresponde, porque la descripción habla de un animal del desierto que pasa muchos días sin beber agua.", false], ["E", "owl", "«owl» significa búho o lechuza; no corresponde, porque la descripción habla de un animal del desierto que pasa muchos días sin beber agua.", false], ["F", "parrot", "«parrot» (loro) es la palabra del ejemplo y no se vuelve a usar; además, la descripción habla de un animal del desierto que pasa muchos días sin beber agua.", false], ["G", "snail", "«snail» significa caracol; no corresponde, porque la descripción habla de un animal del desierto que pasa muchos días sin beber agua.", false], ["H", "tortoise", "«tortoise» significa tortuga terrestre; no corresponde, porque la descripción habla de un animal del desierto que pasa muchos días sin beber agua.", false]]}, {"id": "EN3-102", "niv": 1, "cp": "en_p1", "e": "This bird sleeps during the day and hunts at night.", "f": "Texto original elaborado para este simulacro (parte 1, lista de palabras)", "vis": "", "o": [["A", "bat", "«bat» significa murciélago; no corresponde, porque la descripción habla de un ave que duerme de día y caza de noche.", false], ["B", "camel", "«camel» significa camello; no corresponde, porque la descripción habla de un ave que duerme de día y caza de noche.", false], ["C", "dolphin", "«dolphin» significa delfín; no corresponde, porque la descripción habla de un ave que duerme de día y caza de noche.", false], ["D", "frog", "«frog» significa rana; no corresponde, porque la descripción habla de un ave que duerme de día y caza de noche.", false], ["E", "owl", "Correcta: «owl» significa búho o lechuza; coincide con la descripción, que habla de un ave que duerme de día y caza de noche.", true], ["F", "parrot", "«parrot» (loro) es la palabra del ejemplo y no se vuelve a usar; además, la descripción habla de un ave que duerme de día y caza de noche.", false], ["G", "snail", "«snail» significa caracol; no corresponde, porque la descripción habla de un ave que duerme de día y caza de noche.", false], ["H", "tortoise", "«tortoise» significa tortuga terrestre; no corresponde, porque la descripción habla de un ave que duerme de día y caza de noche.", false]]}, {"id": "EN3-103", "niv": 1, "cp": "en_p1", "e": "This small animal has no legs, moves very slowly and carries its shell on its back.", "f": "Texto original elaborado para este simulacro (parte 1, lista de palabras)", "vis": "", "o": [["A", "bat", "«bat» significa murciélago; no corresponde, porque la descripción habla de un animal pequeño, sin patas, muy lento y que lleva su concha a la espalda.", false], ["B", "camel", "«camel» significa camello; no corresponde, porque la descripción habla de un animal pequeño, sin patas, muy lento y que lleva su concha a la espalda.", false], ["C", "dolphin", "«dolphin» significa delfín; no corresponde, porque la descripción habla de un animal pequeño, sin patas, muy lento y que lleva su concha a la espalda.", false], ["D", "frog", "«frog» significa rana; no corresponde, porque la descripción habla de un animal pequeño, sin patas, muy lento y que lleva su concha a la espalda.", false], ["E", "owl", "«owl» significa búho o lechuza; no corresponde, porque la descripción habla de un animal pequeño, sin patas, muy lento y que lleva su concha a la espalda.", false], ["F", "parrot", "«parrot» (loro) es la palabra del ejemplo y no se vuelve a usar; además, la descripción habla de un animal pequeño, sin patas, muy lento y que lleva su concha a la espalda.", false], ["G", "snail", "Correcta: «snail» significa caracol; coincide con la descripción, que habla de un animal pequeño, sin patas, muy lento y que lleva su concha a la espalda.", true], ["H", "tortoise", "«tortoise» significa tortuga terrestre; no corresponde, porque la descripción habla de un animal pequeño, sin patas, muy lento y que lleva su concha a la espalda.", false]]}, {"id": "EN3-104", "niv": 1, "cp": "en_p1", "e": "This animal lives in the sea, breathes air and is famous for being very intelligent.", "f": "Texto original elaborado para este simulacro (parte 1, lista de palabras)", "vis": "", "o": [["A", "bat", "«bat» significa murciélago; no corresponde, porque la descripción habla de un animal marino que respira aire y es famoso por su inteligencia.", false], ["B", "camel", "«camel» significa camello; no corresponde, porque la descripción habla de un animal marino que respira aire y es famoso por su inteligencia.", false], ["C", "dolphin", "Correcta: «dolphin» significa delfín; coincide con la descripción, que habla de un animal marino que respira aire y es famoso por su inteligencia.", true], ["D", "frog", "«frog» significa rana; no corresponde, porque la descripción habla de un animal marino que respira aire y es famoso por su inteligencia.", false], ["E", "owl", "«owl» significa búho o lechuza; no corresponde, porque la descripción habla de un animal marino que respira aire y es famoso por su inteligencia.", false], ["F", "parrot", "«parrot» (loro) es la palabra del ejemplo y no se vuelve a usar; además, la descripción habla de un animal marino que respira aire y es famoso por su inteligencia.", false], ["G", "snail", "«snail» significa caracol; no corresponde, porque la descripción habla de un animal marino que respira aire y es famoso por su inteligencia.", false], ["H", "tortoise", "«tortoise» significa tortuga terrestre; no corresponde, porque la descripción habla de un animal marino que respira aire y es famoso por su inteligencia.", false]]}, {"id": "EN3-105", "niv": 2, "cp": "en_p1", "e": "This animal can fly, but it is not a bird, and it hangs upside down when it rests.", "f": "Texto original elaborado para este simulacro (parte 1, lista de palabras)", "vis": "", "o": [["A", "bat", "Correcta: «bat» significa murciélago; coincide con la descripción, que habla de un animal que vuela sin ser ave y descansa colgado boca abajo.", true], ["B", "camel", "«camel» significa camello; no corresponde, porque la descripción habla de un animal que vuela sin ser ave y descansa colgado boca abajo.", false], ["C", "dolphin", "«dolphin» significa delfín; no corresponde, porque la descripción habla de un animal que vuela sin ser ave y descansa colgado boca abajo.", false], ["D", "frog", "«frog» significa rana; no corresponde, porque la descripción habla de un animal que vuela sin ser ave y descansa colgado boca abajo.", false], ["E", "owl", "«owl» significa búho o lechuza; no corresponde, porque la descripción habla de un animal que vuela sin ser ave y descansa colgado boca abajo.", false], ["F", "parrot", "«parrot» (loro) es la palabra del ejemplo y no se vuelve a usar; además, la descripción habla de un animal que vuela sin ser ave y descansa colgado boca abajo.", false], ["G", "snail", "«snail» significa caracol; no corresponde, porque la descripción habla de un animal que vuela sin ser ave y descansa colgado boca abajo.", false], ["H", "tortoise", "«tortoise» significa tortuga terrestre; no corresponde, porque la descripción habla de un animal que vuela sin ser ave y descansa colgado boca abajo.", false]]}]}, {"comp": "ingles", "sim": "pro-3", "ind": "Parte 2: avisos en lugares públicos", "tt": "", "texto": "Read each notice. Where can you see it? Choose the correct place.", "vis": "", "items": [{"id": "EN3-106", "niv": 1, "cp": "en_p2", "e": "\"Please do not feed the animals. Our lions and monkeys get special food every day.\"\n\nWhere can you see this notice?", "f": "Texto original elaborado para este simulacro, aviso 1", "vis": "", "o": [["A", "on a farm", "En una finca hay animales que se alimentan, pero no leones ni monos.", false], ["B", "at a pet shop", "En una tienda de mascotas hay animales, pero no leones ni monos.", false], ["C", "at a zoo", "Correcta: el aviso pide no alimentar a los animales y menciona leones y monos (lions and monkeys), animales que se ven en un zoológico.", true]]}, {"id": "EN3-107", "niv": 1, "cp": "en_p2", "e": "\"Platform 3: the 10:15 service to the city centre is running 20 minutes late.\"\n\nWhere can you see this notice?", "f": "Texto original elaborado para este simulacro, aviso 2", "vis": "", "o": [["A", "at a cinema", "En un cine hay salas y horarios de funciones, pero no «platforms» ni servicios que viajan al centro de la ciudad.", false], ["B", "at a train station", "Correcta: «platform» (andén) y «service ... running late» (el servicio va retrasado) son propios de una estación de tren.", true], ["C", "in a hotel room", "Una habitación de hotel no tiene andenes ni servicios con horario de salida hacia el centro.", false]]}, {"id": "EN3-108", "niv": 1, "cp": "en_p2", "e": "\"All swimmers must take a shower before entering the water.\"\n\nWhere can you see this notice?", "f": "Texto original elaborado para este simulacro, aviso 3", "vis": "", "o": [["A", "at a swimming pool", "Correcta: el aviso se dirige a los nadadores (swimmers) y les pide ducharse antes de entrar al agua, norma típica de una piscina.", true], ["B", "at a bank", "En un banco no hay agua ni nadadores; la norma no tendría sentido allí.", false], ["C", "in a library", "En una biblioteca no hay nadadores ni agua para entrar.", false]]}, {"id": "EN3-109", "niv": 2, "cp": "en_p2", "e": "\"Please switch off your mobile phone while you wait. Bring your medical card to every appointment.\"\n\nWhere can you see this notice?", "f": "Texto original elaborado para este simulacro, aviso 4", "vis": "", "o": [["A", "at a doctor's", "Correcta: se espera turno (while you wait) para una cita (appointment) y se pide traer el carné médico (medical card): es el consultorio de un médico.", true], ["B", "at a hairdresser's", "En una peluquería también se espera turno y hay citas, pero no se pide un carné médico.", false], ["C", "in a cinema waiting area", "En un cine se pide apagar el celular, pero no hay citas (appointments) ni se pide carné médico.", false]]}, {"id": "EN3-110", "niv": 2, "cp": "en_p2", "e": "\"Tents may only be put up in the marked areas. Fires are allowed in the metal rings only.\"\n\nWhere can you see this notice?", "f": "Texto original elaborado para este simulacro, aviso 5", "vis": "", "o": [["A", "in a hospital", "En un hospital no se arman carpas ni se hacen fogatas; el aviso no corresponde a ese lugar.", false], ["B", "in a shopping centre", "En un centro comercial no se arman carpas ni se permiten fogatas.", false], ["C", "at a campsite", "Correcta: «tents may only be put up» (las carpas solo pueden armarse) en zonas marcadas y las fogatas en aros metálicos: normas de un camping.", true]]}, {"id": "EN3-111", "niv": 2, "cp": "en_p2", "e": "\"Show your wristband at every stage entrance. Lost wristbands cannot be replaced.\"\n\nWhere can you see this notice?", "f": "Texto original elaborado para este simulacro, aviso 6", "vis": "", "o": [["A", "in a hospital ward", "En un hospital los pacientes usan manilla de identificación, pero no hay «stages» (tarimas o escenarios) con entradas.", false], ["B", "at a music festival", "Correcta: la manilla (wristband) que se muestra en la entrada de cada tarima (stage entrance) es propia de un festival de música con varios escenarios.", true], ["C", "in a post office", "En una oficina de correos no se usan manillas ni hay escenarios con entrada.", false]]}]}, {"comp": "ingles", "sim": "pro-3", "ind": "Parte 3: conversaciones cotidianas", "tt": "", "texto": "Complete the conversations. Choose the best reply to each sentence.", "vis": "", "items": [{"id": "EN3-112", "niv": 1, "cp": "en_p3", "e": "\"What time does the next bus leave?\"", "f": "Texto original elaborado para este simulacro, conversación 1", "vis": "", "o": [["A", "At half past eight, I think.", "Correcta: la pregunta «What time...?» pide una hora y «At half past eight» (a las ocho y media) la da.", true], ["B", "Next to the station.", "«Next to the station» indica un lugar (al lado de la estación); respondería a «Where...?», no a «What time...?».", false], ["C", "For two hours.", "«For two hours» expresa duración (durante dos horas), no la hora de salida que se pregunta.", false]]}, {"id": "EN3-113", "niv": 1, "cp": "en_p3", "e": "\"Would you like some help with those bags?\"", "f": "Texto original elaborado para este simulacro, conversación 2", "vis": "", "o": [["A", "No, I don't help people with their bags.", "Responde como si le pidieran ayuda a él («No, yo no ayudo»), cuando en realidad le están ofreciendo ayuda.", false], ["B", "That's very kind of you, thanks.", "Correcta: es la forma natural de aceptar una oferta de ayuda: «Es muy amable de su parte, gracias».", true], ["C", "Yes, they're very nice bags.", "Responde como si le hubieran elogiado las bolsas; no acepta ni rechaza la ayuda que le ofrecen.", false]]}, {"id": "EN3-114", "niv": 1, "cp": "en_p3", "e": "\"I'm thinking of learning Portuguese.\"", "f": "Texto original elaborado para este simulacro, conversación 3", "vis": "", "o": [["A", "Because it's a beautiful country.", "«Because...» da una razón, pero nadie preguntó «why»; además, el portugués es un idioma, no un país.", false], ["B", "Yes, I learnt it yesterday.", "Es ilógico: un idioma no se aprende en un día, y la respuesta no reacciona al plan de la otra persona.", false], ["C", "Good idea! My cousin teaches it online.", "Correcta: ante un plan, lo natural es animar («Good idea!») y ofrecer algo útil: un primo que da clases en línea.", true]]}, {"id": "EN3-115", "niv": 2, "cp": "en_p3", "e": "\"Have you finished your homework yet?\"", "f": "Texto original elaborado para este simulacro, conversación 4", "vis": "", "o": [["A", "Almost. I just have one exercise left.", "Correcta: «Have you finished... yet?» pregunta si ya terminó; «Almost» (casi) responde y explica qué le falta.", true], ["B", "Yes, I'll finish it tonight.", "Es contradictoria: dice «Yes» (ya terminé) pero luego que la terminará esta noche.", false], ["C", "No, I've already handed it in.", "Es contradictoria: dice «No» (no he terminado) pero afirma que ya la entregó.", false]]}, {"id": "EN3-116", "niv": 2, "cp": "en_p3", "e": "\"Why don't we have lunch in the park today?\"", "f": "Texto original elaborado para este simulacro, conversación 5", "vis": "", "o": [["A", "No, I don't have a park.", "Es absurda: nadie preguntó si tiene un parque; la otra persona sugiere almorzar en uno.", false], ["B", "Yes, I ate there last week.", "Habla de la semana pasada; no acepta ni rechaza la sugerencia de almorzar hoy en el parque.", false], ["C", "Good idea! It's a lovely day.", "Correcta: «Why don't we...?» es una sugerencia, no una pregunta por una razón; se acepta con «Good idea!» y un comentario sobre el buen día.", true]]}, {"id": "EN3-117", "niv": 3, "cp": "en_p3", "e": "\"I wish I hadn't signed up for the marathon.\"", "f": "Texto original elaborado para este simulacro, conversación 6", "vis": "", "o": [["A", "Great! I'm glad you enjoyed running it.", "Supone que la persona ya corrió la maratón y la disfrutó, pero ella expresa arrepentimiento por haberse inscrito; la respuesta no encaja.", false], ["B", "Why? Are you worried about it?", "Correcta: «I wish I hadn't signed up» expresa arrepentimiento (ojalá no me hubiera inscrito); lo natural es preguntar el motivo: «¿Por qué? ¿Te preocupa?».", true], ["C", "Don't worry, there's still time to sign up.", "La persona ya se inscribió («I wish I hadn't signed up» indica que sí lo hizo); decirle que aún hay tiempo para inscribirse no tiene sentido.", false]]}]}, {"comp": "ingles", "sim": "pro-3", "ind": "Parte 4: los colibríes", "tt": "", "texto": "Read the text and choose the correct word for each space.\n\nHUMMINGBIRDS\n\nHummingbirds are the smallest birds in the world. They live (1) ___ the Americas, from Alaska to the south of Chile. Many of them (2) ___ very colourful feathers that shine in the sun. A hummingbird's wings move so fast that they make a humming sound, and that is (3) ___ the bird got its name.\n\nThese tiny birds are also the only birds that (4) ___ fly backwards. To get enough energy, a hummingbird has to eat many times a day, and it visits hundreds of flowers to drink their nectar. At night, it often goes into a very deep sleep called torpor, which helps (5) ___ to save energy.", "vis": "", "items": [{"id": "EN3-118", "niv": 1, "cp": "en_p4", "e": "Gap (1)", "f": "Texto original elaborado para este simulacro, texto «Hummingbirds», espacio 1", "vis": "", "o": [["A", "in", "Correcta: con continentes, países y regiones se usa «in»: «live in the Americas» (viven en las Américas).", true], ["B", "at", "«at» se usa con puntos o lugares concretos («at the station»), no con un continente entero.", false], ["C", "on", "«on» se usa con superficies o calles («on the table», «on Main Street»), no con continentes.", false]]}, {"id": "EN3-119", "niv": 1, "cp": "en_p4", "e": "Gap (2)", "f": "Texto original elaborado para este simulacro, texto «Hummingbirds», espacio 2", "vis": "", "o": [["A", "having", "«having» es gerundio y no puede funcionar solo como verbo principal de la oración.", false], ["B", "have", "Correcta: el sujeto «Many of them» es plural, así que el verbo en presente simple es «have» (tienen).", true], ["C", "has", "«has» es para tercera persona del singular (he/she/it); el sujeto «many of them» es plural.", false]]}, {"id": "EN3-120", "niv": 2, "cp": "en_p4", "e": "Gap (3)", "f": "Texto original elaborado para este simulacro, texto «Hummingbirds», espacio 3", "vis": "", "o": [["A", "what", "«that is what the bird got its name» es agramatical: «what» necesitaría ocupar el lugar de un objeto que falte, y la oración ya está completa.", false], ["B", "which", "«which» es un pronombre relativo que necesita un antecedente sustantivo; «that is which...» no es una construcción posible.", false], ["C", "why", "Correcta: «that is why...» significa «por eso...»; introduce la consecuencia: por el zumbido (humming) el ave recibió su nombre.", true]]}, {"id": "EN3-121", "niv": 2, "cp": "en_p4", "e": "Gap (4)", "f": "Texto original elaborado para este simulacro, texto «Hummingbirds», espacio 4", "vis": "", "o": [["A", "able", "«able» es adjetivo; necesitaría «are able to fly». Solo «able fly» es agramatical.", false], ["B", "can", "Correcta: el modal «can» (poder) va seguido del verbo en forma base: «the only birds that can fly backwards» (las únicas aves que pueden volar hacia atrás).", true], ["C", "are able", "Falta «to»: la estructura correcta es «are able to fly»; «are able fly» es agramatical.", false]]}, {"id": "EN3-122", "niv": 2, "cp": "en_p4", "e": "Gap (5)", "f": "Texto original elaborado para este simulacro, texto «Hummingbirds», espacio 5", "vis": "", "o": [["A", "it's", "«it's» es la contracción de «it is» o «it has»; «helps it is to save» no tiene sentido.", false], ["B", "its", "«its» es un adjetivo posesivo (su) y debe ir antes de un sustantivo; aquí se necesita un pronombre objeto.", false], ["C", "it", "Correcta: después de «helps» va un pronombre objeto: «helps it to save energy» (le ayuda a ahorrar energía); «it» se refiere al colibrí.", true]]}]}, {"comp": "ingles", "sim": "pro-3", "ind": "Parte 4: bicicletas compartidas", "tt": "", "texto": "Read the text and choose the correct word for each space.\n\nSHARED BICYCLES\n\nToday, many people in cities around the world (1) ___ shared bicycles to move around. The idea is simple: you take a bike from a station, ride it to your destination and leave it at (2) ___ station. Most systems work with a mobile app, so users do not need (3) ___ carry cash.\n\nThe first public bicycle plans appeared in Europe in the 1960s, but they did not work well (4) ___ many bikes were stolen or damaged. Modern systems solved this problem with electronic locks and GPS. Today, city planners say that shared bikes are most useful for trips (5) ___ are too long to walk but too short to take a car.", "vis": "", "items": [{"id": "EN3-123", "niv": 1, "cp": "en_p4", "e": "Gap (1)", "f": "Texto original elaborado para este simulacro, texto «Shared bicycles», espacio 1", "vis": "", "o": [["A", "use", "Correcta: el sujeto «many people» es plural y el texto habla de un hábito actual: presente simple «use» (usan).", true], ["B", "using", "«using» es gerundio; sin un auxiliar («are using») no puede ser el verbo principal.", false], ["C", "uses", "«uses» lleva -s de tercera persona del singular; «people» es plural.", false]]}, {"id": "EN3-124", "niv": 2, "cp": "en_p4", "e": "Gap (2)", "f": "Texto original elaborado para este simulacro, texto «Shared bicycles», espacio 2", "vis": "", "o": [["A", "others", "«others» es pronombre y no puede ir delante de un sustantivo: «others station» es agramatical.", false], ["B", "another", "Correcta: «another» (otra) acompaña a un sustantivo contable en singular: «another station», otra estación distinta de aquella donde se tomó la bici.", true], ["C", "other", "«other» con un sustantivo singular contable necesita un determinante («the other station»); «at other station» es incorrecto.", false]]}, {"id": "EN3-125", "niv": 2, "cp": "en_p4", "e": "Gap (3)", "f": "Texto original elaborado para este simulacro, texto «Shared bicycles», espacio 3", "vis": "", "o": [["A", "to", "Correcta: el verbo «need» se construye con infinitivo con «to»: «do not need to carry cash» (no necesitan llevar efectivo).", true], ["B", "for", "«need for» no se usa antes de un verbo; «need for carry» es agramatical.", false], ["C", "of", "«of» no puede introducir un verbo en forma base; «need of carry» es incorrecto.", false]]}, {"id": "EN3-126", "niv": 3, "cp": "en_p4", "e": "Gap (4)", "f": "Texto original elaborado para este simulacro, texto «Shared bicycles», espacio 4", "vis": "", "o": [["A", "unless", "«unless» (a menos que) expresa una condición, no la causa de un hecho pasado; no tiene sentido aquí.", false], ["B", "although", "«although» (aunque) expresa contraste; decir que no funcionaron «aunque» robaron bicicletas contradice la lógica de la frase.", false], ["C", "because", "Correcta: «because» (porque) introduce la causa de que los primeros planes no funcionaran: muchas bicicletas fueron robadas o dañadas.", true]]}, {"id": "EN3-127", "niv": 3, "cp": "en_p4", "e": "Gap (5)", "f": "Texto original elaborado para este simulacro, texto «Shared bicycles», espacio 5", "vis": "", "o": [["A", "where", "«where» se refiere a lugares y no puede ser sujeto del verbo «are»; se necesita un relativo para cosas.", false], ["B", "that", "Correcta: «that» es un pronombre relativo que se refiere a una cosa («trips») y funciona como sujeto de «are too long».", true], ["C", "what", "«what» no se usa como relativo después de un sustantivo; «trips what are...» es un error típico.", false]]}]}, {"comp": "ingles", "sim": "pro-3", "ind": "Parte 5: biografía de una emprendedora apicultora", "tt": "", "texto": "Read the text and answer the questions.\n\nTHE BEEKEEPER WHO STUDIED BUSINESS\n\nLucía Paredes grew up on a small farm near the mountains, where her grandfather kept bees. As a little girl, she was scared of them, but by the age of twelve she was helping him collect honey every weekend.\n\nAfter finishing school, Lucía studied business administration in the city. She enjoyed her classes, but she missed the countryside. In her last year, a teacher asked the students to design a company, and Lucía decided to plan a honey brand. Her project won a prize of two thousand dollars, which she used to buy her first ten beehives.\n\nAt first, she sold honey only to neighbours and friends. Things changed when a local café started using her honey in its cakes and customers began asking where they could buy it. Today, her company, Golden Valley, has six employees and sells honey, candles and soap made from beeswax.\n\nLucía still visits the hives every week. \"Bees taught me to be patient,\" she says. \"They work slowly, but together they build something amazing.\" She also gives free talks in schools to explain why bees are important for growing fruit and vegetables.\n\n(Lucía Paredes is a fictional person.)", "vis": "", "items": [{"id": "EN3-128", "niv": 1, "cp": "en_p5", "e": "How did Lucía feel about bees when she was very young?", "f": "Texto original elaborado para este simulacro, párrafo 1", "vis": "", "o": [["A", "She was frightened of them.", "Correcta: el texto dice «As a little girl, she was scared of them»; «frightened» es sinónimo de «scared» (asustada, con miedo).", true], ["B", "She wanted to keep them as pets.", "El texto no dice que quisiera tenerlas como mascotas; dice lo contrario: les tenía miedo.", false], ["C", "She knew nothing about them.", "Su abuelo tenía abejas en la finca donde ella creció, así que sí las conocía; lo que dice el texto es que le daban miedo.", false]]}, {"id": "EN3-129", "niv": 2, "cp": "en_p5", "e": "What did Lucía do with the prize money?", "f": "Texto original elaborado para este simulacro, párrafo 2", "vis": "", "o": [["A", "She opened a café in the city.", "El café que aparece en el texto es un negocio local que compraba su miel; ella no abrió ningún café.", false], ["B", "She paid for her last year at the university.", "El premio llegó en su último año de estudios y el texto dice que lo usó en colmenas, no en pagar la universidad.", false], ["C", "She bought the first hives for her business.", "Correcta: «a prize of two thousand dollars, which she used to buy her first ten beehives» (lo usó para comprar sus primeras diez colmenas).", true]]}, {"id": "EN3-130", "niv": 2, "cp": "en_p5", "e": "When did Lucía's business start to grow?", "f": "Texto original elaborado para este simulacro, párrafo 3", "vis": "", "o": [["A", "After she added candles and soap made from beeswax to her products.", "Las velas y el jabón aparecen como productos actuales de la empresa, no como la causa del crecimiento.", false], ["B", "After she began giving talks in schools.", "Las charlas en colegios son una actividad que hace hoy; el texto no las relaciona con el crecimiento del negocio.", false], ["C", "After a café began using her honey.", "Correcta: «Things changed when a local café started using her honey in its cakes and customers began asking where they could buy it».", true]]}, {"id": "EN3-131", "niv": 2, "cp": "en_p5", "e": "What does Lucía do when she visits schools?", "f": "Texto original elaborado para este simulacro, párrafo 4", "vis": "", "o": [["A", "She explains how bees help farmers produce food.", "Correcta: da charlas para explicar «why bees are important for growing fruit and vegetables», es decir, cómo las abejas ayudan a producir alimentos.", true], ["B", "She sells honey, candles and soap.", "Esos son los productos de su empresa; el texto dice que las charlas en colegios son gratuitas, no que venda allí.", false], ["C", "She teaches students how to design and run their own company.", "Diseñar una empresa fue la tarea que le pusieron a ella en la universidad, no lo que enseña en los colegios.", false]]}]}, {"comp": "ingles", "sim": "pro-3", "ind": "Parte 5: un festival de faroles", "tt": "", "texto": "Read the text and answer the questions.\n\nA FESTIVAL THAT GREW TOO FAST\n\nEvery November, the small riverside town of Santa Elena holds its Festival of Lights. For three nights, hundreds of paper lanterns float down the river, and the streets are decorated with candles and coloured lights.\n\nThe festival began in 1987, when a group of fishing families decided to remember the people they had lost on the river. At first, it was a quiet ceremony with only a few dozen people. Over the years, musicians, artists and food sellers joined in, and now the festival attracts more than forty thousand visitors.\n\nThis growth has brought both benefits and problems. Hotels and restaurants are fully booked, and many families earn extra money by renting rooms in their houses. However, some older residents complain that the event has become too noisy and that its original meaning is being forgotten. Others worry about the river: after the 2019 festival, volunteers collected more than two tonnes of rubbish from its banks.\n\nTo respond to these concerns, the organisers introduced several changes last year. Lanterns must now be made of recycled paper and natural glue, and visitors who want to release one have to buy it from an official stand. Loud music is only allowed in the main square, and it must stop at midnight. The first night of the festival is once again a silent ceremony, and it is now open only to local families.\n\nThe mayor believes the new rules have found the right balance. \"We want visitors to enjoy our festival,\" she said, \"but we also want them to understand why it exists.\"\n\n(Santa Elena and its festival are fictional.)", "vis": "", "items": [{"id": "EN3-132", "niv": 2, "cp": "en_p5", "e": "Why did the festival begin?", "f": "Texto original elaborado para este simulacro, párrafo 2", "vis": "", "o": [["A", "To bring tourists to the town.", "Al principio era una ceremonia tranquila de pocas personas; los visitantes llegaron después, no fueron el motivo del inicio.", false], ["B", "To honour people who had died.", "Correcta: empezó cuando unas familias pescadoras decidieron «remember the people they had lost on the river», es decir, recordar a quienes habían muerto.", true], ["C", "To celebrate the end of the fishing season.", "El texto menciona familias pescadoras, pero no dice nada sobre el fin de una temporada de pesca.", false]]}, {"id": "EN3-133", "niv": 2, "cp": "en_p5", "e": "How do some people in Santa Elena benefit from the festival?", "f": "Texto original elaborado para este simulacro, párrafo 3", "vis": "", "o": [["A", "They make money by letting visitors stay in their homes.", "Correcta: «many families earn extra money by renting rooms in their houses» (ganan dinero extra alquilando habitaciones en sus casas).", true], ["B", "They are given free tickets to all the concerts in the town.", "El texto no menciona entradas gratis ni conciertos con boletería.", false], ["C", "They can sell food in the main square.", "Los vendedores de comida se mencionan como parte del crecimiento del festival, pero no como un beneficio para los habitantes ni en la plaza principal.", false]]}, {"id": "EN3-134", "niv": 3, "cp": "en_p5", "e": "What did volunteers do after the 2019 festival?", "f": "Texto original elaborado para este simulacro, párrafo 3", "vis": "", "o": [["A", "They listened to complaints from older residents.", "Las quejas de los residentes mayores aparecen en el texto, pero no se dice que los voluntarios las atendieran.", false], ["B", "They made new lanterns out of recycled paper and natural glue.", "El papel reciclado es una regla que los organizadores introdujeron el año pasado, no algo que hicieran los voluntarios en 2019.", false], ["C", "They removed a large amount of waste near the river.", "Correcta: «volunteers collected more than two tonnes of rubbish from its banks»; recoger más de dos toneladas de basura de las orillas equivale a retirar mucha basura cerca del río.", true]]}, {"id": "EN3-135", "niv": 3, "cp": "en_p5", "e": "What is true about the lanterns now?", "f": "Texto original elaborado para este simulacro, párrafo 4", "vis": "", "o": [["A", "They are all made by hand by families who live in the town.", "El texto dice de qué materiales se hacen (papel reciclado y pegante natural), pero no quién los fabrica.", false], ["B", "Visitors cannot bring their own lanterns to release.", "Correcta: quien quiera soltar un farol «has to buy it from an official stand»; por tanto, no puede traer uno propio.", true], ["C", "They can only be released from the main square.", "La plaza principal se menciona solo como el único lugar donde se permite música fuerte, no como el lugar para soltar faroles.", false]]}, {"id": "EN3-136", "niv": 3, "cp": "en_p5", "e": "What has happened to the first night of the festival?", "f": "Texto original elaborado para este simulacro, párrafo 4", "vis": "", "o": [["A", "Only local families can attend it now.", "Correcta: la primera noche «is now open only to local families», es decir, solo pueden asistir las familias del pueblo.", true], ["B", "It now finishes at midnight in the main square.", "La regla de terminar a medianoche se aplica a la música fuerte en la plaza, no a la ceremonia de la primera noche.", false], ["C", "It has become a silent ceremony for the first time.", "El texto dice «once again a silent ceremony» (de nuevo silenciosa): ya lo fue al comienzo, en 1987, así que no es la primera vez.", false]]}]}, {"comp": "ingles", "sim": "pro-3", "ind": "Parte 6: experiencia en un curso de primeros auxilios", "tt": "", "texto": "Read the text and answer the questions.\n\nTHE QUESTION NOBODY ANSWERED\n\nLast month my university offered a free first aid course, and I almost didn't go. I had exams coming up, and to be honest, I thought first aid was something for doctors and nurses, not for a literature student like me.\n\nI'm glad my roommate convinced me. On the first day, the instructor, a retired paramedic called Mr Osei, asked us a simple question: \"If the person next to you stopped breathing right now, what would you do?\" Nobody answered. The room was so quiet that you could hear the air conditioning.\n\nOver the next four sessions, we practised chest compressions on plastic dummies until our arms hurt. We learned how to put someone in the recovery position, how to stop heavy bleeding and what to do when someone is choking. Mr Osei kept repeating that the most dangerous thing in an emergency is not making a mistake; it is doing nothing.\n\nTwo weeks after the course, a man collapsed at the bus stop outside the library. Before I had time to think, I was kneeling next to him and checking if he was breathing. He was, so I put him on his side and called an ambulance. The paramedics later told me I had done everything right.\n\nI still remember the silence in that classroom on the first day. I hope that, if Mr Osei asked us his question again, the room would be much noisier.\n\nValentina Ríos, second-year literature student\n\n(The writer is a fictional person.)", "vis": "", "items": [{"id": "EN3-137", "niv": 2, "cp": "en_p6", "e": "What is the writer's purpose in mentioning that she almost didn't go to the course?", "f": "Texto original elaborado para este simulacro, párrafos 1 y 2", "vis": "", "o": [["A", "To suggest that the course was only useful for health workers.", "Esa era su idea inicial, que el resto del texto desmiente: ella, estudiante de literatura, usó lo aprendido para ayudar a un hombre.", false], ["B", "To complain that the university did not advertise the course well.", "El texto no dice nada sobre la publicidad del curso; la autora no se queja de la universidad y dice «I'm glad» de haber asistido.", false], ["C", "To explain why she did badly in her exams.", "El texto no dice nada sobre sus resultados en los exámenes.", false], ["D", "To show how much her opinion about first aid has changed.", "Correcta: al principio creía que los primeros auxilios eran «for doctors and nurses», pero luego se alegra de haber ido y los aplica; mencionar que casi no fue resalta ese cambio de opinión.", true]]}, {"id": "EN3-138", "niv": 2, "cp": "en_p6", "e": "Why was the room silent after Mr Osei's question?", "f": "Texto original elaborado para este simulacro, párrafo 2", "vis": "", "o": [["A", "The air conditioning was too loud to hear him.", "Ocurre lo contrario: el salón estaba tan callado que se oía el aire acondicionado; todos escucharon la pregunta.", false], ["B", "Nobody knew what to do.", "Correcta: nadie respondió porque nadie sabía qué hacer; por eso tuvieron que aprender en las sesiones siguientes y la autora espera que hoy el salón sería «much noisier».", true], ["C", "The students thought the question was a joke.", "El texto no sugiere que tomaran la pregunta en broma; la autora la presenta como una pregunta seria que nadie supo responder.", false], ["D", "The students were afraid of the instructor.", "Nada en el texto describe al señor Osei como alguien que inspire miedo; el silencio se debe a la falta de conocimiento.", false]]}, {"id": "EN3-139", "niv": 3, "cp": "en_p6", "e": "What does the writer mean in the last sentence?", "f": "Texto original elaborado para este simulacro, párrafo 5", "vis": "", "o": [["A", "She thinks the students would now know what to do.", "Correcta: un salón «much noisier» (mucho más ruidoso) significa que muchos responderían; tras el curso ya saben qué hacer, a diferencia del silencio del primer día.", true], ["B", "She misses the classmates she met during the course.", "En ninguna parte habla de extrañar a sus compañeros; la última frase retoma la pregunta del primer día.", false], ["C", "She wants future first aid classes to have more students.", "La frase no habla del número de estudiantes sino de la reacción ante la pregunta; «noisier» se refiere a que habría respuestas.", false], ["D", "She thinks the classroom should be less quiet during lessons.", "Es una lectura literal del ruido; la autora no critica el ambiente del salón, sino que contrasta el silencio inicial con lo que ahora sabrían responder.", false]]}]}, {"comp": "ingles", "sim": "pro-3", "ind": "Parte 6: columna de opinión sobre patinetas eléctricas", "tt": "", "texto": "Read the text and answer the questions.\n\nTHE SCOOTER QUESTION\n\nWhen electric scooters first appeared on our streets three years ago, I was one of their biggest fans. They were cheap, quick and fun, and they seemed like the perfect answer to traffic jams. I even wrote an enthusiastic column about them for this newspaper.\n\nI have not changed my mind completely, but I have certainly become more cautious. Last winter, my neighbour, who is almost blind, tripped over a scooter that someone had left in the middle of the pavement and broke her wrist. Since then, I have started to notice scooters everywhere: lying across bus stops, blocking ramps for wheelchairs, even floating in the canal.\n\nThe companies that rent them say that users are responsible, and that most people park correctly. That may be true, but a system that depends on everyone behaving perfectly is a badly designed system. Other cities have found simple solutions: marked parking zones, fines that appear automatically in the app and lower speed limits in busy areas. None of these measures requires banning scooters altogether.\n\nOur city council will vote next month on whether to end the scooter programme. I hope its members will not throw away a useful idea because of a problem that can be fixed. But I also hope they understand that doing nothing is no longer an option.\n\nCarmen Ortiz, columnist\n\n(The columnist is a fictional person.)", "vis": "", "items": [{"id": "EN3-140", "niv": 2, "cp": "en_p6", "e": "How has the writer's opinion about electric scooters changed?", "f": "Texto original elaborado para este simulacro, párrafos 1, 2 y 4", "vis": "", "o": [["A", "She still supports them but now sees the problems they cause.", "Correcta: dice «I have not changed my mind completely, but I have certainly become more cautious» y pide no acabar con el programa; sigue a favor, pero reconoce los problemas.", true], ["B", "She believes the rental companies have solved the problems.", "Cuestiona el argumento de las empresas y pide medidas nuevas; no dice que los problemas estén resueltos.", false], ["C", "She has never really liked them.", "Dice que fue «one of their biggest fans» y que escribió una columna entusiasta sobre ellas.", false], ["D", "She now thinks they should be completely banned from the city's streets.", "Al contrario: espera que el concejo no deseche «a useful idea» y aclara que las soluciones no exigen prohibirlas.", false]]}, {"id": "EN3-141", "niv": 3, "cp": "en_p6", "e": "What does the writer suggest about the argument used by the rental companies?", "f": "Texto original elaborado para este simulacro, párrafo 3", "vis": "", "o": [["A", "It is supported by clear evidence from other cities that use scooters.", "Las otras ciudades se mencionan como ejemplo de soluciones, no como prueba del argumento de las empresas.", false], ["B", "It is the same argument she used in her first column.", "El texto no dice qué argumentos usó en su primera columna, solo que era entusiasta.", false], ["C", "It blames users and ignores how the system itself is organised.", "Correcta: ante «users are responsible», la autora responde que un sistema que depende de que todos se porten perfecto está mal diseñado; insinúa que el problema también es del sistema.", true], ["D", "It explains why scooters end up in the canal.", "El argumento de las empresas no explica nada sobre las patinetas en el canal; la autora lo considera insuficiente.", false]]}, {"id": "EN3-142", "niv": 3, "cp": "en_p6", "e": "What is the writer's main purpose in this text?", "f": "Texto original elaborado para este simulacro, párrafos 3 y 4", "vis": "", "o": [["A", "To describe her neighbour's accident in detail.", "El accidente de la vecina es un ejemplo dentro del argumento, contado en dos líneas; no es el propósito principal.", false], ["B", "To encourage readers to stop using scooters and walk or take the bus instead.", "La autora no pide a los lectores que dejen de usarlas; defiende que la idea es útil si se corrigen los problemas.", false], ["C", "To report the result of the council's vote.", "La votación será «next month»; aún no hay resultado que informar.", false], ["D", "To persuade the council to regulate scooters instead of banning them.", "Correcta: el texto presenta problemas reales, propone soluciones concretas que no exigen prohibir («None of these measures requires banning») y termina dirigiéndose al concejo antes de la votación.", true]]}]}, {"comp": "ingles", "sim": "pro-3", "ind": "Parte 7: cómo funcionan los audífonos con cancelación de ruido", "tt": "", "texto": "Read the text and choose the best word for each space.\n\nHOW NOISE-CANCELLING HEADPHONES WORK\n\nMany people (1) ___ noise-cancelling headphones on planes, trains and buses. But how do they actually work? Small microphones on the outside of each ear cup pick (2) ___ the sounds around you. A tiny computer inside the headphones then creates a new sound wave that is the exact opposite of that noise. When the two waves meet, they cancel each other (3) ___, and you hear much less.\n\nThis technology works best with steady, low sounds, such as the (4) ___ of an engine. It is less effective with sudden or changing sounds, like voices or a baby crying, so you may still hear the people next to you. Some users say the headphones give them a strange feeling of pressure in their ears, but most people get (5) ___ to it after a while. For frequent travellers, the (6) ___ of arriving at their destination less tired is usually worth the price.", "vis": "", "items": [{"id": "EN3-143", "niv": 1, "cp": "en_p7", "e": "Gap (1)", "f": "Texto original elaborado para este simulacro sobre audífonos, espacio 1", "vis": "", "o": [["A", "dress", "«dress» significa vestir(se) y no lleva como objeto una prenda o accesorio: no se dice «dress headphones».", false], ["B", "wear", "Correcta: con ropa, accesorios y audífonos se usa «wear» (llevar puesto): «people wear headphones».", true], ["C", "put", "«put» necesita un complemento como «on» («put on headphones») y describe la acción de ponérselos, no el hábito de usarlos.", false], ["D", "clothe", "«clothe» significa proveer de ropa a alguien; no se usa con accesorios como los audífonos.", false]]}, {"id": "EN3-144", "niv": 2, "cp": "en_p7", "e": "Gap (2)", "f": "Texto original elaborado para este simulacro sobre audífonos, espacio 2", "vis": "", "o": [["A", "in", "«pick in» no existe como phrasal verb en inglés.", false], ["B", "on", "«pick on» significa molestar o meterse con alguien; no tiene relación con captar sonidos.", false], ["C", "off", "«pick off» significa eliminar o derribar uno por uno; no significa captar sonidos.", false], ["D", "up", "Correcta: «pick up» (captar) se usa para micrófonos o aparatos que detectan sonidos o señales.", true]]}, {"id": "EN3-145", "niv": 2, "cp": "en_p7", "e": "Gap (3)", "f": "Texto original elaborado para este simulacro sobre audífonos, espacio 3", "vis": "", "o": [["A", "out", "Correcta: «cancel each other out» (anularse mutuamente) es la expresión fija para dos fuerzas u ondas opuestas.", true], ["B", "down", "«cancel down» no tiene el sentido de anularse; con «cancel» se usa «out».", false], ["C", "off", "«cancel off» no es una combinación inglesa; el verbo «cancel» con este sentido lleva «out».", false], ["D", "away", "«cancel away» no existe; «away» no forma esta expresión con «cancel».", false]]}, {"id": "EN3-146", "niv": 2, "cp": "en_p7", "e": "Gap (4)", "f": "Texto original elaborado para este simulacro sobre audífonos, espacio 4", "vis": "", "o": [["A", "speech", "«speech» es el habla o un discurso; solo las personas lo producen, no un motor.", false], ["B", "word", "«word» significa palabra; «the word of an engine» no tiene sentido.", false], ["C", "noise", "Correcta: «the noise of an engine» (el ruido de un motor) es la combinación natural para un sonido constante y grave.", true], ["D", "tune", "«tune» significa melodía; un motor no produce una melodía.", false]]}, {"id": "EN3-147", "niv": 2, "cp": "en_p7", "e": "Gap (5)", "f": "Texto original elaborado para este simulacro sobre audífonos, espacio 5", "vis": "", "o": [["A", "usual", "«usual» es un adjetivo (habitual) y no forma la expresión de acostumbrarse.", false], ["B", "used", "Correcta: «get used to something» significa acostumbrarse a algo: la mayoría se acostumbra a la sensación de presión.", true], ["C", "using", "«get using to» es agramatical; la forma correcta es «get used to».", false], ["D", "use", "«get use to» es un error frecuente; la expresión exige el participio «used».", false]]}, {"id": "EN3-148", "niv": 3, "cp": "en_p7", "e": "Gap (6)", "f": "Texto original elaborado para este simulacro sobre audífonos, espacio 6", "vis": "", "o": [["A", "income", "«income» significa ingresos (dinero que se recibe), no la ventaja de llegar menos cansado.", false], ["B", "profit", "«profit» es la ganancia económica de un negocio; llegar descansado no es una ganancia en dinero.", false], ["C", "benefit", "Correcta: «benefit» significa beneficio o ventaja: el beneficio de llegar menos cansado compensa el precio.", true], ["D", "earning", "«earnings» son los ingresos por trabajo; «the earning of arriving» no tiene sentido.", false]]}]}, {"comp": "ingles", "sim": "pro-3", "ind": "Parte 7: biografía de un fotógrafo de naturaleza", "tt": "", "texto": "Read the text and choose the best word for each space.\n\nTHE MAN WHO WAITED FOR JAGUARS\n\nTomás Herrera (1) ___ up in a small village surrounded by forest. As a boy, he spent hours (2) ___ birds and insects through an old pair of binoculars. He saved money for three years to buy his first camera, but his early photos were so blurry that his friends (3) ___ fun of them.\n\nInstead of losing (4) ___, he borrowed books from the village library and taught himself how light and speed work. Years later, a photo of a jaguar drinking at a river caught the (5) ___ of a famous nature magazine, and his career began.\n\n(6) ___ the heat, the insects and the long nights, Tomás still spends weeks in the forest waiting for the perfect picture. But he says that photographs are not his main goal. What he really wants is to (7) ___ awareness of the dangers that jaguars face as their forests disappear.\n\n(Tomás Herrera is a fictional person.)", "vis": "", "items": [{"id": "EN3-149", "niv": 1, "cp": "en_p7", "e": "Gap (1)", "f": "Texto original elaborado para este simulacro sobre un fotógrafo, espacio 1", "vis": "", "o": [["A", "born", "«born» se usa en pasiva («was born in»); «born up» no existe.", false], ["B", "brought", "«bring up» significa criar a un niño y necesita objeto o voz pasiva («was brought up»); «Tomás brought up in» es incorrecto.", false], ["C", "raised", "«raise» significa criar a alguien; habría que decir «was raised in a village», y no se combina con «up».", false], ["D", "grew", "Correcta: «grow up» (crecer, criarse) es el phrasal verb que se usa para hablar de la infancia: «Tomás grew up in a small village».", true]]}, {"id": "EN3-150", "niv": 2, "cp": "en_p7", "e": "Gap (2)", "f": "Texto original elaborado para este simulacro sobre un fotógrafo, espacio 2", "vis": "", "o": [["A", "watching", "Correcta: «spend time + -ing»; «watching birds» significa observar aves con atención durante un tiempo, como se hace con binoculares.", true], ["B", "staring", "«stare» también exige «at» («staring at birds»); sin la preposición la frase es incorrecta.", false], ["C", "glancing", "«glance» significa echar un vistazo rápido, no encaja con pasar horas, y además requiere «at».", false], ["D", "looking", "«look» necesita «at» antes del objeto: «looking at birds»; «looking birds» es incorrecto.", false]]}, {"id": "EN3-151", "niv": 2, "cp": "en_p7", "e": "Gap (3)", "f": "Texto original elaborado para este simulacro sobre un fotógrafo, espacio 3", "vis": "", "o": [["A", "took", "«take fun of» no es una expresión inglesa; es una confusión frecuente con otras colocaciones de «take».", false], ["B", "made", "Correcta: la colocación es «make fun of» (burlarse de): sus amigos se burlaban de las fotos borrosas.", true], ["C", "had", "«have fun» significa divertirse, pero «had fun of them» no significa burlarse de algo.", false], ["D", "did", "«do fun of» no existe; la expresión se forma con «make».", false]]}, {"id": "EN3-152", "niv": 3, "cp": "en_p7", "e": "Gap (4)", "f": "Texto original elaborado para este simulacro sobre un fotógrafo, espacio 4", "vis": "", "o": [["A", "soul", "«lose soul» no es una expresión inglesa para referirse al desánimo.", false], ["B", "eye", "«lose eye» no es una expresión inglesa; con «eye» existen otras como «keep an eye on», que no encajan aquí.", false], ["C", "heart", "Correcta: «lose heart» significa desanimarse; en lugar de desanimarse, aprendió solo sobre luz y velocidad.", true], ["D", "mind", "«lose your mind» significa enloquecer y necesita posesivo («losing his mind»); no expresa desánimo.", false]]}, {"id": "EN3-153", "niv": 3, "cp": "en_p7", "e": "Gap (5)", "f": "Texto original elaborado para este simulacro sobre un fotógrafo, espacio 5", "vis": "", "o": [["A", "care", "«care» significa cuidado o preocupación; «catch the care of» no existe.", false], ["B", "sight", "Se dice «catch sight of something» (alcanzar a ver algo), con la persona como sujeto; «caught the sight of a magazine» no tiene ese sentido.", false], ["C", "look", "«catch the look of» no es una colocación inglesa.", false], ["D", "attention", "Correcta: «catch the attention of» (llamar la atención de) es la colocación usual: la foto llamó la atención de una revista.", true]]}, {"id": "EN3-154", "niv": 3, "cp": "en_p7", "e": "Gap (6)", "f": "Texto original elaborado para este simulacro sobre un fotógrafo, espacio 6", "vis": "", "o": [["A", "Despite", "Correcta: «despite» (a pesar de) va seguido de sustantivos («the heat, the insects and the long nights») y expresa contraste con que siga yendo al bosque.", true], ["B", "Although", "«although» también significa «aunque», pero debe ir seguido de una oración con verbo, no solo de sustantivos.", false], ["C", "Because", "«because» necesita una oración con verbo («because of» iría con sustantivos) y expresa causa, no contraste.", false], ["D", "However", "«however» (sin embargo) conecta dos oraciones y no puede introducir directamente una lista de sustantivos.", false]]}, {"id": "EN3-155", "niv": 3, "cp": "en_p7", "e": "Gap (7)", "f": "Texto original elaborado para este simulacro sobre un fotógrafo, espacio 7", "vis": "", "o": [["A", "lift", "«lift» significa levantar algo físicamente; no se combina con «awareness».", false], ["B", "raise", "Correcta: «raise awareness» (crear conciencia, sensibilizar) es una colocación fija; «raise» es transitivo y lleva objeto.", true], ["C", "rise", "«rise» (subir) es intransitivo y no puede llevar objeto directo; «rise awareness» es un error típico.", false], ["D", "arise", "«arise» (surgir) es intransitivo y no admite objeto directo; «arise awareness» es incorrecto.", false]]}]}];
const CFG = {"titulo": "Simulacro 3 · Saber Pro", "modo": "simulacro", "minutos": 280, "componentes": {"lectura_critica": "Lectura Crítica", "razonamiento_cuantitativo": "Razonamiento Cuantitativo", "competencias_ciudadanas": "Competencias Ciudadanas", "comunicacion_escrita": "Comunicación Escrita", "ingles": "Inglés"}, "competencias": {"lc_local": "Identifica y entiende los contenidos locales", "lc_global": "Comprende cómo se articulan las partes del texto", "lc_reflexion": "Reflexiona a partir del texto y evalúa su contenido", "rc_interpretacion": "Interpretación y representación", "rc_formulacion": "Formulación y ejecución", "rc_argumentacion": "Argumentación", "cc_conocimientos": "Conocimientos", "cc_argumentacion": "Argumentación", "cc_multiperspectivismo": "Multiperspectivismo", "cc_sistemico": "Pensamiento sistémico", "ce_planteamiento": "Planteamiento", "ce_organizacion": "Organización del texto", "ce_expresion": "Forma de expresión", "en_p1": "Parte 1 · Vocabulario (definiciones)", "en_p2": "Parte 2 · Avisos", "en_p3": "Parte 3 · Conversaciones", "en_p4": "Parte 4 · Texto con espacios (gramática)", "en_p5": "Parte 5 · Comprensión literal", "en_p6": "Parte 6 · Comprensión inferencial", "en_p7": "Parte 7 · Texto con espacios (vocabulario y gramática)"}, "niveles": {"1": "Básico", "2": "Intermedio", "3": "Avanzado"}, "instr": {"en_p1": "Parte 1. Relaciona cada descripción con la palabra correcta de la lista (A–H). Hay más palabras de las necesarias.", "en_p2": "Parte 2. ¿Dónde puedes ver cada aviso? Elige el lugar correcto (A, B o C).", "en_p3": "Parte 3. Completa cada conversación con la respuesta más adecuada (A, B o C).", "en_p4": "Parte 4. Lee el texto y elige la palabra correcta para cada espacio (A, B o C).", "en_p5": "Parte 5. Lee el texto y responde según la información que contiene (A, B o C).", "en_p6": "Parte 6. Lee el texto y responde las preguntas (A, B, C o D).", "en_p7": "Parte 7. Lee el texto y elige la palabra correcta para cada espacio (A, B, C o D)."}, "rubrica": [["Planteamiento", ["Respondo la pregunta y tomo una posición clara (de acuerdo, en desacuerdo o parcialmente) desde el primer párrafo.", "Doy al menos dos razones desarrolladas, con ejemplos o datos, y no me limito a repetir el contexto.", "Considero una postura contraria y explico por qué la mía es más sólida."]], ["Organización", ["Mi texto tiene introducción con tesis, desarrollo con un argumento por párrafo y conclusión.", "Uso conectores variados y precisos (además, sin embargo, por lo tanto, en consecuencia, por ejemplo).", "No hay ideas repetidas ni información que no aporte a mi tesis."]], ["Forma de expresión", ["Uso un registro formal y un vocabulario preciso, sin muletillas ni expresiones coloquiales.", "Reviso ortografía, tildes, puntuación y concordancia.", "Mi texto cabe en máximo dos páginas (unas 300 a 500 palabras)."]]], "ensayos": [{"id": "CE-E03", "sim": "pro-3", "tema": "Menos carriles para carros y más espacio para peatones, bicicletas y buses", "contexto": "En varias ciudades se ha propuesto convertir carriles destinados a los carros particulares en ciclorrutas, andenes más anchos o carriles exclusivos para buses. Los defensores de estas obras sostienen que reducen la contaminación, hacen más seguras las calles y favorecen a la mayoría de los ciudadanos, que no se moviliza en carro. Los críticos responden que la medida aumenta los trancones para quienes no tienen alternativa, como los conductores que trabajan con su vehículo o las personas que viven lejos de las rutas de transporte público. Algunos comerciantes temen, además, perder clientes si se eliminan los parqueaderos frente a sus locales.", "pregunta": "¿Está de acuerdo con que las ciudades reduzcan los carriles para carros particulares con el fin de ampliar ciclorrutas, andenes y carriles de transporte público? Escriba un texto argumentativo en el que exponga y justifique su posición.", "ideas": ["¿Cuántas personas mueve un carril con carros frente a uno con buses o bicicletas?", "Seguridad de peatones y ciclistas como usuarios más vulnerables.", "Qué pasa si se quitan carriles sin mejorar el transporte público.", "Efecto de los andenes amplios sobre el comercio de barrio.", "¿Ampliar vías resuelve la congestión de forma duradera?"], "modelo": "Quien ha pasado una hora atrapado en un trancón entiende el enojo que produce ver cómo se cierra un carril para pintar una ciclorruta. Los críticos de estas obras tienen razón en algo importante: si se quitan carriles sin ofrecer alternativas, el resultado será más congestión y más tiempo perdido para quienes dependen del carro, como los conductores que trabajan con su vehículo o las personas que viven lejos de las rutas de buses. Reconozco ese riesgo. Aun así, estoy de acuerdo con que las ciudades reduzcan los carriles para carros particulares con el fin de ampliar ciclorrutas, andenes y carriles de transporte público, porque el reparto actual del espacio es injusto y peligroso, y porque la objeción de los críticos no invalida la medida, sino que indica cómo ejecutarla.\n\nLa primera razón es de equidad. Un carril ocupado por automóviles, muchos de ellos con una sola persona a bordo, mueve bastantes menos personas que el mismo carril usado por buses o bicicletas. Destinar más espacio a estos medios no es castigar a los conductores, sino corregir un reparto que favorece a una minoría. Quien camina, pedalea o viaja en bus también paga impuestos y tiene derecho a desplazarse con seguridad.\n\nLa segunda razón es la protección de la vida. Los peatones y los ciclistas son los usuarios más vulnerables de la vía; cuando comparten el espacio con vehículos que circulan a gran velocidad, cualquier error puede ser mortal. Un andén amplio o una ciclorruta separada físicamente del tráfico reduce ese riesgo de forma concreta. Además, menos carros en circulación significan menos ruido y menos emisiones contaminantes, lo que beneficia incluso a quienes siguen usando su vehículo.\n\nVolvamos, entonces, a la preocupación inicial. La solución no consiste en renunciar a la medida, sino en sincronizarla con la mejora del transporte público: cada carril que se quite debe corresponder a rutas más frecuentes, buses en buen estado y mejores conexiones con los barrios periféricos. También los comerciantes pueden salir ganando, pues quien camina se detiene con más facilidad frente a una vitrina que quien pasa en carro buscando dónde estacionar. Seguir ampliando vías, por el contrario, solo alivia la congestión por un tiempo, porque las nuevas vías terminan atrayendo más tráfico.\n\nEn conclusión, reducir carriles para carros particulares es una decisión justa y necesaria, siempre que avance al mismo ritmo que un transporte público digno. Una ciudad pensada para las personas, y no solo para los vehículos, es más segura, más limpia y más equitativa.", "comentario_modelo": "Planteamiento: la tesis es clara y condicionada («siempre que avance al mismo ritmo que un transporte público digno»), y el texto aporta perspectivas que el contexto no ofrece, como la equidad en el reparto del espacio o el efecto de ampliar vías sobre el tráfico. Organización: a diferencia del esquema más habitual, el texto empieza con una concesión: reconoce el riesgo que señalan los críticos antes de enunciar la tesis, y lo retoma en el cuarto párrafo («Volvamos, entonces, a la preocupación inicial») para convertir esa objeción en una condición de su propia propuesta. Entre ambos momentos, dos razones introducidas con «La primera razón» y «La segunda razón». Forma de expresión: comienza con una situación cotidiana que despierta la empatía del lector, usa léxico preciso (usuarios vulnerables, equidad, reparto), puntúa con corrección el punto y coma y los dos puntos, y cierra con tres adjetivos que resumen los beneficios defendidos.", "debil": "Las ciudades tienen muchos problemas de movilidad y eso afecta a todo el mundo. Hay trancones todo el tiempo y la gente llega tarde al trabajo. Las ciclorrutas reducen la contaminación y hacen más seguras las calles, pero también aumentan los trancones. Los comerciantes temen perder clientes. El transporte público también es muy malo, los buses siempre van llenos y son inseguros, a mí me han robado dos veces en el bus. El gobierno debería poner más policías en los buses y arreglar los huecos de las calles que son un peligro. Todo el mundo sabe que en este país nada funciona bien. Por eso hay que pensar bien las cosas antes de hacerlas.", "comentario_debil": "El texto no responde si está de acuerdo con reducir carriles: describe problemas de movilidad, repite las posturas del contexto y luego se desvía hacia la inseguridad en los buses y los huecos de las calles, temas que no se preguntan. Usa generalizaciones sin sustento («todo el mundo sabe que en este país nada funciona bien») y una conclusión vacía. Las oraciones se suceden sin conectores que muestren la relación entre ellas, en la quinta oración se encadenan tres ideas con comas, y falta la coma explicativa en «los huecos de las calles que son un peligro», que da a entender que solo algunos huecos lo son. Para mejorarlo: formular una tesis en la introducción, elegir dos razones relacionadas con la redistribución del espacio, responder a la objeción de los trancones y concluir retomando la posición."}], "clave": "saber-pro-03.html"};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY = 'sim-saber:' + CFG.clave;
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}

let ST = load();

const ITEMS = [];
DATA.forEach(c => c.items.forEach(it => { it.caso = c; ITEMS.push(it); }));
const keyOf = it => it.o.find(o => o[3])[0];
const palabras = t => (t.trim().match(/\S+/g) || []).length;

function justHTML(it){
  const many = it.o.length > 4;
  return '<div class="just">' + it.o.filter(o => !many || o[3] || ST.r[it.id] === o[0]).map(o => `<div><b>${o[0]}.</b> <span class="${o[3]?'okt':'not'}">${o[3]?'Es correcta.':'Es incorrecta.'}</span> ${esc(o[2])}</div>`).join('') +
    `<div class="src">${esc(CFG.competencias[it.cp])} · Referencia: ${esc(it.f)}</div></div>`;
}
function itemHTML(it, n, mode){
  const r = ST.r[it.id];
  const reveal = mode === 'review' || (CFG.modo === 'practica' && r);
  let h = `<div class="item" id="i-${it.id}"><p class="enun"><span class="n">${n}.</span> <span class="niv">${CFG.niveles[it.niv]}</span> ${esc(it.e)}</p>${it.vis||''}<div class="${it.o.length>4?'ops8':''}">`;
  it.o.forEach(o => {
    let cls = '';
    if (reveal) { if (o[3]) cls = 'ok'; else if (r === o[0]) cls = 'no'; }
    else if (r === o[0]) cls = 'sel';
    h += `<button class="op ${cls}" data-id="${it.id}" data-l="${o[0]}" ${reveal?'disabled':''}><span class="l">${o[0]}.</span><span>${esc(o[1])}</span></button>`;
  });
  h += '</div>';
  if (reveal) {
    if (mode === 'review') h += `<div class="${r===keyOf(it)?'res-ok':'res-no'}" style="font-size:14px;margin-top:4px">${r ? (r===keyOf(it)?'Respondiste ' + r + ': correcto.':'Respondiste ' + r + '. La respuesta correcta es ' + keyOf(it) + '.') : 'Sin responder. La respuesta correcta es ' + keyOf(it) + '.'}</div>`;
    h += justHTML(it);
  }
  return h + '</div>';
}
function renderList(list, mode){
  let h = '', last = null, comp = null, parte = null, n = 0;
  const showMods = CFG.modo !== 'practica' || mode === 'review';
  list.forEach((it, idx) => {
    n++;
    if (it.caso !== last) {
      last = it.caso;
      if (it.caso.comp !== comp) { comp = it.caso.comp; parte = null; if (showMods) h += `<div class="mod" id="m-${comp}">${esc(CFG.componentes[comp])}</div>`; }
      if (comp === 'ingles' && it.cp !== parte) { parte = it.cp; h += `<div class="inst">${esc(CFG.instr[parte])}</div>`; }
      const k = last.items.filter(x => list.includes(x)).length;
      if (k > 1) h += `<div class="inst">Responda las preguntas ${n} a ${n + k - 1} de acuerdo con la siguiente información</div>`;
      let tag = CFG.modo === 'practica' ? CFG.componentes[comp] + (last.tt ? ' · ' + last.tt : '') + (last.ind ? ' · ' + last.ind : '') : (last.tt || '');
      h += `<div class="caso">${tag ? `<div class="tag">${esc(tag)}</div>` : ''}<p>${esc(last.texto)}</p>${last.vis||''}</div>`;
    }
    h += itemHTML(it, n, mode);
  });
  return h;
}

let LIST = [];
let FILTRO = Object.assign({comp:'', cp:'', niv:'', ex:''}, ST.f || {});
function practica(){
  const comps = Object.entries(CFG.componentes).filter(([k]) => ITEMS.some(i => i.caso.comp === k)).map(([k,v]) => `<option value="${k}" ${FILTRO.comp===k?'selected':''}>${esc(v)}</option>`).join('');
  const cps = Object.entries(CFG.competencias).filter(([k]) => ITEMS.some(i => i.cp === k && (!FILTRO.comp || i.caso.comp === FILTRO.comp))).map(([k,v]) => `<option value="${k}" ${FILTRO.cp===k?'selected':''}>${esc(v)}</option>`).join('');
  if (FILTRO.cp && !ITEMS.some(i => i.cp === FILTRO.cp && (!FILTRO.comp || i.caso.comp === FILTRO.comp))) FILTRO.cp = '';
  const nivs = Object.entries(CFG.niveles).map(([k,v]) => `<option value="${k}" ${FILTRO.niv===k?'selected':''}>${esc(v)}</option>`).join('');
  const list = ITEMS.filter(it => (!FILTRO.comp || it.caso.comp===FILTRO.comp) && (!FILTRO.cp || it.cp===FILTRO.cp) && (!FILTRO.niv || String(it.niv)===FILTRO.niv) && (!FILTRO.ex || it.caso.sim.startsWith(FILTRO.ex)));
  const resp = list.filter(it => ST.r[it.id]); const ok = resp.filter(it => ST.r[it.id]===keyOf(it));
  $('#main').innerHTML = `<div class="panel"><p style="margin-top:0">Elige módulo, competencia y dificultad. Al responder verás de inmediato si acertaste y la explicación. Las preguntas de los simulacros también están aquí: si quieres presentarlos «en limpio», hazlos antes de practicar.</p>
  <div class="row"><select id="fc"><option value="">Todos los módulos</option>${comps}</select>
  <select id="fp"><option value="">Todas las competencias</option>${cps}</select>
  <select id="fn"><option value="">Todas las dificultades</option>${nivs}</select>
  <select id="fe"><option value="">Saber Pro y TyT</option><option value="pro" ${FILTRO.ex==='pro'?'selected':''}>Preguntas de los simulacros Saber Pro</option><option value="tyt" ${FILTRO.ex==='tyt'?'selected':''}>Preguntas de los simulacros Saber TyT</option><option value="practica" ${FILTRO.ex==='practica'?'selected':''}>Solo banco extra de práctica</option></select>
  <button class="btn sec" id="borrar">Borrar mis respuestas</button></div>
  <p class="stat" id="pst" style="margin-bottom:0">${list.length} preguntas · respondidas ${resp.length} · aciertos ${ok.length}${resp.length? ' (' + Math.round(100*ok.length/resp.length) + ' %)':''}</p></div>` + renderList(list, 'practica');
  $('#prog').textContent = `${ok.length}/${resp.length} aciertos`;
  [['fc','comp'],['fp','cp'],['fn','niv'],['fe','ex']].forEach(([id,k]) => $('#'+id).onchange = e => { FILTRO[k] = e.target.value; if (k==='comp') FILTRO.cp=''; ST.f = FILTRO; save(); practica(); });
  LIST = list;

}
