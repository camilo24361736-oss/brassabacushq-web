<title>Taller de Comunicación Escrita · Saber Pro y TyT</title>
<style>
:root{--bg:#f7f5f2;--card:#fff;--ink:#1d2433;--mute:#5a6478;--line:#e0dbd4;--pri:#7a2e0b;--pri2:#b0501c;--ok:#0d6b3a;--okbg:#e6f4ec;--no:#9b1c1c;--nobg:#fbeaea;--sel:#f8ece4}
@media (prefers-color-scheme: dark){:root{--bg:#14110f;--card:#1f1a17;--ink:#ece6e1;--mute:#a69c94;--line:#3a322c;--pri:#f0a47a;--pri2:#f5bb98;--ok:#7fd3a3;--okbg:#16301f;--no:#f2a3a3;--nobg:#3a1c1c;--sel:#3a2a20}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overflow-wrap:anywhere}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px}
.hwrap{max-width:860px;margin:0 auto;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;justify-content:space-between}
h1{font-size:17px;margin:0;color:var(--pri)}
h2{color:var(--pri)}
.stat{font-size:14px;color:var(--mute)}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--pri)}
.timer.low{color:var(--no)}
main{max-width:860px;margin:0 auto;padding:16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin:0 0 16px}
.mod{background:var(--pri);color:var(--card);border-radius:10px;padding:10px 14px;margin:28px 0 6px;font-weight:700;font-size:18px}
.inst{font-size:13px;font-weight:700;color:var(--pri);text-transform:uppercase;letter-spacing:.03em;margin:18px 0 4px}
.caso{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--pri);border-radius:10px;padding:14px 16px;margin:10px 0}
.tag{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--pri);font-weight:700}
.caso p{margin:6px 0 0;white-space:pre-line}
.item{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0}
.enun{margin:0 0 8px;white-space:pre-line}
.n{font-weight:700;color:var(--pri)}
.niv{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-right:4px;white-space:nowrap}
.op{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:6px 0;cursor:pointer;background:transparent;width:100%;text-align:left;color:inherit;font:inherit}
.ops8{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.ops8 .op{margin:0}
.op:hover{border-color:var(--pri2)}
.op .l{font-weight:700;min-width:20px}
.op.sel{background:var(--sel);border-color:var(--pri2)}
.op.ok{background:var(--okbg);border-color:var(--ok)}
.op.no{background:var(--nobg);border-color:var(--no)}
.op[disabled]{cursor:default}
.just{font-size:14px;margin:8px 0 0;padding:8px 10px;border-top:1px dashed var(--line)}
.just div{margin:4px 0}
.just .okt{color:var(--ok);font-weight:700}
.just .not{color:var(--no);font-weight:700}
.src{font-size:13px;color:var(--mute);margin-top:6px}
button.btn{background:var(--pri);color:var(--card);border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer}
button.btn.sec{background:transparent;color:var(--pri);border:1px solid var(--pri)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
select{font:inherit;padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);max-width:100%}
table{border-collapse:collapse;width:100%;font-size:15px}
td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.sub td{font-size:13px;color:var(--mute);padding-left:22px}
.vt{width:auto;max-width:100%;margin:10px 0;font-size:14px;display:block;overflow-x:auto}
.vt caption{text-align:left;font-weight:700;padding-bottom:4px}
.vt th,.vt td{border:1px solid var(--line);padding:4px 8px}
.vt th{background:var(--sel)}
.vnota{font-size:12px;color:var(--mute)}
.vfig{margin:10px 0}
.vfig svg{width:100%;max-width:560px;height:auto;border-radius:6px;border:1px solid var(--line);background:#fff}
.big{font-size:40px;font-weight:800;color:var(--pri);line-height:1.1}
.aviso{font-size:13px;color:var(--mute)}
.hide{display:none !important}
.res-ok{color:var(--ok);font-weight:700}.res-no{color:var(--no);font-weight:700}
textarea{width:100%;min-height:320px;font:inherit;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);resize:vertical}
.chk label{display:flex;gap:8px;align-items:flex-start;margin:6px 0;font-size:15px}
.chk input{margin-top:4px;width:18px;height:18px;flex:none}
.modelo{white-space:pre-line;background:var(--bg);border-radius:8px;padding:10px 12px;margin:6px 0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal .panel{max-width:420px}
.nav{padding:6px 0;display:flex;gap:6px;flex-wrap:wrap}
.nav a{font-size:13px;color:var(--pri);border:1px solid var(--line);border-radius:999px;padding:3px 10px;text-decoration:none;background:var(--card)}
footer{max-width:860px;margin:0 auto;padding:8px 16px 40px;font-size:12px;color:var(--mute)}
</style>

<script>
const DATA = [];
const CFG = {"titulo": "Taller de Comunicación Escrita · Saber Pro y TyT", "modo": "escritura", "minutos": 0, "componentes": {"lectura_critica": "Lectura Crítica", "razonamiento_cuantitativo": "Razonamiento Cuantitativo", "competencias_ciudadanas": "Competencias Ciudadanas", "comunicacion_escrita": "Comunicación Escrita", "ingles": "Inglés"}, "competencias": {"lc_local": "Identifica y entiende los contenidos locales", "lc_global": "Comprende cómo se articulan las partes del texto", "lc_reflexion": "Reflexiona a partir del texto y evalúa su contenido", "rc_interpretacion": "Interpretación y representación", "rc_formulacion": "Formulación y ejecución", "rc_argumentacion": "Argumentación", "cc_conocimientos": "Conocimientos", "cc_argumentacion": "Argumentación", "cc_multiperspectivismo": "Multiperspectivismo", "cc_sistemico": "Pensamiento sistémico", "ce_planteamiento": "Planteamiento", "ce_organizacion": "Organización del texto", "ce_expresion": "Forma de expresión", "en_p1": "Parte 1 · Vocabulario (definiciones)", "en_p2": "Parte 2 · Avisos", "en_p3": "Parte 3 · Conversaciones", "en_p4": "Parte 4 · Texto con espacios (gramática)", "en_p5": "Parte 5 · Comprensión literal", "en_p6": "Parte 6 · Comprensión inferencial", "en_p7": "Parte 7 · Texto con espacios (vocabulario y gramática)"}, "niveles": {"1": "Básico", "2": "Intermedio", "3": "Avanzado"}, "instr": {"en_p1": "Parte 1. Relaciona cada descripción con la palabra correcta de la lista (A–H). Hay más palabras de las necesarias.", "en_p2": "Parte 2. ¿Dónde puedes ver cada aviso? Elige el lugar correcto (A, B o C).", "en_p3": "Parte 3. Completa cada conversación con la respuesta más adecuada (A, B o C).", "en_p4": "Parte 4. Lee el texto y elige la palabra correcta para cada espacio (A, B o C).", "en_p5": "Parte 5. Lee el texto y responde según la información que contiene (A, B o C).", "en_p6": "Parte 6. Lee el texto y responde las preguntas (A, B, C o D).", "en_p7": "Parte 7. Lee el texto y elige la palabra correcta para cada espacio (A, B, C o D)."}, "rubrica": [["Planteamiento", ["Respondo la pregunta y tomo una posición clara (de acuerdo, en desacuerdo o parcialmente) desde el primer párrafo.", "Doy al menos dos razones desarrolladas, con ejemplos o datos, y no me limito a repetir el contexto.", "Considero una postura contraria y explico por qué la mía es más sólida."]], ["Organización", ["Mi texto tiene introducción con tesis, desarrollo con un argumento por párrafo y conclusión.", "Uso conectores variados y precisos (además, sin embargo, por lo tanto, en consecuencia, por ejemplo).", "No hay ideas repetidas ni información que no aporte a mi tesis."]], ["Forma de expresión", ["Uso un registro formal y un vocabulario preciso, sin muletillas ni expresiones coloquiales.", "Reviso ortografía, tildes, puntuación y concordancia.", "Mi texto cabe en máximo dos páginas (unas 300 a 500 palabras)."]]], "ensayos": [{"id": "CE-E01", "sim": "pro-1", "tema": "Inteligencia artificial en los trabajos universitarios", "contexto": "Las herramientas de inteligencia artificial generativa pueden redactar ensayos, resumir lecturas y resolver ejercicios en pocos segundos. Su llegada ha dividido a las comunidades universitarias. Algunos profesores proponen prohibirlas en todos los trabajos académicos, pues consideran que impiden que el estudiante aprenda a pensar y a escribir por sí mismo, y que facilitan el plagio. Otros sostienen que estas herramientas ya forman parte del mundo laboral y que la universidad debe enseñar a usarlas con criterio, por ejemplo, exigiendo que el estudiante declare cómo las empleó. Un tercer grupo propone permitirlas solo en ciertas etapas, como la búsqueda de ideas, y evaluar con más pruebas orales y escritas presenciales.", "pregunta": "¿Está de acuerdo con que las universidades prohíban el uso de la inteligencia artificial generativa en todos los trabajos académicos? Escriba un texto argumentativo en el que exponga y justifique su posición.", "ideas": ["¿Es posible comprobar que un estudiante no usó estas herramientas? ¿Qué pasa con una norma que no se puede verificar?", "Qué habilidades necesita un profesional que trabajará con asistentes automáticos.", "El riesgo de que el estudiante deje de practicar la escritura y el razonamiento.", "Formas de evaluar que muestren el proceso y no solo el producto final.", "Diferencias entre cursos: no es lo mismo una clase de redacción que una de programación."], "modelo": "Cada vez que aparece una tecnología capaz de hacer en segundos lo que antes tomaba horas, surge la tentación de prohibirla. Ocurrió, en su momento, con la calculadora en las clases de matemáticas y ocurre hoy con la inteligencia artificial generativa en las universidades. Sin embargo, considero que prohibirla en todos los trabajos académicos sería un error: la universidad no debe cerrarle la puerta a esta herramienta, sino enseñar a usarla con honestidad y criterio.\n\nEn primer lugar, una prohibición total es prácticamente imposible de hacer cumplir. Los textos producidos por estas herramientas no siempre se distinguen de los escritos por una persona, y los programas que prometen detectarlos se equivocan con frecuencia. Una regla que no puede verificarse termina castigando al estudiante honesto, que la respeta, y premiando al que la ignora sin ser descubierto. Además, convierte la relación entre profesores y estudiantes en una persecución basada en la sospecha.\n\nEn segundo lugar, la formación profesional debe preparar para el mundo en el que los egresados trabajarán. Un ingeniero, un abogado o un comunicador usarán, con toda probabilidad, asistentes de inteligencia artificial en su trabajo diario. Si la universidad se niega a abordar el tema, sus estudiantes aprenderán solos y sin orientación ética: no sabrán verificar la información que reciben, reconocer los sesgos de una respuesta automática ni dar crédito adecuadamente al aporte de una máquina.\n\nEs cierto que quienes defienden la prohibición tienen una preocupación legítima: si una máquina escribe el ensayo, el estudiante no aprende a argumentar. No obstante, este riesgo no se resuelve con una prohibición, sino con un cambio en la manera de evaluar. Un profesor puede pedir que el estudiante entregue sus borradores, que explique oralmente las decisiones de su texto o que escriba en clase una parte del trabajo. Del mismo modo, puede exigir que se declare qué herramienta se usó, para qué y cómo se verificaron sus resultados. Así, la tecnología deja de ser un atajo oculto y se convierte en objeto de reflexión.\n\nPor supuesto, habrá cursos en los que limitar el uso de estas herramientas tenga sentido, como aquellos cuyo propósito es precisamente aprender a redactar sin ayuda. Pero esa decisión debe tomarse curso por curso, según los objetivos de aprendizaje, y no mediante una regla general para toda la universidad.\n\nEn conclusión, prohibir la inteligencia artificial generativa en todos los trabajos académicos ofrecería una falsa sensación de control y dejaría a los estudiantes sin la formación que más necesitan. La tarea de la universidad no es proteger a sus estudiantes de las herramientas de su época, sino formar personas capaces de usarlas sin renunciar a pensar por sí mismas.", "comentario_modelo": "Planteamiento: la tesis aparece al final del primer párrafo y responde directamente la pregunta (está en desacuerdo con la prohibición total y propone una alternativa). Además, aporta una perspectiva que el contexto no menciona: la imposibilidad de verificar la norma y su efecto injusto sobre el estudiante honesto. Organización: introducción, dos argumentos encabezados por «En primer lugar» y «En segundo lugar», un párrafo de contraargumento y refutación («Es cierto que…», «No obstante…»), una concesión limitada («Por supuesto…») y una conclusión que retoma la tesis. Forma de expresión: registro formal, vocabulario preciso, ejemplos concretos (borradores, sustentación oral) y una comparación histórica con la calculadora que hace el texto más persuasivo.", "debil": "La inteligencia artificial es un tema muy importante hoy en día ya que todos los estudiantes la usan. Algunos profesores dicen que hay que prohibirla porque impide que el estudiante aprenda a pensar y facilita el plagio, otros dicen que ya forma parte del mundo laboral y que hay que enseñar a usarla. Las dos posiciones tienen razón. La tecnología avanza muy rapido y no se puede detener. Los jóvenes de ahora todo lo hacen con el celular y con la inteligencia artificial y eso tiene cosas buenas y cosas malas. Hay que tener cuidado porque a veces la inteligencia artificial se equivoca. En conclusión la inteligencia artificial es una herramienta que puede ser buena o mala dependiendo de como se use y cada quien debe decidir.", "comentario_debil": "El texto es impertinente: nunca dice si está de acuerdo o no con la prohibición, y afirmar que «las dos posiciones tienen razón» no es una postura parcial argumentada, sino una evasión. La segunda oración copia casi literalmente el contexto. Generaliza sin pruebas («todos los estudiantes la usan», «los jóvenes de ahora todo lo hacen con el celular») y pasa de una idea a otra sin conectores. Tiene errores de tildación («rapido» por «rápido», «como» por «cómo»), une oraciones independientes con coma omite la coma antes de la causal «ya que» («hoy en día, ya que todos…») y la coma después de «En conclusión». Para mejorarlo: tomar posición en el primer párrafo, desarrollar dos razones propias con ejemplos, responder a la postura contraria y cerrar retomando la tesis."}, {"id": "CE-E02", "sim": "pro-2", "tema": "Celulares en los colegios", "contexto": "En varios países se discute si los estudiantes de colegio deben poder llevar y usar teléfonos celulares durante la jornada escolar. Quienes apoyan una prohibición afirman que el celular distrae en clase, favorece el ciberacoso y reduce el juego y la conversación en los descansos. Algunos padres, en cambio, consideran que el teléfono es necesario para comunicarse con sus hijos en caso de emergencia. Ciertos docentes, por su parte, lo usan como herramienta pedagógica para consultar información, tomar fotografías en salidas de campo o resolver cuestionarios en línea. También se discute si la norma debe ser igual para todos los colegios o si cada institución debe definir sus propias reglas.", "pregunta": "¿Está de acuerdo con que se prohíba el uso de teléfonos celulares durante toda la jornada escolar en los colegios? Escriba un texto argumentativo en el que exponga y justifique su posición.", "ideas": ["Qué exige la concentración en clase y cómo interfieren las notificaciones.", "El descanso como espacio para aprender a convivir.", "Cómo resolver las emergencias familiares sin que el estudiante tenga el teléfono en la mano.", "Usos pedagógicos de la tecnología: ¿requieren el celular personal?", "Ventajas y desventajas de una regla institucional frente a reglas de cada docente."], "modelo": "Hace apenas veinte años, un descanso escolar era sinónimo de balones, gritos y conversaciones. Hoy, en muchos colegios, es frecuente ver grupos de estudiantes sentados en silencio, cada uno frente a su pantalla. Por esta razón, estoy de acuerdo con que se prohíba el uso, no el porte, de teléfonos celulares durante toda la jornada escolar, siempre que la medida se aplique con reglas claras y con alternativas para las situaciones que realmente requieran el teléfono, como las emergencias.\n\nEl primer argumento a favor de la prohibición es la atención. Aprender exige concentrarse durante periodos prolongados, y muchas aplicaciones del celular están diseñadas justamente para interrumpir: cada notificación compite con la explicación del profesor. Pedirle a un adolescente que tenga el teléfono sobre el pupitre y no lo mire es como pedirle a alguien que estudie con el televisor encendido. Guardar el aparato durante toda la jornada elimina esa tentación y libera al docente de la tarea agotadora de vigilar pantallas.\n\nEl segundo argumento tiene que ver con la convivencia. El colegio no es solo un lugar para aprender contenidos, sino también un espacio para aprender a relacionarse con otros. Los descansos sin celular obligan a conversar, a jugar y a resolver conflictos cara a cara. Además, reducir el uso del teléfono en la institución dificulta prácticas dañinas, como grabar a un compañero sin su permiso y difundir el video en redes sociales.\n\nQuienes se oponen a la medida señalan que los padres necesitan comunicarse con sus hijos en caso de emergencia. Es una preocupación comprensible, pero tiene solución: el estudiante puede llevar el teléfono, guardarlo apagado al llegar y recuperarlo a la salida, mientras que las familias pueden llamar a la secretaría del colegio ante cualquier urgencia. Tampoco resulta convincente el argumento pedagógico. Si un profesor necesita consultar información en línea o aplicar un cuestionario digital, el colegio puede ofrecer tabletas o computadores en una sala dispuesta para ello, de modo que la tecnología se use con un propósito definido y no como una distracción permanente.\n\nPor último, una norma general tiene la ventaja de la claridad. Cuando cada docente decide en su clase, los estudiantes ponen a prueba los límites todos los días, y los profesores más estrictos terminan vistos como los villanos. Una regla institucional, conocida por familias y estudiantes desde el comienzo del año, evita discusiones constantes.\n\nEn síntesis, prohibir el celular durante la jornada escolar no significa rechazar la tecnología, sino recuperar el colegio como un lugar para concentrarse y convivir. Los teléfonos seguirán ahí al terminar la jornada; las horas de clase y los descansos compartidos, en cambio, no se recuperan.", "comentario_modelo": "Planteamiento: el primer párrafo toma una posición explícita («estoy de acuerdo… siempre que…») y la delimita: se prohíbe el uso, no el porte, y se prevén alternativas para las emergencias. El texto no se limita a repetir el contexto: responde una por una las objeciones de padres y docentes con soluciones concretas (secretaría del colegio, sala de tabletas). Organización: cada párrafo desarrolla una sola idea anunciada en su primera oración («El primer argumento…», «El segundo argumento…», «Por último…»), y el contraargumento se refuta antes de la conclusión. Forma de expresión: registro formal, comparación eficaz (estudiar con el televisor encendido), uso correcto del punto y coma y un cierre con contraste («en cambio») que deja una idea memorable.", "debil": "Yo pienso que el celular tiene ventajas y desventajas. Por un lado el celular distrae en clase y favorece el ciberacoso pero por otro lado los padres necesitan comunicarse con sus hijos en caso de emergencia. Ademas los docentes lo usan como herramienta pedagógica. Los estudiantes de hoy en día son adictos al celular y no hacen nada más. Cuando yo estaba en el colegio habían muchos problemas con eso, una vez a un compañero le robaron el celular en el descanso y nadie hizo nada. Por eso los colegios deben tener más seguridad y vigilancia. En conclusión cada colegio debe ver que hace con el celular.", "comentario_debil": "No toma posición frente a la prohibición: enumera ventajas y desventajas copiadas del contexto y termina con una frase vaga («cada colegio debe ver que hace con el celular»). Generaliza sin fundamento («son adictos al celular y no hacen nada más») y se desvía hacia otro tema, la seguridad y los robos, que no responde la pregunta. Tiene errores de norma: «Ademas» sin tilde, «habían muchos problemas» (debe ser «había»), «que» sin tilde en la interrogativa indirecta, falta de coma antes de «pero» y después de «Por un lado» y «En conclusión», y una coma que une dos oraciones independientes («…con eso, una vez a un compañero…»). Para mejorarlo: decidir si está de acuerdo, en desacuerdo o parcialmente de acuerdo, justificarlo con dos razones desarrolladas y responder a la objeción más fuerte."}, {"id": "CE-E03", "sim": "pro-3", "tema": "Menos carriles para carros y más espacio para peatones, bicicletas y buses", "contexto": "En varias ciudades se ha propuesto convertir carriles destinados a los carros particulares en ciclorrutas, andenes más anchos o carriles exclusivos para buses. Los defensores de estas obras sostienen que reducen la contaminación, hacen más seguras las calles y favorecen a la mayoría de los ciudadanos, que no se moviliza en carro. Los críticos responden que la medida aumenta los trancones para quienes no tienen alternativa, como los conductores que trabajan con su vehículo o las personas que viven lejos de las rutas de transporte público. Algunos comerciantes temen, además, perder clientes si se eliminan los parqueaderos frente a sus locales.", "pregunta": "¿Está de acuerdo con que las ciudades reduzcan los carriles para carros particulares con el fin de ampliar ciclorrutas, andenes y carriles de transporte público? Escriba un texto argumentativo en el que exponga y justifique su posición.", "ideas": ["¿Cuántas personas mueve un carril con carros frente a uno con buses o bicicletas?", "Seguridad de peatones y ciclistas como usuarios más vulnerables.", "Qué pasa si se quitan carriles sin mejorar el transporte público.", "Efecto de los andenes amplios sobre el comercio de barrio.", "¿Ampliar vías resuelve la congestión de forma duradera?"], "modelo": "Quien ha pasado una hora atrapado en un trancón entiende el enojo que produce ver cómo se cierra un carril para pintar una ciclorruta. Los críticos de estas obras tienen razón en algo importante: si se quitan carriles sin ofrecer alternativas, el resultado será más congestión y más tiempo perdido para quienes dependen del carro, como los conductores que trabajan con su vehículo o las personas que viven lejos de las rutas de buses. Reconozco ese riesgo. Aun así, estoy de acuerdo con que las ciudades reduzcan los carriles para carros particulares con el fin de ampliar ciclorrutas, andenes y carriles de transporte público, porque el reparto actual del espacio es injusto y peligroso, y porque la objeción de los críticos no invalida la medida, sino que indica cómo ejecutarla.\n\nLa primera razón es de equidad. Un carril ocupado por automóviles, muchos de ellos con una sola persona a bordo, mueve bastantes menos personas que el mismo carril usado por buses o bicicletas. Destinar más espacio a estos medios no es castigar a los conductores, sino corregir un reparto que favorece a una minoría. Quien camina, pedalea o viaja en bus también paga impuestos y tiene derecho a desplazarse con seguridad.\n\nLa segunda razón es la protección de la vida. Los peatones y los ciclistas son los usuarios más vulnerables de la vía; cuando comparten el espacio con vehículos que circulan a gran velocidad, cualquier error puede ser mortal. Un andén amplio o una ciclorruta separada físicamente del tráfico reduce ese riesgo de forma concreta. Además, menos carros en circulación significan menos ruido y menos emisiones contaminantes, lo que beneficia incluso a quienes siguen usando su vehículo.\n\nVolvamos, entonces, a la preocupación inicial. La solución no consiste en renunciar a la medida, sino en sincronizarla con la mejora del transporte público: cada carril que se quite debe corresponder a rutas más frecuentes, buses en buen estado y mejores conexiones con los barrios periféricos. También los comerciantes pueden salir ganando, pues quien camina se detiene con más facilidad frente a una vitrina que quien pasa en carro buscando dónde estacionar. Seguir ampliando vías, por el contrario, solo alivia la congestión por un tiempo, porque las nuevas vías terminan atrayendo más tráfico.\n\nEn conclusión, reducir carriles para carros particulares es una decisión justa y necesaria, siempre que avance al mismo ritmo que un transporte público digno. Una ciudad pensada para las personas, y no solo para los vehículos, es más segura, más limpia y más equitativa.", "comentario_modelo": "Planteamiento: la tesis es clara y condicionada («siempre que avance al mismo ritmo que un transporte público digno»), y el texto aporta perspectivas que el contexto no ofrece, como la equidad en el reparto del espacio o el efecto de ampliar vías sobre el tráfico. Organización: a diferencia del esquema más habitual, el texto empieza con una concesión: reconoce el riesgo que señalan los críticos antes de enunciar la tesis, y lo retoma en el cuarto párrafo («Volvamos, entonces, a la preocupación inicial») para convertir esa objeción en una condición de su propia propuesta. Entre ambos momentos, dos razones introducidas con «La primera razón» y «La segunda razón». Forma de expresión: comienza con una situación cotidiana que despierta la empatía del lector, usa léxico preciso (usuarios vulnerables, equidad, reparto), puntúa con corrección el punto y coma y los dos puntos, y cierra con tres adjetivos que resumen los beneficios defendidos.", "debil": "Las ciudades tienen muchos problemas de movilidad y eso afecta a todo el mundo. Hay trancones todo el tiempo y la gente llega tarde al trabajo. Las ciclorrutas reducen la contaminación y hacen más seguras las calles, pero también aumentan los trancones. Los comerciantes temen perder clientes. El transporte público también es muy malo, los buses siempre van llenos y son inseguros, a mí me han robado dos veces en el bus. El gobierno debería poner más policías en los buses y arreglar los huecos de las calles que son un peligro. Todo el mundo sabe que en este país nada funciona bien. Por eso hay que pensar bien las cosas antes de hacerlas.", "comentario_debil": "El texto no responde si está de acuerdo con reducir carriles: describe problemas de movilidad, repite las posturas del contexto y luego se desvía hacia la inseguridad en los buses y los huecos de las calles, temas que no se preguntan. Usa generalizaciones sin sustento («todo el mundo sabe que en este país nada funciona bien») y una conclusión vacía. Las oraciones se suceden sin conectores que muestren la relación entre ellas, en la quinta oración se encadenan tres ideas con comas, y falta la coma explicativa en «los huecos de las calles que son un peligro», que da a entender que solo algunos huecos lo son. Para mejorarlo: formular una tesis en la introducción, elegir dos razones relacionadas con la redistribución del espacio, responder a la objeción de los trancones y concluir retomando la posición."}, {"id": "CE-E04", "sim": "tyt-1", "tema": "Semana laboral de cuatro días", "contexto": "En algunos países y empresas se ha ensayado una semana laboral de cuatro días: los empleados trabajan cuatro días, por ejemplo de lunes a jueves, y conservan su salario. Algunas de las empresas que la han probado reportan trabajadores menos cansados y menos ausencias por enfermedad. Sus críticos advierten que no todos los sectores pueden adoptarla: un hospital, un restaurante o una planta de producción continua necesitan personal todos los días, y comprimir las mismas tareas en menos días podría generar jornadas más largas y agotadoras. Otros temen que los costos aumenten para las pequeñas empresas, que tienen menos margen para contratar personal adicional.", "pregunta": "¿Está de acuerdo con que las empresas adopten una semana laboral de cuatro días sin reducir el salario de sus trabajadores? Escriba un texto argumentativo en el que exponga y justifique su posición.", "ideas": ["Relación entre descanso, errores y accidentes de trabajo.", "Tareas que podrían eliminarse o automatizarse si se dispone de un día menos.", "Sectores que no pueden detenerse un día a la semana.", "Costos para una pequeña empresa que debe contratar más personal.", "Alternativas: periodos de prueba, turnos rotativos, jornadas flexibles."], "modelo": "¿Se puede trabajar un día menos sin ganar menos y sin que la empresa pierda? La pregunta habría parecido absurda hace unas décadas, pero algunas organizaciones ya lo han ensayado con resultados alentadores. Mi respuesta es que estoy de acuerdo con que las empresas adopten la semana laboral de cuatro días sin reducir salarios, pero solo si se cumplen tres condiciones: que el trabajo pueda medirse por resultados, que la jornada diaria no se alargue hasta el agotamiento y que la medida se ensaye antes de volverse permanente.\n\nLa primera condición depende de la naturaleza de cada actividad. En una oficina de diseño, de soporte técnico o de contabilidad, lo que importa es que las tareas se cumplan con calidad, no el número de horas que el empleado pasa frente al escritorio. Allí, un día adicional de descanso puede traducirse en personas más concentradas y en menos errores. Además, la empresa que ofrece esta condición se vuelve más atractiva para el personal calificado, lo cual reduce los costos de contratar y capacitar a nuevos empleados. En cambio, en un hospital, en un restaurante o en una planta que opera las veinticuatro horas, el servicio no puede detenerse un día a la semana; conservar el salario y reducir los días implicaría contratar más personal, un costo que muchas empresas, y en especial las pequeñas, difícilmente pueden asumir. Para esos sectores, el descanso debería buscarse por otras vías, como turnos rotativos que garanticen pausas más largas.\n\nLa segunda condición evita que la reforma se convierta en una trampa. Si una empresa se limita a comprimir las mismas horas en cuatro días, producirá turnos de diez o doce horas y, con ellos, más cansancio y más riesgo de accidentes, justo lo contrario de lo que se busca. La semana corta solo tiene sentido si obliga a revisar la forma de trabajar: eliminar reuniones innecesarias, procesos repetidos y tareas que podrían automatizarse.\n\nLa tercera condición es la prudencia. Las empresas interesadas deberían adoptar la semana de cuatro días durante un periodo de prueba, medir sus resultados en productividad, ausentismo y satisfacción de los clientes, y decidir con base en esos datos. Así, la decisión no dependería del entusiasmo de los directivos ni del temor a perder dinero, sino de la evidencia.\n\nEn síntesis, la semana de cuatro días es una idea valiosa, pero no una fórmula universal. Si se cumplen estas tres condiciones, las empresas podrán aprovechar sus beneficios sin poner en riesgo los empleos ni los servicios que la sociedad necesita todos los días.", "comentario_modelo": "Planteamiento: la postura es parcial y está definida por tres condiciones explícitas que el lector conoce desde el primer párrafo; todo el texto se mantiene fiel a ellas. Aporta ideas que no están en el contexto, como el incentivo para eliminar tareas innecesarias o los costos de reemplazar personal. Organización: en lugar de la secuencia «argumento, argumento, objeción», el texto abre con una pregunta y dedica un párrafo a cada condición («La primera condición…», «La segunda…», «La tercera…»); las objeciones del contexto (sectores de servicio continuo, pequeñas empresas, jornadas agotadoras) se responden dentro de las condiciones que las resuelven. Forma de expresión: ejemplos de áreas de trabajo concretas, cercanas al mundo técnico y laboral; vocabulario preciso (ausentismo, servicio continuo, turnos rotativos) y un uso correcto de los dos puntos para anunciar las condiciones y del punto y coma para separar oraciones relacionadas.", "debil": "El trabajo es muy importante para las personas porque con eso mantienen a sus familias. Hoy en día las empresas explotan a los trabajadores y no les importa nada. La semana de cuatro días es una buena idea porque uno descansa más. Pero también hay sectores como los hospitales y restaurantes que necesitan personal todos los días. Y las pequeñas empresas tienen menos margen. Y los costos aumentan. Yo trabajo en un taller y mi jefe nunca nos da permisos, ni siquiera cuando uno está enfermo, eso es injusto y debería haber más control del ministerio. En fin, es un tema complicado que tiene muchos puntos de vista.", "comentario_debil": "Empieza con una idea favorable («es una buena idea porque uno descansa más»), pero enseguida enumera las objeciones del contexto sin responderlas, de modo que el lector no sabe cuál es la posición final; el cierre («es un tema complicado») confirma la falta de postura. Generaliza de forma injusta («las empresas explotan a los trabajadores») y se desvía hacia una queja personal sobre los permisos en el taller. Abusa de «Y» al inicio de oración en lugar de usar conectores precisos, y une ideas distintas con comas («…cuando uno está enfermo, eso es injusto…»). Para mejorarlo: decidir si está de acuerdo, en desacuerdo o parcialmente de acuerdo, explicar con un ejemplo laboral por qué, y responder a la objeción de los sectores que no pueden parar."}, {"id": "CE-E05", "sim": "tyt-2", "tema": "Experiencia exigida a recién egresados", "contexto": "Muchos técnicos y tecnólogos recién graduados encuentran ofertas de empleo que piden uno o dos años de experiencia. Algunas empresas explican que necesitan personal capaz de rendir desde el primer día, pues no cuentan con tiempo ni recursos para entrenar. Los egresados responden que es imposible ganar experiencia si nadie les da la primera oportunidad. Algunos proponen que las prácticas, los proyectos de grado y los trabajos independientes se reconozcan como experiencia; otros sugieren que el Estado ofrezca incentivos a las empresas que contraten a jóvenes sin experiencia.", "pregunta": "¿Está de acuerdo con que las empresas exijan experiencia laboral previa a los técnicos y tecnólogos recién egresados? Escriba un texto argumentativo en el que exponga y justifique su posición.", "ideas": ["El componente práctico de la formación técnica y tecnológica.", "Otras formas de comprobar habilidades: pruebas técnicas, periodo de prueba.", "Qué gana una empresa al formar a un egresado y qué pierde si nunca lo hace.", "Cargos en los que la experiencia sí es indispensable.", "El costo de una vacante abierta durante meses."], "modelo": "Pocas situaciones resultan tan frustrantes para un recién graduado como leer una oferta de empleo que parece escrita para él, salvo por una línea: «Experiencia mínima de dos años». Se trata de un círculo vicioso: no se consigue empleo sin experiencia, y no se adquiere experiencia sin empleo. Por eso, estoy en desacuerdo con que las empresas exijan experiencia laboral previa a los técnicos y tecnólogos recién egresados, al menos para los cargos de entrada.\n\nEn primer lugar, la formación técnica y tecnológica ya incluye un componente práctico. Un tecnólogo en mantenimiento electrónico o un técnico en cocina suele haber pasado cientos de horas en talleres, laboratorios y prácticas en empresas reales. Exigirle además dos años de experiencia equivale a desconocer ese aprendizaje y a tratar el título como si no certificara nada. Si una empresa duda de las habilidades de un candidato, tiene herramientas más justas para comprobarlas, como una prueba técnica o un periodo de prueba.\n\nEn segundo lugar, la exigencia perjudica a las propias empresas. Al cerrarles la puerta a los recién egresados, renuncian a personas que llegan con conocimientos actualizados, disposición para aprender y menos vicios adquiridos. Además, un joven al que se le da la primera oportunidad puede desarrollar un sentido de pertenencia que reduce la rotación. Contratar a alguien con experiencia puede parecer más eficiente a corto plazo, pero una empresa que nunca forma a nadie depende siempre de lo que otros hayan formado.\n\nLas empresas argumentan que no tienen tiempo ni recursos para entrenar personal. Este argumento merece atención, sobre todo en el caso de los pequeños negocios. No obstante, el entrenamiento de un egresado técnico no parte de cero: se trata de adaptar a la rutina de la empresa a alguien que ya domina los fundamentos del oficio. Asignarle un compañero con experiencia durante las primeras semanas cuesta mucho menos que mantener una vacante abierta durante meses mientras aparece el candidato ideal.\n\nDesde luego, hay cargos en los que la experiencia es indispensable, como la supervisión de una obra o la dirección de un equipo de trabajo. En esos casos, pedirla es razonable. El problema aparece cuando el requisito se vuelve una costumbre y se aplica incluso a puestos de auxiliar o asistente, que, por su naturaleza, deberían ser la puerta de entrada al mundo laboral.\n\nEn conclusión, exigir experiencia a quien acaba de terminar su formación es cerrarle la única puerta por la que puede adquirirla. Las empresas que reconocen las prácticas, evalúan habilidades concretas y asumen una parte del entrenamiento no les hacen un favor a los jóvenes: invierten en su propio futuro.", "comentario_modelo": "Planteamiento: la tesis responde la pregunta y precisa su alcance («al menos para los cargos de entrada»); la idea del «círculo vicioso» resume el problema con claridad. El texto aporta argumentos que el contexto no menciona, como el costo de una vacante abierta o la existencia de pruebas técnicas para verificar habilidades. Organización: dos argumentos introducidos con ordinales («En primer lugar», «En segundo lugar»), un párrafo que responde a la objeción de las empresas («No obstante…»), una concesión que delimita la tesis («Desde luego…») y una conclusión que retoma la imagen de la puerta. Forma de expresión: ejemplos de oficios técnicos concretos, vocabulario preciso, uso correcto de los dos puntos y de las comillas para citar la oferta de empleo, y un cierre con un giro persuasivo («no les hacen un favor a los jóvenes: invierten en su propio futuro»).", "debil": "Las empresas necesitan personal capaz de rendir desde el primer día. Pero los egresados dicen que es imposible ganar experiencia si nadie les da la primera oportunidad. Es un problema muy grave en el país, la juventud está sin empleo y eso genera delincuencia, drogas y muchos problemas sociales. Los jóvenes de hoy no quieren trabajar y solo quieren estar en redes sociales. Las empresas deberían ser más conscientes. Tambien el estado debería ayudar. En mi barrio hay muchos muchachos que estudiaron y siguen sin trabajo. Yo creo que es un tema que se debe analizar desde muchos puntos de vista para encontrar una solución que beneficie a todos.", "comentario_debil": "Las dos primeras oraciones reproducen el contexto sin elaborarlo, y el texto nunca dice si está de acuerdo o en desacuerdo con exigir experiencia. Además, se contradice: pide que las empresas sean «más conscientes», pero afirma que «los jóvenes de hoy no quieren trabajar». Encadena consecuencias exageradas sin demostrarlas (desempleo, delincuencia, drogas). Hay errores de norma: «Tambien» sin tilde, «estado» con minúscula cuando se refiere a la institución y una coma que une dos oraciones independientes. Para mejorarlo: tomar posición desde el inicio, apoyarla con un ejemplo de un oficio técnico y responder al argumento de las empresas sobre el costo del entrenamiento."}, {"id": "CE-E06", "sim": "tyt-3", "tema": "Vigilancia de los trabajadores con tecnología", "contexto": "Algunas empresas instalan programas que registran la actividad de los empleados en sus computadores, como las páginas que visitan o el tiempo que pasan sin usar el teclado, y sistemas de localización en los vehículos y celulares de trabajo. Los empleadores argumentan que estas herramientas protegen la información de la compañía, mejoran la seguridad de los conductores y permiten medir el rendimiento. Muchos trabajadores, en cambio, sienten que la vigilancia constante genera desconfianza y estrés, y temen que se registren datos de su vida privada, por ejemplo, si el celular de trabajo sigue enviando su ubicación después de la jornada.", "pregunta": "¿Está de acuerdo con que las empresas vigilen de manera permanente la actividad de sus trabajadores mediante programas de monitoreo y sistemas de localización? Escriba un texto argumentativo en el que exponga y justifique su posición.", "ideas": ["¿Qué mide realmente un programa de monitoreo? ¿Actividad o resultados?", "Efecto de la vigilancia constante sobre la confianza y la motivación.", "Datos de la vida privada que pueden quedar registrados.", "Necesidades legítimas de seguridad: transporte de carga, datos de clientes.", "Controles limitados, conocidos y proporcionales."], "modelo": "Los empleadores que instalan programas de monitoreo no lo hacen, en general, por maldad. Una transportadora necesita saber dónde están sus vehículos para proteger a sus conductores y la carga, y una entidad financiera está obligada a cuidar los datos de sus clientes. Esas razones son legítimas, y conviene empezar por reconocerlo. Sin embargo, ninguna de ellas exige vigilar todo, todo el tiempo. Por eso, estoy en desacuerdo con que las empresas vigilen de manera permanente la actividad de sus trabajadores: considero que el control debe ser limitado, conocido por los empleados y proporcional a un riesgo concreto.\n\nLas necesidades de seguridad se atienden con controles específicos, no con una vigilancia total: localización activa solo durante los recorridos, registros de acceso a los archivos confidenciales y políticas escritas que los trabajadores conozcan y acepten desde el principio. La diferencia entre proteger la empresa y espiar a las personas está en esos límites. Cuando una empresa los sobrepasa, la vigilancia produce tres daños.\n\nEl primero es que mide lo que es fácil de medir, no lo que realmente importa. Un programa puede registrar cuántos minutos pasa un técnico frente a la pantalla o cuántas teclas oprime, pero no sabe si ese tiempo se dedicó a resolver un problema difícil o a fingir actividad. Cuando los trabajadores saben que se evalúa el movimiento del ratón, aprenden a producir movimiento, no resultados.\n\nEl segundo es el deterioro de la confianza, que es la base de cualquier equipo de trabajo. Un empleado que se siente observado todo el tiempo vive con estrés, deja de proponer ideas por temor a equivocarse y percibe que su jefe lo considera un sospechoso. Ninguna empresa contrataría a un supervisor para que se sentara detrás de cada empleado a anotar cuántas veces levanta la vista del escritorio; un programa que hace lo mismo de forma invisible no resulta menos ofensivo.\n\nEl tercero es la invasión de la vida privada. Si un celular corporativo envía la ubicación del trabajador a cualquier hora, la empresa termina sabiendo dónde vive, a qué consultorio médico acude o con quién se reúne los fines de semana, información que no le corresponde conocer.\n\nEn conclusión, una empresa puede y debe cuidar su información y a su personal, pero no a costa de convertir el lugar de trabajo en un espacio de sospecha permanente. Los controles proporcionados y transparentes cumplen ese propósito; la vigilancia constante, en cambio, sacrifica la confianza y la privacidad a cambio de datos que dicen muy poco sobre el verdadero desempeño.", "comentario_modelo": "Planteamiento: la tesis es clara (en desacuerdo con la vigilancia permanente) y se acompaña de un criterio propio: el control debe ser limitado, conocido y proporcional. Desarrolla una idea que el contexto no plantea: los programas miden actividad, no resultados. Organización: el texto invierte el orden habitual y empieza por la concesión y la refutación: reconoce las razones de los empleadores («Esas razones son legítimas») y las responde («Sin embargo, ninguna de ellas exige vigilar todo») antes de enunciar la tesis. Después propone una alternativa y anuncia «tres daños», que desarrolla en párrafos encabezados por «El primero», «El segundo» y «El tercero». Forma de expresión: la comparación con un supervisor sentado detrás del empleado hace visible el problema; el léxico es preciso (proporcional, transparente) y los ejemplos son propios del mundo laboral técnico.", "debil": "Hoy en día la tecnología está en todas partes y avanza cada vez más. Algunas empresas instalan programas que registran la actividad de los empleados en sus computadores y sistemas de localización. Esto tiene ventajas, como proteger la información, y desventajas, como el estrés. Los jefes siempre quieren controlarlo todo y nunca confían en nadie. Además, los computadores de las empresas a veces son muy lentos y se dañan. En mi opinión la tecnología debe usarse para el bien de la humanidad y no para hacer daño, como pasa con las redes sociales que causan adicción. Hay que usarla con responsabilidad. Cada persona tiene sus razones y hay que respetarlas.", "comentario_debil": "La frase «En mi opinión» no introduce una respuesta a la pregunta, sino una idea general sobre la tecnología; el texto nunca dice si acepta o rechaza la vigilancia permanente. Resume el contexto («tiene ventajas… y desventajas…») sin elaborarlo, generaliza («los jefes siempre quieren controlarlo todo y nunca confían en nadie») y se desvía hacia las redes sociales y la calidad de los equipos. Las oraciones no se conectan entre sí y el cierre es un lugar común. Falta la coma después de «En mi opinión». Para mejorarlo: responder la pregunta en la primera oración, distinguir entre controles razonables y vigilancia total, y apoyar cada razón con un ejemplo de un trabajo concreto."}, {"id": "CE-E07", "sim": "practica", "tema": "Impuesto a las bebidas azucaradas", "contexto": "Varios países han establecido impuestos a las bebidas azucaradas con el fin de reducir su consumo y prevenir enfermedades como la obesidad y la diabetes. Sus defensores comparan esta medida con los impuestos al tabaco, que encarecieron los cigarrillos y contribuyeron a disminuir el número de fumadores. Sus opositores afirman que el impuesto afecta más a los hogares de bajos ingresos, perjudica a las tiendas de barrio y limita la libertad de cada persona para decidir qué consume. Algunos proponen, en cambio, invertir en educación nutricional y en etiquetas de advertencia más claras.", "pregunta": "¿Está de acuerdo con que el Estado cobre un impuesto a las bebidas azucaradas para desestimular su consumo? Escriba un texto argumentativo en el que exponga y justifique su posición.", "ideas": ["¿Influye el precio en lo que la gente compra?", "Quién paga el tratamiento de las enfermedades asociadas al exceso de azúcar.", "En qué podría invertirse lo recaudado.", "El efecto sobre los hogares de bajos ingresos: ¿se puede evitar el impuesto?", "¿Educación y etiquetas como sustituto o como complemento?"], "modelo": "En muchas tiendas de barrio, una gaseosa puede costar menos que una porción de fruta. Ese simple hecho revela que el precio de un producto no siempre refleja los costos que su consumo genera para la sociedad. Por ello, estoy de acuerdo con que el Estado cobre un impuesto a las bebidas azucaradas, siempre que lo recaudado se destine a la salud pública y que la medida forme parte de una estrategia más amplia.\n\nEl primer argumento es que el precio influye en las decisiones de consumo. Pocas personas dejan de tomar gaseosa por leer un folleto, pero muchas lo piensan dos veces cuando el producto se encarece. La experiencia con el tabaco lo muestra: los impuestos, junto con las campañas educativas y las restricciones a la publicidad, ayudaron a reducir el número de fumadores. Hay buenas razones para pensar que el comportamiento frente a una bebida azucarada no es muy diferente, aunque el azúcar no genere la misma dependencia que el tabaco.\n\nEl segundo argumento se relaciona con los costos que asume toda la sociedad. Las enfermedades asociadas al consumo excesivo de azúcar, como la diabetes tipo 2, requieren tratamientos largos y costosos que se pagan, en buena parte, con recursos públicos. Es razonable, entonces, que el producto que contribuye a ese gasto aporte una parte de su financiación. Si el dinero recaudado se usa para instalar bebederos de agua potable en los colegios o para fortalecer la atención primaria, el impuesto se convierte en una inversión en salud.\n\nLos opositores sostienen que el impuesto golpea más a los hogares pobres. Es cierto que una familia de bajos ingresos dedica a la comida una proporción mayor de su presupuesto. Sin embargo, esas mismas familias son las que más sufren cuando uno de sus miembros enferma, porque tienen menos recursos para pagar el transporte a las citas, los medicamentos o los días sin trabajar. Además, el impuesto puede evitarse: basta con sustituir la bebida azucarada por agua, que sigue siendo la opción más barata.\n\nTampoco me convence el argumento de la libertad. El impuesto no prohíbe nada; cada persona sigue decidiendo qué consume, solo que ahora el precio refleja mejor las consecuencias de esa decisión. La educación nutricional y las etiquetas, por su parte, son medidas valiosas, pero funcionan mejor como complemento que como sustituto. Las tiendas de barrio, por último, no tienen por qué salir perjudicadas: pueden compensar parte de la caída en la venta de gaseosas ofreciendo agua, jugos naturales y otros productos.\n\nEn conclusión, gravar las bebidas azucaradas es una herramienta justificada para proteger la salud pública. No resolverá por sí sola el problema de la obesidad, pero, acompañada de educación, etiquetas claras y acceso a agua potable, puede ayudar a que la opción saludable sea también la más fácil de elegir.", "comentario_modelo": "Planteamiento: la tesis responde la pregunta y fija dos condiciones (destino del recaudo y estrategia más amplia), que luego se retoman en el desarrollo. Va más allá del contexto: explica por qué las familias pobres son también las más afectadas por la enfermedad y propone usos concretos del dinero. Organización: dos argumentos a favor, dos párrafos que refutan las objeciones sobre el efecto en los hogares pobres y sobre la libertad individual, y una conclusión que reconoce los límites de la medida. Los conectores («Sin embargo», «Además», «Tampoco», «En cuanto a») guían al lector. Forma de expresión: abre con una observación cotidiana que despierta interés, usa un léxico preciso (gravar, atención primaria, sustituto) y puntúa con corrección los incisos («pero, acompañada de…, puede…»).", "debil": "El azúcar es muy malo para la salud y causa obesidad y diabetes. Mucha gente toma gaseosa todos los días y eso no es bueno. Los impuestos al tabaco encarecieron los cigarrillos y disminuyeron los fumadores. El gobierno siempre se inventa impuestos para quedarse con la plata de la gente, y los políticos son todos corruptos. Las tiendas de barrio se ven perjudicadas. Por otra parte es importante hacer ejercicio y comer frutas y verduras, dormir bien y tomar mucha agua. En conclusión cada persona es libre de hacer lo que quiera con su cuerpo, pero tambien hay que cuidarse.", "comentario_debil": "El texto mezcla ideas a favor y en contra sin tomar partido: primero sugiere que el azúcar es dañino y luego descalifica cualquier impuesto, pero nunca responde la pregunta. Recurre a ataques generales sin pruebas («los políticos son todos corruptos»), repite el contexto (tabaco, tiendas de barrio) y se desvía hacia consejos de vida saludable que no tienen relación con el impuesto. El registro es coloquial («la plata de la gente») y hay errores: «tambien» sin tilde falta de coma después de «Por otra parte» y de «En conclusión», el uso impropio de «disminuyeron los fumadores» (lo que disminuyó fue el número de fumadores) y una enumeración mal coordinada («hacer ejercicio y comer frutas y verduras, dormir bien y tomar mucha agua»). Para mejorarlo: elegir una posición, sustentarla con dos razones desarrolladas y discutir con respeto la postura contraria."}, {"id": "CE-E08", "sim": "practica", "tema": "Prohibición de los plásticos de un solo uso", "contexto": "Bolsas, pitillos, vasos y cubiertos desechables se usan durante unos minutos, pero pueden tardar décadas, e incluso siglos, en degradarse. Para reducir esta contaminación, algunos gobiernos han decidido prohibir de manera gradual ciertos plásticos de un solo uso. Los ambientalistas apoyan la medida porque estos residuos terminan en ríos, mares y rellenos sanitarios. Algunos fabricantes y vendedores advierten que las alternativas, como el cartón o los materiales compostables, son más costosas y que la prohibición puede afectar empleos. Otros sostienen que el problema no es el plástico en sí, sino la falta de sistemas de reciclaje y la costumbre de botar la basura en cualquier lugar.", "pregunta": "¿Está de acuerdo con que se prohíban los plásticos de un solo uso, como bolsas, pitillos y cubiertos desechables? Escriba un texto argumentativo en el que exponga y justifique su posición.", "ideas": ["Comparar el tiempo de uso de un objeto con el tiempo que permanece en el ambiente.", "¿Existen sustitutos para cada producto?", "Por qué algunos residuos pequeños casi nunca se reciclan.", "Empleos y costos: qué implica una transición gradual.", "Diferencia entre los plásticos desechables y los usos útiles del plástico."], "modelo": "Basta caminar por la orilla de un río después de una creciente para comprobar adónde van a parar muchos objetos que usamos una sola vez: bolsas atrapadas en las ramas, vasos que flotan y pitillos mezclados con la arena. Ante esta realidad, estoy de acuerdo con que se prohíban los plásticos de un solo uso, siempre que la prohibición sea gradual y se ofrezcan alternativas accesibles.\n\nEn primer lugar, existe una desproporción evidente entre el beneficio y el daño. Un pitillo presta un servicio de pocos minutos, mientras que sus restos pueden permanecer en el ambiente durante décadas o incluso siglos y fragmentarse en partículas tan pequeñas que ingresan en la cadena alimentaria. Cuando un producto ofrece una comodidad tan breve a cambio de un problema tan duradero, la sociedad tiene derecho a preguntarse si vale la pena seguir fabricándolo.\n\nEn segundo lugar, muchos de estos objetos son fácilmente reemplazables. Antes de que se generalizaran las bolsas plásticas, las familias iban al mercado con canastos o bolsas de tela; hoy pueden hacerlo de nuevo. Del mismo modo, en la mayoría de las situaciones el pitillo es innecesario, y los cubiertos reutilizables cumplen la misma función que los desechables. Prohibir un producto que no tiene sustituto sería problemático; prohibir uno que sí lo tiene es una decisión razonable.\n\nAlgunos sostienen que el verdadero problema no es el plástico, sino la falta de reciclaje y la mala disposición de la basura. Esa afirmación es correcta solo en parte. Mejorar el reciclaje es necesario, pero los objetos pequeños, livianos y sucios, como los pitillos o las envolturas de comida, rara vez se recuperan, porque recogerlos y limpiarlos cuesta más de lo que vale el material. Confiar únicamente en el reciclaje para resolver el problema es, por tanto, una ilusión.\n\nPor otra parte, la preocupación por los empleos y los costos merece una respuesta seria. Por eso, la prohibición debe ser gradual: los fabricantes necesitan tiempo para adaptar sus máquinas a materiales reutilizables o compostables, y los pequeños negocios requieren información y, quizá, apoyo para conseguir alternativas a precios razonables. Una transición planeada puede incluso generar nuevas oportunidades productivas.\n\nEn conclusión, prohibir los plásticos de un solo uso es una medida justificada, porque ataca un daño grande y duradero causado por productos que ofrecen poco y que pueden reemplazarse. No se trata de demonizar el plástico, que sigue siendo útil en muchos campos, sino de abandonar el hábito de fabricar basura destinada a durar más que nosotros.", "comentario_modelo": "Planteamiento: la tesis es explícita y condicionada (prohibición gradual con alternativas), y el texto aporta un criterio propio para decidir: prohibir lo que tiene sustituto y ofrece un beneficio muy breve. Además, explica por qué el reciclaje no basta para ciertos residuos, una perspectiva que el contexto no desarrolla. Organización: introducción con una imagen concreta, dos argumentos, una refutación parcial («Esa afirmación es correcta solo en parte») y un párrafo que convierte la objeción económica en una condición de la propuesta. Forma de expresión: contraste bien construido entre minutos y décadas, paralelismos («Prohibir un producto que no tiene sustituto…; prohibir uno que sí lo tiene…»), uso correcto de «adónde» con verbo de movimiento y del punto y coma.", "debil": "El plástico es un material que se inventó hace mucho tiempo y que se usa para muchas cosas como bolsas, pitillos, vasos y cubiertos. El medio ambiente es muy importante porque es donde vivimos todos. Los ambientalistas apoyan la medida porque estos residuos terminan en rios y mares. Los fabricantes dicen que las alternativas son mas costosas. Hay que cuidar el planeta para las futuras generaciones, también hay que ahorrar agua y energía y sembrar árboles. Los gobiernos deberían hacer más campañas en los colegios y en la televisión para que la gente tome conciencia. Si todos ponemos de nuestra parte podemos salvar el planeta. Es responsabilidad de todos.", "comentario_debil": "El texto habla del tema, pero no responde la pregunta: no dice si está de acuerdo con la prohibición ni por qué. La parte central copia las posturas del contexto y el resto son frases generales sobre el cuidado del planeta (ahorrar agua, sembrar árboles) que podrían aparecer en cualquier texto ambiental, es decir, información impertinente para la pregunta. No hay conectores que relacionen las ideas ni una conclusión que retome una tesis. Errores: «rios» y «mas» sin tilde, coma que une dos oraciones independientes y falta de coma tras la condicional antepuesta («Si todos ponemos de nuestra parte, …»). Para mejorarlo: tomar posición, comparar beneficios y daños de estos productos y responder a la objeción de los fabricantes."}, {"id": "CE-E09", "sim": "practica", "tema": "Edad mínima para tener cuentas en redes sociales", "contexto": "Algunos países discuten leyes que obligarían a las redes sociales a verificar la edad de sus usuarios e impedir que los menores de 16 años abran cuentas. Quienes apoyan la medida citan los riesgos de estas plataformas para niños y adolescentes: contacto con desconocidos, ciberacoso, exposición a contenidos violentos y uso excesivo. Los críticos señalan que verificar la edad exigiría que los usuarios entreguen documentos o datos personales, lo que crea nuevos riesgos para la privacidad, y que los adolescentes encontrarían formas de evadir el control. Otros prefieren fortalecer la educación digital y el acompañamiento de las familias.", "pregunta": "¿Está de acuerdo con que se prohíba a los menores de 16 años tener cuentas en redes sociales? Escriba un texto argumentativo en el que exponga y justifique su posición.", "ideas": ["Otras actividades para las que la sociedad fija una edad mínima.", "Cómo están diseñadas las plataformas para retener la atención.", "Riesgos concretos para un niño o un adolescente.", "Privacidad: ¿cómo verificar la edad sin entregar todos los datos?", "¿Una norma que algunos incumplen pierde su utilidad?"], "modelo": "¿Puede un adolescente de catorce años manejar por sí solo una aplicación diseñada por equipos de expertos para mantenerlo frente a la pantalla el mayor tiempo posible? La sociedad ya acepta que un menor no puede conducir un carro, comprar alcohol ni firmar un contrato, porque hay actividades cuyos riesgos los adolescentes todavía no están en capacidad de manejar solos. Las redes sociales pertenecen a esa categoría. Por eso, estoy de acuerdo con que se prohíba a los menores de 16 años tener cuentas en estas plataformas.\n\nEl primer argumento tiene que ver con el diseño de las redes sociales. Estas aplicaciones están construidas para captar la mayor atención posible, con contenidos que se renuevan sin fin, notificaciones constantes y sistemas de «me gusta» que premian la exposición. Si a un adulto le cuesta dejar el celular, es ingenuo esperar que lo haga sin ayuda un adolescente de trece o catorce años, cuya capacidad de autocontrol todavía está en formación.\n\nEl segundo argumento se refiere a los riesgos propios de esa edad. Entre los trece y los quince años, la opinión de los demás pesa como nunca, y las redes convierten esa necesidad de aprobación en una competencia permanente: cuántos «me gusta» recibe una foto, quién se parece a los cuerpos retocados con filtros, a quién invitaron a la fiesta. A eso se suman las horas de sueño perdidas frente a la pantalla, los mensajes de desconocidos que ocultan su identidad y las burlas que persiguen a la víctima hasta su casa. Un colegio no deja entrar a cualquier persona en sus salones; resulta contradictorio que permitamos que cualquier persona llegue al teléfono de un adolescente.\n\nLos críticos señalan dos problemas reales. El primero es la privacidad: verificar la edad podría obligar a entregar documentos a empresas que ya acumulan demasiados datos. La ley puede reducir ese riesgo, por ejemplo, mediante verificaciones hechas por un tercero que confirme únicamente si el usuario supera la edad mínima, sin entregarle a la plataforma el resto de su información. El segundo problema es la evasión: algunos adolescentes encontrarán la manera de abrir una cuenta. Sin embargo, que una norma pueda incumplirse no la vuelve inútil. Muchos menores consiguen alcohol, y aun así nadie propone eliminar la prohibición de vendérselo, porque la regla reduce el consumo y envía un mensaje claro sobre lo que la sociedad considera aceptable.\n\nEn conclusión, fijar en 16 años la edad mínima para tener cuentas en redes sociales es una forma razonable de proteger a los adolescentes en los años en que son más vulnerables a la presión de los demás. La medida no reemplaza la educación digital, sino que le da tiempo: quien llega a los 16 años sabiendo reconocer noticias falsas y proteger sus datos estará mejor preparado para usar las redes. La norma no es perfecta, pero sus beneficios superan con claridad sus dificultades.", "comentario_modelo": "Planteamiento: el texto abre con una pregunta retórica que enfoca el problema en la franja de edad que realmente se discute (de 13 a 15 años) y enuncia la tesis sin ambigüedad al final del primer párrafo. Aporta elementos que no están en el contexto: el diseño de las plataformas para retener la atención, la presión social propia de la adolescencia y una propuesta concreta para proteger la privacidad. Organización: dos argumentos («El primer argumento…», «El segundo argumento…»), un párrafo que responde por separado a las dos objeciones («El primero…», «El segundo problema…») y una conclusión que integra la educación digital como complemento, no como alternativa. Forma de expresión: comparaciones eficaces (el colegio que no deja entrar a cualquiera, la venta de alcohol a menores), una enumeración expresiva de las preocupaciones adolescentes y el uso correcto de «aun así» sin tilde (equivale a «incluso así»).", "debil": "Las redes sociales son muy importantes en la vida de los jóvenes. Algunos países discuten leyes para que los menores de 16 años no abran cuentas. Las redes tienen riesgos como el ciberacoso y el contacto con desconocidos, pero tambien tienen ventajas porque uno se puede comunicar con los amigos y aprender cosas. Facebook fue creada hace muchos años por unos estudiantes universitarios y hoy en día tiene millones de usuarios en todo el mundo. Los niños de ahora nacen con un celular en la mano. Los papás deben estar pendientes de sus hijos. Las redes son buenas o malas según el uso que se les de.", "comentario_debil": "No toma posición frente a la prohibición: menciona riesgos y ventajas y concluye con un lugar común («son buenas o malas según el uso»). Incluye un dato histórico sobre el origen de una red social que no sirve para responder la pregunta (información impertinente). Generaliza sin fundamento («los niños de ahora nacen con un celular en la mano»). La segunda oración repite el contexto, y la recomendación a los padres aparece sin conexión con lo anterior. Errores: «tambien» sin tilde y «de» sin tilde cuando es forma del verbo dar («que se les dé»). Para mejorarlo: decidir si apoya o rechaza la edad mínima, explicar por qué con ejemplos de riesgos o de beneficios concretos y responder a la objeción más fuerte de la otra postura."}, {"id": "CE-E10", "sim": "practica", "tema": "Influenciadores que promocionan apuestas en línea", "contexto": "Las plataformas de apuestas en línea se han vuelto muy visibles en redes sociales gracias a influenciadores, deportistas y creadores de contenido que las promocionan, a menudo mostrando ganancias rápidas y estilos de vida lujosos. Algunos expertos en salud pública advierten que esta publicidad llega a menores de edad y puede favorecer conductas de juego problemático. Las empresas de apuestas responden que operan de forma legal y que sus anuncios incluyen mensajes de juego responsable. Algunos creadores de contenido afirman que no son responsables de las decisiones de sus seguidores, mientras que otras personas consideran que quien tiene una gran audiencia también tiene una mayor responsabilidad.", "pregunta": "¿Está de acuerdo con que los influenciadores promocionen plataformas de apuestas en línea en sus redes sociales? Escriba un texto argumentativo en el que exponga y justifique su posición.", "ideas": ["Diferencia entre un anuncio tradicional y la recomendación de alguien a quien se admira.", "Qué muestran y qué ocultan estos anuncios.", "El alcance de los videos entre menores de edad.", "¿Que algo sea legal lo hace ético?", "Responsabilidad de quien cobra por influir."], "modelo": "Entre un video de recetas y otro de rutinas de ejercicio, aparece un joven sonriente que muestra en su celular una ganancia de varios millones de pesos y anima a sus seguidores a «probar suerte». Ese tipo de publicidad se ha vuelto habitual, y considero que no debería serlo. Estoy en desacuerdo con que los influenciadores promocionen plataformas de apuestas en línea, porque esta práctica explota la confianza de audiencias jóvenes y presenta como entretenimiento inofensivo una actividad que puede generar adicción.\n\nEl primer argumento se basa en la naturaleza de la relación entre un influenciador y su audiencia. A diferencia de un anuncio de televisión, que el espectador identifica como publicidad, la recomendación de un creador de contenido se percibe como el consejo de un amigo. Sus seguidores sienten que lo conocen, admiran su estilo de vida y confían en su criterio. Usar esa cercanía para vender apuestas es aprovecharse de un vínculo que los seguidores no perciben como comercial.\n\nEl segundo argumento tiene que ver con el mensaje que transmiten estos anuncios. En ellos se muestran las ganancias, casi nunca las pérdidas, y se sugiere que apostar es una forma rápida de cambiar de vida. Sin embargo, los juegos de apuestas están diseñados para que, a largo plazo, la casa gane y el jugador, en promedio, pierda. Presentar lo contrario no es entretenimiento, sino engaño. Para un joven sin empleo o con deudas, esa promesa puede ser el comienzo de una espiral de pérdidas difícil de detener.\n\nAdemás, los creadores de contenido tienen poco control sobre la edad de su audiencia. Aunque los menores de edad no pueden apostar legalmente, un video publicado en una red social puede llegar a miles de adolescentes que todavía están formando su relación con el dinero y con el riesgo.\n\nLas empresas afirman que operan legalmente y que incluyen mensajes de juego responsable. No pongo en duda la legalidad de su actividad, pero que algo sea legal no significa que cualquier forma de promoverlo sea ética. Una frase pequeña al final del video no compensa varios minutos de celebración de ganancias. De igual modo, los influenciadores que dicen no ser responsables de las decisiones de sus seguidores olvidan que, precisamente, su trabajo consiste en influir en ellas: no pueden cobrar por persuadir y luego negar el efecto de su persuasión.\n\nEn conclusión, la promoción de apuestas por parte de influenciadores debería abandonarse por convicción y, si es necesario, restringirse por ley. Quien construye una comunidad basada en la confianza tiene la obligación de no convertirla en clientela de un negocio que se alimenta de las pérdidas de esos mismos seguidores.", "comentario_modelo": "Planteamiento: la tesis rechaza la práctica y anuncia las dos razones que se desarrollarán (explotación de la confianza y presentación engañosa del riesgo). El texto no se queda en el contexto: analiza la diferencia entre publicidad tradicional y recomendación personal, y distingue entre lo legal y lo ético. Organización: introducción con una escena concreta, dos argumentos principales, un argumento complementario («Además») y un párrafo que refuta, una por una, las defensas de las empresas y de los influenciadores. Forma de expresión: registro formal, contraste entre ganancias y pérdidas, uso de comillas para la expresión ajena «probar suerte» y un cierre con una frase contundente que retoma la idea de confianza.", "debil": "Las apuestas en línea son un tema muy polémico hoy en dia. Los influenciadores las promocionan mostrando ganancias rápidas y estilos de vida lujosos. Las empresas dicen que operan de forma legal. Cada persona es libre de hacer lo que quiera con su plata, pero también hay gente que se vuelve adicta. Mi tío perdió mucha plata en el casino y casi pierde su casa, su familia sufrió mucho y tuvieron que vender el carro. Los casinos deberían estar más lejos de los barrios. También el fútbol se ha vuelto un negocio y los jugadores ganan demasiado. Hay que pensar antes de actuar.", "comentario_debil": "El texto no evalúa la conducta de los influenciadores, que es lo que se pregunta: repite el contexto, añade una anécdota familiar sobre un casino físico y termina hablando de la ubicación de los casinos y de los salarios del fútbol, temas impertinentes. No hay tesis ni conectores que organicen las ideas, y la conclusión es un consejo general. El registro es coloquial («plata») y hay errores: «dia» sin tilde, una oración muy larga unida con comas y una concordancia vacilante («su familia sufrió mucho y tuvieron que vender», con el sujeto singular «su familia»). La anécdota podría servir si se usara como ejemplo de un argumento. Para mejorarlo: responder si está de acuerdo o no con esta publicidad, explicar por qué con dos razones y responder a la defensa de que la actividad es legal."}, {"id": "CE-E11", "sim": "practica", "tema": "Financiación pública de la cultura", "contexto": "Cada año, los gobiernos nacionales y locales destinan recursos públicos a festivales de música, teatro y danza, a bibliotecas, a museos y a becas para artistas. Quienes defienden esta inversión sostienen que la cultura fortalece la identidad de las comunidades, ofrece oportunidades a los jóvenes y genera empleo y turismo. Sus críticos consideran que, en un país con necesidades urgentes en salud, educación y vías, el dinero público debería dirigirse primero a esos sectores, y que los eventos culturales pueden financiarse con la venta de boletas o con patrocinios privados.", "pregunta": "¿Está de acuerdo con que el Estado financie con dinero público actividades culturales y artísticas? Escriba un texto argumentativo en el que exponga y justifique su posición.", "ideas": ["¿Quién podría acceder a la cultura si dependiera solo de la venta de boletas?", "Efectos de la actividad artística en jóvenes y en la economía local.", "El tamaño del presupuesto cultural frente a otros gastos.", "Qué financia un patrocinador privado y qué deja por fuera.", "Transparencia en la asignación de recursos."], "modelo": "Estoy de acuerdo con que el Estado financie con dinero público actividades culturales y artísticas. Quienes se oponen suelen presentar la cultura como un lujo que solo puede permitirse una sociedad sin problemas; a mi juicio, ocurre lo contrario: cuanto más desigual es una sociedad, más necesita que el Estado garantice el acceso a la cultura.\n\nBasta imaginar qué pasaría si los conciertos, las obras de teatro o los talleres de pintura dependieran únicamente de la venta de boletas: solo podrían disfrutarlos quienes tienen dinero para pagarlos. La biblioteca pública de un barrio popular, el festival gratuito en la plaza de un municipio o la escuela de música de una vereda existen porque alguien decidió que el acceso a la cultura no debía depender del ingreso familiar. Sin financiación pública, esas oportunidades desaparecerían precisamente para quienes más las necesitan. La cultura, en este sentido, es un derecho y no un privilegio.\n\nSe dirá que, con necesidades urgentes en salud, educación e infraestructura, cada peso destinado a la cultura está mal invertido. Este razonamiento parte de una falsa oposición. El presupuesto cultural suele ser una fracción pequeña del gasto público, y eliminarlo no resolvería la falta de hospitales ni de vías; su desaparición, en cambio, sí tendría consecuencias inmediatas para las comunidades que dependen de él. Más aún, la inversión cultural produce beneficios que van más allá del arte. Un joven que pasa sus tardes en un grupo de danza o en una banda sinfónica aprende disciplina, trabajo en equipo y constancia, y encuentra un lugar de pertenencia que lo aleja de entornos de riesgo. Un festival bien organizado atrae visitantes, llena hoteles y restaurantes, y da trabajo a técnicos de sonido, artesanos y vendedores. La cultura no compite con el desarrollo: lo impulsa.\n\nTampoco basta con confiar en los patrocinios privados, aunque sean un complemento valioso. Una empresa suele financiar lo que le resulta rentable o le da visibilidad a su marca, mientras que el Estado puede apoyar expresiones que no venden muchas boletas, como las tradiciones de una comunidad indígena o el teatro experimental. Eso sí, el dinero público debe administrarse con transparencia, mediante convocatorias abiertas y rendición de cuentas, para que no termine repartido según la cercanía de los artistas con los gobernantes.\n\nFinanciar la cultura con recursos públicos es, por todo lo anterior, una decisión justa y estratégica. Una sociedad que solo invierte en lo urgente corre el riesgo de olvidar lo importante: los espacios donde sus ciudadanos aprenden a expresarse, a reconocerse y a convivir.", "comentario_modelo": "Planteamiento: la tesis aparece en la primera oración, sin preámbulo, y se completa con una idea propia que invierte el argumento de los críticos («cuanto más desigual es una sociedad, más necesita…»). El texto analiza el tema desde perspectivas que el contexto no ofrece: la cultura como derecho, la «falsa oposición» entre cultura y necesidades básicas, y lo que un patrocinador privado deja sin financiar. Organización: no usa conectores de orden («En primer lugar…»); cada párrafo integra un argumento con la objeción que lo pone a prueba («Se dirá que…», «Tampoco basta con…») y con su respuesta, y la conclusión, sin la fórmula «En conclusión», retoma la tesis con «por todo lo anterior». Forma de expresión: enumeraciones equilibradas, ejemplos variados (barrio, municipio, vereda), dos puntos con valor explicativo («no compite con el desarrollo: lo impulsa») y un cierre que contrapone «lo urgente» y «lo importante».", "debil": "La cultura es muy importante para el país porque es lo que nos identifica. Colombia tiene muchos festivales y ferias que son muy famosos en todo el mundo. La música colombiana es la mejor del mundo. Los críticos dicen que el dinero público debería ir primero a salud, educación y vías. Los artistas también son personas y tienen que comer. Además el gobierno gasta mucha plata en cosas innecesarias. Yo fui una vez a un carnaval y fue una experiencia inolvidable, había mucha gente y la música era muy buena. Hay que apoyar a los artistas porque ellos alegran la vida de la gente. Por eso la cultura es importante.", "comentario_debil": "Aunque deja ver una simpatía por la cultura, el texto no responde de forma explícita si el Estado debe financiarla, y la conclusión («Por eso la cultura es importante») se refiere a otra cosa. Usa afirmaciones exageradas que no puede sostener («la mejor del mundo»), menciona la objeción de los críticos sin refutarla y añade un recuerdo personal que no funciona como argumento. Las ideas se suceden sin orden ni conectores adecuados. Falta la coma después de «Además» y una coma une dos oraciones independientes en la anécdota. Para mejorarlo: formular la tesis en relación con el dinero público, dar dos razones con ejemplos y responder a quienes priorizan salud y vías."}, {"id": "CE-E12", "sim": "practica", "tema": "Prácticas laborales sin remuneración", "contexto": "En muchos programas técnicos, tecnológicos y universitarios, los estudiantes deben realizar prácticas en empresas antes de graduarse. En algunos casos, el practicante recibe un apoyo económico; en otros, trabaja durante meses sin ningún pago. Las empresas que no remuneran argumentan que el practicante está aprendiendo, que su productividad es baja al comienzo y que dedicar personal a formarlo tiene un costo. Muchos estudiantes, en cambio, señalan que realizan tareas iguales a las de un empleado, y que las prácticas sin pago excluyen a quienes no pueden pasar meses sin ingresos.", "pregunta": "¿Está de acuerdo con que las empresas reciban practicantes sin darles ningún apoyo económico? Escriba un texto argumentativo en el que exponga y justifique su posición.", "ideas": ["Diferencia entre una práctica formativa y un empleo disfrazado.", "Costo real de acompañar a un practicante en sus primeras semanas.", "Quién puede aceptar una práctica sin pago y quién no.", "Duración de la práctica y tipo de tareas.", "Papel de las instituciones educativas en los convenios."], "modelo": "Para muchos estudiantes, la práctica es el primer contacto con el mundo laboral y la oportunidad de demostrar lo que aprendieron. Sin embargo, no todas las prácticas son iguales: algunas son verdaderos espacios de formación y otras son, en realidad, empleos disfrazados. Por esta razón, estoy parcialmente de acuerdo con que las empresas reciban practicantes sin pagarles: lo considero aceptable solo cuando la prác
