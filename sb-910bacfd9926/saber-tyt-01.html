<style>
:root{--bg:#f7f5f2;--card:#fff;--ink:#1d2433;--mute:#5a6478;--line:#e0dbd4;--pri:#7a2e0b;--pri2:#b0501c;--ok:#0d6b3a;--okbg:#e6f4ec;--no:#9b1c1c;--nobg:#fbeaea;--sel:#f8ece4}
@media (prefers-color-scheme: dark){:root{--bg:#14110f;--card:#1f1a17;--ink:#ece6e1;--mute:#a69c94;--line:#3a322c;--pri:#f0a47a;--pri2:#f5bb98;--ok:#7fd3a3;--okbg:#16301f;--no:#f2a3a3;--nobg:#3a1c1c;--sel:#3a2a20}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overflow-wrap:anywhere}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px}
.hwrap{max-width:860px;margin:0 auto;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;justify-content:space-between}
h1{font-size:17px;margin:0;color:var(--pri)}
h2{color:var(--pri)}
.stat{font-size:14px;color:var(--mute)}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--pri)}
.timer.low{color:var(--no)}
main{max-width:860px;margin:0 auto;padding:16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin:0 0 16px}
.mod{background:var(--pri);color:var(--card);border-radius:10px;padding:10px 14px;margin:28px 0 6px;font-weight:700;font-size:18px}
.inst{font-size:13px;font-weight:700;color:var(--pri);text-transform:uppercase;letter-spacing:.03em;margin:18px 0 4px}
.caso{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--pri);border-radius:10px;padding:14px 16px;margin:10px 0}
.tag{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--pri);font-weight:700}
.caso p{margin:6px 0 0;white-space:pre-line}
.item{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0}
.enun{margin:0 0 8px;white-space:pre-line}
.n{font-weight:700;color:var(--pri)}
.niv{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-right:4px;white-space:nowrap}
.op{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:6px 0;cursor:pointer;background:transparent;width:100%;text-align:left;color:inherit;font:inherit}
.ops8{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.ops8 .op{margin:0}
.op:hover{border-color:var(--pri2)}
.op .l{font-weight:700;min-width:20px}
.op.sel{background:var(--sel);border-color:var(--pri2)}
.op.ok{background:var(--okbg);border-color:var(--ok)}
.op.no{background:var(--nobg);border-color:var(--no)}
.op[disabled]{cursor:default}
.just{font-size:14px;margin:8px 0 0;padding:8px 10px;border-top:1px dashed var(--line)}
.just div{margin:4px 0}
.just .okt{color:var(--ok);font-weight:700}
.just .not{color:var(--no);font-weight:700}
.src{font-size:13px;color:var(--mute);margin-top:6px}
button.btn{background:var(--pri);color:var(--card);border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer}
button.btn.sec{background:transparent;color:var(--pri);border:1px solid var(--pri)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
select{font:inherit;padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);max-width:100%}
table{border-collapse:collapse;width:100%;font-size:15px}
td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.sub td{font-size:13px;color:var(--mute);padding-left:22px}
.vt{width:auto;max-width:100%;margin:10px 0;font-size:14px;display:block;overflow-x:auto}
.vt caption{text-align:left;font-weight:700;padding-bottom:4px}
.vt th,.vt td{border:1px solid var(--line);padding:4px 8px}
.vt th{background:var(--sel)}
.vnota{font-size:12px;color:var(--mute)}
.vfig{margin:10px 0}
.vfig svg{width:100%;max-width:560px;height:auto;border-radius:6px;border:1px solid var(--line);background:#fff}
.big{font-size:40px;font-weight:800;color:var(--pri);line-height:1.1}
.aviso{font-size:13px;color:var(--mute)}
.hide{display:none !important}
.res-ok{color:var(--ok);font-weight:700}.res-no{color:var(--no);font-weight:700}
textarea{width:100%;min-height:320px;font:inherit;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);resize:vertical}
.chk label{display:flex;gap:8px;align-items:flex-start;margin:6px 0;font-size:15px}
.chk input{margin-top:4px;width:18px;height:18px;flex:none}
.modelo{white-space:pre-line;background:var(--bg);border-radius:8px;padding:10px 12px;margin:6px 0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal .panel{max-width:420px}
.nav{padding:6px 0;display:flex;gap:6px;flex-wrap:wrap}
.nav a{font-size:13px;color:var(--pri);border:1px solid var(--line);border-radius:999px;padding:3px 10px;text-decoration:none;background:var(--card)}
footer{max-width:860px;margin:0 auto;padding:8px 16px 40px;font-size:12px;color:var(--mute)}
</style>

<script>
const DATA = [{"comp": "lectura_critica", "sim": "tyt-1", "ind": "Cuento: el aprendiz del taller de torno", "tt": "Texto literario", "texto": "La medida\n\n(1) Durante tres semanas, Wilmer barrió el taller sin que don Aurelio le permitiera tocar el torno. Llegaba a las siete, recogía las virutas, ordenaba las llaves por tamaño en el tablero y, cuando terminaba, se quedaba mirando cómo el viejo ajustaba una pieza con la paciencia de quien desenreda una cometa. Si preguntaba algo, la respuesta era siempre la misma: «Mire primero».\n\n(2) El lunes de la cuarta semana llegó un cliente con un eje partido. Era de la bomba de agua de una finca y lo necesitaba para el día siguiente. Don Aurelio lo recibió, lo examinó contra la luz de la ventana y, sin decir nada, se lo entregó a Wilmer junto con un calibrador.\n\n(3) —Tómele las medidas. Todas. Y me las escribe.\n\n(4) Wilmer sintió que el calibrador pesaba más de lo que pesaba. Midió el diámetro, la longitud, el ancho del canal de la chaveta. Midió dos veces cada cosa, como había visto hacer al viejo, y anotó los números en un cartón con letra de niño aplicado. Cuando se lo entregó, don Aurelio leyó en silencio, tomó el eje y midió él mismo un solo punto: el canal.\n\n(5) —Aquí se equivocó por medio milímetro.\n\n(6) Wilmer volvió a medir. El viejo tenía razón. Esperaba un regaño, pero don Aurelio solo dijo:\n\n(7) —Medio milímetro es lo que separa una bomba que funciona de una que se vuelve a partir en un mes. Corríjalo.\n\n(8) Esa tarde, por primera vez, Wilmer encendió el torno. Don Aurelio no se fue a su escritorio, como hacía con los clientes impacientes, sino que se quedó de pie a su lado, con los brazos cruzados, sin tocar nada. Cuando la pieza estuvo lista, la midió en tres puntos y la dejó sobre el banco.\n\n(9) —Mañana viene el señor por ella —dijo, y apagó la luz del fondo.\n\n(10) Wilmer se quedó un rato más. Barrió las virutas, que esta vez eran suyas, y antes de irse ordenó las llaves por tamaño en el tablero, aunque nadie se lo había pedido.", "vis": "", "items": [{"id": "LCT-101", "niv": 1, "cp": "lc_local", "e": "Según el relato, ¿qué error cometió Wilmer al tomar las medidas del eje?", "f": "Texto original elaborado para este simulacro, párrafos 4 a 6", "vis": "", "o": [["A", "Midió bien el canal de la chaveta, pero se equivocó en el diámetro del eje.", "Es al revés: don Aurelio midió solo el canal y encontró allí el error de medio milímetro; el diámetro no lo revisó.", false], ["B", "Olvidó medir la longitud total del eje partido.", "El párrafo 4 dice expresamente que Wilmer midió el diámetro, la longitud y el ancho del canal; no olvidó ninguna medida.", false], ["C", "Tomó cada medida una sola vez y sin repetirla.", "El texto afirma lo contrario: «Midió dos veces cada cosa, como había visto hacer al viejo» (párrafo 4).", false], ["D", "Se equivocó medio milímetro al medir el canal.", "En los párrafos 4 y 5 don Aurelio mide solo el canal y dice: «Aquí se equivocó por medio milímetro»; Wilmer comprueba que el viejo tenía razón.", true]]}, {"id": "LCT-102", "niv": 2, "cp": "lc_global", "e": "La frase «Mire primero», que don Aurelio repite en el párrafo 1, se relaciona con el resto del relato porque", "f": "Texto original elaborado para este simulacro, párrafos 1 y 4", "vis": "", "o": [["A", "muestra que en el taller había una norma escrita que impedía a los aprendices usar las máquinas.", "El relato no menciona ninguna norma escrita; «Mire primero» es una respuesta oral de don Aurelio a las preguntas de Wilmer.", false], ["B", "explica que Wilmer se equivoca al medir porque había observado muy poco cómo se tomaban las medidas.", "El texto dice que Wilmer observó al viejo durante tres semanas e imitó su forma de medir; el error no se atribuye a falta de observación.", false], ["C", "anticipa un modo de enseñar basado en observar antes de actuar, que Wilmer termina imitando.", "Wilmer aprendió observando: en el párrafo 4 mide dos veces «como había visto hacer al viejo», lo que muestra el fruto de la consigna «Mire primero».", true], ["D", "revela que don Aurelio desconfiaba de Wilmer y no pensaba enseñarle a manejar el torno del taller.", "El relato desmiente esa lectura: don Aurelio le confía las medidas y luego le permite encender el torno por primera vez (párrafos 2 y 8).", false]]}, {"id": "LCT-103", "niv": 1, "cp": "lc_global", "e": "En el párrafo 10, el narrador dice que las virutas «esta vez eran suyas». Esto se debe a que", "f": "Texto original elaborado para este simulacro, párrafos 1, 8 y 10", "vis": "", "o": [["A", "Wilmer había producido virutas en el torno durante las semanas anteriores.", "Contradice el párrafo 1: durante tres semanas no se le permitió tocar el torno; antes solo barría las virutas que producía el viejo.", false], ["B", "eran el residuo del trabajo que Wilmer había hecho en el torno por primera vez.", "Las virutas salen del torneado; como esa tarde Wilmer encendió el torno y fabricó la pieza (párrafo 8), los residuos que barre provienen de su propio trabajo.", true], ["C", "don Aurelio se las había regalado como recuerdo de su primera pieza.", "Nada en el texto indica un regalo; el sentido de «suyas» se explica porque él produjo esas virutas al tornear.", false], ["D", "el cliente le había pedido a Wilmer que dejara limpio el taller antes de irse a su casa.", "El cliente no vuelve a aparecer en el relato ni da instrucciones sobre la limpieza del taller.", false]]}, {"id": "LCT-104", "niv": 3, "cp": "lc_reflexion", "e": "Al final del relato, Wilmer ordena las llaves en el tablero «aunque nadie se lo había pedido». Este cierre sugiere principalmente que Wilmer", "f": "Texto original elaborado para este simulacro, párrafos 1 y 10", "vis": "", "o": [["A", "ha hecho suyas las costumbres del taller y actúa por convicción, no por una orden.", "La acción repite una tarea del párrafo 1, pero ahora sin que nadie se la exija; el contraste muestra que Wilmer asume el oficio y sus hábitos como propios.", true], ["B", "prefiere volver a las tareas de limpieza porque teme usar de nuevo el torno.", "Nada indica temor; Wilmer acaba de trabajar con éxito en el torno y se queda en el taller voluntariamente.", false], ["C", "nota que don Aurelio dejó de exigir orden en el taller desde que él llegó.", "El texto no dice que don Aurelio haya dejado de exigir orden; la frase destaca la iniciativa de Wilmer, no un cambio en el maestro.", false], ["D", "intenta compensar el error de medida para evitar que don Aurelio lo despida.", "El error ya fue corregido y don Aurelio no lo regañó ni insinuó un despido (párrafos 6 y 7); la inferencia no tiene apoyo en el texto.", false]]}, {"id": "LCT-105", "niv": 2, "cp": "lc_reflexion", "e": "Un instructor de mecánica afirma: «En los oficios, un error corregido a tiempo enseña más que un acierto por casualidad». ¿Qué momento del cuento ilustra mejor esta idea?", "f": "Texto original elaborado para este simulacro, párrafos 5 a 7", "vis": "", "o": [["A", "El cliente llega con el eje partido de la bomba de agua y lo necesita para el día siguiente.", "La llegada del cliente plantea la situación, pero no contiene un error corregido ni un aprendizaje.", false], ["B", "Wilmer barre el taller durante tres semanas sin que se le permita tocar el torno.", "Ese momento muestra la etapa de observación, pero en él no hay ningún error ni corrección.", false], ["C", "Don Aurelio deja la pieza terminada sobre el banco, anuncia que el cliente vendrá por ella y apaga la luz del fondo.", "Es el cierre de la jornada; muestra que la pieza quedó lista, pero no el momento en que un error se corrige y enseña.", false], ["D", "Don Aurelio detecta la falla en la medida, explica qué podría pasar y le pide a Wilmer rehacerla.", "En los párrafos 5 a 7 el error se detecta antes de fabricar la pieza, se explica por qué importa y se corrige: es un error corregido a tiempo que deja una enseñanza.", true]]}]}, {"comp": "lectura_critica", "sim": "tyt-1", "ind": "Columna de opinión sobre las prácticas de estudiantes técnicos", "tt": "Texto informativo", "texto": "Practicantes, no mano de obra barata\n\n(1) Cada semestre, miles de estudiantes de programas técnicos y tecnológicos salen a hacer su etapa práctica en empresas. En teoría, es el momento en que lo aprendido en el aula se pone a prueba frente a problemas reales. En la práctica —y perdón por el juego de palabras—, muchos terminan haciendo fotocopias, atendiendo el teléfono o cubriendo turnos que nadie más quiere.\n\n(2) No pretendo culpar a todas las empresas. Hay muchas que diseñan planes de aprendizaje serios, asignan un tutor y rotan al practicante por distintas áreas. Pero cuando hablo con egresados, la queja se repite: «Me pusieron a hacer lo mismo seis meses y nadie me revisó nada».\n\n(3) El problema no es solo de justicia con el estudiante. Una práctica mal aprovechada es una pérdida para todos. La institución educativa pierde la oportunidad de saber si su programa responde a lo que el sector necesita; la empresa pierde la ocasión de formar a quien podría ser su próximo trabajador calificado, y el país sigue escuchando la queja de que «no hay personal preparado», cuando lo que falta, muchas veces, es alguien que se tome el trabajo de prepararlo.\n\n(4) Algunos dirán que el practicante también debe aprender a hacer tareas sencillas, porque así es el mundo laboral. Tienen razón en parte: nadie empieza dirigiendo una planta. Sin embargo, hacer tareas sencillas no es lo mismo que hacer solo tareas sencillas. La diferencia está en que exista un plan que avance de lo simple a lo complejo y alguien que evalúe ese avance.\n\n(5) Propongo, entonces, algo modesto: que ninguna práctica empiece sin un documento firmado por la empresa, la institución y el estudiante, en el que se definan las funciones, el tutor responsable y al menos dos momentos de evaluación. No es burocracia: es la forma de convertir una buena intención en un compromiso verificable.\n\n(6) Un practicante no es un empleado que sale más barato. Es una inversión, y como toda inversión, solo rinde si alguien la cuida.", "vis": "", "items": [{"id": "LCT-106", "niv": 1, "cp": "lc_local", "e": "Según el párrafo 5, el documento que propone el autor debe definir", "f": "Texto original elaborado para este simulacro, párrafo 5", "vis": "", "o": [["A", "las tareas del practicante, quién lo acompañará como tutor y un mínimo de dos evaluaciones.", "El párrafo 5 pide definir «las funciones, el tutor responsable y al menos dos momentos de evaluación»; la opción lo dice con otras palabras.", true], ["B", "las tareas sencillas que el practicante realizará durante los seis meses.", "Los seis meses aparecen en la queja de un egresado (párrafo 2); el documento propuesto no se limita a listar tareas sencillas.", false], ["C", "los programas académicos que la empresa considera útiles para el sector.", "La pertinencia de los programas se menciona en el párrafo 3 como algo que la institución puede conocer, no como parte del documento.", false], ["D", "el salario del practicante, su horario de trabajo y las distintas áreas por las que deberá rotar.", "El autor no menciona salario ni horario en su propuesta; la rotación por áreas aparece en el párrafo 2 como ejemplo de buenas empresas, no como contenido del documento.", false]]}, {"id": "LCT-107", "niv": 2, "cp": "lc_global", "e": "¿Cuál es la tesis principal del texto?", "f": "Texto original elaborado para este simulacro, párrafos 1 a 6", "vis": "", "o": [["A", "Las empresas deberían dejar de recibir practicantes de programas técnicos y tecnológicos.", "El autor no propone eliminar las prácticas; al contrario, las considera una inversión valiosa (párrafo 6).", false], ["B", "Los practicantes deberían asumir tareas complejas desde que inician su práctica.", "El párrafo 4 lo contradice: el autor acepta que el practicante empiece con tareas sencillas y propone un plan que avance de lo simple a lo complejo.", false], ["C", "Las prácticas deben organizarse con un plan y una evaluación que las conviertan en verdadero aprendizaje.", "Todo el texto conduce a esta idea: critica las prácticas sin plan (párrafos 1 y 2), muestra sus costos (3), precisa que se requiere un plan evaluado (4) y propone un documento que lo garantice (5).", true], ["D", "La calidad de las prácticas depende sobre todo de las instituciones educativas que envían a los estudiantes.", "El texto reparte la responsabilidad entre empresa, institución y estudiante; no la atribuye sobre todo a las instituciones.", false]]}, {"id": "LCT-108", "niv": 2, "cp": "lc_global", "e": "¿Qué función cumple el párrafo 4 dentro del texto?", "f": "Texto original elaborado para este simulacro, párrafo 4", "vis": "", "o": [["A", "Resume las ideas anteriores antes de pasar a la conclusión del texto.", "No es un resumen: introduce una idea nueva (la objeción) y la discute.", false], ["B", "Presenta una posible objeción a la postura del autor y la responde precisando esa postura.", "El párrafo abre con «Algunos dirán que…», concede parte de razón y luego aclara con «Sin embargo» que lo criticado es hacer solo tareas sencillas, sin un plan.", true], ["C", "Aporta datos estadísticos que demuestran que la mayoría de las prácticas fracasan.", "El párrafo 4 no contiene datos ni cifras; es un razonamiento sobre el tipo de tareas del practicante.", false], ["D", "Muestra un cambio de postura del autor, que acepta que las tareas sencillas bastan.", "El autor solo concede «en parte» y sostiene que no bastan las tareas sencillas sin un plan que avance; no cambia de postura.", false]]}, {"id": "LCT-109", "niv": 3, "cp": "lc_reflexion", "e": "¿Cuál de los siguientes supuestos sustenta la propuesta del párrafo 5?", "f": "Texto original elaborado para este simulacro, párrafo 5", "vis": "", "o": [["A", "Un acuerdo firmado, con funciones y evaluaciones definidas, aumenta la probabilidad de que se cumpla.", "El autor afirma que el documento sirve para «convertir una buena intención en un compromiso verificable»; supone, por tanto, que dejar por escrito funciones, tutor y evaluaciones favorece su cumplimiento.", true], ["B", "La mayoría de las empresas actúan de mala fe con los practicantes que reciben.", "El párrafo 2 lo descarta: «No pretendo culpar a todas las empresas»; la propuesta no parte de la mala fe generalizada.", false], ["C", "Las instituciones educativas ya firman documentos de este tipo con la mayoría de las empresas que reciben practicantes.", "Si eso ocurriera, la propuesta sería en buena parte innecesaria; el autor presupone lo contrario: que hoy muchas prácticas empiezan sin ese compromiso.", false], ["D", "Los estudiantes eligen la empresa de práctica según el salario que esta ofrece.", "El salario no aparece en el texto ni en la propuesta; este supuesto no tiene relación con el documento propuesto.", false]]}, {"id": "LCT-110", "niv": 2, "cp": "lc_reflexion", "e": "En el párrafo 1, el autor escribe «En la práctica —y perdón por el juego de palabras—». Con esta aclaración, el autor", "f": "Texto original elaborado para este simulacro, párrafo 1", "vis": "", "o": [["A", "da a entender que el tema de las prácticas no debe tomarse en serio.", "El tono del resto de la columna es serio y propositivo; el juego de palabras no resta importancia al problema.", false], ["B", "advierte con humor que usa «práctica» en dos sentidos: la etapa formativa y lo que sucede en la realidad.", "La expresión «en la práctica» significa «en la realidad», pero el texto trata sobre la «práctica» de los estudiantes; el autor señala esa coincidencia con una disculpa irónica.", true], ["C", "indica que la palabra «práctica» está mal empleada en los programas técnicos.", "El autor no corrige el uso de la palabra; solo señala que la usa con doble sentido.", false], ["D", "se disculpa ante las empresas por las críticas que hará a lo largo de la columna sobre su forma de tratar a los practicantes.", "La disculpa se refiere explícitamente al «juego de palabras», no a las críticas dirigidas a las empresas.", false]]}]}, {"comp": "lectura_critica", "sim": "tyt-1", "ind": "Texto expositivo sobre la cadena de frío de las vacunas", "tt": "Texto informativo", "texto": "Una cadena que no se ve\n\n(1) Cuando una persona recibe una vacuna en el centro de salud de un municipio apartado, pocas veces piensa en el recorrido que hizo ese frasco. Desde el laboratorio que la produjo hasta la jeringa, la vacuna debe mantenerse, por lo general, entre 2 y 8 grados centígrados. Ese recorrido controlado se conoce como cadena de frío, y es tan fuerte como su eslabón más débil.\n\n(2) La cadena tiene varios eslabones: el almacenamiento en bodegas nacionales y regionales, el transporte en vehículos o cajas térmicas, la conservación en los refrigeradores de cada centro de salud y, finalmente, el manejo durante la jornada de vacunación. En cada uno hay riesgos distintos: un corte de energía en la bodega, una caja térmica mal cerrada en un trayecto de varias horas, un refrigerador que se abre demasiadas veces o un termo que se deja al sol.\n\n(3) Contra lo que muchos creen, el calor no es el único enemigo. Algunas vacunas pierden su efectividad si se congelan, y el daño no siempre se nota a simple vista: el frasco puede verse igual que antes. Por eso, un refrigerador demasiado frío puede ser tan problemático como uno que no enfría.\n\n(4) Para vigilar la temperatura, los centros llevan registros: un funcionario revisa el termómetro al inicio y al final de la jornada y anota los valores en una planilla. Hoy existen también registradores electrónicos que guardan la temperatura cada pocos minutos y emiten alertas. Sin embargo, ninguna tecnología reemplaza a la persona que lee la alerta y sabe qué hacer: trasladar las vacunas a otro equipo, informar al responsable y no aplicar las dosis hasta que se verifique su estado.\n\n(5) Por eso, la cadena de frío es, en el fondo, una cadena de personas. El técnico que mantiene los equipos, el conductor que respeta los tiempos de entrega y la auxiliar que registra la temperatura forman parte de un mismo sistema. Si uno falla, el esfuerzo de todos los demás puede perderse, y lo que se pierde no es solo dinero: es la protección de quienes confiaron en esa vacuna.", "vis": "", "items": [{"id": "LCT-111", "niv": 1, "cp": "lc_local", "e": "Según el párrafo 3, un refrigerador demasiado frío puede ser problemático porque", "f": "Texto original elaborado para este simulacro, párrafo 3", "vis": "", "o": [["A", "hace que el frasco cambie de aspecto y ya no pueda aplicarse.", "Contradice el texto: el frasco congelado «puede verse igual que antes».", false], ["B", "obliga a abrir la puerta más veces durante la jornada de vacunación.", "Abrir el refrigerador muchas veces es otro riesgo del párrafo 2; no es la razón por la que el exceso de frío resulta problemático.", false], ["C", "consume más energía y puede provocar cortes en la bodega.", "Los cortes de energía se mencionan en el párrafo 2 como un riesgo distinto; el texto no los relaciona con un refrigerador muy frío.", false], ["D", "hay vacunas que se dañan cuando quedan expuestas a temperaturas de congelación.", "El párrafo 3 dice que «algunas vacunas pierden su efectividad si se congelan»; por eso el exceso de frío es un riesgo.", true]]}, {"id": "LCT-112", "niv": 1, "cp": "lc_global", "e": "La expresión «es tan fuerte como su eslabón más débil» (párrafo 1) significa que", "f": "Texto original elaborado para este simulacro, párrafos 1 y 5", "vis": "", "o": [["A", "las etapas más débiles deberían eliminarse de la cadena de frío.", "La expresión no propone eliminar etapas; todas son necesarias para que la vacuna llegue a la jeringa.", false], ["B", "la cadena funciona bien siempre que la mayoría de sus etapas cumpla, aunque alguna falle de vez en cuando.", "Es lo contrario de lo que dice la expresión: basta una etapa que falle para que la cadena se rompa.", false], ["C", "una falla en cualquier etapa del recorrido puede arruinar el cuidado de las demás.", "El párrafo 5 lo confirma: «Si uno falla, el esfuerzo de todos los demás puede perderse»; la cadena depende de que ninguna etapa falle.", true], ["D", "el transporte es la etapa más importante de la cadena de frío.", "El texto no privilegia el transporte; presenta riesgos en todas las etapas (párrafo 2).", false]]}, {"id": "LCT-113", "niv": 3, "cp": "lc_global", "e": "¿Qué relación hay entre los párrafos 4 y 5?", "f": "Texto original elaborado para este simulacro, párrafos 4 y 5", "vis": "", "o": [["A", "El 4 dice que ante una alerta decide una persona, y el 5 extiende esa idea a toda la cadena.", "El párrafo 4 concluye que «ninguna tecnología reemplaza a la persona que lee la alerta»; el 5 empieza con «Por eso» y generaliza: la cadena de frío es «una cadena de personas».", true], ["B", "El 4 describe los riesgos del transporte y el 5 calcula las pérdidas económicas.", "Los riesgos del transporte están en el párrafo 2, y el 5 no presenta cálculos; además dice que lo que se pierde «no es solo dinero».", false], ["C", "El 4 critica los registradores electrónicos y el 5 propone dejar de usarlos en los centros de salud.", "El párrafo 4 no critica los registradores, solo dice que no reemplazan a las personas; el 5 no propone eliminarlos.", false], ["D", "El 4 presenta la tesis del texto y el 5 la contradice con un ejemplo.", "El párrafo 5 no contradice al 4; lo continúa y amplía mediante el conector «Por eso».", false]]}, {"id": "LCT-114", "niv": 2, "cp": "lc_reflexion", "e": "De acuerdo con el texto, ¿cuál de las siguientes situaciones pone en riesgo la cadena de frío aunque todos los equipos funcionen correctamente?", "f": "Texto original elaborado para este simulacro, párrafo 4", "vis": "", "o": [["A", "Que las vacunas se pasen a otro equipo mientras se verifica su estado y se informa al responsable.", "Es una de las acciones correctas ante una alerta, según el párrafo 4.", false], ["B", "Que la auxiliar anote la temperatura al inicio y al final de la jornada.", "Es precisamente el procedimiento de control que describe el párrafo 4.", false], ["C", "Que nadie revise las alertas del registrador electrónico ni actúe cuando aparecen.", "El párrafo 4 indica que la tecnología no sustituye a la persona que lee la alerta y sabe qué hacer; si nadie actúa, el equipo funciona pero la cadena se rompe.", true], ["D", "Que el centro de salud use registradores electrónicos además de la planilla.", "Usar ambos medios refuerza la vigilancia; el texto los presenta como complementarios, no como un riesgo.", false]]}, {"id": "LCT-115", "niv": 3, "cp": "lc_reflexion", "e": "Un lector afirma: «Si un frasco de vacuna se ve normal, se puede aplicar sin problema». Según el texto, esta afirmación es", "f": "Texto original elaborado para este simulacro, párrafo 3", "vis": "", "o": [["A", "válida, porque las vacunas se dañan sobre todo cuando se exponen al calor.", "El párrafo 3 advierte que «el calor no es el único enemigo»: el daño por congelación puede no verse, así que el aspecto normal no garantiza que la vacuna sirva.", false], ["B", "válida, porque los registradores electrónicos garantizan el buen estado de los frascos.", "Los registradores solo guardan datos y emiten alertas; el texto insiste en que no reemplazan la verificación humana.", false], ["C", "inválida, porque las vacunas congeladas suelen cambiar de color.", "Concluye bien que la afirmación es inválida, pero por una razón falsa: el texto dice que el frasco dañado puede verse igual que antes.", false], ["D", "inválida, porque una vacuna congelada puede parecer intacta y estar dañada.", "El párrafo 3 señala que el daño por congelación puede no notarse: «el frasco puede verse igual que antes». El aspecto normal no garantiza que la vacuna sirva.", true]]}]}, {"comp": "lectura_critica", "sim": "tyt-1", "ind": "Crónica de la madrugada en una central de abastos", "tt": "Texto informativo", "texto": "Las tres de la mañana en la central\n\n(1) A las tres de la mañana, cuando la ciudad todavía duerme, la central de abastos ya lleva dos horas despierta. Los camiones que salieron de los pueblos a medianoche hacen fila en la entrada principal, con las luces encendidas y los motores apagados para no gastar combustible. Huele a cebolla, a diésel y a tinto recién hecho.\n\n(2) Doña Mercedes tiene un puesto de plátano desde hace veintidós años. Llega a la una y media, antes que los compradores grandes, porque —según dice— «el que llega tarde compra lo que los otros dejaron». Mientras habla, no deja de contar racimos ni de anotar en un cuaderno de hojas grasosas. No usa calculadora: dice que la cabeza le da más rápido.\n\n(3) Los coteros son los primeros en moverse. Cargan bultos de cincuenta kilos sobre la espalda y los llevan desde los camiones hasta las bodegas, a paso corto y sin mirar a los lados. Cobran por viaje, así que nadie se detiene a conversar. Uno de ellos, Arley, me cuenta en una pausa de treinta segundos que empezó a los diecisiete años y que el día que no viene no gana.\n\n(4) Hacia las cinco aparecen los dueños de restaurantes y tiendas de barrio. Negocian sin rodeos: preguntan el precio, ofrecen menos, se alejan dos pasos y vuelven. Es una coreografía que todos conocen y que casi siempre termina en un apretón de manos. El precio del día no lo fija nadie en particular; se va formando entre lo que llegó, lo que falta y lo que se rumora que llegará mañana.\n\n(5) A las siete, cuando la mayoría de la gente apenas se está levantando, buena parte del trabajo de la central ya terminó. Los camiones vacíos regresan a los pueblos, los coteros se sientan en los andenes a desayunar y doña Mercedes cierra su cuaderno. Lo que se negoció en estas horas llegará a miles de cocinas sin que casi nadie sepa por cuántas manos pasó antes.", "vis": "", "items": [{"id": "LCT-116", "niv": 1, "cp": "lc_local", "e": "Según el párrafo 2, doña Mercedes llega a la central a la una y media porque", "f": "Texto original elaborado para este simulacro, párrafo 2", "vis": "", "o": [["A", "los camiones de los pueblos empiezan a descargar a esa hora de la madrugada.", "El texto no dice a qué hora empiezan a descargar los camiones; a las tres todavía hacen fila en la entrada.", false], ["B", "cree que quien llega tarde se queda con lo que nadie quiso.", "Es la razón que ella misma da en el párrafo 2: «el que llega tarde compra lo que los otros dejaron».", true], ["C", "debe abrir la bodega antes de que empiecen a trabajar los coteros.", "El texto no le atribuye a doña Mercedes la tarea de abrir bodegas.", false], ["D", "a esa hora el precio del plátano es más bajo que en el resto del día, según los comerciantes.", "El texto no compara precios por hora; dice que el precio se va formando según lo que llega y lo que falta.", false]]}, {"id": "LCT-117", "niv": 2, "cp": "lc_global", "e": "En el párrafo 4, el cronista llama «coreografía» a la negociación porque", "f": "Texto original elaborado para este simulacro, párrafo 4", "vis": "", "o": [["A", "compradores y vendedores repiten pasos que ambos conocen y que suelen llevar a un acuerdo.", "El párrafo describe una secuencia fija (preguntar, ofrecer menos, alejarse, volver) «que todos conocen» y que «casi siempre termina en un apretón de manos»: de ahí la metáfora de la coreografía.", true], ["B", "los compradores bailan en los pasillos para llamar la atención de los vendedores.", "Es una lectura literal de una metáfora; nadie baila en el texto.", false], ["C", "la negociación sigue reglas escritas que impone la administración de la central.", "El texto dice que el precio «no lo fija nadie en particular»; no habla de reglas escritas de la administración.", false], ["D", "los precios cambian al azar durante la madrugada y nadie puede prever cuánto costarán los productos.", "El texto explica de qué depende el precio (lo que llegó, lo que falta, lo que se rumora); no lo presenta como azar, y la coreografía alude a la negociación, no a los precios.", false]]}, {"id": "LCT-118", "niv": 2, "cp": "lc_global", "e": "¿Cuál es la idea que articula el texto en su conjunto?", "f": "Texto original elaborado para este simulacro, párrafos 1 a 5", "vis": "", "o": [["A", "Los coteros ganan más que los comerciantes porque cobran por cada viaje.", "El texto no compara ingresos; solo dice que los coteros cobran por viaje y no ganan si no trabajan.", false], ["B", "La central de abastos funciona con desorden y necesita que las autoridades ejerzan un mayor control sobre los precios.", "El cronista no denuncia desorden ni pide control; describe una dinámica que «todos conocen».", false], ["C", "Doña Mercedes es la comerciante más antigua y respetada de la central.", "Es un detalle exagerado: el texto dice que lleva veintidós años, pero no que sea la más antigua ni la más respetada; además, es solo un personaje entre varios.", false], ["D", "En la central se hace, de madrugada y gracias a muchas personas, un trabajo del que depende la comida de la ciudad.", "Todos los párrafos presentan actores del trabajo nocturno (camioneros, comerciante, coteros, compradores) y el cierre vincula ese trabajo con «miles de cocinas».", true]]}, {"id": "LCT-119", "niv": 3, "cp": "lc_reflexion", "e": "¿Qué efecto busca el cronista al cerrar con la frase «sin que casi nadie sepa por cuántas manos pasó antes»?", "f": "Texto original elaborado para este simulacro, párrafos 1 y 5", "vis": "", "o": [["A", "Reprochar a los consumidores que no compren directamente en la central.", "El cronista no reprocha nada a los consumidores ni recomienda dónde comprar.", false], ["B", "Denunciar que los alimentos de la central llegan en malas condiciones a las cocinas de la ciudad.", "Nada en el texto alude al estado de los alimentos; «manos» se refiere a las personas que intervienen en el abastecimiento.", false], ["C", "Hacer visible el trabajo de quienes abastecen la ciudad y que los consumidores no suelen ver.", "La crónica muestra un trabajo que ocurre mientras «la ciudad todavía duerme»; la frase final subraya que ese esfuerzo pasa inadvertido para quien consume.", true], ["D", "Demostrar que los intermediarios de la central son la causa de que los precios de los alimentos sean altos.", "El texto no habla de precios altos ni culpa a intermediarios; explica que el precio se forma por la oferta y los rumores.", false]]}]}, {"comp": "lectura_critica", "sim": "tyt-1", "ind": "Cómic sobre una reunión de trabajo «rapidita»", "tt": "Caricatura o cómic", "texto": "Cómic: «Reunión rapidita»\n\nViñeta 1: Una oficina con cuatro escritorios. El jefe, con una taza de café en la mano, se asoma a la puerta y dice: «Equipo, una reunión rapidita, cinco minutos nada más». En la pared, un reloj marca las 9:00.\n\nViñeta 2: Sala de reuniones. El jefe proyecta una diapositiva con el título «Punto 1 de 14». Los cuatro empleados se miran entre sí con cara de preocupación. El reloj marca las 9:20.\n\nViñeta 3: Una empleada levanta la mano y pregunta: «¿Y el informe que hay que entregarle hoy al cliente?». El jefe responde, sin dejar de mirar la pantalla: «Tranquila, eso lo vemos en el punto 13». El reloj marca las 10:45.\n\nViñeta 4: Por la ventana se ve que ya es de noche. Dos empleados duermen sobre la mesa y los otros dos miran el reloj, que marca las 6:30 p. m. El jefe, sonriente, dice: «Bueno, como hoy no alcanzamos a hacer nada, mañana hacemos otra reunión rapidita para organizarnos».", "vis": "", "items": [{"id": "LCT-120", "niv": 1, "cp": "lc_local", "e": "Según la viñeta 3, ¿cuándo dice el jefe que se tratará el tema del informe para el cliente?", "f": "Texto original elaborado para este simulacro, viñeta 3", "vis": "", "o": [["A", "Al día siguiente, en otra reunión rapidita.", "La nueva reunión se anuncia en la viñeta 4 «para organizarnos», no como el momento previsto para el informe.", false], ["B", "En el punto 13 de la reunión.", "En la viñeta 3 el jefe responde: «Tranquila, eso lo vemos en el punto 13».", true], ["C", "En el punto 1, antes de los demás temas de la agenda.", "El punto 1 es el que se proyecta en la viñeta 2; el informe queda para el punto 13, casi al final.", false], ["D", "Después de entregarle el informe al cliente.", "El jefe no menciona la entrega; dice que el tema se verá dentro de la reunión, en el punto 13.", false]]}, {"id": "LCT-121", "niv": 1, "cp": "lc_global", "e": "¿Qué relación hay entre lo que anuncia el jefe en la viñeta 1 y la hora que marcan los relojes en las viñetas siguientes?", "f": "Texto original elaborado para este simulacro, viñetas 1 a 4", "vis": "", "o": [["A", "Las horas contradicen el anuncio de una reunión de cinco minutos.", "El jefe promete cinco minutos a las 9:00, pero el reloj marca 9:20, 10:45 y finalmente 6:30 de la noche: la reunión dura todo el día.", true], ["B", "Las horas muestran que los empleados llegaron tarde a la reunión convocada por el jefe.", "El cómic no indica retrasos de los empleados; los relojes miden la duración de la reunión.", false], ["C", "Las horas indican que el jefe adelantó la reunión para que el equipo saliera temprano.", "La reunión termina de noche (6:30, ya oscuro); nadie sale temprano.", false], ["D", "Las horas confirman que la reunión duró aproximadamente lo que el jefe había anunciado.", "Es lo contrario: a las 9:20 apenas van en el punto 1 y la reunión sigue de noche.", false]]}, {"id": "LCT-122", "niv": 2, "cp": "lc_global", "e": "El humor de la viñeta 4 se basa principalmente en que el jefe", "f": "Texto original elaborado para este simulacro, viñeta 4", "vis": "", "o": [["A", "decide cancelar el informe del cliente para que los empleados puedan descansar.", "El cómic no dice que el informe se cancele; el jefe solo anuncia otra reunión.", false], ["B", "se queda dormido sobre la mesa igual que dos de sus empleados.", "En la viñeta 4 el jefe está despierto y sonriente; los que duermen son dos empleados.", false], ["C", "reconoce que la reunión fue demasiado larga y les pide disculpas a sus empleados por haberles hecho perder el día.", "El jefe no se disculpa ni reconoce la duración de la reunión; sonríe y propone otra.", false], ["D", "propone como solución otra reunión «rapidita», lo mismo que causó el problema.", "La reunión «rapidita» consumió el día entero; proponer otra igual para «organizarse» repite la causa del problema, y ahí está la ironía.", true]]}, {"id": "LCT-123", "niv": 2, "cp": "lc_reflexion", "e": "¿Cuál es la crítica principal que plantea el cómic?", "f": "Texto original elaborado para este simulacro, viñetas 1 a 4", "vis": "", "o": [["A", "Las reuniones de trabajo deberían reemplazarse por mensajes escritos.", "El cómic no propone sustituir las reuniones por otro medio; critica una reunión mal planeada.", false], ["B", "Las reuniones mal planeadas consumen el tiempo que se necesita para hacer el trabajo.", "La reunión de 14 puntos ocupa todo el día, el informe urgente queda relegado y el jefe admite que «no alcanzamos a hacer nada».", true], ["C", "Los clientes exigen informes en plazos que resultan imposibles de cumplir.", "El cómic no critica al cliente; el informe no se hace porque la reunión ocupa todo el tiempo.", false], ["D", "Los empleados se duermen en las reuniones porque no les interesa el trabajo que realizan en la empresa.", "Los empleados se duermen después de una jornada entera de reunión; el cómic no sugiere desinterés por su trabajo, sino agotamiento.", false]]}, {"id": "LCT-124", "niv": 3, "cp": "lc_reflexion", "e": "¿Cuál de las siguientes recomendaciones, tomada de un manual de gestión ficticio, coincide mejor con la crítica que hace el cómic?", "f": "Texto original elaborado para este simulacro, viñetas 1 a 4", "vis": "", "o": [["A", "Programe las reuniones del equipo a primera hora de la mañana, antes de empezar las demás tareas del día.", "La reunión del cómic empieza a las 9:00; la hora de inicio no es lo que se critica, sino la falta de planeación.", false], ["B", "Entregue los informes a los clientes por escrito y no durante una reunión.", "El cómic no discute el formato de entrega del informe, sino que la reunión impide prepararlo.", false], ["C", "Antes de convocar, defina la duración real, los temas prioritarios y el resultado esperado de la reunión.", "El cómic muestra lo contrario: una duración falsa («cinco minutos»), 14 temas sin prioridad (lo urgente va en el punto 13) y ningún resultado. La recomendación ataca justo esas fallas.", true], ["D", "Pida a los empleados que soliciten permiso antes de intervenir en una reunión.", "La empleada interviene con orden (levanta la mano); el problema no es la forma de intervenir.", false]]}]}, {"comp": "lectura_critica", "sim": "tyt-1", "ind": "Aviso y tablas sobre el uso de extintores portátiles", "tt": "Texto discontinuo", "texto": "Aviso del área de seguridad y salud en el trabajo de una empresa de logística (ficticia), publicado junto a cada extintor:\n\nUse el extintor solo si se cumplen las tres condiciones: el fuego es pequeño, ya se dio aviso a la brigada y usted tiene una salida libre a su espalda. Si alguna de estas condiciones no se cumple, evacúe.", "vis": "<table class=\"vt\"><caption>Tabla 1. Pasos para usar un extintor portátil<\/caption><thead><tr><th>Paso<\/th><th>Acción<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>Hale el pasador de seguridad.<\/td><\/tr><tr><td>2<\/td><td>Apunte la boquilla a la base del fuego, no a las llamas.<\/td><\/tr><tr><td>3<\/td><td>Apriete la manija.<\/td><\/tr><tr><td>4<\/td><td>Mueva la boquilla de lado a lado hasta apagar el fuego.<\/td><\/tr><\/tbody><\/table><table class=\"vt\"><caption>Tabla 2. Tipos de extintor disponibles en la empresa<\/caption><thead><tr><th>Tipo<\/th><th>Sirve para<\/th><th>Precaución<\/th><\/tr><\/thead><tbody><tr><td>Agua a presión<\/td><td>Clase A: madera, papel, cartón, tela<\/td><td>No usar en equipos eléctricos energizados ni en líquidos inflamables.<\/td><\/tr><tr><td>Polvo químico seco multipropósito (ABC)<\/td><td>Clases A, B (líquidos inflamables) y C (equipos eléctricos energizados)<\/td><td>Deja residuos que pueden dañar equipos electrónicos delicados.<\/td><\/tr><tr><td>Dióxido de carbono (CO₂)<\/td><td>Clases B y C<\/td><td>Poco eficaz en fuegos de clase A. Ventile el lugar después de usarlo.<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Información de entrenamiento elaborada para este simulacro.<\/div>", "items": [{"id": "LCT-125", "niv": 1, "cp": "lc_local", "e": "Según la tabla 1, ¿hacia dónde se debe dirigir la boquilla del extintor?", "f": "Texto original elaborado para este simulacro, tabla 1, paso 2", "vis": "", "o": [["A", "Hacia el centro de las llamas, donde el calor es mayor.", "Contradice el paso 2, que pide apuntar a la base y no a las llamas.", false], ["B", "Hacia el humo que sale del fuego.", "La tabla no menciona el humo; señala la base del fuego como objetivo.", false], ["C", "Hacia la parte más alta de las llamas.", "El paso 2 indica expresamente que no se apunte a las llamas.", false], ["D", "Hacia la base del fuego.", "El paso 2 dice: «Apunte la boquilla a la base del fuego, no a las llamas».", true]]}, {"id": "LCT-126", "niv": 2, "cp": "lc_local", "e": "Un trabajador ve un fuego pequeño en un tablero eléctrico energizado. Según la tabla 2, ¿qué extintor NO debe usar?", "f": "Texto original elaborado para este simulacro, tabla 2", "vis": "", "o": [["A", "Ninguno: los tres sirven para fuegos eléctricos.", "El de agua no sirve para equipos eléctricos energizados; por eso sí hay uno que no debe usarse.", false], ["B", "El de polvo químico seco multipropósito (ABC).", "El extintor ABC sirve para la clase C, que corresponde a equipos eléctricos energizados.", false], ["C", "El de agua a presión.", "La tabla 2 indica para el extintor de agua: «No usar en equipos eléctricos energizados».", true], ["D", "El de dióxido de carbono (CO₂).", "El extintor de CO₂ sirve para las clases B y C; puede usarse en equipos eléctricos energizados.", false]]}, {"id": "LCT-127", "niv": 2, "cp": "lc_global", "e": "Según el aviso y las tablas, ¿en cuál de las siguientes situaciones el trabajador debe evacuar en lugar de usar el extintor?", "f": "Texto original elaborado para este simulacro, aviso y tabla 2", "vis": "", "o": [["A", "Hay un fuego pequeño en cajas de cartón; la brigada ya está avisada y tiene un extintor de agua, pero la única salida queda al otro lado del fuego.", "Falla una de las tres condiciones del aviso (tener una salida libre a la espalda); por tanto, debe evacuar aunque el fuego sea pequeño y de clase A.", true], ["B", "Un tablero eléctrico tiene un fuego pequeño; el trabajador avisó a la brigada, cuenta con una salida libre a su espalda y tiene un extintor de CO₂.", "Se cumplen las tres condiciones y el CO₂ sirve para la clase C; puede usar el extintor.", false], ["C", "Hay un fuego pequeño en papeles; la brigada está avisada, la puerta queda detrás del trabajador y tiene un extintor de agua.", "Se cumplen las condiciones y el agua es adecuada para papel (clase A); puede usar el extintor.", false], ["D", "Hay un fuego pequeño de gasolina; la brigada ya fue avisada, tiene la salida detrás de sí y un extintor ABC a mano.", "Se cumplen las tres condiciones y el extintor ABC sirve para líquidos inflamables (clase B); puede usarlo.", false]]}, {"id": "LCT-128", "niv": 3, "cp": "lc_reflexion", "e": "Un empleado afirma: «Como el extintor ABC sirve para las tres clases de fuego, debería ser el único tipo instalado en la sala de servidores». Según la información de la tabla 2, esta afirmación es discutible porque", "f": "Texto original elaborado para este simulacro, tabla 2", "vis": "", "o": [["A", "el aviso prohíbe usar extintores en salas que contengan equipos de cómputo.", "El aviso no menciona tipos de sala; solo fija tres condiciones para usar cualquier extintor.", false], ["B", "el polvo que deja puede estropear aparatos delicados como los servidores, aunque apague el fuego.", "La precaución del extintor ABC en la tabla 2 advierte sobre residuos que dañan equipos electrónicos delicados, como los servidores; servir para las tres clases no lo hace el más conveniente allí.", true], ["C", "el extintor de agua a presión es el más adecuado para proteger una sala de servidores.", "El agua no debe usarse en equipos eléctricos energizados, según la tabla 2.", false], ["D", "el extintor ABC no sirve para fuegos en equipos eléctricos energizados, como los que hay en una sala de servidores.", "Falso: la tabla 2 indica que el ABC sí sirve para la clase C (equipos eléctricos energizados).", false]]}]}, {"comp": "lectura_critica", "sim": "tyt-1", "ind": "Etiqueta de un desengrasante industrial", "tt": "Texto discontinuo", "texto": "Etiqueta posterior del envase de un desengrasante industrial (producto ficticio «Desgrasol Pro»).", "vis": "<table class=\"vt\"><caption>DESGRASOL PRO · Desengrasante concentrado<\/caption><thead><tr><th>Sección<\/th><th>Información<\/th><\/tr><\/thead><tbody><tr><td>Uso<\/td><td>Pisos de talleres, cocinas industriales y superficies metálicas.<\/td><\/tr><tr><td>Modo de uso<\/td><td>Diluya 1 parte de producto en 10 partes de agua. Aplique, deje actuar 5 minutos y enjuague. Para grasa muy adherida, use 1 parte de producto en 5 partes de agua.<\/td><\/tr><tr><td>Precauciones<\/td><td>Use guantes y gafas. No mezcle con productos que contengan cloro o amoníaco. No aplique sobre aluminio ni sobre superficies pintadas.<\/td><\/tr><tr><td>Primeros auxilios<\/td><td>Contacto con los ojos: lave con abundante agua durante 15 minutos y consulte al médico. Ingestión: no induzca el vómito; acuda al médico de inmediato y lleve esta etiqueta.<\/td><\/tr><tr><td>Almacenamiento<\/td><td>Manténgase en su envase original, bien cerrado, en un lugar fresco y fuera del alcance de los niños.<\/td><\/tr><tr><td>Contenido<\/td><td>3,785 L · Lote DG-2611<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Producto y etiqueta ficticios.<\/div>", "items": [{"id": "LCT-129", "niv": 1, "cp": "lc_local", "e": "Según la etiqueta, para limpiar grasa muy adherida el producto se debe diluir en una proporción de", "f": "Texto original elaborado para este simulacro, etiqueta, sección Modo de uso", "vis": "", "o": [["A", "1 parte de producto en 10 partes de agua.", "Es la dilución general, no la indicada para grasa muy adherida.", false], ["B", "5 partes de producto en 10 partes de agua.", "Combina mal los números de la etiqueta; ninguna instrucción menciona esa proporción.", false], ["C", "partes iguales de producto y de agua.", "La etiqueta no indica en ningún caso partes iguales; para grasa muy adherida la proporción es 1 en 5.", false], ["D", "1 parte de producto en 5 partes de agua.", "La sección «Modo de uso» indica: «Para grasa muy adherida, use 1 parte de producto en 5 partes de agua».", true]]}, {"id": "LCT-130", "niv": 1, "cp": "lc_global", "e": "Un auxiliar de mantenimiento debe limpiar la puerta de aluminio de un horno y el piso del taller. Según la etiqueta, el auxiliar", "f": "Texto original elaborado para este simulacro, etiqueta, secciones Uso y Precauciones", "vis": "", "o": [["A", "puede usar el producto en las dos superficies, siempre que lo diluya 1 en 10.", "La dilución no cambia la prohibición: el producto no debe aplicarse sobre aluminio.", false], ["B", "puede usar el producto en el piso, pero no en la puerta de aluminio.", "La sección «Uso» incluye los pisos de talleres y la sección «Precauciones» prohíbe aplicarlo sobre aluminio.", true], ["C", "debe usar el producto puro en el piso y diluido en la puerta de aluminio.", "La etiqueta pide diluir el producto y prohíbe aplicarlo sobre aluminio, con o sin dilución.", false], ["D", "puede usar el producto en la puerta de aluminio, pero no en el piso del taller.", "Invierte la información: el aluminio está prohibido y los pisos de talleres están permitidos.", false]]}, {"id": "LCT-131", "niv": 2, "cp": "lc_global", "e": "¿En qué se diferencia la sección «Precauciones» de la sección «Primeros auxilios»?", "f": "Texto original elaborado para este simulacro, etiqueta, secciones Precauciones y Primeros auxilios", "vis": "", "o": [["A", "La primera indica cómo evitar un accidente; la segunda, qué hacer cuando ya ocurrió.", "«Precauciones» da medidas preventivas (guantes, no mezclar, no aplicar en aluminio); «Primeros auxilios» indica cómo actuar tras el contacto con los ojos o la ingestión.", true], ["B", "Las dos secciones indican qué hacer después de ingerir el producto por accidente.", "Solo «Primeros auxilios» trata la ingestión; «Precauciones» no la menciona.", false], ["C", "La primera explica cómo diluir el producto; la segunda, cómo almacenarlo de forma segura.", "La dilución está en «Modo de uso» y el almacenamiento tiene su propia sección.", false], ["D", "La primera está dirigida a los médicos; la segunda, a los trabajadores que usan el producto.", "Ambas secciones se dirigen a quien usa el producto; «Primeros auxilios» incluso le pide consultar al médico.", false]]}, {"id": "LCT-132", "niv": 2, "cp": "lc_reflexion", "e": "Un trabajador mezcla el desengrasante con un blanqueador que contiene cloro «para que limpie más». De acuerdo con la etiqueta, esta decisión", "f": "Texto original elaborado para este simulacro, etiqueta, sección Precauciones", "vis": "", "o": [["A", "es válida, porque la etiqueta permite aumentar la concentración del producto cuando la grasa está muy adherida.", "La etiqueta permite concentrar más el mismo producto (1 en 5), no mezclarlo con otros productos.", false], ["B", "es adecuada si el trabajador usa guantes y gafas durante la limpieza.", "Usar guantes y gafas es otra precaución; no autoriza la mezcla con cloro, que está prohibida.", false], ["C", "contradice una precaución de la etiqueta, que prohíbe mezclarlo con productos que contengan cloro.", "La sección «Precauciones» dice: «No mezcle con productos que contengan cloro o amoníaco».", true], ["D", "sería un problema principalmente si la mezcla se aplicara sobre aluminio o sobre superficies pintadas.", "La prohibición de mezclar con cloro es independiente de la superficie; es una precaución distinta.", false]]}]}, {"comp": "lectura_critica", "sim": "tyt-1", "ind": "Reglamento del taller de electricidad de un instituto técnico", "tt": "Texto discontinuo", "texto": "Extracto del reglamento de uso del taller de electricidad de un instituto técnico (ficticio).", "vis": "<table class=\"vt\"><caption>Reglamento del taller de electricidad<\/caption><thead><tr><th>Artículo<\/th><th>Disposición<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>El ingreso al taller solo se permite con el instructor presente.<\/td><\/tr><tr><td>2<\/td><td>Es obligatorio usar botas dieléctricas, gafas de seguridad y ropa sin elementos metálicos sueltos. Quien no porte los elementos completos no podrá ingresar.<\/td><\/tr><tr><td>3<\/td><td>Antes de intervenir un circuito, el estudiante debe verificar la ausencia de tensión con un instrumento de medida y colocar el aviso «No energizar».<\/td><\/tr><tr><td>4<\/td><td>Las herramientas se solicitan en el almacén presentando el carné y se devuelven al finalizar la sesión. El estudiante responde por los daños causados por mal uso.<\/td><\/tr><tr><td>5<\/td><td>Se prohíbe consumir alimentos y bebidas dentro del taller.<\/td><\/tr><tr><td>6<\/td><td>El incumplimiento de los artículos 2 y 3 implica la suspensión inmediata de la práctica; el de los demás artículos, un llamado de atención escrito.<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Reglamento ficticio elaborado para este simulacro.<\/div>", "items": [{"id": "LCT-133", "niv": 1, "cp": "lc_local", "e": "Según el artículo 4, para solicitar herramientas el estudiante debe", "f": "Texto original elaborado para este simulacro, reglamento, artículo 4", "vis": "", "o": [["A", "pedirlas directamente al instructor del taller al comenzar la sesión.", "El instructor debe estar presente (artículo 1), pero las herramientas se piden en el almacén.", false], ["B", "firmar un compromiso de devolverlas al día siguiente.", "El artículo 4 pide devolverlas al finalizar la sesión, no al día siguiente, y no menciona ninguna firma.", false], ["C", "pagar un depósito para cubrir posibles daños.", "El estudiante responde por daños causados por mal uso, pero no se exige un depósito previo.", false], ["D", "presentar el carné en el almacén.", "El artículo 4 dice que las herramientas «se solicitan en el almacén presentando el carné».", true]]}, {"id": "LCT-134", "niv": 3, "cp": "lc_global", "e": "Durante una sesión, un estudiante interviene un circuito sin verificar antes la ausencia de tensión, y otro se toma un café dentro del taller. Según el reglamento,", "f": "Texto original elaborado para este simulacro, reglamento, artículos 3, 5 y 6", "vis": "", "o": [["A", "al primero se le suspende la práctica de inmediato y al segundo se le hace un llamado de atención escrito.", "El primero incumple el artículo 3 y el segundo el artículo 5; el artículo 6 asigna suspensión inmediata al incumplimiento del 3 y llamado de atención escrito al de los demás.", true], ["B", "ambos reciben un llamado de atención escrito, porque no causaron daños a las herramientas.", "La sanción no depende de causar daños; el incumplimiento del artículo 3 implica suspensión inmediata.", false], ["C", "al primero se le hace un llamado de atención y al segundo se le suspende la práctica.", "Invierte las sanciones del artículo 6.", false], ["D", "a ambos se les suspende la práctica de inmediato, pues los dos incumplieron el reglamento.", "El artículo 6 diferencia las sanciones: el artículo 5 no conlleva suspensión, sino llamado de atención.", false]]}, {"id": "LCT-135", "niv": 3, "cp": "lc_reflexion", "e": "¿Qué criterio explica mejor que el reglamento sancione con más severidad el incumplimiento de los artículos 2 y 3?", "f": "Texto original elaborado para este simulacro, reglamento, artículos 2, 3 y 6", "vis": "", "o": [["A", "Esos artículos son los más difíciles de cumplir para los estudiantes que apenas empiezan su formación.", "El reglamento no habla de la dificultad de cumplirlos; además, la dificultad no justificaría una sanción más fuerte.", false], ["B", "Esos artículos se refieren al cuidado de las herramientas que se prestan en el almacén.", "El cuidado de las herramientas corresponde al artículo 4, que tiene la sanción más leve.", false], ["C", "Esos artículos protegen directamente la integridad física frente al riesgo eléctrico.", "El artículo 2 exige elementos de protección (botas dieléctricas, gafas, ropa sin metales) y el 3 exige verificar la ausencia de tensión: ambos previenen accidentes eléctricos, a diferencia de los otros artículos.", true], ["D", "Esos artículos fueron los últimos en añadirse al reglamento del taller.", "El extracto no da información sobre el orden en que se crearon los artículos.", false]]}]}, {"comp": "razonamiento_cuantitativo", "sim": "tyt-1", "ind": "Motos atendidas por día en un taller", "tt": "", "texto": "Un taller de mantenimiento de motocicletas registró cuántas motos atendió cada día de una semana de trabajo (de lunes a sábado). La gráfica 1 muestra los registros.", "vis": "<div class=\"vfig\"><svg class=\"vg\" viewBox=\"0 0 560 320\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Gráfica 1. Motos atendidas por día\" font-family=\"Arial, sans-serif\" font-size=\"12\"><rect width=\"560\" height=\"320\" fill=\"#ffffff\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"13\" fill=\"#1d2433\">Gráfica 1. Motos atendidas por día<\/text><line x1=\"60\" y1=\"258.0\" x2=\"540\" y2=\"258.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"262.0\" text-anchor=\"end\" fill=\"#3a4356\">0<\/text><line x1=\"60\" y1=\"213.6\" x2=\"540\" y2=\"213.6\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"217.6\" text-anchor=\"end\" fill=\"#3a4356\">5<\/text><line x1=\"60\" y1=\"169.2\" x2=\"540\" y2=\"169.2\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"173.2\" text-anchor=\"end\" fill=\"#3a4356\">10<\/text><line x1=\"60\" y1=\"124.8\" x2=\"540\" y2=\"124.8\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"128.8\" text-anchor=\"end\" fill=\"#3a4356\">15<\/text><line x1=\"60\" y1=\"80.4\" x2=\"540\" y2=\"80.4\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"84.4\" text-anchor=\"end\" fill=\"#3a4356\">20<\/text><line x1=\"60\" y1=\"36.0\" x2=\"540\" y2=\"36.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"40.0\" text-anchor=\"end\" fill=\"#3a4356\">25<\/text><line x1=\"60\" y1=\"258\" x2=\"540\" y2=\"258\" stroke=\"#3a4356\"/><line x1=\"60\" y1=\"258\" x2=\"60\" y2=\"36\" stroke=\"#3a4356\"/><text transform=\"translate(14,147.0) rotate(-90)\" text-anchor=\"middle\" fill=\"#3a4356\">Número de motos<\/text><text x=\"300.0\" y=\"312\" text-anchor=\"middle\" fill=\"#3a4356\">Día de la semana<\/text><text x=\"100.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Lun<\/text><text x=\"180.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Mar<\/text><text x=\"260.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Mié<\/text><text x=\"340.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Jue<\/text><text x=\"420.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Vie<\/text><text x=\"500.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Sáb<\/text><rect x=\"72.0\" y=\"151.4\" width=\"56.0\" height=\"106.6\" fill=\"#1660a8\"/><text x=\"100.0\" y=\"147.4\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">12<\/text><rect x=\"152.0\" y=\"178.1\" width=\"56.0\" height=\"79.9\" fill=\"#1660a8\"/><text x=\"180.0\" y=\"174.1\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">9<\/text><rect x=\"232.0\" y=\"124.8\" width=\"56.0\" height=\"133.2\" fill=\"#1660a8\"/><text x=\"260.0\" y=\"120.8\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">15<\/text><rect x=\"312.0\" y=\"178.1\" width=\"56.0\" height=\"79.9\" fill=\"#1660a8\"/><text x=\"340.0\" y=\"174.1\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">9<\/text><rect x=\"392.0\" y=\"98.2\" width=\"56.0\" height=\"159.8\" fill=\"#1660a8\"/><text x=\"420.0\" y=\"94.2\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">18<\/text><rect x=\"472.0\" y=\"71.5\" width=\"56.0\" height=\"186.5\" fill=\"#1660a8\"/><text x=\"500.0\" y=\"67.5\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">21<\/text><\/svg><\/div>", "items": [{"id": "RCT-101", "niv": 1, "cp": "rc_interpretacion", "e": "Según la gráfica, ¿cuántas motos más se atendieron el sábado que el martes?", "f": "Cálculo propio a partir de los datos del caso (datos ficticios).", "vis": "", "o": [["A", "3", "Es la diferencia entre el sábado (21) y el viernes (18), no entre el sábado y el martes.", false], ["B", "9", "Es la cantidad de motos atendidas el martes, no la diferencia pedida.", false], ["C", "12", "El sábado se atendieron 21 motos y el martes 9; la diferencia es 21 − 9 = 12.", true], ["D", "30", "Es la suma 21 + 9; la pregunta pide cuántas más, es decir, una resta.", false]]}, {"id": "RCT-102", "niv": 1, "cp": "rc_formulacion", "e": "¿Cuál fue el promedio de motos atendidas por día en esa semana?", "f": "Cálculo propio a partir de los datos del caso (datos ficticios).", "vis": "", "o": [["A", "13,5", "Es la mediana: el promedio de los dos valores centrales (12 y 15) de los datos ordenados, no la media.", false], ["B", "14", "El total es 12 + 9 + 15 + 9 + 18 + 21 = 84 motos en 6 días; 84 ÷ 6 = 14.", true], ["C", "15", "Es el punto medio entre el mínimo (9) y el máximo (21); no tiene en cuenta los demás días.", false], ["D", "16,8", "Resulta de dividir el total (84) entre 5 días, pero la semana registrada tiene 6 días.", false]]}, {"id": "RCT-103", "niv": 2, "cp": "rc_interpretacion", "e": "¿Qué porcentaje del total de motos de la semana se atendió entre el viernes y el sábado, aproximadamente?", "f": "Cálculo propio a partir de los datos del caso (datos ficticios).", "vis": "", "o": [["A", "33,3 %", "Es la proporción de días (2 de 6), no la proporción de motos.", false], ["B", "39 %", "39 es el número de motos de esos dos días; falta dividirlo entre el total semanal (84).", false], ["C", "46,4 %", "Viernes y sábado suman 18 + 21 = 39 motos; 39 ÷ 84 ≈ 0,464, es decir, cerca de 46,4 %.", true], ["D", "53,6 %", "Es el porcentaje de motos atendidas de lunes a jueves (45 de 84), el complemento del pedido.", false]]}, {"id": "RCT-104", "niv": 2, "cp": "rc_argumentacion", "e": "El jefe del taller afirma: «Si el sábado se hubieran atendido 30 motos en lugar de 21, la mediana de los datos de la semana habría aumentado». ¿Es válida esta afirmación?", "f": "Cálculo propio a partir de los datos del caso (datos ficticios).", "vis": "", "o": [["A", "Sí, porque el rango pasaría de 12 a 21 motos, y la mediana sube junto con el rango.", "El rango sí cambia, pero la mediana no depende del dato mayor mientras siga siendo el mayor.", false], ["B", "No, porque la mediana depende de los dos datos centrales, 12 y 15, que no cambian.", "Ordenados, los datos son 9, 9, 12, 15, 18, 21 (o 30); los dos centrales siguen siendo 12 y 15, así que la mediana no cambia.", true], ["C", "Sí, porque al pasar el sábado de 21 a 30 motos, el total de la semana sube 9 motos.", "Sube el total y por tanto el promedio, pero la mediana solo depende de los valores centrales.", false], ["D", "No, porque la mediana es el dato que más se repite, 9 motos, y ese dato no cambia.", "Confunde la mediana con la moda: el dato que más se repite (9) es la moda; la mediana es el promedio de los dos datos centrales.", false]]}]}, {"comp": "razonamiento_cuantitativo", "sim": "tyt-1", "ind": "IVA y descuento en una ferretería", "tt": "", "texto": "En una ferretería, un taladro tiene un precio de $ 250.000 antes de impuestos. Al precio se le suma el IVA del 19 %. Esta semana la ferretería ofrece además un descuento del 10 % para clientes con tarjeta de fidelización.", "vis": "", "items": [{"id": "RCT-105", "niv": 1, "cp": "rc_formulacion", "e": "Sin aplicar el descuento, ¿cuánto paga un cliente por el taladro con el IVA incluido?", "f": "Cálculo propio; tarifa general del IVA del 19 % (Estatuto Tributario, art. 468).", "vis": "", "o": [["A", "$ 47.500", "Es solo el valor del IVA (19 % de $ 250.000); falta sumarlo al precio.", false], ["B", "$ 202.500", "Resulta de restar el IVA al precio; el IVA se suma, no se resta.", false], ["C", "$ 269.000", "Suma $ 19.000 como si el 19 % fueran 19.000 pesos; el 19 % de $ 250.000 es $ 47.500.", false], ["D", "$ 297.500", "Precio con IVA: 250.000 × 1,19 = 297.500.", true]]}, {"id": "RCT-106", "niv": 2, "cp": "rc_formulacion", "e": "Un cliente con tarjeta de fidelización recibe el descuento del 10 % sobre el precio con IVA. ¿Cuánto paga por el taladro?", "f": "Cálculo propio; tarifa general del IVA del 19 % (Estatuto Tributario, art. 468).", "vis": "", "o": [["A", "$ 225.000", "Aplica el descuento al precio sin IVA y olvida sumar el impuesto.", false], ["B", "$ 267.750", "Precio con IVA: $ 297.500; con el descuento: 297.500 × 0,90 = 267.750.", true], ["C", "$ 272.500", "Combina los porcentajes sumando y restando (19 % − 10 % = 9 %) y calcula 250.000 × 1,09; los porcentajes sucesivos se multiplican.", false], ["D", "$ 297.500", "Es el precio con IVA, sin aplicar el descuento del 10 %.", false]]}, {"id": "RCT-107", "niv": 3, "cp": "rc_argumentacion", "e": "Un cliente afirma: «Me da igual que primero apliquen el descuento del 10 % y después sumen el IVA, o que lo hagan al revés: en ambos casos pago lo mismo». ¿Cuál de las siguientes razones sustenta correctamente la evaluación de esta afirmación?", "f": "Cálculo propio a partir de los datos del caso (datos ficticios).", "vis": "", "o": [["A", "La afirmación es correcta, porque en ambos casos el precio se multiplica por 0,90 y por 1,19, y el orden de los factores no altera el producto.", "250.000 × 0,90 × 1,19 = 250.000 × 1,19 × 0,90 = 267.750: la multiplicación es conmutativa.", true], ["B", "La afirmación es incorrecta, porque si el IVA se aplica primero, el descuento se calcula sobre un valor mayor y el cliente paga menos.", "El descuento es mayor, pero también lo es el IVA calculado antes; los dos órdenes dan $ 267.750.", false], ["C", "La afirmación es incorrecta, porque si el descuento se aplica primero, el IVA se calcula sobre un valor menor y el cliente paga menos.", "El IVA sí resulta menor, pero el descuento también se calcula sobre un valor menor; el total es el mismo, $ 267.750.", false], ["D", "La afirmación es correcta, porque en ambos casos el resultado es aumentar el precio en 19 % − 10 % = 9 %.", "La conclusión coincide, pero la razón es falsa: 250.000 × 1,09 = 272.500, que no es lo que se paga ($ 267.750).", false]]}]}, {"comp": "razonamiento_cuantitativo", "sim": "tyt-1", "ind": "Embaldosado del piso de una bodega", "tt": "", "texto": "El piso de una bodega es un rectángulo de 12 m de largo por 8 m de ancho. Se va a cubrir con baldosas cuadradas de 40 cm de lado. Las baldosas se venden en cajas de 16 unidades a $ 72.000 la caja, y no se venden cajas incompletas.", "vis": "", "items": [{"id": "RCT-108", "niv": 1, "cp": "rc_formulacion", "e": "¿Cuál es el área del piso de la bodega?", "f": "Cálculo propio a partir de los datos del caso (datos ficticios).", "vis": "", "o": [["A", "20 m².", "Suma el largo y el ancho (12 + 8); el área de un rectángulo es largo por ancho.", false], ["B", "40 m².", "Es el perímetro del piso (2 × 12 + 2 × 8 = 40 m), no su área.", false], ["C", "96 m².", "Área = 12 m × 8 m = 96 m².", true], ["D", "960 m².", "Multiplica por 10 de más: 12 × 8 = 96, no 960.", false]]}, {"id": "RCT-109", "niv": 2, "cp": "rc_formulacion", "e": "Si no se desperdicia ninguna baldosa, ¿cuántas baldosas se necesitan para cubrir todo el piso?", "f": "Cálculo propio a partir de los datos del caso (datos ficticios).", "vis": "", "o": [["A", "60", "Toma el área de una baldosa como 1,6 m² en lugar de 0,16 m² (error al ubicar la coma).", false], ["B", "240", "Divide el área (96 m²) entre el lado de la baldosa (0,4 m) en lugar de dividir entre su área (0,16 m²).", false], ["C", "600", "Caben 12 ÷ 0,4 = 30 baldosas a lo largo y 8 ÷ 0,4 = 20 a lo ancho: 30 × 20 = 600 (equivale a 96 ÷ 0,16).", true], ["D", "2.400", "Usa baldosas de 20 cm de lado (área 0,04 m²); el lado es 40 cm.", false]]}, {"id": "RCT-110", "niv": 3, "cp": "rc_formulacion", "e": "El maestro de obra recomienda comprar un 10 % más de baldosas de las que cubren exactamente el piso, para reponer cortes y roturas. Siguiendo la recomendación, ¿cuánto se gasta en baldosas?", "f": "Cálculo propio a partir de los datos del caso (datos ficticios).", "vis": "", "o": [["A", "$ 2.700.000", "Usa 37,5 cajas (600 ÷ 16), sin el 10 % adicional y pagando media caja, que no se vende.", false], ["B", "$ 2.736.000", "Compra 38 cajas para 600 baldosas: redondea bien, pero olvida el 10 % adicional.", false], ["C", "$ 2.970.000", "Usa 41,25 cajas (660 ÷ 16) sin redondear hacia arriba; no se venden cajas incompletas.", false], ["D", "$ 3.024.000", "Se necesitan 600 × 1,10 = 660 baldosas; 660 ÷ 16 = 41,25, así que se compran 42 cajas: 42 × 72.000 = 3.024.000.", true]]}]}, {"comp": "razonamiento_cuantitativo", "sim": "tyt-1", "ind": "Bombillos defectuosos en una bodega", "tt": "", "texto": "En la bodega de una empresa de mantenimiento se revisó un lote de 200 bombillos de dos tipos. La tabla 1 resume el resultado de la revisión.", "vis": "<table class=\"vt\"><caption>Tabla 1. Resultado de la revisión del lote<\/caption><thead><tr><th>Tipo<\/th><th>En buen estado<\/th><th>Defectuosos<\/th><th>Total<\/th><\/tr><\/thead><tbody><tr><td>LED<\/td><td>90<\/td><td>10<\/td><td>100<\/td><\/tr><tr><td>Halógeno<\/td><td>70<\/td><td>30<\/td><td>100<\/td><\/tr><tr><td>Total<\/td><td>160<\/td><td>40<\/td><td>200<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Datos ficticios.<\/div>", "items": [{"id": "RCT-111", "niv": 1, "cp": "rc_interpretacion", "e": "¿Qué porcentaje del lote completo corresponde a bombillos defectuosos?", "f": "Cálculo propio a partir de los datos del caso (datos ficticios).", "vis": "", "o": [["A", "10 %", "Es el porcentaje de defectuosos entre los LED (10 de 100), no en todo el lote.", false], ["B", "15 %", "Es el porcentaje que representan solo los halógenos defectuosos (30 de 200).", false], ["C", "20 %", "Hay 40 defectuosos de 200 bombillos: 40 ÷ 200 = 0,20 = 20 %.", true], ["D", "40 %", "40 es la cantidad de defectuosos, no el porcentaje: falta dividir entre 200.", false]]}, {"id": "RCT-112", "niv": 2, "cp": "rc_formulacion", "e": "Si se escoge al azar un bombillo entre los halógenos del lote, ¿cuál es la probabilidad de que esté defectuoso?", "f": "Cálculo propio a partir de los datos del caso (datos ficticios).", "vis": "", "o": [["A", "0,15", "Divide 30 entre 200 (todo el lote); la selección se hace solo entre los 100 halógenos.", false], ["B", "0,2", "Es la probabilidad de que un bombillo cualquiera del lote esté defectuoso (40 de 200).", false], ["C", "0,3", "Entre los 100 halógenos hay 30 defectuosos: 30 ÷ 100 = 0,3.", true], ["D", "0,75", "Es la fracción de los defectuosos que son halógenos (30 de 40), no la de halógenos que están defectuosos.", false]]}, {"id": "RCT-113", "niv": 3, "cp": "rc_argumentacion", "e": "Un auxiliar de bodega razona así: «De los 40 bombillos defectuosos, 30 son halógenos, o sea el 75 %. Por lo tanto, un bombillo halógeno tiene un 75 % de probabilidad de estar defectuoso». ¿Es correcto su razonamiento?", "f": "Cálculo propio a partir de los datos del caso (datos ficticios).", "vis": "", "o": [["A", "No, porque 30 ÷ 40 es la parte de los defectuosos que son halógenos, no la de halógenos defectuosos.", "El auxiliar confunde la proporción de halógenos dentro de los defectuosos (30/40) con la de defectuosos dentro de los halógenos (30/100).", true], ["B", "Sí, porque 30 de los 40 defectuosos son halógenos, y 30 ÷ 40 da exactamente 0,75, es decir, el 75 %.", "El cálculo es correcto, pero responde otra pregunta: qué parte de los defectuosos son halógenos.", false], ["C", "Sí, porque los halógenos defectuosos triplican a los LED defectuosos: 30 frente a 10, o sea 3 de cada 4.", "Que haya el triple de halógenos defectuosos no implica que el 75 % de los halógenos esté defectuoso.", false], ["D", "No, porque la probabilidad debe calcularse sobre todo el lote de 200 bombillos: 30 ÷ 200 = 15 %.", "Para un bombillo halógeno el total de referencia son los 100 halógenos, no los 200 del lote.", false]]}]}, {"comp": "razonamiento_cuantitativo", "sim": "tyt-1", "ind": "Tarifas de dos empresas de soporte técnico", "tt": "", "texto": "Una oficina compara dos empresas de soporte técnico en sistemas. La empresa A cobra $ 40.000 por la visita más $ 25.000 por cada hora de trabajo. La empresa B no cobra visita, pero cobra $ 35.000 por cada hora. La gráfica 1 muestra el costo total de cada empresa según el número de horas.", "vis": "<div class=\"vfig\"><svg class=\"vg\" viewBox=\"0 0 560 320\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Gráfica 1. Costo total según horas de trabajo\" font-family=\"Arial, sans-serif\" font-size=\"12\"><rect width=\"560\" height=\"320\" fill=\"#ffffff\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"13\" fill=\"#1d2433\">Gráfica 1. Costo total según horas de trabajo<\/text><line x1=\"60\" y1=\"258.0\" x2=\"540\" y2=\"258.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"262.0\" text-anchor=\"end\" fill=\"#3a4356\">0<\/text><line x1=\"60\" y1=\"202.5\" x2=\"540\" y2=\"202.5\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"206.5\" text-anchor=\"end\" fill=\"#3a4356\">50<\/text><line x1=\"60\" y1=\"147.0\" x2=\"540\" y2=\"147.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"151.0\" text-anchor=\"end\" fill=\"#3a4356\">100<\/text><line x1=\"60\" y1=\"91.5\" x2=\"540\" y2=\"91.5\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"95.5\" text-anchor=\"end\" fill=\"#3a4356\">150<\/text><line x1=\"60\" y1=\"36.0\" x2=\"540\" y2=\"36.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"40.0\" text-anchor=\"end\" fill=\"#3a4356\">200<\/text><line x1=\"60\" y1=\"258\" x2=\"540\" y2=\"258\" stroke=\"#3a4356\"/><line x1=\"60\" y1=\"258\" x2=\"60\" y2=\"36\" stroke=\"#3a4356\"/><text transform=\"translate(14,147.0) rotate(-90)\" text-anchor=\"middle\" fill=\"#3a4356\">Costo (miles de pesos)<\/text><text x=\"300.0\" y=\"312\" text-anchor=\"middle\" fill=\"#3a4356\">Horas de trabajo<\/text><text x=\"108.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">1<\/text><text x=\"204.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">2<\/text><text x=\"300.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">3<\/text><text x=\"396.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">4<\/text><text x=\"492.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">5<\/text><polyline fill=\"none\" stroke=\"#1660a8\" stroke-width=\"2.5\" points=\"108.0,185.8 204.0,158.1 300.0,130.3 396.0,102.6 492.0,74.8\"/><circle cx=\"108.0\" cy=\"185.8\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"108.0\" y=\"177.8\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">65<\/text><circle cx=\"204.0\" cy=\"158.1\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"204.0\" y=\"150.1\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">90<\/text><circle cx=\"300.0\" cy=\"130.3\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"300.0\" y=\"122.3\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">115<\/text><circle cx=\"396.0\" cy=\"102.6\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"396.0\" y=\"94.6\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">140<\/text><circle cx=\"492.0\" cy=\"74.8\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"492.0\" y=\"66.8\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">165<\/text><polyline fill=\"none\" stroke=\"#d9822b\" stroke-width=\"2.5\" points=\"108.0,219.2 204.0,180.3 300.0,141.4 396.0,102.6 492.0,63.8\"/><circle cx=\"108.0\" cy=\"219.2\" r=\"3.5\" fill=\"#d9822b\"/><text x=\"108.0\" y=\"236.2\" text-anchor=\"middle\" font-size=\"11\" fill=\"#d9822b\" font-weight=\"bold\">35<\/text><circle cx=\"204.0\" cy=\"180.3\" r=\"3.5\" fill=\"#d9822b\"/><text x=\"204.0\" y=\"197.3\" text-anchor=\"middle\" font-size=\"11\" fill=\"#d9822b\" font-weight=\"bold\">70<\/text><circle cx=\"300.0\" cy=\"141.4\" r=\"3.5\" fill=\"#d9822b\"/><text x=\"300.0\" y=\"158.4\" text-anchor=\"middle\" font-size=\"11\" fill=\"#d9822b\" font-weight=\"bold\">105<\/text><circle cx=\"396.0\" cy=\"102.6\" r=\"3.5\" fill=\"#d9822b\"/><text x=\"396.0\" y=\"119.6\" text-anchor=\"middle\" font-size=\"11\" fill=\"#d9822b\" font-weight=\"bold\">140<\/text><circle cx=\"492.0\" cy=\"63.8\" r=\"3.5\" fill=\"#d9822b\"/><text x=\"492.0\" y=\"80.8\" text-anchor=\"middle\" font-size=\"11\" fill=\"#d9822b\" font-weight=\"bold\">175<\/text><rect x=\"60\" y=\"286\" width=\"12\" height=\"12\" fill=\"#1660a8\"/><text x=\"76\" y=\"296\" fill=\"#1d2433\">Empresa A<\/text><rect x=\"149\" y=\"286\" width=\"12\" height=\"12\" fill=\"#d9822b\"/><text x=\"165\" y=\"296\" fill=\"#1d2433\">Empresa B<\/text><\/svg><\/div>", "items": [{"id": "RCT-114", "niv": 1, "cp": "rc_interpretacion", "e": "Para un trabajo de 2 horas, ¿qué empresa cobra menos y cuánto menos?", "f": "Cálculo propio a partir de los datos del caso (datos ficticios).", "vis": "", "o": [["A", "La empresa B, $ 10.000 menos.", "Compara solo las tarifas por hora (35.000 − 25.000); no tiene en cuenta el número de horas ni la visita.", false], ["B", "La empresa B, $ 20.000 menos.", "Con 2 horas, A cobra 40.000 + 2 × 25.000 = 90.000 y B cobra 2 × 35.000 = 70.000; B cobra 20.000 menos.", true], ["C", "La empresa A, $ 20.000 menos.", "Invierte las empresas: con 2 horas A cobra $ 90.000 y B $ 70.000, así que la más barata es B.", false], ["D", "Las dos empresas cobran lo mismo.", "Las dos cobran lo mismo con 4 horas, no con 2.", false]]}, {"id": "RCT-115", "niv": 2, "cp": "rc_formulacion", "e": "Si h es el número de horas de trabajo, ¿cuál expresión da el costo total C, en pesos, de la empresa A?", "f": "Cálculo propio a partir de lo
