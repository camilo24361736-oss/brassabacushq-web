e la casa.", "Los supervisores no hablan de los restaurantes.", false], ["B", "La que existe entre el derecho al trabajo de los operarios de planta y el derecho al descanso de los administrativos.", "Nadie plantea un conflicto de derechos entre operarios y administrativos; la queja es sobre coordinación.", false], ["C", "La que existe entre el gasto de energía en las casas y el ahorro en transporte de los administrativos.", "Esa es una tensión que viven los empleados administrativos, no la que expresan los supervisores.", false], ["D", "La que existe entre el ahorro de costos buscado por la empresa y la coordinación que exige la operación diaria.", "La medida se adoptó para ahorrar (energía, arriendo), pero los supervisores señalan que dificulta resolver problemas urgentes con el área administrativa: eficiencia en costos frente a coordinación operativa.", true]]}, {"id": "CCT-135", "niv": 3, "cp": "cc_sistemico", "e": "El gerente de otra fábrica, en la que casi todos los empleados son operarios que manejan máquinas, quiere aplicar la misma medida para ahorrar en energía y arriendo. ¿Qué es lo más adecuado afirmar?", "f": "Situación original elaborada para este simulacro, párrafo 1", "vis": "", "o": [["A", "Produciría los mismos ahorros, porque el ahorro depende solo del número total de empleados de la empresa.", "El ahorro depende de cuántos empleados puedan trabajar desde la casa, no del total de la planta.", false], ["B", "Su alcance sería limitado: el trabajo con máquinas se hace en la planta y pocos cargos podrían pasar a la casa.", "La medida funcionó con personal administrativo, cuyo trabajo puede hacerse en casa; en una empresa casi solo de operarios, muy pocos puestos podrían trasladarse y el ahorro sería menor.", true], ["C", "Sería más eficaz, porque los operarios consumen en la planta mucha más energía que los empleados administrativos.", "Aunque consumieran más energía, su trabajo con máquinas no puede hacerse desde la casa.", false], ["D", "No afectaría a ningún negocio cercano, porque los operarios de esa fábrica no almuerzan fuera de ella.", "El texto no da información sobre los hábitos de los operarios de la otra fábrica.", false]]}]}, {"comp": "ingles", "sim": "tyt-1", "ind": "Herramientas de taller", "tt": "", "texto": "Read the descriptions of some things you can find in a workshop. Which word (A–H) matches each description?\n\nA. hammer   B. saw   C. ladder   D. screwdriver   E. tape measure   F. drill   G. gloves   H. helmet\n\nExample: You climb this to reach high places. Answer: C (ladder).\n\nEach word can be used only once. The word in the example is not used again, and two words are not used at all.", "vis": "", "items": [{"id": "EN1-201", "niv": 1, "cp": "en_p1", "e": "You use this to hit nails into wood.", "f": "Texto original: lista de herramientas de taller", "vis": "", "o": [["A", "hammer", "«Hammer» es «martillo»: con él se golpean («hit») los clavos («nails»).", true], ["B", "saw", "«saw» significa «serrucho»; no corresponde a esta descripción.", false], ["C", "ladder", "«Ladder» (escalera de mano) ya se usó en el ejemplo y no vuelve a usarse.", false], ["D", "screwdriver", "«screwdriver» significa «destornillador»; no corresponde a esta descripción.", false], ["E", "tape measure", "«tape measure» significa «flexómetro o cinta métrica»; no corresponde a esta descripción.", false], ["F", "drill", "«drill» significa «taladro»; no corresponde a esta descripción.", false], ["G", "gloves", "«gloves» significa «guantes»; no corresponde a esta descripción.", false], ["H", "helmet", "«helmet» significa «casco»; no corresponde a esta descripción.", false]]}, {"id": "EN1-202", "niv": 1, "cp": "en_p1", "e": "You use this to cut wood into pieces.", "f": "Texto original: lista de herramientas de taller", "vis": "", "o": [["A", "hammer", "«hammer» significa «martillo»; no corresponde a esta descripción.", false], ["B", "saw", "«Saw» es «serrucho» o «sierra»: sirve para cortar madera en pedazos.", true], ["C", "ladder", "«Ladder» (escalera de mano) ya se usó en el ejemplo y no vuelve a usarse.", false], ["D", "screwdriver", "«screwdriver» significa «destornillador»; no corresponde a esta descripción.", false], ["E", "tape measure", "«tape measure» significa «flexómetro o cinta métrica»; no corresponde a esta descripción.", false], ["F", "drill", "«Drill» (taladro) hace huecos; no corta la madera en pedazos.", false], ["G", "gloves", "«gloves» significa «guantes»; no corresponde a esta descripción.", false], ["H", "helmet", "«helmet» significa «casco»; no corresponde a esta descripción.", false]]}, {"id": "EN1-203", "niv": 1, "cp": "en_p1", "e": "You wear these to protect your hands.", "f": "Texto original: lista de herramientas de taller", "vis": "", "o": [["A", "hammer", "«hammer» significa «martillo»; no corresponde a esta descripción.", false], ["B", "saw", "«saw» significa «serrucho»; no corresponde a esta descripción.", false], ["C", "ladder", "«Ladder» (escalera de mano) ya se usó en el ejemplo y no vuelve a usarse.", false], ["D", "screwdriver", "«screwdriver» significa «destornillador»; no corresponde a esta descripción.", false], ["E", "tape measure", "«tape measure» significa «flexómetro o cinta métrica»; no corresponde a esta descripción.", false], ["F", "drill", "«drill» significa «taladro»; no corresponde a esta descripción.", false], ["G", "gloves", "«Gloves» son «guantes»: se usan («wear») para proteger las manos; «these» pide una palabra en plural.", true], ["H", "helmet", "«Helmet» (casco) también es protección, pero para la cabeza, no para las manos.", false]]}, {"id": "EN1-204", "niv": 1, "cp": "en_p1", "e": "You use this to find out how long something is.", "f": "Texto original: lista de herramientas de taller", "vis": "", "o": [["A", "hammer", "«hammer» significa «martillo»; no corresponde a esta descripción.", false], ["B", "saw", "«saw» significa «serrucho»; no corresponde a esta descripción.", false], ["C", "ladder", "«Ladder» (escalera de mano) ya se usó en el ejemplo y no vuelve a usarse.", false], ["D", "screwdriver", "«screwdriver» significa «destornillador»; no corresponde a esta descripción.", false], ["E", "tape measure", "«Tape measure» es «flexómetro» o «cinta métrica»: sirve para saber cuánto mide («how long») algo.", true], ["F", "drill", "«drill» significa «taladro»; no corresponde a esta descripción.", false], ["G", "gloves", "«gloves» significa «guantes»; no corresponde a esta descripción.", false], ["H", "helmet", "«helmet» significa «casco»; no corresponde a esta descripción.", false]]}, {"id": "EN1-205", "niv": 2, "cp": "en_p1", "e": "This machine makes holes in walls or wood.", "f": "Texto original: lista de herramientas de taller", "vis": "", "o": [["A", "hammer", "«hammer» significa «martillo»; no corresponde a esta descripción.", false], ["B", "saw", "«Saw» (serrucho) corta la madera, pero no hace huecos en las paredes.", false], ["C", "ladder", "«Ladder» (escalera de mano) ya se usó en el ejemplo y no vuelve a usarse.", false], ["D", "screwdriver", "«Screwdriver» (destornillador) sirve para atornillar; no es una máquina que haga huecos.", false], ["E", "tape measure", "«tape measure» significa «flexómetro o cinta métrica»; no corresponde a esta descripción.", false], ["F", "drill", "«Drill» es «taladro»: una máquina que hace huecos («holes») en paredes o madera.", true], ["G", "gloves", "«gloves» significa «guantes»; no corresponde a esta descripción.", false], ["H", "helmet", "«helmet» significa «casco»; no corresponde a esta descripción.", false]]}]}, {"comp": "ingles", "sim": "tyt-1", "ind": "Avisos en lugares de trabajo", "tt": "", "texto": "Read each notice. Where can you see it? Choose the correct place.", "vis": "", "items": [{"id": "EN1-206", "niv": 1, "cp": "en_p2", "e": "\"Staff only. Customers may not enter the kitchen.\"\n\nWhere can you see this notice?", "f": "Aviso original", "vis": "", "o": [["A", "in a restaurant", "Hay clientes («customers») y una cocina a la que solo entra el personal («staff»): es un restaurante.", true], ["B", "at a bus stop", "En un paradero de bus no hay cocina ni personal que la atienda.", false], ["C", "in a library", "Una biblioteca no tiene una cocina para preparar comida a los clientes.", false]]}, {"id": "EN1-207", "niv": 1, "cp": "en_p2", "e": "\"All visitors must sign in at reception and wear a visitor badge. Employees: please use your ID card at the entrance gates. Meeting rooms are on the 3rd floor.\"\n\nWhere can you see this notice?", "f": "Aviso original", "vis": "", "o": [["A", "in a sports centre", "Un centro deportivo puede tener recepción, pero sus usuarios no llevan escarapela de visitante ni hay empleados que pasan carné hacia salas de reuniones.", false], ["B", "in an office", "Registro de visitantes en recepción, escarapela («visitor badge»), carné de empleados («employees… ID card») y salas de reuniones («meeting rooms») son propios de una oficina.", true], ["C", "at a bus station", "En una terminal de buses los viajeros no se registran en recepción ni usan escarapela de visitante.", false]]}, {"id": "EN1-208", "niv": 1, "cp": "en_p2", "e": "\"Hard hats must be worn beyond this point. Danger: scaffolding and falling bricks.\"\n\nWhere can you see this notice?", "f": "Aviso original", "vis": "", "o": [["A", "in a car park", "En un parqueadero («car park») no hay andamios ni ladrillos que caigan, ni se exige casco.", false], ["B", "at a garden centre", "Un vivero («garden centre») vende plantas; no tiene andamios ni exige casco de seguridad.", false], ["C", "on a building site", "Casco obligatorio («hard hats»), andamios («scaffolding») y ladrillos que pueden caer («falling bricks») indican una obra en construcción («building site»).", true]]}, {"id": "EN1-209", "niv": 2, "cp": "en_p2", "e": "\"Do not leave forklifts unattended with the engine running. Pedestrians must use the marked walkways.\"\n\nWhere can you see this notice?", "f": "Aviso original", "vis": "", "o": [["A", "in a doctor's waiting room", "En una sala de espera médica no circulan montacargas con el motor encendido.", false], ["B", "at a swimming pool", "En una piscina no hay montacargas ni pasillos para peatones separados de máquinas.", false], ["C", "in a warehouse", "«Forklifts» son montacargas, máquinas que mueven mercancía en una bodega («warehouse»); por eso los peatones deben usar los pasillos marcados.", true]]}, {"id": "EN1-210", "niv": 2, "cp": "en_p2", "e": "\"Lab coats and safety glasses are required. No food or drink near the samples.\"\n\nWhere can you see this notice?", "f": "Aviso original", "vis": "", "o": [["A", "in a clothes shop", "Aunque se mencionan prendas, en una tienda de ropa no hay muestras que proteger ni se exigen gafas de seguridad.", false], ["B", "in a laboratory", "Bata de laboratorio («lab coat»), gafas de seguridad y muestras («samples») indican un laboratorio.", true], ["C", "in a café", "En un café se sirve comida y bebida; el aviso la prohíbe.", false]]}, {"id": "EN1-211", "niv": 2, "cp": "en_p2", "e": "\"Please switch off your engine while refuelling. No smoking.\"\n\nWhere can you see this notice?", "f": "Aviso original", "vis": "", "o": [["A", "at a petrol station", "«Refuelling» es tanquear: apagar el motor y no fumar mientras se echa combustible es una norma de estación de gasolina («petrol station»).", true], ["B", "at a car showroom", "En una sala de exhibición de carros («showroom») los vehículos se muestran, no se tanquean.", false], ["C", "at a train station", "Los pasajeros de una estación de tren no apagan motores ni echan combustible.", false]]}]}, {"comp": "ingles", "sim": "tyt-1", "ind": "Conversaciones en el trabajo", "tt": "", "texto": "Complete the conversations. Choose the best reply to each sentence.", "vis": "", "items": [{"id": "EN1-212", "niv": 1, "cp": "en_p3", "e": "\"Can I speak to Mr Gómez, please?\"", "f": "Conversación original", "vis": "", "o": [["A", "He speaks very good English.", "Comenta cómo habla el señor Gómez, pero no responde a la petición de comunicarse con él.", false], ["B", "Yes, I can speak quite well.", "Responde literalmente sobre la capacidad de hablar de quien contesta, no sobre comunicarse con el señor Gómez.", false], ["C", "Sorry, he's in a meeting.", "Es la respuesta natural en una oficina: el señor Gómez no puede atender porque está en una reunión.", true]]}, {"id": "EN1-213", "niv": 1, "cp": "en_p3", "e": "\"How long have you worked here?\"", "f": "Conversación original", "vis": "", "o": [["A", "Every day from nine to five.", "Describe el horario diario, no cuánto tiempo lleva trabajando allí («How long»).", false], ["B", "For about three years.", "«How long» pregunta por duración; con presente perfecto se responde con «for» + período: «For about three years».", true], ["C", "By bus, usually, with my sister.", "«By bus» responde «How do you get here?», no cuánto tiempo lleva trabajando.", false]]}, {"id": "EN1-214", "niv": 2, "cp": "en_p3", "e": "\"Could you send me the report by Friday?\"", "f": "Conversación original", "vis": "", "o": [["A", "Sure, I'll email it on Thursday.", "Acepta la petición («Sure») y promete enviarlo el jueves, antes del plazo («by Friday» = a más tardar el viernes).", true], ["B", "Thank you, that's very kind of you.", "«That's very kind of you» agradece un favor; aquí es la otra persona quien pide algo.", false], ["C", "Yes, the report is about sales.", "Dice de qué trata el informe, pero no responde si podrá enviarlo antes del viernes.", false]]}, {"id": "EN1-215", "niv": 2, "cp": "en_p3", "e": "\"The printer on the second floor isn't working again.\"", "f": "Conversación original", "vis": "", "o": [["A", "Yes, it works very well, thank you.", "Contradice lo que se acaba de decir: la impresora no funciona.", false], ["B", "I'll call the technician.", "Ante un problema con la impresora, ofrecerse a llamar al técnico es una respuesta natural y útil.", true], ["C", "Again, please.", "«Again, please» pide repetir algo; no responde al problema de la impresora.", false]]}, {"id": "EN1-216", "niv": 2, "cp": "en_p3", "e": "\"Do you mind if I leave a bit early today?\"", "f": "Conversación original", "vis": "", "o": [["A", "Yes, I left early yesterday.", "«Yes» ante «Do you mind if…?» significaría que sí le molesta, y además habla de lo que hizo ayer; no responde a la petición de permiso.", false], ["B", "Yes, I'd like to.", "«I'd like to» acepta una invitación; no responde a una petición de permiso.", false], ["C", "No problem. Just finish the invoices first.", "«Do you mind if…?» = ¿le molesta si…?; «No problem» indica que no le molesta, es decir, da permiso, y añade una condición razonable.", true]]}, {"id": "EN1-217", "niv": 3, "cp": "en_p3", "e": "\"We're running behind schedule on the Medellín project.\"", "f": "Conversación original", "vis": "", "o": [["A", "Then we need more people or a later deadline.", "«Running behind schedule» = ir atrasados; proponer más personal o mover la fecha límite es una respuesta lógica.", true], ["B", "I'm sorry, I don't run very fast.", "Toma «running» en sentido literal (correr), cuando la expresión significa ir con retraso.", false], ["C", "Great! So we can finish much earlier than planned.", "Interpreta lo contrario: ir atrasado no permite terminar antes.", false]]}]}, {"comp": "ingles", "sim": "tyt-1", "ind": "El código QR", "tt": "", "texto": "Read the text and choose the right word for each gap.\n\nQR codes\n\nQR codes are the black-and-white squares that we now see on menus, tickets and packages. They (1) ______ invented in Japan in 1994 by an engineer called Masahiro Hara. At that time, he worked for a company that made parts (2) ______ cars. Workers in its factories had to scan many barcodes every day, and each barcode could only hold a small amount of information. Hara wanted a code that could store more data (3) ______ be read very quickly. His team placed three special squares in the corners of the code, so a machine can recognise it from (4) ______ angle. Today, a QR code can hold thousands of numbers, and (5) ______ with a smartphone can scan one.", "vis": "", "items": [{"id": "EN1-218", "niv": 1, "cp": "en_p4", "e": "Gap (1)", "f": "Texto original «QR codes», espacio 1", "vis": "", "o": [["A", "did", "«Did invented» es agramatical: la pasiva se forma con «be» + participio.", false], ["B", "was", "«Was» es singular; el sujeto «they» es plural.", false], ["C", "were", "Es voz pasiva en pasado con sujeto plural («they» = los códigos QR): «they were invented» (fueron inventados).", true]]}, {"id": "EN1-219", "niv": 1, "cp": "en_p4", "e": "Gap (2)", "f": "Texto original «QR codes», espacio 2", "vis": "", "o": [["A", "for", "«Parts for cars» = repuestos para carros: «for» indica el destino de las piezas.", true], ["B", "by", "«By» indicaría quién hace algo; los carros no fabrican las piezas.", false], ["C", "at", "«At» indica lugar o punto; «parts at cars» no tiene sentido.", false]]}, {"id": "EN1-220", "niv": 2, "cp": "en_p4", "e": "Gap (3)", "f": "Texto original «QR codes», espacio 3", "vis": "", "o": [["A", "so", "«So» introduce una consecuencia y necesitaría un sujeto («so it could be read»).", false], ["B", "and", "Hara quería dos cosas a la vez: guardar más datos «y» (and) leerse rápido; «and» une los dos verbos después de «could».", true], ["C", "because", "«Because be read» es agramatical: «because» necesita una oración completa con sujeto.", false]]}, {"id": "EN1-221", "niv": 2, "cp": "en_p4", "e": "Gap (4)", "f": "Texto original «QR codes», espacio 4", "vis": "", "o": [["A", "any", "«From any angle» = desde cualquier ángulo, con sustantivo singular: así la máquina lo reconoce sin importar la posición.", true], ["B", "all", "«All» con este significado iría con plural («from all angles»); «all angle» es incorrecto.", false], ["C", "no", "«From no angle» diría que la máquina no lo reconoce desde ningún ángulo, lo contrario de lo que explica el texto.", false]]}, {"id": "EN1-222", "niv": 2, "cp": "en_p4", "e": "Gap (5)", "f": "Texto original «QR codes», espacio 5", "vis": "", "o": [["A", "nobody", "«Nobody» contradiría la idea de que hoy los códigos QR son de uso común.", false], ["B", "somewhere", "«Somewhere» indica lugar y no puede ser el sujeto de «can scan».", false], ["C", "anyone", "«Anyone with a smartphone can scan one» = cualquier persona con un celular puede escanearlo; «anyone» es el sujeto.", true]]}]}, {"comp": "ingles", "sim": "tyt-1", "ind": "El contenedor de carga", "tt": "", "texto": "Read the text and choose the right word for each gap.\n\nThe box that changed trade\n\nBefore the 1950s, loading a ship was slow and expensive. Workers carried boxes, bags and barrels one by one, and a ship could spend days in port. Malcom McLean, the owner of a trucking company in North Carolina, thought there (1) ______ be a better way. Instead of moving each product separately, why not put the goods into large metal boxes that could go directly from a truck (2) ______ a ship?\n\nOn 26 April 1956, an old tanker called the Ideal X left Newark, New Jersey, carrying 58 of these containers to Houston, Texas. Loading them took (3) ______ than eight hours. The new system made loading cargo much cheaper. Soon, ports around the world had to build special cranes, and ships were designed to carry thousands of containers. Today, most of the products we buy, from phones to shoes, (4) ______ part of their journey inside a container. Some experts say that this simple box changed world trade more than (5) ______ invention of the twentieth century.", "vis": "", "items": [{"id": "EN1-223", "niv": 2, "cp": "en_p4", "e": "Gap (1)", "f": "Texto original «The box that changed trade», espacio 1", "vis": "", "o": [["A", "has", "«Has be» es agramatical; después de «has» iría un participio («has been»).", false], ["B", "must", "«Must be» expresa una deducción o convicción: McLean pensaba que «tenía que haber» una mejor manera.", true], ["C", "mustn't", "«Mustn't be a better way» diría que no debe haber una manera mejor, lo contrario de su idea.", false]]}, {"id": "EN1-224", "niv": 2, "cp": "en_p4", "e": "Gap (2)", "f": "Texto original «The box that changed trade», espacio 2", "vis": "", "o": [["A", "from", "Repetir «from» («from a truck from a ship») no indica destino.", false], ["B", "to", "«From… to…» marca el origen y el destino: del camión al barco.", true], ["C", "at", "«At» indica ubicación fija; después de «from a truck» se necesita «to» para el destino.", false]]}, {"id": "EN1-225", "niv": 2, "cp": "en_p4", "e": "Gap (3)", "f": "Texto original «The box that changed trade», espacio 3", "vis": "", "o": [["A", "lower", "«Lower» se usa con precios, niveles o posiciones; con tiempo se dice «less than».", false], ["B", "least", "«Least» es superlativo y no se usa con «than».", false], ["C", "less", "«Less than eight hours» = menos de ocho horas: comparativo de «little» seguido de «than».", true]]}, {"id": "EN1-226", "niv": 3, "cp": "en_p4", "e": "Gap (4)", "f": "Texto original «The box that changed trade», espacio 4", "vis": "", "o": [["A", "spend", "El sujeto real es «most of the products» (plural) y el texto está en presente: «spend part of their journey».", true], ["B", "spending", "«Spending» no puede ser el verbo principal de la oración sin un auxiliar.", false], ["C", "spends", "«Spends» concuerda con un sujeto singular, pero en «most of the products» el sustantivo que manda es «products», plural.", false]]}, {"id": "EN1-227", "niv": 3, "cp": "en_p4", "e": "Gap (5)", "f": "Texto original «The box that changed trade», espacio 5", "vis": "", "o": [["A", "any other", "En comparaciones con un sustantivo singular se usa «more than any other + sustantivo»: más que cualquier otro invento.", true], ["B", "all other", "«All other» exigiría plural («all other inventions»); con «invention» en singular es incorrecto.", false], ["C", "other", "«Other invention» en singular necesita un determinante («any other», «another»).", false]]}]}, {"comp": "ingles", "sim": "tyt-1", "ind": "Un técnico en refrigeración", "tt": "", "texto": "Read the text and answer the questions.\n\nA day in the life of a refrigeration technician\n\nAndrés Molina is 29 and works as a refrigeration technician for a company in Barranquilla. He installs and repairs cold rooms for supermarkets, hospitals and fish markets. He studied for two years at a technical institute and then worked as an assistant for another two years before he could lead a team.\n\nHis working day starts at 7 a.m., when he checks the list of jobs on a tablet. Most days he visits three or four clients. \"The emergency calls are the hardest part,\" he says. \"If a cold room fails at night, a shop can lose all its fish or medicines in a few hours, so I have to be ready to go.\"\n\nAndrés enjoys solving problems, but he admits that the job is physically demanding: he often works on very hot rooftops and in very cold rooms on the same day. Next year he plans to take a course on new refrigerants that are less harmful to the environment.", "vis": "", "items": [{"id": "EN1-228", "niv": 1, "cp": "en_p5", "e": "What does Andrés do in his job?", "f": "Texto original «A day in the life of a refrigeration technician», párrafo 1", "vis": "", "o": [["A", "He sells fresh fish to local supermarkets.", "Los supermercados y pescaderías son sus clientes; él no vende pescado.", false], ["B", "He teaches at a technical institute.", "Estudió en un instituto técnico, pero no enseña allí.", false], ["C", "He fits and fixes refrigerated rooms.", "El texto dice «He installs and repairs cold rooms»: instala («fits») y repara («fixes») cuartos fríos o refrigerados.", true]]}, {"id": "EN1-229", "niv": 1, "cp": "en_p5", "e": "How does Andrés find out about his jobs each day?", "f": "Texto original «A day in the life of a refrigeration technician», párrafo 2", "vis": "", "o": [["A", "Clients send him letters.", "El texto no menciona cartas de los clientes.", false], ["B", "He consults a digital device.", "«He checks the list of jobs on a tablet»: consulta la lista en una tableta, que es un dispositivo digital.", true], ["C", "His manager phones him at 7 a.m.", "A las 7 a. m. empieza su jornada revisando la tableta; no se menciona una llamada del jefe.", false]]}, {"id": "EN1-230", "niv": 2, "cp": "en_p5", "e": "Before Andrés could lead a team, he…", "f": "Texto original «A day in the life of a refrigeration technician», párrafo 1", "vis": "", "o": [["A", "studied full time for four years at a technical institute.", "Estudió dos años, no cuatro; los otros dos fueron de trabajo como asistente.", false], ["B", "studied and then gained experience as an assistant.", "Estudió dos años y luego trabajó otros dos como asistente antes de dirigir un equipo.", true], ["C", "worked alone for four years.", "Los cuatro años incluyen estudio y trabajo como asistente; no trabajó solo.", false]]}, {"id": "EN1-231", "niv": 2, "cp": "en_p5", "e": "Why are emergency calls difficult, according to Andrés?", "f": "Texto original «A day in the life of a refrigeration technician», párrafo 2", "vis": "", "o": [["A", "He has to drive long distances to other cities.", "El texto no menciona viajes largos a otras ciudades.", false], ["B", "The equipment is more expensive at night.", "No se habla del costo de los equipos durante la noche.", false], ["C", "Clients can lose their products in a few hours.", "Si un cuarto frío falla de noche, el negocio puede perder el pescado o los medicamentos «in a few hours»; por eso debe estar listo para salir.", true]]}]}, {"comp": "ingles", "sim": "tyt-1", "ind": "El código de barras", "tt": "", "texto": "Read the text and answer the questions.\n\nThe beep that changed shopping\n\nOn the morning of 26 June 1974, at a supermarket in Troy, Ohio, a cashier passed a ten-pack of chewing gum over a new scanner at the checkout. A laser read the black and white lines printed on the packet, and the computerised till showed the price immediately. It was the first time a product had been sold by scanning a Universal Product Code, or UPC.\n\nThe barcode was not the work of one person. In the early 1970s, a committee of leading grocery companies asked technology firms to propose a standard code that all shops and producers could use. The committee chose a rectangular design based on a proposal by George Laurer, an engineer at IBM, partly because it was easier to print clearly than a round design that had been tested before.\n\nShop owners hoped scanners would make queues shorter and reduce mistakes at the till. However, the system only made sense if most products carried a code, and manufacturers did not want to pay for new labels until enough shops had scanners. For several years, progress was slow.\n\nToday, barcodes are everywhere: they are used to follow parcels, to identify patients in hospitals and to control stock in warehouses. Most people never think about them until a scanner refuses to read one.", "vis": "", "items": [{"id": "EN1-232", "niv": 2, "cp": "en_p5", "e": "What was special about the sale in Troy, Ohio?", "f": "Texto original «The beep that changed shopping», párrafo 1", "vis": "", "o": [["A", "It was the first sale made by scanning a UPC barcode.", "«It was the first time a product had been sold by scanning a Universal Product Code»: fue la primera venta en la que se escaneó un código UPC.", true], ["B", "It was the first shop to accept payment by card.", "El texto no menciona pagos con tarjeta.", false], ["C", "It was the first time chewing gum was sold in a supermarket.", "Lo novedoso no era vender chicle, sino escanear su código de barras.", false]]}, {"id": "EN1-233", "niv": 2, "cp": "en_p5", "e": "Who made the final decision about the UPC design?", "f": "Texto original «The beep that changed shopping», párrafo 2", "vis": "", "o": [["A", "An engineer who worked at IBM.", "George Laurer, ingeniero de IBM, propuso el diseño, pero la decisión final la tomó el comité.", false], ["B", "A grocery industry committee.", "«The committee chose a rectangular design»: lo escogió el comité de empresas de alimentos y abarrotes.", true], ["C", "The supermarket in Troy.", "El supermercado de Troy solo hizo la primera venta con escáner; no eligió el diseño.", false]]}, {"id": "EN1-234", "niv": 2, "cp": "en_p5", "e": "Why was the rectangular design preferred?", "f": "Texto original «The beep that changed shopping», párrafo 2", "vis": "", "o": [["A", "It was cheaper than a laser scanner.", "El texto no compara el costo del diseño con el del escáner láser.", false], ["B", "It looked more modern than the round one.", "No se menciona el aspecto moderno; la razón dada es la claridad de impresión.", false], ["C", "It could be printed more clearly.", "«It was easier to print clearly than a round design»: se imprimía con más nitidez que el diseño redondo.", true]]}, {"id": "EN1-235", "niv": 3, "cp": "en_p5", "e": "Why did barcodes spread slowly at first?", "f": "Texto original «The beep that changed shopping», párrafo 3", "vis": "", "o": [["A", "Shops and producers were waiting for each other.", "Los fabricantes no querían pagar etiquetas hasta que hubiera escáneres, y el sistema solo servía si la mayoría de productos tenía código: cada parte esperaba a la otra.", true], ["B", "Customers did not trust the new scanners.", "El texto no menciona la desconfianza de los clientes como causa de la lentitud.", false], ["C", "The laser scanners often made mistakes at the till.", "Se esperaba que los escáneres redujeran los errores; no se dice que se equivocaran.", false]]}, {"id": "EN1-236", "niv": 3, "cp": "en_p5", "e": "According to the last paragraph, barcodes today are…", "f": "Texto original «The beep that changed shopping», párrafo 4", "vis": "", "o": [["A", "being replaced by other codes in hospitals.", "En los hospitales se usan para identificar pacientes; el texto no habla de reemplazarlos.", false], ["B", "mainly noticed by people who work in warehouses.", "El texto dice que la mayoría de la gente no piensa en ellos; no dice que sean más visibles para los trabajadores de bodegas.", false], ["C", "used in many areas beyond supermarket checkouts.", "Se usan para rastrear paquetes, identificar pacientes y controlar inventarios: mucho más allá de las cajas de supermercado.", true]]}]}, {"comp": "ingles", "sim": "tyt-1", "ind": "Listas de chequeo en mantenimiento", "tt": "", "texto": "Read the text and answer the questions.\n\nWhat a broken pump taught me about checklists\n\nFor eleven years I have been a maintenance supervisor at a bottling plant. For most of that time, I believed checklists were for beginners. Experienced technicians, I thought, know the machines too well to need a piece of paper telling them what to do.\n\nI changed my mind on a Monday morning two years ago. One of our best technicians, a man with more experience than me, finished a routine repair on a water pump and restarted the line. Within ten minutes, the pump was leaking all over the floor. He had forgotten to replace a small seal, a step he had done hundreds of times. Nobody was hurt, but we lost a full shift of production.\n\nWhen we talked about it later, it was clear that he had not been careless or lazy. He had been interrupted twice by phone calls during the job. That was all it took.\n\nAfter that day, we wrote short checklists for our twenty most common repairs. I expected protests, and I got some. A few of the older technicians said the lists were an insult to their experience. I understood the feeling; I had said the same thing myself. But we kept the lists short, no more than ten lines each, and we asked the technicians themselves to write them.\n\nIn the last eighteen months, unplanned stops on the line have fallen noticeably. I would not claim that the checklists are the only reason; we also changed some suppliers. Still, I no longer see a checklist as a sign that someone doesn't know their job. I see it as a sign that they understand how easy it is to forget.", "vis": "", "items": [{"id": "EN1-237", "niv": 2, "cp": "en_p6", "e": "What is the writer's main purpose?", "f": "Texto original «What a broken pump taught me about checklists», texto completo", "vis": "", "o": [["A", "To complain about technicians who make careless mistakes.", "El autor aclara que el técnico no fue descuidado ni perezoso; no es una queja.", false], ["B", "To give technical instructions for repairing a water pump.", "La bomba es solo el ejemplo; el texto no da instrucciones de reparación.", false], ["C", "To compare different suppliers of factory equipment.", "Los proveedores se mencionan de paso; no hay ninguna comparación entre ellos.", false], ["D", "To explain why their view of checklists changed.", "El texto parte de lo que el autor creía antes («checklists were for beginners») y narra el episodio que lo hizo cambiar («I changed my mind»).", true]]}, {"id": "EN1-238", "niv": 2, "cp": "en_p6", "e": "Why does the writer say that the technician had \"more experience than me\"?", "f": "Texto original «What a broken pump taught me about checklists», párrafo 2", "vis": "", "o": [["A", "To show that even experts can make simple mistakes.", "Si el error lo cometió alguien con más experiencia que el supervisor, el ejemplo muestra que cualquiera puede olvidar un paso.", true], ["B", "To explain why the technician refused to use a checklist.", "En ese momento no existían listas de chequeo; no pudo negarse a usarlas.", false], ["C", "To prove that experience is not useful in maintenance.", "Es una generalización excesiva: el autor no dice que la experiencia sea inútil, sino que no impide olvidar.", false], ["D", "To suggest that the technician should have been the supervisor.", "El texto no discute quién debería ser supervisor.", false]]}, {"id": "EN1-239", "niv": 3, "cp": "en_p6", "e": "According to the writer, what really caused the leak?", "f": "Texto original «What a broken pump taught me about checklists», párrafos 2 y 3", "vis": "", "o": [["A", "A design problem in the water pump.", "El texto no menciona fallas de diseño en la bomba.", false], ["B", "The technician's lack of interest in his work.", "El autor descarta esa explicación: «he had not been careless or lazy».", false], ["C", "Interruptions that broke his concentration.", "«He had been interrupted twice by phone calls… That was all it took»: las interrupciones bastaron para que olvidara el sello.", true], ["D", "A defective seal sent by a supplier.", "El sello no estaba defectuoso: el técnico olvidó cambiarlo; los proveedores aparecen en otro contexto.", false]]}, {"id": "EN1-240", "niv": 3, "cp": "en_p6", "e": "Why did the writer most likely ask the technicians to write the checklists themselves?", "f": "Texto original «What a broken pump taught me about checklists», párrafo 4", "vis": "", "o": [["A", "To use their knowledge and reduce resistance.", "Tras mencionar las protestas y el sentimiento de «insulto a su experiencia», el autor dice «But…»: que ellos las redactaran respetaba su saber y reducía la resistencia.", true], ["B", "Because the writer did not know how to do the repairs.", "Nada indica que el supervisor no conozca las reparaciones; el motivo se relaciona con las protestas.", false], ["C", "Because the company could not afford an outside consultant.", "El texto no habla de costos ni de consultores externos.", false], ["D", "To give the older technicians extra work as a punishment.", "El tono es comprensivo («I understood the feeling»); no hay intención de castigo.", false]]}, {"id": "EN1-241", "niv": 3, "cp": "en_p6", "e": "How does the writer present the improvement on the line?", "f": "Texto original «What a broken pump taught me about checklists», párrafo 5", "vis": "", "o": [["A", "By saying that the writer still prefers working without lists.", "El autor cambió de opinión y ahora valora las listas.", false], ["B", "By admitting that the lists may not be the only cause.", "Dice que las paradas bajaron, pero aclara «I would not claim that the checklists are the only reason; we also changed some suppliers».", true], ["C", "By pointing out that unplanned stops increased.", "Las paradas no planeadas disminuyeron («have fallen noticeably»); no aumentaron.", false], ["D", "By presenting the lists as the single explanation.", "El autor evita atribuir todo el resultado a las listas: menciona también el cambio de proveedores.", false]]}, {"id": "EN1-242", "niv": 3, "cp": "en_p6", "e": "According to the last sentence, what does the writer now think about using a checklist?", "f": "Texto original «What a broken pump taught me about checklists», párrafo 5", "vis": "", "o": [["A", "It is more necessary for new workers than for experienced ones.", "Esa era la opinión antigua del autor («checklists were for beginners»), que ya abandonó.", false], ["B", "It is mainly needed by careless people.", "El texto muestra lo contrario: un técnico cuidadoso y experto olvidó un paso.", false], ["C", "It reflects an awareness of human limits, not a lack of skill.", "El autor ya no ve la lista como señal de ignorancia, sino de que se entiende lo fácil que es olvidar: reconocer los límites humanos.", true], ["D", "It shows that technicians do not respect their supervisors.", "La última frase no habla de la relación con los supervisores.", false]]}]}, {"comp": "ingles", "sim": "tyt-1", "ind": "La entrevista de trabajo", "tt": "", "texto": "Read the text and choose the right word for each gap.\n\nPreparing for a job interview\n\nGoing to a job interview can make anyone nervous, but good preparation helps a lot. First, find out as much as you can (1) ______ the company: what it does, who its clients are and what it values. Then read the job description again and think of examples from your studies or work experience that show you have the skills they (2) ______ looking for.\n\nOn the day of the interview, plan your journey carefully and try to arrive ten minutes (3) ______. Dress in a way that suits the company. During the interview, listen carefully to each question and don't be afraid to (4) ______ a moment to think before you answer. At the end, the interviewer will probably ask if you have any questions. It is a good idea to (5) ______ one or two ready, for example about training opportunities. Finally, send a short message to thank them for their time. It shows that you are polite and really (6) ______ in the job.", "vis": "", "items": [{"id": "EN1-243", "niv": 1, "cp": "en_p7", "e": "Gap (1)", "f": "Texto original «Preparing for a job interview», espacio 1", "vis": "", "o": [["A", "of", "«Find out of» no es una combinación correcta en inglés.", false], ["B", "with", "«Find out with» no expresa el tema de la investigación.", false], ["C", "for", "«Find out for the company» significaría averiguar algo para la empresa, no sobre ella.", false], ["D", "about", "«Find out about something» = averiguar sobre algo: investigar sobre la empresa.", true]]}, {"id": "EN1-244", "niv": 1, "cp": "en_p7", "e": "Gap (2)", "f": "Texto original «Preparing for a job interview», espacio 2", "vis": "", "o": [["A", "is", "«Is» es singular; el sujeto «they» es plural.", false], ["B", "are", "«Look for» en presente continuo con sujeto «they»: «they are looking for» (están buscando).", true], ["C", "have", "«Have looking» es agramatical; con «have» iría el participio («have looked»).", false], ["D", "do", "«Do looking» es agramatical: el presente continuo se forma con «be», no con «do».", false]]}, {"id": "EN1-245", "niv": 1, "cp": "en_p7", "e": "Gap (3)", "f": "Texto original «Preparing for a job interview», espacio 3", "vis": "", "o": [["A", "fast", "«Fast» describe velocidad, no anticipación respecto a una hora.", false], ["B", "quick", "«Quick» es adjetivo de velocidad; no expresa llegar antes de tiempo.", false], ["C", "early", "«Arrive ten minutes early» = llegar diez minutos antes de la hora.", true], ["D", "soon", "«Soon» significa «pronto, dentro de poco»; «ten minutes soon» es incorrecto.", false]]}, {"id": "EN1-246", "niv": 2, "cp": "en_p7", "e": "Gap (4)", "f": "Texto original «Preparing for a job interview», espacio 4", "vis": "", "o": [["A", "take", "La colocación es «take a moment» = tomarse un momento.", true], ["B", "do", "«Do a moment» no existe como expresión.", false], ["C", "make", "«Make a moment» no es una colocación del inglés.", false], ["D", "give", "«Give a moment» necesitaría a alguien que lo reciba («give me a moment»), y aquí es el candidato quien se toma el tiempo.", false]]}, {"id": "EN1-247", "niv": 2, "cp": "en_p7", "e": "Gap (5)", "f": "Texto original «Preparing for a job interview», espacio 5", "vis": "", "o": [["A", "make", "«Make one or two ready» no es natural; «make ready» no se usa con preguntas.", false], ["B", "say", "«Say one or two ready» no tiene sentido: no se trata de decir las preguntas, sino de tenerlas preparadas.", false], ["C", "do", "«Do one or two ready» es agramatical.", false], ["D", "have", "«Have something ready» = tener algo listo: tener una o dos preguntas preparadas.", true]]}, {"id": "EN1-248", "niv": 2, "cp": "en_p7", "e": "Gap (6)", "f": "Texto original «Preparing for a job interview», espacio 6", "vis": "", "o": [["A", "interests", "«Interests» es plural del sustantivo o verbo conjugado; no puede seguir a «are really».", false], ["B", "interesting", "«Interesting» (interesante) describe algo que causa interés, no a la persona que lo siente.", false], ["C", "interest", "«Interest» es sustantivo o verbo; después de «you are really» se necesita un adjetivo.", false], ["D", "interested", "Para describir lo que siente una persona se usa el adjetivo en -ed: «interested in the job» (interesado en el cargo).", true]]}]}, {"comp": "ingles", "sim": "tyt-1", "ind": "La línea de ensamblaje", "tt": "", "texto": "Read the text and choose the right word for each gap.\n\nThe moving assembly line\n\nIn the early 1900s, building a car was a slow process. A small team of workers stayed in one place and built each vehicle from start to finish, a job (1) ______ took many hours. At Ford's Highland Park plant in Michigan, engineers decided to try a different approach. Instead of workers moving around the car, the car would move (2) ______ the workers.\n\nIn 1913, after experimenting with smaller components, Ford introduced a moving assembly line for the whole chassis. Each worker was responsible (3) ______ only one or two simple tasks, which he repeated again and again as the vehicles passed in front of him. The results were remarkable: the time needed to assemble a Model T chassis fell from more than twelve hours to about an hour and a half. As production costs went down, (4) ______ did the price of the car, and many more families could afford one.\n\nHowever, the new system also had a (5) ______. Many workers found the repetitive tasks boring and exhausting, and a large number of them quit. To (6) ______ this problem, Ford introduced a daily wage of five dollars in 1914, roughly double what many factory workers earned at the time. The assembly line soon spread to other industries, and its basic principles are still (7) ______ in factories today.", "vis": "", "items": [{"id": "EN1-249", "niv": 2, "cp": "en_p7", "e": "Gap (1)", "f": "Texto original «The moving assembly line», espacio 1", "vis": "", "o": [["A", "what", "«What» no funciona como pronombre relativo después de un sustantivo («a job what» es incorrecto).", false], ["B", "which", "«Which» es el pronombre relativo para cosas: «a job which took many hours» (un trabajo que tomaba muchas horas).", true], ["C", "who", "«Who» se usa para personas; «a job» es una cosa.", false], ["D", "where", "«Where» se refiere a lugares y no puede ser sujeto de «took».", false]]}, {"id": "EN1-250", "niv": 2, "cp": "en_p7", "e": "Gap (2)", "f": "Texto original «The moving assembly line», espacio 2", "vis": "", "o": [["A", "onto", "«Onto» indica movimiento para quedar encima de algo; el carro no sube encima de los obreros.", false], ["B", "upon", "«Upon» (sobre) no expresa dirección hacia los trabajadores.", false], ["C", "past", "La idea es invertir el movimiento: en vez de que los obreros se muevan, el carro pasa por delante de ellos («move past»), como confirma «as the vehicles passed in front of him».", true], ["D", "against", "«Against» (contra) sugiere choque u oposición, no el desplazamiento del carro hacia los puestos de trabajo.", false]]}, {"id": "EN1-251", "niv": 3, "cp": "en_p7", "e": "Gap (3)", "f": "Texto original «The moving assembly line», espacio 3", "vis": "", "o": [["A", "for", "El adjetivo «responsible» rige la preposición «for»: «responsible for» (responsable de).", true], ["B", "of", "En español se dice «responsable de», pero en inglés no se usa «responsible of».", false], ["C", "to", "«Responsible to» significa rendir cuentas a una persona (responsible to the manager), no encargarse de tareas.", false], ["D", "with", "«Responsible with» no es la combinación que expresa estar a cargo de una tarea.", false]]}, {"id": "EN1-252", "niv": 3, "cp": "en_p7", "e": "Gap (4)", "f": "Texto original «The moving assembly line», espacio 4", "vis": "", "o": [["A", "too", "«Too» va al final («the price did too»); no puede ir antes del auxiliar invertido.", false], ["B", "so", "La estructura «so + auxiliar + sujeto» indica que lo mismo le pasó a otra cosa: «so did the price» (también bajó el precio).", true], ["C", "either", "«Either» se usa en oraciones negativas («neither did…», «…didn't either»); aquí la idea es afirmativa.", false], ["D", "also", "«Also did the price» es agramatical; «also» no provoca la inversión del auxiliar.", false]]}, {"id": "EN1-253", "niv": 3, "cp": "en_p7", "e": "Gap (5)", "f": "Texto original «The moving assembly line», espacio 5", "vis": "", "o": [["A", "downside", "«However» anuncia algo negativo y el artículo «a» exige un sustantivo contable: «a downside» (una desventaja), como explica la oración siguiente.", true], ["B", "damage", "«Damage» (daño) es incontable en este sentido, así que no puede ir después de «a»; además, el texto no habla de daños materiales.", false], ["C", "trouble", "«Trouble» (problema) es incontable en este uso; «had a trouble» no es correcto (se diría «had a problem»).", false], ["D", "harm", "«Harm» (perjuicio) es incontable y no se usa con «a»; tampoco forma la expresión «to have a harm».", false]]}, {"id": "EN1-254", "niv": 3, "cp": "en_p7", "e": "Gap (6)", "f": "Texto original «The moving assembly line», espacio 6", "vis": "", "o": [["A", "blame", "«Blame» (culpar) se usa con personas o causas («blame someone for»); no resuelve nada.", false], ["B", "suffer", "«Suffer this problem» no es la construcción natural y no explica por qué Ford subió el salario.", false], ["C", "cause", "«Cause» (causar) es lo contrario: el salario se introdujo para resolver el problema, no para causarlo.", false], ["D", "tackle", "«Tackle a problem» = enfrentar o atacar un problema: Ford subió el salario para resolver las renuncias.", true]]}, {"id": "EN1-255", "niv": 3, "cp": "en_p7", "e": "Gap (7)", "f": "Texto original «The moving assembly line», espacio 7", "vis": "", "o": [["A", "use", "«Are use» es agramatical: después de «are» no va el verbo en forma base.", false], ["B", "using", "«Are still using» sería activo y diría que los principios usan algo, sin objeto.", false], ["C", "used", "Voz pasiva en presente: «are still used» (todavía se usan); «be» + participio.", true], ["D", "uses", "«Are uses» es agramatical: no se combina «are» con un verbo conjugado.", false]]}]}];
const CFG = {"titulo": "Simulacro 1 · Saber TyT", "modo": "simulacro", "minutos": 280, "componentes": {"lectura_critica": "Lectura Crítica", "razonamiento_cuantitativo": "Razonamiento Cuantitativo", "competencias_ciudadanas": "Competencias Ciudadanas", "comunicacion_escrita": "Comunicación Escrita", "ingles": "Inglés"}, "competencias": {"lc_local": "Identifica y entiende los contenidos locales", "lc_global": "Comprende cómo se articulan las partes del texto", "lc_reflexion": "Reflexiona a partir del texto y evalúa su contenido", "rc_interpretacion": "Interpretación y representación", "rc_formulacion": "Formulación y ejecución", "rc_argumentacion": "Argumentación", "cc_conocimientos": "Conocimientos", "cc_argumentacion": "Argumentación", "cc_multiperspectivismo": "Multiperspectivismo", "cc_sistemico": "Pensamiento sistémico", "ce_planteamiento": "Planteamiento", "ce_organizacion": "Organización del texto", "ce_expresion": "Forma de expresión", "en_p1": "Parte 1 · Vocabulario (definiciones)", "en_p2": "Parte 2 · Avisos", "en_p3": "Parte 3 · Conversaciones", "en_p4": "Parte 4 · Texto con espacios (gramática)", "en_p5": "Parte 5 · Comprensión literal", "en_p6": "Parte 6 · Comprensión inferencial", "en_p7": "Parte 7 · Texto con espacios (vocabulario y gramática)"}, "niveles": {"1": "Básico", "2": "Intermedio", "3": "Avanzado"}, "instr": {"en_p1": "Parte 1. Relaciona cada descripción con la palabra correcta de la lista (A–H). Hay más palabras de las necesarias.", "en_p2": "Parte 2. ¿Dónde puedes ver cada aviso? Elige el lugar correcto (A, B o C).", "en_p3": "Parte 3. Completa cada conversación con la respuesta más adecuada (A, B o C).", "en_p4": "Parte 4. Lee el texto y elige la palabra correcta para cada espacio (A, B o C).", "en_p5": "Parte 5. Lee el texto y responde según la información que contiene (A, B o C).", "en_p6": "Parte 6. Lee el texto y responde las preguntas (A, B, C o D).", "en_p7": "Parte 7. Lee el texto y elige la palabra correcta para cada espacio (A, B, C o D)."}, "rubrica": [["Planteamiento", ["Respondo la pregunta y tomo una posición clara (de acuerdo, en desacuerdo o parcialmente) desde el primer párrafo.", "Doy al menos dos razones desarrolladas, con ejemplos o datos, y no me limito a repetir el contexto.", "Considero una postura contraria y explico por qué la mía es más sólida."]], ["Organización", ["Mi texto tiene introducción con tesis, desarrollo con un argumento por párrafo y conclusión.", "Uso conectores variados y precisos (además, sin embargo, por lo tanto, en consecuencia, por ejemplo).", "No hay ideas repetidas ni información que no aporte a mi tesis."]], ["Forma de expresión", ["Uso un registro formal y un vocabulario preciso, sin muletillas ni expresiones coloquiales.", "Reviso ortografía, tildes, puntuación y concordancia.", "Mi texto cabe en máximo dos páginas (unas 300 a 500 palabras)."]]], "ensayos": [{"id": "CE-E04", "sim": "tyt-1", "tema": "Semana laboral de cuatro días", "contexto": "En algunos países y empresas se ha ensayado una semana laboral de cuatro días: los empleados trabajan cuatro días, por ejemplo de lunes a jueves, y conservan su salario. Algunas de las empresas que la han probado reportan trabajadores menos cansados y menos ausencias por enfermedad. Sus críticos advierten que no todos los sectores pueden adoptarla: un hospital, un restaurante o una planta de producción continua necesitan personal todos los días, y comprimir las mismas tareas en menos días podría generar jornadas más largas y agotadoras. Otros temen que los costos aumenten para las pequeñas empresas, que tienen menos margen para contratar personal adicional.", "pregunta": "¿Está de acuerdo con que las empresas adopten una semana laboral de cuatro días sin reducir el salario de sus trabajadores? Escriba un texto argumentativo en el que exponga y justifique su posición.", "ideas": ["Relación entre descanso, errores y accidentes de trabajo.", "Tareas que podrían eliminarse o automatizarse si se dispone de un día menos.", "Sectores que no pueden detenerse un día a la semana.", "Costos para una pequeña empresa que debe contratar más personal.", "Alternativas: periodos de prueba, turnos rotativos, jornadas flexibles."], "modelo": "¿Se puede trabajar un día menos sin ganar menos y sin que la empresa pierda? La pregunta habría parecido absurda hace unas décadas, pero algunas organizaciones ya lo han ensayado con resultados alentadores. Mi respuesta es que estoy de acuerdo con que las empresas adopten la semana laboral de cuatro días sin reducir salarios, pero solo si se cumplen tres condiciones: que el trabajo pueda medirse por resultados, que la jornada diaria no se alargue hasta el agotamiento y que la medida se ensaye antes de volverse permanente.\n\nLa primera condición depende de la naturaleza de cada actividad. En una oficina de diseño, de soporte técnico o de contabilidad, lo que importa es que las tareas se cumplan con calidad, no el número de horas que el empleado pasa frente al escritorio. Allí, un día adicional de descanso puede traducirse en personas más concentradas y en menos errores. Además, la empresa que ofrece esta condición se vuelve más atractiva para el personal calificado, lo cual reduce los costos de contratar y capacitar a nuevos empleados. En cambio, en un hospital, en un restaurante o en una planta que opera las veinticuatro horas, el servicio no puede detenerse un día a la semana; conservar el salario y reducir los días implicaría contratar más personal, un costo que muchas empresas, y en especial las pequeñas, difícilmente pueden asumir. Para esos sectores, el descanso debería buscarse por otras vías, como turnos rotativos que garanticen pausas más largas.\n\nLa segunda condición evita que la reforma se convierta en una trampa. Si una empresa se limita a comprimir las mismas horas en cuatro días, producirá turnos de diez o doce horas y, con ellos, más cansancio y más riesgo de accidentes, justo lo contrario de lo que se busca. La semana corta solo tiene sentido si obliga a revisar la forma de trabajar: eliminar reuniones innecesarias, procesos repetidos y tareas que podrían automatizarse.\n\nLa tercera condición es la prudencia. Las empresas interesadas deberían adoptar la semana de cuatro días durante un periodo de prueba, medir sus resultados en productividad, ausentismo y satisfacción de los clientes, y decidir con base en esos datos. Así, la decisión no dependería del entusiasmo de los directivos ni del temor a perder dinero, sino de la evidencia.\n\nEn síntesis, la semana de cuatro días es una idea valiosa, pero no una fórmula universal. Si se cumplen estas tres condiciones, las empresas podrán aprovechar sus beneficios sin poner en riesgo los empleos ni los servicios que la sociedad necesita todos los días.", "comentario_modelo": "Planteamiento: la postura es parcial y está definida por tres condiciones explícitas que el lector conoce desde el primer párrafo; todo el texto se mantiene fiel a ellas. Aporta ideas que no están en el contexto, como el incentivo para eliminar tareas innecesarias o los costos de reemplazar personal. Organización: en lugar de la secuencia «argumento, argumento, objeción», el texto abre con una pregunta y dedica un párrafo a cada condición («La primera condición…», «La segunda…», «La tercera…»); las objeciones del contexto (sectores de servicio continuo, pequeñas empresas, jornadas agotadoras) se responden dentro de las condiciones que las resuelven. Forma de expresión: ejemplos de áreas de trabajo concretas, cercanas al mundo técnico y laboral; vocabulario preciso (ausentismo, servicio continuo, turnos rotativos) y un uso correcto de los dos puntos para anunciar las condiciones y del punto y coma para separar oraciones relacionadas.", "debil": "El trabajo es muy importante para las personas porque con eso mantienen a sus familias. Hoy en día las empresas explotan a los trabajadores y no les importa nada. La semana de cuatro días es una buena idea porque uno descansa más. Pero también hay sectores como los hospitales y restaurantes que necesitan personal todos los días. Y las pequeñas empresas tienen menos margen. Y los costos aumentan. Yo trabajo en un taller y mi jefe nunca nos da permisos, ni siquiera cuando uno está enfermo, eso es injusto y debería haber más control del ministerio. En fin, es un tema complicado que tiene muchos puntos de vista.", "comentario_debil": "Empieza con una idea favorable («es una buena idea porque uno descansa más»), pero enseguida enumera las objeciones del contexto sin responderlas, de modo que el lector no sabe cuál es la posición final; el cierre («es un tema complicado») confirma la falta de postura. Generaliza de forma injusta («las empresas explotan a los trabajadores») y se desvía hacia una queja personal sobre los permisos en el taller. Abusa de «Y» al inicio de oración en lugar de usar conectores precisos, y une ideas distintas con comas («…cuando uno está enfermo, eso es injusto…»). Para mejorarlo: decidir si está de acuerdo, en desacuerdo o parcialmente de acuerdo, explicar con un ejemplo laboral por qué, y responder a la objeción de los sectores que no pueden parar."}], "clave": "saber-tyt-01.html"};

  $('#fin').onclick = () => {
    const faltan = ITEMS.length - ITEMS.filter(i => ST.r[i.id]).length;
    const sinTexto = ENS && palabras(ST.ens[ENS.id] || '') < 50;
    $('#mtxt').textContent = (faltan ? `Te faltan ${faltan} preguntas por responder. ` : '') + (sinTexto ? 'Aún no has escrito el texto argumentativo. ' : '') + (faltan || sinTexto ? '¿Quieres calificar de todos modos?' : '¿Quieres terminar y ver tu calificación?');
    $('#modal').classList.remove('hide');
  };
}
function progreso(){
  const r = ITEMS.filter(it => ST.r[it.id]).length;
  $('#prog').textContent = `Respondidas ${r}/${ITEMS.length}`;
}
$('#mno').onclick = () => $('#modal').classList.add('hide');
$('#msi').onclick = () => { $('#modal').classList.add('hide'); ST.fin = Date.now(); save(); resultados(); window.scrollTo(0,0); };
function resultados(){
  clearInterval(tick);
  const ok = ITEMS.filter(it => ST.r[it.id] === keyOf(it)).length;
  const pct = Math.round(1000*ok/ITEMS.length)/10;
  const agrupa = fn => { const m = {}; ITEMS.forEach(it => { const k = fn(it); m[k] = m[k] || [0,0]; m[k][1]++; if (ST.r[it.id]===keyOf(it)) m[k][0]++; }); return m; };
  const fila = (lab, v, cls) => `<tr class="${cls||''}"><td>${esc(lab)}</td><td class="r">${v[0]}/${v[1]}</td><td class="r">${Math.round(100*v[0]/v[1])} %</td></tr>`;
  const porMod = agrupa(it => it.caso.comp), porCp = agrupa(it => it.cp), porNiv = agrupa(it => it.niv);
  let tabla = '';
  Object.entries(porMod).forEach(([m, v]) => { tabla += fila(CFG.componentes[m], v);
    Object.entries(porCp).filter(([k]) => ITEMS.some(i => i.cp === k && i.caso.comp === m)).forEach(([k, w]) => tabla += fila(CFG.competencias[k], w, 'sub')); });
  const mins = Math.round(((ST.fin||Date.now()) - ST.t0)/60000);
  $('#timer').textContent = `Tiempo usado: ${Math.floor(mins/60) ? Math.floor(mins/60) + ' h ' : ''}${mins%60} min`;
  $('#prog').textContent = `${ok}/${ITEMS.length} aciertos`;
  const peor = Object.entries(porMod).sort((a,b) => a[1][0]/a[1][1] - b[1][0]/b[1][1])[0];
  $('#main').innerHTML = `<div class="panel"><div class="big">${String(pct).replace('.',',')} %</div>
  <p style="margin-top:4px">${ok} de ${ITEMS.length} respuestas correctas en selección múltiple. ${pct >= 75 ? 'Muy buen resultado: repasa tus errores para afianzarlo.' : pct >= 55 ? 'Vas por buen camino: refuerza los módulos y competencias con menor porcentaje.' : 'Hay que reforzar: practica por módulo y competencia, empezando por el más bajo.'} Tu módulo más bajo: <b>${esc(CFG.componentes[peor[0]])}</b>.</p>
  <p class="aviso">El Icfes reporta un puntaje de 0 a 300 por módulo calculado con un modelo estadístico que compara a todos los evaluados, por lo que no existe una conversión exacta desde el porcentaje de aciertos. Usa este resultado para comparar tu avance entre simulacros.</p>
  <h3>Por módulo y competencia</h3><table>${tabla}</table>
  <h3>Por dificultad</h3><table>${Object.entries(porNiv).map(([k,v]) => fila(CFG.niveles[k], v)).join('')}</table>
  <div class="row" style="margin-top:14px">${ENS ? '<button class="btn" id="vtexto">Evaluar mi texto</button>' : ''}<button class="btn sec" id="solo">Ver solo mis errores</button><button class="btn sec" id="todas">Ver todas</button><button class="btn sec" id="otra">Reiniciar el simulacro</button></div></div><div id="rev"></div>`;
  const rev = errs => { const l = errs ? ITEMS.filter(it => ST.r[it.id] !== keyOf(it)) : ITEMS; $('#rev').innerHTML = (errs && !l.length ? '<div class="panel">¡No tuviste errores!</div>' : renderList(l, 'review')); };
  const texto = () => { $('#rev').innerHTML = ensayoHTML(ENS, true); puntajeRubrica(ENS.id); };
  if (ENS) { texto(); $('#vtexto').onclick = texto; } else rev(true);
  $('#solo').onclick = () => rev(true); $('#todas').onclick = () => rev(false);
  $('#otra').onclick = () => { ST = {r:{}, chk:{}, ens:{}}; save(); inicio(); window.scrollTo(0,0); };
}

document.addEventListener('click', e => {
  const v = e.target.closest('[data-ver]');
  if (v) { VER[v.dataset.ver] = true; ST.ver = VER; save(); escritura(); return; }
  const b = e.target.closest('button.op'); if (!b || b.disabled) return;
  if (CFG.modo === 'simulacro' && ST.fin) return;
  ST.r[b.dataset.id] = b.dataset.l; save();
  const it = ITEMS.find(i => i.id === b.dataset.id);
  const n = b.closest('.item').querySelector('.n').textContent.replace('.','');
  b.closest('.item').outerHTML = itemHTML(it, n, CFG.modo === 'practica' ? 'practica' : 'examen');
  if (CFG.modo === 'practica') { const resp = LIST.filter(i => ST.r[i.id]); const ok = resp.filter(i => ST.r[i.id]===keyOf(i)).length; $('#prog').textContent = `${ok}/${resp.length} aciertos`; $('#pst').textContent = `${LIST.length} preguntas · respondidas ${resp.length} · aciertos ${ok} (${Math.round(100*ok/resp.length)} %)`; }
  else progreso();
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset && t.dataset.ens) { ST.ens[t.dataset.ens] = t.value; save(); const p = $('#pc-' + t.dataset.ens); if (p) p.textContent = palabras(t.value) + ' palabras'; }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset && t.dataset.chk) { ST.chk[t.dataset.chk] = t.checked; save(); puntajeRubrica(t.dataset.chk.split(':')[0]); }
});

if (CFG.modo === 'practica') practica();
else if (CFG.modo === 'escritura') { if (CFG.ensayos.length) escritura(); else $('#main').innerHTML = '<div class="panel">Sin consignas.</div>'; }
else if (ST.fin) resultados();
else if (ST.t0) examen();
else inicio();
</script>
</body>
</html>
