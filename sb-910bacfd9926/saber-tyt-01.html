s datos del caso (datos ficticios).", "vis": "", "o": [["A", "C = 65.000h.", "Multiplica también la visita por las horas; la visita se cobra una sola vez.", false], ["B", "C = 40.000h + 25.000h.", "Trata la visita como un cobro por hora; equivale a 65.000h, que no corresponde a la tarifa.", false], ["C", "C = 25.000 + 40.000h.", "Intercambia los valores: el cargo fijo es 40.000 y lo que se multiplica por las horas es 25.000.", false], ["D", "C = 40.000 + 25.000h.", "La visita es un valor fijo (40.000) y cada hora suma 25.000: C = 40.000 + 25.000h.", true]]}, {"id": "RCT-116", "niv": 2, "cp": "rc_interpretacion", "e": "Según la gráfica, ¿con cuántas horas de trabajo las dos empresas cobran lo mismo?", "f": "Cálculo propio a partir de los datos del caso (datos ficticios).", "vis": "", "o": [["A", "3 horas.", "Con 3 horas A cobra $ 115.000 y B $ 105.000; todavía hay diferencia.", false], ["B", "4 horas.", "Con 4 horas ambas cobran $ 140.000: 40.000 + 4 × 25.000 = 4 × 35.000.", true], ["C", "5 horas.", "Con 5 horas A cobra $ 165.000 y B $ 175.000; las líneas ya se cruzaron.", false], ["D", "Con ningún número de horas.", "Las líneas sí se cruzan: en 4 horas el costo es igual ($ 140.000).", false]]}, {"id": "RCT-117", "niv": 3, "cp": "rc_formulacion", "e": "Un trabajo de configuración de red tomará 7 horas. ¿Qué empresa conviene contratar y por qué?", "f": "Cálculo propio a partir de los datos del caso (datos ficticios).", "vis": "", "o": [["A", "La empresa A, porque cobra $ 30.000 menos que la B.", "A: 40.000 + 7 × 25.000 = 215.000; B: 7 × 35.000 = 245.000. A cobra 30.000 menos.", true], ["B", "La empresa B, porque cobra $ 30.000 menos que la A.", "La diferencia es correcta, pero la empresa más barata con 7 horas es A, no B.", false], ["C", "La empresa A, porque cobra $ 10.000 menos que la B.", "Compara solo el valor de una hora adicional; la diferencia total con 7 horas es 245.000 − 215.000 = 30.000.", false], ["D", "Cualquiera de las dos, porque cobran lo mismo.", "Cobran lo mismo solo con 4 horas; con 7 horas A cuesta 215.000 y B 245.000.", false]]}, {"id": "RCT-118", "niv": 2, "cp": "rc_argumentacion", "e": "El jefe de la oficina dice: «Como la empresa A cobra menos por hora, siempre será la opción más barata». ¿Es válida esta afirmación?", "f": "Cálculo propio a partir de los datos del caso (datos ficticios).", "vis": "", "o": [["A", "No, porque B no cobra visita y por eso, por 5 horas, cobra $ 140.000 menos que A.", "Es falso: por 5 horas B cobra $ 175.000 y A $ 165.000; ahí B es más cara.", false], ["B", "Sí, porque A cobra $ 25.000 por hora y B cobra $ 35.000, es decir, $ 10.000 más cada hora.", "Olvida el cobro fijo de $ 40.000 de la visita, que hace a A más cara en trabajos cortos.", false], ["C", "Sí, porque A cobra $ 40.000 de visita y B cobra $ 35.000 de visita, casi lo mismo.", "Es falso: B no cobra visita; los $ 35.000 son su tarifa por hora.", false], ["D", "No, porque por 1 hora la empresa A cobra $ 65.000 y la empresa B solo $ 35.000.", "El contraejemplo de 1 hora (40.000 + 25.000 = 65.000 frente a 35.000) basta para refutar la palabra «siempre».", true]]}]}, {"comp": "razonamiento_cuantitativo", "sim": "tyt-1", "ind": "Ventas mensuales de un restaurante", "tt": "", "texto": "Un restaurante vendió $ 18.000.000 en un mes. La gráfica 1 muestra qué porcentaje de esas ventas correspondió a cada tipo de producto.", "vis": "<div class=\"vfig\"><svg class=\"vg\" viewBox=\"0 0 560 320\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Gráfica 1. Distribución de las ventas del mes\" font-family=\"Arial, sans-serif\" font-size=\"12\"><rect width=\"560\" height=\"320\" fill=\"#ffffff\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"13\" fill=\"#1d2433\">Gráfica 1. Distribución de las ventas del mes<\/text><path d=\"M170,175 L170.0,60.0 A115,115 0 0,1 237.6,268.0 Z\" fill=\"#1660a8\" stroke=\"#fff\" stroke-width=\"1.5\"/><path d=\"M170,175 L237.6,268.0 A115,115 0 0,1 60.6,210.5 Z\" fill=\"#d9822b\" stroke=\"#fff\" stroke-width=\"1.5\"/><path d=\"M170,175 L60.6,210.5 A115,115 0 0,1 102.4,82.0 Z\" fill=\"#2e8b57\" stroke=\"#fff\" stroke-width=\"1.5\"/><path d=\"M170,175 L102.4,82.0 A115,115 0 0,1 170.0,60.0 Z\" fill=\"#8e44ad\" stroke=\"#fff\" stroke-width=\"1.5\"/><rect x=\"320\" y=\"59\" width=\"14\" height=\"14\" fill=\"#1660a8\"/><text x=\"340\" y=\"70\" fill=\"#1d2433\">Almuerzo ejecutivo: 40 %<\/text><rect x=\"320\" y=\"83\" width=\"14\" height=\"14\" fill=\"#d9822b\"/><text x=\"340\" y=\"94\" fill=\"#1d2433\">Platos a la carta: 30 %<\/text><rect x=\"320\" y=\"107\" width=\"14\" height=\"14\" fill=\"#2e8b57\"/><text x=\"340\" y=\"118\" fill=\"#1d2433\">Bebidas: 20 %<\/text><rect x=\"320\" y=\"131\" width=\"14\" height=\"14\" fill=\"#8e44ad\"/><text x=\"340\" y=\"142\" fill=\"#1d2433\">Postres: 10 %<\/text><\/svg><\/div>", "items": [{"id": "RCT-119", "niv": 1, "cp": "rc_interpretacion", "e": "¿Cuánto dinero vendió el restaurante en bebidas durante ese mes?", "f": "Cálculo propio a partir de los datos del caso (datos ficticios).", "vis": "", "o": [["A", "$ 360.000", "Calcula el 2 % en lugar del 20 % (error al ubicar la coma).", false], ["B", "$ 1.800.000", "Es el valor de las ventas de postres (10 %), no de bebidas.", false], ["C", "$ 3.600.000", "Bebidas: 20 % de 18.000.000 = 0,20 × 18.000.000 = 3.600.000.", true], ["D", "$ 5.400.000", "Es el valor de los platos a la carta (30 %), no de las bebidas.", false]]}, {"id": "RCT-120", "niv": 2, "cp": "rc_interpretacion", "e": "¿Qué par de productos reunió exactamente la mitad de las ventas del mes?", "f": "Cálculo propio a partir de los datos del caso (datos ficticios).", "vis": "", "o": [["A", "Almuerzo ejecutivo y postres.", "40 % + 10 % = 50 %, es decir, la mitad de las ventas.", true], ["B", "Almuerzo ejecutivo y bebidas.", "Suman 40 % + 20 % = 60 %, más de la mitad.", false], ["C", "Platos a la carta y postres.", "Suman 30 % + 10 % = 40 %, menos de la mitad.", false], ["D", "Bebidas y postres.", "Suman 20 % + 10 % = 30 %, menos de la mitad.", false]]}, {"id": "RCT-121", "niv": 2, "cp": "rc_interpretacion", "e": "En la gráfica circular, ¿cuánto mide el ángulo central del sector que representa las bebidas?", "f": "Cálculo propio a partir de los datos del caso (datos ficticios).", "vis": "", "o": [["A", "20°.", "Toma el porcentaje como si fuera la medida del ángulo; el círculo completo mide 360°, no 100°.", false], ["B", "36°.", "Es el ángulo del sector de postres (10 % de 360°).", false], ["C", "72°.", "El sector de bebidas es el 20 % del círculo: 0,20 × 360° = 72°.", true], ["D", "90°.", "Corresponde a un cuarto del círculo (25 %), y las bebidas son el 20 %.", false]]}, {"id": "RCT-122", "niv": 3, "cp": "rc_argumentacion", "e": "El administrador afirma: «Si el próximo mes las ventas totales suben a $ 20.000.000 y los porcentajes se mantienen, las ventas de postres aumentarán en $ 2.000.000». ¿Es correcta la afirmación?", "f": "Cálculo propio a partir de los datos del caso (datos ficticios).", "vis": "", "o": [["A", "No, porque las ventas de postres pasarían de $ 1.800.000 a $ 2.000.000, es decir, aumentarían $ 200.000.", "10 % de 18.000.000 = 1.800.000 y 10 % de 20.000.000 = 2.000.000; el aumento es 200.000.", true], ["B", "No, porque si los porcentajes se mantienen, las ventas de postres no cambian.", "Mantener el porcentaje no implica mantener el valor: el 10 % de un total mayor es un valor mayor.", false], ["C", "Sí, porque el 10 % de $ 20.000.000 es $ 2.000.000.", "Confunde el nuevo valor de las ventas de postres ($ 2.000.000) con su aumento.", false], ["D", "Sí, porque el aumento total de las ventas, $ 2.000.000, se reflejará en los postres.", "El aumento total se reparte entre todos los productos según sus porcentajes; a postres le corresponde el 10 % de él.", false]]}]}, {"comp": "razonamiento_cuantitativo", "sim": "tyt-1", "ind": "Escalera apoyada en un muro de una obra", "tt": "", "texto": "En una obra, una escalera de 5 m de largo se apoya en un muro vertical. El pie de la escalera queda sobre el piso horizontal, a 1,4 m de la base del muro, como muestra la figura. La altura h es la distancia desde el piso hasta el punto donde la escalera toca el muro.", "vis": "<div class=\"vfig\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 300 240\" font-family=\"Arial\" font-size=\"14\"><rect width=\"300\" height=\"240\" fill=\"#ffffff\"/><line x1=\"20\" y1=\"210\" x2=\"280\" y2=\"210\" stroke=\"#222\" stroke-width=\"2\"/><line x1=\"220\" y1=\"20\" x2=\"220\" y2=\"210\" stroke=\"#222\" stroke-width=\"4\"/><line x1=\"167.5\" y1=\"210\" x2=\"220\" y2=\"30\" stroke=\"#1660a8\" stroke-width=\"4\"/><polyline points=\"208,210 208,198 220,198\" fill=\"none\" stroke=\"#222\"/><text x=\"150\" y=\"125\" fill=\"#111\">5 m<\/text><text x=\"175\" y=\"230\" fill=\"#111\">1,4 m<\/text><text x=\"230\" y=\"125\" fill=\"#111\">h<\/text><text x=\"235\" y=\"200\" fill=\"#111\">Muro<\/text><\/svg><\/div>", "items": [{"id": "RCT-123", "niv": 2, "cp": "rc_formulacion", "e": "¿A qué altura h del piso toca la escalera el muro?", "f": "Cálculo propio con el teorema de Pitágoras.", "vis": "", "o": [["A", "3,6 m.", "Resta las longitudes (5 − 1,4); en un triángulo rectángulo hay que restar los cuadrados: h² = 5² − 1,4².", false], ["B", "4,8 m.", "Por el teorema de Pitágoras: h = √(5² − 1,4²) = √(25 − 1,96) = √23,04 = 4,8 m.", true], ["C", "5,2 m.", "Suma los cuadrados (√(25 + 1,96) ≈ 5,2) como si la escalera fuera un cateto; la escalera es la hipotenusa.", false], ["D", "6,4 m.", "Suma las longitudes (5 + 1,4); la altura de un cateto no puede superar la longitud de la hipotenusa.", false]]}, {"id": "RCT-124", "niv": 3, "cp": "rc_argumentacion", "e": "Un trabajador dice: «Si alejo el pie de la escalera al doble de distancia del muro, a 2,8 m, la escalera alcanzará la mitad de la altura que alcanza ahora». ¿Es válida su afirmación?", "f": "Cálculo propio con el teorema de Pitágoras.", "vis": "", "o": [["A", "Sí, porque con el pie a 2,8 m la altura sería √(5² − 2,8²) ≈ 2,4 m, la mitad.", "Error de cálculo: √(25 − 7,84) = √17,16 ≈ 4,14 m, no 2,4 m.", false], ["B", "No, porque con el pie a 2,8 m la altura sería √(5² + 2,8²) ≈ 5,73 m, mayor que antes.", "Suma los cuadrados como si la escalera fuera un cateto; la escalera es la hipotenusa y la altura disminuye.", false], ["C", "Sí, porque altura y distancia son inversamente proporcionales: 1,4 × 2 = 2,8, y la altura se divide entre 2.", "No hay proporcionalidad inversa: lo que se conserva es h² + d² = 25.", false], ["D", "No, porque con el pie a 2,8 m la altura sería √(25 − 7,84) ≈ 4,14 m, no la mitad.", "√(25 − 7,84) = √17,16 ≈ 4,14 m, mucho más que la mitad de la altura actual.", true]]}]}, {"comp": "razonamiento_cuantitativo", "sim": "tyt-1", "ind": "Dosis de un jarabe en un servicio de salud", "tt": "", "texto": "En un centro de salud, un médico formuló a un niño de 22 kg un jarabe: en cada toma recibe 15 mg por cada kilogramo de peso, y se da una toma cada 8 horas. La tabla 1 reproduce la información de la etiqueta del frasco. (Situación ficticia con fines de cálculo).", "vis": "<table class=\"vt\"><caption>Tabla 1. Información de la etiqueta<\/caption><thead><tr><th>Dato<\/th><th>Valor<\/th><\/tr><\/thead><tbody><tr><td>Concentración<\/td><td>250 mg por cada 5 mL<\/td><\/tr><tr><td>Contenido del frasco<\/td><td>120 mL<\/td><\/tr><tr><td>Presentación<\/td><td>Jarabe para uso oral<\/td><\/tr><\/tbody><\/table><div class=\"vnota\">Etiqueta ficticia.<\/div>", "items": [{"id": "RCT-125", "niv": 2, "cp": "rc_formulacion", "e": "¿Cuántos miligramos del medicamento recibe el niño en total durante 24 horas?", "f": "Cálculo propio a partir de los datos del caso (datos ficticios).", "vis": "", "o": [["A", "110 mg.", "Divide la dosis de una toma (330 mg) entre 3; en 24 horas hay 3 tomas, así que se multiplica.", false], ["B", "330 mg.", "Es la dosis de una sola toma (15 × 22); en 24 horas se dan 3 tomas.", false], ["C", "990 mg.", "Cada toma: 15 × 22 = 330 mg; cada 8 horas son 24 ÷ 8 = 3 tomas al día: 3 × 330 = 990 mg.", true], ["D", "2.640 mg.", "Multiplica la dosis por 8 (las horas entre tomas) en lugar de por el número de tomas diarias (3).", false]]}, {"id": "RCT-126", "niv": 3, "cp": "rc_formulacion", "e": "¿Cuántos mililitros de jarabe debe medir la enfermera para una sola toma?", "f": "Cálculo propio a partir de los datos del caso (datos ficticios).", "vis": "", "o": [["A", "1,32 mL.", "Divide 330 mg entre 250, como si 250 mg estuvieran en 1 mL; en realidad están en 5 mL.", false], ["B", "3,8 mL.", "Invierte la proporción (250 ÷ 330 × 5); a más miligramos necesarios, más mililitros, no menos.", false], ["C", "6,6 mL.", "El jarabe tiene 250 ÷ 5 = 50 mg por mL; una toma de 330 mg requiere 330 ÷ 50 = 6,6 mL.", true], ["D", "66 mL.", "Divide 330 entre 5 (los mililitros) en lugar de entre la concentración de 50 mg por mL.", false]]}]}, {"comp": "razonamiento_cuantitativo", "sim": "tyt-1", "ind": "Tickets de soporte atendidos por dos técnicos", "tt": "", "texto": "En el área de sistemas de una empresa, dos técnicos, Ana y Luis, atienden solicitudes de soporte (tickets). La gráfica 1 muestra cuántos tickets atendió cada uno durante cuatro semanas.", "vis": "<div class=\"vfig\"><svg class=\"vg\" viewBox=\"0 0 560 320\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Gráfica 1. Tickets atendidos por semana\" font-family=\"Arial, sans-serif\" font-size=\"12\"><rect width=\"560\" height=\"320\" fill=\"#ffffff\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"13\" fill=\"#1d2433\">Gráfica 1. Tickets atendidos por semana<\/text><line x1=\"60\" y1=\"258.0\" x2=\"540\" y2=\"258.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"262.0\" text-anchor=\"end\" fill=\"#3a4356\">0<\/text><line x1=\"60\" y1=\"202.5\" x2=\"540\" y2=\"202.5\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"206.5\" text-anchor=\"end\" fill=\"#3a4356\">10<\/text><line x1=\"60\" y1=\"147.0\" x2=\"540\" y2=\"147.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"151.0\" text-anchor=\"end\" fill=\"#3a4356\">20<\/text><line x1=\"60\" y1=\"91.5\" x2=\"540\" y2=\"91.5\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"95.5\" text-anchor=\"end\" fill=\"#3a4356\">30<\/text><line x1=\"60\" y1=\"36.0\" x2=\"540\" y2=\"36.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"40.0\" text-anchor=\"end\" fill=\"#3a4356\">40<\/text><line x1=\"60\" y1=\"258\" x2=\"540\" y2=\"258\" stroke=\"#3a4356\"/><line x1=\"60\" y1=\"258\" x2=\"60\" y2=\"36\" stroke=\"#3a4356\"/><text transform=\"translate(14,147.0) rotate(-90)\" text-anchor=\"middle\" fill=\"#3a4356\">Tickets atendidos<\/text><text x=\"300.0\" y=\"312\" text-anchor=\"middle\" fill=\"#3a4356\">Semana<\/text><text x=\"120.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Semana 1<\/text><text x=\"240.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Semana 2<\/text><text x=\"360.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Semana 3<\/text><text x=\"480.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Semana 4<\/text><rect x=\"78.0\" y=\"69.3\" width=\"42.0\" height=\"188.7\" fill=\"#1660a8\"/><text x=\"99.0\" y=\"65.3\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">34<\/text><rect x=\"198.0\" y=\"102.6\" width=\"42.0\" height=\"155.4\" fill=\"#1660a8\"/><text x=\"219.0\" y=\"98.6\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">28<\/text><rect x=\"318.0\" y=\"74.8\" width=\"42.0\" height=\"183.2\" fill=\"#1660a8\"/><text x=\"339.0\" y=\"70.8\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">33<\/text><rect x=\"438.0\" y=\"119.2\" width=\"42.0\" height=\"138.8\" fill=\"#1660a8\"/><text x=\"459.0\" y=\"115.2\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">25<\/text><rect x=\"120.0\" y=\"135.9\" width=\"42.0\" height=\"122.1\" fill=\"#d9822b\"/><text x=\"141.0\" y=\"131.9\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">22<\/text><rect x=\"240.0\" y=\"91.5\" width=\"42.0\" height=\"166.5\" fill=\"#d9822b\"/><text x=\"261.0\" y=\"87.5\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">30<\/text><rect x=\"360.0\" y=\"74.8\" width=\"42.0\" height=\"183.2\" fill=\"#d9822b\"/><text x=\"381.0\" y=\"70.8\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">33<\/text><rect x=\"480.0\" y=\"63.8\" width=\"42.0\" height=\"194.2\" fill=\"#d9822b\"/><text x=\"501.0\" y=\"59.8\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1d2433\">35<\/text><rect x=\"60\" y=\"286\" width=\"12\" height=\"12\" fill=\"#1660a8\"/><text x=\"76\" y=\"296\" fill=\"#1d2433\">Ana<\/text><rect x=\"107\" y=\"286\" width=\"12\" height=\"12\" fill=\"#d9822b\"/><text x=\"123\" y=\"296\" fill=\"#1d2433\">Luis<\/text><\/svg><\/div>", "items": [{"id": "RCT-127", "niv": 1, "cp": "rc_interpretacion", "e": "¿En qué semana fue mayor la diferencia entre los tickets atendidos por Ana y por Luis?", "f": "Cálculo propio a partir de los datos del caso (datos ficticios).", "vis": "", "o": [["A", "Semana 1.", "Diferencias: semana 1, 34 − 22 = 12; semana 2, 2; semana 3, 0; semana 4, 35 − 25 = 10. La mayor es la de la semana 1.", true], ["B", "Semana 2.", "En la semana 2 la diferencia es apenas 30 − 28 = 2 tickets.", false], ["C", "Semana 3.", "En la semana 3 ambos atendieron 33 tickets: la diferencia es 0.", false], ["D", "Semana 4.", "En la semana 4 la diferencia es 35 − 25 = 10, menor que la de la semana 1 (12).", false]]}, {"id": "RCT-128", "niv": 1, "cp": "rc_interpretacion", "e": "¿Cuántos tickets atendieron entre los dos técnicos en la semana 2?", "f": "Cálculo propio a partir de los datos del caso (datos ficticios).", "vis": "", "o": [["A", "28", "Es solo la cantidad atendida por Ana en la semana 2.", false], ["B", "30", "Es solo la cantidad atendida por Luis en la semana 2.", false], ["C", "58", "En la semana 2, Ana atendió 28 y Luis 30: 28 + 30 = 58.", true], ["D", "60", "Corresponde al doble del promedio semanal de cada técnico (30), no a la semana 2.", false]]}, {"id": "RCT-129", "niv": 2, "cp": "rc_argumentacion", "e": "La supervisora afirma: «Ana y Luis tienen el mismo promedio semanal, pero la cantidad de tickets de Luis fue más variable». ¿Cuál de las siguientes razones la respalda?", "f": "Cálculo propio a partir de los datos del caso (datos ficticios).", "vis": "", "o": [["A", "Ambos atendieron en promedio 30 tickets por semana, y el rango de Ana (12) es mayor que el de Luis (10).", "Los rangos están mal calculados: Ana va de 25 a 34 (rango 9) y Luis de 22 a 35 (rango 13).", false], ["B", "Ambos atendieron en promedio 30 tickets por semana, y el rango de Luis (13) es mayor que el de Ana (9).", "Ana: (34 + 28 + 33 + 25) ÷ 4 = 30, rango 34 − 25 = 9. Luis: (22 + 30 + 33 + 35) ÷ 4 = 30, rango 35 − 22 = 13.", true], ["C", "Luis tuvo la semana con más tickets (35), así que su promedio es mayor que el de Ana.", "Contradice la afirmación y es falso: los dos promedios son iguales a 30.", false], ["D", "Luis atendió en total más tickets que Ana en las cuatro semanas.", "Es falso: cada uno atendió 120 tickets en total.", false]]}, {"id": "RCT-130", "niv": 3, "cp": "rc_formulacion", "e": "¿En qué porcentaje aumentó, aproximadamente, la cantidad de tickets atendidos por Luis de la semana 1 a la semana 4?", "f": "Cálculo propio a partir de los datos del caso (datos ficticios).", "vis": "", "o": [["A", "13 %", "13 es el aumento en número de tickets (35 − 22), no el porcentaje.", false], ["B", "37,1 %", "Divide el aumento entre el valor final (13 ÷ 35); el porcentaje de aumento se calcula sobre el valor inicial.", false], ["C", "59,1 %", "Aumento: 35 − 22 = 13; 13 ÷ 22 ≈ 0,591, es decir, cerca de 59,1 %.", true], ["D", "159,1 %", "Es la razón 35 ÷ 22 expresada en porcentaje: indica que la semana 4 es el 159,1 % de la semana 1, no el aumento.", false]]}]}, {"comp": "razonamiento_cuantitativo", "sim": "tyt-1", "ind": "Capacidad de un tanque de agua", "tt": "", "texto": "La cocina de un restaurante tiene un tanque cilíndrico para almacenar agua. Su diámetro interior es de 1 m y su altura interior es de 1,2 m. Recuerde que 1 m³ equivale a 1.000 litros y que el volumen de un cilindro es π × r² × h.", "vis": "", "items": [{"id": "RCT-131", "niv": 2, "cp": "rc_formulacion", "e": "Usando π ≈ 3,14, ¿cuántos litros de agua caben, aproximadamente, en el tanque lleno?", "f": "Cálculo propio a partir de los datos del caso (datos ficticios).", "vis": "", "o": [["A", "94,2 L.", "Convierte multiplicando por 100 en lugar de por 1.000 (0,942 m³ = 942 L).", false], ["B", "942 L.", "r = 0,5 m; V = 3,14 × 0,5² × 1,2 = 0,942 m³ = 942 litros.", true], ["C", "1.884 L.", "No eleva el radio al cuadrado: 3,14 × 0,5 × 1,2 = 1,884 m³.", false], ["D", "3.768 L.", "Usa el diámetro (1 m) como si fuera el radio: 3,14 × 1² × 1,2 = 3,768 m³.", false]]}]}, {"comp": "razonamiento_cuantitativo", "sim": "tyt-1", "ind": "Plano a escala de un local", "tt": "", "texto": "Un técnico en construcción revisa el plano de un local comercial dibujado a escala 1:50, es decir, 1 cm en el plano representa 50 cm en la realidad. En el plano, el muro norte del local mide 8 cm.", "vis": "", "items": [{"id": "RCT-132", "niv": 1, "cp": "rc_interpretacion", "e": "¿Cuál es la longitud real del muro norte del local?", "f": "Cálculo propio a partir de los datos del caso (datos ficticios).", "vis": "", "o": [["A", "0,4 m.", "Multiplica 8 cm por 5 en lugar de por 50 (8 × 5 = 40 cm = 0,4 m).", false], ["B", "4 m.", "8 cm × 50 = 400 cm en la realidad, y 400 cm = 4 m.", true], ["C", "40 m.", "Error de conversión: 400 cm son 4 m, no 40 m.", false], ["D", "400 m.", "Toma los 400 cm como si fueran metros.", false]]}]}, {"comp": "razonamiento_cuantitativo", "sim": "tyt-1", "ind": "Consumo de energía de una planta", "tt": "", "texto": "Una pequeña planta de confecciones registra su consumo mensual de energía eléctrica. La gráfica 1 muestra el consumo, en kilovatios hora (kWh), durante el primer semestre del año.", "vis": "<div class=\"vfig\"><svg class=\"vg\" viewBox=\"0 0 560 320\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Gráfica 1. Consumo mensual de energía\" font-family=\"Arial, sans-serif\" font-size=\"12\"><rect width=\"560\" height=\"320\" fill=\"#ffffff\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-weight=\"bold\" font-size=\"13\" fill=\"#1d2433\">Gráfica 1. Consumo mensual de energía<\/text><line x1=\"60\" y1=\"258.0\" x2=\"540\" y2=\"258.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"262.0\" text-anchor=\"end\" fill=\"#3a4356\">0<\/text><line x1=\"60\" y1=\"202.5\" x2=\"540\" y2=\"202.5\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"206.5\" text-anchor=\"end\" fill=\"#3a4356\">500<\/text><line x1=\"60\" y1=\"147.0\" x2=\"540\" y2=\"147.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"151.0\" text-anchor=\"end\" fill=\"#3a4356\">1.000<\/text><line x1=\"60\" y1=\"91.5\" x2=\"540\" y2=\"91.5\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"95.5\" text-anchor=\"end\" fill=\"#3a4356\">1.500<\/text><line x1=\"60\" y1=\"36.0\" x2=\"540\" y2=\"36.0\" stroke=\"#e1e5ec\"/><text x=\"54\" y=\"40.0\" text-anchor=\"end\" fill=\"#3a4356\">2.000<\/text><line x1=\"60\" y1=\"258\" x2=\"540\" y2=\"258\" stroke=\"#3a4356\"/><line x1=\"60\" y1=\"258\" x2=\"60\" y2=\"36\" stroke=\"#3a4356\"/><text transform=\"translate(14,147.0) rotate(-90)\" text-anchor=\"middle\" fill=\"#3a4356\">Consumo (kWh)<\/text><text x=\"300.0\" y=\"312\" text-anchor=\"middle\" fill=\"#3a4356\">Mes<\/text><text x=\"100.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Ene<\/text><text x=\"180.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Feb<\/text><text x=\"260.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Mar<\/text><text x=\"340.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Abr<\/text><text x=\"420.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">May<\/text><text x=\"500.0\" y=\"274\" text-anchor=\"middle\" fill=\"#3a4356\">Jun<\/text><polyline fill=\"none\" stroke=\"#1660a8\" stroke-width=\"2.5\" points=\"100.0,124.8 180.0,108.2 260.0,135.9 340.0,91.5 420.0,97.1 500.0,80.4\"/><circle cx=\"100.0\" cy=\"124.8\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"100.0\" y=\"116.8\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">1.200<\/text><circle cx=\"180.0\" cy=\"108.2\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"180.0\" y=\"100.2\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">1.350<\/text><circle cx=\"260.0\" cy=\"135.9\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"260.0\" y=\"127.9\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">1.100<\/text><circle cx=\"340.0\" cy=\"91.5\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"340.0\" y=\"83.5\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">1.500<\/text><circle cx=\"420.0\" cy=\"97.1\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"420.0\" y=\"89.1\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">1.450<\/text><circle cx=\"500.0\" cy=\"80.4\" r=\"3.5\" fill=\"#1660a8\"/><text x=\"500.0\" y=\"72.4\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1660a8\" font-weight=\"bold\">1.600<\/text><\/svg><\/div>", "items": [{"id": "RCT-133", "niv": 1, "cp": "rc_interpretacion", "e": "¿Entre qué par de meses consecutivos se presentó el mayor aumento del consumo?", "f": "Cálculo propio a partir de los datos del caso (datos ficticios).", "vis": "", "o": [["A", "De enero a febrero.", "El aumento fue de 1.350 − 1.200 = 150 kWh, menor que el de marzo a abril.", false], ["B", "De febrero a marzo.", "En ese período el consumo bajó 250 kWh; es el mayor cambio negativo, no un aumento.", false], ["C", "De marzo a abril.", "El consumo pasó de 1.100 a 1.500 kWh: un aumento de 400 kWh, el mayor del semestre.", true], ["D", "De mayo a junio.", "El aumento fue de 1.600 − 1.450 = 150 kWh, menor que el de marzo a abril.", false]]}, {"id": "RCT-134", "niv": 3, "cp": "rc_interpretacion", "e": "¿En cuántos meses del semestre el consumo fue mayor que el consumo promedio mensual del semestre?", "f": "Cálculo propio a partir de los datos del caso (datos ficticios).", "vis": "", "o": [["A", "2", "Cuenta solo los meses con 1.500 kWh o más (abril y junio) y omite mayo (1.450 kWh), que también supera el promedio.", false], ["B", "3", "Promedio: 8.200 ÷ 6 ≈ 1.366,7 kWh. Lo superan abril (1.500), mayo (1.450) y junio (1.600): 3 meses.", true], ["C", "4", "Incluye febrero (1.350 kWh), que está por debajo del promedio de unos 1.366,7 kWh.", false], ["D", "5", "Cuenta los meses que superan el consumo mínimo (marzo), no el promedio.", false]]}]}, {"comp": "razonamiento_cuantitativo", "sim": "tyt-1", "ind": "Plano de un local en forma de L", "tt": "", "texto": "La figura muestra el plano de un local en forma de L. Todos sus ángulos son rectos. Las medidas indicadas son: lado inferior, 10 m; lado izquierdo, 8 m; lado superior, 6 m; y los dos lados del entrante, 3 m (vertical) y 4 m (horizontal). El lado derecho está marcado con x.", "vis": "<div class=\"vfig\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 320\" font-family=\"Arial\" font-size=\"14\"><rect width=\"400\" height=\"320\" fill=\"#ffffff\"/><polygon points=\"40,40 220,40 220,130 340,130 340,280 40,280\" fill=\"#eef3f9\" stroke=\"#222\" stroke-width=\"2.5\"/><text x=\"130\" y=\"32\" text-anchor=\"middle\" fill=\"#111\">6 m<\/text><text x=\"228\" y=\"90\" fill=\"#111\">3 m<\/text><text x=\"280\" y=\"122\" text-anchor=\"middle\" fill=\"#111\">4 m<\/text><text x=\"350\" y=\"210\" fill=\"#111\">x<\/text><text x=\"190\" y=\"302\" text-anchor=\"middle\" fill=\"#111\">10 m<\/text><text x=\"8\" y=\"165\" fill=\"#111\">8 m<\/text><\/svg><\/div>", "items": [{"id": "RCT-135", "niv": 1, "cp": "rc_interpretacion", "e": "¿Cuál es la medida del lado marcado con x?", "f": "Cálculo propio a partir de los datos del caso (datos ficticios).", "vis": "", "o": [["A", "3 m.", "Es la medida del lado vertical del entrante, no del lado derecho.", false], ["B", "4 m.", "Es la medida del lado horizontal del entrante.", false], ["C", "5 m.", "La altura total del local es 8 m; el entrante ocupa 3 m de ella, así que x = 8 − 3 = 5 m.", true], ["D", "8 m.", "Es la altura total del lado izquierdo; el lado derecho es más corto por el entrante de 3 m.", false]]}]}, {"comp": "competencias_ciudadanas", "sim": "tyt-1", "ind": "Principios del Estado social de derecho", "tt": "", "texto": "En la inducción de una cooperativa de transporte intermunicipal, la facilitadora proyecta el artículo 1.º de la Constitución Política y pide a los nuevos conductores identificar en qué se funda el Estado colombiano.", "vis": "", "items": [{"id": "CCT-101", "niv": 1, "cp": "cc_conocimientos", "e": "Según el artículo 1.º de la Constitución, Colombia es un Estado social de derecho fundado, entre otros aspectos, en", "f": "Constitución Política de Colombia (texto vigente, Secretaría del Senado), art. 1", "vis": "", "o": [["A", "la libertad de empresa, la propiedad privada y la iniciativa individual de sus ciudadanos.", "La Constitución protege la propiedad privada en otro artículo (art. 58), pero el artículo 1.º no la enumera entre los fundamentos del Estado, y menciona en cambio la prevalencia del interés general.", false], ["B", "la centralización política y administrativa como garantía de la unidad de la República.", "El artículo 1.º define una República unitaria pero descentralizada y con autonomía de sus entidades territoriales.", false], ["C", "la integridad del territorio nacional, la independencia y la convivencia pacífica de sus habitantes.", "Son fines que el artículo 2.º asigna al Estado (defender la independencia, mantener la integridad territorial, asegurar la convivencia pacífica), no los fundamentos que enumera el artículo 1.º.", false], ["D", "la dignidad humana, el trabajo y la solidaridad de sus integrantes, y la prevalencia del interés general.", "El artículo 1.º dice textualmente que la República está «fundada en el respeto de la dignidad humana, en el trabajo y la solidaridad de las personas que la integran y en la prevalencia del interés general».", true]]}]}, {"comp": "competencias_ciudadanas", "sim": "tyt-1", "ind": "Lenguas de los grupos étnicos y educación", "tt": "", "texto": "Una tecnóloga en gestión educativa empieza a trabajar como coordinadora de una escuela ubicada en un resguardo donde la comunidad habla su propia lengua. Un docente recién llegado propone dictar todas las clases solo en castellano «porque es el idioma oficial de Colombia».", "vis": "", "items": [{"id": "CCT-102", "niv": 1, "cp": "cc_conocimientos", "e": "De acuerdo con la Constitución, la enseñanza en esa escuela debe ser", "f": "Constitución Política de Colombia (texto vigente, Secretaría del Senado), art. 10", "vis": "", "o": [["A", "en la lengua que escoja cada docente, porque la Constitución no regula el idioma de la enseñanza.", "La Constitución sí lo regula: el artículo 10 ordena que la enseñanza en esas comunidades sea bilingüe.", false], ["B", "solo en la lengua propia, porque el castellano no es oficial dentro de los resguardos.", "El castellano es el idioma oficial de Colombia en todo el país; la norma exige educación bilingüe, no exclusiva en la lengua propia.", false], ["C", "solo en castellano, porque es el único idioma oficial en todo el territorio nacional.", "El castellano es oficial, pero no el único: en sus territorios también lo son las lenguas de los grupos étnicos (art. 10).", false], ["D", "bilingüe, porque las lenguas de los grupos étnicos también son oficiales en sus territorios.", "El artículo 10 establece que las lenguas y dialectos de los grupos étnicos son oficiales en sus territorios y que la enseñanza en comunidades con tradiciones lingüísticas propias «será bilingüe».", true]]}]}, {"comp": "competencias_ciudadanas", "sim": "tyt-1", "ind": "Irrenunciabilidad de los derechos laborales mínimos", "tt": "", "texto": "En una fábrica de confecciones, todas las operarias son mayores de edad y tienen contrato laboral. La gerencia les pide firmar un documento en el que renuncian a la prima de servicios y a las vacaciones de este año a cambio de no ser despedidas durante la temporada baja. Los beneficios a los que se les pide renunciar están claramente establecidos en la ley laboral y nadie discute que les corresponden.", "vis": "", "items": [{"id": "CCT-103", "niv": 2, "cp": "cc_conocimientos", "e": "¿Cuál de los principios mínimos del artículo 53 de la Constitución impide que ese documento tenga validez?", "f": "Constitución Política de Colombia (texto vigente, Secretaría del Senado), art. 53", "vis": "", "o": [["A", "La irrenunciabilidad a los beneficios mínimos establecidos en las normas laborales.", "El artículo 53 incluye la «irrenunciabilidad a los beneficios mínimos establecidos en normas laborales»: el trabajador no puede renunciar válidamente a la prima ni a las vacaciones que la ley le reconoce.", true], ["B", "La protección especial al trabajador menor de edad.", "No aplica: la situación aclara que todas las operarias son mayores de edad.", false], ["C", "La facultad para transigir y conciliar sobre derechos inciertos y discutibles.", "Ese principio solo permite negociar derechos inciertos y discutibles; aquí los beneficios son ciertos e indiscutidos, como dice la situación.", false], ["D", "La situación más favorable al trabajador en caso de duda sobre las fuentes formales del derecho.", "Ese principio resuelve dudas de interpretación entre normas; en el caso no hay duda sobre qué norma aplicar, sino una renuncia a derechos ciertos.", false]]}]}, {"comp": "competencias_ciudadanas", "sim": "tyt-1", "ind": "Acción popular y derecho al ambiente sano", "tt": "", "texto": "Habitantes de tres veredas denuncian que una curtiembre vierte residuos sin tratar en la quebrada de la que se abastece el acueducto que comparten. No reclaman una indemnización personal: quieren que se detenga la contaminación que afecta a toda la comunidad.", "vis": "", "items": [{"id": "CCT-104", "niv": 1, "cp": "cc_conocimientos", "e": "¿Qué mecanismo prevé la Constitución específicamente para la protección de derechos e intereses colectivos como el ambiente?", "f": "Constitución Política de Colombia (texto vigente, Secretaría del Senado), arts. 79 y 88", "vis": "", "o": [["A", "La acción de cumplimiento.", "La acción de cumplimiento (art. 87) busca que una autoridad cumpla una ley o un acto administrativo; no es el mecanismo específico para los derechos colectivos.", false], ["B", "El habeas corpus.", "El habeas corpus (art. 30) protege a quien cree estar privado ilegalmente de su libertad.", false], ["C", "La acción de grupo.", "La acción de grupo (art. 88, inc. 2) busca reparar daños ocasionados a un número plural de personas; la comunidad no pide indemnización sino detener la contaminación.", false], ["D", "La acción popular.", "El artículo 88 dispone que la ley regulará las acciones populares para la protección de los derechos e intereses colectivos, entre ellos el ambiente y la salubridad pública.", true]]}]}, {"comp": "competencias_ciudadanas", "sim": "tyt-1", "ind": "Deberes de la persona y del ciudadano", "tt": "", "texto": "El dueño de un taller de mecánica automotriz comenta con sus empleados: «La Constitución habla de derechos, no de obligaciones; pagar impuestos es algo que el Gobierno se inventó, pero la Constitución no me lo exige».", "vis": "", "items": [{"id": "CCT-105", "niv": 1, "cp": "cc_conocimientos", "e": "¿Qué establece la Constitución sobre el pago de contribuciones para financiar al Estado?", "f": "Constitución Política de Colombia (texto vigente, Secretaría del Senado), art. 95, num. 9", "vis": "", "o": [["A", "Lo incluye entre los deberes de la persona y del ciudadano, con criterios de justicia y equidad.", "El numeral 9 del artículo 95 incluye entre los deberes de la persona y del ciudadano «contribuir al financiamiento de los gastos e inversiones del Estado dentro de conceptos de justicia y equidad».", true], ["B", "Lo establece como obligación de las empresas, mientras que para las personas naturales es un aporte voluntario.", "El deber del numeral 9 del artículo 95 es de la persona y del ciudadano; la Constitución no lo limita a las empresas ni lo vuelve voluntario para nadie.", false], ["C", "Lo presenta como un compromiso moral de solidaridad, cuyo cumplimiento depende de las convicciones de cada persona.", "No es un simple compromiso moral: el artículo 95 lo enumera como deber y señala que toda persona está obligada a cumplir la Constitución y las leyes.", false], ["D", "Lo deja en manos de las leyes tributarias, pues la Constitución se ocupa de los derechos de las personas.", "El artículo 95 de la Constitución sí enumera deberes, entre ellos el de contribuir al financiamiento del Estado (num. 9); no lo deja solo a las leyes.", false]]}]}, {"comp": "competencias_ciudadanas", "sim": "tyt-1", "ind": "Funciones del Congreso", "tt": "", "texto": "La Cámara de Representantes cita a la ministra del Trabajo a un debate para que explique por qué un programa nacional de empleo para jóvenes técnicos ha ejecutado menos de la mitad de su presupuesto. Los representantes formulan un cuestionario escrito y evalúan las respuestas de la ministra.", "vis": "", "items": [{"id": "CCT-106", "niv": 2, "cp": "cc_conocimientos", "e": "Con esta actuación, el Congreso ejerce la función de", "f": "Constitución Política de Colombia (texto vigente, Secretaría del Senado), art. 114", "vis": "", "o": [["A", "control disciplinario sobre la conducta oficial de la ministra.", "La vigilancia de la conducta oficial y el poder disciplinario preferente corresponden a la Procuraduría General de la Nación (art. 277, num. 6).", false], ["B", "legislación, porque el debate equivale a expedir una ley sobre empleo juvenil.", "Un debate de control no es el trámite de una ley; hacer las leyes es otra función distinta del Congreso (arts. 114 y 150).", false], ["C", "control fiscal sobre los recursos públicos ejecutados por el ministerio.", "La vigilancia y el control fiscal son función de la Contraloría General de la República (art. 267), no del Congreso.", false], ["D", "control político sobre el gobierno y la administración.", "El artículo 114 asigna al Congreso «reformar la Constitución, hacer las leyes y ejercer control político sobre el gobierno y la administración»; citar a una ministra a un debate es control político.", true]]}]}, {"comp": "competencias_ciudadanas", "sim": "tyt-1", "ind": "Elección del Contralor General", "tt": "", "texto": "Una tecnóloga en gestión pública prepara una cartilla para los funcionarios de una alcaldía sobre los organismos de control. En el apartado sobre la Contraloría General de la República debe explicar cómo se elige al Contralor según el texto vigente de la Constitución.", "vis": "", "items": [{"id": "CCT-107", "niv": 3, "cp": "cc_conocimientos", "e": "¿Cuál de las siguientes descripciones corresponde al texto vigente de la Constitución?", "f": "Constitución Política de Colombia (texto vigente, Secretaría del Senado), art. 267 (modificado por el Acto Legislativo 04 de 2019)", "vis": "", "o": [["A", "Lo elige el Congreso en pleno, por mayoría absoluta, de una lista de elegibles conformada por convocatoria pública.", "El artículo 267, modificado por el Acto Legislativo 04 de 2019, dispone que el Contralor será elegido por el Congreso en pleno, por mayoría absoluta, de lista de elegibles conformada por convocatoria pública.", true], ["B", "Lo elige el Congreso en pleno de una terna integrada por la Corte Constitucional, la Corte Suprema y el Consejo de Estado.", "Ese era el procedimiento anterior a la reforma; el Acto Legislativo 04 de 2019 lo reemplazó por la lista de elegibles conformada por convocatoria pública.", false], ["C", "Lo escogen los presidentes de las altas cortes mediante un concurso de méritos.", "Así se escoge al Registrador Nacional del Estado Civil (art. 266), no al Contralor General.", false], ["D", "Lo elige la Cámara de Representantes de una terna que le envía el presidente de la República.", "Ese es el procedimiento para elegir al Defensor del Pueblo (art. 281), no al Contralor.", false]]}]}, {"comp": "competencias_ciudadanas", "sim": "tyt-1", "ind": "Organización electoral: la Registraduría", "tt": "", "texto": "Un técnico en sistemas trabaja en la sede municipal de una entidad que, en el mismo año, expide cédulas de ciudadanía, inscribe registros civiles de nacimiento y prepara las mesas de votación para las elecciones locales.", "vis": "", "items": [{"id": "CCT-108", "niv": 2, "cp": "cc_conocimientos", "e": "Según la Constitución, ¿quién ejerce las funciones de dirigir y organizar las elecciones, llevar el registro civil e identificar a las personas?", "f": "Constitución Política de Colombia (texto vigente, Secretaría del Senado), art. 266 (modificado por los Actos Legislativos 01 de 2003 y 02 de 2015)", "vis": "", "o": [["A", "El Gobierno nacional, por medio del Ministerio del Interior.", "Es un organismo de la rama ejecutiva; la Constitución asigna esas funciones a la organización electoral, en cabeza del Registrador.", false], ["B", "El Registrador Nacional del Estado Civil.", "El artículo 266 señala que el Registrador ejercerá las funciones que establezca la ley, «incluida la dirección y organización de las elecciones, el registro civil y la identificación de las personas».", true], ["C", "El Consejo Nacional Electoral.", "El CNE regula, inspecciona, vigila y controla la actividad electoral de partidos, movimientos y candidatos (art. 265), pero no expide cédulas ni lleva el registro civil.", false], ["D", "La Procuraduría General de la Nación.", "Es un órgano de control que vigila la conducta oficial de los servidores públicos (arts. 275 y 277); no organiza elecciones.", false]]}]}, {"comp": "competencias_ciudadanas", "sim": "tyt-1", "ind": "Acción de tutela: plazo de resolución", "tt": "", "texto": "Un técnico electricista que sufrió un accidente laboral presenta una acción de tutela porque su entidad de salud le niega una cirugía urgente. Su compañero le dice que el juez puede tardar varios meses en decidir.", "vis": "", "items": [{"id": "CCT-109", "niv": 1, "cp": "cc_conocimientos", "e": "Según la Constitución, ¿cuál es el tiempo máximo que puede transcurrir entre la solicitud de tutela y su resolución?", "f": "Constitución Política de Colombia (texto vigente, Secretaría del Senado), art. 86", "vis": "", "o": [["A", "Treinta y seis horas.", "Ese es el término para resolver el habeas corpus (art. 30), no la tutela.", false], ["B", "Seis meses.", "La Constitución no fija ese plazo; el procedimiento de tutela es preferente y sumario, con máximo diez días.", false], ["C", "Un mes.", "No es el plazo constitucional; el artículo 86 fija un máximo de diez días.", false], ["D", "Diez días.", "El artículo 86 establece: «En ningún caso podrán transcurrir más de diez días entre la solicitud de tutela y su resolución».", true]]}]}, {"comp": "competencias_ciudadanas", "sim": "tyt-1", "ind": "Voto programático", "tt": "", "texto": "En un municipio, varias juntas de acción comunal reclaman al alcalde porque, a mitad de su periodo, abandonó la construcción del centro de formación técnica que aparecía como compromiso central en el programa de gobierno que inscribió como candidato. Los líderes sostienen que ese programa no era una simple promesa de campaña, sino un mandato de los electores.", "vis": "", "items": [{"id": "CCT-110", "niv": 3, "cp": "cc_conocimientos", "e": "¿Qué figura constitucional respalda la idea de que el programa inscrito es un mandato para el alcalde?", "f": "Constitución Política de Colombia (texto vigente, Secretaría del Senado), art. 259", "vis": "", "o": [["A", "El voto programático, por el cual los electores imponen al elegido el programa que inscribió como candidato.", "El artículo 259 dispone que quienes elijan gobernadores y alcaldes «imponen por mandato al elegido el programa que presentó al inscribirse como candidato»; eso es el voto programático.", true], ["B", "El plebiscito, mediante el cual los ciudadanos de un municipio aprueban las obras que el alcalde debe ejecutar en su periodo.", "El plebiscito es un pronunciamiento del pueblo convocado por el ejecutivo sobre una decisión suya; no es la figura que vuelve mandato el programa.", false], ["C", "La iniciativa legislativa, que permite a los ciudadanos presentar ante el concejo un proyecto para obligar al alcalde a cumplir.", "La iniciativa popular sirve para presentar proyectos normativos; el fundamento de que el programa sea un mandato es el artículo 259.", false], ["D", "El cabildo abierto, que obliga al alcalde a ejecutar las obras que la comunidad apruebe en una sesión pública del concejo.", "El cabildo abierto es un mecanismo de participación (art. 103) para discutir asuntos de interés comunitario; no convierte el programa inscrito en mandato.", false]]}]}, {"comp": "competencias_ciudadanas", "sim": "tyt-1", "ind": "Tierras de resguardo y diversidad étnica", "tt": "", "texto": "Una empresa de ecoturismo ofrece comprar a un cabildo indígena parte de las tierras del resguardo para construir cabañas. Algunos comuneros están de acuerdo porque el dinero serviría para mejorar la escuela.", "vis": "", "items": [{"id": "CCT-111", "niv": 2, "cp": "cc_conocimientos", "e": "De acuerdo con la Constitución, las tierras de resguardo", "f": "Constitución Política de Colombia (texto vigente, Secretaría del Senado), arts. 7 y 63", "vis": "", "o": [["A", "son inalienables, imprescriptibles e inembargables, por lo que no pueden venderse.", "El artículo 63 señala que las tierras comunales de grupos étnicos y las tierras de resguardo, entre otros bienes, «son inalienables, imprescriptibles e inembargables»; inalienable significa que no pueden venderse.", true], ["B", "son bienes fiscales de la Nación, que el Gobierno puede vender a particulares por razones de desarrollo.", "La Constitución las protege como inalienables (art. 63); no son bienes que el Gobierno pueda vender.", false], ["C", "son propiedad individual de cada comunero, quien puede vender su parte con autorización del alcalde.", "Son tierras comunales y de resguardo, no propiedades individuales, y la Constitución prohíbe enajenarlas.", false], ["D", "son bienes privados del cabildo, que puede venderlos si la asamblea de la comunidad lo aprueba.", "No son bienes de libre disposición: al ser inalienables, ni siquiera una decisión mayoritaria permite venderlos.", false]]}]}, {"comp": "competencias_ciudadanas", "sim": "tyt-1", "ind": "Aprendices en una planta de alimentos", "tt": "", "texto": "En una planta de alimentos, el jefe de producción afirma en el comité operativo: «Desde marzo, cuando llegaron los cuatro aprendices del SENA, los errores de sellado en la línea de empaque se duplicaron. Está claro que los aprendices son descuidados; propongo no recibir más aprendices el próximo semestre».\n\nLa coordinadora de calidad recuerda que en marzo también se cambió la máquina selladora por un modelo nuevo, cuyos operarios aún se están adaptando a ella.", "vis": "", "items": [{"id": "CCT-112", "niv": 2, "cp": "cc_argumentacion", "e": "¿Cuál es la principal debilidad del argumento del jefe de producción?", "f": "Situación original elaborada para este simulacro, párrafos 1 y 2", "vis": "", "o": [["A", "Compara meses con volúmenes de producción distintos, lo que impide saber si los errores de verdad aumentaron.", "El texto no dice que los volúmenes de producción cambiaran; la debilidad identificable es que no descarta el cambio de máquina.", false], ["B", "Atribuye los errores a los aprendices por la sola coincidencia con su llegada, sin descartar el cambio de máquina.", "El jefe infiere causalidad de una coincidencia en el tiempo; la coordinadora muestra que en el mismo mes ocurrió otro cambio (la selladora) que también podría explicar los errores.", true], ["C", "Se basa en datos de producción de la planta, que no son útiles para evaluar el desempeño de las personas.", "Los datos de producción sí pueden servir para evaluar desempeño; el problema es la inferencia causal que hace con ellos.", false], ["D", "Generaliza a partir de una cantidad de errores demasiado pequeña para que el comité la tenga en cuenta.", "El texto no da cifras absolutas que permitan decir que la muestra es pequeña; la debilidad identificable es la causa no descartada.", false]]}, {"id": "CCT-113", "niv": 3, "cp": "cc_argumentacion", "e": "¿Cuál de los siguientes datos, de ser cierto, debilitaría MÁS la conclusión del jefe de producción?", "f": "Situación original elaborada para este simulacro, párrafo 1", "vis": "", "o": [["A", "Algunos operarios con varios años de experiencia también cometieron errores de sellado desde marzo.", "Debilita poco: que algunos expertos fallen no descarta que los aprendices fallen mucho más; no compara proporciones como sí lo hace la opción correcta.", false], ["B", "La empresa recibe aprendices del SENA desde hace varios años en otras áreas de la planta.", "Es irrelevante para saber qué causó los errores en la línea de empaque desde marzo.", false], ["C", "Los aprendices tienen, en promedio, bastante menos experiencia laboral que los operarios de planta.", "Este dato no debilita la conclusión; más bien podría usarse para reforzarla.", false], ["D", "Los errores aumentaron en igual proporción en los turnos con aprendices y en los turnos sin ellos.", "Si los errores crecieron igual donde no hay aprendices, su presencia no explica el aumento; este dato separa directamente las dos posibles causas.", true]]}]}, {"comp": "competencias_ciudadanas", "sim": "tyt-1", "ind": "Inseguridad y prejuicio en un barrio", "tt": "", "texto": "En una reunión de la junta de acción comunal sobre los robos de celulares en el barrio, un vecino dice: «Los robos empezaron cuando la alcaldía abrió el polideportivo en horario nocturno. Seguro son los muchachos que van a jugar microfútbol por la noche; hay que cerrarlo».", "vis": "", "items": [{"id": "CCT-114", "niv": 1, "cp": "cc_argumentacion", "e": "La afirmación del vecino", "f": "Situación original elaborada para este simulacro", "vis": "", "o": [["A", "culpa de los robos a un grupo de jóvenes por algo que comparten, sin pruebas de que alguno haya robado.", "El vecino culpa a todo un grupo («los muchachos que van a jugar») a partir de una coincidencia de tiempo y no presenta evidencia de que alguno haya cometido un robo: es un prejuicio.", true], ["B", "propone una solución acordada previamente por la junta de acción comunal para reducir los robos.", "Es una propuesta personal del vecino en la reunión, no una decisión previa de la junta.", false], ["C", "presenta un dato verificable de los registros de la Policía sobre las personas capturadas en el barrio.", "El vecino no cita registros ni capturas; habla de una suposición («seguro son»).", false], ["D", "es sólida, porque la coincidencia entre la apertura nocturna y los robos demuestra quiénes son los responsables.", "Una coincidencia en el tiempo no demuestra quién cometió los robos; muchos otros factores podrían explicarlos.", false]]}]}, {"comp": "competencias_ciudadanas", "sim": "tyt-1", "ind": "Tarifa del acueducto comunitario", "tt": "", "texto": "En la asamblea del acueducto comunitario de una vereda se discute aumentar la tarifa mensual. El tesorero afirma: «Si no subimos la tarifa, el acueducto quebrará, y si quiebra, la vereda se queda sin agua. Por eso, quien vote en contra del aumento quiere dejar a la vereda sin agua».\n\nUna socia responde: «Antes de decidir, revisemos las pérdidas por fugas: según el fontanero, se pierde cerca del 30 % del agua que tratamos».", "vis": "", "items": [{"id": "CCT-115", "niv": 2, "cp": "cc_argumentacion", "e": "¿Qué problema tiene la última frase del tesorero?", "f": "Situación original elaborada para este simulacro, párrafo 1", "vis": "", "o": [["A", "Contradice la premisa del propio tesorero según la cual el acueducto podría quebrar sin el aumento.", "No hay contradicción: la frase final se apoya en esa premisa; el problema es la intención que atribuye.", false], ["B", "Se apoya en cifras del presupuesto del acueducto que no fueron presentadas a la asamblea.", "El tesorero no menciona cifras; su argumento es solo una cadena de condicionales.", false], ["C", "Es correcta, porque si el aumento es necesario, votar en contra equivale a querer que la vereda pierda el agua.", "Aun si el aumento fuera necesario, quien vota en contra puede estar equivocado sin «querer» dejar a nadie sin agua; además, nadie ha demostrado que sea la única salida.", false], ["D", "Atribuye a quienes voten en contra una intención que no se deduce de su voto, que puede tener otras razones.", "Votar contra el aumento no implica querer dejar a la vereda sin agua; el tesorero asigna una intención a sus oponentes y descarta que existan alternativas, como las que plantea la socia.", true]]}, {"id": "CCT-116", "niv": 1, "cp": "cc_argumentacion", "e": "¿Qué hace la socia con su intervención?", "f": "Situación original elaborada para este simulacro, párrafo 2", "vis": "", "o": [["A", "Respalda el aumento de la tarifa con un dato técnico aportado por el fontanero del acueducto.", "El dato de las fugas no respalda el aumento; sugiere que podría haber otra solución.", false], ["B", "Plantea revisar otra causa del problema financiero, distinta de la tarifa, antes de decidir.", "La socia no rechaza ni apoya el aumento: plantea revisar las fugas, otra posible causa del déficit, antes de tomar la decisión.", true], ["C", "Acusa al tesorero de haber manejado de forma indebida los recursos del acueducto comunitario.", "No hace ninguna acusación sobre el manejo del dinero.", false], ["D", "Niega que el acueducto tenga dificultades financieras que la asamblea deba resolver ahora.", "No niega el problema; propone revisar otra de sus causas.", false]]}]}, {"comp": "competencias_ciudadanas", "sim": "tyt-1", "ind": "Encuesta sobre turnos en una empresa de vigilancia", "tt": "", "texto": "Una empresa de vigilancia privada implantó turnos rotativos de doce horas para sus 600 guardas. En un comunicado, la gerencia afirma: «El 90 % de los trabajadores encuestados está satisfecho con el nuevo sistema de turnos, de modo que la medida cuenta con el respaldo del personal».\n\nLa encuesta se aplicó a 40 empleados de la sede administrativa, quienes trabajan en horario de oficina y no hacen turnos rotativos.\n\nEl sindicato responde: «La encuesta no vale nada porque la hizo la propia empresa, que tiene interés en el resultado».", "vis": "", "items": [{"id": "CCT-117", "niv": 2, "cp": "cc_argumentacion", "e": "¿Por qué es cuestionable la conclusión del comunicado de la gerencia?", "f": "Situación original elaborada para este simulacro, párrafos 1 y 2", "vis": "", "o": [["A", "Porque la encuesta midió la satisfacción con los turnos, pero no la productividad de los guardas con el nuevo sistema.", "La productividad no es lo que afirma el comunicado: este habla del respaldo del personal, y la falla está en a quiénes se encuestó.", false], ["B", "Porque la satisfacción con un sistema de turnos cambia con el tiempo y debería medirse de nuevo cada mes.", "Repetir la medición no corrige el problema principal: aunque se midiera cada mes, se seguiría preguntando a quienes no hacen los turnos.", false], ["C", "Porque un 90 % de satisfacción es un porcentaje demasiado alto para ser verdadero.", "Un porcentaje alto no es falso por sí mismo; la debilidad está en la muestra.", false], ["D", "Porque solo se encuestó a personal administrativo, que no hace los turnos, y no a los guardas afectados.", "Los 40 encuestados son administrativos sin turnos rotativos; su satisfacción no permite concluir nada sobre los 600 guardas que sí los hacen.", true]]}, {"id": "CCT-118", "niv": 3, "cp": "cc_argumentacion", "e": "¿Cuál es la evaluación más adecuada de la respuesta del sindicato?", "f": "Situación original elaborada para este simulacro, párrafo 3", "vis": "", "o": [["A", "Advierte un posible conflicto de interés, pero eso no basta para probar que los datos sean falsos.", "Que la empresa tenga interés invita a revisar cómo se hizo la encuesta, pero no demuestra por sí solo que sus datos sean falsos; para eso hay que examinar la encuesta misma.", true], ["B", "Es concluyente, porque la empresa tiene interés en el resultado y eso basta para considerar falsos sus datos.", "Tener interés en un resultado no hace falsa una información; hay que examinar cómo se obtuvo.", false], ["C", "Demuestra que la gerencia manipuló a propósito los resultados de la encuesta para justificar la medida.", "El sindicato no aporta pruebas de manipulación; solo menciona quién hizo la encuesta.", false], ["D", "Es acertada en parte, pero solo tendría valor si el sindicato hubiera hecho su propia encuesta con todos los guardas de la empresa.", "Señalar un posible conflicto de interés no exige presentar otra encuesta; además, la falla de la encuesta de la empresa puede mostrarse con el propio texto.", false]]}]}, {"comp": "competencias_ciudadanas", "sim": "tyt-1", "ind": "Granja avícola y vereda", "tt": "", "texto": "(1) Hace un año, la empresa Avícola Los Cerezos instaló galpones para 60.000 pollos a 800 metros de la vereda La Esmeralda. Tiene licencia ambiental vigente y contrató a 45 personas, 30 de ellas habitantes de la vereda.\n\n(2) Rosa Pinzón, presidenta de la junta de acción comunal: «No pedimos que la granja se vaya; muchos vecinos trabajan ahí. Pedimos que controle los olores y las moscas, y que sus camiones no destruyan la vía destapada, que es la única que tenemos para sacar la cosecha».\n\n(3) Hernán Ruiz, gerente de la granja: «Cumplimos la licencia y ya tratamos la gallinaza. Los camiones deben salir entre las 2 y las 5 de la mañana, porque el pollo tiene que llegar fresco a los supermercados de la ciudad antes de que abran; no podemos cambiar ese horario».\n\n(4) Wilson Castro, joven de la vereda: «Antes tenía que irme a la ciudad a buscar trabajo. Ahora trabajo en la granja y vivo con mi familia; me preocupa que, por las quejas, la cierren».\n\n(5) La secretaria de Agricultura del municipio: «La granja aporta empleo e impuestos al municipio, pero también debo atender las quejas de la comunidad. Mi tarea es buscar un acuerdo para que la empresa siga funcionando sin afectar la vida de la vereda».\n\n(6) La junta propone que los camiones circulen solo entre las 7 de la mañana y las 6 de la tarde, cuando los vecinos pueden vigilar la velocidad, y que la empresa aporte material para arreglar la vía.", "vis": "", "items": [{"id": "CCT-119", "niv": 1, "cp": "cc_multiperspectivismo", "e": "¿Qué busca principalmente la junta de acción comunal?", "f": "Situación original elaborada para este simulacro, párrafos 2 y 6", "vis": "", "o": [["A", "Que la granja sea cerrada y trasladada lejos de las viviendas y los cultivos de la vereda.", "La presidenta aclara expresamente: «No pedimos que la granja se vaya».", false], ["B", "Que la granja reduzca los olores, las moscas y el daño a la vía, sin dejar de funcionar.", "La presidenta dice que no piden que la granja se vaya, sino que controle olores y moscas y no destruya la vía (párrafo 2).", true], ["C", "Que la empresa contrate a más personas de la vereda en sus galpones.", "La junta no plantea esa exigencia; sus peticiones se refieren a olores, moscas y la vía.", false], ["D", "Que la alcaldía cobre más impuestos a la granja para financiar obras en la vía.", "La junta propone que la empresa aporte material para la vía, no un aumento de impuestos.", false]]}, {"id": "CCT-120", "niv": 1, "cp": "cc_multiperspectivismo", "e": "¿En qué coinciden el gerente de la granja y Wilson Castro?", "f": "Situación original elaborada para este simulacro, párrafos 3 y 4", "vis": "", "o": [["A", "Ambos reconocen que la granja incumple la licencia ambiental.", "El gerente afirma que la cumplen y Wilson no se refiere a la licencia.", false], ["B", "Ambos tienen interés en que la granja siga funcionando.", "El gerente defiende la operación de la empresa y Wilson teme que la cierren porque allí tiene su trabajo (párrafos 3 y 4).", true], ["C", "Ambos consideran que las quejas de la comunidad son infundadas.", "Wilson no califica las quejas; solo expresa su temor de que lleven al cierre.", false], ["D", "Ambos proponen cambiar el horario de circulación de los camiones.", "El gerente dice que no puede cambiar el horario y Wilson no habla de él.", false]]}, {"id": "CCT-121", "niv": 2, "cp": "cc_multiperspectivismo", "e": "¿Qué actor tendría más razones para rechazar la propuesta de la junta descrita en el párrafo 6?", "f": "Situación original elaborada para este simulacro, párrafos 3 y 6", "vis": "", "o": [["A", "Wilson Castro, porque la propuesta de la junta pide el cierre definitivo de la granja.", "La propuesta no pide el cierre; regula horarios y el arreglo de la vía.", false], ["B", "La secretaria de Agricultura, porque la propuesta obliga al municipio a pagar con su presupuesto todo el arreglo de la vía.", "La propuesta pide que el material lo aporte la empresa, no el municipio.", false], ["C", "Rosa Pinzón, porque la propuesta deja por fuera el problema de los olores y las moscas.", "Rosa Pinzón preside la junta que hace la propuesta; no tiene razones para rechazarla.", false], ["D", "El gerente, porque el horario propuesto impide despachar el pollo en la madrugada, como él considera necesario.", "La junta propone que los camiones circulen solo de 7 a. m. a 6 p. m., mientras el gerente sostiene que deben salir entre las 2 y las 5 a. m. y que no puede cambiarlo (párrafo 3).", true]]}, {"id": "CCT-122", "niv": 2, "cp": "cc_multiperspectivismo", "e": "La posición intermedia de la secretaria de Agricultura se explica principalmente porque", "f": "Situación original elaborada para este simulacro, párrafo 5", "vis": "", "o": [["A", "su cargo público le exige atender el aporte económico de la granja y las quejas de la comunidad.", "Ella misma lo dice: la granja aporta empleo e impuestos al municipio, pero también debe atender a la comunidad; su rol la obliga a buscar un acuerdo (párrafo 5).", true], ["B", "vive en la vereda y sufre directamente los olores y el polvo de los camiones.", "El texto no dice que viva en la vereda; habla desde su función pública.", false], ["C", "representa los intereses de la empresa ante las autoridades ambientales del departamento y del municipio.", "No representa a la empresa; busca un acuerdo entre la empresa y la comunidad.", false], ["D", "trabaja en la granja y teme perder su empleo si las autoridades ordenan cerrarla.", "Quien trabaja en la granja es Wilson Castro; ella es funcionaria del municipio.", false]]}]}, {"comp": "competencias_ciudadanas", "sim": "tyt-1", "ind": "Motos de reparto en un conjunto residencial", "tt": "", "texto": "El consejo de administración del conjunto residencial Altos del Parque propone prohibir que las motocicletas de reparto circulen o se parqueen en las zonas comunes, incluidas las de los residentes que trabajan como repartidores. Los repartidores tendrían que dejar los pedidos en la portería.\n\nLa administradora: «Han aumentado las quejas por ruido y por motos que pasan rápido junto al parque infantil. Mi deber es hacer cumplir el reglamento y proteger las zonas comunes».\n\nJairo, residente que trabaja como repartidor en una plataforma: «Si no puedo entrar mi moto, tendré que dejarla en la calle de noche, donde me la pueden robar, y es mi herramienta de trabajo».\n\nDoña Elvira, residente de 78 años: «Yo pido los mercados a domicilio porque no puedo cargar peso. Si los repartidores se quedan en la portería, tendré que bajar sola cinco pisos por las escaleras, porque el edificio no tiene ascensor».\n\nUn miembro del consejo: «La prohibición evita accidentes y, además, mantiene el valor de nuestros apartamentos».", "vis": "", "items": [{"id": "CCT-123", "niv": 2, "cp": "cc_multiperspectivismo", "e": "¿Por qué la administradora y doña Elvira valoran de manera distinta la propuesta?", "f": "Situación original elaborada para este simulacro, párrafos 2 y 4", "vis": "", "o": [["A", "La administradora busca favorecer a las plataformas de reparto, y doña Elvira quiere reducir el ruido de las motos.", "Invierte las posiciones: es la administradora quien habla del ruido, y nadie busca favorecer a las plataformas.", false], ["B", "Ambas rechazan la propuesta, aunque por razones económicas distintas.", "La administradora no la rechaza, y ninguna de las dos da razones económicas.", false], ["C", "Doña Elvira la apoya por la seguridad de los niños, y la administradora se opone por el reglamento.", "Es al revés: doña Elvira expresa una dificultad que la propuesta le causaría y la administradora invoca el reglamento para respaldarla.", false], ["D", "Para la administradora protege las zonas comunes; para doña Elvira, le impide recibir sus mercados en la torre.", "La administradora habla de ruido, velocidad y reglamento; doña Elvira, de que tendría que bajar sola cinco pisos para recibir los pedidos.", true]]}, {"id": "CCT-124", "niv": 3, "cp": "cc_multiperspectivismo", "e": "¿Cuál de las siguientes alternativas tendría más probabilidad de ser aceptada a la vez por la administradora, Jairo y doña Elvira?", "f": "Situación original elaborada para este simulacro", "vis": "", "o": [["A", "Permitir que las motos lleguen hasta las torres solo por un carril señalizado, a baja velocidad y lejos del parque infantil.", "Atiende la preocupación de la administradora por la velocidad junto al parque, permite a Jairo guardar su moto dentro y deja que los pedidos lleguen a la torre de doña Elvira.", true], ["B", "Aplicar la prohibición sin excepciones y multar a quien la incumpla, para garantizar el respeto del reglamento.", "Jairo tendría que dejar su moto en la calle y doña Elvira tendría que bajar a la portería: ambos la rechazarían.", false], ["C", "Mantener la prohibición y permitir que los residentes repartidores dejen sus motos en la calle, frente a la portería del conjunto.", "Jairo teme justamente dejar la moto en la calle, y doña Elvira seguiría teniendo que bajar a la portería.", false], ["D", "Eliminar cualquier regla sobre las motos en las zonas comunes, para no afectar a quienes trabajan en reparto.", "Ignora las quejas por ruido y velocidad, que la administradora tiene el deber de atender.", false]]}, {"id": "CCT-125", "niv": 3, "cp": "cc_multiperspectivismo", "e": "La última frase del miembro del consejo permite inferir que su apoyo a la prohibición", "f": "Situación original elaborada para este simulacro, párrafo 5", "vis": "", "o": [["A", "no tiene relación con la seguridad de los niños que usan el parque infantil.", "Sí la tiene: el primer argumento que da es que la prohibición evita accidentes.", false], ["B", "coincide con la preocupación de Jairo por proteger los bienes de trabajo de los residentes.", "Jairo se opone a la prohibición; el consejero no habla de bienes de trabajo.", false], ["C", "responde también a su interés como propietario, además de la preocupación por la seguridad.", "Menciona los accidentes (seguridad) y añade «mantiene el valor de nuestros apartamentos», un interés patrimonial propio de su papel de propietario.", true], ["D", "busca beneficiar económicamente a las plataformas de reparto que operan en el sector.", "Nada en su intervención se refiere a las plataformas; el beneficio que menciona es para los propietarios.", false]]}]}, {"comp": "competencias_ciudadanas", "sim": "tyt-1", "ind": "Tarjeta de pago en el transporte urbano", "tt": "", "texto": "La alcaldía de una ciudad intermedia y las empresas de buses acordaron reemplazar el pago en efectivo por una tarjeta recargable. Hoy, los conductores reciben, además de su salario, una bonificación por cada pasajero que recogen. Según la Secretaría de Movilidad, esa bonificación los lleva a competir en la vía por recoger más pasajeros, lo que causa muchos accidentes.\n\nEl gerente de una empresa de buses: «Con la tarjeta sabremos exactamente cuántos pasajeros viajan y controlaremos mejor los ingresos».\n\nEl presidente del sindicato de conductores: «No nos oponemos a la tarjeta, pero si se elimina la bonificación por pasajero, nuestro ingreso caerá. Pedimos un salario fijo equivalente a lo que hoy ganamos en promedio».\n\nUna vendedora ambulante que usa el bus a diario: «Si tengo que recargar la tarjeta en un punto lejano, perderé tiempo de trabajo. Necesito poder recargarla cerca de mi casa».\n\nLa secretaria de Movilidad: «Nuestro objetivo es reducir la accidentalidad y ordenar el servicio».", "vis": "", "items": [{"id": "CCT-126", "niv": 1, "cp": "cc_multiperspectivismo", "e": "¿Cuál es la principal preocupación del sindicato de conductores?", "f": "Situación original elaborada para este simulacro, párrafo 3", "vis": "", "o": [["A", "Que los conductores deban encargarse de recargar las tarjetas de los pasajeros.", "El texto no menciona esa posibilidad.", false], ["B", "Que los conductores pierdan ingresos si desaparece la bonificación por pasajero.", "El presidente del sindicato dice que no se oponen a la tarjeta, pero que su ingreso caerá si se elimina la bonificación.", true], ["C", "Que la tarjeta recargable aumente los accidentes de tránsito en las vías de la ciudad.", "El sindicato no relaciona la tarjeta con los accidentes; esa es una preocupación de la Secretaría de Movilidad.", false], ["D", "Que la alcaldía elimine las rutas en las que hoy trabajan los conductores.", "Nadie plantea eliminar rutas; la preocupación del sindicato es el ingreso.", false]]}, {"id": "CCT-127", "niv": 3, "cp": "cc_multiperspectivismo", "e": "¿Qué relación hay entre la propuesta del sindicato y el objetivo de la secretaria de Movilidad?", "f": "Situación original elaborada para este simulacro, párrafos 1, 3 y 5", "vis": "", "o": [["A", "Son opuestas, porque el sindicato rechaza la tarjeta y la secretaria quiere implementarla.", "El sindicato dice expresamente: «No nos oponemos a la tarjeta».", false], ["B", "No tienen relación, porque la secretaria solo se interesa por la forma de pago de los pasajeros.", "La secretaria dice que su objetivo es reducir la accidentalidad, que el texto relaciona con la bonificación.", false], ["C", "Son independientes: el salario fijo mejora el ingreso de los conductores, pero no cambia su manera de conducir.", "El párrafo 1 relaciona la competencia en la vía con la bonificación por pasajero; al quitarla, el salario fijo sí cambia el incentivo que lleva a conducir de forma riesgosa.", false], ["D", "Son compatibles: un salario fijo quitaría el incentivo de competir en la vía, que la Secretaría asocia con accidentes.", "Según el párrafo 1, la bonificación por pasajero incentiva la competencia en la vía y los accidentes; un salario fijo elimina ese incentivo, lo que favorece el objetivo de reducir la accidentalidad.", true]]}, {"id": "CCT-128", "niv": 2, "cp": "cc_multiperspectivismo", "e": "Si la alcaldía decide habilitar la recarga de la tarjeta en tiendas de barrio, pero mantiene la bonificación por pasajero, ¿qué actor vería atendida su preocupación?", "f": "Situación original elaborada para este simulacro, párrafo 4", "vis": "", "o": [["A", "El gerente, porque la empresa recibiría una comisión por cada recarga hecha en las tiendas de barrio.", "El texto no menciona comisiones; la preocupación del gerente (saber cuántos pasajeros viajan y controlar los ingresos) depende de la tarjeta, no del lugar donde se recargue.", false], ["B", "La vendedora ambulante, porque podría recargar cerca de su casa sin perder tiempo de trabajo.", "La vendedora pidió poder recargar cerca de su casa; la medida responde exactamente a esa necesidad.", true], ["C", "El sindicato, porque la recarga en tiendas aumentaría el número de pasajeros por bus.", "La petición del sindicato es un salario fijo; la medida no la atiende ni el texto dice que aumente los pasajeros.", false], ["D", "La secretaria de Movilidad, porque la medida eliminaría la competencia entre conductores.", "Si se mantiene la bonificación, el incentivo a competir en la vía sigue existiendo.", false]]}]}, {"comp": "competencias_ciudadanas", "sim": "tyt-1", "ind": "Quemas de basura y recolección rural", "tt": "", "texto": "El concejo de un municipio cafetero aprobó un programa para las veredas: se prohíbe quemar basuras en las fincas, práctica común porque el carro recolector nunca ha llegado a la zona rural; la empresa municipal de aseo hará una ruta rural cada quince días, y el costo, $ 9.000 mensuales por familia, se cobrará en la factura de los acueductos comunitarios veredales, que luego transferirán lo recaudado a la empresa de aseo.\n\nEl tesorero de un acueducto veredal advierte que el 20 % de las familias ya paga tarde el agua y que, si la factura sube, la morosidad podría aumentar y el acueducto se quedaría sin dinero para comprar insumos de tratamiento.\n\nUna médica del puesto de salud señala que, en temporada de quemas, aumentan las consultas por enfermedades respiratorias.\n\nUn caficultor comenta que buena parte de los residuos de las fincas son orgánicos (pulpa de café, cáscaras) y podrían convertirse en abono en las mismas fincas, de modo que el camión recogería menos y la recolección costaría menos.", "vis": "", "items": [{"id": "CCT-129", "niv": 1, "cp": "cc_sistemico", "e": "¿Qué dimensiones del problema relaciona la intervención de la médica?", "f": "Situación original elaborada para este simulacro, párrafo 3", "vis": "", "o": [["A", "La ambiental y la de salud, pues las quemas contaminan el aire y aumentan las enfermedades respiratorias.", "La médica vincula la práctica de quemar basura (ambiente) con el aumento de enfermedades respiratorias (salud).", true], ["B", "La económica y la cultural, pues quemar basura es una costumbre antigua que les ahorra dinero a las familias.", "La médica no habla de costumbres ni de dinero; se refiere a consultas por enfermedades.", false], ["C", "La educativa y la laboral, pues los médicos deben capacitar a los campesinos sobre basuras.", "La médica no propone capacitaciones ni habla de trabajo.", false], ["D", "La política y la jurídica, pues las quemas violan el acuerdo aprobado por el concejo.", "La médica no menciona normas ni decisiones del concejo.", false]]}, {"id": "CCT-130", "niv": 2, "cp": "cc_sistemico", "e": "Según el tesorero, ¿qué efecto no buscado podría tener la forma de cobro del programa?", "f": "Situación original elaborada para este simulacro, párrafo 2", "vis": "", "o": [["A", "Que la empresa de aseo suspenda la ruta rural porque las familias producen demasiados residuos.", "El tesorero no habla del volumen de residuos ni de la empresa de aseo.", false], ["B", "Que el precio del café baje en el mercado por el costo adicional de la recolección de basuras.", "No hay ninguna relación entre el cobro y el precio del café en el texto.", false], ["C", "Que aumente la morosidad y falte dinero para los insumos con que el acueducto trata el agua.", "El tesorero encadena: factura más alta, más morosidad, menos dinero para insumos de tratamiento; así, un programa de aseo podría afectar el servicio de agua.", true], ["D", "Que las familias que pagan a tiempo dejen de usar el acueducto y busquen otras fuentes de agua.", "El tesorero no plantea ese efecto; habla de la morosidad y la falta de dinero para insumos.", false]]}, {"id": "CCT-131", "niv": 2, "cp": "cc_sistemico", "e": "La propuesta del caficultor privilegia principalmente", "f": "Situación original elaborada para este simulacro, párrafo 4", "vis": "", "o": [["A", "la dimensión política, pues busca que el concejo derogue la prohibición de las quemas.", "El caficultor no pide derogar la prohibición; propone otro manejo de los residuos.", false], ["B", "las dimensiones ambiental y económica, pues aprovecha los residuos orgánicos y reduce lo que se recoge.", "Convertir pulpa y cáscaras en abono evita quemas y desechos (ambiental) y reduce lo que debe recoger el camión y, según el caficultor, el costo de la recolección (económica).", true], ["C", "la dimensión cultural, pues busca conservar la práctica tradicional de quemar en las fincas.", "Su propuesta es una alternativa a las quemas, no una forma de conservarlas.", false], ["D", "la dimensión organizativa, pues propone que cada finca reemplace a la empresa de aseo en la recolección.", "El caficultor no propone reemplazar la ruta: dice que el camión recogería menos, no que deje de pasar.", false]]}, {"id": "CCT-132", "niv": 3, "cp": "cc_sistemico", "e": "El alcalde de otro municipio quiere copiar el programa en unas veredas donde no hay acueductos comunitarios y cada familia saca agua de su propio pozo. ¿Qué parte del programa no podría aplicarse tal como fue diseñada?", "f": "Situación original elaborada para este simulacro, párrafo 1", "vis": "", "o": [["A", "La prohibición de quemar basuras, porque solo tiene sentido en los municipios cafeteros.", "Las quemas afectan el aire y la salud en cualquier zona; nada en el texto la limita a municipios cafeteros.", false], ["B", "La tarifa de $ 9.000 mensuales, porque en esas veredas no se producen residuos orgánicos.", "El texto no da información sobre los residuos de esas veredas y el monto no depende de ello.", false], ["C", "El mecanismo de cobro, porque depende de la factura de los acueductos comunitarios.", "El cobro se hace a través de la factura de los acueductos veredales; donde no existen, ese mecanismo no tiene por dónde operar.", true], ["D", "La ruta quincenal, porque las familias con pozo propio generan más basura de la que cabe en el camión.", "El texto no da ningún dato sobre la cantidad de basura en esas veredas; la ruta depende de la empresa de aseo, no del sistema de agua.", false]]}]}, {"comp": "competencias_ciudadanas", "sim": "tyt-1", "ind": "Trabajo en casa en una fábrica de autopartes", "tt": "", "texto": "Una fábrica de autopartes, ubicada en una zona industrial a las afueras de la ciudad, decidió que sus 120 empleados administrativos trabajen desde la casa tres días por semana; los 400 operarios de planta seguirán yendo todos los días. La empresa calcula que ahorrará en energía y en arriendo de oficinas, y que podrá usar el espacio liberado para ampliar la bodega.\n\nTres meses después, los dos restaurantes ubicados frente a la fábrica reportan que sus ventas de almuerzos cayeron cerca de un 25 %. Varios empleados administrativos dicen que ahorran tiempo y dinero en transporte, aunque su factura de energía en casa aumentó. Algunos supervisores de planta se quejan de que ahora es más difícil resolver con el área administrativa los problemas urgentes de los pedidos.", "vis": "", "items": [{"id": "CCT-133", "niv": 1, "cp": "cc_sistemico", "e": "¿Cuál de los siguientes efectos de la medida recae sobre actores externos a la empresa?", "f": "Situación original elaborada para este simulacro, párrafo 2", "vis": "", "o": [["A", "La caída en las ventas de almuerzos de los restaurantes ubicados frente a la fábrica.", "Los restaurantes no forman parte de la empresa y su ingreso disminuyó porque hay menos empleados en la zona los días de trabajo en casa.", true], ["B", "La dificultad para resolver con el área administrativa los problemas urgentes de pedidos.", "Afecta a los supervisores de planta, que son trabajadores de la propia empresa.", false], ["C", "La posibilidad de ampliar la bodega en el espacio que dejan libre las oficinas.", "Es un efecto sobre la propia empresa, no sobre actores externos.", false], ["D", "El aumento de la factura de energía en las casas de los empleados administrativos.", "Los empleados administrativos son parte de la empresa; es un efecto sobre actores internos.", false]]}, {"id": "CCT-134", "niv": 2, "cp": "cc_sistemico", "e": "¿Qué tensión revela la queja de los supervisores de planta?", "f": "Situación original elaborada para este simulacro, párrafos 1 y 2", "vis": "", "o": [["A", "La que existe entre los intereses de los restaurantes y los de los empleados que trabajan desd
