<script>
const DATA = [{"comp": "lectura_critica", "rol": "docente", "tag": "Lectura crítica", "texto": "Lea el siguiente fragmento de un informe elaborado por la coordinación académica:\n\n«En 2025, el 40 % de los estudiantes de grado once usó la biblioteca escolar al menos una vez por semana. Entre ellos, el puntaje promedio en la prueba de Lectura Crítica fue 8 puntos superior al de quienes no la usaron. Por lo tanto, la biblioteca mejora la comprensión lectora y se propone que, desde 2026, todos los estudiantes de once estén obligados a asistir a ella dos horas por semana.\n\nLa propuesta tiene costos: se necesitaría contratar a un auxiliar de biblioteca en la jornada de la tarde y ampliar el horario de atención. Sin embargo, los beneficios justifican la inversión.»", "items": [{"id": "LC-005", "niv": 2, "e": "La principal debilidad del razonamiento del informe es que", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: reflexionar a partir de un texto y evaluar su contenido.", "o": [["A", "usa datos de un solo año escolar, cuando debería comparar los resultados de varias instituciones.", "Más datos ayudarían, pero aunque se compararan varias instituciones persistiría el problema central: confundir asociación con causalidad.", false], ["B", "no reconoce que la propuesta implica costos para la institución y para su presupuesto.", "Es falso: el segundo párrafo reconoce expresamente los costos (auxiliar de biblioteca y ampliación del horario).", false], ["C", "infiere una relación de causa y efecto a partir de una diferencia que puede tener otras explicaciones.", "Que los usuarios de la biblioteca tengan mejores puntajes no prueba que la biblioteca los cause: quizá quienes ya leen mejor son los que más la usan. Detectar el salto de la correlación a la causalidad es evaluar la solidez de un argumento.", true]]}, {"id": "LC-006", "niv": 3, "e": "De las siguientes informaciones, la que más debilitaría la conclusión del informe es que", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: evaluar la validez de argumentos e identificar información que los fortalece o debilita.", "o": [["A", "los estudiantes que usaron la biblioteca ya tenían mejores puntajes de lectura en grado noveno.", "Si la diferencia existía antes de usar la biblioteca, es probable que los mejores lectores sean quienes más la visitan, y no que la biblioteca haya producido la mejora. Esto ataca directamente el supuesto causal del informe.", true], ["B", "el puntaje de Lectura Crítica de grado once subió en todo el país durante el año 2025.", "Un aumento nacional afectaría a ambos grupos por igual, de modo que no explica la diferencia de 8 puntos entre usuarios y no usuarios.", false], ["C", "la biblioteca escolar tiene una colección de libros más pequeña que la de otras instituciones.", "Es información sobre la biblioteca, pero no explica la diferencia de puntajes ni cuestiona la relación entre uso y resultados.", false]]}, {"id": "LC-007", "niv": 1, "e": "En el texto, la expresión «Sin embargo» introduce", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: comprender cómo se articulan las partes de un texto (conectores).", "o": [["A", "una conclusión que se deriva directamente de los datos estadísticos del primer párrafo.", "«Sin embargo» no introduce una consecuencia sino una oposición; además, la afirmación sobre los beneficios no se deriva de datos nuevos.", false], ["B", "una postura que contrapone los beneficios esperados a los costos que acaba de reconocer.", "El conector adversativo «sin embargo» presenta una idea que se opone parcialmente a la anterior: tras admitir los costos, el autor afirma que los beneficios los justifican. Identificar la función de los conectores es parte de comprender cómo se articulan las partes del texto.", true], ["C", "un ejemplo de los costos mencionados para precisar su valor y su forma de financiación.", "Después del conector no aparece ningún ejemplo ni dato sobre la financiación; aparece una valoración que se opone a la objeción de los costos.", false]]}]}, {"comp": "lectura_critica", "rol": "docente", "tag": "Lectura crítica", "texto": "Lea los siguientes textos sobre la jornada única:\n\nTexto 1. «La jornada única amplía el tiempo que los estudiantes pasan en la escuela y, con él, las oportunidades de aprender. Más horas permiten profundizar en las áreas básicas, ofrecer arte y deporte, y proteger a niños y jóvenes de los riesgos de la calle. Por eso, la meta es extenderla al mayor número posible de instituciones en los próximos años.»\n\nTexto 2. «Nadie discute que más tiempo escolar puede ser valioso. Pero el tiempo no educa por sí solo. Si las horas adicionales se llenan con más de lo mismo, en aulas sin ventilación y sin un comedor adecuado, el resultado puede ser cansancio y no aprendizaje. Antes de ampliar la jornada, conviene preguntar qué se hará con esas horas y en qué condiciones.»", "items": [{"id": "LC-117", "niv": 1, "e": "El texto 2 se diferencia del texto 1 en que", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: reflexionar a partir de un texto y evaluar su contenido (contraste de textos con perspectivas distintas).", "o": [["A", "propone extender la jornada única a más instituciones y en un plazo más corto que el texto 1.", "Es el texto 1 el que plantea extender la jornada; el texto 2 pide revisar primero las condiciones.", false], ["B", "condiciona el valor de la jornada única al uso de las horas y a las condiciones de cada institución.", "El texto 2 acepta el posible valor del tiempo adicional, pero advierte que depende de «qué se hará con esas horas y en qué condiciones». Comparar las posturas de dos textos es una tarea de lectura crítica.", true], ["C", "rechaza la jornada única, porque considera que el tiempo escolar no se relaciona con el aprendizaje.", "El texto 2 no rechaza la jornada única ni niega el valor del tiempo: afirma que «más tiempo escolar puede ser valioso».", false]]}, {"id": "LC-118", "niv": 1, "e": "En el texto 2, la expresión «más de lo mismo» se refiere a", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: identificar y entender los contenidos locales (sentido de palabras y expresiones en contexto).", "o": [["A", "aumentar el número de estudiantes por aula durante la jornada ampliada.", "La expresión no se refiere al número de estudiantes, sino al contenido de las horas adicionales.", false], ["B", "ofrecer arte y deporte, como ya lo hacen las instituciones que tienen jornada única.", "El arte y el deporte se mencionan en el texto 1 como novedades valiosas; el texto 2 no los critica.", false], ["C", "repetir en las horas adicionales las mismas prácticas, sin un propósito nuevo.", "El texto 2 advierte que, si las horas se llenan con lo de siempre, pueden producir cansancio y no aprendizaje. El sentido de la expresión se infiere del contexto.", true]]}, {"id": "LC-119", "niv": 2, "e": "Un supuesto del texto 1 que el texto 2 pone en duda es que", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: reflexionar a partir de un texto y evaluar su contenido (supuestos implícitos).", "o": [["A", "el aumento de las horas en la escuela se traduce por sí mismo en más aprendizaje.", "El texto 1 pasa de «más horas» a «más oportunidades de aprender» sin condiciones; el texto 2 responde que «el tiempo no educa por sí solo». Identificar un supuesto y quién lo cuestiona es reflexionar sobre el contenido de los textos.", true], ["B", "el arte y el deporte forman parte de una formación integral de calidad.", "El texto 2 no cuestiona el valor del arte y del deporte; su crítica se centra en el uso de las horas y en las condiciones.", false], ["C", "los niños y jóvenes enfrentan algunos riesgos cuando están en la calle.", "El texto 2 no discute los riesgos de la calle; no se pronuncia sobre ese punto.", false]]}, {"id": "LC-120", "niv": 3, "e": "Usted quiere usar ambos textos en un debate con estudiantes de grado once. Una consigna que permite confrontarlos sin favorecer a ninguno es pedir a los estudiantes que", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: reflexionar a partir de un texto y evaluar su contenido (contraste de textos con perspectivas distintas).", "o": [["A", "demuestren que las horas adicionales producen cansancio en lugar de aprendizaje.", "Da por cierta una advertencia del texto 2, que además está planteada como posibilidad («puede ser»), y orienta la discusión a su favor.", false], ["B", "expliquen por qué la jornada única protege a los jóvenes de los riesgos de la calle.", "Da por cierta una afirmación del texto 1 y orienta la discusión a su favor.", false], ["C", "definan qué condiciones harían que más horas en la escuela significaran más aprendizaje.", "La consigna recoge el punto de encuentro entre ambos textos (el tiempo puede ser valioso) y el punto de desacuerdo (si basta por sí solo), sin presuponer la respuesta. Formular preguntas que contrasten perspectivas es propio de la lectura crítica.", true]]}]}, {"comp": "lectura_critica", "rol": "docente", "tag": "Lectura crítica", "texto": "Lea el siguiente texto de divulgación científica, que usted piensa usar en una dirección de grupo con estudiantes de grado décimo:\n\n«Durante la adolescencia, el reloj biológico se desplaza: la hormona que induce el sueño empieza a liberarse más tarde en la noche. Por eso, muchos adolescentes no sienten sueño antes de las once, aunque se acuesten temprano. Si deben levantarse a las cinco para llegar al colegio, duermen bastante menos de las ocho a diez horas que suelen recomendarse para su edad.\n\nAlgunos estudios han encontrado que, cuando las clases empiezan más tarde, los estudiantes duermen más y llegan más atentos. Otros advierten que el efecto depende de que los jóvenes no aprovechen ese margen para trasnochar frente a una pantalla. En cualquier caso, culpar al adolescente de \"perezoso\" ignora que parte de su somnolencia matinal tiene una base biológica.»", "items": [{"id": "LC-121", "niv": 1, "e": "Según el texto, muchos adolescentes no sienten sueño antes de las once porque", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: identificar y entender los contenidos locales que conforman un texto.", "o": [["A", "se levantan muy temprano y suelen dormir durante la tarde.", "El texto no menciona siestas; levantarse temprano se presenta como causa de dormir poco, no de la falta de sueño en la noche.", false], ["B", "en esta etapa la hormona que induce el sueño se libera más tarde.", "El texto lo afirma y lo enlaza con «Por eso»: el desplazamiento del reloj biológico explica que no sientan sueño antes de las once.", true], ["C", "pasan demasiado tiempo frente a una pantalla antes de irse a acostar.", "El texto menciona las pantallas al hablar del efecto de cambiar el horario escolar, no como la explicación de por qué los adolescentes no sienten sueño.", false]]}, {"id": "LC-122", "niv": 2, "e": "La expresión «En cualquier caso», al inicio de la última oración, indica que", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: comprender cómo se articulan las partes de un texto (conectores y función de los párrafos).", "o": [["A", "lo que sigue es válido sin importar cuál de los estudios citados tenga razón.", "El conector introduce una conclusión que se mantiene más allá de las diferencias entre los estudios: la somnolencia matinal tiene, en parte, una base biológica. Reconocer el valor de los conectores es comprender cómo se articulan las partes del texto.", true], ["B", "todos los estudios mencionados llegaron a la misma conclusión sobre el horario.", "Al contrario: el texto presenta estudios con matices distintos («Algunos…», «Otros advierten…»).", false], ["C", "el autor va a presentar un caso particular que ejemplifica lo dicho antes.", "Después del conector no aparece un ejemplo, sino una afirmación general sobre cómo juzgar al adolescente.", false]]}, {"id": "LC-123", "niv": 3, "e": "Si un rector usara este texto para justificar que las clases empiecen más tarde, un colega podría objetar, con base en el mismo texto, que", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: reflexionar a partir de un texto y evaluar su contenido (validez de argumentos y solidez de las evidencias).", "o": [["A", "los estudios citados muestran que el horario de inicio de clases no influye en la atención de los estudiantes.", "Es falso: el texto informa que, según algunos estudios, con un horario más tarde los estudiantes «llegan más atentos».", false], ["B", "el beneficio podría perderse si los jóvenes usan el tiempo ganado para acostarse más tarde con el celular.", "El propio texto recoge esa advertencia («Otros advierten que el efecto depende…»). Usar la información de un texto para matizar una conclusión que se apoya en él es evaluar la solidez del argumento.", true], ["C", "la somnolencia de los adolescentes se explica principalmente por la pereza y no por la biología.", "Contradice el texto, que cuestiona precisamente calificar de «perezoso» al adolescente.", false]]}]}, {"comp": "lectura_critica", "rol": "docente", "tag": "Lectura crítica", "texto": "Lea la siguiente noticia publicada en la página web de una institución educativa de frontera:\n\n«Con un acto cultural, la institución celebró el cierre del proyecto \"Somos vecinos\", en el que estudiantes colombianos y venezolanos de sexto y séptimo grado investigaron las comidas, los juegos y las palabras de sus regiones. Durante cuatro meses, los grupos mixtos entrevistaron a sus familias y elaboraron un diccionario con expresiones de ambos países.\n\nSegún la coordinadora, los reportes de conflictos entre estudiantes de esos dos grados bajaron de 31 en el primer semestre a 12 en el segundo. \"El proyecto nos ayudó a convivir\", afirmó.\n\nNo todo fue sencillo. Algunos padres se opusieron al principio porque consideraban que el proyecto quitaba tiempo a las clases, y la falta de documentos de varios estudiantes retrasó su vinculación a los grupos.»", "items": [{"id": "LC-156", "niv": 1, "e": "Según la noticia, en el proyecto «Somos vecinos» los estudiantes", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: identificar y entender los contenidos locales que conforman un texto.", "o": [["A", "elaboraron un diccionario con expresiones propias de los dos países.", "La noticia lo informa de manera explícita: los grupos mixtos «elaboraron un diccionario con expresiones de ambos países».", true], ["B", "escribieron la historia de la frontera a partir de libros y archivos.", "La noticia no habla de una historia de la frontera; los estudiantes entrevistaron a sus familias.", false], ["C", "organizaron un torneo con los juegos tradicionales de ambos países.", "La noticia dice que investigaron los juegos, pero no menciona ningún torneo.", false]]}, {"id": "LC-157", "niv": 2, "e": "De la información de la noticia se puede concluir con seguridad que", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: reflexionar a partir de un texto y evaluar su contenido.", "o": [["A", "el proyecto fue la causa de que disminuyeran los conflictos entre los estudiantes.", "Es la interpretación de la coordinadora, pero la noticia no ofrece datos que descarten otras causas posibles.", false], ["B", "todos los padres de familia apoyaron el proyecto desde el comienzo.", "La noticia dice que «algunos padres se opusieron al principio».", false], ["C", "la coordinadora informó una reducción de los reportes de conflicto en sexto y séptimo.", "La noticia atribuye ese dato a la coordinadora (de 31 a 12 reportes entre el primer y el segundo semestre). Lo que no puede afirmarse con seguridad es la causa de la reducción. Distinguir lo que el texto informa de lo que se infiere es parte de la lectura crítica.", true]]}, {"id": "LC-158", "niv": 1, "e": "El párrafo que empieza con «No todo fue sencillo» cumple, en la noticia, la función de", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: comprender cómo se articulan las partes de un texto (conectores y función de los párrafos).", "o": [["A", "desmentir la información sobre la disminución de los conflictos.", "El párrafo no pone en duda las cifras de conflictos; habla de otras dificultades del proyecto.", false], ["B", "presentar las dificultades del proyecto para dar una visión más completa.", "Después de los logros, la noticia menciona la oposición inicial de algunos padres y el retraso por falta de documentos. Así equilibra la información. Reconocer la función de un párrafo es comprender la estructura del texto.", true], ["C", "explicar cuáles fueron las causas de los conflictos entre los estudiantes.", "El párrafo no se refiere a las causas de los conflictos, sino a obstáculos en la ejecución del proyecto.", false]]}, {"id": "LC-159", "niv": 3, "e": "La afirmación de que el proyecto «ayudó a convivir» sería más convincente si la noticia informara", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: reflexionar a partir de un texto y evaluar su contenido (validez de argumentos y solidez de las evidencias).", "o": [["A", "qué platos típicos de cada región presentaron los estudiantes en el acto cultural de cierre.", "Describe una actividad del cierre, pero no permite evaluar si el proyecto mejoró la convivencia.", false], ["B", "cuántas expresiones de cada país se incluyeron en el diccionario elaborado por los estudiantes.", "Es un dato sobre el producto del proyecto, pero no aporta evidencia sobre su efecto en la convivencia.", false], ["C", "cómo cambiaron en el mismo periodo los reportes de conflicto en grados que no participaron.", "Si en los grados que no participaron los conflictos se mantuvieron o aumentaron, sería más razonable atribuir la reducción al proyecto. Comparar con un grupo que no recibió la intervención es la forma de fortalecer una afirmación causal.", true]]}]}, {"comp": "lectura_critica", "rol": "docente", "tag": "Lectura crítica", "texto": "Lea el siguiente fragmento de una crónica publicada en una revista educativa:\n\n«A las cinco y media de la mañana, el motor de la lancha ya suena en el muelle. Don Efraín, que lleva once años transportando estudiantes por el río, revisa los chalecos salvavidas: son veinticuatro, y ese día suben veintiséis niños. Dos de los más grandes se ofrecen a ir sin chaleco. Don Efraín se niega. Prefiere hacer dos viajes y llegar tarde.\n\nLa escuela queda a cuarenta minutos río abajo. Cuando la marea está baja, la lancha encalla y los niños se bajan a empujarla, riéndose, con el uniforme remangado. La profesora los espera con una toalla y una olla de agua de panela. Nadie en el pueblo lo llama heroísmo. Lo llaman ir a estudiar.»", "items": [{"id": "LC-187", "niv": 1, "e": "Según la crónica, aquel día don Efraín decidió hacer dos viajes porque", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: identificar y entender los contenidos locales que conforman un texto.", "o": [["A", "había más niños que chalecos salvavidas.", "Había veinticuatro chalecos y veintiséis niños; don Efraín no aceptó que dos viajaran sin chaleco. Es información explícita.", true], ["B", "la marea estaba baja y la lancha encalló.", "El texto menciona que la lancha encalla con la marea baja, pero esa no es la razón de los dos viajes.", false], ["C", "dos de los niños llegaron tarde al muelle.", "La crónica no dice que algún niño llegara tarde; dos se ofrecieron a ir sin chaleco.", false]]}, {"id": "LC-188", "niv": 2, "e": "Las oraciones finales, «Nadie en el pueblo lo llama heroísmo. Lo llaman ir a estudiar», sugieren que", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: identificar y entender los contenidos locales (sentido de palabras y expresiones en contexto).", "o": [["A", "en esa comunidad las dificultades para llegar a la escuela hacen parte de la vida cotidiana.", "El contraste entre «heroísmo» e «ir a estudiar» muestra que lo que a un lector externo le parece extraordinario es rutina para el pueblo. Interpretar el sentido de un cierre es comprensión local con inferencia.", true], ["B", "los habitantes del pueblo no valoran el esfuerzo de don Efraín ni el de la profesora.", "No llamarlo heroísmo no significa no valorarlo; indica que se vive como algo habitual.", false], ["C", "el cronista considera exagerado hablar de dificultades en el transporte escolar del pueblo.", "El cronista describe con detalle las dificultades; el cierre no las niega, sino que muestra cómo las vive la comunidad.", false]]}, {"id": "LC-189", "niv": 3, "e": "Con el detalle de los niños que empujan la lancha «riéndose», el cronista", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: comprender cómo se articulan las partes de un texto literario (sentidos implícitos y recursos narrativos).", "o": [["A", "demuestra que el transporte por el río no representa ninguna dificultad para los niños.", "La crónica describe dificultades reales (madrugar, encallar, empujar); el detalle no las niega.", false], ["B", "matiza la dureza de la escena al mostrar cómo la viven los propios niños.", "El detalle evita una mirada únicamente dramática: la situación es difícil, pero los niños la asumen con alegría. Reconocer el efecto de un detalle sobre el sentido del texto es una tarea de lectura crítica.", true], ["C", "critica que los estudiantes no tomen en serio los riesgos del transporte por el río.", "El texto no juzga a los niños; además, muestra el cuidado con la seguridad (los chalecos).", false]]}, {"id": "LC-190", "niv": 3, "e": "Un lector afirma que la crónica denuncia la falta de inversión estatal en transporte escolar. Esta lectura", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: reflexionar a partir de un texto y evaluar su contenido.", "o": [["A", "es la única posible, porque el texto exige de manera explícita más recursos para el transporte.", "El texto no formula ninguna exigencia explícita; narra hechos sin reclamar recursos.", false], ["B", "contradice el texto, porque este afirma que el transporte escolar del pueblo funciona sin problemas.", "El texto no afirma eso: narra que faltan chalecos y que la lancha encalla.", false], ["C", "atribuye al texto una intención que no expresa, aunque los hechos narrados podrían apoyar esa denuncia.", "La crónica muestra carencias (chalecos insuficientes, una lancha que encalla), pero no reclama ni señala responsables. Distinguir lo que el texto dice de lo que un lector le atribuye es reflexionar críticamente sobre él.", true]]}]}, {"comp": "razonamiento_cuantitativo", "rol": "docente", "tag": "Razonamiento cuantitativo", "texto": "Usted analiza los resultados de una prueba diagnóstica de matemáticas aplicada a sus dos grupos de noveno. En 9A, 30 estudiantes presentaron la prueba y obtuvieron un promedio de 62 puntos. En 9B, 20 estudiantes la presentaron y obtuvieron un promedio de 72 puntos. El puntaje máximo de la prueba es 100. Al revisar las hojas de respuesta, usted descubre que en 9A una pregunta de 5 puntos fue mal calificada a todos los estudiantes: nadie la tenía bien y debía otorgarse a 12 de ellos.", "items": [{"id": "RC-005", "niv": 2, "e": "Antes de corregir el error, el promedio de los 50 estudiantes de noveno es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: estadística descriptiva, promedio ponderado.", "o": [["A", "64 puntos.", "No corresponde a ningún cálculo válido con los datos; resulta, por ejemplo, de dar a 9B un peso menor del que tiene. El promedio ponderado correcto es (30 × 62 + 20 × 72) ÷ 50 = 66.", false], ["B", "66 puntos.", "Como los grupos tienen tamaños distintos, se usa el promedio ponderado: (30 × 62 + 20 × 72) ÷ 50 = (1.860 + 1.440) ÷ 50 = 3.300 ÷ 50 = 66 puntos.", true], ["C", "67 puntos.", "Resulta de promediar los dos promedios ((62 + 72) ÷ 2 = 67) sin tener en cuenta que 9A tiene más estudiantes que 9B, error frecuente al combinar promedios de grupos de distinto tamaño.", false]]}, {"id": "RC-006", "niv": 2, "e": "Después de otorgar los 5 puntos a los 12 estudiantes de 9A, el nuevo promedio de ese grupo es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo: efecto de cambios en los datos sobre el promedio.", "o": [["A", "62 puntos.", "Supone que el promedio no cambia. Al sumar 12 × 5 = 60 puntos al total del grupo, el promedio aumenta 60 ÷ 30 = 2 puntos.", false], ["B", "64 puntos.", "El total de 9A era 30 × 62 = 1.860. Se suman 12 × 5 = 60 puntos: 1.920. El nuevo promedio es 1.920 ÷ 30 = 64 puntos.", true], ["C", "67 puntos.", "Resulta de sumar los 5 puntos al promedio como si todos los estudiantes los hubieran recibido. Solo 12 de 30 los reciben, por lo que el aumento es de 2 puntos.", false]]}, {"id": "RC-007", "niv": 3, "e": "Con los puntajes corregidos, al comparar los dos grupos en el consejo académico usted afirma correctamente que", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo: diferencias absolutas y relativas; interpretación de porcentajes.", "o": [["A", "9B supera a 9A en 8 puntos de promedio, es decir, en el 8 % del puntaje máximo de la prueba.", "Con la corrección, 9A queda en 64 y 9B en 72: la diferencia es 8 puntos. Como el puntaje máximo es 100, 8 puntos equivalen al 8 % de ese máximo.", true], ["B", "9B supera a 9A en 10 puntos de promedio, porque la corrección afecta a solo 12 estudiantes.", "Usa el promedio de 9A sin corregir (62). La corrección sí cambia el promedio del grupo completo, que pasa a 64, así que la diferencia es 8 puntos.", false], ["C", "9B supera a 9A en un 8 %, porque su promedio es 8 puntos mayor que el de 9A.", "Confunde diferencia absoluta con diferencia relativa: 72 es 12,5 % mayor que 64 (8 ÷ 64). Los 8 puntos equivalen al 8 % del puntaje máximo, no a un 8 % más que 9A.", false]]}]}, {"comp": "razonamiento_cuantitativo", "rol": "docente", "tag": "Razonamiento cuantitativo", "texto": "Usted revisa las notas finales de estadística de los 10 estudiantes de un grupo de grado décimo de una institución técnica, en escala de 1,0 a 5,0. Las notas son, en orden de lista: Ana 3,9; Bruno 3,5; Carla 4,2; Diego 1,0; Elena 3,0; Fabián 4,3; Gina 3,5; Hugo 2,5; Iris 4,1 y Juan 4,0. Según el sistema institucional de evaluación, un estudiante reprueba cuando su nota es inferior a 3,0.", "items": [{"id": "RC-109", "niv": 1, "e": "El porcentaje de estudiantes del grupo que reprueba la asignatura es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: conteo y frecuencias relativas.", "o": [["A", "2 %.", "Toma el número de estudiantes que reprueban (2) como si fuera el porcentaje, sin dividir entre los 10 estudiantes del grupo.", false], ["B", "10 %.", "Cuenta solo la nota más baja (1,0) y olvida que la nota de Hugo (2,5) también es inferior a 3,0.", false], ["C", "20 %.", "Las notas inferiores a 3,0 son 1,0 y 2,5: 2 de 10 estudiantes, es decir, 2 ÷ 10 = 20 %.", true]]}, {"id": "RC-110", "niv": 2, "e": "La mediana de las notas del grupo es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: medidas de tendencia central: mediana.", "o": [["A", "3,50.", "Es la moda (el valor que más se repite) o el quinto dato ordenado; con 10 datos la mediana es el promedio del quinto y el sexto datos ordenados.", false], ["B", "3,65.", "Promedia el quinto y el sexto datos en el orden de lista (3,0 y 4,3) sin ordenarlos antes de menor a mayor, paso indispensable para hallar la mediana.", false], ["C", "3,70.", "Ordenadas: 1,0; 2,5; 3,0; 3,5; 3,5; 3,9; 4,0; 4,1; 4,2; 4,3. Con 10 datos, la mediana es el promedio del quinto y el sexto: (3,5 + 3,9) ÷ 2 = 3,7.", true]]}, {"id": "RC-111", "niv": 2, "e": "La media aritmética de las notas del grupo es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: medidas de tendencia central: media aritmética.", "o": [["A", "3,40.", "La suma de las 10 notas es 34,0 y 34,0 ÷ 10 = 3,4.", true], ["B", "3,67.", "Excluye la nota 1,0 por considerarla atípica y divide 33,0 entre 9; la media del grupo debe incluir todos los datos.", false], ["C", "3,70.", "Corresponde a la mediana, no a la media aritmética; confunde las dos medidas de tendencia central.", false]]}, {"id": "RC-112", "niv": 3, "e": "Si Diego presenta una actividad de recuperación y su nota cambia de 1,0 a 2,0, respecto a las medidas del grupo es correcto afirmar que", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: efecto de los cambios en los datos sobre las medidas de tendencia central.", "o": [["A", "la media aumenta 1,0 y la mediana y la moda no cambian.", "Suma el aumento completo de un estudiante a la media del grupo; el aumento de 1,0 se reparte entre los 10 datos, por lo que la media sube solo 0,1.", false], ["B", "la media, la mediana y la moda aumentan 0,1.", "Supone que todas las medidas reaccionan igual a un cambio en un dato. La mediana depende de los datos centrales y la moda del valor más frecuente; ninguno de ellos cambia.", false], ["C", "la media aumenta 0,1 y la mediana y la moda no cambian.", "La suma aumenta 1,0, así que la media sube 1,0 ÷ 10 = 0,1 (de 3,4 a 3,5). El dato sigue siendo el menor, por lo que el quinto y sexto datos ordenados no cambian (mediana 3,7), y 3,5 sigue siendo el valor más repetido.", true]]}]}, {"comp": "razonamiento_cuantitativo", "rol": "docente", "tag": "Razonamiento cuantitativo", "texto": "El consejo de estudiantes organiza una rifa para financiar el periódico escolar. Se imprimen 300 boletas numeradas del 001 al 300, cada una a $5.000. El premio, una tableta, cuesta $600.000. El ganador se definirá con una balota que extrae al azar uno de los 300 números, y todos los números tienen la misma probabilidad de salir, se hayan vendido o no. Usted es el docente asesor del consejo.", "items": [{"id": "RC-133", "niv": 1, "e": "Si una familia compra 6 boletas, la probabilidad de que gane la tableta es", "f": "MEN (2006). Estándares Básicos de Competencias en Matemáticas: pensamiento aleatorio; probabilidad clásica.", "o": [["A", "0,3 %.", "Corresponde a la probabilidad de ganar con una sola boleta (1 ÷ 300 ≈ 0,33 %); la familia tiene 6 de los 300 números.", false], ["B", "2 %.", "Hay 6 casos favorables entre 300 posibles: 6 ÷ 300 = 0,02 = 2 %.", true], ["C", "6 %.", "Divide 6 entre 100, como si hubiera 100 boletas; el total de casos posibles es 300.", false]]}, {"id": "RC-134", "niv": 2, "e": "La probabilidad de que el número ganador termine en 7 es", "f": "MEN (2006). Estándares Básicos de Competencias en Matemáticas: pensamiento aleatorio; conteo de casos favorables.", "o": [["A", "3,3 %.", "Cuenta solo los números del 001 al 100 que terminan en 7 (10 números) y los divide entre 300; en cada centena hay 10 números terminados en 7.", false], ["B", "10 %.", "Del 001 al 300 terminan en 7 los números 007, 017, …, 297: 10 por cada centena, es decir, 30. La probabilidad es 30 ÷ 300 = 10 %.", true], ["C", "30 %.", "Cuenta correctamente 30 casos favorables, pero los expresa como porcentaje sin dividir entre los 300 casos posibles.", false]]}, {"id": "RC-135", "niv": 3, "e": "Si se decide rifar dos premios con dos balotas sucesivas, sin devolver el primer número extraído, la probabilidad de que una familia con 6 boletas gane ambos premios es de 1 entre", "f": "MEN (2006). Estándares Básicos de Competencias en Matemáticas: pensamiento aleatorio; probabilidad de eventos sucesivos sin reposición.", "o": [["A", "50.", "Es la probabilidad de ganar uno de los premios (6 ÷ 300 = 1/50); ganar ambos exige que ocurran dos eventos sucesivos.", false], ["B", "2.500.", "Multiplica 6/300 × 6/300 como si el primer número se devolviera; sin reposición, en la segunda extracción la familia tiene 5 números entre 299.", false], ["C", "2.990.", "Primera balota: 6/300. Si gana, le quedan 5 números entre 299: 5/299. La probabilidad es (6 × 5) ÷ (300 × 299) = 30 ÷ 89.700 = 1/2.990.", true]]}, {"id": "RC-136", "niv": 1, "e": "Si se vende el 80 % de las boletas, la ganancia de la rifa para el periódico escolar es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: porcentajes y diferencia entre ingreso y ganancia.", "o": [["A", "$600.000.", "Se venden 0,8 × 300 = 240 boletas, que recaudan 240 × 5.000 = $1.200.000. Descontando el premio: 1.200.000 − 600.000 = $600.000.", true], ["B", "$900.000.", "Supone que se venden las 300 boletas (1.500.000 − 600.000); el caso indica que se vende el 80 %.", false], ["C", "$1.200.000.", "Es el dinero recaudado, no la ganancia; olvida descontar los $600.000 que cuesta la tableta.", false]]}]}, {"comp": "razonamiento_cuantitativo", "rol": "docente", "tag": "Razonamiento cuantitativo", "texto": "La institución adecuará sus espacios para estudiantes con discapacidad y mejorará las zonas verdes. Se construirá una rampa para salvar un desnivel de 60 cm entre el patio y la biblioteca; el comité adoptó como criterio de diseño una pendiente máxima del 8 % (desnivel dividido entre la longitud horizontal). Además, se cercará y empradizará una zona verde circular de 6 m de diámetro. Para los cálculos use π = 3,14. Usted forma parte del comité de infraestructura.", "items": [{"id": "RC-163", "niv": 1, "e": "La longitud de cerca necesaria para rodear la zona verde es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: longitud de la circunferencia.", "o": [["A", "18,84 m.", "La longitud de la circunferencia es π × d = 3,14 × 6 = 18,84 m.", true], ["B", "28,26 m.", "Corresponde al área del círculo (π × 3² = 28,26 m²), no a la longitud de su contorno.", false], ["C", "37,68 m.", "Usa el diámetro como si fuera el radio en la fórmula 2πr (2 × 3,14 × 6).", false]]}, {"id": "RC-164", "niv": 2, "e": "El área de la zona verde que se debe empradizar es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: área del círculo.", "o": [["A", "9,42 m².", "Multiplica π por el radio (3,14 × 3) sin elevarlo al cuadrado.", false], ["B", "18,84 m².", "Calcula π × d, que es la longitud de la circunferencia, no el área del círculo.", false], ["C", "28,26 m².", "El radio es 6 ÷ 2 = 3 m y el área es π × r² = 3,14 × 9 = 28,26 m².", true]]}, {"id": "RC-165", "niv": 2, "e": "Para cumplir el criterio de pendiente, la longitud horizontal mínima de la rampa es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: razones, pendiente y conversión de unidades.", "o": [["A", "4,8 m.", "Multiplica el desnivel por 8 (0,6 × 8) en lugar de dividirlo entre 0,08.", false], ["B", "7,5 m.", "Pendiente = desnivel ÷ longitud horizontal. Con pendiente máxima 0,08: longitud ≥ 0,6 ÷ 0,08 = 7,5 m.", true], ["C", "75 m.", "Convierte mal el porcentaje a decimal: toma 8 % como 0,008 (0,6 ÷ 0,008 = 75). El 8 % equivale a 0,08.", false]]}, {"id": "RC-166", "niv": 3, "e": "Si la rampa se construye con la longitud horizontal mínima, la longitud de su superficie inclinada, aproximada a centésimas, es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: teorema de Pitágoras en situaciones reales.", "o": [["A", "7,48 m.", "Resta los cuadrados en el teorema de Pitágoras (√(7,5² − 0,6²)); la superficie inclinada es la hipotenusa, así que los cuadrados de los catetos se suman.", false], ["B", "7,50 m.", "Toma la longitud horizontal como si fuera la longitud inclinada; la superficie de la rampa es la hipotenusa y es mayor que el cateto horizontal.", false], ["C", "7,52 m.", "Por el teorema de Pitágoras: √(7,5² + 0,6²) = √(56,25 + 0,36) = √56,61 ≈ 7,52 m.", true]]}]}, {"comp": "razonamiento_cuantitativo", "rol": "docente", "tag": "Razonamiento cuantitativo", "texto": "Usted es el único docente de una escuela rural multigrado con 30 estudiantes: 4 de preescolar, 6 de primero, 5 de segundo, 7 de tercero, 3 de cuarto y 5 de quinto. Al iniciar el año recibe materiales y aplica una prueba de lectura. Los cuadernos llegan en paquetes de 12 unidades y no se abren paquetes de otras escuelas.", "items": [{"id": "RC-167", "niv": 1, "e": "El porcentaje de estudiantes de la escuela que cursa tercero es aproximadamente", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: porcentajes y frecuencias relativas.", "o": [["A", "7 %.", "Toma el número de estudiantes de tercero (7) como si fuera el porcentaje, sin dividir entre el total de 30.", false], ["B", "16,7 %.", "Supone que cada uno de los 6 grados tiene la misma proporción de estudiantes (1/6); los grados tienen tamaños distintos.", false], ["C", "23,3 %.", "Tercero tiene 7 de los 30 estudiantes: 7 ÷ 30 ≈ 0,233, es decir, cerca del 23,3 %.", true]]}, {"id": "RC-168", "niv": 2, "e": "Si cada estudiante de primero a quinto debe recibir 3 cuadernos y preescolar no usa cuadernos, el número mínimo de paquetes que usted debe solicitar es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: operaciones en contexto y redondeo por exceso.", "o": [["A", "6 paquetes.", "Trunca el cociente 78 ÷ 12 = 6,5; con 6 paquetes solo hay 72 cuadernos y faltarían 6.", false], ["B", "7 paquetes.", "De primero a quinto hay 6 + 5 + 7 + 3 + 5 = 26 estudiantes, que necesitan 26 × 3 = 78 cuadernos. 78 ÷ 12 = 6,5, así que se requieren 7 paquetes.", true], ["C", "8 paquetes.", "Incluye a los 4 estudiantes de preescolar (30 × 3 = 90 cuadernos; 90 ÷ 12 = 7,5 → 8), aunque ese nivel no usa cuadernos.", false]]}, {"id": "RC-169", "niv": 3, "e": "En la prueba de lectura, los 18 estudiantes de primero a tercero obtuvieron un promedio de 60 puntos y los 8 de cuarto y quinto, un promedio de 75. Para que el promedio de los 26 estudiantes llegue a 66 en la siguiente aplicación, si el promedio de primero a tercero se mantiene en 60, el promedio de cuarto y quinto debe ser", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: promedio ponderado y planteamiento de ecuaciones.", "o": [["A", "72 puntos.", "Razona como si los dos grupos tuvieran el mismo tamaño (el promedio de 60 y 72 es 66); con 18 y 8 estudiantes, el grupo pequeño debe compensar más.", false], ["B", "75 puntos.", "Supone que basta con mantener el resultado actual; con 75 el promedio general es (1.080 + 600) ÷ 26 ≈ 64,6, que no llega a 66.", false], ["C", "79,5 puntos.", "El total requerido es 66 × 26 = 1.716 puntos. Primero a tercero aportan 18 × 60 = 1.080, así que cuarto y quinto deben aportar 636: 636 ÷ 8 = 79,5.", true]]}]}, {"comp": "competencias_blandas", "rol": "docente", "tag": "Competencias blandas y ciudadanas · Competencias ciudadanas y ética", "texto": "En la elección de personero estudiantil, uno de los candidatos de grado once promete a los estudiantes de sexto que, si gana, conseguirá que se elimine el uniforme de educación física. Varios docentes comentan en la sala de profesores que es una promesa imposible de cumplir y que el candidato «solo busca votos». Usted es el docente del área de ciencias sociales y está a cargo del proceso de elección.", "items": [{"id": "CB-001", "niv": 1, "e": "Frente a la promesa del candidato, una actuación coherente con la formación en competencias ciudadanas es", "f": "Ley 1620 de 2013, art. 2 (competencias ciudadanas); Ley 115 de 1994, art. 94 (personero de los estudiantes).", "o": [["A", "organizar un debate en el que los candidatos expliquen cómo cumplirían sus propuestas y cuál es el alcance real del cargo.", "Las competencias ciudadanas buscan que los estudiantes actúen de manera constructiva en una sociedad democrática (Ley 1620 de 2013, art. 2). Un debate permite que los votantes evalúen las propuestas y que todos comprendan las funciones del personero, sin censurar a nadie.", true], ["B", "explicar en privado a los estudiantes de sexto que la propuesta es imposible y que no deberían votar por ese candidato.", "El docente no debe orientar el voto hacia o en contra de un candidato; además, la conversación privada no fortalece la deliberación de toda la comunidad estudiantil.", false], ["C", "retirar la propuesta del tarjetón, porque induce a error a los estudiantes más pequeños del colegio.", "Censurar una propuesta desde la autoridad docente limita la participación y desaprovecha la oportunidad formativa; la respuesta democrática es el análisis público de las propuestas.", false]]}, {"id": "CB-002", "niv": 1, "e": "Para que los estudiantes valoren el alcance real de la propuesta, usted les explica que la función del personero es", "f": "Ley 115 de 1994, artículos 94 y 143.", "o": [["A", "promover el cumplimiento de los derechos y deberes de los estudiantes y presentar solicitudes ante el rector.", "El artículo 94 de la Ley 115 de 1994 establece que el personero promueve el cumplimiento de los derechos y deberes de los estudiantes y presenta ante el rector las solicitudes necesarias para protegerlos.", true], ["B", "representar a los estudiantes en el consejo directivo y votar las decisiones sobre el manual de convivencia.", "Confunde al personero con el representante de los estudiantes ante el consejo directivo (Ley 115, art. 143). Son figuras distintas.", false], ["C", "decidir en última instancia los reclamos de los estudiantes sobre normas como el uso del uniforme.", "Según el parágrafo del artículo 94 de la Ley 115, las solicitudes del personero las resuelve en última instancia el consejo directivo, no el personero.", false]]}, {"id": "CB-003", "niv": 2, "e": "En la sala de profesores, ante el comentario de que el candidato «solo busca votos», la postura más profesional de su parte es", "f": "MEN (2008). Guía 31, Anexo 1: Glosario de competencias (Compromiso social e institucional; Trabajo en equipo).", "o": [["A", "proponer que el área acompañe a todos los candidatos para que formulen propuestas viables.", "Transforma la crítica en una acción pedagógica igual para todos los candidatos, lo que refleja compromiso social e institucional y respeto por los estudiantes (Guía 31).", true], ["B", "estar de acuerdo con sus colegas, pero no intervenir en el proceso para no afectar la elección.", "Como responsable del proceso, no intervenir significa renunciar a su función formativa; además, compartir el juicio sobre el estudiante sin contrastarlo no es imparcial.", false], ["C", "pedir a sus colegas que no opinen sobre los candidatos, porque el proceso electoral es su responsabilidad.", "Cerrar la conversación a los colegas no aporta soluciones y no favorece el trabajo en equipo; la elección es un proceso de toda la comunidad educativa.", false]]}]}, {"comp": "competencias_blandas", "rol": "docente", "tag": "Competencias blandas y ciudadanas · Ética en el servicio público (Ley 1952 de 2019; Código de Integridad)", "texto": "Usted es director de grupo de noveno en un colegio oficial. Faltan dos semanas para la comisión de evaluación y promoción, que analizará el caso de Andrés, quien tiene dos áreas con desempeño bajo, una de ellas la suya. La madre de Andrés, agradecida por el acompañamiento que usted le ha dado a su hijo, llega a la sala de profesores con una ancheta y una tarjeta que dice «gracias por ayudar a que Andrés pase». Ese mismo día, una familia propone en el chat de padres del grupo hacer una colecta para regalarle a usted un bono por el Día del Maestro.", "items": [{"id": "CB-109", "niv": 1, "e": "Frente a la ancheta que le ofrece la madre de Andrés, la actuación más adecuada es", "f": "Función Pública (2017). Código de Integridad del Servicio Público (honestidad); Ley 1952 de 2019, art. 38, num. 7.", "o": [["A", "recibirla y compartirla con los demás docentes de la sala, para que no sea un beneficio personal.", "Repartir el regalo no cambia que proviene de una familia interesada en una decisión pendiente; el problema no es quién lo disfruta sino el momento y el interés de quien lo ofrece.", false], ["B", "agradecerle el gesto y no recibirla, explicándole con amabilidad que la decisión sobre Andrés está pendiente.", "El regalo llega dos semanas antes de la comisión que decidirá sobre Andrés, y la tarjeta lo vincula expresamente con que «pase». El Código de Integridad (honestidad) orienta a no aceptar incentivos ni beneficios de personas interesadas en un proceso de decisión, y la madre tiene interés directo en la decisión de promoción en la que usted participa.", true], ["C", "recibirla para no ofenderla y aclararle que eso no influirá en la valoración de su hijo.", "Cuidar la relación con la familia es valioso, pero recibir un regalo que la tarjeta asocia con la promoción, justo antes de la comisión, compromete la imparcialidad aunque usted aclare que no influirá.", false]]}, {"id": "CB-110", "niv": 2, "e": "Días después, la madre de Andrés le escribe a su celular personal a las diez de la noche para pedirle que «le dé una ayudita» a su hijo en la comisión. Usted", "f": "Ley 1952 de 2019, art. 38, num. 7; Función Pública (2017). Código de Integridad del Servicio Público (honestidad); MEN (2008). Guía 31, Anexo 1: Glosario de competencias (comunicación y relaciones interpersonales).", "o": [["A", "la llama esa misma noche para conversar con calma, entender su angustia y ver juntos qué se puede hacer por Andrés.", "Muestra cercanía, pero valida el uso del canal personal fuera del horario y deja abierta la expectativa de que el resultado puede negociarse en una conversación privada.", false], ["B", "le responde al día siguiente, por el canal institucional, que la decisión se tomará con los criterios del sistema de evaluación.", "Responder por el canal institucional y dejar claro que no habrá tratos especiales protege la imparcialidad (Ley 1952 de 2019, art. 38, num. 7; Código de Integridad, honestidad: no dar trato preferencial). Fijar el límite de forma cortés también cuida la relación con la familia (Guía 31, comunicación).", true], ["C", "no responde el mensaje, para no comprometerse por escrito con una solicitud que no puede atender.", "Evita comprometerse, pero el silencio deja la solicitud sin una respuesta clara y no le explica a la madre cómo se tomará la decisión.", false]]}, {"id": "CB-111", "niv": 3, "e": "Sobre la colecta que proponen en el chat las familias de los estudiantes a quienes usted califica, lo más coherente con la ética del servicio público es", "f": "Ley 1952 de 2019, art. 38, num. 9; Función Pública (2017). Código de Integridad del Servicio Público (honestidad).", "o": [["A", "agradecer la intención y sugerir que el reconocimiento sea un mensaje o una actividad, sin aportes en dinero.", "El servidor público desempeña su cargo sin obtener ni pretender beneficios adicionales a sus contraprestaciones legales (Ley 1952 de 2019, art. 38, num. 9). Como son familias cuyos hijos usted califica, una colecta en el chat del grupo presiona a quienes no quieren o no pueden aportar, que quedan en evidencia ante los demás; un reconocimiento no económico evita esa presión.", true], ["B", "permitir la colecta siempre que el aporte sea voluntario y de monto pequeño, para no presionar a las familias.", "La voluntariedad y el monto bajo reducen la presión, pero no eliminan que usted reciba un beneficio económico de familias a cuyos hijos evalúa; en un chat de grupo, además, quienes no aportan quedan expuestos.", false], ["C", "permitir la colecta y destinar el bono a materiales para el salón, de modo que beneficie a todo el grupo.", "El destino colectivo parece resolver el problema, pero sigue tratándose de aportes económicos de las familias promovidos por el reconocimiento al docente, con la misma presión sobre quienes no pueden o no quieren aportar.", false]]}, {"id": "CB-112", "niv": 2, "e": "En la comisión de evaluación y promoción, al analizar el caso de Andrés, usted", "f": "Decreto 1290 de 2009, arts. 4 y 6; Ley 1952 de 2019, arts. 38 y 44.", "o": [["A", "pide a la comisión tener en cuenta el compromiso demostrado por la familia de Andrés durante el año.", "Reconocer a la familia es positivo, pero su compromiso no es un criterio de promoción del estudiante; introducirlo rompe la igualdad de criterios frente a los demás casos.", false], ["B", "se abstiene de participar en la discusión, porque la madre intentó darle un regalo y eso lo inhabilita.", "La prudencia es comprensible, pero usted rechazó el regalo y no tiene un interés particular y directo en la decisión (Ley 1952, art. 44); apartarse priva a la comisión de la información de quien conoce el proceso.", false], ["C", "aporta las evidencias del proceso y de los apoyos brindados, para que se decida con los criterios de todos.", "La promoción se decide con los criterios definidos en el sistema institucional de evaluación (Decreto 1290 de 2009, arts. 4 y 6). Aportar evidencias y aplicar los mismos criterios a todos garantiza imparcialidad (Ley 1952 de 2019, art. 38, num. 7).", true]]}]}, {"comp": "competencias_blandas", "rol": "docente", "tag": "Competencias blandas y ciudadanas · Relación con las familias (Guía 31)", "texto": "Usted es docente de matemáticas de décimo. A la hora del descanso, el padre de Felipe llega sin cita, alterado, y frente a varios estudiantes le reclama en voz alta por la nota de 2,8 que obtuvo su hijo en el periodo. Afirma que usted «la tiene montada» con Felipe y amenaza con «ir a la secretaría de educación». Usted tiene registradas las evaluaciones y las actividades de apoyo que Felipe no presentó.", "items": [{"id": "CB-142", "niv": 1, "e": "Si el padre sigue gritando y lo insulta frente a los estudiantes, la actuación más adecuada es", "f": "MEN (2008). Guía 31, Anexo 1: Glosario de competencias (comunicación y relaciones interpersonales).", "o": [["A", "indicarle con calma y firmeza que no seguirá la conversación mientras haya gritos y ofrecerle una cita ese mismo día.", "Poner un límite claro sin agredir, manejando las propias emociones, protege a los estudiantes de presenciar el conflicto; ofrecer una cita cercana mantiene abierta la comunicación con la familia (Guía 31, comunicación y relaciones interpersonales).", true], ["B", "explicarle allí mismo los criterios de la nota, para demostrarle que la calificación de su hijo es justa.", "Dar explicaciones es necesario, pero hacerlo frente a los estudiantes y con el padre alterado expone el caso de Felipe y difícilmente logra una conversación productiva.", false], ["C", "escucharlo allí mismo hasta que se desahogue, para demostrarle su disposición al diálogo y calmar la situación.", "La escucha suele calmar, pero tolerar insultos frente a los estudiantes no es diálogo: valida la agresión y expone el caso de Felipe ante otros.", false]]}, {"id": "CB-143", "niv": 2, "e": "En la reunión con el padre, para responder a su reclamo por la nota, usted", "f": "Decreto 1290 de 2009, arts. 4 y 14.", "o": [["A", "le sugiere presentar la queja ante la secretaría de educación, ya que él manifestó esa intención.", "Respeta la intención del padre, pero omite las instancias institucionales de reclamación, que son el primer conducto previsto.", false], ["B", "le muestra las evidencias del proceso de Felipe y le explica las instancias de reclamación del sistema de evaluación.", "El sistema institucional de evaluación debe contener las instancias, procedimientos y mecanismos de atención y resolución de reclamaciones de padres y estudiantes (Decreto 1290 de 2009, art. 4), y los padres tienen derecho a recibir información clara sobre el proceso (art. 14).", true], ["C", "le ofrece revisar la nota si Felipe presenta un trabajo adicional, para cerrar el conflicto de manera rápida y amistosa.", "Busca una salida conciliadora, pero crea una oportunidad por fuera de los criterios del sistema de evaluación que no se ofrece a los demás estudiantes.", false]]}, {"id": "CB-144", "niv": 3, "e": "Ante la afirmación de que usted «la tiene montada» con Felipe, usted", "f": "Función Pública (2017). Código de Integridad del Servicio Público (honestidad); MEN (2008). Guía 31, Anexo 1: Glosario de competencias (comunicación y relaciones interpersonales).", "o": [["A", "le aclara con firmeza que trata a todos los estudiantes por igual y que no aceptará acusaciones sin pruebas.", "Defender la propia imparcialidad es legítimo, pero cerrar la conversación impide conocer la percepción del padre y del estudiante, que puede tener algún fundamento.", false], ["B", "le pide ejemplos concretos, los revisa con apertura y, si encuentra alguna situación injusta, la corrige.", "Escuchar la crítica y estar dispuesto a reconocer errores corresponde al valor de honestidad del Código de Integridad y a la competencia de comunicación y relaciones interpersonales (Guía 31). La revisión se apoya en las evidencias registradas.", true], ["C", "propone que otro docente evalúe a Felipe por el resto del año, para eliminar cualquier duda sobre su imparcialidad.", "Busca transparencia, pero acepta la acusación sin examinarla y traslada a otro docente una responsabilidad propia del área.", false]]}]}, {"comp": "competencias_blandas", "rol": "docente", "tag": "Competencias blandas y ciudadanas · Competencias ciudadanas: convivencia y paz (Guía 6)", "texto": "En un recreo de sexto grado, Camila y Luisa discuten porque Luisa les contó a otras compañeras un secreto de Camila. Se gritan e insultan, sin llegar a agredirse físicamente ni a causarse daño. Es la primera vez que tienen un conflicto y ninguna tiene antecedentes. Usted es el docente que acompaña el recreo. La institución cuenta con estudiantes mediadores formados por la orientadora, y el manual de convivencia prevé su participación.", "items": [{"id": "CB-149", "niv": 1, "e": "Según el protocolo para este tipo de situación, usted", "f": "Decreto 1965 de 2013, arts. 40 y 42.", "o": [["A", "reúne a las dos estudiantes para que expongan sus puntos de vista y busquen una solución, de la que deja constancia.", "Es una situación esporádica sin daño al cuerpo ni a la salud (situación tipo I). El protocolo indica reunir de inmediato a las partes, mediar pedagógicamente para que expongan sus puntos de vista y buscar una solución de la que se deja constancia (Decreto 1965 de 2013, arts. 40 y 42).", true], ["B", "informa a las familias para que ellas resuelvan el conflicto, ya que el problema se originó por un asunto personal.", "La comunicación con las familias puede ser útil, pero el conflicto ocurrió en la escuela y el protocolo asigna a la institución la mediación pedagógica.", false], ["C", "remite la situación al comité escolar de convivencia, porque hubo insultos entre las estudiantes.", "La remisión parece cuidadosa, pero los insultos esporádicos sin daño a la salud son una situación tipo I que se atiende con mediación pedagógica inmediata, sin necesidad de convocar al comité.", false]]}, {"id": "CB-150", "niv": 2, "e": "En la conversación, para ayudarlas a manejar el conflicto de forma constructiva, usted", "f": "MEN (2004). Estándares Básicos de Competencias Ciudadanas, Serie Guías n.º 6 (convivencia y paz; competencias integradoras).", "o": [["A", "determina quién inició el problema y le asigna a esa estudiante la responsabilidad de reparar el daño.", "Identificar responsabilidades es parte del proceso, pero decidir usted solo convierte la mediación en un juicio y no permite que las partes construyan el acuerdo.", false], ["B", "les pide que se disculpen mutuamente y se den la mano, para cerrar el conflicto lo antes posible y volver a clase.", "Restablecer la relación es deseable, pero una disculpa inmediata sin comprender lo ocurrido cierra el conflicto en apariencia y no desarrolla competencias para manejarlo.", false], ["C", "pide a cada una que cuente lo ocurrido sin interrupciones y diga cómo se sintió, antes de buscar soluciones.", "Manejar conflictos de manera pacífica es una competencia integradora que articula escucha activa, identificación de emociones y generación de opciones (Guía 6, convivencia y paz).", true]]}, {"id": "CB-151", "niv": 3, "e": "Sobre la participación de los estudiantes mediadores en este caso, usted tiene en cuenta que", "f": "Decreto 1965 de 2013, art. 42, parágrafo.", "o": [["A", "no pueden participar, porque las situaciones con insultos deben ser atendidas solo por adultos de la institución.", "Busca proteger a las estudiantes, pero contradice la norma, que prevé la participación de mediadores escolares en las situaciones tipo I.", false], ["B", "deben atender primero toda situación entre estudiantes, antes de que intervenga cualquier docente.", "Valora la mediación entre pares, pero la norma permite su participación, no la impone como paso obligatorio previo a la intervención docente.", false], ["C", "la norma permite que participen en el manejo de este tipo de situaciones, según lo previsto en el manual.", "El parágrafo del artículo 42 del Decreto 1965 de 2013 establece que los estudiantes formados como mediadores o conciliadores escolares pueden participar en el manejo de las situaciones tipo I, en los términos del manual de convivencia.", true]]}, {"id": "CB-152", "niv": 2, "e": "Una semana después del acuerdo, usted", "f": "Decreto 1965 de 2013, art. 42; MEN (2008). Guía 31, Anexo 1: Glosario de competencias (negociación y mediación).", "o": [["A", "da por cerrado el caso, porque las estudiantes firmaron el acuerdo y no han vuelto a discutir en público.", "La ausencia de nuevas discusiones es una buena señal, pero no reemplaza el seguimiento que exige el protocolo ni permite saber si el conflicto se resolvió.", false], ["B", "verifica con ambas estudiantes si los compromisos se están cumpliendo y si la relación ha mejorado.", "El protocolo de las situaciones tipo I incluye el seguimiento del caso y de los compromisos para verificar si la solución fue efectiva (Decreto 1965 de 2013, art. 42); la Guía 31 también resalta el seguimiento a los compromisos en la mediación.", true], ["C", "remite el caso a la orientadora para que haga seguimiento psicológico a las dos estudiantes.", "La orientación puede ser un apoyo, pero el caso no muestra necesidad de atención psicológica; el seguimiento de los compromisos corresponde a quien medió.", false]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Fines de la educación y enseñanza obligatoria (Ley 115 de 1994, arts. 5 y 14)", "texto": "En una institución de básica y media de Cartagena, el consejo académico le encarga a usted coordinar un proyecto sobre el cuidado de los manglares y el uso responsable del agua. Durante la planeación, algunos docentes proponen crear una asignatura nueva de «educación ambiental» con dos horas semanales y otra de «educación sexual», mientras otros sostienen que esos temas deben trabajarse desde todas las áreas. Un colega afirma que ninguno de los temas de enseñanza obligatoria de la Ley 115 requiere asignatura propia. Usted debe orientar la discusión con base en la norma.", "items": [{"id": "NR-111", "niv": 1, "e": "Sobre la forma de abordar la educación ambiental y la educación sexual, usted explica que la Ley 115 de 1994 dispone que estos temas", "f": "Ley 115 de 1994, artículo 14 y parágrafo 1; Decreto 1860 de 1994, artículo 36.", "o": [["A", "son obligatorios y deben incorporarse al currículo y desarrollarse a través de todo el plan de estudios.", "El parágrafo 1 del artículo 14 de la Ley 115 señala que, salvo los literales a) y b), la enseñanza obligatoria no exige asignatura específica y debe incorporarse al currículo y desarrollarse a través de todo el plan de estudios. La educación ambiental (literal c) y la sexual (literal e) están en ese caso.", true], ["B", "son optativos y cada institución decide si los incluye o no en su proyecto educativo.", "El artículo 14 los establece como de cumplimiento obligatorio en todos los establecimientos oficiales o privados que ofrezcan preescolar, básica y media; no son optativos.", false], ["C", "son obligatorios y deben dictarse como asignaturas independientes, cada una con intensidad horaria propia en el plan.", "La ley no exige asignaturas independientes para estos temas; el parágrafo 1 del artículo 14 los plantea como formación transversal, que el Decreto 1860 de 1994 (artículo 36) organiza mediante proyectos pedagógicos.", false]]}, {"id": "NR-112", "niv": 1, "e": "El proyecto de los manglares se relaciona directamente con el fin de la educación que busca", "f": "Ley 115 de 1994, artículo 5, numerales 8, 10 y 11.", "o": [["A", "la formación en la práctica del trabajo, mediante conocimientos técnicos y habilidades, como fundamento del desarrollo individual y social.", "Es el fin del numeral 11 del artículo 5; aunque el proyecto pueda incluir actividades prácticas, su propósito central es ambiental.", false], ["B", "la creación de una conciencia de soberanía nacional y de integración con Latinoamérica.", "Corresponde al numeral 8 del artículo 5, sobre soberanía nacional e integración con Latinoamérica y el Caribe; no describe el propósito del proyecto.", false], ["C", "la adquisición de una conciencia para la conservación, protección y mejoramiento del ambiente.", "El numeral 10 del artículo 5 de la Ley 115 establece como fin la adquisición de una conciencia para la conservación, protección y mejoramiento del medio ambiente, de la calidad de la vida y del uso racional de los recursos naturales.", true]]}, {"id": "NR-113", "niv": 3, "e": "Frente a la afirmación del colega, usted precisa que la Ley 115 de 1994 exceptúa de la regla de no exigir asignatura específica", "f": "Ley 115 de 1994, artículo 14, parágrafo 1.", "o": [["A", "la educación sexual y la protección del ambiente, por tratarse de temas de salud pública.", "Son justamente temas que la norma trata como transversales (literales c y e del artículo 14), sin asignatura específica.", false], ["B", "el estudio de la Constitución e instrucción cívica y lo relativo a tiempo libre, educación física y deporte.", "El parágrafo 1 del artículo 14 establece que la regla de no exigir asignatura específica aplica «salvo los numerales a) y b)»: el estudio de la Constitución y la instrucción cívica, y el aprovechamiento del tiempo libre, la educación física, la recreación y el deporte formativo.", true], ["C", "la educación para la justicia, la paz, la democracia y la solidaridad, por su carácter ciudadano.", "La educación para la justicia, la paz y la democracia (literal d) no está entre las excepciones del parágrafo 1, que comprende solo los literales a) y b).", false]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Obligaciones de las instituciones educativas (Ley 1098 de 2006, Código de la Infancia y la Adolescencia)", "texto": "Usted es docente de tercer grado en una institución oficial de un municipio pequeño del Magdalena. Durante la revisión de documentos de inicio de año, la secretaría reporta que Mateo, de 8 años, no está afiliado a ningún régimen de salud. Semanas después, Mateo llega con moretones en los brazos y le cuenta que su tío «le pega con la correa cuando se porta mal». La coordinadora opina que «eso es un asunto de la familia y del ICBF, no del colegio». En el municipio no hay defensoría de familia, pero sí comisaría de familia.", "items": [{"id": "NR-149", "niv": 1, "e": "Frente a la falta de afiliación a salud de Mateo, el Código de la Infancia y la Adolescencia establece que la institución debe", "f": "Ley 1098 de 2006, artículos 42 (numeral 1) y 44 (numeral 3).", "o": [["A", "poner en marcha mecanismos para comprobar la afiliación de los estudiantes a un régimen de salud.", "El numeral 3 del artículo 44 de la Ley 1098 de 2006 incluye entre las obligaciones complementarias de las instituciones educativas poner en marcha mecanismos para comprobar la afiliación de los estudiantes a un régimen de salud.", true], ["B", "condicionar la permanencia de Mateo a que la familia presente el certificado de afiliación.", "La norma ordena comprobar la afiliación, no excluir al estudiante. Las instituciones deben facilitar el acceso y garantizar la permanencia (artículo 42, numeral 1).", false], ["C", "abstenerse de intervenir, porque la afiliación a salud es un asunto exclusivo de la familia y de la EPS.", "El Código asigna expresamente a las instituciones educativas la obligación de comprobar la afiliación a salud; no es un asunto ajeno al colegio.", false]]}, {"id": "NR-150", "niv": 2, "e": "Una vez Mateo le cuenta lo de los golpes, según el artículo 44 del Código, la institución debe", "f": "Ley 1098 de 2006, artículo 44, numerales 2 y 9.", "o": [["A", "citar primero al tío a firmar un compromiso de buen trato y reportar solo si los golpes se repiten.", "La norma no condiciona el reporte a la reincidencia ni a un compromiso previo con el presunto agresor; hacer esperar al niño puede agravar la vulneración.", false], ["B", "reportar el maltrato a las autoridades competentes y brindar apoyo y orientación al estudiante.", "El artículo 44 de la Ley 1098 de 2006 ordena establecer la detección oportuna, el apoyo y la orientación en casos de maltrato (numeral 2) y reportar a las autoridades competentes las situaciones de abuso o maltrato detectadas (numeral 9).", true], ["C", "esperar un dictamen médico que confirme el maltrato antes de informar a cualquier autoridad.", "El deber de reportar no exige una prueba médica previa: basta la detección de la situación. Establecer los hechos corresponde a la autoridad competente.", false]]}, {"id": "NR-151", "niv": 3, "e": "Ante la opinión de la coordinadora, usted le recuerda que, según el principio de corresponsabilidad del Código,", "f": "Ley 1098 de 2006, artículos 10 y 44.", "o": [["A", "las instituciones obligadas a prestar servicios sociales no pueden invocarlo para negar la atención que requieren los derechos del niño.", "El artículo 10 de la Ley 1098 de 2006 define la corresponsabilidad como la concurrencia de la familia, la sociedad y el Estado en la atención, cuidado y protección de los niños, y aclara que las instituciones públicas o privadas obligadas a prestar servicios sociales no pueden invocar ese principio para negar la atención que demande la satisfacción de sus derechos fundamentales.", true], ["B", "la familia es la única responsable de la protección del niño mientras no exista una orden judicial que obligue al colegio a intervenir.", "El artículo 10 hace corresponsables a la familia, la sociedad y el Estado; la institución educativa tiene deberes propios de detección y reporte (artículo 44) que no dependen de una orden judicial.", false], ["C", "el colegio solo debe actuar frente a los hechos que ocurran dentro de sus instalaciones o durante las actividades escolares.", "El Código ordena detectar y reportar el maltrato sin limitarlo al espacio escolar; la violencia intrafamiliar figura de forma expresa en el numeral 2 del artículo 44.", false]]}, {"id": "NR-152", "niv": 3, "e": "Como en el municipio no hay defensoría de familia, la autoridad ante la cual se puede poner en conocimiento la situación de Mateo es", "f": "Ley 1098 de 2006, artículos 51 y 53.", "o": [["A", "el juzgado de familia más cercano, porque solo un juez puede conocer los casos de maltrato.", "El Código prevé autoridades administrativas, como las comisarías de familia, para conocer estas situaciones; no se requiere acudir exclusivamente a un juez.", false], ["B", "el comité escolar de convivencia, que es el encargado de adoptar las medidas de restablecimiento.", "El comité escolar de convivencia activa la ruta y remite, pero las medidas de restablecimiento de derechos las toma la autoridad competente (Ley 1098, artículo 53), no el comité.", false], ["C", "la comisaría de familia o, en su defecto, la inspección de policía o la personería municipal.", "El artículo 51 de la Ley 1098 de 2006 señala que las autoridades deben informar, oficiar o conducir ante la policía, las defensorías de familia, las comisarías de familia o, en su defecto, los inspectores de policía o las personerías municipales o distritales a los niños que se encuentren en condiciones de riesgo o vulnerabilidad.", true]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Obligaciones especiales y ética fundamental de las instituciones (Ley 1098 de 2006, arts. 42 y 43)", "texto": "Usted es docente de quinto grado en una institución oficial de Medellín. En su grupo hay tres estudiantes que leen con mucha dificultad y van rezagados respecto de sus compañeros. En una clase de educación física, un colega se burla en voz alta de uno de ellos y lo llama «lento» frente a todo el grupo. Además, la profesora encargada del grupo de danzas no admitió a una estudiante afrodescendiente con el argumento de que su peinado de trenzas «no combina con el vestuario».", "items": [{"id": "NR-153", "niv": 1, "e": "Frente a los tres estudiantes con dificultades de lectura, el artículo 42 del Código de la Infancia y la Adolescencia obliga a la institución a", "f": "Ley 1098 de 2006, artículo 42, numerales 1 y 6.", "o": [["A", "organizar programas de nivelación y establecer programas de orientación psicopedagógica y psicológica.", "El numeral 6 del artículo 42 de la Ley 1098 de 2006 obliga a las instituciones educativas a organizar programas de nivelación para quienes presenten dificultades de aprendizaje o estén retrasados en el ciclo escolar, y a establecer programas de orientación psicopedagógica y psicológica.", true], ["B", "remitirlos a una institución especializada, para que no afecten el ritmo de aprendizaje del resto del grupo.", "Remitirlos fuera de la institución contradice la obligación de facilitar el acceso y garantizar la permanencia (artículo 42, numeral 1) y la de organizar la nivelación en la propia institución (numeral 6).", false], ["C", "promoverlos al grado siguiente sin valoración, para evitar que queden en situación de extraedad.", "La promoción sin valoración no resuelve la dificultad; el Código exige programas de nivelación, y la promoción se rige por los criterios del sistema institucional de evaluación (Decreto 1290 de 2009).", false]]}, {"id": "NR-154", "niv": 2, "e": "Frente a la burla del colega, la obligación ética fundamental de la institución, según el Código, es", "f": "Ley 1098 de 2006, artículo 43, numeral 2.", "o": [["A", "respetar la autonomía del colega en el manejo de su clase, sin intervenir en asuntos de otra área.", "La autonomía pedagógica no ampara la humillación de un estudiante; el artículo 43 obliga a la institución a protegerlo también frente a las burlas de los profesores.", false], ["B", "proteger eficazmente al estudiante contra la humillación o la burla, también cuando proviene de los profesores.", "El numeral 2 del artículo 43 de la Ley 1098 de 2006 obliga a las instituciones a proteger eficazmente a los niños contra toda forma de maltrato, agresión física o sicológica, humillación, discriminación o burla de parte de los demás compañeros y de los profesores.", true], ["C", "enseñar al estudiante a tolerar las bromas, para fortalecer su autoestima frente al grupo.", "Trasladar la responsabilidad al estudiante desconoce que la burla de un docente es una forma de humillación frente a la cual la institución debe protegerlo (artículo 43, numeral 2).", false]]}, {"id": "NR-155", "niv": 2, "e": "Respecto de la decisión de la profesora del grupo de danzas, el Código obliga a la institución a", "f": "Ley 1098 de 2006, artículo 42, numerales 8 y 12.", "o": [["A", "aplicar el reglamento interno del grupo de danzas, si fue aprobado por sus integrantes.", "Un reglamento interno no puede establecer criterios que discriminen por etnia; prevalece la obligación del numeral 12 del artículo 42.", false], ["B", "respetar los criterios estéticos de la docente, por tratarse de una actividad extracurricular.", "El carácter extracurricular no exime de la prohibición de discriminar; el Código también obliga a estimular las manifestaciones culturales de los estudiantes (artículo 42, numeral 8).", false], ["C", "evitar cualquier conducta discriminatoria por razones de etnia o de cualquier otra condición.", "El numeral 12 del artículo 42 de la Ley 1098 de 2006 obliga a las instituciones educativas a evitar cualquier conducta discriminatoria por razones de sexo, etnia, credo, condición socioeconómica o cualquier otra que afecte el ejercicio de los derechos. Excluir a la estudiante por su peinado afecta su identidad étnica.", true]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Evaluación de desempeño, evaluación de competencias y escalafón (Decreto 1278 de 2002)", "texto": "Usted es docente regido por el Decreto 1278 de 2002, inscrito en el grado 2, nivel salarial A, desde hace cuatro años, y acaba de obtener su título de maestría en Educación. Este año su evaluación anual de desempeño fue de 58 %, la primera vez que obtiene una calificación inferior al 60 %, y no está de acuerdo con ella. Un compañero le comenta que lo van a retirar del servicio y que, gracias a la maestría, pasará de inmediato al grado 3.", "items": [{"id": "NR-176", "niv": 2, "e": "Sobre la consecuencia de la calificación de 58 %, el Decreto 1278 de 2002 establece que", "f": "Decreto 1278 de 2002, artículo 36, numeral 1.", "o": [["A", "el docente es retirado del servicio desde la primera calificación inferior al 60 %.", "La norma exige dos años consecutivos con calificación no satisfactoria; una sola evaluación inferior al 60 % no implica el retiro.", false], ["B", "el retiro procede si la calificación no satisfactoria se repite durante dos años consecutivos.", "El numeral 1 del artículo 36 del Decreto 1278 de 2002 establece que el docente que obtenga una calificación inferior al 60 % durante dos años consecutivos en la evaluación de desempeño será excluido del escalafón y retirado del servicio. Una sola calificación no satisfactoria no produce el retiro.", true], ["C", "el docente desciende de manera automática al nivel salarial inmediatamente anterior dentro de su grado.", "El Decreto 1278 no prevé descensos de nivel salarial por la evaluación de desempeño; la consecuencia prevista es el retiro si la calificación inferior al 60 % se repite dos años consecutivos.", false]]}, {"id": "NR-177", "niv": 2, "e": "Si usted quisiera pasar del nivel salarial A al B dentro del grado 2, el Decreto 1278 de 2002 exige", "f": "Decreto 1278 de 2002, artículos 20, 21 y 36.", "o": [["A", "al menos tres años de servicio y el puntaje indicado en la evaluación de competencias.", "El artículo 20 del Decreto 1278 de 2002 permite la reubicación en el nivel salarial siguiente o el ascenso de grado después de tres años de servicio, siempre que se obtenga en la evaluación de competencias el puntaje indicado según el artículo 36, que fija más del 80 %.", true], ["B", "acreditar un título de maestría o doctorado en un área afín a su desempeño.", "La maestría o el doctorado son requisito para el grado 3 (artículo 21), no para cambiar de nivel salarial dentro del mismo grado.", false], ["C", "dos evaluaciones anuales de desempeño consecutivas con calificación superior al 90 % en cada una.", "La reubicación salarial depende de la evaluación de competencias, no de un puntaje en la evaluación anual de desempeño (artículos 20 y 36).", false]]}, {"id": "NR-178", "niv": 3, "e": "Respecto del efecto de su nueva maestría, el Decreto 1278 de 2002 establece que usted", "f": "Decreto 1278 de 2002, artículos 21 (y parágrafo) y 36.", "o": [["A", "debe presentarse a un nuevo concurso de ingreso para ser inscrito en el grado 3.", "No se requiere un nuevo concurso: estando inscrito en el escalafón, el ascenso se obtiene mediante la evaluación de competencias (artículos 21 y 36).", false], ["B", "asciende automáticamente al grado 3 al radicar el diploma ante la secretaría de educación.", "El título es necesario pero no suficiente: el ascenso exige además superar la evaluación de competencias y que exista disponibilidad presupuestal (artículo 21, parágrafo).", false], ["C", "puede aspirar al grado 3 si supera la evaluación de competencias y existe disponibilidad presupuestal.", "El artículo 21 exige para el grado 3 título de maestría o doctorado y superar la evaluación de competencias si se está inscrito en el grado 1 o 2; su parágrafo condiciona el ascenso a la acreditación de requisitos, la superación de las evaluaciones y la existencia de disponibilidad presupuestal.", true]]}, {"id": "NR-179", "niv": 3, "e": "Para controvertir la evaluación de desempeño con la que no está de acuerdo, el Decreto 1278 de 2002 prevé", "f": "Decreto 1278 de 2002, artículo 36, parágrafo.", "o": [["A", "una solicitud de anulación ante el consejo directivo, que actúa como segunda instancia.", "El consejo directivo participa en la evaluación de los docentes (Ley 115, artículo 144), pero no es instancia de recursos; la norma prevé reposición y apelación ante los superiores.", false], ["B", "una queja disciplinaria contra el rector ante la Procuraduría General, como única vía de reclamación.", "La inconformidad con una calificación no constituye por sí misma una falta disciplinaria; la vía prevista para controvertirla son los recursos de reposición y apelación (artículo 36, parágrafo).", false], ["C", "los recursos de reposición ante el inmediato superior y de apelación ante el superior jerárquico.", "El parágrafo del artículo 36 del Decreto 1278 de 2002 dispone que las evaluaciones de desempeño son susceptibles de los recursos de reposición y apelación, que deben resolverse dentro de los quince días hábiles siguientes por el inmediato superior y por el superior jerárquico, respectivamente.", true]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Uso pedagógico de los resultados de las pruebas Saber", "texto": "La institución educativa en la que usted trabaja, en Montería, recibió el informe de resultados de la prueba Saber de matemáticas de quinto grado. Según el informe, el 48 % de los estudiantes quedó en el nivel de desempeño insuficiente, cuatro puntos porcentuales más que el año anteri
