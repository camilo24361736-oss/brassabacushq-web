or. En el análisis por componentes, el aleatorio (recolección, organización e interpretación de datos) presenta el mayor porcentaje de respuestas incorrectas. El rector convoca a los docentes de primaria a una jornada para analizar el informe. En la reunión, un colega concluye que «los profesores de quinto de este año enseñaron peor que los del año pasado», y otro propone no inscribir en la próxima aplicación a los estudiantes con bajo rendimiento.", "items": [{"id": "PD-132", "niv": 1, "e": "El uso más apropiado de este informe en la institución es tomarlo como", "f": "Decreto 1290 de 2009, artículo 1 y disposiciones sobre responsabilidades del Ministerio de Educación Nacional; MEN (2009). Documento No. 11: Fundamentaciones y orientaciones para la implementación del Decreto 1290 de 2009.", "o": [["A", "una calificación individual que debe registrarse en el boletín de cada estudiante que presentó la prueba.", "Los resultados de las pruebas externas no reemplazan la evaluación institucional del aprendizaje ni se convierten en notas del boletín; la valoración del estudiante se rige por el SIEE.", false], ["B", "un insumo para identificar fortalezas y debilidades, y orientar el plan de mejoramiento y las prácticas de aula.", "El Decreto 1290 de 2009 prevé que el MEN publique los resultados de las pruebas externas como insumo para los sistemas institucionales de evaluación y el mejoramiento de la calidad; su valor está en orientar decisiones pedagógicas.", true], ["C", "un criterio para decidir qué docentes deben ser reasignados a otros grados durante el año siguiente.", "Un resultado agregado de una cohorte no permite atribuir causalidad a un docente; usarlo para reasignar personal desvía el propósito pedagógico del análisis.", false]]}, {"id": "PD-133", "niv": 2, "e": "Ante el bajo desempeño en el componente aleatorio, la acción pedagógica más pertinente es", "f": "MEN (2006). Estándares Básicos de Competencias en Matemáticas (pensamiento aleatorio); MEN, Guía 34 (plan de mejoramiento institucional).", "o": [["A", "revisar cómo se aborda ese componente en el plan de área de primero a quinto y fortalecer el trabajo con datos reales.", "Los estándares se organizan por grupos de grados y el pensamiento aleatorio se desarrolla de forma progresiva; revisar el plan de área en todos los grados y crear situaciones de recolección e interpretación de datos ataca la causa curricular.", true], ["B", "concentrar el refuerzo solo en los estudiantes de quinto grado, porque fueron quienes presentaron la prueba.", "Los estudiantes evaluados ya avanzan de grado; el desempeño de quinto refleja el trabajo acumulado desde primero, por lo que la mejora debe involucrar a toda la primaria.", false], ["C", "dedicar las últimas semanas antes de la próxima aplicación a resolver simulacros con preguntas similares a las de la prueba.", "Practicar el formato puede familiarizar a los estudiantes con la prueba, pero no corrige la causa: cómo y cuánto se enseña el componente a lo largo de la primaria.", false]]}, {"id": "PD-134", "niv": 3, "e": "Frente a la conclusión del colega sobre los docentes de quinto, usted argumenta que", "f": "Decreto 1290 de 2009, artículo 1 (ámbitos de evaluación); MEN (2009). Documento No. 11: Fundamentaciones y orientaciones para la implementación del Decreto 1290 de 2009 (uso de resultados de pruebas externas).", "o": [["A", "ese dato no sostiene la conclusión, pues compara cohortes distintas y debe analizarse junto con otras evidencias.", "Los resultados de dos años corresponden a grupos de estudiantes diferentes y reflejan factores escolares y extraescolares acumulados; una interpretación responsable los triangula con evaluaciones internas y otras evidencias antes de concluir.", true], ["B", "la conclusión es válida solo si la diferencia entre ambos años supera diez puntos porcentuales.", "Fijar un umbral arbitrario no resuelve el problema de fondo: aun con diferencias grandes, comparar dos cohortes distintas no permite atribuir el cambio a los docentes de un grado.", false], ["C", "la conclusión es válida, porque la prueba es estandarizada y mide directamente la calidad de cada docente.", "Que una prueba sea estandarizada permite comparar resultados, pero no aísla el efecto de un docente: el desempeño depende de muchos factores y del recorrido de toda la cohorte.", false]]}, {"id": "PD-135", "niv": 1, "e": "Frente a la propuesta de no inscribir a los estudiantes con bajo rendimiento, usted advierte que, según la normativa de evaluación de los estudiantes,", "f": "Decreto 1290 de 2009, artículo 11, numeral 9.", "o": [["A", "la medida es válida si se cuenta con la autorización escrita de los padres de los estudiantes excluidos.", "La autorización de los padres no habilita a la institución para incumplir la obligación de presentar a todos los matriculados en los grados evaluados.", false], ["B", "la institución no puede excluir de las pruebas censales del ICFES a ningún estudiante matriculado en los grados evaluados.", "El artículo 11, numeral 9, del Decreto 1290 de 2009 establece como responsabilidad del establecimiento presentar a las pruebas censales del ICFES a la totalidad de los estudiantes matriculados en los grados evaluados.", true], ["C", "la medida es aceptable siempre que esos estudiantes presenten en la institución una prueba interna equivalente a la externa.", "Una prueba interna no sustituye la evaluación externa censal ni exime a la institución de presentar a todos sus estudiantes; además, excluirlos distorsiona los resultados.", false]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Juego, literatura y exploración del medio en la educación inicial", "texto": "Usted atiende el grado jardín y transición en una sede rural del Tolima, cerca de una quebrada. En el aula organizó un rincón de juego con una «tienda» hecha con empaques reciclados y un rincón de cuentos. Las familias de la vereda conservan coplas, arrullos y relatos sobre la quebrada. Esta semana planea una salida a la orilla de la quebrada con los niños, acompañada por dos madres de familia, y quiere aprovechar el juego libre de la tarde para observar el desarrollo de sus estudiantes.", "items": [{"id": "PD-156", "niv": 1, "e": "Para potenciar la exploración del medio durante la salida a la quebrada, lo más pertinente es", "f": "MEN, Actividades rectoras de la primera infancia y de la educación inicial (portal mineducacion.gov.co); Serie de Orientaciones Pedagógicas para la Educación Inicial (la exploración del medio).", "o": [["A", "explicar en el aula los nombres de los animales y las plantas de la quebrada antes de salir, para que los reconozcan.", "La explicación previa puede tener lugar, pero si sustituye la experiencia, los niños pasan a reconocer lo que ya se les dijo en lugar de observar, preguntar y descubrir por sí mismos.", false], ["B", "pedir que coloreen una ficha sobre el agua al regresar al aula, para verificar que prestaron atención.", "Colorear una ficha predeterminada no recoge lo que los niños exploraron ni sus preguntas; reduce la experiencia a un control de atención.", false], ["C", "invitar a los niños a observar, tocar, preguntar y dibujar lo que encuentran, y luego conversar sobre sus hallazgos.", "El MEN describe la exploración del medio como la oportunidad de usar los sentidos para cuestionarse, resolver problemas, investigar y construir sentido sobre el mundo; registrar y conversar sobre los hallazgos amplía esa experiencia.", true]]}, {"id": "PD-157", "niv": 2, "e": "Durante el juego libre en el rincón de la tienda, el papel más adecuado de usted como docente es", "f": "MEN, Actividades rectoras de la primera infancia y de la educación inicial (portal mineducacion.gov.co); Serie de Orientaciones Pedagógicas para la Educación Inicial (el juego).", "o": [["A", "aprovechar ese tiempo para organizar los materiales del día siguiente, porque el juego libre no requiere de intervención.", "Que el juego sea libre no significa que el docente se ausente: su observación y acompañamiento son claves para comprender el desarrollo de los niños y enriquecer la experiencia.", false], ["B", "convertir el juego en un ejercicio de sumas con las monedas de la tienda, corrigiendo a quien se equivoque.", "Transformar el juego en un ejercicio con corrección lo convierte en un medio para otro fin y desconoce que, según el MEN, el juego posibilita aprendizajes por sí mismo.", false], ["C", "observar y acompañar el juego, y enriquecerlo con materiales o preguntas sin dirigirlo por completo.", "El MEN reconoce el juego como actividad rectora en la que los niños representan y resignifican su realidad. El docente observa para conocer a los niños y enriquece el juego sin convertirlo en una actividad dirigida.", true]]}, {"id": "PD-158", "niv": 3, "e": "De acuerdo con las orientaciones del MEN, la literatura en la primera infancia comprende", "f": "MEN, Actividades rectoras de la primera infancia y de la educación inicial (portal mineducacion.gov.co); Serie de Orientaciones Pedagógicas para la Educación Inicial (la literatura).", "o": [["A", "los cuentos clásicos universales, que deben preferirse a los relatos orales de la comunidad.", "El MEN reconoce la tradición oral como parte de la literatura en la primera infancia; desplazar los relatos de la comunidad desaprovecha un patrimonio que conecta con la experiencia de los niños.", false], ["B", "las obras escritas, la tradición oral y los libros ilustrados, incluidos los arrullos y relatos de la vereda.", "Según el MEN, en sentido amplio la literatura en la primera infancia abarca no solo las obras literarias escritas, sino también la tradición oral y los libros ilustrados; las coplas, arrullos y relatos de las familias hacen parte de ella.", true], ["C", "principalmente los textos escritos que los niños ya pueden decodificar de manera autónoma.", "La literatura en la primera infancia no depende de que el niño sepa leer convencionalmente: incluye lo que escucha, canta y explora con los adultos.", false]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Escuela Nueva y aula multigrado en zona rural", "texto": "Usted es el único docente de una sede rural en Antioquia que atiende a 24 estudiantes de primero a quinto grado con el modelo Escuela Nueva. La sede cuenta con cartillas y guías de aprendizaje del modelo, una pequeña biblioteca y un espacio para el centro de recursos de aprendizaje. Al revisar la guía de ciencias naturales de cuarto grado, usted encuentra una actividad sobre el ecosistema de páramo, aunque la vereda está en tierra cálida. Además, Luisa, de tercer grado, avanza muy rápido en las guías, mientras que otros dos estudiantes necesitan más tiempo. Usted quiere fortalecer la autonomía y la participación de los niños.", "items": [{"id": "PD-159", "niv": 1, "e": "Según el Ministerio de Educación Nacional, el modelo Escuela Nueva se caracteriza por", "f": "MEN, Modelos Educativos Flexibles: Escuela Nueva (portal mineducacion.gov.co).", "o": [["A", "ofrecer la básica primaria completa en escuelas multigrado con uno, dos o hasta tres docentes.", "El MEN describe Escuela Nueva como un modelo que permite ofrecer los cinco grados de la básica primaria con calidad en escuelas multigrado con uno, dos o hasta tres maestros, integrando estrategias curriculares, de capacitación docente, gestión administrativa y participación comunitaria.", true], ["B", "atender a jóvenes en extraedad de la básica secundaria que abandonaron el sistema educativo.", "Esa población la atienden otros modelos educativos flexibles; Escuela Nueva se orienta a la básica primaria, en especial en zonas rurales.", false], ["C", "funcionar en zonas urbanas con un docente por cada grado y horarios organizados por asignaturas.", "Escuela Nueva surgió como respuesta al multigrado rural; un docente por grado con horario por asignaturas corresponde a la organización graduada convencional.", false]]}, {"id": "PD-160", "niv": 2, "e": "Frente a la actividad de la guía sobre el páramo, lo más adecuado es", "f": "MEN, Escuela Nueva: Manual de implementación (Programa de Educación Rural): las guías y su relación con el PEI.", "o": [["A", "adaptar la actividad al ecosistema de la vereda, pues las guías apoyan el PEI y pueden ajustarse al contexto.", "El manual de implementación de Escuela Nueva aclara que las guías son una herramienta para cumplir el PEI, que su contenido puede adaptarse si es necesario y que no son una camisa de fuerza.", true], ["B", "omitir esa guía y continuar con la siguiente, para no salirse de la secuencia didáctica de la cartilla.", "Omitir la guía deja sin trabajar los aprendizajes que propone; lo pertinente es mantener el propósito y cambiar el ejemplo por uno del entorno.", false], ["C", "desarrollar la guía sin cambios, porque el modelo exige seguirla tal como está escrita para mantener la secuencia.", "El propio manual del modelo advierte que las guías no son la única manera de trabajar ni una camisa de fuerza; seguirlas sin ajustar desaprovecha el contexto de los estudiantes.", false]]}, {"id": "PD-161", "niv": 1, "e": "Para fortalecer la autonomía y la participación de los estudiantes, de acuerdo con el modelo, usted promueve", "f": "MEN, Escuela Nueva: Manual de implementación (Programa de Educación Rural): gobierno estudiantil.", "o": [["A", "la elección del estudiante con mejores calificaciones como representante permanente de todos los grados.", "Reservar la representación a quien tiene mejores notas restringe la participación y desconoce el carácter democrático y rotativo de los comités del modelo.", false], ["B", "la conformación democrática del gobierno estudiantil, con presidente, vicepresidente, secretario y comités de trabajo.", "En Escuela Nueva el gobierno estudiantil, elegido democráticamente y organizado en comités, fortalece la participación, la autonomía, la responsabilidad y el liderazgo de los estudiantes, y es un espacio real de formación para la democracia.", true], ["C", "la designación, por parte del docente, de un monitor por grado encargado de controlar la disciplina del grupo.", "Un monitor designado por el docente para vigilar la disciplina no promueve la participación democrática ni la organización autónoma que busca el modelo.", false]]}, {"id": "PD-162", "niv": 2, "e": "Frente a los diferentes ritmos de Luisa y de los otros dos estudiantes, lo coherente con la promoción flexible del modelo es", "f": "MEN, Escuela Nueva: Manual de implementación (Programa de Educación Rural): promoción flexible; Decreto 1290 de 2009, artículo 3.", "o": [["A", "exigir a quienes van más despacio que terminen las guías en casa para que alcancen al resto del grupo.", "Trasladar el atraso a la casa ignora que esos estudiantes necesitan más tiempo y apoyo pedagógico, que es responsabilidad de la escuela ofrecer.", false], ["B", "detener a Luisa hasta que el resto de su grado termine las mismas guías, para mantener al grupo unido.", "Frenar a una estudiante que avanza desconoce el principio de Escuela Nueva de respetar el ritmo de cada uno y puede desmotivarla.", false], ["C", "permitir que cada estudiante avance por las guías a su ritmo, con apoyos para quien requiera más tiempo.", "La promoción flexible de Escuela Nueva reconoce que cada estudiante tiene su propio ritmo de aprendizaje y le permite avanzar según sus logros, con acompañamiento para quienes lo necesitan, en el marco del SIEE de la institución.", true]]}, {"id": "PD-163", "niv": 3, "e": "Con estudiantes de primero a quinto en una sola aula, la organización de la clase más coherente con Escuela Nueva es", "f": "MEN, Escuela Nueva: Manual de implementación (Programa de Educación Rural): aprendizaje activo y cooperativo, rol del docente.", "o": [["A", "dar la misma explicación magistral a todos los grados y diferenciar únicamente las tareas para la casa.", "Una explicación única para todos no responde a los distintos grados y niveles, y deja la diferenciación por fuera del aula.", false], ["B", "trabajar en pequeños grupos con las guías mientras usted rota para orientar y algunos estudiantes apoyan a otros.", "El modelo organiza el aula multigrado en grupos que trabajan con las guías de manera activa y cooperativa; el docente actúa como orientador que rota entre los grupos y se apoya en la colaboración entre estudiantes.", true], ["C", "atender un grado a la vez mientras los demás copian del tablero las actividades que les corresponden ese día.", "Mantener a la mayoría del grupo copiando mientras se atiende a un grado desaprovecha el tiempo y contradice el aprendizaje activo y cooperativo del modelo.", false]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Uso pedagógico de las TIC", "texto": "Usted es docente de tecnología e informática en una institución que tiene una sede urbana en Florencia y una sede rural con conectividad intermitente. La institución recibió tabletas y el rector pide a los docentes integrarlas en sus clases. Algunos colegas eligen aplicaciones por ser las más novedosas y otros prefieren no usarlas por la falta de internet en la sede rural. Usted toma como referencia el documento del Ministerio de Educación Nacional «Competencias TIC para el desarrollo profesional docente» (2013). Una colega de la sede rural, por su parte, ya combina varias herramientas digitales en ambientes de aprendizaje diseñados para su vereda y comparte sus experiencias con otros docentes.", "items": [{"id": "PD-172", "niv": 1, "e": "Antes de elegir una herramienta digital para una unidad, lo primero que usted debe definir es", "f": "MEN (2013). Competencias TIC para el desarrollo profesional docente: competencia pedagógica.", "o": [["A", "qué aprendizaje se espera y de qué manera la herramienta ayuda a lograrlo mejor que otras opciones.", "El MEN plantea que la competencia pedagógica en TIC consiste en usarlas para fortalecer la enseñanza y el aprendizaje; por eso la elección parte del propósito pedagógico y no de la herramienta.", true], ["B", "cuál es la aplicación más novedosa disponible, porque la novedad motiva a los estudiantes a participar.", "La novedad puede generar interés momentáneo, pero si no responde a un propósito de aprendizaje la herramienta se vuelve un fin en sí misma.", false], ["C", "cuántas horas semanales pueden dedicarse a las tabletas para cumplir con la solicitud del rector.", "Fijar horas de uso sin un propósito convierte la integración de TIC en un requisito administrativo y no en una decisión pedagógica.", false]]}, {"id": "PD-173", "niv": 3, "e": "Según el MEN (2013), la competencia pedagógica del docente en relación con las TIC consiste en", "f": "MEN (2013). Competencias TIC para el desarrollo profesional docente: competencias tecnológica, comunicativa, pedagógica, de gestión e investigativa.", "o": [["A", "seleccionar y utilizar herramientas tecnológicas comprendiendo sus principios, sus combinaciones y sus licencias.", "Esa es la definición de la competencia tecnológica, una de las cinco competencias del documento, distinta de la pedagógica.", false], ["B", "utilizar las TIC para la transformación del saber y la generación de nuevos conocimientos.", "Esa es la definición de la competencia investigativa del mismo documento, no de la pedagógica.", false], ["C", "utilizar las TIC para fortalecer la enseñanza y el aprendizaje, reconociendo sus alcances y limitaciones.", "El MEN define la competencia pedagógica como la capacidad de utilizar las TIC para fortalecer los procesos de enseñanza y aprendizaje, reconociendo alcances y limitaciones de su incorporación en la formación integral de los estudiantes y en el propio desarrollo profesional.", true]]}, {"id": "PD-174", "niv": 2, "e": "Ante la conectividad intermitente de la sede rural, una decisión pedagógica pertinente es", "f": "MEN (2013). Competencias TIC para el desarrollo profesional docente: competencia pedagógica.", "o": [["A", "suspender el uso de las tabletas en la sede rural hasta que se cuente con una conexión a internet estable.", "Suspender el uso deja sin aprovechar la dotación y amplía la brecha con la sede urbana, cuando existen recursos que funcionan sin conexión.", false], ["B", "dejar como tareas para la casa las actividades que requieran internet, para no depender de la sede.", "Si la vereda tiene conectividad limitada, es probable que muchos hogares tampoco la tengan; trasladar esas actividades a la casa genera inequidad.", false], ["C", "usar recursos descargados con anticipación o que funcionen sin conexión y respondan al propósito de la clase.", "La falta de conectividad no impide integrar TIC con sentido pedagógico: los recursos sin conexión permiten mantener el propósito de aprendizaje y aprovechar la dotación, coherente con la competencia pedagógica del MEN.", true]]}, {"id": "PD-175", "niv": 3, "e": "Según el MEN (2013), la forma de trabajar de la colega de la sede rural corresponde al momento de", "f": "MEN (2013). Competencias TIC para el desarrollo profesional docente: momentos de exploración, integración e innovación.", "o": [["A", "integración, porque utiliza las TIC de forma autónoma en la planeación, la evaluación y las prácticas pedagógicas.", "La integración implica uso autónomo en la planeación y las prácticas, pero el caso describe además la creación de ambientes adaptados al entorno y el intercambio con pares, rasgos del momento siguiente.", false], ["B", "innovación, porque adapta y combina herramientas para diseñar ambientes que responden a su entorno.", "El MEN describe el momento de innovación como aquel en que los docentes adaptan y combinan diversos lenguajes y herramientas para diseñar ambientes de aprendizaje que respondan a su entorno, y comparten sus actividades con colegas para recibir realimentación.", true], ["C", "exploración, porque se está familiarizando con el espectro de posibilidades que ofrecen las TIC en la educación.", "En el momento de exploración el docente apenas conoce las posibilidades de las TIC y empieza a introducirlas; la colega ya diseña ambientes y comparte su experiencia.", false]]}]}, {"comp": "psicotecnica", "rol": "docente", "tag": "Prueba psicotécnica · Comunicación y relaciones interpersonales", "texto": "Usted es director de grupo de tercero en un colegio oficial de Bogotá. La madre de Samuel envió al grupo de WhatsApp de padres del curso un audio en el que afirma, molesta, que usted «la tiene montada» con su hijo porque le ha hecho tres anotaciones en la agenda por no entregar tareas. Otros padres respondieron con mensajes de apoyo a la madre y algunos aprovecharon para criticar al colegio. Usted sabe que Samuel ha incumplido varias tareas en el último mes, aunque antes era un estudiante cumplido.", "items": [{"id": "PS-105", "niv": 1, "e": "Frente al audio publicado en el grupo de padres, usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Comunicación y relaciones interpersonales).", "o": [["A", "responde en el grupo que con gusto atenderá la inquietud y escribe en privado a la madre para acordar una reunión.", "Evidencia comunicación y relaciones interpersonales (Guía 31): intercambia ideas «según las características del contexto y los participantes del proceso comunicativo», con una respuesta cordial y asertiva que no expone al estudiante y lleva la conversación a un espacio adecuado.", true], ["B", "responde en el grupo con el detalle de las tareas pendientes de Samuel, para que los demás padres conozcan los hechos.", "Aclarar los hechos puede parecer transparente, pero expone a un estudiante ante otras familias y escala la discusión pública. No se ajusta al contexto ni a los participantes, como exige la competencia comunicativa de la Guía 31.", false], ["C", "no responde en el grupo y espera a que la madre se acerque al colegio, para no alimentar la discusión entre los padres.", "Evitar la discusión pública tiene sentido, pero el silencio deja sin respuesta la inquietud y puede aumentar la desconfianza. La competencia implica favorecer relaciones basadas en la confianza mediante una comunicación oportuna.", false]]}, {"id": "PS-106", "niv": 2, "e": "Al iniciar la reunión, la madre sigue alterada, levanta la voz y dice que su hijo «no es ningún vago». Usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Comunicación y relaciones interpersonales).", "o": [["A", "le propone continuar la conversación con la coordinadora presente, para que un tercero garantice el respeto en la reunión.", "Buscar apoyo puede ser útil si la situación se agrava, pero en este momento traslada a otro una conversación que usted puede manejar. No demuestra las habilidades sociales en interacciones profesionales que describe la competencia.", false], ["B", "le muestra de inmediato las anotaciones de la agenda y las fechas de las tareas, para que vea que los llamados fueron justificados.", "Presentar pruebas al inicio pone la conversación en términos de quién tiene la razón y aumenta la tensión. La Guía 31 pide manejar las emociones e identificar y comprender las de otros antes de exponer argumentos.", false], ["C", "la escucha sin interrumpir, reconoce que está preocupada por su hijo y le pregunta qué ha notado en casa con las tareas.", "Corresponde a comunicación y relaciones interpersonales (Guía 31): «escucha con atención y comprende puntos de vista de los demás», «maneja y expresa adecuadamente sus emociones e identifica y comprende las de otros» y «realiza preguntas claras, concretas y que permiten aclarar una idea o situación».", true]]}, {"id": "PS-107", "niv": 3, "e": "Durante la conversación, la madre cuenta que trabaja hasta las ocho de la noche y que Samuel pasa las tardes solo. Para acordar cómo apoyar las tareas, usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Comunicación y relaciones interpersonales).", "o": [["A", "le pregunta en qué momentos puede acompañarlo y, con esa información, acuerdan una forma de seguimiento que ella pueda cumplir.", "Evidencia comunicación y relaciones interpersonales (Guía 31): realiza preguntas que aclaran la situación y ajusta el intercambio «según las características del contexto y los participantes», favoreciendo una relación basada en la confianza y acuerdos realistas.", true], ["B", "le explica la importancia del acompañamiento familiar y le entrega por escrito el horario de tareas de la semana.", "El mensaje es claro, pero desconoce lo que la madre acaba de contar sobre su horario: repite una exigencia general que ella no puede cumplir. No se adapta al contexto del participante, como exige la Guía 31.", false], ["C", "le propone que Samuel haga las tareas en la biblioteca del colegio en la jornada contraria, con apoyo de los docentes de turno.", "Busca una solución, pero la decide usted sin conocer si es viable para la familia y compromete a otros docentes sin consultarlos. La competencia implica construir el intercambio con el interlocutor según sus características, no resolver por él.", false]]}]}, {"comp": "psicotecnica", "rol": "docente", "tag": "Prueba psicotécnica · Iniciativa", "texto": "Una creciente del río inundó gran parte de un corregimiento de La Mojana, en Sucre. La sede principal del colegio funcionará como albergue durante al menos tres semanas y las clases presenciales se suspendieron. Usted es docente de quinto de primaria. Muchas familias perdieron cuadernos y libros; la mayoría tiene un celular con WhatsApp, pero la señal es intermitente. Algunos de sus estudiantes están en el albergue con sus familias y otros se trasladaron a casas de parientes en veredas cercanas.", "items": [{"id": "PS-118", "niv": 1, "e": "Para que sus estudiantes no interrumpan su proceso de aprendizaje durante la emergencia, usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Iniciativa).", "o": [["A", "espera las orientaciones de la secretaría de educación sobre el plan de contingencia para la zona afectada.", "Seguir las orientaciones oficiales es necesario, pero esperar sin actuar deja a los estudiantes sin acompañamiento durante semanas. La Guía 31 asocia la iniciativa con actuar «con autonomía sin necesidad de supervisión».", false], ["B", "diseña guías cortas que pueden enviarse por WhatsApp o entregarse impresas, y acuerda con las familias cómo devolverlas.", "Evidencia iniciativa (Guía 31): «demuestra recursividad y flexibilidad, y se adapta con rapidez a diferentes contextos», con una alternativa ajustada a la conectividad y a los recursos reales de las familias.", true], ["C", "asigna los talleres del libro de texto por WhatsApp, para que cada estudiante avance por su cuenta durante el cierre.", "Busca mantener el ritmo del programa, pero ignora que muchas familias perdieron sus libros y que la señal es intermitente. No muestra la adaptación al contexto que exige la competencia.", false]]}, {"id": "PS-119", "niv": 2, "e": "Usted observa que los niños del albergue pasan el día sin actividades. Usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Iniciativa).", "o": [["A", "dicta en el albergue las clases de su horario habitual, para que los estudiantes no pierdan los contenidos del período.", "Muestra disposición, pero replica la rutina escolar sin adaptarla a la emergencia ni a las necesidades de niños desplazados de sus casas. La iniciativa implica flexibilidad y adaptación al contexto.", false], ["B", "sugiere a los coordinadores del albergue solicitar al ICBF un equipo de recreación para atender a los niños.", "Es una gestión pertinente, pero traslada a otros una acción que usted puede emprender de inmediato con los recursos disponibles. No evidencia el trabajo proactivo que define la iniciativa.", false], ["C", "propone a los coordinadores del albergue un espacio diario de lectura y juego, que organiza con jóvenes voluntarios de la comunidad.", "Corresponde a la iniciativa (Guía 31): «propone y desarrolla ideas novedosas, investigaciones, experiencias o proyectos, para influir positivamente en la institución y la comunidad», actuando de forma proactiva ante una necesidad que identificó.", true]]}, {"id": "PS-120", "niv": 2, "e": "Al regresar a clases, cerca de la mitad del grupo no avanzó en las guías durante la emergencia. Usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Orientación al logro).", "o": [["A", "valora lo que logró cada estudiante y reorganiza el período con apoyos para quienes más lo necesitan, sin rebajar las metas.", "Evidencia orientación al logro (Guía 31): «demuestra esfuerzo y persistencia en la consecución de sus objetivos, afrontando obstáculos y situaciones difíciles» y «procura que los estudiantes [...] obtengan resultados de excelencia», ajustando la ruta sin bajar la meta.", true], ["B", "continúa el plan de área desde donde quedó y programa refuerzos al final del período para quienes no alcancen los logros esperados.", "Conserva el cronograma, pero deja que el rezago se acumule hasta el final. No refleja el esfuerzo y la persistencia frente a obstáculos que exige la orientación al logro.", false], ["C", "ajusta los logros del período a lo que el grupo alcanzó durante la emergencia, para no presionar a los estudiantes.", "Muestra comprensión por la situación, pero rebaja las metas de aprendizaje de todo el grupo. La orientación al logro, según la Guía 31, dirige el comportamiento hacia estándares elevados y procura resultados de excelencia.", false]]}, {"id": "PS-121", "niv": 1, "e": "Una colega de la sede, cuyo grupo de cuarto también quedó sin clases, le dice que no sabe cómo trabajar sin conectividad. Usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Trabajo en equipo).", "o": [["A", "le recomienda buscar en internet ejemplos de guías diseñadas para zonas sin conectividad.", "Es un consejo útil, pero la deja sola con el problema cuando usted ya tiene una solución probada. No evidencia la conducta de compartir aprendizajes y recursos que describe el trabajo en equipo.", false], ["B", "le comparte las guías que diseñó y le ofrece adaptarlas juntos para el grado de ella.", "Corresponde al trabajo en equipo (Guía 31): «comparte aprendizajes y recursos con diferentes miembros de la institución y ofrece apoyo para el trabajo de otros», en función de un objetivo común durante la emergencia.", true], ["C", "le sugiere pedir a la coordinación un formato único de guía para que todos los docentes de la sede trabajen igual.", "Unificar puede ser útil más adelante, pero ahora traslada la solución a la coordinación y retrasa el apoyo que la colega necesita. El trabajo en equipo implica cooperar directamente entre pares.", false]]}]}, {"comp": "psicotecnica", "rol": "docente", "tag": "Prueba psicotécnica · Compromiso social e institucional", "texto": "Usted es director de grupo de séptimo en una institución educativa rural del Cesar. Durante una actividad de escritura, una estudiante le entrega un texto en el que cuenta que su padrastro la golpea cuando llega borracho. Al terminar la clase, se acerca y le pide que no le cuente a nadie, porque teme que en su casa se enteren. La institución tiene un comité de convivencia que preside el rector, y en el manual de convivencia están definidas las rutas de atención.", "items": [{"id": "PS-147", "niv": 1, "e": "Frente a lo que le cuenta la estudiante, usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Compromiso social e institucional). Ley 1620 de 2013, arts. 19 y 29.", "o": [["A", "cita a la madre de la estudiante para contarle lo que ocurre y acordar con ella cómo proteger a la niña.", "Involucrar a la familia parece natural, pero hacerlo por su cuenta puede aumentar el riesgo para la estudiante y omite la ruta institucional, que define cómo y quién interviene. No acata las normas establecidas.", false], ["B", "guarda la confidencia y le pide que le avise si la situación se repite, para no perder la confianza que ella le tiene.", "Busca proteger la relación con la estudiante, pero la deja expuesta a una situación de maltrato. El docente tiene el deber de identificar y reportar estas situaciones (Ley 1620 de 2013, art. 19).", false], ["C", "le explica que, para protegerla, debe informar a quienes activan la ruta de atención, y lo hace ese mismo día.", "Evidencia compromiso social e institucional (Guía 31): «acata y divulga las normas y políticas nacionales, regionales e institucionales» y reflexiona sobre su responsabilidad social como educador. La Ley 1620 de 2013 (art. 19) asigna a los docentes identificar y reportar situaciones de vulneración de derechos.", true]]}, {"id": "PS-148", "niv": 3, "e": "Días después, un colega comenta el caso de la estudiante en la sala de profesores, mencionando su nombre. Usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Compromiso social e institucional). Ley 1098 de 2006, art. 33 (derecho a la intimidad).", "o": [["A", "informa de inmediato al rector, sin hablar antes con el colega, para que adopte las medidas correspondientes.", "Informar puede ser necesario si la conducta persiste, pero como primera respuesta escala de inmediato una situación que se puede corregir con una advertencia directa y respetuosa. No es la acción más oportuna.", false], ["B", "le recuerda en privado que la información es reservada y puede exponer a la estudiante y, si se repite, lo informa al rector.", "Corresponde al compromiso social e institucional (Guía 31): «muestra respeto hacia los estudiantes, el equipo docente» y «exhibe un comportamiento ético», protegiendo la reserva de la información de manera directa y respetuosa con el colega, y prevé acudir al rector si la conducta persiste.", true], ["C", "no dice nada para no generar tensión, pero se asegura de no aportar más detalles del caso.", "No divulga más información, pero su silencio permite que la intimidad de la estudiante siga expuesta. El compromiso institucional incluye actuar con ética y respeto hacia los estudiantes.", false]]}, {"id": "PS-149", "niv": 2, "e": "Usted nota que muchos estudiantes no saben a quién acudir cuando enfrentan situaciones de riesgo. Usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Iniciativa).", "o": [["A", "propone al comité de convivencia una campaña con los estudiantes para dar a conocer las rutas y a quién acudir.", "Evidencia iniciativa (Guía 31): «anticipa situaciones futuras» y «propone y desarrolla ideas novedosas [...] para influir positivamente en la institución y la comunidad», a partir de una necesidad que identificó.", true], ["B", "espera a que la orientación escolar desarrolle las charlas de prevención que están previstas para el segundo semestre.", "Respeta lo planeado, pero deja sin respuesta una necesidad que ya identificó. La iniciativa implica trabajar proactivamente y anticiparse a los problemas.", false], ["C", "pega en la cartelera del salón los teléfonos de las líneas de atención a niños y adolescentes.", "Es un aporte útil, pero limitado: no garantiza que los estudiantes comprendan las rutas ni confíen en ellas. No se trata de una alternativa con impacto en la institución.", false]]}]}, {"comp": "psicotecnica", "rol": "docente", "tag": "Prueba psicotécnica · Iniciativa", "texto": "Usted es docente de tecnología e informática en una institución educativa rural de Boyacá. Cada año, entre abril y mayo, varios estudiantes de noveno faltan semanas completas para ayudar a sus familias en la cosecha de papa, y algunos terminan abandonando el colegio. Este año, cinco estudiantes de su grupo ya acumulan muchas inasistencias. La mayoría de las familias valora el trabajo en la finca más que el estudio, aunque quieren que sus hijos terminen el bachillerato.", "items": [{"id": "PS-157", "niv": 1, "e": "Al notar que cinco estudiantes de noveno están en riesgo de abandonar sus estudios durante la cosecha, usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Iniciativa).", "o": [["A", "espera a que termine la temporada de cosecha para organizar una nivelación con los estudiantes que regresen al colegio.", "La nivelación es útil, pero llega tarde y solo para quienes regresen. No se anticipa al riesgo de deserción que ya identificó.", false], ["B", "reporta semanalmente las inasistencias a coordinación, como lo establece el manual de convivencia.", "Cumplir el reporte es necesario, pero por sí solo no evita que los estudiantes se retiren. La iniciativa implica anticiparse a los problemas y proponer alternativas.", false], ["C", "propone un plan para la temporada, con guías flexibles y encuentros de seguimiento, para que no abandonen.", "Evidencia iniciativa (Guía 31): trabaja «proactivamente y con autonomía frente a las responsabilidades» y propone «alternativas de soluciones novedosas» ajustadas a la realidad de las familias.", true]]}, {"id": "PS-158", "niv": 3, "e": "Como la cosecha se repite cada año en las mismas fechas, para el próximo año usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Iniciativa). Decreto 1075 de 2015, art. 2.4.3.4.1 (calendario académico definido por la entidad territorial certificada).", "o": [["A", "concentra los temas más importantes del área al inicio del año, para que la cosecha afecte solo temas complementarios.", "Anticipa la situación, pero solo reduce el daño y sigue tratando la cosecha como un obstáculo. No propone una alternativa novedosa que integre la realidad de los estudiantes al aprendizaje.", false], ["B", "planea para esas semanas proyectos del área sobre los procesos productivos de la finca, que los estudiantes desarrollen desde allí.", "Corresponde a la iniciativa (Guía 31): «anticipa situaciones futuras, identifica tendencias innovadoras y es abierto a nuevas ideas» y «propone y desarrolla ideas novedosas [...] para influir positivamente en la institución y la comunidad», convirtiendo la cosecha en una oportunidad de aprendizaje.", true], ["C", "solicita al consejo directivo que traslade las vacaciones de mitad de año a las semanas de cosecha.", "Busca una solución estructural, pero el calendario académico no lo define el consejo directivo, sino la secretaría de educación de la entidad territorial, y la propuesta depende de otros. No es una alternativa a su alcance.", false]]}, {"id": "PS-159", "niv": 1, "e": "Un padre le dice que su hijo no necesita seguir estudiando porque va a heredar la finca. Usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Comunicación y relaciones interpersonales).", "o": [["A", "lo escucha, reconoce el valor de la finca y le muestra cómo el estudio puede ayudar a su hijo a manejarla mejor.", "Evidencia comunicación y relaciones interpersonales (Guía 31): «escucha con atención y comprende puntos de vista de los demás» y «expresa argumentos de forma clara y respetuosa», conectando sus razones con los intereses de la familia.", true], ["B", "le explica que la educación es obligatoria hasta el grado noveno y que la familia debe garantizar la asistencia.", "Recordar la obligación legal es pertinente, pero no responde a las razones del padre ni construye confianza. La comunicación efectiva implica comprender el punto de vista del otro.", false], ["C", "le dice que respeta su decisión como padre de familia y que el colegio estará abierto si su hijo decide regresar.", "Es respetuoso, pero renuncia a dialogar y deja al estudiante en riesgo de abandonar. La competencia busca intercambiar argumentos con empatía, no evitar la conversación.", false]]}, {"id": "PS-160", "niv": 2, "e": "Al final del año, tres de los cinco estudiantes en riesgo terminaron noveno. Usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Orientación al logro).", "o": [["A", "presenta el resultado como un logro, ya que la deserción del grupo se redujo frente al año anterior.", "El avance es real, pero quedarse en el reconocimiento no aprovecha lo aprendido para mejorar. La orientación al logro se dirige al mejoramiento continuo.", false], ["B", "analiza con los dos estudiantes que no terminaron y sus familias qué falló, para mejorar el plan del próximo año.", "Evidencia orientación al logro (Guía 31): dirige su comportamiento «hacia el cumplimiento de estándares elevados, con miras al mejoramiento continuo» y muestra persistencia frente a las dificultades.", true], ["C", "concluye que los dos casos dependían de factores familiares fuera de su alcance y cierra el proyecto como exitoso.", "Reconocer los límites es sensato, pero atribuirlo todo a factores externos cierra la posibilidad de mejorar. No refleja la persistencia ante obstáculos.", false]]}]}];

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY = 'sim-docente:' + CFG.clave;
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}
function save(){try{localStorage.setItem(KEY, JSON.stringify(ST))}catch(e){}}
let ST = load();
ST.r = ST.r || {};
$('#tit').textContent = CFG.titulo;
const ITEMS = [];
DATA.forEach(c => c.items.forEach(it => { it.caso = c; ITEMS.push(it); }));

function justHTML(it){
  return '<div class="just">' + it.o.map(o => `<div><b>${o[0]}.</b> <span class="${o[3]?'okt':'not'}">${o[3]?'Es correcta.':'Es incorrecta.'}</span> ${esc(o[2])}</div>`).join('') +
    `<div class="src">Referencia: ${esc(it.f)}</div></div>`;
}
function itemHTML(it, n, mode){
  const r = ST.r[it.id];
  const reveal = mode === 'review' || (CFG.modo === 'practica' && r);
  let h = `<div class="item" id="i-${it.id}"><p class="enun"><span class="n">${n}.</span> <span class="niv">${CFG.niveles[it.niv]}</span> ${esc(it.e)}</p>`;
  it.o.forEach(o => {
    let cls = '';
    if (reveal) { if (o[3]) cls = 'ok'; else if (r === o[0]) cls = 'no'; }
    else if (r === o[0]) cls = 'sel';
    h += `<button class="op ${cls}" data-id="${it.id}" data-l="${o[0]}" ${reveal?'disabled':''}><span class="l">${o[0]}.</span><span>${esc(o[1])}</span></button>`;
  });
  if (reveal) {
    if (mode === 'review') h += `<div class="${r===keyOf(it)?'res-ok':'res-no'}" style="font-size:14px;margin-top:4px">${r ? (r===keyOf(it)?'Respondiste ' + r + ': correcto.':'Respondiste ' + r + '. La respuesta correcta es ' + keyOf(it) + '.') : 'Sin responder. La respuesta correcta es ' + keyOf(it) + '.'}</div>`;
    h += justHTML(it);
  }
  return h + '</div>';
}
const keyOf = it => it.o.find(o => o[3])[0];

function renderList(list, mode){
  let h = '', last = null, n = 0;
  list.forEach(it => {
    n++;
    if (it.caso !== last) { last = it.caso; h += `<div class="caso"><div class="tag">${esc(it.caso.tag)}</div><p>${esc(it.caso.texto)}</p></div>`; }
    h += itemHTML(it, n, mode);
  });
  return h;
}

// ---------- PRÁCTICA ----------
let LIST = [];
let FILTRO = ST.f || {comp:'', niv:'', rol:''};
function practica(){
  const comps = Object.entries(CFG.componentes).map(([k,v]) => `<option value="${k}" ${FILTRO.comp===k?'selected':''}>${esc(v)}</option>`).join('');
  const nivs = Object.entries(CFG.niveles).map(([k,v]) => `<option value="${k}" ${FILTRO.niv===k?'selected':''}>${esc(v)}</option>`).join('');
  const list = ITEMS.filter(it => (!FILTRO.comp || it.caso.comp===FILTRO.comp) && (!FILTRO.niv || String(it.niv)===FILTRO.niv) && (!FILTRO.rol || it.caso.rol===FILTRO.rol));
  const resp = list.filter(it => ST.r[it.id]); const ok = resp.filter(it => ST.r[it.id]===keyOf(it));
  $('#main').innerHTML = `<div class="panel"><p style="margin-top:0">Elige un tema y un nivel. Al responder verás de inmediato si acertaste y la explicación de cada opción.</p>
  <div class="row"><select id="fc"><option value="">Todos los temas</option>${comps}</select>
  <select id="fn"><option value="">Todos los niveles</option>${nivs}</select>
  <select id="fr"><option value="">Docentes y directivos</option><option value="docente" ${FILTRO.rol==='docente'?'selected':''}>Solo docentes</option><option value="directivo" ${FILTRO.rol==='directivo'?'selected':''}>Solo directivos</option></select>
  <button class="btn sec" id="borrar">Borrar mis respuestas</button></div>
  <p class="stat" id="pst" style="margin-bottom:0">${list.length} preguntas · respondidas ${resp.length} · aciertos ${ok.length}${resp.length? ' (' + Math.round(100*ok.length/resp.length) + ' %)':''}</p></div>` + renderList(list, 'practica');
  $('#prog').textContent = `${ok.length}/${resp.length} aciertos`;
  ['fc','fn','fr'].forEach((id,i) => $('#'+id).onchange = e => { FILTRO[['comp','niv','rol'][i]] = e.target.value; ST.f = FILTRO; save(); practica(); });
  LIST = list;
  $('#borrar').onclick = () => { list.forEach(it => delete ST.r[it.id]); save(); practica(); };
}

// ---------- SIMULACRO ----------
let tick = null;
function inicio(){
  const n = ITEMS.length, cnt = {};
  ITEMS.forEach(it => cnt[it.caso.comp] = (cnt[it.caso.comp]||0) + 1);
  const h = Math.floor(CFG.minutos/60), m = CFG.minutos%60;
  $('#main').innerHTML = `<div class="panel"><h2 style="margin-top:0;color:var(--pri)">Instrucciones</h2>
  <p>Este simulacro tiene <b>${n} preguntas</b> en el formato de Prueba de Juicio Situacional: un caso, enunciados que se completan y tres opciones con una sola respuesta correcta.</p>
  <table>${Object.entries(cnt).map(([k,v]) => `<tr><td>${esc(CFG.componentes[k])}</td><td class="r">${v}</td></tr>`).join('')}</table>
  <p>Tiempo sugerido: <b>${h ? h + ' h ' : ''}${m ? m + ' min' : ''}</b> (unos ${Math.round(CFG.minutos*60/n/6)/10} minutos por pregunta). Cuando se acaba el tiempo puedes seguir, pero el cronómetro lo indica.</p>
  <p>Tus respuestas se guardan en este navegador. Al terminar verás tu puntaje por componente y por nivel, y la explicación de cada pregunta.</p>
  <button class="btn" id="go">${ST.t0 ? 'Continuar el simulacro' : 'Comenzar'}</button></div>`;
  $('#prog').textContent = `${n} preguntas`;
  $('#go').onclick = () => { if (!ST.t0) { ST.t0 = Date.now(); save(); } examen(); };
}
function reloj(){
  const rest = CFG.minutos*60 - Math.floor((Date.now() - ST.t0)/1000);
  const a = Math.abs(rest), hh = Math.floor(a/3600), mm = Math.floor(a%3600/60), ss = a%60;
  const t = (rest < 0 ? '+' : '') + (hh ? hh + ':' : '') + String(mm).padStart(2,'0') + ':' + String(ss).padStart(2,'0');
  $('#timer').textContent = rest < 0 ? 'Tiempo cumplido ' + t : '⏱ ' + t;
  $('#timer').classList.toggle('low', rest < 600);
}
function examen(){
  $('#main').innerHTML = renderList(ITEMS, 'examen') + `<div class="panel"><button class="btn" id="fin">Terminar y calificar</button></div>`;
  progreso(); reloj(); clearInterval(tick); tick = setInterval(reloj, 1000);
  $('#fin').onclick = () => {
    const faltan = ITEMS.length - Object.keys(ST.r).filter(k => ITEMS.some(i => i.id===k)).length;
    $('#mtxt').textContent = faltan ? `Te faltan ${faltan} preguntas por responder. ¿Quieres calificar de todos modos?` : '¿Quieres terminar y ver tu calificación?';
    $('#modal').classList.remove('hide');
  };
}
function progreso(){
  const r = ITEMS.filter(it => ST.r[it.id]).length;
  $('#prog').textContent = `Respondidas ${r}/${ITEMS.length}`;
}
$('#mno').onclick = () => $('#modal').classList.add('hide');
$('#msi').onclick = () => { $('#modal').classList.add('hide'); ST.fin = Date.now(); save(); resultados(); };
function resultados(){
  clearInterval(tick);
  const ok = ITEMS.filter(it => ST.r[it.id] === keyOf(it)).length;
  const pct = Math.round(1000*ok/ITEMS.length)/10;
  const g = (fn, lab) => { const m = {}; ITEMS.forEach(it => { const k = fn(it); m[k] = m[k] || [0,0]; m[k][1]++; if (ST.r[it.id]===keyOf(it)) m[k][0]++; });
    return Object.entries(m).map(([k,v]) => `<tr><td>${esc(lab(k))}</td><td class="r">${v[0]}/${v[1]}</td><td class="r">${Math.round(100*v[0]/v[1])} %</td></tr>`).join(''); };
  const mins = Math.round(((ST.fin||Date.now()) - ST.t0)/60000);
  $('#timer').textContent = `Tiempo usado: ${Math.floor(mins/60) ? Math.floor(mins/60) + ' h ' : ''}${mins%60} min`;
  $('#prog').textContent = `${ok}/${ITEMS.length} aciertos`;
  $('#main').innerHTML = `<div class="panel"><div class="big">${String(pct).replace('.',',')} %</div>
  <p style="margin-top:4px">${ok} de ${ITEMS.length} respuestas correctas. ${pct >= 70 ? 'Muy buen resultado: repasa las explicaciones de tus errores para afianzarlo.' : pct >= 60 ? 'Vas bien, pero con poco margen: refuerza los componentes con menor porcentaje.' : 'Todavía no estás en zona segura: practica por tema los componentes con menor porcentaje.'}</p>
  <p class="aviso">Referencia: en el concurso el mínimo aprobatorio de la prueba eliminatoria es 60 puntos (70 para directivos). Este porcentaje de aciertos es una guía de preparación; la CNSC calcula su puntaje con su propia escala.</p>
  <h3>Por componente</h3><table>${g(it => it.caso.comp, k => CFG.componentes[k])}</table>
  <h3>Por nivel</h3><table>${g(it => it.niv, k => CFG.niveles[k])}</table>
  <div class="row" style="margin-top:14px"><button class="btn" id="solo">Ver solo mis errores</button><button class="btn sec" id="todas">Ver todas</button><button class="btn sec" id="otra">Reiniciar el simulacro</button></div></div><div id="rev"></div>`;
  const rev = errs => { const l = errs ? ITEMS.filter(it => ST.r[it.id] !== keyOf(it)) : ITEMS; $('#rev').innerHTML = renderList(l, 'review'); };
  rev(true);
  $('#solo').onclick = () => rev(true); $('#todas').onclick = () => rev(false);
  $('#otra').onclick = () => { ST = {r:{}}; save(); inicio(); window.scrollTo(0,0); };
}

document.addEventListener('click', e => {
  const b = e.target.closest('button.op'); if (!b || b.disabled) return;
  ST.r[b.dataset.id] = b.dataset.l; save();
  const it = ITEMS.find(i => i.id === b.dataset.id);
  const n = b.closest('.item').querySelector('.n').textContent.replace('.','');
  b.closest('.item').outerHTML = itemHTML(it, n, CFG.modo === 'practica' ? 'practica' : 'examen');
  if (CFG.modo === 'practica') { const resp = LIST.filter(i => ST.r[i.id]); const ok = resp.filter(i => ST.r[i.id]===keyOf(i)).length; $('#prog').textContent = `${ok}/${resp.length} aciertos`; $('#pst').textContent = `${LIST.length} preguntas · respondidas ${resp.length} · aciertos ${ok} (${Math.round(100*ok/resp.length)} %)`; }
  else progreso();
});

if (CFG.modo === 'practica') practica();
else if (ST.fin) resultados();
else if (ST.t0) examen();
else inicio();
</script>
</body>
</html>
