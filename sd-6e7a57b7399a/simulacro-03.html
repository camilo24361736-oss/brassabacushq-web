": "En una institución oficial de Ibagué, usted es docente de grado sexto. En marzo, durante el primer período, los padres de Valentina, que demuestra un desempeño muy superior en todas las áreas, solicitan que sea promovida a séptimo. Al finalizar el año, otro estudiante, Juan Pablo, no es promovido según los criterios del sistema institucional de evaluación (SIEE). Por otra parte, el rector sugiere no inscribir en las pruebas censales del ICFES a los estudiantes de bajo desempeño de los grados evaluados, para mejorar el promedio institucional.", "items": [{"id": "NR-164", "niv": 1, "e": "Al registrar las valoraciones, la escala nacional con la que debe guardar equivalencia la escala institucional es", "f": "Decreto 1290 de 2009, artículos 4 y 5.", "o": [["A", "desempeño superior, desempeño alto, desempeño básico y desempeño bajo.", "El artículo 5 del Decreto 1290 de 2009 define la escala de valoración nacional: desempeño superior, desempeño alto, desempeño básico y desempeño bajo. Cada institución adopta su propia escala y su equivalencia con la nacional (artículo 4).", true], ["B", "excelente, sobresaliente, aceptable, insuficiente y deficiente.", "No es la escala que adopta el Decreto 1290 de 2009, que tiene cuatro niveles: superior, alto, básico y bajo.", false], ["C", "desempeño superior, desempeño alto, desempeño aceptable y desempeño bajo.", "La escala nacional no tiene un nivel «medio»: el tercer nivel es «básico», que indica la superación de los desempeños necesarios en relación con las áreas obligatorias y fundamentales.", false]]}, {"id": "NR-165", "niv": 2, "e": "Para atender la solicitud de los padres de Valentina, el procedimiento previsto en el Decreto 1290 de 2009 es que", "f": "Decreto 1290 de 2009, artículo 7.", "o": [["A", "el rector la otorgue por resolución, después de una prueba de suficiencia aplicada por la secretaría de educación.", "La norma no prevé una prueba de la secretaría ni una decisión unilateral del rector; establece la recomendación del consejo académico y la decisión del consejo directivo.", false], ["B", "el consejo académico, con el consentimiento de los padres, recomiende la promoción anticipada al consejo directivo.", "El artículo 7 del Decreto 1290 de 2009 dispone que, durante el primer período, el consejo académico, previo consentimiento de los padres, recomiende ante el consejo directivo la promoción anticipada de quien demuestre un rendimiento superior; la decisión se consigna en el acta del consejo directivo y en el registro escolar.", true], ["C", "el director de grupo decida la promoción al finalizar el año, con base en el boletín final.", "La promoción anticipada se tramita durante el primer período, no al final del año, y la decide el consejo directivo por recomendación del consejo académico.", false]]}, {"id": "NR-166", "niv": 2, "e": "Respecto de Juan Pablo, que no fue promovido, la institución debe", "f": "Decreto 1290 de 2009, artículo 6; Ley 115 de 1994, artículo 96.", "o": [["A", "garantizarle el cupo en la institución para que continúe su proceso formativo el año siguiente.", "El artículo 6 del Decreto 1290 de 2009 establece que, cuando un estudiante no es promovido al grado siguiente, el establecimiento debe garantizarle el cupo para que continúe con su proceso formativo.", true], ["B", "trasladarlo a otra institución, porque la reprobación implica la pérdida del cupo.", "La reprobación no implica pérdida del cupo; además, la Ley 115 de 1994 (artículo 96) señala que reprobar un grado por primera vez no es causal de exclusión si no está asociado a otra causal del manual.", false], ["C", "asignarle cupo solo si quedan vacantes después de matricular a todos los estudiantes nuevos del año.", "La garantía del cupo para quien no es promovido no está sujeta a la disponibilidad de vacantes después de matricular a estudiantes nuevos.", false]]}, {"id": "NR-167", "niv": 3, "e": "Frente a la sugerencia del rector sobre las pruebas censales, usted señala que", "f": "Decreto 1290 de 2009, artículo 11.", "o": [["A", "es procedente si los padres de esos estudiantes firman su autorización para que no presenten la prueba.", "La responsabilidad de presentar a todos los estudiantes matriculados en los grados evaluados no admite excepción por autorización de los padres.", false], ["B", "es procedente si el consejo académico la justifica como una estrategia del plan de mejoramiento.", "Excluir estudiantes distorsiona los resultados y desconoce la obligación del artículo 11; los resultados deben usarse para mejorar, no para seleccionar quién presenta la prueba.", false], ["C", "no es procedente, porque la institución debe presentar a todos los estudiantes matriculados en los grados evaluados.", "El artículo 11 del Decreto 1290 de 2009 incluye entre las responsabilidades del establecimiento educativo presentar a las pruebas censales del ICFES a la totalidad de los estudiantes matriculados en los grados evaluados.", true]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Lineamientos curriculares, PEI y autonomía escolar", "texto": "En una institución educativa oficial de Pasto, el consejo académico revisa el plan de estudios de ciencias sociales de la básica secundaria. Usted, como representante del área, debe explicar a dos docentes recién nombrados cómo se relacionan los referentes nacionales con el currículo propio de la institución. Uno de ellos cree que el Ministerio de Educación Nacional entrega un programa único que todos los colegios deben aplicar; el otro piensa que cada docente puede organizar sus contenidos sin tener en cuenta el PEI. Además, un colega comenta en la reunión que, con la publicación de los nuevos lineamientos curriculares del MEN en 2026, el PEI de la institución «quedó sin vigencia».", "items": [{"id": "PD-105", "niv": 1, "e": "Al explicar qué son los lineamientos curriculares, usted precisa que son", "f": "MEN, Lineamientos curriculares (portal mineducacion.gov.co, Referentes de calidad); Ley 115 de 1994, artículo 78.", "o": [["A", "un programa nacional con contenidos y secuencias únicas que todas las instituciones del país deben aplicar sin cambios en sus aulas.", "Es la idea errada del primer docente. Los lineamientos no fijan un programa único: orientan la fundamentación y la planeación, y cada institución construye su plan de estudios en el marco de su autonomía.", false], ["B", "los documentos técnicos que definen las preguntas que se aplicarán en las pruebas Saber de cada área.", "Las pruebas Saber tienen sus propios marcos de referencia elaborados por el ICFES. Los lineamientos son referentes curriculares para las instituciones, no especificaciones de pruebas externas.", false], ["C", "orientaciones del MEN para fundamentar y planear las áreas obligatorias, que cada institución concreta en su currículo.", "El MEN define los lineamientos como orientaciones epistemológicas, pedagógicas y curriculares para apoyar la fundamentación y planeación de las áreas obligatorias y fundamentales del artículo 23 de la Ley 115; son referentes para elaborar el PEI y los planes de estudio.", true]]}, {"id": "PD-106", "niv": 1, "e": "Ante la pregunta de quién establece el plan de estudios de la institución, usted responde que lo hace", "f": "Ley 115 de 1994, artículos 77 y 78.", "o": [["A", "el establecimiento educativo, de acuerdo con su PEI y atendiendo los lineamientos generales definidos por el MEN.", "El artículo 78 de la Ley 115 dispone que el MEN diseña los lineamientos generales de los procesos curriculares y que los establecimientos, de conformidad con su PEI y atendiendo esos lineamientos, establecen su plan de estudios particular.", true], ["B", "cada docente de manera individual, porque la autonomía escolar se ejerce principalmente en el aula de clase.", "La autonomía del artículo 77 corresponde a las instituciones, dentro de los límites de la ley y del PEI, no a cada docente por separado. El plan de estudios es institucional.", false], ["C", "la secretaría de educación certificada, que lo expide para todas las instituciones oficiales de su jurisdicción.", "El parágrafo del artículo 77 de la Ley 115 asigna a las secretarías de educación la asesoría para el diseño y desarrollo del currículo, no la expedición del plan de estudios de cada institución.", false]]}, {"id": "PD-107", "niv": 3, "e": "Frente al comentario sobre los nuevos lineamientos curriculares de 2026, usted aclara que estos", "f": "MEN (2026). ABC de los Lineamientos Curriculares; Ley 115 de 1994, artículo 77.", "o": [["A", "sustituyen el PEI, por lo que la institución debe adoptarlos textualmente como su nuevo plan de estudios.", "El ABC de los lineamientos publicado por el MEN señala expresamente que no reemplazan los Proyectos Educativos Institucionales ni imponen un currículo único.", false], ["B", "orientan la transformación curricular sin reemplazar el PEI ni imponer un currículo único a las instituciones.", "Según el ABC de los Lineamientos Curriculares (MEN, 2026), estos no crean asignaturas, no eliminan áreas, no imponen un currículo único, no reemplazan los PEI ni limitan la autonomía de docentes e instituciones; orientan procesos de transformación curricular.", true], ["C", "aplican solo a las instituciones que los adopten de manera voluntaria, así que no tienen relación con el PEI vigente.", "Los lineamientos son referentes de calidad para todo el sistema y orientan la revisión curricular de las instituciones en el marco de su autonomía; no son un programa opcional desligado del PEI.", false]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Zona de desarrollo próximo (Vygotsky) y andamiaje", "texto": "Usted orienta lengua castellana en tercer grado en una institución de Cartagena. En la evaluación diagnóstica de comprensión lectora encuentra que la mayoría localiza información explícita en textos cortos, pero pocos infieren el propósito del autor. Andrés, por ejemplo, identifica sin ayuda los personajes y lugares de un cuento, pero no logra inferir por qué el autor lo escribió, ni siquiera cuando usted le hace preguntas guía. Otros estudiantes sí lo logran cuando trabajan con un compañero que lee con mayor fluidez o cuando usted los orienta paso a paso. Usted decide planear las próximas clases a partir de la teoría sociocultural de Lev Vygotsky.", "items": [{"id": "PD-115", "niv": 1, "e": "Según Vygotsky, la zona de desarrollo próximo de un estudiante es", "f": "Vygotsky, L. S. (1978/2009). El desarrollo de los procesos psicológicos superiores, cap. 6.", "o": [["A", "el nivel máximo de desarrollo que permite la edad del estudiante según la etapa en que se encuentra.", "La idea de un techo fijado por la etapa de edad no corresponde a la ZDP; Vygotsky subraya que la interacción social y la mediación hacen avanzar el desarrollo.", false], ["B", "la distancia entre lo que logra resolver solo y lo que logra con la guía de un adulto o de un compañero más capaz.", "Vygotsky definió la ZDP como la distancia entre el nivel de desarrollo real, determinado por la resolución independiente de problemas, y el nivel de desarrollo potencial, determinado por la resolución con la guía de un adulto o en colaboración con un compañero más capaz.", true], ["C", "el conjunto de contenidos que el estudiante ya domina y puede aplicar sin ayuda de otros.", "Lo que el estudiante ya resuelve solo corresponde a su nivel de desarrollo real, que es solo el punto de partida de la zona de desarrollo próximo.", false]]}, {"id": "PD-116", "niv": 2, "e": "Para aprovechar la zona de desarrollo próximo en las actividades de inferencia, una estrategia coherente es", "f": "Vygotsky, L. S. (1978/2009). El desarrollo de los procesos psicológicos superiores, cap. 6.", "o": [["A", "asignar lectura individual silenciosa, para que cada estudiante avance a su propio ritmo sin interferencias de otros.", "La lectura individual puede ser útil en otros momentos, pero no aprovecha la mediación social que define la ZDP, que es lo que plantea el enunciado.", false], ["B", "agrupar a los estudiantes con el mismo nivel de lectura, para que ninguno se sienta en desventaja.", "Agrupar solo por niveles iguales elimina al compañero más capaz que, según Vygotsky, puede mediar el paso del nivel real al potencial.", false], ["C", "formar parejas en las que un compañero con mayor dominio acompañe la lectura y ambos discutan sus inferencias.", "La interacción con un compañero más capaz es una de las formas de mediación que Vygotsky reconoce para que el estudiante resuelva lo que aún no logra solo; la discusión hace visible el razonamiento.", true]]}, {"id": "PD-117", "niv": 2, "e": "Usted primero modela en voz alta cómo inferir el propósito del autor, luego lo hacen juntos con preguntas guía y, al final, los estudiantes lo hacen solos. Esta progresión corresponde a", "f": "Wood, D., Bruner, J. y Ross, G. (1976). The role of tutoring in problem solving; Vygotsky (1978/2009).", "o": [["A", "un andamiaje, en el que la ayuda se ajusta y se retira gradualmente a medida que el estudiante gana autonomía.", "Wood, Bruner y Ross (1976) describieron el andamiaje como un apoyo temporal y ajustado que el experto va retirando cuando el aprendiz asume mayor control de la tarea; la secuencia modelado–práctica guiada–práctica independiente lo concreta.", true], ["B", "una instrucción programada, en la que cada respuesta correcta se premia para fijar la conducta deseada.", "La instrucción programada, de raíz conductista, se basa en pasos pequeños y refuerzo de respuestas; la progresión del caso se centra en transferir el control de la tarea, no en premiar respuestas.", false], ["C", "un aprendizaje por ensayo y error, en el que el estudiante descubre la estrategia sin intervención del docente.", "En la secuencia descrita el docente interviene de manera deliberada (modela y guía); no se deja al estudiante descubrir la estrategia por sí solo.", false]]}, {"id": "PD-118", "niv": 3, "e": "Considerando lo que Andrés logra solo y con ayuda, la tarea más pertinente para él en este momento es", "f": "Vygotsky, L. S. (1978/2009). El desarrollo de los procesos psicológicos superiores, cap. 6.", "o": [["A", "inferencias sencillas sobre textos breves, con apoyo cercano, un paso más allá de lo que ya resuelve solo.", "La enseñanza eficaz, según Vygotsky, se dirige a la ZDP: tareas que el estudiante no resuelve solo pero sí con ayuda. Para Andrés, inferir el propósito del autor está aún fuera de esa zona; las inferencias sencillas con apoyo sí están dentro de ella.", true], ["B", "seguir practicando la localización de información explícita hasta que la domine por completo.", "Andrés ya localiza información explícita sin ayuda: es su nivel real. Una tarea que ya resuelve solo no lo ubica en su zona de desarrollo próximo.", false], ["C", "la misma tarea de inferir el propósito del autor, sin ninguna ayuda, para medir con precisión cuál es su verdadero nivel.", "Ya se sabe que no logra esa tarea ni siquiera con preguntas guía; repetirla sin ayuda solo confirma lo conocido y no lo hace avanzar.", false]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Enseñanza para la Comprensión (EpC)", "texto": "Usted orienta ciencias sociales en noveno grado en una institución de Valledupar. Para el segundo período decide planear una unidad con el marco de Enseñanza para la Comprensión (EpC), desarrollado en el Proyecto Cero de la Universidad de Harvard. La unidad gira en torno al tema «El agua en nuestra región: usos y conflictos», que conecta con la vida de los estudiantes, con la historia del territorio y con varias disciplinas. En la evaluación del período anterior usted notó que un estudiante recitaba sin errores la definición de cuenca hidrográfica, pero no lograba explicar por qué la deforestación en la parte alta del río afecta los cultivos de su vereda.", "items": [{"id": "PD-144", "niv": 1, "e": "En el marco de la EpC, el tema «El agua en nuestra región: usos y conflictos» cumple la función de", "f": "Stone Wiske, M. (comp.) (1999). La Enseñanza para la Comprensión: vinculación entre la investigación y la práctica (tópicos generativos, metas, desempeños y valoración continua).", "o": [["A", "un desempeño de comprensión, porque exige a los estudiantes actuar con flexibilidad a partir de lo que saben.", "Los desempeños de comprensión son actividades en las que el estudiante usa lo que sabe de formas nuevas; un tema no es por sí mismo una actividad de desempeño.", false], ["B", "un tópico generativo, porque es central, accesible e interesante y se conecta con varias disciplinas.", "En la EpC, los tópicos generativos son temas centrales para la disciplina, accesibles e interesantes para los estudiantes y que permiten múltiples conexiones; el tema del caso reúne esas características.", true], ["C", "una meta de comprensión, porque enuncia de forma explícita lo que los estudiantes deben comprender al final.", "Las metas de comprensión expresan qué se espera que los estudiantes comprendan (por ejemplo, «comprenderán cómo los usos del suelo afectan la disponibilidad de agua»); el tema del caso organiza la unidad, pero no enuncia esa comprensión.", false]]}, {"id": "PD-145", "niv": 2, "e": "De las siguientes actividades, la que constituye un desempeño de comprensión es", "f": "Stone Wiske, M. (comp.) (1999). La Enseñanza para la Comprensión: vinculación entre la investigación y la práctica (desempeños de comprensión).", "o": [["A", "copiar en el cuaderno las definiciones de cuenca, caudal y concesión de aguas que aparecen en el texto guía.", "Copiar definiciones es una actividad de reproducción; no exige al estudiante usar el conocimiento en una situación nueva ni muestra comprensión.", false], ["B", "responder un cuestionario de selección múltiple sobre las fechas y los datos principales de la unidad estudiada.", "Un cuestionario de datos y fechas verifica recuerdo de información, no el uso flexible del conocimiento que caracteriza a un desempeño de comprensión.", false], ["C", "elaborar una propuesta argumentada para un conflicto por el agua del municipio, usando los conceptos estudiados.", "Los desempeños de comprensión piden ir más allá de la información dada: explicar, argumentar, aplicar y crear con lo que se sabe. Proponer una solución argumentada a un conflicto real cumple esa condición.", true]]}, {"id": "PD-146", "niv": 2, "e": "En la EpC, la valoración diagnóstica continua se caracteriza por", "f": "Stone Wiske, M. (comp.) (1999). La Enseñanza para la Comprensión: vinculación entre la investigación y la práctica (valoración diagnóstica continua).", "o": [["A", "concentrarse en una prueba final que certifique si los estudiantes alcanzaron las metas de comprensión.", "Una prueba final única es una valoración sumativa; la EpC propone valorar a lo largo de toda la unidad para que la información sirva para mejorar mientras se aprende.", false], ["B", "acompañar los desempeños de toda la unidad con criterios públicos y retroalimentación frecuente.", "La EpC concibe la valoración diagnóstica continua como un proceso permanente, con criterios claros, públicos y relacionados con las metas, y con retroalimentación frecuente del docente y de los pares.", true], ["C", "realizarse al inicio de la unidad para identificar los saberes previos y agrupar a los estudiantes por nivel.", "Explorar saberes previos es útil, pero la valoración de la EpC no se limita al inicio: es continua y acompaña todos los desempeños de la unidad.", false]]}, {"id": "PD-147", "niv": 3, "e": "Desde la EpC, frente al estudiante que recita la definición pero no explica el efecto de la deforestación, usted concluye que", "f": "Stone Wiske, M. (comp.) (1999). La Enseñanza para la Comprensión: vinculación entre la investigación y la práctica (capítulo de D. Perkins: ¿Qué es la comprensión?).", "o": [["A", "no comprende porque le falta memorizar otras definiciones relacionadas con el ciclo del agua y los suelos.", "Memorizar más definiciones no resuelve la dificultad: el problema no es la cantidad de información, sino la capacidad de usarla para explicar situaciones nuevas.", false], ["B", "ya comprende el tema, porque recordar con exactitud la definición es la principal evidencia de comprensión.", "Recordar una definición es conocimiento, pero en la EpC la comprensión se evidencia en desempeños, no en la reproducción exacta de la información.", false], ["C", "aún no evidencia comprensión, porque esta implica usar el conocimiento con flexibilidad en situaciones nuevas.", "En la EpC comprender es poder pensar y actuar con flexibilidad a partir de lo que se sabe (Perkins, en Stone Wiske, 1999). El estudiante reproduce la definición, pero no la usa para explicar un fenómeno de su entorno.", true]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Formación y evaluación por competencias", "texto": "Usted es docente de matemáticas en una institución de media técnica en agroindustria en Chiquinquirá. Los estudiantes de décimo grado producen yogur en la planta escolar y lo venden en la tienda de la institución. En la reunión de área se discute qué significa «trabajar por competencias»: un colega sostiene que consiste en memorizar bien los contenidos para responder las pruebas, y otro, que es dominar una técnica a fuerza de repetirla. Usted debe diseñar la evaluación de la unidad de costos y porcentajes, y revisar cómo usar las evidencias de aprendizaje de los Derechos Básicos de Aprendizaje (DBA) de matemáticas en su planeación.", "items": [{"id": "PD-182", "niv": 1, "e": "Según los Estándares Básicos de Competencias del MEN, ser competente implica", "f": "MEN (2006). Estándares Básicos de Competencias en Lenguaje, Matemáticas, Ciencias y Ciudadanas: noción de competencia (estándares de matemáticas).", "o": [["A", "movilizar conocimientos, habilidades y actitudes para desempeñarse con sentido en contextos nuevos y retadores.", "Los estándares retoman la noción de competencia como un conjunto de conocimientos, habilidades, actitudes, comprensiones y disposiciones relacionadas entre sí para facilitar el desempeño flexible, eficaz y con sentido en contextos relativamente nuevos y retadores.", true], ["B", "dominar una técnica específica mediante la repetición frecuente de un mismo tipo de ejercicio.", "La práctica repetida desarrolla destrezas, pero la competencia exige además comprensión y capacidad de actuar en situaciones distintas a las ya ejercitadas.", false], ["C", "memorizar con precisión los contenidos de cada área, para reproducirlos en las pruebas internas y externas.", "La memorización de contenidos no equivale a competencia; los estándares enfatizan el uso flexible del conocimiento en contextos nuevos.", false]]}, {"id": "PD-183", "niv": 2, "e": "Para evaluar la competencia de calcular costos y porcentajes, la tarea más auténtica es", "f": "MEN (2006). Estándares Básicos de Competencias en Lenguaje, Matemáticas, Ciencias y Ciudadanas; MEN (2009). Documento No. 11: Fundamentaciones y orientaciones para la implementación del Decreto 1290 de 2009 (evaluación por competencias).", "o": [["A", "resolver una lista de ejercicios de porcentajes con datos inventados que no se relacionan con la planta.", "Los ejercicios descontextualizados pueden evaluar el procedimiento, pero no muestran si el estudiante sabe usarlo en una situación real de su especialidad.", false], ["B", "calcular el costo real de producir un lote de yogur en la planta escolar y justificar su precio de venta.", "Una tarea auténtica reproduce las condiciones reales en que se usa el conocimiento: exige decidir qué datos usar, calcular, interpretar y argumentar, en coherencia con la noción de competencia de los estándares.", true], ["C", "definir por escrito los conceptos de costo fijo, costo variable, margen de ganancia y punto de equilibrio.", "Definir conceptos evalúa conocimiento declarativo; no evidencia que el estudiante pueda aplicarlos para tomar decisiones en la producción.", false]]}, {"id": "PD-184", "niv": 3, "e": "Las evidencias de aprendizaje que acompañan a cada DBA le sirven a usted principalmente para", "f": "MEN (2016). Derechos Básicos de Aprendizaje V2, Matemáticas (estructura: enunciado, evidencias de aprendizaje y ejemplo).", "o": [["A", "orientar qué desempeños observar para valorar si el aprendizaje se está alcanzando.", "En los DBA (versión 2), cada enunciado se acompaña de evidencias de aprendizaje que describen desempeños observables; sirven al docente para planear actividades y valorar el avance de los estudiantes.", true], ["B", "conocer las preguntas exactas que se incluirán en la próxima aplicación de las pruebas Saber del grado.", "Los DBA no son especificaciones de las pruebas externas; las pruebas tienen marcos de referencia propios elaborados por el ICFES.", false], ["C", "establecer la nota mínima aprobatoria que la institución debe fijar en cada período académico.", "La escala de valoración y los criterios de aprobación los define cada institución en su SIEE según el Decreto 1290; los DBA no fijan notas.", false]]}]}, {"comp": "psicotecnica", "rol": "docente", "tag": "Prueba psicotécnica · Comunicación y relaciones interpersonales", "texto": "Usted es docente de transición en una institución educativa de Riohacha, La Guajira. En su grupo está Shaira, una niña wayuu cuya familia llegó hace poco de una ranchería. En su casa se habla principalmente wayuunaiki; la madre entiende poco español y el padre lo habla con fluidez. La institución cuenta con una auxiliar administrativa wayuu que en ocasiones apoya a los docentes como intérprete. Shaira participa poco en las actividades grupales, aunque se interesa mucho por las actividades de dibujo y construcción.", "items": [{"id": "PS-130", "niv": 1, "e": "Para informar a la familia sobre los avances de Shaira en el primer período, usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Comunicación y relaciones interpersonales).", "o": [["A", "envía con la niña el informe escrito del período, igual que lo hace con las demás familias del grupo.", "Tratar igual a todas las familias parece justo, pero un informe escrito en español no garantiza que esta familia comprenda los avances. La Guía 31 pide comunicar según las características del contexto y de los participantes.", false], ["B", "cita a la familia y explica despacio y en español sencillo los avances descritos en el informe del período.", "Hace un esfuerzo de adaptación, pero sigue dependiendo de un idioma que la madre entiende poco y de un solo recurso expresivo. No aprovecha los apoyos disponibles para lograr una comunicación efectiva.", false], ["C", "prepara la reunión con apoyo de la intérprete y lleva fotos y trabajos de la niña para mostrar sus avances.", "Evidencia comunicación y relaciones interpersonales (Guía 31): intercambia información «a través de diferentes estrategias y recursos, según las características del contexto y los participantes», y «combina adecuadamente los recursos expresivos del lenguaje oral, escrito y gráfico».", true]]}, {"id": "PS-131", "niv": 2, "e": "En la reunión, el padre comenta que en su cultura los niños aprenden observando a los mayores y no entiende por qué en el colegio Shaira «juega tanto». Usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Comunicación y relaciones interpersonales).", "o": [["A", "le explica que el juego hace parte de los referentes de educación inicial del Ministerio y por eso se incluye en el grado.", "La información es correcta, pero responde con un argumento de autoridad que no conecta con la experiencia de la familia. La competencia implica intercambiar ideas con empatía y comprender el punto de vista del otro.", false], ["B", "le dice que comprende su punto de vista y que, para tranquilidad de la familia, reducirá los juegos en el caso de Shaira.", "Busca complacer al padre, pero renuncia a explicar el sentido pedagógico del juego y puede perjudicar el proceso de la niña. La comunicación asertiva expresa argumentos de forma clara y respetuosa, no los abandona para evitar el desacuerdo.", false], ["C", "le pregunta cómo aprende Shaira en casa y, a partir de esos ejemplos, le explica por qué el juego también es aprendizaje.", "Corresponde a comunicación y relaciones interpersonales (Guía 31): «escucha con atención y comprende puntos de vista de los demás, demostrando tolerancia frente a diferentes opiniones» y «expresa argumentos de forma clara y respetuosa», partiendo de la experiencia de la familia.", true]]}, {"id": "PS-132", "niv": 3, "e": "En una reunión posterior, la madre permanece callada y evita mirarlo; la intérprete le comenta que en su comunidad no se acostumbra contradecir a un maestro. Para saber si la familia está de acuerdo con los compromisos propuestos, usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Comunicación y relaciones interpersonales).", "o": [["A", "hace preguntas abiertas sobre cómo ven los compromisos en casa y propone continuar la conversación donde la familia se sienta cómoda.", "Evidencia comunicación y relaciones interpersonales (Guía 31): atiende el lenguaje no verbal, «identifica y comprende» las emociones de otros y «realiza preguntas [...] que permiten aclarar una idea o situación», ajustando el espacio al contexto cultural de la familia.", true], ["B", "le pide a la intérprete que, después de la reunión, averigüe en privado si la familia está realmente de acuerdo.", "La intención es conocer la opinión real, pero delega en otra persona la relación con la familia y no construye confianza directa. La competencia exige que el propio docente genere las condiciones para el intercambio.", false], ["C", "le pregunta directamente a la madre si está de acuerdo con cada compromiso y deja registradas sus respuestas en el acta.", "Las preguntas son claras y concretas, pero con la información que dio la intérprete, un «sí» puede ser solo cortesía y no un acuerdo real. No se ajusta a las características culturales del interlocutor.", false]]}]}, {"comp": "psicotecnica", "rol": "docente", "tag": "Prueba psicotécnica · Liderazgo", "texto": "Usted es docente de educación física en un colegio oficial de Pasto. La institución tiene como uno de sus valores la convivencia pacífica, y el comité de convivencia identificó que la mayoría de conflictos entre estudiantes ocurren en los descansos. Usted propuso el proyecto «Recreos activos», con juegos y torneos organizados en el patio, y el comité lo aprobó con la meta de reducir en 40 % los conflictos reportados en el descanso durante el año. Al inicio, pocos estudiantes y docentes muestran interés.", "items": [{"id": "PS-139", "niv": 1, "e": "Para lograr que estudiantes y docentes se comprometan con los recreos activos, usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Liderazgo).", "o": [["A", "elabora el cronograma de actividades y solicita a coordinación que la participación sea obligatoria para todos los cursos.", "La obligatoriedad asegura asistencia, pero no motivación ni apropiación. El liderazgo, según la Guía 31, busca «motivar e involucrar» a la comunidad con la visión institucional.", false], ["B", "invita a los líderes estudiantiles a diseñar con usted las actividades y a explicar a sus compañeros cómo aportan a la convivencia.", "Evidencia liderazgo (Guía 31): «capacidad para motivar e involucrar a los miembros de la comunidad educativa con la construcción de una identidad común», y transmite el valor institucional de la convivencia a través de los propios estudiantes.", true], ["C", "organiza usted mismo todas las actividades de los primeros meses para demostrar que el proyecto funciona.", "Muestra compromiso personal, pero concentra el proyecto en una sola persona y no involucra a la comunidad. El liderazgo consiste en lograr que otros se comprometan con metas comunes.", false]]}, {"id": "PS-140", "niv": 3, "e": "Un grupo de estudiantes de once se burla de los recreos activos y desanima a los más pequeños. Usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Liderazgo).", "o": [["A", "les explica que su actitud contradice los valores institucionales y que, si continúa, informará a su director de grupo.", "Recordar los valores es pertinente, pero la advertencia busca controlar la conducta y no transformarla. El liderazgo implica influir positivamente en el comportamiento de los demás.", false], ["B", "conversa con ellos, reconoce la influencia que tienen en los menores y les propone liderar una actividad diseñada por ellos.", "Corresponde al liderazgo (Guía 31): «influye positivamente en el comportamiento de los demás», «expresa expectativas positivas de los demás y demuestra interés por el desarrollo de las personas», convirtiendo la resistencia en compromiso.", true], ["C", "permite que los de once participen solo si lo desean y se concentra en los cursos que muestran más interés.", "Evita un desgaste, pero deja sin atender a un grupo con gran influencia en los menores. No evidencia interés por el desarrollo de esas personas ni por sumarlas a la meta común.", false]]}, {"id": "PS-141", "niv": 2, "e": "A mitad de año, los conflictos reportados en el descanso se han reducido 20 %, la mitad de la meta del año. Usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Orientación al logro).", "o": [["A", "propone al comité de convivencia ajustar la meta al 25 %, ya que el 40 % resultó poco realista para el colegio.", "Revisar metas puede ser legítimo con evidencias, pero aquí se rebaja la meta a mitad de camino sin intentar mejorar las acciones. No refleja metas elevadas ni persistencia.", false], ["B", "presenta el 20 % como un buen resultado parcial y mantiene el proyecto sin cambios hasta el cierre del año.", "Reconocer el avance es válido, pero mantener todo igual con la mitad de la meta lograda no apunta al mejoramiento continuo. La orientación al logro implica ajustar para alcanzar estándares elevados.", false], ["C", "analiza en qué momentos y lugares persisten los conflictos y ajusta las actividades para acercarse a la meta.", "Evidencia orientación al logro (Guía 31): dirige su comportamiento «hacia el cumplimiento de estándares elevados, con miras al mejoramiento continuo» y muestra persistencia frente a los obstáculos.", true]]}, {"id": "PS-142", "niv": 1, "e": "En temporada de lluvias, el patio queda inutilizable varios días por semana. Usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Iniciativa).", "o": [["A", "diseña con los líderes estudiantiles una versión de las actividades para pasillos y salones cubiertos.", "Evidencia iniciativa (Guía 31): «demuestra recursividad y flexibilidad, y se adapta con rapidez a diferentes contextos», manteniendo el proyecto en marcha con una alternativa propia.", true], ["B", "solicita a la rectoría que gestione la construcción de una cubierta para el patio del colegio.", "Puede ser una mejora a largo plazo, pero no resuelve la situación actual y depende de otros. La iniciativa implica proponer y emprender alternativas con autonomía.", false], ["C", "suspende los recreos activos los días de lluvia y los reanuda cuando el patio vuelva a estar disponible.", "Es una decisión práctica, pero interrumpe el proyecto justo cuando los estudiantes permanecen más tiempo en espacios reducidos. No muestra flexibilidad para adaptarse.", false]]}]}, {"comp": "psicotecnica", "rol": "docente", "tag": "Prueba psicotécnica · Negociación y mediación", "texto": "Usted es directora de grupo de segundo de primaria en un colegio oficial de Neiva. En el descanso, Valentina y Sofía discutieron por un juego, se jalaron el cabello y ambas terminaron llorando, sin lesiones. Usted y otra docente vieron parte de lo ocurrido. A la salida, las madres de las dos niñas se encuentran en la puerta del colegio y empiezan a discutir en voz alta frente a los estudiantes, cada una acusando a la hija de la otra de haber empezado.", "items": [{"id": "PS-172", "niv": 1, "e": "Al ver la discusión entre las madres en la puerta del colegio, usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Negociación y mediación).", "o": [["A", "se acerca, les propone continuar la conversación en un espacio aparte sin los niños y escucha a cada una.", "Evidencia negociación y mediación (Guía 31): «interviene efectiva y oportunamente ante situaciones de conflicto» y crea condiciones de respeto para comprender los motivos de las implicadas.", true], ["B", "lleva a las niñas al salón y deja que las madres resuelvan el asunto entre ellas como personas adultas.", "Protege a las niñas de la escena, pero deja escalar un conflicto que se origina en el colegio. Omite intervenir cuando es oportuno.", false], ["C", "les pide que se retiren y que presenten sus quejas por escrito a coordinación al día siguiente.", "Detiene la discusión pública, pero aplaza el conflicto y lo traslada a la autoridad sin escuchar a nadie. No es una intervención que genere confianza.", false]]}, {"id": "PS-173", "niv": 2, "e": "Ya reunidas, cada madre insiste en que la otra niña empezó la pelea. Usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Negociación y mediación).", "o": [["A", "les explica que, según lo observado, la responsabilidad fue compartida y que ambas niñas recibirán la misma consecuencia.", "La conclusión es equitativa, pero la decisión se impone sin construir acuerdo con las madres ni atender sus preocupaciones. No genera confianza en el proceso.", false], ["B", "comparte lo que observó, sin culpar a ninguna niña, y pregunta a cada madre qué necesita para que su hija esté tranquila.", "Corresponde a negociación y mediación (Guía 31): valora «con imparcialidad los motivos de los implicados» y «facilita acuerdos [...] anteponiendo los intereses comunes», en este caso el bienestar de ambas niñas.", true], ["C", "les asegura que investigará quién inició la pelea y que les informará su decisión en los próximos días.", "Busca ser justa, pero convierte la mediación en un juicio sobre culpables y deja a las madres fuera de la solución. La competencia se orienta a acuerdos, no a fallos.", false]]}, {"id": "PS-174", "niv": 3, "e": "Para que la situación no se repita entre las dos niñas, usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Negociación y mediación). Decreto 1965 de 2013, art. 42 (situaciones tipo I).", "o": [["A", "las sienta en lugares separados del salón y pide a los docentes de turno vigilarlas durante los descansos.", "Reduce el contacto y el riesgo, pero no enseña a las niñas a manejar sus diferencias. Es control externo, no una solución duradera.", false], ["B", "les pide que se disculpen una con la otra frente al grupo, para que todo el curso aprenda de lo que sucedió en el descanso.", "Busca una reparación y un aprendizaje colectivo, pero una disculpa pública forzada expone a las niñas y no surge de un acuerdo. No genera confianza ni compromisos propios.", false], ["C", "hace con ellas un ejercicio guiado para expresar lo que sintieron y acordar cómo tratarse, y hace seguimiento.", "Evidencia negociación y mediación (Guía 31): «forma a sus estudiantes en estrategias de resolución pacífica de conflictos» y «promueve soluciones duraderas y hace seguimiento a los compromisos adquiridos por las partes».", true]]}]}, {"comp": "psicotecnica", "rol": "docente", "tag": "Prueba psicotécnica · Compromiso social e institucional", "texto": "Usted es docente de física de media en un colegio oficial de Quibdó. Se acerca el cierre del tercer período y la coordinación pidió entregar las notas en 48 horas. Usted tiene pendiente calificar los trabajos finales de un grupo de once. Además, la rectoría lo designó para representar a la institución en un foro municipal sobre permanencia escolar, organizado por la alcaldía, en el que participarán funcionarios, organizaciones sociales y otros colegios.", "items": [{"id": "PS-175", "niv": 1, "e": "El padre de un estudiante de once, concejal del municipio, le pide que «le ayude» a su hijo con la nota de física para que no pierda el año. Usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Compromiso social e institucional). Decreto 1290 de 2009, art. 4 (estrategias de apoyo en el SIEE).", "o": [["A", "le explica con respeto que la nota depende del desempeño del estudiante y le ofrece revisar un plan de apoyo según el SIEE.", "Evidencia compromiso social e institucional (Guía 31): «demuestra honestidad e integridad en su ejercicio profesional» y «muestra respeto hacia [...] la comunidad», orientando al padre hacia las estrategias de apoyo previstas en el sistema de evaluación.", true], ["B", "rechaza la solicitud, le pide que se retire y le advierte que podría denunciarlo por presionar a un docente.", "Defiende la integridad de la evaluación, pero responde de forma confrontacional y sin ofrecer alternativas al estudiante. La competencia incluye mostrar respeto hacia la comunidad.", false], ["C", "le dice que lo pensará y consulta al rector cómo proceder, dada la posición que el padre ocupa en el municipio.", "Consultar parece prudente, pero deja abierta una solicitud que debía rechazarse con claridad y le da peso a la posición política del padre. No evidencia integridad en el ejercicio profesional.", false]]}, {"id": "PS-176", "niv": 2, "e": "Para entregar en el plazo las notas del grupo de once cuyos trabajos aún no ha calificado, usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Compromiso social e institucional).", "o": [["A", "asigna a cada trabajo la nota promedio que el estudiante traía en el período, para cumplir con la fecha.", "Cumple el plazo, pero registra valoraciones que no corresponden al trabajo presentado. Falta a la honestidad y a la calidad con que deben atenderse las tareas asignadas.", false], ["B", "entrega las demás notas en la fecha y pide una prórroga para ese grupo, aunque conocía el plazo desde hace semanas.", "Solicitar una prórroga puede ser válido ante un imprevisto, pero aquí el plazo se conocía con anticipación. No evidencia la respuesta oportuna que exige la competencia.", false], ["C", "organiza su tiempo para calificar todos los trabajos con los criterios previstos y entregar dentro del plazo.", "Corresponde al compromiso social e institucional (Guía 31): «responde con oportunidad, eficiencia y calidad a las tareas que se le asignan», sin sacrificar la calidad de la evaluación.", true]]}, {"id": "PS-177", "niv": 3, "e": "En el foro, el moderador le pregunta su opinión sobre una decisión reciente del rector con la que usted no está de acuerdo. Usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Compromiso social e institucional).", "o": [["A", "expresa con respeto su desacuerdo, ya que en un espacio público de discusión debe primar la honestidad.", "La honestidad es un valor de la competencia, pero en ese espacio usted actúa como representante de la institución y no a título personal. Expresar allí su desacuerdo antepone su posición a la institucional.", false], ["B", "expone la decisión y sus razones como representante de la institución, y lleva sus reparos a los espacios internos.", "Evidencia compromiso social e institucional (Guía 31): «representa adecuadamente a la institución en actividades fuera de la misma», anteponiendo los intereses institucionales a los personales. Es transparente sobre el papel en que habla y no oculta su opinión: la lleva a los espacios internos donde puede incidir en la decisión.", true], ["C", "evita responder la pregunta y sugiere que la consulten directamente con el rector de la institución.", "Evita un conflicto, pero deja sin respuesta a los asistentes y no cumple la tarea de representación que se le asignó. No evidencia una representación adecuada.", false]]}, {"id": "PS-178", "niv": 2, "e": "En el foro, una organización comunitaria ofrece apoyo a los colegios para acompañar a estudiantes en riesgo de abandonar sus estudios. Usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Iniciativa).", "o": [["A", "conversa con sus representantes sobre cómo podrían trabajar juntos y lleva a la institución una propuesta concreta.", "Evidencia iniciativa (Guía 31): trabaja «proactivamente y con autonomía» y «propone y desarrolla ideas [...] o proyectos, para influir positivamente en la institución y la comunidad», tramitándolos por la vía institucional.", true], ["B", "le sugiere a la organización enviar una carta al rector, que es quien puede autorizar alianzas con entidades externas.", "Respeta el conducto, pero deja toda la gestión en manos de otros y puede perder la oportunidad. La iniciativa implica actuar proactivamente frente a una necesidad institucional.", false], ["C", "acuerda con la organización iniciar el acompañamiento en sus grupos la semana siguiente, para no perder la oportunidad.", "Actúa con rapidez, pero compromete a la institución sin autorización en una alianza con una entidad externa. La autonomía de la iniciativa no reemplaza los procedimientos institucionales.", false]]}]}];
const CFG = {"titulo": "Simulacro 3 · Concurso Docente 2026–2027", "modo": "simulacro", "minutos": 194, "componentes": {"lectura_critica": "Lectura crítica", "razonamiento_cuantitativo": "Razonamiento cuantitativo", "competencias_blandas": "Competencias blandas y ciudadanas", "pedagogia_normativa": "Competencias pedagógicas y normativa", "psicotecnica": "Prueba psicotécnica"}, "niveles": {"1": "Básico", "2": "Intermedio", "3": "Avanzado"}, "clave": "simulacro-03.html"};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY = 'sim-docente:' + CFG.clave;
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}
function save(){try{localStorage.setItem(KEY, JSON.stringify(ST))}catch(e){}}
let ST = load();
ST.r = ST.r || {};
$('#tit').textContent = CFG.titulo;
const ITEMS = [];
DATA.forEach(c => c.items.forEach(it => { it.caso = c; ITEMS.push(it); }));

function justHTML(it){
  return '<div class="just">' + it.o.map(o => `<div><b>${o[0]}.</b> <span class="${o[3]?'okt':'not'}">${o[3]?'Es correcta.':'Es incorrecta.'}</span> ${esc(o[2])}</div>`).join('') +
    `<div class="src">Referencia: ${esc(it.f)}</div></div>`;
}
function itemHTML(it, n, mode){
  const r = ST.r[it.id];
  const reveal = mode === 'review' || (CFG.modo === 'practica' && r);
  let h = `<div class="item" id="i-${it.id}"><p class="enun"><span class="n">${n}.</span> <span class="niv">${CFG.niveles[it.niv]}</span> ${esc(it.e)}</p>`;
  it.o.forEach(o => {
    let cls = '';
    if (reveal) { if (o[3]) cls = 'ok'; else if (r === o[0]) cls = 'no'; }
    else if (r === o[0]) cls = 'sel';
    h += `<button class="op ${cls}" data-id="${it.id}" data-l="${o[0]}" ${reveal?'disabled':''}><span class="l">${o[0]}.</span><span>${esc(o[1])}</span></button>`;
  });
  if (reveal) {
    if (mode === 'review') h += `<div class="${r===keyOf(it)?'res-ok':'res-no'}" style="font-size:14px;margin-top:4px">${r ? (r===keyOf(it)?'Respondiste ' + r + ': correcto.':'Respondiste ' + r + '. La respuesta correcta es ' + keyOf(it) + '.') : 'Sin responder. La respuesta correcta es ' + keyOf(it) + '.'}</div>`;
    h += justHTML(it);
  }
  return h + '</div>';
}
const keyOf = it => it.o.find(o => o[3])[0];

function renderList(list, mode){
  let h = '', last = null, n = 0;
  list.forEach(it => {
    n++;
    if (it.caso !== last) { last = it.caso; h += `<div class="caso"><div class="tag">${esc(it.caso.tag)}</div><p>${esc(it.caso.texto)}</p></div>`; }
    h += itemHTML(it, n, mode);
  });
  return h;
}

// ---------- PRÁCTICA ----------
let LIST = [];
let FILTRO = ST.f || {comp:'', niv:'', rol:''};
function practica(){
  const comps = Object.entries(CFG.componentes).map(([k,v]) => `<option value="${k}" ${FILTRO.comp===k?'selected':''}>${esc(v)}</option>`).join('');
  const nivs = Object.entries(CFG.niveles).map(([k,v]) => `<option value="${k}" ${FILTRO.niv===k?'selected':''}>${esc(v)}</option>`).join('');
  const list = ITEMS.filter(it => (!FILTRO.comp || it.caso.comp===FILTRO.comp) && (!FILTRO.niv || String(it.niv)===FILTRO.niv) && (!FILTRO.rol || it.caso.rol===FILTRO.rol));
  const resp = list.filter(it => ST.r[it.id]); const ok = resp.filter(it => ST.r[it.id]===keyOf(it));
  $('#main').innerHTML = `<div class="panel"><p style="margin-top:0">Elige un tema y un nivel. Al responder verás de inmediato si acertaste y la explicación de cada opción.</p>
  <div class="row"><select id="fc"><option value="">Todos los temas</option>${comps}</select>
  <select id="fn"><option value="">Todos los niveles</option>${nivs}</select>
  <select id="fr"><option value="">Docentes y directivos</option><option value="docente" ${FILTRO.rol==='docente'?'selected':''}>Solo docentes</option><option value="directivo" ${FILTRO.rol==='directivo'?'selected':''}>Solo directivos</option></select>
  <button class="btn sec" id="borrar">Borrar mis respuestas</button></div>
  <p class="stat" id="pst" style="margin-bottom:0">${list.length} preguntas · respondidas ${resp.length} · aciertos ${ok.length}${resp.length? ' (' + Math.round(100*ok.length/resp.length) + ' %)':''}</p></div>` + renderList(list, 'practica');
  $('#prog').textContent = `${ok.length}/${resp.length} aciertos`;
  ['fc','fn','fr'].forEach((id,i) => $('#'+id).onchange = e => { FILTRO[['comp','niv','rol'][i]] = e.target.value; ST.f = FILTRO; save(); practica(); });
  LIST = list;
  $('#borrar').onclick = () => { list.forEach(it => delete ST.r[it.id]); save(); practica(); };
}

// ---------- SIMULACRO ----------
let tick = null;
function inicio(){
  const n = ITEMS.length, cnt = {};
  ITEMS.forEach(it => cnt[it.caso.comp] = (cnt[it.caso.comp]||0) + 1);
  const h = Math.floor(CFG.minutos/60), m = CFG.minutos%60;
  $('#main').innerHTML = `<div class="panel"><h2 style="margin-top:0;color:var(--pri)">Instrucciones</h2>
  <p>Este simulacro tiene <b>${n} preguntas</b> en el formato de Prueba de Juicio Situacional: un caso, enunciados que se completan y tres opciones con una sola respuesta correcta.</p>
  <table>${Object.entries(cnt).map(([k,v]) => `<tr><td>${esc(CFG.componentes[k])}</td><td class="r">${v}</td></tr>`).join('')}</table>
  <p>Tiempo sugerido: <b>${h ? h + ' h ' : ''}${m ? m + ' min' : ''}</b> (unos ${Math.round(CFG.minutos*60/n/6)/10} minutos por pregunta). Cuando se acaba el tiempo puedes seguir, pero el cronómetro lo indica.</p>
  <p>Tus respuestas se guardan en este navegador. Al terminar verás tu puntaje por componente y por nivel, y la explicación de cada pregunta.</p>
  <button class="btn" id="go">${ST.t0 ? 'Continuar el simulacro' : 'Comenzar'}</button></div>`;
  $('#prog').textContent = `${n} preguntas`;
  $('#go').onclick = () => { if (!ST.t0) { ST.t0 = Date.now(); save(); } examen(); };
}
function reloj(){
  const rest = CFG.minutos*60 - Math.floor((Date.now() - ST.t0)/1000);
  const a = Math.abs(rest), hh = Math.floor(a/3600), mm = Math.floor(a%3600/60), ss = a%60;
  const t = (rest < 0 ? '+' : '') + (hh ? hh + ':' : '') + String(mm).padStart(2,'0') + ':' + String(ss).padStart(2,'0');
  $('#timer').textContent = rest < 0 ? 'Tiempo cumplido ' + t : '⏱ ' + t;
  $('#timer').classList.toggle('low', rest < 600);
}
function examen(){
  $('#main').innerHTML = renderList(ITEMS, 'examen') + `<div class="panel"><button class="btn" id="fin">Terminar y calificar</button></div>`;
  progreso(); reloj(); clearInterval(tick); tick = setInterval(reloj, 1000);
  $('#fin').onclick = () => {
    const faltan = ITEMS.length - Object.keys(ST.r).filter(k => ITEMS.some(i => i.id===k)).length;
    $('#mtxt').textContent = faltan ? `Te faltan ${faltan} preguntas por responder. ¿Quieres calificar de todos modos?` : '¿Quieres terminar y ver tu calificación?';
    $('#modal').classList.remove('hide');
  };
}
function progreso(){
  const r = ITEMS.filter(it => ST.r[it.id]).length;
  $('#prog').textContent = `Respondidas ${r}/${ITEMS.length}`;
}
$('#mno').onclick = () => $('#modal').classList.add('hide');
$('#msi').onclick = () => { $('#modal').classList.add('hide'); ST.fin = Date.now(); save(); resultados(); };
function resultados(){
  clearInterval(tick);
  const ok = ITEMS.filter(it => ST.r[it.id] === keyOf(it)).length;
  const pct = Math.round(1000*ok/ITEMS.length)/10;
  const g = (fn, lab) => { const m = {}; ITEMS.forEach(it => { const k = fn(it); m[k] = m[k] || [0,0]; m[k][1]++; if (ST.r[it.id]===keyOf(it)) m[k][0]++; });
    return Object.entries(m).map(([k,v]) => `<tr><td>${esc(lab(k))}</td><td class="r">${v[0]}/${v[1]}</td><td class="r">${Math.round(100*v[0]/v[1])} %</td></tr>`).join(''); };
  const mins = Math.round(((ST.fin||Date.now()) - ST.t0)/60000);
  $('#timer').textContent = `Tiempo usado: ${Math.floor(mins/60) ? Math.floor(mins/60) + ' h ' : ''}${mins%60} min`;
  $('#prog').textContent = `${ok}/${ITEMS.length} aciertos`;
  $('#main').innerHTML = `<div class="panel"><div class="big">${String(pct).replace('.',',')} %</div>
  <p style="margin-top:4px">${ok} de ${ITEMS.length} respuestas correctas. ${pct >= 70 ? 'Muy buen resultado: repasa las explicaciones de tus errores para afianzarlo.' : pct >= 60 ? 'Vas bien, pero con poco margen: refuerza los componentes con menor porcentaje.' : 'Todavía no estás en zona segura: practica por tema los componentes con menor porcentaje.'}</p>
  <p class="aviso">Referencia: en el concurso el mínimo aprobatorio de la prueba eliminatoria es 60 puntos (70 para directivos). Este porcentaje de aciertos es una guía de preparación; la CNSC calcula su puntaje con su propia escala.</p>
  <h3>Por componente</h3><table>${g(it => it.caso.comp, k => CFG.componentes[k])}</table>
  <h3>Por nivel</h3><table>${g(it => it.niv, k => CFG.niveles[k])}</table>
  <div class="row" style="margin-top:14px"><button class="btn" id="solo">Ver solo mis errores</button><button class="btn sec" id="todas">Ver todas</button><button class="btn sec" id="otra">Reiniciar el simulacro</button></div></div><div id="rev"></div>`;
  const rev = errs => { const l = errs ? ITEMS.filter(it => ST.r[it.id] !== keyOf(it)) : ITEMS; $('#rev').innerHTML = renderList(l, 'review'); };
  rev(true);
  $('#solo').onclick = () => rev(true); $('#todas').onclick = () => rev(false);
  $('#otra').onclick = () => { ST = {r:{}}; save(); inicio(); window.scrollTo(0,0); };
}

document.addEventListener('click', e => {
  const b = e.target.closest('button.op'); if (!b || b.disabled) return;
  ST.r[b.dataset.id] = b.dataset.l; save();
  const it = ITEMS.find(i => i.id === b.dataset.id);
  const n = b.closest('.item').querySelector('.n').textContent.replace('.','');
  b.closest('.item').outerHTML = itemHTML(it, n, CFG.modo === 'practica' ? 'practica' : 'examen');
  if (CFG.modo === 'practica') { const resp = LIST.filter(i => ST.r[i.id]); const ok = resp.filter(i => ST.r[i.id]===keyOf(i)).length; $('#prog').textContent = `${ok}/${resp.length} aciertos`; $('#pst').textContent = `${LIST.length} preguntas · respondidas ${resp.length} · aciertos ${ok} (${Math.round(100*ok/resp.length)} %)`; }
  else progreso();
});

if (CFG.modo === 'practica') practica();
else if (ST.fin) resultados();
else if (ST.t0) examen();
else inicio();
</script>
</body>
</html>
