<script>
const DATA = [{"comp": "lectura_critica", "rol": "docente", "tag": "Lectura crítica", "texto": "La biblioteca de una institución urbana publicó en su cartelera la siguiente infografía, elaborada a partir de una encuesta a 600 estudiantes:\n\n«¿LEES POR GUSTO FUERA DEL COLEGIO?\nEstudiantes que leen por gusto al menos una vez por semana: grado quinto, 68 %; grado séptimo, 51 %; grado noveno, 37 %; grado once, 29 %.\nLo que más leen quienes leen por gusto: cómics y novela gráfica, 34 %; textos en redes sociales, 31 %; novelas, 22 %; otros, 13 %.\nPrincipal razón de quienes no leen por gusto: \"no tengo tiempo\", 46 %; \"no encuentro libros que me gusten\", 32 %; \"leer es aburrido\", 22 %.\nConclusión del equipo de la biblioteca: el gusto por la lectura se pierde en el colegio. Hay que cambiar el plan lector.»", "items": [{"id": "LC-105", "niv": 1, "e": "Según la infografía, entre grado quinto y grado once el porcentaje de estudiantes que lee por gusto disminuye en", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: identificar y entender los contenidos locales en textos discontinuos (tablas, gráficas e infografías).", "o": [["A", "14 puntos porcentuales.", "Corresponde a la caída entre grado séptimo (51 %) y grado noveno (37 %), no a la diferencia entre quinto y once.", false], ["B", "17 puntos porcentuales.", "Corresponde a la caída entre grado quinto (68 %) y grado séptimo (51 %); la pregunta abarca hasta grado once.", false], ["C", "39 puntos porcentuales.", "Grado quinto registra 68 % y grado once, 29 %: 68 − 29 = 39 puntos porcentuales. Localizar y relacionar datos de una infografía es comprensión de contenidos locales en textos discontinuos.", true]]}, {"id": "LC-106", "niv": 2, "e": "La conclusión «el gusto por la lectura se pierde en el colegio» es discutible porque", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: reflexionar a partir de un texto y evaluar su contenido (validez de argumentos y solidez de las evidencias).", "o": [["A", "los datos muestran una caída según el grado, pero no prueban que su causa esté en el colegio.", "La encuesta registra una tendencia asociada al grado (y a la edad), pero también podrían influir otros factores, como la carga de actividades o los intereses propios de la adolescencia. Atribuir la caída al colegio es un salto causal que los datos no sustentan.", true], ["B", "el porcentaje de grado once resulta alto si se compara con el de los estudiantes de otros países.", "La infografía no presenta datos de otros países; esta comparación no puede hacerse con la información disponible.", false], ["C", "la mayoría de los estudiantes de todos los grados afirma que no lee por gusto.", "Es falso: en grado quinto el 68 % y en grado séptimo el 51 % sí leen por gusto, es decir, la mayoría.", false]]}, {"id": "LC-107", "niv": 2, "e": "A partir de las razones que dan quienes no leen por gusto, usted puede inferir razonablemente que", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: identificar y entender los contenidos locales en textos discontinuos (tablas, gráficas e infografías).", "o": [["A", "la mayoría de los estudiantes encuestados considera que leer es aburrido.", "Solo el 22 % de quienes no leen por gusto da esa razón; no es la mayoría ni de ese grupo ni del total.", false], ["B", "cerca de un tercio de ese grupo no encuentra libros de su interés, lo que invita a revisar la oferta.", "El 32 % de quienes no leen por gusto afirma no encontrar libros que le gusten, cerca de un tercio. Es una inferencia prudente que se desprende directamente del dato.", true], ["C", "los estudiantes de grado once son quienes más afirman que no tienen tiempo para leer por gusto fuera del colegio.", "La infografía no presenta las razones por grado; no permite saber en qué grado se concentra la respuesta «no tengo tiempo».", false]]}, {"id": "LC-108", "niv": 3, "e": "Para que la propuesta de «cambiar el plan lector» tenga mejor sustento, el equipo de la biblioteca debería averiguar", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: reflexionar a partir de un texto y evaluar su contenido (validez de argumentos y solidez de las evidencias).", "o": [["A", "qué porcentaje de los estudiantes de grado quinto prefiere leer cómics y novelas gráficas en lugar de novelas.", "Es un dato sobre preferencias en un grado, que no pone a prueba la relación entre el plan lector y la caída observada.", false], ["B", "cuántos libros nuevos ha comprado la biblioteca en los últimos cinco años.", "Este dato describe la colección, pero no permite saber si el plan lector tiene relación con la pérdida del gusto por la lectura.", false], ["C", "si la caída coincide con las lecturas exigidas en clase o se da también en otros colegios.", "La propuesta supone que el plan lector causa la pérdida del gusto. Contrastar la caída con las lecturas exigidas, y con lo que ocurre en otros colegios, permitiría saber si la causa está en la institución o en factores comunes a la edad. Identificar qué información fortalecería una conclusión es evaluar su solidez.", true]]}]}, {"comp": "lectura_critica", "rol": "docente", "tag": "Lectura crítica", "texto": "Lea el siguiente fragmento de un relato:\n\n«La maestra Elvira llegó a la vereda un martes de lluvia, con una maleta de cartón y una caja de tizas que se le había mojado en el camino. La escuela era un salón de bahareque con un tablero que alguien había pintado con hollín. Los niños la miraron desde la puerta como se mira a quien viene de paso; ya habían visto llegar y partir a tres maestras en dos años.\n\nEsa noche, Elvira secó las tizas una por una sobre el fogón de doña Carmen. A la mañana siguiente escribió su nombre en el tablero y, debajo, con letra más pequeña: \"Me quedo\". Nadie dijo nada. Pero al mediodía, cuando terminó la clase, el niño más grande se acercó y, sin mirarla, le preguntó si sabía nadar, porque en junio el río crecía y había que cruzarlo para llegar.»", "items": [{"id": "LC-141", "niv": 1, "e": "La frase «como se mira a quien viene de paso» sugiere que los niños", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: comprender cómo se articulan las partes de un texto literario (sentidos implícitos y recursos narrativos).", "o": [["A", "sentían curiosidad por saber de dónde venía la maestra.", "El relato no habla de curiosidad por su origen; la mirada se relaciona con la experiencia de ver partir a otras maestras.", false], ["B", "esperaban que la nueva maestra también se fuera pronto.", "La frase se explica enseguida: «ya habían visto llegar y partir a tres maestras en dos años». Su mirada anticipa otra partida.", true], ["C", "rechazaban a la maestra por ser de una región distinta.", "Nada en el texto indica rechazo por su procedencia; la desconfianza viene de las partidas anteriores.", false]]}, {"id": "LC-142", "niv": 2, "e": "La pregunta que el niño más grande hace al final del fragmento puede interpretarse como", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: comprender cómo se articulan las partes de un texto literario (sentidos implícitos y recursos narrativos).", "o": [["A", "una forma indirecta de aceptar que la maestra se quedará y de prepararla para lo que viene.", "La pregunta responde al «Me quedo»: el niño piensa en junio, cuando ella todavía estará allí, y le advierte sobre el río. El relato sugiere la aceptación sin decirla. Interpretar sentidos implícitos es propio de la lectura de textos literarios.", true], ["B", "una advertencia para convencer a la maestra de que se vaya de la vereda antes de junio.", "El niño no le sugiere irse; su pregunta supone que ella seguirá allí cuando el río crezca.", false], ["C", "una burla dirigida a la maestra por no conocer los peligros de la vereda.", "Nada en el tono del relato sugiere burla; el niño se acerca después de leer «Me quedo».", false]]}, {"id": "LC-143", "niv": 2, "e": "En el relato, el detalle de las tizas secadas «una por una» sobre el fogón contribuye a", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: comprender cómo se articulan las partes de un texto literario (sentidos implícitos y recursos narrativos).", "o": [["A", "describir las costumbres de la familia que hospedó a la maestra en la vereda.", "El fogón de doña Carmen es el lugar donde ocurre la acción, pero el detalle se centra en la maestra, no en las costumbres de la familia.", false], ["B", "explicar por qué la escuela de la vereda no contaba con ningún material escolar.", "El detalle no explica la falta de materiales; muestra lo que hace la maestra con los que trajo.", false], ["C", "mostrar el empeño de la maestra por enseñar aun con lo poco que tenía a su alcance.", "Secar cada tiza revela paciencia y determinación para dar clase al día siguiente, a pesar de las condiciones. Es un detalle que caracteriza al personaje sin nombrar sus cualidades.", true]]}, {"id": "LC-144", "niv": 3, "e": "Al comparar la actitud de los niños al inicio y al final del fragmento, usted explica a sus estudiantes que el relato", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: comprender cómo se articulan las partes de un texto literario (sentidos implícitos y recursos narrativos).", "o": [["A", "sugiere un cambio en la actitud de los niños hacia la maestra sin narrarlo explícitamente.", "Al inicio, los niños la miran con distancia; al final, uno de ellos se acerca y le pregunta por algo que ocurrirá meses después. El cambio se insinúa mediante gestos, no se explica. Reconocer este recurso es comprender la construcción del sentido en el texto literario.", true], ["B", "explica con detalle las razones por las que se fueron las maestras anteriores.", "El relato solo menciona que tres maestras llegaron y se fueron; no explica sus razones.", false], ["C", "muestra que los niños rechazaron a la maestra durante todo el primer día de clase.", "Al final del primer día, el niño más grande se acerca a hablarle; eso no corresponde a un rechazo sostenido.", false]]}]}, {"comp": "lectura_critica", "rol": "docente", "tag": "Lectura crítica", "texto": "Lea el siguiente fragmento de un ensayo sobre la autoridad en el aula:\n\n«Se suele decir que los maestros han perdido autoridad, y quienes lo dicen casi siempre añoran el tiempo en que bastaba una mirada para que el salón quedara en silencio. Pero conviene distinguir. Aquel silencio no siempre era respeto; muchas veces era miedo, y el miedo obedece mientras el vigilante está presente.\n\nLa autoridad que vale la pena no se impone: se reconoce. Un estudiante reconoce la autoridad de un maestro cuando percibe que sabe lo que enseña, que es justo al evaluar y que cumple lo que promete. Esa autoridad tarda más en construirse, pero no desaparece cuando el maestro sale del salón.\n\nQuizá lo que se ha perdido no es la autoridad, sino una forma de poder que nunca debió confundirse con ella.»", "items": [{"id": "LC-171", "niv": 1, "e": "Según el texto, un estudiante reconoce la autoridad de un maestro cuando percibe que este", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: identificar y entender los contenidos locales que conforman un texto.", "o": [["A", "es exigente con las normas y sanciona a quien las incumple.", "El texto no relaciona la autoridad con la sanción; la asocia con el saber, la justicia y la coherencia.", false], ["B", "domina su materia, califica con equidad y es coherente con sus compromisos.", "El segundo párrafo enumera esas tres condiciones de manera explícita.", true], ["C", "logra que el salón quede en silencio con una sola mirada.", "Esa es la imagen del pasado que el autor pone en duda, pues ese silencio muchas veces era miedo.", false]]}, {"id": "LC-172", "niv": 2, "e": "La afirmación «el miedo obedece mientras el vigilante está presente» se usa en el texto para", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: comprender cómo se articulan las partes de un texto para darle un sentido global.", "o": [["A", "mostrar que la obediencia basada en el miedo no perdura cuando desaparece el control.", "La frase prepara el contraste con la autoridad reconocida, que «no desaparece cuando el maestro sale del salón». Identificar cómo una afirmación sostiene un contraste es comprender la articulación del texto.", true], ["B", "explicar por qué los estudiantes de antes eran más respetuosos que los de ahora.", "El autor sostiene lo contrario: aquel silencio «no siempre era respeto; muchas veces era miedo».", false], ["C", "recomendar que los docentes vigilen de cerca a los estudiantes durante toda la jornada.", "El autor no recomienda vigilar más; critica la obediencia que depende de la vigilancia.", false]]}, {"id": "LC-173", "niv": 2, "e": "La conclusión del texto se apoya en una distinción entre", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: comprender el sentido global del texto (tesis e intención comunicativa).", "o": [["A", "los maestros que enseñan bien y los maestros que evalúan con justicia.", "Saber enseñar y evaluar con justicia son, para el autor, condiciones de una misma autoridad, no dos tipos de maestro.", false], ["B", "una autoridad que se reconoce y un poder que se impone.", "La última oración lo resume: lo que se ha perdido no es la autoridad, sino «una forma de poder que nunca debió confundirse con ella». Identificar la distinción que organiza un texto es comprender su sentido global.", true], ["C", "el respeto de los estudiantes de antes y el de los estudiantes de ahora.", "El texto no compara el respeto de dos generaciones; distingue dos maneras de obtener obediencia.", false]]}, {"id": "LC-174", "niv": 3, "e": "Un lector afirma que el texto idealiza el pasado escolar. Esta objeción", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: reflexionar a partir de un texto y evaluar su contenido.", "o": [["A", "es infundada, porque el autor no se refiere en ningún momento a la escuela del pasado.", "Aunque el veredicto es correcto, la razón es falsa: el texto sí habla del pasado («el tiempo en que bastaba una mirada…»), precisamente para cuestionar la nostalgia por él.", false], ["B", "es acertada, porque el autor sostiene que antes los maestros tenían más autoridad que ahora.", "El autor no lo sostiene: sugiere que lo que había antes era, muchas veces, poder basado en el miedo.", false], ["C", "es infundada, porque el autor cuestiona a quienes añoran el silencio de antes.", "El texto pone en duda esa nostalgia («Aquel silencio no siempre era respeto; muchas veces era miedo»). Evaluar si una crítica se ajusta a lo que el texto dice es reflexionar sobre su contenido.", true]]}]}, {"comp": "lectura_critica", "rol": "docente", "tag": "Lectura crítica", "texto": "Lea el siguiente fragmento del acta de una reunión del consejo académico:\n\n«La coordinadora presentó la propuesta de modificar el Sistema Institucional de Evaluación de los Estudiantes (SIEE) para que la autoevaluación tenga un peso del 10 % en la nota de cada periodo. El docente de matemáticas manifestó su desacuerdo: \"Los estudiantes se van a poner cinco a sí mismos\". La docente de ciencias sociales respondió que en su área la autoevaluación se hace con una rúbrica y que, en su experiencia, los estudiantes suelen ser más severos consigo mismos que los docentes. El rector propuso pilotear la medida en dos grados durante un periodo antes de decidir. La propuesta del rector fue aprobada por mayoría.»", "items": [{"id": "LC-191", "niv": 1, "e": "Según el acta, el consejo académico aprobó", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: identificar y entender los contenidos locales que conforman un texto.", "o": [["A", "incluir la autoevaluación con un peso del 10 % en todos los grados.", "Esa era la propuesta inicial de la coordinadora; lo aprobado fue probarla primero en dos grados.", false], ["B", "rechazar la propuesta de la coordinadora por las objeciones planteadas.", "La propuesta no fue rechazada; se decidió probarla antes de adoptarla.", false], ["C", "probar la medida en dos grados durante un periodo antes de decidir.", "El acta indica que se aprobó por mayoría la propuesta del rector: pilotear la medida antes de decidir.", true]]}, {"id": "LC-192", "niv": 2, "e": "La docente de ciencias sociales responde a la objeción del docente de matemáticas con", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: reflexionar a partir de un texto y evaluar su contenido (validez de argumentos y solidez de las evidencias).", "o": [["A", "un acuerdo parcial que reconoce que los estudiantes tienden a sobrevalorarse.", "La docente sostiene lo contrario: que los estudiantes suelen ser más severos consigo mismos.", false], ["B", "su experiencia en el área, que contradice la predicción de que se pondrán la nota máxima.", "Ella relata que, con rúbrica, los estudiantes suelen calificarse con más severidad que los docentes, lo cual se opone a lo que anticipa su colega. Identificar el tipo de respaldo de una réplica es evaluar argumentos.", true], ["C", "datos de varias instituciones que demuestran que la autoevaluación funciona.", "La docente no presenta datos de otras instituciones; habla de su propia experiencia.", false]]}, {"id": "LC-193", "niv": 3, "e": "La propuesta del rector puede entenderse como una forma de", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: reflexionar a partir de un texto y evaluar su contenido.", "o": [["A", "obtener evidencia de la institución antes de decidir entre una predicción y una experiencia individual.", "Las dos intervenciones se apoyan en una predicción y en una experiencia particular; el piloto permite contrastarlas con datos de la institución en un plazo definido. Valorar el sentido de una decisión frente a los argumentos expuestos es reflexionar sobre el texto.", true], ["B", "aplazar la decisión de manera indefinida para no provocar un conflicto entre los docentes del consejo.", "El piloto tiene un plazo definido (un periodo), por lo que no es un aplazamiento indefinido.", false], ["C", "dar la razón al docente de matemáticas sin contradecir de manera abierta a la coordinadora.", "El piloto no toma partido por ninguna postura; busca información para decidir.", false]]}]}, {"comp": "lectura_critica", "rol": "docente", "tag": "Lectura crítica", "texto": "Lea la siguiente descripción de una gráfica de barras que el coordinador presentó en una reunión de docentes:\n\n«ASISTENCIA DE FAMILIAS A LA ENTREGA DE INFORMES (institución con 800 familias)\nPeriodo 1: 520 familias (65 %).\nPeriodo 2: 440 familias (55 %).\nPeriodo 3: 600 familias (75 %).\nNota: en los periodos 1 y 2, la entrega se hizo un martes a las 2:00 p. m.; en el periodo 3, un sábado en la mañana.\nComentario del coordinador: \"Las familias sí se interesan; lo que les falta es tiempo en horario laboral\".»", "items": [{"id": "LC-202", "niv": 1, "e": "Según la gráfica, entre el periodo 2 y el periodo 3 la asistencia aumentó en", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: identificar y entender los contenidos locales en textos discontinuos (tablas, gráficas e infografías).", "o": [["A", "80 familias.", "Es la diferencia entre el periodo 3 (600) y el periodo 1 (520), no entre el periodo 2 y el 3.", false], ["B", "160 familias.", "En el periodo 2 asistieron 440 familias y en el periodo 3, 600: 600 − 440 = 160. Es lectura y comparación directa de datos.", true], ["C", "600 familias.", "Es el número total de familias que asistieron en el periodo 3, no el aumento respecto al periodo 2.", false]]}, {"id": "LC-203", "niv": 2, "e": "El comentario del coordinador se basa principalmente en", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: reflexionar a partir de un texto y evaluar su contenido (validez de argumentos y solidez de las evidencias).", "o": [["A", "la disminución de la asistencia de las familias entre el primer y el segundo periodo.", "Esa disminución ocurrió con el mismo horario y no explica la conclusión sobre el tiempo laboral.", false], ["B", "una encuesta en la que las familias explican las razones por las que no asisten.", "La gráfica no incluye ninguna encuesta; el coordinador infiere las razones a partir de las cifras.", false], ["C", "el aumento de la asistencia cuando la entrega se hizo fuera del horario laboral.", "La única diferencia que destaca la nota es el cambio de día y hora en el periodo 3, que coincide con la mayor asistencia. De allí el coordinador infiere que el problema es el horario.", true]]}, {"id": "LC-204", "niv": 3, "e": "La conclusión del coordinador se debilitaría si se supiera que", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: reflexionar a partir de un texto y evaluar su contenido (validez de argumentos y solidez de las evidencias).", "o": [["A", "en el tercer periodo se avisó que el informe solo se entregaría a quien asistiera.", "Sería otra explicación posible del aumento, independiente del horario: las familias habrían asistido por la nueva condición. Una explicación alternativa debilita la conclusión causal. Identificar qué información debilita un argumento es parte de la lectura crítica.", true], ["B", "en el tercer periodo algunos estudiantes acompañaron a sus familias a la reunión.", "Este dato no ofrece una explicación del aumento ni pone en duda el papel del horario.", false], ["C", "la mayoría de las familias de la institución trabaja entre semana en horario diurno.", "Este dato fortalecería la conclusión, pues explicaría por qué un martes a las 2:00 p. m. muchas familias no pueden asistir.", false]]}, {"id": "LC-205", "niv": 3, "e": "Al comentar estos datos con sus colegas, usted afirma con precisión que", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: identificar y entender los contenidos locales en textos discontinuos (tablas, gráficas e infografías).", "o": [["A", "en ningún periodo del año asistió a la entrega de informes más de la mitad de las familias de la institución.", "Es falso: en los tres periodos asistió más de la mitad (65 %, 55 % y 75 %).", false], ["B", "el cambio de horario coincide con la mayor asistencia, aunque un solo periodo no basta para probar que la causó.", "Es una afirmación prudente: los datos muestran la coincidencia, pero con una sola observación no se pueden descartar otras explicaciones. Evaluar el alcance de una conclusión es reflexionar sobre la información.", true], ["C", "la asistencia aumentó un 20 % entre el segundo y el tercer periodo.", "Confunde puntos porcentuales con porcentaje: la asistencia pasó de 55 % a 75 %, es decir, subió 20 puntos porcentuales, lo que equivale a un aumento de alrededor del 36 % (160 ÷ 440).", false]]}]}, {"comp": "razonamiento_cuantitativo", "rol": "docente", "tag": "Razonamiento cuantitativo", "texto": "En el informe de gestión, la rectoría presenta la matrícula total de la institución en los últimos cuatro años: 1.200 estudiantes en 2021, 1.260 en 2022, 1.323 en 2023 y 1.250 en 2024. Usted, como docente del consejo académico, debe analizar estos datos antes de la reunión con la secretaría de educación. Los porcentajes se redondean a una cifra decimal.", "items": [{"id": "RC-121", "niv": 1, "e": "La variación porcentual de la matrícula entre 2021 y 2022 fue un aumento de", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: variación porcentual.", "o": [["A", "5 %.", "El aumento es 1.260 − 1.200 = 60 estudiantes, y 60 ÷ 1.200 = 0,05, es decir, 5 %.", true], ["B", "60 %.", "Toma el aumento absoluto (60 estudiantes) como si fuera un porcentaje; para obtener la variación porcentual hay que dividirlo entre la matrícula inicial.", false], ["C", "105 %.", "Confunde la razón entre los dos valores (1.260 ÷ 1.200 = 1,05, es decir, 105 %) con la variación. La matrícula de 2022 es el 105 % de la de 2021, lo que significa un aumento del 5 %.", false]]}, {"id": "RC-122", "niv": 2, "e": "La variación porcentual de la matrícula entre 2023 y 2024 fue una disminución de aproximadamente", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: variación porcentual con disminución.", "o": [["A", "0,8 %.", "Compara 2024 con 2022 (1.250 frente a 1.260) en lugar de compararlo con el año inmediatamente anterior, 2023.", false], ["B", "5,5 %.", "La disminución es 1.323 − 1.250 = 73 estudiantes, y 73 ÷ 1.323 ≈ 0,0552, es decir, aproximadamente 5,5 %.", true], ["C", "5,8 %.", "Divide la disminución entre el valor final (73 ÷ 1.250 = 5,84 %), cuando la base de la variación es el valor inicial del periodo, 1.323.", false]]}, {"id": "RC-123", "niv": 2, "e": "En promedio, entre 2021 y 2024 la matrícula cambió a razón de", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: razón de cambio promedio.", "o": [["A", "12,5 estudiantes por año.", "Divide el cambio total entre 4 porque hay cuatro datos, pero entre 2021 y 2024 hay 3 intervalos anuales.", false], ["B", "16,7 estudiantes por año.", "El cambio total es 1.250 − 1.200 = 50 estudiantes en 3 años: 50 ÷ 3 ≈ 16,7 estudiantes por año.", true], ["C", "50 estudiantes por año.", "Toma el cambio total del periodo como si fuera el cambio anual, sin dividir entre los 3 años transcurridos.", false]]}, {"id": "RC-124", "niv": 3, "e": "Un miembro del consejo afirma: «entre 2021 y 2024 la matrícula creció un 4,2 %; por tanto, aumentó todos los años». Frente a esta afirmación, usted concluye que", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: validación de conclusiones a partir de datos.", "o": [["A", "la conclusión no es válida, porque entre 2021 y 2024 la matrícula disminuyó un 4,2 %.", "Interpreta mal el sentido del cambio: la matrícula pasó de 1.200 a 1.250, lo que es un aumento. El error de la afirmación está en la generalización a todos los años.", false], ["B", "la conclusión es válida, porque la matrícula de 2024 es mayor que la de 2021 y una variación positiva en el periodo completo indica crecimiento anual.", "Una variación positiva entre los extremos del periodo no implica crecimiento en cada año; los datos muestran una caída de 2023 a 2024.", false], ["C", "el porcentaje es correcto, pero la conclusión no es válida, porque de 2023 a 2024 la matrícula disminuyó.", "50 ÷ 1.200 ≈ 4,2 %, así que el dato es correcto. Sin embargo, comparar solo el primer y el último año no informa sobre los años intermedios, y entre 2023 y 2024 hubo una disminución.", true]]}]}, {"comp": "razonamiento_cuantitativo", "rol": "docente", "tag": "Razonamiento cuantitativo", "texto": "Usted es director de un grupo de 35 estudiantes y analiza las inasistencias registradas entre febrero y mayo. Febrero tuvo 20 días de clase y 84 inasistencias; marzo, 20 días y 63 inasistencias; abril, 15 días (por la Semana Santa) y 90 inasistencias; mayo, 20 días y 98 inasistencias. Cada inasistencia corresponde a un estudiante que faltó un día completo. El porcentaje de inasistencia de un periodo se calcula dividiendo las inasistencias entre el total de asistencias posibles (estudiantes × días de clase).", "items": [{"id": "RC-145", "niv": 1, "e": "El porcentaje de asistencia del grupo en febrero fue", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: porcentajes y elección de la base adecuada.", "o": [["A", "12 %.", "Es el porcentaje de inasistencia (84 ÷ 700); el enunciado pide el de asistencia, que es su complemento.", false], ["B", "88 %.", "En febrero hubo 35 × 20 = 700 asistencias posibles. La inasistencia fue 84 ÷ 700 = 12 %, de modo que la asistencia fue 100 % − 12 % = 88 %.", true], ["C", "97,6 %.", "Divide las inasistencias entre el número de estudiantes (84 ÷ 35 = 2,4) y lo resta de 100 como si fuera un porcentaje; la base correcta son las 700 asistencias posibles.", false]]}, {"id": "RC-146", "niv": 2, "e": "Si el manual de convivencia fija que un estudiante no debe superar el 15 % de inasistencia en un periodo de 40 días de clase, el número máximo de inasistencias que puede tener sin superar ese límite es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: porcentajes y desigualdades en contexto.", "o": [["A", "5 inasistencias.", "Interpreta «sin superar» como «estrictamente menor que»; con 6 inasistencias el porcentaje es exactamente 15 %, que no supera el límite.", false], ["B", "6 inasistencias.", "El 15 % de 40 días es 0,15 × 40 = 6. Con 6 inasistencias se llega exactamente al 15 % sin superarlo; con 7 se llegaría al 17,5 %.", true], ["C", "7 inasistencias.", "Corresponde al primer número de inasistencias que supera el límite (7 ÷ 40 = 17,5 %), no al máximo permitido.", false]]}, {"id": "RC-147", "niv": 3, "e": "El porcentaje de inasistencia del grupo en el periodo completo de febrero a mayo fue aproximadamente", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: promedios ponderados; error de promediar porcentajes con bases distintas.", "o": [["A", "12,0 %.", "Supone que los cuatro meses tuvieron 20 días (335 ÷ 2.800); abril tuvo 15 días, de modo que las asistencias posibles son 2.625.", false], ["B", "12,8 %.", "Inasistencias: 84 + 63 + 90 + 98 = 335. Asistencias posibles: 35 × (20 + 20 + 15 + 20) = 35 × 75 = 2.625. Porcentaje: 335 ÷ 2.625 ≈ 12,8 %.", true], ["C", "13,0 %.", "Promedia los porcentajes mensuales (12 %, 9 %, 17,1 % y 14 %) como si todos los meses tuvieran el mismo número de días; abril pesa menos porque tuvo 15 días.", false]]}, {"id": "RC-148", "niv": 2, "e": "Al comparar los cuatro meses, usted concluye correctamente que el mes con mayor porcentaje de inasistencia fue", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: comparación de razones y porcentajes.", "o": [["A", "febrero, porque tuvo 20 días de clase y 84 inasistencias, con un 12 %.", "El 12 % de febrero es menor que el 14 % de mayo y que el 17,1 % de abril, así que no es el mes con mayor inasistencia.", false], ["B", "mayo, porque tuvo el mayor número de inasistencias del periodo.", "Compara cantidades absolutas entre meses con distinto número de días de clase. En porcentaje, mayo (14 %) está por debajo de abril (17,1 %).", false], ["C", "abril, con aproximadamente 17,1 %, aunque tuvo menos inasistencias que mayo.", "Abril: 90 ÷ (35 × 15) = 90 ÷ 525 ≈ 17,1 %. Mayo: 98 ÷ 700 = 14 %. Para comparar meses con distinto número de días se usan porcentajes, no cantidades absolutas.", true]]}]}, {"comp": "razonamiento_cuantitativo", "rol": "docente", "tag": "Razonamiento cuantitativo", "texto": "Para financiar la salida pedagógica de quinto de primaria, la asociación de padres organizó una función de teatro. La boleta de adulto costó $8.000 y la de niño, $5.000. Se vendieron en total 180 boletas y se recaudaron $1.140.000. Usted, como docente de quinto, analiza las cuentas con sus estudiantes en la clase de matemáticas y denota con a el número de boletas de adulto y con n el número de boletas de niño.", "items": [{"id": "RC-160", "niv": 1, "e": "El sistema de ecuaciones que representa correctamente la situación es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: modelación con sistemas de ecuaciones lineales.", "o": [["A", "a + n = 180 y 8.000a + 5.000n = 1.140.000.", "La primera ecuación cuenta las boletas vendidas y la segunda suma el dinero recaudado por cada tipo de boleta.", true], ["B", "a + n = 1.140.000 y 8.000a + 5.000n = 180.", "Intercambia los datos: la suma de boletas debe igualarse a 180 y el dinero recaudado a $1.140.000.", false], ["C", "a + n = 180 y 8.000a = 5.000n.", "La segunda ecuación supondría que ambos tipos de boleta recaudaron lo mismo, condición que el caso no plantea; tampoco usa el total recaudado.", false]]}, {"id": "RC-161", "niv": 2, "e": "El número de boletas de adulto vendidas fue", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: solución de sistemas de ecuaciones lineales.", "o": [["A", "80 boletas.", "De a + n = 180 se tiene n = 180 − a. Al sustituir: 8.000a + 5.000(180 − a) = 1.140.000, es decir, 3.000a = 240.000, y a = 80. Comprobación: 80 × 8.000 + 100 × 5.000 = 1.140.000.", true], ["B", "90 boletas.", "Supone que se vendió la misma cantidad de cada tipo (180 ÷ 2); con 90 y 90 se recaudarían $1.170.000, no $1.140.000.", false], ["C", "100 boletas.", "Es el número de boletas de niño; confunde las incógnitas al despejar.", false]]}, {"id": "RC-162", "niv": 3, "e": "Si el próximo año la boleta de adulto sube 25 %, la de niño mantiene su precio y se venden 80 boletas de adulto y 100 de niño, como este año, el recaudo será de", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: porcentajes aplicados a una parte de los datos.", "o": [["A", "$1.300.000.", "La boleta de adulto pasa a 8.000 × 1,25 = $10.000. Con 80 adultos y 100 niños: 80 × 10.000 + 100 × 5.000 = 800.000 + 500.000 = $1.300.000.", true], ["B", "$1.425.000.", "Aplica el 25 % a todo el recaudo (1.140.000 × 1,25), como si también subiera la boleta de niño.", false], ["C", "$1.500.000.", "Suma el aumento de $2.000 a las 180 boletas (1.140.000 + 180 × 2.000), como si todas fueran de adulto; solo suben las 80 boletas de adulto.", false]]}]}, {"comp": "razonamiento_cuantitativo", "rol": "docente", "tag": "Razonamiento cuantitativo", "texto": "Usted debe imprimir una guía de 35 páginas para cada uno de los 120 estudiantes de grado noveno; cada página se imprime en una hoja, por una sola cara. El papel viene en resmas de 500 hojas. La fotocopiadora A imprime 1.200 páginas en 40 minutos y la fotocopiadora B imprime 1.200 páginas en 60 minutos; cada una trabaja siempre a su ritmo constante.", "items": [{"id": "RC-184", "niv": 1, "e": "El número total de páginas que deben imprimirse es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: multiplicación en situaciones de conteo.", "o": [["A", "155 páginas.", "Suma las páginas de la guía y los estudiantes (35 + 120); cada estudiante recibe 35 páginas, por lo que se multiplica.", false], ["B", "420 páginas.", "Omite un cero al multiplicar (35 × 12); el número de estudiantes es 120, no 12.", false], ["C", "4.200 páginas.", "Cada uno de los 120 estudiantes recibe 35 páginas: 35 × 120 = 4.200 páginas.", true]]}, {"id": "RC-185", "niv": 1, "e": "El número mínimo de resmas de papel que se necesitan es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: redondeo por exceso en contexto.", "o": [["A", "5 resmas.", "Supone impresión por ambas caras (4.200 ÷ 2 ÷ 500 = 4,2 → 5), pero el caso indica que se imprime por una sola cara.", false], ["B", "8 resmas.", "Trunca el cociente 4.200 ÷ 500 = 8,4; con 8 resmas solo hay 4.000 hojas y faltarían 200.", false], ["C", "9 resmas.", "Se necesitan 4.200 hojas y 4.200 ÷ 500 = 8,4; como no se compran fracciones de resma, se requieren 9.", true]]}, {"id": "RC-186", "niv": 2, "e": "Si solo se usa la fotocopiadora A, el tiempo necesario para imprimir todas las guías es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: tasas de trabajo y conversión de unidades de tiempo.", "o": [["A", "1 h 40 min.", "Obtiene 140 minutos y lo lee como 1,40 horas; 140 minutos son 2 horas y 20 minutos.", false], ["B", "2 h 20 min.", "La fotocopiadora A imprime 1.200 ÷ 40 = 30 páginas por minuto. 4.200 ÷ 30 = 140 minutos = 2 h 20 min.", true], ["C", "3 h 30 min.", "Usa el ritmo de la fotocopiadora B (20 páginas por minuto: 4.200 ÷ 20 = 210 minutos).", false]]}, {"id": "RC-187", "niv": 3, "e": "Si las dos fotocopiadoras trabajan al mismo tiempo, todas las guías quedan impresas en", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: problemas de trabajo conjunto y tasas.", "o": [["A", "1 h 10 min.", "Supone que con dos máquinas el tiempo se reduce a la mitad del de A (140 ÷ 2), como si B fuera tan rápida como A.", false], ["B", "1 h 24 min.", "A imprime 30 y B 20 páginas por minuto; juntas, 50 páginas por minuto. 4.200 ÷ 50 = 84 minutos = 1 h 24 min.", true], ["C", "2 h 55 min.", "Promedia los tiempos de cada máquina por separado ((140 + 210) ÷ 2 = 175 minutos); al trabajar juntas, se suman los ritmos y el tiempo disminuye.", false]]}]}, {"comp": "razonamiento_cuantitativo", "rol": "docente", "tag": "Razonamiento cuantitativo", "texto": "Para la feria de ciencias, los estudiantes de grado noveno construyen un tanque cilíndrico de 40 cm de diámetro y 50 cm de altura para un sistema de riego por goteo. Recuerde que 1 litro equivale a 1.000 cm³ y use π = 3,14. Una bomba llena el tanque a razón constante de 1,57 litros por minuto. Usted es el docente que asesora el proyecto.", "items": [{"id": "RC-194", "niv": 2, "e": "La capacidad del tanque es de", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: volumen del cilindro y conversión de unidades.", "o": [["A", "62,8 litros.", "El radio es 20 cm. V = π × r² × h = 3,14 × 400 × 50 = 62.800 cm³, que equivalen a 62.800 ÷ 1.000 = 62,8 litros.", true], ["B", "251,2 litros.", "Usa el diámetro (40 cm) como si fuera el radio: 3,14 × 1.600 × 50 = 251.200 cm³.", false], ["C", "628 litros.", "Divide los 62.800 cm³ entre 100 en lugar de 1.000; la equivalencia es 1 L = 1.000 cm³.", false]]}, {"id": "RC-195", "niv": 3, "e": "Partiendo del tanque vacío, el tiempo que tarda la bomba en llenarlo hasta 3/4 de su capacidad es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: fracciones, tasas y volumen en problemas de varios pasos.", "o": [["A", "10 minutos.", "Calcula el tiempo para llenar 1/4 del tanque (15,7 L ÷ 1,57); confunde la fracción que falta con la que se debe llenar.", false], ["B", "30 minutos.", "La capacidad es 62,8 L y 3/4 de ella son 47,1 L. A 1,57 L por minuto: 47,1 ÷ 1,57 = 30 minutos.", true], ["C", "40 minutos.", "Es el tiempo para llenar el tanque completo (62,8 ÷ 1,57); omite que solo se llena hasta 3/4.", false]]}, {"id": "RC-196", "niv": 1, "e": "Para decorar el tanque, los estudiantes rodearán su borde superior con una cinta. La longitud mínima de cinta que necesitan es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: longitud de la circunferencia.", "o": [["A", "62,8 cm.", "Multiplica π por el radio (3,14 × 20); la longitud de la circunferencia es π × diámetro o 2 × π × radio.", false], ["B", "125,6 cm.", "La longitud de la circunferencia es π × d = 3,14 × 40 = 125,6 cm.", true], ["C", "251,2 cm.", "Aplica 2 × π × 40, es decir, usa el diámetro como si fuera el radio en la fórmula 2πr.", false]]}]}, {"comp": "competencias_blandas", "rol": "docente", "tag": "Competencias blandas y ciudadanas · Competencias ciudadanas: pluralidad, identidad y valoración de las diferencias (Guía 6)", "texto": "En un colegio oficial de Cúcuta, usted es docente de lengua castellana de sexto. Daniela, estudiante venezolana que llegó hace dos meses, casi no participa en clase. Varios compañeros imitan su acento y la llaman con un apodo despectivo por su nacionalidad. En la reunión de padres, una madre comenta que los estudiantes migrantes «les quitan los cupos a los colombianos» y otros padres asienten. Daniela le ha dicho a usted que no quiere que su mamá se entere de las burlas.", "items": [{"id": "CB-127", "niv": 1, "e": "Frente al apodo y las imitaciones del acento de Daniela, usted", "f": "Decreto 1965 de 2013, art. 39; Ley 1098 de 2006, art. 44, num. 5; MEN (2004). Estándares Básicos de Competencias Ciudadanas, Serie Guías n.º 6 (pluralidad).", "o": [["A", "abre una conversación con el grupo para que cada uno exprese cómo ve la llegada de estudiantes de otros países.", "El diálogo sobre la migración puede ser valioso más adelante, pero abrirlo en ese momento, sin detener la agresión, expone a Daniela y trata la burla como una opinión más.", false], ["B", "le sugiere a Daniela no prestar atención a los apodos, porque así los compañeros dejarán de usarlos con el tiempo.", "Busca protegerla de un enfrentamiento, pero le traslada la responsabilidad de soportar la agresión y deja intacta la conducta discriminatoria del grupo.", false], ["C", "detiene la situación en el momento, deja claro que esas burlas no se permiten y aplica lo previsto en el manual.", "Las burlas por el origen son agresiones verbales que afectan la convivencia (Decreto 1965 de 2013, art. 39), y la institución debe proteger a los estudiantes contra la discriminación y la burla de sus compañeros (Ley 1098 de 2006, art. 44, num. 5). Poner un límite claro y aplicar el manual es la respuesta inmediata que corresponde.", true]]}, {"id": "CB-128", "niv": 2, "e": "Para promover que el grupo valore la diversidad cultural, una actividad pertinente en su clase es", "f": "MEN (2004). Estándares Básicos de Competencias Ciudadanas, Serie Guías n.º 6 (pluralidad, identidad y valoración de las diferencias).", "o": [["A", "un proyecto en el que todos comparen expresiones, relatos y costumbres de los lugares de origen de sus familias.", "Involucra a todo el grupo en reconocer la diversidad de orígenes, incluidos los de las regiones de Colombia, sin poner a una sola estudiante en el centro. Corresponde a la pluralidad, identidad y valoración de las diferencias (Guía 6).", true], ["B", "pedir a Daniela que exponga ante el grupo las costumbres de Venezuela, para que sus compañeros la conozcan mejor.", "Quiere visibilizar su cultura, pero la señala como «la diferente», le asigna una carga que no pidió y puede aumentar la exposición que ya le genera malestar.", false], ["C", "evitar actividades sobre el origen de los estudiantes, para no resaltar diferencias que puedan generar más burlas.", "Busca no avivar el conflicto, pero ignorar la diversidad no la convierte en valor; la Guía 6 plantea reconocer y disfrutar la diversidad humana.", false]]}, {"id": "CB-129", "niv": 2, "e": "Ante el comentario de la madre en la reunión de padres, usted", "f": "MEN (2004). Estándares Básicos de Competencias Ciudadanas, Serie Guías n.º 6 (comunicación asertiva); Función Pública (2017). Código de Integridad del Servicio Público (justicia); Ley 1482 de 2011, modificada por la Ley 1752 de 2015.", "o": [["A", "le pide que se retire de la reunión, porque su comentario es discriminatorio y ofende a varias de las familias presentes.", "Reconoce el carácter discriminatorio del comentario, pero excluir a la madre cierra el diálogo y no contribuye a transformar la opinión de las familias presentes.", false], ["B", "evita responderle para no generar una discusión entre las familias, y continúa con el orden del día de la reunión.", "Evitar la confrontación cuida el clima de la reunión, pero el silencio de la institución frente a un comentario discriminatorio puede interpretarse como aprobación.", false], ["C", "responde con respeto que el colegio recibe a todos los estudiantes sin importar su origen y promueve la convivencia.", "Responder sin agredir, con claridad y firmeza, es una expresión asertiva (Guía 6). El valor de justicia del Código de Integridad orienta a actuar con igualdad y sin discriminación, y la ley sanciona la discriminación por nacionalidad (Ley 1482 de 2011, modificada por la Ley 1752 de 2015).", true]]}, {"id": "CB-130", "niv": 3, "e": "Si las burlas continúan de forma repetida durante varias semanas, además de las acciones pedagógicas usted debe", "f": "Ley 1620 de 2013, art. 19; Decreto 1965 de 2013, arts. 40, 43 y 44.", "o": [["A", "reportar la situación según el protocolo, por ser posible acoso escolar, y explicarle a Daniela por qué debe hacerlo.", "Los docentes deben identificar, reportar y hacer seguimiento a los casos de acoso escolar (Ley 1620 de 2013, art. 19). Las agresiones repetidas o sistemáticas se atienden con el protocolo de las situaciones tipo II, o tipo III si constituyeran delito, y en ambos casos se informa a las familias de los involucrados (Decreto 1965 de 2013, arts. 40, 43 y 44). Explicarle a Daniela las razones respeta su voz sin renunciar a protegerla.", true], ["B", "citar a los padres de los estudiantes que la molestan para que corrijan en casa la conducta de sus hijos.", "Involucrar a las familias es parte del protocolo, pero hacerlo por fuera de la ruta institucional deja sin atención y sin seguimiento la situación de Daniela.", false], ["C", "esperar a que Daniela o su familia presenten una queja formal, para no actuar en contra de lo que ella le pidió.", "Respetar la voluntad de Daniela es importante, pero el deber de reportar del docente no depende de una queja de la afectada; el protocolo protege a la estudiante y a la vez exige informar a su familia.", false]]}]}, {"comp": "competencias_blandas", "rol": "docente", "tag": "Competencias blandas y ciudadanas · Competencias ciudadanas: pluralidad, identidad y valoración de las diferencias (Guía 6)", "texto": "Usted es director de grupo de cuarto en una escuela oficial. La familia de Tomás, que pertenece a una iglesia cristiana no católica, le informa por escrito que no desea que su hijo reciba la clase de educación religiosa, cuyo programa institucional tiene orientación católica, ni que participe en la eucaristía de inicio de año. Una colega opina que «si estudia aquí, debe seguir lo que hacen todos». Algunos compañeros de Tomás ya preguntaron por qué él no estará en la eucaristía.", "items": [{"id": "CB-131", "niv": 1, "e": "Frente a la solicitud de la familia de Tomás, usted", "f": "Ley 115 de 1994, art. 23, parágrafo 1.°, y art. 24.", "o": [["A", "acepta la solicitud y permite que Tomás salga al patio durante esa clase, para que no se sienta incómodo.", "Respeta la decisión de la familia, pero deja a Tomás sin una actividad formativa durante ese tiempo y sin el acompañamiento al que tiene derecho.", false], ["B", "explica a la familia que la educación religiosa es un área obligatoria del plan de estudios y que Tomás debe cursarla.", "Es cierto que la educación religiosa es un área que la institución debe ofrecer, pero la misma ley garantiza que en los establecimientos oficiales nadie puede ser obligado a recibirla.", false], ["C", "respeta la decisión y coordina con la institución una actividad formativa para Tomás durante esa clase.", "La Ley 115 de 1994 (art. 23, parágrafo 1.°, y art. 24) establece que en los establecimientos del Estado ninguna persona puede ser obligada a recibir educación religiosa y reconoce el derecho de los padres a escoger el tipo de educación de sus hijos. La alternativa formativa garantiza que el tiempo sea pedagógico.", true]]}, {"id": "CB-132", "niv": 2, "e": "Ante la opinión de la colega de que Tomás «debe seguir lo que hacen todos», usted le responde que", "f": "Ley 115 de 1994, art. 24; MEN (2004). Estándares Básicos de Competencias Ciudadanas, Serie Guías n.º 6 (pluralidad).", "o": [["A", "tiene razón en lo general, pero que para evitar un conflicto con la familia es mejor hacer una excepción con Tomás.", "Busca una salida conciliadora, pero presenta un derecho como un favor o una excepción, lo que refuerza la idea de que lo normal es imponer una sola creencia.", false], ["B", "la decisión le corresponde al consejo directivo, que debe autorizar cada caso de exención del área.", "Remitir a una instancia formal parece ordenado, pero el derecho a no recibir educación religiosa en un establecimiento oficial no depende de una autorización del consejo directivo.", false], ["C", "la libertad de cultos y el respeto a la diferencia impiden que la escuela le imponga una práctica religiosa.", "La Ley 115 (art. 24) protege la libertad de conciencia y de cultos, y la Guía 6 plantea que la valoración de las diferencias tiene como límite los derechos de los demás. Integrar no significa uniformar las creencias.", true]]}, {"id": "CB-133", "niv": 3, "e": "Para que la situación sea también una oportunidad formativa para el grupo, usted", "f": "MEN (2004). Estándares Básicos de Competencias Ciudadanas, Serie Guías n.º 6 (pluralidad); Ley 1581 de 2012, art. 5; Ley 1098 de 2006, art. 33.", "o": [["A", "desarrolla, sin referirse a Tomás, actividades para conocer distintas creencias y reflexionar sobre el respeto a la diferencia.", "Trabaja la pluralidad con todo el grupo (Guía 6) sin exponer las convicciones religiosas de Tomás, que son un dato sensible (Ley 1581 de 2012, art. 5) y parte de su intimidad (Ley 1098 de 2006, art. 33).", true], ["B", "evita tratar temas religiosos con el grupo durante el año, para no generar comparaciones entre los estudiantes.", "Previene comparaciones, pero desaprovecha la oportunidad de formar en el respeto a la diversidad de creencias, que es parte de las competencias ciudadanas.", false], ["C", "pide a Tomás que explique al grupo las creencias de su iglesia, para que sus compañeros comprendan su decisión.", "Busca generar comprensión, pero expone las convicciones religiosas del niño ante el grupo y le asigna la carga de justificar una decisión que tomó su familia.", false]]}]}, {"comp": "competencias_blandas", "rol": "docente", "tag": "Competencias blandas y ciudadanas · Gobierno escolar y participación (Ley 115 de 1994; Decretos 1860 de 1994 y 1286 de 2005)", "texto": "Usted es docente de primaria en una institución educativa oficial y además es madre de un estudiante de cuarto grado de la misma institución. En la reunión de padres de inicio de año, varios padres le proponen que los represente ante el consejo directivo «porque conoce cómo funciona el colegio». Otro padre propone que quienes integren el consejo de padres paguen una cuota anual de $10.000 para financiar sus actividades. El rector aún no ha convocado la elección del consejo de padres.", "items": [{"id": "CB-167", "niv": 2, "e": "Frente a la propuesta de que usted represente a los padres ante el consejo directivo, usted", "f": "Decreto 1286 de 2005, art. 8 (compilado en el Decreto 1075 de 2015).", "o": [["A", "acepta, con el compromiso de abstenerse de votar en los temas del consejo que afecten a los docentes.", "Abstenerse en algunos temas parece una salida prudente, pero la prohibición es total: un docente de la institución no puede ocupar esa representación.", false], ["B", "acepta, porque cumple el requisito principal de ser madre de un estudiante matriculado en esta misma institución.", "Es cierto que los representantes deben ser padres de estudiantes de la institución, pero la misma norma excluye a quienes trabajan en ella.", false], ["C", "agradece la confianza, pero explica que por trabajar en la institución no puede ser representante de los padres.", "El Decreto 1286 de 2005 (art. 8) establece que los docentes, directivos o administrativos del establecimiento no pueden ser representantes de los padres de familia en el consejo directivo de la institución donde laboran.", true]]}, {"id": "CB-168", "niv": 2, "e": "Sobre la propuesta de una cuota anual para los integrantes del consejo de padres, usted señala que", "f": "Decreto 1286 de 2005, art. 6.", "o": [["A", "la norma no permite fijar cuotas ni contribuciones económicas para pertenecer al consejo de padres.", "El artículo 6 del Decreto 1286 de 2005 dispone que para pertenecer al consejo de padres no se pueden establecer cuotas de afiliación ni contribuciones económicas de ninguna especie.", true], ["B", "es válida si la aprueba la mayoría de los padres, porque el consejo de padres es autónomo en su organización.", "El consejo de padres sí define aspectos de su funcionamiento, pero la prohibición de cuotas es una norma que una mayoría no puede desconocer.", false], ["C", "es válida siempre que las familias de menores recursos queden exentas del pago de la cuota.", "La exención busca equidad, pero no corrige que la norma prohíbe cualquier contribución económica para pertenecer al consejo.", false]]}, {"id": "CB-169", "niv": 1, "e": "Para promover la participación de las familias en el consejo de padres, usted sugiere al rector", "f": "Decreto 1286 de 2005, arts. 5 y 6.", "o": [["A", "convocar por grados la elección de voceros, en horarios que faciliten la asistencia de quienes trabajan.", "El Decreto 1286 de 2005 (art. 5) prevé que en el primer mes del año escolar el rector convoque a los padres para elegir a sus representantes por grados. Ajustar los horarios facilita una participación efectiva.", true], ["B", "designar directamente a los padres más comprometidos de cada grado, para asegurar un consejo activo durante el año.", "Busca un consejo funcional, pero reemplaza la elección por grados que prevé la norma y limita la participación de las demás familias.", false], ["C", "conformar el consejo de padres solo si suficientes familias se ofrecen de manera voluntaria.", "Respeta la voluntad de las familias, pero la conformación del consejo de padres es obligatoria en todos los establecimientos (Decreto 1286 de 2005, arts. 5 y 6).", false]]}]}, {"comp": "competencias_blandas", "rol": "docente", "tag": "Competencias blandas y ciudadanas · Ética en el servicio público (Ley 1952 de 2019; Código de Integridad)", "texto": "Usted es docente de décimo en un colegio oficial y vende por catálogo productos de belleza para complementar sus ingresos. Un colega le sugiere ofrecerlos a las madres y padres de sus estudiantes durante la reunión de entrega de informes, «porque allí están todos». Como director de grupo, usted tiene acceso a la base de datos con los teléfonos de las familias del curso, que la institución recogió en la matrícula.", "items": [{"id": "CB-170", "niv": 1, "e": "Frente a la sugerencia de ofrecer los productos en la reunión de entrega de informes, usted", "f": "Ley 1952 de 2019, art. 44; Función Pública (2017). Código de Integridad del Servicio Público (honestidad).", "o": [["A", "la acepta solo con las familias que ya conoce, para que la oferta no parezca una obligación.", "Limitar la oferta parece prudente, pero la relación sigue siendo con familias de sus estudiantes, y quienes conocen al docente pueden sentirse más comprometidas a comprar.", false], ["B", "la acepta, siempre que lo haga al terminar la reunión y sin presionar a ninguna de las familias asistentes.", "Separar el momento de la venta reduce la presión, pero sigue usando un espacio institucional con familias que dependen de sus decisiones como docente.", false], ["C", "la descarta, porque mezcla un negocio propio con su relación con las familias a cuyos hijos evalúa.", "Mezclar un interés económico personal con la relación con las familias de los estudiantes que usted evalúa genera un conflicto de intereses (Ley 1952 de 2019, art. 44). El Código de Integridad (honestidad) orienta a no usar los espacios del cargo para fines personales.", true]]}, {"id": "CB-171", "niv": 1, "e": "Sobre usar la base de datos de teléfonos de las familias para enviar el catálogo, usted", "f": "Ley 1581 de 2012, art. 4; Ley 1952 de 2019, art. 38, num. 5.", "o": [["A", "se abstiene, porque esos datos se recogieron con fines escolares y no pueden usarse para un propósito personal.", "Los datos deben tratarse solo para la finalidad legítima informada a su titular (Ley 1581 de 2012, art. 4, literal b), y el servidor público usa la información a la que accede por su cargo solo para los fines a que está destinada (Ley 1952 de 2019, art. 38, num. 5).", true], ["B", "envía el catálogo solo a las familias de su grupo, con quienes ya mantiene comunicación permanente.", "Restringir el envío parece razonable, pero la comunicación existente tiene una finalidad escolar; usar esos datos para vender cambia su finalidad sin autorización.", false], ["C", "envía el catálogo con un mensaje que aclare que la compra es voluntaria y no afecta a los estudiantes.", "La aclaración busca evitar presiones, pero no corrige el uso de datos personales para una finalidad distinta de la que justificó su recolección.", false]]}, {"id": "CB-172", "niv": 3, "e": "Si una madre de su grupo le pide por iniciativa propia comprarle productos, la actuación más prudente es", "f": "Ley 1952 de 2019, art. 44; Función Pública (2017). Código de Integridad del Servicio Público (honestidad).", "o": [["A", "venderle los productos con un descuento, como reconocimiento a su apoyo constante con el grupo.", "Busca reconocer a la madre, pero añade un trato preferencial a la relación comercial y hace más visible el conflicto de intereses.", false], ["B", "explicarle con amabilidad que prefiere no tener relaciones comerciales con las familias de sus estudiantes.", "La clave se funda en el conflicto de intereses y en la integridad, no en una regla sobre ventas: aunque la iniciativa sea de la madre, una relación comercial con la familia de un estudiante al que usted evalúa le crea un interés particular en un asunto a su cargo (Ley 1952 de 2019, art. 44) y abre la puerta a tratos preferenciales que el Código de Integridad (honestidad) orienta a evitar.", true], ["C", "venderle los productos al mismo precio que a cualquier cliente, ya que la iniciativa fue de ella.", "Tratarla como a cualquier cliente parece neutral, pero no elimina la relación económica con la familia de un estudiante cuyo proceso usted valora.", false]]}, {"id": "CB-173", "niv": 3, "e": "Si su colega insiste en que «todos lo hacen y no pasa nada», una respuesta coherente con el Código de Integridad es", "f": "Función Pública (2017). Código de Integridad del Servicio Público (honestidad); MEN (2008). Guía 31, Anexo 1: Glosario de competencias (comunicación y relaciones interpersonales).", "o": [["A", "evitar contradecirlo y simplemente no hacerlo, para no afectar la buena relación con su colega.", "Cuida la relación y usted actúa de manera correcta, pero deja sin respuesta una práctica que afecta la ética institucional, cuando podía argumentar sin descalificar.", false], ["B", "acordar con él que solo lo harán en eventos sociales del colegio, donde la relación con las familias es informal.", "Parece un punto medio, pero los eventos del colegio siguen siendo espacios institucionales con familias de sus estudiantes; el conflicto se mantiene.", false], ["C", "explicarle con respeto que, aunque sea común, mezcla intereses personales con la relación con las familias.", "El Código de Integridad es un instrumento pedagógico que orienta el comportamiento más allá de lo sancionable. Responder con argumentos y sin descalificar al colega corresponde al valor de honestidad y a la comunicación asertiva (Guía 31).", true]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Educación inclusiva (Decreto 1421 de 2017)", "texto": "A su grupo de cuarto grado ingresa en marzo un estudiante con baja visión. La familia informa que todavía está esperando la cita con el especialista y por eso no ha entregado un diagnóstico médico. En las primeras semanas, usted observa que el estudiante no alcanza a leer lo que se escribe en el tablero, se acerca mucho al cuaderno y se cansa rápido en las actividades de lectura, aunque participa con entusiasmo en las discusiones orales.", "items": [{"id": "IN-001", "niv": 2, "e": "Mientras llega el diagnóstico médico, frente a los ajustes razonables usted debe", "f": "Decreto 1421 de 2017 (Decreto 1075 de 2015, art. 2.3.3.5.1.4, definición de ajustes razonables).", "o": [["A", "esperar el diagnóstico para no aplicar ajustes que luego resulten inadecuados para su condición.", "Según el Decreto 1421 de 2017, los ajustes razonables no dependen de un diagnóstico médico; esperar mantiene las barreras que hoy limitan el aprendizaje del estudiante.", false], ["B", "implementar ajustes según las barreras observadas, como ampliar el material y ubicarlo cerca.", "El Decreto 1421 de 2017 define que la realización de los ajustes razonables «no depende de un diagnóstico médico de deficiencia, sino de las barreras visibles e invisibles» que impiden el goce del derecho a la educación.", true], ["C", "solicitar a la familia que acelere la cita, porque sin diagnóstico no es posible hacer ajustes.", "Pedir información a la familia es válido, pero la premisa es falsa: la norma establece que los ajustes no dependen del diagnóstico sino de las barreras.", false]]}, {"id": "IN-002", "niv": 1, "e": "Para construir el Plan Individual de Ajustes Razonables (PIAR) del estudiante, usted debe", "f": "Decreto 1421 de 2017 (Decreto 1075 de 2015, arts. 2.3.3.5.1.4 y 2.3.3.5.2.3.5).", "o": [["A", "liderar su diseño junto con el docente de apoyo, la familia y el propio estudiante.", "El artículo 2.3.3.5.2.3.5 del Decreto 1075 de 2015 (Decreto 1421 de 2017) establece que el diseño de los PIAR lo lideran el o los docentes de aula con el docente de apoyo, la familia y el estudiante.", true], ["B", "solicitar que lo elabore el docente de apoyo, porque es el profesional especializado en inclusión.", "El docente de apoyo participa, pero la norma asigna el liderazgo del diseño a los docentes de aula; delegarlo por completo desconoce esa responsabilidad.", false], ["C", "remitirlo al orientador escolar para que defina los ajustes con base en una valoración clínica.", "El PIAR se basa en una valoración pedagógica y social, no clínica; el orientador puede participar según la organización escolar, pero no lo elabora solo.", false]]}, {"id": "IN-003", "niv": 2, "e": "Al planear la unidad de comprensión lectora para todo el grupo, una decisión coherente con el Diseño Universal para el Aprendizaje (DUA) es", "f": "Decreto 1421 de 2017 (Decreto 1075 de 2015, art. 2.3.3.5.1.4: definiciones de DUA, currículo flexible y PIAR).", "o": [["A", "permitir que el estudiante con baja visión no participe en las actividades de lectura escrita.", "Excluir al estudiante de la actividad contradice el enfoque inclusivo; el Decreto 1421 busca eliminar barreras para garantizar aprendizaje y participación.", false], ["B", "preparar una guía de lectura con objetivos más sencillos para el estudiante con baja visión.", "Reducir los objetivos solo para un estudiante no es DUA. El currículo flexible mantiene los mismos objetivos generales y diversifica las formas de acceder a ellos.", false], ["C", "ofrecer el mismo texto en varios formatos, como impreso ampliado, audio y lectura en voz alta, para todos.", "El DUA busca entornos y materiales accesibles para todos sin necesidad de adaptación especializada. Ofrecer múltiples formatos beneficia al grupo y elimina la barrera del estudiante con baja visión; el PIAR complementa lo que el DUA no alcanza.", true]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Etnoeducación (Constitución, art. 68; Ley 115 de 1994, arts. 55 a 62)", "texto": "Usted fue nombrado en un centro etnoeducativo ubicado en un resguardo indígena de La Guajira, donde la mayoría de los niños habla wayuunaiki en casa y aprende el castellano en la escuela. En la primera reunión, las autoridades tradicionales piden que el plan de estudios incluya los saberes propios y que la comunidad participe en su construcción. Además, una fundación internacional ofrece donar materiales y aplicar su propio currículo de lectura en castellano en todas las sedes, y el director pregunta cómo se seleccionará al docente que reemplazará a una maestra que se jubila.", "items": [{"id": "NR-107", "niv": 1, "e": "En cuanto a la lengua de enseñanza, la Ley 115 de 1994 establece que en este territorio la enseñanza debe ser", "f": "Ley 115 de 1994, artículos 21 (literal c) y 57; Constitución Política, artículo 68.", "o": [["A", "bilingüe, con la lengua materna de la comunidad como fundamento escolar y sin descuidar el castellano.", "El artículo 57 de la Ley 115 dispone que, en sus territorios, la enseñanza de los grupos étnicos con tradición lingüística propia será bilingüe, tomando como fundamento escolar la lengua materna, sin detrimento de lo dispuesto en el literal c) del artículo 21 sobre la lengua castellana.", true], ["B", "exclusivamente en wayuunaiki, para proteger la identidad cultural frente a la influencia externa.", "La ley no excluye el castellano: la enseñanza es bilingüe y el literal c) del artículo 21 exige desarrollar las habilidades comunicativas en lengua castellana, además de la lengua materna.", false], ["C", "en castellano, para asegurar condiciones de igualdad en las pruebas externas que presentarán los estudiantes.", "Desconoce el artículo 57 de la Ley 115 y el artículo 68 de la Constitución, que reconoce a los grupos étnicos el derecho a una formación que respete y desarrolle su identidad cultural, de la que hace parte su lengua.", false]]}, {"id": "NR-108", "niv": 2, "e": "Para atender la petición de las autoridades tradicionales sobre el plan de estudios, usted se apoya en que la etnoeducación debe orientarse, entre otros, por los criterios de", "f": "Ley 115 de 1994, artículo 56.", "o": [["A", "homogeneidad curricular, castellanización progresiva y evaluación estandarizada.", "Ninguno de estos es criterio de la etnoeducación; la homogeneidad y la castellanización contradicen la interculturalidad y la diversidad lingüística que fija el artículo 56.", false], ["B", "neutralidad cultural, autonomía docente y centralización de contenidos.", "La ley no plantea neutralidad cultural ni centralización: exige participación comunitaria y flexibilidad, de modo que los saberes propios entren al currículo con la comunidad.", false], ["C", "interculturalidad, diversidad lingüística y participación comunitaria.", "El artículo 56 de la Ley 115 establece que la educación en los grupos étnicos tendrá en cuenta los criterios de integralidad, interculturalidad, diversidad lingüística, participación comunitaria, flexibilidad y progresividad.", true]]}, {"id": "NR-109", "niv": 2, "e": "Sobre la selección del docente que reemplazará a la maestra que se jubila, la Ley 115 de 1994 dispone que", "f": "Ley 115 de 1994, artículo 62.", "o": [["A", "se aplique el listado general de elegibles, sin considerar la lengua ni la pertenencia a la comunidad.", "El artículo 62 exige que los educadores de estos territorios acrediten formación en etnoeducación y conocimientos básicos del grupo, en especial de su lengua materna; no basta el orden de un listado general.", false], ["B", "las autoridades competentes la hagan en concertación con el grupo étnico, preferiblemente entre miembros de la comunidad.", "El artículo 62 dispone que las autoridades competentes, en concertación con los grupos étnicos, seleccionen a los educadores que laboren en sus territorios, preferiblemente entre los miembros de las comunidades allí radicados, con formación en etnoeducación y conocimiento de la lengua materna y del castellano.", true], ["C", "la autoridad tradicional la haga directamente, sin intervención de la entidad territorial certificada.", "La ley habla de concertación entre las autoridades competentes y los grupos étnicos, no de una designación unilateral de la autoridad tradicional; además, la vinculación se rige por el estatuto docente y las normas especiales (artículo 62, inciso segundo).", false]]}, {"id": "NR-110", "niv": 3, "e": "Respecto del ofrecimiento de la fundación internacional de aplicar su propio currículo, la condición que exige la Ley 115 de 1994 es", "f": "Ley 115 de 1994, artículo 60.", "o": [["A", "contar con la aprobación del Ministerio de Educación y con el consentimiento de las comunidades interesadas.", "El artículo 60 prohíbe la injerencia de organismos internacionales, públicos o privados, en la educación de los grupos étnicos sin la aprobación del Ministerio de Educación Nacional y sin el consentimiento de las comunidades interesadas. Se requieren las dos condiciones.", true], ["B", "contar con el consentimiento de la comunidad, porque la etnoeducación no depende del Ministerio.", "El consentimiento comunitario es necesario pero no suficiente; el artículo 60 también exige la aprobación del Ministerio de Educación Nacional.", false], ["C", "contar con la aprobación del director y del consejo directivo del centro etnoeducativo.", "La decisión no es solo institucional: el artículo 60 exige la aprobación del Ministerio de Educación Nacional y el consentimiento de las comunidades.", false]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Proyecto Educativo Institucional (Ley 115 de 1994, art. 73; Decreto 1860 de 1994, arts. 14 y 15)", "texto": "Una institución educativa de Villavicencio inicia la actualización de su Proyecto Educativo Institucional (PEI). El rector conforma mesas de trabajo con docentes, padres, estudiantes y egresados, y usted coordina la mesa de docentes. Durante el proceso surgen tres inquietudes: qué aspectos debe contener como mínimo el PEI, quién lo adopta formalmente y qué trámite debe seguir una propuesta de modificación que el consejo de estudiantes presentó meses después de su adopción.", "items": [{"id": "NR-120", "niv": 1, "e": "Entre los aspectos que el PEI debe contener como mínimo, según el Decreto 1860 de 1994, se encuentran", "f": "Decreto 1860 de 1994, artículo 14.", "o": [["A", "los listados de estudiantes beneficiarios de los programas de alimentación escolar.", "Los listados de beneficiarios son información operativa de un programa; no figuran entre los catorce aspectos mínimos del artículo 14 del Decreto 1860.", false], ["B", "las acciones pedagógicas para la educación en democracia, sexualidad, tiempo libre y ambiente.", "El numeral 6 del artículo 14 del Decreto 1860 de 1994 incluye entre los contenidos mínimos del PEI las acciones pedagógicas relacionadas con la educación para el ejercicio de la democracia, la educación sexual, el uso del tiempo libre, el aprovechamiento y conservación del ambiente y los valores humanos.", true], ["C", "las hojas de vida y los resultados de la evaluación de desempeño de cada docente.", "La evaluación individual de desempeño es un proceso del Decreto 1278 de 2002 a cargo del rector; no es un contenido del PEI. El artículo 14 sí incluye la evaluación de los recursos humanos disponibles y previstos, que es algo distinto.", false]]}, {"id": "NR-121", "niv": 2, "e": "Una vez terminada la deliberación, el PEI debe ser adoptado por", "f": "Decreto 1860 de 1994, artículos 15 y 24.", "o": [["A", "el rector, mediante resolución, después de escuchar las recomendaciones del consejo de padres.", "Al rector le corresponde orientar el proceso y presentar el plan operativo, pero la adopción del PEI es competencia del consejo directivo (artículo 15, numeral 2).", false], ["B", "el consejo académico, por ser la instancia superior de orientación pedagógica del establecimiento educativo.", "El consejo académico actúa como órgano consultor del consejo directivo en la revisión del PEI (Decreto 1860, artículo 24, literal a), pero no lo adopta.", false], ["C", "el consejo directivo, en consulta con el consejo académico, que luego lo divulga entre la comunidad.", "El numeral 2 del artículo 15 del Decreto 1860 de 1994 establece que la propuesta se somete al consejo directivo, que en consulta con el consejo académico la revisa, integra sus componentes y procede a adoptarla y divulgarla.", true]]}, {"id": "NR-122", "niv": 3, "e": "Frente a la propuesta de modificación del consejo de estudiantes, el procedimiento previsto en el Decreto 1860 de 1994 es", "f": "Decreto 1860 de 1994, artículo 15, numeral 3 y parágrafo.", "o": [["A", "presentarla al rector, quien la somete a discusión de los demás estamentos antes de que decida el consejo directivo.", "El numeral 3 del artículo 15 del Decreto 1860 dispone que las modificaciones al PEI pueden ser solicitadas al rector por cualquier estamento; este las somete a discusión de los demás estamentos y luego el consejo directivo decide, previa consulta con el consejo académico.", true], ["B", "presentarla a la secretaría de educación, que es la autoridad competente para modificar el PEI.", "La secretaría de educación asesora a los establecimientos que lo soliciten en el proceso del PEI (artículo 15, parágrafo), pero no lo modifica: la decisión corresponde al consejo directivo.", false], ["C", "presentarla al consejo académico, que la adopta directamente si la aprueba la mayoría de sus miembros.", "El consejo académico es consultado, pero la decisión sobre las modificaciones corresponde al consejo directivo, después de la discusión de los estamentos.", false]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Personero y consejo de estudiantes (Ley 115 de 1994, art. 94; Decreto 1860 de 1994, arts. 28 y 29)", "texto": "Usted es docente de ciencias sociales en una institución oficial de Montería que ofrece desde preescolar hasta grado once, y el rector le encarga organizar el proyecto de democracia escolar. Debe preparar la elección del personero de los estudiantes y la conformación del consejo de estudiantes. Varios estudiantes de noveno quieren postularse a personero. Además, el consejo de estudiantes quiere nombrar al estudiante de once que resulte elegido personero como su representante ante el consejo directivo, porque es muy popular.", "items": [{"id": "NR-134", "niv": 1, "e": "Sobre quién puede ser personero, usted informa a los estudiantes que debe ser", "f": "Ley 115 de 1994, artículo 94; Decreto 1860 de 1994, artículo 28.", "o": [["A", "un estudiante de cualquiera de los grados de la básica secundaria o de la media.", "La ley no permite postular a estudiantes de cualquier grado: exige que curse el último grado ofrecido, por lo que los de noveno no pueden aspirar.", false], ["B", "un estudiante de noveno, décimo u once que tenga desempeño alto o superior.", "El requisito legal es cursar el último grado; la ley no fija un nivel de desempeño ni admite grados distintos al último ofrecido.", false], ["C", "un estudiante que curse el último grado que ofrezca la institución.", "El artículo 94 de la Ley 115 de 1994 y el artículo 28 del Decreto 1860 de 1994 establecen que el personero será un alumno que curse el último grado que ofrezca la institución; en este caso, grado once.", true]]}, {"id": "NR-135", "niv": 2, "e": "Para la elección del personero, el procedimiento que establece el Decreto 1860 de 1994 consiste en", "f": "Decreto 1860 de 1994, artículos 28 y 29.", "o": [["A", "convocar solo a los estudiantes de secundaria y media para elegirlo por mayoría absoluta de votos, dentro de los sesenta días calendario siguientes al inicio de clases.", "La convocatoria incluye a todos los estudiantes matriculados, también los de preescolar y primaria; basta la mayoría simple y el plazo es de treinta días calendario, no de sesenta.", false], ["B", "convocar a todos los estudiantes matriculados para elegirlo por mayoría simple y voto secreto, dentro de los treinta días calendario siguientes al inicio de clases.", "El artículo 28 del Decreto 1860 de 1994 dispone que el personero será elegido dentro de los treinta días calendario siguientes al de la iniciación de clases; el rector convoca a todos los estudiantes matriculados para elegirlo por el sistema de mayoría simple y mediante voto secreto.", true], ["C", "pedir al consejo de estudiantes que lo elija entre sus voceros por votación secreta, dentro de las cuatro primeras semanas del calendario académico.", "El consejo de estudiantes elige al representante de los estudiantes ante el consejo directivo (artículo 29), no al personero, a quien eligen todos los estudiantes matriculados.", false]]}, {"id": "NR-136", "niv": 3, "e": "Frente a la intención del consejo de estudiantes de nombrar al personero como su representante ante el consejo directivo, usted aclara que", "f": "Decreto 1860 de 1994, artículos 21 (numeral 4), 28 y 29.", "o": [["A", "es posible si el consejo directivo lo autoriza, porque ambos cargos exigen cursar el último grado.", "Aunque ambos cargos exigen cursar el último grado, la norma los declara incompatibles y no prevé una autorización que levante esa incompatibilidad.", false], ["B", "es posible, siempre que el personero se abstenga de votar en todas las decisiones que afecten a los estudiantes del establecimiento.", "No existe una fórmula de abstención parcial: la incompatibilidad del artículo 28 impide ejercer los dos cargos al mismo tiempo.", false], ["C", "no es posible, porque el cargo de personero es incompatible con el de representante ante el consejo directivo.", "El último inciso del artículo 28 del Decreto 1860 de 1994 establece que el ejercicio del cargo de personero de los estudiantes es incompatible con el de representante de los estudiantes ante el consejo directivo.", true]]}, {"id": "NR-137", "niv": 3, "e": "Durante el año, el rector niega una solicitud que el personero presentó para proteger los derechos de los estudiantes. Si el personero no está de acuerdo, puede", "f": "Ley 115 de 1994, artículo 94, parágrafo; Decreto 1860 de 1994, artículo 28, literal d).", "o": [["A", "llevar la decisión ante la secretaría de educación, que actúa como segunda instancia del rector.", "La norma no establece a la secretaría de educación como segunda instancia de estas peticiones; la instancia que resuelve en última instancia es el consejo directivo.", false], ["B", "apelar la decisión ante el consejo directivo, que resuelve en última instancia.", "El literal d) del artículo 28 del Decreto 1860 permite al personero apelar ante el consejo directivo las decisiones del rector sobre las peticiones presentadas por su intermedio, y el parágrafo del artículo 94 de la Ley 115 señala que el consejo directivo las resuelve en última instancia.", true], ["C", "apelar la decisión ante el consejo académico, que tramita los reclamos de los estudiantes.", "El consejo académico se ocupa de asuntos curriculares y de evaluación; la norma señala al consejo directivo como instancia de apelación de las decisiones del rector sobre peticiones del personero.", false]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Evaluación y promoción de los estudiantes (Decreto 1290 de 2009)", "texto
