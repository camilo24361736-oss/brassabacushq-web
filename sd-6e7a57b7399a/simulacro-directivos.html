nte para que el comité sesione.", false], ["B", "el comité no puede sesionar sin su presidente, por lo que la sesión debe programarse cuando usted pueda presidirla.", "El Decreto 1965 de 2013, artículo 24, establece que el comité escolar de convivencia no puede sesionar sin la presencia del presidente; el seguimiento debe programarse en una sesión que el rector presida.", true], ["C", "puede reunirlo y presidirlo, porque como coordinador es miembro del comité y por esa razón lo reemplaza a usted en sus ausencias temporales.", "La norma no prevé que el coordinador reemplace al presidente en el comité; establece que el comité no puede sesionar sin su presidente (Decreto 1965, art. 24).", false]]}, {"id": "DI-134", "niv": 2, "e": "Al fijar el calendario de sesiones ordinarias del comité, usted tiene en cuenta que", "f": "Decreto 1965 de 2013, artículo 23; Ley 1620 de 2013, artículo 13.", "o": [["A", "sesiona cuando se presentan situaciones tipo II o III, ya que las de tipo I las atienden los docentes.", "El comité tiene sesiones ordinarias periódicas y funciones de promoción y prevención, no solo de atención de casos (Ley 1620, art. 13; Decreto 1965, art. 23).", false], ["B", "debe sesionar una vez por semestre, para que coincida con la entrega de informes a las familias.", "Una sesión por semestre incumple el mínimo de una sesión ordinaria cada dos meses que fija el Decreto 1965 de 2013, artículo 23.", false], ["C", "debe sesionar como mínimo una vez cada dos meses, sin perjuicio de las sesiones extraordinarias que usted convoque.", "El Decreto 1965 de 2013, artículo 23, dispone que el comité sesiona como mínimo una vez cada dos meses y que las sesiones extraordinarias las convoca el presidente.", true]]}]}, {"comp": "pedagogia_normativa", "rol": "directivo", "tag": "Competencias pedagógicas y normativa · Educación inclusiva y PIAR (Decreto 1421 de 2017)", "texto": "Usted es coordinador académico de una institución educativa oficial de Cúcuta. En julio, una familia solicita cupo en tercero para su hijo de 9 años, quien, según la madre, «tiene dificultades para hablar y para caminar». La familia no cuenta con diagnóstico ni certificado médico. La secretaria de la institución sugiere esperar el diagnóstico antes de matricularlo. La institución tiene una docente de apoyo pedagógico que atiende a varias sedes.", "items": [{"id": "DI-143", "niv": 2, "e": "Frente a la sugerencia de la secretaria, lo que corresponde es", "f": "Decreto 1075 de 2015, artículo 2.3.3.5.2.3.3 (Decreto 1421 de 2017).", "o": [["A", "orientar a la familia hacia una institución especializada en atención a la discapacidad, donde el niño recibirá una atención más pertinente.", "El estudiante tiene derecho a la oferta general con los ajustes razonables que requiera; ningún establecimiento puede rechazar la matrícula por discapacidad (Decreto 1421 de 2017).", false], ["B", "matricularlo, registrar en el SIMAT la información de la familia y reportar el caso a la secretaría para gestionar el diagnóstico.", "El Decreto 1075 de 2015, artículo 2.3.3.5.2.3.3 (Decreto 1421 de 2017), ordena que, si el estudiante no tiene diagnóstico, se proceda con la matrícula y el registro en el SIMAT con la información de la familia, y se reporte a la secretaría para establecer el diagnóstico en un plazo no mayor a tres meses.", true], ["C", "esperar el diagnóstico médico antes de matricularlo, para definir desde el inicio los apoyos que requiere.", "La falta de diagnóstico no puede retrasar el ingreso: la norma ordena proceder con la matrícula y gestionar el diagnóstico con la secretaría de educación (Decreto 1075 de 2015, art. 2.3.3.5.2.3.3).", false]]}, {"id": "DI-144", "niv": 3, "e": "Como el estudiante ingresa en julio, el PIAR y el acta de acuerdo deben elaborarse", "f": "Decreto 1075 de 2015, artículo 2.3.3.5.2.3.5 (Decreto 1421 de 2017).", "o": [["A", "durante el primer trimestre del siguiente año escolar.", "El primer trimestre es el plazo general para elaborar el PIAR, pero para quien se vincula de forma extemporánea la norma fija un término no mayor a treinta días (art. 2.3.3.5.2.3.5).", false], ["B", "antes de que finalice el período académico en curso en la institución.", "La norma no se refiere al cierre del período sino a un término máximo de treinta días desde la vinculación extemporánea (art. 2.3.3.5.2.3.5).", false], ["C", "en un término no mayor a treinta días desde su vinculación.", "El Decreto 1075 de 2015, artículo 2.3.3.5.2.3.5, prevé que, cuando un estudiante se vincula de manera extemporánea, se contemple un término no mayor a treinta días para elaborar el PIAR y firmar el acta de acuerdo.", true]]}, {"id": "DI-145", "niv": 3, "e": "Una vez diseñado el PIAR, el acta de acuerdo debe ser firmada por", "f": "Decreto 1075 de 2015, artículos 2.3.3.5.2.3.5 y 2.3.3.5.2.3.6 (Decreto 1421 de 2017).", "o": [["A", "el acudiente, el directivo de la institución, la docente de apoyo y los docentes a cargo del estudiante.", "El Decreto 1075 de 2015, artículo 2.3.3.5.2.3.6, dispone que el acta de acuerdo la firman el acudiente, el directivo de la institución, el docente de apoyo y los docentes a cargo, quienes conservan copia para su seguimiento.", true], ["B", "la docente de apoyo y el médico tratante del estudiante, que son quienes definen los ajustes razonables.", "Los ajustes razonables se definen a partir de la valoración pedagógica, no de un diagnóstico médico, y la familia y los docentes de aula deben firmar el acta (art. 2.3.3.5.2.3.6).", false], ["C", "el acudiente y el rector, quien la remite a la secretaría de educación para su aprobación.", "El acta no requiere aprobación de la secretaría y deben firmarla también la docente de apoyo y los docentes a cargo (art. 2.3.3.5.2.3.6).", false]]}, {"id": "DI-146", "niv": 1, "e": "Para que los ajustes razonables del PIAR se gestionen de manera efectiva, usted como directivo debe", "f": "Decreto 1421 de 2017 (responsabilidades de los establecimientos educativos; planes de mejoramiento institucional), compilado en el Decreto 1075 de 2015.", "o": [["A", "solicitar a la familia que asuma los costos de los apoyos que el estudiante requiera.", "La familia tiene compromisos de corresponsabilidad, pero los apoyos y ajustes son obligaciones del sistema educativo, gestionados por el establecimiento y la entidad territorial (Decreto 1421 de 2017).", false], ["B", "articularlos con el plan de mejoramiento institucional y con la planeación de aula.", "El Decreto 1421 de 2017 obliga a los establecimientos a articular los PIAR con la planeación de aula y el plan de mejoramiento institucional, y dispone que el directivo articule en el PMI los ajustes razonables incluidos en los PIAR.", true], ["C", "dejar su gestión a cargo de la docente de apoyo, ya que es quien conoce las necesidades del estudiante.", "La docente de apoyo participa en el diseño del PIAR, pero la norma asigna a los directivos articular los ajustes con el plan de mejoramiento institucional y garantizar su cumplimiento (Decreto 1421 de 2017).", false]]}]}, {"comp": "pedagogia_normativa", "rol": "directivo", "tag": "Competencias pedagógicas y normativa · Jornada escolar y laboral (Decreto 1075 de 2015, modificado por el Decreto 277 de 2025)", "texto": "Usted es rector de una institución educativa oficial de Neiva con preescolar, básica y media. Está organizando la asignación académica y los horarios del año. Marta, docente de matemáticas de básica secundaria, tiene a cargo 16 horas semanales de matemáticas y 4 de estadística, en horas efectivas de 60 minutos. Un docente de sociales le pide salir todos los días después de su última clase, a las 11:00 a. m., para preparar clases en su casa, aunque el horario de permanencia de los docentes en la institución va de 6:30 a. m. a 12:30 p. m. Por su parte, el coordinador pregunta si a él también le aplica esa permanencia de seis horas.", "items": [{"id": "DI-147", "niv": 2, "e": "Para completar la asignación académica semanal de Marta, le faltan", "f": "Decreto 1075 de 2015, artículo 2.4.3.2.1, modificado por el Decreto 277 de 2025.", "o": [["A", "0 horas, porque las 20 horas que tiene ya cumplen la asignación exigida.", "Toma como referencia las 20 horas semanales, que corresponden a la asignación de preescolar; en básica secundaria y media la asignación es de 22 horas (Decreto 1075 de 2015, art. 2.4.3.2.1, modificado por el Decreto 277 de 2025).", false], ["B", "2 horas efectivas, para llegar a las 22 horas semanales.", "La asignación académica semanal en básica secundaria y media es de 22 horas (Decreto 1075 de 2015, art. 2.4.3.2.1, modificado por el Decreto 277 de 2025). Marta tiene 16 + 4 = 20 horas, así que le faltan 22 − 20 = 2.", true], ["C", "5 horas efectivas, para llegar a las 25 horas semanales.", "Usa las 25 horas semanales, que corresponden a la asignación de básica primaria; Marta es docente de secundaria (Decreto 1075 de 2015, art. 2.4.3.2.1, modificado por el Decreto 277 de 2025).", false]]}, {"id": "DI-148", "niv": 2, "e": "Frente a la solicitud del docente de sociales, usted le responde que", "f": "Decreto 1075 de 2015, artículo 2.4.3.3.3, modificado por el Decreto 277 de 2025.", "o": [["A", "puede retirarse al terminar sus clases, porque la preparación de clases es una actividad curricular complementaria que puede realizar en su casa.", "Preparar clases es una actividad complementaria, pero la norma exige seis horas diarias continuas de permanencia en el establecimiento; solo el tiempo restante de la jornada se cumple de forma autónoma (Decreto 277 de 2025).", false], ["B", "puede retirarse al terminar sus clases si recupera ese tiempo en reuniones de área programadas los sábados.", "La norma no prevé compensar la permanencia diaria con jornadas en otros días; las seis horas deben ser diarias y continuas (Decreto 277 de 2025).", false], ["C", "debe permanecer seis horas continuas en la institución, y el tiempo restante de su jornada puede completarlo fuera de ella.", "El Decreto 1075 de 2015, artículo 2.4.3.3.3, modificado por el Decreto 277 de 2025, establece que los docentes de aula permanecen seis horas diarias continuas en el establecimiento, distribuidas por el rector, y completan el resto de la jornada laboral de ocho horas realizando autónomamente actividades curriculares complementarias.", true]]}, {"id": "DI-149", "niv": 3, "e": "Al coordinador, usted le explica que", "f": "Decreto 1075 de 2015, artículo 2.4.3.3.3, modificado por el Decreto 277 de 2025.", "o": [["A", "como directivo dedica las ocho horas diarias de su jornada a las funciones del cargo; la regla de seis horas es para docentes de aula.", "El Decreto 1075 de 2015, artículo 2.4.3.3.3, modificado por el Decreto 277 de 2025, dispone que directivos docentes y docentes dedican ocho horas diarias a las funciones de su cargo, y reserva la regla de seis horas continuas de permanencia con trabajo autónomo posterior a los docentes de aula.", true], ["B", "su jornada se ajusta al horario de los estudiantes, de modo que termina cuando ellos salen de la institución.", "La jornada laboral no equivale a la jornada escolar de los estudiantes; para los directivos es de ocho horas diarias dedicadas a las funciones del cargo (Decreto 1075 de 2015, art. 2.4.3.3.3, modificado por el Decreto 277 de 2025).", false], ["C", "le aplica la misma regla de los docentes de aula: seis horas en la institución y el resto de su jornada de forma autónoma.", "La regla de seis horas de permanencia y trabajo autónomo está prevista para los docentes de aula; los directivos docentes dedican las ocho horas de su jornada a las funciones propias del cargo (Decreto 277 de 2025).", false]]}, {"id": "DI-150", "niv": 1, "e": "Para las semanas de desarrollo institucional, usted", "f": "Decreto 1850 de 2002, artículos 8 y 14.", "o": [["A", "programa clases de nivelación para los estudiantes con bajo desempeño, aprovechando que en esas semanas los docentes están disponibles en la institución.", "Esas cinco semanas son distintas de las 40 semanas lectivas y se dedican a actividades institucionales como el PEI y el plan de estudios, no a clases (Decreto 1850, arts. 8 y 14).", false], ["B", "concede a los docentes ese tiempo para trabajo autónomo en casa, ya que no hay estudiantes en la institución.", "La ausencia de estudiantes no convierte esas semanas en trabajo autónomo: el rector debe adoptar un plan de trabajo para directivos y docentes durante toda la jornada laboral (Decreto 1850, art. 8).", false], ["C", "adopta un plan de trabajo para directivos y docentes sobre el PEI, el plan de estudios, la actualización y la evaluación institucional.", "El Decreto 1850 de 2002, artículo 8, define estas actividades (formulación y ajuste del PEI, plan de estudios, investigación y actualización pedagógica, evaluación institucional) y ordena al rector adoptar un plan de trabajo para directivos y docentes durante toda la jornada laboral.", true]]}]}, {"comp": "pedagogia_normativa", "rol": "directivo", "tag": "Competencias pedagógicas y normativa · Gobierno escolar y participación (Ley 115 de 1994; Decreto 1860 de 1994; Ley 1620 de 2013)", "texto": "Usted es rectora de una institución educativa oficial de Pasto. El personero estudiantil le presentó una solicitud para que los estudiantes puedan usar la biblioteca durante el descanso, y usted la negó por falta de personal. Además, la comunidad pide actualizar el manual de convivencia para regular el uso de celulares en clase. Por último, después de un cese de actividades de tres días convocado por el sindicato docente, un miembro del consejo directivo propone que el consejo autorice reponer esas clases los sábados.", "items": [{"id": "DI-151", "niv": 1, "e": "Si el personero no está de acuerdo con la decisión que usted tomó sobre su solicitud, él puede", "f": "Decreto 1860 de 1994, artículo 28, literal d; Ley 115 de 1994, artículo 94.", "o": [["A", "apelarla ante el consejo directivo.", "El Decreto 1860 de 1994, artículo 28, literal d, faculta al personero para apelar ante el consejo directivo las decisiones del rector sobre las peticiones presentadas por su intermedio; la Ley 115, artículo 94, también remite al consejo directivo.", true], ["B", "apelarla ante el comité de convivencia.", "El comité escolar de convivencia atiende situaciones que afectan la convivencia (Ley 1620, art. 13); no es instancia de apelación de las decisiones del rector sobre las solicitudes del personero.", false], ["C", "apelarla ante el consejo académico.", "El consejo académico se ocupa del currículo, el plan de estudios y la evaluación; la apelación de las decisiones del rector sobre peticiones del personero va al consejo directivo (Decreto 1860, art. 28).", false]]}, {"id": "DI-152", "niv": 2, "e": "Para actualizar el manual de convivencia, usted", "f": "Ley 1620 de 2013, artículo 18, numeral 3; Decreto 1860 de 1994, artículo 23, literal c.", "o": [["A", "encarga su redacción al comité de convivencia, que lo aprueba en su siguiente sesión ordinaria.", "El comité hace seguimiento al manual (Ley 1620, art. 13), pero no lo aprueba; la adopción corresponde al consejo directivo (Decreto 1860, art. 23, lit. c).", false], ["B", "lidera una revisión participativa con estudiantes y demás estamentos, y presenta la propuesta al consejo directivo para su adopción.", "La Ley 1620 de 2013, artículo 18, numeral 3, asigna al rector liderar la revisión y ajuste anual del manual en un proceso participativo que involucre a los estudiantes y a la comunidad, y el Decreto 1860 de 1994, artículo 23, literal c, asigna al consejo directivo adoptarlo.", true], ["C", "lo modifica mediante resolución rectoral, por ser quien lidera su revisión, y lo da a conocer a la comunidad al inicio del siguiente período.", "El rector lidera la revisión, pero no adopta el manual por sí solo: su adopción corresponde al consejo directivo (Decreto 1860, art. 23, lit. c), tras un proceso participativo (Ley 1620, art. 18).", false]]}, {"id": "DI-153", "niv": 3, "e": "Frente a la propuesta de que el consejo directivo autorice reponer las clases los sábados, usted explica que", "f": "Decreto 1850 de 2002, artículo 15; Ley 115 de 1994, artículo 144, literal a.", "o": [["A", "la rectoría puede autorizarlo, porque al rector le corresponde fijar el horario de la jornada escolar.", "Fijar el horario no incluye autorizar reposiciones por días no trabajados: el Decreto 1850, artículo 15, también niega esa competencia a los rectores.", false], ["B", "el consejo directivo puede autorizarlo, porque le corresponde tomar las decisiones que afectan el funcionamiento de la institución.", "Esa función general del consejo (Ley 115, art. 144, lit. a) excluye las decisiones que competen a otra autoridad; el Decreto 1850, artículo 15, niega a los consejos directivos competencia para autorizar estas reposiciones.", false], ["C", "ni el consejo directivo ni la rectoría son competentes para autorizar la reposición de clases por días no trabajados por cese de actividades.", "El Decreto 1850 de 2002, artículo 15, establece que las autoridades territoriales, los consejos directivos y los rectores no son competentes para autorizar la reposición de clases por días no trabajados por cese de actividades académicas.", true]]}]}, {"comp": "psicotecnica", "rol": "directivo", "tag": "Prueba psicotécnica · Competencias comportamentales (Guía 31, Decreto 1278 de 2002)", "texto": "Usted es rector de una institución educativa que hace dos años integró tres sedes que antes funcionaban como colegios independientes. Los docentes de cada sede conservan sus propias costumbres: celebran por separado, planean por separado y se refieren a las otras sedes como «los de allá». Los resultados de las pruebas Saber 9.° bajaron en lectura y matemáticas, y en la jornada pedagógica de inicio de año varios docentes expresan que «la integración fue una imposición» y que no se sienten parte de un mismo proyecto.", "items": [{"id": "DI-116", "niv": 1, "e": "Para fortalecer una identidad común entre las sedes, usted", "f": "MEN (2008). Guía 31, Anexo 1: Glosario de competencias (Liderazgo).", "o": [["A", "organiza mesas de trabajo con docentes de las tres sedes para revisar juntos la misión, la visión y las metas del PEI.", "Corresponde al liderazgo: capacidad para motivar e involucrar a los miembros de la comunidad educativa con la construcción de una identidad común y el desarrollo de la visión institucional (Guía 31).", true], ["B", "permite que cada sede conserve su propio plan de trabajo, para respetar sus tradiciones y evitar nuevas tensiones.", "Evita el conflicto a corto plazo, pero mantiene la fragmentación y renuncia a construir una visión institucional compartida, que es el núcleo del liderazgo directivo.", false], ["C", "redacta con los coordinadores una nueva visión institucional y la socializa en cada sede para agilizar el proceso.", "Es eficiente y bien intencionado, pero no involucra a los docentes en la construcción de la identidad común; socializar un producto terminado no genera compromiso con él.", false]]}, {"id": "DI-117", "niv": 2, "e": "Frente a la baja en los resultados de Saber 9.°, usted", "f": "MEN (2008). Guía 31, Anexo 1: Glosario de competencias (Orientación al logro).", "o": [["A", "propone metas de mejora por área con indicadores verificables y acuerda con los docentes un seguimiento periódico.", "Corresponde a la orientación al logro: dirigir el comportamiento hacia el cumplimiento de estándares elevados con miras al mejoramiento continuo y procurar que los estudiantes obtengan resultados de excelencia (Guía 31).", true], ["B", "solicita a la secretaría de educación que considere el proceso de integración al analizar los resultados de este año.", "Contextualizar los resultados puede ser válido, pero la acción se centra en justificarlos y no en dirigir el esfuerzo institucional hacia su mejoramiento.", false], ["C", "dispone que en el segundo semestre las clases de noveno se dediquen a resolver simulacros tipo Saber.", "Busca un resultado inmediato, pero sacrifica el plan de estudios y no actúa sobre las causas del bajo desempeño; no es una estrategia de mejoramiento continuo.", false]]}, {"id": "DI-118", "niv": 2, "e": "Cuando un docente afirma en la jornada que «la integración fue una imposición», usted", "f": "MEN (2008). Guía 31, Anexo 1: Glosario de competencias (Comunicación y relaciones interpersonales).", "o": [["A", "le explica que la integración fue una decisión de la secretaría de educación y que, por tanto, el tema no está en discusión en esta jornada.", "Es una respuesta veraz, pero cierra el diálogo y no reconoce el malestar del grupo; no favorece relaciones basadas en la confianza.", false], ["B", "le pide que guarde sus comentarios para el final, porque la agenda de la jornada ya fue aprobada.", "Prioriza el orden de la reunión sobre la comunicación; posterga un malestar que comparten varios docentes y transmite poca disposición a escuchar.", false], ["C", "reconoce el malestar, le pide que precise qué aspectos le afectan y propone tratarlos con representantes de cada sede.", "Corresponde a comunicación y relaciones interpersonales: escuchar con atención y comprender los puntos de vista de los demás, formular preguntas claras que aclaren la situación y manejar las emociones propias y ajenas (Guía 31).", true]]}, {"id": "DI-119", "niv": 1, "e": "Para que los docentes de las tres sedes compartan experiencias exitosas sin afectar las clases, usted", "f": "MEN (2008). Guía 31, Anexo 1: Glosario de competencias (Iniciativa).", "o": [["A", "solicita a la secretaría de educación que programe una capacitación sobre trabajo colaborativo dirigida a los docentes de todas las sedes.", "Puede ser útil, pero traslada a otros la solución y no aprovecha los recursos con que ya cuenta la institución; la iniciativa implica actuar con autonomía y recursividad.", false], ["B", "crea una red interna de práctica pedagógica que use las semanas de desarrollo institucional y un espacio virtual.", "Corresponde a la iniciativa: trabajar proactivamente, demostrar recursividad y flexibilidad, y proponer y desarrollar ideas o proyectos novedosos para la institución (Guía 31).", true], ["C", "espera a que la integración se consolide antes de promover intercambios, para no sobrecargar a los docentes.", "Es prudente en apariencia, pero renuncia a anticipar y a proponer soluciones; aplazar los intercambios prolonga el aislamiento entre sedes.", false]]}]}, {"comp": "psicotecnica", "rol": "directivo", "tag": "Prueba psicotécnica · Competencias comportamentales (Guía 31, Decreto 1278 de 2002)", "texto": "Usted es coordinador de convivencia de una institución educativa de Soacha. Dos docentes del área de ciencias naturales, que han trabajado juntos durante años, dejaron de hablarse después de una discusión por el uso del laboratorio: ambos lo programaron para las mismas horas y cada uno culpa al otro de no respetar el horario. La tensión ya se nota en las reuniones de área y los estudiantes empiezan a comentar el conflicto. El rector le pide que intervenga.", "items": [{"id": "DI-135", "niv": 1, "e": "Para comenzar a atender el conflicto, usted", "f": "MEN (2008). Guía 31, Anexo 1: Glosario de competencias (Negociación y mediación).", "o": [["A", "se reúne primero con cada docente por separado para comprender su versión, sus motivos y lo que espera del laboratorio.", "Corresponde a negociación y mediación: identificar y comprender las causas y el contexto de un conflicto, valorando con imparcialidad los motivos de los implicados, e intervenir oportunamente (Guía 31).", true], ["B", "asigna usted mismo los horarios del laboratorio y los comunica por escrito a ambos docentes, para cerrar la discusión de inmediato.", "Resuelve el cruce de horarios, pero impone una solución sin comprender las causas ni involucrar a las partes, por lo que la relación entre los docentes sigue deteriorada.", false], ["C", "deja pasar unas semanas para que los ánimos se calmen, ya que se trata de docentes con experiencia.", "Parece respetuoso, pero no es una intervención oportuna: el conflicto ya afecta al área y a los estudiantes.", false]]}, {"id": "DI-136", "niv": 2, "e": "En la reunión conjunta con los dos docentes, usted", "f": "MEN (2008). Guía 31, Anexo 1: Glosario de competencias (Negociación y mediación).", "o": [["A", "les presenta un horario de laboratorio que usted elaboró y les pide aceptarlo para cerrar el tema.", "Es eficiente y resuelve el cruce de horarios, pero no es participativo: impone una solución en lugar de facilitar un acuerdo que las partes asuman como propio.", false], ["B", "les propone construir juntos criterios para el uso del laboratorio que atiendan las necesidades de ambos grupos.", "Corresponde a negociación y mediación: facilitar acuerdos y soluciones multilaterales, anteponiendo los intereses comunes y generando confianza en el proceso de mediación (Guía 31).", true], ["C", "les pide que cada uno reconozca su error y se disculpe con el otro, para restablecer la relación.", "Busca la reconciliación, pero centra la reunión en culpas y no en los intereses de ambos; puede generar resistencia y no resuelve el uso del laboratorio.", false]]}, {"id": "DI-137", "niv": 3, "e": "Una vez los docentes llegan a un acuerdo sobre el uso del laboratorio, usted", "f": "MEN (2008). Guía 31, Anexo 1: Glosario de competencias (Negociación y mediación).", "o": [["A", "envía a ambos docentes el acuerdo por correo y les pide que le avisen si surge algún problema.", "Deja constancia del acuerdo, pero el seguimiento queda supeditado a que alguien reporte un problema; no hay una verificación planeada de los compromisos.", false], ["B", "informa el acuerdo al consejo directivo para que lo incorpore al manual de convivencia como una norma institucional de obligatorio cumplimiento.", "Formaliza el acuerdo, pero lo lleva a una instancia que no corresponde: un acuerdo operativo entre dos docentes no es materia del manual de convivencia, y no asegura el seguimiento con las partes.", false], ["C", "deja el acuerdo por escrito y programa con ellos una revisión al cabo de un mes para verificar cómo ha funcionado.", "Corresponde a negociación y mediación: promover soluciones duraderas y hacer seguimiento a los compromisos adquiridos por las partes (Guía 31).", true]]}, {"id": "DI-138", "niv": 2, "e": "Al notar que los estudiantes comentan el conflicto entre los dos docentes, usted", "f": "MEN (2008). Guía 31, Anexo 1: Glosario de competencias (Negociación y mediación).", "o": [["A", "pide a los directores de grupo que prohíban a los estudiantes hablar del tema durante las clases y en los descansos.", "Busca proteger a los docentes, pero una prohibición no forma ni aprovecha la situación pedagógicamente; además, suele aumentar los comentarios.", false], ["B", "pide a los docentes manejar el desacuerdo con profesionalismo y trabaja con los grupos el manejo pacífico de conflictos, sin exponer el caso.", "Corresponde a negociación y mediación, cuya conducta asociada incluye formar a los estudiantes en estrategias de resolución pacífica de conflictos (Guía 31); además, pedir profesionalismo a los docentes protege a los estudiantes del conflicto sin vulnerar la intimidad de los implicados.", true], ["C", "explica en los grupos de once lo que ocurrió entre los dos docentes, para evitar que sigan circulando rumores sobre el caso.", "Intenta frenar rumores, pero expone a los docentes ante los estudiantes y no respeta la confidencialidad del proceso de mediación.", false]]}]}, {"comp": "psicotecnica", "rol": "directivo", "tag": "Prueba psicotécnica · Competencias comportamentales (Guía 31, Decreto 1278 de 2002)", "texto": "Usted es rectora de una institución educativa de Cartagena. Una madre de familia llega sin cita a la rectoría, visiblemente alterada, y en voz alta reclama porque su hijo de séptimo perdió el período en tres áreas y, según ella, «nadie le avisó nada». Hay otros padres esperando en la recepción. Al revisar el sistema, usted encuentra que los informes se publicaron a tiempo en la plataforma virtual de la institución, pero la madre no tiene acceso a internet en su casa.", "items": [{"id": "DI-139", "niv": 1, "e": "Ante la llegada de la madre alterada, usted", "f": "MEN (2008). Guía 31, Anexo 1: Glosario de competencias (Comunicación y relaciones interpersonales).", "o": [["A", "la invita a pasar a su oficina, la escucha sin interrumpirla y le expresa que comprende su preocupación.", "Corresponde a comunicación y relaciones interpersonales: escuchar con atención, comprender los puntos de vista de los demás y manejar adecuadamente las emociones propias e identificar las de otros (Guía 31).", true], ["B", "le explica de inmediato que los informes se publicaron a tiempo en la plataforma, para aclarar el malentendido.", "La información es correcta, pero responder de entrada con argumentos, sin escuchar, suele aumentar la tensión y no reconoce la preocupación de la madre.", false], ["C", "le pide que solicite una cita formal en la secretaría, porque hay otros padres esperando su turno.", "Respeta el orden de atención, pero ignora el estado emocional de la madre y puede escalar el conflicto frente a otros padres.", false]]}, {"id": "DI-140", "niv": 2, "e": "Al explicarle la situación académica de su hijo, usted", "f": "MEN (2008). Guía 31, Anexo 1: Glosario de competencias (Comunicación y relaciones interpersonales).", "o": [["A", "le pide al director de grupo que la atienda, porque él conoce mejor el desempeño del estudiante.", "Involucrar al director de grupo puede ser útil, pero delegar la conversación en ese momento interrumpe el diálogo que ya inició con la madre.", false], ["B", "le entrega una copia impresa del boletín del período y le recomienda leer con atención el sistema institucional de evaluación.", "Entrega la información, pero no verifica que la madre la comprenda ni construye con ella un plan de acompañamiento.", false], ["C", "le muestra los resultados por área con un lenguaje sencillo y le pregunta qué necesita para acompañar al estudiante.", "Corresponde a comunicación y relaciones interpersonales: intercambiar ideas con efectividad y empatía, según las características del interlocutor, y formular preguntas claras y concretas (Guía 31).", true]]}, {"id": "DI-141", "niv": 3, "e": "Al descubrir que varias familias no tienen acceso a la plataforma, usted", "f": "MEN (2008). Guía 31, Anexo 1: Glosario de competencias (Comunicación y relaciones interpersonales).", "o": [["A", "promueve ajustar el SIEE, con los consejos académico y directivo, para entregar informes impresos a familias sin conectividad.", "Corresponde a comunicación y relaciones interpersonales, que implica comunicarse a través de diferentes estrategias y recursos según las características del contexto y de los participantes (Guía 31). La solución es institucional y sigue el cauce legal: la periodicidad y la forma de entrega de los informes hacen parte del SIEE, cuyos ajustes aprueba el consejo directivo (Decreto 1290 de 2009, arts. 4 y 8).", true], ["B", "recuerda en la siguiente circular que las familias deben consultar la plataforma en los plazos establecidos.", "Reafirma una norma, pero no atiende la barrera real de conectividad: el mensaje no llega a quienes más lo necesitan.", false], ["C", "le pide a la madre que se acerque a la institución cada período para recibir el informe en físico.", "Resuelve el caso de una familia, pero no el de las demás familias sin conectividad; es una solución individual a un problema institucional.", false]]}, {"id": "DI-142", "niv": 2, "e": "Ese mismo día, una madre que es amiga suya desde hace años le pide cambiar de grupo a su hija sin seguir el procedimiento institucional. Usted", "f": "MEN (2008). Guía 31, Anexo 1: Glosario de competencias (Compromiso social e institucional).", "o": [["A", "accede al cambio por esta única vez, ya que el grupo de destino tiene cupo disponible y la solicitud de la madre parece razonable.", "La solicitud puede ser razonable, pero tramitarla por fuera del procedimiento por amistad antepone un interés personal al institucional y afecta la equidad con las demás familias.", false], ["B", "remite la solicitud a la coordinadora sin explicarle el procedimiento, para no involucrarse por la amistad.", "Evita un conflicto de interés, pero traslada el caso sin orientar a la madre ni dejar claro que debe seguirse el procedimiento, de modo que no asume su responsabilidad con transparencia.", false], ["C", "le explica con amabilidad el procedimiento y le ofrece orientación para presentar la solicitud por el canal establecido.", "Corresponde al compromiso social e institucional: asumir responsabilidades con ética, anteponiendo los intereses institucionales a los personales, acatar las normas institucionales y demostrar honestidad e integridad (Guía 31).", true]]}]}, {"comp": "psicotecnica", "rol": "directivo", "tag": "Prueba psicotécnica · Competencias comportamentales (Guía 31, Decreto 1278 de 2002)", "texto": "Usted es director rural de un centro educativo con cinco sedes multigrado en una zona rural dispersa del Meta. Varias familias son víctimas del conflicto armado y algunos estudiantes caminan más de una hora para llegar a la escuela. En temporada de lluvias la asistencia cae notablemente. La secretaría de educación convocó a los directivos a una jornada de formación sobre el sistema de matrícula el mismo día en que usted tenía programada una visita de acompañamiento a la sede más alejada.", "items": [{"id": "DI-154", "niv": 2, "e": "Frente al cruce entre la jornada de formación y la visita a la sede, usted", "f": "MEN (2008). Guía 31, Anexo 1: Glosario de competencias (Compromiso social e institucional).", "o": [["A", "cancela la visita sin fecha nueva, pues la formación es obligatoria y la sede podrá visitarse más adelante.", "Atiende la convocatoria, pero deja sin acompañamiento a la sede más alejada y no responde con oportunidad a esa responsabilidad.", false], ["B", "asiste a la formación y reprograma la visita para la semana siguiente, avisando con anticipación a la docente de la sede.", "Corresponde al compromiso social e institucional: acatar las políticas del sector, responder con oportunidad a las tareas asignadas y cumplir la responsabilidad con la sede reprogramando el acompañamiento (Guía 31).", true], ["C", "envía a la formación a la docente de la sede principal para no cancelar la visita, aunque ella no maneja la matrícula.", "Busca cumplir ambas tareas, pero delega en alguien que no tiene esa responsabilidad una formación dirigida a los directivos, por lo que la institución no recibe la información donde se necesita.", false]]}, {"id": "DI-155", "niv": 1, "e": "Frente a la baja asistencia en temporada de lluvias, usted", "f": "MEN (2008). Guía 31, Anexo 1: Glosario de competencias (Orientación al logro).", "o": [["A", "solicita a la secretaría apoyo de transporte para la temporada de lluvias y espera su respuesta antes de ajustar el trabajo pedagógico.", "Gestionar transporte es pertinente, pero condicionar el ajuste pedagógico a una respuesta externa aplaza la atención a los aprendizajes de los estudiantes afectados.", false], ["B", "analiza con los docentes la asistencia por sede y diseña con las familias estrategias de trabajo en casa y de recuperación.", "Corresponde a la orientación al logro: dirigir el comportamiento hacia estándares elevados, mostrar persistencia frente a los obstáculos y procurar resultados de excelencia para los estudiantes (Guía 31).", true], ["C", "pide a los docentes que avancen con los estudiantes que sí asisten, para no atrasar el desarrollo del plan de estudios previsto para el año.", "Prioriza cumplir el plan de estudios, pero deja atrás a quienes no pueden asistir y aumenta las brechas de aprendizaje.", false]]}, {"id": "DI-156", "niv": 3, "e": "Para reducir las dificultades de desplazamiento de los estudiantes, usted", "f": "MEN (2008). Guía 31, Anexo 1: Glosario de competencias (Iniciativa).", "o": [["A", "gestiona con la junta de acción comunal y la alcaldía alternativas de transporte, con datos de distancias y asistencia.", "Corresponde a la iniciativa: trabajar proactivamente, demostrar recursividad, anticipar situaciones y emprender soluciones a los problemas de la institución (Guía 31).", true], ["B", "recomienda a las familias matricular a sus hijos en la sede más cercana, aunque no ofrezca el grado que requieren.", "Intenta reducir la distancia, pero afecta la trayectoria escolar de los estudiantes al ubicarlos en un grado que no les corresponde.", false], ["C", "espera a que la secretaría de educación incluya el transporte escolar en su planeación, ya que es de su competencia.", "Puede ser cierto que la solución dependa de otras entidades, pero esperar sin gestionar alternativas ni aportar información no evidencia iniciativa.", false]]}, {"id": "DI-157", "niv": 2, "e": "Una docente le comenta que un estudiante víctima del conflicto se aísla y llora con frecuencia en clase. Usted", "f": "MEN (2008). Guía 31, Anexo 1: Glosario de competencias (Compromiso social e institucional).", "o": [["A", "convoca una reunión con todo el grupo para que los compañeros cuenten sus propias experiencias del conflicto.", "Puede tener intención pedagógica, pero expone al estudiante y a sus compañeros sin preparación ni apoyo profesional.", false], ["B", "solicita a la secretaría que envíe un profesional psicosocial y pide a la docente no intervenir hasta recibir su concepto.", "Buscar apoyo profesional es útil, pero mientras tanto deja al estudiante sin acompañamiento de la docente y no involucra a la familia.", false], ["C", "acuerda con la docente una conversación cuidadosa con la familia y, si se requiere, activa la ruta con las entidades competentes.", "Corresponde al compromiso social e institucional: asumir con ética la responsabilidad de proteger al estudiante, mostrar respeto hacia él y su familia y reflexionar sobre la responsabilidad social del educador (Guía 31).", true]]}]}, {"comp": "psicotecnica", "rol": "directivo", "tag": "Prueba psicotécnica · Competencias comportamentales (Guía 31, Decreto 1278 de 2002)", "texto": "Usted es coordinadora académica de una institución educativa de Rionegro (Antioquia) con media técnica en desarrollo de software. Los docentes de la especialidad trabajan aislados del resto: los de matemáticas y lenguaje se quejan de que nunca los consultan, y los de la técnica sienten que las demás áreas «no entienden lo que hacemos». Una empresa de la región ofreció apoyo para los proyectos de grado de los estudiantes de once.", "items": [{"id": "DI-158", "niv": 1, "e": "Para mejorar la relación entre los docentes de la especialidad y los de las demás áreas, usted", "f": "MEN (2008). Guía 31, Anexo 1: Glosario de competencias (Trabajo en equipo).", "o": [["A", "pide a cada área entregar por escrito sus contenidos para que usted elabore un documento de articulación.", "Produce un documento, pero la articulación queda en manos de la coordinadora y no genera colaboración real entre los docentes.", false], ["B", "conforma equipos mixtos que planeen juntos un proyecto integrador para once, con metas y responsabilidades compartidas.", "Corresponde al trabajo en equipo: trabajar cooperativamente y construir relaciones de colaboración para el logro de objetivos compartidos, propiciando la conformación de equipos (Guía 31).", true], ["C", "programa reuniones separadas con cada grupo de docentes, para escuchar sus quejas sin generar confrontaciones.", "Escuchar es útil, pero mantener a los grupos separados refuerza el aislamiento que se busca superar.", false]]}, {"id": "DI-159", "niv": 2, "e": "Frente al ofrecimiento de la empresa, usted", "f": "MEN (2008). Guía 31, Anexo 1: Glosario de competencias (Iniciativa).", "o": [["A", "presenta una propuesta de alianza con objetivos pedagógicos claros y la lleva a las instancias de la institución.", "Corresponde a la iniciativa: proponer y desarrollar proyectos novedosos y trabajar proactivamente, articulando la oportunidad con las instancias institucionales (Guía 31).", true], ["B", "autoriza a los docentes de la técnica para que acuerden directamente con la empresa los proyectos de cada estudiante.", "Delega con buena intención, pero deja la alianza sin orientación pedagógica institucional y profundiza el aislamiento de la especialidad.", false], ["C", "agradece el ofrecimiento y lo deja para el próximo año, cuando el plan de estudios de la media técnica esté ajustado.", "Parece prudente, pero desaprovecha una oportunidad presente; la iniciativa implica anticipar y emprender alternativas sin esperar condiciones ideales.", false]]}, {"id": "DI-160", "niv": 3, "e": "En una reunión, un docente de lenguaje le dice que la coordinación ha favorecido a la media técnica en la asignación de recursos. Usted", "f": "MEN (2008). Guía 31, Anexo 1: Glosario de competencias (Trabajo en equipo).", "o": [["A", "le agradece el comentario y le propone tratarlo más adelante, cuando haya un espacio específico para ese tema.", "Es cortés, pero aplaza sin compromiso concreto una crítica que podría mejorar la gestión; no actúa en consecuencia.", false], ["B", "le explica que la media técnica requiere más recursos por su propia naturaleza y, con esa explicación, da por resuelta la inquietud del docente.", "La explicación puede ser cierta, pero responde a la crítica con una justificación y no la examina; no considera la contribución del docente.", false], ["C", "le pide ejemplos concretos, revisa con el equipo los criterios de asignación y ajusta lo que resulte inequitativo.", "Corresponde al trabajo en equipo: aceptar críticas constructivas y actuar en consecuencia, y considerar las contribuciones de los demás en la toma de decisiones (Guía 31).", true]]}]}];
const CFG = {"titulo": "Simulacro para directivos docentes · Concurso Docente 2026–2027", "modo": "simulacro", "minutos": 180, "componentes": {"lectura_critica": "Lectura crítica", "razonamiento_cuantitativo": "Razonamiento cuantitativo", "competencias_blandas": "Competencias blandas y ciudadanas", "pedagogia_normativa": "Competencias pedagógicas y normativa", "psicotecnica": "Prueba psicotécnica"}, "niveles": {"1": "Básico", "2": "Intermedio", "3": "Avanzado"}, "clave": "simulacro-directivos.html"};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY = 'sim-docente:' + CFG.clave;
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}
function save(){try{localStorage.setItem(KEY, JSON.stringify(ST))}catch(e){}}
let ST = load();
ST.r = ST.r || {};
$('#tit').textContent = CFG.titulo;
const ITEMS = [];
DATA.forEach(c => c.items.forEach(it => { it.caso = c; ITEMS.push(it); }));

function justHTML(it){
  return '<div class="just">' + it.o.map(o => `<div><b>${o[0]}.</b> <span class="${o[3]?'okt':'not'}">${o[3]?'Es correcta.':'Es incorrecta.'}</span> ${esc(o[2])}</div>`).join('') +
    `<div class="src">Referencia: ${esc(it.f)}</div></div>`;
}
function itemHTML(it, n, mode){
  const r = ST.r[it.id];
  const reveal = mode === 'review' || (CFG.modo === 'practica' && r);
  let h = `<div class="item" id="i-${it.id}"><p class="enun"><span class="n">${n}.</span> <span class="niv">${CFG.niveles[it.niv]}</span> ${esc(it.e)}</p>`;
  it.o.forEach(o => {
    let cls = '';
    if (reveal) { if (o[3]) cls = 'ok'; else if (r === o[0]) cls = 'no'; }
    else if (r === o[0]) cls = 'sel';
    h += `<button class="op ${cls}" data-id="${it.id}" data-l="${o[0]}" ${reveal?'disabled':''}><span class="l">${o[0]}.</span><span>${esc(o[1])}</span></button>`;
  });
  if (reveal) {
    if (mode === 'review') h += `<div class="${r===keyOf(it)?'res-ok':'res-no'}" style="font-size:14px;margin-top:4px">${r ? (r===keyOf(it)?'Respondiste ' + r + ': correcto.':'Respondiste ' + r + '. La respuesta correcta es ' + keyOf(it) + '.') : 'Sin responder. La respuesta correcta es ' + keyOf(it) + '.'}</div>`;
    h += justHTML(it);
  }
  return h + '</div>';
}
const keyOf = it => it.o.find(o => o[3])[0];

function renderList(list, mode){
  let h = '', last = null, n = 0;
  list.forEach(it => {
    n++;
    if (it.caso !== last) { last = it.caso; h += `<div class="caso"><div class="tag">${esc(it.caso.tag)}</div><p>${esc(it.caso.texto)}</p></div>`; }
    h += itemHTML(it, n, mode);
  });
  return h;
}

// ---------- PRÁCTICA ----------
let LIST = [];
let FILTRO = ST.f || {comp:'', niv:'', rol:''};
function practica(){
  const comps = Object.entries(CFG.componentes).map(([k,v]) => `<option value="${k}" ${FILTRO.comp===k?'selected':''}>${esc(v)}</option>`).join('');
  const nivs = Object.entries(CFG.niveles).map(([k,v]) => `<option value="${k}" ${FILTRO.niv===k?'selected':''}>${esc(v)}</option>`).join('');
  const list = ITEMS.filter(it => (!FILTRO.comp || it.caso.comp===FILTRO.comp) && (!FILTRO.niv || String(it.niv)===FILTRO.niv) && (!FILTRO.rol || it.caso.rol===FILTRO.rol));
  const resp = list.filter(it => ST.r[it.id]); const ok = resp.filter(it => ST.r[it.id]===keyOf(it));
  $('#main').innerHTML = `<div class="panel"><p style="margin-top:0">Elige un tema y un nivel. Al responder verás de inmediato si acertaste y la explicación de cada opción.</p>
  <div class="row"><select id="fc"><option value="">Todos los temas</option>${comps}</select>
  <select id="fn"><option value="">Todos los niveles</option>${nivs}</select>
  <select id="fr"><option value="">Docentes y directivos</option><option value="docente" ${FILTRO.rol==='docente'?'selected':''}>Solo docentes</option><option value="directivo" ${FILTRO.rol==='directivo'?'selected':''}>Solo directivos</option></select>
  <button class="btn sec" id="borrar">Borrar mis respuestas</button></div>
  <p class="stat" id="pst" style="margin-bottom:0">${list.length} preguntas · respondidas ${resp.length} · aciertos ${ok.length}${resp.length? ' (' + Math.round(100*ok.length/resp.length) + ' %)':''}</p></div>` + renderList(list, 'practica');
  $('#prog').textContent = `${ok.length}/${resp.length} aciertos`;
  ['fc','fn','fr'].forEach((id,i) => $('#'+id).onchange = e => { FILTRO[['comp','niv','rol'][i]] = e.target.value; ST.f = FILTRO; save(); practica(); });
  LIST = list;
  $('#borrar').onclick = () => { list.forEach(it => delete ST.r[it.id]); save(); practica(); };
}

// ---------- SIMULACRO ----------
let tick = null;
function inicio(){
  const n = ITEMS.length, cnt = {};
  ITEMS.forEach(it => cnt[it.caso.comp] = (cnt[it.caso.comp]||0) + 1);
  const h = Math.floor(CFG.minutos/60), m = CFG.minutos%60;
  $('#main').innerHTML = `<div class="panel"><h2 style="margin-top:0;color:var(--pri)">Instrucciones</h2>
  <p>Este simulacro tiene <b>${n} preguntas</b> en el formato de Prueba de Juicio Situacional: un caso, enunciados que se completan y tres opciones con una sola respuesta correcta.</p>
  <table>${Object.entries(cnt).map(([k,v]) => `<tr><td>${esc(CFG.componentes[k])}</td><td class="r">${v}</td></tr>`).join('')}</table>
  <p>Tiempo sugerido: <b>${h ? h + ' h ' : ''}${m ? m + ' min' : ''}</b> (unos ${Math.round(CFG.minutos*60/n/6)/10} minutos por pregunta). Cuando se acaba el tiempo puedes seguir, pero el cronómetro lo indica.</p>
  <p>Tus respuestas se guardan en este navegador. Al terminar verás tu puntaje por componente y por nivel, y la explicación de cada pregunta.</p>
  <button class="btn" id="go">${ST.t0 ? 'Continuar el simulacro' : 'Comenzar'}</button></div>`;
  $('#prog').textContent = `${n} preguntas`;
  $('#go').onclick = () => { if (!ST.t0) { ST.t0 = Date.now(); save(); } examen(); };
}
function reloj(){
  const rest = CFG.minutos*60 - Math.floor((Date.now() - ST.t0)/1000);
  const a = Math.abs(rest), hh = Math.floor(a/3600), mm = Math.floor(a%3600/60), ss = a%60;
  const t = (rest < 0 ? '+' : '') + (hh ? hh + ':' : '') + String(mm).padStart(2,'0') + ':' + String(ss).padStart(2,'0');
  $('#timer').textContent = rest < 0 ? 'Tiempo cumplido ' + t : '⏱ ' + t;
  $('#timer').classList.toggle('low', rest < 600);
}
function examen(){
  $('#main').innerHTML = renderList(ITEMS, 'examen') + `<div class="panel"><button class="btn" id="fin">Terminar y calificar</button></div>`;
  progreso(); reloj(); clearInterval(tick); tick = setInterval(reloj, 1000);
  $('#fin').onclick = () => {
    const faltan = ITEMS.length - Object.keys(ST.r).filter(k => ITEMS.some(i => i.id===k)).length;
    $('#mtxt').textContent = faltan ? `Te faltan ${faltan} preguntas por responder. ¿Quieres calificar de todos modos?` : '¿Quieres terminar y ver tu calificación?';
    $('#modal').classList.remove('hide');
  };
}
function progreso(){
  const r = ITEMS.filter(it => ST.r[it.id]).length;
  $('#prog').textContent = `Respondidas ${r}/${ITEMS.length}`;
}
$('#mno').onclick = () => $('#modal').classList.add('hide');
$('#msi').onclick = () => { $('#modal').classList.add('hide'); ST.fin = Date.now(); save(); resultados(); };
function resultados(){
  clearInterval(tick);
  const ok = ITEMS.filter(it => ST.r[it.id] === keyOf(it)).length;
  const pct = Math.round(1000*ok/ITEMS.length)/10;
  const g = (fn, lab) => { const m = {}; ITEMS.forEach(it => { const k = fn(it); m[k] = m[k] || [0,0]; m[k][1]++; if (ST.r[it.id]===keyOf(it)) m[k][0]++; });
    return Object.entries(m).map(([k,v]) => `<tr><td>${esc(lab(k))}</td><td class="r">${v[0]}/${v[1]}</td><td class="r">${Math.round(100*v[0]/v[1])} %</td></tr>`).join(''); };
  const mins = Math.round(((ST.fin||Date.now()) - ST.t0)/60000);
  $('#timer').textContent = `Tiempo usado: ${Math.floor(mins/60) ? Math.floor(mins/60) + ' h ' : ''}${mins%60} min`;
  $('#prog').textContent = `${ok}/${ITEMS.length} aciertos`;
  $('#main').innerHTML = `<div class="panel"><div class="big">${String(pct).replace('.',',')} %</div>
  <p style="margin-top:4px">${ok} de ${ITEMS.length} respuestas correctas. ${pct >= 70 ? 'Muy buen resultado: repasa las explicaciones de tus errores para afianzarlo.' : pct >= 60 ? 'Vas bien, pero con poco margen: refuerza los componentes con menor porcentaje.' : 'Todavía no estás en zona segura: practica por tema los componentes con menor porcentaje.'}</p>
  <p class="aviso">Referencia: en el concurso el mínimo aprobatorio de la prueba eliminatoria es 60 puntos (70 para directivos). Este porcentaje de aciertos es una guía de preparación; la CNSC calcula su puntaje con su propia escala.</p>
  <h3>Por componente</h3><table>${g(it => it.caso.comp, k => CFG.componentes[k])}</table>
  <h3>Por nivel</h3><table>${g(it => it.niv, k => CFG.niveles[k])}</table>
  <div class="row" style="margin-top:14px"><button class="btn" id="solo">Ver solo mis errores</button><button class="btn sec" id="todas">Ver todas</button><button class="btn sec" id="otra">Reiniciar el simulacro</button></div></div><div id="rev"></div>`;
  const rev = errs => { const l = errs ? ITEMS.filter(it => ST.r[it.id] !== keyOf(it)) : ITEMS; $('#rev').innerHTML = renderList(l, 'review'); };
  rev(true);
  $('#solo').onclick = () => rev(true); $('#todas').onclick = () => rev(false);
  $('#otra').onclick = () => { ST = {r:{}}; save(); inicio(); window.scrollTo(0,0); };
}

document.addEventListener('click', e => {
  const b = e.target.closest('button.op'); if (!b || b.disabled) return;
  ST.r[b.dataset.id] = b.dataset.l; save();
  const it = ITEMS.find(i => i.id === b.dataset.id);
  const n = b.closest('.item').querySelector('.n').textContent.replace('.','');
  b.closest('.item').outerHTML = itemHTML(it, n, CFG.modo === 'practica' ? 'practica' : 'examen');
  if (CFG.modo === 'practica') { const resp = LIST.filter(i => ST.r[i.id]); const ok = resp.filter(i => ST.r[i.id]===keyOf(i)).length; $('#prog').textContent = `${ok}/${resp.length} aciertos`; $('#pst').textContent = `${LIST.length} preguntas · respondidas ${resp.length} · aciertos ${ok} (${Math.round(100*ok/resp.length)} %)`; }
  else progreso();
});

if (CFG.modo === 'practica') practica();
else if (ST.fin) resultados();
else if (ST.t0) examen();
else inicio();
</script>
</body>
</html>
