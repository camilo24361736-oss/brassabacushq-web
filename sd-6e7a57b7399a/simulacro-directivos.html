<title>Simulacro para directivos docentes · Concurso Docente 2026–2027</title>
<style>
:root{--bg:#f6f8fb;--card:#fff;--ink:#1d2433;--mute:#5a6478;--line:#dbe1ea;--pri:#0b3d6e;--pri2:#1660a8;--ok:#0d6b3a;--okbg:#e6f4ec;--no:#9b1c1c;--nobg:#fbeaea;--sel:#e8f0fa}
@media (prefers-color-scheme: dark){:root{--bg:#10151d;--card:#18202b;--ink:#e6ebf2;--mute:#9aa6b8;--line:#2a3545;--pri:#7fb3ea;--pri2:#9cc6f2;--ok:#7fd3a3;--okbg:#16301f;--no:#f2a3a3;--nobg:#3a1c1c;--sel:#1e2d40}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px}
.hwrap{max-width:860px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
h1{font-size:17px;margin:0;color:var(--pri)}
.stat{font-size:14px;color:var(--mute)}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--pri)}
.timer.low{color:var(--no)}
main{max-width:860px;margin:0 auto;padding:16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin:0 0 16px}
.caso{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--pri);border-radius:10px;padding:14px 16px;margin:22px 0 10px}
.tag{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--pri);font-weight:700}
.caso p{margin:6px 0 0;white-space:pre-line}
.item{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0}
.enun{margin:0 0 8px}
.n{font-weight:700;color:var(--pri)}
.niv{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-right:4px;white-space:nowrap}
.op{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:6px 0;cursor:pointer;background:transparent;width:100%;text-align:left;color:inherit;font:inherit}
.op:hover{border-color:var(--pri2)}
.op .l{font-weight:700;min-width:20px}
.op.sel{background:var(--sel);border-color:var(--pri2)}
.op.ok{background:var(--okbg);border-color:var(--ok)}
.op.no{background:var(--nobg);border-color:var(--no)}
.op[disabled]{cursor:default}
.just{font-size:14px;margin:8px 0 0;padding:8px 10px;border-top:1px dashed var(--line)}
.just div{margin:4px 0}
.just .okt{color:var(--ok);font-weight:700}
.just .not{color:var(--no);font-weight:700}
.src{font-size:13px;color:var(--mute);margin-top:6px}
button.btn{background:var(--pri);color:var(--card);border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer}
button.btn.sec{background:transparent;color:var(--pri);border:1px solid var(--pri)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
select{font:inherit;padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);max-width:100%}
table{border-collapse:collapse;width:100%;font-size:15px}
td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
.big{font-size:40px;font-weight:800;color:var(--pri);line-height:1.1}
.aviso{font-size:13px;color:var(--mute)}
.hide{display:none !important}
.res-ok{color:var(--ok);font-weight:700}.res-no{color:var(--no);font-weight:700}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal .panel{max-width:420px}
footer{max-width:860px;margin:0 auto;padding:8px 16px 40px;font-size:12px;color:var(--mute)}
</style>
</head>

<header><div class="hwrap"><h1 id="tit"></h1><div class="row stat"><span id="prog"></span><span id="timer" class="timer"></span></div></div></header>
<main id="main"></main>
<div id="modal" class="modal hide"><div class="panel"><p id="mtxt"></p><div class="row"><button class="btn" id="msi">Sí, calificar</button><button class="btn sec" id="mno">Seguir respondiendo</button></div></div></div>
<footer><a href="./" style="color:var(--pri);font-weight:600">← Volver al menú</a><br><br>Material de preparación independiente. No está afiliado a la Comisión Nacional del Servicio Civil (CNSC) ni al Ministerio de Educación Nacional, y no contiene preguntas reales de la prueba.</footer>
<script>
const DATA = [{"comp": "lectura_critica", "rol": "directivo", "tag": "Lectura crítica", "texto": "Lea la siguiente carta que una madre de familia envió al rector de una institución educativa oficial:\n\n«Señor rector:\nLe escribo con respeto, pero con preocupación. La lista de útiles de grado tercero incluye doce cuadernos, un diccionario de una marca específica, plastilina, témperas y un libro de inglés que cuesta casi lo mismo que el mercado de una semana. Entiendo que los docentes necesitan materiales para trabajar, y no pongo en duda su buena intención.\nSin embargo, me pregunto si todo lo que se pide se usa. El año pasado, mi hijo terminó el año con seis cuadernos casi en blanco, y el libro de inglés se usó, según él, \"unas cinco veces\". Si eso le pasó a él, seguramente les pasa a muchos.\nLe propongo que la lista se revise con el consejo de padres y que se indique para qué se usará cada material. No pido que se eliminen los útiles, sino que se pidan solo los necesarios.\nAtentamente,\nLuz Dary, madre de familia de grado tercero»", "items": [{"id": "LC-128", "niv": 1, "e": "Como rector, usted identifica que la intención principal de la carta es", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: comprender el sentido global del texto (tesis e intención comunicativa).", "o": [["A", "solicitar que se eliminen de la lista el libro de inglés y el diccionario de marca específica.", "La carta dice expresamente «No pido que se eliminen los útiles», sino que se pidan los necesarios.", false], ["B", "pedir que la lista de útiles se revise y que se explique el uso de cada material.", "La madre lo formula en su propuesta: revisar la lista con el consejo de padres e indicar para qué se usará cada material. Identificar la intención comunicativa es comprender el sentido global del texto.", true], ["C", "denunciar a los docentes por pedir materiales que saben que no van a necesitar durante el año.", "La madre aclara que no pone en duda la buena intención de los docentes; su tono no es de denuncia.", false]]}, {"id": "LC-129", "niv": 1, "e": "La comparación del precio del libro con «el mercado de una semana» busca", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: identificar y entender los contenidos locales (sentido de palabras y expresiones en contexto).", "o": [["A", "informar al rector el precio exacto que tiene el libro de inglés en el comercio.", "La comparación no da un precio exacto; es una manera de expresar cuánto pesa ese gasto.", false], ["B", "comparar la calidad del libro de inglés con la de los demás útiles de la lista.", "La expresión se refiere al costo, no a la calidad del material.", false], ["C", "hacer evidente el peso económico que tiene el libro para una familia.", "Al equiparar el libro con la comida de una semana, la madre traduce el costo a una experiencia cotidiana y muestra el esfuerzo que representa. Interpretar el sentido de una expresión en su contexto es comprensión local.", true]]}, {"id": "LC-130", "niv": 2, "e": "La frase «y no pongo en duda su buena intención» cumple en la carta la función de", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: comprender cómo se articulan las partes de un texto para darle un sentido global.", "o": [["A", "anticiparse a que su petición se lea como un ataque contra el trabajo de los docentes.", "Antes de plantear su crítica, la madre reconoce la buena intención de los docentes para que su carta no se interprete como una acusación. Es un recurso para preparar al lector y facilitar que acepte la propuesta.", true], ["B", "reconocer que la lista de útiles es adecuada y no necesita cambios.", "La madre sí propone cambios: revisar la lista y explicar el uso de cada material.", false], ["C", "presentar la conclusión principal a la que llega la madre en su carta.", "La conclusión es la propuesta del último párrafo; esta frase aparece al inicio, como una aclaración.", false]]}, {"id": "LC-131", "niv": 2, "e": "La afirmación «Si eso le pasó a él, seguramente les pasa a muchos» debilita el argumento de la carta porque", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: reflexionar a partir de un texto y evaluar su contenido (validez de argumentos y solidez de las evidencias).", "o": [["A", "generaliza a partir de la experiencia de un solo estudiante.", "La madre pasa del caso de su hijo a «muchos» sin otra evidencia. Es una generalización apresurada; reconocerla es evaluar la solidez de un argumento.", true], ["B", "pone en duda la buena intención con la que los docentes elaboraron la lista de útiles.", "La madre aclara en el primer párrafo que no pone en duda esa intención; la frase no se refiere a los docentes.", false], ["C", "contradice la propuesta de revisar la lista de útiles con el consejo de padres.", "No hay contradicción: la generalización se usa, justamente, para apoyar la propuesta de revisión.", false]]}, {"id": "LC-132", "niv": 3, "e": "Un directivo responde a la madre que la lista la elaboraron los docentes y que ellos saben qué necesitan. Frente a la carta, esta respuesta", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: reflexionar a partir de un texto y evaluar su contenido (validez de argumentos y solidez de las evidencias).", "o": [["A", "responde a la propuesta, porque acepta revisar la lista de útiles junto con el consejo de padres.", "La respuesta no menciona al consejo de padres ni acepta revisar la lista.", false], ["B", "refuta la carta, porque demuestra que todos los materiales incluidos en la lista son necesarios.", "La respuesta no aporta ninguna prueba sobre el uso de los materiales; solo apela a la autoridad de los docentes.", false], ["C", "no atiende el punto central, que no es quién elabora la lista sino si se usa lo que se pide.", "La madre no discute la competencia de los docentes, sino el uso real de los materiales. Responder con la autoridad de quien elaboró la lista deja sin respuesta la pregunta planteada. Detectar que una réplica no responde al argumento es una tarea de evaluación crítica.", true]]}]}, {"comp": "lectura_critica", "rol": "directivo", "tag": "Lectura crítica", "texto": "Lea la siguiente descripción de una infografía presentada por la secretaría de educación de un municipio, con datos de un año escolar:\n\n«¿POR QUÉ DEJAN EL COLEGIO?\nEncuesta a 250 familias de estudiantes que abandonaron la escuela. Principal causa señalada por cada familia:\n• Necesidad de trabajar o de ayudar en la casa: 38 %.\n• Cambio de domicilio sin traslado a otro colegio: 21 %.\n• Distancia al colegio o falta de transporte: 17 %.\n• Desinterés o bajo rendimiento: 15 %.\n• Embarazo adolescente: 6 %.\n• Otras: 3 %.\nMensaje final: \"Más de la mitad de los casos tiene causas económicas (necesidad de trabajar o de ayudar en la casa) o de acceso al colegio (distancia o falta de transporte). La escuela sola no puede resolverlos.\"»", "items": [{"id": "LC-137", "niv": 1, "e": "Según la infografía, la causa de abandono que las familias señalaron con mayor frecuencia fue", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: identificar y entender los contenidos locales en textos discontinuos (tablas, gráficas e infografías).", "o": [["A", "el desinterés de los estudiantes o el bajo rendimiento (15 %).", "Fue señalado por el 15 % de las familias; no es la causa más frecuente.", false], ["B", "la necesidad de trabajar o de ayudar en la casa (38 %).", "Con el 38 %, es el porcentaje más alto de la infografía. Localizar el valor máximo es comprensión de información explícita en un texto discontinuo.", true], ["C", "la distancia al colegio o la falta de transporte (17 %).", "Fue señalada por el 17 % de las familias, por debajo de la necesidad de trabajar (38 %) y del cambio de domicilio (21 %).", false]]}, {"id": "LC-138", "niv": 2, "e": "La afirmación «Más de la mitad de los casos tiene causas económicas o de acceso al colegio» se sustenta en", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: identificar y entender los contenidos locales en textos discontinuos (tablas, gráficas e infografías).", "o": [["A", "la suma de todas las causas, excepto la categoría «otras» de la infografía (97 %).", "Esa suma incluye causas que no son económicas ni de acceso, como el embarazo adolescente o el desinterés.", false], ["B", "la suma de la necesidad de trabajar y la distancia o falta de transporte (55 %).", "La causa económica (38 %) más la de acceso (17 %) suman 55 %, es decir, más de la mitad. Relacionar datos para verificar una afirmación es interpretar críticamente un texto discontinuo.", true], ["C", "el porcentaje de familias que señaló la necesidad de trabajar o de ayudar en la casa (38 %).", "Por sí solo, el 38 % no supera la mitad de los casos; falta sumar la causa de acceso (distancia o transporte).", false]]}, {"id": "LC-139", "niv": 2, "e": "En una reunión de docentes, un colega concluye a partir de la infografía que el desinterés de los estudiantes no debe preocupar a los colegios. Esta lectura es", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: reflexionar a partir de un texto y evaluar su contenido.", "o": [["A", "adecuada, porque el desinterés aparece por debajo de las causas económicas y de acceso al colegio.", "Que una causa sea menos frecuente no significa que no deba atenderse; la conclusión exagera lo que dicen los datos.", false], ["B", "inadecuada, porque el desinterés es la causa de abandono más frecuente en la encuesta.", "Aunque el veredicto es correcto, la razón es falsa: el desinterés (15 %) está por debajo de la necesidad de trabajar (38 %), del cambio de domicilio (21 %) y de la distancia o falta de transporte (17 %).", false], ["C", "inadecuada, porque el 15 % de los casos es una proporción relevante sobre la que la escuela puede actuar.", "Que el desinterés no sea la causa principal no lo vuelve irrelevante: casi uno de cada siete casos se asocia a él, y es un factor en el que la escuela tiene un papel directo. Evaluar las conclusiones que se extraen de un texto es parte de la lectura crítica.", true]]}, {"id": "LC-140", "niv": 3, "e": "La conclusión «La escuela sola no puede resolverlos» sería más sólida si la secretaría", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: reflexionar a partir de un texto y evaluar su contenido (validez de argumentos y solidez de las evidencias).", "o": [["A", "mostrara que esas causas persisten aun en colegios que ofrecen transporte, alimentación o flexibilidad horaria.", "Si el abandono por causas económicas o de acceso se mantiene incluso cuando la escuela hace lo que está a su alcance, la conclusión de que necesita apoyo de otros sectores gana sustento. Identificar qué evidencia fortalece una conclusión es evaluar su solidez.", true], ["B", "incluyera el desinterés y el bajo rendimiento dentro del grupo de causas económicas.", "Reclasificar los datos de esa manera los distorsionaría; no fortalece la conclusión, la vuelve menos confiable.", false], ["C", "explicara por qué el embarazo adolescente aparece con un porcentaje tan bajo en la encuesta.", "Ese dato no se relaciona con la capacidad de la escuela para resolver las causas económicas o de acceso.", false]]}]}, {"comp": "lectura_critica", "rol": "directivo", "tag": "Lectura crítica", "texto": "Lea el siguiente fragmento del informe que el comité de alimentación escolar de una institución presentó al consejo directivo:\n\n«Durante el primer semestre, el complemento alimentario de media mañana se entregó a 420 estudiantes de primaria. Las docentes reportaron que, en los días en que el complemento llegó tarde o no llegó (11 de los 95 días de clase), aumentaron las quejas por dolor de cabeza y las solicitudes para salir del aula.\n\nEl comité recomienda dos medidas: acordar con el operador una hora límite de entrega y ubicar el comedor en un espacio techado, pues en días de lluvia los niños comen de pie en el pasillo.\n\nAlgunos docentes propusieron, además, retirar el complemento a los estudiantes que lo desperdicien. El comité no acoge esta propuesta, por considerar que el alimento es un derecho y no un premio por buen comportamiento.»", "items": [{"id": "LC-175", "niv": 1, "e": "Según el informe, el complemento alimentario llegó tarde o no llegó", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: identificar y entender los contenidos locales que conforman un texto.", "o": [["A", "en la mayoría de los días de clase del semestre.", "Fueron 11 de 95 días, es decir, una minoría de los días de clase.", false], ["B", "en los días de lluvia del primer semestre.", "La lluvia se menciona en relación con el lugar donde comen los niños, no con los retrasos en la entrega.", false], ["C", "en 11 de los 95 días de clase del semestre.", "El informe lo indica entre paréntesis: «11 de los 95 días de clase».", true]]}, {"id": "LC-176", "niv": 1, "e": "Según el informe, el comité no acoge la propuesta de retirar el complemento a quienes lo desperdicien porque", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: identificar y entender los contenidos locales que conforman un texto.", "o": [["A", "considera que el alimento es un derecho, no un premio por portarse bien.", "El informe lo dice: el alimento «es un derecho y no un premio por buen comportamiento».", true], ["B", "considera que los estudiantes de primaria no desperdician el alimento.", "El informe no afirma que no haya desperdicio; rechaza la sanción por otra razón.", false], ["C", "considera que esa decisión le corresponde al operador del programa.", "El informe no atribuye esa decisión al operador.", false]]}, {"id": "LC-177", "niv": 2, "e": "En el informe, la relación entre la entrega tardía del complemento y las quejas por dolor de cabeza se presenta como", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: reflexionar a partir de un texto y evaluar su contenido.", "o": [["A", "una opinión de los padres de familia recogida en una encuesta sobre el programa.", "La información proviene de las docentes, no de los padres de familia.", false], ["B", "una observación de las docentes y no como una relación causal comprobada.", "El informe dice que «las docentes reportaron» el aumento de quejas; no presenta mediciones ni un análisis que pruebe la causa. Reconocer el tipo de evidencia que sostiene una afirmación es evaluar el contenido del texto.", true], ["C", "el resultado de un estudio médico realizado por el comité de alimentación escolar.", "El informe no menciona ningún estudio médico.", false]]}, {"id": "LC-178", "niv": 3, "e": "Usted, como directivo, quiere reforzar ante el consejo directivo la recomendación de fijar una hora límite de entrega. El dato que más la apoyaría es", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: reflexionar a partir de un texto y evaluar su contenido (validez de argumentos y solidez de las evidencias).", "o": [["A", "la lista de alimentos que componen el complemento de media mañana durante el semestre.", "La composición del complemento no permite saber si el horario de entrega influye en las quejas.", false], ["B", "un registro diario que compare las quejas de los días con entrega tardía y con entrega puntual.", "Convertiría la observación de las docentes en evidencia sistemática: si las quejas son mayores cuando el complemento llega tarde, la medida gana sustento. Identificar qué dato fortalece una recomendación es evaluar argumentos.", true], ["C", "el número total de estudiantes de primaria matriculados en la institución este año.", "Es un dato de contexto que no muestra si la hora de entrega afecta a los estudiantes.", false]]}]}, {"comp": "razonamiento_cuantitativo", "rol": "directivo", "tag": "Razonamiento cuantitativo", "texto": "Usted es el rector de una institución urbana y presenta al consejo directivo la distribución del presupuesto de $48.000.000 del Fondo de Servicios Educativos destinado a inversión. La propuesta asigna el 35 % a mantenimiento de la planta física, el 25 % a material didáctico y 1/5 del presupuesto a tecnología; el dinero restante se destina a proyectos pedagógicos transversales. Todos los porcentajes y fracciones se calculan sobre el presupuesto total de $48.000.000.", "items": [{"id": "RC-105", "niv": 1, "e": "El valor que la propuesta asigna a mantenimiento de la planta física es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: porcentajes de una cantidad.", "o": [["A", "$1.680.000.", "Corre la coma decimal un lugar de más: equivale a calcular el 3,5 % del presupuesto y no el 35 %.", false], ["B", "$16.800.000.", "El 35 % de $48.000.000 es 48.000.000 × 0,35 = $16.800.000.", true], ["C", "$31.200.000.", "Es el 65 % del presupuesto, es decir, lo que queda después de restar el 35 % de mantenimiento; confunde la parte asignada con el complemento.", false]]}, {"id": "RC-106", "niv": 2, "e": "El valor que queda para proyectos pedagógicos transversales es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: equivalencia entre fracciones y porcentajes.", "o": [["A", "$9.600.000.", "1/5 equivale al 20 %. Las asignaciones suman 35 % + 25 % + 20 % = 80 %, y el 20 % restante de $48.000.000 es $9.600.000.", true], ["B", "$15.360.000.", "Calcula 1/5 sobre el saldo que queda después de los porcentajes (1/5 de $19.200.000) y no sobre el total, como indica el caso; así resta solo $3.840.000 para tecnología.", false], ["C", "$16.800.000.", "Interpreta la fracción 1/5 como 5 %. En realidad 1/5 = 0,2 = 20 %, por lo que tecnología recibe $9.600.000 y no $2.400.000.", false]]}, {"id": "RC-107", "niv": 3, "e": "Si a mitad de año se recorta el 20 % del rubro de material didáctico y ese dinero se suma al de tecnología, este último pasa a representar, del presupuesto total, el", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: porcentaje de un porcentaje y cambio de base.", "o": [["A", "24 %.", "Aumenta en 20 % el rubro de tecnología ($9.600.000 × 1,2 = $11.520.000, que es el 24 %). El recorte es el 20 % de material didáctico ($2.400.000), no el 20 % de tecnología.", false], ["B", "25 %.", "Material didáctico tiene $12.000.000 y su 20 % es $2.400.000. Tecnología pasa de $9.600.000 a $12.000.000, que es 12.000.000 ÷ 48.000.000 = 0,25, es decir, el 25 % del total.", true], ["C", "40 %.", "Suma directamente los porcentajes (20 % de tecnología + 20 % del recorte), sin advertir que el 20 % recortado se calcula sobre el rubro de material didáctico y no sobre el presupuesto total.", false]]}, {"id": "RC-108", "niv": 2, "e": "Si la distribución inicial se representa en un diagrama circular, el ángulo del sector correspondiente a mantenimiento debe medir", "f": "MEN (2006). Estándares Básicos de Competencias en Matemáticas: pensamiento aleatorio; representación de datos en diagramas circulares.", "o": [["A", "35°.", "Toma el porcentaje como si fuera la medida en grados. Un diagrama circular completo mide 360°, por lo que el 35 % corresponde a 0,35 × 360°.", false], ["B", "63°.", "Calcula el 35 % de 180° en lugar de 360°, como si el círculo completo midiera lo mismo que una semicircunferencia.", false], ["C", "126°.", "El sector debe ser proporcional al porcentaje: 0,35 × 360° = 126°.", true]]}]}, {"comp": "razonamiento_cuantitativo", "rol": "directivo", "tag": "Razonamiento cuantitativo", "texto": "Una fundación donó 1.800 libros a una institución con tres sedes. La sede A tiene 450 estudiantes y 1.200 libros en su biblioteca; la sede B, 300 estudiantes y 600 libros; y la sede C, 150 estudiantes y 400 libros. Usted, como rector, debe proponer criterios de reparto y analizar los préstamos de la biblioteca central, que fueron 1.250 en el primer semestre y 1.500 en el segundo.", "items": [{"id": "RC-178", "niv": 1, "e": "Si los libros donados se reparten en proporción directa al número de estudiantes de cada sede, la sede A recibe", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: reparto directamente proporcional.", "o": [["A", "450 libros.", "Asigna un libro por estudiante; el reparto proporcional distribuye todos los 1.800 libros según la fracción de estudiantes de cada sede.", false], ["B", "600 libros.", "Divide los libros en partes iguales entre las tres sedes (1.800 ÷ 3), lo que no es un reparto proporcional al número de estudiantes.", false], ["C", "900 libros.", "Hay 450 + 300 + 150 = 900 estudiantes. La sede A tiene 450/900 = 1/2 de ellos, así que recibe 1.800 × 1/2 = 900 libros.", true]]}, {"id": "RC-179", "niv": 3, "e": "Si, en cambio, los libros donados se reparten en proporción inversa al número de libros que ya tiene cada sede, la sede A recibe", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: reparto inversamente proporcional.", "o": [["A", "300 libros.", "Los inversos 1/1.200, 1/600 y 1/400 están en la razón 1 : 2 : 3. Con 6 partes, cada parte es 1.800 ÷ 6 = 300; la sede A recibe 1 parte: 300 libros.", true], ["B", "600 libros.", "Reparte en partes iguales (1.800 ÷ 3) y no aplica la proporcionalidad inversa.", false], ["C", "900 libros.", "Asigna a la sede A lo que le correspondería en un reparto directo por número de estudiantes (450/900 de 1.800); en un reparto inverso a los libros existentes, la sede con más libros recibe la menor parte.", false]]}, {"id": "RC-180", "niv": 2, "e": "Del primer al segundo semestre, los préstamos de la biblioteca central aumentaron un", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: variación porcentual.", "o": [["A", "16,7 %.", "Divide el aumento (250) entre el valor final (1.500); la base de la variación es el valor inicial, 1.250.", false], ["B", "20 %.", "El aumento es 1.500 − 1.250 = 250 préstamos, y 250 ÷ 1.250 = 0,2 = 20 %.", true], ["C", "120 %.", "Es la razón entre los dos valores (1.500 ÷ 1.250 = 1,2); significa que el segundo semestre fue el 120 % del primero, es decir, un aumento del 20 %.", false]]}]}, {"comp": "razonamiento_cuantitativo", "rol": "directivo", "tag": "Razonamiento cuantitativo", "texto": "Una institución urbana tiene 800 estudiantes matriculados. El 15 % son estudiantes migrantes y, de ellos, el 40 % aún no tiene un documento de identificación colombiano vigente, por lo que la institución adelanta con las familias los trámites de regularización. Usted, como rector, prepara el informe para la secretaría de educación.", "items": [{"id": "RC-188", "niv": 1, "e": "El número de estudiantes migrantes matriculados es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: porcentaje de una cantidad.", "o": [["A", "120 estudiantes.", "El 15 % de 800 es 800 × 0,15 = 120 estudiantes.", true], ["B", "680 estudiantes.", "Corresponde a los estudiantes que no son migrantes (85 % de 800); confunde la parte con su complemento.", false], ["C", "920 estudiantes.", "Aplica el 15 % como un aumento sobre la matrícula (800 × 1,15); el 15 % describe una parte de los 800 estudiantes.", false]]}, {"id": "RC-189", "niv": 2, "e": "Los estudiantes migrantes sin documento colombiano vigente representan, respecto al total de matriculados, el", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: porcentaje de un porcentaje.", "o": [["A", "6 %.", "Son el 40 % del 15 %: 0,40 × 0,15 = 0,06, es decir, el 6 % del total (48 de 800 estudiantes).", true], ["B", "40 %.", "Toma el 40 % como si fuera del total de matriculados; ese porcentaje se refiere solo a los estudiantes migrantes.", false], ["C", "55 %.", "Suma los porcentajes (15 % + 40 %), que tienen bases distintas; un porcentaje de un porcentaje se obtiene multiplicando.", false]]}, {"id": "RC-190", "niv": 3, "e": "Si el próximo año el número de estudiantes migrantes aumenta 25 % y la matrícula total aumenta 5 %, el porcentaje de migrantes respecto al total, redondeado a una cifra decimal, será", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: porcentajes y cambio de la base de referencia.", "o": [["A", "15,8 %.", "Aplica a la proporción el crecimiento de la matrícula total (15 % × 1,05 ≈ 15,8 %), en lugar de recalcular la razón entre los nuevos migrantes y la nueva matrícula.", false], ["B", "17,9 %.", "Migrantes: 120 × 1,25 = 150. Matrícula total: 800 × 1,05 = 840. Porcentaje: 150 ÷ 840 ≈ 17,9 %.", true], ["C", "18,8 %.", "Aplica el aumento del 25 % a la proporción (15 % × 1,25) sin considerar que la matrícula total también crece.", false]]}]}, {"comp": "competencias_blandas", "rol": "directivo", "tag": "Competencias blandas y ciudadanas · Liderazgo y trabajo en equipo (Guía 31)", "texto": "Usted es coordinador académico de una institución oficial con 48 docentes. Tras discutirlo en el consejo académico, el consejo directivo aprobó un ajuste al sistema institucional de evaluación para implementar este año la evaluación formativa con retroalimentación escrita en todas las áreas. En la jornada pedagógica, un grupo de docentes con más antigüedad afirma que «eso es más trabajo sin más tiempo» y que «siempre han evaluado bien». Algunos docentes recién vinculados apoyan el cambio, pero no se atreven a opinar frente a sus colegas.", "items": [{"id": "CB-138", "niv": 1, "e": "Frente a las objeciones de los docentes con más antigüedad, usted", "f": "Decreto 1290 de 2009, art. 8; MEN (2008). Guía 31, Anexo 1: Glosario de competencias (liderazgo).", "o": [["A", "propone que la implementación sea voluntaria este año, para que cada docente decida si se suma al cambio.", "Reduce la tensión, pero contradice una decisión del consejo directivo y renuncia a liderar el cambio con todo el equipo.", false], ["B", "abre de nuevo la discusión con todo el equipo sobre si conviene aplicar el cambio este año, para lograr consenso.", "Buscar consenso es valioso, pero reabrir una decisión ya aprobada por el consejo directivo debilita el gobierno escolar y deja sin rumbo la implementación.", false], ["C", "les confirma que el ajuste aprobado se aplicará este año y los invita a definir con usted formatos y tiempos.", "El sistema institucional de evaluación lo aprueba el consejo directivo y se incorpora al PEI (Decreto 1290 de 2009, art. 8), así que su aplicación no está en discusión. El liderazgo (Guía 31) consiste en sostener la visión institucional e involucrar al equipo en cómo lograrla.", true]]}, {"id": "CB-139", "niv": 2, "e": "Para que los docentes recién vinculados también participen, usted", "f": "MEN (2008). Guía 31, Anexo 1: Glosario de competencias (comunicación y relaciones interpersonales; liderazgo).", "o": [["A", "les pide en privado que defiendan sus argumentos en la próxima jornada pedagógica, para equilibrar la discusión.", "Busca equilibrar las posturas, pero los pone a confrontar a colegas con más antigüedad y polariza al equipo en bandos.", false], ["B", "recoge sus opiniones en una encuesta anónima y las presenta como la posición de la coordinación.", "La encuesta anónima permite que se expresen, pero presentar sus ideas como postura de la coordinación oculta el diálogo entre colegas y no construye confianza en el equipo.", false], ["C", "organiza trabajo por áreas en el que cada docente comparta una experiencia, con turnos de palabra para todos.", "Crear espacios con reglas de participación equitativa facilita que todas las voces se escuchen y favorece relaciones de confianza (Guía 31, comunicación y relaciones interpersonales; liderazgo).", true]]}, {"id": "CB-140", "niv": 3, "e": "Para atender la preocupación por la carga de trabajo, una decisión coherente con el liderazgo pedagógico es", "f": "MEN (2008). Guía 31, Anexo 1: Glosario de competencias (iniciativa; liderazgo).", "o": [["A", "aplicar la estrategia en todos los grupos desde la primera semana, para que los docentes se adapten con rapidez.", "Muestra decisión, pero ignora la preocupación legítima por la carga y aumenta el riesgo de que la estrategia se aplique de manera superficial.", false], ["B", "posponer la implementación hasta que la secretaría de educación asigne más horas para planeación.", "Reconoce el problema del tiempo, pero condiciona una decisión institucional a un factor externo e incierto, sin buscar soluciones con los recursos disponibles.", false], ["C", "pilotear la estrategia con algunos grupos, ajustar los formatos con los docentes y extenderla a todos durante el primer periodo.", "Anticipar dificultades y proponer soluciones viables corresponde a la iniciativa, y vincular a los docentes al ajuste de la estrategia corresponde al liderazgo (Guía 31). La gradualidad responde a la preocupación sin abandonar la decisión.", true]]}, {"id": "CB-141", "niv": 2, "e": "Tres meses después, un área no ha aplicado la estrategia pese al acompañamiento recibido y a los compromisos que asumió. Usted", "f": "MEN (2008). Guía 31, Anexo 1: Glosario de competencias (orientación al logro; liderazgo).", "o": [["A", "se reúne con el área, le recuerda que la estrategia es obligatoria y fija con ella fechas de cumplimiento con seguimiento.", "Ante un incumplimiento persistente, pese al acompañamiento, el directivo debe exigir con claridad lo aprobado y hacer seguimiento a los compromisos; así se orienta al equipo hacia los resultados (Guía 31, orientación al logro y liderazgo).", true], ["B", "presenta en la jornada pedagógica un comparativo de áreas con el nombre de cada docente, para estimular la responsabilidad.", "La información de seguimiento es útil, pero exponer públicamente a cada docente genera resistencia en lugar de corregir el incumplimiento.", false], ["C", "programa otra jornada de sensibilización para que el área reflexione sobre los beneficios de la evaluación formativa.", "La reflexión pedagógica es útil, pero el área ya recibió acompañamiento; repetir la sensibilización sin exigir compromisos concretos prolonga el incumplimiento.", false]]}]}, {"comp": "competencias_blandas", "rol": "directivo", "tag": "Competencias blandas y ciudadanas · Liderazgo y trabajo en equipo (Guía 31)", "texto": "Usted es el nuevo director rural de un centro educativo con cuatro sedes multigrado en una zona montañosa de Nariño. Los docentes de las sedes trabajan aislados y solo se reúnen en las jornadas institucionales. La comunidad le pide apoyo para un proyecto de huerta escolar en todas las sedes, pero dos docentes dicen que no tienen tiempo y que «los proyectos siempre se quedan en el papel».", "items": [{"id": "CB-185", "niv": 1, "e": "Para iniciar el trabajo conjunto entre las sedes, usted", "f": "MEN (2008). Guía 31, Anexo 1: Glosario de competencias (liderazgo).", "o": [["A", "convoca a los docentes a identificar necesidades comunes y a definir juntos una meta para el proyecto.", "El liderazgo consiste en motivar e involucrar a la comunidad con una identidad común y una visión institucional compartida (Guía 31). Construir la meta con los docentes genera sentido y compromiso.", true], ["B", "asigna el proyecto a los docentes que mostraron interés y exime a los demás, para no generar resistencia.", "Evita conflictos, pero divide al equipo y deja sedes por fuera de un proyecto que la comunidad pidió para todas.", false], ["C", "elabora usted mismo el proyecto completo y lo entrega a los docentes para que lo implementen en sus sedes.", "Aporta organización y ahorra tiempo a los docentes, pero no los involucra en la definición del proyecto, lo que reduce su apropiación.", false]]}, {"id": "CB-186", "niv": 2, "e": "Dos meses después, uno de los docentes sigue sin realizar las actividades que acordó para su sede, aunque los demás cumplen. Usted", "f": "MEN (2008). Guía 31, Anexo 1: Glosario de competencias (liderazgo; orientación al logro).", "o": [["A", "asume usted las actividades de esa sede, para que los estudiantes y la comunidad no se vean afectados.", "Protege a la comunidad en lo inmediato, pero libera al docente de su responsabilidad y no resuelve el incumplimiento.", false], ["B", "convoca a todos los docentes a una nueva reunión de reflexión sobre el sentido del proyecto para la comunidad.", "La reflexión colectiva puede motivar, pero el problema es el incumplimiento de una persona; tratarlo en general no lo corrige y recarga a quienes sí cumplen.", false], ["C", "le recuerda por escrito sus compromisos, fija con él fechas concretas y hace seguimiento a su cumplimiento.", "Como directivo, ante un incumplimiento persistente debe exigir con claridad lo acordado y hacer seguimiento; así orienta al equipo hacia los resultados y es justo con quienes cumplen (Guía 31, liderazgo y orientación al logro).", true]]}, {"id": "CB-187", "niv": 3, "e": "Para que la comunidad participe sin que el proyecto dependa solo de las familias, usted", "f": "MEN (2008). Guía 31, Anexo 1: Glosario de competencias (trabajo en equipo; competencia comunitaria).", "o": [["A", "delega la huerta en la junta de acción comunal, que tiene más tiempo y conocimiento del trabajo agrícola.", "Aprovecha un saber valioso de la comunidad, pero desliga el proyecto del trabajo pedagógico de la escuela y de la participación de los estudiantes.", false], ["B", "acuerda con familias, docentes y estudiantes roles y tiempos concretos, y articula la huerta con las áreas.", "La interacción con la comunidad y el entorno (competencia funcional comunitaria) y el trabajo en equipo (Guía 31) se concretan en acuerdos de corresponsabilidad. Articular la huerta con las áreas le da sentido pedagógico.", true], ["C", "pide a las familias que aporten semillas y herramientas y que se encarguen del mantenimiento durante el año.", "Involucra a las familias, pero les traslada la carga principal del proyecto, que es justamente lo que se busca evitar.", false]]}]}, {"comp": "pedagogia_normativa", "rol": "directivo", "tag": "Competencias pedagógicas y normativa · Funciones del rector (Ley 715 de 2001, art. 10)", "texto": "Usted acaba de posesionarse como rector de una institución educativa oficial urbana que ofrece preescolar, básica y media técnica en dos jornadas, con 58 docentes y tres coordinadores. En la primera semana encuentra varios pendientes: los docentes esperan conocer su asignación académica del año; un grupo de padres reclama que nunca se les informa qué docente orienta cada asignatura; el consejo directivo pregunta con qué periodicidad recibirá informes de la rectoría, y la coordinadora de la jornada de la tarde le reporta que un docente de educación física completa seis inasistencias sin justificación en el último mes.", "items": [{"id": "DI-101", "niv": 1, "e": "Sobre la asignación académica de los docentes, a usted le corresponde", "f": "Ley 715 de 2001, artículo 10, numeral 10.9.", "o": [["A", "distribuirla entre los docentes a su cargo, de conformidad con las normas sobre la materia.", "La Ley 715 de 2001, artículo 10, numeral 10.9, asigna al rector distribuir las asignaciones académicas y demás funciones de los docentes, directivos docentes y administrativos a su cargo, de acuerdo con las normas vigentes.", true], ["B", "someterla a votación del consejo académico, que es el órgano que organiza el plan de estudios.", "El consejo académico organiza el plan de estudios (Ley 115, art. 145), pero distribuir las asignaciones académicas es una función expresa del rector (Ley 715, num. 10.9); no se decide por votación.", false], ["C", "pedir a la secretaría de educación que la defina para cada docente según su acto de nombramiento.", "La secretaría nombra y administra la planta, pero la distribución de la asignación académica dentro del establecimiento corresponde al rector (Ley 715, num. 10.9).", false]]}, {"id": "DI-102", "niv": 2, "e": "Frente al reclamo de los padres sobre la información de los docentes, la norma le exige", "f": "Ley 715 de 2001, artículo 10, numeral 10.17.", "o": [["A", "incluir esa información en el informe anual de gestión que la rectoría presenta a la secretaría de educación.", "Informar a la secretaría no reemplaza el deber de publicidad ante la comunidad: la norma exige publicación semestral en lugares públicos y comunicación escrita a los padres (Ley 715, num. 10.17).", false], ["B", "publicar cada semestre, en lugares públicos, los docentes de cada asignatura con sus horarios y carga, y comunicarlo por escrito a los padres.", "La Ley 715 de 2001, artículo 10, numeral 10.17, ordena al rector publicar una vez al semestre en lugares públicos y comunicar por escrito a los padres los docentes a cargo de cada asignatura, sus horarios y su carga docente.", true], ["C", "entregar esa información al consejo de padres cuando este la solicite formalmente, mediante un derecho de petición dirigido a la rectoría.", "La ley no condiciona esta información a una petición: el rector debe publicarla cada semestre y comunicarla por escrito a los padres por iniciativa propia (Ley 715, num. 10.17).", false]]}, {"id": "DI-103", "niv": 1, "e": "Al consejo directivo usted debe rendirle un informe de su gestión", "f": "Ley 715 de 2001, artículo 10, numeral 10.15.", "o": [["A", "una vez al año, al finalizar el calendario académico.", "Un único informe anual no cumple la periodicidad mínima legal: la Ley 715 exige rendir informe al consejo directivo al menos cada seis meses (num. 10.15).", false], ["B", "únicamente cuando el consejo lo solicite mediante acuerdo.", "El informe es una obligación periódica del rector, no una respuesta a solicitudes del consejo: debe rendirse al menos cada seis meses (Ley 715, num. 10.15).", false], ["C", "por lo menos una vez cada seis meses.", "La Ley 715 de 2001, artículo 10, numeral 10.15, establece como función del rector rendir un informe al consejo directivo de la institución al menos cada seis meses.", true]]}, {"id": "DI-104", "niv": 2, "e": "Frente a las inasistencias injustificadas del docente de educación física, lo que corresponde a usted como rector es", "f": "Ley 715 de 2001, artículo 10, numerales 10.6 y 10.7; Ley 115 de 1994, artículo 144.", "o": [["A", "remitir el caso al consejo directivo, porque es la instancia del gobierno escolar que resuelve los conflictos que se presentan con el personal docente.", "El consejo directivo sirve de instancia en conflictos entre docentes o administrativos y alumnos (Ley 115, art. 144, lit. b); el control del cumplimiento de funciones del personal es del rector (Ley 715, num. 10.6).", false], ["B", "concederle permisos con fecha anterior para regularizar las ausencias y evitar un conflicto con él.", "El rector administra los permisos (num. 10.7), pero otorgar permisos retroactivos para encubrir ausencias injustificadas contradice su deber de control y de reporte de irregularidades (num. 10.6).", false], ["C", "verificar la situación y reportar la novedad a la secretaría de educación, en ejercicio del control sobre el cumplimiento de funciones.", "La Ley 715 de 2001, artículo 10, numeral 10.6, asigna al rector realizar el control sobre el cumplimiento de las funciones del personal docente y reportar las novedades e irregularidades a la secretaría de educación.", true]]}]}, {"comp": "pedagogia_normativa", "rol": "directivo", "tag": "Competencias pedagógicas y normativa · Gobierno escolar (Ley 115 de 1994; Decreto 1860 de 1994; Decreto 1286 de 2005)", "texto": "Usted es rector de una institución educativa rural de un municipio del Cauca que ofrece preescolar y básica completa, es decir, hasta grado noveno, en una sede principal y cuatro sedes multigrado. Parte de los estudiantes pertenece a un resguardo indígena cercano. Al iniciar el año escolar debe organizar el gobierno escolar. En la institución no existe asociación de padres de familia. Una docente de la sede principal, cuyo hijo cursa sexto en la misma institución, le manifiesta su interés en ser representante de los padres ante el consejo directivo.", "items": [{"id": "DI-105", "niv": 3, "e": "El representante de los estudiantes ante el consejo directivo debe ser", "f": "Ley 115 de 1994, artículo 143, literal d; Decreto 1860 de 1994, artículos 21 y 28.", "o": [["A", "un estudiante de grado noveno, elegido por el consejo de estudiantes, porque es el último grado que ofrece la institución.", "La Ley 115 (art. 143, lit. d) y el Decreto 1860 (art. 21, num. 4) exigen que el representante curse el último grado que ofrezca la institución y lo elija el consejo de estudiantes; aquí ese grado es noveno.", true], ["B", "un estudiante de grado once de una institución vecina, porque la norma exige que curse el último grado de la media.", "La norma se refiere al último grado que ofrece la propia institución, no al último grado de la educación media (Ley 115, art. 143; Decreto 1860, art. 21).", false], ["C", "el personero estudiantil, que por haber sido elegido por todos los estudiantes asume también la representación de ellos ante el consejo directivo.", "El Decreto 1860 de 1994, artículo 28, establece que el cargo de personero es incompatible con el de representante de los estudiantes ante el consejo directivo.", false]]}, {"id": "DI-106", "niv": 2, "e": "Para elegir a los dos representantes de los padres ante el consejo directivo, usted", "f": "Decreto 1286 de 2005, artículos 7 (literal k), 8 y 9.", "o": [["A", "convoca a la asamblea general de padres para que los elija por votación directa entre los asistentes.", "La asamblea general de padres es una instancia distinta; la elección de los representantes ante el consejo directivo corresponde al consejo de padres (Decreto 1286 de 2005, arts. 7 y 8).", false], ["B", "convoca al consejo de padres, dentro de los primeros treinta días del año lectivo, para que los elija.", "El Decreto 1286 de 2005 dispone que el consejo de padres elige a los dos representantes ante el consejo directivo (art. 7, lit. k) en reunión convocada por el rector dentro de los primeros treinta días del año lectivo (art. 8). Al no haber asociación, no aplica la excepción del art. 9, parágrafo 2.", true], ["C", "designa a los padres de los estudiantes más antiguos de la institución, ya que no existe asociación de padres.", "La antigüedad no es el criterio vigente: el Decreto 1286 de 2005 (art. 7, lit. k, y art. 8) asigna la elección al consejo de padres, en reunión convocada por el rector.", false]]}, {"id": "DI-107", "niv": 1, "e": "Para la elección del personero de los estudiantes, usted debe", "f": "Decreto 1860 de 1994, artículo 28; Ley 115 de 1994, artículo 94.", "o": [["A", "convocar solo a los estudiantes de octavo y noveno, que son quienes pueden aspirar al cargo, antes de terminar el primer período.", "Confunde quién puede ser candidato (un estudiante del último grado que ofrece la institución) con quién vota: votan todos los estudiantes matriculados, dentro de los treinta días siguientes al inicio de clases (Decreto 1860, art. 28).", false], ["B", "convocar a los estudiantes matriculados dentro de los treinta días calendario siguientes al inicio de clases, para elegirlo por mayoría simple y voto secreto.", "El Decreto 1860 de 1994, artículo 28, ordena elegir al personero dentro de los treinta días calendario siguientes al inicio de clases; el rector convoca a todos los estudiantes matriculados y la elección es por mayoría simple y voto secreto.", true], ["C", "pedir al consejo de estudiantes que lo elija entre sus voceros dentro de los primeros sesenta días del año escolar.", "El personero no lo elige el consejo de estudiantes: lo eligen todos los estudiantes matriculados, y el plazo es de treinta días calendario, no de sesenta (Decreto 1860, art. 28).", false]]}, {"id": "DI-108", "niv": 3, "e": "Sobre el interés de la docente en representar a los padres de familia, usted le explica que", "f": "Decreto 1286 de 2005, artículo 8.", "o": [["A", "puede hacerlo, porque es madre de un estudiante matriculado y esa es la condición que exige la norma.", "Ser madre de un estudiante es necesario, pero no suficiente: el Decreto 1286 de 2005, artículo 8, prohíbe que los docentes del establecimiento sean representantes de los padres en su consejo directivo.", false], ["B", "puede hacerlo siempre que no se postule también como representante de los docentes en el mismo consejo.", "La prohibición no depende de otra postulación: se origina en su condición de docente de la institución (Decreto 1286 de 2005, art. 8).", false], ["C", "no puede hacerlo, porque quienes laboran como docentes en la institución no pueden representar a los padres en su consejo directivo.", "El Decreto 1286 de 2005, artículo 8, establece que los docentes, directivos o administrativos del establecimiento no pueden ser representantes de los padres de familia en el consejo directivo del establecimiento en que laboran.", true]]}]}, {"comp": "pedagogia_normativa", "rol": "directivo", "tag": "Competencias pedagógicas y normativa · Consejo directivo y consejo académico (Ley 115 de 1994; Decreto 1860 de 1994)", "texto": "Usted es rectora de una institución educativa oficial de Barranquilla. En la sesión de febrero del consejo directivo se presentan tres asuntos: la junta de acción comunal del barrio pide usar el coliseo de la institución los sábados para un torneo juvenil; usted presenta el plan anual de actualización académica de los docentes, centrado en evaluación por competencias y educación inclusiva; y un miembro del consejo propone aprobar en esa misma sesión una propuesta de ajuste al PEI que introduce un énfasis en bilingüismo y que aún no ha sido revisada por ningún otro órgano del gobierno escolar.", "items": [{"id": "DI-109", "niv": 2, "e": "Sobre la solicitud de la junta de acción comunal, lo que corresponde es que", "f": "Ley 115 de 1994, artículo 144, literal l; Decreto 4791 de 2008 (funciones del consejo directivo).", "o": [["A", "el consejo directivo aplique el procedimiento que fijó para el uso de instalaciones y, si procede, la autorice a usted.", "La Ley 115, artículo 144, literal l, asigna al consejo directivo establecer el procedimiento para el uso de las instalaciones en actividades de la comunidad, y el Decreto 4791 de 2008 le asigna autorizar al rector la utilización de los bienes por terceros, previa verificación de ese procedimiento.", true], ["B", "usted decida directamente, porque como rectora representa al establecimiento ante las autoridades educativas y ante la comunidad del barrio.", "Representar al establecimiento no la faculta para decidir sola: la ley asigna al consejo directivo establecer el procedimiento para el uso de las instalaciones (Ley 115, art. 144, lit. l) y autorizar al rector su uso por terceros (Decreto 4791 de 2008).", false], ["C", "la secretaría de educación la autorice, porque el coliseo es un bien inmueble del municipio.", "La propiedad del inmueble no traslada la decisión a la secretaría: el uso de las instalaciones por la comunidad se tramita en el consejo directivo según su procedimiento (Ley 115, art. 144, lit. l).", false]]}, {"id": "DI-110", "niv": 1, "e": "El plan anual de actualización académica que usted presenta debe ser aprobado por", "f": "Ley 115 de 1994, artículo 144, literal f; Decreto 1860 de 1994, artículo 23, literal f.", "o": [["A", "el consejo directivo de la institución.", "La Ley 115 de 1994 (art. 144, lit. f) asigna al consejo directivo aprobar el plan anual de actualización del personal de la institución presentado por el rector, y el Decreto 1860 de 1994 (art. 23, lit. f) precisa que se trata del plan anual de actualización académica del personal docente.", true], ["B", "la asamblea general de docentes de la institución.", "La asamblea de docentes elige a sus representantes ante el consejo directivo (Decreto 1860, art. 21), pero no aprueba el plan anual de actualización.", false], ["C", "el consejo académico, que orienta los asuntos pedagógicos.", "Aunque el consejo académico orienta lo pedagógico, la aprobación del plan anual de actualización presentado por el rector es función expresa del consejo directivo (Ley 115, art. 144, lit. f).", false]]}, {"id": "DI-111", "niv": 3, "e": "Ante la propuesta de aprobar de inmediato el ajuste al PEI, usted orienta al consejo directivo para que", "f": "Decreto 1860 de 1994, artículo 24, literal a; Ley 115 de 1994, artículo 144, literal g; Ley 715 de 2001, artículo 10, numeral 10.1.", "o": [["A", "lo apruebe en esa sesión, ya que la decisión sobre el PEI es una competencia que el consejo ejerce sin consultar a otros órganos.", "El consejo directivo participa en la planeación y evaluación del PEI, pero el Decreto 1860 asigna al consejo académico servir de órgano consultor del consejo directivo en la revisión de la propuesta del PEI (art. 24, lit. a), y el rector dirige su preparación con participación de la comunidad (Ley 715, num. 10.1).", false], ["B", "la envíe a la secretaría de educación para que sea esa entidad la que estudie y apruebe primero el nuevo énfasis.", "La secretaría verifica el cumplimiento de requisitos después de que la institución planea y evalúa el PEI (Ley 115, art. 144, lit. g); no es la primera instancia de estudio.", false], ["C", "antes de decidir, cuente con el concepto del consejo académico, que es el órgano consultor en la revisión de la propuesta del PEI.", "El Decreto 1860 de 1994, artículo 24, literal a, asigna al consejo académico servir de órgano consultor del consejo directivo en la revisión de la propuesta del PEI; además, el ajuste debe construirse con participación de la comunidad (Ley 715, num. 10.1).", true]]}]}, {"comp": "pedagogia_normativa", "rol": "directivo", "tag": "Competencias pedagógicas y normativa · Fondo de Servicios Educativos (Ley 715 de 2001; Decreto 4791 de 2008)", "texto": "Usted es rectora de una institución educativa oficial en un municipio no certificado de Boyacá. Es noviembre y debe preparar el presupuesto del Fondo de Servicios Educativos para la siguiente vigencia. Además, la institución necesita adquirir mobiliario y material didáctico por un valor estimado de 35 salarios mínimos legales mensuales vigentes, y un grupo de padres, preocupado por varios robos, propone que el Fondo pague una empresa de vigilancia nocturna. La auxiliar administrativa le pregunta quién ordena los pagos, ya que el Fondo no tiene personería jurídica.", "items": [{"id": "DI-112", "niv": 1, "e": "Sobre quién ordena los gastos del Fondo de Servicios Educativos, usted le aclara que", "f": "Decreto 4791 de 2008 (ordenación del gasto; responsabilidades del rector), compilado en el Decreto 1075 de 2015.", "o": [["A", "lo hace el alcalde municipal, porque la institución está ubicada en un municipio que no está certificado en educación.", "En municipios no certificados el rector debe informar al alcalde sobre la ejecución de los recursos que este le gire, pero no transfiere la ordenación del gasto (Decreto 4791 de 2008).", false], ["B", "lo hace usted como rectora, en calidad de ordenadora del gasto, sin que ello implique representación legal.", "El Decreto 4791 de 2008 establece que los fondos de servicios educativos carecen de personería jurídica y que el rector o director rural es el ordenador del gasto, sin que su ejercicio implique representación legal.", true], ["C", "lo hace el consejo directivo en pleno, porque el Fondo carece de personería jurídica propia.", "El consejo directivo aprueba el presupuesto y reglamenta aspectos del Fondo, pero el ordenador del gasto es el rector o director rural (Decreto 4791 de 2008).", false]]}, {"id": "DI-113", "niv": 2, "e": "Para el presupuesto de la siguiente vigencia, el procedimiento correcto es que", "f": "Decreto 4791 de 2008 (funciones del consejo directivo y responsabilidades del rector); Ley 115 de 1994, artículo 144, literal n.", "o": [["A", "la secretaría de educación departamental lo elabore y lo remita a la institución para su ejecución.", "La entidad territorial brinda asesoría y control, pero la elaboración del presupuesto del Fondo es del rector y su aprobación del consejo directivo (Decreto 4791 de 2008).", false], ["B", "usted elabore el proyecto y el consejo directivo lo analice, ajuste y apruebe mediante acuerdo antes del inicio de la vigencia.", "El Decreto 4791 de 2008 asigna al rector elaborar el proyecto anual de presupuesto y presentarlo al consejo directivo, y a este analizarlo, ajustarlo y aprobarlo mediante acuerdo antes del inicio de cada vigencia fiscal.", true], ["C", "usted lo apruebe mediante resolución rectoral, como ordenadora del gasto, y después lo presente al consejo directivo para su conocimiento.", "Invierte los papeles: el rector elabora y presenta el proyecto, pero la aprobación corresponde al consejo directivo mediante acuerdo (Decreto 4791 de 2008; Ley 115, art. 144, lit. n).", false]]}, {"id": "DI-114", "niv": 3, "e": "La compra del mobiliario y el material didáctico por 35 salarios mínimos debe realizarse", "f": "Ley 715 de 2001, artículo 13; Decreto 4791 de 2008 (régimen de contratación).", "o": [["A", "con sujeción al estatuto de contratación de la administración pública, porque supera los 20 salarios mínimos.", "La Ley 715 de 2001, artículo 13, y el Decreto 4791 de 2008 disponen que los contratos con recursos del Fondo de cuantía superior a 20 salarios mínimos mensuales se rigen por el estatuto contractual de la administración pública; 35 supera ese tope.", true], ["B", "según el reglamento de contratación adoptado por el consejo directivo, que rige todos los contratos del Fondo.", "El reglamento del consejo directivo aplica a los contratos inferiores a 20 salarios mínimos; por encima de esa cuantía rige el estatuto de contratación estatal (Ley 715, art. 13; Decreto 4791 de 2008).", false], ["C", "de forma directa por usted, ya que los recursos del Fondo no se rigen por las normas de contratación estatal.", "Los actos y contratos del Fondo de cuantía superior a 20 salarios mínimos se rigen por las reglas de la contratación estatal (Ley 715, art. 13).", false]]}, {"id": "DI-115", "niv": 3, "e": "Frente a la propuesta de pagar la vigilancia nocturna con recursos del Fondo, usted responde que", "f": "Decreto 4791 de 2008 (prohibiciones en la ejecución del gasto), compilado en el Decreto 1075 de 2015.", "o": [["A", "es procedente si el consejo directivo la autoriza expresamente mediante un acuerdo, dada la situación de seguridad que enfrenta la institución.", "La autorización del consejo directivo no levanta una prohibición reglamentaria: el ordenador del gasto no puede contratar servicios de aseo y vigilancia con recursos del Fondo (Decreto 4791 de 2008).", false], ["B", "es procedente siempre que el valor del contrato sea inferior a 20 salarios mínimos.", "La cuantía determina el régimen de contratación, no levanta las prohibiciones: contratar vigilancia está prohibido con recursos del Fondo cualquiera que sea su valor (Decreto 4791 de 2008).", false], ["C", "no es procedente, porque la norma prohíbe pagar con el Fondo servicios de vigilancia del establecimiento.", "El Decreto 4791 de 2008, en las prohibiciones en la ejecución del gasto, establece que el ordenador del gasto del Fondo no puede contratar servicios de aseo y vigilancia del establecimiento educativo.", true]]}]}, {"comp": "pedagogia_normativa", "rol": "directivo", "tag": "Competencias pedagógicas y normativa · Evaluación de desempeño docente (Decreto 1278 de 2002)", "texto": "Usted es rectora de una institución educativa oficial de calendario A en Bucaramanga, cuyo año académico termina el 30 de noviembre. Está organizando la evaluación anual de desempeño de los docentes regidos por el Decreto 1278 de 2002. Entre los casos especiales están: una docente que llegó por traslado el 1 de octubre, después de trabajar el resto del año en otra institución; un docente nombrado en período de prueba que se posesionó el 1 de septiembre, y un docente que no está de acuerdo con la calificación que usted le asignó y pregunta cómo puede controvertirla.", "items": [{"id": "DI-120", "niv": 2, "e": "Respecto a la docente que llegó por traslado el 1 de octubre, usted", "f": "Decreto 1278 de 2002, artículos 31 y 32.", "o": [["A", "no le realiza la evaluación anual de desempeño en esta institución, porque no ha servido en ella más de tres meses en el año.", "El Decreto 1278 de 2002, artículo 32, dispone que la evaluación de desempeño se realiza a los docentes que hayan servido en el establecimiento por un término superior a tres meses durante el año académico; del 1 de octubre al 30 de noviembre no se cumple. Su evaluación corresponde al rector de la institución donde sirvió más de tres meses durante el año, es decir, la de origen.", true], ["B", "le realiza la evaluación anual con la información de los dos meses, porque todo docente debe ser evaluado en la institución donde termina el año.", "La norma no fija la evaluación en el lugar donde se termina el año, sino en el establecimiento donde se sirvió más de tres meses (Decreto 1278, art. 32).", false], ["C", "le aplica la evaluación de período de prueba, porque es nueva en la institución.", "El período de prueba corresponde a quien ingresa a la carrera tras el concurso (Decreto 1278, arts. 12 y 31), no a quien llega por traslado.", false]]}, {"id": "DI-121", "niv": 3, "e": "Sobre el docente en período de prueba que se posesionó el 1 de septiembre, lo correcto es que", "f": "Decreto 1278 de 2002, artículo 31.", "o": [["A", "presente este año una evaluación ordinaria de desempeño, que en su caso reemplaza la de período de prueba.", "La evaluación ordinaria anual no sustituye la de período de prueba, que es la que define la inscripción en el escalafón (Decreto 1278, arts. 27 y 31).", false], ["B", "presente este año la evaluación de período de prueba, porque se vinculó al cargo antes de que terminara el respectivo año académico.", "No basta con vincularse antes del cierre: se exige haber servido el cargo al menos cuatro meses durante el año (Decreto 1278, art. 31), y del 1 de septiembre al 30 de noviembre hay tres.", false], ["C", "no sea evaluado este año en período de prueba, porque no completó cuatro meses en el cargo, y lo sea al término del año académico siguiente.", "El Decreto 1278 de 2002, artículo 31, condiciona la evaluación de período de prueba a haber servido el cargo por un período no menor a cuatro meses durante el año; de lo contrario, se espera al año académico siguiente. Del 1 de septiembre al 30 de noviembre hay menos de cuatro meses.", true]]}, {"id": "DI-122", "niv": 1, "e": "Para valorar el desempeño de los docentes, usted puede apoyarse en", "f": "Decreto 1278 de 2002, artículos 29, 32, 33 y 34.", "o": [["A", "su apreciación personal del trabajo de cada docente, ya que la norma la designa como responsable de la evaluación.", "La rectora es la responsable (art. 32), pero la evaluación debe basarse en instrumentos y criterios objetivos (arts. 29 y 33), no en una apreciación personal.", false], ["B", "instrumentos como la observación de clases, la autoevaluación y las encuestas a padres y estudiantes.", "El Decreto 1278 de 2002, artículo 33, menciona entre los instrumentos la observación de clases y prácticas escolares, la autoevaluación del docente, las encuestas a padres y estudiantes y el análisis de los logros de los estudiantes, entre otros.", true], ["C", "el puntaje en las pruebas Saber de los estudiantes de cada docente, como criterio que define la calificación.", "El logro de los estudiantes es un aspecto a considerar (arts. 33 y 34), pero la evaluación valora múltiples aspectos y no se reduce a un solo resultado externo.", false]]}, {"id": "DI-123", "niv": 3, "e": "Al docente que no está de acuerdo con su calificación, usted le informa que", "f": "Decreto 1278 de 2002, artículo 36, parágrafo; Decreto 1850 de 2002, artículo 12.", "o": [["A", "debe presentar su reclamación ante el consejo directivo, porque este órgano del gobierno escolar participa en la evaluación anual de los docentes.", "El consejo directivo participa en la evaluación (Ley 115, art. 144, lit. j), pero los recursos contra la evaluación de desempeño son la reposición y la apelación ante los superiores (Decreto 1278, art. 36, parágrafo).", false], ["B", "puede solicitar a la Comisión Nacional del Servicio Civil que repita la evaluación con otro evaluador.", "La norma no prevé repetir la evaluación con otro evaluador; prevé los recursos de reposición y apelación (Decreto 1278, art. 36, parágrafo).", false], ["C", "puede interponer reposición ante usted y apelación ante el superior jerárquico, que deben resolverse en quince días hábiles.", "El Decreto 1278 de 2002, artículo 36, parágrafo, establece que las evaluaciones de desempeño son susceptibles de reposición y apelación, resueltas dentro de los quince días hábiles siguientes por el inmediato superior y el superior jerárquico. El rector es el superior inmediato de los docentes (Decreto 1850, art. 12).", true]]}]}, {"comp": "pedagogia_normativa", "rol": "directivo", "tag": "Competencias pedagógicas y normativa · Evaluación de directivos docentes (Ley 715 de 2001; Decreto 1278 de 2002)", "texto": "Usted fue nombrado rector hace tres años, después de haberse desempeñado durante doce años como docente de aula en el sector oficial, y se rige por el Decreto 1278 de 2002. En una reunión de rectores del municipio, un colega afirma que a los rectores «nadie los evalúa»; otro sostiene que su evaluación depende únicamente de los resultados en las pruebas Saber, y un tercero pregunta qué ocurre si un rector no aprueba la evaluación de desempeño.", "items": [{"id": "DI-124", "niv": 1, "e": "Sobre quién evalúa anualmente el desempeño de los rectores, usted aclara que lo hace", "f": "Ley 715 de 2001, artículo 10, parágrafo 1; Decreto 1278 de 2002, artículos 17 y 32.", "o": [["A", "el consejo directivo de la institución, como máxima instancia del gobierno escolar.", "El consejo directivo participa en la evaluación del personal (Ley 115, art. 144, lit. j), pero la evaluación anual del rector corresponde a la entidad territorial (Ley 715, art. 10, par. 1).", false], ["B", "la entidad territorial (departamento, distrito o municipio), como superior jerárquico del rector.", "La Ley 715 de 2001, artículo 10, parágrafo 1, dispone que el desempeño de rectores y directores será evaluado anualmente por el departamento, distrito o municipio; el Decreto 1278, artículo 32, asigna esa responsabilidad al superior jerárquico.", true], ["C", "la Comisión Nacional del Servicio Civil, que resuelve las reclamaciones de la carrera docente.", "La CNSC conoce en segunda instancia de las reclamaciones sobre la carrera (Decreto 1278, art. 17), pero no realiza la evaluación anual de desempeño de los rectores.", false]]}, {"id": "DI-125", "niv": 3, "e": "Sobre la evaluación de los directivos, usted explica que la norma prevé valorar como mínimo", "f": "Decreto 1278 de 2002, artículo 34, parágrafo.", "o": [["A", "su liderazgo, la eficiencia, la organización del trabajo y los resultados de la institución, como la retención y la promoción.", "El Decreto 1278 de 2002, artículo 34, parágrafo, prevé que la evaluación de los directivos dé cuenta, por lo menos, de su liderazgo, eficiencia, organización del trabajo y resultados de la institución, medidos con la retención y promoción de los alumnos y la evaluación externa de competencias básicas.", true], ["B", "los resultados de los estudiantes en las pruebas Saber 11, por ser el indicador externo que refleja de manera más objetiva la gestión del rector.", "Los resultados de la evaluación externa son uno de los elementos, junto con la retención y la promoción, el liderazgo, la eficiencia y la organización del trabajo (Decreto 1278, art. 34, parágrafo).", false], ["C", "el dominio de estrategias pedagógicas y de la didáctica del área en la que se desempeñó como docente.", "Esos son aspectos previstos para evaluar a los docentes (Decreto 1278, art. 34); para los directivos, el parágrafo del mismo artículo señala áreas propias de su cargo.", false]]}, {"id": "DI-126", "niv": 2, "e": "Si un rector que proviene de la docencia estatal no aprueba la evaluación de desempeño durante dos años consecutivos, la consecuencia es que", "f": "Ley 715 de 2001, artículo 10, parágrafo 1; Decreto 1278 de 2002, artículo 36.", "o": [["A", "es trasladado como rector a otra institución del mismo municipio para un nuevo período.", "La norma no prevé el traslado como consecuencia de la evaluación no satisfactoria; prevé el regreso a la docencia (Ley 715, art. 10, par. 1).", false], ["B", "es retirado del servicio y excluido del escalafón docente de manera inmediata.", "Esa consecuencia aplica al directivo que no provenía de la docencia estatal; quien sí provenía regresa a la docencia (Decreto 1278, art. 36, num. 1).", false], ["C", "regresa a la docencia cuando exista vacante, con el salario de su grado y nivel en el escalafón.", "La Ley 715 de 2001 (art. 10, par. 1) y el Decreto 1278 de 2002 (art. 36, num. 1) disponen que el directivo que proviene de la docencia estatal y no aprueba la evaluación durante dos años consecutivos regresa a la docencia, con el salario de su grado y nivel.", true]]}]}, {"comp": "pedagogia_normativa", "rol": "directivo", "tag": "Competencias pedagógicas y normativa · Gestión institucional y plan de mejoramiento (Guía 34)", "texto": "Usted es rectora de una institución educativa de Ibagué que atiende a 1.400 estudiantes, entre ellos un número creciente de niños y niñas migrantes. La secretaría de educación solicitó actualizar el plan de mejoramiento institucional. Usted conformó un equipo de gestión con coordinadores, docentes, una madre del consejo de padres y el personero. En la primera reunión, una docente propone empezar de inmediato a escribir las actividades del nuevo plan «porque todos sabemos cuáles son los problemas».", "items": [{"id": "DI-127", "niv": 1, "e": "Frente a la propuesta de la docente, usted orienta al equipo para que el primer paso sea", "f": "MEN (2008). Guía 34: Guía para el mejoramiento institucional, ruta del mejoramiento.", "o": [["A", "redactar de inmediato las actividades del plan, aprovechando el conocimiento que el equipo ya tiene de los problemas de la institución.", "Salta la primera etapa de la ruta: sin autoevaluación, el plan se basa en percepciones y no en un perfil institucional con fortalezas y oportunidades de mejoramiento (Guía 34).", false], ["B", "realizar la autoevaluación institucional, revisando la identidad de la institución y valorando cada área de gestión.", "La Guía 34 propone una ruta de tres etapas: autoevaluación institucional (revisión de la identidad, evaluación de cada área de gestión, perfil, fortalezas y oportunidades), elaboración del plan de mejoramiento, y seguimiento y evaluación.", true], ["C", "definir los indicadores de seguimiento, para garantizar desde el inicio que el plan sea evaluable.", "Los indicadores hacen parte de la elaboración del plan, segunda etapa de la ruta; antes se requiere la autoevaluación institucional (Guía 34).", false]]}, {"id": "DI-128", "niv": 3, "e": "Al revisar el proceso «clima escolar», el equipo debe ubicarlo en el área de gestión", "f": "MEN (2008). Guía 34: áreas y procesos de la gestión institucional.", "o": [["A", "directiva, junto con el gobierno escolar y la cultura institucional.", "La Guía 34 del MEN (2008) ubica expresamente el proceso «clima escolar» en el área de gestión directiva, junto con el direccionamiento estratégico y horizonte institucional, la gestión estratégica, el gobierno escolar, la cultura institucional y las relaciones con el entorno.", true], ["B", "académica, junto con las prácticas pedagógicas y la gestión de aula.", "La gestión académica comprende diseño pedagógico, prácticas pedagógicas, gestión de aula y seguimiento académico; el clima escolar pertenece a la gestión directiva (Guía 34).", false], ["C", "de la comunidad, junto con la participación y la convivencia.", "Es un error frecuente por la cercanía con la convivencia, pero en la Guía 34 el clima escolar es un proceso de la gestión directiva; la gestión de la comunidad incluye participación y convivencia, inclusión, proyección y prevención de riesgos.", false]]}, {"id": "DI-129", "niv": 2, "e": "Si en un proceso las acciones están articuladas y son conocidas por la comunidad, pero aún no se evalúan de manera sistemática, según la escala de la Guía 34 ese proceso está en el nivel de", "f": "MEN (2008). Guía 34: escala de valoración de la autoevaluación.", "o": [["A", "pertinencia.", "En el nivel de pertinencia apenas hay principios de planeación y articulación; la descripción del enunciado, con acciones articuladas y conocidas, corresponde a un nivel superior.", false], ["B", "apropiación.", "La Guía 34 define el nivel 3, apropiación, como aquel en que las acciones tienen mayor articulación y son conocidas por la comunidad, pero todavía no se realiza un proceso sistemático de evaluación y mejoramiento.", true], ["C", "mejoramiento continuo.", "El mejoramiento continuo exige evaluar los procesos y resultados y ajustarlos en consecuencia, condición que el enunciado señala como ausente (Guía 34).", false]]}, {"id": "DI-130", "niv": 2, "e": "Al formular el plan de mejoramiento, usted vela por que", "f": "MEN (2008). Guía 34: elaboración del plan de mejoramiento.", "o": [["A", "tenga un horizonte de tres años e incluya objetivos, metas, indicadores, actividades con responsables, cronograma y recursos.", "La Guía 34 plantea el plan de mejoramiento a tres años, liderado por el rector y su equipo de gestión, con objetivos, metas, resultados esperados, actividades y responsables, cronograma, recursos e indicadores de seguimiento.", true], ["B", "se limite a las actividades del año en curso, ya que el presupuesto del Fondo de Servicios Educativos se aprueba por vigencias anuales.", "La vigencia anual del presupuesto no limita el horizonte del plan: la Guía 34 propone un plan a tres años, que se apoya en planes y presupuestos anuales.", false], ["C", "se concentre en la gestión académica, porque los resultados de aprendizaje son la razón de ser de la institución.", "La gestión académica es central, pero el plan surge de la autoevaluación de las cuatro áreas de gestión y debe atender las oportunidades de mejoramiento que se identifiquen en todas ellas (Guía 34).", false]]}]}, {"comp": "pedagogia_normativa", "rol": "directivo", "tag": "Competencias pedagógicas y normativa · Comité escolar de convivencia (Ley 1620 de 2013; Decreto 1965 de 2013)", "texto": "Usted es rector de una institución educativa oficial de Pereira con básica secundaria y media. Al iniciar el año debe conformar el comité escolar de convivencia y fijar su calendario de sesiones. En marzo, la orientadora le informa que una estudiante de octavo le contó que un vigilante de la empresa contratista la tocó de manera indebida en el baño. Semanas después, mientras usted asiste a una reunión en Bogotá, el coordinador propone reunir el comité sin usted para hacer seguimiento a un caso de agresión repetida entre dos estudiantes.", "items": [{"id": "DI-131", "niv": 2, "e": "Para conformar el comité escolar de convivencia, además de usted y el coordinador, deben integrarlo", "f": "Ley 1620 de 2013, artículo 12.", "o": [["A", "los representantes de los docentes y de los padres ante el consejo directivo, el personero y el docente con función de orientación.", "Confunde la conformación del comité con la del consejo directivo: por los padres asiste el presidente del consejo de padres, y faltan el presidente del consejo de estudiantes y el docente que lidera convivencia (Ley 1620, art. 12).", false], ["B", "el personero, el representante de los estudiantes ante el consejo directivo, el representante de los exalumnos y dos docentes elegidos en la asamblea de docentes de la institución.", "Mezcla miembros del consejo directivo con los del comité; la Ley 1620 no incluye al representante de los exalumnos ni a dos docentes elegidos en asamblea (art. 12).", false], ["C", "el personero, el docente con función de orientación, los presidentes del consejo de padres y del consejo de estudiantes y un docente que lidere la convivencia.", "La Ley 1620 de 2013, artículo 12, conforma el comité con el rector (quien lo preside), el personero, el docente con función de orientación, el coordinador, el presidente del consejo de padres, el presidente del consejo de estudiantes y un docente que lidere procesos de convivencia.", true]]}, {"id": "DI-132", "niv": 1, "e": "Frente al relato de la estudiante, a usted como presidente del comité le corresponde", "f": "Decreto 1965 de 2013, artículos 40 y 44; Ley 1620 de 2013, artículo 18, numeral 4.", "o": [["A", "poner el hecho en conocimiento de la Policía Nacional de inmediato y por el medio más expedito, e informar a los padres.", "Ante una situación tipo III, el Decreto 1965 de 2013, artículo 44, ordena informar a los padres y que el presidente del comité ponga la situación en conocimiento de la Policía Nacional de inmediato y por el medio más expedito, además de garantizar la atención en salud que se requiera.", true], ["B", "pedir a la empresa contratista que adelante su investigación interna y esperar el resultado antes de actuar.", "Esperar la investigación de un tercero retrasa la protección de la estudiante; el protocolo exige poner el hecho en conocimiento de la autoridad de inmediato (Decreto 1965, art. 44).", false], ["C", "citar al vigilante y a la estudiante a un espacio de conciliación para esclarecer lo ocurrido antes de informar.", "Es una presunta conducta contra la libertad, integridad y formación sexual (situación tipo III): no se concilia y debe informarse de inmediato a la Policía Nacional (Decreto 1965, arts. 40 y 44).", false]]}, {"id": "DI-133", "niv": 3, "e": "Frente a la propuesta del coordinador de reunir el comité durante su viaje, usted le indica que", "f": "Decreto 1965 de 2013, artículo 24; Ley 1620 de 2013, artículos 12 y 18.", "o": [["A", "puede reunirlo si asiste la mayoría de sus integrantes, porque así se garantiza el quórum.", "Contar con la mayoría no basta: el Decreto 1965 de 2013, artículo 24, exige la presencia del preside
