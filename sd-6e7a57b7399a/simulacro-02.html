]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Convivencia escolar (Ley 1620 de 2013 y Decreto 1965 de 2013)", "texto": "En el descanso, dos estudiantes de cuarto grado de una escuela oficial de Popayán discuten por el turno para usar el balón; uno empuja al otro, que cae al pasto sin sufrir ninguna lesión. Es la primera vez que tienen un problema y ambos aceptan hablar. Usted, docente de turno, sabe que la institución cuenta con un grupo de estudiantes mediadores formados por la orientadora. Al día siguiente, una madre le pregunta quiénes representan a los estudiantes en el comité escolar de convivencia.", "items": [{"id": "NR-160", "niv": 1, "e": "De acuerdo con el Decreto 1965 de 2013, la situación entre los dos estudiantes se clasifica como", "f": "Decreto 1965 de 2013, artículo 40.", "o": [["A", "tipo II, porque hubo agresión física entre los estudiantes, aunque no causara incapacidad.", "El contacto físico por sí solo no configura una situación tipo II: esta exige agresión repetida o sistemática, o que cause daño al cuerpo o a la salud sin incapacidad. Aquí fue esporádico y sin lesión.", false], ["B", "tipo III, porque toda agresión física entre estudiantes debe informarse de inmediato a la Policía de Infancia.", "El tipo III corresponde a presuntos delitos; un empujón esporádico sin lesión no lo es.", false], ["C", "tipo I, por ser un conflicto esporádico manejado inadecuadamente que no causó daño al cuerpo ni a la salud.", "El artículo 40 del Decreto 1965 de 2013 define las situaciones tipo I como los conflictos manejados inadecuadamente y las situaciones esporádicas que inciden negativamente en el clima escolar y que en ningún caso generan daños al cuerpo o a la salud.", true]]}, {"id": "NR-161", "niv": 2, "e": "Según el protocolo previsto para este tipo de situación, usted debe", "f": "Decreto 1965 de 2013, artículos 42 y 44.", "o": [["A", "informar a los padres y a la Policía de Infancia y Adolescencia para que intervengan.", "La intervención policial corresponde a las situaciones tipo III; un conflicto tipo I se resuelve con mediación pedagógica en el ámbito escolar.", false], ["B", "reunir de inmediato a las partes, mediar de manera pedagógica, fijar una solución imparcial y hacer seguimiento.", "El artículo 42 del Decreto 1965 de 2013 establece para las situaciones tipo I reunir inmediatamente a las partes, mediar de manera pedagógica, fijar la forma de solución de manera imparcial, equitativa y justa, dejar constancia y hacer seguimiento.", true], ["C", "remitir el caso al comité escolar de convivencia para que defina la sanción que corresponde.", "Las situaciones tipo I se atienden directamente mediante mediación pedagógica; el protocolo no exige remitirlas al comité para definir sanciones.", false]]}, {"id": "NR-162", "niv": 2, "e": "Sobre la posibilidad de que los estudiantes mediadores participen en el manejo de esta situación, el Decreto 1965 de 2013 establece que", "f": "Decreto 1965 de 2013, artículo 42, parágrafo.", "o": [["A", "pueden participar en el manejo de las situaciones tipo I, en los términos fijados en el manual de convivencia.", "El parágrafo del artículo 42 del Decreto 1965 de 2013 prevé que los estudiantes mediadores puedan participar en el manejo de las situaciones tipo I.", true], ["B", "no pueden participar, porque la mediación de conflictos entre estudiantes les corresponde solo a los docentes.", "La norma permite de forma expresa la participación de estudiantes mediadores en las situaciones tipo I.", false], ["C", "solo pueden participar en situaciones tipo II, una vez el comité haya analizado el caso.", "La participación de los mediadores está prevista en el protocolo de las situaciones tipo I (artículo 42, parágrafo), sin depender de un análisis previo del comité.", false]]}, {"id": "NR-163", "niv": 3, "e": "A la madre que pregunta por la representación estudiantil en el comité escolar de convivencia, usted le responde que lo integran", "f": "Ley 1620 de 2013, artículo 12.", "o": [["A", "el representante de los estudiantes ante el consejo directivo y los voceros de cada grado.", "Ni el representante ante el consejo directivo ni los voceros de grado figuran en el artículo 12 de la Ley 1620; los representantes estudiantiles en el comité son el personero y el presidente del consejo de estudiantes.", false], ["B", "los estudiantes mediadores elegidos por la orientadora y el personero estudiantil.", "Los mediadores pueden participar en el manejo de situaciones tipo I, pero no son miembros del comité según el artículo 12; sí lo es, junto al personero, el presidente del consejo de estudiantes.", false], ["C", "el personero estudiantil y el presidente del consejo de estudiantes.", "El artículo 12 de la Ley 1620 de 2013 incluye en el comité al rector, el personero estudiantil, el docente con función de orientación, el coordinador, el presidente del consejo de padres, el presidente del consejo de estudiantes y un docente que lidere procesos de convivencia.", true]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Marco normativo del sector: Decreto 1075 de 2015 y Ley 115 de 1994", "texto": "Un grupo de docentes nombrados en provisionalidad se prepara para el concurso de méritos. Al estudiar, encuentran que muchas guías citan el Decreto 1860 de 1994, el Decreto 1290 de 2009 o el Decreto 1421 de 2017 con la expresión «compilado en el Decreto 1075 de 2015». Uno de ellos concluye que la Ley 115 de 1994 «ya no rige», porque todo quedó en el Decreto 1075; otra docente pregunta qué dice la Ley 115 sobre el papel del educador en la institución.", "items": [{"id": "NR-183", "niv": 1, "e": "El Decreto 1075 de 2015 es", "f": "Decreto 1075 de 2015, título y considerandos.", "o": [["A", "el Decreto Único Reglamentario del Sector Educación, que compila las normas reglamentarias del sector.", "El Decreto 1075 de 2015 se expidió como Decreto Único Reglamentario del Sector Educación, con el objetivo de compilar y racionalizar las normas de carácter reglamentario que rigen en el sector y contar con un instrumento jurídico único.", true], ["B", "la ley estatutaria de educación que sustituyó por completo a la Ley General de Educación.", "Es un decreto, no una ley, y su objeto es compilar normas reglamentarias; no sustituye la Ley 115 de 1994.", false], ["C", "el nuevo estatuto de profesionalización docente que reemplazó al Decreto 1278 de 2002.", "El Decreto 1278 de 2002 sigue siendo el estatuto de profesionalización docente; el Decreto 1075 compila normas reglamentarias del sector.", false]]}, {"id": "NR-184", "niv": 2, "e": "Frente a la conclusión de que la Ley 115 de 1994 ya no rige, lo correcto es afirmar que", "f": "Decreto 1075 de 2015, considerandos; Ley 115 de 1994, artículos 142 a 145.", "o": [["A", "es acertada solo en lo relativo al gobierno escolar, que ahora regula exclusivamente el Decreto 1075.", "El Decreto 1075 compila la reglamentación del gobierno escolar que provenía del Decreto 1860, pero los artículos 142 a 145 de la Ley 115 siguen siendo su base legal.", false], ["B", "es errada, porque el Decreto 1075 compila normas reglamentarias y no sustituye las leyes que estas reglamentan.", "Según sus considerandos, el Decreto 1075 de 2015 es un decreto compilatorio de normas reglamentarias preexistentes, cuyo contenido material corresponde al de los decretos compilados. Un decreto reglamentario no deroga la ley que reglamenta, de modo que la Ley 115 sigue vigente.", true], ["C", "es acertada, porque el Decreto 1075 derogó todas las normas anteriores del sector educativo.", "La compilación recoge decretos reglamentarios; las leyes, como la 115 de 1994 o la 1098 de 2006, no fueron compiladas ni derogadas por el Decreto 1075.", false]]}, {"id": "NR-185", "niv": 2, "e": "Sobre el papel del educador, la Ley 115 de 1994 establece que este", "f": "Ley 115 de 1994, artículos 1, 6 y 104.", "o": [["A", "ejercerá su labor de forma independiente del PEI, en virtud de la libertad de cátedra.", "La libertad de cátedra es un principio que la Ley 115 reconoce (artículo 1), pero el artículo 104 exige al educador llevar a la práctica el PEI.", false], ["B", "aplicará el plan de estudios que le entregue la institución, sin intervenir en la construcción del PEI.", "La ley espera del educador un papel activo; además, la comunidad educativa, de la que hace parte, participa en el diseño, ejecución y evaluación del PEI (artículo 6).", false], ["C", "llevará a la práctica el PEI y aportará ideas para mejorar el proceso educativo a través de los órganos de la institución.", "El artículo 104 de la Ley 115 de 1994 define al educador como orientador del proceso de formación y señala que llevará a la práctica el Proyecto Educativo Institucional y mejorará permanentemente el proceso educativo mediante el aporte de ideas y sugerencias a través del consejo directivo, el consejo académico y las juntas educativas.", true]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Aprendizaje significativo (Ausubel) en la secuencia didáctica", "texto": "Usted es docente de ciencias naturales de séptimo grado en una institución de Ibagué que tiene huerta escolar. Va a iniciar una secuencia didáctica de tres semanas sobre las relaciones tróficas en los ecosistemas. En años anteriores observó que los estudiantes memorizaban las definiciones de productor, consumidor y descomponedor para la prueba, pero semanas después no lograban explicar qué pasaría en la huerta si desaparecieran las lombrices. Este año quiere planear la secuencia desde la teoría del aprendizaje significativo de David Ausubel. Un colega del área, en cambio, sostiene que las explicaciones del docente no sirven para lograr ese tipo de aprendizaje.", "items": [{"id": "PD-108", "niv": 1, "e": "Para iniciar la secuencia de manera coherente con el aprendizaje significativo, usted debe", "f": "Ausubel, D. P. (1976). Psicología educativa: un punto de vista cognoscitivo (aprendizaje significativo).", "o": [["A", "iniciar con la definición formal de cadena trófica, para que todos partan de la misma información.", "Presentar la definición sin conocer las ideas previas aumenta el riesgo de que los estudiantes la memoricen sin relacionarla con lo que ya saben, que es lo que el docente quiere evitar.", false], ["B", "aplicar una evaluación calificable sobre el tema, para registrar la primera nota del período.", "Explorar los saberes previos tiene un fin diagnóstico y formativo; convertirlo en nota del período desvirtúa su propósito y puede inhibir que los estudiantes expresen sus ideas reales.", false], ["C", "indagar qué saben y creen los estudiantes sobre cómo se alimentan los seres vivos de la huerta.", "Para Ausubel, el aprendizaje es significativo cuando la nueva información se relaciona de manera sustantiva y no arbitraria con conocimientos previos pertinentes del estudiante; por eso el punto de partida es identificar esos conocimientos.", true]]}, {"id": "PD-109", "niv": 3, "e": "Antes de presentar las cadenas tróficas, usted muestra un esquema general de cómo circula la energía en cualquier ecosistema y pide relacionarlo con la huerta. Según Ausubel, este recurso funciona como", "f": "Ausubel, D. P. (1976). Psicología educativa: un punto de vista cognoscitivo (organizadores previos).", "o": [["A", "un organizador previo, que sirve de puente entre lo que el estudiante ya sabe y el contenido nuevo.", "Ausubel propone los organizadores previos: materiales introductorios, más generales que el contenido que sigue, que proporcionan ideas de anclaje y sirven de puente cognitivo entre lo que el estudiante sabe y lo que va a aprender.", true], ["B", "un refuerzo positivo que aumenta la probabilidad de que la respuesta correcta de los estudiantes se repita.", "El refuerzo es un concepto del conductismo (condicionamiento operante) y se refiere a las consecuencias de una conducta, no a un esquema introductorio que organiza el contenido.", false], ["C", "un conflicto cognitivo que desequilibra los esquemas del estudiante para provocar la acomodación.", "El desequilibrio y la acomodación son conceptos de Piaget. El esquema general no busca contradecir las ideas del estudiante, sino ofrecer un marco que facilite relacionar el nuevo contenido.", false]]}, {"id": "PD-110", "niv": 3, "e": "Frente a la postura del colega sobre las explicaciones del docente, desde la teoría de Ausubel usted responde que", "f": "Ausubel, D. P. (1976). Psicología educativa: un punto de vista cognoscitivo (aprendizaje por recepción y por descubrimiento).", "o": [["A", "el colega tiene razón en parte, pues la exposición produce aprendizaje significativo si el estudiante memoriza literalmente lo explicado.", "La memorización literal y arbitraria es justamente lo que caracteriza el aprendizaje memorístico o mecánico, el polo opuesto del aprendizaje significativo.", false], ["B", "una exposición puede producirlo si el material es potencialmente significativo y se relaciona con saberes previos pertinentes.", "Para Ausubel, recibir la información ya elaborada no impide aprender significativamente: se requieren un material potencialmente significativo, ideas pertinentes en la estructura cognitiva del estudiante y su disposición a relacionarlas.", true], ["C", "el colega tiene razón, porque para Ausubel solo el aprendizaje por descubrimiento puede ser significativo.", "Ausubel distingue dos dimensiones: recepción–descubrimiento y significativo–memorístico. Ambas formas, recepción y descubrimiento, pueden ser significativas o memorísticas; él incluso defendió el valor del aprendizaje significativo por recepción.", false]]}, {"id": "PD-111", "niv": 2, "e": "En el cierre de la secuencia, la actividad más coherente con el propósito de lograr aprendizaje significativo es", "f": "Ausubel, D. P. (1976). Psicología educativa; MEN (2009). Documento No. 11: Fundamentaciones y orientaciones para la implementación del Decreto 1290 de 2009.", "o": [["A", "dictar un resumen de los conceptos principales para que los estudiantes lo copien en el cuaderno.", "El dictado concentra la actividad en el docente y no exige al estudiante relacionar ni aplicar los conceptos, por lo que no aporta evidencia de que el aprendizaje sea significativo.", false], ["B", "pedir que expliquen qué pasaría en la huerta si desaparecieran las lombrices y cómo cambió su idea inicial.", "Aplicar los conceptos a una situación nueva y contrastar la idea final con la inicial permite verificar que el estudiante relacionó el contenido con su estructura cognitiva, y no solo lo memorizó.", true], ["C", "realizar un concurso de preguntas rápidas sobre las definiciones vistas durante las tres semanas de la secuencia.", "Un concurso de definiciones evalúa sobre todo el recuerdo literal, que era precisamente el problema de los años anteriores; no muestra si el estudiante puede usar los conceptos.", false]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Aprendizaje basado en problemas y en proyectos", "texto": "Usted es docente de la media técnica con especialidad agropecuaria en una institución rural del Huila. La comunidad cafetera de la vereda reporta pérdidas por la broca del café, y varios padres de familia trabajan en las fincas afectadas. Usted decide organizar la unidad de once grado mediante aprendizaje basado en problemas (ABP): presentará a los grupos la situación de una finca específica con pérdidas del 20 % de la cosecha y les pedirá proponer una solución viable, consultando fuentes técnicas y a los caficultores. Dispone de seis semanas y de la parcela demostrativa de la institución.", "items": [{"id": "PD-140", "niv": 1, "e": "Lo característico del aprendizaje basado en problemas es", "f": "Barrows, H. S. (1986). A taxonomy of problem-based learning methods; Decreto 1860 de 1994, artículo 35.", "o": [["A", "partir de un problema real y abierto que los estudiantes analizan para identificar qué necesitan aprender.", "En el ABP el problema se presenta al inicio y es el motor del aprendizaje: los estudiantes, organizados en grupos, identifican lo que saben, lo que necesitan aprender y cómo buscarlo, con el docente como guía.", true], ["B", "presentar primero toda la teoría sobre la broca y luego proponer ejercicios de aplicación al final de la unidad.", "Esa secuencia corresponde a una enseñanza expositiva seguida de aplicación; en el ABP el problema antecede a la teoría y la organiza.", false], ["C", "resolver problemas cerrados con una única respuesta para practicar procedimientos que ya fueron enseñados.", "Los ejercicios cerrados de práctica no son ABP: el problema en el ABP es abierto, contextualizado y admite varias soluciones posibles que deben argumentarse.", false]]}, {"id": "PD-141", "niv": 2, "e": "Durante las seis semanas, el papel que le corresponde a usted como docente en el ABP es", "f": "Barrows, H. S. (1986); Hmelo-Silver, C. (2004). Problem-based learning: what and how do students learn?", "o": [["A", "entregar al inicio la solución técnica del problema, para que los grupos se concentren en justificarla.", "Dar la solución anula la indagación que da sentido al ABP; los estudiantes pasarían a justificar una respuesta ajena en lugar de construir la propia.", false], ["B", "limitarse a calificar el informe final de cada grupo, para no interferir en la autonomía de los estudiantes.", "La autonomía no implica ausencia del docente; sin acompañamiento, los grupos pueden avanzar con errores o fuentes poco confiables sin oportunidad de corregir.", false], ["C", "orientar con preguntas, ayudar a organizar la indagación y verificar la calidad de las fuentes, sin resolver por ellos.", "En el ABP el docente actúa como tutor o facilitador: plantea preguntas que hacen avanzar el razonamiento, ayuda a planear la búsqueda y cuida la calidad de la información, pero no sustituye el trabajo de los estudiantes.", true]]}, {"id": "PD-142", "niv": 2, "e": "Si el propósito de la unidad fuera que los estudiantes diseñen y construyan trampas para la broca en la parcela, la estrategia se acercaría más a", "f": "Decreto 1860 de 1994, artículo 36; literatura sobre aprendizaje basado en proyectos.", "o": [["A", "una clase magistral, porque requiere que el docente explique primero el funcionamiento de las trampas para la broca.", "Que se requiera información técnica no convierte la estrategia en clase magistral; el eje sigue siendo el trabajo de los estudiantes para producir algo.", false], ["B", "un aprendizaje basado en proyectos, porque se orienta a elaborar un producto concreto ante una necesidad.", "El aprendizaje basado en proyectos se organiza en torno a la elaboración de un producto o resultado tangible. El artículo 36 del Decreto 1860 de 1994 prevé que los proyectos pedagógicos puedan orientarse al diseño y elaboración de un producto.", true], ["C", "un estudio de caso, porque se analiza una situación ya resuelta por otros para extraer conclusiones.", "El estudio de caso analiza una situación documentada; aquí los estudiantes no analizan una solución existente, sino que diseñan y construyen la suya.", false]]}, {"id": "PD-143", "niv": 3, "e": "La forma de evaluación más coherente con el ABP que usted diseñó es", "f": "MEN (2009). Documento No. 11: Fundamentaciones y orientaciones para la implementación del Decreto 1290 de 2009 (coherencia entre enfoque de enseñanza y de evaluación); Decreto 1290 de 2009, artículo 12.", "o": [["A", "valorar el proceso de indagación y trabajo en equipo y la solución propuesta, con criterios conocidos y retroalimentación.", "La evaluación debe ser coherente con el enfoque de enseñanza (Documento No. 11 del MEN). En el ABP se valoran el proceso y el producto con criterios conocidos de antemano y momentos de retroalimentación.", true], ["B", "valorar únicamente si la solución del grupo funcionó en la parcela, porque en el ABP lo que importa es el resultado.", "En el ABP el proceso de indagación, razonamiento y trabajo en equipo también es objeto de aprendizaje; valorar solo el resultado deja por fuera evidencias centrales.", false], ["C", "aplicar al final solo un examen escrito de definiciones técnicas, para garantizar la objetividad de la nota.", "Un examen de definiciones evalúa recuerdo, no la capacidad de analizar el problema, investigar y proponer una solución, que es lo que la unidad desarrolla.", false]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Constructivismo: ideas previas y cambio conceptual", "texto": "Usted enseña ciencias naturales en sexto grado en una institución de Sincelejo. Al iniciar la unidad sobre nutrición de las plantas, pregunta a sus estudiantes de dónde obtienen las plantas su alimento. La mayoría responde con seguridad que «lo sacan de la tierra, por las raíces», idea que también comparten varios padres de familia. Usted sabe que estas ideas previas suelen ser resistentes al cambio y quiere planear la unidad desde un enfoque constructivista. La institución tiene una zona verde donde los estudiantes pueden sembrar y observar plantas durante varias semanas.", "items": [{"id": "PD-179", "niv": 1, "e": "En un enfoque constructivista, el rol que usted asume frente a sus estudiantes es el de", "f": "Piaget, J. (1970). La epistemología genética; Vygotsky, L. S. (1978/2009). El desarrollo de los procesos psicológicos superiores.", "o": [["A", "observador que no interviene en el proceso, para que cada estudiante descubra por sí mismo las respuestas.", "El constructivismo no implica ausencia del docente; sin mediación, muchas ideas previas erróneas se mantienen intactas.", false], ["B", "transmisor del conocimiento científico, que explica los conceptos correctos para que los estudiantes los reciban.", "Concebir al docente como transmisor y al estudiante como receptor corresponde a un enfoque tradicional; el constructivismo entiende el conocimiento como construido por quien aprende.", false], ["C", "mediador que diseña situaciones para que los estudiantes pongan a prueba sus ideas y construyan conocimiento.", "Desde el constructivismo (Piaget, Vygotsky), el estudiante construye activamente su conocimiento y el docente diseña experiencias, plantea problemas y media para que esa construcción ocurra.", true]]}, {"id": "PD-180", "niv": 2, "e": "Frente a la idea de que las plantas obtienen su alimento de la tierra, lo más pertinente es", "f": "Piaget, J. (1970). La epistemología genética (equilibración); Ausubel, D. P. (1976). Psicología educativa.", "o": [["A", "no tener en cuenta la idea previa, porque los estudiantes la abandonarán al estudiar el tema en clase.", "Las ideas previas son resistentes; si no se trabajan explícitamente, tienden a coexistir con el concepto científico o a imponerse sobre él.", false], ["B", "plantear una experiencia que la ponga a prueba, como pesar la tierra de una matera mientras la planta crece.", "El enfoque constructivista parte de las ideas previas y propone situaciones que las confronten. Si la planta gana mucha masa mientras la tierra casi no pierde peso, la idea de que «el alimento sale de la tierra» entra en conflicto con la evidencia, y eso genera la necesidad de reorganizar la explicación.", true], ["C", "corregir de inmediato la idea errónea y dictar la definición de fotosíntesis para que la estudien.", "Corregir sin que el estudiante confronte su idea suele producir una respuesta memorizada para la prueba, mientras la idea previa se mantiene en otros contextos.", false]]}, {"id": "PD-181", "niv": 3, "e": "Cuando los resultados contradicen la idea inicial del estudiante y este reorganiza su explicación, en términos de Piaget ocurre", "f": "Piaget, J. (1970). La epistemología genética (asimilación, acomodación, equilibración).", "o": [["A", "un condicionamiento operante, porque la respuesta correcta queda reforzada por la aprobación del docente.", "El condicionamiento operante es un concepto conductista sobre el efecto de las consecuencias en la conducta; no describe la reorganización cognitiva planteada por Piaget.", false], ["B", "una asimilación, porque incorpora el dato nuevo a lo que pensaba sin necesidad de modificar sus ideas.", "La asimilación integra la experiencia a esquemas existentes sin modificarlos; aquí el estudiante sí cambia su explicación, lo que corresponde a la acomodación.", false], ["C", "un desequilibrio que se resuelve por acomodación, al modificar sus esquemas para integrar la nueva evidencia.", "Para Piaget, cuando la experiencia no puede asimilarse a los esquemas existentes se produce un desequilibrio; la equilibración se logra mediante la acomodación, que modifica los esquemas.", true]]}]}, {"comp": "psicotecnica", "rol": "docente", "tag": "Prueba psicotécnica · Compromiso social e institucional", "texto": "Usted es docente de la media técnica agropecuaria en una institución rural del Huila. Los estudiantes de once deben cumplir 120 horas de práctica en unidades productivas, y el reglamento de prácticas de la institución permite reponer hasta 10 horas de inasistencia con trabajo supervisado. Los cupos se asignan en un comité de prácticas del que usted hace parte. Este año, una empresa cafetera cuyo gerente es su hermano ofreció cinco cupos de práctica bien organizados. Además, varios estudiantes viven lejos del casco urbano, donde están casi todas las empresas.", "items": [{"id": "PS-115", "niv": 3, "e": "Ante la oferta de la empresa cafetera, usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Compromiso social e institucional). Ley 1952 de 2019, art. 44 (conflicto de intereses).", "o": [["A", "informa al comité que el gerente es su hermano y se abstiene de participar en las decisiones sobre esos cupos.", "Evidencia compromiso social e institucional (Guía 31): «demuestra honestidad e integridad en su ejercicio profesional», anteponiendo el interés institucional. Declararse impedido cuando un pariente tiene interés en el asunto es la conducta que exige la norma disciplinaria (Ley 1952 de 2019, art. 44).", true], ["B", "rechaza los cupos, para evitar cualquier comentario sobre un posible favorecimiento a su familia.", "Busca proteger su imagen, pero priva a los estudiantes de una práctica de calidad por una razón personal. El compromiso social e institucional implica anteponer los intereses institucionales a los personales, y el conflicto de interés se maneja declarándolo, no eliminando la oportunidad.", false], ["C", "acepta los cupos y los asigna a estudiantes destacados, porque conoce la seriedad de la empresa y garantiza una buena práctica.", "La intención es ofrecer una buena práctica, pero decidir sobre un asunto en el que su hermano tiene interés configura un conflicto de interés no declarado. No evidencia la honestidad e integridad que exige la competencia.", false]]}, {"id": "PS-116", "niv": 1, "e": "Un estudiante en práctica le pide que firme su asistencia de una semana completa en la que faltó por ayudar en la cosecha de su familia. Usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Compromiso social e institucional).", "o": [["A", "registra las ausencias y le informa que deberá repetir la práctica completa el próximo semestre.", "Es honesto con el registro, pero aplica una consecuencia más severa de la prevista y no orienta al estudiante sobre la reposición que permite el reglamento. El compromiso institucional implica acatar las normas tal como están definidas y con respeto hacia el estudiante.", false], ["B", "registra las ausencias como ocurrieron y le explica cómo reponer horas con trabajo supervisado según el reglamento.", "Corresponde al compromiso social e institucional (Guía 31): «demuestra honestidad e integridad en su ejercicio profesional» y «acata y divulga las normas y políticas [...] institucionales», orientando al estudiante sobre la reposición prevista.", true], ["C", "firma la asistencia, considerando que el estudiante trabajó en una labor agrícola relacionada con su formación técnica.", "Comprende la situación del estudiante, pero certifica algo que no ocurrió. Falta a la honestidad e integridad que la Guía 31 asocia al compromiso social e institucional y desconoce el reglamento de prácticas.", false]]}, {"id": "PS-117", "niv": 3, "e": "Varios estudiantes que viven lejos no pueden pagar el transporte diario hasta las empresas del casco urbano. Usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Iniciativa).", "o": [["A", "informa la situación a la secretaría de educación y espera una respuesta sobre un posible subsidio de transporte.", "Gestionar ante la secretaría es razonable, pero esperar su respuesta deja a los estudiantes sin alternativa mientras tanto. La iniciativa implica trabajar «proactivamente y con autonomía frente a las responsabilidades».", false], ["B", "solicita que esos estudiantes reemplacen la práctica presencial por un trabajo escrito sobre una unidad productiva.", "Resuelve el problema del transporte, pero rebaja la calidad de la formación técnica al eliminar la experiencia práctica. No es una solución novedosa que mantenga el propósito de la práctica.", false], ["C", "propone organizar prácticas en fincas de la vereda, con un plan de seguimiento acordado con la institución.", "Evidencia iniciativa (Guía 31): «demuestra recursividad y flexibilidad, y se adapta con rapidez a diferentes contextos» y propone una alternativa novedosa que aprovecha el entorno rural para que los estudiantes cumplan su formación.", true]]}]}, {"comp": "psicotecnica", "rol": "docente", "tag": "Prueba psicotécnica · Compromiso social e institucional", "texto": "Usted es docente de física en un colegio oficial de Bucaramanga. Este año, el consejo directivo aprobó una modificación del sistema institucional de evaluación (SIEE) que obliga a los docentes a registrar avances de los estudiantes cada cuatro semanas, y no solo al final de cada período. Usted expresó su desacuerdo en la discusión, porque considera que aumenta el trabajo sin beneficios claros. Además, este año acompaña los fines de semana al equipo de baloncesto del colegio en un torneo intercolegiado del municipio.", "items": [{"id": "PS-126", "niv": 2, "e": "Una vez aprobada la modificación del SIEE, con la que usted no estuvo de acuerdo, usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Compromiso social e institucional). Decreto 1290 de 2009, art. 8 (aprobación del SIEE por el consejo directivo).", "o": [["A", "aplica el sistema aprobado en sus grupos y presenta sus observaciones por los canales previstos para su revisión.", "Evidencia compromiso social e institucional (Guía 31): «acata y divulga las normas y políticas nacionales, regionales e institucionales» y antepone los intereses institucionales a los personales, sin renunciar a proponer mejoras por las vías establecidas.", true], ["B", "sigue registrando los avances al final de cada período mientras se revisa la decisión, ya que dejó constancia de su desacuerdo.", "Haber dejado constancia del desacuerdo es legítimo, pero no autoriza a incumplir una decisión institucional vigente. La Guía 31 señala que el compromiso social e institucional implica que el docente «acata y divulga las normas y políticas [...] institucionales».", false], ["C", "aplica el sistema aprobado, pero aclara a sus estudiantes que no está de acuerdo con la nueva forma de evaluar.", "Cumple la norma, pero debilita ante los estudiantes una política institucional que debe divulgar. El desacuerdo se tramita en los espacios institucionales; la competencia implica identificarse con las políticas de la institución.", false]]}, {"id": "PS-127", "niv": 2, "e": "En un partido del torneo, el árbitro toma una decisión que perjudica al equipo del colegio y algunos padres empiezan a insultarlo desde la tribuna. Usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Compromiso social e institucional).", "o": [["A", "se mantiene al margen, porque lo que hagan los padres en un evento de fin de semana no depende de la institución.", "Es cierto que no controla a los padres, pero usted representa al colegio en el evento y su responsabilidad no termina fuera del aula. La competencia abarca el comportamiento ético y la representación institucional fuera del establecimiento.", false], ["B", "retira al equipo del partido en señal de protesta, para proteger a los estudiantes de una situación que considera injusta.", "Busca proteger a los estudiantes, pero responde con una acción que afecta la imagen de la institución y enseña a abandonar en lugar de reclamar por los canales previstos. No representa adecuadamente a la institución.", false], ["C", "mantiene la calma, pide a estudiantes y padres respetar la decisión y presenta el reclamo por el conducto del torneo.", "Corresponde al compromiso social e institucional (Guía 31): «exhibe un comportamiento ético dentro y fuera del establecimiento y representa adecuadamente a la institución en actividades fuera de la misma».", true]]}, {"id": "PS-128", "niv": 2, "e": "En clase, un estudiante de décimo le reclama con molestia, frente a sus compañeros, porque considera injusta la nota de su examen. Usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Comunicación y relaciones interpersonales).", "o": [["A", "le pide que, si no está de acuerdo, presente su reclamo por escrito ante la coordinación.", "Remitir a un trámite formal parece ordenado, pero evita la conversación directa que el estudiante busca con su docente y deja sin respuesta su inconformidad. No demuestra escucha ni comunicación asertiva.", false], ["B", "reconoce su derecho a reclamar y lo cita al final de la clase para revisar juntos el examen y los criterios.", "Evidencia comunicación y relaciones interpersonales (Guía 31): «escucha con atención y comprende puntos de vista de los demás», «maneja y expresa adecuadamente sus emociones» y elige el momento y el espacio adecuados para el intercambio.", true], ["C", "revisa el examen en ese momento frente al grupo, para que todos vean que los criterios se aplicaron por igual.", "Busca transparencia, pero expone al estudiante ante sus compañeros y convierte el reclamo en un acto público. No se ajusta al contexto ni favorece una relación de confianza.", false]]}, {"id": "PS-129", "niv": 3, "e": "Al revisar el examen con el estudiante, usted encuentra que sumó mal el puntaje y que la nota correcta es mayor, pero el sistema de notas del período ya se cerró. Usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Compromiso social e institucional).", "o": [["A", "reconoce el error ante el estudiante y solicita la corrección de la nota por el procedimiento que tenga la institución.", "Corresponde al compromiso social e institucional (Guía 31): «demuestra honestidad e integridad en su ejercicio profesional» y «responde con oportunidad, eficiencia y calidad», usando los canales institucionales para corregir el registro.", true], ["B", "reconoce el error y le compensa la diferencia en la nota del siguiente período, ya que el sistema del período está cerrado.", "Busca reparar el daño, pero deja un registro académico que no corresponde a la realidad y altera la evaluación de otro período. No evidencia la honestidad e integridad que exige la competencia.", false], ["C", "reconoce el error, pero le explica que ya no es posible modificar la nota porque el sistema del período se cerró.", "Es honesto al reconocer el error, pero antepone el procedimiento a la corrección de un registro que perjudica al estudiante. El compromiso institucional incluye responder con calidad y oportunidad, gestionando la corrección.", false]]}]}, {"comp": "psicotecnica", "rol": "docente", "tag": "Prueba psicotécnica · Comunicación y relaciones interpersonales", "texto": "Por el cierre de la vía principal debido a un derrumbe, un colegio de la zona rural de Manizales dicta clases virtuales durante tres semanas a sus estudiantes de media. Usted es docente de química de décimo. Las clases se hacen por videollamada y el grupo tiene un chat en la plataforma institucional. Algunos estudiantes se conectan desde el celular y otros desde computadores compartidos con hermanos. En las dos primeras semanas usted ha notado cambios en la participación de algunos estudiantes.", "items": [{"id": "PS-161", "niv": 1, "e": "Una estudiante que antes participaba mucho ahora mantiene la cámara apagada y no responde cuando la nombran. Usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Comunicación y relaciones interpersonales).", "o": [["A", "le recuerda frente al grupo que la participación hace parte de la nota y que debe mantener encendida la cámara.", "Aclarar los criterios de evaluación es legítimo, pero hacerlo en público y como exigencia ignora que puede haber una dificultad detrás del cambio. No muestra comprensión de la situación del otro.", false], ["B", "le escribe en privado para preguntarle cómo está y si algo le impide participar, y le ofrece alternativas.", "Evidencia comunicación y relaciones interpersonales (Guía 31): «realiza preguntas claras, concretas y que permiten aclarar una idea o situación», identifica posibles emociones de la estudiante y adapta el canal al contexto.", true], ["C", "registra su inasistencia a la actividad y espera a que ella o su familia expliquen qué está pasando.", "Registra lo ocurrido, pero deja que la situación se prolongue sin indagar. La competencia implica tomar la iniciativa de la comunicación para comprender la situación.", false]]}, {"id": "PS-162", "niv": 2, "e": "Durante una clase, un estudiante publica en el chat un meme que se burla de la forma de hablar de usted y varios compañeros reaccionan con risas. Usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Comunicación y relaciones interpersonales).", "o": [["A", "retira el meme, continúa la clase con calma y luego habla en privado con el estudiante sobre lo ocurrido.", "Corresponde a comunicación y relaciones interpersonales (Guía 31): «maneja y expresa adecuadamente sus emociones» y «expresa argumentos de forma clara y respetuosa», detiene la difusión del contenido y elige un espacio adecuado para la conversación.", true], ["B", "hace un comentario con humor sobre el meme para restarle importancia y continúa con la clase.", "El humor reduce la tensión del momento, pero evita abordar una falta de respeto y puede normalizarla. No expresa con claridad y respeto lo que espera del estudiante.", false], ["C", "elimina el meme, saca al estudiante de la videollamada y reporta el hecho a la coordinación.", "Pone un límite claro, pero la respuesta inmediata y punitiva no permite que el estudiante comprenda el efecto de su conducta. No refleja el manejo de las emociones propias que describe la competencia.", false]]}, {"id": "PS-163", "niv": 3, "e": "En la clase virtual anterior, pocos estudiantes entendieron el concepto de mol. Para explicarlo de nuevo, usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Comunicación y relaciones interpersonales).", "o": [["A", "repite la explicación con más ejemplos y envía después al chat la presentación completa del tema.", "Insiste en el mismo canal que no funcionó y deja la presentación como apoyo posterior. No combina recursos expresivos ni verifica la comprensión durante la clase.", false], ["B", "envía antes de la clase un video de un canal reconocido sobre el tema, para que los estudiantes lleguen preparados.", "El video puede ser un buen recurso, pero por sí solo traslada la explicación a un tercero y no verifica si los estudiantes comprendieron. La competencia implica que el docente gestione el intercambio y compruebe la comprensión.", false], ["C", "combina una explicación breve, una animación corta y un esquema en pantalla, y hace preguntas para verificar la comprensión.", "Evidencia comunicación y relaciones interpersonales (Guía 31): «combina adecuadamente los recursos expresivos del lenguaje oral, escrito y gráfico, con ayuda de las tecnologías de información y comunicación» y «realiza preguntas claras» para confirmar que el mensaje llegó.", true]]}]}, {"comp": "psicotecnica", "rol": "docente", "tag": "Prueba psicotécnica · Trabajo en equipo", "texto": "Usted es docente de transición en la jornada de la mañana de un colegio oficial de Pereira. Comparte el salón y los materiales didácticos con una colega que atiende otro grupo de transición en la jornada de la tarde. En las últimas semanas, los materiales aparecen desordenados y algunos dañados, y cada una cree que el problema viene de la otra jornada. Ambas deben, además, preparar juntas la participación de transición en la feria de la ciencia de primaria del próximo mes.", "items": [{"id": "PS-168", "niv": 1, "e": "Frente al desorden y el daño de los materiales que comparten, usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Trabajo en equipo).", "o": [["A", "propone a su colega acordar juntas cómo organizar y cuidar el material y enseñar las mismas rutinas a ambos grupos.", "Evidencia trabajo en equipo (Guía 31): «trabajar cooperativamente con los diferentes miembros de la organización escolar y construir relaciones de colaboración para el logro de objetivos compartidos».", true], ["B", "guarda bajo llave el material que usted compró con su dinero para su grupo y deja disponible solo el de la institución.", "Protege sus recursos, pero divide el espacio común y debilita la relación con la colega. El trabajo en equipo implica compartir recursos y construir acuerdos.", false], ["C", "informa a la coordinadora sobre el daño del material para que defina reglas de uso para las dos jornadas.", "Acudir a la coordinación ordena el problema desde la autoridad, pero se salta el acuerdo directo entre quienes comparten el espacio. No evidencia la cooperación entre pares.", false]]}, {"id": "PS-169", "niv": 3, "e": "Después de unas semanas, su colega le dice que las rutinas que usted propuso no le funcionan con su grupo de la tarde. Usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Trabajo en equipo).", "o": [["A", "le sugiere que cada jornada maneje sus propias rutinas, ya que los grupos tienen características distintas.", "Reconoce las diferencias entre grupos, pero renuncia al acuerdo común sobre un espacio compartido, que era la causa del problema. Fragmenta el trabajo en lugar de construir colaboración.", false], ["B", "le pide que le cuente qué ha observado y ajustan juntas las rutinas incorporando sus sugerencias.", "Corresponde al trabajo en equipo (Guía 31): «acepta críticas constructivas y actúa en consecuencia» y «considera las contribuciones de los demás en la toma de decisiones», manteniendo un acuerdo común.", true], ["C", "le explica con detalle cómo aplica usted las rutinas en la mañana, para que pueda implementarlas de la misma forma.", "Ofrece ayuda, pero asume que el problema está en la aplicación y no en la propuesta. No acepta la crítica ni considera la experiencia de la colega.", false]]}, {"id": "PS-170", "niv": 2, "e": "El día de la feria de la ciencia, su colega está incapacitada y el stand de transición incluye trabajos de los niños de ambas jornadas. Usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Trabajo en equipo).", "o": [["A", "presenta solo los trabajos de su grupo, porque no conoce cómo se elaboraron los de la jornada de la tarde.", "Evita explicar lo que no conoce, pero deja por fuera a los niños de la otra jornada en un proyecto que era compartido. No ofrece apoyo al trabajo de la colega.", false], ["B", "solicita a la coordinadora que asigne a otro docente que esté disponible para presentar los trabajos de la jornada de la tarde.", "Busca que alguien los presente, pero traslada a otro una responsabilidad compartida que usted está en mejores condiciones de asumir. No muestra cooperación con la colega.", false], ["C", "revisa la planeación y los registros que dejó su colega y presenta los trabajos de ambos grupos, con crédito a los niños de la tarde.", "Evidencia trabajo en equipo (Guía 31): «ofrece apoyo para el trabajo de otros» y asume el objetivo compartido con su colega, reconociendo los aportes de su grupo.", true]]}, {"id": "PS-171", "niv": 1, "e": "Durante la feria, dos niños de transición se disputan quién explica el experimento a los visitantes y uno de ellos empieza a llorar. Usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Negociación y mediación).", "o": [["A", "explica usted misma el experimento a los visitantes hasta que los dos niños se calmen.", "Evita que el conflicto afecte la presentación, pero lo aplaza sin resolverlo y quita protagonismo a los niños. No genera una solución con las partes.", false], ["B", "decide que explique el niño que llegó primero al stand y consuela al otro mientras tanto.", "Resuelve rápido con un criterio razonable, pero decide por los niños y pierde la oportunidad de enseñarles a llegar a un acuerdo. No forma en estrategias de resolución pacífica.", false], ["C", "se pone a su altura, escucha a cada uno y los ayuda a acordar cómo turnarse para explicar el experimento.", "Corresponde a negociación y mediación (Guía 31): «interviene efectiva y oportunamente ante situaciones de conflicto» y «forma a sus estudiantes en estrategias de resolución pacífica de conflictos», adecuadas a su edad.", true]]}]}];
const CFG = {"titulo": "Simulacro 2 · Concurso Docente 2026–2027", "modo": "simulacro", "minutos": 194, "componentes": {"lectura_critica": "Lectura crítica", "razonamiento_cuantitativo": "Razonamiento cuantitativo", "competencias_blandas": "Competencias blandas y ciudadanas", "pedagogia_normativa": "Competencias pedagógicas y normativa", "psicotecnica": "Prueba psicotécnica"}, "niveles": {"1": "Básico", "2": "Intermedio", "3": "Avanzado"}, "clave": "simulacro-02.html"};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY = 'sim-docente:' + CFG.clave;
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}
function save(){try{localStorage.setItem(KEY, JSON.stringify(ST))}catch(e){}}
let ST = load();
ST.r = ST.r || {};
$('#tit').textContent = CFG.titulo;
const ITEMS = [];
DATA.forEach(c => c.items.forEach(it => { it.caso = c; ITEMS.push(it); }));

function justHTML(it){
  return '<div class="just">' + it.o.map(o => `<div><b>${o[0]}.</b> <span class="${o[3]?'okt':'not'}">${o[3]?'Es correcta.':'Es incorrecta.'}</span> ${esc(o[2])}</div>`).join('') +
    `<div class="src">Referencia: ${esc(it.f)}</div></div>`;
}
function itemHTML(it, n, mode){
  const r = ST.r[it.id];
  const reveal = mode === 'review' || (CFG.modo === 'practica' && r);
  let h = `<div class="item" id="i-${it.id}"><p class="enun"><span class="n">${n}.</span> <span class="niv">${CFG.niveles[it.niv]}</span> ${esc(it.e)}</p>`;
  it.o.forEach(o => {
    let cls = '';
    if (reveal) { if (o[3]) cls = 'ok'; else if (r === o[0]) cls = 'no'; }
    else if (r === o[0]) cls = 'sel';
    h += `<button class="op ${cls}" data-id="${it.id}" data-l="${o[0]}" ${reveal?'disabled':''}><span class="l">${o[0]}.</span><span>${esc(o[1])}</span></button>`;
  });
  if (reveal) {
    if (mode === 'review') h += `<div class="${r===keyOf(it)?'res-ok':'res-no'}" style="font-size:14px;margin-top:4px">${r ? (r===keyOf(it)?'Respondiste ' + r + ': correcto.':'Respondiste ' + r + '. La respuesta correcta es ' + keyOf(it) + '.') : 'Sin responder. La respuesta correcta es ' + keyOf(it) + '.'}</div>`;
    h += justHTML(it);
  }
  return h + '</div>';
}
const keyOf = it => it.o.find(o => o[3])[0];

function renderList(list, mode){
  let h = '', last = null, n = 0;
  list.forEach(it => {
    n++;
    if (it.caso !== last) { last = it.caso; h += `<div class="caso"><div class="tag">${esc(it.caso.tag)}</div><p>${esc(it.caso.texto)}</p></div>`; }
    h += itemHTML(it, n, mode);
  });
  return h;
}

// ---------- PRÁCTICA ----------
let LIST = [];
let FILTRO = ST.f || {comp:'', niv:'', rol:''};
function practica(){
  const comps = Object.entries(CFG.componentes).map(([k,v]) => `<option value="${k}" ${FILTRO.comp===k?'selected':''}>${esc(v)}</option>`).join('');
  const nivs = Object.entries(CFG.niveles).map(([k,v]) => `<option value="${k}" ${FILTRO.niv===k?'selected':''}>${esc(v)}</option>`).join('');
  const list = ITEMS.filter(it => (!FILTRO.comp || it.caso.comp===FILTRO.comp) && (!FILTRO.niv || String(it.niv)===FILTRO.niv) && (!FILTRO.rol || it.caso.rol===FILTRO.rol));
  const resp = list.filter(it => ST.r[it.id]); const ok = resp.filter(it => ST.r[it.id]===keyOf(it));
  $('#main').innerHTML = `<div class="panel"><p style="margin-top:0">Elige un tema y un nivel. Al responder verás de inmediato si acertaste y la explicación de cada opción.</p>
  <div class="row"><select id="fc"><option value="">Todos los temas</option>${comps}</select>
  <select id="fn"><option value="">Todos los niveles</option>${nivs}</select>
  <select id="fr"><option value="">Docentes y directivos</option><option value="docente" ${FILTRO.rol==='docente'?'selected':''}>Solo docentes</option><option value="directivo" ${FILTRO.rol==='directivo'?'selected':''}>Solo directivos</option></select>
  <button class="btn sec" id="borrar">Borrar mis respuestas</button></div>
  <p class="stat" id="pst" style="margin-bottom:0">${list.length} preguntas · respondidas ${resp.length} · aciertos ${ok.length}${resp.length? ' (' + Math.round(100*ok.length/resp.length) + ' %)':''}</p></div>` + renderList(list, 'practica');
  $('#prog').textContent = `${ok.length}/${resp.length} aciertos`;
  ['fc','fn','fr'].forEach((id,i) => $('#'+id).onchange = e => { FILTRO[['comp','niv','rol'][i]] = e.target.value; ST.f = FILTRO; save(); practica(); });
  LIST = list;
  $('#borrar').onclick = () => { list.forEach(it => delete ST.r[it.id]); save(); practica(); };
}

// ---------- SIMULACRO ----------
let tick = null;
function inicio(){
  const n = ITEMS.length, cnt = {};
  ITEMS.forEach(it => cnt[it.caso.comp] = (cnt[it.caso.comp]||0) + 1);
  const h = Math.floor(CFG.minutos/60), m = CFG.minutos%60;
  $('#main').innerHTML = `<div class="panel"><h2 style="margin-top:0;color:var(--pri)">Instrucciones</h2>
  <p>Este simulacro tiene <b>${n} preguntas</b> en el formato de Prueba de Juicio Situacional: un caso, enunciados que se completan y tres opciones con una sola respuesta correcta.</p>
  <table>${Object.entries(cnt).map(([k,v]) => `<tr><td>${esc(CFG.componentes[k])}</td><td class="r">${v}</td></tr>`).join('')}</table>
  <p>Tiempo sugerido: <b>${h ? h + ' h ' : ''}${m ? m + ' min' : ''}</b> (unos ${Math.round(CFG.minutos*60/n/6)/10} minutos por pregunta). Cuando se acaba el tiempo puedes seguir, pero el cronómetro lo indica.</p>
  <p>Tus respuestas se guardan en este navegador. Al terminar verás tu puntaje por componente y por nivel, y la explicación de cada pregunta.</p>
  <button class="btn" id="go">${ST.t0 ? 'Continuar el simulacro' : 'Comenzar'}</button></div>`;
  $('#prog').textContent = `${n} preguntas`;
  $('#go').onclick = () => { if (!ST.t0) { ST.t0 = Date.now(); save(); } examen(); };
}
function reloj(){
  const rest = CFG.minutos*60 - Math.floor((Date.now() - ST.t0)/1000);
  const a = Math.abs(rest), hh = Math.floor(a/3600), mm = Math.floor(a%3600/60), ss = a%60;
  const t = (rest < 0 ? '+' : '') + (hh ? hh + ':' : '') + String(mm).padStart(2,'0') + ':' + String(ss).padStart(2,'0');
  $('#timer').textContent = rest < 0 ? 'Tiempo cumplido ' + t : '⏱ ' + t;
  $('#timer').classList.toggle('low', rest < 600);
}
function examen(){
  $('#main').innerHTML = renderList(ITEMS, 'examen') + `<div class="panel"><button class="btn" id="fin">Terminar y calificar</button></div>`;
  progreso(); reloj(); clearInterval(tick); tick = setInterval(reloj, 1000);
  $('#fin').onclick = () => {
    const faltan = ITEMS.length - Object.keys(ST.r).filter(k => ITEMS.some(i => i.id===k)).length;
    $('#mtxt').textContent = faltan ? `Te faltan ${faltan} preguntas por responder. ¿Quieres calificar de todos modos?` : '¿Quieres terminar y ver tu calificación?';
    $('#modal').classList.remove('hide');
  };
}
function progreso(){
  const r = ITEMS.filter(it => ST.r[it.id]).length;
  $('#prog').textContent = `Respondidas ${r}/${ITEMS.length}`;
}
$('#mno').onclick = () => $('#modal').classList.add('hide');
$('#msi').onclick = () => { $('#modal').classList.add('hide'); ST.fin = Date.now(); save(); resultados(); };
function resultados(){
  clearInterval(tick);
  const ok = ITEMS.filter(it => ST.r[it.id] === keyOf(it)).length;
  const pct = Math.round(1000*ok/ITEMS.length)/10;
  const g = (fn, lab) => { const m = {}; ITEMS.forEach(it => { const k = fn(it); m[k] = m[k] || [0,0]; m[k][1]++; if (ST.r[it.id]===keyOf(it)) m[k][0]++; });
    return Object.entries(m).map(([k,v]) => `<tr><td>${esc(lab(k))}</td><td class="r">${v[0]}/${v[1]}</td><td class="r">${Math.round(100*v[0]/v[1])} %</td></tr>`).join(''); };
  const mins = Math.round(((ST.fin||Date.now()) - ST.t0)/60000);
  $('#timer').textContent = `Tiempo usado: ${Math.floor(mins/60) ? Math.floor(mins/60) + ' h ' : ''}${mins%60} min`;
  $('#prog').textContent = `${ok}/${ITEMS.length} aciertos`;
  $('#main').innerHTML = `<div class="panel"><div class="big">${String(pct).replace('.',',')} %</div>
  <p style="margin-top:4px">${ok} de ${ITEMS.length} respuestas correctas. ${pct >= 70 ? 'Muy buen resultado: repasa las explicaciones de tus errores para afianzarlo.' : pct >= 60 ? 'Vas bien, pero con poco margen: refuerza los componentes con menor porcentaje.' : 'Todavía no estás en zona segura: practica por tema los componentes con menor porcentaje.'}</p>
  <p class="aviso">Referencia: en el concurso el mínimo aprobatorio de la prueba eliminatoria es 60 puntos (70 para directivos). Este porcentaje de aciertos es una guía de preparación; la CNSC calcula su puntaje con su propia escala.</p>
  <h3>Por componente</h3><table>${g(it => it.caso.comp, k => CFG.componentes[k])}</table>
  <h3>Por nivel</h3><table>${g(it => it.niv, k => CFG.niveles[k])}</table>
  <div class="row" style="margin-top:14px"><button class="btn" id="solo">Ver solo mis errores</button><button class="btn sec" id="todas">Ver todas</button><button class="btn sec" id="otra">Reiniciar el simulacro</button></div></div><div id="rev"></div>`;
  const rev = errs => { const l = errs ? ITEMS.filter(it => ST.r[it.id] !== keyOf(it)) : ITEMS; $('#rev').innerHTML = renderList(l, 'review'); };
  rev(true);
  $('#solo').onclick = () => rev(true); $('#todas').onclick = () => rev(false);
  $('#otra').onclick = () => { ST = {r:{}}; save(); inicio(); window.scrollTo(0,0); };
}

document.addEventListener('click', e => {
  const b = e.target.closest('button.op'); if (!b || b.disabled) return;
  ST.r[b.dataset.id] = b.dataset.l; save();
  const it = ITEMS.find(i => i.id === b.dataset.id);
  const n = b.closest('.item').querySelector('.n').textContent.replace('.','');
  b.closest('.item').outerHTML = itemHTML(it, n, CFG.modo === 'practica' ? 'practica' : 'examen');
  if (CFG.modo === 'practica') { const resp = LIST.filter(i => ST.r[i.id]); const ok = resp.filter(i => ST.r[i.id]===keyOf(i)).length; $('#prog').textContent = `${ok}/${resp.length} aciertos`; $('#pst').textContent = `${LIST.length} preguntas · respondidas ${resp.length} · aciertos ${ok} (${Math.round(100*ok/resp.length)} %)`; }
  else progreso();
});

if (CFG.modo === 'practica') practica();
else if (ST.fin) resultados();
else if (ST.t0) examen();
else inicio();
</script>
</body>
</html>
