<script>
const DATA = [{"comp": "lectura_critica", "rol": "docente", "tag": "Lectura crítica", "texto": "Lea la siguiente columna publicada en la revista de una institución educativa de básica secundaria y media:\n\n«Cada vez que un colegio anuncia que prohibirá los celulares, aparecen dos bandos irreconciliables. Unos celebran el regreso del silencio a las aulas; otros denuncian un retroceso frente al mundo digital. Ambos, creo, discuten sobre el objeto equivocado.\n\nEl problema no es el aparato, sino un uso que nadie ha enseñado. Un estudiante que revisa sus notificaciones cada tres minutos no necesita que le quiten el teléfono durante seis horas para devolvérselo intacto a la salida; necesita aprender a gobernar su atención. Prohibir sin enseñar se parece a cerrar la piscina para evitar que los niños se ahoguen: el riesgo desaparece del colegio, pero los espera en cualquier otra parte.\n\nAhora bien, enseñar ese autocontrol exige acuerdos claros. Propongo que cada área defina momentos en que el celular es una herramienta —buscar un dato, grabar un experimento, consultar un diccionario— y momentos en que debe permanecer guardado. Las reglas serán imperfectas, pero al menos tendrán un propósito pedagógico y no solo disciplinario.»", "items": [{"id": "LC-101", "niv": 1, "e": "Al explicar la columna a sus estudiantes, usted aclara que la expresión «gobernar su atención» significa", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: identificar y entender los contenidos locales (sentido de palabras y expresiones en contexto).", "o": [["A", "cumplir las normas que fija el colegio sobre el uso del celular en clase.", "Describe un control externo, que es justamente lo que el autor considera insuficiente: el estudiante no necesita que le quiten el teléfono, sino aprender a regularse por sí mismo.", false], ["B", "atender a las clases y renunciar por completo al uso del teléfono móvil.", "El autor no propone renunciar al teléfono; en el tercer párrafo plantea momentos en los que el celular es una herramienta de aprendizaje.", false], ["C", "decidir por sí mismo hacia dónde dirige su atención y en qué momento.", "El autor opone quitar el teléfono (control externo) a que el estudiante aprenda a regularse; «gobernar» se refiere aquí al autocontrol. Precisar el sentido de una expresión en su contexto es una tarea de comprensión local.", true]]}, {"id": "LC-102", "niv": 2, "e": "La comparación con «cerrar la piscina para evitar que los niños se ahoguen» se usa en el texto para", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: comprender cómo se articulan las partes de un texto para darle un sentido global.", "o": [["A", "mostrar que prohibir aleja el riesgo del colegio, pero no prepara al estudiante para enfrentarlo.", "El texto lo explica tras los dos puntos: «el riesgo desaparece del colegio, pero los espera en cualquier otra parte». La analogía sirve de apoyo a la tesis de que hay que enseñar el uso, no solo prohibir. Reconocer la función de un recurso dentro del argumento es comprender cómo se articulan las partes del texto.", true], ["B", "sugerir que el colegio ofrezca actividades recreativas que compitan con el uso del celular.", "El texto no habla de actividades recreativas; la piscina es una imagen para cuestionar la prohibición, no una propuesta concreta.", false], ["C", "advertir que el celular puede ser tan peligroso para los estudiantes como el agua para los niños pequeños.", "La analogía no compara la magnitud del peligro; compara dos estrategias que evitan el riesgo en un lugar sin preparar a la persona para enfrentarlo en otros.", false]]}, {"id": "LC-103", "niv": 2, "e": "Al afirmar en el primer párrafo que los dos bandos «discuten sobre el objeto equivocado», el autor", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: comprender el sentido global del texto (tesis e intención comunicativa).", "o": [["A", "se pone del lado de quienes defienden la prohibición, aunque reconoce que esta tiene algunos costos.", "El autor no apoya la prohibición; la critica en el segundo párrafo («Prohibir sin enseñar…»).", false], ["B", "toma distancia de ambas posturas para desplazar el debate del aparato hacia la enseñanza de su uso.", "Inmediatamente después afirma que «el problema no es el aparato, sino un uso que nadie ha enseñado». La frase prepara la tesis del texto, que supera la oposición entre prohibir y permitir.", true], ["C", "se declara neutral en el debate y evita proponer una solución propia al problema.", "No es neutral ni se abstiene: en el tercer párrafo formula una propuesta concreta («Propongo que cada área defina momentos…»).", false]]}, {"id": "LC-104", "niv": 3, "e": "En una reunión de área, un colega objeta que muchos estudiantes no logran autorregularse aunque reciban orientación. Frente a la propuesta de la columna, esta objeción", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: reflexionar a partir de un texto y evaluar su contenido (supuestos implícitos).", "o": [["A", "es irrelevante, porque la columna no se ocupa de la capacidad de los estudiantes para regularse.", "Es falso: la autorregulación es el centro de la columna («necesita aprender a gobernar su atención», «enseñar ese autocontrol»).", false], ["B", "pone en duda un supuesto de la propuesta: que el autocontrol se enseña con acuerdos por áreas.", "La propuesta del autor descansa en la idea de que enseñar y acordar normas permitirá que los estudiantes se regulen. La objeción ataca ese supuesto, aunque no demuestra que la prohibición sea mejor. Identificar el supuesto que una objeción pone en duda es reflexionar sobre el contenido del texto.", true], ["C", "demuestra que la prohibición total es la única medida eficaz para manejar el celular en el colegio.", "La objeción señala una dificultad, pero no prueba que exista una única medida eficaz; pasar de una dificultad a esa conclusión es un salto argumentativo.", false]]}]}, {"comp": "lectura_critica", "rol": "docente", "tag": "Lectura crítica", "texto": "Lea el siguiente fragmento de un ensayo escrito por un docente etnoeducador:\n\n«Durante mucho tiempo, la escuela llegó a los territorios indígenas convencida de que traía el conocimiento a donde no lo había. Enseñó a leer y a escribir, y eso fue valioso; pero, al mismo tiempo, trató la palabra de los mayores como un saber menor, algo propio del pasado que debía ceder ante el libro.\n\nHoy sabemos que la oralidad no es la etapa previa a la escritura, sino otra forma de guardar y transmitir el conocimiento. Alrededor del fogón se aprenden la historia del pueblo, las normas de convivencia y los nombres de las plantas, con una precisión que ningún manual escolar ha igualado.\n\nUna escuela propia no tendría que elegir entre el cuaderno y la palabra de los mayores. Podría, por ejemplo, invitar a los sabedores a enseñar en el aula y pedir a los niños que escriban, en su lengua, lo que escuchan. Así, la escritura dejaría de ser un instrumento para reemplazar la tradición y se convertiría en una herramienta para conservarla.»", "items": [{"id": "LC-133", "niv": 1, "e": "Según el texto, la oralidad debe entenderse como", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: identificar y entender los contenidos locales que conforman un texto.", "o": [["A", "una etapa previa que conduce al aprendizaje de la escritura.", "El texto lo niega de manera explícita: «la oralidad no es la etapa previa a la escritura».", false], ["B", "un saber del pasado que debe ceder su lugar al libro.", "Esa es la visión que el autor atribuye a la escuela tradicional y que critica.", false], ["C", "un modo propio de conservar y compartir los saberes de una comunidad.", "El segundo párrafo lo afirma: la oralidad es «otra forma de guardar y transmitir el conocimiento».", true]]}, {"id": "LC-134", "niv": 2, "e": "La expresión «convencida de que traía el conocimiento a donde no lo había» permite inferir que el autor", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: identificar y entender los contenidos locales (sentido de palabras y expresiones en contexto).", "o": [["A", "critica la idea de que en esos territorios no existía conocimiento antes de la escuela.", "El autor atribuye esa convicción a la escuela para cuestionarla; el resto del texto muestra que las comunidades ya tenían saberes propios. Inferir la postura del autor a partir de una expresión es comprensión local con inferencia.", true], ["B", "reconoce que la escuela fue la primera fuente de conocimiento en los territorios indígenas.", "Es justo lo que el autor cuestiona: la palabra de los mayores ya era una forma de conocimiento.", false], ["C", "considera que la escuela debe retirarse de los territorios indígenas para proteger la tradición.", "El autor no propone retirar la escuela, sino transformarla en una «escuela propia» que integre la tradición.", false]]}, {"id": "LC-135", "niv": 2, "e": "La propuesta del último párrafo se relaciona con los anteriores porque", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: comprender cómo se articulan las partes de un texto para darle un sentido global.", "o": [["A", "contradice el primer párrafo, en el que se reconoce que enseñar a leer y escribir fue valioso.", "No lo contradice: la propuesta mantiene el valor de la escritura y le asigna un nuevo propósito.", false], ["B", "repite el ejemplo del fogón para demostrar que la oralidad supera a la escritura.", "El último párrafo no repite ese ejemplo ni sostiene que una forma sea superior; busca integrarlas.", false], ["C", "plantea cómo integrar la escritura y la oralidad, que antes aparecían enfrentadas.", "Los dos primeros párrafos describen la oposición entre el libro y la palabra de los mayores; el último propone que la escritura sirva para conservar la tradición oral. Reconocer esta relación es comprender cómo se articulan las partes del texto.", true]]}, {"id": "LC-136", "niv": 3, "e": "La afirmación de que alrededor del fogón se aprenden los nombres de las plantas «con una precisión que ningún manual escolar ha igualado» es", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: reflexionar a partir de un texto y evaluar su contenido.", "o": [["A", "una valoración del propio autor, que el texto no respalda con datos ni con evidencias.", "Es un juicio que refuerza la tesis, pero el texto no ofrece datos que lo sustenten. Distinguir entre opiniones y afirmaciones respaldadas es reflexionar sobre el contenido de un texto.", true], ["B", "una cita textual de los mayores que el autor reproduce en la lengua de la comunidad.", "No aparece entre comillas ni se atribuye a nadie; es una afirmación del propio autor.", false], ["C", "un dato comprobado que el autor obtiene de un estudio comparativo entre manuales.", "El texto no menciona ningún estudio; nada indica que se trate de un dato comprobado.", false]]}]}, {"comp": "lectura_critica", "rol": "docente", "tag": "Lectura crítica", "texto": "Lea la siguiente tabla, que la orientadora de un colegio presentó en una reunión de padres de familia. Resume una encuesta a 300 estudiantes de grados octavo a once:\n\nHoras diarias frente a pantallas (fuera de clase) | Número de estudiantes | Horas promedio de sueño | Estudiantes que reportan cansancio en clase\nMenos de 2 horas | 60 | 8,1 | 20 %\nDe 2 a 4 horas | 150 | 7,2 | 41 %\nMás de 4 horas | 90 | 6,3 | 67 %\n\nAl final de su presentación, la orientadora afirmó: «Las pantallas les están robando el sueño a nuestros hijos».", "items": [{"id": "LC-164", "niv": 1, "e": "Según la tabla, el grupo con mayor número de estudiantes es el de quienes pasan frente a pantallas", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: identificar y entender los contenidos locales en textos discontinuos (tablas, gráficas e infografías).", "o": [["A", "menos de 2 horas diarias.", "Este grupo tiene 60 estudiantes, el menor número de los tres.", false], ["B", "de 2 a 4 horas diarias.", "Con 150 estudiantes, es el grupo más numeroso: la mitad de los 300 encuestados. Es lectura directa de la tabla.", true], ["C", "más de 4 horas diarias.", "Este grupo tiene 90 estudiantes, menos que el grupo de 2 a 4 horas.", false]]}, {"id": "LC-165", "niv": 2, "e": "De la tabla se puede afirmar que, a medida que aumentan las horas frente a pantallas,", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: identificar y entender los contenidos locales en textos discontinuos (tablas, gráficas e infografías).", "o": [["A", "disminuyen tanto el número de estudiantes como el porcentaje que reporta cansancio.", "El número de estudiantes no disminuye de manera constante (60, 150, 90) y el cansancio aumenta.", false], ["B", "disminuyen las horas promedio de sueño y aumenta el porcentaje que reporta cansancio.", "El sueño pasa de 8,1 a 7,2 y a 6,3 horas, mientras el cansancio sube de 20 % a 41 % y a 67 %. Describir tendencias de una tabla es interpretar un texto discontinuo.", true], ["C", "aumentan las horas de sueño, pero también el porcentaje de quienes reportan cansancio.", "Las horas de sueño disminuyen (8,1; 7,2; 6,3), no aumentan.", false]]}, {"id": "LC-166", "niv": 2, "e": "Si usted quisiera calcular el promedio de horas de sueño de los 300 estudiantes, debería", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: identificar y entender los contenidos locales en textos discontinuos (tablas, gráficas e infografías).", "o": [["A", "ponderar el promedio de cada grupo según el número de estudiantes que lo forman.", "El promedio general es (60 × 8,1 + 150 × 7,2 + 90 × 6,3) ÷ 300 = 2.133 ÷ 300 ≈ 7,1 horas. Cuando los grupos tienen distinto tamaño, hay que ponderar.", true], ["B", "tomar el valor del grupo de 2 a 4 horas, porque es el grupo más numeroso.", "Usar solo el grupo más numeroso deja por fuera a 150 estudiantes; el resultado no representa a todos.", false], ["C", "sumar los tres promedios de la tabla y dividir el resultado entre tres.", "Este procedimiento da el mismo peso a grupos de tamaño muy distinto (60, 150 y 90 estudiantes), error frecuente al combinar promedios.", false]]}, {"id": "LC-167", "niv": 3, "e": "La afirmación final de la orientadora va más allá de lo que muestran los datos porque", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: reflexionar a partir de un texto y evaluar su contenido (validez de argumentos y solidez de las evidencias).", "o": [["A", "los estudiantes que usan menos las pantallas son los que más cansancio reportan en clase.", "Es falso: ese grupo reporta el menor cansancio (20 %).", false], ["B", "la mayoría de los estudiantes encuestados pasa menos de dos horas diarias frente a pantallas.", "Es falso: solo 60 de los 300 estudiantes están en ese grupo.", false], ["C", "la tabla muestra una asociación entre las dos variables, no una relación de causa y efecto.", "Los datos indican que más pantallas y menos sueño van juntos, pero no prueban la dirección de la relación (quizá quien duerme mal usa más la pantalla) ni descartan otras causas comunes. Distinguir correlación de causalidad es evaluar la solidez de una conclusión.", true]]}]}, {"comp": "lectura_critica", "rol": "docente", "tag": "Lectura crítica", "texto": "Lea el siguiente fragmento del discurso que una estudiante pronunció en la ceremonia de grado de su colegio:\n\n«Nos dijeron muchas veces que éramos el futuro del país. Con todo respeto, no estoy de acuerdo. Somos el presente. El futuro es una palabra cómoda para los adultos, porque permite aplazar las cosas: lo que no se nos da hoy se nos promete para mañana.\n\nEn estos once años aprendimos fórmulas, fechas y reglas de ortografía. Pero lo que más recuerdo es otra cosa: la profesora que nos dejó organizar la feria de ciencias aunque sabía que nos íbamos a equivocar, y el día en que el consejo estudiantil logró que se arreglaran los baños. Ahí entendí que participar no es un ensayo para la vida adulta; es la vida misma.»", "items": [{"id": "LC-168", "niv": 1, "e": "Para la estudiante, la expresión «el futuro del país» resulta", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: identificar y entender los contenidos locales (sentido de palabras y expresiones en contexto).", "o": [["A", "una meta que los graduandos deberán alcanzar cuando ingresen a la educación superior.", "El discurso no habla de la educación superior; critica la idea de aplazar la participación de los jóvenes.", false], ["B", "un reconocimiento merecido al esfuerzo de los estudiantes durante su vida escolar.", "La estudiante rechaza la expresión («no estoy de acuerdo»); no la recibe como un reconocimiento.", false], ["C", "una fórmula que permite a los adultos aplazar lo que les deben a los jóvenes.", "La estudiante lo explica: «El futuro es una palabra cómoda para los adultos, porque permite aplazar las cosas». Interpretar el sentido que el autor da a una expresión es comprensión local.", true]]}, {"id": "LC-169", "niv": 2, "e": "Los dos recuerdos que menciona la estudiante sirven, en el discurso, para", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: comprender cómo se articulan las partes de un texto para darle un sentido global.", "o": [["A", "respaldar la idea de que participar de verdad hace parte de la formación escolar.", "La feria de ciencias y el logro del consejo estudiantil son ejemplos de participación real, que conducen a la conclusión: participar «es la vida misma». Los ejemplos sostienen la tesis del discurso.", true], ["B", "mostrar que las fórmulas y las fechas son el aprendizaje más valioso del colegio.", "Los recuerdos se presentan en contraste con las fórmulas y las fechas («Pero lo que más recuerdo es otra cosa»).", false], ["C", "criticar a los docentes que no permitían a los estudiantes equivocarse en sus proyectos.", "La estudiante elogia a una profesora que les dejó equivocarse; no critica a otros docentes.", false]]}, {"id": "LC-170", "niv": 3, "e": "Si usted quisiera presentar a sus estudiantes una postura opuesta a la tesis central del discurso, el argumento que mejor la representaría es que", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: reflexionar a partir de un texto y evaluar su contenido (contraste de textos con perspectivas distintas).", "o": [["A", "la feria de ciencias y el consejo estudiantil son experiencias valiosas que deberían ampliarse.", "Este argumento coincide con el discurso, que valora esas experiencias de participación.", false], ["B", "la escuela debe preparar a los jóvenes para participar más adelante, cuando tengan más madurez.", "La tesis del discurso es que participar no es un ensayo para la vida adulta. La postura contraria sostiene que la escuela es una preparación y que la participación plena llega después. Reconocer una tesis opuesta es comparar perspectivas.", true], ["C", "los adultos que llaman a los jóvenes «el futuro del país» lo dicen con sinceridad y no para aplazar nada.", "Se opone a una afirmación secundaria del discurso (la crítica a la expresión «el futuro»), pero no a su tesis central: que participar no es un ensayo para la vida adulta, sino parte de la vida misma.", false]]}]}, {"comp": "lectura_critica", "rol": "docente", "tag": "Lectura crítica", "texto": "Lea el siguiente fragmento de un artículo sobre las escuelas multigrado:\n\n«Para muchos, el aula multigrado es una solución de emergencia: lo que se hace cuando no hay suficientes niños ni suficientes maestros. Esa mirada pasa por alto lo que ocurre dentro de ella. En un aula donde conviven niños de siete y de once años, los mayores explican a los menores y, al hacerlo, repasan y organizan lo que saben; los menores, por su parte, escuchan contenidos que todavía no les corresponden y llegan a ellos con cierta familiaridad.\n\nNada de esto ocurre de manera automática. Requiere guías de trabajo bien diseñadas, un docente que sepa organizar grupos y tiempos, y espacios que no estén pensados para treinta pupitres mirando al tablero. Cuando faltan esas condiciones, el aula multigrado sí se convierte en lo que sus críticos dicen: un docente agotado intentando dar cinco clases a la vez.»", "items": [{"id": "LC-198", "niv": 1, "e": "Según el texto, los estudiantes mayores de un aula multigrado se benefician de", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: identificar y entender los contenidos locales que conforman un texto.", "o": [["A", "recibir más atención del docente que los estudiantes menores del grupo.", "El texto no dice que los mayores reciban más atención del docente.", false], ["B", "escuchar contenidos que todavía no les corresponden a su edad.", "Ese beneficio corresponde, según el texto, a los estudiantes menores.", false], ["C", "repasar y organizar lo que saben al explicarles a los menores.", "El texto lo afirma: los mayores explican a los menores y, al hacerlo, «repasan y organizan lo que saben».", true]]}, {"id": "LC-199", "niv": 2, "e": "La oración «Nada de esto ocurre de manera automática» marca en el texto el paso", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: comprender cómo se articulan las partes de un texto (conectores y función de los párrafos).", "o": [["A", "de la descripción de los estudiantes mayores a la descripción de los estudiantes menores.", "Ambos grupos se describen en el primer párrafo, antes de esa oración.", false], ["B", "de los beneficios posibles del aula multigrado a las condiciones que estos requieren.", "Antes de la oración se describen las ventajas; después, lo que se necesita para lograrlas (guías, docente preparado, espacios adecuados). Identificar estas transiciones es comprender la articulación del texto.", true], ["C", "de la crítica al aula multigrado a la defensa de las aulas organizadas por un solo grado.", "El texto no defiende las aulas de un solo grado; sigue hablando del aula multigrado.", false]]}, {"id": "LC-200", "niv": 3, "e": "La última oración del texto", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: comprender cómo se articulan las partes de un texto para darle un sentido global.", "o": [["A", "da la razón a los críticos en un caso específico, sin renunciar a la tesis del autor.", "El autor concede que, sin las condiciones necesarias, el aula multigrado sí es lo que dicen sus críticos; con ello no abandona su tesis, sino que la delimita. Reconocer una concesión es comprender cómo se construye un argumento.", true], ["B", "contradice la tesis del autor, porque reconoce que el aula multigrado no funciona.", "El autor no dice que el aula multigrado no funcione, sino que no funciona cuando faltan ciertas condiciones.", false], ["C", "resume la opinión del autor, según la cual el docente multigrado vive siempre agotado.", "El autor atribuye esa imagen a los críticos y la limita a los casos en que faltan las condiciones.", false]]}, {"id": "LC-201", "niv": 3, "e": "Para defender la tesis del autor frente a quienes ven el aula multigrado como «una solución de emergencia», la evidencia más pertinente sería", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: reflexionar a partir de un texto y evaluar su contenido (validez de argumentos y solidez de las evidencias).", "o": [["A", "testimonios de docentes multigrado sobre el cansancio que les produce su trabajo.", "Estos testimonios apoyarían la visión de los críticos, no la del autor.", false], ["B", "resultados de aprendizaje de escuelas multigrado con guías, docentes formados y espacios adecuados.", "La tesis sostiene que, con ciertas condiciones, el aula multigrado ofrece ventajas pedagógicas. Lo que mejor la respalda son resultados de escuelas que cumplen esas condiciones. Identificar la evidencia pertinente es evaluar un argumento.", true], ["C", "el número de escuelas multigrado que funcionan hoy en las zonas rurales del país.", "Saber cuántas escuelas multigrado existen no muestra si en ellas se aprende bien; podría incluso reforzar la idea de que son una solución de emergencia.", false]]}]}, {"comp": "razonamiento_cuantitativo", "rol": "docente", "tag": "Razonamiento cuantitativo", "texto": "Una institución de jornada única funciona de lunes a viernes, de 7:00 a. m. a 3:00 p. m. Cada día hay un descanso de 30 minutos y un almuerzo de 45 minutos; el resto del tiempo, 405 minutos diarios, está disponible para clases. Actualmente se dictan 8 bloques de clase de 50 minutos cada día y los 5 minutos sobrantes se usan para la formación de entrada. El proyecto educativo institucional exige como mínimo 30 horas semanales de clase, contadas en horas de 60 minutos. Usted integra el comité que revisa el horario.", "items": [{"id": "RC-117", "niv": 1, "e": "Con el horario actual, el tiempo total de clase a la semana es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: conversión de unidades de tiempo.", "o": [["A", "33 h 20 min.", "Por semana hay 8 × 50 × 5 = 2.000 minutos. Como 2.000 = 33 × 60 + 20, el tiempo es 33 horas y 20 minutos.", true], ["B", "33 h 33 min.", "Divide 2.000 ÷ 60 = 33,33… y toma la parte decimal como si fueran minutos. En realidad 0,33… horas equivalen a 20 minutos.", false], ["C", "40 h.", "Cuenta cada bloque como una hora (8 × 5 = 40), aunque cada bloque dura 50 minutos y no 60.", false]]}, {"id": "RC-118", "niv": 2, "e": "Para cumplir exactamente el mínimo del proyecto educativo con bloques de 50 minutos, el número de bloques semanales necesarios es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: conversión de unidades y razones.", "o": [["A", "25 bloques.", "Hace la conversión al revés (30 × 50 ÷ 60 = 25): trata las horas como si fueran bloques y luego las convierte a horas.", false], ["B", "30 bloques.", "Iguala cada bloque de 50 minutos a una hora de 60 minutos; 30 bloques solo suman 1.500 minutos, es decir, 25 horas.", false], ["C", "36 bloques.", "30 horas equivalen a 30 × 60 = 1.800 minutos, y 1.800 ÷ 50 = 36 bloques de 50 minutos.", true]]}, {"id": "RC-119", "niv": 2, "e": "Si se cambia a bloques de 55 minutos y se mantienen los 405 minutos diarios para clases, el número de bloques completos que caben cada día es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: interpretación del cociente y del residuo en contexto.", "o": [["A", "7 bloques.", "405 ÷ 55 = 7,36…; caben 7 bloques completos (385 minutos) y sobran 20 minutos, que no alcanzan para un octavo bloque.", true], ["B", "8 bloques.", "Redondea 7,36 hacia arriba; 8 bloques de 55 minutos requieren 440 minutos, más de los 405 disponibles.", false], ["C", "9 bloques.", "Usa toda la jornada (480 ÷ 55 = 8,7 y redondea a 9) sin descontar el descanso y el almuerzo.", false]]}, {"id": "RC-120", "niv": 3, "e": "Con 7 bloques diarios de 55 minutos, respecto al mínimo de 30 horas semanales del proyecto educativo, la conclusión correcta es que el horario", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: validación de procedimientos y argumentos.", "o": [["A", "no cumple, porque 385 minutos diarios de clase no alcanzan las 6 horas y media que se requieren cada día.", "Reparte mal el mínimo semanal: 30 horas en 5 días son 6 horas diarias (360 minutos), y los 385 minutos diarios las superan.", false], ["B", "no cumple, porque 35 bloques son menos que los 36 bloques que se necesitan con bloques de 50 minutos.", "Compara cantidades de bloques de duración distinta. Los 36 bloques corresponden a bloques de 50 minutos; con bloques de 55 minutos se requieren menos.", false], ["C", "cumple, porque suma 1.925 minutos semanales, es decir, 32 horas y 5 minutos.", "7 × 55 × 5 = 1.925 minutos. Como 30 horas son 1.800 minutos, el horario supera el mínimo en 125 minutos.", true]]}]}, {"comp": "razonamiento_cuantitativo", "rol": "docente", "tag": "Razonamiento cuantitativo", "texto": "Los estudiantes de grado once reunieron $3.000.000 para su ceremonia de grado, que será dentro de varios meses. Usted, como director de grupo, les ayuda a comparar dos alternativas para guardar el dinero: una cuenta de ahorro que paga 1 % mensual de interés compuesto (los intereses de cada mes se suman al saldo y generan intereses el mes siguiente) y una cooperativa que paga 1,2 % mensual de interés simple (los intereses se calculan siempre sobre los $3.000.000 iniciales). En ninguna de las dos se hacen retiros ni nuevos depósitos.", "items": [{"id": "RC-141", "niv": 1, "e": "En la cooperativa, los intereses que se acumulan en 6 meses son", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: interés simple.", "o": [["A", "$216.000.", "Con interés simple: 3.000.000 × 0,012 × 6 = $216.000.", true], ["B", "$2.160.000.", "Usa 12 % en lugar de 1,2 % mensual (3.000.000 × 0,12 × 6); confunde la posición de la coma decimal al convertir el porcentaje.", false], ["C", "$3.216.000.", "Es el saldo total al cabo de 6 meses (capital más intereses); el enunciado pide solo los intereses.", false]]}, {"id": "RC-142", "niv": 2, "e": "En la cuenta de ahorro, el saldo al cabo de 6 meses, redondeado al peso, es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: interés compuesto y crecimiento exponencial.", "o": [["A", "$3.030.000.", "Corresponde al saldo al final del primer mes (3.000.000 × 1,01); faltan los 5 meses restantes.", false], ["B", "$3.180.000.", "Calcula el 1 % como si fuera interés simple (3.000.000 × 0,01 × 6 = 180.000), sin capitalizar los intereses de cada mes.", false], ["C", "$3.184.560.", "Con interés compuesto, el saldo se multiplica por 1,01 cada mes: 3.000.000 × 1,01⁶ ≈ 3.000.000 × 1,0615 ≈ $3.184.560.", true]]}, {"id": "RC-143", "niv": 3, "e": "Si el dinero se va a guardar exactamente 6 meses, la recomendación correcta es elegir", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: comparación de modelos de crecimiento lineal y exponencial.", "o": [["A", "la cuenta de ahorro, porque el interés compuesto produce más dinero que el interés simple en cualquier plazo.", "Generaliza sin considerar las tasas: a igual tasa el compuesto supera al simple, pero aquí las tasas son distintas y en 6 meses el 1,2 % simple rinde más.", false], ["B", "la cooperativa, porque en 6 meses su saldo final supera al de la cuenta de ahorro.", "Cooperativa: 3.000.000 + 216.000 = $3.216.000. Cuenta de ahorro: 3.000.000 × 1,01⁶ ≈ $3.184.560. En 6 meses la tasa más alta de la cooperativa compensa la capitalización de la cuenta.", true], ["C", "cualquiera de las dos, porque el 1,2 % simple y el 1 % compuesto producen el mismo saldo en 6 meses.", "Afirma una equivalencia sin calcularla. Los saldos difieren en unos $31.440 a favor de la cooperativa.", false]]}, {"id": "RC-144", "niv": 3, "e": "En la cuenta de ahorro, el número mínimo de meses completos necesarios para que el saldo llegue al menos a $3.600.000 es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: interés compuesto y modelación con funciones exponenciales.", "o": [["A", "18 meses.", "Trunca el valor aproximado 18,3 que se obtiene al resolver 1,01ⁿ = 1,2; a los 18 meses el saldo es de unos $3.588.442 y todavía no alcanza la meta.", false], ["B", "19 meses.", "Se busca el menor n con 3.000.000 × 1,01ⁿ ≥ 3.600.000, es decir, 1,01ⁿ ≥ 1,2. Con n = 18 el saldo es ≈ $3.588.442 y con n = 19 es ≈ $3.624.327, así que se necesitan 19 meses.", true], ["C", "20 meses.", "Razona como interés simple: si cada mes se gana el 1 % del capital inicial, se necesitarían 20 meses para ganar el 20 %; la capitalización hace que se alcance antes.", false]]}]}, {"comp": "razonamiento_cuantitativo", "rol": "docente", "tag": "Razonamiento cuantitativo", "texto": "Los estudiantes de séptimo preparan la huerta escolar. Para el sustrato de las eras mezclan, por volumen, 4 partes de tierra, 3 partes de compost y 1 parte de arena. En el plano que dibujaron a escala 1:50, la huerta es un rectángulo de 24 cm × 16 cm. La huerta se cerrará con una cerca que tendrá postes cada 2 m a lo largo de todo el perímetro, incluido un poste en cada esquina. Usted acompaña el proyecto como docente de ciencias naturales.", "items": [{"id": "RC-153", "niv": 1, "e": "Para preparar 240 litros de sustrato, la cantidad de compost necesaria es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: razones y proporciones; reparto proporcional.", "o": [["A", "90 litros.", "La mezcla tiene 4 + 3 + 1 = 8 partes, y el compost es 3 de ellas: 240 × 3/8 = 90 litros.", true], ["B", "102,9 litros.", "Omite la arena y reparte solo entre tierra y compost (240 × 3/7 ≈ 102,9); la arena también forma parte de la mezcla.", false], ["C", "120 litros.", "Calcula la cantidad de tierra (4 de las 8 partes: 240 × 4/8) en lugar de la de compost, que corresponde a 3 partes.", false]]}, {"id": "RC-154", "niv": 3, "e": "El área real de la huerta es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: escalas, proporcionalidad y conversión de unidades de área.", "o": [["A", "1,92 m².", "Multiplica el área del plano (384 cm²) por 50, pero en una escala lineal 1:50 las áreas se multiplican por 50² = 2.500.", false], ["B", "96 m².", "Las medidas reales son 24 × 50 = 1.200 cm = 12 m y 16 × 50 = 800 cm = 8 m. El área es 12 × 8 = 96 m².", true], ["C", "9.600 m².", "Calcula bien 960.000 cm², pero divide entre 100 para pasar a m²; 1 m² = 10.000 cm², así que son 96 m².", false]]}, {"id": "RC-155", "niv": 2, "e": "El número de postes necesarios para la cerca es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: perímetro y conteo en figuras cerradas.", "o": [["A", "19 postes.", "Resta un poste por considerar que el primero y el último coinciden, pero ese ajuste ya está incluido al dividir el perímetro cerrado entre la separación.", false], ["B", "20 postes.", "La huerta real mide 12 m × 8 m, con perímetro 2 × (12 + 8) = 40 m. En una línea cerrada hay tantos postes como tramos: 40 ÷ 2 = 20 postes.", true], ["C", "21 postes.", "Suma un poste como si la cerca fuera una línea abierta; en un perímetro cerrado el último tramo termina en el primer poste.", false]]}]}, {"comp": "razonamiento_cuantitativo", "rol": "docente", "tag": "Razonamiento cuantitativo", "texto": "El comité de bienestar encuestó a 200 familias de la institución sobre conectividad. De las 120 familias que tienen internet en casa, 90 tienen computador y 30 no. De las 80 familias que no tienen internet, 20 tienen computador y 60 no. Usted debe presentar los resultados al consejo directivo para orientar la estrategia de guías impresas y préstamo de equipos.", "items": [{"id": "RC-174", "niv": 1, "e": "El porcentaje de familias encuestadas que tiene internet en casa es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: porcentajes en tablas de doble entrada.", "o": [["A", "40 %.", "Es el porcentaje de familias sin internet (80 ÷ 200), es decir, el complemento de lo que se pregunta.", false], ["B", "45 %.", "Cuenta solo las familias con internet y computador (90 ÷ 200); la pregunta incluye también las 30 que tienen internet sin computador.", false], ["C", "60 %.", "Tienen internet 120 de las 200 familias: 120 ÷ 200 = 60 %.", true]]}, {"id": "RC-175", "niv": 3, "e": "Entre las familias que tienen computador, el porcentaje que también tiene internet es aproximadamente", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: porcentajes condicionales en tablas de doble entrada.", "o": [["A", "45 %.", "Divide entre el total de familias (90 ÷ 200); la pregunta restringe la base a las familias con computador.", false], ["B", "75 %.", "Invierte la condición: 90 ÷ 120 es el porcentaje de familias con computador entre las que tienen internet.", false], ["C", "81,8 %.", "Tienen computador 90 + 20 = 110 familias; de ellas, 90 tienen internet: 90 ÷ 110 ≈ 81,8 %.", true]]}, {"id": "RC-176", "niv": 2, "e": "El porcentaje de familias encuestadas que tiene computador es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: porcentajes y error de promediar porcentajes con bases distintas.", "o": [["A", "45 %.", "Solo cuenta las familias con computador que también tienen internet; faltan las 20 que tienen computador sin internet.", false], ["B", "50 %.", "Promedia los porcentajes de cada grupo (75 % y 25 %) sin considerar que los grupos tienen tamaños distintos (120 y 80 familias).", false], ["C", "55 %.", "Tienen computador 90 + 20 = 110 familias de 200: 110 ÷ 200 = 55 %.", true]]}, {"id": "RC-177", "niv": 2, "e": "Con los datos de la encuesta, la conclusión válida que usted puede presentar al consejo es que", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: interpretación de tablas y validación de conclusiones.", "o": [["A", "tener computador es más frecuente entre las familias con internet (75 %) que entre las que no lo tienen (25 %).", "Con internet: 90 ÷ 120 = 75 % tiene computador. Sin internet: 20 ÷ 80 = 25 %. La comparación usa porcentajes dentro de cada grupo, que tienen tamaños distintos.", true], ["B", "el 60 % de las familias no tiene ni internet ni computador, porque son 60 familias.", "Confunde una cantidad absoluta con un porcentaje: 60 familias de 200 son el 30 %.", false], ["C", "la mayoría de las familias sin internet tiene computador, así que basta con instalarles conexión.", "Contradice los datos: de las 80 familias sin internet, solo 20 (25 %) tienen computador.", false]]}]}, {"comp": "razonamiento_cuantitativo", "rol": "docente", "tag": "Razonamiento cuantitativo", "texto": "Usted orienta matemáticas en dos grupos de décimo, cada uno con 30 estudiantes. En la evaluación del primer periodo, ambos grupos obtuvieron un promedio de 3,6 en escala de 1,0 a 5,0. En 10A la nota más baja fue 3,2 y la más alta 4,0. En 10B la nota más baja fue 1,8 y la más alta 5,0. Usted debe decidir en cuál grupo concentrar las actividades de refuerzo.", "items": [{"id": "RC-191", "niv": 1, "e": "El rango de las notas de 10B es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: medidas de dispersión: rango.", "o": [["A", "0,8.", "Corresponde al rango de 10A (4,0 − 3,2); la pregunta se refiere a 10B.", false], ["B", "3,2.", "El rango es la diferencia entre el dato mayor y el menor: 5,0 − 1,8 = 3,2.", true], ["C", "6,8.", "Suma la nota mayor y la menor (5,0 + 1,8); el rango se obtiene restándolas.", false]]}, {"id": "RC-192", "niv": 3, "e": "Un colega concluye: «como los dos grupos tienen el mismo promedio, su desempeño fue igual y requieren el mismo refuerzo». Frente a esta conclusión, usted argumenta que", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: comparación de distribuciones con medidas de tendencia central y de dispersión.", "o": [["A", "no es válida, porque con el mismo promedio 10B presenta mucha más dispersión: tiene al menos una nota muy baja (1,8), y en 10A nadie bajó de 3,2.", "El promedio no describe la dispersión. En 10A todas las notas están entre 3,2 y 4,0 (rango 0,8); en 10B hay notas desde 1,8 (rango 3,2), así que algunos estudiantes de 10B están por debajo de 3,0 y nadie en 10A lo está.", true], ["B", "es válida, porque el promedio es la medida que mejor resume el desempeño de un grupo.", "Usa una sola medida de tendencia central para un juicio que requiere conocer la distribución; dos grupos con igual promedio pueden tener situaciones muy distintas.", false], ["C", "no es válida, porque 10B tuvo mejor desempeño que 10A al tener la nota más alta del curso (5,0), lo que indica que necesita menos refuerzo.", "Toma un dato extremo como representativo del grupo; la nota máxima no indica cómo les fue a los demás estudiantes ni compensa las notas bajas.", false]]}, {"id": "RC-193", "niv": 2, "e": "Para identificar con precisión en cuál grupo hay más estudiantes que necesitan refuerzo, el dato más útil que usted debe obtener es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: selección de información pertinente para resolver un problema.", "o": [["A", "la diferencia entre los promedios de los dos grupos, para saber cuál de ellos tuvo un desempeño general más bajo.", "Los promedios son iguales (3,6), así que su diferencia es 0 y no permite distinguir entre los grupos.", false], ["B", "el número de estudiantes con nota inferior a 3,0 en cada grupo.", "La necesidad de refuerzo depende de cuántos estudiantes no alcanzan el desempeño básico, información que da la distribución de las notas y no el promedio ni los extremos.", true], ["C", "la nota más alta de cada grupo.", "La nota máxima describe a un solo estudiante y no informa cuántos están por debajo del desempeño básico.", false]]}]}, {"comp": "competencias_blandas", "rol": "docente", "tag": "Competencias blandas y ciudadanas · Habilidades socioemocionales en el aula", "texto": "Usted es docente de segundo grado en una escuela oficial. Durante el recreo, Juan Pablo, de siete años, le rompe el dibujo a una compañera porque ella no lo dejó jugar. Al volver al salón llega llorando, con los puños apretados, y grita que «nadie lo quiere». La compañera también llora. Faltan cinco minutos para iniciar la clase de matemáticas y el resto del grupo observa la escena en silencio.", "items": [{"id": "CB-120", "niv": 1, "e": "En ese momento, lo primero que usted hace con Juan Pablo es", "f": "MEN (2004). Estándares Básicos de Competencias Ciudadanas, Serie Guías n.º 6 (convivencia y paz, grados 1.° a 3.°).", "o": [["A", "pedirle que se disculpe de inmediato con su compañera, para que entienda que sus acciones tienen consecuencias.", "Asumir la responsabilidad es necesario, pero exigir una disculpa mientras el niño está desbordado produce una disculpa sin sentido y no lo ayuda a manejar su emoción.", false], ["B", "enviarlo a coordinación para que se tranquilice allí y no se interrumpa el inicio de la clase.", "Protege el tiempo de clase, pero aleja al niño de quien puede acompañarlo en ese momento y pierde la oportunidad de enseñarle a regular su emoción.", false], ["C", "acercarse con calma, ayudarlo a respirar y a nombrar lo que siente antes de hablar de lo ocurrido.", "Los Estándares de Competencias Ciudadanas para los primeros grados plantean reconocer las emociones básicas, como la rabia y la tristeza, y aprender a manejarlas para no hacer daño (Guía 6, convivencia y paz). Con el niño desbordado, primero se regula la emoción.", true]]}, {"id": "CB-121", "niv": 2, "e": "Una vez Juan Pablo está tranquilo, para abordar el daño causado a su compañera usted", "f": "Decreto 1965 de 2013, arts. 40 y 42; MEN (2004). Estándares Básicos de Competencias Ciudadanas, Serie Guías n.º 6 (convivencia y paz).", "o": [["A", "propicia que ambos expresen cómo se sintieron y que Juan Pablo proponga una forma de reparar el dibujo dañado.", "Es una situación esporádica sin daño al cuerpo (situación tipo I), que se maneja con mediación pedagógica y una solución reparadora (Decreto 1965 de 2013, arts. 40 y 42), y desarrolla empatía al escuchar la emoción del otro (Guía 6).", true], ["B", "le pide a la compañera que en adelante incluya a Juan Pablo en el juego, para evitar que la situación se repita.", "Atiende una causa del conflicto, pero traslada la responsabilidad a la niña afectada y no aborda el daño que Juan Pablo causó.", false], ["C", "le explica que romper el dibujo estuvo mal y le impone como consecuencia quedarse sin el próximo recreo.", "Fija un límite claro, pero la sanción no repara el daño a la compañera ni desarrolla la empatía; el protocolo para este tipo de situaciones privilegia la mediación y la reparación.", false]]}, {"id": "CB-122", "niv": 3, "e": "Si al día siguiente Juan Pablo vuelve a empujar a la misma compañera y ella cae y se lastima la rodilla, sin requerir incapacidad, usted", "f": "Decreto 1965 de 2013, arts. 40 y 43.", "o": [["A", "deja a Juan Pablo sin recreo durante la semana, para que entienda que no puede volver a agredir a su compañera.", "Pone un límite, pero omite la atención a la niña, la información a las familias y el protocolo; además, una sanción aislada no forma al niño en el manejo de su rabia.", false], ["B", "reúne a los dos niños para que conversen sobre lo ocurrido y acuerden cómo reparar el daño, como hizo el día anterior.", "El diálogo reparador es valioso, pero al repetirse la agresión y haber daño físico ya no se trata de una situación tipo I; la mediación sola es insuficiente frente al protocolo que corresponde.", false], ["C", "procura atención inmediata para la niña, informa a ambas familias y activa el protocolo institucional de convivencia.", "La agresión es repetida y causa daño al cuerpo sin incapacidad, lo que corresponde a una situación tipo II (Decreto 1965 de 2013, art. 40). Su protocolo exige atención inmediata en salud, informar a las familias de los involucrados y seguir la ruta institucional con el comité de convivencia (art. 43).", true]]}]}, {"comp": "competencias_blandas", "rol": "docente", "tag": "Competencias blandas y ciudadanas · Inclusión y no discriminación", "texto": "Usted es docente de ciencias naturales de octavo en un colegio oficial. Sara, una estudiante con baja visión, se vinculó al grupo este año y cuenta con PIAR. Para el proyecto de investigación del periodo, los estudiantes formaron equipos libremente y Sara quedó sola. Algunos compañeros comentan que «con ella se demoran más» y uno de ellos dice, en tono de broma, que Sara «debería estar en un colegio especial». Sara le pide a usted que la deje hacer el trabajo de manera individual.", "items": [{"id": "CB-123", "niv": 1, "e": "Ante el comentario de que Sara «debería estar en un colegio especial», usted", "f": "MEN (2004). Estándares Básicos de Competencias Ciudadanas, Serie Guías n.º 6 (pluralidad, identidad y valoración de las diferencias); Decreto 1421 de 2017.", "o": [["A", "lo deja pasar en ese momento por tratarse de una broma y después habla en privado con el estudiante que lo hizo.", "Hablar en privado con el estudiante es útil, pero dejar pasar el comentario frente al grupo transmite que excluir a una compañera es aceptable si se dice en broma.", false], ["B", "interviene con serenidad, señala que el comentario excluye a una compañera y luego reflexiona sobre él con el grupo.", "Detener la expresión excluyente cuando ocurre, sin humillar a nadie, y convertirla en reflexión colectiva corresponde a la pluralidad y valoración de las diferencias (Guía 6). La educación inclusiva reconoce el derecho de todos a aprender juntos en el aula (Decreto 1421 de 2017).", true], ["C", "pide al estudiante que se disculpe públicamente con Sara y registra la situación en el observador del estudiante.", "Muestra que la conducta no es aceptable, pero la disculpa forzada y la anotación no generan comprensión y vuelven a poner a Sara en el centro de la atención del grupo.", false]]}, {"id": "CB-124", "niv": 2, "e": "Frente a la solicitud de Sara de trabajar sola, usted", "f": "Decreto 1421 de 2017; MEN (2004). Estándares Básicos de Competencias Ciudadanas, Serie Guías n.º 6 (pluralidad).", "o": [["A", "conversa con ella sobre sus razones y le propone un equipo con roles en el que aporte con los apoyos que necesita.", "Escuchar a la estudiante y ofrecerle condiciones reales de participación responde a la educación inclusiva: los ajustes y apoyos buscan eliminar barreras para aprender con los demás (Decreto 1421 de 2017).", true], ["B", "acepta su solicitud, porque respetar la decisión de la estudiante sobre su forma de trabajar es también una forma de inclusión.", "Respetar su voz es importante, pero aceptar sin conversar consolida la exclusión que originó la solicitud y le quita la oportunidad de aprender con sus compañeros.", false], ["C", "la asigna al equipo con mejores resultados del curso, que puede ayudarla a avanzar más rápido.", "Busca darle apoyo, pero la ubica como alguien que necesita ser ayudado y no como una integrante que aporta; además, la decisión no considera lo que ella expresa.", false]]}, {"id": "CB-125", "niv": 2, "e": "Para que Sara participe en igualdad de condiciones en el proyecto, el apoyo más coherente con la normativa de inclusión es", "f": "Decreto 1421 de 2017 (ajustes razonables, currículo flexible, PIAR).", "o": [["A", "reducir los objetivos del proyecto para Sara, aunque su PIAR no lo contempla, para que tenga menos exigencias.", "Parece una forma de apoyo, pero el PIAR de Sara no prevé ese ajuste y el currículo flexible mantiene los mismos objetivos generales y ofrece distintas oportunidades para alcanzarlos; la baja visión no exige rebajar el aprendizaje.", false], ["B", "ajustar los materiales, con letra ampliada o formatos digitales, según las barreras identificadas en su PIAR.", "Los ajustes razonables se basan en las barreras que enfrenta la estudiante y se registran en el PIAR, manteniendo los mismos objetivos de aprendizaje para todos (Decreto 1421 de 2017).", true], ["C", "esperar a que la familia presente un concepto médico actualizado antes de hacer cualquier ajuste en el aula.", "Contar con información médica puede ser útil, pero los ajustes razonables no dependen de un diagnóstico sino de las barreras identificadas; esperar retrasa el apoyo.", false]]}, {"id": "CB-126", "niv": 3, "e": "Para transformar la forma en que el grupo conforma los equipos durante el año, la estrategia más pertinente es", "f": "MEN (2004). Estándares Básicos de Competencias Ciudadanas, Serie Guías n.º 6 (pluralidad); Decreto 1421 de 2017 (diseño universal para el aprendizaje).", "o": [["A", "asignar los equipos por orden de lista durante el resto del año, para que nadie vuelva a quedar excluido.", "Es una medida práctica que evita la exclusión en la conformación, pero no garantiza que dentro del equipo todos participen ni promueve la valoración de los aportes de cada estudiante.", false], ["B", "permitir que sigan eligiendo sus equipos, con la regla de incluir a cualquier compañero que haya quedado solo.", "Evita que alguien quede aislado, pero convierte la inclusión en una obligación impuesta y señala a quienes quedan solos, sin cambiar la forma de valorar los aportes de cada uno.", false], ["C", "diseñar trabajos cooperativos con roles rotativos y metas comunes, en los que cada uno dependa del aporte de los demás.", "La interdependencia positiva hace que cada estudiante sea necesario para el logro común y favorece la valoración de las diferencias (Guía 6). Además, el diseño universal propone actividades pensadas para todos desde el inicio (Decreto 1421 de 2017).", true]]}]}, {"comp": "competencias_blandas", "rol": "docente", "tag": "Competencias blandas y ciudadanas · Habilidades socioemocionales en el aula", "texto": "A mitad de año llega a su grupo de quinto, en una escuela urbana de Florencia (Caquetá), Kevin, un niño de once años cuya familia fue desplazada por el conflicto armado desde una vereda. Kevin es retraído, se sobresalta con los ruidos fuertes y no ha estudiado en los últimos seis meses. La secretaría de la escuela le pide a usted apoyar el diligenciamiento del formato de caracterización, que registra su condición de víctima. Algunos compañeros le preguntan con insistencia «por qué se vino».", "items": [{"id": "CB-160", "niv": 1, "e": "Para favorecer la integración de Kevin en el grupo, usted", "f": "MEN (2004). Estándares Básicos de Competencias Ciudadanas, Serie Guías n.º 6 (pluralidad; convivencia y paz); Ley 1098 de 2006, art. 33.", "o": [["A", "le asigna un compañero de acogida y propone actividades en las que pueda aportar sus saberes sobre el campo.", "Reconocer los saberes del estudiante y apoyarse en pares favorece su sentido de pertenencia y la valoración de las diferencias (Guía 6), sin exponer su historia personal.", true], ["B", "lo presenta al grupo contando que su familia fue desplazada, para que los compañeros sean más comprensivos con él.", "Busca generar comprensión, pero expone sin su consentimiento un aspecto doloroso de su vida privada y puede estigmatizarlo (Ley 1098 de 2006, art. 33).", false], ["C", "le permite trabajar solo mientras se adapta, para no presionarlo a relacionarse con otros antes de tiempo.", "Respeta su ritmo, pero el aislamiento puede reforzar el retraimiento; la integración se favorece con apoyos graduales, no con la separación del grupo.", false]]}, {"id": "CB-161", "niv": 2, "e": "Frente a las preguntas insistentes de los compañeros sobre «por qué se vino», usted", "f": "MEN (2004). Estándares Básicos de Competencias Ciudadanas, Serie Guías n.º 6 (competencias cognitivas y emocionales); Ley 1098 de 2006, art. 33.", "o": [["A", "pide al grupo respetar lo que cada quien decide contar de su vida y ofrece a Kevin hablar en privado.", "Ponerse en el lugar del otro y respetar su intimidad son competencias ciudadanas cognitivas y emocionales (Guía 6); el niño tiene derecho a la protección de su vida privada (Ley 1098 de 2006, art. 33).", true], ["B", "prohíbe a los compañeros hablar con Kevin sobre su vida anterior, para protegerlo de recuerdos dolorosos.", "Busca protegerlo, pero una prohibición general puede aislarlo y convertir su historia en un tema vetado, en lugar de enseñar a respetar sus decisiones.", false], ["C", "invita a Kevin a contar su historia al grupo, para que sus compañeros entiendan lo que ha vivido.", "Quiere promover empatía, pero presiona al niño a revelar experiencias dolorosas en público, lo que puede afectarlo.", false]]}, {"id": "CB-162", "niv": 3, "e": "Sobre el formato de caracterización, usted", "f": "Ley 1581 de 2012, art. 4; Decreto 1377 de 2013, art. 12.", "o": [["A", "lo diligencia con la familia en la reunión general de padres, para aprovechar que todos están presentes.", "Es práctico, pero expone la condición de víctima de la familia ante otras personas y desconoce la confidencialidad de esa información.", false], ["B", "ayuda a diligenciarlo con la familia en privado y lo entrega por el conducto establecido, sin divulgar su contenido.", "El tratamiento de datos de un niño es válido cuando responde a su interés superior y a una finalidad legítima, como garantizar su atención (Decreto 1377 de 2013, art. 12), y exige confidencialidad y seguridad (Ley 1581 de 2012, art. 4).", true], ["C", "se niega a diligenciarlo, porque la condición de víctima es información privada que no debe quedar en un registro escolar.", "Proteger la información es correcto, pero negarse impide que la institución conozca la situación y garantice la atención a la que el niño tiene derecho; lo que se exige es reserva, no omitir el registro.", false]]}, {"id": "CB-163", "niv": 3, "e": "Dado que Kevin no estudió en los últimos seis meses, la respuesta pedagógica más pertinente es", "f": "Decreto 1290 de 2009, art. 3.", "o": [["A", "ubicarlo en un grado inferior para que recupere los contenidos perdidos, sin la presión de seguir el ritmo del grupo.", "Busca reducir la presión, pero decide un retroceso sin valorar lo que el niño sabe y lo separa de su grupo de edad, con riesgo de afectar su autoestima.", false], ["B", "exigirle los mismos trabajos del periodo que a sus compañeros, para no hacer diferencias que lo estigmaticen.", "Evitar el estigma es válido, pero tratar igual situaciones desiguales desconoce que el niño necesita estrategias de apoyo para avanzar.", false], ["C", "valorar sus aprendizajes actuales y diseñar con él un plan de nivelación flexible, articulado con apoyo psicosocial.", "La evaluación debe identificar características, ritmos y estilos de aprendizaje y aplicar estrategias pedagógicas de apoyo (Decreto 1290 de 2009, art. 3). El componente psicosocial atiende el impacto emocional del desplazamiento.", true]]}]}, {"comp": "competencias_blandas", "rol": "docente", "tag": "Competencias blandas y ciudadanas · Inclusión y no discriminación", "texto": "Usted es docente de tecnología e informática de octavo en un colegio oficial de Medellín. Al club de robótica se inscribieron 18 niños y 2 niñas. Una de ellas se retiró porque sus compañeros no la dejaban manipular los kits y le decían que «se encargara de las presentaciones». En la sala de profesores, un colega comenta que «a las niñas simplemente no les interesa la tecnología».", "items": [{"id": "CB-164", "niv": 1, "e": "Frente a lo ocurrido con la estudiante que se retiró del club, usted", "f": "MEN (2004). Estándares Básicos de Competencias Ciudadanas, Serie Guías n.º 6 (pluralidad, identidad y valoración de las diferencias); Función Pública (2017). Código de Integridad del Servicio Público (justicia).", "o": [["A", "conversa con ella sobre su experiencia y la invita a volver con roles rotativos que aseguren su participación.", "Escuchar a la estudiante y transformar la organización del club atiende la causa de su retiro y garantiza igualdad en la participación (Guía 6, pluralidad; Código de Integridad, justicia).", true], ["B", "respeta su decisión de retirarse, porque obligarla a volver podría generarle más incomodidad con el grupo.", "Respetar su decisión es importante, pero aceptarla sin conversar deja intacta la exclusión que la llevó a retirarse.", false], ["C", "la invita a regresar como encargada de diseño y presentaciones del club, ya que en ese rol puede destacarse.", "Busca que vuelva con un rol valorado, pero reproduce el mismo estereotipo que la excluyó de la parte técnica del club.", false]]}, {"id": "CB-165", "niv": 2, "e": "Ante el comentario del colega sobre el interés de las niñas, usted", "f": "Función Pública (2017). Código de Integridad del Servicio Público (respeto); MEN (2008). Guía 31, Anexo 1: Glosario de competencias (comunicación y relaciones interpersonales).", "o": [["A", "evita discutir el tema, porque se trata de una opinión personal del colega y no de una decisión institucional.", "Evita un conflicto entre colegas, pero deja sin cuestionar un prejuicio que influye en la forma en que se orienta a las estudiantes.", false], ["B", "le comenta que la baja inscripción puede deberse a estereotipos y le propone revisar juntos cómo convocar el club.", "El valor de respeto del Código de Integridad excluye las decisiones basadas en estereotipos o prejuicios. Expresar el desacuerdo con argumentos y proponer una acción conjunta es asertivo y fortalece el trabajo en equipo (Guía 31).", true], ["C", "le responde que su comentario es discriminatorio y que lo informará a la coordinación para que tome medidas.", "Señala el problema, pero escalar de inmediato cierra el diálogo y no ayuda al colega a revisar su idea ni a cambiar la convocatoria del club.", false]]}, {"id": "CB-166", "niv": 3, "e": "Para aumentar la participación de las niñas en el club sin generar nuevas exclusiones, la estrategia más adecuada es", "f": "MEN (2004). Estándares Básicos de Competencias Ciudadanas, Serie Guías n.º 6 (pluralidad, identidad y valoración de las diferencias).", "o": [["A", "abrir el club solo a quienes tengan un buen desempeño en tecnología, para que la selección sea objetiva.", "Parece un criterio neutral, pero ignora que las diferencias de desempeño pueden reflejar oportunidades previas desiguales y puede reducir aún más la participación de las niñas.", false], ["B", "asignar a las niñas los roles de liderazgo del club, para compensar la exclusión que han vivido en él hasta ahora.", "Busca compensar, pero fija nuevamente roles según el sexo y puede generar rechazo, sin garantizar que todos accedan a todas las tareas.", false], ["C", "convocar con ejemplos diversos de personas en tecnología y organizar el trabajo con roles rotativos para todos.", "Ampliar los referentes y garantizar que todos roten por las tareas técnicas atiende la causa del problema, los estereotipos y la distribución de roles, sin excluir a nadie (Guía 6, pluralidad).", true]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Evaluación del aprendizaje (Decreto 1290 de 2009)", "texto": "En una institución educativa, el sistema institucional de evaluación de los estudiantes (SIEE) usa una escala de 1,0 a 5,0, con valoraciones expresadas con un decimal, con esta equivalencia: 4,6 a 5,0 desempeño superior; 4,0 a 4,5 desempeño alto; 3,0 a 3,9 desempeño básico; 1,0 a 2,9 desempeño bajo. En la quinta semana del primer período, los padres de un estudiante de tercer grado le piden a usted, su docente, que el niño sea promovido a cuarto, porque lee y resuelve problemas con mucha más soltura que sus compañeros. Sus valoraciones parciales en todas las áreas están entre 4,7 y 5,0.", "items": [{"id": "EV-001", "niv": 1, "e": "Para tramitar la solicitud de promoción anticipada, el procedimiento que corresponde es que", "f": "Decreto 1290 de 2009, artículo 7 (compilado en el Decreto 1075 de 2015).", "o": [["A", "el consejo académico la decida en su próxima sesión y el rector la registre en el sistema de matrícula.", "El consejo académico solo recomienda; quien decide es el consejo directivo, y la decisión se consigna en su acta y, si es positiva, en el registro escolar.", false], ["B", "el consejo académico, con consentimiento de los padres, la recomiende y el consejo directivo decida.", "Según el artículo 7 del Decreto 1290 de 2009, durante el primer período el consejo académico, previo consentimiento de los padres, recomienda la promoción anticipada ante el consejo directivo; la decisión se consigna en el acta del consejo directivo.", true], ["C", "el docente de grado la apruebe directamente, porque es quien conoce mejor el desempeño del estudiante.", "El docente aporta evidencia del desempeño, pero la norma no le da la facultad de decidir: la recomienda el consejo académico y la decide el consejo directivo.", false]]}, {"id": "EV-002", "niv": 1, "e": "Si los padres hubieran presentado la solicitud en el tercer período, lo adecuado sería explicarles que", "f": "Decreto 1290 de 2009, artículo 7.", "o": [["A", "la solicitud debe presentarse ante la secretaría de educación, que es la competente después del primer período.", "La norma no traslada la competencia a la secretaría de educación; simplemente fija el primer período del año escolar como el momento para la promoción anticipada.", false], ["B", "la promoción puede tramitarse en cualquier período si el estudiante mantiene desempeño superior.", "El desempeño superior es requisito, pero no habilita el trámite en cualquier momento: la norma lo ubica durante el primer período.", false], ["C", "la norma prevé la promoción anticipada durante el primer período del año escolar.", "El artículo 7 del Decreto 1290 de 2009 establece que la promoción anticipada se tramita «durante el primer período del año escolar».", true]]}, {"id": "EV-003", "niv": 2, "e": "Otro estudiante del grupo obtiene 3,5 en matemáticas. En el informe a los padres, usted debe expresar que, en la escala nacional, su desempeño es", "f": "Decreto 1290 de 2009, artículos 4 (numeral 2) y 5.", "o": [["A", "básico, lo que indica que superó los desempeños necesarios en el área.", "Con la equivalencia del SIEE, 3,5 está en el rango básico. El artículo 5 del Decreto 1290 de 2009 define el desempeño básico como la superación de los desempeños necesarios en relación con las áreas obligatorias y fundamentales.", true], ["B", "bajo, porque no alcanza el 4,0 que marca el inicio del desempeño alto.", "El desempeño bajo corresponde a la no superación de los desempeños necesarios. En la escala del caso, 3,5 está dentro del rango de 3,0 a 3,9, equivalente a básico.", false], ["C", "básico, lo que indica que debe presentar actividades de recuperación para aprobar.", "El nivel es básico, pero la interpretación es errónea: según la norma, básico significa que el estudiante superó los desempeños necesarios, no que tenga el área pendiente.", false]]}, {"id": "EV-004", "niv": 1, "e": "Si al final del año la comisión de evaluación determina que un estudiante no puede ser promovido al grado siguiente, la institución debe", "f": "Decreto 1290 de 2009, artículo 6.", "o": [["A", "reservarle el cupo solo si la familia firma un compromiso académico.", "La norma no condiciona el cupo a un compromiso; dice que se debe garantizar «en todos los casos».", false], ["B", "recomendar a la familia trasladarlo a otra institución para que repita el grado.", "Contradice la norma: el establecimiento debe garantizar el cupo para que el estudiante continúe su proceso formativo en la misma institución.", false], ["C", "garantizarle en todos los casos el cupo para que continúe con su proceso formativo.", "El artículo 6 del Decreto 1290 de 2009 establece que, cuando un estudiante no puede ser promovido, el establecimiento debe garantizarle en todos los casos el cupo para que continúe con su proceso formativo.", true]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Gobierno escolar y PEI (Ley 115 de 1994)", "texto": "Usted fue elegido como uno de los representantes de los docentes ante el consejo directivo de una institución educativa oficial. En la primera sesión del año se discuten tres temas: una propuesta para ajustar el plan de estudios de la media técnica, los criterios para asignar 15 cupos disponibles en grado sexto y la reclamación de una familia que considera injusta la sanción impuesta a su hija por un docente.", "items": [{"id": "GE-001", "niv": 2, "e": "Sobre la propuesta de ajuste al plan de estudios, lo que corresponde es que", "f": "Ley 115 de 1994, artículos 144 (literal g) y 145.", "o": [["A", "el consejo directivo la apruebe directamente, porque es la máxima instancia del gobierno escolar.", "Aunque el consejo directivo es la instancia superior de decisión, la ley asigna expresamente al consejo académico el estudio y la organización del plan de estudios.", false], ["B", "el consejo académico la estudie y organice, y el consejo directivo participe en su evaluación dentro del PEI.", "La Ley 115 asigna al consejo académico el estudio, modificación y ajustes al currículo y la organización del plan de estudios (art. 145), y al consejo directivo participar en la planeación y evaluación del PEI, del currículo y del plan de estudios (art. 144, literal g).", true], ["C", "la secretaría de educación la apruebe primero, antes de que la estudie cualquier órgano del gobierno escolar.", "La secretaría verifica el cumplimiento de requisitos después de que la institución elabora y somete el plan; no es la primera instancia de estudio.", false]]}, {"id": "GE-002", "niv": 1, "e": "Sobre los criterios para asignar los 15 cupos disponibles, la ley establece que corresponde", "f": "Ley 115 de 1994, artículo 144, literal d.", "o": [["A", "al consejo directivo fijarlos, como una de sus funciones legales.", "El artículo 144, literal d, de la Ley 115 de 1994 establece como función del consejo directivo fijar los criterios para la asignación de cupos disponibles.", true], ["B", "al consejo académico fijarlos, porque se trata de un asunto del grado sexto.", "El consejo académico se ocupa del currículo, el plan de estudios y la evaluación; la asignación de cupos es función del consejo directivo.", false], ["C", "al rector fijarlos, porque es el responsable de la matrícula en la institución.", "El rector dirige los procesos administrativos, pero la Ley 115 asigna expresamente al consejo directivo fijar los criterios para la asignación de cupos (art. 144, literal d).", false]]}, {"id": "GE-003", "niv": 2, "e": "Respecto a la reclamación de la familia por la sanción impuesta por el docente, el consejo directivo", "f": "Ley 115 de 1994, artículo 144, literal b.", "o": [["A", "debe abstenerse, porque las sanciones disciplinarias solo las revisa el comité escolar de convivencia.", "El comité de convivencia tiene funciones en situaciones que afectan la convivencia, pero la Ley 115 asigna al consejo directivo servir de instancia para resolver conflictos entre docentes y alumnos (art. 144, literal b).", false], ["B", "puede servir de instancia para resolverla, ya que es un conflicto entre un docente y una alumna.", "El artículo 144, literal b, de la Ley 115 de 1994 establece como función del consejo directivo servir de instancia para resolver los conflictos que se presenten entre docentes y administrativos con los alumnos.", true], ["C", "debe remitirla a la secretaría de educación, porque involucra a un docente nombrado en propiedad.", "No se trata de una falta disciplinaria del docente sino de un desacuerdo con una sanción a una estudiante; la instancia institucional es el consejo directivo.", false]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Currículo, plan de estudios y autonomía escolar (Ley 115 de 1994, arts. 23 y 77 a 79)", "texto": "En una institución oficial de secundaria de Pereira, el consejo académico estudia una propuesta para el próximo año: crear la asignatura «Emprendimiento y finanzas» dentro del área de tecnología e informática, reducir la intensidad de educación artística para liberar horas y destinar más del 25 % del tiempo del plan de estudios a asignaturas optativas. Usted representa el área de matemáticas en el consejo y debe argumentar, con base en la ley, qué cambios son viables y qué trámite deben seguir.", "items": [{"id": "NR-117", "niv": 1, "e": "Al revisar la propuesta, usted recuerda que los grupos de áreas obligatorias y fundamentales deben comprender", "f": "Ley 115 de 1994, artículos 23 y 79.", "o": [["A", "como mínimo el 60 % del plan de estudios, por lo que la propuesta cabe holgadamente dentro de la norma.", "El porcentaje legal es 80 %, no 60 %. Con el 60 % la propuesta parecería viable, pero la ley exige más tiempo para las áreas obligatorias y fundamentales.", false], ["B", "la totalidad del plan de estudios, por lo que no es posible incluir asignaturas optativas.", "El artículo 79 define el plan de estudios como esquema de áreas obligatorias y fundamentales y de áreas optativas; el 80 % es un mínimo, de modo que sí hay espacio para una parte optativa.", false], ["C", "como mínimo el 80 % del plan de estudios, lo que limita el tiempo disponible para optativas.", "El artículo 23 de la Ley 115 establece que las áreas obligatorias y fundamentales comprenderán un mínimo del 80 % del plan de estudios. Destinar más del 25 % a optativas dejaría menos del 75 % para esas áreas, por debajo del mínimo.", true]]}, {"id": "NR-118", "niv": 2, "e": "Respecto de crear la asignatura de emprendimiento, usted argumenta que la institución", "f": "Ley 115 de 1994, artículos 23, 77 y 78.", "o": [["A", "puede introducir asignaturas optativas dentro de las áreas establecidas, en el marco de la ley y del PEI.", "El artículo 77 de la Ley 115 reconoce autonomía para organizar las áreas fundamentales, introducir asignaturas optativas dentro de las áreas establecidas en la ley y adaptar algunas áreas a las necesidades regionales, dentro de los límites de la ley, del PEI y de los lineamientos del Ministerio.", true], ["B", "requiere autorización previa del Ministerio de Educación para cualquier asignatura que no esté prevista en la ley.", "La creación de asignaturas optativas hace parte de la autonomía escolar del artículo 77; no exige autorización previa del Ministerio, que diseña lineamientos generales (artículo 78).", false], ["C", "puede reemplazar con ella el área de educación artística, si el consejo directivo lo aprueba.", "La educación artística es un área obligatoria y fundamental (artículo 23, numeral 3); la autonomía permite organizarla, no sustituirla por una asignatura optativa.", false]]}, {"id": "NR-119", "niv": 3, "e": "Si finalmente el consejo directivo adopta cambios significativos en el currículo, la Ley 115 de 1994 dispone que el rector", "f": "Ley 115 de 1994, artículos 77 y 78.", "o": [["A", "los envíe al Ministerio de Educación Nacional para que los apruebe mediante resolución antes de aplicarlos.", "La ley no prevé una aprobación ministerial previa del currículo de cada institución: el Ministerio diseña lineamientos generales y la verificación la hace la secretaría de educación.", false], ["B", "los presente a la secretaría de educación para que verifique el cumplimiento de los requisitos legales.", "El inciso tercero del artículo 78 establece que, cuando haya cambios significativos en el currículo, el rector de la institución oficial o privada lo presentará a la secretaría de educación departamental o distrital, o al organismo que haga sus veces, para que verifique el cumplimiento de los requisitos de ley.", true], ["C", "los aplique de inmediato sin informar a ninguna autoridad, en virtud de la autonomía escolar.", "La autonomía del artículo 77 opera dentro de los límites de la ley; el artículo 78 exige presentar los cambios significativos a la secretaría de educación para su verificación.", false]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Gobierno escolar (Ley 115 de 1994, arts. 142 a 145; Decreto 1860 de 1994, arts. 20 a 23)", "texto": "Es la segunda semana de clases en una institución oficial de Neiva que ofrece preescolar, básica y media. El rector convoca a la asamblea de docentes para elegir a sus representantes ante el consejo directivo y para designar a los docentes que integrarán el consejo académico. Usted, recién trasladado desde otro departamento, pregunta cuáles son los órganos del gobierno escolar, cuántos representantes deben elegir los docentes, en qué plazo debe quedar integrado el consejo directivo y qué funciones tiene cada órgano.", "items": [{"id": "NR-130", "niv": 1, "e": "Según la Ley 115 de 1994, el gobierno escolar de un establecimiento educativo del Estado está conformado por", "f": "Ley 115 de 1994, artículos 94 y 142.", "o": [["A", "el consejo directivo, el consejo académico y el consejo de padres.", "El consejo de padres es una instancia de participación de las familias, no un órgano del gobierno escolar; además, el artículo 142 incluye al rector.", false], ["B", "el rector, el consejo directivo y el personero de los estudiantes.", "El personero es una figura de participación estudiantil (artículo 94), pero no es un órgano del gobierno escolar.", false], ["C", "el rector, el consejo directivo y el consejo académico.", "El artículo 142 de la Ley 115 de 1994 establece que cada establecimiento educativo del Estado tendrá un gobierno escolar conformado por el rector, el consejo directivo y el consejo académico.", true]]}, {"id": "NR-131", "niv": 1, "e": "En la asamblea, los docentes deben elegir", "f": "Ley 115 de 1994, artículos 143 y 145; Decreto 1860 de 1994, artículo 21.", "o": [["A", "dos representantes al consejo directivo, por mayoría de los votantes de la asamblea.", "El artículo 143 de la Ley 115 y el numeral 2 del artículo 21 del Decreto 1860 de 1994 establecen que el consejo directivo tiene dos representantes del personal docente, elegidos por mayoría de los votantes en una asamblea de docentes.", true], ["B", "un representante por cada área al consejo directivo, propuesto por los jefes de área.", "Confunde el consejo directivo con el consejo académico, en el que sí hay un docente por cada área o grado (Ley 115, artículo 145).", false], ["C", "un representante por cada sede y jornada al consejo directivo, elegido en cada una de ellas.", "La ley fija dos representantes de los docentes en el consejo directivo, sin importar el número de sedes o jornadas.", false]]}, {"id": "NR-132", "niv": 3, "e": "De acuerdo con el Decreto 1860 de 1994, el consejo directivo debe quedar integrado y en ejercicio de sus funciones dentro de", "f": "Decreto 1860 de 1994, artículos 21 (parágrafo 2), 28 y 29.", "o": [["A", "los sesenta días calendario siguientes a la iniciación de clases del período lectivo.", "El parágrafo 2 del artículo 21 del Decreto 1860 de 1994 establece que, dentro de los primeros sesenta días calendario siguientes al de la iniciación de clases de cada período lectivo anual, deberá quedar integrado el consejo directivo y entrar en ejercicio de sus funciones.", true], ["B", "las cuatro primeras semanas del calendario académico, contadas desde la iniciación de clases del período lectivo.", "Las cuatro primeras semanas son el plazo para convocar las asambleas por grado que eligen a los voceros del consejo de estudiantes (artículo 29).", false], ["C", "los treinta días calendario siguientes a la iniciación de clases del período lectivo.", "Treinta días calendario es el plazo para elegir al personero de los estudiantes (Decreto 1860, artículo 28), no para integrar el consejo directivo.", false]]}, {"id": "NR-133", "niv": 2, "e": "Una vez instalados los órganos, la función de fijar los criterios para asignar los cupos disponibles a estudiantes nuevos corresponde a", "f": "Ley 115 de 1994, artículos 144 y 145; Decreto 1860 de 1994, artículos 20 y 23.", "o": [["A", "el consejo académico, como instancia superior de orientación pedagógica de todo el establecimiento educativo.", "El consejo académico se ocupa del currículo, el plan de estudios y la evaluación institucional (Ley 115, artículo 145); fijar criterios de cupos es función del consejo directivo.", false], ["B", "el consejo directivo, como instancia de orientación académica y administrativa del establecimiento.", "El literal d) del artículo 144 de la Ley 115 y el literal d) del artículo 23 del Decreto 1860 asignan al consejo directivo la función de fijar los criterios para la asignación de cupos disponibles; el artículo 20 del mismo decreto lo define como instancia directiva y de orientación académica y administrativa.", true], ["C", "el rector, como representante del establecimiento ante las autoridades educativas.", "El rector preside el consejo directivo y ejecuta las decisiones del gobierno escolar, pero la ley atribuye la fijación de criterios de cupos al consejo directivo como órgano colegiado.", false]]}
