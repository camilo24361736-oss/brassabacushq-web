ales.", false]]}]}, {"comp": "razonamiento_cuantitativo", "rol": "docente", "tag": "Razonamiento cuantitativo", "texto": "Usted analiza los resultados de una prueba diagnóstica de matemáticas aplicada a sus dos grupos de noveno. En 9A, 30 estudiantes presentaron la prueba y obtuvieron un promedio de 62 puntos. En 9B, 20 estudiantes la presentaron y obtuvieron un promedio de 72 puntos. El puntaje máximo de la prueba es 100. Al revisar las hojas de respuesta, usted descubre que en 9A una pregunta de 5 puntos fue mal calificada a todos los estudiantes: nadie la tenía bien y debía otorgarse a 12 de ellos.", "items": [{"id": "RC-005", "niv": 2, "e": "Antes de corregir el error, el promedio de los 50 estudiantes de noveno es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: estadística descriptiva, promedio ponderado.", "o": [["A", "64 puntos.", "No corresponde a ningún cálculo válido con los datos; resulta, por ejemplo, de dar a 9B un peso menor del que tiene. El promedio ponderado correcto es (30 × 62 + 20 × 72) ÷ 50 = 66.", false], ["B", "66 puntos.", "Como los grupos tienen tamaños distintos, se usa el promedio ponderado: (30 × 62 + 20 × 72) ÷ 50 = (1.860 + 1.440) ÷ 50 = 3.300 ÷ 50 = 66 puntos.", true], ["C", "67 puntos.", "Resulta de promediar los dos promedios ((62 + 72) ÷ 2 = 67) sin tener en cuenta que 9A tiene más estudiantes que 9B, error frecuente al combinar promedios de grupos de distinto tamaño.", false]]}, {"id": "RC-006", "niv": 2, "e": "Después de otorgar los 5 puntos a los 12 estudiantes de 9A, el nuevo promedio de ese grupo es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo: efecto de cambios en los datos sobre el promedio.", "o": [["A", "62 puntos.", "Supone que el promedio no cambia. Al sumar 12 × 5 = 60 puntos al total del grupo, el promedio aumenta 60 ÷ 30 = 2 puntos.", false], ["B", "64 puntos.", "El total de 9A era 30 × 62 = 1.860. Se suman 12 × 5 = 60 puntos: 1.920. El nuevo promedio es 1.920 ÷ 30 = 64 puntos.", true], ["C", "67 puntos.", "Resulta de sumar los 5 puntos al promedio como si todos los estudiantes los hubieran recibido. Solo 12 de 30 los reciben, por lo que el aumento es de 2 puntos.", false]]}, {"id": "RC-007", "niv": 3, "e": "Con los puntajes corregidos, al comparar los dos grupos en el consejo académico usted afirma correctamente que", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo: diferencias absolutas y relativas; interpretación de porcentajes.", "o": [["A", "9B supera a 9A en 8 puntos de promedio, es decir, en el 8 % del puntaje máximo de la prueba.", "Con la corrección, 9A queda en 64 y 9B en 72: la diferencia es 8 puntos. Como el puntaje máximo es 100, 8 puntos equivalen al 8 % de ese máximo.", true], ["B", "9B supera a 9A en 10 puntos de promedio, porque la corrección afecta a solo 12 estudiantes.", "Usa el promedio de 9A sin corregir (62). La corrección sí cambia el promedio del grupo completo, que pasa a 64, así que la diferencia es 8 puntos.", false], ["C", "9B supera a 9A en un 8 %, porque su promedio es 8 puntos mayor que el de 9A.", "Confunde diferencia absoluta con diferencia relativa: 72 es 12,5 % mayor que 64 (8 ÷ 64). Los 8 puntos equivalen al 8 % del puntaje máximo, no a un 8 % más que 9A.", false]]}]}, {"comp": "razonamiento_cuantitativo", "rol": "docente", "tag": "Razonamiento cuantitativo", "texto": "La institución quiere organizar la jornada deportiva del viernes. Hay 4 grados participantes con 36, 48, 60 y 72 estudiantes, respectivamente. El coordinador le pide a usted formar equipos del mayor tamaño posible, de modo que todos los equipos tengan el mismo número de estudiantes y cada equipo esté formado solo por estudiantes de un mismo grado, sin que sobre nadie. La cancha estará disponible de 7:00 a. m. a 12:25 p. m., cada partido dura 25 minutos y entre un partido y el siguiente se dejan 5 minutos para cambiar de equipos; después del último partido no se requiere cambio.", "items": [{"id": "RC-008", "niv": 1, "e": "Para cumplir la solicitud del coordinador, cada equipo debe tener", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo: divisibilidad y máximo común divisor en situaciones de reparto.", "o": [["A", "6 estudiantes.", "6 divide a las cuatro cantidades, pero no es el mayor tamaño posible: 12 también las divide a todas.", false], ["B", "12 estudiantes.", "El mayor número que divide exactamente a 36, 48, 60 y 72 es su máximo común divisor: 12. Así, ningún estudiante sobra y los equipos tienen el mayor tamaño posible.", true], ["C", "18 estudiantes.", "18 divide a 36 y a 72, pero no a 48 ni a 60 (48 ÷ 18 y 60 ÷ 18 no son exactos), por lo que sobrarían estudiantes.", false]]}, {"id": "RC-009", "niv": 1, "e": "Con equipos de ese tamaño, el número total de equipos que se forman es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo: operaciones con números naturales en contexto.", "o": [["A", "12 equipos.", "Confunde el número de estudiantes por equipo (12) con el número de equipos. Con 216 estudiantes en equipos de 12 se forman 216 ÷ 12 = 18 equipos.", false], ["B", "18 equipos.", "Por grado se forman 36 ÷ 12 = 3, 48 ÷ 12 = 4, 60 ÷ 12 = 5 y 72 ÷ 12 = 6 equipos: 3 + 4 + 5 + 6 = 18. Equivalentemente, 216 estudiantes ÷ 12 = 18.", true], ["C", "36 equipos.", "Resulta de formar equipos de 6 estudiantes (216 ÷ 6 = 36). El tamaño solicitado era el mayor posible, es decir, 12.", false]]}, {"id": "RC-010", "niv": 3, "e": "Teniendo en cuenta el horario de la cancha, el número máximo de partidos completos que pueden programarse es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo: modelación de situaciones con tiempos y validación de soluciones.", "o": [["A", "10 partidos.", "Resulta de dividir 325 entre 30 (10,8) y truncar, suponiendo que también después del último partido se necesitan 5 minutos de cambio. Al último partido no le sigue ningún cambio, así que cabe uno más.", false], ["B", "11 partidos.", "De 7:00 a. m. a 12:25 p. m. hay 325 minutos. Diez partidos con su cambio ocupan 10 × 30 = 300 minutos y quedan 25, justo lo que dura un undécimo partido, que ya no necesita cambio. Doce partidos requerirían 11 × 30 + 25 = 355 minutos.", true], ["C", "13 partidos.", "Resulta de dividir 325 entre 25 sin contar los 5 minutos de cambio entre partidos.", false]]}]}, {"comp": "razonamiento_cuantitativo", "rol": "docente", "tag": "Razonamiento cuantitativo", "texto": "Usted es el docente delegado para el Programa de Alimentación Escolar (PAE) en una institución rural con tres sedes de primaria. Los estudiantes inscritos en el PAE son 96 en la sede principal, 132 en la sede El Placer y 72 en la sede La Unión. Cada ración servida lleva 60 gramos de arroz crudo y se sirve una ración diaria a cada estudiante inscrito en cada día de clase. Las clases son de lunes a viernes (5 días por semana). El arroz se compra en bultos de 25 kilogramos y no se pueden pedir fracciones de bulto.", "items": [{"id": "RC-101", "niv": 1, "e": "La cantidad de arroz crudo que se consume en una semana de clases en las tres sedes es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: conversión de unidades de masa y operaciones con números naturales.", "o": [["A", "90 kilogramos.", "Hay 96 + 132 + 72 = 300 estudiantes. En una semana se consumen 300 × 60 × 5 = 90.000 gramos, y como 1 kilogramo tiene 1.000 gramos, equivalen a 90 kilogramos.", true], ["B", "900 kilogramos.", "Proviene de un error de conversión de unidades: divide 90.000 gramos entre 100 en lugar de dividir entre 1.000, que es la equivalencia correcta entre gramos y kilogramos.", false], ["C", "90.000 kilogramos.", "Calcula bien la cantidad en gramos (300 × 60 × 5 = 90.000 g), pero la reporta en kilogramos sin hacer la conversión; 90.000 g equivalen a 90 kg.", false]]}, {"id": "RC-102", "niv": 2, "e": "Para un periodo de 4 semanas completas de clase, el número mínimo de bultos de arroz que usted debe solicitar es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: interpretación del cociente en contexto (redondeo por exceso).", "o": [["A", "14 bultos.", "Resulta de truncar el cociente 360 ÷ 25 = 14,4. Con 14 bultos solo se tendrían 350 kilogramos y faltarían 10 kilogramos, por lo que el cociente debe redondearse por exceso.", false], ["B", "15 bultos.", "En 4 semanas hay 20 días de clase: 300 × 60 × 20 = 360.000 g = 360 kg. Como 360 ÷ 25 = 14,4 y no se compran fracciones de bulto, se necesitan 15 bultos (375 kg).", true], ["C", "21 bultos.", "Cuenta 28 días calendario (4 × 7) en lugar de 20 días de clase: 300 × 60 × 28 = 504 kg y 504 ÷ 25 = 20,16, que redondea a 21. El caso indica que solo se sirve en días de clase.", false]]}, {"id": "RC-103", "niv": 2, "e": "Para repartir el arroz de un periodo entre las tres sedes de manera proporcional al número de estudiantes inscritos, el procedimiento adecuado es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: proporcionalidad directa y reparto proporcional.", "o": [["A", "multiplicar la cantidad total de arroz por la razón entre los estudiantes de cada sede y los de la sede más grande (96/132, 132/132 y 72/132).", "Usa una base equivocada: compara cada sede con la más grande y no con el total. Las razones suman 300/132 ≈ 2,27, de modo que se repartiría más del doble del arroz disponible.", false], ["B", "dividir la cantidad total de arroz en tres partes iguales y entregar una parte a cada sede.", "Este reparto es equitativo pero no proporcional: daría a La Unión (72 estudiantes) lo mismo que a El Placer (132 estudiantes), aunque esta última consume casi el doble.", false], ["C", "multiplicar la cantidad total de arroz por la fracción de estudiantes de cada sede, es decir, por 96/300, 132/300 y 72/300.", "En un reparto directamente proporcional cada parte se obtiene multiplicando el total por la razón entre el valor de cada sede y la suma de todos los valores (300). Las tres fracciones suman 1, así que se reparte exactamente el total.", true]]}, {"id": "RC-104", "niv": 3, "e": "Si la entidad territorial amplía en 25 % el número de inscritos solo en la sede La Unión, el nuevo consumo semanal de arroz en las tres sedes es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: porcentajes aplicados a una parte del total.", "o": [["A", "27 kilogramos.", "Corresponde únicamente al nuevo consumo de La Unión (90 estudiantes × 60 g × 5 días = 27 kg); olvida sumar el consumo de las otras dos sedes, que no cambia.", false], ["B", "95,4 kilogramos.", "El 25 % de 72 es 18, así que La Unión pasa a 90 estudiantes y el total a 318. El consumo semanal es 318 × 60 × 5 = 95.400 g = 95,4 kg.", true], ["C", "112,5 kilogramos.", "Aplica el aumento del 25 % al consumo de las tres sedes (90 × 1,25 = 112,5 kg), cuando la ampliación solo afecta a La Unión, que representa una parte del total.", false]]}]}, {"comp": "razonamiento_cuantitativo", "rol": "directivo", "tag": "Razonamiento cuantitativo", "texto": "Usted es el rector de una institución urbana y presenta al consejo directivo la distribución del presupuesto de $48.000.000 del Fondo de Servicios Educativos destinado a inversión. La propuesta asigna el 35 % a mantenimiento de la planta física, el 25 % a material didáctico y 1/5 del presupuesto a tecnología; el dinero restante se destina a proyectos pedagógicos transversales. Todos los porcentajes y fracciones se calculan sobre el presupuesto total de $48.000.000.", "items": [{"id": "RC-105", "niv": 1, "e": "El valor que la propuesta asigna a mantenimiento de la planta física es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: porcentajes de una cantidad.", "o": [["A", "$1.680.000.", "Corre la coma decimal un lugar de más: equivale a calcular el 3,5 % del presupuesto y no el 35 %.", false], ["B", "$16.800.000.", "El 35 % de $48.000.000 es 48.000.000 × 0,35 = $16.800.000.", true], ["C", "$31.200.000.", "Es el 65 % del presupuesto, es decir, lo que queda después de restar el 35 % de mantenimiento; confunde la parte asignada con el complemento.", false]]}, {"id": "RC-106", "niv": 2, "e": "El valor que queda para proyectos pedagógicos transversales es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: equivalencia entre fracciones y porcentajes.", "o": [["A", "$9.600.000.", "1/5 equivale al 20 %. Las asignaciones suman 35 % + 25 % + 20 % = 80 %, y el 20 % restante de $48.000.000 es $9.600.000.", true], ["B", "$15.360.000.", "Calcula 1/5 sobre el saldo que queda después de los porcentajes (1/5 de $19.200.000) y no sobre el total, como indica el caso; así resta solo $3.840.000 para tecnología.", false], ["C", "$16.800.000.", "Interpreta la fracción 1/5 como 5 %. En realidad 1/5 = 0,2 = 20 %, por lo que tecnología recibe $9.600.000 y no $2.400.000.", false]]}, {"id": "RC-107", "niv": 3, "e": "Si a mitad de año se recorta el 20 % del rubro de material didáctico y ese dinero se suma al de tecnología, este último pasa a representar, del presupuesto total, el", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: porcentaje de un porcentaje y cambio de base.", "o": [["A", "24 %.", "Aumenta en 20 % el rubro de tecnología ($9.600.000 × 1,2 = $11.520.000, que es el 24 %). El recorte es el 20 % de material didáctico ($2.400.000), no el 20 % de tecnología.", false], ["B", "25 %.", "Material didáctico tiene $12.000.000 y su 20 % es $2.400.000. Tecnología pasa de $9.600.000 a $12.000.000, que es 12.000.000 ÷ 48.000.000 = 0,25, es decir, el 25 % del total.", true], ["C", "40 %.", "Suma directamente los porcentajes (20 % de tecnología + 20 % del recorte), sin advertir que el 20 % recortado se calcula sobre el rubro de material didáctico y no sobre el presupuesto total.", false]]}, {"id": "RC-108", "niv": 2, "e": "Si la distribución inicial se representa en un diagrama circular, el ángulo del sector correspondiente a mantenimiento debe medir", "f": "MEN (2006). Estándares Básicos de Competencias en Matemáticas: pensamiento aleatorio; representación de datos en diagramas circulares.", "o": [["A", "35°.", "Toma el porcentaje como si fuera la medida en grados. Un diagrama circular completo mide 360°, por lo que el 35 % corresponde a 0,35 × 360°.", false], ["B", "63°.", "Calcula el 35 % de 180° en lugar de 360°, como si el círculo completo midiera lo mismo que una semicircunferencia.", false], ["C", "126°.", "El sector debe ser proporcional al porcentaje: 0,35 × 360° = 126°.", true]]}]}, {"comp": "razonamiento_cuantitativo", "rol": "docente", "tag": "Razonamiento cuantitativo", "texto": "Usted revisa las notas finales de estadística de los 10 estudiantes de un grupo de grado décimo de una institución técnica, en escala de 1,0 a 5,0. Las notas son, en orden de lista: Ana 3,9; Bruno 3,5; Carla 4,2; Diego 1,0; Elena 3,0; Fabián 4,3; Gina 3,5; Hugo 2,5; Iris 4,1 y Juan 4,0. Según el sistema institucional de evaluación, un estudiante reprueba cuando su nota es inferior a 3,0.", "items": [{"id": "RC-109", "niv": 1, "e": "El porcentaje de estudiantes del grupo que reprueba la asignatura es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: conteo y frecuencias relativas.", "o": [["A", "2 %.", "Toma el número de estudiantes que reprueban (2) como si fuera el porcentaje, sin dividir entre los 10 estudiantes del grupo.", false], ["B", "10 %.", "Cuenta solo la nota más baja (1,0) y olvida que la nota de Hugo (2,5) también es inferior a 3,0.", false], ["C", "20 %.", "Las notas inferiores a 3,0 son 1,0 y 2,5: 2 de 10 estudiantes, es decir, 2 ÷ 10 = 20 %.", true]]}, {"id": "RC-110", "niv": 2, "e": "La mediana de las notas del grupo es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: medidas de tendencia central: mediana.", "o": [["A", "3,50.", "Es la moda (el valor que más se repite) o el quinto dato ordenado; con 10 datos la mediana es el promedio del quinto y el sexto datos ordenados.", false], ["B", "3,65.", "Promedia el quinto y el sexto datos en el orden de lista (3,0 y 4,3) sin ordenarlos antes de menor a mayor, paso indispensable para hallar la mediana.", false], ["C", "3,70.", "Ordenadas: 1,0; 2,5; 3,0; 3,5; 3,5; 3,9; 4,0; 4,1; 4,2; 4,3. Con 10 datos, la mediana es el promedio del quinto y el sexto: (3,5 + 3,9) ÷ 2 = 3,7.", true]]}, {"id": "RC-111", "niv": 2, "e": "La media aritmética de las notas del grupo es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: medidas de tendencia central: media aritmética.", "o": [["A", "3,40.", "La suma de las 10 notas es 34,0 y 34,0 ÷ 10 = 3,4.", true], ["B", "3,67.", "Excluye la nota 1,0 por considerarla atípica y divide 33,0 entre 9; la media del grupo debe incluir todos los datos.", false], ["C", "3,70.", "Corresponde a la mediana, no a la media aritmética; confunde las dos medidas de tendencia central.", false]]}, {"id": "RC-112", "niv": 3, "e": "Si Diego presenta una actividad de recuperación y su nota cambia de 1,0 a 2,0, respecto a las medidas del grupo es correcto afirmar que", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: efecto de los cambios en los datos sobre las medidas de tendencia central.", "o": [["A", "la media aumenta 0,1 y la mediana y la moda no cambian.", "La suma aumenta 1,0, así que la media sube 1,0 ÷ 10 = 0,1 (de 3,4 a 3,5). El dato sigue siendo el menor, por lo que el quinto y sexto datos ordenados no cambian (mediana 3,7), y 3,5 sigue siendo el valor más repetido.", true], ["B", "la media aumenta 1,0 y la mediana y la moda no cambian.", "Suma el aumento completo de un estudiante a la media del grupo; el aumento de 1,0 se reparte entre los 10 datos, por lo que la media sube solo 0,1.", false], ["C", "la media, la mediana y la moda aumentan 0,1.", "Supone que todas las medidas reaccionan igual a un cambio en un dato. La mediana depende de los datos centrales y la moda del valor más frecuente; ninguno de ellos cambia.", false]]}]}, {"comp": "razonamiento_cuantitativo", "rol": "docente", "tag": "Razonamiento cuantitativo", "texto": "El sistema institucional de evaluación (SIEE) de un colegio establece que la nota de cada periodo se calcula así: componente cognitivo, 50 %; componente procedimental, 30 %; componente actitudinal, 20 %. La nota final del año es un promedio ponderado de los cuatro periodos: el primero y el segundo pesan 20 % cada uno, y el tercero y el cuarto pesan 30 % cada uno. La escala es de 1,0 a 5,0 y se aprueba con 3,0 o más. Usted es director de grupo de octavo y revisa varios casos.", "items": [{"id": "RC-113", "niv": 1, "e": "Si una estudiante obtuvo en un periodo 3,2 en cognitivo, 4,0 en procedimental y 4,5 en actitudinal, su nota de ese periodo es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: promedio ponderado.", "o": [["A", "3,70.", "Promedio ponderado: 3,2 × 0,5 + 4,0 × 0,3 + 4,5 × 0,2 = 1,6 + 1,2 + 0,9 = 3,7.", true], ["B", "3,90.", "Es el promedio simple (3,2 + 4,0 + 4,5) ÷ 3 = 3,9, que ignora los pesos distintos de cada componente.", false], ["C", "4,09.", "Intercambia los pesos: aplica el 50 % a la nota actitudinal y el 20 % a la cognitiva (4,5 × 0,5 + 4,0 × 0,3 + 3,2 × 0,2 = 4,09).", false]]}, {"id": "RC-114", "niv": 3, "e": "Si un estudiante tiene 2,5 en procedimental y 4,0 en actitudinal, la nota mínima que necesita en el componente cognitivo para aprobar el periodo es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: planteamiento y solución de ecuaciones lineales en contexto.", "o": [["A", "1,45.", "Plantea bien la ecuación 0,5x + 0,75 + 0,8 = 3,0, pero se detiene en 0,5x = 1,45 sin dividir entre 0,5 para despejar x.", false], ["B", "2,50.", "Plantea la ecuación con promedio simple, (x + 2,5 + 4,0) ÷ 3 = 3,0, que no respeta los pesos del SIEE.", false], ["C", "2,90.", "Se plantea 0,5x + 0,3 × 2,5 + 0,2 × 4,0 = 3,0, es decir, 0,5x + 1,55 = 3,0; entonces 0,5x = 1,45 y x = 2,9.", true]]}, {"id": "RC-115", "niv": 2, "e": "Si un estudiante obtuvo 3,0; 3,4; 4,0 y 4,2 en los periodos primero, segundo, tercero y cuarto, respectivamente, su nota final del año es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: promedio ponderado con pesos porcentuales.", "o": [["A", "3,56.", "Intercambia los pesos de los periodos: asigna 30 % a los dos primeros y 20 % a los dos últimos (0,9 + 1,02 + 0,8 + 0,84 = 3,56).", false], ["B", "3,65.", "Es el promedio simple de los cuatro periodos (14,6 ÷ 4), que no tiene en cuenta que el tercero y el cuarto pesan más.", false], ["C", "3,74.", "3,0 × 0,2 + 3,4 × 0,2 + 4,0 × 0,3 + 4,2 × 0,3 = 0,6 + 0,68 + 1,2 + 1,26 = 3,74.", true]]}, {"id": "RC-116", "niv": 2, "e": "Al explicar a las familias cómo funciona la nota de cada periodo, usted puede afirmar correctamente que", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: razonamiento proporcional en promedios ponderados.", "o": [["A", "subir 1 punto en cualquiera de los componentes aumenta la nota del periodo en 1/3 de punto.", "Ese efecto solo ocurriría con un promedio simple de tres componentes. Con pesos distintos, el aumento depende del porcentaje de cada componente.", false], ["B", "subir 1 punto en el componente actitudinal aumenta la nota del periodo en 2 puntos, por ser el 20 %.", "Confunde el porcentaje del componente con un factor de multiplicación mayor que 1: el 20 % equivale a 0,2, por lo que un punto adicional suma 0,2.", false], ["C", "subir 1 punto en el componente cognitivo aumenta la nota del periodo en 0,5, mientras que subir 1 punto en el actitudinal la aumenta en 0,2.", "Cada punto adicional en un componente se multiplica por su peso: 1 × 0,5 = 0,5 en el cognitivo y 1 × 0,2 = 0,2 en el actitudinal.", true]]}]}, {"comp": "razonamiento_cuantitativo", "rol": "docente", "tag": "Razonamiento cuantitativo", "texto": "Una institución de jornada única funciona de lunes a viernes, de 7:00 a. m. a 3:00 p. m. Cada día hay un descanso de 30 minutos y un almuerzo de 45 minutos; el resto del tiempo, 405 minutos diarios, está disponible para clases. Actualmente se dictan 8 bloques de clase de 50 minutos cada día y los 5 minutos sobrantes se usan para la formación de entrada. El proyecto educativo institucional exige como mínimo 30 horas semanales de clase, contadas en horas de 60 minutos. Usted integra el comité que revisa el horario.", "items": [{"id": "RC-117", "niv": 1, "e": "Con el horario actual, el tiempo total de clase a la semana es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: conversión de unidades de tiempo.", "o": [["A", "33 h 20 min.", "Por semana hay 8 × 50 × 5 = 2.000 minutos. Como 2.000 = 33 × 60 + 20, el tiempo es 33 horas y 20 minutos.", true], ["B", "33 h 33 min.", "Divide 2.000 ÷ 60 = 33,33… y toma la parte decimal como si fueran minutos. En realidad 0,33… horas equivalen a 20 minutos.", false], ["C", "40 h.", "Cuenta cada bloque como una hora (8 × 5 = 40), aunque cada bloque dura 50 minutos y no 60.", false]]}, {"id": "RC-118", "niv": 2, "e": "Para cumplir exactamente el mínimo del proyecto educativo con bloques de 50 minutos, el número de bloques semanales necesarios es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: conversión de unidades y razones.", "o": [["A", "25 bloques.", "Hace la conversión al revés (30 × 50 ÷ 60 = 25): trata las horas como si fueran bloques y luego las convierte a horas.", false], ["B", "30 bloques.", "Iguala cada bloque de 50 minutos a una hora de 60 minutos; 30 bloques solo suman 1.500 minutos, es decir, 25 horas.", false], ["C", "36 bloques.", "30 horas equivalen a 30 × 60 = 1.800 minutos, y 1.800 ÷ 50 = 36 bloques de 50 minutos.", true]]}, {"id": "RC-119", "niv": 2, "e": "Si se cambia a bloques de 55 minutos y se mantienen los 405 minutos diarios para clases, el número de bloques completos que caben cada día es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: interpretación del cociente y del residuo en contexto.", "o": [["A", "7 bloques.", "405 ÷ 55 = 7,36…; caben 7 bloques completos (385 minutos) y sobran 20 minutos, que no alcanzan para un octavo bloque.", true], ["B", "8 bloques.", "Redondea 7,36 hacia arriba; 8 bloques de 55 minutos requieren 440 minutos, más de los 405 disponibles.", false], ["C", "9 bloques.", "Usa toda la jornada (480 ÷ 55 = 8,7 y redondea a 9) sin descontar el descanso y el almuerzo.", false]]}, {"id": "RC-120", "niv": 3, "e": "Con 7 bloques diarios de 55 minutos, respecto al mínimo de 30 horas semanales del proyecto educativo, la conclusión correcta es que el horario", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: validación de procedimientos y argumentos.", "o": [["A", "no cumple, porque 385 minutos diarios de clase no alcanzan las 6 horas y media que se requieren cada día.", "Reparte mal el mínimo semanal: 30 horas en 5 días son 6 horas diarias (360 minutos), y los 385 minutos diarios las superan.", false], ["B", "no cumple, porque 35 bloques son menos que los 36 bloques que se necesitan con bloques de 50 minutos.", "Compara cantidades de bloques de duración distinta. Los 36 bloques corresponden a bloques de 50 minutos; con bloques de 55 minutos se requieren menos.", false], ["C", "cumple, porque suma 1.925 minutos semanales, es decir, 32 horas y 5 minutos.", "7 × 55 × 5 = 1.925 minutos. Como 30 horas son 1.800 minutos, el horario supera el mínimo en 125 minutos.", true]]}]}, {"comp": "razonamiento_cuantitativo", "rol": "docente", "tag": "Razonamiento cuantitativo", "texto": "En el informe de gestión, la rectoría presenta la matrícula total de la institución en los últimos cuatro años: 1.200 estudiantes en 2021, 1.260 en 2022, 1.323 en 2023 y 1.250 en 2024. Usted, como docente del consejo académico, debe analizar estos datos antes de la reunión con la secretaría de educación. Los porcentajes se redondean a una cifra decimal.", "items": [{"id": "RC-121", "niv": 1, "e": "La variación porcentual de la matrícula entre 2021 y 2022 fue un aumento de", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: variación porcentual.", "o": [["A", "5 %.", "El aumento es 1.260 − 1.200 = 60 estudiantes, y 60 ÷ 1.200 = 0,05, es decir, 5 %.", true], ["B", "60 %.", "Toma el aumento absoluto (60 estudiantes) como si fuera un porcentaje; para obtener la variación porcentual hay que dividirlo entre la matrícula inicial.", false], ["C", "105 %.", "Confunde la razón entre los dos valores (1.260 ÷ 1.200 = 1,05, es decir, 105 %) con la variación. La matrícula de 2022 es el 105 % de la de 2021, lo que significa un aumento del 5 %.", false]]}, {"id": "RC-122", "niv": 2, "e": "La variación porcentual de la matrícula entre 2023 y 2024 fue una disminución de aproximadamente", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: variación porcentual con disminución.", "o": [["A", "0,8 %.", "Compara 2024 con 2022 (1.250 frente a 1.260) en lugar de compararlo con el año inmediatamente anterior, 2023.", false], ["B", "5,5 %.", "La disminución es 1.323 − 1.250 = 73 estudiantes, y 73 ÷ 1.323 ≈ 0,0552, es decir, aproximadamente 5,5 %.", true], ["C", "5,8 %.", "Divide la disminución entre el valor final (73 ÷ 1.250 = 5,84 %), cuando la base de la variación es el valor inicial del periodo, 1.323.", false]]}, {"id": "RC-123", "niv": 2, "e": "En promedio, entre 2021 y 2024 la matrícula cambió a razón de", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: razón de cambio promedio.", "o": [["A", "12,5 estudiantes por año.", "Divide el cambio total entre 4 porque hay cuatro datos, pero entre 2021 y 2024 hay 3 intervalos anuales.", false], ["B", "16,7 estudiantes por año.", "El cambio total es 1.250 − 1.200 = 50 estudiantes en 3 años: 50 ÷ 3 ≈ 16,7 estudiantes por año.", true], ["C", "50 estudiantes por año.", "Toma el cambio total del periodo como si fuera el cambio anual, sin dividir entre los 3 años transcurridos.", false]]}, {"id": "RC-124", "niv": 3, "e": "Un miembro del consejo afirma: «entre 2021 y 2024 la matrícula creció un 4,2 %; por tanto, aumentó todos los años». Frente a esta afirmación, usted concluye que", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: validación de conclusiones a partir de datos.", "o": [["A", "la conclusión no es válida, porque entre 2021 y 2024 la matrícula disminuyó un 4,2 %.", "Interpreta mal el sentido del cambio: la matrícula pasó de 1.200 a 1.250, lo que es un aumento. El error de la afirmación está en la generalización a todos los años.", false], ["B", "la conclusión es válida, porque la matrícula de 2024 es mayor que la de 2021 y una variación positiva en el periodo completo indica crecimiento anual.", "Una variación positiva entre los extremos del periodo no implica crecimiento en cada año; los datos muestran una caída de 2023 a 2024.", false], ["C", "el porcentaje es correcto, pero la conclusión no es válida, porque de 2023 a 2024 la matrícula disminuyó.", "50 ÷ 1.200 ≈ 4,2 %, así que el dato es correcto. Sin embargo, comparar solo el primer y el último año no informa sobre los años intermedios, y entre 2023 y 2024 hubo una disminución.", true]]}]}, {"comp": "razonamiento_cuantitativo", "rol": "docente", "tag": "Razonamiento cuantitativo", "texto": "Usted coordina el transporte escolar de una sede rural. El bus recorre 18 kilómetros entre la vereda más lejana y la sede, a una velocidad promedio de 36 km/h mientras está en movimiento, y en ese trayecto hace 4 paradas de 3 minutos cada una para recoger estudiantes. Cada día de clase el bus recorre ese trayecto 4 veces (ida y regreso en la mañana, e ida y regreso en la tarde). El bus rinde 30 kilómetros por galón y el galón de combustible cuesta $16.000. En el mes hay 22 días de clase. La alcaldía paga el 75 % del combustible y el resto se divide en partes iguales entre los 40 estudiantes que usan la ruta.", "items": [{"id": "RC-125", "niv": 1, "e": "El combustible que consume el bus en un día de clase es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: razones y conversión de unidades (rendimiento de combustible).", "o": [["A", "0,6 galones.", "Corresponde a un solo trayecto de 18 km (18 ÷ 30 = 0,6); el bus recorre el trayecto 4 veces al día.", false], ["B", "1,2 galones.", "Cuenta solo la ida y el regreso de la mañana (36 km); faltan los dos trayectos de la tarde.", false], ["C", "2,4 galones.", "Cada día el bus recorre 4 × 18 = 72 km. Con un rendimiento de 30 km por galón consume 72 ÷ 30 = 2,4 galones.", true]]}, {"id": "RC-126", "niv": 2, "e": "Si el bus sale de la vereda más lejana a las 6:10 a. m., llega a la sede a las", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: velocidad, tiempo y conversión de horas decimales a minutos.", "o": [["A", "6:40 a. m.", "Calcula bien el tiempo en movimiento (30 minutos), pero olvida sumar los 12 minutos de las 4 paradas.", false], ["B", "6:52 a. m.", "En movimiento tarda 18 ÷ 36 = 0,5 h = 30 minutos; las paradas suman 4 × 3 = 12 minutos. En total 42 minutos: 6:10 + 0:42 = 6:52 a. m.", true], ["C", "7:12 a. m.", "Lee 0,5 horas como 50 minutos, error frecuente al convertir horas decimales a minutos; 0,5 h equivalen a 30 minutos.", false]]}, {"id": "RC-127", "niv": 2, "e": "El costo del combustible del bus en el mes es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: procesos aritméticos de varios pasos.", "o": [["A", "$38.400.", "Es el costo de un solo día (2,4 × 16.000); falta multiplicar por los 22 días de clase del mes.", false], ["B", "$211.200.", "Calcula solo la parte que cubren las familias (25 % del costo); el enunciado pide el costo total del combustible del mes.", false], ["C", "$844.800.", "Cada día se consumen 72 ÷ 30 = 2,4 galones, que cuestan 2,4 × 16.000 = $38.400. En 22 días de clase: 38.400 × 22 = $844.800.", true]]}, {"id": "RC-128", "niv": 3, "e": "El valor mensual que corresponde pagar a cada estudiante por el combustible es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: porcentajes y reparto en problemas de varios pasos.", "o": [["A", "$5.280.", "El costo mensual es $844.800 y las familias cubren el 25 % no subsidiado: 844.800 × 0,25 = $211.200. Dividido entre 40 estudiantes: $5.280.", true], ["B", "$15.840.", "Reparte entre los estudiantes el 75 %, que es la parte que paga la alcaldía, en lugar del 25 % restante.", false], ["C", "$21.120.", "Divide el costo mensual completo entre los 40 estudiantes sin descontar el aporte de la alcaldía.", false]]}]}, {"comp": "razonamiento_cuantitativo", "rol": "docente", "tag": "Razonamiento cuantitativo", "texto": "La institución remodelará un aula rectangular de 8 m de largo, 6,5 m de ancho y 3 m de alto. El piso se cubrirá con baldosas cuadradas de 50 cm de lado, sin desperdicio. Las cuatro paredes se pintarán por dentro con una sola mano de pintura, excepto la puerta, de 1 m × 2,1 m, y tres ventanas de 1,5 m × 1,2 m cada una; el techo no se pinta. Un galón de pintura cubre 25 m² con una mano. El comité de infraestructura fijó como criterio un área mínima de 1,65 m² de piso por estudiante. Usted integra ese comité.", "items": [{"id": "RC-129", "niv": 1, "e": "El área del piso del aula es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: áreas de figuras planas.", "o": [["A", "29 m².", "Corresponde al perímetro del piso, 2 × (8 + 6,5) = 29 m, que es una longitud y no un área.", false], ["B", "52 m².", "El área de un rectángulo es largo por ancho: 8 × 6,5 = 52 m².", true], ["C", "156 m².", "Multiplica también por la altura (8 × 6,5 × 3 = 156); ese valor es el volumen del aula en metros cúbicos, no el área del piso.", false]]}, {"id": "RC-130", "niv": 2, "e": "El número de baldosas necesarias para cubrir el piso es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: áreas y conversión de unidades de longitud.", "o": [["A", "58 baldosas.", "Divide el perímetro (29 m) entre el lado de la baldosa (0,5 m); así solo se contaría una hilera de baldosas alrededor del borde.", false], ["B", "104 baldosas.", "Toma 0,5 como el área de cada baldosa. Si el lado mide 0,5 m, el área es 0,5 × 0,5 = 0,25 m².", false], ["C", "208 baldosas.", "Cada baldosa mide 0,5 m × 0,5 m = 0,25 m². El piso mide 52 m², así que se requieren 52 ÷ 0,25 = 208 baldosas (16 a lo largo × 13 a lo ancho).", true]]}, {"id": "RC-131", "niv": 2, "e": "Según el criterio del comité, el número máximo de estudiantes que pueden ocupar el aula es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: interpretación del cociente en contexto (redondeo por defecto).", "o": [["A", "31 estudiantes.", "52 ÷ 1,65 = 31,5. Con 31 estudiantes cada uno dispone de al menos 1,65 m²; con 32 se necesitarían 52,8 m², más de los 52 m² disponibles.", true], ["B", "32 estudiantes.", "Redondea 31,5 hacia arriba; con 32 estudiantes el área por estudiante (1,625 m²) quedaría por debajo del mínimo.", false], ["C", "86 estudiantes.", "Multiplica el área por 1,65 en lugar de dividir (52 × 1,65 ≈ 86); el criterio indica cuántos metros cuadrados ocupa cada estudiante.", false]]}, {"id": "RC-132", "niv": 3, "e": "El número mínimo de galones de pintura que deben comprarse es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: áreas compuestas y redondeo por exceso.", "o": [["A", "3 galones.", "Trunca el cociente 79,5 ÷ 25 = 3,18. Con 3 galones solo se cubren 75 m² y faltarían 4,5 m².", false], ["B", "4 galones.", "Paredes: perímetro × altura = 29 × 3 = 87 m². Se restan la puerta (2,1 m²) y las ventanas (3 × 1,8 = 5,4 m²): 87 − 7,5 = 79,5 m². Como 79,5 ÷ 25 = 3,18, se necesitan 4 galones.", true], ["C", "6 galones.", "Suma el área del techo (52 m²) a la de las paredes (131,5 ÷ 25 = 5,26); el caso indica que el techo no se pinta.", false]]}]}, {"comp": "razonamiento_cuantitativo", "rol": "docente", "tag": "Razonamiento cuantitativo", "texto": "El consejo de estudiantes organiza una rifa para financiar el periódico escolar. Se imprimen 300 boletas numeradas del 001 al 300, cada una a $5.000. El premio, una tableta, cuesta $600.000. El ganador se definirá con una balota que extrae al azar uno de los 300 números, y todos los números tienen la misma probabilidad de salir, se hayan vendido o no. Usted es el docente asesor del consejo.", "items": [{"id": "RC-133", "niv": 1, "e": "Si una familia compra 6 boletas, la probabilidad de que gane la tableta es", "f": "MEN (2006). Estándares Básicos de Competencias en Matemáticas: pensamiento aleatorio; probabilidad clásica.", "o": [["A", "0,3 %.", "Corresponde a la probabilidad de ganar con una sola boleta (1 ÷ 300 ≈ 0,33 %); la familia tiene 6 de los 300 números.", false], ["B", "2 %.", "Hay 6 casos favorables entre 300 posibles: 6 ÷ 300 = 0,02 = 2 %.", true], ["C", "6 %.", "Divide 6 entre 100, como si hubiera 100 boletas; el total de casos posibles es 300.", false]]}, {"id": "RC-134", "niv": 2, "e": "La probabilidad de que el número ganador termine en 7 es", "f": "MEN (2006). Estándares Básicos de Competencias en Matemáticas: pensamiento aleatorio; conteo de casos favorables.", "o": [["A", "3,3 %.", "Cuenta solo los números del 001 al 100 que terminan en 7 (10 números) y los divide entre 300; en cada centena hay 10 números terminados en 7.", false], ["B", "10 %.", "Del 001 al 300 terminan en 7 los números 007, 017, …, 297: 10 por cada centena, es decir, 30. La probabilidad es 30 ÷ 300 = 10 %.", true], ["C", "30 %.", "Cuenta correctamente 30 casos favorables, pero los expresa como porcentaje sin dividir entre los 300 casos posibles.", false]]}, {"id": "RC-135", "niv": 3, "e": "Si se decide rifar dos premios con dos balotas sucesivas, sin devolver el primer número extraído, la probabilidad de que una familia con 6 boletas gane ambos premios es de 1 entre", "f": "MEN (2006). Estándares Básicos de Competencias en Matemáticas: pensamiento aleatorio; probabilidad de eventos sucesivos sin reposición.", "o": [["A", "50.", "Es la probabilidad de ganar uno de los premios (6 ÷ 300 = 1/50); ganar ambos exige que ocurran dos eventos sucesivos.", false], ["B", "2.500.", "Multiplica 6/300 × 6/300 como si el primer número se devolviera; sin reposición, en la segunda extracción la familia tiene 5 números entre 299.", false], ["C", "2.990.", "Primera balota: 6/300. Si gana, le quedan 5 números entre 299: 5/299. La probabilidad es (6 × 5) ÷ (300 × 299) = 30 ÷ 89.700 = 1/2.990.", true]]}, {"id": "RC-136", "niv": 1, "e": "Si se vende el 80 % de las boletas, la ganancia de la rifa para el periódico escolar es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: porcentajes y diferencia entre ingreso y ganancia.", "o": [["A", "$600.000.", "Se venden 0,8 × 300 = 240 boletas, que recaudan 240 × 5.000 = $1.200.000. Descontando el premio: 1.200.000 − 600.000 = $600.000.", true], ["B", "$900.000.", "Supone que se venden las 300 boletas (1.500.000 − 600.000); el caso indica que se vende el 80 %.", false], ["C", "$1.200.000.", "Es el dinero recaudado, no la ganancia; olvida descontar los $600.000 que cuesta la tableta.", false]]}]}, {"comp": "razonamiento_cuantitativo", "rol": "docente", "tag": "Razonamiento cuantitativo", "texto": "Usted forma parte del comité que negocia los uniformes para los estudiantes beneficiarios de un programa de apoyo. El proveedor A tiene un precio de lista de $85.000 por uniforme y ofrece un descuento del 20 % por compra institucional y, sobre el precio ya rebajado, un descuento adicional del 10 % por pago de contado. El proveedor B tiene un precio de lista de $88.000 por uniforme y ofrece un único descuento del 30 %. Ambos precios ya incluyen impuestos.", "items": [{"id": "RC-137", "niv": 1, "e": "Con el proveedor A, el precio de un uniforme después de aplicar solo el descuento por compra institucional es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: porcentajes y descuentos.", "o": [["A", "$17.000.", "Es el valor del descuento (20 % de 85.000), no el precio que queda después de aplicarlo.", false], ["B", "$65.000.", "Resta $20.000 al precio de lista, como si 20 % significara 20.000 pesos; el descuento es 0,2 × 85.000 = $17.000.", false], ["C", "$68.000.", "El descuento es 0,2 × 85.000 = $17.000, así que el precio queda en 85.000 − 17.000 = $68.000 (equivale a pagar el 80 %).", true]]}, {"id": "RC-138", "niv": 2, "e": "Con el proveedor A, el precio final de un uniforme pagado de contado es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: descuentos sucesivos.", "o": [["A", "$59.500.", "Suma los dos descuentos y aplica un 30 % sobre el precio de lista (85.000 × 0,7); el segundo descuento se aplica sobre el precio ya rebajado.", false], ["B", "$61.200.", "Primer descuento: 85.000 × 0,8 = $68.000. Segundo descuento sobre ese valor: 68.000 × 0,9 = $61.200.", true], ["C", "$76.500.", "Aplica solo el descuento del 10 % (85.000 × 0,9) y olvida el descuento por compra institucional.", false]]}, {"id": "RC-139", "niv": 3, "e": "Los dos descuentos sucesivos del proveedor A equivalen a un descuento único sobre el precio de lista de", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: porcentajes sucesivos y descuento equivalente.", "o": [["A", "28 %.", "Después de ambos descuentos se paga 0,8 × 0,9 = 0,72 del precio, es decir, el 72 %. El descuento único equivalente es 100 % − 72 % = 28 %.", true], ["B", "30 %.", "Suma los porcentajes (20 % + 10 %); los descuentos sucesivos no se suman porque el segundo se calcula sobre una base menor.", false], ["C", "72 %.", "Es el porcentaje del precio que se paga, no el descuento; confunde la parte pagada con la parte descontada.", false]]}, {"id": "RC-140", "niv": 2, "e": "Al comparar las dos ofertas para pago de contado, usted recomienda al comité", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: comparación de alternativas con porcentajes.", "o": [["A", "el proveedor A, porque su precio final por uniforme resulta menor que el del proveedor B.", "Proveedor A: 85.000 × 0,8 × 0,9 = $61.200. Proveedor B: 88.000 × 0,7 = $61.600. La comparación debe hacerse con los precios finales, y A es $400 más económico.", true], ["B", "cualquiera de los dos, porque los dos descuentos sucesivos del proveedor A equivalen en total al 30 % que ofrece el proveedor B.", "Supone que 20 % y 10 % sucesivos equivalen al 30 %; en realidad equivalen al 28 %, y además los precios de lista son distintos.", false], ["C", "el proveedor B, porque su descuento único del 30 % es mayor que el descuento total que se obtiene con los dos descuentos del proveedor A.", "Compara porcentajes aplicados a precios de lista distintos. Aunque B descuenta más en porcentaje, parte de un precio mayor y su precio final es más alto.", false]]}]}, {"comp": "razonamiento_cuantitativo", "rol": "docente", "tag": "Razonamiento cuantitativo", "texto": "Los estudiantes de grado once reunieron $3.000.000 para su ceremonia de grado, que será dentro de varios meses. Usted, como director de grupo, les ayuda a comparar dos alternativas para guardar el dinero: una cuenta de ahorro que paga 1 % mensual de interés compuesto (los intereses de cada mes se suman al saldo y generan intereses el mes siguiente) y una cooperativa que paga 1,2 % mensual de interés simple (los intereses se calculan siempre sobre los $3.000.000 iniciales). En ninguna de las dos se hacen retiros ni nuevos depósitos.", "items": [{"id": "RC-141", "niv": 1, "e": "En la cooperativa, los intereses que se acumulan en 6 meses son", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: interés simple.", "o": [["A", "$216.000.", "Con interés simple: 3.000.000 × 0,012 × 6 = $216.000.", true], ["B", "$2.160.000.", "Usa 12 % en lugar de 1,2 % mensual (3.000.000 × 0,12 × 6); confunde la posición de la coma decimal al convertir el porcentaje.", false], ["C", "$3.216.000.", "Es el saldo total al cabo de 6 meses (capital más intereses); el enunciado pide solo los intereses.", false]]}, {"id": "RC-142", "niv": 2, "e": "En la cuenta de ahorro, el saldo al cabo de 6 meses, redondeado al peso, es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: interés compuesto y crecimiento exponencial.", "o": [["A", "$3.030.000.", "Corresponde al saldo al final del primer mes (3.000.000 × 1,01); faltan los 5 meses restantes.", false], ["B", "$3.180.000.", "Calcula el 1 % como si fuera interés simple (3.000.000 × 0,01 × 6 = 180.000), sin capitalizar los intereses de cada mes.", false], ["C", "$3.184.560.", "Con interés compuesto, el saldo se multiplica por 1,01 cada mes: 3.000.000 × 1,01⁶ ≈ 3.000.000 × 1,0615 ≈ $3.184.560.", true]]}, {"id": "RC-143", "niv": 3, "e": "Si el dinero se va a guardar exactamente 6 meses, la recomendación correcta es elegir", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: comparación de modelos de crecimiento lineal y exponencial.", "o": [["A", "la cooperativa, porque en 6 meses su saldo final supera al de la cuenta de ahorro.", "Cooperativa: 3.000.000 + 216.000 = $3.216.000. Cuenta de ahorro: 3.000.000 × 1,01⁶ ≈ $3.184.560. En 6 meses la tasa más alta de la cooperativa compensa la capitalización de la cuenta.", true], ["B", "la cuenta de ahorro, porque el interés compuesto produce más dinero que el interés simple en cualquier plazo.", "Generaliza sin considerar las tasas: a igual tasa el compuesto supera al simple, pero aquí las tasas son distintas y en 6 meses el 1,2 % simple rinde más.", false], ["C", "cualquiera de las dos, porque el 1,2 % simple y el 1 % compuesto producen el mismo saldo en 6 meses.", "Afirma una equivalencia sin calcularla. Los saldos difieren en unos $31.440 a favor de la cooperativa.", false]]}, {"id": "RC-144", "niv": 3, "e": "En la cuenta de ahorro, el número mínimo de meses completos necesarios para que el saldo llegue al menos a $3.600.000 es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: interés compuesto y modelación con funciones exponenciales.", "o": [["A", "18 meses.", "Trunca el valor aproximado 18,3 que se obtiene al resolver 1,01ⁿ = 1,2; a los 18 meses el saldo es de unos $3.588.442 y todavía no alcanza la meta.", false], ["B", "19 meses.", "Se busca el menor n con 3.000.000 × 1,01ⁿ ≥ 3.600.000, es decir, 1,01ⁿ ≥ 1,2. Con n = 18 el saldo es ≈ $3.588.442 y con n = 19 es ≈ $3.624.327, así que se necesitan 19 meses.", true], ["C", "20 meses.", "Razona como interés simple: si cada mes se gana el 1 % del capital inicial, se necesitarían 20 meses para ganar el 20 %; la capitalización hace que se alcance antes.", false]]}]}, {"comp": "razonamiento_cuantitativo", "rol": "docente", "tag": "Razonamiento cuantitativo", "texto": "Usted es director de un grupo de 35 estudiantes y analiza las inasistencias registradas entre febrero y mayo. Febrero tuvo 20 días de clase y 84 inasistencias; marzo, 20 días y 63 inasistencias; abril, 15 días (por la Semana Santa) y 90 inasistencias; mayo, 20 días y 98 inasistencias. Cada inasistencia corresponde a un estudiante que faltó un día completo. El porcentaje de inasistencia de un periodo se calcula dividiendo las inasistencias entre el total de asistencias posibles (estudiantes × días de clase).", "items": [{"id": "RC-145", "niv": 1, "e": "El porcentaje de asistencia del grupo en febrero fue", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: porcentajes y elección de la base adecuada.", "o": [["A", "12 %.", "Es el porcentaje de inasistencia (84 ÷ 700); el enunciado pide el de asistencia, que es su complemento.", false], ["B", "88 %.", "En febrero hubo 35 × 20 = 700 asistencias posibles. La inasistencia fue 84 ÷ 700 = 12 %, de modo que la asistencia fue 100 % − 12 % = 88 %.", true], ["C", "97,6 %.", "Divide las inasistencias entre el número de estudiantes (84 ÷ 35 = 2,4) y lo resta de 100 como si fuera un porcentaje; la base correcta son las 700 asistencias posibles.", false]]}, {"id": "RC-146", "niv": 2, "e": "Si el manual de convivencia fija que un estudiante no debe superar el 15 % de inasistencia en un periodo de 40 días de clase, el número máximo de inasistencias que puede tener sin superar ese límite es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: porcentajes y desigualdades en contexto.", "o": [["A", "5 inasistencias.", "Interpreta «sin superar» como «estrictamente menor que»; con 6 inasistencias el porcentaje es exactamente 15 %, que no supera el límite.", false], ["B", "6 inasistencias.", "El 15 % de 40 días es 0,15 × 40 = 6. Con 6 inasistencias se llega exactamente al 15 % sin superarlo; con 7 se llegaría al 17,5 %.", true], ["C", "7 inasistencias.", "Corresponde al primer número de inasistencias que supera el límite (7 ÷ 40 = 17,5 %), no al máximo permitido.", false]]}, {"id": "RC-147", "niv": 3, "e": "El porcentaje de inasistencia del grupo en el periodo completo de febrero a mayo fue aproximadamente", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: promedios ponderados; error de promediar porcentajes con bases distintas.", "o": [["A", "12,0 %.", "Supone que los cuatro meses tuvieron 20 días (335 ÷ 2.800); abril tuvo 15 días, de modo que las asistencias posibles son 2.625.", false], ["B", "12,8 %.", "Inasistencias: 84 + 63 + 90 + 98 = 335. Asistencias posibles: 35 × (20 + 20 + 15 + 20) = 35 × 75 = 2.625. Porcentaje: 335 ÷ 2.625 ≈ 12,8 %.", true], ["C", "13,0 %.", "Promedia los porcentajes mensuales (12 %, 9 %, 17,1 % y 14 %) como si todos los meses tuvieran el mismo número de días; abril pesa menos porque tuvo 15 días.", false]]}, {"id": "RC-148", "niv": 2, "e": "Al comparar los cuatro meses, usted concluye correctamente que el mes con mayor porcentaje de inasistencia fue", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: comparación de razones y porcentajes.", "o": [["A", "febrero, porque tuvo 20 días de clase y 84 inasistencias, con un 12 %.", "El 12 % de febrero es menor que el 14 % de mayo y que el 17,1 % de abril, así que no es el mes con mayor inasistencia.", false], ["B", "mayo, porque tuvo el mayor número de inasistencias del periodo.", "Compara cantidades absolutas entre meses con distinto número de días de clase. En porcentaje, mayo (14 %) está por debajo de abril (17,1 %).", false], ["C", "abril, con aproximadamente 17,1 %, aunque tuvo menos inasistencias que mayo.", "Abril: 90 ÷ (35 × 15) = 90 ÷ 525 ≈ 17,1 %. Mayo: 98 ÷ 700 = 14 %. Para comparar meses con distinto número de días se usan porcentajes, no cantidades absolutas.", true]]}]}, {"comp": "razonamiento_cuantitativo", "rol": "docente", "tag": "Razonamiento cuantitativo", "texto": "En una escuela rural de la región Caribe, el proyecto ambiental escolar propone recoger agua lluvia del techo, que tiene forma rectangular de 12 m × 10 m vista desde arriba. Se sabe que 1 milímetro de lluvia sobre 1 m² de superficie equivale a 1 litro de agua. Por pérdidas en las canaletas, solo el 80 % del agua que cae sobre el techo llega al tanque. El tanque tiene forma de caja de 2 m × 1,5 m × 1 m. En la escuela estudian 45 niños; cada uno usa 4 litros diarios para lavado de manos y, además, se gastan 30 litros diarios en aseo. Usted lidera el proyecto con sus estudiantes.", "items": [{"id": "RC-149", "niv": 1, "e": "La capacidad del tanque es de", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: volumen y conversión de unidades de capacidad.", "o": [["A", "3 litros.", "Calcula bien el volumen (3 m³) pero lo reporta en litros sin convertir; cada metro cúbico equivale a 1.000 litros.", false], ["B", "300 litros.", "Usa una equivalencia errónea (1 m³ = 100 L); un metro cúbico equivale a 1.000 litros.", false], ["C", "3.000 litros.", "El volumen es 2 × 1,5 × 1 = 3 m³ y, como 1 m³ = 1.000 L, el tanque tiene capacidad para 3.000 litros.", true]]}, {"id": "RC-150", "niv": 2, "e": "Si en un aguacero caen 15 milímetros de lluvia, la cantidad de agua que llega al tanque es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: proporcionalidad y porcentajes con unidades de medida.", "o": [["A", "1.440 litros.", "Sobre el techo caen 120 m² × 15 mm = 1.800 litros, y llega al tanque el 80 %: 1.800 × 0,8 = 1.440 litros.", true], ["B", "1.800 litros.", "Es el agua que cae sobre el techo; olvida que solo el 80 % llega al tanque.", false], ["C", "2.250 litros.", "Divide entre 0,8 en lugar de multiplicar (1.800 ÷ 0,8), con lo que obtiene más agua de la que cae sobre el techo.", false]]}, {"id": "RC-151", "niv": 2, "e": "Con el tanque lleno y sin nuevas lluvias, el número de días completos de clase que alcanza el agua es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: interpretación del cociente en contexto.", "o": [["A", "14 días.", "El consumo diario es 45 × 4 + 30 = 210 litros. 3.000 ÷ 210 = 14,28…; el agua alcanza para 14 días completos y el decimoquinto quedaría incompleto.", true], ["B", "15 días.", "Redondea 14,28 hacia arriba; para 15 días completos se necesitarían 3.150 litros.", false], ["C", "16 días.", "Omite los 30 litros diarios de aseo (3.000 ÷ 180 = 16,6…); el consumo diario incluye ambos usos.", false]]}, {"id": "RC-152", "niv": 3, "e": "La cantidad mínima de lluvia necesaria para llenar el tanque vacío es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: planteamiento de ecuaciones y porcentajes inversos.", "o": [["A", "25 milímetros.", "Divide 3.000 litros entre 120 m² sin tener en cuenta que solo el 80 % del agua llega al tanque.", false], ["B", "30 milímetros.", "Compensa la pérdida sumando un 20 % a los 25 mm (25 × 1,2); lo correcto es dividir entre 0,8, porque el 80 % de lo recogido debe ser 3.000 L.", false], ["C", "31,25 milímetros.", "Se necesita que 120 × h × 0,8 = 3.000, es decir, 96h = 3.000, de donde h = 31,25 mm.", true]]}]}, {"comp": "razonamiento_cuantitativo", "rol": "docente", "tag": "Razonamiento cuantitativo", "texto": "Los estudiantes de séptimo preparan la huerta escolar. Para el sustrato de las eras mezclan, por volumen, 4 partes de tierra, 3 partes de compost y 1 parte de arena. En el plano que dibujaron a escala 1:50, la huerta es un rectángulo de 24 cm × 16 cm. La huerta se cerrará con una cerca que tendrá postes cada 2 m a lo largo de todo el perímetro, incluido un poste en cada esquina. Usted acompaña el proyecto como docente de ciencias naturales.", "items": [{"id": "RC-153", "niv": 1, "e": "Para preparar 240 litros de sustrato, la cantidad de compost necesaria es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: razones y proporciones; reparto proporcional.", "o": [["A", "90 litros.", "La mezcla tiene 4 + 3 + 1 = 8 partes, y el compost es 3 de ellas: 240 × 3/8 = 90 litros.", true], ["B", "102,9 litros.", "Omite la arena y reparte solo entre tierra y compost (240 × 3/7 ≈ 102,9); la arena también forma parte de la mezcla.", false], ["C", "120 litros.", "Calcula la cantidad de tierra (4 de las 8 partes: 240 × 4/8) en lugar de la de compost, que corresponde a 3 partes.", false]]}, {"id": "RC-154", "niv": 3, "e": "El área real de la huerta es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: escalas, proporcionalidad y conversión de unidades de área.", "o": [["A", "1,92 m².", "Multiplica el área del plano (384 cm²) por 50, pero en una escala lineal 1:50 las áreas se multiplican por 50² = 2.500.", false], ["B", "96 m².", "Las medidas reales son 24 × 50 = 1.200 cm = 12 m y 16 × 50 = 800 cm = 8 m. El área es 12 × 8 = 96 m².", true], ["C", "9.600 m².", "Calcula bien 960.000 cm², pero divide entre 100 para pasar a m²; 1 m² = 10.000 cm², así que son 96 m².", false]]}, {"id": "RC-155", "niv": 2, "e": "El número de postes necesarios para la cerca es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: perímetro y conteo en figuras cerradas.", "o": [["A", "19 postes.", "Resta un poste por considerar que el primero y el último coinciden, pero ese ajuste ya está incluido al dividir el perímetro cerrado entre la separación.", false], ["B", "20 postes.", "La huerta real mide 12 m × 8 m, con perímetro 2 × (12 + 8) = 40 m. En una línea cerrada hay tantos postes como tramos: 40 ÷ 2 = 20 postes.", true], ["C", "21 postes.", "Suma un poste como si la cerca fuera una línea abierta; en un perímetro cerrado el último tramo termina en el primer poste.", false]]}]}, {"comp": "razonamiento_cuantitativo", "rol": "docente", "tag": "Razonamiento cuantitativo", "texto": "En la reunión de análisis de resultados se proyecta una gráfica de barras con el puntaje promedio de la institución en la prueba Saber 11 (escala de 0 a 100). Matemáticas: 48 en 2022, 52 en 2023 y 55 en 2024. Lectura crítica: 54 en 2022, 53 en 2023 y 57 en 2024. El eje vertical de la gráfica comienza en 45 y no en 0. El número de estudiantes evaluados fue 120 en 2022, 95 en 2023 y 130 en 2024. Usted debe orientar la discusión del consejo académico.", "items": [{"id": "RC-156", "niv": 1, "e": "Según los datos, el año en que la diferencia entre los promedios de lectura crítica y matemáticas fue menor es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: lectura e interpretación de datos en gráficas.", "o": [["A", "2023, con una diferencia de 1 punto.", "Diferencias: 2022, 54 − 48 = 6; 2023, 53 − 52 = 1; 2024, 57 − 55 = 2. La menor es la de 2023.", true], ["B", "2024, porque en ese año ambos promedios fueron los más altos.", "Que ambos promedios sean los más altos no implica que su diferencia sea la menor: en 2024 la diferencia fue 2 puntos, mayor que la de 2023.", false], ["C", "2022, porque en ese año se evaluaron más estudiantes que en 2023.", "El número de evaluados no determina la diferencia entre promedios; en 2022 la diferencia fue la mayor, 6 puntos.", false]]}, {"id": "RC-157", "niv": 2, "e": "El aumento porcentual del promedio de matemáticas entre 2022 y 2024 fue aproximadamente de", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: variación absoluta y relativa.", "o": [["A", "7 %.", "Confunde el aumento absoluto (7 puntos) con el aumento relativo; 7 puntos sobre una base de 48 representan más del 7 %.", false], ["B", "12,7 %.", "Divide el aumento entre el valor final (7 ÷ 55); la base de la variación porcentual es el valor inicial, 48.", false], ["C", "14,6 %.", "El aumento es 55 − 48 = 7 puntos y 7 ÷ 48 ≈ 0,146, es decir, cerca de 14,6 %.", true]]}, {"id": "RC-158", "niv": 3, "e": "Un docente comenta que en la gráfica la barra de matemáticas de 2024 se ve más del triple de alta que la de 2022. La explicación correcta de este efecto es que", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: interpretación crítica de representaciones gráficas.", "o": [["A", "el promedio de matemáticas se triplicó entre 2022 y 2024 gracias al plan de mejoramiento, como lo muestra la altura de las barras de la gráfica.", "Toma la altura visual de las barras como si representara los valores: el promedio pasó de 48 a 55, un aumento de cerca del 14,6 %.", false], ["B", "en 2024 se evaluaron más estudiantes, y la altura de cada barra depende del número de evaluados.", "La barra representa el puntaje promedio, no el número de estudiantes; además, los evaluados solo pasaron de 120 a 130.", false], ["C", "el eje comienza en 45, por lo que las barras muestran solo 3 y 10 unidades sobre ese valor y exageran visualmente el aumento.", "Con el eje desde 45, la barra de 2022 mide 48 − 45 = 3 unidades y la de 2024, 55 − 45 = 10. La proporción visual (más del triple) exagera un aumento real de 7 puntos sobre una base de 48.", true]]}, {"id": "RC-159", "niv": 2, "e": "Un directivo afirma: «como el promedio de matemáticas subió de 2022 a 2023, en 2023 hubo más estudiantes con puntaje superior a 60». Frente a esta afirmación, usted señala que", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: validación de inferencias a partir de medidas de tendencia central.", "o": [["A", "no se puede concluir, porque el promedio no indica cuántos estudiantes superan un puntaje determinado.", "El promedio resume el conjunto pero no describe la distribución de los puntajes; con 95 evaluados frente a 120, podría incluso haber menos estudiantes por encima de 60.", true], ["B", "es incorrecta, porque según la tabla el promedio de matemáticas bajó entre 2022 y 2023.", "Lee mal los datos: el promedio pasó de 48 a 52, es decir, subió. El problema de la afirmación es lo que se infiere del promedio.", false], ["C", "es correcta, porque un aumento de 4 puntos en el promedio implica más estudiantes con puntajes altos.", "Un promedio mayor puede deberse a que subieron los puntajes bajos sin que aumente el número de puntajes altos; la afirmación no se deduce de los datos.", false]]}]}, {"comp": "razonamiento_cuantitativo", "rol": "docente", "tag": "Razonamiento cuantitativo", "texto": "Para financiar la salida pedagógica de quinto de primaria, la asociación de padres organizó una función de teatro. La boleta de adulto costó $8.000 y la de niño, $5.000. Se vendieron en total 180 boletas y se recaudaron $1.140.000. Usted, como docente de quinto, analiza las cuentas con sus estudiantes en la clase de matemáticas y denota con a el número de boletas de adulto y con n el número de boletas de niño.", "items": [{"id": "RC-160", "niv": 1, "e": "El sistema de ecuaciones que representa correctamente la situación es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: modelación con sistemas de ecuaciones lineales.", "o": [["A", "a + n = 180 y 8.000a + 5.000n = 1.140.000.", "La primera ecuación cuenta las boletas vendidas y la segunda suma el dinero recaudado por cada tipo de boleta.", true], ["B", "a + n = 1.140.000 y 8.000a + 5.000n = 180.", "Intercambia los datos: la suma de boletas debe igualarse a 180 y el dinero recaudado a $1.140.000.", false], ["C", "a + n = 180 y 8.000a = 5.000n.", "La segunda ecuación supondría que ambos tipos de boleta recaudaron lo mismo, condición que el caso no plantea; tampoco usa el total recaudado.", false]]}, {"id": "RC-161", "niv": 2, "e": "El número de boletas de adulto vendidas fue", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: solución de sistemas de ecuaciones lineales.", "o": [["A", "80 boletas.", "De a + n = 180 se tiene n = 180 − a. Al sustituir: 8.000a + 5.000(180 − a) = 1.140.000, es decir, 3.000a = 240.000, y a = 80. Comprobación: 80 × 8.000 + 100 × 5.000 = 1.140.000.", true], ["B", "90 boletas.", "Supone que se vendió la misma cantidad de cada tipo (180 ÷ 2); con 90 y 90 se recaudarían $1.170.000, no $1.140.000.", false], ["C", "100 boletas.", "Es el número de boletas de niño; confunde las incógnitas al despejar.", false]]}, {"id": "RC-162", "niv": 3, "e": "Si el próximo año la boleta de adulto sube 25 %, la de niño mantiene su precio y se venden 80 boletas de adulto y 100 de niño, como este año, el recaudo será de", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: porcentajes aplicados a una parte de los datos.", "o": [["A", "$1.300.000.", "La boleta de adulto pasa a 8.000 × 1,25 = $10.000. Con 80 adultos y 100 niños: 80 × 10.000 + 100 × 5.000 = 800.000 + 500.000 = $1.300.000.", true], ["B", "$1.425.000.", "Aplica el 25 % a todo el recaudo (1.140.000 × 1,25), como si también subiera la boleta de niño.", false], ["C", "$1.500.000.", "Suma el aumento de $2.000 a las 180 boletas (1.140.000 + 180 × 2.000), como si todas fueran de adulto; solo suben las 80 boletas de adulto.", false]]}]}, {"comp": "razonamiento_cuantitativo", "rol": "docente", "tag": "Razonamiento cuantitativo", "texto": "La institución adecuará sus espacios para estudiantes con discapacidad y mejorará las zonas verdes. Se construirá una rampa para salvar un desnivel de 60 cm entre el patio y la biblioteca; el comité adoptó como criterio de diseño una pendiente máxima del 8 % (desnivel dividido entre la longitud horizontal). Además, se cercará y empradizará una zona verde circular de 6 m de diámetro. Para los cálculos use π = 3,14. Usted forma parte del comité de infraestructura.", "items": [{"id": "RC-163", "niv": 1, "e": "La longitud de cerca necesaria para rodear la zona verde es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: longitud de la circunferencia.", "o": [["A", "18,84 m.", "La longitud de la circunferencia es π × d = 3,14 × 6 = 18,84 m.", true], ["B", "28,26 m.", "Corresponde al área del círculo (π × 3² = 28,26 m²), no a la longitud de su contorno.", false], ["C", "37,68 m.", "Usa el diámetro como si fuera el radio en la fórmula 2πr (2 × 3,14 × 6).", false]]}, {"id": "RC-164", "niv": 2, "e": "El área de la zona verde que se debe empradizar es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: área del círculo.", "o": [["A", "9,42 m².", "Multiplica π por el radio (3,14 × 3) sin elevarlo al cuadrado.", false], ["B", "18,84 m².", "Calcula π × d, que es la longitud de la circunferencia, no el área del círculo.", false], ["C", "28,26 m².", "El radio es 6 ÷ 2 = 3 m y el área es π × r² = 3,14 × 9 = 28,26 m².", true]]}, {"id": "RC-165", "niv": 2, "e": "Para cumplir el criterio de pendiente, la longitud horizontal mínima de la rampa es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: razones, pendiente y conversión de unidades.", "o": [["A", "4,8 m.", "Multiplica el desnivel por 8 (0,6 × 8) en lugar de dividirlo entre 0,08.", false], ["B", "7,5 m.", "Pendiente = desnivel ÷ longitud horizontal. Con pendiente máxima 0,08: longitud ≥ 0,6 ÷ 0,08 = 7,5 m.", true], ["C", "75 m.", "Convierte mal el porcentaje a decimal: toma 8 % como 0,008 (0,6 ÷ 0,008 = 75). El 8 % equivale a 0,08.", false]]}, {"id": "RC-166", "niv": 3, "e": "Si la rampa se construye con la longitud horizontal mínima, la longitud de su superficie inclinada, aproximada a centésimas, es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: teorema de Pitágoras en situaciones reales.", "o": [["A", "7,48 m.", "Resta los cuadrados en el teorema de Pitágoras (√(7,5² − 0,6²)); la superficie inclinada es la hipotenusa, así que los cuadrados de los catetos se suman.", false], ["B", "7,50 m.", "Toma la longitud horizontal como si fuera la longitud inclinada; la superficie de la rampa es la hipotenusa y es mayor que el cateto horizontal.", false], ["C", "7,52 m.", "Por el teorema de Pitágoras: √(7,5² + 0,6²) = √(56,25 + 0,36) = √56,61 ≈ 7,52 m.", true]]}]}, {"comp": "razonamiento_cuantitativo", "rol": "docente", "tag": "Razonamiento cuantitativo", "texto": "Usted es el único docente de una escuela rural multigrado con 30 estudiantes: 4 de preescolar, 6 de primero, 5 de segundo, 7 de tercero, 3 de cuarto y 5 de quinto. Al iniciar el año recibe materiales y aplica una prueba de lectura. Los cuadernos llegan en paquetes de 12 unidades y no se abren paquetes de otras escuelas.", "items": [{"id": "RC-167", "niv": 1, "e": "El porcentaje de estudiantes de la escuela que cursa tercero es aproximadamente", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: porcentajes y frecuencias relativas.", "o": [["A", "7 %.", "Toma el número de estudiantes de tercero (7) como si fuera el porcentaje, sin dividir entre el total de 30.", false], ["B", "16,7 %.", "Supone que cada uno de los 6 grados tiene la misma proporción de estudiantes (1/6); los grados tienen tamaños distintos.", false], ["C", "23,3 %.", "Tercero tiene 7 de los 30 estudiantes: 7 ÷ 30 ≈ 0,233, es decir, cerca del 23,3 %.", true]]}, {"id": "RC-168", "niv": 2, "e": "Si cada estudiante de primero a quinto debe recibir 3 cuadernos y preescolar no usa cuadernos, el número mínimo de paquetes que usted debe solicitar es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: operaciones en contexto y redondeo por exceso.", "o": [["A", "6 paquetes.", "Trunca el cociente 78 ÷ 12 = 6,5; con 6 paquetes solo hay 72 cuadernos y faltarían 6.", false], ["B", "7 paquetes.", "De primero a quinto hay 6 + 5 + 7 + 3 + 5 = 26 estudiantes, que necesitan 26 × 3 = 78 cuadernos. 78 ÷ 12 = 6,5, así que se requieren 7 paquetes.", true], ["C", "8 paquetes.", "Incluye a los 4 estudiantes de preescolar (30 × 3 = 90 cuadernos; 90 ÷ 12 = 7,5 → 8), aunque ese nivel no usa cuadernos.", false]]}, {"id": "RC-169", "niv": 3, "e": "En la prueba de lectura, los 18 estudiantes de primero a tercero obtuvieron un promedio de 60 puntos y los 8 de cuarto y quinto, un promedio de 75. Para que el promedio de los 26 estudiantes llegue a 66 en la siguiente aplicación, si el promedio de primero a tercero se mantiene en 60, el promedio de cuarto y quinto debe ser", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: promedio ponderado y planteamiento de ecuaciones.", "o": [["A", "72 puntos.", "Razona como si los dos grupos tuvieran el mismo tamaño (el promedio de 60 y 72 es 66); con 18 y 8 estudiantes, el grupo pequeño debe compensar más.", false], ["B", "75 puntos.", "Supone que basta con mantener el resultado actual; con 75 el promedio general es (1.080 + 600) ÷ 26 ≈ 64,6, que no llega a 66.", false], ["C", "79,5 puntos.", "El total requerido es 66 × 26 = 1.716 puntos. Primero a tercero aportan 18 × 60 = 1.080, así que cuarto y quinto deben aportar 636: 636 ÷ 8 = 79,5.", true]]}]}, {"comp": "razonamiento_cuantitativo", "rol": "docente", "tag": "Razonamiento cuantitativo", "texto": "Usted aplicó una prueba diagnóstica de 20 preguntas a 40 estudiantes de grado sexto y analiza cada pregunta. El índice de facilidad de una pregunta es la proporción de estudiantes que la responden bien. Para el índice de discriminación, se toman los 10 estudiantes con puntaje total más alto (grupo alto) y los 10 con puntaje total más bajo (grupo bajo), y se calcula: (aciertos del grupo alto − aciertos del grupo bajo) ÷ 10. En la pregunta 1 acertaron 28 de los 40 estudiantes; en el grupo alto acertaron 9 y en el grupo bajo, 4.", "items": [{"id": "RC-170", "niv": 1, "e": "El índice de facilidad de la pregunta 1 es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: razones y proporciones; lectura de datos.", "o": [["A", "0,28.", "Divide los aciertos entre 100, como si se tratara de un porcentaje; la base es el número de estudiantes que presentaron la prueba (40).", false], ["B", "0,30.", "Es la proporción de estudiantes que fallaron (12 ÷ 40); el índice de facilidad usa los aciertos.", false], ["C", "0,70.", "Acertaron 28 de 40 estudiantes: 28 ÷ 40 = 0,70.", true]]}, {"id": "RC-171", "niv": 2, "e": "El índice de discriminación de la pregunta 1 es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: aplicación de fórmulas dadas en contexto.", "o": [["A", "0,125.", "Divide la diferencia de aciertos (5) entre los 40 estudiantes; la fórmula indicada divide entre 10, el tamaño de cada grupo.", false], ["B", "0,25.", "Divide la diferencia (5) entre 20, sumando los dos grupos; la fórmula del caso divide entre 10.", false], ["C", "0,5.", "Según la fórmula del caso: (9 − 4) ÷ 10 = 5 ÷ 10 = 0,5.", true]]}, {"id": "RC-172", "niv": 2, "e": "Si en la pregunta 2 el índice de facilidad fue 0,35, el número de estudiantes que respondió mal esa pregunta es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: proporciones y complemento.", "o": [["A", "26 estudiantes.", "Acertaron 0,35 × 40 = 14 estudiantes, así que respondieron mal 40 − 14 = 26.", true], ["B", "35 estudiantes.", "Lee el índice 0,35 como si fuera un número de estudiantes; es una proporción que debe multiplicarse por 40.", false], ["C", "65 estudiantes.", "Calcula la proporción de quienes fallaron (1 − 0,35 = 0,65) y la toma como número de estudiantes, sin multiplicar por 40.", false]]}, {"id": "RC-173", "niv": 3, "e": "En la pregunta 3 acertaron 3 estudiantes del grupo alto y 7 del grupo bajo. Con base en este resultado, usted concluye razonablemente que", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: interpretación de indicadores y validación de conclusiones.", "o": [["A", "la pregunta es muy fácil, porque un índice de discriminación negativo indica que casi todos la acertaron.", "Confunde discriminación con facilidad: el signo negativo indica que el grupo bajo acierta más que el alto, no que la pregunta sea fácil; solo 10 de los 20 estudiantes de ambos grupos la acertaron.", false], ["B", "la pregunta funciona al revés de lo esperado y conviene revisar su clave y su redacción antes de usarla para calificar.", "El índice es (3 − 7) ÷ 10 = −0,4: la aciertan más los estudiantes con bajo desempeño general. Un índice negativo suele indicar una clave errada o una redacción confusa.", true], ["C", "la pregunta discrimina bien, porque entre los dos grupos hay una diferencia de 4 aciertos.", "Considera la magnitud de la diferencia e ignora su sentido; una buena discriminación requiere que el grupo alto acierte más que el bajo.", false]]}]}, {"comp": "razonamiento_cuantitativo", "rol": "docente", "tag": "Razonamiento cuantitativo", "texto": "El comité de bienestar encuestó a 200 familias de la institución sobre conectividad. De las 120 familias que tienen internet en casa, 90 tienen computador y 30 no. De las 80 familias que no tienen internet, 20 tienen computador y 60 no. Usted debe presentar los resultados al consejo directivo para orientar la estrategia de guías impresas y préstamo de equipos.", "items": [{"id": "RC-174", "niv": 1, "e": "El porcentaje de familias encuestadas que tiene internet en casa es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: porcentajes en tablas de doble entrada.", "o": [["A", "40 %.", "Es el porcentaje de familias sin internet (80 ÷ 200), es decir, el complemento de lo que se pregunta.", false], ["B", "45 %.", "Cuenta solo las familias con internet y computador (90 ÷ 200); la pregunta incluye también las 30 que tienen internet sin computador.", false], ["C", "60 %.", "Tienen internet 120 de las 200 familias: 120 ÷ 200 = 60 %.", true]]}, {"id": "RC-175", "niv": 3, "e": "Entre las familias que tienen computador, el porcentaje que también tiene internet es aproximadamente", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: porcentajes condicionales en tablas de doble entrada.", "o": [["A", "45 %.", "Divide entre el total de familias (90 ÷ 200); la pregunta restringe la base a las familias con computador.", false], ["B", "75 %.", "Invierte la condición: 90 ÷ 120 es el porcentaje de familias con computador entre las que tienen internet.", false], ["C", "81,8 %.", "Tienen computador 90 + 20 = 110 familias; de ellas, 90 tienen internet: 90 ÷ 110 ≈ 81,8 %.", true]]}, {"id": "RC-176", "niv": 2, "e": "El porcentaje de familias encuestadas que tiene computador es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: porcentajes y error de promediar porcentajes con bases distintas.", "o": [["A", "45 %.", "Solo cuenta las familias con computador que también tienen internet; faltan las 20 que tienen computador sin internet.", false], ["B", "50 %.", "Promedia los porcentajes de cada grupo (75 % y 25 %) sin considerar que los grupos tienen tamaños distintos (120 y 80 familias).", false], ["C", "55 %.", "Tienen computador 90 + 20 = 110 familias de 200: 110 ÷ 200 = 55 %.", true]]}, {"id": "RC-177", "niv": 2, "e": "Con los datos de la encuesta, la conclusión válida que usted puede presentar al consejo es que", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: interpretación de tablas y validación de conclusiones.", "o": [["A", "tener computador es más frecuente entre las familias con internet (75 %) que entre las que no lo tienen (25 %).", "Con internet: 90 ÷ 120 = 75 % tiene computador. Sin internet: 20 ÷ 80 = 25 %. La comparación usa porcentajes dentro de cada grupo, que tienen tamaños distintos.", true], ["B", "el 60 % de las familias no tiene ni internet ni computador, porque son 60 familias.", "Confunde una cantidad absoluta con un porcentaje: 60 familias de 200 son el 30 %.", false], ["C", "la mayoría de las familias sin internet tiene computador, así que basta con instalarles conexión.", "Contradice los datos: de las 80 familias sin internet, solo 20 (25 %) tienen computador.", false]]}]}, {"comp": "razonamiento_cuantitativo", "rol": "directivo", "tag": "Razonamiento cuantitativo", "texto": "Una fundación donó 1.800 libros a una institución con tres sedes. La sede A tiene 450 estudiantes y 1.200 libros en su biblioteca; la sede B, 300 estudiantes y 600 libros; y la sede C, 150 estudiantes y 400 libros. Usted, como rector, debe proponer criterios de reparto y analizar los préstamos de la biblioteca central, que fueron 1.250 en el primer semestre y 1.500 en el segundo.", "items": [{"id": "RC-178", "niv": 1, "e": "Si los libros donados se reparten en proporción directa al número de estudiantes de cada sede, la sede A recibe", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: reparto directamente proporcional.", "o": [["A", "450 libros.", "Asigna un libro por estudiante; el reparto proporcional distribuye todos los 1.800 libros según la fracción de estudiantes de cada sede.", false], ["B", "600 libros.", "Divide los libros en partes iguales entre las tres sedes (1.800 ÷ 3), lo que no es un reparto proporcional al número de estudiantes.", false], ["C", "900 libros.", "Hay 450 + 300 + 150 = 900 estudiantes. La sede A tiene 450/900 = 1/2 de ellos, así que recibe 1.800 × 1/2 = 900 libros.", true]]}, {"id": "RC-179", "niv": 3, "e": "Si, en cambio, los libros donados se reparten en proporción inversa al número de libros que ya tiene cada sede, la sede A recibe", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: reparto inversamente proporcional.", "o": [["A", "300 libros.", "Los inversos 1/1.200, 1/600 y 1/400 están en la razón 1 : 2 : 3. Con 6 partes, cada parte es 1.800 ÷ 6 = 300; la sede A recibe 1 parte: 300 libros.", true], ["B", "600 libros.", "Reparte en partes iguales (1.800 ÷ 3) y no aplica la proporcionalidad inversa.", false], ["C", "900 libros.", "Asigna a la sede A lo que le correspondería en un reparto directo por número de estudiantes (450/900 de 1.800); en un reparto inverso a los libros existentes, la sede con más libros recibe la menor parte.", false]]}, {"id": "RC-180", "niv": 2, "e": "Del primer al segundo semestre, los préstamos de la biblioteca central aumentaron un", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: variación porcentual.", "o": [["A", "16,7 %.", "Divide el aumento (250) entre el valor final (1.500); la base de la variación es el valor inicial, 1.250.", false], ["B", "20 %.", "El aumento es 1.500 − 1.250 = 250 préstamos, y 250 ÷ 1.250 = 0,2 = 20 %.", true], ["C", "120 %.", "Es la razón entre los dos valores (1.500 ÷ 1.250 = 1,2); significa que el segundo semestre fue el 120 % del primero, es decir, un aumento del 20 %.", false]]}]}, {"comp": "razonamiento_cuantitativo", "rol": "docente", "tag": "Razonamiento cuantitativo", "texto": "En segundo de primaria, usted mide la fluidez lectora en palabras por minuto (ppm) con un texto de 180 palabras. La meta institucional para final de año es de 90 ppm. Pedro leyó el texto completo en 1 minuto 48 segundos y Luisa, en 2 minutos 15 segundos. Al final del año, Luisa pasó de 80 a 96 ppm y Pedro, de 100 a 118 ppm.", "items": [
