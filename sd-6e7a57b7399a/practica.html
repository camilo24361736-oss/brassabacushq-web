alidad del proceso de mediación.", false]]}]}, {"comp": "psicotecnica", "rol": "directivo", "tag": "Prueba psicotécnica · Competencias comportamentales (Guía 31, Decreto 1278 de 2002)", "texto": "Usted es rectora de una institución educativa de Cartagena. Una madre de familia llega sin cita a la rectoría, visiblemente alterada, y en voz alta reclama porque su hijo de séptimo perdió el período en tres áreas y, según ella, «nadie le avisó nada». Hay otros padres esperando en la recepción. Al revisar el sistema, usted encuentra que los informes se publicaron a tiempo en la plataforma virtual de la institución, pero la madre no tiene acceso a internet en su casa.", "items": [{"id": "DI-139", "niv": 1, "e": "Ante la llegada de la madre alterada, usted", "f": "MEN (2008). Guía 31, Anexo 1: Glosario de competencias (Comunicación y relaciones interpersonales).", "o": [["A", "la invita a pasar a su oficina, la escucha sin interrumpirla y le expresa que comprende su preocupación.", "Corresponde a comunicación y relaciones interpersonales: escuchar con atención, comprender los puntos de vista de los demás y manejar adecuadamente las emociones propias e identificar las de otros (Guía 31).", true], ["B", "le explica de inmediato que los informes se publicaron a tiempo en la plataforma, para aclarar el malentendido.", "La información es correcta, pero responder de entrada con argumentos, sin escuchar, suele aumentar la tensión y no reconoce la preocupación de la madre.", false], ["C", "le pide que solicite una cita formal en la secretaría, porque hay otros padres esperando su turno.", "Respeta el orden de atención, pero ignora el estado emocional de la madre y puede escalar el conflicto frente a otros padres.", false]]}, {"id": "DI-140", "niv": 2, "e": "Al explicarle la situación académica de su hijo, usted", "f": "MEN (2008). Guía 31, Anexo 1: Glosario de competencias (Comunicación y relaciones interpersonales).", "o": [["A", "le pide al director de grupo que la atienda, porque él conoce mejor el desempeño del estudiante.", "Involucrar al director de grupo puede ser útil, pero delegar la conversación en ese momento interrumpe el diálogo que ya inició con la madre.", false], ["B", "le entrega una copia impresa del boletín del período y le recomienda leer con atención el sistema institucional de evaluación.", "Entrega la información, pero no verifica que la madre la comprenda ni construye con ella un plan de acompañamiento.", false], ["C", "le muestra los resultados por área con un lenguaje sencillo y le pregunta qué necesita para acompañar al estudiante.", "Corresponde a comunicación y relaciones interpersonales: intercambiar ideas con efectividad y empatía, según las características del interlocutor, y formular preguntas claras y concretas (Guía 31).", true]]}, {"id": "DI-141", "niv": 3, "e": "Al descubrir que varias familias no tienen acceso a la plataforma, usted", "f": "MEN (2008). Guía 31, Anexo 1: Glosario de competencias (Comunicación y relaciones interpersonales).", "o": [["A", "promueve ajustar el SIEE, con los consejos académico y directivo, para entregar informes impresos a familias sin conectividad.", "Corresponde a comunicación y relaciones interpersonales, que implica comunicarse a través de diferentes estrategias y recursos según las características del contexto y de los participantes (Guía 31). La solución es institucional y sigue el cauce legal: la periodicidad y la forma de entrega de los informes hacen parte del SIEE, cuyos ajustes aprueba el consejo directivo (Decreto 1290 de 2009, arts. 4 y 8).", true], ["B", "recuerda en la siguiente circular que las familias deben consultar la plataforma en los plazos establecidos.", "Reafirma una norma, pero no atiende la barrera real de conectividad: el mensaje no llega a quienes más lo necesitan.", false], ["C", "le pide a la madre que se acerque a la institución cada período para recibir el informe en físico.", "Resuelve el caso de una familia, pero no el de las demás familias sin conectividad; es una solución individual a un problema institucional.", false]]}, {"id": "DI-142", "niv": 2, "e": "Ese mismo día, una madre que es amiga suya desde hace años le pide cambiar de grupo a su hija sin seguir el procedimiento institucional. Usted", "f": "MEN (2008). Guía 31, Anexo 1: Glosario de competencias (Compromiso social e institucional).", "o": [["A", "accede al cambio por esta única vez, ya que el grupo de destino tiene cupo disponible y la solicitud de la madre parece razonable.", "La solicitud puede ser razonable, pero tramitarla por fuera del procedimiento por amistad antepone un interés personal al institucional y afecta la equidad con las demás familias.", false], ["B", "remite la solicitud a la coordinadora sin explicarle el procedimiento, para no involucrarse por la amistad.", "Evita un conflicto de interés, pero traslada el caso sin orientar a la madre ni dejar claro que debe seguirse el procedimiento, de modo que no asume su responsabilidad con transparencia.", false], ["C", "le explica con amabilidad el procedimiento y le ofrece orientación para presentar la solicitud por el canal establecido.", "Corresponde al compromiso social e institucional: asumir responsabilidades con ética, anteponiendo los intereses institucionales a los personales, acatar las normas institucionales y demostrar honestidad e integridad (Guía 31).", true]]}]}, {"comp": "psicotecnica", "rol": "directivo", "tag": "Prueba psicotécnica · Competencias comportamentales (Guía 31, Decreto 1278 de 2002)", "texto": "Usted es director rural de un centro educativo con cinco sedes multigrado en una zona rural dispersa del Meta. Varias familias son víctimas del conflicto armado y algunos estudiantes caminan más de una hora para llegar a la escuela. En temporada de lluvias la asistencia cae notablemente. La secretaría de educación convocó a los directivos a una jornada de formación sobre el sistema de matrícula el mismo día en que usted tenía programada una visita de acompañamiento a la sede más alejada.", "items": [{"id": "DI-154", "niv": 2, "e": "Frente al cruce entre la jornada de formación y la visita a la sede, usted", "f": "MEN (2008). Guía 31, Anexo 1: Glosario de competencias (Compromiso social e institucional).", "o": [["A", "cancela la visita sin fecha nueva, pues la formación es obligatoria y la sede podrá visitarse más adelante.", "Atiende la convocatoria, pero deja sin acompañamiento a la sede más alejada y no responde con oportunidad a esa responsabilidad.", false], ["B", "asiste a la formación y reprograma la visita para la semana siguiente, avisando con anticipación a la docente de la sede.", "Corresponde al compromiso social e institucional: acatar las políticas del sector, responder con oportunidad a las tareas asignadas y cumplir la responsabilidad con la sede reprogramando el acompañamiento (Guía 31).", true], ["C", "envía a la formación a la docente de la sede principal para no cancelar la visita, aunque ella no maneja la matrícula.", "Busca cumplir ambas tareas, pero delega en alguien que no tiene esa responsabilidad una formación dirigida a los directivos, por lo que la institución no recibe la información donde se necesita.", false]]}, {"id": "DI-155", "niv": 1, "e": "Frente a la baja asistencia en temporada de lluvias, usted", "f": "MEN (2008). Guía 31, Anexo 1: Glosario de competencias (Orientación al logro).", "o": [["A", "solicita a la secretaría apoyo de transporte para la temporada de lluvias y espera su respuesta antes de ajustar el trabajo pedagógico.", "Gestionar transporte es pertinente, pero condicionar el ajuste pedagógico a una respuesta externa aplaza la atención a los aprendizajes de los estudiantes afectados.", false], ["B", "analiza con los docentes la asistencia por sede y diseña con las familias estrategias de trabajo en casa y de recuperación.", "Corresponde a la orientación al logro: dirigir el comportamiento hacia estándares elevados, mostrar persistencia frente a los obstáculos y procurar resultados de excelencia para los estudiantes (Guía 31).", true], ["C", "pide a los docentes que avancen con los estudiantes que sí asisten, para no atrasar el desarrollo del plan de estudios previsto para el año.", "Prioriza cumplir el plan de estudios, pero deja atrás a quienes no pueden asistir y aumenta las brechas de aprendizaje.", false]]}, {"id": "DI-156", "niv": 3, "e": "Para reducir las dificultades de desplazamiento de los estudiantes, usted", "f": "MEN (2008). Guía 31, Anexo 1: Glosario de competencias (Iniciativa).", "o": [["A", "gestiona con la junta de acción comunal y la alcaldía alternativas de transporte, con datos de distancias y asistencia.", "Corresponde a la iniciativa: trabajar proactivamente, demostrar recursividad, anticipar situaciones y emprender soluciones a los problemas de la institución (Guía 31).", true], ["B", "recomienda a las familias matricular a sus hijos en la sede más cercana, aunque no ofrezca el grado que requieren.", "Intenta reducir la distancia, pero afecta la trayectoria escolar de los estudiantes al ubicarlos en un grado que no les corresponde.", false], ["C", "espera a que la secretaría de educación incluya el transporte escolar en su planeación, ya que es de su competencia.", "Puede ser cierto que la solución dependa de otras entidades, pero esperar sin gestionar alternativas ni aportar información no evidencia iniciativa.", false]]}, {"id": "DI-157", "niv": 2, "e": "Una docente le comenta que un estudiante víctima del conflicto se aísla y llora con frecuencia en clase. Usted", "f": "MEN (2008). Guía 31, Anexo 1: Glosario de competencias (Compromiso social e institucional).", "o": [["A", "convoca una reunión con todo el grupo para que los compañeros cuenten sus propias experiencias del conflicto.", "Puede tener intención pedagógica, pero expone al estudiante y a sus compañeros sin preparación ni apoyo profesional.", false], ["B", "solicita a la secretaría que envíe un profesional psicosocial y pide a la docente no intervenir hasta recibir su concepto.", "Buscar apoyo profesional es útil, pero mientras tanto deja al estudiante sin acompañamiento de la docente y no involucra a la familia.", false], ["C", "acuerda con la docente una conversación cuidadosa con la familia y, si se requiere, activa la ruta con las entidades competentes.", "Corresponde al compromiso social e institucional: asumir con ética la responsabilidad de proteger al estudiante, mostrar respeto hacia él y su familia y reflexionar sobre la responsabilidad social del educador (Guía 31).", true]]}]}, {"comp": "psicotecnica", "rol": "directivo", "tag": "Prueba psicotécnica · Competencias comportamentales (Guía 31, Decreto 1278 de 2002)", "texto": "Usted es coordinadora académica de una institución educativa de Rionegro (Antioquia) con media técnica en desarrollo de software. Los docentes de la especialidad trabajan aislados del resto: los de matemáticas y lenguaje se quejan de que nunca los consultan, y los de la técnica sienten que las demás áreas «no entienden lo que hacemos». Una empresa de la región ofreció apoyo para los proyectos de grado de los estudiantes de once.", "items": [{"id": "DI-158", "niv": 1, "e": "Para mejorar la relación entre los docentes de la especialidad y los de las demás áreas, usted", "f": "MEN (2008). Guía 31, Anexo 1: Glosario de competencias (Trabajo en equipo).", "o": [["A", "pide a cada área entregar por escrito sus contenidos para que usted elabore un documento de articulación.", "Produce un documento, pero la articulación queda en manos de la coordinadora y no genera colaboración real entre los docentes.", false], ["B", "conforma equipos mixtos que planeen juntos un proyecto integrador para once, con metas y responsabilidades compartidas.", "Corresponde al trabajo en equipo: trabajar cooperativamente y construir relaciones de colaboración para el logro de objetivos compartidos, propiciando la conformación de equipos (Guía 31).", true], ["C", "programa reuniones separadas con cada grupo de docentes, para escuchar sus quejas sin generar confrontaciones.", "Escuchar es útil, pero mantener a los grupos separados refuerza el aislamiento que se busca superar.", false]]}, {"id": "DI-159", "niv": 2, "e": "Frente al ofrecimiento de la empresa, usted", "f": "MEN (2008). Guía 31, Anexo 1: Glosario de competencias (Iniciativa).", "o": [["A", "presenta una propuesta de alianza con objetivos pedagógicos claros y la lleva a las instancias de la institución.", "Corresponde a la iniciativa: proponer y desarrollar proyectos novedosos y trabajar proactivamente, articulando la oportunidad con las instancias institucionales (Guía 31).", true], ["B", "autoriza a los docentes de la técnica para que acuerden directamente con la empresa los proyectos de cada estudiante.", "Delega con buena intención, pero deja la alianza sin orientación pedagógica institucional y profundiza el aislamiento de la especialidad.", false], ["C", "agradece el ofrecimiento y lo deja para el próximo año, cuando el plan de estudios de la media técnica esté ajustado.", "Parece prudente, pero desaprovecha una oportunidad presente; la iniciativa implica anticipar y emprender alternativas sin esperar condiciones ideales.", false]]}, {"id": "DI-160", "niv": 3, "e": "En una reunión, un docente de lenguaje le dice que la coordinación ha favorecido a la media técnica en la asignación de recursos. Usted", "f": "MEN (2008). Guía 31, Anexo 1: Glosario de competencias (Trabajo en equipo).", "o": [["A", "le agradece el comentario y le propone tratarlo más adelante, cuando haya un espacio específico para ese tema.", "Es cortés, pero aplaza sin compromiso concreto una crítica que podría mejorar la gestión; no actúa en consecuencia.", false], ["B", "le explica que la media técnica requiere más recursos por su propia naturaleza y, con esa explicación, da por resuelta la inquietud del docente.", "La explicación puede ser cierta, pero responde a la crítica con una justificación y no la examina; no considera la contribución del docente.", false], ["C", "le pide ejemplos concretos, revisa con el equipo los criterios de asignación y ajusta lo que resulte inequitativo.", "Corresponde al trabajo en equipo: aceptar críticas constructivas y actuar en consecuencia, y considerar las contribuciones de los demás en la toma de decisiones (Guía 31).", true]]}]}, {"comp": "psicotecnica", "rol": "docente", "tag": "Prueba psicotécnica · Competencias comportamentales (Guía 31, Decreto 1278 de 2002)", "texto": "Usted y otros dos docentes de ciencias naturales deben presentar en un mes el proyecto ambiental escolar (PRAE) del año. En la primera reunión, uno de sus colegas propone repetir la jornada de reciclaje del año anterior porque «ya está probada»; la otra colega quiere un proyecto de huerta escolar con participación de las familias. La discusión sube de tono, ambos le piden a usted que «decida» y la reunión termina sin acuerdos.", "items": [{"id": "PS-001", "niv": 1, "e": "En la siguiente reunión, para resolver el desacuerdo entre sus colegas, usted decide", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Negociación y mediación).", "o": [["A", "elegir la propuesta que considere mejor, ya que ambos colegas le pidieron que tomara la decisión.", "Decidir por los demás puede cerrar la discusión, pero no genera un acuerdo ni compromiso de las partes; la negociación y mediación implica soluciones concertadas y duraderas.", false], ["B", "escuchar los argumentos de ambos y proponer criterios comunes para decidir juntos.", "Corresponde a la competencia de negociación y mediación: identificar y comprender las causas del conflicto con imparcialidad y facilitar acuerdos anteponiendo los intereses comunes (Guía 31, glosario de competencias).", true], ["C", "pedir al coordinador que asigne el proyecto, para evitar que el conflicto afecte la relación del equipo.", "Trasladar a otro una situación que el equipo puede resolver evita el conflicto en lugar de gestionarlo; no evidencia intervención efectiva y oportuna ante el conflicto.", false]]}, {"id": "PS-002", "niv": 1, "e": "Una vez acordada la propuesta, para organizar el trabajo del proyecto con sus dos colegas, usted", "f": "MEN (2008). Guía 31, Anexo 1: Glosario de competencias (Trabajo en equipo).", "o": [["A", "asume la mayor parte de las tareas para asegurar que el proyecto se entregue a tiempo.", "Concentrar las tareas puede parecer compromiso, pero no construye colaboración ni aprovecha los aportes de los demás, aspectos centrales del trabajo en equipo.", false], ["B", "divide el proyecto en tres partes iguales para que cada docente trabaje de forma independiente.", "Repartir partes sin espacios de articulación fragmenta el proyecto; el trabajo en equipo implica cooperación y revisión conjunta, no solo división de tareas.", false], ["C", "distribuye las tareas según las fortalezas de cada uno y acuerda momentos para revisar avances juntos.", "Evidencia trabajo en equipo: construir relaciones de colaboración para objetivos compartidos, considerar las contribuciones de los demás y propiciar la organización del equipo para el desarrollo de proyectos (Guía 31).", true]]}, {"id": "PS-003", "niv": 2, "e": "Días después, el colega que propuso la jornada de reciclaje le dice que se sintió ignorado en la reunión. Usted", "f": "MEN (2008). Guía 31, Anexo 1: Glosario de competencias (Comunicación y relaciones interpersonales).", "o": [["A", "lo escucha con atención, reconoce su malestar y le propone integrar al proyecto elementos de su propuesta.", "Corresponde a comunicación y relaciones interpersonales: escuchar con atención, comprender los puntos de vista de los demás e identificar y comprender sus emociones, favoreciendo relaciones cordiales y asertivas (Guía 31).", true], ["B", "le explica que la decisión ya fue tomada por el equipo y que lo más conveniente ahora es avanzar con el proyecto.", "Aunque la decisión esté tomada, responder solo con el resultado desconoce la emoción del colega y no favorece relaciones basadas en la confianza.", false], ["C", "le sugiere que exprese su inconformidad en la próxima reunión de área para que todos la conozcan.", "Remitir el tema a otro espacio evita la conversación directa que el colega está buscando; no demuestra escucha ni manejo de las emociones de otros.", false]]}]}, {"comp": "psicotecnica", "rol": "docente", "tag": "Prueba psicotécnica · Competencias comportamentales (Guía 31, Decreto 1278 de 2002)", "texto": "En la institución donde usted trabaja, los resultados de las pruebas Saber 11 en matemáticas bajaron por segundo año consecutivo. El rector convoca a los docentes del área a una reunión para analizar la situación. Algunos colegas atribuyen el problema a la falta de interés de los estudiantes y a que «la secundaria llega mal preparada desde primaria». Usted es docente de matemáticas de grado décimo.", "items": [{"id": "PS-004", "niv": 1, "e": "En la reunión, frente a los resultados, usted propone", "f": "MEN (2008). Guía 31, Anexo 1: Glosario de competencias (Orientación al logro; Evaluación del aprendizaje).", "o": [["A", "solicitar a los docentes de primaria que refuercen las bases matemáticas antes de que los estudiantes lleguen a secundaria.", "Atribuir la responsabilidad a otros niveles no dirige la acción propia hacia el mejoramiento; no evidencia orientación al logro ni compromiso con los resultados del área.", false], ["B", "dedicar las clases de grado once a entrenar a los estudiantes con preguntas tipo Saber hasta la fecha de la prueba.", "Entrenar solo para la prueba puede mejorar un resultado puntual, pero no atiende las causas en el aprendizaje ni involucra el análisis de los resultados para ajustar la práctica pedagógica.", false], ["C", "analizar los resultados por competencia y ajustar las prácticas del área en los aspectos con más bajo desempeño.", "Corresponde a orientación al logro: dirigir el comportamiento hacia estándares elevados con miras al mejoramiento continuo y procurar que los estudiantes obtengan resultados de excelencia (Guía 31). También refleja la competencia funcional de evaluación del aprendizaje.", true]]}, {"id": "PS-005", "niv": 2, "e": "Un colega le dice que «no vale la pena esforzarse, porque los estudiantes no quieren aprender». Usted", "f": "MEN (2008). Guía 31, Anexo 1: Glosario de competencias (Liderazgo; Trabajo en equipo). Decreto 1278 de 2002, artículo 34.", "o": [["A", "le recuerda que su evaluación de desempeño depende de los resultados de los estudiantes en la prueba.", "Usar la evaluación como amenaza no motiva ni construye confianza; tampoco es preciso, pues la evaluación de desempeño valora múltiples aspectos (Decreto 1278, art. 34).", false], ["B", "le comparte una estrategia que le ha funcionado y lo invita a probarla juntos en uno de sus grupos.", "Corresponde al liderazgo y al trabajo en equipo: influir positivamente en el comportamiento de los demás, expresar expectativas positivas y compartir aprendizajes y recursos (Guía 31).", true], ["C", "le da la razón para no generar tensiones y se concentra en mejorar solo los resultados de sus propios grupos.", "Evita el conflicto, pero renuncia a influir positivamente en el equipo y a construir una meta común, aspectos del liderazgo y del trabajo en equipo.", false]]}, {"id": "PS-006", "niv": 1, "e": "Para actualizarse en estrategias de enseñanza de las matemáticas, usted", "f": "MEN (2008). Guía 31, Anexo 1: Glosario de competencias (Iniciativa).", "o": [["A", "busca formación en recursos y cursos disponibles, y aplica en su aula lo que aprende.", "Corresponde a la iniciativa: realizar acciones que faciliten el aprendizaje permanente y la actualización en su disciplina, actuar con autonomía y proponer ideas novedosas (Guía 31).", true], ["B", "espera a que la secretaría de educación programe una capacitación del área.", "Depender de que otros programen la formación no evidencia iniciativa, entendida como trabajar proactivamente y con autonomía frente a las responsabilidades.", false], ["C", "solicita al rector que contrate a un experto para que capacite a todo el equipo.", "Puede ser útil, pero traslada a otro la responsabilidad de su propia actualización; la iniciativa implica actuar con autonomía, sin necesidad de supervisión.", false]]}]}, {"comp": "psicotecnica", "rol": "docente", "tag": "Prueba psicotécnica · Liderazgo", "texto": "Usted es el único docente de la sede La Esperanza, una escuela multigrado de una vereda del Cauca con 22 estudiantes de preescolar a quinto. Este año la institución educativa, de la cual hace parte la sede, incorporó a su PEI un énfasis en agroecología y le pidió a cada sede desarrollar una huerta escolar como proyecto pedagógico que integre las áreas. Varias familias desconfían de la propuesta: algunos padres opinan que la huerta quita tiempo para aprender a leer y escribir, y otros dicen que esas labores ya las aprenden los niños en sus casas. La asistencia de las familias a las reuniones de la sede suele ser baja.", "items": [{"id": "PS-101", "niv": 1, "e": "Para que las familias se vinculen con el nuevo énfasis institucional desde el inicio del año, usted decide", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Liderazgo).", "o": [["A", "convocarlas a una jornada en la huerta en la que vean cómo se relaciona con lo que aprenden sus hijos e invitarlas a asumir tareas en ella.", "Evidencia liderazgo, definido en la Guía 31 como la «capacidad para motivar e involucrar a los miembros de la comunidad educativa con la construcción de una identidad común y el desarrollo de la visión institucional». El docente transmite con sus acciones la visión institucional y logra que las familias se comprometan con metas comunes al participar directamente en el proyecto.", true], ["B", "enviar a cada familia una circular que resuma el nuevo énfasis aprobado en el PEI y los objetivos de la huerta escolar.", "Informar es necesario, pero una circular es una comunicación de una sola vía que no motiva ni involucra a familias que ya desconfían y asisten poco. No se evidencia la conducta de liderazgo de influir positivamente en los demás para que se comprometan con metas comunes.", false], ["C", "desarrollar la huerta solo con los estudiantes durante el primer semestre y presentar los resultados a las familias al finalizarlo.", "Mostrar resultados antes de convocar puede parecer prudente, pero deja a las familias al margen justo cuando el proyecto define su sentido. El liderazgo, según la Guía 31, implica involucrar a la comunidad en la construcción de una identidad común, no solo informarle al final.", false]]}, {"id": "PS-102", "niv": 2, "e": "En una reunión, un padre afirma que la huerta es «una pérdida de tiempo» porque los niños van a la escuela a aprender a leer. Frente a esta crítica, usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Liderazgo).", "o": [["A", "le da la razón en parte y reduce las horas de huerta en la sede para dedicarlas a lectura y escritura, como piden las familias.", "Ceder ante la crítica evita el conflicto, pero abandona la visión institucional que la sede debe desarrollar y no demuestra al padre que la huerta también fortalece la lectura y la escritura. El liderazgo implica comprometer a la comunidad con la visión, no renunciar a ella.", false], ["B", "le explica que el énfasis fue aprobado por la institución y que la sede debe aplicarlo de la misma manera que lo hacen las demás sedes.", "Apelar a la decisión institucional es cierto, pero no convence ni compromete; impone la visión en lugar de construirla con la comunidad. El liderazgo exige plantear orientaciones convincentes e influir positivamente, no solo recordar la obligación.", false], ["C", "le muestra con trabajos de los niños cómo en la huerta leen, miden y escriben, y lo invita a orientar una sesión sobre cultivos.", "Corresponde al liderazgo (Guía 31): el docente «plantea orientaciones convincentes, expresa expectativas positivas de los demás» e «influye positivamente en el comportamiento de los demás y logra que se comprometan con el logro de metas comunes». Convierte al padre crítico en participante del proyecto institucional.", true]]}, {"id": "PS-103", "niv": 2, "e": "En el encuentro mensual de docentes de las sedes rurales, un colega de otra vereda comenta que quiere iniciar su huerta, pero no tiene semillas ni experiencia. Usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Trabajo en equipo).", "o": [["A", "le recomienda solicitar las semillas a la oficina agropecuaria del municipio, que suele entregarlas a las escuelas rurales.", "Es una orientación útil, pero remite al colega a un tercero en lugar de aportar lo que usted ya tiene. El trabajo en equipo, según la Guía 31, implica compartir aprendizajes y recursos con otros miembros de la institución y ofrecer apoyo para su trabajo.", false], ["B", "le ofrece semillas de su huerta y le propone que los estudiantes de ambas sedes intercambien los registros de sus cultivos.", "Evidencia trabajo en equipo (Guía 31): «comparte aprendizajes y recursos con diferentes miembros de la institución y ofrece apoyo para el trabajo de otros», construyendo relaciones de colaboración para el logro de un objetivo compartido por todas las sedes.", true], ["C", "le sugiere esperar a que su propia huerta dé resultados este año para enviarle después una guía completa del proceso.", "La intención de compartir algo terminado es buena, pero aplaza el apoyo cuando el colega lo necesita y desaprovecha la oportunidad de aprender juntos. No evidencia la cooperación oportuna que define el trabajo en equipo.", false]]}, {"id": "PS-104", "niv": 3, "e": "Usted sabe que el próximo año podría ser trasladado. Para que la huerta continúe como parte de la identidad de la sede, usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Liderazgo).", "o": [["A", "elabora un manual detallado con el paso a paso de la huerta y lo entrega a la coordinación para el docente que llegue.", "Documentar es valioso, pero la continuidad queda en manos de una sola persona y de un documento. No fortalece la capacidad de la comunidad para sostener el proyecto, que es lo que busca el liderazgo al «promover cambios y transformaciones que aumenten la capacidad institucional».", false], ["B", "solicita a la rectoría que el docente que lo reemplace asuma la huerta como una responsabilidad obligatoria de su cargo.", "Asegurar la continuidad por vía de una orden traslada el proyecto a la autoridad y a una persona, sin que la comunidad lo asuma como propio. El liderazgo se orienta a construir una identidad común, no a imponer la tarea a otro docente.", false], ["C", "conforma con estudiantes y padres un comité de la huerta y deja con ellos por escrito los acuerdos y rutinas del proyecto.", "Corresponde al liderazgo (Guía 31): «promueve cambios y transformaciones que aumenten la capacidad institucional» e involucra a la comunidad en la construcción de una identidad común. Al hacer corresponsables a estudiantes y familias, el proyecto no depende solo del docente.", true]]}]}, {"comp": "psicotecnica", "rol": "docente", "tag": "Prueba psicotécnica · Comunicación y relaciones interpersonales", "texto": "Usted es director de grupo de tercero en un colegio oficial de Bogotá. La madre de Samuel envió al grupo de WhatsApp de padres del curso un audio en el que afirma, molesta, que usted «la tiene montada» con su hijo porque le ha hecho tres anotaciones en la agenda por no entregar tareas. Otros padres respondieron con mensajes de apoyo a la madre y algunos aprovecharon para criticar al colegio. Usted sabe que Samuel ha incumplido varias tareas en el último mes, aunque antes era un estudiante cumplido.", "items": [{"id": "PS-105", "niv": 1, "e": "Frente al audio publicado en el grupo de padres, usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Comunicación y relaciones interpersonales).", "o": [["A", "responde en el grupo con el detalle de las tareas pendientes de Samuel, para que los demás padres conozcan los hechos.", "Aclarar los hechos puede parecer transparente, pero expone a un estudiante ante otras familias y escala la discusión pública. No se ajusta al contexto ni a los participantes, como exige la competencia comunicativa de la Guía 31.", false], ["B", "responde en el grupo que con gusto atenderá la inquietud y escribe en privado a la madre para acordar una reunión.", "Evidencia comunicación y relaciones interpersonales (Guía 31): intercambia ideas «según las características del contexto y los participantes del proceso comunicativo», con una respuesta cordial y asertiva que no expone al estudiante y lleva la conversación a un espacio adecuado.", true], ["C", "no responde en el grupo y espera a que la madre se acerque al colegio, para no alimentar la discusión entre los padres.", "Evitar la discusión pública tiene sentido, pero el silencio deja sin respuesta la inquietud y puede aumentar la desconfianza. La competencia implica favorecer relaciones basadas en la confianza mediante una comunicación oportuna.", false]]}, {"id": "PS-106", "niv": 2, "e": "Al iniciar la reunión, la madre sigue alterada, levanta la voz y dice que su hijo «no es ningún vago». Usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Comunicación y relaciones interpersonales).", "o": [["A", "la escucha sin interrumpir, reconoce que está preocupada por su hijo y le pregunta qué ha notado en casa con las tareas.", "Corresponde a comunicación y relaciones interpersonales (Guía 31): «escucha con atención y comprende puntos de vista de los demás», «maneja y expresa adecuadamente sus emociones e identifica y comprende las de otros» y «realiza preguntas claras, concretas y que permiten aclarar una idea o situación».", true], ["B", "le propone continuar la conversación con la coordinadora presente, para que un tercero garantice el respeto en la reunión.", "Buscar apoyo puede ser útil si la situación se agrava, pero en este momento traslada a otro una conversación que usted puede manejar. No demuestra las habilidades sociales en interacciones profesionales que describe la competencia.", false], ["C", "le muestra de inmediato las anotaciones de la agenda y las fechas de las tareas, para que vea que los llamados fueron justificados.", "Presentar pruebas al inicio pone la conversación en términos de quién tiene la razón y aumenta la tensión. La Guía 31 pide manejar las emociones e identificar y comprender las de otros antes de exponer argumentos.", false]]}, {"id": "PS-107", "niv": 3, "e": "Durante la conversación, la madre cuenta que trabaja hasta las ocho de la noche y que Samuel pasa las tardes solo. Para acordar cómo apoyar las tareas, usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Comunicación y relaciones interpersonales).", "o": [["A", "le explica la importancia del acompañamiento familiar y le entrega por escrito el horario de tareas de la semana.", "El mensaje es claro, pero desconoce lo que la madre acaba de contar sobre su horario: repite una exigencia general que ella no puede cumplir. No se adapta al contexto del participante, como exige la Guía 31.", false], ["B", "le propone que Samuel haga las tareas en la biblioteca del colegio en la jornada contraria, con apoyo de los docentes de turno.", "Busca una solución, pero la decide usted sin conocer si es viable para la familia y compromete a otros docentes sin consultarlos. La competencia implica construir el intercambio con el interlocutor según sus características, no resolver por él.", false], ["C", "le pregunta en qué momentos puede acompañarlo y, con esa información, acuerdan una forma de seguimiento que ella pueda cumplir.", "Evidencia comunicación y relaciones interpersonales (Guía 31): realiza preguntas que aclaran la situación y ajusta el intercambio «según las características del contexto y los participantes», favoreciendo una relación basada en la confianza y acuerdos realistas.", true]]}]}, {"comp": "psicotecnica", "rol": "docente", "tag": "Prueba psicotécnica · Trabajo en equipo", "texto": "Usted acaba de llegar como docente de ciencias naturales a un colegio de Barranquilla. La coordinación le asigna, junto con una docente de lenguaje que lleva doce años en la institución y un docente de ciencias sociales, el diseño de un proyecto interdisciplinario para noveno sobre el manejo del agua en el barrio. El equipo tiene un mes para entregar la guía del proyecto y su rúbrica de evaluación, y luego cada docente orientará el trabajo con los estudiantes en sus clases.", "items": [{"id": "PS-108", "niv": 1, "e": "En la primera reunión, la docente de lenguaje propone que el producto final sea un ensayo argumentativo. Usted pensaba en un informe de laboratorio. Usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Trabajo en equipo).", "o": [["A", "acepta la propuesta sin comentarios, porque la colega conoce mejor la institución y a los estudiantes.", "Deferir a la experiencia de otro parece respetuoso, pero el equipo pierde su aporte disciplinar. La Guía 31 señala que en el trabajo en equipo el docente «aporta sugerencias, ideas y opiniones».", false], ["B", "reconoce lo que aporta el ensayo y propone que los estudiantes lo argumenten con datos de un análisis de laboratorio.", "Evidencia trabajo en equipo (Guía 31): «aporta sugerencias, ideas y opiniones» y «considera las contribuciones de los demás en la toma de decisiones», integrando ambas propuestas en un objetivo compartido.", true], ["C", "presenta datos que muestran que el informe de laboratorio desarrolla mejor las competencias científicas que un ensayo.", "Argumentar con datos es valioso, pero plantea la reunión como una competencia entre propuestas y no construye sobre el aporte de la colega. No se evidencia la consideración de las contribuciones de los demás.", false]]}, {"id": "PS-109", "niv": 3, "e": "El coordinador revisa la rúbrica que el equipo diseñó y comenta que es demasiado extensa para aplicarla en el aula. Usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Trabajo en equipo).", "o": [["A", "lleva la observación al equipo, revisan juntos qué criterios pueden integrarse y ajustan la rúbrica antes de aplicarla.", "Corresponde al trabajo en equipo (Guía 31): «acepta críticas constructivas y actúa en consecuencia» y lo hace con el equipo, considerando las contribuciones de los demás en la toma de decisiones sobre un producto compartido.", true], ["B", "reduce usted mismo la rúbrica esa noche y la entrega corregida al día siguiente, para no quitarle tiempo al equipo.", "Acepta la crítica y actúa con diligencia, pero modifica solo un producto que es del equipo y deja por fuera las decisiones de sus colegas. El trabajo en equipo exige considerar las contribuciones de los demás, no solo responder rápido.", false], ["C", "explica al coordinador las razones de cada criterio, para que comprenda por qué la rúbrica quedó tan extensa.", "Justificar el trabajo es legítimo, pero responde a la crítica defendiéndose en lugar de evaluarla. La Guía 31 incluye en el trabajo en equipo que el docente «acepta críticas constructivas y actúa en consecuencia».", false]]}, {"id": "PS-110", "niv": 2, "e": "Faltan tres días para iniciar el proyecto con los estudiantes y el docente de sociales aún no entrega su parte de la guía. Usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Trabajo en equipo).", "o": [["A", "le pregunta qué le ha impedido avanzar y le ofrece un apoyo concreto para que pueda terminar a tiempo su parte.", "Evidencia trabajo en equipo (Guía 31): «ofrece apoyo para el trabajo de otros» y establece relaciones profesionales que potencian el logro de la meta del equipo, sin desplazar al colega de su responsabilidad.", true], ["B", "informa a la coordinadora del retraso, para que ella le recuerde al docente el compromiso adquirido con el equipo.", "Acudir a la coordinación puede ser necesario si el problema persiste, pero como primera respuesta traslada a la autoridad algo que el equipo puede resolver. No evidencia el apoyo entre pares que describe la competencia.", false], ["C", "redacta la parte faltante con material de sociales que encuentre, para no retrasar el inicio del proyecto.", "Asumir la tarea de otro asegura el plazo, pero excluye al colega de su propia responsabilidad y su saber disciplinar. El trabajo en equipo implica construir relaciones de colaboración, no sustituir a los demás.", false]]}]}, {"comp": "psicotecnica", "rol": "docente", "tag": "Prueba psicotécnica · Negociación y mediación", "texto": "En un colegio oficial de Medellín, los estudiantes de octavo y de décimo se disputan la cancha de microfútbol durante el descanso. En la última semana hubo gritos y empujones en tres ocasiones, aunque nadie resultó lastimado. Los de décimo dicen que la cancha «siempre ha sido de ellos» y los de octavo afirman que no los dejan jugar nunca. Usted es el director de grupo de octavo y uno de los docentes de acompañamiento del descanso.", "items": [{"id": "PS-111", "niv": 2, "e": "Durante su turno de acompañamiento, los empujones entre los dos grupos vuelven a empezar en la cancha. Usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Negociación y mediación). Decreto 1965 de 2013, art. 42 (situaciones tipo I).", "o": [["A", "solicita a coordinación suspender el uso de la cancha hasta que ambos grupos mejoren su comportamiento.", "Suspender el uso de forma indefinida traslada el conflicto a la autoridad y castiga a todos sin resolver la causa. No abre un espacio para soluciones concertadas, que es el núcleo de la negociación y mediación.", false], ["B", "reúne allí mismo a los dos grupos para que cada uno exponga su versión y acuerden en ese momento cómo compartir la cancha.", "La intención de dialogar es adecuada, pero intentar un acuerdo en medio de la agresión, sin detenerla primero, no es una intervención efectiva: los ánimos impiden escuchar y un acuerdo logrado bajo presión difícilmente es duradero. La mediación viene después de restablecer la calma.", false], ["C", "detiene el juego, separa a los grupos, suspende el uso de la cancha en ese descanso y cita a representantes de ambos grados para el día siguiente.", "Evidencia negociación y mediación (Guía 31): «interviene efectiva y oportunamente ante situaciones de conflicto»: primero frena la agresión y protege a los estudiantes, y luego abre un espacio en calma para identificar y comprender «las causas y el contexto» del conflicto con imparcialidad (Decreto 1965 de 2013, art. 42).", true]]}, {"id": "PS-112", "niv": 2, "e": "En la reunión, los representantes de décimo insisten en que tienen prioridad «porque siempre ha sido así». Usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Negociación y mediación).", "o": [["A", "les recuerda que el manual de convivencia garantiza a todos los estudiantes el uso de los espacios comunes por igual.", "El argumento normativo es correcto, pero cierra la discusión desde la norma en lugar de construir un acuerdo que las partes sientan como propio. La Guía 31 pide facilitar acuerdos multilaterales que generen confianza.", false], ["B", "pregunta a ambos grupos qué criterios serían justos para todos y los invita a proponer opciones de uso compartido.", "Corresponde a negociación y mediación (Guía 31): «facilita acuerdos y soluciones multilaterales, anteponiendo los intereses comunes y generando confianza en el proceso de mediación», y promueve un escenario de concertación justo y equitativo.", true], ["C", "propone a los de octavo ceder esta vez, dado que décimo lleva más tiempo usando la cancha, para no prolongar el conflicto.", "Busca terminar rápido la tensión, pero valida una costumbre que no es equitativa y deja insatisfecha a una de las partes. La negociación y mediación promueve escenarios de concertación justos y equitativos.", false]]}, {"id": "PS-113", "niv": 3, "e": "Los grupos acuerdan un horario rotativo para la cancha. Para que el acuerdo se mantenga, usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Negociación y mediación). Decreto 1965 de 2013, art. 42 (situaciones tipo I: mediación y seguimiento).", "o": [["A", "hace firmar a los representantes un acta de compromiso que especifique las sanciones si alguno incumple el horario.", "Dejar constancia puede ser parte del proceso, pero centrar el acuerdo en las sanciones privilegia el control sobre la confianza. La competencia busca escenarios de concertación basados en la confianza, la solidaridad y el respeto, con seguimiento.", false], ["B", "publica el horario en la cartelera y pide a los docentes de turno en el descanso que lo hagan cumplir.", "Divulgar el acuerdo es útil, pero confiar su cumplimiento solo a la vigilancia de los adultos no fortalece el compromiso de las partes ni prevé ajustes. La Guía 31 asocia la mediación con soluciones duraderas y seguimiento a los compromisos.", false], ["C", "acuerda con los representantes una revisión a las dos semanas para evaluar cómo ha funcionado y ajustarlo si es necesario.", "Evidencia negociación y mediación (Guía 31): «promueve soluciones duraderas y hace seguimiento a los compromisos adquiridos por las partes», manteniendo a los estudiantes como corresponsables del acuerdo.", true]]}, {"id": "PS-114", "niv": 1, "e": "Para que sus estudiantes de octavo aprendan a manejar desacuerdos como este con más autonomía, usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Negociación y mediación).", "o": [["A", "incorpora en la dirección de grupo ejercicios de diálogo y negociación basados en situaciones reales del curso.", "Corresponde a negociación y mediación (Guía 31): el docente «forma a sus estudiantes en estrategias de resolución pacífica de conflictos», usando experiencias reales para que las practiquen.", true], ["B", "solicita a la orientadora escolar una charla sobre convivencia para el grupo en la próxima hora de dirección de grupo.", "Apoyarse en la orientación escolar es válido, pero delega una tarea formativa que la Guía 31 atribuye al propio docente: «forma a sus estudiantes en estrategias de resolución pacífica de conflictos».", false], ["C", "acuerda con el grupo una norma de aula según la cual todo desacuerdo se informa de inmediato a un docente.", "Buscar ayuda adulta es prudente en situaciones graves, pero convertirlo en norma para todo desacuerdo genera dependencia y no desarrolla habilidades de negociación en los estudiantes.", false]]}]}, {"comp": "psicotecnica", "rol": "docente", "tag": "Prueba psicotécnica · Compromiso social e institucional", "texto": "Usted es docente de la media técnica agropecuaria en una institución rural del Huila. Los estudiantes de once deben cumplir 120 horas de práctica en unidades productivas, y el reglamento de prácticas de la institución permite reponer hasta 10 horas de inasistencia con trabajo supervisado. Los cupos se asignan en un comité de prácticas del que usted hace parte. Este año, una empresa cafetera cuyo gerente es su hermano ofreció cinco cupos de práctica bien organizados. Además, varios estudiantes viven lejos del casco urbano, donde están casi todas las empresas.", "items": [{"id": "PS-115", "niv": 3, "e": "Ante la oferta de la empresa cafetera, usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Compromiso social e institucional). Ley 1952 de 2019, art. 44 (conflicto de intereses).", "o": [["A", "rechaza los cupos, para evitar cualquier comentario sobre un posible favorecimiento a su familia.", "Busca proteger su imagen, pero priva a los estudiantes de una práctica de calidad por una razón personal. El compromiso social e institucional implica anteponer los intereses institucionales a los personales, y el conflicto de interés se maneja declarándolo, no eliminando la oportunidad.", false], ["B", "informa al comité que el gerente es su hermano y se abstiene de participar en las decisiones sobre esos cupos.", "Evidencia compromiso social e institucional (Guía 31): «demuestra honestidad e integridad en su ejercicio profesional», anteponiendo el interés institucional. Declararse impedido cuando un pariente tiene interés en el asunto es la conducta que exige la norma disciplinaria (Ley 1952 de 2019, art. 44).", true], ["C", "acepta los cupos y los asigna a estudiantes destacados, porque conoce la seriedad de la empresa y garantiza una buena práctica.", "La intención es ofrecer una buena práctica, pero decidir sobre un asunto en el que su hermano tiene interés configura un conflicto de interés no declarado. No evidencia la honestidad e integridad que exige la competencia.", false]]}, {"id": "PS-116", "niv": 1, "e": "Un estudiante en práctica le pide que firme su asistencia de una semana completa en la que faltó por ayudar en la cosecha de su familia. Usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Compromiso social e institucional).", "o": [["A", "registra las ausencias y le informa que deberá repetir la práctica completa el próximo semestre.", "Es honesto con el registro, pero aplica una consecuencia más severa de la prevista y no orienta al estudiante sobre la reposición que permite el reglamento. El compromiso institucional implica acatar las normas tal como están definidas y con respeto hacia el estudiante.", false], ["B", "registra las ausencias como ocurrieron y le explica cómo reponer horas con trabajo supervisado según el reglamento.", "Corresponde al compromiso social e institucional (Guía 31): «demuestra honestidad e integridad en su ejercicio profesional» y «acata y divulga las normas y políticas [...] institucionales», orientando al estudiante sobre la reposición prevista.", true], ["C", "firma la asistencia, considerando que el estudiante trabajó en una labor agrícola relacionada con su formación técnica.", "Comprende la situación del estudiante, pero certifica algo que no ocurrió. Falta a la honestidad e integridad que la Guía 31 asocia al compromiso social e institucional y desconoce el reglamento de prácticas.", false]]}, {"id": "PS-117", "niv": 3, "e": "Varios estudiantes que viven lejos no pueden pagar el transporte diario hasta las empresas del casco urbano. Usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Iniciativa).", "o": [["A", "informa la situación a la secretaría de educación y espera una respuesta sobre un posible subsidio de transporte.", "Gestionar ante la secretaría es razonable, pero esperar su respuesta deja a los estudiantes sin alternativa mientras tanto. La iniciativa implica trabajar «proactivamente y con autonomía frente a las responsabilidades».", false], ["B", "solicita que esos estudiantes reemplacen la práctica presencial por un trabajo escrito sobre una unidad productiva.", "Resuelve el problema del transporte, pero rebaja la calidad de la formación técnica al eliminar la experiencia práctica. No es una solución novedosa que mantenga el propósito de la práctica.", false], ["C", "propone organizar prácticas en fincas de la vereda, con un plan de seguimiento acordado con la institución.", "Evidencia iniciativa (Guía 31): «demuestra recursividad y flexibilidad, y se adapta con rapidez a diferentes contextos» y propone una alternativa novedosa que aprovecha el entorno rural para que los estudiantes cumplan su formación.", true]]}]}, {"comp": "psicotecnica", "rol": "docente", "tag": "Prueba psicotécnica · Iniciativa", "texto": "Una creciente del río inundó gran parte de un corregimiento de La Mojana, en Sucre. La sede principal del colegio funcionará como albergue durante al menos tres semanas y las clases presenciales se suspendieron. Usted es docente de quinto de primaria. Muchas familias perdieron cuadernos y libros; la mayoría tiene un celular con WhatsApp, pero la señal es intermitente. Algunos de sus estudiantes están en el albergue con sus familias y otros se trasladaron a casas de parientes en veredas cercanas.", "items": [{"id": "PS-118", "niv": 1, "e": "Para que sus estudiantes no interrumpan su proceso de aprendizaje durante la emergencia, usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Iniciativa).", "o": [["A", "diseña guías cortas que pueden enviarse por WhatsApp o entregarse impresas, y acuerda con las familias cómo devolverlas.", "Evidencia iniciativa (Guía 31): «demuestra recursividad y flexibilidad, y se adapta con rapidez a diferentes contextos», con una alternativa ajustada a la conectividad y a los recursos reales de las familias.", true], ["B", "espera las orientaciones de la secretaría de educación sobre el plan de contingencia para la zona afectada.", "Seguir las orientaciones oficiales es necesario, pero esperar sin actuar deja a los estudiantes sin acompañamiento durante semanas. La Guía 31 asocia la iniciativa con actuar «con autonomía sin necesidad de supervisión».", false], ["C", "asigna los talleres del libro de texto por WhatsApp, para que cada estudiante avance por su cuenta durante el cierre.", "Busca mantener el ritmo del programa, pero ignora que muchas familias perdieron sus libros y que la señal es intermitente. No muestra la adaptación al contexto que exige la competencia.", false]]}, {"id": "PS-119", "niv": 2, "e": "Usted observa que los niños del albergue pasan el día sin actividades. Usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Iniciativa).", "o": [["A", "dicta en el albergue las clases de su horario habitual, para que los estudiantes no pierdan los contenidos del período.", "Muestra disposición, pero replica la rutina escolar sin adaptarla a la emergencia ni a las necesidades de niños desplazados de sus casas. La iniciativa implica flexibilidad y adaptación al contexto.", false], ["B", "sugiere a los coordinadores del albergue solicitar al ICBF un equipo de recreación para atender a los niños.", "Es una gestión pertinente, pero traslada a otros una acción que usted puede emprender de inmediato con los recursos disponibles. No evidencia el trabajo proactivo que define la iniciativa.", false], ["C", "propone a los coordinadores del albergue un espacio diario de lectura y juego, que organiza con jóvenes voluntarios de la comunidad.", "Corresponde a la iniciativa (Guía 31): «propone y desarrolla ideas novedosas, investigaciones, experiencias o proyectos, para influir positivamente en la institución y la comunidad», actuando de forma proactiva ante una necesidad que identificó.", true]]}, {"id": "PS-120", "niv": 2, "e": "Al regresar a clases, cerca de la mitad del grupo no avanzó en las guías durante la emergencia. Usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Orientación al logro).", "o": [["A", "valora lo que logró cada estudiante y reorganiza el período con apoyos para quienes más lo necesitan, sin rebajar las metas.", "Evidencia orientación al logro (Guía 31): «demuestra esfuerzo y persistencia en la consecución de sus objetivos, afrontando obstáculos y situaciones difíciles» y «procura que los estudiantes [...] obtengan resultados de excelencia», ajustando la ruta sin bajar la meta.", true], ["B", "continúa el plan de área desde donde quedó y programa refuerzos al final del período para quienes no alcancen los logros esperados.", "Conserva el cronograma, pero deja que el rezago se acumule hasta el final. No refleja el esfuerzo y la persistencia frente a obstáculos que exige la orientación al logro.", false], ["C", "ajusta los logros del período a lo que el grupo alcanzó durante la emergencia, para no presionar a los estudiantes.", "Muestra comprensión por la situación, pero rebaja las metas de aprendizaje de todo el grupo. La orientación al logro, según la Guía 31, dirige el comportamiento hacia estándares elevados y procura resultados de excelencia.", false]]}, {"id": "PS-121", "niv": 1, "e": "Una colega de la sede, cuyo grupo de cuarto también quedó sin clases, le dice que no sabe cómo trabajar sin conectividad. Usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Trabajo en equipo).", "o": [["A", "le recomienda buscar en internet ejemplos de guías diseñadas para zonas sin conectividad.", "Es un consejo útil, pero la deja sola con el problema cuando usted ya tiene una solución probada. No evidencia la conducta de compartir aprendizajes y recursos que describe el trabajo en equipo.", false], ["B", "le comparte las guías que diseñó y le ofrece adaptarlas juntos para el grado de ella.", "Corresponde al trabajo en equipo (Guía 31): «comparte aprendizajes y recursos con diferentes miembros de la institución y ofrece apoyo para el trabajo de otros», en función de un objetivo común durante la emergencia.", true], ["C", "le sugiere pedir a la coordinación un formato único de guía para que todos los docentes de la sede trabajen igual.", "Unificar puede ser útil más adelante, pero ahora traslada la solución a la coordinación y retrasa el apoyo que la colega necesita. El trabajo en equipo implica cooperar directamente entre pares.", false]]}]}, {"comp": "psicotecnica", "rol": "docente", "tag": "Prueba psicotécnica · Orientación al logro", "texto": "Usted es docente de cuarto de primaria en un colegio oficial de Cali. En la prueba diagnóstica de lectura aplicada al inicio del año, el 60 % de su grupo quedó en nivel bajo de comprensión lectora: los estudiantes localizan información explícita, pero tienen dificultad para inferir y para identificar la idea principal de un texto. El grupo tiene 38 estudiantes, varios con ritmos de aprendizaje distintos, y la institución definió como prioridad del plan de mejoramiento elevar la comprensión lectora en primaria.", "items": [{"id": "PS-122", "niv": 1, "e": "Al conocer los resultados de la prueba diagnóstica, usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Orientación al logro).", "o": [["A", "se fija metas concretas de mejora para el grupo en el período y ajusta su plan de lectura para alcanzarlas.", "Evidencia orientación al logro (Guía 31): «capacidad para dirigir el comportamiento propio hacia el cumplimiento de estándares elevados, con miras al mejoramiento continuo»; el docente «tiene metas [...] profesionales elevadas» y organiza su trabajo para alcanzarlas.", true], ["B", "comparte los resultados con las familias y les pide reforzar la lectura en casa durante todo el período.", "Vincular a las familias es valioso, pero aquí se usa para trasladarles la responsabilidad del avance sin que el docente ajuste su propia práctica. No refleja el compromiso propio con estándares elevados que define la competencia.", false], ["C", "los atribuye a que la prueba se aplicó en una semana con muchas interrupciones y espera la siguiente aplicación para confirmarlos.", "Atribuir el resultado a factores externos evita asumirlo como un reto propio y retrasa la acción. La orientación al logro implica dirigir el comportamiento propio hacia estándares elevados, con miras al mejoramiento continuo.", false]]}, {"id": "PS-123", "niv": 2, "e": "Seis semanas después, el avance es menor al esperado y un colega le comenta que «con ese grupo no se puede hacer más». Usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Orientación al logro).", "o": [["A", "reduce la meta a un nivel más realista para que el grupo no se desmotive con los resultados.", "Busca proteger la motivación, pero renuncia al estándar elevado ante el primer obstáculo. La Guía 31 describe la competencia como esfuerzo y persistencia «afrontando obstáculos y situaciones difíciles».", false], ["B", "intensifica las actividades de lectura que venía haciendo y aumenta el tiempo diario dedicado a ellas.", "Muestra esfuerzo, pero repite más de lo mismo sin analizar por qué no funcionó. La orientación al logro se dirige al mejoramiento continuo, lo que implica revisar y ajustar las estrategias, no solo aumentar su dosis.", false], ["C", "revisa en sus registros qué estrategias dieron resultado, cambia las que no y mantiene la meta acordada.", "Corresponde a orientación al logro (Guía 31): «demuestra esfuerzo y persistencia en la consecución de sus objetivos, afrontando obstáculos y situaciones difíciles», con un ajuste basado en evidencias que apunta al mejoramiento continuo.", true]]}, {"id": "PS-124", "niv": 3, "e": "Una estudiante del grupo comprende los textos con facilidad, termina rápido las actividades y empieza a distraerse. Usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Orientación al logro).", "o": [["A", "reconoce su desempeño con la máxima nota y le permite leer libremente lo que desee mientras sus compañeros terminan.", "Reconocer el desempeño es positivo, pero la lectura libre sin propósito no le plantea un nuevo nivel de exigencia. No evidencia la búsqueda de estándares elevados para cada estudiante.", false], ["B", "le propone retos de lectura más complejos según sus intereses y la invita a escribir sus propios textos.", "Evidencia orientación al logro (Guía 31): el docente «procura que los estudiantes de la institución obtengan resultados de excelencia», también los de desempeño sobresaliente, con metas que les exigen avanzar.", true], ["C", "le asigna como tarea permanente apoyar a los compañeros con más dificultades mientras el resto termina.", "La tutoría entre pares es valiosa de manera ocasional, pero como respuesta permanente posterga los retos de aprendizaje de la estudiante. La orientación al logro procura que todos los estudiantes, incluidos los sobresalientes, obtengan resultados de excelencia.", false]]}, {"id": "PS-125", "niv": 2, "e": "Para que mejorar la comprensión lectora se convierta en un propósito de todos los docentes de primaria, usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Liderazgo).", "o": [["A", "continúa con su estrategia en su grupo y espera a que los resultados convenzan por sí solos a los demás docentes.", "Dar ejemplo es importante, pero esperar pasivamente desaprovecha la oportunidad de movilizar al equipo hacia una prioridad institucional. El liderazgo implica motivar e involucrar activamente a los demás.", false], ["B", "presenta en la reunión de docentes sus avances y estrategias, e invita a sus colegas a plantear una meta común de lectura.", "Corresponde al liderazgo (Guía 31): «influye positivamente en el comportamiento de los demás y logra que se comprometan con el logro de metas comunes» y transmite con sus acciones la prioridad institucional del plan de mejoramiento.", true], ["C", "propone a la coordinación que exija a todos los docentes aplicar su plan de lectura en sus grupos.", "Generalizar lo que funciona es buena idea, pero hacerlo por imposición no logra el compromiso de los colegas. El liderazgo, según la Guía 31, consiste en motivar e involucrar a los demás con la visión institucional.", false]]}]}, {"comp": "psicotecnica", "rol": "docente", "tag": "Prueba psicotécnica · Compromiso social e institucional", "texto": "Usted es docente de física en un colegio oficial de Bucaramanga. Este año, el consejo directivo aprobó una modificación del sistema institucional de evaluación (SIEE) que obliga a los docentes a registrar avances de los estudiantes cada cuatro semanas, y no solo al final de cada período. Usted expresó su desacuerdo en la discusión, porque considera que aumenta el trabajo sin beneficios claros. Además, este año acompaña los fines de semana al equipo de baloncesto del colegio en un torneo intercolegiado del municipio.", "items": [{"id": "PS-126", "niv": 2, "e": "Una vez aprobada la modificación del SIEE, con la que usted no estuvo de acuerdo, usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Compromiso social e institucional). Decreto 1290 de 2009, art. 8 (aprobación del SIEE por el consejo directivo).", "o": [["A", "aplica el sistema aprobado en sus grupos y presenta sus observaciones por los canales previstos para su revisión.", "Evidencia compromiso social e institucional (Guía 31): «acata y divulga las normas y políticas nacionales, regionales e institucionales» y antepone los intereses institucionales a los personales, sin renunciar a proponer mejoras por las vías establecidas.", true], ["B", "sigue registrando los avances al final de cada período mientras se revisa la decisión, ya que dejó constancia de su desacuerdo.", "Haber dejado constancia del desacuerdo es legítimo, pero no autoriza a incumplir una decisión institucional vigente. La Guía 31 señala que el compromiso social e institucional implica que el docente «acata y divulga las normas y políticas [...] institucionales».", false], ["C", "aplica el sistema aprobado, pero aclara a sus estudiantes que no está de acuerdo con la nueva forma de evaluar.", "Cumple la norma, pero debilita ante los estudiantes una política institucional que debe divulgar. El desacuerdo se tramita en los espacios institucionales; la competencia implica identificarse con las políticas de la institución.", false]]}, {"id": "PS-127", "niv": 2, "e": "En un partido del torneo, el árbitro toma una decisión que perjudica al equipo del colegio y algunos padres empiezan a insultarlo desde la tribuna. Usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Compromiso social e institucional).", "o": [["A", "se mantiene al margen, porque lo que hagan los padres en un evento de fin de semana no depende de la institución.", "Es cierto que no controla a los padres, pero usted representa al colegio en el evento y su responsabilidad no termina fuera del aula. La competencia abarca el comportamiento ético y la representación institucional fuera del establecimiento.", false], ["B", "retira al equipo del partido en señal de protesta, para proteger a los estudiantes de una situación que considera injusta.", "Busca proteger a los estudiantes, pero responde con una acción que afecta la imagen de la institución y enseña a abandonar en lugar de reclamar por los canales previstos. No representa adecuadamente a la institución.", false], ["C", "mantiene la calma, pide a estudiantes y padres respetar la decisión y presenta el reclamo por el conducto del torneo.", "Corresponde al compromiso social e institucional (Guía 31): «exhibe un comportamiento ético dentro y fuera del establecimiento y representa adecuadamente a la institución en actividades fuera de la misma».", true]]}, {"id": "PS-128", "niv": 2, "e": "En clase, un estudiante de décimo le reclama con molestia, frente a sus compañeros, porque considera injusta la nota de su examen. Usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Comunicación y relaciones interpersonales).", "o": [["A", "le pide que, si no está de acuerdo, presente su reclamo por escrito ante la coordinación.", "Remitir a un trámite formal parece ordenado, pero evita la conversación directa que el estudiante busca con su docente y deja sin respuesta su inconformidad. No demuestra escucha ni comunicación asertiva.", false], ["B", "reconoce su derecho a reclamar y lo cita al final de la clase para revisar juntos el examen y los criterios.", "Evidencia comunicación y relaciones interpersonales (Guía 31): «escucha con atención y comprende puntos de vista de los demás», «maneja y expresa adecuadamente sus emociones» y elige el momento y el espacio adecuados para el intercambio.", true], ["C", "revisa el examen en ese momento frente al grupo, para que todos vean que los criterios se aplicaron por igual.", "Busca transparencia, pero expone al estudiante ante sus compañeros y convierte el reclamo en un acto público. No se ajusta al contexto ni favorece una relación de confianza.", false]]}, {"id": "PS-129", "niv": 3, "e": "Al revisar el examen con el estudiante, usted encuentra que sumó mal el puntaje y que la nota correcta es mayor, pero el sistema de notas del período ya se cerró. Usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Compromiso social e institucional).", "o": [["A", "reconoce el error y le compensa la diferencia en la nota del siguiente período, ya que el sistema del período está cerrado.", "Busca reparar el daño, pero deja un registro académico que no corresponde a la realidad y altera la evaluación de otro período. No evidencia la honestidad e integridad que exige la competencia.", false], ["B", "reconoce el error, pero le explica que ya no es posible modificar la nota porque el sistema del período se cerró.", "Es honesto al reconocer el error, pero antepone el procedimiento a la corrección de un registro que perjudica al estudiante. El compromiso institucional incluye responder con calidad y oportunidad, gestionando la corrección.", false], ["C", "reconoce el error ante el estudiante y solicita la corrección de la nota por el procedimiento que tenga la institución.", "Corresponde al compromiso social e institucional (Guía 31): «demuestra honestidad e integridad en su ejercicio profesional» y «responde con oportunidad, eficiencia y calidad», usando los canales institucionales para corregir el registro.", true]]}]}, {"comp": "psicotecnica", "rol": "docente", "tag": "Prueba psicotécnica · Comunicación y relaciones interpersonales", "texto": "Usted es docente de transición en una institución educativa de Riohacha, La Guajira. En su grupo está Shaira, una niña wayuu cuya familia llegó hace poco de una ranchería. En su casa se habla principalmente wayuunaiki; la madre entiende poco español y el padre lo habla con fluidez. La institución cuenta con una auxiliar administrativa wayuu que en ocasiones apoya a los docentes como intérprete. Shaira participa poco en las actividades grupales, aunque se interesa mucho por las actividades de dibujo y construcción.", "items": [{"id": "PS-130", "niv": 1, "e": "Para informar a la familia sobre los avances de Shaira en el primer período, usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Comunicación y relaciones interpersonales).", "o": [["A", "prepara la reunión con apoyo de la intérprete y lleva fotos y trabajos de la niña para mostrar sus avances.", "Evidencia comunicación y relaciones interpersonales (Guía 31): intercambia información «a través de diferentes estrategias y recursos, según las características del contexto y los participantes», y «combina adecuadamente los recursos expresivos del lenguaje oral, escrito y gráfico».", true], ["B", "envía con la niña el informe escrito del período, igual que lo hace con las demás familias del grupo.", "Tratar igual a todas las familias parece justo, pero un informe escrito en español no garantiza que esta familia comprenda los avances. La Guía 31 pide comunicar según las características del contexto y de los participantes.", false], ["C", "cita a la familia y explica despacio y en español sencillo los avances descritos en el informe del período.", "Hace un esfuerzo de adaptación, pero sigue dependiendo de un idioma que la madre entiende poco y de un solo recurso expresivo. No aprovecha los apoyos disponibles para lograr una comunicación efectiva.", false]]}, {"id": "PS-131", "niv": 2, "e": "En la reunión, el padre comenta que en su cultura los niños aprenden observando a los mayores y no entiende por qué en el colegio Shaira «juega tanto». Usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Comunicación y relaciones interpersonales).", "o": [["A", "le explica que el juego hace parte de los referentes de educación inicial del Ministerio y por eso se incluye en el grado.", "La información es correcta, pero responde con un argumento de autoridad que no conecta con la experiencia de la familia. La competencia implica intercambiar ideas con empatía y comprender el punto de vista del otro.", false], ["B", "le dice que comprende su punto de vista y que, para tranquilidad de la familia, reducirá los juegos en el caso de Shaira.", "Busca complacer al padre, pero renuncia a explicar el sentido pedagógico del juego y puede perjudicar el proceso de la niña. La comunicación asertiva expresa argumentos de forma clara y respetuosa, no los abandona para evitar el desacuerdo.", false], ["C", "le pregunta cómo aprende Shaira en casa y, a partir de esos ejemplos, le explica por qué el juego también es aprendizaje.", "Corresponde a comunicación y relaciones interpersonales (Guía 31): «escucha con atención y comprende puntos de vista de los demás, demostrando tolerancia frente a diferentes opiniones» y «expresa argumentos de forma clara y respetuosa», partiendo de la experiencia de la familia.", true]]}, {"id": "PS-132", "niv": 3, "e": "En una reunión posterior, la madre permanece callada y evita mirarlo; la intérprete le comenta que en su comunidad no se acostumbra contradecir a un maestro. Para saber si la familia está de acuerdo con los compromisos propuestos, usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Comunicación y relaciones interpersonales).", "o": [["A", "hace preguntas abiertas sobre cómo ven los compromisos en casa y propone continuar la conversación donde la familia se sienta cómoda.", "Evidencia comunicación y relaciones interpersonales (Guía 31): atiende el lenguaje no verbal, «identifica y comprende» las emociones de otros y «realiza preguntas [...] que permiten aclarar una idea o situación», ajustando el espacio al contexto cultural de la familia.", true], ["B", "le pide a la intérprete que, después de la reunión, averigüe en privado si la familia está realmente de acuerdo.", "La intención es conocer la opinión real, pero delega en otra persona la relación con la familia y no construye confianza directa. La competencia exige que el propio docente genere las condiciones para el intercambio.", false], ["C", "le pregunta directamente a la madre si está de acuerdo con cada compromiso y deja registradas sus respuestas en el acta.", "Las preguntas son claras y concretas, pero con la información que dio la intérprete, un «sí» puede ser solo cortesía y no un acuerdo real. No se ajusta a las características culturales del interlocutor.", false]]}]}, {"comp": "psicotecnica", "rol": "docente", "tag": "Prueba psicotécnica · Iniciativa", "texto": "Usted es docente de ciencias sociales de secundaria en un colegio oficial de Ibagué. Hace dos meses la institución recibió 30 tabletas con aplicaciones educativas instaladas, pero siguen guardadas en la biblioteca porque, según la coordinación, «nadie ha recibido la capacitación» que la secretaría de educación prometió. La biblioteca tiene un protocolo de préstamo para los equipos. La red wifi del colegio es lenta y se satura cuando se conectan muchos dispositivos al mismo tiempo.", "items": [{"id": "PS-133", "niv": 1, "e": "Ante la situación de las tabletas guardadas, usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Iniciativa).", "o": [["A", "lleva las tabletas a su salón y empieza a usarlas en sus clases, ya que llevan dos meses sin ningún uso.", "Muestra disposición a actuar, pero omite el protocolo de préstamo y la autorización institucional. La autonomía que describe la iniciativa no implica desconocer los procedimientos de la institución.", false], ["B", "explora por su cuenta las aplicaciones, diseña una clase piloto y propone usarlas con su grupo según el protocolo de préstamo.", "Evidencia iniciativa (Guía 31): «realiza acciones que le facilitan el aprendizaje permanente», «actúa con autonomía sin necesidad de supervisión» y «propone y desarrolla ideas novedosas», respetando los procedimientos institucionales.", true], ["C", "solicita a la coordinación que gestione con la secretaría la capacitación prometida antes de que alguien empiece a usarlas.", "Gestionar la capacitación es razonable, pero condicionar todo a ella mantiene los equipos sin uso indefinidamente. La iniciativa implica actuar «con autonomía sin necesidad de supervisión».", false]]}, {"id": "PS-134", "niv": 3, "e": "La clase piloto funciona y varios colegas le preguntan cómo usar las tabletas en sus áreas. Usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Trabajo en equipo).", "o": [["A", "les recomienda los cursos virtuales gratuitos en los que usted aprendió, para que se formen a su propio ritmo.", "Es una orientación útil, pero remite a recursos externos en lugar de compartir su experiencia y trabajar con los colegas. No evidencia la cooperación que define el trabajo en equipo.", false], ["B", "escribe un instructivo detallado para que cada colega pueda usar las tabletas por su cuenta sin necesidad de capacitación.", "Compartir un instructivo es un aporte, pero es una transferencia en una sola vía que no construye trabajo conjunto ni aprovecha lo que saben los colegas de sus áreas. El trabajo en equipo busca construir relaciones de colaboración.", false], ["C", "organiza con ellos un espacio corto para mostrar lo que hizo y diseñar juntos actividades para sus áreas.", "Corresponde al trabajo en equipo (Guía 31): «comparte aprendizajes y recursos con diferentes miembros de la institución» y «propicia la conformación de equipos para el desarrollo de proyectos», integrando los aportes de cada área.", true]]}, {"id": "PS-135", "niv": 2, "e": "Al preparar una nueva clase con las tabletas, usted anticipa que la red wifi no soportará a todo el grupo conectado al mismo tiempo. Usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Iniciativa).", "o": [["A", "organiza turnos de conexión para que cada estudiante use la tableta conectada unos minutos durante la clase.", "Es una salida práctica, pero reduce el tiempo de trabajo de cada estudiante y no resuelve el problema de fondo. Muestra poca recursividad frente a una limitación que se podía anticipar.", false], ["B", "descarga los contenidos con anticipación, diseña actividades sin conexión e informa la limitación a coordinación.", "Evidencia iniciativa (Guía 31): «anticipa situaciones futuras» y «demuestra recursividad y flexibilidad», resolviendo con autonomía la limitación sin dejar de informarla a la institución.", true], ["C", "reporta la limitación de la red a coordinación y aplaza el uso de las tabletas hasta que se mejore la conexión.", "Reportar la falla es correcto, pero aplazar la actividad hace depender el trabajo de una solución externa. La iniciativa implica buscar alternativas con los recursos disponibles.", false]]}]}, {"comp": "psicotecnica", "rol": "docente", "tag": "Prueba psicotécnica · Negociación y mediación", "texto": "Usted trabaja en un centro educativo rural de Santander con cinco docentes y una directora rural. La sede tiene una sola sala con computadores y conexión a internet. Dos colegas, ambas amigas suyas, discuten desde hace semanas por el uso de la sala: una necesita los equipos para un proyecto de investigación con quinto y la otra los usa para prácticas de lectura con primero. Los comentarios entre ellas se han vuelto tensos y el ambiente de las reuniones de docentes se ha deteriorado.", "items": [{"id": "PS-136", "niv": 2, "e": "Frente a la tensión entre sus colegas, usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Negociación y mediación).", "o": [["A", "les propone conversar los tres para que cada una explique qué necesita de la sala y acuerden una distribución.", "Evidencia negociación y mediación (Guía 31): «identifica y comprende las causas y el contexto de un conflicto, valorando con imparcialidad los motivos de los implicados» y facilita acuerdos multilaterales.", true], ["B", "se mantiene al margen para no tomar partido, ya que ambas son sus amigas y el asunto no lo involucra directamente.", "No tomar partido parece imparcial, pero el conflicto ya afecta al equipo y nadie interviene. La Guía 31 incluye en la negociación y mediación intervenir «efectiva y oportunamente ante situaciones de conflicto».", false], ["C", "sugiere a la directora rural que defina un horario fijo de la sala y lo comunique a todos los doc
