entes.", "Un horario fijo puede ordenar el uso, pero impuesto desde la dirección no atiende las causas del desacuerdo ni reconstruye la relación entre las colegas. No genera una solución concertada.", false]]}, {"id": "PS-137", "niv": 3, "e": "En la conversación, una de ellas dice que la otra «siempre consigue lo que quiere porque es amiga de la directora». Usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Negociación y mediación).", "o": [["A", "reconoce su malestar y propone acordar criterios objetivos para distribuir la sala entre ambas.", "Corresponde a negociación y mediación (Guía 31): comprende las causas del conflicto con imparcialidad y promueve «escenarios de concertación justos y equitativos con base en la confianza», con criterios que todos pueden verificar.", true], ["B", "ofrece ceder sus propias horas de sala para que ambas tengan más tiempo y así termine la discusión.", "Es un gesto generoso, pero resuelve el síntoma a costa de sus propios estudiantes y no construye un criterio que las partes perciban como justo. No promueve soluciones duraderas.", false], ["C", "le pide que retire el comentario, porque los señalamientos personales impiden continuar la conversación.", "Poner un límite al señalamiento es comprensible, pero se centra en la forma y deja sin atender la percepción de inequidad que está en la raíz del conflicto. No identifica ni comprende sus causas.", false]]}, {"id": "PS-138", "niv": 2, "e": "Una vez acordado el horario de la sala, una de las colegas no lo cumple durante la primera semana. Usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Negociación y mediación).", "o": [["A", "informa a la directora rural del incumplimiento, para que tome las medidas que considere necesarias.", "Informar a la directora puede ser necesario si el incumplimiento persiste, pero como primera respuesta escala el conflicto y debilita la confianza construida en el acuerdo. No refleja el seguimiento propio de la mediación.", false], ["B", "conversa con ella para conocer qué pasó y revisar si el acuerdo necesita algún ajuste.", "Evidencia negociación y mediación (Guía 31): «promueve soluciones duraderas y hace seguimiento a los compromisos adquiridos por las partes», generando confianza en el proceso.", true], ["C", "deja pasar la situación, porque una semana no es suficiente para saber si el acuerdo está funcionando.", "Tener paciencia parece sensato, pero ignorar el primer incumplimiento debilita el acuerdo y puede reavivar el conflicto. La competencia exige hacer seguimiento a los compromisos.", false]]}]}, {"comp": "psicotecnica", "rol": "docente", "tag": "Prueba psicotécnica · Liderazgo", "texto": "Usted es docente de educación física en un colegio oficial de Pasto. La institución tiene como uno de sus valores la convivencia pacífica, y el comité de convivencia identificó que la mayoría de conflictos entre estudiantes ocurren en los descansos. Usted propuso el proyecto «Recreos activos», con juegos y torneos organizados en el patio, y el comité lo aprobó con la meta de reducir en 40 % los conflictos reportados en el descanso durante el año. Al inicio, pocos estudiantes y docentes muestran interés.", "items": [{"id": "PS-139", "niv": 1, "e": "Para lograr que estudiantes y docentes se comprometan con los recreos activos, usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Liderazgo).", "o": [["A", "elabora el cronograma de actividades y solicita a coordinación que la participación sea obligatoria para todos los cursos.", "La obligatoriedad asegura asistencia, pero no motivación ni apropiación. El liderazgo, según la Guía 31, busca «motivar e involucrar» a la comunidad con la visión institucional.", false], ["B", "organiza usted mismo todas las actividades de los primeros meses para demostrar que el proyecto funciona.", "Muestra compromiso personal, pero concentra el proyecto en una sola persona y no involucra a la comunidad. El liderazgo consiste en lograr que otros se comprometan con metas comunes.", false], ["C", "invita a los líderes estudiantiles a diseñar con usted las actividades y a explicar a sus compañeros cómo aportan a la convivencia.", "Evidencia liderazgo (Guía 31): «capacidad para motivar e involucrar a los miembros de la comunidad educativa con la construcción de una identidad común», y transmite el valor institucional de la convivencia a través de los propios estudiantes.", true]]}, {"id": "PS-140", "niv": 3, "e": "Un grupo de estudiantes de once se burla de los recreos activos y desanima a los más pequeños. Usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Liderazgo).", "o": [["A", "les explica que su actitud contradice los valores institucionales y que, si continúa, informará a su director de grupo.", "Recordar los valores es pertinente, pero la advertencia busca controlar la conducta y no transformarla. El liderazgo implica influir positivamente en el comportamiento de los demás.", false], ["B", "conversa con ellos, reconoce la influencia que tienen en los menores y les propone liderar una actividad diseñada por ellos.", "Corresponde al liderazgo (Guía 31): «influye positivamente en el comportamiento de los demás», «expresa expectativas positivas de los demás y demuestra interés por el desarrollo de las personas», convirtiendo la resistencia en compromiso.", true], ["C", "permite que los de once participen solo si lo desean y se concentra en los cursos que muestran más interés.", "Evita un desgaste, pero deja sin atender a un grupo con gran influencia en los menores. No evidencia interés por el desarrollo de esas personas ni por sumarlas a la meta común.", false]]}, {"id": "PS-141", "niv": 2, "e": "A mitad de año, los conflictos reportados en el descanso se han reducido 20 %, la mitad de la meta del año. Usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Orientación al logro).", "o": [["A", "propone al comité de convivencia ajustar la meta al 25 %, ya que el 40 % resultó poco realista para el colegio.", "Revisar metas puede ser legítimo con evidencias, pero aquí se rebaja la meta a mitad de camino sin intentar mejorar las acciones. No refleja metas elevadas ni persistencia.", false], ["B", "presenta el 20 % como un buen resultado parcial y mantiene el proyecto sin cambios hasta el cierre del año.", "Reconocer el avance es válido, pero mantener todo igual con la mitad de la meta lograda no apunta al mejoramiento continuo. La orientación al logro implica ajustar para alcanzar estándares elevados.", false], ["C", "analiza en qué momentos y lugares persisten los conflictos y ajusta las actividades para acercarse a la meta.", "Evidencia orientación al logro (Guía 31): dirige su comportamiento «hacia el cumplimiento de estándares elevados, con miras al mejoramiento continuo» y muestra persistencia frente a los obstáculos.", true]]}, {"id": "PS-142", "niv": 1, "e": "En temporada de lluvias, el patio queda inutilizable varios días por semana. Usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Iniciativa).", "o": [["A", "diseña con los líderes estudiantiles una versión de las actividades para pasillos y salones cubiertos.", "Evidencia iniciativa (Guía 31): «demuestra recursividad y flexibilidad, y se adapta con rapidez a diferentes contextos», manteniendo el proyecto en marcha con una alternativa propia.", true], ["B", "solicita a la rectoría que gestione la construcción de una cubierta para el patio del colegio.", "Puede ser una mejora a largo plazo, pero no resuelve la situación actual y depende de otros. La iniciativa implica proponer y emprender alternativas con autonomía.", false], ["C", "suspende los recreos activos los días de lluvia y los reanuda cuando el patio vuelva a estar disponible.", "Es una decisión práctica, pero interrumpe el proyecto justo cuando los estudiantes permanecen más tiempo en espacios reducidos. No muestra flexibilidad para adaptarse.", false]]}]}, {"comp": "psicotecnica", "rol": "docente", "tag": "Prueba psicotécnica · Trabajo en equipo", "texto": "Usted es docente de matemáticas de sexto en un colegio oficial de Villavicencio. En el grupo está Mateo, un estudiante con diagnóstico de trastorno del espectro autista que se desempeña bien en tareas individuales y estructuradas, pero se angustia con los cambios de rutina y con el ruido. La docente de apoyo pedagógico de la institución convocó a los docentes del grado para elaborar el Plan Individual de Ajustes Razonables (PIAR) de Mateo, que se construye con los docentes de aula, la docente de apoyo, la familia y el estudiante.", "items": [{"id": "PS-143", "niv": 1, "e": "Para la reunión de construcción del PIAR de Mateo, usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Trabajo en equipo). Decreto 1421 de 2017 (PIAR, compilado en el Decreto 1075 de 2015).", "o": [["A", "lleva sus observaciones sobre cómo aprende Mateo en su clase y propone ajustes aplicables en varias áreas.", "Evidencia trabajo en equipo (Guía 31): «aporta sugerencias, ideas y opiniones» y construye relaciones de colaboración para el logro de un objetivo compartido: el PIAR del estudiante.", true], ["B", "envía por correo los ajustes que aplicará en matemáticas, porque ese día tiene otras actividades programadas.", "Aporta información, pero de forma aislada y sin participar en la construcción conjunta. El PIAR se diseña entre los docentes de aula, la docente de apoyo y la familia; el trabajo en equipo implica cooperar en ese espacio.", false], ["C", "deja que la docente de apoyo defina los ajustes de todas las áreas, ya que ella es la especialista en inclusión.", "Reconocer el saber de la especialista es razonable, pero el PIAR requiere el conocimiento que cada docente tiene del estudiante en su área. Delegar por completo no evidencia trabajo cooperativo.", false]]}, {"id": "PS-144", "niv": 3, "e": "En la reunión, la docente de ciencias propone un ajuste que usted ya probó en matemáticas sin buenos resultados. Usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Trabajo en equipo). Decreto 1421 de 2017 (PIAR, compilado en el Decreto 1075 de 2015).", "o": [["A", "guarda silencio para no desanimar a la colega y deja que ella compruebe por sí misma el resultado.", "Evita una posible incomodidad, pero se guarda un aprendizaje que podría ahorrar tiempo y angustia al estudiante. El trabajo en equipo implica compartir aprendizajes con los demás.", false], ["B", "cuenta cómo le fue con ese ajuste y propone revisar en equipo qué podría hacerlo funcionar en ciencias.", "Corresponde al trabajo en equipo (Guía 31): «comparte aprendizajes y recursos con diferentes miembros de la institución» y «considera las contribuciones de los demás en la toma de decisiones», construyendo la solución entre todos.", true], ["C", "le sugiere descartarlo desde ya, pues su experiencia en matemáticas mostró que ese ajuste no funciona con Mateo.", "Su experiencia es valiosa, pero la convierte en una conclusión definitiva sin considerar que el contexto de ciencias puede ser distinto. No considera las contribuciones de los demás en la toma de decisiones.", false]]}, {"id": "PS-145", "niv": 2, "e": "La madre de Mateo le escribe angustiada porque su hijo llegó llorando a casa después de una actividad en grupo en su clase. Usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Comunicación y relaciones interpersonales).", "o": [["A", "le recomienda comunicarse con la docente de apoyo, que conoce mejor las necesidades de Mateo.", "La docente de apoyo puede intervenir después, pero la situación ocurrió en su clase y la madre se dirige a usted. Remitirla evita la conversación que corresponde.", false], ["B", "le responde por escrito con un resumen detallado de la actividad y le asegura que en clase Mateo no tuvo ningún problema.", "Busca tranquilizar a la madre, pero responde a la defensiva y descarta lo que ella observó. No demuestra escucha ni comprensión de las emociones de la familia.", false], ["C", "la llama, le cuenta lo que observó, escucha lo que Mateo expresó en casa y acuerdan cómo ajustar el trabajo en grupo.", "Evidencia comunicación y relaciones interpersonales (Guía 31): «escucha con atención y comprende puntos de vista de los demás», «identifica y comprende» las emociones de otros y construye acuerdos basados en la confianza.", true]]}, {"id": "PS-146", "niv": 3, "e": "Al final del período, Mateo aprobó matemáticas con los ajustes, pero aún no domina las operaciones con fracciones previstas en su PIAR. Usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Orientación al logro). Decreto 1421 de 2017 (PIAR, compilado en el Decreto 1075 de 2015).", "o": [["A", "registra el avance, identifica lo que falta y ajusta con el equipo las estrategias del PIAR para el siguiente período.", "Evidencia orientación al logro (Guía 31): dirige su comportamiento «hacia el cumplimiento de estándares elevados, con miras al mejoramiento continuo» y «procura que los estudiantes [...] obtengan resultados de excelencia» según las metas propias del estudiante.", true], ["B", "considera cumplido el objetivo del período, porque Mateo aprobó el área con los ajustes razonables que acordó el equipo.", "Aprobar es un logro, pero el criterio del PIAR son las metas definidas para el estudiante, que aún no se alcanzan. Conformarse con la aprobación no refleja estándares elevados.", false], ["C", "le asigna un plan de refuerzo para desarrollar en vacaciones, de manera que alcance el nivel del resto del grupo.", "Muestra exigencia, pero usa como referencia el nivel del grupo en lugar de las metas del PIAR y traslada el trabajo a vacaciones sin ajustar los apoyos. No es una mejora sistemática del proceso.", false]]}]}, {"comp": "psicotecnica", "rol": "docente", "tag": "Prueba psicotécnica · Compromiso social e institucional", "texto": "Usted es director de grupo de séptimo en una institución educativa rural del Cesar. Durante una actividad de escritura, una estudiante le entrega un texto en el que cuenta que su padrastro la golpea cuando llega borracho. Al terminar la clase, se acerca y le pide que no le cuente a nadie, porque teme que en su casa se enteren. La institución tiene un comité de convivencia que preside el rector, y en el manual de convivencia están definidas las rutas de atención.", "items": [{"id": "PS-147", "niv": 1, "e": "Frente a lo que le cuenta la estudiante, usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Compromiso social e institucional). Ley 1620 de 2013, arts. 19 y 29.", "o": [["A", "cita a la madre de la estudiante para contarle lo que ocurre y acordar con ella cómo proteger a la niña.", "Involucrar a la familia parece natural, pero hacerlo por su cuenta puede aumentar el riesgo para la estudiante y omite la ruta institucional, que define cómo y quién interviene. No acata las normas establecidas.", false], ["B", "le explica que, para protegerla, debe informar a quienes activan la ruta de atención, y lo hace ese mismo día.", "Evidencia compromiso social e institucional (Guía 31): «acata y divulga las normas y políticas nacionales, regionales e institucionales» y reflexiona sobre su responsabilidad social como educador. La Ley 1620 de 2013 (art. 19) asigna a los docentes identificar y reportar situaciones de vulneración de derechos.", true], ["C", "guarda la confidencia y le pide que le avise si la situación se repite, para no perder la confianza que ella le tiene.", "Busca proteger la relación con la estudiante, pero la deja expuesta a una situación de maltrato. El docente tiene el deber de identificar y reportar estas situaciones (Ley 1620 de 2013, art. 19).", false]]}, {"id": "PS-148", "niv": 3, "e": "Días después, un colega comenta el caso de la estudiante en la sala de profesores, mencionando su nombre. Usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Compromiso social e institucional). Ley 1098 de 2006, art. 33 (derecho a la intimidad).", "o": [["A", "informa de inmediato al rector, sin hablar antes con el colega, para que adopte las medidas correspondientes.", "Informar puede ser necesario si la conducta persiste, pero como primera respuesta escala de inmediato una situación que se puede corregir con una advertencia directa y respetuosa. No es la acción más oportuna.", false], ["B", "no dice nada para no generar tensión, pero se asegura de no aportar más detalles del caso.", "No divulga más información, pero su silencio permite que la intimidad de la estudiante siga expuesta. El compromiso institucional incluye actuar con ética y respeto hacia los estudiantes.", false], ["C", "le recuerda en privado que la información es reservada y puede exponer a la estudiante y, si se repite, lo informa al rector.", "Corresponde al compromiso social e institucional (Guía 31): «muestra respeto hacia los estudiantes, el equipo docente» y «exhibe un comportamiento ético», protegiendo la reserva de la información de manera directa y respetuosa con el colega, y prevé acudir al rector si la conducta persiste.", true]]}, {"id": "PS-149", "niv": 2, "e": "Usted nota que muchos estudiantes no saben a quién acudir cuando enfrentan situaciones de riesgo. Usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Iniciativa).", "o": [["A", "propone al comité de convivencia una campaña con los estudiantes para dar a conocer las rutas y a quién acudir.", "Evidencia iniciativa (Guía 31): «anticipa situaciones futuras» y «propone y desarrolla ideas novedosas [...] para influir positivamente en la institución y la comunidad», a partir de una necesidad que identificó.", true], ["B", "espera a que la orientación escolar desarrolle las charlas de prevención que están previstas para el segundo semestre.", "Respeta lo planeado, pero deja sin respuesta una necesidad que ya identificó. La iniciativa implica trabajar proactivamente y anticiparse a los problemas.", false], ["C", "pega en la cartelera del salón los teléfonos de las líneas de atención a niños y adolescentes.", "Es un aporte útil, pero limitado: no garantiza que los estudiantes comprendan las rutas ni confíen en ellas. No se trata de una alternativa con impacto en la institución.", false]]}]}, {"comp": "psicotecnica", "rol": "docente", "tag": "Prueba psicotécnica · Orientación al logro", "texto": "Usted es docente de inglés de séptimo en un colegio oficial de Bogotá. Tiene dos grupos de 42 estudiantes. En el diagnóstico inicial, la mayoría de estudiantes comprendía textos cortos, pero tenía grandes dificultades para entender instrucciones orales y expresarse en inglés. En su barrio, muchos jóvenes dicen que el inglés «no sirve para nada». La institución incluyó el fortalecimiento del inglés en su plan de mejoramiento y las clases cuentan con un televisor y una grabadora.", "items": [{"id": "PS-150", "niv": 1, "e": "Usted se propone que, al final del año, sus grupos mejoren su comprensión oral en inglés. Para lograrlo, usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Orientación al logro).", "o": [["A", "espera a la evaluación final del año para medir si los grupos alcanzaron la mejora que se propuso.", "Medir al final deja sin margen para corregir el rumbo. La orientación al logro implica perseguir la meta de forma activa y continua, no solo comprobar si se cumplió.", false], ["B", "aumenta las tareas de escucha para la casa, de manera que los estudiantes practiquen más fuera de clase.", "Más práctica puede ayudar, pero sin metas intermedias ni seguimiento no sabe si está funcionando ni cómo mejorar. La orientación al logro implica orientar el trabajo hacia resultados verificables.", false], ["C", "define metas por período, hace seguimiento con evaluaciones cortas y ajusta las actividades según los resultados.", "Evidencia orientación al logro (Guía 31): «trabaja con tesón y disciplina para cumplir sus funciones con altos niveles de calidad» y orienta su comportamiento al mejoramiento continuo mediante metas y seguimiento.", true]]}, {"id": "PS-151", "niv": 3, "e": "Un directivo le comenta que sus grupos tienen mejores resultados que los demás séptimos y que «no hace falta exigir más», aunque varios de sus estudiantes aún no alcanzan el nivel esperado. Usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Orientación al logro).", "o": [["A", "agradece el reconocimiento y dedica más tiempo a los estudiantes avanzados para que el colegio destaque en el concurso de inglés.", "Busca excelencia, pero solo para unos pocos y en función de un resultado visible para el colegio. La orientación al logro procura resultados de excelencia para los estudiantes, no solo para los más aventajados.", false], ["B", "agradece el reconocimiento y mantiene metas de mejora para los estudiantes que aún no alcanzan el nivel esperado.", "Corresponde a orientación al logro (Guía 31): «tiene metas personales y profesionales elevadas» y «procura que los estudiantes de la institución obtengan resultados de excelencia», sin conformarse con la comparación con otros grupos.", true], ["C", "agradece el reconocimiento y mantiene el ritmo actual, ya que los resultados confirman que la estrategia funciona.", "Es razonable conservar lo que funciona, pero la comparación con otros grupos no es el estándar: si hay estudiantes que no alcanzan el nivel esperado, la meta no está cumplida. Conformarse no refleja metas elevadas.", false]]}, {"id": "PS-152", "niv": 2, "e": "En clase, varios estudiantes repiten que el inglés «no sirve para nada» en su barrio. Usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Liderazgo).", "o": [["A", "les comparte casos de jóvenes como ellos a quienes el inglés les abrió oportunidades y les expresa su confianza en ellos.", "Evidencia liderazgo (Guía 31): «plantea orientaciones convincentes, expresa expectativas positivas de los demás y demuestra interés por el desarrollo de las personas», influyendo positivamente en la motivación del grupo.", true], ["B", "ajusta las clases a canciones y juegos para que el área les resulte más entretenida, aunque se avance menos en el programa.", "Hacer la clase atractiva es valioso, pero sacrificar los aprendizajes para ganar aceptación no transforma la percepción de los estudiantes sobre el valor del inglés. No plantea una orientación convincente.", false], ["C", "les explica que el inglés es un área obligatoria del plan de estudios y que deben aprobarla para ser promovidos.", "Es información cierta, pero apela a la obligación y no cambia la actitud de los estudiantes hacia el aprendizaje. El liderazgo implica plantear orientaciones convincentes.", false]]}, {"id": "PS-153", "niv": 3, "e": "Con 42 estudiantes por grupo, es difícil que todos practiquen la expresión oral durante la clase. Usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Iniciativa).", "o": [["A", "solicita a coordinación que divida los grupos en dos para las clases de inglés, como se hace en algunos colegios.", "La propuesta puede ser deseable, pero depende de recursos y decisiones que no controla y deja el problema sin respuesta inmediata. La iniciativa implica buscar alternativas con autonomía.", false], ["B", "prioriza la comprensión lectora y la gramática, que pueden trabajarse con todo el grupo al mismo tiempo.", "Es una decisión eficiente, pero abandona la habilidad que el diagnóstico mostró como más débil. No busca una alternativa para la dificultad real, que es lo que exige la iniciativa.", false], ["C", "organiza estaciones de práctica en pequeños grupos y usa grabaciones de voz para revisar el avance de cada estudiante.", "Evidencia iniciativa (Guía 31): «demuestra recursividad y flexibilidad» y «propone y desarrolla ideas novedosas», encontrando una forma de que todos practiquen con los recursos disponibles.", true]]}]}, {"comp": "psicotecnica", "rol": "docente", "tag": "Prueba psicotécnica · Liderazgo", "texto": "Usted es docente de preescolar en una sede de una institución etnoeducativa en un resguardo nasa del norte del Cauca. Llegó este año y no habla nasa yuwe. El proyecto educativo comunitario (PEC), construido con las autoridades tradicionales, establece que en la educación inicial se fortalezcan la lengua y las prácticas culturales propias junto con el español. Varias familias le han dicho que prefieren que sus hijos aprendan «solo español», para que les vaya mejor en el colegio y en el trabajo. El cabildo es muy activo en la vida de la sede.", "items": [{"id": "PS-154", "niv": 2, "e": "Frente a las familias que piden que sus hijos aprendan solo español, usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Liderazgo). Ley 115 de 1994, arts. 55 a 57 (etnoeducación).", "o": [["A", "les explica que el PEC fue construido con las autoridades tradicionales y que la institución tiene que cumplirlo.", "El argumento es cierto, pero se apoya en la autoridad del documento y no construye con las familias el sentido del proyecto. El liderazgo busca involucrar a la comunidad en una identidad común.", false], ["B", "convoca a las familias y a los mayores a conversar sobre cómo la lengua propia y el español se fortalecen juntos.", "Evidencia liderazgo (Guía 31): «capacidad para motivar e involucrar a los miembros de la comunidad educativa con la construcción de una identidad común y el desarrollo de la visión institucional», convocando a quienes tienen autoridad cultural en la comunidad.", true], ["C", "atiende la solicitud y trabaja con esos niños solo en español mientras se aclara el tema con la institución.", "Evita el desacuerdo con las familias, pero aparta a la sede de la visión institucional del PEC. No muestra el liderazgo de transmitir con sus acciones los objetivos y valores institucionales.", false]]}, {"id": "PS-155", "niv": 3, "e": "Para desarrollar las actividades en nasa yuwe que propone el PEC, sin hablar la lengua, usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Iniciativa).", "o": [["A", "solicita a la secretaría de educación un docente bilingüe que se encargue de las actividades en nasa yuwe.", "Pedir apoyo especializado es comprensible, pero traslada a otro una responsabilidad propia y deja las actividades en espera. La iniciativa implica actuar con autonomía frente a las responsabilidades.", false], ["B", "invita a un sabedor de la comunidad a orientar con usted algunas actividades y empieza a aprender la lengua.", "Evidencia iniciativa (Guía 31): «realiza acciones que le facilitan el aprendizaje permanente», «demuestra recursividad y flexibilidad, y se adapta con rapidez a diferentes contextos», apoyándose en los recursos de la propia comunidad.", true], ["C", "usa en clase videos y canciones en nasa yuwe que encontró en internet, para que los niños escuchen la lengua a diario.", "Es un recurso creativo, pero desconectado de la comunidad que sostiene la lengua y no implica que usted aprenda. Muestra cierta recursividad, pero no la adaptación al contexto ni el aprendizaje permanente que la competencia describe.", false]]}, {"id": "PS-156", "niv": 2, "e": "El cabildo convoca a una minga comunitaria el mismo día en que la sede programó la entrega de informes a las familias. Usted, encargado de la entrega,", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Negociación y mediación).", "o": [["A", "mantiene la fecha programada, porque el cronograma institucional fue aprobado y socializado al inicio del año escolar.", "Respetar el cronograma es razonable, pero desconoce una actividad comunitaria central y obliga a las familias a elegir. No busca una solución concertada entre las partes.", false], ["B", "aplaza la entrega de informes sin fecha definida, para respetar la actividad convocada por el cabildo.", "Muestra respeto por la comunidad, pero cede sin concertar y deja a las familias sin la información de sus hijos. Una solución efectiva y oportuna requiere acordar una alternativa concreta.", false], ["C", "acuerda con la coordinación y el cabildo una fecha o forma de entrega que permita asistir a ambas actividades.", "Evidencia negociación y mediación (Guía 31): «facilita acuerdos y soluciones multilaterales, anteponiendo los intereses comunes», con una salida concertada que respeta tanto a la institución como a la comunidad.", true]]}]}, {"comp": "psicotecnica", "rol": "docente", "tag": "Prueba psicotécnica · Iniciativa", "texto": "Usted es docente de tecnología e informática en una institución educativa rural de Boyacá. Cada año, entre abril y mayo, varios estudiantes de noveno faltan semanas completas para ayudar a sus familias en la cosecha de papa, y algunos terminan abandonando el colegio. Este año, cinco estudiantes de su grupo ya acumulan muchas inasistencias. La mayoría de las familias valora el trabajo en la finca más que el estudio, aunque quieren que sus hijos terminen el bachillerato.", "items": [{"id": "PS-157", "niv": 1, "e": "Al notar que cinco estudiantes de noveno están en riesgo de abandonar sus estudios durante la cosecha, usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Iniciativa).", "o": [["A", "propone un plan para la temporada, con guías flexibles y encuentros de seguimiento, para que no abandonen.", "Evidencia iniciativa (Guía 31): trabaja «proactivamente y con autonomía frente a las responsabilidades» y propone «alternativas de soluciones novedosas» ajustadas a la realidad de las familias.", true], ["B", "reporta semanalmente las inasistencias a coordinación, como lo establece el manual de convivencia.", "Cumplir el reporte es necesario, pero por sí solo no evita que los estudiantes se retiren. La iniciativa implica anticiparse a los problemas y proponer alternativas.", false], ["C", "espera a que termine la temporada de cosecha para organizar una nivelación con los estudiantes que regresen al colegio.", "La nivelación es útil, pero llega tarde y solo para quienes regresen. No se anticipa al riesgo de deserción que ya identificó.", false]]}, {"id": "PS-158", "niv": 3, "e": "Como la cosecha se repite cada año en las mismas fechas, para el próximo año usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Iniciativa). Decreto 1075 de 2015, art. 2.4.3.4.1 (calendario académico definido por la entidad territorial certificada).", "o": [["A", "concentra los temas más importantes del área al inicio del año, para que la cosecha afecte solo temas complementarios.", "Anticipa la situación, pero solo reduce el daño y sigue tratando la cosecha como un obstáculo. No propone una alternativa novedosa que integre la realidad de los estudiantes al aprendizaje.", false], ["B", "planea para esas semanas proyectos del área sobre los procesos productivos de la finca, que los estudiantes desarrollen desde allí.", "Corresponde a la iniciativa (Guía 31): «anticipa situaciones futuras, identifica tendencias innovadoras y es abierto a nuevas ideas» y «propone y desarrolla ideas novedosas [...] para influir positivamente en la institución y la comunidad», convirtiendo la cosecha en una oportunidad de aprendizaje.", true], ["C", "solicita al consejo directivo que traslade las vacaciones de mitad de año a las semanas de cosecha.", "Busca una solución estructural, pero el calendario académico no lo define el consejo directivo, sino la secretaría de educación de la entidad territorial, y la propuesta depende de otros. No es una alternativa a su alcance.", false]]}, {"id": "PS-159", "niv": 1, "e": "Un padre le dice que su hijo no necesita seguir estudiando porque va a heredar la finca. Usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Comunicación y relaciones interpersonales).", "o": [["A", "le explica que la educación es obligatoria hasta el grado noveno y que la familia debe garantizar la asistencia.", "Recordar la obligación legal es pertinente, pero no responde a las razones del padre ni construye confianza. La comunicación efectiva implica comprender el punto de vista del otro.", false], ["B", "le dice que respeta su decisión como padre de familia y que el colegio estará abierto si su hijo decide regresar.", "Es respetuoso, pero renuncia a dialogar y deja al estudiante en riesgo de abandonar. La competencia busca intercambiar argumentos con empatía, no evitar la conversación.", false], ["C", "lo escucha, reconoce el valor de la finca y le muestra cómo el estudio puede ayudar a su hijo a manejarla mejor.", "Evidencia comunicación y relaciones interpersonales (Guía 31): «escucha con atención y comprende puntos de vista de los demás» y «expresa argumentos de forma clara y respetuosa», conectando sus razones con los intereses de la familia.", true]]}, {"id": "PS-160", "niv": 2, "e": "Al final del año, tres de los cinco estudiantes en riesgo terminaron noveno. Usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Orientación al logro).", "o": [["A", "analiza con los dos estudiantes que no terminaron y sus familias qué falló, para mejorar el plan del próximo año.", "Evidencia orientación al logro (Guía 31): dirige su comportamiento «hacia el cumplimiento de estándares elevados, con miras al mejoramiento continuo» y muestra persistencia frente a las dificultades.", true], ["B", "presenta el resultado como un logro, ya que la deserción del grupo se redujo frente al año anterior.", "El avance es real, pero quedarse en el reconocimiento no aprovecha lo aprendido para mejorar. La orientación al logro se dirige al mejoramiento continuo.", false], ["C", "concluye que los dos casos dependían de factores familiares fuera de su alcance y cierra el proyecto como exitoso.", "Reconocer los límites es sensato, pero atribuirlo todo a factores externos cierra la posibilidad de mejorar. No refleja la persistencia ante obstáculos.", false]]}]}, {"comp": "psicotecnica", "rol": "docente", "tag": "Prueba psicotécnica · Comunicación y relaciones interpersonales", "texto": "Por el cierre de la vía principal debido a un derrumbe, un colegio de la zona rural de Manizales dicta clases virtuales durante tres semanas a sus estudiantes de media. Usted es docente de química de décimo. Las clases se hacen por videollamada y el grupo tiene un chat en la plataforma institucional. Algunos estudiantes se conectan desde el celular y otros desde computadores compartidos con hermanos. En las dos primeras semanas usted ha notado cambios en la participación de algunos estudiantes.", "items": [{"id": "PS-161", "niv": 1, "e": "Una estudiante que antes participaba mucho ahora mantiene la cámara apagada y no responde cuando la nombran. Usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Comunicación y relaciones interpersonales).", "o": [["A", "le recuerda frente al grupo que la participación hace parte de la nota y que debe mantener encendida la cámara.", "Aclarar los criterios de evaluación es legítimo, pero hacerlo en público y como exigencia ignora que puede haber una dificultad detrás del cambio. No muestra comprensión de la situación del otro.", false], ["B", "le escribe en privado para preguntarle cómo está y si algo le impide participar, y le ofrece alternativas.", "Evidencia comunicación y relaciones interpersonales (Guía 31): «realiza preguntas claras, concretas y que permiten aclarar una idea o situación», identifica posibles emociones de la estudiante y adapta el canal al contexto.", true], ["C", "registra su inasistencia a la actividad y espera a que ella o su familia expliquen qué está pasando.", "Registra lo ocurrido, pero deja que la situación se prolongue sin indagar. La competencia implica tomar la iniciativa de la comunicación para comprender la situación.", false]]}, {"id": "PS-162", "niv": 2, "e": "Durante una clase, un estudiante publica en el chat un meme que se burla de la forma de hablar de usted y varios compañeros reaccionan con risas. Usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Comunicación y relaciones interpersonales).", "o": [["A", "retira el meme, continúa la clase con calma y luego habla en privado con el estudiante sobre lo ocurrido.", "Corresponde a comunicación y relaciones interpersonales (Guía 31): «maneja y expresa adecuadamente sus emociones» y «expresa argumentos de forma clara y respetuosa», detiene la difusión del contenido y elige un espacio adecuado para la conversación.", true], ["B", "hace un comentario con humor sobre el meme para restarle importancia y continúa con la clase.", "El humor reduce la tensión del momento, pero evita abordar una falta de respeto y puede normalizarla. No expresa con claridad y respeto lo que espera del estudiante.", false], ["C", "elimina el meme, saca al estudiante de la videollamada y reporta el hecho a la coordinación.", "Pone un límite claro, pero la respuesta inmediata y punitiva no permite que el estudiante comprenda el efecto de su conducta. No refleja el manejo de las emociones propias que describe la competencia.", false]]}, {"id": "PS-163", "niv": 3, "e": "En la clase virtual anterior, pocos estudiantes entendieron el concepto de mol. Para explicarlo de nuevo, usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Comunicación y relaciones interpersonales).", "o": [["A", "repite la explicación con más ejemplos y envía después al chat la presentación completa del tema.", "Insiste en el mismo canal que no funcionó y deja la presentación como apoyo posterior. No combina recursos expresivos ni verifica la comprensión durante la clase.", false], ["B", "envía antes de la clase un video de un canal reconocido sobre el tema, para que los estudiantes lleguen preparados.", "El video puede ser un buen recurso, pero por sí solo traslada la explicación a un tercero y no verifica si los estudiantes comprendieron. La competencia implica que el docente gestione el intercambio y compruebe la comprensión.", false], ["C", "combina una explicación breve, una animación corta y un esquema en pantalla, y hace preguntas para verificar la comprensión.", "Evidencia comunicación y relaciones interpersonales (Guía 31): «combina adecuadamente los recursos expresivos del lenguaje oral, escrito y gráfico, con ayuda de las tecnologías de información y comunicación» y «realiza preguntas claras» para confirmar que el mensaje llegó.", true]]}]}, {"comp": "psicotecnica", "rol": "docente", "tag": "Prueba psicotécnica · Liderazgo", "texto": "Usted es jefe del área de humanidades en un colegio oficial de Cartagena que atiende preescolar, básica y media. Este año la institución adoptó un plan lector como parte de su visión de formar «lectores críticos y ciudadanos participativos», y le encargó a su área liderarlo en todos los niveles. El área tiene nueve docentes con experiencias muy distintas: algunos llevan más de veinte años en la institución y otros acaban de llegar. Faltan dos meses para iniciar el segundo semestre.", "items": [{"id": "PS-164", "niv": 1, "e": "Para que los docentes del área se apropien del plan lector, usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Liderazgo).", "o": [["A", "propone a la coordinación que la aplicación del plan lector se tenga en cuenta en la evaluación de desempeño de cada docente.", "Vincular el plan a la evaluación puede asegurar cumplimiento formal, pero se apoya en la presión y no en la motivación. No construye una identidad común alrededor de la visión institucional.", false], ["B", "aplica el plan en sus clases, comparte lo que le funciona e invita a sus colegas a contar sus experiencias en el área.", "Evidencia liderazgo (Guía 31): «transmite con sus acciones a la comunidad educativa la visión, la misión, los objetivos y los valores institucionales» e influye positivamente en los demás para comprometerlos con una meta común.", true], ["C", "entrega a cada docente el documento del plan lector y les pide ajustar sus planeaciones en el plazo de un mes.", "Organiza la tarea, pero la reduce a un trámite y no genera apropiación de la visión del plan. El liderazgo busca motivar e involucrar a los demás, no solo asignar responsabilidades.", false]]}, {"id": "PS-165", "niv": 2, "e": "Un docente con muchos años en la institución le dice que lleva veinte años enseñando «a su manera» y que no piensa cambiar. Usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Liderazgo).", "o": [["A", "respeta su posición y le permite continuar con su metodología habitual, siempre que cumpla con los contenidos del área.", "Evita el conflicto con un colega experimentado, pero lo deja por fuera de un proyecto institucional que el área debe liderar. No logra su compromiso con la meta común.", false], ["B", "le recuerda que el plan lector es una decisión institucional que todos los docentes del área deben aplicar.", "Es cierto, pero la respuesta apela a la obligación y probablemente refuerza la resistencia. El liderazgo implica plantear orientaciones convincentes, no solo recordar la norma.", false], ["C", "valora su experiencia y lo invita a orientar una actividad del plan con las estrategias que mejor le funcionan.", "Corresponde al liderazgo (Guía 31): «expresa expectativas positivas de los demás y demuestra interés por el desarrollo de las personas», y convierte la experiencia del colega en un aporte al proyecto institucional.", true]]}, {"id": "PS-166", "niv": 3, "e": "Al cierre del año, los resultados del plan lector muestran avances en primaria, pero no en secundaria. En la reunión de evaluación del área, usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Liderazgo).", "o": [["A", "propone analizar con los docentes de secundaria las causas y construir con ellos los ajustes del plan para el próximo año.", "Evidencia liderazgo (Guía 31): «promueve cambios y transformaciones que aumenten la capacidad institucional e impulsen el mejoramiento», involucrando a quienes deben aplicarlos.", true], ["B", "sugiere mantener el plan en primaria, donde funciona, y que cada docente de secundaria decida si lo continúa aplicando.", "Parece una decisión eficiente basada en resultados, pero abandona la visión institucional en un nivel completo. No promueve el mejoramiento donde más se necesita.", false], ["C", "presenta a la rectoría un informe con los avances de primaria y las recomendaciones que usted elaboró para secundaria.", "Informar a la rectoría es parte de su función, pero las recomendaciones construidas solo por usted no comprometen a los docentes que deben aplicarlas. El liderazgo busca involucrar, no solo diagnosticar.", false]]}, {"id": "PS-167", "niv": 2, "e": "Una docente de ciencias sociales le propone integrar el plan lector con su proyecto de memoria histórica, lo que implica modificar parte de la planeación que usted ya tenía lista. Usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Trabajo en equipo).", "o": [["A", "revisa con ella qué partes de ambos proyectos pueden articularse y ajusta su planeación en lo necesario.", "Evidencia trabajo en equipo (Guía 31): «considera las contribuciones de los demás en la toma de decisiones» y «establece relaciones profesionales y de equipo que potencien su trabajo y el logro de las metas institucionales».", true], ["B", "le agradece la propuesta y le sugiere aplazarla para el próximo año, cuando ambos puedan planear desde el inicio.", "Parece prudente, pero hay tiempo suficiente antes del semestre y aplazar desaprovecha una colaboración que fortalece ambos proyectos. No considera la contribución de la colega.", false], ["C", "le propone que ella adapte su proyecto a los textos del plan lector, ya que este es un proyecto institucional.", "Acepta la colaboración solo en sus términos y le traslada todo el ajuste a la colega. El trabajo en equipo implica construir relaciones de colaboración en las que ambos aportan.", false]]}]}, {"comp": "psicotecnica", "rol": "docente", "tag": "Prueba psicotécnica · Trabajo en equipo", "texto": "Usted es docente de transición en la jornada de la mañana de un colegio oficial de Pereira. Comparte el salón y los materiales didácticos con una colega que atiende otro grupo de transición en la jornada de la tarde. En las últimas semanas, los materiales aparecen desordenados y algunos dañados, y cada una cree que el problema viene de la otra jornada. Ambas deben, además, preparar juntas la participación de transición en la feria de la ciencia de primaria del próximo mes.", "items": [{"id": "PS-168", "niv": 1, "e": "Frente al desorden y el daño de los materiales que comparten, usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Trabajo en equipo).", "o": [["A", "guarda bajo llave el material que usted compró con su dinero para su grupo y deja disponible solo el de la institución.", "Protege sus recursos, pero divide el espacio común y debilita la relación con la colega. El trabajo en equipo implica compartir recursos y construir acuerdos.", false], ["B", "propone a su colega acordar juntas cómo organizar y cuidar el material y enseñar las mismas rutinas a ambos grupos.", "Evidencia trabajo en equipo (Guía 31): «trabajar cooperativamente con los diferentes miembros de la organización escolar y construir relaciones de colaboración para el logro de objetivos compartidos».", true], ["C", "informa a la coordinadora sobre el daño del material para que defina reglas de uso para las dos jornadas.", "Acudir a la coordinación ordena el problema desde la autoridad, pero se salta el acuerdo directo entre quienes comparten el espacio. No evidencia la cooperación entre pares.", false]]}, {"id": "PS-169", "niv": 3, "e": "Después de unas semanas, su colega le dice que las rutinas que usted propuso no le funcionan con su grupo de la tarde. Usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Trabajo en equipo).", "o": [["A", "le sugiere que cada jornada maneje sus propias rutinas, ya que los grupos tienen características distintas.", "Reconoce las diferencias entre grupos, pero renuncia al acuerdo común sobre un espacio compartido, que era la causa del problema. Fragmenta el trabajo en lugar de construir colaboración.", false], ["B", "le explica con detalle cómo aplica usted las rutinas en la mañana, para que pueda implementarlas de la misma forma.", "Ofrece ayuda, pero asume que el problema está en la aplicación y no en la propuesta. No acepta la crítica ni considera la experiencia de la colega.", false], ["C", "le pide que le cuente qué ha observado y ajustan juntas las rutinas incorporando sus sugerencias.", "Corresponde al trabajo en equipo (Guía 31): «acepta críticas constructivas y actúa en consecuencia» y «considera las contribuciones de los demás en la toma de decisiones», manteniendo un acuerdo común.", true]]}, {"id": "PS-170", "niv": 2, "e": "El día de la feria de la ciencia, su colega está incapacitada y el stand de transición incluye trabajos de los niños de ambas jornadas. Usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Trabajo en equipo).", "o": [["A", "solicita a la coordinadora que asigne a otro docente que esté disponible para presentar los trabajos de la jornada de la tarde.", "Busca que alguien los presente, pero traslada a otro una responsabilidad compartida que usted está en mejores condiciones de asumir. No muestra cooperación con la colega.", false], ["B", "presenta solo los trabajos de su grupo, porque no conoce cómo se elaboraron los de la jornada de la tarde.", "Evita explicar lo que no conoce, pero deja por fuera a los niños de la otra jornada en un proyecto que era compartido. No ofrece apoyo al trabajo de la colega.", false], ["C", "revisa la planeación y los registros que dejó su colega y presenta los trabajos de ambos grupos, con crédito a los niños de la tarde.", "Evidencia trabajo en equipo (Guía 31): «ofrece apoyo para el trabajo de otros» y asume el objetivo compartido con su colega, reconociendo los aportes de su grupo.", true]]}, {"id": "PS-171", "niv": 1, "e": "Durante la feria, dos niños de transición se disputan quién explica el experimento a los visitantes y uno de ellos empieza a llorar. Usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Negociación y mediación).", "o": [["A", "se pone a su altura, escucha a cada uno y los ayuda a acordar cómo turnarse para explicar el experimento.", "Corresponde a negociación y mediación (Guía 31): «interviene efectiva y oportunamente ante situaciones de conflicto» y «forma a sus estudiantes en estrategias de resolución pacífica de conflictos», adecuadas a su edad.", true], ["B", "decide que explique el niño que llegó primero al stand y consuela al otro mientras tanto.", "Resuelve rápido con un criterio razonable, pero decide por los niños y pierde la oportunidad de enseñarles a llegar a un acuerdo. No forma en estrategias de resolución pacífica.", false], ["C", "explica usted misma el experimento a los visitantes hasta que los dos niños se calmen.", "Evita que el conflicto afecte la presentación, pero lo aplaza sin resolverlo y quita protagonismo a los niños. No genera una solución con las partes.", false]]}]}, {"comp": "psicotecnica", "rol": "docente", "tag": "Prueba psicotécnica · Negociación y mediación", "texto": "Usted es directora de grupo de segundo de primaria en un colegio oficial de Neiva. En el descanso, Valentina y Sofía discutieron por un juego, se jalaron el cabello y ambas terminaron llorando, sin lesiones. Usted y otra docente vieron parte de lo ocurrido. A la salida, las madres de las dos niñas se encuentran en la puerta del colegio y empiezan a discutir en voz alta frente a los estudiantes, cada una acusando a la hija de la otra de haber empezado.", "items": [{"id": "PS-172", "niv": 1, "e": "Al ver la discusión entre las madres en la puerta del colegio, usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Negociación y mediación).", "o": [["A", "lleva a las niñas al salón y deja que las madres resuelvan el asunto entre ellas como personas adultas.", "Protege a las niñas de la escena, pero deja escalar un conflicto que se origina en el colegio. Omite intervenir cuando es oportuno.", false], ["B", "se acerca, les propone continuar la conversación en un espacio aparte sin los niños y escucha a cada una.", "Evidencia negociación y mediación (Guía 31): «interviene efectiva y oportunamente ante situaciones de conflicto» y crea condiciones de respeto para comprender los motivos de las implicadas.", true], ["C", "les pide que se retiren y que presenten sus quejas por escrito a coordinación al día siguiente.", "Detiene la discusión pública, pero aplaza el conflicto y lo traslada a la autoridad sin escuchar a nadie. No es una intervención que genere confianza.", false]]}, {"id": "PS-173", "niv": 2, "e": "Ya reunidas, cada madre insiste en que la otra niña empezó la pelea. Usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Negociación y mediación).", "o": [["A", "les explica que, según lo observado, la responsabilidad fue compartida y que ambas niñas recibirán la misma consecuencia.", "La conclusión es equitativa, pero la decisión se impone sin construir acuerdo con las madres ni atender sus preocupaciones. No genera confianza en el proceso.", false], ["B", "les asegura que investigará quién inició la pelea y que les informará su decisión en los próximos días.", "Busca ser justa, pero convierte la mediación en un juicio sobre culpables y deja a las madres fuera de la solución. La competencia se orienta a acuerdos, no a fallos.", false], ["C", "comparte lo que observó, sin culpar a ninguna niña, y pregunta a cada madre qué necesita para que su hija esté tranquila.", "Corresponde a negociación y mediación (Guía 31): valora «con imparcialidad los motivos de los implicados» y «facilita acuerdos [...] anteponiendo los intereses comunes», en este caso el bienestar de ambas niñas.", true]]}, {"id": "PS-174", "niv": 3, "e": "Para que la situación no se repita entre las dos niñas, usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Negociación y mediación). Decreto 1965 de 2013, art. 42 (situaciones tipo I).", "o": [["A", "las sienta en lugares separados del salón y pide a los docentes de turno vigilarlas durante los descansos.", "Reduce el contacto y el riesgo, pero no enseña a las niñas a manejar sus diferencias. Es control externo, no una solución duradera.", false], ["B", "hace con ellas un ejercicio guiado para expresar lo que sintieron y acordar cómo tratarse, y hace seguimiento.", "Evidencia negociación y mediación (Guía 31): «forma a sus estudiantes en estrategias de resolución pacífica de conflictos» y «promueve soluciones duraderas y hace seguimiento a los compromisos adquiridos por las partes».", true], ["C", "les pide que se disculpen una con la otra frente al grupo, para que todo el curso aprenda de lo que sucedió en el descanso.", "Busca una reparación y un aprendizaje colectivo, pero una disculpa pública forzada expone a las niñas y no surge de un acuerdo. No genera confianza ni compromisos propios.", false]]}]}, {"comp": "psicotecnica", "rol": "docente", "tag": "Prueba psicotécnica · Compromiso social e institucional", "texto": "Usted es docente de física de media en un colegio oficial de Quibdó. Se acerca el cierre del tercer período y la coordinación pidió entregar las notas en 48 horas. Usted tiene pendiente calificar los trabajos finales de un grupo de once. Además, la rectoría lo designó para representar a la institución en un foro municipal sobre permanencia escolar, organizado por la alcaldía, en el que participarán funcionarios, organizaciones sociales y otros colegios.", "items": [{"id": "PS-175", "niv": 1, "e": "El padre de un estudiante de once, concejal del municipio, le pide que «le ayude» a su hijo con la nota de física para que no pierda el año. Usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Compromiso social e institucional). Decreto 1290 de 2009, art. 4 (estrategias de apoyo en el SIEE).", "o": [["A", "le explica con respeto que la nota depende del desempeño del estudiante y le ofrece revisar un plan de apoyo según el SIEE.", "Evidencia compromiso social e institucional (Guía 31): «demuestra honestidad e integridad en su ejercicio profesional» y «muestra respeto hacia [...] la comunidad», orientando al padre hacia las estrategias de apoyo previstas en el sistema de evaluación.", true], ["B", "rechaza la solicitud, le pide que se retire y le advierte que podría denunciarlo por presionar a un docente.", "Defiende la integridad de la evaluación, pero responde de forma confrontacional y sin ofrecer alternativas al estudiante. La competencia incluye mostrar respeto hacia la comunidad.", false], ["C", "le dice que lo pensará y consulta al rector cómo proceder, dada la posición que el padre ocupa en el municipio.", "Consultar parece prudente, pero deja abierta una solicitud que debía rechazarse con claridad y le da peso a la posición política del padre. No evidencia integridad en el ejercicio profesional.", false]]}, {"id": "PS-176", "niv": 2, "e": "Para entregar en el plazo las notas del grupo de once cuyos trabajos aún no ha calificado, usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Compromiso social e institucional).", "o": [["A", "asigna a cada trabajo la nota promedio que el estudiante traía en el período, para cumplir con la fecha.", "Cumple el plazo, pero registra valoraciones que no corresponden al trabajo presentado. Falta a la honestidad y a la calidad con que deben atenderse las tareas asignadas.", false], ["B", "organiza su tiempo para calificar todos los trabajos con los criterios previstos y entregar dentro del plazo.", "Corresponde al compromiso social e institucional (Guía 31): «responde con oportunidad, eficiencia y calidad a las tareas que se le asignan», sin sacrificar la calidad de la evaluación.", true], ["C", "entrega las demás notas en la fecha y pide una prórroga para ese grupo, aunque conocía el plazo desde hace semanas.", "Solicitar una prórroga puede ser válido ante un imprevisto, pero aquí el plazo se conocía con anticipación. No evidencia la respuesta oportuna que exige la competencia.", false]]}, {"id": "PS-177", "niv": 3, "e": "En el foro, el moderador le pregunta su opinión sobre una decisión reciente del rector con la que usted no está de acuerdo. Usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Compromiso social e institucional).", "o": [["A", "expone la decisión y sus razones como representante de la institución, y lleva sus reparos a los espacios internos.", "Evidencia compromiso social e institucional (Guía 31): «representa adecuadamente a la institución en actividades fuera de la misma», anteponiendo los intereses institucionales a los personales. Es transparente sobre el papel en que habla y no oculta su opinión: la lleva a los espacios internos donde puede incidir en la decisión.", true], ["B", "expresa con respeto su desacuerdo, ya que en un espacio público de discusión debe primar la honestidad.", "La honestidad es un valor de la competencia, pero en ese espacio usted actúa como representante de la institución y no a título personal. Expresar allí su desacuerdo antepone su posición a la institucional.", false], ["C", "evita responder la pregunta y sugiere que la consulten directamente con el rector de la institución.", "Evita un conflicto, pero deja sin respuesta a los asistentes y no cumple la tarea de representación que se le asignó. No evidencia una representación adecuada.", false]]}, {"id": "PS-178", "niv": 2, "e": "En el foro, una organización comunitaria ofrece apoyo a los colegios para acompañar a estudiantes en riesgo de abandonar sus estudios. Usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Iniciativa).", "o": [["A", "le sugiere a la organización enviar una carta al rector, que es quien puede autorizar alianzas con entidades externas.", "Respeta el conducto, pero deja toda la gestión en manos de otros y puede perder la oportunidad. La iniciativa implica actuar proactivamente frente a una necesidad institucional.", false], ["B", "acuerda con la organización iniciar el acompañamiento en sus grupos la semana siguiente, para no perder la oportunidad.", "Actúa con rapidez, pero compromete a la institución sin autorización en una alianza con una entidad externa. La autonomía de la iniciativa no reemplaza los procedimientos institucionales.", false], ["C", "conversa con sus representantes sobre cómo podrían trabajar juntos y lleva a la institución una propuesta concreta.", "Evidencia iniciativa (Guía 31): trabaja «proactivamente y con autonomía» y «propone y desarrolla ideas [...] o proyectos, para influir positivamente en la institución y la comunidad», tramitándolos por la vía institucional.", true]]}]}, {"comp": "psicotecnica", "rol": "docente", "tag": "Prueba psicotécnica · Orientación al logro", "texto": "Usted es docente de biología de un colegio oficial de Montería. Inscribió a tres estudiantes de once en la olimpiada departamental de ciencias, que se realizará en un mes e incluye una prueba teórica y una prueba práctica de laboratorio. El colegio no tiene laboratorio dotado; solo cuenta con algunos materiales básicos. Los estudiantes están motivados, pero algunos colegas comentan que «es mejor no exponerlos» frente a colegios privados con más recursos.", "items": [{"id": "PS-179", "niv": 2, "e": "Ante la falta de laboratorio para preparar la prueba práctica, usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Orientación al logro).", "o": [["A", "concentra la preparación en la prueba teórica, que es la que puede trabajarse bien con los recursos disponibles.", "Es una decisión realista, pero renuncia a una parte de la prueba sin intentar superar el obstáculo. La orientación al logro implica persistencia ante situaciones difíciles.", false], ["B", "organiza prácticas con materiales sencillos y gestiona una visita al laboratorio de una universidad cercana.", "Evidencia orientación al logro (Guía 31): «demuestra esfuerzo y persistencia en la consecución de sus objetivos, afrontando obstáculos y situaciones difíciles» y «confía en sus propias capacidades [...] aun en situaciones desafiantes».", true], ["C", "retira la inscripción de los estudiantes, para evitarles una experiencia frustrante frente a colegios con más recursos.", "Busca proteger a los estudiantes, pero les quita una oportunidad y transmite poca confianza en sus capacidades. No refleja metas elevadas.", false]]}, {"id": "PS-180", "niv": 3, "e": "Los estudiantes obtienen el quinto puesto entre 30 colegios. Frente a este resultado, usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Orientación al logro).", "o": [["A", "celebra con ellos y analizan juntos en qué pruebas perdieron puntos, para prepararse mejor en la próxima convocatoria.", "Corresponde a orientación al logro (Guía 31): dirige el comportamiento «hacia el cumplimiento de estándares elevados, con miras al mejoramiento continuo» y «tiene metas personales y profesionales elevadas».", true], ["B", "considera que el quinto puesto es sobresaliente dadas las limitaciones del colegio y da por cumplida la meta.", "La valoración del contexto es razonable, pero las limitaciones se convierten en un techo para las metas. No refleja la búsqueda de estándares elevados.", false], ["C", "celebra con ellos y propone a la rectoría un reconocimiento público en la izada de bandera para motivar a otros estudiantes.", "Reconocer el logro es positivo y motivador, pero no usa la experiencia para mejorar. La orientación al logro se centra en el mejoramiento continuo, no solo en celebrar el resultado.", false]]}, {"id": "PS-181", "niv": 2, "e": "Después de la olimpiada, otros estudiantes se interesan en participar el próximo año. Usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Liderazgo).", "o": [["A", "les recomienda prepararse por su cuenta con las pruebas de años anteriores, que usted compartirá con ellos.", "Facilita materiales, pero deja la preparación en manos de cada estudiante y no aprovecha la experiencia ganada. No involucra a la comunidad en un proyecto común.", false], ["B", "selecciona desde ahora a los estudiantes con mejores notas en ciencias, para asegurar buenos resultados.", "Es eficiente para competir, pero excluye a interesados que podrían desarrollarse y no construye una cultura institucional. El liderazgo demuestra interés por el desarrollo de las personas.", false], ["C", "conforma con los tres participantes un semillero en el que ellos acompañen la preparación de los nuevos interesados.", "Evidencia liderazgo (Guía 31): «promueve cambios y transformaciones que aumenten la capacidad institucional» y motiva e involucra a los estudiantes como protagonistas de una meta común.", true]]}]}, {"comp": "psicotecnica", "rol": "docente", "tag": "Prueba psicotécnica · Compromiso social e institucional", "texto": "Usted es docente de cuarto de primaria en un colegio oficial de Armenia. La institución tiene un plan escolar de gestión del riesgo que define, para un sismo, que durante el movimiento todos se protegen en el lugar y, al terminar, evacúan por rutas señaladas hasta el punto de encuentro, donde cada docente verifica la lista de su grupo y reporta novedades a la brigada de evacuación. Durante una clase se presenta un temblor fuerte. Un estudiante de su grupo había salido al baño minutos antes.", "items": [{"id": "PS-182", "niv": 1, "e": "Durante el temblor, con su grupo dentro del salón, usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Compromiso social e institucional).", "o": [["A", "pide a los niños que salgan corriendo hacia el patio en cuanto empieza el temblor, para alejarlos cuanto antes del edificio.", "Busca alejarlos del peligro, pero evacuar durante el movimiento aumenta el riesgo de caídas y golpes, y desconoce el protocolo institucional.", false], ["B", "sale primero para verificar que la ruta de evacuación esté despejada y luego regresa por los niños.", "La intención es proteger al grupo, pero deja a los niños solos durante el evento y contradice el protocolo, que indica protegerse en el lugar mientras dura el movimiento.", false], ["C", "sigue el protocolo practicado en los simulacros y, al cesar el movimiento, lleva al grupo al punto de encuentro.", "Evidencia compromiso social e institucional (Guía 31): «acata y divulga las normas y políticas nacionales, regionales e institucionales» y asume con profesionalismo su responsabilidad sobre los estudiantes, siguiendo el plan escolar de gestión del riesgo.", true]]}, {"id": "PS-183", "niv": 2, "e": "En el punto de encuentro, usted verifica la lista y confirma que falta el estudiante que había ido al baño. Usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Compromiso social e institucional).", "o": [["A", "espera unos minutos antes de reportarlo, porque es probable que el estudiante haya salido con otro curso del piso.", "La suposición puede ser cierta, pero retrasar el reporte en una emergencia pone en riesgo al estudiante. La competencia exige responder con oportunidad.", false], ["B", "informa de inmediato a la brigada el nombre del estudiante y el lugar donde estaba, y permanece con su grupo.", "Corresponde al compromiso social e institucional (Guía 31): «responde con oportunidad, eficiencia y calidad a las tareas que se le asignan» y acata el plan institucional, que asigna la búsqueda a la brigada y a usted el cuidado del grupo.", true], ["C", "deja el grupo al cuidado del estudiante más responsable y regresa al edificio a buscar al niño.", "Es un acto de preocupación genuina, pero deja al grupo sin adulto responsable y lo expone a usted a un riesgo que el plan asigna a la brigada. No acata el protocolo institucional.", false]]}, {"id": "PS-184", "niv": 1, "e": "Después del evento, el comité de gestión del riesgo informa que la evacuación de su piso tardó más de lo previsto en el plan. Usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Orientación al logro).", "o": [["A", "revisa con su grupo qué retrasó la salida y practica con ellos las mejoras hasta alcanzar el tiempo previsto.", "Evidencia orientación al logro (Guía 31): «trabaja con tesón y disciplina para cumplir sus funciones con altos niveles de calidad» y persigue el estándar del plan con miras al mejoramiento continuo.", true], ["B", "considera que un retraso es normal en un evento real y que lo importante es que todos salieron ilesos.", "Es comprensible valorar que no hubo heridos, pero normaliza un resultado por debajo del estándar del plan. No refleja la búsqueda de mejoramiento continuo.", false], ["C", "espera el próximo simulacro programado por la institución para verificar si los tiempos de evacuación mejoran.", "Respeta la programación institucional, pero no actúa sobre una falla ya identificada. La orientación al logro implica trabajar activamente por el estándar.", false]]}]}];
const CFG = {"titulo": "Práctica por tema y nivel · Concurso Docente 2026–2027", "modo": "practica", "minutos": 0, "componentes": {"lectura_critica": "Lectura crítica", "razonamiento_cuantitativo": "Razonamiento cuantitativo", "competencias_blandas": "Competencias blandas y ciudadanas", "pedagogia_normativa": "Competencias pedagógicas y normativa", "psicotecnica": "Prueba psicotécnica"}, "niveles": {"1": "Básico", "2": "Intermedio", "3": "Avanzado"}, "clave": "practica.html"};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY = 'sim-docente:' + CFG.clave;
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}
function save(){try{localStorage.setItem(KEY, JSON.stringify(ST))}catch(e){}}
let ST = load();
ST.r = ST.r || {};
$('#tit').textContent = CFG.titulo;
const ITEMS = [];
DATA.forEach(c => c.items.forEach(it => { it.caso = c; ITEMS.push(it); }));

function justHTML(it){
  return '<div class="just">' + it.o.map(o => `<div><b>${o[0]}.</b> <span class="${o[3]?'okt':'not'}">${o[3]?'Es correcta.':'Es incorrecta.'}</span> ${esc(o[2])}</div>`).join('') +
    `<div class="src">Referencia: ${esc(it.f)}</div></div>`;
}
function itemHTML(it, n, mode){
  const r = ST.r[it.id];
  const reveal = mode === 'review' || (CFG.modo === 'practica' && r);
  let h = `<div class="item" id="i-${it.id}"><p class="enun"><span class="n">${n}.</span> <span class="niv">${CFG.niveles[it.niv]}</span> ${esc(it.e)}</p>`;
  it.o.forEach(o => {
    let cls = '';
    if (reveal) { if (o[3]) cls = 'ok'; else if (r === o[0]) cls = 'no'; }
    else if (r === o[0]) cls = 'sel';
    h += `<button class="op ${cls}" data-id="${it.id}" data-l="${o[0]}" ${reveal?'disabled':''}><span class="l">${o[0]}.</span><span>${esc(o[1])}</span></button>`;
  });
  if (reveal) {
    if (mode === 'review') h += `<div class="${r===keyOf(it)?'res-ok':'res-no'}" style="font-size:14px;margin-top:4px">${r ? (r===keyOf(it)?'Respondiste ' + r + ': correcto.':'Respondiste ' + r + '. La respuesta correcta es ' + keyOf(it) + '.') : 'Sin responder. La respuesta correcta es ' + keyOf(it) + '.'}</div>`;
    h += justHTML(it);
  }
  return h + '</div>';
}
const keyOf = it => it.o.find(o => o[3])[0];

function renderList(list, mode){
  let h = '', last = null, n = 0;
  list.forEach(it => {
    n++;
    if (it.caso !== last) { last = it.caso; h += `<div class="caso"><div class="tag">${esc(it.caso.tag)}</div><p>${esc(it.caso.texto)}</p></div>`; }
    h += itemHTML(it, n, mode);
  });
  return h;
}

// ---------- PRÁCTICA ----------
let LIST = [];
let FILTRO = ST.f || {comp:'', niv:'', rol:''};
function practica(){
  const comps = Object.entries(CFG.componentes).map(([k,v]) => `<option value="${k}" ${FILTRO.comp===k?'selected':''}>${esc(v)}</option>`).join('');
  const nivs = Object.entries(CFG.niveles).map(([k,v]) => `<option value="${k}" ${FILTRO.niv===k?'selected':''}>${esc(v)}</option>`).join('');
  const list = ITEMS.filter(it => (!FILTRO.comp || it.caso.comp===FILTRO.comp) && (!FILTRO.niv || String(it.niv)===FILTRO.niv) && (!FILTRO.rol || it.caso.rol===FILTRO.rol));
  const resp = list.filter(it => ST.r[it.id]); const ok = resp.filter(it => ST.r[it.id]===keyOf(it));
  $('#main').innerHTML = `<div class="panel"><p style="margin-top:0">Elige un tema y un nivel. Al responder verás de inmediato si acertaste y la explicación de cada opción.</p>
  <div class="row"><select id="fc"><option value="">Todos los temas</option>${comps}</select>
  <select id="fn"><option value="">Todos los niveles</option>${nivs}</select>
  <select id="fr"><option value="">Docentes y directivos</option><option value="docente" ${FILTRO.rol==='docente'?'selected':''}>Solo docentes</option><option value="directivo" ${FILTRO.rol==='directivo'?'selected':''}>Solo directivos</option></select>
  <button class="btn sec" id="borrar">Borrar mis respuestas</button></div>
  <p class="stat" id="pst" style="margin-bottom:0">${list.length} preguntas · respondidas ${resp.length} · aciertos ${ok.length}${resp.length? ' (' + Math.round(100*ok.length/resp.length) + ' %)':''}</p></div>` + renderList(list, 'practica');
  $('#prog').textContent = `${ok.length}/${resp.length} aciertos`;
  ['fc','fn','fr'].forEach((id,i) => $('#'+id).onchange = e => { FILTRO[['comp','niv','rol'][i]] = e.target.value; ST.f = FILTRO; save(); practica(); });
  LIST = list;
  $('#borrar').onclick = () => { list.forEach(it => delete ST.r[it.id]); save(); practica(); };
}

// ---------- SIMULACRO ----------
let tick = null;
function inicio(){
  const n = ITEMS.length, cnt = {};
  ITEMS.forEach(it => cnt[it.caso.comp] = (cnt[it.caso.comp]||0) + 1);
  const h = Math.floor(CFG.minutos/60), m = CFG.minutos%60;
  $('#main').innerHTML = `<div class="panel"><h2 style="margin-top:0;color:var(--pri)">Instrucciones</h2>
  <p>Este simulacro tiene <b>${n} preguntas</b> en el formato de Prueba de Juicio Situacional: un caso, enunciados que se completan y tres opciones con una sola respuesta correcta.</p>
  <table>${Object.entries(cnt).map(([k,v]) => `<tr><td>${esc(CFG.componentes[k])}</td><td class="r">${v}</td></tr>`).join('')}</table>
  <p>Tiempo sugerido: <b>${h ? h + ' h ' : ''}${m ? m + ' min' : ''}</b> (unos ${Math.round(CFG.minutos*60/n/6)/10} minutos por pregunta). Cuando se acaba el tiempo puedes seguir, pero el cronómetro lo indica.</p>
  <p>Tus respuestas se guardan en este navegador. Al terminar verás tu puntaje por componente y por nivel, y la explicación de cada pregunta.</p>
  <button class="btn" id="go">${ST.t0 ? 'Continuar el simulacro' : 'Comenzar'}</button></div>`;
  $('#prog').textContent = `${n} preguntas`;
  $('#go').onclick = () => { if (!ST.t0) { ST.t0 = Date.now(); save(); } examen(); };
}
function reloj(){
  const rest = CFG.minutos*60 - Math.floor((Date.now() - ST.t0)/1000);
  const a = Math.abs(rest), hh = Math.floor(a/3600), mm = Math.floor(a%3600/60), ss = a%60;
  const t = (rest < 0 ? '+' : '') + (hh ? hh + ':' : '') + String(mm).padStart(2,'0') + ':' + String(ss).padStart(2,'0');
  $('#timer').textContent = rest < 0 ? 'Tiempo cumplido ' + t : '⏱ ' + t;
  $('#timer').classList.toggle('low', rest < 600);
}
function examen(){
  $('#main').innerHTML = renderList(ITEMS, 'examen') + `<div class="panel"><button class="btn" id="fin">Terminar y calificar</button></div>`;
  progreso(); reloj(); clearInterval(tick); tick = setInterval(reloj, 1000);
  $('#fin').onclick = () => {
    const faltan = ITEMS.length - Object.keys(ST.r).filter(k => ITEMS.some(i => i.id===k)).length;
    $('#mtxt').textContent = faltan ? `Te faltan ${faltan} preguntas por responder. ¿Quieres calificar de todos modos?` : '¿Quieres terminar y ver tu calificación?';
    $('#modal').classList.remove('hide');
  };
}
function progreso(){
  const r = ITEMS.filter(it => ST.r[it.id]).length;
  $('#prog').textContent = `Respondidas ${r}/${ITEMS.length}`;
}
$('#mno').onclick = () => $('#modal').classList.add('hide');
$('#msi').onclick = () => { $('#modal').classList.add('hide'); ST.fin = Date.now(); save(); resultados(); };
function resultados(){
  clearInterval(tick);
  const ok = ITEMS.filter(it => ST.r[it.id] === keyOf(it)).length;
  const pct = Math.round(1000*ok/ITEMS.length)/10;
  const g = (fn, lab) => { const m = {}; ITEMS.forEach(it => { const k = fn(it); m[k] = m[k] || [0,0]; m[k][1]++; if (ST.r[it.id]===keyOf(it)) m[k][0]++; });
    return Object.entries(m).map(([k,v]) => `<tr><td>${esc(lab(k))}</td><td class="r">${v[0]}/${v[1]}</td><td class="r">${Math.round(100*v[0]/v[1])} %</td></tr>`).join(''); };
  const mins = Math.round(((ST.fin||Date.now()) - ST.t0)/60000);
  $('#timer').textContent = `Tiempo usado: ${Math.floor(mins/60) ? Math.floor(mins/60) + ' h ' : ''}${mins%60} min`;
  $('#prog').textContent = `${ok}/${ITEMS.length} aciertos`;
  $('#main').innerHTML = `<div class="panel"><div class="big">${String(pct).replace('.',',')} %</div>
  <p style="margin-top:4px">${ok} de ${ITEMS.length} respuestas correctas. ${pct >= 70 ? 'Muy buen resultado: repasa las explicaciones de tus errores para afianzarlo.' : pct >= 60 ? 'Vas bien, pero con poco margen: refuerza los componentes con menor porcentaje.' : 'Todavía no estás en zona segura: practica por tema los componentes con menor porcentaje.'}</p>
  <p class="aviso">Referencia: en el concurso el mínimo aprobatorio de la prueba eliminatoria es 60 puntos (70 para directivos). Este porcentaje de aciertos es una guía de preparación; la CNSC calcula su puntaje con su propia escala.</p>
  <h3>Por componente</h3><table>${g(it => it.caso.comp, k => CFG.componentes[k])}</table>
  <h3>Por nivel</h3><table>${g(it => it.niv, k => CFG.niveles[k])}</table>
  <div class="row" style="margin-top:14px"><button class="btn" id="solo">Ver solo mis errores</button><button class="btn sec" id="todas">Ver todas</button><button class="btn sec" id="otra">Reiniciar el simulacro</button></div></div><div id="rev"></div>`;
  const rev = errs => { const l = errs ? ITEMS.filter(it => ST.r[it.id] !== keyOf(it)) : ITEMS; $('#rev').innerHTML = renderList(l, 'review'); };
  rev(true);
  $('#solo').onclick = () => rev(true); $('#todas').onclick = () => rev(false);
  $('#otra').onclick = () => { ST = {r:{}}; save(); inicio(); window.scrollTo(0,0); };
}

document.addEventListener('click', e => {
  const b = e.target.closest('button.op'); if (!b || b.disabled) return;
  ST.r[b.dataset.id] = b.dataset.l; save();
  const it = ITEMS.find(i => i.id === b.dataset.id);
  const n = b.closest('.item').querySelector('.n').textContent.replace('.','');
  b.closest('.item').outerHTML = itemHTML(it, n, CFG.modo === 'practica' ? 'practica' : 'examen');
  if (CFG.modo === 'practica') { const resp = LIST.filter(i => ST.r[i.id]); const ok = resp.filter(i => ST.r[i.id]===keyOf(i)).length; $('#prog').textContent = `${ok}/${resp.length} aciertos`; $('#pst').textContent = `${LIST.length} preguntas · respondidas ${resp.length} · aciertos ${ok} (${Math.round(100*ok/resp.length)} %)`; }
  else progreso();
});

if (CFG.modo === 'practica') practica();
else if (ST.fin) resultados();
else if (ST.t0) examen();
else inicio();
</script>
</body>
</html>
