<title>Práctica por tema y nivel · Concurso Docente 2026–2027</title>
<style>
:root{--bg:#f6f8fb;--card:#fff;--ink:#1d2433;--mute:#5a6478;--line:#dbe1ea;--pri:#0b3d6e;--pri2:#1660a8;--ok:#0d6b3a;--okbg:#e6f4ec;--no:#9b1c1c;--nobg:#fbeaea;--sel:#e8f0fa}
@media (prefers-color-scheme: dark){:root{--bg:#10151d;--card:#18202b;--ink:#e6ebf2;--mute:#9aa6b8;--line:#2a3545;--pri:#7fb3ea;--pri2:#9cc6f2;--ok:#7fd3a3;--okbg:#16301f;--no:#f2a3a3;--nobg:#3a1c1c;--sel:#1e2d40}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px}
.hwrap{max-width:860px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
h1{font-size:17px;margin:0;color:var(--pri)}
.stat{font-size:14px;color:var(--mute)}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--pri)}
.timer.low{color:var(--no)}
main{max-width:860px;margin:0 auto;padding:16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin:0 0 16px}
.caso{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--pri);border-radius:10px;padding:14px 16px;margin:22px 0 10px}
.tag{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--pri);font-weight:700}
.caso p{margin:6px 0 0;white-space:pre-line}
.item{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0}
.enun{margin:0 0 8px}
.n{font-weight:700;color:var(--pri)}
.niv{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-right:4px;white-space:nowrap}
.op{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:6px 0;cursor:pointer;background:transparent;width:100%;text-align:left;color:inherit;font:inherit}
.op:hover{border-color:var(--pri2)}
.op .l{font-weight:700;min-width:20px}
.op.sel{background:var(--sel);border-color:var(--pri2)}
.op.ok{background:var(--okbg);border-color:var(--ok)}
.op.no{background:var(--nobg);border-color:var(--no)}
.op[disabled]{cursor:default}
.just{font-size:14px;margin:8px 0 0;padding:8px 10px;border-top:1px dashed var(--line)}
.just div{margin:4px 0}
.just .okt{color:var(--ok);font-weight:700}
.just .not{color:var(--no);font-weight:700}
.src{font-size:13px;color:var(--mute);margin-top:6px}
button.btn{background:var(--pri);color:var(--card);border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer}
button.btn.sec{background:transparent;color:var(--pri);border:1px solid var(--pri)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
select{font:inherit;padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);max-width:100%}
table{border-collapse:collapse;width:100%;font-size:15px}
td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
.big{font-size:40px;font-weight:800;color:var(--pri);line-height:1.1}
.aviso{font-size:13px;color:var(--mute)}
.hide{display:none !important}
.res-ok{color:var(--ok);font-weight:700}.res-no{color:var(--no);font-weight:700}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal .panel{max-width:420px}
footer{max-width:860px;margin:0 auto;padding:8px 16px 40px;font-size:12px;color:var(--mute)}
</style>
</head>

<header><div class="hwrap"><h1 id="tit"></h1><div class="row stat"><span id="prog"></span><span id="timer" class="timer"></span></div></div></header>
<main id="main"></main>

<footer><a href="./" style="color:var(--pri);font-weight:600">← Volver al menú</a><br><br>Material de preparación independiente. No está afiliado a la Comisión Nacional del Servicio Civil (CNSC) ni al Ministerio de Educación Nacional, y no contiene preguntas reales de la prueba.</footer>
<script>
const DATA = [{"comp": "lectura_critica", "rol": "docente", "tag": "Lectura crítica", "texto": "Lea la siguiente columna de opinión publicada en el boletín de una institución educativa:\n\n«Cada inicio de año, algunas familias piden más tareas, convencidas de que un cuaderno lleno es señal de un buen colegio. La intención es comprensible, pero confunde cantidad con aprendizaje. En primaria, una tarea extensa que el niño no entiende suele terminar resuelta por un adulto, y lo que llega al aula no es evidencia de lo que el estudiante sabe, sino de lo que su familia pudo hacer por él. Esto, además, profundiza las diferencias entre quienes tienen a alguien que los acompañe en casa y quienes no.\n\nNo se trata de eliminar el trabajo en casa. Se trata de que sea breve, que el estudiante pueda hacerlo solo y que el docente lo revise y lo devuelva con comentarios. Una tarea sin retroalimentación es apenas una obligación; con retroalimentación, se convierte en una oportunidad para aprender.\n\nPor eso, este año el área de lenguaje reemplazará las planas de repetición por lecturas cortas con una pregunta para conversar en familia. Esperamos que menos tareas signifiquen, por fin, mejores tareas.»", "items": [{"id": "LC-001", "niv": 1, "e": "En el consejo académico, usted debe resumir la tesis del texto. Una formulación fiel a esa tesis es que", "f": "ICFES (2021). Marco de referencia de la prueba de Lectura Crítica Saber 11.°: comprender cómo se articulan las partes de un texto para darle un sentido global.", "o": [["A", "las tareas escolares deberían eliminarse en primaria porque generan desigualdad entre los estudiantes.", "Contradice el texto, que afirma expresamente «No se trata de eliminar el trabajo en casa». La desigualdad es un argumento de apoyo, no la conclusión.", false], ["B", "las familias deberían acompañar más a sus hijos en las tareas para reducir las diferencias académicas.", "El texto no propone más acompañamiento familiar; por el contrario, plantea que el estudiante pueda hacer la tarea solo, para que lo entregado sea evidencia de su propio aprendizaje.", false], ["C", "las tareas valen por su calidad: breves, hechas por el propio estudiante y con retroalimentación.", "Recoge la idea que articula todo el texto: se critica confundir cantidad con aprendizaje y se propone que el trabajo en casa sea breve, autónomo y retroalimentado. Identificar la tesis exige integrar la información de los tres párrafos (comprensión global).", true]]}, {"id": "LC-002", "niv": 2, "e": "Cuando el autor afirma que la tarea resuelta por un adulto «no es evidencia de lo que el estudiante sabe», el argumento que está usando es que", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: reflexionar a partir de un texto y evaluar su contenido (supuestos y argumentos).", "o": [["A", "las familias no tienen la formación necesaria para ayudar a sus hijos con las tareas.", "El texto no cuestiona la formación de las familias. Su punto es que, si otro resuelve la tarea, el producto deja de informar sobre el aprendizaje del niño.", false], ["B", "una tarea solo cumple una función evaluativa si refleja el desempeño real del estudiante.", "El autor supone que la tarea debe servir como evidencia del aprendizaje del estudiante; si la hace un adulto, pierde esa función. Reconocer este supuesto implícito es una tarea propia de la lectura crítica (reflexionar a partir de un texto y evaluar su contenido).", true], ["C", "los estudiantes de primaria no tienen la madurez para trabajar de manera autónoma en casa.", "Contradice la propuesta del texto, que plantea tareas breves que el estudiante «pueda hacer solo». El autor no niega la autonomía de los niños; critica tareas extensas que ellos no entienden.", false]]}, {"id": "LC-003", "niv": 2, "e": "El segundo párrafo cumple, dentro del texto, la función de", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: comprender la estructura y la función de las partes de un texto.", "o": [["A", "precisar la postura del autor, aclarando que propone transformar las tareas y no suprimirlas.", "Tras la crítica del primer párrafo, el segundo evita una lectura extrema («No se trata de eliminar...») y establece las condiciones de una buena tarea. Identificar la función de una parte del texto corresponde a comprender su estructura.", true], ["B", "narrar la experiencia del área de lenguaje que sirve de evidencia para la tesis.", "La experiencia del área de lenguaje aparece en el tercer párrafo y se presenta como una decisión para este año, no como evidencia ya obtenida.", false], ["C", "presentar una objeción a la tesis del autor que luego se refuta en el último párrafo.", "El segundo párrafo no presenta una objeción; precisa la postura del propio autor. El último párrafo no refuta nada, sino que anuncia una acción concreta.", false]]}, {"id": "LC-004", "niv": 3, "e": "Un padre de familia responde que su hijo mejoró sus notas el año pasado gracias a que tuvo más tareas. Frente a la tesis del texto, este testimonio", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: evaluar la validez de argumentos y la solidez de las evidencias.", "o": [["A", "no la refuta, porque un solo caso no prueba que la cantidad de tareas haya causado la mejora.", "Un testimonio aislado no permite establecer causalidad: la mejora pudo deberse a otros factores (acompañamiento, cambio de docente, maduración). Evaluar la fuerza de un contraargumento es parte de la lectura crítica.", true], ["B", "la confirma, porque las notas altas muestran que la familia hizo las tareas por el estudiante.", "Es una inferencia sin sustento: nada en el testimonio indica que la familia hiciera las tareas. Atribuir esa conclusión es una lectura sesgada.", false], ["C", "la refuta, porque demuestra con un caso real que más tareas producen mejores resultados académicos.", "Generaliza a partir de un solo caso y confunde correlación con causalidad. Además, el texto se refiere a la evidencia de aprendizaje, no solo a las notas.", false]]}]}, {"comp": "lectura_critica", "rol": "docente", "tag": "Lectura crítica", "texto": "Lea el siguiente fragmento de un informe elaborado por la coordinación académica:\n\n«En 2025, el 40 % de los estudiantes de grado once usó la biblioteca escolar al menos una vez por semana. Entre ellos, el puntaje promedio en la prueba de Lectura Crítica fue 8 puntos superior al de quienes no la usaron. Por lo tanto, la biblioteca mejora la comprensión lectora y se propone que, desde 2026, todos los estudiantes de once estén obligados a asistir a ella dos horas por semana.\n\nLa propuesta tiene costos: se necesitaría contratar a un auxiliar de biblioteca en la jornada de la tarde y ampliar el horario de atención. Sin embargo, los beneficios justifican la inversión.»", "items": [{"id": "LC-005", "niv": 2, "e": "La principal debilidad del razonamiento del informe es que", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: reflexionar a partir de un texto y evaluar su contenido.", "o": [["A", "no reconoce que la propuesta implica costos para la institución y para su presupuesto.", "Es falso: el segundo párrafo reconoce expresamente los costos (auxiliar de biblioteca y ampliación del horario).", false], ["B", "usa datos de un solo año escolar, cuando debería comparar los resultados de varias instituciones.", "Más datos ayudarían, pero aunque se compararan varias instituciones persistiría el problema central: confundir asociación con causalidad.", false], ["C", "infiere una relación de causa y efecto a partir de una diferencia que puede tener otras explicaciones.", "Que los usuarios de la biblioteca tengan mejores puntajes no prueba que la biblioteca los cause: quizá quienes ya leen mejor son los que más la usan. Detectar el salto de la correlación a la causalidad es evaluar la solidez de un argumento.", true]]}, {"id": "LC-006", "niv": 3, "e": "De las siguientes informaciones, la que más debilitaría la conclusión del informe es que", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: evaluar la validez de argumentos e identificar información que los fortalece o debilita.", "o": [["A", "el puntaje de Lectura Crítica de grado once subió en todo el país durante el año 2025.", "Un aumento nacional afectaría a ambos grupos por igual, de modo que no explica la diferencia de 8 puntos entre usuarios y no usuarios.", false], ["B", "los estudiantes que usaron la biblioteca ya tenían mejores puntajes de lectura en grado noveno.", "Si la diferencia existía antes de usar la biblioteca, es probable que los mejores lectores sean quienes más la visitan, y no que la biblioteca haya producido la mejora. Esto ataca directamente el supuesto causal del informe.", true], ["C", "la biblioteca escolar tiene una colección de libros más pequeña que la de otras instituciones.", "Es información sobre la biblioteca, pero no explica la diferencia de puntajes ni cuestiona la relación entre uso y resultados.", false]]}, {"id": "LC-007", "niv": 1, "e": "En el texto, la expresión «Sin embargo» introduce", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: comprender cómo se articulan las partes de un texto (conectores).", "o": [["A", "una postura que contrapone los beneficios esperados a los costos que acaba de reconocer.", "El conector adversativo «sin embargo» presenta una idea que se opone parcialmente a la anterior: tras admitir los costos, el autor afirma que los beneficios los justifican. Identificar la función de los conectores es parte de comprender cómo se articulan las partes del texto.", true], ["B", "una conclusión que se deriva directamente de los datos estadísticos del primer párrafo.", "«Sin embargo» no introduce una consecuencia sino una oposición; además, la afirmación sobre los beneficios no se deriva de datos nuevos.", false], ["C", "un ejemplo de los costos mencionados para precisar su valor y su forma de financiación.", "Después del conector no aparece ningún ejemplo ni dato sobre la financiación; aparece una valoración que se opone a la objeción de los costos.", false]]}]}, {"comp": "lectura_critica", "rol": "docente", "tag": "Lectura crítica", "texto": "Lea la siguiente columna publicada en la revista de una institución educativa de básica secundaria y media:\n\n«Cada vez que un colegio anuncia que prohibirá los celulares, aparecen dos bandos irreconciliables. Unos celebran el regreso del silencio a las aulas; otros denuncian un retroceso frente al mundo digital. Ambos, creo, discuten sobre el objeto equivocado.\n\nEl problema no es el aparato, sino un uso que nadie ha enseñado. Un estudiante que revisa sus notificaciones cada tres minutos no necesita que le quiten el teléfono durante seis horas para devolvérselo intacto a la salida; necesita aprender a gobernar su atención. Prohibir sin enseñar se parece a cerrar la piscina para evitar que los niños se ahoguen: el riesgo desaparece del colegio, pero los espera en cualquier otra parte.\n\nAhora bien, enseñar ese autocontrol exige acuerdos claros. Propongo que cada área defina momentos en que el celular es una herramienta —buscar un dato, grabar un experimento, consultar un diccionario— y momentos en que debe permanecer guardado. Las reglas serán imperfectas, pero al menos tendrán un propósito pedagógico y no solo disciplinario.»", "items": [{"id": "LC-101", "niv": 1, "e": "Al explicar la columna a sus estudiantes, usted aclara que la expresión «gobernar su atención» significa", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: identificar y entender los contenidos locales (sentido de palabras y expresiones en contexto).", "o": [["A", "atender a las clases y renunciar por completo al uso del teléfono móvil.", "El autor no propone renunciar al teléfono; en el tercer párrafo plantea momentos en los que el celular es una herramienta de aprendizaje.", false], ["B", "cumplir las normas que fija el colegio sobre el uso del celular en clase.", "Describe un control externo, que es justamente lo que el autor considera insuficiente: el estudiante no necesita que le quiten el teléfono, sino aprender a regularse por sí mismo.", false], ["C", "decidir por sí mismo hacia dónde dirige su atención y en qué momento.", "El autor opone quitar el teléfono (control externo) a que el estudiante aprenda a regularse; «gobernar» se refiere aquí al autocontrol. Precisar el sentido de una expresión en su contexto es una tarea de comprensión local.", true]]}, {"id": "LC-102", "niv": 2, "e": "La comparación con «cerrar la piscina para evitar que los niños se ahoguen» se usa en el texto para", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: comprender cómo se articulan las partes de un texto para darle un sentido global.", "o": [["A", "sugerir que el colegio ofrezca actividades recreativas que compitan con el uso del celular.", "El texto no habla de actividades recreativas; la piscina es una imagen para cuestionar la prohibición, no una propuesta concreta.", false], ["B", "mostrar que prohibir aleja el riesgo del colegio, pero no prepara al estudiante para enfrentarlo.", "El texto lo explica tras los dos puntos: «el riesgo desaparece del colegio, pero los espera en cualquier otra parte». La analogía sirve de apoyo a la tesis de que hay que enseñar el uso, no solo prohibir. Reconocer la función de un recurso dentro del argumento es comprender cómo se articulan las partes del texto.", true], ["C", "advertir que el celular puede ser tan peligroso para los estudiantes como el agua para los niños pequeños.", "La analogía no compara la magnitud del peligro; compara dos estrategias que evitan el riesgo en un lugar sin preparar a la persona para enfrentarlo en otros.", false]]}, {"id": "LC-103", "niv": 2, "e": "Al afirmar en el primer párrafo que los dos bandos «discuten sobre el objeto equivocado», el autor", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: comprender el sentido global del texto (tesis e intención comunicativa).", "o": [["A", "toma distancia de ambas posturas para desplazar el debate del aparato hacia la enseñanza de su uso.", "Inmediatamente después afirma que «el problema no es el aparato, sino un uso que nadie ha enseñado». La frase prepara la tesis del texto, que supera la oposición entre prohibir y permitir.", true], ["B", "se pone del lado de quienes defienden la prohibición, aunque reconoce que esta tiene algunos costos.", "El autor no apoya la prohibición; la critica en el segundo párrafo («Prohibir sin enseñar…»).", false], ["C", "se declara neutral en el debate y evita proponer una solución propia al problema.", "No es neutral ni se abstiene: en el tercer párrafo formula una propuesta concreta («Propongo que cada área defina momentos…»).", false]]}, {"id": "LC-104", "niv": 3, "e": "En una reunión de área, un colega objeta que muchos estudiantes no logran autorregularse aunque reciban orientación. Frente a la propuesta de la columna, esta objeción", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: reflexionar a partir de un texto y evaluar su contenido (supuestos implícitos).", "o": [["A", "es irrelevante, porque la columna no se ocupa de la capacidad de los estudiantes para regularse.", "Es falso: la autorregulación es el centro de la columna («necesita aprender a gobernar su atención», «enseñar ese autocontrol»).", false], ["B", "demuestra que la prohibición total es la única medida eficaz para manejar el celular en el colegio.", "La objeción señala una dificultad, pero no prueba que exista una única medida eficaz; pasar de una dificultad a esa conclusión es un salto argumentativo.", false], ["C", "pone en duda un supuesto de la propuesta: que el autocontrol se enseña con acuerdos por áreas.", "La propuesta del autor descansa en la idea de que enseñar y acordar normas permitirá que los estudiantes se regulen. La objeción ataca ese supuesto, aunque no demuestra que la prohibición sea mejor. Identificar el supuesto que una objeción pone en duda es reflexionar sobre el contenido del texto.", true]]}]}, {"comp": "lectura_critica", "rol": "docente", "tag": "Lectura crítica", "texto": "La biblioteca de una institución urbana publicó en su cartelera la siguiente infografía, elaborada a partir de una encuesta a 600 estudiantes:\n\n«¿LEES POR GUSTO FUERA DEL COLEGIO?\nEstudiantes que leen por gusto al menos una vez por semana: grado quinto, 68 %; grado séptimo, 51 %; grado noveno, 37 %; grado once, 29 %.\nLo que más leen quienes leen por gusto: cómics y novela gráfica, 34 %; textos en redes sociales, 31 %; novelas, 22 %; otros, 13 %.\nPrincipal razón de quienes no leen por gusto: \"no tengo tiempo\", 46 %; \"no encuentro libros que me gusten\", 32 %; \"leer es aburrido\", 22 %.\nConclusión del equipo de la biblioteca: el gusto por la lectura se pierde en el colegio. Hay que cambiar el plan lector.»", "items": [{"id": "LC-105", "niv": 1, "e": "Según la infografía, entre grado quinto y grado once el porcentaje de estudiantes que lee por gusto disminuye en", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: identificar y entender los contenidos locales en textos discontinuos (tablas, gráficas e infografías).", "o": [["A", "14 puntos porcentuales.", "Corresponde a la caída entre grado séptimo (51 %) y grado noveno (37 %), no a la diferencia entre quinto y once.", false], ["B", "17 puntos porcentuales.", "Corresponde a la caída entre grado quinto (68 %) y grado séptimo (51 %); la pregunta abarca hasta grado once.", false], ["C", "39 puntos porcentuales.", "Grado quinto registra 68 % y grado once, 29 %: 68 − 29 = 39 puntos porcentuales. Localizar y relacionar datos de una infografía es comprensión de contenidos locales en textos discontinuos.", true]]}, {"id": "LC-106", "niv": 2, "e": "La conclusión «el gusto por la lectura se pierde en el colegio» es discutible porque", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: reflexionar a partir de un texto y evaluar su contenido (validez de argumentos y solidez de las evidencias).", "o": [["A", "el porcentaje de grado once resulta alto si se compara con el de los estudiantes de otros países.", "La infografía no presenta datos de otros países; esta comparación no puede hacerse con la información disponible.", false], ["B", "los datos muestran una caída según el grado, pero no prueban que su causa esté en el colegio.", "La encuesta registra una tendencia asociada al grado (y a la edad), pero también podrían influir otros factores, como la carga de actividades o los intereses propios de la adolescencia. Atribuir la caída al colegio es un salto causal que los datos no sustentan.", true], ["C", "la mayoría de los estudiantes de todos los grados afirma que no lee por gusto.", "Es falso: en grado quinto el 68 % y en grado séptimo el 51 % sí leen por gusto, es decir, la mayoría.", false]]}, {"id": "LC-107", "niv": 2, "e": "A partir de las razones que dan quienes no leen por gusto, usted puede inferir razonablemente que", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: identificar y entender los contenidos locales en textos discontinuos (tablas, gráficas e infografías).", "o": [["A", "la mayoría de los estudiantes encuestados considera que leer es aburrido.", "Solo el 22 % de quienes no leen por gusto da esa razón; no es la mayoría ni de ese grupo ni del total.", false], ["B", "cerca de un tercio de ese grupo no encuentra libros de su interés, lo que invita a revisar la oferta.", "El 32 % de quienes no leen por gusto afirma no encontrar libros que le gusten, cerca de un tercio. Es una inferencia prudente que se desprende directamente del dato.", true], ["C", "los estudiantes de grado once son quienes más afirman que no tienen tiempo para leer por gusto fuera del colegio.", "La infografía no presenta las razones por grado; no permite saber en qué grado se concentra la respuesta «no tengo tiempo».", false]]}, {"id": "LC-108", "niv": 3, "e": "Para que la propuesta de «cambiar el plan lector» tenga mejor sustento, el equipo de la biblioteca debería averiguar", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: reflexionar a partir de un texto y evaluar su contenido (validez de argumentos y solidez de las evidencias).", "o": [["A", "si la caída coincide con las lecturas exigidas en clase o se da también en otros colegios.", "La propuesta supone que el plan lector causa la pérdida del gusto. Contrastar la caída con las lecturas exigidas, y con lo que ocurre en otros colegios, permitiría saber si la causa está en la institución o en factores comunes a la edad. Identificar qué información fortalecería una conclusión es evaluar su solidez.", true], ["B", "qué porcentaje de los estudiantes de grado quinto prefiere leer cómics y novelas gráficas en lugar de novelas.", "Es un dato sobre preferencias en un grado, que no pone a prueba la relación entre el plan lector y la caída observada.", false], ["C", "cuántos libros nuevos ha comprado la biblioteca en los últimos cinco años.", "Este dato describe la colección, pero no permite saber si el plan lector tiene relación con la pérdida del gusto por la lectura.", false]]}]}, {"comp": "lectura_critica", "rol": "docente", "tag": "Lectura crítica", "texto": "Lea el siguiente fragmento de un ensayo sobre evaluación escrito por una docente de matemáticas:\n\n«En la escuela solemos tratar el error como una mancha: se marca en rojo, se descuenta y se olvida. Sin embargo, quien ha enseñado algunos años sabe que los errores no se distribuyen al azar. Cuando treinta estudiantes resuelven el mismo problema, rara vez aparecen treinta equivocaciones distintas; suelen repetirse tres o cuatro, y cada una revela una forma particular de pensar. El niño que afirma que 0,25 es mayor que 0,3 \"porque 25 es mayor que 3\" no está adivinando: aplica con coherencia una regla que le sirvió para los números naturales.\n\nPor eso, corregir no debería limitarse a señalar la respuesta correcta. Si el docente no identifica la regla que produjo el error, el estudiante copiará la solución y volverá a equivocarse en el siguiente ejercicio. La pregunta útil no es \"¿qué hizo mal?\", sino \"¿qué pensó para llegar ahí?\".\n\nNada de esto significa que todo error sea valioso. Hay descuidos que no esconden ninguna idea y que basta con señalar. La tarea del docente es distinguirlos.»", "items": [{"id": "LC-109", "niv": 1, "e": "En el texto, la palabra «mancha» expresa que en la escuela el error suele verse como", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: identificar y entender los contenidos locales (sentido de palabras y expresiones en contexto).", "o": [["A", "algo que se señala y se castiga, sin aprovecharlo para aprender.", "La misma oración lo explica: el error «se marca en rojo, se descuenta y se olvida». La autora usa la metáfora para describir una práctica que critica.", true], ["B", "una señal que el docente usa para orientar su forma de enseñar.", "Esa es la propuesta de la autora, no la manera en que, según ella, la escuela suele tratar el error.", false], ["C", "una huella que acompaña al estudiante durante toda su vida escolar.", "El texto dice que el error «se olvida»; no lo presenta como una marca permanente.", false]]}, {"id": "LC-110", "niv": 2, "e": "El ejemplo del niño que considera que 0,25 es mayor que 0,3 cumple, dentro del texto, la función de", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: comprender cómo se articulan las partes de un texto para darle un sentido global.", "o": [["A", "demostrar que los estudiantes de primaria todavía no comprenden el valor posicional de los números decimales.", "Es una generalización que el texto no hace: el ejemplo trata de un niño y de un tipo de error, no de todos los estudiantes.", false], ["B", "ilustrar que una equivocación puede seguir una lógica que sí funcionaba con otro tipo de números.", "El texto lo dice: el niño «aplica con coherencia una regla que le sirvió para los números naturales». El ejemplo concreta la afirmación de que cada error revela una forma de pensar.", true], ["C", "presentar un descuido que no esconde ninguna idea y que basta con señalar al estudiante.", "Es lo contrario: la autora usa el ejemplo como un error que sí revela una idea («no está adivinando»). Los descuidos se mencionan en el último párrafo como otro tipo de error.", false]]}, {"id": "LC-111", "niv": 2, "e": "El último párrafo, que empieza con «Nada de esto significa», tiene el propósito de", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: comprender cómo se articulan las partes de un texto (conectores y función de los párrafos).", "o": [["A", "contradecir lo anterior y reconocer que la corrección tradicional es suficiente.", "La autora no abandona su postura; solo aclara que no todos los errores merecen el mismo tratamiento.", false], ["B", "introducir un tema nuevo sobre la atención de los estudiantes en las evaluaciones.", "El párrafo sigue hablando del error y de la tarea del docente; no introduce el tema de la atención.", false], ["C", "matizar la postura de la autora para que no se entienda que todo error tiene el mismo valor.", "Tras defender el análisis de los errores, la autora previene una lectura extrema: hay descuidos que basta con señalar. Reconocer que un párrafo matiza o delimita una tesis es comprender la articulación del texto.", true]]}, {"id": "LC-112", "niv": 3, "e": "Al comentar el texto con sus colegas, usted señala que el argumento de la autora se apoya principalmente en", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: reflexionar a partir de un texto y evaluar su contenido (validez de argumentos y solidez de las evidencias).", "o": [["A", "los resultados de una investigación sobre los errores más frecuentes en matemáticas.", "El texto no menciona ninguna investigación ni presenta datos de estudios.", false], ["B", "la opinión de los estudiantes acerca de la forma en que prefieren que se corrijan sus trabajos.", "El texto no recoge opiniones de estudiantes sobre la corrección.", false], ["C", "su experiencia como docente y en un ejemplo de aula, más que en datos de investigación.", "La autora apela a lo que «sabe quien ha enseñado algunos años» y a un ejemplo concreto. Identificar el tipo de respaldo de un argumento es parte de evaluar su solidez.", true]]}]}, {"comp": "lectura_critica", "rol": "docente", "tag": "Lectura crítica", "texto": "Lea la siguiente nota publicada en el periódico escolar de una institución rural con varias sedes:\n\n«LA HUERTA QUE ENSEÑA A SUMAR\nEn la sede La Esperanza, donde una sola docente atiende a 22 niños de preescolar a quinto, la huerta escolar dejó de ser un adorno. Desde febrero, cada grupo tiene una tarea: los más pequeños riegan y cuentan semillas; los de tercero miden cada semana el crecimiento de las plantas y lo registran en una tabla; los de quinto calculan cuánto se gastó en abono y cuánto se ahorraría el restaurante escolar con la cosecha.\n\"Antes, la matemática era algo del cuaderno; ahora la ven crecer\", dice la docente. Los padres colaboran con el cercado y con semillas nativas. Algunos, sin embargo, se preguntan si tanto tiempo en la huerta no le quita horas a la lectura.\nLa docente responde que los estudiantes también escriben un diario de la huerta y que, por ahora, el mayor reto es conseguir agua en verano, cuando la quebrada baja.»", "items": [{"id": "LC-113", "niv": 1, "e": "Según la nota, los estudiantes de tercero participan en la huerta", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: identificar y entender los contenidos locales que conforman un texto.", "o": [["A", "llevando un registro semanal de cuánto van creciendo las plantas.", "La nota lo dice expresamente: «los de tercero miden cada semana el crecimiento de las plantas y lo registran en una tabla». Es una pregunta de información local explícita.", true], ["B", "calculando cuánto se ahorraría el restaurante escolar con la cosecha.", "Esa tarea corresponde, según la nota, a los estudiantes de quinto.", false], ["C", "regando las plantas y contando las semillas que se van a sembrar.", "Esa tarea corresponde a «los más pequeños», no a los de tercero.", false]]}, {"id": "LC-114", "niv": 2, "e": "Cuando la docente dice que la matemática «ahora la ven crecer», quiere decir que", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: identificar y entender los contenidos locales (sentido de palabras y expresiones en contexto).", "o": [["A", "los estudiantes obtienen mejores notas en matemáticas desde que empezó el proyecto de la huerta.", "La nota no presenta información sobre calificaciones; la frase no habla de resultados, sino de la forma en que los estudiantes viven la matemática.", false], ["B", "la matemática se vuelve concreta para los estudiantes al observarla en las plantas.", "La docente contrapone la matemática «del cuaderno» a la que se ve en la huerta: medir, contar y calcular a partir de algo que crece. La expresión juega con el crecimiento de las plantas para mostrar que la matemática se hace tangible.", true], ["C", "la cantidad de contenidos matemáticos del plan de estudios aumentó desde febrero.", "Nada en la nota indica un aumento de contenidos; la frase se refiere a un cambio en la forma de aprender.", false]]}, {"id": "LC-115", "niv": 1, "e": "En la nota, la inquietud de algunos padres sobre el tiempo dedicado a la huerta aparece como", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: comprender cómo se articulan las partes de un texto para darle un sentido global.", "o": [["A", "una objeción que la nota acompaña con la respuesta de la docente.", "Después de la inquietud («Algunos, sin embargo, se preguntan…»), la nota presenta la respuesta: los estudiantes también escriben un diario de la huerta. Reconocer cómo se organiza una objeción y su respuesta es comprender la estructura del texto.", true], ["B", "la postura oficial de la institución frente al proyecto de la huerta.", "Es la opinión de «algunos» padres, no de la institución; la nota incluso recoge la respuesta de la docente.", false], ["C", "la razón por la cual el proyecto se suspenderá durante el verano.", "El problema del verano es la escasez de agua, no la inquietud de los padres; además, la nota no anuncia ninguna suspensión.", false]]}, {"id": "LC-116", "niv": 3, "e": "Para saber si la huerta mejora realmente el aprendizaje de la matemática, la información de la nota resulta", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: reflexionar a partir de un texto y evaluar su contenido (validez de argumentos y solidez de las evidencias).", "o": [["A", "suficiente, porque la docente afirma que los estudiantes ahora comprenden mejor la matemática.", "La afirmación de la docente es un testimonio valioso, pero por sí solo no demuestra una mejora del aprendizaje.", false], ["B", "contradictoria, porque los padres apoyan el proyecto y al mismo tiempo lo critican.", "No hay contradicción: la nota dice que los padres colaboran y que «algunos» tienen una inquietud; son aspectos compatibles.", false], ["C", "insuficiente, porque describe actividades y opiniones, pero no presenta resultados de aprendizaje.", "La nota informa qué hacen los estudiantes y lo que opina la docente, pero no ofrece evidencia sobre lo que aprendieron (por ejemplo, desempeños antes y después). Distinguir entre descripción, testimonio y evidencia es evaluar la solidez de una afirmación.", true]]}]}, {"comp": "lectura_critica", "rol": "docente", "tag": "Lectura crítica", "texto": "Lea los siguientes textos sobre la jornada única:\n\nTexto 1. «La jornada única amplía el tiempo que los estudiantes pasan en la escuela y, con él, las oportunidades de aprender. Más horas permiten profundizar en las áreas básicas, ofrecer arte y deporte, y proteger a niños y jóvenes de los riesgos de la calle. Por eso, la meta es extenderla al mayor número posible de instituciones en los próximos años.»\n\nTexto 2. «Nadie discute que más tiempo escolar puede ser valioso. Pero el tiempo no educa por sí solo. Si las horas adicionales se llenan con más de lo mismo, en aulas sin ventilación y sin un comedor adecuado, el resultado puede ser cansancio y no aprendizaje. Antes de ampliar la jornada, conviene preguntar qué se hará con esas horas y en qué condiciones.»", "items": [{"id": "LC-117", "niv": 1, "e": "El texto 2 se diferencia del texto 1 en que", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: reflexionar a partir de un texto y evaluar su contenido (contraste de textos con perspectivas distintas).", "o": [["A", "propone extender la jornada única a más instituciones y en un plazo más corto que el texto 1.", "Es el texto 1 el que plantea extender la jornada; el texto 2 pide revisar primero las condiciones.", false], ["B", "condiciona el valor de la jornada única al uso de las horas y a las condiciones de cada institución.", "El texto 2 acepta el posible valor del tiempo adicional, pero advierte que depende de «qué se hará con esas horas y en qué condiciones». Comparar las posturas de dos textos es una tarea de lectura crítica.", true], ["C", "rechaza la jornada única, porque considera que el tiempo escolar no se relaciona con el aprendizaje.", "El texto 2 no rechaza la jornada única ni niega el valor del tiempo: afirma que «más tiempo escolar puede ser valioso».", false]]}, {"id": "LC-118", "niv": 1, "e": "En el texto 2, la expresión «más de lo mismo» se refiere a", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: identificar y entender los contenidos locales (sentido de palabras y expresiones en contexto).", "o": [["A", "aumentar el número de estudiantes por aula durante la jornada ampliada.", "La expresión no se refiere al número de estudiantes, sino al contenido de las horas adicionales.", false], ["B", "repetir en las horas adicionales las mismas prácticas, sin un propósito nuevo.", "El texto 2 advierte que, si las horas se llenan con lo de siempre, pueden producir cansancio y no aprendizaje. El sentido de la expresión se infiere del contexto.", true], ["C", "ofrecer arte y deporte, como ya lo hacen las instituciones que tienen jornada única.", "El arte y el deporte se mencionan en el texto 1 como novedades valiosas; el texto 2 no los critica.", false]]}, {"id": "LC-119", "niv": 2, "e": "Un supuesto del texto 1 que el texto 2 pone en duda es que", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: reflexionar a partir de un texto y evaluar su contenido (supuestos implícitos).", "o": [["A", "el arte y el deporte forman parte de una formación integral de calidad.", "El texto 2 no cuestiona el valor del arte y del deporte; su crítica se centra en el uso de las horas y en las condiciones.", false], ["B", "los niños y jóvenes enfrentan algunos riesgos cuando están en la calle.", "El texto 2 no discute los riesgos de la calle; no se pronuncia sobre ese punto.", false], ["C", "el aumento de las horas en la escuela se traduce por sí mismo en más aprendizaje.", "El texto 1 pasa de «más horas» a «más oportunidades de aprender» sin condiciones; el texto 2 responde que «el tiempo no educa por sí solo». Identificar un supuesto y quién lo cuestiona es reflexionar sobre el contenido de los textos.", true]]}, {"id": "LC-120", "niv": 3, "e": "Usted quiere usar ambos textos en un debate con estudiantes de grado once. Una consigna que permite confrontarlos sin favorecer a ninguno es pedir a los estudiantes que", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: reflexionar a partir de un texto y evaluar su contenido (contraste de textos con perspectivas distintas).", "o": [["A", "definan qué condiciones harían que más horas en la escuela significaran más aprendizaje.", "La consigna recoge el punto de encuentro entre ambos textos (el tiempo puede ser valioso) y el punto de desacuerdo (si basta por sí solo), sin presuponer la respuesta. Formular preguntas que contrasten perspectivas es propio de la lectura crítica.", true], ["B", "demuestren que las horas adicionales producen cansancio en lugar de aprendizaje.", "Da por cierta una advertencia del texto 2, que además está planteada como posibilidad («puede ser»), y orienta la discusión a su favor.", false], ["C", "expliquen por qué la jornada única protege a los jóvenes de los riesgos de la calle.", "Da por cierta una afirmación del texto 1 y orienta la discusión a su favor.", false]]}]}, {"comp": "lectura_critica", "rol": "docente", "tag": "Lectura crítica", "texto": "Lea el siguiente texto de divulgación científica, que usted piensa usar en una dirección de grupo con estudiantes de grado décimo:\n\n«Durante la adolescencia, el reloj biológico se desplaza: la hormona que induce el sueño empieza a liberarse más tarde en la noche. Por eso, muchos adolescentes no sienten sueño antes de las once, aunque se acuesten temprano. Si deben levantarse a las cinco para llegar al colegio, duermen bastante menos de las ocho a diez horas que suelen recomendarse para su edad.\n\nAlgunos estudios han encontrado que, cuando las clases empiezan más tarde, los estudiantes duermen más y llegan más atentos. Otros advierten que el efecto depende de que los jóvenes no aprovechen ese margen para trasnochar frente a una pantalla. En cualquier caso, culpar al adolescente de \"perezoso\" ignora que parte de su somnolencia matinal tiene una base biológica.»", "items": [{"id": "LC-121", "niv": 1, "e": "Según el texto, muchos adolescentes no sienten sueño antes de las once porque", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: identificar y entender los contenidos locales que conforman un texto.", "o": [["A", "pasan demasiado tiempo frente a una pantalla antes de irse a acostar.", "El texto menciona las pantallas al hablar del efecto de cambiar el horario escolar, no como la explicación de por qué los adolescentes no sienten sueño.", false], ["B", "se levantan muy temprano y suelen dormir durante la tarde.", "El texto no menciona siestas; levantarse temprano se presenta como causa de dormir poco, no de la falta de sueño en la noche.", false], ["C", "en esta etapa la hormona que induce el sueño se libera más tarde.", "El texto lo afirma y lo enlaza con «Por eso»: el desplazamiento del reloj biológico explica que no sientan sueño antes de las once.", true]]}, {"id": "LC-122", "niv": 2, "e": "La expresión «En cualquier caso», al inicio de la última oración, indica que", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: comprender cómo se articulan las partes de un texto (conectores y función de los párrafos).", "o": [["A", "lo que sigue es válido sin importar cuál de los estudios citados tenga razón.", "El conector introduce una conclusión que se mantiene más allá de las diferencias entre los estudios: la somnolencia matinal tiene, en parte, una base biológica. Reconocer el valor de los conectores es comprender cómo se articulan las partes del texto.", true], ["B", "todos los estudios mencionados llegaron a la misma conclusión sobre el horario.", "Al contrario: el texto presenta estudios con matices distintos («Algunos…», «Otros advierten…»).", false], ["C", "el autor va a presentar un caso particular que ejemplifica lo dicho antes.", "Después del conector no aparece un ejemplo, sino una afirmación general sobre cómo juzgar al adolescente.", false]]}, {"id": "LC-123", "niv": 3, "e": "Si un rector usara este texto para justificar que las clases empiecen más tarde, un colega podría objetar, con base en el mismo texto, que", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: reflexionar a partir de un texto y evaluar su contenido (validez de argumentos y solidez de las evidencias).", "o": [["A", "los estudios citados muestran que el horario de inicio de clases no influye en la atención de los estudiantes.", "Es falso: el texto informa que, según algunos estudios, con un horario más tarde los estudiantes «llegan más atentos».", false], ["B", "el beneficio podría perderse si los jóvenes usan el tiempo ganado para acostarse más tarde con el celular.", "El propio texto recoge esa advertencia («Otros advierten que el efecto depende…»). Usar la información de un texto para matizar una conclusión que se apoya en él es evaluar la solidez del argumento.", true], ["C", "la somnolencia de los adolescentes se explica principalmente por la pereza y no por la biología.", "Contradice el texto, que cuestiona precisamente calificar de «perezoso» al adolescente.", false]]}]}, {"comp": "lectura_critica", "rol": "docente", "tag": "Lectura crítica", "texto": "Lea el siguiente diálogo entre dos docentes en la sala de profesores de un colegio de básica secundaria:\n\n—Profesora Marta: Este año tengo en séptimo a Julián, que tiene baja visión. La orientadora me dijo que necesita material ampliado y sentarse adelante. Yo lo hago, pero me preocupa que no sea suficiente.\n—Profesor Andrés: Con todo respeto, yo creo que ese niño debería estar en un colegio especial. Allá tienen los equipos y los docentes preparados; aquí lo vamos a dejar atrás.\n—Profesora Marta: Pero él no está atrás. En ciencias es de los que más participa. Lo que le cuesta es leer lo que yo escribo en el tablero.\n—Profesor Andrés: Por eso mismo. Si no puede leer el tablero, ¿cómo va a seguir el ritmo de los demás?\n—Profesora Marta: Tal vez el problema no sea Julián, sino que todo lo pongo en el tablero.", "items": [{"id": "LC-124", "niv": 1, "e": "En el diálogo, la profesora Marta afirma que a Julián le cuesta", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: identificar y entender los contenidos locales que conforman un texto.", "o": [["A", "participar en las clases del área de ciencias.", "Ella afirma lo contrario: «En ciencias es de los que más participa».", false], ["B", "leer lo que ella escribe en el tablero durante las clases.", "La profesora lo dice de manera explícita: «Lo que le cuesta es leer lo que yo escribo en el tablero». Es información local del texto.", true], ["C", "seguir el ritmo de trabajo de sus compañeros.", "Es una suposición del profesor Andrés, no una afirmación de la profesora Marta, quien sostiene que Julián «no está atrás».", false]]}, {"id": "LC-125", "niv": 2, "e": "El argumento del profesor Andrés parte del supuesto de que", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: reflexionar a partir de un texto y evaluar su contenido (supuestos implícitos).", "o": [["A", "el estudiante tiene un desempeño bajo en todas las áreas del plan de estudios de séptimo.", "Andrés no afirma eso; teme que el estudiante se quede atrás, y Marta informa que participa mucho en ciencias.", false], ["B", "el colegio cuenta con los recursos necesarios para atender a estudiantes con baja visión.", "Andrés supone lo contrario: que los equipos y los docentes preparados están en un «colegio especial», no en el suyo.", false], ["C", "la dificultad está en el estudiante y no en la forma en que se presenta la clase.", "Andrés concluye que Julián debe cambiar de colegio porque no puede leer el tablero, sin considerar que la clase podría presentarse de otro modo. Esa idea implícita sostiene su argumento.", true]]}, {"id": "LC-126", "niv": 2, "e": "La última intervención de la profesora Marta", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: comprender cómo se articulan las partes de un texto para darle un sentido global.", "o": [["A", "replantea el problema al trasladarlo del estudiante a sus propias prácticas de enseñanza.", "Con «Tal vez el problema no sea Julián, sino que todo lo pongo en el tablero», Marta cambia el foco: la barrera está en cómo presenta la información. Reconocer este giro es comprender cómo se articula el diálogo.", true], ["B", "acepta el argumento de su colega y reconoce que el estudiante debería cambiar de colegio.", "Marta no acepta el traslado; al contrario, busca la solución en su propia práctica.", false], ["C", "introduce una queja sobre la falta de recursos tecnológicos en el colegio para su clase.", "Marta no se refiere a recursos tecnológicos; reflexiona sobre su forma de usar el tablero.", false]]}, {"id": "LC-127", "niv": 3, "e": "La pregunta «Si no puede leer el tablero, ¿cómo va a seguir el ritmo de los demás?» es un argumento débil porque", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: reflexionar a partir de un texto y evaluar su contenido (validez de argumentos y solidez de las evidencias).", "o": [["A", "da por hecho que el tablero es la única vía para acceder a lo que se enseña en la clase.", "El razonamiento supone que sin el tablero no hay aprendizaje, cuando la información puede presentarse de otras formas (oral, material ampliado, recursos táctiles o digitales). Señalar una premisa no justificada es evaluar la validez de un argumento.", true], ["B", "se apoya en la opinión de la orientadora, que no conoce el desempeño real del estudiante.", "Andrés no se apoya en la orientadora; es Marta quien la cita, y para referirse a los apoyos que necesita Julián.", false], ["C", "reconoce que el estudiante participa en ciencias, lo cual contradice la postura que había sostenido.", "Andrés nunca reconoce esa participación; es Marta quien la menciona.", false]]}]}, {"comp": "lectura_critica", "rol": "directivo", "tag": "Lectura crítica", "texto": "Lea la siguiente carta que una madre de familia envió al rector de una institución educativa oficial:\n\n«Señor rector:\nLe escribo con respeto, pero con preocupación. La lista de útiles de grado tercero incluye doce cuadernos, un diccionario de una marca específica, plastilina, témperas y un libro de inglés que cuesta casi lo mismo que el mercado de una semana. Entiendo que los docentes necesitan materiales para trabajar, y no pongo en duda su buena intención.\nSin embargo, me pregunto si todo lo que se pide se usa. El año pasado, mi hijo terminó el año con seis cuadernos casi en blanco, y el libro de inglés se usó, según él, \"unas cinco veces\". Si eso le pasó a él, seguramente les pasa a muchos.\nLe propongo que la lista se revise con el consejo de padres y que se indique para qué se usará cada material. No pido que se eliminen los útiles, sino que se pidan solo los necesarios.\nAtentamente,\nLuz Dary, madre de familia de grado tercero»", "items": [{"id": "LC-128", "niv": 1, "e": "Como rector, usted identifica que la intención principal de la carta es", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: comprender el sentido global del texto (tesis e intención comunicativa).", "o": [["A", "solicitar que se eliminen de la lista el libro de inglés y el diccionario de marca específica.", "La carta dice expresamente «No pido que se eliminen los útiles», sino que se pidan los necesarios.", false], ["B", "denunciar a los docentes por pedir materiales que saben que no van a necesitar durante el año.", "La madre aclara que no pone en duda la buena intención de los docentes; su tono no es de denuncia.", false], ["C", "pedir que la lista de útiles se revise y que se explique el uso de cada material.", "La madre lo formula en su propuesta: revisar la lista con el consejo de padres e indicar para qué se usará cada material. Identificar la intención comunicativa es comprender el sentido global del texto.", true]]}, {"id": "LC-129", "niv": 1, "e": "La comparación del precio del libro con «el mercado de una semana» busca", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: identificar y entender los contenidos locales (sentido de palabras y expresiones en contexto).", "o": [["A", "informar al rector el precio exacto que tiene el libro de inglés en el comercio.", "La comparación no da un precio exacto; es una manera de expresar cuánto pesa ese gasto.", false], ["B", "hacer evidente el peso económico que tiene el libro para una familia.", "Al equiparar el libro con la comida de una semana, la madre traduce el costo a una experiencia cotidiana y muestra el esfuerzo que representa. Interpretar el sentido de una expresión en su contexto es comprensión local.", true], ["C", "comparar la calidad del libro de inglés con la de los demás útiles de la lista.", "La expresión se refiere al costo, no a la calidad del material.", false]]}, {"id": "LC-130", "niv": 2, "e": "La frase «y no pongo en duda su buena intención» cumple en la carta la función de", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: comprender cómo se articulan las partes de un texto para darle un sentido global.", "o": [["A", "reconocer que la lista de útiles es adecuada y no necesita cambios.", "La madre sí propone cambios: revisar la lista y explicar el uso de cada material.", false], ["B", "anticiparse a que su petición se lea como un ataque contra el trabajo de los docentes.", "Antes de plantear su crítica, la madre reconoce la buena intención de los docentes para que su carta no se interprete como una acusación. Es un recurso para preparar al lector y facilitar que acepte la propuesta.", true], ["C", "presentar la conclusión principal a la que llega la madre en su carta.", "La conclusión es la propuesta del último párrafo; esta frase aparece al inicio, como una aclaración.", false]]}, {"id": "LC-131", "niv": 2, "e": "La afirmación «Si eso le pasó a él, seguramente les pasa a muchos» debilita el argumento de la carta porque", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: reflexionar a partir de un texto y evaluar su contenido (validez de argumentos y solidez de las evidencias).", "o": [["A", "generaliza a partir de la experiencia de un solo estudiante.", "La madre pasa del caso de su hijo a «muchos» sin otra evidencia. Es una generalización apresurada; reconocerla es evaluar la solidez de un argumento.", true], ["B", "pone en duda la buena intención con la que los docentes elaboraron la lista de útiles.", "La madre aclara en el primer párrafo que no pone en duda esa intención; la frase no se refiere a los docentes.", false], ["C", "contradice la propuesta de revisar la lista de útiles con el consejo de padres.", "No hay contradicción: la generalización se usa, justamente, para apoyar la propuesta de revisión.", false]]}, {"id": "LC-132", "niv": 3, "e": "Un directivo responde a la madre que la lista la elaboraron los docentes y que ellos saben qué necesitan. Frente a la carta, esta respuesta", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: reflexionar a partir de un texto y evaluar su contenido (validez de argumentos y solidez de las evidencias).", "o": [["A", "responde a la propuesta, porque acepta revisar la lista de útiles junto con el consejo de padres.", "La respuesta no menciona al consejo de padres ni acepta revisar la lista.", false], ["B", "refuta la carta, porque demuestra que todos los materiales incluidos en la lista son necesarios.", "La respuesta no aporta ninguna prueba sobre el uso de los materiales; solo apela a la autoridad de los docentes.", false], ["C", "no atiende el punto central, que no es quién elabora la lista sino si se usa lo que se pide.", "La madre no discute la competencia de los docentes, sino el uso real de los materiales. Responder con la autoridad de quien elaboró la lista deja sin respuesta la pregunta planteada. Detectar que una réplica no responde al argumento es una tarea de evaluación crítica.", true]]}]}, {"comp": "lectura_critica", "rol": "docente", "tag": "Lectura crítica", "texto": "Lea el siguiente fragmento de un ensayo escrito por un docente etnoeducador:\n\n«Durante mucho tiempo, la escuela llegó a los territorios indígenas convencida de que traía el conocimiento a donde no lo había. Enseñó a leer y a escribir, y eso fue valioso; pero, al mismo tiempo, trató la palabra de los mayores como un saber menor, algo propio del pasado que debía ceder ante el libro.\n\nHoy sabemos que la oralidad no es la etapa previa a la escritura, sino otra forma de guardar y transmitir el conocimiento. Alrededor del fogón se aprenden la historia del pueblo, las normas de convivencia y los nombres de las plantas, con una precisión que ningún manual escolar ha igualado.\n\nUna escuela propia no tendría que elegir entre el cuaderno y la palabra de los mayores. Podría, por ejemplo, invitar a los sabedores a enseñar en el aula y pedir a los niños que escriban, en su lengua, lo que escuchan. Así, la escritura dejaría de ser un instrumento para reemplazar la tradición y se convertiría en una herramienta para conservarla.»", "items": [{"id": "LC-133", "niv": 1, "e": "Según el texto, la oralidad debe entenderse como", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: identificar y entender los contenidos locales que conforman un texto.", "o": [["A", "una etapa previa que conduce al aprendizaje de la escritura.", "El texto lo niega de manera explícita: «la oralidad no es la etapa previa a la escritura».", false], ["B", "un modo propio de conservar y compartir los saberes de una comunidad.", "El segundo párrafo lo afirma: la oralidad es «otra forma de guardar y transmitir el conocimiento».", true], ["C", "un saber del pasado que debe ceder su lugar al libro.", "Esa es la visión que el autor atribuye a la escuela tradicional y que critica.", false]]}, {"id": "LC-134", "niv": 2, "e": "La expresión «convencida de que traía el conocimiento a donde no lo había» permite inferir que el autor", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: identificar y entender los contenidos locales (sentido de palabras y expresiones en contexto).", "o": [["A", "critica la idea de que en esos territorios no existía conocimiento antes de la escuela.", "El autor atribuye esa convicción a la escuela para cuestionarla; el resto del texto muestra que las comunidades ya tenían saberes propios. Inferir la postura del autor a partir de una expresión es comprensión local con inferencia.", true], ["B", "reconoce que la escuela fue la primera fuente de conocimiento en los territorios indígenas.", "Es justo lo que el autor cuestiona: la palabra de los mayores ya era una forma de conocimiento.", false], ["C", "considera que la escuela debe retirarse de los territorios indígenas para proteger la tradición.", "El autor no propone retirar la escuela, sino transformarla en una «escuela propia» que integre la tradición.", false]]}, {"id": "LC-135", "niv": 2, "e": "La propuesta del último párrafo se relaciona con los anteriores porque", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: comprender cómo se articulan las partes de un texto para darle un sentido global.", "o": [["A", "repite el ejemplo del fogón para demostrar que la oralidad supera a la escritura.", "El último párrafo no repite ese ejemplo ni sostiene que una forma sea superior; busca integrarlas.", false], ["B", "contradice el primer párrafo, en el que se reconoce que enseñar a leer y escribir fue valioso.", "No lo contradice: la propuesta mantiene el valor de la escritura y le asigna un nuevo propósito.", false], ["C", "plantea cómo integrar la escritura y la oralidad, que antes aparecían enfrentadas.", "Los dos primeros párrafos describen la oposición entre el libro y la palabra de los mayores; el último propone que la escritura sirva para conservar la tradición oral. Reconocer esta relación es comprender cómo se articulan las partes del texto.", true]]}, {"id": "LC-136", "niv": 3, "e": "La afirmación de que alrededor del fogón se aprenden los nombres de las plantas «con una precisión que ningún manual escolar ha igualado» es", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: reflexionar a partir de un texto y evaluar su contenido.", "o": [["A", "una valoración del propio autor, que el texto no respalda con datos ni con evidencias.", "Es un juicio que refuerza la tesis, pero el texto no ofrece datos que lo sustenten. Distinguir entre opiniones y afirmaciones respaldadas es reflexionar sobre el contenido de un texto.", true], ["B", "una cita textual de los mayores que el autor reproduce en la lengua de la comunidad.", "No aparece entre comillas ni se atribuye a nadie; es una afirmación del propio autor.", false], ["C", "un dato comprobado que el autor obtiene de un estudio comparativo entre manuales.", "El texto no menciona ningún estudio; nada indica que se trate de un dato comprobado.", false]]}]}, {"comp": "lectura_critica", "rol": "directivo", "tag": "Lectura crítica", "texto": "Lea la siguiente descripción de una infografía presentada por la secretaría de educación de un municipio, con datos de un año escolar:\n\n«¿POR QUÉ DEJAN EL COLEGIO?\nEncuesta a 250 familias de estudiantes que abandonaron la escuela. Principal causa señalada por cada familia:\n• Necesidad de trabajar o de ayudar en la casa: 38 %.\n• Cambio de domicilio sin traslado a otro colegio: 21 %.\n• Distancia al colegio o falta de transporte: 17 %.\n• Desinterés o bajo rendimiento: 15 %.\n• Embarazo adolescente: 6 %.\n• Otras: 3 %.\nMensaje final: \"Más de la mitad de los casos tiene causas económicas (necesidad de trabajar o de ayudar en la casa) o de acceso al colegio (distancia o falta de transporte). La escuela sola no puede resolverlos.\"»", "items": [{"id": "LC-137", "niv": 1, "e": "Según la infografía, la causa de abandono que las familias señalaron con mayor frecuencia fue", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: identificar y entender los contenidos locales en textos discontinuos (tablas, gráficas e infografías).", "o": [["A", "el desinterés de los estudiantes o el bajo rendimiento (15 %).", "Fue señalado por el 15 % de las familias; no es la causa más frecuente.", false], ["B", "la distancia al colegio o la falta de transporte (17 %).", "Fue señalada por el 17 % de las familias, por debajo de la necesidad de trabajar (38 %) y del cambio de domicilio (21 %).", false], ["C", "la necesidad de trabajar o de ayudar en la casa (38 %).", "Con el 38 %, es el porcentaje más alto de la infografía. Localizar el valor máximo es comprensión de información explícita en un texto discontinuo.", true]]}, {"id": "LC-138", "niv": 2, "e": "La afirmación «Más de la mitad de los casos tiene causas económicas o de acceso al colegio» se sustenta en", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: identificar y entender los contenidos locales en textos discontinuos (tablas, gráficas e infografías).", "o": [["A", "la suma de todas las causas, excepto la categoría «otras» de la infografía (97 %).", "Esa suma incluye causas que no son económicas ni de acceso, como el embarazo adolescente o el desinterés.", false], ["B", "la suma de la necesidad de trabajar y la distancia o falta de transporte (55 %).", "La causa económica (38 %) más la de acceso (17 %) suman 55 %, es decir, más de la mitad. Relacionar datos para verificar una afirmación es interpretar críticamente un texto discontinuo.", true], ["C", "el porcentaje de familias que señaló la necesidad de trabajar o de ayudar en la casa (38 %).", "Por sí solo, el 38 % no supera la mitad de los casos; falta sumar la causa de acceso (distancia o transporte).", false]]}, {"id": "LC-139", "niv": 2, "e": "En una reunión de docentes, un colega concluye a partir de la infografía que el desinterés de los estudiantes no debe preocupar a los colegios. Esta lectura es", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: reflexionar a partir de un texto y evaluar su contenido.", "o": [["A", "adecuada, porque el desinterés aparece por debajo de las causas económicas y de acceso al colegio.", "Que una causa sea menos frecuente no significa que no deba atenderse; la conclusión exagera lo que dicen los datos.", false], ["B", "inadecuada, porque el 15 % de los casos es una proporción relevante sobre la que la escuela puede actuar.", "Que el desinterés no sea la causa principal no lo vuelve irrelevante: casi uno de cada siete casos se asocia a él, y es un factor en el que la escuela tiene un papel directo. Evaluar las conclusiones que se extraen de un texto es parte de la lectura crítica.", true], ["C", "inadecuada, porque el desinterés es la causa de abandono más frecuente en la encuesta.", "Aunque el veredicto es correcto, la razón es falsa: el desinterés (15 %) está por debajo de la necesidad de trabajar (38 %), del cambio de domicilio (21 %) y de la distancia o falta de transporte (17 %).", false]]}, {"id": "LC-140", "niv": 3, "e": "La conclusión «La escuela sola no puede resolverlos» sería más sólida si la secretaría", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: reflexionar a partir de un texto y evaluar su contenido (validez de argumentos y solidez de las evidencias).", "o": [["A", "incluyera el desinterés y el bajo rendimiento dentro del grupo de causas económicas.", "Reclasificar los datos de esa manera los distorsionaría; no fortalece la conclusión, la vuelve menos confiable.", false], ["B", "explicara por qué el embarazo adolescente aparece con un porcentaje tan bajo en la encuesta.", "Ese dato no se relaciona con la capacidad de la escuela para resolver las causas económicas o de acceso.", false], ["C", "mostrara que esas causas persisten aun en colegios que ofrecen transporte, alimentación o flexibilidad horaria.", "Si el abandono por causas económicas o de acceso se mantiene incluso cuando la escuela hace lo que está a su alcance, la conclusión de que necesita apoyo de otros sectores gana sustento. Identificar qué evidencia fortalece una conclusión es evaluar su solidez.", true]]}]}, {"comp": "lectura_critica", "rol": "docente", "tag": "Lectura crítica", "texto": "Lea el siguiente fragmento de un relato:\n\n«La maestra Elvira llegó a la vereda un martes de lluvia, con una maleta de cartón y una caja de tizas que se le había mojado en el camino. La escuela era un salón de bahareque con un tablero que alguien había pintado con hollín. Los niños la miraron desde la puerta como se mira a quien viene de paso; ya habían visto llegar y partir a tres maestras en dos años.\n\nEsa noche, Elvira secó las tizas una por una sobre el fogón de doña Carmen. A la mañana siguiente escribió su nombre en el tablero y, debajo, con letra más pequeña: \"Me quedo\". Nadie dijo nada. Pero al mediodía, cuando terminó la clase, el niño más grande se acercó y, sin mirarla, le preguntó si sabía nadar, porque en junio el río crecía y había que cruzarlo para llegar.»", "items": [{"id": "LC-141", "niv": 1, "e": "La frase «como se mira a quien viene de paso» sugiere que los niños", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: comprender cómo se articulan las partes de un texto literario (sentidos implícitos y recursos narrativos).", "o": [["A", "esperaban que la nueva maestra también se fuera pronto.", "La frase se explica enseguida: «ya habían visto llegar y partir a tres maestras en dos años». Su mirada anticipa otra partida.", true], ["B", "sentían curiosidad por saber de dónde venía la maestra.", "El relato no habla de curiosidad por su origen; la mirada se relaciona con la experiencia de ver partir a otras maestras.", false], ["C", "rechazaban a la maestra por ser de una región distinta.", "Nada en el texto indica rechazo por su procedencia; la desconfianza viene de las partidas anteriores.", false]]}, {"id": "LC-142", "niv": 2, "e": "La pregunta que el niño más grande hace al final del fragmento puede interpretarse como", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: comprender cómo se articulan las partes de un texto literario (sentidos implícitos y recursos narrativos).", "o": [["A", "una advertencia para convencer a la maestra de que se vaya de la vereda antes de junio.", "El niño no le sugiere irse; su pregunta supone que ella seguirá allí cuando el río crezca.", false], ["B", "una forma indirecta de aceptar que la maestra se quedará y de prepararla para lo que viene.", "La pregunta responde al «Me quedo»: el niño piensa en junio, cuando ella todavía estará allí, y le advierte sobre el río. El relato sugiere la aceptación sin decirla. Interpretar sentidos implícitos es propio de la lectura de textos literarios.", true], ["C", "una burla dirigida a la maestra por no conocer los peligros de la vereda.", "Nada en el tono del relato sugiere burla; el niño se acerca después de leer «Me quedo».", false]]}, {"id": "LC-143", "niv": 2, "e": "En el relato, el detalle de las tizas secadas «una por una» sobre el fogón contribuye a", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: comprender cómo se articulan las partes de un texto literario (sentidos implícitos y recursos narrativos).", "o": [["A", "mostrar el empeño de la maestra por enseñar aun con lo poco que tenía a su alcance.", "Secar cada tiza revela paciencia y determinación para dar clase al día siguiente, a pesar de las condiciones. Es un detalle que caracteriza al personaje sin nombrar sus cualidades.", true], ["B", "describir las costumbres de la familia que hospedó a la maestra en la vereda.", "El fogón de doña Carmen es el lugar donde ocurre la acción, pero el detalle se centra en la maestra, no en las costumbres de la familia.", false], ["C", "explicar por qué la escuela de la vereda no contaba con ningún material escolar.", "El detalle no explica la falta de materiales; muestra lo que hace la maestra con los que trajo.", false]]}, {"id": "LC-144", "niv": 3, "e": "Al comparar la actitud de los niños al inicio y al final del fragmento, usted explica a sus estudiantes que el relato", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: comprender cómo se articulan las partes de un texto literario (sentidos implícitos y recursos narrativos).", "o": [["A", "explica con detalle las razones por las que se fueron las maestras anteriores.", "El relato solo menciona que tres maestras llegaron y se fueron; no explica sus razones.", false], ["B", "muestra que los niños rechazaron a la maestra durante todo el primer día de clase.", "Al final del primer día, el niño más grande se acerca a hablarle; eso no corresponde a un rechazo sostenido.", false], ["C", "sugiere un cambio en la actitud de los niños hacia la maestra sin narrarlo explícitamente.", "Al inicio, los niños la miran con distancia; al final, uno de ellos se acerca y le pregunta por algo que ocurrirá meses después. El cambio se insinúa mediante gestos, no se explica. Reconocer este recurso es comprender la construcción del sentido en el texto literario.", true]]}]}, {"comp": "lectura_critica", "rol": "docente", "tag": "Lectura crítica", "texto": "Lea el siguiente editorial publicado en un periódico regional:\n\n«Cada año, cuando se publican los resultados de las pruebas Saber 11, aparecen las listas de \"los mejores colegios\". Las familias las consultan, algunos colegios las usan en su publicidad y ciertos rectores reciben felicitaciones o reproches según el puesto obtenido.\n\nPero una lista ordenada por puntaje promedio dice menos de lo que parece. Un colegio que selecciona a sus estudiantes con un examen de admisión parte con ventaja frente a uno que recibe a todos los niños del barrio. Comparar sus promedios es como comparar el tiempo de dos corredores sin decir que uno empezó la carrera cincuenta metros adelante.\n\nLo que realmente interesa saber es cuánto aporta cada colegio al aprendizaje de los estudiantes que recibe. Medirlo es más difícil, pero no imposible. Mientras tanto, convendría leer los rankings con menos entusiasmo y más preguntas.»", "items": [{"id": "LC-145", "niv": 1, "e": "La tesis del editorial es que", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: comprender el sentido global del texto (tesis e intención comunicativa).", "o": [["A", "los colegios que seleccionan a sus estudiantes obtienen mejores resultados en las pruebas Saber 11.", "El editorial menciona la selección como ejemplo de una ventaja inicial, pero su tesis se refiere a lo que las listas muestran y lo que no.", false], ["B", "las pruebas Saber 11 deberían eliminarse porque generan competencia entre los colegios del país.", "El editorial no propone eliminar las pruebas; propone leer los rankings con más preguntas.", false], ["C", "los rankings por puntaje promedio no muestran por sí solos cuánto aporta cada colegio.", "Todo el texto conduce a esta idea: el promedio refleja también el punto de partida de los estudiantes, y lo importante es el aporte de cada colegio. Identificar la tesis es comprender el sentido global del texto.", true]]}, {"id": "LC-146", "niv": 2, "e": "La comparación con los dos corredores sirve para", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: comprender cómo se articulan las partes de un texto para darle un sentido global.", "o": [["A", "explicar que comparar resultados finales es injusto si no se tiene en cuenta el punto de partida.", "La imagen de un corredor que empieza «cincuenta metros adelante» ilustra que un colegio que selecciona estudiantes parte con ventaja. Reconocer la función de una analogía es comprender cómo se articula el argumento.", true], ["B", "mostrar que los colegios que seleccionan estudiantes se esfuerzan más que los demás.", "La analogía sugiere lo contrario: la ventaja no proviene del esfuerzo, sino de la posición de salida.", false], ["C", "ilustrar que los estudiantes de los colegios que reciben a todos los niños aprenden con más lentitud.", "La comparación no habla de la velocidad de aprendizaje de los estudiantes, sino de la desigualdad en el punto de partida.", false]]}, {"id": "LC-147", "niv": 3, "e": "De los siguientes datos, el que permitiría responder mejor la pregunta que el editorial considera importante es", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: reflexionar a partir de un texto y evaluar su contenido (validez de argumentos y solidez de las evidencias).", "o": [["A", "el puesto que ocupó cada colegio en los rankings de los últimos cinco años.", "Varios años de rankings siguen basándose en promedios finales, que el editorial considera insuficientes.", false], ["B", "la diferencia entre el nivel con que ingresan los estudiantes y el que alcanzan al terminar.", "El editorial pregunta «cuánto aporta cada colegio al aprendizaje de los estudiantes que recibe»; para responderlo hay que comparar el punto de llegada con el de partida. Identificar qué información responde a la pregunta de un texto es evaluar su contenido.", true], ["C", "el número de aspirantes que se presentan cada año al examen de admisión de cada colegio.", "Ese dato muestra la demanda de un colegio, no lo que este aporta al aprendizaje de sus estudiantes.", false]]}]}, {"comp": "lectura_critica", "rol": "docente", "tag": "Lectura crítica", "texto": "Lea el siguiente texto publicado en un boletín de actualización docente:\n\n«Pocas ideas se han difundido tanto en la formación de maestros como la de los \"estilos de aprendizaje\": cada estudiante sería visual, auditivo o kinestésico, y aprendería mejor si se le enseña en su estilo. La idea es atractiva porque parece respetar las diferencias. El problema es que, cuando se ha puesto a prueba con diseños rigurosos, la evidencia a su favor ha sido muy débil.\n\nPara comprobarla, no basta con preguntar a los estudiantes cómo prefieren aprender. Habría que mostrar que los \"visuales\" aprenden más con imágenes y los \"auditivos\" con explicaciones orales, y que no ocurre lo mismo al revés. Esa doble condición rara vez se ha cumplido.\n\nQue la teoría tenga poco sustento no significa que todas las personas aprendan igual. Significa que conviene elegir la forma de enseñar según el contenido —un mapa se enseña mejor con imágenes; una pronunciación, con sonidos— y combinar varias vías para todos.»", "items": [{"id": "LC-148", "niv": 1, "e": "Según el texto, la idea de los estilos de aprendizaje resulta atractiva porque", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: identificar y entender los contenidos locales que conforman un texto.", "o": [["A", "permite enseñar a todo el grupo con una sola metodología.", "La teoría plantea lo opuesto: adaptar la enseñanza al estilo de cada estudiante.", false], ["B", "ha sido comprobada en investigaciones con diseños rigurosos.", "El texto afirma lo contrario: con diseños rigurosos, «la evidencia a su favor ha sido muy débil».", false], ["C", "da la impresión de tener en cuenta lo que hace distinto a cada estudiante.", "El texto lo dice expresamente: «La idea es atractiva porque parece respetar las diferencias». Es información local explícita.", true]]}, {"id": "LC-149", "niv": 3, "e": "Para el autor, una investigación que respaldara la teoría de los estilos de aprendizaje tendría que mostrar que", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: comprender cómo se articulan las partes de un texto para darle un sentido global.", "o": [["A", "cada grupo aprende más cuando se le enseña en su estilo que cuando se le enseña en otro.", "Es la «doble condición» del segundo párrafo: los visuales deben aprender más con imágenes y los auditivos con explicaciones orales, «y que no ocurre lo mismo al revés». Reconstruir un criterio planteado en el texto exige integrar varias oraciones.", true], ["B", "la mayoría de los estudiantes sabe identificar con claridad cuál es su estilo de aprendizaje preferido.", "El autor advierte que «no basta con preguntar a los estudiantes cómo prefieren aprender»: una preferencia no prueba que se aprenda más de esa manera.", false], ["C", "los estudiantes visuales obtienen mejores resultados que los auditivos en todas las áreas.", "Que un grupo supere al otro en general no demostraría que cada uno aprende mejor en su propio estilo; no cumple la doble condición.", false]]}, {"id": "LC-150", "niv": 2, "e": "El último párrafo cumple, dentro del texto, la fun
