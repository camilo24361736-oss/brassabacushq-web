 equipo de manera permanente.", "Cuida la relación del equipo, pero descarta una vía legítima cuando el diálogo ya falló y deja el problema sin solución.", false]]}, {"id": "CB-136", "niv": 2, "e": "Ante el argumento de que el proyecto «no es de su área», usted le muestra que", "f": "Ley 115 de 1994, art. 14; MEN (2008). Guía 31, Anexo 1: Glosario de competencias (compromiso social e institucional).", "o": [["A", "puede limitarse a permitir que sus estudiantes asistan a las actividades ambientales que organicen las demás áreas.", "Es una salida conciliadora, pero acepta la idea de que el tema es ajeno a su área y desconoce el carácter transversal del proyecto.", false], ["B", "la educación ambiental es transversal y que su área puede aportar, por ejemplo, desde el uso y cuidado del entorno.", "La Ley 115 de 1994 (art. 14) establece la educación ambiental como enseñanza obligatoria que no exige una asignatura específica y se incorpora al currículo de manera transversal; mostrar el aporte posible de cada área favorece el compromiso.", true], ["C", "el rector asignó el proyecto a todos los docentes de séptimo y que por eso no puede negarse a participar.", "El argumento de autoridad puede lograr cumplimiento, pero no responde a la objeción ni genera compromiso con el sentido del proyecto.", false]]}, {"id": "CB-137", "niv": 3, "e": "Para que el equipo funcione mejor en lo que queda del proyecto, la medida más efectiva es", "f": "MEN (2008). Guía 31, Anexo 1: Glosario de competencias (trabajo en equipo; orientación al logro).", "o": [["A", "reducir el proyecto a las actividades de los docentes que sí han cumplido, para asegurar un buen resultado final.", "Asegura un producto, pero renuncia al carácter colectivo y transversal del proyecto y excluye a un miembro del equipo en lugar de integrarlo.", false], ["B", "nombrar a un líder que asigne las tareas y reporte a la coordinación a quienes no cumplan con las fechas.", "Da claridad sobre quién coordina, pero centra el funcionamiento en el control y la sanción, no en la colaboración ni en el seguimiento conjunto.", false], ["C", "acordar entre todos tareas concretas, fechas realistas y una forma sencilla de revisar avances y ajustar.", "La organización conjunta, con responsabilidades claras y seguimiento compartido, corresponde a la competencia de trabajo en equipo: propiciar la organización del equipo para el desarrollo de proyectos (Guía 31).", true]]}]}, {"comp": "competencias_blandas", "rol": "directivo", "tag": "Competencias blandas y ciudadanas · Liderazgo y trabajo en equipo (Guía 31)", "texto": "Usted es coordinador académico de una institución oficial con 48 docentes. Tras discutirlo en el consejo académico, el consejo directivo aprobó un ajuste al sistema institucional de evaluación para implementar este año la evaluación formativa con retroalimentación escrita en todas las áreas. En la jornada pedagógica, un grupo de docentes con más antigüedad afirma que «eso es más trabajo sin más tiempo» y que «siempre han evaluado bien». Algunos docentes recién vinculados apoyan el cambio, pero no se atreven a opinar frente a sus colegas.", "items": [{"id": "CB-138", "niv": 1, "e": "Frente a las objeciones de los docentes con más antigüedad, usted", "f": "Decreto 1290 de 2009, art. 8; MEN (2008). Guía 31, Anexo 1: Glosario de competencias (liderazgo).", "o": [["A", "propone que la implementación sea voluntaria este año, para que cada docente decida si se suma al cambio.", "Reduce la tensión, pero contradice una decisión del consejo directivo y renuncia a liderar el cambio con todo el equipo.", false], ["B", "les confirma que el ajuste aprobado se aplicará este año y los invita a definir con usted formatos y tiempos.", "El sistema institucional de evaluación lo aprueba el consejo directivo y se incorpora al PEI (Decreto 1290 de 2009, art. 8), así que su aplicación no está en discusión. El liderazgo (Guía 31) consiste en sostener la visión institucional e involucrar al equipo en cómo lograrla.", true], ["C", "abre de nuevo la discusión con todo el equipo sobre si conviene aplicar el cambio este año, para lograr consenso.", "Buscar consenso es valioso, pero reabrir una decisión ya aprobada por el consejo directivo debilita el gobierno escolar y deja sin rumbo la implementación.", false]]}, {"id": "CB-139", "niv": 2, "e": "Para que los docentes recién vinculados también participen, usted", "f": "MEN (2008). Guía 31, Anexo 1: Glosario de competencias (comunicación y relaciones interpersonales; liderazgo).", "o": [["A", "organiza trabajo por áreas en el que cada docente comparta una experiencia, con turnos de palabra para todos.", "Crear espacios con reglas de participación equitativa facilita que todas las voces se escuchen y favorece relaciones de confianza (Guía 31, comunicación y relaciones interpersonales; liderazgo).", true], ["B", "les pide en privado que defiendan sus argumentos en la próxima jornada pedagógica, para equilibrar la discusión.", "Busca equilibrar las posturas, pero los pone a confrontar a colegas con más antigüedad y polariza al equipo en bandos.", false], ["C", "recoge sus opiniones en una encuesta anónima y las presenta como la posición de la coordinación.", "La encuesta anónima permite que se expresen, pero presentar sus ideas como postura de la coordinación oculta el diálogo entre colegas y no construye confianza en el equipo.", false]]}, {"id": "CB-140", "niv": 3, "e": "Para atender la preocupación por la carga de trabajo, una decisión coherente con el liderazgo pedagógico es", "f": "MEN (2008). Guía 31, Anexo 1: Glosario de competencias (iniciativa; liderazgo).", "o": [["A", "aplicar la estrategia en todos los grupos desde la primera semana, para que los docentes se adapten con rapidez.", "Muestra decisión, pero ignora la preocupación legítima por la carga y aumenta el riesgo de que la estrategia se aplique de manera superficial.", false], ["B", "pilotear la estrategia con algunos grupos, ajustar los formatos con los docentes y extenderla a todos durante el primer periodo.", "Anticipar dificultades y proponer soluciones viables corresponde a la iniciativa, y vincular a los docentes al ajuste de la estrategia corresponde al liderazgo (Guía 31). La gradualidad responde a la preocupación sin abandonar la decisión.", true], ["C", "posponer la implementación hasta que la secretaría de educación asigne más horas para planeación.", "Reconoce el problema del tiempo, pero condiciona una decisión institucional a un factor externo e incierto, sin buscar soluciones con los recursos disponibles.", false]]}, {"id": "CB-141", "niv": 2, "e": "Tres meses después, un área no ha aplicado la estrategia pese al acompañamiento recibido y a los compromisos que asumió. Usted", "f": "MEN (2008). Guía 31, Anexo 1: Glosario de competencias (orientación al logro; liderazgo).", "o": [["A", "presenta en la jornada pedagógica un comparativo de áreas con el nombre de cada docente, para estimular la responsabilidad.", "La información de seguimiento es útil, pero exponer públicamente a cada docente genera resistencia en lugar de corregir el incumplimiento.", false], ["B", "programa otra jornada de sensibilización para que el área reflexione sobre los beneficios de la evaluación formativa.", "La reflexión pedagógica es útil, pero el área ya recibió acompañamiento; repetir la sensibilización sin exigir compromisos concretos prolonga el incumplimiento.", false], ["C", "se reúne con el área, le recuerda que la estrategia es obligatoria y fija con ella fechas de cumplimiento con seguimiento.", "Ante un incumplimiento persistente, pese al acompañamiento, el directivo debe exigir con claridad lo aprobado y hacer seguimiento a los compromisos; así se orienta al equipo hacia los resultados (Guía 31, orientación al logro y liderazgo).", true]]}]}, {"comp": "competencias_blandas", "rol": "docente", "tag": "Competencias blandas y ciudadanas · Relación con las familias (Guía 31)", "texto": "Usted es docente de matemáticas de décimo. A la hora del descanso, el padre de Felipe llega sin cita, alterado, y frente a varios estudiantes le reclama en voz alta por la nota de 2,8 que obtuvo su hijo en el periodo. Afirma que usted «la tiene montada» con Felipe y amenaza con «ir a la secretaría de educación». Usted tiene registradas las evaluaciones y las actividades de apoyo que Felipe no presentó.", "items": [{"id": "CB-142", "niv": 1, "e": "Si el padre sigue gritando y lo insulta frente a los estudiantes, la actuación más adecuada es", "f": "MEN (2008). Guía 31, Anexo 1: Glosario de competencias (comunicación y relaciones interpersonales).", "o": [["A", "indicarle con calma y firmeza que no seguirá la conversación mientras haya gritos y ofrecerle una cita ese mismo día.", "Poner un límite claro sin agredir, manejando las propias emociones, protege a los estudiantes de presenciar el conflicto; ofrecer una cita cercana mantiene abierta la comunicación con la familia (Guía 31, comunicación y relaciones interpersonales).", true], ["B", "explicarle allí mismo los criterios de la nota, para demostrarle que la calificación de su hijo es justa.", "Dar explicaciones es necesario, pero hacerlo frente a los estudiantes y con el padre alterado expone el caso de Felipe y difícilmente logra una conversación productiva.", false], ["C", "escucharlo allí mismo hasta que se desahogue, para demostrarle su disposición al diálogo y calmar la situación.", "La escucha suele calmar, pero tolerar insultos frente a los estudiantes no es diálogo: valida la agresión y expone el caso de Felipe ante otros.", false]]}, {"id": "CB-143", "niv": 2, "e": "En la reunión con el padre, para responder a su reclamo por la nota, usted", "f": "Decreto 1290 de 2009, arts. 4 y 14.", "o": [["A", "le sugiere presentar la queja ante la secretaría de educación, ya que él manifestó esa intención.", "Respeta la intención del padre, pero omite las instancias institucionales de reclamación, que son el primer conducto previsto.", false], ["B", "le muestra las evidencias del proceso de Felipe y le explica las instancias de reclamación del sistema de evaluación.", "El sistema institucional de evaluación debe contener las instancias, procedimientos y mecanismos de atención y resolución de reclamaciones de padres y estudiantes (Decreto 1290 de 2009, art. 4), y los padres tienen derecho a recibir información clara sobre el proceso (art. 14).", true], ["C", "le ofrece revisar la nota si Felipe presenta un trabajo adicional, para cerrar el conflicto de manera rápida y amistosa.", "Busca una salida conciliadora, pero crea una oportunidad por fuera de los criterios del sistema de evaluación que no se ofrece a los demás estudiantes.", false]]}, {"id": "CB-144", "niv": 3, "e": "Ante la afirmación de que usted «la tiene montada» con Felipe, usted", "f": "Función Pública (2017). Código de Integridad del Servicio Público (honestidad); MEN (2008). Guía 31, Anexo 1: Glosario de competencias (comunicación y relaciones interpersonales).", "o": [["A", "le aclara con firmeza que trata a todos los estudiantes por igual y que no aceptará acusaciones sin pruebas.", "Defender la propia imparcialidad es legítimo, pero cerrar la conversación impide conocer la percepción del padre y del estudiante, que puede tener algún fundamento.", false], ["B", "propone que otro docente evalúe a Felipe por el resto del año, para eliminar cualquier duda sobre su imparcialidad.", "Busca transparencia, pero acepta la acusación sin examinarla y traslada a otro docente una responsabilidad propia del área.", false], ["C", "le pide ejemplos concretos, los revisa con apertura y, si encuentra alguna situación injusta, la corrige.", "Escuchar la crítica y estar dispuesto a reconocer errores corresponde al valor de honestidad del Código de Integridad y a la competencia de comunicación y relaciones interpersonales (Guía 31). La revisión se apoya en las evidencias registradas.", true]]}]}, {"comp": "competencias_blandas", "rol": "docente", "tag": "Competencias blandas y ciudadanas · Competencias ciudadanas: pluralidad, identidad y valoración de las diferencias (Guía 6)", "texto": "Usted es docente de una institución etnoeducativa ubicada en un resguardo wayuu de La Guajira, donde la mayoría de los estudiantes habla wayuunaiki. Algunos estudiantes de séptimo, que viajan con frecuencia a Riohacha, dicen sentir vergüenza de hablar su lengua y piden que las clases sean solo en español «para que no se burlen de ellos en la ciudad». Una autoridad tradicional de la comunidad ofrece enseñar en la escuela el tejido y los relatos de su pueblo.", "items": [{"id": "CB-145", "niv": 1, "e": "Frente a la vergüenza que expresan los estudiantes por hablar su lengua, usted", "f": "Ley 115 de 1994, arts. 56 y 57; MEN (2004). Estándares Básicos de Competencias Ciudadanas, Serie Guías n.º 6 (pluralidad, identidad y valoración de las diferencias).", "o": [["A", "abre espacios para que valoren su lengua y su cultura, y a la vez los acompaña en el fortalecimiento del español.", "En los territorios de grupos étnicos con tradición lingüística propia la enseñanza es bilingüe, con fundamento en la lengua materna (Ley 115 de 1994, art. 57), y la etnoeducación busca afianzar la identidad (art. 56). Fortalecer también el español responde a la necesidad que expresan los estudiantes.", true], ["B", "les explica que la burla en la ciudad es un problema de quienes se burlan y que no deben darle importancia.", "Es cierto que la responsabilidad es de quien discrimina, pero minimizar la experiencia de los estudiantes no atiende su malestar ni fortalece su identidad.", false], ["C", "acepta dictar las clases solo en español, porque así responde a la necesidad que los mismos estudiantes expresan.", "Escuchar a los estudiantes es importante, pero abandonar la lengua materna contradice el carácter bilingüe de la etnoeducación y refuerza la idea de que su lengua vale menos.", false]]}, {"id": "CB-146", "niv": 2, "e": "Sobre el ofrecimiento de la autoridad tradicional, la decisión más coherente con la etnoeducación es", "f": "Ley 115 de 1994, arts. 55 y 56.", "o": [["A", "agradecer el ofrecimiento y pedir primero a la secretaría de educación una certificación de su idoneidad pedagógica.", "Cuidar la calidad es razonable, pero condicionar el aporte de la autoridad tradicional a un trámite externo desconoce el criterio de participación comunitaria de la etnoeducación.", false], ["B", "aceptar que dicte talleres voluntarios en contrajornada, para no afectar el tiempo de las áreas obligatorias.", "Acoge el ofrecimiento, pero deja los saberes propios al margen del currículo, como algo opcional, cuando la etnoeducación los integra al proceso formativo.", false], ["C", "integrar sus saberes al plan de estudios, articulándolos con las áreas y con la participación de la comunidad.", "La etnoeducación se orienta por criterios de integridad, interculturalidad y participación comunitaria, y debe estar ligada al proceso social y cultural de la comunidad (Ley 115 de 1994, arts. 55 y 56).", true]]}, {"id": "CB-147", "niv": 2, "e": "Para preparar a los estudiantes ante las burlas que reciben en la ciudad, usted trabaja con ellos", "f": "MEN (2004). Estándares Básicos de Competencias Ciudadanas, Serie Guías n.º 6 (competencias comunicativas; pluralidad, identidad y valoración de las diferencias).", "o": [["A", "formas de evitar que noten su origen en la ciudad, hasta que se sientan seguros con sus nuevos compañeros.", "Busca protegerlos de la burla, pero les enseña a ocultar su identidad, lo contrario de lo que persigue la formación en pluralidad e identidad.", false], ["B", "formas de responder con asertividad y de buscar apoyo en adultos e instancias de la escuela a la que asisten.", "La asertividad, expresar el propio punto de vista con claridad, firmeza y sin agresión, es una competencia comunicativa central (Guía 6); buscar apoyo institucional les permite no enfrentar solos la discriminación.", true], ["C", "respuestas firmes que dejen en evidencia la ignorancia de quienes se burlan, para que no lo vuelvan a hacer.", "Defender la propia dignidad es legítimo, pero responder ridiculizando al otro puede escalar el conflicto; la asertividad implica firmeza sin agresión.", false]]}, {"id": "CB-148", "niv": 3, "e": "Al planear con otros docentes un proyecto sobre identidad cultural, una actuación que valora la diversidad sin reducirla a estereotipos es", "f": "MEN (2004). Estándares Básicos de Competencias Ciudadanas, Serie Guías n.º 6 (pluralidad, identidad y valoración de las diferencias); Ley 115 de 1994, art. 56.", "o": [["A", "incluir en el proyecto las distintas formas en que las familias de la comunidad viven hoy su cultura.", "La Guía 6 plantea el reconocimiento de la diversidad humana; esa diversidad existe también dentro de cada pueblo. Incluir en el proyecto las formas actuales en que las familias viven su cultura evita imponer a los estudiantes una sola imagen de lo que significa ser wayuu.", true], ["B", "centrar el proyecto en las tradiciones más antiguas, por ser la expresión más auténtica de la cultura de la comunidad.", "Valorar las tradiciones es importante, pero presentar solo las más antiguas como «auténticas» desconoce que las culturas cambian y deja por fuera las experiencias actuales de los estudiantes.", false], ["C", "organizar un día cultural con trajes, danzas y comidas típicas como actividad central y cierre del proyecto.", "Es una actividad valiosa como parte del proyecto, pero hacerla el eje reduce la cultura a lo folclórico y visible, sin trabajar la identidad ni la reflexión de los estudiantes.", false]]}]}, {"comp": "competencias_blandas", "rol": "docente", "tag": "Competencias blandas y ciudadanas · Competencias ciudadanas: convivencia y paz (Guía 6)", "texto": "En un recreo de sexto grado, Camila y Luisa discuten porque Luisa les contó a otras compañeras un secreto de Camila. Se gritan e insultan, sin llegar a agredirse físicamente ni a causarse daño. Es la primera vez que tienen un conflicto y ninguna tiene antecedentes. Usted es el docente que acompaña el recreo. La institución cuenta con estudiantes mediadores formados por la orientadora, y el manual de convivencia prevé su participación.", "items": [{"id": "CB-149", "niv": 1, "e": "Según el protocolo para este tipo de situación, usted", "f": "Decreto 1965 de 2013, arts. 40 y 42.", "o": [["A", "informa a las familias para que ellas resuelvan el conflicto, ya que el problema se originó por un asunto personal.", "La comunicación con las familias puede ser útil, pero el conflicto ocurrió en la escuela y el protocolo asigna a la institución la mediación pedagógica.", false], ["B", "remite la situación al comité escolar de convivencia, porque hubo insultos entre las estudiantes.", "La remisión parece cuidadosa, pero los insultos esporádicos sin daño a la salud son una situación tipo I que se atiende con mediación pedagógica inmediata, sin necesidad de convocar al comité.", false], ["C", "reúne a las dos estudiantes para que expongan sus puntos de vista y busquen una solución, de la que deja constancia.", "Es una situación esporádica sin daño al cuerpo ni a la salud (situación tipo I). El protocolo indica reunir de inmediato a las partes, mediar pedagógicamente para que expongan sus puntos de vista y buscar una solución de la que se deja constancia (Decreto 1965 de 2013, arts. 40 y 42).", true]]}, {"id": "CB-150", "niv": 2, "e": "En la conversación, para ayudarlas a manejar el conflicto de forma constructiva, usted", "f": "MEN (2004). Estándares Básicos de Competencias Ciudadanas, Serie Guías n.º 6 (convivencia y paz; competencias integradoras).", "o": [["A", "determina quién inició el problema y le asigna a esa estudiante la responsabilidad de reparar el daño.", "Identificar responsabilidades es parte del proceso, pero decidir usted solo convierte la mediación en un juicio y no permite que las partes construyan el acuerdo.", false], ["B", "pide a cada una que cuente lo ocurrido sin interrupciones y diga cómo se sintió, antes de buscar soluciones.", "Manejar conflictos de manera pacífica es una competencia integradora que articula escucha activa, identificación de emociones y generación de opciones (Guía 6, convivencia y paz).", true], ["C", "les pide que se disculpen mutuamente y se den la mano, para cerrar el conflicto lo antes posible y volver a clase.", "Restablecer la relación es deseable, pero una disculpa inmediata sin comprender lo ocurrido cierra el conflicto en apariencia y no desarrolla competencias para manejarlo.", false]]}, {"id": "CB-151", "niv": 3, "e": "Sobre la participación de los estudiantes mediadores en este caso, usted tiene en cuenta que", "f": "Decreto 1965 de 2013, art. 42, parágrafo.", "o": [["A", "la norma permite que participen en el manejo de este tipo de situaciones, según lo previsto en el manual.", "El parágrafo del artículo 42 del Decreto 1965 de 2013 establece que los estudiantes formados como mediadores o conciliadores escolares pueden participar en el manejo de las situaciones tipo I, en los términos del manual de convivencia.", true], ["B", "deben atender primero toda situación entre estudiantes, antes de que intervenga cualquier docente.", "Valora la mediación entre pares, pero la norma permite su participación, no la impone como paso obligatorio previo a la intervención docente.", false], ["C", "no pueden participar, porque las situaciones con insultos deben ser atendidas solo por adultos de la institución.", "Busca proteger a las estudiantes, pero contradice la norma, que prevé la participación de mediadores escolares en las situaciones tipo I.", false]]}, {"id": "CB-152", "niv": 2, "e": "Una semana después del acuerdo, usted", "f": "Decreto 1965 de 2013, art. 42; MEN (2008). Guía 31, Anexo 1: Glosario de competencias (negociación y mediación).", "o": [["A", "da por cerrado el caso, porque las estudiantes firmaron el acuerdo y no han vuelto a discutir en público.", "La ausencia de nuevas discusiones es una buena señal, pero no reemplaza el seguimiento que exige el protocolo ni permite saber si el conflicto se resolvió.", false], ["B", "verifica con ambas estudiantes si los compromisos se están cumpliendo y si la relación ha mejorado.", "El protocolo de las situaciones tipo I incluye el seguimiento del caso y de los compromisos para verificar si la solución fue efectiva (Decreto 1965 de 2013, art. 42); la Guía 31 también resalta el seguimiento a los compromisos en la mediación.", true], ["C", "remite el caso a la orientadora para que haga seguimiento psicológico a las dos estudiantes.", "La orientación puede ser un apoyo, pero el caso no muestra necesidad de atención psicológica; el seguimiento de los compromisos corresponde a quien medió.", false]]}]}, {"comp": "competencias_blandas", "rol": "docente", "tag": "Competencias blandas y ciudadanas · Competencias ciudadanas: participación y responsabilidad democrática (Guía 6)", "texto": "Al iniciar el año, usted asume la dirección de grupo de noveno en un colegio oficial. El grupo tiene fama de «indisciplinado» y el año anterior acumuló muchas anotaciones en el observador. Usted quiere que los estudiantes construyan acuerdos de convivencia para el aula. En la primera sesión proponen, entre otras, dos normas: «nadie puede llamar a los papás» y «el que llegue tarde no entra al salón».", "items": [{"id": "CB-153", "niv": 1, "e": "Un mes después, varios estudiantes incumplen el acuerdo de puntualidad que el grupo votó, el cual prevé reponer el trabajo perdido en un espacio acordado. Usted", "f": "MEN (2004). Estándares Básicos de Competencias Ciudadanas, Serie Guías n.º 6 (participación y responsabilidad democrática).", "o": [["A", "aplica a quienes incumplieron la consecuencia acordada, de la misma manera para todos.", "Las normas construidas democráticamente obligan a quienes las acordaron; aplicarlas con igualdad da credibilidad a la participación y forma en responsabilidad democrática (Guía 6). La consecuencia es formativa, como corresponde al manual.", true], ["B", "convoca una nueva asamblea para revisar si el acuerdo sigue siendo adecuado antes de aplicar la consecuencia.", "Revisar los acuerdos es legítimo en otro momento, pero hacerlo justo cuando hay incumplimientos transmite que las normas votadas se negocian cada vez que alguien las rompe.", false], ["C", "les da una última oportunidad sin consecuencias, para no afectar el buen clima que ha logrado el grupo.", "Cuida el clima, pero dejar sin efecto la norma acordada debilita su sentido y es injusto con quienes sí cumplen.", false]]}, {"id": "CB-154", "niv": 2, "e": "Ante la propuesta «el que llegue tarde no entra al salón», usted", "f": "MEN (2004). Estándares Básicos de Competencias Ciudadanas, Serie Guías n.º 6 (participación y responsabilidad democrática; competencias cognitivas).", "o": [["A", "la acepta, porque fue votada por la mayoría y refleja la voluntad del grupo en ejercicio de su participación.", "Respeta la decisión mayoritaria, pero la Guía 6 advierte que las decisiones colectivas deben respetar los derechos fundamentales de cada persona.", false], ["B", "la descarta de inmediato y explica que contradice los derechos de los estudiantes, para no perder tiempo.", "Su argumento es correcto, pero cerrar la discusión desde la autoridad desaprovecha la oportunidad de que el grupo comprenda por qué la norma no es válida.", false], ["C", "invita al grupo a analizar sus efectos sobre el derecho a la educación y a proponer una alternativa formativa.", "La Guía 6 señala que las decisiones democráticas deben respetar los derechos fundamentales. Analizar consecuencias es una competencia cognitiva, y construir la alternativa con el grupo mantiene la deliberación.", true]]}, {"id": "CB-155", "niv": 3, "e": "Frente a la propuesta «nadie puede llamar a los papás», usted", "f": "Ley 1620 de 2013, art. 5; MEN (2004). Estándares Básicos de Competencias Ciudadanas, Serie Guías n.º 6 (participación y responsabilidad democrática).", "o": [["A", "explica al grupo por qué esa norma no puede incluirse, dado que la familia es corresponsable, y le pregunta qué le preocupa.", "La corresponsabilidad de la familia, la escuela y la sociedad es un principio del sistema de convivencia escolar (Ley 1620 de 2013, art. 5); un acuerdo de aula no puede suprimirla. Explicar la razón forma al grupo sin someter a votación lo que no es negociable.", true], ["B", "somete la propuesta a debate y votación del grupo, para que los estudiantes decidan si la adoptan o no.", "Deliberar es valioso, pero someter a votación un principio legal crea la expectativa de que la mayoría puede suprimir la comunicación con las familias, lo cual no es posible.", false], ["C", "la acepta para ganar la confianza del grupo, siempre que los estudiantes cumplan con las demás normas acordadas.", "Ganar la confianza del grupo es valioso, pero la comunicación con las familias no es negociable porque responde a la corresponsabilidad en la formación.", false]]}]}, {"comp": "competencias_blandas", "rol": "docente", "tag": "Competencias blandas y ciudadanas · Protección de datos de los estudiantes (Ley 1581 de 2012)", "texto": "Usted es docente de tercero en una escuela oficial. La orientadora le informó, de manera reservada, que una estudiante, Valentina, está recibiendo atención psicológica por una situación familiar. A la salida, la madre de otro niño, amiga de la familia de Valentina, le pregunta a usted qué le pasa a la niña «porque la ve muy triste». Además, la escuela celebró el Día de la Familia y usted tomó fotos de los estudiantes que quiere publicar en su perfil personal de Facebook.", "items": [{"id": "CB-156", "niv": 1, "e": "A la madre que pregunta por Valentina, usted", "f": "Ley 1581 de 2012, arts. 4 y 5; Ley 1098 de 2006, art. 33.", "o": [["A", "le pide discreción, pero le confirma que Valentina recibe apoyo psicológico para que pueda acompañarla.", "La intención de sumar apoyo es buena, pero revela un dato sensible de salud a una tercera persona sin autorización.", false], ["B", "le comenta en términos generales que Valentina atraviesa una situación familiar difícil, sin dar más detalles.", "Omitir detalles parece prudente, pero confirmar que existe una situación familiar ya revela información reservada de la niña y de su familia.", false], ["C", "le agradece su interés y le explica que no puede compartir información sobre otros estudiantes.", "La información sobre la salud de una niña es un dato sensible (Ley 1581 de 2012, art. 5) que debe mantenerse en reserva (art. 4, literal h), y su divulgación afectaría su intimidad (Ley 1098 de 2006, art. 33).", true]]}, {"id": "CB-157", "niv": 3, "e": "Sobre las fotos del Día de la Familia, usted", "f": "Ley 1581 de 2012, arts. 3 y 4; Decreto 1377 de 2013, art. 12.", "o": [["A", "las publica en su perfil con una configuración de privacidad, para que solo sus contactos cercanos puedan verlas.", "Limitar la audiencia reduce el riesgo, pero sigue siendo una publicación en una red personal sin autorización de las familias ni finalidad institucional.", false], ["B", "no las publica en su perfil y las entrega a la institución para su uso según lo autorizado por las familias.", "Las imágenes de los niños son datos personales cuyo tratamiento debe responder a una finalidad informada y autorizada por sus representantes (Ley 1581 de 2012, arts. 3 y 4; Decreto 1377 de 2013, art. 12). Un perfil personal no es una finalidad institucional autorizada.", true], ["C", "las publica en su perfil después de ocultar el rostro de los niños cuyos padres no las han autorizado.", "Muestra cuidado, pero las autorizaciones que dan las familias son para los fines de la institución, no para la red personal de un docente.", false]]}, {"id": "CB-158", "niv": 2, "e": "Si un día Valentina le cuenta en privado que en su casa la golpean y le pide que no le diga a nadie, usted", "f": "Ley 1098 de 2006, art. 44, nums. 2 y 9.", "o": [["A", "cita a la madre para conversar con ella sobre lo que le contó la niña y acordar juntas cómo apoyarla.", "Involucrar a la familia parece natural, pero sin activar la ruta puede exponer a la niña a represalias en su casa; la valoración y protección corresponden a las instancias de la ruta.", false], ["B", "le promete reserva y sigue conversando con ella en los próximos días para ganarse su confianza antes de actuar.", "Busca fortalecer el vínculo, pero aplazar el reporte deja a la niña expuesta a nuevas agresiones y la promesa de reserva no puede cumplirse.", false], ["C", "le explica que no puede guardar ese secreto porque debe protegerla, y reporta de inmediato según la ruta institucional.", "Las instituciones educativas deben detectar y reportar a las autoridades competentes las situaciones de maltrato (Ley 1098 de 2006, art. 44, nums. 2 y 9); el docente activa la ruta de la institución para que se haga ese reporte. Decirle la verdad a la niña cuida su confianza.", true]]}, {"id": "CB-159", "niv": 3, "e": "Si la orientadora le pide registrar sus observaciones sobre Valentina, usted las consigna", "f": "Ley 1581 de 2012, art. 4.", "o": [["A", "describiendo conductas observadas con fecha y contexto, sin juicios sobre la familia, y las entrega por el canal reservado.", "La información debe ser veraz, exacta y comprobable (Ley 1581 de 2012, art. 4, literal d) y manejarse con seguridad y confidencialidad (literales g y h). Describir hechos, y no interpretaciones, protege a la niña y a su familia.", true], ["B", "con una interpretación detallada de las causas familiares de su tristeza, para facilitar el trabajo de la orientadora.", "Quiere aportar a la orientadora, pero mezcla hechos con suposiciones sobre la familia que pueden ser inexactos; el principio de veracidad exige información comprobable.", false], ["C", "en el observador de la estudiante, que es el registro oficial de su proceso y lo pueden consultar los docentes del grado.", "El observador es un registro oficial, pero allí la información queda al alcance de personas que no participan en la atención, lo que desconoce el principio de circulación restringida.", false]]}]}, {"comp": "competencias_blandas", "rol": "docente", "tag": "Competencias blandas y ciudadanas · Habilidades socioemocionales en el aula", "texto": "A mitad de año llega a su grupo de quinto, en una escuela urbana de Florencia (Caquetá), Kevin, un niño de once años cuya familia fue desplazada por el conflicto armado desde una vereda. Kevin es retraído, se sobresalta con los ruidos fuertes y no ha estudiado en los últimos seis meses. La secretaría de la escuela le pide a usted apoyar el diligenciamiento del formato de caracterización, que registra su condición de víctima. Algunos compañeros le preguntan con insistencia «por qué se vino».", "items": [{"id": "CB-160", "niv": 1, "e": "Para favorecer la integración de Kevin en el grupo, usted", "f": "MEN (2004). Estándares Básicos de Competencias Ciudadanas, Serie Guías n.º 6 (pluralidad; convivencia y paz); Ley 1098 de 2006, art. 33.", "o": [["A", "lo presenta al grupo contando que su familia fue desplazada, para que los compañeros sean más comprensivos con él.", "Busca generar comprensión, pero expone sin su consentimiento un aspecto doloroso de su vida privada y puede estigmatizarlo (Ley 1098 de 2006, art. 33).", false], ["B", "le asigna un compañero de acogida y propone actividades en las que pueda aportar sus saberes sobre el campo.", "Reconocer los saberes del estudiante y apoyarse en pares favorece su sentido de pertenencia y la valoración de las diferencias (Guía 6), sin exponer su historia personal.", true], ["C", "le permite trabajar solo mientras se adapta, para no presionarlo a relacionarse con otros antes de tiempo.", "Respeta su ritmo, pero el aislamiento puede reforzar el retraimiento; la integración se favorece con apoyos graduales, no con la separación del grupo.", false]]}, {"id": "CB-161", "niv": 2, "e": "Frente a las preguntas insistentes de los compañeros sobre «por qué se vino», usted", "f": "MEN (2004). Estándares Básicos de Competencias Ciudadanas, Serie Guías n.º 6 (competencias cognitivas y emocionales); Ley 1098 de 2006, art. 33.", "o": [["A", "pide al grupo respetar lo que cada quien decide contar de su vida y ofrece a Kevin hablar en privado.", "Ponerse en el lugar del otro y respetar su intimidad son competencias ciudadanas cognitivas y emocionales (Guía 6); el niño tiene derecho a la protección de su vida privada (Ley 1098 de 2006, art. 33).", true], ["B", "prohíbe a los compañeros hablar con Kevin sobre su vida anterior, para protegerlo de recuerdos dolorosos.", "Busca protegerlo, pero una prohibición general puede aislarlo y convertir su historia en un tema vetado, en lugar de enseñar a respetar sus decisiones.", false], ["C", "invita a Kevin a contar su historia al grupo, para que sus compañeros entiendan lo que ha vivido.", "Quiere promover empatía, pero presiona al niño a revelar experiencias dolorosas en público, lo que puede afectarlo.", false]]}, {"id": "CB-162", "niv": 3, "e": "Sobre el formato de caracterización, usted", "f": "Ley 1581 de 2012, art. 4; Decreto 1377 de 2013, art. 12.", "o": [["A", "lo diligencia con la familia en la reunión general de padres, para aprovechar que todos están presentes.", "Es práctico, pero expone la condición de víctima de la familia ante otras personas y desconoce la confidencialidad de esa información.", false], ["B", "ayuda a diligenciarlo con la familia en privado y lo entrega por el conducto establecido, sin divulgar su contenido.", "El tratamiento de datos de un niño es válido cuando responde a su interés superior y a una finalidad legítima, como garantizar su atención (Decreto 1377 de 2013, art. 12), y exige confidencialidad y seguridad (Ley 1581 de 2012, art. 4).", true], ["C", "se niega a diligenciarlo, porque la condición de víctima es información privada que no debe quedar en un registro escolar.", "Proteger la información es correcto, pero negarse impide que la institución conozca la situación y garantice la atención a la que el niño tiene derecho; lo que se exige es reserva, no omitir el registro.", false]]}, {"id": "CB-163", "niv": 3, "e": "Dado que Kevin no estudió en los últimos seis meses, la respuesta pedagógica más pertinente es", "f": "Decreto 1290 de 2009, art. 3.", "o": [["A", "ubicarlo en un grado inferior para que recupere los contenidos perdidos, sin la presión de seguir el ritmo del grupo.", "Busca reducir la presión, pero decide un retroceso sin valorar lo que el niño sabe y lo separa de su grupo de edad, con riesgo de afectar su autoestima.", false], ["B", "exigirle los mismos trabajos del periodo que a sus compañeros, para no hacer diferencias que lo estigmaticen.", "Evitar el estigma es válido, pero tratar igual situaciones desiguales desconoce que el niño necesita estrategias de apoyo para avanzar.", false], ["C", "valorar sus aprendizajes actuales y diseñar con él un plan de nivelación flexible, articulado con apoyo psicosocial.", "La evaluación debe identificar características, ritmos y estilos de aprendizaje y aplicar estrategias pedagógicas de apoyo (Decreto 1290 de 2009, art. 3). El componente psicosocial atiende el impacto emocional del desplazamiento.", true]]}]}, {"comp": "competencias_blandas", "rol": "docente", "tag": "Competencias blandas y ciudadanas · Inclusión y no discriminación", "texto": "Usted es docente de tecnología e informática de octavo en un colegio oficial de Medellín. Al club de robótica se inscribieron 18 niños y 2 niñas. Una de ellas se retiró porque sus compañeros no la dejaban manipular los kits y le decían que «se encargara de las presentaciones». En la sala de profesores, un colega comenta que «a las niñas simplemente no les interesa la tecnología».", "items": [{"id": "CB-164", "niv": 1, "e": "Frente a lo ocurrido con la estudiante que se retiró del club, usted", "f": "MEN (2004). Estándares Básicos de Competencias Ciudadanas, Serie Guías n.º 6 (pluralidad, identidad y valoración de las diferencias); Función Pública (2017). Código de Integridad del Servicio Público (justicia).", "o": [["A", "conversa con ella sobre su experiencia y la invita a volver con roles rotativos que aseguren su participación.", "Escuchar a la estudiante y transformar la organización del club atiende la causa de su retiro y garantiza igualdad en la participación (Guía 6, pluralidad; Código de Integridad, justicia).", true], ["B", "respeta su decisión de retirarse, porque obligarla a volver podría generarle más incomodidad con el grupo.", "Respetar su decisión es importante, pero aceptarla sin conversar deja intacta la exclusión que la llevó a retirarse.", false], ["C", "la invita a regresar como encargada de diseño y presentaciones del club, ya que en ese rol puede destacarse.", "Busca que vuelva con un rol valorado, pero reproduce el mismo estereotipo que la excluyó de la parte técnica del club.", false]]}, {"id": "CB-165", "niv": 2, "e": "Ante el comentario del colega sobre el interés de las niñas, usted", "f": "Función Pública (2017). Código de Integridad del Servicio Público (respeto); MEN (2008). Guía 31, Anexo 1: Glosario de competencias (comunicación y relaciones interpersonales).", "o": [["A", "evita discutir el tema, porque se trata de una opinión personal del colega y no de una decisión institucional.", "Evita un conflicto entre colegas, pero deja sin cuestionar un prejuicio que influye en la forma en que se orienta a las estudiantes.", false], ["B", "le comenta que la baja inscripción puede deberse a estereotipos y le propone revisar juntos cómo convocar el club.", "El valor de respeto del Código de Integridad excluye las decisiones basadas en estereotipos o prejuicios. Expresar el desacuerdo con argumentos y proponer una acción conjunta es asertivo y fortalece el trabajo en equipo (Guía 31).", true], ["C", "le responde que su comentario es discriminatorio y que lo informará a la coordinación para que tome medidas.", "Señala el problema, pero escalar de inmediato cierra el diálogo y no ayuda al colega a revisar su idea ni a cambiar la convocatoria del club.", false]]}, {"id": "CB-166", "niv": 3, "e": "Para aumentar la participación de las niñas en el club sin generar nuevas exclusiones, la estrategia más adecuada es", "f": "MEN (2004). Estándares Básicos de Competencias Ciudadanas, Serie Guías n.º 6 (pluralidad, identidad y valoración de las diferencias).", "o": [["A", "abrir el club solo a quienes tengan un buen desempeño en tecnología, para que la selección sea objetiva.", "Parece un criterio neutral, pero ignora que las diferencias de desempeño pueden reflejar oportunidades previas desiguales y puede reducir aún más la participación de las niñas.", false], ["B", "asignar a las niñas los roles de liderazgo del club, para compensar la exclusión que han vivido en él hasta ahora.", "Busca compensar, pero fija nuevamente roles según el sexo y puede generar rechazo, sin garantizar que todos accedan a todas las tareas.", false], ["C", "convocar con ejemplos diversos de personas en tecnología y organizar el trabajo con roles rotativos para todos.", "Ampliar los referentes y garantizar que todos roten por las tareas técnicas atiende la causa del problema, los estereotipos y la distribución de roles, sin excluir a nadie (Guía 6, pluralidad).", true]]}]}, {"comp": "competencias_blandas", "rol": "docente", "tag": "Competencias blandas y ciudadanas · Gobierno escolar y participación (Ley 115 de 1994; Decretos 1860 de 1994 y 1286 de 2005)", "texto": "Usted es docente de primaria en una institución educativa oficial y además es madre de un estudiante de cuarto grado de la misma institución. En la reunión de padres de inicio de año, varios padres le proponen que los represente ante el consejo directivo «porque conoce cómo funciona el colegio». Otro padre propone que quienes integren el consejo de padres paguen una cuota anual de $10.000 para financiar sus actividades. El rector aún no ha convocado la elección del consejo de padres.", "items": [{"id": "CB-167", "niv": 2, "e": "Frente a la propuesta de que usted represente a los padres ante el consejo directivo, usted", "f": "Decreto 1286 de 2005, art. 8 (compilado en el Decreto 1075 de 2015).", "o": [["A", "acepta, con el compromiso de abstenerse de votar en los temas del consejo que afecten a los docentes.", "Abstenerse en algunos temas parece una salida prudente, pero la prohibición es total: un docente de la institución no puede ocupar esa representación.", false], ["B", "agradece la confianza, pero explica que por trabajar en la institución no puede ser representante de los padres.", "El Decreto 1286 de 2005 (art. 8) establece que los docentes, directivos o administrativos del establecimiento no pueden ser representantes de los padres de familia en el consejo directivo de la institución donde laboran.", true], ["C", "acepta, porque cumple el requisito principal de ser madre de un estudiante matriculado en esta misma institución.", "Es cierto que los representantes deben ser padres de estudiantes de la institución, pero la misma norma excluye a quienes trabajan en ella.", false]]}, {"id": "CB-168", "niv": 2, "e": "Sobre la propuesta de una cuota anual para los integrantes del consejo de padres, usted señala que", "f": "Decreto 1286 de 2005, art. 6.", "o": [["A", "la norma no permite fijar cuotas ni contribuciones económicas para pertenecer al consejo de padres.", "El artículo 6 del Decreto 1286 de 2005 dispone que para pertenecer al consejo de padres no se pueden establecer cuotas de afiliación ni contribuciones económicas de ninguna especie.", true], ["B", "es válida si la aprueba la mayoría de los padres, porque el consejo de padres es autónomo en su organización.", "El consejo de padres sí define aspectos de su funcionamiento, pero la prohibición de cuotas es una norma que una mayoría no puede desconocer.", false], ["C", "es válida siempre que las familias de menores recursos queden exentas del pago de la cuota.", "La exención busca equidad, pero no corrige que la norma prohíbe cualquier contribución económica para pertenecer al consejo.", false]]}, {"id": "CB-169", "niv": 1, "e": "Para promover la participación de las familias en el consejo de padres, usted sugiere al rector", "f": "Decreto 1286 de 2005, arts. 5 y 6.", "o": [["A", "designar directamente a los padres más comprometidos de cada grado, para asegurar un consejo activo durante el año.", "Busca un consejo funcional, pero reemplaza la elección por grados que prevé la norma y limita la participación de las demás familias.", false], ["B", "conformar el consejo de padres solo si suficientes familias se ofrecen de manera voluntaria.", "Respeta la voluntad de las familias, pero la conformación del consejo de padres es obligatoria en todos los establecimientos (Decreto 1286 de 2005, arts. 5 y 6).", false], ["C", "convocar por grados la elección de voceros, en horarios que faciliten la asistencia de quienes trabajan.", "El Decreto 1286 de 2005 (art. 5) prevé que en el primer mes del año escolar el rector convoque a los padres para elegir a sus representantes por grados. Ajustar los horarios facilita una participación efectiva.", true]]}]}, {"comp": "competencias_blandas", "rol": "docente", "tag": "Competencias blandas y ciudadanas · Ética en el servicio público (Ley 1952 de 2019; Código de Integridad)", "texto": "Usted es docente de décimo en un colegio oficial y vende por catálogo productos de belleza para complementar sus ingresos. Un colega le sugiere ofrecerlos a las madres y padres de sus estudiantes durante la reunión de entrega de informes, «porque allí están todos». Como director de grupo, usted tiene acceso a la base de datos con los teléfonos de las familias del curso, que la institución recogió en la matrícula.", "items": [{"id": "CB-170", "niv": 1, "e": "Frente a la sugerencia de ofrecer los productos en la reunión de entrega de informes, usted", "f": "Ley 1952 de 2019, art. 44; Función Pública (2017). Código de Integridad del Servicio Público (honestidad).", "o": [["A", "la acepta solo con las familias que ya conoce, para que la oferta no parezca una obligación.", "Limitar la oferta parece prudente, pero la relación sigue siendo con familias de sus estudiantes, y quienes conocen al docente pueden sentirse más comprometidas a comprar.", false], ["B", "la descarta, porque mezcla un negocio propio con su relación con las familias a cuyos hijos evalúa.", "Mezclar un interés económico personal con la relación con las familias de los estudiantes que usted evalúa genera un conflicto de intereses (Ley 1952 de 2019, art. 44). El Código de Integridad (honestidad) orienta a no usar los espacios del cargo para fines personales.", true], ["C", "la acepta, siempre que lo haga al terminar la reunión y sin presionar a ninguna de las familias asistentes.", "Separar el momento de la venta reduce la presión, pero sigue usando un espacio institucional con familias que dependen de sus decisiones como docente.", false]]}, {"id": "CB-171", "niv": 1, "e": "Sobre usar la base de datos de teléfonos de las familias para enviar el catálogo, usted", "f": "Ley 1581 de 2012, art. 4; Ley 1952 de 2019, art. 38, num. 5.", "o": [["A", "se abstiene, porque esos datos se recogieron con fines escolares y no pueden usarse para un propósito personal.", "Los datos deben tratarse solo para la finalidad legítima informada a su titular (Ley 1581 de 2012, art. 4, literal b), y el servidor público usa la información a la que accede por su cargo solo para los fines a que está destinada (Ley 1952 de 2019, art. 38, num. 5).", true], ["B", "envía el catálogo solo a las familias de su grupo, con quienes ya mantiene comunicación permanente.", "Restringir el envío parece razonable, pero la comunicación existente tiene una finalidad escolar; usar esos datos para vender cambia su finalidad sin autorización.", false], ["C", "envía el catálogo con un mensaje que aclare que la compra es voluntaria y no afecta a los estudiantes.", "La aclaración busca evitar presiones, pero no corrige el uso de datos personales para una finalidad distinta de la que justificó su recolección.", false]]}, {"id": "CB-172", "niv": 3, "e": "Si una madre de su grupo le pide por iniciativa propia comprarle productos, la actuación más prudente es", "f": "Ley 1952 de 2019, art. 44; Función Pública (2017). Código de Integridad del Servicio Público (honestidad).", "o": [["A", "venderle los productos con un descuento, como reconocimiento a su apoyo constante con el grupo.", "Busca reconocer a la madre, pero añade un trato preferencial a la relación comercial y hace más visible el conflicto de intereses.", false], ["B", "venderle los productos al mismo precio que a cualquier cliente, ya que la iniciativa fue de ella.", "Tratarla como a cualquier cliente parece neutral, pero no elimina la relación económica con la familia de un estudiante cuyo proceso usted valora.", false], ["C", "explicarle con amabilidad que prefiere no tener relaciones comerciales con las familias de sus estudiantes.", "La clave se funda en el conflicto de intereses y en la integridad, no en una regla sobre ventas: aunque la iniciativa sea de la madre, una relación comercial con la familia de un estudiante al que usted evalúa le crea un interés particular en un asunto a su cargo (Ley 1952 de 2019, art. 44) y abre la puerta a tratos preferenciales que el Código de Integridad (honestidad) orienta a evitar.", true]]}, {"id": "CB-173", "niv": 3, "e": "Si su colega insiste en que «todos lo hacen y no pasa nada», una respuesta coherente con el Código de Integridad es", "f": "Función Pública (2017). Código de Integridad del Servicio Público (honestidad); MEN (2008). Guía 31, Anexo 1: Glosario de competencias (comunicación y relaciones interpersonales).", "o": [["A", "evitar contradecirlo y simplemente no hacerlo, para no afectar la buena relación con su colega.", "Cuida la relación y usted actúa de manera correcta, pero deja sin respuesta una práctica que afecta la ética institucional, cuando podía argumentar sin descalificar.", false], ["B", "acordar con él que solo lo harán en eventos sociales del colegio, donde la relación con las familias es informal.", "Parece un punto medio, pero los eventos del colegio siguen siendo espacios institucionales con familias de sus estudiantes; el conflicto se mantiene.", false], ["C", "explicarle con respeto que, aunque sea común, mezcla intereses personales con la relación con las familias.", "El Código de Integridad es un instrumento pedagógico que orienta el comportamiento más allá de lo sancionable. Responder con argumentos y sin descalificar al colega corresponde al valor de honestidad y a la comunicación asertiva (Guía 31).", true]]}]}, {"comp": "competencias_blandas", "rol": "docente", "tag": "Competencias blandas y ciudadanas · Competencias ciudadanas: convivencia y paz (Guía 6)", "texto": "Usted es director de grupo de once. Un estudiante le muestra capturas de pantalla de un grupo de WhatsApp de varios compañeros en el que, desde hace tres semanas, se publican memes que ridiculizan a Andrés por su orientación sexual. Andrés ha faltado varios días a clase. El estudiante que le muestra las capturas le pide que no diga que fue él quien las mostró, porque teme represalias.", "items": [{"id": "CB-174", "niv": 1, "e": "Frente a la información recibida, lo primero que usted hace es", "f": "Ley 1620 de 2013, art. 19; Decreto 1965 de 2013, arts. 43 y 44.", "o": [["A", "pedir al estudiante que le reenvíe las capturas para compartirlas en el chat de docentes del grado y analizarlas juntos.", "Consultar con colegas parece útil, pero difundir las capturas en un chat amplía la exposición de Andrés y no sigue el conducto del protocolo.", false], ["B", "agradecer al estudiante, garantizarle reserva sobre su identidad e informar la situación según el protocolo institucional.", "Los docentes deben identificar, reportar y hacer seguimiento a los casos de acoso y ciberacoso, y reportar también al comité cuando ocurren por medios electrónicos (Ley 1620 de 2013, art. 19). Proteger a quien informa es parte de proteger a los involucrados (Decreto 1965 de 2013, arts. 43 y 44).", true], ["C", "hablar de inmediato con los autores de los memes para que los borren antes de que la situación escale.", "Busca detener el daño rápido, pero omite el reporte y puede revelar quién informó; además, borrar el contenido elimina evidencia necesaria para la atención.", false]]}, {"id": "CB-175", "niv": 3, "e": "Al conversar con Andrés, él le pide que no informe a nadie, ni siquiera a sus padres. Usted", "f": "Decreto 1965 de 2013, arts. 43 y 44; Ley 1620 de 2013, art. 19; Ley 1581 de 2012, art. 5.", "o": [["A", "le explica que debe activar el protocolo para protegerlo, que este incluye a su familia, y que no revelará su vida privada.", "El ciberacoso repetido exige activar el protocolo, que incluye informar a las familias y adoptar medidas de protección (Decreto 1965 de 2013, arts. 43 y 44; Ley 1620 de 2013, art. 19). Lo que se informa es la agresión, no la orientación sexual del estudiante, que es un dato sensible (Ley 1581 de 2012, art. 5).", true], ["B", "informa solo a la orientadora y acuerda con ella no contactar a la familia mientras Andrés no lo autorice.", "Busca respetar su decisión, pero el protocolo exige informar a las familias de los involucrados; omitirlo deja al estudiante sin el apoyo de su familia y sin la ruta completa.", false], ["C", "respeta su petición y sigue conversando con él durante los próximos días, para ganar su confianza antes de actuar.", "Fortalecer la confianza es valioso, pero aplazar el protocolo deja que el hostigamiento continúe y desconoce el deber de reportar del docente.", false]]}, {"id": "CB-176", "niv": 2, "e": "Sobre las capturas de pantalla, usted", "f": "Decreto 1965 de 2013, arts. 43 y 44; Ley 1581 de 2012, art. 4.", "o": [["A", "las borra de su teléfono después de leerlas, para no seguir haciendo circular el contenido ofensivo.", "Evitar la circulación es una buena intención, pero eliminar la evidencia dificulta la atención del caso y la adopción de medidas.", false], ["B", "las muestra a los padres de todos los estudiantes del grupo, para que conozcan la gravedad del caso.", "Busca que las familias tomen conciencia, pero expone a Andrés ante muchas personas y desconoce la reserva que exige el protocolo.", false], ["C", "las conserva como evidencia y las entrega solo a las instancias encargadas de atender la situación.", "Las capturas son necesarias para la atención del caso y deben manejarse con reserva, preservando la intimidad y la confidencialidad (Decreto 1965 de 2013, arts. 43 y 44; Ley 1581 de 2012, art. 4).", true]]}, {"id": "CB-177", "niv": 3, "e": "Para trabajar con el grupo después de atender el caso, sin exponer nuevamente a Andrés, usted", "f": "Ley 1620 de 2013, art. 19; MEN (2004). Estándares Básicos de Competencias Ciudadanas, Serie Guías n.º 6 (pluralidad, identidad y valoración de las diferencias).", "o": [["A", "desarrolla actividades sobre el uso responsable de redes y el respeto a la diversidad sexual, sin aludir al caso.", "La Ley 1620 de 2013 (art. 19) pide a los docentes transformar las prácticas pedagógicas para contribuir a la convivencia, y la Guía 6 orienta a valorar las diferencias. No aludir al caso protege la intimidad de Andrés.", true], ["B", "deja el tema en manos del comité de convivencia y evita abordarlo en clase para no reabrir la situación.", "Evita revictimizar, pero renuncia a la función pedagógica del docente en la prevención; el comité atiende el caso, el aula forma al grupo.", false], ["C", "realiza un debate sobre lo ocurrido en el grupo de WhatsApp, para que los autores reconozcan su error frente a todos.", "Busca la reparación, pero reabre públicamente la situación de Andrés y expone a los involucrados; la reparación se trabaja en el marco del protocolo, no frente a todo el grupo.", false]]}]}, {"comp": "competencias_blandas", "rol": "docente", "tag": "Competencias blandas y ciudadanas · Competencias ciudadanas: participación y responsabilidad democrática (Guía 6)", "texto": "Los estudiantes de décimo y once de un colegio oficial están inconformes con la calidad de los refrigerios del programa de alimentación escolar. En el chat de estudiantes circula la propuesta de no entrar a clases al día siguiente como protesta. El personero estudiantil le pide consejo a usted, docente de ciencias sociales, sobre qué hacer. Varios estudiantes ya reunieron fotos de los refrigerios de la última semana.", "items": [{"id": "CB-178", "niv": 1, "e": "Al personero, usted le sugiere", "f": "Ley 115 de 1994, art. 94; MEN (2004). Estándares Básicos de Competencias Ciudadanas, Serie Guías n.º 6 (participación y responsabilidad democrática).", "o": [["A", "no intervenir, porque el programa de alimentación depende de la alcaldía y no de las directivas del colegio.", "Es cierto que el programa no depende solo del colegio, pero la institución puede tramitar las quejas ante quien corresponda; no intervenir deja sin cauce la inconformidad.", false], ["B", "organizar las evidencias y quejas y presentar una solicitud formal al rector, como lo permite su cargo.", "El personero tiene como función presentar ante el rector las solicitudes necesarias para proteger los derechos de los estudiantes (Ley 115 de 1994, art. 94). Usar primero ese canal es una forma responsable de participación (Guía 6).", true], ["C", "convocar a no entrar a clase de forma pacífica, porque la protesta es una forma legítima de participación.", "La protesta pacífica es legítima, pero el personero aún no ha usado el canal institucional que su cargo le ofrece, y la medida afecta el derecho a la educación de todos.", false]]}, {"id": "CB-179", "niv": 2, "e": "Si el rector no resuelve de manera satisfactoria la solicitud del personero, este puede", "f": "Ley 115 de 1994, arts. 94 y 145; Decreto 1860 de 1994, art. 29.", "o": [["A", "acudir al consejo académico, que atiende todas las funciones relacionadas con la buena marcha de la institución.", "El consejo académico tiene esa función general (Ley 115, art. 145), pero la ley asigna expresamente al consejo directivo la decisión en última instancia sobre las solicitudes del personero.", false], ["B", "apelar ante el consejo directivo la decisión del rector sobre su solicitud.", "El parágrafo del artículo 94 de la Ley 115 de 1994 establece que las decisiones sobre las solicitudes del personero son resueltas en última instancia por el consejo directivo.", true], ["C", "acudir al consejo de estudiantes, por ser el máximo órgano de participación de los educandos.", "El consejo de estudiantes es el máximo órgano de participación estudiantil (Decreto 1860, art. 29), pero no es instancia de decisión sobre las solicitudes del personero.", false]]}, {"id": "CB-180", "niv": 3, "e": "Para convertir la situación en una experiencia de formación ciudadana, en su clase usted", "f": "MEN (2004). Estándares Básicos de Competencias Ciudadanas, Serie Guías n.º 6 (participación y responsabilidad democrática).", "o": [["A", "explica que estos asuntos los deben resolver los adultos y que la tarea de los estudiantes es estudiar.", "Busca tranquilizar al grupo, pero desconoce que los estudiantes son parte de la comunidad educativa y tienen mecanismos legítimos para participar.", false], ["B", "organiza una votación para decidir si el curso apoya o no la protesta, y respeta la decisión de la mayoría.", "Votar es una práctica democrática, pero decidir sin analizar antes la situación, las opciones y sus consecuencias reduce la participación a contar votos.", false], ["C", "propone analizar quién decide sobre el programa de alimentación y qué mecanismos de participación existen.", "Conocer cómo se toman las decisiones públicas y qué mecanismos de participación existen hace parte de la participación y responsabilidad democrática (Guía 6). La situación real da sentido a ese aprendizaje.", true]]}]}, {"comp": "competencias_blandas", "rol": "docente", "tag": "Competencias blandas y ciudadanas · Habilidades socioemocionales en el aula", "texto": "Usted es docente de química de once. Faltan tres semanas para la prueba Saber 11 y varios estudiantes muestran ansiedad: una estudiante tiene crisis de llanto en los simulacros y otros dicen que «si les va mal, no sirven para nada». En una clase, un estudiante, frustrado por una nota, le dice a usted delante del grupo que es «el peor profesor del colegio». El grupo queda en silencio, atento a su reacción.", "items": [{"id": "CB-181", "niv": 1, "e": "Frente al comentario del estudiante delante del grupo, usted", "f": "MEN (2008). Guía 31, Anexo 1: Glosario de competencias (comunicación y relaciones interpersonales); MEN (2004). Estándares Básicos de Competencias Ciudadanas, Serie Guías n.º 6 (competencias emocionales).", "o": [["A", "mantiene la calma, le dice que hablarán al terminar la clase y continúa con la actividad.", "Regular la propia emoción y posponer la conversación para un momento adecuado corresponde al manejo de emociones de la competencia de comunicación y relaciones interpersonales (Guía 31) y modela autorregulación para el grupo (Guía 6).", true], ["B", "le responde con firmeza frente al grupo, para que los demás no piensen que pueden faltarle al respeto.", "Poner límites es necesario, pero confrontarlo en público, cuando el estudiante está frustrado, puede escalar la situación y convertirla en una disputa de autoridad.", false], ["C", "le pide que salga del salón hasta que se calme, para evitar que la situación escale frente al grupo.", "Busca evitar la escalada, pero lo aparta de la clase y aplaza el manejo del conflicto sin ofrecerle una conversación.", false]]}, {"id": "CB-182", "niv": 2, "e": "En la conversación posterior con el estudiante, usted", "f": "MEN (2004). Estándares Básicos de Competencias Ciudadanas, Serie Guías n.º 6 (competencias comunicativas: asertividad y escucha activa); Decreto 1290 de 2009, art. 4.", "o": [["A", "conversa con él sobre su frustración y acuerdan cómo manejar los desacuerdos, sin volver sobre el comentario.", "El diálogo sobre la frustración es útil, pero omitir el irrespeto le transmite que esa forma de expresarse frente al grupo es aceptable.", false], ["B", "le señala con claridad que el comentario fue irrespetuoso, escucha su inconformidad y le indica cómo reclamar la nota.", "Poner un límite claro sin agresión es asertividad, y escuchar la inconformidad es escucha activa (Guía 6). Indicar el procedimiento de reclamación (Decreto 1290 de 2009, art. 4) canaliza el desacuerdo por la vía correcta.", true], ["C", "le explica que el irrespeto es una falta del manual de convivencia y le hace la anotación correspondiente.", "Aplicar el manual puede ser pertinente, pero limitarse a la sanción no atiende la inconformidad por la nota ni le indica cómo tramitarla.", false]]}, {"id": "CB-183", "niv": 2, "e": "Frente a la idea de que «si les va mal, no sirven para nada», usted", "f": "MEN (2004). Estándares Básicos de Competencias Ciudadanas, Serie Guías n.º 6 (competencias emocionales y cognitivas).", "o": [["A", "les asegura que a todos les irá bien si siguen estudiando con disciplina en las próximas semanas.", "Busca tranquilizarlos, pero ofrece una garantía que no puede cumplir y mantiene la idea de que su valor depende del resultado.", false], ["B", "les recuerda la importancia de la prueba para su futuro, para que canalicen la ansiedad en el estudio.", "Quiere motivarlos, pero aumenta la presión que ya sienten y refuerza la creencia que genera la ansiedad.", false], ["C", "ayuda a los estudiantes a reconocer que un resultado no define su valor y a identificar sus avances.", "Identificar y transformar pensamientos que generan malestar es parte de las competencias emocionales y cognitivas (Guía 6). Reconocer los avances reduce la ansiedad sin negar la importancia de la prueba.", true]]}, {"id": "CB-184", "niv": 3, "e": "Para la estudiante que tiene crisis de llanto en los simulacros, la respuesta más adecuada es", "f": "MEN (2004). Estándares Básicos de Competencias Ciudadanas, Serie Guías n.º 6 (competencias emocionales).", "o": [["A", "hablar con ella en privado, enseñarle estrategias de regulación y acordar con orientación un acompañamiento.", "Reconocer las emociones de la estudiante y ayudarla a manejarlas son competencias emocionales (Guía 6); articular con orientación escolar asegura un acompañamiento adecuado cuando la ansiedad es intensa.", true], ["B", "pedirle que practique más simulacros en casa, porque la familiaridad con la prueba reduce la ansiedad.", "La práctica puede ayudar, pero no atiende la intensidad emocional de las crisis ni ofrece acompañamiento.", false], ["C", "eximirla de presentar los simulacros restantes, para evitarle una nueva crisis en las semanas previas a la prueba.", "Busca protegerla, pero evitar la situación no le da herramientas para manejar la ansiedad que enfrentará el día de la prueba.", false]]}]}, {"comp": "competencias_blandas", "rol": "directivo", "tag": "Competencias blandas y ciudadanas · Liderazgo y trabajo en equipo (Guía 31)", "texto": "Usted es el nuevo director rural de un centro educativo con cuatro sedes multigrado en una zona montañosa de Nariño. Los docentes de las sedes trabajan aislados y solo se reúnen en las jornadas institucionales. La comunidad le pide apoyo para un proyecto de huerta escolar en todas las sedes, pero dos docentes dicen que no tienen tiempo y que «los proyectos siempre se quedan en el papel».", "items": [{"id": "CB-185", "niv": 1, "e": "Para iniciar el trabajo conjunto entre las sedes, usted", "f": "MEN (2008). Guía 31, Anexo 1: Glosario de competencias (liderazgo).", "o": [["A", "convoca a los docentes a identificar necesidades comunes y a definir juntos una meta para el proyecto.", "El liderazgo consiste en motivar e involucrar a la comunidad con una identidad común y una visión institucional compartida (Guía 31). Construir la meta con los docentes genera sentido y compromiso.", true], ["B", "asigna el proyecto a los docentes que mostraron interés y exime a los demás, para no generar resistencia.", "Evita conflictos, pero divide al equipo y deja sedes por fuera de un proyecto que la comunidad pidió para todas.", false], ["C", "elabora usted mismo el proyecto completo y lo entrega a los docentes para que lo implementen en sus sedes.", "Aporta organización y ahorra tiempo a los docentes, pero no los involucra en la definición del proyecto, lo que reduce su apropiación.", false]]}, {"id": "CB-186", "niv": 2, "e": "Dos meses después, uno de los docentes sigue sin realizar las actividades que acordó para su sede, aunque los demás cumplen. Usted", "f": "MEN (2008). Guía 31, Anexo 1: Glosario de competencias (liderazgo; orientación al logro).", "o": [["A", "asume usted las actividades de esa sede, para que los estudiantes y la comunidad no se vean afectados.", "Protege a la comunidad en lo inmediato, pero libera al docente de su responsabilidad y no resuelve el incumplimiento.", false], ["B", "convoca a todos los docentes a una nueva reunión de reflexión sobre el sentido del proyecto para la comunidad.", "La reflexión colectiva puede motivar, pero el problema es el incumplimiento de una persona; tratarlo en general no lo corrige y recarga a quienes sí cumplen.", false], ["C", "le recuerda por escrito sus compromisos, fija con él fechas concretas y hace seguimiento a su cumplimiento.", "Como directivo, ante un incumplimiento persistente debe exigir con claridad lo acordado y hacer seguimiento; así orienta al equipo hacia los resultados y es justo con quienes cumplen (Guía 31, liderazgo y orientación al logro).", true]]}, {"id": "CB-187", "niv": 3, "e": "Para que la comunidad participe sin que el proyecto dependa solo de las familias, usted", "f": "MEN (2008). Guía 31, Anexo 1: Glosario de competencias (trabajo en equipo; competencia comunitaria).", "o": [["A", "delega la huerta en la junta de acción comunal, que tiene más tiempo y conocimiento del trabajo agrícola.", "Aprovecha un saber valioso de la comunidad, pero desliga el proyecto del trabajo pedagógico de la escuela y de la participación de los estudiantes.", false], ["B", "acuerda con familias, docentes y estudiantes roles y tiempos concretos, y articula la huerta con las áreas.", "La interacción con la comunidad y el entorno (competencia funcional comunitaria) y el trabajo en equipo (Guía 31) se concretan en acuerdos de corresponsabilidad. Articular la huerta con las áreas le da sentido pedagógico.", true], ["C", "pide a las familias que aporten semillas y herramientas y que se encarguen del mantenimiento durante el año.", "Involucra a las familias, pero les traslada la carga principal del proyecto, que es justamente lo que se busca evitar.", false]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Convivencia escolar (Ley 1620 de 2013 y Decreto 1965 de 2013)", "texto": "Usted es director de grupo de séptimo grado. Una estudiante le cuenta, muy afectada, que desde hace tres semanas dos compañeros del curso publican en un grupo de WhatsApp fotos suyas editadas con apodos ofensivos y que varios estudiantes las reenvían. La estudiante no ha sufrido agresiones físicas, pero dice que no quiere volver al colegio. Las imágenes no tienen contenido sexual ni íntimo. Los dos compañeros reconocen que hicieron las publicaciones «en broma».", "items": [{"id": "CV-001", "niv": 1, "e": "De acuerdo con el Decreto 1965 de 2013, la situación descrita se clasifica como", "f": "Decreto 1965 de 2013, artículos 39 (numerales 3 y 5) y 40.", "o": [["A", "una situación tipo III, porque difundir imágenes ofensivas por redes sociales constituye un delito.", "No toda difusión de imágenes es delito. El Tipo III aplica a presuntos delitos, por ejemplo contra la libertad, integridad y formación sexual; las fotos editadas con apodos ofensivos son agresión electrónica (Tipo II).", false], ["B", "una situación tipo I, porque no hubo daño al cuerpo ni a la salud de la estudiante.", "El Tipo I comprende conflictos manejados inadecuadamente y situaciones esporádicas. Aquí hay agresión electrónica repetida durante tres semanas, lo que encaja en el Tipo II aunque no haya daño físico.", false], ["C", "una situación tipo II, porque es ciberacoso repetido que no reviste las características de un delito.", "El artículo 40 del Decreto 1965 de 2013 clasifica como Tipo II la agresión escolar, el acoso y el ciberacoso que no sean delito y que se presenten de manera repetida o sistemática. Las publicaciones ofensivas durante tres semanas cumplen esa condición.", true]]}, {"id": "CV-002", "niv": 2, "e": "Una vez conocida la situación, frente a las familias lo que corresponde según el protocolo es", "f": "Decreto 1965 de 2013, artículo 43, numeral 4.", "o": [["A", "informar de inmediato solo a la familia de la estudiante afectada, para proteger la identidad de los demás.", "El protocolo exige informar a los padres o acudientes de todos los estudiantes involucrados, no solo de la víctima. La intimidad se protege con la reserva de la información, no omitiendo informar.", false], ["B", "informar de manera inmediata a los padres o acudientes de todos los estudiantes involucrados.", "El artículo 43, numeral 4, del Decreto 1965 de 2013 establece para las situaciones Tipo II informar de manera inmediata a los padres, madres o acudientes de todos los estudiantes involucrados, dejando constancia.", true], ["C", "esperar a que el comité escolar de convivencia sesione para decidir a qué familias se informa.", "La norma exige informar de manera inmediata; esperar a la sesión del comité retrasa una actuación que no depende de su decisión.", false]]}, {"id": "CV-003", "niv": 2, "e": "En el manejo de la situación por parte del comité escolar de convivencia, la responsabilidad de reportar el caso en el Sistema de Información Unificado de Convivencia Escolar corresponde a", "f": "Decreto 1965 de 2013, artículo 43, numeral 9; Ley 1620 de 2013, artículos 12 y 19.", "o": [["A", "el presidente del comité escolar de convivencia.", "El artículo 43, numeral 9, del Decreto 1965 de 2013 asigna al presidente del comité escolar de convivencia reportar la información del caso en el aplicativo del Sistema de Información Unificado de Convivencia Escolar.", true], ["B", "el director de grupo que recibió la queja de la estudiante.", "El docente debe identificar, reportar al comité y hacer seguimiento (Ley 1620, art. 19), pero el reporte al sistema de información lo hace el presidente del comité.", false], ["C", "el docente con función de orientación escolar de la institución.", "El orientador integra el comité escolar de convivencia (Ley 1620, art. 12), pero la norma asigna el reporte al sistema de información a su presidente.", false]]}, {"id": "CV-004", "niv": 2, "e": "Si se estableciera que entre las imágenes difundidas hay contenido íntimo de carácter sexual de la estudiante, el presidente del comité debe", "f": "Decreto 1965 de 2013, artículos 40 (numeral 3) y 44 (numerales 3 y 4).", "o": [["A", "aplicar el protocolo de situaciones Tipo II y remitir el caso a la comisaría de familia.", "Un presunto delito contra la libertad, integridad y formación sexual corresponde al Tipo III (art. 40, num. 3), cuyo protocolo exige informar a la Policía Nacional.", false], ["B", "poner la situación en conocimiento de la Policía Nacional de inmediato y por el medio más expedito.", "La difusión de contenido sexual de una menor constituye un presunto delito, es decir, una situación Tipo III. El artículo 44, numeral 3, del Decreto 1965 de 2013 ordena al presidente del comité informar de inmediato a la Policía Nacional.", true], ["C", "citar al comité para que decida si el caso amerita ser remitido a una autoridad externa.", "En una situación Tipo III la puesta en conocimiento de la Policía no depende de una decisión previa del comité; el comité se cita, pero «no obstante» lo anterior, la autoridad se informa de inmediato.", false]]}]}, {"comp": "pedagogia_normativa", "rol": "directivo", "tag": "Competencias pedagógicas y normativa · Funciones del rector (Ley 715 de 2001, art. 10)", "texto": "Usted acaba de posesionarse como rector de una institución educativa oficial urbana que ofrece preescolar, básica y media técnica en dos jornadas, con 58 docentes y tres coordinadores. En la primera semana encuentra varios pendientes: los docentes esperan conocer su asignación académica del año; un grupo de padres reclama que nunca se les informa qué docente orienta cada asignatura; el consejo directivo pregunta con qué periodicidad recibirá informes de la rectoría, y la coordinadora de la jornada de la tarde le reporta que un docente de educación física completa seis inasistencias sin justificación en el último mes.", "items": [{"id": "DI-101", "niv": 1, "e": "Sobre la asignación académica de los docentes, a usted le corresponde", "f": "Ley 715 de 2001, artículo 10, numeral 10.9.", "o": [["A", "distribuirla entre los docentes a su cargo, de conformidad con las normas sobre la materia.", "La Ley 715 de 2001, artículo 10, numeral 10.9, asigna al rector distribuir las asignaciones académicas y demás funciones de los docentes, directivos docentes y administrativos a su cargo, de acuerdo con las normas vigentes.", true], ["B", "someterla a votación del consejo académico, que es el órgano que organiza el plan de estudios.", "El consejo académico organiza el plan de estudios (Ley 115, art. 145), pero distribuir las asignaciones académicas es una función expresa del rector (Ley 715, num. 10.9); no se decide por votación.", false], ["C", "pedir a la secretaría de educación que la defina para cada docente según su acto de nombramiento.", "La secretaría nombra y administra la planta, pero la distribución de la asignación académica dentro del establecimiento corresponde al rector (Ley 715, num. 10.9).", false]]}, {"id": "DI-102", "niv": 2, "e": "Frente al reclamo de los padres sobre la información de los docentes, la norma le exige", "f": "Ley 715 de 2001, artículo 10, numeral 10.17.", "o": [["A", "incluir esa información en el informe anual de gestión que la rectoría presenta a la secretaría de educación.", "Informar a la secretaría no reemplaza el deber de publicidad ante la comunidad: la norma exige publicación semestral en lugares públicos y comunicación escrita a los padres (Ley 715, num. 10.17).", false], ["B", "entregar esa información al consejo de padres cuando este la solicite formalmente, mediante un derecho de petición dirigido a la rectoría.", "La ley no condiciona esta información a una petición: el rector debe publicarla cada semestre y comunicarla por escrito a los padres por iniciativa propia (Ley 715, num. 10.17).", false], ["C", "publicar cada semestre, en lugares públicos, los docentes de cada asignatura con sus horarios y carga, y comunicarlo por escrito a los padres.", "La Ley 715 de 2001, artículo 10, numeral 10.17, ordena al rector publicar una vez al semestre en lugares públicos y comunicar por escrito a los padres los docentes a cargo de cada asignatura, sus horarios y su carga docente.", true]]}, {"id": "DI-103", "niv": 1, "e": "Al consejo directivo usted debe rendirle un informe de su gestión", "f": "Ley 715 de 2001, artículo 10, numeral 10.15.", "o": [["A", "una vez al año, al finalizar el calendario académico.", "Un único informe anual no cumple la periodicidad mínima legal: la Ley 715 exige rendir informe al consejo directivo al menos cada seis meses (num. 10.15).", false], ["B", "por lo menos una vez cada seis meses.", "La Ley 715 de 2001, artículo 10, numeral 10.15, establece como función del rector rendir un informe al consejo directivo de la institución al menos cada seis meses.", true], ["C", "únicamente cuando el consejo lo solicite mediante acuerdo.", "El informe es una obligación periódica del rector, no una respuesta a solicitudes del consejo: debe rendirse al menos cada seis meses (Ley 715, num. 10.15).", false]]}, {"id": "DI-104", "niv": 2, "e": "Frente a las inasistencias injustificadas del docente de educación física, lo que corresponde a usted como rector es", "f": "Ley 715 de 2001, artículo 10, numerales 10.6 y 10.7; Ley 115 de 1994, artículo 144.", "o": [["A", "verificar la situación y reportar la novedad a la secretaría de educación, en ejercicio del control sobre el cumplimiento de funciones.", "La Ley 715 de 2001, artículo 10, numeral 10.6, asigna al rector realizar el control sobre el cumplimiento de las funciones del personal docente y reportar las novedades e irregularidades a la secretaría de educación.", true], ["B", "concederle permisos con fecha anterior para regularizar las ausencias y evitar un conflicto con él.", "El rector administra los permisos (num. 10.7), pero otorgar permisos retroactivos para encubrir ausencias injustificadas contradice su deber de control y de reporte de irregularidades (num. 10.6).", false], ["C", "remitir el caso al consejo directivo, porque es la instancia del gobierno escolar que resuelve los conflictos que se presentan con el personal docente.", "El consejo directivo sirve de instancia en conflictos entre docentes o administrativos y alumnos (Ley 115, art. 144, lit. b); el control del cumplimiento de funciones del personal es del rector (Ley 715, num. 10.6).", false]]}]}, {"comp": "pedagogia_normativa", "rol": "directivo", "tag": "Competencias pedagógicas y normativa · Gobierno escolar (Ley 115 de 1994; Decreto 1860 de 1994; Decreto 1286 de 2005)", "texto": "Usted es rector de una institución educativa rural de un municipio del Cauca que ofrece preescolar y básica completa, es decir, hasta grado noveno, en una sede principal y cuatro sedes multigrado. Parte de los estudiantes pertenece a un resguardo indígena cercano. Al iniciar el año escolar debe organizar el gobierno escolar. En la institución no existe asociación de padres de familia. Una docente de la sede principal, cuyo hijo cursa sexto en la misma instituci
