 cupo para quien no es promovido no está sujeta a la disponibilidad de vacantes después de matricular a estudiantes nuevos.", false]]}, {"id": "NR-167", "niv": 3, "e": "Frente a la sugerencia del rector sobre las pruebas censales, usted señala que", "f": "Decreto 1290 de 2009, artículo 11.", "o": [["A", "es procedente si los padres de esos estudiantes firman su autorización para que no presenten la prueba.", "La responsabilidad de presentar a todos los estudiantes matriculados en los grados evaluados no admite excepción por autorización de los padres.", false], ["B", "es procedente si el consejo académico la justifica como una estrategia del plan de mejoramiento.", "Excluir estudiantes distorsiona los resultados y desconoce la obligación del artículo 11; los resultados deben usarse para mejorar, no para seleccionar quién presenta la prueba.", false], ["C", "no es procedente, porque la institución debe presentar a todos los estudiantes matriculados en los grados evaluados.", "El artículo 11 del Decreto 1290 de 2009 incluye entre las responsabilidades del establecimiento educativo presentar a las pruebas censales del ICFES a la totalidad de los estudiantes matriculados en los grados evaluados.", true]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Educación inclusiva (Decreto 1421 de 2017, compilado en el Decreto 1075 de 2015)", "texto": "En agosto llega a una institución oficial de Sincelejo Tomás, de 9 años, con síndrome de Down, que hasta ahora no había estado escolarizado. La familia trae un informe de la fundación de rehabilitación a la que asistía, pero no un diagnóstico médico actualizado. La secretaria académica sugiere no matricularlo hasta que traigan el diagnóstico o «remitirlo a una institución especial». Usted será su docente de primer grado y ya planea sus clases con distintas formas de presentar la información y de participar, pensadas para todo el grupo.", "items": [{"id": "NR-168", "niv": 1, "e": "Frente a la sugerencia de la secretaria académica, el Decreto 1421 de 2017 establece que", "f": "Decreto 1421 de 2017 (Decreto 1075 de 2015, sección 2.3.3.5): definiciones y no discriminación.", "o": [["A", "la matrícula se condiciona a que la familia presente un diagnóstico médico actualizado.", "Los apoyos y ajustes se definen a partir de la valoración pedagógica y social y de las barreras del entorno; la falta de un diagnóstico médico no autoriza a negar la matrícula.", false], ["B", "ningún establecimiento puede rechazar la matrícula de un estudiante en razón de su discapacidad.", "El Decreto 1421 de 2017 (Decreto 1075 de 2015, sección 2.3.3.5) dispone que ningún establecimiento educativo podrá rechazar la matrícula de un estudiante en razón de su situación de discapacidad, ni negarse a hacer los ajustes razonables que se requieran.", true], ["C", "el estudiante debe remitirse a una institución especializada en la atención de la discapacidad intelectual.", "La educación inclusiva busca el aprendizaje con pares de la misma edad en un ambiente de aprendizaje común; remitirlo por su discapacidad contradice ese enfoque y la prohibición de rechazo.", false]]}, {"id": "NR-169", "niv": 2, "e": "Como Tomás ingresa al sistema educativo con el año escolar en curso, el Decreto 1421 de 2017 dispone que su PIAR y el acta de acuerdo", "f": "Decreto 1421 de 2017 (Decreto 1075 de 2015, sección 2.3.3.5): PIAR, parágrafo 1, y acta de acuerdo.", "o": [["A", "se sustituyan por el informe de la fundación a la que asistía hasta el cierre del año.", "El informe de la fundación es un insumo valioso para la valoración pedagógica, pero no reemplaza el PIAR ni el acta de acuerdo, que deben construirse en máximo treinta días.", false], ["B", "se elaboren al comenzar el siguiente año escolar, durante el primer trimestre.", "El primer trimestre es la regla para quienes inician el año escolar; para vinculaciones extemporáneas el término es de máximo treinta días, sin esperar al año siguiente.", false], ["C", "se elaboren y firmen en un término no mayor a treinta días desde su vinculación.", "El Decreto 1421 de 2017 prevé que, cuando un estudiante se vincula al sistema educativo de manera extemporánea, se contemple un término no mayor a treinta días para elaborar el PIAR y firmar el acta de acuerdo entre la institución y la familia.", true]]}, {"id": "NR-170", "niv": 2, "e": "En la construcción del PIAR de Tomás, el diseño lo deben liderar", "f": "Decreto 1421 de 2017 (Decreto 1075 de 2015, sección 2.3.3.5): construcción e implementación de los PIAR.", "o": [["A", "el orientador escolar y el rector, a partir del informe que entregue la familia.", "El orientador y los directivos pueden participar según la organización escolar, pero el diseño lo lideran los docentes de aula con el docente de apoyo, la familia y el estudiante.", false], ["B", "el o los docentes de aula con el docente de apoyo, la familia y el estudiante.", "El Decreto 1421 de 2017 establece que el diseño de los PIAR lo liderarán el o los docentes de aula con el docente de apoyo, la familia y el estudiante; según la organización escolar, participan también los directivos docentes y el orientador.", true], ["C", "el profesional de salud que atiende a Tomás, con base en su diagnóstico clínico.", "Los informes de profesionales de la salud son uno de los contenidos del PIAR, pero su diseño es pedagógico y lo lideran los docentes con la familia y el estudiante.", false]]}, {"id": "NR-171", "niv": 3, "e": "Sobre la relación entre la planeación que usted hace para todo el grupo y los ajustes para Tomás, el Decreto 1421 de 2017 indica que", "f": "Decreto 1421 de 2017 (Decreto 1075 de 2015, sección 2.3.3.5): definiciones de ajustes razonables, DUA y PIAR.", "o": [["A", "los ajustes razonables responden a necesidades que persisten pese a aplicar el Diseño Universal del Aprendizaje.", "El Decreto 1421 de 2017 define los ajustes razonables como acciones, adaptaciones y apoyos basados en necesidades específicas de cada estudiante que persisten a pesar de que se incorpore el Diseño Universal de los Aprendizajes; el PIAR es complemento de las transformaciones hechas con el DUA.", true], ["B", "los ajustes razonables reemplazan al Diseño Universal del Aprendizaje cuando hay estudiantes con discapacidad en el aula.", "Los ajustes no reemplazan el DUA, lo complementan: el DUA sigue beneficiando a todo el grupo, incluido Tomás.", false], ["C", "el Diseño Universal del Aprendizaje se aplica solo a los estudiantes que tienen un diagnóstico de discapacidad.", "El DUA es un diseño de productos, entornos y programas que todas las personas puedan usar sin adaptación especializada; no se limita a estudiantes con diagnóstico.", false]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Período de prueba e inscripción en el escalafón (Decreto 1278 de 2002)", "texto": "Tres docentes ganaron el concurso de méritos en una entidad territorial certificada de calendario A, cuyo año escolar termina a finales de noviembre. Diana, licenciada en Lengua Castellana, se posesionó el 3 de marzo; Jorge, ingeniero civil, se posesionó el 10 de marzo en el área de matemáticas; y Paola, licenciada en Educación Infantil, se posesionó el 1 de septiembre. Los tres preguntan en la secretaría de educación cuándo serán evaluados y qué ocurrirá después de la evaluación del período de prueba.", "items": [{"id": "NR-172", "niv": 1, "e": "Sobre la duración del período de prueba de Diana, el Decreto 1278 de 2002 establece que", "f": "Decreto 1278 de 2002, artículos 12 y 31.", "o": [["A", "dura un año calendario completo, contado desde la fecha de su posesión en el cargo.", "La norma no fija un año calendario: el período de prueba se extiende hasta terminar el año escolar, con un mínimo de cuatro meses de servicio.", false], ["B", "va hasta culminar el año escolar en que fue nombrada, porque habrá desempeñado el cargo al menos cuatro meses.", "El artículo 12 del Decreto 1278 de 2002 dispone que el seleccionado será nombrado en período de prueba hasta culminar el año escolar en el cual fue nombrado, siempre que haya desempeñado el cargo por lo menos durante cuatro meses. De marzo a finales de noviembre se supera ese mínimo.", true], ["C", "dura seis meses, al cabo de los cuales se hace la evaluación de desempeño y competencias.", "El Decreto 1278 no fija un período de seis meses; la evaluación se hace al terminar el año académico (artículos 12 y 31).", false]]}, {"id": "NR-173", "niv": 2, "e": "En el caso de Paola, la evaluación de período de prueba", "f": "Decreto 1278 de 2002, artículos 12, 18 y 31.", "o": [["A", "se hará al terminar el año académico siguiente, porque en el actual no alcanza cuatro meses de servicio.", "El artículo 31 del Decreto 1278 de 2002 dispone que se someten a la evaluación de período de prueba quienes hayan servido el cargo por un período no menor a cuatro meses durante el año; de lo contrario, deben esperar hasta el año académico siguiente. Del 1 de septiembre a finales de noviembre hay menos de cuatro meses.", true], ["B", "no se realizará, porque al ganar el concurso queda inscrita automáticamente en el escalafón.", "Ganar el concurso no basta: los derechos de carrera y la inscripción en el escalafón se adquieren al aprobar la evaluación del período de prueba (artículos 12 y 18).", false], ["C", "se hará al terminar el año actual, valorando solo el tiempo que efectivamente alcanzó a servir en el cargo.", "La norma exige un mínimo de cuatro meses de servicio en el año para ser evaluado; con menos tiempo, la evaluación se aplaza al año académico siguiente.", false]]}, {"id": "NR-174", "niv": 2, "e": "Si Diana obtiene 72 % en la evaluación de período de prueba, según el Decreto 1278 de 2002, ella", "f": "Decreto 1278 de 2002, artículos 20, 21 y 31.", "o": [["A", "será inscrita en el escalafón en el grado 2, nivel salarial B, por haber superado el 70 %.", "El grado se determina por el título y el nivel inicial es A para todos los que superan el período de prueba (artículo 20); el porcentaje obtenido no define el nivel salarial.", false], ["B", "será inscrita en el escalafón en el grado 1, nivel salarial A, como todo docente que ingresa.", "El grado 1 corresponde a los normalistas superiores; el grado de inscripción depende del título que se acredite, no de ser docente nuevo (artículo 21).", false], ["C", "será inscrita en el escalafón en el grado 2, nivel salarial A, por su título de licenciada.", "El artículo 31 considera satisfactoria una calificación igual o superior al 60 % e inscribe al docente en el grado que corresponda a sus títulos; el artículo 21 exige para el grado 2 ser licenciado en Educación, y el artículo 20 ubica a quienes superan el período de prueba en el nivel salarial A del grado correspondiente.", true]]}, {"id": "NR-175", "niv": 3, "e": "Para Jorge, que es ingeniero, una condición adicional que exige el Decreto 1278 de 2002 al término del período de prueba es", "f": "Decreto 1278 de 2002, artículo 12, parágrafo 1.", "o": [["A", "ninguna, porque el concurso ya evaluó sus competencias pedagógicas y su aptitud docente.", "Aunque superó el concurso, el parágrafo 1 del artículo 12 le exige acreditar formación pedagógica al término del período de prueba.", false], ["B", "acreditar el título de licenciado en matemáticas antes de ser inscrito en el escalafón docente nacional.", "La norma no exige obtener una licenciatura; a los profesionales no licenciados les basta acreditar el posgrado en educación o el programa de pedagogía.", false], ["C", "acreditar que cursa o terminó un posgrado en educación o que realizó un programa de pedagogía.", "El parágrafo 1 del artículo 12 del Decreto 1278 de 2002 dispone que los profesionales con título diferente al de licenciado deben acreditar, al término del período de prueba, que cursan o han terminado un posgrado en educación o que han realizado un programa de pedagogía en una institución de educación superior.", true]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Evaluación de desempeño, evaluación de competencias y escalafón (Decreto 1278 de 2002)", "texto": "Usted es docente regido por el Decreto 1278 de 2002, inscrito en el grado 2, nivel salarial A, desde hace cuatro años, y acaba de obtener su título de maestría en Educación. Este año su evaluación anual de desempeño fue de 58 %, la primera vez que obtiene una calificación inferior al 60 %, y no está de acuerdo con ella. Un compañero le comenta que lo van a retirar del servicio y que, gracias a la maestría, pasará de inmediato al grado 3.", "items": [{"id": "NR-176", "niv": 2, "e": "Sobre la consecuencia de la calificación de 58 %, el Decreto 1278 de 2002 establece que", "f": "Decreto 1278 de 2002, artículo 36, numeral 1.", "o": [["A", "el docente es retirado del servicio desde la primera calificación inferior al 60 %.", "La norma exige dos años consecutivos con calificación no satisfactoria; una sola evaluación inferior al 60 % no implica el retiro.", false], ["B", "el retiro procede si la calificación no satisfactoria se repite durante dos años consecutivos.", "El numeral 1 del artículo 36 del Decreto 1278 de 2002 establece que el docente que obtenga una calificación inferior al 60 % durante dos años consecutivos en la evaluación de desempeño será excluido del escalafón y retirado del servicio. Una sola calificación no satisfactoria no produce el retiro.", true], ["C", "el docente desciende de manera automática al nivel salarial inmediatamente anterior dentro de su grado.", "El Decreto 1278 no prevé descensos de nivel salarial por la evaluación de desempeño; la consecuencia prevista es el retiro si la calificación inferior al 60 % se repite dos años consecutivos.", false]]}, {"id": "NR-177", "niv": 2, "e": "Si usted quisiera pasar del nivel salarial A al B dentro del grado 2, el Decreto 1278 de 2002 exige", "f": "Decreto 1278 de 2002, artículos 20, 21 y 36.", "o": [["A", "al menos tres años de servicio y el puntaje indicado en la evaluación de competencias.", "El artículo 20 del Decreto 1278 de 2002 permite la reubicación en el nivel salarial siguiente o el ascenso de grado después de tres años de servicio, siempre que se obtenga en la evaluación de competencias el puntaje indicado según el artículo 36, que fija más del 80 %.", true], ["B", "acreditar un título de maestría o doctorado en un área afín a su desempeño.", "La maestría o el doctorado son requisito para el grado 3 (artículo 21), no para cambiar de nivel salarial dentro del mismo grado.", false], ["C", "dos evaluaciones anuales de desempeño consecutivas con calificación superior al 90 % en cada una.", "La reubicación salarial depende de la evaluación de competencias, no de un puntaje en la evaluación anual de desempeño (artículos 20 y 36).", false]]}, {"id": "NR-178", "niv": 3, "e": "Respecto del efecto de su nueva maestría, el Decreto 1278 de 2002 establece que usted", "f": "Decreto 1278 de 2002, artículos 21 (y parágrafo) y 36.", "o": [["A", "asciende automáticamente al grado 3 al radicar el diploma ante la secretaría de educación.", "El título es necesario pero no suficiente: el ascenso exige además superar la evaluación de competencias y que exista disponibilidad presupuestal (artículo 21, parágrafo).", false], ["B", "debe presentarse a un nuevo concurso de ingreso para ser inscrito en el grado 3.", "No se requiere un nuevo concurso: estando inscrito en el escalafón, el ascenso se obtiene mediante la evaluación de competencias (artículos 21 y 36).", false], ["C", "puede aspirar al grado 3 si supera la evaluación de competencias y existe disponibilidad presupuestal.", "El artículo 21 exige para el grado 3 título de maestría o doctorado y superar la evaluación de competencias si se está inscrito en el grado 1 o 2; su parágrafo condiciona el ascenso a la acreditación de requisitos, la superación de las evaluaciones y la existencia de disponibilidad presupuestal.", true]]}, {"id": "NR-179", "niv": 3, "e": "Para controvertir la evaluación de desempeño con la que no está de acuerdo, el Decreto 1278 de 2002 prevé", "f": "Decreto 1278 de 2002, artículo 36, parágrafo.", "o": [["A", "una solicitud de anulación ante el consejo directivo, que actúa como segunda instancia.", "El consejo directivo participa en la evaluación de los docentes (Ley 115, artículo 144), pero no es instancia de recursos; la norma prevé reposición y apelación ante los superiores.", false], ["B", "los recursos de reposición ante el inmediato superior y de apelación ante el superior jerárquico.", "El parágrafo del artículo 36 del Decreto 1278 de 2002 dispone que las evaluaciones de desempeño son susceptibles de los recursos de reposición y apelación, que deben resolverse dentro de los quince días hábiles siguientes por el inmediato superior y por el superior jerárquico, respectivamente.", true], ["C", "una queja disciplinaria contra el rector ante la Procuraduría General, como única vía de reclamación.", "La inconformidad con una calificación no constituye por sí misma una falta disciplinaria; la vía prevista para controvertirla son los recursos de reposición y apelación (artículo 36, parágrafo).", false]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Función docente y principios de la evaluación (Decreto 1278 de 2002)", "texto": "En la primera reunión de profesores del año, en una institución oficial de Manizales, el rector presenta el cronograma: atención a padres de familia los miércoles en la tarde, dirección de grupo, reuniones por área y jornadas de planeación. Un docente nuevo pregunta si atender a los padres hace parte de sus funciones o si es tarea del orientador. Otro colega se queja de que en la evaluación de desempeño se tengan en cuenta encuestas a estudiantes y padres, porque, según él, «solo el rector debería evaluar».", "items": [{"id": "NR-180", "niv": 1, "e": "A la pregunta sobre la atención a padres, usted responde que, según el Decreto 1278 de 2002, esta actividad", "f": "Decreto 1278 de 2002, artículo 5.", "o": [["A", "hace parte de las actividades curriculares no lectivas complementarias de la función docente.", "El artículo 5 del Decreto 1278 de 2002 señala que los docentes son responsables de las actividades curriculares no lectivas complementarias de la función docente de aula, entre ellas la atención a los padres de familia y acudientes, la dirección de grupo y las reuniones de profesores.", true], ["B", "solo es obligatoria si se reconoce como horas extra por fuera de la jornada laboral.", "El artículo 5 incluye la atención a los padres de familia y acudientes entre las responsabilidades propias del docente; no la presenta como una actividad adicional sujeta a pago de horas extra.", false], ["C", "es una función exclusiva del orientador escolar, que no les corresponde a los docentes de aula.", "El servicio de orientación estudiantil y la atención a padres figuran en el artículo 5 como responsabilidades de los docentes; el orientador apoya, pero no asume en exclusiva esta labor.", false]]}, {"id": "NR-181", "niv": 2, "e": "Al explicar al docente nuevo en qué consiste la función docente, usted señala que, según el Decreto 1278 de 2002, esta", "f": "Decreto 1278 de 2002, artículos 4 y 6.", "o": [["A", "se centra en administrar la organización escolar, y la enseñanza directa es una actividad complementaria.", "El artículo 4 pone en el centro la realización directa de los procesos de enseñanza-aprendizaje; las actividades de dirección, planeación y administración relacionadas con el proceso educativo la complementan, pero no la sustituyen.", false], ["B", "implica realizar directamente los procesos de enseñanza y aprendizaje, incluidos su diagnóstico, planificación, ejecución y evaluación.", "El artículo 4 del Decreto 1278 de 2002 define la función docente como la de carácter profesional que implica la realización directa de los procesos sistemáticos de enseñanza-aprendizaje, lo cual incluye el diagnóstico, la planificación, la ejecución y la evaluación de los mismos procesos y sus resultados, en el marco del PEI.", true], ["C", "se limita a la enseñanza de los contenidos del plan de estudios, mientras la evaluación le corresponde al consejo académico.", "La evaluación hace parte de la función docente según el artículo 4; el consejo académico supervisa el proceso general de evaluación, pero no sustituye al docente.", false]]}, {"id": "NR-182", "niv": 3, "e": "Frente a la queja del colega sobre las encuestas, usted explica que su uso se sustenta en el principio de evaluación denominado", "f": "Decreto 1278 de 2002, artículos 29 y 33.", "o": [["A", "universalidad, que obliga a aplicar las mismas encuestas en todas las instituciones del país.", "La universalidad (literal c) se refiere a la analogía de criterios de evaluación para funciones equivalentes, sin perjuicio de las especificidades; no exige encuestas idénticas en todo el país.", false], ["B", "objetividad, que exige que solo el superior inmediato califique, para evitar criterios subjetivos.", "La objetividad (literal a) significa prescindir de criterios subjetivos en las calificaciones; no restringe la evaluación al superior inmediato.", false], ["C", "participación, que prevé que distintos actores, incluidos padres y estudiantes, intervengan en la evaluación de desempeño.", "El literal f) del artículo 29 del Decreto 1278 de 2002 define el principio de participación: en la evaluación de desempeño participan distintos actores, incluidos las autoridades educativas, los superiores, los colegas, el consejo directivo, los padres de familia y los estudiantes. El artículo 33 incluye las encuestas a padres y estudiantes entre los instrumentos.", true]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Marco normativo del sector: Decreto 1075 de 2015 y Ley 115 de 1994", "texto": "Un grupo de docentes nombrados en provisionalidad se prepara para el concurso de méritos. Al estudiar, encuentran que muchas guías citan el Decreto 1860 de 1994, el Decreto 1290 de 2009 o el Decreto 1421 de 2017 con la expresión «compilado en el Decreto 1075 de 2015». Uno de ellos concluye que la Ley 115 de 1994 «ya no rige», porque todo quedó en el Decreto 1075; otra docente pregunta qué dice la Ley 115 sobre el papel del educador en la institución.", "items": [{"id": "NR-183", "niv": 1, "e": "El Decreto 1075 de 2015 es", "f": "Decreto 1075 de 2015, título y considerandos.", "o": [["A", "el Decreto Único Reglamentario del Sector Educación, que compila las normas reglamentarias del sector.", "El Decreto 1075 de 2015 se expidió como Decreto Único Reglamentario del Sector Educación, con el objetivo de compilar y racionalizar las normas de carácter reglamentario que rigen en el sector y contar con un instrumento jurídico único.", true], ["B", "la ley estatutaria de educación que sustituyó por completo a la Ley General de Educación.", "Es un decreto, no una ley, y su objeto es compilar normas reglamentarias; no sustituye la Ley 115 de 1994.", false], ["C", "el nuevo estatuto de profesionalización docente que reemplazó al Decreto 1278 de 2002.", "El Decreto 1278 de 2002 sigue siendo el estatuto de profesionalización docente; el Decreto 1075 compila normas reglamentarias del sector.", false]]}, {"id": "NR-184", "niv": 2, "e": "Frente a la conclusión de que la Ley 115 de 1994 ya no rige, lo correcto es afirmar que", "f": "Decreto 1075 de 2015, considerandos; Ley 115 de 1994, artículos 142 a 145.", "o": [["A", "es errada, porque el Decreto 1075 compila normas reglamentarias y no sustituye las leyes que estas reglamentan.", "Según sus considerandos, el Decreto 1075 de 2015 es un decreto compilatorio de normas reglamentarias preexistentes, cuyo contenido material corresponde al de los decretos compilados. Un decreto reglamentario no deroga la ley que reglamenta, de modo que la Ley 115 sigue vigente.", true], ["B", "es acertada solo en lo relativo al gobierno escolar, que ahora regula exclusivamente el Decreto 1075.", "El Decreto 1075 compila la reglamentación del gobierno escolar que provenía del Decreto 1860, pero los artículos 142 a 145 de la Ley 115 siguen siendo su base legal.", false], ["C", "es acertada, porque el Decreto 1075 derogó todas las normas anteriores del sector educativo.", "La compilación recoge decretos reglamentarios; las leyes, como la 115 de 1994 o la 1098 de 2006, no fueron compiladas ni derogadas por el Decreto 1075.", false]]}, {"id": "NR-185", "niv": 2, "e": "Sobre el papel del educador, la Ley 115 de 1994 establece que este", "f": "Ley 115 de 1994, artículos 1, 6 y 104.", "o": [["A", "ejercerá su labor de forma independiente del PEI, en virtud de la libertad de cátedra.", "La libertad de cátedra es un principio que la Ley 115 reconoce (artículo 1), pero el artículo 104 exige al educador llevar a la práctica el PEI.", false], ["B", "aplicará el plan de estudios que le entregue la institución, sin intervenir en la construcción del PEI.", "La ley espera del educador un papel activo; además, la comunidad educativa, de la que hace parte, participa en el diseño, ejecución y evaluación del PEI (artículo 6).", false], ["C", "llevará a la práctica el PEI y aportará ideas para mejorar el proceso educativo a través de los órganos de la institución.", "El artículo 104 de la Ley 115 de 1994 define al educador como orientador del proceso de formación y señala que llevará a la práctica el Proyecto Educativo Institucional y mejorará permanentemente el proceso educativo mediante el aporte de ideas y sugerencias a través del consejo directivo, el consejo académico y las juntas educativas.", true]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Planeación curricular con Estándares Básicos de Competencias y DBA", "texto": "Usted inicia su primer año como docente de matemáticas de cuarto grado en una institución urbana de Bucaramanga. El coordinador académico le pide entregar, en tres semanas, la planeación del primer período articulada con los referentes de calidad del Ministerio de Educación Nacional. Al revisar el plan de área heredado, usted encuentra que el 80 % de las clases del período se dedican a algoritmos de suma, resta y multiplicación con números naturales, y que la única evaluación prevista es una prueba de operaciones. Sin embargo, el propósito escrito de la unidad dice: «resolver problemas de proporcionalidad en situaciones cotidianas». Una colega le sugiere, para ahorrar tiempo, copiar como plan de área la lista de Derechos Básicos de Aprendizaje (DBA) de cuarto grado.", "items": [{"id": "PD-101", "niv": 1, "e": "Para identificar qué estándares orientan la planeación de cuarto grado, usted debe", "f": "MEN (2006). Estándares Básicos de Competencias en Lenguaje, Matemáticas, Ciencias y Ciudadanas: introducción general (organización por grupos de grados).", "o": [["A", "consultar los estándares de primero a tercero, porque indican lo que debe dominarse antes de iniciar cuarto.", "Los estándares de 1.° a 3.° sirven para reconocer los aprendizajes previos, pero los que orientan la planeación de cuarto son los del grupo 4.° a 5.°, que fijan la meta de calidad para esos dos grados.", false], ["B", "consultar los estándares del grupo de cuarto a quinto y acordar con el área cómo distribuirlos entre ambos grados.", "Los Estándares Básicos de Competencias especifican el nivel de calidad esperado por grupos de grados (1.° a 3.°, 4.° a 5.°, 6.° a 7.°, 8.° a 9.° y 10.° a 11.°). Por eso la institución decide cómo se distribuyen y gradúan entre cuarto y quinto.", true], ["C", "consultar los estándares específicos de cuarto grado, que el MEN formula para cada grado de la básica primaria por separado.", "Los estándares no se formulan grado por grado sino por grupos de grados; son los DBA los que se presentan por grado. Buscar estándares exclusivos de cuarto parte de un error sobre la estructura del documento.", false]]}, {"id": "PD-102", "niv": 2, "e": "Ante la sugerencia de la colega sobre los DBA, usted le explica que", "f": "MEN (2016). Derechos Básicos de Aprendizaje V2, Matemáticas: presentación; Ley 115 de 1994, artículos 77 y 78.", "o": [["A", "los DBA rigen solo para transición y primero, de modo que en cuarto grado el plan se construye únicamente con los estándares.", "Hay DBA para varios grados de la básica y la media (por ejemplo, en lenguaje y matemáticas de primero a once), no solo para los primeros grados, de modo que también son un referente válido en cuarto.", false], ["B", "los DBA señalan aprendizajes estructurantes del grado, pero deben articularse con el enfoque, la metodología y el contexto que define el PEI.", "El MEN presenta los DBA como aprendizajes estructurantes por grado, coherentes con los lineamientos y los estándares, y advierte que por sí solos no constituyen una propuesta curricular: se articulan con los enfoques, metodologías y contextos de cada institución, en el marco del PEI y los planes de área y de aula.", true], ["C", "los DBA reemplazaron a los estándares, así que copiarlos como plan de área es suficiente para cumplir con los referentes del MEN y del PEI.", "Los DBA no derogan ni reemplazan los estándares; se construyeron en coherencia con ellos y con los lineamientos. Copiarlos como plan de área omite la metodología, la evaluación y el contexto que exige el PEI.", false]]}, {"id": "PD-103", "niv": 2, "e": "Al revisar el énfasis del plan heredado a la luz de los estándares de matemáticas, lo pertinente es", "f": "MEN (2006). Estándares Básicos de Competencias en Lenguaje, Matemáticas, Ciencias y Ciudadanas: Estándares de Matemáticas (los cinco tipos de pensamiento).", "o": [["A", "incluir situaciones de los pensamientos espacial, métrico, aleatorio y variacional, relacionándolas con el numérico.", "Los Estándares Básicos de Competencias en Matemáticas organizan el área en cinco tipos de pensamiento (numérico, espacial, métrico, aleatorio y variacional) que deben desarrollarse de manera articulada, junto con los procesos generales de la actividad matemática.", true], ["B", "dedicar un período completo a cada tipo de pensamiento, trabajándolos por separado para no mezclar procesos.", "Los estándares proponen relacionar los pensamientos entre sí y con los procesos generales (resolver problemas, modelar, comunicar, razonar), no tratarlos como bloques aislados que se suceden sin conexión.", false], ["C", "mantener el énfasis en operaciones, porque el pensamiento numérico es el que los estándares priorizan en la básica primaria.", "Los estándares no reducen la primaria al pensamiento numérico: proponen desarrollar cinco tipos de pensamiento en todos los grupos de grados. Dedicar el 80 % del tiempo a algoritmos deja por fuera la mayor parte de ellos.", false]]}, {"id": "PD-104", "niv": 3, "e": "Para que la evaluación de la unidad sea coherente con el propósito que está escrito en ella, usted debe", "f": "Wiggins, G. y McTighe, J. (2005). Understanding by Design (diseño inverso); MEN (2009). Documento No. 11: Fundamentaciones y orientaciones para la implementación del Decreto 1290 de 2009 (coherencia entre enseñanza y evaluación).", "o": [["A", "aumentar el número de ejercicios de la prueba actual para obtener más evidencia del desempeño de cada estudiante.", "Más ejercicios del mismo tipo producen más evidencia sobre los algoritmos, no sobre la resolución de problemas de proporcionalidad. El problema es de validez (qué se evalúa), no de cantidad.", false], ["B", "mantener la prueba de operaciones, pues dominar los algoritmos garantiza que el estudiante resolverá los problemas.", "Dominar algoritmos es necesario, pero no garantiza que el estudiante reconozca cuándo una situación es proporcional ni que modele el problema. La prueba de operaciones no aporta evidencia sobre el propósito declarado.", false], ["C", "plantear situaciones cotidianas en las que los estudiantes usen la proporcionalidad y expliquen su razonamiento.", "Si el propósito es resolver problemas de proporcionalidad en contexto, la evidencia válida debe exigir justamente eso. Planear desde los resultados esperados hacia la evidencia (diseño inverso, Wiggins y McTighe) y la coherencia entre enseñanza y evaluación que pide el Documento No. 11 del MEN llevan a esta decisión.", true]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Lineamientos curriculares, PEI y autonomía escolar", "texto": "En una institución educativa oficial de Pasto, el consejo académico revisa el plan de estudios de ciencias sociales de la básica secundaria. Usted, como representante del área, debe explicar a dos docentes recién nombrados cómo se relacionan los referentes nacionales con el currículo propio de la institución. Uno de ellos cree que el Ministerio de Educación Nacional entrega un programa único que todos los colegios deben aplicar; el otro piensa que cada docente puede organizar sus contenidos sin tener en cuenta el PEI. Además, un colega comenta en la reunión que, con la publicación de los nuevos lineamientos curriculares del MEN en 2026, el PEI de la institución «quedó sin vigencia».", "items": [{"id": "PD-105", "niv": 1, "e": "Al explicar qué son los lineamientos curriculares, usted precisa que son", "f": "MEN, Lineamientos curriculares (portal mineducacion.gov.co, Referentes de calidad); Ley 115 de 1994, artículo 78.", "o": [["A", "un programa nacional con contenidos y secuencias únicas que todas las instituciones del país deben aplicar sin cambios en sus aulas.", "Es la idea errada del primer docente. Los lineamientos no fijan un programa único: orientan la fundamentación y la planeación, y cada institución construye su plan de estudios en el marco de su autonomía.", false], ["B", "los documentos técnicos que definen las preguntas que se aplicarán en las pruebas Saber de cada área.", "Las pruebas Saber tienen sus propios marcos de referencia elaborados por el ICFES. Los lineamientos son referentes curriculares para las instituciones, no especificaciones de pruebas externas.", false], ["C", "orientaciones del MEN para fundamentar y planear las áreas obligatorias, que cada institución concreta en su currículo.", "El MEN define los lineamientos como orientaciones epistemológicas, pedagógicas y curriculares para apoyar la fundamentación y planeación de las áreas obligatorias y fundamentales del artículo 23 de la Ley 115; son referentes para elaborar el PEI y los planes de estudio.", true]]}, {"id": "PD-106", "niv": 1, "e": "Ante la pregunta de quién establece el plan de estudios de la institución, usted responde que lo hace", "f": "Ley 115 de 1994, artículos 77 y 78.", "o": [["A", "el establecimiento educativo, de acuerdo con su PEI y atendiendo los lineamientos generales definidos por el MEN.", "El artículo 78 de la Ley 115 dispone que el MEN diseña los lineamientos generales de los procesos curriculares y que los establecimientos, de conformidad con su PEI y atendiendo esos lineamientos, establecen su plan de estudios particular.", true], ["B", "cada docente de manera individual, porque la autonomía escolar se ejerce principalmente en el aula de clase.", "La autonomía del artículo 77 corresponde a las instituciones, dentro de los límites de la ley y del PEI, no a cada docente por separado. El plan de estudios es institucional.", false], ["C", "la secretaría de educación certificada, que lo expide para todas las instituciones oficiales de su jurisdicción.", "El parágrafo del artículo 77 de la Ley 115 asigna a las secretarías de educación la asesoría para el diseño y desarrollo del currículo, no la expedición del plan de estudios de cada institución.", false]]}, {"id": "PD-107", "niv": 3, "e": "Frente al comentario sobre los nuevos lineamientos curriculares de 2026, usted aclara que estos", "f": "MEN (2026). ABC de los Lineamientos Curriculares; Ley 115 de 1994, artículo 77.", "o": [["A", "sustituyen el PEI, por lo que la institución debe adoptarlos textualmente como su nuevo plan de estudios.", "El ABC de los lineamientos publicado por el MEN señala expresamente que no reemplazan los Proyectos Educativos Institucionales ni imponen un currículo único.", false], ["B", "orientan la transformación curricular sin reemplazar el PEI ni imponer un currículo único a las instituciones.", "Según el ABC de los Lineamientos Curriculares (MEN, 2026), estos no crean asignaturas, no eliminan áreas, no imponen un currículo único, no reemplazan los PEI ni limitan la autonomía de docentes e instituciones; orientan procesos de transformación curricular.", true], ["C", "aplican solo a las instituciones que los adopten de manera voluntaria, así que no tienen relación con el PEI vigente.", "Los lineamientos son referentes de calidad para todo el sistema y orientan la revisión curricular de las instituciones en el marco de su autonomía; no son un programa opcional desligado del PEI.", false]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Aprendizaje significativo (Ausubel) en la secuencia didáctica", "texto": "Usted es docente de ciencias naturales de séptimo grado en una institución de Ibagué que tiene huerta escolar. Va a iniciar una secuencia didáctica de tres semanas sobre las relaciones tróficas en los ecosistemas. En años anteriores observó que los estudiantes memorizaban las definiciones de productor, consumidor y descomponedor para la prueba, pero semanas después no lograban explicar qué pasaría en la huerta si desaparecieran las lombrices. Este año quiere planear la secuencia desde la teoría del aprendizaje significativo de David Ausubel. Un colega del área, en cambio, sostiene que las explicaciones del docente no sirven para lograr ese tipo de aprendizaje.", "items": [{"id": "PD-108", "niv": 1, "e": "Para iniciar la secuencia de manera coherente con el aprendizaje significativo, usted debe", "f": "Ausubel, D. P. (1976). Psicología educativa: un punto de vista cognoscitivo (aprendizaje significativo).", "o": [["A", "iniciar con la definición formal de cadena trófica, para que todos partan de la misma información.", "Presentar la definición sin conocer las ideas previas aumenta el riesgo de que los estudiantes la memoricen sin relacionarla con lo que ya saben, que es lo que el docente quiere evitar.", false], ["B", "aplicar una evaluación calificable sobre el tema, para registrar la primera nota del período.", "Explorar los saberes previos tiene un fin diagnóstico y formativo; convertirlo en nota del período desvirtúa su propósito y puede inhibir que los estudiantes expresen sus ideas reales.", false], ["C", "indagar qué saben y creen los estudiantes sobre cómo se alimentan los seres vivos de la huerta.", "Para Ausubel, el aprendizaje es significativo cuando la nueva información se relaciona de manera sustantiva y no arbitraria con conocimientos previos pertinentes del estudiante; por eso el punto de partida es identificar esos conocimientos.", true]]}, {"id": "PD-109", "niv": 3, "e": "Antes de presentar las cadenas tróficas, usted muestra un esquema general de cómo circula la energía en cualquier ecosistema y pide relacionarlo con la huerta. Según Ausubel, este recurso funciona como", "f": "Ausubel, D. P. (1976). Psicología educativa: un punto de vista cognoscitivo (organizadores previos).", "o": [["A", "un organizador previo, que sirve de puente entre lo que el estudiante ya sabe y el contenido nuevo.", "Ausubel propone los organizadores previos: materiales introductorios, más generales que el contenido que sigue, que proporcionan ideas de anclaje y sirven de puente cognitivo entre lo que el estudiante sabe y lo que va a aprender.", true], ["B", "un refuerzo positivo que aumenta la probabilidad de que la respuesta correcta de los estudiantes se repita.", "El refuerzo es un concepto del conductismo (condicionamiento operante) y se refiere a las consecuencias de una conducta, no a un esquema introductorio que organiza el contenido.", false], ["C", "un conflicto cognitivo que desequilibra los esquemas del estudiante para provocar la acomodación.", "El desequilibrio y la acomodación son conceptos de Piaget. El esquema general no busca contradecir las ideas del estudiante, sino ofrecer un marco que facilite relacionar el nuevo contenido.", false]]}, {"id": "PD-110", "niv": 3, "e": "Frente a la postura del colega sobre las explicaciones del docente, desde la teoría de Ausubel usted responde que", "f": "Ausubel, D. P. (1976). Psicología educativa: un punto de vista cognoscitivo (aprendizaje por recepción y por descubrimiento).", "o": [["A", "el colega tiene razón en parte, pues la exposición produce aprendizaje significativo si el estudiante memoriza literalmente lo explicado.", "La memorización literal y arbitraria es justamente lo que caracteriza el aprendizaje memorístico o mecánico, el polo opuesto del aprendizaje significativo.", false], ["B", "una exposición puede producirlo si el material es potencialmente significativo y se relaciona con saberes previos pertinentes.", "Para Ausubel, recibir la información ya elaborada no impide aprender significativamente: se requieren un material potencialmente significativo, ideas pertinentes en la estructura cognitiva del estudiante y su disposición a relacionarlas.", true], ["C", "el colega tiene razón, porque para Ausubel solo el aprendizaje por descubrimiento puede ser significativo.", "Ausubel distingue dos dimensiones: recepción–descubrimiento y significativo–memorístico. Ambas formas, recepción y descubrimiento, pueden ser significativas o memorísticas; él incluso defendió el valor del aprendizaje significativo por recepción.", false]]}, {"id": "PD-111", "niv": 2, "e": "En el cierre de la secuencia, la actividad más coherente con el propósito de lograr aprendizaje significativo es", "f": "Ausubel, D. P. (1976). Psicología educativa; MEN (2009). Documento No. 11: Fundamentaciones y orientaciones para la implementación del Decreto 1290 de 2009.", "o": [["A", "dictar un resumen de los conceptos principales para que los estudiantes lo copien en el cuaderno.", "El dictado concentra la actividad en el docente y no exige al estudiante relacionar ni aplicar los conceptos, por lo que no aporta evidencia de que el aprendizaje sea significativo.", false], ["B", "pedir que expliquen qué pasaría en la huerta si desaparecieran las lombrices y cómo cambió su idea inicial.", "Aplicar los conceptos a una situación nueva y contrastar la idea final con la inicial permite verificar que el estudiante relacionó el contenido con su estructura cognitiva, y no solo lo memorizó.", true], ["C", "realizar un concurso de preguntas rápidas sobre las definiciones vistas durante las tres semanas de la secuencia.", "Un concurso de definiciones evalúa sobre todo el recuerdo literal, que era precisamente el problema de los años anteriores; no muestra si el estudiante puede usar los conceptos.", false]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Desarrollo cognitivo según Piaget", "texto": "Usted es docente de una sede rural multigrado en una vereda de Boyacá y tiene a su cargo, entre otros, a seis niños de primer grado, de seis y siete años. Durante una actividad de matemáticas, vierte el agua de un vaso ancho y bajo en un vaso alto y delgado, delante de los niños. Varios afirman que ahora «hay más agua», porque «llega más arriba». Al día siguiente, durante una visita a una finca vecina, una niña que llamaba «perro» a todo animal de cuatro patas empieza a diferenciar perros, vacas y caballos, y explica a sus compañeros en qué se distinguen. Usted quiere interpretar estas situaciones desde la teoría de Jean Piaget para planear las próximas actividades.", "items": [{"id": "PD-112", "niv": 1, "e": "La respuesta de los niños sobre el agua en el vaso alto se interpreta, desde Piaget, como", "f": "Piaget, J. e Inhelder, B. (1969). Psicología del niño (etapas del desarrollo, conservación).", "o": [["A", "característica de la etapa de operaciones formales, en la que el razonamiento hipotético apenas comienza a aparecer.", "Las operaciones formales se ubican aproximadamente desde los 11 o 12 años y se caracterizan por el razonamiento abstracto e hipotético; no corresponden a niños de primer grado.", false], ["B", "un indicio de dificultad de aprendizaje que requiere remitir de inmediato a los niños a valoración especializada.", "La ausencia de conservación a los seis o siete años es esperable según Piaget; interpretarla como dificultad de aprendizaje lleva a remisiones innecesarias.", false], ["C", "característica de la etapa preoperacional, en la que el niño suele centrarse en una sola dimensión y aún no conserva la cantidad.", "En la etapa preoperacional (aproximadamente de 2 a 7 años), el pensamiento tiende a centrarse en un solo aspecto perceptible (la altura) y todavía no se ha construido la conservación de la cantidad, que suele aparecer con las operaciones concretas.", true]]}, {"id": "PD-113", "niv": 2, "e": "Para favorecer la construcción de la noción de conservación, desde la perspectiva de Piaget lo más pertinente es", "f": "Piaget, J. e Inhelder, B. (1969). Psicología del niño; Piaget, J. (1970). La epistemología genética.", "o": [["A", "proponer que trasvasen líquidos entre recipientes y preguntarles por qué creen que la cantidad cambia o no.", "La teoría de Piaget concibe al niño como constructor activo de su conocimiento: manipular, comparar y explicar sus anticipaciones genera las condiciones para reorganizar sus esquemas.", true], ["B", "explicar la respuesta correcta con claridad y pedir a los niños que la repitan varias veces hasta memorizarla.", "Para Piaget el conocimiento lógico-matemático no se transmite verbalmente: el niño lo construye actuando sobre los objetos y coordinando sus acciones. Repetir la respuesta no transforma el esquema.", false], ["C", "posponer las actividades con cantidades hasta que todos los niños cumplan ocho años de edad.", "Las edades de las etapas son aproximadas y el desarrollo se favorece con experiencias; esperar pasivamente priva a los niños de las interacciones con el medio que impulsan la construcción.", false]]}, {"id": "PD-114", "niv": 2, "e": "En términos de Piaget, el cambio en la forma en que la niña clasifica a los animales es un ejemplo de", "f": "Piaget, J. (1970). La epistemología genética (asimilación, acomodación, equilibración).", "o": [["A", "asimilación, porque incorpora los nuevos animales al esquema que ya tenía sin modificarlo.", "En la asimilación la nueva experiencia se integra al esquema existente sin cambiarlo (seguir llamando «perro» a la vaca). Aquí la niña cambia su esquema, que es lo contrario.", false], ["B", "andamiaje, porque un adulto ajusta temporalmente la ayuda que le brinda hasta que ella logra actuar sola.", "El andamiaje es un concepto asociado a Wood, Bruner y Ross y a la ZDP de Vygotsky; el caso no describe una ayuda graduada de un adulto, sino una reorganización del esquema de la niña.", false], ["C", "acomodación, porque modifica su esquema para ajustarlo a las características de la nueva experiencia.", "Para Piaget, la acomodación es la modificación de los esquemas existentes cuando no basta con asimilar la experiencia; diferenciar perros, vacas y caballos implica crear y ajustar categorías.", true]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Zona de desarrollo próximo (Vygotsky) y andamiaje", "texto": "Usted orienta lengua castellana en tercer grado en una institución de Cartagena. En la evaluación diagnóstica de comprensión lectora encuentra que la mayoría localiza información explícita en textos cortos, pero pocos infieren el propósito del autor. Andrés, por ejemplo, identifica sin ayuda los personajes y lugares de un cuento, pero no logra inferir por qué el autor lo escribió, ni siquiera cuando usted le hace preguntas guía. Otros estudiantes sí lo logran cuando trabajan con un compañero que lee con mayor fluidez o cuando usted los orienta paso a paso. Usted decide planear las próximas clases a partir de la teoría sociocultural de Lev Vygotsky.", "items": [{"id": "PD-115", "niv": 1, "e": "Según Vygotsky, la zona de desarrollo próximo de un estudiante es", "f": "Vygotsky, L. S. (1978/2009). El desarrollo de los procesos psicológicos superiores, cap. 6.", "o": [["A", "el nivel máximo de desarrollo que permite la edad del estudiante según la etapa en que se encuentra.", "La idea de un techo fijado por la etapa de edad no corresponde a la ZDP; Vygotsky subraya que la interacción social y la mediación hacen avanzar el desarrollo.", false], ["B", "la distancia entre lo que logra resolver solo y lo que logra con la guía de un adulto o de un compañero más capaz.", "Vygotsky definió la ZDP como la distancia entre el nivel de desarrollo real, determinado por la resolución independiente de problemas, y el nivel de desarrollo potencial, determinado por la resolución con la guía de un adulto o en colaboración con un compañero más capaz.", true], ["C", "el conjunto de contenidos que el estudiante ya domina y puede aplicar sin ayuda de otros.", "Lo que el estudiante ya resuelve solo corresponde a su nivel de desarrollo real, que es solo el punto de partida de la zona de desarrollo próximo.", false]]}, {"id": "PD-116", "niv": 2, "e": "Para aprovechar la zona de desarrollo próximo en las actividades de inferencia, una estrategia coherente es", "f": "Vygotsky, L. S. (1978/2009). El desarrollo de los procesos psicológicos superiores, cap. 6.", "o": [["A", "formar parejas en las que un compañero con mayor dominio acompañe la lectura y ambos discutan sus inferencias.", "La interacción con un compañero más capaz es una de las formas de mediación que Vygotsky reconoce para que el estudiante resuelva lo que aún no logra solo; la discusión hace visible el razonamiento.", true], ["B", "asignar lectura individual silenciosa, para que cada estudiante avance a su propio ritmo sin interferencias de otros.", "La lectura individual puede ser útil en otros momentos, pero no aprovecha la mediación social que define la ZDP, que es lo que plantea el enunciado.", false], ["C", "agrupar a los estudiantes con el mismo nivel de lectura, para que ninguno se sienta en desventaja.", "Agrupar solo por niveles iguales elimina al compañero más capaz que, según Vygotsky, puede mediar el paso del nivel real al potencial.", false]]}, {"id": "PD-117", "niv": 2, "e": "Usted primero modela en voz alta cómo inferir el propósito del autor, luego lo hacen juntos con preguntas guía y, al final, los estudiantes lo hacen solos. Esta progresión corresponde a", "f": "Wood, D., Bruner, J. y Ross, G. (1976). The role of tutoring in problem solving; Vygotsky (1978/2009).", "o": [["A", "un aprendizaje por ensayo y error, en el que el estudiante descubre la estrategia sin intervención del docente.", "En la secuencia descrita el docente interviene de manera deliberada (modela y guía); no se deja al estudiante descubrir la estrategia por sí solo.", false], ["B", "una instrucción programada, en la que cada respuesta correcta se premia para fijar la conducta deseada.", "La instrucción programada, de raíz conductista, se basa en pasos pequeños y refuerzo de respuestas; la progresión del caso se centra en transferir el control de la tarea, no en premiar respuestas.", false], ["C", "un andamiaje, en el que la ayuda se ajusta y se retira gradualmente a medida que el estudiante gana autonomía.", "Wood, Bruner y Ross (1976) describieron el andamiaje como un apoyo temporal y ajustado que el experto va retirando cuando el aprendiz asume mayor control de la tarea; la secuencia modelado–práctica guiada–práctica independiente lo concreta.", true]]}, {"id": "PD-118", "niv": 3, "e": "Considerando lo que Andrés logra solo y con ayuda, la tarea más pertinente para él en este momento es", "f": "Vygotsky, L. S. (1978/2009). El desarrollo de los procesos psicológicos superiores, cap. 6.", "o": [["A", "inferencias sencillas sobre textos breves, con apoyo cercano, un paso más allá de lo que ya resuelve solo.", "La enseñanza eficaz, según Vygotsky, se dirige a la ZDP: tareas que el estudiante no resuelve solo pero sí con ayuda. Para Andrés, inferir el propósito del autor está aún fuera de esa zona; las inferencias sencillas con apoyo sí están dentro de ella.", true], ["B", "seguir practicando la localización de información explícita hasta que la domine por completo.", "Andrés ya localiza información explícita sin ayuda: es su nivel real. Una tarea que ya resuelve solo no lo ubica en su zona de desarrollo próximo.", false], ["C", "la misma tarea de inferir el propósito del autor, sin ninguna ayuda, para medir con precisión cuál es su verdadero nivel.", "Ya se sabe que no logra esa tarea ni siquiera con preguntas guía; repetirla sin ayuda solo confirma lo conocido y no lo hace avanzar.", false]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Evaluación formativa, sumativa y retroalimentación (Decreto 1290 de 2009)", "texto": "Usted enseña matemáticas en octavo grado en una institución de Medellín. Al final de cada clase de la unidad de ecuaciones lineales, pide a los estudiantes resolver en una hoja un ejercicio corto, sin nota, y con esas respuestas decide qué retomar en la clase siguiente. Al revisar la hoja de Valentina, observa que planteó bien la ecuación, pero al despejar la incógnita no cambió el signo de un término al pasarlo al otro lado de la igualdad, error que repite en dos ejercicios. Al terminar el período, usted debe asignar la valoración de la unidad según el sistema institucional de evaluación de los estudiantes (SIEE), cuyos criterios se socializaron al comenzar el año.", "items": [{"id": "PD-119", "niv": 1, "e": "La práctica de las hojas de salida al final de cada clase corresponde principalmente a una evaluación", "f": "Black, P. y Wiliam, D. (1998). Inside the black box: raising standards through classroom assessment; Decreto 1290 de 2009, artículo 3.", "o": [["A", "diagnóstica, porque solo se aplica antes de iniciar una unidad para identificar los saberes previos.", "La evaluación diagnóstica se aplica típicamente al inicio de un proceso; aquí las hojas se usan en cada clase a lo largo de la unidad para ajustar sobre la marcha.", false], ["B", "formativa, porque usa la información durante el proceso para ajustar la enseñanza y orientar al estudiante.", "La evaluación formativa recoge evidencia durante el aprendizaje y la usa para adaptar la enseñanza y orientar al estudiante (Black y Wiliam, 1998). Decidir qué retomar en la clase siguiente es un uso formativo.", true], ["C", "sumativa, porque registra el resultado de cada clase para promediarlo al terminar el período.", "Las hojas no tienen nota ni se promedian; su función no es certificar un resultado final sino informar las decisiones de enseñanza mientras el proceso ocurre.", false]]}, {"id": "PD-120", "niv": 3, "e": "Usar las hojas de salida para reorganizar la clase siguiente es coherente con el propósito de la evaluación institucional que el Decreto 1290 de 2009 describe como", "f": "Decreto 1290 de 2009, artículo 3 (compilado en el Decreto 1075 de 2015).", "o": [["A", "determinar la promoción de los estudiantes al finalizar el año escolar.", "Determinar la promoción es otro propósito del artículo 3, pero corresponde a la decisión de final de año, no al ajuste de la clase siguiente que describe el enunciado.", false], ["B", "clasificar a los estudiantes según su rendimiento académico para conformar grupos fijos que se mantengan durante el año.", "El Decreto 1290 no incluye entre los propósitos de la evaluación clasificar estudiantes en grupos fijos; su orientación es identificar ritmos y apoyar debilidades y desempeños superiores.", false], ["C", "proporcionar información básica para consolidar o reorientar los procesos educativos del estudiante.", "El artículo 3, numeral 2, del Decreto 1290 de 2009 establece como propósito de la evaluación de los estudiantes proporcionar información básica para consolidar o reorientar los procesos educativos relacionados con su desarrollo integral.", true]]}, {"id": "PD-121", "niv": 2, "e": "Para retroalimentar el error de Valentina de manera que le ayude a mejorar, usted debe", "f": "Hattie, J. y Timperley, H. (2007). The power of feedback; Decreto 1290 de 2009, artículo 3.", "o": [["A", "asignar una valoración baja en la hoja, para que el resultado la motive a esforzarse en la siguiente clase.", "Además de contradecir el carácter sin nota de la actividad, una calificación sola no indica qué debe corregir ni cómo hacerlo, que es la función de la retroalimentación formativa.", false], ["B", "señalarle el paso del despeje donde está el error, explicarle por qué y proponerle ejercicios similares.", "La retroalimentación efectiva es específica, se centra en la tarea y el proceso, y ofrece una vía de mejora (Hattie y Timperley, 2007). Señalar el paso, explicar la regla y dar oportunidad de practicar cumple esas condiciones.", true], ["C", "escribir «revisar» junto a los ejercicios para que ella identifique por sí misma en qué se equivocó.", "Una indicación genérica como «revisar» no informa qué está mal ni cómo corregirlo; la estudiante puede no reconocer el error, ya que lo repite de manera sistemática.", false]]}, {"id": "PD-122", "niv": 3, "e": "De los siguientes comentarios para la hoja de Valentina, el que aporta una retroalimentación más útil para el aprendizaje es", "f": "Hattie, J. y Timperley, H. (2007). The power of feedback (niveles de la retroalimentación).", "o": [["A", "«Planteaste bien la ecuación; al pasar el 5 al otro lado no cambiaste su signo: revisa ese paso en los ejercicios 3 y 5».", "Reconoce lo logrado, describe el error en el proceso y orienta la acción siguiente. Según Hattie y Timperley (2007), la retroalimentación sobre la tarea y el proceso es más útil que la dirigida a la persona.", true], ["B", "«Tienes dos de tres ejercicios incorrectos; antes de la próxima clase estudia de nuevo todo el tema de ecuaciones lineales».", "Informa el resultado, pero no identifica la causa del error ni la acción concreta; «estudiar más» no le dice a la estudiante qué paso debe revisar.", false], ["C", "«¡Eres muy buena en matemáticas, sigue así!», porque el elogio fortalece la confianza y la motivación de la estudiante.", "El elogio general a la persona puede ser bien intencionado, pero no da información sobre el error ni sobre cómo corregirlo; la investigación sobre retroalimentación lo identifica como el tipo menos informativo.", false]]}, {"id": "PD-123", "niv": 3, "e": "Al asignar la valoración de la unidad, la decisión más coherente con un enfoque de evaluación formativa es", "f": "Decreto 1290 de 2009, artículos 4 y 12; MEN (2009). Documento No. 11: Fundamentaciones y orientaciones para la implementación del Decreto 1290 de 2009.", "o": [["A", "promediar las hojas de salida de todas las clases, incluidas las de los primeros días de la unidad.", "Las hojas se aplicaron sin nota y con fin formativo; convertirlas después en calificación cambia las reglas acordadas y penaliza los errores propios del inicio del aprendizaje.", false], ["B", "valorar con los criterios del SIEE socializados al inicio, considerando el avance logrado tras la retroalimentación.", "El artículo 12 del Decreto 1290 reconoce al estudiante el derecho a conocer desde el inicio del año los criterios, procedimientos e instrumentos de evaluación. Valorar con esos criterios y considerar el avance tras la retroalimentación articula lo sumativo con lo formativo.", true], ["C", "basar la valoración en un único examen final escrito, porque es la evidencia más objetiva de lo aprendido en la unidad.", "Un solo examen ofrece una evidencia limitada y desconoce el proceso; el Decreto 1290 promueve una valoración integral del desempeño, con estrategias variadas definidas en el SIEE.", false]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Instrumentos de evaluación: rúbricas", "texto": "Usted es docente de lengua castellana de décimo grado en una institución de Cali. Sus estudiantes deben escribir un ensayo argumentativo sobre el uso del celular en el colegio. El semestre anterior, varios estudiantes reclamaron porque no entendían por qué habían obtenido 3,4 o 4,1 en un texto similar, y los padres pidieron mayor claridad en los criterios. Usted decide construir una rúbrica con cuatro criterios: tesis, argumentos y evidencias, organización del texto y uso de la lengua. Al revisar un borrador de la rúbrica con un colega, este observa que en el nivel superior del criterio «argumentos y evidencias» usted escribió solamente: «Argumenta bien».", "items": [{"id": "PD-124", "niv": 1, "e": "Al explicar a los estudiantes qué es una rúbrica, usted la describe como", "f": "MEN, Decreto 1290 de 2009, artículo 4 (estrategias de valoración integral); literatura sobre evaluación auténtica y rúbricas.", "o": [["A", "una lista de chequeo que indica únicamente si cada elemento solicitado está presente o ausente en el ensayo.", "Eso describe una lista de cotejo, que registra presencia o ausencia de rasgos; no describe grados de calidad en cada criterio.", false], ["B", "una escala numérica que asigna puntos a cada criterio sin describir qué caracteriza cada uno de los niveles.", "Una escala de puntos sin descriptores no permite al estudiante comprender qué diferencia un nivel de otro, que es justamente la queja que el caso busca resolver.", false], ["C", "una matriz que describe, para cada criterio, distintos niveles de desempeño con descriptores observables.", "Una rúbrica combina criterios de evaluación con niveles de desempeño y descriptores que explican qué caracteriza cada nivel; por eso hace explícitas las expectativas y orienta tanto la valoración como la mejora.", true]]}, {"id": "PD-125", "niv": 2, "e": "Si usted quiere que cada estudiante sepa en qué aspecto específico de su ensayo debe mejorar, le conviene usar", "f": "Literatura sobre evaluación del aprendizaje: rúbricas analíticas y holísticas; Decreto 1290 de 2009, artículo 3.", "o": [["A", "una rúbrica analítica, porque valora cada criterio por separado y muestra dónde debe mejorar el estudiante.", "La rúbrica analítica descompone el desempeño en criterios con niveles propios; así el estudiante identifica, por ejemplo, que su tesis es clara pero sus evidencias son insuficientes.", true], ["B", "una rúbrica holística, porque ofrece una sola valoración global del ensayo y es más rápida de aplicar.", "La rúbrica holística da una apreciación global útil para juicios rápidos, pero no muestra el desempeño por separado en cada criterio, que es lo que se busca.", false], ["C", "una lista de cotejo, porque permite describir con detalle los grados de calidad alcanzados en cada criterio.", "La lista de cotejo registra si un rasgo está o no presente; no describe grados de calidad, por lo que la justificación que se ofrece es incorrecta.", false]]}, {"id": "PD-126", "niv": 2, "e": "Para que la rúbrica cumpla su función formativa y responda a la inquietud de los padres, lo adecuado es", "f": "Decreto 1290 de 2009, artículo 12, numeral 2.", "o": [["A", "socializarla al presentar la tarea y usarla con los estudiantes para analizar un ensayo de ejemplo.", "El artículo 12 del Decreto 1290 reconoce al estudiante el derecho a conocer los criterios, procedimientos e instrumentos de evaluación. Compartir la rúbrica desde el inicio y practicar con ella hace visibles las expectativas antes de escribir.", true], ["B", "reservarla solo para el docente, para evitar que los estudiantes escriban únicamente para cumplir con los criterios.", "Ocultar los criterios contradice el derecho del estudiante a conocer los instrumentos de evaluación y mantiene la incertidumbre que originó los reclamos.", false], ["C", "entregarla junto con la nota final, para que los estudiantes comprendan por qué obtuvieron su calificación.", "Entregarla al final explica la nota, pero llega tarde: el estudiante ya no puede usar los criterios para orientar su escritura, que es su principal valor formativo.", false]]}, {"id": "PD-127", "niv": 3, "e": "Para mejorar el descriptor «Argumenta bien» del nivel superior, una redacción adecuada sería", "f": "Literatura sobre diseño de rúbricas (descriptores observables y alineados con el criterio).", "o": [["A", "«Demuestra un excelente esfuerzo y dedicación durante todo el proceso de elaboración del ensayo argumentativo».", "El esfuerzo es valioso, pero no es observable en el texto ni describe la calidad de la argumentación, que es el criterio que se está evaluando.", false], ["B", "«Sostiene una tesis explícita con al menos dos argumentos apoyados en evidencias pertinentes».", "Un buen descriptor es específico, observable y está alineado con el criterio: indica qué debe aparecer en el texto (tesis, argumentos, evidencias) y permite distinguir este nivel de los demás.", true], ["C", "«Escribe un ensayo de mínimo dos páginas, con buena presentación, letra legible y sin tachones ni enmendaduras».", "Describe rasgos de extensión y presentación, no de argumentación; un texto largo y limpio puede tener argumentos débiles.", false]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Autoevaluación y coevaluación (Decreto 1290 de 2009)", "texto": "En sexto grado de una institución de Villavicencio, usted orienta ciencias sociales. Los estudiantes trabajan en grupos de cuatro durante tres semanas para elaborar una maqueta y una exposición sobre las regiones naturales de Colombia. Usted quiere que la evaluación incluya la mirada de los propios estudiantes, por lo que planea dos momentos: uno en el que cada estudiante valore su propio trabajo y otro en el que los integrantes de cada grupo valoren el aporte de sus compañeros, con criterios acordados previamente. Un colega opina que eso es opcional y que «el único que sabe evaluar es el profesor». Al revisar los formatos, usted encuentra que un grupo asignó 1,0 a uno de sus integrantes sin ninguna explicación.", "items": [{"id": "PD-128", "niv": 1, "e": "El momento en que los integrantes de cada grupo valoran el aporte de sus compañeros corresponde a una", "f": "MEN, Manual de implementación Escuela Nueva (evaluación: autoevaluación, coevaluación y heteroevaluación).", "o": [["A", "autoevaluación, porque el grupo evalúa el trabajo que él mismo realizó en las tres semanas.", "La autoevaluación es la valoración que cada estudiante hace de su propio desempeño; aquí cada integrante valora el aporte de los demás, no el suyo.", false], ["B", "heteroevaluación, porque es el docente quien consolida y registra la valoración final del trabajo.", "Que el docente consolide la nota no cambia quién valora en ese momento: la heteroevaluación es la que realiza un agente de distinto rol, típicamente el docente; cuando valoran los pares se habla de coevaluación.", false], ["C", "coevaluación, porque los pares se valoran entre sí con criterios acordados.", "La coevaluación es la valoración que hacen los compañeros del trabajo o desempeño de sus pares; el modelo Escuela Nueva del MEN, por ejemplo, la incluye junto con la autoevaluación y la heteroevaluación.", true]]}, {"id": "PD-129", "niv": 1, "e": "Ante la opinión del colega, usted le aclara que, según el Decreto 1290 de 2009,", "f": "Decreto 1290 de 2009, artículo 4, numeral 5.", "o": [["A", "los procesos de autoevaluación de los estudiantes son uno de los elementos que debe contener el SIEE.", "El artículo 4 del Decreto 1290 de 2009 enumera los elementos del sistema institucional de evaluación; su numeral 5 incluye los procesos de autoevaluación de los estudiantes. No es una decisión opcional de cada docente.", true], ["B", "la norma impide que la autoevaluación tenga algún peso en la valoración final del período académico.", "El decreto no prohíbe que la autoevaluación incida en la valoración; deja en manos de cada institución definir en su SIEE cómo se integra.", false], ["C", "la autoevaluación solo está prevista para la educación media, por la madurez que exige a los estudiantes.", "El Decreto 1290 regula la evaluación en la básica y la media sin limitar la autoevaluación a la media; la incluye como elemento del SIEE para todos los estudiantes.", false]]}, {"id": "PD-130", "niv": 2, "e": "Para que la autoevaluación sea formativa y no se reduzca a que cada estudiante se asigne una nota, lo más adecuado es", "f": "Decreto 1290 de 2009, artículos 3 y 4; MEN (2009). Documento No. 11: Fundamentaciones y orientaciones para la implementación del Decreto 1290 de 2009.", "o": [["A", "reemplazar la nota del estudiante por la del docente cada vez que la autoevaluación resulte más alta.", "Anular la autoevaluación cuando no coincide envía el mensaje de que la opinión del estudiante no cuenta; lo formativo es contrastar ambas valoraciones con evidencias.", false], ["B", "permitir que cada estudiante se asigne libremente la nota que considere justa, sin ninguna intervención del docente.", "Sin criterios ni evidencias, la autoevaluación se reduce a una cifra y no promueve la reflexión sobre lo aprendido, que es su sentido formativo.", false], ["C", "orientarla con criterios claros y preguntas que pidan evidencias de lo logrado y de lo que falta por mejorar.", "Una autoevaluación formativa se apoya en criterios conocidos y exige justificar con evidencias; así desarrolla la capacidad del estudiante para regular su propio aprendizaje.", true]]}, {"id": "PD-131", "niv": 3, "e": "Frente al grupo que asignó 1,0 a un compañero sin explicación, lo más adecuado es", "f": "Decreto 1290 de 2009, artículo 12 (derecho a ser evaluado de manera integral); MEN (2009). Documento No. 11: Fundamentaciones y orientaciones para la implementación del Decreto 1290 de 2009 (evaluación incluyente).", "o": [["A", "registrar la nota tal como la asignó el grupo, para respetar la autonomía de los estudiantes en el proceso.", "Respetar la participación de los estudiantes no significa aceptar valoraciones sin sustento; el docente sigue siendo responsable de que la evaluación sea justa y basada en evidencias.", false], ["B", "dialogar con el grupo para contrastar esa valoración con los criterios y las evidencias del trabajo.", "La coevaluación debe sustentarse en criterios y evidencias. Revisarla con el grupo protege al estudiante de una valoración arbitraria y, al mismo tiempo, enseña a valorar el trabajo ajeno con argumentos.", true], ["C", "anular la coevaluación de todo el curso, porque los estudiantes de sexto no son objetivos al valorarse.", "Generalizar a todo el curso un problema de un grupo elimina una estrategia formativa en lugar de corregir su aplicación; la objetividad se aprende con criterios y acompañamiento.", false]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Uso pedagógico de los resultados de las pruebas Saber", "texto": "La institución educativa en la que usted trabaja, en Montería, recibió el informe de resultados de la prueba Saber de matemáticas de quinto grado. Según el informe, el 48 % de los estudiantes quedó en el nivel de desempeño insuficiente, cuatro puntos porcentuales más que el año anterior. En el análisis por componentes, el aleatorio (recolección, organización e interpretación de datos) presenta el mayor porcentaje de respuestas incorrectas. El rector convoca a los docentes de primaria a una jornada para analizar el informe. En la reunión, un colega concluye que «los profesores de quinto de este año enseñaron peor que los del año pasado», y otro propone no inscribir en la próxima aplicación a los estudiantes con bajo rendimiento.", "items": [{"id": "PD-132", "niv": 1, "e": "El uso más apropiado de este informe en la institución es tomarlo como", "f": "Decreto 1290 de 2009, artículo 1 y disposiciones sobre responsabilidades del Ministerio de Educación Nacional; MEN (2009). Documento No. 11: Fundamentaciones y orientaciones para la implementación del Decreto 1290 de 2009.", "o": [["A", "una calificación individual que debe registrarse en el boletín de cada estudiante que presentó la prueba.", "Los resultados de las pruebas externas no reemplazan la evaluación institucional del aprendizaje ni se convierten en notas del boletín; la valoración del estudiante se rige por el SIEE.", false], ["B", "un insumo para identificar fortalezas y debilidades, y orientar el plan de mejoramiento y las prácticas de aula.", "El Decreto 1290 de 2009 prevé que el MEN publique los resultados de las pruebas externas como insumo para los sistemas institucionales de evaluación y el mejoramiento de la calidad; su valor está en orientar decisiones pedagógicas.", true], ["C", "un criterio para decidir qué docentes deben ser reasignados a otros grados durante el año siguiente.", "Un resultado agregado de una cohorte no permite atribuir causalidad a un docente; usarlo para reasignar personal desvía el propósito pedagógico del análisis.", false]]}, {"id": "PD-133", "niv": 2, "e": "Ante el bajo desempeño en el componente aleatorio, la acción pedagógica más pertinente es", "f": "MEN (2006). Estándares Básicos de Competencias en Matemáticas (pensamiento aleatorio); MEN, Guía 34 (plan de mejoramiento institucional).", "o": [["A", "concentrar el refuerzo solo en los estudiantes de quinto grado, porque fueron quienes presentaron la prueba.", "Los estudiantes evaluados ya avanzan de grado; el desempeño de quinto refleja el trabajo acumulado desde primero, por lo que la mejora debe involucrar a toda la primaria.", false], ["B", "dedicar las últimas semanas antes de la próxima aplicación a resolver simulacros con preguntas similares a las de la prueba.", "Practicar el formato puede familiarizar a los estudiantes con la prueba, pero no corrige la causa: cómo y cuánto se enseña el componente a lo largo de la primaria.", false], ["C", "revisar cómo se aborda ese componente en el plan de área de primero a quinto y fortalecer el trabajo con datos reales.", "Los estándares se organizan por grupos de grados y el pensamiento aleatorio se desarrolla de forma progresiva; revisar el plan de área en todos los grados y crear situaciones de recolección e interpretación de datos ataca la causa curricular.", true]]}, {"id": "PD-134", "niv": 3, "e": "Frente a la conclusión del colega sobre los docentes de quinto, usted argumenta que", "f": "Decreto 1290 de 2009, artículo 1 (ámbitos de evaluación); MEN (2009). Documento No. 11: Fundamentaciones y orientaciones para la implementación del Decreto 1290 de 2009 (uso de resultados de pruebas externas).", "o": [["A", "ese dato no sostiene la conclusión, pues compara cohortes distintas y debe analizarse junto con otras evidencias.", "Los resultados de dos años corresponden a grupos de estudiantes diferentes y reflejan factores escolares y extraescolares acumulados; una interpretación responsable los triangula con evaluaciones internas y otras evidencias antes de concluir.", true], ["B", "la conclusión es válida solo si la diferencia entre ambos años supera diez puntos porcentuales.", "Fijar un umbral arbitrario no resuelve el problema de fondo: aun con diferencias grandes, comparar dos cohortes distintas no permite atribuir el cambio a los docentes de un grado.", false], ["C", "la conclusión es válida, porque la prueba es estandarizada y mide directamente la calidad de cada docente.", "Que una prueba sea estandarizada permite comparar resultados, pero no aísla el efecto de un docente: el desempeño depende de muchos factores y del recorrido de toda la cohorte.", false]]}, {"id": "PD-135", "niv": 1, "e": "Frente a la propuesta de no inscribir a los estudiantes con bajo rendimiento, usted advierte que, según la normativa de evaluación de los estudiantes,", "f": "Decreto 1290 de 2009, artículo 11, numeral 9.", "o": [["A", "la institución no puede excluir de las pruebas censales del ICFES a ningún estudiante matriculado en los grados evaluados.", "El artículo 11, numeral 9, del Decreto 1290 de 2009 establece como responsabilidad del establecimiento presentar a las pruebas censales del ICFES a la totalidad de los estudiantes matriculados en los grados evaluados.", true], ["B", "la medida es válida si se cuenta con la autorización escrita de los padres de los estudiantes excluidos.", "La autorización de los padres no habilita a la institución para incumplir la obligación de presentar a todos los matriculados en los grados evaluados.", false], ["C", "la medida es aceptable siempre que esos estudiantes presenten en la institución una prueba interna equivalente a la externa.", "Una prueba interna no sustituye la evaluación externa censal ni exime a la institución de presentar a todos sus estudiantes; además, excluirlos distorsiona los resultados.", false]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Proyectos pedagógicos transversales (Ley 115 de 1994, art. 14)", "texto": "En una institución de Neiva, el consejo académico revisa cómo se cumplen las enseñanzas obligatorias del artículo 14 de la Ley 115 de 1994. Usted coordina el equipo del proyecto ambiental y el de educación para la sexualidad. En la reunión, el rector propone crear una asignatura de «Educación ambiental» con una hora semanal en todos los grados. Otra docente sugiere que la educación para la sexualidad se resuelva con una charla anual de una entidad de salud. El equipo debe presentar una propuesta para el próximo año, teniendo en cuenta que el río que abastece al municipio presenta problemas de contaminación y que en el último año aumentaron los casos de embarazo adolescente en la institución.", "items": [{"id": "PD-136", "niv": 1, "e": "Sobre la propuesta del rector, usted aporta que, según la Ley 115 de 1994, la educación ambiental", "f": "Ley 115 de 1994, artículo 14, literal c) y parágrafo 1.", "o": [["A", "es obligatoria solo en la educación media, por lo que la asignatura no se requeriría en preescolar ni en básica.", "El artículo 14 establece estas enseñanzas como obligatorias en los niveles de preescolar, básica y media, no solo en la media.", false], ["B", "no exige asignatura específica y debe incorporarse al currículo a través de todo el plan de estudios.", "Según el parágrafo 1 del artículo 14 de la Ley 115, el estudio de estos temas, salvo los literales a) y b), no exige asignatura específica; esta formación debe incorporarse al currículo y desarrollarse a través de todo el plan de estudios.", true], ["C", "exige una asignatura específica con una intensidad mínima de una hora semanal en todos los grados.", "El parágrafo 1 del artículo 14 dispone lo contrario: salvo los literales a) y b), estas enseñanzas no exigen asignatura específica ni fijan una intensidad mínima.", false]]}, {"id": "PD-137", "niv": 2, "e": "Respecto a la educación para la sexualidad, la reglamentación establece que estas enseñanzas se desarrollan mediante", "f": "Decreto 1860 de 1994, artículo 36 (compilado en el Decreto 1075 de 2015); Ley 115 de 1994, artículo 14, literal e).", "o": [["A", "talleres extracurriculares voluntarios, realizados fuera de la jornada escolar para no afectar el plan de estudios.", "Un taller voluntario por fuera de la jornada no garantiza la formación obligatoria del artículo 14 ni está integrado al plan de estudios, como lo exige el Decreto 1860.", false], ["B", "charlas periódicas de entidades externas especializadas, que reemplazan el trabajo pedagógico del aula.", "El apoyo de entidades de salud puede complementar, pero la norma no prevé que una charla sustituya la formación, que debe estar dentro del plan de estudios.", false], ["C", "proyectos pedagógicos dentro del plan de estudios, que ejerciten a los estudiantes en problemas de su entorno.",
