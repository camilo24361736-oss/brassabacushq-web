{"id": "RC-181", "niv": 2, "e": "La fluidez lectora de Pedro en la primera medición fue de", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: razones y conversión de unidades de tiempo.", "o": [["A", "90 ppm.", "Redondea el tiempo a 2 minutos antes de dividir (180 ÷ 2); el tiempo exacto es 1,8 minutos.", false], ["B", "100 ppm.", "1 minuto 48 segundos = 60 + 48 = 108 segundos = 108 ÷ 60 = 1,8 minutos. Fluidez: 180 ÷ 1,8 = 100 ppm.", true], ["C", "121,6 ppm.", "Escribe 1 minuto 48 segundos como 1,48 minutos (180 ÷ 1,48 ≈ 121,6); los segundos deben dividirse entre 60.", false]]}, {"id": "RC-182", "niv": 1, "e": "Para cumplir exactamente la meta de 90 ppm, un estudiante debe leer el texto de 180 palabras en un tiempo de", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: razones y tasas.", "o": [["A", "1 min 30 s.", "Interpreta 90 ppm como 90 segundos; la meta es una razón de palabras por minuto, que da 180 ÷ 90 = 2 minutos.", false], ["B", "2 min.", "Tiempo = palabras ÷ ritmo = 180 ÷ 90 = 2 minutos.", true], ["C", "2 min 15 s.", "Corresponde al tiempo de Luisa en la primera medición, que equivale a 80 ppm, por debajo de la meta.", false]]}, {"id": "RC-183", "niv": 3, "e": "Al comparar el progreso de Luisa y Pedro durante el año, la afirmación correcta es que", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: comparación entre cambio absoluto y cambio relativo.", "o": [["A", "el aumento de Pedro fue mayor en palabras por minuto, pero el de Luisa fue mayor en porcentaje.", "Pedro aumentó 18 ppm (18 ÷ 100 = 18 %) y Luisa 16 ppm (16 ÷ 80 = 20 %). En valor absoluto mejoró más Pedro; en valor relativo, Luisa.", true], ["B", "el aumento de Pedro fue mayor tanto en palabras por minuto como en porcentaje, porque partió de un nivel más alto.", "Usa la diferencia absoluta como si también fuera la relativa; el aumento de Luisa es 20 % y el de Pedro 18 %.", false], ["C", "los dos mejoraron igual, porque ambos aumentaron cerca de 17 ppm.", "Aproxima los aumentos y omite la base de comparación; los aumentos fueron 16 y 18 ppm, y en porcentaje, 20 % y 18 %.", false]]}]}, {"comp": "razonamiento_cuantitativo", "rol": "docente", "tag": "Razonamiento cuantitativo", "texto": "Usted debe imprimir una guía de 35 páginas para cada uno de los 120 estudiantes de grado noveno; cada página se imprime en una hoja, por una sola cara. El papel viene en resmas de 500 hojas. La fotocopiadora A imprime 1.200 páginas en 40 minutos y la fotocopiadora B imprime 1.200 páginas en 60 minutos; cada una trabaja siempre a su ritmo constante.", "items": [{"id": "RC-184", "niv": 1, "e": "El número total de páginas que deben imprimirse es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: multiplicación en situaciones de conteo.", "o": [["A", "155 páginas.", "Suma las páginas de la guía y los estudiantes (35 + 120); cada estudiante recibe 35 páginas, por lo que se multiplica.", false], ["B", "420 páginas.", "Omite un cero al multiplicar (35 × 12); el número de estudiantes es 120, no 12.", false], ["C", "4.200 páginas.", "Cada uno de los 120 estudiantes recibe 35 páginas: 35 × 120 = 4.200 páginas.", true]]}, {"id": "RC-185", "niv": 1, "e": "El número mínimo de resmas de papel que se necesitan es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: redondeo por exceso en contexto.", "o": [["A", "5 resmas.", "Supone impresión por ambas caras (4.200 ÷ 2 ÷ 500 = 4,2 → 5), pero el caso indica que se imprime por una sola cara.", false], ["B", "8 resmas.", "Trunca el cociente 4.200 ÷ 500 = 8,4; con 8 resmas solo hay 4.000 hojas y faltarían 200.", false], ["C", "9 resmas.", "Se necesitan 4.200 hojas y 4.200 ÷ 500 = 8,4; como no se compran fracciones de resma, se requieren 9.", true]]}, {"id": "RC-186", "niv": 2, "e": "Si solo se usa la fotocopiadora A, el tiempo necesario para imprimir todas las guías es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: tasas de trabajo y conversión de unidades de tiempo.", "o": [["A", "1 h 40 min.", "Obtiene 140 minutos y lo lee como 1,40 horas; 140 minutos son 2 horas y 20 minutos.", false], ["B", "2 h 20 min.", "La fotocopiadora A imprime 1.200 ÷ 40 = 30 páginas por minuto. 4.200 ÷ 30 = 140 minutos = 2 h 20 min.", true], ["C", "3 h 30 min.", "Usa el ritmo de la fotocopiadora B (20 páginas por minuto: 4.200 ÷ 20 = 210 minutos).", false]]}, {"id": "RC-187", "niv": 3, "e": "Si las dos fotocopiadoras trabajan al mismo tiempo, todas las guías quedan impresas en", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: problemas de trabajo conjunto y tasas.", "o": [["A", "1 h 10 min.", "Supone que con dos máquinas el tiempo se reduce a la mitad del de A (140 ÷ 2), como si B fuera tan rápida como A.", false], ["B", "1 h 24 min.", "A imprime 30 y B 20 páginas por minuto; juntas, 50 páginas por minuto. 4.200 ÷ 50 = 84 minutos = 1 h 24 min.", true], ["C", "2 h 55 min.", "Promedia los tiempos de cada máquina por separado ((140 + 210) ÷ 2 = 175 minutos); al trabajar juntas, se suman los ritmos y el tiempo disminuye.", false]]}]}, {"comp": "razonamiento_cuantitativo", "rol": "directivo", "tag": "Razonamiento cuantitativo", "texto": "Una institución urbana tiene 800 estudiantes matriculados. El 15 % son estudiantes migrantes y, de ellos, el 40 % aún no tiene un documento de identificación colombiano vigente, por lo que la institución adelanta con las familias los trámites de regularización. Usted, como rector, prepara el informe para la secretaría de educación.", "items": [{"id": "RC-188", "niv": 1, "e": "El número de estudiantes migrantes matriculados es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: porcentaje de una cantidad.", "o": [["A", "120 estudiantes.", "El 15 % de 800 es 800 × 0,15 = 120 estudiantes.", true], ["B", "680 estudiantes.", "Corresponde a los estudiantes que no son migrantes (85 % de 800); confunde la parte con su complemento.", false], ["C", "920 estudiantes.", "Aplica el 15 % como un aumento sobre la matrícula (800 × 1,15); el 15 % describe una parte de los 800 estudiantes.", false]]}, {"id": "RC-189", "niv": 2, "e": "Los estudiantes migrantes sin documento colombiano vigente representan, respecto al total de matriculados, el", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: porcentaje de un porcentaje.", "o": [["A", "6 %.", "Son el 40 % del 15 %: 0,40 × 0,15 = 0,06, es decir, el 6 % del total (48 de 800 estudiantes).", true], ["B", "40 %.", "Toma el 40 % como si fuera del total de matriculados; ese porcentaje se refiere solo a los estudiantes migrantes.", false], ["C", "55 %.", "Suma los porcentajes (15 % + 40 %), que tienen bases distintas; un porcentaje de un porcentaje se obtiene multiplicando.", false]]}, {"id": "RC-190", "niv": 3, "e": "Si el próximo año el número de estudiantes migrantes aumenta 25 % y la matrícula total aumenta 5 %, el porcentaje de migrantes respecto al total, redondeado a una cifra decimal, será", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: porcentajes y cambio de la base de referencia.", "o": [["A", "15,8 %.", "Aplica a la proporción el crecimiento de la matrícula total (15 % × 1,05 ≈ 15,8 %), en lugar de recalcular la razón entre los nuevos migrantes y la nueva matrícula.", false], ["B", "17,9 %.", "Migrantes: 120 × 1,25 = 150. Matrícula total: 800 × 1,05 = 840. Porcentaje: 150 ÷ 840 ≈ 17,9 %.", true], ["C", "18,8 %.", "Aplica el aumento del 25 % a la proporción (15 % × 1,25) sin considerar que la matrícula total también crece.", false]]}]}, {"comp": "razonamiento_cuantitativo", "rol": "docente", "tag": "Razonamiento cuantitativo", "texto": "Usted orienta matemáticas en dos grupos de décimo, cada uno con 30 estudiantes. En la evaluación del primer periodo, ambos grupos obtuvieron un promedio de 3,6 en escala de 1,0 a 5,0. En 10A la nota más baja fue 3,2 y la más alta 4,0. En 10B la nota más baja fue 1,8 y la más alta 5,0. Usted debe decidir en cuál grupo concentrar las actividades de refuerzo.", "items": [{"id": "RC-191", "niv": 1, "e": "El rango de las notas de 10B es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: medidas de dispersión: rango.", "o": [["A", "0,8.", "Corresponde al rango de 10A (4,0 − 3,2); la pregunta se refiere a 10B.", false], ["B", "3,2.", "El rango es la diferencia entre el dato mayor y el menor: 5,0 − 1,8 = 3,2.", true], ["C", "6,8.", "Suma la nota mayor y la menor (5,0 + 1,8); el rango se obtiene restándolas.", false]]}, {"id": "RC-192", "niv": 3, "e": "Un colega concluye: «como los dos grupos tienen el mismo promedio, su desempeño fue igual y requieren el mismo refuerzo». Frente a esta conclusión, usted argumenta que", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: comparación de distribuciones con medidas de tendencia central y de dispersión.", "o": [["A", "no es válida, porque con el mismo promedio 10B presenta mucha más dispersión: tiene al menos una nota muy baja (1,8), y en 10A nadie bajó de 3,2.", "El promedio no describe la dispersión. En 10A todas las notas están entre 3,2 y 4,0 (rango 0,8); en 10B hay notas desde 1,8 (rango 3,2), así que algunos estudiantes de 10B están por debajo de 3,0 y nadie en 10A lo está.", true], ["B", "es válida, porque el promedio es la medida que mejor resume el desempeño de un grupo.", "Usa una sola medida de tendencia central para un juicio que requiere conocer la distribución; dos grupos con igual promedio pueden tener situaciones muy distintas.", false], ["C", "no es válida, porque 10B tuvo mejor desempeño que 10A al tener la nota más alta del curso (5,0), lo que indica que necesita menos refuerzo.", "Toma un dato extremo como representativo del grupo; la nota máxima no indica cómo les fue a los demás estudiantes ni compensa las notas bajas.", false]]}, {"id": "RC-193", "niv": 2, "e": "Para identificar con precisión en cuál grupo hay más estudiantes que necesitan refuerzo, el dato más útil que usted debe obtener es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: selección de información pertinente para resolver un problema.", "o": [["A", "el número de estudiantes con nota inferior a 3,0 en cada grupo.", "La necesidad de refuerzo depende de cuántos estudiantes no alcanzan el desempeño básico, información que da la distribución de las notas y no el promedio ni los extremos.", true], ["B", "la diferencia entre los promedios de los dos grupos, para saber cuál de ellos tuvo un desempeño general más bajo.", "Los promedios son iguales (3,6), así que su diferencia es 0 y no permite distinguir entre los grupos.", false], ["C", "la nota más alta de cada grupo.", "La nota máxima describe a un solo estudiante y no informa cuántos están por debajo del desempeño básico.", false]]}]}, {"comp": "razonamiento_cuantitativo", "rol": "docente", "tag": "Razonamiento cuantitativo", "texto": "Para la feria de ciencias, los estudiantes de grado noveno construyen un tanque cilíndrico de 40 cm de diámetro y 50 cm de altura para un sistema de riego por goteo. Recuerde que 1 litro equivale a 1.000 cm³ y use π = 3,14. Una bomba llena el tanque a razón constante de 1,57 litros por minuto. Usted es el docente que asesora el proyecto.", "items": [{"id": "RC-194", "niv": 2, "e": "La capacidad del tanque es de", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: volumen del cilindro y conversión de unidades.", "o": [["A", "62,8 litros.", "El radio es 20 cm. V = π × r² × h = 3,14 × 400 × 50 = 62.800 cm³, que equivalen a 62.800 ÷ 1.000 = 62,8 litros.", true], ["B", "251,2 litros.", "Usa el diámetro (40 cm) como si fuera el radio: 3,14 × 1.600 × 50 = 251.200 cm³.", false], ["C", "628 litros.", "Divide los 62.800 cm³ entre 100 en lugar de 1.000; la equivalencia es 1 L = 1.000 cm³.", false]]}, {"id": "RC-195", "niv": 3, "e": "Partiendo del tanque vacío, el tiempo que tarda la bomba en llenarlo hasta 3/4 de su capacidad es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: fracciones, tasas y volumen en problemas de varios pasos.", "o": [["A", "10 minutos.", "Calcula el tiempo para llenar 1/4 del tanque (15,7 L ÷ 1,57); confunde la fracción que falta con la que se debe llenar.", false], ["B", "30 minutos.", "La capacidad es 62,8 L y 3/4 de ella son 47,1 L. A 1,57 L por minuto: 47,1 ÷ 1,57 = 30 minutos.", true], ["C", "40 minutos.", "Es el tiempo para llenar el tanque completo (62,8 ÷ 1,57); omite que solo se llena hasta 3/4.", false]]}, {"id": "RC-196", "niv": 1, "e": "Para decorar el tanque, los estudiantes rodearán su borde superior con una cinta. La longitud mínima de cinta que necesitan es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: longitud de la circunferencia.", "o": [["A", "62,8 cm.", "Multiplica π por el radio (3,14 × 20); la longitud de la circunferencia es π × diámetro o 2 × π × radio.", false], ["B", "125,6 cm.", "La longitud de la circunferencia es π × d = 3,14 × 40 = 125,6 cm.", true], ["C", "251,2 cm.", "Aplica 2 × π × 40, es decir, usa el diámetro como si fuera el radio en la fórmula 2πr.", false]]}]}, {"comp": "razonamiento_cuantitativo", "rol": "docente", "tag": "Razonamiento cuantitativo", "texto": "En un grupo de 32 estudiantes de sexto, 4 tienen Plan Individual de Ajustes Razonables (PIAR). Uno de los ajustes acordados es que estos estudiantes disponen de 25 % más de tiempo en las evaluaciones escritas. La evaluación de ciencias sociales tiene 40 preguntas, dura 80 minutos para el grupo y empieza a las 8:15 a. m. Usted es el docente del área y organiza la aplicación.", "items": [{"id": "RC-197", "niv": 1, "e": "El tiempo total del que disponen los estudiantes con PIAR para la evaluación es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: porcentajes en contexto.", "o": [["A", "20 minutos.", "Corresponde solo al tiempo adicional (25 % de 80); falta sumarlo al tiempo base.", false], ["B", "100 minutos.", "El 25 % de 80 minutos es 20 minutos; el tiempo total es 80 + 20 = 100 minutos (80 × 1,25).", true], ["C", "105 minutos.", "Suma 25 minutos al tiempo base, como si 25 % equivaliera a 25 minutos; el 25 % de 80 son 20 minutos.", false]]}, {"id": "RC-198", "niv": 2, "e": "Los estudiantes con PIAR deben terminar la evaluación, a más tardar, a las", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: operaciones con unidades de tiempo.", "o": [["A", "9:15 a. m.", "Toma 100 minutos como si fueran 1 hora; 100 minutos equivalen a 1 hora y 40 minutos.", false], ["B", "9:35 a. m.", "Es la hora de finalización del resto del grupo (80 minutos); no incluye el tiempo adicional del ajuste.", false], ["C", "9:55 a. m.", "Disponen de 100 minutos = 1 h 40 min. 8:15 + 1:40 = 9:55 a. m.", true]]}, {"id": "RC-199", "niv": 1, "e": "El porcentaje de estudiantes del grupo que tiene PIAR es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: porcentajes y frecuencias relativas.", "o": [["A", "1,25 %.", "Obtiene bien el cociente 4 ÷ 32 = 0,125, pero al pasarlo a porcentaje mueve la coma un lugar de más; 0,125 equivale a 12,5 %.", false], ["B", "4 %.", "Toma el número de estudiantes con PIAR como si fuera el porcentaje, sin dividir entre los 32 del grupo.", false], ["C", "12,5 %.", "4 de 32 estudiantes: 4 ÷ 32 = 0,125 = 12,5 %.", true]]}, {"id": "RC-200", "niv": 3, "e": "Un colega propone que los estudiantes con PIAR terminen en 80 minutos, pero con menos preguntas, de modo que tengan por pregunta el mismo tiempo promedio que les daría el ajuste del 25 %. El número de preguntas de su evaluación debe ser", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: proporcionalidad inversa.", "o": [["A", "30 preguntas.", "Reduce en 25 % el número de preguntas (40 × 0,75). Para que cada pregunta tenga 25 % más de tiempo, el número de preguntas debe dividirse entre 1,25.", false], ["B", "32 preguntas.", "Con el ajuste, cada pregunta tendría 100 ÷ 40 = 2,5 minutos. En 80 minutos caben 80 ÷ 2,5 = 32 preguntas (40 ÷ 1,25).", true], ["C", "50 preguntas.", "Multiplica las preguntas por 1,25 en lugar de dividir; más preguntas en el mismo tiempo reducirían el tiempo por pregunta.", false]]}]}, {"comp": "razonamiento_cuantitativo", "rol": "docente", "tag": "Razonamiento cuantitativo", "texto": "La factura mensual de energía de una sede educativa se calcula con un cargo fijo de $18.000 más $850 por cada kilovatio-hora (kWh) consumido. En una gráfica de la factura (eje vertical, en pesos) frente al consumo (eje horizontal, en kWh), esta tarifa es una recta. Un nuevo comercializador ofrece un plan sin cargo fijo, a $920 por kWh. Usted, como integrante del comité de gestión ambiental, analiza el consumo.", "items": [{"id": "RC-201", "niv": 1, "e": "Con la tarifa actual, la factura de un mes con un consumo de 400 kWh es de", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: funciones lineales en contexto.", "o": [["A", "$340.000.", "Calcula solo el valor del consumo (400 × 850) y omite el cargo fijo de $18.000.", false], ["B", "$358.000.", "Factura = 18.000 + 850 × 400 = 18.000 + 340.000 = $358.000.", true], ["C", "$7.540.000.", "Suma el cargo fijo al precio de cada kWh antes de multiplicar ((18.000 + 850) × 400), como si el cargo fijo se cobrara por cada kWh.", false]]}, {"id": "RC-202", "niv": 2, "e": "Si con la tarifa actual una factura fue de $443.000, el consumo de ese mes fue", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: solución de ecuaciones lineales.", "o": [["A", "500 kWh.", "Se resuelve 18.000 + 850x = 443.000: 850x = 425.000, de donde x = 500 kWh.", true], ["B", "521 kWh.", "Divide el valor total entre 850 sin descontar antes el cargo fijo (443.000 ÷ 850 ≈ 521).", false], ["C", "542 kWh.", "Suma el cargo fijo en lugar de restarlo ((443.000 + 18.000) ÷ 850 ≈ 542) al despejar la ecuación.", false]]}, {"id": "RC-203", "niv": 2, "e": "En la gráfica de la tarifa actual, la pendiente de la recta representa", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: interpretación de la pendiente como razón de cambio.", "o": [["A", "el aumento en el valor de la factura por cada kWh adicional consumido, es decir, $850.", "En una función lineal f(x) = 18.000 + 850x, la pendiente (850) es la razón de cambio: cuánto aumenta la factura por cada unidad adicional de consumo.", true], ["B", "el cargo fijo de $18.000 que se cobra aunque no haya consumo.", "El cargo fijo corresponde al punto de corte con el eje vertical (consumo 0), no a la pendiente.", false], ["C", "el valor promedio de cada kWh, que se obtiene al dividir el total de la factura entre el consumo.", "Ese cociente incluye el cargo fijo y cambia con el consumo; la pendiente es constante e igual al costo de cada kWh adicional.", false]]}, {"id": "RC-204", "niv": 3, "e": "El consumo mínimo, en kWh enteros, a partir del cual la tarifa actual resulta más económica que el plan del nuevo comercializador es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: comparación de funciones lineales e inecuaciones.", "o": [["A", "21 kWh.", "Divide el cargo fijo entre el precio del kWh (18.000 ÷ 850 ≈ 21); la comparación debe hacerse con la diferencia de precios entre los planes ($70 por kWh).", false], ["B", "257 kWh.", "Trunca el punto de equilibrio 18.000 ÷ 70 ≈ 257,1. Con 257 kWh la tarifa actual cuesta $236.450 y el plan nuevo $236.440, así que todavía es más barato el nuevo.", false], ["C", "258 kWh.", "Los planes cuestan igual cuando 18.000 + 850x = 920x, es decir, x = 18.000 ÷ 70 ≈ 257,1. Para x = 258: tarifa actual $237.300 y plan nuevo $237.360, por lo que la actual ya es más económica.", true]]}]}, {"comp": "razonamiento_cuantitativo", "rol": "docente", "tag": "Razonamiento cuantitativo", "texto": "Para la jornada de embellecimiento institucional, 6 padres de familia voluntarios pintan todas las aulas en 10 días trabajando 4 horas diarias. Todos los voluntarios trabajan al mismo ritmo y el trabajo total no cambia. Las paredes por pintar suman 1.050 m²; un galón de pintura cubre 30 m² y la pintura se compra en cuñetes de 5 galones. Usted coordina la jornada con el consejo de padres.", "items": [{"id": "RC-205", "niv": 2, "e": "Si participan 8 voluntarios trabajando 4 horas diarias, el número de días que tardarían en pintar todas las aulas es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: proporcionalidad inversa.", "o": [["A", "7,5 días.", "A más voluntarios, menos días (proporcionalidad inversa): 6 × 10 = 8 × d, de donde d = 60 ÷ 8 = 7,5 días.", true], ["B", "8 días.", "Resta a los 10 días los 2 voluntarios adicionales; la relación entre voluntarios y días no es aditiva sino inversamente proporcional.", false], ["C", "13,3 días.", "Plantea una proporcionalidad directa (10 × 8 ÷ 6); con más voluntarios el trabajo debe tardar menos, no más.", false]]}, {"id": "RC-206", "niv": 3, "e": "Si participan 5 voluntarios trabajando 6 horas diarias, el número de días que tardarían es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: proporcionalidad compuesta.", "o": [["A", "8 días.", "El trabajo total es 6 × 10 × 4 = 240 horas-persona. Con 5 voluntarios a 6 horas diarias se hacen 30 horas-persona por día: 240 ÷ 30 = 8 días.", true], ["B", "12 días.", "Ajusta por el número de voluntarios (10 × 6 ÷ 5 = 12) pero ignora que ahora trabajan 6 horas diarias en lugar de 4.", false], ["C", "18 días.", "Trata las horas diarias como directamente proporcionales a los días (12 × 6 ÷ 4); más horas por día reducen el número de días.", false]]}, {"id": "RC-207", "niv": 1, "e": "El número de cuñetes de pintura necesarios para dar una mano a todas las paredes es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: conversión de unidades y razones.", "o": [["A", "7 cuñetes.", "Se necesitan 1.050 ÷ 30 = 35 galones, y 35 ÷ 5 = 7 cuñetes.", true], ["B", "35 cuñetes.", "Es el número de galones; falta dividir entre los 5 galones que trae cada cuñete.", false], ["C", "210 cuñetes.", "Divide el área entre 5 (1.050 ÷ 5) sin pasar primero por el rendimiento de 30 m² por galón.", false]]}]}, {"comp": "razonamiento_cuantitativo", "rol": "docente", "tag": "Razonamiento cuantitativo", "texto": "En el plan lector, usted registró cuántos libros completos leyó durante el año cada uno de los 40 estudiantes de grado cuarto: 4 estudiantes leyeron 0 libros, 10 leyeron 1 libro, 12 leyeron 2 libros, 8 leyeron 3 libros y 6 leyeron 4 libros.", "items": [{"id": "RC-208", "niv": 1, "e": "La moda del número de libros leídos es", "f": "MEN (2006). Estándares Básicos de Competencias en Matemáticas: pensamiento aleatorio; moda en tablas de frecuencia.", "o": [["A", "2 libros.", "La moda es el valor con mayor frecuencia: 2 libros, que leyeron 12 estudiantes.", true], ["B", "4 libros.", "Es el mayor número de libros leídos (valor máximo), no el valor más frecuente.", false], ["C", "12 libros.", "Es la frecuencia de la moda (12 estudiantes), no el valor de la variable; confunde la frecuencia con el dato.", false]]}, {"id": "RC-209", "niv": 2, "e": "El promedio de libros leídos por estudiante es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: media aritmética a partir de tablas de frecuencia.", "o": [["A", "2 libros.", "Corresponde a la mediana o a la moda; el promedio se calcula con la suma de todos los libros leídos dividida entre 40.", false], ["B", "2,05 libros.", "Total de libros: 0 × 4 + 1 × 10 + 2 × 12 + 3 × 8 + 4 × 6 = 0 + 10 + 24 + 24 + 24 = 82. Promedio: 82 ÷ 40 = 2,05.", true], ["C", "8 libros.", "Promedia las frecuencias (40 ÷ 5 = 8) en lugar de los valores de la variable ponderados por su frecuencia.", false]]}, {"id": "RC-210", "niv": 3, "e": "Para que el promedio del grupo llegue a 2,5 libros por estudiante, el número adicional de libros que deben leer en total los 40 estudiantes es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: media aritmética y planteamiento de metas.", "o": [["A", "0,45 libros.", "Es el aumento necesario en el promedio por estudiante (2,5 − 2,05), no la cantidad total de libros adicionales del grupo.", false], ["B", "18 libros.", "Para un promedio de 2,5 con 40 estudiantes se necesitan 2,5 × 40 = 100 libros. Ya se leyeron 82, así que faltan 100 − 82 = 18 libros.", true], ["C", "100 libros.", "Es el total de libros que corresponde al promedio de 2,5; falta restar los 82 libros ya leídos.", false]]}]}, {"comp": "competencias_blandas", "rol": "docente", "tag": "Competencias blandas y ciudadanas · Competencias ciudadanas y ética", "texto": "En la elección de personero estudiantil, uno de los candidatos de grado once promete a los estudiantes de sexto que, si gana, conseguirá que se elimine el uniforme de educación física. Varios docentes comentan en la sala de profesores que es una promesa imposible de cumplir y que el candidato «solo busca votos». Usted es el docente del área de ciencias sociales y está a cargo del proceso de elección.", "items": [{"id": "CB-001", "niv": 1, "e": "Frente a la promesa del candidato, una actuación coherente con la formación en competencias ciudadanas es", "f": "Ley 1620 de 2013, art. 2 (competencias ciudadanas); Ley 115 de 1994, art. 94 (personero de los estudiantes).", "o": [["A", "explicar en privado a los estudiantes de sexto que la propuesta es imposible y que no deberían votar por ese candidato.", "El docente no debe orientar el voto hacia o en contra de un candidato; además, la conversación privada no fortalece la deliberación de toda la comunidad estudiantil.", false], ["B", "retirar la propuesta del tarjetón, porque induce a error a los estudiantes más pequeños del colegio.", "Censurar una propuesta desde la autoridad docente limita la participación y desaprovecha la oportunidad formativa; la respuesta democrática es el análisis público de las propuestas.", false], ["C", "organizar un debate en el que los candidatos expliquen cómo cumplirían sus propuestas y cuál es el alcance real del cargo.", "Las competencias ciudadanas buscan que los estudiantes actúen de manera constructiva en una sociedad democrática (Ley 1620 de 2013, art. 2). Un debate permite que los votantes evalúen las propuestas y que todos comprendan las funciones del personero, sin censurar a nadie.", true]]}, {"id": "CB-002", "niv": 1, "e": "Para que los estudiantes valoren el alcance real de la propuesta, usted les explica que la función del personero es", "f": "Ley 115 de 1994, artículos 94 y 143.", "o": [["A", "representar a los estudiantes en el consejo directivo y votar las decisiones sobre el manual de convivencia.", "Confunde al personero con el representante de los estudiantes ante el consejo directivo (Ley 115, art. 143). Son figuras distintas.", false], ["B", "decidir en última instancia los reclamos de los estudiantes sobre normas como el uso del uniforme.", "Según el parágrafo del artículo 94 de la Ley 115, las solicitudes del personero las resuelve en última instancia el consejo directivo, no el personero.", false], ["C", "promover el cumplimiento de los derechos y deberes de los estudiantes y presentar solicitudes ante el rector.", "El artículo 94 de la Ley 115 de 1994 establece que el personero promueve el cumplimiento de los derechos y deberes de los estudiantes y presenta ante el rector las solicitudes necesarias para protegerlos.", true]]}, {"id": "CB-003", "niv": 2, "e": "En la sala de profesores, ante el comentario de que el candidato «solo busca votos», la postura más profesional de su parte es", "f": "MEN (2008). Guía 31, Anexo 1: Glosario de competencias (Compromiso social e institucional; Trabajo en equipo).", "o": [["A", "estar de acuerdo con sus colegas, pero no intervenir en el proceso para no afectar la elección.", "Como responsable del proceso, no intervenir significa renunciar a su función formativa; además, compartir el juicio sobre el estudiante sin contrastarlo no es imparcial.", false], ["B", "pedir a sus colegas que no opinen sobre los candidatos, porque el proceso electoral es su responsabilidad.", "Cerrar la conversación a los colegas no aporta soluciones y no favorece el trabajo en equipo; la elección es un proceso de toda la comunidad educativa.", false], ["C", "proponer que el área acompañe a todos los candidatos para que formulen propuestas viables.", "Transforma la crítica en una acción pedagógica igual para todos los candidatos, lo que refleja compromiso social e institucional y respeto por los estudiantes (Guía 31).", true]]}]}, {"comp": "competencias_blandas", "rol": "docente", "tag": "Competencias blandas y ciudadanas · Gobierno escolar y participación (Ley 115 de 1994; Decretos 1860 de 1994 y 1286 de 2005)", "texto": "Usted es docente de ciencias sociales en una institución educativa oficial urbana que ofrece desde preescolar hasta grado once, y el rector le encargó organizar la elección del personero estudiantil. Las clases iniciaron el 26 de enero. Dos estudiantes de once, Valeria y Samuel, inscribieron su candidatura. Samuel comenta que, además de personero, quiere ser representante de los estudiantes ante el consejo directivo «para tener más voz». Algunos docentes de primaria sugieren que sus estudiantes no voten «porque no entienden el proceso», y una estudiante de séptimo le pregunta a usted por quién debería votar.", "items": [{"id": "CB-101", "niv": 1, "e": "Según la reglamentación del gobierno escolar, la elección del personero debe realizarse", "f": "Decreto 1860 de 1994, art. 28 (compilado en el Decreto 1075 de 2015).", "o": [["A", "antes de iniciar las clases, durante la semana de desarrollo institucional, para no afectar el calendario académico.", "Organizar la elección antes de las clases puede parecer eficiente, pero la norma fija el plazo a partir de la iniciación de clases y exige convocar a los estudiantes matriculados, que en esa semana no están en la institución.", false], ["B", "una vez se conforme el consejo de estudiantes, que es el órgano encargado de elegirlo entre sus voceros.", "Confunde la elección del personero con la del representante ante el consejo directivo. El consejo de estudiantes elige a ese representante (Decreto 1860, art. 29), mientras que al personero lo eligen todos los estudiantes matriculados.", false], ["C", "dentro de los treinta días calendario siguientes a la iniciación de clases, mediante voto secreto.", "El artículo 28 del Decreto 1860 de 1994 (compilado en el Decreto 1075 de 2015) establece que el personero se elige dentro de los treinta días calendario siguientes al inicio de clases, por mayoría simple y mediante voto secreto.", true]]}, {"id": "CB-102", "niv": 1, "e": "Frente a la sugerencia de que los estudiantes de primaria no voten, usted explica que", "f": "Decreto 1860 de 1994, art. 28; MEN (2004). Estándares Básicos de Competencias Ciudadanas, Serie Guías n.º 6 (participación y responsabilidad democrática).", "o": [["A", "solo pueden votar los estudiantes de primaria cuyas familias lo autoricen, para respetar la decisión de los acudientes.", "Pedir autorización a las familias parece respetuoso, pero la norma no condiciona el voto de los estudiantes a un permiso de sus acudientes; el derecho a elegir corresponde a todos los matriculados.", false], ["B", "los estudiantes de primaria pueden delegar su voto en el vocero de su grado, para garantizar un voto más informado.", "La delegación busca un voto informado, pero la elección del personero es directa, por mayoría simple y con voto secreto de cada estudiante; no existe voto delegado.", false], ["C", "todos los estudiantes matriculados deben ser convocados a votar, como parte de su formación en participación.", "El artículo 28 del Decreto 1860 de 1994 indica que el rector convoca a todos los estudiantes matriculados para elegir al personero. Además, los Estándares de Competencias Ciudadanas proponen formar la participación desde los primeros grados, con explicaciones adecuadas a la edad.", true]]}, {"id": "CB-103", "niv": 2, "e": "Sobre la aspiración de Samuel a ser también representante ante el consejo directivo, usted le informa que", "f": "Decreto 1860 de 1994, art. 28.", "o": [["A", "si es elegido personero, no podrá ser a la vez representante de los estudiantes ante el consejo directivo.", "El artículo 28 del Decreto 1860 de 1994 establece que el cargo de personero es incompatible con el de representante de los estudiantes ante el consejo directivo.", true], ["B", "puede ejercer ambos cargos, siempre que no vote en el consejo directivo cuando se discutan sus propias solicitudes.", "Abstenerse en ciertos temas parece una solución prudente, pero la incompatibilidad es total: la misma persona no puede ocupar los dos cargos (Decreto 1860, art. 28).", false], ["C", "puede ejercer ambos cargos si el consejo de estudiantes lo aprueba, porque los dos exigen cursar el último grado.", "Es cierto que ambos cargos exigen cursar el último grado, pero la incompatibilidad la fija la norma y no puede levantarla el consejo de estudiantes.", false]]}, {"id": "CB-104", "niv": 2, "e": "Ante la pregunta de la estudiante de séptimo sobre por quién votar, una respuesta coherente con la formación en participación democrática es", "f": "MEN (2004). Estándares Básicos de Competencias Ciudadanas, Serie Guías n.º 6 (participación y responsabilidad democrática); Ley 115 de 1994, art. 94.", "o": [["A", "recomendarle el candidato cuyas propuestas usted considere más realistas, explicándole las razones de su preferencia.", "Aunque la recomendación sea argumentada, el docente que organiza la elección influye en el voto desde su autoridad y reemplaza el criterio propio de la estudiante.", false], ["B", "sugerirle que vote en blanco hasta conocer mejor a los candidatos, para que su voto no sea improvisado.", "Busca evitar un voto improvisado, pero igualmente le indica qué votar. Lo formativo es ayudarla a informarse para que decida por sí misma.", false], ["C", "invitarla a comparar las propuestas con las funciones del personero y a decidir con sus propios criterios.", "La participación y responsabilidad democrática implica tomar decisiones informadas y autónomas (Guía 6). El docente ofrece herramientas para analizar, sin orientar el voto hacia un candidato.", true]]}]}, {"comp": "competencias_blandas", "rol": "docente", "tag": "Competencias blandas y ciudadanas · Gobierno escolar y participación (Ley 115 de 1994; Decretos 1860 de 1994 y 1286 de 2005)", "texto": "Usted es uno de los dos docentes de un centro educativo rural que ofrece desde preescolar hasta quinto grado, con 38 estudiantes. El consejo directivo convocó, en la tercera semana del calendario académico, las asambleas de estudiantes para elegir a los voceros del consejo de estudiantes. Los niños de preescolar a tercero están muy entusiasmados y varios de primero quieren postularse. En cuarto y quinto, algunos estudiantes proponen que el vocero sea «el que mejor se porte».", "items": [{"id": "CB-105", "niv": 2, "e": "A los niños de primero que quieren postularse, usted les explica que, según la norma, los estudiantes de preescolar y de los tres primeros grados", "f": "Decreto 1860 de 1994, art. 29 (compilado en el Decreto 1075 de 2015).", "o": [["A", "no eligen vocero, porque por su edad quedan representados por el vocero del grado quinto.", "Excluir a los más pequeños por su edad contradice la norma, que sí les reconoce participación mediante una asamblea conjunta que elige un vocero de tercer grado.", false], ["B", "eligen en una asamblea conjunta un vocero único, que debe ser un estudiante de tercer grado.", "El artículo 29 del Decreto 1860 de 1994 dispone que los alumnos de preescolar y de los tres primeros grados de primaria se reúnen en una asamblea conjunta para elegir un vocero único entre los estudiantes de tercer grado.", true], ["C", "eligen cada uno su propio vocero, aunque estos tienen voz pero no voto en el consejo de estudiantes.", "Parece una forma de dar participación a cada grado, pero la norma no prevé voceros por grado en ese tramo ni voceros sin voto; prevé un vocero único elegido entre los estudiantes de tercero.", false]]}, {"id": "CB-106", "niv": 1, "e": "Ante la propuesta de que el vocero sea «el que mejor se porte», usted orienta la discusión de cuarto y quinto hacia", "f": "MEN (2004). Estándares Básicos de Competencias Ciudadanas, Serie Guías n.º 6 (participación y responsabilidad democrática); Decreto 1860 de 1994, art. 29.", "o": [["A", "definir qué tareas cumplirá el vocero y qué cualidades necesita para representar bien a sus compañeros.", "Ayudar a los estudiantes a relacionar la elección con la función de representar es coherente con la participación y responsabilidad democrática (Guía 6): se elige a quien pueda cumplir el cargo, no a quien obtenga un premio.", true], ["B", "proponer usted una terna con los estudiantes de mejor desempeño, para facilitar una elección más ordenada.", "Facilita el proceso, pero el docente decide quiénes pueden ser elegidos y limita la participación; la norma prevé que los estudiantes elijan de su seno mediante votación secreta.", false], ["C", "aceptar ese criterio, porque el buen comportamiento es una forma objetiva de reconocer a los estudiantes responsables.", "El buen comportamiento puede ser valioso, pero convierte la representación en un premio a la disciplina y desconoce que la elección debe basarse en la capacidad de representar al grupo.", false]]}, {"id": "CB-107", "niv": 1, "e": "Una vez conformado el consejo de estudiantes, usted les explica que una de sus funciones es", "f": "Decreto 1860 de 1994, arts. 28 y 29; Ley 115 de 1994, art. 144.", "o": [["A", "aprobar el manual de convivencia, por ser el máximo órgano de participación de los estudiantes.", "Es cierto que el consejo de estudiantes es el máximo órgano de participación de los educandos, pero adoptar el reglamento corresponde al consejo directivo (Ley 115, art. 144, literal c).", false], ["B", "elegir al representante de los estudiantes ante el consejo directivo y asesorarlo en su labor.", "El artículo 29 del Decreto 1860 de 1994 asigna al consejo de estudiantes darse su organización interna, elegir al representante ante el consejo directivo y asesorarlo, e invitar a estudiantes con iniciativas.", true], ["C", "elegir al personero entre los voceros de los grados, para que represente a todo el estudiantado.", "Confunde las figuras: al personero lo eligen todos los estudiantes matriculados por voto secreto (Decreto 1860, art. 28), no el consejo de estudiantes.", false]]}, {"id": "CB-108", "niv": 3, "e": "Dos semanas después, la vocera de tercero le cuenta que los niños de preescolar dicen que ella «nunca les pregunta nada». La forma de acompañarla que mejor fortalece la participación es", "f": "MEN (2004). Estándares Básicos de Competencias Ciudadanas, Serie Guías n.º 6 (participación y responsabilidad democrática, grados 1.° a 3.°); Decreto 1860 de 1994, art. 29.", "o": [["A", "pedirle que asista a las reuniones con la docente de preescolar, quien conoce mejor las necesidades de esos niños.", "Busca apoyar a la vocera, pero traslada a un adulto la tarea de representar y no desarrolla en la estudiante la capacidad de escuchar a quienes representa.", false], ["B", "explicar a los niños de preescolar que la vocera los representa a todos y que confíen en las decisiones que ella tome.", "Defiende a la vocera, pero ignora el reclamo legítimo de los niños: la representación supone escuchar a los representados, no solo pedirles confianza.", false], ["C", "ayudarla a preparar, con dibujos o preguntas sencillas, un momento corto para escuchar a los más pequeños antes de cada reunión.", "Fortalece la competencia de la vocera para representar y hace efectiva la participación de los más pequeños con medios adecuados a su edad, en línea con los estándares de participación de los primeros grados (Guía 6).", true]]}]}, {"comp": "competencias_blandas", "rol": "docente", "tag": "Competencias blandas y ciudadanas · Ética en el servicio público (Ley 1952 de 2019; Código de Integridad)", "texto": "Usted es director de grupo de noveno en un colegio oficial. Faltan dos semanas para la comisión de evaluación y promoción, que analizará el caso de Andrés, quien tiene dos áreas con desempeño bajo, una de ellas la suya. La madre de Andrés, agradecida por el acompañamiento que usted le ha dado a su hijo, llega a la sala de profesores con una ancheta y una tarjeta que dice «gracias por ayudar a que Andrés pase». Ese mismo día, una familia propone en el chat de padres del grupo hacer una colecta para regalarle a usted un bono por el Día del Maestro.", "items": [{"id": "CB-109", "niv": 1, "e": "Frente a la ancheta que le ofrece la madre de Andrés, la actuación más adecuada es", "f": "Función Pública (2017). Código de Integridad del Servicio Público (honestidad); Ley 1952 de 2019, art. 38, num. 7.", "o": [["A", "agradecerle el gesto y no recibirla, explicándole con amabilidad que la decisión sobre Andrés está pendiente.", "El regalo llega dos semanas antes de la comisión que decidirá sobre Andrés, y la tarjeta lo vincula expresamente con que «pase». El Código de Integridad (honestidad) orienta a no aceptar incentivos ni beneficios de personas interesadas en un proceso de decisión, y la madre tiene interés directo en la decisión de promoción en la que usted participa.", true], ["B", "recibirla y compartirla con los demás docentes de la sala, para que no sea un beneficio personal.", "Repartir el regalo no cambia que proviene de una familia interesada en una decisión pendiente; el problema no es quién lo disfruta sino el momento y el interés de quien lo ofrece.", false], ["C", "recibirla para no ofenderla y aclararle que eso no influirá en la valoración de su hijo.", "Cuidar la relación con la familia es valioso, pero recibir un regalo que la tarjeta asocia con la promoción, justo antes de la comisión, compromete la imparcialidad aunque usted aclare que no influirá.", false]]}, {"id": "CB-110", "niv": 2, "e": "Días después, la madre de Andrés le escribe a su celular personal a las diez de la noche para pedirle que «le dé una ayudita» a su hijo en la comisión. Usted", "f": "Ley 1952 de 2019, art. 38, num. 7; Función Pública (2017). Código de Integridad del Servicio Público (honestidad); MEN (2008). Guía 31, Anexo 1: Glosario de competencias (comunicación y relaciones interpersonales).", "o": [["A", "la llama esa misma noche para conversar con calma, entender su angustia y ver juntos qué se puede hacer por Andrés.", "Muestra cercanía, pero valida el uso del canal personal fuera del horario y deja abierta la expectativa de que el resultado puede negociarse en una conversación privada.", false], ["B", "le responde al día siguiente, por el canal institucional, que la decisión se tomará con los criterios del sistema de evaluación.", "Responder por el canal institucional y dejar claro que no habrá tratos especiales protege la imparcialidad (Ley 1952 de 2019, art. 38, num. 7; Código de Integridad, honestidad: no dar trato preferencial). Fijar el límite de forma cortés también cuida la relación con la familia (Guía 31, comunicación).", true], ["C", "no responde el mensaje, para no comprometerse por escrito con una solicitud que no puede atender.", "Evita comprometerse, pero el silencio deja la solicitud sin una respuesta clara y no le explica a la madre cómo se tomará la decisión.", false]]}, {"id": "CB-111", "niv": 3, "e": "Sobre la colecta que proponen en el chat las familias de los estudiantes a quienes usted califica, lo más coherente con la ética del servicio público es", "f": "Ley 1952 de 2019, art. 38, num. 9; Función Pública (2017). Código de Integridad del Servicio Público (honestidad).", "o": [["A", "permitir la colecta siempre que el aporte sea voluntario y de monto pequeño, para no presionar a las familias.", "La voluntariedad y el monto bajo reducen la presión, pero no eliminan que usted reciba un beneficio económico de familias a cuyos hijos evalúa; en un chat de grupo, además, quienes no aportan quedan expuestos.", false], ["B", "permitir la colecta y destinar el bono a materiales para el salón, de modo que beneficie a todo el grupo.", "El destino colectivo parece resolver el problema, pero sigue tratándose de aportes económicos de las familias promovidos por el reconocimiento al docente, con la misma presión sobre quienes no pueden o no quieren aportar.", false], ["C", "agradecer la intención y sugerir que el reconocimiento sea un mensaje o una actividad, sin aportes en dinero.", "El servidor público desempeña su cargo sin obtener ni pretender beneficios adicionales a sus contraprestaciones legales (Ley 1952 de 2019, art. 38, num. 9). Como son familias cuyos hijos usted califica, una colecta en el chat del grupo presiona a quienes no quieren o no pueden aportar, que quedan en evidencia ante los demás; un reconocimiento no económico evita esa presión.", true]]}, {"id": "CB-112", "niv": 2, "e": "En la comisión de evaluación y promoción, al analizar el caso de Andrés, usted", "f": "Decreto 1290 de 2009, arts. 4 y 6; Ley 1952 de 2019, arts. 38 y 44.", "o": [["A", "aporta las evidencias del proceso y de los apoyos brindados, para que se decida con los criterios de todos.", "La promoción se decide con los criterios definidos en el sistema institucional de evaluación (Decreto 1290 de 2009, arts. 4 y 6). Aportar evidencias y aplicar los mismos criterios a todos garantiza imparcialidad (Ley 1952 de 2019, art. 38, num. 7).", true], ["B", "pide a la comisión tener en cuenta el compromiso demostrado por la familia de Andrés durante el año.", "Reconocer a la familia es positivo, pero su compromiso no es un criterio de promoción del estudiante; introducirlo rompe la igualdad de criterios frente a los demás casos.", false], ["C", "se abstiene de participar en la discusión, porque la madre intentó darle un regalo y eso lo inhabilita.", "La prudencia es comprensible, pero usted rechazó el regalo y no tiene un interés particular y directo en la decisión (Ley 1952, art. 44); apartarse priva a la comisión de la información de quien conoce el proceso.", false]]}]}, {"comp": "competencias_blandas", "rol": "docente", "tag": "Competencias blandas y ciudadanas · Ética en el servicio público (Ley 1952 de 2019; Código de Integridad)", "texto": "Usted es docente de matemáticas de grado once en el único colegio oficial de un municipio pequeño, donde también estudia su sobrina Laura, que cursa décimo. El rector lo designa como jurado de la feria de ciencias, en la que participa el proyecto de Laura y su grupo; el ganador recibirá una beca para un curso técnico. Además, el padre de un estudiante de su curso, que tiene dificultades en matemáticas, le pide que le dé a su hijo clases particulares pagadas.", "items": [{"id": "CB-113", "niv": 3, "e": "Si los jurados deben deliberar juntos para escoger un único ganador entre todos los proyectos, frente a su designación usted debe", "f": "Ley 1952 de 2019, art. 44.", "o": [["A", "aceptar la designación y abstenerse de calificar solo el proyecto de su sobrina, dejando esa evaluación a otros jurados.", "Parece una solución equilibrada, pero en un concurso con un solo ganador las notas que usted asigne a los demás proyectos también afectan la posición de su sobrina; el impedimento cubre toda la decisión.", false], ["B", "informar al rector que su sobrina participa en uno de los proyectos y pedir que otro docente lo reemplace como jurado.", "El artículo 44 de la Ley 1952 de 2019 obliga al servidor a declararse impedido cuando un pariente dentro del cuarto grado de consanguinidad tiene interés en el asunto. Una sobrina es pariente en tercer grado, y en un concurso con un solo premio el jurado decide comparando a todos los participantes.", true], ["C", "aceptar la designación, porque una sobrina es pariente en tercer grado y el impedimento cubre solo a hijos y hermanos.", "Es un error frecuente sobre los grados de parentesco: el impedimento por conflicto de intereses alcanza hasta el cuarto grado de consanguinidad, que incluye a los sobrinos.", false]]}, {"id": "CB-114", "niv": 3, "e": "Sobre la solicitud de clases particulares pagadas para el estudiante de su curso, la respuesta más adecuada es", "f": "Ley 1952 de 2019, art. 44; Función Pública (2017). Código de Integridad del Servicio Público (honestidad); Decreto 1290 de 2009, art. 3.", "o": [["A", "aceptarlas fuera del horario laboral, ya que es un trabajo independiente que no usa recursos de la institución.", "Hacerlo fuera del horario evita usar recursos públicos, pero no elimina el conflicto: usted tendría un interés económico en un estudiante cuyo desempeño evalúa.", false], ["B", "aceptarlas y pedir que otro docente califique las evaluaciones de ese estudiante, para mantener la imparcialidad.", "Busca proteger la imparcialidad, pero usted sigue siendo el docente del área que diseña, orienta y valora el proceso del estudiante; el interés económico se mantiene.", false], ["C", "no aceptarlas y ofrecer al estudiante las estrategias de apoyo que la institución prevé para quienes presentan dificultades.", "La clave se funda en el conflicto de intereses: recibir pago de la familia de un estudiante al que usted evalúa le da un interés particular y directo en un asunto a su cargo (Ley 1952 de 2019, art. 44), y el Código de Integridad (honestidad) orienta a no dar trato preferencial ni aceptar beneficios de personas interesadas en sus decisiones. Las estrategias de apoyo institucionales (Decreto 1290 de 2009, art. 3) atienden la dificultad sin ese conflicto.", true]]}, {"id": "CB-115", "niv": 2, "e": "Días después, un colega le dice que usted «exagera» al apartarse del jurado, porque «en un pueblo todos son familia». Usted le responde que", "f": "Función Pública (2017). Código de Integridad del Servicio Público (honestidad, justicia); Ley 1952 de 2019, art. 44.", "o": [["A", "apartarse no es desconfiar de sí mismo, sino proteger la imparcialidad y la confianza de los participantes.", "El Código de Integridad (honestidad y justicia) orienta a no dar trato preferencial a personas cercanas y a actuar con imparcialidad; declararse impedido protege la confianza de la comunidad en el proceso.", true], ["B", "tiene razón, y que en adelante solo se apartará cuando se trate de un hijo o un hermano, por ser el vínculo más cercano.", "Responde a una dificultad real de los municipios pequeños, pero reduce el impedimento a un rango menor que el legal, que llega hasta el cuarto grado de consanguinidad.", false], ["C", "lo hizo porque el rector podría sancionarlo, aunque su objetividad estaba garantizada por la rúbrica de evaluación.", "Una rúbrica ayuda a la objetividad, pero no elimina el conflicto de intereses; además, presentar la decisión solo como temor a una sanción desconoce su sentido ético.", false]]}]}, {"comp": "competencias_blandas", "rol": "docente", "tag": "Competencias blandas y ciudadanas · Protección de datos de los estudiantes (Ley 1581 de 2012)", "texto": "Usted es director de grupo de quinto en una escuela oficial y administra un grupo de WhatsApp con los 34 acudientes del curso. Al cerrar el periodo, una madre le pide que publique en el grupo el listado de notas «para que cada uno sepa cómo va su hijo frente a los demás». La docente de apoyo le envió por correo el PIAR de Mateo, que incluye información de salud. En el chat, un padre pide «la lista de los niños que tienen problemas» para saber con quién se junta su hijo.", "items": [{"id": "CB-116", "niv": 1, "e": "Frente a la solicitud de publicar el listado de notas en el grupo, usted", "f": "Ley 1581 de 2012, arts. 3 y 4.", "o": [["A", "publica el listado completo, porque las calificaciones son información académica que la comunidad educativa tiene derecho a conocer.", "La transparencia es un valor, pero las notas de cada estudiante solo deben conocerlas él y su familia; publicarlas en un grupo masivo vulnera el principio de acceso y circulación restringida.", false], ["B", "informa los resultados a cada familia de manera individual y, si lo ve útil, comparte en el grupo solo datos generales del curso.", "Las calificaciones asociadas a un estudiante son datos personales (Ley 1581 de 2012, art. 3) y su circulación debe restringirse a quienes tienen derecho a conocerlos (art. 4, literal f). Los datos generales sin identificar a nadie no exponen a ningún niño.", true], ["C", "publica el listado usando las iniciales de cada estudiante, para que las familias identifiquen a su hijo sin exponer los nombres.", "Usar iniciales parece proteger a los niños, pero en un grupo de 34 familias que se conocen los estudiantes siguen siendo identificables, y un dato que puede asociarse a una persona determinable sigue siendo dato personal.", false]]}, {"id": "CB-117", "niv": 1, "e": "Respecto al PIAR de Mateo que recibió por correo, la manera adecuada de manejarlo es", "f": "Ley 1581 de 2012, arts. 4, 5 y 6; Ley 1098 de 2006, art. 33.", "o": [["A", "contar en el grupo de familias que Mateo tiene un diagnóstico, para que comprendan sus reacciones y lo apoyen.", "La intención de generar comprensión es buena, pero divulga un dato sensible de un niño sin autorización y puede exponerlo a estigmatización (Ley 1581, arts. 5 y 6; Ley 1098, art. 33).", false], ["B", "imprimirlo y dejarlo en la carpeta del curso en la sala de profesores, para que lo consulten los docentes que entran al grupo.", "Es cierto que otros docentes del grupo necesitan conocer los ajustes, pero dejar el documento en un espacio abierto permite el acceso de cualquier persona y desconoce el principio de seguridad.", false], ["C", "usarlo para planear los ajustes en el aula y guardarlo con acceso restringido, sin reenviarlo a quienes no participan en su atención.", "El PIAR contiene datos sensibles, como información de salud (Ley 1581 de 2012, art. 5). Debe usarse para su finalidad pedagógica y protegerse con medidas de seguridad y confidencialidad (art. 4, literales b, g y h).", true]]}, {"id": "CB-118", "niv": 2, "e": "Sobre el padre que pide «la lista de los niños que tienen problemas», usted", "f": "Ley 1581 de 2012, art. 4; Ley 1098 de 2006, art. 33.", "o": [["A", "le responde en privado que no puede dar información de otros niños y le pregunta qué le preocupa de su hijo.", "La información de otros estudiantes no puede entregarse a terceros sin autorización, y esa reserva obliga a todas las personas de la institución, incluida la orientadora (Ley 1581 de 2012, art. 4, literales f y h). Atender en privado la preocupación del padre protege a los niños y mantiene la comunicación con la familia.", true], ["B", "remite la pregunta a la orientadora escolar para que ella decida qué información puede entregarle al padre.", "Consultar a orientación es razonable en muchos casos, pero aquí nadie en la institución, tampoco la orientadora, puede entregar a un padre información de otros niños sin autorización de sus representantes. Remitirla sugiere que podría entregarse y deja la petición abierta.", false], ["C", "le comparte solo los nombres, sin los diagnósticos, para que pueda orientar a su hijo sin conocer detalles de salud.", "Omitir los diagnósticos parece prudente, pero señalar qué niños «tienen problemas» ya revela información sensible sobre ellos y puede llevar a que sean excluidos.", false]]}, {"id": "CB-119", "niv": 3, "e": "Para prevenir situaciones similares, la acción más coherente con la protección de datos de los estudiantes es", "f": "Ley 1581 de 2012, arts. 4 y 7; Decreto 1377 de 2013, art. 12.", "o": [["A", "cerrar el grupo de WhatsApp y comunicarse con las familias solo mediante circulares impresas, para eliminar el riesgo.", "Elimina un riesgo, pero sacrifica un canal útil de comunicación con las familias y no forma a nadie en el uso responsable de la información.", false], ["B", "pedir a cada familia que firme una autorización general para compartir en el grupo cualquier información de su hijo.", "Busca cumplir con la autorización, pero esta debe ser informada y para una finalidad concreta; una autorización general no permite divulgar datos sensibles ni responde al interés superior del niño (Decreto 1377 de 2013, art. 12).", false], ["C", "proponer acuerdos sobre el uso de los grupos de mensajería y formar a las familias sobre los riesgos de divulgar información de los niños.", "El artículo 7 de la Ley 1581 de 2012 asigna a las entidades educativas la tarea de informar y capacitar a los representantes legales sobre los riesgos del tratamiento indebido de los datos de niños, niñas y adolescentes.", true]]}]}, {"comp": "competencias_blandas", "rol": "docente", "tag": "Competencias blandas y ciudadanas · Habilidades socioemocionales en el aula", "texto": "Usted es docente de segundo grado en una escuela oficial. Durante el recreo, Juan Pablo, de siete años, le rompe el dibujo a una compañera porque ella no lo dejó jugar. Al volver al salón llega llorando, con los puños apretados, y grita que «nadie lo quiere». La compañera también llora. Faltan cinco minutos para iniciar la clase de matemáticas y el resto del grupo observa la escena en silencio.", "items": [{"id": "CB-120", "niv": 1, "e": "En ese momento, lo primero que usted hace con Juan Pablo es", "f": "MEN (2004). Estándares Básicos de Competencias Ciudadanas, Serie Guías n.º 6 (convivencia y paz, grados 1.° a 3.°).", "o": [["A", "pedirle que se disculpe de inmediato con su compañera, para que entienda que sus acciones tienen consecuencias.", "Asumir la responsabilidad es necesario, pero exigir una disculpa mientras el niño está desbordado produce una disculpa sin sentido y no lo ayuda a manejar su emoción.", false], ["B", "acercarse con calma, ayudarlo a respirar y a nombrar lo que siente antes de hablar de lo ocurrido.", "Los Estándares de Competencias Ciudadanas para los primeros grados plantean reconocer las emociones básicas, como la rabia y la tristeza, y aprender a manejarlas para no hacer daño (Guía 6, convivencia y paz). Con el niño desbordado, primero se regula la emoción.", true], ["C", "enviarlo a coordinación para que se tranquilice allí y no se interrumpa el inicio de la clase.", "Protege el tiempo de clase, pero aleja al niño de quien puede acompañarlo en ese momento y pierde la oportunidad de enseñarle a regular su emoción.", false]]}, {"id": "CB-121", "niv": 2, "e": "Una vez Juan Pablo está tranquilo, para abordar el daño causado a su compañera usted", "f": "Decreto 1965 de 2013, arts. 40 y 42; MEN (2004). Estándares Básicos de Competencias Ciudadanas, Serie Guías n.º 6 (convivencia y paz).", "o": [["A", "propicia que ambos expresen cómo se sintieron y que Juan Pablo proponga una forma de reparar el dibujo dañado.", "Es una situación esporádica sin daño al cuerpo (situación tipo I), que se maneja con mediación pedagógica y una solución reparadora (Decreto 1965 de 2013, arts. 40 y 42), y desarrolla empatía al escuchar la emoción del otro (Guía 6).", true], ["B", "le pide a la compañera que en adelante incluya a Juan Pablo en el juego, para evitar que la situación se repita.", "Atiende una causa del conflicto, pero traslada la responsabilidad a la niña afectada y no aborda el daño que Juan Pablo causó.", false], ["C", "le explica que romper el dibujo estuvo mal y le impone como consecuencia quedarse sin el próximo recreo.", "Fija un límite claro, pero la sanción no repara el daño a la compañera ni desarrolla la empatía; el protocolo para este tipo de situaciones privilegia la mediación y la reparación.", false]]}, {"id": "CB-122", "niv": 3, "e": "Si al día siguiente Juan Pablo vuelve a empujar a la misma compañera y ella cae y se lastima la rodilla, sin requerir incapacidad, usted", "f": "Decreto 1965 de 2013, arts. 40 y 43.", "o": [["A", "deja a Juan Pablo sin recreo durante la semana, para que entienda que no puede volver a agredir a su compañera.", "Pone un límite, pero omite la atención a la niña, la información a las familias y el protocolo; además, una sanción aislada no forma al niño en el manejo de su rabia.", false], ["B", "reúne a los dos niños para que conversen sobre lo ocurrido y acuerden cómo reparar el daño, como hizo el día anterior.", "El diálogo reparador es valioso, pero al repetirse la agresión y haber daño físico ya no se trata de una situación tipo I; la mediación sola es insuficiente frente al protocolo que corresponde.", false], ["C", "procura atención inmediata para la niña, informa a ambas familias y activa el protocolo institucional de convivencia.", "La agresión es repetida y causa daño al cuerpo sin incapacidad, lo que corresponde a una situación tipo II (Decreto 1965 de 2013, art. 40). Su protocolo exige atención inmediata en salud, informar a las familias de los involucrados y seguir la ruta institucional con el comité de convivencia (art. 43).", true]]}]}, {"comp": "competencias_blandas", "rol": "docente", "tag": "Competencias blandas y ciudadanas · Inclusión y no discriminación", "texto": "Usted es docente de ciencias naturales de octavo en un colegio oficial. Sara, una estudiante con baja visión, se vinculó al grupo este año y cuenta con PIAR. Para el proyecto de investigación del periodo, los estudiantes formaron equipos libremente y Sara quedó sola. Algunos compañeros comentan que «con ella se demoran más» y uno de ellos dice, en tono de broma, que Sara «debería estar en un colegio especial». Sara le pide a usted que la deje hacer el trabajo de manera individual.", "items": [{"id": "CB-123", "niv": 1, "e": "Ante el comentario de que Sara «debería estar en un colegio especial», usted", "f": "MEN (2004). Estándares Básicos de Competencias Ciudadanas, Serie Guías n.º 6 (pluralidad, identidad y valoración de las diferencias); Decreto 1421 de 2017.", "o": [["A", "lo deja pasar en ese momento por tratarse de una broma y después habla en privado con el estudiante que lo hizo.", "Hablar en privado con el estudiante es útil, pero dejar pasar el comentario frente al grupo transmite que excluir a una compañera es aceptable si se dice en broma.", false], ["B", "interviene con serenidad, señala que el comentario excluye a una compañera y luego reflexiona sobre él con el grupo.", "Detener la expresión excluyente cuando ocurre, sin humillar a nadie, y convertirla en reflexión colectiva corresponde a la pluralidad y valoración de las diferencias (Guía 6). La educación inclusiva reconoce el derecho de todos a aprender juntos en el aula (Decreto 1421 de 2017).", true], ["C", "pide al estudiante que se disculpe públicamente con Sara y registra la situación en el observador del estudiante.", "Muestra que la conducta no es aceptable, pero la disculpa forzada y la anotación no generan comprensión y vuelven a poner a Sara en el centro de la atención del grupo.", false]]}, {"id": "CB-124", "niv": 2, "e": "Frente a la solicitud de Sara de trabajar sola, usted", "f": "Decreto 1421 de 2017; MEN (2004). Estándares Básicos de Competencias Ciudadanas, Serie Guías n.º 6 (pluralidad).", "o": [["A", "conversa con ella sobre sus razones y le propone un equipo con roles en el que aporte con los apoyos que necesita.", "Escuchar a la estudiante y ofrecerle condiciones reales de participación responde a la educación inclusiva: los ajustes y apoyos buscan eliminar barreras para aprender con los demás (Decreto 1421 de 2017).", true], ["B", "acepta su solicitud, porque respetar la decisión de la estudiante sobre su forma de trabajar es también una forma de inclusión.", "Respetar su voz es importante, pero aceptar sin conversar consolida la exclusión que originó la solicitud y le quita la oportunidad de aprender con sus compañeros.", false], ["C", "la asigna al equipo con mejores resultados del curso, que puede ayudarla a avanzar más rápido.", "Busca darle apoyo, pero la ubica como alguien que necesita ser ayudado y no como una integrante que aporta; además, la decisión no considera lo que ella expresa.", false]]}, {"id": "CB-125", "niv": 2, "e": "Para que Sara participe en igualdad de condiciones en el proyecto, el apoyo más coherente con la normativa de inclusión es", "f": "Decreto 1421 de 2017 (ajustes razonables, currículo flexible, PIAR).", "o": [["A", "reducir los objetivos del proyecto para Sara, aunque su PIAR no lo contempla, para que tenga menos exigencias.", "Parece una forma de apoyo, pero el PIAR de Sara no prevé ese ajuste y el currículo flexible mantiene los mismos objetivos generales y ofrece distintas oportunidades para alcanzarlos; la baja visión no exige rebajar el aprendizaje.", false], ["B", "ajustar los materiales, con letra ampliada o formatos digitales, según las barreras identificadas en su PIAR.", "Los ajustes razonables se basan en las barreras que enfrenta la estudiante y se registran en el PIAR, manteniendo los mismos objetivos de aprendizaje para todos (Decreto 1421 de 2017).", true], ["C", "esperar a que la familia presente un concepto médico actualizado antes de hacer cualquier ajuste en el aula.", "Contar con información médica puede ser útil, pero los ajustes razonables no dependen de un diagnóstico sino de las barreras identificadas; esperar retrasa el apoyo.", false]]}, {"id": "CB-126", "niv": 3, "e": "Para transformar la forma en que el grupo conforma los equipos durante el año, la estrategia más pertinente es", "f": "MEN (2004). Estándares Básicos de Competencias Ciudadanas, Serie Guías n.º 6 (pluralidad); Decreto 1421 de 2017 (diseño universal para el aprendizaje).", "o": [["A", "asignar los equipos por orden de lista durante el resto del año, para que nadie vuelva a quedar excluido.", "Es una medida práctica que evita la exclusión en la conformación, pero no garantiza que dentro del equipo todos participen ni promueve la valoración de los aportes de cada estudiante.", false], ["B", "permitir que sigan eligiendo sus equipos, con la regla de incluir a cualquier compañero que haya quedado solo.", "Evita que alguien quede aislado, pero convierte la inclusión en una obligación impuesta y señala a quienes quedan solos, sin cambiar la forma de valorar los aportes de cada uno.", false], ["C", "diseñar trabajos cooperativos con roles rotativos y metas comunes, en los que cada uno dependa del aporte de los demás.", "La interdependencia positiva hace que cada estudiante sea necesario para el logro común y favorece la valoración de las diferencias (Guía 6). Además, el diseño universal propone actividades pensadas para todos desde el inicio (Decreto 1421 de 2017).", true]]}]}, {"comp": "competencias_blandas", "rol": "docente", "tag": "Competencias blandas y ciudadanas · Competencias ciudadanas: pluralidad, identidad y valoración de las diferencias (Guía 6)", "texto": "En un colegio oficial de Cúcuta, usted es docente de lengua castellana de sexto. Daniela, estudiante venezolana que llegó hace dos meses, casi no participa en clase. Varios compañeros imitan su acento y la llaman con un apodo despectivo por su nacionalidad. En la reunión de padres, una madre comenta que los estudiantes migrantes «les quitan los cupos a los colombianos» y otros padres asienten. Daniela le ha dicho a usted que no quiere que su mamá se entere de las burlas.", "items": [{"id": "CB-127", "niv": 1, "e": "Frente al apodo y las imitaciones del acento de Daniela, usted", "f": "Decreto 1965 de 2013, art. 39; Ley 1098 de 2006, art. 44, num. 5; MEN (2004). Estándares Básicos de Competencias Ciudadanas, Serie Guías n.º 6 (pluralidad).", "o": [["A", "detiene la situación en el momento, deja claro que esas burlas no se permiten y aplica lo previsto en el manual.", "Las burlas por el origen son agresiones verbales que afectan la convivencia (Decreto 1965 de 2013, art. 39), y la institución debe proteger a los estudiantes contra la discriminación y la burla de sus compañeros (Ley 1098 de 2006, art. 44, num. 5). Poner un límite claro y aplicar el manual es la respuesta inmediata que corresponde.", true], ["B", "abre una conversación con el grupo para que cada uno exprese cómo ve la llegada de estudiantes de otros países.", "El diálogo sobre la migración puede ser valioso más adelante, pero abrirlo en ese momento, sin detener la agresión, expone a Daniela y trata la burla como una opinión más.", false], ["C", "le sugiere a Daniela no prestar atención a los apodos, porque así los compañeros dejarán de usarlos con el tiempo.", "Busca protegerla de un enfrentamiento, pero le traslada la responsabilidad de soportar la agresión y deja intacta la conducta discriminatoria del grupo.", false]]}, {"id": "CB-128", "niv": 2, "e": "Para promover que el grupo valore la diversidad cultural, una actividad pertinente en su clase es", "f": "MEN (2004). Estándares Básicos de Competencias Ciudadanas, Serie Guías n.º 6 (pluralidad, identidad y valoración de las diferencias).", "o": [["A", "un proyecto en el que todos comparen expresiones, relatos y costumbres de los lugares de origen de sus familias.", "Involucra a todo el grupo en reconocer la diversidad de orígenes, incluidos los de las regiones de Colombia, sin poner a una sola estudiante en el centro. Corresponde a la pluralidad, identidad y valoración de las diferencias (Guía 6).", true], ["B", "pedir a Daniela que exponga ante el grupo las costumbres de Venezuela, para que sus compañeros la conozcan mejor.", "Quiere visibilizar su cultura, pero la señala como «la diferente», le asigna una carga que no pidió y puede aumentar la exposición que ya le genera malestar.", false], ["C", "evitar actividades sobre el origen de los estudiantes, para no resaltar diferencias que puedan generar más burlas.", "Busca no avivar el conflicto, pero ignorar la diversidad no la convierte en valor; la Guía 6 plantea reconocer y disfrutar la diversidad humana.", false]]}, {"id": "CB-129", "niv": 2, "e": "Ante el comentario de la madre en la reunión de padres, usted", "f": "MEN (2004). Estándares Básicos de Competencias Ciudadanas, Serie Guías n.º 6 (comunicación asertiva); Función Pública (2017). Código de Integridad del Servicio Público (justicia); Ley 1482 de 2011, modificada por la Ley 1752 de 2015.", "o": [["A", "le pide que se retire de la reunión, porque su comentario es discriminatorio y ofende a varias de las familias presentes.", "Reconoce el carácter discriminatorio del comentario, pero excluir a la madre cierra el diálogo y no contribuye a transformar la opinión de las familias presentes.", false], ["B", "responde con respeto que el colegio recibe a todos los estudiantes sin importar su origen y promueve la convivencia.", "Responder sin agredir, con claridad y firmeza, es una expresión asertiva (Guía 6). El valor de justicia del Código de Integridad orienta a actuar con igualdad y sin discriminación, y la ley sanciona la discriminación por nacionalidad (Ley 1482 de 2011, modificada por la Ley 1752 de 2015).", true], ["C", "evita responderle para no generar una discusión entre las familias, y continúa con el orden del día de la reunión.", "Evitar la confrontación cuida el clima de la reunión, pero el silencio de la institución frente a un comentario discriminatorio puede interpretarse como aprobación.", false]]}, {"id": "CB-130", "niv": 3, "e": "Si las burlas continúan de forma repetida durante varias semanas, además de las acciones pedagógicas usted debe", "f": "Ley 1620 de 2013, art. 19; Decreto 1965 de 2013, arts. 40, 43 y 44.", "o": [["A", "citar a los padres de los estudiantes que la molestan para que corrijan en casa la conducta de sus hijos.", "Involucrar a las familias es parte del protocolo, pero hacerlo por fuera de la ruta institucional deja sin atención y sin seguimiento la situación de Daniela.", false], ["B", "esperar a que Daniela o su familia presenten una queja formal, para no actuar en contra de lo que ella le pidió.", "Respetar la voluntad de Daniela es importante, pero el deber de reportar del docente no depende de una queja de la afectada; el protocolo protege a la estudiante y a la vez exige informar a su familia.", false], ["C", "reportar la situación según el protocolo, por ser posible acoso escolar, y explicarle a Daniela por qué debe hacerlo.", "Los docentes deben identificar, reportar y hacer seguimiento a los casos de acoso escolar (Ley 1620 de 2013, art. 19). Las agresiones repetidas o sistemáticas se atienden con el protocolo de las situaciones tipo II, o tipo III si constituyeran delito, y en ambos casos se informa a las familias de los involucrados (Decreto 1965 de 2013, arts. 40, 43 y 44). Explicarle a Daniela las razones respeta su voz sin renunciar a protegerla.", true]]}]}, {"comp": "competencias_blandas", "rol": "docente", "tag": "Competencias blandas y ciudadanas · Competencias ciudadanas: pluralidad, identidad y valoración de las diferencias (Guía 6)", "texto": "Usted es director de grupo de cuarto en una escuela oficial. La familia de Tomás, que pertenece a una iglesia cristiana no católica, le informa por escrito que no desea que su hijo reciba la clase de educación religiosa, cuyo programa institucional tiene orientación católica, ni que participe en la eucaristía de inicio de año. Una colega opina que «si estudia aquí, debe seguir lo que hacen todos». Algunos compañeros de Tomás ya preguntaron por qué él no estará en la eucaristía.", "items": [{"id": "CB-131", "niv": 1, "e": "Frente a la solicitud de la familia de Tomás, usted", "f": "Ley 115 de 1994, art. 23, parágrafo 1.°, y art. 24.", "o": [["A", "acepta la solicitud y permite que Tomás salga al patio durante esa clase, para que no se sienta incómodo.", "Respeta la decisión de la familia, pero deja a Tomás sin una actividad formativa durante ese tiempo y sin el acompañamiento al que tiene derecho.", false], ["B", "respeta la decisión y coordina con la institución una actividad formativa para Tomás durante esa clase.", "La Ley 115 de 1994 (art. 23, parágrafo 1.°, y art. 24) establece que en los establecimientos del Estado ninguna persona puede ser obligada a recibir educación religiosa y reconoce el derecho de los padres a escoger el tipo de educación de sus hijos. La alternativa formativa garantiza que el tiempo sea pedagógico.", true], ["C", "explica a la familia que la educación religiosa es un área obligatoria del plan de estudios y que Tomás debe cursarla.", "Es cierto que la educación religiosa es un área que la institución debe ofrecer, pero la misma ley garantiza que en los establecimientos oficiales nadie puede ser obligado a recibirla.", false]]}, {"id": "CB-132", "niv": 2, "e": "Ante la opinión de la colega de que Tomás «debe seguir lo que hacen todos», usted le responde que", "f": "Ley 115 de 1994, art. 24; MEN (2004). Estándares Básicos de Competencias Ciudadanas, Serie Guías n.º 6 (pluralidad).", "o": [["A", "tiene razón en lo general, pero que para evitar un conflicto con la familia es mejor hacer una excepción con Tomás.", "Busca una salida conciliadora, pero presenta un derecho como un favor o una excepción, lo que refuerza la idea de que lo normal es imponer una sola creencia.", false], ["B", "la decisión le corresponde al consejo directivo, que debe autorizar cada caso de exención del área.", "Remitir a una instancia formal parece ordenado, pero el derecho a no recibir educación religiosa en un establecimiento oficial no depende de una autorización del consejo directivo.", false], ["C", "la libertad de cultos y el respeto a la diferencia impiden que la escuela le imponga una práctica religiosa.", "La Ley 115 (art. 24) protege la libertad de conciencia y de cultos, y la Guía 6 plantea que la valoración de las diferencias tiene como límite los derechos de los demás. Integrar no significa uniformar las creencias.", true]]}, {"id": "CB-133", "niv": 3, "e": "Para que la situación sea también una oportunidad formativa para el grupo, usted", "f": "MEN (2004). Estándares Básicos de Competencias Ciudadanas, Serie Guías n.º 6 (pluralidad); Ley 1581 de 2012, art. 5; Ley 1098 de 2006, art. 33.", "o": [["A", "desarrolla, sin referirse a Tomás, actividades para conocer distintas creencias y reflexionar sobre el respeto a la diferencia.", "Trabaja la pluralidad con todo el grupo (Guía 6) sin exponer las convicciones religiosas de Tomás, que son un dato sensible (Ley 1581 de 2012, art. 5) y parte de su intimidad (Ley 1098 de 2006, art. 33).", true], ["B", "evita tratar temas religiosos con el grupo durante el año, para no generar comparaciones entre los estudiantes.", "Previene comparaciones, pero desaprovecha la oportunidad de formar en el respeto a la diversidad de creencias, que es parte de las competencias ciudadanas.", false], ["C", "pide a Tomás que explique al grupo las creencias de su iglesia, para que sus compañeros comprendan su decisión.", "Busca generar comprensión, pero expone las convicciones religiosas del niño ante el grupo y le asigna la carga de justificar una decisión que tomó su familia.", false]]}]}, {"comp": "competencias_blandas", "rol": "docente", "tag": "Competencias blandas y ciudadanas · Liderazgo y trabajo en equipo (Guía 31)", "texto": "Usted y tres colegas de distintas áreas lideran el proyecto transversal de educación ambiental de séptimo. Acordaron que cada uno desarrollaría una actividad con sus grupos y que presentarían avances cada quince días. El docente de educación física no ha entregado avances en dos reuniones; cuando usted le pregunta, responde que «tiene demasiadas cosas» y que el proyecto «no es de su área». Otra colega propone en el chat del equipo informar al coordinador para que «le llame la atención».", "items": [{"id": "CB-134", "niv": 1, "e": "Para abordar la situación con el docente de educación física, usted primero", "f": "MEN (2008). Guía 31, Anexo 1: Glosario de competencias (trabajo en equipo; comunicación y relaciones interpersonales).", "o": [["A", "le recuerda por escrito en el chat del equipo los compromisos acordados, para que quede constancia.", "Dejar constancia puede ser útil más adelante, pero como primer paso expone al colega ante el grupo y no permite conocer las razones de su incumplimiento.", false], ["B", "asume la parte del trabajo que le corresponde a él, para que el proyecto no se retrase mientras se pone al día.", "Muestra compromiso con el proyecto, pero no construye colaboración, sobrecarga a un miembro del equipo y deja sin resolver la falta de participación.", false], ["C", "conversa en privado con él para conocer sus dificultades y buscar juntos una forma de participar acorde con su carga.", "Escuchar y buscar acuerdos corresponde a la competencia de trabajo en equipo y a la de comunicación y relaciones interpersonales: considerar las contribuciones de los demás y construir relaciones de colaboración (Guía 31).", true]]}, {"id": "CB-135", "niv": 2, "e": "Si usted ya conversó dos veces con el docente, él se comprometió y no cumplió, y la entrega es en una semana, frente a la propuesta de informar al coordinador usted", "f": "MEN (2008). Guía 31, Anexo 1: Glosario de competencias (negociación y mediación; compromiso social e institucional).", "o": [["A", "la apoya e informa al coordinador los acuerdos incumplidos, para que se reorganice el trabajo a tiempo.", "Agotado el diálogo directo y con la entrega encima, informar con hechos concretos a quien puede reorganizar el trabajo es una intervención oportuna y responsable con el objetivo común (Guía 31, negociación y mediación; compromiso social e institucional).", true], ["B", "propone una tercera conversación con el docente para intentar un nuevo acuerdo antes de acudir a la coordinación.", "El diálogo es el primer recurso, pero ya se intentó dos veces sin resultado; insistir a una semana de la entrega pone en riesgo el proyecto y posterga una decisión necesaria.", false], ["C", "le pide que no lo haga, porque escalar el problema dañaría la relación del
