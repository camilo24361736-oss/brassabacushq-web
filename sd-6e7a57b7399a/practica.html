], ["B", "neutralidad cultural, autonomía docente y centralización de contenidos.", "La ley no plantea neutralidad cultural ni centralización: exige participación comunitaria y flexibilidad, de modo que los saberes propios entren al currículo con la comunidad.", false], ["C", "interculturalidad, diversidad lingüística y participación comunitaria.", "El artículo 56 de la Ley 115 establece que la educación en los grupos étnicos tendrá en cuenta los criterios de integralidad, interculturalidad, diversidad lingüística, participación comunitaria, flexibilidad y progresividad.", true]]}, {"id": "NR-109", "niv": 2, "e": "Sobre la selección del docente que reemplazará a la maestra que se jubila, la Ley 115 de 1994 dispone que", "f": "Ley 115 de 1994, artículo 62.", "o": [["A", "se aplique el listado general de elegibles, sin considerar la lengua ni la pertenencia a la comunidad.", "El artículo 62 exige que los educadores de estos territorios acrediten formación en etnoeducación y conocimientos básicos del grupo, en especial de su lengua materna; no basta el orden de un listado general.", false], ["B", "la autoridad tradicional la haga directamente, sin intervención de la entidad territorial certificada.", "La ley habla de concertación entre las autoridades competentes y los grupos étnicos, no de una designación unilateral de la autoridad tradicional; además, la vinculación se rige por el estatuto docente y las normas especiales (artículo 62, inciso segundo).", false], ["C", "las autoridades competentes la hagan en concertación con el grupo étnico, preferiblemente entre miembros de la comunidad.", "El artículo 62 dispone que las autoridades competentes, en concertación con los grupos étnicos, seleccionen a los educadores que laboren en sus territorios, preferiblemente entre los miembros de las comunidades allí radicados, con formación en etnoeducación y conocimiento de la lengua materna y del castellano.", true]]}, {"id": "NR-110", "niv": 3, "e": "Respecto del ofrecimiento de la fundación internacional de aplicar su propio currículo, la condición que exige la Ley 115 de 1994 es", "f": "Ley 115 de 1994, artículo 60.", "o": [["A", "contar con la aprobación del Ministerio de Educación y con el consentimiento de las comunidades interesadas.", "El artículo 60 prohíbe la injerencia de organismos internacionales, públicos o privados, en la educación de los grupos étnicos sin la aprobación del Ministerio de Educación Nacional y sin el consentimiento de las comunidades interesadas. Se requieren las dos condiciones.", true], ["B", "contar con el consentimiento de la comunidad, porque la etnoeducación no depende del Ministerio.", "El consentimiento comunitario es necesario pero no suficiente; el artículo 60 también exige la aprobación del Ministerio de Educación Nacional.", false], ["C", "contar con la aprobación del director y del consejo directivo del centro etnoeducativo.", "La decisión no es solo institucional: el artículo 60 exige la aprobación del Ministerio de Educación Nacional y el consentimiento de las comunidades.", false]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Fines de la educación y enseñanza obligatoria (Ley 115 de 1994, arts. 5 y 14)", "texto": "En una institución de básica y media de Cartagena, el consejo académico le encarga a usted coordinar un proyecto sobre el cuidado de los manglares y el uso responsable del agua. Durante la planeación, algunos docentes proponen crear una asignatura nueva de «educación ambiental» con dos horas semanales y otra de «educación sexual», mientras otros sostienen que esos temas deben trabajarse desde todas las áreas. Un colega afirma que ninguno de los temas de enseñanza obligatoria de la Ley 115 requiere asignatura propia. Usted debe orientar la discusión con base en la norma.", "items": [{"id": "NR-111", "niv": 1, "e": "Sobre la forma de abordar la educación ambiental y la educación sexual, usted explica que la Ley 115 de 1994 dispone que estos temas", "f": "Ley 115 de 1994, artículo 14 y parágrafo 1; Decreto 1860 de 1994, artículo 36.", "o": [["A", "son optativos y cada institución decide si los incluye o no en su proyecto educativo.", "El artículo 14 los establece como de cumplimiento obligatorio en todos los establecimientos oficiales o privados que ofrezcan preescolar, básica y media; no son optativos.", false], ["B", "son obligatorios y deben incorporarse al currículo y desarrollarse a través de todo el plan de estudios.", "El parágrafo 1 del artículo 14 de la Ley 115 señala que, salvo los literales a) y b), la enseñanza obligatoria no exige asignatura específica y debe incorporarse al currículo y desarrollarse a través de todo el plan de estudios. La educación ambiental (literal c) y la sexual (literal e) están en ese caso.", true], ["C", "son obligatorios y deben dictarse como asignaturas independientes, cada una con intensidad horaria propia en el plan.", "La ley no exige asignaturas independientes para estos temas; el parágrafo 1 del artículo 14 los plantea como formación transversal, que el Decreto 1860 de 1994 (artículo 36) organiza mediante proyectos pedagógicos.", false]]}, {"id": "NR-112", "niv": 1, "e": "El proyecto de los manglares se relaciona directamente con el fin de la educación que busca", "f": "Ley 115 de 1994, artículo 5, numerales 8, 10 y 11.", "o": [["A", "la formación en la práctica del trabajo, mediante conocimientos técnicos y habilidades, como fundamento del desarrollo individual y social.", "Es el fin del numeral 11 del artículo 5; aunque el proyecto pueda incluir actividades prácticas, su propósito central es ambiental.", false], ["B", "la creación de una conciencia de soberanía nacional y de integración con Latinoamérica.", "Corresponde al numeral 8 del artículo 5, sobre soberanía nacional e integración con Latinoamérica y el Caribe; no describe el propósito del proyecto.", false], ["C", "la adquisición de una conciencia para la conservación, protección y mejoramiento del ambiente.", "El numeral 10 del artículo 5 de la Ley 115 establece como fin la adquisición de una conciencia para la conservación, protección y mejoramiento del medio ambiente, de la calidad de la vida y del uso racional de los recursos naturales.", true]]}, {"id": "NR-113", "niv": 3, "e": "Frente a la afirmación del colega, usted precisa que la Ley 115 de 1994 exceptúa de la regla de no exigir asignatura específica", "f": "Ley 115 de 1994, artículo 14, parágrafo 1.", "o": [["A", "la educación sexual y la protección del ambiente, por tratarse de temas de salud pública.", "Son justamente temas que la norma trata como transversales (literales c y e del artículo 14), sin asignatura específica.", false], ["B", "el estudio de la Constitución e instrucción cívica y lo relativo a tiempo libre, educación física y deporte.", "El parágrafo 1 del artículo 14 establece que la regla de no exigir asignatura específica aplica «salvo los numerales a) y b)»: el estudio de la Constitución y la instrucción cívica, y el aprovechamiento del tiempo libre, la educación física, la recreación y el deporte formativo.", true], ["C", "la educación para la justicia, la paz, la democracia y la solidaridad, por su carácter ciudadano.", "La educación para la justicia, la paz y la democracia (literal d) no está entre las excepciones del parágrafo 1, que comprende solo los literales a) y b).", false]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Niveles y objetivos de la educación formal (Ley 115 de 1994)", "texto": "Usted es docente en una institución rural de Boyacá que ofrece desde transición hasta grado once, con media académica y media técnica agropecuaria. Este año le asignaron horas en transición y en la media, y debe ajustar su planeación a los objetivos que la ley fija para cada nivel. En la reunión con acudientes de décimo, un padre pregunta si en la media académica «se dejan de ver» algunas áreas de la básica, y otra madre pregunta si el título de bachiller técnico le permite a su hijo entrar a la universidad o solo sirve para trabajar.", "items": [{"id": "NR-114", "niv": 1, "e": "Al planear para el grado de transición, usted identifica como objetivo específico del nivel preescolar", "f": "Ley 115 de 1994, artículos 16, 22 y 30.", "o": [["A", "el conocimiento del propio cuerpo y de sus posibilidades de acción, y la adquisición de identidad y autonomía.", "Es el literal a) del artículo 16 de la Ley 115, que fija los objetivos específicos del nivel preescolar.", true], ["B", "la profundización en un campo específico del conocimiento de acuerdo con los intereses y capacidades del educando.", "Es el literal a) del artículo 30, objetivo específico de la educación media académica.", false], ["C", "la iniciación en los campos más avanzados de la tecnología moderna y en técnicas de utilidad social.", "Corresponde al literal g) del artículo 22, que fija objetivos específicos del ciclo de secundaria, no del preescolar.", false]]}, {"id": "NR-115", "niv": 2, "e": "A la pregunta sobre el título de bachiller técnico, usted responde correctamente que la media técnica", "f": "Ley 115 de 1994, artículos 28, 32 y 33.", "o": [["A", "prepara solo para el trabajo, por lo que el joven debe validar la media académica para ir a la universidad.", "El literal c) del artículo 33 incluye entre los objetivos de la media técnica la formación que permita el ingreso a la educación superior; no es necesario validar la media académica.", false], ["B", "prepara para el trabajo, y su título solo permite ingresar a programas técnicos del mismo sector productivo.", "El artículo 28 no limita el título de la media técnica: habilita para la educación superior en cualquiera de sus niveles y carreras.", false], ["C", "prepara para el desempeño laboral y para continuar en la educación superior, y su título habilita para ingresar a ella.", "El artículo 32 dispone que la media técnica prepara para el desempeño laboral y para la continuación en la educación superior; el artículo 28 señala que al término de la media se obtiene el título de bachiller, que habilita para ingresar a la educación superior en cualquiera de sus niveles y carreras.", true]]}, {"id": "NR-116", "niv": 3, "e": "Sobre las áreas de la media académica, usted aclara al padre que, según la Ley 115 de 1994,", "f": "Ley 115 de 1994, artículo 31 y parágrafo.", "o": [["A", "las áreas de la básica se sustituyen por las asignaturas de profundización que elija cada estudiante.", "El parágrafo del artículo 31 permite intensificar en ciertos campos según la vocación del estudiante, pero aclara que todas las áreas de la media académica siguen siendo obligatorias y fundamentales.", false], ["B", "se mantienen las áreas de la básica en un nivel más avanzado, y se suman ciencias económicas, políticas y filosofía.", "El artículo 31 dispone que en la media académica son obligatorias y fundamentales las mismas áreas de la educación básica en un nivel más avanzado, además de las ciencias económicas, políticas y la filosofía.", true], ["C", "solo son obligatorias las áreas evaluadas en el examen de Estado, y las demás pasan a ser optativas.", "Ninguna norma reduce las áreas obligatorias a las que evalúa el examen de Estado; el artículo 31 mantiene todas las áreas de la básica.", false]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Currículo, plan de estudios y autonomía escolar (Ley 115 de 1994, arts. 23 y 77 a 79)", "texto": "En una institución oficial de secundaria de Pereira, el consejo académico estudia una propuesta para el próximo año: crear la asignatura «Emprendimiento y finanzas» dentro del área de tecnología e informática, reducir la intensidad de educación artística para liberar horas y destinar más del 25 % del tiempo del plan de estudios a asignaturas optativas. Usted representa el área de matemáticas en el consejo y debe argumentar, con base en la ley, qué cambios son viables y qué trámite deben seguir.", "items": [{"id": "NR-117", "niv": 1, "e": "Al revisar la propuesta, usted recuerda que los grupos de áreas obligatorias y fundamentales deben comprender", "f": "Ley 115 de 1994, artículos 23 y 79.", "o": [["A", "como mínimo el 80 % del plan de estudios, lo que limita el tiempo disponible para optativas.", "El artículo 23 de la Ley 115 establece que las áreas obligatorias y fundamentales comprenderán un mínimo del 80 % del plan de estudios. Destinar más del 25 % a optativas dejaría menos del 75 % para esas áreas, por debajo del mínimo.", true], ["B", "como mínimo el 60 % del plan de estudios, por lo que la propuesta cabe holgadamente dentro de la norma.", "El porcentaje legal es 80 %, no 60 %. Con el 60 % la propuesta parecería viable, pero la ley exige más tiempo para las áreas obligatorias y fundamentales.", false], ["C", "la totalidad del plan de estudios, por lo que no es posible incluir asignaturas optativas.", "El artículo 79 define el plan de estudios como esquema de áreas obligatorias y fundamentales y de áreas optativas; el 80 % es un mínimo, de modo que sí hay espacio para una parte optativa.", false]]}, {"id": "NR-118", "niv": 2, "e": "Respecto de crear la asignatura de emprendimiento, usted argumenta que la institución", "f": "Ley 115 de 1994, artículos 23, 77 y 78.", "o": [["A", "requiere autorización previa del Ministerio de Educación para cualquier asignatura que no esté prevista en la ley.", "La creación de asignaturas optativas hace parte de la autonomía escolar del artículo 77; no exige autorización previa del Ministerio, que diseña lineamientos generales (artículo 78).", false], ["B", "puede introducir asignaturas optativas dentro de las áreas establecidas, en el marco de la ley y del PEI.", "El artículo 77 de la Ley 115 reconoce autonomía para organizar las áreas fundamentales, introducir asignaturas optativas dentro de las áreas establecidas en la ley y adaptar algunas áreas a las necesidades regionales, dentro de los límites de la ley, del PEI y de los lineamientos del Ministerio.", true], ["C", "puede reemplazar con ella el área de educación artística, si el consejo directivo lo aprueba.", "La educación artística es un área obligatoria y fundamental (artículo 23, numeral 3); la autonomía permite organizarla, no sustituirla por una asignatura optativa.", false]]}, {"id": "NR-119", "niv": 3, "e": "Si finalmente el consejo directivo adopta cambios significativos en el currículo, la Ley 115 de 1994 dispone que el rector", "f": "Ley 115 de 1994, artículos 77 y 78.", "o": [["A", "los envíe al Ministerio de Educación Nacional para que los apruebe mediante resolución antes de aplicarlos.", "La ley no prevé una aprobación ministerial previa del currículo de cada institución: el Ministerio diseña lineamientos generales y la verificación la hace la secretaría de educación.", false], ["B", "los aplique de inmediato sin informar a ninguna autoridad, en virtud de la autonomía escolar.", "La autonomía del artículo 77 opera dentro de los límites de la ley; el artículo 78 exige presentar los cambios significativos a la secretaría de educación para su verificación.", false], ["C", "los presente a la secretaría de educación para que verifique el cumplimiento de los requisitos legales.", "El inciso tercero del artículo 78 establece que, cuando haya cambios significativos en el currículo, el rector de la institución oficial o privada lo presentará a la secretaría de educación departamental o distrital, o al organismo que haga sus veces, para que verifique el cumplimiento de los requisitos de ley.", true]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Proyecto Educativo Institucional (Ley 115 de 1994, art. 73; Decreto 1860 de 1994, arts. 14 y 15)", "texto": "Una institución educativa de Villavicencio inicia la actualización de su Proyecto Educativo Institucional (PEI). El rector conforma mesas de trabajo con docentes, padres, estudiantes y egresados, y usted coordina la mesa de docentes. Durante el proceso surgen tres inquietudes: qué aspectos debe contener como mínimo el PEI, quién lo adopta formalmente y qué trámite debe seguir una propuesta de modificación que el consejo de estudiantes presentó meses después de su adopción.", "items": [{"id": "NR-120", "niv": 1, "e": "Entre los aspectos que el PEI debe contener como mínimo, según el Decreto 1860 de 1994, se encuentran", "f": "Decreto 1860 de 1994, artículo 14.", "o": [["A", "las acciones pedagógicas para la educación en democracia, sexualidad, tiempo libre y ambiente.", "El numeral 6 del artículo 14 del Decreto 1860 de 1994 incluye entre los contenidos mínimos del PEI las acciones pedagógicas relacionadas con la educación para el ejercicio de la democracia, la educación sexual, el uso del tiempo libre, el aprovechamiento y conservación del ambiente y los valores humanos.", true], ["B", "los listados de estudiantes beneficiarios de los programas de alimentación escolar.", "Los listados de beneficiarios son información operativa de un programa; no figuran entre los catorce aspectos mínimos del artículo 14 del Decreto 1860.", false], ["C", "las hojas de vida y los resultados de la evaluación de desempeño de cada docente.", "La evaluación individual de desempeño es un proceso del Decreto 1278 de 2002 a cargo del rector; no es un contenido del PEI. El artículo 14 sí incluye la evaluación de los recursos humanos disponibles y previstos, que es algo distinto.", false]]}, {"id": "NR-121", "niv": 2, "e": "Una vez terminada la deliberación, el PEI debe ser adoptado por", "f": "Decreto 1860 de 1994, artículos 15 y 24.", "o": [["A", "el consejo directivo, en consulta con el consejo académico, que luego lo divulga entre la comunidad.", "El numeral 2 del artículo 15 del Decreto 1860 de 1994 establece que la propuesta se somete al consejo directivo, que en consulta con el consejo académico la revisa, integra sus componentes y procede a adoptarla y divulgarla.", true], ["B", "el rector, mediante resolución, después de escuchar las recomendaciones del consejo de padres.", "Al rector le corresponde orientar el proceso y presentar el plan operativo, pero la adopción del PEI es competencia del consejo directivo (artículo 15, numeral 2).", false], ["C", "el consejo académico, por ser la instancia superior de orientación pedagógica del establecimiento educativo.", "El consejo académico actúa como órgano consultor del consejo directivo en la revisión del PEI (Decreto 1860, artículo 24, literal a), pero no lo adopta.", false]]}, {"id": "NR-122", "niv": 3, "e": "Frente a la propuesta de modificación del consejo de estudiantes, el procedimiento previsto en el Decreto 1860 de 1994 es", "f": "Decreto 1860 de 1994, artículo 15, numeral 3 y parágrafo.", "o": [["A", "presentarla a la secretaría de educación, que es la autoridad competente para modificar el PEI.", "La secretaría de educación asesora a los establecimientos que lo soliciten en el proceso del PEI (artículo 15, parágrafo), pero no lo modifica: la decisión corresponde al consejo directivo.", false], ["B", "presentarla al rector, quien la somete a discusión de los demás estamentos antes de que decida el consejo directivo.", "El numeral 3 del artículo 15 del Decreto 1860 dispone que las modificaciones al PEI pueden ser solicitadas al rector por cualquier estamento; este las somete a discusión de los demás estamentos y luego el consejo directivo decide, previa consulta con el consejo académico.", true], ["C", "presentarla al consejo académico, que la adopta directamente si la aprueba la mayoría de sus miembros.", "El consejo académico es consultado, pero la decisión sobre las modificaciones corresponde al consejo directivo, después de la discusión de los estamentos.", false]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Manual de convivencia (Ley 115 de 1994; Ley 1098 de 2006; Ley 2025 de 2020)", "texto": "En una institución oficial de Soacha, el comité encargado de actualizar el manual de convivencia recibe dos propuestas de un grupo de acudientes: que los estudiantes que lleguen tarde tres veces limpien los baños durante el descanso frente a sus compañeros, «para que aprendan», y que a los padres que falten a la escuela de padres se les cobre una multa de $20.000 destinada al fondo de la institución. Usted, como representante de los docentes en el comité, debe pronunciarse sobre la legalidad de ambas propuestas antes de que el texto pase al consejo directivo.", "items": [{"id": "NR-123", "niv": 1, "e": "Sobre el alcance del manual una vez sea adoptado, usted recuerda que, según la Ley 115 de 1994, los padres y los estudiantes", "f": "Ley 115 de 1994, artículo 87; Decreto 1860 de 1994, artículo 17.", "o": [["A", "solo quedan obligados si firman un acta de adhesión independiente al inicio de cada período.", "La ley vincula la aceptación del manual a la firma de la matrícula; no exige actas de adhesión por período.", false], ["B", "quedan obligados los estudiantes, pero no los padres o acudientes, porque estos no hacen parte del manual.", "El artículo 87 menciona expresamente a los padres o tutores entre quienes aceptan el manual al firmar la matrícula; además, el manual regula las relaciones de los estudiantes con los demás estamentos (Decreto 1860 de 1994, artículo 17).", false], ["C", "lo aceptan al firmar la matrícula, acto en el que los padres actúan en representación de sus hijos.", "El artículo 87 de la Ley 115 establece que el manual define los derechos y obligaciones de los estudiantes y que los padres o tutores y los educandos, al firmar la matrícula correspondiente en representación de sus hijos, lo aceptan.", true]]}, {"id": "NR-124", "niv": 2, "e": "Frente a la propuesta de que los estudiantes impuntuales limpien los baños ante sus compañeros, usted debe señalar que", "f": "Ley 1098 de 2006, artículo 45.", "o": [["A", "puede incluirse como medida restaurativa, siempre que se aplique una sola vez y con acompañamiento del docente.", "Una medida restaurativa repara el daño y respeta la dignidad; exponer al estudiante ante sus compañeros es humillante, sin importar su duración, y el artículo 45 lo prohíbe.", false], ["B", "puede incluirse si la aprueba la mayoría de los padres en la asamblea general y queda escrita en el manual.", "La aprobación de los padres no vuelve legal una sanción humillante: la prohibición del artículo 45 de la Ley 1098 no admite excepciones por votación.", false], ["C", "no puede incluirse, porque la ley prohíbe sanciones que afecten la dignidad de los estudiantes, también en el manual.", "El artículo 45 de la Ley 1098 de 2006 prohíbe a directivos y educadores imponer sanciones que conlleven maltrato físico o psicológico o adoptar medidas que afecten la dignidad de los estudiantes, y prohíbe su inclusión en los manuales de convivencia bajo cualquier modalidad.", true]]}, {"id": "NR-125", "niv": 2, "e": "Respecto de la multa a los padres que no asistan a la escuela de padres, usted explica que", "f": "Ley 2025 de 2020, artículo 4.", "o": [["A", "procede, porque la asistencia es obligatoria desde que los padres firman el compromiso en la matrícula.", "Es cierto que los padres firman el compromiso de asistir al matricular (artículo 4), pero la misma norma limita las consecuencias de la inasistencia a sanciones pedagógicas no pecuniarias.", false], ["B", "no procede, porque la ley solo admite sanciones pedagógicas no pecuniarias, previstas en el manual y con derecho de defensa.", "El artículo 4 de la Ley 2025 de 2020 permite a las instituciones implementar únicamente sanciones pedagógicas no pecuniarias por inasistencia, siempre que estén estipuladas en el manual de convivencia, se respete el derecho de defensa y su incorporación esté definida en el PEI.", true], ["C", "procede si el consejo directivo aprueba el valor de la multa y su destinación en el presupuesto anual.", "El consejo directivo aprueba el presupuesto de los recursos propios, pero no puede crear una sanción pecuniaria que la Ley 2025 excluye expresamente.", false]]}, {"id": "NR-126", "niv": 3, "e": "Una madre no asistió a una sesión de la escuela de padres porque su empleador le negó el permiso. De acuerdo con la Ley 2025 de 2020, esta inasistencia", "f": "Ley 2025 de 2020, artículo 4, parágrafo.", "o": [["A", "constituye una justa causa, por lo que no procede la sanción pedagógica prevista en el manual.", "El parágrafo del artículo 4 de la Ley 2025 de 2020 reconoce como justas causas de inasistencia el caso fortuito, la fuerza mayor y la negativa del empleador a dar permiso al trabajador para asistir.", true], ["B", "no constituye justa causa, porque el compromiso firmado en la matrícula prevalece sobre la relación laboral.", "El compromiso de asistir no elimina las justas causas que la misma ley prevé; la negativa del empleador está reconocida en el parágrafo del artículo 4.", false], ["C", "no constituye justa causa, porque la ley solo reconoce la enfermedad grave y la calamidad doméstica.", "La ley no limita las justas causas a esos eventos; incluye de forma expresa la negativa del empleador, además del caso fortuito y la fuerza mayor.", false]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Escuelas para padres, madres y cuidadores (Ley 2025 de 2020)", "texto": "Usted lidera, junto con la orientadora, el diseño de la escuela de padres, madres y cuidadores de una institución que tiene una sede urbana y cuatro sedes rurales en el Cauca. Muchas familias viven a más de una hora de la sede principal y trabajan en jornadas largas. El rector le pide definir cuántos encuentros programar en el año, en qué documento institucional debe quedar formalizado el programa y qué temas no pueden faltar en su estructura.", "items": [{"id": "NR-127", "niv": 1, "e": "Sobre el número de encuentros, la Ley 2025 de 2020 señala como mínimo deseable", "f": "Ley 2025 de 2020, artículos 5 y 6 (parágrafo 1).", "o": [["A", "tres momentos de encuentro durante el año escolar.", "El parágrafo 1 del artículo 6 de la Ley 2025 de 2020 fija como mínimo deseable tres momentos de encuentro durante el año escolar; la institución puede programar más según su contexto.", true], ["B", "un momento de encuentro en cada mes del año escolar.", "La ley no exige encuentros mensuales; el mínimo deseable es de tres en el año y la periodicidad la define cada institución (artículo 5).", false], ["C", "un momento de encuentro al inicio del año escolar.", "Un solo encuentro queda por debajo del mínimo deseable de tres que establece el parágrafo 1 del artículo 6.", false]]}, {"id": "NR-128", "niv": 2, "e": "En cuanto a su formalización, la Ley 2025 de 2020 exige que la escuela de padres", "f": "Ley 2025 de 2020, artículos 3, 5 y 7.", "o": [["A", "se rija por un programa único que la secretaría de educación diseña para todas las instituciones.", "A las entidades territoriales certificadas les corresponde promover la implementación e incluir el tema en la formación docente (artículo 7); el diseño lo hace cada institución con autonomía, en asocio con el consejo directivo (artículo 5).", false], ["B", "funcione como un programa independiente del PEI, definido cada año por la asociación de padres de familia de la institución.", "La ley exige lo contrario: articular el programa al PEI mediante un apartado especial (artículo 3); su estructura la definen la institución y el consejo directivo (artículo 5).", false], ["C", "tenga un apartado especial en el PEI, articulado con la misión, la visión, los principios y los valores institucionales.", "El artículo 3 de la Ley 2025 de 2020 dispone que toda institución pública y privada debe tener un apartado especial en el PEI que defina cómo se desarrollará el programa, alineado y articulado con su misión, visión, principios y valores.", true]]}, {"id": "NR-129", "niv": 3, "e": "Al definir los contenidos, usted tiene en cuenta que, por disposición expresa de la ley, la estructura de la escuela de padres debe contar con", "f": "Ley 2025 de 2020, artículo 5 y parágrafo.", "o": [["A", "un taller exclusivo de técnicas de estudio, que reemplace los demás contenidos para las familias rurales.", "Los instrumentos de técnicas de estudio son uno de los contenidos mínimos (literal I), pero no reemplazan a los demás ni son el taller exclusivo que exige el parágrafo del artículo 5.", false], ["B", "un taller exclusivo para prevenir y atender la violencia sexual contra niños, niñas y adolescentes desde las familias.", "El parágrafo del artículo 5 de la Ley 2025 de 2020 ordena que, en desarrollo de los literales C, E, G y J, la estructura cuente con un taller exclusivo que permita prevenir y atender la violencia sexual contra niños, niñas y adolescentes desde el interior de las familias.", true], ["C", "un módulo exclusivo de emprendimiento familiar, para mejorar las condiciones económicas de los hogares.", "El emprendimiento no figura entre los contenidos mínimos del artículo 5; el taller exclusivo que la ley exige es el de prevención y atención de la violencia sexual.", false]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Gobierno escolar (Ley 115 de 1994, arts. 142 a 145; Decreto 1860 de 1994, arts. 20 a 23)", "texto": "Es la segunda semana de clases en una institución oficial de Neiva que ofrece preescolar, básica y media. El rector convoca a la asamblea de docentes para elegir a sus representantes ante el consejo directivo y para designar a los docentes que integrarán el consejo académico. Usted, recién trasladado desde otro departamento, pregunta cuáles son los órganos del gobierno escolar, cuántos representantes deben elegir los docentes, en qué plazo debe quedar integrado el consejo directivo y qué funciones tiene cada órgano.", "items": [{"id": "NR-130", "niv": 1, "e": "Según la Ley 115 de 1994, el gobierno escolar de un establecimiento educativo del Estado está conformado por", "f": "Ley 115 de 1994, artículos 94 y 142.", "o": [["A", "el consejo directivo, el consejo académico y el consejo de padres.", "El consejo de padres es una instancia de participación de las familias, no un órgano del gobierno escolar; además, el artículo 142 incluye al rector.", false], ["B", "el rector, el consejo directivo y el consejo académico.", "El artículo 142 de la Ley 115 de 1994 establece que cada establecimiento educativo del Estado tendrá un gobierno escolar conformado por el rector, el consejo directivo y el consejo académico.", true], ["C", "el rector, el consejo directivo y el personero de los estudiantes.", "El personero es una figura de participación estudiantil (artículo 94), pero no es un órgano del gobierno escolar.", false]]}, {"id": "NR-131", "niv": 1, "e": "En la asamblea, los docentes deben elegir", "f": "Ley 115 de 1994, artículos 143 y 145; Decreto 1860 de 1994, artículo 21.", "o": [["A", "un representante por cada área al consejo directivo, propuesto por los jefes de área.", "Confunde el consejo directivo con el consejo académico, en el que sí hay un docente por cada área o grado (Ley 115, artículo 145).", false], ["B", "un representante por cada sede y jornada al consejo directivo, elegido en cada una de ellas.", "La ley fija dos representantes de los docentes en el consejo directivo, sin importar el número de sedes o jornadas.", false], ["C", "dos representantes al consejo directivo, por mayoría de los votantes de la asamblea.", "El artículo 143 de la Ley 115 y el numeral 2 del artículo 21 del Decreto 1860 de 1994 establecen que el consejo directivo tiene dos representantes del personal docente, elegidos por mayoría de los votantes en una asamblea de docentes.", true]]}, {"id": "NR-132", "niv": 3, "e": "De acuerdo con el Decreto 1860 de 1994, el consejo directivo debe quedar integrado y en ejercicio de sus funciones dentro de", "f": "Decreto 1860 de 1994, artículos 21 (parágrafo 2), 28 y 29.", "o": [["A", "los sesenta días calendario siguientes a la iniciación de clases del período lectivo.", "El parágrafo 2 del artículo 21 del Decreto 1860 de 1994 establece que, dentro de los primeros sesenta días calendario siguientes al de la iniciación de clases de cada período lectivo anual, deberá quedar integrado el consejo directivo y entrar en ejercicio de sus funciones.", true], ["B", "las cuatro primeras semanas del calendario académico, contadas desde la iniciación de clases del período lectivo.", "Las cuatro primeras semanas son el plazo para convocar las asambleas por grado que eligen a los voceros del consejo de estudiantes (artículo 29).", false], ["C", "los treinta días calendario siguientes a la iniciación de clases del período lectivo.", "Treinta días calendario es el plazo para elegir al personero de los estudiantes (Decreto 1860, artículo 28), no para integrar el consejo directivo.", false]]}, {"id": "NR-133", "niv": 2, "e": "Una vez instalados los órganos, la función de fijar los criterios para asignar los cupos disponibles a estudiantes nuevos corresponde a", "f": "Ley 115 de 1994, artículos 144 y 145; Decreto 1860 de 1994, artículos 20 y 23.", "o": [["A", "el rector, como representante del establecimiento ante las autoridades educativas.", "El rector preside el consejo directivo y ejecuta las decisiones del gobierno escolar, pero la ley atribuye la fijación de criterios de cupos al consejo directivo como órgano colegiado.", false], ["B", "el consejo académico, como instancia superior de orientación pedagógica de todo el establecimiento educativo.", "El consejo académico se ocupa del currículo, el plan de estudios y la evaluación institucional (Ley 115, artículo 145); fijar criterios de cupos es función del consejo directivo.", false], ["C", "el consejo directivo, como instancia de orientación académica y administrativa del establecimiento.", "El literal d) del artículo 144 de la Ley 115 y el literal d) del artículo 23 del Decreto 1860 asignan al consejo directivo la función de fijar los criterios para la asignación de cupos disponibles; el artículo 20 del mismo decreto lo define como instancia directiva y de orientación académica y administrativa.", true]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Personero y consejo de estudiantes (Ley 115 de 1994, art. 94; Decreto 1860 de 1994, arts. 28 y 29)", "texto": "Usted es docente de ciencias sociales en una institución oficial de Montería que ofrece desde preescolar hasta grado once, y el rector le encarga organizar el proyecto de democracia escolar. Debe preparar la elección del personero de los estudiantes y la conformación del consejo de estudiantes. Varios estudiantes de noveno quieren postularse a personero. Además, el consejo de estudiantes quiere nombrar al estudiante de once que resulte elegido personero como su representante ante el consejo directivo, porque es muy popular.", "items": [{"id": "NR-134", "niv": 1, "e": "Sobre quién puede ser personero, usted informa a los estudiantes que debe ser", "f": "Ley 115 de 1994, artículo 94; Decreto 1860 de 1994, artículo 28.", "o": [["A", "un estudiante de cualquiera de los grados de la básica secundaria o de la media.", "La ley no permite postular a estudiantes de cualquier grado: exige que curse el último grado ofrecido, por lo que los de noveno no pueden aspirar.", false], ["B", "un estudiante que curse el último grado que ofrezca la institución.", "El artículo 94 de la Ley 115 de 1994 y el artículo 28 del Decreto 1860 de 1994 establecen que el personero será un alumno que curse el último grado que ofrezca la institución; en este caso, grado once.", true], ["C", "un estudiante de noveno, décimo u once que tenga desempeño alto o superior.", "El requisito legal es cursar el último grado; la ley no fija un nivel de desempeño ni admite grados distintos al último ofrecido.", false]]}, {"id": "NR-135", "niv": 2, "e": "Para la elección del personero, el procedimiento que establece el Decreto 1860 de 1994 consiste en", "f": "Decreto 1860 de 1994, artículos 28 y 29.", "o": [["A", "convocar a todos los estudiantes matriculados para elegirlo por mayoría simple y voto secreto, dentro de los treinta días calendario siguientes al inicio de clases.", "El artículo 28 del Decreto 1860 de 1994 dispone que el personero será elegido dentro de los treinta días calendario siguientes al de la iniciación de clases; el rector convoca a todos los estudiantes matriculados para elegirlo por el sistema de mayoría simple y mediante voto secreto.", true], ["B", "convocar solo a los estudiantes de secundaria y media para elegirlo por mayoría absoluta de votos, dentro de los sesenta días calendario siguientes al inicio de clases.", "La convocatoria incluye a todos los estudiantes matriculados, también los de preescolar y primaria; basta la mayoría simple y el plazo es de treinta días calendario, no de sesenta.", false], ["C", "pedir al consejo de estudiantes que lo elija entre sus voceros por votación secreta, dentro de las cuatro primeras semanas del calendario académico.", "El consejo de estudiantes elige al representante de los estudiantes ante el consejo directivo (artículo 29), no al personero, a quien eligen todos los estudiantes matriculados.", false]]}, {"id": "NR-136", "niv": 3, "e": "Frente a la intención del consejo de estudiantes de nombrar al personero como su representante ante el consejo directivo, usted aclara que", "f": "Decreto 1860 de 1994, artículos 21 (numeral 4), 28 y 29.", "o": [["A", "es posible si el consejo directivo lo autoriza, porque ambos cargos exigen cursar el último grado.", "Aunque ambos cargos exigen cursar el último grado, la norma los declara incompatibles y no prevé una autorización que levante esa incompatibilidad.", false], ["B", "es posible, siempre que el personero se abstenga de votar en todas las decisiones que afecten a los estudiantes del establecimiento.", "No existe una fórmula de abstención parcial: la incompatibilidad del artículo 28 impide ejercer los dos cargos al mismo tiempo.", false], ["C", "no es posible, porque el cargo de personero es incompatible con el de representante ante el consejo directivo.", "El último inciso del artículo 28 del Decreto 1860 de 1994 establece que el ejercicio del cargo de personero de los estudiantes es incompatible con el de representante de los estudiantes ante el consejo directivo.", true]]}, {"id": "NR-137", "niv": 3, "e": "Durante el año, el rector niega una solicitud que el personero presentó para proteger los derechos de los estudiantes. Si el personero no está de acuerdo, puede", "f": "Ley 115 de 1994, artículo 94, parágrafo; Decreto 1860 de 1994, artículo 28, literal d).", "o": [["A", "llevar la decisión ante la secretaría de educación, que actúa como segunda instancia del rector.", "La norma no establece a la secretaría de educación como segunda instancia de estas peticiones; la instancia que resuelve en última instancia es el consejo directivo.", false], ["B", "apelar la decisión ante el consejo directivo, que resuelve en última instancia.", "El literal d) del artículo 28 del Decreto 1860 permite al personero apelar ante el consejo directivo las decisiones del rector sobre las peticiones presentadas por su intermedio, y el parágrafo del artículo 94 de la Ley 115 señala que el consejo directivo las resuelve en última instancia.", true], ["C", "apelar la decisión ante el consejo académico, que tramita los reclamos de los estudiantes.", "El consejo académico se ocupa de asuntos curriculares y de evaluación; la norma señala al consejo directivo como instancia de apelación de las decisiones del rector sobre peticiones del personero.", false]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Servicio social estudiantil obligatorio (Ley 115 de 1994; Decreto 1860 de 1994; Resolución 4210 de 1996)", "texto": "Usted coordina el servicio social estudiantil en una institución rural del Huila que ofrece media técnica agropecuaria. Al iniciar el año, un grupo de estudiantes de noveno pregunta si ya pueden empezar a prestar el servicio; un padre propone que los estudiantes de décimo cumplan sus horas ayudando en la secretaría del colegio; y Camila, de grado once, que ha completado 50 horas de servicio, pregunta si podrá graduarse en diciembre aunque no termine las restantes.", "items": [{"id": "NR-138", "niv": 1, "e": "A los estudiantes de noveno, usted les explica que, según la Ley 115 de 1994, el servicio social obligatorio lo prestan", "f": "Ley 115 de 1994, artículos 11 y 97.", "o": [["A", "los estudiantes de educación media, durante los dos grados de ese nivel.", "El artículo 97 de la Ley 115 de 1994 establece que los estudiantes de educación media prestarán un servicio social obligatorio durante los dos grados de estudios. Noveno pertenece a la básica secundaria.", true], ["B", "los estudiantes de grado once, durante el último semestre del año escolar.", "La ley lo distribuye durante los dos grados de la media, no solo en el último semestre de once.", false], ["C", "los estudiantes de básica secundaria y media, a partir del grado octavo.", "El servicio social es propio de la educación media (grados décimo y once); la ley no lo extiende a la básica secundaria.", false]]}, {"id": "NR-139", "niv": 2, "e": "Frente a la propuesta del padre, usted explica que, en programas de carácter agropecuario como el de la institución, la Ley 115 de 1994 prevé que el servicio social se preste", "f": "Ley 115 de 1994, artículo 66; Decreto 1860 de 1994, artículo 39.", "o": [["A", "capacitando y asesorando a la población campesina de la región.", "El artículo 66 de la Ley 115 de 1994 dispone que los estudiantes de programas de carácter agropecuario, agroindustrial o ecológico prestarán el servicio social obligatorio capacitando y asesorando a la población campesina de la región.", true], ["B", "apoyando las labores administrativas de la secretaría de la institución.", "Las labores administrativas internas no cumplen el propósito del servicio social de integrarse a la comunidad (Decreto 1860, artículo 39) ni lo que el artículo 66 prevé para programas agropecuarios.", false], ["C", "dictando refuerzos escolares a los estudiantes de primaria de la institución.", "Aunque es una actividad solidaria, el artículo 66 señala de manera específica que en programas agropecuarios el servicio se presta capacitando y asesorando a la población campesina de la región.", false]]}, {"id": "NR-140", "niv": 2, "e": "Sobre la definición de los temas y objetivos del servicio social, el Decreto 1860 de 1994 establece que", "f": "Decreto 1860 de 1994, artículo 39.", "o": [["A", "los fija cada estudiante según la entidad en la que consiga un cupo para prestar el servicio.", "La elección individual de una entidad no reemplaza la definición institucional: los temas y objetivos los fija el PEI (artículo 39).", false], ["B", "los define la secretaría de educación, de manera igual para todas las instituciones de su jurisdicción.", "El Decreto 1860 deja esta definición a cada institución mediante su PEI; el Ministerio de Educación reglamenta aspectos generales de organización (Resolución 4210 de 1996).", false], ["C", "se definen en el proyecto educativo institucional y pueden ejecutarse con entidades gubernamentales y no gubernamentales.", "El artículo 39 del Decreto 1860 de 1994 señala que los temas y objetivos del servicio social estudiantil serán definidos en el PEI y que sus programas pueden ejecutarse en forma conjunta con entidades gubernamentales y no gubernamentales especializadas en la atención a las familias y comunidades.", true]]}, {"id": "NR-141", "niv": 3, "e": "A la pregunta de Camila, usted responde que", "f": "Resolución 4210 de 1996 del Ministerio de Educación Nacional, artículo 6; Ley 115 de 1994, artículo 97.", "o": [["A", "puede graduarse si compensa las horas faltantes con un trabajo escrito sobre su experiencia.", "La norma exige una intensidad mínima de horas de prestación del servicio; un trabajo escrito no sustituye las horas que faltan.", false], ["B", "debe completar la intensidad mínima de 80 horas, porque el servicio social es requisito para obtener el título de bachiller.", "El artículo 6 de la Resolución 4210 de 1996 del Ministerio de Educación fija una intensidad mínima de ochenta horas de servicio social, y esa misma resolución lo establece como requisito indispensable para la obtención del título de bachiller.", true], ["C", "puede graduarse, porque el servicio social es una actividad formativa que no condiciona el título.", "Aunque es formativo, el servicio social obligatorio es requisito para la obtención del título de bachiller; con 50 horas Camila no alcanza la intensidad mínima.", false]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Proyectos pedagógicos, formación ética, orientación estudiantil y familia (Ley 115 de 1994, arts. 7 y 25; Decreto 1860 de 1994, arts. 36 y 40)", "texto": "En una institución oficial de Montería, el consejo académico revisa el plan de estudios del próximo año. Un docente propone suprimir el proyecto de educación ambiental, al que considera «una actividad suelta», y concentrar toda la formación en valores en el área de ética. Otro colega sostiene que la orientación estudiantil «no es asunto nuestro», porque la sede no tiene docente orientador nombrado. Al final de la reunión, la representante de los padres pregunta qué le corresponde a la familia en la educación de sus hijos, además de matricularlos en la institución.", "items": [{"id": "NR-142", "niv": 2, "e": "Frente a la propuesta sobre el proyecto de educación ambiental, usted explica que, según el Decreto 1860 de 1994, un proyecto pedagógico es", "f": "Decreto 1860 de 1994, artículo 36.", "o": [["A", "una actividad extracurricular voluntaria, que se desarrolla por fuera del plan de estudios de la institución.", "El artículo 36 ubica el proyecto pedagógico dentro del plan de estudios, que además define su intensidad horaria y su duración; no es una actividad voluntaria por fuera de él.", false], ["B", "una actividad del plan de estudios que ejercita al estudiante en la solución de problemas cotidianos relacionados con su entorno.", "El artículo 36 del Decreto 1860 de 1994 define el proyecto pedagógico como una actividad dentro del plan de estudios que, de manera planificada, ejercita al educando en la solución de problemas cotidianos relacionados con su entorno social, cultural, científico y tecnológico, e integra lo logrado en diversas áreas.", true], ["C", "un programa diseñado por la secretaría de educación, que la institución aplica sin modificaciones.", "El Decreto 1860 concibe el proyecto pedagógico como parte del plan de estudios de cada institución, orientado a los fines y objetivos de su PEI; no lo describe como un programa externo de aplicación uniforme.", false]]}, {"id": "NR-143", "niv": 3, "e": "Frente a la idea de concentrar la formación en valores en el área de ética, usted señala que, según la Ley 115 de 1994, la formación ética y moral se promueve", "f": "Ley 115 de 1994, artículos 23 y 25.", "o": [["A", "a través de las sanciones del manual de convivencia, que corrigen las conductas contrarias a los valores.", "El artículo 25 menciona la aplicación recta y justa de las normas como uno de varios medios, pero no reduce la formación ética a las sanciones; el énfasis está en el currículo, el ambiente y el ejemplo de los adultos.", false], ["B", "a través del área de ética y valores humanos, bajo la responsabilidad del docente que tenga esa asignación.", "Aunque ética y valores humanos es un área obligatoria (artículo 23), el artículo 25 no confía la formación ética a un solo docente: la extiende al currículo, al ambiente y al comportamiento de toda la comunidad institucional.", false], ["C", "también mediante el ambiente escolar, el comportamiento honesto de directivos y educadores y la aplicación justa de las normas.", "El artículo 25 de la Ley 115 de 1994 dispone que la formación ética y moral se promoverá a través del currículo, de los contenidos académicos pertinentes, del ambiente, del comportamiento honesto de directivos, educadores y personal administrativo, de la aplicación recta y justa de las normas y de los demás mecanismos del PEI.", true]]}, {"id": "NR-144", "niv": 3, "e": "Frente a la posición del colega sobre la orientación estudiantil, lo acertado es afirmar que, según el Decreto 1860 de 1994, este servicio", "f": "Decreto 1860 de 1994, artículo 40; Decreto 1278 de 2002, artículo 5.", "o": [["A", "se presta en todos los establecimientos y busca contribuir al pleno desarrollo de la personalidad de los estudiantes.", "El artículo 40 del Decreto 1860 de 1994 establece que en todos los establecimientos educativos se presta un servicio de orientación estudiantil cuyo objetivo general es contribuir al pleno desarrollo de la personalidad de los educandos, en aspectos como la toma de decisiones, la solución de conflictos y el desarrollo de valores.", true], ["B", "se limita a la atención de los estudiantes remitidos por faltas al manual de convivencia.", "El objetivo del servicio es más amplio: toma de decisiones personales, identificación de aptitudes e intereses, solución de conflictos, participación y desarrollo de valores (artículo 40); no se reduce a casos disciplinarios.", false], ["C", "se presta en las sedes que cuentan con un docente orientador nombrado por la entidad territorial.", "El artículo 40 del Decreto 1860 dispone que el servicio de orientación estudiantil se presta en todos los establecimientos educativos; además, el artículo 5 del Decreto 1278 de 2002 lo incluye entre las responsabilidades de los docentes.", false]]}, {"id": "NR-145", "niv": 1, "e": "A la pregunta de la representante de los padres, usted responde que, según la Ley 115 de 1994, a la familia le corresponde, entre otras obligaciones,", "f": "Ley 115 de 1994, artículos 7 y 145.", "o": [["A", "informarse sobre el rendimiento y el comportamiento de sus hijos y participar en las acciones de mejoramiento.", "El literal c) del artículo 7 de la Ley 115 de 1994 establece que a la familia le corresponde informarse sobre el rendimiento académico y el comportamiento de sus hijos y sobre la marcha de la institución, y en ambos casos participar en las acciones de mejoramiento.", true], ["B", "aprobar el plan de estudios que el consejo académico proponga para cada grado.", "La organización del plan de estudios es función del consejo académico (artículo 145) dentro del PEI; la familia participa en el consejo directivo, asociaciones y comités (artículo 7, literal e), pero no aprueba el plan de estudios.", false], ["C", "decidir la promoción de sus hijos cuando no esté de acuerdo con las calificaciones obtenidas en el año.", "La promoción se decide según el sistema institucional de evaluación de los estudiantes; la ley le asigna a la familia informarse y participar en las acciones de mejoramiento, no decidir la promoción.", false]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Sistema General de Participaciones y acceso a la educación rural (Ley 715 de 2001; Ley 1098 de 2006)", "texto": "Usted es representante de los docentes en el consejo directivo de una institución oficial de un municipio de Nariño con varias sedes rurales dispersas. En la sesión se discute un informe sobre los recursos del Sistema General de Participaciones (SGP) para educación que administra la entidad territorial, y varias familias de una vereda piden apoyo de transporte porque los niños caminan más de dos horas para llegar a la sede. Algunos niños de esa vereda ya han dejado de asistir en época de lluvias.", "items": [{"id": "NR-146", "niv": 2, "e": "Al explicar el destino de los recursos de la participación para educación del SGP, usted señala correctamente que con ellos se financia, entre otras actividades,", "f": "Ley 715 de 2001, artículo 15.", "o": [["A", "el pago de las matrículas universitarias de los mejores bachilleres de la entidad territorial.", "Las actividades que enumera el artículo 15 se refieren a la prestación del servicio en las instituciones educativas públicas; el pago de matrículas universitarias no figura entre ellas.", false], ["B", "el pago del personal docente y administrativo de las instituciones públicas y sus prestaciones sociales.", "El artículo 15 de la Ley 715 de 2001 destina los recursos de la participación para educación, entre otras actividades, al pago del personal docente y administrativo de las instituciones educativas públicas, las contribuciones inherentes a la nómina y sus prestaciones sociales (numeral 15.1).", true], ["C", "la entrega de subsidios en dinero a las familias para la compra de útiles, textos escolares y uniformes de los estudiantes.", "Los subsidios monetarios directos a las familias no están entre las actividades del artículo 15: personal, infraestructura y funcionamiento, canasta educativa y calidad.", false]]}, {"id": "NR-147", "niv": 3, "e": "Frente a la solicitud de transporte de las familias de la vereda, la Ley 715 de 2001 prevé destinar recursos de la participación para educación a transporte escolar", "f": "Ley 715 de 2001, artículo 15, parágrafo 2.", "o": [["A", "cuando el consejo directivo lo apruebe, con cargo a los recursos de gratuidad girados a la institución.", "La destinación prevista en el parágrafo 2 del artículo 15 la hace la entidad territorial con la participación para educación, una vez cubiertos los costos del servicio; no depende de una aprobación del consejo directivo ni de los recursos de gratuidad.", false], ["B", "antes de cubrir la nómina docente, cuando la demanda de transporte supere la oferta de cupos cercanos.", "La norma condiciona el transporte a que primero estén cubiertos los costos de la prestación del servicio, entre ellos la nómina; no permite anteponerlo a esos costos.", false], ["C", "una vez cubiertos los costos del servicio, para estudiantes de estratos pobres cuando la geografía lo exija.", "El parágrafo 2 del artículo 15 de la Ley 715 de 2001 dispone que, una vez cubiertos los costos de la prestación del servicio educativo, las entidades territoriales destinarán recursos de esta participación a transporte escolar para los niños de los estratos más pobres, cuando las condiciones geográficas lo requieran para garantizar el acceso y la permanencia.", true]]}, {"id": "NR-148", "niv": 1, "e": "Al respaldar la petición de las familias, usted recuerda que el Código de la Infancia y la Adolescencia impone a las instituciones educativas la obligación especial de", "f": "Ley 1098 de 2006, artículo 42, numerales 1 y 12.", "o": [["A", "facilitar el acceso de los niños, niñas y adolescentes al sistema educativo y garantizar su permanencia.", "El numeral 1 del artículo 42 de la Ley 1098 de 2006 establece como obligación especial de las instituciones educativas facilitar el acceso de los niños, niñas y adolescentes al sistema educativo y garantizar su permanencia.", true], ["B", "prestar directamente el transporte escolar gratuito a todos los estudiantes que vivan en la zona rural del municipio.", "El Código no asigna a cada institución la prestación directa del transporte; la financiación del transporte escolar con recursos del SGP corresponde a las entidades territoriales en las condiciones del parágrafo 2 del artículo 15 de la Ley 715 de 2001.", false], ["C", "dar prioridad en la matrícula a quienes vivan cerca de la sede, para disminuir el riesgo de deserción.", "Restringir el cupo por distancia contradice la obligación de facilitar el acceso y garantizar la permanencia; además, el artículo 42 prohíbe la discriminación por condición socioeconómica.", false]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Obligaciones de las instituciones educativas (Ley 1098 de 2006, Código de la Infancia y la Adolescencia)", "texto": "Usted es docente de tercer grado en una institución oficial de un municipio pequeño del Magdalena. Durante la revisión de documentos de inicio de año, la secretaría reporta que Mateo, de 8 años, no está afiliado a ningún régimen de salud. Semanas después, Mateo llega con moretones en los brazos y le cuenta que su tío «le pega con la correa cuando se porta mal». La coordinadora opina que «eso es un asunto de la familia y del ICBF, no del colegio». En el municipio no hay defensoría de familia, pero sí comisaría de familia.", "items": [{"id": "NR-149", "niv": 1, "e": "Frente a la falta de afiliación a salud de Mateo, el Código de la Infancia y la Adolescencia establece que la institución debe", "f": "Ley 1098 de 2006, artículos 42 (numeral 1) y 44 (numeral 3).", "o": [["A", "condicionar la permanencia de Mateo a que la familia presente el certificado de afiliación.", "La norma ordena comprobar la afiliación, no excluir al estudiante. Las instituciones deben facilitar el acceso y garantizar la permanencia (artículo 42, numeral 1).", false], ["B", "poner en marcha mecanismos para comprobar la afiliación de los estudiantes a un régimen de salud.", "El numeral 3 del artículo 44 de la Ley 1098 de 2006 incluye entre las obligaciones complementarias de las instituciones educativas poner en marcha mecanismos para comprobar la afiliación de los estudiantes a un régimen de salud.", true], ["C", "abstenerse de intervenir, porque la afiliación a salud es un asunto exclusivo de la familia y de la EPS.", "El Código asigna expresamente a las instituciones educativas la obligación de comprobar la afiliación a salud; no es un asunto ajeno al colegio.", false]]}, {"id": "NR-150", "niv": 2, "e": "Una vez Mateo le cuenta lo de los golpes, según el artículo 44 del Código, la institución debe", "f": "Ley 1098 de 2006, artículo 44, numerales 2 y 9.", "o": [["A", "citar primero al tío a firmar un compromiso de buen trato y reportar solo si los golpes se repiten.", "La norma no condiciona el reporte a la reincidencia ni a un compromiso previo con el presunto agresor; hacer esperar al niño puede agravar la vulneración.", false], ["B", "esperar un dictamen médico que confirme el maltrato antes de informar a cualquier autoridad.", "El deber de reportar no exige una prueba médica previa: basta la detección de la situación. Establecer los hechos corresponde a la autoridad competente.", false], ["C", "reportar el maltrato a las autoridades competentes y brindar apoyo y orientación al estudiante.", "El artículo 44 de la Ley 1098 de 2006 ordena establecer la detección oportuna, el apoyo y la orientación en casos de maltrato (numeral 2) y reportar a las autoridades competentes las situaciones de abuso o maltrato detectadas (numeral 9).", true]]}, {"id": "NR-151", "niv": 3, "e": "Ante la opinión de la coordinadora, usted le recuerda que, según el principio de corresponsabilidad del Código,", "f": "Ley 1098 de 2006, artículos 10 y 44.", "o": [["A", "las instituciones obligadas a prestar servicios sociales no pueden invocarlo para negar la atención que requieren los derechos del niño.", "El artículo 10 de la Ley 1098 de 2006 define la corresponsabilidad como la concurrencia de la familia, la sociedad y el Estado en la atención, cuidado y protección de los niños, y aclara que las instituciones públicas o privadas obligadas a prestar servicios sociales no pueden invocar ese principio para negar la atención que demande la satisfacción de sus derechos fundamentales.", true], ["B", "la familia es la única responsable de la protección del niño mientras no exista una orden judicial que obligue al colegio a intervenir.", "El artículo 10 hace corresponsables a la familia, la sociedad y el Estado; la institución educativa tiene deberes propios de detección y reporte (artículo 44) que no dependen de una orden judicial.", false], ["C", "el colegio solo debe actuar frente a los hechos que ocurran dentro de sus instalaciones o durante las actividades escolares.", "El Código ordena detectar y reportar el maltrato sin limitarlo al espacio escolar; la violencia intrafamiliar figura de forma expresa en el numeral 2 del artículo 44.", false]]}, {"id": "NR-152", "niv": 3, "e": "Como en el municipio no hay defensoría de familia, la autoridad ante la cual se puede poner en conocimiento la situación de Mateo es", "f": "Ley 1098 de 2006, artículos 51 y 53.", "o": [["A", "el juzgado de familia más cercano, porque solo un juez puede conocer los casos de maltrato.", "El Código prevé autoridades administrativas, como las comisarías de familia, para conocer estas situaciones; no se requiere acudir exclusivamente a un juez.", false], ["B", "el comité escolar de convivencia, que es el encargado de adoptar las medidas de restablecimiento.", "El comité escolar de convivencia activa la ruta y remite, pero las medidas de restablecimiento de derechos las toma la autoridad competente (Ley 1098, artículo 53), no el comité.", false], ["C", "la comisaría de familia o, en su defecto, la inspección de policía o la personería municipal.", "El artículo 51 de la Ley 1098 de 2006 señala que las autoridades deben informar, oficiar o conducir ante la policía, las defensorías de familia, las comisarías de familia o, en su defecto, los inspectores de policía o las personerías municipales o distritales a los niños que se encuentren en condiciones de riesgo o vulnerabilidad.", true]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Obligaciones especiales y ética fundamental de las instituciones (Ley 1098 de 2006, arts. 42 y 43)", "texto": "Usted es docente de quinto grado en una institución oficial de Medellín. En su grupo hay tres estudiantes que leen con mucha dificultad y van rezagados respecto de sus compañeros. En una clase de educación física, un colega se burla en voz alta de uno de ellos y lo llama «lento» frente a todo el grupo. Además, la profesora encargada del grupo de danzas no admitió a una estudiante afrodescendiente con el argumento de que su peinado de trenzas «no combina con el vestuario».", "items": [{"id": "NR-153", "niv": 1, "e": "Frente a los tres estudiantes con dificultades de lectura, el artículo 42 del Código de la Infancia y la Adolescencia obliga a la institución a", "f": "Ley 1098 de 2006, artículo 42, numerales 1 y 6.", "o": [["A", "remitirlos a una institución especializada, para que no afecten el ritmo de aprendizaje del resto del grupo.", "Remitirlos fuera de la institución contradice la obligación de facilitar el acceso y garantizar la permanencia (artículo 42, numeral 1) y la de organizar la nivelación en la propia institución (numeral 6).", false], ["B", "organizar programas de nivelación y establecer programas de orientación psicopedagógica y psicológica.", "El numeral 6 del artículo 42 de la Ley 1098 de 2006 obliga a las instituciones educativas a organizar programas de nivelación para quienes presenten dificultades de aprendizaje o estén retrasados en el ciclo escolar, y a establecer programas de orientación psicopedagógica y psicológica.", true], ["C", "promoverlos al grado siguiente sin valoración, para evitar que queden en situación de extraedad.", "La promoción sin valoración no resuelve la dificultad; el Código exige programas de nivelación, y la promoción se rige por los criterios del sistema institucional de evaluación (Decreto 1290 de 2009).", false]]}, {"id": "NR-154", "niv": 2, "e": "Frente a la burla del colega, la obligación ética fundamental de la institución, según el Código, es", "f": "Ley 1098 de 2006, artículo 43, numeral 2.", "o": [["A", "proteger eficazmente al estudiante contra la humillación o la burla, también cuando proviene de los profesores.", "El numeral 2 del artículo 43 de la Ley 1098 de 2006 obliga a las instituciones a proteger eficazmente a los niños contra toda forma de maltrato, agresión física o sicológica, humillación, discriminación o burla de parte de los demás compañeros y de los profesores.", true], ["B", "respetar la autonomía del colega en el manejo de su clase, sin intervenir en asuntos de otra área.", "La autonomía pedagógica no ampara la humillación de un estudiante; el artículo 43 obliga a la institución a protegerlo también frente a las burlas de los profesores.", false], ["C", "enseñar al estudiante a tolerar las bromas, para fortalecer su autoestima frente al grupo.", "Trasladar la responsabilidad al estudiante desconoce que la burla de un docente es una forma de humillación frente a la cual la institución debe protegerlo (artículo 43, numeral 2).", false]]}, {"id": "NR-155", "niv": 2, "e": "Respecto de la decisión de la profesora del grupo de danzas, el Código obliga a la institución a", "f": "Ley 1098 de 2006, artículo 42, numerales 8 y 12.", "o": [["A", "aplicar el reglamento interno del grupo de danzas, si fue aprobado por sus integrantes.", "Un reglamento interno no puede establecer criterios que discriminen por etnia; prevalece la obligación del numeral 12 del artículo 42.", false], ["B", "respetar los criterios estéticos de la docente, por tratarse de una actividad extracurricular.", "El carácter extracurricular no exime de la prohibición de discriminar; el Código también obliga a estimular las manifestaciones culturales de los estudiantes (artículo 42, numeral 8).", false], ["C", "evitar cualquier conducta discriminatoria por razones de etnia o de cualquier otra condición.", "El numeral 12 del artículo 42 de la Ley 1098 de 2006 obliga a las instituciones educativas a evitar cualquier conducta discriminatoria por razones de sexo, etnia, credo, condición socioeconómica o cualquier otra que afecte el ejercicio de los derechos. Excluir a la estudiante por su peinado afecta su identidad étnica.", true]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Prevención del abuso sexual (Ley 1146 de 2007)", "texto": "Laura, estudiante de octavo grado de una institución oficial de Cúcuta, se queda al final de la clase y le cuenta a usted, su directora de grupo, que un vecino adulto la ha tocado de forma inapropiada en varias ocasiones cuando ella regresa a casa. Le pide que no le cuente a nadie porque tiene miedo. Un colega que se entera le dice a usted que «eso pasó fuera del colegio y no nos corresponde», y que en todo caso es mejor esperar a que la familia decida qué hacer.", "items": [{"id": "NR-156", "niv": 1, "e": "Frente a lo que Laura le contó, según la Ley 1146 de 2007, usted", "f": "Ley 1146 de 2007, artículo 12.", "o": [["A", "debe denunciarlo solo si Laura acepta formalizar la denuncia y firmar una declaración.", "La obligación del docente no depende del consentimiento de la estudiante; se activa con el conocimiento de una conducta o de un indicio de abuso. La intimidad se protege con la reserva de la información, no con el silencio.", false], ["B", "está obligada a denunciarlo ante las autoridades competentes, aunque solo tenga indicios del abuso.", "El artículo 12 de la Ley 1146 de 2007 establece que el docente está obligado a denunciar ante las autoridades administrativas y judiciales competentes toda conducta o indicio de violencia o abuso sexual contra niños, niñas y adolescentes del que tenga conocimiento.", true], ["C", "debe informar a la familia para que sea ella la que decida si acude a las autoridades.", "Informar a la familia puede ser parte del protocolo, pero no reemplaza la obligación legal propia del docente de denunciar (artículo 12).", false]]}, {"id": "NR-157", "niv": 2, "e": "En cuanto al plazo, la Ley 1146 de 2007 establece que el deber de denunciar debe cumplirse", "f": "Ley 1146 de 2007, artículo 15; Decreto 1965 de 2013, artículo 44.", "o": [["A", "una vez concluya la indagación interna del comité escolar de convivencia.", "Esperar una indagación interna retrasa la denuncia más allá de las 24 horas que fija la ley; además, ante un presunto delito sexual el protocolo exige informar de inmediato a la Policía (Decreto 1965 de 2013, artículo 44).", false], ["B", "dentro de los cinco días hábiles siguientes, una vez reunidas las pruebas.", "La ley fija un plazo de 24 horas y no exige reunir pruebas: basta denunciar los indicios; investigar corresponde a las autoridades.", false], ["C", "dentro de las 24 horas siguientes al conocimiento del hecho.", "El artículo 15 de la Ley 1146 de 2007 establece que el Estado y la sociedad tienen el deber de denunciar oportunamente a las autoridades competentes cualquier indicio o caso de abuso sexual contra niños, niñas y adolescentes dentro de las 24 horas siguientes al conocimiento del hecho.", true]]}, {"id": "NR-158", "niv": 2, "e": "Frente al argumento del colega de que los hechos ocurrieron fuera del colegio, usted responde que la Ley 1146 de 2007", "f": "Ley 1146 de 2007, artículos 11 y 12.", "o": [["A", "ordena a las instituciones contribuir a la detección y denuncia del abuso que sufran los estudiantes dentro y fuera de ellas.", "El artículo 11 de la Ley 1146 de 2007 obliga a los establecimientos de básica y media a incluir elementos que contribuyan a la identificación temprana, prevención, autoprotección, detección y denuncia del abuso sexual del que puedan ser víctimas los educandos, dentro y fuera de los establecimientos educativos.", true], ["B", "asigna estos casos exclusivamente al orientador escolar, quien decide si se reportan o no.", "El deber de denunciar recae en el docente que conoce el hecho (artículo 12); no se delega en el orientador ni queda sujeto a su criterio.", false], ["C", "limita la responsabilidad del colegio a los hechos ocurridos durante la jornada y en sus instalaciones.", "La ley extiende de forma expresa la detección y la denuncia a los hechos que ocurran fuera de los establecimientos educativos (artículo 11).", false]]}, {"id": "NR-159", "niv": 3, "e": "Al planear acciones de prevención, usted tiene en cuenta que la Ley 1146 de 2007 exige incluir una cátedra de educación para la sexualidad, con énfasis en la dignidad y los derechos del menor, en", "f": "Ley 1146 de 2007, artículo 14; Ley 115 de 1994, artículo 14.", "o": [["A", "los programas de formación de padres, en lugar de la educación sexual de los estudiantes.", "La cátedra se dirige a los estudiantes de media y superior; la escuela de padres (Ley 2025 de 2020) complementa, pero no sustituye, la formación de los estudiantes.", false], ["B", "los programas de estudio de los establecimientos de educación media y superior.", "El artículo 14 de la Ley 1146 de 2007 dispone que los establecimientos de educación media y superior deberán incluir en sus programas de estudio una cátedra de educación para la sexualidad, con especial énfasis en el respeto a la dignidad y a los derechos del menor.", true], ["C", "los programas de preescolar y básica primaria, como parte del área de ciencias naturales.", "La ley ubica esta cátedra en la educación media y superior; en preescolar y básica la educación sexual se trabaja como enseñanza obligatoria transversal (Ley 115 de 1994, artículo 14).", false]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Convivencia escolar (Ley 1620 de 2013 y Decreto 1965 de 2013)", "texto": "En el descanso, dos estudiantes de cuarto grado de una escuela oficial de Popayán discuten por el turno para usar el balón; uno empuja al otro, que cae al pasto sin sufrir ninguna lesión. Es la primera vez que tienen un problema y ambos aceptan hablar. Usted, docente de turno, sabe que la institución cuenta con un grupo de estudiantes mediadores formados por la orientadora. Al día siguiente, una madre le pregunta quiénes representan a los estudiantes en el comité escolar de convivencia.", "items": [{"id": "NR-160", "niv": 1, "e": "De acuerdo con el Decreto 1965 de 2013, la situación entre los dos estudiantes se clasifica como", "f": "Decreto 1965 de 2013, artículo 40.", "o": [["A", "tipo II, porque hubo agresión física entre los estudiantes, aunque no causara incapacidad.", "El contacto físico por sí solo no configura una situación tipo II: esta exige agresión repetida o sistemática, o que cause daño al cuerpo o a la salud sin incapacidad. Aquí fue esporádico y sin lesión.", false], ["B", "tipo I, por ser un conflicto esporádico manejado inadecuadamente que no causó daño al cuerpo ni a la salud.", "El artículo 40 del Decreto 1965 de 2013 define las situaciones tipo I como los conflictos manejados inadecuadamente y las situaciones esporádicas que inciden negativamente en el clima escolar y que en ningún caso generan daños al cuerpo o a la salud.", true], ["C", "tipo III, porque toda agresión física entre estudiantes debe informarse de inmediato a la Policía de Infancia.", "El tipo III corresponde a presuntos delitos; un empujón esporádico sin lesión no lo es.", false]]}, {"id": "NR-161", "niv": 2, "e": "Según el protocolo previsto para este tipo de situación, usted debe", "f": "Decreto 1965 de 2013, artículos 42 y 44.", "o": [["A", "informar a los padres y a la Policía de Infancia y Adolescencia para que intervengan.", "La intervención policial corresponde a las situaciones tipo III; un conflicto tipo I se resuelve con mediación pedagógica en el ámbito escolar.", false], ["B", "remitir el caso al comité escolar de convivencia para que defina la sanción que corresponde.", "Las situaciones tipo I se atienden directamente mediante mediación pedagógica; el protocolo no exige remitirlas al comité para definir sanciones.", false], ["C", "reunir de inmediato a las partes, mediar de manera pedagógica, fijar una solución imparcial y hacer seguimiento.", "El artículo 42 del Decreto 1965 de 2013 establece para las situaciones tipo I reunir inmediatamente a las partes, mediar de manera pedagógica, fijar la forma de solución de manera imparcial, equitativa y justa, dejar constancia y hacer seguimiento.", true]]}, {"id": "NR-162", "niv": 2, "e": "Sobre la posibilidad de que los estudiantes mediadores participen en el manejo de esta situación, el Decreto 1965 de 2013 establece que", "f": "Decreto 1965 de 2013, artículo 42, parágrafo.", "o": [["A", "pueden participar en el manejo de las situaciones tipo I, en los términos fijados en el manual de convivencia.", "El parágrafo del artículo 42 del Decreto 1965 de 2013 prevé que los estudiantes mediadores puedan participar en el manejo de las situaciones tipo I.", true], ["B", "no pueden participar, porque la mediación de conflictos entre estudiantes les corresponde solo a los docentes.", "La norma permite de forma expresa la participación de estudiantes mediadores en las situaciones tipo I.", false], ["C", "solo pueden participar en situaciones tipo II, una vez el comité haya analizado el caso.", "La participación de los mediadores está prevista en el protocolo de las situaciones tipo I (artículo 42, parágrafo), sin depender de un análisis previo del comité.", false]]}, {"id": "NR-163", "niv": 3, "e": "A la madre que pregunta por la representación estudiantil en el comité escolar de convivencia, usted le responde que lo integran", "f": "Ley 1620 de 2013, artículo 12.", "o": [["A", "el representante de los estudiantes ante el consejo directivo y los voceros de cada grado.", "Ni el representante ante el consejo directivo ni los voceros de grado figuran en el artículo 12 de la Ley 1620; los representantes estudiantiles en el comité son el personero y el presidente del consejo de estudiantes.", false], ["B", "el personero estudiantil y el presidente del consejo de estudiantes.", "El artículo 12 de la Ley 1620 de 2013 incluye en el comité al rector, el personero estudiantil, el docente con función de orientación, el coordinador, el presidente del consejo de padres, el presidente del consejo de estudiantes y un docente que lidere procesos de convivencia.", true], ["C", "los estudiantes mediadores elegidos por la orientadora y el personero estudiantil.", "Los mediadores pueden participar en el manejo de situaciones tipo I, pero no son miembros del comité según el artículo 12; sí lo es, junto al personero, el presidente del consejo de estudiantes.", false]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Evaluación y promoción de los estudiantes (Decreto 1290 de 2009)", "texto": "En una institución oficial de Ibagué, usted es docente de grado sexto. En marzo, durante el primer período, los padres de Valentina, que demuestra un desempeño muy superior en todas las áreas, solicitan que sea promovida a séptimo. Al finalizar el año, otro estudiante, Juan Pablo, no es promovido según los criterios del sistema institucional de evaluación (SIEE). Por otra parte, el rector sugiere no inscribir en las pruebas censales del ICFES a los estudiantes de bajo desempeño de los grados evaluados, para mejorar el promedio institucional.", "items": [{"id": "NR-164", "niv": 1, "e": "Al registrar las valoraciones, la escala nacional con la que debe guardar equivalencia la escala institucional es", "f": "Decreto 1290 de 2009, artículos 4 y 5.", "o": [["A", "desempeño superior, desempeño alto, desempeño básico y desempeño bajo.", "El artículo 5 del Decreto 1290 de 2009 define la escala de valoración nacional: desempeño superior, desempeño alto, desempeño básico y desempeño bajo. Cada institución adopta su propia escala y su equivalencia con la nacional (artículo 4).", true], ["B", "excelente, sobresaliente, aceptable, insuficiente y deficiente.", "No es la escala que adopta el Decreto 1290 de 2009, que tiene cuatro niveles: superior, alto, básico y bajo.", false], ["C", "desempeño superior, desempeño alto, desempeño aceptable y desempeño bajo.", "La escala nacional no tiene un nivel «medio»: el tercer nivel es «básico», que indica la superación de los desempeños necesarios en relación con las áreas obligatorias y fundamentales.", false]]}, {"id": "NR-165", "niv": 2, "e": "Para atender la solicitud de los padres de Valentina, el procedimiento previsto en el Decreto 1290 de 2009 es que", "f": "Decreto 1290 de 2009, artículo 7.", "o": [["A", "el rector la otorgue por resolución, después de una prueba de suficiencia aplicada por la secretaría de educación.", "La norma no prevé una prueba de la secretaría ni una decisión unilateral del rector; establece la recomendación del consejo académico y la decisión del consejo directivo.", false], ["B", "el director de grupo decida la promoción al finalizar el año, con base en el boletín final.", "La promoción anticipada se tramita durante el primer período, no al final del año, y la decide el consejo directivo por recomendación del consejo académico.", false], ["C", "el consejo académico, con el consentimiento de los padres, recomiende la promoción anticipada al consejo directivo.", "El artículo 7 del Decreto 1290 de 2009 dispone que, durante el primer período, el consejo académico, previo consentimiento de los padres, recomiende ante el consejo directivo la promoción anticipada de quien demuestre un rendimiento superior; la decisión se consigna en el acta del consejo directivo y en el registro escolar.", true]]}, {"id": "NR-166", "niv": 2, "e": "Respecto de Juan Pablo, que no fue promovido, la institución debe", "f": "Decreto 1290 de 2009, artículo 6; Ley 115 de 1994, artículo 96.", "o": [["A", "garantizarle el cupo en la institución para que continúe su proceso formativo el año siguiente.", "El artículo 6 del Decreto 1290 de 2009 establece que, cuando un estudiante no es promovido al grado siguiente, el establecimiento debe garantizarle el cupo para que continúe con su proceso formativo.", true], ["B", "trasladarlo a otra institución, porque la reprobación implica la pérdida del cupo.", "La reprobación no implica pérdida del cupo; además, la Ley 115 de 1994 (artículo 96) señala que reprobar un grado por primera vez no es causal de exclusión si no está asociado a otra causal del manual.", false], ["C", "asignarle cupo solo si quedan vacantes después de matricular a todos los estudiantes nuevos del año.", "La garantía del
