ón, le manifiesta su interés en ser representante de los padres ante el consejo directivo.", "items": [{"id": "DI-105", "niv": 3, "e": "El representante de los estudiantes ante el consejo directivo debe ser", "f": "Ley 115 de 1994, artículo 143, literal d; Decreto 1860 de 1994, artículos 21 y 28.", "o": [["A", "un estudiante de grado once de una institución vecina, porque la norma exige que curse el último grado de la media.", "La norma se refiere al último grado que ofrece la propia institución, no al último grado de la educación media (Ley 115, art. 143; Decreto 1860, art. 21).", false], ["B", "el personero estudiantil, que por haber sido elegido por todos los estudiantes asume también la representación de ellos ante el consejo directivo.", "El Decreto 1860 de 1994, artículo 28, establece que el cargo de personero es incompatible con el de representante de los estudiantes ante el consejo directivo.", false], ["C", "un estudiante de grado noveno, elegido por el consejo de estudiantes, porque es el último grado que ofrece la institución.", "La Ley 115 (art. 143, lit. d) y el Decreto 1860 (art. 21, num. 4) exigen que el representante curse el último grado que ofrezca la institución y lo elija el consejo de estudiantes; aquí ese grado es noveno.", true]]}, {"id": "DI-106", "niv": 2, "e": "Para elegir a los dos representantes de los padres ante el consejo directivo, usted", "f": "Decreto 1286 de 2005, artículos 7 (literal k), 8 y 9.", "o": [["A", "convoca a la asamblea general de padres para que los elija por votación directa entre los asistentes.", "La asamblea general de padres es una instancia distinta; la elección de los representantes ante el consejo directivo corresponde al consejo de padres (Decreto 1286 de 2005, arts. 7 y 8).", false], ["B", "convoca al consejo de padres, dentro de los primeros treinta días del año lectivo, para que los elija.", "El Decreto 1286 de 2005 dispone que el consejo de padres elige a los dos representantes ante el consejo directivo (art. 7, lit. k) en reunión convocada por el rector dentro de los primeros treinta días del año lectivo (art. 8). Al no haber asociación, no aplica la excepción del art. 9, parágrafo 2.", true], ["C", "designa a los padres de los estudiantes más antiguos de la institución, ya que no existe asociación de padres.", "La antigüedad no es el criterio vigente: el Decreto 1286 de 2005 (art. 7, lit. k, y art. 8) asigna la elección al consejo de padres, en reunión convocada por el rector.", false]]}, {"id": "DI-107", "niv": 1, "e": "Para la elección del personero de los estudiantes, usted debe", "f": "Decreto 1860 de 1994, artículo 28; Ley 115 de 1994, artículo 94.", "o": [["A", "convocar solo a los estudiantes de octavo y noveno, que son quienes pueden aspirar al cargo, antes de terminar el primer período.", "Confunde quién puede ser candidato (un estudiante del último grado que ofrece la institución) con quién vota: votan todos los estudiantes matriculados, dentro de los treinta días siguientes al inicio de clases (Decreto 1860, art. 28).", false], ["B", "pedir al consejo de estudiantes que lo elija entre sus voceros dentro de los primeros sesenta días del año escolar.", "El personero no lo elige el consejo de estudiantes: lo eligen todos los estudiantes matriculados, y el plazo es de treinta días calendario, no de sesenta (Decreto 1860, art. 28).", false], ["C", "convocar a los estudiantes matriculados dentro de los treinta días calendario siguientes al inicio de clases, para elegirlo por mayoría simple y voto secreto.", "El Decreto 1860 de 1994, artículo 28, ordena elegir al personero dentro de los treinta días calendario siguientes al inicio de clases; el rector convoca a todos los estudiantes matriculados y la elección es por mayoría simple y voto secreto.", true]]}, {"id": "DI-108", "niv": 3, "e": "Sobre el interés de la docente en representar a los padres de familia, usted le explica que", "f": "Decreto 1286 de 2005, artículo 8.", "o": [["A", "no puede hacerlo, porque quienes laboran como docentes en la institución no pueden representar a los padres en su consejo directivo.", "El Decreto 1286 de 2005, artículo 8, establece que los docentes, directivos o administrativos del establecimiento no pueden ser representantes de los padres de familia en el consejo directivo del establecimiento en que laboran.", true], ["B", "puede hacerlo, porque es madre de un estudiante matriculado y esa es la condición que exige la norma.", "Ser madre de un estudiante es necesario, pero no suficiente: el Decreto 1286 de 2005, artículo 8, prohíbe que los docentes del establecimiento sean representantes de los padres en su consejo directivo.", false], ["C", "puede hacerlo siempre que no se postule también como representante de los docentes en el mismo consejo.", "La prohibición no depende de otra postulación: se origina en su condición de docente de la institución (Decreto 1286 de 2005, art. 8).", false]]}]}, {"comp": "pedagogia_normativa", "rol": "directivo", "tag": "Competencias pedagógicas y normativa · Consejo directivo y consejo académico (Ley 115 de 1994; Decreto 1860 de 1994)", "texto": "Usted es rectora de una institución educativa oficial de Barranquilla. En la sesión de febrero del consejo directivo se presentan tres asuntos: la junta de acción comunal del barrio pide usar el coliseo de la institución los sábados para un torneo juvenil; usted presenta el plan anual de actualización académica de los docentes, centrado en evaluación por competencias y educación inclusiva; y un miembro del consejo propone aprobar en esa misma sesión una propuesta de ajuste al PEI que introduce un énfasis en bilingüismo y que aún no ha sido revisada por ningún otro órgano del gobierno escolar.", "items": [{"id": "DI-109", "niv": 2, "e": "Sobre la solicitud de la junta de acción comunal, lo que corresponde es que", "f": "Ley 115 de 1994, artículo 144, literal l; Decreto 4791 de 2008 (funciones del consejo directivo).", "o": [["A", "usted decida directamente, porque como rectora representa al establecimiento ante las autoridades educativas y ante la comunidad del barrio.", "Representar al establecimiento no la faculta para decidir sola: la ley asigna al consejo directivo establecer el procedimiento para el uso de las instalaciones (Ley 115, art. 144, lit. l) y autorizar al rector su uso por terceros (Decreto 4791 de 2008).", false], ["B", "el consejo directivo aplique el procedimiento que fijó para el uso de instalaciones y, si procede, la autorice a usted.", "La Ley 115, artículo 144, literal l, asigna al consejo directivo establecer el procedimiento para el uso de las instalaciones en actividades de la comunidad, y el Decreto 4791 de 2008 le asigna autorizar al rector la utilización de los bienes por terceros, previa verificación de ese procedimiento.", true], ["C", "la secretaría de educación la autorice, porque el coliseo es un bien inmueble del municipio.", "La propiedad del inmueble no traslada la decisión a la secretaría: el uso de las instalaciones por la comunidad se tramita en el consejo directivo según su procedimiento (Ley 115, art. 144, lit. l).", false]]}, {"id": "DI-110", "niv": 1, "e": "El plan anual de actualización académica que usted presenta debe ser aprobado por", "f": "Ley 115 de 1994, artículo 144, literal f; Decreto 1860 de 1994, artículo 23, literal f.", "o": [["A", "el consejo directivo de la institución.", "La Ley 115 de 1994 (art. 144, lit. f) asigna al consejo directivo aprobar el plan anual de actualización del personal de la institución presentado por el rector, y el Decreto 1860 de 1994 (art. 23, lit. f) precisa que se trata del plan anual de actualización académica del personal docente.", true], ["B", "la asamblea general de docentes de la institución.", "La asamblea de docentes elige a sus representantes ante el consejo directivo (Decreto 1860, art. 21), pero no aprueba el plan anual de actualización.", false], ["C", "el consejo académico, que orienta los asuntos pedagógicos.", "Aunque el consejo académico orienta lo pedagógico, la aprobación del plan anual de actualización presentado por el rector es función expresa del consejo directivo (Ley 115, art. 144, lit. f).", false]]}, {"id": "DI-111", "niv": 3, "e": "Ante la propuesta de aprobar de inmediato el ajuste al PEI, usted orienta al consejo directivo para que", "f": "Decreto 1860 de 1994, artículo 24, literal a; Ley 115 de 1994, artículo 144, literal g; Ley 715 de 2001, artículo 10, numeral 10.1.", "o": [["A", "lo apruebe en esa sesión, ya que la decisión sobre el PEI es una competencia que el consejo ejerce sin consultar a otros órganos.", "El consejo directivo participa en la planeación y evaluación del PEI, pero el Decreto 1860 asigna al consejo académico servir de órgano consultor del consejo directivo en la revisión de la propuesta del PEI (art. 24, lit. a), y el rector dirige su preparación con participación de la comunidad (Ley 715, num. 10.1).", false], ["B", "la envíe a la secretaría de educación para que sea esa entidad la que estudie y apruebe primero el nuevo énfasis.", "La secretaría verifica el cumplimiento de requisitos después de que la institución planea y evalúa el PEI (Ley 115, art. 144, lit. g); no es la primera instancia de estudio.", false], ["C", "antes de decidir, cuente con el concepto del consejo académico, que es el órgano consultor en la revisión de la propuesta del PEI.", "El Decreto 1860 de 1994, artículo 24, literal a, asigna al consejo académico servir de órgano consultor del consejo directivo en la revisión de la propuesta del PEI; además, el ajuste debe construirse con participación de la comunidad (Ley 715, num. 10.1).", true]]}]}, {"comp": "pedagogia_normativa", "rol": "directivo", "tag": "Competencias pedagógicas y normativa · Fondo de Servicios Educativos (Ley 715 de 2001; Decreto 4791 de 2008)", "texto": "Usted es rectora de una institución educativa oficial en un municipio no certificado de Boyacá. Es noviembre y debe preparar el presupuesto del Fondo de Servicios Educativos para la siguiente vigencia. Además, la institución necesita adquirir mobiliario y material didáctico por un valor estimado de 35 salarios mínimos legales mensuales vigentes, y un grupo de padres, preocupado por varios robos, propone que el Fondo pague una empresa de vigilancia nocturna. La auxiliar administrativa le pregunta quién ordena los pagos, ya que el Fondo no tiene personería jurídica.", "items": [{"id": "DI-112", "niv": 1, "e": "Sobre quién ordena los gastos del Fondo de Servicios Educativos, usted le aclara que", "f": "Decreto 4791 de 2008 (ordenación del gasto; responsabilidades del rector), compilado en el Decreto 1075 de 2015.", "o": [["A", "lo hace el consejo directivo en pleno, porque el Fondo carece de personería jurídica propia.", "El consejo directivo aprueba el presupuesto y reglamenta aspectos del Fondo, pero el ordenador del gasto es el rector o director rural (Decreto 4791 de 2008).", false], ["B", "lo hace el alcalde municipal, porque la institución está ubicada en un municipio que no está certificado en educación.", "En municipios no certificados el rector debe informar al alcalde sobre la ejecución de los recursos que este le gire, pero no transfiere la ordenación del gasto (Decreto 4791 de 2008).", false], ["C", "lo hace usted como rectora, en calidad de ordenadora del gasto, sin que ello implique representación legal.", "El Decreto 4791 de 2008 establece que los fondos de servicios educativos carecen de personería jurídica y que el rector o director rural es el ordenador del gasto, sin que su ejercicio implique representación legal.", true]]}, {"id": "DI-113", "niv": 2, "e": "Para el presupuesto de la siguiente vigencia, el procedimiento correcto es que", "f": "Decreto 4791 de 2008 (funciones del consejo directivo y responsabilidades del rector); Ley 115 de 1994, artículo 144, literal n.", "o": [["A", "la secretaría de educación departamental lo elabore y lo remita a la institución para su ejecución.", "La entidad territorial brinda asesoría y control, pero la elaboración del presupuesto del Fondo es del rector y su aprobación del consejo directivo (Decreto 4791 de 2008).", false], ["B", "usted elabore el proyecto y el consejo directivo lo analice, ajuste y apruebe mediante acuerdo antes del inicio de la vigencia.", "El Decreto 4791 de 2008 asigna al rector elaborar el proyecto anual de presupuesto y presentarlo al consejo directivo, y a este analizarlo, ajustarlo y aprobarlo mediante acuerdo antes del inicio de cada vigencia fiscal.", true], ["C", "usted lo apruebe mediante resolución rectoral, como ordenadora del gasto, y después lo presente al consejo directivo para su conocimiento.", "Invierte los papeles: el rector elabora y presenta el proyecto, pero la aprobación corresponde al consejo directivo mediante acuerdo (Decreto 4791 de 2008; Ley 115, art. 144, lit. n).", false]]}, {"id": "DI-114", "niv": 3, "e": "La compra del mobiliario y el material didáctico por 35 salarios mínimos debe realizarse", "f": "Ley 715 de 2001, artículo 13; Decreto 4791 de 2008 (régimen de contratación).", "o": [["A", "con sujeción al estatuto de contratación de la administración pública, porque supera los 20 salarios mínimos.", "La Ley 715 de 2001, artículo 13, y el Decreto 4791 de 2008 disponen que los contratos con recursos del Fondo de cuantía superior a 20 salarios mínimos mensuales se rigen por el estatuto contractual de la administración pública; 35 supera ese tope.", true], ["B", "según el reglamento de contratación adoptado por el consejo directivo, que rige todos los contratos del Fondo.", "El reglamento del consejo directivo aplica a los contratos inferiores a 20 salarios mínimos; por encima de esa cuantía rige el estatuto de contratación estatal (Ley 715, art. 13; Decreto 4791 de 2008).", false], ["C", "de forma directa por usted, ya que los recursos del Fondo no se rigen por las normas de contratación estatal.", "Los actos y contratos del Fondo de cuantía superior a 20 salarios mínimos se rigen por las reglas de la contratación estatal (Ley 715, art. 13).", false]]}, {"id": "DI-115", "niv": 3, "e": "Frente a la propuesta de pagar la vigilancia nocturna con recursos del Fondo, usted responde que", "f": "Decreto 4791 de 2008 (prohibiciones en la ejecución del gasto), compilado en el Decreto 1075 de 2015.", "o": [["A", "es procedente si el consejo directivo la autoriza expresamente mediante un acuerdo, dada la situación de seguridad que enfrenta la institución.", "La autorización del consejo directivo no levanta una prohibición reglamentaria: el ordenador del gasto no puede contratar servicios de aseo y vigilancia con recursos del Fondo (Decreto 4791 de 2008).", false], ["B", "no es procedente, porque la norma prohíbe pagar con el Fondo servicios de vigilancia del establecimiento.", "El Decreto 4791 de 2008, en las prohibiciones en la ejecución del gasto, establece que el ordenador del gasto del Fondo no puede contratar servicios de aseo y vigilancia del establecimiento educativo.", true], ["C", "es procedente siempre que el valor del contrato sea inferior a 20 salarios mínimos.", "La cuantía determina el régimen de contratación, no levanta las prohibiciones: contratar vigilancia está prohibido con recursos del Fondo cualquiera que sea su valor (Decreto 4791 de 2008).", false]]}]}, {"comp": "pedagogia_normativa", "rol": "directivo", "tag": "Competencias pedagógicas y normativa · Evaluación de desempeño docente (Decreto 1278 de 2002)", "texto": "Usted es rectora de una institución educativa oficial de calendario A en Bucaramanga, cuyo año académico termina el 30 de noviembre. Está organizando la evaluación anual de desempeño de los docentes regidos por el Decreto 1278 de 2002. Entre los casos especiales están: una docente que llegó por traslado el 1 de octubre, después de trabajar el resto del año en otra institución; un docente nombrado en período de prueba que se posesionó el 1 de septiembre, y un docente que no está de acuerdo con la calificación que usted le asignó y pregunta cómo puede controvertirla.", "items": [{"id": "DI-120", "niv": 2, "e": "Respecto a la docente que llegó por traslado el 1 de octubre, usted", "f": "Decreto 1278 de 2002, artículos 31 y 32.", "o": [["A", "no le realiza la evaluación anual de desempeño en esta institución, porque no ha servido en ella más de tres meses en el año.", "El Decreto 1278 de 2002, artículo 32, dispone que la evaluación de desempeño se realiza a los docentes que hayan servido en el establecimiento por un término superior a tres meses durante el año académico; del 1 de octubre al 30 de noviembre no se cumple. Su evaluación corresponde al rector de la institución donde sirvió más de tres meses durante el año, es decir, la de origen.", true], ["B", "le realiza la evaluación anual con la información de los dos meses, porque todo docente debe ser evaluado en la institución donde termina el año.", "La norma no fija la evaluación en el lugar donde se termina el año, sino en el establecimiento donde se sirvió más de tres meses (Decreto 1278, art. 32).", false], ["C", "le aplica la evaluación de período de prueba, porque es nueva en la institución.", "El período de prueba corresponde a quien ingresa a la carrera tras el concurso (Decreto 1278, arts. 12 y 31), no a quien llega por traslado.", false]]}, {"id": "DI-121", "niv": 3, "e": "Sobre el docente en período de prueba que se posesionó el 1 de septiembre, lo correcto es que", "f": "Decreto 1278 de 2002, artículo 31.", "o": [["A", "presente este año una evaluación ordinaria de desempeño, que en su caso reemplaza la de período de prueba.", "La evaluación ordinaria anual no sustituye la de período de prueba, que es la que define la inscripción en el escalafón (Decreto 1278, arts. 27 y 31).", false], ["B", "presente este año la evaluación de período de prueba, porque se vinculó al cargo antes de que terminara el respectivo año académico.", "No basta con vincularse antes del cierre: se exige haber servido el cargo al menos cuatro meses durante el año (Decreto 1278, art. 31), y del 1 de septiembre al 30 de noviembre hay tres.", false], ["C", "no sea evaluado este año en período de prueba, porque no completó cuatro meses en el cargo, y lo sea al término del año académico siguiente.", "El Decreto 1278 de 2002, artículo 31, condiciona la evaluación de período de prueba a haber servido el cargo por un período no menor a cuatro meses durante el año; de lo contrario, se espera al año académico siguiente. Del 1 de septiembre al 30 de noviembre hay menos de cuatro meses.", true]]}, {"id": "DI-122", "niv": 1, "e": "Para valorar el desempeño de los docentes, usted puede apoyarse en", "f": "Decreto 1278 de 2002, artículos 29, 32, 33 y 34.", "o": [["A", "instrumentos como la observación de clases, la autoevaluación y las encuestas a padres y estudiantes.", "El Decreto 1278 de 2002, artículo 33, menciona entre los instrumentos la observación de clases y prácticas escolares, la autoevaluación del docente, las encuestas a padres y estudiantes y el análisis de los logros de los estudiantes, entre otros.", true], ["B", "su apreciación personal del trabajo de cada docente, ya que la norma la designa como responsable de la evaluación.", "La rectora es la responsable (art. 32), pero la evaluación debe basarse en instrumentos y criterios objetivos (arts. 29 y 33), no en una apreciación personal.", false], ["C", "el puntaje en las pruebas Saber de los estudiantes de cada docente, como criterio que define la calificación.", "El logro de los estudiantes es un aspecto a considerar (arts. 33 y 34), pero la evaluación valora múltiples aspectos y no se reduce a un solo resultado externo.", false]]}, {"id": "DI-123", "niv": 3, "e": "Al docente que no está de acuerdo con su calificación, usted le informa que", "f": "Decreto 1278 de 2002, artículo 36, parágrafo; Decreto 1850 de 2002, artículo 12.", "o": [["A", "debe presentar su reclamación ante el consejo directivo, porque este órgano del gobierno escolar participa en la evaluación anual de los docentes.", "El consejo directivo participa en la evaluación (Ley 115, art. 144, lit. j), pero los recursos contra la evaluación de desempeño son la reposición y la apelación ante los superiores (Decreto 1278, art. 36, parágrafo).", false], ["B", "puede solicitar a la Comisión Nacional del Servicio Civil que repita la evaluación con otro evaluador.", "La norma no prevé repetir la evaluación con otro evaluador; prevé los recursos de reposición y apelación (Decreto 1278, art. 36, parágrafo).", false], ["C", "puede interponer reposición ante usted y apelación ante el superior jerárquico, que deben resolverse en quince días hábiles.", "El Decreto 1278 de 2002, artículo 36, parágrafo, establece que las evaluaciones de desempeño son susceptibles de reposición y apelación, resueltas dentro de los quince días hábiles siguientes por el inmediato superior y el superior jerárquico. El rector es el superior inmediato de los docentes (Decreto 1850, art. 12).", true]]}]}, {"comp": "pedagogia_normativa", "rol": "directivo", "tag": "Competencias pedagógicas y normativa · Evaluación de directivos docentes (Ley 715 de 2001; Decreto 1278 de 2002)", "texto": "Usted fue nombrado rector hace tres años, después de haberse desempeñado durante doce años como docente de aula en el sector oficial, y se rige por el Decreto 1278 de 2002. En una reunión de rectores del municipio, un colega afirma que a los rectores «nadie los evalúa»; otro sostiene que su evaluación depende únicamente de los resultados en las pruebas Saber, y un tercero pregunta qué ocurre si un rector no aprueba la evaluación de desempeño.", "items": [{"id": "DI-124", "niv": 1, "e": "Sobre quién evalúa anualmente el desempeño de los rectores, usted aclara que lo hace", "f": "Ley 715 de 2001, artículo 10, parágrafo 1; Decreto 1278 de 2002, artículos 17 y 32.", "o": [["A", "el consejo directivo de la institución, como máxima instancia del gobierno escolar.", "El consejo directivo participa en la evaluación del personal (Ley 115, art. 144, lit. j), pero la evaluación anual del rector corresponde a la entidad territorial (Ley 715, art. 10, par. 1).", false], ["B", "la entidad territorial (departamento, distrito o municipio), como superior jerárquico del rector.", "La Ley 715 de 2001, artículo 10, parágrafo 1, dispone que el desempeño de rectores y directores será evaluado anualmente por el departamento, distrito o municipio; el Decreto 1278, artículo 32, asigna esa responsabilidad al superior jerárquico.", true], ["C", "la Comisión Nacional del Servicio Civil, que resuelve las reclamaciones de la carrera docente.", "La CNSC conoce en segunda instancia de las reclamaciones sobre la carrera (Decreto 1278, art. 17), pero no realiza la evaluación anual de desempeño de los rectores.", false]]}, {"id": "DI-125", "niv": 3, "e": "Sobre la evaluación de los directivos, usted explica que la norma prevé valorar como mínimo", "f": "Decreto 1278 de 2002, artículo 34, parágrafo.", "o": [["A", "su liderazgo, la eficiencia, la organización del trabajo y los resultados de la institución, como la retención y la promoción.", "El Decreto 1278 de 2002, artículo 34, parágrafo, prevé que la evaluación de los directivos dé cuenta, por lo menos, de su liderazgo, eficiencia, organización del trabajo y resultados de la institución, medidos con la retención y promoción de los alumnos y la evaluación externa de competencias básicas.", true], ["B", "los resultados de los estudiantes en las pruebas Saber 11, por ser el indicador externo que refleja de manera más objetiva la gestión del rector.", "Los resultados de la evaluación externa son uno de los elementos, junto con la retención y la promoción, el liderazgo, la eficiencia y la organización del trabajo (Decreto 1278, art. 34, parágrafo).", false], ["C", "el dominio de estrategias pedagógicas y de la didáctica del área en la que se desempeñó como docente.", "Esos son aspectos previstos para evaluar a los docentes (Decreto 1278, art. 34); para los directivos, el parágrafo del mismo artículo señala áreas propias de su cargo.", false]]}, {"id": "DI-126", "niv": 2, "e": "Si un rector que proviene de la docencia estatal no aprueba la evaluación de desempeño durante dos años consecutivos, la consecuencia es que", "f": "Ley 715 de 2001, artículo 10, parágrafo 1; Decreto 1278 de 2002, artículo 36.", "o": [["A", "es trasladado como rector a otra institución del mismo municipio para un nuevo período.", "La norma no prevé el traslado como consecuencia de la evaluación no satisfactoria; prevé el regreso a la docencia (Ley 715, art. 10, par. 1).", false], ["B", "regresa a la docencia cuando exista vacante, con el salario de su grado y nivel en el escalafón.", "La Ley 715 de 2001 (art. 10, par. 1) y el Decreto 1278 de 2002 (art. 36, num. 1) disponen que el directivo que proviene de la docencia estatal y no aprueba la evaluación durante dos años consecutivos regresa a la docencia, con el salario de su grado y nivel.", true], ["C", "es retirado del servicio y excluido del escalafón docente de manera inmediata.", "Esa consecuencia aplica al directivo que no provenía de la docencia estatal; quien sí provenía regresa a la docencia (Decreto 1278, art. 36, num. 1).", false]]}]}, {"comp": "pedagogia_normativa", "rol": "directivo", "tag": "Competencias pedagógicas y normativa · Gestión institucional y plan de mejoramiento (Guía 34)", "texto": "Usted es rectora de una institución educativa de Ibagué que atiende a 1.400 estudiantes, entre ellos un número creciente de niños y niñas migrantes. La secretaría de educación solicitó actualizar el plan de mejoramiento institucional. Usted conformó un equipo de gestión con coordinadores, docentes, una madre del consejo de padres y el personero. En la primera reunión, una docente propone empezar de inmediato a escribir las actividades del nuevo plan «porque todos sabemos cuáles son los problemas».", "items": [{"id": "DI-127", "niv": 1, "e": "Frente a la propuesta de la docente, usted orienta al equipo para que el primer paso sea", "f": "MEN (2008). Guía 34: Guía para el mejoramiento institucional, ruta del mejoramiento.", "o": [["A", "redactar de inmediato las actividades del plan, aprovechando el conocimiento que el equipo ya tiene de los problemas de la institución.", "Salta la primera etapa de la ruta: sin autoevaluación, el plan se basa en percepciones y no en un perfil institucional con fortalezas y oportunidades de mejoramiento (Guía 34).", false], ["B", "definir los indicadores de seguimiento, para garantizar desde el inicio que el plan sea evaluable.", "Los indicadores hacen parte de la elaboración del plan, segunda etapa de la ruta; antes se requiere la autoevaluación institucional (Guía 34).", false], ["C", "realizar la autoevaluación institucional, revisando la identidad de la institución y valorando cada área de gestión.", "La Guía 34 propone una ruta de tres etapas: autoevaluación institucional (revisión de la identidad, evaluación de cada área de gestión, perfil, fortalezas y oportunidades), elaboración del plan de mejoramiento, y seguimiento y evaluación.", true]]}, {"id": "DI-128", "niv": 3, "e": "Al revisar el proceso «clima escolar», el equipo debe ubicarlo en el área de gestión", "f": "MEN (2008). Guía 34: áreas y procesos de la gestión institucional.", "o": [["A", "de la comunidad, junto con la participación y la convivencia.", "Es un error frecuente por la cercanía con la convivencia, pero en la Guía 34 el clima escolar es un proceso de la gestión directiva; la gestión de la comunidad incluye participación y convivencia, inclusión, proyección y prevención de riesgos.", false], ["B", "académica, junto con las prácticas pedagógicas y la gestión de aula.", "La gestión académica comprende diseño pedagógico, prácticas pedagógicas, gestión de aula y seguimiento académico; el clima escolar pertenece a la gestión directiva (Guía 34).", false], ["C", "directiva, junto con el gobierno escolar y la cultura institucional.", "La Guía 34 del MEN (2008) ubica expresamente el proceso «clima escolar» en el área de gestión directiva, junto con el direccionamiento estratégico y horizonte institucional, la gestión estratégica, el gobierno escolar, la cultura institucional y las relaciones con el entorno.", true]]}, {"id": "DI-129", "niv": 2, "e": "Si en un proceso las acciones están articuladas y son conocidas por la comunidad, pero aún no se evalúan de manera sistemática, según la escala de la Guía 34 ese proceso está en el nivel de", "f": "MEN (2008). Guía 34: escala de valoración de la autoevaluación.", "o": [["A", "pertinencia.", "En el nivel de pertinencia apenas hay principios de planeación y articulación; la descripción del enunciado, con acciones articuladas y conocidas, corresponde a un nivel superior.", false], ["B", "apropiación.", "La Guía 34 define el nivel 3, apropiación, como aquel en que las acciones tienen mayor articulación y son conocidas por la comunidad, pero todavía no se realiza un proceso sistemático de evaluación y mejoramiento.", true], ["C", "mejoramiento continuo.", "El mejoramiento continuo exige evaluar los procesos y resultados y ajustarlos en consecuencia, condición que el enunciado señala como ausente (Guía 34).", false]]}, {"id": "DI-130", "niv": 2, "e": "Al formular el plan de mejoramiento, usted vela por que", "f": "MEN (2008). Guía 34: elaboración del plan de mejoramiento.", "o": [["A", "tenga un horizonte de tres años e incluya objetivos, metas, indicadores, actividades con responsables, cronograma y recursos.", "La Guía 34 plantea el plan de mejoramiento a tres años, liderado por el rector y su equipo de gestión, con objetivos, metas, resultados esperados, actividades y responsables, cronograma, recursos e indicadores de seguimiento.", true], ["B", "se limite a las actividades del año en curso, ya que el presupuesto del Fondo de Servicios Educativos se aprueba por vigencias anuales.", "La vigencia anual del presupuesto no limita el horizonte del plan: la Guía 34 propone un plan a tres años, que se apoya en planes y presupuestos anuales.", false], ["C", "se concentre en la gestión académica, porque los resultados de aprendizaje son la razón de ser de la institución.", "La gestión académica es central, pero el plan surge de la autoevaluación de las cuatro áreas de gestión y debe atender las oportunidades de mejoramiento que se identifiquen en todas ellas (Guía 34).", false]]}]}, {"comp": "pedagogia_normativa", "rol": "directivo", "tag": "Competencias pedagógicas y normativa · Comité escolar de convivencia (Ley 1620 de 2013; Decreto 1965 de 2013)", "texto": "Usted es rector de una institución educativa oficial de Pereira con básica secundaria y media. Al iniciar el año debe conformar el comité escolar de convivencia y fijar su calendario de sesiones. En marzo, la orientadora le informa que una estudiante de octavo le contó que un vigilante de la empresa contratista la tocó de manera indebida en el baño. Semanas después, mientras usted asiste a una reunión en Bogotá, el coordinador propone reunir el comité sin usted para hacer seguimiento a un caso de agresión repetida entre dos estudiantes.", "items": [{"id": "DI-131", "niv": 2, "e": "Para conformar el comité escolar de convivencia, además de usted y el coordinador, deben integrarlo", "f": "Ley 1620 de 2013, artículo 12.", "o": [["A", "los representantes de los docentes y de los padres ante el consejo directivo, el personero y el docente con función de orientación.", "Confunde la conformación del comité con la del consejo directivo: por los padres asiste el presidente del consejo de padres, y faltan el presidente del consejo de estudiantes y el docente que lidera convivencia (Ley 1620, art. 12).", false], ["B", "el personero, el representante de los estudiantes ante el consejo directivo, el representante de los exalumnos y dos docentes elegidos en la asamblea de docentes de la institución.", "Mezcla miembros del consejo directivo con los del comité; la Ley 1620 no incluye al representante de los exalumnos ni a dos docentes elegidos en asamblea (art. 12).", false], ["C", "el personero, el docente con función de orientación, los presidentes del consejo de padres y del consejo de estudiantes y un docente que lidere la convivencia.", "La Ley 1620 de 2013, artículo 12, conforma el comité con el rector (quien lo preside), el personero, el docente con función de orientación, el coordinador, el presidente del consejo de padres, el presidente del consejo de estudiantes y un docente que lidere procesos de convivencia.", true]]}, {"id": "DI-132", "niv": 1, "e": "Frente al relato de la estudiante, a usted como presidente del comité le corresponde", "f": "Decreto 1965 de 2013, artículos 40 y 44; Ley 1620 de 2013, artículo 18, numeral 4.", "o": [["A", "poner el hecho en conocimiento de la Policía Nacional de inmediato y por el medio más expedito, e informar a los padres.", "Ante una situación tipo III, el Decreto 1965 de 2013, artículo 44, ordena informar a los padres y que el presidente del comité ponga la situación en conocimiento de la Policía Nacional de inmediato y por el medio más expedito, además de garantizar la atención en salud que se requiera.", true], ["B", "pedir a la empresa contratista que adelante su investigación interna y esperar el resultado antes de actuar.", "Esperar la investigación de un tercero retrasa la protección de la estudiante; el protocolo exige poner el hecho en conocimiento de la autoridad de inmediato (Decreto 1965, art. 44).", false], ["C", "citar al vigilante y a la estudiante a un espacio de conciliación para esclarecer lo ocurrido antes de informar.", "Es una presunta conducta contra la libertad, integridad y formación sexual (situación tipo III): no se concilia y debe informarse de inmediato a la Policía Nacional (Decreto 1965, arts. 40 y 44).", false]]}, {"id": "DI-133", "niv": 3, "e": "Frente a la propuesta del coordinador de reunir el comité durante su viaje, usted le indica que", "f": "Decreto 1965 de 2013, artículo 24; Ley 1620 de 2013, artículos 12 y 18.", "o": [["A", "puede reunirlo si asiste la mayoría de sus integrantes, porque así se garantiza el quórum.", "Contar con la mayoría no basta: el Decreto 1965 de 2013, artículo 24, exige la presencia del presidente para que el comité sesione.", false], ["B", "el comité no puede sesionar sin su presidente, por lo que la sesión debe programarse cuando usted pueda presidirla.", "El Decreto 1965 de 2013, artículo 24, establece que el comité escolar de convivencia no puede sesionar sin la presencia del presidente; el seguimiento debe programarse en una sesión que el rector presida.", true], ["C", "puede reunirlo y presidirlo, porque como coordinador es miembro del comité y por esa razón lo reemplaza a usted en sus ausencias temporales.", "La norma no prevé que el coordinador reemplace al presidente en el comité; establece que el comité no puede sesionar sin su presidente (Decreto 1965, art. 24).", false]]}, {"id": "DI-134", "niv": 2, "e": "Al fijar el calendario de sesiones ordinarias del comité, usted tiene en cuenta que", "f": "Decreto 1965 de 2013, artículo 23; Ley 1620 de 2013, artículo 13.", "o": [["A", "sesiona cuando se presentan situaciones tipo II o III, ya que las de tipo I las atienden los docentes.", "El comité tiene sesiones ordinarias periódicas y funciones de promoción y prevención, no solo de atención de casos (Ley 1620, art. 13; Decreto 1965, art. 23).", false], ["B", "debe sesionar como mínimo una vez cada dos meses, sin perjuicio de las sesiones extraordinarias que usted convoque.", "El Decreto 1965 de 2013, artículo 23, dispone que el comité sesiona como mínimo una vez cada dos meses y que las sesiones extraordinarias las convoca el presidente.", true], ["C", "debe sesionar una vez por semestre, para que coincida con la entrega de informes a las familias.", "Una sesión por semestre incumple el mínimo de una sesión ordinaria cada dos meses que fija el Decreto 1965 de 2013, artículo 23.", false]]}]}, {"comp": "pedagogia_normativa", "rol": "directivo", "tag": "Competencias pedagógicas y normativa · Educación inclusiva y PIAR (Decreto 1421 de 2017)", "texto": "Usted es coordinador académico de una institución educativa oficial de Cúcuta. En julio, una familia solicita cupo en tercero para su hijo de 9 años, quien, según la madre, «tiene dificultades para hablar y para caminar». La familia no cuenta con diagnóstico ni certificado médico. La secretaria de la institución sugiere esperar el diagnóstico antes de matricularlo. La institución tiene una docente de apoyo pedagógico que atiende a varias sedes.", "items": [{"id": "DI-143", "niv": 2, "e": "Frente a la sugerencia de la secretaria, lo que corresponde es", "f": "Decreto 1075 de 2015, artículo 2.3.3.5.2.3.3 (Decreto 1421 de 2017).", "o": [["A", "orientar a la familia hacia una institución especializada en atención a la discapacidad, donde el niño recibirá una atención más pertinente.", "El estudiante tiene derecho a la oferta general con los ajustes razonables que requiera; ningún establecimiento puede rechazar la matrícula por discapacidad (Decreto 1421 de 2017).", false], ["B", "esperar el diagnóstico médico antes de matricularlo, para definir desde el inicio los apoyos que requiere.", "La falta de diagnóstico no puede retrasar el ingreso: la norma ordena proceder con la matrícula y gestionar el diagnóstico con la secretaría de educación (Decreto 1075 de 2015, art. 2.3.3.5.2.3.3).", false], ["C", "matricularlo, registrar en el SIMAT la información de la familia y reportar el caso a la secretaría para gestionar el diagnóstico.", "El Decreto 1075 de 2015, artículo 2.3.3.5.2.3.3 (Decreto 1421 de 2017), ordena que, si el estudiante no tiene diagnóstico, se proceda con la matrícula y el registro en el SIMAT con la información de la familia, y se reporte a la secretaría para establecer el diagnóstico en un plazo no mayor a tres meses.", true]]}, {"id": "DI-144", "niv": 3, "e": "Como el estudiante ingresa en julio, el PIAR y el acta de acuerdo deben elaborarse", "f": "Decreto 1075 de 2015, artículo 2.3.3.5.2.3.5 (Decreto 1421 de 2017).", "o": [["A", "en un término no mayor a treinta días desde su vinculación.", "El Decreto 1075 de 2015, artículo 2.3.3.5.2.3.5, prevé que, cuando un estudiante se vincula de manera extemporánea, se contemple un término no mayor a treinta días para elaborar el PIAR y firmar el acta de acuerdo.", true], ["B", "durante el primer trimestre del siguiente año escolar.", "El primer trimestre es el plazo general para elaborar el PIAR, pero para quien se vincula de forma extemporánea la norma fija un término no mayor a treinta días (art. 2.3.3.5.2.3.5).", false], ["C", "antes de que finalice el período académico en curso en la institución.", "La norma no se refiere al cierre del período sino a un término máximo de treinta días desde la vinculación extemporánea (art. 2.3.3.5.2.3.5).", false]]}, {"id": "DI-145", "niv": 3, "e": "Una vez diseñado el PIAR, el acta de acuerdo debe ser firmada por", "f": "Decreto 1075 de 2015, artículos 2.3.3.5.2.3.5 y 2.3.3.5.2.3.6 (Decreto 1421 de 2017).", "o": [["A", "el acudiente, el directivo de la institución, la docente de apoyo y los docentes a cargo del estudiante.", "El Decreto 1075 de 2015, artículo 2.3.3.5.2.3.6, dispone que el acta de acuerdo la firman el acudiente, el directivo de la institución, el docente de apoyo y los docentes a cargo, quienes conservan copia para su seguimiento.", true], ["B", "la docente de apoyo y el médico tratante del estudiante, que son quienes definen los ajustes razonables.", "Los ajustes razonables se definen a partir de la valoración pedagógica, no de un diagnóstico médico, y la familia y los docentes de aula deben firmar el acta (art. 2.3.3.5.2.3.6).", false], ["C", "el acudiente y el rector, quien la remite a la secretaría de educación para su aprobación.", "El acta no requiere aprobación de la secretaría y deben firmarla también la docente de apoyo y los docentes a cargo (art. 2.3.3.5.2.3.6).", false]]}, {"id": "DI-146", "niv": 1, "e": "Para que los ajustes razonables del PIAR se gestionen de manera efectiva, usted como directivo debe", "f": "Decreto 1421 de 2017 (responsabilidades de los establecimientos educativos; planes de mejoramiento institucional), compilado en el Decreto 1075 de 2015.", "o": [["A", "solicitar a la familia que asuma los costos de los apoyos que el estudiante requiera.", "La familia tiene compromisos de corresponsabilidad, pero los apoyos y ajustes son obligaciones del sistema educativo, gestionados por el establecimiento y la entidad territorial (Decreto 1421 de 2017).", false], ["B", "dejar su gestión a cargo de la docente de apoyo, ya que es quien conoce las necesidades del estudiante.", "La docente de apoyo participa en el diseño del PIAR, pero la norma asigna a los directivos articular los ajustes con el plan de mejoramiento institucional y garantizar su cumplimiento (Decreto 1421 de 2017).", false], ["C", "articularlos con el plan de mejoramiento institucional y con la planeación de aula.", "El Decreto 1421 de 2017 obliga a los establecimientos a articular los PIAR con la planeación de aula y el plan de mejoramiento institucional, y dispone que el directivo articule en el PMI los ajustes razonables incluidos en los PIAR.", true]]}]}, {"comp": "pedagogia_normativa", "rol": "directivo", "tag": "Competencias pedagógicas y normativa · Jornada escolar y laboral (Decreto 1075 de 2015, modificado por el Decreto 277 de 2025)", "texto": "Usted es rector de una institución educativa oficial de Neiva con preescolar, básica y media. Está organizando la asignación académica y los horarios del año. Marta, docente de matemáticas de básica secundaria, tiene a cargo 16 horas semanales de matemáticas y 4 de estadística, en horas efectivas de 60 minutos. Un docente de sociales le pide salir todos los días después de su última clase, a las 11:00 a. m., para preparar clases en su casa, aunque el horario de permanencia de los docentes en la institución va de 6:30 a. m. a 12:30 p. m. Por su parte, el coordinador pregunta si a él también le aplica esa permanencia de seis horas.", "items": [{"id": "DI-147", "niv": 2, "e": "Para completar la asignación académica semanal de Marta, le faltan", "f": "Decreto 1075 de 2015, artículo 2.4.3.2.1, modificado por el Decreto 277 de 2025.", "o": [["A", "0 horas, porque las 20 horas que tiene ya cumplen la asignación exigida.", "Toma como referencia las 20 horas semanales, que corresponden a la asignación de preescolar; en básica secundaria y media la asignación es de 22 horas (Decreto 1075 de 2015, art. 2.4.3.2.1, modificado por el Decreto 277 de 2025).", false], ["B", "2 horas efectivas, para llegar a las 22 horas semanales.", "La asignación académica semanal en básica secundaria y media es de 22 horas (Decreto 1075 de 2015, art. 2.4.3.2.1, modificado por el Decreto 277 de 2025). Marta tiene 16 + 4 = 20 horas, así que le faltan 22 − 20 = 2.", true], ["C", "5 horas efectivas, para llegar a las 25 horas semanales.", "Usa las 25 horas semanales, que corresponden a la asignación de básica primaria; Marta es docente de secundaria (Decreto 1075 de 2015, art. 2.4.3.2.1, modificado por el Decreto 277 de 2025).", false]]}, {"id": "DI-148", "niv": 2, "e": "Frente a la solicitud del docente de sociales, usted le responde que", "f": "Decreto 1075 de 2015, artículo 2.4.3.3.3, modificado por el Decreto 277 de 2025.", "o": [["A", "puede retirarse al terminar sus clases, porque la preparación de clases es una actividad curricular complementaria que puede realizar en su casa.", "Preparar clases es una actividad complementaria, pero la norma exige seis horas diarias continuas de permanencia en el establecimiento; solo el tiempo restante de la jornada se cumple de forma autónoma (Decreto 277 de 2025).", false], ["B", "debe permanecer seis horas continuas en la institución, y el tiempo restante de su jornada puede completarlo fuera de ella.", "El Decreto 1075 de 2015, artículo 2.4.3.3.3, modificado por el Decreto 277 de 2025, establece que los docentes de aula permanecen seis horas diarias continuas en el establecimiento, distribuidas por el rector, y completan el resto de la jornada laboral de ocho horas realizando autónomamente actividades curriculares complementarias.", true], ["C", "puede retirarse al terminar sus clases si recupera ese tiempo en reuniones de área programadas los sábados.", "La norma no prevé compensar la permanencia diaria con jornadas en otros días; las seis horas deben ser diarias y continuas (Decreto 277 de 2025).", false]]}, {"id": "DI-149", "niv": 3, "e": "Al coordinador, usted le explica que", "f": "Decreto 1075 de 2015, artículo 2.4.3.3.3, modificado por el Decreto 277 de 2025.", "o": [["A", "su jornada se ajusta al horario de los estudiantes, de modo que termina cuando ellos salen de la institución.", "La jornada laboral no equivale a la jornada escolar de los estudiantes; para los directivos es de ocho horas diarias dedicadas a las funciones del cargo (Decreto 1075 de 2015, art. 2.4.3.3.3, modificado por el Decreto 277 de 2025).", false], ["B", "le aplica la misma regla de los docentes de aula: seis horas en la institución y el resto de su jornada de forma autónoma.", "La regla de seis horas de permanencia y trabajo autónomo está prevista para los docentes de aula; los directivos docentes dedican las ocho horas de su jornada a las funciones propias del cargo (Decreto 277 de 2025).", false], ["C", "como directivo dedica las ocho horas diarias de su jornada a las funciones del cargo; la regla de seis horas es para docentes de aula.", "El Decreto 1075 de 2015, artículo 2.4.3.3.3, modificado por el Decreto 277 de 2025, dispone que directivos docentes y docentes dedican ocho horas diarias a las funciones de su cargo, y reserva la regla de seis horas continuas de permanencia con trabajo autónomo posterior a los docentes de aula.", true]]}, {"id": "DI-150", "niv": 1, "e": "Para las semanas de desarrollo institucional, usted", "f": "Decreto 1850 de 2002, artículos 8 y 14.", "o": [["A", "adopta un plan de trabajo para directivos y docentes sobre el PEI, el plan de estudios, la actualización y la evaluación institucional.", "El Decreto 1850 de 2002, artículo 8, define estas actividades (formulación y ajuste del PEI, plan de estudios, investigación y actualización pedagógica, evaluación institucional) y ordena al rector adoptar un plan de trabajo para directivos y docentes durante toda la jornada laboral.", true], ["B", "programa clases de nivelación para los estudiantes con bajo desempeño, aprovechando que en esas semanas los docentes están disponibles en la institución.", "Esas cinco semanas son distintas de las 40 semanas lectivas y se dedican a actividades institucionales como el PEI y el plan de estudios, no a clases (Decreto 1850, arts. 8 y 14).", false], ["C", "concede a los docentes ese tiempo para trabajo autónomo en casa, ya que no hay estudiantes en la institución.", "La ausencia de estudiantes no convierte esas semanas en trabajo autónomo: el rector debe adoptar un plan de trabajo para directivos y docentes durante toda la jornada laboral (Decreto 1850, art. 8).", false]]}]}, {"comp": "pedagogia_normativa", "rol": "directivo", "tag": "Competencias pedagógicas y normativa · Gobierno escolar y participación (Ley 115 de 1994; Decreto 1860 de 1994; Ley 1620 de 2013)", "texto": "Usted es rectora de una institución educativa oficial de Pasto. El personero estudiantil le presentó una solicitud para que los estudiantes puedan usar la biblioteca durante el descanso, y usted la negó por falta de personal. Además, la comunidad pide actualizar el manual de convivencia para regular el uso de celulares en clase. Por último, después de un cese de actividades de tres días convocado por el sindicato docente, un miembro del consejo directivo propone que el consejo autorice reponer esas clases los sábados.", "items": [{"id": "DI-151", "niv": 1, "e": "Si el personero no está de acuerdo con la decisión que usted tomó sobre su solicitud, él puede", "f": "Decreto 1860 de 1994, artículo 28, literal d; Ley 115 de 1994, artículo 94.", "o": [["A", "apelarla ante el comité de convivencia.", "El comité escolar de convivencia atiende situaciones que afectan la convivencia (Ley 1620, art. 13); no es instancia de apelación de las decisiones del rector sobre las solicitudes del personero.", false], ["B", "apelarla ante el consejo académico.", "El consejo académico se ocupa del currículo, el plan de estudios y la evaluación; la apelación de las decisiones del rector sobre peticiones del personero va al consejo directivo (Decreto 1860, art. 28).", false], ["C", "apelarla ante el consejo directivo.", "El Decreto 1860 de 1994, artículo 28, literal d, faculta al personero para apelar ante el consejo directivo las decisiones del rector sobre las peticiones presentadas por su intermedio; la Ley 115, artículo 94, también remite al consejo directivo.", true]]}, {"id": "DI-152", "niv": 2, "e": "Para actualizar el manual de convivencia, usted", "f": "Ley 1620 de 2013, artículo 18, numeral 3; Decreto 1860 de 1994, artículo 23, literal c.", "o": [["A", "encarga su redacción al comité de convivencia, que lo aprueba en su siguiente sesión ordinaria.", "El comité hace seguimiento al manual (Ley 1620, art. 13), pero no lo aprueba; la adopción corresponde al consejo directivo (Decreto 1860, art. 23, lit. c).", false], ["B", "lidera una revisión participativa con estudiantes y demás estamentos, y presenta la propuesta al consejo directivo para su adopción.", "La Ley 1620 de 2013, artículo 18, numeral 3, asigna al rector liderar la revisión y ajuste anual del manual en un proceso participativo que involucre a los estudiantes y a la comunidad, y el Decreto 1860 de 1994, artículo 23, literal c, asigna al consejo directivo adoptarlo.", true], ["C", "lo modifica mediante resolución rectoral, por ser quien lidera su revisión, y lo da a conocer a la comunidad al inicio del siguiente período.", "El rector lidera la revisión, pero no adopta el manual por sí solo: su adopción corresponde al consejo directivo (Decreto 1860, art. 23, lit. c), tras un proceso participativo (Ley 1620, art. 18).", false]]}, {"id": "DI-153", "niv": 3, "e": "Frente a la propuesta de que el consejo directivo autorice reponer las clases los sábados, usted explica que", "f": "Decreto 1850 de 2002, artículo 15; Ley 115 de 1994, artículo 144, literal a.", "o": [["A", "ni el consejo directivo ni la rectoría son competentes para autorizar la reposición de clases por días no trabajados por cese de actividades.", "El Decreto 1850 de 2002, artículo 15, establece que las autoridades territoriales, los consejos directivos y los rectores no son competentes para autorizar la reposición de clases por días no trabajados por cese de actividades académicas.", true], ["B", "la rectoría puede autorizarlo, porque al rector le corresponde fijar el horario de la jornada escolar.", "Fijar el horario no incluye autorizar reposiciones por días no trabajados: el Decreto 1850, artículo 15, también niega esa competencia a los rectores.", false], ["C", "el consejo directivo puede autorizarlo, porque le corresponde tomar las decisiones que afectan el funcionamiento de la institución.", "Esa función general del consejo (Ley 115, art. 144, lit. a) excluye las decisiones que competen a otra autoridad; el Decreto 1850, artículo 15, niega a los consejos directivos competencia para autorizar estas reposiciones.", false]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Estatuto de Profesionalización Docente (Decreto 1278 de 2002)", "texto": "Laura es ingeniera ambiental y superó el concurso de méritos para el cargo de docente de ciencias naturales. Fue nombrada en período de prueba el 15 de agosto en una institución con calendario A, cuyo año escolar termina el 30 de noviembre. Durante su inducción, pregunta a la coordinadora cómo será su evaluación y qué debe hacer para inscribirse en el escalafón.", "items": [{"id": "ED-001", "niv": 2, "e": "Sobre la evaluación del período de prueba, la coordinadora le explica correctamente que", "f": "Decreto 1278 de 2002, artículos 12 y 31.", "o": [["A", "su evaluación se hará cuando cumpla doce meses en el cargo, sin importar el calendario escolar.", "El Decreto 1278 no fija un plazo de doce meses: la evaluación se hace al terminar el año escolar y exige un mínimo de cuatro meses de servicio en ese año.", false], ["B", "será evaluada al terminar este año escolar, porque ya habrá cumplido cuatro meses en el cargo.", "Entre el 15 de agosto y el 30 de noviembre hay tres meses y medio, menos de cuatro meses. El artículo 31 del Decreto 1278 exige haber servido no menos de cuatro meses durante el año; si no se cumplen, se espera al año académico siguiente.", false], ["C", "como no alcanzará cuatro meses de servicio este año, su evaluación será al terminar el año siguiente.", "Los artículos 12 y 31 del Decreto 1278 de 2002 señalan que el período de prueba se evalúa al terminar el año escolar si se ha servido el cargo al menos cuatro meses; de lo contrario, se espera hasta el año académico siguiente.", true]]}, {"id": "ED-002", "niv": 1, "e": "Como Laura no es licenciada, al término del período de prueba deberá acreditar que", "f": "Decreto 1278 de 2002, artículo 12, parágrafo 1.", "o": [["A", "obtuvo un título de licenciatura en ciencias naturales, para poder continuar en el cargo docente.", "La norma no exige obtener una licenciatura; permite acreditar un posgrado en educación o un programa de pedagogía.", false], ["B", "cursa o terminó un posgrado en educación o un programa de pedagogía en una institución de educación superior.", "El parágrafo 1 del artículo 12 del Decreto 1278 de 2002 exige a los profesionales con título diferente al de licenciado acreditar, al término del período de prueba, que cursan o terminaron un posgrado en educación o un programa de pedagogía.", true], ["C", "tiene al menos dos años de experiencia docente certificada en instituciones públicas o privadas.", "El Decreto 1278 no establece ese requisito para superar el período de prueba; lo que exige a los no licenciados es formación pedagógica.", false]]}, {"id": "ED-003", "niv": 2, "e": "Si Laura obtiene 65 % en la evaluación del período de prueba, entonces", "f": "Decreto 1278 de 2002, artículos 21 y 31.", "o": [["A", "será inscrita en el escalafón en el grado que corresponda según los títulos que acredite.", "El artículo 31 del Decreto 1278 de 2002 considera satisfactoria una calificación igual o superior al 60 %; quien la obtiene es inscrito en el escalafón en el grado que corresponda según sus títulos académicos.", true], ["B", "será inscrita en el grado tres del escalafón, porque superó el período de prueba con calificación satisfactoria.", "Supera el período de prueba, pero el grado tres exige maestría o doctorado (art. 21). El grado depende de los títulos que acredite.", false], ["C", "deberá repetir el período de prueba, porque el puntaje satisfactorio mínimo es del 70 %.", "El artículo 31 del Decreto 1278 fija como satisfactoria una calificación igual o superior al 60 %, no al 70 %.", false]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Evaluación del aprendizaje (Decreto 1290 de 2009)", "texto": "En una institución educativa, el sistema institucional de evaluación de los estudiantes (SIEE) usa una escala de 1,0 a 5,0, con valoraciones expresadas con un decimal, con esta equivalencia: 4,6 a 5,0 desempeño superior; 4,0 a 4,5 desempeño alto; 3,0 a 3,9 desempeño básico; 1,0 a 2,9 desempeño bajo. En la quinta semana del primer período, los padres de un estudiante de tercer grado le piden a usted, su docente, que el niño sea promovido a cuarto, porque lee y resuelve problemas con mucha más soltura que sus compañeros. Sus valoraciones parciales en todas las áreas están entre 4,7 y 5,0.", "items": [{"id": "EV-001", "niv": 1, "e": "Para tramitar la solicitud de promoción anticipada, el procedimiento que corresponde es que", "f": "Decreto 1290 de 2009, artículo 7 (compilado en el Decreto 1075 de 2015).", "o": [["A", "el consejo académico la decida en su próxima sesión y el rector la registre en el sistema de matrícula.", "El consejo académico solo recomienda; quien decide es el consejo directivo, y la decisión se consigna en su acta y, si es positiva, en el registro escolar.", false], ["B", "el consejo académico, con consentimiento de los padres, la recomiende y el consejo directivo decida.", "Según el artículo 7 del Decreto 1290 de 2009, durante el primer período el consejo académico, previo consentimiento de los padres, recomienda la promoción anticipada ante el consejo directivo; la decisión se consigna en el acta del consejo directivo.", true], ["C", "el docente de grado la apruebe directamente, porque es quien conoce mejor el desempeño del estudiante.", "El docente aporta evidencia del desempeño, pero la norma no le da la facultad de decidir: la recomienda el consejo académico y la decide el consejo directivo.", false]]}, {"id": "EV-002", "niv": 1, "e": "Si los padres hubieran presentado la solicitud en el tercer período, lo adecuado sería explicarles que", "f": "Decreto 1290 de 2009, artículo 7.", "o": [["A", "la solicitud debe presentarse ante la secretaría de educación, que es la competente después del primer período.", "La norma no traslada la competencia a la secretaría de educación; simplemente fija el primer período del año escolar como el momento para la promoción anticipada.", false], ["B", "la promoción puede tramitarse en cualquier período si el estudiante mantiene desempeño superior.", "El desempeño superior es requisito, pero no habilita el trámite en cualquier momento: la norma lo ubica durante el primer período.", false], ["C", "la norma prevé la promoción anticipada durante el primer período del año escolar.", "El artículo 7 del Decreto 1290 de 2009 establece que la promoción anticipada se tramita «durante el primer período del año escolar».", true]]}, {"id": "EV-003", "niv": 2, "e": "Otro estudiante del grupo obtiene 3,5 en matemáticas. En el informe a los padres, usted debe expresar que, en la escala nacional, su desempeño es", "f": "Decreto 1290 de 2009, artículos 4 (numeral 2) y 5.", "o": [["A", "básico, lo que indica que superó los desempeños necesarios en el área.", "Con la equivalencia del SIEE, 3,5 está en el rango básico. El artículo 5 del Decreto 1290 de 2009 define el desempeño básico como la superación de los desempeños necesarios en relación con las áreas obligatorias y fundamentales.", true], ["B", "bajo, porque no alcanza el 4,0 que marca el inicio del desempeño alto.", "El desempeño bajo corresponde a la no superación de los desempeños necesarios. En la escala del caso, 3,5 está dentro del rango de 3,0 a 3,9, equivalente a básico.", false], ["C", "básico, lo que indica que debe presentar actividades de recuperación para aprobar.", "El nivel es básico, pero la interpretación es errónea: según la norma, básico significa que el estudiante superó los desempeños necesarios, no que tenga el área pendiente.", false]]}, {"id": "EV-004", "niv": 1, "e": "Si al final del año la comisión de evaluación determina que un estudiante no puede ser promovido al grado siguiente, la institución debe", "f": "Decreto 1290 de 2009, artículo 6.", "o": [["A", "reservarle el cupo solo si la familia firma un compromiso académico.", "La norma no condiciona el cupo a un compromiso; dice que se debe garantizar «en todos los casos».", false], ["B", "recomendar a la familia trasladarlo a otra institución para que repita el grado.", "Contradice la norma: el establecimiento debe garantizar el cupo para que el estudiante continúe su proceso formativo en la misma institución.", false], ["C", "garantizarle en todos los casos el cupo para que continúe con su proceso formativo.", "El artículo 6 del Decreto 1290 de 2009 establece que, cuando un estudiante no puede ser promovido, el establecimiento debe garantizarle en todos los casos el cupo para que continúe con su proceso formativo.", true]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Gobierno escolar y PEI (Ley 115 de 1994)", "texto": "Usted fue elegido como uno de los representantes de los docentes ante el consejo directivo de una institución educativa oficial. En la primera sesión del año se discuten tres temas: una propuesta para ajustar el plan de estudios de la media técnica, los criterios para asignar 15 cupos disponibles en grado sexto y la reclamación de una familia que considera injusta la sanción impuesta a su hija por un docente.", "items": [{"id": "GE-001", "niv": 2, "e": "Sobre la propuesta de ajuste al plan de estudios, lo que corresponde es que", "f": "Ley 115 de 1994, artículos 144 (literal g) y 145.", "o": [["A", "el consejo directivo la apruebe directamente, porque es la máxima instancia del gobierno escolar.", "Aunque el consejo directivo es la instancia superior de decisión, la ley asigna expresamente al consejo académico el estudio y la organización del plan de estudios.", false], ["B", "el consejo académico la estudie y organice, y el consejo directivo participe en su evaluación dentro del PEI.", "La Ley 115 asigna al consejo académico el estudio, modificación y ajustes al currículo y la organización del plan de estudios (art. 145), y al consejo directivo participar en la planeación y evaluación del PEI, del currículo y del plan de estudios (art. 144, literal g).", true], ["C", "la secretaría de educación la apruebe primero, antes de que la estudie cualquier órgano del gobierno escolar.", "La secretaría verifica el cumplimiento de requisitos después de que la institución elabora y somete el plan; no es la primera instancia de estudio.", false]]}, {"id": "GE-002", "niv": 1, "e": "Sobre los criterios para asignar los 15 cupos disponibles, la ley establece que corresponde", "f": "Ley 115 de 1994, artículo 144, literal d.", "o": [["A", "al consejo directivo fijarlos, como una de sus funciones legales.", "El artículo 144, literal d, de la Ley 115 de 1994 establece como función del consejo directivo fijar los criterios para la asignación de cupos disponibles.", true], ["B", "al consejo académico fijarlos, porque se trata de un asunto del grado sexto.", "El consejo académico se ocupa del currículo, el plan de estudios y la evaluación; la asignación de cupos es función del consejo directivo.", false], ["C", "al rector fijarlos, porque es el responsable de la matrícula en la institución.", "El rector dirige los procesos administrativos, pero la Ley 115 asigna expresamente al consejo directivo fijar los criterios para la asignación de cupos (art. 144, literal d).", false]]}, {"id": "GE-003", "niv": 2, "e": "Respecto a la reclamación de la familia por la sanción impuesta por el docente, el consejo directivo", "f": "Ley 115 de 1994, artículo 144, literal b.", "o": [["A", "debe abstenerse, porque las sanciones disciplinarias solo las revisa el comité escolar de convivencia.", "El comité de convivencia tiene funciones en situaciones que afectan la convivencia, pero la Ley 115 asigna al consejo directivo servir de instancia para resolver conflictos entre docentes y alumnos (art. 144, literal b).", false], ["B", "puede servir de instancia para resolverla, ya que es un conflicto entre un docente y una alumna.", "El artículo 144, literal b, de la Ley 115 de 1994 establece como función del consejo directivo servir de instancia para resolver los conflictos que se presenten entre docentes y administrativos con los alumnos.", true], ["C", "debe remitirla a la secretaría de educación, porque involucra a un docente nombrado en propiedad.", "No se trata de una falta disciplinaria del docente sino de un desacuerdo con una sanción a una estudiante; la instancia institucional es el consejo directivo.", false]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Educación inclusiva (Decreto 1421 de 2017)", "texto": "A su grupo de cuarto grado ingresa en marzo un estudiante con baja visión. La familia informa que todavía está esperando la cita con el especialista y por eso no ha entregado un diagnóstico médico. En las primeras semanas, usted observa que el estudiante no alcanza a leer lo que se escribe en el tablero, se acerca mucho al cuaderno y se cansa rápido en las actividades de lectura, aunque participa con entusiasmo en las discusiones orales.", "items": [{"id": "IN-001", "niv": 2, "e": "Mientras llega el diagnóstico médico, frente a los ajustes razonables usted debe", "f": "Decreto 1421 de 2017 (Decreto 1075 de 2015, art. 2.3.3.5.1.4, definición de ajustes razonables).", "o": [["A", "esperar el diagnóstico para no aplicar ajustes que luego resulten inadecuados para su condición.", "Según el Decreto 1421 de 2017, los ajustes razonables no dependen de un diagnóstico médico; esperar mantiene las barreras que hoy limitan el aprendizaje del estudiante.", false], ["B", "solicitar a la familia que acelere la cita, porque sin diagnóstico no es posible hacer ajustes.", "Pedir información a la familia es válido, pero la premisa es falsa: la norma establece que los ajustes no dependen del diagnóstico sino de las barreras.", false], ["C", "implementar ajustes según las barreras observadas, como ampliar el material y ubicarlo cerca.", "El Decreto 1421 de 2017 define que la realización de los ajustes razonables «no depende de un diagnóstico médico de deficiencia, sino de las barreras visibles e invisibles» que impiden el goce del derecho a la educación.", true]]}, {"id": "IN-002", "niv": 1, "e": "Para construir el Plan Individual de Ajustes Razonables (PIAR) del estudiante, usted debe", "f": "Decreto 1421 de 2017 (Decreto 1075 de 2015, arts. 2.3.3.5.1.4 y 2.3.3.5.2.3.5).", "o": [["A", "liderar su diseño junto con el docente de apoyo, la familia y el propio estudiante.", "El artículo 2.3.3.5.2.3.5 del Decreto 1075 de 2015 (Decreto 1421 de 2017) establece que el diseño de los PIAR lo lideran el o los docentes de aula con el docente de apoyo, la familia y el estudiante.", true], ["B", "solicitar que lo elabore el docente de apoyo, porque es el profesional especializado en inclusión.", "El docente de apoyo participa, pero la norma asigna el liderazgo del diseño a los docentes de aula; delegarlo por completo desconoce esa responsabilidad.", false], ["C", "remitirlo al orientador escolar para que defina los ajustes con base en una valoración clínica.", "El PIAR se basa en una valoración pedagógica y social, no clínica; el orientador puede participar según la organización escolar, pero no lo elabora solo.", false]]}, {"id": "IN-003", "niv": 2, "e": "Al planear la unidad de comprensión lectora para todo el grupo, una decisión coherente con el Diseño Universal para el Aprendizaje (DUA) es", "f": "Decreto 1421 de 2017 (Decreto 1075 de 2015, art. 2.3.3.5.1.4: definiciones de DUA, currículo flexible y PIAR).", "o": [["A", "ofrecer el mismo texto en varios formatos, como impreso ampliado, audio y lectura en voz alta, para todos.", "El DUA busca entornos y materiales accesibles para todos sin necesidad de adaptación especializada. Ofrecer múltiples formatos beneficia al grupo y elimina la barrera del estudiante con baja visión; el PIAR complementa lo que el DUA no alcanza.", true], ["B", "permitir que el estudiante con baja visión no participe en las actividades de lectura escrita.", "Excluir al estudiante de la actividad contradice el enfoque inclusivo; el Decreto 1421 busca eliminar barreras para garantizar aprendizaje y participación.", false], ["C", "preparar una guía de lectura con objetivos más sencillos para el estudiante con baja visión.", "Reducir los objetivos solo para un estudiante no es DUA. El currículo flexible mantiene los mismos objetivos generales y diversifica las formas de acceder a ellos.", false]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Constitución Política (arts. 44 y 67) y Código de la Infancia y la Adolescencia", "texto": "Usted es docente de una sede rural multigrado en zona cafetera. En época de cosecha, Andrés, de 13 años y estudiante de sexto grado, deja de asistir durante dos semanas. Al visitar la finca, usted encuentra al estudiante recolectando café durante toda la jornada. El padre le explica que la familia necesita el ingreso, que el muchacho «ya terminó la primaria» y que, a su juicio, «con saber leer y sumar es suficiente para trabajar el campo». Agrega que en marzo lo vuelve a mandar al colegio si la cosecha termina bien. La institución tiene registradas las inasistencias y no ha recibido ninguna excusa formal.", "items": [{"id": "NR-101", "niv": 1, "e": "Para explicar al padre hasta qué edad la educación es obligatoria, usted le informa que, según la Constitución, lo es", "f": "Constitución Política de Colombia, artículo 67.", "o": [["A", "entre los cinco y los doce años, y comprende el preescolar y los cinco grados de la básica primaria.", "Coincide con la idea del padre de que basta con terminar la primaria. El artículo 67 incluye nueve grados de educación básica, es decir, primaria y secundaria, no solo cinco.", false], ["B", "entre los seis y los dieciocho años, y comprende la básica primaria, la básica secundaria y la educación media.", "Confunde la obligatoriedad constitucional con la duración total de la educación formal. La media (grados décimo y once) no hace parte del mínimo obligatorio del artículo 67, que va de los cinco a los quince años.", false], ["C", "entre los cinco y los quince años, y comprende como mínimo un año de preescolar y nueve de educación básica.", "El artículo 67 de la Constitución establece que la educación será obligatoria entre los cinco y los quince años de edad y que comprenderá como mínimo un año de preescolar y nueve de educación básica. Andrés, de 13 años y en sexto grado, está dentro de ese rango.", true]]}, {"id": "NR-102", "niv": 2, "e": "Ante el argumento de que la familia necesita el ingreso, usted le explica al padre que la Constitución", "f": "Constitución Política, artículos 44, 67 y 68.", "o": [["A", "permite suspender los estudios en la zona rural mientras duren las temporadas de cosecha.", "Ninguna disposición constitucional autoriza suspender la educación obligatoria por temporadas productivas. El artículo 67 encarga al Estado asegurar a los menores las condiciones necesarias para su acceso y permanencia en el sistema educativo.", false], ["B", "reconoce la educación como derecho fundamental de los niños y los protege contra la explotación laboral o económica.", "El artículo 44 de la Constitución incluye la educación entre los derechos fundamentales de los niños y dispone que serán protegidos contra toda forma de explotación laboral o económica y trabajos riesgosos. Una jornada completa de recolección que le impide estudiar va contra esa protección.", true], ["C", "deja la decisión a los padres, porque les reconoce el derecho de escoger el tipo de educación de sus hijos.", "El artículo 68 reconoce a los padres el derecho a escoger el tipo de educación de sus hijos menores, no a decidir si el niño estudia. La obligatoriedad del artículo 67 y la protección del artículo 44 no quedan a su arbitrio.", false]]}, {"id": "NR-103", "niv": 2, "e": "Como las inasistencias continúan, frente a la situación de Andrés la institución debe, según el artículo 44 del Código de la Infancia y la Adolescencia,", "f": "Ley 1098 de 2006, artículos 42 (numeral 1) y 44 (numeral 2).", "o": [["A", "retirar al estudiante del sistema de matrícula, porque la familia decidió no enviarlo durante la cosecha.", "Retirarlo profundizaría la vulneración. El Código obliga a las instituciones a facilitar el acceso y garantizar la permanencia (artículo 42, numeral 1), no a excluir al estudiante por una decisión de su familia.", false], ["B", "esperar al cierre del período para reflejar las inasistencias en el informe de valoración académica.", "Registrar las ausencias en el boletín no cumple la obligación de detección y apoyo oportunos del numeral 2 del artículo 44; esperar al cierre del período deja al estudiante trabajando sin ninguna intervención.", false], ["C", "poner en marcha mecanismos de detección oportuna, apoyo y orientación para casos de explotación económica y laboral.", "El numeral 2 del artículo 44 de la Ley 1098 de 2006 ordena a directivos y docentes poner en marcha mecanismos para la detección oportuna, el apoyo y la orientación en casos de explotación económica y laboral, entre otros. La inasistencia por trabajo durante la jornada escolar exige esa actuación.", true]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Constitución Política (art. 68) y educación religiosa (Ley 115 de 1994)", "texto": "Usted es director de grupo de cuarto grado en una institución educativa oficial de Bucaramanga. La madre de Sofía, que pertenece a una congregación cristiana distinta de la que orienta los contenidos del área de educación religiosa, le entrega una carta en la que pide que su hija no participe en esas clases y propone que, en ese horario, la niña realice actividades de lectura en la biblioteca. Días después, en la reunión de padres, otro acudiente propone que el colegio elimine el área del plan de estudios «para evitar problemas», y un docente opina que, al ser un área obligatoria, nadie puede eximirse de ella.", "items": [{"id": "NR-104", "niv": 1, "e": "Frente a la solicitud de la madre de Sofía, lo que corresponde es", "f": "Constitución Política, artículo 68; Ley 115 de 1994, artículos 23 (parágrafo 1.°) y 24.", "o": [["A", "negarla, porque la educación religiosa es un área obligatoria y fundamental que todos los estudiantes deben cursar y aprobar.", "Que el área sea obligatoria significa que la institución debe ofrecerla, no que el estudiante deba recibirla. La propia Ley 115 aclara que en los establecimientos del Estado nadie puede ser obligado a cursarla.", false], ["B", "respetarla, porque en los establecimientos del Estado ninguna persona puede ser obligada a recibir educación religiosa.", "El artículo 68 de la Constitución y los artículos 23 (parágrafo 1.°) y 24 de la Ley 115 de 1994 garantizan que en los establecimientos del Estado nadie sea obligado a recibir educación religiosa. Sofía estudia en una institución oficial.", true], ["C", "aceptarla solo si la familia acredita su afiliación a una iglesia con personería jurídica reconocida.", "La garantía constitucional no está sujeta a acreditar la pertenencia a una confesión registrada; se funda en la libertad de conciencia y de cultos y en el derecho de los padres a escoger el tipo de educación de sus hijos (artículo 68).", false]]}, {"id": "NR-105", "niv": 2, "e": "Ante la propuesta de eliminar el área del plan de estudios, usted explica que, según la Ley 115 de 1994,", "f": "Ley 115 de 1994, artículos 23, 24 y 77.", "o": [["A", "debe ofrecerse en todos los establecimientos educativos, como área obligatoria y fundamental del plan de estudios.", "El artículo 23 incluye la educación religiosa entre las áreas obligatorias y fundamentales y su parágrafo ordena ofrecerla en todos los establecimientos educativos, con la garantía de que en los del Estado nadie sea obligado a recibirla.", true], ["B", "el consejo directivo puede suprimirla en ejercicio de la autonomía escolar, si así lo pide la mayoría de los padres de familia.", "La autonomía del artículo 77 permite organizar las áreas fundamentales e introducir asignaturas optativas, pero no suprimir un área que el artículo 23 define como obligatoria y fundamental.", false], ["C", "solo los colegios privados de orientación confesional están obligados a incluirla en su plan de estudios.", "El parágrafo del artículo 23 dispone que la educación religiosa se ofrecerá en todos los establecimientos educativos, no solo en los privados de orientación confesional.", false]]}, {"id": "NR-106", "niv": 2, "e": "La discusión sobre el plan de estudios pasa al consejo directivo, donde tienen asiento docentes, padres y estudiantes. Esta participación tiene fundamento constitucional en", "f": "Constitución Política, artículos 67 y 68; Ley 115 de 1994, artículos 6 y 142.", "o": [["A", "el mandato de que la comunidad educativa participe en la dirección de las instituciones de educación.", "El artículo 68 de la Constitución dispone que la comunidad educativa participará en la dirección de las instituciones de educación; el artículo 6 de la Ley 115 desarrolla ese mandato y el artículo 142 crea el gobierno escolar para materializarlo.", true], ["B", "la facultad del Estado de ejercer la suprema inspección y vigilancia de la educación.", "La inspección y vigilancia del artículo 67 es una función estatal de control de la calidad y del cumplimiento de los fines de la educación; no es el fundamento de la participación de la comunidad en el gobierno escolar.", false], ["C", "la libertad de los particulares para fundar establecimientos educativos y definir de manera autónoma su gestión.", "Esa libertad, prevista en el primer inciso del artículo 68, se refiere a la creación de establecimientos según las condiciones que fije la ley; no fundamenta la participación de docentes, padres y estudiantes en la dirección institucional.", false]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Etnoeducación (Constitución, art. 68; Ley 115 de 1994, arts. 55 a 62)", "texto": "Usted fue nombrado en un centro etnoeducativo ubicado en un resguardo indígena de La Guajira, donde la mayoría de los niños habla wayuunaiki en casa y aprende el castellano en la escuela. En la primera reunión, las autoridades tradicionales piden que el plan de estudios incluya los saberes propios y que la comunidad participe en su construcción. Además, una fundación internacional ofrece donar materiales y aplicar su propio currículo de lectura en castellano en todas las sedes, y el director pregunta cómo se seleccionará al docente que reemplazará a una maestra que se jubila.", "items": [{"id": "NR-107", "niv": 1, "e": "En cuanto a la lengua de enseñanza, la Ley 115 de 1994 establece que en este territorio la enseñanza debe ser", "f": "Ley 115 de 1994, artículos 21 (literal c) y 57; Constitución Política, artículo 68.", "o": [["A", "exclusivamente en wayuunaiki, para proteger la identidad cultural frente a la influencia externa.", "La ley no excluye el castellano: la enseñanza es bilingüe y el literal c) del artículo 21 exige desarrollar las habilidades comunicativas en lengua castellana, además de la lengua materna.", false], ["B", "bilingüe, con la lengua materna de la comunidad como fundamento escolar y sin descuidar el castellano.", "El artículo 57 de la Ley 115 dispone que, en sus territorios, la enseñanza de los grupos étnicos con tradición lingüística propia será bilingüe, tomando como fundamento escolar la lengua materna, sin detrimento de lo dispuesto en el literal c) del artículo 21 sobre la lengua castellana.", true], ["C", "en castellano, para asegurar condiciones de igualdad en las pruebas externas que presentarán los estudiantes.", "Desconoce el artículo 57 de la Ley 115 y el artículo 68 de la Constitución, que reconoce a los grupos étnicos el derecho a una formación que respete y desarrolle su identidad cultural, de la que hace parte su lengua.", false]]}, {"id": "NR-108", "niv": 2, "e": "Para atender la petición de las autoridades tradicionales sobre el plan de estudios, usted se apoya en que la etnoeducación debe orientarse, entre otros, por los criterios de", "f": "Ley 115 de 1994, artículo 56.", "o": [["A", "homogeneidad curricular, castellanización progresiva y evaluación estandarizada.", "Ninguno de estos es criterio de la etnoeducación; la homogeneidad y la castellanización contradicen la interculturalidad y la diversidad lingüística que fija el artículo 56.", false
