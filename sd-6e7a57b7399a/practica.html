ción de", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: comprender cómo se articulan las partes de un texto (conectores y función de los párrafos).", "o": [["A", "presentar nuevas pruebas que confirman que la teoría de los estilos de aprendizaje es correcta.", "El párrafo no presenta pruebas ni respalda la teoría; parte de reconocer que tiene «poco sustento».", false], ["B", "evitar que la crítica a la teoría se entienda como una negación de las diferencias entre estudiantes.", "Empieza con «Que la teoría tenga poco sustento no significa que todas las personas aprendan igual» y ofrece una alternativa: elegir la forma de enseñar según el contenido y combinar varias vías. Es un párrafo que delimita el alcance de la crítica.", true], ["C", "concluir que todos los estudiantes deben recibir la misma enseñanza, sin ninguna variación.", "El autor propone combinar varias vías y variar según el contenido; no plantea una enseñanza uniforme.", false]]}, {"id": "LC-151", "niv": 3, "e": "Una docente comenta que, en su clase, los estudiantes que se consideran visuales prefieren los mapas conceptuales. Con base en el texto, este dato", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: reflexionar a partir de un texto y evaluar su contenido (validez de argumentos y solidez de las evidencias).", "o": [["A", "no basta para respaldar la teoría, porque muestra una preferencia y no un mayor aprendizaje.", "Según el segundo párrafo, conocer cómo prefieren aprender los estudiantes no es suficiente. Aplicar el criterio de un texto para valorar una nueva evidencia es reflexionar sobre su contenido.", true], ["B", "contradice el texto, porque el autor afirma que todas las personas aprenden de la misma manera.", "El autor dice expresamente que la falta de sustento de la teoría «no significa que todas las personas aprendan igual».", false], ["C", "respalda la teoría, porque confirma que existen estudiantes con un estilo de aprendizaje visual.", "Confunde preferencia con aprendizaje: el texto exige mostrar que esos estudiantes aprenden más así, no solo que lo prefieren.", false]]}]}, {"comp": "lectura_critica", "rol": "docente", "tag": "Lectura crítica", "texto": "Lea la siguiente reseña publicada en una revista para docentes:\n\n«En Aulas sin gritos, la autora —orientadora escolar con veinte años de experiencia— propone reemplazar el castigo por acuerdos construidos con los estudiantes y por consecuencias relacionadas con la falta: quien daña un material lo repara; quien interrumpe busca con el docente una forma de recuperar el tiempo perdido.\n\nEl libro tiene el mérito de ser práctico. Cada capítulo cierra con situaciones de aula y posibles respuestas, y el lenguaje evita la jerga. Su mayor debilidad está en el tono: la autora presenta sus casos como si todos hubieran terminado bien, y el lector no encuentra un solo ejemplo en el que la estrategia haya fallado. Un docente con cuarenta estudiantes y poco tiempo puede sentir que el libro describe un aula que no es la suya.\n\nAun así, recomiendo su lectura, sobre todo a quienes empiezan. No es un manual infalible, pero sí una buena invitación a pensar la disciplina de otra manera.»", "items": [{"id": "LC-152", "niv": 1, "e": "Según la reseña, un ejemplo de «consecuencia relacionada con la falta» es que", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: identificar y entender los contenidos locales que conforman un texto.", "o": [["A", "el estudiante que interrumpe reciba una anotación en el observador.", "La reseña no menciona anotaciones; dice que quien interrumpe busca con el docente cómo recuperar el tiempo perdido.", false], ["B", "el estudiante que incumple un acuerdo sea retirado del aula.", "La reseña no menciona retirar al estudiante del aula; esa medida no guarda relación directa con la falta.", false], ["C", "el estudiante que daña un material se encargue de repararlo.", "La reseña lo presenta así: «quien daña un material lo repara». La consecuencia guarda relación directa con la falta.", true]]}, {"id": "LC-153", "niv": 2, "e": "La crítica principal que el reseñista hace al libro es que", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: comprender el sentido global del texto (tesis e intención comunicativa).", "o": [["A", "usa un lenguaje técnico que dificulta la lectura de los docentes que empiezan.", "La reseña afirma lo contrario: «el lenguaje evita la jerga».", false], ["B", "no incluye casos fallidos, lo que puede alejarlo de la realidad de muchas aulas.", "La «mayor debilidad» es que todos los casos terminan bien y no aparece ningún ejemplo en que la estrategia falle, por lo que el libro puede parecer ajeno a un aula numerosa.", true], ["C", "no ofrece situaciones de aula ni posibles respuestas para los docentes.", "La reseña destaca que cada capítulo «cierra con situaciones de aula y posibles respuestas».", false]]}, {"id": "LC-154", "niv": 1, "e": "La expresión «Aun así», al inicio del último párrafo, introduce", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: comprender cómo se articulan las partes de un texto (conectores y función de los párrafos).", "o": [["A", "una recomendación que el reseñista mantiene a pesar de la debilidad señalada.", "«Aun así» es un conector concesivo: después de señalar la debilidad del libro, el reseñista lo recomienda de todos modos. Identificar la función de los conectores es comprender la articulación del texto.", true], ["B", "una nueva crítica que se suma a la debilidad señalada en el párrafo anterior.", "Después del conector no aparece una crítica, sino una recomendación.", false], ["C", "un resumen del contenido de cada uno de los capítulos del libro reseñado.", "El último párrafo no resume capítulos; valora el libro en su conjunto.", false]]}, {"id": "LC-155", "niv": 3, "e": "De la reseña se puede inferir que, para el reseñista, un buen libro sobre disciplina escolar debería", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: reflexionar a partir de un texto y evaluar su contenido (supuestos implícitos).", "o": [["A", "estar dirigido principalmente a docentes con muchos años de experiencia.", "El reseñista recomienda el libro «sobre todo a quienes empiezan»; no exige que se dirija a docentes experimentados.", false], ["B", "reconocer también las dificultades y los fracasos de lo que propone.", "Al criticar que no haya «un solo ejemplo en el que la estrategia haya fallado», el reseñista deja ver un criterio implícito: un libro útil muestra también los límites de sus propuestas. Inferir los criterios de valoración de un autor es reflexionar sobre el texto.", true], ["C", "evitar los ejemplos prácticos para concentrarse en el desarrollo teórico.", "El reseñista valora como un mérito que el libro sea práctico; no pide menos ejemplos.", false]]}]}, {"comp": "lectura_critica", "rol": "docente", "tag": "Lectura crítica", "texto": "Lea la siguiente noticia publicada en la página web de una institución educativa de frontera:\n\n«Con un acto cultural, la institución celebró el cierre del proyecto \"Somos vecinos\", en el que estudiantes colombianos y venezolanos de sexto y séptimo grado investigaron las comidas, los juegos y las palabras de sus regiones. Durante cuatro meses, los grupos mixtos entrevistaron a sus familias y elaboraron un diccionario con expresiones de ambos países.\n\nSegún la coordinadora, los reportes de conflictos entre estudiantes de esos dos grados bajaron de 31 en el primer semestre a 12 en el segundo. \"El proyecto nos ayudó a convivir\", afirmó.\n\nNo todo fue sencillo. Algunos padres se opusieron al principio porque consideraban que el proyecto quitaba tiempo a las clases, y la falta de documentos de varios estudiantes retrasó su vinculación a los grupos.»", "items": [{"id": "LC-156", "niv": 1, "e": "Según la noticia, en el proyecto «Somos vecinos» los estudiantes", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: identificar y entender los contenidos locales que conforman un texto.", "o": [["A", "escribieron la historia de la frontera a partir de libros y archivos.", "La noticia no habla de una historia de la frontera; los estudiantes entrevistaron a sus familias.", false], ["B", "organizaron un torneo con los juegos tradicionales de ambos países.", "La noticia dice que investigaron los juegos, pero no menciona ningún torneo.", false], ["C", "elaboraron un diccionario con expresiones propias de los dos países.", "La noticia lo informa de manera explícita: los grupos mixtos «elaboraron un diccionario con expresiones de ambos países».", true]]}, {"id": "LC-157", "niv": 2, "e": "De la información de la noticia se puede concluir con seguridad que", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: reflexionar a partir de un texto y evaluar su contenido.", "o": [["A", "todos los padres de familia apoyaron el proyecto desde el comienzo.", "La noticia dice que «algunos padres se opusieron al principio».", false], ["B", "el proyecto fue la causa de que disminuyeran los conflictos entre los estudiantes.", "Es la interpretación de la coordinadora, pero la noticia no ofrece datos que descarten otras causas posibles.", false], ["C", "la coordinadora informó una reducción de los reportes de conflicto en sexto y séptimo.", "La noticia atribuye ese dato a la coordinadora (de 31 a 12 reportes entre el primer y el segundo semestre). Lo que no puede afirmarse con seguridad es la causa de la reducción. Distinguir lo que el texto informa de lo que se infiere es parte de la lectura crítica.", true]]}, {"id": "LC-158", "niv": 1, "e": "El párrafo que empieza con «No todo fue sencillo» cumple, en la noticia, la función de", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: comprender cómo se articulan las partes de un texto (conectores y función de los párrafos).", "o": [["A", "desmentir la información sobre la disminución de los conflictos.", "El párrafo no pone en duda las cifras de conflictos; habla de otras dificultades del proyecto.", false], ["B", "presentar las dificultades del proyecto para dar una visión más completa.", "Después de los logros, la noticia menciona la oposición inicial de algunos padres y el retraso por falta de documentos. Así equilibra la información. Reconocer la función de un párrafo es comprender la estructura del texto.", true], ["C", "explicar cuáles fueron las causas de los conflictos entre los estudiantes.", "El párrafo no se refiere a las causas de los conflictos, sino a obstáculos en la ejecución del proyecto.", false]]}, {"id": "LC-159", "niv": 3, "e": "La afirmación de que el proyecto «ayudó a convivir» sería más convincente si la noticia informara", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: reflexionar a partir de un texto y evaluar su contenido (validez de argumentos y solidez de las evidencias).", "o": [["A", "cómo cambiaron en el mismo periodo los reportes de conflicto en grados que no participaron.", "Si en los grados que no participaron los conflictos se mantuvieron o aumentaron, sería más razonable atribuir la reducción al proyecto. Comparar con un grupo que no recibió la intervención es la forma de fortalecer una afirmación causal.", true], ["B", "qué platos típicos de cada región presentaron los estudiantes en el acto cultural de cierre.", "Describe una actividad del cierre, pero no permite evaluar si el proyecto mejoró la convivencia.", false], ["C", "cuántas expresiones de cada país se incluyeron en el diccionario elaborado por los estudiantes.", "Es un dato sobre el producto del proyecto, pero no aporta evidencia sobre su efecto en la convivencia.", false]]}]}, {"comp": "lectura_critica", "rol": "docente", "tag": "Lectura crítica", "texto": "Lea los siguientes textos producidos en una institución educativa:\n\nTexto 1 (circular del rector a los docentes). «A partir de este periodo, no se aceptarán trabajos escritos elaborados en casa, porque ya no podemos saber si los hizo el estudiante o una aplicación de inteligencia artificial. Todos los textos se escribirán en clase, a mano y en presencia del docente.»\n\nTexto 2 (intervención de una docente de lenguaje en el consejo académico). «Comparto la preocupación, pero no la solución. Si todo se escribe en el aula, perderemos los trabajos largos, que exigen consultar, revisar y reescribir. Además, nuestros estudiantes usarán estas herramientas al salir del colegio, querámoslo o no. Prefiero pedirles que entreguen los borradores, que expliquen oralmente lo que escribieron y que declaren si usaron alguna herramienta y para qué.»", "items": [{"id": "LC-160", "niv": 1, "e": "La docente del texto 2 coincide con el rector en", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: reflexionar a partir de un texto y evaluar su contenido (contraste de textos con perspectivas distintas).", "o": [["A", "la decisión de que todos los textos se escriban a mano y en clase.", "La docente rechaza esa medida: «Comparto la preocupación, pero no la solución».", false], ["B", "la idea de que los trabajos largos deben salir del plan de estudios.", "La docente defiende los trabajos largos y advierte que la medida del rector haría que se perdieran.", false], ["C", "la preocupación por saber si los trabajos los hacen los estudiantes.", "La docente dice compartir la preocupación del rector, que es no poder saber quién hizo el trabajo. Identificar en qué coinciden y en qué difieren dos textos es una tarea de lectura crítica.", true]]}, {"id": "LC-161", "niv": 2, "e": "Uno de los argumentos de la docente contra la medida del rector es que esta", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: reflexionar a partir de un texto y evaluar su contenido (validez de argumentos y solidez de las evidencias).", "o": [["A", "vulneraría el derecho de los estudiantes a usar la tecnología en el colegio.", "La docente no habla de derechos; su argumento se refiere a la formación de los estudiantes.", false], ["B", "impediría los trabajos que exigen consultar, revisar y reescribir.", "La docente lo afirma: «Si todo se escribe en el aula, perderemos los trabajos largos, que exigen consultar, revisar y reescribir».", true], ["C", "aumentaría el tiempo que los docentes dedican a revisar textos escritos a mano.", "La docente no menciona la carga de revisión de los docentes.", false]]}, {"id": "LC-162", "niv": 3, "e": "La propuesta de la docente se apoya en el supuesto de que", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: reflexionar a partir de un texto y evaluar su contenido (supuestos implícitos).", "o": [["A", "la autoría de un trabajo puede verificarse observando su proceso y la explicación del estudiante.", "Pedir borradores, una explicación oral y una declaración de uso solo tiene sentido si se supone que esas evidencias permiten saber qué hizo el estudiante. Ese supuesto no se enuncia, pero sostiene la propuesta.", true], ["B", "los estudiantes dejarán de usar herramientas de inteligencia artificial si se les pide declararlas.", "La docente da por hecho que los estudiantes usarán esas herramientas («querámoslo o no»); su propuesta no busca que dejen de usarlas.", false], ["C", "las aplicaciones de inteligencia artificial producen textos de menor calidad que los de los estudiantes.", "La docente no compara la calidad de los textos; su preocupación es la autoría y el proceso de escritura.", false]]}, {"id": "LC-163", "niv": 3, "e": "Si se comprobara que algunos estudiantes usan inteligencia artificial desde su celular durante las clases, esto debilitaría principalmente", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: reflexionar a partir de un texto y evaluar su contenido (contraste de textos con perspectivas distintas).", "o": [["A", "la preocupación que comparten ambos textos por la autoría de los trabajos de los estudiantes.", "El dato no debilita esa preocupación; más bien la refuerza, porque muestra que el problema existe también en el aula.", false], ["B", "la idea del rector de que escribir en clase permite saber con certeza quién hizo el trabajo.", "La medida del rector se basa en que la presencia del docente garantiza la autoría. Si el uso de estas herramientas ocurre también en el aula, esa garantía se debilita. Identificar qué afirmación se ve afectada por un dato nuevo es evaluar argumentos.", true], ["C", "el argumento de la docente según el cual los trabajos largos exigen revisar y reescribir.", "Ese argumento se refiere a la naturaleza de los trabajos largos y no depende de lo que ocurra en clase.", false]]}]}, {"comp": "lectura_critica", "rol": "docente", "tag": "Lectura crítica", "texto": "Lea la siguiente tabla, que la orientadora de un colegio presentó en una reunión de padres de familia. Resume una encuesta a 300 estudiantes de grados octavo a once:\n\nHoras diarias frente a pantallas (fuera de clase) | Número de estudiantes | Horas promedio de sueño | Estudiantes que reportan cansancio en clase\nMenos de 2 horas | 60 | 8,1 | 20 %\nDe 2 a 4 horas | 150 | 7,2 | 41 %\nMás de 4 horas | 90 | 6,3 | 67 %\n\nAl final de su presentación, la orientadora afirmó: «Las pantallas les están robando el sueño a nuestros hijos».", "items": [{"id": "LC-164", "niv": 1, "e": "Según la tabla, el grupo con mayor número de estudiantes es el de quienes pasan frente a pantallas", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: identificar y entender los contenidos locales en textos discontinuos (tablas, gráficas e infografías).", "o": [["A", "menos de 2 horas diarias.", "Este grupo tiene 60 estudiantes, el menor número de los tres.", false], ["B", "de 2 a 4 horas diarias.", "Con 150 estudiantes, es el grupo más numeroso: la mitad de los 300 encuestados. Es lectura directa de la tabla.", true], ["C", "más de 4 horas diarias.", "Este grupo tiene 90 estudiantes, menos que el grupo de 2 a 4 horas.", false]]}, {"id": "LC-165", "niv": 2, "e": "De la tabla se puede afirmar que, a medida que aumentan las horas frente a pantallas,", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: identificar y entender los contenidos locales en textos discontinuos (tablas, gráficas e infografías).", "o": [["A", "disminuyen tanto el número de estudiantes como el porcentaje que reporta cansancio.", "El número de estudiantes no disminuye de manera constante (60, 150, 90) y el cansancio aumenta.", false], ["B", "aumentan las horas de sueño, pero también el porcentaje de quienes reportan cansancio.", "Las horas de sueño disminuyen (8,1; 7,2; 6,3), no aumentan.", false], ["C", "disminuyen las horas promedio de sueño y aumenta el porcentaje que reporta cansancio.", "El sueño pasa de 8,1 a 7,2 y a 6,3 horas, mientras el cansancio sube de 20 % a 41 % y a 67 %. Describir tendencias de una tabla es interpretar un texto discontinuo.", true]]}, {"id": "LC-166", "niv": 2, "e": "Si usted quisiera calcular el promedio de horas de sueño de los 300 estudiantes, debería", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: identificar y entender los contenidos locales en textos discontinuos (tablas, gráficas e infografías).", "o": [["A", "ponderar el promedio de cada grupo según el número de estudiantes que lo forman.", "El promedio general es (60 × 8,1 + 150 × 7,2 + 90 × 6,3) ÷ 300 = 2.133 ÷ 300 ≈ 7,1 horas. Cuando los grupos tienen distinto tamaño, hay que ponderar.", true], ["B", "tomar el valor del grupo de 2 a 4 horas, porque es el grupo más numeroso.", "Usar solo el grupo más numeroso deja por fuera a 150 estudiantes; el resultado no representa a todos.", false], ["C", "sumar los tres promedios de la tabla y dividir el resultado entre tres.", "Este procedimiento da el mismo peso a grupos de tamaño muy distinto (60, 150 y 90 estudiantes), error frecuente al combinar promedios.", false]]}, {"id": "LC-167", "niv": 3, "e": "La afirmación final de la orientadora va más allá de lo que muestran los datos porque", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: reflexionar a partir de un texto y evaluar su contenido (validez de argumentos y solidez de las evidencias).", "o": [["A", "la tabla muestra una asociación entre las dos variables, no una relación de causa y efecto.", "Los datos indican que más pantallas y menos sueño van juntos, pero no prueban la dirección de la relación (quizá quien duerme mal usa más la pantalla) ni descartan otras causas comunes. Distinguir correlación de causalidad es evaluar la solidez de una conclusión.", true], ["B", "los estudiantes que usan menos las pantallas son los que más cansancio reportan en clase.", "Es falso: ese grupo reporta el menor cansancio (20 %).", false], ["C", "la mayoría de los estudiantes encuestados pasa menos de dos horas diarias frente a pantallas.", "Es falso: solo 60 de los 300 estudiantes están en ese grupo.", false]]}]}, {"comp": "lectura_critica", "rol": "docente", "tag": "Lectura crítica", "texto": "Lea el siguiente fragmento del discurso que una estudiante pronunció en la ceremonia de grado de su colegio:\n\n«Nos dijeron muchas veces que éramos el futuro del país. Con todo respeto, no estoy de acuerdo. Somos el presente. El futuro es una palabra cómoda para los adultos, porque permite aplazar las cosas: lo que no se nos da hoy se nos promete para mañana.\n\nEn estos once años aprendimos fórmulas, fechas y reglas de ortografía. Pero lo que más recuerdo es otra cosa: la profesora que nos dejó organizar la feria de ciencias aunque sabía que nos íbamos a equivocar, y el día en que el consejo estudiantil logró que se arreglaran los baños. Ahí entendí que participar no es un ensayo para la vida adulta; es la vida misma.»", "items": [{"id": "LC-168", "niv": 1, "e": "Para la estudiante, la expresión «el futuro del país» resulta", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: identificar y entender los contenidos locales (sentido de palabras y expresiones en contexto).", "o": [["A", "un reconocimiento merecido al esfuerzo de los estudiantes durante su vida escolar.", "La estudiante rechaza la expresión («no estoy de acuerdo»); no la recibe como un reconocimiento.", false], ["B", "una meta que los graduandos deberán alcanzar cuando ingresen a la educación superior.", "El discurso no habla de la educación superior; critica la idea de aplazar la participación de los jóvenes.", false], ["C", "una fórmula que permite a los adultos aplazar lo que les deben a los jóvenes.", "La estudiante lo explica: «El futuro es una palabra cómoda para los adultos, porque permite aplazar las cosas». Interpretar el sentido que el autor da a una expresión es comprensión local.", true]]}, {"id": "LC-169", "niv": 2, "e": "Los dos recuerdos que menciona la estudiante sirven, en el discurso, para", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: comprender cómo se articulan las partes de un texto para darle un sentido global.", "o": [["A", "criticar a los docentes que no permitían a los estudiantes equivocarse en sus proyectos.", "La estudiante elogia a una profesora que les dejó equivocarse; no critica a otros docentes.", false], ["B", "mostrar que las fórmulas y las fechas son el aprendizaje más valioso del colegio.", "Los recuerdos se presentan en contraste con las fórmulas y las fechas («Pero lo que más recuerdo es otra cosa»).", false], ["C", "respaldar la idea de que participar de verdad hace parte de la formación escolar.", "La feria de ciencias y el logro del consejo estudiantil son ejemplos de participación real, que conducen a la conclusión: participar «es la vida misma». Los ejemplos sostienen la tesis del discurso.", true]]}, {"id": "LC-170", "niv": 3, "e": "Si usted quisiera presentar a sus estudiantes una postura opuesta a la tesis central del discurso, el argumento que mejor la representaría es que", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: reflexionar a partir de un texto y evaluar su contenido (contraste de textos con perspectivas distintas).", "o": [["A", "la escuela debe preparar a los jóvenes para participar más adelante, cuando tengan más madurez.", "La tesis del discurso es que participar no es un ensayo para la vida adulta. La postura contraria sostiene que la escuela es una preparación y que la participación plena llega después. Reconocer una tesis opuesta es comparar perspectivas.", true], ["B", "la feria de ciencias y el consejo estudiantil son experiencias valiosas que deberían ampliarse.", "Este argumento coincide con el discurso, que valora esas experiencias de participación.", false], ["C", "los adultos que llaman a los jóvenes «el futuro del país» lo dicen con sinceridad y no para aplazar nada.", "Se opone a una afirmación secundaria del discurso (la crítica a la expresión «el futuro»), pero no a su tesis central: que participar no es un ensayo para la vida adulta, sino parte de la vida misma.", false]]}]}, {"comp": "lectura_critica", "rol": "docente", "tag": "Lectura crítica", "texto": "Lea el siguiente fragmento de un ensayo sobre la autoridad en el aula:\n\n«Se suele decir que los maestros han perdido autoridad, y quienes lo dicen casi siempre añoran el tiempo en que bastaba una mirada para que el salón quedara en silencio. Pero conviene distinguir. Aquel silencio no siempre era respeto; muchas veces era miedo, y el miedo obedece mientras el vigilante está presente.\n\nLa autoridad que vale la pena no se impone: se reconoce. Un estudiante reconoce la autoridad de un maestro cuando percibe que sabe lo que enseña, que es justo al evaluar y que cumple lo que promete. Esa autoridad tarda más en construirse, pero no desaparece cuando el maestro sale del salón.\n\nQuizá lo que se ha perdido no es la autoridad, sino una forma de poder que nunca debió confundirse con ella.»", "items": [{"id": "LC-171", "niv": 1, "e": "Según el texto, un estudiante reconoce la autoridad de un maestro cuando percibe que este", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: identificar y entender los contenidos locales que conforman un texto.", "o": [["A", "es exigente con las normas y sanciona a quien las incumple.", "El texto no relaciona la autoridad con la sanción; la asocia con el saber, la justicia y la coherencia.", false], ["B", "domina su materia, califica con equidad y es coherente con sus compromisos.", "El segundo párrafo enumera esas tres condiciones de manera explícita.", true], ["C", "logra que el salón quede en silencio con una sola mirada.", "Esa es la imagen del pasado que el autor pone en duda, pues ese silencio muchas veces era miedo.", false]]}, {"id": "LC-172", "niv": 2, "e": "La afirmación «el miedo obedece mientras el vigilante está presente» se usa en el texto para", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: comprender cómo se articulan las partes de un texto para darle un sentido global.", "o": [["A", "mostrar que la obediencia basada en el miedo no perdura cuando desaparece el control.", "La frase prepara el contraste con la autoridad reconocida, que «no desaparece cuando el maestro sale del salón». Identificar cómo una afirmación sostiene un contraste es comprender la articulación del texto.", true], ["B", "explicar por qué los estudiantes de antes eran más respetuosos que los de ahora.", "El autor sostiene lo contrario: aquel silencio «no siempre era respeto; muchas veces era miedo».", false], ["C", "recomendar que los docentes vigilen de cerca a los estudiantes durante toda la jornada.", "El autor no recomienda vigilar más; critica la obediencia que depende de la vigilancia.", false]]}, {"id": "LC-173", "niv": 2, "e": "La conclusión del texto se apoya en una distinción entre", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: comprender el sentido global del texto (tesis e intención comunicativa).", "o": [["A", "los maestros que enseñan bien y los maestros que evalúan con justicia.", "Saber enseñar y evaluar con justicia son, para el autor, condiciones de una misma autoridad, no dos tipos de maestro.", false], ["B", "una autoridad que se reconoce y un poder que se impone.", "La última oración lo resume: lo que se ha perdido no es la autoridad, sino «una forma de poder que nunca debió confundirse con ella». Identificar la distinción que organiza un texto es comprender su sentido global.", true], ["C", "el respeto de los estudiantes de antes y el de los estudiantes de ahora.", "El texto no compara el respeto de dos generaciones; distingue dos maneras de obtener obediencia.", false]]}, {"id": "LC-174", "niv": 3, "e": "Un lector afirma que el texto idealiza el pasado escolar. Esta objeción", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: reflexionar a partir de un texto y evaluar su contenido.", "o": [["A", "es infundada, porque el autor no se refiere en ningún momento a la escuela del pasado.", "Aunque el veredicto es correcto, la razón es falsa: el texto sí habla del pasado («el tiempo en que bastaba una mirada…»), precisamente para cuestionar la nostalgia por él.", false], ["B", "es acertada, porque el autor sostiene que antes los maestros tenían más autoridad que ahora.", "El autor no lo sostiene: sugiere que lo que había antes era, muchas veces, poder basado en el miedo.", false], ["C", "es infundada, porque el autor cuestiona a quienes añoran el silencio de antes.", "El texto pone en duda esa nostalgia («Aquel silencio no siempre era respeto; muchas veces era miedo»). Evaluar si una crítica se ajusta a lo que el texto dice es reflexionar sobre su contenido.", true]]}]}, {"comp": "lectura_critica", "rol": "directivo", "tag": "Lectura crítica", "texto": "Lea el siguiente fragmento del informe que el comité de alimentación escolar de una institución presentó al consejo directivo:\n\n«Durante el primer semestre, el complemento alimentario de media mañana se entregó a 420 estudiantes de primaria. Las docentes reportaron que, en los días en que el complemento llegó tarde o no llegó (11 de los 95 días de clase), aumentaron las quejas por dolor de cabeza y las solicitudes para salir del aula.\n\nEl comité recomienda dos medidas: acordar con el operador una hora límite de entrega y ubicar el comedor en un espacio techado, pues en días de lluvia los niños comen de pie en el pasillo.\n\nAlgunos docentes propusieron, además, retirar el complemento a los estudiantes que lo desperdicien. El comité no acoge esta propuesta, por considerar que el alimento es un derecho y no un premio por buen comportamiento.»", "items": [{"id": "LC-175", "niv": 1, "e": "Según el informe, el complemento alimentario llegó tarde o no llegó", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: identificar y entender los contenidos locales que conforman un texto.", "o": [["A", "en la mayoría de los días de clase del semestre.", "Fueron 11 de 95 días, es decir, una minoría de los días de clase.", false], ["B", "en los días de lluvia del primer semestre.", "La lluvia se menciona en relación con el lugar donde comen los niños, no con los retrasos en la entrega.", false], ["C", "en 11 de los 95 días de clase del semestre.", "El informe lo indica entre paréntesis: «11 de los 95 días de clase».", true]]}, {"id": "LC-176", "niv": 1, "e": "Según el informe, el comité no acoge la propuesta de retirar el complemento a quienes lo desperdicien porque", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: identificar y entender los contenidos locales que conforman un texto.", "o": [["A", "considera que el alimento es un derecho, no un premio por portarse bien.", "El informe lo dice: el alimento «es un derecho y no un premio por buen comportamiento».", true], ["B", "considera que los estudiantes de primaria no desperdician el alimento.", "El informe no afirma que no haya desperdicio; rechaza la sanción por otra razón.", false], ["C", "considera que esa decisión le corresponde al operador del programa.", "El informe no atribuye esa decisión al operador.", false]]}, {"id": "LC-177", "niv": 2, "e": "En el informe, la relación entre la entrega tardía del complemento y las quejas por dolor de cabeza se presenta como", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: reflexionar a partir de un texto y evaluar su contenido.", "o": [["A", "una opinión de los padres de familia recogida en una encuesta sobre el programa.", "La información proviene de las docentes, no de los padres de familia.", false], ["B", "una observación de las docentes y no como una relación causal comprobada.", "El informe dice que «las docentes reportaron» el aumento de quejas; no presenta mediciones ni un análisis que pruebe la causa. Reconocer el tipo de evidencia que sostiene una afirmación es evaluar el contenido del texto.", true], ["C", "el resultado de un estudio médico realizado por el comité de alimentación escolar.", "El informe no menciona ningún estudio médico.", false]]}, {"id": "LC-178", "niv": 3, "e": "Usted, como directivo, quiere reforzar ante el consejo directivo la recomendación de fijar una hora límite de entrega. El dato que más la apoyaría es", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: reflexionar a partir de un texto y evaluar su contenido (validez de argumentos y solidez de las evidencias).", "o": [["A", "la lista de alimentos que componen el complemento de media mañana durante el semestre.", "La composición del complemento no permite saber si el horario de entrega influye en las quejas.", false], ["B", "un registro diario que compare las quejas de los días con entrega tardía y con entrega puntual.", "Convertiría la observación de las docentes en evidencia sistemática: si las quejas son mayores cuando el complemento llega tarde, la medida gana sustento. Identificar qué dato fortalece una recomendación es evaluar argumentos.", true], ["C", "el número total de estudiantes de primaria matriculados en la institución este año.", "Es un dato de contexto que no muestra si la hora de entrega afecta a los estudiantes.", false]]}]}, {"comp": "lectura_critica", "rol": "docente", "tag": "Lectura crítica", "texto": "Lea la siguiente columna de opinión escrita por un docente rural:\n\n«Cada vez que se anuncia un plan nacional de bilingüismo, en mi vereda lo recibimos con una mezcla de ilusión y cansancio. Ilusión, porque nadie quiere que sus hijos se queden por fuera de las oportunidades que da otro idioma. Cansancio, porque los planes suelen pensarse para colegios con conectividad, docentes de inglés de planta y grupos de un solo grado.\n\nEn mi escuela no hay ninguna de esas tres cosas. Soy el único docente para cinco grados y aprendí inglés en un curso virtual que hacía de noche, cuando la señal lo permitía. Aun así, mis estudiantes cantan, cuentan y saludan en inglés, porque lo integramos a lo que ya hacemos: la huerta, el mercado, el clima.\n\nNo pido que nos excluyan de las metas. Pido que las metas lleguen acompañadas de formación, materiales que funcionen sin internet y tiempos realistas.»", "items": [{"id": "LC-179", "niv": 1, "e": "En el primer párrafo, la palabra «cansancio» se refiere a", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: identificar y entender los contenidos locales (sentido de palabras y expresiones en contexto).", "o": [["A", "el desinterés de las familias de la vereda por aprender otro idioma.", "El texto afirma lo contrario: «nadie quiere que sus hijos se queden por fuera de las oportunidades que da otro idioma».", false], ["B", "la fatiga del docente después de estudiar inglés por las noches.", "El curso nocturno se menciona en el segundo párrafo; en el primero, el cansancio se explica por cómo se diseñan los planes.", false], ["C", "el desgaste ante planes que no consideran las condiciones rurales.", "El autor lo explica: los planes «suelen pensarse para colegios con conectividad, docentes de inglés de planta y grupos de un solo grado». El sentido de la palabra se precisa con el contexto.", true]]}, {"id": "LC-180", "niv": 2, "e": "La experiencia que el autor narra en el segundo párrafo le sirve para", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: comprender cómo se articulan las partes de un texto para darle un sentido global.", "o": [["A", "mostrar que avanza aun en condiciones difíciles, lo que da peso a su petición.", "Al contar que sus estudiantes ya usan el inglés sin las condiciones ideales, el autor muestra compromiso y hace más creíble su solicitud de apoyo. Reconocer la función de un ejemplo es comprender la articulación del texto.", true], ["B", "demostrar que los planes nacionales de bilingüismo son innecesarios en las zonas rurales.", "El autor no rechaza los planes; dice expresamente que no pide que excluyan a su escuela de las metas.", false], ["C", "quejarse de la baja calidad de los cursos virtuales que ofrecen formación a los docentes.", "El autor menciona el curso virtual para mostrar sus condiciones, no para criticar su calidad.", false]]}, {"id": "LC-181", "niv": 2, "e": "Para evitar que su columna se lea como un rechazo al plan de bilingüismo, el autor", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: comprender cómo se articulan las partes de un texto (conectores y función de los párrafos).", "o": [["A", "propone que el inglés se enseñe primero en los colegios que ya tienen conectividad.", "El autor no hace esa propuesta; pide materiales que funcionen sin internet para su escuela.", false], ["B", "reconoce que su escuela tiene condiciones semejantes a las de los colegios urbanos.", "El autor afirma lo contrario: en su escuela no hay ninguna de las tres condiciones que suponen los planes.", false], ["C", "aclara que no pide quedar por fuera de las metas, sino recibir apoyo para cumplirlas.", "El último párrafo empieza con «No pido que nos excluyan de las metas», con lo cual delimita su crítica. Identificar cómo el autor precisa su postura es comprender la estructura del texto.", true]]}, {"id": "LC-182", "niv": 3, "e": "De las siguientes afirmaciones, la que el autor de la columna aceptaría es que", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: reflexionar a partir de un texto y evaluar su contenido (supuestos implícitos).", "o": [["A", "una meta nacional puede ser deseable y poco realista si no se acompaña de apoyos.", "El autor comparte el propósito del bilingüismo («ilusión»), pero pide formación, materiales y tiempos realistas. Inferir qué afirmación es coherente con la postura de un autor es reflexionar sobre el texto.", true], ["B", "los estudiantes rurales no necesitan el inglés porque no lo usarán en su entorno.", "Contradice al autor, que valora las oportunidades que da otro idioma y lo enseña en su escuela.", false], ["C", "las escuelas multigrado deberían esperar a tener conectividad para enseñar inglés.", "El autor ya enseña inglés sin conectividad y pide materiales que funcionen sin internet.", false]]}]}, {"comp": "lectura_critica", "rol": "docente", "tag": "Lectura crítica", "texto": "Lea el siguiente texto que una docente de ciencias naturales preparó para una salida pedagógica con estudiantes de grado octavo:\n\n«Los páramos funcionan como una esponja. Sus suelos, ricos en materia orgánica, y plantas como los frailejones y los musgos retienen el agua de la lluvia y de la neblina, y la liberan poco a poco hacia quebradas y ríos. Por eso, aun en temporada seca, muchos ríos que nacen en el páramo siguen llevando agua.\n\nCuando el páramo se convierte en potrero o en cultivo, el suelo se compacta y pierde esa capacidad. El agua corre rápido por la superficie: en invierno causa crecientes y en verano los caudales bajan más de lo normal. Así, el daño no solo afecta a quienes viven en la montaña, sino también a las ciudades que reciben el agua kilómetros abajo.»", "items": [{"id": "LC-183", "niv": 1, "e": "En el texto, la comparación del páramo con una esponja se refiere a su capacidad de", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: identificar y entender los contenidos locales (sentido de palabras y expresiones en contexto).", "o": [["A", "producir la lluvia y la neblina de la montaña.", "El páramo retiene el agua de la lluvia y la neblina; el texto no dice que las produzca.", false], ["B", "retener el agua y liberarla poco a poco.", "El texto explica la comparación: suelos y plantas «retienen el agua […] y la liberan poco a poco hacia quebradas y ríos».", true], ["C", "absorber la contaminación que llega a los ríos.", "El texto no habla de contaminación; la comparación se refiere al manejo del agua.", false]]}, {"id": "LC-184", "niv": 2, "e": "Según el texto, que en verano los caudales bajen más de lo normal en un páramo convertido en potrero se explica porque", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: comprender cómo se articulan las partes de un texto para darle un sentido global.", "o": [["A", "las ciudades toman más agua de los ríos durante los meses de verano.", "El texto no atribuye la baja de los caudales al consumo de las ciudades.", false], ["B", "el suelo compactado no retiene el agua, que se escurre rápido cuando llueve.", "El texto encadena causas: el suelo se compacta, pierde su capacidad de retener, el agua corre rápido por la superficie y, por eso, no queda reserva para el verano. Reconstruir una cadena causal es comprender cómo se articulan las ideas.", true], ["C", "los frailejones y los musgos consumen más agua durante la temporada seca.", "El texto no menciona un mayor consumo de agua por parte de las plantas.", false]]}, {"id": "LC-185", "niv": 2, "e": "La palabra «Así», al comienzo de la última oración, introduce", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: comprender cómo se articulan las partes de un texto (conectores y función de los párrafos).", "o": [["A", "una consecuencia que amplía el alcance del daño descrito antes.", "«Así» tiene aquí valor consecutivo: de lo explicado se concluye que el daño llega también a las ciudades. Identificar el valor de un conector es comprender la articulación del texto.", true], ["B", "un ejemplo de los cultivos que suelen sembrarse en los páramos.", "Después del conector no aparece ningún ejemplo de cultivos.", false], ["C", "una comparación entre el invierno y el verano en las ciudades.", "Lo que sigue no compara estaciones, sino que extiende el alcance del daño.", false]]}, {"id": "LC-186", "niv": 2, "e": "Un estudiante concluye, a partir del texto, que cuidar el páramo es un asunto que solo concierne a quienes viven en la montaña. Usted le explica que esa conclusión", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: reflexionar a partir de un texto y evaluar su contenido.", "o": [["A", "es correcta, porque el texto se ocupa sobre todo de los cambios en el uso del suelo de la montaña.", "Que el texto describa principalmente lo que ocurre en la montaña no limita a ella el problema: su última oración menciona los efectos en las ciudades.", false], ["B", "es errónea, porque el texto afirma que el páramo debe protegerse desde las ciudades.", "Aunque el veredicto es correcto, la razón no está en el texto: este no dice desde dónde debe protegerse el páramo, sino que su daño afecta también a quienes viven «kilómetros abajo».", false], ["C", "es errónea, porque desconoce que el daño afecta también a las ciudades que reciben el agua.", "La última oración lo dice: el daño «no solo afecta a quienes viven en la montaña, sino también a las ciudades». Contrastar una conclusión con lo que el texto afirma es evaluar su validez.", true]]}]}, {"comp": "lectura_critica", "rol": "docente", "tag": "Lectura crítica", "texto": "Lea el siguiente fragmento de una crónica publicada en una revista educativa:\n\n«A las cinco y media de la mañana, el motor de la lancha ya suena en el muelle. Don Efraín, que lleva once años transportando estudiantes por el río, revisa los chalecos salvavidas: son veinticuatro, y ese día suben veintiséis niños. Dos de los más grandes se ofrecen a ir sin chaleco. Don Efraín se niega. Prefiere hacer dos viajes y llegar tarde.\n\nLa escuela queda a cuarenta minutos río abajo. Cuando la marea está baja, la lancha encalla y los niños se bajan a empujarla, riéndose, con el uniforme remangado. La profesora los espera con una toalla y una olla de agua de panela. Nadie en el pueblo lo llama heroísmo. Lo llaman ir a estudiar.»", "items": [{"id": "LC-187", "niv": 1, "e": "Según la crónica, aquel día don Efraín decidió hacer dos viajes porque", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: identificar y entender los contenidos locales que conforman un texto.", "o": [["A", "la marea estaba baja y la lancha encalló.", "El texto menciona que la lancha encalla con la marea baja, pero esa no es la razón de los dos viajes.", false], ["B", "dos de los niños llegaron tarde al muelle.", "La crónica no dice que algún niño llegara tarde; dos se ofrecieron a ir sin chaleco.", false], ["C", "había más niños que chalecos salvavidas.", "Había veinticuatro chalecos y veintiséis niños; don Efraín no aceptó que dos viajaran sin chaleco. Es información explícita.", true]]}, {"id": "LC-188", "niv": 2, "e": "Las oraciones finales, «Nadie en el pueblo lo llama heroísmo. Lo llaman ir a estudiar», sugieren que", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: identificar y entender los contenidos locales (sentido de palabras y expresiones en contexto).", "o": [["A", "en esa comunidad las dificultades para llegar a la escuela hacen parte de la vida cotidiana.", "El contraste entre «heroísmo» e «ir a estudiar» muestra que lo que a un lector externo le parece extraordinario es rutina para el pueblo. Interpretar el sentido de un cierre es comprensión local con inferencia.", true], ["B", "los habitantes del pueblo no valoran el esfuerzo de don Efraín ni el de la profesora.", "No llamarlo heroísmo no significa no valorarlo; indica que se vive como algo habitual.", false], ["C", "el cronista considera exagerado hablar de dificultades en el transporte escolar del pueblo.", "El cronista describe con detalle las dificultades; el cierre no las niega, sino que muestra cómo las vive la comunidad.", false]]}, {"id": "LC-189", "niv": 3, "e": "Con el detalle de los niños que empujan la lancha «riéndose», el cronista", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: comprender cómo se articulan las partes de un texto literario (sentidos implícitos y recursos narrativos).", "o": [["A", "demuestra que el transporte por el río no representa ninguna dificultad para los niños.", "La crónica describe dificultades reales (madrugar, encallar, empujar); el detalle no las niega.", false], ["B", "matiza la dureza de la escena al mostrar cómo la viven los propios niños.", "El detalle evita una mirada únicamente dramática: la situación es difícil, pero los niños la asumen con alegría. Reconocer el efecto de un detalle sobre el sentido del texto es una tarea de lectura crítica.", true], ["C", "critica que los estudiantes no tomen en serio los riesgos del transporte por el río.", "El texto no juzga a los niños; además, muestra el cuidado con la seguridad (los chalecos).", false]]}, {"id": "LC-190", "niv": 3, "e": "Un lector afirma que la crónica denuncia la falta de inversión estatal en transporte escolar. Esta lectura", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: reflexionar a partir de un texto y evaluar su contenido.", "o": [["A", "es la única posible, porque el texto exige de manera explícita más recursos para el transporte.", "El texto no formula ninguna exigencia explícita; narra hechos sin reclamar recursos.", false], ["B", "atribuye al texto una intención que no expresa, aunque los hechos narrados podrían apoyar esa denuncia.", "La crónica muestra carencias (chalecos insuficientes, una lancha que encalla), pero no reclama ni señala responsables. Distinguir lo que el texto dice de lo que un lector le atribuye es reflexionar críticamente sobre él.", true], ["C", "contradice el texto, porque este afirma que el transporte escolar del pueblo funciona sin problemas.", "El texto no afirma eso: narra que faltan chalecos y que la lancha encalla.", false]]}]}, {"comp": "lectura_critica", "rol": "docente", "tag": "Lectura crítica", "texto": "Lea el siguiente fragmento del acta de una reunión del consejo académico:\n\n«La coordinadora presentó la propuesta de modificar el Sistema Institucional de Evaluación de los Estudiantes (SIEE) para que la autoevaluación tenga un peso del 10 % en la nota de cada periodo. El docente de matemáticas manifestó su desacuerdo: \"Los estudiantes se van a poner cinco a sí mismos\". La docente de ciencias sociales respondió que en su área la autoevaluación se hace con una rúbrica y que, en su experiencia, los estudiantes suelen ser más severos consigo mismos que los docentes. El rector propuso pilotear la medida en dos grados durante un periodo antes de decidir. La propuesta del rector fue aprobada por mayoría.»", "items": [{"id": "LC-191", "niv": 1, "e": "Según el acta, el consejo académico aprobó", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: identificar y entender los contenidos locales que conforman un texto.", "o": [["A", "incluir la autoevaluación con un peso del 10 % en todos los grados.", "Esa era la propuesta inicial de la coordinadora; lo aprobado fue probarla primero en dos grados.", false], ["B", "rechazar la propuesta de la coordinadora por las objeciones planteadas.", "La propuesta no fue rechazada; se decidió probarla antes de adoptarla.", false], ["C", "probar la medida en dos grados durante un periodo antes de decidir.", "El acta indica que se aprobó por mayoría la propuesta del rector: pilotear la medida antes de decidir.", true]]}, {"id": "LC-192", "niv": 2, "e": "La docente de ciencias sociales responde a la objeción del docente de matemáticas con", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: reflexionar a partir de un texto y evaluar su contenido (validez de argumentos y solidez de las evidencias).", "o": [["A", "su experiencia en el área, que contradice la predicción de que se pondrán la nota máxima.", "Ella relata que, con rúbrica, los estudiantes suelen calificarse con más severidad que los docentes, lo cual se opone a lo que anticipa su colega. Identificar el tipo de respaldo de una réplica es evaluar argumentos.", true], ["B", "un acuerdo parcial que reconoce que los estudiantes tienden a sobrevalorarse.", "La docente sostiene lo contrario: que los estudiantes suelen ser más severos consigo mismos.", false], ["C", "datos de varias instituciones que demuestran que la autoevaluación funciona.", "La docente no presenta datos de otras instituciones; habla de su propia experiencia.", false]]}, {"id": "LC-193", "niv": 3, "e": "La propuesta del rector puede entenderse como una forma de", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: reflexionar a partir de un texto y evaluar su contenido.", "o": [["A", "obtener evidencia de la institución antes de decidir entre una predicción y una experiencia individual.", "Las dos intervenciones se apoyan en una predicción y en una experiencia particular; el piloto permite contrastarlas con datos de la institución en un plazo definido. Valorar el sentido de una decisión frente a los argumentos expuestos es reflexionar sobre el texto.", true], ["B", "aplazar la decisión de manera indefinida para no provocar un conflicto entre los docentes del consejo.", "El piloto tiene un plazo definido (un periodo), por lo que no es un aplazamiento indefinido.", false], ["C", "dar la razón al docente de matemáticas sin contradecir de manera abierta a la coordinadora.", "El piloto no toma partido por ninguna postura; busca información para decidir.", false]]}]}, {"comp": "lectura_critica", "rol": "docente", "tag": "Lectura crítica", "texto": "Lea la siguiente columna escrita por una docente de preescolar para el boletín institucional:\n\n«Cada periodo, algunas familias me preguntan qué \"nota\" sacó su hijo. En preescolar no calificamos con números, y eso les genera desconfianza: sienten que, sin una cifra, no saben si el niño va bien o mal.\n\nEntiendo la inquietud, pero un número dice muy poco a esta edad. Un \"4\" no explica si Sofía ya reconoce su nombre escrito, si comparte los materiales o si todavía llora al despedirse de su mamá. Un informe descriptivo, en cambio, cuenta lo que el niño hace, lo que está empezando a lograr y cómo se le puede ayudar en casa.\n\nClaro que un informe así exige más de nosotras: observar con cuidado, tomar notas y escribir con claridad. Y exige también algo de las familias: leerlo completo y no buscar en él una cifra que no está.»", "items": [{"id": "LC-194", "niv": 1, "e": "Según la columna, algunas familias desconfían del informe de preescolar porque", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: identificar y entender los contenidos locales que conforman un texto.", "o": [["A", "lo escriben docentes que no observan con cuidado a cada uno de los niños.", "La columna no atribuye esa falta a las docentes; señala que observar con cuidado es una exigencia que ellas asumen.", false], ["B", "no explica qué está aprendiendo el niño ni cómo pueden ayudarlo en casa.", "Según la docente, eso es justamente lo que el informe descriptivo sí explica.", false], ["C", "no trae una calificación numérica que les indique si el niño va bien.", "La docente lo explica en el primer párrafo: «sienten que, sin una cifra, no saben si el niño va bien o mal».", true]]}, {"id": "LC-195", "niv": 2, "e": "El ejemplo de Sofía se usa en el texto para", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: comprender cómo se articulan las partes de un texto para darle un sentido global.", "o": [["A", "describir el caso de una estudiante que presenta dificultades de aprendizaje.", "El ejemplo no presenta a Sofía como una niña con dificultades; ilustra qué tipo de información no cabe en un número.", false], ["B", "mostrar la información concreta que un número no alcanza a comunicar.", "Tras afirmar que «un número dice muy poco a esta edad», la docente enumera logros concretos que un «4» no explica. Reconocer la función de un ejemplo es comprender cómo se articula el argumento.", true], ["C", "explicar por qué algunos niños lloran cuando se despiden de sus familias.", "El llanto se menciona como uno de los aspectos que el informe puede describir, no como un tema que se explique.", false]]}, {"id": "LC-196", "niv": 2, "e": "El último párrafo se diferencia de los anteriores en que", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: comprender cómo se articulan las partes de un texto (conectores y función de los párrafos).", "o": [["A", "presenta datos que prueban que el informe descriptivo es mejor que la nota.", "El párrafo no presenta datos ni pruebas; señala las exigencias de la propuesta.", false], ["B", "reconoce lo que la propuesta exige tanto a las docentes como a las familias.", "Con «Claro que…», la autora admite los costos de su propuesta: más trabajo para las docentes y una lectura atenta por parte de las familias. Identificar este movimiento concesivo es comprender la estructura del texto.", true], ["C", "abandona la defensa del informe descriptivo y acepta el uso de números.", "La docente mantiene su postura; pide a las familias no buscar una cifra «que no está».", false]]}, {"id": "LC-197", "niv": 3, "e": "Un padre responde a la columna: «Si no hay números, ¿cómo sé si mi hijo está por encima o por debajo de los demás?». Esta pregunta revela que el padre", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: reflexionar a partir de un texto y evaluar su contenido (contraste de textos con perspectivas distintas).", "o": [["A", "concibe la evaluación como una comparación entre niños, mientras la docente la concibe como el registro del avance de cada uno.", "El padre quiere ubicar a su hijo frente a los demás; la docente propone describir lo que cada niño hace y está empezando a lograr. Reconocer las concepciones distintas detrás de dos posturas es reflexionar críticamente sobre el texto.", true], ["B", "comparte con la docente la idea de que la evaluación debe describir lo que cada niño hace y está empezando a lograr.", "La pregunta no se interesa por la descripción de lo que hace el niño, sino por su posición frente a los demás.", false], ["C", "rechaza el informe porque no se entrega con la frecuencia que él considera necesaria.", "La pregunta no se refiere a la frecuencia de los informes, sino a la ausencia de números para comparar.", false]]}]}, {"comp": "lectura_critica", "rol": "docente", "tag": "Lectura crítica", "texto": "Lea el siguiente fragmento de un artículo sobre las escuelas multigrado:\n\n«Para muchos, el aula multigrado es una solución de emergencia: lo que se hace cuando no hay suficientes niños ni suficientes maestros. Esa mirada pasa por alto lo que ocurre dentro de ella. En un aula donde conviven niños de siete y de once años, los mayores explican a los menores y, al hacerlo, repasan y organizan lo que saben; los menores, por su parte, escuchan contenidos que todavía no les corresponden y llegan a ellos con cierta familiaridad.\n\nNada de esto ocurre de manera automática. Requiere guías de trabajo bien diseñadas, un docente que sepa organizar grupos y tiempos, y espacios que no estén pensados para treinta pupitres mirando al tablero. Cuando faltan esas condiciones, el aula multigrado sí se convierte en lo que sus críticos dicen: un docente agotado intentando dar cinco clases a la vez.»", "items": [{"id": "LC-198", "niv": 1, "e": "Según el texto, los estudiantes mayores de un aula multigrado se benefician de", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: identificar y entender los contenidos locales que conforman un texto.", "o": [["A", "recibir más atención del docente que los estudiantes menores del grupo.", "El texto no dice que los mayores reciban más atención del docente.", false], ["B", "escuchar contenidos que todavía no les corresponden a su edad.", "Ese beneficio corresponde, según el texto, a los estudiantes menores.", false], ["C", "repasar y organizar lo que saben al explicarles a los menores.", "El texto lo afirma: los mayores explican a los menores y, al hacerlo, «repasan y organizan lo que saben».", true]]}, {"id": "LC-199", "niv": 2, "e": "La oración «Nada de esto ocurre de manera automática» marca en el texto el paso", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: comprender cómo se articulan las partes de un texto (conectores y función de los párrafos).", "o": [["A", "de la descripción de los estudiantes mayores a la descripción de los estudiantes menores.", "Ambos grupos se describen en el primer párrafo, antes de esa oración.", false], ["B", "de los beneficios posibles del aula multigrado a las condiciones que estos requieren.", "Antes de la oración se describen las ventajas; después, lo que se necesita para lograrlas (guías, docente preparado, espacios adecuados). Identificar estas transiciones es comprender la articulación del texto.", true], ["C", "de la crítica al aula multigrado a la defensa de las aulas organizadas por un solo grado.", "El texto no defiende las aulas de un solo grado; sigue hablando del aula multigrado.", false]]}, {"id": "LC-200", "niv": 3, "e": "La última oración del texto", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: comprender cómo se articulan las partes de un texto para darle un sentido global.", "o": [["A", "contradice la tesis del autor, porque reconoce que el aula multigrado no funciona.", "El autor no dice que el aula multigrado no funcione, sino que no funciona cuando faltan ciertas condiciones.", false], ["B", "resume la opinión del autor, según la cual el docente multigrado vive siempre agotado.", "El autor atribuye esa imagen a los críticos y la limita a los casos en que faltan las condiciones.", false], ["C", "da la razón a los críticos en un caso específico, sin renunciar a la tesis del autor.", "El autor concede que, sin las condiciones necesarias, el aula multigrado sí es lo que dicen sus críticos; con ello no abandona su tesis, sino que la delimita. Reconocer una concesión es comprender cómo se construye un argumento.", true]]}, {"id": "LC-201", "niv": 3, "e": "Para defender la tesis del autor frente a quienes ven el aula multigrado como «una solución de emergencia», la evidencia más pertinente sería", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: reflexionar a partir de un texto y evaluar su contenido (validez de argumentos y solidez de las evidencias).", "o": [["A", "resultados de aprendizaje de escuelas multigrado con guías, docentes formados y espacios adecuados.", "La tesis sostiene que, con ciertas condiciones, el aula multigrado ofrece ventajas pedagógicas. Lo que mejor la respalda son resultados de escuelas que cumplen esas condiciones. Identificar la evidencia pertinente es evaluar un argumento.", true], ["B", "testimonios de docentes multigrado sobre el cansancio que les produce su trabajo.", "Estos testimonios apoyarían la visión de los críticos, no la del autor.", false], ["C", "el número de escuelas multigrado que funcionan hoy en las zonas rurales del país.", "Saber cuántas escuelas multigrado existen no muestra si en ellas se aprende bien; podría incluso reforzar la idea de que son una solución de emergencia.", false]]}]}, {"comp": "lectura_critica", "rol": "docente", "tag": "Lectura crítica", "texto": "Lea la siguiente descripción de una gráfica de barras que el coordinador presentó en una reunión de docentes:\n\n«ASISTENCIA DE FAMILIAS A LA ENTREGA DE INFORMES (institución con 800 familias)\nPeriodo 1: 520 familias (65 %).\nPeriodo 2: 440 familias (55 %).\nPeriodo 3: 600 familias (75 %).\nNota: en los periodos 1 y 2, la entrega se hizo un martes a las 2:00 p. m.; en el periodo 3, un sábado en la mañana.\nComentario del coordinador: \"Las familias sí se interesan; lo que les falta es tiempo en horario laboral\".»", "items": [{"id": "LC-202", "niv": 1, "e": "Según la gráfica, entre el periodo 2 y el periodo 3 la asistencia aumentó en", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: identificar y entender los contenidos locales en textos discontinuos (tablas, gráficas e infografías).", "o": [["A", "80 familias.", "Es la diferencia entre el periodo 3 (600) y el periodo 1 (520), no entre el periodo 2 y el 3.", false], ["B", "160 familias.", "En el periodo 2 asistieron 440 familias y en el periodo 3, 600: 600 − 440 = 160. Es lectura y comparación directa de datos.", true], ["C", "600 familias.", "Es el número total de familias que asistieron en el periodo 3, no el aumento respecto al periodo 2.", false]]}, {"id": "LC-203", "niv": 2, "e": "El comentario del coordinador se basa principalmente en", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: reflexionar a partir de un texto y evaluar su contenido (validez de argumentos y solidez de las evidencias).", "o": [["A", "la disminución de la asistencia de las familias entre el primer y el segundo periodo.", "Esa disminución ocurrió con el mismo horario y no explica la conclusión sobre el tiempo laboral.", false], ["B", "una encuesta en la que las familias explican las razones por las que no asisten.", "La gráfica no incluye ninguna encuesta; el coordinador infiere las razones a partir de las cifras.", false], ["C", "el aumento de la asistencia cuando la entrega se hizo fuera del horario laboral.", "La única diferencia que destaca la nota es el cambio de día y hora en el periodo 3, que coincide con la mayor asistencia. De allí el coordinador infiere que el problema es el horario.", true]]}, {"id": "LC-204", "niv": 3, "e": "La conclusión del coordinador se debilitaría si se supiera que", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: reflexionar a partir de un texto y evaluar su contenido (validez de argumentos y solidez de las evidencias).", "o": [["A", "en el tercer periodo se avisó que el informe solo se entregaría a quien asistiera.", "Sería otra explicación posible del aumento, independiente del horario: las familias habrían asistido por la nueva condición. Una explicación alternativa debilita la conclusión causal. Identificar qué información debilita un argumento es parte de la lectura crítica.", true], ["B", "en el tercer periodo algunos estudiantes acompañaron a sus familias a la reunión.", "Este dato no ofrece una explicación del aumento ni pone en duda el papel del horario.", false], ["C", "la mayoría de las familias de la institución trabaja entre semana en horario diurno.", "Este dato fortalecería la conclusión, pues explicaría por qué un martes a las 2:00 p. m. muchas familias no pueden asistir.", false]]}, {"id": "LC-205", "niv": 3, "e": "Al comentar estos datos con sus colegas, usted afirma con precisión que", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: identificar y entender los contenidos locales en textos discontinuos (tablas, gráficas e infografías).", "o": [["A", "en ningún periodo del año asistió a la entrega de informes más de la mitad de las familias de la institución.", "Es falso: en los tres periodos asistió más de la mitad (65 %, 55 % y 75 %).", false], ["B", "el cambio de horario coincide con la mayor asistencia, aunque un solo periodo no basta para probar que la causó.", "Es una afirmación prudente: los datos muestran la coincidencia, pero con una sola observación no se pueden descartar otras explicaciones. Evaluar el alcance de una conclusión es reflexionar sobre la información.", true], ["C", "la asistencia aumentó un 20 % entre el segundo y el tercer periodo.", "Confunde puntos porcentuales con porcentaje: la asistencia pasó de 55 % a 75 %, es decir, subió 20 puntos porcentuales, lo que equivale a un aumento de alrededor del 36 % (160 ÷ 440).", false]]}]}, {"comp": "lectura_critica", "rol": "docente", "tag": "Lectura crítica", "texto": "Lea la siguiente carta que un lector envió a un periódico local:\n\n«Señores editores: leo que algunos colegios permiten la calculadora en las clases de matemáticas desde grado séptimo. Es un error. Quienes promueven esa idea son, casualmente, los mismos que nunca fueron buenos para los números. Hoy se permite la calculadora para dividir; mañana se permitirá que una aplicación resuelva las ecuaciones, y en pocos años tendremos bachilleres que no saben cuánto es siete por ocho. Yo estudié sin calculadora y aprendí perfectamente. ¿Para qué cambiar lo que funciona?»", "items": [{"id": "LC-206", "niv": 2, "e": "Cuando el autor afirma que quienes promueven la calculadora «nunca fueron buenos para los números», su argumento", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: reflexionar a partir de un texto y evaluar su contenido (validez de argumentos y solidez de las evidencias).", "o": [["A", "generaliza a partir de la experiencia escolar del propio autor de la carta.", "La generalización a partir de su propia experiencia aparece en otra frase («Yo estudié sin calculadora…»), no en esta.", false], ["B", "presenta un dato verificable sobre la formación de quienes defienden la idea.", "El autor no ofrece ninguna prueba de esa afirmación; además, aunque fuera cierta, no diría nada sobre la conveniencia de la calculadora.", false], ["C", "ataca a quienes defienden la idea en lugar de discutir la idea misma.", "Descalificar a las personas en vez de examinar sus razones es un argumento contra la persona (ad hominem). Reconocer este tipo de falacia es evaluar la validez de un argumento.", true]]}, {"id": "LC-207", "niv": 3, "e": "La secuencia «hoy… mañana… en pocos años» construye un argumento que", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: reflexionar a partir de un texto y evaluar su contenido (validez de argumentos y solidez de las evidencias).", "o": [["A", "supone, sin probarlo, que un primer paso llevará a consecuencias cada vez más graves.", "El autor encadena consecuencias sin justificar cada eslabón: de usar la calculadora para dividir pasa a bachilleres que no saben multiplicar. Es la falacia de la pendiente resbaladiza.", true], ["B", "describe hechos que ya ocurrieron en los colegios que permiten la calculadora.", "Lo que sigue a «mañana» y «en pocos años» son predicciones, no hechos ocurridos.", false], ["C", "compara con datos la enseñanza de las matemáticas en distintas épocas.", "El texto no presenta datos ni compara épocas; encadena consecuencias supuestas.", false]]}, {"id": "LC-208", "niv": 1, "e": "La frase «Yo estudié sin calculadora y aprendí perfectamente» es débil como argumento porque", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: reflexionar a partir de un texto y evaluar su contenido (validez de argumentos y solidez de las evidencias).", "o": [["A", "toma una experiencia personal como prueba de lo que conviene a todos los estudiantes.", "Que al autor le haya funcionado un método no demuestra que sea el mejor para todos ni que el otro sea perjudicial. Es una generalización a partir de un caso.", true], ["B", "reconoce que la calculadora ayuda a aprender las operaciones básicas.", "La frase no reconoce ningún beneficio de la calculadora; sostiene lo contrario.", false], ["C", "contradice la afirmación de que los bachilleres no sabrán multiplicar.", "No hay contradicción entre ambas afirmaciones; las dos expresan la misma postura del autor.", false]]}, {"id": "LC-209", "niv": 3, "e": "Para responder la carta con un argumento sólido, usted debería", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: reflexionar a partir de un texto y evaluar su contenido.", "o": [["A", "advertir que, si se prohíbe la calculadora, pronto se prohibirán también los computadores.", "Reproduce la pendiente resbaladiza de la carta en sentido contrario, sin aportar evidencia.", false], ["B", "explicar con qué propósito se usa la calculadora y si eso afecta el dominio del cálculo.", "Una respuesta sólida discute el asunto de fondo: para qué se usa la herramienta y qué efectos tiene en el aprendizaje, en lugar de responder con descalificaciones o predicciones sin sustento.", true], ["C", "señalar que el autor es una persona mayor que no conoce cómo se enseña hoy en los colegios.", "Comete la misma falacia que la carta: descalifica a la persona en lugar de discutir sus razones.", false]]}]}, {"comp": "lectura_critica", "rol": "docente", "tag": "Lectura crítica", "texto": "Lea los siguientes textos sobre el manejo de las agresiones verbales entre estudiantes:\n\nTexto 1 (fragmento de una propuesta de norma para el manual de convivencia). «El estudiante que agreda verbalmente a un compañero recibirá una anotación en el observador y, si reincide, una suspensión de un día. La sanción debe aplicarse de inmediato para que sirva de ejemplo a los demás.»\n\nTexto 2 (propuesta del comité escolar de convivencia). «Antes de sancionar, proponemos un encuentro entre el estudiante que agredió y el agredido, con un mediador. El objetivo es que quien agredió entienda el daño causado y acuerde una forma de repararlo. La sanción no se descarta, pero se reserva para quienes rechacen el proceso o reincidan.»", "items": [{"id": "LC-210", "niv": 1, "e": "Según el texto 2, la sanción se reserva para los estudiantes que", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: identificar y entender los contenidos locales que conforman un texto.", "o": [["A", "no tengan anotaciones previas en el observador.", "El texto 2 no menciona anotaciones en el observador; eso pertenece al texto 1.", false], ["B", "agredan verbalmente a un compañero por primera vez.", "Para la primera agresión, el texto 2 propone el encuentro con un mediador, no la sanción.", false], ["C", "rechacen el proceso de encuentro o vuelvan a agredir.", "El texto 2 lo dice: la sanción «se reserva para quienes rechacen el proceso o reincidan».", true]]}, {"id": "LC-211", "niv": 2, "e": "La expresión «para que sirva de ejemplo a los demás», en el texto 1, muestra que la sanción se concibe sobre todo como", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: identificar y entender los contenidos locales (sentido de palabras y expresiones en contexto).", "o": [["A", "una oportunidad para reparar el daño causado al compañero agredido.", "La reparación del daño es el propósito del texto 2, no del texto 1.", false], ["B", "un espacio de diálogo entre el estudiante agresor y el agredido.", "El diálogo mediado aparece en el texto 2; el texto 1 no lo contempla.", false], ["C", "un mensaje dirigido a toda la comunidad para prevenir nuevas faltas.", "La sanción se justifica por su efecto sobre «los demás», es decir, como advertencia o disuasión. Interpretar el sentido de una expresión en su contexto es comprensión local.", true]]}, {"id": "LC-212", "niv": 3, "e": "Un docente afirma que el texto 2 elimina las consecuencias para quienes agreden. Esta interpretación es", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: reflexionar a partir de un texto y evaluar su contenido (contraste de textos con perspectivas distintas).", "o": [["A", "inexacta, porque el texto 2 propone reparar el daño y mantiene la sanción para algunos casos.", "Comprender el daño y acordar cómo repararlo es una consecuencia para quien agredió; además, la sanción «no se descarta». Contrastar una interpretación con lo que dice el texto es reflexionar críticamente.", true], ["B", "exacta, porque el texto 2 reemplaza la suspensión por un encuentro entre los estudiantes con un mediador.", "El texto 2 no elimina la suspensión: la reserva para ciertos casos.", false], ["C", "inexacta, porque el texto 2 aplica la suspensión de inmediato, igual que el texto 1.", "Aunque el veredicto es correcto, la razón es falsa: el texto 2 no aplica la sanción de inmediato, sino que primero propone el encuentro con un mediador y reserva la sanción para quienes rechacen el proceso o reincidan.", false]]}, {"id": "LC-213", "niv": 3, "e": "La diferencia de fondo entre los dos textos es que", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: reflexionar a partir de un texto y evaluar su contenido (contraste de textos con perspectivas distintas).", "o": [["A", "el texto 1 prevé consecuencias para el agresor, mientras el texto 2 se ocupa únicamente del agredido.", "El texto 2 se ocupa principalmente de quien agredió: busca que entienda el daño y lo repare.", false], ["B", "el texto 1 busca castigar y disuadir, y el texto 2, que quien agredió comprenda y repare el daño.", "El texto 1 justifica la sanción por su efecto ejemplarizante; el texto 2 pone en el centro el daño y su reparación, sin descartar la sanción. Identificar el propósito de fondo de cada texto es comparar perspectivas.", true], ["C", "el texto 1 considera grave la agresión verbal, mientras el texto 2 la considera una falta menor.", "El texto 2 no le resta gravedad; propone otra manera de responder a ella.", false]]}]}, {"comp": "razonamiento_cuantitativo", "rol": "docente", "tag": "Razonamiento cuantitativo", "texto": "La institución educativa organiza una salida pedagógica al jardín botánico para los grados décimo y once. Décimo tiene 3 grupos de 32 estudiantes y once tiene 2 grupos de 35 estudiantes. Confirmaron su asistencia el 75 % de los estudiantes de décimo y el 80 % de los de once. El transporte se contrata en busetas de 19 puestos que cuestan $420.000 cada una, y en cada buseta debe viajar un docente acompañante que ocupa uno de los puestos. La entrada cuesta $12.000 por estudiante y los docentes no pagan. El consejo de padres aportó $1.312.000 y el valor restante se divide en partes iguales entre los estudiantes que asisten. Usted es el docente encargado de organizar la logística.", "items": [{"id": "RC-001", "niv": 1, "e": "Para solicitar los refrigerios, usted debe informar que el número de estudiantes que asistirán es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: porcentajes y proporciones.", "o": [["A", "124 estudiantes.", "Resulta de aplicar el 75 % al total de matriculados de ambos grados (166 × 0,75 = 124,5) y truncar. El caso indica porcentajes distintos para cada grado: el 75 % se aplica solo a décimo y el 80 % solo a once.", false], ["B", "128 estudiantes.", "Décimo tiene 3 × 32 = 96 estudiantes y asiste el 75 %: 96 × 0,75 = 72. Once tiene 2 × 35 = 70 estudiantes y asiste el 80 %: 70 × 0,80 = 56. En total asisten 72 + 56 = 128 estudiantes.", true], ["C", "133 estudiantes.", "Resulta de aplicar el 80 % al total de matriculados (166 × 0,80 = 132,8) y redondear. Cada porcentaje corresponde a un grado distinto, por lo que deben calcularse por separado: 72 de décimo y 56 de once, para un total de 128.", false]]}, {"id": "RC-002", "niv": 2, "e": "Para garantizar el transporte de todos los estudiantes que asisten, el número mínimo de busetas que usted debe contratar es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo: interpretación de cocientes en contexto (redondeo por exceso).", "o": [["A", "6 busetas.", "Resulta de dividir 128 entre 19 (6,7) y quedarse con la parte entera. Además de truncar, ignora que en cada buseta un puesto lo ocupa el docente; con 6 busetas solo viajarían 6 × 18 = 108 estudiantes.", false], ["B", "7 busetas.", "Resulta de dividir 128 entre 19 sin descontar el puesto del docente acompañante. En realidad cada buseta lleva 18 estudiantes, y 7 × 18 = 126 no alcanza para 128.", false], ["C", "8 busetas.", "Cada buseta tiene 19 puestos y uno lo ocupa el docente, así que caben 18 estudiantes. 128 ÷ 18 = 7,1; como no se puede contratar una fracción de buseta y 7 busetas solo llevan 126 estudiantes, se necesitan 8.", true]]}, {"id": "RC-003", "niv": 2, "e": "Al informar a las familias el valor que debe aportar cada estudiante que asiste, usted indica que este es de", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo: planteamiento y ejecución de procesos aritméticos en varios pasos.", "o": [["A", "$16.000.", "Resulta de restar el aporte del consejo de padres solo al transporte (3.360.000 − 1.312.000 = 2.048.000; 2.048.000 ÷ 128 = 16.000) y olvidar el costo de las entradas.", false], ["B", "$28.000.", "Transporte: 8 × 420.000 = 3.360.000. Entradas: 128 × 12.000 = 1.536.000. Costo total: 4.896.000. Descontando el aporte del consejo de padres: 4.896.000 − 1.312.000 = 3.584.000, y 3.584.000 ÷ 128 = 28.000 por estudiante.", true], ["C", "$38.250.", "Resulta de dividir el costo total (4.896.000) entre 128 sin descontar el aporte del consejo de padres de familia.", false]]}, {"id": "RC-004", "niv": 2, "e": "Si a última hora confirman su asistencia 7 estudiantes más de grado once, respecto al transporte usted debe", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo: validación de procedimientos y toma de decisiones con información cuantitativa.", "o": [["A", "mantener las busetas contratadas, porque en ellas caben hasta 144 estudiantes.", "Con 8 busetas de 18 puestos para estudiantes caben 8 × 18 = 144. Al sumar 7 estudiantes se llega a 135, que es menor que 144, por lo que no se requiere transporte adicional.", true], ["B", "contratar una buseta adicional, porque se superan los 133 puestos disponibles.", "Calcula mal la capacidad. La capacidad para estudiantes de 8 busetas es 8 × 18 = 144, no 133; con 135 estudiantes no se supera.", false], ["C", "contratar una buseta adicional, porque los puestos libres ya estaban ocupados.", "Supone que las busetas iban llenas. Con 128 estudiantes en 8 busetas quedaban 144 − 128 = 16 puestos libres, suficientes para los 7 estudiantes adicion
