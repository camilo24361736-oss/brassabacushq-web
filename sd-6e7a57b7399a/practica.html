"El artículo 36 del Decreto 1860 de 1994 dispone que la enseñanza prevista en el artículo 14 de la Ley 115 se cumple bajo la modalidad de proyectos pedagógicos: actividades dentro del plan de estudios que ejercitan al educando en la solución de problemas cotidianos relacionados con su entorno.", true]]}, {"id": "PD-138", "niv": 2, "e": "La intensidad horaria y la duración de cada proyecto pedagógico se definen en", "f": "Decreto 1860 de 1994, artículo 36.", "o": [["A", "una resolución anual de la secretaría de educación, aplicable a todas las instituciones de la entidad territorial.", "La norma no asigna esa definición a la secretaría de educación; corresponde al establecimiento en el marco de su autonomía.", false], ["B", "la Ley 115 de 1994, que fija el número de horas de cada una de las enseñanzas obligatorias.", "La Ley 115 establece las enseñanzas obligatorias, pero no fija su intensidad horaria; esa decisión se deja a cada institución.", false], ["C", "el plan de estudios que adopta la propia institución educativa.", "El artículo 36 del Decreto 1860 de 1994 establece que la intensidad horaria y la duración de los proyectos pedagógicos se definen en el respectivo plan de estudios.", true]]}, {"id": "PD-139", "niv": 3, "e": "De las siguientes propuestas para el proyecto ambiental, la que mejor expresa su carácter transversal es", "f": "Ley 115 de 1994, artículo 14, parágrafo 1; Decreto 1860 de 1994, artículo 36.", "o": [["A", "que el docente de ciencias naturales asuma el proyecto completo, por ser el área más afín a la temática ambiental.", "Concentrar el proyecto en un área desconoce que el artículo 14 pide desarrollar esta formación a través de todo el plan de estudios; el proyecto deja de ser transversal.", false], ["B", "que matemáticas analice datos de calidad del agua del río, sociales estudie sus usos y lenguaje produzca una campaña, con metas comunes.", "La transversalidad implica que varias áreas aporten desde sus saberes a un problema real del entorno con propósitos compartidos; el artículo 36 del Decreto 1860 señala que el proyecto integra y hace activos los aprendizajes de diversas áreas.", true], ["C", "que cada área realice por su cuenta una actividad alusiva al Día del Agua, sin coordinarse con las demás.", "Actividades aisladas y puntuales no constituyen un proyecto pedagógico: carecen de planeación conjunta, de continuidad y de metas compartidas en torno al problema del entorno.", false]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Aprendizaje basado en problemas y en proyectos", "texto": "Usted es docente de la media técnica con especialidad agropecuaria en una institución rural del Huila. La comunidad cafetera de la vereda reporta pérdidas por la broca del café, y varios padres de familia trabajan en las fincas afectadas. Usted decide organizar la unidad de once grado mediante aprendizaje basado en problemas (ABP): presentará a los grupos la situación de una finca específica con pérdidas del 20 % de la cosecha y les pedirá proponer una solución viable, consultando fuentes técnicas y a los caficultores. Dispone de seis semanas y de la parcela demostrativa de la institución.", "items": [{"id": "PD-140", "niv": 1, "e": "Lo característico del aprendizaje basado en problemas es", "f": "Barrows, H. S. (1986). A taxonomy of problem-based learning methods; Decreto 1860 de 1994, artículo 35.", "o": [["A", "partir de un problema real y abierto que los estudiantes analizan para identificar qué necesitan aprender.", "En el ABP el problema se presenta al inicio y es el motor del aprendizaje: los estudiantes, organizados en grupos, identifican lo que saben, lo que necesitan aprender y cómo buscarlo, con el docente como guía.", true], ["B", "presentar primero toda la teoría sobre la broca y luego proponer ejercicios de aplicación al final de la unidad.", "Esa secuencia corresponde a una enseñanza expositiva seguida de aplicación; en el ABP el problema antecede a la teoría y la organiza.", false], ["C", "resolver problemas cerrados con una única respuesta para practicar procedimientos que ya fueron enseñados.", "Los ejercicios cerrados de práctica no son ABP: el problema en el ABP es abierto, contextualizado y admite varias soluciones posibles que deben argumentarse.", false]]}, {"id": "PD-141", "niv": 2, "e": "Durante las seis semanas, el papel que le corresponde a usted como docente en el ABP es", "f": "Barrows, H. S. (1986); Hmelo-Silver, C. (2004). Problem-based learning: what and how do students learn?", "o": [["A", "entregar al inicio la solución técnica del problema, para que los grupos se concentren en justificarla.", "Dar la solución anula la indagación que da sentido al ABP; los estudiantes pasarían a justificar una respuesta ajena en lugar de construir la propia.", false], ["B", "orientar con preguntas, ayudar a organizar la indagación y verificar la calidad de las fuentes, sin resolver por ellos.", "En el ABP el docente actúa como tutor o facilitador: plantea preguntas que hacen avanzar el razonamiento, ayuda a planear la búsqueda y cuida la calidad de la información, pero no sustituye el trabajo de los estudiantes.", true], ["C", "limitarse a calificar el informe final de cada grupo, para no interferir en la autonomía de los estudiantes.", "La autonomía no implica ausencia del docente; sin acompañamiento, los grupos pueden avanzar con errores o fuentes poco confiables sin oportunidad de corregir.", false]]}, {"id": "PD-142", "niv": 2, "e": "Si el propósito de la unidad fuera que los estudiantes diseñen y construyan trampas para la broca en la parcela, la estrategia se acercaría más a", "f": "Decreto 1860 de 1994, artículo 36; literatura sobre aprendizaje basado en proyectos.", "o": [["A", "una clase magistral, porque requiere que el docente explique primero el funcionamiento de las trampas para la broca.", "Que se requiera información técnica no convierte la estrategia en clase magistral; el eje sigue siendo el trabajo de los estudiantes para producir algo.", false], ["B", "un estudio de caso, porque se analiza una situación ya resuelta por otros para extraer conclusiones.", "El estudio de caso analiza una situación documentada; aquí los estudiantes no analizan una solución existente, sino que diseñan y construyen la suya.", false], ["C", "un aprendizaje basado en proyectos, porque se orienta a elaborar un producto concreto ante una necesidad.", "El aprendizaje basado en proyectos se organiza en torno a la elaboración de un producto o resultado tangible. El artículo 36 del Decreto 1860 de 1994 prevé que los proyectos pedagógicos puedan orientarse al diseño y elaboración de un producto.", true]]}, {"id": "PD-143", "niv": 3, "e": "La forma de evaluación más coherente con el ABP que usted diseñó es", "f": "MEN (2009). Documento No. 11: Fundamentaciones y orientaciones para la implementación del Decreto 1290 de 2009 (coherencia entre enfoque de enseñanza y de evaluación); Decreto 1290 de 2009, artículo 12.", "o": [["A", "valorar el proceso de indagación y trabajo en equipo y la solución propuesta, con criterios conocidos y retroalimentación.", "La evaluación debe ser coherente con el enfoque de enseñanza (Documento No. 11 del MEN). En el ABP se valoran el proceso y el producto con criterios conocidos de antemano y momentos de retroalimentación.", true], ["B", "valorar únicamente si la solución del grupo funcionó en la parcela, porque en el ABP lo que importa es el resultado.", "En el ABP el proceso de indagación, razonamiento y trabajo en equipo también es objeto de aprendizaje; valorar solo el resultado deja por fuera evidencias centrales.", false], ["C", "aplicar al final solo un examen escrito de definiciones técnicas, para garantizar la objetividad de la nota.", "Un examen de definiciones evalúa recuerdo, no la capacidad de analizar el problema, investigar y proponer una solución, que es lo que la unidad desarrolla.", false]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Enseñanza para la Comprensión (EpC)", "texto": "Usted orienta ciencias sociales en noveno grado en una institución de Valledupar. Para el segundo período decide planear una unidad con el marco de Enseñanza para la Comprensión (EpC), desarrollado en el Proyecto Cero de la Universidad de Harvard. La unidad gira en torno al tema «El agua en nuestra región: usos y conflictos», que conecta con la vida de los estudiantes, con la historia del territorio y con varias disciplinas. En la evaluación del período anterior usted notó que un estudiante recitaba sin errores la definición de cuenca hidrográfica, pero no lograba explicar por qué la deforestación en la parte alta del río afecta los cultivos de su vereda.", "items": [{"id": "PD-144", "niv": 1, "e": "En el marco de la EpC, el tema «El agua en nuestra región: usos y conflictos» cumple la función de", "f": "Stone Wiske, M. (comp.) (1999). La Enseñanza para la Comprensión: vinculación entre la investigación y la práctica (tópicos generativos, metas, desempeños y valoración continua).", "o": [["A", "un desempeño de comprensión, porque exige a los estudiantes actuar con flexibilidad a partir de lo que saben.", "Los desempeños de comprensión son actividades en las que el estudiante usa lo que sabe de formas nuevas; un tema no es por sí mismo una actividad de desempeño.", false], ["B", "una meta de comprensión, porque enuncia de forma explícita lo que los estudiantes deben comprender al final.", "Las metas de comprensión expresan qué se espera que los estudiantes comprendan (por ejemplo, «comprenderán cómo los usos del suelo afectan la disponibilidad de agua»); el tema del caso organiza la unidad, pero no enuncia esa comprensión.", false], ["C", "un tópico generativo, porque es central, accesible e interesante y se conecta con varias disciplinas.", "En la EpC, los tópicos generativos son temas centrales para la disciplina, accesibles e interesantes para los estudiantes y que permiten múltiples conexiones; el tema del caso reúne esas características.", true]]}, {"id": "PD-145", "niv": 2, "e": "De las siguientes actividades, la que constituye un desempeño de comprensión es", "f": "Stone Wiske, M. (comp.) (1999). La Enseñanza para la Comprensión: vinculación entre la investigación y la práctica (desempeños de comprensión).", "o": [["A", "elaborar una propuesta argumentada para un conflicto por el agua del municipio, usando los conceptos estudiados.", "Los desempeños de comprensión piden ir más allá de la información dada: explicar, argumentar, aplicar y crear con lo que se sabe. Proponer una solución argumentada a un conflicto real cumple esa condición.", true], ["B", "copiar en el cuaderno las definiciones de cuenca, caudal y concesión de aguas que aparecen en el texto guía.", "Copiar definiciones es una actividad de reproducción; no exige al estudiante usar el conocimiento en una situación nueva ni muestra comprensión.", false], ["C", "responder un cuestionario de selección múltiple sobre las fechas y los datos principales de la unidad estudiada.", "Un cuestionario de datos y fechas verifica recuerdo de información, no el uso flexible del conocimiento que caracteriza a un desempeño de comprensión.", false]]}, {"id": "PD-146", "niv": 2, "e": "En la EpC, la valoración diagnóstica continua se caracteriza por", "f": "Stone Wiske, M. (comp.) (1999). La Enseñanza para la Comprensión: vinculación entre la investigación y la práctica (valoración diagnóstica continua).", "o": [["A", "concentrarse en una prueba final que certifique si los estudiantes alcanzaron las metas de comprensión.", "Una prueba final única es una valoración sumativa; la EpC propone valorar a lo largo de toda la unidad para que la información sirva para mejorar mientras se aprende.", false], ["B", "acompañar los desempeños de toda la unidad con criterios públicos y retroalimentación frecuente.", "La EpC concibe la valoración diagnóstica continua como un proceso permanente, con criterios claros, públicos y relacionados con las metas, y con retroalimentación frecuente del docente y de los pares.", true], ["C", "realizarse al inicio de la unidad para identificar los saberes previos y agrupar a los estudiantes por nivel.", "Explorar saberes previos es útil, pero la valoración de la EpC no se limita al inicio: es continua y acompaña todos los desempeños de la unidad.", false]]}, {"id": "PD-147", "niv": 3, "e": "Desde la EpC, frente al estudiante que recita la definición pero no explica el efecto de la deforestación, usted concluye que", "f": "Stone Wiske, M. (comp.) (1999). La Enseñanza para la Comprensión: vinculación entre la investigación y la práctica (capítulo de D. Perkins: ¿Qué es la comprensión?).", "o": [["A", "no comprende porque le falta memorizar otras definiciones relacionadas con el ciclo del agua y los suelos.", "Memorizar más definiciones no resuelve la dificultad: el problema no es la cantidad de información, sino la capacidad de usarla para explicar situaciones nuevas.", false], ["B", "aún no evidencia comprensión, porque esta implica usar el conocimiento con flexibilidad en situaciones nuevas.", "En la EpC comprender es poder pensar y actuar con flexibilidad a partir de lo que se sabe (Perkins, en Stone Wiske, 1999). El estudiante reproduce la definición, pero no la usa para explicar un fenómeno de su entorno.", true], ["C", "ya comprende el tema, porque recordar con exactitud la definición es la principal evidencia de comprensión.", "Recordar una definición es conocimiento, pero en la EpC la comprensión se evidencia en desempeños, no en la reproducción exacta de la información.", false]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Pedagogía activa y métodos activos (Decreto 1860 de 1994)", "texto": "Usted enseña física en décimo grado en una institución de Tunja. En la reunión de área, varios docentes discuten cómo hacer más activas las clases. Un colega propone que basta con que los estudiantes «estén haciendo algo con las manos» para que la clase sea activa. Otro sostiene que la pedagogía activa sirve solo en primaria y que en la media lo adecuado es la exposición. Usted prepara la unidad de movimiento rectilíneo uniforme y cuenta con carritos de juguete, cintas métricas, cronómetros de celular y el patio de la institución.", "items": [{"id": "PD-148", "niv": 1, "e": "Según el Decreto 1860 de 1994, en el desarrollo de una asignatura se deben aplicar", "f": "Decreto 1860 de 1994, artículo 35; Ley 115 de 1994, artículo 77.", "o": [["A", "los métodos que la secretaría de educación defina cada año para todas las instituciones de su jurisdicción.", "La Ley 115 (artículo 77) reconoce a las instituciones autonomía para adoptar métodos de enseñanza; la secretaría asesora, pero no fija los métodos de cada institución.", false], ["B", "métodos centrados en la exposición del docente y la toma de apuntes, para garantizar el cubrimiento de los temas.", "La exposición aparece en la norma como uno de varios elementos, pero el decreto pide métodos activos y vivenciales, no centrar la clase en la exposición y el apunte.", false], ["C", "estrategias y métodos activos y vivenciales, como la experimentación, el taller y la práctica de laboratorio.", "El artículo 35 del Decreto 1860 de 1994 indica que en el desarrollo de una asignatura se deben aplicar estrategias y métodos pedagógicos activos y vivenciales que incluyan la exposición, la observación, la experimentación, la práctica, el laboratorio, el taller y el estudio personal, entre otros.", true]]}, {"id": "PD-149", "niv": 2, "e": "Para la unidad de movimiento rectilíneo uniforme, la propuesta más coherente con la pedagogía activa es que los estudiantes", "f": "Decreto 1860 de 1994, artículo 35; Dewey, J. (1938). Experiencia y educación.", "o": [["A", "diseñen una forma de medir la velocidad de los carritos, registren datos y discutan sus resultados.", "La pedagogía activa sitúa al estudiante como protagonista de su aprendizaje: diseñar, medir, registrar y discutir son acciones en las que construye el concepto de velocidad a partir de la experiencia y la reflexión, en línea con los métodos activos del artículo 35 del Decreto 1860.", true], ["B", "resuelvan individualmente una lista amplia de ejercicios de aplicación directa de la fórmula de la velocidad.", "Los ejercicios de aplicación pueden consolidar procedimientos, pero por sí solos no implican indagación ni construcción del concepto a partir de la experiencia.", false], ["C", "observen la demostración que usted realiza en el patio mientras copian los resultados que va anotando en el tablero.", "Los estudiantes observan, pero no formulan preguntas, no toman decisiones sobre la medición ni analizan datos propios; su papel sigue siendo receptivo.", false]]}, {"id": "PD-150", "niv": 3, "e": "Frente al colega que afirma que basta con que los estudiantes hagan algo con las manos, usted precisa que", "f": "Dewey, J. (1938). Experiencia y educación; Decreto 1860 de 1994, artículo 35.", "o": [["A", "tiene razón solo para la primaria, porque en la educación media la pedagogía activa se reemplaza por la exposición.", "El artículo 35 del Decreto 1860 exige métodos activos y vivenciales en el desarrollo de las asignaturas, sin restringirlos a la primaria.", false], ["B", "la actividad debe responder a un propósito de aprendizaje e incluir reflexión sobre lo realizado.", "Para Dewey, no toda experiencia es educativa: lo es cuando se conecta con un propósito y se reflexiona sobre ella. La pedagogía activa supone actividad intelectual, no solo física.", true], ["C", "tiene razón, porque la actividad física de los estudiantes es el rasgo que define a la pedagogía activa.", "La actividad motriz por sí sola no garantiza aprendizaje; una actividad puede ser manual y, al mismo tiempo, mecánica y sin sentido para el estudiante.", false]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Educación inicial y preescolar: actividades rectoras", "texto": "Usted es docente del grado transición en una institución oficial de Popayán. Al iniciar el año revisa las orientaciones del Ministerio de Educación Nacional para la educación inicial y los Derechos Básicos de Aprendizaje (DBA) de transición. Una colega del mismo grado usa el arte casi exclusivamente con fichas para rellenar contornos, con el fin de «entrenar la motricidad fina para la escritura». A mitad de año, la familia de Samuel, de cinco años, le pide que el niño repita transición porque «todavía no lee». Al final del período, usted debe elaborar el informe para las familias.", "items": [{"id": "PD-151", "niv": 1, "e": "Según las orientaciones del MEN, las actividades rectoras de la primera infancia son", "f": "MEN, Actividades rectoras de la primera infancia y de la educación inicial (portal mineducacion.gov.co); Serie de Orientaciones Pedagógicas para la Educación Inicial.", "o": [["A", "el juego, el arte, la literatura y la exploración del medio.", "El MEN establece el juego, el arte, la literatura y la exploración del medio como las actividades rectoras de la primera infancia y de la educación inicial, desarrolladas en la Serie de Orientaciones Pedagógicas para la Educación Inicial.", true], ["B", "el juego, la música, el deporte y la formación en valores, que organizan la jornada del preescolar.", "Mezcla el juego, que sí es actividad rectora, con otros elementos que no lo son; la música hace parte del arte y la formación en valores atraviesa toda la experiencia educativa.", false], ["C", "la lectura, la escritura, el cálculo y la motricidad fina, como preparación para la básica primaria.", "Son aprendizajes que pueden aparecer en la experiencia de los niños, pero no son las actividades rectoras definidas por el MEN; además, la educación inicial no se concibe como mera preparación para la primaria.", false]]}, {"id": "PD-152", "niv": 2, "e": "A partir de las orientaciones del MEN, a la colega que usa el arte solo con fichas para la motricidad, usted le plantea que", "f": "MEN, Actividades rectoras de la primera infancia y de la educación inicial (portal mineducacion.gov.co); Serie de Orientaciones Pedagógicas para la Educación Inicial.", "o": [["A", "la práctica es adecuada, porque la finalidad principal del arte en el preescolar es preparar la escritura.", "El MEN señala expresamente que la pintura y el dibujo no se proponen como estrategias para desarrollar la motricidad fina, aunque puedan contribuir a ella; su sentido es otro.", false], ["B", "el arte debe reservarse para el final de la jornada, como premio por terminar las actividades académicas.", "Convertir el arte en un premio lo subordina a otras actividades y desconoce su carácter de actividad rectora de la educación inicial.", false], ["C", "el arte es una actividad rectora que posibilita aprendizajes por sí misma, como expresarse y construir mundos simbólicos.", "Según el MEN, las actividades rectoras, lejos de ser herramientas que se usan como medio para lograr otros aprendizajes, posibilitan aprendizajes en sí mismas; el arte permite a los niños expresarse, construir mundos simbólicos y apropiarse de la realidad.", true]]}, {"id": "PD-153", "niv": 2, "e": "Ante la solicitud de la familia de Samuel, usted explica que", "f": "Decreto 1411 de 2022 (subroga el capítulo 2, título 3, parte 3, libro 2 del Decreto 1075 de 2015).", "o": [["A", "la decisión corresponde a la familia, que puede pedir por escrito la repetición del grado al rector.", "La promoción de transición a primero no depende de una solicitud de la familia: la norma la define como automática.", false], ["B", "el niño puede repetir transición si el consejo académico verifica que no alcanzó los DBA del grado.", "La norma vigente para la educación inicial no prevé la reprobación de grados; los DBA orientan la planeación y el seguimiento, no la decisión de repetir el grado.", false], ["C", "en la educación inicial no se reprueban grados ni actividades, y la promoción de transición a primero es automática.", "El Decreto 1411 de 2022, que reglamenta la educación inicial en el Decreto 1075 de 2015, dispone que en la educación inicial no se reprueban grados ni actividades, que los niños avanzan según sus capacidades y que la promoción de transición a primero es automática.", true]]}, {"id": "PD-154", "niv": 3, "e": "Al elaborar el informe del período para las familias de transición, lo que corresponde es", "f": "Decreto 1411 de 2022 (valoración y seguimiento del desarrollo y el aprendizaje).", "o": [["A", "una valoración numérica de 1,0 a 5,0 por dimensión, con su equivalencia en la escala de valoración nacional.", "La escala nacional del Decreto 1290 rige para la básica y la media; en la educación inicial la valoración es cualitativa y se comunica mediante informes descriptivos.", false], ["B", "un informe descriptivo y cualitativo del desarrollo y el aprendizaje de cada niño, con acciones para seguir potenciándolo.", "El Decreto 1411 de 2022 establece que la valoración y el seguimiento al desarrollo y el aprendizaje se expresan en informes descriptivos y periódicos de corte cualitativo, que permitan a docentes y familias identificar avances y planear acciones.", true], ["C", "un listado de las fichas completadas por el niño y de las que le quedaron pendientes durante el período.", "Un inventario de fichas no describe el desarrollo ni el aprendizaje del niño, ni orienta acciones para potenciarlos, que es lo que exige la norma.", false]]}, {"id": "PD-155", "niv": 2, "e": "Al planear con los DBA de transición, usted tiene presente que uno de sus tres grandes propósitos es que niñas y niños", "f": "MEN (2016). Derechos Básicos de Aprendizaje de Transición.", "o": [["A", "disfruten aprender, exploren y se relacionen con el mundo para comprenderlo y construirlo.", "Los DBA de transición se fundamentan en tres propósitos: que niñas y niños construyan su identidad en relación con los otros; que sean comunicadores activos de sus ideas, sentimientos y emociones; y que disfruten aprender, exploren y se relacionen con el mundo para comprenderlo y construirlo.", true], ["B", "lean y escriban de forma convencional antes de ingresar a primer grado de la básica primaria.", "Los DBA de transición no establecen la lectura y escritura convencional como propósito del grado; plantean que los niños sean comunicadores activos que expresan, imaginan y representan su realidad.", false], ["C", "memoricen los números hasta el cien y las letras del alfabeto como base para los aprendizajes de primaria.", "La memorización de secuencias no figura entre los propósitos de los DBA de transición, que privilegian experiencias de juego, arte, literatura y exploración del medio.", false]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Juego, literatura y exploración del medio en la educación inicial", "texto": "Usted atiende el grado jardín y transición en una sede rural del Tolima, cerca de una quebrada. En el aula organizó un rincón de juego con una «tienda» hecha con empaques reciclados y un rincón de cuentos. Las familias de la vereda conservan coplas, arrullos y relatos sobre la quebrada. Esta semana planea una salida a la orilla de la quebrada con los niños, acompañada por dos madres de familia, y quiere aprovechar el juego libre de la tarde para observar el desarrollo de sus estudiantes.", "items": [{"id": "PD-156", "niv": 1, "e": "Para potenciar la exploración del medio durante la salida a la quebrada, lo más pertinente es", "f": "MEN, Actividades rectoras de la primera infancia y de la educación inicial (portal mineducacion.gov.co); Serie de Orientaciones Pedagógicas para la Educación Inicial (la exploración del medio).", "o": [["A", "explicar en el aula los nombres de los animales y las plantas de la quebrada antes de salir, para que los reconozcan.", "La explicación previa puede tener lugar, pero si sustituye la experiencia, los niños pasan a reconocer lo que ya se les dijo en lugar de observar, preguntar y descubrir por sí mismos.", false], ["B", "invitar a los niños a observar, tocar, preguntar y dibujar lo que encuentran, y luego conversar sobre sus hallazgos.", "El MEN describe la exploración del medio como la oportunidad de usar los sentidos para cuestionarse, resolver problemas, investigar y construir sentido sobre el mundo; registrar y conversar sobre los hallazgos amplía esa experiencia.", true], ["C", "pedir que coloreen una ficha sobre el agua al regresar al aula, para verificar que prestaron atención.", "Colorear una ficha predeterminada no recoge lo que los niños exploraron ni sus preguntas; reduce la experiencia a un control de atención.", false]]}, {"id": "PD-157", "niv": 2, "e": "Durante el juego libre en el rincón de la tienda, el papel más adecuado de usted como docente es", "f": "MEN, Actividades rectoras de la primera infancia y de la educación inicial (portal mineducacion.gov.co); Serie de Orientaciones Pedagógicas para la Educación Inicial (el juego).", "o": [["A", "aprovechar ese tiempo para organizar los materiales del día siguiente, porque el juego libre no requiere de intervención.", "Que el juego sea libre no significa que el docente se ausente: su observación y acompañamiento son claves para comprender el desarrollo de los niños y enriquecer la experiencia.", false], ["B", "convertir el juego en un ejercicio de sumas con las monedas de la tienda, corrigiendo a quien se equivoque.", "Transformar el juego en un ejercicio con corrección lo convierte en un medio para otro fin y desconoce que, según el MEN, el juego posibilita aprendizajes por sí mismo.", false], ["C", "observar y acompañar el juego, y enriquecerlo con materiales o preguntas sin dirigirlo por completo.", "El MEN reconoce el juego como actividad rectora en la que los niños representan y resignifican su realidad. El docente observa para conocer a los niños y enriquece el juego sin convertirlo en una actividad dirigida.", true]]}, {"id": "PD-158", "niv": 3, "e": "De acuerdo con las orientaciones del MEN, la literatura en la primera infancia comprende", "f": "MEN, Actividades rectoras de la primera infancia y de la educación inicial (portal mineducacion.gov.co); Serie de Orientaciones Pedagógicas para la Educación Inicial (la literatura).", "o": [["A", "las obras escritas, la tradición oral y los libros ilustrados, incluidos los arrullos y relatos de la vereda.", "Según el MEN, en sentido amplio la literatura en la primera infancia abarca no solo las obras literarias escritas, sino también la tradición oral y los libros ilustrados; las coplas, arrullos y relatos de las familias hacen parte de ella.", true], ["B", "los cuentos clásicos universales, que deben preferirse a los relatos orales de la comunidad.", "El MEN reconoce la tradición oral como parte de la literatura en la primera infancia; desplazar los relatos de la comunidad desaprovecha un patrimonio que conecta con la experiencia de los niños.", false], ["C", "principalmente los textos escritos que los niños ya pueden decodificar de manera autónoma.", "La literatura en la primera infancia no depende de que el niño sepa leer convencionalmente: incluye lo que escucha, canta y explora con los adultos.", false]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Escuela Nueva y aula multigrado en zona rural", "texto": "Usted es el único docente de una sede rural en Antioquia que atiende a 24 estudiantes de primero a quinto grado con el modelo Escuela Nueva. La sede cuenta con cartillas y guías de aprendizaje del modelo, una pequeña biblioteca y un espacio para el centro de recursos de aprendizaje. Al revisar la guía de ciencias naturales de cuarto grado, usted encuentra una actividad sobre el ecosistema de páramo, aunque la vereda está en tierra cálida. Además, Luisa, de tercer grado, avanza muy rápido en las guías, mientras que otros dos estudiantes necesitan más tiempo. Usted quiere fortalecer la autonomía y la participación de los niños.", "items": [{"id": "PD-159", "niv": 1, "e": "Según el Ministerio de Educación Nacional, el modelo Escuela Nueva se caracteriza por", "f": "MEN, Modelos Educativos Flexibles: Escuela Nueva (portal mineducacion.gov.co).", "o": [["A", "atender a jóvenes en extraedad de la básica secundaria que abandonaron el sistema educativo.", "Esa población la atienden otros modelos educativos flexibles; Escuela Nueva se orienta a la básica primaria, en especial en zonas rurales.", false], ["B", "funcionar en zonas urbanas con un docente por cada grado y horarios organizados por asignaturas.", "Escuela Nueva surgió como respuesta al multigrado rural; un docente por grado con horario por asignaturas corresponde a la organización graduada convencional.", false], ["C", "ofrecer la básica primaria completa en escuelas multigrado con uno, dos o hasta tres docentes.", "El MEN describe Escuela Nueva como un modelo que permite ofrecer los cinco grados de la básica primaria con calidad en escuelas multigrado con uno, dos o hasta tres maestros, integrando estrategias curriculares, de capacitación docente, gestión administrativa y participación comunitaria.", true]]}, {"id": "PD-160", "niv": 2, "e": "Frente a la actividad de la guía sobre el páramo, lo más adecuado es", "f": "MEN, Escuela Nueva: Manual de implementación (Programa de Educación Rural): las guías y su relación con el PEI.", "o": [["A", "adaptar la actividad al ecosistema de la vereda, pues las guías apoyan el PEI y pueden ajustarse al contexto.", "El manual de implementación de Escuela Nueva aclara que las guías son una herramienta para cumplir el PEI, que su contenido puede adaptarse si es necesario y que no son una camisa de fuerza.", true], ["B", "omitir esa guía y continuar con la siguiente, para no salirse de la secuencia didáctica de la cartilla.", "Omitir la guía deja sin trabajar los aprendizajes que propone; lo pertinente es mantener el propósito y cambiar el ejemplo por uno del entorno.", false], ["C", "desarrollar la guía sin cambios, porque el modelo exige seguirla tal como está escrita para mantener la secuencia.", "El propio manual del modelo advierte que las guías no son la única manera de trabajar ni una camisa de fuerza; seguirlas sin ajustar desaprovecha el contexto de los estudiantes.", false]]}, {"id": "PD-161", "niv": 1, "e": "Para fortalecer la autonomía y la participación de los estudiantes, de acuerdo con el modelo, usted promueve", "f": "MEN, Escuela Nueva: Manual de implementación (Programa de Educación Rural): gobierno estudiantil.", "o": [["A", "la elección del estudiante con mejores calificaciones como representante permanente de todos los grados.", "Reservar la representación a quien tiene mejores notas restringe la participación y desconoce el carácter democrático y rotativo de los comités del modelo.", false], ["B", "la conformación democrática del gobierno estudiantil, con presidente, vicepresidente, secretario y comités de trabajo.", "En Escuela Nueva el gobierno estudiantil, elegido democráticamente y organizado en comités, fortalece la participación, la autonomía, la responsabilidad y el liderazgo de los estudiantes, y es un espacio real de formación para la democracia.", true], ["C", "la designación, por parte del docente, de un monitor por grado encargado de controlar la disciplina del grupo.", "Un monitor designado por el docente para vigilar la disciplina no promueve la participación democrática ni la organización autónoma que busca el modelo.", false]]}, {"id": "PD-162", "niv": 2, "e": "Frente a los diferentes ritmos de Luisa y de los otros dos estudiantes, lo coherente con la promoción flexible del modelo es", "f": "MEN, Escuela Nueva: Manual de implementación (Programa de Educación Rural): promoción flexible; Decreto 1290 de 2009, artículo 3.", "o": [["A", "detener a Luisa hasta que el resto de su grado termine las mismas guías, para mantener al grupo unido.", "Frenar a una estudiante que avanza desconoce el principio de Escuela Nueva de respetar el ritmo de cada uno y puede desmotivarla.", false], ["B", "exigir a quienes van más despacio que terminen las guías en casa para que alcancen al resto del grupo.", "Trasladar el atraso a la casa ignora que esos estudiantes necesitan más tiempo y apoyo pedagógico, que es responsabilidad de la escuela ofrecer.", false], ["C", "permitir que cada estudiante avance por las guías a su ritmo, con apoyos para quien requiera más tiempo.", "La promoción flexible de Escuela Nueva reconoce que cada estudiante tiene su propio ritmo de aprendizaje y le permite avanzar según sus logros, con acompañamiento para quienes lo necesitan, en el marco del SIEE de la institución.", true]]}, {"id": "PD-163", "niv": 3, "e": "Con estudiantes de primero a quinto en una sola aula, la organización de la clase más coherente con Escuela Nueva es", "f": "MEN, Escuela Nueva: Manual de implementación (Programa de Educación Rural): aprendizaje activo y cooperativo, rol del docente.", "o": [["A", "dar la misma explicación magistral a todos los grados y diferenciar únicamente las tareas para la casa.", "Una explicación única para todos no responde a los distintos grados y niveles, y deja la diferenciación por fuera del aula.", false], ["B", "trabajar en pequeños grupos con las guías mientras usted rota para orientar y algunos estudiantes apoyan a otros.", "El modelo organiza el aula multigrado en grupos que trabajan con las guías de manera activa y cooperativa; el docente actúa como orientador que rota entre los grupos y se apoya en la colaboración entre estudiantes.", true], ["C", "atender un grado a la vez mientras los demás copian del tablero las actividades que les corresponden ese día.", "Mantener a la mayoría del grupo copiando mientras se atiende a un grado desaprovecha el tiempo y contradice el aprendizaje activo y cooperativo del modelo.", false]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Diseño Universal para el Aprendizaje (DUA) en la planeación", "texto": "Usted orienta ciencias naturales en quinto grado en una institución de Riohacha. En su grupo de 32 estudiantes están Mateo, que tiene baja visión, y Yanelis, una niña wayuu cuya lengua materna es el wayuunaiki y que todavía presenta dificultades con el castellano escrito. También hay estudiantes con intereses muy diversos. Usted debe planear la unidad sobre el sistema digestivo y quiere hacerlo desde el Diseño Universal para el Aprendizaje (DUA), como lo plantea la normativa de educación inclusiva. El año anterior, otro docente planeaba una sola clase para «el estudiante promedio» y después hacía ajustes individuales cuando alguien no lograba seguirla.", "items": [{"id": "PD-164", "niv": 1, "e": "Al planear la unidad desde el DUA, usted parte de", "f": "Decreto 1421 de 2017 (compilado en el Decreto 1075 de 2015): definiciones de diseño universal del aprendizaje y ajustes razonables.", "o": [["A", "diseñar desde el inicio opciones variadas para que todos accedan, participen y demuestren lo aprendido.", "El Decreto 1421 de 2017 define el DUA como un diseño de productos, entornos, programas y servicios que puedan utilizar todas las personas, en la mayor medida posible, sin necesidad de adaptación ni diseño especializado; en el aula se traduce en planear desde el inicio múltiples opciones.", true], ["B", "planear para el estudiante promedio y luego hacer ajustes individuales a quienes no logren seguir la clase.", "Esa es la lógica que el DUA busca superar: diseñar para un estudiante «promedio» y adaptar después produce barreras que podrían haberse previsto desde el diseño.", false], ["C", "esperar a recibir el diagnóstico médico de cada estudiante antes de definir cualquier ajuste en la planeación.", "El DUA es una estrategia para todo el grupo y no depende de diagnósticos; la normativa aclara que tampoco los ajustes razonables dependen de un diagnóstico médico, sino de las barreras identificadas.", false]]}, {"id": "PD-165", "niv": 3, "e": "De las siguientes acciones, la que corresponde al principio del DUA de proporcionar múltiples formas de representación es", "f": "CAST (2018). Pautas sobre el Diseño Universal para el Aprendizaje; Decreto 1421 de 2017 (compilado en el Decreto 1075 de 2015).", "o": [["A", "ofrecer opciones de subtemas según los intereses de los estudiantes, para mantener su motivación durante la unidad.", "Dar opciones según los intereses para sostener la motivación corresponde al principio de múltiples formas de implicación o compromiso, no al de representación.", false], ["B", "permitir que los estudiantes entreguen su trabajo como texto escrito, maqueta o exposición oral, según prefieran.", "Ofrecer distintas formas de mostrar lo aprendido corresponde al principio de múltiples formas de acción y expresión, no al de representación.", false], ["C", "presentar la misma información con texto ampliado, audio, imágenes y modelos que los estudiantes puedan manipular.", "El principio de representación se refiere a ofrecer la información por distintos medios y formatos para que todos puedan percibirla y comprenderla (CAST); el texto ampliado y el audio, por ejemplo, benefician a Mateo y al resto del grupo.", true]]}, {"id": "PD-166", "niv": 3, "e": "Si, a pesar de las opciones del DUA, Mateo sigue encontrando barreras para leer los textos de la unidad, corresponde", "f": "Decreto 1421 de 2017 (compilado en el Decreto 1075 de 2015): ajustes razonables y PIAR.", "o": [["A", "definir ajustes razonables específicos, como material ampliado o lupa, y registrarlos en su PIAR.", "Según el Decreto 1421 de 2017, los ajustes razonables son las acciones, adaptaciones y apoyos que se requieren cuando persisten barreras a pesar del DUA; se definen a partir de la valoración pedagógica y se consignan en el PIAR.", true], ["B", "esperar a que la familia entregue un diagnóstico médico actualizado para poder hacer cualquier tipo de ajuste.", "El Decreto 1421 aclara que los ajustes razonables no dependen de un diagnóstico médico, sino de las barreras que enfrenta el estudiante; esperar retrasa apoyos que se necesitan ya.", false], ["C", "excluirlo de las actividades de lectura y valorar únicamente su participación oral durante el período.", "Excluirlo de la lectura limita su derecho a la educación en igualdad de condiciones; lo que procede es eliminar la barrera con apoyos específicos, no retirar la actividad.", false]]}, {"id": "PD-167", "niv": 2, "e": "Para apoyar a Yanelis en la unidad, una estrategia coherente con el DUA es", "f": "CAST (2018). Pautas sobre el Diseño Universal para el Aprendizaje; Decreto 1421 de 2017 (compilado en el Decreto 1075 de 2015).", "o": [["A", "ubicarla temporalmente en un grado inferior mientras domina el castellano escrito, para que no se atrase.", "Cambiarla de grado por la lengua confunde una barrera lingüística con falta de aprendizaje y desconoce su derecho a una educación pertinente en su grado.", false], ["B", "ofrecer apoyos visuales y glosarios, y permitirle mostrar lo aprendido también de forma oral o gráfica.", "El DUA propone múltiples formas de representación (apoyos visuales, glosarios) y de acción y expresión (oral, gráfica), que reducen la barrera del castellano escrito sin bajar la meta de aprendizaje.", true], ["C", "asignarle las mismas actividades escritas que al resto del grupo, sin cambios, para no darle un trato diferente.", "Dar exactamente lo mismo a todos no garantiza igualdad de oportunidades: mantiene la barrera del castellano escrito y le impide mostrar lo que sabe.", false]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Gestión y manejo de aula", "texto": "Usted acaba de asumir la dirección de grupo de octavo grado en una institución de Soacha. El grupo tiene fama de «difícil»: hay interrupciones frecuentes, algunos estudiantes llegan tarde y varios docentes han optado por anotar faltas en el observador. Sus clases de matemáticas son bloques de 110 minutos y usted nota que la mayor parte de la indisciplina se presenta en los últimos 20 minutos, que suele dedicar a explicar en el tablero. Además, Kevin interrumpe con comentarios graciosos cuando usted explica. El grupo y usted inician el año escolar la próxima semana.", "items": [{"id": "PD-168", "niv": 1, "e": "Al inicio del año, la estrategia preventiva más pertinente para el manejo del aula es", "f": "Ley 1620 de 2013, artículo 5 (principio de participación); MEN (2006). Estándares Básicos de Competencias en Lenguaje, Matemáticas, Ciencias y Ciudadanas (competencias ciudadanas).", "o": [["A", "leer en voz alta el capítulo de faltas del manual para que conozcan desde el primer día las sanciones de cada una.", "Conocer el manual es necesario, pero empezar solo por las sanciones privilegia el control punitivo y no construye compromisos ni rutinas que prevengan las dificultades.", false], ["B", "construir con el grupo, desde la primera semana, acuerdos de aula y rutinas claras, explicando el sentido de cada uno.", "Establecer de manera participativa normas y rutinas explícitas desde el comienzo previene muchos conflictos y aumenta el compromiso de los estudiantes; además, es coherente con la formación en competencias ciudadanas y con el principio de participación de la Ley 1620 de 2013.", true], ["C", "esperar a que se presenten las primeras dificultades para definir las normas según las necesidades de cada caso.", "Definir normas sobre la marcha y caso por caso es reactivo y genera percepción de arbitrariedad; la gestión de aula eficaz anticipa expectativas desde el inicio.", false]]}, {"id": "PD-169", "niv": 2, "e": "Frente al aumento de la indisciplina en los últimos 20 minutos de clase, lo más pertinente es", "f": "Decreto 1860 de 1994, artículo 35 (métodos activos y vivenciales); literatura sobre gestión de aula.", "o": [["A", "reorganizar el bloque en segmentos con actividades variadas y momentos de trabajo activo de los estudiantes.", "Cuando la disrupción se concentra en un momento previsible, la respuesta pedagógica es ajustar la estructura de la clase: alternar explicación breve, práctica guiada y trabajo activo sostiene la atención y reduce las interrupciones.", true], ["B", "reducir a la mitad los contenidos de cada clase y dejar como tarea para la casa los que no alcancen a verse.", "Recortar contenidos y trasladarlos a la casa no cambia la dinámica de la clase y descarga en los estudiantes aprendizajes que requieren acompañamiento.", false], ["C", "registrar en el observador a quienes se distraigan en ese momento, para que mejoren su atención.", "La anotación atiende el síntoma, no la causa: tras 90 minutos, una explicación larga en el tablero excede la capacidad de atención sostenida del grupo.", false]]}, {"id": "PD-170", "niv": 2, "e": "Cuando Kevin interrumpe con comentarios durante la explicación, la respuesta más adecuada es", "f": "Ley 1620 de 2013, artículo 21 (rol orientador y mediador del docente); literatura sobre gestión de aula.", "o": [["A", "enviarlo a coordinación cada vez que interrumpa, para que la situación no afecte el ritmo de la clase.", "Remitir de inmediato una conducta menor delega una situación que el docente puede manejar en el aula y priva al estudiante de la clase.", false], ["B", "detener la clase y exigirle públicamente una disculpa frente al grupo, para que los demás no lo imiten.", "La confrontación pública puede escalar el conflicto y darle al estudiante la atención que busca; además, expone su dignidad frente a los compañeros.", false], ["C", "acercarse, recordarle el acuerdo en voz baja, continuar la clase y conversar con él después si persiste.", "Las intervenciones discretas y proporcionales detienen la conducta sin interrumpir el aprendizaje del grupo ni exponer al estudiante; la conversación posterior permite comprender sus motivos y acordar compromisos.", true]]}, {"id": "PD-171", "niv": 3, "e": "Para que el manejo de aula sea formativo y no solo sancionatorio, la práctica más coherente es", "f": "Decreto 1965 de 2013, artículo 43 (acciones restaurativas); Decreto 1290 de 2009, artículo 5.", "o": [["A", "disminuir la valoración académica del área a los estudiantes que incumplan los acuerdos de convivencia.", "Mezclar convivencia con la valoración académica distorsiona la evaluación del aprendizaje, que según el Decreto 1290 se refiere a los desempeños en las áreas.", false], ["B", "aplicar la misma sanción a todo el grupo cuando no se logra identificar al responsable de una falta.", "Las sanciones colectivas castigan a quienes no participaron, deterioran la confianza y no enseñan responsabilidad individual.", false], ["C", "reconocer conductas positivas concretas y analizar con los estudiantes las consecuencias de sus actos para reparar el daño.", "El enfoque formativo combina el reconocimiento de lo que se hace bien con la reflexión y la reparación; el Decreto 1965 de 2013 incluye las acciones restaurativas entre las respuestas a las situaciones de convivencia.", true]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Uso pedagógico de las TIC", "texto": "Usted es docente de tecnología e informática en una institución que tiene una sede urbana en Florencia y una sede rural con conectividad intermitente. La institución recibió tabletas y el rector pide a los docentes integrarlas en sus clases. Algunos colegas eligen aplicaciones por ser las más novedosas y otros prefieren no usarlas por la falta de internet en la sede rural. Usted toma como referencia el documento del Ministerio de Educación Nacional «Competencias TIC para el desarrollo profesional docente» (2013). Una colega de la sede rural, por su parte, ya combina varias herramientas digitales en ambientes de aprendizaje diseñados para su vereda y comparte sus experiencias con otros docentes.", "items": [{"id": "PD-172", "niv": 1, "e": "Antes de elegir una herramienta digital para una unidad, lo primero que usted debe definir es", "f": "MEN (2013). Competencias TIC para el desarrollo profesional docente: competencia pedagógica.", "o": [["A", "qué aprendizaje se espera y de qué manera la herramienta ayuda a lograrlo mejor que otras opciones.", "El MEN plantea que la competencia pedagógica en TIC consiste en usarlas para fortalecer la enseñanza y el aprendizaje; por eso la elección parte del propósito pedagógico y no de la herramienta.", true], ["B", "cuál es la aplicación más novedosa disponible, porque la novedad motiva a los estudiantes a participar.", "La novedad puede generar interés momentáneo, pero si no responde a un propósito de aprendizaje la herramienta se vuelve un fin en sí misma.", false], ["C", "cuántas horas semanales pueden dedicarse a las tabletas para cumplir con la solicitud del rector.", "Fijar horas de uso sin un propósito convierte la integración de TIC en un requisito administrativo y no en una decisión pedagógica.", false]]}, {"id": "PD-173", "niv": 3, "e": "Según el MEN (2013), la competencia pedagógica del docente en relación con las TIC consiste en", "f": "MEN (2013). Competencias TIC para el desarrollo profesional docente: competencias tecnológica, comunicativa, pedagógica, de gestión e investigativa.", "o": [["A", "seleccionar y utilizar herramientas tecnológicas comprendiendo sus principios, sus combinaciones y sus licencias.", "Esa es la definición de la competencia tecnológica, una de las cinco competencias del documento, distinta de la pedagógica.", false], ["B", "utilizar las TIC para fortalecer la enseñanza y el aprendizaje, reconociendo sus alcances y limitaciones.", "El MEN define la competencia pedagógica como la capacidad de utilizar las TIC para fortalecer los procesos de enseñanza y aprendizaje, reconociendo alcances y limitaciones de su incorporación en la formación integral de los estudiantes y en el propio desarrollo profesional.", true], ["C", "utilizar las TIC para la transformación del saber y la generación de nuevos conocimientos.", "Esa es la definición de la competencia investigativa del mismo documento, no de la pedagógica.", false]]}, {"id": "PD-174", "niv": 2, "e": "Ante la conectividad intermitente de la sede rural, una decisión pedagógica pertinente es", "f": "MEN (2013). Competencias TIC para el desarrollo profesional docente: competencia pedagógica.", "o": [["A", "suspender el uso de las tabletas en la sede rural hasta que se cuente con una conexión a internet estable.", "Suspender el uso deja sin aprovechar la dotación y amplía la brecha con la sede urbana, cuando existen recursos que funcionan sin conexión.", false], ["B", "dejar como tareas para la casa las actividades que requieran internet, para no depender de la sede.", "Si la vereda tiene conectividad limitada, es probable que muchos hogares tampoco la tengan; trasladar esas actividades a la casa genera inequidad.", false], ["C", "usar recursos descargados con anticipación o que funcionen sin conexión y respondan al propósito de la clase.", "La falta de conectividad no impide integrar TIC con sentido pedagógico: los recursos sin conexión permiten mantener el propósito de aprendizaje y aprovechar la dotación, coherente con la competencia pedagógica del MEN.", true]]}, {"id": "PD-175", "niv": 3, "e": "Según el MEN (2013), la forma de trabajar de la colega de la sede rural corresponde al momento de", "f": "MEN (2013). Competencias TIC para el desarrollo profesional docente: momentos de exploración, integración e innovación.", "o": [["A", "integración, porque utiliza las TIC de forma autónoma en la planeación, la evaluación y las prácticas pedagógicas.", "La integración implica uso autónomo en la planeación y las prácticas, pero el caso describe además la creación de ambientes adaptados al entorno y el intercambio con pares, rasgos del momento siguiente.", false], ["B", "innovación, porque adapta y combina herramientas para diseñar ambientes que responden a su entorno.", "El MEN describe el momento de innovación como aquel en que los docentes adaptan y combinan diversos lenguajes y herramientas para diseñar ambientes de aprendizaje que respondan a su entorno, y comparten sus actividades con colegas para recibir realimentación.", true], ["C", "exploración, porque se está familiarizando con el espectro de posibilidades que ofrecen las TIC en la educación.", "En el momento de exploración el docente apenas conoce las posibilidades de las TIC y empieza a introducirlas; la colega ya diseña ambientes y comparte su experiencia.", false]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Planeación de la clase y formulación de propósitos", "texto": "Usted es docente de lengua castellana de sexto grado en una institución de Pereira. La evaluación diagnóstica de inicio de año muestra tres situaciones en su grupo: un tercio de los estudiantes identifica sin dificultad la estructura de los textos informativos, otro tercio la reconoce con ayuda y el resto aún confunde los textos informativos con los narrativos. El coordinador le pide entregar la planeación de la primera unidad con propósitos de aprendizaje claros y verificables. En el formato que le entregaron hay espacios para el inicio, el desarrollo y el cierre de cada sesión.", "items": [{"id": "PD-176", "niv": 1, "e": "De las siguientes formulaciones, la que expresa mejor un propósito de aprendizaje claro y verificable es", "f": "Wiggins, G. y McTighe, J. (2005). Understanding by Design; MEN (2006). Estándares Básicos de Competencias en Lenguaje, Matemáticas, Ciencias y Ciudadanas (estándares de lenguaje).", "o": [["A", "«Comparar la estructura de dos textos informativos usando ejemplos tomados de su entorno cercano».", "Un propósito verificable describe lo que el estudiante hará con el conocimiento mediante una acción observable (comparar), un objeto (la estructura de textos informativos) y un contexto; así orienta la enseñanza y la evaluación.", true], ["B", "«Que el docente explique los tipos de texto informativo con ejemplos y ejercicios en el tablero».", "Describe una acción del docente, no un aprendizaje del estudiante; la planeación debe expresar lo que se espera que los estudiantes logren.", false], ["C", "«Conocer los textos informativos y su importancia en la vida cotidiana de los estudiantes».", "«Conocer» es un verbo amplio que no indica qué hará el estudiante para demostrar el aprendizaje; resulta difícil verificar si se alcanzó.", false]]}, {"id": "PD-177", "niv": 2, "e": "En el inicio de cada sesión, además de activar los saberes previos, es recomendable", "f": "Black, P. y Wiliam, D. (1998). Inside the black box; Decreto 1290 de 2009, artículo 12.", "o": [["A", "dictar el contenido completo de la sesión, para ganar tiempo durante el momento de desarrollo.", "Dictar todo al inicio convierte la sesión en transmisión de información y reduce el tiempo de práctica y construcción, que es el sentido del momento de desarrollo.", false], ["B", "comunicar a los estudiantes el propósito de aprendizaje y cómo sabrán si lo alcanzaron.", "Compartir el propósito y los criterios de logro al iniciar ayuda a los estudiantes a orientar su esfuerzo y a autoevaluarse; es una práctica central de la evaluación formativa.", true], ["C", "entregar la evaluación de la sesión para que los estudiantes la resuelvan mientras usted explica el tema.", "Evaluar mientras se explica impide que los estudiantes atiendan y practiquen; la evaluación tiene sentido después de haber tenido oportunidad de aprender.", false]]}, {"id": "PD-178", "niv": 3, "e": "Con base en los resultados de la evaluación diagnóstica, la planeación más pertinente es", "f": "Decreto 1290 de 2009, artículo 3, numeral 3; MEN (2009). Documento No. 11: Fundamentaciones y orientaciones para la implementación del Decreto 1290 de 2009.", "o": [["A", "tres planeaciones independientes, con metas distintas para cada subgrupo que se mantengan todo el año.", "Fijar metas diferentes y permanentes para cada subgrupo crea trayectorias desiguales y limita las expectativas de quienes empiezan con menos dominio.", false], ["B", "la planeación del grado tal como está diseñada, y dejar los apoyos para las actividades de recuperación.", "Ignorar el diagnóstico y aplazar los apoyos hasta la recuperación desaprovecha la información recogida y permite que las dificultades se acumulen.", false], ["C", "una secuencia con un propósito común y tareas con distintos niveles de apoyo y desafío según el diagnóstico.", "Mantener una meta común para todos y diferenciar el apoyo y el desafío permite que cada estudiante avance desde su punto de partida; es coherente con el propósito del Decreto 1290 de apoyar tanto las debilidades como los desempeños superiores.", true]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Constructivismo: ideas previas y cambio conceptual", "texto": "Usted enseña ciencias naturales en sexto grado en una institución de Sincelejo. Al iniciar la unidad sobre nutrición de las plantas, pregunta a sus estudiantes de dónde obtienen las plantas su alimento. La mayoría responde con seguridad que «lo sacan de la tierra, por las raíces», idea que también comparten varios padres de familia. Usted sabe que estas ideas previas suelen ser resistentes al cambio y quiere planear la unidad desde un enfoque constructivista. La institución tiene una zona verde donde los estudiantes pueden sembrar y observar plantas durante varias semanas.", "items": [{"id": "PD-179", "niv": 1, "e": "En un enfoque constructivista, el rol que usted asume frente a sus estudiantes es el de", "f": "Piaget, J. (1970). La epistemología genética; Vygotsky, L. S. (1978/2009). El desarrollo de los procesos psicológicos superiores.", "o": [["A", "mediador que diseña situaciones para que los estudiantes pongan a prueba sus ideas y construyan conocimiento.", "Desde el constructivismo (Piaget, Vygotsky), el estudiante construye activamente su conocimiento y el docente diseña experiencias, plantea problemas y media para que esa construcción ocurra.", true], ["B", "observador que no interviene en el proceso, para que cada estudiante descubra por sí mismo las respuestas.", "El constructivismo no implica ausencia del docente; sin mediación, muchas ideas previas erróneas se mantienen intactas.", false], ["C", "transmisor del conocimiento científico, que explica los conceptos correctos para que los estudiantes los reciban.", "Concebir al docente como transmisor y al estudiante como receptor corresponde a un enfoque tradicional; el constructivismo entiende el conocimiento como construido por quien aprende.", false]]}, {"id": "PD-180", "niv": 2, "e": "Frente a la idea de que las plantas obtienen su alimento de la tierra, lo más pertinente es", "f": "Piaget, J. (1970). La epistemología genética (equilibración); Ausubel, D. P. (1976). Psicología educativa.", "o": [["A", "no tener en cuenta la idea previa, porque los estudiantes la abandonarán al estudiar el tema en clase.", "Las ideas previas son resistentes; si no se trabajan explícitamente, tienden a coexistir con el concepto científico o a imponerse sobre él.", false], ["B", "plantear una experiencia que la ponga a prueba, como pesar la tierra de una matera mientras la planta crece.", "El enfoque constructivista parte de las ideas previas y propone situaciones que las confronten. Si la planta gana mucha masa mientras la tierra casi no pierde peso, la idea de que «el alimento sale de la tierra» entra en conflicto con la evidencia, y eso genera la necesidad de reorganizar la explicación.", true], ["C", "corregir de inmediato la idea errónea y dictar la definición de fotosíntesis para que la estudien.", "Corregir sin que el estudiante confronte su idea suele producir una respuesta memorizada para la prueba, mientras la idea previa se mantiene en otros contextos.", false]]}, {"id": "PD-181", "niv": 3, "e": "Cuando los resultados contradicen la idea inicial del estudiante y este reorganiza su explicación, en términos de Piaget ocurre", "f": "Piaget, J. (1970). La epistemología genética (asimilación, acomodación, equilibración).", "o": [["A", "un condicionamiento operante, porque la respuesta correcta queda reforzada por la aprobación del docente.", "El condicionamiento operante es un concepto conductista sobre el efecto de las consecuencias en la conducta; no describe la reorganización cognitiva planteada por Piaget.", false], ["B", "una asimilación, porque incorpora el dato nuevo a lo que pensaba sin necesidad de modificar sus ideas.", "La asimilación integra la experiencia a esquemas existentes sin modificarlos; aquí el estudiante sí cambia su explicación, lo que corresponde a la acomodación.", false], ["C", "un desequilibrio que se resuelve por acomodación, al modificar sus esquemas para integrar la nueva evidencia.", "Para Piaget, cuando la experiencia no puede asimilarse a los esquemas existentes se produce un desequilibrio; la equilibración se logra mediante la acomodación, que modifica los esquemas.", true]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Formación y evaluación por competencias", "texto": "Usted es docente de matemáticas en una institución de media técnica en agroindustria en Chiquinquirá. Los estudiantes de décimo grado producen yogur en la planta escolar y lo venden en la tienda de la institución. En la reunión de área se discute qué significa «trabajar por competencias»: un colega sostiene que consiste en memorizar bien los contenidos para responder las pruebas, y otro, que es dominar una técnica a fuerza de repetirla. Usted debe diseñar la evaluación de la unidad de costos y porcentajes, y revisar cómo usar las evidencias de aprendizaje de los Derechos Básicos de Aprendizaje (DBA) de matemáticas en su planeación.", "items": [{"id": "PD-182", "niv": 1, "e": "Según los Estándares Básicos de Competencias del MEN, ser competente implica", "f": "MEN (2006). Estándares Básicos de Competencias en Lenguaje, Matemáticas, Ciencias y Ciudadanas: noción de competencia (estándares de matemáticas).", "o": [["A", "movilizar conocimientos, habilidades y actitudes para desempeñarse con sentido en contextos nuevos y retadores.", "Los estándares retoman la noción de competencia como un conjunto de conocimientos, habilidades, actitudes, comprensiones y disposiciones relacionadas entre sí para facilitar el desempeño flexible, eficaz y con sentido en contextos relativamente nuevos y retadores.", true], ["B", "dominar una técnica específica mediante la repetición frecuente de un mismo tipo de ejercicio.", "La práctica repetida desarrolla destrezas, pero la competencia exige además comprensión y capacidad de actuar en situaciones distintas a las ya ejercitadas.", false], ["C", "memorizar con precisión los contenidos de cada área, para reproducirlos en las pruebas internas y externas.", "La memorización de contenidos no equivale a competencia; los estándares enfatizan el uso flexible del conocimiento en contextos nuevos.", false]]}, {"id": "PD-183", "niv": 2, "e": "Para evaluar la competencia de calcular costos y porcentajes, la tarea más auténtica es", "f": "MEN (2006). Estándares Básicos de Competencias en Lenguaje, Matemáticas, Ciencias y Ciudadanas; MEN (2009). Documento No. 11: Fundamentaciones y orientaciones para la implementación del Decreto 1290 de 2009 (evaluación por competencias).", "o": [["A", "resolver una lista de ejercicios de porcentajes con datos inventados que no se relacionan con la planta.", "Los ejercicios descontextualizados pueden evaluar el procedimiento, pero no muestran si el estudiante sabe usarlo en una situación real de su especialidad.", false], ["B", "calcular el costo real de producir un lote de yogur en la planta escolar y justificar su precio de venta.", "Una tarea auténtica reproduce las condiciones reales en que se usa el conocimiento: exige decidir qué datos usar, calcular, interpretar y argumentar, en coherencia con la noción de competencia de los estándares.", true], ["C", "definir por escrito los conceptos de costo fijo, costo variable, margen de ganancia y punto de equilibrio.", "Definir conceptos evalúa conocimiento declarativo; no evidencia que el estudiante pueda aplicarlos para tomar decisiones en la producción.", false]]}, {"id": "PD-184", "niv": 3, "e": "Las evidencias de aprendizaje que acompañan a cada DBA le sirven a usted principalmente para", "f": "MEN (2016). Derechos Básicos de Aprendizaje V2, Matemáticas (estructura: enunciado, evidencias de aprendizaje y ejemplo).", "o": [["A", "orientar qué desempeños observar para valorar si el aprendizaje se está alcanzando.", "En los DBA (versión 2), cada enunciado se acompaña de evidencias de aprendizaje que describen desempeños observables; sirven al docente para planear actividades y valorar el avance de los estudiantes.", true], ["B", "conocer las preguntas exactas que se incluirán en la próxima aplicación de las pruebas Saber del grado.", "Los DBA no son especificaciones de las pruebas externas; las pruebas tienen marcos de referencia propios elaborados por el ICFES.", false], ["C", "establecer la nota mínima aprobatoria que la institución debe fijar en cada período académico.", "La escala de valoración y los criterios de aprobación los define cada institución en su SIEE según el Decreto 1290; los DBA no fijan notas.", false]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Evaluación diagnóstica y estrategias de apoyo (Decreto 1290 de 2009)", "texto": "En abril llega a su grupo de sexto grado, en una institución de Cúcuta, un estudiante trasladado de otra institución del país. Su constancia de desempeño indica que fue promovido a sexto. Usted aplica una evaluación diagnóstica en matemáticas y lenguaje, y encuentra dificultades importantes en comprensión de textos y en operaciones con fracciones. Un colega le sugiere ubicarlo en quinto «mientras se nivela» y otro propone usar la prueba diagnóstica como primera nota del período. La familia, preocupada, solicita una reunión con usted para conocer cómo se apoyará al estudiante.", "items": [{"id": "PD-185", "niv": 2, "e": "Con base en la constancia de desempeño y el diagnóstico, lo que corresponde es", "f": "Decreto 1290 de 2009, artículo 17; MEN (2009). Documento No. 11: Fundamentaciones y orientaciones para la implementación del Decreto 1290 de 2009 (preguntas frecuentes sobre traslados).", "o": [["A", "condicionar su permanencia en sexto a que apruebe una prueba de admisión al finalizar el primer período.", "La constancia de desempeño tiene validez para la ubicación del estudiante; condicionar su permanencia a una prueba adicional no está previsto en la norma.", false], ["B", "ubicarlo en quinto grado mientras supera las dificultades identificadas en la evaluación diagnóstica.", "El Decreto 1290 dispone que el estudiante trasladado se matricula en el grado al que fue promovido; el MEN precisa que la evaluación diagnóstica no puede usarse para ubicarlo en un grado inferior.", false], ["C", "mantenerlo en sexto, el grado al que fue promovido, e implementar procesos de apoyo según el diagnóstico.", "El artículo 17 del Decreto 1290 de 2009 establece que, cuando la constancia de desempeño reporta que el estudiante fue promovido, se matricula en ese grado y, si la evaluación diagnóstica muestra que necesita apoyos, la institución receptora debe implementarlos.", true]]}, {"id": "PD-186", "niv": 1, "e": "La evaluación diagnóstica que usted aplicó debe usarse para", "f": "Decreto 1290 de 2009, artículos 3 y 17; MEN (2009). Documento No. 11: Fundamentaciones y orientaciones para la implementación del Decreto 1290 de 2009.", "o": [["A", "identificar sus saberes y necesidades, y planear los apoyos pertinentes.", "La evaluación diagnóstica permite a la institución identificar en qué punto del proceso está el estudiante para garantizar su avance; el Decreto 1290 prevé que, si se detectan necesidades, se implementen apoyos.", true], ["B", "decidir si el estudiante debe repetir el grado anterior en la nueva institución.", "El MEN aclara que la evaluación diagnóstica no puede usarse para determinar la promoción ni para ubicar al estudiante en un grado inferior al certificado.", false], ["C", "asignar la primera nota del período en las áreas de matemáticas y lenguaje.", "La evaluación diagnóstica tiene como fin identificar el punto de partida; convertirla en nota sanciona aprendizajes que el estudiante aún no ha tenido oportunidad de desarrollar en la institución.", false]]}, {"id": "PD-187", "niv": 2, "e": "En la reunión con la familia, la decisión más pertinente para el plan de apoyo es", "f": "Decreto 1290 de 2009, artículo 11, numerales 3 y 4.", "o": [["A", "asignarle tareas adicionales de los temas del año anterior para que se nivele por su cuenta en casa.", "Recargar al estudiante con tareas de todo el año anterior, sin acompañamiento ni priorización, traslada a la familia una responsabilidad pedagógica de la institución.", false], ["B", "esperar al cierre del primer período para verificar si se adapta solo, antes de definir cualquier apoyo.", "Aplazar el apoyo desaprovecha la información del diagnóstico; la norma pide estrategias de apoyo oportunas para superar las debilidades.", false], ["C", "acordar con el estudiante y su familia metas concretas, actividades de apoyo y momentos de seguimiento.", "El artículo 11 del Decreto 1290 de 2009 asigna al establecimiento promover la interlocución con los padres y el estudiante para presentar el plan de actividades de apoyo y acordar compromisos de todos los involucrados.", true]]}]}, {"comp": "psicotecnica", "rol": "directivo", "tag": "Prueba psicotécnica · Competencias comportamentales (Guía 31, Decreto 1278 de 2002)", "texto": "Usted es rector de una institución educativa que hace dos años integró tres sedes que antes funcionaban como colegios independientes. Los docentes de cada sede conservan sus propias costumbres: celebran por separado, planean por separado y se refieren a las otras sedes como «los de allá». Los resultados de las pruebas Saber 9.° bajaron en lectura y matemáticas, y en la jornada pedagógica de inicio de año varios docentes expresan que «la integración fue una imposición» y que no se sienten parte de un mismo proyecto.", "items": [{"id": "DI-116", "niv": 1, "e": "Para fortalecer una identidad común entre las sedes, usted", "f": "MEN (2008). Guía 31, Anexo 1: Glosario de competencias (Liderazgo).", "o": [["A", "permite que cada sede conserve su propio plan de trabajo, para respetar sus tradiciones y evitar nuevas tensiones.", "Evita el conflicto a corto plazo, pero mantiene la fragmentación y renuncia a construir una visión institucional compartida, que es el núcleo del liderazgo directivo.", false], ["B", "organiza mesas de trabajo con docentes de las tres sedes para revisar juntos la misión, la visión y las metas del PEI.", "Corresponde al liderazgo: capacidad para motivar e involucrar a los miembros de la comunidad educativa con la construcción de una identidad común y el desarrollo de la visión institucional (Guía 31).", true], ["C", "redacta con los coordinadores una nueva visión institucional y la socializa en cada sede para agilizar el proceso.", "Es eficiente y bien intencionado, pero no involucra a los docentes en la construcción de la identidad común; socializar un producto terminado no genera compromiso con él.", false]]}, {"id": "DI-117", "niv": 2, "e": "Frente a la baja en los resultados de Saber 9.°, usted", "f": "MEN (2008). Guía 31, Anexo 1: Glosario de competencias (Orientación al logro).", "o": [["A", "propone metas de mejora por área con indicadores verificables y acuerda con los docentes un seguimiento periódico.", "Corresponde a la orientación al logro: dirigir el comportamiento hacia el cumplimiento de estándares elevados con miras al mejoramiento continuo y procurar que los estudiantes obtengan resultados de excelencia (Guía 31).", true], ["B", "solicita a la secretaría de educación que considere el proceso de integración al analizar los resultados de este año.", "Contextualizar los resultados puede ser válido, pero la acción se centra en justificarlos y no en dirigir el esfuerzo institucional hacia su mejoramiento.", false], ["C", "dispone que en el segundo semestre las clases de noveno se dediquen a resolver simulacros tipo Saber.", "Busca un resultado inmediato, pero sacrifica el plan de estudios y no actúa sobre las causas del bajo desempeño; no es una estrategia de mejoramiento continuo.", false]]}, {"id": "DI-118", "niv": 2, "e": "Cuando un docente afirma en la jornada que «la integración fue una imposición», usted", "f": "MEN (2008). Guía 31, Anexo 1: Glosario de competencias (Comunicación y relaciones interpersonales).", "o": [["A", "le explica que la integración fue una decisión de la secretaría de educación y que, por tanto, el tema no está en discusión en esta jornada.", "Es una respuesta veraz, pero cierra el diálogo y no reconoce el malestar del grupo; no favorece relaciones basadas en la confianza.", false], ["B", "le pide que guarde sus comentarios para el final, porque la agenda de la jornada ya fue aprobada.", "Prioriza el orden de la reunión sobre la comunicación; posterga un malestar que comparten varios docentes y transmite poca disposición a escuchar.", false], ["C", "reconoce el malestar, le pide que precise qué aspectos le afectan y propone tratarlos con representantes de cada sede.", "Corresponde a comunicación y relaciones interpersonales: escuchar con atención y comprender los puntos de vista de los demás, formular preguntas claras que aclaren la situación y manejar las emociones propias y ajenas (Guía 31).", true]]}, {"id": "DI-119", "niv": 1, "e": "Para que los docentes de las tres sedes compartan experiencias exitosas sin afectar las clases, usted", "f": "MEN (2008). Guía 31, Anexo 1: Glosario de competencias (Iniciativa).", "o": [["A", "solicita a la secretaría de educación que programe una capacitación sobre trabajo colaborativo dirigida a los docentes de todas las sedes.", "Puede ser útil, pero traslada a otros la solución y no aprovecha los recursos con que ya cuenta la institución; la iniciativa implica actuar con autonomía y recursividad.", false], ["B", "crea una red interna de práctica pedagógica que use las semanas de desarrollo institucional y un espacio virtual.", "Corresponde a la iniciativa: trabajar proactivamente, demostrar recursividad y flexibilidad, y proponer y desarrollar ideas o proyectos novedosos para la institución (Guía 31).", true], ["C", "espera a que la integración se consolide antes de promover intercambios, para no sobrecargar a los docentes.", "Es prudente en apariencia, pero renuncia a anticipar y a proponer soluciones; aplazar los intercambios prolonga el aislamiento entre sedes.", false]]}]}, {"comp": "psicotecnica", "rol": "directivo", "tag": "Prueba psicotécnica · Competencias comportamentales (Guía 31, Decreto 1278 de 2002)", "texto": "Usted es coordinador de convivencia de una institución educativa de Soacha. Dos docentes del área de ciencias naturales, que han trabajado juntos durante años, dejaron de hablarse después de una discusión por el uso del laboratorio: ambos lo programaron para las mismas horas y cada uno culpa al otro de no respetar el horario. La tensión ya se nota en las reuniones de área y los estudiantes empiezan a comentar el conflicto. El rector le pide que intervenga.", "items": [{"id": "DI-135", "niv": 1, "e": "Para comenzar a atender el conflicto, usted", "f": "MEN (2008). Guía 31, Anexo 1: Glosario de competencias (Negociación y mediación).", "o": [["A", "se reúne primero con cada docente por separado para comprender su versión, sus motivos y lo que espera del laboratorio.", "Corresponde a negociación y mediación: identificar y comprender las causas y el contexto de un conflicto, valorando con imparcialidad los motivos de los implicados, e intervenir oportunamente (Guía 31).", true], ["B", "asigna usted mismo los horarios del laboratorio y los comunica por escrito a ambos docentes, para cerrar la discusión de inmediato.", "Resuelve el cruce de horarios, pero impone una solución sin comprender las causas ni involucrar a las partes, por lo que la relación entre los docentes sigue deteriorada.", false], ["C", "deja pasar unas semanas para que los ánimos se calmen, ya que se trata de docentes con experiencia.", "Parece respetuoso, pero no es una intervención oportuna: el conflicto ya afecta al área y a los estudiantes.", false]]}, {"id": "DI-136", "niv": 2, "e": "En la reunión conjunta con los dos docentes, usted", "f": "MEN (2008). Guía 31, Anexo 1: Glosario de competencias (Negociación y mediación).", "o": [["A", "les presenta un horario de laboratorio que usted elaboró y les pide aceptarlo para cerrar el tema.", "Es eficiente y resuelve el cruce de horarios, pero no es participativo: impone una solución en lugar de facilitar un acuerdo que las partes asuman como propio.", false], ["B", "les propone construir juntos criterios para el uso del laboratorio que atiendan las necesidades de ambos grupos.", "Corresponde a negociación y mediación: facilitar acuerdos y soluciones multilaterales, anteponiendo los intereses comunes y generando confianza en el proceso de mediación (Guía 31).", true], ["C", "les pide que cada uno reconozca su error y se disculpe con el otro, para restablecer la relación.", "Busca la reconciliación, pero centra la reunión en culpas y no en los intereses de ambos; puede generar resistencia y no resuelve el uso del laboratorio.", false]]}, {"id": "DI-137", "niv": 3, "e": "Una vez los docentes llegan a un acuerdo sobre el uso del laboratorio, usted", "f": "MEN (2008). Guía 31, Anexo 1: Glosario de competencias (Negociación y mediación).", "o": [["A", "envía a ambos docentes el acuerdo por correo y les pide que le avisen si surge algún problema.", "Deja constancia del acuerdo, pero el seguimiento queda supeditado a que alguien reporte un problema; no hay una verificación planeada de los compromisos.", false], ["B", "informa el acuerdo al consejo directivo para que lo incorpore al manual de convivencia como una norma institucional de obligatorio cumplimiento.", "Formaliza el acuerdo, pero lo lleva a una instancia que no corresponde: un acuerdo operativo entre dos docentes no es materia del manual de convivencia, y no asegura el seguimiento con las partes.", false], ["C", "deja el acuerdo por escrito y programa con ellos una revisión al cabo de un mes para verificar cómo ha funcionado.", "Corresponde a negociación y mediación: promover soluciones duraderas y hacer seguimiento a los compromisos adquiridos por las partes (Guía 31).", true]]}, {"id": "DI-138", "niv": 2, "e": "Al notar que los estudiantes comentan el conflicto entre los dos docentes, usted", "f": "MEN (2008). Guía 31, Anexo 1: Glosario de competencias (Negociación y mediación).", "o": [["A", "pide a los directores de grupo que prohíban a los estudiantes hablar del tema durante las clases y en los descansos.", "Busca proteger a los docentes, pero una prohibición no forma ni aprovecha la situación pedagógicamente; además, suele aumentar los comentarios.", false], ["B", "pide a los docentes manejar el desacuerdo con profesionalismo y trabaja con los grupos el manejo pacífico de conflictos, sin exponer el caso.", "Corresponde a negociación y mediación, cuya conducta asociada incluye formar a los estudiantes en estrategias de resolución pacífica de conflictos (Guía 31); además, pedir profesionalismo a los docentes protege a los estudiantes del conflicto sin vulnerar la intimidad de los implicados.", true], ["C", "explica en los grupos de once lo que ocurrió entre los dos docentes, para evitar que sigan circulando rumores sobre el caso.", "Intenta frenar rumores, pero expone a los docentes ante los estudiantes y no respeta la confidenci
