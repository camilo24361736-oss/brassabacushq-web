solo admite sanciones pedagógicas no pecuniarias, previstas en el manual y con derecho de defensa.", "El artículo 4 de la Ley 2025 de 2020 permite a las instituciones implementar únicamente sanciones pedagógicas no pecuniarias por inasistencia, siempre que estén estipuladas en el manual de convivencia, se respete el derecho de defensa y su incorporación esté definida en el PEI.", true], ["C", "procede si el consejo directivo aprueba el valor de la multa y su destinación en el presupuesto anual.", "El consejo directivo aprueba el presupuesto de los recursos propios, pero no puede crear una sanción pecuniaria que la Ley 2025 excluye expresamente.", false]]}, {"id": "NR-126", "niv": 3, "e": "Una madre no asistió a una sesión de la escuela de padres porque su empleador le negó el permiso. De acuerdo con la Ley 2025 de 2020, esta inasistencia", "f": "Ley 2025 de 2020, artículo 4, parágrafo.", "o": [["A", "constituye una justa causa, por lo que no procede la sanción pedagógica prevista en el manual.", "El parágrafo del artículo 4 de la Ley 2025 de 2020 reconoce como justas causas de inasistencia el caso fortuito, la fuerza mayor y la negativa del empleador a dar permiso al trabajador para asistir.", true], ["B", "no constituye justa causa, porque el compromiso firmado en la matrícula prevalece sobre la relación laboral.", "El compromiso de asistir no elimina las justas causas que la misma ley prevé; la negativa del empleador está reconocida en el parágrafo del artículo 4.", false], ["C", "no constituye justa causa, porque la ley solo reconoce la enfermedad grave y la calamidad doméstica.", "La ley no limita las justas causas a esos eventos; incluye de forma expresa la negativa del empleador, además del caso fortuito y la fuerza mayor.", false]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Prevención del abuso sexual (Ley 1146 de 2007)", "texto": "Laura, estudiante de octavo grado de una institución oficial de Cúcuta, se queda al final de la clase y le cuenta a usted, su directora de grupo, que un vecino adulto la ha tocado de forma inapropiada en varias ocasiones cuando ella regresa a casa. Le pide que no le cuente a nadie porque tiene miedo. Un colega que se entera le dice a usted que «eso pasó fuera del colegio y no nos corresponde», y que en todo caso es mejor esperar a que la familia decida qué hacer.", "items": [{"id": "NR-156", "niv": 1, "e": "Frente a lo que Laura le contó, según la Ley 1146 de 2007, usted", "f": "Ley 1146 de 2007, artículo 12.", "o": [["A", "debe denunciarlo solo si Laura acepta formalizar la denuncia y firmar una declaración.", "La obligación del docente no depende del consentimiento de la estudiante; se activa con el conocimiento de una conducta o de un indicio de abuso. La intimidad se protege con la reserva de la información, no con el silencio.", false], ["B", "debe informar a la familia para que sea ella la que decida si acude a las autoridades.", "Informar a la familia puede ser parte del protocolo, pero no reemplaza la obligación legal propia del docente de denunciar (artículo 12).", false], ["C", "está obligada a denunciarlo ante las autoridades competentes, aunque solo tenga indicios del abuso.", "El artículo 12 de la Ley 1146 de 2007 establece que el docente está obligado a denunciar ante las autoridades administrativas y judiciales competentes toda conducta o indicio de violencia o abuso sexual contra niños, niñas y adolescentes del que tenga conocimiento.", true]]}, {"id": "NR-157", "niv": 2, "e": "En cuanto al plazo, la Ley 1146 de 2007 establece que el deber de denunciar debe cumplirse", "f": "Ley 1146 de 2007, artículo 15; Decreto 1965 de 2013, artículo 44.", "o": [["A", "una vez concluya la indagación interna del comité escolar de convivencia.", "Esperar una indagación interna retrasa la denuncia más allá de las 24 horas que fija la ley; además, ante un presunto delito sexual el protocolo exige informar de inmediato a la Policía (Decreto 1965 de 2013, artículo 44).", false], ["B", "dentro de los cinco días hábiles siguientes, una vez reunidas las pruebas.", "La ley fija un plazo de 24 horas y no exige reunir pruebas: basta denunciar los indicios; investigar corresponde a las autoridades.", false], ["C", "dentro de las 24 horas siguientes al conocimiento del hecho.", "El artículo 15 de la Ley 1146 de 2007 establece que el Estado y la sociedad tienen el deber de denunciar oportunamente a las autoridades competentes cualquier indicio o caso de abuso sexual contra niños, niñas y adolescentes dentro de las 24 horas siguientes al conocimiento del hecho.", true]]}, {"id": "NR-158", "niv": 2, "e": "Frente al argumento del colega de que los hechos ocurrieron fuera del colegio, usted responde que la Ley 1146 de 2007", "f": "Ley 1146 de 2007, artículos 11 y 12.", "o": [["A", "ordena a las instituciones contribuir a la detección y denuncia del abuso que sufran los estudiantes dentro y fuera de ellas.", "El artículo 11 de la Ley 1146 de 2007 obliga a los establecimientos de básica y media a incluir elementos que contribuyan a la identificación temprana, prevención, autoprotección, detección y denuncia del abuso sexual del que puedan ser víctimas los educandos, dentro y fuera de los establecimientos educativos.", true], ["B", "asigna estos casos exclusivamente al orientador escolar, quien decide si se reportan o no.", "El deber de denunciar recae en el docente que conoce el hecho (artículo 12); no se delega en el orientador ni queda sujeto a su criterio.", false], ["C", "limita la responsabilidad del colegio a los hechos ocurridos durante la jornada y en sus instalaciones.", "La ley extiende de forma expresa la detección y la denuncia a los hechos que ocurran fuera de los establecimientos educativos (artículo 11).", false]]}, {"id": "NR-159", "niv": 3, "e": "Al planear acciones de prevención, usted tiene en cuenta que la Ley 1146 de 2007 exige incluir una cátedra de educación para la sexualidad, con énfasis en la dignidad y los derechos del menor, en", "f": "Ley 1146 de 2007, artículo 14; Ley 115 de 1994, artículo 14.", "o": [["A", "los programas de formación de padres, en lugar de la educación sexual de los estudiantes.", "La cátedra se dirige a los estudiantes de media y superior; la escuela de padres (Ley 2025 de 2020) complementa, pero no sustituye, la formación de los estudiantes.", false], ["B", "los programas de estudio de los establecimientos de educación media y superior.", "El artículo 14 de la Ley 1146 de 2007 dispone que los establecimientos de educación media y superior deberán incluir en sus programas de estudio una cátedra de educación para la sexualidad, con especial énfasis en el respeto a la dignidad y a los derechos del menor.", true], ["C", "los programas de preescolar y básica primaria, como parte del área de ciencias naturales.", "La ley ubica esta cátedra en la educación media y superior; en preescolar y básica la educación sexual se trabaja como enseñanza obligatoria transversal (Ley 115 de 1994, artículo 14).", false]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Función docente y principios de la evaluación (Decreto 1278 de 2002)", "texto": "En la primera reunión de profesores del año, en una institución oficial de Manizales, el rector presenta el cronograma: atención a padres de familia los miércoles en la tarde, dirección de grupo, reuniones por área y jornadas de planeación. Un docente nuevo pregunta si atender a los padres hace parte de sus funciones o si es tarea del orientador. Otro colega se queja de que en la evaluación de desempeño se tengan en cuenta encuestas a estudiantes y padres, porque, según él, «solo el rector debería evaluar».", "items": [{"id": "NR-180", "niv": 1, "e": "A la pregunta sobre la atención a padres, usted responde que, según el Decreto 1278 de 2002, esta actividad", "f": "Decreto 1278 de 2002, artículo 5.", "o": [["A", "solo es obligatoria si se reconoce como horas extra por fuera de la jornada laboral.", "El artículo 5 incluye la atención a los padres de familia y acudientes entre las responsabilidades propias del docente; no la presenta como una actividad adicional sujeta a pago de horas extra.", false], ["B", "hace parte de las actividades curriculares no lectivas complementarias de la función docente.", "El artículo 5 del Decreto 1278 de 2002 señala que los docentes son responsables de las actividades curriculares no lectivas complementarias de la función docente de aula, entre ellas la atención a los padres de familia y acudientes, la dirección de grupo y las reuniones de profesores.", true], ["C", "es una función exclusiva del orientador escolar, que no les corresponde a los docentes de aula.", "El servicio de orientación estudiantil y la atención a padres figuran en el artículo 5 como responsabilidades de los docentes; el orientador apoya, pero no asume en exclusiva esta labor.", false]]}, {"id": "NR-181", "niv": 2, "e": "Al explicar al docente nuevo en qué consiste la función docente, usted señala que, según el Decreto 1278 de 2002, esta", "f": "Decreto 1278 de 2002, artículos 4 y 6.", "o": [["A", "se centra en administrar la organización escolar, y la enseñanza directa es una actividad complementaria.", "El artículo 4 pone en el centro la realización directa de los procesos de enseñanza-aprendizaje; las actividades de dirección, planeación y administración relacionadas con el proceso educativo la complementan, pero no la sustituyen.", false], ["B", "se limita a la enseñanza de los contenidos del plan de estudios, mientras la evaluación le corresponde al consejo académico.", "La evaluación hace parte de la función docente según el artículo 4; el consejo académico supervisa el proceso general de evaluación, pero no sustituye al docente.", false], ["C", "implica realizar directamente los procesos de enseñanza y aprendizaje, incluidos su diagnóstico, planificación, ejecución y evaluación.", "El artículo 4 del Decreto 1278 de 2002 define la función docente como la de carácter profesional que implica la realización directa de los procesos sistemáticos de enseñanza-aprendizaje, lo cual incluye el diagnóstico, la planificación, la ejecución y la evaluación de los mismos procesos y sus resultados, en el marco del PEI.", true]]}, {"id": "NR-182", "niv": 3, "e": "Frente a la queja del colega sobre las encuestas, usted explica que su uso se sustenta en el principio de evaluación denominado", "f": "Decreto 1278 de 2002, artículos 29 y 33.", "o": [["A", "participación, que prevé que distintos actores, incluidos padres y estudiantes, intervengan en la evaluación de desempeño.", "El literal f) del artículo 29 del Decreto 1278 de 2002 define el principio de participación: en la evaluación de desempeño participan distintos actores, incluidos las autoridades educativas, los superiores, los colegas, el consejo directivo, los padres de familia y los estudiantes. El artículo 33 incluye las encuestas a padres y estudiantes entre los instrumentos.", true], ["B", "universalidad, que obliga a aplicar las mismas encuestas en todas las instituciones del país.", "La universalidad (literal c) se refiere a la analogía de criterios de evaluación para funciones equivalentes, sin perjuicio de las especificidades; no exige encuestas idénticas en todo el país.", false], ["C", "objetividad, que exige que solo el superior inmediato califique, para evitar criterios subjetivos.", "La objetividad (literal a) significa prescindir de criterios subjetivos en las calificaciones; no restringe la evaluación al superior inmediato.", false]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Planeación curricular con Estándares Básicos de Competencias y DBA", "texto": "Usted inicia su primer año como docente de matemáticas de cuarto grado en una institución urbana de Bucaramanga. El coordinador académico le pide entregar, en tres semanas, la planeación del primer período articulada con los referentes de calidad del Ministerio de Educación Nacional. Al revisar el plan de área heredado, usted encuentra que el 80 % de las clases del período se dedican a algoritmos de suma, resta y multiplicación con números naturales, y que la única evaluación prevista es una prueba de operaciones. Sin embargo, el propósito escrito de la unidad dice: «resolver problemas de proporcionalidad en situaciones cotidianas». Una colega le sugiere, para ahorrar tiempo, copiar como plan de área la lista de Derechos Básicos de Aprendizaje (DBA) de cuarto grado.", "items": [{"id": "PD-101", "niv": 1, "e": "Para identificar qué estándares orientan la planeación de cuarto grado, usted debe", "f": "MEN (2006). Estándares Básicos de Competencias en Lenguaje, Matemáticas, Ciencias y Ciudadanas: introducción general (organización por grupos de grados).", "o": [["A", "consultar los estándares del grupo de cuarto a quinto y acordar con el área cómo distribuirlos entre ambos grados.", "Los Estándares Básicos de Competencias especifican el nivel de calidad esperado por grupos de grados (1.° a 3.°, 4.° a 5.°, 6.° a 7.°, 8.° a 9.° y 10.° a 11.°). Por eso la institución decide cómo se distribuyen y gradúan entre cuarto y quinto.", true], ["B", "consultar los estándares de primero a tercero, porque indican lo que debe dominarse antes de iniciar cuarto.", "Los estándares de 1.° a 3.° sirven para reconocer los aprendizajes previos, pero los que orientan la planeación de cuarto son los del grupo 4.° a 5.°, que fijan la meta de calidad para esos dos grados.", false], ["C", "consultar los estándares específicos de cuarto grado, que el MEN formula para cada grado de la básica primaria por separado.", "Los estándares no se formulan grado por grado sino por grupos de grados; son los DBA los que se presentan por grado. Buscar estándares exclusivos de cuarto parte de un error sobre la estructura del documento.", false]]}, {"id": "PD-102", "niv": 2, "e": "Ante la sugerencia de la colega sobre los DBA, usted le explica que", "f": "MEN (2016). Derechos Básicos de Aprendizaje V2, Matemáticas: presentación; Ley 115 de 1994, artículos 77 y 78.", "o": [["A", "los DBA rigen solo para transición y primero, de modo que en cuarto grado el plan se construye únicamente con los estándares.", "Hay DBA para varios grados de la básica y la media (por ejemplo, en lenguaje y matemáticas de primero a once), no solo para los primeros grados, de modo que también son un referente válido en cuarto.", false], ["B", "los DBA reemplazaron a los estándares, así que copiarlos como plan de área es suficiente para cumplir con los referentes del MEN y del PEI.", "Los DBA no derogan ni reemplazan los estándares; se construyeron en coherencia con ellos y con los lineamientos. Copiarlos como plan de área omite la metodología, la evaluación y el contexto que exige el PEI.", false], ["C", "los DBA señalan aprendizajes estructurantes del grado, pero deben articularse con el enfoque, la metodología y el contexto que define el PEI.", "El MEN presenta los DBA como aprendizajes estructurantes por grado, coherentes con los lineamientos y los estándares, y advierte que por sí solos no constituyen una propuesta curricular: se articulan con los enfoques, metodologías y contextos de cada institución, en el marco del PEI y los planes de área y de aula.", true]]}, {"id": "PD-103", "niv": 2, "e": "Al revisar el énfasis del plan heredado a la luz de los estándares de matemáticas, lo pertinente es", "f": "MEN (2006). Estándares Básicos de Competencias en Lenguaje, Matemáticas, Ciencias y Ciudadanas: Estándares de Matemáticas (los cinco tipos de pensamiento).", "o": [["A", "dedicar un período completo a cada tipo de pensamiento, trabajándolos por separado para no mezclar procesos.", "Los estándares proponen relacionar los pensamientos entre sí y con los procesos generales (resolver problemas, modelar, comunicar, razonar), no tratarlos como bloques aislados que se suceden sin conexión.", false], ["B", "incluir situaciones de los pensamientos espacial, métrico, aleatorio y variacional, relacionándolas con el numérico.", "Los Estándares Básicos de Competencias en Matemáticas organizan el área en cinco tipos de pensamiento (numérico, espacial, métrico, aleatorio y variacional) que deben desarrollarse de manera articulada, junto con los procesos generales de la actividad matemática.", true], ["C", "mantener el énfasis en operaciones, porque el pensamiento numérico es el que los estándares priorizan en la básica primaria.", "Los estándares no reducen la primaria al pensamiento numérico: proponen desarrollar cinco tipos de pensamiento en todos los grupos de grados. Dedicar el 80 % del tiempo a algoritmos deja por fuera la mayor parte de ellos.", false]]}, {"id": "PD-104", "niv": 3, "e": "Para que la evaluación de la unidad sea coherente con el propósito que está escrito en ella, usted debe", "f": "Wiggins, G. y McTighe, J. (2005). Understanding by Design (diseño inverso); MEN (2009). Documento No. 11: Fundamentaciones y orientaciones para la implementación del Decreto 1290 de 2009 (coherencia entre enseñanza y evaluación).", "o": [["A", "aumentar el número de ejercicios de la prueba actual para obtener más evidencia del desempeño de cada estudiante.", "Más ejercicios del mismo tipo producen más evidencia sobre los algoritmos, no sobre la resolución de problemas de proporcionalidad. El problema es de validez (qué se evalúa), no de cantidad.", false], ["B", "plantear situaciones cotidianas en las que los estudiantes usen la proporcionalidad y expliquen su razonamiento.", "Si el propósito es resolver problemas de proporcionalidad en contexto, la evidencia válida debe exigir justamente eso. Planear desde los resultados esperados hacia la evidencia (diseño inverso, Wiggins y McTighe) y la coherencia entre enseñanza y evaluación que pide el Documento No. 11 del MEN llevan a esta decisión.", true], ["C", "mantener la prueba de operaciones, pues dominar los algoritmos garantiza que el estudiante resolverá los problemas.", "Dominar algoritmos es necesario, pero no garantiza que el estudiante reconozca cuándo una situación es proporcional ni que modele el problema. La prueba de operaciones no aporta evidencia sobre el propósito declarado.", false]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Proyectos pedagógicos transversales (Ley 115 de 1994, art. 14)", "texto": "En una institución de Neiva, el consejo académico revisa cómo se cumplen las enseñanzas obligatorias del artículo 14 de la Ley 115 de 1994. Usted coordina el equipo del proyecto ambiental y el de educación para la sexualidad. En la reunión, el rector propone crear una asignatura de «Educación ambiental» con una hora semanal en todos los grados. Otra docente sugiere que la educación para la sexualidad se resuelva con una charla anual de una entidad de salud. El equipo debe presentar una propuesta para el próximo año, teniendo en cuenta que el río que abastece al municipio presenta problemas de contaminación y que en el último año aumentaron los casos de embarazo adolescente en la institución.", "items": [{"id": "PD-136", "niv": 1, "e": "Sobre la propuesta del rector, usted aporta que, según la Ley 115 de 1994, la educación ambiental", "f": "Ley 115 de 1994, artículo 14, literal c) y parágrafo 1.", "o": [["A", "no exige asignatura específica y debe incorporarse al currículo a través de todo el plan de estudios.", "Según el parágrafo 1 del artículo 14 de la Ley 115, el estudio de estos temas, salvo los literales a) y b), no exige asignatura específica; esta formación debe incorporarse al currículo y desarrollarse a través de todo el plan de estudios.", true], ["B", "es obligatoria solo en la educación media, por lo que la asignatura no se requeriría en preescolar ni en básica.", "El artículo 14 establece estas enseñanzas como obligatorias en los niveles de preescolar, básica y media, no solo en la media.", false], ["C", "exige una asignatura específica con una intensidad mínima de una hora semanal en todos los grados.", "El parágrafo 1 del artículo 14 dispone lo contrario: salvo los literales a) y b), estas enseñanzas no exigen asignatura específica ni fijan una intensidad mínima.", false]]}, {"id": "PD-137", "niv": 2, "e": "Respecto a la educación para la sexualidad, la reglamentación establece que estas enseñanzas se desarrollan mediante", "f": "Decreto 1860 de 1994, artículo 36 (compilado en el Decreto 1075 de 2015); Ley 115 de 1994, artículo 14, literal e).", "o": [["A", "talleres extracurriculares voluntarios, realizados fuera de la jornada escolar para no afectar el plan de estudios.", "Un taller voluntario por fuera de la jornada no garantiza la formación obligatoria del artículo 14 ni está integrado al plan de estudios, como lo exige el Decreto 1860.", false], ["B", "charlas periódicas de entidades externas especializadas, que reemplazan el trabajo pedagógico del aula.", "El apoyo de entidades de salud puede complementar, pero la norma no prevé que una charla sustituya la formación, que debe estar dentro del plan de estudios.", false], ["C", "proyectos pedagógicos dentro del plan de estudios, que ejerciten a los estudiantes en problemas de su entorno.", "El artículo 36 del Decreto 1860 de 1994 dispone que la enseñanza prevista en el artículo 14 de la Ley 115 se cumple bajo la modalidad de proyectos pedagógicos: actividades dentro del plan de estudios que ejercitan al educando en la solución de problemas cotidianos relacionados con su entorno.", true]]}, {"id": "PD-138", "niv": 2, "e": "La intensidad horaria y la duración de cada proyecto pedagógico se definen en", "f": "Decreto 1860 de 1994, artículo 36.", "o": [["A", "una resolución anual de la secretaría de educación, aplicable a todas las instituciones de la entidad territorial.", "La norma no asigna esa definición a la secretaría de educación; corresponde al establecimiento en el marco de su autonomía.", false], ["B", "la Ley 115 de 1994, que fija el número de horas de cada una de las enseñanzas obligatorias.", "La Ley 115 establece las enseñanzas obligatorias, pero no fija su intensidad horaria; esa decisión se deja a cada institución.", false], ["C", "el plan de estudios que adopta la propia institución educativa.", "El artículo 36 del Decreto 1860 de 1994 establece que la intensidad horaria y la duración de los proyectos pedagógicos se definen en el respectivo plan de estudios.", true]]}, {"id": "PD-139", "niv": 3, "e": "De las siguientes propuestas para el proyecto ambiental, la que mejor expresa su carácter transversal es", "f": "Ley 115 de 1994, artículo 14, parágrafo 1; Decreto 1860 de 1994, artículo 36.", "o": [["A", "que el docente de ciencias naturales asuma el proyecto completo, por ser el área más afín a la temática ambiental.", "Concentrar el proyecto en un área desconoce que el artículo 14 pide desarrollar esta formación a través de todo el plan de estudios; el proyecto deja de ser transversal.", false], ["B", "que matemáticas analice datos de calidad del agua del río, sociales estudie sus usos y lenguaje produzca una campaña, con metas comunes.", "La transversalidad implica que varias áreas aporten desde sus saberes a un problema real del entorno con propósitos compartidos; el artículo 36 del Decreto 1860 señala que el proyecto integra y hace activos los aprendizajes de diversas áreas.", true], ["C", "que cada área realice por su cuenta una actividad alusiva al Día del Agua, sin coordinarse con las demás.", "Actividades aisladas y puntuales no constituyen un proyecto pedagógico: carecen de planeación conjunta, de continuidad y de metas compartidas en torno al problema del entorno.", false]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Planeación de la clase y formulación de propósitos", "texto": "Usted es docente de lengua castellana de sexto grado en una institución de Pereira. La evaluación diagnóstica de inicio de año muestra tres situaciones en su grupo: un tercio de los estudiantes identifica sin dificultad la estructura de los textos informativos, otro tercio la reconoce con ayuda y el resto aún confunde los textos informativos con los narrativos. El coordinador le pide entregar la planeación de la primera unidad con propósitos de aprendizaje claros y verificables. En el formato que le entregaron hay espacios para el inicio, el desarrollo y el cierre de cada sesión.", "items": [{"id": "PD-176", "niv": 1, "e": "De las siguientes formulaciones, la que expresa mejor un propósito de aprendizaje claro y verificable es", "f": "Wiggins, G. y McTighe, J. (2005). Understanding by Design; MEN (2006). Estándares Básicos de Competencias en Lenguaje, Matemáticas, Ciencias y Ciudadanas (estándares de lenguaje).", "o": [["A", "«Comparar la estructura de dos textos informativos usando ejemplos tomados de su entorno cercano».", "Un propósito verificable describe lo que el estudiante hará con el conocimiento mediante una acción observable (comparar), un objeto (la estructura de textos informativos) y un contexto; así orienta la enseñanza y la evaluación.", true], ["B", "«Que el docente explique los tipos de texto informativo con ejemplos y ejercicios en el tablero».", "Describe una acción del docente, no un aprendizaje del estudiante; la planeación debe expresar lo que se espera que los estudiantes logren.", false], ["C", "«Conocer los textos informativos y su importancia en la vida cotidiana de los estudiantes».", "«Conocer» es un verbo amplio que no indica qué hará el estudiante para demostrar el aprendizaje; resulta difícil verificar si se alcanzó.", false]]}, {"id": "PD-177", "niv": 2, "e": "En el inicio de cada sesión, además de activar los saberes previos, es recomendable", "f": "Black, P. y Wiliam, D. (1998). Inside the black box; Decreto 1290 de 2009, artículo 12.", "o": [["A", "dictar el contenido completo de la sesión, para ganar tiempo durante el momento de desarrollo.", "Dictar todo al inicio convierte la sesión en transmisión de información y reduce el tiempo de práctica y construcción, que es el sentido del momento de desarrollo.", false], ["B", "comunicar a los estudiantes el propósito de aprendizaje y cómo sabrán si lo alcanzaron.", "Compartir el propósito y los criterios de logro al iniciar ayuda a los estudiantes a orientar su esfuerzo y a autoevaluarse; es una práctica central de la evaluación formativa.", true], ["C", "entregar la evaluación de la sesión para que los estudiantes la resuelvan mientras usted explica el tema.", "Evaluar mientras se explica impide que los estudiantes atiendan y practiquen; la evaluación tiene sentido después de haber tenido oportunidad de aprender.", false]]}, {"id": "PD-178", "niv": 3, "e": "Con base en los resultados de la evaluación diagnóstica, la planeación más pertinente es", "f": "Decreto 1290 de 2009, artículo 3, numeral 3; MEN (2009). Documento No. 11: Fundamentaciones y orientaciones para la implementación del Decreto 1290 de 2009.", "o": [["A", "tres planeaciones independientes, con metas distintas para cada subgrupo que se mantengan todo el año.", "Fijar metas diferentes y permanentes para cada subgrupo crea trayectorias desiguales y limita las expectativas de quienes empiezan con menos dominio.", false], ["B", "la planeación del grado tal como está diseñada, y dejar los apoyos para las actividades de recuperación.", "Ignorar el diagnóstico y aplazar los apoyos hasta la recuperación desaprovecha la información recogida y permite que las dificultades se acumulen.", false], ["C", "una secuencia con un propósito común y tareas con distintos niveles de apoyo y desafío según el diagnóstico.", "Mantener una meta común para todos y diferenciar el apoyo y el desafío permite que cada estudiante avance desde su punto de partida; es coherente con el propósito del Decreto 1290 de apoyar tanto las debilidades como los desempeños superiores.", true]]}]}, {"comp": "psicotecnica", "rol": "docente", "tag": "Prueba psicotécnica · Trabajo en equipo", "texto": "Usted acaba de llegar como docente de ciencias naturales a un colegio de Barranquilla. La coordinación le asigna, junto con una docente de lenguaje que lleva doce años en la institución y un docente de ciencias sociales, el diseño de un proyecto interdisciplinario para noveno sobre el manejo del agua en el barrio. El equipo tiene un mes para entregar la guía del proyecto y su rúbrica de evaluación, y luego cada docente orientará el trabajo con los estudiantes en sus clases.", "items": [{"id": "PS-108", "niv": 1, "e": "En la primera reunión, la docente de lenguaje propone que el producto final sea un ensayo argumentativo. Usted pensaba en un informe de laboratorio. Usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Trabajo en equipo).", "o": [["A", "reconoce lo que aporta el ensayo y propone que los estudiantes lo argumenten con datos de un análisis de laboratorio.", "Evidencia trabajo en equipo (Guía 31): «aporta sugerencias, ideas y opiniones» y «considera las contribuciones de los demás en la toma de decisiones», integrando ambas propuestas en un objetivo compartido.", true], ["B", "acepta la propuesta sin comentarios, porque la colega conoce mejor la institución y a los estudiantes.", "Deferir a la experiencia de otro parece respetuoso, pero el equipo pierde su aporte disciplinar. La Guía 31 señala que en el trabajo en equipo el docente «aporta sugerencias, ideas y opiniones».", false], ["C", "presenta datos que muestran que el informe de laboratorio desarrolla mejor las competencias científicas que un ensayo.", "Argumentar con datos es valioso, pero plantea la reunión como una competencia entre propuestas y no construye sobre el aporte de la colega. No se evidencia la consideración de las contribuciones de los demás.", false]]}, {"id": "PS-109", "niv": 3, "e": "El coordinador revisa la rúbrica que el equipo diseñó y comenta que es demasiado extensa para aplicarla en el aula. Usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Trabajo en equipo).", "o": [["A", "reduce usted mismo la rúbrica esa noche y la entrega corregida al día siguiente, para no quitarle tiempo al equipo.", "Acepta la crítica y actúa con diligencia, pero modifica solo un producto que es del equipo y deja por fuera las decisiones de sus colegas. El trabajo en equipo exige considerar las contribuciones de los demás, no solo responder rápido.", false], ["B", "lleva la observación al equipo, revisan juntos qué criterios pueden integrarse y ajustan la rúbrica antes de aplicarla.", "Corresponde al trabajo en equipo (Guía 31): «acepta críticas constructivas y actúa en consecuencia» y lo hace con el equipo, considerando las contribuciones de los demás en la toma de decisiones sobre un producto compartido.", true], ["C", "explica al coordinador las razones de cada criterio, para que comprenda por qué la rúbrica quedó tan extensa.", "Justificar el trabajo es legítimo, pero responde a la crítica defendiéndose en lugar de evaluarla. La Guía 31 incluye en el trabajo en equipo que el docente «acepta críticas constructivas y actúa en consecuencia».", false]]}, {"id": "PS-110", "niv": 2, "e": "Faltan tres días para iniciar el proyecto con los estudiantes y el docente de sociales aún no entrega su parte de la guía. Usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Trabajo en equipo).", "o": [["A", "le pregunta qué le ha impedido avanzar y le ofrece un apoyo concreto para que pueda terminar a tiempo su parte.", "Evidencia trabajo en equipo (Guía 31): «ofrece apoyo para el trabajo de otros» y establece relaciones profesionales que potencian el logro de la meta del equipo, sin desplazar al colega de su responsabilidad.", true], ["B", "informa a la coordinadora del retraso, para que ella le recuerde al docente el compromiso adquirido con el equipo.", "Acudir a la coordinación puede ser necesario si el problema persiste, pero como primera respuesta traslada a la autoridad algo que el equipo puede resolver. No evidencia el apoyo entre pares que describe la competencia.", false], ["C", "redacta la parte faltante con material de sociales que encuentre, para no retrasar el inicio del proyecto.", "Asumir la tarea de otro asegura el plazo, pero excluye al colega de su propia responsabilidad y su saber disciplinar. El trabajo en equipo implica construir relaciones de colaboración, no sustituir a los demás.", false]]}]}, {"comp": "psicotecnica", "rol": "docente", "tag": "Prueba psicotécnica · Orientación al logro", "texto": "Usted es docente de cuarto de primaria en un colegio oficial de Cali. En la prueba diagnóstica de lectura aplicada al inicio del año, el 60 % de su grupo quedó en nivel bajo de comprensión lectora: los estudiantes localizan información explícita, pero tienen dificultad para inferir y para identificar la idea principal de un texto. El grupo tiene 38 estudiantes, varios con ritmos de aprendizaje distintos, y la institución definió como prioridad del plan de mejoramiento elevar la comprensión lectora en primaria.", "items": [{"id": "PS-122", "niv": 1, "e": "Al conocer los resultados de la prueba diagnóstica, usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Orientación al logro).", "o": [["A", "comparte los resultados con las familias y les pide reforzar la lectura en casa durante todo el período.", "Vincular a las familias es valioso, pero aquí se usa para trasladarles la responsabilidad del avance sin que el docente ajuste su propia práctica. No refleja el compromiso propio con estándares elevados que define la competencia.", false], ["B", "los atribuye a que la prueba se aplicó en una semana con muchas interrupciones y espera la siguiente aplicación para confirmarlos.", "Atribuir el resultado a factores externos evita asumirlo como un reto propio y retrasa la acción. La orientación al logro implica dirigir el comportamiento propio hacia estándares elevados, con miras al mejoramiento continuo.", false], ["C", "se fija metas concretas de mejora para el grupo en el período y ajusta su plan de lectura para alcanzarlas.", "Evidencia orientación al logro (Guía 31): «capacidad para dirigir el comportamiento propio hacia el cumplimiento de estándares elevados, con miras al mejoramiento continuo»; el docente «tiene metas [...] profesionales elevadas» y organiza su trabajo para alcanzarlas.", true]]}, {"id": "PS-123", "niv": 2, "e": "Seis semanas después, el avance es menor al esperado y un colega le comenta que «con ese grupo no se puede hacer más». Usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Orientación al logro).", "o": [["A", "reduce la meta a un nivel más realista para que el grupo no se desmotive con los resultados.", "Busca proteger la motivación, pero renuncia al estándar elevado ante el primer obstáculo. La Guía 31 describe la competencia como esfuerzo y persistencia «afrontando obstáculos y situaciones difíciles».", false], ["B", "revisa en sus registros qué estrategias dieron resultado, cambia las que no y mantiene la meta acordada.", "Corresponde a orientación al logro (Guía 31): «demuestra esfuerzo y persistencia en la consecución de sus objetivos, afrontando obstáculos y situaciones difíciles», con un ajuste basado en evidencias que apunta al mejoramiento continuo.", true], ["C", "intensifica las actividades de lectura que venía haciendo y aumenta el tiempo diario dedicado a ellas.", "Muestra esfuerzo, pero repite más de lo mismo sin analizar por qué no funcionó. La orientación al logro se dirige al mejoramiento continuo, lo que implica revisar y ajustar las estrategias, no solo aumentar su dosis.", false]]}, {"id": "PS-124", "niv": 3, "e": "Una estudiante del grupo comprende los textos con facilidad, termina rápido las actividades y empieza a distraerse. Usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Orientación al logro).", "o": [["A", "reconoce su desempeño con la máxima nota y le permite leer libremente lo que desee mientras sus compañeros terminan.", "Reconocer el desempeño es positivo, pero la lectura libre sin propósito no le plantea un nuevo nivel de exigencia. No evidencia la búsqueda de estándares elevados para cada estudiante.", false], ["B", "le asigna como tarea permanente apoyar a los compañeros con más dificultades mientras el resto termina.", "La tutoría entre pares es valiosa de manera ocasional, pero como respuesta permanente posterga los retos de aprendizaje de la estudiante. La orientación al logro procura que todos los estudiantes, incluidos los sobresalientes, obtengan resultados de excelencia.", false], ["C", "le propone retos de lectura más complejos según sus intereses y la invita a escribir sus propios textos.", "Evidencia orientación al logro (Guía 31): el docente «procura que los estudiantes de la institución obtengan resultados de excelencia», también los de desempeño sobresaliente, con metas que les exigen avanzar.", true]]}, {"id": "PS-125", "niv": 2, "e": "Para que mejorar la comprensión lectora se convierta en un propósito de todos los docentes de primaria, usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Liderazgo).", "o": [["A", "presenta en la reunión de docentes sus avances y estrategias, e invita a sus colegas a plantear una meta común de lectura.", "Corresponde al liderazgo (Guía 31): «influye positivamente en el comportamiento de los demás y logra que se comprometan con el logro de metas comunes» y transmite con sus acciones la prioridad institucional del plan de mejoramiento.", true], ["B", "continúa con su estrategia en su grupo y espera a que los resultados convenzan por sí solos a los demás docentes.", "Dar ejemplo es importante, pero esperar pasivamente desaprovecha la oportunidad de movilizar al equipo hacia una prioridad institucional. El liderazgo implica motivar e involucrar activamente a los demás.", false], ["C", "propone a la coordinación que exija a todos los docentes aplicar su plan de lectura en sus grupos.", "Generalizar lo que funciona es buena idea, pero hacerlo por imposición no logra el compromiso de los colegas. El liderazgo, según la Guía 31, consiste en motivar e involucrar a los demás con la visión institucional.", false]]}]}, {"comp": "psicotecnica", "rol": "docente", "tag": "Prueba psicotécnica · Liderazgo", "texto": "Usted es docente de preescolar en una sede de una institución etnoeducativa en un resguardo nasa del norte del Cauca. Llegó este año y no habla nasa yuwe. El proyecto educativo comunitario (PEC), construido con las autoridades tradicionales, establece que en la educación inicial se fortalezcan la lengua y las prácticas culturales propias junto con el español. Varias familias le han dicho que prefieren que sus hijos aprendan «solo español», para que les vaya mejor en el colegio y en el trabajo. El cabildo es muy activo en la vida de la sede.", "items": [{"id": "PS-154", "niv": 2, "e": "Frente a las familias que piden que sus hijos aprendan solo español, usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Liderazgo). Ley 115 de 1994, arts. 55 a 57 (etnoeducación).", "o": [["A", "atiende la solicitud y trabaja con esos niños solo en español mientras se aclara el tema con la institución.", "Evita el desacuerdo con las familias, pero aparta a la sede de la visión institucional del PEC. No muestra el liderazgo de transmitir con sus acciones los objetivos y valores institucionales.", false], ["B", "les explica que el PEC fue construido con las autoridades tradicionales y que la institución tiene que cumplirlo.", "El argumento es cierto, pero se apoya en la autoridad del documento y no construye con las familias el sentido del proyecto. El liderazgo busca involucrar a la comunidad en una identidad común.", false], ["C", "convoca a las familias y a los mayores a conversar sobre cómo la lengua propia y el español se fortalecen juntos.", "Evidencia liderazgo (Guía 31): «capacidad para motivar e involucrar a los miembros de la comunidad educativa con la construcción de una identidad común y el desarrollo de la visión institucional», convocando a quienes tienen autoridad cultural en la comunidad.", true]]}, {"id": "PS-155", "niv": 3, "e": "Para desarrollar las actividades en nasa yuwe que propone el PEC, sin hablar la lengua, usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Iniciativa).", "o": [["A", "solicita a la secretaría de educación un docente bilingüe que se encargue de las actividades en nasa yuwe.", "Pedir apoyo especializado es comprensible, pero traslada a otro una responsabilidad propia y deja las actividades en espera. La iniciativa implica actuar con autonomía frente a las responsabilidades.", false], ["B", "invita a un sabedor de la comunidad a orientar con usted algunas actividades y empieza a aprender la lengua.", "Evidencia iniciativa (Guía 31): «realiza acciones que le facilitan el aprendizaje permanente», «demuestra recursividad y flexibilidad, y se adapta con rapidez a diferentes contextos», apoyándose en los recursos de la propia comunidad.", true], ["C", "usa en clase videos y canciones en nasa yuwe que encontró en internet, para que los niños escuchen la lengua a diario.", "Es un recurso creativo, pero desconectado de la comunidad que sostiene la lengua y no implica que usted aprenda. Muestra cierta recursividad, pero no la adaptación al contexto ni el aprendizaje permanente que la competencia describe.", false]]}, {"id": "PS-156", "niv": 2, "e": "El cabildo convoca a una minga comunitaria el mismo día en que la sede programó la entrega de informes a las familias. Usted, encargado de la entrega,", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Negociación y mediación).", "o": [["A", "acuerda con la coordinación y el cabildo una fecha o forma de entrega que permita asistir a ambas actividades.", "Evidencia negociación y mediación (Guía 31): «facilita acuerdos y soluciones multilaterales, anteponiendo los intereses comunes», con una salida concertada que respeta tanto a la institución como a la comunidad.", true], ["B", "mantiene la fecha programada, porque el cronograma institucional fue aprobado y socializado al inicio del año escolar.", "Respetar el cronograma es razonable, pero desconoce una actividad comunitaria central y obliga a las familias a elegir. No busca una solución concertada entre las partes.", false], ["C", "aplaza la entrega de informes sin fecha definida, para respetar la actividad convocada por el cabildo.", "Muestra respeto por la comunidad, pero cede sin concertar y deja a las familias sin la información de sus hijos. Una solución efectiva y oportuna requiere acordar una alternativa concreta.", false]]}]}, {"comp": "psicotecnica", "rol": "docente", "tag": "Prueba psicotécnica · Liderazgo", "texto": "Usted es jefe del área de humanidades en un colegio oficial de Cartagena que atiende preescolar, básica y media. Este año la institución adoptó un plan lector como parte de su visión de formar «lectores críticos y ciudadanos participativos», y le encargó a su área liderarlo en todos los niveles. El área tiene nueve docentes con experiencias muy distintas: algunos llevan más de veinte años en la institución y otros acaban de llegar. Faltan dos meses para iniciar el segundo semestre.", "items": [{"id": "PS-164", "niv": 1, "e": "Para que los docentes del área se apropien del plan lector, usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Liderazgo).", "o": [["A", "propone a la coordinación que la aplicación del plan lector se tenga en cuenta en la evaluación de desempeño de cada docente.", "Vincular el plan a la evaluación puede asegurar cumplimiento formal, pero se apoya en la presión y no en la motivación. No construye una identidad común alrededor de la visión institucional.", false], ["B", "aplica el plan en sus clases, comparte lo que le funciona e invita a sus colegas a contar sus experiencias en el área.", "Evidencia liderazgo (Guía 31): «transmite con sus acciones a la comunidad educativa la visión, la misión, los objetivos y los valores institucionales» e influye positivamente en los demás para comprometerlos con una meta común.", true], ["C", "entrega a cada docente el documento del plan lector y les pide ajustar sus planeaciones en el plazo de un mes.", "Organiza la tarea, pero la reduce a un trámite y no genera apropiación de la visión del plan. El liderazgo busca motivar e involucrar a los demás, no solo asignar responsabilidades.", false]]}, {"id": "PS-165", "niv": 2, "e": "Un docente con muchos años en la institución le dice que lleva veinte años enseñando «a su manera» y que no piensa cambiar. Usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Liderazgo).", "o": [["A", "respeta su posición y le permite continuar con su metodología habitual, siempre que cumpla con los contenidos del área.", "Evita el conflicto con un colega experimentado, pero lo deja por fuera de un proyecto institucional que el área debe liderar. No logra su compromiso con la meta común.", false], ["B", "le recuerda que el plan lector es una decisión institucional que todos los docentes del área deben aplicar.", "Es cierto, pero la respuesta apela a la obligación y probablemente refuerza la resistencia. El liderazgo implica plantear orientaciones convincentes, no solo recordar la norma.", false], ["C", "valora su experiencia y lo invita a orientar una actividad del plan con las estrategias que mejor le funcionan.", "Corresponde al liderazgo (Guía 31): «expresa expectativas positivas de los demás y demuestra interés por el desarrollo de las personas», y convierte la experiencia del colega en un aporte al proyecto institucional.", true]]}, {"id": "PS-166", "niv": 3, "e": "Al cierre del año, los resultados del plan lector muestran avances en primaria, pero no en secundaria. En la reunión de evaluación del área, usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Liderazgo).", "o": [["A", "propone analizar con los docentes de secundaria las causas y construir con ellos los ajustes del plan para el próximo año.", "Evidencia liderazgo (Guía 31): «promueve cambios y transformaciones que aumenten la capacidad institucional e impulsen el mejoramiento», involucrando a quienes deben aplicarlos.", true], ["B", "sugiere mantener el plan en primaria, donde funciona, y que cada docente de secundaria decida si lo continúa aplicando.", "Parece una decisión eficiente basada en resultados, pero abandona la visión institucional en un nivel completo. No promueve el mejoramiento donde más se necesita.", false], ["C", "presenta a la rectoría un informe con los avances de primaria y las recomendaciones que usted elaboró para secundaria.", "Informar a la rectoría es parte de su función, pero las recomendaciones construidas solo por usted no comprometen a los docentes que deben aplicarlas. El liderazgo busca involucrar, no solo diagnosticar.", false]]}, {"id": "PS-167", "niv": 2, "e": "Una docente de ciencias sociales le propone integrar el plan lector con su proyecto de memoria histórica, lo que implica modificar parte de la planeación que usted ya tenía lista. Usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Trabajo en equipo).", "o": [["A", "revisa con ella qué partes de ambos proyectos pueden articularse y ajusta su planeación en lo necesario.", "Evidencia trabajo en equipo (Guía 31): «considera las contribuciones de los demás en la toma de decisiones» y «establece relaciones profesionales y de equipo que potencien su trabajo y el logro de las metas institucionales».", true], ["B", "le agradece la propuesta y le sugiere aplazarla para el próximo año, cuando ambos puedan planear desde el inicio.", "Parece prudente, pero hay tiempo suficiente antes del semestre y aplazar desaprovecha una colaboración que fortalece ambos proyectos. No considera la contribución de la colega.", false], ["C", "le propone que ella adapte su proyecto a los textos del plan lector, ya que este es un proyecto institucional.", "Acepta la colaboración solo en sus términos y le traslada todo el ajuste a la colega. El trabajo en equipo implica construir relaciones de colaboración en las que ambos aportan.", false]]}]}];
const CFG = {"titulo": "Simulacro 1 · Concurso Docente 2026–2027", "modo": "simulacro", "minutos": 194, "componentes": {"lectura_critica": "Lectura crítica", "razonamiento_cuantitativo": "Razonamiento cuantitativo", "competencias_blandas": "Competencias blandas y ciudadanas", "pedagogia_normativa": "Competencias pedagógicas y normativa", "psicotecnica": "Prueba psicotécnica"}, "niveles": {"1": "Básico", "2": "Intermedio", "3": "Avanzado"}, "clave": "simulacro-01.html"};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY = 'sim-docente:' + CFG.clave;
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}
function save(){try{localStorage.setItem(KEY, JSON.stringify(ST))}catch(e){}}
let ST = load();
ST.r = ST.r || {};
$('#tit').textContent = CFG.titulo;
const ITEMS = [];
DATA.forEach(c => c.items.forEach(it => { it.caso = c; ITEMS.push(it); }));

function justHTML(it){
  return '<div class="just">' + it.o.map(o => `<div><b>${o[0]}.</b> <span class="${o[3]?'okt':'not'}">${o[3]?'Es correcta.':'Es incorrecta.'}</span> ${esc(o[2])}</div>`).join('') +
    `<div class="src">Referencia: ${esc(it.f)}</div></div>`;
}
function itemHTML(it, n, mode){
  const r = ST.r[it.id];
  const reveal = mode === 'review' || (CFG.modo === 'practica' && r);
  let h = `<div class="item" id="i-${it.id}"><p class="enun"><span class="n">${n}.</span> <span class="niv">${CFG.niveles[it.niv]}</span> ${esc(it.e)}</p>`;
  it.o.forEach(o => {
    let cls = '';
    if (reveal) { if (o[3]) cls = 'ok'; else if (r === o[0]) cls = 'no'; }
    else if (r === o[0]) cls = 'sel';
    h += `<button class="op ${cls}" data-id="${it.id}" data-l="${o[0]}" ${reveal?'disabled':''}><span class="l">${o[0]}.</span><span>${esc(o[1])}</span></button>`;
  });
  if (reveal) {
    if (mode === 'review') h += `<div class="${r===keyOf(it)?'res-ok':'res-no'}" style="font-size:14px;margin-top:4px">${r ? (r===keyOf(it)?'Respondiste ' + r + ': correcto.':'Respondiste ' + r + '. La respuesta correcta es ' + keyOf(it) + '.') : 'Sin responder. La respuesta correcta es ' + keyOf(it) + '.'}</div>`;
    h += justHTML(it);
  }
  return h + '</div>';
}
const keyOf = it => it.o.find(o => o[3])[0];

function renderList(list, mode){
  let h = '', last = null, n = 0;
  list.forEach(it => {
    n++;
    if (it.caso !== last) { last = it.caso; h += `<div class="caso"><div class="tag">${esc(it.caso.tag)}</div><p>${esc(it.caso.texto)}</p></div>`; }
    h += itemHTML(it, n, mode);
  });
  return h;
}

// ---------- PRÁCTICA ----------
let LIST = [];
let FILTRO = ST.f || {comp:'', niv:'', rol:''};
function practica(){
  const comps = Object.entries(CFG.componentes).map(([k,v]) => `<option value="${k}" ${FILTRO.comp===k?'selected':''}>${esc(v)}</option>`).join('');
  const nivs = Object.entries(CFG.niveles).map(([k,v]) => `<option value="${k}" ${FILTRO.niv===k?'selected':''}>${esc(v)}</option>`).join('');
  const list = ITEMS.filter(it => (!FILTRO.comp || it.caso.comp===FILTRO.comp) && (!FILTRO.niv || String(it.niv)===FILTRO.niv) && (!FILTRO.rol || it.caso.rol===FILTRO.rol));
  const resp = list.filter(it => ST.r[it.id]); const ok = resp.filter(it => ST.r[it.id]===keyOf(it));
  $('#main').innerHTML = `<div class="panel"><p style="margin-top:0">Elige un tema y un nivel. Al responder verás de inmediato si acertaste y la explicación de cada opción.</p>
  <div class="row"><select id="fc"><option value="">Todos los temas</option>${comps}</select>
  <select id="fn"><option value="">Todos los niveles</option>${nivs}</select>
  <select id="fr"><option value="">Docentes y directivos</option><option value="docente" ${FILTRO.rol==='docente'?'selected':''}>Solo docentes</option><option value="directivo" ${FILTRO.rol==='directivo'?'selected':''}>Solo directivos</option></select>
  <button class="btn sec" id="borrar">Borrar mis respuestas</button></div>
  <p class="stat" id="pst" style="margin-bottom:0">${list.length} preguntas · respondidas ${resp.length} · aciertos ${ok.length}${resp.length? ' (' + Math.round(100*ok.length/resp.length) + ' %)':''}</p></div>` + renderList(list, 'practica');
  $('#prog').textContent = `${ok.length}/${resp.length} aciertos`;
  ['fc','fn','fr'].forEach((id,i) => $('#'+id).onchange = e => { FILTRO[['comp','niv','rol'][i]] = e.target.value; ST.f = FILTRO; save(); practica(); });
  LIST = list;
  $('#borrar').onclick = () => { list.forEach(it => delete ST.r[it.id]); save(); practica(); };
}

// ---------- SIMULACRO ----------
let tick = null;
function inicio(){
  const n = ITEMS.length, cnt = {};
  ITEMS.forEach(it => cnt[it.caso.comp] = (cnt[it.caso.comp]||0) + 1);
  const h = Math.floor(CFG.minutos/60), m = CFG.minutos%60;
  $('#main').innerHTML = `<div class="panel"><h2 style="margin-top:0;color:var(--pri)">Instrucciones</h2>
  <p>Este simulacro tiene <b>${n} preguntas</b> en el formato de Prueba de Juicio Situacional: un caso, enunciados que se completan y tres opciones con una sola respuesta correcta.</p>
  <table>${Object.entries(cnt).map(([k,v]) => `<tr><td>${esc(CFG.componentes[k])}</td><td class="r">${v}</td></tr>`).join('')}</table>
  <p>Tiempo sugerido: <b>${h ? h + ' h ' : ''}${m ? m + ' min' : ''}</b> (unos ${Math.round(CFG.minutos*60/n/6)/10} minutos por pregunta). Cuando se acaba el tiempo puedes seguir, pero el cronómetro lo indica.</p>
  <p>Tus respuestas se guardan en este navegador. Al terminar verás tu puntaje por componente y por nivel, y la explicación de cada pregunta.</p>
  <button class="btn" id="go">${ST.t0 ? 'Continuar el simulacro' : 'Comenzar'}</button></div>`;
  $('#prog').textContent = `${n} preguntas`;
  $('#go').onclick = () => { if (!ST.t0) { ST.t0 = Date.now(); save(); } examen(); };
}
function reloj(){
  const rest = CFG.minutos*60 - Math.floor((Date.now() - ST.t0)/1000);
  const a = Math.abs(rest), hh = Math.floor(a/3600), mm = Math.floor(a%3600/60), ss = a%60;
  const t = (rest < 0 ? '+' : '') + (hh ? hh + ':' : '') + String(mm).padStart(2,'0') + ':' + String(ss).padStart(2,'0');
  $('#timer').textContent = rest < 0 ? 'Tiempo cumplido ' + t : '⏱ ' + t;
  $('#timer').classList.toggle('low', rest < 600);
}
function examen(){
  $('#main').innerHTML = renderList(ITEMS, 'examen') + `<div class="panel"><button class="btn" id="fin">Terminar y calificar</button></div>`;
  progreso(); reloj(); clearInterval(tick); tick = setInterval(reloj, 1000);
  $('#fin').onclick = () => {
    const faltan = ITEMS.length - Object.keys(ST.r).filter(k => ITEMS.some(i => i.id===k)).length;
    $('#mtxt').textContent = faltan ? `Te faltan ${faltan} preguntas por responder. ¿Quieres calificar de todos modos?` : '¿Quieres terminar y ver tu calificación?';
    $('#modal').classList.remove('hide');
  };
}
function progreso(){
  const r = ITEMS.filter(it => ST.r[it.id]).length;
  $('#prog').textContent = `Respondidas ${r}/${ITEMS.length}`;
}
$('#mno').onclick = () => $('#modal').classList.add('hide');
$('#msi').onclick = () => { $('#modal').classList.add('hide'); ST.fin = Date.now(); save(); resultados(); };
function resultados(){
  clearInterval(tick);
  const ok = ITEMS.filter(it => ST.r[it.id] === keyOf(it)).length;
  const pct = Math.round(1000*ok/ITEMS.length)/10;
  const g = (fn, lab) => { const m = {}; ITEMS.forEach(it => { const k = fn(it); m[k] = m[k] || [0,0]; m[k][1]++; if (ST.r[it.id]===keyOf(it)) m[k][0]++; });
    return Object.entries(m).map(([k,v]) => `<tr><td>${esc(lab(k))}</td><td class="r">${v[0]}/${v[1]}</td><td class="r">${Math.round(100*v[0]/v[1])} %</td></tr>`).join(''); };
  const mins = Math.round(((ST.fin||Date.now()) - ST.t0)/60000);
  $('#timer').textContent = `Tiempo usado: ${Math.floor(mins/60) ? Math.floor(mins/60) + ' h ' : ''}${mins%60} min`;
  $('#prog').textContent = `${ok}/${ITEMS.length} aciertos`;
  $('#main').innerHTML = `<div class="panel"><div class="big">${String(pct).replace('.',',')} %</div>
  <p style="margin-top:4px">${ok} de ${ITEMS.length} respuestas correctas. ${pct >= 70 ? 'Muy buen resultado: repasa las explicaciones de tus errores para afianzarlo.' : pct >= 60 ? 'Vas bien, pero con poco margen: refuerza los componentes con menor porcentaje.' : 'Todavía no estás en zona segura: practica por tema los componentes con menor porcentaje.'}</p>
  <p class="aviso">Referencia: en el concurso el mínimo aprobatorio de la prueba eliminatoria es 60 puntos (70 para directivos). Este porcentaje de aciertos es una guía de preparación; la CNSC calcula su puntaje con su propia escala.</p>
  <h3>Por componente</h3><table>${g(it => it.caso.comp, k => CFG.componentes[k])}</table>
  <h3>Por nivel</h3><table>${g(it => it.niv, k => CFG.niveles[k])}</table>
  <div class="row" style="margin-top:14px"><button class="btn" id="solo">Ver solo mis errores</button><button class="btn sec" id="todas">Ver todas</button><button class="btn sec" id="otra">Reiniciar el simulacro</button></div></div><div id="rev"></div>`;
  const rev = errs => { const l = errs ? ITEMS.filter(it => ST.r[it.id] !== keyOf(it)) : ITEMS; $('#rev').innerHTML = renderList(l, 'review'); };
  rev(true);
  $('#solo').onclick = () => rev(true); $('#todas').onclick = () => rev(false);
  $('#otra').onclick = () => { ST = {r:{}}; save(); inicio(); window.scrollTo(0,0); };
}

document.addEventListener('click', e => {
  const b = e.target.closest('button.op'); if (!b || b.disabled) return;
  ST.r[b.dataset.id] = b.dataset.l; save();
  const it = ITEMS.find(i => i.id === b.dataset.id);
  const n = b.closest('.item').querySelector('.n').textContent.replace('.','');
  b.closest('.item').outerHTML = itemHTML(it, n, CFG.modo === 'practica' ? 'practica' : 'examen');
  if (CFG.modo === 'practica') { const resp = LIST.filter(i => ST.r[i.id]); const ok = resp.filter(i => ST.r[i.id]===keyOf(i)).length; $('#prog').textContent = `${ok}/${resp.length} aciertos`; $('#pst').textContent = `${LIST.length} preguntas · respondidas ${resp.length} · aciertos ${ok} (${Math.round(100*ok/resp.length)} %)`; }
  else progreso();
});

if (CFG.modo === 'practica') practica();
else if (ST.fin) resultados();
else if (ST.t0) examen();
else inicio();
</script>
</body>
</html>
