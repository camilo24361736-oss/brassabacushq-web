<script>
const DATA = [{"comp": "lectura_critica", "rol": "docente", "tag": "Lectura crítica", "texto": "Lea la siguiente columna de opinión publicada en el boletín de una institución educativa:\n\n«Cada inicio de año, algunas familias piden más tareas, convencidas de que un cuaderno lleno es señal de un buen colegio. La intención es comprensible, pero confunde cantidad con aprendizaje. En primaria, una tarea extensa que el niño no entiende suele terminar resuelta por un adulto, y lo que llega al aula no es evidencia de lo que el estudiante sabe, sino de lo que su familia pudo hacer por él. Esto, además, profundiza las diferencias entre quienes tienen a alguien que los acompañe en casa y quienes no.\n\nNo se trata de eliminar el trabajo en casa. Se trata de que sea breve, que el estudiante pueda hacerlo solo y que el docente lo revise y lo devuelva con comentarios. Una tarea sin retroalimentación es apenas una obligación; con retroalimentación, se convierte en una oportunidad para aprender.\n\nPor eso, este año el área de lenguaje reemplazará las planas de repetición por lecturas cortas con una pregunta para conversar en familia. Esperamos que menos tareas signifiquen, por fin, mejores tareas.»", "items": [{"id": "LC-001", "niv": 1, "e": "En el consejo académico, usted debe resumir la tesis del texto. Una formulación fiel a esa tesis es que", "f": "ICFES (2021). Marco de referencia de la prueba de Lectura Crítica Saber 11.°: comprender cómo se articulan las partes de un texto para darle un sentido global.", "o": [["A", "las tareas escolares deberían eliminarse en primaria porque generan desigualdad entre los estudiantes.", "Contradice el texto, que afirma expresamente «No se trata de eliminar el trabajo en casa». La desigualdad es un argumento de apoyo, no la conclusión.", false], ["B", "las familias deberían acompañar más a sus hijos en las tareas para reducir las diferencias académicas.", "El texto no propone más acompañamiento familiar; por el contrario, plantea que el estudiante pueda hacer la tarea solo, para que lo entregado sea evidencia de su propio aprendizaje.", false], ["C", "las tareas valen por su calidad: breves, hechas por el propio estudiante y con retroalimentación.", "Recoge la idea que articula todo el texto: se critica confundir cantidad con aprendizaje y se propone que el trabajo en casa sea breve, autónomo y retroalimentado. Identificar la tesis exige integrar la información de los tres párrafos (comprensión global).", true]]}, {"id": "LC-002", "niv": 2, "e": "Cuando el autor afirma que la tarea resuelta por un adulto «no es evidencia de lo que el estudiante sabe», el argumento que está usando es que", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: reflexionar a partir de un texto y evaluar su contenido (supuestos y argumentos).", "o": [["A", "las familias no tienen la formación necesaria para ayudar a sus hijos con las tareas.", "El texto no cuestiona la formación de las familias. Su punto es que, si otro resuelve la tarea, el producto deja de informar sobre el aprendizaje del niño.", false], ["B", "una tarea solo cumple una función evaluativa si refleja el desempeño real del estudiante.", "El autor supone que la tarea debe servir como evidencia del aprendizaje del estudiante; si la hace un adulto, pierde esa función. Reconocer este supuesto implícito es una tarea propia de la lectura crítica (reflexionar a partir de un texto y evaluar su contenido).", true], ["C", "los estudiantes de primaria no tienen la madurez para trabajar de manera autónoma en casa.", "Contradice la propuesta del texto, que plantea tareas breves que el estudiante «pueda hacer solo». El autor no niega la autonomía de los niños; critica tareas extensas que ellos no entienden.", false]]}, {"id": "LC-003", "niv": 2, "e": "El segundo párrafo cumple, dentro del texto, la función de", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: comprender la estructura y la función de las partes de un texto.", "o": [["A", "precisar la postura del autor, aclarando que propone transformar las tareas y no suprimirlas.", "Tras la crítica del primer párrafo, el segundo evita una lectura extrema («No se trata de eliminar...») y establece las condiciones de una buena tarea. Identificar la función de una parte del texto corresponde a comprender su estructura.", true], ["B", "narrar la experiencia del área de lenguaje que sirve de evidencia para la tesis.", "La experiencia del área de lenguaje aparece en el tercer párrafo y se presenta como una decisión para este año, no como evidencia ya obtenida.", false], ["C", "presentar una objeción a la tesis del autor que luego se refuta en el último párrafo.", "El segundo párrafo no presenta una objeción; precisa la postura del propio autor. El último párrafo no refuta nada, sino que anuncia una acción concreta.", false]]}, {"id": "LC-004", "niv": 3, "e": "Un padre de familia responde que su hijo mejoró sus notas el año pasado gracias a que tuvo más tareas. Frente a la tesis del texto, este testimonio", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: evaluar la validez de argumentos y la solidez de las evidencias.", "o": [["A", "no la refuta, porque un solo caso no prueba que la cantidad de tareas haya causado la mejora.", "Un testimonio aislado no permite establecer causalidad: la mejora pudo deberse a otros factores (acompañamiento, cambio de docente, maduración). Evaluar la fuerza de un contraargumento es parte de la lectura crítica.", true], ["B", "la confirma, porque las notas altas muestran que la familia hizo las tareas por el estudiante.", "Es una inferencia sin sustento: nada en el testimonio indica que la familia hiciera las tareas. Atribuir esa conclusión es una lectura sesgada.", false], ["C", "la refuta, porque demuestra con un caso real que más tareas producen mejores resultados académicos.", "Generaliza a partir de un solo caso y confunde correlación con causalidad. Además, el texto se refiere a la evidencia de aprendizaje, no solo a las notas.", false]]}]}, {"comp": "lectura_critica", "rol": "docente", "tag": "Lectura crítica", "texto": "Lea el siguiente diálogo entre dos docentes en la sala de profesores de un colegio de básica secundaria:\n\n—Profesora Marta: Este año tengo en séptimo a Julián, que tiene baja visión. La orientadora me dijo que necesita material ampliado y sentarse adelante. Yo lo hago, pero me preocupa que no sea suficiente.\n—Profesor Andrés: Con todo respeto, yo creo que ese niño debería estar en un colegio especial. Allá tienen los equipos y los docentes preparados; aquí lo vamos a dejar atrás.\n—Profesora Marta: Pero él no está atrás. En ciencias es de los que más participa. Lo que le cuesta es leer lo que yo escribo en el tablero.\n—Profesor Andrés: Por eso mismo. Si no puede leer el tablero, ¿cómo va a seguir el ritmo de los demás?\n—Profesora Marta: Tal vez el problema no sea Julián, sino que todo lo pongo en el tablero.", "items": [{"id": "LC-124", "niv": 1, "e": "En el diálogo, la profesora Marta afirma que a Julián le cuesta", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: identificar y entender los contenidos locales que conforman un texto.", "o": [["A", "participar en las clases del área de ciencias.", "Ella afirma lo contrario: «En ciencias es de los que más participa».", false], ["B", "seguir el ritmo de trabajo de sus compañeros.", "Es una suposición del profesor Andrés, no una afirmación de la profesora Marta, quien sostiene que Julián «no está atrás».", false], ["C", "leer lo que ella escribe en el tablero durante las clases.", "La profesora lo dice de manera explícita: «Lo que le cuesta es leer lo que yo escribo en el tablero». Es información local del texto.", true]]}, {"id": "LC-125", "niv": 2, "e": "El argumento del profesor Andrés parte del supuesto de que", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: reflexionar a partir de un texto y evaluar su contenido (supuestos implícitos).", "o": [["A", "el estudiante tiene un desempeño bajo en todas las áreas del plan de estudios de séptimo.", "Andrés no afirma eso; teme que el estudiante se quede atrás, y Marta informa que participa mucho en ciencias.", false], ["B", "la dificultad está en el estudiante y no en la forma en que se presenta la clase.", "Andrés concluye que Julián debe cambiar de colegio porque no puede leer el tablero, sin considerar que la clase podría presentarse de otro modo. Esa idea implícita sostiene su argumento.", true], ["C", "el colegio cuenta con los recursos necesarios para atender a estudiantes con baja visión.", "Andrés supone lo contrario: que los equipos y los docentes preparados están en un «colegio especial», no en el suyo.", false]]}, {"id": "LC-126", "niv": 2, "e": "La última intervención de la profesora Marta", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: comprender cómo se articulan las partes de un texto para darle un sentido global.", "o": [["A", "replantea el problema al trasladarlo del estudiante a sus propias prácticas de enseñanza.", "Con «Tal vez el problema no sea Julián, sino que todo lo pongo en el tablero», Marta cambia el foco: la barrera está en cómo presenta la información. Reconocer este giro es comprender cómo se articula el diálogo.", true], ["B", "acepta el argumento de su colega y reconoce que el estudiante debería cambiar de colegio.", "Marta no acepta el traslado; al contrario, busca la solución en su propia práctica.", false], ["C", "introduce una queja sobre la falta de recursos tecnológicos en el colegio para su clase.", "Marta no se refiere a recursos tecnológicos; reflexiona sobre su forma de usar el tablero.", false]]}, {"id": "LC-127", "niv": 3, "e": "La pregunta «Si no puede leer el tablero, ¿cómo va a seguir el ritmo de los demás?» es un argumento débil porque", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: reflexionar a partir de un texto y evaluar su contenido (validez de argumentos y solidez de las evidencias).", "o": [["A", "se apoya en la opinión de la orientadora, que no conoce el desempeño real del estudiante.", "Andrés no se apoya en la orientadora; es Marta quien la cita, y para referirse a los apoyos que necesita Julián.", false], ["B", "da por hecho que el tablero es la única vía para acceder a lo que se enseña en la clase.", "El razonamiento supone que sin el tablero no hay aprendizaje, cuando la información puede presentarse de otras formas (oral, material ampliado, recursos táctiles o digitales). Señalar una premisa no justificada es evaluar la validez de un argumento.", true], ["C", "reconoce que el estudiante participa en ciencias, lo cual contradice la postura que había sostenido.", "Andrés nunca reconoce esa participación; es Marta quien la menciona.", false]]}]}, {"comp": "lectura_critica", "rol": "docente", "tag": "Lectura crítica", "texto": "Lea el siguiente editorial publicado en un periódico regional:\n\n«Cada año, cuando se publican los resultados de las pruebas Saber 11, aparecen las listas de \"los mejores colegios\". Las familias las consultan, algunos colegios las usan en su publicidad y ciertos rectores reciben felicitaciones o reproches según el puesto obtenido.\n\nPero una lista ordenada por puntaje promedio dice menos de lo que parece. Un colegio que selecciona a sus estudiantes con un examen de admisión parte con ventaja frente a uno que recibe a todos los niños del barrio. Comparar sus promedios es como comparar el tiempo de dos corredores sin decir que uno empezó la carrera cincuenta metros adelante.\n\nLo que realmente interesa saber es cuánto aporta cada colegio al aprendizaje de los estudiantes que recibe. Medirlo es más difícil, pero no imposible. Mientras tanto, convendría leer los rankings con menos entusiasmo y más preguntas.»", "items": [{"id": "LC-145", "niv": 1, "e": "La tesis del editorial es que", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: comprender el sentido global del texto (tesis e intención comunicativa).", "o": [["A", "las pruebas Saber 11 deberían eliminarse porque generan competencia entre los colegios del país.", "El editorial no propone eliminar las pruebas; propone leer los rankings con más preguntas.", false], ["B", "los colegios que seleccionan a sus estudiantes obtienen mejores resultados en las pruebas Saber 11.", "El editorial menciona la selección como ejemplo de una ventaja inicial, pero su tesis se refiere a lo que las listas muestran y lo que no.", false], ["C", "los rankings por puntaje promedio no muestran por sí solos cuánto aporta cada colegio.", "Todo el texto conduce a esta idea: el promedio refleja también el punto de partida de los estudiantes, y lo importante es el aporte de cada colegio. Identificar la tesis es comprender el sentido global del texto.", true]]}, {"id": "LC-146", "niv": 2, "e": "La comparación con los dos corredores sirve para", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: comprender cómo se articulan las partes de un texto para darle un sentido global.", "o": [["A", "explicar que comparar resultados finales es injusto si no se tiene en cuenta el punto de partida.", "La imagen de un corredor que empieza «cincuenta metros adelante» ilustra que un colegio que selecciona estudiantes parte con ventaja. Reconocer la función de una analogía es comprender cómo se articula el argumento.", true], ["B", "mostrar que los colegios que seleccionan estudiantes se esfuerzan más que los demás.", "La analogía sugiere lo contrario: la ventaja no proviene del esfuerzo, sino de la posición de salida.", false], ["C", "ilustrar que los estudiantes de los colegios que reciben a todos los niños aprenden con más lentitud.", "La comparación no habla de la velocidad de aprendizaje de los estudiantes, sino de la desigualdad en el punto de partida.", false]]}, {"id": "LC-147", "niv": 3, "e": "De los siguientes datos, el que permitiría responder mejor la pregunta que el editorial considera importante es", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: reflexionar a partir de un texto y evaluar su contenido (validez de argumentos y solidez de las evidencias).", "o": [["A", "el puesto que ocupó cada colegio en los rankings de los últimos cinco años.", "Varios años de rankings siguen basándose en promedios finales, que el editorial considera insuficientes.", false], ["B", "el número de aspirantes que se presentan cada año al examen de admisión de cada colegio.", "Ese dato muestra la demanda de un colegio, no lo que este aporta al aprendizaje de sus estudiantes.", false], ["C", "la diferencia entre el nivel con que ingresan los estudiantes y el que alcanzan al terminar.", "El editorial pregunta «cuánto aporta cada colegio al aprendizaje de los estudiantes que recibe»; para responderlo hay que comparar el punto de llegada con el de partida. Identificar qué información responde a la pregunta de un texto es evaluar su contenido.", true]]}]}, {"comp": "lectura_critica", "rol": "docente", "tag": "Lectura crítica", "texto": "Lea los siguientes textos producidos en una institución educativa:\n\nTexto 1 (circular del rector a los docentes). «A partir de este periodo, no se aceptarán trabajos escritos elaborados en casa, porque ya no podemos saber si los hizo el estudiante o una aplicación de inteligencia artificial. Todos los textos se escribirán en clase, a mano y en presencia del docente.»\n\nTexto 2 (intervención de una docente de lenguaje en el consejo académico). «Comparto la preocupación, pero no la solución. Si todo se escribe en el aula, perderemos los trabajos largos, que exigen consultar, revisar y reescribir. Además, nuestros estudiantes usarán estas herramientas al salir del colegio, querámoslo o no. Prefiero pedirles que entreguen los borradores, que expliquen oralmente lo que escribieron y que declaren si usaron alguna herramienta y para qué.»", "items": [{"id": "LC-160", "niv": 1, "e": "La docente del texto 2 coincide con el rector en", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: reflexionar a partir de un texto y evaluar su contenido (contraste de textos con perspectivas distintas).", "o": [["A", "la decisión de que todos los textos se escriban a mano y en clase.", "La docente rechaza esa medida: «Comparto la preocupación, pero no la solución».", false], ["B", "la preocupación por saber si los trabajos los hacen los estudiantes.", "La docente dice compartir la preocupación del rector, que es no poder saber quién hizo el trabajo. Identificar en qué coinciden y en qué difieren dos textos es una tarea de lectura crítica.", true], ["C", "la idea de que los trabajos largos deben salir del plan de estudios.", "La docente defiende los trabajos largos y advierte que la medida del rector haría que se perdieran.", false]]}, {"id": "LC-161", "niv": 2, "e": "Uno de los argumentos de la docente contra la medida del rector es que esta", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: reflexionar a partir de un texto y evaluar su contenido (validez de argumentos y solidez de las evidencias).", "o": [["A", "vulneraría el derecho de los estudiantes a usar la tecnología en el colegio.", "La docente no habla de derechos; su argumento se refiere a la formación de los estudiantes.", false], ["B", "impediría los trabajos que exigen consultar, revisar y reescribir.", "La docente lo afirma: «Si todo se escribe en el aula, perderemos los trabajos largos, que exigen consultar, revisar y reescribir».", true], ["C", "aumentaría el tiempo que los docentes dedican a revisar textos escritos a mano.", "La docente no menciona la carga de revisión de los docentes.", false]]}, {"id": "LC-162", "niv": 3, "e": "La propuesta de la docente se apoya en el supuesto de que", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: reflexionar a partir de un texto y evaluar su contenido (supuestos implícitos).", "o": [["A", "la autoría de un trabajo puede verificarse observando su proceso y la explicación del estudiante.", "Pedir borradores, una explicación oral y una declaración de uso solo tiene sentido si se supone que esas evidencias permiten saber qué hizo el estudiante. Ese supuesto no se enuncia, pero sostiene la propuesta.", true], ["B", "los estudiantes dejarán de usar herramientas de inteligencia artificial si se les pide declararlas.", "La docente da por hecho que los estudiantes usarán esas herramientas («querámoslo o no»); su propuesta no busca que dejen de usarlas.", false], ["C", "las aplicaciones de inteligencia artificial producen textos de menor calidad que los de los estudiantes.", "La docente no compara la calidad de los textos; su preocupación es la autoría y el proceso de escritura.", false]]}, {"id": "LC-163", "niv": 3, "e": "Si se comprobara que algunos estudiantes usan inteligencia artificial desde su celular durante las clases, esto debilitaría principalmente", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: reflexionar a partir de un texto y evaluar su contenido (contraste de textos con perspectivas distintas).", "o": [["A", "la preocupación que comparten ambos textos por la autoría de los trabajos de los estudiantes.", "El dato no debilita esa preocupación; más bien la refuerza, porque muestra que el problema existe también en el aula.", false], ["B", "el argumento de la docente según el cual los trabajos largos exigen revisar y reescribir.", "Ese argumento se refiere a la naturaleza de los trabajos largos y no depende de lo que ocurra en clase.", false], ["C", "la idea del rector de que escribir en clase permite saber con certeza quién hizo el trabajo.", "La medida del rector se basa en que la presencia del docente garantiza la autoría. Si el uso de estas herramientas ocurre también en el aula, esa garantía se debilita. Identificar qué afirmación se ve afectada por un dato nuevo es evaluar argumentos.", true]]}]}, {"comp": "lectura_critica", "rol": "docente", "tag": "Lectura crítica", "texto": "Lea la siguiente columna escrita por una docente de preescolar para el boletín institucional:\n\n«Cada periodo, algunas familias me preguntan qué \"nota\" sacó su hijo. En preescolar no calificamos con números, y eso les genera desconfianza: sienten que, sin una cifra, no saben si el niño va bien o mal.\n\nEntiendo la inquietud, pero un número dice muy poco a esta edad. Un \"4\" no explica si Sofía ya reconoce su nombre escrito, si comparte los materiales o si todavía llora al despedirse de su mamá. Un informe descriptivo, en cambio, cuenta lo que el niño hace, lo que está empezando a lograr y cómo se le puede ayudar en casa.\n\nClaro que un informe así exige más de nosotras: observar con cuidado, tomar notas y escribir con claridad. Y exige también algo de las familias: leerlo completo y no buscar en él una cifra que no está.»", "items": [{"id": "LC-194", "niv": 1, "e": "Según la columna, algunas familias desconfían del informe de preescolar porque", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: identificar y entender los contenidos locales que conforman un texto.", "o": [["A", "lo escriben docentes que no observan con cuidado a cada uno de los niños.", "La columna no atribuye esa falta a las docentes; señala que observar con cuidado es una exigencia que ellas asumen.", false], ["B", "no trae una calificación numérica que les indique si el niño va bien.", "La docente lo explica en el primer párrafo: «sienten que, sin una cifra, no saben si el niño va bien o mal».", true], ["C", "no explica qué está aprendiendo el niño ni cómo pueden ayudarlo en casa.", "Según la docente, eso es justamente lo que el informe descriptivo sí explica.", false]]}, {"id": "LC-195", "niv": 2, "e": "El ejemplo de Sofía se usa en el texto para", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: comprender cómo se articulan las partes de un texto para darle un sentido global.", "o": [["A", "mostrar la información concreta que un número no alcanza a comunicar.", "Tras afirmar que «un número dice muy poco a esta edad», la docente enumera logros concretos que un «4» no explica. Reconocer la función de un ejemplo es comprender cómo se articula el argumento.", true], ["B", "describir el caso de una estudiante que presenta dificultades de aprendizaje.", "El ejemplo no presenta a Sofía como una niña con dificultades; ilustra qué tipo de información no cabe en un número.", false], ["C", "explicar por qué algunos niños lloran cuando se despiden de sus familias.", "El llanto se menciona como uno de los aspectos que el informe puede describir, no como un tema que se explique.", false]]}, {"id": "LC-196", "niv": 2, "e": "El último párrafo se diferencia de los anteriores en que", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: comprender cómo se articulan las partes de un texto (conectores y función de los párrafos).", "o": [["A", "presenta datos que prueban que el informe descriptivo es mejor que la nota.", "El párrafo no presenta datos ni pruebas; señala las exigencias de la propuesta.", false], ["B", "abandona la defensa del informe descriptivo y acepta el uso de números.", "La docente mantiene su postura; pide a las familias no buscar una cifra «que no está».", false], ["C", "reconoce lo que la propuesta exige tanto a las docentes como a las familias.", "Con «Claro que…», la autora admite los costos de su propuesta: más trabajo para las docentes y una lectura atenta por parte de las familias. Identificar este movimiento concesivo es comprender la estructura del texto.", true]]}, {"id": "LC-197", "niv": 3, "e": "Un padre responde a la columna: «Si no hay números, ¿cómo sé si mi hijo está por encima o por debajo de los demás?». Esta pregunta revela que el padre", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: reflexionar a partir de un texto y evaluar su contenido (contraste de textos con perspectivas distintas).", "o": [["A", "concibe la evaluación como una comparación entre niños, mientras la docente la concibe como el registro del avance de cada uno.", "El padre quiere ubicar a su hijo frente a los demás; la docente propone describir lo que cada niño hace y está empezando a lograr. Reconocer las concepciones distintas detrás de dos posturas es reflexionar críticamente sobre el texto.", true], ["B", "comparte con la docente la idea de que la evaluación debe describir lo que cada niño hace y está empezando a lograr.", "La pregunta no se interesa por la descripción de lo que hace el niño, sino por su posición frente a los demás.", false], ["C", "rechaza el informe porque no se entrega con la frecuencia que él considera necesaria.", "La pregunta no se refiere a la frecuencia de los informes, sino a la ausencia de números para comparar.", false]]}]}, {"comp": "razonamiento_cuantitativo", "rol": "docente", "tag": "Razonamiento cuantitativo", "texto": "La institución quiere organizar la jornada deportiva del viernes. Hay 4 grados participantes con 36, 48, 60 y 72 estudiantes, respectivamente. El coordinador le pide a usted formar equipos del mayor tamaño posible, de modo que todos los equipos tengan el mismo número de estudiantes y cada equipo esté formado solo por estudiantes de un mismo grado, sin que sobre nadie. La cancha estará disponible de 7:00 a. m. a 12:25 p. m., cada partido dura 25 minutos y entre un partido y el siguiente se dejan 5 minutos para cambiar de equipos; después del último partido no se requiere cambio.", "items": [{"id": "RC-008", "niv": 1, "e": "Para cumplir la solicitud del coordinador, cada equipo debe tener", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo: divisibilidad y máximo común divisor en situaciones de reparto.", "o": [["A", "6 estudiantes.", "6 divide a las cuatro cantidades, pero no es el mayor tamaño posible: 12 también las divide a todas.", false], ["B", "12 estudiantes.", "El mayor número que divide exactamente a 36, 48, 60 y 72 es su máximo común divisor: 12. Así, ningún estudiante sobra y los equipos tienen el mayor tamaño posible.", true], ["C", "18 estudiantes.", "18 divide a 36 y a 72, pero no a 48 ni a 60 (48 ÷ 18 y 60 ÷ 18 no son exactos), por lo que sobrarían estudiantes.", false]]}, {"id": "RC-009", "niv": 1, "e": "Con equipos de ese tamaño, el número total de equipos que se forman es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo: operaciones con números naturales en contexto.", "o": [["A", "12 equipos.", "Confunde el número de estudiantes por equipo (12) con el número de equipos. Con 216 estudiantes en equipos de 12 se forman 216 ÷ 12 = 18 equipos.", false], ["B", "18 equipos.", "Por grado se forman 36 ÷ 12 = 3, 48 ÷ 12 = 4, 60 ÷ 12 = 5 y 72 ÷ 12 = 6 equipos: 3 + 4 + 5 + 6 = 18. Equivalentemente, 216 estudiantes ÷ 12 = 18.", true], ["C", "36 equipos.", "Resulta de formar equipos de 6 estudiantes (216 ÷ 6 = 36). El tamaño solicitado era el mayor posible, es decir, 12.", false]]}, {"id": "RC-010", "niv": 3, "e": "Teniendo en cuenta el horario de la cancha, el número máximo de partidos completos que pueden programarse es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo: modelación de situaciones con tiempos y validación de soluciones.", "o": [["A", "10 partidos.", "Resulta de dividir 325 entre 30 (10,8) y truncar, suponiendo que también después del último partido se necesitan 5 minutos de cambio. Al último partido no le sigue ningún cambio, así que cabe uno más.", false], ["B", "11 partidos.", "De 7:00 a. m. a 12:25 p. m. hay 325 minutos. Diez partidos con su cambio ocupan 10 × 30 = 300 minutos y quedan 25, justo lo que dura un undécimo partido, que ya no necesita cambio. Doce partidos requerirían 11 × 30 + 25 = 355 minutos.", true], ["C", "13 partidos.", "Resulta de dividir 325 entre 25 sin contar los 5 minutos de cambio entre partidos.", false]]}]}, {"comp": "razonamiento_cuantitativo", "rol": "docente", "tag": "Razonamiento cuantitativo", "texto": "El sistema institucional de evaluación (SIEE) de un colegio establece que la nota de cada periodo se calcula así: componente cognitivo, 50 %; componente procedimental, 30 %; componente actitudinal, 20 %. La nota final del año es un promedio ponderado de los cuatro periodos: el primero y el segundo pesan 20 % cada uno, y el tercero y el cuarto pesan 30 % cada uno. La escala es de 1,0 a 5,0 y se aprueba con 3,0 o más. Usted es director de grupo de octavo y revisa varios casos.", "items": [{"id": "RC-113", "niv": 1, "e": "Si una estudiante obtuvo en un periodo 3,2 en cognitivo, 4,0 en procedimental y 4,5 en actitudinal, su nota de ese periodo es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: promedio ponderado.", "o": [["A", "3,70.", "Promedio ponderado: 3,2 × 0,5 + 4,0 × 0,3 + 4,5 × 0,2 = 1,6 + 1,2 + 0,9 = 3,7.", true], ["B", "3,90.", "Es el promedio simple (3,2 + 4,0 + 4,5) ÷ 3 = 3,9, que ignora los pesos distintos de cada componente.", false], ["C", "4,09.", "Intercambia los pesos: aplica el 50 % a la nota actitudinal y el 20 % a la cognitiva (4,5 × 0,5 + 4,0 × 0,3 + 3,2 × 0,2 = 4,09).", false]]}, {"id": "RC-114", "niv": 3, "e": "Si un estudiante tiene 2,5 en procedimental y 4,0 en actitudinal, la nota mínima que necesita en el componente cognitivo para aprobar el periodo es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: planteamiento y solución de ecuaciones lineales en contexto.", "o": [["A", "1,45.", "Plantea bien la ecuación 0,5x + 0,75 + 0,8 = 3,0, pero se detiene en 0,5x = 1,45 sin dividir entre 0,5 para despejar x.", false], ["B", "2,50.", "Plantea la ecuación con promedio simple, (x + 2,5 + 4,0) ÷ 3 = 3,0, que no respeta los pesos del SIEE.", false], ["C", "2,90.", "Se plantea 0,5x + 0,3 × 2,5 + 0,2 × 4,0 = 3,0, es decir, 0,5x + 1,55 = 3,0; entonces 0,5x = 1,45 y x = 2,9.", true]]}, {"id": "RC-115", "niv": 2, "e": "Si un estudiante obtuvo 3,0; 3,4; 4,0 y 4,2 en los periodos primero, segundo, tercero y cuarto, respectivamente, su nota final del año es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: promedio ponderado con pesos porcentuales.", "o": [["A", "3,56.", "Intercambia los pesos de los periodos: asigna 30 % a los dos primeros y 20 % a los dos últimos (0,9 + 1,02 + 0,8 + 0,84 = 3,56).", false], ["B", "3,65.", "Es el promedio simple de los cuatro periodos (14,6 ÷ 4), que no tiene en cuenta que el tercero y el cuarto pesan más.", false], ["C", "3,74.", "3,0 × 0,2 + 3,4 × 0,2 + 4,0 × 0,3 + 4,2 × 0,3 = 0,6 + 0,68 + 1,2 + 1,26 = 3,74.", true]]}, {"id": "RC-116", "niv": 2, "e": "Al explicar a las familias cómo funciona la nota de cada periodo, usted puede afirmar correctamente que", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: razonamiento proporcional en promedios ponderados.", "o": [["A", "subir 1 punto en cualquiera de los componentes aumenta la nota del periodo en 1/3 de punto.", "Ese efecto solo ocurriría con un promedio simple de tres componentes. Con pesos distintos, el aumento depende del porcentaje de cada componente.", false], ["B", "subir 1 punto en el componente actitudinal aumenta la nota del periodo en 2 puntos, por ser el 20 %.", "Confunde el porcentaje del componente con un factor de multiplicación mayor que 1: el 20 % equivale a 0,2, por lo que un punto adicional suma 0,2.", false], ["C", "subir 1 punto en el componente cognitivo aumenta la nota del periodo en 0,5, mientras que subir 1 punto en el actitudinal la aumenta en 0,2.", "Cada punto adicional en un componente se multiplica por su peso: 1 × 0,5 = 0,5 en el cognitivo y 1 × 0,2 = 0,2 en el actitudinal.", true]]}]}, {"comp": "razonamiento_cuantitativo", "rol": "docente", "tag": "Razonamiento cuantitativo", "texto": "Usted forma parte del comité que negocia los uniformes para los estudiantes beneficiarios de un programa de apoyo. El proveedor A tiene un precio de lista de $85.000 por uniforme y ofrece un descuento del 20 % por compra institucional y, sobre el precio ya rebajado, un descuento adicional del 10 % por pago de contado. El proveedor B tiene un precio de lista de $88.000 por uniforme y ofrece un único descuento del 30 %. Ambos precios ya incluyen impuestos.", "items": [{"id": "RC-137", "niv": 1, "e": "Con el proveedor A, el precio de un uniforme después de aplicar solo el descuento por compra institucional es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: porcentajes y descuentos.", "o": [["A", "$17.000.", "Es el valor del descuento (20 % de 85.000), no el precio que queda después de aplicarlo.", false], ["B", "$65.000.", "Resta $20.000 al precio de lista, como si 20 % significara 20.000 pesos; el descuento es 0,2 × 85.000 = $17.000.", false], ["C", "$68.000.", "El descuento es 0,2 × 85.000 = $17.000, así que el precio queda en 85.000 − 17.000 = $68.000 (equivale a pagar el 80 %).", true]]}, {"id": "RC-138", "niv": 2, "e": "Con el proveedor A, el precio final de un uniforme pagado de contado es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: descuentos sucesivos.", "o": [["A", "$59.500.", "Suma los dos descuentos y aplica un 30 % sobre el precio de lista (85.000 × 0,7); el segundo descuento se aplica sobre el precio ya rebajado.", false], ["B", "$61.200.", "Primer descuento: 85.000 × 0,8 = $68.000. Segundo descuento sobre ese valor: 68.000 × 0,9 = $61.200.", true], ["C", "$76.500.", "Aplica solo el descuento del 10 % (85.000 × 0,9) y olvida el descuento por compra institucional.", false]]}, {"id": "RC-139", "niv": 3, "e": "Los dos descuentos sucesivos del proveedor A equivalen a un descuento único sobre el precio de lista de", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: porcentajes sucesivos y descuento equivalente.", "o": [["A", "28 %.", "Después de ambos descuentos se paga 0,8 × 0,9 = 0,72 del precio, es decir, el 72 %. El descuento único equivalente es 100 % − 72 % = 28 %.", true], ["B", "30 %.", "Suma los porcentajes (20 % + 10 %); los descuentos sucesivos no se suman porque el segundo se calcula sobre una base menor.", false], ["C", "72 %.", "Es el porcentaje del precio que se paga, no el descuento; confunde la parte pagada con la parte descontada.", false]]}, {"id": "RC-140", "niv": 2, "e": "Al comparar las dos ofertas para pago de contado, usted recomienda al comité", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: comparación de alternativas con porcentajes.", "o": [["A", "el proveedor A, porque su precio final por uniforme resulta menor que el del proveedor B.", "Proveedor A: 85.000 × 0,8 × 0,9 = $61.200. Proveedor B: 88.000 × 0,7 = $61.600. La comparación debe hacerse con los precios finales, y A es $400 más económico.", true], ["B", "cualquiera de los dos, porque los dos descuentos sucesivos del proveedor A equivalen en total al 30 % que ofrece el proveedor B.", "Supone que 20 % y 10 % sucesivos equivalen al 30 %; en realidad equivalen al 28 %, y además los precios de lista son distintos.", false], ["C", "el proveedor B, porque su descuento único del 30 % es mayor que el descuento total que se obtiene con los dos descuentos del proveedor A.", "Compara porcentajes aplicados a precios de lista distintos. Aunque B descuenta más en porcentaje, parte de un precio mayor y su precio final es más alto.", false]]}]}, {"comp": "razonamiento_cuantitativo", "rol": "docente", "tag": "Razonamiento cuantitativo", "texto": "Usted aplicó una prueba diagnóstica de 20 preguntas a 40 estudiantes de grado sexto y analiza cada pregunta. El índice de facilidad de una pregunta es la proporción de estudiantes que la responden bien. Para el índice de discriminación, se toman los 10 estudiantes con puntaje total más alto (grupo alto) y los 10 con puntaje total más bajo (grupo bajo), y se calcula: (aciertos del grupo alto − aciertos del grupo bajo) ÷ 10. En la pregunta 1 acertaron 28 de los 40 estudiantes; en el grupo alto acertaron 9 y en el grupo bajo, 4.", "items": [{"id": "RC-170", "niv": 1, "e": "El índice de facilidad de la pregunta 1 es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: razones y proporciones; lectura de datos.", "o": [["A", "0,28.", "Divide los aciertos entre 100, como si se tratara de un porcentaje; la base es el número de estudiantes que presentaron la prueba (40).", false], ["B", "0,30.", "Es la proporción de estudiantes que fallaron (12 ÷ 40); el índice de facilidad usa los aciertos.", false], ["C", "0,70.", "Acertaron 28 de 40 estudiantes: 28 ÷ 40 = 0,70.", true]]}, {"id": "RC-171", "niv": 2, "e": "El índice de discriminación de la pregunta 1 es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: aplicación de fórmulas dadas en contexto.", "o": [["A", "0,125.", "Divide la diferencia de aciertos (5) entre los 40 estudiantes; la fórmula indicada divide entre 10, el tamaño de cada grupo.", false], ["B", "0,25.", "Divide la diferencia (5) entre 20, sumando los dos grupos; la fórmula del caso divide entre 10.", false], ["C", "0,5.", "Según la fórmula del caso: (9 − 4) ÷ 10 = 5 ÷ 10 = 0,5.", true]]}, {"id": "RC-172", "niv": 2, "e": "Si en la pregunta 2 el índice de facilidad fue 0,35, el número de estudiantes que respondió mal esa pregunta es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: proporciones y complemento.", "o": [["A", "26 estudiantes.", "Acertaron 0,35 × 40 = 14 estudiantes, así que respondieron mal 40 − 14 = 26.", true], ["B", "35 estudiantes.", "Lee el índice 0,35 como si fuera un número de estudiantes; es una proporción que debe multiplicarse por 40.", false], ["C", "65 estudiantes.", "Calcula la proporción de quienes fallaron (1 − 0,35 = 0,65) y la toma como número de estudiantes, sin multiplicar por 40.", false]]}, {"id": "RC-173", "niv": 3, "e": "En la pregunta 3 acertaron 3 estudiantes del grupo alto y 7 del grupo bajo. Con base en este resultado, usted concluye razonablemente que", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: interpretación de indicadores y validación de conclusiones.", "o": [["A", "la pregunta es muy fácil, porque un índice de discriminación negativo indica que casi todos la acertaron.", "Confunde discriminación con facilidad: el signo negativo indica que el grupo bajo acierta más que el alto, no que la pregunta sea fácil; solo 10 de los 20 estudiantes de ambos grupos la acertaron.", false], ["B", "la pregunta funciona al revés de lo esperado y conviene revisar su clave y su redacción antes de usarla para calificar.", "El índice es (3 − 7) ÷ 10 = −0,4: la aciertan más los estudiantes con bajo desempeño general. Un índice negativo suele indicar una clave errada o una redacción confusa.", true], ["C", "la pregunta discrimina bien, porque entre los dos grupos hay una diferencia de 4 aciertos.", "Considera la magnitud de la diferencia e ignora su sentido; una buena discriminación requiere que el grupo alto acierte más que el bajo.", false]]}]}, {"comp": "razonamiento_cuantitativo", "rol": "docente", "tag": "Razonamiento cuantitativo", "texto": "En segundo de primaria, usted mide la fluidez lectora en palabras por minuto (ppm) con un texto de 180 palabras. La meta institucional para final de año es de 90 ppm. Pedro leyó el texto completo en 1 minuto 48 segundos y Luisa, en 2 minutos 15 segundos. Al final del año, Luisa pasó de 80 a 96 ppm y Pedro, de 100 a 118 ppm.", "items": [{"id": "RC-181", "niv": 2, "e": "La fluidez lectora de Pedro en la primera medición fue de", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: razones y conversión de unidades de tiempo.", "o": [["A", "90 ppm.", "Redondea el tiempo a 2 minutos antes de dividir (180 ÷ 2); el tiempo exacto es 1,8 minutos.", false], ["B", "100 ppm.", "1 minuto 48 segundos = 60 + 48 = 108 segundos = 108 ÷ 60 = 1,8 minutos. Fluidez: 180 ÷ 1,8 = 100 ppm.", true], ["C", "121,6 ppm.", "Escribe 1 minuto 48 segundos como 1,48 minutos (180 ÷ 1,48 ≈ 121,6); los segundos deben dividirse entre 60.", false]]}, {"id": "RC-182", "niv": 1, "e": "Para cumplir exactamente la meta de 90 ppm, un estudiante debe leer el texto de 180 palabras en un tiempo de", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: razones y tasas.", "o": [["A", "1 min 30 s.", "Interpreta 90 ppm como 90 segundos; la meta es una razón de palabras por minuto, que da 180 ÷ 90 = 2 minutos.", false], ["B", "2 min.", "Tiempo = palabras ÷ ritmo = 180 ÷ 90 = 2 minutos.", true], ["C", "2 min 15 s.", "Corresponde al tiempo de Luisa en la primera medición, que equivale a 80 ppm, por debajo de la meta.", false]]}, {"id": "RC-183", "niv": 3, "e": "Al comparar el progreso de Luisa y Pedro durante el año, la afirmación correcta es que", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: comparación entre cambio absoluto y cambio relativo.", "o": [["A", "el aumento de Pedro fue mayor en palabras por minuto, pero el de Luisa fue mayor en porcentaje.", "Pedro aumentó 18 ppm (18 ÷ 100 = 18 %) y Luisa 16 ppm (16 ÷ 80 = 20 %). En valor absoluto mejoró más Pedro; en valor relativo, Luisa.", true], ["B", "el aumento de Pedro fue mayor tanto en palabras por minuto como en porcentaje, porque partió de un nivel más alto.", "Usa la diferencia absoluta como si también fuera la relativa; el aumento de Luisa es 20 % y el de Pedro 18 %.", false], ["C", "los dos mejoraron igual, porque ambos aumentaron cerca de 17 ppm.", "Aproxima los aumentos y omite la base de comparación; los aumentos fueron 16 y 18 ppm, y en porcentaje, 20 % y 18 %.", false]]}]}, {"comp": "competencias_blandas", "rol": "docente", "tag": "Competencias blandas y ciudadanas · Ética en el servicio público (Ley 1952 de 2019; Código de Integridad)", "texto": "Usted es docente de matemáticas de grado once en el único colegio oficial de un municipio pequeño, donde también estudia su sobrina Laura, que cursa décimo. El rector lo designa como jurado de la feria de ciencias, en la que participa el proyecto de Laura y su grupo; el ganador recibirá una beca para un curso técnico. Además, el padre de un estudiante de su curso, que tiene dificultades en matemáticas, le pide que le dé a su hijo clases particulares pagadas.", "items": [{"id": "CB-113", "niv": 3, "e": "Si los jurados deben deliberar juntos para escoger un único ganador entre todos los proyectos, frente a su designación usted debe", "f": "Ley 1952 de 2019, art. 44.", "o": [["A", "aceptar la designación y abstenerse de calificar solo el proyecto de su sobrina, dejando esa evaluación a otros jurados.", "Parece una solución equilibrada, pero en un concurso con un solo ganador las notas que usted asigne a los demás proyectos también afectan la posición de su sobrina; el impedimento cubre toda la decisión.", false], ["B", "aceptar la designación, porque una sobrina es pariente en tercer grado y el impedimento cubre solo a hijos y hermanos.", "Es un error frecuente sobre los grados de parentesco: el impedimento por conflicto de intereses alcanza hasta el cuarto grado de consanguinidad, que incluye a los sobrinos.", false], ["C", "informar al rector que su sobrina participa en uno de los proyectos y pedir que otro docente lo reemplace como jurado.", "El artículo 44 de la Ley 1952 de 2019 obliga al servidor a declararse impedido cuando un pariente dentro del cuarto grado de consanguinidad tiene interés en el asunto. Una sobrina es pariente en tercer grado, y en un concurso con un solo premio el jurado decide comparando a todos los participantes.", true]]}, {"id": "CB-114", "niv": 3, "e": "Sobre la solicitud de clases particulares pagadas para el estudiante de su curso, la respuesta más adecuada es", "f": "Ley 1952 de 2019, art. 44; Función Pública (2017). Código de Integridad del Servicio Público (honestidad); Decreto 1290 de 2009, art. 3.", "o": [["A", "no aceptarlas y ofrecer al estudiante las estrategias de apoyo que la institución prevé para quienes presentan dificultades.", "La clave se funda en el conflicto de intereses: recibir pago de la familia de un estudiante al que usted evalúa le da un interés particular y directo en un asunto a su cargo (Ley 1952 de 2019, art. 44), y el Código de Integridad (honestidad) orienta a no dar trato preferencial ni aceptar beneficios de personas interesadas en sus decisiones. Las estrategias de apoyo institucionales (Decreto 1290 de 2009, art. 3) atienden la dificultad sin ese conflicto.", true], ["B", "aceptarlas fuera del horario laboral, ya que es un trabajo independiente que no usa recursos de la institución.", "Hacerlo fuera del horario evita usar recursos públicos, pero no elimina el conflicto: usted tendría un interés económico en un estudiante cuyo desempeño evalúa.", false], ["C", "aceptarlas y pedir que otro docente califique las evaluaciones de ese estudiante, para mantener la imparcialidad.", "Busca proteger la imparcialidad, pero usted sigue siendo el docente del área que diseña, orienta y valora el proceso del estudiante; el interés económico se mantiene.", false]]}, {"id": "CB-115", "niv": 2, "e": "Días después, un colega le dice que usted «exagera» al apartarse del jurado, porque «en un pueblo todos son familia». Usted le responde que", "f": "Función Pública (2017). Código de Integridad del Servicio Público (honestidad, justicia); Ley 1952 de 2019, art. 44.", "o": [["A", "apartarse no es desconfiar de sí mismo, sino proteger la imparcialidad y la confianza de los participantes.", "El Código de Integridad (honestidad y justicia) orienta a no dar trato preferencial a personas cercanas y a actuar con imparcialidad; declararse impedido protege la confianza de la comunidad en el proceso.", true], ["B", "tiene razón, y que en adelante solo se apartará cuando se trate de un hijo o un hermano, por ser el vínculo más cercano.", "Responde a una dificultad real de los municipios pequeños, pero reduce el impedimento a un rango menor que el legal, que llega hasta el cuarto grado de consanguinidad.", false], ["C", "lo hizo porque el rector podría sancionarlo, aunque su objetividad estaba garantizada por la rúbrica de evaluación.", "Una rúbrica ayuda a la objetividad, pero no elimina el conflicto de intereses; además, presentar la decisión solo como temor a una sanción desconoce su sentido ético.", false]]}]}, {"comp": "competencias_blandas", "rol": "docente", "tag": "Competencias blandas y ciudadanas · Protección de datos de los estudiantes (Ley 1581 de 2012)", "texto": "Usted es director de grupo de quinto en una escuela oficial y administra un grupo de WhatsApp con los 34 acudientes del curso. Al cerrar el periodo, una madre le pide que publique en el grupo el listado de notas «para que cada uno sepa cómo va su hijo frente a los demás». La docente de apoyo le envió por correo el PIAR de Mateo, que incluye información de salud. En el chat, un padre pide «la lista de los niños que tienen problemas» para saber con quién se junta su hijo.", "items": [{"id": "CB-116", "niv": 1, "e": "Frente a la solicitud de publicar el listado de notas en el grupo, usted", "f": "Ley 1581 de 2012, arts. 3 y 4.", "o": [["A", "publica el listado completo, porque las calificaciones son información académica que la comunidad educativa tiene derecho a conocer.", "La transparencia es un valor, pero las notas de cada estudiante solo deben conocerlas él y su familia; publicarlas en un grupo masivo vulnera el principio de acceso y circulación restringida.", false], ["B", "publica el listado usando las iniciales de cada estudiante, para que las familias identifiquen a su hijo sin exponer los nombres.", "Usar iniciales parece proteger a los niños, pero en un grupo de 34 familias que se conocen los estudiantes siguen siendo identificables, y un dato que puede asociarse a una persona determinable sigue siendo dato personal.", false], ["C", "informa los resultados a cada familia de manera individual y, si lo ve útil, comparte en el grupo solo datos generales del curso.", "Las calificaciones asociadas a un estudiante son datos personales (Ley 1581 de 2012, art. 3) y su circulación debe restringirse a quienes tienen derecho a conocerlos (art. 4, literal f). Los datos generales sin identificar a nadie no exponen a ningún niño.", true]]}, {"id": "CB-117", "niv": 1, "e": "Respecto al PIAR de Mateo que recibió por correo, la manera adecuada de manejarlo es", "f": "Ley 1581 de 2012, arts. 4, 5 y 6; Ley 1098 de 2006, art. 33.", "o": [["A", "contar en el grupo de familias que Mateo tiene un diagnóstico, para que comprendan sus reacciones y lo apoyen.", "La intención de generar comprensión es buena, pero divulga un dato sensible de un niño sin autorización y puede exponerlo a estigmatización (Ley 1581, arts. 5 y 6; Ley 1098, art. 33).", false], ["B", "usarlo para planear los ajustes en el aula y guardarlo con acceso restringido, sin reenviarlo a quienes no participan en su atención.", "El PIAR contiene datos sensibles, como información de salud (Ley 1581 de 2012, art. 5). Debe usarse para su finalidad pedagógica y protegerse con medidas de seguridad y confidencialidad (art. 4, literales b, g y h).", true], ["C", "imprimirlo y dejarlo en la carpeta del curso en la sala de profesores, para que lo consulten los docentes que entran al grupo.", "Es cierto que otros docentes del grupo necesitan conocer los ajustes, pero dejar el documento en un espacio abierto permite el acceso de cualquier persona y desconoce el principio de seguridad.", false]]}, {"id": "CB-118", "niv": 2, "e": "Sobre el padre que pide «la lista de los niños que tienen problemas», usted", "f": "Ley 1581 de 2012, art. 4; Ley 1098 de 2006, art. 33.", "o": [["A", "le responde en privado que no puede dar información de otros niños y le pregunta qué le preocupa de su hijo.", "La información de otros estudiantes no puede entregarse a terceros sin autorización, y esa reserva obliga a todas las personas de la institución, incluida la orientadora (Ley 1581 de 2012, art. 4, literales f y h). Atender en privado la preocupación del padre protege a los niños y mantiene la comunicación con la familia.", true], ["B", "remite la pregunta a la orientadora escolar para que ella decida qué información puede entregarle al padre.", "Consultar a orientación es razonable en muchos casos, pero aquí nadie en la institución, tampoco la orientadora, puede entregar a un padre información de otros niños sin autorización de sus representantes. Remitirla sugiere que podría entregarse y deja la petición abierta.", false], ["C", "le comparte solo los nombres, sin los diagnósticos, para que pueda orientar a su hijo sin conocer detalles de salud.", "Omitir los diagnósticos parece prudente, pero señalar qué niños «tienen problemas» ya revela información sensible sobre ellos y puede llevar a que sean excluidos.", false]]}, {"id": "CB-119", "niv": 3, "e": "Para prevenir situaciones similares, la acción más coherente con la protección de datos de los estudiantes es", "f": "Ley 1581 de 2012, arts. 4 y 7; Decreto 1377 de 2013, art. 12.", "o": [["A", "pedir a cada familia que firme una autorización general para compartir en el grupo cualquier información de su hijo.", "Busca cumplir con la autorización, pero esta debe ser informada y para una finalidad concreta; una autorización general no permite divulgar datos sensibles ni responde al interés superior del niño (Decreto 1377 de 2013, art. 12).", false], ["B", "cerrar el grupo de WhatsApp y comunicarse con las familias solo mediante circulares impresas, para eliminar el riesgo.", "Elimina un riesgo, pero sacrifica un canal útil de comunicación con las familias y no forma a nadie en el uso responsable de la información.", false], ["C", "proponer acuerdos sobre el uso de los grupos de mensajería y formar a las familias sobre los riesgos de divulgar información de los niños.", "El artículo 7 de la Ley 1581 de 2012 asigna a las entidades educativas la tarea de informar y capacitar a los representantes legales sobre los riesgos del tratamiento indebido de los datos de niños, niñas y adolescentes.", true]]}]}, {"comp": "competencias_blandas", "rol": "docente", "tag": "Competencias blandas y ciudadanas · Competencias ciudadanas: participación y responsabilidad democrática (Guía 6)", "texto": "Al iniciar el año, usted asume la dirección de grupo de noveno en un colegio oficial. El grupo tiene fama de «indisciplinado» y el año anterior acumuló muchas anotaciones en el observador. Usted quiere que los estudiantes construyan acuerdos de convivencia para el aula. En la primera sesión proponen, entre otras, dos normas: «nadie puede llamar a los papás» y «el que llegue tarde no entra al salón».", "items": [{"id": "CB-153", "niv": 1, "e": "Un mes después, varios estudiantes incumplen el acuerdo de puntualidad que el grupo votó, el cual prevé reponer el trabajo perdido en un espacio acordado. Usted", "f": "MEN (2004). Estándares Básicos de Competencias Ciudadanas, Serie Guías n.º 6 (participación y responsabilidad democrática).", "o": [["A", "convoca una nueva asamblea para revisar si el acuerdo sigue siendo adecuado antes de aplicar la consecuencia.", "Revisar los acuerdos es legítimo en otro momento, pero hacerlo justo cuando hay incumplimientos transmite que las normas votadas se negocian cada vez que alguien las rompe.", false], ["B", "aplica a quienes incumplieron la consecuencia acordada, de la misma manera para todos.", "Las normas construidas democráticamente obligan a quienes las acordaron; aplicarlas con igualdad da credibilidad a la participación y forma en responsabilidad democrática (Guía 6). La consecuencia es formativa, como corresponde al manual.", true], ["C", "les da una última oportunidad sin consecuencias, para no afectar el buen clima que ha logrado el grupo.", "Cuida el clima, pero dejar sin efecto la norma acordada debilita su sentido y es injusto con quienes sí cumplen.", false]]}, {"id": "CB-154", "niv": 2, "e": "Ante la propuesta «el que llegue tarde no entra al salón», usted", "f": "MEN (2004). Estándares Básicos de Competencias Ciudadanas, Serie Guías n.º 6 (participación y responsabilidad democrática; competencias cognitivas).", "o": [["A", "la acepta, porque fue votada por la mayoría y refleja la voluntad del grupo en ejercicio de su participación.", "Respeta la decisión mayoritaria, pero la Guía 6 advierte que las decisiones colectivas deben respetar los derechos fundamentales de cada persona.", false], ["B", "invita al grupo a analizar sus efectos sobre el derecho a la educación y a proponer una alternativa formativa.", "La Guía 6 señala que las decisiones democráticas deben respetar los derechos fundamentales. Analizar consecuencias es una competencia cognitiva, y construir la alternativa con el grupo mantiene la deliberación.", true], ["C", "la descarta de inmediato y explica que contradice los derechos de los estudiantes, para no perder tiempo.", "Su argumento es correcto, pero cerrar la discusión desde la autoridad desaprovecha la oportunidad de que el grupo comprenda por qué la norma no es válida.", false]]}, {"id": "CB-155", "niv": 3, "e": "Frente a la propuesta «nadie puede llamar a los papás», usted", "f": "Ley 1620 de 2013, art. 5; MEN (2004). Estándares Básicos de Competencias Ciudadanas, Serie Guías n.º 6 (participación y responsabilidad democrática).", "o": [["A", "explica al grupo por qué esa norma no puede incluirse, dado que la familia es corresponsable, y le pregunta qué le preocupa.", "La corresponsabilidad de la familia, la escuela y la sociedad es un principio del sistema de convivencia escolar (Ley 1620 de 2013, art. 5); un acuerdo de aula no puede suprimirla. Explicar la razón forma al grupo sin someter a votación lo que no es negociable.", true], ["B", "somete la propuesta a debate y votación del grupo, para que los estudiantes decidan si la adoptan o no.", "Deliberar es valioso, pero someter a votación un principio legal crea la expectativa de que la mayoría puede suprimir la comunicación con las familias, lo cual no es posible.", false], ["C", "la acepta para ganar la confianza del grupo, siempre que los estudiantes cumplan con las demás normas acordadas.", "Ganar la confianza del grupo es valioso, pero la comunicación con las familias no es negociable porque responde a la corresponsabilidad en la formación.", false]]}]}, {"comp": "competencias_blandas", "rol": "docente", "tag": "Competencias blandas y ciudadanas · Protección de datos de los estudiantes (Ley 1581 de 2012)", "texto": "Usted es docente de tercero en una escuela oficial. La orientadora le informó, de manera reservada, que una estudiante, Valentina, está recibiendo atención psicológica por una situación familiar. A la salida, la madre de otro niño, amiga de la familia de Valentina, le pregunta a usted qué le pasa a la niña «porque la ve muy triste». Además, la escuela celebró el Día de la Familia y usted tomó fotos de los estudiantes que quiere publicar en su perfil personal de Facebook.", "items": [{"id": "CB-156", "niv": 1, "e": "A la madre que pregunta por Valentina, usted", "f": "Ley 1581 de 2012, arts. 4 y 5; Ley 1098 de 2006, art. 33.", "o": [["A", "le pide discreción, pero le confirma que Valentina recibe apoyo psicológico para que pueda acompañarla.", "La intención de sumar apoyo es buena, pero revela un dato sensible de salud a una tercera persona sin autorización.", false], ["B", "le comenta en términos generales que Valentina atraviesa una situación familiar difícil, sin dar más detalles.", "Omitir detalles parece prudente, pero confirmar que existe una situación familiar ya revela información reservada de la niña y de su familia.", false], ["C", "le agradece su interés y le explica que no puede compartir información sobre otros estudiantes.", "La información sobre la salud de una niña es un dato sensible (Ley 1581 de 2012, art. 5) que debe mantenerse en reserva (art. 4, literal h), y su divulgación afectaría su intimidad (Ley 1098 de 2006, art. 33).", true]]}, {"id": "CB-157", "niv": 3, "e": "Sobre las fotos del Día de la Familia, usted", "f": "Ley 1581 de 2012, arts. 3 y 4; Decreto 1377 de 2013, art. 12.", "o": [["A", "las publica en su perfil con una configuración de privacidad, para que solo sus contactos cercanos puedan verlas.", "Limitar la audiencia reduce el riesgo, pero sigue siendo una publicación en una red personal sin autorización de las familias ni finalidad institucional.", false], ["B", "las publica en su perfil después de ocultar el rostro de los niños cuyos padres no las han autorizado.", "Muestra cuidado, pero las autorizaciones que dan las familias son para los fines de la institución, no para la red personal de un docente.", false], ["C", "no las publica en su perfil y las entrega a la institución para su uso según lo autorizado por las familias.", "Las imágenes de los niños son datos personales cuyo tratamiento debe responder a una finalidad informada y autorizada por sus representantes (Ley 1581 de 2012, arts. 3 y 4; Decreto 1377 de 2013, art. 12). Un perfil personal no es una finalidad institucional autorizada.", true]]}, {"id": "CB-158", "niv": 2, "e": "Si un día Valentina le cuenta en privado que en su casa la golpean y le pide que no le diga a nadie, usted", "f": "Ley 1098 de 2006, art. 44, nums. 2 y 9.", "o": [["A", "le explica que no puede guardar ese secreto porque debe protegerla, y reporta de inmediato según la ruta institucional.", "Las instituciones educativas deben detectar y reportar a las autoridades competentes las situaciones de maltrato (Ley 1098 de 2006, art. 44, nums. 2 y 9); el docente activa la ruta de la institución para que se haga ese reporte. Decirle la verdad a la niña cuida su confianza.", true], ["B", "le promete reserva y sigue conversando con ella en los próximos días para ganarse su confianza antes de actuar.", "Busca fortalecer el vínculo, pero aplazar el reporte deja a la niña expuesta a nuevas agresiones y la promesa de reserva no puede cumplirse.", false], ["C", "cita a la madre para conversar con ella sobre lo que le contó la niña y acordar juntas cómo apoyarla.", "Involucrar a la familia parece natural, pero sin activar la ruta puede exponer a la niña a represalias en su casa; la valoración y protección corresponden a las instancias de la ruta.", false]]}, {"id": "CB-159", "niv": 3, "e": "Si la orientadora le pide registrar sus observaciones sobre Valentina, usted las consigna", "f": "Ley 1581 de 2012, art. 4.", "o": [["A", "con una interpretación detallada de las causas familiares de su tristeza, para facilitar el trabajo de la orientadora.", "Quiere aportar a la orientadora, pero mezcla hechos con suposiciones sobre la familia que pueden ser inexactos; el principio de veracidad exige información comprobable.", false], ["B", "describiendo conductas observadas con fecha y contexto, sin juicios sobre la familia, y las entrega por el canal reservado.", "La información debe ser veraz, exacta y comprobable (Ley 1581 de 2012, art. 4, literal d) y manejarse con seguridad y confidencialidad (literales g y h). Describir hechos, y no interpretaciones, protege a la niña y a su familia.", true], ["C", "en el observador de la estudiante, que es el registro oficial de su proceso y lo pueden consultar los docentes del grado.", "El observador es un registro oficial, pero allí la información queda al alcance de personas que no participan en la atención, lo que desconoce el principio de circulación restringida.", false]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Convivencia escolar (Ley 1620 de 2013 y Decreto 1965 de 2013)", "texto": "Usted es director de grupo de séptimo grado. Una estudiante le cuenta, muy afectada, que desde hace tres semanas dos compañeros del curso publican en un grupo de WhatsApp fotos suyas editadas con apodos ofensivos y que varios estudiantes las reenvían. La estudiante no ha sufrido agresiones físicas, pero dice que no quiere volver al colegio. Las imágenes no tienen contenido sexual ni íntimo. Los dos compañeros reconocen que hicieron las publicaciones «en broma».", "items": [{"id": "CV-001", "niv": 1, "e": "De acuerdo con el Decreto 1965 de 2013, la situación descrita se clasifica como", "f": "Decreto 1965 de 2013, artículos 39 (numerales 3 y 5) y 40.", "o": [["A", "una situación tipo III, porque difundir imágenes ofensivas por redes sociales constituye un delito.", "No toda difusión de imágenes es delito. El Tipo III aplica a presuntos delitos, por ejemplo contra la libertad, integridad y formación sexual; las fotos editadas con apodos ofensivos son agresión electrónica (Tipo II).", false], ["B", "una situación tipo I, porque no hubo daño al cuerpo ni a la salud de la estudiante.", "El Tipo I comprende conflictos manejados inadecuadamente y situaciones esporádicas. Aquí hay agresión electrónica repetida durante tres semanas, lo que encaja en el Tipo II aunque no haya daño físico.", false], ["C", "una situación tipo II, porque es ciberacoso repetido que no reviste las características de un delito.", "El artículo 40 del Decreto 1965 de 2013 clasifica como Tipo II la agresión escolar, el acoso y el ciberacoso que no sean delito y que se presenten de manera repetida o sistemática. Las publicaciones ofensivas durante tres semanas cumplen esa condición.", true]]}, {"id": "CV-002", "niv": 2, "e": "Una vez conocida la situación, frente a las familias lo que corresponde según el protocolo es", "f": "Decreto 1965 de 2013, artículo 43, numeral 4.", "o": [["A", "informar de inmediato solo a la familia de la estudiante afectada, para proteger la identidad de los demás.", "El protocolo exige informar a los padres o acudientes de todos los estudiantes involucrados, no solo de la víctima. La intimidad se protege con la reserva de la información, no omitiendo informar.", false], ["B", "informar de manera inmediata a los padres o acudientes de todos los estudiantes involucrados.", "El artículo 43, numeral 4, del Decreto 1965 de 2013 establece para las situaciones Tipo II informar de manera inmediata a los padres, madres o acudientes de todos los estudiantes involucrados, dejando constancia.", true], ["C", "esperar a que el comité escolar de convivencia sesione para decidir a qué familias se informa.", "La norma exige informar de manera inmediata; esperar a la sesión del comité retrasa una actuación que no depende de su decisión.", false]]}, {"id": "CV-003", "niv": 2, "e": "En el manejo de la situación por parte del comité escolar de convivencia, la responsabilidad de reportar el caso en el Sistema de Información Unificado de Convivencia Escolar corresponde a", "f": "Decreto 1965 de 2013, artículo 43, numeral 9; Ley 1620 de 2013, artículos 12 y 19.", "o": [["A", "el presidente del comité escolar de convivencia.", "El artículo 43, numeral 9, del Decreto 1965 de 2013 asigna al presidente del comité escolar de convivencia reportar la información del caso en el aplicativo del Sistema de Información Unificado de Convivencia Escolar.", true], ["B", "el director de grupo que recibió la queja de la estudiante.", "El docente debe identificar, reportar al comité y hacer seguimiento (Ley 1620, art. 19), pero el reporte al sistema de información lo hace el presidente del comité.", false], ["C", "el docente con función de orientación escolar de la institución.", "El orientador integra el comité escolar de convivencia (Ley 1620, art. 12), pero la norma asigna el reporte al sistema de información a su presidente.", false]]}, {"id": "CV-004", "niv": 2, "e": "Si se estableciera que entre las imágenes difundidas hay contenido íntimo de carácter sexual de la estudiante, el presidente del comité debe", "f": "Decreto 1965 de 2013, artículos 40 (numeral 3) y 44 (numerales 3 y 4).", "o": [["A", "aplicar el protocolo de situaciones Tipo II y remitir el caso a la comisaría de familia.", "Un presunto delito contra la libertad, integridad y formación sexual corresponde al Tipo III (art. 40, num. 3), cuyo protocolo exige informar a la Policía Nacional.", false], ["B", "poner la situación en conocimiento de la Policía Nacional de inmediato y por el medio más expedito.", "La difusión de contenido sexual de una menor constituye un presunto delito, es decir, una situación Tipo III. El artículo 44, numeral 3, del Decreto 1965 de 2013 ordena al presidente del comité informar de inmediato a la Policía Nacional.", true], ["C", "citar al comité para que decida si el caso amerita ser remitido a una autoridad externa.", "En una situación Tipo III la puesta en conocimiento de la Policía no depende de una decisión previa del comité; el comité se cita, pero «no obstante» lo anterior, la autoridad se informa de inmediato.", false]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Estatuto de Profesionalización Docente (Decreto 1278 de 2002)", "texto": "Laura es ingeniera ambiental y superó el concurso de méritos para el cargo de docente de ciencias naturales. Fue nombrada en período de prueba el 15 de agosto en una institución con calendario A, cuyo año escolar termina el 30 de noviembre. Durante su inducción, pregunta a la coordinadora cómo será su evaluación y qué debe hacer para inscribirse en el escalafón.", "items": [{"id": "ED-001", "niv": 2, "e": "Sobre la evaluación del período de prueba, la coordinadora le explica correctamente que", "f": "Decreto 1278 de 2002, artículos 12 y 31.", "o": [["A", "como no alcanzará cuatro meses de servicio este año, su evaluación será al terminar el año siguiente.", "Los artículos 12 y 31 del Decreto 1278 de 2002 señalan que el período de prueba se evalúa al terminar el año escolar si se ha servido el cargo al menos cuatro meses; de lo contrario, se espera hasta el año académico siguiente.", true], ["B", "será evaluada al terminar este año escolar, porque ya habrá cumplido cuatro meses en el cargo.", "Entre el 15 de agosto y el 30 de noviembre hay tres meses y medio, menos de cuatro meses. El artículo 31 del Decreto 1278 exige haber servido no menos de cuatro meses durante el año; si no se cumplen, se espera al año académico siguiente.", false], ["C", "su evaluación se hará cuando cumpla doce meses en el cargo, sin importar el calendario escolar.", "El Decreto 1278 no fija un plazo de doce meses: la evaluación se hace al terminar el año escolar y exige un mínimo de cuatro meses de servicio en ese año.", false]]}, {"id": "ED-002", "niv": 1, "e": "Como Laura no es licenciada, al término del período de prueba deberá acreditar que", "f": "Decreto 1278 de 2002, artículo 12, parágrafo 1.", "o": [["A", "obtuvo un título de licenciatura en ciencias naturales, para poder continuar en el cargo docente.", "La norma no exige obtener una licenciatura; permite acreditar un posgrado en educación o un programa de pedagogía.", false], ["B", "tiene al menos dos años de experiencia docente certificada en instituciones públicas o privadas.", "El Decreto 1278 no establece ese requisito para superar el período de prueba; lo que exige a los no licenciados es formación pedagógica.", false], ["C", "cursa o terminó un posgrado en educación o un programa de pedagogía en una institución de educación superior.", "El parágrafo 1 del artículo 12 del Decreto 1278 de 2002 exige a los profesionales con título diferente al de licenciado acreditar, al término del período de prueba, que cursan o terminaron un posgrado en educación o un programa de pedagogía.", true]]}, {"id": "ED-003", "niv": 2, "e": "Si Laura obtiene 65 % en la evaluación del período de prueba, entonces", "f": "Decreto 1278 de 2002, artículos 21 y 31.", "o": [["A", "será inscrita en el grado tres del escalafón, porque superó el período de prueba con calificación satisfactoria.", "Supera el período de prueba, pero el grado tres exige maestría o doctorado (art. 21). El grado depende de los títulos que acredite.", false], ["B", "deberá repetir el período de prueba, porque el puntaje satisfactorio mínimo es del 70 %.", "El artículo 31 del Decreto 1278 fija como satisfactoria una calificación igual o superior al 60 %, no al 70 %.", false], ["C", "será inscrita en el escalafón en el grado que corresponda según los títulos que acredite.", "El artículo 31 del Decreto 1278 de 2002 considera satisfactoria una calificación igual o superior al 60 %; quien la obtiene es inscrito en el escalafón en el grado que corresponda según sus títulos académicos.", true]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Niveles y objetivos de la educación formal (Ley 115 de 1994)", "texto": "Usted es docente en una institución rural de Boyacá que ofrece desde transición hasta grado once, con media académica y media técnica agropecuaria. Este año le asignaron horas en transición y en la media, y debe ajustar su planeación a los objetivos que la ley fija para cada nivel. En la reunión con acudientes de décimo, un padre pregunta si en la media académica «se dejan de ver» algunas áreas de la básica, y otra madre pregunta si el título de bachiller técnico le permite a su hijo entrar a la universidad o solo sirve para trabajar.", "items": [{"id": "NR-114", "niv": 1, "e": "Al planear para el grado de transición, usted identifica como objetivo específico del nivel preescolar", "f": "Ley 115 de 1994, artículos 16, 22 y 30.", "o": [["A", "la profundización en un campo específico del conocimiento de acuerdo con los intereses y capacidades del educando.", "Es el literal a) del artículo 30, objetivo específico de la educación media académica.", false], ["B", "el conocimiento del propio cuerpo y de sus posibilidades de acción, y la adquisición de identidad y autonomía.", "Es el literal a) del artículo 16 de la Ley 115, que fija los objetivos específicos del nivel preescolar.", true], ["C", "la iniciación en los campos más avanzados de la tecnología moderna y en técnicas de utilidad social.", "Corresponde al literal g) del artículo 22, que fija objetivos específicos del ciclo de secundaria, no del preescolar.", false]]}, {"id": "NR-115", "niv": 2, "e": "A la pregunta sobre el título de bachiller técnico, usted responde correctamente que la media técnica", "f": "Ley 115 de 1994, artículos 28, 32 y 33.", "o": [["A", "prepara para el desempeño laboral y para continuar en la educación superior, y su título habilita para ingresar a ella.", "El artículo 32 dispone que la media técnica prepara para el desempeño laboral y para la continuación en la educación superior; el artículo 28 señala que al término de la media se obtiene el título de bachiller, que habilita para ingresar a la educación superior en cualquiera de sus niveles y carreras.", true], ["B", "prepara solo para el trabajo, por lo que el joven debe validar la media académica para ir a la universidad.", "El literal c) del artículo 33 incluye entre los objetivos de la media técnica la formación que permita el ingreso a la educación superior; no es necesario validar la media académica.", false], ["C", "prepara para el trabajo, y su título solo permite ingresar a programas técnicos del mismo sector productivo.", "El artículo 28 no limita el título de la media técnica: habilita para la educación superior en cualquiera de sus niveles y carreras.", false]]}, {"id": "NR-116", "niv": 3, "e": "Sobre las áreas de la media académica, usted aclara al padre que, según la Ley 115 de 1994,", "f": "Ley 115 de 1994, artículo 31 y parágrafo.", "o": [["A", "las áreas de la básica se sustituyen por las asignaturas de profundización que elija cada estudiante.", "El parágrafo del artículo 31 permite intensificar en ciertos campos según la vocación del estudiante, pero aclara que todas las áreas de la media académica siguen siendo obligatorias y fundamentales.", false], ["B", "se mantienen las áreas de la básica en un nivel más avanzado, y se suman ciencias económicas, políticas y filosofía.", "El artículo 31 dispone que en la media académica son obligatorias y fundamentales las mismas áreas de la educación básica en un nivel más avanzado, además de las ciencias económicas, políticas y la filosofía.", true], ["C", "solo son obligatorias las áreas evaluadas en el examen de Estado, y las demás pasan a ser optativas.", "Ninguna norma reduce las áreas obligatorias a las que evalúa el examen de Estado; el artículo 31 mantiene todas las áreas de la básica.", false]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Manual de convivencia (Ley 115 de 1994; Ley 1098 de 2006; Ley 2025 de 2020)", "texto": "En una institución oficial de Soacha, el comité encargado de actualizar el manual de convivencia recibe dos propuestas de un grupo de acudientes: que los estudiantes que lleguen tarde tres veces limpien los baños durante el descanso frente a sus compañeros, «para que aprendan», y que a los padres que falten a la escuela de padres se les cobre una multa de $20.000 destinada al fondo de la institución. Usted, como representante de los docentes en el comité, debe pronunciarse sobre la legalidad de ambas propuestas antes de que el texto pase al consejo directivo.", "items": [{"id": "NR-123", "niv": 1, "e": "Sobre el alcance del manual una vez sea adoptado, usted recuerda que, según la Ley 115 de 1994, los padres y los estudiantes", "f": "Ley 115 de 1994, artículo 87; Decreto 1860 de 1994, artículo 17.", "o": [["A", "lo aceptan al firmar la matrícula, acto en el que los padres actúan en representación de sus hijos.", "El artículo 87 de la Ley 115 establece que el manual define los derechos y obligaciones de los estudiantes y que los padres o tutores y los educandos, al firmar la matrícula correspondiente en representación de sus hijos, lo aceptan.", true], ["B", "solo quedan obligados si firman un acta de adhesión independiente al inicio de cada período.", "La ley vincula la aceptación del manual a la firma de la matrícula; no exige actas de adhesión por período.", false], ["C", "quedan obligados los estudiantes, pero no los padres o acudientes, porque estos no hacen parte del manual.", "El artículo 87 menciona expresamente a los padres o tutores entre quienes aceptan el manual al firmar la matrícula; además, el manual regula las relaciones de los estudiantes con los demás estamentos (Decreto 1860 de 1994, artículo 17).", false]]}, {"id": "NR-124", "niv": 2, "e": "Frente a la propuesta de que los estudiantes impuntuales limpien los baños ante sus compañeros, usted debe señalar que", "f": "Ley 1098 de 2006, artículo 45.", "o": [["A", "puede incluirse como medida restaurativa, siempre que se aplique una sola vez y con acompañamiento del docente.", "Una medida restaurativa repara el daño y respeta la dignidad; exponer al estudiante ante sus compañeros es humillante, sin importar su duración, y el artículo 45 lo prohíbe.", false], ["B", "puede incluirse si la aprueba la mayoría de los padres en la asamblea general y queda escrita en el manual.", "La aprobación de los padres no vuelve legal una sanción humillante: la prohibición del artículo 45 de la Ley 1098 no admite excepciones por votación.", false], ["C", "no puede incluirse, porque la ley prohíbe sanciones que afecten la dignidad de los estudiantes, también en el manual.", "El artículo 45 de la Ley 1098 de 2006 prohíbe a directivos y educadores imponer sanciones que conlleven maltrato físico o psicológico o adoptar medidas que afecten la dignidad de los estudiantes, y prohíbe su inclusión en los manuales de convivencia bajo cualquier modalidad.", true]]}, {"id": "NR-125", "niv": 2, "e": "Respecto de la multa a los padres que no asistan a la escuela de padres, usted explica que", "f": "Ley 2025 de 2020, artículo 4.", "o": [["A", "procede, porque la asistencia es obligatoria desde que los padres firman el compromiso en la matrícula.", "Es cierto que los padres firman el compromiso de asistir al matricular (artículo 4), pero la misma norma limita las consecuencias de la inasistencia a sanciones pedagógicas no pecuniarias.", false], ["B", "no procede, porque la ley
