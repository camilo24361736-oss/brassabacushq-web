 Al revisar la hoja de Valentina, observa que planteó bien la ecuación, pero al despejar la incógnita no cambió el signo de un término al pasarlo al otro lado de la igualdad, error que repite en dos ejercicios. Al terminar el período, usted debe asignar la valoración de la unidad según el sistema institucional de evaluación de los estudiantes (SIEE), cuyos criterios se socializaron al comenzar el año.", "items": [{"id": "PD-119", "niv": 1, "e": "La práctica de las hojas de salida al final de cada clase corresponde principalmente a una evaluación", "f": "Black, P. y Wiliam, D. (1998). Inside the black box: raising standards through classroom assessment; Decreto 1290 de 2009, artículo 3.", "o": [["A", "diagnóstica, porque solo se aplica antes de iniciar una unidad para identificar los saberes previos.", "La evaluación diagnóstica se aplica típicamente al inicio de un proceso; aquí las hojas se usan en cada clase a lo largo de la unidad para ajustar sobre la marcha.", false], ["B", "formativa, porque usa la información durante el proceso para ajustar la enseñanza y orientar al estudiante.", "La evaluación formativa recoge evidencia durante el aprendizaje y la usa para adaptar la enseñanza y orientar al estudiante (Black y Wiliam, 1998). Decidir qué retomar en la clase siguiente es un uso formativo.", true], ["C", "sumativa, porque registra el resultado de cada clase para promediarlo al terminar el período.", "Las hojas no tienen nota ni se promedian; su función no es certificar un resultado final sino informar las decisiones de enseñanza mientras el proceso ocurre.", false]]}, {"id": "PD-120", "niv": 3, "e": "Usar las hojas de salida para reorganizar la clase siguiente es coherente con el propósito de la evaluación institucional que el Decreto 1290 de 2009 describe como", "f": "Decreto 1290 de 2009, artículo 3 (compilado en el Decreto 1075 de 2015).", "o": [["A", "proporcionar información básica para consolidar o reorientar los procesos educativos del estudiante.", "El artículo 3, numeral 2, del Decreto 1290 de 2009 establece como propósito de la evaluación de los estudiantes proporcionar información básica para consolidar o reorientar los procesos educativos relacionados con su desarrollo integral.", true], ["B", "determinar la promoción de los estudiantes al finalizar el año escolar.", "Determinar la promoción es otro propósito del artículo 3, pero corresponde a la decisión de final de año, no al ajuste de la clase siguiente que describe el enunciado.", false], ["C", "clasificar a los estudiantes según su rendimiento académico para conformar grupos fijos que se mantengan durante el año.", "El Decreto 1290 no incluye entre los propósitos de la evaluación clasificar estudiantes en grupos fijos; su orientación es identificar ritmos y apoyar debilidades y desempeños superiores.", false]]}, {"id": "PD-121", "niv": 2, "e": "Para retroalimentar el error de Valentina de manera que le ayude a mejorar, usted debe", "f": "Hattie, J. y Timperley, H. (2007). The power of feedback; Decreto 1290 de 2009, artículo 3.", "o": [["A", "escribir «revisar» junto a los ejercicios para que ella identifique por sí misma en qué se equivocó.", "Una indicación genérica como «revisar» no informa qué está mal ni cómo corregirlo; la estudiante puede no reconocer el error, ya que lo repite de manera sistemática.", false], ["B", "asignar una valoración baja en la hoja, para que el resultado la motive a esforzarse en la siguiente clase.", "Además de contradecir el carácter sin nota de la actividad, una calificación sola no indica qué debe corregir ni cómo hacerlo, que es la función de la retroalimentación formativa.", false], ["C", "señalarle el paso del despeje donde está el error, explicarle por qué y proponerle ejercicios similares.", "La retroalimentación efectiva es específica, se centra en la tarea y el proceso, y ofrece una vía de mejora (Hattie y Timperley, 2007). Señalar el paso, explicar la regla y dar oportunidad de practicar cumple esas condiciones.", true]]}, {"id": "PD-122", "niv": 3, "e": "De los siguientes comentarios para la hoja de Valentina, el que aporta una retroalimentación más útil para el aprendizaje es", "f": "Hattie, J. y Timperley, H. (2007). The power of feedback (niveles de la retroalimentación).", "o": [["A", "«Planteaste bien la ecuación; al pasar el 5 al otro lado no cambiaste su signo: revisa ese paso en los ejercicios 3 y 5».", "Reconoce lo logrado, describe el error en el proceso y orienta la acción siguiente. Según Hattie y Timperley (2007), la retroalimentación sobre la tarea y el proceso es más útil que la dirigida a la persona.", true], ["B", "«Tienes dos de tres ejercicios incorrectos; antes de la próxima clase estudia de nuevo todo el tema de ecuaciones lineales».", "Informa el resultado, pero no identifica la causa del error ni la acción concreta; «estudiar más» no le dice a la estudiante qué paso debe revisar.", false], ["C", "«¡Eres muy buena en matemáticas, sigue así!», porque el elogio fortalece la confianza y la motivación de la estudiante.", "El elogio general a la persona puede ser bien intencionado, pero no da información sobre el error ni sobre cómo corregirlo; la investigación sobre retroalimentación lo identifica como el tipo menos informativo.", false]]}, {"id": "PD-123", "niv": 3, "e": "Al asignar la valoración de la unidad, la decisión más coherente con un enfoque de evaluación formativa es", "f": "Decreto 1290 de 2009, artículos 4 y 12; MEN (2009). Documento No. 11: Fundamentaciones y orientaciones para la implementación del Decreto 1290 de 2009.", "o": [["A", "promediar las hojas de salida de todas las clases, incluidas las de los primeros días de la unidad.", "Las hojas se aplicaron sin nota y con fin formativo; convertirlas después en calificación cambia las reglas acordadas y penaliza los errores propios del inicio del aprendizaje.", false], ["B", "valorar con los criterios del SIEE socializados al inicio, considerando el avance logrado tras la retroalimentación.", "El artículo 12 del Decreto 1290 reconoce al estudiante el derecho a conocer desde el inicio del año los criterios, procedimientos e instrumentos de evaluación. Valorar con esos criterios y considerar el avance tras la retroalimentación articula lo sumativo con lo formativo.", true], ["C", "basar la valoración en un único examen final escrito, porque es la evidencia más objetiva de lo aprendido en la unidad.", "Un solo examen ofrece una evidencia limitada y desconoce el proceso; el Decreto 1290 promueve una valoración integral del desempeño, con estrategias variadas definidas en el SIEE.", false]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Instrumentos de evaluación: rúbricas", "texto": "Usted es docente de lengua castellana de décimo grado en una institución de Cali. Sus estudiantes deben escribir un ensayo argumentativo sobre el uso del celular en el colegio. El semestre anterior, varios estudiantes reclamaron porque no entendían por qué habían obtenido 3,4 o 4,1 en un texto similar, y los padres pidieron mayor claridad en los criterios. Usted decide construir una rúbrica con cuatro criterios: tesis, argumentos y evidencias, organización del texto y uso de la lengua. Al revisar un borrador de la rúbrica con un colega, este observa que en el nivel superior del criterio «argumentos y evidencias» usted escribió solamente: «Argumenta bien».", "items": [{"id": "PD-124", "niv": 1, "e": "Al explicar a los estudiantes qué es una rúbrica, usted la describe como", "f": "MEN, Decreto 1290 de 2009, artículo 4 (estrategias de valoración integral); literatura sobre evaluación auténtica y rúbricas.", "o": [["A", "una lista de chequeo que indica únicamente si cada elemento solicitado está presente o ausente en el ensayo.", "Eso describe una lista de cotejo, que registra presencia o ausencia de rasgos; no describe grados de calidad en cada criterio.", false], ["B", "una matriz que describe, para cada criterio, distintos niveles de desempeño con descriptores observables.", "Una rúbrica combina criterios de evaluación con niveles de desempeño y descriptores que explican qué caracteriza cada nivel; por eso hace explícitas las expectativas y orienta tanto la valoración como la mejora.", true], ["C", "una escala numérica que asigna puntos a cada criterio sin describir qué caracteriza cada uno de los niveles.", "Una escala de puntos sin descriptores no permite al estudiante comprender qué diferencia un nivel de otro, que es justamente la queja que el caso busca resolver.", false]]}, {"id": "PD-125", "niv": 2, "e": "Si usted quiere que cada estudiante sepa en qué aspecto específico de su ensayo debe mejorar, le conviene usar", "f": "Literatura sobre evaluación del aprendizaje: rúbricas analíticas y holísticas; Decreto 1290 de 2009, artículo 3.", "o": [["A", "una rúbrica holística, porque ofrece una sola valoración global del ensayo y es más rápida de aplicar.", "La rúbrica holística da una apreciación global útil para juicios rápidos, pero no muestra el desempeño por separado en cada criterio, que es lo que se busca.", false], ["B", "una lista de cotejo, porque permite describir con detalle los grados de calidad alcanzados en cada criterio.", "La lista de cotejo registra si un rasgo está o no presente; no describe grados de calidad, por lo que la justificación que se ofrece es incorrecta.", false], ["C", "una rúbrica analítica, porque valora cada criterio por separado y muestra dónde debe mejorar el estudiante.", "La rúbrica analítica descompone el desempeño en criterios con niveles propios; así el estudiante identifica, por ejemplo, que su tesis es clara pero sus evidencias son insuficientes.", true]]}, {"id": "PD-126", "niv": 2, "e": "Para que la rúbrica cumpla su función formativa y responda a la inquietud de los padres, lo adecuado es", "f": "Decreto 1290 de 2009, artículo 12, numeral 2.", "o": [["A", "socializarla al presentar la tarea y usarla con los estudiantes para analizar un ensayo de ejemplo.", "El artículo 12 del Decreto 1290 reconoce al estudiante el derecho a conocer los criterios, procedimientos e instrumentos de evaluación. Compartir la rúbrica desde el inicio y practicar con ella hace visibles las expectativas antes de escribir.", true], ["B", "reservarla solo para el docente, para evitar que los estudiantes escriban únicamente para cumplir con los criterios.", "Ocultar los criterios contradice el derecho del estudiante a conocer los instrumentos de evaluación y mantiene la incertidumbre que originó los reclamos.", false], ["C", "entregarla junto con la nota final, para que los estudiantes comprendan por qué obtuvieron su calificación.", "Entregarla al final explica la nota, pero llega tarde: el estudiante ya no puede usar los criterios para orientar su escritura, que es su principal valor formativo.", false]]}, {"id": "PD-127", "niv": 3, "e": "Para mejorar el descriptor «Argumenta bien» del nivel superior, una redacción adecuada sería", "f": "Literatura sobre diseño de rúbricas (descriptores observables y alineados con el criterio).", "o": [["A", "«Sostiene una tesis explícita con al menos dos argumentos apoyados en evidencias pertinentes».", "Un buen descriptor es específico, observable y está alineado con el criterio: indica qué debe aparecer en el texto (tesis, argumentos, evidencias) y permite distinguir este nivel de los demás.", true], ["B", "«Demuestra un excelente esfuerzo y dedicación durante todo el proceso de elaboración del ensayo argumentativo».", "El esfuerzo es valioso, pero no es observable en el texto ni describe la calidad de la argumentación, que es el criterio que se está evaluando.", false], ["C", "«Escribe un ensayo de mínimo dos páginas, con buena presentación, letra legible y sin tachones ni enmendaduras».", "Describe rasgos de extensión y presentación, no de argumentación; un texto largo y limpio puede tener argumentos débiles.", false]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Diseño Universal para el Aprendizaje (DUA) en la planeación", "texto": "Usted orienta ciencias naturales en quinto grado en una institución de Riohacha. En su grupo de 32 estudiantes están Mateo, que tiene baja visión, y Yanelis, una niña wayuu cuya lengua materna es el wayuunaiki y que todavía presenta dificultades con el castellano escrito. También hay estudiantes con intereses muy diversos. Usted debe planear la unidad sobre el sistema digestivo y quiere hacerlo desde el Diseño Universal para el Aprendizaje (DUA), como lo plantea la normativa de educación inclusiva. El año anterior, otro docente planeaba una sola clase para «el estudiante promedio» y después hacía ajustes individuales cuando alguien no lograba seguirla.", "items": [{"id": "PD-164", "niv": 1, "e": "Al planear la unidad desde el DUA, usted parte de", "f": "Decreto 1421 de 2017 (compilado en el Decreto 1075 de 2015): definiciones de diseño universal del aprendizaje y ajustes razonables.", "o": [["A", "planear para el estudiante promedio y luego hacer ajustes individuales a quienes no logren seguir la clase.", "Esa es la lógica que el DUA busca superar: diseñar para un estudiante «promedio» y adaptar después produce barreras que podrían haberse previsto desde el diseño.", false], ["B", "diseñar desde el inicio opciones variadas para que todos accedan, participen y demuestren lo aprendido.", "El Decreto 1421 de 2017 define el DUA como un diseño de productos, entornos, programas y servicios que puedan utilizar todas las personas, en la mayor medida posible, sin necesidad de adaptación ni diseño especializado; en el aula se traduce en planear desde el inicio múltiples opciones.", true], ["C", "esperar a recibir el diagnóstico médico de cada estudiante antes de definir cualquier ajuste en la planeación.", "El DUA es una estrategia para todo el grupo y no depende de diagnósticos; la normativa aclara que tampoco los ajustes razonables dependen de un diagnóstico médico, sino de las barreras identificadas.", false]]}, {"id": "PD-165", "niv": 3, "e": "De las siguientes acciones, la que corresponde al principio del DUA de proporcionar múltiples formas de representación es", "f": "CAST (2018). Pautas sobre el Diseño Universal para el Aprendizaje; Decreto 1421 de 2017 (compilado en el Decreto 1075 de 2015).", "o": [["A", "ofrecer opciones de subtemas según los intereses de los estudiantes, para mantener su motivación durante la unidad.", "Dar opciones según los intereses para sostener la motivación corresponde al principio de múltiples formas de implicación o compromiso, no al de representación.", false], ["B", "permitir que los estudiantes entreguen su trabajo como texto escrito, maqueta o exposición oral, según prefieran.", "Ofrecer distintas formas de mostrar lo aprendido corresponde al principio de múltiples formas de acción y expresión, no al de representación.", false], ["C", "presentar la misma información con texto ampliado, audio, imágenes y modelos que los estudiantes puedan manipular.", "El principio de representación se refiere a ofrecer la información por distintos medios y formatos para que todos puedan percibirla y comprenderla (CAST); el texto ampliado y el audio, por ejemplo, benefician a Mateo y al resto del grupo.", true]]}, {"id": "PD-166", "niv": 3, "e": "Si, a pesar de las opciones del DUA, Mateo sigue encontrando barreras para leer los textos de la unidad, corresponde", "f": "Decreto 1421 de 2017 (compilado en el Decreto 1075 de 2015): ajustes razonables y PIAR.", "o": [["A", "definir ajustes razonables específicos, como material ampliado o lupa, y registrarlos en su PIAR.", "Según el Decreto 1421 de 2017, los ajustes razonables son las acciones, adaptaciones y apoyos que se requieren cuando persisten barreras a pesar del DUA; se definen a partir de la valoración pedagógica y se consignan en el PIAR.", true], ["B", "esperar a que la familia entregue un diagnóstico médico actualizado para poder hacer cualquier tipo de ajuste.", "El Decreto 1421 aclara que los ajustes razonables no dependen de un diagnóstico médico, sino de las barreras que enfrenta el estudiante; esperar retrasa apoyos que se necesitan ya.", false], ["C", "excluirlo de las actividades de lectura y valorar únicamente su participación oral durante el período.", "Excluirlo de la lectura limita su derecho a la educación en igualdad de condiciones; lo que procede es eliminar la barrera con apoyos específicos, no retirar la actividad.", false]]}, {"id": "PD-167", "niv": 2, "e": "Para apoyar a Yanelis en la unidad, una estrategia coherente con el DUA es", "f": "CAST (2018). Pautas sobre el Diseño Universal para el Aprendizaje; Decreto 1421 de 2017 (compilado en el Decreto 1075 de 2015).", "o": [["A", "ubicarla temporalmente en un grado inferior mientras domina el castellano escrito, para que no se atrase.", "Cambiarla de grado por la lengua confunde una barrera lingüística con falta de aprendizaje y desconoce su derecho a una educación pertinente en su grado.", false], ["B", "asignarle las mismas actividades escritas que al resto del grupo, sin cambios, para no darle un trato diferente.", "Dar exactamente lo mismo a todos no garantiza igualdad de oportunidades: mantiene la barrera del castellano escrito y le impide mostrar lo que sabe.", false], ["C", "ofrecer apoyos visuales y glosarios, y permitirle mostrar lo aprendido también de forma oral o gráfica.", "El DUA propone múltiples formas de representación (apoyos visuales, glosarios) y de acción y expresión (oral, gráfica), que reducen la barrera del castellano escrito sin bajar la meta de aprendizaje.", true]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Evaluación diagnóstica y estrategias de apoyo (Decreto 1290 de 2009)", "texto": "En abril llega a su grupo de sexto grado, en una institución de Cúcuta, un estudiante trasladado de otra institución del país. Su constancia de desempeño indica que fue promovido a sexto. Usted aplica una evaluación diagnóstica en matemáticas y lenguaje, y encuentra dificultades importantes en comprensión de textos y en operaciones con fracciones. Un colega le sugiere ubicarlo en quinto «mientras se nivela» y otro propone usar la prueba diagnóstica como primera nota del período. La familia, preocupada, solicita una reunión con usted para conocer cómo se apoyará al estudiante.", "items": [{"id": "PD-185", "niv": 2, "e": "Con base en la constancia de desempeño y el diagnóstico, lo que corresponde es", "f": "Decreto 1290 de 2009, artículo 17; MEN (2009). Documento No. 11: Fundamentaciones y orientaciones para la implementación del Decreto 1290 de 2009 (preguntas frecuentes sobre traslados).", "o": [["A", "condicionar su permanencia en sexto a que apruebe una prueba de admisión al finalizar el primer período.", "La constancia de desempeño tiene validez para la ubicación del estudiante; condicionar su permanencia a una prueba adicional no está previsto en la norma.", false], ["B", "mantenerlo en sexto, el grado al que fue promovido, e implementar procesos de apoyo según el diagnóstico.", "El artículo 17 del Decreto 1290 de 2009 establece que, cuando la constancia de desempeño reporta que el estudiante fue promovido, se matricula en ese grado y, si la evaluación diagnóstica muestra que necesita apoyos, la institución receptora debe implementarlos.", true], ["C", "ubicarlo en quinto grado mientras supera las dificultades identificadas en la evaluación diagnóstica.", "El Decreto 1290 dispone que el estudiante trasladado se matricula en el grado al que fue promovido; el MEN precisa que la evaluación diagnóstica no puede usarse para ubicarlo en un grado inferior.", false]]}, {"id": "PD-186", "niv": 1, "e": "La evaluación diagnóstica que usted aplicó debe usarse para", "f": "Decreto 1290 de 2009, artículos 3 y 17; MEN (2009). Documento No. 11: Fundamentaciones y orientaciones para la implementación del Decreto 1290 de 2009.", "o": [["A", "identificar sus saberes y necesidades, y planear los apoyos pertinentes.", "La evaluación diagnóstica permite a la institución identificar en qué punto del proceso está el estudiante para garantizar su avance; el Decreto 1290 prevé que, si se detectan necesidades, se implementen apoyos.", true], ["B", "decidir si el estudiante debe repetir el grado anterior en la nueva institución.", "El MEN aclara que la evaluación diagnóstica no puede usarse para determinar la promoción ni para ubicar al estudiante en un grado inferior al certificado.", false], ["C", "asignar la primera nota del período en las áreas de matemáticas y lenguaje.", "La evaluación diagnóstica tiene como fin identificar el punto de partida; convertirla en nota sanciona aprendizajes que el estudiante aún no ha tenido oportunidad de desarrollar en la institución.", false]]}, {"id": "PD-187", "niv": 2, "e": "En la reunión con la familia, la decisión más pertinente para el plan de apoyo es", "f": "Decreto 1290 de 2009, artículo 11, numerales 3 y 4.", "o": [["A", "asignarle tareas adicionales de los temas del año anterior para que se nivele por su cuenta en casa.", "Recargar al estudiante con tareas de todo el año anterior, sin acompañamiento ni priorización, traslada a la familia una responsabilidad pedagógica de la institución.", false], ["B", "esperar al cierre del primer período para verificar si se adapta solo, antes de definir cualquier apoyo.", "Aplazar el apoyo desaprovecha la información del diagnóstico; la norma pide estrategias de apoyo oportunas para superar las debilidades.", false], ["C", "acordar con el estudiante y su familia metas concretas, actividades de apoyo y momentos de seguimiento.", "El artículo 11 del Decreto 1290 de 2009 asigna al establecimiento promover la interlocución con los padres y el estudiante para presentar el plan de actividades de apoyo y acordar compromisos de todos los involucrados.", true]]}]}, {"comp": "psicotecnica", "rol": "docente", "tag": "Prueba psicotécnica · Competencias comportamentales (Guía 31, Decreto 1278 de 2002)", "texto": "En la institución donde usted trabaja, los resultados de las pruebas Saber 11 en matemáticas bajaron por segundo año consecutivo. El rector convoca a los docentes del área a una reunión para analizar la situación. Algunos colegas atribuyen el problema a la falta de interés de los estudiantes y a que «la secundaria llega mal preparada desde primaria». Usted es docente de matemáticas de grado décimo.", "items": [{"id": "PS-004", "niv": 1, "e": "En la reunión, frente a los resultados, usted propone", "f": "MEN (2008). Guía 31, Anexo 1: Glosario de competencias (Orientación al logro; Evaluación del aprendizaje).", "o": [["A", "dedicar las clases de grado once a entrenar a los estudiantes con preguntas tipo Saber hasta la fecha de la prueba.", "Entrenar solo para la prueba puede mejorar un resultado puntual, pero no atiende las causas en el aprendizaje ni involucra el análisis de los resultados para ajustar la práctica pedagógica.", false], ["B", "analizar los resultados por competencia y ajustar las prácticas del área en los aspectos con más bajo desempeño.", "Corresponde a orientación al logro: dirigir el comportamiento hacia estándares elevados con miras al mejoramiento continuo y procurar que los estudiantes obtengan resultados de excelencia (Guía 31). También refleja la competencia funcional de evaluación del aprendizaje.", true], ["C", "solicitar a los docentes de primaria que refuercen las bases matemáticas antes de que los estudiantes lleguen a secundaria.", "Atribuir la responsabilidad a otros niveles no dirige la acción propia hacia el mejoramiento; no evidencia orientación al logro ni compromiso con los resultados del área.", false]]}, {"id": "PS-005", "niv": 2, "e": "Un colega le dice que «no vale la pena esforzarse, porque los estudiantes no quieren aprender». Usted", "f": "MEN (2008). Guía 31, Anexo 1: Glosario de competencias (Liderazgo; Trabajo en equipo). Decreto 1278 de 2002, artículo 34.", "o": [["A", "le recuerda que su evaluación de desempeño depende de los resultados de los estudiantes en la prueba.", "Usar la evaluación como amenaza no motiva ni construye confianza; tampoco es preciso, pues la evaluación de desempeño valora múltiples aspectos (Decreto 1278, art. 34).", false], ["B", "le comparte una estrategia que le ha funcionado y lo invita a probarla juntos en uno de sus grupos.", "Corresponde al liderazgo y al trabajo en equipo: influir positivamente en el comportamiento de los demás, expresar expectativas positivas y compartir aprendizajes y recursos (Guía 31).", true], ["C", "le da la razón para no generar tensiones y se concentra en mejorar solo los resultados de sus propios grupos.", "Evita el conflicto, pero renuncia a influir positivamente en el equipo y a construir una meta común, aspectos del liderazgo y del trabajo en equipo.", false]]}, {"id": "PS-006", "niv": 1, "e": "Para actualizarse en estrategias de enseñanza de las matemáticas, usted", "f": "MEN (2008). Guía 31, Anexo 1: Glosario de competencias (Iniciativa).", "o": [["A", "busca formación en recursos y cursos disponibles, y aplica en su aula lo que aprende.", "Corresponde a la iniciativa: realizar acciones que faciliten el aprendizaje permanente y la actualización en su disciplina, actuar con autonomía y proponer ideas novedosas (Guía 31).", true], ["B", "espera a que la secretaría de educación programe una capacitación del área.", "Depender de que otros programen la formación no evidencia iniciativa, entendida como trabajar proactivamente y con autonomía frente a las responsabilidades.", false], ["C", "solicita al rector que contrate a un experto para que capacite a todo el equipo.", "Puede ser útil, pero traslada a otro la responsabilidad de su propia actualización; la iniciativa implica actuar con autonomía, sin necesidad de supervisión.", false]]}]}, {"comp": "psicotecnica", "rol": "docente", "tag": "Prueba psicotécnica · Negociación y mediación", "texto": "En un colegio oficial de Medellín, los estudiantes de octavo y de décimo se disputan la cancha de microfútbol durante el descanso. En la última semana hubo gritos y empujones en tres ocasiones, aunque nadie resultó lastimado. Los de décimo dicen que la cancha «siempre ha sido de ellos» y los de octavo afirman que no los dejan jugar nunca. Usted es el director de grupo de octavo y uno de los docentes de acompañamiento del descanso.", "items": [{"id": "PS-111", "niv": 2, "e": "Durante su turno de acompañamiento, los empujones entre los dos grupos vuelven a empezar en la cancha. Usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Negociación y mediación). Decreto 1965 de 2013, art. 42 (situaciones tipo I).", "o": [["A", "solicita a coordinación suspender el uso de la cancha hasta que ambos grupos mejoren su comportamiento.", "Suspender el uso de forma indefinida traslada el conflicto a la autoridad y castiga a todos sin resolver la causa. No abre un espacio para soluciones concertadas, que es el núcleo de la negociación y mediación.", false], ["B", "reúne allí mismo a los dos grupos para que cada uno exponga su versión y acuerden en ese momento cómo compartir la cancha.", "La intención de dialogar es adecuada, pero intentar un acuerdo en medio de la agresión, sin detenerla primero, no es una intervención efectiva: los ánimos impiden escuchar y un acuerdo logrado bajo presión difícilmente es duradero. La mediación viene después de restablecer la calma.", false], ["C", "detiene el juego, separa a los grupos, suspende el uso de la cancha en ese descanso y cita a representantes de ambos grados para el día siguiente.", "Evidencia negociación y mediación (Guía 31): «interviene efectiva y oportunamente ante situaciones de conflicto»: primero frena la agresión y protege a los estudiantes, y luego abre un espacio en calma para identificar y comprender «las causas y el contexto» del conflicto con imparcialidad (Decreto 1965 de 2013, art. 42).", true]]}, {"id": "PS-112", "niv": 2, "e": "En la reunión, los representantes de décimo insisten en que tienen prioridad «porque siempre ha sido así». Usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Negociación y mediación).", "o": [["A", "les recuerda que el manual de convivencia garantiza a todos los estudiantes el uso de los espacios comunes por igual.", "El argumento normativo es correcto, pero cierra la discusión desde la norma en lugar de construir un acuerdo que las partes sientan como propio. La Guía 31 pide facilitar acuerdos multilaterales que generen confianza.", false], ["B", "pregunta a ambos grupos qué criterios serían justos para todos y los invita a proponer opciones de uso compartido.", "Corresponde a negociación y mediación (Guía 31): «facilita acuerdos y soluciones multilaterales, anteponiendo los intereses comunes y generando confianza en el proceso de mediación», y promueve un escenario de concertación justo y equitativo.", true], ["C", "propone a los de octavo ceder esta vez, dado que décimo lleva más tiempo usando la cancha, para no prolongar el conflicto.", "Busca terminar rápido la tensión, pero valida una costumbre que no es equitativa y deja insatisfecha a una de las partes. La negociación y mediación promueve escenarios de concertación justos y equitativos.", false]]}, {"id": "PS-113", "niv": 3, "e": "Los grupos acuerdan un horario rotativo para la cancha. Para que el acuerdo se mantenga, usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Negociación y mediación). Decreto 1965 de 2013, art. 42 (situaciones tipo I: mediación y seguimiento).", "o": [["A", "acuerda con los representantes una revisión a las dos semanas para evaluar cómo ha funcionado y ajustarlo si es necesario.", "Evidencia negociación y mediación (Guía 31): «promueve soluciones duraderas y hace seguimiento a los compromisos adquiridos por las partes», manteniendo a los estudiantes como corresponsables del acuerdo.", true], ["B", "publica el horario en la cartelera y pide a los docentes de turno en el descanso que lo hagan cumplir.", "Divulgar el acuerdo es útil, pero confiar su cumplimiento solo a la vigilancia de los adultos no fortalece el compromiso de las partes ni prevé ajustes. La Guía 31 asocia la mediación con soluciones duraderas y seguimiento a los compromisos.", false], ["C", "hace firmar a los representantes un acta de compromiso que especifique las sanciones si alguno incumple el horario.", "Dejar constancia puede ser parte del proceso, pero centrar el acuerdo en las sanciones privilegia el control sobre la confianza. La competencia busca escenarios de concertación basados en la confianza, la solidaridad y el respeto, con seguimiento.", false]]}, {"id": "PS-114", "niv": 1, "e": "Para que sus estudiantes de octavo aprendan a manejar desacuerdos como este con más autonomía, usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Negociación y mediación).", "o": [["A", "solicita a la orientadora escolar una charla sobre convivencia para el grupo en la próxima hora de dirección de grupo.", "Apoyarse en la orientación escolar es válido, pero delega una tarea formativa que la Guía 31 atribuye al propio docente: «forma a sus estudiantes en estrategias de resolución pacífica de conflictos».", false], ["B", "acuerda con el grupo una norma de aula según la cual todo desacuerdo se informa de inmediato a un docente.", "Buscar ayuda adulta es prudente en situaciones graves, pero convertirlo en norma para todo desacuerdo genera dependencia y no desarrolla habilidades de negociación en los estudiantes.", false], ["C", "incorpora en la dirección de grupo ejercicios de diálogo y negociación basados en situaciones reales del curso.", "Corresponde a negociación y mediación (Guía 31): el docente «forma a sus estudiantes en estrategias de resolución pacífica de conflictos», usando experiencias reales para que las practiquen.", true]]}]}, {"comp": "psicotecnica", "rol": "docente", "tag": "Prueba psicotécnica · Negociación y mediación", "texto": "Usted trabaja en un centro educativo rural de Santander con cinco docentes y una directora rural. La sede tiene una sola sala con computadores y conexión a internet. Dos colegas, ambas amigas suyas, discuten desde hace semanas por el uso de la sala: una necesita los equipos para un proyecto de investigación con quinto y la otra los usa para prácticas de lectura con primero. Los comentarios entre ellas se han vuelto tensos y el ambiente de las reuniones de docentes se ha deteriorado.", "items": [{"id": "PS-136", "niv": 2, "e": "Frente a la tensión entre sus colegas, usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Negociación y mediación).", "o": [["A", "les propone conversar los tres para que cada una explique qué necesita de la sala y acuerden una distribución.", "Evidencia negociación y mediación (Guía 31): «identifica y comprende las causas y el contexto de un conflicto, valorando con imparcialidad los motivos de los implicados» y facilita acuerdos multilaterales.", true], ["B", "se mantiene al margen para no tomar partido, ya que ambas son sus amigas y el asunto no lo involucra directamente.", "No tomar partido parece imparcial, pero el conflicto ya afecta al equipo y nadie interviene. La Guía 31 incluye en la negociación y mediación intervenir «efectiva y oportunamente ante situaciones de conflicto».", false], ["C", "sugiere a la directora rural que defina un horario fijo de la sala y lo comunique a todos los docentes.", "Un horario fijo puede ordenar el uso, pero impuesto desde la dirección no atiende las causas del desacuerdo ni reconstruye la relación entre las colegas. No genera una solución concertada.", false]]}, {"id": "PS-137", "niv": 3, "e": "En la conversación, una de ellas dice que la otra «siempre consigue lo que quiere porque es amiga de la directora». Usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Negociación y mediación).", "o": [["A", "ofrece ceder sus propias horas de sala para que ambas tengan más tiempo y así termine la discusión.", "Es un gesto generoso, pero resuelve el síntoma a costa de sus propios estudiantes y no construye un criterio que las partes perciban como justo. No promueve soluciones duraderas.", false], ["B", "reconoce su malestar y propone acordar criterios objetivos para distribuir la sala entre ambas.", "Corresponde a negociación y mediación (Guía 31): comprende las causas del conflicto con imparcialidad y promueve «escenarios de concertación justos y equitativos con base en la confianza», con criterios que todos pueden verificar.", true], ["C", "le pide que retire el comentario, porque los señalamientos personales impiden continuar la conversación.", "Poner un límite al señalamiento es comprensible, pero se centra en la forma y deja sin atender la percepción de inequidad que está en la raíz del conflicto. No identifica ni comprende sus causas.", false]]}, {"id": "PS-138", "niv": 2, "e": "Una vez acordado el horario de la sala, una de las colegas no lo cumple durante la primera semana. Usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Negociación y mediación).", "o": [["A", "informa a la directora rural del incumplimiento, para que tome las medidas que considere necesarias.", "Informar a la directora puede ser necesario si el incumplimiento persiste, pero como primera respuesta escala el conflicto y debilita la confianza construida en el acuerdo. No refleja el seguimiento propio de la mediación.", false], ["B", "deja pasar la situación, porque una semana no es suficiente para saber si el acuerdo está funcionando.", "Tener paciencia parece sensato, pero ignorar el primer incumplimiento debilita el acuerdo y puede reavivar el conflicto. La competencia exige hacer seguimiento a los compromisos.", false], ["C", "conversa con ella para conocer qué pasó y revisar si el acuerdo necesita algún ajuste.", "Evidencia negociación y mediación (Guía 31): «promueve soluciones duraderas y hace seguimiento a los compromisos adquiridos por las partes», generando confianza en el proceso.", true]]}]}, {"comp": "psicotecnica", "rol": "docente", "tag": "Prueba psicotécnica · Orientación al logro", "texto": "Usted es docente de inglés de séptimo en un colegio oficial de Bogotá. Tiene dos grupos de 42 estudiantes. En el diagnóstico inicial, la mayoría de estudiantes comprendía textos cortos, pero tenía grandes dificultades para entender instrucciones orales y expresarse en inglés. En su barrio, muchos jóvenes dicen que el inglés «no sirve para nada». La institución incluyó el fortalecimiento del inglés en su plan de mejoramiento y las clases cuentan con un televisor y una grabadora.", "items": [{"id": "PS-150", "niv": 1, "e": "Usted se propone que, al final del año, sus grupos mejoren su comprensión oral en inglés. Para lograrlo, usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Orientación al logro).", "o": [["A", "espera a la evaluación final del año para medir si los grupos alcanzaron la mejora que se propuso.", "Medir al final deja sin margen para corregir el rumbo. La orientación al logro implica perseguir la meta de forma activa y continua, no solo comprobar si se cumplió.", false], ["B", "define metas por período, hace seguimiento con evaluaciones cortas y ajusta las actividades según los resultados.", "Evidencia orientación al logro (Guía 31): «trabaja con tesón y disciplina para cumplir sus funciones con altos niveles de calidad» y orienta su comportamiento al mejoramiento continuo mediante metas y seguimiento.", true], ["C", "aumenta las tareas de escucha para la casa, de manera que los estudiantes practiquen más fuera de clase.", "Más práctica puede ayudar, pero sin metas intermedias ni seguimiento no sabe si está funcionando ni cómo mejorar. La orientación al logro implica orientar el trabajo hacia resultados verificables.", false]]}, {"id": "PS-151", "niv": 3, "e": "Un directivo le comenta que sus grupos tienen mejores resultados que los demás séptimos y que «no hace falta exigir más», aunque varios de sus estudiantes aún no alcanzan el nivel esperado. Usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Orientación al logro).", "o": [["A", "agradece el reconocimiento y dedica más tiempo a los estudiantes avanzados para que el colegio destaque en el concurso de inglés.", "Busca excelencia, pero solo para unos pocos y en función de un resultado visible para el colegio. La orientación al logro procura resultados de excelencia para los estudiantes, no solo para los más aventajados.", false], ["B", "agradece el reconocimiento y mantiene el ritmo actual, ya que los resultados confirman que la estrategia funciona.", "Es razonable conservar lo que funciona, pero la comparación con otros grupos no es el estándar: si hay estudiantes que no alcanzan el nivel esperado, la meta no está cumplida. Conformarse no refleja metas elevadas.", false], ["C", "agradece el reconocimiento y mantiene metas de mejora para los estudiantes que aún no alcanzan el nivel esperado.", "Corresponde a orientación al logro (Guía 31): «tiene metas personales y profesionales elevadas» y «procura que los estudiantes de la institución obtengan resultados de excelencia», sin conformarse con la comparación con otros grupos.", true]]}, {"id": "PS-152", "niv": 2, "e": "En clase, varios estudiantes repiten que el inglés «no sirve para nada» en su barrio. Usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Liderazgo).", "o": [["A", "les comparte casos de jóvenes como ellos a quienes el inglés les abrió oportunidades y les expresa su confianza en ellos.", "Evidencia liderazgo (Guía 31): «plantea orientaciones convincentes, expresa expectativas positivas de los demás y demuestra interés por el desarrollo de las personas», influyendo positivamente en la motivación del grupo.", true], ["B", "ajusta las clases a canciones y juegos para que el área les resulte más entretenida, aunque se avance menos en el programa.", "Hacer la clase atractiva es valioso, pero sacrificar los aprendizajes para ganar aceptación no transforma la percepción de los estudiantes sobre el valor del inglés. No plantea una orientación convincente.", false], ["C", "les explica que el inglés es un área obligatoria del plan de estudios y que deben aprobarla para ser promovidos.", "Es información cierta, pero apela a la obligación y no cambia la actitud de los estudiantes hacia el aprendizaje. El liderazgo implica plantear orientaciones convincentes.", false]]}, {"id": "PS-153", "niv": 3, "e": "Con 42 estudiantes por grupo, es difícil que todos practiquen la expresión oral durante la clase. Usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Iniciativa).", "o": [["A", "solicita a coordinación que divida los grupos en dos para las clases de inglés, como se hace en algunos colegios.", "La propuesta puede ser deseable, pero depende de recursos y decisiones que no controla y deja el problema sin respuesta inmediata. La iniciativa implica buscar alternativas con autonomía.", false], ["B", "organiza estaciones de práctica en pequeños grupos y usa grabaciones de voz para revisar el avance de cada estudiante.", "Evidencia iniciativa (Guía 31): «demuestra recursividad y flexibilidad» y «propone y desarrolla ideas novedosas», encontrando una forma de que todos practiquen con los recursos disponibles.", true], ["C", "prioriza la comprensión lectora y la gramática, que pueden trabajarse con todo el grupo al mismo tiempo.", "Es una decisión eficiente, pero abandona la habilidad que el diagnóstico mostró como más débil. No busca una alternativa para la dificultad real, que es lo que exige la iniciativa.", false]]}]}, {"comp": "psicotecnica", "rol": "docente", "tag": "Prueba psicotécnica · Compromiso social e institucional", "texto": "Usted es docente de cuarto de primaria en un colegio oficial de Armenia. La institución tiene un plan escolar de gestión del riesgo que define, para un sismo, que durante el movimiento todos se protegen en el lugar y, al terminar, evacúan por rutas señaladas hasta el punto de encuentro, donde cada docente verifica la lista de su grupo y reporta novedades a la brigada de evacuación. Durante una clase se presenta un temblor fuerte. Un estudiante de su grupo había salido al baño minutos antes.", "items": [{"id": "PS-182", "niv": 1, "e": "Durante el temblor, con su grupo dentro del salón, usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Compromiso social e institucional).", "o": [["A", "sigue el protocolo practicado en los simulacros y, al cesar el movimiento, lleva al grupo al punto de encuentro.", "Evidencia compromiso social e institucional (Guía 31): «acata y divulga las normas y políticas nacionales, regionales e institucionales» y asume con profesionalismo su responsabilidad sobre los estudiantes, siguiendo el plan escolar de gestión del riesgo.", true], ["B", "sale primero para verificar que la ruta de evacuación esté despejada y luego regresa por los niños.", "La intención es proteger al grupo, pero deja a los niños solos durante el evento y contradice el protocolo, que indica protegerse en el lugar mientras dura el movimiento.", false], ["C", "pide a los niños que salgan corriendo hacia el patio en cuanto empieza el temblor, para alejarlos cuanto antes del edificio.", "Busca alejarlos del peligro, pero evacuar durante el movimiento aumenta el riesgo de caídas y golpes, y desconoce el protocolo institucional.", false]]}, {"id": "PS-183", "niv": 2, "e": "En el punto de encuentro, usted verifica la lista y confirma que falta el estudiante que había ido al baño. Usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Compromiso social e institucional).", "o": [["A", "espera unos minutos antes de reportarlo, porque es probable que el estudiante haya salido con otro curso del piso.", "La suposición puede ser cierta, pero retrasar el reporte en una emergencia pone en riesgo al estudiante. La competencia exige responder con oportunidad.", false], ["B", "deja el grupo al cuidado del estudiante más responsable y regresa al edificio a buscar al niño.", "Es un acto de preocupación genuina, pero deja al grupo sin adulto responsable y lo expone a usted a un riesgo que el plan asigna a la brigada. No acata el protocolo institucional.", false], ["C", "informa de inmediato a la brigada el nombre del estudiante y el lugar donde estaba, y permanece con su grupo.", "Corresponde al compromiso social e institucional (Guía 31): «responde con oportunidad, eficiencia y calidad a las tareas que se le asignan» y acata el plan institucional, que asigna la búsqueda a la brigada y a usted el cuidado del grupo.", true]]}, {"id": "PS-184", "niv": 1, "e": "Después del evento, el comité de gestión del riesgo informa que la evacuación de su piso tardó más de lo previsto en el plan. Usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Orientación al logro).", "o": [["A", "espera el próximo simulacro programado por la institución para verificar si los tiempos de evacuación mejoran.", "Respeta la programación institucional, pero no actúa sobre una falla ya identificada. La orientación al logro implica trabajar activamente por el estándar.", false], ["B", "considera que un retraso es normal en un evento real y que lo importante es que todos salieron ilesos.", "Es comprensible valorar que no hubo heridos, pero normaliza un resultado por debajo del estándar del plan. No refleja la búsqueda de mejoramiento continuo.", false], ["C", "revisa con su grupo qué retrasó la salida y practica con ellos las mejoras hasta alcanzar el tiempo previsto.", "Evidencia orientación al logro (Guía 31): «trabaja con tesón y disciplina para cumplir sus funciones con altos niveles de calidad» y persigue el estándar del plan con miras al mejoramiento continuo.", true]]}]}];
const CFG = {"titulo": "Simulacro 5 · Concurso Docente 2026–2027", "modo": "simulacro", "minutos": 194, "componentes": {"lectura_critica": "Lectura crítica", "razonamiento_cuantitativo": "Razonamiento cuantitativo", "competencias_blandas": "Competencias blandas y ciudadanas", "pedagogia_normativa": "Competencias pedagógicas y normativa", "psicotecnica": "Prueba psicotécnica"}, "niveles": {"1": "Básico", "2": "Intermedio", "3": "Avanzado"}, "clave": "simulacro-05.html"};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY = 'sim-docente:' + CFG.clave;
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}
function save(){try{localStorage.setItem(KEY, JSON.stringify(ST))}catch(e){}}
let ST = load();
ST.r = ST.r || {};
$('#tit').textContent = CFG.titulo;
const ITEMS = [];
DATA.forEach(c => c.items.forEach(it => { it.caso = c; ITEMS.push(it); }));

function justHTML(it){
  return '<div class="just">' + it.o.map(o => `<div><b>${o[0]}.</b> <span class="${o[3]?'okt':'not'}">${o[3]?'Es correcta.':'Es incorrecta.'}</span> ${esc(o[2])}</div>`).join('') +
    `<div class="src">Referencia: ${esc(it.f)}</div></div>`;
}
function itemHTML(it, n, mode){
  const r = ST.r[it.id];
  const reveal = mode === 'review' || (CFG.modo === 'practica' && r);
  let h = `<div class="item" id="i-${it.id}"><p class="enun"><span class="n">${n}.</span> <span class="niv">${CFG.niveles[it.niv]}</span> ${esc(it.e)}</p>`;
  it.o.forEach(o => {
    let cls = '';
    if (reveal) { if (o[3]) cls = 'ok'; else if (r === o[0]) cls = 'no'; }
    else if (r === o[0]) cls = 'sel';
    h += `<button class="op ${cls}" data-id="${it.id}" data-l="${o[0]}" ${reveal?'disabled':''}><span class="l">${o[0]}.</span><span>${esc(o[1])}</span></button>`;
  });
  if (reveal) {
    if (mode === 'review') h += `<div class="${r===keyOf(it)?'res-ok':'res-no'}" style="font-size:14px;margin-top:4px">${r ? (r===keyOf(it)?'Respondiste ' + r + ': correcto.':'Respondiste ' + r + '. La respuesta correcta es ' + keyOf(it) + '.') : 'Sin responder. La respuesta correcta es ' + keyOf(it) + '.'}</div>`;
    h += justHTML(it);
  }
  return h + '</div>';
}
const keyOf = it => it.o.find(o => o[3])[0];

function renderList(list, mode){
  let h = '', last = null, n = 0;
  list.forEach(it => {
    n++;
    if (it.caso !== last) { last = it.caso; h += `<div class="caso"><div class="tag">${esc(it.caso.tag)}</div><p>${esc(it.caso.texto)}</p></div>`; }
    h += itemHTML(it, n, mode);
  });
  return h;
}

// ---------- PRÁCTICA ----------
let LIST = [];
let FILTRO = ST.f || {comp:'', niv:'', rol:''};
function practica(){
  const comps = Object.entries(CFG.componentes).map(([k,v]) => `<option value="${k}" ${FILTRO.comp===k?'selected':''}>${esc(v)}</option>`).join('');
  const nivs = Object.entries(CFG.niveles).map(([k,v]) => `<option value="${k}" ${FILTRO.niv===k?'selected':''}>${esc(v)}</option>`).join('');
  const list = ITEMS.filter(it => (!FILTRO.comp || it.caso.comp===FILTRO.comp) && (!FILTRO.niv || String(it.niv)===FILTRO.niv) && (!FILTRO.rol || it.caso.rol===FILTRO.rol));
  const resp = list.filter(it => ST.r[it.id]); const ok = resp.filter(it => ST.r[it.id]===keyOf(it));
  $('#main').innerHTML = `<div class="panel"><p style="margin-top:0">Elige un tema y un nivel. Al responder verás de inmediato si acertaste y la explicación de cada opción.</p>
  <div class="row"><select id="fc"><option value="">Todos los temas</option>${comps}</select>
  <select id="fn"><option value="">Todos los niveles</option>${nivs}</select>
  <select id="fr"><option value="">Docentes y directivos</option><option value="docente" ${FILTRO.rol==='docente'?'selected':''}>Solo docentes</option><option value="directivo" ${FILTRO.rol==='directivo'?'selected':''}>Solo directivos</option></select>
  <button class="btn sec" id="borrar">Borrar mis respuestas</button></div>
  <p class="stat" id="pst" style="margin-bottom:0">${list.length} preguntas · respondidas ${resp.length} · aciertos ${ok.length}${resp.length? ' (' + Math.round(100*ok.length/resp.length) + ' %)':''}</p></div>` + renderList(list, 'practica');
  $('#prog').textContent = `${ok.length}/${resp.length} aciertos`;
  ['fc','fn','fr'].forEach((id,i) => $('#'+id).onchange = e => { FILTRO[['comp','niv','rol'][i]] = e.target.value; ST.f = FILTRO; save(); practica(); });
  LIST = list;
  $('#borrar').onclick = () => { list.forEach(it => delete ST.r[it.id]); save(); practica(); };
}

// ---------- SIMULACRO ----------
let tick = null;
function inicio(){
  const n = ITEMS.length, cnt = {};
  ITEMS.forEach(it => cnt[it.caso.comp] = (cnt[it.caso.comp]||0) + 1);
  const h = Math.floor(CFG.minutos/60), m = CFG.minutos%60;
  $('#main').innerHTML = `<div class="panel"><h2 style="margin-top:0;color:var(--pri)">Instrucciones</h2>
  <p>Este simulacro tiene <b>${n} preguntas</b> en el formato de Prueba de Juicio Situacional: un caso, enunciados que se completan y tres opciones con una sola respuesta correcta.</p>
  <table>${Object.entries(cnt).map(([k,v]) => `<tr><td>${esc(CFG.componentes[k])}</td><td class="r">${v}</td></tr>`).join('')}</table>
  <p>Tiempo sugerido: <b>${h ? h + ' h ' : ''}${m ? m + ' min' : ''}</b> (unos ${Math.round(CFG.minutos*60/n/6)/10} minutos por pregunta). Cuando se acaba el tiempo puedes seguir, pero el cronómetro lo indica.</p>
  <p>Tus respuestas se guardan en este navegador. Al terminar verás tu puntaje por componente y por nivel, y la explicación de cada pregunta.</p>
  <button class="btn" id="go">${ST.t0 ? 'Continuar el simulacro' : 'Comenzar'}</button></div>`;
  $('#prog').textContent = `${n} preguntas`;
  $('#go').onclick = () => { if (!ST.t0) { ST.t0 = Date.now(); save(); } examen(); };
}
function reloj(){
  const rest = CFG.minutos*60 - Math.floor((Date.now() - ST.t0)/1000);
  const a = Math.abs(rest), hh = Math.floor(a/3600), mm = Math.floor(a%3600/60), ss = a%60;
  const t = (rest < 0 ? '+' : '') + (hh ? hh + ':' : '') + String(mm).padStart(2,'0') + ':' + String(ss).padStart(2,'0');
  $('#timer').textContent = rest < 0 ? 'Tiempo cumplido ' + t : '⏱ ' + t;
  $('#timer').classList.toggle('low', rest < 600);
}
function examen(){
  $('#main').innerHTML = renderList(ITEMS, 'examen') + `<div class="panel"><button class="btn" id="fin">Terminar y calificar</button></div>`;
  progreso(); reloj(); clearInterval(tick); tick = setInterval(reloj, 1000);
  $('#fin').onclick = () => {
    const faltan = ITEMS.length - Object.keys(ST.r).filter(k => ITEMS.some(i => i.id===k)).length;
    $('#mtxt').textContent = faltan ? `Te faltan ${faltan} preguntas por responder. ¿Quieres calificar de todos modos?` : '¿Quieres terminar y ver tu calificación?';
    $('#modal').classList.remove('hide');
  };
}
function progreso(){
  const r = ITEMS.filter(it => ST.r[it.id]).length;
  $('#prog').textContent = `Respondidas ${r}/${ITEMS.length}`;
}
$('#mno').onclick = () => $('#modal').classList.add('hide');
$('#msi').onclick = () => { $('#modal').classList.add('hide'); ST.fin = Date.now(); save(); resultados(); };
function resultados(){
  clearInterval(tick);
  const ok = ITEMS.filter(it => ST.r[it.id] === keyOf(it)).length;
  const pct = Math.round(1000*ok/ITEMS.length)/10;
  const g = (fn, lab) => { const m = {}; ITEMS.forEach(it => { const k = fn(it); m[k] = m[k] || [0,0]; m[k][1]++; if (ST.r[it.id]===keyOf(it)) m[k][0]++; });
    return Object.entries(m).map(([k,v]) => `<tr><td>${esc(lab(k))}</td><td class="r">${v[0]}/${v[1]}</td><td class="r">${Math.round(100*v[0]/v[1])} %</td></tr>`).join(''); };
  const mins = Math.round(((ST.fin||Date.now()) - ST.t0)/60000);
  $('#timer').textContent = `Tiempo usado: ${Math.floor(mins/60) ? Math.floor(mins/60) + ' h ' : ''}${mins%60} min`;
  $('#prog').textContent = `${ok}/${ITEMS.length} aciertos`;
  $('#main').innerHTML = `<div class="panel"><div class="big">${String(pct).replace('.',',')} %</div>
  <p style="margin-top:4px">${ok} de ${ITEMS.length} respuestas correctas. ${pct >= 70 ? 'Muy buen resultado: repasa las explicaciones de tus errores para afianzarlo.' : pct >= 60 ? 'Vas bien, pero con poco margen: refuerza los componentes con menor porcentaje.' : 'Todavía no estás en zona segura: practica por tema los componentes con menor porcentaje.'}</p>
  <p class="aviso">Referencia: en el concurso el mínimo aprobatorio de la prueba eliminatoria es 60 puntos (70 para directivos). Este porcentaje de aciertos es una guía de preparación; la CNSC calcula su puntaje con su propia escala.</p>
  <h3>Por componente</h3><table>${g(it => it.caso.comp, k => CFG.componentes[k])}</table>
  <h3>Por nivel</h3><table>${g(it => it.niv, k => CFG.niveles[k])}</table>
  <div class="row" style="margin-top:14px"><button class="btn" id="solo">Ver solo mis errores</button><button class="btn sec" id="todas">Ver todas</button><button class="btn sec" id="otra">Reiniciar el simulacro</button></div></div><div id="rev"></div>`;
  const rev = errs => { const l = errs ? ITEMS.filter(it => ST.r[it.id] !== keyOf(it)) : ITEMS; $('#rev').innerHTML = renderList(l, 'review'); };
  rev(true);
  $('#solo').onclick = () => rev(true); $('#todas').onclick = () => rev(false);
  $('#otra').onclick = () => { ST = {r:{}}; save(); inicio(); window.scrollTo(0,0); };
}

document.addEventListener('click', e => {
  const b = e.target.closest('button.op'); if (!b || b.disabled) return;
  ST.r[b.dataset.id] = b.dataset.l; save();
  const it = ITEMS.find(i => i.id === b.dataset.id);
  const n = b.closest('.item').querySelector('.n').textContent.replace('.','');
  b.closest('.item').outerHTML = itemHTML(it, n, CFG.modo === 'practica' ? 'practica' : 'examen');
  if (CFG.modo === 'practica') { const resp = LIST.filter(i => ST.r[i.id]); const ok = resp.filter(i => ST.r[i.id]===keyOf(i)).length; $('#prog').textContent = `${ok}/${resp.length} aciertos`; $('#pst').textContent = `${LIST.length} preguntas · respondidas ${resp.length} · aciertos ${ok} (${Math.round(100*ok/resp.length)} %)`; }
  else progreso();
});

if (CFG.modo === 'practica') practica();
else if (ST.fin) resultados();
else if (ST.t0) examen();
else inicio();
</script>
</body>
</html>
