<script>
const DATA = [{"comp": "lectura_critica", "rol": "docente", "tag": "Lectura crítica", "texto": "Lea la siguiente nota publicada en el periódico escolar de una institución rural con varias sedes:\n\n«LA HUERTA QUE ENSEÑA A SUMAR\nEn la sede La Esperanza, donde una sola docente atiende a 22 niños de preescolar a quinto, la huerta escolar dejó de ser un adorno. Desde febrero, cada grupo tiene una tarea: los más pequeños riegan y cuentan semillas; los de tercero miden cada semana el crecimiento de las plantas y lo registran en una tabla; los de quinto calculan cuánto se gastó en abono y cuánto se ahorraría el restaurante escolar con la cosecha.\n\"Antes, la matemática era algo del cuaderno; ahora la ven crecer\", dice la docente. Los padres colaboran con el cercado y con semillas nativas. Algunos, sin embargo, se preguntan si tanto tiempo en la huerta no le quita horas a la lectura.\nLa docente responde que los estudiantes también escriben un diario de la huerta y que, por ahora, el mayor reto es conseguir agua en verano, cuando la quebrada baja.»", "items": [{"id": "LC-113", "niv": 1, "e": "Según la nota, los estudiantes de tercero participan en la huerta", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: identificar y entender los contenidos locales que conforman un texto.", "o": [["A", "llevando un registro semanal de cuánto van creciendo las plantas.", "La nota lo dice expresamente: «los de tercero miden cada semana el crecimiento de las plantas y lo registran en una tabla». Es una pregunta de información local explícita.", true], ["B", "calculando cuánto se ahorraría el restaurante escolar con la cosecha.", "Esa tarea corresponde, según la nota, a los estudiantes de quinto.", false], ["C", "regando las plantas y contando las semillas que se van a sembrar.", "Esa tarea corresponde a «los más pequeños», no a los de tercero.", false]]}, {"id": "LC-114", "niv": 2, "e": "Cuando la docente dice que la matemática «ahora la ven crecer», quiere decir que", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: identificar y entender los contenidos locales (sentido de palabras y expresiones en contexto).", "o": [["A", "los estudiantes obtienen mejores notas en matemáticas desde que empezó el proyecto de la huerta.", "La nota no presenta información sobre calificaciones; la frase no habla de resultados, sino de la forma en que los estudiantes viven la matemática.", false], ["B", "la cantidad de contenidos matemáticos del plan de estudios aumentó desde febrero.", "Nada en la nota indica un aumento de contenidos; la frase se refiere a un cambio en la forma de aprender.", false], ["C", "la matemática se vuelve concreta para los estudiantes al observarla en las plantas.", "La docente contrapone la matemática «del cuaderno» a la que se ve en la huerta: medir, contar y calcular a partir de algo que crece. La expresión juega con el crecimiento de las plantas para mostrar que la matemática se hace tangible.", true]]}, {"id": "LC-115", "niv": 1, "e": "En la nota, la inquietud de algunos padres sobre el tiempo dedicado a la huerta aparece como", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: comprender cómo se articulan las partes de un texto para darle un sentido global.", "o": [["A", "la postura oficial de la institución frente al proyecto de la huerta.", "Es la opinión de «algunos» padres, no de la institución; la nota incluso recoge la respuesta de la docente.", false], ["B", "una objeción que la nota acompaña con la respuesta de la docente.", "Después de la inquietud («Algunos, sin embargo, se preguntan…»), la nota presenta la respuesta: los estudiantes también escriben un diario de la huerta. Reconocer cómo se organiza una objeción y su respuesta es comprender la estructura del texto.", true], ["C", "la razón por la cual el proyecto se suspenderá durante el verano.", "El problema del verano es la escasez de agua, no la inquietud de los padres; además, la nota no anuncia ninguna suspensión.", false]]}, {"id": "LC-116", "niv": 3, "e": "Para saber si la huerta mejora realmente el aprendizaje de la matemática, la información de la nota resulta", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: reflexionar a partir de un texto y evaluar su contenido (validez de argumentos y solidez de las evidencias).", "o": [["A", "suficiente, porque la docente afirma que los estudiantes ahora comprenden mejor la matemática.", "La afirmación de la docente es un testimonio valioso, pero por sí solo no demuestra una mejora del aprendizaje.", false], ["B", "insuficiente, porque describe actividades y opiniones, pero no presenta resultados de aprendizaje.", "La nota informa qué hacen los estudiantes y lo que opina la docente, pero no ofrece evidencia sobre lo que aprendieron (por ejemplo, desempeños antes y después). Distinguir entre descripción, testimonio y evidencia es evaluar la solidez de una afirmación.", true], ["C", "contradictoria, porque los padres apoyan el proyecto y al mismo tiempo lo critican.", "No hay contradicción: la nota dice que los padres colaboran y que «algunos» tienen una inquietud; son aspectos compatibles.", false]]}]}, {"comp": "lectura_critica", "rol": "docente", "tag": "Lectura crítica", "texto": "Lea la siguiente reseña publicada en una revista para docentes:\n\n«En Aulas sin gritos, la autora —orientadora escolar con veinte años de experiencia— propone reemplazar el castigo por acuerdos construidos con los estudiantes y por consecuencias relacionadas con la falta: quien daña un material lo repara; quien interrumpe busca con el docente una forma de recuperar el tiempo perdido.\n\nEl libro tiene el mérito de ser práctico. Cada capítulo cierra con situaciones de aula y posibles respuestas, y el lenguaje evita la jerga. Su mayor debilidad está en el tono: la autora presenta sus casos como si todos hubieran terminado bien, y el lector no encuentra un solo ejemplo en el que la estrategia haya fallado. Un docente con cuarenta estudiantes y poco tiempo puede sentir que el libro describe un aula que no es la suya.\n\nAun así, recomiendo su lectura, sobre todo a quienes empiezan. No es un manual infalible, pero sí una buena invitación a pensar la disciplina de otra manera.»", "items": [{"id": "LC-152", "niv": 1, "e": "Según la reseña, un ejemplo de «consecuencia relacionada con la falta» es que", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: identificar y entender los contenidos locales que conforman un texto.", "o": [["A", "el estudiante que interrumpe reciba una anotación en el observador.", "La reseña no menciona anotaciones; dice que quien interrumpe busca con el docente cómo recuperar el tiempo perdido.", false], ["B", "el estudiante que incumple un acuerdo sea retirado del aula.", "La reseña no menciona retirar al estudiante del aula; esa medida no guarda relación directa con la falta.", false], ["C", "el estudiante que daña un material se encargue de repararlo.", "La reseña lo presenta así: «quien daña un material lo repara». La consecuencia guarda relación directa con la falta.", true]]}, {"id": "LC-153", "niv": 2, "e": "La crítica principal que el reseñista hace al libro es que", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: comprender el sentido global del texto (tesis e intención comunicativa).", "o": [["A", "no incluye casos fallidos, lo que puede alejarlo de la realidad de muchas aulas.", "La «mayor debilidad» es que todos los casos terminan bien y no aparece ningún ejemplo en que la estrategia falle, por lo que el libro puede parecer ajeno a un aula numerosa.", true], ["B", "usa un lenguaje técnico que dificulta la lectura de los docentes que empiezan.", "La reseña afirma lo contrario: «el lenguaje evita la jerga».", false], ["C", "no ofrece situaciones de aula ni posibles respuestas para los docentes.", "La reseña destaca que cada capítulo «cierra con situaciones de aula y posibles respuestas».", false]]}, {"id": "LC-154", "niv": 1, "e": "La expresión «Aun así», al inicio del último párrafo, introduce", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: comprender cómo se articulan las partes de un texto (conectores y función de los párrafos).", "o": [["A", "una recomendación que el reseñista mantiene a pesar de la debilidad señalada.", "«Aun así» es un conector concesivo: después de señalar la debilidad del libro, el reseñista lo recomienda de todos modos. Identificar la función de los conectores es comprender la articulación del texto.", true], ["B", "una nueva crítica que se suma a la debilidad señalada en el párrafo anterior.", "Después del conector no aparece una crítica, sino una recomendación.", false], ["C", "un resumen del contenido de cada uno de los capítulos del libro reseñado.", "El último párrafo no resume capítulos; valora el libro en su conjunto.", false]]}, {"id": "LC-155", "niv": 3, "e": "De la reseña se puede inferir que, para el reseñista, un buen libro sobre disciplina escolar debería", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: reflexionar a partir de un texto y evaluar su contenido (supuestos implícitos).", "o": [["A", "estar dirigido principalmente a docentes con muchos años de experiencia.", "El reseñista recomienda el libro «sobre todo a quienes empiezan»; no exige que se dirija a docentes experimentados.", false], ["B", "reconocer también las dificultades y los fracasos de lo que propone.", "Al criticar que no haya «un solo ejemplo en el que la estrategia haya fallado», el reseñista deja ver un criterio implícito: un libro útil muestra también los límites de sus propuestas. Inferir los criterios de valoración de un autor es reflexionar sobre el texto.", true], ["C", "evitar los ejemplos prácticos para concentrarse en el desarrollo teórico.", "El reseñista valora como un mérito que el libro sea práctico; no pide menos ejemplos.", false]]}]}, {"comp": "lectura_critica", "rol": "docente", "tag": "Lectura crítica", "texto": "Lea el siguiente texto que una docente de ciencias naturales preparó para una salida pedagógica con estudiantes de grado octavo:\n\n«Los páramos funcionan como una esponja. Sus suelos, ricos en materia orgánica, y plantas como los frailejones y los musgos retienen el agua de la lluvia y de la neblina, y la liberan poco a poco hacia quebradas y ríos. Por eso, aun en temporada seca, muchos ríos que nacen en el páramo siguen llevando agua.\n\nCuando el páramo se convierte en potrero o en cultivo, el suelo se compacta y pierde esa capacidad. El agua corre rápido por la superficie: en invierno causa crecientes y en verano los caudales bajan más de lo normal. Así, el daño no solo afecta a quienes viven en la montaña, sino también a las ciudades que reciben el agua kilómetros abajo.»", "items": [{"id": "LC-183", "niv": 1, "e": "En el texto, la comparación del páramo con una esponja se refiere a su capacidad de", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: identificar y entender los contenidos locales (sentido de palabras y expresiones en contexto).", "o": [["A", "producir la lluvia y la neblina de la montaña.", "El páramo retiene el agua de la lluvia y la neblina; el texto no dice que las produzca.", false], ["B", "absorber la contaminación que llega a los ríos.", "El texto no habla de contaminación; la comparación se refiere al manejo del agua.", false], ["C", "retener el agua y liberarla poco a poco.", "El texto explica la comparación: suelos y plantas «retienen el agua […] y la liberan poco a poco hacia quebradas y ríos».", true]]}, {"id": "LC-184", "niv": 2, "e": "Según el texto, que en verano los caudales bajen más de lo normal en un páramo convertido en potrero se explica porque", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: comprender cómo se articulan las partes de un texto para darle un sentido global.", "o": [["A", "las ciudades toman más agua de los ríos durante los meses de verano.", "El texto no atribuye la baja de los caudales al consumo de las ciudades.", false], ["B", "el suelo compactado no retiene el agua, que se escurre rápido cuando llueve.", "El texto encadena causas: el suelo se compacta, pierde su capacidad de retener, el agua corre rápido por la superficie y, por eso, no queda reserva para el verano. Reconstruir una cadena causal es comprender cómo se articulan las ideas.", true], ["C", "los frailejones y los musgos consumen más agua durante la temporada seca.", "El texto no menciona un mayor consumo de agua por parte de las plantas.", false]]}, {"id": "LC-185", "niv": 2, "e": "La palabra «Así», al comienzo de la última oración, introduce", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: comprender cómo se articulan las partes de un texto (conectores y función de los párrafos).", "o": [["A", "una consecuencia que amplía el alcance del daño descrito antes.", "«Así» tiene aquí valor consecutivo: de lo explicado se concluye que el daño llega también a las ciudades. Identificar el valor de un conector es comprender la articulación del texto.", true], ["B", "un ejemplo de los cultivos que suelen sembrarse en los páramos.", "Después del conector no aparece ningún ejemplo de cultivos.", false], ["C", "una comparación entre el invierno y el verano en las ciudades.", "Lo que sigue no compara estaciones, sino que extiende el alcance del daño.", false]]}, {"id": "LC-186", "niv": 2, "e": "Un estudiante concluye, a partir del texto, que cuidar el páramo es un asunto que solo concierne a quienes viven en la montaña. Usted le explica que esa conclusión", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: reflexionar a partir de un texto y evaluar su contenido.", "o": [["A", "es correcta, porque el texto se ocupa sobre todo de los cambios en el uso del suelo de la montaña.", "Que el texto describa principalmente lo que ocurre en la montaña no limita a ella el problema: su última oración menciona los efectos en las ciudades.", false], ["B", "es errónea, porque el texto afirma que el páramo debe protegerse desde las ciudades.", "Aunque el veredicto es correcto, la razón no está en el texto: este no dice desde dónde debe protegerse el páramo, sino que su daño afecta también a quienes viven «kilómetros abajo».", false], ["C", "es errónea, porque desconoce que el daño afecta también a las ciudades que reciben el agua.", "La última oración lo dice: el daño «no solo afecta a quienes viven en la montaña, sino también a las ciudades». Contrastar una conclusión con lo que el texto afirma es evaluar su validez.", true]]}]}, {"comp": "lectura_critica", "rol": "docente", "tag": "Lectura crítica", "texto": "Lea los siguientes textos sobre el manejo de las agresiones verbales entre estudiantes:\n\nTexto 1 (fragmento de una propuesta de norma para el manual de convivencia). «El estudiante que agreda verbalmente a un compañero recibirá una anotación en el observador y, si reincide, una suspensión de un día. La sanción debe aplicarse de inmediato para que sirva de ejemplo a los demás.»\n\nTexto 2 (propuesta del comité escolar de convivencia). «Antes de sancionar, proponemos un encuentro entre el estudiante que agredió y el agredido, con un mediador. El objetivo es que quien agredió entienda el daño causado y acuerde una forma de repararlo. La sanción no se descarta, pero se reserva para quienes rechacen el proceso o reincidan.»", "items": [{"id": "LC-210", "niv": 1, "e": "Según el texto 2, la sanción se reserva para los estudiantes que", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: identificar y entender los contenidos locales que conforman un texto.", "o": [["A", "no tengan anotaciones previas en el observador.", "El texto 2 no menciona anotaciones en el observador; eso pertenece al texto 1.", false], ["B", "rechacen el proceso de encuentro o vuelvan a agredir.", "El texto 2 lo dice: la sanción «se reserva para quienes rechacen el proceso o reincidan».", true], ["C", "agredan verbalmente a un compañero por primera vez.", "Para la primera agresión, el texto 2 propone el encuentro con un mediador, no la sanción.", false]]}, {"id": "LC-211", "niv": 2, "e": "La expresión «para que sirva de ejemplo a los demás», en el texto 1, muestra que la sanción se concibe sobre todo como", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: identificar y entender los contenidos locales (sentido de palabras y expresiones en contexto).", "o": [["A", "un espacio de diálogo entre el estudiante agresor y el agredido.", "El diálogo mediado aparece en el texto 2; el texto 1 no lo contempla.", false], ["B", "una oportunidad para reparar el daño causado al compañero agredido.", "La reparación del daño es el propósito del texto 2, no del texto 1.", false], ["C", "un mensaje dirigido a toda la comunidad para prevenir nuevas faltas.", "La sanción se justifica por su efecto sobre «los demás», es decir, como advertencia o disuasión. Interpretar el sentido de una expresión en su contexto es comprensión local.", true]]}, {"id": "LC-212", "niv": 3, "e": "Un docente afirma que el texto 2 elimina las consecuencias para quienes agreden. Esta interpretación es", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: reflexionar a partir de un texto y evaluar su contenido (contraste de textos con perspectivas distintas).", "o": [["A", "inexacta, porque el texto 2 propone reparar el daño y mantiene la sanción para algunos casos.", "Comprender el daño y acordar cómo repararlo es una consecuencia para quien agredió; además, la sanción «no se descarta». Contrastar una interpretación con lo que dice el texto es reflexionar críticamente.", true], ["B", "exacta, porque el texto 2 reemplaza la suspensión por un encuentro entre los estudiantes con un mediador.", "El texto 2 no elimina la suspensión: la reserva para ciertos casos.", false], ["C", "inexacta, porque el texto 2 aplica la suspensión de inmediato, igual que el texto 1.", "Aunque el veredicto es correcto, la razón es falsa: el texto 2 no aplica la sanción de inmediato, sino que primero propone el encuentro con un mediador y reserva la sanción para quienes rechacen el proceso o reincidan.", false]]}, {"id": "LC-213", "niv": 3, "e": "La diferencia de fondo entre los dos textos es que", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: reflexionar a partir de un texto y evaluar su contenido (contraste de textos con perspectivas distintas).", "o": [["A", "el texto 1 considera grave la agresión verbal, mientras el texto 2 la considera una falta menor.", "El texto 2 no le resta gravedad; propone otra manera de responder a ella.", false], ["B", "el texto 1 prevé consecuencias para el agresor, mientras el texto 2 se ocupa únicamente del agredido.", "El texto 2 se ocupa principalmente de quien agredió: busca que entienda el daño y lo repare.", false], ["C", "el texto 1 busca castigar y disuadir, y el texto 2, que quien agredió comprenda y repare el daño.", "El texto 1 justifica la sanción por su efecto ejemplarizante; el texto 2 pone en el centro el daño y su reparación, sin descartar la sanción. Identificar el propósito de fondo de cada texto es comparar perspectivas.", true]]}]}, {"comp": "razonamiento_cuantitativo", "rol": "docente", "tag": "Razonamiento cuantitativo", "texto": "Usted es el docente delegado para el Programa de Alimentación Escolar (PAE) en una institución rural con tres sedes de primaria. Los estudiantes inscritos en el PAE son 96 en la sede principal, 132 en la sede El Placer y 72 en la sede La Unión. Cada ración servida lleva 60 gramos de arroz crudo y se sirve una ración diaria a cada estudiante inscrito en cada día de clase. Las clases son de lunes a viernes (5 días por semana). El arroz se compra en bultos de 25 kilogramos y no se pueden pedir fracciones de bulto.", "items": [{"id": "RC-101", "niv": 1, "e": "La cantidad de arroz crudo que se consume en una semana de clases en las tres sedes es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: conversión de unidades de masa y operaciones con números naturales.", "o": [["A", "90 kilogramos.", "Hay 96 + 132 + 72 = 300 estudiantes. En una semana se consumen 300 × 60 × 5 = 90.000 gramos, y como 1 kilogramo tiene 1.000 gramos, equivalen a 90 kilogramos.", true], ["B", "900 kilogramos.", "Proviene de un error de conversión de unidades: divide 90.000 gramos entre 100 en lugar de dividir entre 1.000, que es la equivalencia correcta entre gramos y kilogramos.", false], ["C", "90.000 kilogramos.", "Calcula bien la cantidad en gramos (300 × 60 × 5 = 90.000 g), pero la reporta en kilogramos sin hacer la conversión; 90.000 g equivalen a 90 kg.", false]]}, {"id": "RC-102", "niv": 2, "e": "Para un periodo de 4 semanas completas de clase, el número mínimo de bultos de arroz que usted debe solicitar es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: interpretación del cociente en contexto (redondeo por exceso).", "o": [["A", "14 bultos.", "Resulta de truncar el cociente 360 ÷ 25 = 14,4. Con 14 bultos solo se tendrían 350 kilogramos y faltarían 10 kilogramos, por lo que el cociente debe redondearse por exceso.", false], ["B", "15 bultos.", "En 4 semanas hay 20 días de clase: 300 × 60 × 20 = 360.000 g = 360 kg. Como 360 ÷ 25 = 14,4 y no se compran fracciones de bulto, se necesitan 15 bultos (375 kg).", true], ["C", "21 bultos.", "Cuenta 28 días calendario (4 × 7) en lugar de 20 días de clase: 300 × 60 × 28 = 504 kg y 504 ÷ 25 = 20,16, que redondea a 21. El caso indica que solo se sirve en días de clase.", false]]}, {"id": "RC-103", "niv": 2, "e": "Para repartir el arroz de un periodo entre las tres sedes de manera proporcional al número de estudiantes inscritos, el procedimiento adecuado es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: proporcionalidad directa y reparto proporcional.", "o": [["A", "multiplicar la cantidad total de arroz por la razón entre los estudiantes de cada sede y los de la sede más grande (96/132, 132/132 y 72/132).", "Usa una base equivocada: compara cada sede con la más grande y no con el total. Las razones suman 300/132 ≈ 2,27, de modo que se repartiría más del doble del arroz disponible.", false], ["B", "multiplicar la cantidad total de arroz por la fracción de estudiantes de cada sede, es decir, por 96/300, 132/300 y 72/300.", "En un reparto directamente proporcional cada parte se obtiene multiplicando el total por la razón entre el valor de cada sede y la suma de todos los valores (300). Las tres fracciones suman 1, así que se reparte exactamente el total.", true], ["C", "dividir la cantidad total de arroz en tres partes iguales y entregar una parte a cada sede.", "Este reparto es equitativo pero no proporcional: daría a La Unión (72 estudiantes) lo mismo que a El Placer (132 estudiantes), aunque esta última consume casi el doble.", false]]}, {"id": "RC-104", "niv": 3, "e": "Si la entidad territorial amplía en 25 % el número de inscritos solo en la sede La Unión, el nuevo consumo semanal de arroz en las tres sedes es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: porcentajes aplicados a una parte del total.", "o": [["A", "27 kilogramos.", "Corresponde únicamente al nuevo consumo de La Unión (90 estudiantes × 60 g × 5 días = 27 kg); olvida sumar el consumo de las otras dos sedes, que no cambia.", false], ["B", "95,4 kilogramos.", "El 25 % de 72 es 18, así que La Unión pasa a 90 estudiantes y el total a 318. El consumo semanal es 318 × 60 × 5 = 95.400 g = 95,4 kg.", true], ["C", "112,5 kilogramos.", "Aplica el aumento del 25 % al consumo de las tres sedes (90 × 1,25 = 112,5 kg), cuando la ampliación solo afecta a La Unión, que representa una parte del total.", false]]}]}, {"comp": "razonamiento_cuantitativo", "rol": "docente", "tag": "Razonamiento cuantitativo", "texto": "La institución remodelará un aula rectangular de 8 m de largo, 6,5 m de ancho y 3 m de alto. El piso se cubrirá con baldosas cuadradas de 50 cm de lado, sin desperdicio. Las cuatro paredes se pintarán por dentro con una sola mano de pintura, excepto la puerta, de 1 m × 2,1 m, y tres ventanas de 1,5 m × 1,2 m cada una; el techo no se pinta. Un galón de pintura cubre 25 m² con una mano. El comité de infraestructura fijó como criterio un área mínima de 1,65 m² de piso por estudiante. Usted integra ese comité.", "items": [{"id": "RC-129", "niv": 1, "e": "El área del piso del aula es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: áreas de figuras planas.", "o": [["A", "29 m².", "Corresponde al perímetro del piso, 2 × (8 + 6,5) = 29 m, que es una longitud y no un área.", false], ["B", "52 m².", "El área de un rectángulo es largo por ancho: 8 × 6,5 = 52 m².", true], ["C", "156 m².", "Multiplica también por la altura (8 × 6,5 × 3 = 156); ese valor es el volumen del aula en metros cúbicos, no el área del piso.", false]]}, {"id": "RC-130", "niv": 2, "e": "El número de baldosas necesarias para cubrir el piso es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: áreas y conversión de unidades de longitud.", "o": [["A", "58 baldosas.", "Divide el perímetro (29 m) entre el lado de la baldosa (0,5 m); así solo se contaría una hilera de baldosas alrededor del borde.", false], ["B", "104 baldosas.", "Toma 0,5 como el área de cada baldosa. Si el lado mide 0,5 m, el área es 0,5 × 0,5 = 0,25 m².", false], ["C", "208 baldosas.", "Cada baldosa mide 0,5 m × 0,5 m = 0,25 m². El piso mide 52 m², así que se requieren 52 ÷ 0,25 = 208 baldosas (16 a lo largo × 13 a lo ancho).", true]]}, {"id": "RC-131", "niv": 2, "e": "Según el criterio del comité, el número máximo de estudiantes que pueden ocupar el aula es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: interpretación del cociente en contexto (redondeo por defecto).", "o": [["A", "31 estudiantes.", "52 ÷ 1,65 = 31,5. Con 31 estudiantes cada uno dispone de al menos 1,65 m²; con 32 se necesitarían 52,8 m², más de los 52 m² disponibles.", true], ["B", "32 estudiantes.", "Redondea 31,5 hacia arriba; con 32 estudiantes el área por estudiante (1,625 m²) quedaría por debajo del mínimo.", false], ["C", "86 estudiantes.", "Multiplica el área por 1,65 en lugar de dividir (52 × 1,65 ≈ 86); el criterio indica cuántos metros cuadrados ocupa cada estudiante.", false]]}, {"id": "RC-132", "niv": 3, "e": "El número mínimo de galones de pintura que deben comprarse es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: áreas compuestas y redondeo por exceso.", "o": [["A", "3 galones.", "Trunca el cociente 79,5 ÷ 25 = 3,18. Con 3 galones solo se cubren 75 m² y faltarían 4,5 m².", false], ["B", "4 galones.", "Paredes: perímetro × altura = 29 × 3 = 87 m². Se restan la puerta (2,1 m²) y las ventanas (3 × 1,8 = 5,4 m²): 87 − 7,5 = 79,5 m². Como 79,5 ÷ 25 = 3,18, se necesitan 4 galones.", true], ["C", "6 galones.", "Suma el área del techo (52 m²) a la de las paredes (131,5 ÷ 25 = 5,26); el caso indica que el techo no se pinta.", false]]}]}, {"comp": "razonamiento_cuantitativo", "rol": "docente", "tag": "Razonamiento cuantitativo", "texto": "En la reunión de análisis de resultados se proyecta una gráfica de barras con el puntaje promedio de la institución en la prueba Saber 11 (escala de 0 a 100). Matemáticas: 48 en 2022, 52 en 2023 y 55 en 2024. Lectura crítica: 54 en 2022, 53 en 2023 y 57 en 2024. El eje vertical de la gráfica comienza en 45 y no en 0. El número de estudiantes evaluados fue 120 en 2022, 95 en 2023 y 130 en 2024. Usted debe orientar la discusión del consejo académico.", "items": [{"id": "RC-156", "niv": 1, "e": "Según los datos, el año en que la diferencia entre los promedios de lectura crítica y matemáticas fue menor es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: lectura e interpretación de datos en gráficas.", "o": [["A", "2023, con una diferencia de 1 punto.", "Diferencias: 2022, 54 − 48 = 6; 2023, 53 − 52 = 1; 2024, 57 − 55 = 2. La menor es la de 2023.", true], ["B", "2024, porque en ese año ambos promedios fueron los más altos.", "Que ambos promedios sean los más altos no implica que su diferencia sea la menor: en 2024 la diferencia fue 2 puntos, mayor que la de 2023.", false], ["C", "2022, porque en ese año se evaluaron más estudiantes que en 2023.", "El número de evaluados no determina la diferencia entre promedios; en 2022 la diferencia fue la mayor, 6 puntos.", false]]}, {"id": "RC-157", "niv": 2, "e": "El aumento porcentual del promedio de matemáticas entre 2022 y 2024 fue aproximadamente de", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: variación absoluta y relativa.", "o": [["A", "7 %.", "Confunde el aumento absoluto (7 puntos) con el aumento relativo; 7 puntos sobre una base de 48 representan más del 7 %.", false], ["B", "12,7 %.", "Divide el aumento entre el valor final (7 ÷ 55); la base de la variación porcentual es el valor inicial, 48.", false], ["C", "14,6 %.", "El aumento es 55 − 48 = 7 puntos y 7 ÷ 48 ≈ 0,146, es decir, cerca de 14,6 %.", true]]}, {"id": "RC-158", "niv": 3, "e": "Un docente comenta que en la gráfica la barra de matemáticas de 2024 se ve más del triple de alta que la de 2022. La explicación correcta de este efecto es que", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: interpretación crítica de representaciones gráficas.", "o": [["A", "el promedio de matemáticas se triplicó entre 2022 y 2024 gracias al plan de mejoramiento, como lo muestra la altura de las barras de la gráfica.", "Toma la altura visual de las barras como si representara los valores: el promedio pasó de 48 a 55, un aumento de cerca del 14,6 %.", false], ["B", "en 2024 se evaluaron más estudiantes, y la altura de cada barra depende del número de evaluados.", "La barra representa el puntaje promedio, no el número de estudiantes; además, los evaluados solo pasaron de 120 a 130.", false], ["C", "el eje comienza en 45, por lo que las barras muestran solo 3 y 10 unidades sobre ese valor y exageran visualmente el aumento.", "Con el eje desde 45, la barra de 2022 mide 48 − 45 = 3 unidades y la de 2024, 55 − 45 = 10. La proporción visual (más del triple) exagera un aumento real de 7 puntos sobre una base de 48.", true]]}, {"id": "RC-159", "niv": 2, "e": "Un directivo afirma: «como el promedio de matemáticas subió de 2022 a 2023, en 2023 hubo más estudiantes con puntaje superior a 60». Frente a esta afirmación, usted señala que", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: validación de inferencias a partir de medidas de tendencia central.", "o": [["A", "no se puede concluir, porque el promedio no indica cuántos estudiantes superan un puntaje determinado.", "El promedio resume el conjunto pero no describe la distribución de los puntajes; con 95 evaluados frente a 120, podría incluso haber menos estudiantes por encima de 60.", true], ["B", "es incorrecta, porque según la tabla el promedio de matemáticas bajó entre 2022 y 2023.", "Lee mal los datos: el promedio pasó de 48 a 52, es decir, subió. El problema de la afirmación es lo que se infiere del promedio.", false], ["C", "es correcta, porque un aumento de 4 puntos en el promedio implica más estudiantes con puntajes altos.", "Un promedio mayor puede deberse a que subieron los puntajes bajos sin que aumente el número de puntajes altos; la afirmación no se deduce de los datos.", false]]}]}, {"comp": "razonamiento_cuantitativo", "rol": "docente", "tag": "Razonamiento cuantitativo", "texto": "La factura mensual de energía de una sede educativa se calcula con un cargo fijo de $18.000 más $850 por cada kilovatio-hora (kWh) consumido. En una gráfica de la factura (eje vertical, en pesos) frente al consumo (eje horizontal, en kWh), esta tarifa es una recta. Un nuevo comercializador ofrece un plan sin cargo fijo, a $920 por kWh. Usted, como integrante del comité de gestión ambiental, analiza el consumo.", "items": [{"id": "RC-201", "niv": 1, "e": "Con la tarifa actual, la factura de un mes con un consumo de 400 kWh es de", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: funciones lineales en contexto.", "o": [["A", "$340.000.", "Calcula solo el valor del consumo (400 × 850) y omite el cargo fijo de $18.000.", false], ["B", "$358.000.", "Factura = 18.000 + 850 × 400 = 18.000 + 340.000 = $358.000.", true], ["C", "$7.540.000.", "Suma el cargo fijo al precio de cada kWh antes de multiplicar ((18.000 + 850) × 400), como si el cargo fijo se cobrara por cada kWh.", false]]}, {"id": "RC-202", "niv": 2, "e": "Si con la tarifa actual una factura fue de $443.000, el consumo de ese mes fue", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: solución de ecuaciones lineales.", "o": [["A", "500 kWh.", "Se resuelve 18.000 + 850x = 443.000: 850x = 425.000, de donde x = 500 kWh.", true], ["B", "521 kWh.", "Divide el valor total entre 850 sin descontar antes el cargo fijo (443.000 ÷ 850 ≈ 521).", false], ["C", "542 kWh.", "Suma el cargo fijo en lugar de restarlo ((443.000 + 18.000) ÷ 850 ≈ 542) al despejar la ecuación.", false]]}, {"id": "RC-203", "niv": 2, "e": "En la gráfica de la tarifa actual, la pendiente de la recta representa", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: interpretación de la pendiente como razón de cambio.", "o": [["A", "el cargo fijo de $18.000 que se cobra aunque no haya consumo.", "El cargo fijo corresponde al punto de corte con el eje vertical (consumo 0), no a la pendiente.", false], ["B", "el valor promedio de cada kWh, que se obtiene al dividir el total de la factura entre el consumo.", "Ese cociente incluye el cargo fijo y cambia con el consumo; la pendiente es constante e igual al costo de cada kWh adicional.", false], ["C", "el aumento en el valor de la factura por cada kWh adicional consumido, es decir, $850.", "En una función lineal f(x) = 18.000 + 850x, la pendiente (850) es la razón de cambio: cuánto aumenta la factura por cada unidad adicional de consumo.", true]]}, {"id": "RC-204", "niv": 3, "e": "El consumo mínimo, en kWh enteros, a partir del cual la tarifa actual resulta más económica que el plan del nuevo comercializador es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: comparación de funciones lineales e inecuaciones.", "o": [["A", "21 kWh.", "Divide el cargo fijo entre el precio del kWh (18.000 ÷ 850 ≈ 21); la comparación debe hacerse con la diferencia de precios entre los planes ($70 por kWh).", false], ["B", "257 kWh.", "Trunca el punto de equilibrio 18.000 ÷ 70 ≈ 257,1. Con 257 kWh la tarifa actual cuesta $236.450 y el plan nuevo $236.440, así que todavía es más barato el nuevo.", false], ["C", "258 kWh.", "Los planes cuestan igual cuando 18.000 + 850x = 920x, es decir, x = 18.000 ÷ 70 ≈ 257,1. Para x = 258: tarifa actual $237.300 y plan nuevo $237.360, por lo que la actual ya es más económica.", true]]}]}, {"comp": "razonamiento_cuantitativo", "rol": "docente", "tag": "Razonamiento cuantitativo", "texto": "En el plan lector, usted registró cuántos libros completos leyó durante el año cada uno de los 40 estudiantes de grado cuarto: 4 estudiantes leyeron 0 libros, 10 leyeron 1 libro, 12 leyeron 2 libros, 8 leyeron 3 libros y 6 leyeron 4 libros.", "items": [{"id": "RC-208", "niv": 1, "e": "La moda del número de libros leídos es", "f": "MEN (2006). Estándares Básicos de Competencias en Matemáticas: pensamiento aleatorio; moda en tablas de frecuencia.", "o": [["A", "2 libros.", "La moda es el valor con mayor frecuencia: 2 libros, que leyeron 12 estudiantes.", true], ["B", "4 libros.", "Es el mayor número de libros leídos (valor máximo), no el valor más frecuente.", false], ["C", "12 libros.", "Es la frecuencia de la moda (12 estudiantes), no el valor de la variable; confunde la frecuencia con el dato.", false]]}, {"id": "RC-209", "niv": 2, "e": "El promedio de libros leídos por estudiante es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: media aritmética a partir de tablas de frecuencia.", "o": [["A", "2 libros.", "Corresponde a la mediana o a la moda; el promedio se calcula con la suma de todos los libros leídos dividida entre 40.", false], ["B", "2,05 libros.", "Total de libros: 0 × 4 + 1 × 10 + 2 × 12 + 3 × 8 + 4 × 6 = 0 + 10 + 24 + 24 + 24 = 82. Promedio: 82 ÷ 40 = 2,05.", true], ["C", "8 libros.", "Promedia las frecuencias (40 ÷ 5 = 8) en lugar de los valores de la variable ponderados por su frecuencia.", false]]}, {"id": "RC-210", "niv": 3, "e": "Para que el promedio del grupo llegue a 2,5 libros por estudiante, el número adicional de libros que deben leer en total los 40 estudiantes es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: media aritmética y planteamiento de metas.", "o": [["A", "0,45 libros.", "Es el aumento necesario en el promedio por estudiante (2,5 − 2,05), no la cantidad total de libros adicionales del grupo.", false], ["B", "18 libros.", "Para un promedio de 2,5 con 40 estudiantes se necesitan 2,5 × 40 = 100 libros. Ya se leyeron 82, así que faltan 100 − 82 = 18 libros.", true], ["C", "100 libros.", "Es el total de libros que corresponde al promedio de 2,5; falta restar los 82 libros ya leídos.", false]]}]}, {"comp": "competencias_blandas", "rol": "docente", "tag": "Competencias blandas y ciudadanas · Gobierno escolar y participación (Ley 115 de 1994; Decretos 1860 de 1994 y 1286 de 2005)", "texto": "Usted es uno de los dos docentes de un centro educativo rural que ofrece desde preescolar hasta quinto grado, con 38 estudiantes. El consejo directivo convocó, en la tercera semana del calendario académico, las asambleas de estudiantes para elegir a los voceros del consejo de estudiantes. Los niños de preescolar a tercero están muy entusiasmados y varios de primero quieren postularse. En cuarto y quinto, algunos estudiantes proponen que el vocero sea «el que mejor se porte».", "items": [{"id": "CB-105", "niv": 2, "e": "A los niños de primero que quieren postularse, usted les explica que, según la norma, los estudiantes de preescolar y de los tres primeros grados", "f": "Decreto 1860 de 1994, art. 29 (compilado en el Decreto 1075 de 2015).", "o": [["A", "no eligen vocero, porque por su edad quedan representados por el vocero del grado quinto.", "Excluir a los más pequeños por su edad contradice la norma, que sí les reconoce participación mediante una asamblea conjunta que elige un vocero de tercer grado.", false], ["B", "eligen cada uno su propio vocero, aunque estos tienen voz pero no voto en el consejo de estudiantes.", "Parece una forma de dar participación a cada grado, pero la norma no prevé voceros por grado en ese tramo ni voceros sin voto; prevé un vocero único elegido entre los estudiantes de tercero.", false], ["C", "eligen en una asamblea conjunta un vocero único, que debe ser un estudiante de tercer grado.", "El artículo 29 del Decreto 1860 de 1994 dispone que los alumnos de preescolar y de los tres primeros grados de primaria se reúnen en una asamblea conjunta para elegir un vocero único entre los estudiantes de tercer grado.", true]]}, {"id": "CB-106", "niv": 1, "e": "Ante la propuesta de que el vocero sea «el que mejor se porte», usted orienta la discusión de cuarto y quinto hacia", "f": "MEN (2004). Estándares Básicos de Competencias Ciudadanas, Serie Guías n.º 6 (participación y responsabilidad democrática); Decreto 1860 de 1994, art. 29.", "o": [["A", "definir qué tareas cumplirá el vocero y qué cualidades necesita para representar bien a sus compañeros.", "Ayudar a los estudiantes a relacionar la elección con la función de representar es coherente con la participación y responsabilidad democrática (Guía 6): se elige a quien pueda cumplir el cargo, no a quien obtenga un premio.", true], ["B", "proponer usted una terna con los estudiantes de mejor desempeño, para facilitar una elección más ordenada.", "Facilita el proceso, pero el docente decide quiénes pueden ser elegidos y limita la participación; la norma prevé que los estudiantes elijan de su seno mediante votación secreta.", false], ["C", "aceptar ese criterio, porque el buen comportamiento es una forma objetiva de reconocer a los estudiantes responsables.", "El buen comportamiento puede ser valioso, pero convierte la representación en un premio a la disciplina y desconoce que la elección debe basarse en la capacidad de representar al grupo.", false]]}, {"id": "CB-107", "niv": 1, "e": "Una vez conformado el consejo de estudiantes, usted les explica que una de sus funciones es", "f": "Decreto 1860 de 1994, arts. 28 y 29; Ley 115 de 1994, art. 144.", "o": [["A", "aprobar el manual de convivencia, por ser el máximo órgano de participación de los estudiantes.", "Es cierto que el consejo de estudiantes es el máximo órgano de participación de los educandos, pero adoptar el reglamento corresponde al consejo directivo (Ley 115, art. 144, literal c).", false], ["B", "elegir al personero entre los voceros de los grados, para que represente a todo el estudiantado.", "Confunde las figuras: al personero lo eligen todos los estudiantes matriculados por voto secreto (Decreto 1860, art. 28), no el consejo de estudiantes.", false], ["C", "elegir al representante de los estudiantes ante el consejo directivo y asesorarlo en su labor.", "El artículo 29 del Decreto 1860 de 1994 asigna al consejo de estudiantes darse su organización interna, elegir al representante ante el consejo directivo y asesorarlo, e invitar a estudiantes con iniciativas.", true]]}, {"id": "CB-108", "niv": 3, "e": "Dos semanas después, la vocera de tercero le cuenta que los niños de preescolar dicen que ella «nunca les pregunta nada». La forma de acompañarla que mejor fortalece la participación es", "f": "MEN (2004). Estándares Básicos de Competencias Ciudadanas, Serie Guías n.º 6 (participación y responsabilidad democrática, grados 1.° a 3.°); Decreto 1860 de 1994, art. 29.", "o": [["A", "ayudarla a preparar, con dibujos o preguntas sencillas, un momento corto para escuchar a los más pequeños antes de cada reunión.", "Fortalece la competencia de la vocera para representar y hace efectiva la participación de los más pequeños con medios adecuados a su edad, en línea con los estándares de participación de los primeros grados (Guía 6).", true], ["B", "pedirle que asista a las reuniones con la docente de preescolar, quien conoce mejor las necesidades de esos niños.", "Busca apoyar a la vocera, pero traslada a un adulto la tarea de representar y no desarrolla en la estudiante la capacidad de escuchar a quienes representa.", false], ["C", "explicar a los niños de preescolar que la vocera los representa a todos y que confíen en las decisiones que ella tome.", "Defiende a la vocera, pero ignora el reclamo legítimo de los niños: la representación supone escuchar a los representados, no solo pedirles confianza.", false]]}]}, {"comp": "competencias_blandas", "rol": "docente", "tag": "Competencias blandas y ciudadanas · Competencias ciudadanas: pluralidad, identidad y valoración de las diferencias (Guía 6)", "texto": "Usted es docente de una institución etnoeducativa ubicada en un resguardo wayuu de La Guajira, donde la mayoría de los estudiantes habla wayuunaiki. Algunos estudiantes de séptimo, que viajan con frecuencia a Riohacha, dicen sentir vergüenza de hablar su lengua y piden que las clases sean solo en español «para que no se burlen de ellos en la ciudad». Una autoridad tradicional de la comunidad ofrece enseñar en la escuela el tejido y los relatos de su pueblo.", "items": [{"id": "CB-145", "niv": 1, "e": "Frente a la vergüenza que expresan los estudiantes por hablar su lengua, usted", "f": "Ley 115 de 1994, arts. 56 y 57; MEN (2004). Estándares Básicos de Competencias Ciudadanas, Serie Guías n.º 6 (pluralidad, identidad y valoración de las diferencias).", "o": [["A", "les explica que la burla en la ciudad es un problema de quienes se burlan y que no deben darle importancia.", "Es cierto que la responsabilidad es de quien discrimina, pero minimizar la experiencia de los estudiantes no atiende su malestar ni fortalece su identidad.", false], ["B", "acepta dictar las clases solo en español, porque así responde a la necesidad que los mismos estudiantes expresan.", "Escuchar a los estudiantes es importante, pero abandonar la lengua materna contradice el carácter bilingüe de la etnoeducación y refuerza la idea de que su lengua vale menos.", false], ["C", "abre espacios para que valoren su lengua y su cultura, y a la vez los acompaña en el fortalecimiento del español.", "En los territorios de grupos étnicos con tradición lingüística propia la enseñanza es bilingüe, con fundamento en la lengua materna (Ley 115 de 1994, art. 57), y la etnoeducación busca afianzar la identidad (art. 56). Fortalecer también el español responde a la necesidad que expresan los estudiantes.", true]]}, {"id": "CB-146", "niv": 2, "e": "Sobre el ofrecimiento de la autoridad tradicional, la decisión más coherente con la etnoeducación es", "f": "Ley 115 de 1994, arts. 55 y 56.", "o": [["A", "integrar sus saberes al plan de estudios, articulándolos con las áreas y con la participación de la comunidad.", "La etnoeducación se orienta por criterios de integridad, interculturalidad y participación comunitaria, y debe estar ligada al proceso social y cultural de la comunidad (Ley 115 de 1994, arts. 55 y 56).", true], ["B", "aceptar que dicte talleres voluntarios en contrajornada, para no afectar el tiempo de las áreas obligatorias.", "Acoge el ofrecimiento, pero deja los saberes propios al margen del currículo, como algo opcional, cuando la etnoeducación los integra al proceso formativo.", false], ["C", "agradecer el ofrecimiento y pedir primero a la secretaría de educación una certificación de su idoneidad pedagógica.", "Cuidar la calidad es razonable, pero condicionar el aporte de la autoridad tradicional a un trámite externo desconoce el criterio de participación comunitaria de la etnoeducación.", false]]}, {"id": "CB-147", "niv": 2, "e": "Para preparar a los estudiantes ante las burlas que reciben en la ciudad, usted trabaja con ellos", "f": "MEN (2004). Estándares Básicos de Competencias Ciudadanas, Serie Guías n.º 6 (competencias comunicativas; pluralidad, identidad y valoración de las diferencias).", "o": [["A", "formas de evitar que noten su origen en la ciudad, hasta que se sientan seguros con sus nuevos compañeros.", "Busca protegerlos de la burla, pero les enseña a ocultar su identidad, lo contrario de lo que persigue la formación en pluralidad e identidad.", false], ["B", "formas de responder con asertividad y de buscar apoyo en adultos e instancias de la escuela a la que asisten.", "La asertividad, expresar el propio punto de vista con claridad, firmeza y sin agresión, es una competencia comunicativa central (Guía 6); buscar apoyo institucional les permite no enfrentar solos la discriminación.", true], ["C", "respuestas firmes que dejen en evidencia la ignorancia de quienes se burlan, para que no lo vuelvan a hacer.", "Defender la propia dignidad es legítimo, pero responder ridiculizando al otro puede escalar el conflicto; la asertividad implica firmeza sin agresión.", false]]}, {"id": "CB-148", "niv": 3, "e": "Al planear con otros docentes un proyecto sobre identidad cultural, una actuación que valora la diversidad sin reducirla a estereotipos es", "f": "MEN (2004). Estándares Básicos de Competencias Ciudadanas, Serie Guías n.º 6 (pluralidad, identidad y valoración de las diferencias); Ley 115 de 1994, art. 56.", "o": [["A", "centrar el proyecto en las tradiciones más antiguas, por ser la expresión más auténtica de la cultura de la comunidad.", "Valorar las tradiciones es importante, pero presentar solo las más antiguas como «auténticas» desconoce que las culturas cambian y deja por fuera las experiencias actuales de los estudiantes.", false], ["B", "incluir en el proyecto las distintas formas en que las familias de la comunidad viven hoy su cultura.", "La Guía 6 plantea el reconocimiento de la diversidad humana; esa diversidad existe también dentro de cada pueblo. Incluir en el proyecto las formas actuales en que las familias viven su cultura evita imponer a los estudiantes una sola imagen de lo que significa ser wayuu.", true], ["C", "organizar un día cultural con trajes, danzas y comidas típicas como actividad central y cierre del proyecto.", "Es una actividad valiosa como parte del proyecto, pero hacerla el eje reduce la cultura a lo folclórico y visible, sin trabajar la identidad ni la reflexión de los estudiantes.", false]]}]}, {"comp": "competencias_blandas", "rol": "docente", "tag": "Competencias blandas y ciudadanas · Habilidades socioemocionales en el aula", "texto": "Usted es docente de química de once. Faltan tres semanas para la prueba Saber 11 y varios estudiantes muestran ansiedad: una estudiante tiene crisis de llanto en los simulacros y otros dicen que «si les va mal, no sirven para nada». En una clase, un estudiante, frustrado por una nota, le dice a usted delante del grupo que es «el peor profesor del colegio». El grupo queda en silencio, atento a su reacción.", "items": [{"id": "CB-181", "niv": 1, "e": "Frente al comentario del estudiante delante del grupo, usted", "f": "MEN (2008). Guía 31, Anexo 1: Glosario de competencias (comunicación y relaciones interpersonales); MEN (2004). Estándares Básicos de Competencias Ciudadanas, Serie Guías n.º 6 (competencias emocionales).", "o": [["A", "le responde con firmeza frente al grupo, para que los demás no piensen que pueden faltarle al respeto.", "Poner límites es necesario, pero confrontarlo en público, cuando el estudiante está frustrado, puede escalar la situación y convertirla en una disputa de autoridad.", false], ["B", "le pide que salga del salón hasta que se calme, para evitar que la situación escale frente al grupo.", "Busca evitar la escalada, pero lo aparta de la clase y aplaza el manejo del conflicto sin ofrecerle una conversación.", false], ["C", "mantiene la calma, le dice que hablarán al terminar la clase y continúa con la actividad.", "Regular la propia emoción y posponer la conversación para un momento adecuado corresponde al manejo de emociones de la competencia de comunicación y relaciones interpersonales (Guía 31) y modela autorregulación para el grupo (Guía 6).", true]]}, {"id": "CB-182", "niv": 2, "e": "En la conversación posterior con el estudiante, usted", "f": "MEN (2004). Estándares Básicos de Competencias Ciudadanas, Serie Guías n.º 6 (competencias comunicativas: asertividad y escucha activa); Decreto 1290 de 2009, art. 4.", "o": [["A", "le señala con claridad que el comentario fue irrespetuoso, escucha su inconformidad y le indica cómo reclamar la nota.", "Poner un límite claro sin agresión es asertividad, y escuchar la inconformidad es escucha activa (Guía 6). Indicar el procedimiento de reclamación (Decreto 1290 de 2009, art. 4) canaliza el desacuerdo por la vía correcta.", true], ["B", "conversa con él sobre su frustración y acuerdan cómo manejar los desacuerdos, sin volver sobre el comentario.", "El diálogo sobre la frustración es útil, pero omitir el irrespeto le transmite que esa forma de expresarse frente al grupo es aceptable.", false], ["C", "le explica que el irrespeto es una falta del manual de convivencia y le hace la anotación correspondiente.", "Aplicar el manual puede ser pertinente, pero limitarse a la sanción no atiende la inconformidad por la nota ni le indica cómo tramitarla.", false]]}, {"id": "CB-183", "niv": 2, "e": "Frente a la idea de que «si les va mal, no sirven para nada», usted", "f": "MEN (2004). Estándares Básicos de Competencias Ciudadanas, Serie Guías n.º 6 (competencias emocionales y cognitivas).", "o": [["A", "les asegura que a todos les irá bien si siguen estudiando con disciplina en las próximas semanas.", "Busca tranquilizarlos, pero ofrece una garantía que no puede cumplir y mantiene la idea de que su valor depende del resultado.", false], ["B", "ayuda a los estudiantes a reconocer que un resultado no define su valor y a identificar sus avances.", "Identificar y transformar pensamientos que generan malestar es parte de las competencias emocionales y cognitivas (Guía 6). Reconocer los avances reduce la ansiedad sin negar la importancia de la prueba.", true], ["C", "les recuerda la importancia de la prueba para su futuro, para que canalicen la ansiedad en el estudio.", "Quiere motivarlos, pero aumenta la presión que ya sienten y refuerza la creencia que genera la ansiedad.", false]]}, {"id": "CB-184", "niv": 3, "e": "Para la estudiante que tiene crisis de llanto en los simulacros, la respuesta más adecuada es", "f": "MEN (2004). Estándares Básicos de Competencias Ciudadanas, Serie Guías n.º 6 (competencias emocionales).", "o": [["A", "hablar con ella en privado, enseñarle estrategias de regulación y acordar con orientación un acompañamiento.", "Reconocer las emociones de la estudiante y ayudarla a manejarlas son competencias emocionales (Guía 6); articular con orientación escolar asegura un acompañamiento adecuado cuando la ansiedad es intensa.", true], ["B", "pedirle que practique más simulacros en casa, porque la familiaridad con la prueba reduce la ansiedad.", "La práctica puede ayudar, pero no atiende la intensidad emocional de las crisis ni ofrece acompañamiento.", false], ["C", "eximirla de presentar los simulacros restantes, para evitarle una nueva crisis en las semanas previas a la prueba.", "Busca protegerla, pero evitar la situación no le da herramientas para manejar la ansiedad que enfrentará el día de la prueba.", false]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Constitución Política (arts. 44 y 67) y Código de la Infancia y la Adolescencia", "texto": "Usted es docente de una sede rural multigrado en zona cafetera. En época de cosecha, Andrés, de 13 años y estudiante de sexto grado, deja de asistir durante dos semanas. Al visitar la finca, usted encuentra al estudiante recolectando café durante toda la jornada. El padre le explica que la familia necesita el ingreso, que el muchacho «ya terminó la primaria» y que, a su juicio, «con saber leer y sumar es suficiente para trabajar el campo». Agrega que en marzo lo vuelve a mandar al colegio si la cosecha termina bien. La institución tiene registradas las inasistencias y no ha recibido ninguna excusa formal.", "items": [{"id": "NR-101", "niv": 1, "e": "Para explicar al padre hasta qué edad la educación es obligatoria, usted le informa que, según la Constitución, lo es", "f": "Constitución Política de Colombia, artículo 67.", "o": [["A", "entre los cinco y los doce años, y comprende el preescolar y los cinco grados de la básica primaria.", "Coincide con la idea del padre de que basta con terminar la primaria. El artículo 67 incluye nueve grados de educación básica, es decir, primaria y secundaria, no solo cinco.", false], ["B", "entre los seis y los dieciocho años, y comprende la básica primaria, la básica secundaria y la educación media.", "Confunde la obligatoriedad constitucional con la duración total de la educación formal. La media (grados décimo y once) no hace parte del mínimo obligatorio del artículo 67, que va de los cinco a los quince años.", false], ["C", "entre los cinco y los quince años, y comprende como mínimo un año de preescolar y nueve de educación básica.", "El artículo 67 de la Constitución establece que la educación será obligatoria entre los cinco y los quince años de edad y que comprenderá como mínimo un año de preescolar y nueve de educación básica. Andrés, de 13 años y en sexto grado, está dentro de ese rango.", true]]}, {"id": "NR-102", "niv": 2, "e": "Ante el argumento de que la familia necesita el ingreso, usted le explica al padre que la Constitución", "f": "Constitución Política, artículos 44, 67 y 68.", "o": [["A", "permite suspender los estudios en la zona rural mientras duren las temporadas de cosecha.", "Ninguna disposición constitucional autoriza suspender la educación obligatoria por temporadas productivas. El artículo 67 encarga al Estado asegurar a los menores las condiciones necesarias para su acceso y permanencia en el sistema educativo.", false], ["B", "reconoce la educación como derecho fundamental de los niños y los protege contra la explotación laboral o económica.", "El artículo 44 de la Constitución incluye la educación entre los derechos fundamentales de los niños y dispone que serán protegidos contra toda forma de explotación laboral o económica y trabajos riesgosos. Una jornada completa de recolección que le impide estudiar va contra esa protección.", true], ["C", "deja la decisión a los padres, porque les reconoce el derecho de escoger el tipo de educación de sus hijos.", "El artículo 68 reconoce a los padres el derecho a escoger el tipo de educación de sus hijos menores, no a decidir si el niño estudia. La obligatoriedad del artículo 67 y la protección del artículo 44 no quedan a su arbitrio.", false]]}, {"id": "NR-103", "niv": 2, "e": "Como las inasistencias continúan, frente a la situación de Andrés la institución debe, según el artículo 44 del Código de la Infancia y la Adolescencia,", "f": "Ley 1098 de 2006, artículos 42 (numeral 1) y 44 (numeral 2).", "o": [["A", "retirar al estudiante del sistema de matrícula, porque la familia decidió no enviarlo durante la cosecha.", "Retirarlo profundizaría la vulneración. El Código obliga a las instituciones a facilitar el acceso y garantizar la permanencia (artículo 42, numeral 1), no a excluir al estudiante por una decisión de su familia.", false], ["B", "esperar al cierre del período para reflejar las inasistencias en el informe de valoración académica.", "Registrar las ausencias en el boletín no cumple la obligación de detección y apoyo oportunos del numeral 2 del artículo 44; esperar al cierre del período deja al estudiante trabajando sin ninguna intervención.", false], ["C", "poner en marcha mecanismos de detección oportuna, apoyo y orientación para casos de explotación económica y laboral.", "El numeral 2 del artículo 44 de la Ley 1098 de 2006 ordena a directivos y docentes poner en marcha mecanismos para la detección oportuna, el apoyo y la orientación en casos de explotación económica y laboral, entre otros. La inasistencia por trabajo durante la jornada escolar exige esa actuación.", true]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Escuelas para padres, madres y cuidadores (Ley 2025 de 2020)", "texto": "Usted lidera, junto con la orientadora, el diseño de la escuela de padres, madres y cuidadores de una institución que tiene una sede urbana y cuatro sedes rurales en el Cauca. Muchas familias viven a más de una hora de la sede principal y trabajan en jornadas largas. El rector le pide definir cuántos encuentros programar en el año, en qué documento institucional debe quedar formalizado el programa y qué temas no pueden faltar en su estructura.", "items": [{"id": "NR-127", "niv": 1, "e": "Sobre el número de encuentros, la Ley 2025 de 2020 señala como mínimo deseable", "f": "Ley 2025 de 2020, artículos 5 y 6 (parágrafo 1).", "o": [["A", "tres momentos de encuentro durante el año escolar.", "El parágrafo 1 del artículo 6 de la Ley 2025 de 2020 fija como mínimo deseable tres momentos de encuentro durante el año escolar; la institución puede programar más según su contexto.", true], ["B", "un momento de encuentro en cada mes del año escolar.", "La ley no exige encuentros mensuales; el mínimo deseable es de tres en el año y la periodicidad la define cada institución (artículo 5).", false], ["C", "un momento de encuentro al inicio del año escolar.", "Un solo encuentro queda por debajo del mínimo deseable de tres que establece el parágrafo 1 del artículo 6.", false]]}, {"id": "NR-128", "niv": 2, "e": "En cuanto a su formalización, la Ley 2025 de 2020 exige que la escuela de padres", "f": "Ley 2025 de 2020, artículos 3, 5 y 7.", "o": [["A", "funcione como un programa independiente del PEI, definido cada año por la asociación de padres de familia de la institución.", "La ley exige lo contrario: articular el programa al PEI mediante un apartado especial (artículo 3); su estructura la definen la institución y el consejo directivo (artículo 5).", false], ["B", "se rija por un programa único que la secretaría de educación diseña para todas las instituciones.", "A las entidades territoriales certificadas les corresponde promover la implementación e incluir el tema en la formación docente (artículo 7); el diseño lo hace cada institución con autonomía, en asocio con el consejo directivo (artículo 5).", false], ["C", "tenga un apartado especial en el PEI, articulado con la misión, la visión, los principios y los valores institucionales.", "El artículo 3 de la Ley 2025 de 2020 dispone que toda institución pública y privada debe tener un apartado especial en el PEI que defina cómo se desarrollará el programa, alineado y articulado con su misión, visión, principios y valores.", true]]}, {"id": "NR-129", "niv": 3, "e": "Al definir los contenidos, usted tiene en cuenta que, por disposición expresa de la ley, la estructura de la escuela de padres debe contar con", "f": "Ley 2025 de 2020, artículo 5 y parágrafo.", "o": [["A", "un taller exclusivo de técnicas de estudio, que reemplace los demás contenidos para las familias rurales.", "Los instrumentos de técnicas de estudio son uno de los contenidos mínimos (literal I), pero no reemplazan a los demás ni son el taller exclusivo que exige el parágrafo del artículo 5.", false], ["B", "un taller exclusivo para prevenir y atender la violencia sexual contra niños, niñas y adolescentes desde las familias.", "El parágrafo del artículo 5 de la Ley 2025 de 2020 ordena que, en desarrollo de los literales C, E, G y J, la estructura cuente con un taller exclusivo que permita prevenir y atender la violencia sexual contra niños, niñas y adolescentes desde el interior de las familias.", true], ["C", "un módulo exclusivo de emprendimiento familiar, para mejorar las condiciones económicas de los hogares.", "El emprendimiento no figura entre los contenidos mínimos del artículo 5; el taller exclusivo que la ley exige es el de prevención y atención de la violencia sexual.", false]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Servicio social estudiantil obligatorio (Ley 115 de 1994; Decreto 1860 de 1994; Resolución 4210 de 1996)", "texto": "Usted coordina el servicio social estudiantil en una institución rural del Huila que ofrece media técnica agropecuaria. Al iniciar el año, un grupo de estudiantes de noveno pregunta si ya pueden empezar a prestar el servicio; un padre propone que los estudiantes de décimo cumplan sus horas ayudando en la secretaría del colegio; y Camila, de grado once, que ha completado 50 horas de servicio, pregunta si podrá graduarse en diciembre aunque no termine las restantes.", "items": [{"id": "NR-138", "niv": 1, "e": "A los estudiantes de noveno, usted les explica que, según la Ley 115 de 1994, el servicio social obligatorio lo prestan", "f": "Ley 115 de 1994, artículos 11 y 97.", "o": [["A", "los estudiantes de educación media, durante los dos grados de ese nivel.", "El artículo 97 de la Ley 115 de 1994 establece que los estudiantes de educación media prestarán un servicio social obligatorio durante los dos grados de estudios. Noveno pertenece a la básica secundaria.", true], ["B", "los estudiantes de grado once, durante el último semestre del año escolar.", "La ley lo distribuye durante los dos grados de la media, no solo en el último semestre de once.", false], ["C", "los estudiantes de básica secundaria y media, a partir del grado octavo.", "El servicio social es propio de la educación media (grados décimo y once); la ley no lo extiende a la básica secundaria.", false]]}, {"id": "NR-139", "niv": 2, "e": "Frente a la propuesta del padre, usted explica que, en programas de carácter agropecuario como el de la institución, la Ley 115 de 1994 prevé que el servicio social se preste", "f": "Ley 115 de 1994, artículo 66; Decreto 1860 de 1994, artículo 39.", "o": [["A", "capacitando y asesorando a la población campesina de la región.", "El artículo 66 de la Ley 115 de 1994 dispone que los estudiantes de programas de carácter agropecuario, agroindustrial o ecológico prestarán el servicio social obligatorio capacitando y asesorando a la población campesina de la región.", true], ["B", "apoyando las labores administrativas de la secretaría de la institución.", "Las labores administrativas internas no cumplen el propósito del servicio social de integrarse a la comunidad (Decreto 1860, artículo 39) ni lo que el artículo 66 prevé para programas agropecuarios.", false], ["C", "dictando refuerzos escolares a los estudiantes de primaria de la institución.", "Aunque es una actividad solidaria, el artículo 66 señala de manera específica que en programas agropecuarios el servicio se presta capacitando y asesorando a la población campesina de la región.", false]]}, {"id": "NR-140", "niv": 2, "e": "Sobre la definición de los temas y objetivos del servicio social, el Decreto 1860 de 1994 establece que", "f": "Decreto 1860 de 1994, artículo 39.", "o": [["A", "los fija cada estudiante según la entidad en la que consiga un cupo para prestar el servicio.", "La elección individual de una entidad no reemplaza la definición institucional: los temas y objetivos los fija el PEI (artículo 39).", false], ["B", "los define la secretaría de educación, de manera igual para todas las instituciones de su jurisdicción.", "El Decreto 1860 deja esta definición a cada institución mediante su PEI; el Ministerio de Educación reglamenta aspectos generales de organización (Resolución 4210 de 1996).", false], ["C", "se definen en el proyecto educativo institucional y pueden ejecutarse con entidades gubernamentales y no gubernamentales.", "El artículo 39 del Decreto 1860 de 1994 señala que los temas y objetivos del servicio social estudiantil serán definidos en el PEI y que sus programas pueden ejecutarse en forma conjunta con entidades gubernamentales y no gubernamentales especializadas en la atención a las familias y comunidades.", true]]}, {"id": "NR-141", "niv": 3, "e": "A la pregunta de Camila, usted responde que", "f": "Resolución 4210 de 1996 del Ministerio de Educación Nacional, artículo 6; Ley 115 de 1994, artículo 97.", "o": [["A", "puede graduarse si compensa las horas faltantes con un trabajo escrito sobre su experiencia.", "La norma exige una intensidad mínima de horas de prestación del servicio; un trabajo escrito no sustituye las horas que faltan.", false], ["B", "debe completar la intensidad mínima de 80 horas, porque el servicio social es requisito para obtener el título de bachiller.", "El artículo 6 de la Resolución 4210 de 1996 del Ministerio de Educación fija una intensidad mínima de ochenta horas de servicio social, y esa misma resolución lo establece como requisito indispensable para la obtención del título de bachiller.", true], ["C", "puede graduarse, porque el servicio social es una actividad formativa que no condiciona el título.", "Aunque es formativo, el servicio social obligatorio es requisito para la obtención del título de bachiller; con 50 horas Camila no alcanza la intensidad mínima.", false]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Educación inclusiva (Decreto 1421 de 2017, compilado en el Decreto 1075 de 2015)", "texto": "En agosto llega a una institución oficial de Sincelejo Tomás, de 9 años, con síndrome de Down, que hasta ahora no había estado escolarizado. La familia trae un informe de la fundación de rehabilitación a la que asistía, pero no un diagnóstico médico actualizado. La secretaria académica sugiere no matricularlo hasta que traigan el diagnóstico o «remitirlo a una institución especial». Usted será su docente de primer grado y ya planea sus clases con distintas formas de presentar la información y de participar, pensadas para todo el grupo.", "items": [{"id": "NR-168", "niv": 1, "e": "Frente a la sugerencia de la secretaria académica, el Decreto 1421 de 2017 establece que", "f": "Decreto 1421 de 2017 (Decreto 1075 de 2015, sección 2.3.3.5): definiciones y no discriminación.", "o": [["A", "ningún establecimiento puede rechazar la matrícula de un estudiante en razón de su discapacidad.", "El Decreto 1421 de 2017 (Decreto 1075 de 2015, sección 2.3.3.5) dispone que ningún establecimiento educativo podrá rechazar la matrícula de un estudiante en razón de su situación de discapacidad, ni negarse a hacer los ajustes razonables que se requieran.", true], ["B", "la matrícula se condiciona a que la familia presente un diagnóstico médico actualizado.", "Los apoyos y ajustes se definen a partir de la valoración pedagógica y social y de las barreras del entorno; la falta de un diagnóstico médico no autoriza a negar la matrícula.", false], ["C", "el estudiante debe remitirse a una institución especializada en la atención de la discapacidad intelectual.", "La educación inclusiva busca el aprendizaje con pares de la misma edad en un ambiente de aprendizaje común; remitirlo por su discapacidad contradice ese enfoque y la prohibición de rechazo.", false]]}, {"id": "NR-169", "niv": 2, "e": "Como Tomás ingresa al sistema educativo con el año escolar en curso, el Decreto 1421 de 2017 dispone que su PIAR y el acta de acuerdo", "f": "Decreto 1421 de 2017 (Decreto 1075 de 2015, sección 2.3.3.5): PIAR, parágrafo 1, y acta de acuerdo.", "o": [["A", "se sustituyan por el informe de la fundación a la que asistía hasta el cierre del año.", "El informe de la fundación es un insumo valioso para la valoración pedagógica, pero no reemplaza el PIAR ni el acta de acuerdo, que deben construirse en máximo treinta días.", false], ["B", "se elaboren y firmen en un término no mayor a treinta días desde su vinculación.", "El Decreto 1421 de 2017 prevé que, cuando un estudiante se vincula al sistema educativo de manera extemporánea, se contemple un término no mayor a treinta días para elaborar el PIAR y firmar el acta de acuerdo entre la institución y la familia.", true], ["C", "se elaboren al comenzar el siguiente año escolar, durante el primer trimestre.", "El primer trimestre es la regla para quienes inician el año escolar; para vinculaciones extemporáneas el término es de máximo treinta días, sin esperar al año siguiente.", false]]}, {"id": "NR-170", "niv": 2, "e": "En la construcción del PIAR de Tomás, el diseño lo deben liderar", "f": "Decreto 1421 de 2017 (Decreto 1075 de 2015, sección 2.3.3.5): construcción e implementación de los PIAR.", "o": [["A", "el orientador escolar y el rector, a partir del informe que entregue la familia.", "El orientador y los directivos pueden participar según la organización escolar, pero el diseño lo lideran los docentes de aula con el docente de apoyo, la familia y el estudiante.", false], ["B", "el profesional de salud que atiende a Tomás, con base en su diagnóstico clínico.", "Los informes de profesionales de la salud son uno de los contenidos del PIAR, pero su diseño es pedagógico y lo lideran los docentes con la familia y el estudiante.", false], ["C", "el o los docentes de aula con el docente de apoyo, la familia y el estudiante.", "El Decreto 1421 de 2017 establece que el diseño de los PIAR lo liderarán el o los docentes de aula con el docente de apoyo, la familia y el estudiante; según la organización escolar, participan también los directivos docentes y el orientador.", true]]}, {"id": "NR-171", "niv": 3, "e": "Sobre la relación entre la planeación que usted hace para todo el grupo y los ajustes para Tomás, el Decreto 1421 de 2017 indica que", "f": "Decreto 1421 de 2017 (Decreto 1075 de 2015, sección 2.3.3.5): definiciones de ajustes razonables, DUA y PIAR.", "o": [["A", "los ajustes razonables responden a necesidades que persisten pese a aplicar el Diseño Universal del Aprendizaje.", "El Decreto 1421 de 2017 define los ajustes razonables como acciones, adaptaciones y apoyos basados en necesidades específicas de cada estudiante que persisten a pesar de que se incorpore el Diseño Universal de los Aprendizajes; el PIAR es complemento de las transformaciones hechas con el DUA.", true], ["B", "los ajustes razonables reemplazan al Diseño Universal del Aprendizaje cuando hay estudiantes con discapacidad en el aula.", "Los ajustes no reemplazan el DUA, lo complementan: el DUA sigue beneficiando a todo el grupo, incluido Tomás.", false], ["C", "el Diseño Universal del Aprendizaje se aplica solo a los estudiantes que tienen un diagnóstico de discapacidad.", "El DUA es un diseño de productos, entornos y programas que todas las personas puedan usar sin adaptación especializada; no se limita a estudiantes con diagnóstico.", false]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Desarrollo cognitivo según Piaget", "texto": "Usted es docente de una sede rural multigrado en una vereda de Boyacá y tiene a su cargo, entre otros, a seis niños de primer grado, de seis y siete años. Durante una actividad de matemáticas, vierte el agua de un vaso ancho y bajo en un vaso alto y delgado, delante de los niños. Varios afirman que ahora «hay más agua», porque «llega más arriba». Al día siguiente, durante una visita a una finca vecina, una niña que llamaba «perro» a todo animal de cuatro patas empieza a diferenciar perros, vacas y caballos, y explica a sus compañeros en qué se distinguen. Usted quiere interpretar estas situaciones desde la teoría de Jean Piaget para planear las próximas actividades.", "items": [{"id": "PD-112", "niv": 1, "e": "La respuesta de los niños sobre el agua en el vaso alto se interpreta, desde Piaget, como", "f": "Piaget, J. e Inhelder, B. (1969). Psicología del niño (etapas del desarrollo, conservación).", "o": [["A", "característica de la etapa de operaciones formales, en la que el razonamiento hipotético apenas comienza a aparecer.", "Las operaciones formales se ubican aproximadamente desde los 11 o 12 años y se caracterizan por el razonamiento abstracto e hipotético; no corresponden a niños de primer grado.", false], ["B", "un indicio de dificultad de aprendizaje que requiere remitir de inmediato a los niños a valoración especializada.", "La ausencia de conservación a los seis o siete años es esperable según Piaget; interpretarla como dificultad de aprendizaje lleva a remisiones innecesarias.", false], ["C", "característica de la etapa preoperacional, en la que el niño suele centrarse en una sola dimensión y aún no conserva la cantidad.", "En la etapa preoperacional (aproximadamente de 2 a 7 años), el pensamiento tiende a centrarse en un solo aspecto perceptible (la altura) y todavía no se ha construido la conservación de la cantidad, que suele aparecer con las operaciones concretas.", true]]}, {"id": "PD-113", "niv": 2, "e": "Para favorecer la construcción de la noción de conservación, desde la perspectiva de Piaget lo más pertinente es", "f": "Piaget, J. e Inhelder, B. (1969). Psicología del niño; Piaget, J. (1970). La epistemología genética.", "o": [["A", "explicar la respuesta correcta con claridad y pedir a los niños que la repitan varias veces hasta memorizarla.", "Para Piaget el conocimiento lógico-matemático no se transmite verbalmente: el niño lo construye actuando sobre los objetos y coordinando sus acciones. Repetir la respuesta no transforma el esquema.", false], ["B", "proponer que trasvasen líquidos entre recipientes y preguntarles por qué creen que la cantidad cambia o no.", "La teoría de Piaget concibe al niño como constructor activo de su conocimiento: manipular, comparar y explicar sus anticipaciones genera las condiciones para reorganizar sus esquemas.", true], ["C", "posponer las actividades con cantidades hasta que todos los niños cumplan ocho años de edad.", "Las edades de las etapas son aproximadas y el desarrollo se favorece con experiencias; esperar pasivamente priva a los niños de las interacciones con el medio que impulsan la construcción.", false]]}, {"id": "PD-114", "niv": 2, "e": "En términos de Piaget, el cambio en la forma en que la niña clasifica a los animales es un ejemplo de", "f": "Piaget, J. (1970). La epistemología genética (asimilación, acomodación, equilibración).", "o": [["A", "asimilación, porque incorpora los nuevos animales al esquema que ya tenía sin modificarlo.", "En la asimilación la nueva experiencia se integra al esquema existente sin cambiarlo (seguir llamando «perro» a la vaca). Aquí la niña cambia su esquema, que es lo contrario.", false], ["B", "andamiaje, porque un adulto ajusta temporalmente la ayuda que le brinda hasta que ella logra actuar sola.", "El andamiaje es un concepto asociado a Wood, Bruner y Ross y a la ZDP de Vygotsky; el caso no describe una ayuda graduada de un adulto, sino una reorganización del esquema de la niña.", false], ["C", "acomodación, porque modifica su esquema para ajustarlo a las características de la nueva experiencia.", "Para Piaget, la acomodación es la modificación de los esquemas existentes cuando no basta con asimilar la experiencia; diferenciar perros, vacas y caballos implica crear y ajustar categorías.", true]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Evaluación formativa, sumativa y retroalimentación (Decreto 1290 de 2009)", "texto": "Usted enseña matemáticas en octavo grado en una institución de Medellín. Al final de cada clase de la unidad de ecuaciones lineales, pide a los estudiantes resolver en una hoja un ejercicio corto, sin nota, y con esas respuestas decide qué retomar en la clase siguiente.
