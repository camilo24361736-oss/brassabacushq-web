e con la pedagogía activa es que los estudiantes", "f": "Decreto 1860 de 1994, artículo 35; Dewey, J. (1938). Experiencia y educación.", "o": [["A", "resuelvan individualmente una lista amplia de ejercicios de aplicación directa de la fórmula de la velocidad.", "Los ejercicios de aplicación pueden consolidar procedimientos, pero por sí solos no implican indagación ni construcción del concepto a partir de la experiencia.", false], ["B", "diseñen una forma de medir la velocidad de los carritos, registren datos y discutan sus resultados.", "La pedagogía activa sitúa al estudiante como protagonista de su aprendizaje: diseñar, medir, registrar y discutir son acciones en las que construye el concepto de velocidad a partir de la experiencia y la reflexión, en línea con los métodos activos del artículo 35 del Decreto 1860.", true], ["C", "observen la demostración que usted realiza en el patio mientras copian los resultados que va anotando en el tablero.", "Los estudiantes observan, pero no formulan preguntas, no toman decisiones sobre la medición ni analizan datos propios; su papel sigue siendo receptivo.", false]]}, {"id": "PD-150", "niv": 3, "e": "Frente al colega que afirma que basta con que los estudiantes hagan algo con las manos, usted precisa que", "f": "Dewey, J. (1938). Experiencia y educación; Decreto 1860 de 1994, artículo 35.", "o": [["A", "tiene razón solo para la primaria, porque en la educación media la pedagogía activa se reemplaza por la exposición.", "El artículo 35 del Decreto 1860 exige métodos activos y vivenciales en el desarrollo de las asignaturas, sin restringirlos a la primaria.", false], ["B", "tiene razón, porque la actividad física de los estudiantes es el rasgo que define a la pedagogía activa.", "La actividad motriz por sí sola no garantiza aprendizaje; una actividad puede ser manual y, al mismo tiempo, mecánica y sin sentido para el estudiante.", false], ["C", "la actividad debe responder a un propósito de aprendizaje e incluir reflexión sobre lo realizado.", "Para Dewey, no toda experiencia es educativa: lo es cuando se conecta con un propósito y se reflexiona sobre ella. La pedagogía activa supone actividad intelectual, no solo física.", true]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Educación inicial y preescolar: actividades rectoras", "texto": "Usted es docente del grado transición en una institución oficial de Popayán. Al iniciar el año revisa las orientaciones del Ministerio de Educación Nacional para la educación inicial y los Derechos Básicos de Aprendizaje (DBA) de transición. Una colega del mismo grado usa el arte casi exclusivamente con fichas para rellenar contornos, con el fin de «entrenar la motricidad fina para la escritura». A mitad de año, la familia de Samuel, de cinco años, le pide que el niño repita transición porque «todavía no lee». Al final del período, usted debe elaborar el informe para las familias.", "items": [{"id": "PD-151", "niv": 1, "e": "Según las orientaciones del MEN, las actividades rectoras de la primera infancia son", "f": "MEN, Actividades rectoras de la primera infancia y de la educación inicial (portal mineducacion.gov.co); Serie de Orientaciones Pedagógicas para la Educación Inicial.", "o": [["A", "el juego, el arte, la literatura y la exploración del medio.", "El MEN establece el juego, el arte, la literatura y la exploración del medio como las actividades rectoras de la primera infancia y de la educación inicial, desarrolladas en la Serie de Orientaciones Pedagógicas para la Educación Inicial.", true], ["B", "el juego, la música, el deporte y la formación en valores, que organizan la jornada del preescolar.", "Mezcla el juego, que sí es actividad rectora, con otros elementos que no lo son; la música hace parte del arte y la formación en valores atraviesa toda la experiencia educativa.", false], ["C", "la lectura, la escritura, el cálculo y la motricidad fina, como preparación para la básica primaria.", "Son aprendizajes que pueden aparecer en la experiencia de los niños, pero no son las actividades rectoras definidas por el MEN; además, la educación inicial no se concibe como mera preparación para la primaria.", false]]}, {"id": "PD-152", "niv": 2, "e": "A partir de las orientaciones del MEN, a la colega que usa el arte solo con fichas para la motricidad, usted le plantea que", "f": "MEN, Actividades rectoras de la primera infancia y de la educación inicial (portal mineducacion.gov.co); Serie de Orientaciones Pedagógicas para la Educación Inicial.", "o": [["A", "el arte debe reservarse para el final de la jornada, como premio por terminar las actividades académicas.", "Convertir el arte en un premio lo subordina a otras actividades y desconoce su carácter de actividad rectora de la educación inicial.", false], ["B", "la práctica es adecuada, porque la finalidad principal del arte en el preescolar es preparar la escritura.", "El MEN señala expresamente que la pintura y el dibujo no se proponen como estrategias para desarrollar la motricidad fina, aunque puedan contribuir a ella; su sentido es otro.", false], ["C", "el arte es una actividad rectora que posibilita aprendizajes por sí misma, como expresarse y construir mundos simbólicos.", "Según el MEN, las actividades rectoras, lejos de ser herramientas que se usan como medio para lograr otros aprendizajes, posibilitan aprendizajes en sí mismas; el arte permite a los niños expresarse, construir mundos simbólicos y apropiarse de la realidad.", true]]}, {"id": "PD-153", "niv": 2, "e": "Ante la solicitud de la familia de Samuel, usted explica que", "f": "Decreto 1411 de 2022 (subroga el capítulo 2, título 3, parte 3, libro 2 del Decreto 1075 de 2015).", "o": [["A", "en la educación inicial no se reprueban grados ni actividades, y la promoción de transición a primero es automática.", "El Decreto 1411 de 2022, que reglamenta la educación inicial en el Decreto 1075 de 2015, dispone que en la educación inicial no se reprueban grados ni actividades, que los niños avanzan según sus capacidades y que la promoción de transición a primero es automática.", true], ["B", "el niño puede repetir transición si el consejo académico verifica que no alcanzó los DBA del grado.", "La norma vigente para la educación inicial no prevé la reprobación de grados; los DBA orientan la planeación y el seguimiento, no la decisión de repetir el grado.", false], ["C", "la decisión corresponde a la familia, que puede pedir por escrito la repetición del grado al rector.", "La promoción de transición a primero no depende de una solicitud de la familia: la norma la define como automática.", false]]}, {"id": "PD-154", "niv": 3, "e": "Al elaborar el informe del período para las familias de transición, lo que corresponde es", "f": "Decreto 1411 de 2022 (valoración y seguimiento del desarrollo y el aprendizaje).", "o": [["A", "una valoración numérica de 1,0 a 5,0 por dimensión, con su equivalencia en la escala de valoración nacional.", "La escala nacional del Decreto 1290 rige para la básica y la media; en la educación inicial la valoración es cualitativa y se comunica mediante informes descriptivos.", false], ["B", "un informe descriptivo y cualitativo del desarrollo y el aprendizaje de cada niño, con acciones para seguir potenciándolo.", "El Decreto 1411 de 2022 establece que la valoración y el seguimiento al desarrollo y el aprendizaje se expresan en informes descriptivos y periódicos de corte cualitativo, que permitan a docentes y familias identificar avances y planear acciones.", true], ["C", "un listado de las fichas completadas por el niño y de las que le quedaron pendientes durante el período.", "Un inventario de fichas no describe el desarrollo ni el aprendizaje del niño, ni orienta acciones para potenciarlos, que es lo que exige la norma.", false]]}, {"id": "PD-155", "niv": 2, "e": "Al planear con los DBA de transición, usted tiene presente que uno de sus tres grandes propósitos es que niñas y niños", "f": "MEN (2016). Derechos Básicos de Aprendizaje de Transición.", "o": [["A", "lean y escriban de forma convencional antes de ingresar a primer grado de la básica primaria.", "Los DBA de transición no establecen la lectura y escritura convencional como propósito del grado; plantean que los niños sean comunicadores activos que expresan, imaginan y representan su realidad.", false], ["B", "memoricen los números hasta el cien y las letras del alfabeto como base para los aprendizajes de primaria.", "La memorización de secuencias no figura entre los propósitos de los DBA de transición, que privilegian experiencias de juego, arte, literatura y exploración del medio.", false], ["C", "disfruten aprender, exploren y se relacionen con el mundo para comprenderlo y construirlo.", "Los DBA de transición se fundamentan en tres propósitos: que niñas y niños construyan su identidad en relación con los otros; que sean comunicadores activos de sus ideas, sentimientos y emociones; y que disfruten aprender, exploren y se relacionen con el mundo para comprenderlo y construirlo.", true]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Gestión y manejo de aula", "texto": "Usted acaba de asumir la dirección de grupo de octavo grado en una institución de Soacha. El grupo tiene fama de «difícil»: hay interrupciones frecuentes, algunos estudiantes llegan tarde y varios docentes han optado por anotar faltas en el observador. Sus clases de matemáticas son bloques de 110 minutos y usted nota que la mayor parte de la indisciplina se presenta en los últimos 20 minutos, que suele dedicar a explicar en el tablero. Además, Kevin interrumpe con comentarios graciosos cuando usted explica. El grupo y usted inician el año escolar la próxima semana.", "items": [{"id": "PD-168", "niv": 1, "e": "Al inicio del año, la estrategia preventiva más pertinente para el manejo del aula es", "f": "Ley 1620 de 2013, artículo 5 (principio de participación); MEN (2006). Estándares Básicos de Competencias en Lenguaje, Matemáticas, Ciencias y Ciudadanas (competencias ciudadanas).", "o": [["A", "leer en voz alta el capítulo de faltas del manual para que conozcan desde el primer día las sanciones de cada una.", "Conocer el manual es necesario, pero empezar solo por las sanciones privilegia el control punitivo y no construye compromisos ni rutinas que prevengan las dificultades.", false], ["B", "construir con el grupo, desde la primera semana, acuerdos de aula y rutinas claras, explicando el sentido de cada uno.", "Establecer de manera participativa normas y rutinas explícitas desde el comienzo previene muchos conflictos y aumenta el compromiso de los estudiantes; además, es coherente con la formación en competencias ciudadanas y con el principio de participación de la Ley 1620 de 2013.", true], ["C", "esperar a que se presenten las primeras dificultades para definir las normas según las necesidades de cada caso.", "Definir normas sobre la marcha y caso por caso es reactivo y genera percepción de arbitrariedad; la gestión de aula eficaz anticipa expectativas desde el inicio.", false]]}, {"id": "PD-169", "niv": 2, "e": "Frente al aumento de la indisciplina en los últimos 20 minutos de clase, lo más pertinente es", "f": "Decreto 1860 de 1994, artículo 35 (métodos activos y vivenciales); literatura sobre gestión de aula.", "o": [["A", "reorganizar el bloque en segmentos con actividades variadas y momentos de trabajo activo de los estudiantes.", "Cuando la disrupción se concentra en un momento previsible, la respuesta pedagógica es ajustar la estructura de la clase: alternar explicación breve, práctica guiada y trabajo activo sostiene la atención y reduce las interrupciones.", true], ["B", "reducir a la mitad los contenidos de cada clase y dejar como tarea para la casa los que no alcancen a verse.", "Recortar contenidos y trasladarlos a la casa no cambia la dinámica de la clase y descarga en los estudiantes aprendizajes que requieren acompañamiento.", false], ["C", "registrar en el observador a quienes se distraigan en ese momento, para que mejoren su atención.", "La anotación atiende el síntoma, no la causa: tras 90 minutos, una explicación larga en el tablero excede la capacidad de atención sostenida del grupo.", false]]}, {"id": "PD-170", "niv": 2, "e": "Cuando Kevin interrumpe con comentarios durante la explicación, la respuesta más adecuada es", "f": "Ley 1620 de 2013, artículo 21 (rol orientador y mediador del docente); literatura sobre gestión de aula.", "o": [["A", "enviarlo a coordinación cada vez que interrumpa, para que la situación no afecte el ritmo de la clase.", "Remitir de inmediato una conducta menor delega una situación que el docente puede manejar en el aula y priva al estudiante de la clase.", false], ["B", "acercarse, recordarle el acuerdo en voz baja, continuar la clase y conversar con él después si persiste.", "Las intervenciones discretas y proporcionales detienen la conducta sin interrumpir el aprendizaje del grupo ni exponer al estudiante; la conversación posterior permite comprender sus motivos y acordar compromisos.", true], ["C", "detener la clase y exigirle públicamente una disculpa frente al grupo, para que los demás no lo imiten.", "La confrontación pública puede escalar el conflicto y darle al estudiante la atención que busca; además, expone su dignidad frente a los compañeros.", false]]}, {"id": "PD-171", "niv": 3, "e": "Para que el manejo de aula sea formativo y no solo sancionatorio, la práctica más coherente es", "f": "Decreto 1965 de 2013, artículo 43 (acciones restaurativas); Decreto 1290 de 2009, artículo 5.", "o": [["A", "reconocer conductas positivas concretas y analizar con los estudiantes las consecuencias de sus actos para reparar el daño.", "El enfoque formativo combina el reconocimiento de lo que se hace bien con la reflexión y la reparación; el Decreto 1965 de 2013 incluye las acciones restaurativas entre las respuestas a las situaciones de convivencia.", true], ["B", "aplicar la misma sanción a todo el grupo cuando no se logra identificar al responsable de una falta.", "Las sanciones colectivas castigan a quienes no participaron, deterioran la confianza y no enseñan responsabilidad individual.", false], ["C", "disminuir la valoración académica del área a los estudiantes que incumplan los acuerdos de convivencia.", "Mezclar convivencia con la valoración académica distorsiona la evaluación del aprendizaje, que según el Decreto 1290 se refiere a los desempeños en las áreas.", false]]}]}, {"comp": "psicotecnica", "rol": "docente", "tag": "Prueba psicotécnica · Competencias comportamentales (Guía 31, Decreto 1278 de 2002)", "texto": "Usted y otros dos docentes de ciencias naturales deben presentar en un mes el proyecto ambiental escolar (PRAE) del año. En la primera reunión, uno de sus colegas propone repetir la jornada de reciclaje del año anterior porque «ya está probada»; la otra colega quiere un proyecto de huerta escolar con participación de las familias. La discusión sube de tono, ambos le piden a usted que «decida» y la reunión termina sin acuerdos.", "items": [{"id": "PS-001", "niv": 1, "e": "En la siguiente reunión, para resolver el desacuerdo entre sus colegas, usted decide", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Negociación y mediación).", "o": [["A", "elegir la propuesta que considere mejor, ya que ambos colegas le pidieron que tomara la decisión.", "Decidir por los demás puede cerrar la discusión, pero no genera un acuerdo ni compromiso de las partes; la negociación y mediación implica soluciones concertadas y duraderas.", false], ["B", "pedir al coordinador que asigne el proyecto, para evitar que el conflicto afecte la relación del equipo.", "Trasladar a otro una situación que el equipo puede resolver evita el conflicto en lugar de gestionarlo; no evidencia intervención efectiva y oportuna ante el conflicto.", false], ["C", "escuchar los argumentos de ambos y proponer criterios comunes para decidir juntos.", "Corresponde a la competencia de negociación y mediación: identificar y comprender las causas del conflicto con imparcialidad y facilitar acuerdos anteponiendo los intereses comunes (Guía 31, glosario de competencias).", true]]}, {"id": "PS-002", "niv": 1, "e": "Una vez acordada la propuesta, para organizar el trabajo del proyecto con sus dos colegas, usted", "f": "MEN (2008). Guía 31, Anexo 1: Glosario de competencias (Trabajo en equipo).", "o": [["A", "asume la mayor parte de las tareas para asegurar que el proyecto se entregue a tiempo.", "Concentrar las tareas puede parecer compromiso, pero no construye colaboración ni aprovecha los aportes de los demás, aspectos centrales del trabajo en equipo.", false], ["B", "divide el proyecto en tres partes iguales para que cada docente trabaje de forma independiente.", "Repartir partes sin espacios de articulación fragmenta el proyecto; el trabajo en equipo implica cooperación y revisión conjunta, no solo división de tareas.", false], ["C", "distribuye las tareas según las fortalezas de cada uno y acuerda momentos para revisar avances juntos.", "Evidencia trabajo en equipo: construir relaciones de colaboración para objetivos compartidos, considerar las contribuciones de los demás y propiciar la organización del equipo para el desarrollo de proyectos (Guía 31).", true]]}, {"id": "PS-003", "niv": 2, "e": "Días después, el colega que propuso la jornada de reciclaje le dice que se sintió ignorado en la reunión. Usted", "f": "MEN (2008). Guía 31, Anexo 1: Glosario de competencias (Comunicación y relaciones interpersonales).", "o": [["A", "le explica que la decisión ya fue tomada por el equipo y que lo más conveniente ahora es avanzar con el proyecto.", "Aunque la decisión esté tomada, responder solo con el resultado desconoce la emoción del colega y no favorece relaciones basadas en la confianza.", false], ["B", "lo escucha con atención, reconoce su malestar y le propone integrar al proyecto elementos de su propuesta.", "Corresponde a comunicación y relaciones interpersonales: escuchar con atención, comprender los puntos de vista de los demás e identificar y comprender sus emociones, favoreciendo relaciones cordiales y asertivas (Guía 31).", true], ["C", "le sugiere que exprese su inconformidad en la próxima reunión de área para que todos la conozcan.", "Remitir el tema a otro espacio evita la conversación directa que el colega está buscando; no demuestra escucha ni manejo de las emociones de otros.", false]]}]}, {"comp": "psicotecnica", "rol": "docente", "tag": "Prueba psicotécnica · Liderazgo", "texto": "Usted es el único docente de la sede La Esperanza, una escuela multigrado de una vereda del Cauca con 22 estudiantes de preescolar a quinto. Este año la institución educativa, de la cual hace parte la sede, incorporó a su PEI un énfasis en agroecología y le pidió a cada sede desarrollar una huerta escolar como proyecto pedagógico que integre las áreas. Varias familias desconfían de la propuesta: algunos padres opinan que la huerta quita tiempo para aprender a leer y escribir, y otros dicen que esas labores ya las aprenden los niños en sus casas. La asistencia de las familias a las reuniones de la sede suele ser baja.", "items": [{"id": "PS-101", "niv": 1, "e": "Para que las familias se vinculen con el nuevo énfasis institucional desde el inicio del año, usted decide", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Liderazgo).", "o": [["A", "convocarlas a una jornada en la huerta en la que vean cómo se relaciona con lo que aprenden sus hijos e invitarlas a asumir tareas en ella.", "Evidencia liderazgo, definido en la Guía 31 como la «capacidad para motivar e involucrar a los miembros de la comunidad educativa con la construcción de una identidad común y el desarrollo de la visión institucional». El docente transmite con sus acciones la visión institucional y logra que las familias se comprometan con metas comunes al participar directamente en el proyecto.", true], ["B", "enviar a cada familia una circular que resuma el nuevo énfasis aprobado en el PEI y los objetivos de la huerta escolar.", "Informar es necesario, pero una circular es una comunicación de una sola vía que no motiva ni involucra a familias que ya desconfían y asisten poco. No se evidencia la conducta de liderazgo de influir positivamente en los demás para que se comprometan con metas comunes.", false], ["C", "desarrollar la huerta solo con los estudiantes durante el primer semestre y presentar los resultados a las familias al finalizarlo.", "Mostrar resultados antes de convocar puede parecer prudente, pero deja a las familias al margen justo cuando el proyecto define su sentido. El liderazgo, según la Guía 31, implica involucrar a la comunidad en la construcción de una identidad común, no solo informarle al final.", false]]}, {"id": "PS-102", "niv": 2, "e": "En una reunión, un padre afirma que la huerta es «una pérdida de tiempo» porque los niños van a la escuela a aprender a leer. Frente a esta crítica, usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Liderazgo).", "o": [["A", "le da la razón en parte y reduce las horas de huerta en la sede para dedicarlas a lectura y escritura, como piden las familias.", "Ceder ante la crítica evita el conflicto, pero abandona la visión institucional que la sede debe desarrollar y no demuestra al padre que la huerta también fortalece la lectura y la escritura. El liderazgo implica comprometer a la comunidad con la visión, no renunciar a ella.", false], ["B", "le muestra con trabajos de los niños cómo en la huerta leen, miden y escriben, y lo invita a orientar una sesión sobre cultivos.", "Corresponde al liderazgo (Guía 31): el docente «plantea orientaciones convincentes, expresa expectativas positivas de los demás» e «influye positivamente en el comportamiento de los demás y logra que se comprometan con el logro de metas comunes». Convierte al padre crítico en participante del proyecto institucional.", true], ["C", "le explica que el énfasis fue aprobado por la institución y que la sede debe aplicarlo de la misma manera que lo hacen las demás sedes.", "Apelar a la decisión institucional es cierto, pero no convence ni compromete; impone la visión en lugar de construirla con la comunidad. El liderazgo exige plantear orientaciones convincentes e influir positivamente, no solo recordar la obligación.", false]]}, {"id": "PS-103", "niv": 2, "e": "En el encuentro mensual de docentes de las sedes rurales, un colega de otra vereda comenta que quiere iniciar su huerta, pero no tiene semillas ni experiencia. Usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Trabajo en equipo).", "o": [["A", "le ofrece semillas de su huerta y le propone que los estudiantes de ambas sedes intercambien los registros de sus cultivos.", "Evidencia trabajo en equipo (Guía 31): «comparte aprendizajes y recursos con diferentes miembros de la institución y ofrece apoyo para el trabajo de otros», construyendo relaciones de colaboración para el logro de un objetivo compartido por todas las sedes.", true], ["B", "le recomienda solicitar las semillas a la oficina agropecuaria del municipio, que suele entregarlas a las escuelas rurales.", "Es una orientación útil, pero remite al colega a un tercero en lugar de aportar lo que usted ya tiene. El trabajo en equipo, según la Guía 31, implica compartir aprendizajes y recursos con otros miembros de la institución y ofrecer apoyo para su trabajo.", false], ["C", "le sugiere esperar a que su propia huerta dé resultados este año para enviarle después una guía completa del proceso.", "La intención de compartir algo terminado es buena, pero aplaza el apoyo cuando el colega lo necesita y desaprovecha la oportunidad de aprender juntos. No evidencia la cooperación oportuna que define el trabajo en equipo.", false]]}, {"id": "PS-104", "niv": 3, "e": "Usted sabe que el próximo año podría ser trasladado. Para que la huerta continúe como parte de la identidad de la sede, usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Liderazgo).", "o": [["A", "solicita a la rectoría que el docente que lo reemplace asuma la huerta como una responsabilidad obligatoria de su cargo.", "Asegurar la continuidad por vía de una orden traslada el proyecto a la autoridad y a una persona, sin que la comunidad lo asuma como propio. El liderazgo se orienta a construir una identidad común, no a imponer la tarea a otro docente.", false], ["B", "elabora un manual detallado con el paso a paso de la huerta y lo entrega a la coordinación para el docente que llegue.", "Documentar es valioso, pero la continuidad queda en manos de una sola persona y de un documento. No fortalece la capacidad de la comunidad para sostener el proyecto, que es lo que busca el liderazgo al «promover cambios y transformaciones que aumenten la capacidad institucional».", false], ["C", "conforma con estudiantes y padres un comité de la huerta y deja con ellos por escrito los acuerdos y rutinas del proyecto.", "Corresponde al liderazgo (Guía 31): «promueve cambios y transformaciones que aumenten la capacidad institucional» e involucra a la comunidad en la construcción de una identidad común. Al hacer corresponsables a estudiantes y familias, el proyecto no depende solo del docente.", true]]}]}, {"comp": "psicotecnica", "rol": "docente", "tag": "Prueba psicotécnica · Iniciativa", "texto": "Usted es docente de ciencias sociales de secundaria en un colegio oficial de Ibagué. Hace dos meses la institución recibió 30 tabletas con aplicaciones educativas instaladas, pero siguen guardadas en la biblioteca porque, según la coordinación, «nadie ha recibido la capacitación» que la secretaría de educación prometió. La biblioteca tiene un protocolo de préstamo para los equipos. La red wifi del colegio es lenta y se satura cuando se conectan muchos dispositivos al mismo tiempo.", "items": [{"id": "PS-133", "niv": 1, "e": "Ante la situación de las tabletas guardadas, usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Iniciativa).", "o": [["A", "lleva las tabletas a su salón y empieza a usarlas en sus clases, ya que llevan dos meses sin ningún uso.", "Muestra disposición a actuar, pero omite el protocolo de préstamo y la autorización institucional. La autonomía que describe la iniciativa no implica desconocer los procedimientos de la institución.", false], ["B", "solicita a la coordinación que gestione con la secretaría la capacitación prometida antes de que alguien empiece a usarlas.", "Gestionar la capacitación es razonable, pero condicionar todo a ella mantiene los equipos sin uso indefinidamente. La iniciativa implica actuar «con autonomía sin necesidad de supervisión».", false], ["C", "explora por su cuenta las aplicaciones, diseña una clase piloto y propone usarlas con su grupo según el protocolo de préstamo.", "Evidencia iniciativa (Guía 31): «realiza acciones que le facilitan el aprendizaje permanente», «actúa con autonomía sin necesidad de supervisión» y «propone y desarrolla ideas novedosas», respetando los procedimientos institucionales.", true]]}, {"id": "PS-134", "niv": 3, "e": "La clase piloto funciona y varios colegas le preguntan cómo usar las tabletas en sus áreas. Usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Trabajo en equipo).", "o": [["A", "organiza con ellos un espacio corto para mostrar lo que hizo y diseñar juntos actividades para sus áreas.", "Corresponde al trabajo en equipo (Guía 31): «comparte aprendizajes y recursos con diferentes miembros de la institución» y «propicia la conformación de equipos para el desarrollo de proyectos», integrando los aportes de cada área.", true], ["B", "escribe un instructivo detallado para que cada colega pueda usar las tabletas por su cuenta sin necesidad de capacitación.", "Compartir un instructivo es un aporte, pero es una transferencia en una sola vía que no construye trabajo conjunto ni aprovecha lo que saben los colegas de sus áreas. El trabajo en equipo busca construir relaciones de colaboración.", false], ["C", "les recomienda los cursos virtuales gratuitos en los que usted aprendió, para que se formen a su propio ritmo.", "Es una orientación útil, pero remite a recursos externos en lugar de compartir su experiencia y trabajar con los colegas. No evidencia la cooperación que define el trabajo en equipo.", false]]}, {"id": "PS-135", "niv": 2, "e": "Al preparar una nueva clase con las tabletas, usted anticipa que la red wifi no soportará a todo el grupo conectado al mismo tiempo. Usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Iniciativa).", "o": [["A", "organiza turnos de conexión para que cada estudiante use la tableta conectada unos minutos durante la clase.", "Es una salida práctica, pero reduce el tiempo de trabajo de cada estudiante y no resuelve el problema de fondo. Muestra poca recursividad frente a una limitación que se podía anticipar.", false], ["B", "descarga los contenidos con anticipación, diseña actividades sin conexión e informa la limitación a coordinación.", "Evidencia iniciativa (Guía 31): «anticipa situaciones futuras» y «demuestra recursividad y flexibilidad», resolviendo con autonomía la limitación sin dejar de informarla a la institución.", true], ["C", "reporta la limitación de la red a coordinación y aplaza el uso de las tabletas hasta que se mejore la conexión.", "Reportar la falla es correcto, pero aplazar la actividad hace depender el trabajo de una solución externa. La iniciativa implica buscar alternativas con los recursos disponibles.", false]]}]}, {"comp": "psicotecnica", "rol": "docente", "tag": "Prueba psicotécnica · Trabajo en equipo", "texto": "Usted es docente de matemáticas de sexto en un colegio oficial de Villavicencio. En el grupo está Mateo, un estudiante con diagnóstico de trastorno del espectro autista que se desempeña bien en tareas individuales y estructuradas, pero se angustia con los cambios de rutina y con el ruido. La docente de apoyo pedagógico de la institución convocó a los docentes del grado para elaborar el Plan Individual de Ajustes Razonables (PIAR) de Mateo, que se construye con los docentes de aula, la docente de apoyo, la familia y el estudiante.", "items": [{"id": "PS-143", "niv": 1, "e": "Para la reunión de construcción del PIAR de Mateo, usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Trabajo en equipo). Decreto 1421 de 2017 (PIAR, compilado en el Decreto 1075 de 2015).", "o": [["A", "lleva sus observaciones sobre cómo aprende Mateo en su clase y propone ajustes aplicables en varias áreas.", "Evidencia trabajo en equipo (Guía 31): «aporta sugerencias, ideas y opiniones» y construye relaciones de colaboración para el logro de un objetivo compartido: el PIAR del estudiante.", true], ["B", "envía por correo los ajustes que aplicará en matemáticas, porque ese día tiene otras actividades programadas.", "Aporta información, pero de forma aislada y sin participar en la construcción conjunta. El PIAR se diseña entre los docentes de aula, la docente de apoyo y la familia; el trabajo en equipo implica cooperar en ese espacio.", false], ["C", "deja que la docente de apoyo defina los ajustes de todas las áreas, ya que ella es la especialista en inclusión.", "Reconocer el saber de la especialista es razonable, pero el PIAR requiere el conocimiento que cada docente tiene del estudiante en su área. Delegar por completo no evidencia trabajo cooperativo.", false]]}, {"id": "PS-144", "niv": 3, "e": "En la reunión, la docente de ciencias propone un ajuste que usted ya probó en matemáticas sin buenos resultados. Usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Trabajo en equipo). Decreto 1421 de 2017 (PIAR, compilado en el Decreto 1075 de 2015).", "o": [["A", "guarda silencio para no desanimar a la colega y deja que ella compruebe por sí misma el resultado.", "Evita una posible incomodidad, pero se guarda un aprendizaje que podría ahorrar tiempo y angustia al estudiante. El trabajo en equipo implica compartir aprendizajes con los demás.", false], ["B", "cuenta cómo le fue con ese ajuste y propone revisar en equipo qué podría hacerlo funcionar en ciencias.", "Corresponde al trabajo en equipo (Guía 31): «comparte aprendizajes y recursos con diferentes miembros de la institución» y «considera las contribuciones de los demás en la toma de decisiones», construyendo la solución entre todos.", true], ["C", "le sugiere descartarlo desde ya, pues su experiencia en matemáticas mostró que ese ajuste no funciona con Mateo.", "Su experiencia es valiosa, pero la convierte en una conclusión definitiva sin considerar que el contexto de ciencias puede ser distinto. No considera las contribuciones de los demás en la toma de decisiones.", false]]}, {"id": "PS-145", "niv": 2, "e": "La madre de Mateo le escribe angustiada porque su hijo llegó llorando a casa después de una actividad en grupo en su clase. Usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Comunicación y relaciones interpersonales).", "o": [["A", "le recomienda comunicarse con la docente de apoyo, que conoce mejor las necesidades de Mateo.", "La docente de apoyo puede intervenir después, pero la situación ocurrió en su clase y la madre se dirige a usted. Remitirla evita la conversación que corresponde.", false], ["B", "le responde por escrito con un resumen detallado de la actividad y le asegura que en clase Mateo no tuvo ningún problema.", "Busca tranquilizar a la madre, pero responde a la defensiva y descarta lo que ella observó. No demuestra escucha ni comprensión de las emociones de la familia.", false], ["C", "la llama, le cuenta lo que observó, escucha lo que Mateo expresó en casa y acuerdan cómo ajustar el trabajo en grupo.", "Evidencia comunicación y relaciones interpersonales (Guía 31): «escucha con atención y comprende puntos de vista de los demás», «identifica y comprende» las emociones de otros y construye acuerdos basados en la confianza.", true]]}, {"id": "PS-146", "niv": 3, "e": "Al final del período, Mateo aprobó matemáticas con los ajustes, pero aún no domina las operaciones con fracciones previstas en su PIAR. Usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Orientación al logro). Decreto 1421 de 2017 (PIAR, compilado en el Decreto 1075 de 2015).", "o": [["A", "registra el avance, identifica lo que falta y ajusta con el equipo las estrategias del PIAR para el siguiente período.", "Evidencia orientación al logro (Guía 31): dirige su comportamiento «hacia el cumplimiento de estándares elevados, con miras al mejoramiento continuo» y «procura que los estudiantes [...] obtengan resultados de excelencia» según las metas propias del estudiante.", true], ["B", "considera cumplido el objetivo del período, porque Mateo aprobó el área con los ajustes razonables que acordó el equipo.", "Aprobar es un logro, pero el criterio del PIAR son las metas definidas para el estudiante, que aún no se alcanzan. Conformarse con la aprobación no refleja estándares elevados.", false], ["C", "le asigna un plan de refuerzo para desarrollar en vacaciones, de manera que alcance el nivel del resto del grupo.", "Muestra exigencia, pero usa como referencia el nivel del grupo en lugar de las metas del PIAR y traslada el trabajo a vacaciones sin ajustar los apoyos. No es una mejora sistemática del proceso.", false]]}]}, {"comp": "psicotecnica", "rol": "docente", "tag": "Prueba psicotécnica · Orientación al logro", "texto": "Usted es docente de biología de un colegio oficial de Montería. Inscribió a tres estudiantes de once en la olimpiada departamental de ciencias, que se realizará en un mes e incluye una prueba teórica y una prueba práctica de laboratorio. El colegio no tiene laboratorio dotado; solo cuenta con algunos materiales básicos. Los estudiantes están motivados, pero algunos colegas comentan que «es mejor no exponerlos» frente a colegios privados con más recursos.", "items": [{"id": "PS-179", "niv": 2, "e": "Ante la falta de laboratorio para preparar la prueba práctica, usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Orientación al logro).", "o": [["A", "concentra la preparación en la prueba teórica, que es la que puede trabajarse bien con los recursos disponibles.", "Es una decisión realista, pero renuncia a una parte de la prueba sin intentar superar el obstáculo. La orientación al logro implica persistencia ante situaciones difíciles.", false], ["B", "retira la inscripción de los estudiantes, para evitarles una experiencia frustrante frente a colegios con más recursos.", "Busca proteger a los estudiantes, pero les quita una oportunidad y transmite poca confianza en sus capacidades. No refleja metas elevadas.", false], ["C", "organiza prácticas con materiales sencillos y gestiona una visita al laboratorio de una universidad cercana.", "Evidencia orientación al logro (Guía 31): «demuestra esfuerzo y persistencia en la consecución de sus objetivos, afrontando obstáculos y situaciones difíciles» y «confía en sus propias capacidades [...] aun en situaciones desafiantes».", true]]}, {"id": "PS-180", "niv": 3, "e": "Los estudiantes obtienen el quinto puesto entre 30 colegios. Frente a este resultado, usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Orientación al logro).", "o": [["A", "considera que el quinto puesto es sobresaliente dadas las limitaciones del colegio y da por cumplida la meta.", "La valoración del contexto es razonable, pero las limitaciones se convierten en un techo para las metas. No refleja la búsqueda de estándares elevados.", false], ["B", "celebra con ellos y analizan juntos en qué pruebas perdieron puntos, para prepararse mejor en la próxima convocatoria.", "Corresponde a orientación al logro (Guía 31): dirige el comportamiento «hacia el cumplimiento de estándares elevados, con miras al mejoramiento continuo» y «tiene metas personales y profesionales elevadas».", true], ["C", "celebra con ellos y propone a la rectoría un reconocimiento público en la izada de bandera para motivar a otros estudiantes.", "Reconocer el logro es positivo y motivador, pero no usa la experiencia para mejorar. La orientación al logro se centra en el mejoramiento continuo, no solo en celebrar el resultado.", false]]}, {"id": "PS-181", "niv": 2, "e": "Después de la olimpiada, otros estudiantes se interesan en participar el próximo año. Usted", "f": "MEN (2008). Guía 31, Guía metodológica de evaluación anual de desempeño laboral, Anexo 1: Glosario de competencias (Liderazgo).", "o": [["A", "conforma con los tres participantes un semillero en el que ellos acompañen la preparación de los nuevos interesados.", "Evidencia liderazgo (Guía 31): «promueve cambios y transformaciones que aumenten la capacidad institucional» y motiva e involucra a los estudiantes como protagonistas de una meta común.", true], ["B", "les recomienda prepararse por su cuenta con las pruebas de años anteriores, que usted compartirá con ellos.", "Facilita materiales, pero deja la preparación en manos de cada estudiante y no aprovecha la experiencia ganada. No involucra a la comunidad en un proyecto común.", false], ["C", "selecciona desde ahora a los estudiantes con mejores notas en ciencias, para asegurar buenos resultados.", "Es eficiente para competir, pero excluye a interesados que podrían desarrollarse y no construye una cultura institucional. El liderazgo demuestra interés por el desarrollo de las personas.", false]]}]}];
const CFG = {"titulo": "Simulacro 4 · Concurso Docente 2026–2027", "modo": "simulacro", "minutos": 194, "componentes": {"lectura_critica": "Lectura crítica", "razonamiento_cuantitativo": "Razonamiento cuantitativo", "competencias_blandas": "Competencias blandas y ciudadanas", "pedagogia_normativa": "Competencias pedagógicas y normativa", "psicotecnica": "Prueba psicotécnica"}, "niveles": {"1": "Básico", "2": "Intermedio", "3": "Avanzado"}, "clave": "simulacro-04.html"};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY = 'sim-docente:' + CFG.clave;
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}
function save(){try{localStorage.setItem(KEY, JSON.stringify(ST))}catch(e){}}
let ST = load();
ST.r = ST.r || {};
$('#tit').textContent = CFG.titulo;
const ITEMS = [];
DATA.forEach(c => c.items.forEach(it => { it.caso = c; ITEMS.push(it); }));

function justHTML(it){
  return '<div class="just">' + it.o.map(o => `<div><b>${o[0]}.</b> <span class="${o[3]?'okt':'not'}">${o[3]?'Es correcta.':'Es incorrecta.'}</span> ${esc(o[2])}</div>`).join('') +
    `<div class="src">Referencia: ${esc(it.f)}</div></div>`;
}
function itemHTML(it, n, mode){
  const r = ST.r[it.id];
  const reveal = mode === 'review' || (CFG.modo === 'practica' && r);
  let h = `<div class="item" id="i-${it.id}"><p class="enun"><span class="n">${n}.</span> <span class="niv">${CFG.niveles[it.niv]}</span> ${esc(it.e)}</p>`;
  it.o.forEach(o => {
    let cls = '';
    if (reveal) { if (o[3]) cls = 'ok'; else if (r === o[0]) cls = 'no'; }
    else if (r === o[0]) cls = 'sel';
    h += `<button class="op ${cls}" data-id="${it.id}" data-l="${o[0]}" ${reveal?'disabled':''}><span class="l">${o[0]}.</span><span>${esc(o[1])}</span></button>`;
  });
  if (reveal) {
    if (mode === 'review') h += `<div class="${r===keyOf(it)?'res-ok':'res-no'}" style="font-size:14px;margin-top:4px">${r ? (r===keyOf(it)?'Respondiste ' + r + ': correcto.':'Respondiste ' + r + '. La respuesta correcta es ' + keyOf(it) + '.') : 'Sin responder. La respuesta correcta es ' + keyOf(it) + '.'}</div>`;
    h += justHTML(it);
  }
  return h + '</div>';
}
const keyOf = it => it.o.find(o => o[3])[0];

function renderList(list, mode){
  let h = '', last = null, n = 0;
  list.forEach(it => {
    n++;
    if (it.caso !== last) { last = it.caso; h += `<div class="caso"><div class="tag">${esc(it.caso.tag)}</div><p>${esc(it.caso.texto)}</p></div>`; }
    h += itemHTML(it, n, mode);
  });
  return h;
}

// ---------- PRÁCTICA ----------
let LIST = [];
let FILTRO = ST.f || {comp:'', niv:'', rol:''};
function practica(){
  const comps = Object.entries(CFG.componentes).map(([k,v]) => `<option value="${k}" ${FILTRO.comp===k?'selected':''}>${esc(v)}</option>`).join('');
  const nivs = Object.entries(CFG.niveles).map(([k,v]) => `<option value="${k}" ${FILTRO.niv===k?'selected':''}>${esc(v)}</option>`).join('');
  const list = ITEMS.filter(it => (!FILTRO.comp || it.caso.comp===FILTRO.comp) && (!FILTRO.niv || String(it.niv)===FILTRO.niv) && (!FILTRO.rol || it.caso.rol===FILTRO.rol));
  const resp = list.filter(it => ST.r[it.id]); const ok = resp.filter(it => ST.r[it.id]===keyOf(it));
  $('#main').innerHTML = `<div class="panel"><p style="margin-top:0">Elige un tema y un nivel. Al responder verás de inmediato si acertaste y la explicación de cada opción.</p>
  <div class="row"><select id="fc"><option value="">Todos los temas</option>${comps}</select>
  <select id="fn"><option value="">Todos los niveles</option>${nivs}</select>
  <select id="fr"><option value="">Docentes y directivos</option><option value="docente" ${FILTRO.rol==='docente'?'selected':''}>Solo docentes</option><option value="directivo" ${FILTRO.rol==='directivo'?'selected':''}>Solo directivos</option></select>
  <button class="btn sec" id="borrar">Borrar mis respuestas</button></div>
  <p class="stat" id="pst" style="margin-bottom:0">${list.length} preguntas · respondidas ${resp.length} · aciertos ${ok.length}${resp.length? ' (' + Math.round(100*ok.length/resp.length) + ' %)':''}</p></div>` + renderList(list, 'practica');
  $('#prog').textContent = `${ok.length}/${resp.length} aciertos`;
  ['fc','fn','fr'].forEach((id,i) => $('#'+id).onchange = e => { FILTRO[['comp','niv','rol'][i]] = e.target.value; ST.f = FILTRO; save(); practica(); });
  LIST = list;
  $('#borrar').onclick = () => { list.forEach(it => delete ST.r[it.id]); save(); practica(); };
}

// ---------- SIMULACRO ----------
let tick = null;
function inicio(){
  const n = ITEMS.length, cnt = {};
  ITEMS.forEach(it => cnt[it.caso.comp] = (cnt[it.caso.comp]||0) + 1);
  const h = Math.floor(CFG.minutos/60), m = CFG.minutos%60;
  $('#main').innerHTML = `<div class="panel"><h2 style="margin-top:0;color:var(--pri)">Instrucciones</h2>
  <p>Este simulacro tiene <b>${n} preguntas</b> en el formato de Prueba de Juicio Situacional: un caso, enunciados que se completan y tres opciones con una sola respuesta correcta.</p>
  <table>${Object.entries(cnt).map(([k,v]) => `<tr><td>${esc(CFG.componentes[k])}</td><td class="r">${v}</td></tr>`).join('')}</table>
  <p>Tiempo sugerido: <b>${h ? h + ' h ' : ''}${m ? m + ' min' : ''}</b> (unos ${Math.round(CFG.minutos*60/n/6)/10} minutos por pregunta). Cuando se acaba el tiempo puedes seguir, pero el cronómetro lo indica.</p>
  <p>Tus respuestas se guardan en este navegador. Al terminar verás tu puntaje por componente y por nivel, y la explicación de cada pregunta.</p>
  <button class="btn" id="go">${ST.t0 ? 'Continuar el simulacro' : 'Comenzar'}</button></div>`;
  $('#prog').textContent = `${n} preguntas`;
  $('#go').onclick = () => { if (!ST.t0) { ST.t0 = Date.now(); save(); } examen(); };
}
function reloj(){
  const rest = CFG.minutos*60 - Math.floor((Date.now() - ST.t0)/1000);
  const a = Math.abs(rest), hh = Math.floor(a/3600), mm = Math.floor(a%3600/60), ss = a%60;
  const t = (rest < 0 ? '+' : '') + (hh ? hh + ':' : '') + String(mm).padStart(2,'0') + ':' + String(ss).padStart(2,'0');
  $('#timer').textContent = rest < 0 ? 'Tiempo cumplido ' + t : '⏱ ' + t;
  $('#timer').classList.toggle('low', rest < 600);
}
function examen(){
  $('#main').innerHTML = renderList(ITEMS, 'examen') + `<div class="panel"><button class="btn" id="fin">Terminar y calificar</button></div>`;
  progreso(); reloj(); clearInterval(tick); tick = setInterval(reloj, 1000);
  $('#fin').onclick = () => {
    const faltan = ITEMS.length - Object.keys(ST.r).filter(k => ITEMS.some(i => i.id===k)).length;
    $('#mtxt').textContent = faltan ? `Te faltan ${faltan} preguntas por responder. ¿Quieres calificar de todos modos?` : '¿Quieres terminar y ver tu calificación?';
    $('#modal').classList.remove('hide');
  };
}
function progreso(){
  const r = ITEMS.filter(it => ST.r[it.id]).length;
  $('#prog').textContent = `Respondidas ${r}/${ITEMS.length}`;
}
$('#mno').onclick = () => $('#modal').classList.add('hide');
$('#msi').onclick = () => { $('#modal').classList.add('hide'); ST.fin = Date.now(); save(); resultados(); };
function resultados(){
  clearInterval(tick);
  const ok = ITEMS.filter(it => ST.r[it.id] === keyOf(it)).length;
  const pct = Math.round(1000*ok/ITEMS.length)/10;
  const g = (fn, lab) => { const m = {}; ITEMS.forEach(it => { const k = fn(it); m[k] = m[k] || [0,0]; m[k][1]++; if (ST.r[it.id]===keyOf(it)) m[k][0]++; });
    return Object.entries(m).map(([k,v]) => `<tr><td>${esc(lab(k))}</td><td class="r">${v[0]}/${v[1]}</td><td class="r">${Math.round(100*v[0]/v[1])} %</td></tr>`).join(''); };
  const mins = Math.round(((ST.fin||Date.now()) - ST.t0)/60000);
  $('#timer').textContent = `Tiempo usado: ${Math.floor(mins/60) ? Math.floor(mins/60) + ' h ' : ''}${mins%60} min`;
  $('#prog').textContent = `${ok}/${ITEMS.length} aciertos`;
  $('#main').innerHTML = `<div class="panel"><div class="big">${String(pct).replace('.',',')} %</div>
  <p style="margin-top:4px">${ok} de ${ITEMS.length} respuestas correctas. ${pct >= 70 ? 'Muy buen resultado: repasa las explicaciones de tus errores para afianzarlo.' : pct >= 60 ? 'Vas bien, pero con poco margen: refuerza los componentes con menor porcentaje.' : 'Todavía no estás en zona segura: practica por tema los componentes con menor porcentaje.'}</p>
  <p class="aviso">Referencia: en el concurso el mínimo aprobatorio de la prueba eliminatoria es 60 puntos (70 para directivos). Este porcentaje de aciertos es una guía de preparación; la CNSC calcula su puntaje con su propia escala.</p>
  <h3>Por componente</h3><table>${g(it => it.caso.comp, k => CFG.componentes[k])}</table>
  <h3>Por nivel</h3><table>${g(it => it.niv, k => CFG.niveles[k])}</table>
  <div class="row" style="margin-top:14px"><button class="btn" id="solo">Ver solo mis errores</button><button class="btn sec" id="todas">Ver todas</button><button class="btn sec" id="otra">Reiniciar el simulacro</button></div></div><div id="rev"></div>`;
  const rev = errs => { const l = errs ? ITEMS.filter(it => ST.r[it.id] !== keyOf(it)) : ITEMS; $('#rev').innerHTML = renderList(l, 'review'); };
  rev(true);
  $('#solo').onclick = () => rev(true); $('#todas').onclick = () => rev(false);
  $('#otra').onclick = () => { ST = {r:{}}; save(); inicio(); window.scrollTo(0,0); };
}

document.addEventListener('click', e => {
  const b = e.target.closest('button.op'); if (!b || b.disabled) return;
  ST.r[b.dataset.id] = b.dataset.l; save();
  const it = ITEMS.find(i => i.id === b.dataset.id);
  const n = b.closest('.item').querySelector('.n').textContent.replace('.','');
  b.closest('.item').outerHTML = itemHTML(it, n, CFG.modo === 'practica' ? 'practica' : 'examen');
  if (CFG.modo === 'practica') { const resp = LIST.filter(i => ST.r[i.id]); const ok = resp.filter(i => ST.r[i.id]===keyOf(i)).length; $('#prog').textContent = `${ok}/${resp.length} aciertos`; $('#pst').textContent = `${LIST.length} preguntas · respondidas ${resp.length} · aciertos ${ok} (${Math.round(100*ok/resp.length)} %)`; }
  else progreso();
});

if (CFG.modo === 'practica') practica();
else if (ST.fin) resultados();
else if (ST.t0) examen();
else inicio();
</script>
</body>
</html>
