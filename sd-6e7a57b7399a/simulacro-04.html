ue todo error tiene el mismo valor.", "Tras defender el análisis de los errores, la autora previene una lectura extrema: hay descuidos que basta con señalar. Reconocer que un párrafo matiza o delimita una tesis es comprender la articulación del texto.", true]]}, {"id": "LC-112", "niv": 3, "e": "Al comentar el texto con sus colegas, usted señala que el argumento de la autora se apoya principalmente en", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: reflexionar a partir de un texto y evaluar su contenido (validez de argumentos y solidez de las evidencias).", "o": [["A", "los resultados de una investigación sobre los errores más frecuentes en matemáticas.", "El texto no menciona ninguna investigación ni presenta datos de estudios.", false], ["B", "la opinión de los estudiantes acerca de la forma en que prefieren que se corrijan sus trabajos.", "El texto no recoge opiniones de estudiantes sobre la corrección.", false], ["C", "su experiencia como docente y en un ejemplo de aula, más que en datos de investigación.", "La autora apela a lo que «sabe quien ha enseñado algunos años» y a un ejemplo concreto. Identificar el tipo de respaldo de un argumento es parte de evaluar su solidez.", true]]}]}, {"comp": "lectura_critica", "rol": "docente", "tag": "Lectura crítica", "texto": "Lea el siguiente texto publicado en un boletín de actualización docente:\n\n«Pocas ideas se han difundido tanto en la formación de maestros como la de los \"estilos de aprendizaje\": cada estudiante sería visual, auditivo o kinestésico, y aprendería mejor si se le enseña en su estilo. La idea es atractiva porque parece respetar las diferencias. El problema es que, cuando se ha puesto a prueba con diseños rigurosos, la evidencia a su favor ha sido muy débil.\n\nPara comprobarla, no basta con preguntar a los estudiantes cómo prefieren aprender. Habría que mostrar que los \"visuales\" aprenden más con imágenes y los \"auditivos\" con explicaciones orales, y que no ocurre lo mismo vés». Reconstruir un criterio planteado en el texto exige integrar varias oraciones.", true], ["C", "los estudiantes visuales obtienen mejores resultados que los auditivos en todas las áreas.", "Que un grupo supere al otro en general no demostraría que cada uno aprende mejor en su propio estilo; no cumple la doble condición.", false]]}, {"id": "LC-150", "niv": 2, "e": "El último párrafo cumple, dentro del texto, la función de", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: comprender cómo se articulan las partes de un texto (conectores y función de los párrafos).", "o": [["A", "presentar nuevas pruebas que confirman que la teoría de los estilos de aprendizaje es correcta.", "El párrafo no presenta pruebas ni respalda la teoría; parte de reconocer que tiene «poco sustento».", false], ["B", "concluir que todos los estudiantes deben recibir la misma enseñanza, sin ninguna variación.", "El autor propone combinar varias vías y variar según el contenido; no plantea una enseñanza uniforme.", false], ["C", "evitar que la crítica a la teoría se entienda como una negación de las diferencias entre estudiantes.", "Empieza con «Que la teoría tenga poco sustento no significa que todas las personas aprendan igual» y ofrece una alternativa: elegir la forma de enseñar según el contenido y combinar varias vías. Es un párrafo que delimita el alcance de la crítica.", true]]}, {"id": "LC-151", "niv": 3, "e": "Una docente comenta que, en su clase, los estudiantes que se consideran visuales prefieren los mapas conceptuales. Con base en el texto, este dato", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: reflexionar a partir de un texto y evaluar su contenido (validez de argumentos y solidez de las evidencias).", "o": [["A", "no basta para respaldar la teoría, porque muestra una preferencia y no un mayor aprendizaje.", "Según el segundo párrafo, conocer cómo prefieren aprender los estudiantes no es suficiente. Aplicar el criterio de un texto para valorar una nueva evidencia es reflexionar sobre su contenido.", true], ["B", "contradice el texto, porque el autor afirma que todas las personas aprenden de la misma manera.", "El autor dice expresamente que la falta de sustento de la teoría «no significa que todas las personas aprendan igual».", false], ["C", "respalda la teoría, porque confirma que existen estudiantes con un estilo de aprendizaje visual.", "Confunde preferencia con aprendizaje: el texto exige mostrar que esos estudiantes aprenden más así, no solo que lo prefieren.", false]]}]}, {"comp": "lectura_critica", "rol": "docente", "tag": "Lectura crítica", "texto": "Lea la siguiente columna de opinión escrita por un docente rural:\n\n«Cada vez que se anuncia un plan nacional de bilingüismo, en mi vereda lo recibimos con una mezcla de ilusión y cansancio. Ilusión, porque nadie quiere que sus hijos se queden por fuera de las oportunidades que da otro idioma. Cansancio, porque los planes suelen pensarse para colegios con conectividad, docentes de inglés de planta y grupos de un solo grado.\n\nEn mi escuela no hay ninguna de esas tres cosas. Soy el único docente para cinco grados y aprendí inglés en un curso virtual que hacía de noche, cuando la señal lo permitía. Aun así, mis estudiantes cantan, cuentan y saludan en inglés, porque lo integramos a lo que ya hacemos: la huerta, el mercado, el clima.\n\nNo pido que nos excluyan de las metas. Pido que las metas lleguen acompañadas de formación, materiales que funcionen sin internet y tiempos realistas.»", "items": [{"id": "LC-179", "niv": 1, "e": "En el primer párrafo, la palabra «cansancio» se refiere a", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: identificar y entender los contenidos locales (sentido de palabras y expresiones en contexto).", "o": [["A", "el desinterés de las familias de la vereda por aprender otro idioma.", "El texto afirma lo contrario: «nadie quiere que sus hijos se queden por fuera de las oportunidades que da otro idioma».", false], ["B", "el desgaste ante planes que no consideran las condiciones rurales.", "El autor lo explica: los planes «suelen pensarse para colegios con conectividad, docentes de inglés de planta y grupos de un solo grado». El sentido de la palabra se precisa con el contexto.", true], ["C", "la fatiga del docente después de estudiar inglés por las noches.", "El curso nocturno se menciona en el segundo párrafo; en el primero, el cansancio se explica por cómo se diseñan los planes.", false]]}, {"id": "LC-180", "niv": 2, "e": "La experiencia que el autor narra en el segundo párrafo le sirve para", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: comprender cómo se articulan las partes de un texto para darle un sentido global.", "o": [["A", "mostrar que avanza aun en condiciones difíciles, lo que da peso a su petición.", "Al contar que sus estudiantes ya usan el inglés sin las condiciones ideales, el autor muestra compromiso y hace más creíble su solicitud de apoyo. Reconocer la función de un ejemplo es comprender la articulación del texto.", true], ["B", "demostrar que los planes nacionales de bilingüismo son innecesarios en las zonas rurales.", "El autor no rechaza los planes; dice expresamente que no pide que excluyan a su escuela de las metas.", false], ["C", "quejarse de la baja calidad de los cursos virtuales que ofrecen formación a los docentes.", "El autor menciona el curso virtual para mostrar sus condiciones, no para criticar su calidad.", false]]}, {"id": "LC-181", "niv": 2, "e": "Para evitar que su columna se lea como un rechazo al plan de bilingüismo, el autor", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: comprender cómo se articulan las partes de un texto (conectores y función de los párrafos).", "o": [["A", "reconoce que su escuela tiene condiciones semejantes a las de los colegios urbanos.", "El autor afirma lo contrario: en su escuela no hay ninguna de las tres condiciones que suponen los planes.", false], ["B", "aclara que no pide quedar por fuera de las metas, sino recibir apoyo para cumplirlas.", "El último párrafo empieza con «No pido que nos excluyan de las metas», con lo cual delimita su crítica. Identificar cómo el autor precisa su postura es comprender la estructura del texto.", true], ["C", "propone que el inglés se enseñe primero en los colegios que ya tienen conectividad.", "El autor no hace esa propuesta; pide materiales que funcionen sin internet para su escuela.", false]]}, {"id": "LC-182", "niv": 3, "e": "De las siguientes afirmaciones, la que el autor de la columna aceptaría es que", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: reflexionar a partir de un texto y evaluar su contenido (supuestos implícitos).", "o": [["A", "los estudiantes rurales no necesitan el inglés porque no lo usarán en su entorno.", "Contradice al autor, que valora las oportunidades que da otro idioma y lo enseña en su escuela.", false], ["B", "las escuelas multigrado deberían esperar a tener conectividad para enseñar inglés.", "El autor ya enseña inglés sin conectividad y pide materiales que funcionen sin internet.", false], ["C", "una meta nacional puede ser deseable y poco realista si no se acompaña de apoyos.", "El autor comparte el propósito del bilingüismo («ilusión»), pero pide formación, materiales y tiempos realistas. Inferir qué afirmación es coherente con la postura de un autor es reflexionar sobre el texto.", true]]}]}, {"comp": "lectura_critica", "rol": "docente", "tag": "Lectura crítica", "texto": "Lea la siguiente carta que un lector envió a un periódico local:\n\n«Señores editores: leo que algunos colegios permiten la calculadora en las clases de matemáticas desde grado séptimo. Es un error. Quienes promueven esa idea son, casualmente, los mismos que nunca fueron buenos para los números. Hoy se permite la calculadora para dividir; mañana se permitirá que una aplicación resuelva las ecuaciones, y en pocos años tendremos bachilleres que no saben cuánto es siete por ocho. Yo estudié sin calculadora y aprendí perfectamente. ¿Para qué cambiar lo que funciona?»", "items": [{"id": "LC-206", "niv": 2, "e": "Cuando el autor afirma que quienes promueven la calculadora «nunca fueron buenos para los números», su argumento", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: reflexionar a partir de un texto y evaluar su contenido (validez de argumentos y solidez de las evidencias).", "o": [["A", "presenta un dato verificable sobre la formación de quienes defienden la idea.", "El autor no ofrece ninguna prueba de esa afirmación; además, aunque fuera cierta, no diría nada sobre la conveniencia de la calculadora.", false], ["B", "generaliza a partir de la experiencia escolar del propio autor de la carta.", "La generalización a partir de su propia experiencia aparece en otra frase («Yo estudié sin calculadora…»), no en esta.", false], ["C", "ataca a quienes defienden la idea en lugar de discutir la idea misma.", "Descalificar a las personas en vez de examinar sus razones es un argumento contra la persona (ad hominem). Reconocer este tipo de falacia es evaluar la validez de un argumento.", true]]}, {"id": "LC-207", "niv": 3, "e": "La secuencia «hoy… mañana… en pocos años» construye un argumento que", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: reflexionar a partir de un texto y evaluar su contenido (validez de argumentos y solidez de las evidencias).", "o": [["A", "describe hechos que ya ocurrieron en los colegios que permiten la calculadora.", "Lo que sigue a «mañana» y «en pocos años» son predicciones, no hechos ocurridos.", false], ["B", "supone, sin probarlo, que un primer paso llevará a consecuencias cada vez más graves.", "El autor encadena consecuencias sin justificar cada eslabón: de usar la calculadora para dividir pasa a bachilleres que no saben multiplicar. Es la falacia de la pendiente resbaladiza.", true], ["C", "compara con datos la enseñanza de las matemáticas en distintas épocas.", "El texto no presenta datos ni compara épocas; encadena consecuencias supuestas.", false]]}, {"id": "LC-208", "niv": 1, "e": "La frase «Yo estudié sin calculadora y aprendí perfectamente» es débil como argumento porque", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: reflexionar a partir de un texto y evaluar su contenido (validez de argumentos y solidez de las evidencias).", "o": [["A", "toma una experiencia personal como prueba de lo que conviene a todos los estudiantes.", "Que al autor le haya funcionado un método no demuestra que sea el mejor para todos ni que el otro sea perjudicial. Es una generalización a partir de un caso.", true], ["B", "reconoce que la calculadora ayuda a aprender las operaciones básicas.", "La frase no reconoce ningún beneficio de la calculadora; sostiene lo contrario.", false], ["C", "contradice la afirmación de que los bachilleres no sabrán multiplicar.", "No hay contradicción entre ambas afirmaciones; las dos expresan la misma postura del autor.", false]]}, {"id": "LC-209", "niv": 3, "e": "Para responder la carta con un argumento sólido, usted debería", "f": "ICFES (2021). Marco de referencia de Lectura Crítica Saber 11.°: reflexionar a partir de un texto y evaluar su contenido.", "o": [["A", "explicar con qué propósito se usa la calculadora y si eso afecta el dominio del cálculo.", "Una respuesta sólida discute el asunto de fondo: para qué se usa la herramienta y qué efectos tiene en el aprendizaje, en lugar de responder con descalificaciones o predicciones sin sustento.", true], ["B", "advertir que, si se prohíbe la calculadora, pronto se prohibirán también los computadores.", "Reproduce la pendiente resbaladiza de la carta en sentido contrario, sin aportar evidencia.", false], ["C", "señalar que el autor es una persona mayor que no conoce cómo se enseña hoy en los colegios.", "Comete la misma falacia que la carta: descalifica a la persona en lugar de discutir sus razones.", false]]}]}, {"comp": "razonamiento_cuantitativo", "rol": "docente", "tag": "Razonamiento cuantitativo", "texto": "La institución educativa organiza una salida pedagógica al jardín botánico para los grados décimo y once. Décimo tiene 3 grupos de 32 estudiantes y once tiene 2 grupos de 35 estudiantes. Confirmaron su asistencia el 75 % de los estudiantes de décimo y el 80 % de los de once. El transporte se contrata en busetas de 19 puestos que cuestan $420.000 cada una, y en cada buseta debe viajar un docente acompañante que ocupa uno de los puestos. La entrada cuesta $12.000 por estudiante y los docentes no pagan. El consejo de padres aportó $1.312.000 y el valor restante se divide en partes iguales entre los estudiantes que asisten. Usted es el docente encargado de organizar la logística.", "items": [{"id": "RC-001", "niv": 1, "e": "Para solicitar los refrigerios, usted debe informar que el número de estudiantes que asistirán es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: porcentajes y proporciones.", "o": [["A", "124 estudiantes.", "Resulta de aplicar el 75 % al total de matriculados de ambos grados (166 × 0,75 = 124,5) y truncar. El caso indica porcentajes distintos para cada grado: el 75 % se aplica solo a décimo y el 80 % solo a once.", false], ["B", "128 estudiantes.", "Décimo tiene 3 × 32 = 96 estudiantes y asiste el 75 %: 96 × 0,75 = 72. Once tiene 2 × 35 = 70 estudiantes y asiste el 80 %: 70 × 0,80 = 56. En total asisten 72 + 56 = 128 estudiantes.", true], ["C", "133 estudiantes.", "Resulta de aplicar el 80 % al total de matriculados (166 × 0,80 = 132,8) y redondear. Cada porcentaje corresponde a un grado distinto, por lo que deben calcularse por separado: 72 de décimo y 56 de once, para un total de 128.", false]]}, {"id": "RC-002", "niv": 2, "e": "Para garantizar el transporte de todos los estudiantes que asisten, el número mínimo de busetas que usted debe contratar es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo: interpretación de cocientes en contexto (redondeo por exceso).", "o": [["A", "6 busetas.", "Resulta de dividir 128 entre 19 (6,7) y quedarse con la parte entera. Además de truncar, ignora que en cada buseta un puesto lo ocupa el docente; con 6 busetas solo viajarían 6 × 18 = 108 estudiantes.", false], ["B", "7 busetas.", "Resulta de dividir 128 entre 19 sin descontar el puesto del docente acompañante. En realidad cada buseta lleva 18 estudiantes, y 7 × 18 = 126 no alcanza para 128.", false], ["C", "8 busetas.", "Cada buseta tiene 19 puestos y uno lo ocupa el docente, así que caben 18 estudiantes. 128 ÷ 18 = 7,1; como no se puede contratar una fracción de buseta y 7 busetas solo llevan 126 estudiantes, se necesitan 8.", true]]}, {"id": "RC-003", "niv": 2, "e": "Al informar a las familias el valor que debe aportar cada estudiante que asiste, usted indica que este es de", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo: planteamiento y ejecución de procesos aritméticos en varios pasos.", "o": [["A", "$16.000.", "Resulta de restar el aporte del consejo de padres solo al transporte (3.360.000 − 1.312.000 = 2.048.000; 2.048.000 ÷ 128 = 16.000) y olvidar el costo de las entradas.", false], ["B", "$28.000.", "Transporte: 8 × 420.000 = 3.360.000. Entradas: 128 × 12.000 = 1.536.000. Costo total: 4.896.000. Descontando el aporte del consejo de padres: 4.896.000 − 1.312.000 = 3.584.000, y 3.584.000 ÷ 128 = 28.000 por estudiante.", true], ["C", "$38.250.", "Resulta de dividir el costo total (4.896.000) entre 128 sin descontar el aporte del consejo de padres de familia.", false]]}, {"id": "RC-004", "niv": 2, "e": "Si a última hora confirman su asistencia 7 estudiantes más de grado once, respecto al transporte usted debe", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo: validación de procedimientos y toma de decisiones con información cuantitativa.", "o": [["A", "contratar una buseta adicional, porque se superan los 133 puestos disponibles.", "Calcula mal la capacidad. La capacidad para estudiantes de 8 busetas es 8 × 18 = 144, no 133; con 135 estudiantes no se supera.", false], ["B", "contratar una buseta adicional, porque los puestos libres ya estaban ocupados.", "Supone que las busetas iban llenas. Con 128 estudiantes en 8 busetas quedaban 144 − 128 = 16 puestos libres, suficientes para los 7 estudiantes adicionales.", false], ["C", "mantener las busetas contratadas, porque en ellas caben hasta 144 estudiantes.", "Con 8 busetas de 18 puestos para estudiantes caben 8 × 18 = 144. Al sumar 7 estudiantes se llega a 135, que es menor que 144, por lo que no se requiere transporte adicional.", true]]}]}, {"comp": "razonamiento_cuantitativo", "rol": "docente", "tag": "Razonamiento cuantitativo", "texto": "Usted coordina el transporte escolar de una sede rural. El bus recorre 18 kilómetros entre la vereda más lejana y la sede, a una velocidad promedio de 36 km/h mientras está en movimiento, y en ese trayecto hace 4 paradas de 3 minutos cada una para recoger estudiantes. Cada día de clase el bus recorre ese trayecto 4 veces (ida y regreso en la mañana, e ida y regreso en la tarde). El bus rinde 30 kilómetros por galón y el galón de combustible cuesta $16.000. En el mes hay 22 días de clase. La alcaldía paga el 75 % del combustible y el resto se divide en partes iguales entre los 40 estudiantes que usan la ruta.", "items": [{"id": "RC-125", "niv": 1, "e": "El combustible que consume el bus en un día de clase es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: razones y conversión de unidades (rendimiento de combustible).", "o": [["A", "0,6 galones.", "Corresponde a un solo trayecto de 18 km (18 ÷ 30 = 0,6); el bus recorre el trayecto 4 veces al día.", false], ["B", "1,2 galones.", "Cuenta solo la ida y el regreso de la mañana (36 km); faltan los dos trayectos de la tarde.", false], ["C", "2,4 galones.", "Cada día el bus recorre 4 × 18 = 72 km. Con un rendimiento de 30 km por galón consume 72 ÷ 30 = 2,4 galones.", true]]}, {"id": "RC-126", "niv": 2, "e": "Si el bus sale de la vereda más lejana a las 6:10 a. m., llega a la sede a las", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: velocidad, tiempo y conversión de horas decimales a minutos.", "o": [["A", "6:40 a. m.", "Calcula bien el tiempo en movimiento (30 minutos), pero olvida sumar los 12 minutos de las 4 paradas.", false], ["B", "6:52 a. m.", "En movimiento tarda 18 ÷ 36 = 0,5 h = 30 minutos; las paradas suman 4 × 3 = 12 minutos. En total 42 minutos: 6:10 + 0:42 = 6:52 a. m.", true], ["C", "7:12 a. m.", "Lee 0,5 horas como 50 minutos, error frecuente al convertir horas decimales a minutos; 0,5 h equivalen a 30 minutos.", false]]}, {"id": "RC-127", "niv": 2, "e": "El costo del combustible del bus en el mes es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: procesos aritméticos de varios pasos.", "o": [["A", "$38.400.", "Es el costo de un solo día (2,4 × 16.000); falta multiplicar por los 22 días de clase del mes.", false], ["B", "$211.200.", "Calcula solo la parte que cubren las familias (25 % del costo); el enunciado pide el costo total del combustible del mes.", false], ["C", "$844.800.", "Cada día se consumen 72 ÷ 30 = 2,4 galones, que cuestan 2,4 × 16.000 = $38.400. En 22 días de clase: 38.400 × 22 = $844.800.", true]]}, {"id": "RC-128", "niv": 3, "e": "El valor mensual que corresponde pagar a cada estudiante por el combustible es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: porcentajes y reparto en problemas de varios pasos.", "o": [["A", "$5.280.", "El costo mensual es $844.800 y las familias cubren el 25 % no subsidiado: 844.800 × 0,25 = $211.200. Dividido entre 40 estudiantes: $5.280.", true], ["B", "$15.840.", "Reparte entre los estudiantes el 75 %, que es la parte que paga la alcaldía, en lugar del 25 % restante.", false], ["C", "$21.120.", "Divide el costo mensual completo entre los 40 estudiantes sin descontar el aporte de la alcaldía.", false]]}]}, {"comp": "razonamiento_cuantitativo", "rol": "docente", "tag": "Razonamiento cuantitativo", "texto": "En una escuela rural de la región Caribe, el proyecto ambiental escolar propone recoger agua lluvia del techo, que tiene forma rectangular de 12 m × 10 m vista desde arriba. Se sabe que 1 milímetro de lluvia sobre 1 m² de superficie equivale a 1 litro de agua. Por pérdidas en las canaletas, solo el 80 % del agua que cae sobre el techo llega al tanque. El tanque tiene forma de caja de 2 m × 1,5 m × 1 m. En la escuela estudian 45 niños; cada uno usa 4 litros diarios para lavado de manos y, además, se gastan 30 litros diarios en aseo. Usted lidera el proyecto con sus estudiantes.", "items": [{"id": "RC-149", "niv": 1, "e": "La capacidad del tanque es de", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: volumen y conversión de unidades de capacidad.", "o": [["A", "3 litros.", "Calcula bien el volumen (3 m³) pero lo reporta en litros sin convertir; cada metro cúbico equivale a 1.000 litros.", false], ["B", "300 litros.", "Usa una equivalencia errónea (1 m³ = 100 L); un metro cúbico equivale a 1.000 litros.", false], ["C", "3.000 litros.", "El volumen es 2 × 1,5 × 1 = 3 m³ y, como 1 m³ = 1.000 L, el tanque tiene capacidad para 3.000 litros.", true]]}, {"id": "RC-150", "niv": 2, "e": "Si en un aguacero caen 15 milímetros de lluvia, la cantidad de agua que llega al tanque es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: proporcionalidad y porcentajes con unidades de medida.", "o": [["A", "1.440 litros.", "Sobre el techo caen 120 m² × 15 mm = 1.800 litros, y llega al tanque el 80 %: 1.800 × 0,8 = 1.440 litros.", true], ["B", "1.800 litros.", "Es el agua que cae sobre el techo; olvida que solo el 80 % llega al tanque.", false], ["C", "2.250 litros.", "Divide entre 0,8 en lugar de multiplicar (1.800 ÷ 0,8), con lo que obtiene más agua de la que cae sobre el techo.", false]]}, {"id": "RC-151", "niv": 2, "e": "Con el tanque lleno y sin nuevas lluvias, el número de días completos de clase que alcanza el agua es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: interpretación del cociente en contexto.", "o": [["A", "14 días.", "El consumo diario es 45 × 4 + 30 = 210 litros. 3.000 ÷ 210 = 14,28…; el agua alcanza para 14 días completos y el decimoquinto quedaría incompleto.", true], ["B", "15 días.", "Redondea 14,28 hacia arriba; para 15 días completos se necesitarían 3.150 litros.", false], ["C", "16 días.", "Omite los 30 litros diarios de aseo (3.000 ÷ 180 = 16,6…); el consumo diario incluye ambos usos.", false]]}, {"id": "RC-152", "niv": 3, "e": "La cantidad mínima de lluvia necesaria para llenar el tanque vacío es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: planteamiento de ecuaciones y porcentajes inversos.", "o": [["A", "25 milímetros.", "Divide 3.000 litros entre 120 m² sin tener en cuenta que solo el 80 % del agua llega al tanque.", false], ["B", "30 milímetros.", "Compensa la pérdida sumando un 20 % a los 25 mm (25 × 1,2); lo correcto es dividir entre 0,8, porque el 80 % de lo recogido debe ser 3.000 L.", false], ["C", "31,25 milímetros.", "Se necesita que 120 × h × 0,8 = 3.000, es decir, 96h = 3.000, de donde h = 31,25 mm.", true]]}]}, {"comp": "razonamiento_cuantitativo", "rol": "docente", "tag": "Razonamiento cuantitativo", "texto": "En un grupo de 32 estudiantes de sexto, 4 tienen Plan Individual de Ajustes Razonables (PIAR). Uno de los ajustes acordados es que estos estudiantes disponen de 25 % más de tiempo en las evaluaciones escritas. La evaluación de ciencias sociales tiene 40 preguntas, dura 80 minutos para el grupo y empieza a las 8:15 a. m. Usted es el docente del área y organiza la aplicación.", "items": [{"id": "RC-197", "niv": 1, "e": "El tiempo total del que disponen los estudiantes con PIAR para la evaluación es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: porcentajes en contexto.", "o": [["A", "20 minutos.", "Corresponde solo al tiempo adicional (25 % de 80); falta sumarlo al tiempo base.", false], ["B", "100 minutos.", "El 25 % de 80 minutos es 20 minutos; el tiempo total es 80 + 20 = 100 minutos (80 × 1,25).", true], ["C", "105 minutos.", "Suma 25 minutos al tiempo base, como si 25 % equivaliera a 25 minutos; el 25 % de 80 son 20 minutos.", false]]}, {"id": "RC-198", "niv": 2, "e": "Los estudiantes con PIAR deben terminar la evaluación, a más tardar, a las", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: operaciones con unidades de tiempo.", "o": [["A", "9:15 a. m.", "Toma 100 minutos como si fueran 1 hora; 100 minutos equivalen a 1 hora y 40 minutos.", false], ["B", "9:35 a. m.", "Es la hora de finalización del resto del grupo (80 minutos); no incluye el tiempo adicional del ajuste.", false], ["C", "9:55 a. m.", "Disponen de 100 minutos = 1 h 40 min. 8:15 + 1:40 = 9:55 a. m.", true]]}, {"id": "RC-199", "niv": 1, "e": "El porcentaje de estudiantes del grupo que tiene PIAR es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: porcentajes y frecuencias relativas.", "o": [["A", "1,25 %.", "Obtiene bien el cociente 4 ÷ 32 = 0,125, pero al pasarlo a porcentaje mueve la coma un lugar de más; 0,125 equivale a 12,5 %.", false], ["B", "4 %.", "Toma el número de estudiantes con PIAR como si fuera el porcentaje, sin dividir entre los 32 del grupo.", false], ["C", "12,5 %.", "4 de 32 estudiantes: 4 ÷ 32 = 0,125 = 12,5 %.", true]]}, {"id": "RC-200", "niv": 3, "e": "Un colega propone que los estudiantes con PIAR terminen en 80 minutos, pero con menos preguntas, de modo que tengan por pregunta el mismo tiempo promedio que les daría el ajuste del 25 %. El número de preguntas de su evaluación debe ser", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: proporcionalidad inversa.", "o": [["A", "30 preguntas.", "Reduce en 25 % el número de preguntas (40 × 0,75). Para que cada pregunta tenga 25 % más de tiempo, el número de preguntas debe dividirse entre 1,25.", false], ["B", "32 preguntas.", "Con el ajuste, cada pregunta tendría 100 ÷ 40 = 2,5 minutos. En 80 minutos caben 80 ÷ 2,5 = 32 preguntas (40 ÷ 1,25).", true], ["C", "50 preguntas.", "Multiplica las preguntas por 1,25 en lugar de dividir; más preguntas en el mismo tiempo reducirían el tiempo por pregunta.", false]]}]}, {"comp": "razonamiento_cuantitativo", "rol": "docente", "tag": "Razonamiento cuantitativo", "texto": "Para la jornada de embellecimiento institucional, 6 padres de familia voluntarios pintan todas las aulas en 10 días trabajando 4 horas diarias. Todos los voluntarios trabajan al mismo ritmo y el trabajo total no cambia. Las paredes por pintar suman 1.050 m²; un galón de pintura cubre 30 m² y la pintura se compra en cuñetes de 5 galones. Usted coordina la jornada con el consejo de padres.", "items": [{"id": "RC-205", "niv": 2, "e": "Si participan 8 voluntarios trabajando 4 horas diarias, el número de días que tardarían en pintar todas las aulas es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: proporcionalidad inversa.", "o": [["A", "7,5 días.", "A más voluntarios, menos días (proporcionalidad inversa): 6 × 10 = 8 × d, de donde d = 60 ÷ 8 = 7,5 días.", true], ["B", "8 días.", "Resta a los 10 días los 2 voluntarios adicionales; la relación entre voluntarios y días no es aditiva sino inversamente proporcional.", false], ["C", "13,3 días.", "Plantea una proporcionalidad directa (10 × 8 ÷ 6); con más voluntarios el trabajo debe tardar menos, no más.", false]]}, {"id": "RC-206", "niv": 3, "e": "Si participan 5 voluntarios trabajando 6 horas diarias, el número de días que tardarían es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: proporcionalidad compuesta.", "o": [["A", "8 días.", "El trabajo total es 6 × 10 × 4 = 240 horas-persona. Con 5 voluntarios a 6 horas diarias se hacen 30 horas-persona por día: 240 ÷ 30 = 8 días.", true], ["B", "12 días.", "Ajusta por el número de voluntarios (10 × 6 ÷ 5 = 12) pero ignora que ahora trabajan 6 horas diarias en lugar de 4.", false], ["C", "18 días.", "Trata las horas diarias como directamente proporcionales a los días (12 × 6 ÷ 4); más horas por día reducen el número de días.", false]]}, {"id": "RC-207", "niv": 1, "e": "El número de cuñetes de pintura necesarios para dar una mano a todas las paredes es", "f": "ICFES (2015). Módulo de Razonamiento Cuantitativo Saber 11.° y Saber Pro: conversión de unidades y razones.", "o": [["A", "7 cuñetes.", "Se necesitan 1.050 ÷ 30 = 35 galones, y 35 ÷ 5 = 7 cuñetes.", true], ["B", "35 cuñetes.", "Es el número de galones; falta dividir entre los 5 galones que trae cada cuñete.", false], ["C", "210 cuñetes.", "Divide el área entre 5 (1.050 ÷ 5) sin pasar primero por el rendimiento de 30 m² por galón.", false]]}]}, {"comp": "competencias_blandas", "rol": "docente", "tag": "Competencias blandas y ciudadanas · Gobierno escolar y participación (Ley 115 de 1994; Decretos 1860 de 1994 y 1286 de 2005)", "texto": "Usted es docente de ciencias sociales en una institución educativa oficial urbana que ofrece desde preescolar hasta grado once, y el rector le encargó organizar la elección del personero estudiantil. Las clases iniciaron el 26 de enero. Dos estudiantes de once, Valeria y Samuel, inscribieron su candidatura. Samuel comenta que, además de personero, quiere ser representante de los estudiantes ante el consejo directivo «para tener más voz». Algunos docentes de primaria sugieren que sus estudiantes no voten «porque no entienden el proceso», y una estudiante de séptimo le pregunta a usted por quién debería votar.", "items": [{"id": "CB-101", "niv": 1, "e": "Según la reglamentación del gobierno escolar, la elección del personero debe realizarse", "f": "Decreto 1860 de 1994, art. 28 (compilado en el Decreto 1075 de 2015).", "o": [["A", "antes de iniciar las clases, durante la semana de desarrollo institucional, para no afectar el calendario académico.", "Organizar la elección antes de las clases puede parecer eficiente, pero la norma fija el plazo a partir de la iniciación de clases y exige convocar a los estudiantes matriculados, que en esa semana no están en la institución.", false], ["B", "dentro de los treinta días calendario siguientes a la iniciación de clases, mediante voto secreto.", "El artículo 28 del Decreto 1860 de 1994 (compilado en el Decreto 1075 de 2015) establece que el personero se elige dentro de los treinta días calendario siguientes al inicio de clases, por mayoría simple y mediante voto secreto.", true], ["C", "una vez se conforme el consejo de estudiantes, que es el órgano encargado de elegirlo entre sus voceros.", "Confunde la elección del personero con la del representante ante el consejo directivo. El consejo de estudiantes elige a ese representante (Decreto 1860, art. 29), mientras que al personero lo eligen todos los estudiantes matriculados.", false]]}, {"id": "CB-102", "niv": 1, "e": "Frente a la sugerencia de que los estudiantes de primaria no voten, usted explica que", "f": "Decreto 1860 de 1994, art. 28; MEN (2004). Estándares Básicos de Competencias Ciudadanas, Serie Guías n.º 6 (participación y responsabilidad democrática).", "o": [["A", "solo pueden votar los estudiantes de primaria cuyas familias lo autoricen, para respetar la decisión de los acudientes.", "Pedir autorización a las familias parece respetuoso, pero la norma no condiciona el voto de los estudiantes a un permiso de sus acudientes; el derecho a elegir corresponde a todos los matriculados.", false], ["B", "todos los estudiantes matriculados deben ser convocados a votar, como parte de su formación en participación.", "El artículo 28 del Decreto 1860 de 1994 indica que el rector convoca a todos los estudiantes matriculados para elegir al personero. Además, los Estándares de Competencias Ciudadanas proponen formar la participación desde los primeros grados, con explicaciones adecuadas a la edad.", true], ["C", "los estudiantes de primaria pueden delegar su voto en el vocero de su grado, para garantizar un voto más informado.", "La delegación busca un voto informado, pero la elección del personero es directa, por mayoría simple y con voto secreto de cada estudiante; no existe voto delegado.", false]]}, {"id": "CB-103", "niv": 2, "e": "Sobre la aspiración de Samuel a ser también representante ante el consejo directivo, usted le informa que", "f": "Decreto 1860 de 1994, art. 28.", "o": [["A", "si es elegido personero, no podrá ser a la vez representante de los estudiantes ante el consejo directivo.", "El artículo 28 del Decreto 1860 de 1994 establece que el cargo de personero es incompatible con el de representante de los estudiantes ante el consejo directivo.", true], ["B", "puede ejercer ambos cargos, siempre que no vote en el consejo directivo cuando se discutan sus propias solicitudes.", "Abstenerse en ciertos temas parece una solución prudente, pero la incompatibilidad es total: la misma persona no puede ocupar los dos cargos (Decreto 1860, art. 28).", false], ["C", "puede ejercer ambos cargos si el consejo de estudiantes lo aprueba, porque los dos exigen cursar el último grado.", "Es cierto que ambos cargos exigen cursar el último grado, pero la incompatibilidad la fija la norma y no puede levantarla el consejo de estudiantes.", false]]}, {"id": "CB-104", "niv": 2, "e": "Ante la pregunta de la estudiante de séptimo sobre por quién votar, una respuesta coherente con la formación en participación democrática es", "f": "MEN (2004). Estándares Básicos de Competencias Ciudadanas, Serie Guías n.º 6 (participación y responsabilidad democrática); Ley 115 de 1994, art. 94.", "o": [["A", "sugerirle que vote en blanco hasta conocer mejor a los candidatos, para que su voto no sea improvisado.", "Busca evitar un voto improvisado, pero igualmente le indica qué votar. Lo formativo es ayudarla a informarse para que decida por sí misma.", false], ["B", "invitarla a comparar las propuestas con las funciones del personero y a decidir con sus propios criterios.", "La participación y responsabilidad democrática implica tomar decisiones informadas y autónomas (Guía 6). El docente ofrece herramientas para analizar, sin orientar el voto hacia un candidato.", true], ["C", "recomendarle el candidato cuyas propuestas usted considere más realistas, explicándole las razones de su preferencia.", "Aunque la recomendación sea argumentada, el docente que organiza la elección influye en el voto desde su autoridad y reemplaza el criterio propio de la estudiante.", false]]}]}, {"comp": "competencias_blandas", "rol": "docente", "tag": "Competencias blandas y ciudadanas · Liderazgo y trabajo en equipo (Guía 31)", "texto": "Usted y tres colegas de distintas áreas lideran el proyecto transversal de educación ambiental de séptimo. Acordaron que cada uno desarrollaría una actividad con sus grupos y que presentarían avances cada quince días. El docente de educación física no ha entregado avances en dos reuniones; cuando usted le pregunta, responde que «tiene demasiadas cosas» y que el proyecto «no es de su área». Otra colega propone en el chat del equipo informar al coordinador para que «le llame la atención».", "items": [{"id": "CB-134", "niv": 1, "e": "Para abordar la situación con el docente de educación física, usted primero", "f": "MEN (2008). Guía 31, Anexo 1: Glosario de competencias (trabajo en equipo; comunicación y relaciones interpersonales).", "o": [["A", "le recuerda por escrito en el chat del equipo los compromisos acordados, para que quede constancia.", "Dejar constancia puede ser útil más adelante, pero como primer paso expone al colega ante el grupo y no permite conocer las razones de su incumplimiento.", false], ["B", "asume la parte del trabajo que le corresponde a él, para que el proyecto no se retrase mientras se pone al día.", "Muestra compromiso con el proyecto, pero no construye colaboración, sobrecarga a un miembro del equipo y deja sin resolver la falta de participación.", false], ["C", "conversa en privado con él para conocer sus dificultades y buscar juntos una forma de participar acorde con su carga.", "Escuchar y buscar acuerdos corresponde a la competencia de trabajo en equipo y a la de comunicación y relaciones interpersonales: considerar las contribuciones de los demás y construir relaciones de colaboración (Guía 31).", true]]}, {"id": "CB-135", "niv": 2, "e": "Si usted ya conversó dos veces con el docente, él se comprometió y no cumplió, y la entrega es en una semana, frente a la propuesta de informar al coordinador usted", "f": "MEN (2008). Guía 31, Anexo 1: Glosario de competencias (negociación y mediación; compromiso social e institucional).", "o": [["A", "la apoya e informa al coordinador los acuerdos incumplidos, para que se reorganice el trabajo a tiempo.", "Agotado el diálogo directo y con la entrega encima, informar con hechos concretos a quien puede reorganizar el trabajo es una intervención oportuna y responsable con el objetivo común (Guía 31, negociación y mediación; compromiso social e institucional).", true], ["B", "propone una tercera conversación con el docente para intentar un nuevo acuerdo antes de acudir a la coordinación.", "El diálogo es el primer recurso, pero ya se intentó dos veces sin resultado; insistir a una semana de la entrega pone en riesgo el proyecto y posterga una decisión necesaria.", false], ["C", "le pide que no lo haga, porque escalar el problema dañaría la relación del equipo de manera permanente.", "Cuida la relación del equipo, pero descarta una vía legítima cuando el diálogo ya falló y deja el problema sin solución.", false]]}, {"id": "CB-136", "niv": 2, "e": "Ante el argumento de que el proyecto «no es de su área», usted le muestra que", "f": "Ley 115 de 1994, art. 14; MEN (2008). Guía 31, Anexo 1: Glosario de competencias (compromiso social e institucional).", "o": [["A", "puede limitarse a permitir que sus estudiantes asistan a las actividades ambientales que organicen las demás áreas.", "Es una salida conciliadora, pero acepta la idea de que el tema es ajeno a su área y desconoce el carácter transversal del proyecto.", false], ["B", "la educación ambiental es transversal y que su área puede aportar, por ejemplo, desde el uso y cuidado del entorno.", "La Ley 115 de 1994 (art. 14) establece la educación ambiental como enseñanza obligatoria que no exige una asignatura específica y se incorpora al currículo de manera transversal; mostrar el aporte posible de cada área favorece el compromiso.", true], ["C", "el rector asignó el proyecto a todos los docentes de séptimo y que por eso no puede negarse a participar.", "El argumento de autoridad puede lograr cumplimiento, pero no responde a la objeción ni genera compromiso con el sentido del proyecto.", false]]}, {"id": "CB-137", "niv": 3, "e": "Para que el equipo funcione mejor en lo que queda del proyecto, la medida más efectiva es", "f": "MEN (2008). Guía 31, Anexo 1: Glosario de competencias (trabajo en equipo; orientación al logro).", "o": [["A", "reducir el proyecto a las actividades de los docentes que sí han cumplido, para asegurar un buen resultado final.", "Asegura un producto, pero renuncia al carácter colectivo y transversal del proyecto y excluye a un miembro del equipo en lugar de integrarlo.", false], ["B", "nombrar a un líder que asigne las tareas y reporte a la coordinación a quienes no cumplan con las fechas.", "Da claridad sobre quién coordina, pero centra el funcionamiento en el control y la sanción, no en la colaboración ni en el seguimiento conjunto.", false], ["C", "acordar entre todos tareas concretas, fechas realistas y una forma sencilla de revisar avances y ajustar.", "La organización conjunta, con responsabilidades claras y seguimiento compartido, corresponde a la competencia de trabajo en equipo: propiciar la organización del equipo para el desarrollo de proyectos (Guía 31).", true]]}]}, {"comp": "competencias_blandas", "rol": "docente", "tag": "Competencias blandas y ciudadanas · Competencias ciudadanas: convivencia y paz (Guía 6)", "texto": "Usted es director de grupo de once. Un estudiante le muestra capturas de pantalla de un grupo de WhatsApp de varios compañeros en el que, desde hace tres semanas, se publican memes que ridiculizan a Andrés por su orientación sexual. Andrés ha faltado varios días a clase. El estudiante que le muestra las capturas le pide que no diga que fue él quien las mostró, porque teme represalias.", "items": [{"id": "CB-174", "niv": 1, "e": "Frente a la información recibida, lo primero que usted hace es", "f": "Ley 1620 de 2013, art. 19; Decreto 1965 de 2013, arts. 43 y 44.", "o": [["A", "pedir al estudiante que le reenvíe las capturas para compartirlas en el chat de docentes del grado y analizarlas juntos.", "Consultar con colegas parece útil, pero difundir las capturas en un chat amplía la exposición de Andrés y no sigue el conducto del protocolo.", false], ["B", "agradecer al estudiante, garantizarle reserva sobre su identidad e informar la situación según el protocolo institucional.", "Los docentes deben identificar, reportar y hacer seguimiento a los casos de acoso y ciberacoso, y reportar también al comité cuando ocurren por medios electrónicos (Ley 1620 de 2013, art. 19). Proteger a quien informa es parte de proteger a los involucrados (Decreto 1965 de 2013, arts. 43 y 44).", true], ["C", "hablar de inmediato con los autores de los memes para que los borren antes de que la situación escale.", "Busca detener el daño rápido, pero omite el reporte y puede revelar quién informó; además, borrar el contenido elimina evidencia necesaria para la atención.", false]]}, {"id": "CB-175", "niv": 3, "e": "Al conversar con Andrés, él le pide que no informe a nadie, ni siquiera a sus padres. Usted", "f": "Decreto 1965 de 2013, arts. 43 y 44; Ley 1620 de 2013, art. 19; Ley 1581 de 2012, art. 5.", "o": [["A", "le explica que debe activar el protocolo para protegerlo, que este incluye a su familia, y que no revelará su vida privada.", "El ciberacoso repetido exige activar el protocolo, que incluye informar a las familias y adoptar medidas de protección (Decreto 1965 de 2013, arts. 43 y 44; Ley 1620 de 2013, art. 19). Lo que se informa es la agresión, no la orientación sexual del estudiante, que es un dato sensible (Ley 1581 de 2012, art. 5).", true], ["B", "informa solo a la orientadora y acuerda con ella no contactar a la familia mientras Andrés no lo autorice.", "Busca respetar su decisión, pero el protocolo exige informar a las familias de los involucrados; omitirlo deja al estudiante sin el apoyo de su familia y sin la ruta completa.", false], ["C", "respeta su petición y sigue conversando con él durante los próximos días, para ganar su confianza antes de actuar.", "Fortalecer la confianza es valioso, pero aplazar el protocolo deja que el hostigamiento continúe y desconoce el deber de reportar del docente.", false]]}, {"id": "CB-176", "niv": 2, "e": "Sobre las capturas de pantalla, usted", "f": "Decreto 1965 de 2013, arts. 43 y 44; Ley 1581 de 2012, art. 4.", "o": [["A", "las borra de su teléfono después de leerlas, para no seguir haciendo circular el contenido ofensivo.", "Evitar la circulación es una buena intención, pero eliminar la evidencia dificulta la atención del caso y la adopción de medidas.", false], ["B", "las muestra a los padres de todos los estudiantes del grupo, para que conozcan la gravedad del caso.", "Busca que las familias tomen conciencia, pero expone a Andrés ante muchas personas y desconoce la reserva que exige el protocolo.", false], ["C", "las conserva como evidencia y las entrega solo a las instancias encargadas de atender la situación.", "Las capturas son necesarias para la atención del caso y deben manejarse con reserva, preservando la intimidad y la confidencialidad (Decreto 1965 de 2013, arts. 43 y 44; Ley 1581 de 2012, art. 4).", true]]}, {"id": "CB-177", "niv": 3, "e": "Para trabajar con el grupo después de atender el caso, sin exponer nuevamente a Andrés, usted", "f": "Ley 1620 de 2013, art. 19; MEN (2004). Estándares Básicos de Competencias Ciudadanas, Serie Guías n.º 6 (pluralidad, identidad y valoración de las diferencias).", "o": [["A", "desarrolla actividades sobre el uso responsable de redes y el respeto a la diversidad sexual, sin aludir al caso.", "La Ley 1620 de 2013 (art. 19) pide a los docentes transformar las prácticas pedagógicas para contribuir a la convivencia, y la Guía 6 orienta a valorar las diferencias. No aludir al caso protege la intimidad de Andrés.", true], ["B", "deja el tema en manos del comité de convivencia y evita abordarlo en clase para no reabrir la situación.", "Evita revictimizar, pero renuncia a la función pedagógica del docente en la prevención; el comité atiende el caso, el aula forma al grupo.", false], ["C", "realiza un debate sobre lo ocurrido en el grupo de WhatsApp, para que los autores reconozcan su error frente a todos.", "Busca la reparación, pero reabre públicamente la situación de Andrés y expone a los involucrados; la reparación se trabaja en el marco del protocolo, no frente a todo el grupo.", false]]}]}, {"comp": "competencias_blandas", "rol": "docente", "tag": "Competencias blandas y ciudadanas · Competencias ciudadanas: participación y responsabilidad democrática (Guía 6)", "texto": "Los estudiantes de décimo y once de un colegio oficial están inconformes con la calidad de los refrigerios del programa de alimentación escolar. En el chat de estudiantes circula la propuesta de no entrar a clases al día siguiente como protesta. El personero estudiantil le pide consejo a usted, docente de ciencias sociales, sobre qué hacer. Varios estudiantes ya reunieron fotos de los refrigerios de la última semana.", "items": [{"id": "CB-178", "niv": 1, "e": "Al personero, usted le sugiere", "f": "Ley 115 de 1994, art. 94; MEN (2004). Estándares Básicos de Competencias Ciudadanas, Serie Guías n.º 6 (participación y responsabilidad democrática).", "o": [["A", "no intervenir, porque el programa de alimentación depende de la alcaldía y no de las directivas del colegio.", "Es cierto que el programa no depende solo del colegio, pero la institución puede tramitar las quejas ante quien corresponda; no intervenir deja sin cauce la inconformidad.", false], ["B", "organizar las evidencias y quejas y presentar una solicitud formal al rector, como lo permite su cargo.", "El personero tiene como función presentar ante el rector las solicitudes necesarias para proteger los derechos de los estudiantes (Ley 115 de 1994, art. 94). Usar primero ese canal es una forma responsable de participación (Guía 6).", true], ["C", "convocar a no entrar a clase de forma pacífica, porque la protesta es una forma legítima de participación.", "La protesta pacífica es legítima, pero el personero aún no ha usado el canal institucional que su cargo le ofrece, y la medida afecta el derecho a la educación de todos.", false]]}, {"id": "CB-179", "niv": 2, "e": "Si el rector no resuelve de manera satisfactoria la solicitud del personero, este puede", "f": "Ley 115 de 1994, arts. 94 y 145; Decreto 1860 de 1994, art. 29.", "o": [["A", "acudir al consejo académico, que atiende todas las funciones relacionadas con la buena marcha de la institución.", "El consejo académico tiene esa función general (Ley 115, art. 145), pero la ley asigna expresamente al consejo directivo la decisión en última instancia sobre las solicitudes del personero.", false], ["B", "apelar ante el consejo directivo la decisión del rector sobre su solicitud.", "El parágrafo del artículo 94 de la Ley 115 de 1994 establece que las decisiones sobre las solicitudes del personero son resueltas en última instancia por el consejo directivo.", true], ["C", "acudir al consejo de estudiantes, por ser el máximo órgano de participación de los educandos.", "El consejo de estudiantes es el máximo órgano de participación estudiantil (Decreto 1860, art. 29), pero no es instancia de decisión sobre las solicitudes del personero.", false]]}, {"id": "CB-180", "niv": 3, "e": "Para convertir la situación en una experiencia de formación ciudadana, en su clase usted", "f": "MEN (2004). Estándares Básicos de Competencias Ciudadanas, Serie Guías n.º 6 (participación y responsabilidad democrática).", "o": [["A", "explica que estos asuntos los deben resolver los adultos y que la tarea de los estudiantes es estudiar.", "Busca tranquilizar al grupo, pero desconoce que los estudiantes son parte de la comunidad educativa y tienen mecanismos legítimos para participar.", false], ["B", "organiza una votación para decidir si el curso apoya o no la protesta, y respeta la decisión de la mayoría.", "Votar es una práctica democrática, pero decidir sin analizar antes la situación, las opciones y sus consecuencias reduce la participación a contar votos.", false], ["C", "propone analizar quién decide sobre el programa de alimentación y qué mecanismos de participación existen.", "Conocer cómo se toman las decisiones públicas y qué mecanismos de participación existen hace parte de la participación y responsabilidad democrática (Guía 6). La situación real da sentido a ese aprendizaje.", true]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Constitución Política (art. 68) y educación religiosa (Ley 115 de 1994)", "texto": "Usted es director de grupo de cuarto grado en una institución educativa oficial de Bucaramanga. La madre de Sofía, que pertenece a una congregación cristiana distinta de la que orienta los contenidos del área de educación religiosa, le entrega una carta en la que pide que su hija no participe en esas clases y propone que, en ese horario, la niña realice actividades de lectura en la biblioteca. Días después, en la reunión de padres, otro acudiente propone que el colegio elimine el área del plan de estudios «para evitar problemas», y un docente opina que, al ser un área obligatoria, nadie puede eximirse de ella.", "items": [{"id": "NR-104", "niv": 1, "e": "Frente a la solicitud de la madre de Sofía, lo que corresponde es", "f": "Constitución Política, artículo 68; Ley 115 de 1994, artículos 23 (parágrafo 1.°) y 24.", "o": [["A", "respetarla, porque en los establecimientos del Estado ninguna persona puede ser obligada a recibir educación religiosa.", "El artículo 68 de la Constitución y los artículos 23 (parágrafo 1.°) y 24 de la Ley 115 de 1994 garantizan que en los establecimientos del Estado nadie sea obligado a recibir educación religiosa. Sofía estudia en una institución oficial.", true], ["B", "negarla, porque la educación religiosa es un área obligatoria y fundamental que todos los estudiantes deben cursar y aprobar.", "Que el área sea obligatoria significa que la institución debe ofrecerla, no que el estudiante deba recibirla. La propia Ley 115 aclara que en los establecimientos del Estado nadie puede ser obligado a cursarla.", false], ["C", "aceptarla solo si la familia acredita su afiliación a una iglesia con personería jurídica reconocida.", "La garantía constitucional no está sujeta a acreditar la pertenencia a una confesión registrada; se funda en la libertad de conciencia y de cultos y en el derecho de los padres a escoger el tipo de educación de sus hijos (artículo 68).", false]]}, {"id": "NR-105", "niv": 2, "e": "Ante la propuesta de eliminar el área del plan de estudios, usted explica que, según la Ley 115 de 1994,", "f": "Ley 115 de 1994, artículos 23, 24 y 77.", "o": [["A", "el consejo directivo puede suprimirla en ejercicio de la autonomía escolar, si así lo pide la mayoría de los padres de familia.", "La autonomía del artículo 77 permite organizar las áreas fundamentales e introducir asignaturas optativas, pero no suprimir un área que el artículo 23 define como obligatoria y fundamental.", false], ["B", "debe ofrecerse en todos los establecimientos educativos, como área obligatoria y fundamental del plan de estudios.", "El artículo 23 incluye la educación religiosa entre las áreas obligatorias y fundamentales y su parágrafo ordena ofrecerla en todos los establecimientos educativos, con la garantía de que en los del Estado nadie sea obligado a recibirla.", true], ["C", "solo los colegios privados de orientación confesional están obligados a incluirla en su plan de estudios.", "El parágrafo del artículo 23 dispone que la educación religiosa se ofrecerá en todos los establecimientos educativos, no solo en los privados de orientación confesional.", false]]}, {"id": "NR-106", "niv": 2, "e": "La discusión sobre el plan de estudios pasa al consejo directivo, donde tienen asiento docentes, padres y estudiantes. Esta participación tiene fundamento constitucional en", "f": "Constitución Política, artículos 67 y 68; Ley 115 de 1994, artículos 6 y 142.", "o": [["A", "el mandato de que la comunidad educativa participe en la dirección de las instituciones de educación.", "El artículo 68 de la Constitución dispone que la comunidad educativa participará en la dirección de las instituciones de educación; el artículo 6 de la Ley 115 desarrolla ese mandato y el artículo 142 crea el gobierno escolar para materializarlo.", true], ["B", "la facultad del Estado de ejercer la suprema inspección y vigilancia de la educación.", "La inspección y vigilancia del artículo 67 es una función estatal de control de la calidad y del cumplimiento de los fines de la educación; no es el fundamento de la participación de la comunidad en el gobierno escolar.", false], ["C", "la libertad de los particulares para fundar establecimientos educativos y definir de manera autónoma su gestión.", "Esa libertad, prevista en el primer inciso del artículo 68, se refiere a la creación de establecimientos según las condiciones que fije la ley; no fundamenta la participación de docentes, padres y estudiantes en la dirección institucional.", false]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Proyectos pedagógicos, formación ética, orientación estudiantil y familia (Ley 115 de 1994, arts. 7 y 25; Decreto 1860 de 1994, arts. 36 y 40)", "texto": "En una institución oficial de Montería, el consejo académico revisa el plan de estudios del próximo año. Un docente propone suprimir el proyecto de educación ambiental, al que considera «una actividad suelta», y concentrar toda la formación en valores en el área de ética. Otro colega sostiene que la orientación estudiantil «no es asunto nuestro», porque la sede no tiene docente orientador nombrado. Al final de la reunión, la representante de los padres pregunta qué le corresponde a la familia en la educación de sus hijos, además de matricularlos en la institución.", "items": [{"id": "NR-142", "niv": 2, "e": "Frente a la propuesta sobre el proyecto de educación ambiental, usted explica que, según el Decreto 1860 de 1994, un proyecto pedagógico es", "f": "Decreto 1860 de 1994, artículo 36.", "o": [["A", "una actividad extracurricular voluntaria, que se desarrolla por fuera del plan de estudios de la institución.", "El artículo 36 ubica el proyecto pedagógico dentro del plan de estudios, que además define su intensidad horaria y su duración; no es una actividad voluntaria por fuera de él.", false], ["B", "un programa diseñado por la secretaría de educación, que la institución aplica sin modificaciones.", "El Decreto 1860 concibe el proyecto pedagógico como parte del plan de estudios de cada institución, orientado a los fines y objetivos de su PEI; no lo describe como un programa externo de aplicación uniforme.", false], ["C", "una actividad del plan de estudios que ejercita al estudiante en la solución de problemas cotidianos relacionados con su entorno.", "El artículo 36 del Decreto 1860 de 1994 define el proyecto pedagógico como una actividad dentro del plan de estudios que, de manera planificada, ejercita al educando en la solución de problemas cotidianos relacionados con su entorno social, cultural, científico y tecnológico, e integra lo logrado en diversas áreas.", true]]}, {"id": "NR-143", "niv": 3, "e": "Frente a la idea de concentrar la formación en valores en el área de ética, usted señala que, según la Ley 115 de 1994, la formación ética y moral se promueve", "f": "Ley 115 de 1994, artículos 23 y 25.", "o": [["A", "a través de las sanciones del manual de convivencia, que corrigen las conductas contrarias a los valores.", "El artículo 25 menciona la aplicación recta y justa de las normas como uno de varios medios, pero no reduce la formación ética a las sanciones; el énfasis está en el currículo, el ambiente y el ejemplo de los adultos.", false], ["B", "también mediante el ambiente escolar, el comportamiento honesto de directivos y educadores y la aplicación justa de las normas.", "El artículo 25 de la Ley 115 de 1994 dispone que la formación ética y moral se promoverá a través del currículo, de los contenidos académicos pertinentes, del ambiente, del comportamiento honesto de directivos, educadores y personal administrativo, de la aplicación recta y justa de las normas y de los demás mecanismos del PEI.", true], ["C", "a través del área de ética y valores humanos, bajo la responsabilidad del docente que tenga esa asignación.", "Aunque ética y valores humanos es un área obligatoria (artículo 23), el artículo 25 no confía la formación ética a un solo docente: la extiende al currículo, al ambiente y al comportamiento de toda la comunidad institucional.", false]]}, {"id": "NR-144", "niv": 3, "e": "Frente a la posición del colega sobre la orientación estudiantil, lo acertado es afirmar que, según el Decreto 1860 de 1994, este servicio", "f": "Decreto 1860 de 1994, artículo 40; Decreto 1278 de 2002, artículo 5.", "o": [["A", "se presta en todos los establecimientos y busca contribuir al pleno desarrollo de la personalidad de los estudiantes.", "El artículo 40 del Decreto 1860 de 1994 establece que en todos los establecimientos educativos se presta un servicio de orientación estudiantil cuyo objetivo general es contribuir al pleno desarrollo de la personalidad de los educandos, en aspectos como la toma de decisiones, la solución de conflictos y el desarrollo de valores.", true], ["B", "se limita a la atención de los estudiantes remitidos por faltas al manual de convivencia.", "El objetivo del servicio es más amplio: toma de decisiones personales, identificación de aptitudes e intereses, solución de conflictos, participación y desarrollo de valores (artículo 40); no se reduce a casos disciplinarios.", false], ["C", "se presta en las sedes que cuentan con un docente orientador nombrado por la entidad territorial.", "El artículo 40 del Decreto 1860 dispone que el servicio de orientación estudiantil se presta en todos los establecimientos educativos; además, el artículo 5 del Decreto 1278 de 2002 lo incluye entre las responsabilidades de los docentes.", false]]}, {"id": "NR-145", "niv": 1, "e": "A la pregunta de la representante de los padres, usted responde que, según la Ley 115 de 1994, a la familia le corresponde, entre otras obligaciones,", "f": "Ley 115 de 1994, artículos 7 y 145.", "o": [["A", "aprobar el plan de estudios que el consejo académico proponga para cada grado.", "La organización del plan de estudios es función del consejo académico (artículo 145) dentro del PEI; la familia participa en el consejo directivo, asociaciones y comités (artículo 7, literal e), pero no aprueba el plan de estudios.", false], ["B", "decidir la promoción de sus hijos cuando no esté de acuerdo con las calificaciones obtenidas en el año.", "La promoción se decide según el sistema institucional de evaluación de los estudiantes; la ley le asigna a la familia informarse y participar en las acciones de mejoramiento, no decidir la promoción.", false], ["C", "informarse sobre el rendimiento y el comportamiento de sus hijos y participar en las acciones de mejoramiento.", "El literal c) del artículo 7 de la Ley 115 de 1994 establece que a la familia le corresponde informarse sobre el rendimiento académico y el comportamiento de sus hijos y sobre la marcha de la institución, y en ambos casos participar en las acciones de mejoramiento.", true]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Sistema General de Participaciones y acceso a la educación rural (Ley 715 de 2001; Ley 1098 de 2006)", "texto": "Usted es representante de los docentes en el consejo directivo de una institución oficial de un municipio de Nariño con varias sedes rurales dispersas. En la sesión se discute un informe sobre los recursos del Sistema General de Participaciones (SGP) para educación que administra la entidad territorial, y varias familias de una vereda piden apoyo de transporte porque los niños caminan más de dos horas para llegar a la sede. Algunos niños de esa vereda ya han dejado de asistir en época de lluvias.", "items": [{"id": "NR-146", "niv": 2, "e": "Al explicar el destino de los recursos de la participación para educación del SGP, usted señala correctamente que con ellos se financia, entre otras actividades,", "f": "Ley 715 de 2001, artículo 15.", "o": [["A", "el pago de las matrículas universitarias de los mejores bachilleres de la entidad territorial.", "Las actividades que enumera el artículo 15 se refieren a la prestación del servicio en las instituciones educativas públicas; el pago de matrículas universitarias no figura entre ellas.", false], ["B", "la entrega de subsidios en dinero a las familias para la compra de útiles, textos escolares y uniformes de los estudiantes.", "Los subsidios monetarios directos a las familias no están entre las actividades del artículo 15: personal, infraestructura y funcionamiento, canasta educativa y calidad.", false], ["C", "el pago del personal docente y administrativo de las instituciones públicas y sus prestaciones sociales.", "El artículo 15 de la Ley 715 de 2001 destina los recursos de la participación para educación, entre otras actividades, al pago del personal docente y administrativo de las instituciones educativas públicas, las contribuciones inherentes a la nómina y sus prestaciones sociales (numeral 15.1).", true]]}, {"id": "NR-147", "niv": 3, "e": "Frente a la solicitud de transporte de las familias de la vereda, la Ley 715 de 2001 prevé destinar recursos de la participación para educación a transporte escolar", "f": "Ley 715 de 2001, artículo 15, parágrafo 2.", "o": [["A", "cuando el consejo directivo lo apruebe, con cargo a los recursos de gratuidad girados a la institución.", "La destinación prevista en el parágrafo 2 del artículo 15 la hace la entidad territorial con la participación para educación, una vez cubiertos los costos del servicio; no depende de una aprobación del consejo directivo ni de los recursos de gratuidad.", false], ["B", "una vez cubiertos los costos del servicio, para estudiantes de estratos pobres cuando la geografía lo exija.", "El parágrafo 2 del artículo 15 de la Ley 715 de 2001 dispone que, una vez cubiertos los costos de la prestación del servicio educativo, las entidades territoriales destinarán recursos de esta participación a transporte escolar para los niños de los estratos más pobres, cuando las condiciones geográficas lo requieran para garantizar el acceso y la permanencia.", true], ["C", "antes de cubrir la nómina docente, cuando la demanda de transporte supere la oferta de cupos cercanos.", "La norma condiciona el transporte a que primero estén cubiertos los costos de la prestación del servicio, entre ellos la nómina; no permite anteponerlo a esos costos.", false]]}, {"id": "NR-148", "niv": 1, "e": "Al respaldar la petición de las familias, usted recuerda que el Código de la Infancia y la Adolescencia impone a las instituciones educativas la obligación especial de", "f": "Ley 1098 de 2006, artículo 42, numerales 1 y 12.", "o": [["A", "facilitar el acceso de los niños, niñas y adolescentes al sistema educativo y garantizar su permanencia.", "El numeral 1 del artículo 42 de la Ley 1098 de 2006 establece como obligación especial de las instituciones educativas facilitar el acceso de los niños, niñas y adolescentes al sistema educativo y garantizar su permanencia.", true], ["B", "prestar directamente el transporte escolar gratuito a todos los estudiantes que vivan en la zona rural del municipio.", "El Código no asigna a cada institución la prestación directa del transporte; la financiación del transporte escolar con recursos del SGP corresponde a las entidades territoriales en las condiciones del parágrafo 2 del artículo 15 de la Ley 715 de 2001.", false], ["C", "dar prioridad en la matrícula a quienes vivan cerca de la sede, para disminuir el riesgo de deserción.", "Restringir el cupo por distancia contradice la obligación de facilitar el acceso y garantizar la permanencia; además, el artículo 42 prohíbe la discriminación por condición socioeconómica.", false]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Período de prueba e inscripción en el escalafón (Decreto 1278 de 2002)", "texto": "Tres docentes ganaron el concurso de méritos en una entidad territorial certificada de calendario A, cuyo año escolar termina a finales de noviembre. Diana, licenciada en Lengua Castellana, se posesionó el 3 de marzo; Jorge, ingeniero civil, se posesionó el 10 de marzo en el área de matemáticas; y Paola, licenciada en Educación Infantil, se posesionó el 1 de septiembre. Los tres preguntan en la secretaría de educación cuándo serán evaluados y qué ocurrirá después de la evaluación del período de prueba.", "items": [{"id": "NR-172", "niv": 1, "e": "Sobre la duración del período de prueba de Diana, el Decreto 1278 de 2002 establece que", "f": "Decreto 1278 de 2002, artículos 12 y 31.", "o": [["A", "dura un año calendario completo, contado desde la fecha de su posesión en el cargo.", "La norma no fija un año calendario: el período de prueba se extiende hasta terminar el año escolar, con un mínimo de cuatro meses de servicio.", false], ["B", "va hasta culminar el año escolar en que fue nombrada, porque habrá desempeñado el cargo al menos cuatro meses.", "El artículo 12 del Decreto 1278 de 2002 dispone que el seleccionado será nombrado en período de prueba hasta culminar el año escolar en el cual fue nombrado, siempre que haya desempeñado el cargo por lo menos durante cuatro meses. De marzo a finales de noviembre se supera ese mínimo.", true], ["C", "dura seis meses, al cabo de los cuales se hace la evaluación de desempeño y competencias.", "El Decreto 1278 no fija un período de seis meses; la evaluación se hace al terminar el año académico (artículos 12 y 31).", false]]}, {"id": "NR-173", "niv": 2, "e": "En el caso de Paola, la evaluación de período de prueba", "f": "Decreto 1278 de 2002, artículos 12, 18 y 31.", "o": [["A", "se hará al terminar el año académico siguiente, porque en el actual no alcanza cuatro meses de servicio.", "El artículo 31 del Decreto 1278 de 2002 dispone que se someten a la evaluación de período de prueba quienes hayan servido el cargo por un período no menor a cuatro meses durante el año; de lo contrario, deben esperar hasta el año académico siguiente. Del 1 de septiembre a finales de noviembre hay menos de cuatro meses.", true], ["B", "no se realizará, porque al ganar el concurso queda inscrita automáticamente en el escalafón.", "Ganar el concurso no basta: los derechos de carrera y la inscripción en el escalafón se adquieren al aprobar la evaluación del período de prueba (artículos 12 y 18).", false], ["C", "se hará al terminar el año actual, valorando solo el tiempo que efectivamente alcanzó a servir en el cargo.", "La norma exige un mínimo de cuatro meses de servicio en el año para ser evaluado; con menos tiempo, la evaluación se aplaza al año académico siguiente.", false]]}, {"id": "NR-174", "niv": 2, "e": "Si Diana obtiene 72 % en la evaluación de período de prueba, según el Decreto 1278 de 2002, ella", "f": "Decreto 1278 de 2002, artículos 20, 21 y 31.", "o": [["A", "será inscrita en el escalafón en el grado 2, nivel salarial B, por haber superado el 70 %.", "El grado se determina por el título y el nivel inicial es A para todos los que superan el período de prueba (artículo 20); el porcentaje obtenido no define el nivel salarial.", false], ["B", "será inscrita en el escalafón en el grado 1, nivel salarial A, como todo docente que ingresa.", "El grado 1 corresponde a los normalistas superiores; el grado de inscripción depende del título que se acredite, no de ser docente nuevo (artículo 21).", false], ["C", "será inscrita en el escalafón en el grado 2, nivel salarial A, por su título de licenciada.", "El artículo 31 considera satisfactoria una calificación igual o superior al 60 % e inscribe al docente en el grado que corresponda a sus títulos; el artículo 21 exige para el grado 2 ser licenciado en Educación, y el artículo 20 ubica a quienes superan el período de prueba en el nivel salarial A del grado correspondiente.", true]]}, {"id": "NR-175", "niv": 3, "e": "Para Jorge, que es ingeniero, una condición adicional que exige el Decreto 1278 de 2002 al término del período de prueba es", "f": "Decreto 1278 de 2002, artículo 12, parágrafo 1.", "o": [["A", "ninguna, porque el concurso ya evaluó sus competencias pedagógicas y su aptitud docente.", "Aunque superó el concurso, el parágrafo 1 del artículo 12 le exige acreditar formación pedagógica al término del período de prueba.", false], ["B", "acreditar el título de licenciado en matemáticas antes de ser inscrito en el escalafón docente nacional.", "La norma no exige obtener una licenciatura; a los profesionales no licenciados les basta acreditar el posgrado en educación o el programa de pedagogía.", false], ["C", "acreditar que cursa o terminó un posgrado en educación o que realizó un programa de pedagogía.", "El parágrafo 1 del artículo 12 del Decreto 1278 de 2002 dispone que los profesionales con título diferente al de licenciado deben acreditar, al término del período de prueba, que cursan o han terminado un posgrado en educación o que han realizado un programa de pedagogía en una institución de educación superior.", true]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Autoevaluación y coevaluación (Decreto 1290 de 2009)", "texto": "En sexto grado de una institución de Villavicencio, usted orienta ciencias sociales. Los estudiantes trabajan en grupos de cuatro durante tres semanas para elaborar una maqueta y una exposición sobre las regiones naturales de Colombia. Usted quiere que la evaluación incluya la mirada de los propios estudiantes, por lo que planea dos momentos: uno en el que cada estudiante valore su propio trabajo y otro en el que los integrantes de cada grupo valoren el aporte de sus compañeros, con criterios acordados previamente. Un colega opina que eso es opcional y que «el único que sabe evaluar es el profesor». Al revisar los formatos, usted encuentra que un grupo asignó 1,0 a uno de sus integrantes sin ninguna explicación.", "items": [{"id": "PD-128", "niv": 1, "e": "El momento en que los integrantes de cada grupo valoran el aporte de sus compañeros corresponde a una", "f": "MEN, Manual de implementación Escuela Nueva (evaluación: autoevaluación, coevaluación y heteroevaluación).", "o": [["A", "autoevaluación, porque el grupo evalúa el trabajo que él mismo realizó en las tres semanas.", "La autoevaluación es la valoración que cada estudiante hace de su propio desempeño; aquí cada integrante valora el aporte de los demás, no el suyo.", false], ["B", "coevaluación, porque los pares se valoran entre sí con criterios acordados.", "La coevaluación es la valoración que hacen los compañeros del trabajo o desempeño de sus pares; el modelo Escuela Nueva del MEN, por ejemplo, la incluye junto con la autoevaluación y la heteroevaluación.", true], ["C", "heteroevaluación, porque es el docente quien consolida y registra la valoración final del trabajo.", "Que el docente consolide la nota no cambia quién valora en ese momento: la heteroevaluación es la que realiza un agente de distinto rol, típicamente el docente; cuando valoran los pares se habla de coevaluación.", false]]}, {"id": "PD-129", "niv": 1, "e": "Ante la opinión del colega, usted le aclara que, según el Decreto 1290 de 2009,", "f": "Decreto 1290 de 2009, artículo 4, numeral 5.", "o": [["A", "los procesos de autoevaluación de los estudiantes son uno de los elementos que debe contener el SIEE.", "El artículo 4 del Decreto 1290 de 2009 enumera los elementos del sistema institucional de evaluación; su numeral 5 incluye los procesos de autoevaluación de los estudiantes. No es una decisión opcional de cada docente.", true], ["B", "la norma impide que la autoevaluación tenga algún peso en la valoración final del período académico.", "El decreto no prohíbe que la autoevaluación incida en la valoración; deja en manos de cada institución definir en su SIEE cómo se integra.", false], ["C", "la autoevaluación solo está prevista para la educación media, por la madurez que exige a los estudiantes.", "El Decreto 1290 regula la evaluación en la básica y la media sin limitar la autoevaluación a la media; la incluye como elemento del SIEE para todos los estudiantes.", false]]}, {"id": "PD-130", "niv": 2, "e": "Para que la autoevaluación sea formativa y no se reduzca a que cada estudiante se asigne una nota, lo más adecuado es", "f": "Decreto 1290 de 2009, artículos 3 y 4; MEN (2009). Documento No. 11: Fundamentaciones y orientaciones para la implementación del Decreto 1290 de 2009.", "o": [["A", "reemplazar la nota del estudiante por la del docente cada vez que la autoevaluación resulte más alta.", "Anular la autoevaluación cuando no coincide envía el mensaje de que la opinión del estudiante no cuenta; lo formativo es contrastar ambas valoraciones con evidencias.", false], ["B", "orientarla con criterios claros y preguntas que pidan evidencias de lo logrado y de lo que falta por mejorar.", "Una autoevaluación formativa se apoya en criterios conocidos y exige justificar con evidencias; así desarrolla la capacidad del estudiante para regular su propio aprendizaje.", true], ["C", "permitir que cada estudiante se asigne libremente la nota que considere justa, sin ninguna intervención del docente.", "Sin criterios ni evidencias, la autoevaluación se reduce a una cifra y no promueve la reflexión sobre lo aprendido, que es su sentido formativo.", false]]}, {"id": "PD-131", "niv": 3, "e": "Frente al grupo que asignó 1,0 a un compañero sin explicación, lo más adecuado es", "f": "Decreto 1290 de 2009, artículo 12 (derecho a ser evaluado de manera integral); MEN (2009). Documento No. 11: Fundamentaciones y orientaciones para la implementación del Decreto 1290 de 2009 (evaluación incluyente).", "o": [["A", "registrar la nota tal como la asignó el grupo, para respetar la autonomía de los estudiantes en el proceso.", "Respetar la participación de los estudiantes no significa aceptar valoraciones sin sustento; el docente sigue siendo responsable de que la evaluación sea justa y basada en evidencias.", false], ["B", "anular la coevaluación de todo el curso, porque los estudiantes de sexto no son objetivos al valorarse.", "Generalizar a todo el curso un problema de un grupo elimina una estrategia formativa en lugar de corregir su aplicación; la objetividad se aprende con criterios y acompañamiento.", false], ["C", "dialogar con el grupo para contrastar esa valoración con los criterios y las evidencias del trabajo.", "La coevaluación debe sustentarse en criterios y evidencias. Revisarla con el grupo protege al estudiante de una valoración arbitraria y, al mismo tiempo, enseña a valorar el trabajo ajeno con argumentos.", true]]}]}, {"comp": "pedagogia_normativa", "rol": "docente", "tag": "Competencias pedagógicas y normativa · Pedagogía activa y métodos activos (Decreto 1860 de 1994)", "texto": "Usted enseña física en décimo grado en una institución de Tunja. En la reunión de área, varios docentes discuten cómo hacer más activas las clases. Un colega propone que basta con que los estudiantes «estén haciendo algo con las manos» para que la clase sea activa. Otro sostiene que la pedagogía activa sirve solo en primaria y que en la media lo adecuado es la exposición. Usted prepara la unidad de movimiento rectilíneo uniforme y cuenta con carritos de juguete, cintas métricas, cronómetros de celular y el patio de la institución.", "items": [{"id": "PD-148", "niv": 1, "e": "Según el Decreto 1860 de 1994, en el desarrollo de una asignatura se deben aplicar", "f": "Decreto 1860 de 1994, artículo 35; Ley 115 de 1994, artículo 77.", "o": [["A", "estrategias y métodos activos y vivenciales, como la experimentación, el taller y la práctica de laboratorio.", "El artículo 35 del Decreto 1860 de 1994 indica que en el desarrollo de una asignatura se deben aplicar estrategias y métodos pedagógicos activos y vivenciales que incluyan la exposición, la observación, la experimentación, la práctica, el laboratorio, el taller y el estudio personal, entre otros.", true], ["B", "los métodos que la secretaría de educación defina cada año para todas las instituciones de su jurisdicción.", "La Ley 115 (artículo 77) reconoce a las instituciones autonomía para adoptar métodos de enseñanza; la secretaría asesora, pero no fija los métodos de cada institución.", false], ["C", "métodos centrados en la exposición del docente y la toma de apuntes, para garantizar el cubrimiento de los temas.", "La exposición aparece en la norma como uno de varios elementos, pero el decreto pide métodos activos y vivenciales, no centrar la clase en la exposición y el apunte.", false]]}, {"id": "PD-149", "niv": 2, "e": "Para la unidad de movimiento rectilíneo uniforme, la propuesta más coherent
