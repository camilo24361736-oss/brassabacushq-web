<style>body{overflow-wrap:anywhere}
:root{--bg:#f6f8fb;--card:#fff;--ink:#1d2433;--mute:#5a6478;--line:#dbe1ea;--pri:#0b3d6e;--pri2:#1660a8;--ok:#0d6b3a;--okbg:#e6f4ec;--no:#9b1c1c;--nobg:#fbeaea;--sel:#e8f0fa}
@media (prefers-color-scheme: dark){:root{--bg:#10151d;--card:#18202b;--ink:#e6ebf2;--mute:#9aa6b8;--line:#2a3545;--pri:#7fb3ea;--pri2:#9cc6f2;--ok:#7fd3a3;--okbg:#16301f;--no:#f2a3a3;--nobg:#3a1c1c;--sel:#1e2d40}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px}

.stat{font-size:14px;color:var(--mute)}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--pri)}
.timer.low{color:var(--no)}
main{max-width:860px;margin:0 auto;padding:16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin:0 0 16px}
.caso{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--pri);border-radius:10px;padding:14px 16px;margin:22px 0 10px}
.tag{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--pri);font-weight:700}
.caso p{margin:6px 0 0;white-space:pre-line}
.item{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0}

.n{font-weight:700;color:var(--pri)}
.niv{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-right:4px;white-space:nowrap}
.op{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:6px 0;cursor:pointer;background:transparent;width:100%;text-align:left;color:inherit;font:inherit}
.op:hover{border-color:var(--pri2)}
.op .l{font-weight:700;min-width:20px}
.op.sel{background:var(--sel);border-color:var(--pri2)}
.op.ok{background:var(--okbg);border-color:var(--ok)}
.op.no{background:var(--nobg);border-color:var(--no)}
.op[disabled]{cursor:default}
.just{font-size:14px;margin:8px 0 0;padding:8px 10px;border-top:1px dashed var(--line)}
.just div{margin:4px 0}
.just .okt{color:var(--ok);font-weight:700}
.just .not{color:var(--no);font-weight:700}
.src{font-size:13px;color:var(--mute);margin-top:6px}
button.btn{background:var(--pri);color:var(--card);border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer}
button.btn.sec{background:transparent;color:var(--pri);border:1px solid var(--pri)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
select{font:inherit;padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);max-width:100%}
table{border-collapse:collapse;width:100%;font-size:15px}
td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
.big{font-size:40px;font-weight:800;color:var(--pri);line-height:1.1}
.aviso{font-size:13px;color:var(--mute)}
.hide{display:none !important}
.res-ok{color:var(--ok);font-weight:700}.res-no{color:var(--no);font-weight:700}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal .panel{max-width:420px}
footer{max-width:860px;margin:0 auto;padding:8px 16px 40px;font-size:12px;color:var(--mute)}
</style>

<footer><a href="./" style="color:var(--pri);font-weight:600">← Volver al menú</a><br><br>Material de preparación independiente. No está afiliado a la Procuraduría General de la Nación, a la Universidad de Antioquia ni a ninguna entidad pública, y no contiene preguntas reales de la prueba.</footer>
<script>
const DATA = [{"comp": "estructura_pgn", "rol": "general", "tag": "Estructura y funciones de la Procuraduría · Ministerio Público en la Constitución", "texto": "Usted acaba de posesionarse como auxiliar administrativo en una procuraduría provincial y participa en la jornada de inducción. El procurador provincial explica la ubicación de la entidad en el Estado y pide a los nuevos servidores resolver tres preguntas de un taller. En la primera deben identificar quiénes ejercen el Ministerio Público según la Constitución. En la segunda, cuáles son los órganos de control. En la tercera, un compañero sostiene que la Procuraduría pertenece a la Rama Ejecutiva porque su planta la paga el Presupuesto General de la Nación, y otro afirma que pertenece a la Rama Judicial porque sus agentes actúan ante los jueces.", "items": [{"id": "PG-101", "niv": 1, "e": "Según el artículo 118 de la Constitución, el Ministerio Público es ejercido, entre otros, por el Procurador General de la Nación y", "f": "Constitución Política, art. 118", "o": [["A", "el Defensor del Pueblo, los procuradores delegados, los agentes del Ministerio Público ante las autoridades jurisdiccionales y los personeros municipales.", "El artículo 118 de la Constitución enumera a quienes ejercen el Ministerio Público: el Procurador, el Defensor del Pueblo, los procuradores delegados y los agentes ante las autoridades jurisdiccionales, los personeros municipales y los demás funcionarios que determine la ley.", true], ["B", "el Contralor General de la República, los contralores departamentales y municipales, los personeros municipales y los demás funcionarios que determine la ley.", "La Contraloría es un órgano de control distinto del Ministerio Público (art. 117 de la Constitución); el artículo 118 no incluye a los contralores entre quienes ejercen el Ministerio Público.", false], ["C", "el Fiscal General de la Nación, los fiscales delegados ante los jueces y el Defensor del Pueblo.", "La Fiscalía General de la Nación hace parte de la Rama Judicial (art. 249 y siguientes de la Constitución) y no aparece en la enumeración del artículo 118 de quienes ejercen el Ministerio Público.", false]]}, {"id": "PG-102", "niv": 1, "e": "En la segunda pregunta del taller, la respuesta acorde con el artículo 117 de la Constitución es que son órganos de control", "f": "Constitución Política, arts. 117 y 120", "o": [["A", "el Ministerio Público, la Contraloría General de la República y la Registraduría Nacional del Estado Civil.", "La Registraduría hace parte de la organización electoral (art. 120 de la Constitución), no de los órganos de control que enumera el artículo 117.", false], ["B", "el Ministerio Público y la Fiscalía General de la Nación, por ejercer ambos vigilancia sobre los servidores públicos.", "La Fiscalía no es órgano de control: integra la Rama Judicial. El artículo 117 solo menciona al Ministerio Público y a la Contraloría General.", false], ["C", "el Ministerio Público y la Contraloría General de la República.", "El artículo 117 de la Constitución dispone que el Ministerio Público y la Contraloría General de la República son órganos de control.", true]]}, {"id": "PG-103", "niv": 3, "e": "Frente a la discusión de los dos compañeros, lo correcto es afirmar que la Procuraduría General de la Nación", "f": "Constitución Política, arts. 113 y 117; Decreto Ley 262 de 2000, art. 1", "o": [["A", "integra la Rama Judicial, porque sus agentes tienen la misma categoría de los jueces ante quienes actúan.", "La equiparación de calidades y remuneración de los agentes del Ministerio Público con los jueces (art. 280) no los convierte en parte de la Rama Judicial; la PGN es un órgano de control (art. 117).", false], ["B", "no hace parte de ninguna de las tres ramas, pues es un órgano de control.", "El artículo 113 de la Constitución prevé, además de las tres ramas, otros órganos autónomos e independientes para las demás funciones del Estado; el artículo 117 califica al Ministerio Público como órgano de control, y el artículo 1 del Decreto Ley 262 de 2000 le reconoce a la PGN autonomía administrativa, financiera y presupuestal.", true], ["C", "pertenece a la Rama Ejecutiva del orden nacional, porque su presupuesto hace parte del Presupuesto General de la Nación.", "Que su presupuesto se incluya en el Presupuesto General no la ubica en la Rama Ejecutiva. El Decreto Ley 262 de 2000 (art. 1) le reconoce autonomía administrativa, financiera y presupuestal, y la Constitución la trata como órgano de control.", false]]}]}, {"comp": "estructura_pgn", "rol": "general", "tag": "Estructura y funciones de la Procuraduría · Atribuciones del Procurador: información, policía judicial y desvinculación", "texto": "Una procuraduría regional adelanta una actuación por presuntas irregularidades en el manejo de los recursos de alimentación escolar de un departamento. La secretaría de educación departamental se niega a entregar las bases de datos de los contratistas y alega que son «información reservada». Un funcionario de la gobernación afirma, además, que la Procuraduría no puede practicar inspecciones porque solo la Fiscalía tiene funciones de policía judicial. En una reunión, un ciudadano pregunta si el procurador regional puede retirar de inmediato del cargo al secretario que obstaculiza la actuación.", "items": [{"id": "PG-110", "niv": 2, "e": "Frente a la negativa de la secretaría de educación a entregar la información, y según el artículo 284 de la Constitución, es correcto afirmar que", "f": "Constitución Política, arts. 277 num. 9 y 284", "o": [["A", "la Procuraduría debe obtener primero una orden judicial, porque la reserva solo puede levantarla un juez.", "La Constitución no condiciona el acceso de la Procuraduría a una orden judicial: el artículo 284 dispone que no puede oponérsele reserva, salvo excepciones legales.", false], ["B", "la Procuraduría puede exigirla y la entidad no puede oponerle reserva, salvo las excepciones constitucionales y legales.", "El artículo 284 de la Constitución permite al Procurador requerir de las autoridades la información necesaria sin que pueda oponérsele reserva, salvo las excepciones constitucionales y legales; el artículo 277, num. 9, le permite exigir información a funcionarios y particulares.", true], ["C", "la secretaría puede negarla legítimamente, porque la reserva legal de la información prevalece sobre las solicitudes que formulen los organismos de control.", "Es la regla contraria a la del artículo 284 de la Constitución, según el cual al Procurador no puede oponérsele reserva, salvo las excepciones de la Constitución y la ley.", false]]}, {"id": "PG-111", "niv": 1, "e": "Sobre la afirmación del funcionario de la gobernación acerca de la policía judicial, lo correcto es que", "f": "Constitución Política, art. 277, inciso final", "o": [["A", "la Constitución otorga a la Procuraduría atribuciones de policía judicial para el cumplimiento de sus funciones.", "El inciso final del artículo 277 de la Constitución dispone que, para el cumplimiento de sus funciones, la Procuraduría tendrá atribuciones de policía judicial y podrá interponer las acciones que considere necesarias.", true], ["B", "la Procuraduría solo puede ejercer esas atribuciones si el Fiscal General se las delega para cada caso.", "La atribución de policía judicial de la Procuraduría proviene directamente de la Constitución (art. 277, inciso final), no de una delegación del Fiscal.", false], ["C", "es cierta, porque la policía judicial es exclusiva de la Fiscalía General de la Nación y de los organismos que esta designe para cada investigación.", "La Constitución también otorga atribuciones de policía judicial a la Procuraduría para cumplir sus funciones (art. 277, inciso final).", false]]}, {"id": "PG-112", "niv": 2, "e": "Sobre la pregunta del ciudadano, la facultad constitucional de desvincular del cargo, previa audiencia y mediante decisión motivada, al funcionario que obstaculice en forma grave las investigaciones de la Procuraduría corresponde", "f": "Constitución Política, art. 278 num. 1; Decreto Ley 262 de 2000, art. 7 parágrafo", "o": [["A", "al gobernador, como nominador, a solicitud de la procuraduría regional.", "La facultad del artículo 278, num. 1, de la Constitución es del Procurador General; no se trata de una solicitud al nominador.", false], ["B", "al procurador regional, como funcionario que adelanta la actuación.", "Esa facultad no está asignada a los procuradores territoriales: el artículo 278, num. 1, de la Constitución la reserva al Procurador General, que la ejerce directamente.", false], ["C", "directamente al Procurador General de la Nación.", "El artículo 278, num. 1, de la Constitución atribuye al Procurador General, en ejercicio directo, la función de desvincular del cargo, previa audiencia y con decisión motivada, al funcionario que, entre otras causales, obstaculice en forma grave las investigaciones de la Procuraduría.", true]]}]}, {"comp": "estructura_pgn", "rol": "general", "tag": "Estructura y funciones de la Procuraduría · Oficinas del Despacho del Procurador", "texto": "En el comité directivo de la Procuraduría se revisan tres temas. Primero, la preparación del anteproyecto de presupuesto de la próxima vigencia. Segundo, el resultado de una visita de verificación a una procuraduría provincial en la que se encontraron expedientes sin movimiento durante más de un año, lo que podría constituir falta disciplinaria. Tercero, la notificación de una demanda de nulidad y restablecimiento del derecho presentada contra la Procuraduría por un exservidor que cuestiona su retiro del servicio.", "items": [{"id": "PG-125", "niv": 2, "e": "La elaboración del anteproyecto de presupuesto y del programa anual de caja, en coordinación con la División Financiera, corresponde a", "f": "Decreto Ley 262 de 2000, arts. 11 num. 4, 13 y 15", "o": [["A", "la Oficina de Planeación.", "El artículo 11, num. 4, del Decreto Ley 262 de 2000 asigna a la Oficina de Planeación elaborar, en coordinación con la División Financiera, el anteproyecto de presupuesto y el programa anual de caja.", true], ["B", "la Oficina Jurídica, que elabora los actos para el ordenador del gasto.", "La Oficina Jurídica proyecta actos para cumplir sentencias y conciliaciones y elabora contratos (art. 15), pero el anteproyecto de presupuesto lo elabora Planeación (art. 11, num. 4).", false], ["C", "la Oficina de Control Interno.", "Control Interno verifica la gestión y los estados financieros (art. 13 del Decreto Ley 262 de 2000), pero no elabora el anteproyecto de presupuesto.", false]]}, {"id": "PG-126", "niv": 2, "e": "Si la visita la realizó la Oficina de Control Interno y advierte posibles faltas disciplinarias, esa oficina debe", "f": "Decreto Ley 262 de 2000, art. 13 nums. 3, 4 y 8", "o": [["A", "abrir indagación previa contra los responsables, porque detectó directamente los hechos.", "La Oficina de Control Interno no tiene competencia disciplinaria; su función es remitir los informes a la dependencia competente (art. 13, num. 8, del Decreto Ley 262 de 2000).", false], ["B", "imponer un plan de mejoramiento y archivar el asunto si la procuraduría provincial lo cumple.", "Proponer correctivos es parte del control de gestión (art. 13, num. 3), pero no reemplaza el envío a la autoridad disciplinaria cuando hay posibles faltas (num. 8); Control Interno no puede archivar asuntos disciplinarios.", false], ["C", "remitir el informe de control de gestión, con sus soportes, a la dependencia competente.", "El artículo 13, num. 8, del Decreto Ley 262 de 2000 ordena a la Oficina de Control Interno enviar los informes de control de gestión, con sus soportes, a la dependencia competente cuando de ellos se concluya que hay posibles faltas disciplinarias.", true]]}, {"id": "PG-127", "niv": 1, "e": "La representación de la Procuraduría en el proceso de nulidad y restablecimiento del derecho promovido por el exservidor está a cargo de", "f": "Decreto Ley 262 de 2000, arts. 9, 10 y 15 num. 2", "o": [["A", "la Procuraduría Auxiliar para Asuntos Disciplinarios.", "Esta procuraduría auxiliar proyecta decisiones disciplinarias del Procurador y absuelve consultas en esa materia (art. 9), pero no representa judicialmente a la entidad.", false], ["B", "la Oficina Jurídica.", "El artículo 15, num. 2, del Decreto Ley 262 de 2000 asigna a la Oficina Jurídica representar a la Procuraduría en los procesos en que sea demandada o deba actuar como demandante.", true], ["C", "la Dirección Nacional de Investigaciones Especiales.", "Esta dirección adelanta investigaciones disciplinarias y actos de investigación complejos (art. 10); no representa a la entidad en procesos judiciales.", false]]}]}, {"comp": "estructura_pgn", "rol": "tecnico", "tag": "Estructura y funciones de la Procuraduría · Niveles técnico, administrativo y operativo · Ingreso y posesión en la PGN", "texto": "Usted es técnico de la coordinación administrativa de una procuraduría regional y apoya el trámite de vinculación de los elegibles de un concurso. Una elegible para un cargo de técnico en esa regional pregunta cómo se formaliza su ingreso a la entidad. Otro elegible, nombrado como profesional universitario en la misma sede, aceptó el nombramiento y pregunta de cuánto tiempo dispone para posesionarse, porque debe terminar un contrato en otra ciudad. Ambos quieren saber ante quién deben tomar posesión.", "items": [{"id": "PG-140", "niv": 1, "e": "Según el Decreto Ley 262 de 2000, el ingreso al servicio en la Procuraduría se efectúa por medio de", "f": "Decreto Ley 262 de 2000, arts. 81 y 217", "o": [["A", "decreto de nombramiento expedido por el Procurador General y la respectiva posesión.", "El artículo 81 del Decreto Ley 262 de 2000 dispone que el ingreso se efectúa por medio de decreto de nombramiento expedido por el Procurador General y la respectiva posesión.", true], ["B", "la publicación de la lista de elegibles, que por sí sola vincula al primero de la lista.", "La lista de elegibles no vincula por sí sola: debe expedirse el nombramiento dentro del término legal (art. 217) y luego producirse la posesión (art. 81).", false], ["C", "la firma de un contrato de trabajo con la Secretaría General.", "Los empleados de la Procuraduría se vinculan por nombramiento y posesión, no por contrato de trabajo (art. 81 del Decreto Ley 262 de 2000).", false]]}, {"id": "PG-141", "niv": 2, "e": "Al elegible que ya aceptó el nombramiento debe informársele que", "f": "Decreto Ley 262 de 2000, art. 84 y parágrafo", "o": [["A", "tiene ocho días para posesionarse, contados desde la comunicación del nombramiento, sin posibilidad de prórroga.", "Los ocho días son los plazos para comunicar y aceptar el nombramiento (art. 84); la posesión tiene un término de 15 días desde la aceptación, prorrogable.", false], ["B", "dispone de quince días desde la aceptación, prorrogables una vez hasta por treinta si lo pide a tiempo y con justa causa.", "El artículo 84 del Decreto Ley 262 de 2000 fija en 15 días, contados desde la aceptación, el término para la posesión, y su parágrafo permite prorrogarlo por una sola vez hasta por 30 días si la causa es justa y la solicitud se formula antes del vencimiento.", true], ["C", "puede posesionarse en cualquier momento mientras la lista de elegibles esté vigente, pues esa vigencia protege su derecho al empleo.", "La posesión tiene un término legal de 15 días desde la aceptación, con una sola prórroga posible (art. 84); la vigencia de la lista no amplía ese plazo.", false]]}, {"id": "PG-142", "niv": 2, "e": "Por tratarse de empleos de los niveles técnico y profesional en una procuraduría regional, la posesión de ambos elegibles la da", "f": "Decreto Ley 262 de 2000, arts. 7 num. 52, 75B num. 10 y 84 (modificados o adicionados por el Decreto Ley 1851 de 2021)", "o": [["A", "el Procurador General, en el nivel central.", "El Procurador da posesión al Viceprocurador, delegados, auxiliares, directores y Secretario General (art. 7, num. 52); a los empleados territoriales de los niveles profesional, técnico, administrativo y operativo la da el procurador regional (art. 75B, num. 10).", false], ["B", "el jefe de la División de Gestión Humana, que verifica los requisitos.", "El jefe de Gestión Humana verifica el cumplimiento de requisitos antes de la posesión (art. 84), pero no da la posesión a los empleados territoriales, función del procurador regional (art. 75B, num. 10).", false], ["C", "el procurador regional.", "El artículo 75B, num. 10, del Decreto Ley 262 de 2000, adicionado por el artículo 21 del Decreto Ley 1851 de 2021, asigna a los procuradores regionales dar posesión a los servidores del nivel territorial en empleos de los niveles profesional, técnico, administrativo y operativo.", true]]}]}, {"comp": "estructura_pgn", "rol": "general", "tag": "Estructura y funciones de la Procuraduría · Ley 2094 de 2021 y sentencia C-030 de 2023", "texto": "En un conversatorio organizado por una procuraduría regional, los asistentes discuten los efectos de la sentencia C-030 de 2023, que revisó la Ley 2094 de 2021. Se plantean tres situaciones: la naturaleza de las funciones disciplinarias de la Procuraduría; un fallo de la Procuraduría que destituye e inhabilita a un alcalde en ejercicio del cargo, y un fallo que suspende por tres meses a una secretaria de despacho departamental, que no es de elección popular.", "items": [{"id": "PG-146", "niv": 2, "e": "Según la sentencia C-030 de 2023, las funciones disciplinarias que ejerce la Procuraduría General de la Nación son de naturaleza", "f": "Corte Constitucional, sentencia C-030 de 2023 (Comunicado 04 del 16 de febrero de 2023); Ley 1952 de 2019, art. 2", "o": [["A", "mixta: jurisdiccional frente a servidores de elección popular y administrativa frente a los demás.", "La Corte no adoptó un régimen mixto: retiró el carácter jurisdiccional en todos los casos y precisó que la imposición definitiva de ciertas sanciones a servidores de elección popular corresponde al juez contencioso administrativo.", false], ["B", "jurisdiccional, como lo dispuso la Ley 2094 de 2021 para ajustarse a la Convención Americana.", "La Corte declaró inexequibles las expresiones «jurisdiccionales» y «jurisdiccional» de los artículos 1, 54, 73 y 74 de la Ley 2094 de 2021.", false], ["C", "administrativa, y no jurisdiccional.", "La sentencia C-030 de 2023 declaró exequibles de manera condicionada los artículos 13, 16 y 17 de la Ley 2094 de 2021, en el entendido de que las funciones disciplinarias de la PGN son de naturaleza administrativa y no jurisdiccional.", true]]}, {"id": "PG-147", "niv": 3, "e": "En el caso del fallo que destituye e inhabilita al alcalde, conforme a la sentencia C-030 de 2023", "f": "Corte Constitucional, sentencia C-030 de 2023, resolutivos segundo y cuarto; Ley 1952 de 2019, art. 2 (modificado por el art. 1 de la Ley 2094 de 2021)", "o": [["A", "el juez de lo contencioso administrativo revisa la decisión aunque el alcalde no la impugne, y mientras tanto la sanción no se ejecuta.", "El resolutivo cuarto de la C-030 de 2023 condicionó el artículo 54 de la Ley 2094 de 2021: la revisión opera solo frente a destitución, suspensión o inhabilidad de servidores de elección popular, por ministerio de la ley, automática e inmediatamente, y la ejecución se suspende durante el trámite judicial. Según la Circular 2A de 2023 de la PGN, la regla se aplica a servidores de elección popular sancionados con destitución, suspensión o inhabilidad.", true], ["B", "la sanción queda en firme y se ejecuta si el alcalde no interpone, dentro del término legal, el recurso extraordinario de revisión.", "La Corte condicionó el recurso de revisión para estos casos a que opere de manera automática, por ministerio de la ley; su trámite no depende de que el sancionado lo interponga.", false], ["C", "la sanción se ejecuta de inmediato, como cualquier acto administrativo, y el alcalde puede luego demandarla en nulidad y restablecimiento del derecho.", "Para los servidores de elección popular la ejecución queda suspendida mientras el juez decide la revisión (art. 1 de la Ley 2094 de 2021 y resolutivo cuarto de la C-030 de 2023).", false]]}, {"id": "PG-148", "niv": 3, "e": "En el caso de la secretaria de despacho departamental suspendida por la Procuraduría, es correcto afirmar que", "f": "Corte Constitucional, sentencia C-030 de 2023; Procuraduría General de la Nación, Circular 2A de 2023", "o": [["A", "la suspensión debe ser determinada por el juez contencioso administrativo, como en el caso del alcalde.", "La reserva judicial de la C-030 de 2023 se refiere a servidores de elección popular; la secretaria de despacho no lo es.", false], ["B", "no opera la revisión automática y la sanción, como acto administrativo, se controla mediante el medio de control de nulidad y restablecimiento del derecho.", "Según la C-030 de 2023, la revisión automática solo opera para sanciones de destitución, suspensión e inhabilidad a servidores de elección popular; en los demás eventos, las sanciones de la PGN son administrativas y se controlan por nulidad y restablecimiento del derecho (Circular 2A de 2023 de la PGN).", true], ["C", "se controla mediante el recurso extraordinario de revisión de la Ley 2094 de 2021, que opera de manera automática frente a toda suspensión.", "La C-030 de 2023 condicionó el artículo 54 de la Ley 2094 de 2021: la revisión automática solo opera frente a destitución, suspensión o inhabilidad de servidores de elección popular; la secretaria de despacho no lo es.", false]]}]}, {"comp": "estructura_pgn", "rol": "general", "tag": "Estructura y funciones de la Procuraduría · Ministerio Público en los municipios: personerías", "texto": "Usted es profesional de una procuraduría provincial y atiende a una delegación de un municipio de quinta categoría. Los visitantes preguntan cómo y por cuánto tiempo se elige al personero municipal, cuándo empieza y termina su periodo, y bajo la dirección de quién ejerce sus funciones de Ministerio Público. También quieren saber si el personero debe informar a la Procuraduría de las investigaciones disciplinarias que adelanta contra servidores de la alcaldía.", "items": [{"id": "PG-167", "niv": 1, "e": "Sobre la elección del personero, usted les explica que lo elige", "f": "Ley 136 de 1994, art. 170 (modificado por el art. 4 de la Ley 2422 de 2024)", "o": [["A", "el procurador provincial, previo concurso, para un periodo de tres años.", "La Procuraduría no elige personeros, y el periodo es de cuatro años (art. 170 de la Ley 136 de 1994).", false], ["B", "el concejo municipal, previo concurso público de méritos, para un periodo institucional de cuatro años.", "El artículo 170 de la Ley 136 de 1994, modificado por el artículo 4 de la Ley 2422 de 2024, dispone que los concejos eligen personeros para periodos institucionales de cuatro años, dentro de los diez primeros días de enero del año en que inicia su periodo constitucional, previo concurso público de méritos.", true], ["C", "el alcalde, de terna enviada por el concejo, para un periodo igual al suyo.", "El personero no lo designa el alcalde: lo elige el concejo previo concurso público de méritos (art. 170 de la Ley 136 de 1994, modificado por la Ley 2422 de 2024).", false]]}, {"id": "PG-168", "niv": 2, "e": "Según el texto vigente de la Ley 136 de 1994, el personero elegido inicia su periodo", "f": "Ley 136 de 1994, art. 170 inciso 2 (modificado por el art. 4 de la Ley 2422 de 2024)", "o": [["A", "el 1 de enero siguiente a su elección y lo termina el 31 de diciembre del cuarto año.", "El artículo 170 vigente fija el inicio el 1 de marzo siguiente a la elección y la terminación el último día de febrero del cuarto año.", false], ["B", "el mismo día de su elección, en enero, y lo termina en enero del cuarto año.", "La elección se hace en los primeros diez días de enero, pero el periodo inicia el 1 de marzo siguiente (art. 170 de la Ley 136 de 1994, modificado por la Ley 2422 de 2024).", false], ["C", "el 1 de marzo siguiente a su elección y lo concluye el último día de febrero del cuarto año.", "Así lo dispone el inciso 2 del artículo 170 de la Ley 136 de 1994, modificado por el artículo 4 de la Ley 2422 de 2024.", true]]}, {"id": "PG-169", "niv": 2, "e": "Sobre la dirección de las funciones del personero y el deber de informar sus investigaciones disciplinarias, lo correcto es que el personero", "f": "Ley 136 de 1994, art. 178 y num. 4; Constitución Política, art. 118", "o": [["A", "actúa bajo la dirección suprema del Procurador y debe informar sus investigaciones a los procuradores provinciales.", "El artículo 178 de la Ley 136 de 1994 dispone que el personero ejerce en el municipio, bajo la dirección suprema del Procurador General, las funciones del Ministerio Público, y su num. 4 indica que adelanta las investigaciones bajo la supervigilancia de los procuradores provinciales, a quienes debe informar.", true], ["B", "es autónomo frente a la Procuraduría y no tiene el deber de informarle sus investigaciones, porque fue elegido por el concejo municipal.", "La elección por el concejo no excluye la dirección suprema del Procurador ni el deber de informar a los procuradores provinciales (art. 178, num. 4, de la Ley 136 de 1994).", false], ["C", "ejerce sus funciones bajo la dirección del alcalde y solo informa al concejo.", "El personero no está bajo la dirección del alcalde; ejerce el Ministerio Público bajo la dirección suprema del Procurador General (art. 178 de la Ley 136 de 1994).", false]]}]}, {"comp": "gestion_publica", "rol": "general", "tag": "Gestión pública y funcionamiento del Estado · Estado social de derecho y fines del Estado", "texto": "Usted es profesional universitario de una procuraduría provincial con funciones preventivas y en marzo de 2027 revisa actuaciones de la alcaldía de un municipio de quinta categoría. Encuentra tres situaciones. Primera: un decreto municipal ordena a los inspectores de policía imponer las sanciones por ocupación de vías sin escuchar previamente a los afectados, lo que choca abiertamente con el debido proceso que garantiza el artículo 29 de la Constitución; un inspector pregunta si debe aplicarlo. Segunda: la secretaria de gobierno anuncia que el programa de ayudas para damnificados por inundaciones excluirá a las familias que llegaron hace poco de otro departamento, «porque la alcaldía solo responde por los nacidos aquí». Tercera: el alcalde sostiene que, gracias a la autonomía municipal, puede dejar de aplicar en su territorio una ley nacional de tránsito que considera inconveniente.", "items": [{"id": "GE-101", "niv": 1, "e": "Frente a la consulta del inspector sobre el decreto que suprime la posibilidad de ser escuchado, la regla constitucional aplicable indica que", "f": "Constitución Política, art. 4 (y art. 29)", "o": [["A", "el decreto debe aplicarse mientras un juez no lo anule, porque los actos administrativos se presumen legales.", "La presunción de legalidad no obliga a aplicar una norma abiertamente incompatible con la Constitución: el artículo 4 ordena preferir la norma constitucional, y esa regla vincula también a las autoridades administrativas.", false], ["B", "el inspector debe pedir al concejo municipal que inaplique el decreto, pues solo esa corporación puede dejar sin efectos los decretos del alcalde.", "Ninguna norma reserva al concejo la inaplicación de decretos del alcalde. La regla de preferencia constitucional del artículo 4 se aplica directamente por la autoridad que debe resolver el caso.", false], ["C", "debe darse prevalencia a la Constitución frente al decreto, por ser este incompatible con ella.", "El artículo 4 de la Constitución la define como norma de normas y ordena que, en todo caso de incompatibilidad entre ella y la ley u otra norma jurídica, se apliquen las disposiciones constitucionales (excepción de inconstitucionalidad). El decreto es abiertamente contrario al debido proceso.", true]]}, {"id": "GE-102", "niv": 1, "e": "Sobre la exclusión de las familias que llegaron de otro departamento, usted debe advertir a la secretaria que", "f": "Constitución Política, art. 2", "o": [["A", "la exclusión es válida por la autonomía territorial, que permite a cada municipio atender solo a su población nativa.", "La autonomía de las entidades territoriales se ejerce dentro de los límites de la Constitución y la ley (art. 287) y no autoriza a desconocer el deber de protección del artículo 2 ni el derecho a la igualdad.", false], ["B", "la exclusión es contraria a la Constitución, porque las autoridades deben proteger a todos los residentes en el país, vengan de donde vengan.", "El inciso 2 del artículo 2 de la Constitución señala que las autoridades están instituidas para proteger a todas las personas residentes en Colombia en su vida, honra, bienes, creencias y demás derechos y libertades. El lugar de nacimiento no es un criterio válido para excluir a damnificados.", true], ["C", "la exclusión es válida si se adopta por decreto, porque cada municipio fija los fines del Estado en su plan de desarrollo.", "Los fines esenciales del Estado están fijados en el artículo 2 de la Constitución y no los redefine un plan de desarrollo municipal; un decreto no puede restringir la protección que la Constitución ordena brindar a todas las personas residentes.", false]]}, {"id": "GE-103", "niv": 2, "e": "En relación con la postura del alcalde sobre la ley nacional de tránsito, lo correcto es señalar que", "f": "Constitución Política, arts. 1 y 287", "o": [["A", "la autonomía territorial se ejerce dentro de los límites de la Constitución y la ley, en una república unitaria.", "El artículo 1 de la Constitución define a Colombia como república unitaria, descentralizada, con autonomía de sus entidades territoriales, y el artículo 287 precisa que esa autonomía se ejerce dentro de los límites de la Constitución y la ley. El alcalde no puede dejar de aplicar una ley nacional.", true], ["B", "la autonomía territorial permite apartarse de una ley nacional mientras el gobernador no objete esa decisión.", "El gobernador no tiene facultad para autorizar el desconocimiento de leyes nacionales. La autonomía municipal se ejerce dentro de los límites de la Constitución y la ley (art. 287).", false], ["C", "la descentralización permite inaplicar una ley nacional en el municipio si el concejo lo aprueba mediante acuerdo.", "Un acuerdo municipal es jerárquicamente inferior a la ley y no puede dejarla sin efecto. Colombia es una república unitaria (art. 1), por lo que las leyes del Congreso rigen en todo el territorio.", false]]}]}, {"comp": "gestion_publica", "rol": "general", "tag": "Gestión pública y funcionamiento del Estado · Delegación de funciones", "texto": "Usted trabaja en la oficina jurídica de una gobernación. El gobernador quiere delegar en la secretaria general, empleada del nivel directivo, la decisión de las solicitudes de comisión de estudios de los servidores y la firma de las resoluciones que las conceden o niegan. Una vez conocida la propuesta, la secretaria general manifiesta que, por su carga de trabajo, subdelegará esa función en un profesional universitario del área de talento humano. Un servidor, cuya solicitud de comisión fue negada en una resolución firmada por la secretaria, pregunta quién responde si esa resolución resulta ilegal.", "items": [{"id": "GE-118", "niv": 1, "e": "Para que la delegación propuesta por el gobernador sea válida, se requiere que", "f": "Ley 489 de 1998, arts. 9 y 10", "o": [["A", "la asamblea departamental la autorice previamente para cada función que se pretenda delegar.", "La delegación administrativa se hace por acto del delegante conforme a la Constitución y la ley (arts. 209 y 211 de la Constitución y 9 de la Ley 489); no requiere autorización de la asamblea para cada función.", false], ["B", "conste en un acto escrito que determine la autoridad delegataria y las funciones o asuntos que se transfieren.", "El artículo 10 de la Ley 489 de 1998 exige que el acto de delegación sea siempre escrito y determine la autoridad delegataria y las funciones o asuntos específicos cuya atención y decisión se transfieren.", true], ["C", "se imparta como instrucción verbal del gobernador, que se formaliza por escrito solo si algún interesado lo solicita.", "La ley no admite la delegación verbal: el acto de delegación siempre debe ser escrito (art. 10 de la Ley 489).", false]]}, {"id": "GE-119", "niv": 2, "e": "La subdelegación que anuncia la secretaria general", "f": "Ley 489 de 1998, art. 11", "o": [["A", "es posible siempre que la secretaria informe al gobernador dentro de los tres días siguientes.", "Ninguna norma permite subdelegar con un simple aviso posterior; la prohibición del artículo 11, numeral 2, de la Ley 489 es expresa.", false], ["B", "es posible si el profesional pertenece al área que maneja las comisiones de estudio.", "La pertenencia al área no salva la prohibición: las funciones recibidas por delegación no se pueden transferir de nuevo (art. 11, num. 2, de la Ley 489).", false], ["C", "no es posible, porque la ley excluye de la delegación las funciones que se recibieron por delegación.", "El artículo 11, numeral 2, de la Ley 489 de 1998 prohíbe transferir mediante delegación las funciones, atribuciones y potestades recibidas en virtud de delegación.", true]]}, {"id": "GE-120", "niv": 3, "e": "En cuanto a la responsabilidad por la resolución firmada por la secretaria general, la regla aplicable es que", "f": "Constitución Política, art. 211; Ley 489 de 1998, art. 12", "o": [["A", "responde la secretaria delegataria, salvo que el gobernador reforme o revoque la resolución y reasuma así la responsabilidad.", "El artículo 211 de la Constitución establece que la delegación exime de responsabilidad al delegante, la cual corresponde exclusivamente al delegatario, cuyos actos o resoluciones puede siempre reformar o revocar aquel, reasumiendo la responsabilidad consiguiente. El artículo 12 de la Ley 489 lo desarrolla. La jurisprudencia constitucional precisa que el delegante conserva deberes de dirección y control cuyo incumplimiento le es imputable, pero la responsabilidad por el acto expedido corresponde a la delegataria.", true], ["B", "responden por partes iguales el gobernador y la secretaria general, porque la delegación es un acto conjunto de quien delega y de quien la recibe.", "La Constitución no prevé una responsabilidad compartida por partes iguales: la radica exclusivamente en el delegatario, salvo que el delegante reforme o revoque el acto y reasuma la responsabilidad (art. 211).", false], ["C", "responde el gobernador, porque la delegación no traslada la responsabilidad del delegante.", "Es al contrario: el artículo 211 de la Constitución dispone que la delegación exime de responsabilidad al delegante. Las reglas especiales de contratación sobre el deber de vigilancia no aplican a una resolución de comisión de estudios.", false]]}]}, {"comp": "gestion_publica", "rol": "tecnico", "tag": "Gestión pública y funcionamiento del Estado · Niveles técnico, administrativo y operativo · Ejecución presupuestal", "texto": "Usted es técnico del grupo de presupuesto de una entidad del orden nacional que hace parte del Presupuesto General de la Nación. Durante el año se presentan cuatro situaciones: el coordinador de compras quiere firmar un contrato de mantenimiento de vehículos y solicita los documentos presupuestales; una vez firmado el contrato, pregunta qué operación debe seguir; el 28 de diciembre queda un saldo de apropiación sin comprometer y un directivo propone firmar el 5 de enero un contrato con cargo a ese saldo; y un coordinador pide usar recursos de la apropiación para viáticos en la compra de muebles, sin trámite de modificación presupuestal.", "items": [{"id": "GE-134", "niv": 1, "e": "Antes de expedir el acto o firmar el contrato que afecta la apropiación, la entidad debe", "f": "Decreto 111 de 1996, art. 71", "o": [["A", "solicitar la inclusión del gasto en el programa anual mensualizado de caja de la vigencia siguiente.", "El PAC regula los pagos y no reemplaza la disponibilidad previa; además, el gasto debe atenderse con apropiaciones de la vigencia en curso.", false], ["B", "obtener el registro presupuestal antes de iniciar el proceso de selección del contratista.", "El registro presupuestal se hace sobre el compromiso ya adquirido (el contrato firmado), no antes del proceso de selección; lo previo es el certificado de disponibilidad (art. 71).", false], ["C", "contar con un certificado de disponibilidad presupuestal que garantice la existencia de apropiación suficiente.", "El artículo 71 del Decreto 111 de 1996 exige que todos los actos administrativos que afecten las apropiaciones presupuestales cuenten con certificados de disponibilidad previos que garanticen la existencia de apropiación suficiente para atender esos gastos.", true]]}, {"id": "GE-135", "niv": 2, "e": "Firmado el contrato, la operación presupuestal que perfecciona el compromiso y asegura que los recursos no se desvíen a otro fin es", "f": "Decreto 111 de 1996, art. 71", "o": [["A", "el registro presupuestal, en el que se indican el valor y el plazo de las prestaciones.", "El artículo 71 del Decreto 111 de 1996 dispone que los compromisos deben contar con registro presupuestal para que los recursos con él financiados no sean desviados a ningún otro fin, que en él se indican el valor y el plazo de las prestaciones y que es requisito de perfeccionamiento.", true], ["B", "la orden de pago, que se registra en la tesorería con la firma del contrato.", "La orden de pago corresponde a la etapa de pago, cuando el contratista ha cumplido; no es la operación que perfecciona el compromiso según el artículo 71.", false], ["C", "el certificado de disponibilidad presupuestal, que se expide una vez firmado el contrato.", "El certificado de disponibilidad es previo al compromiso, no posterior (art. 71); su función es garantizar que existe apropiación suficiente.", false]]}, {"id": "GE-136", "niv": 3, "e": "Frente a la propuesta de firmar el 5 de enero un contrato con cargo al saldo de la vigencia anterior, usted advierte que", "f": "Decreto 111 de 1996, arts. 14 y 89", "o": [["A", "es posible si el compromiso se incorpora como reserva presupuestal de la vigencia anterior antes del 31 de enero.", "Las reservas presupuestales se constituyen con compromisos legalmente contraídos que al 31 de diciembre no se hayan cumplido (art. 89); un contrato firmado en enero no es un compromiso de la vigencia anterior.", false], ["B", "no es posible, porque después del 31 de diciembre no se asumen compromisos con cargo a la vigencia cerrada.", "El principio de anualidad (art. 14 del Decreto 111 de 1996) establece que el año fiscal va del 1 de enero al 31 de diciembre, que después de esa fecha no pueden asumirse compromisos con cargo a las apropiaciones del año que se cierra y que los saldos no comprometidos caducan sin excepción.", true], ["C", "es posible siempre que el certificado de disponibilidad se haya expedido antes del 31 de diciembre.", "El certificado de disponibilidad no es un compromiso: si al 31 de diciembre no se había adquirido el compromiso, el saldo de apropiación caducó (art. 14).", false]]}, {"id": "GE-137", "niv": 3, "e": "Usar la apropiación de viáticos para comprar muebles, sin modificación presupuestal,", "f": "Decreto 111 de 1996, arts. 12, 15, 16 y 18", "o": [["A", "contraría el principio de especialización, porque las apropiaciones se ejecutan conforme al fin para el que se programaron.", "El artículo 18 del Decreto 111 de 1996 dispone que las apropiaciones deben referirse en cada órgano a su objeto y funciones y ejecutarse estrictamente conforme al fin para el cual fueron programadas.", true], ["B", "contraría el principio de unidad de caja, según el cual todas las rentas atienden la totalidad de los gastos.", "La unidad de caja permite atender con el recaudo de todas las rentas el pago de las apropiaciones autorizadas (art. 16); no autoriza cambiar la destinación de una apropiación, que es lo que aquí ocurre.", false], ["C", "es válido por el principio de universalidad, ya que ambos gastos están incluidos en el presupuesto.", "La universalidad exige que el presupuesto contenga todos los gastos (art. 15); que ambos rubros existan no permite trasladar recursos de uno a otro sin la modificación correspondiente.", false]]}]}, {"comp": "gestion_publica", "rol": "general", "tag": "Gestión pública y funcionamiento del Estado · Empleo público y carrera", "texto": "Usted es técnico de la Oficina de Selección y Carrera de la Procuraduría General de la Nación y atiende el chat de orientación a aspirantes. Recibe tres preguntas: una aspirante quiere saber si la carrera de la Procuraduría se rige por la Ley 909 de 2004 y la administra la Comisión Nacional del Servicio Civil; otro pregunta cuál es la regla general sobre la naturaleza de los empleos en las entidades del Estado; y un tercero cuenta que su hermana ganó un concurso para un empleo de carrera administrativa en la alcaldía de su municipio y quiere saber qué sigue después de su nombramiento.", "items": [{"id": "GE-141", "niv": 3, "e": "A la aspirante que pregunta por el régimen de carrera de la Procuraduría, usted le responde que", "f": "Ley 909 de 2004, art. 3, num. 2; Constitución Política, art. 130; Decreto Ley 262 de 2000", "o": [["A", "la carrera de la Procuraduría se rige íntegramente por la Ley 909 de 2004 y la administra la Comisión Nacional del Servicio Civil.", "La carrera de la Procuraduría es especial y de origen constitucional; la Ley 909 solo se le aplica de forma supletoria (art. 3, num. 2), y la CNSC no administra las carreras especiales (art. 130 de la Constitución).", false], ["B", "es una carrera especial con régimen propio, y la Ley 909 de 2004 se le aplica solo para llenar vacíos.", "El artículo 3, numeral 2, de la Ley 909 de 2004 dispone que sus normas se aplican con carácter supletorio, en caso de vacíos, a las carreras especiales, entre ellas la de la Procuraduría General de la Nación, cuyo régimen está en el Decreto Ley 262 de 2000.", true], ["C", "la Ley 909 de 2004 tampoco se le aplica cuando su régimen especial guarda silencio, porque los dos regímenes son excluyentes.", "La Ley 909 sí se aplica a la Procuraduría, aunque solo de forma supletoria, cuando hay vacíos en su normativa (art. 3, num. 2).", false]]}, {"id": "GE-142", "niv": 1, "e": "Sobre la naturaleza de los empleos en los órganos y entidades del Estado, la regla general es que", "f": "Constitución Política, art. 125", "o": [["A", "son de libre nombramiento y remoción, salvo aquellos que la ley declare expresamente como empleos de carrera.", "La Constitución consagra la regla contraria: la carrera es la regla general y el libre nombramiento y remoción, una excepción (art. 125).", false], ["B", "son de carrera solo los empleos de los niveles técnico y asistencial.", "El artículo 125 no limita la carrera a algunos niveles; hay empleos de carrera en todos los niveles, incluidos el profesional y el asesor.", false], ["C", "son de carrera, salvo excepciones como los de elección popular y los de libre nombramiento y remoción.", "El artículo 125 de la Constitución dispone que los empleos en los órganos y entidades del Estado son de carrera, y exceptúa los de elección popular, los de libre nombramiento y remoción, los de trabajadores oficiales y los demás que determine la ley.", true]]}, {"id": "GE-143", "niv": 2, "e": "Sobre la hermana que ganó el concurso en la alcaldía, usted explica que", "f": "Ley 909 de 2004, art. 31, num. 5", "o": [["A", "adquiere los derechos de carrera desde la posesión, y el período de prueba solo sirve para fijar su salario.", "Los derechos de carrera se adquieren al superar el período de prueba con evaluación satisfactoria, no con la posesión; el período de prueba no tiene que ver con la fijación del salario.", false], ["B", "será nombrada en período de prueba por un año, al cabo del cual queda inscrita automáticamente en carrera.", "El período de prueba es de seis meses y la inscripción depende de una evaluación satisfactoria; si no la obtiene, el nombramiento se declara insubsistente (art. 31, num. 5).", false], ["C", "será nombrada en período de prueba por seis meses y, si su evaluación es satisfactoria, adquirirá los derechos de carrera.", "El artículo 31, numeral 5, de la Ley 909 de 2004 dispone que quien sea seleccionado por concurso y no esté inscrito en carrera será nombrado en período de prueba por seis meses; si obtiene evaluación satisfactoria adquiere los derechos de carrera, que se declaran con la inscripción en el Registro Público.", true]]}]}, {"comp": "atencion_usuario", "rol": "general", "tag": "Atención al usuario · Ampliación del término y peticiones análogas", "texto": "En la Secretaría de Movilidad de un municipio se recibió una petición de interés particular cuya respuesta depende de un estudio técnico que tardará varias semanas. El jefe de la dependencia propone esperar a que venza el término legal y, al día siguiente, enviar al peticionario un oficio que explique la demora. En la misma semana, la secretaría recibe catorce peticiones casi idénticas de vecinos de un barrio, que piden información de interés común sobre el cronograma de una obra de semaforización.", "items": [{"id": "AU-113", "niv": 2, "e": "Para ampliar válidamente el término de la petición que requiere el estudio técnico, la secretaría debe", "f": "Ley 1755 de 2015, art. 1 (art. 14, parágrafo, de la Ley 1437 de 2011)", "o": [["A", "solicitar autorización a la personería municipal para prorrogar el término por una sola vez.", "La ley no exige autorización de la personería ni de ninguna otra autoridad: la ampliación la decide y comunica la misma entidad.", false], ["B", "informar al peticionario, antes de que venza el término, los motivos de la demora y el plazo razonable en que responderá.", "El parágrafo del artículo 14 del CPACA permite, de forma excepcional, ampliar el término si la autoridad informa al interesado antes del vencimiento los motivos de la demora y el plazo razonable de respuesta.", true], ["C", "enviar el oficio al día siguiente del vencimiento, como propone el jefe, porque la ley permite justificar la demora una vez ocurre.", "El parágrafo del artículo 14 del CPACA exige informar antes del vencimiento; un aviso posterior no evita el incumplimiento del término.", false]]}, {"id": "AU-114", "niv": 2, "e": "El plazo que la secretaría anuncie para responder esa petición no puede exceder", "f": "Ley 1755 de 2015, art. 1 (art. 14, parágrafo, de la Ley 1437 de 2011)", "o": [["A", "del doble del término inicialmente previsto para ese tipo de petición.", "El parágrafo del artículo 14 del CPACA dispone que el plazo razonable que se señale no podrá exceder del doble del inicialmente previsto.", true], ["B", "del triple del término inicialmente previsto, si el estudio técnico lo justifica.", "La ley fija un tope fijo, el doble del término inicial, y no permite superarlo por la complejidad del asunto.", false], ["C", "de un mes contado desde el vencimiento del término inicial.", "El plazo de un mes corresponde al que se da al peticionario para completar una petición incompleta (art. 17 del CPACA), no a la ampliación del término para responder.", false]]}, {"id": "AU-115", "niv": 3, "e": "Frente a las catorce peticiones sobre el cronograma de la obra, la secretaría puede", "f": "Ley 1755 de 2015, art. 1 (arts. 19 y 22 de la Ley 1437 de 2011)", "o": [["A", "emitir una sola respuesta para todos, difundirla en un diario de amplia circulación y en su sitio web, y dar copia a quien la pida.", "El inciso 2 del artículo 22 del CPACA permite dar una única respuesta cuando más de diez personas formulan peticiones análogas de información, de interés general o de consulta, con esas formas de publicación y entrega de copias.", true], ["B", "responder solo al primer peticionario y archivar las demás como peticiones reiterativas, porque quedan resueltas con esa respuesta.", "Las peticiones reiterativas del artículo 19 son las que presenta de nuevo quien ya obtuvo respuesta; aquí son personas distintas que no han recibido ninguna.", false], ["C", "acumularlas en un solo expediente y resolverlas dentro de los treinta días siguientes, por tratarse de una petición colectiva.", "La ley no crea un término de treinta días para peticiones colectivas; el de treinta días es para consultas y aquí se pide información.", false]]}]}, {"comp": "atencion_usuario", "rol": "general", "tag": "Atención al usuario · Deberes y prohibiciones de las autoridades en la atención al público", "texto": "La nueva directora administrativa de un instituto descentralizado del orden departamental propone tres medidas para reducir costos: atender al público de manera presencial solo cuatro horas al día, de lunes a viernes; a la hora de cierre, pedir a las personas que ya están dentro de la sede esperando turno que regresen al día siguiente; y exigir a quienes soliciten la renovación de un permiso una copia del permiso anterior, que el mismo instituto expidió y conserva en su archivo.", "items": [{"id": "AU-131", "niv": 1, "e": "La primera medida es contraria a la ley, porque las autoridades deben garantizar atención personal al público", "f": "Ley 1437 de 2011, art. 7, num. 2", "o": [["A", "durante toda la jornada laboral de sus servidores, todos los días hábiles.", "La ley fija un mínimo de cuarenta horas semanales distribuidas en horarios que satisfagan las necesidades del servicio; no exige que coincidan con toda la jornada laboral.", false], ["B", "como mínimo durante treinta y seis horas a la semana.", "El mínimo legal es de cuarenta horas semanales, no de treinta y seis.", false], ["C", "como mínimo durante cuarenta horas a la semana.", "El numeral 2 del artículo 7 del CPACA exige garantizar atención personal al público como mínimo durante cuarenta horas a la semana; la medida propuesta solo suma veinte.", true]]}, {"id": "AU-132", "niv": 1, "e": "La segunda medida desconoce el deber de", "f": "Ley 1437 de 2011, art. 7, num. 3", "o": [["A", "expedir y actualizar cada año la carta de trato digno al usuario.", "La carta de trato digno (art. 7, num. 5) es un deber distinto, que no se relaciona con la atención de quienes están dentro de la sede.", false], ["B", "atender a todas las personas que hayan ingresado a sus oficinas dentro del horario normal de atención.", "El numeral 3 del artículo 7 del CPACA obliga a atender a todas las personas que hubieran ingresado a las oficinas dentro del horario normal de atención.", true], ["C", "habilitar canales electrónicos para recibir peticiones por fuera del horario de atención.", "Los canales electrónicos son otro deber de la entidad, pero lo que la medida vulnera es la atención de quienes ya ingresaron en el horario.", false]]}, {"id": "AU-133", "niv": 1, "e": "Respecto de la tercera medida, es correcto afirmar que", "f": "Ley 1437 de 2011, art. 9, num. 4", "o": [["A", "es válida, porque el permiso anterior es un requisito del trámite y la carga de aportarlo es del usuario.", "El CPACA prohíbe exigir documentos que reposen en la entidad, aunque sean necesarios para el trámite: el instituto debe consultarlos en su propio archivo.", false], ["B", "es válida solo si el instituto entrega la copia sin costo en una ventanilla distinta.", "La gratuidad de la copia no corrige el problema: la prohibición recae sobre la exigencia misma del documento que ya tiene la entidad.", false], ["C", "está prohibida, porque el instituto no puede exigir documentos que reposan en la propia entidad.", "El numeral 4 del artículo 9 del CPACA prohíbe a las autoridades exigir constancias, certificaciones o documentos que reposen en la respectiva entidad.", true]]}]}, {"comp": "atencion_usuario", "rol": "general", "tag": "Atención al usuario · Peticiones entre autoridades", "texto": "El martes 17 de agosto de 2027, la Secretaría de Salud de un municipio recibió un oficio de la personería municipal, que adelanta una investigación disciplinaria contra un servidor de esa secretaría. La personería pide información sobre las auditorías realizadas en el primer semestre y copia de unos documentos que contienen datos de historias clínicas de pacientes, necesarios para la investigación. Ese mismo día, un ciudadano pidió a la secretaría la misma información sobre las auditorías. No hay festivos en ese periodo.", "items": [{"id": "AU-146", "niv": 3, "e": "El último día para que la secretaría responda la solicitud de la personería es el", "f": "Ley 1755 de 2015, art. 1 (art. 30 de la Ley 1437 de 2011); cálculo de días hábiles", "o": [["A", "viernes 27 de agosto de 2027.", "Resulta de contar diez días calendario; el término se cuenta en días hábiles.", false], ["B", "martes 31 de agosto de 2027.", "Cuando una autoridad pide información o documentos a otra, el término es de no más de diez días (art. 30 del CPACA): 18 a 20 de agosto (3), 23 a 27 (8), 30 y 31 (10).", true], ["C", "martes 7 de septiembre de 2027.", "Aplica el término general de quince días; entre autoridades rige el término especial de diez días.", false]]}, {"id": "AU-147", "niv": 3, "e": "Frente a los documentos con datos de historias clínicas que pide la personería, la secretaría debe", "f": "Ley 1755 de 2015, art. 1 (art. 27 de la Ley 1437 de 2011)", "o": [["A", "entregarlos, porque la reserva no se opone a la personería que los requiere para sus funciones.", "El artículo 27 del CPACA dispone que el carácter reservado no es oponible a las autoridades administrativas que, siendo competentes, piden la información para el debido ejercicio de sus funciones, y les impone asegurar la reserva.", true], ["B", "entregarlos únicamente si la personería obtiene antes una orden judicial.", "La ley no exige orden judicial a la autoridad administrativa competente; basta que pida la información para el ejercicio de sus funciones.", false], ["C", "negarlos, porque la historia clínica solo puede entregarse al paciente o a quien este autorice expresamente.", "Esa limitación opera frente a particulares; el artículo 27 del CPACA hace inoponible la reserva a las autoridades administrativas competentes que la piden para ejercer sus funciones.", false]]}, {"id": "AU-148", "niv": 1, "e": "La petición del ciudadano sobre las auditorías debe resolverse", "f": "Ley 1755 de 2015, art. 1 (arts. 14, num. 1, y 30 de la Ley 1437 de 2011)", "o": [["A", "dentro de los treinta días siguientes, porque se trata de información que requiere consolidación.", "El término de treinta días es para consultas; la necesidad de consolidar datos permite, a lo sumo, ampliar el término informándolo antes de su vencimiento.", false], ["B", "dentro de los diez días siguientes a su recepción, por ser una petición de información.", "El numeral 1 del artículo 14 del CPACA fija diez días para las peticiones de documentos y de información.", true], ["C", "dentro de los quince días siguientes, porque el término de diez días solo aplica a las peticiones entre autoridades.", "El término de diez días también aplica a los particulares que piden documentos o información (art. 14, num. 1); el artículo 30 lo prevé además para las peticiones entre autoridades.", false]]}]}, {"comp": "atencion_usuario", "rol": "tecnico", "tag": "Atención al usuario · Niveles técnico, administrativo y operativo · Consultas y reclamos sobre datos personales", "texto": "Usted es técnico administrativo de la Oficina de Atención al Ciudadano de una alcaldía, que es responsable de la base de datos de beneficiarios de sus programas sociales. El lunes 6 de septiembre de 2027 una beneficiaria presenta un reclamo completo en el que pide corregir su dirección y suprimir un número de teléfono que no es suyo. Dos semanas antes, la misma señora había acudido directamente a la Superintendencia de Industria y Comercio para quejarse por el mal manejo de sus datos, sin haber presentado antes ninguna solicitud a la alcaldía. No hay festivos en ese periodo.", "items": [{"id": "AU-152", "niv": 1, "e": "Una vez recibido el reclamo completo, la alcaldía debe incluir en la base de datos la leyenda «reclamo en trámite» y su motivo", "f": "Ley 1581 de 2012, art. 15, num. 2", "o": [["A", "solo si la beneficiaria lo pide expresamente en su escrito de reclamo.", "La inclusión de la leyenda es un deber legal del responsable una vez recibe el reclamo completo; no depende de que el titular la pida.", false], ["B", "dentro de los cinco días siguientes, y retirarla cuando venza el término para responder.", "El plazo de cinco días es para requerir al interesado cuando el reclamo está incompleto; además, la leyenda se mantiene hasta que el reclamo se decida, no hasta que venza el término.", false], ["C", "a más tardar dos días hábiles después, y conservarla mientras el reclamo no se resuelva.", "El numeral 2 del artículo 15 de la Ley 1581 de 2012 ordena incluir la leyenda «reclamo en trámite» y su motivo en no más de dos días hábiles y mantenerla hasta que se decida el reclamo.", true]]}, {"id": "AU-153", "niv": 3, "e": "Si no es necesario ampliar el término, el último día para atender el reclamo es el", "f": "Ley 1581 de 2012, art. 15, num. 3; cálculo de días hábiles", "o": [["A", "lunes 20 de septiembre de 2027.", "Resulta de aplicar el término de diez días hábiles, que corresponde a las consultas (art. 14), no a los reclamos.", false], ["B", "lunes 27 de septiembre de 2027.", "El reclamo se atiende en máximo quince días hábiles contados desde el día siguiente a su recibo: 7 a 10 de septiembre (4), 13 a 17 (9), 20 a 24 (14) y lunes 27 (15).", true], ["C", "jueves 7 de octubre de 2027.", "Suma los ocho días hábiles de ampliación, que solo proceden si se informa al interesado el motivo de la demora; el enunciado descarta la ampliación.", false]]}, {"id": "AU-154", "niv": 2, "e": "Sobre la queja que la beneficiaria presentó ante la Superintendencia de Industria y Comercio, es correcto afirmar que", "f": "Ley 1581 de 2012, arts. 16 y 19", "o": [["A", "solo podía presentarla después de agotar el trámite de consulta o reclamo ante la alcaldía.", "El artículo 16 de la Ley 1581 de 2012 establece como requisito de procedibilidad agotar el trámite de consulta o reclamo ante el responsable o el encargado del tratamiento antes de acudir a la Superintendencia.", true], ["B", "procedía directamente, porque la Superintendencia es la autoridad de protección de datos personales.", "La Superintendencia es la autoridad de protección de datos (art. 19), pero la ley exige agotar antes el trámite ante el responsable o encargado.", false], ["C", "debía presentarla ante la Procuraduría, que vigila el tratamiento de datos personales en las entidades públicas.", "La Ley 1581 de 2012 asigna la vigilancia del tratamiento de datos personales a la Superintendencia de Industria y Comercio, también frente a entidades públicas.", false]]}]}, {"comp": "atencion_usuario", "rol": "general", "tag": "Atención al usuario · Atención a usuarios alterados", "texto": "En la sala de atención de una procuraduría provincial, un ciudadano llega furioso porque, según él, lleva dos meses sin respuesta a una queja contra un funcionario de su municipio. Habla en voz alta, golpea el mostrador y dice que «nadie en esta entidad sirve para nada». Usted revisa el sistema y advierte que la respuesta se envió hace una semana a una dirección electrónica equivocada; en los últimos días, otros dos ciudadanos han reportado el mismo problema con las respuestas enviadas por correo electrónico. La entidad aplica los protocolos de servicio al ciudadano del DNP y de Función Pública.", "items": [{"id": "AU-161", "niv": 2, "e": "Mientras el ciudadano expresa su inconformidad, lo recomendable es", "f": "Departamento Nacional de Planeación, Protocolos de servicio al ciudadano (atención a personas alteradas)", "o": [["A", "dejar que se desahogue, escucharlo sin interrumpirlo y evitar calificar su estado de ánimo.", "Los Protocolos de servicio al ciudadano del DNP recomiendan dejar que el ciudadano se desahogue, escucharlo con atención sin interrumpirlo ni discutir, y evitar calificar su estado de ánimo.", true], ["B", "aclararle desde el inicio que usted no cometió el error, para que dirija su reclamo a la dependencia responsable.", "Los protocolos indican no tomar la situación como algo personal ni trasladar la responsabilidad: el ciudadano se queja del servicio de la entidad.", false], ["C", "pedirle de inmediato que se calme, porque no se le puede atender mientras esté alterado.", "Los protocolos de servicio recomiendan expresamente no pedirle al ciudadano que se calme ni calificar su estado de ánimo.", false]]}, {"id": "AU-162", "niv": 2, "e": "Si el ciudadano pasara a insultarlo a usted, el protocolo indica", "f": "Departamento Nacional de Planeación, Protocolos de servicio al ciudadano; Ley 1437 de 2011, art. 6, num. 4 y parágrafo", "o": [["A", "advertirle que su queja será rechazada por irrespetuosa si no cambia de actitud.", "La conducta del ciudadano en la sala no convierte en irrespetuosa su queja ya presentada, y la administración no puede usar ese incumplimiento para desconocer su derecho (art. 6, parágrafo, del CPACA).", false], ["B", "suspender la atención y retirarse del puesto hasta que el ciudadano se calme o abandone la sede de la procuraduría.", "Abandonar el puesto deja al ciudadano sin atención; el protocolo prevé exigir respeto y, si persiste, acudir al superior.", false], ["C", "exigirle respeto de manera cortés y, si persiste, llamar al superior para que asuma el manejo de la situación.", "Los Protocolos de servicio al ciudadano del DNP indican que, si un usuario es grosero o violento, se le exige respeto de manera cortés y, si persiste, se llama al supervisor para cederle el manejo de la situación.", true]]}, {"id": "AU-163", "niv": 1, "e": "Como el mismo problema ya afectó a otros ciudadanos, usted debe", "f": "Departamento Nacional de Planeación, Protocolos de servicio al ciudadano (atención a personas alteradas)", "o": [["A", "resolver cada caso por separado sin reportarlo, porque se trata de errores aislados.", "Tres casos con la misma causa indican una falla del proceso; tratarlos por separado impide corregirla.", false], ["B", "informar al jefe inmediato para que se dé una solución de fondo al problema.", "Los Protocolos de servicio al ciudadano del DNP recomiendan que, si el mismo problema ocurre con otro ciudadano, se informe al jefe inmediato para dar una solución de fondo.", true], ["C", "recomendar a los ciudadanos que en adelante pidan las respuestas solo por correo físico.", "Trasladar al ciudadano la carga de una falla interna no la soluciona; además, la entidad debe mantener los medios electrónicos de atención (art. 7, num. 8, del CPACA).", false]]}]}, {"comp": "gestion_documental", "rol": "general", "tag": "Gestión documental · Ciclo vital y clases de archivo", "texto": "Usted es auxiliar administrativo de una procuraduría provincial. La secretaría tiene en sus estantes tres grupos de carpetas: los expedientes de las actuaciones que se tramitan este año y que los profesionales consultan a diario; los expedientes cerrados en 2019, que la tabla de retención documental (TRD) señala como de conservación total y que ya cumplieron su tiempo en el archivo central; y unas cajas de expedientes cerrados en 2023, de consulta ocasional, que ya cumplieron su tiempo en el archivo de gestión. Un compañero nuevo opina que todo eso «es asunto del archivo central» y que la secretaría no tiene por qué ocuparse del cuidado de los documentos.", "items": [{"id": "GD-101", "niv": 1, "e": "Los expedientes de las actuaciones en trámite que los profesionales consultan a diario conforman", "f": "Ley 594 de 2000, arts. 3 y 23", "o": [["A", "el archivo central de la entidad, porque son documentos con plena vigencia jurídica.", "Al archivo central llegan los documentos transferidos por los archivos de gestión, cuya consulta ya no es frecuente aunque sigan vigentes (art. 23, lit. b, Ley 594 de 2000). Los expedientes en trámite permanecen en la oficina productora.", false], ["B", "un archivo de apoyo de la secretaría, distinto de los documentos de archivo.", "Los expedientes de las actuaciones son documentos de archivo producidos en ejercicio de funciones (art. 3, Ley 594 de 2000) y recorren el ciclo vital desde la fase de gestión; no son documentos de apoyo.", false], ["C", "el archivo de gestión de la dependencia, porque están en trámite y se consultan con frecuencia.", "El artículo 23 de la Ley 594 de 2000 define el archivo de gestión como la documentación sometida a continua utilización y consulta administrativa por la oficina productora, cuyo trámite se adelanta para resolver los asuntos iniciados.", true]]}, {"id": "GD-102", "niv": 2, "e": "Los expedientes cerrados en 2019, de conservación total según la TRD y con el tiempo cumplido en el archivo central, deben", "f": "Ley 594 de 2000, art. 23; Decreto 1080 de 2015, glosario (transferencia documental); Acuerdo 001 de 2024 del AGN, art. 4.4.4", "o": [["A", "pasar al archivo histórico mediante una transferencia secundaria.", "El archivo histórico recibe del archivo central los documentos de conservación permanente (art. 23, lit. c, Ley 594 de 2000). La entrega del archivo central al histórico es la transferencia secundaria (glosario del Decreto 1080 de 2015; art. 4.4.4 del Acuerdo 001 de 2024 del AGN).", true], ["B", "permanecer en el archivo central de forma indefinida, porque allí se conservan los documentos vigentes.", "El archivo central guarda los documentos mientras cumplen el tiempo de retención fijado en la TRD; vencido ese tiempo, los de conservación permanente pasan al archivo histórico (art. 23, Ley 594 de 2000).", false], ["C", "devolverse al archivo de gestión de la secretaría para su custodia definitiva.", "El ciclo vital avanza del archivo de gestión al central y de este al histórico; no se devuelven expedientes cerrados a la oficina productora para su custodia permanente (art. 23, Ley 594 de 2000).", false]]}, {"id": "GD-103", "niv": 2, "e": "La opinión del compañero sobre el cuidado de los documentos es equivocada, porque la Ley General de Archivos establece que", "f": "Ley 594 de 2000, art. 4, lit. d; Decreto 1080 de 2015, art. 2.8.2.5.3", "o": [["A", "solo los secretarios generales responden por los archivos, de modo que la secretaría de la provincial actúa por delegación.", "El artículo 16 de la Ley 594 de 2000 asigna a los secretarios generales responsabilidades sobre los archivos, pero no excluye a los demás servidores; el artículo 4, literal d, hace responsables a todos los servidores públicos del manejo de los documentos.", false], ["B", "los servidores públicos son responsables de la organización, conservación, uso y manejo de los documentos.", "Es el principio de responsabilidad del artículo 4, literal d, de la Ley 594 de 2000. Además, el artículo 2.8.2.5.3 del Decreto 1080 de 2015 extiende la responsabilidad de aplicar las normas archivísticas a servidores y contratistas.", true], ["C", "el cuidado de los documentos corresponde a los usuarios que los consultan y no a quienes los producen.", "La ley hace responsables a los servidores públicos de la organización y conservación de los documentos; a los particulares solo los hace responsables por el uso que hagan de ellos (art. 4, lit. d, Ley 594 de 2000).", false]]}]}, {"comp": "gestion_documental", "rol": "general", "tag": "Gestión documental · Tiempos de retención y transferencias primarias", "texto": "La secretaría de una procuraduría provincial prepara su plan de transferencias. Entre sus expedientes está uno de la subserie «Derechos de petición», que se abrió el 15 de agosto de 2021 con la petición de un ciudadano. La respuesta de fondo se dio y el trámite terminó; el expediente se cerró el 10 de noviembre de 2023. La tabla de retención documental (TRD) vigente asigna a esa subserie dos años en el archivo de gestión y ocho en el archivo central. Un compañero propone «mandar las cajas al archivo central con una nota» y, más adelante, agregar al expediente una carta de agradecimiento que el ciudadano envió después de la transferencia.", "items": [{"id": "GD-122", "niv": 2, "e": "Según la TRD, el tiempo de retención de ese expediente en el archivo de gestión se cumple el", "f": "Acuerdo 001 de 2024 del AGN, art. 4.3.1.9", "o": [["A", "15 de agosto de 2023.", "Esta fecha cuenta los dos años desde la apertura del expediente; los tiempos de retención empiezan a contarse una vez cerrada la unidad documental (art. 4.3.1.9 del Acuerdo 001 de 2024 del AGN).", false], ["B", "10 de noviembre de 2025.", "El art. 4.3.1.9 del Acuerdo 001 de 2024 del AGN dispone que, cerrada la unidad documental, empiezan a contarse los tiempos de retención de la TRD: dos años desde el cierre del 10 de noviembre de 2023 llevan al 10 de noviembre de 2025.", true], ["C", "10 de noviembre de 2033.", "Esta fecha suma los dos años de gestión y los ocho del archivo central; corresponde al final de la retención total, no al de la etapa en el archivo de gestión.", false]]}, {"id": "GD-123", "niv": 2, "e": "Para hacer la transferencia primaria de esa subserie al archivo central, la secretaría debe", "f": "Acuerdo 001 de 2024 del AGN, arts. 4.3.1.6 y 4.4.3", "o": [["A", "enviar las cajas con un oficio remisorio que indique cuántas carpetas van, porque el archivo central es quien elabora la descripción al recibirlas.", "Desde la fase de gestión las oficinas productoras deben elaborar los inventarios documentales (art. 4.3.1.6, par. 1, del Acuerdo 001 de 2024 del AGN), y la entrega al archivo central se soporta con ellos y con acta (art. 4.4.3, par. 4).", false], ["B", "esperar a que el archivo central solicite cada expediente cuando lo necesite un usuario.", "Las transferencias primarias se programan en un plan anual, de conformidad con los tiempos de retención de la TRD (art. 4.4.3 del Acuerdo 001 de 2024 del AGN); no dependen de solicitudes de consulta.", false], ["C", "entregarla por series, con el inventario documental, la hoja de control firmada y un acta de entrega firmada por quienes intervienen.", "El art. 4.4.3 del Acuerdo 001 de 2024 del AGN exige transferir por series y subseries (par. 1), con la hoja de control o índice electrónico firmado (par. 2), soportada en inventarios documentales y con un acta de entrega firmada por las partes intervinientes (par. 4).", true]]}, {"id": "GD-124", "niv": 2, "e": "Sobre la propuesta de agregar la carta de agradecimiento al expediente ya transferido, es acertado afirmar que", "f": "Acuerdo 001 de 2024 del AGN, art. 4.4.2, par.", "o": [["A", "no procede, porque una vez recibida la transferencia no se deben incorporar nuevos documentos al expediente.", "El parágrafo del art. 4.4.2 del Acuerdo 001 de 2024 del AGN establece que, una vez recibida la transferencia documental, no se deben incorporar nuevos documentos a los expedientes.", true], ["B", "procede solo si la carta llega dentro del primer año siguiente a la transferencia.", "La norma no fija un plazo de gracia: una vez recibida la transferencia no se deben incorporar nuevos documentos a los expedientes (art. 4.4.2, par., del Acuerdo 001 de 2024 del AGN).", false], ["C", "procede si el archivo central refolia el expediente y actualiza la hoja de control.", "La refoliación no habilita agregar documentos a un expediente transferido; el parágrafo del art. 4.4.2 del Acuerdo 001 de 2024 del AGN lo impide.", false]]}]}, {"comp": "gestion_documental", "rol": "tecnico", "tag": "Gestión documental · Niveles técnico, administrativo y operativo · Hoja de control y rotulación de unidades de conservación", "texto": "Usted es técnico del archivo de gestión de la secretaría de una procuraduría provincial. Debe organizar los expedientes de las actuaciones disciplinarias terminadas el año anterior. Cada expediente reúne, en orden de producción, la queja, los autos, las comunicaciones, las pruebas y la decisión final, y algunos ocupan dos carpetas. También hay carpetas de unidades documentales simples, como los consecutivos de comunicaciones. Su jefe le pide revisar las hojas de control, porque en una auditoría interna se encontró que algunas estaban al final de la carpeta y numeradas como un folio más, y completar los rótulos de las carpetas antes de la transferencia.", "items": [{"id": "GD-125", "niv": 1, "e": "La hoja de control debe diligenciarse para", "f": "Acuerdo 001 de 2024 del AGN, arts. 4.3.1.6 y 4.3.1.8", "o": [["A", "todas las carpetas del archivo de gestión, incluidas las de unidades documentales simples como los consecutivos.", "La norma reserva la hoja de control a las unidades documentales complejas; para las simples, los controles de descripción se fijan en el Programa de Gestión Documental (art. 4.3.1.8, num. 5, del Acuerdo 001 de 2024 del AGN).", false], ["B", "solo los expedientes que se transferirán al archivo histórico.", "La hoja de control se diligencia desde la fase de gestión (art. 4.3.1.6, par. 1, del Acuerdo 001 de 2024 del AGN) y acompaña la transferencia primaria (art. 4.4.3, par. 2); no se limita a la transferencia secundaria.", false], ["C", "las unidades documentales complejas, como los expedientes de las actuaciones disciplinarias.", "El art. 4.3.1.8, num. 5, del Acuerdo 001 de 2024 del AGN señala que la hoja de control se diligencia para las unidades documentales complejas; para las simples, el PGD establece los controles de descripción.", true]]}, {"id": "GD-126", "niv": 2, "e": "Para corregir lo encontrado en la auditoría, la hoja de control de cada expediente debe", "f": "Acuerdo 001 de 2024 del AGN, art. 4.3.1.8, num. 5", "o": [["A", "ubicarse al inicio de la unidad de conservación, sin foliarse, y firmarse al cierre del expediente.", "El art. 4.3.1.8, num. 5, del Acuerdo 001 de 2024 del AGN dispone que la hoja de control se ubica al inicio de cada unidad de conservación, no se folia y se firma al cierre del expediente.", true], ["B", "quedar al final de la carpeta, numerarse como último folio y firmarse cuando se abre el expediente.", "La hoja de control se ubica al inicio de la unidad de conservación, no se folia y se firma al cierre del expediente (art. 4.3.1.8, num. 5, del Acuerdo 001 de 2024 del AGN).", false], ["C", "ubicarse al inicio de la carpeta, numerarse como folio 1 y firmarse cada vez que se agrega un documento al expediente.", "Aunque la ubicación al inicio es correcta, la hoja de control no se debe foliar y se firma al cierre del expediente, no con cada documento (art. 4.3.1.8, num. 5, del Acuerdo 001 de 2024 del AGN).", false]]}, {"id": "GD-127", "niv": 2, "e": "Entre los datos que deben aparecer en el rótulo de cada carpeta está", "f": "Acuerdo 001 de 2024 del AGN, art. 4.3.1.8, num. 6", "o": [["A", "un resumen de la decisión adoptada en la actuación.", "El rótulo sirve para ubicar y recuperar la unidad de conservación; el contenido de la decisión está en el propio expediente y no figura entre los datos de identificación del art. 4.3.1.8, num. 6, del Acuerdo 001 de 2024 del AGN.", false], ["B", "el número de folios y las fechas extremas del expediente.", "El art. 4.3.1.8, num. 6, del Acuerdo 001 de 2024 del AGN incluye en la identificación de las unidades de conservación el número de folios y las fechas extremas, junto con fondo, sección, subsección, código y nombre de la serie y subserie, nombre y número del expediente, y número de caja y carpeta.", true], ["C", "el nombre del servidor que tramitó la actuación y su número de documento de identidad.", "La identificación de las unidades de conservación no incluye datos del servidor que tramitó el asunto; comprende fondo, sección, subsección, serie y subserie, datos del expediente, folios, fechas extremas, caja y carpeta (art. 4.3.1.8, num. 6, del Acuerdo 001 de 2024 del AGN).", false]]}]}, {"comp": "gestion_documental", "rol": "general", "tag": "Gestión documental · Documento de archivo, acceso y salida de documentos (Ley 594 de 2000)", "texto": "En el ar
