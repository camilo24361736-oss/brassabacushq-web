l.", "La regla de inscripción tiene excepciones expresas, entre ellas la contratación directa (art. 6, inc. 2, Ley 1150).", false]]}, {"id": "CE-141", "niv": 1, "e": "La información sobre las multas impuestas debe enviarse a la cámara de comercio", "f": "Ley 1150 de 2007, art. 6, num. 6.2; Decreto 1082 de 2015, art. 2.2.1.1.1.5.7", "o": [["A", "mensualmente, con copia de los actos administrativos en firme que las impusieron.", "El numeral 6.2 del artículo 6 de la Ley 1150 ordena a las entidades enviar mensualmente a la cámara de comercio la información sobre contratos, multas y sanciones, y el artículo 2.2.1.1.1.5.7 del Decreto 1082 de 2015 precisa que se remite copia de los actos administrativos en firme.", true], ["B", "cuando el contratista sancionado solicite la renovación de su inscripción en el RUP.", "El reporte es un deber periódico de la entidad, que no depende de los trámites del contratista ante la cámara (art. 6, num. 6.2, Ley 1150).", false], ["C", "una vez al año, junto con el informe de gestión contractual que se rinde a los organismos de control.", "La periodicidad legal es mensual (art. 6, num. 6.2, Ley 1150; Decreto 1082, art. 2.2.1.1.1.5.7).", false]]}]}, {"comp": "contratacion", "rol": "general", "tag": "Contratación estatal · Multas, cláusula penal y caducidad", "texto": "Usted es profesional de la oficina jurídica de una alcaldía. En un contrato de obra con multas y cláusula penal pactadas, el supervisor informó atrasos reiterados; el contratista terminó entregando la obra a satisfacción con tres meses de retraso y el plazo contractual ya venció. Aun así, el secretario de Infraestructura quiere imponerle ahora multas por el retraso. En otro contrato de obra, el contratista abandonó los trabajos, lo que afecta de manera grave y directa la ejecución y evidencia que puede conducir a su paralización.", "items": [{"id": "CE-161", "niv": 3, "e": "Sobre la intención de imponer multas al contratista que ya entregó la obra y cuyo plazo venció, lo correcto es que", "f": "Ley 1150 de 2007, art. 17", "o": [["A", "procede, porque las multas pactadas pueden imponerse en cualquier momento antes de la liquidación del contrato.", "La ley limita la imposición de multas al tiempo en que está pendiente la ejecución de las obligaciones (art. 17, Ley 1150), no hasta la liquidación.", false], ["B", "procede, siempre que la alcaldía las descuente del saldo a favor del contratista en el acta de liquidación.", "La forma de hacer efectiva la multa (compensación, garantía, cobro coactivo) no suple el requisito de que esté pendiente la ejecución cuando se impone (art. 17, Ley 1150).", false], ["C", "no es posible, porque las multas buscan conminar al cumplimiento y la obligación ya no está pendiente.", "El artículo 17 de la Ley 1150 de 2007 faculta a las entidades para imponer las multas pactadas con el objeto de conminar al contratista a cumplir, previa audiencia del afectado, y dispone expresamente que la decisión «procede sólo mientras se halle pendiente la ejecución de las obligaciones a cargo del contratista». Si ya cumplió, la multa pierde su finalidad conminatoria; la regla está en el texto de la ley, no solo en la jurisprudencia.", true]]}, {"id": "CE-162", "niv": 1, "e": "Para imponer multas o declarar el incumplimiento, la alcaldía debe citar al contratista a audiencia y, contra la decisión que se adopte en ella,", "f": "Ley 1474 de 2011, art. 86", "o": [["A", "proceden los recursos de reposición y apelación, que pueden interponerse dentro de los diez días siguientes.", "El procedimiento del artículo 86 de la Ley 1474 prevé únicamente la reposición, resuelta en la misma audiencia; no contempla la apelación ni un término posterior.", false], ["B", "procede el recurso de reposición, que se interpone, sustenta y decide en la misma audiencia.", "El literal c) del artículo 86 de la Ley 1474 de 2011 dispone que la decisión se adopta mediante resolución motivada que se entiende notificada en la audiencia, y que contra ella solo procede el recurso de reposición, que se interpone, sustenta y decide en la misma audiencia.", true], ["C", "no procede ningún recurso, porque la decisión se entiende notificada en estrados a todos los asistentes.", "Que la decisión se notifique en la audiencia no impide recurrirla: la ley concede el recurso de reposición (art. 86, lit. c, Ley 1474).", false]]}, {"id": "CE-163", "niv": 1, "e": "En el contrato abandonado, si la alcaldía declara la caducidad,", "f": "Ley 80 de 1993, arts. 8, num. 1, lit. c) y 18", "o": [["A", "lo dará por terminado y ordenará liquidarlo, sin indemnización alguna para el contratista.", "El artículo 18 de la Ley 80 dispone que la entidad, mediante acto motivado, da por terminado el contrato y ordena su liquidación en el estado en que se encuentre; no hay lugar a indemnización para el contratista, que queda sujeto a las sanciones e inhabilidades legales, y la declaratoria es constitutiva del siniestro de incumplimiento.", true], ["B", "deberá reconocer al contratista las utilidades dejadas de percibir por la terminación anticipada del contrato.", "La ley excluye cualquier indemnización al contratista cuando se declara la caducidad (art. 18, Ley 80).", false], ["C", "el contrato quedará suspendido hasta que el contratista reanude las obras dentro del plazo que fije la alcaldía.", "La caducidad termina el contrato y ordena su liquidación; no es una suspensión. Si la entidad decide no declararla, adopta medidas de control e intervención (art. 18, Ley 80).", false]]}]}, {"comp": "anticorrupcion", "rol": "general", "tag": "Estatuto Anticorrupción y transparencia · Supervisión e interventoría de contratos", "texto": "Una alcaldía celebró dos contratos. El primero es de suministro de papelería por valor moderado. El segundo es de obra para construir un puente vehicular, cuyo seguimiento exige conocimientos especializados en ingeniería estructural. La secretaria general debe decidir cómo se hará la vigilancia de cada contrato y si, para el puente, la entidad puede encargar a un interventor externo las actividades técnicas y dejar en cabeza de un servidor de planta el seguimiento administrativo y financiero. El supervisor de la papelería, por su parte, nota retrasos en las entregas y se pregunta qué puede hacer.", "items": [{"id": "AC-110", "niv": 1, "e": "La vigilancia del contrato de obra del puente puede contratarse con un interventor externo porque", "f": "Ley 1474 de 2011, art. 83", "o": [["A", "la ley prohíbe que los servidores públicos supervisen contratos de obra, cualquiera que sea su valor.", "La ley no prohíbe la supervisión de contratos de obra por servidores públicos; la interventoría se justifica cuando el seguimiento requiere conocimiento especializado o la complejidad o extensión del contrato lo amerita.", false], ["B", "la ley reserva la supervisión a los contratos de bienes y servicios, de modo que las obras requieren interventor.", "La supervisión es la regla cuando no se requieren conocimientos especializados, y la ejerce la propia entidad; la interventoría procede en los supuestos que la ley señala.", false], ["C", "el seguimiento del contrato requiere conocimiento especializado en la materia.", "El artículo 83 de la Ley 1474 de 2011 define la interventoría como el seguimiento técnico que realiza una persona natural o jurídica contratada para tal fin, cuando el seguimiento del contrato suponga conocimiento especializado en la materia o cuando la complejidad o la extensión del mismo lo justifiquen.", true]]}, {"id": "AC-111", "niv": 3, "e": "Sobre la posibilidad de combinar interventoría y supervisión en el contrato del puente, es correcto afirmar que", "f": "Ley 1474 de 2011, art. 83", "o": [["A", "es obligatoria, porque todo contrato de obra debe tener simultáneamente un supervisor y un interventor con las mismas funciones.", "La ley no impone la concurrencia de supervisor e interventor con las mismas funciones; la regla general es la contraria, salvo que la entidad divida la vigilancia.", false], ["B", "es posible, porque la entidad puede dividir la vigilancia: el interventor asume las actividades técnicas y la entidad las demás, por medio del supervisor.", "El artículo 83 de la Ley 1474 de 2011 establece que, por regla general, la supervisión y la interventoría no concurren en un mismo contrato, pero la entidad puede dividir la vigilancia: en el contrato de interventoría se indican las actividades técnicas a cargo del interventor, y las demás quedan a cargo de la entidad a través del supervisor.", true], ["C", "está prohibida, porque la ley impide que supervisor e interventor vigilen un mismo contrato, aunque sea en aspectos distintos.", "La no concurrencia es la regla general, pero la misma norma permite dividir la vigilancia del contrato principal entre interventor y supervisor.", false]]}, {"id": "AC-112", "niv": 1, "e": "Ante los retrasos en las entregas de papelería, el supervisor", "f": "Ley 1474 de 2011, art. 84", "o": [["A", "puede pedir al contratista informes y explicaciones, y debe informar a la entidad los hechos que pongan en riesgo el cumplimiento.", "El artículo 84 de la Ley 1474 de 2011 faculta a supervisores e interventores para solicitar informes, aclaraciones y explicaciones sobre la ejecución, y les impone el deber de mantener informada a la entidad de los hechos que puedan constituir actos de corrupción o que pongan o puedan poner en riesgo el cumplimiento del contrato.", true], ["B", "debe esperar a la liquidación del contrato para dejar constancia de los incumplimientos en el acta final, y solo entonces informar a la entidad.", "La ley exige informar oportunamente los hechos que puedan poner en riesgo el cumplimiento, no esperar a la liquidación.", false], ["C", "solo puede comunicarse con el contratista a través de la oficina jurídica de la entidad.", "La ley faculta al supervisor para solicitar directamente al contratista informes, aclaraciones y explicaciones sobre el desarrollo de la ejecución.", false]]}]}, {"comp": "anticorrupcion", "rol": "general", "tag": "Estatuto Anticorrupción y transparencia · Trámite de impedimentos de autoridades territoriales", "texto": "El alcalde de un municipio debe resolver una solicitud de licencia de funcionamiento presentada por una empresa de la que su cónyuge es socia mayoritaria. El alcalde reconoce la causal de impedimento, pero no sabe a quién debe remitir la actuación, pues no tiene superior jerárquico dentro de la administración municipal. Además, un ciudadano que conoce la situación anuncia que, si el alcalde no se aparta del asunto, presentará una recusación en su contra. El secretario jurídico prepara un memorando sobre el trámite.", "items": [{"id": "AC-129", "niv": 3, "e": "Como el alcalde no tiene superior ni cabeza de sector a quien remitir la actuación, debe enviarla", "f": "Ley 1437 de 2011 (CPACA), art. 12", "o": [["A", "al concejo municipal, que decide en plenaria si acepta el impedimento.", "El artículo 12 del CPACA no asigna esta decisión al concejo municipal; prevé un orden de autoridades que termina en el Ministerio Público.", false], ["B", "al gobernador del departamento, por ser el superior administrativo de los alcaldes.", "El artículo 12 del CPACA no remite al gobernador: a falta de superior y de cabeza de sector, la decisión corresponde al Ministerio Público.", false], ["C", "al procurador regional, por tratarse de una autoridad territorial.", "El artículo 12 del CPACA dispone que, a falta de superior y de cabeza del sector administrativo, la actuación se remite al Procurador General de la Nación si se trata de autoridades nacionales o del alcalde mayor del Distrito Capital, o al procurador regional en el caso de las autoridades territoriales.", true]]}, {"id": "AC-130", "niv": 2, "e": "Recibida la actuación, la autoridad competente debe decidir sobre el impedimento", "f": "Ley 1437 de 2011 (CPACA), art. 12", "o": [["A", "dentro de los diez días siguientes a su recibo y, si lo acepta, señalar quién conoce del asunto, incluso un funcionario ad hoc.", "El artículo 12 del CPACA establece que la autoridad competente decide de plano dentro de los diez días siguientes al recibo y que, si acepta el impedimento, determina a quién corresponde el conocimiento del asunto y puede, si es preciso, designar un funcionario ad hoc.", true], ["B", "dentro de los treinta días siguientes a su recibo, después de practicar pruebas y escuchar en audiencia al alcalde y a la empresa.", "La ley ordena decidir de plano y dentro de un término corto, sin un periodo probatorio ni una audiencia como los que plantea esta opción.", false], ["C", "en cualquier tiempo, y mientras tanto el alcalde puede continuar el trámite y expedir la licencia.", "La ley fija un término para decidir, y la actuación se suspende mientras se resuelve el impedimento; el alcalde no puede seguir conociendo el asunto.", false]]}, {"id": "AC-131", "niv": 2, "e": "Si el ciudadano presenta la recusación, el alcalde debe manifestar si acepta o no la causal dentro de los", "f": "Ley 1437 de 2011 (CPACA), art. 12", "o": [["A", "tres días siguientes a la fecha de su formulación.", "Los tres días corresponden al término para que el servidor se declare impedido y remita la actuación, no al pronunciamiento del recusado.", false], ["B", "cinco días siguientes a la fecha de su formulación.", "El artículo 12 del CPACA dispone que, en caso de recusación, el recusado manifiesta si acepta o no la causal invocada dentro de los cinco días siguientes a la fecha de su formulación.", true], ["C", "diez días siguientes a la fecha de su formulación.", "Los diez días corresponden al término de la autoridad competente para decidir sobre el impedimento o la recusación, no al pronunciamiento del recusado.", false]]}]}, {"comp": "anticorrupcion", "rol": "tecnico", "tag": "Estatuto Anticorrupción y transparencia · Niveles técnico, administrativo y operativo · Publicación de información mínima obligatoria", "texto": "Valentina es técnica de la oficina de comunicaciones de una alcaldía y está a cargo de la sección \"Transparencia y acceso a la información pública\" del sitio web. Al revisarla, nota que el directorio de servidores no tiene datos de contacto, que no se han publicado las escalas salariales y que la información de los contratistas de prestación de servicios está incompleta. Además, la última actualización de la sección se hizo hace cinco meses. Su jefe le pide preparar un plan para cumplir lo que exige la ley.", "items": [{"id": "AC-138", "niv": 1, "e": "En relación con los servidores de la alcaldía, la sección de transparencia debe publicar como mínimo", "f": "Ley 1712 de 2014, art. 9, lit. c", "o": [["A", "las hojas de vida completas de los servidores, con sus números de identificación y direcciones de residencia.", "La ley exige un directorio con datos institucionales; los números de identificación y las direcciones de residencia son datos personales que no hacen parte de la información mínima.", false], ["B", "solo el nombre del alcalde y de los secretarios de despacho, porque los demás servidores no tienen funciones de dirección.", "El directorio que exige la ley comprende a los empleados y funcionarios de la entidad, no solo a los cargos directivos.", false], ["C", "un directorio con el cargo, el correo electrónico y el teléfono del despacho, y las escalas salariales por categorías.", "El literal c) del artículo 9 de la Ley 1712 de 2014 exige publicar un directorio con el cargo, las direcciones de correo electrónico y el teléfono del despacho de los empleados y funcionarios, y las escalas salariales correspondientes a las categorías de todos los servidores.", true]]}, {"id": "AC-139", "niv": 1, "e": "Sobre los contratistas que son personas naturales con contratos de prestación de servicios, debe publicarse", "f": "Ley 1712 de 2014, art. 9, lit. e", "o": [["A", "solo el número total de contratistas de la vigencia, sin datos individuales.", "La ley exige datos de cada contrato de prestación de servicios con personas naturales, no solo una cifra global.", false], ["B", "el objeto del contrato, el monto de los honorarios y la dirección de correo electrónico.", "El literal e) del artículo 9 de la Ley 1712 de 2014 dispone que, para las personas naturales con contratos de prestación de servicios, se publiquen el objeto del contrato, el monto de los honorarios y las direcciones de correo electrónico, según el formato de información de servidores públicos y contratistas.", true], ["C", "la copia de sus declaraciones de renta y de sus afiliaciones a seguridad social.", "Esos documentos no hacen parte de la información mínima que exige la ley sobre los contratistas de prestación de servicios.", false]]}, {"id": "AC-140", "niv": 2, "e": "Según la Ley 1712 de 2014, la información mínima de su artículo 9 debe actualizarse como mínimo", "f": "Ley 1712 de 2014, art. 10, par.", "o": [["A", "cada mes.", "El parágrafo del artículo 10 de la Ley 1712 de 2014 dispone que los sujetos obligados deben actualizar la información a que se refiere el artículo 9 mínimo cada mes. Una actualización de hace cinco meses incumple ese mandato.", true], ["B", "cada seis meses.", "La ley no fija una periodicidad semestral para esta información; exige actualizarla como mínimo cada mes.", false], ["C", "cada año.", "Una actualización anual no basta para la información mínima del artículo 9, que la ley ordena actualizar como mínimo cada mes.", false]]}]}, {"comp": "comportamental", "rol": "tecnico", "tag": "Competencias comportamentales (Diccionario de la Procuraduría) · Niveles técnico, administrativo y operativo · Organización en el trabajo", "texto": "Usted es técnico de la secretaría de una procuraduría distrital y su empleo exige Organización en el trabajo en nivel C. Además de radicar y tramitar comunicaciones, debe coordinar las tareas de dos auxiliares. La secretaría tiene un indicador de oportunidad: toda comunicación debe quedar radicada y digitalizada con sus anexos el mismo día de su recibo, según el procedimiento del sistema de gestión de calidad. Al revisar el trabajo de la semana, encuentra que uno de los auxiliares no está digitalizando los anexos.", "items": [{"id": "CO-143", "niv": 2, "e": "En su trabajo diario, la actuación que mejor refleja el nivel C de Organización en el trabajo es", "f": "Diccionario de Competencias Comportamentales PGN, Organización en el trabajo, nivel C", "o": [["A", "radicar sus propias comunicaciones con el estándar fijado y en menos tiempo del que exige la entidad.", "Realizar las actividades en forma estandarizada y en menores tiempos corresponde al nivel D. El nivel C incluye coordinar y hacer seguimiento a las tareas propias o de otros.", false], ["B", "construir con los auxiliares, en reuniones de grupo, soluciones a los problemas de la secretaría.", "Compartir, discutir y construir soluciones con otros es la conducta del nivel C de Trabajo en equipo, no de Organización en el trabajo, que en el nivel C pide coordinar y hacer seguimiento a las tareas a la luz de indicadores.", false], ["C", "controlar las tareas de radicación suyas y de los auxiliares frente al indicador de oportunidad.", "El nivel C de Organización en el trabajo consiste en coordinar y hacer seguimiento a las actividades o tareas propias o de otros a la luz de estándares o indicadores.", true]]}, {"id": "CO-144", "niv": 2, "e": "Frente al auxiliar que no está digitalizando los anexos, lo coherente con el nivel C de Organización en el trabajo es", "f": "Diccionario de Competencias Comportamentales PGN, Organización en el trabajo, nivel C", "o": [["A", "digitalizar usted mismo los anexos faltantes, para evitar un roce con el compañero.", "Resuelve el pendiente puntual, pero no verifica con el compañero la aplicación del procedimiento, como pide el nivel C.", false], ["B", "anotar la novedad para mencionarla en la próxima evaluación de desempeño del auxiliar.", "Posterga la corrección y no hace el seguimiento oportuno a la luz del estándar que describe el nivel C.", false], ["C", "verificar con él la aplicación del procedimiento y acordar que complete los registros.", "Una de las conductas del nivel C de Organización en el trabajo es verificar la aplicación de la normatividad sobre calidad en las actividades propias y de compañeros o subalternos.", true]]}, {"id": "CO-145", "niv": 3, "e": "La actuación que corresponde a Organización en el trabajo, nivel C, y no a Cumplimiento de parámetros de trabajo, nivel C, es", "f": "Diccionario de Competencias Comportamentales PGN, Organización en el trabajo, nivel C", "o": [["A", "acatar las normas y la reglamentación que rigen el quehacer de la dependencia.", "Es la otra conducta del nivel C de Cumplimiento de parámetros de trabajo, no de Organización en el trabajo.", false], ["B", "vigilar el avance de su trabajo y el de otros comparándolo con indicadores o estándares.", "El diccionario define el nivel C de Organización en el trabajo como coordinar y hacer seguimiento a las actividades propias o de otros a la luz de estándares o indicadores.", true], ["C", "seguir las pautas del jefe inmediato para cumplir los objetivos de la dependencia.", "Es una conducta del nivel C de Cumplimiento de parámetros de trabajo.", false]]}]}, {"comp": "comportamental", "rol": "tecnico", "tag": "Competencias comportamentales (Diccionario de la Procuraduría) · Niveles técnico, administrativo y operativo · Cumplimiento de parámetros de trabajo", "texto": "Usted es técnico administrativo de la ventanilla de radicación de una procuraduría regional y su empleo exige Cumplimiento de parámetros de trabajo en nivel D. El instructivo de radicación indica, paso a paso, cómo registrar cada documento, contar folios y anexos, y qué hacer si falta un anexo anunciado: recibir el documento y dejar constancia del faltante. Hoy en la mañana, el coordinador le indicó que, desde ese día, las acciones de tutela deben radicarse antes que cualquier otro documento.", "items": [{"id": "CO-167", "niv": 1, "e": "Al radicar documentos en una mañana de mucha afluencia, lo que corresponde al nivel D de Cumplimiento de parámetros de trabajo es", "f": "Diccionario de Competencias Comportamentales PGN, Cumplimiento de parámetros de trabajo, nivel D", "o": [["A", "radicar siguiendo paso a paso el instructivo, incluido el registro de folios y anexos.", "El nivel D de Cumplimiento de parámetros de trabajo consiste en aplicar instrucciones detalladas en tareas operativas y seguir las normas y procedimientos establecidos para su desarrollo.", true], ["B", "adaptar el instructivo según el tipo de documento, porque algunos pasos no aplican a todos.", "Modificar el procedimiento por cuenta propia no corresponde al nivel D, que sigue las instrucciones detalladas establecidas.", false], ["C", "dejar el conteo de folios para el final de la jornada, cuando haya menos fila.", "Altera el procedimiento establecido; el nivel D consiste en seguir las normas y procedimientos fijados para las tareas operativas.", false]]}, {"id": "CO-168", "niv": 2, "e": "Frente a la indicación del coordinador sobre las tutelas, lo que refleja el nivel D de Cumplimiento de parámetros de trabajo es", "f": "Diccionario de Competencias Comportamentales PGN, Cumplimiento de parámetros de trabajo, nivel D", "o": [["A", "pedir que la indicación se le entregue por escrito antes de empezar a aplicarla.", "Retrasa el cumplimiento de una indicación clara del superior sobre una tarea cotidiana, contrario a la segunda conducta del nivel D.", false], ["B", "cumplir la indicación y dar prelación a las tutelas en la radicación del día.", "Una de las conductas del nivel D de Cumplimiento de parámetros de trabajo es cumplir las indicaciones de sus superiores para la implementación de procedimientos en el desarrollo de tareas cotidianas.", true], ["C", "seguir el orden de llegada, porque es el que fija el instructivo escrito.", "Desconoce la indicación del superior. El nivel D incluye cumplir las indicaciones de sus superiores para implementar procedimientos en las tareas cotidianas.", false]]}, {"id": "CO-169", "niv": 1, "e": "Un ciudadano entrega un escrito que anuncia tres anexos, pero solo trae dos. Lo que corresponde al nivel D de Cumplimiento de parámetros de trabajo es", "f": "Diccionario de Competencias Comportamentales PGN, Cumplimiento de parámetros de trabajo, nivel D", "o": [["A", "recibir el escrito y dejar constancia del anexo faltante, como indica el instructivo.", "El nivel D de Cumplimiento de parámetros de trabajo consiste en seguir las normas y procedimientos establecidos para las tareas operativas; el instructivo prevé este caso de forma expresa.", true], ["B", "devolver el escrito al ciudadano para que regrese con el anexo completo.", "Contradice la instrucción detallada del instructivo, que ordena recibir y dejar constancia.", false], ["C", "recibir el escrito sin dejar constancia, para no demorar la atención de la fila.", "Omite un paso del procedimiento; el nivel D exige seguir las instrucciones establecidas completas.", false]]}]}, {"comp": "comportamental", "rol": "tecnico", "tag": "Competencias comportamentales (Diccionario de la Procuraduría) · Niveles técnico, administrativo y operativo · Gestión de recursos", "texto": "Usted es técnico administrativo de una procuraduría provincial y su empleo exige Gestión de recursos en nivel D. Tiene a su cargo la papelería, los tóner de las impresoras y la agenda del único vehículo asignado a la provincial, que se usa para las diligencias por fuera de la sede. A mitad de mes advierte que quedan pocos tóner y que el siguiente suministro llegará hasta el mes próximo.", "items": [{"id": "CO-188", "niv": 1, "e": "Al iniciar el mes, lo que corresponde al nivel D de Gestión de recursos es", "f": "Diccionario de Competencias Comportamentales PGN, Gestión de recursos, nivel D", "o": [["A", "supervisar los recursos asignados a toda la provincial y su ejecución conforme a las directivas.", "Supervisar los recursos de la dependencia y ejecutarlos conforme a las directivas es una conducta del nivel B.", false], ["B", "solicitar más papelería al comienzo de cada mes para no quedarse sin existencias.", "Pedir más recursos por precaución no es programar ni racionalizar los asignados, que son las conductas del nivel D.", false], ["C", "programar el uso del vehículo y la papelería asignados según las diligencias del mes.", "El nivel D de Gestión de recursos (realizar tareas operativas con los recursos provistos por la entidad) incluye programar los recursos asignados para el desarrollo de sus actividades.", true]]}, {"id": "CO-189", "niv": 1, "e": "Frente a la escasez de tóner, lo coherente con el nivel D de Gestión de recursos es", "f": "Diccionario de Competencias Comportamentales PGN, Gestión de recursos, nivel D", "o": [["A", "suspender todas las impresiones de la provincial hasta que llegue el siguiente suministro.", "Paraliza actividades en lugar de administrar el recurso disponible; racionalizar no equivale a suspender.", false], ["B", "hacer un pedido extraordinario y seguir imprimiendo al ritmo habitual.", "No racionaliza el recurso; la competencia se define como el uso eficiente de los recursos públicos.", false], ["C", "racionalizar el uso, imprimiendo solo lo indispensable y a doble cara.", "Una de las conductas del nivel D de Gestión de recursos es racionalizar los recursos asignados para el desarrollo de sus tareas.", true]]}, {"id": "CO-190", "niv": 2, "e": "Si el empleo exigiera el nivel C de Gestión de recursos, se esperaría además que el técnico", "f": "Diccionario de Competencias Comportamentales PGN, Gestión de recursos, nivel C", "o": [["A", "rindiera cuentas veraces de lo que ejecutó y de su responsabilidad en el uso de los recursos.", "El nivel C de Gestión de recursos incluye incorporar los recursos aplicables a los procesos en que interviene y facilitar información veraz de sus ejecuciones y responsabilidades.", true], ["B", "implementara herramientas de control para vigilar el cumplimiento de sus propias funciones.", "Implementar herramientas de control para vigilar las funciones propias del cargo es una conducta del nivel C de Orientación al orden, la calidad y la exactitud, no de Gestión de recursos.", false], ["C", "aprobara los recursos de naturaleza oficial necesarios para cumplir los objetivos de la dependencia.", "Definir y aprobar recursos para conseguir los objetivos de la dependencia es propio del nivel B.", false]]}]}];

const $ = s => document.querySelector(s);

function justHTML(it){
  return '<div class="just">' + it.o.map(o => `<div><b>${o[0]}.</b> <span class="${o[3]?'okt':'not'}">${o[3]?'Es correcta.':'Es incorrecta.'}</span> ${esc(o[2])}</div>`).join('') +
    `<div class="src">Referencia: ${esc(it.f)}</div></div>`;
}
function itemHTML(it, n, mode){
  const r = ST.r[it.id];
  const reveal = mode === 'review' || (CFG.modo === 'practica' && r);
  let h = `<div class="item" id="i-${it.id}"><p class="enun"><span class="n">${n}.</span> <span class="niv">${CFG.niveles[it.niv]}</span> ${esc(it.e)}</p>`;
  it.o.forEach(o => {
    let cls = '';
    if (reveal) { if (o[3]) cls = 'ok'; else if (r === o[0]) cls = 'no'; }
    else if (r === o[0]) cls = 'sel';
    h += `<button class="op ${cls}" data-id="${it.id}" data-l="${o[0]}" ${reveal?'disabled':''}><span class="l">${o[0]}.</span><span>${esc(o[1])}</span></button>`;
  });
  if (reveal) {
    if (mode === 'review') h += `<div class="${r===keyOf(it)?'res-ok':'res-no'}" style="font-size:14px;margin-top:4px">${r ? (r===keyOf(it)?'Respondiste ' + r + ': correcto.':'Respondiste ' + r + '. La respuesta correcta es ' + keyOf(it) + '.') : 'Sin responder. La respuesta correcta es ' + keyOf(it) + '.'}</div>`;
    h += justHTML(it);
  }
  return h + '</div>';
}
const keyOf = it => it.o.find(o => o[3])[0];

function renderList(list, mode){
  let h = '', last = null, n = 0;
  list.forEach(it => {
    n++;
    if (it.caso !== last) { last = it.caso; h += `<div class="caso"><div class="tag">${esc(it.caso.tag)}</div><p>${esc(it.caso.texto)}</p></div>`; }
    h += itemHTML(it, n, mode);
  });
  return h;
}

let FILTRO = ST.f || {comp:'', niv:'', rol:''};
function practica(){
  const comps = Object.entries(CFG.componentes).map(([k,v]) => `<option value="${k}" ${FILTRO.comp===k?'selected':''}>${esc(v)}</option>`).join('');
  const nivs = Object.entries(CFG.niveles).map(([k,v]) => `<option value="${k}" ${FILTRO.niv===k?'selected':''}>${esc(v)}</option>`).join('');
  const list = ITEMS.filter(it => (!FILTRO.comp || it.caso.comp===FILTRO.comp) && (!FILTRO.niv || String(it.niv)===FILTRO.niv) && (!FILTRO.rol || it.caso.rol===FILTRO.rol || it.caso.rol==='general'));
  const resp = list.filter(it => ST.r[it.id]); const ok = resp.filter(it => ST.r[it.id]===keyOf(it));
  $('#main').innerHTML = `<div class="panel"><p style="margin-top:0">Elige un tema, tu nivel de empleo y la dificultad. Al responder verás de inmediato si acertaste y la explicación de cada opción.</p>
  <div class="row"><select id="fc"><option value="">Todos los temas</option>${comps}</select>
  <select id="fn"><option value="">Todas las dificultades</option>${nivs}</select>
  <select id="fr"><option value="">Todos los niveles de empleo</option>${['tecnico','profesional'].map(k => `<option value="${k}" ${FILTRO.rol===k?'selected':''}>${esc(CFG.roles[k])} (y temas comunes)</option>`).join('')}</select>
  <button class="btn sec" id="borrar">Borrar mis respuestas</button></div>
  <p class="stat" id="pst" style="margin-bottom:0">${list.length} preguntas · respondidas ${resp.length} · aciertos ${ok.length}${resp.length? ' (' + Math.round(100*ok.length/resp.length) + ' %)':''}</p></div>` + renderList(list, 'practica');
  $('#prog').textContent = `${ok.length}/${resp.length} aciertos`;
  ['fc','fn','fr'].forEach((id,i) => $('#'+id).onchange = e => { FILTRO[['comp','niv','rol'][i]] = e.target.value; ST.f = FILTRO; save(); practica(); });
  LIST = list;
  $('#borrar').onclick = () => { list.forEach(it => delete ST.r[it.id]); save(); practica(); };
}

// ---------- SIMULACRO ----------
let tick = null;
function inicio(){
  const n = ITEMS.length, cnt = {};
  ITEMS.forEach(it => cnt[it.caso.comp] = (cnt[it.caso.comp]||0) + 1);
  const h = Math.floor(CFG.minutos/60), m = CFG.minutos%60;
  $('#main').innerHTML = `<div class="panel"><h2 style="margin-top:0;color:var(--pri)">Instrucciones</h2>
  <p>Este simulacro tiene <b>${n} preguntas</b> en formato de caso: una situación, enunciados que se completan y tres opciones con una sola respuesta correcta.</p>
  <table>${Object.entries(cnt).map(([k,v]) => `<tr><td>${esc(CFG.componentes[k])}</td><td class="r">${v}</td></tr>`).join('')}</table>
  <p>Tiempo sugerido: <b>${h ? h + ' h ' : ''}${m ? m + ' min' : ''}</b> (unos ${Math.round(CFG.minutos*60/n/6)/10} minutos por pregunta). Cuando se acaba el tiempo puedes seguir, pero el cronómetro lo indica.</p>
  <p>Tus respuestas se guardan en este navegador. Al terminar verás tu puntaje por componente y por dificultad, y la explicación de cada pregunta.</p>
  <button class="btn" id="go">${ST.t0 ? 'Continuar el simulacro' : 'Comenzar'}</button></div>`;
  $('#prog').textContent = `${n} preguntas`;
  $('#go').onclick = () => { if (!ST.t0) { ST.t0 = Date.now(); save(); } examen(); };
}
function reloj(){
  const rest = CFG.minutos*60 - Math.floor((Date.now() - ST.t0)/1000);
  const a = Math.abs(rest), hh = Math.floor(a/3600), mm = Math.floor(a%3600/60), ss = a%60;
  const t = (rest < 0 ? '+' : '') + (hh ? hh + ':' : '') + String(mm).padStart(2,'0') + ':' + String(ss).padStart(2,'0');
  $('#timer').textContent = rest < 0 ? 'Tiempo cumplido ' + t : '⏱ ' + t;
  $('#timer').classList.toggle('low', rest < 600);
}
function examen(){
  $('#main').innerHTML = renderList(ITEMS, 'examen') + `<div class="panel"><button class="btn" id="fin">Terminar y calificar</button></div>`;
  progreso(); reloj(); clearInterval(tick); tick = setInterval(reloj, 1000);
  $('#fin').onclick = () => {
    const faltan = ITEMS.length - Object.keys(ST.r).filter(k => ITEMS.some(i => i.id===k)).length;
    $('#mtxt').textContent = faltan ? `Te faltan ${faltan} preguntas por responder. ¿Quieres calificar de todos modos?` : '¿Quieres terminar y ver tu calificación?';
    $('#modal').classList.remove('hide');
  };
}
function progreso(){
  const r = ITEMS.filter(it => ST.r[it.id]).length;
  $('#prog').textContent = `Respondidas ${r}/${ITEMS.length}`;
}
$('#mno').onclick = () => $('#modal').classList.add('hide');
$('#msi').onclick = () => { $('#modal').classList.add('hide'); ST.fin = Date.now(); save(); resultados(); };
function resultados(){
  clearInterval(tick);
  const ok = ITEMS.filter(it => ST.r[it.id] === keyOf(it)).length;
  const pct = Math.round(1000*ok/ITEMS.length)/10;
  const g = (fn, lab) => { const m = {}; ITEMS.forEach(it => { const k = fn(it); m[k] = m[k] || [0,0]; m[k][1]++; if (ST.r[it.id]===keyOf(it)) m[k][0]++; });
    return Object.entries(m).map(([k,v]) => `<tr><td>${esc(lab(k))}</td><td class="r">${v[0]}/${v[1]}</td><td class="r">${Math.round(100*v[0]/v[1])} %</td></tr>`).join(''); };
  const mins = Math.round(((ST.fin||Date.now()) - ST.t0)/60000);
  $('#timer').textContent = `Tiempo usado: ${Math.floor(mins/60) ? Math.floor(mins/60) + ' h ' : ''}${mins%60} min`;
  $('#prog').textContent = `${ok}/${ITEMS.length} aciertos`;
  $('#main').innerHTML = `<div class="panel"><div class="big">${String(pct).replace('.',',')} %</div>
  <p style="margin-top:4px">${ok} de ${ITEMS.length} respuestas correctas. ${pct >= 75 ? 'Muy buen resultado: repasa las explicaciones de tus errores para afianzarlo.' : pct >= 65 ? 'Vas bien, pero con poco margen: refuerza los componentes con menor porcentaje.' : 'Todavía no estás en zona segura: practica por tema los componentes con menor porcentaje.'}</p>
  <p class="aviso">Referencia: en el concurso de la Procuraduría la prueba de conocimientos es eliminatoria con mínimo de 65 puntos sobre 100, y la comportamental es clasificatoria. Este porcentaje de aciertos es una guía de preparación; la calificación oficial usa una escala estándar que compara a los aspirantes.</p>
  <h3>Por componente</h3><table>${g(it => it.caso.comp, k => CFG.componentes[k])}</table>
  <h3>Por dificultad</h3><table>${g(it => it.niv, k => CFG.niveles[k])}</table>
  <div class="row" style="margin-top:14px"><button class="btn" id="solo">Ver solo mis errores</button><button class="btn sec" id="todas">Ver todas</button><button class="btn sec" id="otra">Reiniciar el simulacro</button></div></div><div id="rev"></div>`;
  const rev = errs => { const l = errs ? ITEMS.filter(it => ST.r[it.id] !== keyOf(it)) : ITEMS; $('#rev').innerHTML = renderList(l, 'review'); };
  rev(true);
  $('#solo').onclick = () => rev(true); $('#todas').onclick = () => rev(false);
  $('#otra').onclick = () => { ST = {r:{}}; save(); inicio(); window.scrollTo(0,0); };
}

document.addEventListener('click', e => {
  const b = e.target.closest('button.op'); if (!b || b.disabled) return;
  ST.r[b.dataset.id] = b.dataset.l; save();
  const it = ITEMS.find(i => i.id === b.dataset.id);
  const n = b.closest('.item').querySelector('.n').textContent.replace('.','');
  b.closest('.item').outerHTML = itemHTML(it, n, CFG.modo === 'practica' ? 'practica' : 'examen');
  if (CFG.modo === 'practica') { const resp = LIST.filter(i => ST.r[i.id]); const ok = resp.filter(i => ST.r[i.id]===keyOf(i)).length; $('#prog').textContent = `${ok}/${resp.length} aciertos`; $('#pst').textContent = `${LIST.length} preguntas · respondidas ${resp.length} · aciertos ${ok} (${Math.round(100*ok/resp.length)} %)`; }
  else progreso();
});

if (CFG.modo === 'practica') practica();
else if (ST.fin) resultados();
else if (ST.t0) examen();
else inicio();
</script>
</body>
</html>
