un contrato de consultoría en ordenamiento territorial con la alcaldía de ese municipio. Laura consulta en la personería qué puede hacer.", "items": [{"id": "AC-104", "niv": 2, "e": "Sobre la asesoría al constructor en el trámite de la licencia, la personería le indica a Laura que", "f": "Ley 1952 de 2019, art. 56, num. 4", "o": [["A", "no debe prestarla: en el año siguiente al retiro no puede asesorar ante la misma entidad en asuntos propios de su cargo.", "El numeral 4 del artículo 56 de la Ley 1952 de 2019 sanciona como falta gravísima prestar, a título personal o por interpuesta persona, servicios de asistencia, representación o asesoría en asuntos relacionados con las funciones propias del cargo, hasta por el término de un año después de la dejación del cargo, con respecto de la entidad en la que se prestaron los servicios. Han pasado ocho meses desde el retiro de Laura, de modo que está dentro del término.", true], ["B", "puede prestarla siempre que el constructor no tenga contratos vigentes con el municipio.", "La prohibición se refiere a asuntos relacionados con las funciones propias del cargo, como una licencia urbanística ante la secretaría que dirigía, y no depende de que el particular tenga contratos con el municipio.", false], ["C", "puede prestarla, porque ya no es servidora pública y el régimen disciplinario dejó de aplicársele desde el día en que se retiró del cargo.", "El régimen disciplinario contempla prohibiciones que siguen aplicando al exservidor durante un tiempo después del retiro, precisamente para evitar el uso indebido de su posición anterior.", false]]}, {"id": "AC-105", "niv": 3, "e": "En cuanto al proceso sancionatorio en el que Laura firmó el auto de apertura, ella", "f": "Ley 1952 de 2019, art. 56, num. 4", "o": [["A", "puede representarlo desde ya, si se declara impedida ante la secretaría de planeación y renuncia a cobrar honorarios.", "Los impedimentos son una figura para quien ejerce funciones públicas; la gratuidad de la gestión tampoco elimina la prohibición, que recae sobre la representación misma en ese asunto concreto.", false], ["B", "no puede representarlo en ningún momento, por tratarse de un asunto concreto que conoció como secretaria.", "El numeral 4 del artículo 56 de la Ley 1952 de 2019 dispone que la incompatibilidad es indefinida en el tiempo respecto de los asuntos concretos que el servidor conoció en ejercicio de sus funciones, entendidos como los de carácter particular que fueron objeto de decisión y tienen sujetos claramente determinados.", true], ["C", "podrá representar al constructor una vez cumplido el primer año desde su retiro.", "El término de un año se aplica a los asuntos relacionados con las funciones del cargo en general; para el asunto concreto que conoció como servidora, la prohibición no tiene límite temporal.", false]]}, {"id": "AC-106", "niv": 3, "e": "Respecto de la oferta de la firma para el contrato de consultoría con la alcaldía, es acertado afirmar que", "f": "Ley 80 de 1993, art. 8, num. 2, lit. f (adicionado por la Ley 1474 de 2011, art. 4)", "o": [["A", "la firma puede presentar la oferta si Laura no la firma ni participa en la ejecución del contrato.", "La inhabilidad se configura por el vínculo de Laura con la sociedad y la relación del objeto con su sector, no porque ella suscriba la oferta o ejecute el contrato.", false], ["B", "la firma puede presentar la oferta, pues la inhabilidad de los exdirectivos solo cobija a Laura como persona natural y no a la sociedad que la vinculó como consultora.", "La norma extiende expresamente la inhabilidad a las sociedades de las que el exdirectivo haga parte o a las que esté vinculado a cualquier título.", false], ["C", "la firma no puede contratar con esa alcaldía en los dos años siguientes al retiro de Laura, pues ella fue directiva y el objeto es de su sector.", "El literal f) del numeral 2 del artículo 8 de la Ley 80 de 1993, adicionado por el artículo 4 de la Ley 1474 de 2011, impide contratar con la entidad respectiva a quienes ejercieron cargos del nivel directivo, y a las sociedades de las que hagan parte o a las que estén vinculados a cualquier título, durante los dos años siguientes al retiro, cuando el objeto que desarrollen tenga relación con el sector al cual prestaron sus servicios.", true]]}]}, {"comp": "anticorrupcion", "rol": "general", "tag": "Estatuto Anticorrupción y transparencia · Programas de Transparencia y Ética Pública", "texto": "Un equipo de una procuraduría delegada con funciones preventivas visita una empresa industrial y comercial del Estado del orden municipal dedicada a la promoción turística, que contrata con normas de derecho privado. El gerente sostiene que la entidad no está obligada a adoptar un Programa de Transparencia y Ética Pública, porque no aplica el Estatuto General de Contratación y porque, según él, esa obligación es solo para los ministerios y demás entidades nacionales. El jefe de planeación, por su parte, presenta un borrador del programa y pregunta qué contenidos debe incluir y quién fija los estándares mínimos que debe cumplir.", "items": [{"id": "AC-116", "niv": 2, "e": "Frente a la posición del gerente, el equipo de la procuraduría le explica que la empresa", "f": "Ley 1474 de 2011, art. 73 (modificado por la Ley 2195 de 2022, art. 31)", "o": [["A", "no está obligada, porque los programas de transparencia solo se exigen a las entidades que contratan con el Estatuto General, la Ley 80 de 1993.", "La norma incluye expresamente a las entidades cualquiera que sea su régimen de contratación, de modo que contratar con derecho privado no la excluye.", false], ["B", "sí debe implementarlo, porque la obligación cobija a entidades de todos los órdenes, cualquiera que sea su régimen de contratación.", "El artículo 73 de la Ley 1474 de 2011, modificado por el artículo 31 de la Ley 2195 de 2022, ordena que cada entidad del orden nacional, departamental y municipal, cualquiera que sea su régimen de contratación, implemente Programas de Transparencia y Ética Pública.", true], ["C", "solo debe adoptarlo si el concejo municipal se lo ordena mediante acuerdo, porque es una entidad descentralizada.", "La obligación surge directamente de la ley para las entidades de todos los órdenes; no depende de un acuerdo del concejo.", false]]}, {"id": "AC-117", "niv": 2, "e": "Entre los contenidos que el programa debe incluir según la ley se encuentran", "f": "Ley 1474 de 2011, art. 73 (modificado por la Ley 2195 de 2022, art. 31)", "o": [["A", "las medidas de debida diligencia y los canales de denuncia previstos en la ley.", "El artículo 73 de la Ley 1474 de 2011, modificado por la Ley 2195 de 2022, incluye entre los contenidos del programa las medidas de debida diligencia en las entidades del sector público, los canales de denuncia conforme al artículo 76 de esa ley y las estrategias de transparencia, Estado abierto, acceso a la información pública y cultura de legalidad, entre otros.", true], ["B", "un régimen especial de inhabilidades para sus contratistas, distinto del previsto en las leyes.", "Las inhabilidades son de reserva legal; una entidad no puede crear un régimen propio de inhabilidades mediante su programa de transparencia.", false], ["C", "la definición de faltas disciplinarias y sanciones propias para los servidores de la empresa.", "Las faltas y sanciones disciplinarias están definidas en la ley disciplinaria, no en el programa de la entidad; el programa contiene medidas de prevención y gestión del riesgo de corrupción.", false]]}, {"id": "AC-118", "niv": 3, "e": "Sobre los estándares mínimos del programa, el jefe de planeación debe saber que", "f": "Ley 1474 de 2011, art. 73 (modificado por la Ley 2195 de 2022, art. 31)", "o": [["A", "los fija la Procuraduría General de la Nación, que además aprueba cada programa antes de su adopción.", "La ley no asigna a la Procuraduría la fijación de los estándares ni la aprobación previa de cada programa, sin perjuicio de sus funciones preventivas y de vigilancia.", false], ["B", "los señala la Secretaría de Transparencia de la Presidencia, en armonía con el Modelo Integrado de Planeación y Gestión.", "El artículo 73 de la Ley 1474 de 2011, modificado por la Ley 2195 de 2022, dispone que la Secretaría de Transparencia de la Presidencia de la República señala las características, estándares, elementos, requisitos, procedimientos y controles mínimos de los programas, que deben articularse con el Modelo Integrado de Planeación y Gestión (MIPG).", true], ["C", "cada entidad los define libremente, porque la ley solo exige que el programa se publique en la página web.", "La ley no deja los estándares a la libre definición de cada entidad: asigna su fijación a una autoridad del orden nacional.", false]]}]}, {"comp": "anticorrupcion", "rol": "profesional", "tag": "Estatuto Anticorrupción y transparencia · Niveles profesional, asesor y ejecutivo · Responsabilidad de las personas jurídicas por corrupción", "texto": "Usted es profesional de una procuraduría delegada y apoya un informe sobre una sociedad comercial domiciliada en Colombia. El gerente de la sociedad pagó un soborno al director de un hospital departamental para obtener un contrato de suministro de equipos; ambos fueron condenados penalmente con sentencias ejecutoriadas, y la sociedad se benefició con el contrato. Además, se conoció que la misma sociedad, por medio de un empleado, ofreció dinero a un servidor público de otro país para obtener allí una licencia. La junta directiva pregunta qué consecuencias puede enfrentar la empresa y qué programa de prevención debería adoptar.", "items": [{"id": "AC-119", "niv": 2, "e": "Frente al soborno pagado al director del hospital, la sociedad", "f": "Ley 1474 de 2011, art. 34 (modificado por la Ley 2195 de 2022)", "o": [["A", "puede ser sancionada administrativamente, con independencia de las responsabilidades penales individuales.", "El artículo 34 de la Ley 1474 de 2011, modificado por la Ley 2195 de 2022, establece un régimen de responsabilidad administrativa sancionatoria de las personas jurídicas que se hayan beneficiado de delitos contra la Administración Pública o el patrimonio público cometidos por sus administradores o funcionarios, independientemente de las responsabilidades penales individuales a que hubiere lugar.", true], ["B", "no puede ser sancionada, porque la responsabilidad por corrupción es personal y ya fue condenado su gerente.", "La ley prevé medidas administrativas contra la persona jurídica que se buscó beneficiar del delito, adicionales a la responsabilidad penal de las personas naturales.", false], ["C", "solo puede ser sancionada si un juez penal la condena como persona jurídica en el mismo proceso del gerente.", "Las medidas contra la persona jurídica que prevé la Ley 1474 son de naturaleza administrativa; la ley no condiciona su aplicación a una condena penal de la sociedad como tal.", false]]}, {"id": "AC-120", "niv": 2, "e": "Respecto del ofrecimiento de dinero al servidor público extranjero, es acertado afirmar que", "f": "Ley 1778 de 2016, arts. 2 y 3 (modificados por la Ley 2195 de 2022)", "o": [["A", "ninguna autoridad colombiana puede actuar, porque la conducta se cometió fuera del territorio nacional.", "El régimen de soborno transnacional existe precisamente para conductas que involucran a servidores públicos extranjeros, y alcanza a las personas jurídicas domiciliadas en Colombia.", false], ["B", "la Procuraduría General de la Nación debe sancionarla disciplinariamente, porque se trata de un acto de corrupción.", "El poder disciplinario recae sobre servidores públicos y, en ciertos casos, particulares que ejercen funciones públicas; la sanción de la persona jurídica por soborno transnacional es administrativa y corresponde a la Superintendencia de Sociedades.", false], ["C", "la Superintendencia de Sociedades puede investigarla y sancionarla administrativamente por soborno transnacional.", "La Ley 1778 de 2016, en sus artículos 2 y 3, modificados por la Ley 2195 de 2022, establece la responsabilidad administrativa de las personas jurídicas por soborno transnacional y asigna a la Superintendencia de Sociedades su investigación y sanción, incluidas conductas ocurridas en el exterior por personas jurídicas domiciliadas en Colombia.", true]]}, {"id": "AC-121", "niv": 3, "e": "Sobre el programa de transparencia y ética empresarial que debe adoptar la sociedad, se le explica a la junta que", "f": "Ley 1474 de 2011, art. 34-7 (adicionado por la Ley 2195 de 2022)", "o": [["A", "la superintendencia que la vigila fija su contenido según el sector, los riesgos, los activos, los ingresos y los empleados.", "El artículo 34-7 de la Ley 1474 de 2011, adicionado por la Ley 2195 de 2022, dispone que las personas jurídicas sujetas a vigilancia de las superintendencias adopten programas de transparencia y ética empresarial cuyo contenido define la superintendencia, teniendo en cuenta criterios como el sector, los riesgos del sector, el monto de activos, los ingresos, el número de empleados y el objeto social.", true], ["B", "cada empresa lo define libremente y solo debe presentarlo a la superintendencia cuando se le abra una investigación administrativa.", "La ley no deja el programa a la libre definición de la empresa ni lo reserva para cuando exista una investigación; su contenido responde a los lineamientos de la superintendencia.", false], ["C", "existe un programa único para todas las sociedades del país, expedido por la Secretaría de Transparencia.", "La ley no prevé un programa único: los lineamientos los fija la superintendencia respectiva, teniendo en cuenta las características de cada sociedad.", false]]}]}, {"comp": "anticorrupcion", "rol": "general", "tag": "Estatuto Anticorrupción y transparencia · Control interno y lucha contra la corrupción", "texto": "En un municipio, el alcalde de turno designó al jefe de la oficina de control interno a mediados de su período de gobierno, como lo prevé la ley. Dos años después se posesiona un nuevo alcalde, que anuncia que reemplazará al jefe de control interno por una persona de su confianza. Mientras tanto, el jefe de control interno detecta en una auditoría indicios de que un contratista cobró dos veces por el mismo servicio con la complicidad de un funcionario. Además, la oficina de atención al ciudadano le pregunta qué papel tiene control interno frente a las quejas y reclamos.", "items": [{"id": "AC-144", "niv": 3, "e": "Frente al anuncio del nuevo alcalde, es correcto afirmar que", "f": "Ley 87 de 1993, art. 11 (modificado por la Ley 1474 de 2011, art. 8)", "o": [["A", "puede reemplazarlo libremente, porque el jefe de control interno es de libre nombramiento y remoción del alcalde de turno.", "En el nivel territorial, la ley dispone que el jefe de control interno se designa para un período fijo, lo que impide reemplazarlo libremente al cambiar el alcalde.", false], ["B", "debe reemplazarlo, porque el período del jefe de control interno termina con el del alcalde que lo designó.", "La ley desvincula los períodos: el jefe de control interno se designa en la mitad del período del mandatario, de modo que su período no termina con el del alcalde que lo designó.", false], ["C", "no puede reemplazarlo a discreción, porque fue designado para un período fijo de cuatro años que no coincide con el del alcalde.", "El artículo 8 de la Ley 1474 de 2011 dispone que, en las entidades territoriales, el jefe de la unidad de control interno es designado por el alcalde o gobernador para un período fijo de cuatro años, en la mitad del respectivo período del alcalde o gobernador.", true]]}, {"id": "AC-145", "niv": 2, "e": "Frente a los indicios del doble cobro, el jefe de control interno", "f": "Ley 87 de 1993, art. 14 (modificado por la Ley 1474 de 2011, art. 9, y el Decreto Ley 2106 de 2019, art. 156)", "o": [["A", "debe esperar a la auditoría del año siguiente para confirmar los hechos antes de informar a cualquier autoridad.", "Aplazar el reporte iría en contra del deber legal de informar los posibles actos de corrupción; confirmar los hechos corresponde a las autoridades competentes.", false], ["B", "debe reportar a los organismos de control los posibles actos de corrupción e irregularidades encontrados.", "El artículo 14 de la Ley 87 de 1993, modificado por el artículo 9 de la Ley 1474 de 2011 y luego por el artículo 156 del Decreto Ley 2106 de 2019, dispone que el jefe de la unidad de control interno debe reportar a los organismos de control los posibles actos de corrupción e irregularidades que encuentre en el ejercicio de sus funciones. Aunque la norma se refiere al jefe del orden nacional, el deber se predica también del jefe territorial por la naturaleza de su función y por el deber general de denuncia de los servidores.", true], ["C", "solo debe informar al alcalde, quien decide si los hechos se remiten a otras autoridades.", "La ley impone al jefe de control interno el deber de reportar directamente a los organismos de control; su deber no depende de la decisión del alcalde.", false]]}, {"id": "AC-146", "niv": 1, "e": "Frente a las quejas y reclamos, a la oficina de control interno le corresponde", "f": "Ley 1474 de 2011, art. 76", "o": [["A", "vigilar que la atención se preste conforme a las normas y rendir un informe semestral a la administración.", "El artículo 76 de la Ley 1474 de 2011 dispone que la oficina de control interno vigila que la atención de quejas, sugerencias y reclamos se preste de acuerdo con las normas legales vigentes y rinde a la administración de la entidad un informe semestral sobre el particular.", true], ["B", "resolver directamente todas las quejas y reclamos, en reemplazo de la dependencia de atención al ciudadano.", "La ley exige una dependencia encargada de recibir, tramitar y resolver las quejas; a control interno le corresponde vigilar esa atención, no reemplazar a la dependencia.", false], ["C", "ninguna función, porque las quejas y reclamos son competencia exclusiva de la personería municipal.", "La ley asigna a la oficina de control interno una función de vigilancia sobre la atención de quejas, sugerencias y reclamos de la entidad.", false]]}]}, {"comp": "comportamental", "rol": "profesional", "tag": "Competencias comportamentales (Diccionario de la Procuraduría) · Niveles profesional, asesor y ejecutivo · Cumplimiento de parámetros de trabajo", "texto": "Usted es profesional universitario de una procuraduría regional y coordina a dos técnicos que apoyan la sustanciación. Su empleo exige Cumplimiento de parámetros de trabajo en nivel B. La entidad expidió un lineamiento interno que cambia la forma de registrar las actuaciones en el sistema de información: ahora cada auto debe registrarse el mismo día de su firma. Uno de los técnicos, preocupado por varios expedientes próximos a vencer, propone no registrar esas actuaciones hasta después de evacuarlos, «para ganar tiempo». El empleo de ese técnico exige el nivel D de la misma competencia.", "items": [{"id": "CO-107", "niv": 2, "e": "Al recibir el nuevo lineamiento de registro, la actuación que corresponde al nivel B de Cumplimiento de parámetros de trabajo es", "f": "Diccionario de Competencias Comportamentales PGN, Cumplimiento de parámetros de trabajo, nivel B", "o": [["A", "transmitir a los técnicos el cambio en el registro y documentar sus propias actividades según la nueva exigencia.", "Transmitir los procedimientos que involucran cambios y documentar las actividades según las nuevas demandas de la entidad son conductas de Adaptación al cambio, nivel C (facilitador del cambio). No incluyen aplicar el lineamiento ni alinear las metas del equipo con él, que es lo que describe el nivel B de Cumplimiento de parámetros de trabajo.", false], ["B", "aplicarlo en los expedientes a su cargo y fijar a los técnicos metas de registro acordes con el nuevo procedimiento.", "El nivel B de Cumplimiento de parámetros de trabajo incluye seguir las reglas y lineamientos establecidos en los procesos organizacionales y definir objetivos para su equipo alineados con los procedimientos definidos.", true], ["C", "esperar las pautas que imparta el procurador regional sobre cómo aplicarlo y seguirlas en cuanto las comunique.", "Seguir las pautas definidas por el jefe inmediato para cumplir los objetivos de la dependencia es una conducta del nivel C. En el nivel B el servidor aplica por sí mismo los lineamientos establecidos y alinea a su equipo con ellos.", false]]}, {"id": "CO-108", "niv": 3, "e": "Frente a la propuesta del técnico de aplazar el registro, la respuesta coherente con el nivel B de Cumplimiento de parámetros de trabajo es", "f": "Diccionario de Competencias Comportamentales PGN, Cumplimiento de parámetros de trabajo, nivel B", "o": [["A", "trasladar la propuesta al procurador regional para que sea él quien decida si se aplica o no.", "Remitir al jefe una decisión que ya está resuelta por el lineamiento se acerca al nivel C (seguir pautas del jefe inmediato). En el nivel B el servidor aplica los criterios establecidos y orienta a su equipo con base en ellos.", false], ["B", "aceptarla solo para los expedientes próximos a vencer, porque proteger los términos es el objetivo principal de la dependencia.", "Privilegia el resultado por encima de la regla establecida. Esta competencia trata de aplicar en las labores la normatividad interna o externa; en el nivel B se siguen los lineamientos y se alinean los objetivos del equipo con ellos.", false], ["C", "explicarle que el registro hace parte del procedimiento y organizar con él los tiempos para cumplir ambas cosas.", "En el nivel B de Cumplimiento de parámetros de trabajo el servidor sigue los lineamientos establecidos y define objetivos para su equipo alineados con los procedimientos. Organizar el trabajo del técnico respetando el registro aplica ambas conductas.", true]]}, {"id": "CO-109", "niv": 1, "e": "Para el técnico, cuyo empleo exige el nivel D de Cumplimiento de parámetros de trabajo, la conducta esperada en su nivel es", "f": "Diccionario de Competencias Comportamentales PGN, Cumplimiento de parámetros de trabajo, nivel D", "o": [["A", "pedir a su superior una orden específica antes de registrar cada actuación.", "Requerir órdenes específicas para desarrollar las actividades es una conducta del nivel D de Orientación al orden, la calidad y la exactitud, no de Cumplimiento de parámetros de trabajo. Además, el instructivo ya trae las instrucciones detalladas que el técnico debe seguir.", false], ["B", "definir las metas de registro del grupo de sustanciación, alineadas con el procedimiento.", "Definir objetivos para el equipo alineados con los procedimientos es propio del nivel B, que en este caso corresponde al profesional que coordina.", false], ["C", "seguir el instructivo paso a paso al registrar cada actuación y atender las indicaciones de su superior.", "El nivel D de Cumplimiento de parámetros de trabajo describe a quien aplica instrucciones detalladas en tareas operativas: sigue las normas y procedimientos establecidos y cumple las indicaciones de sus superiores en las tareas cotidianas.", true]]}]}, {"comp": "comportamental", "rol": "profesional", "tag": "Competencias comportamentales (Diccionario de la Procuraduría) · Niveles profesional, asesor y ejecutivo · Organización en el trabajo", "texto": "Usted es profesional universitario de la Oficina de Control Interno de la Procuraduría y su empleo exige Organización en el trabajo en nivel B. El jefe le pide programar las 12 auditorías internas del segundo semestre. La oficina cuenta con cuatro auditores; uno de ellos estará de vacaciones todo septiembre, y en diciembre el equipo se dedica a los informes de cierre de la vigencia. El jefe también quiere empezar a pensar en cómo debería funcionar la oficina en los próximos cinco años. En la oficina trabaja una técnica cuyo empleo exige el nivel D de la misma competencia.", "items": [{"id": "CO-125", "niv": 1, "e": "Al elaborar la programación del semestre, lo que mejor refleja el nivel B de Organización en el trabajo es", "f": "Diccionario de Competencias Comportamentales PGN, Organización en el trabajo, nivel B", "o": [["A", "programar dos auditorías por mes de julio a diciembre y ajustar sobre la marcha cuando algún auditor no esté disponible.", "Reparte las auditorías de manera mecánica, sin considerar la disponibilidad de recursos y tiempo que exige el nivel B, y deja auditorías en diciembre, mes ya comprometido.", false], ["B", "repartir las 12 auditorías entre julio y noviembre según los auditores disponibles cada mes, previendo septiembre.", "El nivel B de Organización en el trabajo consiste en programar, a mediano plazo, la realización ordenada de actividades con base en la disponibilidad de recursos y tiempo, proyectando con acierto escenarios futuros.", true], ["C", "hacer seguimiento semanal al avance de cada auditoría frente a los indicadores del plan.", "Hacer seguimiento a las tareas a la luz de indicadores es una conducta del nivel C. Es útil durante la ejecución, pero no responde a la tarea de programar.", false]]}, {"id": "CO-126", "niv": 3, "e": "La tarea de planear cómo funcionará la oficina en los próximos cinco años, estructurando su programación con base en gestión de calidad, corresponde según el diccionario", "f": "Diccionario de Competencias Comportamentales PGN, Organización en el trabajo, nivel A", "o": [["A", "al nivel A de Organización en el trabajo, porque implica planear a largo plazo con base en calidad.", "El nivel A de Organización en el trabajo se define como planear, en escenarios de largo plazo, programas o eventos con base en objetivos y metas, y estructurar la programación de las actividades basada en gestión de calidad.", true], ["B", "al nivel B de Orientación a resultados, porque implica alcanzar y superar las metas de la dependencia.", "Orientación a resultados trata del logro de metas, no de la planeación y organización de las actividades; la tarea descrita corresponde a Organización en el trabajo.", false], ["C", "al nivel B de Organización en el trabajo, porque implica programar las metas estratégicas del área.", "El nivel B se refiere a escenarios de mediano plazo. La planeación a largo plazo, estructurada con base en gestión de calidad, la ubica el diccionario en el nivel A.", false]]}, {"id": "CO-127", "niv": 2, "e": "Para la técnica de la oficina, cuyo empleo exige el nivel D de Organización en el trabajo, la conducta que corresponde a su nivel es", "f": "Diccionario de Competencias Comportamentales PGN, Organización en el trabajo, nivel D", "o": [["A", "consultar con método la información que necesita y hacer sus tareas estandarizadas en menos tiempo.", "El nivel D de Organización en el trabajo incluye acceder a la información y los datos en forma sistemática para realizar el trabajo y realizar las actividades en forma estandarizada y en menores tiempos que los requeridos.", true], ["B", "seguir paso a paso las instrucciones que el jefe le da para cada tarea operativa.", "Describe el nivel D de otra competencia, Cumplimiento de parámetros de trabajo (aplicar instrucciones detalladas en tareas operativas), no de Organización en el trabajo.", false], ["C", "verificar que sus compañeros apliquen las normas de calidad en los papeles de trabajo de las auditorías.", "Verificar la aplicación de la normatividad sobre calidad en el trabajo de compañeros es una conducta del nivel C, superior al exigido para la técnica.", false]]}]}, {"comp": "comportamental", "rol": "profesional", "tag": "Competencias comportamentales (Diccionario de la Procuraduría) · Niveles profesional, asesor y ejecutivo · Cumplimiento de parámetros de trabajo", "texto": "Usted es profesional universitario de la dependencia de contratación de la Procuraduría y ejerce la supervisión de un contrato de mantenimiento de sedes. Su empleo exige Cumplimiento de parámetros de trabajo en nivel B. El manual de supervisión vigente exige un informe de actividades firmado antes de tramitar cada pago. El contratista entregó el trabajo del mes, pero pide que se tramite el pago sin el informe, porque tiene urgencia de liquidez. Usted coordina a dos técnicos que apoyan la revisión documental de la supervisión.", "items": [{"id": "CO-140", "niv": 1, "e": "Ante la petición del contratista, lo que mejor refleja el nivel B de Cumplimiento de parámetros de trabajo es", "f": "Diccionario de Competencias Comportamentales PGN, Cumplimiento de parámetros de trabajo, nivel B", "o": [["A", "tramitar el pago y pedir el informe después, para no afectar el servicio que presta el contratista.", "Se aparta del lineamiento del manual. La competencia consiste en aplicar en las labores la normatividad interna o externa.", false], ["B", "aplicar el manual y exigir el informe antes de tramitar el pago, explicando al contratista el requisito.", "El nivel B de Cumplimiento de parámetros de trabajo incluye seguir las reglas y los lineamientos establecidos para el desempeño dentro de los procesos organizacionales; el manual de supervisión es uno de ellos.", true], ["C", "consultar al jefe de la dependencia si, por esta vez, puede aceptar la entrega sin el informe.", "Pedir al jefe una excepción a una regla clara no refleja el nivel B, en el que el servidor sigue por sí mismo las reglas y lineamientos establecidos.", false]]}, {"id": "CO-141", "niv": 2, "e": "Para organizar el trabajo de los dos técnicos de apoyo, lo que refleja el nivel B de Cumplimiento de parámetros de trabajo es", "f": "Diccionario de Competencias Comportamentales PGN, Cumplimiento de parámetros de trabajo, nivel B", "o": [["A", "permitir que cada técnico organice la revisión como le resulte más ágil, siempre que entregue a tiempo.", "Deja de lado el alineamiento con el procedimiento, que es justamente lo que pide la segunda conducta del nivel B.", false], ["B", "redactar un nuevo procedimiento de supervisión para la entidad y ponerlo en práctica con ellos.", "Modificar los procedimientos de la entidad corresponde al nivel A de esta competencia, y diseñar métodos nuevos se relaciona con Creatividad e innovación.", false], ["C", "fijarles objetivos de revisión documental que sigan los pasos del manual de supervisión.", "Una de las conductas del nivel B de Cumplimiento de parámetros de trabajo es definir objetivos para su equipo alineados con los procedimientos definidos.", true]]}, {"id": "CO-142", "niv": 3, "e": "De las siguientes actuaciones del supervisor, la que el diccionario ubica en Cumplimiento de parámetros de trabajo, y no en Gestión de recursos, es", "f": "Diccionario de Competencias Comportamentales PGN, Cumplimiento de parámetros de trabajo, nivel B", "o": [["A", "ejecutar los recursos conforme a la normatividad y a las directivas, y supervisar los recursos asignados a la dependencia.", "Son las conductas del nivel B de Gestión de recursos, competencia que trata del uso eficiente de los recursos públicos.", false], ["B", "ceñirse a lo que dispone el manual de supervisión en cada etapa del contrato.", "Seguir las reglas y lineamientos establecidos para el desempeño dentro de los procesos organizacionales es una conducta del nivel B de Cumplimiento de parámetros de trabajo.", true], ["C", "racionalizar los recursos que le asignan para el desarrollo de sus tareas.", "Es una conducta del nivel D de Gestión de recursos, no de Cumplimiento de parámetros de trabajo.", false]]}]}, {"comp": "comportamental", "rol": "profesional", "tag": "Competencias comportamentales (Diccionario de la Procuraduría) · Niveles profesional, asesor y ejecutivo · Cumplimiento de parámetros de trabajo", "texto": "Usted es profesional universitario de la oficina de control disciplinario interno de la Procuraduría y su empleo exige Cumplimiento de parámetros de trabajo en nivel B. Sustancia procesos disciplinarios y, además, representa a la oficina en el comité del sistema de gestión de la entidad. La entidad acaba de adoptar un nuevo formato para los autos de apertura. El jefe de la oficina, cuyo empleo exige el nivel A de la misma competencia, advierte que el procedimiento interno de la oficina no está alineado con una política institucional adoptada recientemente.", "items": [{"id": "CO-164", "niv": 3, "e": "Como participa en dos procesos distintos, lo que refleja el nivel B de Cumplimiento de parámetros de trabajo es", "f": "Diccionario de Competencias Comportamentales PGN, Cumplimiento de parámetros de trabajo, nivel B", "o": [["A", "seguir en cada uno de los dos procesos las reglas y los lineamientos que lo rigen.", "El nivel B de Cumplimiento de parámetros de trabajo consiste en aplicar criterios para desempeñarse dentro de procesos organizacionales, siguiendo las reglas y lineamientos establecidos en cada uno.", true], ["B", "seguir en el comité las indicaciones del jefe y, en la sustanciación, los pasos que considere más eficientes.", "Sustituye los lineamientos por su propio criterio en la sustanciación y se limita a las pautas del jefe en el comité, lo que no refleja el nivel B.", false], ["C", "aplicar con rigor las reglas de la sustanciación, que es su función principal, y participar en el comité según su criterio.", "Aplica los lineamientos solo en uno de los procesos. El nivel B pide seguir las reglas y lineamientos en los diferentes procesos organizacionales en que participa.", false]]}, {"id": "CO-165", "niv": 1, "e": "Al proyectar un auto de apertura, lo que corresponde al nivel B de Cumplimiento de parámetros de trabajo es", "f": "Diccionario de Competencias Comportamentales PGN, Cumplimiento de parámetros de trabajo, nivel B", "o": [["A", "elaborar un formato propio que combine los dos y proponerlo como nuevo estándar.", "Crear instrumentos o procedimientos nuevos se relaciona con Creatividad e innovación; en esta competencia y nivel lo esperado es aplicar el lineamiento vigente.", false], ["B", "usar el formato anterior, que conoce mejor y contiene la misma información.", "Se aparta del lineamiento vigente; la competencia consiste en aplicar en las labores la normatividad interna.", false], ["C", "usar el nuevo formato adoptado por la entidad.", "En el nivel B de Cumplimiento de parámetros de trabajo el servidor sigue las reglas y los lineamientos establecidos para desempeñarse en los procesos organizacionales; el formato adoptado es uno de ellos.", true]]}, {"id": "CO-166", "niv": 3, "e": "Frente al desajuste entre el procedimiento y la política institucional, lo que corresponde al jefe de la oficina según el nivel A de Cumplimiento de parámetros de trabajo es", "f": "Diccionario de Competencias Comportamentales PGN, Cumplimiento de parámetros de trabajo, nivel A", "o": [["A", "modificar el procedimiento para alinearlo con la política y fijar lineamientos de desempeño.", "El nivel A de Cumplimiento de parámetros de trabajo incluye modificar los procedimientos de trabajo para alinearlos con las políticas y principios de la entidad y definir lineamientos para lograr y superar estándares de desempeño.", true], ["B", "seguir aplicando el procedimiento vigente hasta que otra dependencia lo actualice.", "Es una actitud pasiva que no corresponde al nivel A, cuya conducta es modificar los procedimientos para alinearlos con las políticas.", false], ["C", "pedir al equipo que aplique la nueva política de manera informal, sin cambiar el procedimiento escrito.", "Deja el procedimiento desalineado y crea prácticas por fuera de lo establecido; el nivel A pide ajustar formalmente el procedimiento.", false]]}]}];
const CFG = {"titulo": "Simulacro 1 · Profesional, asesor y ejecutivo · Procuraduría 2027", "modo": "simulacro", "minutos": 220, "componentes": {"estructura_pgn": "Estructura y funciones de la Procuraduría", "gestion_publica": "Gestión pública y funcionamiento del Estado", "atencion_usuario": "Atención al usuario", "gestion_documental": "Gestión documental", "documentos_oficina": "Elaboración de documentos de oficina", "ofimatica": "Herramientas ofimáticas", "sistemas_gestion": "Sistemas de gestión (MIPG, control interno y calidad)", "disciplinario": "Código General Disciplinario", "contratacion": "Contratación estatal", "anticorrupcion": "Estatuto Anticorrupción y transparencia", "comportamental": "Competencias comportamentales (Diccionario de la Procuraduría)"}, "niveles": {"1": "Básico", "2": "Intermedio", "3": "Avanzado"}, "roles": {"general": "Todos los niveles", "tecnico": "Niveles técnico, administrativo y operativo", "profesional": "Niveles profesional, asesor y ejecutivo"}, "clave": "profesional-01.html"};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY = 'sim-pgn:' + CFG.clave;
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}
function save(){try{localStorage.setItem(KEY, JSON.stringify(ST))}catch(e){}}
let ST = load();
ST.r = ST.r || {};
$('#tit').textContent = CFG.titulo;
const ITEMS = [];
DATA.forEach(c => c.items.forEach(it => { it.caso = c; ITEMS.push(it); }));

function justHTML(it){
  return '<div class="just">' + it.o.map(o => `<div><b>${o[0]}.</b> <span class="${o[3]?'okt':'not'}">${o[3]?'Es correcta.':'Es incorrecta.'}</span> ${esc(o[2])}</div>`).join('') +
    `<div class="src">Referencia: ${esc(it.f)}</div></div>`;
}
function itemHTML(it, n, mode){
  const r = ST.r[it.id];
  const reveal = mode === 'review' || (CFG.modo === 'practica' && r);
  let h = `<div class="item" id="i-${it.id}"><p class="enun"><span class="n">${n}.</span> <span class="niv">${CFG.niveles[it.niv]}</span> ${esc(it.e)}</p>`;
  it.o.forEach(o => {
    let cls = '';
    if (reveal) { if (o[3]) cls = 'ok'; else if (r === o[0]) cls = 'no'; }
    else if (r === o[0]) cls = 'sel';
    h += `<button class="op ${cls}" data-id="${it.id}" data-l="${o[0]}" ${reveal?'disabled':''}><span class="l">${o[0]}.</span><span>${esc(o[1])}</span></button>`;
  });
  if (reveal) {
    if (mode === 'review') h += `<div class="${r===keyOf(it)?'res-ok':'res-no'}" style="font-size:14px;margin-top:4px">${r ? (r===keyOf(it)?'Respondiste ' + r + ': correcto.':'Respondiste ' + r + '. La respuesta correcta es ' + keyOf(it) + '.') : 'Sin responder. La respuesta correcta es ' + keyOf(it) + '.'}</div>`;
    h += justHTML(it);
  }
  return h + '</div>';
}
const keyOf = it => it.o.find(o => o[3])[0];

function renderList(list, mode){
  let h = '', last = null, n = 0;
  list.forEach(it => {
    n++;
    if (it.caso !== last) { last = it.caso; h += `<div class="caso"><div class="tag">${esc(it.caso.tag)}</div><p>${esc(it.caso.texto)}</p></div>`; }
    h += itemHTML(it, n, mode);
  });
  return h;
}

// ---------- PRÁCTICA ----------
let LIST = [];
let FILTRO = ST.f || {comp:'', niv:'', rol:''};
function practica(){
  const comps = Object.entries(CFG.componentes).map(([k,v]) => `<option value="${k}" ${FILTRO.comp===k?'selected':''}>${esc(v)}</option>`).join('');
  const nivs = Object.entries(CFG.niveles).map(([k,v]) => `<option value="${k}" ${FILTRO.niv===k?'selected':''}>${esc(v)}</option>`).join('');
  const list = ITEMS.filter(it => (!FILTRO.comp || it.caso.comp===FILTRO.comp) && (!FILTRO.niv || String(it.niv)===FILTRO.niv) && (!FILTRO.rol || it.caso.rol===FILTRO.rol || it.caso.rol==='general'));
  const resp = list.filter(it => ST.r[it.id]); const ok = resp.filter(it => ST.r[it.id]===keyOf(it));
  $('#main').innerHTML = `<div class="panel"><p style="margin-top:0">Elige un tema, tu nivel de empleo y la dificultad. Al responder verás de inmediato si acertaste y la explicación de cada opción.</p>
  <div class="row"><select id="fc"><option value="">Todos los temas</option>${comps}</select>
  <select id="fn"><option value="">Todas las dificultades</option>${nivs}</select>
  <select id="fr"><option value="">Todos los niveles de empleo</option>${['tecnico','profesional'].map(k => `<option value="${k}" ${FILTRO.rol===k?'selected':''}>${esc(CFG.roles[k])} (y temas comunes)</option>`).join('')}</select>
  <button class="btn sec" id="borrar">Borrar mis respuestas</button></div>
  <p class="stat" id="pst" style="margin-bottom:0">${list.length} preguntas · respondidas ${resp.length} · aciertos ${ok.length}${resp.length? ' (' + Math.round(100*ok.length/resp.length) + ' %)':''}</p></div>` + renderList(list, 'practica');
  $('#prog').textContent = `${ok.length}/${resp.length} aciertos`;
  ['fc','fn','fr'].forEach((id,i) => $('#'+id).onchange = e => { FILTRO[['comp','niv','rol'][i]] = e.target.value; ST.f = FILTRO; save(); practica(); });
  LIST = list;
  $('#borrar').onclick = () => { list.forEach(it => delete ST.r[it.id]); save(); practica(); };
}

// ---------- SIMULACRO ----------
let tick = null;
function inicio(){
  const n = ITEMS.length, cnt = {};
  ITEMS.forEach(it => cnt[it.caso.comp] = (cnt[it.caso.comp]||0) + 1);
  const h = Math.floor(CFG.minutos/60), m = CFG.minutos%60;
  $('#main').innerHTML = `<div class="panel"><h2 style="margin-top:0;color:var(--pri)">Instrucciones</h2>
  <p>Este simulacro tiene <b>${n} preguntas</b> en formato de caso: una situación, enunciados que se completan y tres opciones con una sola respuesta correcta.</p>
  <table>${Object.entries(cnt).map(([k,v]) => `<tr><td>${esc(CFG.componentes[k])}</td><td class="r">${v}</td></tr>`).join('')}</table>
  <p>Tiempo sugerido: <b>${h ? h + ' h ' : ''}${m ? m + ' min' : ''}</b> (unos ${Math.round(CFG.minutos*60/n/6)/10} minutos por pregunta). Cuando se acaba el tiempo puedes seguir, pero el cronómetro lo indica.</p>
  <p>Tus respuestas se guardan en este navegador. Al terminar verás tu puntaje por componente y por dificultad, y la explicación de cada pregunta.</p>
  <button class="btn" id="go">${ST.t0 ? 'Continuar el simulacro' : 'Comenzar'}</button></div>`;
  $('#prog').textContent = `${n} preguntas`;
  $('#go').onclick = () => { if (!ST.t0) { ST.t0 = Date.now(); save(); } examen(); };
}
function reloj(){
  const rest = CFG.minutos*60 - Math.floor((Date.now() - ST.t0)/1000);
  const a = Math.abs(rest), hh = Math.floor(a/3600), mm = Math.floor(a%3600/60), ss = a%60;
  const t = (rest < 0 ? '+' : '') + (hh ? hh + ':' : '') + String(mm).padStart(2,'0') + ':' + String(ss).padStart(2,'0');
  $('#timer').textContent = rest < 0 ? 'Tiempo cumplido ' + t : '⏱ ' + t;
  $('#timer').classList.toggle('low', rest < 600);
}
function examen(){
  $('#main').innerHTML = renderList(ITEMS, 'examen') + `<div class="panel"><button class="btn" id="fin">Terminar y calificar</button></div>`;
  progreso(); reloj(); clearInterval(tick); tick = setInterval(reloj, 1000);
  $('#fin').onclick = () => {
    const faltan = ITEMS.length - Object.keys(ST.r).filter(k => ITEMS.some(i => i.id===k)).length;
    $('#mtxt').textContent = faltan ? `Te faltan ${faltan} preguntas por responder. ¿Quieres calificar de todos modos?` : '¿Quieres terminar y ver tu calificación?';
    $('#modal').classList.remove('hide');
  };
}
function progreso(){
  const r = ITEMS.filter(it => ST.r[it.id]).length;
  $('#prog').textContent = `Respondidas ${r}/${ITEMS.length}`;
}
$('#mno').onclick = () => $('#modal').classList.add('hide');
$('#msi').onclick = () => { $('#modal').classList.add('hide'); ST.fin = Date.now(); save(); resultados(); };
function resultados(){
  clearInterval(tick);
  const ok = ITEMS.filter(it => ST.r[it.id] === keyOf(it)).length;
  const pct = Math.round(1000*ok/ITEMS.length)/10;
  const g = (fn, lab) => { const m = {}; ITEMS.forEach(it => { const k = fn(it); m[k] = m[k] || [0,0]; m[k][1]++; if (ST.r[it.id]===keyOf(it)) m[k][0]++; });
    return Object.entries(m).map(([k,v]) => `<tr><td>${esc(lab(k))}</td><td class="r">${v[0]}/${v[1]}</td><td class="r">${Math.round(100*v[0]/v[1])} %</td></tr>`).join(''); };
  const mins = Math.round(((ST.fin||Date.now()) - ST.t0)/60000);
  $('#timer').textContent = `Tiempo usado: ${Math.floor(mins/60) ? Math.floor(mins/60) + ' h ' : ''}${mins%60} min`;
  $('#prog').textContent = `${ok}/${ITEMS.length} aciertos`;
  $('#main').innerHTML = `<div class="panel"><div class="big">${String(pct).replace('.',',')} %</div>
  <p style="margin-top:4px">${ok} de ${ITEMS.length} respuestas correctas. ${pct >= 75 ? 'Muy buen resultado: repasa las explicaciones de tus errores para afianzarlo.' : pct >= 65 ? 'Vas bien, pero con poco margen: refuerza los componentes con menor porcentaje.' : 'Todavía no estás en zona segura: practica por tema los componentes con menor porcentaje.'}</p>
  <p class="aviso">Referencia: en el concurso de la Procuraduría la prueba de conocimientos es eliminatoria con mínimo de 65 puntos sobre 100, y la comportamental es clasificatoria. Este porcentaje de aciertos es una guía de preparación; la calificación oficial usa una escala estándar que compara a los aspirantes.</p>
  <h3>Por componente</h3><table>${g(it => it.caso.comp, k => CFG.componentes[k])}</table>
  <h3>Por dificultad</h3><table>${g(it => it.niv, k => CFG.niveles[k])}</table>
  <div class="row" style="margin-top:14px"><button class="btn" id="solo">Ver solo mis errores</button><button class="btn sec" id="todas">Ver todas</button><button class="btn sec" id="otra">Reiniciar el simulacro</button></div></div><div id="rev"></div>`;
  const rev = errs => { const l = errs ? ITEMS.filter(it => ST.r[it.id] !== keyOf(it)) : ITEMS; $('#rev').innerHTML = renderList(l, 'review'); };
  rev(true);
  $('#solo').onclick = () => rev(true); $('#todas').onclick = () => rev(false);
  $('#otra').onclick = () => { ST = {r:{}}; save(); inicio(); window.scrollTo(0,0); };
}

document.addEventListener('click', e => {
  const b = e.target.closest('button.op'); if (!b || b.disabled) return;
  ST.r[b.dataset.id] = b.dataset.l; save();
  const it = ITEMS.find(i => i.id === b.dataset.id);
  const n = b.closest('.item').querySelector('.n').textContent.replace('.','');
  b.closest('.item').outerHTML = itemHTML(it, n, CFG.modo === 'practica' ? 'practica' : 'examen');
  if (CFG.modo === 'practica') { const resp = LIST.filter(i => ST.r[i.id]); const ok = resp.filter(i => ST.r[i.id]===keyOf(i)).length; $('#prog').textContent = `${ok}/${resp.length} aciertos`; $('#pst').textContent = `${LIST.length} preguntas · respondidas ${resp.length} · aciertos ${ok} (${Math.round(100*ok/resp.length)} %)`; }
  else progreso();
});

if (CFG.modo === 'practica') practica();
else if (ST.fin) resultados();
else if (ST.t0) examen();
else inicio();
</script>
