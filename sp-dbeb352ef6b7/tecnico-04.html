<title>Simulacro 4 · Técnico, administrativo y operativo · Procuraduría 2027</title>
<style>body{overflow-wrap:anywhere}
:root{--bg:#f6f8fb;--card:#fff;--ink:#1d2433;--mute:#5a6478;--line:#dbe1ea;--pri:#0b3d6e;--pri2:#1660a8;--ok:#0d6b3a;--okbg:#e6f4ec;--no:#9b1c1c;--nobg:#fbeaea;--sel:#e8f0fa}
@media (prefers-color-scheme: dark){:root{--bg:#10151d;--card:#18202b;--ink:#e6ebf2;--mute:#9aa6b8;--line:#2a3545;--pri:#7fb3ea;--pri2:#9cc6f2;--ok:#7fd3a3;--okbg:#16301f;--no:#f2a3a3;--nobg:#3a1c1c;--sel:#1e2d40}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px}
.hwrap{max-width:860px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
h1{font-size:17px;margin:0;color:var(--pri)}
.stat{font-size:14px;color:var(--mute)}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--pri)}
.timer.low{color:var(--no)}
main{max-width:860px;margin:0 auto;padding:16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin:0 0 16px}
.caso{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--pri);border-radius:10px;padding:14px 16px;margin:22px 0 10px}
.tag{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--pri);font-weight:700}
.caso p{margin:6px 0 0;white-space:pre-line}
.item{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0}
.enun{margin:0 0 8px}
.n{font-weight:700;color:var(--pri)}
.niv{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-right:4px;white-space:nowrap}
.op{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:6px 0;cursor:pointer;background:transparent;width:100%;text-align:left;color:inherit;font:inherit}
.op:hover{border-color:var(--pri2)}
.op .l{font-weight:700;min-width:20px}
.op.sel{background:var(--sel);border-color:var(--pri2)}
.op.ok{background:var(--okbg);border-color:var(--ok)}
.op.no{background:var(--nobg);border-color:var(--no)}
.op[disabled]{cursor:default}
.just{font-size:14px;margin:8px 0 0;padding:8px 10px;border-top:1px dashed var(--line)}
.just div{margin:4px 0}
.just .okt{color:var(--ok);font-weight:700}
.just .not{color:var(--no);font-weight:700}
.src{font-size:13px;color:var(--mute);margin-top:6px}
button.btn{background:var(--pri);color:var(--card);border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer}
button.btn.sec{background:transparent;color:var(--pri);border:1px solid var(--pri)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
select{font:inherit;padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);max-width:100%}
table{border-collapse:collapse;width:100%;font-size:15px}
td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
.big{font-size:40px;font-weight:800;color:var(--pri);line-height:1.1}
.aviso{font-size:13px;color:var(--mute)}
.hide{display:none !important}
.res-ok{color:var(--ok);font-weight:700}.res-no{color:var(--no);font-weight:700}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal .panel{max-width:420px}
footer{max-width:860px;margin:0 auto;padding:8px 16px 40px;font-size:12px;color:var(--mute)}
</style>
</head>

<footer><a href="./" style="color:var(--pri);font-weight:600">← Volver al menú</a><br><br>Material de preparación independiente. No está afiliado a la Procuraduría General de la Nación, a la Universidad de Antioquia ni a ninguna entidad pública, y no contiene preguntas reales de la prueba.</footer>
<script>
const DATA = [{"comp": "estructura_pgn", "rol": "general", "tag": "Estructura y funciones de la Procuraduría · Funciones de los artículos 277 y 278", "texto": "En el despacho del Procurador General se reciben el mismo día tres asuntos: una demanda de inconstitucionalidad que la Corte Constitucional remite para concepto; la solicitud de una veeduría para que la Procuraduría intervenga en un proceso contencioso en el que se discute la nulidad de un contrato que compromete recursos públicos, y una nota del Viceprocurador que recuerda la fecha en que debe presentarse el informe de gestión ante el Congreso. Un asesor nuevo propone delegar todo en las procuradurías delegadas para descongestionar el despacho.", "items": [{"id": "PG-107", "niv": 2, "e": "Respecto del concepto en el proceso de constitucionalidad, la propuesta del asesor es", "f": "Constitución Política, art. 278 num. 5; Decreto Ley 262 de 2000, arts. 7 parágrafo y 8 num. 1", "o": [["A", "procedente, siempre que el concepto lo firme un procurador judicial con categoría equivalente a la de los magistrados de la Corte Constitucional.", "La equiparación del artículo 280 se refiere a los agentes ante los jueces, pero no habilita a nadie distinto del Procurador para rendir el concepto del artículo 278, num. 5, de la Constitución.", false], ["B", "procedente, porque las funciones de intervención ante las altas cortes pueden asignarse a cualquier procurador delegado.", "El concepto de constitucionalidad no es una intervención ordinaria del artículo 277: está en el artículo 278 de la Constitución, cuyas funciones el Procurador ejerce directamente (parágrafo del art. 7 del Decreto Ley 262 de 2000).", false], ["C", "improcedente, pues esa función no admite delegación, aunque una dependencia del despacho proyecte el texto.", "El artículo 278, num. 5, de la Constitución asigna al Procurador el ejercicio directo de la función de rendir concepto en los procesos de control de constitucionalidad. El artículo 8, num. 1, del Decreto Ley 262 de 2000 encarga a la Procuraduría Auxiliar para Asuntos Constitucionales proyectar esos conceptos para consideración del Procurador.", true]]}, {"id": "PG-108", "niv": 2, "e": "De las siguientes funciones, la que el Procurador puede ejercer por medio de sus delegados y agentes es", "f": "Constitución Política, arts. 277 num. 7 y 278 nums. 2 y 3", "o": [["A", "intervenir en el proceso contencioso sobre la nulidad del contrato, en defensa del orden jurídico y del patrimonio público.", "El artículo 277, num. 7, de la Constitución permite al Procurador, por sí o por medio de sus delegados y agentes, intervenir en los procesos ante autoridades judiciales cuando sea necesario en defensa del orden jurídico, del patrimonio público o de los derechos fundamentales.", true], ["B", "presentar proyectos de ley sobre materias relativas a su competencia.", "Presentar proyectos de ley es una función que el Procurador ejerce directamente (art. 278, num. 3, de la Constitución).", false], ["C", "emitir conceptos en los procesos disciplinarios contra funcionarios sometidos a fuero especial.", "Esta función figura en el artículo 278, num. 2, de la Constitución, entre las que el Procurador ejerce directamente.", false]]}, {"id": "PG-109", "niv": 1, "e": "Sobre el informe que recuerda el Viceprocurador, la Constitución establece que el Procurador debe rendir informe de su gestión al Congreso", "f": "Constitución Política, art. 277 num. 8; Decreto Ley 262 de 2000, art. 17 num. 10", "o": [["A", "al terminar su periodo de cuatro años.", "El artículo 277, num. 8, de la Constitución no prevé un único informe al final del periodo, sino uno cada año.", false], ["B", "anualmente.", "El artículo 277, num. 8, de la Constitución ordena rendir anualmente informe de gestión al Congreso; el artículo 17, num. 10, del Decreto Ley 262 de 2000 encarga al Viceprocurador coordinar su elaboración.", true], ["C", "cada semestre, ante la Comisión Primera del Senado.", "La periodicidad constitucional es anual y el destinatario es el Congreso (art. 277, num. 8); la norma no habla de informes semestrales ante una comisión.", false]]}]}, {"comp": "estructura_pgn", "rol": "general", "tag": "Estructura y funciones de la Procuraduría · Agentes del Ministerio Público e intervención judicial", "texto": "Una procuradora judicial II actúa como agente del Ministerio Público ante un tribunal administrativo. Un abogado litigante cuestiona en una audiencia que ella tenga el mismo trato y categoría de los magistrados. Días después, la procuradora delegada que coordina la intervención en ese ramo advierte que en un proceso penal de gran impacto en un municipio interviene el personero municipal y considera necesario que actúe en su lugar un procurador judicial. Además, un nuevo sustanciador pregunta si los procuradores judiciales también intervienen en trámites de conciliación.", "items": [{"id": "PG-116", "niv": 2, "e": "Frente al cuestionamiento del abogado litigante, es correcto afirmar que los agentes del Ministerio Público", "f": "Constitución Política, art. 280", "o": [["A", "tienen la categoría de los jueces de circuito aunque actúen ante un tribunal, porque así lo dispone la planta de personal de la Procuraduría.", "El artículo 280 de la Constitución toma como referencia a los magistrados y jueces de mayor jerarquía ante quienes el agente ejerce; ante un tribunal, la equiparación es con sus magistrados.", false], ["B", "tienen la categoría que determine en cada caso el Procurador General, según la importancia del proceso.", "La categoría de los agentes no depende de una decisión caso a caso: el artículo 280 de la Constitución la fija por equiparación con los magistrados y jueces ante quienes actúan.", false], ["C", "están equiparados en calidades, rango, salario y prestaciones a los magistrados y jueces de mayor jerarquía ante quienes actúan.", "Es la regla del artículo 280 de la Constitución, que equipara a los agentes del Ministerio Público con los magistrados y jueces de mayor jerarquía ante quienes actúan.", true]]}, {"id": "PG-117", "niv": 3, "e": "Respecto del proceso penal en el que interviene el personero, la procuradora delegada coordinadora", "f": "Decreto Ley 262 de 2000, art. 36; Ley 136 de 1994, art. 178", "o": [["A", "puede apartar al personero de esa intervención y disponer que actúe un procurador judicial.", "El artículo 36 del Decreto Ley 262 de 2000 permite a los procuradores delegados con funciones de coordinación de la intervención judicial desplazar a los personeros distritales y municipales, ordenando la intervención de procuradores judiciales.", true], ["B", "debe pedir al concejo municipal que designe un personero ad hoc para ese proceso.", "No existe ese trámite. El artículo 36 del Decreto Ley 262 de 2000 permite a la delegada desplazar directamente al personero y ordenar la intervención de un procurador judicial.", false], ["C", "no puede intervenir, porque las personerías tienen autonomía y el personero solo responde ante el concejo que lo eligió.", "La autonomía de las personerías no impide la coordinación de la intervención judicial: el artículo 36 del Decreto Ley 262 de 2000 permite a los delegados coordinadores desplazar a los personeros en esa función, y el personero actúa bajo la dirección suprema del Procurador (art. 178 de la Ley 136 de 1994).", false]]}, {"id": "PG-118", "niv": 1, "e": "A la pregunta del sustanciador, la respuesta acorde con el Decreto Ley 262 de 2000 es que los procuradores judiciales", "f": "Decreto Ley 262 de 2000, arts. 37 y 41", "o": [["A", "intervienen en la conciliación judicial, pero la conciliación extrajudicial está a cargo exclusivamente de los centros de conciliación.", "Los procuradores judiciales intervienen en los trámites de conciliación (art. 41 del Decreto Ley 262 de 2000), y los de lo contencioso administrativo tienen funciones de conciliación, incluida la extrajudicial (art. 37, adicionado por la Ley 1367 de 2009, y art. 44, parágrafo, num. 4).", false], ["B", "son agentes del Ministerio Público y su labor incluye, entre otras, actuar en los trámites conciliatorios.", "El artículo 41 del Decreto Ley 262 de 2000 dispone que los procuradores judiciales son agentes del Ministerio Público, intervienen ante las autoridades judiciales y también en los trámites de conciliación; el artículo 37 les asigna funciones de conciliación en lo contencioso administrativo.", true], ["C", "intervienen en conciliaciones solo cuando el juez los designa como conciliadores particulares.", "Su intervención en conciliación deriva de la ley y de su condición de agentes del Ministerio Público (arts. 37 y 41 del Decreto Ley 262 de 2000), no de una designación como conciliadores particulares.", false]]}]}, {"comp": "estructura_pgn", "rol": "general", "tag": "Estructura y funciones de la Procuraduría · Funciones del Procurador General y comisiones especiales", "texto": "Una procuraduría regional adelanta una investigación por la caída de un puente construido con recursos departamentales que causó varias víctimas. Por la conmoción nacional, el Procurador General considera asumir personalmente el proceso. Como alternativa, su asesor propone crear una comisión disciplinaria especial integrada por servidores de la Procuraduría. Al mismo tiempo, la Secretaría General solicita trasladar dos cargos de sustanciador de la planta globalizada desde el nivel central hacia esa regional para atender la congestión.", "items": [{"id": "PG-134", "niv": 3, "e": "Sobre la posibilidad de que el Procurador asuma personalmente el proceso, es correcto afirmar que", "f": "Decreto Ley 262 de 2000, arts. 7 num. 16 y parágrafo, 25 parágrafo 2 y 77 (modificados por el Decreto Ley 1851 de 2021)", "o": [["A", "puede hacerlo cuando la importancia o trascendencia del asunto requiera su atención personal.", "El artículo 7, num. 16, del Decreto Ley 262 de 2000, modificado por el Decreto Ley 1851 de 2021, faculta al Procurador para asumir el conocimiento de procesos disciplinarios cuando la importancia o trascendencia del asunto lo requieran; el parágrafo del mismo artículo le permite asumir en cualquier momento las funciones asignadas a otras dependencias.", true], ["B", "requiere concepto previo favorable del Comité Técnico de la función disciplinaria, como ocurre con las procuradurías delegadas.", "El concepto del Comité Técnico es requisito para que las procuradurías delegadas ejerzan competencia preferente sobre las territoriales (art. 25, parágrafo 2), no para que el Procurador General asuma un asunto.", false], ["C", "solo puede hacerlo si el investigado lo solicita, para garantizar el juez natural.", "La facultad del artículo 7, num. 16, no depende de una solicitud del investigado; la petición del investigado es relevante, por ejemplo, para el cambio de radicación (art. 77), que es una figura distinta.", false]]}, {"id": "PG-135", "niv": 3, "e": "Si el Procurador opta por la comisión disciplinaria especial, el fallo será proferido por", "f": "Decreto Ley 262 de 2000, art. 7 num. 18 (modificado por el art. 2 del Decreto Ley 1851 de 2021)", "o": [["A", "el procurador regional desplazado, que conserva la competencia para decidir.", "Al crearse la comisión especial, el funcionario desplazado pierde el conocimiento; el fallo lo profiere quien presida la comisión o el funcionario designado (art. 7, num. 18).", false], ["B", "quien presida la comisión o el funcionario designado para juzgar, siempre que no tenga menor rango que el desplazado.", "Así lo dispone el artículo 7, num. 18, del Decreto Ley 262 de 2000, modificado por el Decreto Ley 1851 de 2021.", true], ["C", "cualquiera de los integrantes de la comisión, sin importar su jerarquía, porque la designación especial suple la competencia.", "El artículo 7, num. 18, exige que quien falle sea de igual o superior jerarquía que el funcionario desplazado.", false]]}, {"id": "PG-136", "niv": 1, "e": "La decisión de reubicar los cargos de sustanciador de la planta globalizada en la procuraduría regional corresponde a", "f": "Decreto Ley 262 de 2000, arts. 7 num. 34 y 87", "o": [["A", "el procurador regional que recibirá los cargos.", "Los procuradores regionales no distribuyen la planta de la entidad; esa función es del Procurador General (art. 7, num. 34, del Decreto Ley 262 de 2000).", false], ["B", "el jefe de la División de Gestión Humana, mediante acto de traslado.", "El traslado de un servidor es una figura distinta (art. 87); distribuir y reubicar los empleos de la planta globalizada es función del Procurador General (art. 7, num. 34).", false], ["C", "el Procurador General.", "El artículo 7, num. 34, del Decreto Ley 262 de 2000, modificado por el Decreto Ley 1851 de 2021, asigna al Procurador distribuir y reubicar los empleos de la planta de personal globalizada entre las dependencias, según las necesidades del servicio.", true]]}]}, {"comp": "estructura_pgn", "rol": "general", "tag": "Estructura y funciones de la Procuraduría · Procuradurías provinciales y regionales: funciones comunes", "texto": "La procuradora provincial de un municipio intermedio enfrenta tres situaciones. En el circuito judicial no hay procurador judicial y se adelanta un proceso en el que es necesario intervenir para defender el patrimonio público. Además, el personero municipal y ella se declaran ambos competentes para instruir una actuación disciplinaria contra un inspector de policía. Por último, un auxiliar recién vinculado pregunta quién es el superior directo de la procuradora provincial.", "items": [{"id": "PG-155", "niv": 1, "e": "A la pregunta del auxiliar, la respuesta acorde con el Decreto Ley 262 de 2000 es que los procuradores provinciales dependen directamente", "f": "Decreto Ley 262 de 2000, art. 80", "o": [["A", "del Viceprocurador General, que coordina el nivel territorial.", "El artículo 80 del Decreto Ley 262 de 2000 no asigna esa dependencia al Viceprocurador.", false], ["B", "del procurador regional respectivo.", "El artículo 80 del Decreto Ley 262 de 2000 dispone que los procuradores provinciales dependen directamente de los respectivos procuradores regionales; los regionales y distritales dependen del Procurador General.", true], ["C", "del Procurador General de la Nación, como los procuradores regionales y distritales.", "Del Procurador General dependen directamente los regionales y distritales; los provinciales dependen del regional (art. 80).", false]]}, {"id": "PG-156", "niv": 2, "e": "Respecto del proceso judicial en el circuito donde no hay procurador judicial, la procuradora provincial", "f": "Decreto Ley 262 de 2000, art. 76B num. 5 (adicionado por el art. 24 del Decreto Ley 1851 de 2021)", "o": [["A", "puede intervenir eventualmente como Ministerio Público, previa comunicación al procurador delegado correspondiente.", "El artículo 76B, num. 5, del Decreto Ley 262 de 2000, adicionado por el artículo 24 del Decreto Ley 1851 de 2021, permite a las provinciales intervenir eventualmente como Ministerio Público en asuntos de los procuradores judiciales donde estos no existan o no puedan actuar, previa comunicación al delegado.", true], ["B", "no puede intervenir, porque esa función es exclusiva de los procuradores judiciales.", "El artículo 76B, num. 5, prevé precisamente la intervención eventual de las provinciales cuando no existen procuradores judiciales o no pueden actuar.", false], ["C", "debe pedir al juez que designe un curador ad litem que represente el interés público.", "El curador ad litem no reemplaza al Ministerio Público; la norma prevé la intervención eventual de la procuraduría provincial (art. 76B, num. 5).", false]]}, {"id": "PG-157", "niv": 2, "e": "El conflicto de competencia entre el personero y la procuradora provincial, en etapa de instrucción, lo dirime", "f": "Decreto Ley 262 de 2000, arts. 22 num. 1 y 75 num. 10 (modificados por el Decreto Ley 1851 de 2021)", "o": [["A", "la Sala Disciplinaria de Instrucción del nivel central.", "La Sala de Instrucción resuelve conflictos en los procesos de las delegadas de instrucción (art. 22, num. 1, lit. b), no entre personeros y provinciales.", false], ["B", "el concejo municipal, como autoridad que eligió al personero.", "El concejo no tiene competencia para resolver conflictos de competencia disciplinaria; la norma la asigna a la procuraduría regional de instrucción (art. 75, num. 10).", false], ["C", "la procuraduría regional de instrucción correspondiente.", "El artículo 75, num. 10, del Decreto Ley 262 de 2000, modificado por el artículo 19 del Decreto Ley 1851 de 2021, asigna a las regionales de instrucción dirimir los conflictos de competencia entre los personeros y los procuradores provinciales en etapa de instrucción.", true]]}]}, {"comp": "estructura_pgn", "rol": "general", "tag": "Estructura y funciones de la Procuraduría · Lista de elegibles", "texto": "Terminado un concurso de méritos de la Procuraduría para el empleo de profesional universitario, el puntaje máximo posible era de 100 puntos. Los resultados consolidados de cuatro concursantes fueron: 82,4; 74,1; 70,0 y 68,9 puntos. Un concursante pregunta en la Oficina de Selección y Carrera cuál es el puntaje mínimo para integrar la lista, cuánto tiempo estará vigente esta y en qué plazo debe producirse el nombramiento de quien ocupe el primer lugar en un empleo que ya estaba vacante al convocarse el concurso.", "items": [{"id": "PG-176", "niv": 1, "e": "Con un puntaje máximo posible de 100 puntos, el puntaje total mínimo para integrar la lista de elegibles es", "f": "Decreto Ley 262 de 2000, art. 216", "o": [["A", "65 puntos.", "El 65 sobre 100 es el mínimo aprobatorio de la prueba de conocimientos en la convocatoria (Resolución 076 de 2026), no el umbral legal para integrar la lista de elegibles, que es el 70 % del puntaje total máximo (art. 216 del Decreto Ley 262 de 2000).", false], ["B", "70 puntos.", "El artículo 216 del Decreto Ley 262 de 2000 dispone que integran la lista quienes obtengan un puntaje total igual o superior al 70 % del máximo posible: 70 % de 100 es 70. Por eso integran la lista los tres primeros concursantes, incluido quien obtuvo exactamente 70,0.", true], ["C", "75 puntos.", "No corresponde al porcentaje legal del 70 % del puntaje máximo posible (art. 216).", false]]}, {"id": "PG-177", "niv": 2, "e": "La lista de elegibles tendrá una vigencia de", "f": "Decreto Ley 262 de 2000, art. 216", "o": [["A", "un año contado desde la posesión del primero de la lista.", "La vigencia es de dos años y se cuenta desde la publicación de la lista (art. 216).", false], ["B", "cuatro años, igual al periodo del Procurador que la expidió.", "La vigencia de la lista no está atada al periodo del Procurador; es de dos años desde su publicación (art. 216).", false], ["C", "dos años contados desde su publicación.", "El artículo 216 del Decreto Ley 262 de 2000 dispone que la lista, elaborada en riguroso orden de mérito, tiene vigencia de dos años contados desde su publicación y debe estar contenida en resolución del Procurador General.", true]]}, {"id": "PG-178", "niv": 2, "e": "El nombramiento de quien ocupa el primer lugar, para el empleo que ya estaba vacante, debe producirse", "f": "Decreto Ley 262 de 2000, arts. 185, 190 y 217", "o": [["A", "dentro de los veinte días hábiles siguientes a la publicación de la lista.", "El artículo 217 del Decreto Ley 262 de 2000 ordena producir el nombramiento en periodo de prueba o en propiedad dentro de los veinte días hábiles siguientes a la publicación de la lista, salvo lo previsto en el artículo 190.", true], ["B", "en cualquier momento durante la vigencia de la lista.", "Para empleos vacantes al momento de la convocatoria, el artículo 217 fija un plazo de veinte días hábiles desde la publicación de la lista.", false], ["C", "dentro de los tres meses siguientes al cierre de inscripciones.", "El término de tres meses del artículo 185 se refiere a la convocatoria del concurso después de un encargo o una provisionalidad, no al nombramiento del elegible.", false]]}]}, {"comp": "estructura_pgn", "rol": "tecnico", "tag": "Estructura y funciones de la Procuraduría · Niveles técnico, administrativo y operativo · Reclamaciones en el concurso", "texto": "Usted es técnico de la Oficina de Selección y Carrera y atiende el buzón de reclamaciones de un concurso. Un aspirante figura como no admitido porque, según la verificación, no acreditó la experiencia requerida. Otra concursante advierte que, al sumar sus puntajes parciales, el resultado publicado tiene un error aritmético. Mientras tanto, su jefe le pide organizar el archivo de seguridad de los bancos de preguntas que se usarán en las pruebas.", "items": [{"id": "PG-179", "niv": 2, "e": "La reclamación del aspirante no admitido debe presentarse", "f": "Decreto Ley 262 de 2000, arts. 12 num. 10, 202 y 240 num. 8", "o": [["A", "dentro de los dos días hábiles siguientes a la publicación de la lista, ante el jefe de la Oficina de Selección y Carrera.", "El artículo 202 del Decreto Ley 262 de 2000 fija dos días hábiles para reclamar ante el jefe de la Oficina de Selección y Carrera, quien resuelve en cinco días hábiles; contra su decisión procede apelación ante la Comisión de Carrera (ver también arts. 12, num. 10, y 240, num. 8).", true], ["B", "dentro de los diez días hábiles siguientes a la publicación de la lista, directamente ante la Comisión de Carrera.", "El término es de dos días hábiles y la reclamación se presenta ante el jefe de la Oficina de Selección y Carrera; la Comisión de Carrera conoce en apelación (art. 202).", false], ["C", "en cualquier momento antes de la aplicación de la prueba escrita, mediante escrito dirigido al Procurador General de la Nación.", "La reclamación tiene un término preclusivo de dos días hábiles; si se presenta tarde se rechaza por extemporánea (art. 202).", false]]}, {"id": "PG-180", "niv": 3, "e": "La reclamación por el error aritmético la resuelve", "f": "Decreto Ley 262 de 2000, arts. 12 num. 9 y 212", "o": [["A", "el jurado calificador en primera instancia y la Comisión de Carrera en segunda instancia.", "Ese doble trámite aplica a las reclamaciones por estructura y contenido de las pruebas de pregunta abierta (art. 212), no a los errores aritméticos.", false], ["B", "la Comisión de Carrera, en única instancia, dentro de los diez días hábiles siguientes.", "La Comisión de Carrera no conoce de los errores aritméticos; los resuelve el jefe de la Oficina de Selección y Carrera (art. 12, num. 9, y art. 212).", false], ["C", "el jefe de la Oficina de Selección y Carrera, de plano y en única instancia.", "El artículo 212 del Decreto Ley 262 de 2000 dispone que las reclamaciones por errores aritméticos se presentan ante el jefe de la Oficina de Selección y Carrera, quien resuelve de plano, en única instancia, dentro de los cinco días hábiles siguientes; el artículo 12, num. 9, lo reitera.", true]]}, {"id": "PG-181", "niv": 1, "e": "La custodia de los bancos de preguntas construidos para las pruebas corresponde a", "f": "Decreto Ley 262 de 2000, arts. 12 num. 7, 13, 19 y 208", "o": [["A", "la Oficina de Control Interno.", "Control Interno verifica la gestión de las dependencias (art. 13), pero no custodia los bancos de preguntas.", false], ["B", "la Oficina de Selección y Carrera.", "El artículo 12, num. 7, del Decreto Ley 262 de 2000 asigna a la Oficina de Selección y Carrera custodiar los bancos de preguntas que se construyan para las pruebas; el artículo 208 dispone que las pruebas tienen carácter reservado.", true], ["C", "la División de Documentación.", "La División de Documentación conserva información normativa y documental de la entidad (art. 19), pero la custodia de los bancos de preguntas está asignada a la Oficina de Selección y Carrera (art. 12, num. 7).", false]]}]}, {"comp": "gestion_publica", "rol": "general", "tag": "Gestión pública y funcionamiento del Estado · Principios de la función administrativa", "texto": "Usted es técnico administrativo de la secretaría de tránsito de un distrito. En una misma semana ocurre lo siguiente: el coordinador de la ventanilla ordena atender primero, sin turno, a los usuarios que lleguen recomendados por concejales; la secretaría expidió una resolución con nuevas tarifas de los parqueaderos oficiales para vehículos inmovilizados y empezó a cobrarlas sin haberla publicado ni dado a conocer; y un usuario le pregunta qué figuras prevé la Constitución para distribuir el trabajo y las decisiones entre el secretario y otros servidores u organismos.", "items": [{"id": "GE-111", "niv": 1, "e": "La orden del coordinador de atender primero a los recomendados desconoce principalmente", "f": "Constitución Política, art. 209; Ley 1437 de 2011, art. 3", "o": [["A", "el principio de publicidad, porque los demás usuarios no conocen el orden de atención.", "La publicidad exige dar a conocer las actuaciones; aunque el orden se publicara, seguiría siendo un favoritismo contrario a la imparcialidad.", false], ["B", "el principio de economía, porque altera el uso racional del tiempo de los funcionarios.", "El principio de economía se refiere al uso eficiente de tiempo y recursos. El problema central de la orden es el trato preferente por razones de afecto o interés, propio de la imparcialidad.", false], ["C", "el principio de imparcialidad, porque introduce un trato preferente por razones ajenas al interés general.", "El artículo 209 de la Constitución incluye la imparcialidad entre los principios de la función administrativa, y el artículo 3 del CPACA la explica como actuar sin consideración de factores de afecto o de interés, garantizando los derechos de todas las personas sin discriminación.", true]]}, {"id": "GE-112", "niv": 2, "e": "El cobro de las nuevas tarifas sin haber dado a conocer la resolución contraría", "f": "Constitución Política, art. 209; Ley 1437 de 2011, arts. 3 y 65", "o": [["A", "el principio de celeridad, porque la resolución se expidió sin respetar los términos de trámite.", "El caso no menciona demoras ni términos incumplidos; la falla consiste en exigir una decisión que no se ha dado a conocer.", false], ["B", "el principio de publicidad, porque las decisiones deben darse a conocer para ser exigibles.", "La publicidad es principio de la función administrativa (art. 209 de la Constitución). El CPACA (art. 3, num. 9) ordena dar a conocer las decisiones mediante comunicaciones, notificaciones o publicaciones, y los actos de carácter general no son obligatorios mientras no se publiquen (art. 65).", true], ["C", "el principio de eficacia, porque los cobros no lograrán su finalidad de recaudo.", "La eficacia busca que los procedimientos logren su finalidad; el defecto descrito no es de resultado sino de falta de divulgación de la decisión, propio del principio de publicidad.", false]]}, {"id": "GE-113", "niv": 2, "e": "Al usuario que pregunta por las figuras para distribuir funciones, usted le indica que el artículo 209 de la Constitución menciona", "f": "Constitución Política, art. 209", "o": [["A", "la descentralización, la delegación y la desconcentración de funciones.", "El artículo 209 de la Constitución dispone que la función administrativa se desarrolla mediante la descentralización, la delegación y la desconcentración de funciones.", true], ["B", "la avocación, la subrogación y la sustitución de competencias entre servidores.", "Ninguna de esas figuras aparece en el artículo 209; además, la avocación y la sustitución no son mecanismos ordinarios para distribuir funciones administrativas.", false], ["C", "la tercerización, la concesión y la comisión de servicios.", "La concesión es un contrato y la comisión una situación administrativa del empleado; ninguna es mencionada por el artículo 209 como forma de desarrollar la función administrativa.", false]]}]}, {"comp": "gestion_publica", "rol": "general", "tag": "Gestión pública y funcionamiento del Estado · Organización territorial y autonomía", "texto": "Usted es profesional universitario de una procuraduría regional y acompaña un foro con concejales de varios municipios del departamento sobre organización territorial. Durante el foro surgen tres inquietudes: un concejal afirma que los corregimientos y las comunas de su municipio son entidades territoriales con los mismos derechos que el municipio; otro pregunta qué derechos concretos les da la autonomía que reconoce la Constitución; y un tercero pide precisar qué lugar ocupa el municipio en la organización del Estado.", "items": [{"id": "GE-124", "niv": 1, "e": "Según la Constitución, son entidades territoriales", "f": "Constitución Política, art. 286", "o": [["A", "los departamentos, los municipios, los corregimientos y las comunas.", "Los corregimientos y las comunas son divisiones administrativas internas del municipio, no entidades territoriales (art. 286 de la Constitución).", false], ["B", "los departamentos, los municipios, las áreas metropolitanas y las asociaciones de municipios.", "Las áreas metropolitanas y las asociaciones de municipios son formas de organización o asociación entre municipios, pero la Constitución no las enumera como entidades territoriales (art. 286).", false], ["C", "los departamentos, los distritos, los municipios y los territorios indígenas.", "El artículo 286 de la Constitución dispone que son entidades territoriales los departamentos, los distritos, los municipios y los territorios indígenas, y que la ley podrá dar ese carácter a las regiones y provincias que se constituyan.", true]]}, {"id": "GE-125", "niv": 2, "e": "Entre los derechos que la autonomía otorga a las entidades territoriales se encuentra el de", "f": "Constitución Política, art. 287", "o": [["A", "dictar sus propias leyes en las materias que el Congreso de la República no haya regulado todavía.", "Las entidades territoriales no expiden leyes: asambleas y concejos dictan ordenanzas y acuerdos sujetos a la Constitución y la ley. La función legislativa corresponde al Congreso.", false], ["B", "administrar sus recursos y establecer los tributos necesarios para cumplir sus funciones.", "El artículo 287 de la Constitución reconoce a las entidades territoriales, dentro de los límites de la Constitución y la ley, los derechos a gobernarse por autoridades propias, ejercer las competencias que les correspondan, administrar los recursos y establecer los tributos necesarios para el cumplimiento de sus funciones, y participar en las rentas nacionales.", true], ["C", "fijar por sí mismas el régimen de inhabilidades e incompatibilidades de sus servidores.", "El régimen de inhabilidades e incompatibilidades es materia de la Constitución y la ley; la autonomía territorial no faculta a las entidades para establecerlo.", false]]}, {"id": "GE-126", "niv": 1, "e": "En cuanto al lugar del municipio en la organización del Estado, la Constitución establece que", "f": "Constitución Política, arts. 286 y 311", "o": [["A", "es la entidad fundamental de la división político-administrativa del Estado.", "El artículo 311 de la Constitución define al municipio como entidad fundamental de la división político-administrativa del Estado, encargado de prestar los servicios públicos que determine la ley y construir las obras que demande el progreso local, entre otras tareas.", true], ["B", "es una dependencia del departamento, encargada de ejecutar en su territorio las políticas departamentales.", "El municipio es una entidad territorial con autonomía (arts. 286 y 287), no una dependencia del departamento; este cumple funciones de coordinación y complementariedad (art. 298).", false], ["C", "es una entidad descentralizada por servicios del orden departamental.", "La descentralización por servicios se predica de entidades como los establecimientos públicos; el municipio es una entidad territorial, es decir, una forma de descentralización territorial.", false]]}]}, {"comp": "gestion_publica", "rol": "general", "tag": "Gestión pública y funcionamiento del Estado · Acciones de cumplimiento y popular", "texto": "Usted es profesional universitario de una procuraduría provincial y atiende a un veedor ciudadano que consulta tres asuntos sobre la alcaldía de su municipio. Primero: un acuerdo municipal vigente ordena a la alcaldía publicar cada trimestre un informe de avance de las obras públicas, y en dos años nunca lo ha publicado; el veedor no ha hecho ninguna solicitud previa. Segundo: otro acuerdo ordena construir un polideportivo con un costo estimado de $3.000 millones, que no se ha ejecutado. Tercero: un comerciante ocupa con mesas y vitrinas el andén de la plaza principal, lo que obliga a los peatones a caminar por la vía, y la alcaldía no ha hecho nada.", "items": [{"id": "GE-150", "niv": 2, "e": "Para exigir judicialmente la publicación del informe trimestral, el veedor debe", "f": "Ley 393 de 1997, art. 8; Ley 1437 de 2011, art. 161, num. 3", "o": [["A", "pedir antes a la alcaldía que cumpla el acuerdo y esperar a que se ratifique en el incumplimiento o no responda en diez días.", "El artículo 8 de la Ley 393 de 1997 exige, para constituir la renuencia, que el accionante haya reclamado previamente el cumplimiento del deber y que la autoridad se haya ratificado en el incumplimiento o no haya contestado dentro de los diez días siguientes; solo excepcionalmente se prescinde de ello ante un perjuicio irremediable.", true], ["B", "presentar directamente la demanda de cumplimiento, porque el acuerdo es un acto administrativo de carácter general.", "Salvo inminente perjuicio irremediable, la acción exige que antes se haya reclamado el cumplimiento a la autoridad y que esta se ratifique en el incumplimiento o no conteste en diez días (art. 8 de la Ley 393).", false], ["C", "solicitar primero la conciliación extrajudicial ante la procuraduría judicial administrativa, como requisito de procedibilidad.", "La conciliación extrajudicial no es requisito de la acción de cumplimiento; el requisito de procedibilidad es la constitución en renuencia (art. 8 de la Ley 393 de 1997 y art. 161, num. 3, del CPACA).", false]]}, {"id": "GE-151", "niv": 3, "e": "Respecto del acuerdo que ordena construir el polideportivo, la acción de cumplimiento", "f": "Ley 393 de 1997, art. 9, par.", "o": [["A", "procede, porque el acuerdo es un acto administrativo vigente y la alcaldía lo ha incumplido.", "La vigencia del acto y el incumplimiento no bastan: la ley excluye expresamente de esta acción el cumplimiento de normas que establezcan gastos (par. del art. 9 de la Ley 393).", false], ["B", "procede solo si el veedor demuestra que sufrirá un perjuicio irremediable.", "El perjuicio irremediable permite prescindir de la renuencia previa (art. 8), pero no supera la improcedencia frente a normas que establecen gastos (par. del art. 9).", false], ["C", "no procede, porque no puede perseguir el cumplimiento de normas que establezcan gastos.", "El parágrafo del artículo 9 de la Ley 393 de 1997 dispone que la acción de cumplimiento no podrá perseguir el cumplimiento de normas que establezcan gastos, como ocurre con un acuerdo que ordena construir una obra de $3.000 millones.", true]]}, {"id": "GE-152", "niv": 3, "e": "Frente a la ocupación del andén de la plaza, el veedor puede", "f": "Constitución Política, art. 88; Ley 472 de 1998, art. 4; Ley 1437 de 2011, art. 144", "o": [["A", "interponer una tutela, porque la ocupación del andén vulnera su derecho fundamental a la libre circulación.", "La afectación descrita recae sobre el espacio público, un derecho colectivo, cuya vía principal es la acción popular; la tutela es subsidiaria y no está diseñada para estos intereses colectivos.", false], ["B", "ejercer la acción popular para proteger el espacio público, previa solicitud a la alcaldía para que adopte medidas, salvo peligro inminente.", "El goce del espacio público es un derecho colectivo (art. 4 de la Ley 472 de 1998; art. 88 de la Constitución). El inciso tercero del artículo 144 del CPACA exige pedir antes a la autoridad que adopte las medidas de protección y permite acudir al juez si no lo hace en quince días o se niega, salvo inminente peligro de perjuicio irremediable.", true], ["C", "acudir al personero municipal, que es el único legitimado para ejercer acciones populares.", "Cualquier persona puede demandar la protección de los derechos colectivos (art. 144 del CPACA y Ley 472 de 1998); el personero también puede hacerlo, pero no es el único legitimado.", false]]}]}, {"comp": "atencion_usuario", "rol": "tecnico", "tag": "Atención al usuario · Niveles técnico, administrativo y operativo · Radicación de peticiones", "texto": "Usted es auxiliar administrativo encargado de radicar la correspondencia en una procuraduría provincial. Un ciudadano entrega una petición escrita en la que solicita que la Procuraduría vigile un proceso de contratación de su municipio, pero no adjunta la copia del contrato que la oficina suele pedir y tampoco explica por qué cree que hay irregularidades. Usted le advierte del documento faltante, pero él insiste en que se la reciban así. Más tarde, una exfuncionaria de la misma procuraduría solicita una certificación laboral, y el coordinador le sugiere a usted exigirle copia de su acta de posesión, documento que reposa en la hoja de vida que custodia la entidad.", "items": [{"id": "AU-104", "niv": 1, "e": "Ante la insistencia del ciudadano, usted debe", "f": "Ley 1755 de 2015, art. 1 (art. 15, incisos 2 y 3 y parágrafo 2, de la Ley 1437 de 2011)", "o": [["A", "radicar la petición y dejar constancia del documento que hace falta.", "Según el artículo 15 del CPACA, en el acto de recibo se indican los documentos faltantes y, si el peticionario insiste, se radica dejando constancia de ellos. Ninguna autoridad puede negarse a radicar peticiones respetuosas.", true], ["B", "devolverle la petición para que la presente de nuevo cuando tenga la copia del contrato.", "Contradice el parágrafo 2 del artículo 15 del CPACA, que prohíbe negarse a recibir y radicar peticiones respetuosas; la falta de un anexo no autoriza la devolución.", false], ["C", "recibirla de manera provisional, sin número de radicado, hasta que el ciudadano complete el anexo.", "La ley no contempla recibos provisionales: la petición debe radicarse, porque desde la radicación corren los términos y queda prueba de su presentación.", false]]}, {"id": "AU-105", "niv": 3, "e": "Sobre la falta de explicación de los motivos de la petición, es correcto afirmar que", "f": "Ley 1755 de 2015, art. 1 (arts. 16, parágrafo 2, 17 y 19 de la Ley 1437 de 2011)", "o": [["A", "la petición debe devolverse para que el ciudadano la aclare, porque sin razones su objeto no se comprende.", "La devolución para aclarar procede solo cuando no se comprende la finalidad u objeto de la petición (art. 19 del CPACA); aquí el objeto, vigilar un proceso de contratación, es claro.", false], ["B", "la petición se entiende desistida si el ciudadano no explica sus razones dentro del mes siguiente.", "El desistimiento tácito del artículo 17 del CPACA exige un requerimiento previo por falta de requisitos o documentos necesarios para decidir; la ausencia de fundamentación no es causal de desistimiento.", false], ["C", "la falta de argumentos no autoriza a rechazar la petición, que debe tramitarse de todos modos.", "El parágrafo 2 del artículo 16 del CPACA dispone que en ningún caso podrá rechazarse una petición por fundamentación inadecuada o incompleta.", true]]}, {"id": "AU-106", "niv": 2, "e": "Frente a la sugerencia del coordinador sobre el acta de posesión, lo procedente es", "f": "Ley 1437 de 2011, art. 9, num. 4; Ley 1755 de 2015, art. 1 (art. 16, parágrafo 1, de la Ley 1437 de 2011)", "o": [["A", "exigirla solo si la exfuncionaria se retiró hace más de un año, porque su hoja de vida ya pasó al archivo central.", "El traslado de la hoja de vida al archivo central no cambia que el documento repose en la entidad; la prohibición del artículo 9, numeral 4, del CPACA sigue aplicando.", false], ["B", "no exigirla, porque es un documento que ya reposa en los archivos de la entidad.", "El artículo 9, numeral 4, del CPACA prohíbe exigir constancias, certificaciones o documentos que reposen en la respectiva entidad, y el parágrafo 1 del artículo 16 impide tener por incompleta una petición por esa razón.", true], ["C", "exigirla, porque la certificación laboral es un trámite personal que el titular debe soportar con sus propios documentos.", "Que el trámite sea personal no autoriza a pedir documentos que ya tiene la entidad: el artículo 9, numeral 4, del CPACA lo prohíbe expresamente.", false]]}]}, {"comp": "atencion_usuario", "rol": "general", "tag": "Atención al usuario · Atención prioritaria de peticiones", "texto": "Usted trabaja en el centro de atención al ciudadano de una procuraduría regional. Llega una mujer con su hijo de 8 años, que requiere con urgencia un medicamento formulado que la EPS no ha entregado; el médico tratante certificó por escrito que la demora pone en riesgo la vida del niño. Ella presenta una petición para que la Procuraduría intervenga ante la EPS y anexa la fórmula y la certificación médica. En la misma fila espera una periodista de un medio regional que, para preparar una nota, pide información sobre el número de quejas recibidas contra alcaldes del departamento durante el último año.", "items": [{"id": "AU-125", "niv": 2, "e": "Para que la petición de la madre reciba atención prioritaria, se requiere que", "f": "Ley 1755 de 2015, art. 1 (art. 20 de la Ley 1437 de 2011)", "o": [["A", "pruebe, al menos de forma sumaria, la titularidad del derecho fundamental del niño y el riesgo de un daño irremediable.", "El artículo 20 del CPACA ordena dar atención prioritaria a las peticiones de reconocimiento de un derecho fundamental que deban resolverse para evitar un perjuicio irremediable; el peticionario debe probar sumariamente la titularidad del derecho y el riesgo.", true], ["B", "aporte una sentencia de tutela que ordene a la EPS entregar el medicamento dentro de un plazo determinado.", "La atención prioritaria no depende de una orden judicial; precisamente busca evitar el perjuicio irremediable sin esperar otros trámites.", false], ["C", "acredite que antes presentó una queja ante la Superintendencia de Salud y que no obtuvo respuesta oportuna.", "La ley no exige agotar quejas ante otras entidades para obtener atención prioritaria; basta la prueba sumaria del derecho y del riesgo.", false]]}, {"id": "AU-126", "niv": 1, "e": "Dado que la vida del niño está en peligro inminente por razones de salud, la autoridad debe", "f": "Ley 1755 de 2015, art. 1 (art. 20, inciso 2, de la Ley 1437 de 2011)", "o": [["A", "resolver la petición dentro de los cinco días siguientes, término especial previsto para las peticiones en salud.", "La ley no fija un término especial de cinco días para peticiones en salud; ordena adoptar de inmediato medidas de urgencia.", false], ["B", "tramitar la petición en el turno que le corresponda y adoptar medidas solo cuando decida de fondo.", "Cuando está en peligro inminente la vida o la integridad, las medidas de urgencia no esperan la decisión de fondo.", false], ["C", "adoptar de inmediato las medidas de urgencia necesarias, sin perjuicio del trámite que deba darse a la petición.", "El inciso 2 del artículo 20 del CPACA dispone que, si por razones de salud o de seguridad personal está en peligro inminente la vida o la integridad del destinatario, la autoridad adoptará de inmediato las medidas de urgencia, sin perjuicio del trámite de la petición.", true]]}, {"id": "AU-127", "niv": 1, "e": "Sobre la solicitud de la periodista, es correcto afirmar que", "f": "Ley 1755 de 2015, art. 1 (art. 20, inciso 2, de la Ley 1437 de 2011)", "o": [["A", "solo puede atenderse con preferencia si acredita una tarjeta profesional de periodista expedida por el Estado.", "La norma no exige tarjeta profesional; basta que la petición se haga para el ejercicio de la actividad periodística.", false], ["B", "se tramita de manera preferencial, porque la formula para el ejercicio de su actividad como periodista.", "El inciso 2 del artículo 20 del CPACA dispone que la petición que realiza un periodista para el ejercicio de su actividad se tramita preferencialmente.", true], ["C", "debe esperar el término general de quince días, porque la información estadística no admite trato preferente.", "La ley ordena el trámite preferencial de las peticiones de periodistas para su actividad; además, una petición de información tiene término especial de diez días, no de quince.", false]]}]}, {"comp": "atencion_usuario", "rol": "general", "tag": "Atención al usuario · Información pública clasificada y reservada", "texto": "Un ciudadano presenta ante una ESE hospital departamental una solicitud de acceso a la información en la que pide: el contrato de suministro de medicamentos suscrito el año anterior; la historia clínica de un vecino suyo, quien no lo ha autorizado para pedirla; y un informe de auditoría interna que, además de datos generales de la gestión, incluye en un anexo los diagnósticos de algunos pacientes identificados con nombre. El jefe de la oficina jurídica le exige al ciudadano que explique para qué quiere la información antes de darle trámite.", "items": [{"id": "AU-137", "niv": 1, "e": "La exigencia del jefe de la oficina jurídica es", "f": "Ley 1712 de 2014, arts. 3 (principio de no discriminación) y 10", "o": [["A", "procedente, porque la entidad debe valorar si el interés del solicitante justifica el acceso.", "El principio de no discriminación de la Ley 1712 de 2014 impide exigir expresión de causa o motivación; el acceso a la información pública no depende del interés del solicitante.", false], ["B", "procedente solo frente al contrato, porque el acceso a la información contractual exige un interés directo.", "La información contractual es pública y de publicación obligatoria (art. 10 de la Ley 1712 de 2014); no se exige interés directo para acceder a ella.", false], ["C", "improcedente, porque no puede exigirse al solicitante que exprese la causa o motivación de su solicitud.", "El artículo 3 de la Ley 1712 de 2014 (principio de no discriminación) obliga a entregar información a todas las personas sin exigir expresión de causa o motivación.", true]]}, {"id": "AU-138", "niv": 3, "e": "Frente a la solicitud de la historia clínica del vecino, la ESE debe", "f": "Ley 1755 de 2015, art. 1 (arts. 24, num. 3 y parágrafo, y 25 de la Ley 1437 de 2011); Ley 1712 de 2014, art. 18", "o": [["A", "remitir la solicitud al vecino para que decida, dentro de los diez días siguientes, si autoriza su entrega.", "La ley no prevé ese traslado al titular: la entidad debe resolver la solicitud y, como el solicitante no está autorizado, negarla motivadamente.", false], ["B", "negarla de forma motivada, porque el solicitante no está autorizado para pedir esa información del vecino.", "La historia clínica está protegida por la intimidad (art. 24, num. 3, del CPACA y art. 18 de la Ley 1712 de 2014), y el parágrafo del artículo 24 limita su solicitud al titular, sus apoderados o personas autorizadas con facultad expresa. El rechazo debe ser motivado.", true], ["C", "entregarla, porque toda información que reposa en una entidad pública es pública sin excepción.", "La información en poder de los sujetos obligados se presume pública, pero admite excepciones legales, como la protección de la intimidad de las personas.", false]]}, {"id": "AU-139", "niv": 2, "e": "Respecto del informe de auditoría con el anexo de diagnósticos, la ESE debe", "f": "Ley 1712 de 2014, art. 21", "o": [["A", "entregar una versión pública que mantenga la reserva solo de la parte indispensable.", "El artículo 21 de la Ley 1712 de 2014 dispone que, cuando no toda la información de un documento está protegida, debe hacerse una versión pública que mantenga la reserva únicamente de la parte indispensable.", true], ["B", "entregar el informe completo, porque el interés público en la auditoría prevalece sobre la intimidad de los pacientes.", "Los diagnósticos de pacientes identificados están protegidos; la ley no autoriza su divulgación por el interés en la auditoría, sino una versión pública.", false], ["C", "negar todo el informe, porque contiene datos sensibles de pacientes.", "La reserva parcial no se extiende a todo el documento: el artículo 21 de la Ley 1712 de 2014 ordena entregar la parte no protegida.", false]]}]}, {"comp": "atencion_usuario", "rol": "general", "tag": "Atención al usuario · Datos públicos y circulación restringida", "texto": "La Oficina de Atención al Ciudadano de una procuraduría regional recibe dos solicitudes sobre un profesional universitario de la entidad: un periodista pregunta si esa persona es servidor de la Procuraduría y qué cargo ocupa; un particular pide su dirección de residencia y su número de celular personal porque quiere «hablar con él directamente». Además, un coordinador propone publicar en la página web de la entidad el listado de las personas que presentaron quejas el último mes, con su nombre, su número de cédula y el asunto de cada queja, para demostrar transparencia.", "items": [{"id": "AU-155", "niv": 2, "e": "La información que pide el periodista", "f": "Decreto 1074 de 2015, art. 2.2.2.25.1.3, num. 2 (Decreto 1377 de 2013, art. 3); Ley 1712 de 2014, art. 9, literal c)", "o": [["A", "es un dato público, porque ser servidor público no es información privada.", "El reglamento de la Ley 1581 de 2012 (art. 2.2.2.25.1.3 del Decreto 1074 de 2015) considera datos públicos, entre otros, los relativos a la profesión u oficio y a la calidad de servidor público.", true], ["B", "es un dato privado que solo puede suministrarse con autorización del servidor.", "La calidad de servidor público es un dato público según la reglamentación de la Ley 1581 de 2012; no requiere autorización del titular.", false], ["C", "es información reservada, porque revela la estructura de personal de la entidad.", "La estructura y el directorio de servidores son información que los sujetos obligados deben publicar (art. 9 de la Ley 1712 de 2014); no están sometidos a reserva.", false]]}, {"id": "AU-156", "niv": 3, "e": "Frente a la solicitud del particular sobre la dirección y el celular personal del servidor, la entidad debe", "f": "Ley 1712 de 2014, arts. 6, literal c), 9, literal c), y 18, literal a)", "o": [["A", "entregarlos, porque los datos de contacto de los servidores públicos hacen parte de la información mínima que se publica.", "La información mínima que se publica corresponde al directorio institucional; la dirección de residencia y el celular personal pertenecen al ámbito privado del servidor.", false], ["B", "entregarlos solo si el particular explica para qué los necesita y firma un compromiso de confidencialidad.", "El motivo del solicitante no convierte en accesible un dato privado del servidor; la entidad debe negar la solicitud de forma motivada.", false], ["C", "negarlos de manera motivada y por escrito, porque son datos del ámbito privado del servidor.", "Es información pública clasificada (art. 6, literal c, de la Ley 1712 de 2014), cuyo acceso puede negarse de manera motivada y por escrito cuando puede dañar el derecho a la intimidad (art. 18, literal a).", true]]}, {"id": "AU-157", "niv": 1, "e": "La propuesta del coordinador sobre el listado de quejosos", "f": "Ley 1581 de 2012, art. 4, literal f)", "o": [["A", "es válida si el listado se publica solo durante el mes siguiente a la presentación de las quejas.", "Limitar el tiempo de publicación no corrige la divulgación masiva e indebida de datos personales que no son públicos.", false], ["B", "desconoce la protección de datos, porque pone en internet datos personales no públicos sin acceso controlado.", "El principio de acceso y circulación restringida (art. 4, literal f, de la Ley 1581 de 2012) prohíbe poner datos personales no públicos en internet u otros medios masivos, salvo que el acceso sea técnicamente controlable.", true], ["C", "es válida, porque la publicación proactiva de información es un deber de los sujetos obligados y fortalece la transparencia.", "La divulgación proactiva se refiere a la información pública sobre la actividad estatal; no autoriza a publicar datos personales de los ciudadanos que presentan quejas.", false]]}]}, {"comp": "atencion_usuario", "rol": "general", "tag": "Atención al usuario · Política de Servicio al Ciudadano y canales de atención", "texto": "La secretaria general de una empresa social del Estado del orden departamental lidera la implementación del Modelo Integrado de Planeación y Gestión (MIPG). En el diagnóstico encuentra que cada dependencia recibe por su cuenta las peticiones verbales que llegan a su oficina, que las llamadas telefónicas con peticiones se atienden en las extensiones de cada área sin dejar constancia, y que no existe ningún canal para recibir peticiones verbales por fuera del horario de atención.", "items": [{"id": "AU-170", "niv": 1, "e": "Dentro del MIPG, el servicio al ciudadano es", "f": "Decreto 1499 de 2017 (art. 2.2.22.2.1 del Decreto 1083 de 2015)", "o": [["A", "una de las políticas de gestión y desempeño institucional previstas en el Decreto 1499 de 2017.", "El artículo 2.2.22.2.1 del Decreto 1083 de 2015, en la redacción dada por el Decreto 1499 de 2017, incluye el servicio al ciudadano entre las políticas de gestión y desempeño institucional.", true], ["B", "un componente del sistema de control interno cuya evaluación corresponde en forma exclusiva a la oficina de control interno.", "El servicio al ciudadano es una política de gestión y desempeño; la oficina de control interno evalúa, pero la política la implementa toda la entidad.", false], ["C", "una dimensión autónoma del modelo que reemplaza al proceso de gestión documental.", "El servicio al ciudadano no reemplaza la gestión documental, que es otra política distinta del mismo listado.", false]]}, {"id": "AU-171", "niv": 1, "e": "Frente a las peticiones verbales presenciales, la empresa debe", "f": "Decreto 1069 de 2015, art. 2.2.3.12.2 (adicionado por el Decreto 1166 de 2016)", "o": [["A", "suprimir la recepción verbal y exigir un formulario escrito, para garantizar la constancia de radicación.", "Las peticiones pueden presentarse verbalmente (art. 15 del CPACA) y no puede negarse su recepción con la excusa de exigir un escrito, salvo que la petición lo requiera.", false], ["B", "concentrar su recepción en una única dependencia, atendida por personal que conozca las funciones de la entidad.", "El artículo 2.2.3.12.2 del Decreto 1069 de 2015 obliga a centralizar en una sola oficina o dependencia la recepción de las peticiones verbales, con funcionarios suficientes y con conocimiento idóneo de las competencias de la entidad.", true], ["C", "mantener la recepción en cada dependencia, porque así la petición llega directamente a quien debe resolverla.", "El Decreto 1069 de 2015 ordena lo contrario: centralizar en una sola oficina o dependencia la recepción de las peticiones verbales.", false]]}, {"id": "AU-172", "niv": 2, "e": "Respecto de las peticiones telefónicas y de las que se formulen fuera del horario, la empresa debe", "f": "Decreto 1069 de 2015, art. 2.2.3.12.2 (adicionado por el Decreto 1166 de 2016)", "o": [["A", "atender las telefónicas en cada extensión y recibir las de fuera del horario solo por correo físico.", "La norma exige centralizar las peticiones telefónicas en la línea de atención y habilitar medios tecnológicos o electrónicos aun fuera del horario.", false], ["B", "recibir las telefónicas solo como orientación, sin radicarlas ni dejar constancia, y no habilitar ningún canal por fuera del horario de atención al público.", "Las peticiones telefónicas son peticiones verbales que deben constar y radicarse; la excepción es solo la simple orientación sobre dónde acudir.", false], ["C", "centralizar las telefónicas en su línea de atención y habilitar medios electrónicos para recibir peticiones verbales aun fuera del horario.", "El artículo 2.2.3.12.2 del Decreto 1069 de 2015 ordena centralizar en la línea de atención la recepción y constancia de radicación de las peticiones telefónicas y habilitar medios tecnológicos o electrónicos para recibir peticiones verbales aun por fuera de las horas de atención.", true]]}]}, {"comp": "gestion_documental", "rol": "tecnico", "tag": "Gestión documental · Niveles técnico, administrativo y operativo · Foliación", "texto": "Usted es auxiliar administrativo de la secretaría de una procuraduría provincial y debe foliar varios expedientes disciplinarios antes de transferirlos. Uno de ellos ocupa dos carpetas: la primera termina en el folio 200. En otro expediente, ya foliado del 1 al 85, al revisar descubre que una hoja quedó sin número entre los folios 15 y 16. Un compañero le sugiere usar el esfero rojo de la oficina «para que se note más» y numerar la hoja olvidada como «15A». Usted aplica el instructivo de foliación del Archivo General de la Nación (AGN).", "items": [{"id": "GD-110", "niv": 1, "e": "Para foliar los expedientes, usted debe usar", "f": "AGN, instructivo Foliación en archivos (actualización 2021), materiales y procedimiento, nums. 1 a 4", "o": [["A", "lápiz de mina negra y escribir el número en la esquina superior derecha de ambas caras de cada hoja.", "Foliar es numerar las hojas por su cara recta; numerar ambas caras es paginar, que el instructivo «Foliación en archivos» del AGN distingue de la foliación.", false], ["B", "lápiz de mina roja, para distinguir la numeración del texto del documento.", "El instructivo de foliación del AGN indica lápiz de mina negra y blanda (HB o B) y descarta el lápiz de color rojo.", false], ["C", "lápiz de mina negra y blanda (HB o B) y escribir el número en la esquina superior derecha de la cara recta del folio.", "El instructivo Foliación en archivos del AGN ordena usar lápiz de mina negra y blanda, tipo HB o B, y escribir el número en la esquina superior derecha de la cara recta, en el mismo sentido del texto.", true]]}, {"id": "GD-111", "niv": 2, "e": "En el expediente que ocupa dos carpetas, la primera hoja de la segunda carpeta debe llevar el folio número", "f": "AGN, instructivo Foliación en archivos (actualización 2021), requisitos, num. 4; AGN, cartilla Ordenación documental", "o": [["A", "1, porque cada carpeta es una unidad de conservación con foliación propia.", "Esa regla vale para series simples (resoluciones, circulares), foliadas por carpeta. En series complejas como las investigaciones disciplinarias, foliar desde 1 cada carpeta rompe la unidad del expediente (instructivo del AGN).", false], ["B", "200, para mostrar que continúa el folio final de la carpeta anterior.", "La numeración es consecutiva, sin repetir números; el 200 ya corresponde a la última hoja de la primera carpeta (instructivo Foliación en archivos del AGN, procedimiento, num. 1).", false], ["C", "201, porque la segunda carpeta continúa la foliación de la primera.", "En series complejas (contratos, historias laborales, investigaciones disciplinarias) cada expediente tiene una foliación continua y, si ocupa más de una carpeta, la segunda continúa la numeración de la primera (instructivo Foliación en archivos del AGN, requisitos, num. 4).", true]]}, {"id": "GD-112", "niv": 3, "e": "Para corregir la hoja que quedó sin foliar entre los folios 15 y 16, lo procedente es", "f": "AGN, instructivo Foliación en archivos (actualización 2021), procedimiento, nums. 1, 2, 4 y 14", "o": [["A", "anular con una línea oblicua la numeración errada y refoliar en forma consecutiva desde esa hoja, sin tachones.", "El instructivo Foliación en archivos del AGN exige numerar en forma consecutiva, sin omitir ni repetir números, y dispone que los errores de foliación se anulen con una línea oblicua, evitando tachones.", true], ["B", "numerarla como 15A, para no alterar la foliación de las hojas siguientes.", "El instructivo del AGN prohíbe foliar con números acompañados de los suplementos A, B, C o bis.", false], ["C", "borrar con corrector la numeración desde el folio 16 y escribir encima la nueva.", "El número debe escribirse sin enmendaduras, y los errores se anulan con una línea oblicua evitando tachones; el corrector altera el soporte y oculta la numeración anterior (instructivo del AGN).", false]]}]}, {"comp": "gestion_documental", "rol": "general", "tag": "Gestión documental · Principios de procedencia y orden original", "texto": "Usted es asistente de la Procuraduría Regional de un departamento. Al recibir el archivo de gestión del despacho, encuentra que un antiguo servidor reunió en una sola carpeta temática, llamada «Contratación», documentos producidos por la Oficina Jurídica, por el grupo de Vigilancia Preventiva y por la secretaría. Además, dentro de cada expediente ordenó los documentos alfabéticamente por el apellido del remitente. El procurador regional le pide reorganizar el archivo conforme a la normativa del Archivo General de la Nación.", "items": [{"id": "GD-113", "niv": 2, "e": "Al separar los documentos de la carpeta temática «Contratación», usted aplica el principio de procedencia, que consiste en", "f": "Ley 594 de 2000, art. 11; Acuerdo 001 de 2024 del AGN, art. 4.3.1.2", "o": [["A", "conservar los documentos en la dependencia que los recibió por última vez.", "La procedencia se define por la oficina productora en desarrollo de sus funciones, no por quien tuvo los documentos por última vez (art. 4.3.1.2, Acuerdo 001 de 2024).", false], ["B", "mantener agrupados los documentos según la dependencia que los produjo en ejercicio de sus funciones.", "El artículo 4.3.1.2 del Acuerdo 001 de 2024 del AGN ordena respetar la procedencia para determinar, a partir de la estructura orgánico-funcional, las unidades u oficinas que producen los documentos. La Ley 594 de 2000 (art. 11) lo establece como principio de la organización de archivos.", true], ["C", "agrupar los documentos según el asunto que tratan, sin importar qué dependencia los produjo.", "Agrupar por tema es justamente lo que desconoce la procedencia. Este principio atiende a la oficina productora según la estructura orgánico-funcional (art. 4.3.1.2, Acuerdo 001 de 2024 del AGN).", false]]}, {"id": "GD-114", "niv": 2, "e": "Para corregir la ordenación alfabética de los documentos dentro de cada expediente, usted debe", "f": "Acuerdo 001 de 2024 del AGN, arts. 4.3.1.3 y 4.3.1.8, num. 2; AGN, instructivo Foliación en archivos, requisitos, num. 2", "o": [["A", "ordenar los documentos según la secuencia en que se produjeron durante el trámite, desde el que lo inició.", "El principio de orden original (art. 4.3.1.3, Acuerdo 001 de 2024 del AGN) exige respetar la secuencia en que los documentos se gestionaron y tramitaron hasta su resolución; el numeral 2 del artículo 4.3.1.8 ordena que los tipos documentales evidencien el desarrollo del trámite.", true], ["B", "ordenar los documentos según el tipo documental, primero los oficios y luego los autos.", "Agrupar por tipo documental rompe la secuencia en que se tramitó el asunto; el orden original exige reflejar el desarrollo del trámite (art. 4.3.1.8, num. 2, Acuerdo 001 de 2024).", false], ["C", "ubicar primero el documento más reciente, para que la última actuación quede a la vista.", "El orden original sigue la secuencia del trámite; según el instructivo de foliación del AGN, el folio 1 corresponde al documento que dio inicio al trámite, que es el de fecha más antigua.", false]]}, {"id": "GD-115", "niv": 1, "e": "El proceso de organización documental que usted adelanta comprende las operaciones técnicas de", "f": "Acuerdo 001 de 2024 del AGN, art. 4.3.1.1; Decreto 1080 de 2015, art. 2.8.2.5.9, lit. d", "o": [["A", "valoración, selección y eliminación.", "Son actividades de los procesos de valoración y disposición final (arts. 4.5.1 a 4.5.4 y Título 5 del Acuerdo 001 de 2024), no de la organización.", false], ["B", "clasificación, ordenación y descripción.", "El artículo 4.3.1.1 del Acuerdo 001 de 2024 del AGN señala que la organización documental se realiza a partir de los procesos técnicos de clasificación, ordenación y descripción, respetando procedencia, orden original y ciclo vital.", true], ["C", "recepción, radicación y distribución.", "Esas actividades corresponden a la ventanilla única y al proceso de gestión y trámite (arts. 4.2.1 y 4.2.2 del Acuerdo 001 de 2024), no a la organización.", false]]}]}, {"comp": "gestion_documental", "rol": "general", "tag": "Gestión documental · Documentos de apoyo, depuración y principios de la gestión documental", "texto": "Una auxiliar administrativa de la secretaría de una procuraduría provincial organiza el archivo de gestión. En los estantes encuentra carpetas con fotocopias de leyes y decretos, circulares enviadas por otras entidades «para conocimiento» y revistas jurídicas que los abogados guardan solo como material de consulta. En los expedientes de las actuaciones hay hojas en blanco y algunas fotocopias idénticas de documentos que ya están en original. Antes de foliar, un compañero le recomienda imprimir todos los correos electrónicos recibidos durante el año, «para que el archivo quede completo en papel», aunque ninguna norma ni la TRD exige conservarlos impresos.", "items": [{"id": "GD-135", "niv": 1, "e": "Las fotocopias de normas, las circulares recibidas para conocimiento y las revistas que se guardan como material de consulta son", "f": "Ley 594 de 2000, art. 3; Acuerdo 001 de 2024 del AGN, art. 4.5.4, par. 2", "o": [["A", "documentos de apoyo, que no se consignan en la TRD.", "El art. 4.5.4, par. 2, del Acuerdo 001 de 2024 del AGN señala que los documentos de apoyo no se consignan en la TRD de las dependencias y pueden eliminarse cuando pierdan su utilidad, dejando constancia en acta o documento equivalente.", true], ["B", "documentos de archivo de conservación total, por su valor jurídico.", "No son documentos producidos o recibidos en ejercicio de las funciones de la secretaría (art. 3 de la Ley 594 de 2000), sino material de consulta; por eso no tienen disposición final en la TRD.", false], ["C", "una serie documental propia de la secretaría, que debe incluirse en la tabla de retención.", "Los documentos de apoyo no se consignan en la TRD (art. 4.5.4, par. 2, del Acuerdo 001 de 2024 del AGN); no conforman series documentales de la dependencia.", false]]}, {"id": "GD-136", "niv": 2, "e": "Antes de foliar los expedientes de las actuaciones, la auxiliar debe", "f": "AGN, instructivo «Foliación en archivos» (2021); Acuerdo 001 de 2024 del AGN, art. 4.5.4, num. 9", "o": [["A", "foliar todas las hojas, incluidas las que están en blanco y las fotocopias idénticas, y depurar después de la transferencia.", "Según el instructivo de foliación del AGN, la depuración es un requisito previo a la foliación; foliar primero obligaría a refoliar después de retirar hojas.", false], ["B", "depurar los expedientes, retirando las hojas en blanco, las fotocopias idénticas y los documentos de apoyo.", "El instructivo «Foliación en archivos» del AGN establece como requisito previo a la foliación la depuración: retirar duplicados idénticos, folios en blanco y documentos de apoyo; el Acuerdo 001 de 2024 permite retirar copias idénticas (art. 4.5.4, num. 9).", true], ["C", "foliar solo las hojas que tengan firma, porque las demás no son documentos de archivo.", "La foliación es consecutiva sobre todos los documentos que conforman el expediente una vez depurado (instructivo de foliación del AGN); la firma no es el criterio para foliar.", false]]}, {"id": "GD-137", "niv": 2, "e": "La recomendación de imprimir todos los correos aunque ninguna norma lo exija va en contra del principio de la gestión documental denominado", "f": "Decreto 1080 de 2015, art. 2.8.2.5.5", "o": [["A", "neutralidad tecnológica.", "La neutralidad tecnológica se refiere a la libre adopción de tecnologías por parte del Estado (art. 2.8.2.5.5 del Decreto 1080 de 2015); no trata de evitar impresiones innecesarias.", false], ["B", "disponibilidad.", "El principio de disponibilidad pide que los documentos estén disponibles cuando se requieran, independientemente del medio de creación (art. 2.8.2.5.5 del Decreto 1080 de 2015); no es el que desaconseja imprimir sin necesidad.", false], ["C", "protección del medio ambiente.", "El art. 2.8.2.5.5 del Decreto 1080 de 2015 incluye el principio de protección del medio ambiente, según el cual las entidades deben evitar producir documentos impresos en papel cuando no se requiera por razones legales o de preservación histórica.", true]]}]}, {"comp": "gestion_documental", "rol": "tecnico", "tag": "Gestión documental · Niveles técnico, administrativo y operativo · Inventarios documentales e integración de comunicaciones al expediente", "texto": "Usted es técnico de la secretaría de una procuraduría provincial. La jefa le pide actualizar el inventario del archivo de gestión, porque un compañero asegura que esa tarea «la hace el archivo central cuando recibe las cajas». También le consulta sobre una petición que entró por la ventanilla, quedó radicada en el sistema y fue respondida por la dependencia: el compañero sostiene que, como ya está en el sistema de radicación, no hace falta incluirla en el expediente físico del trámite. Usted debe aclarar ambas dudas con base en la normativa archivística vigente.", "items": [{"id": "GD-153", "niv": 1, "e": "El Formato Único de Inventario Documental (FUID) se utiliza para", "f": "Acuerdo 001 de 2024 del AGN, arts. 1.3.2, 4.3.1.6 y 4.4.3", "o": [["A", "describir las unidades documentales en los inventarios, como los de transferencia o de entrega del cargo.", "El Acuerdo 001 de 2024 del AGN adopta el FUID para los inventarios documentales (art. 4.3.1.6, par. 2), que soportan la transferencia (art. 4.4.3, par. 4) y la entrega de los documentos al ser trasladado o desvinculado (art. 1.3.2).", true], ["B", "registrar en la ventanilla las comunicaciones que se radican cada día.", "El registro de la radicación se lleva en los sistemas y planillas de la ventanilla (arts. 4.2.3 y 4.2.5 del Acuerdo 001 de 2024 del AGN); el FUID es un instrumento de descripción de unidades documentales.", false], ["C", "fijar los tiempos de retención de cada serie y subserie.", "Los tiempos de retención se fijan en la TRD (art. 24 de la Ley 594 de 2000), no en el inventario.", false]]}, {"id": "GD-154", "niv": 2, "e": "Sobre quién elabora los inventarios documentales del archivo de gestión, lo correcto es que", "f": "Ley 594 de 2000, art. 26; Acuerdo 001 de 2024 del AGN, arts. 4.3.1.6 y 4.4.2", "o": [["A", "los elabora el archivo central únicamente cuando recibe las transferencias primarias de las dependencias.", "El archivo central verifica la aplicación de los instrumentos al recibir (art. 4.4.2 del Acuerdo 001 de 2024 del AGN), pero los inventarios los elaboran las oficinas productoras desde la fase de gestión (art. 4.3.1.6, par. 1).", false], ["B", "los elaboran las oficinas productoras desde la fase de gestión de los documentos.", "El art. 4.3.1.6, par. 1, del Acuerdo 001 de 2024 del AGN dispone que las oficinas productoras, desde la fase de gestión, deben elaborar inventarios documentales, hojas de control o índice electrónico.", true], ["C", "los elabora el AGN durante sus visitas de inspección.", "El AGN no elabora los inventarios de las entidades; la Ley 594 de 2000 (art. 26) obliga a las entidades a elaborarlos y el Acuerdo 001 de 2024 asigna esa tarea a las oficinas productoras (art. 4.3.1.6, par. 1).", false]]}, {"id": "GD-155", "niv": 3, "e": "Sobre la petición radicada y respondida, es correcto afirmar que", "f": "Acuerdo 001 de 2024 del AGN, arts. 4.2.5 y 4.3.1.8", "o": [["A", "debe guardarse en un consecutivo de la ventanilla, separado del expediente del trámite, para no duplicar la información ya registrada en el sistema.", "Separar la petición del expediente rompe la unidad del trámite; la norma exige incluirla en el expediente de la serie o subserie de la dependencia competente (art. 4.2.5, par., del Acuerdo 001 de 2024 del AGN) y respetar el orden original (art. 4.3.1.8, num. 2).", false], ["B", "basta con su registro en el sistema de radicación, que reemplaza su inclusión en el expediente.", "El registro en el sistema no sustituye la inclusión en el expediente: las peticiones deben incluirse en el expediente de la serie o subserie que corresponda, sin importar que estén registradas en sistemas manuales o automatizados (art. 4.2.5, par., del Acuerdo 001 de 2024 del AGN).", false], ["C", "debe incluirse en el expediente de la serie o subserie que corresponda según la TRD de la dependencia competente para resolverla.", "El parágrafo del art. 4.2.5 del Acuerdo 001 de 2024 del AGN ordena que las comunicaciones oficiales y las peticiones, aunque estén registradas en sistemas manuales o automatizados, se incluyan en el expediente de la serie o subserie de la TRD de la dependencia competente para resolver el trámite.", true]]}]}, {"comp": "documentos_oficina", "rol": "general", "tag": "Elaboración de documentos de oficina · Partes de la carta u oficio", "texto": "Usted es auxiliar administrativo de una procuraduría provincial y revisa el borrador de un oficio dirigido al alcalde del municipio donde funciona la sede. El borrador tiene estos problemas: debajo del nombre y el cargo del destinatario dice «La ciudad»; en el saludo aparece «Respetado señor alcalde» sin un signo de puntuación claro; y al final, el bloque del remitente muestra primero el cargo en mayúscula sostenida, luego el nombre de la procuradora con mayúscula inicial y la firma debajo de ambos. La entidad elabora sus comunicaciones con base en los lineamientos de la guía técnica colombiana sobre documentos (GTC 185) y en las normas de la Real Academia Española.", "items": [{"id": "DO-101", "niv": 1, "e": "Después del saludo «Respetado señor alcalde» debe escribirse", "f": "RAE, Ortografía básica, uso de los dos puntos en cartas y documentos (ver notas-do.md)", "o": [["A", "una coma, así: «Respetado señor alcalde,».", "La Real Academia E
