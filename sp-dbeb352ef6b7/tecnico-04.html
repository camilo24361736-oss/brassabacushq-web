spañola señala que en español, tras el saludo de cartas y documentos, se escriben dos puntos; el uso de la coma en esa posición es un anglicismo ortográfico.", false], ["B", "punto y coma, para separar el saludo del primer párrafo del oficio.", "El punto y coma no se usa tras el saludo de una carta; la norma académica prescribe los dos puntos para esa función.", false], ["C", "dos puntos, y el texto continúa en la línea siguiente.", "Según la ortografía de la Real Academia Española, tras las fórmulas de saludo de cartas y documentos se escriben dos puntos, y lo que sigue se escribe en línea aparte, con mayúscula inicial.", true]]}, {"id": "DO-102", "niv": 2, "e": "Como el destinatario está en la misma ciudad que la procuraduría provincial, en los datos del destinatario se debe", "f": "Guías institucionales que citan la GTC 185: UIS GGD.10, Senado GD-IT01, ADR circular 028 (ver notas-do.md)", "o": [["A", "escribir el nombre de la ciudad, sin usar «La ciudad» ni «Presente».", "Las guías de comunicaciones oficiales de la UIS y del Senado de la República, que siguen la GTC 185, indican escribir el nombre de la ciudad de destino aun cuando sea la misma de origen, y no usar «La ciudad» ni «Presente».", true], ["B", "mantener «La ciudad», porque el destinatario se encuentra en el mismo municipio que la sede que remite el oficio.", "Las guías institucionales basadas en la GTC 185 consultadas indican que se escribe el nombre de la ciudad aunque el destinatario esté en el mismo lugar; no se usa «La ciudad».", false], ["C", "cambiarlo por «Presente», porque el oficio se entregará personalmente.", "Las guías institucionales basadas en la GTC 185 consultadas desaconsejan expresamente el uso de «Presente» en los datos del destinatario.", false]]}, {"id": "DO-103", "niv": 2, "e": "El bloque del remitente debe organizarse con", "f": "Guías institucionales que citan la GTC 185: UIS GGD.10, Senado GD-IT01, Alcaldía de Mitú (ver notas-do.md)", "o": [["A", "solo la firma y el número de cédula de quien suscribe.", "El bloque del remitente identifica a quien firma por su nombre y su cargo; el número de documento de identidad no hace parte de esos datos en las guías consultadas.", false], ["B", "la firma, debajo el nombre en mayúscula sostenida y en la línea siguiente el cargo con mayúscula inicial.", "Las guías institucionales basadas en la GTC 185 (UIS, Senado y Alcaldía de Mitú) indican escribir el nombre del remitente en mayúscula sostenida, el cargo en la línea siguiente con mayúscula inicial y la firma sobre el nombre.", true], ["C", "el cargo en mayúscula sostenida, debajo el nombre con mayúscula inicial y la firma al final.", "El orden recomendado es el inverso: la firma va sobre el nombre, el nombre se escribe en mayúscula sostenida y el cargo, con mayúscula inicial, en la línea siguiente.", false]]}]}, {"comp": "documentos_oficina", "rol": "general", "tag": "Elaboración de documentos de oficina · El acta", "texto": "Usted es auxiliar de la secretaría de una procuraduría provincial y debe elaborar el acta de la reunión ordinaria mensual del equipo de trabajo. En su borrador escribió: «Siendo las 9:00 a. m., se reúnen los integrantes del equipo…» y redactó todo en tiempo presente. Puso como primer punto del orden del día «proposiciones y varios». Durante la reunión, un sustanciador manifestó su desacuerdo con una decisión sobre la distribución de reparto y pidió expresamente que su posición quedara registrada; otros dos integrantes hicieron comentarios generales sin pedir que constaran. La entidad sigue los lineamientos de la GTC 185 para la elaboración de actas.", "items": [{"id": "DO-113", "niv": 1, "e": "En cuanto a la redacción, el acta debe escribirse", "f": "Guías institucionales que citan la GTC 185: UIS GGD.10, Contraloría de Nariño, Gobernación del Cesar (ver notas-do.md)", "o": [["A", "en tiempo presente, para dar sensación de actualidad a lo que se describe.", "Las guías de actas basadas en la GTC 185 indican redactarlas en tiempo pasado, porque registran hechos ya ocurridos en la reunión.", false], ["B", "en futuro, porque recoge principalmente los compromisos que se cumplirán después.", "Aunque el acta registra compromisos, el relato de lo sucedido, tratado y acordado se redacta en tiempo pasado según las guías basadas en la GTC 185.", false], ["C", "en tiempo pasado y sin iniciar párrafos con gerundio.", "Las guías de la UIS, de la Contraloría de Nariño y de la Gobernación del Cesar, basadas en la GTC 185, indican redactar las actas en tiempo pasado y no iniciar ningún párrafo con gerundio (como «Siendo»).", true]]}, {"id": "DO-114", "niv": 2, "e": "Los dos primeros puntos del orden del día deben ser", "f": "Guías institucionales que citan la GTC 185: UIS GGD.10, Contraloría de Nariño, Gobernación del Cesar (ver notas-do.md)", "o": [["A", "la verificación del quórum y, luego, la lectura y aprobación del acta anterior.", "Las guías de actas basadas en la GTC 185 (UIS, Contraloría de Nariño y Gobernación del Cesar) indican que la primera actividad es la verificación del quórum y la segunda, la lectura y aprobación del acta anterior.", true], ["B", "las proposiciones y varios y, luego, la verificación del quórum.", "Las proposiciones y varios suelen ir al final; la reunión empieza verificando el quórum, porque sin él no pueden tomarse decisiones válidas.", false], ["C", "la lectura del acta anterior y, luego, los temas nuevos, sin verificar asistencia porque la reunión es ordinaria.", "El carácter ordinario de la reunión no elimina la verificación del quórum, que según las guías basadas en la GTC 185 es la primera actividad.", false]]}, {"id": "DO-115", "niv": 3, "e": "Sobre las intervenciones de los integrantes, en el acta se debe", "f": "Guías institucionales que citan la GTC 185: UIS GGD.10, Contraloría de Nariño, Gobernación del Cesar (ver notas-do.md)", "o": [["A", "omitir el desacuerdo del sustanciador, porque el acta solo recoge las decisiones aprobadas.", "Aunque el acta hace énfasis en las decisiones, la discrepancia se registra cuando el integrante lo solicita expresamente, según las guías basadas en la GTC 185.", false], ["B", "registrar la discrepancia del sustanciador, porque la solicitó expresamente, y hacer énfasis en las decisiones.", "Las guías de actas de la UIS, de la Contraloría Departamental de Nariño y de la Gobernación del Cesar, elaboradas con base en la GTC 185, indican hacer énfasis en las decisiones y dejar constancia de las discrepancias cuando se solicita expresamente, como hizo el sustanciador.", true], ["C", "transcribir textualmente todas las intervenciones, incluidos los comentarios generales, para que el acta sea completa.", "Las guías basadas en la GTC 185 indican que el acta hace énfasis en las decisiones y no es una transcripción literal de lo dicho.", false]]}]}, {"comp": "documentos_oficina", "rol": "tecnico", "tag": "Elaboración de documentos de oficina · Niveles técnico, administrativo y operativo · Certificado y constancia; fecha", "texto": "Usted es técnico de la secretaría de una procuraduría provincial y debe proyectar dos documentos probatorios que firmará el procurador. En el borrador del primero escribió «CERTIFICA, que el señor…» en una sola línea, y en el lugar y fecha puso «Neiva, 12 de Marzo de 2.026». Un compañero le pregunta cuál es la diferencia entre un certificado y una constancia, porque en la dependencia los usan indistintamente. La entidad sigue los lineamientos de la GTC 185 y las normas ortográficas de la Real Academia Española.", "items": [{"id": "DO-116", "niv": 3, "e": "Según las guías institucionales basadas en la GTC 185, la diferencia entre el certificado y la constancia es que", "f": "Guías institucionales que citan la GTC 185: UIS GGD.10, Alcaldía de Mitú, Alcaldía de Ibagué (ver notas-do.md)", "o": [["A", "el certificado da fe de un hecho o acto solemne, mientras que la constancia acredita hechos que no requieren solemnidad.", "Las guías de la UIS, de la Alcaldía de Mitú y de la Alcaldía de Ibagué, basadas en la GTC 185, describen ambos como documentos probatorios: el certificado asegura la veracidad y legalidad de un hecho o acto solemne y la constancia no requiere solemnidad.", true], ["B", "la constancia tiene valor probatorio y el certificado no.", "Ambos son documentos de carácter probatorio según las guías basadas en la GTC 185; se diferencian por la solemnidad de lo que acreditan.", false], ["C", "el certificado se expide solo a otras entidades y la constancia solo a los particulares.", "Las guías consultadas no distinguen estos documentos por el destinatario, sino por la naturaleza de lo que acreditan: el certificado, un hecho o acto solemne; la constancia, hechos que no requieren solemnidad.", false]]}, {"id": "DO-117", "niv": 2, "e": "Después de la palabra CERTIFICA se debe escribir", "f": "RAE, uso de los dos puntos en cartas y documentos administrativos; Alcaldía de Mitú, guía de documentos (ver notas-do.md)", "o": [["A", "una coma, y continuar en la misma línea con «que» en minúscula.", "La Real Academia Española prescribe dos puntos tras los verbos que presentan el objeto de documentos como certificados, y el texto que sigue va en párrafo aparte con mayúscula inicial.", false], ["B", "punto seguido, y escribir el resto del texto en mayúscula sostenida.", "El punto rompería el enunciado y la mayúscula sostenida no se usa para el cuerpo del texto; la norma académica indica dos puntos y párrafo aparte.", false], ["C", "dos puntos y, en párrafo aparte, el texto que empieza con «Que».", "La Real Academia Española indica usar dos puntos tras el verbo que presenta el objeto en certificados y documentos semejantes (CERTIFICA, HACE CONSTAR), y escribir lo que sigue en párrafo aparte con mayúscula inicial; la guía de la Alcaldía de Mitú lo ejemplifica con «Que».", true]]}, {"id": "DO-118", "niv": 1, "e": "El lugar y la fecha del documento deben escribirse así", "f": "Guías institucionales que citan la GTC 185: UIS GGD.10, Alcaldía de Mitú; RAE, Ortografía (ver notas-do.md)", "o": [["A", "«Neiva, 12 de Marzo de 2026», con el mes en mayúscula inicial.", "Los nombres de los meses son nombres comunes y se escriben con minúscula; las guías basadas en la GTC 185 así lo indican para la fecha.", false], ["B", "«Neiva, 12 de marzo de 2026».", "Las guías de la UIS y de la Alcaldía de Mitú, basadas en la GTC 185, indican escribir el mes en minúscula y el año sin punto; la RAE también señala que los nombres de los meses se escriben con minúscula y que los años no llevan punto.", true], ["C", "«Neiva, 12 de marzo de 2.026», con punto de separación de miles en el año.", "Los números de los años se escriben sin punto, según la RAE y las guías basadas en la GTC 185.", false]]}]}, {"comp": "ofimatica", "rol": "general", "tag": "Herramientas ofimáticas · Referencias relativas, absolutas y mixtas", "texto": "Usted es técnico administrativo de la Oficina de Planeación de la Procuraduría General de la Nación y lleva en Excel el consolidado de gastos de cinco procuradurías provinciales. En B2:B6 están los valores ejecutados; en B7, el total =SUMA(B2:B6), y en E1, el porcentaje de un ajuste que se aplica a todas las filas. En C2 escribió =B2*$E$1 y en D2 =B2/B7, y copió ambas fórmulas hacia abajo hasta la fila 6. Para una tabla auxiliar, además, escribió en C10 la fórmula =$B10*C$9 y la copió a otras celdas.", "items": [{"id": "OF-101", "niv": 1, "e": "Al copiar la fórmula de C2 a la celda C4, la fórmula resultante es", "f": "Microsoft Support, «Cambiar entre referencias relativas, absolutas y mixtas» (Excel)", "o": [["A", "=B4*$E$3.", "Trata $E$1 como si fuera relativa. Con el signo $ delante de la columna y de la fila, la referencia se mantiene en E1 al copiarla.", false], ["B", "=B4*$E$1.", "Al copiar dos filas hacia abajo, la referencia relativa B2 se ajusta a B4, mientras que $E$1, por ser absoluta (columna y fila fijas), no cambia.", true], ["C", "=B2*$E$1.", "B2 es una referencia relativa: al copiar la fórmula dos filas hacia abajo se convierte en B4. Solo permanecen fijas las partes precedidas del signo $.", false]]}, {"id": "OF-102", "niv": 3, "e": "Las celdas D3 a D6 muestran el error #¡DIV/0! porque", "f": "Microsoft Support, «Cambiar entre referencias relativas, absolutas y mixtas» (Excel); «Cómo corregir un error #¡DIV/0!»", "o": [["A", "la referencia B7 era relativa y, al copiarse, pasó a B8, B9 y siguientes, que están vacías.", "Al copiar =B2/B7 hacia abajo, el divisor se desplaza a celdas vacías, y dividir por una celda vacía produce #¡DIV/0!. Fijar el total con referencia absoluta ($B$7) corrige la fórmula.", true], ["B", "la celda B7 tiene formato de moneda, que Excel no acepta como divisor en una división.", "El formato de número solo cambia la apariencia del valor; no impide dividir. #¡DIV/0! aparece cuando el divisor es cero o una celda vacía.", false], ["C", "la referencia B2 del numerador debió ser absoluta para que no cambiara al copiar la fórmula.", "El numerador sí debe cambiar en cada fila (B3, B4…). El error está en el divisor: B7 era relativa y al copiarse apuntó a celdas vacías; debió escribirse $B$7.", false]]}, {"id": "OF-103", "niv": 3, "e": "Si copia la fórmula de C10 a la celda E12, la fórmula resultante es", "f": "Microsoft Support, «Cambiar entre referencias relativas, absolutas y mixtas» (Excel)", "o": [["A", "=$B10*E$9.", "Supone que $B10 queda completamente fija. El signo $ solo fija la columna B; la fila 10 es relativa y avanza a 12.", false], ["B", "=$B12*E$11.", "Supone que la fila de C$9 es relativa. El signo $ delante del 9 fija la fila, de modo que solo cambia la columna (de C a E).", false], ["C", "=$B12*E$9.", "Se copió dos columnas a la derecha y dos filas abajo. En $B10 la columna está fija y la fila es relativa, por lo que queda $B12; en C$9 la columna es relativa y la fila fija, por lo que queda E$9.", true]]}]}, {"comp": "ofimatica", "rol": "tecnico", "tag": "Herramientas ofimáticas · Niveles técnico, administrativo y operativo · BUSCARV", "texto": "Usted es auxiliar administrativo de una procuraduría regional y apoya el reparto de correspondencia. En la hoja «Directorio», el rango A2:D60 contiene: en A, el código de cada dependencia (por ejemplo, PP-04); en B, su nombre; en C, la ciudad, y en D, el correo institucional. En la hoja «Reparto», la celda F2 tiene el código de la dependencia que se debe buscar.", "items": [{"id": "OF-113", "niv": 1, "e": "Para obtener, con coincidencia exacta, la ciudad de la dependencia cuyo código está en F2, la fórmula adecuada es", "f": "Microsoft Support, «Función BUSCARV»", "o": [["A", "=BUSCARV(F2;Directorio!$A$2:$D$60;3;FALSO).", "BUSCARV busca F2 en la primera columna del rango (A) y devuelve la tercera columna del rango (C, ciudad). FALSO exige coincidencia exacta, y las referencias absolutas fijan el rango al copiar.", true], ["B", "=BUSCARV(F2;Directorio!$A$2:$D$60;2;FALSO).", "El indicador de columnas se cuenta desde la primera columna del rango (A = 1). La columna 2 es B, que contiene el nombre, no la ciudad.", false], ["C", "=BUSCARV(F2;Directorio!$A$2:$D$60;3;VERDADERO).", "VERDADERO pide coincidencia aproximada, que supone la primera columna ordenada y puede devolver datos de otra dependencia si el código no existe.", false]]}, {"id": "OF-114", "niv": 2, "e": "Si en la fórmula de la pregunta anterior se usa 5 como indicador_columnas, el resultado será", "f": "Microsoft Support, «¡Cómo corregir un #¡REF! error» (BUSCARV con referencia de columna incorrecta)", "o": [["A", "el valor de la columna E de la hoja, contigua al rango indicado.", "BUSCARV solo devuelve columnas que están dentro del rango del segundo argumento; no extiende la búsqueda a columnas contiguas.", false], ["B", "el error #N/D, porque no se encontró el código en la quinta columna.", "#N/D indica que no se encontró el valor buscado. Aquí el problema es que la columna pedida no existe dentro del rango, lo que genera #¡REF!.", false], ["C", "el error #¡REF!, porque el rango de búsqueda solo tiene cuatro columnas.", "Microsoft explica que BUSCARV devuelve #¡REF! cuando el indicador de columnas es mayor que el número de columnas del rango (A:D tiene cuatro).", true]]}, {"id": "OF-115", "niv": 3, "e": "Le piden obtener el código (columna A) a partir del nombre de la dependencia (columna B), sin reorganizar la tabla. Lo procedente es", "f": "Microsoft Support, «Función BUSCARV» y «Función BUSCARX»", "o": [["A", "usar BUSCARV con indicador_columnas igual a -1 para que devuelva la columna anterior a la de búsqueda.", "El indicador de columnas de BUSCARV empieza en 1 (la primera columna del rango); un valor negativo no devuelve columnas a la izquierda, sino un error.", false], ["B", "usar BUSCARX o INDICE con COINCIDIR, que pueden devolver columnas a la izquierda.", "BUSCARV exige que el valor buscado esté en la primera columna del rango y devuelve columnas situadas a su derecha. BUSCARX, en cambio, devuelve resultados de cualquier lado, al igual que INDICE con COINCIDIR.", true], ["C", "usar BUSCARV con el último argumento en VERDADERO, que permite buscar en cualquier columna del rango.", "VERDADERO solo activa la coincidencia aproximada; la búsqueda sigue haciéndose en la primera columna del rango.", false]]}]}, {"comp": "ofimatica", "rol": "general", "tag": "Herramientas ofimáticas · Funciones de fecha: DIA.LAB, DIAS.LAB y HOY", "texto": "Usted es técnico de la Oficina de Atención al Ciudadano de la Procuraduría y lleva en Excel el control de términos de las peticiones. La celda B2 contiene la fecha de radicación de una petición, miércoles 10/03/2027. En H2:H4 están registrados como festivos el 22, el 25 y el 26 de marzo de 2027; no hay otros festivos en marzo ni a comienzos de abril. La oficina no atiende sábados ni domingos.", "items": [{"id": "OF-119", "niv": 3, "e": "La fórmula =DIA.LAB(B2;10;H2:H4) devuelve la fecha", "f": "Microsoft Support, «Función DIA.LAB»; cálculo verificado", "o": [["A", "24/03/2027.", "Es el resultado de =DIA.LAB(B2;10), sin el argumento de festivos. Con H2:H4 se excluyen el 22, el 25 y el 26 de marzo.", false], ["B", "29/03/2027.", "DIA.LAB cuenta días laborables posteriores a la fecha inicial y excluye fines de semana y festivos: 11 y 12 (2), 15 a 19 (7), 23 y 24 (9) y lunes 29 de marzo (10).", true], ["C", "01/04/2027.", "Resulta de sumar a mano tres días hábiles más al resultado correcto. La función ya descuenta los festivos indicados en H2:H4; no hay que agregarlos.", false]]}, {"id": "OF-120", "niv": 3, "e": "La fórmula =DIAS.LAB(FECHA(2027;3;1);FECHA(2027;3;31);H2:H4) devuelve", "f": "Microsoft Support, «Función DIAS.LAB»; cálculo verificado", "o": [["A", "20.", "DIAS.LAB cuenta los días laborables entre ambas fechas, incluidas, sin fines de semana ni festivos: marzo de 2027 tiene 23 días de lunes a viernes, menos los 3 festivos de H2:H4.", true], ["B", "23.", "Es el número de días de lunes a viernes de marzo de 2027 sin descontar los festivos del argumento vacaciones (H2:H4).", false], ["C", "31.", "Es el número de días calendario del mes. DIAS.LAB excluye sábados, domingos y los festivos indicados.", false]]}, {"id": "OF-121", "niv": 1, "e": "Un compañero propone llenar la columna de fechas de radicación con la fórmula =HOY(). La propuesta es inadecuada porque", "f": "Microsoft Support, «Función HOY»", "o": [["A", "la función HOY devuelve la fecha y la hora, lo que impide calcular términos en días completos.", "Es falsa: la que devuelve fecha y hora es AHORA. HOY devuelve solo la fecha; el problema es que no permanece fija.", false], ["B", "la función HOY devuelve un texto que las funciones DIA.LAB y DIAS.LAB no aceptan como fecha.", "HOY devuelve un número de serie de fecha, que DIA.LAB y DIAS.LAB aceptan. El inconveniente es que el valor cambia cada día.", false], ["C", "la función HOY se recalcula y la fecha cambiaría cada día que se abra el libro.", "HOY devuelve la fecha actual y se vuelve a calcular al abrir o recalcular el libro; sirve para cálculos respecto del día de hoy, no para registrar una fecha fija como la de radicación.", true]]}]}, {"comp": "ofimatica", "rol": "general", "tag": "Herramientas ofimáticas · Estilos y tabla de contenido en Word", "texto": "Usted es técnico de una dependencia de la Procuraduría y prepara un informe de 60 páginas en Word. A los títulos de los capítulos les dio formato a mano (negrita, 14 puntos) y a los subtítulos les aplicó el estilo Título 2. Al insertar la tabla de contenido automática, solo aparecen los subtítulos. Días después agregó dos capítulos nuevos y la tabla tampoco los muestra.", "items": [{"id": "OF-134", "niv": 1, "e": "Los títulos de los capítulos no aparecen en la tabla de contenido porque", "f": "Microsoft Support, «Insertar una tabla de contenido»", "o": [["A", "el programa excluye de la tabla los títulos escritos con más de 12 puntos.", "El tamaño de letra no determina la inclusión en la tabla; lo determina el estilo de título aplicado.", false], ["B", "esos títulos tienen solo formato directo y no un estilo de título.", "Microsoft explica que la tabla de contenido se basa en los títulos del documento y que las entradas faltan cuando no tienen estilo de título; basta aplicarles Título 1 y actualizar.", true], ["C", "la tabla de contenido automática admite un solo nivel de títulos por documento.", "La tabla automática admite varios niveles (Título 1, Título 2…); el problema es que los capítulos no tienen estilo de título.", false]]}, {"id": "OF-135", "niv": 1, "e": "Una vez aplicado el estilo correcto, para que la tabla muestre los capítulos nuevos se debe", "f": "Microsoft Support, «Insertar una tabla de contenido» y «Actualizar una tabla de contenido»", "o": [["A", "escribir a mano las entradas nuevas dentro de la tabla.", "Las entradas escritas a mano se perderían al actualizar el campo y no quedarían vinculadas a los títulos ni a sus páginas.", false], ["B", "insertar un salto de sección antes de cada capítulo para que la tabla los detecte.", "Los saltos de sección sirven para cambiar formato de página o encabezados; no influyen en la tabla de contenido.", false], ["C", "actualizar la tabla de contenido (Actualizar campo).", "La tabla de contenido es un campo que no se actualiza solo; tras cambios en el documento se usa Actualizar campo o Actualizar tabla.", true]]}, {"id": "OF-136", "niv": 2, "e": "Si se decide que todos los títulos de capítulo vayan en otra fuente y tamaño, la forma más eficiente es", "f": "Microsoft Support, «Personalizar o crear estilos» (Word)", "o": [["A", "modificar el estilo Título 1, con lo cual cambian todos los párrafos que lo tienen aplicado.", "Al modificar un estilo, Word actualiza de una vez todos los párrafos que lo usan, lo que garantiza uniformidad y mantiene la tabla de contenido.", true], ["B", "cambiar el formato de cada título con Copiar formato, ya que los estilos predefinidos no se modifican.", "Los estilos predefinidos sí pueden modificarse; cambiar título por título es más lento y propenso a inconsistencias.", false], ["C", "cambiar la fuente de la tabla de contenido, que transmite el formato a los títulos.", "El formato de la tabla de contenido no se traslada a los títulos del documento; son estilos distintos.", false]]}]}, {"comp": "sistemas_gestion", "rol": "general", "tag": "Sistemas de gestión (MIPG, control interno y calidad) · MIPG: definición, objetivos y ámbito", "texto": "Usted es profesional de la Oficina de Planeación de la Procuraduría General de la Nación y prepara una charla de inducción sobre el Modelo Integrado de Planeación y Gestión (MIPG) para servidores recién posesionados. Un asistente afirma que el MIPG «solo existe para los ministerios y las alcaldías» y que, por tanto, nada tiene que ver con un organismo de control. Otro pregunta qué es exactamente el modelo y qué objetivos persigue.", "items": [{"id": "SG-101", "niv": 3, "e": "Según el Decreto 1083 de 2015, modificado por el Decreto 1499 de 2017, frente a un organismo de control lo correcto es afirmar que", "f": "Decreto 1083 de 2015, art. 2.2.22.3.4 (Decreto 1499 de 2017, art. 1); Ley 87 de 1993, art. 5", "o": [["A", "debe aplicar la política de control interno y adoptar las otras políticas del modelo solo en lo que le resulte aplicable.", "El artículo 2.2.22.3.4 dispone que el MIPG se adopta por la rama ejecutiva y que los organismos de control, entre otros, aplican la política de control interno de la Ley 87 de 1993 y las demás políticas de gestión y desempeño en la medida en que les sean aplicables según sus normas.", true], ["B", "debe adoptar el modelo en su integridad, en las mismas condiciones que las entidades de la rama ejecutiva del orden nacional.", "La adopción integral se prevé para la rama ejecutiva; para los organismos de control el decreto establece una aplicación de las políticas en la medida en que les sean aplicables.", false], ["C", "está excluido del modelo y de la Ley 87 de 1993, porque es él quien ejerce control sobre las demás entidades.", "La Ley 87 de 1993 (art. 5) incluye expresamente a los organismos de control, y el decreto les ordena aplicar la política de control interno.", false]]}, {"id": "SG-102", "niv": 1, "e": "El decreto define el MIPG como", "f": "Decreto 1083 de 2015, art. 2.2.22.3.2", "o": [["A", "una certificación de calidad que reemplaza a la norma ISO 9001 en las entidades públicas.", "El MIPG no es una certificación; el Sistema de Gestión que lo opera integró los antiguos sistemas de desarrollo administrativo y de gestión de la calidad de las leyes 489 de 1998 y 872 de 2003.", false], ["B", "un marco de referencia para dirigir, planear, ejecutar, hacer seguimiento, evaluar y controlar la gestión de las entidades.", "Es la definición del artículo 2.2.22.3.2, que agrega que su fin es generar resultados que atiendan los planes de desarrollo y resuelvan las necesidades de los ciudadanos, con integridad y calidad.", true], ["C", "un sistema de evaluación externa con el que la Función Pública califica y sanciona a las entidades que incumplen sus metas.", "La Función Pública mide el desempeño (por ejemplo, con el FURAG), pero el MIPG no es un régimen sancionatorio sino un marco de gestión de cada entidad.", false]]}, {"id": "SG-103", "niv": 1, "e": "Entre los objetivos que el decreto asigna al MIPG se encuentra", "f": "Decreto 1083 de 2015, art. 2.2.22.3.3", "o": [["A", "centralizar en la Función Pública la aprobación de los planes de acción anuales de cada una de las entidades.", "Ninguno de los objetivos del artículo 2.2.22.3.3 traslada a la Función Pública la aprobación de los planes de las entidades.", false], ["B", "sustituir el control fiscal que ejercen las contralorías sobre las entidades públicas.", "El MIPG no sustituye el control fiscal externo; se articula con el sistema de control interno de cada entidad.", false], ["C", "promover la participación ciudadana en la planeación, gestión y evaluación de las entidades.", "Es el objetivo 4 del artículo 2.2.22.3.3, junto con fortalecer el liderazgo y el talento humano, agilizar la operación, desarrollar una cultura basada en información y control, y promover la coordinación entre entidades.", true]]}]}, {"comp": "sistemas_gestion", "rol": "general", "tag": "Sistemas de gestión (MIPG, control interno y calidad) · Comité de coordinación de control interno e informes", "texto": "Usted es profesional universitario de la oficina de control interno de la alcaldía de un municipio. El jefe de la oficina elaboró el plan anual de auditoría de la vigencia y el estatuto de auditoría interna, y el alcalde pregunta qué instancia debe aprobarlos. Además, la oficina debe publicar el informe de evaluación independiente del estado del sistema de control interno.", "items": [{"id": "SG-116", "niv": 1, "e": "Según la Ley 87 de 1993, el comité de coordinación del sistema de control interno debe establecerse", "f": "Ley 87 de 1993, art. 13", "o": [["A", "en la gobernación, como instancia común para los municipios del departamento.", "El comité es propio de cada organismo o entidad (art. 13), no una instancia departamental compartida.", false], ["B", "al más alto nivel jerárquico de la entidad.", "El artículo 13 de la Ley 87 de 1993 ordena establecer el comité de coordinación del sistema de control interno al más alto nivel jerárquico.", true], ["C", "dentro de la oficina de control interno, que lo preside y lo integra.", "La ley no lo ubica dentro de la oficina de control interno, sino al más alto nivel jerárquico de la entidad.", false]]}, {"id": "SG-117", "niv": 2, "e": "El plan anual de auditoría y el estatuto de auditoría interna los aprueba", "f": "Decreto 1083 de 2015, art. 2.2.21.1.6, lits. b y c (Decreto 648 de 2017)", "o": [["A", "el concejo municipal, mediante acuerdo, a iniciativa del alcalde.", "El concejo no aprueba los instrumentos internos de auditoría de la administración; es función del comité de coordinación de control interno.", false], ["B", "el Comité Institucional de Gestión y Desempeño.", "Ese comité orienta la implementación del MIPG; la aprobación del plan y del estatuto de auditoría corresponde al comité de coordinación de control interno.", false], ["C", "el Comité Institucional de Coordinación de Control Interno.", "El artículo 2.2.21.1.6 del Decreto 1083 de 2015 (adicionado por el Decreto 648 de 2017) le asigna aprobar el Plan Anual de Auditoría y el Estatuto de Auditoría Interna con el Código de Ética del auditor.", true]]}, {"id": "SG-118", "niv": 2, "e": "El jefe de control interno debe publicar en el sitio web de la entidad el informe de evaluación independiente del estado del sistema de control interno", "f": "Ley 87 de 1993, art. 14 (modificado por la Ley 1474 de 2011, art. 9, y por el Decreto Ley 2106 de 2019, art. 156)", "o": [["A", "cada cuatro meses.", "Era la periodicidad del informe pormenorizado antes de la modificación del Decreto Ley 2106 de 2019; hoy el término es de seis meses.", false], ["B", "cada seis meses.", "El artículo 14 de la Ley 87 de 1993, modificado por el artículo 156 del Decreto Ley 2106 de 2019, ordena publicarlo cada seis meses, so pena de falta disciplinaria grave (antes, el artículo 9 de la Ley 1474 de 2011 fijaba cuatro meses para el informe pormenorizado).", true], ["C", "una vez al año, con el informe de rendición de cuentas.", "La norma exige una periodicidad semestral, no anual.", false]]}]}, {"comp": "sistemas_gestion", "rol": "general", "tag": "Sistemas de gestión (MIPG, control interno y calidad) · Tipos de controles", "texto": "Usted es técnico de la oficina de control interno de una empresa social del Estado y revisa tres controles del proceso de nómina: (1) antes de cargar las novedades, la coordinadora de talento humano revisa que cada una tenga el acto administrativo que la soporta; (2) durante la liquidación, una vez calculados los valores, se genera un reporte de diferencias superiores al 10 % frente al mes anterior y los errores encontrados obligan a reliquidar; (3) cuando se detecta un pago en exceso ya realizado, la tesorería inicia el procedimiento de reintegro.", "items": [{"id": "SG-134", "niv": 1, "e": "Según la guía de riesgos de la Función Pública, el control (1) es", "f": "Función Pública, Guía para la Gestión Integral del Riesgo en Entidades Públicas, versión 7 (2025), tipologías de controles", "o": [["A", "preventivo y manual.", "Se acciona antes de la actividad que origina el riesgo (cargar novedades) y lo ejecuta una persona.", true], ["B", "detectivo y manual.", "El detectivo se acciona durante la ejecución del proceso; este control opera antes, en la entrada.", false], ["C", "preventivo y automático.", "Es preventivo, pero lo ejecuta una persona (la coordinadora), por lo que es manual; el automático lo ejecuta un sistema.", false]]}, {"id": "SG-135", "niv": 2, "e": "Por el momento en que se acciona, el control (2) es", "f": "Función Pública, Guía para la Gestión Integral del Riesgo en Entidades Públicas, versión 7 (2025), tipologías de controles", "o": [["A", "detectivo, porque actúa en plena liquidación, con los valores ya calculados.", "La guía define el control detectivo como el que se acciona durante la ejecución del proceso y detecta el riesgo, aunque genera reprocesos, como la reliquidación.", true], ["B", "preventivo, porque opera antes de que se pague la nómina.", "No actúa antes de la actividad que origina el riesgo (la liquidación), sino durante ella, una vez calculados los valores.", false], ["C", "correctivo, porque genera un reporte de diferencias ya ocurridas.", "El correctivo se acciona después de materializado el riesgo (por ejemplo, con el pago ya hecho); aquí aún no se ha pagado.", false]]}, {"id": "SG-136", "niv": 1, "e": "El control (3) es", "f": "Función Pública, Guía para la Gestión Integral del Riesgo en Entidades Públicas, versión 7 (2025), tipologías de controles", "o": [["A", "preventivo.", "Se acciona después de hecho el pago en exceso, no antes de la actividad que origina el riesgo.", false], ["B", "detectivo.", "No opera durante la ejecución del proceso, sino una vez materializado el riesgo.", false], ["C", "correctivo.", "La guía define el control correctivo como el que se acciona a la salida del proceso, después de materializado el riesgo; el reintegro busca reparar el daño.", true]]}]}, {"comp": "sistemas_gestion", "rol": "tecnico", "tag": "Sistemas de gestión (MIPG, control interno y calidad) · Niveles técnico, administrativo y operativo · Seguridad de la información: confidencialidad, integridad y disponibilidad", "texto": "Usted es técnico de la Oficina de Planeación de una entidad nacional que identifica riesgos de seguridad de la información con la guía de riesgos de la Función Pública, cuyo capítulo correspondiente clasifica estos riesgos como pérdida de confidencialidad, de integridad o de disponibilidad. Se analizan dos eventos: (1) un servidor envía por error a un ciudadano un expediente con datos personales de terceros; (2) el servidor de archivos queda fuera de servicio dos días y nadie puede consultar los documentos. Además, la entidad estudia adquirir una póliza que cubra las pérdidas por incidentes cibernéticos.", "items": [{"id": "SG-149", "niv": 1, "e": "El evento (1) corresponde a una pérdida de", "f": "Función Pública, Guía para la Gestión Integral del Riesgo en Entidades Públicas, versión 7 (2025), capítulo de riesgos de seguridad de la información (tipo de riesgo)", "o": [["A", "disponibilidad.", "La disponibilidad se afecta cuando los autorizados no pueden acceder a la información; aquí el problema es el acceso de un tercero no autorizado.", false], ["B", "confidencialidad.", "La información llegó a una persona no autorizada para conocerla; eso afecta la confidencialidad.", true], ["C", "integridad.", "La integridad se pierde cuando la información se altera sin autorización; aquí el expediente no se modificó.", false]]}, {"id": "SG-150", "niv": 1, "e": "El evento (2) corresponde a una pérdida de", "f": "Función Pública, Guía para la Gestión Integral del Riesgo en Entidades Públicas, versión 7 (2025), capítulo de riesgos de seguridad de la información (tipo de riesgo)", "o": [["A", "disponibilidad.", "La disponibilidad implica que la información sea accesible para los autorizados cuando la requieren; la caída del servidor la impidió durante dos días.", true], ["B", "confidencialidad.", "Nadie no autorizado accedió a la información; el problema es que los autorizados no pudieron consultarla.", false], ["C", "integridad.", "Los documentos no fueron alterados; simplemente no estuvieron accesibles.", false]]}, {"id": "SG-151", "niv": 2, "e": "La adquisición de la póliza contra incidentes cibernéticos corresponde a la opción de tratamiento de", "f": "Función Pública, Guía para la Gestión Integral del Riesgo en Entidades Públicas, versión 7 (2025), opciones de tratamiento (riesgos de seguridad de la información)", "o": [["A", "evitar el riesgo.", "Evitar implica eliminar la fuente del riesgo (por ejemplo, dar de baja un servidor); la póliza no elimina la amenaza.", false], ["B", "aceptar el riesgo.", "Aceptar es asumir el riesgo sin acciones adicionales cuando está por debajo del apetito definido; contratar una póliza es una medida de tratamiento.", false], ["C", "compartir el riesgo.", "La guía describe compartir como trasladar parte de las consecuencias de la materialización, por ejemplo con la adquisición de una ciberpóliza.", true]]}]}, {"comp": "disciplinario", "rol": "general", "tag": "Código General Disciplinario · Destinatarios de la ley disciplinaria", "texto": "Usted es profesional universitario de una procuraduría provincial y recibe tres quejas. La primera es contra el interventor externo, una persona natural contratada por un municipio para vigilar la construcción de un puente, a quien se acusa de certificar avances de obra inexistentes. La segunda es contra un operario de una empresa privada de aseo que presta el servicio en el municipio, por maltratar a un usuario durante la recolección; la empresa no ejerce funciones públicas ni administra recursos públicos. La tercera es contra un exsecretario de obras que renunció hace seis meses, por hechos ocurridos en 2025, cuando ejercía el cargo.", "items": [{"id": "DI-108", "niv": 1, "e": "Sobre el interventor externo, es correcto afirmar que", "f": "Ley 1952 de 2019, arts. 69 y 70", "o": [["A", "no es disciplinable, porque su vínculo con el municipio es contractual y solo responde civil, fiscal y penalmente.", "El artículo 70 de la Ley 1952 de 2019 incluye expresamente a los particulares que cumplen labores de interventoría en contratos estatales, cualquiera que sea su vínculo.", false], ["B", "es disciplinable como particular, porque cumple labores de interventoría en un contrato estatal.", "El régimen disciplinario de los particulares se aplica, entre otros, a quienes cumplen labores de interventoría o supervisión en los contratos estatales (Ley 1952 de 2019, art. 70).", true], ["C", "es disciplinable como servidor público, porque recibe honorarios pagados por el municipio.", "Recibir honorarios no lo convierte en servidor público; responde como particular disciplinable bajo el régimen especial de los artículos 69 y siguientes de la Ley 1952 de 2019.", false]]}, {"id": "DI-109", "niv": 3, "e": "En relación con la queja contra el operario de la empresa privada de aseo, debe concluirse que", "f": "Ley 1952 de 2019, art. 70", "o": [["A", "es disciplinable como particular, porque presta un servicio público domiciliario a la comunidad.", "El artículo 70 de la Ley 1952 de 2019 excluye a los particulares que presten servicios públicos, salvo que en esa actividad desempeñen funciones públicas, lo que el caso descarta.", false], ["B", "debe remitirse a control disciplinario interno de la alcaldía, competente frente a los contratistas del municipio.", "Las oficinas de control disciplinario interno conocen de los asuntos contra los servidores de su propia entidad (art. 2 de la Ley 1952 de 2019); además, el operario no es sujeto disciplinable.", false], ["C", "no es sujeto disciplinable, porque prestar un servicio público sin ejercer funciones públicas no lo hace destinatario del código.", "No son disciplinables los particulares que prestan servicios públicos, salvo que en ejercicio de esas actividades desempeñen funciones públicas (Ley 1952 de 2019, art. 70, inciso 3). La empresa no ejerce funciones públicas.", true]]}, {"id": "DI-110", "niv": 1, "e": "Frente al exsecretario de obras, la acción disciplinaria", "f": "Ley 1952 de 2019, arts. 25, 32 y 89", "o": [["A", "procede, porque los servidores públicos siguen siendo destinatarios de la ley disciplinaria aunque se retiren.", "Son destinatarios de la ley disciplinaria los servidores públicos aunque se encuentren retirados del servicio, y la acción procede aunque ya no ejerzan funciones públicas (Ley 1952 de 2019, arts. 25 y 89).", true], ["B", "solo procede si vuelve a ocupar un cargo público antes de que se profiera el fallo.", "El artículo 89 de la Ley 1952 de 2019 no impone esa condición; si la sanción no puede cumplirse por el retiro, se registra en la Procuraduría y en la hoja de vida.", false], ["C", "no procede, porque la renuncia aceptada por la administración extingue la acción disciplinaria en curso o por iniciar.", "La renuncia no es causal de extinción de la acción; estas son la muerte del disciplinable, la caducidad y la prescripción (art. 32 de la Ley 1952 de 2019).", false]]}, {"id": "DI-111", "niv": 3, "e": "Si el interventor resultara responsable de una falta gravísima que no implicó detrimento del patrimonio público, la sanción principal que le corresponde como particular es", "f": "Ley 1952 de 2019, arts. 72 y 73", "o": [["A", "destitución e inhabilidad general de diez a veinte años.", "La destitución es la sanción del particular solo cuando la prestación del servicio es permanente y su vinculación proviene de nombramiento oficial (art. 73 de la Ley 1952 de 2019); el interventor es contratista.", false], ["B", "una multa entre 10 y 100 salarios mínimos mensuales, junto con una inhabilidad de entre uno y veinte años.", "Los particulares destinatarios de la ley disciplinaria se sancionan con multa de 10 a 100 salarios mínimos mensuales legales vigentes al momento del hecho y, concurrentemente, inhabilidad de uno a veinte años para ejercer empleo o función pública, prestar servicios al Estado o contratar con él (Ley 1952 de 2019, art. 73).", true], ["C", "suspensión de la ejecución del contrato de uno a doce meses e inhabilidad especial.", "Esa sanción no existe en el régimen de los particulares. El artículo 73 de la Ley 1952 de 2019 prevé multa e inhabilidad concurrente.", false]]}]}, {"comp": "disciplinario", "rol": "general", "tag": "Código General Disciplinario · Poder disciplinario preferente", "texto": "Usted es profesional universitario de una procuraduría provincial de instrucción. La oficina de control disciplinario interno de una alcaldía abrió investigación contra el secretario de movilidad por presuntas irregularidades en la expedición de licencias. El caso tiene amplia difusión y el disciplinado pidió a la Procuraduría, con argumentos sustentados, que asuma el proceso porque considera vulnerado su debido proceso. Al mismo tiempo, el personero municipal anunció que también estudia asumir la investigación.", "items": [{"id": "DI-134", "niv": 2, "e": "Para que la Procuraduría asuma la investigación iniciada por la oficina de control interno, se requiere", "f": "Ley 1952 de 2019, arts. 3 y 86", "o": [["A", "que la actuación todavía esté en indagación previa, pues abierta la investigación ya no puede asumirse.", "La Procuraduría puede iniciar, proseguir o remitir cualquier investigación o juzgamiento, e incluso asumir la segunda instancia (art. 3 de la Ley 1952 de 2019).", false], ["B", "que la oficina de control interno acepte remitirla voluntariamente y el alcalde lo autorice.", "El poder preferente no depende de la voluntad de la oficina ni del jefe de la entidad, a quien solo se informa (art. 86 de la Ley 1952 de 2019).", false], ["C", "decisión motivada del funcionario competente; la oficina suspenderá la actuación y la pondrá a su disposición.", "La Procuraduría, previa decisión motivada del funcionario competente, de oficio o a petición del disciplinado que invoque sustentadamente violación del debido proceso, puede asumir la investigación de otro organismo, que la suspenderá y la pondrá a su disposición (Ley 1952 de 2019, arts. 3 y 86).", true]]}, {"id": "DI-135", "niv": 1, "e": "Sobre el anuncio del personero, es correcto afirmar que las personerías municipales", "f": "Ley 1952 de 2019, arts. 3, 86 y 92", "o": [["A", "tienen poder disciplinario preferente frente a la administración municipal.", "Las personerías municipales y distritales tienen poder disciplinario preferente frente a la administración (Ley 1952 de 2019, arts. 3 y 86).", true], ["B", "carecen de poder preferente, porque esa potestad es exclusiva de la Procuraduría General de la Nación.", "El artículo 3 de la Ley 1952 de 2019 reconoce poder preferente también a las personerías frente a la administración, sin perjuicio del de la Procuraduría.", false], ["C", "solo ejercen poder preferente frente a los concejales y ediles del municipio.", "Los concejales y ediles son servidores de elección popular, cuyo conocimiento corresponde a la Procuraduría (art. 92 de la Ley 1952 de 2019); el poder preferente de la personería es frente a la administración.", false]]}, {"id": "DI-136", "niv": 2, "e": "Una vez abrió la investigación, la oficina de control disciplinario interno debía", "f": "Ley 1952 de 2019, art. 216", "o": [["A", "informar de inmediato a la Viceprocuraduría para que se decida si se ejerce el poder preferente.", "Si la investigación disciplinaria la inicia una oficina de control disciplinario interno, esta da aviso inmediato a la Viceprocuraduría General de la Nación y al funcionario competente de esa entidad o de la personería correspondiente, para que decida sobre el ejercicio del poder disciplinario preferente (Ley 1952 de 2019, art. 216).", true], ["B", "pedir autorización previa a la Procuraduría antes de notificar el auto de apertura al disciplinado.", "La ley no exige autorización previa; exige dar aviso inmediato para que se decida sobre el poder preferente (art. 216 de la Ley 1952 de 2019).", false], ["C", "esperar a que el disciplinado manifieste si acepta que la oficina lo investigue.", "La competencia no depende de la aceptación del disciplinado; la acción disciplinaria es pública y oficiosa (arts. 85 y 86 de la Ley 1952 de 2019).", false]]}]}, {"comp": "disciplinario", "rol": "general", "tag": "Código General Disciplinario · Queja anónima, inhibitoria y queja temeraria", "texto": "Usted es técnico de la oficina de control disciplinario interno de una gobernación y clasifica la correspondencia. Recibe un escrito anónimo que afirma, sin ningún dato concreto ni prueba, que «todos en la secretaría de salud son corruptos». Recibe otro anónimo que adjunta copias de las certificaciones de cumplimiento firmadas por un supervisor y de los registros migratorios que muestran que el contratista estaba fuera del país en los días certificados. Además, en un proceso ya tramitado se estableció que un ciudadano presentó una queja temeraria contra una funcionaria.", "items": [{"id": "DI-150", "niv": 1, "e": "Frente al segundo escrito anónimo, la acción disciplinaria", "f": "Ley 1952 de 2019, art. 86; Ley 190 de 1995, art. 38; Ley 24 de 1992, art. 27", "o": [["A", "solo puede iniciarse si quien lo envió se identifica y ratifica la queja bajo juramento.", "La ley no exige identificar al autor cuando el anónimo trae pruebas suficientes; en ese caso la autoridad actúa de oficio (art. 38 de la Ley 190 de 1995).", false], ["B", "no puede iniciarse, porque la ley prohíbe sin excepción tramitar quejas anónimas.", "La prohibición tiene excepción: el anónimo acompañado de medios probatorios suficientes permite actuar de oficio (art. 86 de la Ley 1952 de 2019 y art. 38 de la Ley 190 de 1995).", false], ["C", "puede iniciarse, porque el anónimo viene acompañado de medios probatorios suficientes.", "La acción no procede por anónimos, salvo que cumplan los requisitos del artículo 38 de la Ley 190 de 1995 y del artículo 27 de la Ley 24 de 1992, es decir, que existan medios probatorios suficientes sobre la infracción (Ley 1952 de 2019, art. 86).", true]]}, {"id": "DI-151", "niv": 2, "e": "Ante el primer escrito anónimo, lo procedente es", "f": "Ley 1952 de 2019, arts. 10, 86, 208 y 209", "o": [["A", "abrir investigación contra el secretario de salud, como responsable de toda la dependencia.", "Abrir investigación solo por ser jefe de la dependencia supondría responsabilidad objetiva, proscrita por el artículo 10 de la Ley 1952 de 2019; además, no hay hechos concretos.", false], ["B", "inhibirse de plano de iniciar actuación, porque la información es absolutamente inconcreta y difusa.", "Cuando la información o queja se presenta de manera absolutamente inconcreta o difusa, el funcionario se inhibe de plano de iniciar actuación, y contra esa decisión no procede recurso (Ley 1952 de 2019, art. 209). Además, el anónimo carece de medios probatorios (art. 86).", true], ["C", "abrir indagación previa para identificar a los servidores de la secretaría a los que alude el escrito.", "La indagación previa supone una posible falta cuyo autor no está identificado (art. 208). Aquí no hay hecho concreto alguno y el anónimo no trae pruebas (art. 86).", false]]}, {"id": "DI-152", "niv": 2, "e": "Advertida la temeridad de la queja del ciudadano, la autoridad disciplinaria puede imponerle", "f": "Ley 1952 de 2019, art. 210 (modificado por la Ley 2094 de 2021, art. 35)", "o": [["A", "una amonestación escrita, que se anota en el certificado de antecedentes del ciudadano.", "La amonestación es una sanción para disciplinables por faltas leves culposas (art. 48); al quejoso temerario se le impone multa (art. 210).", false], ["B", "una multa de hasta 180 salarios mínimos diarios, previa citación para escuchar sus explicaciones.", "Advertida la temeridad, la autoridad puede imponer multa de hasta 180 salarios diarios mínimos legales vigentes, citando al quejoso para que dé explicaciones, aporte pruebas y ejerza contradicción (Ley 1952 de 2019, art. 210, modificado por la Ley 2094 de 2021).", true], ["C", "una multa de 10 a 100 salarios mínimos mensuales legales vigentes, sin necesidad de oírlo.", "Ese rango es la multa de los particulares disciplinables (art. 73). Para el quejoso temerario la multa es de hasta 180 salarios diarios y debe oírse previamente (art. 210).", false]]}]}, {"comp": "disciplinario", "rol": "tecnico", "tag": "Código General Disciplinario · Niveles técnico, administrativo y operativo · Términos del juicio ordinario", "texto": "Usted es técnico de la secretaría de una procuraduría provincial de juzgamiento. En un proceso contra un servidor de una gobernación, el funcionario de juzgamiento decidió aplicar el juicio ordinario y le pide controlar los términos de cada etapa. El apoderado del disciplinado, inconforme con el pliego de cargos que se le notificó, llama a la secretaría para preguntar qué recurso puede presentar contra esa decisión.", "items": [{"id": "DI-165", "niv": 2, "e": "En el auto que ordena el juicio ordinario, el expediente queda a disposición de los sujetos procesales para presentar descargos y aportar o solicitar pruebas durante", "f": "Ley 1952 de 2019, art. 225B (adicionado por la Ley 2094 de 2021, art. 41)", "o": [["A", "diez días.", "Diez días es el término de los alegatos de conclusión del juicio ordinario (art. 225E) y el de los descargos tras una variación de cargos (art. 225D), no el inicial para descargos.", false], ["B", "quince días.", "En el auto que decide aplicar el procedimiento ordinario se dispone que, por el término de quince días, el expediente quede a disposición de los sujetos procesales para presentar descargos y aportar y solicitar pruebas (Ley 1952 de 2019, art. 225B).", true], ["C", "veinte días.", "Veinte días es el límite superior para celebrar la audiencia del juicio verbal (art. 225H) y el término de práctica de pruebas en ese juicio (art. 227), no el de descargos del ordinario.", false]]}, {"id": "DI-166", "niv": 2, "e": "Las pruebas decretadas en el juicio ordinario deben practicarse en un término no mayor de", "f": "Ley 1952 de 2019, art. 225C (adicionado por la Ley 2094 de 2021, art. 42)", "o": [["A", "veinte días.", "Veinte días, prorrogables, es el término de práctica de pruebas del juicio verbal (art. 227 de la Ley 1952 de 2019).", false], ["B", "cuarenta y cinco días.", "Cuarenta y cinco días es el término para decidir la segunda instancia (art. 234), no el periodo probatorio del juicio ordinario.", false], ["C", "noventa días.", "Las pruebas ordenadas en el juicio ordinario se practican en un término no mayor de noventa días (Ley 1952 de 2019, art. 225C).", true]]}, {"id": "DI-167", "niv": 2, "e": "Al apoderado se le debe informar que, contra el pliego de cargos,", "f": "Ley 1952 de 2019, art. 222", "o": [["A", "no procede recurso alguno; su defensa se ejerce con los descargos y las pruebas en el juicio.", "El art. 222 de la Ley 1952 de 2019 señala que contra la decisión de formular pliego de cargos no procede recurso; el disciplinado controvierte los cargos al presentar descargos y aportar o pedir pruebas.", true], ["B", "procede el recurso de reposición, que debe interponer dentro de los cinco días siguientes a la notificación.", "El pliego de cargos no admite recursos (art. 222 de la Ley 1952 de 2019); la defensa frente a los cargos se ejerce con los descargos y la solicitud de pruebas.", false], ["C", "procede el recurso de apelación ante el superior funcional, en el efecto devolutivo.", "La apelación no procede contra el pliego de cargos, que no admite recursos (art. 222 de la Ley 1952 de 2019).", false]]}]}, {"comp": "disciplinario", "rol": "general", "tag": "Código General Disciplinario · Suspensión provisional", "texto": "Usted es profesional universitario de la oficina de control disciplinario interno de un hospital departamental. En la investigación contra el almacenista por una presunta falta gravísima relacionada con el manejo de medicamentos, hay serios elementos de juicio de que, si permanece en el cargo, podría alterar los inventarios que son prueba del proceso. El jefe de la oficina evalúa ordenar la suspensión provisional del almacenista y le pide revisar su procedencia, su término y sus efectos.", "items": [{"id": "DI-174", "niv": 2, "e": "La suspensión provisional del almacenista procede porque", "f": "Ley 1952 de 2019, art. 217", "o": [["A", "se investiga una falta gravísima y su permanencia en el cargo posibilita que interfiera en la investigación.", "Durante la investigación o el juzgamiento por faltas gravísimas o graves, puede ordenarse motivadamente la suspensión provisional, sin remuneración, cuando haya serios elementos de juicio de que la permanencia en el cargo posibilita la interferencia en el trámite, o la continuación o reiteración de la falta (Ley 1952 de 2019, art. 217).", true], ["B", "procede en cualquier proceso, sin importar la gravedad de la falta, cuando la pide el quejoso.", "Solo procede por faltas gravísimas o graves y por decisión motivada del funcionario, no a petición del quejoso (art. 217 de la Ley 1952 de 2019).", false], ["C", "toda apertura de investigación por falta gravísima conlleva automáticamente esa medida.", "La medida no es automática: debe ordenarse motivadamente y exige serios elementos de juicio sobre interferencia, continuidad o reiteración de la falta (art. 217 de la Ley 1952 de 2019).", false]]}, {"id": "DI-175", "niv": 2, "e": "Sobre el término de la suspensión provisional, es correcto afirmar que", "f": "Ley 1952 de 2019, art. 217", "o": [["A", "es de seis meses improrrogables y contra el auto que la ordena procede apelación.", "El término es de tres meses prorrogables, y el auto no se apela sino que se somete a consulta (art. 217 de la Ley 1952 de 2019).", false], ["B", "es de un mes, prorrogable mes a mes hasta que se profiera el fallo de primera instancia.", "La ley fija tres meses prorrogables hasta en otro tanto, y otros tres meses una vez proferido el fallo de primera o única instancia (art. 217).", false], ["C", "es de tres meses durante la investigación o el juzgamiento, prorrogable hasta en otro tanto, y el auto se somete a consulta.", "El término de la suspensión provisional es de tres meses, prorrogable hasta en otro tanto; solo después del fallo de primera o única instancia cabe otra prórroga de tres meses. El auto que la decreta y las prórrogas se someten a consulta, sin perjuicio de su cumplimiento inmediato (Ley 1952 de 2019, art. 217).", true]]}, {"id": "DI-176", "niv": 1, "e": "Si la investigación termina con fallo absolutorio, el almacenista", "f": "Ley 1952 de 2019, art. 218", "o": [["A", "será reintegrado y tendrá derecho al pago de la remuneración dejada de percibir.", "Quien fue suspendido provisionalmente es reintegrado y tiene derecho al reconocimiento y pago de la remuneración dejada de percibir cuando la investigación termina con fallo absolutorio, archivo o terminación, o cuando expira la suspensión sin fallo (Ley 1952 de 2019, art. 218).", true], ["B", "solo podrá reclamar los salarios dejados de percibir ante la jurisdicción contencioso administrativa.", "No necesita acudir a un juez: el reconocimiento y pago es consecuencia directa del fallo absolutorio según el artículo 218 de la Ley 1952 de 2019.", false], ["C", "será reintegrado, pero sin pago de salarios, porque la medida provisional no era una sanción.", "El artículo 218 de la Ley 1952 de 2019 ordena expresamente pagar la remuneración dejada de percibir durante la suspensión.", false]]}]}, {"comp": "contratacion", "rol": "general", "tag": "Contratación estatal · Inhabilidades e incompatibilidades", "texto": "Usted es profesional universitario de la oficina de contratación de una alcaldía. Llegan tres situaciones: (i) el hermano de la esposa del secretario de Hacienda municipal ofrece sus servicios como contador; (ii) quien fue jefe de la oficina asesora jurídica de la alcaldía, empleo del nivel asesor, y se retiró hace siete meses, quiere presentar oferta en un proceso de la misma alcaldía; y (iii) un contratista persona natural que ejecuta un contrato de mantenimiento con la alcaldía fue sancionado con destitución por haber abandonado injustificadamente un empleo público anterior, y la decisión ya quedó en firme.", "items": [{"id": "CE-107", "niv": 2, "e": "Respecto del hermano de la esposa del secretario de Hacienda, lo procedente es indicar que", "f": "Ley 80 de 1993, art. 8, num. 2, lit. b)", "o": [["A", "puede contratar, porque la inhabilidad por afinidad llega únicamente hasta el primer grado.", "La norma cubre el parentesco hasta el segundo grado de afinidad (art. 8, num. 2, lit. b, Ley 80), grado en el que se encuentra el hermano del cónyuge.", false], ["B", "no puede contratar con la alcaldía, porque es pariente en segundo grado de afinidad de un servidor del nivel directivo.", "El literal b) del numeral 2 del artículo 8 de la Ley 80 impide contratar con la entidad respectiva a quienes tengan parentesco hasta el segundo grado de afinidad con sus servidores de los niveles directivo, asesor o ejecutivo. El cuñado está en segundo grado de afinidad y el secretario de Hacienda pertenece al nivel directivo.", true], ["C", "puede contratar si el secretario de Hacienda se declara impedido y se aparta de todas las etapas del proceso de selección y de la supervisión.", "Declararse impedido resuelve un conflicto de interés del servidor, pero no elimina la inhabilidad del pariente, que opera frente a la entidad por mandato del artículo 8 de la Ley 80.", false]]}, {"id": "CE-108", "niv": 3, "e": "En cuanto al exjefe de la oficina asesora jurídica, usted debe advertir que", "f": "Ley 80 de 1993, art. 8, num. 2, lit. a)", "o": [["A", "puede participar, siempre que no haya intervenido en la elaboración de los estudios previos de ese proceso.", "La incompatibilidad no depende de haber intervenido en el proceso: opera por haber sido servidor de esos niveles en la entidad durante el año siguiente al retiro (art. 8, num. 2, lit. a, Ley 80).", false], ["B", "puede participar, porque la incompatibilidad de los exservidores cobija únicamente los empleos del nivel directivo.", "La incompatibilidad del literal a) del numeral 2 del artículo 8 de la Ley 80 comprende los niveles directivo, asesor y ejecutivo; el empleo era del nivel asesor.", false], ["C", "no puede presentar oferta ni contratar con la alcaldía hasta que se cumpla un año contado desde su retiro.", "El literal a) del numeral 2 del artículo 8 de la Ley 80 impide contratar con la entidad a quienes fueron sus servidores en los niveles directivo, asesor o ejecutivo, por el término de un año contado desde la fecha del retiro. Solo han pasado siete meses.", true]]}, {"id": "CE-109", "niv": 1, "e": "Frente al contratista sancionado con destitución, lo que prevé la ley es que", "f": "Ley 80 de 1993, arts. 8, num. 1, lit. d) y 9 (modificado por la Ley 2014 de 2019, art. 6)", "o": [["A", "ceda el contrato con autorización previa y escrita de la alcaldía o, si ello no es posible, renuncie a su ejecución.", "La destitución genera inhabilidad (art. 8, num. 1, lit. d, Ley 80) y, como sobrevino durante la ejecución, aplica el artículo 9 de la Ley 80, modificado por la Ley 2014 de 2019: el contratista cede el contrato previa autorización escrita de la entidad o, si no es posible, renuncia a su ejecución.", true], ["B", "la alcaldía declare la caducidad del contrato y lo liquide en el estado en que se encuentre.", "La caducidad procede por incumplimiento grave del contratista que pueda paralizar el contrato (art. 18, Ley 80), no por una inhabilidad sobreviniente, que tiene su propia regla en el artículo 9.", false], ["C", "continúe ejecutándolo hasta el final, porque la inhabilidad no afecta los contratos celebrados antes de que se impusiera la sanción.", "El artículo 9 de la Ley 80 regula precisamente la inhabilidad que sobreviene durante la ejecución y ordena la cesión o la renuncia; el contratista no puede seguir ejecutándolo como si nada.", false]]}]}, {"comp": "contratacion", "rol": "general", "tag": "Contratación estatal · Planeación: análisis del sector y estudios previos", "texto": "La Secretaría de Educación de una gobernación prepara un proceso para contratar el transporte escolar rural y usted integra el equipo estructurador. El coordinador propone tres cosas: que el análisis del sector se limite a pedir cotizaciones a dos empresas; que en los estudios previos se omita el análisis de riesgos, porque «eso se resuelve durante la ejecución»; y que, para la capacidad financiera, se copien los indicadores del pliego de otra gobernación cuyo proceso tenía un presupuesto diez veces mayor.", "items": [{"id": "CE-128", "niv": 1, "e": "Sobre el alcance del análisis del sector, usted debe advertir que", "f": "Decreto 1082 de 2015, art. 2.2.1.1.1.6.1", "o": [["A", "basta con las dos cotizaciones, porque el análisis del sector sirve para estimar el valor del contrato.", "El análisis del sector no se reduce a estimar precios; el Decreto 1082 de 2015 (art. 2.2.1.1.1.6.1) exige estudiarlo desde varias perspectivas, incluido el riesgo.", false], ["B", "debe abarcar los aspectos jurídicos, comerciales, financieros, organizacionales, técnicos y de riesgo.", "El artículo 2.2.1.1.1.6.1 del Decreto 1082 de 2015 ordena a la entidad hacer, durante la planeación, el análisis necesario para conocer el sector desde las perspectivas legal, comercial, financiera, organizacional, técnica y de análisis de riesgo, y dejar constancia de ello en los documentos del proceso.", true], ["C", "se exige en la licitación pública, de modo que en una selección abreviada puede reducirse a un sondeo de precios.", "El deber de análisis se predica de la entidad en la planeación de sus procesos de contratación, sin limitarlo a la licitación (Decreto 1082 de 2015, art. 2.2.1.1.1.6.1).", false]]}, {"id": "CE-129", "niv": 2, "e": "Frente a la propuesta de omitir el análisis de riesgos en los estudios previos, lo correcto es responder que", "f": "Ley 1150 de 2007, art. 4; Decreto 1082 de 2015, art. 2.2.1.1.2.1.1, num. 6", "o": [["A", "es admisible, porque los riesgos se reparten durante la ejecución mediante las modificaciones que acuerden las partes.", "Los riesgos previsibles deben identificarse y asignarse desde la planeación, en los estudios previos y en los pliegos (art. 4, Ley 1150; Decreto 1082, art. 2.2.1.1.2.1.1, num. 6), no dejarse para la ejecución.", false], ["B", "es admisible si el contrato incluye una cláusula de multas suficientemente amplia para cubrir cualquier eventualidad que se presente.", "Las multas sirven para conminar al contratista a cumplir (art. 17, Ley 1150) y no reemplazan el análisis y la asignación de riesgos que exigen el artículo 4 de la Ley 1150 y el Decreto 1082 de 2015.", false], ["C", "los estudios previos deben incluir el análisis de riesgo y la forma de mitigarlo, y el pliego debe asignar los riesgos previsibles.", "El numeral 6 del artículo 2.2.1.1.2.1.1 del Decreto 1082 de 2015 incluye en los estudios previos el análisis de riesgo y la forma de mitigarlo, y el artículo 4 de la Ley 1150 exige que los pliegos incluyan la estimación, tipificación y asignación de los riesgos previsibles.", true]]}, {"id": "CE-130", "niv": 2, "e": "Sobre copiar los indicadores financieros del pliego de la otra gobernación, usted debe señalar que", "f": "Ley 1150 de 2007, art. 5, num. 1; Decreto 1082 de 2015, art. 2.2.1.1.1.6.2", "o": [["A", "los requisitos habilitantes deben ser proporcionales al contrato y fijarse con base en su riesgo, su valor y el análisis del sector.", "El numeral 1 del artículo 5 de la Ley 1150 exige que los requisitos habilitantes sean adecuados y proporcionales a la naturaleza y al valor del contrato, y el artículo 2.2.1.1.1.6.2 del Decreto 1082 de 2015 ordena fijarlos según el riesgo, el valor, el análisis del sector y el conocimiento de los posibles oferentes, sin aplicar fórmulas de manera mecánica.", true], ["B", "es una buena práctica, porque unos indicadores más exigentes garantizan que se seleccione un contratista con mayor solvencia financiera.", "Exigir indicadores desproporcionados frente al valor del contrato desconoce el numeral 1 del artículo 5 de la Ley 1150 y puede restringir injustificadamente la participación.", false], ["C", "es válido siempre que los indicadores se publiquen en el proyecto de pliego para recibir observaciones.", "La publicación no corrige la falta de proporcionalidad; los requisitos deben definirse con base en el análisis propio del proceso (Decreto 1082, art. 2.2.1.1.1.6.2).", false]]}]}, {"comp": "contratacion", "rol": "general", "tag": "Contratación estatal · Pliegos de condiciones, documentos tipo y adendas", "texto": "Usted es profesional de la oficina de contratación de una alcaldía que adelanta una licitación pública de obra para pavimentar vías urbanas. Durante la planeación, el secretario de Hacienda se opuso a publicar el proyecto de pliego porque aún no había expedido el certificado de disponibilidad presupuestal (CDP). Un asesor externo propone redactar un pliego propio, distinto del documento tipo de Colombia Compra Eficiente, para «ajustarlo a la realidad del municipio». Ya abierto el proceso, y faltando dos días hábiles para el cierre, varios interesados piden una adenda que amplíe el plazo para presentar ofertas.", "items": [{"id": "CE-131", "niv": 3, "e": "Frente a la objeción del secretario de Hacienda sobre el proyecto de pliego, es correcto señalar que", "f": "Ley 1150 de 2007, art. 8, par. (adicionado por la Ley 1882 de 2018, art. 6); Decreto 1082 de 2015, art. 2.2.1.1.2.1.5, num. 6", "o": [["A", "sin el CDP no puede publicarse el proyecto de pliego, porque los documentos del proceso deben tener respaldo presupuestal desde el inicio.", "La Ley 1882 de 2018 (art. 6) aclaró que no es obligatorio contar con disponibilidad presupuestal para publicar el proyecto de pliego.", false], ["B", "no se requiere disponibilidad presupuestal para publicar el proyecto de pliego, aunque el acto de apertura sí debe señalar el CDP.", "El parágrafo del artículo 8 de la Ley 1150, adicionado por el artículo 6 de la Ley 1882 de 2018, dispone que no es obligatorio contar con disponibilidad presupuestal para publicar el proyecto de pliego; en cambio, el acto administrativo de apertura debe señalar el certificado de disponibilidad presupuestal (Decreto 1082 de 2015, art. 2.2.1.1.2.1.5, num. 6).", true], ["C", "el CDP se exige al momento de pagar al contratista, y no durante las etapas de planeación y selección de la licitación.", "El acto de apertura debe indicar el CDP (Decreto 1082, art. 2.2.1.1.2.1.5, num. 6), y la ejecución del contrato requiere la existencia de las disponibilidades presupuestales (art. 41, Ley 80).", false]]}, {"id": "CE-132", "niv": 2, "e": "Sobre la propuesta de usar un pliego propio en lugar del documento tipo, usted debe advertir que", "f": "Ley 1150 de 2007, art. 2, par. 7 (modificado por la Ley 2022 de 2020, art. 1)", "o": [["A", "los documentos tipo son una guía orientadora que cada entidad puede adaptar libremente a sus necesidades.", "La ley les da carácter obligatorio (art. 2, par. 7, Ley 1150, modificado por la Ley 2022 de 2020); no son simples guías.", false], ["B", "los documentos tipo son obligatorios para las entidades del orden nacional, no para los municipios.", "La obligación cobija a todas las entidades sometidas al Estatuto General de Contratación, incluidas las territoriales (art. 2, par. 7, Ley 1150).", false], ["C", "los documentos tipo para obra pública son de uso obligatorio para las entidades sometidas al Estatuto General de Contratación.", "El parágrafo 7 del artículo 2 de la Ley 1150, modificado por el artículo 1 de la Ley 2022 de 2020, establece que los documentos tipo adoptados por Colombia Compra Eficiente son de obligatorio cumplimiento y, en todo caso, de uso obligatorio en los procesos de obra pública de todas las entidades sometidas al Estatuto General de Contratación.", true]]}, {"id": "CE-133", "niv": 3, "e": "Ante la solicitud de adenda presentada faltando dos días hábiles para el cierre, la alcaldía", "f": "Ley 80 de 1993, art. 30, num. 5, inc. 2 (modificado por la Ley 1474 de 2011, art. 89); Decreto 1082 de 2015, art. 2.2.1.1.2.2.1", "o": [["A", "puede expedirla, siempre que la ampliación no supere la mitad del plazo inicialmente fijado para presentar ofertas.", "El límite de la mitad del plazo se refiere a la prórroga hecha antes de su vencimiento; la ley prohíbe en todo caso expedir adendas en los tres días anteriores al cierre, ni para extender el término.", false], ["B", "no puede expedirla, porque en la licitación no se expiden adendas en los tres días anteriores al cierre, ni para ampliar el plazo.", "El inciso 2 del numeral 5 del artículo 30 de la Ley 80, modificado por el artículo 89 de la Ley 1474 de 2011, prohíbe expedir adendas dentro de los tres días anteriores al cierre, ni siquiera para extender el término. El Decreto 1082 de 2015 (art. 2.2.1.1.2.2.1) reitera esa regla para la licitación.", true], ["C", "puede expedirla hasta el día hábil anterior al cierre, siempre que la publique entre las 7:00 a. m. y las 7:00 p. m.", "Esa regla del Decreto 1082 de 2015 (art. 2.2.1.1.2.2.1) aplica a las demás modalidades; en la licitación pública la ley exige tres días de anticipación.", false]]}, {"id": "CE-134", "niv": 1, "e": "Una vez publicado el proyecto de pliego de esta licitación, los interesados pueden presentar observaciones durante", "f": "Decreto 1082 de 2015, art. 2.2.1.1.2.1.4", "o": [["A", "tres días hábiles.", "Tres días hábiles es, por ejemplo, el término para manifestar interés en la selección abreviada de menor cuantía (Decreto 1082, art. 2.2.1.2.1.2.20), no el de observaciones al proyecto de pliego.", false], ["B", "cinco días hábiles.", "Cinco días hábiles es el término de observaciones al proyecto de pliego en la selección abreviada y el concurso de méritos (Decreto 1082, art. 2.2.1.1.2.1.4, lit. b).", false], ["C", "diez días hábiles.", "El literal a) del artículo 2.2.1.1.2.1.4 del Decreto 1082 de 2015 fija un término de diez días hábiles para comentar el proyecto de pliego en la licitación pública.", true]]}]}, {"comp": "contratacion", "rol": "tecnico", "tag": "Contratación estatal · Niveles técnico, administrativo y operativo · SECOP II, publicidad y Plan Anual de Adquisiciones", "texto": "Usted es técnico administrativo del grupo de contratación de la Procuraduría General de la Nación y administra la cuenta de la entidad en el SECOP II. El ordenador del gasto le entrega el Plan Anual de Adquisiciones de la vigencia y le pregunta si, por estar un bien incluido en el Plan, la Procuraduría queda obligada a comprarlo. Ese mismo día le entregan para publicar varios documentos del proceso y actos administrativos expedidos ayer. Además, en la ventanilla de atención, un ciudadano pregunta si una empresa social del Estado de su municipio, que tiene un régimen contractual especial, está obligada a publicar sus contratos en el SECOP II.", "items": [{"id": "CE-171", "niv": 1, "e": "Los documentos y actos administrativos del proceso que le entregaron deben publicarse en el SECOP", "f": "Decreto 1082 de 2015, art. 2.2.1.1.1.7.1", "o": [["A", "el mismo día de su expedición, so pena de nulidad del proceso.", "El reglamento no exige publicar el mismo día ni sanciona con nulidad; fija un término de tres días siguientes a la expedición (Decreto 1082, art. 2.2.1.1.1.7.1).", false], ["B", "dentro de los tres días siguientes a su expedición.", "El artículo 2.2.1.1.1.7.1 del Decreto 1082 de 2015 obliga a publicar en el SECOP los documentos del proceso y los actos administrativos del proceso de contratación dentro de los tres días siguientes a su expedición.", true], ["C", "dentro de los diez días hábiles siguientes a la firma del contrato.", "El término se cuenta desde la expedición de cada documento o acto, y es de tres días (Decreto 1082, art. 2.2.1.1.1.7.1).", false]]}, {"id": "CE-172", "niv": 3, "e": "A la pregunta del ciudadano sobre la empresa social del Estado con régimen especial, la respuesta correcta es que", "f": "Ley 1150 de 2007, art. 13 (incisos adicionados por la Ley 2195 de 2022, art. 53)", "o": [["A", "sí debe publicar en el SECOP II los documentos de su actividad contractual, aunque tenga régimen especial.", "El artículo 13 de la Ley 1150, con los incisos adicionados por el artículo 53 de la Ley 2195 de 2022, obliga a las entidades con régimen contractual excepcional a publicar en el SECOP II (o la plataforma que haga sus veces) los documentos de su actividad contractual, en las etapas precontractual, contractual y poscontractual.", true], ["B", "debe publicar los contratos cuyo valor supere su menor cuantía, y los demás puede reservarlos.", "La norma no distingue por cuantía: se publica la actividad contractual, entendida como los documentos, contratos, actos e información de todas las etapas (art. 13, Ley 1150, adicionado por la Ley 2195 de 2022).", false], ["C", "no está obligada, porque la publicación en el SECOP II cobija a las entidades sometidas a la Ley 80 de 1993.", "Desde la Ley 2195 de 2022 la obligación de publicar en el SECOP II se extiende a las entidades con régimen contractual excepcional (art. 13, Ley 1150).", false]]}, {"id": "CE-173", "niv": 1, "e": "A la pregunta del ordenador del gasto sobre el Plan Anual de Adquisiciones, usted debe responder que el Plan", "f": "Decreto 1082 de 2015, arts. 2.2.1.1.1.4.2 a 2.2.1.1.1.4.4", "o": [["A", "no puede actualizarse durante la vigencia una vez se publica en el SECOP II y en la página web de la entidad.", "El reglamento ordena actualizar el Plan por lo menos una vez durante la vigencia y cuando haya ajustes, inclusiones o exclusiones (Decreto 1082, art. 2.2.1.1.1.4.4).", false], ["B", "obliga a contratar todos los bienes incluidos, salvo que se modifique mediante acto administrativo motivado.", "El Plan es un instrumento de planeación y no genera la obligación de adquirir lo que contiene (Decreto 1082, art. 2.2.1.1.1.4.2).", false], ["C", "no obliga a la Procuraduría a adelantar los procesos de adquisición que en él se enumeran.", "El artículo 2.2.1.1.1.4.2 del Decreto 1082 de 2015 dispone que el Plan Anual de Adquisiciones no obliga a las entidades a efectuar los procesos de adquisición que en él se enumeran.", true]]}]}, {"comp": "contratacion", "rol": "general", "tag": "Contratación estatal · La procuraduría preventiva frente a una licitación", "texto": "Usted es profesional de una procuraduría provincial que, en ejercicio de la función preventiva, hace seguimiento a una licitación pública de obra para construir un centro de salud que adelanta un municipio. Un veedor ciudadano le pide que la procuraduría apruebe el informe de evaluación antes de la adjudicación. Un proponente se queja de que aún no conoce las ofertas económicas de los demás, aunque ya se publicó el informe de evaluación de los requisitos habilitantes y de los factores técnicos. El alcalde, por su parte, pregunta cómo debe hacerse la adjudicación.", "items": [{"id": "CE-174", "niv": 2, "e": "Frente a la solicitud del veedor, usted debe explicar que", "f": "Ley 80 de 1993, art. 25, num. 11; Decreto 1082 de 2015, art. 2.2.1.1.2.2.3", "o": [["A", "no le corresponde aprobarlo, porque la función preventiva no implica coadministrar ni decidir por la entidad.", "La función preventiva permite a la Procuraduría hacer seguimiento al proceso, pero no aprobar sus actos ni sustituir a la entidad: el numeral 11 del artículo 25 de la Ley 80 dispone que los organismos de control y vigilancia no intervienen en los procesos de contratación, y la evaluación de las ofertas corresponde a la entidad y a su comité evaluador (Decreto 1082 de 2015, art. 2.2.1.1.2.2.3).", true], ["B", "la procuraduría puede ordenar al municipio modificar el informe de evaluación si encuentra errores de calificación.", "La evaluación es competencia de la entidad y su comité evaluador (Decreto 1082, art. 2.2.1.1.2.2.3); los organismos de control no intervienen en el proceso (art. 25, num. 11, Ley 80).", false], ["C", "la procuraduría debe aprobar el informe de evaluación para que el municipio pueda adjudicar el contrato.", "Ninguna norma somete el informe de evaluación a aprobación de la Procuraduría; además, la ley excluye la intervención de los organismos de control en los procesos de contratación (art. 25, num. 11, Ley 80).", false]]}, {"id": "CE-175", "niv": 3, "e": "Sobre la queja del proponente acerca de las ofertas económicas, lo correcto es que", "f": "Ley 80 de 1993, art. 30, pars. 2 y 3 (adicionados por la Ley 1882 de 2018, art. 1)", "o": [["A", "el municipio debió abrir los sobres económicos al cierre, junto con los documentos habilitantes y técnicos.", "En la licitación de obra el sobre económico no se abre al cierre: permanece cerrado hasta la audiencia de adjudicación (art. 30, par. 3, Ley 80).", false], ["B", "las ofertas económicas debían publicarse con el informe de requisitos habilitantes para recibir observaciones.", "El informe del primer sobre se refiere a los requisitos habilitantes y a los factores distintos de la oferta económica; esta se conoce en la audiencia de adjudicación (art. 30, pars. 2 y 3, Ley 80).", false], ["C", "en la licitación de obra el sobre con la oferta económica permanece cerrado hasta la audiencia de adjudicación.", "Los parágrafos 2 y 3 del artículo 30 de la Ley 80, adicionados por el artículo 1 de la Ley 1882 de 2018, disponen que en la licitación de obra la oferta se presenta en dos sobres y que el segundo, con la oferta económica, se mantiene cerrado hasta la audiencia de adjudicación, en la que se abre y evalúa.", true]]}, {"id": "CE-176", "niv": 1, "e": "A la pregunta del alcalde, la adjudicación de esta licitación debe hacerse", "f": "Ley 1150 de 2007, art. 9; Decreto 1082 de 2015, art. 2.2.1.2.1.1.2", "o": [["A", "en audiencia pública, mediante resolución motivada que se entiende notificada al adjudicatario en ella.", "El artículo 9 de la Ley 1150 dispone que en los procesos de licitación pública la adjudicación se hace de forma obligatoria en audiencia pública, mediante resolución motivada que se entiende notificada al proponente favorecido en dicha audiencia.", true], ["B", "por resolución motivada que se notifica personalmente al adjudicatario dentro de los cinco días siguientes.", "En la licitación la adjudicación es obligatoriamente en audiencia pública y la resolución se entiende notificada en ella (art. 9, Ley 1150).", false], ["C", "en audiencia pública, cuando la soliciten un organismo de control o la mayoría de los proponentes.", "La audiencia de adjudicación en la licitación es obligatoria, no depende de una solicitud (art. 9, Ley 1
