150; Decreto 1082, art. 2.2.1.2.1.1.2).", false]]}]}, {"comp": "anticorrupcion", "rol": "general", "tag": "Estatuto Anticorrupción y transparencia · Publicación de declaraciones (Ley 2013 de 2019)", "texto": "Martín fue elegido alcalde de un municipio y se posesionará en enero. Su asesor le recuerda las obligaciones de publicidad de la Ley 2013 de 2019. Durante el primer año de gobierno ocurren dos hechos: en mayo, el hermano de Martín se vuelve socio de una empresa que presta servicios de aseo en el municipio, lo que modifica la información de su registro de conflictos de interés; y en agosto Martín presenta ante la DIAN su declaración del impuesto sobre la renta. Al mismo tiempo, Sofía, recién nombrada auxiliar administrativa de la alcaldía, pregunta si a ella también le corresponde declarar sus bienes y rentas.", "items": [{"id": "AC-122", "niv": 1, "e": "Respecto de sus declaraciones, antes de posesionarse, Martín", "f": "Ley 2013 de 2019, art. 2, par. 1", "o": [["A", "puede publicarlas en cualquier momento del primer año de gobierno, porque la ley no las exige como requisito para el cargo.", "La ley las exige como requisito para posesionarse, ejercer y retirarse del cargo, no como un trámite que pueda cumplirse en cualquier momento del período.", false], ["B", "debe publicar y registrar sus declaraciones de bienes y rentas, de conflictos de interés y de renta, como requisito para posesionarse.", "El artículo 2 de la Ley 2013 de 2019 incluye entre los sujetos obligados a los servidores elegidos por voto popular, y su parágrafo 1 establece que la publicación y el registro son requisito para posesionarse, ejercer y retirarse del cargo.", true], ["C", "no está obligado, porque la Ley 2013 de 2019 se aplica a los servidores nombrados y no a los elegidos por voto popular.", "Los servidores elegidos por voto popular están entre los primeros sujetos obligados que enumera el artículo 2 de la Ley 2013 de 2019.", false]]}, {"id": "AC-123", "niv": 2, "e": "El cambio en el registro de conflictos de interés que se produjo en mayo debe comunicarse y registrarse", "f": "Ley 2013 de 2019, art. 3", "o": [["A", "en la actualización anual siguiente, porque las declaraciones solo se modifican una vez al año.", "Además de la actualización anual, la ley exige que los cambios en la información declarada se comuniquen y registren dentro de un plazo corto desde que ocurren.", false], ["B", "solo al retirarse del cargo, en la declaración final del período.", "Esperar al retiro dejaría el registro desactualizado durante todo el período, en contra del propósito de la ley; el cambio debe registrarse dentro de los dos meses siguientes.", false], ["C", "dentro de los dos meses siguientes a la fecha en que se produjo el cambio.", "El artículo 3 de la Ley 2013 de 2019 dispone que cualquier cambio que modifique la información contenida en la declaración debe comunicarse y registrarse dentro de los dos meses siguientes al cambio.", true]]}, {"id": "AC-124", "niv": 2, "e": "La copia de la declaración del impuesto sobre la renta que Martín presentó en agosto debe publicarse", "f": "Ley 2013 de 2019, art. 3", "o": [["A", "al finalizar el período de gobierno, con la declaración de retiro.", "La ley fija un plazo corto contado desde la presentación ante la DIAN; no permite aplazar la publicación hasta el final del período.", false], ["B", "dentro del mes siguiente a su presentación ante la DIAN, sin esperar la actualización anual.", "El artículo 3 de la Ley 2013 de 2019 establece que la copia de la declaración del impuesto sobre la renta y complementarios se publica dentro del mes siguiente a su presentación ante la DIAN.", true], ["C", "solo si la DIAN abre un proceso de fiscalización sobre esa declaración, como parte de la investigación.", "La publicación es una obligación general de los sujetos obligados y no depende de que exista un proceso de fiscalización.", false]]}, {"id": "AC-125", "niv": 3, "e": "Respecto de la pregunta de Sofía, es correcto indicarle que", "f": "Ley 190 de 1995; Decreto 1083 de 2015; Función Pública, Concepto 561261 de 2025", "o": [["A", "debe presentar su declaración de bienes y rentas en el SIGEP, como todo servidor, al posesionarse, cada año y al retirarse.", "Las obligaciones de publicación de la Ley 2013 de 2019 recaen sobre los sujetos que enumera su artículo 2, entre los que no figura un cargo asistencial como el de Sofía; pero, según la Ley 190 de 1995 y el Decreto 1083 de 2015, como lo reitera el Concepto 561261 de 2025 de Función Pública, todo servidor público debe presentar la declaración de bienes y rentas en el SIGEP al posesionarse, actualizarla anualmente y presentarla al retirarse.", true], ["B", "no tiene ninguna obligación, porque las declaraciones de bienes solo se exigen a cargos directivos y de elección popular.", "La declaración de bienes y rentas es una obligación de todo servidor público, prevista en la Ley 190 de 1995; las obligaciones especiales de publicación de la Ley 2013 no eliminan esa regla general.", false], ["C", "solo debe declarar si es ordenadora del gasto o maneja recursos públicos.", "La obligación de declarar bienes y rentas no depende de ordenar el gasto o manejar recursos: se aplica a todo servidor público.", false]]}]}, {"comp": "anticorrupcion", "rol": "general", "tag": "Estatuto Anticorrupción y transparencia · Principios del derecho de acceso a la información pública", "texto": "Una procuraduría provincial, en ejercicio de su función preventiva, revisa la manera en que una alcaldía atiende el derecho de acceso a la información pública. Encuentra que la entidad solo publica información cuando un ciudadano la solicita por escrito, que cobra un \"derecho de consulta\" a quien pide revisar expedientes en las instalaciones y que, cuando un documento contiene datos reservados en algunas de sus páginas, niega el documento completo. El secretario general considera que esas prácticas protegen a la entidad.", "items": [{"id": "AC-141", "niv": 2, "e": "La práctica de publicar información solo cuando se solicita por escrito desconoce el principio de", "f": "Ley 1712 de 2014, art. 3", "o": [["A", "eficacia, porque obliga a tramitar más solicitudes escritas de las necesarias.", "Aunque la práctica puede afectar la gestión, el principio de la Ley 1712 que exige publicar sin esperar solicitud es el de divulgación proactiva.", false], ["B", "divulgación proactiva de la información.", "El artículo 3 de la Ley 1712 de 2014 consagra el principio de divulgación proactiva, que obliga a publicar y divulgar documentos y archivos de interés público de forma rutinaria y proactiva, sin esperar una solicitud, y a promover una cultura de transparencia.", true], ["C", "facilitación, porque el ciudadano debe radicar su solicitud en la ventanilla de la alcaldía.", "La facilitación se refiere a no exigir trámites que obstruyan el acceso; lo que se reprocha aquí es esperar a que haya una solicitud en lugar de publicar de manera rutinaria.", false]]}, {"id": "AC-142", "niv": 3, "e": "Cuando solo algunas páginas de un documento contienen información reservada, la alcaldía debe", "f": "Ley 1712 de 2014, art. 21", "o": [["A", "negar el documento completo, porque basta con que una parte sea reservada para que todo el documento lo sea.", "La ley no permite extender la reserva a todo el documento cuando solo una parte está cobijada; ordena la divulgación parcial.", false], ["B", "entregarlo completo, porque la reserva no puede oponerse a los ciudadanos que lo solicitan por escrito.", "Las excepciones legales de reserva sí pueden oponerse a los solicitantes; lo que exige la ley es proteger solo la parte reservada y entregar el resto.", false], ["C", "entregar una versión pública que mantenga la reserva únicamente sobre la parte cobijada por la excepción.", "El artículo 21 de la Ley 1712 de 2014, sobre divulgación parcial, dispone que si los datos reservados o clasificados pueden separarse del resto, debe hacerse una versión pública que mantenga la reserva solo de la parte indispensable.", true]]}, {"id": "AC-143", "niv": 1, "e": "El cobro de un \"derecho de consulta\" para revisar expedientes", "f": "Ley 1712 de 2014, art. 3", "o": [["A", "desconoce el principio de gratuidad, porque solo puede cobrarse el costo de reproducción de la información.", "El artículo 3 de la Ley 1712 de 2014 establece el principio de gratuidad: el acceso a la información pública es gratuito, y no se pueden cobrar valores adicionales al costo de reproducción.", true], ["B", "es válido si lo aprueba el concejo municipal mediante acuerdo, para cubrir los gastos de administración.", "La ley consagra el principio de gratuidad: el acceso no tiene costo y solo puede cobrarse la reproducción; un acuerdo municipal no puede establecer cobros contrarios a la ley.", false], ["C", "es válido siempre que la tarifa sea igual para todos los ciudadanos.", "Que la tarifa sea igual para todos no la hace válida: la ley prohíbe cobrar por el acceso, más allá del costo de reproducción.", false]]}]}, {"comp": "comportamental", "rol": "tecnico", "tag": "Competencias comportamentales (Diccionario de la Procuraduría) · Niveles técnico, administrativo y operativo · Responsabilidad con la organización", "texto": "Usted es técnico del archivo de gestión de una procuraduría regional y su empleo exige Responsabilidad con la organización en nivel C. La regional debe hacer este mes la transferencia documental al archivo central. Durante el alistamiento se detecta que faltan siete carpetas registradas en el inventario, y la jefe le asigna a usted resolver ese faltante. En el archivo trabaja también un auxiliar administrativo, cuyo empleo exige el nivel D de la misma competencia, encargado de foliar y rotular las carpetas.", "items": [{"id": "CO-122", "niv": 1, "e": "Frente al faltante de carpetas que le asignaron, lo que corresponde al nivel C de Responsabilidad con la organización es", "f": "Diccionario de Competencias Comportamentales PGN, Responsabilidad con la organización, nivel C", "o": [["A", "recopilar la información de préstamos y entregarla a la jefe para que sea ella quien decida cómo resolver el faltante.", "Aportar elementos para que otros tomen la decisión es la conducta del nivel D de Toma de decisiones. El problema le fue asignado a usted, y el nivel C de Responsabilidad con la organización pide buscarle solución.", false], ["B", "buscar la solución al faltante, rastreando préstamos y ubicaciones, hasta resolverlo.", "El nivel C de Responsabilidad con la organización incluye buscar solución a los problemas o situaciones que le asignen en cumplimiento de sus funciones.", true], ["C", "continuar con la transferencia programada y reportar el faltante en el formato de novedades del archivo.", "Cumplir las tareas asignadas y los parámetros de calidad describe el nivel D. El problema fue asignado a usted y el nivel C pide buscarle solución.", false]]}, {"id": "CO-123", "niv": 2, "e": "Al organizar su semana de trabajo, la conducta que refleja el nivel C de Responsabilidad con la organización es", "f": "Diccionario de Competencias Comportamentales PGN, Responsabilidad con la organización, nivel C", "o": [["A", "ordenar sus tareas en función de completar la transferencia, que es el resultado esperado este mes.", "Una de las conductas del nivel C de Responsabilidad con la organización es dirigir su trabajo a la obtención de resultados.", true], ["B", "esperar a que la jefe le indique cada mañana qué tarea debe priorizar.", "Depender de la indicación diaria del jefe se asemeja a seguir instrucciones (Cumplimiento de parámetros de trabajo), no a dirigir el propio trabajo a la obtención de resultados.", false], ["C", "dedicar el mismo tiempo a cada una de sus tareas del día, para no descuidar ninguna.", "Repartir el tiempo por igual no orienta el trabajo hacia el resultado esperado, que es lo que describe el nivel C.", false]]}, {"id": "CO-124", "niv": 1, "e": "Para el auxiliar administrativo del archivo, cuyo empleo exige el problemas del centro que solo pueden resolverse en grupo.", "Compartir, discutir y construir soluciones que solo se dan en grupo es el nivel C de Trabajo en equipo. Orientación a resultados, nivel C, vincula el trabajo en equipo con el cumplimiento de las metas del grupo.", false], ["B", "responder a tiempo las solicitudes que le corresponden y responder por sus propios resultados.", "Cumplir con oportunidad sus funciones y asumir la responsabilidad por sus resultados es la conducta del nivel D, inferior al exigido.", false], ["C", "promover que el grupo coordine el reparto de las solicitudes pendientes para cumplir la meta común.", "Proponer al grupo una distribución de la carga para lograr la meta común es promover el trabajo en equipo como articulación de objetivos y metas, conducta del nivel C de Orientación a resultados.", true]]}, {"id": "CO-174", "niv": 1, "e": "En la última semana del mes, lo coherente con el nivel C de Orientación a resultados es", "f": "Diccionario de Competencias Comportamentales PGN, Orientación a resultados, nivel C", "o": [["A", "hacer un esfuerzo adicional esa semana para cumplir la meta asignada.", "Una de las conductas del nivel C de Orientación a resultados es hacer esfuerzos adicionales para cumplir las metas asignadas.", true], ["B", "informar que la meta no se alcanzará y pedir que se ajuste para el mes siguiente.", "Renuncia a la meta antes del cierre. El nivel C incluye hacer esfuerzos adicionales para cumplir las metas asignadas.", false], ["C", "concentrarse en las solicitudes sencillas para subir la cifra, aunque las complejas sigan esperando.", "Prioriza la cifra sobre los términos de todas las solicitudes; no refleja el esfuerzo por cumplir la meta tal como fue fijada.", false]]}, {"id": "CO-175", "niv": 1, "e": "Frente a su error en la respuesta enviada, lo que corresponde al auxiliar según el nivel D de Orientación a resultados es", "f": "Diccionario de Competencias Comportamentales PGN, Orientación a resultados, nivel D", "o": [["A", "esperar a que el coordinador lo detecte y le indique cómo corregirlo.", "Deja en otros la responsabilidad por el resultado de su propia actividad.", false], ["B", "asumir la responsabilidad por ese resultado y corregirlo.", "El nivel D de Orientación a resultados incluye asumir la responsabilidad por los resultados de sus actividades.", true], ["C", "explicar que el error se debió a la presión por cumplir la meta del grupo.", "Atribuye el resultado a factores externos en lugar de asumirlo, contrario a la conducta del nivel D.", false]]}]}];
const CFG = {"titulo": "Simulacro 4 · Técnico, administrativo y operativo · Procuraduría 2027", "modo": "simulacro", "minutos": 200, "componentes": {"estructura_pgn": "Estructura y funciones de la Procuraduría", "gestion_publica": "Gestión pública y funcionamiento del Estado", "atencion_usuario": "Atención al usuario", "gestion_documental": "Gestión documental", "documentos_oficina": "Elaboración de documentos de oficina", "ofimatica": "Herramientas ofimáticas", "sistemas_gestion": "Sistemas de gestión (MIPG, control interno y calidad)", "disciplinario": "Código General Disciplinario", "contratacion": "Contratación estatal", "anticorrupcion": "Estatuto Anticorrupción y transparencia", "comportamental": "Competencias comportamentales (Diccionario de la Procuraduría)"}, "niveles": {"1": "Básico", "2": "Intermedio", "3": "Avanzado"}, "roles": {"general": "Todos los niveles", "tecnico": "Niveles técnico, administrativo y operativo", "profesional": "Niveles profesional, asesor y ejecutivo"}, "clave": "tecnico-04.html"};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY = 'sim-pgn:' + CFG.clave;
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}
function save(){try{localStorage.setItem(KEY, JSON.stringify(ST))}catch(e){}}
let ST = load();
ST.r = ST.r || {};
$('#tit').textContent = CFG.titulo;
const ITEMS = [];
DATA.forEach(c => c.items.forEach(it => { it.caso = c; ITEMS.push(it); }));

function justHTML(it){
  return '<div class="just">' + it.o.map(o => `<div><b>${o[0]}.</b> <span class="${o[3]?'okt':'not'}">${o[3]?'Es correcta.':'Es incorrecta.'}</span> ${esc(o[2])}</div>`).join('') +
    `<div class="src">Referencia: ${esc(it.f)}</div></div>`;
}
function itemHTML(it, n, mode){
  const r = ST.r[it.id];
  const reveal = mode === 'review' || (CFG.modo === 'practica' && r);
  let h = `<div class="item" id="i-${it.id}"><p class="enun"><span class="n">${n}.</span> <span class="niv">${CFG.niveles[it.niv]}</span> ${esc(it.e)}</p>`;
  it.o.forEach(o => {
    let cls = '';
    if (reveal) { if (o[3]) cls = 'ok'; else if (r === o[0]) cls = 'no'; }
    else if (r === o[0]) cls = 'sel';
    h += `<button class="op ${cls}" data-id="${it.id}" data-l="${o[0]}" ${reveal?'disabled':''}><span class="l">${o[0]}.</span><span>${esc(o[1])}</span></button>`;
  });
  if (reveal) {
    if (mode === 'review') h += `<div class="${r===keyOf(it)?'res-ok':'res-no'}" style="font-size:14px;margin-top:4px">${r ? (r===keyOf(it)?'Respondiste ' + r + ': correcto.':'Respondiste ' + r + '. La respuesta correcta es ' + keyOf(it) + '.') : 'Sin responder. La respuesta correcta es ' + keyOf(it) + '.'}</div>`;
    h += justHTML(it);
  }
  return h + '</div>';
}
const keyOf = it => it.o.find(o => o[3])[0];

function renderList(list, mode){
  let h = '', last = null, n = 0;
  list.forEach(it => {
    n++;
    if (it.caso !== last) { last = it.caso; h += `<div class="caso"><div class="tag">${esc(it.caso.tag)}</div><p>${esc(it.caso.texto)}</p></div>`; }
    h += itemHTML(it, n, mode);
  });
  return h;
}

// ---------- PRÁCTICA ----------
let LIST = [];
let FILTRO = ST.f || {comp:'', niv:'', rol:''};
function practica(){
  const comps = Object.entries(CFG.componentes).map(([k,v]) => `<option value="${k}" ${FILTRO.comp===k?'selected':''}>${esc(v)}</option>`).join('');
  const nivs = Object.entries(CFG.niveles).map(([k,v]) => `<option value="${k}" ${FILTRO.niv===k?'selected':''}>${esc(v)}</option>`).join('');
  const list = ITEMS.filter(it => (!FILTRO.comp || it.caso.comp===FILTRO.comp) && (!FILTRO.niv || String(it.niv)===FILTRO.niv) && (!FILTRO.rol || it.caso.rol===FILTRO.rol || it.caso.rol==='general'));
  const resp = list.filter(it => ST.r[it.id]); const ok = resp.filter(it => ST.r[it.id]===keyOf(it));
  $('#main').innerHTML = `<div class="panel"><p style="margin-top:0">Elige un tema, tu nivel de empleo y la dificultad. Al responder verás de inmediato si acertaste y la explicación de cada opción.</p>
  <div class="row"><select id="fc"><option value="">Todos los temas</option>${comps}</select>
  <select id="fn"><option value="">Todas las dificultades</option>${nivs}</select>
  <select id="fr"><option value="">Todos los niveles de empleo</option>${['tecnico','profesional'].map(k => `<option value="${k}" ${FILTRO.rol===k?'selected':''}>${esc(CFG.roles[k])} (y temas comunes)</option>`).join('')}</select>
  <button class="btn sec" id="borrar">Borrar mis respuestas</button></div>
  <p class="stat" id="pst" style="margin-bottom:0">${list.length} preguntas · respondidas ${resp.length} · aciertos ${ok.length}${resp.length? ' (' + Math.round(100*ok.length/resp.length) + ' %)':''}</p></div>` + renderList(list, 'practica');
  $('#prog').textContent = `${ok.length}/${resp.length} aciertos`;
  ['fc','fn','fr'].forEach((id,i) => $('#'+id).onchange = e => { FILTRO[['comp','niv','rol'][i]] = e.target.value; ST.f = FILTRO; save(); practica(); });
  LIST = list;
  $('#borrar').onclick = () => { list.forEach(it => delete ST.r[it.id]); save(); practica(); };
}

// ---------- SIMULACRO ----------
let tick = null;
function inicio(){
  const n = ITEMS.length, cnt = {};
  ITEMS.forEach(it => cnt[it.caso.comp] = (cnt[it.caso.comp]||0) + 1);
  const h = Math.floor(CFG.minutos/60), m = CFG.minutos%60;
  $('#main').innerHTML = `<div class="panel"><h2 style="margin-top:0;color:var(--pri)">Instrucciones</h2>
  <p>Este simulacro tiene <b>${n} preguntas</b> en formato de caso: una situación, enunciados que se completan y tres opciones con una sola respuesta correcta.</p>
  <table>${Object.entries(cnt).map(([k,v]) => `<tr><td>${esc(CFG.componentes[k])}</td><td class="r">${v}</td></tr>`).join('')}</table>
  <p>Tiempo sugerido: <b>${h ? h + ' h ' : ''}${m ? m + ' min' : ''}</b> (unos ${Math.round(CFG.minutos*60/n/6)/10} minutos por pregunta). Cuando se acaba el tiempo puedes seguir, pero el cronómetro lo indica.</p>
  <p>Tus respuestas se guardan en este navegador. Al terminar verás tu puntaje por componente y por dificultad, y la explicación de cada pregunta.</p>
  <button class="btn" id="go">${ST.t0 ? 'Continuar el simulacro' : 'Comenzar'}</button></div>`;
  $('#prog').textContent = `${n} preguntas`;
  $('#go').onclick = () => { if (!ST.t0) { ST.t0 = Date.now(); save(); } examen(); };
}
function reloj(){
  const rest = CFG.minutos*60 - Math.floor((Date.now() - ST.t0)/1000);
  const a = Math.abs(rest), hh = Math.floor(a/3600), mm = Math.floor(a%3600/60), ss = a%60;
  const t = (rest < 0 ? '+' : '') + (hh ? hh + ':' : '') + String(mm).padStart(2,'0') + ':' + String(ss).padStart(2,'0');
  $('#timer').textContent = rest < 0 ? 'Tiempo cumplido ' + t : '⏱ ' + t;
  $('#timer').classList.toggle('low', rest < 600);
}
function examen(){
  $('#main').innerHTML = renderList(ITEMS, 'examen') + `<div class="panel"><button class="btn" id="fin">Terminar y calificar</button></div>`;
  progreso(); reloj(); clearInterval(tick); tick = setInterval(reloj, 1000);
  $('#fin').onclick = () => {
    const faltan = ITEMS.length - Object.keys(ST.r).filter(k => ITEMS.some(i => i.id===k)).length;
    $('#mtxt').textContent = faltan ? `Te faltan ${faltan} preguntas por responder. ¿Quieres calificar de todos modos?` : '¿Quieres terminar y ver tu calificación?';
    $('#modal').classList.remove('hide');
  };
}
function progreso(){
  const r = ITEMS.filter(it => ST.r[it.id]).length;
  $('#prog').textContent = `Respondidas ${r}/${ITEMS.length}`;
}
$('#mno').onclick = () => $('#modal').classList.add('hide');
$('#msi').onclick = () => { $('#modal').classList.add('hide'); ST.fin = Date.now(); save(); resultados(); };
function resultados(){
  clearInterval(tick);
  const ok = ITEMS.filter(it => ST.r[it.id] === keyOf(it)).length;
  const pct = Math.round(1000*ok/ITEMS.length)/10;
  const g = (fn, lab) => { const m = {}; ITEMS.forEach(it => { const k = fn(it); m[k] = m[k] || [0,0]; m[k][1]++; if (ST.r[it.id]===keyOf(it)) m[k][0]++; });
    return Object.entries(m).map(([k,v]) => `<tr><td>${esc(lab(k))}</td><td class="r">${v[0]}/${v[1]}</td><td class="r">${Math.round(100*v[0]/v[1])} %</td></tr>`).join(''); };
  const mins = Math.round(((ST.fin||Date.now()) - ST.t0)/60000);
  $('#timer').textContent = `Tiempo usado: ${Math.floor(mins/60) ? Math.floor(mins/60) + ' h ' : ''}${mins%60} min`;
  $('#prog').textContent = `${ok}/${ITEMS.length} aciertos`;
  $('#main').innerHTML = `<div class="panel"><div class="big">${String(pct).replace('.',',')} %</div>
  <p style="margin-top:4px">${ok} de ${ITEMS.length} respuestas correctas. ${pct >= 75 ? 'Muy buen resultado: repasa las explicaciones de tus errores para afianzarlo.' : pct >= 65 ? 'Vas bien, pero con poco margen: refuerza los componentes con menor porcentaje.' : 'Todavía no estás en zona segura: practica por tema los componentes con menor porcentaje.'}</p>
  <p class="aviso">Referencia: en el concurso de la Procuraduría la prueba de conocimientos es eliminatoria con mínimo de 65 puntos sobre 100, y la comportamental es clasificatoria. Este porcentaje de aciertos es una guía de preparación; la calificación oficial usa una escala estándar que compara a los aspirantes.</p>
  <h3>Por componente</h3><table>${g(it => it.caso.comp, k => CFG.componentes[k])}</table>
  <h3>Por dificultad</h3><table>${g(it => it.niv, k => CFG.niveles[k])}</table>
  <div class="row" style="margin-top:14px"><button class="btn" id="solo">Ver solo mis errores</button><button class="btn sec" id="todas">Ver todas</button><button class="btn sec" id="otra">Reiniciar el simulacro</button></div></div><div id="rev"></div>`;
  const rev = errs => { const l = errs ? ITEMS.filter(it => ST.r[it.id] !== keyOf(it)) : ITEMS; $('#rev').innerHTML = renderList(l, 'review'); };
  rev(true);
  $('#solo').onclick = () => rev(true); $('#todas').onclick = () => rev(false);
  $('#otra').onclick = () => { ST = {r:{}}; save(); inicio(); window.scrollTo(0,0); };
}

document.addEventListener('click', e => {
  const b = e.target.closest('button.op'); if (!b || b.disabled) return;
  ST.r[b.dataset.id] = b.dataset.l; save();
  const it = ITEMS.find(i => i.id === b.dataset.id);
  const n = b.closest('.item').querySelector('.n').textContent.replace('.','');
  b.closest('.item').outerHTML = itemHTML(it, n, CFG.modo === 'practica' ? 'practica' : 'examen');
  if (CFG.modo === 'practica') { const resp = LIST.filter(i => ST.r[i.id]); const ok = resp.filter(i => ST.r[i.id]===keyOf(i)).length; $('#prog').textContent = `${ok}/${resp.length} aciertos`; $('#pst').textContent = `${LIST.length} preguntas · respondidas ${resp.length} · aciertos ${ok} (${Math.round(100*ok/resp.length)} %)`; }
  else progreso();
});

if (CFG.modo === 'practica') practica();
else if (ST.fin) resultados();
else if (ST.t0) examen();
else inicio();
</script>
