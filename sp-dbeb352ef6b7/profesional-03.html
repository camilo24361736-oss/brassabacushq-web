lara desierta, que debe iniciarse dentro de los cuatro meses siguientes.", true], ["B", "debe adjudicar al proponente con mayor puntaje, aunque no cumpla los requisitos habilitantes exigidos en el pliego de condiciones.", "Los requisitos habilitantes condicionan la participación (art. 5, num. 1, Ley 1150); adjudicar a quien no los cumple desconoce la selección objetiva.", false], ["C", "puede contratar directamente con cualquiera de los proponentes, porque la licitación pública fracasó por falta de oferentes hábiles.", "El fracaso de la licitación no es causal de contratación directa (art. 2, num. 4, Ley 1150); la ley prevé la selección abreviada para ese evento.", false]]}, {"id": "CE-178", "niv": 1, "e": "En la selección abreviada de menor cuantía, los interesados debían manifestar su intención de participar en un término", "f": "Decreto 1082 de 2015, art. 2.2.1.2.1.2.20, num. 1", "o": [["A", "no mayor a tres días hábiles contados desde la apertura del proceso.", "El numeral 1 del artículo 2.2.1.2.1.2.20 del Decreto 1082 de 2015 dispone que, en un término no mayor a tres días hábiles contados a partir de la apertura, los interesados deben manifestar su intención de participar.", true], ["B", "no mayor a cinco días hábiles contados desde la apertura del proceso.", "Cinco días hábiles es el término de observaciones al proyecto de pliego en la selección abreviada (Decreto 1082, art. 2.2.1.1.2.1.4), no el de manifestación de interés.", false], ["C", "no mayor a diez días hábiles contados desde la apertura del proceso.", "Diez días hábiles es el término de observaciones al proyecto de pliego en la licitación pública (Decreto 1082, art. 2.2.1.1.2.1.4).", false]]}, {"id": "CE-179", "niv": 2, "e": "Con las 25 manifestaciones de interés recibidas, la alcaldía", "f": "Decreto 1082 de 2015, art. 2.2.1.2.1.2.20, num. 2; Ley 1150 de 2007, art. 2, par. 2, num. 2", "o": [["A", "debe hacer un sorteo para reducir a cinco el número de interesados que pueden presentar oferta.", "El sorteo es facultativo y, si se hace, selecciona máximo diez interesados, no cinco (Decreto 1082, art. 2.2.1.2.1.2.20, num. 2).", false], ["B", "debe adelantar el proceso como licitación pública, porque se superó el número máximo de interesados.", "Recibir muchas manifestaciones de interés no cambia la modalidad; la norma prevé continuar o sortear (Decreto 1082, art. 2.2.1.2.1.2.20).", false], ["C", "puede continuar con todos los interesados o hacer un sorteo para escoger hasta diez de ellos.", "El numeral 2 del artículo 2.2.1.2.1.2.20 del Decreto 1082 de 2015 dispone que, si se reciben más de diez manifestaciones de interés, la entidad puede continuar el proceso o hacer un sorteo para seleccionar máximo diez interesados, según lo previsto en el pliego (art. 2, par. 2, num. 2, Ley 1150).", true]]}]}, {"comp": "anticorrupcion", "rol": "general", "tag": "Estatuto Anticorrupción y transparencia · Deber de denunciar actos de corrupción", "texto": "Tomás es técnico administrativo de la secretaría de hacienda de un municipio. Al conciliar las cuentas del impuesto predial, descubre que un compañero ha hecho varias transferencias de recursos públicos a una cuenta personal y conserva los soportes. Cuando le cuenta a su jefe inmediato, este le sugiere \"no meterse en problemas\" y olvidar el asunto. Días después, un contribuyente que también notó irregularidades en sus recibos pregunta en la ventanilla cómo puede denunciar posibles actos de corrupción de funcionarios de la alcaldía sin tener que desplazarse.", "items": [{"id": "AC-107", "niv": 1, "e": "Frente a lo que descubrió, Tomás", "f": "Ley 1952 de 2019, art. 38, num. 25", "o": [["A", "cumple su deber al informar a su jefe inmediato, quien es el único que decide si se presenta una denuncia.", "El deber de denunciar es personal de cada servidor; informar al superior no lo agota, y la sugerencia de no actuar no lo exime.", false], ["B", "puede abstenerse de actuar mientras no tenga la certeza plena de que se cometió un delito.", "La ley no exige certeza plena para denunciar; establecer la responsabilidad corresponde a las autoridades que investigan.", false], ["C", "debe denunciar los hechos ante las autoridades competentes, aunque su jefe le haya sugerido lo contrario.", "El numeral 25 del artículo 38 de la Ley 1952 de 2019 establece como deber de todo servidor público denunciar los delitos, contravenciones y faltas disciplinarias de los que tenga conocimiento, salvo las excepciones de ley.", true]]}, {"id": "AC-108", "niv": 1, "e": "Al contribuyente se le debe informar que la alcaldía", "f": "Ley 1474 de 2011, art. 76", "o": [["A", "solo recibe denuncias por corrupción presentadas personalmente y por escrito ante el despacho del alcalde o del secretario de gobierno.", "La ley exige que la entidad facilite la presentación de denuncias por su página web, sin limitarla a la presentación personal ante el alcalde.", false], ["B", "no tramita denuncias de corrupción, porque estas solo pueden presentarse ante la Fiscalía.", "Las entidades públicas deben recibir y tramitar quejas, sugerencias y reclamos, y disponer de un espacio para denuncias de corrupción, sin perjuicio de la competencia de la Fiscalía y de los órganos de control.", false], ["C", "debe tener en su página web principal un espacio para denunciar actos de corrupción de sus funcionarios.", "El artículo 76 de la Ley 1474 de 2011 ordena que todas las entidades públicas cuenten con un espacio en su página web principal para que los ciudadanos presenten quejas y denuncias de los actos de corrupción realizados por funcionarios de la entidad.", true]]}, {"id": "AC-109", "niv": 3, "e": "Si Tomás decidiera no denunciar las transferencias que conoció en razón de su cargo, esa omisión", "f": "Ley 1952 de 2019, art. 61, num. 3", "o": [["A", "solo podría calificarse como falta leve, porque no fue él quien se apropió de los recursos.", "La ley califica como gravísima la omisión de denunciar delitos dolosos conocidos en razón del cargo; no la reduce a falta leve por el hecho de no haber participado en la apropiación.", false], ["B", "podría constituir falta gravísima, porque la ley sanciona omitir la denuncia de delitos dolosos conocidos en razón del cargo.", "El numeral 3 del artículo 61 de la Ley 1952 de 2019 establece como falta gravísima omitir o retardar la denuncia de faltas gravísimas o delitos dolosos, preterintencionales o culposos investigables de oficio de que se tenga conocimiento en razón del cargo o función.", true], ["C", "no tendría consecuencias disciplinarias, porque denunciar es una facultad de los ciudadanos y no un deber del servidor.", "Para el servidor público, denunciar es un deber expreso (art. 38 num. 25 de la Ley 1952 de 2019), y su omisión puede acarrear responsabilidad disciplinaria.", false]]}]}, {"comp": "anticorrupcion", "rol": "general", "tag": "Estatuto Anticorrupción y transparencia · Impedimentos y recusaciones en la actuación administrativa", "texto": "Paula es profesional universitaria de la secretaría de tránsito de un municipio y debe resolver varios trámites. En el primero, el solicitante es el hermano de su esposo, quien pide la devolución de un vehículo inmovilizado. En el segundo, la interesada es su prima hermana, que solicita la prescripción de unas multas. Paula no tiene ningún interés económico en esos asuntos y considera que podría decidirlos con total imparcialidad. Antes de actuar, consulta con la oficina jurídica qué debe hacer.", "items": [{"id": "AC-126", "niv": 1, "e": "Respecto del trámite del hermano de su esposo, Paula", "f": "Ley 1437 de 2011 (CPACA), art. 11, num. 1", "o": [["A", "debe declararse impedida, porque él es su pariente en segundo grado de afinidad.", "El numeral 1 del artículo 11 del CPACA prevé como causal de impedimento el interés particular y directo del servidor, de su cónyuge o compañero permanente, o de sus parientes dentro del cuarto grado de consanguinidad, segundo de afinidad o primero civil. El hermano del cónyuge es pariente en segundo grado de afinidad.", true], ["B", "puede decidirlo, porque los parientes por afinidad no generan causal de impedimento.", "La causal comprende expresamente a los parientes hasta el segundo grado de afinidad, entre los que está el hermano del cónyuge.", false], ["C", "puede decidirlo, siempre que deje constancia escrita de que actuará con imparcialidad.", "La causal de impedimento es objetiva: la convicción de imparcialidad o una constancia escrita no permiten al servidor seguir conociendo el asunto.", false]]}, {"id": "AC-127", "niv": 2, "e": "En el trámite que adelanta su prima hermana, Paula", "f": "Ley 1437 de 2011 (CPACA), art. 11, num. 1", "o": [["A", "debe declararse impedida, porque la prima hermana es pariente en cuarto grado de consanguinidad.", "El numeral 1 del artículo 11 del CPACA incluye a los parientes dentro del cuarto grado de consanguinidad. Los primos hermanos están en ese grado: hay dos grados hasta el abuelo común y dos más hasta la prima.", true], ["B", "puede actuar, porque las causales de impedimento solo cubren hasta el segundo grado de consanguinidad.", "Para la consanguinidad, la causal llega hasta el cuarto grado, no solo hasta el segundo.", false], ["C", "puede actuar, porque las primas no se consideran parientes para efectos del régimen de impedimentos.", "Los primos hermanos son parientes en cuarto grado de consanguinidad y están comprendidos en la causal.", false]]}, {"id": "AC-128", "niv": 1, "e": "Para declararse impedida, Paula debe", "f": "Ley 1437 de 2011 (CPACA), art. 12", "o": [["A", "decidir los trámites y luego informar a la oficina de control interno para que revise sus decisiones.", "El impedimento debe manifestarse antes de decidir, separándose del asunto; informar después a control interno no cumple el procedimiento legal.", false], ["B", "enviar la actuación con escrito motivado a su superior, dentro de los tres días siguientes a conocer el asunto.", "El artículo 12 del CPACA dispone que el servidor en quien concurra una causal de impedimento debe, dentro de los tres días siguientes a su conocimiento, remitir la actuación con escrito motivado al superior o, si no lo tuviere, a la cabeza del respectivo sector administrativo.", true], ["C", "pedir a los interesados que desistan de sus solicitudes y las presenten de nuevo ante otro funcionario.", "La ley no traslada la carga a los interesados: es el servidor impedido quien remite la actuación para que la autoridad competente decida y, de ser el caso, designe a otro funcionario.", false]]}]}, {"comp": "anticorrupcion", "rol": "profesional", "tag": "Estatuto Anticorrupción y transparencia · Niveles profesional, asesor y ejecutivo · Conflicto de intereses en el régimen disciplinario", "texto": "Usted es profesional de una procuraduría provincial y analiza una queja contra el secretario de infraestructura de un municipio. Según la queja, el secretario integró el comité evaluador de una licitación de mantenimiento vial y votó a favor de la oferta de una firma de su amigo Julián. Desde hace años, el secretario y Julián explotan juntos un negocio de alquiler de maquinaria, sin haber constituido formalmente una sociedad, y se reparten las utilidades. Además, la queja señala que, durante la evaluación, el secretario recibió de otro de los oferentes un préstamo personal para pagar una deuda hipotecaria.", "items": [{"id": "AC-132", "niv": 2, "e": "Sobre la relación del secretario con Julián, se puede concluir que", "f": "Ley 1952 de 2019, art. 44", "o": [["A", "solo generaría conflicto de intereses si Julián fuera su pariente dentro del cuarto grado de consanguinidad.", "El parentesco es solo uno de los supuestos de la norma; los socios de hecho o de derecho están incluidos de forma independiente.", false], ["B", "no genera conflicto de intereses, porque el negocio no está constituido formalmente como sociedad.", "La ley no exige que la sociedad esté formalmente constituida: incluye expresamente a los socios de hecho.", false], ["C", "genera conflicto de intereses, porque la ley comprende el interés de los socios de hecho o de derecho del servidor.", "El artículo 44 de la Ley 1952 de 2019 obliga al servidor a declararse impedido cuando tenga interés particular y directo en el asunto, o lo tengan su cónyuge o compañero permanente, sus parientes dentro del cuarto grado de consanguinidad, segundo de afinidad o primero civil, o su socio o socios de hecho o de derecho.", true]]}, {"id": "AC-133", "niv": 3, "e": "Si se prueba que el secretario votó a sabiendas del conflicto de intereses, esa conducta", "f": "Ley 1952 de 2019, art. 56, num. 1", "o": [["A", "solo sería falta leve si la obra se ejecuta correctamente y sin sobrecostos para el municipio.", "La calificación de la falta no depende del resultado de la obra: la ley describe como gravísima la conducta de actuar pese al conflicto de intereses.", false], ["B", "no sería falta disciplinaria si no se demuestra que el secretario obtuvo un beneficio económico.", "La falta se configura al actuar a pesar del conflicto de intereses; la ley no exige demostrar un beneficio económico efectivo.", false], ["C", "encaja en una falta gravísima descrita por la ley: actuar a pesar de un conflicto de intereses.", "El numeral 1 del artículo 56 de la Ley 1952 de 2019 describe como falta gravísima actuar u omitir a pesar de la existencia de causales de incompatibilidad, inhabilidad y conflicto de intereses.", true]]}, {"id": "AC-134", "niv": 2, "e": "Respecto del préstamo que el secretario recibió de un oferente, es correcto afirmar que", "f": "Ley 1952 de 2019, art. 39, num. 10", "o": [["A", "está permitido, siempre que el préstamo se pacte con intereses de mercado y conste por escrito.", "Las condiciones del préstamo no lo hacen admisible: la prohibición recae sobre la relación de deudor con personas interesadas en los asuntos a cargo del servidor.", false], ["B", "le está prohibido al servidor constituirse en deudor de personas interesadas en los asuntos a su cargo.", "El numeral 10 del artículo 39 de la Ley 1952 de 2019 prohíbe a los servidores públicos constituirse en acreedores o deudores de personas interesadas directa o indirectamente en los asuntos a su cargo, de sus representantes o apoderados, y de sus parientes o cónyuges.", true], ["C", "solo estaría prohibido si el préstamo se destinara a gastos relacionados con la licitación.", "La prohibición no depende del destino que el servidor dé al dinero: se refiere a constituirse en deudor de un interesado en los asuntos a su cargo.", false]]}]}, {"comp": "comportamental", "rol": "profesional", "tag": "Competencias comportamentales (Diccionario de la Procuraduría) · Niveles profesional, asesor y ejecutivo · Pensamiento conceptual", "texto": "Usted es asesor de una procuraduría delegada para asuntos ambientales y su empleo exige Pensamiento conceptual en nivel A. Hace tres años un tribunal ordenó a 18 municipios descontaminar un río, y la mayoría sigue incumpliendo. Los informes de seguimiento muestran causas muy distintas: falta de presupuesto en unos, contratos de obra suspendidos en otros, dudas sobre qué entidad es competente y planes de saneamiento desactualizados. Un procurador regional sostiene que todo se explica por la falta de recursos. El procurador delegado le pide preparar un documento para orientar a las procuradurías regionales que vigilan el cumplimiento de la orden.", "items": [{"id": "CO-110", "niv": 3, "e": "Para responder al encargo, la actuación que mejor refleja el nivel A de Pensamiento conceptual es", "f": "Diccionario de Competencias Comportamentales PGN, Pensamiento conceptual, nivel A", "o": [["A", "explicar el problema a partir de sus causas y proponer directrices para que las regionales actúen frente a cada una.", "El nivel A de Pensamiento conceptual consiste en explicar problemas de alta complejidad y formular directrices para atenderlos, generando lineamientos claros que permitan entender el problema a partir de sus elementos.", true], ["B", "elaborar un concepto técnico, con base en los informes municipales y en estudios externos, que aclare la situación del río.", "Realizar análisis técnico a partir de información primaria y secundaria y conceptuar sobre situaciones con elementos heterogéneos es la conducta del nivel B. El nivel A añade formular directrices para atender el problema.", false], ["C", "organizar todos los informes de seguimiento en una base de datos para que el procurador delegado los consulte.", "Diseñar y organizar bases de datos con información de diferentes medios es una conducta de Gestión de la información, nivel B, no de Pensamiento conceptual.", false]]}, {"id": "CO-111", "niv": 2, "e": "Frente a la afirmación del procurador regional sobre la falta de recursos, lo que corresponde al nivel A de Pensamiento conceptual es", "f": "Diccionario de Competencias Comportamentales PGN, Pensamiento conceptual, nivel A", "o": [["A", "examinar con rigor cada factor del problema y aclarar si el presupuesto explica todos los incumplimientos o solo una parte.", "Una de las conductas del nivel A es aclarar situaciones o problemas que requieren rigurosidad técnica y conceptual. La competencia se define como entender un problema a partir de los elementos que lo conforman, no desde una sola explicación.", true], ["B", "aceptar la explicación, porque proviene de quien conoce de cerca la situación de los municipios de su región.", "Adopta una explicación sin analizar los elementos del problema. Contradice la definición de la competencia y la rigurosidad técnica y conceptual que el diccionario exige en el nivel A.", false], ["C", "convocar una mesa de trabajo con los alcaldes para gestionar recursos que permitan cumplir la orden judicial.", "Puede ser una acción útil, pero apunta a obtener un resultado y no a entender el problema. Además parte de una premisa no verificada: que la causa es solo presupuestal.", false]]}, {"id": "CO-112", "niv": 1, "e": "Según el diccionario, el documento que se espera de un servidor con nivel A de Pensamiento conceptual debe", "f": "Diccionario de Competencias Comportamentales PGN, Pensamiento conceptual, nivel A", "o": [["A", "resolver el caso de cada municipio con un concepto individual elaborado por la delegada.", "Realizar conceptos que aclaran situaciones concretas aparece en los niveles B y C. El nivel A pide lineamientos que permitan entender el problema y atenderlo de manera general.", false], ["B", "reunir toda la normativa y la jurisprudencia aplicables, para que cada regional saque sus propias conclusiones.", "Recopilar información sin aclarar el problema no responde al nivel A. Esta conducta se parece más a buscar información (Gestión de la información o Investigación) que a formular directrices.", false], ["C", "dar a las regionales pautas concretas e inequívocas para que comprendan el problema y sepan cómo actuar.", "El nivel A de Pensamiento conceptual incluye generar lineamientos claros y precisos que permitan entender situaciones o problemas específicos, y formular directrices para atenderlos.", true]]}]}, {"comp": "comportamental", "rol": "profesional", "tag": "Competencias comportamentales (Diccionario de la Procuraduría) · Niveles profesional, asesor y ejecutivo · Pensamiento conceptual", "texto": "Usted es asesor de la Oficina Jurídica de la Procuraduría y su empleo exige Pensamiento conceptual en nivel A. Desde la entrada en vigencia de la Ley 2094 de 2021, que reformó el Código General Disciplinario y separó las funciones de instrucción y juzgamiento, varias procuradurías regionales aplican criterios distintos sobre el momento en que un expediente debe pasar de la etapa de instrucción a la de juzgamiento. Las consultas llegan a la oficina casi a diario. El jefe le pide preparar una directriz que aclare el asunto y presentarla después en una reunión con los procuradores regionales. En el equipo hay un profesional cuyo empleo exige el nivel B de la misma competencia.", "items": [{"id": "CO-131", "niv": 3, "e": "Frente a las interpretaciones contradictorias, lo que mejor refleja el nivel A de Pensamiento conceptual es", "f": "Diccionario de Competencias Comportamentales PGN, Pensamiento conceptual, nivel A", "o": [["A", "compilar la jurisprudencia y la doctrina sobre el tema en un documento de consulta para todas las procuradurías regionales.", "Buscar y reunir información se relaciona con Investigación o Gestión de la información; no explica el problema ni formula directrices, como pide el nivel A.", false], ["B", "identificar los elementos que originan las interpretaciones y proponer una directriz que unifique el criterio.", "El nivel A de Pensamiento conceptual consiste en explicar problemas de alta complejidad y formular directrices para atenderlos, entendiendo el problema a partir de los elementos que lo conforman.", true], ["C", "emitir un concepto sobre cada consulta de las regionales a medida que lleguen a la oficina.", "Realizar conceptos que aclaran situaciones concretas es una conducta de los niveles B y C. El nivel A atiende el problema de fondo formulando directrices.", false]]}, {"id": "CO-132", "niv": 1, "e": "Al presentar la directriz en la reunión con los procuradores regionales, lo coherente con el nivel A de Pensamiento conceptual es", "f": "Diccionario de Competencias Comportamentales PGN, Pensamiento conceptual, nivel A", "o": [["A", "exponer en detalle la evolución jurisprudencial del tema, para que cada procurador saque sus conclusiones.", "Deja la conclusión en manos de cada procurador y no aporta los lineamientos claros que exige el nivel A.", false], ["B", "entregar el texto completo de la directriz y resolver dudas solo si los asistentes las formulan.", "No hace el esfuerzo de explicar el problema; el nivel A pide aclarar las situaciones y generar lineamientos que permitan entenderlas.", false], ["C", "presentar con claridad y precisión los elementos del problema y el criterio que deben aplicar.", "El nivel A de Pensamiento conceptual incluye explicar problemas complejos y generar lineamientos claros y precisos que permitan entender situaciones o problemas específicos.", true]]}, {"id": "CO-133", "niv": 3, "e": "Para el profesional del equipo, cuyo empleo exige el nivel B de Pensamiento conceptual, la tarea que corresponde a su nivel es", "f": "Diccionario de Competencias Comportamentales PGN, Pensamiento conceptual, nivel B", "o": [["A", "contrastar expedientes de las regionales con la jurisprudencia y aclarar en un concepto una situación de elementos diversos.", "El nivel B de Pensamiento conceptual consiste en conceptuar sobre situaciones formadas por elementos heterogéneos, con análisis técnico de información primaria (los expedientes) y secundaria (la jurisprudencia).", true], ["B", "separar el problema en sus componentes y proponer soluciones medibles para cada uno.", "Desagregar un problema en sus componentes y proponer soluciones medibles y cuantificables es el nivel B de Pensamiento analítico, otra competencia; el nivel B de Pensamiento conceptual pide conceptuar para aclarar la situación.", false], ["C", "formular la directriz que se enviará a todas las procuradurías regionales para unificar el criterio.", "Formular directrices para atender problemas de alta complejidad es la conducta del nivel A, que corresponde al asesor.", false]]}]}, {"comp": "comportamental", "rol": "profesional", "tag": "Competencias comportamentales (Diccionario de la Procuraduría) · Niveles profesional, asesor y ejecutivo · Responsabilidad con la organización", "texto": "Usted es profesional universitario de la procuraduría delegada para la defensa de los derechos de la infancia y la adolescencia, y su empleo exige Responsabilidad con la organización en nivel B. El objetivo de la delegada este año es hacer seguimiento a las políticas de infancia en 50 municipios, con una matriz de seguimiento que se envía a cada alcaldía. En noviembre usted tiene sus informes al día, pero una compañera salió a licencia y dejó doce informes pendientes; el procurador delegado pregunta quién puede ayudar. Al trabajar con la matriz, usted nota que obliga a pedir dos veces la misma información a las alcaldías.", "items": [{"id": "CO-149", "niv": 1, "e": "Ante la pregunta del procurador delegado sobre los informes pendientes, lo que refleja el nivel B de Responsabilidad con la organización es", "f": "Diccionario de Competencias Comportamentales PGN, Responsabilidad con la organización, nivel B", "o": [["A", "proponer al equipo líneas de acción claras para evacuar entre todos los informes pendientes.", "Establecer líneas de acción claras para cumplir los objetivos y orientar la acción del grupo es una conducta de Trabajo en equipo, nivel B. El nivel B de Responsabilidad con la organización se refleja en enfocar la propia actividad hacia los objetivos de la entidad.", false], ["B", "ofrecerse a asumir parte de los informes, porque el objetivo es de la delegada y no solo de cada servidor.", "El nivel B de Responsabilidad con la organización incluye contribuir al desarrollo de los objetivos de la entidad y enfocar la propia actividad hacia el cumplimiento de los objetivos de la institución.", true], ["C", "atender los informes de la compañera solo si el procurador delegado se los asigna formalmente.", "Limitarse a resolver lo que le asignen corresponde al nivel C (buscar solución a los problemas que le asignen), inferior al exigido.", false]]}, {"id": "CO-150", "niv": 2, "e": "Frente a la doble solicitud de información que genera la matriz, lo que corresponde al nivel B de Responsabilidad con la organización es", "f": "Diccionario de Competencias Comportamentales PGN, Responsabilidad con la organización, nivel B", "o": [["A", "seguir usando la matriz, porque es la herramienta oficial aprobada para el seguimiento.", "Cumplir los parámetros establecidos es una conducta del nivel D. El nivel B pide además buscar la mejora de los procesos institucionales.", false], ["B", "proponer a la delegada un ajuste de la matriz para el siguiente ciclo.", "El nivel B de Responsabilidad con la organización incluye proponer estrategias de mejoramiento continuo y buscar permanentemente la mejora de los procesos institucionales.", true], ["C", "crear para su uso personal una hoja de control que evite la doble solicitud en sus municipios.", "Diseñar instrumentos para el propio trabajo es una conducta de Creatividad e innovación, nivel D. No mejora el proceso de la delegada.", false]]}, {"id": "CO-151", "niv": 3, "e": "Al final del año, usted recibe un reconocimiento especial por un informe de calidad excepcional que superó las expectativas de la delegada y de las alcaldías. Según el diccionario, esa situación describe", "f": "Diccionario de Competencias Comportamentales PGN, Responsabilidad con la organización, nivel A", "o": [["A", "el nivel A de Responsabilidad con la organización.", "El nivel A de Responsabilidad con la organización (superar las expectativas de los usuarios internos y externos) incluye mostrar resultados con niveles de calidad excepcionales y obtener reconocimientos especiales por el cumplimiento de sus funciones.", true], ["B", "el nivel A de Orientación a resultados.", "El nivel A de Orientación a resultados se refiere a fijar metas desafiantes y comprometer recursos para superarlas, no a la calidad excepcional ni a los reconocimientos.", false], ["C", "el nivel B de Responsabilidad con la organización.", "El nivel B trata de contribuir a los objetivos de la entidad y proponer mejoras; los resultados excepcionales y los reconocimientos especiales los ubica el diccionario en el nivel A.", false]]}]}, {"comp": "comportamental", "rol": "profesional", "tag": "Competencias comportamentales (Diccionario de la Procuraduría) · Niveles profesional, asesor y ejecutivo · Investigación", "texto": "Usted es profesional universitario del Instituto de Estudios del Ministerio Público, adscrito a la Procuraduría, y su empleo exige Investigación en nivel B. El instituto quiere estudiar si las audiencias virtuales han cambiado la duración de los procesos disciplinarios verbales. Necesita un modelo de análisis sólido y el apoyo de varias procuradurías regionales. El director del instituto tiene exigido el nivel A de la misma competencia, y un profesional de una procuraduría regional que colaborará con el estudio tiene exigido el nivel C.", "items": [{"id": "CO-176", "niv": 3, "e": "Para contar con un modelo de análisis sólido, lo que refleja el nivel B de Investigación es", "f": "Diccionario de Competencias Comportamentales PGN, Investigación, nivel B", "o": [["A", "aplicar el modelo de análisis que el instituto ha usado siempre, para conservar la comparabilidad de los resultados.", "No incorpora elementos nuevos ni busca nuevos modelos de investigación, que son las conductas del nivel B.", false], ["B", "consultar artículos académicos sobre el tema y adoptar el modelo que más se cite.", "Acudir a las fuentes de información disponibles se relaciona con Gestión de la información, nivel C; no es el desarrollo conjunto de un modelo.", false], ["C", "proponer un trabajo conjunto con un grupo de investigación de una universidad acreditada para construir el modelo.", "Una de las conductas del nivel B de Investigación es realizar alianzas con instituciones educativas reconocidas para desarrollar nuevos modelos de investigación.", true]]}, {"id": "CO-177", "niv": 2, "e": "Para el director del instituto, la conducta que corresponde al nivel A de Investigación es", "f": "Diccionario de Competencias Comportamentales PGN, Investigación, nivel A", "o": [["A", "aportar información confiable y veraz a los proyectos que adelante el instituto.", "Es una conducta del nivel C de Investigación.", false], ["B", "plantear proyectos sobre las funciones misionales de la entidad y promover estudios sobre cómo investigar.", "El nivel A de Investigación (diseñar y ejecutar estrategias para promover la investigación en asuntos de interés de la Procuraduría) incluye impulsar estudios sobre método de investigación y formular proyectos relacionados con las funciones misionales.", true], ["C", "promover la participación de los servidores en convenios de formación con universidades.", "Buscar programas y convenios de formación para los colaboradores es una conducta del nivel A de Aprendizaje continuo, no de Investigación.", false]]}, {"id": "CO-178", "niv": 3, "e": "Para el profesional de la procuraduría regional que colabora con el estudio, la conducta que corresponde al nivel C de Investigación es", "f": "Diccionario de Competencias Comportamentales PGN, Investigación, nivel C", "o": [["A", "aportar información veraz de su regional y objetivos claros, coherentes con las metas del estudio.", "El nivel C de Investigación (apoyar metodológica y conceptualmente las investigaciones) incluye aportar información confiable y veraz y aportar objetivos claros, concisos y coherentes con las metas organizacionales.", true], ["B", "preparar en su regional las condiciones para recolectar los datos que el instituto necesita.", "Preparar las condiciones para la recolección de datos es la conducta del nivel D, inferior al exigido para este profesional.", false], ["C", "expresar sus ideas sobre el estudio con claridad y escuchar con respeto las de los demás.", "Expresar ideas con claridad y escuchar con atención y respeto es el nivel C de Comunicación, no de Investigación.", false]]}]}];
const CFG = {"titulo": "Simulacro 3 · Profesional, asesor y ejecutivo · Procuraduría 2027", "modo": "simulacro", "minutos": 220, "componentes": {"estructura_pgn": "Estructura y funciones de la Procuraduría", "gestion_publica": "Gestión pública y funcionamiento del Estado", "atencion_usuario": "Atención al usuario", "gestion_documental": "Gestión documental", "documentos_oficina": "Elaboración de documentos de oficina", "ofimatica": "Herramientas ofimáticas", "sistemas_gestion": "Sistemas de gestión (MIPG, control interno y calidad)", "disciplinario": "Código General Disciplinario", "contratacion": "Contratación estatal", "anticorrupcion": "Estatuto Anticorrupción y transparencia", "comportamental": "Competencias comportamentales (Diccionario de la Procuraduría)"}, "niveles": {"1": "Básico", "2": "Intermedio", "3": "Avanzado"}, "roles": {"general": "Todos los niveles", "tecnico": "Niveles técnico, administrativo y operativo", "profesional": "Niveles profesional, asesor y ejecutivo"}, "clave": "profesional-03.html"};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY = 'sim-pgn:' + CFG.clave;
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}
function save(){try{localStorage.setItem(KEY, JSON.stringify(ST))}catch(e){}}
let ST = load();
ST.r = ST.r || {};
$('#tit').textContent = CFG.titulo;
const ITEMS = [];
DATA.forEach(c => c.items.forEach(it => { it.caso = c; ITEMS.push(it); }));

function justHTML(it){
  return '<div class="just">' + it.o.map(o => `<div><b>${o[0]}.</b> <span class="${o[3]?'okt':'not'}">${o[3]?'Es correcta.':'Es incorrecta.'}</span> ${esc(o[2])}</div>`).join('') +
    `<div class="src">Referencia: ${esc(it.f)}</div></div>`;
}
function itemHTML(it, n, mode){
  const r = ST.r[it.id];
  const reveal = mode === 'review' || (CFG.modo === 'practica' && r);
  let h = `<div class="item" id="i-${it.id}"><p class="enun"><span class="n">${n}.</span> <span class="niv">${CFG.niveles[it.niv]}</span> ${esc(it.e)}</p>`;
  it.o.forEach(o => {
    let cls = '';
    if (reveal) { if (o[3]) cls = 'ok'; else if (r === o[0]) cls = 'no'; }
    else if (r === o[0]) cls = 'sel';
    h += `<button class="op ${cls}" data-id="${it.id}" data-l="${o[0]}" ${reveal?'disabled':''}><span class="l">${o[0]}.</span><span>${esc(o[1])}</span></button>`;
  });
  if (reveal) {
    if (mode === 'review') h += `<div class="${r===keyOf(it)?'res-ok':'res-no'}" style="font-size:14px;margin-top:4px">${r ? (r===keyOf(it)?'Respondiste ' + r + ': correcto.':'Respondiste ' + r + '. La respuesta correcta es ' + keyOf(it) + '.') : 'Sin responder. La respuesta correcta es ' + keyOf(it) + '.'}</div>`;
    h += justHTML(it);
  }
  return h + '</div>';
}
const keyOf = it => it.o.find(o => o[3])[0];

function renderList(list, mode){
  let h = '', last = null, n = 0;
  list.forEach(it => {
    n++;
    if (it.caso !== last) { last = it.caso; h += `<div class="caso"><div class="tag">${esc(it.caso.tag)}</div><p>${esc(it.caso.texto)}</p></div>`; }
    h += itemHTML(it, n, mode);
  });
  return h;
}

// ---------- PRÁCTICA ----------
let LIST = [];
let FILTRO = ST.f || {comp:'', niv:'', rol:''};
function practica(){
  const comps = Object.entries(CFG.componentes).map(([k,v]) => `<option value="${k}" ${FILTRO.comp===k?'selected':''}>${esc(v)}</option>`).join('');
  const nivs = Object.entries(CFG.niveles).map(([k,v]) => `<option value="${k}" ${FILTRO.niv===k?'selected':''}>${esc(v)}</option>`).join('');
  const list = ITEMS.filter(it => (!FILTRO.comp || it.caso.comp===FILTRO.comp) && (!FILTRO.niv || String(it.niv)===FILTRO.niv) && (!FILTRO.rol || it.caso.rol===FILTRO.rol || it.caso.rol==='general'));
  const resp = list.filter(it => ST.r[it.id]); const ok = resp.filter(it => ST.r[it.id]===keyOf(it));
  $('#main').innerHTML = `<div class="panel"><p style="margin-top:0">Elige un tema, tu nivel de empleo y la dificultad. Al responder verás de inmediato si acertaste y la explicación de cada opción.</p>
  <div class="row"><select id="fc"><option value="">Todos los temas</option>${comps}</select>
  <select id="fn"><option value="">Todas las dificultades</option>${nivs}</select>
  <select id="fr"><option value="">Todos los niveles de empleo</option>${['tecnico','profesional'].map(k => `<option value="${k}" ${FILTRO.rol===k?'selected':''}>${esc(CFG.roles[k])} (y temas comunes)</option>`).join('')}</select>
  <button class="btn sec" id="borrar">Borrar mis respuestas</button></div>
  <p class="stat" id="pst" style="margin-bottom:0">${list.length} preguntas · respondidas ${resp.length} · aciertos ${ok.length}${resp.length? ' (' + Math.round(100*ok.length/resp.length) + ' %)':''}</p></div>` + renderList(list, 'practica');
  $('#prog').textContent = `${ok.length}/${resp.length} aciertos`;
  ['fc','fn','fr'].forEach((id,i) => $('#'+id).onchange = e => { FILTRO[['comp','niv','rol'][i]] = e.target.value; ST.f = FILTRO; save(); practica(); });
  LIST = list;
  $('#borrar').onclick = () => { list.forEach(it => delete ST.r[it.id]); save(); practica(); };
}

// ---------- SIMULACRO ----------
let tick = null;
function inicio(){
  const n = ITEMS.length, cnt = {};
  ITEMS.forEach(it => cnt[it.caso.comp] = (cnt[it.caso.comp]||0) + 1);
  const h = Math.floor(CFG.minutos/60), m = CFG.minutos%60;
  $('#main').innerHTML = `<div class="panel"><h2 style="margin-top:0;color:var(--pri)">Instrucciones</h2>
  <p>Este simulacro tiene <b>${n} preguntas</b> en formato de caso: una situación, enunciados que se completan y tres opciones con una sola respuesta correcta.</p>
  <table>${Object.entries(cnt).map(([k,v]) => `<tr><td>${esc(CFG.componentes[k])}</td><td class="r">${v}</td></tr>`).join('')}</table>
  <p>Tiempo sugerido: <b>${h ? h + ' h ' : ''}${m ? m + ' min' : ''}</b> (unos ${Math.round(CFG.minutos*60/n/6)/10} minutos por pregunta). Cuando se acaba el tiempo puedes seguir, pero el cronómetro lo indica.</p>
  <p>Tus respuestas se guardan en este navegador. Al terminar verás tu puntaje por componente y por dificultad, y la explicación de cada pregunta.</p>
  <button class="btn" id="go">${ST.t0 ? 'Continuar el simulacro' : 'Comenzar'}</button></div>`;
  $('#prog').textContent = `${n} preguntas`;
  $('#go').onclick = () => { if (!ST.t0) { ST.t0 = Date.now(); save(); } examen(); };
}
function reloj(){
  const rest = CFG.minutos*60 - Math.floor((Date.now() - ST.t0)/1000);
  const a = Math.abs(rest), hh = Math.floor(a/3600), mm = Math.floor(a%3600/60), ss = a%60;
  const t = (rest < 0 ? '+' : '') + (hh ? hh + ':' : '') + String(mm).padStart(2,'0') + ':' + String(ss).padStart(2,'0');
  $('#timer').textContent = rest < 0 ? 'Tiempo cumplido ' + t : '⏱ ' + t;
  $('#timer').classList.toggle('low', rest < 600);
}
function examen(){
  $('#main').innerHTML = renderList(ITEMS, 'examen') + `<div class="panel"><button class="btn" id="fin">Terminar y calificar</button></div>`;
  progreso(); reloj(); clearInterval(tick); tick = setInterval(reloj, 1000);
  $('#fin').onclick = () => {
    const faltan = ITEMS.length - Object.keys(ST.r).filter(k => ITEMS.some(i => i.id===k)).length;
    $('#mtxt').textContent = faltan ? `Te faltan ${faltan} preguntas por responder. ¿Quieres calificar de todos modos?` : '¿Quieres terminar y ver tu calificación?';
    $('#modal').classList.remove('hide');
  };
}
function progreso(){
  const r = ITEMS.filter(it => ST.r[it.id]).length;
  $('#prog').textContent = `Respondidas ${r}/${ITEMS.length}`;
}
$('#mno').onclick = () => $('#modal').classList.add('hide');
$('#msi').onclick = () => { $('#modal').classList.add('hide'); ST.fin = Date.now(); save(); resultados(); };
function resultados(){
  clearInterval(tick);
  const ok = ITEMS.filter(it => ST.r[it.id] === keyOf(it)).length;
  const pct = Math.round(1000*ok/ITEMS.length)/10;
  const g = (fn, lab) => { const m = {}; ITEMS.forEach(it => { const k = fn(it); m[k] = m[k] || [0,0]; m[k][1]++; if (ST.r[it.id]===keyOf(it)) m[k][0]++; });
    return Object.entries(m).map(([k,v]) => `<tr><td>${esc(lab(k))}</td><td class="r">${v[0]}/${v[1]}</td><td class="r">${Math.round(100*v[0]/v[1])} %</td></tr>`).join(''); };
  const mins = Math.round(((ST.fin||Date.now()) - ST.t0)/60000);
  $('#timer').textContent = `Tiempo usado: ${Math.floor(mins/60) ? Math.floor(mins/60) + ' h ' : ''}${mins%60} min`;
  $('#prog').textContent = `${ok}/${ITEMS.length} aciertos`;
  $('#main').innerHTML = `<div class="panel"><div class="big">${String(pct).replace('.',',')} %</div>
  <p style="margin-top:4px">${ok} de ${ITEMS.length} respuestas correctas. ${pct >= 75 ? 'Muy buen resultado: repasa las explicaciones de tus errores para afianzarlo.' : pct >= 65 ? 'Vas bien, pero con poco margen: refuerza los componentes con menor porcentaje.' : 'Todavía no estás en zona segura: practica por tema los componentes con menor porcentaje.'}</p>
  <p class="aviso">Referencia: en el concurso de la Procuraduría la prueba de conocimientos es eliminatoria con mínimo de 65 puntos sobre 100, y la comportamental es clasificatoria. Este porcentaje de aciertos es una guía de preparación; la calificación oficial usa una escala estándar que compara a los aspirantes.</p>
  <h3>Por componente</h3><table>${g(it => it.caso.comp, k => CFG.componentes[k])}</table>
  <h3>Por dificultad</h3><table>${g(it => it.niv, k => CFG.niveles[k])}</table>
  <div class="row" style="margin-top:14px"><button class="btn" id="solo">Ver solo mis errores</button><button class="btn sec" id="todas">Ver todas</button><button class="btn sec" id="otra">Reiniciar el simulacro</button></div></div><div id="rev"></div>`;
  const rev = errs => { const l = errs ? ITEMS.filter(it => ST.r[it.id] !== keyOf(it)) : ITEMS; $('#rev').innerHTML = renderList(l, 'review'); };
  rev(true);
  $('#solo').onclick = () => rev(true); $('#todas').onclick = () => rev(false);
  $('#otra').onclick = () => { ST = {r:{}}; save(); inicio(); window.scrollTo(0,0); };
}

document.addEventListener('click', e => {
  const b = e.target.closest('button.op'); if (!b || b.disabled) return;
  ST.r[b.dataset.id] = b.dataset.l; save();
  const it = ITEMS.find(i => i.id === b.dataset.id);
  const n = b.closest('.item').querySelector('.n').textContent.replace('.','');
  b.closest('.item').outerHTML = itemHTML(it, n, CFG.modo === 'practica' ? 'practica' : 'examen');
  if (CFG.modo === 'practica') { const resp = LIST.filter(i => ST.r[i.id]); const ok = resp.filter(i => ST.r[i.id]===keyOf(i)).length; $('#prog').textContent = `${ok}/${resp.length} aciertos`; $('#pst').textContent = `${LIST.length} preguntas · respondidas ${resp.length} · aciertos ${ok} (${Math.round(100*ok/resp.length)} %)`; }
  else progreso();
});

if (CFG.modo === 'practica') practica();
else if (ST.fin) resultados();
else if (ST.t0) examen();
else inicio();
</script>
