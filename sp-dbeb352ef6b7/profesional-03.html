, false], ["B", "«el 15 % de los expedientes», con un espacio entre la cifra y el símbolo.", "La RAE recomienda escribir el porcentaje con cifras y el símbolo % separado por un espacio (el 15 %), o enteramente con palabras (el quince por ciento); no se combina el símbolo con números en letras.", true], ["C", "«el quince % de los expedientes», porque el símbolo puede acompañar a números escritos en letras.", "La RAE indica que el símbolo % solo se emplea cuando el porcentaje se escribe con cifras; «el quince %» es incorrecto.", false]]}]}, {"comp": "ofimatica", "rol": "general", "tag": "Herramientas ofimáticas · Validación de datos, formato condicional y filtros", "texto": "Usted es técnico de una procuraduría distrital y administra la hoja compartida de seguimiento de solicitudes. Detectó tres problemas: los compañeros escriben el estado de cada solicitud de formas distintas («pendiente», «Pend.», «en trámite»); el jefe quiere ver resaltadas en rojo, de forma automática, las solicitudes con más de 10 días sin respuesta; y la coordinadora necesita ver solo las filas de una dependencia, sin borrar ni mover las demás.", "items": [{"id": "OF-128", "niv": 1, "e": "Para que el estado se registre de manera uniforme, la herramienta adecuada es", "f": "Microsoft Support, «Aplicar validación de datos a celdas» y «Crear una lista desplegable»", "o": [["A", "la validación de datos con una lista de valores permitidos en la columna de estado.", "La validación de datos restringe lo que se puede escribir en una celda; con la opción Lista se ofrece un desplegable con los estados válidos y se rechazan los demás.", true], ["B", "la protección de la hoja con contraseña, para bloquear la columna de estado.", "Proteger la hoja impediría que los compañeros registren el estado; no ofrece una lista de valores válidos.", false], ["C", "el formato condicional, para colorear los estados mal escritos.", "El formato condicional solo cambia la apariencia según una regla; no impide que se escriban valores distintos.", false]]}, {"id": "OF-129", "niv": 1, "e": "Para resaltar automáticamente las solicitudes con más de 10 días, debe usarse", "f": "Microsoft Support, «Utilice el formato condicional para resaltar la información en Excel»", "o": [["A", "una ordenación descendente de la columna de días.", "Ordenar cambia la posición de las filas, pero no resalta ninguna ni distingue las que superan los 10 días.", false], ["B", "una validación de datos con alerta de error de estilo Detener.", "La validación controla lo que se escribe, no da formato a las celdas que cumplen una condición.", false], ["C", "un formato condicional con una regla sobre la columna de días.", "El formato condicional aplica formato (como relleno rojo) a las celdas que cumplen una regla, por ejemplo valores mayores que 10, y se actualiza al cambiar los datos.", true]]}, {"id": "OF-130", "niv": 2, "e": "Para atender la necesidad de la coordinadora, lo adecuado es", "f": "Microsoft Support, «Filtrar datos en un rango o tabla»; «Usar las segmentaciones para filtrar datos»", "o": [["A", "crear una tabla dinámica que reemplace los datos originales por los de esa dependencia.", "La tabla dinámica resume datos en otro lugar y no reemplaza la hoja de origen; además, la coordinadora necesita ver las filas, no un resumen.", false], ["B", "ordenar la tabla por dependencia, con lo cual se ocultan las filas de las demás.", "Ordenar reorganiza las filas (las mueve), pero no oculta ninguna; todas siguen visibles.", false], ["C", "aplicar un filtro a la columna de dependencia y elegir la que necesita.", "El filtro oculta temporalmente las filas que no cumplen el criterio, sin borrarlas ni moverlas, y se puede quitar para volver a ver todos los datos.", true]]}]}, {"comp": "ofimatica", "rol": "general", "tag": "Herramientas ofimáticas · PowerPoint: patrón de diapositivas y vista Moderador", "texto": "Usted prepara una presentación de 25 diapositivas para la rendición de cuentas de una procuraduría regional. Debe incluir el logotipo institucional y la misma fuente en todas las diapositivas, y quiere tener a la vista sus apuntes durante la exposición sin que el público los vea. Una compañera le entregó la versión del año anterior, en la que usted no logra borrar, desde la vista Normal, una imagen que aparece en todas las diapositivas.", "items": [{"id": "OF-149", "niv": 1, "e": "Para que el logotipo y la fuente queden en todas las diapositivas, lo más eficiente es", "f": "Microsoft Support, «¿Qué es un patrón de diapositivas en PowerPoint?»", "o": [["A", "insertar el logotipo en la primera diapositiva y duplicarla para crear las demás.", "Duplicar copia el contenido actual, pero cualquier cambio posterior del logotipo o la fuente tendría que hacerse diapositiva por diapositiva.", false], ["B", "insertar el logotipo y definir la fuente en el patrón de diapositivas.", "Microsoft explica que los cambios hechos en el patrón de diapositivas se reflejan en todas las diapositivas basadas en él, como fuentes e imágenes (logotipos).", true], ["C", "pegar el logotipo en cada diapositiva desde la vista Normal y cambiar la fuente una por una.", "Funciona, pero es lento y propenso a inconsistencias; el patrón aplica el formato a todas de una vez.", false]]}, {"id": "OF-150", "niv": 2, "e": "La imagen que no se puede borrar desde la vista Normal probablemente", "f": "Microsoft Support, «¿Qué es un patrón de diapositivas en PowerPoint?»", "o": [["A", "está en el patrón de diapositivas o en un diseño, y se quita desde esa vista.", "Microsoft señala que, si un elemento no se puede editar en la vista Normal, puede deberse a que está definido en el patrón o en un diseño; para editarlo hay que pasar a la vista Patrón de diapositivas.", true], ["B", "es una marca de agua del tema, que PowerPoint no permite quitar.", "Los elementos del tema y del patrón se pueden editar o quitar desde la vista Patrón de diapositivas.", false], ["C", "está protegida con una contraseña que solo conoce la autora del archivo.", "Las contraseñas protegen la apertura o modificación del archivo completo, no una imagen concreta de las diapositivas.", false]]}, {"id": "OF-151", "niv": 2, "e": "Para consultar sus apuntes durante la exposición sin que el público los vea, debe", "f": "Microsoft Support, «Iniciar la presentación y ver las notas en la vista Moderador»", "o": [["A", "escribirlos en cuadros de texto con fuente blanca sobre el fondo de cada diapositiva.", "Ese texto forma parte de la diapositiva proyectada y puede verse o seleccionarse; no es un espacio reservado al expositor.", false], ["B", "escribirlos en el patrón de diapositivas, que el público no ve durante la presentación.", "Lo que se pone en el patrón aparece en todas las diapositivas proyectadas; no está oculto al público.", false], ["C", "escribirlos en el panel de notas y presentar con la vista Moderador.", "La vista Moderador muestra al expositor, en su pantalla, las notas y la diapositiva siguiente, mientras el público solo ve la diapositiva en curso.", true]]}]}, {"comp": "ofimatica", "rol": "general", "tag": "Herramientas ofimáticas · Seguridad de la información en ofimática", "texto": "Usted es profesional universitario de la Oficina de Control Interno de la Procuraduría. Recibe un correo firmado por «Mesa de Ayuda TI», enviado desde un dominio parecido al institucional pero con una letra cambiada, que le advierte que su cuenta se bloqueará en dos horas si no confirma su usuario y contraseña en un vínculo. Ese mismo día debe compartir para revisión, con una contratista externa, un informe preliminar con información reservada guardado en su OneDrive institucional. Además, un compañero que sale a vacaciones le pide que use su usuario y contraseña para responder sus correos pendientes.", "items": [{"id": "OF-152", "niv": 1, "e": "Frente al correo de la supuesta mesa de ayuda, usted debe", "f": "Microsoft Support, «Suplantación de identidad (phishing) y comportamiento sospechoso en Outlook»", "o": [["A", "responder al remitente para pedir que confirme si el mensaje es auténtico antes de ingresar los datos.", "Responder confirma al atacante que la cuenta está activa; la verificación debe hacerse por un canal oficial distinto del mensaje sospechoso.", false], ["B", "no abrir el vínculo ni responder, y reportar el mensaje como suplantación por el canal institucional.", "Es un intento típico de suplantación (phishing). Lo adecuado es no interactuar con el vínculo ni entregar credenciales y reportarlo (por ejemplo, con la opción de informar de phishing o al área de tecnología).", true], ["C", "abrir el vínculo desde su celular personal, fuera de la red institucional, para comprobar si es legítimo.", "Abrir el vínculo desde otro dispositivo no elimina el riesgo de robo de credenciales ni de descarga de código malicioso.", false]]}, {"id": "OF-153", "niv": 1, "e": "Del mensaje recibido, la señal más clara de suplantación es", "f": "Microsoft, «¿Qué es el correo electrónico de suplantación de identidad (phishing)?» (microsoft.com/es-co/security)", "o": [["A", "la combinación de urgencia, solicitud de la contraseña y un dominio que imita el institucional.", "Microsoft señala como alertas de phishing las direcciones parecidas a las reales con pequeñas diferencias, el lenguaje urgente o amenazante y las solicitudes de ingresar datos en vínculos.", true], ["B", "que esté redactado en español formal y sin errores de ortografía.", "La buena redacción no es indicio de fraude; muchos mensajes de suplantación están bien escritos.", false], ["C", "que lo envíe una mesa de ayuda, porque esas áreas no escriben a los usuarios.", "Las mesas de ayuda sí envían comunicaciones; lo sospechoso es el dominio alterado y la petición urgente de la contraseña.", false]]}, {"id": "OF-154", "niv": 3, "e": "Para compartir el informe con la contratista desde OneDrive, la opción más segura es", "f": "Microsoft Learn, «Cómo funcionan los vínculos que se pueden compartir en OneDrive y SharePoint en Microsoft 365»; Microsoft Support, «Uso compartido de archivos o carpetas de SharePoint»", "o": [["A", "un vínculo para personas de la organización, que da acceso a externos mientras no se reenvíe.", "Ese vínculo solo funciona para personas de la organización; no sirve para invitados externos.", false], ["B", "un vínculo para cualquier persona que lo tenga, porque la contratista no pertenece a la organización.", "Los vínculos «Cualquiera» no exigen autenticación, se pueden reenviar y su acceso no se puede auditar; Microsoft recomienda evitarlos salvo necesidad.", false], ["C", "un vínculo para personas específicas, con permiso de solo lectura, dirigido al correo de la contratista.", "El vínculo de personas específicas (en OneDrive, «Personas específicas» o «Solo las personas que usted elija») solo funciona para quien se indica, exige que se autentique y no sirve si se reenvía a otra persona; sirve también con personas externas, si la política de uso compartido de la entidad lo permite.", true]]}, {"id": "OF-155", "niv": 2, "e": "Frente a la solicitud del compañero que sale a vacaciones, lo correcto es", "f": "Microsoft Support, «Permitir que otra persona administre su correo y calendario» (acceso de delegado en Outlook)", "o": [["A", "aceptar, si el jefe inmediato autoriza por correo el uso compartido de la contraseña.", "La autorización del jefe no vuelve personal una credencial ajena; las acciones seguirían quedando registradas a nombre del compañero.", false], ["B", "no usar credenciales ajenas y pedir que tecnología le conceda acceso delegado al buzón.", "Las credenciales son personales e intransferibles: usarlas impide saber quién hizo cada acción. Outlook y Microsoft 365 permiten conceder acceso de delegado al buzón con permisos propios.", true], ["C", "aceptar, siempre que él cambie la contraseña cuando regrese.", "Cambiar después la contraseña no corrige que, mientras tanto, otra persona actúe con una identidad ajena sin trazabilidad.", false]]}]}, {"comp": "sistemas_gestion", "rol": "profesional", "tag": "Sistemas de gestión (MIPG, control interno y calidad) · Niveles profesional, asesor y ejecutivo · Responsabilidades frente al control interno", "texto": "Usted es asesor de la oficina de control interno de una entidad pública del orden nacional. El secretario general le pide que, para «agilizar», la oficina firme el visto bueno de cada orden de pago antes de que la tesorería la gire. Ese mismo mes, el jefe de la oficina de contratación sostiene que la calidad de los controles de su proceso es responsabilidad de control interno y no suya. Y el director pregunta a quién corresponde establecer y desarrollar el sistema de control interno.", "items": [{"id": "SG-113", "niv": 3, "e": "Frente a la solicitud del secretario general, usted debe responder que", "f": "Ley 87 de 1993, art. 12 y parágrafo", "o": [["A", "no es procedente, porque el auditor interno no puede autorizar ni refrendar trámites administrativos.", "El parágrafo del artículo 12 de la Ley 87 de 1993 prohíbe al asesor, coordinador o auditor interno participar en los procedimientos administrativos mediante autorizaciones o refrendaciones, lo que preserva su independencia.", true], ["B", "es procedente, porque verificar los procesos de manejo de recursos es una de las funciones de la oficina.", "La función de verificar los procesos de manejo de recursos (art. 12, lit. g) se ejerce como evaluación, no mediante la firma de cada operación.", false], ["C", "es procedente si el comité de coordinación de control interno lo incluye en el plan anual de auditoría.", "Ninguna aprobación interna levanta la prohibición legal del parágrafo del artículo 12.", false]]}, {"id": "SG-114", "niv": 2, "e": "Frente a lo que sostiene el jefe de contratación, lo correcto es que", "f": "Ley 87 de 1993, arts. 3, lit. c, y 6", "o": [["A", "la oficina de control interno responde por los controles de todos los procesos, porque es la encargada de diseñarlos.", "La oficina de control interno evalúa en forma independiente; el diseño y la aplicación de los controles corresponden a la dirección y a los responsables de cada área.", false], ["B", "los jefes de cada dependencia también responden por la aplicación, calidad y eficacia de los controles.", "El artículo 6 de la Ley 87 de 1993 lo dispone expresamente, y el artículo 3, literal c), hace a cada jefe de área responsable del control interno ante su jefe inmediato.", true], ["C", "esa responsabilidad es de la oficina de planeación, como instancia que consolida el mapa de riesgos.", "Consolidar riesgos o asesorar no traslada la responsabilidad legal que el artículo 6 asigna a los jefes de dependencia.", false]]}, {"id": "SG-115", "niv": 1, "e": "Al director debe respondérsele que establecer y desarrollar el sistema de control interno es responsabilidad de", "f": "Ley 87 de 1993, arts. 3, lit. b, y 6", "o": [["A", "el representante legal o máximo directivo de la entidad.", "El artículo 6 de la Ley 87 de 1993 asigna esa responsabilidad al representante legal o máximo directivo, y el artículo 3, literal b), a la máxima autoridad.", true], ["B", "el Departamento Administrativo de la Función Pública, como líder de la política.", "La Función Pública fija lineamientos y metodologías, pero la responsabilidad del sistema en cada entidad es de su máximo directivo.", false], ["C", "el jefe de la oficina de control interno de la entidad.", "El jefe de control interno evalúa el sistema en forma independiente y recomienda mejoras; no es el responsable de establecerlo.", false]]}]}, {"comp": "sistemas_gestion", "rol": "general", "tag": "Sistemas de gestión (MIPG, control interno y calidad) · Riesgos para la integridad pública", "texto": "Usted es auxiliar administrativo de la Oficina de Planeación de una entidad del orden departamental y apoya la identificación de riesgos para la integridad pública con base en la guía de riesgos de la Función Pública. En las mesas de trabajo surgen tres situaciones posibles: un supervisor de contratos participa en la evaluación de una propuesta presentada por la empresa de su hermano; un funcionario de ventanilla recibe dinero de un ciudadano para adelantarle el turno de un trámite; y un servidor de almacén registra en el inventario bienes que nunca ingresaron, con el fin de quedarse con el dinero de la compra.", "items": [{"id": "SG-131", "niv": 1, "e": "La situación del supervisor de contratos corresponde a la tipología de", "f": "Función Pública, Guía para la Gestión Integral del Riesgo en Entidades Públicas, versión 7 (2025), tipologías de riesgos para la integridad pública; Ley 1952 de 2019 (conflicto de intereses)", "o": [["A", "soborno.", "No hay oferta ni aceptación de una ventaja para que el servidor actúe; hay un interés particular de un pariente en el asunto que decide.", false], ["B", "fraude interno.", "El fraude interno se refiere a errores, omisiones o informes inexactos hechos con culpa o dolo para beneficio propio o de terceros; aquí lo central es el interés del pariente.", false], ["C", "inadecuada gestión del conflicto de intereses.", "La guía lo describe como decidir en un asunto en el que el servidor, o un pariente dentro de los grados que señala la ley, tiene un interés particular y directo; un hermano está en segundo grado de consanguinidad.", true]]}, {"id": "SG-132", "niv": 1, "e": "La situación del funcionario de ventanilla corresponde a la tipología de", "f": "Función Pública, Guía para la Gestión Integral del Riesgo en Entidades Públicas, versión 7 (2025), tipologías de riesgos para la integridad pública (soborno)", "o": [["A", "fraude interno.", "No se trata de registros o informes falseados por el servidor, sino de recibir un pago para favorecer a un ciudadano.", false], ["B", "inadecuada gestión del conflicto de intereses.", "No hay un interés particular previo del servidor en el trámite; hay una ventaja indebida aceptada a cambio de una actuación.", false], ["C", "soborno.", "La guía entiende el soborno como ofrecer, prometer, dar, aceptar o solicitar una ventaja indebida para que una persona actúe o se abstenga de actuar; el funcionario acepta dinero para alterar el turno.", true]]}, {"id": "SG-133", "niv": 2, "e": "La situación del servidor de almacén corresponde a la tipología de", "f": "Función Pública, Guía para la Gestión Integral del Riesgo en Entidades Públicas, versión 7 (2025), tipologías de riesgos para la integridad pública (fraude interno)", "o": [["A", "fraude interno.", "La guía describe el fraude interno como errores, omisiones, informes inexactos o descripciones incorrectas hechos con culpa o dolo para beneficio personal o de terceros, como registrar bienes que no ingresaron.", true], ["B", "soborno.", "No interviene un tercero que ofrezca una ventaja; el servidor falsea registros en su propio beneficio.", false], ["C", "inadecuada gestión del conflicto de intereses.", "No se trata de decidir un asunto en el que tenga interés particular, sino de alterar registros para apropiarse de recursos.", false]]}]}, {"comp": "sistemas_gestion", "rol": "general", "tag": "Sistemas de gestión (MIPG, control interno y calidad) · Nociones del SG-SST", "texto": "En una procuraduría provincial, un servidor nota que un cable eléctrico suelto atraviesa el pasillo del archivo. En la misma semana, durante una reunión, un compañero afirma que, si la entidad contrata con una empresa especializada la ejecución de actividades de seguridad y salud en el trabajo, la responsabilidad del sistema pasa a esa empresa. Otro pregunta en qué consiste el Sistema de Gestión de la Seguridad y Salud en el Trabajo (SG-SST).", "items": [{"id": "SG-146", "niv": 1, "e": "Frente al cable suelto, el servidor debe", "f": "Decreto 1072 de 2015, art. 2.2.4.6.10", "o": [["A", "esperar la inspección del comité paritario, que es el único facultado para reportar peligros.", "El reporte de peligros no es exclusivo del comité paritario; todos los trabajadores deben informarlos oportunamente.", false], ["B", "informar oportunamente el peligro al empleador.", "El artículo 2.2.4.6.10 del Decreto 1072 de 2015 incluye entre las responsabilidades de los trabajadores informar oportunamente al empleador sobre los peligros y riesgos latentes en su sitio de trabajo.", true], ["C", "retirar el cable por su cuenta, sin reportarlo, para no generar trámites.", "Manipular la instalación sin reportar puede generar nuevos riesgos y deja al empleador sin información para corregir la condición insegura.", false]]}, {"id": "SG-147", "niv": 3, "e": "Sobre lo que afirma el compañero, lo correcto es que", "f": "Decreto 1072 de 2015, arts. 2.2.4.6.4 y 2.2.4.6.42 (texto corregido por el Decreto 1528 de 2015, art. 2)", "o": [["A", "contratar esos servicios no traslada al contratista las responsabilidades del empleador.", "El artículo 2.2.4.6.42 del Decreto 1072 de 2015 dispone que esa contratación no implica el traslado de las responsabilidades del empleador al contratista.", true], ["B", "con el contrato, la empresa especializada asume la responsabilidad legal del sistema ante los trabajadores.", "El decreto dispone lo contrario: contratar los servicios no traslada las responsabilidades del empleador.", false], ["C", "la responsabilidad pasa a la administradora de riesgos laborales, que asesora a la entidad.", "La ARL brinda asesoría y asistencia técnica, pero el SG-SST debe ser liderado e implementado por el empleador.", false]]}, {"id": "SG-148", "niv": 2, "e": "Según el Decreto 1072 de 2015, el SG-SST es un proceso por etapas", "f": "Decreto 1072 de 2015, art. 2.2.4.6.4", "o": [["A", "que se actualiza solo cuando ocurre un accidente de trabajo en la entidad.", "El sistema se basa en la mejora continua y en la prevención, no solo en la reacción ante accidentes.", false], ["B", "a cargo exclusivo de la ARL, que lo diseña e implementa en cada empresa afiliada.", "El SG-SST lo lidera e implementa el empleador; la ARL asesora.", false], ["C", "liderado por el empleador, con participación de los trabajadores y ciclo PHVA.", "El artículo 2.2.4.6.4 lo define como un proceso lógico y por etapas basado en la mejora continua, liderado e implementado por el empleador con participación de los trabajadores, con principios del ciclo PHVA.", true]]}]}, {"comp": "sistemas_gestion", "rol": "general", "tag": "Sistemas de gestión (MIPG, control interno y calidad) · Articulación del Sistema de Gestión y MECI", "texto": "Usted es profesional universitario de la Oficina de Planeación de la Procuraduría y participa en una mesa de estudio sobre la articulación de los sistemas de gestión en el sector público. Para preparar su intervención, revisa el Decreto 1083 de 2015, modificado por el Decreto 1499 de 2017, y el Manual Operativo del MIPG de la Función Pública.", "items": [{"id": "SG-152", "niv": 2, "e": "Según el decreto, dentro del MIPG el control interno", "f": "Decreto 1083 de 2015, art. 2.2.23.1", "o": [["A", "es una política independiente que se activa cuando la oficina de control interno inicia una auditoría.", "El control interno es permanente y transversal; no depende de que se inicie una auditoría.", false], ["B", "atraviesa toda la gestión de la entidad y se pone en marcha mediante el MECI.", "El artículo 2.2.23.1 dispone que el control interno es transversal a la gestión y desempeño de las entidades y se implementa a través del Modelo Estándar de Control Interno (MECI).", true], ["C", "reemplaza al Sistema de Gestión en las entidades obligadas por la Ley 87 de 1993.", "El decreto articula el Sistema de Control Interno con el Sistema de Gestión; no lo sustituye.", false]]}, {"id": "SG-153", "niv": 2, "e": "El decreto dispone que el Sistema de Gestión se complementa y articula, entre otros, con", "f": "Decreto 1083 de 2015, art. 2.2.22.1.5", "o": [["A", "el sistema de responsabilidad fiscal que adelantan la Contraloría General y las territoriales.", "El artículo 2.2.22.1.5 no menciona la responsabilidad fiscal entre los sistemas con los que se articula.", false], ["B", "los sistemas de seguridad y salud en el trabajo, gestión ambiental y seguridad de la información.", "El artículo 2.2.22.1.5 menciona los sistemas nacional de servicio al ciudadano, de gestión de la seguridad y salud en el trabajo, de gestión ambiental y de seguridad de la información.", true], ["C", "el régimen disciplinario que aplican las oficinas de control interno disciplinario de cada entidad.", "El régimen disciplinario no figura entre los sistemas con los que el decreto articula el Sistema de Gestión.", false]]}, {"id": "SG-154", "niv": 3, "e": "El Sistema de Gestión creado por el artículo 133 de la Ley 1753 de 2015 integró en uno solo", "f": "Decreto 1083 de 2015, arts. 2.2.22.1.1 y 2.2.23.2; Ley 1753 de 2015, art. 133", "o": [["A", "los sistemas de Desarrollo Administrativo y de Gestión de la Calidad, articulados con el de Control Interno.", "El artículo 2.2.22.1.1 y los considerandos del Decreto 1499 de 2017 señalan que el Sistema de Gestión integra los sistemas de Desarrollo Administrativo y de Gestión de la Calidad, y que se articula con el Sistema de Control Interno.", true], ["B", "los sistemas de Control Interno y de Gestión de la Calidad, y reemplazó la Ley 87 de 1993.", "La Ley 87 de 1993 sigue vigente; el Sistema de Control Interno no se integró, sino que se articula con el Sistema de Gestión.", false], ["C", "los sistemas de Desarrollo Administrativo y de Control Interno, y suprimió el MECI.", "El MECI no se suprimió: se actualiza a través del Manual Operativo del MIPG (art. 2.2.23.2).", false]]}, {"id": "SG-155", "niv": 2, "e": "En el MECI, el componente que busca asegurar las condiciones mínimas para el ejercicio del control interno, con el compromiso de la alta dirección y del comité de coordinación de control interno, es", "f": "Función Pública, Manual Operativo del MIPG, versión 7 (2026), política de control interno (componentes del MECI)", "o": [["A", "la evaluación del riesgo.", "Ese componente se ocupa de identificar y valorar los riesgos, no de las condiciones básicas de compromiso y liderazgo.", false], ["B", "las actividades de monitoreo.", "Ese componente se refiere a la supervisión continua y a las evaluaciones periódicas (autoevaluación y auditorías).", false], ["C", "el ambiente de control.", "El Manual Operativo del MIPG indica que la entidad debe asegurar un ambiente de control que le permita disponer de las condiciones mínimas para el ejercicio del control interno, con el liderazgo de la alta dirección y del comité.", true]]}]}, {"comp": "disciplinario", "rol": "general", "tag": "Código General Disciplinario · Ilicitud sustancial, culpabilidad y presunción de inocencia", "texto": "Usted es profesional de la oficina de control disciplinario interno de una alcaldía distrital. Un jefe de dependencia le remite tres informes. En el primero, una auxiliar archivó un oficio en la carpeta equivocada, lo advirtió ella misma una hora después y lo corrigió, sin que se retrasara ningún trámite ni resultara afectado nadie. En el segundo, se perdió un computador portátil del almacén y el jefe pide sancionar a la coordinadora únicamente porque es la responsable del área, aunque no se sabe quién retiró el equipo. En el tercero, que ya está en investigación, las pruebas sobre quién alteró la fecha de un acta son contradictorias y, practicadas todas las pruebas posibles, no se ha podido establecer si fue el técnico investigado u otra persona.", "items": [{"id": "DI-104", "niv": 2, "e": "Para establecer si la conducta de la auxiliar del primer informe es disciplinariamente ilícita, debe tenerse en cuenta que", "f": "Ley 1952 de 2019, art. 9 (modificado por la Ley 2094 de 2021, art. 2)", "o": [["A", "solo lo es si con ella causó un daño patrimonial cuantificable a la entidad.", "El código no exige daño patrimonial para que haya falta; el criterio es la afectación sustancial del deber funcional (art. 9). El perjuicio causado solo es uno de los criterios de gravedad del artículo 47.", false], ["B", "basta con que se haya apartado del procedimiento interno, aunque luego lo corrigiera.", "La sola infracción formal no basta. La Ley 2094 de 2021 definió la ilicitud sustancial como la afectación sustancial del deber funcional sin justificación (art. 9 de la Ley 1952 de 2019).", false], ["C", "solo lo es si compromete sustancialmente su deber funcional, sin justificación.", "El artículo 9 de la Ley 1952 de 2019, modificado por el artículo 2 de la Ley 2094 de 2021, dispone que la conducta del disciplinable es ilícita cuando afecta sustancialmente el deber funcional sin justificación alguna.", true]]}, {"id": "DI-105", "niv": 3, "e": "Si el jefe inmediato considera que el hecho del primer informe contrarió en menor grado el orden administrativo de la dependencia, sin afectar sustancialmente los deberes funcionales, debe", "f": "Ley 1952 de 2019, art. 68", "o": [["A", "tomar los correctivos del caso sin trámite procesal formal, los cuales no quedan como antecedente disciplinario.", "Por la preservación del orden interno, ante hechos que contrarían en menor grado el orden administrativo sin afectar sustancialmente los deberes funcionales, el jefe inmediato adopta las medidas correctivas pertinentes sin formalismo procesal, y estas no generan antecedente disciplinario (Ley 1952 de 2019, art. 68).", true], ["B", "abrir indagación previa, porque toda irregularidad debe tramitarse por el procedimiento disciplinario.", "El artículo 68 prevé un tratamiento sin formalismo procesal para estos hechos menores, y la indagación previa procede solo ante duda sobre la identificación del autor (art. 208); aquí la autora está identificada.", false], ["C", "imponer directamente una amonestación escrita y ordenar su anotación en la hoja de vida.", "La amonestación escrita es una sanción disciplinaria que solo se impone mediante fallo, al cabo del proceso (arts. 48 y 49). Las medidas del artículo 68 no son sanciones ni generan antecedente.", false]]}, {"id": "DI-106", "niv": 1, "e": "La solicitud de sancionar a la coordinadora por la pérdida del portátil, solo por ser la responsable del área, es improcedente porque", "f": "Ley 1952 de 2019, art. 10", "o": [["A", "los coordinadores de área no son destinatarios de la ley disciplinaria.", "Todos los servidores públicos son destinatarios de la ley disciplinaria, aun retirados del servicio (art. 25 de la Ley 1952 de 2019).", false], ["B", "en materia disciplinaria está proscrita la responsabilidad objetiva y se exige dolo o culpa.", "Solo puede sancionarse por conductas realizadas con culpabilidad, a título de dolo o culpa; queda proscrita toda forma de responsabilidad objetiva (Ley 1952 de 2019, art. 10). Ser jefe del área no prueba por sí solo la culpabilidad.", true], ["C", "la pérdida de bienes del Estado solo genera responsabilidad fiscal, nunca disciplinaria, para quien los tiene a cargo.", "La pérdida o daño de bienes del Estado puede constituir falta disciplinaria (por ejemplo, art. 62, num. 1, de la Ley 1952 de 2019); lo que impide sancionar aquí es la ausencia de prueba de culpabilidad.", false]]}, {"id": "DI-107", "niv": 2, "e": "En el expediente del acta alterada, agotada la práctica de pruebas, lo procedente es", "f": "Ley 1952 de 2019, arts. 14, 147 y 160", "o": [["A", "mantener abierta la actuación hasta que el técnico demuestre que no fue él quien alteró el acta.", "Invierte la carga de la prueba, que corresponde al Estado (art. 147 de la Ley 1952 de 2019), y desconoce la presunción de inocencia (art. 14).", false], ["B", "resolver la duda razonable a favor del técnico, porque para sancionar se requiere certeza sobre la falta y la responsabilidad.", "El disciplinable se presume inocente y toda duda razonable se resuelve a su favor (art. 14 de la Ley 1952 de 2019), y no puede proferirse fallo sancionatorio sin prueba que conduzca a la certeza sobre la falta y la responsabilidad (art. 160).", true], ["C", "sancionar al técnico a título de culpa, porque la duda solo permite descartar el dolo.", "La duda recae sobre la autoría misma, no sobre la modalidad de la culpabilidad. Sin certeza sobre la falta y la responsabilidad no puede proferirse fallo sancionatorio (arts. 14 y 160).", false]]}]}, {"comp": "disciplinario", "rol": "profesional", "tag": "Código General Disciplinario · Niveles profesional, asesor y ejecutivo · Clasificación de las faltas y criterios de gravedad", "texto": "Usted es profesional especializado de una procuraduría regional de instrucción y proyecta la evaluación de dos investigaciones. En la primera, un profesional de contratación de un departamento participó en la etapa precontractual desconociendo los principios de la contratación estatal, conducta que se adecua objetivamente a una de las faltas gravísimas descritas en el código; sin embargo, las pruebas solo demuestran que actuó con culpa grave. En la segunda, un auxiliar incumplió uno de los deberes del servidor público y su abogado sostiene que, como esa conducta no aparece en la lista de faltas gravísimas ni en ninguna lista de faltas graves o leves, no puede calificarse ni sancionarse.", "items": [{"id": "DI-115", "niv": 1, "e": "Frente al argumento del abogado del auxiliar, lo correcto es responder que", "f": "Ley 1952 de 2019, arts. 47 (modificado por la Ley 2094 de 2021, art. 8) y 67", "o": [["A", "solo son sancionables las conductas que el código enumera una a una como faltas gravísimas, graves o leves.", "El código no enumera faltas graves ni leves; el artículo 67 de la Ley 1952 de 2019 las define de forma general por incumplimiento de deberes, abuso de derechos, extralimitación o incursión en prohibiciones.", false], ["B", "la calificación como grave o leve la define el manual de funciones de cada entidad.", "La calificación la hace la autoridad disciplinaria con los criterios legales del artículo 47 de la Ley 1952 de 2019, no el manual de funciones.", false], ["C", "solo la ley define cuáles faltas son gravísimas; las demás infracciones de deberes se califican como graves o leves según criterios legales.", "Las faltas gravísimas están taxativamente señaladas en la ley y la gravedad o levedad de las demás se determina con los criterios del artículo 47; constituye falta grave o leve el incumplimiento de deberes, salvo que esté prevista como gravísima (Ley 1952 de 2019, arts. 47 y 67).", true]]}, {"id": "DI-116", "niv": 3, "e": "La conducta del profesional de contratación debe calificarse como", "f": "Ley 1952 de 2019, art. 47, num. 9 (modificado por la Ley 2094 de 2021, art. 8)", "o": [["A", "falta grave, porque la realización de una falta objetivamente gravísima con culpa grave se considera grave.", "Según el artículo 47, numeral 9, de la Ley 1952 de 2019 (modificado por la Ley 2094 de 2021), la realización típica de una falta objetivamente gravísima cometida con culpa grave será considerada falta grave.", true], ["B", "falta leve, porque la culpa grave impide calificar una falta como gravísima o grave.", "La culpa grave es sancionable (art. 29), y la ley ordena calificar como grave, no como leve, la falta objetivamente gravísima cometida con culpa grave (art. 47, num. 9).", false], ["C", "falta gravísima, porque la descripción típica no cambia según la forma de culpabilidad.", "El numeral 9 del artículo 47 de la Ley 1952 de 2019 dispone expresamente que la realización típica de una falta objetivamente gravísima con culpa grave se considera falta grave.", false]]}, {"id": "DI-117", "niv": 2, "e": "Si la conducta del profesional de contratación se juzga finalmente como falta grave culposa, la sanción aplicable es", "f": "Ley 1952 de 2019, art. 48 (modificado por la Ley 2094 de 2021, art. 9)", "o": [["A", "suspensión en el ejercicio del cargo de uno a doce meses.", "Para las faltas graves culposas la sanción es suspensión en el ejercicio del cargo de uno a doce meses, sin inhabilidad especial (Ley 1952 de 2019, art. 48, num. 4, modificado por la Ley 2094 de 2021). Nótese que el art. 47, num. 9, solo dice que la falta se considera grave; el carácter culposo proviene de la forma de culpabilidad probada (culpa grave).", true], ["B", "suspensión en el ejercicio del cargo de tres a dieciocho meses e inhabilidad especial por el mismo término.", "Esa sanción corresponde a las faltas graves dolosas (art. 48, num. 3, de la Ley 1952 de 2019).", false], ["C", "destitución e inhabilidad general de ocho a diez años.", "Esa sanción corresponde a las faltas gravísimas cometidas con culpa gravísima (art. 48, num. 2, de la Ley 1952 de 2019).", false]]}]}, {"comp": "disciplinario", "rol": "general", "tag": "Código General Disciplinario · Extinción de la acción y de la sanción", "texto": "Usted es profesional universitario de la oficina de control disciplinario interno de un instituto descentralizado del orden departamental. Revisa tres situaciones. En la primera, a un servidor se le impuso suspensión mediante fallo que quedó ejecutoriado en abril de 2024, pero la entidad nunca ejecutó la sanción. En la segunda, la quejosa de una investigación en curso presentó un escrito en el que desiste de su queja y pide archivar el proceso. En la tercera, un disciplinado presentó personalmente un escrito en el que renuncia a la prescripción de la acción disciplinaria, porque quiere obtener un fallo que lo absuelva.", "items": [{"id": "DI-127", "niv": 2, "e": "La sanción impuesta en el fallo ejecutoriado en abril de 2024 prescribe en un término de", "f": "Ley 1952 de 2019, arts. 33 y 36", "o": [["A", "tres años, contados a partir de la ejecutoria del fallo.", "El término legal de prescripción de la sanción es de cinco años, no de tres (art. 36 de la Ley 1952 de 2019).", false], ["B", "cinco años, contados a partir de la fecha en que se cometió la falta.", "Contar desde la comisión de la falta corresponde a la prescripción de la acción (art. 33); la de la sanción se cuenta desde la ejecutoria del fallo (art. 36).", false], ["C", "cinco años, contados a partir de la ejecutoria del fallo.", "La sanción disciplinaria prescribe en un término de cinco años contados a partir de la ejecutoria del fallo (Ley 1952 de 2019, art. 36).", true]]}, {"id": "DI-128", "niv": 1, "e": "Frente al escrito de desistimiento de la quejosa, debe tenerse en cuenta que", "f": "Ley 1952 de 2019, arts. 32 (modificado por la Ley 2094 de 2021, art. 6), 85 y 86", "o": [["A", "el desistimiento extingue la acción solo si se presenta antes de la formulación del pliego de cargos.", "La ley no prevé esa regla: el desistimiento del quejoso no extingue la acción en ninguna etapa (art. 32, parágrafo, de la Ley 1952 de 2019).", false], ["B", "el desistimiento del quejoso no extingue la acción disciplinaria.", "Las causales de extinción de la acción son la muerte del disciplinable, la caducidad y la prescripción, y el parágrafo del artículo 32 de la Ley 1952 de 2019 (modificado por la Ley 2094 de 2021) dispone que el desistimiento del quejoso no extingue la acción.", true], ["C", "el desistimiento obliga a archivar, porque la acción depende del impulso de quien presentó la queja.", "La acción disciplinaria es pública y se adelanta de oficio (arts. 85 y 86 de la Ley 1952 de 2019); no depende del quejoso.", false]]}, {"id": "DI-129", "niv": 2, "e": "Como consecuencia de la renuncia a la prescripción, la acción disciplinaria", "f": "Ley 1952 de 2019, art. 34", "o": [["A", "puede proseguirse por cinco años más, contados desde la notificación del pliego de cargos al disciplinado.", "El término es de dos años y se cuenta desde la presentación personal de la solicitud de renuncia, no desde el pliego de cargos (art. 34 de la Ley 1952 de 2019).", false], ["B", "solo puede proseguirse por un máximo de dos años, contados desde la presentación personal de la solicitud.", "Si el disciplinable renuncia a la prescripción, la acción solo puede proseguirse por un término máximo de dos años contados desde la presentación personal de la solicitud; vencido sin fallo ejecutoriado, solo procede declarar la prescripción (Ley 1952 de 2019, art. 34).", true], ["C", "puede proseguirse sin límite de tiempo, porque el disciplinado renunció a ese beneficio.", "La ley fija un límite: la acción solo puede proseguirse por un máximo de dos años desde la presentación personal de la solicitud (art. 34 de la Ley 1952 de 2019).", false]]}]}, {"comp": "disciplinario", "rol": "general", "tag": "Código General Disciplinario · Sujetos procesales y derechos del disciplinado", "texto": "Usted es profesional universitario de la oficina de control disciplinario interno de una superintendencia. Se adelantan dos procesos. En el primero, un ciudadano presentó queja porque un funcionario demoró injustificadamente su trámite; ahora pide que se le reconozca como sujeto procesal para solicitar pruebas y apelar cualquier decisión. En el segundo, una profesional presentó queja por hechos constitutivos de acoso laboral atribuidos a su jefe y pide intervenir por medio de apoderado. En este segundo proceso, el disciplinado solicita ser escuchado en versión libre cuando ya se surtió el traslado para presentar alegatos previos al fallo de primera instancia.", "items": [{"id": "DI-147", "niv": 3, "e": "Frente a la solicitud del ciudadano del primer proceso, debe explicársele que", "f": "Ley 1952 de 2019, arts. 109 y 110", "o": [["A", "puede solicitar pruebas y apelar cualquier decisión del proceso, siempre que actúe por medio de un abogado inscrito.", "Actuar con abogado no le otorga la calidad de sujeto procesal; sus facultades son limitadas (art. 110, parágrafo 1, de la Ley 1952 de 2019).", false], ["B", "es sujeto procesal con las mismas facultades del investigado, por haber sido quien dio origen a la actuación disciplinaria.", "El quejoso no es sujeto procesal, salvo las víctimas de violaciones de derechos humanos, DIH y acoso laboral (arts. 109 y 110, parágrafo 1, de la Ley 1952 de 2019).", false], ["C", "no tiene la calidad de sujeto procesal; puede ampliar su queja, allegar pruebas e impugnar el archivo o la absolución.", "La intervención del quejoso, que no es sujeto procesal, se limita a presentar y ampliar la queja bajo juramento, aportar las pruebas que tenga y recurrir la decisión de archivo y el fallo absolutorio (Ley 1952 de 2019, art. 110, parágrafo 1).", true]]}, {"id": "DI-148", "niv": 3, "e": "Respecto de la profesional que denunció el acoso laboral, lo procedente es", "f": "Ley 1952 de 2019, arts. 109 y 110", "o": [["A", "reconocerla como sujeto procesal, con la facultad de designar un apoderado que la represente.", "Tienen la condición de sujetos procesales las víctimas de conductas violatorias de derechos humanos, del DIH y de acoso laboral (art. 109), y pueden designar apoderado (Ley 1952 de 2019, art. 110, parágrafo 2).", true], ["B", "tratarla solo como quejosa, porque la calidad de sujeto procesal se reserva al investigado y a su defensor.", "El artículo 109 de la Ley 1952 de 2019 extiende la calidad de sujeto procesal a las víctimas de acoso laboral.", false], ["C", "remitir su queja al comité de convivencia laboral, porque el acoso laboral no es materia disciplinaria.", "El acoso laboral sí es materia disciplinaria y el código regula expresamente la intervención de sus víctimas (arts. 109 y 110 de la Ley 1952 de 2019).", false]]}, {"id": "DI-149", "niv": 2, "e": "Sobre la solicitud del disciplinado del segundo proceso de rendir versión libre, debe tenerse en cuenta que", "f": "Ley 1952 de 2019, art. 112", "o": [["A", "solo procedía durante la indagación previa, antes de que se abriera la investigación.", "La versión libre procede en cualquier etapa, no solo en la indagación previa, siempre que sea antes del traslado para alegatos previos al fallo (art. 112, num. 3).", false], ["B", "es extemporánea, pues la versión libre solo puede rendirse antes de que se corra el traslado para alegar previo al fallo.", "El disciplinado tiene derecho a ser oído en versión libre en cualquier etapa, hasta antes del traslado para presentar alegatos previos al fallo de primera o única instancia (Ley 1952 de 2019, art. 112, num. 3).", true], ["C", "procede en cualquier momento, incluso después de proferido el fallo de primera instancia.", "La ley fija un límite temporal: hasta antes del traslado para alegatos previos al fallo (art. 112, num. 3, de la Ley 1952 de 2019).", false]]}]}, {"comp": "disciplinario", "rol": "general", "tag": "Código General Disciplinario · Juicio verbal: audiencia, notificación y apelación", "texto": "Usted es profesional universitario de una procuraduría distrital de juzgamiento. El funcionario de conocimiento decidió adelantar por juicio verbal un proceso contra un auxiliar de una alcaldía local y le pide proyectar el auto de citación a la audiencia de descargos y pruebas. Ya en la audiencia, se negó una prueba pedida por la defensa. Semanas después, en la sesión fijada para dar a conocer la decisión, se leyó el fallo sancionatorio con el disciplinado y su defensor presentes.", "items": [{"id": "DI-168", "niv": 2, "e": "La audiencia de descargos y pruebas debe realizarse", "f": "Ley 1952 de 2019, art. 225H (adicionado por la Ley 2094 de 2021, art. 47)", "o": [["A", "entre diez y veinte días después de la fecha del auto que la convoca.", "En el auto en que decide adelantar el juicio verbal, el funcionario fija fecha y hora para la audiencia de descargos y pruebas, que se realizará en un término no menor de diez ni mayor de veinte días de la fecha del auto de citación (Ley 1952 de 2019, art. 225H).", true], ["B", "dentro de los cinco días siguientes a la notificación personal del pliego de cargos al disciplinado.", "El término se cuenta desde el auto de citación y es de diez a veinte días (art. 225H). Cinco días es el plazo de comparecencia para notificar el pliego (art. 225).", false], ["C", "en un término no menor de quince ni mayor de treinta días desde la ejecutoria del auto de citación.", "El artículo 225H fija entre diez y veinte días desde la fecha del auto; además, contra ese auto no procede recurso.", false]]}, {"id": "DI-169", "niv": 1, "e": "La decisión que negó la prueba en la audiencia se entiende notificada", "f": "Ley 1952 de 2019, arts. 126 y 227", "o": [["A", "por estado electrónico, al día siguiente de terminada la sesión de la audiencia.", "El estado es para decisiones que no se profieren en audiencia; las proferidas en audiencia se notifican en estrados (art. 126 de la Ley 1952 de 2019).", false], ["B", "personalmente, cuando el defensor firme el acta de la sesión de la audiencia.", "La firma del acta (art. 226) no es la forma de notificación; la notificación se surte en estrados en el momento del pronunciamiento (arts. 126 y 227).", false], ["C", "en estrados, a todos los sujetos procesales, estén o no presentes.", "Las decisiones proferidas en audiencia se consideran notificadas a todos los sujetos procesales inmediatamente se hace el pronunciamiento, se encuentren o no presentes (Ley 1952 de 2019, art. 126); el artículo 227 lo reitera para la negación de pruebas.", true]]}, {"id": "DI-170", "niv": 3, "e": "Si el disciplinado quiere apelar el fallo leído en la audiencia, debe", "f": "Ley 1952 de 2019, arts. 131, 232 y 233", "o": [["A", "interponer el recurso en la misma audiencia.", "En el juicio verbal, el artículo 233 de la Ley 1952 de 2019 dispone que contra el fallo de primera instancia procede apelación, que deberá interponerse en la misma diligencia (con sustentación verbal inmediata o por escrito dentro de los cinco días siguientes). En el mismo sentido, el artículo 131 exige interponer en la audiencia los recursos contra decisiones notificadas en estrados.", true], ["B", "interponerlo y sustentarlo por escrito ante la secretaría, dentro de los diez días siguientes.", "Ese es el trámite del artículo 225G de la Ley 1952 de 2019, exclusivo del fallo del juicio ordinario. En el juicio verbal el artículo 233 exige interponer la apelación en la misma diligencia en que se profiere el fallo.", false], ["C", "interponerlo dentro de los cinco días siguientes a la desfijación del edicto que notifique el fallo.", "El fallo del juicio verbal se notifica en estrados (arts. 126 y 232), no por edicto, y el recurso se interpone en la misma diligencia (art. 233).", false]]}]}, {"comp": "disciplinario", "rol": "profesional", "tag": "Código General Disciplinario · Niveles profesional, asesor y ejecutivo · Confesión y aceptación de cargos", "texto": "Usted es profesional de una procuraduría provincial. En una investigación por una falta grave dolosa, el servidor investigado, que no tiene abogado, se presenta en la etapa de investigación y manifiesta que quiere aceptar los cargos para obtener una rebaja. En otro proceso, por una falta grave dolosa que no está entre las del artículo 52 del código, el disciplinado aceptó los cargos en la etapa de juzgamiento, antes de la ejecutoria del auto que concede el traslado para alegar de conclusión y asistido por su defensor; el funcionario considera que, sin la aceptación, la sanción adecuada habría sido suspensión de doce meses e inhabilidad especial por el mismo término.", "items": [{"id": "DI-171", "niv": 1, "e": "Para que la aceptación de cargos del primer servidor sea válida, se requiere, entre otros requisitos, que", "f": "Ley 1952 de 2019, art. 161 (modificado por la Ley 2094 de 2021, art. 29)", "o": [["A", "cuente con el aval previo del quejoso o de la víctima de la conducta investigada.", "El artículo 161 no exige aval del quejoso ni de la víctima; la autoridad constata que la aceptación sea voluntaria, consciente, libre, espontánea e informada.", false], ["B", "esté asistido por defensor y se le informe de sus derechos y de los beneficios legales.", "La confesión o aceptación de cargos exige, entre otros requisitos, que la persona esté asistida por defensor y sea informada del derecho a no declarar contra sí misma, de las garantías del artículo 33 de la Constitución y de los beneficios y rebajas legales (Ley 1952 de 2019, art. 161, modificado por la Ley 2094 de 2021).", true], ["C", "la presente por escrito y la ratifique ante notario dentro de los tres días siguientes.", "La ley no exige escrito ni ratificación notarial; exige que se haga ante la autoridad competente, con defensor y con la información de derechos y beneficios (art. 161 de la Ley 1952 de 2019).", false]]}, {"id": "DI-172", "niv": 2, "e": "Si la aceptación en la etapa de investigación cumple los requisitos, la autoridad disciplinaria debe", "f": "Ley 1952 de 2019, arts. 12, 32 y 162 (modificado por la Ley 2094 de 2021, art. 30)", "o": [["A", "archivar la actuación, porque la aceptación de cargos extingue la acción disciplinaria.", "La aceptación de cargos no es causal de extinción (art. 32); da lugar a una rebaja de la sanción (art. 162).", false], ["B", "proferir de inmediato el fallo sancionatorio, porque la aceptación suprime la etapa de juzgamiento.", "El instructor no falla; el acta se remite al funcionario de juzgamiento para que profiera el fallo (art. 162 de la Ley 1952 de 2019), en garantía de la separación de funciones (art. 12).", false], ["C", "elaborar en diez días un acta que equivale al pliego de cargos y remitirla al funcionario de juzgamiento.", "Evaluada la manifestación, en el término improrrogable de diez días se elabora un acta con los términos de la aceptación, los hechos, su encuadramiento, calificación y culpabilidad, que equivale al pliego de cargos y se remite al funcionario de juzgamiento, quien falla en cuarenta y cinco días (Ley 1952 de 2019, art. 162).", true]]}, {"id": "DI-173", "niv": 3, "e": "En el segundo proceso, la suspensión e inhabilidad especial debe quedar en", "f": "Ley 1952 de 2019, art. 162 (modificado por la Ley 2094 de 2021, art. 30)", "o": [["A", "seis meses.", "La rebaja hasta la mitad aplica cuando la aceptación ocurre en la etapa de investigación, no en la de juzgamiento (art. 162 de la Ley 1952 de 2019).", false], ["B", "ocho meses.", "Si la aceptación de cargos se produce en la etapa de juzgamiento, las sanciones de inhabilidad, suspensión o multa se reducen en una tercera parte, rebaja fija; en la etapa de investigación la rebaja es «hasta la mitad» (Ley 1952 de 2019, art. 162). Doce meses menos un tercio (cuatro meses) da ocho meses.", true], ["C", "nueve meses.", "Corresponde a reducir una cuarta parte, porcentaje que no prevé la ley; en juzgamiento la reducción es de una tercera parte (art. 162).", false]]}]}, {"comp": "disciplinario", "rol": "general", "tag": "Código General Disciplinario · Doble conformidad y sentencia C-030 de 2023", "texto": "Usted es profesional universitario de la Procuraduría y prepara una charla de inducción sobre los cambios del régimen disciplinario. Le piden explicar tres puntos: qué garantiza la doble conformidad; cuál es la naturaleza de las funciones disciplinarias de la Procuraduría después de la sentencia C-030 de 2023 de la Corte Constitucional; y qué ocurre cuando la Procuraduría impone destitución e inhabilidad general a un alcalde que se encuentra en ejercicio del cargo.", "items": [{"id": "DI-190", "niv": 2, "e": "La doble conformidad garantiza que", "f": "Ley 1952 de 2019, art. 12 (modificado por la Ley 2094 de 2021, art. 3)", "o": [["A", "todo fallo sancionatorio pueda ser revisado por una autoridad diferente, con el trámite de la apelación.", "Todo disciplinable tiene derecho a que el fallo sancionatorio sea revisado por una autoridad diferente, con el trámite previsto para el recurso de apelación (Ley 1952 de 2019, art. 12, inciso 3, modificado por la Ley 2094 de 2021).", true], ["B", "las decisiones de archivo sean confirmadas por el superior antes de quedar en firme.", "El código no prevé que el superior confirme los archivos antes de su firmeza: contra el archivo procede apelación (art. 134 de la Ley 1952 de 2019), y la doble conformidad se refiere a los fallos sancionatorios (art. 12).", false], ["C", "el disciplinado sea investigado y luego juzgado por dos funcionarios distintos dentro del mismo despacho.", "Eso corresponde a la separación entre instrucción y juzgamiento (art. 12, incisos 1 y 2), que es una garantía distinta de la doble conformidad.", false]]}, {"id": "DI-191", "niv": 1, "e": "Según la sentencia C-030 de 2023, las funciones disciplinarias que ejerce la Procuraduría son de naturaleza", "f": "Corte Constitucional, Sentencia C-030 de 2023; Ley 1952 de 2019, art. 2", "o": [["A", "jurisdiccional, por atribución expresa de la Ley 2094 de 2021.", "La Corte declaró inexequibles las expresiones «jurisdiccionales» y «jurisdiccional» de los artículos 1, 54, 73 y 74 de la Ley 2094 de 2021 (Sentencia C-030 de 2023).", false], ["B", "mixta: jurisdiccional frente a elección popular y administrativa frente a los demás servidores.", "La Corte no adoptó un régimen mixto: la función es administrativa en todos los casos, y frente a elección popular exigió intervención del juez para la sanción definitiva (Sentencia C-030 de 2023).", false], ["C", "administrativa, no jurisdiccional.", "La sentencia C-030 de 2023 declaró inexequible la atribución de funciones jurisdiccionales y condicionó varias normas en el entendido de que las funciones disciplinarias de la Procuraduría son de naturaleza administrativa y no jurisdiccional.", true]]}, {"id": "DI-192", "niv": 3, "e": "Si la Procuraduría sanciona con destitución e inhabilidad general a un alcalde en ejercicio, esa sanción", "f": "Ley 1952 de 2019, arts. 2 y 238D; Corte Constitucional, Sentencia C-030 de 2023", "o": [["A", "solo puede ser revisada por un juez si el alcalde interpone una acción de tutela contra el fallo.", "La revisión judicial opera por ministerio de la ley, de manera automática, sin necesidad de tutela (Sentencia C-030 de 2023).", false], ["B", "se somete a revisión automática ante la jurisdicción contencioso administrativa y su ejecución se suspende mientras se decide.", "La C-030 de 2023 condicionó los arts. 1 y 54 de la Ley 2094 de 2021: la destitución, suspensión e inhabilidad de servidores de elección popular las determina definitivamente el juez contencioso administrativo, mediante el recurso extraordinario de revisión que opera de manera automática e inmediata (ante el Consejo de Estado o el tribunal administrativo, según la autoridad que sancionó, art. 238B), y la ejecución se suspende durante ese trámite (Ley 1952 de 2019, arts. 2 y 238D).", true], ["C", "se ejecuta de inmediato por el gobernador, una vez queda en firme en la Procuraduría.", "Para servidores de elección popular, la ejecución se supedita a lo que decida la autoridad judicial y se suspende durante la revisión (art. 2 de la Ley 1952 de 2019; art. 238D; Sentencia C-030 de 2023).", false]]}]}, {"comp": "contratacion", "rol": "general", "tag": "Contratación estatal · Modalidades de selección", "texto": "Usted es profesional de la Secretaría General de una alcaldía y revisa el Plan Anual de Adquisiciones. Hay tres necesidades: (i) comprar resmas de papel, tóner y útiles de oficina por un valor superior a la menor cuantía de la entidad; son bienes con las mismas especificaciones técnicas y patrones de calidad objetivamente definidos, y no existe un acuerdo marco de precios vigente para ellos; (ii) contratar los estudios y diseños para la ampliación de la plaza de mercado, por un valor superior a la mínima cuantía; y (iii) tomar en arriendo una bodega para el archivo central, porque el contrato de arrendamiento actual vence en tres meses y el propietario no lo renovará.", "items": [{"id": "CE-110", "niv": 1, "e": "Para adquirir el papel, el tóner y los útiles de oficina, la modalidad que corresponde es", "f": "Ley 1150 de 2007, art. 2, num. 2, lit. a)", "o": [["A", "la selección abreviada para la adquisición de bienes de características técnicas uniformes y de común utilización.", "El literal a) del numeral 2 del artículo 2 de la Ley 1150 prevé la selección abreviada para bienes y servicios de características técnicas uniformes y de común utilización, es decir, los que tienen las mismas especificaciones técnicas y comparten patrones de desempeño y calidad objetivamente definidos.", true], ["B", "la licitación pública, porque el valor de la compra supera la menor cuantía de la entidad y no hay acuerdo marco vigente.", "La causal de bienes de características técnicas uniformes no depende del valor; superar la menor cuantía no obliga a licitar cuando existe una causal de selección abreviada por el objeto (art. 2, num. 2, lit. a, Ley 1150).", false], ["C", "la mínima cuantía, porque se trata de bienes de consumo para el funcionamiento de la entidad.", "La mínima cuantía depende del valor (que no exceda el 10 % de la menor cuantía), no de que los bienes sean de consumo (art. 2, num. 5, Ley 1150); aquí el valor supera incluso la menor cuantía.", false]]}, {"id": "CE-111", "niv": 2, "e": "En el proceso para contratar los estudios y diseños de la plaza de mercado, la alcaldía", "f": "Ley 1150 de 2007, art. 2, num. 3 y art. 5, num. 4; Decreto 1082 de 2015, art. 2.2.1.2.1.3.1", "o": [["A", "puede acudir a la selección abreviada de menor cuantía y escoger la oferta de menor precio.", "La consultoría tiene una modalidad propia, el concurso de méritos, sin importar que su valor esté dentro de la menor cuantía (art. 2, num. 3, Ley 1150).", false], ["B", "debe acudir al concurso de méritos y darle al precio el mayor puntaje, en aplicación del principio de economía.", "En la selección de consultores se califican aspectos técnicos y la experiencia; la ley prohíbe usar el precio como factor de escogencia (art. 5, num. 4, Ley 1150).", false], ["C", "debe acudir al concurso de méritos y no puede incluir el precio como factor de escogencia.", "Los estudios y diseños son consultoría (art. 32, num. 2, Ley 80), que se contrata por concurso de méritos (art. 2, num. 3, Ley 1150; Decreto 1082 de 2015, art. 2.2.1.2.1.3.1). El numeral 4 del artículo 5 de la Ley 1150 prohíbe incluir el precio como factor de escogencia en la selección de consultores.", true]]}, {"id": "CE-112", "niv": 3, "e": "Para tomar en arriendo la bodega del archivo, la modalidad aplicable es", "f": "Ley 1150 de 2007, art. 2, num. 4, lit. i); Decreto 1082 de 2015, art. 2.2.1.2.1.4.11; Colombia Compra Eficiente, Manual de la modalidad de selección de mínima cuantía", "o": [["A", "la mínima cuantía, si el canon anual no supera el 10 % de la menor cuantía de la alcaldía.", "Cuando concurre una causal de contratación directa, como el arrendamiento de inmuebles, esta prevalece sobre la mínima cuantía, según el Manual de mínima cuantía de Colombia Compra Eficiente.", false], ["B", "la selección abreviada de menor cuantía, previa invitación a varios propietarios de bodegas.", "El arrendamiento de inmuebles tiene causal propia de contratación directa (art. 2, num. 4, lit. i, Ley 1150), de modo que no se acude a la selección abreviada por la cuantía.", false], ["C", "la contratación directa, por tratarse del arrendamiento de un inmueble.", "El literal i) del numeral 4 del artículo 2 de la Ley 1150 incluye el arrendamiento o adquisición de inmuebles entre las causales de contratación directa, desarrolladas en el artículo 2.2.1.2.1.4.11 del Decreto 1082 de 2015.", true]]}]}, {"comp": "contratacion", "rol": "profesional", "tag": "Contratación estatal · Niveles profesional, asesor y ejecutivo · Urgencia manifiesta y su control", "texto": "Tras una avalancha que destruyó el acueducto de varias veredas y las dejó sin agua, el alcalde de un municipio declaró la urgencia manifiesta mediante decreto motivado y, al día siguiente, celebró contratos de suministro de agua potable en carrotanques y de obras de emergencia. Usted es profesional de una procuraduría provincial y, en ejercicio de la función preventiva, revisa el expediente: no hay estudios previos y el único soporte de la contratación directa es el decreto que declaró la urgencia.", "items": [{"id": "CE-125", "niv": 3, "e": "Sobre la ausencia de estudios previos y de un acto de justificación separado, usted concluye que", "f": "Ley 80 de 1993, art. 42; Decreto 1082 de 2015, art. 2.2.1.2.1.4.2", "o": [["A", "no es irregular, porque el acto de declaratoria sirve de justificación y en ese caso no se exigen estudios previos.", "El artículo 2.2.1.2.1.4.2 del Decreto 1082 de 2015 dispone que, cuando la causal de contratación directa es la urgencia manifiesta, el acto que la declara hace las veces del acto de justificación y la entidad no está obligada a elaborar estudios y documentos previos. El artículo 42 de la Ley 80 exige que la urgencia se declare por acto motivado, como ocurrió.", true], ["B", "es irregular, porque toda contratación directa exige un acto de justificación independiente del que declara la urgencia.", "En la urgencia manifiesta el propio acto de declaratoria sirve de justificación (Decreto 1082 de 2015, art. 2.2.1.2.1.4.2).", false], ["C", "es irregular, porque los estudios previos deben elaborarse antes de firmar cualquier contrato estatal, sin excepciones.", "Aunque la regla general exige estudios previos (art. 25, num. 12, Ley 80), el reglamento exime de ellos a la entidad cuando contrata por urgencia manifiesta (Decreto 1082, art. 2.2.1.2.1.4.2).", false]]}, {"id": "CE-126", "niv": 2, "e": "Celebrados los contratos, el alcalde debe remitirlos, junto con el acto de declaratoria y el expediente,", "f": "Ley 80 de 1993, arts. 25, num. 11 y 43", "o": [["A", "a la procuraduría provincial, para que los apruebe antes de que se inicie su ejecución.", "La ley asigna la revisión de la urgencia al organismo de control fiscal (art. 43, Ley 80); la Procuraduría no aprueba contratos ni interviene en su celebración (art. 25, num. 11, Ley 80).", false], ["B", "de inmediato al organismo que ejerce el control fiscal, que se pronunciará dentro de los dos meses siguientes.", "El artículo 43 de la Ley 80 ordena que, inmediatamente después de celebrados los contratos originados en la urgencia, estos y el acto que la declaró, con el expediente y las pruebas, se envíen al funcionario u organismo que ejerce el control fiscal, el cual debe pronunciarse dentro de los dos meses siguientes.", true], ["C", "al concejo municipal dentro del mes siguiente, para que ejerza control político sobre la declaratoria y los contratos.", "El artículo 43 de la Ley 80 no prevé el envío al concejo; el destinatario es el organismo de control fiscal de la entidad.", false]]}, {"id": "CE-127", "niv": 3, "e": "Si el organismo de control fiscal concluye que no existían los hechos que justificaban la urgencia, lo que dispone la ley es que", "f": "Ley 80 de 1993, art. 43", "o": [["A", "declare la nulidad absoluta de los contratos celebrados y ordene su liquidación inmediata en el estado en que se encuentren.", "El organismo de control fiscal no declara la nulidad de los contratos; su función, según el artículo 43 de la Ley 80, es pronunciarse sobre los hechos y promover las investigaciones y acciones ante las autoridades competentes.", false], ["B", "imponga directamente al alcalde la sanción de destitución por el uso indebido de la contratación directa.", "El organismo de control fiscal no impone sanciones disciplinarias; el artículo 43 de la Ley 80 le ordena solicitar la iniciación de la investigación disciplinaria a la autoridad competente.", false], ["C", "pida iniciar la investigación disciplinaria y dé traslado del asunto a las demás autoridades competentes.", "Según el artículo 43 de la Ley 80, si es procedente, el organismo de control fiscal solicita al jefe inmediato del servidor o a la autoridad competente la iniciación de la investigación disciplinaria y envía el asunto a los funcionarios competentes para las demás acciones; además, el uso indebido de la contratación de urgencia es causal de mala conducta.", true]]}]}, {"comp": "contratacion", "rol": "general", "tag": "Contratación estatal · Garantías y su suficiencia", "texto": "Una gobernación adjudicó por licitación pública un contrato de obra para construir un aula múltiple en un colegio departamental. El presupuesto oficial era de $2.000.000.000 y la oferta ganadora fue de $1.950.000.000, valor por el que se firmó el contrato, con un plazo de ejecución de diez meses. El contrato prevé un anticipo del 30 % de su valor. Usted es profesional de la oficina jurídica y debe revisar las garantías antes de aprobarlas. Ninguno de los valores del proceso supera un millón de SMMLV.", "items": [{"id": "CE-142", "niv": 2, "e": "La garantía de seriedad que debía acompañar la oferta ganadora tenía que ser, como mínimo, de", "f": "Decreto 1082 de 2015, art. 2.2.1.2.3.1.9", "o": [["A", "$97.500.000.", "Equivale al 5 % de la oferta; la norma exige al menos el 10 % del valor de la oferta (Decreto 1082 de 2015, art. 2.2.1.2.3.1.9).", false], ["B", "$195.000.000.", "El artículo 2.2.1.2.3.1.9 del Decreto 1082 de 2015 exige que la garantía de seriedad sea de por lo menos el 10 % del valor de la oferta y que esté vigente desde su presentación hasta la aprobación de la garantía de cumplimiento: 10 % de $1.950.000.000 = $195.000.000.", true], ["C", "$200.000.000.", "Es el 10 % del presupuesto oficial, base que el reglamento usa para la subasta inversa y el concurso de méritos, no para la licitación, en la que la base es el valor de la oferta (Decreto 1082, art. 2.2.1.2.3.1.9).", false]]}, {"id": "CE-143", "niv": 1, "e": "La garantía de estabilidad y calidad de la obra, salvo justificación técnica para un término menor, debe estar vigente", "f": "Decreto 1082 de 2015, arts. 2.2.1.2.3.1.12 a 2.2.1.2.3.1.14", "o": [["A", "por no menos de cinco años contados desde que la gobernación recibe la obra a satisfacción.", "El artículo 2.2.1.2.3.1.14 del Decreto 1082 de 2015, modificado por el Decreto 399 de 2021, exige una vigencia no inferior a cinco años desde el recibo a satisfacción; solo con justificación técnica de un experto puede ser menor, y en todo caso de mínimo un año.", true], ["B", "por el plazo del contrato y tres años más, contados desde la firma del contrato de obra.", "Esa vigencia es la del amparo de pago de salarios, prestaciones sociales e indemnizaciones laborales (Decreto 1082, art. 2.2.1.2.3.1.13).", false], ["C", "hasta la liquidación del contrato, igual que el amparo de cumplimiento, porque cubre la obra durante toda la ejecución.", "La vigencia hasta la liquidación corresponde al amparo de cumplimiento (Decreto 1082, art. 2.2.1.2.3.1.12); la estabilidad de la obra cubre daños posteriores a la entrega.", false]]}, {"id": "CE-144", "niv": 3, "e": "El amparo de pago de salarios, prestaciones sociales legales e indemnizaciones laborales debe cubrir, como mínimo,", "f": "Decreto 1082 de 2015, art. 2.2.1.2.3.1.13", "o": [["A", "$97.500.000 y estar vigente por el plazo del contrato y tres años más.", "El artículo 2.2.1.2.3.1.13 del Decreto 1082 de 2015 fija un valor no inferior al 5 % del valor total del contrato y una vigencia igual al plazo del contrato y tres años más: 5 % de $1.950.000.000 = $97.500.000.", true], ["B", "$195.000.000 y estar vigente por el plazo del contrato y tres años más.", "El porcentaje mínimo de este amparo es el 5 % del valor del contrato, no el 10 % que se exige para el amparo de cumplimiento (Decreto 1082, arts. 2.2.1.2.3.1.12 y 2.2.1.2.3.1.13).", false], ["C", "$97.500.000 y estar vigente hasta la liquidación del contrato.", "El valor es correcto, pero la vigencia de este amparo es el plazo del contrato y tres años más, no hasta la liquidación (Decreto 1082, art. 2.2.1.2.3.1.13).", false]]}, {"id": "CE-145", "niv": 3, "e": "En relación con el anticipo pactado, la gobernación debe exigir", "f": "Ley 80 de 1993, art. 40, par.; Ley 1474 de 2011, art. 91; Decreto 1082 de 2015, arts. 2.2.1.1.2.4.1 y 2.2.1.2.3.1.10", "o": [["A", "una garantía de buen manejo por $58.500.000, equivalente al 10 % del anticipo, y su consignación en una cuenta a nombre del contratista.", "La garantía de buen manejo debe cubrir el 100 % del anticipo, no el 10 %, y en un contrato de obra adjudicado por licitación el anticipo se maneja en fiducia o patrimonio autónomo, no en una cuenta del contratista (art. 91, Ley 1474).", false], ["B", "una garantía de buen manejo por $585.000.000 y que el anticipo se maneje en una fiducia o patrimonio autónomo irrevocable.", "El anticipo es de $585.000.000 (30 % de $1.950.000.000), dentro del tope del 50 % del parágrafo del artículo 40 de la Ley 80. La garantía de buen manejo y correcta inversión debe ser del 100 % del anticipo (Decreto 1082, art. 2.2.1.2.3.1.10), y en los contratos de obra el contratista debe constituir una fiducia o patrimonio autónomo irrevocable para manejarlo (art. 91, Ley 1474; Decreto 1082, art. 2.2.1.1.2.4.1).", true], ["C", "una garantía de buen manejo por $195.000.000, equivalente al 10 % del contrato, sin necesidad de constituir una fiducia.", "El valor asegurado se calcula sobre el anticipo (100 %), no sobre el valor del contrato, y la fiducia es obligatoria en los contratos de obra que no son de menor o mínima cuantía (art. 91, Ley 1474).", false]]}]}, {"comp": "contratacion", "rol": "general", "tag": "Contratación estatal · Supervisión e interventoría", "texto": "Un municipio adjudicó por licitación pública la construcción de un centro de salud. Para el seguimiento de la obra, el secretario de Infraestructura propone designar como supervisor a un ingeniero de planta y no contratar interventoría, para ahorrar recursos. Paralelamente, la alcaldía tiene un contrato de suministro de refrigerios para un evento institucional, cuyo seguimiento no exige conocimientos especializados. Usted es profesional de la oficina jurídica y debe conceptuar sobre la vigilancia de ambos contratos.", "items": [{"id": "CE-149", "niv": 1, "e": "Sobre el seguimiento del contrato de suministro de refrigerios, lo adecuado es", "f": "Ley 1474 de 2011, art. 83", "o": [["A", "dejar el seguimiento a cargo del contratista mediante informes periódicos de autocontrol que él mismo elabore.", "Las entidades están obligadas a vigilar permanentemente la ejecución a través de un supervisor o un interventor (art. 83, Ley 1474); el contratista no puede vigilarse a sí mismo.", false], ["B", "contratar un interventor externo, porque todo contrato estatal debe vigilarse mediante interventoría.", "La interventoría se contrata cuando el seguimiento supone conocimiento especializado o la complejidad o extensión del contrato lo justifican (art. 83, Ley 1474); no es obligatoria en todo contrato.", false], ["C", "designar un supervisor de la misma entidad, porque el seguimiento no requiere conocimientos especializados.", "El artículo 83 de la Ley 1474 de 2011 define la supervisión como el seguimiento técnico, administrativo, financiero, contable y jurídico que ejerce la misma entidad cuando no se requieren conocimientos especializados.", true]]}, {"id": "CE-150", "niv": 2, "e": "Frente a la propuesta de no contratar interventoría para la obra del centro de salud, usted debe advertir que", "f": "Ley 80 de 1993, art. 32, num. 1; Ley 1474 de 2011, art. 83, par. 1", "o": [["A", "en la obra adjudicada por licitación, la interventoría debe contratarse con alguien independiente de la entidad y del contratista.", "El numeral 1 del artículo 32 de la Ley 80 dispone que en los contratos de obra celebrados como resultado de una licitación la interventoría debe contratarse con una persona independiente de la entidad contratante y del contratista. El parágrafo 1 del artículo 83 de la Ley 1474 se refiere a esa obligación de contar con interventoría.", true], ["B", "es viable si el ingeniero de planta tiene posgrado en interventoría de obras civiles.", "La exigencia legal es que la interventoría la ejerza una persona independiente de la entidad; un servidor de planta, cualquiera que sea su formación, no lo es (art. 32, num. 1, Ley 80).", false], ["C", "es viable, porque la entidad puede escoger libremente entre supervisión e interventoría en cualquier contrato, según su presupuesto.", "En la obra licitada la ley impone la interventoría externa (art. 32, num. 1, Ley 80); la libertad de escoger no aplica en ese caso.", false]]}, {"id": "CE-151", "niv": 3, "e": "Si la alcaldía contrata la interventoría de la obra, en relación con la supervisión es correcto afirmar que", "f": "Ley 1474 de 2011, art. 83", "o": [["A", "el contrato de interventoría no requiere supervisión, porque el interventor responde directamente ante la contraloría.", "El artículo 83 de la Ley 1474 dispone expresamente que el contrato de interventoría será supervisado directamente por la entidad estatal.", false], ["B", "por regla general no concurren, aunque la entidad puede dividir la vigilancia entre el interventor y un supervisor.", "El artículo 83 de la Ley 1474 dispone que, por regla general, la supervisión y la interventoría no son concurrentes sobre un mismo contrato, pero la entidad puede dividir la vigilancia: el contrato de interventoría indicará las actividades técnicas del interventor y las demás quedarán a cargo del supervisor. Además, el contrato de interventoría es supervisado por la entidad.", true], ["C", "deben concurrir en todos los casos, porque el interventor vigila lo técnico y el supervisor todo lo demás.", "La concurrencia no es la regla sino una posibilidad cuando la entidad decide dividir la vigilancia (art. 83, Ley 1474).", false]]}]}, {"comp": "contratacion", "rol": "profesional", "tag": "Contratación estatal · Niveles profesional, asesor y ejecutivo · Adiciones: límite del 50 % del valor inicial", "texto": "Una gobernación suscribió en 2024 un contrato de obra por $520.000.000. El SMMLV fue de $1.300.000 en 2024 y de $1.423.500 en 2025. En noviembre de 2024 el contrato se adicionó en $130.000.000, y en 2025 se requiere una nueva adición. Por otra parte, la obra se prorrogó y el contrato de interventoría que la vigila debe prorrogarse por el mismo plazo, con el ajuste de valor correspondiente. Usted es profesional de la oficina de contratación y debe calcular los topes siguiendo el criterio de Colombia Compra Eficiente: expresar el valor inicial y cada adición en SMMLV del año respectivo.", "items": [{"id": "CE-164", "niv": 2, "e": "El tope total de adiciones de ese contrato, expresado en SMMLV, es de", "f": "Ley 80 de 1993, art. 40, par.; Colombia Compra Eficiente, concepto C-583 de 2025", "o": [["A", "100 SMMLV.", "Corresponde a lo que ya se adicionó en 2024 ($130.000.000 / $1.300.000), no al tope total.", false], ["B", "200 SMMLV.", "El parágrafo del artículo 40 de la Ley 80 prohíbe adicionar más del 50 % del valor inicial expresado en SMMLV: $520.000.000 / $1.300.000 = 400 SMMLV; el 50 % son 200 SMMLV. Así lo explica Colombia Compra Eficiente (concepto C-583 de 2025).", true], ["C", "400 SMMLV.", "Es el valor inicial completo del contrato expresado en SMMLV; el límite es la mitad de ese valor (art. 40, par., Ley 80).", false]]}, {"id": "CE-165", "niv": 3, "e": "Teniendo en cuenta la adición de noviembre de 2024, el valor máximo de la nueva adición en 2025 es de", "f": "Ley 80 de 1993, art. 40, par.; Colombia Compra Eficiente, concepto C-583 de 2025", "o": [["A", "$130.000.000.", "Resulta de restar en pesos ($260.000.000 − $130.000.000) sin actualizar el saldo al SMMLV de 2025; el límite legal se expresa en salarios mínimos.", false], ["B", "$142.350.000.", "El tope es de 200 SMMLV; la adición de 2024 consumió 100 SMMLV ($130.000.000 / $1.300.000). Quedan 100 SMMLV, que en 2025 equivalen a 100 × $1.423.500 = $142.350.000 (art. 40, par., Ley 80; concepto C-583 de 2025 de Colombia Compra Eficiente).", true], ["C", "$154.700.000.", "Resulta de convertir todo el tope a pesos de 2025 (200 × $1.423.500 = $284.700.000) y restar la adición anterior en pesos de 2024, mezclando valores de años distintos.", false]]}, {"id": "CE-166", "niv": 2, "e": "En cuanto al valor del contrato de interventoría que se prorroga por el mismo plazo de la obra,", "f": "Ley 1474 de 2011, art. 85; Ley 80 de 1993, art. 40, par.", "o": [["A", "está sujeto al mismo límite del 50 % del valor inicial expresado en SMMLV que rige para la obra.", "La ley excluye expresamente la aplicación del parágrafo del artículo 40 de la Ley 80 en este supuesto (art. 85, Ley 1474).", false], ["B", "no puede modificarse, porque la prórroga de la interventoría debe hacerse sin costo adicional para la gobernación.", "El artículo 85 de la Ley 1474 autoriza ajustar el valor de la interventoría prorrogada según sus obligaciones.", false], ["C", "puede ajustarse según las obligaciones de la interventoría, sin que se aplique el límite del 50 % del valor inicial.", "El artículo 85 de la Ley 1474 de 2011 permite prorrogar los contratos de interventoría por el mismo plazo en que se prorrogó el contrato vigilado y ajustar su valor en atención a las obligaciones de la interventoría, sin que resulte aplicable el parágrafo del artículo 40 de la Ley 80.", true]]}]}, {"comp": "contratacion", "rol": "general", "tag": "Contratación estatal · Selección abreviada de menor cuantía y declaratoria de desierta", "texto": "Una alcaldía abrió una licitación pública para dotar con equipos biomédicos los puestos de salud rurales, pero ninguno de los proponentes cumplió los requisitos habilitantes, por lo que ninguna oferta podía ser escogida. En otro proceso, de selección abreviada de menor cuantía para el mantenimiento de las sedes educativas, recibió 25 manifestaciones de interés; el pliego previó la posibilidad de sorteo. Usted es profesional de la oficina de contratación y debe orientar al comité.", "items": [{"id": "CE-177", "niv": 2, "e": "Ante la falta de proponentes habilitados en la licitación, la alcaldía", "f": "Ley 80 de 1993, art. 25, num. 18; Ley 1150 de 2007, art. 2, num. 2, lit. d)", "o": [["A", "debe declararla desierta mediante acto motivado y puede iniciar una selección abreviada dentro de los cuatro meses siguientes.", "Como ninguna oferta podía escogerse, se presenta un motivo que impide la escogencia objetiva y la licitación se declara desierta mediante acto motivado (art. 25, num. 18, Ley 80); y el literal d) del numeral 2 del artículo 2 de la Ley 1150 prevé la selección abreviada cuando la licitación se dec
