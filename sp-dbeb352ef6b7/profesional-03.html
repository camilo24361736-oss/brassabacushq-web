<style>body{overflow-wrap:anywhere}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}

.op{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:6px 0;cursor:pointer;background:transparent;width:100%;text-align:left;color:inherit;font:inherit}

.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

<script>
const DATA = [{"comp": "estructura_pgn", "rol": "general", "tag": "Estructura y funciones de la Procuraduría · Elección y periodo del Procurador General", "texto": "La Oficina de Prensa de la Procuraduría prepara una cartilla pedagógica sobre la entidad y usted, profesional de apoyo, debe revisar tres apartes del borrador. El primero describe cómo se elige al Procurador General de la Nación. El segundo explica qué ocurre si el Procurador muere o renuncia antes de terminar su periodo. El tercero responde a la pregunta frecuente de un ciudadano: «¿Puede quien ya fue Procurador en propiedad volver a ser elegido para ese mismo cargo?».", "items": [{"id": "PG-104", "niv": 1, "e": "El primer aparte de la cartilla quedará correcto si indica que el Procurador General es elegido", "f": "Constitución Política, art. 276; Decreto Ley 262 de 2000, art. 3", "o": [["A", "por el Congreso en pleno, para un periodo de cuatro años, de terna elaborada por el Presidente de la República.", "Confunde la elección del Procurador con otras elecciones. El artículo 276 de la Constitución atribuye la elección al Senado, de terna con candidatos de tres autoridades distintas.", false], ["B", "por el Senado de la República, para un periodo de cuatro años, de terna integrada por candidatos de la Corte Constitucional, la Corte Suprema de Justicia y el Consejo de Estado.", "La terna no la integra la Corte Constitucional sino el Presidente de la República, junto con la Corte Suprema y el Consejo de Estado (art. 276 de la Constitución).", false], ["C", "por el Senado, para un periodo de cuatro años, de terna integrada por candidatos del Presidente de la República, la Corte Suprema de Justicia y el Consejo de Estado.", "Así lo dispone el artículo 276 de la Constitución, reiterado en el artículo 3 del Decreto Ley 262 de 2000.", true]]}, {"id": "PG-105", "niv": 2, "e": "En el segundo aparte, sobre la falta absoluta del Procurador General, debe explicarse que, según el Decreto Ley 262 de 2000,", "f": "Decreto Ley 262 de 2000, arts. 6 y 17 num. 2 (modificado por el art. 7 del Decreto Ley 1851 de 2021)", "o": [["A", "el Presidente de la República designa un procurador encargado hasta completar el periodo.", "Ninguna norma atribuye al Presidente esa designación. El artículo 6 del Decreto Ley 262 de 2000 ordena una nueva elección y asigna el ejercicio transitorio al Viceprocurador.", false], ["B", "se hace nueva elección dentro de los treinta días siguientes y, mientras tanto, el Viceprocurador ejerce como Procurador General.", "El artículo 6 del Decreto Ley 262 de 2000 ordena una nueva elección dentro de los treinta días siguientes a la falta y dispone que, mientras se realizan la elección y la posesión, el Viceprocurador ejerce como Procurador General (ver también el art. 17, num. 2).", true], ["C", "el Secretario General de la entidad asume el cargo y lo ejerce hasta que el Senado de la República elija y posesione al reemplazo.", "El Secretario General no reemplaza al Procurador; esa función corresponde al Viceprocurador (arts. 6 y 17, num. 2, del Decreto Ley 262 de 2000).", false]]}, {"id": "PG-106", "niv": 2, "e": "A la pregunta del ciudadano sobre la posibilidad de que un exprocurador vuelva a ser elegido para el mismo cargo, la cartilla debe responder que", "f": "Constitución Política, art. 126 (modificado por el art. 2 del Acto Legislativo 2 de 2015)", "o": [["A", "no puede, porque la Constitución prohíbe reelegir en ese cargo a quien lo haya ejercido en propiedad.", "El artículo 126 de la Constitución, modificado por el Acto Legislativo 2 de 2015, dispone que quien haya ejercido en propiedad, entre otros, el cargo de Procurador General de la Nación no podrá ser reelegido para el mismo.", true], ["B", "sí puede por una sola vez, si la terna lo vuelve a incluir.", "No existe una reelección por una vez para el Procurador. El artículo 126 de la Constitución lo incluye en la lista de cargos para los cuales no procede la reelección.", false], ["C", "sí puede, siempre que no sea para el periodo inmediatamente siguiente.", "La Constitución no establece una reelección diferida para este cargo: el artículo 126, modificado por el Acto Legislativo 2 de 2015, prohíbe reelegir para el mismo cargo a quien lo haya ejercido en propiedad, sin distinguir periodos.", false]]}]}, {"comp": "estructura_pgn", "rol": "general", "tag": "Estructura y funciones de la Procuraduría · Defensor del Pueblo como parte del Ministerio Público", "texto": "En la ventanilla de atención de una procuraduría provincial, un estudiante de derecho que prepara una exposición le pregunta a usted, técnico administrativo, por la relación entre la Procuraduría y la Defensoría del Pueblo. Quiere saber quién elige al Defensor del Pueblo, si la Defensoría hace parte del Ministerio Público y si el Procurador dirige sus actuaciones, y a qué entidad le corresponde organizar el servicio de defensoría pública para quienes no pueden pagar un abogado.", "items": [{"id": "PG-113", "niv": 1, "e": "Sobre la elección del Defensor del Pueblo, usted le explica que, según el texto vigente de la Constitución, lo elige", "f": "Constitución Política, art. 281 (modificado por el art. 24 del Acto Legislativo 2 de 2015)", "o": [["A", "el Procurador General, como supremo director del Ministerio Público, mediante decreto y para un periodo igual al suyo.", "El Procurador no elige al Defensor. Ser supremo director del Ministerio Público (art. 275) no le da esa competencia; la elección es de la Cámara (art. 281).", false], ["B", "el Senado de la República, de terna elaborada por el Procurador General de la Nación, para un periodo institucional de cuatro años.", "La elección no corresponde al Senado ni la terna al Procurador. El artículo 281 vigente asigna la elección a la Cámara de Representantes, de terna del Presidente.", false], ["C", "la Cámara de Representantes, de una terna que presenta el Presidente de la República, por cuatro años.", "El artículo 281 de la Constitución, modificado por el artículo 24 del Acto Legislativo 2 de 2015, dispone que el Defensor del Pueblo es elegido por la Cámara de Representantes para un periodo institucional de cuatro años, de terna elaborada por el Presidente.", true]]}, {"id": "PG-114", "niv": 3, "e": "Sobre la relación entre la Defensoría y el Ministerio Público, la respuesta correcta es que el Defensor del Pueblo", "f": "Constitución Política, arts. 118 y 281 (modificado por el art. 24 del Acto Legislativo 2 de 2015)", "o": [["A", "dejó de hacer parte del Ministerio Público con la reforma de 2015, que convirtió a la Defensoría en un órgano autónomo.", "La reforma de 2015 modificó el artículo 281, pero el artículo 118 sigue incluyendo al Defensor del Pueblo entre quienes ejercen el Ministerio Público.", false], ["B", "hace parte del Ministerio Público y, según el texto vigente del artículo 281, ejerce sus funciones de manera autónoma.", "El artículo 118 de la Constitución incluye al Defensor entre quienes ejercen el Ministerio Público, y el artículo 281, modificado por el Acto Legislativo 2 de 2015, dispone que ejerce sus funciones de manera autónoma.", true], ["C", "es un agente del Procurador, que le imparte instrucciones obligatorias en cada caso.", "El Defensor no es agente del Procurador; el artículo 281 vigente dispone que ejerce sus funciones de manera autónoma.", false]]}, {"id": "PG-115", "niv": 2, "e": "Sobre la defensoría pública, usted le indica que organizarla y dirigirla corresponde", "f": "Constitución Política, art. 282 num. 4", "o": [["A", "al Defensor del Pueblo, en los términos que señale la ley.", "El artículo 282, num. 4, de la Constitución asigna al Defensor del Pueblo la función de organizar y dirigir la defensoría pública en los términos que señale la ley.", true], ["B", "a la Procuraduría General, por medio de los procuradores judiciales en lo penal.", "Los procuradores judiciales intervienen como Ministerio Público en los procesos, pero no prestan ni dirigen la defensoría pública, que corresponde al Defensor del Pueblo (art. 282, num. 4).", false], ["C", "a las personerías municipales, por ser el Ministerio Público más cercano al ciudadano.", "Aunque los personeros ejercen el Ministerio Público en el municipio, la Constitución asigna la organización de la defensoría pública al Defensor del Pueblo (art. 282, num. 4).", false]]}]}, {"comp": "estructura_pgn", "rol": "general", "tag": "Estructura y funciones de la Procuraduría · Funciones del Viceprocurador General", "texto": "El Procurador General viaja durante diez días a un foro internacional. Durante su ausencia, la Defensoría del Pueblo propone a la Procuraduría una jornada conjunta de verificación de derechos en centros de reclusión. Ese mismo mes, el Viceprocurador decide asumir el conocimiento de una actuación disciplinaria que una procuraduría provincial adelantaba, en etapa de instrucción, contra el alcalde de un municipio que no es capital de departamento.", "items": [{"id": "PG-131", "niv": 1, "e": "Durante la ausencia temporal del Procurador General, sus funciones las asume", "f": "Decreto Ley 262 de 2000, art. 17 num. 2 (modificado por el art. 7 del Decreto Ley 1851 de 2021)", "o": [["A", "el Viceprocurador General.", "El artículo 17, num. 2, del Decreto Ley 262 de 2000, modificado por el artículo 7 del Decreto Ley 1851 de 2021, dispone que el Viceprocurador asume las funciones del Procurador en sus ausencias temporales.", true], ["B", "el procurador delegado más antiguo.", "Ninguna norma asigna ese reemplazo al delegado más antiguo; el artículo 17, num. 2, del Decreto Ley 262 de 2000 lo asigna al Viceprocurador.", false], ["C", "el Secretario General.", "El Secretario General no reemplaza al Procurador en sus ausencias; esa función es del Viceprocurador (art. 17, num. 2).", false]]}, {"id": "PG-132", "niv": 2, "e": "La coordinación de la jornada conjunta con la Defensoría del Pueblo es una función asignada a", "f": "Decreto Ley 262 de 2000, arts. 8 y 17 num. 7 (modificados por el Decreto Ley 1851 de 2021)", "o": [["A", "la procuraduría regional del lugar donde están los centros de reclusión, sin intervención del nivel central.", "Aunque las regionales pueden participar en la jornada, la coordinación de las actividades conjuntas con la Defensoría es función del Viceprocurador (art. 17, num. 7).", false], ["B", "el Viceprocurador General.", "El artículo 17, num. 7, del Decreto Ley 262 de 2000, modificado por el Decreto Ley 1851 de 2021, asigna al Viceprocurador coordinar las actividades que desarrollen conjuntamente la Procuraduría y la Defensoría del Pueblo.", true], ["C", "la Procuraduría Auxiliar para Asuntos Constitucionales, porque se trata de derechos fundamentales.", "Esta procuraduría auxiliar proyecta conceptos y absuelve consultas (art. 8), pero no coordina las actividades conjuntas con la Defensoría, que el artículo 17, num. 7, asigna al Viceprocurador.", false]]}, {"id": "PG-133", "niv": 3, "e": "Si el Viceprocurador asume la instrucción del proceso contra el alcalde y se formula pliego de cargos, el juzgamiento corresponderá a", "f": "Decreto Ley 262 de 2000, arts. 17 parágrafo 3 y 22 num. 3 (modificados por el Decreto Ley 1851 de 2021); Ley 1952 de 2019, art. 12", "o": [["A", "la procuraduría provincial de juzgamiento de la circunscripción del municipio.", "Cuando el Viceprocurador ejerce su competencia preferente en instrucción, el juzgamiento lo asume una de las Salas Disciplinarias, no la provincial de origen (art. 17, parágrafo 3).", false], ["B", "el mismo Viceprocurador, que conserva el proceso hasta el fallo.", "El sistema separa instrucción y juzgamiento (art. 12 de la Ley 1952 de 2019); por eso el parágrafo 3 del artículo 17 envía el juzgamiento a una Sala Disciplinaria.", false], ["C", "la Sala Disciplinaria de Juzgamiento de Servidores Públicos de Elección Popular.", "El parágrafo 3 del artículo 17 del Decreto Ley 262 de 2000 dispone que, si el Viceprocurador asume en instrucción, el juzgamiento corresponde a la Sala Ordinaria de Juzgamiento o a la de Elección Popular, según el caso; el alcalde es de elección popular (art. 22, num. 3, lit. a).", true]]}]}, {"comp": "estructura_pgn", "rol": "general", "tag": "Estructura y funciones de la Procuraduría · Función preventiva y de control de gestión", "texto": "Una procuraduría delegada preventiva y de control de gestión recibe la solicitud de una veeduría ciudadana para que visite un hospital público de segundo nivel donde, según la queja, se están venciendo medicamentos en bodega. Al mismo tiempo, la delegada decide hacer seguimiento a la ejecución de un contrato de infraestructura vial de gran cuantía, escogido entre varios por su nivel de riesgo. Un servidor nuevo pregunta de quién dependen los procuradores delegados.", "items": [{"id": "PG-149", "niv": 1, "e": "A la pregunta del servidor nuevo, la respuesta correcta es que los procuradores delegados dependen directamente", "f": "Decreto Ley 262 de 2000, art. 23 parágrafo", "o": [["A", "de la Sala Disciplinaria de Instrucción.", "Las Salas Disciplinarias tienen competencias procesales; no son el superior administrativo de los delegados (art. 23, parágrafo, del Decreto Ley 262 de 2000).", false], ["B", "del Viceprocurador General.", "Aunque el Viceprocurador coordina actividades preventivas y otras funciones (art. 17), los delegados dependen directamente del Procurador (art. 23, parágrafo).", false], ["C", "del Procurador General.", "El parágrafo del artículo 23 del Decreto Ley 262 de 2000 dispone que los procuradores delegados dependen directamente del Procurador General.", true]]}, {"id": "PG-150", "niv": 2, "e": "Frente a la solicitud de la veeduría, la procuraduría delegada", "f": "Decreto Ley 262 de 2000, art. 24 num. 6", "o": [["A", "debe trasladar la petición a la personería, que es la competente para atender las solicitudes de las veedurías ciudadanas.", "Aunque las personerías apoyan a las veedurías, el artículo 24, num. 6, permite a las delegadas visitar entidades a solicitud de cualquier persona, de modo que no está obligada a trasladar la petición.", false], ["B", "puede atender la petición y practicar la visita, porque puede hacerlo tanto de oficio como a pedido de un particular.", "El artículo 24, num. 6, del Decreto Ley 262 de 2000 permite a las delegadas visitar entidades estatales o particulares que cumplen función pública, a solicitud de cualquier persona u oficiosamente, para proteger los recursos públicos y garantizar los principios de la función pública.", true], ["C", "debe pedir a la Contraloría que practique la visita, porque se trata de verificar el manejo de bienes públicos.", "La Procuraduría no depende de la Contraloría para visitar entidades: el artículo 24, num. 6, del Decreto Ley 262 de 2000 le permite practicar visitas directamente para proteger los recursos públicos.", false]]}, {"id": "PG-151", "niv": 2, "e": "El seguimiento a la ejecución del contrato vial, escogido por su nivel de riesgo, es una manifestación de", "f": "Decreto Ley 262 de 2000, art. 24 num. 3; Constitución Política, arts. 267 y 272", "o": [["A", "la vigilancia preventiva sobre la gestión y la contratación, que la delegada aplica escogiendo los asuntos que sigue.", "El artículo 24, num. 3, del Decreto Ley 262 de 2000 asigna a las delegadas ejercer, de manera selectiva, control preventivo de la gestión administrativa y de la contratación estatal de las entidades públicas.", true], ["B", "el control fiscal posterior y selectivo, que la Procuraduría comparte con la Contraloría.", "El control fiscal corresponde a las contralorías (arts. 267 y 272 de la Constitución); la Procuraduría ejerce vigilancia preventiva y de control de gestión, no control fiscal.", false], ["C", "la función disciplinaria, que obliga a abrir indagación previa contra el supervisor del contrato.", "El seguimiento preventivo no es una actuación disciplinaria ni obliga a abrir indagación; si se detectan posibles faltas, se dará traslado a la dependencia competente.", false]]}]}, {"comp": "estructura_pgn", "rol": "profesional", "tag": "Estructura y funciones de la Procuraduría · Niveles profesional, asesor y ejecutivo · Régimen de competencias por sujeto disciplinable", "texto": "Usted es profesional universitario del grupo de reparto disciplinario de una procuraduría regional y debe proyectar la remisión por competencia de tres quejas recibidas el mismo día. La primera es contra un diputado de la asamblea departamental. La segunda, contra un concejal de la capital del departamento. La tercera, contra el alcalde de la capital del departamento. Todas se refieren a hechos ocurridos durante el ejercicio de sus cargos.", "items": [{"id": "PG-152", "niv": 3, "e": "La instrucción de la queja contra el diputado corresponde a", "f": "Decreto Ley 262 de 2000, arts. 75 num. 1 y 76 num. 1 (modificados por el Decreto Ley 1851 de 2021); Ley 1952 de 2019, art. 101", "o": [["A", "la procuraduría regional de instrucción.", "El artículo 75, num. 1, lit. c, del Decreto Ley 262 de 2000, modificado por el artículo 19 del Decreto Ley 1851 de 2021, asigna a las regionales de instrucción las actuaciones contra los diputados.", true], ["B", "la Sala Disciplinaria de Instrucción, por tratarse de un servidor de elección popular.", "Las Salas conocen de los servidores enumerados en el artículo 101 de la Ley 1952 de 2019, lista que no incluye a los diputados; la elección popular, por sí sola, no traslada la instrucción a la Sala.", false], ["C", "la procuraduría provincial de instrucción de la capital.", "Las provinciales conocen de servidores del orden municipal y de concejales de municipios que no son capital (art. 76, num. 1); los diputados están asignados a las regionales.", false]]}, {"id": "PG-153", "niv": 2, "e": "La instrucción de la queja contra el concejal de la capital del departamento corresponde a", "f": "Decreto Ley 262 de 2000, arts. 75 num. 1 lit. c y 76 num. 1 lit. a; Ley 1952 de 2019, art. 2", "o": [["A", "la personería de la capital, por su poder preferente frente a los servidores municipales.", "Los concejales son de elección popular, y frente a ellos la competencia de la PGN es privativa (art. 2 de la Ley 1952 de 2019).", false], ["B", "la procuraduría provincial de instrucción, porque los concejales son servidores municipales.", "Las provinciales conocen de los concejales de municipios que no son capital de departamento (art. 76, num. 1, lit. a); los de las capitales corresponden a las regionales.", false], ["C", "la procuraduría regional de instrucción, por tratarse de un concejal de la capital del departamento.", "El artículo 75, num. 1, lit. c, del Decreto Ley 262 de 2000 asigna a las regionales de instrucción a los concejales de las capitales de departamento; los de los demás municipios corresponden a las provinciales (art. 76, num. 1, lit. a).", true]]}, {"id": "PG-154", "niv": 3, "e": "La instrucción de la queja contra el alcalde de la capital del departamento corresponde a", "f": "Decreto Ley 262 de 2000, arts. 25 num. 1 lit. c, 75 y 76 num. 1 lit. a (modificados por el Decreto Ley 1851 de 2021)", "o": [["A", "la procuraduría regional de instrucción, por ser el alcalde un servidor del orden departamental.", "El alcalde es un servidor del orden municipal o distrital, y el artículo 75 del Decreto Ley 262 de 2000 no incluye a los alcaldes de las capitales entre los sujetos de las regionales.", false], ["B", "las procuradurías delegadas disciplinarias de instrucción.", "El artículo 25, num. 1, lit. c, del Decreto Ley 262 de 2000, modificado por el artículo 12 del Decreto Ley 1851 de 2021, asigna a las delegadas de instrucción las actuaciones contra los alcaldes de capitales de departamento y los distritales, salvo el de Bogotá.", true], ["C", "la procuraduría provincial de instrucción, como ocurre con los demás alcaldes.", "Las provinciales conocen de los alcaldes de municipios que no sean capital de departamento (art. 76, num. 1, lit. a).", false]]}]}, {"comp": "estructura_pgn", "rol": "general", "tag": "Estructura y funciones de la Procuraduría · Régimen especial de carrera: concursos", "texto": "La Oficina de Selección y Carrera prepara una nueva convocatoria para proveer empleos del nivel técnico en varias procuradurías provinciales. En la reunión de planeación surgen tres preguntas: cuáles son las etapas del proceso de selección según el Decreto Ley 262 de 2000; cuándo debe convocarse un concurso de ascenso en lugar de uno abierto, y con cuánta antelación debe divulgarse la convocatoria antes de iniciar las inscripciones.", "items": [{"id": "PG-173", "niv": 1, "e": "Según el Decreto Ley 262 de 2000, el proceso de selección comprende, además de la convocatoria, el reclutamiento, la aplicación de pruebas y la lista de elegibles,", "f": "Decreto Ley 262 de 2000, arts. 194 y 204", "o": [["A", "el periodo de prueba y su calificación.", "El artículo 194 del Decreto Ley 262 de 2000 incluye como etapas del proceso de selección la convocatoria, el reclutamiento, la aplicación de pruebas, la conformación de la lista de elegibles, el periodo de prueba y la calificación del periodo de prueba.", true], ["B", "la entrevista obligatoria y eliminatoria de todos los aspirantes.", "La entrevista no es una etapa obligatoria y, cuando se programa, nunca puede ser eliminatoria (art. 204 del Decreto Ley 262 de 2000).", false], ["C", "la posesión, con la cual termina el proceso de selección.", "El artículo 194 no incluye la posesión como etapa; el proceso de selección continúa con el periodo de prueba y su calificación.", false]]}, {"id": "PG-174", "niv": 2, "e": "El concurso debe convocarse como de ascenso cuando en la entidad existan", "f": "Decreto Ley 262 de 2000, art. 192", "o": [["A", "por lo menos tres empleados de carrera interesados en ascender, según el registro que lleve la Comisión de Carrera.", "El número que exige el artículo 192 es de cinco empleados inscritos en carrera que cumplan los requisitos, certificados por la División de Gestión Humana.", false], ["B", "empleados provisionales con más de un año de servicio en el empleo vacante.", "En los concursos de ascenso participan empleados inscritos en carrera (art. 192); la provisionalidad no da derecho a concurso de ascenso.", false], ["C", "al menos cinco empleados inscritos en carrera que cumplan los requisitos para ascender.", "El artículo 192 del Decreto Ley 262 de 2000 ordena convocar concurso de ascenso cuando existan por lo menos cinco empleados inscritos en carrera que cumplan los requisitos para ascender, según certificación del jefe de la División de Gestión Humana.", true]]}, {"id": "PG-175", "niv": 1, "e": "La convocatoria debe divulgarse con una antelación no inferior a", "f": "Decreto Ley 262 de 2000, art. 197", "o": [["A", "treinta días calendario a la fecha de aplicación de la prueba escrita.", "El artículo 197 toma como referencia el inicio de las inscripciones, no la aplicación de pruebas, y fija quince días hábiles.", false], ["B", "quince días hábiles a la fecha de iniciación de las inscripciones.", "El artículo 197 del Decreto Ley 262 de 2000 ordena divulgar la convocatoria con una antelación no inferior a quince días hábiles a la fecha de iniciación de las inscripciones.", true], ["C", "cinco días hábiles a la fecha de iniciación de las inscripciones.", "El término del artículo 197 es de quince días hábiles, no de cinco.", false]]}]}, {"comp": "gestion_publica", "rol": "general", "tag": "Gestión pública y funcionamiento del Estado · Ramas del poder y órganos de control", "texto": "Usted es auxiliar de la oficina de atención al ciudadano de una procuraduría regional y prepara una charla para estudiantes de último grado de un colegio público. El profesor le envía con anticipación tres preguntas de los estudiantes: si la Procuraduría General de la Nación depende del Presidente de la República; a qué rama del poder pertenecen el Consejo Nacional Electoral y la Registraduría Nacional del Estado Civil; y si el personero del municipio es un empleado más del alcalde.", "items": [{"id": "GE-108", "niv": 1, "e": "Sobre la ubicación de la Procuraduría General de la Nación en la estructura del Estado, usted debe explicar que", "f": "Constitución Política, arts. 113, 117 y 118", "o": [["A", "hace parte de la rama judicial, porque adelanta procesos disciplinarios contra servidores públicos.", "Adelantar procesos disciplinarios no la convierte en parte de la rama judicial; es un órgano de control (art. 117) cuyas funciones disciplinarias son de naturaleza administrativa.", false], ["B", "es un organismo de la rama ejecutiva adscrito a la Presidencia de la República.", "La Procuraduría no pertenece a la rama ejecutiva: el Procurador es elegido por el Senado y la entidad hace parte de los órganos de control, autónomos e independientes (arts. 113, 117 y 276).", false], ["C", "integra el Ministerio Público, que la Constitución define como un órgano de control.", "El artículo 113 reconoce, además de las tres ramas, órganos autónomos e independientes, y el artículo 117 establece que el Ministerio Público y la Contraloría General de la República son órganos de control. El Ministerio Público es ejercido por el Procurador General (art. 118).", true]]}, {"id": "GE-109", "niv": 2, "e": "Sobre el Consejo Nacional Electoral y la Registraduría Nacional del Estado Civil, la respuesta correcta es que", "f": "Constitución Política, arts. 113 y 120", "o": [["A", "el primero pertenece a la rama judicial y la segunda a la rama ejecutiva.", "Ninguno de los dos pertenece a esas ramas: la Constitución los agrupa en la organización electoral (art. 120).", false], ["B", "conforman la organización electoral, que es uno de los órganos autónomos e independientes del Estado.", "El artículo 120 de la Constitución dispone que la organización electoral está conformada por el Consejo Nacional Electoral, la Registraduría Nacional del Estado Civil y los demás organismos que establezca la ley; el artículo 113 reconoce estos órganos autónomos e independientes.", true], ["C", "pertenecen a la rama legislativa, porque el Congreso elige a los magistrados del Consejo Nacional Electoral.", "Que el Congreso elija a los miembros del Consejo Nacional Electoral no lo integra a la rama legislativa. El artículo 120 los ubica en la organización electoral, que es autónoma.", false]]}, {"id": "GE-110", "niv": 2, "e": "Respecto del personero municipal, lo que debe aclararse a los estudiantes es que", "f": "Constitución Política, art. 118", "o": [["A", "ejerce funciones de Ministerio Público en el municipio y no es un subordinado del alcalde.", "El artículo 118 de la Constitución dispone que el Ministerio Público es ejercido, entre otros, por los personeros municipales; por eso el personero cumple funciones de control y no depende jerárquicamente del alcalde.", true], ["B", "es un empleado de libre nombramiento y remoción del alcalde, encargado de la defensa judicial del municipio.", "El personero no es nombrado ni removido por el alcalde (lo elige el concejo) y su función no es la defensa judicial del municipio, sino la de Ministerio Público (art. 118).", false], ["C", "es un delegado del Defensor del Pueblo y depende jerárquicamente de este.", "Aunque el personero colabora con la Defensoría en derechos humanos, no es su delegado ni su subordinado; la Constitución lo menciona de manera autónoma como agente del Ministerio Público (art. 118).", false]]}]}, {"comp": "gestion_publica", "rol": "general", "tag": "Gestión pública y funcionamiento del Estado · Desconcentración y descentralización", "texto": "Usted es técnico de la secretaría de planeación de un municipio de primera categoría. El alcalde estudia tres propuestas para mejorar la prestación de servicios: (a) abrir puntos de la secretaría de hacienda en cuatro corregimientos para recibir declaraciones del impuesto de industria y comercio y expedir paz y salvos, bajo las instrucciones y orientaciones del secretario de hacienda; (b) crear un instituto municipal de deportes con personería jurídica, autonomía administrativa y financiera y patrimonio independiente, que preste ese servicio conforme al derecho público; y (c) para ganar tiempo, crear ese instituto mediante decreto del alcalde, sin acudir al concejo municipal.", "items": [{"id": "GE-121", "niv": 3, "e": "La propuesta (a), de abrir puntos de la secretaría de hacienda en los corregimientos, corresponde a la figura de", "f": "Ley 489 de 1998, art. 8", "o": [["A", "la desconcentración, porque acerca a los corregimientos funciones de la misma secretaría.", "El artículo 8 de la Ley 489 de 1998 define la desconcentración como la radicación de competencias y funciones en dependencias ubicadas fuera de la sede principal del organismo, sin perjuicio de las potestades de orientación e instrucción de los jefes superiores, y precisa que no implica delegación.", true], ["B", "la descentralización territorial, porque las funciones pasan a los corregimientos.", "Los corregimientos no son entidades territoriales ni reciben las funciones como titulares; la secretaría de hacienda sigue siendo la responsable.", false], ["C", "la delegación, porque el secretario transfiere el ejercicio de funciones a los funcionarios de los puntos.", "La delegación exige un acto escrito que transfiera la decisión a un delegatario determinado (arts. 9 y 10 de la Ley 489). Aquí las funciones se radican en dependencias externas que siguen bajo las instrucciones del secretario, lo que la ley califica como desconcentración, y aclara que esta no implica delegación.", false]]}, {"id": "GE-122", "niv": 2, "e": "La creación del instituto de deportes descrita en la propuesta (b) es un caso de", "f": "Ley 489 de 1998, arts. 68 y 70", "o": [["A", "desconcentración, porque el instituto seguirá sometido a la orientación del alcalde.", "La desconcentración ocurre dentro de la misma entidad, sin crear una persona jurídica distinta (art. 8). El control administrativo que conserva el alcalde no cambia la naturaleza descentralizada del nuevo instituto.", false], ["B", "delegación, porque el alcalde traslada al instituto funciones que hoy ejerce directamente.", "La delegación transfiere el ejercicio de funciones a colaboradores u otras autoridades mediante un acto escrito (art. 9) y no crea una nueva persona jurídica.", false], ["C", "descentralización por servicios, porque se crea una entidad con personería jurídica para prestar ese servicio.", "El instituto tendría personería jurídica, autonomía administrativa y financiera y patrimonio independiente, y prestaría un servicio conforme al derecho público: son las características del establecimiento público (art. 70 de la Ley 489), entidad descentralizada por servicios (art. 68).", true]]}, {"id": "GE-123", "niv": 1, "e": "Frente a la propuesta (c), usted debe advertir que", "f": "Ley 489 de 1998, art. 69; Constitución Política, art. 313, num. 6", "o": [["A", "el alcalde puede crear el instituto por decreto, porque es el jefe de la administración municipal.", "Ser jefe de la administración no lo faculta para crear entidades descentralizadas por sí solo: requiere acuerdo del concejo o su autorización (art. 69 de la Ley 489; art. 313, num. 6, de la Constitución).", false], ["B", "en el orden municipal, las entidades descentralizadas se crean por acuerdo del concejo o con su autorización.", "El artículo 69 de la Ley 489 de 1998 dispone que las entidades descentralizadas se crean en el orden municipal por el acuerdo o con su autorización; el artículo 313, numeral 6, de la Constitución asigna al concejo la creación de establecimientos públicos.", true], ["C", "solo una ley de la República puede crear el instituto, como ocurre con las entidades nacionales.", "La creación por ley se exige para las entidades descentralizadas del orden nacional; en el orden municipal basta el acuerdo del concejo o su autorización (art. 69).", false]]}]}, {"comp": "gestion_publica", "rol": "profesional", "tag": "Gestión pública y funcionamiento del Estado · Niveles profesional, asesor y ejecutivo · Vigencias futuras y universalidad del gasto", "texto": "Usted es profesional especializado de una procuraduría provincial y realiza vigilancia preventiva a la gestión presupuestal de un municipio. En el segundo año de su período, el alcalde quiere contratar por tres años la recolección de residuos sólidos; el proyecto está incluido en el plan de desarrollo y su ejecución empezaría con presupuesto de la vigencia en curso. Las vigencias futuras que se solicitarán suman $2.000.000.000. Además, el secretario de hacienda propone pagar con recursos de la tesorería un festival que no figura en el presupuesto municipal, «porque hay caja disponible».", "items": [{"id": "GE-138", "niv": 2, "e": "La autorización para comprometer estas vigencias futuras ordinarias debe impartirla", "f": "Ley 819 de 2003, art. 12", "o": [["A", "el Ministerio de Hacienda y Crédito Público, previo concepto favorable del Departamento Nacional de Planeación y del ministerio del ramo.", "El concepto del DNP se exige solo cuando el proyecto conlleva inversión nacional, y el Ministerio de Hacienda no autoriza las vigencias futuras de los municipios (art. 12 de la Ley 819).", false], ["B", "el concejo municipal, a iniciativa del alcalde y previa aprobación del Confis territorial o el órgano que haga sus veces.", "El artículo 12 de la Ley 819 de 2003 dispone que, en las entidades territoriales, las autorizaciones para comprometer vigencias futuras son impartidas por la asamblea o el concejo, a iniciativa del gobierno local, previa aprobación del Confis territorial o del órgano que haga sus veces.", true], ["C", "el Consejo Superior de Política Fiscal del municipio, sin necesidad de pasar por el concejo.", "En las entidades territoriales el Confis o el órgano que haga sus veces da una aprobación previa, pero la autorización corresponde al concejo (art. 12 de la Ley 819 de 2003).", false]]}, {"id": "GE-139", "niv": 3, "e": "Para que el concejo pueda autorizar las vigencias futuras por $2.000.000.000, el municipio debe", "f": "Ley 819 de 2003, art. 12, lit. b", "o": [["A", "contar con una apropiación de al menos $200.000.000 en la vigencia en que se autoricen.", "Corresponde al 10 % de las vigencias futuras solicitadas; la ley exige como mínimo el 15 %.", false], ["B", "contar con una apropiación de al menos $300.000.000 en la vigencia en que se autoricen.", "El literal b) del artículo 12 de la Ley 819 de 2003 exige contar, como mínimo, con apropiación del 15 % de las vigencias futuras solicitadas en la vigencia fiscal en que se autoricen: 15 % de $2.000.000.000 = $300.000.000.", true], ["C", "contar con una apropiación de al menos $600.000.000 en la vigencia en que se autoricen.", "Corresponde al 30 % del valor solicitado; la ley fija el mínimo en el 15 %.", false]]}, {"id": "GE-140", "niv": 2, "e": "Sobre la propuesta de pagar el festival con recursos de tesorería, usted advierte que", "f": "Constitución Política, art. 345; Decreto 111 de 1996, arts. 15 y 16", "o": [["A", "es procedente si el secretario de hacienda expide un certificado de disponibilidad con cargo a la caja disponible.", "El certificado de disponibilidad garantiza la existencia de una apropiación (art. 71 del Decreto 111); no puede expedirse sobre un gasto que no tiene apropiación en el presupuesto.", false], ["B", "es procedente, porque el principio de unidad de caja permite atender cualquier gasto con los recursos que haya disponibles.", "La unidad de caja permite pagar con el conjunto de las rentas las apropiaciones autorizadas (art. 16 del Decreto 111), no gastos que no están en el presupuesto.", false], ["C", "no es procedente, porque no puede hacerse ningún gasto público que no figure en el presupuesto.", "El artículo 345 de la Constitución prohíbe hacer gastos públicos no incluidos en el presupuesto de gastos, y el principio de universalidad (art. 15 del Decreto 111 de 1996) dispone que ninguna autoridad puede efectuar gastos públicos que no figuren en el presupuesto.", true]]}]}, {"comp": "gestion_publica", "rol": "general", "tag": "Gestión pública y funcionamiento del Estado · Acción de tutela", "texto": "Usted es auxiliar administrativo de la oficina de atención al ciudadano de una procuraduría provincial. Una ciudadana en tratamiento contra el cáncer le cuenta que su EPS lleva dos meses sin entregarle un medicamento que su médico tratante le formuló y que, por esa demora, su salud se está deteriorando. Le pregunta qué mecanismo judicial puede usar para obtener una protección rápida, en cuánto tiempo debe decidir el juez y de cuánto tiempo dispondría para impugnar si el fallo le resulta desfavorable.", "items": [{"id": "GE-147", "niv": 1, "e": "El mecanismo judicial adecuado para la situación de la ciudadana es", "f": "Constitución Política, art. 86; Decreto 2591 de 1991, art. 42", "o": [["A", "la acción de tutela, por la amenaza a sus derechos fundamentales.", "El artículo 86 de la Constitución consagra la tutela para la protección inmediata de los derechos fundamentales vulnerados o amenazados, también frente a particulares encargados de la prestación de un servicio público; el artículo 42 del Decreto 2591 de 1991 la admite contra quienes prestan servicios de salud.", true], ["B", "la acción popular, porque la salud de la población es un derecho colectivo.", "La acción popular protege derechos e intereses colectivos; la situación descrita afecta el derecho individual y fundamental a la salud de la ciudadana, cuya vía es la tutela.", false], ["C", "la acción de cumplimiento, porque la EPS está incumpliendo una obligación legal.", "La acción de cumplimiento no procede para proteger derechos que pueden garantizarse mediante tutela (art. 9 de la Ley 393 de 1997); aquí está en juego el derecho fundamental a la salud.", false]]}, {"id": "GE-148", "niv": 2, "e": "Sobre el tiempo que tiene el juez para decidir, usted le informa que", "f": "Constitución Política, art. 86", "o": [["A", "el juez cuenta con treinta días, prorrogables si necesita practicar pruebas.", "La Constitución fija un término máximo de diez días entre la solicitud y la resolución, sin prórroga por pruebas (art. 86).", false], ["B", "el juez cuenta con quince días hábiles, igual que para resolver un derecho de petición.", "El término de quince días corresponde a la respuesta de peticiones por las autoridades, no al fallo de tutela, que debe proferirse dentro de los diez días del artículo 86.", false], ["C", "el juez debe resolver dentro de los diez días siguientes a la presentación de la solicitud.", "El artículo 86 de la Constitución dispone que en ningún caso podrán transcurrir más de diez días entre la solicitud de tutela y su resolución.", true]]}, {"id": "GE-149", "niv": 2, "e": "Si el fallo le resulta desfavorable, la ciudadana puede impugnarlo dentro de", "f": "Decreto 2591 de 1991, art. 31", "o": [["A", "los tres días siguientes a su notificación.", "El artículo 31 del Decreto 2591 de 1991 dispone que, dentro de los tres días siguientes a su notificación, el fallo de tutela podrá ser impugnado por el Defensor del Pueblo, el solicitante, la autoridad pública o el representante del órgano correspondiente.", true], ["B", "los cinco días siguientes a su notificación.", "No es el término que fija el Decreto 2591 de 1991 para impugnar el fallo de tutela; el artículo 31 señala tres días.", false], ["C", "los diez días siguientes a su notificación.", "Diez días es el término máximo para fallar (art. 86 de la Constitución), no el plazo para impugnar, que es de tres días (art. 31 del Decreto 2591).", false]]}]}, {"comp": "atencion_usuario", "rol": "profesional", "tag": "Atención al usuario · Niveles profesional, asesor y ejecutivo · Peticiones incompletas y desistimiento tácito", "texto": "Usted es profesional universitario de la Secretaría de Vivienda de un municipio y proyecta los actos de trámite y las decisiones del programa de mejoramiento de vivienda. El lunes 1 de marzo de 2027 se radicó la solicitud de inscripción de un ciudadano. Al revisarla, usted constata que falta el certificado de libertad y tradición del inmueble, documento exigido por el reglamento del programa, necesario para decidir y que la secretaría no tiene en sus archivos. La actuación puede continuar sin oponerse a la ley. No hay festivos en ese periodo.", "items": [{"id": "AU-119", "niv": 3, "e": "El último día para requerir al ciudadano que complete la solicitud es el", "f": "Ley 1755 de 2015, art. 1 (art. 17 de la Ley 1437 de 2011); cálculo de días hábiles", "o": [["A", "jueves 11 de marzo de 2027.", "Resulta de contar diez días calendario; el término es de días hábiles.", false], ["B", "viernes 12 de marzo de 2027.", "Resulta de contar el día de la radicación como primer día; el requerimiento se hace dentro de los diez días siguientes a la radicación.", false], ["C", "lunes 15 de marzo de 2027.", "El artículo 17 del CPACA ordena requerir dentro de los diez días siguientes a la radicación: 2 a 5 de marzo (4), 8 a 12 (9) y lunes 15 (10).", true]]}, {"id": "AU-120", "niv": 2, "e": "Si el ciudadano no logra conseguir el certificado dentro del plazo que se le conceda, puede", "f": "Ley 1755 de 2015, art. 1 (art. 17 de la Ley 1437 de 2011)", "o": [["A", "pedir, antes de que venza ese plazo, una prórroga hasta por un término igual.", "El artículo 17 del CPACA concede hasta un mes para completar la petición y permite pedir, antes de su vencimiento, prórroga hasta por un término igual.", true], ["B", "pedir la prórroga dentro de los diez días siguientes al vencimiento del plazo.", "La prórroga debe pedirse antes de que venza el plazo concedido; vencido este sin cumplir el requerimiento, se entiende que desistió.", false], ["C", "pedir una prórroga de quince días, que es el máximo que la ley admite para completar una petición.", "La prórroga no es de quince días: puede ser hasta por un término igual al concedido, que es de máximo un mes.", false]]}, {"id": "AU-121", "niv": 3, "e": "Si vence el plazo y el ciudadano no aporta el certificado ni pide prórroga, la secretaría debe", "f": "Ley 1755 de 2015, art. 1 (art. 17 de la Ley 1437 de 2011)", "o": [["A", "archivar la solicitud sin acto administrativo, porque el desistimiento tácito opera de pleno derecho.", "El artículo 17 del CPACA exige que la autoridad decrete el desistimiento y el archivo mediante acto administrativo motivado.", false], ["B", "declarar por acto motivado que desistió y archivar, con notificación personal y solo recurso de reposición.", "Así lo ordena el artículo 17 del CPACA, que además permite al ciudadano presentar de nuevo la solicitud con el lleno de los requisitos legales.", true], ["C", "negar de fondo la inscripción, decisión contra la cual proceden los recursos de reposición y apelación.", "La consecuencia legal no es una negativa de fondo, sino el desistimiento, y contra ese acto únicamente procede el recurso de reposición.", false]]}]}, {"comp": "atencion_usuario", "rol": "general", "tag": "Atención al usuario · Peticiones irrespetuosas, oscuras o reiterativas", "texto": "En la oficina de atención al ciudadano de una gobernación se reciben tres escritos. El primero contiene insultos contra el gobernador y su equipo, sin ninguna solicitud concreta. El segundo, firmado por un vecino que dejó su dirección, es una hoja manuscrita con frases sueltas sobre «el problema del agua», de la que no se logra entender qué pide ni a qué se refiere. El tercero es de una señora a quien el mes anterior se le negó la inscripción en un programa para adultos mayores porque no acreditó la edad mínima; ahora presenta la misma solicitud y anexa el registro civil que demuestra que ya cumplió esa edad.", "items": [{"id": "AU-122", "niv": 1, "e": "Frente al primer escrito, la ley permite a la gobernación", "f": "Ley 1755 de 2015, art. 1 (art. 19 de la Ley 1437 de 2011); Corte Constitucional, Sentencia C-951 de 2014", "o": [["A", "tramitarlo como petición general y responderlo dentro de los quince días siguientes.", "La ley autoriza el rechazo de las peticiones irrespetuosas; no obliga a tramitar un escrito ofensivo como si fuera una petición ordinaria.", false], ["B", "rechazarlo mediante una respuesta motivada, porque toda petición debe ser respetuosa.", "El artículo 19 del CPACA dispone que toda petición debe ser respetuosa so pena de rechazo; la Corte Constitucional, al revisar esa norma en la Sentencia C-951 de 2014, precisó que el rechazo debe ser motivado y excepcional.", true], ["C", "devolverlo para que su autor lo corrija dentro de los diez días siguientes.", "La devolución para corregir o aclarar es la regla para las peticiones oscuras, cuya finalidad u objeto no se comprende, no para las irrespetuosas.", false]]}, {"id": "AU-123", "niv": 3, "e": "Con el segundo escrito, lo procedente es", "f": "Ley 1755 de 2015, art. 1 (arts. 17 y 19 de la Ley 1437 de 2011)", "o": [["A", "devolverlo para que su autor lo aclare dentro de los diez días siguientes y archivarlo si no lo hace.", "El artículo 19 del CPACA ordena devolver la petición cuya finalidad u objeto no se comprende para que se corrija o aclare dentro de los diez días siguientes; si no se aclara, se archiva.", true], ["B", "archivarlo de inmediato, porque un escrito incomprensible no genera la obligación de responder.", "Antes de archivar, la ley exige devolver el escrito para que el interesado lo aclare; el archivo solo procede si no lo hace.", false], ["C", "requerir a su autor para que lo complete en el término máximo de un mes, so pena de desistimiento tácito.", "El requerimiento del artículo 17 es para peticiones incompletas cuyo objeto se entiende; cuando no se comprende qué se pide, aplica la devolución del artículo 19.", false]]}, {"id": "AU-124", "niv": 3, "e": "Respecto de la nueva solicitud de la señora, la gobernación", "f": "Ley 1755 de 2015, art. 1 (art. 19, inciso 2, de la Ley 1437 de 2011)", "o": [["A", "debe rechazarla, porque la negativa anterior quedó en firme y solo podía discutirse con los recursos.", "La firmeza de la negativa anterior no impide presentar una nueva petición que acredita el requisito que antes faltaba.", false], ["B", "puede limitarse a remitirla a la respuesta anterior, por tratarse de una petición reiterativa ya resuelta.", "La remisión a respuestas anteriores no aplica a las peticiones que se negaron por no acreditar requisitos cuando la nueva petición los subsana, como ocurre aquí.", false], ["C", "debe resolverla de fondo, porque la nueva petición subsana el requisito por el que se negó la anterior.", "El inciso 2 del artículo 19 del CPACA exceptúa de la remisión a respuestas anteriores las peticiones negadas por no acreditar requisitos, siempre que en la nueva se subsanen.", true]]}]}, {"comp": "atencion_usuario", "rol": "general", "tag": "Atención al usuario · Deberes especiales de los servidores de la Procuraduría", "texto": "Usted es servidor de una procuraduría provincial. Un campesino le cuenta que fue tres veces a la alcaldía de su municipio a presentar una solicitud escrita para que arreglen el camino de acceso a su vereda y que en todas le dijeron que no la recibían porque «no era el día de radicación». Le pide ayuda para que alguien reciba su solicitud. Además, quiere saber qué consecuencias tiene para los servidores de la alcaldía que no atiendan las peticiones ni respeten los términos para resolverlas.", "items": [{"id": "AU-134", "niv": 2, "e": "Frente a la solicitud que la alcaldía se abstuvo de recibir, usted", "f": "Ley 1755 de 2015, art. 1 (art. 23 de la Ley 1437 de 2011)", "o": [["A", "debe orientarlo para que la presente en la personería, única autoridad que puede recibirla en sustitución.", "El deber del artículo 23 del CPACA recae también en los servidores de la Procuraduría y de la Defensoría, no solo en los personeros.", false], ["B", "puede recibirla en sustitución de la alcaldía y cerciorarse de que esta la tramite debidamente.", "El artículo 23 del CPACA faculta a los servidores de la Procuraduría, de la Defensoría y a los personeros para recibir, en sustitución de las autoridades, las peticiones que estas se abstuvieron de recibir, y cerciorarse de su trámite.", true], ["C", "debe abstenerse de recibirla, porque la Procuraduría no es la autoridad competente para arreglar vías.", "La Procuraduría no resuelve la petición, pero sí la recibe en sustitución para garantizar el derecho de petición, que es lo que el campesino necesita.", false]]}, {"id": "AU-135", "niv": 2, "e": "Además de recibir la solicitud, los servidores de la Procuraduría pueden, si es necesario", "f": "Ley 1755 de 2015, art. 1 (art. 23 de la Ley 1437 de 2011)", "o": [["A", "intervenir ante la alcaldía para exigirle que cumpla sus deberes legales en el caso concreto.", "El artículo 23 del CPACA dispone que, si fuere necesario, estos servidores intervendrán ante las autoridades competentes para exigirles, en cada caso concreto, el cumplimiento de sus deberes legales.", true], ["B", "ordenar a la alcaldía, mediante acto administrativo, que ejecute la obra solicitada.", "La norma no otorga a la Procuraduría la facultad de ordenar la ejecución de obras; le permite intervenir para exigir el cumplimiento de los deberes legales.", false], ["C", "resolver de fondo la solicitud en lugar de la alcaldía si esta no lo hace a tiempo.", "La Procuraduría no sustituye a la alcaldía en la decisión de fondo; su papel es asistir al ciudadano y exigir que la autoridad competente cumpla.", false]]}, {"id": "AU-136", "niv": 1, "e": "Sobre la pregunta del campesino, la falta de atención a las peticiones y a los términos para resolverlas", "f": "Ley 1755 de 2015, art. 1 (arts. 14 y 31 de la Ley 1437 de 2011)", "o": [["A", "solo genera responsabilidad fiscal si ocasiona un daño al patrimonio del municipio.", "El CPACA califica esa conducta como falta disciplinaria, con independencia de que exista o no un daño patrimonial.", false], ["B", "da lugar únicamente a que la petición se entienda resuelta a favor del peticionario.", "El silencio con efecto de aceptación es excepcional (por ejemplo, en peticiones de documentos) y no excluye la responsabilidad disciplinaria del servidor.", false], ["C", "constituye falta disciplinaria para el servidor público responsable.", "El artículo 31 del CPACA dispone que la falta de atención a las peticiones y a los términos para resolver constituye falta para el servidor público y da lugar a sanciones según el régimen disciplinario.", true]]}]}, {"comp": "atencion_usuario", "rol": "general", "tag": "Atención al usuario · Datos sensibles y autorización para su tratamiento", "texto": "La Oficina de Atención al Ciudadano de una entidad del orden nacional rediseña su formulario web de PQRSD. El borrador pide como campos obligatorios el nombre, el documento de identidad y la dirección de notificación, y además la pertenencia étnica, la orientación sexual y si la persona tiene alguna discapacidad, con el fin de producir estadísticas de atención con enfoque diferencial. También se plantea capturar la huella dactilar de quienes acudan a la sede presencial, para agilizar su identificación en futuras visitas.", "items": [{"id": "AU-149", "niv": 1, "e": "De los datos que pide la entidad, son datos sensibles", "f": "Ley 1581 de 2012, art. 5", "o": [["A", "solo la orientación sexual, porque los demás datos se piden para el enfoque diferencial y no generan discriminación.", "La finalidad del tratamiento no cambia la naturaleza del dato: el origen étnico, la salud y los datos biométricos son sensibles según la ley.", false], ["B", "el documento de identidad y la dirección de notificación, porque permiten ubicar al titular.", "Son datos personales, pero no sensibles: la ley define como sensibles los que afectan la intimidad o cuyo uso indebido puede generar discriminación.", false], ["C", "la pertenencia étnica, la orientación sexual, la información sobre discapacidad y la huella dactilar.", "El artículo 5 de la Ley 1581 de 2012 incluye entre los datos sensibles los que revelan el origen racial o étnico, los relativos a la salud y a la vida sexual, y los datos biométricos, como la huella.", true]]}, {"id": "AU-150", "niv": 2, "e": "Al pedir la autorización para tratar la pertenencia étnica, la orientación sexual y la discapacidad, la entidad debe informar al titular, entre otros aspectos, que", "f": "Ley 1581 de 2012, arts. 9 y 12, literal b)", "o": [["A", "responder esas preguntas es facultativo, por tratarse de datos sensibles.", "El literal b) del artículo 12 de la Ley 1581 de 2012 obliga a informar al titular el carácter facultativo de la respuesta a las preguntas sobre datos sensibles.", true], ["B", "responderlas es obligatorio para radicar la PQRSD, porque la entidad debe caracterizar a sus usuarios.", "Condicionar la radicación a entregar datos sensibles desconoce el carácter facultativo de esas respuestas y el deber de recibir y radicar las peticiones.", false], ["C", "la autorización se entiende otorgada con el solo envío del formulario, sin necesidad de conservar prueba de ella.", "La autorización debe ser previa e informada y obtenerse por un medio que pueda ser objeto de consulta posterior (art. 9 de la Ley 1581 de 2012).", false]]}, {"id": "AU-151", "niv": 2, "e": "Para tratar la huella dactilar de los usuarios con la finalidad descrita, por regla general la entidad necesita", "f": "Ley 1581 de 2012, arts. 5 y 6", "o": [["A", "la autorización del jefe de la entidad, porque se trata de una base de datos pública.", "La autorización la da el titular del dato, no el jefe de la entidad responsable del tratamiento.", false], ["B", "la autorización explícita de cada titular, por tratarse de un dato biométrico.", "La huella es un dato biométrico y, por tanto, sensible (art. 5); el artículo 6 de la Ley 1581 de 2012 prohíbe tratar datos sensibles salvo, entre otros casos, con autorización explícita del titular.", true], ["C", "solo publicar un aviso de privacidad en la sede, por ser una entidad pública.", "El aviso de privacidad informa sobre las políticas de tratamiento, pero no reemplaza la autorización explícita que exige el tratamiento de datos sensibles.", false]]}]}, {"comp": "atencion_usuario", "rol": "general", "tag": "Atención al usuario · Quejas contra servidores y remisión al control disciplinario", "texto": "En la oficina de peticiones, quejas, reclamos, sugerencias y denuncias de la alcaldía de un municipio se reciben tres escritos: una queja firmada por una ciudadana contra un auxiliar administrativo de la Secretaría de Tránsito que, según ella, le pidió dinero para agilizar un trámite; un escrito anónimo que afirma, sin ningún detalle ni prueba, que «en la alcaldía todos son corruptos»; y una queja firmada contra el alcalde por presuntas irregularidades en la celebración de un contrato.", "items": [{"id": "AU-167", "niv": 2, "e": "Para efectos disciplinarios, la queja contra el auxiliar de la Secretaría de Tránsito debe remitirse a", "f": "Ley 1952 de 2019, arts. 2 y 93 (modificados por la Ley 2094 de 2021)", "o": [["A", "la Secretaría de Tránsito, para que el jefe inmediato del auxiliar decida si lo sanciona.", "El jefe inmediato no es el titular de la acción disciplinaria; esta corresponde a la oficina de control disciplinario interno o a los órganos de control con poder preferente.", false], ["B", "la contraloría municipal, porque la solicitud de dinero afecta el patrimonio público.", "La contraloría ejerce control fiscal, no disciplinario; la conducta denunciada se investiga disciplinariamente por los órganos competentes.", false], ["C", "la Oficina de Control Disciplinario Interno de la alcaldía, que conoce de las faltas de sus servidores.", "Según los artículos 2 y 93 del Código General Disciplinario, las oficinas de control disciplinario interno conocen de los asuntos disciplinarios contra los servidores de su entidad, sin perjuicio del poder disciplinario preferente de la Procuraduría y de las personerías.", true]]}, {"id": "AU-168", "niv": 2, "e": "Frente al escrito anónimo, es correcto afirmar que", "f": "Ley 1952 de 2019, art. 86; Ley 190 de 1995, art. 38; Ley 24 de 1992, art. 27", "o": [["A", "debe devolverse a su autor para que lo aclare dentro de los diez días siguientes, como ocurre con las peticiones oscuras.", "La devolución para aclarar supone un autor identificado; además, frente a anónimos la regla especial es la del artículo 86 del Código General Disciplinario.", false], ["B", "no da lugar a acción disciplinaria, salvo que existieran pruebas suficientes de la falta, y este escrito no las trae.", "Según el artículo 86 del Código General Disciplinario, en concordancia con el artículo 38 de la Ley 190 de 1995, el anónimo solo permite actuar de oficio si existen medios probatorios suficientes sobre la comisión de la falta; este escrito no los tiene.", true], ["C", "obliga a abrir indagación previa, porque toda denuncia sobre corrupción debe investigarse aunque sea anónima.", "El artículo 86 del Código General Disciplinario dispone que la acción no procede por anónimos, salvo que cumplan los requisitos mínimos de las Leyes 190 de 1995 y 24 de 1992.", false]]}, {"id": "AU-169", "niv": 3, "e": "La queja contra el alcalde debe remitirse a", "f": "Ley 1952 de 2019, art. 83", "o": [["A", "la Procuraduría General de la Nación, porque las personerías no ejercen poder disciplinario sobre el alcalde.", "El inciso 2 del artículo 83 del Código General Disciplinario dispone que el poder disciplinario de los personeros no se ejerce respecto del alcalde y de los concejales, y que esa competencia corresponde a la Procuraduría General de la Nación.", true], ["B", "la personería municipal, que tiene poder preferente frente a la administración municipal.", "El artículo 83 del Código General Disciplinario excluye expresamente al alcalde y a los concejales del poder disciplinario de los personeros.", false], ["C", "la Oficina de Control Disciplinario Interno de la alcaldía, que conoce de los procesos contra los servidores de la entidad.", "El alcalde es el jefe de la entidad; la ley atribuye la competencia disciplinaria sobre los alcaldes a la Procuraduría General de la Nación.", false]]}]}, {"comp": "gestion_documental", "rol": "general", "tag": "Gestión documental · Instrumentos archivísticos", "texto": "Usted es profesional de apoyo de la Oficina de Planeación de la Procuraduría y participa en una mesa de trabajo con el grupo de gestión documental. En la reunión se mencionan varios instrumentos: el que fija cuánto tiempo permanece cada serie en el archivo de gestión y en el central; el que muestra, con códigos, cómo se divide el fondo en secciones, subsecciones, series y subseries; y el que se necesita para valorar un fondo acumulado de expedientes producidos entre 1996 y 2005, periodo en el que la entidad no tenía tablas de retención. Los asistentes discuten cómo se llama cada uno.", "items": [{"id": "GD-107", "niv": 1, "e": "El instrumento que lista las series con sus tipos documentales y asigna el tiempo de permanencia en cada etapa del ciclo vital es", "f": "Ley 594 de 2000, arts. 3, 24 y 26; Acuerdo 001 de 2024 del AGN, art. 4.3.1.4", "o": [["A", "el inventario documental.", "El inventario describe las unidades documentales existentes para controlarlas en sus diferentes fases (art. 26, Ley 594 de 2000); no asigna tiempos de permanencia.", false], ["B", "la tabla de retención documental (TRD).", "El artículo 3 de la Ley 594 de 2000 define la TRD como el listado de series con sus tipos documentales a las que se asigna el tiempo de permanencia en cada etapa del ciclo vital; su adopción es obligatoria (art. 24).", true], ["C", "el cuadro de clasificación documental (CCD).", "El CCD representa la jerarquía codificada de las agrupaciones documentales del fondo (art. 4.3.1.4 del Acuerdo 001 de 2024), pero no fija tiempos de retención.", false]]}, {"id": "GD-108", "niv": 2, "e": "El instrumento que representa, codificadas y jerarquizadas, las secciones, subsecciones, series y subseries en que se divide el fondo es", "f": "Decreto 1080 de 2015, art. 2.8.2.5.8; Acuerdo 001 de 2024 del AGN, art. 4.3.1.4", "o": [["A", "el cuadro de clasificación documental (CCD).", "El artículo 4.3.1.4 del Acuerdo 001 de 2024 del AGN dispone que las agrupaciones documentales se codifican representando la jerarquía del fondo (secciones, subsecciones, series y subseries) conforme al CCD, instrumento previsto en el artículo 2.8.2.5.8 del Decreto 1080 de 2015.", true], ["B", "la tabla de control de acceso a los documentos.", "Las tablas de control de acceso establecen derechos y restricciones de acceso y seguridad de los documentos (art. 2.8.2.5.8, lit. i, Decreto 1080 de 2015), no la clasificación del fondo.", false], ["C", "el programa de gestión documental (PGD).", "El PGD es el instrumento que planea los procesos de la gestión documental a corto, mediano y largo plazo (art. 2.8.2.5.10, Decreto 1080 de 2015); no representa la estructura codificada del fondo.", false]]}, {"id": "GD-109", "niv": 2, "e": "Para valorar el fondo acumulado de 1996 a 2005, producido cuando la entidad no tenía tablas de retención, el instrumento que corresponde elaborar es", "f": "Acuerdo 001 de 2024 del AGN, arts. 1.2.4 y 5.1.1.1", "o": [["A", "una TRD con fecha retroactiva, porque las tablas de retención se aplican a toda la documentación de la entidad.", "Las TRD se elaboran para valorar los documentos que la entidad debe producir según sus funciones (art. 5.1.1.1, num. 1, Acuerdo 001 de 2024); para periodos sin TRD se usa otro instrumento.", false], ["B", "el plan institucional de archivos (PINAR), que fija los tiempos de retención de los fondos antiguos.", "El PINAR es un instrumento de planeación de la función archivística (art. 1.2.4, Acuerdo 001 de 2024); no valora series ni fija tiempos de retención.", false], ["C", "una tabla de valoración documental (TVD).", "El artículo 5.1.1.1, numeral 2, del Acuerdo 001 de 2024 del AGN establece que las TVD se elaboran para documentos ya producidos en periodos de la historia de la entidad que no cuentan con TRD (fondos acumulados).", true]]}]}, {"comp": "gestion_documental", "rol": "general", "tag": "Gestión documental · Disposición final: conservación total, selección y digitalización", "texto": "En el archivo central de la Procuraduría se hace una jornada de inducción para el personal nuevo. La coordinadora explica que la TRD de cada dependencia fija, para cada serie o subserie, una disposición final: conservación total (CT), selección (S) o eliminación (E). Luego presenta una propuesta que recibió de otra dependencia: digitalizar los expedientes de una subserie que, según la TRD, se conserva diez años en total y luego se elimina; una vez digitalizados, eliminar de inmediato los originales en papel y reducir a cinco años el tiempo de retención, «porque las imágenes ya quedan guardadas en el sistema».", "items": [{"id": "GD-128", "niv": 1, "e": "Las series o subseries con disposición final de conservación total (CT) son aquellas que", "f": "Acuerdo 001 de 2024 del AGN, arts. 4.4.4, 4.5.2 y 4.5.4", "o": [["A", "pasan a guardarse indefinidamente por su valor como testimonio para la historia, la ciencia o la cultura.", "El art. 4.5.2 del Acuerdo 001 de 2024 del AGN define la conservación total atendiendo a los valores históricos, socioculturales, científicos o estéticos de los documentos, que justifican su permanencia.", true], ["B", "se eliminan cuando cumplen su tiempo de retención en el archivo central.", "La eliminación corresponde a la disposición final E, no a la conservación total (art. 4.5.4 del Acuerdo 001 de 2024 del AGN).", false], ["C", "permanecen en el archivo central hasta que el comité decida, caso por caso, si se seleccionan o se eliminan.", "La disposición final de conservación total ya queda fijada en la TRD o TVD (art. 4.5.2 del Acuerdo 001 de 2024 del AGN); no se decide caso por caso, y estas series pasan al archivo histórico (art. 4.4.4).", false]]}, {"id": "GD-129", "niv": 2, "e": "La disposición final de selección (S) se aplica a series o subseries", "f": "Acuerdo 001 de 2024 del AGN, arts. 4.5.2, 4.5.3 y 4.5.4", "o": [["A", "formadas por documentos de apoyo que no figuran en la TRD.", "Los documentos de apoyo no se consignan en la TRD y, por tanto, no reciben una disposición final de selección; pueden eliminarse cuando pierden su utilidad, con constancia en acta (art. 4.5.4, par. 2, del Acuerdo 001 de 2024 del AGN).", false], ["B", "de valor histórico excepcional, de las que se conserva la totalidad de los expedientes producidos.", "Conservar la totalidad corresponde a la conservación total (art. 4.5.2 del Acuerdo 001 de 2024 del AGN); la selección conserva solo una muestra representativa.", false], ["C", "muy voluminosas o con información repetida en otras, de las que se guarda una muestra representativa.", "El art. 4.5.3 del Acuerdo 001 de 2024 del AGN aplica la selección a series y subseries de gran volumen o cuyo contenido informativo se repite o se encuentra registrado en otras, con sustento en tamaños de muestra y métodos de selección.", true]]}, {"id": "GD-130", "niv": 3, "e": "Sobre la propuesta de la otra dependencia, es acertado concluir que", "f": "Acuerdo 001 de 2024 del AGN, art. 4.3.2.5, par.", "o": [["A", "es viable si las imágenes quedan en el SGDEA con metadatos y el comité aprueba la propuesta.", "Ni la aprobación del comité ni el almacenamiento de las imágenes permiten eliminar originales por haber sido digitalizados o cambiar por esa razón la retención (art. 4.3.2.5, par., del Acuerdo 001 de 2024 del AGN).", false], ["B", "no es viable: digitalizar no cambia el tiempo fijado en la TRD ni autoriza destruir los originales.", "El parágrafo del art. 4.3.2.5 del Acuerdo 001 de 2024 del AGN dispone que la digitalización no puede aumentar ni disminuir el tiempo de retención de la TRD y que no pueden eliminarse documentos originales con el argumento de que han sido digitalizados.", true], ["C", "es viable en cuanto a reducir la retención, pero no en cuanto a eliminar los originales antes de tiempo.", "La digitalización tampoco puede disminuir el tiempo de retención establecido en la TRD (art. 4.3.2.5, par., del Acuerdo 001 de 2024 del AGN); ninguna de las dos partes de la propuesta es procedente.", false]]}]}, {"comp": "gestion_documental", "rol": "profesional", "tag": "Gestión documental · Niveles profesional, asesor y ejecutivo · PGD, política de gestión documental y control interno", "texto": "Usted es profesional de la secretaría general de la Procuraduría y participa en una mesa de trabajo sobre gestión documental. Un asistente propone formular el Programa de Gestión Documental (PGD) solo para el año en curso y en un documento aparte del Plan Estratégico Institucional, «para no complicar la planeación». La representante de control interno afirma que su oficina no incluye temas de archivo en sus auditorías, porque eso «le toca al Archivo General de la Nación». Por último, el grupo de gestión documental presenta un borrador de la política institucional de gestión documental y pregunta cómo debe aprobarse y darse a conocer.", "items": [{"id": "GD-141", "niv": 2, "e": "Frente a la propuesta del asistente sobre el PGD, la norma dispone que este debe formularse", "f": "Decreto 1080 de 2015, art. 2.8.2.5.10", "o": [["A", "a corto, mediano y largo plazo, como parte del Plan Estratégico Institucional y del Plan de Acción Anual.", "El art. 2.8.2.5.10 del Decreto 1080 de 2015 obliga a todas las entidades del Estado a formular un PGD a corto, mediano y largo plazo, como parte del Plan Estratégico Institucional y del Plan de Acción Anual.", true], ["B", "a corto, mediano y largo plazo, en un documento que adopta directamente el Archivo General de la Nación.", "Cada entidad formula su propio PGD como parte de su planeación institucional (art. 2.8.2.5.10 del Decreto 1080 de 2015); el AGN no lo adopta por ella.", false], ["C", "para una sola vigencia anual, en un documento independiente del Plan Estratégico Institucional y sin relación con el Plan de Acción.", "El PGD no es un documento aislado de una vigencia: se formula a corto, mediano y largo plazo e integrado al Plan Estratégico Institucional y al Plan de Acción Anual (art. 2.8.2.5.10 del Decreto 1080 de 2015).", false]]}, {"id": "GD-142", "niv": 3, "e": "Sobre lo dicho por la representante de control interno, es acertado afirmar que esa oficina", "f": "Acuerdo 001 de 2024 del AGN, art. 1.4.3; Decreto 1080 de 2015, art. 2.8.2.5.11", "o": [["A", "solo puede revisar el tema si el comité se lo solicita por escrito.", "La inclusión del tema en el plan anual de auditorías es un deber propio de control interno (art. 1.4.3 del Acuerdo 001 de 2024 del AGN), no una actuación sujeta a solicitud del comité.", false], ["B", "no tiene competencia en el tema, porque verificar el cumplimiento de la normativa archivística es función exclusiva del AGN.", "Además de la inspección que ejerce el AGN, el art. 1.4.3 del Acuerdo 001 de 2024 asigna a los jefes de control interno la tarea de incluir en su plan anual de auditorías la verificación del cumplimiento del Acuerdo.", false], ["C", "debe incorporar en su plan anual de auditorías acciones para verificar el cumplimiento de la normativa archivística.", "El art. 1.4.3 del Acuerdo 001 de 2024 del AGN, en concordancia con el art. 2.8.2.5.11 del Decreto 1080 de 2015, dispone que los jefes de control interno incorporen en su plan anual de auditorías acciones para verificar el cumplimiento del Acuerdo en desarrollo del PGD.", true]]}, {"id": "GD-143", "niv": 2, "e": "La política institucional de gestión documental debe", "f": "Acuerdo 001 de 2024 del AGN, art. 1.2.5", "o": [["A", "adoptarse por el Archivo General de la Nación mediante resolución dirigida a la entidad.", "Cada entidad formula su propia política institucional; el AGN fija lineamientos de referencia (art. 1.2.5, par. 1, del Acuerdo 001 de 2024), pero la aprobación corresponde al comité de la entidad (par. 2).", false], ["B", "ser aprobada por el comité de archivo o el institucional de gestión y desempeño, o quien haga sus veces, y publicarse en la página web.", "El art. 1.2.5, par. 2, del Acuerdo 001 de 2024 del AGN dispone que la política institucional de gestión documental debe ser aprobada por el Comité de archivo o el Comité Institucional de Gestión y Desempeño, o quien haga sus veces, y publicada en la página web de la entidad.", true], ["C", "ser aprobada por el comité competente y mantenerse como documento interno, sin publicarse en la página web.", "Además de la aprobación del comité, el art. 1.2.5, par. 2, del Acuerdo 001 de 2024 del AGN exige publicarla en la página web de la entidad.", false]]}]}, {"comp": "documentos_oficina", "rol": "profesional", "tag": "Elaboración de documentos de oficina · Niveles profesional, asesor y ejecutivo · Redacción de cartas al ciudadano: persona gramatical, léxico y asunto", "texto": "Usted es profesional de una procuraduría provincial y revisa una carta de respuesta a un ciudadano que presentó una queja. El borrador mezcla «yo considero» con «esta procuraduría estima», y en un párrafo tutea al destinatario. Además, explica la decisión con términos técnicos como «auto inhibitorio» y «falta de legitimación», sin aclarar qué significan en la práctica para el ciudadano. La línea del asunto aparece como «ASUNTO: RESPUESTA», en negrilla y subrayada. La entidad sigue los lineamientos de la GTC 185 y la Guía de lenguaje claro del DNP.", "items": [{"id": "DO-131", "niv": 2, "e": "En cuanto a la persona gramatical y el trato al destinatario, la carta debe redactarse en", "f": "Guías institucionales que citan la GTC 185: UIS GGD.10, Senado GD-IT01 (ver notas-do.md)", "o": [["A", "primera persona del plural, con tratamiento de usted para el destinatario.", "Las guías de la UIS y del Senado, basadas en la GTC 185, recomiendan redactar la carta en primera persona del plural y con tratamiento de usted, lo que da unidad al texto y respeto al destinatario.", true], ["B", "primera persona del singular y con tuteo, para generar cercanía.", "Las guías basadas en la GTC 185 recomiendan la primera persona del plural y el tratamiento de usted; el tuteo no es el trato adecuado en una comunicación oficial.", false], ["C", "tercera persona impersonal, evitando dirigirse directamente al ciudadano.", "Las guías consultadas no prescriben un texto impersonal; indican la primera persona del plural y el tratamiento de usted hacia el destinatario.", false]]}, {"id": "DO-132", "niv": 3, "e": "Frente a los términos técnicos del borrador, lo más adecuado según la Guía de lenguaje claro del DNP es", "f": "DNP, Guía de lenguaje claro para servidores públicos de Colombia (2015)", "o": [["A", "agregar citas de jurisprudencia para que el ciudadano entienda la decisión.", "Las citas añaden más lenguaje técnico y alargan el texto; la guía del DNP recomienda pensar en el lector y usar palabras sencillas.", false], ["B", "conservarlos sin explicación, porque la respuesta es un documento jurídico y debe usar el lenguaje propio del derecho.", "La guía del DNP recomienda palabras sencillas que el lector entienda; usar tecnicismos sin explicar impide que el ciudadano comprenda qué se decidió.", false], ["C", "usar palabras sencillas y explicar qué significa en la práctica la decisión para el ciudadano.", "La Guía de lenguaje claro del DNP recomienda conocer al lector y preferir palabras sencillas y comunes; explicar en términos cotidianos qué implica la decisión permite que el ciudadano la entienda.", true]]}, {"id": "DO-133", "niv": 2, "e": "La línea del asunto de la carta debe escribirse con", "f": "Guías institucionales que citan la GTC 185: UIS GGD.10, Senado GD-IT01, Alcaldía de Mitú (ver notas-do.md)", "o": [["A", "la abreviatura «Ref.», seguida solo del número de radicado.", "El asunto es una síntesis del contenido de la comunicación; el número de radicado no lo reemplaza y las guías no usan la abreviatura «Ref.» para esa línea.", false], ["B", "la palabra «Asunto:» con mayúscula inicial y dos puntos, sin negrilla ni subrayado, seguida de una síntesis del tema.", "Las guías de la UIS, del Senado y de la Alcaldía de Mitú, basadas en la GTC 185, indican escribir «Asunto» con mayúscula inicial y dos puntos, sin negrilla ni subrayado, seguido de la síntesis del contenido.", true], ["C", "«ASUNTO:» en mayúscula sostenida, en negrilla y subrayado, para destacarlo.", "En la carta, las guías basadas en la GTC 185 indican «Asunto» con mayúscula inicial y sin resaltados; la mayúscula sostenida es propia del encabezado del memorando.", false]]}]}, {"comp": "documentos_oficina", "rol": "general", "tag": "Elaboración de documentos de oficina · Abreviaturas, símbolos y porcentajes", "texto": "Usted es auxiliar administrativo de una procuraduría provincial y revisa el informe de una comisión de servicio a un municipio. El borrador dice: «La Sra Gómez, personera municipal, nos recibió a las 9:00 am. Para llegar recorrimos 25 Kms. por carretera destapada. En la visita se revisó el quince % de los expedientes de contratación». El jefe le pide corregir la escritura de las abreviaturas, los símbolos y las cifras antes de enviar el informe, conforme a las normas ortográficas de la Real Academia Española.", "items": [{"id": "DO-137", "niv": 1, "e": "La abreviatura de «señora» debe escribirse", "f": "RAE, Ortografía de la lengua española y Libro de estilo: abreviaturas y símbolos (ver notas-do.md)", "o": [["A", "«Sra.», con punto final.", "La RAE señala que las abreviaturas se escriben con punto abreviativo; a diferencia de los símbolos, no se escriben sin él.", true], ["B", "«Sra», sin punto, porque va seguida del apellido.", "Las abreviaturas se cierran con punto, con independencia de la palabra que las siga (RAE, Ortografía).", false], ["C", "«SRA.», en mayúscula sostenida, por tratarse de un tratamiento.", "Los tratamientos abreviados se escriben con mayúscula inicial y el resto en minúscula (Sra., Sr., Dr.); la mayúscula sostenida no corresponde (RAE).", false]]}, {"id": "DO-138", "niv": 2, "e": "La hora de la reunión debe escribirse", "f": "RAE, Ortografía de la lengua española y Libro de estilo: abreviaturas y símbolos (ver notas-do.md)", "o": [["A", "«9:00 A.M.», en mayúsculas y sin espacio.", "La abreviatura se escribe en minúscula y con espacio entre sus elementos: «a. m.» (RAE).", false], ["B", "«9:00 am», sin puntos ni espacio.", "«a. m.» es una abreviatura de la expresión latina ante meridiem; como abreviatura, lleva punto y espacio entre sus componentes (RAE).", false], ["C", "«9:00 a. m.», con punto tras cada letra y un espacio entre ellas.", "La RAE recoge «a. m.» como abreviatura de ante meridiem y señala que en las abreviaturas de varios elementos se deja un espacio entre ellos.", true]]}, {"id": "DO-139", "niv": 2, "e": "La distancia recorrida debe escribirse", "f": "RAE, Ortografía de la lengua española y Libro de estilo: abreviaturas y símbolos (ver notas-do.md)", "o": [["A", "«25 kms.», con s de plural y punto abreviativo.", "Los símbolos no llevan punto ni marca de plural: se escribe 25 km, no 25 kms. (RAE, Libro de estilo).", false], ["B", "«25 km», sin punto, sin plural y en minúscula.", "Según la RAE, los símbolos se escriben sin punto, no varían en plural y los de unidades de medida van en minúscula; además se separan de la cifra con un espacio.", true], ["C", "«25 Km.», con mayúscula inicial por ser una unidad del sistema internacional.", "El símbolo del kilómetro es «km», en minúscula y sin punto; solo van en mayúscula los símbolos derivados de nombres propios y los prefijos desde mega- (RAE).", false]]}, {"id": "DO-140", "niv": 3, "e": "La expresión del porcentaje queda correctamente escrita así", "f": "RAE, Ortografía de la lengua española y Libro de estilo: abreviaturas y símbolos (ver notas-do.md)", "o": [["A", "«el 15% de los expedientes», con el símbolo pegado a la cifra.", "Aunque es frecuente verlo pegado, la RAE indica que el símbolo % se separa de la cifra con un espacio, como el resto de los símbolos."
