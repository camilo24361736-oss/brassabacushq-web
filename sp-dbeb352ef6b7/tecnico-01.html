<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulacro 1 · Técnico, administrativo y operativo · Procuraduría 2027</title>
<style>body{overflow-wrap:anywhere}
:root{--bg:#f6f8fb;--card:#fff;--ink:#1d2433;--mute:#5a6478;--line:#dbe1ea;--pri:#0b3d6e;--pri2:#1660a8;--ok:#0d6b3a;--okbg:#e6f4ec;--no:#9b1c1c;--nobg:#fbeaea;--sel:#e8f0fa}
@media (prefers-color-scheme: dark){:root{--bg:#10151d;--card:#18202b;--ink:#e6ebf2;--mute:#9aa6b8;--line:#2a3545;--pri:#7fb3ea;--pri2:#9cc6f2;--ok:#7fd3a3;--okbg:#16301f;--no:#f2a3a3;--nobg:#3a1c1c;--sel:#1e2d40}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px}
.hwrap{max-width:860px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
h1{font-size:17px;margin:0;color:var(--pri)}
.stat{font-size:14px;color:var(--mute)}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--pri)}
.timer.low{color:var(--no)}
main{max-width:860px;margin:0 auto;padding:16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin:0 0 16px}
.caso{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--pri);border-radius:10px;padding:14px 16px;margin:22px 0 10px}
.tag{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--pri);font-weight:700}
.caso p{margin:6px 0 0;white-space:pre-line}
.item{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0}
.enun{margin:0 0 8px}
.n{font-weight:700;color:var(--pri)}
.niv{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-right:4px;white-space:nowrap}
.op{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:6px 0;cursor:pointer;background:transparent;width:100%;text-align:left;color:inherit;font:inherit}
.op:hover{border-color:var(--pri2)}
.op .l{font-weight:700;min-width:20px}
.op.sel{background:var(--sel);border-color:var(--pri2)}
.op.ok{background:var(--okbg);border-color:var(--ok)}
.op.no{background:var(--nobg);border-color:var(--no)}
.op[disabled]{cursor:default}
.just{font-size:14px;margin:8px 0 0;padding:8px 10px;border-top:1px dashed var(--line)}
.just div{margin:4px 0}
.just .okt{color:var(--ok);font-weight:700}
.just .not{color:var(--no);font-weight:700}
.src{font-size:13px;color:var(--mute);margin-top:6px}
button.btn{background:var(--pri);color:var(--card);border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer}
button.btn.sec{background:transparent;color:var(--pri);border:1px solid var(--pri)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
select{font:inherit;padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);max-width:100%}
table{border-collapse:collapse;width:100%;font-size:15px}
td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
.big{font-size:40px;font-weight:800;color:var(--pri);line-height:1.1}
.aviso{font-size:13px;color:var(--mute)}
.hide{display:none !important}
.res-ok{color:var(--ok);font-weight:700}.res-no{color:var(--no);font-weight:700}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal .panel{max-width:420px}
footer{max-width:860px;margin:0 auto;padding:8px 16px 40px;font-size:12px;color:var(--mute)}
</style>
</head>
<body>
<header><div class="hwrap"><h1 id="tit"></h1><div class="row stat"><span id="prog"></span><span id="timer" class="timer"></span></div></div></header>
<main id="main"></main>
<div id="modal" class="modal hide"><div class="panel"><p id="mtxt"></p><div class="row"><button class="btn" id="msi">Sí, calificar</button><button class="btn sec" id="mno">Seguir respondiendo</button></div></div></div>
<footer><a href="./" style="color:var(--pri);font-weight:600">← Volver al menú</a><br><br>Material de preparación independiente. No está afiliado a la Procuraduría General de la Nación, a la Universidad de Antioquia ni a ninguna entidad pública, y no contiene preguntas reales de la prueba.</footer>
<script>
const DATA = [{"comp": "estructura_pgn", "rol": "tecnico", "tag": "Estructura y funciones de la Procuraduría · Niveles técnico, administrativo y operativo · Atención al ciudadano y registro de sanciones", "texto": "Usted es técnico en el nivel central de la Procuraduría y apoya la ventanilla de atención. Una aspirante a un empleo en una alcaldía solicita su certificado de antecedentes disciplinarios. Luego llega un oficio de un juzgado que, en un fallo de tutela, ordena retirar de la base de datos de la entidad el registro de una sanción impuesta a un exconcejal. Finalmente, un ciudadano sancionado hace más de diez años pregunta qué autoridad de la Procuraduría ordena la cancelación de antecedentes disciplinarios cuando ello es procedente.", "items": [{"id": "PG-119", "niv": 1, "e": "En el nivel central, la dependencia encargada de expedir el certificado de antecedentes disciplinarios que pide la aspirante es", "f": "Decreto Ley 262 de 2000, arts. 15, 18A y 18B num. 12 (adicionados por el art. 9 del Decreto Ley 1851 de 2021)", "o": [["A", "la División de Registro de Sanciones y Causas de Inhabilidad.", "Esta división registra las sanciones y atiende los requerimientos sobre ese registro (art. 18A), pero la expedición de certificados está asignada a la División de Relacionamiento con el Ciudadano (art. 18B, num. 12).", false], ["B", "la División de Relacionamiento con el Ciudadano.", "El artículo 18B, num. 12, del Decreto Ley 262 de 2000, adicionado por el artículo 9 del Decreto Ley 1851 de 2021, asigna a la División de Relacionamiento con el Ciudadano la expedición de los certificados de antecedentes disciplinarios.", true], ["C", "la Oficina Jurídica.", "Las funciones de la Oficina Jurídica (art. 15 del Decreto Ley 262 de 2000) son de asesoría, representación judicial y contratación; no incluyen expedir certificados de antecedentes.", false]]}, {"id": "PG-120", "niv": 2, "e": "El oficio del juzgado que ordena retirar el registro de la sanción debe dirigirse para su cumplimiento a", "f": "Decreto Ley 262 de 2000, arts. 18A num. 5 y 19 (art. 18A adicionado por el art. 9 del Decreto Ley 1851 de 2021)", "o": [["A", "la procuraduría provincial que impuso la sanción, que debe revocarla antes de retirar el registro.", "El fallo de tutela se cumple directamente. El retiro del registro corresponde a la División de Registro de Sanciones (art. 18A, num. 5), sin que deba esperarse una revocatoria del fallo disciplinario.", false], ["B", "la División de Documentación, que conserva los expedientes y archivos de la entidad.", "La División de Documentación maneja información normativa y archivo (art. 19 del Decreto Ley 262 de 2000), no el registro de sanciones.", false], ["C", "la División de Registro de Sanciones y Causas de Inhabilidad.", "El artículo 18A, num. 5, del Decreto Ley 262 de 2000 asigna a esa división dar cumplimiento a las providencias de revocatoria directa, fallos de tutela y demás decisiones judiciales que ordenen retirar un registro.", true]]}, {"id": "PG-121", "niv": 2, "e": "A la pregunta del ciudadano sancionado, usted responde que, cuando procede, ordenar la cancelación de antecedentes disciplinarios corresponde", "f": "Decreto Ley 262 de 2000, arts. 17 num. 12 (modificado por el art. 7 del Decreto Ley 1851 de 2021) y 18B", "o": [["A", "al Viceprocurador General.", "El artículo 17, num. 12, del Decreto Ley 262 de 2000, modificado por el artículo 7 del Decreto Ley 1851 de 2021, asigna al Viceprocurador la función de ordenar la cancelación de antecedentes disciplinarios cuando sea procedente.", true], ["B", "al jefe de la División de Relacionamiento con el Ciudadano.", "Esa división expide certificados y gestiona peticiones (art. 18B), pero no ordena cancelaciones de antecedentes.", false], ["C", "a la Sala Disciplinaria Ordinaria de Juzgamiento.", "Las Salas Disciplinarias tienen competencias procesales (art. 22 del Decreto Ley 262 de 2000), no la de ordenar cancelaciones de antecedentes, que el artículo 17, num. 12, asigna al Viceprocurador.", false]]}]}, {"comp": "estructura_pgn", "rol": "general", "tag": "Estructura y funciones de la Procuraduría · Estructura orgánica de la PGN", "texto": "La Oficina de Planeación le pide a usted, profesional universitario, actualizar el organigrama de la Procuraduría que se publicará en la intranet, de acuerdo con el artículo 2 del Decreto Ley 262 de 2000, modificado por el Decreto Ley 1851 de 2021. En el borrador recibido aparecen tres dudas marcadas en rojo: de qué despacho depende la Oficina de Selección y Carrera, en qué parte de la estructura se ubican las procuradurías judiciales y cómo se conforma el nivel territorial.", "items": [{"id": "PG-122", "niv": 1, "e": "En el organigrama, la Oficina de Selección y Carrera debe aparecer como dependencia", "f": "Decreto Ley 262 de 2000, art. 2 (modificado por el art. 1 del Decreto Ley 1851 de 2021)", "o": [["A", "del Despacho del Procurador General.", "El artículo 2, num. 1.1.6, del Decreto Ley 262 de 2000, modificado por el artículo 1 del Decreto Ley 1851 de 2021, ubica la Oficina de Selección y Carrera en el Despacho del Procurador General.", true], ["B", "de la Secretaría General, junto con la División de Gestión Humana.", "La Secretaría General agrupa las divisiones de Gestión Humana, Administrativa y Financiera (art. 2, num. 1.6), pero la Oficina de Selección y Carrera depende del Despacho del Procurador (num. 1.1.6).", false], ["C", "del Despacho del Viceprocurador General, junto con la División de Documentación.", "Del Despacho del Viceprocurador dependen la Dirección de Apoyo Estratégico y las divisiones de Relacionamiento con el Ciudadano, Documentación y Seguridad (art. 2, num. 1.2), no la Oficina de Selección y Carrera.", false]]}, {"id": "PG-123", "niv": 2, "e": "Las procuradurías judiciales I y II deben ubicarse en el organigrama", "f": "Decreto Ley 262 de 2000, arts. 2 y 36 (art. 2 modificado por el art. 1 del Decreto Ley 1851 de 2021)", "o": [["A", "en el nivel territorial, al mismo nivel de las procuradurías provinciales.", "El nivel territorial solo comprende las procuradurías regionales, distritales y provinciales (art. 2, num. 2); las judiciales hacen parte del nivel central.", false], ["B", "dentro de las procuradurías delegadas de intervención, en el nivel central.", "El artículo 2 del Decreto Ley 262 de 2000, modificado por el Decreto Ley 1851 de 2021, ubica las procuradurías judiciales I y II en el num. 1.4.5.1, dentro de las procuradurías delegadas de intervención.", true], ["C", "como dependencias del Despacho del Viceprocurador, que coordina la intervención judicial.", "El Despacho del Viceprocurador no incluye las procuradurías judiciales (art. 2, num. 1.2); la coordinación de la intervención judicial está a cargo de procuradores delegados (art. 36).", false]]}, {"id": "PG-124", "niv": 1, "e": "El nivel territorial de la Procuraduría está conformado por", "f": "Decreto Ley 262 de 2000, art. 2 num. 2 (modificado por el art. 1 del Decreto Ley 1851 de 2021)", "o": [["A", "las procuradurías departamentales, las municipales y las personerías.", "La estructura de la PGN no tiene procuradurías departamentales ni municipales, y las personerías no son dependencias de la Procuraduría, aunque ejerzan el Ministerio Público en el municipio.", false], ["B", "las procuradurías regionales, las provinciales y las procuradurías judiciales.", "Las procuradurías judiciales pertenecen al nivel central, dentro de las delegadas de intervención (art. 2, num. 1.4.5.1); además, la opción omite las procuradurías distritales.", false], ["C", "las procuradurías regionales, distritales y provinciales, cada una con dependencias de instrucción y de juzgamiento.", "El artículo 2, num. 2, del Decreto Ley 262 de 2000, modificado por el Decreto Ley 1851 de 2021, conforma el nivel territorial con procuradurías regionales, distritales y provinciales, divididas en instrucción y juzgamiento.", true]]}]}, {"comp": "estructura_pgn", "rol": "general", "tag": "Estructura y funciones de la Procuraduría · Poder disciplinario preferente", "texto": "En un municipio de cuarta categoría, la oficina de control disciplinario interno de la alcaldía adelanta una investigación contra un auxiliar de la secretaría de obras por la pérdida de equipos. La procuraduría provincial considera que la actuación avanza con lentitud. Por su parte, el personero municipal también quiere asumir esa investigación. Una semana después, la personería recibe una queja contra un concejal del mismo municipio por presunta participación indebida en un contrato, y el personero pregunta si puede tramitarla.", "items": [{"id": "PG-143", "niv": 1, "e": "En ejercicio del poder disciplinario preferente, la Procuraduría puede, respecto de la investigación que adelanta el control interno de la alcaldía,", "f": "Constitución Política, art. 277 num. 6; Ley 1952 de 2019, arts. 2 y 3", "o": [["A", "tomar la actuación, continuarla o enviarla a otra autoridad competente, y también conocerla en segunda instancia.", "El artículo 3 de la Ley 1952 de 2019 dispone que, en ejercicio del poder preferente, la PGN podrá iniciar, proseguir o remitir cualquier investigación o juzgamiento de competencia del control interno disciplinario y de las personerías, e igualmente asumir el proceso en segunda instancia; el artículo 277, num. 6, de la Constitución consagra ese poder.", true], ["B", "asumirla siempre que el investigado lo solicite y la oficina de control interno manifieste que no puede tramitarla.", "El poder preferente se ejerce por decisión de la Procuraduría (art. 3 de la Ley 1952 de 2019); no depende de una solicitud del investigado ni de que el control interno se declare incapaz de tramitar el asunto.", false], ["C", "hacer seguimiento y formular recomendaciones, ya que la competencia del control interno sobre los servidores de su entidad es prevalente.", "La competencia del control interno no prevalece sobre la de la PGN: el artículo 2 de la Ley 1952 de 2019 la reconoce sin perjuicio del poder preferente de la Procuraduría, que puede asumir la actuación (art. 3).", false]]}, {"id": "PG-144", "niv": 3, "e": "Sobre la intención del personero de asumir la investigación contra el auxiliar de la secretaría de obras, es correcto afirmar que", "f": "Ley 1952 de 2019, arts. 2 y 3; Ley 136 de 1994, art. 178 num. 4", "o": [["A", "no puede, porque el poder preferente es exclusivo de la Procuraduría General de la Nación.", "La ley también reconoce poder preferente a las personerías frente a la administración (art. 3, inciso 2, de la Ley 1952 de 2019).", false], ["B", "puede, pero solo con autorización previa y escrita del procurador provincial.", "La ley no condiciona el poder preferente de las personerías a una autorización previa del procurador provincial; el personero actúa bajo su supervigilancia y debe informarle de las investigaciones (art. 178, num. 4, de la Ley 136 de 1994).", false], ["C", "puede, porque las personerías municipales tienen poder disciplinario preferente frente a la administración.", "El inciso 2 del artículo 3 de la Ley 1952 de 2019 dispone que las personerías municipales y distritales tienen poder disciplinario preferente frente a la administración; el artículo 2 de la misma ley lo reconoce también. El auxiliar es un servidor de la alcaldía.", true]]}, {"id": "PG-145", "niv": 3, "e": "Frente a la queja contra el concejal, el personero debe", "f": "Ley 1952 de 2019, art. 2 (modificado por el art. 1 de la Ley 2094 de 2021); Decreto Ley 262 de 2000, art. 76 num. 1", "o": [["A", "tramitarla, porque los concejales son servidores públicos municipales sujetos a su poder preferente.", "Aunque el concejal es servidor del orden municipal, la Ley 1952 de 2019 (art. 2) hace privativa de la PGN la competencia sobre los servidores de elección popular, lo que excluye a la personería.", false], ["B", "remitirla a la Procuraduría, porque su competencia sobre los servidores de elección popular es privativa.", "El artículo 2 de la Ley 1952 de 2019, modificado por la Ley 2094 de 2021, dispone que la competencia de la PGN es privativa para los procesos contra servidores de elección popular. Los concejales de municipios que no son capital corresponden a las provinciales de instrucción (art. 76, num. 1, lit. a, del Decreto Ley 262 de 2000).", true], ["C", "remitirla a la oficina de control interno disciplinario del concejo, como entidad a la que pertenece el concejal.", "Tampoco el control interno es competente: la competencia sobre servidores de elección popular es privativa de la Procuraduría (art. 2 de la Ley 1952 de 2019).", false]]}]}, {"comp": "estructura_pgn", "rol": "general", "tag": "Estructura y funciones de la Procuraduría · Función de intervención judicial", "texto": "En una procuraduría regional se reúnen los procuradores judiciales de la sede para planear el semestre. Un procurador judicial en lo administrativo informa que un concejal de la capital habría incurrido en una causal de pérdida de investidura. Una procuradora judicial en asuntos laborales comenta que un proceso que acompañó desde el juzgado llegará en casación a la Sala de Casación Laboral de la Corte Suprema de Justicia. Otro procurador judicial pregunta qué acciones puede interponer directamente para proteger un parque público que una alcaldía pretende vender.", "items": [{"id": "PG-164", "niv": 1, "e": "Frente a la posible causal de pérdida de investidura del concejal, el procurador judicial en lo administrativo", "f": "Decreto Ley 262 de 2000, art. 44", "o": [["A", "puede promover la acción de pérdida de investidura e intervenir en ese proceso.", "El artículo 44 del Decreto Ley 262 de 2000 dispone que los procuradores judiciales en lo contencioso administrativo intervienen en los procesos de pérdida de investidura de alcaldes, diputados y concejales y promueven esas acciones conforme a la ley.", true], ["B", "solo puede informar al concejo para que este decida si promueve la acción.", "El artículo 44 del Decreto Ley 262 de 2000 faculta a los procuradores judiciales administrativos para promover directamente la acción de pérdida de investidura.", false], ["C", "debe remitir el asunto a la Sala Disciplinaria de Instrucción, única competente frente a servidores de elección popular.", "La pérdida de investidura es un proceso judicial distinto del disciplinario; el artículo 44 asigna la intervención y la promoción de esa acción a los procuradores judiciales administrativos.", false]]}, {"id": "PG-165", "niv": 2, "e": "La intervención como Ministerio Público en el proceso que llegará a la Sala de Casación Laboral de la Corte Suprema de Justicia corresponde a", "f": "Decreto Ley 262 de 2000, arts. 33, 48 y 75B num. 6", "o": [["A", "la misma procuradora judicial, que conserva el proceso en todas las instancias.", "Los procuradores judiciales laborales actúan ante las salas laborales de los tribunales superiores y los juzgados laborales (art. 48); ante la Sala de Casación Laboral actúan los procuradores delegados (art. 33).", false], ["B", "los procuradores delegados con funciones de intervención en procesos laborales.", "El artículo 33 del Decreto Ley 262 de 2000 asigna a los procuradores delegados actuar como Ministerio Público ante la Sala de Casación Laboral de la Corte Suprema de Justicia y presentar allí recursos de casación y revisión.", true], ["C", "la procuraduría regional del lugar donde se tramitó la primera instancia.", "Las regionales intervienen solo ocasionalmente donde no haya procuradores judiciales (art. 75B, num. 6); la intervención ante la Corte Suprema está asignada a los procuradores delegados (art. 33).", false]]}, {"id": "PG-166", "niv": 2, "e": "Para proteger el parque público, el procurador judicial", "f": "Decreto Ley 262 de 2000, art. 38 num. 1; Constitución Política, arts. 277 y 282 num. 5", "o": [["A", "puede intervenir en una acción popular ya iniciada, pero promoverla corresponde al Defensor del Pueblo y a los ciudadanos.", "La Defensoría puede interponer acciones populares (art. 282, num. 5, de la Constitución), pero ello no excluye a los procuradores judiciales, a quienes el artículo 38, num. 1, también se lo permite.", false], ["B", "debe pedir al personero que presente la acción popular, porque a la Procuraduría le corresponde intervenir en ella, no promoverla.", "El artículo 38, num. 1, del Decreto Ley 262 de 2000 permite al procurador judicial interponer directamente la acción popular; no necesita acudir al personero.", false], ["C", "puede promover directamente una acción popular en defensa de ese bien de uso público.", "El artículo 38, num. 1, del Decreto Ley 262 de 2000 faculta a los procuradores judiciales para interponer acciones populares, de tutela, de cumplimiento, de nulidad de actos administrativos y de nulidad absoluta de contratos estatales; el artículo 277 de la Constitución permite a la Procuraduría interponer las acciones que considere necesarias.", true]]}]}, {"comp": "estructura_pgn", "rol": "general", "tag": "Estructura y funciones de la Procuraduría · Periodo de prueba y calificación de servicios", "texto": "En una procuraduría distrital se posesionan en periodo de prueba dos servidores seleccionados en el concurso. El primero ingresa por concurso abierto y, al segundo mes, sufre una incapacidad médica de quince días calendario continuos. La segunda ya estaba inscrita en carrera como técnica y ascendió, mediante concurso, a un empleo del nivel profesional. Al mismo tiempo, un servidor de carrera de otra dependencia no está de acuerdo con su calificación anual de servicios y quiere saber quién conoce del recurso de apelación.", "items": [{"id": "PG-182", "niv": 1, "e": "Según el Decreto Ley 262 de 2000, el periodo de prueba tiene una duración de", "f": "Decreto Ley 262 de 2000, arts. 218 y 230", "o": [["A", "cuatro meses.", "El artículo 218 del Decreto Ley 262 de 2000 dispone que la persona seleccionada por concurso abierto, o por ascenso con cambio de nivel, es nombrada en periodo de prueba por cuatro meses, al cabo de los cuales se evalúa su desempeño.", true], ["B", "seis meses.", "El artículo 218 del Decreto Ley 262 de 2000, que rige la carrera especial de la PGN, fija el periodo de prueba en cuatro meses.", false], ["C", "un año.", "Un año es el periodo de la calificación anual de servicios (art. 230), no el del periodo de prueba, que es de cuatro meses (art. 218).", false]]}, {"id": "PG-183", "niv": 2, "e": "Por la incapacidad de quince días calendario continuos del primer servidor, su periodo de prueba", "f": "Decreto Ley 262 de 2000, art. 219", "o": [["A", "termina anticipadamente y debe repetirse completo desde la reincorporación.", "La norma no ordena reiniciar el periodo; lo prorroga por el tiempo necesario para culminarlo (art. 219).", false], ["B", "se prorroga por el tiempo necesario para completarlo.", "El artículo 219 del Decreto Ley 262 de 2000 dispone que, si por causa justificada se interrumpe el desempeño de las funciones por más de diez días calendario continuos, el periodo de prueba se prorroga por el término necesario para su culminación.", true], ["C", "se mantiene sin cambios y la incapacidad se valora en la evaluación final.", "La norma no prevé valorar la incapacidad en la evaluación: si la interrupción justificada supera diez días calendario continuos, el periodo de prueba se prorroga (art. 219).", false]]}, {"id": "PG-184", "niv": 3, "e": "Si la servidora que ascendió al nivel profesional no obtiene calificación satisfactoria en su periodo de prueba,", "f": "Decreto Ley 262 de 2000, art. 218", "o": [["A", "continúa en el empleo profesional en provisionalidad hasta un nuevo concurso.", "No está prevista esa consecuencia; la norma ordena el regreso al empleo anterior con conservación de la inscripción (art. 218).", false], ["B", "su nombramiento se declara insubsistente y pierde los derechos de carrera.", "La insubsistencia aplica a quien ingresó por concurso abierto sin estar inscrito; quien asciende con cambio de nivel regresa a su empleo anterior y conserva la inscripción (art. 218).", false], ["C", "vuelve al empleo técnico que ocupaba y mantiene sus derechos de carrera.", "El artículo 218 del Decreto Ley 262 de 2000 dispone que, cuando el ascenso ocasiona cambio de nivel y el empleado no obtiene calificación satisfactoria en el periodo de prueba, regresa a su empleo anterior y conserva su inscripción en la carrera.", true]]}, {"id": "PG-185", "niv": 2, "e": "El recurso de apelación contra la calificación anual de servicios lo resuelve", "f": "Decreto Ley 262 de 2000, arts. 12 num. 14, 227, 232 y 240 num. 10", "o": [["A", "la Comisión de Carrera.", "El artículo 232 del Decreto Ley 262 de 2000 dispone que del recurso de apelación contra la calificación conoce la Comisión de Carrera; el artículo 240, num. 10, le asigna conocer en segunda instancia los recursos contra las calificaciones de servicios.", true], ["B", "el jefe de la Oficina de Selección y Carrera, que notifica la calificación definitiva.", "La Oficina de Selección y Carrera efectúa los promedios y notifica la calificación definitiva (art. 12, num. 14), pero la apelación es de competencia de la Comisión de Carrera (arts. 232 y 240, num. 10).", false], ["C", "el superior inmediato del calificador, como jefe de la dependencia.", "Al superior del calificador se le puede pedir que ordene calificar cuando la calificación no se hace (art. 227), pero la apelación contra la calificación la resuelve la Comisión de Carrera (art. 232).", false]]}]}, {"comp": "gestion_publica", "rol": "general", "tag": "Gestión pública y funcionamiento del Estado · Responsabilidad de los servidores y competencia", "texto": "Usted es técnico de una procuraduría provincial y apoya el trámite de una queja contra funcionarios de la alcaldía de un municipio. En la revisión se establece lo siguiente: el secretario de planeación dejó de expedir durante cuatro meses, sin justificación, las certificaciones de estratificación que el manual de funciones le asigna; la secretaria de gobierno, sin norma alguna que se lo permita, otorgó licencias de construcción, función que en ese municipio corresponde a la secretaría de planeación; el alcalde anunció que nombrará a un «asesor de paz», empleo que no existe en la planta de personal ni tiene recursos en el presupuesto; y un concejal investigado alega que, como no es empleado de la alcaldía, no es servidor público.", "items": [{"id": "GE-104", "niv": 1, "e": "Respecto del secretario de planeación que dejó de expedir las certificaciones, de acuerdo con la Constitución", "f": "Constitución Política, art. 6", "o": [["A", "solo respondería si infringiera una prohibición expresa de la Constitución o de la ley, del mismo modo que ocurre con los particulares.", "Ese es el régimen de los particulares, que responden únicamente por infringir la Constitución y las leyes. Los servidores responden además por omisión o extralimitación (art. 6).", false], ["B", "no responde, porque la omisión solo genera responsabilidad cuando ocasiona un daño patrimonial al municipio.", "El artículo 6 no condiciona la responsabilidad por omisión a un daño patrimonial; dejar de cumplir las funciones asignadas basta para comprometer la responsabilidad del servidor.", false], ["C", "responde por la omisión en el ejercicio de sus funciones, además de responder por infringir la Constitución y las leyes.", "El artículo 6 de la Constitución dispone que los servidores públicos son responsables por infringir la Constitución y las leyes y por omisión o extralimitación en el ejercicio de sus funciones.", true]]}, {"id": "GE-105", "niv": 2, "e": "La actuación de la secretaria de gobierno al otorgar las licencias de construcción", "f": "Constitución Política, art. 121", "o": [["A", "es válida si el alcalde ratifica después las licencias, pues la ratificación corrige la falta de competencia.", "La competencia proviene de la Constitución y la ley (art. 121); una ratificación posterior del alcalde no crea retroactivamente una competencia que la secretaria no tenía.", false], ["B", "es inválida por falta de competencia, pues la secretaría solo puede ejercer las funciones que la Constitución y la ley le asignan.", "El artículo 121 de la Constitución prohíbe a toda autoridad ejercer funciones distintas de las que le atribuyen la Constitución y la ley. La secretaria actuó sin competencia.", true], ["C", "es válida porque, al ser dependencias de la misma alcaldía, una secretaría puede asumir funciones de otra cuando hay congestión.", "Pertenecer a la misma entidad no habilita a una dependencia para ejercer funciones asignadas a otra; se requiere atribución normativa (art. 121) o una figura legal como la delegación con los requisitos de ley.", false]]}, {"id": "GE-106", "niv": 2, "e": "En cuanto al nombramiento del «asesor de paz», usted debe concluir que", "f": "Constitución Política, art. 122", "o": [["A", "puede hacerse de forma provisional mientras el concejo aprueba la modificación de la planta de personal.", "No existe empleo que proveer provisionalmente: sin estar creado en la planta y sin presupuesto, el cargo no puede proveerse de ninguna forma (art. 122).", false], ["B", "no es posible mientras el cargo no exista en la planta de personal y su remuneración no esté prevista en el presupuesto.", "El artículo 122 de la Constitución dispone que no habrá empleo público sin funciones detalladas en ley o reglamento y que, para proveer los de carácter remunerado, se requiere que estén contemplados en la planta y previstos sus emolumentos en el presupuesto.", true], ["C", "puede hacerse por decreto del alcalde, siempre que en el acto de nombramiento se fijen las funciones del cargo.", "Fijar funciones en el nombramiento no basta: el artículo 122 exige, para proveer empleos remunerados, que estén contemplados en la planta respectiva y que sus emolumentos estén previstos en el presupuesto.", false]]}, {"id": "GE-107", "niv": 1, "e": "Frente al argumento del concejal investigado, es acertado responder que", "f": "Constitución Política, art. 123", "o": [["A", "los concejales tienen la calidad de servidores públicos, por ser miembros de una corporación pública.", "Según el artículo 123 de la Constitución, son servidores públicos los miembros de las corporaciones públicas, los empleados y los trabajadores del Estado y de sus entidades descentralizadas territorialmente y por servicios.", true], ["B", "los concejales son particulares que ejercen funciones públicas de manera transitoria.", "Los concejales no son particulares: la Constitución los incluye expresamente entre los servidores públicos por ser miembros de una corporación pública (art. 123).", false], ["C", "solo son servidores públicos quienes tienen vínculo laboral con la administración municipal.", "La categoría de servidor público no depende de un vínculo laboral con la alcaldía: incluye a los miembros de corporaciones públicas de elección popular (art. 123).", false]]}]}, {"comp": "gestion_publica", "rol": "tecnico", "tag": "Gestión pública y funcionamiento del Estado · Niveles técnico, administrativo y operativo · Categorización de municipios", "texto": "Usted es técnico administrativo de la secretaría de hacienda de un departamento y apoya la revisión de la categorización de los municipios para la vigencia 2027. El municipio A tiene 18.500 habitantes y unos ingresos corrientes de libre destinación (ICLD) anuales equivalentes a 27.000 salarios mínimos legales mensuales. El municipio B tiene 45.000 habitantes y unos ICLD equivalentes a 12.000 salarios mínimos. Ninguno de los dos es municipio de frontera ni capital de departamento; ambos estaban en quinta categoría en 2026 y sus gastos de funcionamiento están dentro de los límites legales. Además, el alcalde de un tercer municipio pregunta hasta cuándo debe expedir su decreto de categorización, y la alcaldía de la capital del departamento consulta qué efecto tiene la Ley 2082 de 2021.", "items": [{"id": "GE-127", "niv": 3, "e": "De acuerdo con el artículo 6 de la Ley 136 de 1994, en su texto vigente (modificado por el Decreto Ley 2106 de 2019), el municipio A debe clasificarse en", "f": "Ley 136 de 1994, art. 6, par. 1 (texto vigente: Decreto Ley 2106 de 2019, art. 153)", "o": [["A", "cuarta categoría.", "Por población (10.001 a 20.000 habitantes) le correspondería la quinta categoría, cuyo tope de ICLD es 25.000 salarios mínimos. Como sus ICLD (27.000) superan ese monto, el parágrafo 1 del artículo 6 de la Ley 136, en el texto que le dio el artículo 153 del Decreto Ley 2106 de 2019, ordena clasificarlo en la categoría inmediatamente superior: cuarta.", true], ["B", "quinta categoría.", "Es la categoría que corresponde a su población, pero la ley ordena subirlo a la inmediatamente superior porque sus ICLD superan el monto señalado para la quinta categoría.", false], ["C", "sexta categoría.", "La sexta categoría es para municipios con población igual o inferior a 10.000 habitantes e ICLD no superiores a 15.000 salarios mínimos; el municipio A no cumple ninguno de los dos criterios.", false]]}, {"id": "GE-128", "niv": 3, "e": "El municipio B, con 45.000 habitantes e ICLD de 12.000 salarios mínimos, debe clasificarse en", "f": "Ley 136 de 1994, art. 6, par. 1 (texto vigente: Decreto Ley 2106 de 2019, art. 153)", "o": [["A", "tercera categoría, que corresponde a su población.", "La población lo ubicaría en tercera categoría (30.001 a 50.000 habitantes), pero sus ICLD no alcanzan el monto de esa categoría (más de 30.000 salarios mínimos), y en ese caso prima la categoría que corresponde a los ingresos.", false], ["B", "cuarta categoría, por ser la inmediatamente inferior a la de su población.", "La ley no ordena bajar solo un nivel: cuando los ICLD no alcanzan el monto de la categoría poblacional, el municipio se clasifica en la categoría que corresponda a sus ICLD.", false], ["C", "sexta categoría, que corresponde a sus ingresos corrientes de libre destinación.", "El parágrafo 1 del artículo 6 de la Ley 136, en el texto que le dio el artículo 153 del Decreto Ley 2106 de 2019, dispone que, si los ICLD no alcanzan el monto de la categoría poblacional, el municipio se clasifica en la categoría correspondiente a sus ICLD. Con 12.000 salarios mínimos (no superiores a 15.000), le corresponde la sexta.", true]]}, {"id": "GE-129", "niv": 1, "e": "Al alcalde que pregunta por el plazo para categorizar su municipio, usted le responde que debe hacerlo", "f": "Ley 136 de 1994, art. 6, par. 3 (texto vigente: Decreto Ley 2106 de 2019, art. 153)", "o": [["A", "mediante decreto expedido antes del 31 de diciembre; si no lo hace, la categoría la fija el gobernador en enero.", "La fecha y la autoridad son equivocadas: el plazo vence el 31 de octubre y, ante la omisión, la categoría la fija el Contador General de la Nación en noviembre.", false], ["B", "mediante decreto expedido antes del 31 de octubre; si no lo hace, la fija el Contador General de la Nación en noviembre.", "El parágrafo 3 del artículo 6 de la Ley 136 de 1994, modificado por el artículo 153 del Decreto Ley 2106 de 2019, ordena a los alcaldes determinar anualmente, por decreto expedido antes del 31 de octubre, la categoría para el año siguiente; si no lo expiden, la fija el Contador General de la Nación en noviembre.", true], ["C", "mediante decreto expedido antes del 31 de octubre; si no lo hace, conserva automáticamente la categoría del año anterior.", "La ley no prevé la conservación automática de la categoría: ante la omisión del alcalde, la categorización la fija el Contador General de la Nación en noviembre.", false]]}, {"id": "GE-130", "niv": 3, "e": "A la capital del departamento que consulta por la Ley 2082 de 2021, usted le explica que", "f": "Ley 2082 de 2021, art. 2", "o": [["A", "deja de categorizarse por población e ingresos y queda sometida al mismo régimen del Distrito Capital.", "La ley mantiene la categorización por los criterios generales para efectos de la Ley 617 y no somete a las capitales al régimen del Distrito Capital; solo dispone que el régimen de Bogotá se armonice con el Decreto 1421 de 1993.", false], ["B", "pasa automáticamente a la categoría especial, por su condición de capital departamental.", "La Ley 2082 no ordena reclasificar en categoría especial a las capitales; por el contrario, dispone que para los efectos de la Ley 617 de 2000 conservan la categoría que les corresponda según los criterios generales.", false], ["C", "pertenece a la categoría de ciudades capitales y, para efectos de la Ley 617 de 2000, conserva la categoría que le corresponda.", "El artículo 2 de la Ley 2082 de 2021 crea la categoría «ciudades capitales», a la que pertenecen Bogotá y los distritos y municipios capitales de departamento, con un régimen especial, y aclara que para los efectos de la Ley 617 de 2000 conservan la categoría que les corresponda según los criterios allí establecidos.", true]]}]}, {"comp": "gestion_publica", "rol": "general", "tag": "Gestión pública y funcionamiento del Estado · Plan de desarrollo territorial", "texto": "Usted es profesional universitario de una procuraduría provincial y hace seguimiento preventivo a la adopción del plan de desarrollo 2028-2031 de un municipio. El alcalde se posesionó el 1 de enero de 2028. El consejo de gobierno consolidó el proyecto de plan y el 15 de febrero lo entregó al consejo territorial de planeación, que nunca se reunió ni emitió concepto. El alcalde radicó el proyecto ante el concejo municipal el 20 de abril de 2028. El 25 de mayo el concejo aún no había adoptado decisión alguna sobre el plan.", "items": [{"id": "GE-131", "niv": 1, "e": "Según la Ley 152 de 1994, el plan de desarrollo del municipio debe estar conformado por", "f": "Ley 152 de 1994, art. 31", "o": [["A", "una parte estratégica y un plan de inversiones de mediano y corto plazo.", "El artículo 31 de la Ley 152 de 1994 dispone que los planes de desarrollo de las entidades territoriales estarán conformados por una parte estratégica y un plan de inversiones a mediano y corto plazo.", true], ["B", "el programa de gobierno inscrito y un presupuesto plurianual aprobado por el consejo de planeación.", "El programa de gobierno orienta la elaboración del plan (art. 39), pero no es uno de sus componentes; y el consejo territorial de planeación emite concepto, no aprueba presupuestos.", false], ["C", "un diagnóstico financiero y un programa anual mensualizado de caja.", "El programa anual mensualizado de caja es un instrumento de ejecución presupuestal, no un componente del plan de desarrollo (art. 31 de la Ley 152).", false]]}, {"id": "GE-132", "niv": 2, "e": "Frente al silencio del consejo territorial de planeación, debe entenderse que", "f": "Ley 152 de 1994, arts. 25 y 39, num. 6", "o": [["A", "el concepto debía solicitarse al Consejo Nacional de Planeación ante el silencio del consejo territorial.", "La Ley 152 no prevé que el Consejo Nacional de Planeación reemplace al territorial; establece que, transcurrido el mes, se considera surtido el requisito.", false], ["B", "si pasa un mes desde la entrega sin pronunciamiento del consejo, el requisito del concepto se tiene por cumplido.", "El artículo 39, numeral 6, de la Ley 152 de 1994 dispone que el consejo territorial debe realizar su labor dentro del mes siguiente a la presentación del documento consolidado y que, si no se reúne o no se pronuncia, se considera surtido el requisito en esa fecha, regla que reproduce para el nivel territorial la del artículo 25 de la misma ley.", true], ["C", "el alcalde debía esperar el concepto, pues sin él no podía presentar el proyecto al concejo.", "La ley no convierte el silencio del consejo en un obstáculo indefinido: vencido el mes sin pronunciamiento, el requisito se entiende surtido (art. 39, num. 6).", false]]}, {"id": "GE-133", "niv": 3, "e": "Como el concejo no decidió sobre el plan dentro del mes siguiente a su presentación, el alcalde", "f": "Ley 152 de 1994, art. 40", "o": [["A", "debe presentarlo de nuevo en las siguientes sesiones ordinarias, porque ya vencieron los primeros cuatro meses del período.", "Los cuatro meses son el plazo para presentar el plan, y el alcalde lo cumplió al radicarlo el 20 de abril; vencido el mes sin decisión del concejo, procede la adopción por decreto (art. 40).", false], ["B", "debe publicarlo como acuerdo municipal, porque el silencio del concejo equivale a una aprobación tácita.", "La ley no prevé aprobación tácita por el concejo ni la expedición de un acuerdo sin votación: la consecuencia del silencio es que el alcalde puede adoptar el plan por decreto.", false], ["C", "puede adoptar el plan mediante decreto.", "El artículo 40 de la Ley 152 de 1994 dispone que los planes se someten al concejo dentro de los primeros cuatro meses del período del alcalde (aquí se radicó el 20 de abril) y que, si el concejo no decide dentro del mes siguiente a su presentación, el alcalde podrá adoptarlos mediante decreto.", true]]}]}, {"comp": "gestion_publica", "rol": "general", "tag": "Gestión pública y funcionamiento del Estado · Órganos de control y órganos autónomos", "texto": "Usted es técnico de una procuraduría provincial y atiende tres consultas en la misma mañana. Un ciudadano denuncia que el tesorero de un municipio hizo pagos dobles a un proveedor y pide que la Procuraduría «le cobre al tesorero el dinero perdido». Una aspirante pregunta qué entidad administra y vigila la carrera de los empleados de la alcaldía y si esa misma entidad administra la carrera de la Procuraduría. Y un estudiante de economía pregunta quién es la autoridad monetaria, cambiaria y crediticia del país.", "items": [{"id": "GE-153", "niv": 1, "e": "Al ciudadano que pide que la Procuraduría cobre al tesorero el dinero perdido, usted le explica que", "f": "Constitución Política, arts. 267, 268, 272 y 277", "o": [["A", "la Procuraduría declara la responsabilidad fiscal y ordena al tesorero reintegrar los recursos.", "La responsabilidad fiscal no la declara la Procuraduría sino las contralorías (arts. 267, 268 y 272 de la Constitución); la Procuraduría ejerce el poder disciplinario.", false], ["B", "la responsabilidad fiscal la declara la contraloría competente, sin perjuicio de la acción disciplinaria.", "El control fiscal y el establecimiento de la responsabilidad que se derive de la gestión fiscal corresponden a la Contraloría General de la República y, en el nivel territorial, a las contralorías departamentales y municipales (arts. 267, 268 y 272); la Procuraduría puede adelantar la acción disciplinaria por los mismos hechos (art. 277).", true], ["C", "el concejo municipal declara la responsabilidad fiscal del tesorero mediante un acuerdo, previo informe del personero.", "El concejo ejerce control político, no fiscal; la responsabilidad fiscal es competencia de las contralorías.", false]]}, {"id": "GE-154", "niv": 3, "e": "A la aspirante que pregunta por la administración de las carreras, usted le responde que", "f": "Constitución Política, arts. 130 y 279", "o": [["A", "la Comisión Nacional del Servicio Civil administra y vigila la carrera de la alcaldía, pero no la de la Procuraduría, que es especial.", "El artículo 130 de la Constitución asigna a la Comisión Nacional del Servicio Civil la administración y vigilancia de las carreras de los servidores públicos, excepto las que tengan carácter especial. La de la Procuraduría es una carrera especial de origen constitucional (art. 279).", true], ["B", "la Comisión Nacional del Servicio Civil administra y vigila ambas carreras, porque es responsable de todas las carreras del Estado.", "El artículo 130 de la Constitución excluye de la competencia de la Comisión las carreras de carácter especial, como la de la Procuraduría.", false], ["C", "la alcaldía y la Procuraduría administran cada una su propia carrera, sin vigilancia de ninguna entidad externa.", "La carrera administrativa de las alcaldías la administra y vigila la Comisión Nacional del Servicio Civil (art. 130); no es la propia alcaldía la que la administra.", false]]}, {"id": "GE-155", "niv": 2, "e": "Al estudiante que pregunta por la autoridad monetaria, cambiaria y crediticia, usted le indica que es", "f": "Constitución Política, arts. 371 y 372", "o": [["A", "la Superintendencia Financiera, porque vigila a los establecimientos bancarios.", "La Superintendencia Financiera ejerce inspección y vigilancia sobre entidades financieras; no es la autoridad monetaria, cambiaria y crediticia (art. 372).", false], ["B", "el Ministerio de Hacienda y Crédito Público, como cabeza del sector.", "El ministro de Hacienda integra la junta directiva del Banco de la República, pero la Constitución atribuye la condición de autoridad monetaria a la junta, no al Ministerio (art. 372).", false], ["C", "la junta directiva del Banco de la República, que es un órgano con autonomía administrativa, patrimonial y técnica.", "El artículo 371 de la Constitución organiza el Banco de la República como persona jurídica de derecho público con autonomía administrativa, patrimonial y técnica, y el artículo 372 dispone que su junta directiva es la autoridad monetaria, cambiaria y crediticia.", true]]}]}, {"comp": "atencion_usuario", "rol": "general", "tag": "Atención al usuario · Cálculo de términos del derecho de petición", "texto": "Usted trabaja en el grupo de atención al ciudadano de una procuraduría provincial y lleva el control de vencimientos. El miércoles 3 de febrero de 2027 se radicaron por el canal electrónico tres peticiones de distintos ciudadanos: una queja por la mala atención que uno de ellos recibió en la sede; una solicitud de copia de un informe de gestión de la entidad; y una consulta en la que se pide el concepto de la procuraduría sobre cómo interpreta su intervención en las conciliaciones extrajudiciales. Las tres están completas, la procuraduría es competente, ninguna tiene un término especial distinto de los del CPACA y no hay festivos en ese periodo.", "items": [{"id": "AU-110", "niv": 3, "e": "El último día para resolver oportunamente la queja es el", "f": "Ley 1755 de 2015, art. 1 (art. 14 de la Ley 1437 de 2011); cálculo de días hábiles", "o": [["A", "jueves 18 de febrero de 2027.", "Resulta de contar quince días calendario. Los términos en días del CPACA se cuentan en días hábiles, por lo que se excluyen sábados y domingos.", false], ["B", "martes 23 de febrero de 2027.", "Resulta de contar el mismo 3 de febrero como primer día. El término corre dentro de los quince días siguientes a la recepción, es decir, desde el 4 de febrero.", false], ["C", "miércoles 24 de febrero de 2027.", "La queja sigue el término general de quince días hábiles siguientes a la recepción: 4 y 5 de febrero (2), 8 a 12 (7), 15 a 19 (12), 22, 23 y 24 (15).", true]]}, {"id": "AU-111", "niv": 2, "e": "El último día para resolver la solicitud de copia del informe es el", "f": "Ley 1755 de 2015, art. 1 (art. 14, num. 1, de la Ley 1437 de 2011); cálculo de días hábiles", "o": [["A", "martes 16 de febrero de 2027.", "Resulta de contar el día de la radicación como primer día; el plazo empieza el día siguiente a la recepción.", false], ["B", "miércoles 17 de febrero de 2027.", "Las peticiones de documentos se resuelven dentro de los diez días hábiles siguientes a su recepción: 4 y 5 de febrero (2), 8 a 12 (7), 15, 16 y 17 (10).", true], ["C", "miércoles 24 de febrero de 2027.", "Aplica el término general de quince días, pero la solicitud de copias de documentos tiene término especial de diez días.", false]]}, {"id": "AU-112", "niv": 3, "e": "El último día para resolver la consulta es el", "f": "Ley 1755 de 2015, art. 1 (art. 14, num. 2, de la Ley 1437 de 2011); cálculo de días hábiles", "o": [["A", "viernes 5 de marzo de 2027.", "Resulta de contar treinta días calendario; el término es de días hábiles.", false], ["B", "martes 16 de marzo de 2027.", "Resulta de incluir el día de la radicación en el conteo; el término corre desde el día siguiente.", false], ["C", "miércoles 17 de marzo de 2027.", "Las consultas se resuelven dentro de los treinta días hábiles siguientes a su recepción: 4 y 5 de febrero (2), 8 a 12 (7), 15 a 19 (12), 22 a 26 (17), 1 a 5 de marzo (22), 8 a 12 (27) y 15 a 17 (30).", true]]}]}, {"comp": "atencion_usuario", "rol": "tecnico", "tag": "Atención al usuario · Niveles técnico, administrativo y operativo · Falta de competencia y traslado", "texto": "Usted es técnico administrativo de la ventanilla de radicación de una procuraduría provincial. El jueves 11 de febrero de 2027 recibe por correo certificado una petición escrita en la que una ciudadana solicita a la Procuraduría que le reconozca y pague una pensión de sobrevivientes, asunto que corresponde al fondo de pensiones al que estaba afiliado su esposo. Ese mismo día, un señor se acerca a la ventanilla y pide, de palabra, que la Procuraduría le expida a su hijo el certificado de antecedentes judiciales; usted le explica que esa no es una función de la entidad y le indica a quién acudir, pero él insiste en que le reciban la petición. No hay festivos en ese periodo.", "items": [{"id": "AU-116", "niv": 3, "e": "El último día para informar a la ciudadana y remitir su petición al fondo de pensiones es el", "f": "Ley 1755 de 2015, art. 1 (art. 21 de la Ley 1437 de 2011); cálculo de días hábiles", "o": [["A", "martes 16 de febrero de 2027.", "Resulta de contar cinco días calendario; el término se cuenta en días hábiles, sin sábados ni domingos.", false], ["B", "miércoles 17 de febrero de 2027.", "Resulta de contar el día de la recepción como primer día; el plazo corre dentro de los cinco días siguientes al de la recepción.", false], ["C", "jueves 18 de febrero de 2027.", "Si la petición se presentó por escrito, hay cinco días siguientes a la recepción para informar y remitir: 12 de febrero (1), 15, 16, 17 y 18 (5).", true]]}, {"id": "AU-117", "niv": 1, "e": "Una vez el fondo de pensiones reciba la petición remitida, el término para resolverla se cuenta", "f": "Ley 1755 de 2015, art. 1 (art. 21 de la Ley 1437 de 2011)", "o": [["A", "a partir del día siguiente a la recepción de la petición por la autoridad competente.", "El artículo 21 del CPACA dispone que los términos para decidir o responder se cuentan a partir del día siguiente a la recepción de la petición por la autoridad competente.", true], ["B", "desde la fecha en que la ciudadana confirme que recibió la copia del oficio remisorio.", "La copia del oficio remisorio informa a la peticionaria, pero no marca el inicio del término para decidir.", false], ["C", "a partir del día siguiente a la fecha en que la Procuraduría recibió la petición.", "La ley no traslada al competente el tiempo corrido ante la autoridad que no lo era: el término empieza con la recepción por la autoridad competente.", false]]}, {"id": "AU-118", "niv": 2, "e": "Frente a la insistencia del señor que hizo la petición verbal, usted debe", "f": "Decreto 1069 de 2015, art. 2.2.3.12.7 (adicionado por el Decreto 1166 de 2016)", "o": [["A", "exigirle que la presente por escrito, porque solo así puede remitirse a la autoridad competente.", "Exigir la forma escrita como condición para radicar una petición verbal está proscrito, salvo que la petición así lo requiera (art. 2.2.3.12.12 del Decreto 1069 de 2015).", false], ["B", "radicarla, dejar constancia de la orientación que le dio y darle después el trámite que corresponda.", "El artículo 2.2.3.12.7 del Decreto 1069 de 2015 dispone que, si el peticionario verbal insiste pese a la falta de competencia, el funcionario deja constancia, la radica y le da el trámite correspondiente, registrando la orientación dada.", true], ["C", "abstenerse de radicarla, porque en las peticiones verbales la falta de competencia se resuelve solo con la orientación en el acto.", "La orientación en el acto es el primer paso, pero la norma reconoce al peticionario el derecho a insistir en que se radique.", false]]}]}, {"comp": "atencion_usuario", "rol": "general", "tag": "Atención al usuario · Derechos y deberes de las personas ante las autoridades", "texto": "En la sede de atención al público de una alcaldía funciona un sistema de turnos. Una mujer con ocho meses de embarazo llega cuando hay veinte personas esperando. Minutos después, un usuario que en los últimos meses ha presentado varias solicitudes evidentemente improcedentes reclama, en tono ofensivo hacia el funcionario de turno, la respuesta a una petición nueva y procedente que radicó hace un mes y que no ha sido resuelta. Por último, el apoderado de una empresa pide conocer el estado de un trámite de su poderdante y obtener copia de lo actuado; el expediente no está sometido a reserva.", "items": [{"id": "AU-128", "niv": 1, "e": "Respecto de la mujer embarazada, la alcaldía debe", "f": "Ley 1437 de 2011, arts. 5, num. 6, y 7, num. 4", "o": [["A", "darle atención especial y preferente, sin que deba esperar el turno ordinario.", "El numeral 6 del artículo 5 del CPACA reconoce a las mujeres gestantes el derecho a recibir atención especial y preferente, y el numeral 4 del artículo 7 dispone que el sistema de turnos no afecta ese derecho.", true], ["B", "atenderla con prioridad solo si presenta un certificado médico de su estado de gestación.", "La ley no condiciona la atención preferente a un certificado médico; exigirlo crearía un requisito no previsto en la norma.", false], ["C", "asignarle el siguiente turno disponible, porque el sistema de turnos garantiza la igualdad entre todos los usuarios.", "El propio CPACA aclara que el sistema de turnos se aplica sin perjuicio de la atención especial y preferente del numeral 6 del artículo 5.", false]]}, {"id": "AU-129", "niv": 3, "e": "Frente al usuario que se comporta de forma ofensiva y ha reiterado solicitudes improcedentes, la alcaldía", "f": "Ley 1437 de 2011, art. 6 y parágrafo", "o": [["A", "puede abstenerse de responder la petición nueva mientras el usuario no rectifique su trato hacia el funcionario.", "El parágrafo del artículo 6 del CPACA impide usar el incumplimiento de los deberes del ciudadano como pretexto para desconocer el derecho reclamado.", false], ["B", "debe resolver la petición nueva, porque las faltas del usuario a sus deberes no le quitan ese derecho.", "Tratar con respeto a los servidores y no reiterar solicitudes improcedentes son deberes de las personas (art. 6 del CPACA), pero su parágrafo prohíbe a la administración invocar su incumplimiento para desconocer el derecho; solo puede dar lugar a las sanciones que procedan.", true], ["C", "puede rechazar la petición nueva, porque haber reiterado solicitudes improcedentes la convierte en irrespetuosa.", "La petición nueva es procedente y respetuosa; el rechazo por irrespetuosa se refiere al contenido de la petición, no a la conducta pasada del usuario.", false]]}, {"id": "AU-130", "niv": 1, "e": "Sobre la solicitud del apoderado, es correcto afirmar que tiene derecho a", "f": "Ley 1437 de 2011, art. 5, num. 2", "o": [["A", "conocer el estado del trámite y obtener copias de los documentos, a su costa.", "El numeral 2 del artículo 5 del CPACA reconoce el derecho a conocer, salvo reserva legal, el estado de cualquier actuación o trámite y a obtener copias, a su costa, de los documentos.", true], ["B", "conocer el estado del trámite, pero las copias solo se entregan cuando la actuación haya terminado.", "El numeral 2 del artículo 5 del CPACA no limita el acceso a las copias a la terminación de la actuación; lo permite respecto de cualquier actuación no reservada.", false], ["C", "obtener copias gratuitas de lo actuado, porque el ejercicio del derecho de petición no tiene costo.", "La gratuidad se refiere al ejercicio del derecho de petición; el costo de las copias corre por cuenta del interesado (arts. 5, num. 2, y 29 del CPACA).", false]]}]}, {"comp": "atencion_usuario", "rol": "general", "tag": "Atención al usuario · Respuesta a solicitudes de información y costos de reproducción", "texto": "En la Oficina de Atención al Ciudadano de una entidad del orden nacional se reciben dos solicitudes de acceso a la información. La primera la hace de palabra, en la ventanilla, una estudiante que pide el informe de gestión del último año; el documento existe en formato PDF y ella deja su correo electrónico. La segunda la presenta por escrito un investigador que pide copias impresas de 400 folios de documentos públicos que solo existen en papel. Un compañero propone responder a la estudiante de forma verbal y cobrarle al investigador, además de las fotocopias, el valor de las horas que el servidor dedique a sacarlas.", "items": [{"id": "AU-140", "niv": 2, "e": "La respuesta a la solicitud que la estudiante presentó de palabra debe darse", "f": "Decreto 1069 de 2015, art. 2.2.3.12.10 (adicionado por el Decreto 1166 de 2016); Ley 1712 de 2014, art. 26", "o": [["A", "de forma verbal en el mismo acto, porque así fue presentada la solicitud.", "La forma de presentación no define la de la respuesta: para las solicitudes verbales de acceso a información, la norma exige respuesta escrita.", false], ["B", "por el medio que elija el servidor que la atendió, siempre que quede registro en el sistema.", "No es el servidor quien escoge el medio: la respuesta debe ser escrita y el solicitante puede elegir el medio por el cual recibirla.", false], ["C", "por escrito, después de radicarla y dejar la constancia respectiva.", "El artículo 2.2.3.12.10 del Decreto 1069 de 2015 dispone que la respuesta a las peticiones verbales de acceso a información, una vez radicadas y con su constancia, se da por escrito, conforme al artículo 26 de la Ley 1712 de 2014.", true]]}, {"id": "AU-141", "niv": 2, "e": "Como el informe está en formato digital y la estudiante suministró su correo electrónico, la entidad", "f": "Decreto 1081 de 2015, art. 2.1.1.3.1.5; Ley 1712 de 2014, arts. 3 y 26", "o": [["A", "debe enviárselo a ese correo electrónico sin cobrarle ningún costo de reproducción.", "El artículo 2.1.1.3.1.5 del Decreto 1081 de 2015 dispone que, si la información está en formato electrónico y se tiene el correo del solicitante, debe enviarse por ese medio sin costo de reproducción.", true], ["B", "debe citarla a la sede para que consulte el documento, porque la información digital no se reproduce para particulares.", "La entidad debe facilitar el acceso por el medio elegido; no puede limitarlo a la consulta presencial de un documento digital.", false], ["C", "puede cobrarle la reproducción en medio magnético, según el acto de costos de la entidad.", "El cobro de reproducción no procede cuando la información es digital y se envía al correo indicado por el solicitante.", false]]}, {"id": "AU-142", "niv": 3, "e": "Frente a la propuesta de cobrarle al investigador el tiempo del servidor, es correcto afirmar que", "f": "Decreto 1081 de 2015, arts. 2.1.1.3.1.5 y 2.1.1.3.1.6; Ley 1712 de 2014, art. 3 (principio de gratuidad)", "o": [["A", "procede solo cuando el volumen supera cien folios, porque la gratuidad se limita a solicitudes pequeñas.", "La norma no establece un umbral de folios: en todos los casos solo se cobra el costo de reproducción, sin el tiempo del servidor.", false], ["B", "no procede, porque los costos de reproducción excluyen el valor del tiempo de quien hace las copias.", "El artículo 2.1.1.3.1.5 del Decreto 1081 de 2015 define los costos de reproducción como los valores directos para obtener la información, excluyendo el valor del tiempo del servidor, empleado o contratista que realiza la reproducción.", true], ["C", "procede, siempre que el valor esté fijado en el acto que motiva los costos de reproducción de la entidad.", "El acto de motivación de costos fija el costo unitario por formato, pero no puede incluir conceptos que la norma excluye, como el tiempo del servidor.", false]]}]}, {"comp": "atencion_usuario", "rol": "general", "tag": "Atención al usuario · Atención incluyente a personas con discapacidad", "texto": "Usted atiende el punto presencial de servicio al ciudadano de una gobernación. Llega un hombre ciego que se orienta con bastón y pide información sobre un trámite. Después llega una mujer usuaria de silla de ruedas, acompañada por su hermano, quien empieza a explicar el caso mientras ella permanece en silencio. Más tarde, una persona con discapacidad intelectual pide que la respuesta a su petición se le entregue en un formato de lectura fácil, con frases cortas e imágenes; la gobernación puede hacerlo sin un costo desproporcionado.", "items": [{"id": "AU-158", "niv": 1, "e": "Para guiar al hombre ciego hasta la ventanilla, lo adecuado es", "f": "Departamento Nacional de Planeación, Manual para la atención al ciudadano; Función Pública, Protocolo de servicio a las ciudadanías", "o": [["A", "ofrecerle ayuda, preguntarle cómo quiere ser guiado y no halarlo del brazo.", "Los protocolos de servicio al ciudadano (DNP y Función Pública) recomiendan preguntar a la persona con discapacidad si necesita ayuda y cómo, no halarla del brazo o la ropa y mantenerla informada.", true], ["B", "pedirle que espere a un familiar o acompañante que pueda llevarlo hasta la ventanilla.", "Hacer depender la atención de un acompañante desconoce la autonomía de la persona y su derecho a atención especial y preferente (art. 5, num. 6, del CPACA).", false], ["C", "tomarlo firmemente del brazo y conducirlo sin hablarle, para no distraerlo.", "Los protocolos de servicio indican no halar del brazo o de la ropa a la persona ciega y mantenerla informada de lo que se hace.", false]]}, {"id": "AU-159", "niv": 2, "e": "Frente a la mujer usuaria de silla de ruedas y su acompañante, usted debe", "f": "Función Pública, Protocolo de servicio a las ciudadanías (atención a personas con discapacidad); Ley 1618 de 2013, art. 2", "o": [["A", "atender al hermano, porque es quien explica el caso y así se agiliza la atención.", "Dirigirse solo al acompañante ignora a la persona con discapacidad, que es la titular del trámite y quien decide cómo se adelanta.", false], ["B", "dirigirse a ella y dejar que ella indique si hace la gestión directamente o prefiere que la haga su hermano.", "El protocolo de servicio de Función Pública señala que, cuando la persona con discapacidad lleva un acompañante, es ella quien indica si realiza la gestión directamente o si prefiere que la haga su acompañante.", true], ["C", "pedir al hermano que se retire de la ventanilla para que la mujer sea atendida sin intermediarios ni interferencias.", "No corresponde al servidor excluir al acompañante; es la persona con discapacidad quien decide si hace la gestión ella misma o con su apoyo.", false]]}, {"id": "AU-160", "niv": 3, "e": "Entregar la respuesta en formato de lectura fácil es un ejemplo de", "f": "Ley 1996 de 2019, art. 3, num. 6; Ley 1618 de 2013, arts. 1 y 2", "o": [["A", "rehabilitación integral, porque mejora la integración social de la persona con discapacidad.", "La rehabilitación integral se refiere a procesos terapéuticos, educativos y formativos (art. 2 de la Ley 1618 de 2013), no a la forma de comunicar una respuesta.", false], ["B", "acción afirmativa, porque es una política general dirigida a favorecer a un grupo de personas con discapacidad.", "Las acciones afirmativas son políticas o medidas dirigidas a grupos (art. 2, num. 3, de la Ley 1618 de 2013); aquí se trata de una adaptación para una persona en un caso concreto.", false], ["C", "ajuste razonable, porque adapta la atención a un caso particular sin imponer una carga desproporcionada.", "Los ajustes razonables son modificaciones y adaptaciones que no imponen una carga desproporcionada o indebida, requeridas en un caso particular para garantizar a las personas con discapacidad el ejercicio de sus derechos en igualdad de condiciones (art. 3, num. 6, de la Ley 1996 de 2019).", true]]}]}, {"comp": "atencion_usuario", "rol": "general", "tag": "Atención al usuario · Derecho de petición ante organizaciones privadas", "texto": "Usted trabaja en el centro de atención al ciudadano de una procuraduría provincial y recibe tres consultas. Un trabajador de una panadería, cuyo dueño es una persona natural, pregunta si puede presentarle un derecho de petición a su empleador para que le entregue certificados de sus aportes, que necesita para tramitar su pensión. Una señora quiere saber si el club social privado al que pertenece puede negarse a radicar una petición respetuosa que ella necesita para defender su derecho a la igualdad. Y el usuario de un banco pregunta si la entidad puede negarle información invocando una reserva que solo aparece en su reglamento interno.", "items": [{"id": "AU-173", "niv": 3, "e": "Frente a la consulta del trabajador, es correcto afirmar que", "f": "Ley 1755 de 2015, art. 1 (art. 32, parágrafo 1, de la Ley 1437 de 2011)", "o": [["A", "no puede hacerlo, porque frente a particulares el derecho de petición solo procede ante personas jurídicas.", "El parágrafo 1 del artículo 32 del CPACA extiende el derecho de petición a las personas naturales cuando el solicitante está frente a ellas en situación de indefensión o subordinación.", false], ["B", "solo puede hacerlo por intermedio de un inspector de trabajo, que actúa como receptor de la petición.", "La ley no exige intermediarios: el trabajador puede presentar la petición directamente a su empleador.", false], ["C", "puede presentarla a su empleador, porque está subordinado a él en la relación laboral.", "El parágrafo 1 del artículo 32 del CPACA permite ejercer el derecho de petición ante personas naturales cuando el solicitante se encuentra frente a ellas en situación de indefensión o subordinación, como ocurre en la relación laboral.", true]]}, {"id": "AU-174", "niv": 2, "e": "Sobre la pregunta de la señora, el club social", "f": "Ley 1755 de 2015, art. 1 (art. 32, inciso 1 y parágrafo 3, de la Ley 1437 de 2011)", "o": [["A", "puede negarse, porque las organizaciones privadas sin ánimo de lucro no están obligadas a atender peticiones.", "El artículo 32 del CPACA permite ejercer el derecho de petición ante organizaciones privadas con o sin personería jurídica, entre ellas los clubes, para garantizar derechos fundamentales.", false], ["B", "está obligado a recibir y radicar su petición respetuosa, y si se niega puede ser sancionado o multado.", "El parágrafo 3 del artículo 32 del CPACA dispone que ninguna entidad privada podrá negarse a la recepción y radicación de solicitudes y peticiones respetuosas, so pena de sanciones o multas; el inciso 1 menciona expresamente a los clubes.", true], ["C", "puede negarse a radicarla, siempre que le explique por escrito los motivos de la negativa.", "La ley prohíbe negarse a recibir y radicar; una explicación escrita no convierte la negativa en válida.", false]]}, {"id": "AU-175", "niv": 3, "e": "Sobre la pregunta del usuario del banco, la entidad financiera", "f": "Ley 1755 de 2015, art. 1 (arts. 32, inciso 3, y 33 de la Ley 1437 de 2011)", "o": [["A", "no puede ampararse en una reserva que no esté prevista en la Constitución o en la ley.", "El inciso 3 del artículo 32 del CPACA dispone que las organizaciones privadas solo pueden invocar la reserva en los casos expresamente establecidos en la Constitución y la ley, y el artículo 33 aplica estas reglas a las entidades financieras en sus relaciones con los usuarios.", true], ["B", "puede invocar cualquier reserva que esté prevista en su reglamento interno de atención al usuario.", "Un reglamento interno no es fuente de reserva: solo la Constitución y la ley pueden establecerla.", false], ["C", "puede invocar libremente reservas comerciales, porque se rige por el derecho privado.", "Que se rija por el derecho privado no la libera de las reglas del derecho de petición, que la ley le aplica en sus relaciones con los usuarios (art. 33 del CPACA).", false]]}]}, {"comp": "gestion_documental", "rol": "general", "tag": "Gestión documental · Ventanilla única y radicación", "texto": "Usted trabaja en la ventanilla única de correspondencia de una sede de la Procuraduría. El jueves, el coordinador le pide «apartar» los radicados de salida 1520 a 1525 para unos oficios que el despacho firmará la próxima semana. Ese mismo día, por un error del sistema, se generó el radicado de entrada 3307 para un documento que ya había sido radicado con el 3306. Además, un profesional le reenvía un escrito de un ciudadano que llegó directamente a su correo institucional, con un anexo en PDF.", "items": [{"id": "GD-116", "niv": 1, "e": "Ante la solicitud de apartar los radicados de salida para los oficios de la próxima semana, usted debe", "f": "Acuerdo 001 de 2024 del AGN, art. 4.2.3", "o": [["A", "apartarlos, siempre que deje constancia en la planilla de la ventanilla de los números reservados.", "La reserva de números está prohibida aunque se deje constancia (art. 4.2.3, Acuerdo 001 de 2024); el radicado se asigna al momento del envío, con fecha y hora.", false], ["B", "asignarles desde ahora números consecutivos y anularlos con acta si al final no se usan.", "La anulación con acta (art. 4.2.3, par. 4, del Acuerdo 001 de 2024 del AGN) está prevista para errores en la radicación, no como mecanismo para apartar números, que el mismo artículo prohíbe.", false], ["C", "abstenerse de hacerlo, porque no se pueden reservar números de radicación.", "El artículo 4.2.3 del Acuerdo 001 de 2024 del AGN dispone que no se pueden reservar números de radicación ni habrá números repetidos, enmendados, corregidos o tachados; la numeración se asigna en estricto orden consecutivo.", true]]}, {"id": "GD-117", "niv": 2, "e": "Respecto del radicado 3307, generado por error, lo procedente es", "f": "Acuerdo 001 de 2024 del AGN, art. 4.2.3, parágrafo 4", "o": [["A", "anularlo y dejar constancia en un acta o documento equivalente, con la justificación y la firma del jefe del área de gestión documental.", "El parágrafo 4 del artículo 4.2.3 del Acuerdo 001 de 2024 del AGN dispone que, cuando existan errores en la radicación y se anulen números, se deje constancia en acta o documento equivalente con la justificación y la firma del jefe del área responsable de archivo o gestión documental.", true], ["B", "anularlo con una anotación en el sistema firmada por el técnico de la ventanilla que cometió el error.", "La anulación debe constar en acta o documento equivalente con justificación y firma del jefe del área responsable de archivo o gestión documental (art. 4.2.3, par. 4, del Acuerdo 001 de 2024 del AGN), no del técnico que radicó.", false], ["C", "reutilizar el número 3307 para la siguiente comunicación que llegue, anotando el cambio en la planilla de control, para que no quede un vacío en la numeración consecutiva.", "Reasignar un número ya generado produce números repetidos o corregidos, lo que prohíbe el artículo 4.2.3 del Acuerdo 001 de 2024; el número errado se anula y se deja constancia.", false]]}, {"id": "GD-118", "niv": 2, "e": "Con el escrito del ciudadano que llegó al correo institucional del profesional, usted debe", "f": "Acuerdo 001 de 2024 del AGN, arts. 4.2.2 y 4.2.6", "o": [["A", "devolverlo al profesional, porque al haberlo recibido él mismo en su correo institucional ya quedó oficialmente presentado ante la entidad.", "La llegada al correo de un servidor no oficializa el trámite; las comunicaciones recibidas por correos institucionales deben radicarse en la ventanilla única o la sede electrónica (art. 4.2.6, Acuerdo 001 de 2024).", false], ["B", "radicarlo junto con su anexo, verificando que tenga datos de contacto para la respuesta, y distribuirlo a la dependencia competente.", "El artículo 4.2.6 del Acuerdo 001 de 2024 del AGN ordena que las comunicaciones que ingresen por cualquier canal, incluidos los correos institucionales de servidores o contratistas, se remitan a la ventanilla única para radicarse con sus anexos, verificando los datos de contacto para la respuesta.", true], ["C", "pedir al ciudadano que lo envíe de nuevo por correo certificado para poder radicarlo.", "La ventanilla única debe habilitar canales presenciales y electrónicos (art. 4.2.2, par. 3, Acuerdo 001 de 2024); exigir el reenvío físico desconoce que el escrito ya ingresó por un canal de la entidad.", false]]}]}, {"comp": "gestion_documental", "rol": "tecnico", "tag": "Gestión documental · Niveles técnico, administrativo y operativo · Ventanilla única y radicación de comunicaciones oficiales", "texto": "Usted es técnico de la ventanilla de correspondencia de una procuraduría provincial. El procedimiento interno señala qué cargos están autorizados para firmar las comunicaciones oficiales que salen de la dependencia. Durante la mañana se presentan tres situaciones: un sustanciador trae un oficio dirigido a una alcaldía que aún no tiene firma y pide que se le asigne número de salida «para adelantar», porque el procurador lo firmará en la tarde; una ciudadana llega a presentar personalmente una petición; y por correo postal llega un escrito en el que se solicita a la procuraduría vigilar la ejecución de un contrato municipal, sin firma ni nombre de quien lo envía.", "items": [{"id": "GD-119", "niv": 2, "e": "Frente al oficio de salida que aún no tiene firma, el técnico de la ventanilla debe", "f": "Acuerdo 001 de 2024 del AGN, arts. 4.1.3 y 4.2.3", "o": [["A", "abstenerse de radicarlo hasta que lo firme el servidor autorizado según el procedimiento.", "El art. 4.1.3 del Acuerdo 001 de 2024 del AGN ordena a las entidades fijar los cargos autorizados para firmar las comunicaciones oficiales y dispone que las ventanillas únicas radiquen solamente los documentos que cumplan esa exigencia.", true], ["B", "radicarlo de inmediato y anotar en la planilla de control que la firma está pendiente.", "La ventanilla única debe radicar solamente los documentos que cumplen lo establecido sobre firmas responsables (art. 4.1.3 del Acuerdo 001 de 2024 del AGN); una anotación en la planilla no suple la firma del servidor autorizado.", false], ["C", "asignarle un número de radicado reservado, que quedará en firme cuando el procurador firme el oficio en la tarde.", "El art. 4.2.3 del Acuerdo 001 de 2024 del AGN prohíbe reservar números de radicación; además, el documento sin firma autorizada no puede radicarse (art. 4.1.3).", false]]}, {"id": "GD-120", "niv": 1, "e": "Al radicar la petición que la ciudadana presenta personalmente, debe quedar constancia de", "f": "Acuerdo 001 de 2024 del AGN, art. 4.2.3 y par. 3", "o": [["A", "el número de radicado y la fecha, sin registrar la hora, porque la fecha basta para contar los términos de respuesta.", "La hora de recibo es uno de los datos de los que debe quedar constancia al radicar (art. 4.2.3 del Acuerdo 001 de 2024 del AGN); omitirla resta trazabilidad a la actuación.", false], ["B", "la fecha, la hora de recibo y el número único de radicado.", "Según el art. 4.2.3 del Acuerdo 001 de 2024 del AGN, al radicar se deja constancia de la fecha, la hora de recibo o envío y el número único del radicado; el parágrafo 3 del mismo artículo ordena asignar radicado a las peticiones presentadas de manera presencial.", true], ["C", "la firma del profesional que tramitará la petición y la fecha en que deberá responderla.", "La radicación no exige la firma de quien tramitará el asunto; el art. 4.2.3 del Acuerdo 001 de 2024 del AGN pide dejar constancia de la fecha, la hora de recibo y el número único de radicado.", false]]}, {"id": "GD-121", "niv": 3, "e": "Respecto del escrito que llegó por correo postal sin firma ni nombre de quien lo envía, lo procedente en la ventanilla es", "f": "Acuerdo 001 de 2024 del AGN, arts. 4.1.3 y 4.2.6, par. 2", "o": [["A", "radicarlo solo después de que un profesional de la procuraduría confirme que los hechos descritos son ciertos.", "La radicación no depende de verificar previamente los hechos; es el registro inicial que permite el trámite (art. 4.2.3 del Acuerdo 001 de 2024 del AGN). La petición anónima se radica y se atiende (art. 4.2.6, par. 2).", false], ["B", "archivarlo sin radicar, porque la ventanilla solo puede radicar documentos con firma autorizada.", "La exigencia de firma autorizada del art. 4.1.3 del Acuerdo 001 de 2024 del AGN se refiere a las comunicaciones oficiales que firman los servidores de la entidad; para las peticiones sin firma ni nombre, el art. 4.2.6, par. 2, ordena radicarlas y atenderlas.", false], ["C", "radicarlo como comunicación anónima y remitirlo a la dependencia competente para que lo atienda.", "Las comunicaciones que ingresan por cualquier canal se radican (art. 4.2.6 del Acuerdo 001 de 2024 del AGN), y el par. 2 de ese artículo precisa que la petición sin firma ni nombre del responsable se considera anónima y debe ser radicada y atendida; la dependencia competente decide su trámite.", true]]}]}, {"comp": "gestion_documental", "rol": "general", "tag": "Gestión documental · Procesos de la gestión documental", "texto": "La secretaría general de la Procuraduría revisa su Programa de Gestión Documental (PGD) y reparte tareas entre tres equipos. El primero diseñará un nuevo formato para las solicitudes de copias antes de que empiece a usarse y definirá cómo se registrará en el sistema de gestión documental. El segundo se encargará de que cada comunicación recibida quede registrada, vinculada al trámite que corresponde, distribuida al responsable y con seguimiento hasta que el asunto se resuelva. El tercero estudiará las series de la entidad para determinar cuáles tienen solo valores administrativos y legales y cuáles tienen además valores para la investigación y la historia, con el fin de decidir su destino final.", "items": [{"id": "GD-138", "niv": 2, "e": "La tarea del segundo equipo, de registrar, vincular, distribuir y hacer seguimiento a las comunicaciones hasta la resolución del asunto, corresponde al proceso de", "f": "Decreto 1080 de 2015, art. 2.8.2.5.9", "o": [["A", "planeación documental.", "La planeación se ocupa de la generación y valoración de los documentos, incluido el diseño de formas y formularios (art. 2.8.2.5.9, lit. a, del Decreto 1080 de 2015), no del seguimiento de cada comunicación.", false
