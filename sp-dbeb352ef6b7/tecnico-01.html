guientes al retiro de Laura, pues ella fue directiva y el objeto es de su sector.", "El literal f) del numeral 2 del artículo 8 de la Ley 80 de 1993, adicionado por el artículo 4 de la Ley 1474 de 2011, impide contratar con la entidad respectiva a quienes ejercieron cargos del nivel directivo, y a las sociedades de las que hagan parte o a las que estén vinculados a cualquier título, durante los dos años siguientes al retiro, cuando el objeto que desarrollen tenga relación con el sector al cual prestaron sus servicios.", true], ["C", "la firma puede presentar la oferta, pues la inhabilidad de los exdirectivos solo cobija a Laura como persona natural y no a la sociedad que la vinculó como consultora.", "La norma extiende expresamente la inhabilidad a las sociedades de las que el exdirectivo haga parte o a las que esté vinculado a cualquier título.", false]]}]}, {"comp": "anticorrupcion", "rol": "general", "tag": "Estatuto Anticorrupción y transparencia · Programas de Transparencia y Ética Pública", "texto": "Un equipo de una procuraduría delegada con funciones preventivas visita una empresa industrial y comercial del Estado del orden municipal dedicada a la promoción turística, que contrata con normas de derecho privado. El gerente sostiene que la entidad no está obligada a adoptar un Programa de Transparencia y Ética Pública, porque no aplica el Estatuto General de Contratación y porque, según él, esa obligación es solo para los ministerios y demás entidades nacionales. El jefe de planeación, por su parte, presenta un borrador del programa y pregunta qué contenidos debe incluir y quién fija los estándares mínimos que debe cumplir.", "items": [{"id": "AC-116", "niv": 2, "e": "Frente a la posición del gerente, el equipo de la procuraduría le explica que la empresa", "f": "Ley 1474 de 2011, art. 73 (modificado por la Ley 2195 de 2022, art. 31)", "o": [["A", "no está obligada, porque los programas de transparencia solo se exigen a las entidades que contratan con el Estatuto General, la Ley 80 de 1993.", "La norma incluye expresamente a las entidades cualquiera que sea su régimen de contratación, de modo que contratar con derecho privado no la excluye.", false], ["B", "solo debe adoptarlo si el concejo municipal se lo ordena mediante acuerdo, porque es una entidad descentralizada.", "La obligación surge directamente de la ley para las entidades de todos los órdenes; no depende de un acuerdo del concejo.", false], ["C", "sí debe implementarlo, porque la obligación cobija a entidades de todos los órdenes, cualquiera que sea su régimen de contratación.", "El artículo 73 de la Ley 1474 de 2011, modificado por el artículo 31 de la Ley 2195 de 2022, ordena que cada entidad del orden nacional, departamental y municipal, cualquiera que sea su régimen de contratación, implemente Programas de Transparencia y Ética Pública.", true]]}, {"id": "AC-117", "niv": 2, "e": "Entre los contenidos que el programa debe incluir según la ley se encuentran", "f": "Ley 1474 de 2011, art. 73 (modificado por la Ley 2195 de 2022, art. 31)", "o": [["A", "las medidas de debida diligencia y los canales de denuncia previstos en la ley.", "El artículo 73 de la Ley 1474 de 2011, modificado por la Ley 2195 de 2022, incluye entre los contenidos del programa las medidas de debida diligencia en las entidades del sector público, los canales de denuncia conforme al artículo 76 de esa ley y las estrategias de transparencia, Estado abierto, acceso a la información pública y cultura de legalidad, entre otros.", true], ["B", "un régimen especial de inhabilidades para sus contratistas, distinto del previsto en las leyes.", "Las inhabilidades son de reserva legal; una entidad no puede crear un régimen propio de inhabilidades mediante su programa de transparencia.", false], ["C", "la definición de faltas disciplinarias y sanciones propias para los servidores de la empresa.", "Las faltas y sanciones disciplinarias están definidas en la ley disciplinaria, no en el programa de la entidad; el programa contiene medidas de prevención y gestión del riesgo de corrupción.", false]]}, {"id": "AC-118", "niv": 3, "e": "Sobre los estándares mínimos del programa, el jefe de planeación debe saber que", "f": "Ley 1474 de 2011, art. 73 (modificado por la Ley 2195 de 2022, art. 31)", "o": [["A", "los fija la Procuraduría General de la Nación, que además aprueba cada programa antes de su adopción.", "La ley no asigna a la Procuraduría la fijación de los estándares ni la aprobación previa de cada programa, sin perjuicio de sus funciones preventivas y de vigilancia.", false], ["B", "cada entidad los define libremente, porque la ley solo exige que el programa se publique en la página web.", "La ley no deja los estándares a la libre definición de cada entidad: asigna su fijación a una autoridad del orden nacional.", false], ["C", "los señala la Secretaría de Transparencia de la Presidencia, en armonía con el Modelo Integrado de Planeación y Gestión.", "El artículo 73 de la Ley 1474 de 2011, modificado por la Ley 2195 de 2022, dispone que la Secretaría de Transparencia de la Presidencia de la República señala las características, estándares, elementos, requisitos, procedimientos y controles mínimos de los programas, que deben articularse con el Modelo Integrado de Planeación y Gestión (MIPG).", true]]}]}, {"comp": "anticorrupcion", "rol": "tecnico", "tag": "Estatuto Anticorrupción y transparencia · Niveles técnico, administrativo y operativo · Código de Integridad del servicio público", "texto": "Andrés es técnico de la ventanilla de atención de una alcaldía. Sus compañeros destacan que siempre termina a tiempo los trámites asignados, revisa con atención cada documento y busca la forma de hacer más con menos recursos. También aplica los mismos requisitos a todos los usuarios: no le da prioridad a nadie por ser conocido o por su posición social, y garantiza a cada persona el trámite al que tiene derecho. Este año, el comité de gestión y desempeño de la alcaldía propone incluir en el código de integridad de la entidad un valor adicional, \"solidaridad\", con sus propias conductas asociadas.", "items": [{"id": "AC-135", "niv": 1, "e": "La conducta de Andrés al terminar a tiempo sus trámites, con atención y optimizando los recursos, corresponde principalmente al valor denominado", "f": "Código de Integridad del Servicio Público (Función Pública)", "o": [["A", "respeto.", "El respeto se refiere a reconocer, valorar y tratar de manera digna a todas las personas; no describe la oportunidad y la eficiencia en el cumplimiento de las tareas.", false], ["B", "diligencia.", "El Código de Integridad define la diligencia como cumplir los deberes, funciones y responsabilidades del cargo de la mejor manera posible, con atención, prontitud, destreza y eficiencia, para optimizar el uso de los recursos del Estado.", true], ["C", "honestidad.", "La honestidad se refiere a actuar con fundamento en la verdad, con transparencia y rectitud, favoreciendo el interés general; no describe la prontitud y la eficiencia en el trabajo.", false]]}, {"id": "AC-136", "niv": 1, "e": "Aplicar los mismos requisitos a todos, sin favorecer a nadie y garantizando los derechos de cada persona, refleja el valor denominado", "f": "Código de Integridad del Servicio Público (Función Pública)", "o": [["A", "justicia.", "El Código de Integridad define la justicia como actuar con imparcialidad, garantizando los derechos de las personas, con equidad, igualdad y sin discriminación.", true], ["B", "diligencia.", "La diligencia se refiere a cumplir las funciones con atención, prontitud y eficiencia; no describe la imparcialidad y la igualdad de trato.", false], ["C", "compromiso.", "El compromiso se refiere a ser consciente de la importancia del rol de servidor y estar dispuesto a comprender y resolver las necesidades de las personas; no describe la imparcialidad en la aplicación de los requisitos.", false]]}, {"id": "AC-137", "niv": 2, "e": "Sobre la propuesta de agregar el valor \"solidaridad\" al código de integridad de la alcaldía, es correcto afirmar que", "f": "Ley 2016 de 2020, art. 1", "o": [["A", "la alcaldía puede reemplazar el Código de Integridad por un código propio, porque cada entidad tiene autonomía administrativa.", "La Ley 2016 de 2020 hace obligatoria la adopción del Código de Integridad; la autonomía de la entidad le permite complementarlo, no sustituirlo.", false], ["B", "puede incorporarse como complemento, siempre que se respeten los valores del Código de Integridad.", "El artículo 1 de la Ley 2016 de 2020 ordena adoptar el Código de Integridad en todas las entidades y ramas del poder público, y reconoce la autonomía de cada entidad para complementarlo respetando los valores que ya están contenidos en él.", true], ["C", "no puede agregarse ningún valor, porque el código debe adoptarse de forma literal y sin complementos.", "La ley permite a cada entidad complementar el código, siempre que respete sus valores; no impone una adopción literal sin complementos.", false]]}]}, {"comp": "anticorrupcion", "rol": "general", "tag": "Estatuto Anticorrupción y transparencia · Control interno y lucha contra la corrupción", "texto": "En un municipio, el alcalde de turno designó al jefe de la oficina de control interno a mediados de su período de gobierno, como lo prevé la ley. Dos años después se posesiona un nuevo alcalde, que anuncia que reemplazará al jefe de control interno por una persona de su confianza. Mientras tanto, el jefe de control interno detecta en una auditoría indicios de que un contratista cobró dos veces por el mismo servicio con la complicidad de un funcionario. Además, la oficina de atención al ciudadano le pregunta qué papel tiene control interno frente a las quejas y reclamos.", "items": [{"id": "AC-144", "niv": 3, "e": "Frente al anuncio del nuevo alcalde, es correcto afirmar que", "f": "Ley 87 de 1993, art. 11 (modificado por la Ley 1474 de 2011, art. 8)", "o": [["A", "puede reemplazarlo libremente, porque el jefe de control interno es de libre nombramiento y remoción del alcalde de turno.", "En el nivel territorial, la ley dispone que el jefe de control interno se designa para un período fijo, lo que impide reemplazarlo libremente al cambiar el alcalde.", false], ["B", "debe reemplazarlo, porque el período del jefe de control interno termina con el del alcalde que lo designó.", "La ley desvincula los períodos: el jefe de control interno se designa en la mitad del período del mandatario, de modo que su período no termina con el del alcalde que lo designó.", false], ["C", "no puede reemplazarlo a discreción, porque fue designado para un período fijo de cuatro años que no coincide con el del alcalde.", "El artículo 8 de la Ley 1474 de 2011 dispone que, en las entidades territoriales, el jefe de la unidad de control interno es designado por el alcalde o gobernador para un período fijo de cuatro años, en la mitad del respectivo período del alcalde o gobernador.", true]]}, {"id": "AC-145", "niv": 2, "e": "Frente a los indicios del doble cobro, el jefe de control interno", "f": "Ley 87 de 1993, art. 14 (modificado por la Ley 1474 de 2011, art. 9, y el Decreto Ley 2106 de 2019, art. 156)", "o": [["A", "debe esperar a la auditoría del año siguiente para confirmar los hechos antes de informar a cualquier autoridad.", "Aplazar el reporte iría en contra del deber legal de informar los posibles actos de corrupción; confirmar los hechos corresponde a las autoridades competentes.", false], ["B", "debe reportar a los organismos de control los posibles actos de corrupción e irregularidades encontrados.", "El artículo 14 de la Ley 87 de 1993, modificado por el artículo 9 de la Ley 1474 de 2011 y luego por el artículo 156 del Decreto Ley 2106 de 2019, dispone que el jefe de la unidad de control interno debe reportar a los organismos de control los posibles actos de corrupción e irregularidades que encuentre en el ejercicio de sus funciones. Aunque la norma se refiere al jefe del orden nacional, el deber se predica también del jefe territorial por la naturaleza de su función y por el deber general de denuncia de los servidores.", true], ["C", "solo debe informar al alcalde, quien decide si los hechos se remiten a otras autoridades.", "La ley impone al jefe de control interno el deber de reportar directamente a los organismos de control; su deber no depende de la decisión del alcalde.", false]]}, {"id": "AC-146", "niv": 1, "e": "Frente a las quejas y reclamos, a la oficina de control interno le corresponde", "f": "Ley 1474 de 2011, art. 76", "o": [["A", "vigilar que la atención se preste conforme a las normas y rendir un informe semestral a la administración.", "El artículo 76 de la Ley 1474 de 2011 dispone que la oficina de control interno vigila que la atención de quejas, sugerencias y reclamos se preste de acuerdo con las normas legales vigentes y rinde a la administración de la entidad un informe semestral sobre el particular.", true], ["B", "resolver directamente todas las quejas y reclamos, en reemplazo de la dependencia de atención al ciudadano.", "La ley exige una dependencia encargada de recibir, tramitar y resolver las quejas; a control interno le corresponde vigilar esa atención, no reemplazar a la dependencia.", false], ["C", "ninguna función, porque las quejas y reclamos son competencia exclusiva de la personería municipal.", "La ley asigna a la oficina de control interno una función de vigilancia sobre la atención de quejas, sugerencias y reclamos de la entidad.", false]]}]}, {"comp": "comportamental", "rol": "tecnico", "tag": "Competencias comportamentales (Diccionario de la Procuraduría) · Niveles técnico, administrativo y operativo · Cumplimiento de parámetros de trabajo", "texto": "Usted es sustanciador, de nivel técnico, en una procuraduría provincial, y su empleo exige Cumplimiento de parámetros de trabajo en nivel C. El procurador provincial fijó como pauta que todo proyecto de auto pase por revisión de un profesional antes de la firma. Un colega de otra provincial le cuenta que allá no hacen esa revisión en los autos de trámite sencillos. Hoy, mientras proyecta un auto, nota que la plantilla de auto de apertura, que se usa para quejas recibidas este año, todavía cita como norma de procedimiento la Ley 734 de 2002, derogada por el Código General Disciplinario (Ley 1952 de 2019, reformada por la Ley 2094 de 2021).", "items": [{"id": "CO-128", "niv": 1, "e": "Frente a la pauta de revisión previa, lo que mejor refleja el nivel C de Cumplimiento de parámetros de trabajo es", "f": "Diccionario de Competencias Comportamentales PGN, Cumplimiento de parámetros de trabajo, nivel C", "o": [["A", "proponer que la revisión se elimine y se reemplace por una lista de chequeo que usted mismo elabore.", "Diseñar herramientas propias se relaciona con Creatividad e innovación; en Cumplimiento de parámetros de trabajo, nivel C, lo esperado es aplicar la pauta vigente.", false], ["B", "omitir la revisión en los autos de trámite sencillos, como hacen en la otra provincial, para ganar tiempo.", "Se aparta de la pauta fijada por el jefe de su dependencia. La práctica de otra oficina no reemplaza las directrices que rigen la propia dependencia.", false], ["C", "seguir la pauta del procurador provincial y pasar cada proyecto al profesional antes de la firma.", "El nivel C de Cumplimiento de parámetros de trabajo consiste en aplicar directrices para conseguir los objetivos de la dependencia; una de sus conductas es seguir las pautas definidas por el jefe inmediato.", true]]}, {"id": "CO-129", "niv": 2, "e": "Ante la plantilla que cita una norma derogada, lo coherente con el nivel C de Cumplimiento de parámetros de trabajo es", "f": "Diccionario de Competencias Comportamentales PGN, Cumplimiento de parámetros de trabajo, nivel C", "o": [["A", "dejar el proyecto en espera hasta que el jefe actualice la plantilla oficial de la dependencia.", "Detiene el trámite sin necesidad. La norma vigente se puede aplicar de inmediato, que es lo que pide acatar las normas que rigen la dependencia.", false], ["B", "aplicar la norma vigente en el auto e informar a su jefe para que la plantilla se corrija.", "El nivel C de Cumplimiento de parámetros de trabajo incluye acatar las normas que rigen el quehacer de la dependencia y seguir las pautas del jefe inmediato; informar al jefe respeta su papel en la definición de la plantilla.", true], ["C", "usar la plantilla tal como está, porque es la que aprobó el jefe de la dependencia.", "Seguir la pauta del jefe no justifica aplicar una norma derogada. El nivel C incluye acatar las normas y la reglamentación que rigen el quehacer de la dependencia.", false]]}, {"id": "CO-130", "niv": 3, "e": "Si el empleo exigiera el nivel B de Cumplimiento de parámetros de trabajo, en lugar del C, la diferencia sería que el servidor", "f": "Diccionario de Competencias Comportamentales PGN, Cumplimiento de parámetros de trabajo, nivel B", "o": [["A", "cumple las normas fijadas para sus actividades y vigila con herramientas de control la calidad de las tareas del equipo.", "Describe el nivel B de Orientación al orden, la calidad y la exactitud (cumplir las normas de sus actividades e implementar herramientas de control de las tareas del equipo), no el de Cumplimiento de parámetros de trabajo.", false], ["B", "acata las normas de su dependencia y sigue las pautas de su jefe inmediato.", "Estas son las conductas del nivel C, el que ya exige el empleo.", false], ["C", "sigue los lineamientos en distintos procesos organizacionales y define objetivos para su equipo alineados con los procedimientos.", "El nivel B de Cumplimiento de parámetros de trabajo (aplicar criterios para desempeñarse dentro de procesos organizacionales) incluye seguir reglas y lineamientos en diferentes procesos y definir objetivos del equipo alineados con procedimientos definidos.", true]]}]}, {"comp": "comportamental", "rol": "tecnico", "tag": "Competencias comportamentales (Diccionario de la Procuraduría) · Niveles técnico, administrativo y operativo · Organización en el trabajo", "texto": "Usted es técnico administrativo de la secretaría de una procuraduría provincial y su empleo exige Organización en el trabajo en nivel D. Expide constancias, presta expedientes y alimenta el sistema de información. La secretaría fija tres días hábiles para expedir cada constancia y tiene un procedimiento estandarizado para cada trámite. Para ubicar los expedientes que necesita cuenta con el inventario documental y el sistema de información.", "items": [{"id": "CO-161", "niv": 1, "e": "En su trabajo diario, lo que corresponde al nivel D de Organización en el trabajo es", "f": "Diccionario de Competencias Comportamentales PGN, Organización en el trabajo, nivel D", "o": [["A", "aplicar el procedimiento estandarizado y procurar terminar cada trámite antes del tiempo fijado.", "Según el diccionario, el nivel D de Organización en el trabajo consiste en ejecutar las actividades según los parámetros de eficiencia de la entidad, de forma estandarizada y en menos tiempo del requerido.", true], ["B", "revisar que sus compañeros de la secretaría apliquen las normas de calidad en sus trámites.", "Verificar la aplicación de normas de calidad en el trabajo de compañeros es una conducta del nivel C.", false], ["C", "hacer cada trámite a su manera, siempre que el resultado final se entregue dentro del plazo fijado.", "Se aparta del trabajo estandarizado que el diccionario exige en el nivel D.", false]]}, {"id": "CO-162", "niv": 2, "e": "Para cumplir el plazo de las constancias en una semana de alta demanda, lo coherente con el nivel D de Organización en el trabajo es", "f": "Diccionario de Competencias Comportamentales PGN, Organización en el trabajo, nivel D", "o": [["A", "omitir los pasos de verificación en las constancias más sencillas para terminar más rápido.", "Gana tiempo a costa del procedimiento; el nivel D busca menores tiempos, pero dentro de la forma estandarizada.", false], ["B", "acumular las solicitudes de la semana y tramitarlas todas juntas el último día del plazo.", "No hace las actividades en menos tiempo del requerido y arriesga el cumplimiento del plazo, contrario al nivel D.", false], ["C", "tramitar cada solicitud con el procedimiento estandarizado apenas llega.", "El nivel D de Organización en el trabajo incluye realizar las actividades en forma estandarizada y en menores tiempos que los requeridos por la entidad.", true]]}, {"id": "CO-163", "niv": 2, "e": "Al buscar los expedientes que necesita para sus trámites, lo coherente con el nivel D de Organización en el trabajo es", "f": "Diccionario de Competencias Comportamentales PGN, Organización en el trabajo, nivel D", "o": [["A", "recorrer los estantes del archivo hasta familiarizarse con la ubicación de las carpetas.", "Es una búsqueda por ensayo y error, que no corresponde al acceso sistemático a la información del nivel D.", false], ["B", "consultar en orden el inventario y el sistema de información antes de ir al estante.", "Una de las conductas del nivel D de Organización en el trabajo es acceder a la información y los datos en forma sistemática y didáctica para realizar el trabajo.", true], ["C", "preguntar a la secretaria más antigua, que conoce de memoria la ubicación de cada carpeta.", "Depende de la memoria de otra persona y no de un acceso sistemático a la información, como describe el nivel D.", false]]}]}, {"comp": "comportamental", "rol": "tecnico", "tag": "Competencias comportamentales (Diccionario de la Procuraduría) · Niveles técnico, administrativo y operativo · Orientación al usuario", "texto": "Usted es técnico del centro de atención al público de una procuraduría regional y su empleo exige Orientación al usuario en nivel C. Una ciudadana llega a preguntar cómo solicitar que la Procuraduría intervenga en un proceso de familia que se adelanta en un juzgado, y no tiene claro qué documentos debe presentar. La coordinadora del centro, por su parte, quiere saber si los ciudadanos quedan satisfechos con la atención que reciben.", "items": [{"id": "CO-185", "niv": 1, "e": "Al atender a la ciudadana, lo que mejor refleja el nivel C de Orientación al usuario es", "f": "Diccionario de Competencias Comportamentales PGN, Orientación al usuario, nivel C", "o": [["A", "explicarle el procedimiento para pedir la intervención, sus plazos y la instancia competente.", "El nivel C de Orientación al usuario consiste en guiar en procesos, procedimientos, plazos o instancias relacionados con las solicitudes de los usuarios.", true], ["B", "atenderla con amabilidad y entregarle el folleto general de servicios de la Procuraduría.", "Atender con amabilidad y ofrecer información básica corresponde al nivel D. El nivel C guía en los procesos, plazos e instancias de la solicitud concreta.", false], ["C", "expresarle sus ideas con claridad y escuchar con atención lo que ella le cuenta de su proceso.", "Expresarse con claridad y escuchar con atención es el nivel C de Comunicación. Es valioso, pero no es guiar en procedimientos, plazos e instancias, que define el nivel C de Orientación al usuario.", false]]}, {"id": "CO-186", "niv": 2, "e": "Frente a la duda de la ciudadana sobre los documentos, lo coherente con el nivel C de Orientación al usuario es", "f": "Diccionario de Competencias Comportamentales PGN, Orientación al usuario, nivel C", "o": [["A", "estar atento a lo que ella necesita y darle la información precisa que su solicitud requiere.", "Las conductas del nivel C de Orientación al usuario incluyen brindar información de acuerdo con los requerimientos de los usuarios y estar atento a esos requerimientos para darles la información necesaria.", true], ["B", "diseñar una estrategia para que el centro resuelva mejor este tipo de solicitudes en el futuro.", "Diseñar e implementar estrategias para recibir y resolver solicitudes es propio del nivel A; no atiende la necesidad presente de la ciudadana.", false], ["C", "pedirle que consulte la página web de la entidad, donde está la información de todos los trámites.", "Remite a una fuente general en vez de responder a su requerimiento concreto, que es lo que describe el nivel C.", false]]}, {"id": "CO-187", "niv": 3, "e": "La tarea de averiguar, con una encuesta, qué tan conformes quedan los ciudadanos con la atención recibida corresponde, según el diccionario,", "f": "Diccionario de Competencias Comportamentales PGN, Orientación al usuario, nivel B", "o": [["A", "al nivel B de Objetividad.", "Objetividad trata de adoptar posiciones con criterios cuantitativos; los estudios de satisfacción del usuario el diccionario los ubica expresamente en Orientación al usuario.", false], ["B", "al nivel C de Orientación al usuario.", "El nivel C se refiere a guiar y brindar información según los requerimientos del usuario, no a realizar estudios de satisfacción.", false], ["C", "al nivel B de Orientación al usuario.", "El nivel B de Orientación al usuario (anticiparse a las necesidades y mantener la relación hasta lograr la satisfacción) incluye realizar estudios orientados a la satisfacción del usuario.", true]]}]}];
const CFG = {"titulo": "Simulacro 1 · Técnico, administrativo y operativo · Procuraduría 2027", "modo": "simulacro", "minutos": 210, "componentes": {"estructura_pgn": "Estructura y funciones de la Procuraduría", "gestion_publica": "Gestión pública y funcionamiento del Estado", "atencion_usuario": "Atención al usuario", "gestion_documental": "Gestión documental", "documentos_oficina": "Elaboración de documentos de oficina", "ofimatica": "Herramientas ofimáticas", "sistemas_gestion": "Sistemas de gestión (MIPG, control interno y calidad)", "disciplinario": "Código General Disciplinario", "contratacion": "Contratación estatal", "anticorrupcion": "Estatuto Anticorrupción y transparencia", "comportamental": "Competencias comportamentales (Diccionario de la Procuraduría)"}, "niveles": {"1": "Básico", "2": "Intermedio", "3": "Avanzado"}, "roles": {"general": "Todos los niveles", "tecnico": "Niveles técnico, administrativo y operativo", "profesional": "Niveles profesional, asesor y ejecutivo"}, "clave": "tecnico-01.html"};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY = 'sim-pgn:' + CFG.clave;
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}
function save(){try{localStorage.setItem(KEY, JSON.stringify(ST))}catch(e){}}
let ST = load();
ST.r = ST.r || {};
$('#tit').textContent = CFG.titulo;
const ITEMS = [];
DATA.forEach(c => c.items.forEach(it => { it.caso = c; ITEMS.push(it); }));

function justHTML(it){
  return '<div class="just">' + it.o.map(o => `<div><b>${o[0]}.</b> <span class="${o[3]?'okt':'not'}">${o[3]?'Es correcta.':'Es incorrecta.'}</span> ${esc(o[2])}</div>`).join('') +
    `<div class="src">Referencia: ${esc(it.f)}</div></div>`;
}
function itemHTML(it, n, mode){
  const r = ST.r[it.id];
  const reveal = mode === 'review' || (CFG.modo === 'practica' && r);
  let h = `<div class="item" id="i-${it.id}"><p class="enun"><span class="n">${n}.</span> <span class="niv">${CFG.niveles[it.niv]}</span> ${esc(it.e)}</p>`;
  it.o.forEach(o => {
    let cls = '';
    if (reveal) { if (o[3]) cls = 'ok'; else if (r === o[0]) cls = 'no'; }
    else if (r === o[0]) cls = 'sel';
    h += `<button class="op ${cls}" data-id="${it.id}" data-l="${o[0]}" ${reveal?'disabled':''}><span class="l">${o[0]}.</span><span>${esc(o[1])}</span></button>`;
  });
  if (reveal) {
    if (mode === 'review') h += `<div class="${r===keyOf(it)?'res-ok':'res-no'}" style="font-size:14px;margin-top:4px">${r ? (r===keyOf(it)?'Respondiste ' + r + ': correcto.':'Respondiste ' + r + '. La respuesta correcta es ' + keyOf(it) + '.') : 'Sin responder. La respuesta correcta es ' + keyOf(it) + '.'}</div>`;
    h += justHTML(it);
  }
  return h + '</div>';
}
const keyOf = it => it.o.find(o => o[3])[0];

function renderList(list, mode){
  let h = '', last = null, n = 0;
  list.forEach(it => {
    n++;
    if (it.caso !== last) { last = it.caso; h += `<div class="caso"><div class="tag">${esc(it.caso.tag)}</div><p>${esc(it.caso.texto)}</p></div>`; }
    h += itemHTML(it, n, mode);
  });
  return h;
}

// ---------- PRÁCTICA ----------
let LIST = [];
let FILTRO = ST.f || {comp:'', niv:'', rol:''};
function practica(){
  const comps = Object.entries(CFG.componentes).map(([k,v]) => `<option value="${k}" ${FILTRO.comp===k?'selected':''}>${esc(v)}</option>`).join('');
  const nivs = Object.entries(CFG.niveles).map(([k,v]) => `<option value="${k}" ${FILTRO.niv===k?'selected':''}>${esc(v)}</option>`).join('');
  const list = ITEMS.filter(it => (!FILTRO.comp || it.caso.comp===FILTRO.comp) && (!FILTRO.niv || String(it.niv)===FILTRO.niv) && (!FILTRO.rol || it.caso.rol===FILTRO.rol || it.caso.rol==='general'));
  const resp = list.filter(it => ST.r[it.id]); const ok = resp.filter(it => ST.r[it.id]===keyOf(it));
  $('#main').innerHTML = `<div class="panel"><p style="margin-top:0">Elige un tema, tu nivel de empleo y la dificultad. Al responder verás de inmediato si acertaste y la explicación de cada opción.</p>
  <div class="row"><select id="fc"><option value="">Todos los temas</option>${comps}</select>
  <select id="fn"><option value="">Todas las dificultades</option>${nivs}</select>
  <select id="fr"><option value="">Todos los niveles de empleo</option>${['tecnico','profesional'].map(k => `<option value="${k}" ${FILTRO.rol===k?'selected':''}>${esc(CFG.roles[k])} (y temas comunes)</option>`).join('')}</select>
  <button class="btn sec" id="borrar">Borrar mis respuestas</button></div>
  <p class="stat" id="pst" style="margin-bottom:0">${list.length} preguntas · respondidas ${resp.length} · aciertos ${ok.length}${resp.length? ' (' + Math.round(100*ok.length/resp.length) + ' %)':''}</p></div>` + renderList(list, 'practica');
  $('#prog').textContent = `${ok.length}/${resp.length} aciertos`;
  ['fc','fn','fr'].forEach((id,i) => $('#'+id).onchange = e => { FILTRO[['comp','niv','rol'][i]] = e.target.value; ST.f = FILTRO; save(); practica(); });
  LIST = list;
  $('#borrar').onclick = () => { list.forEach(it => delete ST.r[it.id]); save(); practica(); };
}

// ---------- SIMULACRO ----------
let tick = null;
function inicio(){
  const n = ITEMS.length, cnt = {};
  ITEMS.forEach(it => cnt[it.caso.comp] = (cnt[it.caso.comp]||0) + 1);
  const h = Math.floor(CFG.minutos/60), m = CFG.minutos%60;
  $('#main').innerHTML = `<div class="panel"><h2 style="margin-top:0;color:var(--pri)">Instrucciones</h2>
  <p>Este simulacro tiene <b>${n} preguntas</b> en formato de caso: una situación, enunciados que se completan y tres opciones con una sola respuesta correcta.</p>
  <table>${Object.entries(cnt).map(([k,v]) => `<tr><td>${esc(CFG.componentes[k])}</td><td class="r">${v}</td></tr>`).join('')}</table>
  <p>Tiempo sugerido: <b>${h ? h + ' h ' : ''}${m ? m + ' min' : ''}</b> (unos ${Math.round(CFG.minutos*60/n/6)/10} minutos por pregunta). Cuando se acaba el tiempo puedes seguir, pero el cronómetro lo indica.</p>
  <p>Tus respuestas se guardan en este navegador. Al terminar verás tu puntaje por componente y por dificultad, y la explicación de cada pregunta.</p>
  <button class="btn" id="go">${ST.t0 ? 'Continuar el simulacro' : 'Comenzar'}</button></div>`;
  $('#prog').textContent = `${n} preguntas`;
  $('#go').onclick = () => { if (!ST.t0) { ST.t0 = Date.now(); save(); } examen(); };
}
function reloj(){
  const rest = CFG.minutos*60 - Math.floor((Date.now() - ST.t0)/1000);
  const a = Math.abs(rest), hh = Math.floor(a/3600), mm = Math.floor(a%3600/60), ss = a%60;
  const t = (rest < 0 ? '+' : '') + (hh ? hh + ':' : '') + String(mm).padStart(2,'0') + ':' + String(ss).padStart(2,'0');
  $('#timer').textContent = rest < 0 ? 'Tiempo cumplido ' + t : '⏱ ' + t;
  $('#timer').classList.toggle('low', rest < 600);
}
function examen(){
  $('#main').innerHTML = renderList(ITEMS, 'examen') + `<div class="panel"><button class="btn" id="fin">Terminar y calificar</button></div>`;
  progreso(); reloj(); clearInterval(tick); tick = setInterval(reloj, 1000);
  $('#fin').onclick = () => {
    const faltan = ITEMS.length - Object.keys(ST.r).filter(k => ITEMS.some(i => i.id===k)).length;
    $('#mtxt').textContent = faltan ? `Te faltan ${faltan} preguntas por responder. ¿Quieres calificar de todos modos?` : '¿Quieres terminar y ver tu calificación?';
    $('#modal').classList.remove('hide');
  };
}
function progreso(){
  const r = ITEMS.filter(it => ST.r[it.id]).length;
  $('#prog').textContent = `Respondidas ${r}/${ITEMS.length}`;
}
$('#mno').onclick = () => $('#modal').classList.add('hide');
$('#msi').onclick = () => { $('#modal').classList.add('hide'); ST.fin = Date.now(); save(); resultados(); };
function resultados(){
  clearInterval(tick);
  const ok = ITEMS.filter(it => ST.r[it.id] === keyOf(it)).length;
  const pct = Math.round(1000*ok/ITEMS.length)/10;
  const g = (fn, lab) => { const m = {}; ITEMS.forEach(it => { const k = fn(it); m[k] = m[k] || [0,0]; m[k][1]++; if (ST.r[it.id]===keyOf(it)) m[k][0]++; });
    return Object.entries(m).map(([k,v]) => `<tr><td>${esc(lab(k))}</td><td class="r">${v[0]}/${v[1]}</td><td class="r">${Math.round(100*v[0]/v[1])} %</td></tr>`).join(''); };
  const mins = Math.round(((ST.fin||Date.now()) - ST.t0)/60000);
  $('#timer').textContent = `Tiempo usado: ${Math.floor(mins/60) ? Math.floor(mins/60) + ' h ' : ''}${mins%60} min`;
  $('#prog').textContent = `${ok}/${ITEMS.length} aciertos`;
  $('#main').innerHTML = `<div class="panel"><div class="big">${String(pct).replace('.',',')} %</div>
  <p style="margin-top:4px">${ok} de ${ITEMS.length} respuestas correctas. ${pct >= 75 ? 'Muy buen resultado: repasa las explicaciones de tus errores para afianzarlo.' : pct >= 65 ? 'Vas bien, pero con poco margen: refuerza los componentes con menor porcentaje.' : 'Todavía no estás en zona segura: practica por tema los componentes con menor porcentaje.'}</p>
  <p class="aviso">Referencia: en el concurso de la Procuraduría la prueba de conocimientos es eliminatoria con mínimo de 65 puntos sobre 100, y la comportamental es clasificatoria. Este porcentaje de aciertos es una guía de preparación; la calificación oficial usa una escala estándar que compara a los aspirantes.</p>
  <h3>Por componente</h3><table>${g(it => it.caso.comp, k => CFG.componentes[k])}</table>
  <h3>Por dificultad</h3><table>${g(it => it.niv, k => CFG.niveles[k])}</table>
  <div class="row" style="margin-top:14px"><button class="btn" id="solo">Ver solo mis errores</button><button class="btn sec" id="todas">Ver todas</button><button class="btn sec" id="otra">Reiniciar el simulacro</button></div></div><div id="rev"></div>`;
  const rev = errs => { const l = errs ? ITEMS.filter(it => ST.r[it.id] !== keyOf(it)) : ITEMS; $('#rev').innerHTML = renderList(l, 'review'); };
  rev(true);
  $('#solo').onclick = () => rev(true); $('#todas').onclick = () => rev(false);
  $('#otra').onclick = () => { ST = {r:{}}; save(); inicio(); window.scrollTo(0,0); };
}

document.addEventListener('click', e => {
  const b = e.target.closest('button.op'); if (!b || b.disabled) return;
  ST.r[b.dataset.id] = b.dataset.l; save();
  const it = ITEMS.find(i => i.id === b.dataset.id);
  const n = b.closest('.item').querySelector('.n').textContent.replace('.','');
  b.closest('.item').outerHTML = itemHTML(it, n, CFG.modo === 'practica' ? 'practica' : 'examen');
  if (CFG.modo === 'practica') { const resp = LIST.filter(i => ST.r[i.id]); const ok = resp.filter(i => ST.r[i.id]===keyOf(i)).length; $('#prog').textContent = `${ok}/${resp.length} aciertos`; $('#pst').textContent = `${LIST.length} preguntas · respondidas ${resp.length} · aciertos ${ok} (${Math.round(100*ok/resp.length)} %)`; }
  else progreso();
});

if (CFG.modo === 'practica') practica();
else if (ST.fin) resultados();
else if (ST.t0) examen();
else inicio();
</script>
</body>
</html>
