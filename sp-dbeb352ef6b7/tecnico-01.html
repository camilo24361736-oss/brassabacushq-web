], ["B", "gestión y trámite.", "El art. 2.8.2.5.9, lit. c, del Decreto 1080 de 2015 define la gestión y trámite como las actuaciones para el registro, la vinculación a un trámite, la distribución, la descripción, la disponibilidad y el control y seguimiento de los trámites hasta la resolución de los asuntos.", true], ["C", "organización documental.", "La organización comprende declarar el documento en el sistema, clasificarlo, ubicarlo, ordenarlo y describirlo (art. 2.8.2.5.9, lit. d, del Decreto 1080 de 2015); no incluye la distribución ni el seguimiento del trámite.", false]]}, {"id": "GD-139", "niv": 2, "e": "La tarea del tercer equipo corresponde al proceso de", "f": "Decreto 1080 de 2015, art. 2.8.2.5.9", "o": [["A", "transferencia, que se realiza una sola vez al final del ciclo vital.", "La transferencia agrupa las operaciones para trasladar documentos entre las fases de archivo (art. 2.8.2.5.9, lit. e, del Decreto 1080 de 2015); no es el proceso que determina los valores de los documentos.", false], ["B", "disposición de documentos, que se aplica a las series cuando cumplen su tiempo en el archivo central.", "La disposición puede aplicarse en cualquier etapa según la TRD o TVD (art. 2.8.2.5.9, lit. f, del Decreto 1080 de 2015), y la determinación de valores primarios y secundarios es propia de la valoración (lit. h).", false], ["C", "valoración, proceso continuo que comienza desde la planificación de los documentos.", "El art. 2.8.2.5.9, lit. h, del Decreto 1080 de 2015 define la valoración como un proceso permanente y continuo, que inicia desde la planificación, por medio del cual se determinan los valores primarios y secundarios para establecer la permanencia y el destino final de los documentos.", true]]}, {"id": "GD-140", "niv": 2, "e": "El diseño del nuevo formato de solicitud de copias, antes de su uso, hace parte del proceso de", "f": "Decreto 1080 de 2015, art. 2.8.2.5.9", "o": [["A", "planeación, que comprende la creación y diseño de formas, formularios y documentos.", "El art. 2.8.2.5.9, lit. a, del Decreto 1080 de 2015 incluye en la planeación la creación y diseño de formas, formularios y documentos, el análisis de procesos, el análisis diplomático y su registro en el sistema de gestión documental.", true], ["B", "organización, porque el formato debe clasificarse en el CCD.", "La organización recae sobre los documentos ya producidos: los clasifica, ordena y describe (art. 2.8.2.5.9, lit. d, del Decreto 1080 de 2015); el diseño de formatos ocurre antes.", false], ["C", "gestión y trámite, porque el formato servirá para tramitar las solicitudes.", "La gestión y trámite comprende el registro, la distribución y el seguimiento de los documentos hasta resolver los asuntos (art. 2.8.2.5.9, lit. c, del Decreto 1080 de 2015); el diseño previo de formatos está asignado a la planeación.", false]]}]}, {"comp": "documentos_oficina", "rol": "general", "tag": "Elaboración de documentos de oficina · El memorando", "texto": "La secretaria de una procuraduría provincial debe comunicarse por escrito con el coordinador administrativo de la procuraduría regional, que pertenece a la misma entidad. Necesita pedirle elementos de papelería para el segundo semestre y, además, informarle las fechas de vacaciones del personal de la sede. Un compañero le sugiere hacer una carta dirigida «a quien corresponda», incluir los dos temas en el mismo documento y escribir el encabezado como «Para», «De» y «Asunto», con mayúscula inicial y sin dos puntos. La entidad sigue los lineamientos de la GTC 185 para la elaboración de sus comunicaciones.", "items": [{"id": "DO-107", "niv": 1, "e": "Para esta comunicación, el tipo documental adecuado es", "f": "Guías institucionales que citan la GTC 185: UIS GGD.10, Senado GD-IT01, Alcaldía de Mitú (ver notas-do.md)", "o": [["A", "una carta u oficio, porque el destinatario trabaja en otra sede.", "Estar en otra sede no convierte al destinatario en externo: pertenece a la misma entidad, por lo que corresponde el memorando y no la carta u oficio, reservada a destinatarios externos.", false], ["B", "un memorando, porque es una comunicación interna entre dependencias de la misma entidad.", "Las guías de la UIS, del Senado y de la Alcaldía de Mitú, basadas en la GTC 185, definen el memorando como la comunicación escrita que se emplea en las organizaciones para tratar asuntos internos.", true], ["C", "una circular, porque se informa algo a otra dependencia.", "La circular comunica un mismo contenido de interés común a un grupo de destinatarios (guías basadas en la GTC 185); aquí hay un solo destinatario interno.", false]]}, {"id": "DO-108", "niv": 2, "e": "En el encabezado del memorando, los datos de destinatario, remitente y tema deben introducirse con", "f": "Guías institucionales que citan la GTC 185: UIS GGD.10, Senado GD-IT01, Alcaldía de Mitú (ver notas-do.md)", "o": [["A", "la fórmula «A quien corresponda», seguida del nombre de la dependencia que envía el documento y de un resumen extenso del contenido.", "El memorando identifica al destinatario y al remitente con sus nombres y cargos; «A quien corresponda» no identifica a nadie y el asunto debe ser una síntesis, no un resumen extenso.", false], ["B", "las palabras «Para», «De» y «Asunto», con mayúscula inicial y sin dos puntos.", "Las guías basadas en la GTC 185 indican que en el memorando estas palabras se escriben en mayúscula sostenida y seguidas de dos puntos.", false], ["C", "«PARA:», «DE:» y «ASUNTO:», en mayúscula sostenida y seguidos de dos puntos.", "Las guías de la UIS, del Senado y de la Alcaldía de Mitú, basadas en la GTC 185, indican que en el memorando las palabras PARA, DE y ASUNTO se escriben en mayúscula sostenida, seguidas de dos puntos.", true]]}, {"id": "DO-109", "niv": 2, "e": "Respecto de los dos temas que la secretaria debe comunicar, lo recomendado es", "f": "Guías institucionales que citan la GTC 185: UIS GGD.10, Senado GD-IT01, Alcaldía de Mitú; Acuerdo 001 de 2024 del AGN, art. 4.2.4", "o": [["A", "elaborar un memorando para cada tema, porque se recomienda que cada uno trate un solo asunto.", "Las guías basadas en la GTC 185 consultadas recomiendan que cada comunicación trate preferiblemente un solo tema, lo que facilita su trámite, su respuesta y su archivo en el expediente correspondiente.", true], ["B", "incluir ambos temas en un mismo memorando, porque así se ahorra papel.", "Las guías basadas en la GTC 185 recomiendan tratar un solo tema por comunicación; mezclar asuntos dificulta el trámite de cada uno y su archivo en el expediente que corresponde.", false], ["C", "enviar el tema de papelería en un memorando y el de vacaciones por mensajería instantánea, sin dejar registro.", "Las comunicaciones oficiales deben quedar registradas para su control y seguimiento (art. 4.2.4 del Acuerdo 001 de 2024 del AGN); enviarlas sin registro impide su trazabilidad.", false]]}]}, {"comp": "documentos_oficina", "rol": "general", "tag": "Elaboración de documentos de oficina · Lenguaje claro en las comunicaciones al ciudadano", "texto": "Usted es auxiliar de una procuraduría provincial y revisa la respuesta a una ciudadana que se quejó porque la alcaldía no le respondía una petición sobre el alumbrado de su barrio. El despacho concluyó que el asunto debía tramitarlo la personería municipal y le remitió la queja. El borrador empieza con dos párrafos que transcriben normas y termina así: «Su solicitud, presentada el 3 de marzo de 2026 ante esta procuraduría provincial en relación con la presunta demora de la alcaldía en responder su petición, una vez revisada por el despacho y teniendo en cuenta las competencias que la ley asigna, fue remitida a la Personería Municipal». El jefe pide aplicar la Guía de lenguaje claro del DNP.", "items": [{"id": "DO-119", "niv": 1, "e": "Siguiendo la recomendación de preferir la voz activa, la frase mejor redactada es", "f": "DNP, Guía de lenguaje claro para servidores públicos de Colombia (2015)", "o": [["A", "«Su solicitud fue recibida por este despacho el 3 de marzo».", "La frase está en voz pasiva («fue recibida por»); la Guía de lenguaje claro del DNP recomienda la voz activa, en la que el sujeto realiza la acción.", false], ["B", "«Por parte de este despacho se efectuó la recepción de su solicitud el 3 de marzo».", "La frase recurre a una construcción impersonal y a un sustantivo («recepción») en lugar del verbo; la guía del DNP recomienda la voz activa y las palabras sencillas.", false], ["C", "«Este despacho recibió su solicitud el 3 de marzo».", "La Guía de lenguaje claro del DNP recomienda usar la voz activa: el sujeto que realiza la acción («este despacho») va antes del verbo («recibió»), lo que hace la frase más directa y fácil de entender.", true]]}, {"id": "DO-120", "niv": 2, "e": "La mejor forma de reescribir el último párrafo del borrador, según la Guía de lenguaje claro del DNP, es", "f": "DNP, Guía de lenguaje claro para servidores públicos de Colombia (2015)", "o": [["A", "dividirlo en oraciones cortas y acercar el sujeto al verbo: «Revisamos su solicitud del 3 de marzo. La enviamos a la Personería Municipal».", "La Guía de lenguaje claro del DNP recomienda oraciones cortas, el orden sujeto-verbo-complemento sin separar el sujeto del verbo y la voz activa; en el borrador, el sujeto («Su solicitud») queda muy lejos del verbo («fue remitida»).", true], ["B", "mantener una sola oración y cambiar únicamente «fue remitida» por «se remitió».", "El cambio no resuelve el problema principal: la oración sigue siendo larga y el sujeto sigue lejos del verbo; la guía del DNP recomienda oraciones cortas y orden sujeto-verbo-complemento.", false], ["C", "agregar al inicio del párrafo las citas de las normas de competencia.", "Anteponer más citas normativas alarga el texto y aleja aún más la información principal; la guía del DNP recomienda oraciones cortas y palabras sencillas.", false]]}, {"id": "DO-121", "niv": 2, "e": "En cuanto al orden de la respuesta, lo más adecuado es", "f": "DNP, Guía de lenguaje claro (2015); Función Pública, técnica n.º 1 de lenguaje claro", "o": [["A", "mantener al principio la transcripción de las normas que fijan la competencia de la procuraduría y de la personería.", "Empezar con transcripciones normativas aplaza la información que la ciudadana necesita; la guía del DNP recomienda pensar en el lector y priorizar lo que le interesa.", false], ["B", "empezar por lo que más le interesa a la ciudadana: qué se hizo con su queja y ante quién continúa el trámite.", "La Guía de lenguaje claro del DNP recomienda conocer al lector antes de escribir y organizar el texto según su propósito; la técnica de lenguaje claro de Función Pública indica poner al comienzo la información que interesa a más lectores.", true], ["C", "dejar la decisión para el final, para respetar el orden cronológico del trámite.", "El orden cronológico del trámite no es el criterio de una comunicación clara; lo importante para la lectora debe ir al comienzo, según las recomendaciones de lenguaje claro del DNP y de Función Pública.", false]]}]}, {"comp": "documentos_oficina", "rol": "tecnico", "tag": "Elaboración de documentos de oficina · Niveles técnico, administrativo y operativo · Puntuación: vocativo, despedida y dos puntos", "texto": "Usted es técnico de la ventanilla de una procuraduría provincial y revisa la puntuación de una respuesta dirigida a una ciudadana. El borrador contiene estas frases: «Le informo señora Gómez que su solicitud fue radicada»; «Para el trámite debe presentar: la cédula y el formulario diligenciado»; y, como cierre, dos posibles despedidas que el redactor no sabe cómo puntuar: «Atentamente» y «Reciba un cordial saludo». La entidad sigue las normas ortográficas de la Real Academia Española.", "items": [{"id": "DO-125", "niv": 1, "e": "La primera frase, bien puntuada, es", "f": "RAE, Ortografía básica, la coma: vocativos (ver notas-do.md)", "o": [["A", "«Le informo, señora Gómez, que su solicitud fue radicada», con el vocativo entre comas.", "Según la RAE, el vocativo se separa con coma del resto del enunciado; cuando va en medio, se escribe entre comas.", true], ["B", "«Le informo: señora Gómez que su solicitud fue radicada», con dos puntos tras el verbo.", "Los dos puntos no aíslan el vocativo y además separan indebidamente el verbo de su complemento; el vocativo intercalado va entre comas (RAE).", false], ["C", "«Le informo señora Gómez, que su solicitud fue radicada», con una sola coma tras el vocativo.", "El vocativo «señora Gómez» queda abierto por un lado: al ir en medio del enunciado, debe ir entre dos comas (RAE).", false]]}, {"id": "DO-126", "niv": 3, "e": "Las despedidas deben puntuarse así", "f": "RAE, Libro de estilo de la lengua española, puntuación de despedidas (ver notas-do.md)", "o": [["A", "«Atentamente:» con dos puntos y «Reciba un cordial saludo.» con punto.", "Los dos puntos corresponden al saludo inicial, no a la despedida; tras una fórmula sin verbo como «Atentamente» va coma (RAE, Libro de estilo).", false], ["B", "«Atentamente,» con coma, y «Reciba un cordial saludo.» con punto, porque esta es una oración completa.", "El Libro de estilo de la RAE indica que las despedidas sin verbo, como «Atentamente», van seguidas de coma, mientras que las que forman una oración completa, como «Reciba un cordial saludo», se cierran con punto.", true], ["C", "«Atentamente» y «Reciba un cordial saludo», ambas sin ningún signo de cierre.", "Las despedidas llevan puntuación: coma tras la fórmula sin verbo y punto tras la oración completa (RAE, Libro de estilo).", false]]}, {"id": "DO-127", "niv": 3, "e": "La segunda frase, bien puntuada, es", "f": "RAE, Ortografía básica, los dos puntos (ver notas-do.md)", "o": [["A", "«Para el trámite debe presentar: la cédula y el formulario diligenciado», con dos puntos tras el verbo.", "Los dos puntos separan indebidamente el verbo «presentar» de su complemento; la RAE desaconseja ese uso cuando no hay un elemento que anticipe la enumeración.", false], ["B", "«Para el trámite, debe presentar: la cédula, y el formulario diligenciado», con coma tras «trámite», dos puntos tras el verbo y coma antes de «y».", "Además de separar el verbo de su complemento con dos puntos, la frase introduce una coma ante la conjunción «y» en una enumeración simple, lo que la RAE no admite en ese caso.", false], ["C", "«Para el trámite debe presentar la cédula y el formulario diligenciado», sin signo entre el verbo y su complemento.", "La RAE indica que no se escriben dos puntos entre el verbo y su complemento cuando no hay un elemento anticipador; «la cédula y el formulario» es el complemento directo de «presentar».", true]]}]}, {"comp": "ofimatica", "rol": "general", "tag": "Herramientas ofimáticas · CONTAR, CONTARA, CONTAR.SI y CONTAR.SI.CONJUNTO", "texto": "Usted apoya el seguimiento de solicitudes en una procuraduría regional. En la hoja de control, B2:B9 contiene el estado de cada solicitud y C2:C9 los días que lleva en trámite, así: fila 2, Pendiente, 12; fila 3, Tramitado, 5; fila 4, Tramitado, 8; fila 5, Pendiente, el texto «s.d.» (sin dato); fila 6, Pendiente, 15; fila 7, Tramitado, celda vacía; fila 8, Pendiente, 9; fila 9, Pendiente, 21. No hay otros datos en esos rangos.", "items": [{"id": "OF-104", "niv": 2, "e": "La fórmula =CONTARA(C2:C9) devuelve", "f": "Microsoft Support, «Función CONTARA» y «Función CONTAR»", "o": [["A", "6.", "Ese es el resultado de CONTAR, que solo cuenta celdas con números. CONTARA también cuenta la celda con el texto «s.d.».", false], ["B", "7.", "CONTARA cuenta las celdas que no están vacías, cualquiera que sea su contenido: los seis números y el texto «s.d.». No cuenta la celda vacía de la fila 7 (si esa celda tuviera una fórmula que devuelve , sí la contaría).", true], ["C", "8.", "Supone que CONTARA cuenta todas las celdas del rango. La función no cuenta las celdas vacías, como C7.", false]]}, {"id": "OF-105", "niv": 1, "e": "La fórmula =CONTAR.SI(B2:B9;\"Pendiente\") devuelve", "f": "Microsoft Support, «Función CONTAR.SI»", "o": [["A", "3.", "Corresponde a las solicitudes pendientes con más de 10 días, que exigiría un segundo criterio (CONTAR.SI.CONJUNTO). CONTAR.SI con un solo criterio cuenta todas las pendientes.", false], ["B", "5.", "Hay cinco celdas con «Pendiente» en B2:B9 (filas 2, 5, 6, 8 y 9). CONTAR.SI cuenta las celdas del rango que cumplen el criterio.", true], ["C", "8.", "Es el total de filas del rango. CONTAR.SI solo cuenta las que cumplen el criterio indicado.", false]]}, {"id": "OF-106", "niv": 3, "e": "La fórmula =CONTAR.SI.CONJUNTO(B2:B9;\"Pendiente\";C2:C9;\">10\") devuelve", "f": "Microsoft Support, «Función CONTAR.SI.CONJUNTO»", "o": [["A", "3.", "Cuenta las filas que cumplen ambos criterios a la vez: pendientes con más de 10 días (filas 2, 6 y 9). La fila 5 es pendiente, pero «s.d.» es texto y no cumple la condición numérica «>10».", true], ["B", "4.", "Incluye la fila 5, cuyo valor es el texto «s.d.». Un texto no satisface el criterio numérico «>10», por lo que esa fila no se cuenta.", false], ["C", "5.", "Cuenta todas las solicitudes pendientes y omite el segundo criterio. CONTAR.SI.CONJUNTO exige que cada fila cumpla todos los criterios.", false]]}]}, {"comp": "ofimatica", "rol": "general", "tag": "Herramientas ofimáticas · SIFECHA, REDONDEAR y operador &", "texto": "Usted apoya a la Oficina de Selección y Carrera de la Procuraduría en un libro de Excel. En B2 está la fecha de posesión de una servidora (15/08/2019) y en C2 la fecha de corte del informe (01/03/2027). En D2 hay un valor de 1.234.567,891. En E2 está el código «E-2027-0153» y en F2 la fecha 10/03/2027, con formato de fecha.", "items": [{"id": "OF-122", "niv": 2, "e": "La fórmula =SIFECHA(B2;C2;\"Y\") devuelve", "f": "Microsoft Support, «Función SIFECHA»", "o": [["A", "6.", "Entre el 15/08/2019 y el 15/08/2026 ya se completaron siete años; seis subestima el periodo.", false], ["B", "7.", "Con la unidad \"Y\", SIFECHA devuelve los años completos del periodo. Del 15/08/2019 al 01/03/2027 se completaron 7 años (el octavo se cumpliría el 15/08/2027).", true], ["C", "8.", "Resta los años (2027 − 2019) sin verificar si el último año está completo. SIFECHA con \"Y\" solo cuenta años completos.", false]]}, {"id": "OF-123", "niv": 2, "e": "La fórmula =REDONDEAR(D2;-3) devuelve", "f": "Microsoft Support, «Función REDONDEAR»", "o": [["A", "1.234.000.", "Trunca el valor a los miles en lugar de redondearlo. Como las centenas (567) superan la mitad de mil, el redondeo es hacia arriba.", false], ["B", "1.234.567,9.", "Es el resultado de redondear a un decimal (REDONDEAR(D2;1)). Un número de decimales negativo redondea a la izquierda de la coma.", false], ["C", "1.235.000.", "Con núm_decimales igual a −3, REDONDEAR lleva el número al millar más cercano: 1.234.567,891 queda en 1.235.000.", true]]}, {"id": "OF-124", "niv": 3, "e": "La fórmula =\"Radicado \"&E2&\" del \"&F2 muestra", "f": "Microsoft Support, «Combinar texto y números» y «Función TEXTO»; Excel almacena las fechas como números de serie («Función DIA.LAB», observaciones); serie calculada con base 30/12/1899", "o": [["A", "«Radicado E-2027-0153 del 10/03/2027».", "El formato de fecha de F2 solo afecta cómo se ve la celda; al concatenar con &, Excel usa el valor subyacente, que es el número de serie.", false], ["B", "«Radicado E-2027-0153 del 46456».", "Excel guarda las fechas como números de serie. Al unirlas con texto mediante &, aparece el número; para mostrar la fecha debe usarse, por ejemplo, TEXTO(F2;\"dd/mm/aaaa\").", true], ["C", "el error #¡VALOR!, porque no se puede unir texto con una fecha.", "El operador & sí puede unir texto con números o fechas; no genera error, pero muestra el número de serie de la fecha.", false]]}]}, {"comp": "ofimatica", "rol": "tecnico", "tag": "Herramientas ofimáticas · Niveles técnico, administrativo y operativo · Combinación de correspondencia", "texto": "Usted es auxiliar administrativo de una procuraduría provincial y debe enviar 85 citaciones personalizadas a ciudadanos para una jornada de atención. Tiene un libro de Excel con las columnas Nombre, Dirección, Municipio y Correo, y un modelo de citación en Word con el texto común.", "items": [{"id": "OF-137", "niv": 1, "e": "Para generar las citaciones con la combinación de correspondencia de Word, el libro de Excel cumple el papel de", "f": "Microsoft Support, «Usar la combinación de correspondencia de correo electrónico masivo, cartas, etiquetas y sobres»", "o": [["A", "plantilla de destino, en la que Word guarda las 85 cartas generadas.", "Las cartas resultantes se generan en Word (o se imprimen o envían); el libro de Excel solo suministra los datos.", false], ["B", "documento principal, en el que se escribe el texto que se repite en todas las cartas.", "El documento principal es el modelo de Word con el texto común y los campos insertados; Excel aporta los datos.", false], ["C", "origen de datos, cuyos encabezados de columna se convierten en campos de combinación.", "En la combinación de correspondencia, el origen de datos (una hoja de Excel, por ejemplo) aporta la información personalizada; los campos de combinación provienen de sus encabezados de columna.", true]]}, {"id": "OF-138", "niv": 2, "e": "Para que en cada citación aparezca el municipio del ciudadano, se debe", "f": "Microsoft Support, «Insertar campos de combinación de correspondencia»", "o": [["A", "insertar en el modelo el campo de combinación «Municipio» donde debe aparecer el dato.", "Los campos de combinación son marcadores que indican a Word dónde poner la información del origen de datos; se insertan con Insertar campo de combinación.", true], ["B", "copiar la columna Municipio de Excel y pegarla en el modelo de Word.", "Pegar la columna insertaría la lista completa en cada carta; la personalización registro por registro se logra con campos de combinación.", false], ["C", "escribir en el modelo la palabra Municipio entre comillas en el lugar del dato.", "Un texto escrito, aunque coincida con el nombre de la columna, no es un campo de combinación y se imprimiría igual en todas las cartas.", false]]}, {"id": "OF-139", "niv": 3, "e": "Si decide enviar las citaciones por correo electrónico desde la combinación de Word, debe tener en cuenta que", "f": "Microsoft Support, «Usar la combinación de correspondencia en Word para enviar mensajes de correo electrónico masivo»", "o": [["A", "todos los ciudadanos reciben un único mensaje con sus direcciones en el campo CCO.", "La combinación por correo genera un mensaje por destinatario, con su dirección en el campo Para; no usa CCO.", false], ["B", "el programa adjunta a cada mensaje el PDF de la citación si se marca la opción de datos adjuntos.", "Word no permite adjuntar archivos externos, como un PDF, a cada mensaje; el formato «Datos adjuntos» solo envía el propio documento combinado en formato de Word. Para compartir otro archivo puede incluirse un vínculo.", false], ["C", "cada ciudadano recibe un mensaje individual con su dirección en el campo Para, sin copia a los demás.", "La combinación de correspondencia de Word envía un mensaje separado a cada dirección del origen de datos, con esa dirección en el campo Para, y la función nativa no permite agregar destinatarios en CC ni en CCO.", true]]}]}, {"comp": "ofimatica", "rol": "general", "tag": "Herramientas ofimáticas · Saltos de sección y encabezados", "texto": "Usted elabora en Word el informe de gestión de una procuraduría regional, en orientación vertical y con encabezado institucional. En la mitad del documento debe incluir un anexo de tres páginas con una tabla muy ancha, en orientación horizontal y con un encabezado distinto que diga «Anexo estadístico». Después del anexo, el informe continúa en vertical con el encabezado original.", "items": [{"id": "OF-143", "niv": 1, "e": "Para que solo las páginas del anexo queden en horizontal, lo correcto es", "f": "Microsoft Support, «Configurar encabezados y pies de página para diferentes secciones de un documento de Word»", "o": [["A", "insertar saltos de sección (página siguiente) antes y después del anexo y cambiar la orientación solo en esa sección.", "La orientación y los encabezados se configuran por sección; con saltos de sección antes y después del anexo, este puede ir en horizontal sin afectar el resto.", true], ["B", "insertar saltos de página antes y después del anexo y cambiar la orientación del documento.", "El salto de página no crea una sección nueva, así que el cambio de orientación afectaría a todo el documento.", false], ["C", "cambiar la orientación de esas tres páginas desde la vista previa de impresión, sin tocar el resto.", "La orientación es una propiedad de la sección, no de páginas sueltas; sin saltos de sección el cambio se aplica a toda la sección.", false]]}, {"id": "OF-144", "niv": 2, "e": "Al escribir «Anexo estadístico» en el encabezado del anexo, el texto aparece también en el resto del informe. Esto ocurre porque", "f": "Microsoft Support, «Vincular al anterior»", "o": [["A", "los encabezados solo pueden ser distintos en la primera página de un documento.", "Word permite encabezados distintos en cada sección, además de la opción de primera página diferente.", false], ["B", "los saltos de sección no admiten encabezados propios si la orientación cambia.", "Las secciones con orientación distinta pueden tener encabezados propios; basta con desvincularlos.", false], ["C", "el encabezado de esa sección sigue vinculado al de la sección anterior.", "Por defecto las secciones están vinculadas; hay que desactivar Vincular al anterior en el encabezado de la nueva sección para que sea independiente.", true]]}, {"id": "OF-145", "niv": 3, "e": "Ya desvinculado el encabezado, usted cambia el texto del pie de página del anexo y el cambio aparece también en el resto del informe. La explicación es que", "f": "Microsoft Support, «Configurar encabezados y pies de página para diferentes secciones de un documento de Word»", "o": [["A", "el encabezado y el pie de página se vinculan por separado, y el pie sigue vinculado.", "Microsoft aclara que encabezados y pies se vinculan por separado; si se quiere un pie distinto, también debe desactivarse Vincular al anterior en el pie.", true], ["B", "el número de página es un campo que no se puede modificar por secciones.", "La numeración y el contenido del pie pueden variar por sección; el problema es la vinculación del pie.", false], ["C", "al desvincular el encabezado, Word vincula de nuevo el pie para conservar la numeración.", "Desvincular el encabezado no altera el pie; este simplemente conservaba su vínculo con la sección anterior.", false]]}]}, {"comp": "sistemas_gestion", "rol": "general", "tag": "Sistemas de gestión (MIPG, control interno y calidad) · Comité Institucional de Gestión y Desempeño", "texto": "Usted es técnico de la Oficina de Planeación de un establecimiento público del orden nacional, adscrito a un ministerio. La entidad tiene tres comités internos creados por resolución del director, relacionados con temas del MIPG y sin origen en una norma legal; cada uno se reúne por separado y sus decisiones a veces se contradicen. La nueva directora pide revisar cómo debe organizarse la instancia que orienta la implementación del modelo.", "items": [{"id": "SG-104", "niv": 3, "e": "Frente a los tres comités internos, el Decreto 1083 de 2015 dispone que", "f": "Decreto 1083 de 2015, art. 2.2.22.3.8", "o": [["A", "el Comité Institucional de Gestión y Desempeño los sustituye y asume sus temas.", "El artículo 2.2.22.3.8 ordena integrar en cada entidad un Comité Institucional de Gestión y Desempeño que sustituye los demás comités relacionados con el modelo que no sean obligatorios por mandato legal.", true], ["B", "deben fusionarse en el Comité Institucional de Coordinación de Control Interno, que orienta el modelo.", "La instancia que orienta la implementación y operación del MIPG es el Comité Institucional de Gestión y Desempeño; el de control interno tiene funciones propias del sistema de control interno.", false], ["C", "deben mantenerse, y el Comité Institucional de Gestión y Desempeño solo coordina sus agendas.", "El decreto no prevé que esos comités subsistan bajo coordinación: los sustituye cuando no son obligatorios por ley.", false]]}, {"id": "SG-105", "niv": 1, "e": "La secretaría técnica del Comité Institucional de Gestión y Desempeño corresponde a", "f": "Decreto 1083 de 2015, art. 2.2.22.3.8, par. 1", "o": [["A", "el jefe de la oficina de control interno de la entidad.", "El decreto asigna la secretaría técnica al jefe de planeación; la oficina de control interno conserva su independencia como evaluadora.", false], ["B", "un servidor del nivel asesor elegido por los miembros en cada sesión.", "La secretaría técnica no es rotativa ni electiva; el decreto la asigna al jefe de la oficina de planeación o a quien haga sus veces.", false], ["C", "el jefe de la oficina de planeación o quien haga sus veces.", "Así lo dispone el parágrafo 1 del artículo 2.2.22.3.8 del Decreto 1083 de 2015.", true]]}, {"id": "SG-106", "niv": 2, "e": "Entre sus funciones, el comité debe aprobar y hacer seguimiento a las acciones y estrategias para la operación del MIPG", "f": "Decreto 1083 de 2015, art. 2.2.22.3.8, num. 1", "o": [["A", "por lo menos una vez al mes.", "El decreto no fija una periodicidad mensual; el mínimo es trimestral.", false], ["B", "por lo menos una vez cada tres meses.", "El numeral 1 de las funciones del artículo 2.2.22.3.8 exige aprobar y hacer seguimiento, por lo menos una vez cada tres meses, a las acciones y estrategias del modelo.", true], ["C", "por lo menos una vez al año, al cierre de la vigencia.", "Un seguimiento anual no cumple el mínimo trimestral que fija el decreto.", false]]}]}, {"comp": "sistemas_gestion", "rol": "general", "tag": "Sistemas de gestión (MIPG, control interno y calidad) · Roles de la oficina de control interno", "texto": "Usted es técnico de la oficina de control interno de una entidad del orden departamental. En el plan de trabajo de la oficina aparecen tres actividades: (1) capacitar a los líderes de proceso en autocontrol y acompañarlos en la formulación de sus controles, sin decidir por ellos; (2) consolidar y entregar oportunamente la información que solicita la contraloría departamental en una auditoría; (3) verificar si los controles de los mapas de riesgos están bien diseñados y si se aplican.", "items": [{"id": "SG-119", "niv": 2, "e": "La actividad (1) corresponde al rol de", "f": "Decreto 1083 de 2015, art. 2.2.21.5.3 (Decreto 648 de 2017); Función Pública, Guía rol de las unidades u oficinas de control interno", "o": [["A", "enfoque hacia la prevención.", "Este rol articula la asesoría y el acompañamiento con el fomento de la cultura del control, sin que la oficina asuma decisiones de la administración.", true], ["B", "evaluación y seguimiento.", "La evaluación y el seguimiento se hacen mediante auditorías y verificaciones; capacitar y acompañar es una labor preventiva.", false], ["C", "liderazgo estratégico.", "Ese rol se refiere al jefe de control interno como soporte estratégico de la alta dirección para la toma de decisiones, no a la asesoría a los líderes de proceso.", false]]}, {"id": "SG-120", "niv": 1, "e": "La actividad (2) corresponde al rol de", "f": "Decreto 1083 de 2015, art. 2.2.21.5.3 (Decreto 648 de 2017); Función Pública, Guía rol de las unidades u oficinas de control interno", "o": [["A", "liderazgo estratégico frente a la alta dirección.", "Ese rol apunta al apoyo a la alta dirección en la toma de decisiones; atender requerimientos de la contraloría es relación con entes externos.", false], ["B", "evaluación y seguimiento.", "Ese rol se refiere a la evaluación independiente de la gestión y de los controles de la entidad, no a la interlocución con la contraloría.", false], ["C", "relación con entes externos de control.", "Mediante este rol el jefe de control interno sirve de puente entre los entes de control externos y la entidad y facilita el flujo de información con ellos.", true]]}, {"id": "SG-121", "niv": 2, "e": "La actividad (3) corresponde al rol de", "f": "Decreto 1083 de 2015, art. 2.2.21.5.3 (Decreto 648 de 2017); Función Pública, Guía rol de las unidades u oficinas de control interno", "o": [["A", "relación con entes externos de control.", "La actividad es interna: evalúa los controles de la entidad sin intervención de un ente externo.", false], ["B", "evaluación de la gestión del riesgo.", "Este rol comprende evaluar el diseño y la efectividad de los controles frente a los riesgos identificados por la entidad.", true], ["C", "enfoque hacia la prevención.", "La prevención se ejerce con asesoría y fomento de la cultura del control; verificar diseño y aplicación de controles de riesgos es una evaluación.", false]]}]}, {"comp": "sistemas_gestion", "rol": "general", "tag": "Sistemas de gestión (MIPG, control interno y calidad) · ISO 9001: enfoque a procesos y ciclo PHVA", "texto": "Usted es técnico de una dependencia de una entidad pública que mantiene un sistema de gestión de la calidad basado en la norma ISO 9001:2015. Su equipo realiza cuatro actividades en el proceso de atención de quejas: definir los objetivos, recursos y riesgos del proceso para la vigencia; tramitar las quejas según el procedimiento; medir cada mes el tiempo de respuesta frente a la meta; y ajustar el procedimiento cuando los resultados no alcanzan la meta.", "items": [{"id": "SG-137", "niv": 1, "e": "En el ciclo PHVA, medir cada mes el tiempo de respuesta frente a la meta corresponde a", "f": "NTC ISO 9001:2015, numeral 0.3.2 (ciclo PHVA)", "o": [["A", "actuar.", "Actuar es tomar acciones para mejorar el desempeño a partir de lo verificado, como ajustar el procedimiento.", false], ["B", "hacer.", "Hacer es implementar lo planificado, es decir, tramitar las quejas; medir resultados frente a la meta es verificar.", false], ["C", "verificar.", "En el ciclo PHVA que describe la norma, verificar es hacer seguimiento y medir los procesos y resultados frente a objetivos y metas.", true]]}, {"id": "SG-138", "niv": 2, "e": "Ajustar el procedimiento cuando los resultados no alcanzan la meta corresponde a", "f": "NTC ISO 9001:2015, numeral 0.3.2 (ciclo PHVA)", "o": [["A", "verificar.", "Verificar es medir y comparar con la meta; la decisión de ajustar el procedimiento es la etapa siguiente.", false], ["B", "actuar.", "En el PHVA, actuar es tomar acciones para mejorar el desempeño según los resultados verificados.", true], ["C", "planificar.", "Planificar es establecer objetivos, recursos y riesgos antes de ejecutar; ajustar a partir de resultados medidos es actuar.", false]]}, {"id": "SG-139", "niv": 2, "e": "En la ISO 9001:2015, el pensamiento basado en riesgos", "f": "NTC ISO 9001:2015, numerales 0.3.3 y 6.1", "o": [["A", "busca prevenir efectos no deseados, sin un requisito aparte de acción preventiva.", "La norma explica que el pensamiento basado en riesgos permite determinar los factores que podrían desviar los procesos y poner en marcha controles preventivos; por eso la acción preventiva dejó de ser un requisito independiente.", true], ["B", "se limita a tratar las no conformidades que ya se presentaron en los procesos.", "Tratar no conformidades ya ocurridas es la acción correctiva; el pensamiento basado en riesgos es anticipatorio.", false], ["C", "obliga a aplicar en todos los procesos una metodología formal y cuantitativa de gestión del riesgo.", "La ISO 9001:2015 exige abordar riesgos y oportunidades, pero no impone métodos formales de gestión del riesgo ni un proceso documentado específico.", false]]}]}, {"comp": "disciplinario", "rol": "general", "tag": "Código General Disciplinario · Legalidad, favorabilidad y cosa juzgada", "texto": "Usted es profesional universitario de la oficina de control disciplinario interno de una gobernación y revisa tres asuntos. Primero: en febrero de 2025 un auxiliar realizó una conducta que en ese momento no estaba descrita como falta en ninguna ley; una ley expedida en 2026 la describió expresamente como falta disciplinaria. Segundo: una técnica cumple desde hace dos meses una sanción de suspensión impuesta en fallo ejecutoriado, y una ley posterior redujo el máximo de esa sanción para su falta a un término inferior al que se le impuso. Tercero: un conductor fue absuelto en 2025, mediante fallo ejecutoriado, por haber usado el vehículo oficial en un viaje personal; ahora llega una nueva queja por el mismo viaje, que el quejoso denomina «uso indebido de bienes del Estado».", "items": [{"id": "DI-101", "niv": 1, "e": "Respecto de la conducta del auxiliar, lo procedente es concluir que", "f": "Ley 1952 de 2019, art. 4", "o": [["A", "no puede ser investigado ni sancionado por ella, porque no estaba descrita como falta en la ley vigente cuando la realizó.", "Por el principio de legalidad, los destinatarios del código solo pueden ser investigados y sancionados por comportamientos descritos como falta en la ley vigente al momento de su realización (Ley 1952 de 2019, art. 4).", true], ["B", "puede ser investigado con la ley de 2026, porque las normas disciplinarias tienen efecto general inmediato.", "El efecto inmediato no permite aplicar hacia atrás una descripción de falta: la preexistencia de la falta es exigencia del principio de legalidad (art. 4 de la Ley 1952 de 2019).", false], ["C", "puede ser investigado, pero la sanción debe reducirse a la mitad por tratarse de una falta creada después.", "No existe esa rebaja. Si la conducta no era falta cuando se realizó, no hay lugar a investigación ni a sanción alguna (art. 4 de la Ley 1952 de 2019).", false]]}, {"id": "DI-102", "niv": 2, "e": "Si la técnica pide que se le aplique la nueva ley, usted debe responderle que", "f": "Ley 1952 de 2019, art. 8", "o": [["A", "solo podría obtener ese efecto si solicita la revocatoria directa del fallo dentro de los cuatro meses siguientes.", "La aplicación de la ley favorable no depende de la revocatoria directa; el artículo 8 la extiende directamente a quien cumple la sanción. Además, el plazo de cuatro meses del artículo 141 es para quejosos y víctimas.", false], ["B", "la ley posterior más favorable se aplica también a quien está cumpliendo la sanción.", "La ley permisiva o favorable, aun posterior, se aplica de preferencia a la desfavorable, y este principio rige también para quien esté cumpliendo la sanción, salvo lo dispuesto en la Constitución (Ley 1952 de 2019, art. 8).", true], ["C", "la favorabilidad solo opera en los procesos en curso y no cuando el fallo ya está ejecutoriado.", "El código dispone expresamente lo contrario: el principio de favorabilidad rige también para quien esté cumpliendo la sanción (art. 8 de la Ley 1952 de 2019).", false]]}, {"id": "DI-103", "niv": 2, "e": "Frente a la nueva queja contra el conductor, la oficina debe tener en cuenta que", "f": "Ley 1952 de 2019, art. 16", "o": [["A", "puede abrir una nueva investigación, porque la queja describe una falta con una denominación diferente.", "El cambio de nombre de la falta no habilita un nuevo proceso: la cosa juzgada impide investigar de nuevo el mismo hecho aun cuando se le dé una denominación distinta (art. 16 de la Ley 1952 de 2019).", false], ["B", "puede abrir una nueva investigación si quien presenta la queja es una persona distinta del primer quejoso.", "La identidad que importa es la del disciplinado y el hecho, no la del quejoso. Decidido el asunto por fallo ejecutoriado, no hay nueva investigación por el mismo hecho (art. 16).", false], ["C", "no puede someterlo a nueva investigación por el mismo hecho, aunque se le dé una denominación distinta.", "Por la cosa juzgada disciplinaria, quien fue juzgado mediante fallo ejecutoriado no puede ser sometido a nueva investigación y juzgamiento por el mismo hecho, aun cuando se le dé una denominación distinta (Ley 1952 de 2019, art. 16). Como el fallo es absolutorio y no versa sobre DIDH ni DIH, tampoco cabe su revocatoria directa (art. 141).", true]]}]}, {"comp": "disciplinario", "rol": "general", "tag": "Código General Disciplinario · Clases y límites de las sanciones", "texto": "Usted es auxiliar administrativo de la secretaría de una procuraduría provincial y debe preparar las comunicaciones de tres fallos ejecutoriados en el mismo mes. El primero sanciona a un tesorero municipal por una falta gravísima cometida con dolo. El segundo sanciona a una secretaria de despacho por una falta leve dolosa. El tercero sanciona a un conductor por una falta leve culposa. Antes de redactar, su jefe le pide verificar que la clase de sanción de cada fallo coincida con la que prevé la ley.", "items": [{"id": "DI-118", "niv": 1, "e": "Para el tesorero municipal, la sanción que prevé la ley es", "f": "Ley 1952 de 2019, art. 48 (modificado por la Ley 2094 de 2021, art. 9)", "o": [["A", "destitución e inhabilidad general de ocho a diez años.", "Ese rango corresponde a las faltas gravísimas realizadas con culpa gravísima, no a las dolosas (art. 48, num. 2, de la Ley 1952 de 2019).", false], ["B", "destitución e inhabilidad general de diez a veinte años.", "Las faltas gravísimas dolosas se sancionan con destitución e inhabilidad general de diez a veinte años (Ley 1952 de 2019, art. 48, num. 1, modificado por la Ley 2094 de 2021).", true], ["C", "suspensión de tres a dieciocho meses e inhabilidad especial por el mismo término.", "Esa sanción es la de las faltas graves dolosas (art. 48, num. 3, de la Ley 1952 de 2019).", false]]}, {"id": "DI-119", "niv": 2, "e": "La sanción de la secretaria de despacho debe consistir en", "f": "Ley 1952 de 2019, art. 48 (modificado por la Ley 2094 de 2021, art. 9)", "o": [["A", "multa de diez a ciento ochenta días del salario básico devengado para la época de los hechos.", "Las faltas leves dolosas se sancionan con multa de diez a ciento ochenta días del salario básico devengado para la época de los hechos (Ley 1952 de 2019, art. 48, num. 5, modificado por la Ley 2094 de 2021).", true], ["B", "amonestación escrita con anotación en la hoja de vida.", "La amonestación escrita es la sanción de las faltas leves culposas, no de las dolosas (art. 48, num. 6, de la Ley 1952 de 2019).", false], ["C", "suspensión en el ejercicio del cargo de uno a doce meses.", "Esa sanción corresponde a las faltas graves culposas (art. 48, num. 4, de la Ley 1952 de 2019).", false]]}, {"id": "DI-120", "niv": 1, "e": "La sanción que corresponde al conductor implica", "f": "Ley 1952 de 2019, arts. 48 y 49 (modificados por la Ley 2094 de 2021, arts. 9 y 10)", "o": [["A", "la separación del cargo durante un mes, sin derecho a remuneración.", "La separación del cargo es propia de la suspensión, que no se aplica a las faltas leves (arts. 48 y 49 de la Ley 1952 de 2019).", false], ["B", "un descuento de diez días de salario a favor de la entidad.", "El descuento de salario corresponde a la multa, sanción de las faltas leves dolosas (art. 48, num. 5, de la Ley 1952 de 2019).", false], ["C", "un llamado de atención escrito que se registra en la hoja de vida.", "Las faltas leves culposas se sancionan con amonestación escrita (art. 48, num. 6), que implica un llamado de atención por escrito que debe registrarse en la hoja de vida (Ley 1952 de 2019, art. 49, num. 4).", true]]}]}, {"comp": "disciplinario", "rol": "tecnico", "tag": "Código General Disciplinario · Niveles técnico, administrativo y operativo · Prescripción de la acción disciplinaria", "texto": "Usted es técnico de una procuraduría provincial y lleva el control de términos de cuatro expedientes, todos por conductas ocurridas después del 29 de diciembre de 2023. Expediente A: falta instantánea consumada el 12 de mayo de 2024; aún no hay fallo. Expediente B: desde enero de 2024 un servidor omitió presentar unos informes obligatorios; su deber de presentarlos cesó el 30 de septiembre de 2025, cuando fue trasladado a otro cargo. Expediente C: el fallo de primera instancia se notificó el 10 de junio de 2025 y el proceso está en segunda instancia. Expediente D: se investiga una de las faltas relacionadas con infracciones al Derecho Internacional Humanitario previstas en el artículo 52 del código.", "items": [{"id": "DI-130", "niv": 2, "e": "En el expediente A, si la prescripción no se interrumpe, el término de prescripción de la acción se cumple en", "f": "Ley 1952 de 2019, art. 33 (modificado por la Ley 2094 de 2021, art. 7)", "o": [["A", "mayo de 2027.", "Corresponde a tres años, pero el término general de prescripción de la acción es de cinco años (art. 33 de la Ley 1952 de 2019).", false], ["B", "mayo de 2029.", "La acción prescribe en cinco años, contados para las faltas instantáneas desde el día de su consumación (Ley 1952 de 2019, art. 33, modificado por la Ley 2094 de 2021): mayo de 2024 más cinco años es mayo de 2029.", true], ["C", "mayo de 2036.", "Doce años es el término para las faltas del artículo 52 (DIDH y DIH), no para una falta instantánea común (art. 33 de la Ley 1952 de 2019).", false]]}, {"id": "DI-131", "niv": 3, "e": "En el expediente B, por tratarse de una falta omisiva, el término de prescripción empieza a contarse", "f": "Ley 1952 de 2019, art. 33 (modificado por la Ley 2094 de 2021, art. 7)", "o": [["A", "desde el 30 de septiembre de 2025, cuando cesó su deber de actuar.", "Para las faltas omisivas, la prescripción se cuenta desde cuando haya cesado el deber de actuar (Ley 1952 de 2019, art. 33, modificado por la Ley 2094 de 2021).", true], ["B", "desde la fecha del auto de apertura de la investigación disciplinaria.", "Con el texto vigente del artículo 33, el término no se cuenta desde la apertura de investigación, sino desde la consumación, el último acto o el cese del deber, según el tipo de falta.", false], ["C", "desde enero de 2024, cuando comenzó la omisión.", "Para las faltas omisivas el término no corre desde que empieza la omisión, sino desde que cesa el deber de actuar (art. 33 de la Ley 1952 de 2019).", false]]}, {"id": "DI-132", "niv": 3, "e": "En el expediente C, la acción prescribirá si la decisión de segunda instancia no se ha notificado a más tardar en", "f": "Ley 1952 de 2019, art. 33 (modificado por la Ley 2094 de 2021, art. 7)", "o": [["A", "junio de 2026.", "Un año no es el término legal. Interrumpida la prescripción, esta se produce si en dos años no se notifica la segunda instancia (art. 33 de la Ley 1952 de 2019).", false], ["B", "junio de 2027.", "La prescripción se interrumpe con la notificación del fallo de primera instancia y se produce si, transcurridos dos años desde esa notificación, no se notifica la decisión de segunda instancia (Ley 1952 de 2019, art. 33): junio de 2025 más dos años es junio de 2027.", true], ["C", "junio de 2030.", "Contar cinco años nuevos desde el fallo de primera instancia no tiene base legal; después de la interrupción el plazo es de dos años (art. 33 de la Ley 1952 de 2019).", false]]}, {"id": "DI-133", "niv": 2, "e": "Para el expediente D, el término de prescripción de la acción es de", "f": "Ley 1952 de 2019, arts. 33 y 52", "o": [["A", "cinco años.", "Cinco años es el término general; para las faltas del artículo 52 la ley fija uno mayor (art. 33 de la Ley 1952 de 2019).", false], ["B", "doce años.", "Para las faltas señaladas en el artículo 52 (infracciones al DIDH y al DIH), el término de prescripción es de doce años; interrumpido con la notificación del fallo de primera instancia, se produce si en tres años no se notifica la segunda instancia (Ley 1952 de 2019, art. 33).", true], ["C", "veinte años.", "Veinte años es el máximo de la inhabilidad general (art. 48), no el término de prescripción de las faltas del artículo 52, que es de doce años (art. 33).", false]]}]}, {"comp": "disciplinario", "rol": "general", "tag": "Código General Disciplinario · Oficinas de control disciplinario interno", "texto": "Usted es profesional universitario del área de talento humano de un pequeño establecimiento público del orden nacional, sin regionales. La dirección reorganiza la oficina de control disciplinario interno: propone nombrar como jefe a un administrador público del nivel profesional y advierte que, por la estructura de la entidad, no es posible garantizar la segunda instancia de los procesos. El director también pregunta quién deberá hacer efectivas las sanciones que imponga la oficina.", "items": [{"id": "DI-137", "niv": 1, "e": "Sobre la propuesta para el cargo de jefe de la oficina, la ley exige que esa persona", "f": "Ley 1952 de 2019, art. 93 (modificado por la Ley 2094 de 2021, art. 14)", "o": [["A", "pertenezca al nivel profesional y acredite especialización en derecho disciplinario.", "El nivel profesional es el mínimo para los integrantes de la oficina, pero el jefe debe ser abogado del nivel directivo (art. 93, parágrafo 1, de la Ley 1952 de 2019).", false], ["B", "sea abogado del nivel asesor y sea designado por el Procurador General de la Nación.", "La ley exige nivel directivo y no atribuye su designación al Procurador General (art. 93 de la Ley 1952 de 2019).", false], ["C", "sea abogado y pertenezca al nivel directivo de la entidad.", "El jefe de la oficina de control disciplinario interno debe ser abogado y pertenecer al nivel directivo de la entidad (Ley 1952 de 2019, art. 93, parágrafo 1, modificado por la Ley 2094 de 2021).", true]]}, {"id": "DI-138", "niv": 2, "e": "Si la entidad no puede garantizar la segunda instancia por su estructura organizacional, esta corresponderá a", "f": "Ley 1952 de 2019, art. 93 (modificado por la Ley 2094 de 2021, art. 14)", "o": [["A", "el juez de lo contencioso administrativo, mediante el medio de control de nulidad y restablecimiento.", "El control judicial de las decisiones sancionatorias (art. 93, parágrafo 2) no reemplaza la segunda instancia disciplinaria, que corresponde a la Procuraduría.", false], ["B", "el director de la entidad, como superior jerárquico del jefe de la oficina disciplinaria.", "El artículo 93 vigente asigna expresamente la segunda instancia no garantizada a la Procuraduría, no al director de la entidad.", false], ["C", "la Procuraduría General de la Nación, de acuerdo con sus competencias.", "Si no fuere posible garantizar la segunda instancia por razones de estructura organizacional, será de competencia de la Procuraduría General de la Nación de acuerdo con sus competencias (Ley 1952 de 2019, art. 93, modificado por la Ley 2094 de 2021).", true]]}, {"id": "DI-139", "niv": 2, "e": "Las sanciones que imponga la oficina de control disciplinario interno deberá hacerlas efectivas", "f": "Ley 1952 de 2019, arts. 93 (modificado por la Ley 2094 de 2021, art. 14), 236 y 238", "o": [["A", "el jefe o director del organismo al que pertenece el sancionado.", "El jefe o director del organismo tiene competencia para ejecutar la sanción (Ley 1952 de 2019, art. 93), en concordancia con el artículo 236, que atribuye la ejecución al nominador respecto de los servidores de libre nombramiento y de carrera.", true], ["B", "la Procuraduría General de la Nación, por medio de su División de Registro y Control.", "La Procuraduría registra las sanciones para el certificado de antecedentes (art. 238), pero no las ejecuta respecto de servidores de otras entidades; ejecuta las de particulares y entidades en liquidación (art. 236, num. 7).", false], ["C", "el jefe de la oficina de control disciplinario interno que profirió el fallo.", "La ley separa la función de juzgar de la de ejecutar: la ejecución corresponde al jefe o director del organismo (art. 93 de la Ley 1952 de 2019).", false]]}]}, {"comp": "disciplinario", "rol": "general", "tag": "Código General Disciplinario · Indagación previa", "texto": "Usted es profesional universitario de la oficina de control disciplinario interno de una secretaría de educación departamental. Llega una queja, acompañada de copias de las nóminas, según la cual alguien del área de nómina incluyó a un docente fallecido en la liquidación de salarios de dos meses. En el área trabajan seis servidores con acceso al sistema de nómina y, por ahora, no se sabe quién hizo el registro. La investigación no versa sobre violaciones de derechos humanos ni del Derecho Internacional Humanitario.", "items": [{"id": "DI-153", "niv": 1, "e": "Como no se sabe cuál de los servidores hizo el registro, lo procedente es", "f": "Ley 1952 de 2019, arts. 208 (modificado por la Ley 2094 de 2021, art. 34), 209 y 211", "o": [["A", "inhibirse de iniciar actuación, porque la queja no identifica al autor de la conducta.", "La decisión inhibitoria procede ante quejas temerarias, irrelevantes, imposibles o absolutamente inconcretas (art. 209); esta es concreta y viene con soportes. La falta de identificación del autor se resuelve con indagación previa (art. 208).", false], ["B", "abrir investigación disciplinaria contra los seis servidores con acceso al sistema.", "La investigación procede cuando se identifica al posible autor (art. 211 de la Ley 1952 de 2019). Vincular a todos sin individualizar desconoce que la indagación previa es la etapa prevista para la duda sobre el autor (art. 208).", false], ["C", "adelantar indagación previa para identificar o individualizar al posible autor.", "En caso de duda sobre la identificación o individualización del posible autor de una falta disciplinaria se adelanta indagación previa (Ley 1952 de 2019, art. 208, modificado por la Ley 2094 de 2021).", true]]}, {"id": "DI-154", "niv": 1, "e": "La indagación previa en este caso tiene una duración de", "f": "Ley 1952 de 2019, art. 208 (modificado por la Ley 2094 de 2021, art. 34)", "o": [["A", "seis meses, y culmina con el archivo definitivo o con el auto de apertura de investigación.", "La indagación previa tiene una duración de seis meses y culmina con el archivo definitivo o auto de apertura de investigación; solo en investigaciones por violación de derechos humanos o DIH puede extenderse otros seis meses (Ley 1952 de 2019, art. 208).", true], ["B", "doce meses, y culmina con la citación a audiencia del posible autor.", "El término es de seis meses (ampliable a otros seis solo en casos de derechos humanos o DIH), y la citación a audiencia es propia del juzgamiento (art. 208).", false], ["C", "tres meses prorrogables por otro tanto, y culmina con la formulación del pliego de cargos.", "La indagación previa dura seis meses y no culmina con pliego de cargos, sino con archivo definitivo o apertura de investigación (art. 208 de la Ley 1952 de 2019).", false]]}, {"id": "DI-155", "niv": 3, "e": "Si al terminar la indagación no se logra identificar al autor y se ordena el archivo, esa decisión", "f": "Ley 1952 de 2019, arts. 208 (parágrafo) y 224", "o": [["A", "hace tránsito a cosa juzgada material e impide cualquier actuación posterior por los mismos hechos.", "La ley dispone lo contrario: el archivo de la indagación por no identificar al autor no hace tránsito a cosa juzgada material (art. 208, parágrafo); solo produce cosa juzgada formal (art. 224).", false], ["B", "no hace tránsito a cosa juzgada material.", "El parágrafo del artículo 208 de la Ley 1952 de 2019 dispone que el archivo por no identificar o individualizar al posible autor no hace tránsito a cosa juzgada material, y el artículo 224 precisa que en ese evento solo hace tránsito a cosa juzgada formal.", true], ["C", "debe enviarse en consulta a la Procuraduría, que decide si la confirma o la revoca.", "El código no prevé consulta del archivo de la indagación; la consulta solo se mantiene para la suspensión provisional (art. 217).", false]]}]}, {"comp": "disciplinario", "rol": "general", "tag": "Código General Disciplinario · Recursos: reposición, apelación y queja", "texto": "Usted es profesional universitario de la oficina de control disciplinario interno de una contraloría departamental. En una investigación, el instructor negó varias pruebas pedidas por el investigado. En otro proceso, ya en juicio, el funcionario de juzgamiento rechazó por extemporáneo el recurso de apelación que el defensor presentó contra el fallo de primera instancia, y el defensor sostiene que lo presentó a tiempo. En un tercer proceso, el auto que resolvió una solicitud de nulidad se notificó personalmente al investigado el martes 3 de marzo de 2026. Para los cálculos, considere días hábiles de lunes a viernes; no hay festivos en ese periodo.", "items": [{"id": "DI-181", "niv": 2, "e": "Contra la decisión que negó pruebas en la etapa de investigación procede el recurso de", "f": "Ley 1952 de 2019, arts. 133 (modificado por la Ley 2094 de 2021, art. 27), 134 y 136", "o": [["A", "reposición, ante el mismo funcionario que negó las pruebas.", "El recurso de reposición procede, entre otras, contra la decisión que niega las pruebas en la etapa de investigación (Ley 1952 de 2019, art. 133, modificado por la Ley 2094 de 2021).", true], ["B", "queja, ante el superior, dentro del término de ejecutoria del auto.", "La queja procede solo contra la decisión que rechaza el recurso de apelación (art. 136 de la Ley 1952 de 2019).", false], ["C", "apelación en el efecto devolutivo, ante el superior funcional del instructor.", "La apelación procede contra la decisión que niega pruebas en la etapa de juicio, no en la de investigación (art. 134 de la Ley 1952 de 2019).", false]]}, {"id": "DI-182", "niv": 1, "e": "Para controvertir el rechazo de su apelación, el defensor puede", "f": "Ley 1952 de 2019, arts. 136 y 137", "o": [["A", "interponer recurso de reposición dentro de los diez días siguientes a la notificación del rechazo.", "La reposición no procede contra el rechazo de la apelación (art. 133); el recurso previsto es la queja (art. 136).", false], ["B", "pedir al Procurador General la revocatoria directa del rechazo, en cualquier tiempo.", "La revocatoria directa recae sobre fallos sancionatorios, autos de archivo y fallos absolutorios en los casos legales (arts. 141 a 143), no sobre el rechazo de un recurso.", false], ["C", "interponer y sustentar el recurso de queja dentro del término de ejecutoria del rechazo.", "El recurso de queja procede contra la decisión que rechaza la apelación, y debe interponerse y sustentarse dentro del término de ejecutoria de esa decisión (Ley 1952 de 2019, arts. 136 y 137).", true]]}, {"id": "DI-183", "niv": 3, "e": "El último día para interponer reposición contra el auto que resolvió la nulidad es el", "f": "Ley 1952 de 2019, arts. 131 y 133 (modificados por la Ley 2094 de 2021, arts. 25 y 27)", "o": [["A", "viernes 6 de marzo de 2026.", "Corresponde a tres días hábiles; el término legal de los recursos de reposición y apelación es de cinco días siguientes a la notificación (art. 131 de la Ley 1952 de 2019).", false], ["B", "martes 10 de marzo de 2026.", "La reposición procede contra la decisión sobre la nulidad (art. 133) y se interpone hasta el vencimiento de los cinco días siguientes a la notificación (Ley 1952 de 2019, art. 131). Desde el miércoles 4 de marzo, cinco días hábiles vencen el martes 10 de marzo de 2026.", true], ["C", "martes 17 de marzo de 2026.", "Corresponde a diez días hábiles, término de la apelación del fallo en el juicio ordinario (art. 225G), no de la reposición (art. 131).", false]]}]}, {"comp": "contratacion", "rol": "general", "tag": "Contratación estatal · Mínima cuantía", "texto": "La Secretaría General de la Procuraduría General de la Nación necesita comprar sillas ergonómicas para una procuraduría regional, por un valor que no supera su mínima cuantía. Usted, profesional del grupo de contratación, prepara la invitación en el SECOP II. Al vencer el plazo se reciben tres ofertas: la de menor precio no acredita la experiencia mínima exigida en la invitación ni la subsana en el término fijado para ello; la de segundo menor precio cumple todas las condiciones. Un oferente pregunta si debía aportar el certificado del Registro Único de Proponentes (RUP) y una póliza de seriedad de la oferta.", "items": [{"id": "CE-116", "niv": 1, "e": "La invitación de este proceso debe publicarse por un término", "f": "Ley 1150 de 2007, art. 2, num. 5, lit. a); Decreto 1082 de 2015, art. 2.2.1.2.1.5.2, num. 3", "o": [["A", "no inferior a un día hábil, para que los interesados conozcan su contenido y formulen observaciones.", "El literal a) del numeral 5 del artículo 2 de la Ley 1150 y el numeral 3 del artículo 2.2.1.2.1.5.2 del Decreto 1082 de 2015 disponen que la invitación de mínima cuantía se publica por un término no inferior a un día hábil para que los interesados se informen y formulen observaciones.", true], ["B", "no inferior a diez días hábiles, igual que el proyecto de pliego de la licitación pública.", "Los diez días hábiles son el término de observaciones al proyecto de pliego en la licitación pública; la mínima cuantía tiene un procedimiento abreviado con invitación de al menos un día hábil.", false], ["C", "no inferior a cinco días hábiles, igual que el proyecto de pliego de condiciones en la selección abreviada.", "Los cinco días hábiles corresponden a las observaciones al proyecto de pliego en la selección abreviada y el concurso de méritos (Decreto 1082, art. 2.2.1.1.2.1.4), no a la invitación de mínima cuantía.", false]]}, {"id": "CE-117", "niv": 2, "e": "Frente a las ofertas recibidas, la Procuraduría debe", "f": "Ley 1150 de 2007, art. 2, num. 5, lit. c); Decreto 1082 de 2015, art. 2.2.1.2.1.5.2, nums. 5 y 7", "o": [["A", "declarar desierto el proceso, porque la oferta de menor precio no cumplió y la invitación no permite pasar a la siguiente oferta.", "La norma prevé expresamente pasar a la oferta con el segundo mejor precio cuando la primera no cumple (Decreto 1082, art. 2.2.1.2.1.5.2, num. 5).", false], ["B", "asignar puntaje a la experiencia de las tres ofertas y aceptar la que obtenga el mayor puntaje.", "En la mínima cuantía no se ponderan factores: se acepta la oferta de menor precio que cumpla las condiciones de la invitación (art. 2, num. 5, lit. c, Ley 1150).", false], ["C", "aceptar la oferta de segundo menor precio, porque la de menor precio no cumplió las condiciones de la invitación.", "El artículo 2.2.1.2.1.5.2 del Decreto 1082 de 2015 ordena verificar que la oferta de menor precio cumpla; si no cumple, se verifica la del segundo mejor precio, y así sucesivamente, y se acepta la de menor precio que cumpla las condiciones (nums. 5 y 7).", true]]}, {"id": "CE-118", "niv": 2, "e": "A la pregunta del oferente sobre el RUP y la póliza de seriedad, la respuesta correcta es que", "f": "Ley 1150 de 2007, arts. 6, inc. 2 y 7; Decreto 1082 de 2015, art. 2.2.1.2.1.5.5", "o": [["A", "el RUP no se exige, pero la garantía de seriedad es obligatoria en todas las modalidades de selección.", "En la mínima cuantía la entidad decide si exige garantías (Decreto 1082, art. 2.2.1.2.1.5.5); la garantía de seriedad no es obligatoria en ella.", false], ["B", "el RUP es obligatorio en todo proceso de selección, aunque las garantías no se exigen en la mínima cuantía.", "La Ley 1150 (art. 6, inc. 2) excluye expresamente del RUP la mínima cuantía, entre otros casos; en ellos la entidad verifica directamente las condiciones del proponente.", false], ["C", "en la mínima cuantía no se exige el RUP y la Procuraduría es libre de exigir o no garantías.", "El inciso 2 del artículo 6 de la Ley 1150 excluye del RUP los contratos de mínima cuantía, y el artículo 2.2.1.2.1.5.5 del Decreto 1082 de 2015 deja a la entidad en libertad de exigir o no garantías en ese proceso.", true]]}]}, {"comp": "contratacion", "rol": "tecnico", "tag": "Contratación estatal · Niveles técnico, administrativo y operativo · Pagos a contratistas de prestación de servicios", "texto": "Usted es técnico administrativo de la oficina financiera de una gobernación y recibe las cuentas de cobro mensuales de los contratistas de apoyo a la gestión. Una contratista presenta su cuenta con la certificación de cumplimiento firmada por el supervisor, pero sin la planilla que acredite el pago de los aportes a seguridad social del período. Otro contratista entrega su cuenta con un error de cálculo en el valor de la cuota mensual. Un tercero le pregunta si, al terminar su contrato, tiene derecho a que le paguen prima de servicios y vacaciones.", "items": [{"id": "CE-122", "niv": 1, "e": "Ante la cuenta presentada sin la planilla de aportes, usted debe", "f": "Ley 80 de 1993, art. 41, inc. 2 y par. 1 (modificados por la Ley 1150 de 2007, art. 23)", "o": [["A", "tramitar el pago, porque la certificación del supervisor basta para acreditar el cumplimiento de todas las obligaciones del contratista.", "La certificación de cumplimiento del supervisor no sustituye la acreditación del pago de aportes a seguridad social, que la ley exige de manera específica para cada pago (art. 41, par. 1, Ley 80).", false], ["B", "verificar que la contratista acredite el pago de los aportes a seguridad social antes de tramitar ese pago.", "El inciso 2 y el parágrafo 1 del artículo 41 de la Ley 80, modificados por el artículo 23 de la Ley 1150 de 2007, exigen que el contratista acredite estar al día en los aportes al Sistema de Seguridad Social Integral para la realización de cada pago; el servidor que sin justa causa no lo verifique incurre en causal de mala conducta.", true], ["C", "tramitar el pago, porque el pago de aportes se verifica una sola vez, al momento de firmar el contrato.", "La ley exige acreditar el pago de aportes para cada pago derivado del contrato, no solo al suscribirlo (art. 41, par. 1, Ley 80).", false]]}, {"id": "CE-123", "niv": 2, "e": "Frente a la cuenta con el error de cálculo, lo procedente es", "f": "Ley 80 de 1993, art. 25, num. 17", "o": [["A", "radicarla el día en que se presenta y ajustarla de oficio o, si no se puede, devolverla con una explicación escrita.", "El numeral 17 del artículo 25 de la Ley 80 obliga a las entidades a radicar las actas o cuentas de cobro en la fecha en que el contratista las presenta, a corregirlas o ajustarlas de oficio si hay lugar y, si no es posible, a devolverlas a la mayor brevedad explicando por escrito los motivos.", true], ["B", "abstenerse de radicarla y pedir al contratista que presente una nueva cuenta de cobro con el valor correcto en el período siguiente.", "La ley prohíbe dejar de radicar la cuenta: debe radicarse en la fecha de presentación y corregirse de oficio o devolverse con explicación escrita (art. 25, num. 17, Ley 80).", false], ["C", "radicarla y dejarla en espera, sin tramitarla, hasta que el contratista advierta el error y la corrija por iniciativa propia.", "La entidad tiene el deber de corregir de oficio o devolver la cuenta explicando el motivo; dejarla en espera contraría el numeral 17 del artículo 25 de la Ley 80.", false]]}, {"id": "CE-124", "niv": 1, "e": "A la pregunta sobre la prima de servicios y las vacaciones, la respuesta ajustada a la ley es que", "f": "Ley 80 de 1993, art. 32, num. 3", "o": [["A", "proceden en proporción al tiempo de ejecución, porque el contrato se celebró con una persona natural.", "Que el contratista sea persona natural no convierte el contrato en laboral; la ley excluye la relación laboral y las prestaciones sociales (art. 32, num. 3, Ley 80).", false], ["B", "no proceden, porque los contratos de prestación de servicios no generan relación laboral ni prestaciones sociales.", "El numeral 3 del artículo 32 de la Ley 80 dispone que en ningún caso los contratos de prestación de servicios generan relación laboral ni prestaciones sociales, y que se celebran por el término estrictamente indispensable.", true], ["C", "proceden cuando el contrato supera un año de ejecución continua con la misma entidad.", "La Ley 80 no reconoce prestaciones sociales a los contratistas de prestación de servicios por la duración del contrato; el numeral 3 del artículo 32 las excluye.", false]]}]}, {"comp": "contratacion", "rol": "general", "tag": "Contratación estatal · Cláusulas excepcionales: en qué contratos proceden", "texto": "Usted es profesional de la oficina jurídica de una gobernación y revisa las minutas de tres contratos: uno de obra para el mejoramiento de una vía secundaria, en cuyo texto no se incluyeron cláusulas excepcionales; un convenio interadministrativo con un municipio para cofinanciar la construcción de un polideportivo; y un contrato de suministro de raciones alimentarias para el Programa de Alimentación Escolar (PAE) en los colegios del departamento.", "items": [{"id": "CE-155", "niv": 2, "e": "En el contrato de obra en el que no se incluyeron las cláusulas excepcionales, estas", "f": "Ley 80 de 1993, art. 14, num. 2 (modificado por la Ley 2195 de 2022, art. 52)", "o": [["A", "deberán incluirse mediante un otrosí firmado antes del acta de inicio para que produzcan efectos.", "No se requiere otrosí: la ley las entiende pactadas en los contratos de obra aunque no se consignen (art. 14, num. 2, Ley 80).", false], ["B", "no podrán ejercerse, porque las partes no las incluyeron en el texto del contrato.", "En los contratos de obra las cláusulas excepcionales se entienden incorporadas por ministerio de la ley (art. 14, num. 2, Ley 80).", false], ["C", "se entienden pactadas aunque no se hayan consignado expresamente.", "El numeral 2 del artículo 14 de la Ley 80, modificado por el artículo 52 de la Ley 2195 de 2022, ordena pactar las cláusulas excepcionales en los contratos de obra, entre otros, y dispone que en esos casos se entienden pactadas aun cuando no se consignen expresamente.", true]]}, {"id": "CE-156", "niv": 1, "e": "En el convenio interadministrativo con el municipio, las cláusulas excepcionales", "f": "Ley 80 de 1993, art. 14, par.", "o": [["A", "no se utilizan, porque la ley ordena prescindir de ellas en los contratos interadministrativos.", "El parágrafo del artículo 14 de la Ley 80 dispone que en los contratos interadministrativos, entre otros, se prescindirá de la utilización de las cláusulas o estipulaciones excepcionales.", true], ["B", "son obligatorias, porque el convenio destina recursos a la construcción de una obra pública.", "La obligatoriedad para la obra se refiere a los contratos de obra; en los contratos interadministrativos la ley ordena prescindir de las cláusulas excepcionales (art. 14, par., Ley 80).", false], ["C", "pueden pactarse si ambas entidades lo acuerdan expresamente en el texto del convenio que suscriban.", "La ley no deja esta materia a la voluntad de las partes: en los contratos interadministrativos se prescinde de las cláusulas excepcionales (art. 14, par., Ley 80).", false]]}, {"id": "CE-157", "niv": 3, "e": "En el contrato de suministro de raciones del PAE, las cláusulas excepcionales", "f": "Ley 80 de 1993, art. 14, num. 2 (modificado por la Ley 2195 de 2022, art. 52)", "o": [["A", "son obligatorias, porque la ley las exige en los contratos relacionados con el PAE.", "Desde la modificación del numeral 2 del artículo 14 de la Ley 80 por el artículo 52 de la Ley 2195 de 2022, los contratos relacionados con el Programa de Alimentación Escolar están entre aquellos en los que se deben pactar las cláusulas excepcionales, y se entienden pactadas aunque no se consignen.", true], ["B", "son facultativas, porque se trata de un contrato de suministro.", "Aunque en el suministro en general las cláusulas son facultativas, la Ley 2195 de 2022 las hizo obligatorias en los contratos relacionados con el PAE (art. 14, num. 2, Ley 80).", false], ["C", "están prohibidas, porque el contrato se financia con recursos del sector educación transferidos por la Nación.", "La fuente de financiación no está entre los supuestos del parágrafo del artículo 14 de la Ley 80; para el PAE la ley ordena pactarlas.", false]]}]}, {"comp": "contratacion", "rol": "general", "tag": "Contratación estatal · Liquidación: plazos de la Ley 1150", "texto": "Usted es profesional de la oficina jurídica de una alcaldía. El plazo de ejecución de un contrato de obra venció el 30 de abril de 2025. Ni el pliego de condiciones ni el contrato fijaron un término para liquidarlo, y las partes no acordaron uno después. La alcaldía convocó oportunamente al contratista para liquidar el contrato de mutuo acuerdo, pero este no se presentó.", "items": [{"id": "CE-167", "niv": 2, "e": "El término para liquidar el contrato de mutuo acuerdo vencía el", "f": "Ley 1150 de 2007, art. 11, inc. 1", "o": [["A", "30 de agosto de 2025.", "A falta de término en el pliego o acordado por las partes, el artículo 11 de la Ley 1150 fija los cuatro meses siguientes a la expiración del plazo de ejecución, contados como meses calendario: del 30 de abril al 30 de agosto de 2025.", true], ["B", "30 de octubre de 2025.", "Es el vencimiento del término para la liquidación unilateral (cuatro meses más dos), no el de la liquidación de mutuo acuerdo.", false], ["C", "30 de abril de 2026.", "Cuenta un año desde el vencimiento del plazo; la ley fija cuatro meses para la liquidación de mutuo acuerdo cuando no hay término pactado.", false]]}, {"id": "CE-168", "niv": 2, "e": "Como el contratista no se presentó, la alcaldía podía liquidar unilateralmente dentro de un término que vencía el", "f": "Ley 1150 de 2007, art. 11, inc. 2", "o": [["A", "30 de septiembre de 2025.", "Suma un solo mes al vencimiento del término de mutuo acuerdo; la ley concede dos meses para la liquidación unilateral.", false], ["B", "30 de octubre de 2025.", "El inciso 2 del artículo 11 de la Ley 1150 permite liquidar unilateralmente dentro de los dos meses siguientes al vencimiento del término de mutuo acuerdo (30 de agosto de 2025), contados como meses calendario, es decir, hasta el 30 de octubre de 2025.", true], ["C", "30 de diciembre de 2025.", "Suma cuatro meses al término de mutuo acuerdo; el término para la liquidación unilateral es de dos meses.", false]]}, {"id": "CE-169", "niv": 3, "e": "Si vencido el término para liquidar unilateralmente la alcaldía aún no lo ha hecho, el contrato puede liquidarse, de mutuo acuerdo o unilateralmente, a más tardar el", "f": "Ley 1150 de 2007, art. 11, inc. 3; Colombia Compra Eficiente, Guía para la liquidación de los Procesos de Contratación", "o": [["A", "30 de abril de 2027.", "Cuenta los dos años desde el vencimiento del plazo de ejecución; la ley los cuenta desde el vencimiento de los términos anteriores (mutuo acuerdo y unilateral).", false], ["B", "30 de agosto de 2027.", "Cuenta los dos años desde el vencimiento del término de mutuo acuerdo; la ley los cuenta desde el vencimiento del término para liquidar unilateralmente.", false], ["C", "30 de octubre de 2027.", "El inciso 3 del artículo 11 de la Ley 1150 permite liquidar en cualquier tiempo dentro de los dos años siguientes al vencimiento de los términos anteriores, es decir, desde el vencimiento del término para liquidar unilateralmente (30 de octubre de 2025) y no desde el fin del plazo contractual: hasta el 30 de octubre de 2027.", true]]}, {"id": "CE-170", "niv": 3, "e": "Si el contratista se hubiera presentado y firmado el acta de liquidación con salvedades sobre algunos valores, la alcaldía", "f": "Ley 1150 de 2007, art. 11, inc. final", "o": [["A", "tendría que rechazar el acta, porque el contratista no puede dejar salvedades en una liquidación de mutuo acuerdo.", "La ley reconoce expresamente el derecho del contratista a efectuar salvedades a la liquidación por mutuo acuerdo (art. 11, inc. final, Ley 1150).", false], ["B", "podría liquidar unilateralmente los aspectos que no fueron objeto de acuerdo.", "El inciso final del artículo 11 de la Ley 1150 reconoce al contratista el derecho a dejar salvedades en la liquidación de mutuo acuerdo y dispone que, en ese evento, la liquidación unilateral procede en relación con los aspectos que no fueron objeto de acuerdo.", true], ["C", "debería rehacer la liquidación completa de manera unilateral, porque las salvedades anulan el acta bilateral.", "Las salvedades no anulan el acta: lo acordado queda en firme y la liquidación unilateral se limita a lo no acordado (art. 11, Ley 1150).", false]]}]}, {"comp": "anticorrupcion", "rol": "general", "tag": "Estatuto Anticorrupción y transparencia · Prohibiciones e inhabilidades para exservidores", "texto": "Laura fue secretaria de planeación de un municipio, cargo del nivel directivo, hasta el 31 de enero de 2026. En febrero se vinculó como consultora a una firma privada de urbanismo. En septiembre de 2026, la firma le propone tres encargos: asesorar a un constructor en el trámite de una licencia ante la misma secretaría de planeación; representar a otro constructor en un proceso sancionatorio urbanístico que ella conoció y en el que firmó el auto de apertura cuando era secretaria; y elaborar la oferta de la firma para un contrato de consultoría en ordenamiento territorial con la alcaldía de ese municipio. Laura consulta en la personería qué puede hacer.", "items": [{"id": "AC-104", "niv": 2, "e": "Sobre la asesoría al constructor en el trámite de la licencia, la personería le indica a Laura que", "f": "Ley 1952 de 2019, art. 56, num. 4", "o": [["A", "puede prestarla siempre que el constructor no tenga contratos vigentes con el municipio.", "La prohibición se refiere a asuntos relacionados con las funciones propias del cargo, como una licencia urbanística ante la secretaría que dirigía, y no depende de que el particular tenga contratos con el municipio.", false], ["B", "puede prestarla, porque ya no es servidora pública y el régimen disciplinario dejó de aplicársele desde el día en que se retiró del cargo.", "El régimen disciplinario contempla prohibiciones que siguen aplicando al exservidor durante un tiempo después del retiro, precisamente para evitar el uso indebido de su posición anterior.", false], ["C", "no debe prestarla: en el año siguiente al retiro no puede asesorar ante la misma entidad en asuntos propios de su cargo.", "El numeral 4 del artículo 56 de la Ley 1952 de 2019 sanciona como falta gravísima prestar, a título personal o por interpuesta persona, servicios de asistencia, representación o asesoría en asuntos relacionados con las funciones propias del cargo, hasta por el término de un año después de la dejación del cargo, con respecto de la entidad en la que se prestaron los servicios. Han pasado ocho meses desde el retiro de Laura, de modo que está dentro del término.", true]]}, {"id": "AC-105", "niv": 3, "e": "En cuanto al proceso sancionatorio en el que Laura firmó el auto de apertura, ella", "f": "Ley 1952 de 2019, art. 56, num. 4", "o": [["A", "no puede representarlo en ningún momento, por tratarse de un asunto concreto que conoció como secretaria.", "El numeral 4 del artículo 56 de la Ley 1952 de 2019 dispone que la incompatibilidad es indefinida en el tiempo respecto de los asuntos concretos que el servidor conoció en ejercicio de sus funciones, entendidos como los de carácter particular que fueron objeto de decisión y tienen sujetos claramente determinados.", true], ["B", "puede representarlo desde ya, si se declara impedida ante la secretaría de planeación y renuncia a cobrar honorarios.", "Los impedimentos son una figura para quien ejerce funciones públicas; la gratuidad de la gestión tampoco elimina la prohibición, que recae sobre la representación misma en ese asunto concreto.", false], ["C", "podrá representar al constructor una vez cumplido el primer año desde su retiro.", "El término de un año se aplica a los asuntos relacionados con las funciones del cargo en general; para el asunto concreto que conoció como servidora, la prohibición no tiene límite temporal.", false]]}, {"id": "AC-106", "niv": 3, "e": "Respecto de la oferta de la firma para el contrato de consultoría con la alcaldía, es acertado afirmar que", "f": "Ley 80 de 1993, art. 8, num. 2, lit. f (adicionado por la Ley 1474 de 2011, art. 4)", "o": [["A", "la firma puede presentar la oferta si Laura no la firma ni participa en la ejecución del contrato.", "La inhabilidad se configura por el vínculo de Laura con la sociedad y la relación del objeto con su sector, no porque ella suscriba la oferta o ejecute el contrato.", false], ["B", "la firma no puede contratar con esa alcaldía en los dos años si
