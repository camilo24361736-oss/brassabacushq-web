 "f": "Guías institucionales que citan la GTC 185: UIS GGD.10, Senado GD-IT01, Alcaldía de Mitú (ver notas-do.md)", "o": [["A", "el nombre completo y la dirección de cada procurador provincial, uno por renglón, como si se tratara de cartas individuales.", "La circular se dirige a un grupo destinatario identificado de forma general; no se relacionan uno a uno los nombres y direcciones como en una carta.", false], ["B", "«PARA:», con dos puntos, igual que en el memorando.", "En las guías basadas en la GTC 185 el encabezado de la circular se distingue del memorando: allí PARA se escribe sin dos puntos.", false], ["C", "la palabra «PARA» en mayúscula sostenida, sin dos puntos, seguida del grupo destinatario.", "Las guías de la UIS, del Senado y de la Alcaldía de Mitú, basadas en la GTC 185, indican que en la circular la palabra PARA se escribe en mayúscula sostenida, sin dos puntos, seguida del grupo destinatario.", true]]}, {"id": "DO-112", "niv": 2, "e": "Sobre el saludo en la circular, lo recomendado es que", "f": "Guías institucionales que citan la GTC 185: UIS GGD.10, Senado GD-IT01, Alcaldía de Mitú (ver notas-do.md)", "o": [["A", "se ubique al final, junto a la despedida y antes de la firma del procurador regional.", "El saludo abre la comunicación; al final van la despedida y los datos del remitente, no el saludo.", false], ["B", "se incluya al inicio del texto.", "Las guías de la UIS, del Senado y de la Alcaldía de Mitú, basadas en la GTC 185, señalan que en la circular el saludo se incluye al inicio del texto.", true], ["C", "se omita, porque las circulares son impersonales y no admiten saludo.", "Las guías basadas en la GTC 185 consultadas no excluyen el saludo de la circular; indican incluirlo al inicio del texto.", false]]}]}, {"comp": "documentos_oficina", "rol": "general", "tag": "Elaboración de documentos de oficina · Ortografía: mayúsculas, siglas y tildes", "texto": "Usted es auxiliar de la secretaría de una procuraduría provincial y corrige un informe breve antes de enviarlo. En el borrador se lee: «El Procurador Provincial remitió el documento a la secretaría general»; más adelante: «Se realizó una reunión con las ONGs de la región»; y en un cuadro aparece el título «OFICINA JURIDICA», escrito sin tilde porque, según el autor, «las mayúsculas no se tildan». La entidad sigue las normas ortográficas de la Real Academia Española.", "items": [{"id": "DO-122", "niv": 3, "e": "La primera frase, corregida según la ortografía académica, queda así", "f": "RAE, Ortografía, mayúsculas en cargos y en nombres de entidades (ver notas-do.md)", "o": [["A", "«El procurador provincial remitió el documento a la Secretaría General», con el cargo en minúscula y la dependencia con mayúsculas iniciales.", "La Real Academia Española recomienda escribir con minúscula los sustantivos que designan cargos, incluso en textos administrativos, y con mayúscula inicial las palabras significativas del nombre de dependencias y organismos, como Secretaría General.", true], ["B", "«El Procurador Provincial remitió el documento a la Secretaría General», porque en los documentos oficiales todo va con mayúscula.", "La RAE recomienda la minúscula para los cargos aun en documentos oficiales o administrativos; la mayúscula corresponde a los nombres de las dependencias.", false], ["C", "«El Procurador Provincial remitió el documento a la secretaría general», con la dependencia en minúscula.", "La frase invierte la regla: los cargos se escriben con minúscula y los nombres de las dependencias, con mayúscula inicial en sus palabras significativas (RAE).", false]]}, {"id": "DO-123", "niv": 2, "e": "La forma correcta de escribir el plural de la sigla en la segunda frase es", "f": "RAE, plural de las siglas (ver notas-do.md)", "o": [["A", "«las O.N.G.», con puntos entre las letras de la sigla para indicar que es una abreviación.", "Las siglas se escriben sin puntos entre sus letras, según la RAE.", false], ["B", "«las ONGs», con s final para marcar el plural.", "La RAE señala que las siglas son invariables en la escritura; el plural se marca con el artículo o los determinantes, no con una s añadida.", false], ["C", "«las ONG», sin marca de plural en la sigla.", "La Real Academia Española indica que las siglas son invariables en la escritura y que su plural se manifiesta en las palabras que las acompañan, como el artículo: «las ONG».", true]]}, {"id": "DO-124", "niv": 2, "e": "Sobre el título del cuadro, lo correcto es escribir", "f": "RAE, tilde en las mayúsculas (ver notas-do.md)", "o": [["A", "«OFICINA JURIDICA», sin tilde, porque las mayúsculas no se acentúan.", "La RAE señala que el uso de mayúsculas no exime de poner la tilde cuando la palabra la lleva según las reglas de acentuación.", false], ["B", "cualquiera de las dos formas, porque la tilde en mayúsculas es opcional.", "La tilde en mayúsculas no es opcional: es obligatoria cuando la palabra la requiere, según la RAE.", false], ["C", "«OFICINA JURÍDICA», con tilde, porque las mayúsculas se tildan como las minúsculas.", "La Real Academia Española establece que las letras mayúsculas llevan tilde si les corresponde según las reglas de acentuación; solo las siglas escritas en mayúscula no se tildan.", true]]}]}, {"comp": "documentos_oficina", "rol": "profesional", "tag": "Elaboración de documentos de oficina · Niveles profesional, asesor y ejecutivo · El informe y la redacción concisa", "texto": "Usted es profesional de una procuraduría provincial y prepara el documento con el que se presentarán al procurador regional los resultados de las visitas de vigilancia realizadas durante el semestre. Un compañero le entrega un borrador que empieza con tres páginas sobre la historia de la sede, deja las conclusiones para un anexo y usa frases como «Se procedió a la realización de la revisión de la totalidad de los expedientes existentes». El procurador regional pidió un documento que pueda leer rápido y que le permita tomar decisiones.", "items": [{"id": "DO-128", "niv": 2, "e": "El tipo documental adecuado para presentar esos resultados es", "f": "UIS, Guía GGD.10 (basada en la GTC 185), definiciones (ver notas-do.md)", "o": [["A", "un informe, porque da a conocer datos precisos sobre el estado y los resultados de una actividad.", "La guía de comunicaciones de la UIS, basada en la GTC 185, define el informe como el documento que describe o da a conocer datos precisos sobre el estado de una actividad, estudio o proyecto, para conocer resultados de procesos administrativos.", true], ["B", "una constancia, porque deja registro de las actividades del semestre.", "La constancia es un documento probatorio que acredita hechos; no es el medio para exponer y analizar resultados de un periodo.", false], ["C", "una circular, porque se dirige a una autoridad de la misma entidad.", "La circular comunica un mismo contenido a un grupo de destinatarios; no es el documento para presentar resultados a un superior.", false]]}, {"id": "DO-129", "niv": 2, "e": "Para atender lo que pidió el procurador regional, la estructura del documento debe", "f": "DNP, Guía de lenguaje claro (2015); Función Pública, técnica n.º 1 de lenguaje claro", "o": [["A", "comenzar con la historia de la sede para dar contexto completo antes de cualquier dato.", "Tres páginas de antecedentes aplazan la información que el lector necesita para decidir; el lenguaje claro recomienda priorizar lo que le interesa al destinatario.", false], ["B", "presentar al comienzo los resultados y conclusiones principales, y luego el detalle que los sustenta.", "Las recomendaciones de lenguaje claro del DNP y de Función Pública indican organizar el texto según el propósito y el lector, y ubicar al comienzo la información que más le interesa a quien lee.", true], ["C", "mantener las conclusiones en un anexo, para que el cuerpo del documento solo describa las visitas realizadas una por una.", "Enviar las conclusiones a un anexo obliga al lector a buscar lo principal; las recomendaciones de lenguaje claro indican presentarlo primero.", false]]}, {"id": "DO-130", "niv": 3, "e": "La frase «Se procedió a la realización de la revisión de la totalidad de los expedientes existentes» queda mejor redactada así", "f": "DNP, Guía de lenguaje claro para servidores públicos de Colombia (2015)", "o": [["A", "«Se procedió a realizar la revisión de todos los expedientes existentes».", "Aunque simplifica un poco, mantiene el rodeo «se procedió a realizar la revisión» en lugar del verbo directo, y conserva la palabra innecesaria «existentes».", false], ["B", "«Revisamos todos los expedientes».", "La Guía de lenguaje claro del DNP recomienda oraciones cortas, voz activa y palabras sencillas: el verbo «revisamos» reemplaza a «se procedió a la realización de la revisión» y «todos» a «la totalidad de».", true], ["C", "«Se llevó a cabo el proceso de revisión de la totalidad de los expedientes».", "La frase sigue usando construcciones impersonales y sustantivos en lugar del verbo («proceso de revisión»), contra las recomendaciones de voz activa y palabras sencillas del DNP.", false]]}]}, {"comp": "ofimatica", "rol": "general", "tag": "Herramientas ofimáticas · SI anidado, Y, O", "texto": "En la Oficina de Planeación de la Procuraduría, usted consolida el avance de las metas del plan de acción de las procuradurías regionales. En la columna B registra el porcentaje de avance y en C2 escribió =SI(B2>=90%;\"Satisfactorio\";SI(B2>=70%;\"Aceptable\";\"Crítico\")). En la columna D se escribe «Sí» cuando la dependencia entregó las evidencias. En la columna E se deben marcar como «Cumple» solo las metas que tengan avance de al menos 80 % y, además, evidencias entregadas.", "items": [{"id": "OF-110", "niv": 1, "e": "Para una regional con avance de exactamente 70 %, la fórmula de la columna C devuelve", "f": "Microsoft Support, «Función SI» y «Funciones SI anidadas»", "o": [["A", "«Satisfactorio».", "Solo se obtiene con un avance de 90 % o más (primera prueba). Con 70 % esa prueba es falsa y el SI anidado devuelve «Aceptable».", false], ["B", "«Crítico».", "Supone que el avance debe superar el 70 %. El operador >= incluye el valor límite; con > sí se excluiría el 70 %, pero la fórmula usa mayor o igual.", false], ["C", "«Aceptable».", "La primera prueba (B2>=90%) es falsa, de modo que se evalúa el SI anidado; como 70 % es mayor o igual que 70 %, devuelve «Aceptable».", true]]}, {"id": "OF-111", "niv": 3, "e": "Un compañero reescribió la fórmula como =SI(B2>=70%;\"Aceptable\";SI(B2>=90%;\"Satisfactorio\";\"Crítico\")). Con un avance de 95 %, esta versión devuelve", "f": "Microsoft Support, «Función SI» y «Funciones SI anidadas»", "o": [["A", "«Aceptable», porque la primera condición ya es verdadera y la función no evalúa el SI anidado.", "SI devuelve el valor de la primera prueba verdadera. Como 95 % >= 70 %, retorna «Aceptable» y nunca llega a evaluar B2>=90%; por eso, en clasificaciones por rangos, las condiciones deben ordenarse de la más exigente a la menos exigente.", true], ["B", "«Crítico», porque las condiciones quedaron en un orden contradictorio.", "El orden no vuelve contradictoria la fórmula ni la lleva a la opción final; simplemente la primera condición verdadera (>=70 %) determina el resultado.", false], ["C", "«Satisfactorio», porque Excel evalúa todas las condiciones y aplica la más exigente que se cumpla.", "Excel no busca la condición más exigente: devuelve el resultado de la primera prueba lógica verdadera.", false]]}, {"id": "OF-112", "niv": 2, "e": "Para la columna E, la fórmula que marca correctamente las metas que cumplen es", "f": "Microsoft Support, «Función Y», «Función O» y «Función SI»", "o": [["A", "=SI(B2>=80%;\"Cumple\";SI(D2=\"Sí\";\"Cumple\";\"No cumple\")).", "Equivale a una O: basta el avance o basta la evidencia para obtener «Cumple», cuando se exigen las dos condiciones a la vez.", false], ["B", "=SI(Y(B2>=80%;D2=\"Sí\");\"Cumple\";\"No cumple\").", "Y devuelve VERDADERO solo cuando todas sus condiciones se cumplen, que es lo que se pide: avance de al menos 80 % y evidencias entregadas.", true], ["C", "=SI(O(B2>=80%;D2=\"Sí\");\"Cumple\";\"No cumple\").", "O devuelve VERDADERO si se cumple cualquiera de las condiciones, de modo que marcaría «Cumple» una meta con 85 % sin evidencias.", false]]}]}, {"comp": "ofimatica", "rol": "general", "tag": "Herramientas ofimáticas · Errores en fórmulas de Excel", "texto": "Antes de enviar a la Oficina de Planeación el libro de indicadores de una procuraduría provincial, usted encuentra tres celdas con problemas: (1) en G5, la fórmula =F5/E5, donde E5 está vacía porque aún no se ha reportado la meta; (2) en G8, la fórmula =SUMA(Quejas2027), aunque en el libro nunca se definió un rango con ese nombre; (3) en G12, la fórmula =B12+C12+D12, que mostraba un valor correcto hasta que alguien eliminó la columna C completa.", "items": [{"id": "OF-125", "niv": 1, "e": "La celda G5 muestra el error", "f": "Microsoft Support, «Detectar errores de fórmula en Excel» y «Cómo corregir un error #¡DIV/0!»", "o": [["A", "#¡VALOR!, porque una celda vacía no es un número.", "En una división, la celda vacía se trata como cero, por eso el error es #¡DIV/0! y no #¡VALOR!.", false], ["B", "#N/D, porque el dato de la meta todavía no está disponible.", "#N/D aparece cuando una función no encuentra un valor, por ejemplo una búsqueda sin coincidencia. Dividir por una celda vacía produce #¡DIV/0!.", false], ["C", "#¡DIV/0!, porque el divisor es una celda vacía.", "Excel muestra #¡DIV/0! al dividir por cero o por una celda que no contiene ningún valor, como E5.", true]]}, {"id": "OF-126", "niv": 2, "e": "La celda G8 muestra #¿NOMBRE?, y la forma adecuada de corregirlo es", "f": "Microsoft Support, «Cómo corregir un error #¿NOMBRE?»", "o": [["A", "definir el nombre Quejas2027 para el rango que corresponde o reemplazarlo por la referencia del rango.", "#¿NOMBRE? indica que Excel no reconoce un texto de la fórmula, por ejemplo un nombre no definido. Se corrige definiendo el nombre o usando la referencia; Microsoft advierte que no debe ocultarse con SI.ERROR.", true], ["B", "convertir a número las celdas del rango, porque SUMA no reconoce valores con formato de texto.", "El problema no está en los valores sumados, sino en que el nombre «Quejas2027» no existe en el libro.", false], ["C", "envolver la fórmula en SI.ERROR para que muestre cero mientras se definen los datos.", "Microsoft indica que #¿NOMBRE? señala un error de sintaxis que debe resolverse y que no conviene enmascararlo con funciones de control de errores.", false]]}, {"id": "OF-127", "niv": 2, "e": "Después de eliminar la columna C, la fórmula de la fila 12 (que se desplazó a F12) muestra", "f": "Microsoft Support, «¡Cómo corregir un #¡REF! error»", "o": [["A", "el error #N/D, porque falta uno de los valores que se iban a sumar.", "#N/D se refiere a valores no encontrados por funciones de búsqueda; una referencia eliminada produce #¡REF!.", false], ["B", "la suma de los dos valores restantes, porque Excel ajusta automáticamente la fórmula.", "Excel ajusta rangos continuos (como B12:D12), pero no puede resolver una referencia individual a una celda eliminada.", false], ["C", "el error #¡REF!, porque una de sus referencias apunta a una celda que ya no existe.", "Al eliminar una columna referida de forma individual, Excel reemplaza esa referencia por #¡REF! (por ejemplo, =B12+#¡REF!+C12) y la fórmula devuelve ese error.", true]]}]}, {"comp": "ofimatica", "rol": "profesional", "tag": "Herramientas ofimáticas · Niveles profesional, asesor y ejecutivo · Control de cambios y comentarios", "texto": "Usted es profesional especializado de una procuraduría delegada y revisa en Word el proyecto de un auto elaborado por un sustanciador. Su jefe quiere ver cada palabra que usted agregue o suprima y decidir si la acepta. Usted tiene, además, dudas sobre una cita jurisprudencial que no le corresponde corregir, sino que debe verificar el sustanciador. Al final, una versión del documento debe remitirse a otra entidad sin rastros de la revisión interna.", "items": [{"id": "OF-140", "niv": 1, "e": "Para que su jefe vea cada modificación y decida sobre ella, usted debe", "f": "Microsoft Support, «Aceptar o rechazar las marcas de revisión en Word»", "o": [["A", "resaltar en amarillo el texto que agregue y tachar a mano el que suprima.", "El formato manual no permite aceptar o rechazar cambios y obliga a limpiar el documento a mano.", false], ["B", "activar Control de cambios antes de editar el documento.", "Con Control de cambios activado, Word marca las inserciones y eliminaciones, que luego pueden aceptarse o rechazarse una a una.", true], ["C", "guardar una copia con otro nombre para que el jefe compare las versiones a simple vista.", "Comparar a simple vista no identifica de forma confiable cada inserción o supresión; el Control de cambios las registra todas.", false]]}, {"id": "OF-141", "niv": 2, "e": "Frente a la cita jurisprudencial, lo adecuado es", "f": "Microsoft Support, «Insertar o eliminar un comentario» (Word)", "o": [["A", "insertar un comentario en la cita para que el sustanciador la verifique.", "El comentario permite señalar una duda sin modificar el texto, que es lo que se busca cuando la corrección corresponde a otra persona.", true], ["B", "corregirla según su criterio, ya que el Control de cambios dejará registrada la modificación.", "La verificación corresponde al sustanciador; registrar el cambio no suple que usted modifique algo que no le corresponde.", false], ["C", "eliminar la cita con Control de cambios activado, para que el sustanciador decida si la restituye.", "Suprimir el texto es una modificación de contenido; aquí no se busca cambiar la cita, sino pedir que se verifique.", false]]}, {"id": "OF-142", "niv": 3, "e": "Para remitir a la otra entidad una versión sin rastros de la revisión, se debe", "f": "Microsoft Support, «Aceptar o rechazar las marcas de revisión en Word»", "o": [["A", "aceptar o rechazar las marcas, borrar los comentarios y pasar el Inspector de documento.", "Microsoft advierte que para quitar las marcas hay que aceptarlas o rechazarlas, y recomienda una comprobación final con el Inspector de documento, que detecta marcas de revisión, comentarios, texto oculto y nombres personales.", true], ["B", "cambiar la vista a «Sin marcas» y guardar, con lo cual las marcas desaparecen del archivo.", "Esa vista solo oculta temporalmente las marcas; vuelven a verse cuando otra persona abre el documento.", false], ["C", "desactivar Control de cambios, con lo cual se eliminan las revisiones hechas mientras estuvo activo.", "Desactivar el Control de cambios solo deja de registrar cambios nuevos; las marcas existentes permanecen hasta aceptarlas o rechazarlas.", false]]}]}, {"comp": "ofimatica", "rol": "general", "tag": "Herramientas ofimáticas · Outlook: CCO, reglas y calendario", "texto": "Usted es técnico de la Oficina de Atención al Ciudadano de la Procuraduría. Debe enviar por correo institucional la invitación a una audiencia pública a 60 ciudadanos que no se conocen entre sí. Además, a diario recibe decenas de notificaciones automáticas del sistema de gestión documental que llenan su bandeja de entrada, y debe organizar una reunión virtual con cinco procuradurías provinciales y saber quién confirmó asistencia.", "items": [{"id": "OF-146", "niv": 1, "e": "Para proteger la privacidad de los ciudadanos, sus direcciones deben ir en el campo", "f": "Microsoft Support, «Mostrar, ocultar y ver el campo CCO (copia carbón oculta) en Outlook para Windows»", "o": [["A", "de destinatarios (Para), porque Outlook oculta automáticamente las listas largas.", "Outlook no oculta las direcciones del campo Para, sin importar cuántas sean; todos los destinatarios las ven.", false], ["B", "de copia oculta (CCO), porque cada uno recibe el mensaje sin ver las demás direcciones.", "Los destinatarios en CCO reciben copia sin que su dirección sea visible para los demás; Microsoft lo recomienda para mantener privada la lista de destinatarios.", true], ["C", "de copia (CC), porque las copias no muestran las direcciones a los demás destinatarios.", "Las direcciones en CC son visibles para todos los destinatarios; la que las oculta es CCO.", false]]}, {"id": "OF-147", "niv": 2, "e": "Para manejar las notificaciones del sistema de gestión documental, lo adecuado es", "f": "Microsoft Support, «Administrar el correo electrónico mediante reglas en Outlook»", "o": [["A", "configurar una respuesta automática para que el sistema deje de enviarlas.", "La respuesta automática informa ausencias al remitente; no organiza la bandeja ni detiene las notificaciones de un sistema.", false], ["B", "marcarlas como correo no deseado para que el sistema deje de entregarlas.", "Las notificaciones son mensajes legítimos de trabajo; marcarlas como no deseadas las desviaría a esa carpeta y podría hacer que se pierdan.", false], ["C", "crear una regla que las mueva automáticamente a una carpeta según el remitente.", "Las reglas de Outlook ejecutan acciones automáticas sobre los mensajes que cumplen condiciones, como mover a una carpeta los que provienen de un remitente determinado.", true]]}, {"id": "OF-148", "niv": 1, "e": "Para la reunión con las procuradurías provinciales, lo adecuado es", "f": "Microsoft Support, «Programar una reunión con otras personas» (Outlook)", "o": [["A", "enviar un correo con la fecha y pedir respuesta, porque el calendario no registra confirmaciones.", "El calendario de Outlook sí registra las respuestas a las convocatorias de reunión; un correo simple obliga a consolidarlas a mano.", false], ["B", "enviar una convocatoria de reunión desde el calendario, que registra las respuestas.", "La convocatoria (solicitud) de reunión invita a otras personas desde el calendario y permite ver quién aceptó, rechazó o propuso otra hora.", true], ["C", "crear una cita en su calendario y reenviarla como archivo adjunto.", "Una cita es un evento del propio calendario; reenviarla como adjunto no permite hacer seguimiento a las respuestas.", false]]}]}, {"comp": "sistemas_gestion", "rol": "general", "tag": "Sistemas de gestión (MIPG, control interno y calidad) · Ley 87 de 1993: definición y objetivos", "texto": "Usted es auxiliar administrativo de una procuraduría provincial y asiste a una capacitación sobre control interno. El facilitador presenta tres situaciones de otras entidades: en una alcaldía, varios computadores portátiles se prestaban sin registro y se perdieron dos; en un hospital público, los reportes financieros se entregaban tarde y con cifras que no coincidían con los registros contables; y en una personería, un funcionario afirmó que el control interno «es asunto exclusivo de la oficina de control interno».", "items": [{"id": "SG-110", "niv": 1, "e": "La pérdida de los portátiles revela una falla frente al objetivo del sistema de control interno de", "f": "Ley 87 de 1993, art. 2, lit. a", "o": [["A", "garantizar que el sistema de control interno tenga sus propios mecanismos de verificación.", "Ese objetivo (literal g) se refiere a la autoevaluación del sistema, no a la custodia de bienes.", false], ["B", "velar por procesos de planeación adecuados para el diseño y desarrollo organizacional.", "El literal h) se refiere a la planeación y al diseño organizacional; el caso muestra la falta de protección de los recursos.", false], ["C", "proteger los recursos de la organización, buscando su adecuada administración ante los riesgos.", "Es el objetivo del literal a) del artículo 2 de la Ley 87 de 1993: los bienes prestados sin registro quedan expuestos a pérdida.", true]]}, {"id": "SG-111", "niv": 2, "e": "La situación de los reportes financieros del hospital afecta, sobre todo, el objetivo de", "f": "Ley 87 de 1993, art. 2, lit. e", "o": [["A", "asegurar la oportunidad y confiabilidad de la información y de sus registros.", "El literal e) del artículo 2 de la Ley 87 de 1993 busca que la información sea oportuna y confiable; reportes tardíos que no coinciden con los registros contables la incumplen.", true], ["B", "proteger los recursos de la organización ante posibles riesgos que los afecten.", "Ese objetivo apunta a la custodia y administración de los recursos; el caso describe información tardía e inconsistente.", false], ["C", "garantizar la correcta evaluación y seguimiento de la gestión organizacional.", "Ese objetivo (literal d) se refiere a evaluar la gestión; el problema descrito es la calidad y oportunidad de la información y sus registros.", false]]}, {"id": "SG-112", "niv": 2, "e": "La afirmación del funcionario de la personería es", "f": "Ley 87 de 1993, arts. 1, 3 y 6", "o": [["A", "correcta, pero solo en las entidades territoriales, donde el jefe de control interno tiene periodo fijo.", "El periodo fijo del jefe de control interno territorial (art. 11) no cambia que el control interno sea tarea de todos los cargos.", false], ["B", "correcta, porque la ley asigna a la oficina de control interno el establecimiento y desarrollo del sistema.", "El establecimiento y desarrollo del sistema es responsabilidad del representante legal (art. 6); la oficina de control interno lo evalúa en forma independiente (art. 3, lit. d).", false], ["C", "errónea, porque el control interno hace parte de las funciones de todos los cargos.", "El artículo 1 de la Ley 87 de 1993 dispone que el ejercicio del control interno debe ser intrínseco al desarrollo de las funciones de todos los cargos de la entidad, y en particular de los que tienen responsabilidad de mando.", true]]}]}, {"comp": "sistemas_gestion", "rol": "general", "tag": "Sistemas de gestión (MIPG, control interno y calidad) · Esquema de líneas de defensa", "texto": "Usted es profesional de la Oficina de Planeación de una superintendencia. En una sesión sobre el esquema de líneas de defensa del Modelo Estándar de Control Interno se analizan tres actores: la coordinadora del grupo de contratos y su equipo, que revisan a diario que cada contrato tenga los soportes antes de su firma; la Oficina de Planeación, que consolida el mapa de riesgos, asesora a los líderes de proceso y monitorea si los controles operan; y la alta dirección con el Comité Institucional de Coordinación de Control Interno, que define la política de administración del riesgo.", "items": [{"id": "SG-122", "niv": 1, "e": "La coordinadora del grupo de contratos y su equipo actúan como", "f": "Función Pública, Manual Operativo del MIPG, versión 7 (2026), política de control interno, esquema de líneas de defensa", "o": [["A", "segunda línea de defensa, por supervisar el cumplimiento de los requisitos contractuales.", "La segunda línea supervisa y monitorea transversalmente los controles de la primera; quien revisa sus propios contratos antes de firmarlos ejecuta controles.", false], ["B", "primera línea de defensa, por ser responsables del proceso y ejecutar los controles en el día a día.", "El Manual Operativo del MIPG ubica en la primera línea a los responsables de procesos y sus equipos, que gestionan los riesgos y ejecutan los controles.", true], ["C", "tercera línea de defensa, por verificar los soportes antes de la firma.", "La tercera línea es la oficina de control interno, que da aseguramiento independiente; no ejecuta controles operativos.", false]]}, {"id": "SG-123", "niv": 2, "e": "La Oficina de Planeación, en las tareas descritas, actúa como", "f": "Función Pública, Manual Operativo del MIPG, versión 7 (2026); Función Pública, Guía para la Gestión Integral del Riesgo en Entidades Públicas, versión 7 (2025), líneas de aseguramiento", "o": [["A", "segunda línea de defensa, porque asesora, consolida y monitorea la operación de los controles.", "El Manual Operativo ubica en la segunda línea a quienes ejercen supervisión, asesoría y monitoreo transversal, como planeación y gestión de riesgos.", true], ["B", "primera línea de defensa, porque elabora el mapa de riesgos de la entidad.", "Los riesgos de cada proceso los gestionan sus responsables (primera línea); Planeación consolida, asesora y monitorea, que son funciones de segunda línea.", false], ["C", "línea estratégica, porque define los riesgos de toda la entidad.", "La línea estratégica está conformada por la alta dirección y el comité de coordinación de control interno, que definen la política de riesgos.", false]]}, {"id": "SG-124", "niv": 3, "e": "Si el jefe de control interno propone que su oficina asuma la revisión diaria de los soportes contractuales para «blindar» el proceso, debe advertírsele que", "f": "Función Pública, Manual Operativo del MIPG, versión 7 (2026); Ley 87 de 1993, art. 12, parágrafo", "o": [["A", "la revisión diaria es válida siempre que la oficina firme también cada contrato como refrendación.", "La Ley 87 de 1993 (art. 12, par.) prohíbe al jefe de control interno participar mediante autorizaciones o refrendaciones.", false], ["B", "la tercera línea evalúa con independencia y no debe asumir tareas de la primera o la segunda.", "El Manual Operativo precisa que la tercera línea proporciona aseguramiento independiente sin asumir responsabilidades de la primera o segunda línea; ejecutar controles comprometería su objetividad.", true], ["C", "la oficina solo puede revisar contratos cuando lo ordene la contraloría.", "La oficina puede evaluar la contratación en sus auditorías; lo que no debe hacer es asumir la ejecución diaria de controles.", false]]}]}, {"comp": "sistemas_gestion", "rol": "general", "tag": "Sistemas de gestión (MIPG, control interno y calidad) · No conformidad, corrección y acción correctiva", "texto": "En una auditoría interna de calidad a una dependencia de una entidad pública certificada en ISO 9001:2015, se encontró que 14 respuestas a peticiones se enviaron sin el visto bueno del coordinador que exige el procedimiento. El coordinador ordenó revisar y reenviar de inmediato esas 14 respuestas. El análisis posterior mostró que el sistema de gestión documental permitía firmar y enviar una respuesta aunque el campo del visto bueno estuviera vacío.", "items": [{"id": "SG-140", "niv": 1, "e": "El hallazgo de la auditoría constituye", "f": "ISO 9000:2015, término 3.6.9 (no conformidad); NTC ISO 9001:2015, numeral 10.2", "o": [["A", "una observación sin efectos, porque el incumplimiento no generó quejas de los usuarios.", "La no conformidad existe por el incumplimiento del requisito, aunque no haya causado quejas.", false], ["B", "una oportunidad de mejora, porque las respuestas salieron dentro del término legal.", "Cumplir el término no subsana el incumplimiento del requisito interno del visto bueno.", false], ["C", "una no conformidad, porque se incumplió un requisito del procedimiento.", "En la terminología ISO 9000, una no conformidad es el incumplimiento de un requisito; el visto bueno es un requisito establecido por la propia entidad.", true]]}, {"id": "SG-141", "niv": 2, "e": "La revisión y el reenvío inmediato de las 14 respuestas es", "f": "ISO 9000:2015, términos 3.12.2 (acción correctiva) y 3.12.3 (corrección); NTC ISO 9001:2015, numeral 10.2", "o": [["A", "una corrección, porque elimina la no conformidad detectada sin atacar su causa.", "La ISO 9000 define la corrección como la acción para eliminar una no conformidad detectada, a diferencia de la acción correctiva, que elimina su causa.", true], ["B", "una acción correctiva, porque resuelve el problema en las respuestas afectadas.", "La acción correctiva elimina la causa para evitar que se repita; reenviar las 14 respuestas no cambia el sistema que lo permitió.", false], ["C", "una acción preventiva, porque evita que los peticionarios presenten quejas.", "La acción preventiva actúa sobre no conformidades potenciales; aquí la no conformidad ya ocurrió y se está subsanando.", false]]}, {"id": "SG-142", "niv": 3, "e": "Una acción correctiva adecuada para este caso es", "f": "NTC ISO 9001:2015, numeral 10.2.1; ISO 9000:2015, término 3.12.2", "o": [["A", "ajustar el sistema para que no permita enviar respuestas sin visto bueno y verificar luego su eficacia.", "La acción correctiva debe eliminar la causa de la no conformidad para evitar que vuelva a ocurrir, y la norma exige revisar su eficacia.", true], ["B", "capacitar de nuevo al coordinador en el procedimiento, porque el error fue suyo.", "El análisis atribuyó la causa al sistema, no al desconocimiento del coordinador; capacitarlo no la elimina.", false], ["C", "sancionar a los servidores que enviaron las 14 respuestas sin visto bueno.", "Una sanción no elimina la causa identificada (el sistema permitía enviar sin visto bueno), así que el error podría repetirse.", false]]}]}, {"comp": "disciplinario", "rol": "general", "tag": "Código General Disciplinario · Dolo y culpa", "texto": "Usted es técnico de la oficina de control disciplinario interno de una empresa social del Estado y apoya la proyección de autos en tres expedientes originados en un mismo proceso de contratación. En el primero, las pruebas muestran que un profesional sabía que el oferente al que favoreció no cumplía los requisitos, sabía que favorecerlo estaba prohibido y quiso que ganara. En el segundo, una técnica omitió verificar la póliza del contratista, verificación que el manual de contratación le impone de manera expresa en todos los casos. En el tercero, la funcionaria instructora concluyó que el auxiliar investigado actuó únicamente con culpa leve.", "items": [{"id": "DI-112", "niv": 1, "e": "La conducta del profesional del primer expediente debe calificarse como", "f": "Ley 1952 de 2019, arts. 28 y 29", "o": [["A", "culposa con culpa grave, porque no tuvo el cuidado que cualquier persona del común imprime a sus actos.", "Esa es la definición de culpa grave (art. 29), que no corresponde a quien actúa sabiendo la ilicitud y queriendo el resultado (art. 28).", false], ["B", "culposa con culpa gravísima, porque violó de manera manifiesta una regla de obligatorio cumplimiento.", "La culpa supone que el sujeto no quiso el resultado. Aquí se probó conocimiento y voluntad de favorecer al oferente, que es dolo (arts. 28 y 29 de la Ley 1952 de 2019).", false], ["C", "dolosa, porque conocía los hechos constitutivos de falta y su ilicitud, y quiso su realización.", "La conducta es dolosa cuando el sujeto disciplinable conoce los hechos constitutivos de falta disciplinaria, su ilicitud y quiere su realización (Ley 1952 de 2019, art. 28). Los tres elementos están probados.", true]]}, {"id": "DI-113", "niv": 2, "e": "Para atribuir a la técnica del segundo expediente la falta a título de culpa gravísima, debe probarse que incurrió en ella por", "f": "Ley 1952 de 2019, art. 29 (modificado por la Ley 2094 de 2021, art. 4)", "o": [["A", "conocimiento de los hechos y de su ilicitud, unido a la voluntad de realizarlos.", "Esos elementos definen el dolo (art. 28 de la Ley 1952 de 2019), no una modalidad de culpa.", false], ["B", "una ignorancia o un descuido extremos en lo elemental, o una infracción evidente de reglas obligatorias.", "Hay culpa gravísima cuando se incurre en falta disciplinaria por ignorancia supina, desatención elemental o violación manifiesta de reglas de obligatorio cumplimiento (Ley 1952 de 2019, art. 29, modificado por el art. 4 de la Ley 2094 de 2021).", true], ["C", "inobservancia del cuidado necesario que cualquier persona del común imprime a sus actuaciones ordinarias.", "Esa es la definición legal de culpa grave, no de culpa gravísima (art. 29 de la Ley 1952 de 2019, modificado por la Ley 2094 de 2021).", false]]}, {"id": "DI-114", "niv": 3, "e": "Si en el tercer expediente la culpa leve es la única forma de culpabilidad demostrada, corresponde", "f": "Ley 1952 de 2019, art. 29 (modificado por la Ley 2094 de 2021, art. 4)", "o": [["A", "imponer multa reducida a la mitad, por tratarse de la forma más baja de culpabilidad.", "No existe esa rebaja. La culpa leve no da lugar a sanción alguna (art. 29 de la Ley 1952 de 2019).", false], ["B", "imponer amonestación escrita, porque esa es la sanción que la ley prevé para las faltas leves culposas.", "Confunde la levedad de la falta con la culpa leve. Las faltas leves culposas se cometen con culpa grave o gravísima; la culpa leve no es sancionable (art. 29 de la Ley 1952 de 2019).", false], ["C", "concluir que no hay lugar a sanción, porque la culpa leve no es sancionable en materia disciplinaria.", "La culpa sancionable puede ser gravísima o grave; la culpa leve no es sancionable en materia disciplinaria (Ley 1952 de 2019, art. 29, modificado por la Ley 2094 de 2021). No debe confundirse la culpa leve (grado de culpabilidad, no sancionable) con la falta leve culposa (clase de falta cometida con culpa grave o gravísima, sancionada con amonestación escrita).", true]]}]}, {"comp": "disciplinario", "rol": "general", "tag": "Código General Disciplinario · Causales de exclusión de responsabilidad", "texto": "Usted es técnico administrativo de una personería municipal y apoya el análisis de tres actuaciones. En la primera, un notificador no entregó a tiempo una citación porque un derrumbe imprevisible e irresistible cerró durante tres días la única vía hacia la vereda. En la segunda, un auxiliar trasladó un archivo de gestión a otra sede en cumplimiento de una orden escrita del secretario general, quien tenía competencia para darla. En la tercera, una técnica entregó a un tercero un documento que creyó, equivocadamente, de libre acceso; el error habría podido evitarse consultando el índice de información clasificada publicado en la intranet.", "items": [{"id": "DI-124", "niv": 1, "e": "La situación del notificador corresponde a la causal de exclusión de responsabilidad denominada", "f": "Ley 1952 de 2019, art. 31 (modificado por la Ley 2094 de 2021, art. 5)", "o": [["A", "estricto cumplimiento de un deber legal de mayor importancia.", "Esa causal supone que el servidor sacrificó un deber para cumplir otro de mayor importancia (art. 31, num. 3); aquí no hubo elección entre deberes, sino un hecho externo que le impidió actuar.", false], ["B", "fuerza mayor.", "No hay responsabilidad disciplinaria cuando la conducta se realiza por fuerza mayor (Ley 1952 de 2019, art. 31, num. 1). Un derrumbe imprevisible e irresistible que impide el acceso es un hecho de esa naturaleza.", true], ["C", "insuperable coacción ajena.", "La coacción ajena (art. 31, num. 6) supone la presión de otra persona sobre la voluntad del servidor; el derrumbe es un hecho de la naturaleza.", false]]}, {"id": "DI-125", "niv": 2, "e": "Para que la orden del secretario general excluya la responsabilidad del auxiliar, debe tratarse de una orden", "f": "Ley 1952 de 2019, art. 31, num. 4 (modificado por la Ley 2094 de 2021, art. 5)", "o": [["A", "ajustada a derecho, dada por quien tiene competencia y con las formalidades legales.", "Excluye la responsabilidad actuar en cumplimiento de orden legítima de autoridad competente emitida con las formalidades legales (Ley 1952 de 2019, art. 31, num. 4).", true], ["B", "escrita y firmada, aunque quien la emite carezca de competencia sobre el asunto.", "La forma escrita no suple la falta de competencia; la causal exige que la orden provenga de autoridad competente y sea legítima (art. 31, num. 4).", false], ["C", "de cualquier superior jerárquico, sin importar su contenido.", "La causal no ampara órdenes ilegítimas: exige legitimidad, competencia y formalidades legales (art. 31, num. 4). Además, el deber de cumplir órdenes superiores cede cuando son contrarias a la Constitución o la ley (art. 38, num. 8).", false]]}, {"id": "DI-126", "niv": 3, "e": "Si se establece que el error de la técnica fue un error de hecho vencible, la consecuencia es que", "f": "Ley 1952 de 2019, art. 31, num. 8 (modificado por la Ley 2094 de 2021, art. 5)", "o": [["A", "procede la destitución y las demás sanciones graduables se reducen a la mitad.", "Esa es la consecuencia del error de derecho vencible, no del error de hecho vencible (art. 31, num. 8, de la Ley 1952 de 2019).", false], ["B", "queda excluida de responsabilidad, porque actuó convencida de que su conducta era lícita.", "Solo la convicción errada e invencible excluye la responsabilidad. Si el error es vencible, como en el caso, la ley prevé una consecuencia distinta (art. 31, num. 8, de la Ley 1952 de 2019).", false], ["C", "su conducta se sanciona a título de culpa, siempre que la falta admita esa modalidad.", "Si el error de hecho fuere vencible, la conducta se sanciona a título de culpa, siempre que la falta admita tal modalidad (Ley 1952 de 2019, art. 31, num. 8, modificado por la Ley 2094 de 2021).", true]]}]}, {"comp": "disciplinario", "rol": "profesional", "tag": "Código General Disciplinario · Niveles profesional, asesor y ejecutivo · Separación entre instrucción y juzgamiento y competencia", "texto": "Usted es profesional universitario de una procuraduría provincial de instrucción. Tiene a cargo una investigación contra un servidor de la secretaría de hacienda de un municipio que no es capital de departamento. Además, la personería de otro municipio de la circunscripción informa que, por tener un solo funcionario con funciones disciplinarias, no puede garantizar que quien instruye un proceso sea distinto de quien lo juzga. Por último, llega una queja contra el alcalde de un municipio que tampoco es capital, por hechos de su gestión.", "items": [{"id": "DI-140", "niv": 1, "e": "La garantía que impide que su despacho, como instructor, adelante también el juzgamiento del servidor de hacienda es", "f": "Ley 1952 de 2019, arts. 12 (modificado por la Ley 2094 de 2021, art. 3) y 16", "o": [["A", "la cosa juzgada, que impide que un mismo funcionario se pronuncie dos veces sobre el mismo hecho.", "La cosa juzgada (art. 16) impide nuevo proceso por un hecho ya decidido con fallo ejecutoriado; no regula la separación de funciones dentro de un mismo proceso.", false], ["B", "el debido proceso, que exige que el funcionario instructor no sea el mismo que adelante el juzgamiento.", "Según el artículo 12 de la Ley 1952 de 2019, modificado por la Ley 2094 de 2021, el disciplinable debe ser investigado y luego juzgado por funcionario diferente, y debe garantizarse que el instructor no sea el mismo que adelante el juzgamiento.", true], ["C", "la doble conformidad, según la cual todo fallo sancionatorio debe ser revisado por autoridad diferente.", "La doble conformidad se refiere a la revisión del fallo sancionatorio por otra autoridad (art. 12, inciso 3), no a la separación entre quien instruye y quien juzga.", false]]}, {"id": "DI-141", "niv": 2, "e": "En el proceso contra el servidor de hacienda, la competencia de la procuraduría provincial de instrucción se extiende", "f": "Decreto Ley 262 de 2000, arts. 76 y 76A (modificados por el Decreto Ley 1851 de 2021); Ley 1952 de 2019, art. 225A", "o": [["A", "hasta que quede notificado el pliego de cargos o, en su caso, la decisión de archivo.", "Las procuradurías provinciales y distritales de instrucción conocen de las actuaciones disciplinarias contra servidores del orden municipal hasta la notificación del pliego de cargos o de la decisión de archivo (Decreto Ley 262 de 2000, art. 76, modificado por el Decreto Ley 1851 de 2021).", true], ["B", "hasta el fallo de primera instancia, cuando el juzgamiento se adelante por el juicio verbal.", "El juicio verbal también corresponde al funcionario de juzgamiento (art. 225A de la Ley 1952 de 2019); la instrucción termina con el pliego o el archivo.", false], ["C", "hasta la ejecutoria del fallo, porque la provincial de juzgamiento solo conoce de los recursos.", "La procuraduría provincial de juzgamiento conoce de la etapa de juzgamiento, no solo de recursos (Decreto Ley 262 de 2000, art. 76A).", false]]}, {"id": "DI-142", "niv": 3, "e": "La etapa de juzgamiento de los procesos de la personería que no puede garantizar la separación entre instrucción y juzgamiento corresponde a", "f": "Ley 1952 de 2019, art. 92 (modificado por la Ley 2094 de 2021, art. 13); Decreto Ley 262 de 2000, art. 76A", "o": [["A", "un personero ad hoc que designe el concejo municipal para cada proceso.", "La ley no prevé esa designación; dispone que, si no se satisfacen esas garantías, el asunto pasa a la Procuraduría (art. 92 de la Ley 1952 de 2019).", false], ["B", "la procuraduría provincial de juzgamiento de la circunscripción.", "El artículo 92 de la Ley 1952 de 2019 (modificado por la Ley 2094 de 2021) dispone que, si las personerías no pueden satisfacer las garantías de instrucción y juzgamiento, el asunto pasa a la Procuraduría según la calidad del disciplinable; y el artículo 76A, numeral 2, del Decreto Ley 262 de 2000 (adicionado por el Decreto Ley 1851 de 2021) concreta que la etapa de juzgamiento de esos procesos la conocen las procuradurías provinciales y distritales de juzgamiento.", true], ["C", "el alcalde municipal, como nominador de los servidores investigados por la personería.", "El nominador ejecuta sanciones (art. 236), pero no tiene competencia para juzgar; la competencia pasa a la Procuraduría (art. 92).", false]]}, {"id": "DI-143", "niv": 2, "e": "La queja contra el alcalde municipal debe ser tramitada por", "f": "Ley 1952 de 2019, arts. 2 y 92 (modificados por la Ley 2094 de 2021, arts. 1 y 13)", "o": [["A", "la personería municipal, en ejercicio de su poder preferente frente a la administración.", "El poder preferente de la personería no alcanza a los servidores de elección popular, cuyo conocimiento es privativo de la Procuraduría (art. 2 de la Ley 1952 de 2019).", false], ["B", "la oficina de control disciplinario interno de la alcaldía.", "El alcalde es servidor de elección popular; la competencia para investigarlo y juzgarlo es de la Procuraduría (arts. 2 y 92 de la Ley 1952 de 2019).", false], ["C", "la Procuraduría General de la Nación, por ser un servidor de elección popular.", "La Procuraduría conoce de la investigación y el juzgamiento de las faltas de los servidores públicos de elección popular, y esa competencia es privativa (Ley 1952 de 2019, arts. 2 y 92, modificados por la Ley 2094 de 2021). Tratándose de un alcalde de municipio que no es capital, la instrucción corresponde a la procuraduría provincial de instrucción (Decreto Ley 262 de 2000, art. 76, num. 1, lit. a).", true]]}]}, {"comp": "disciplinario", "rol": "general", "tag": "Código General Disciplinario · Impedimentos y recusaciones", "texto": "Usted es el procurador provincial de juzgamiento de una circunscripción. Al recibir un expediente nuevo, advierte que el disciplinado es su primo hermano. En otro proceso, el defensor de una investigada presentó un escrito en el que lo recusa a usted con el argumento de que tiene enemistad grave con su cliente, y adjuntó las pruebas en que se funda. Su asistente le pregunta cómo debe tramitarse cada situación y qué pasa con los términos de los procesos.", "items": [{"id": "DI-144", "niv": 2, "e": "Frente al expediente en el que el disciplinado es su primo hermano, usted debe", "f": "Ley 1952 de 2019, arts. 104 y 105", "o": [["A", "declararse impedido de inmediato, por ser pariente en cuarto grado de consanguinidad de un sujeto procesal.", "Es causal ser pariente dentro del cuarto grado de consanguinidad de cualquiera de los sujetos procesales (art. 104, num. 3), y quien la advierte debe declararse inmediatamente impedido por escrito (Ley 1952 de 2019, art. 105). Los primos hermanos son parientes en cuarto grado.", true], ["B", "seguir conociendo, porque el parentesco solo es causal hasta el segundo grado de consanguinidad.", "La causal comprende a los parientes dentro del cuarto grado de consanguinidad (art. 104, num. 3, de la Ley 1952 de 2019); los primos hermanos están en ese grado.", false], ["C", "seguir conociendo hasta que algún sujeto procesal formule recusación en su contra.", "El impedimento debe declararse de oficio e inmediatamente, una vez advertida la causal, sin esperar recusación (art. 105 de la Ley 1952 de 2019).", false]]}, {"id": "DI-145", "niv": 2, "e": "Ante la recusación por enemistad grave, el trámite indica que usted debe", "f": "Ley 1952 de 2019, arts. 106 y 107", "o": [["A", "manifestar si acepta o no la causal dentro de los dos días siguientes a su formulación.", "En la recusación, el servidor manifiesta si acepta o no la causal dentro de los dos días siguientes a su formulación; vencido ese término, se envía al superior, que decide de plano dentro de los tres días siguientes a su recibo (Ley 1952 de 2019, art. 107).", true], ["B", "remitir de inmediato el expediente a la Sala Disciplinaria, que debe decidir en diez días.", "Primero el recusado manifiesta, en dos días, si acepta la causal; luego decide el superior en tres días (art. 107 de la Ley 1952 de 2019).", false], ["C", "resolver usted mismo la recusación mediante auto, contra el cual procede el recurso de reposición.", "El recusado no decide su propia recusación; si no la acepta, la decide el superior (art. 107 de la Ley 1952 de 2019).", false]]}, {"id": "DI-146", "niv": 2, "e": "Mientras se deciden el impedimento y la recusación, las actuaciones disciplinarias respectivas", "f": "Ley 1952 de 2019, art. 107", "o": [["A", "continúan, pero las pruebas que se practiquen mientras tanto deberán repetirse luego.", "No se prevé continuar con repetición posterior de pruebas: la actuación se suspende hasta la decisión (art. 107 de la Ley 1952 de 2019).", false], ["B", "continúan su curso normal y solo se suspende el término para proferir el fallo.", "La ley suspende toda la actuación, no solo el término para fallar (art. 107 de la Ley 1952 de 2019).", false], ["C", "se suspenden desde que se manifiesta el impedimento o se presenta la recusación, hasta que se decida.", "La actuación disciplinaria se suspende desde que se manifiesta el impedimento o se presenta la recusación y hasta cuando se decida (Ley 1952 de 2019, art. 107, inciso final).", true]]}]}, {"comp": "disciplinario", "rol": "general", "tag": "Código General Disciplinario · Juicio ordinario y juicio verbal", "texto": "Usted es profesional universitario de una procuraduría provincial de juzgamiento y recibe tres expedientes con el pliego de cargos ya notificado. En el primero, un agente de tránsito fue sorprendido por la policía en el momento en que recibía dinero de un conductor. En el segundo, los cargos se formularon por una falta calificada como leve. En el tercero, hay once disciplinados, veinte cargos y miles de folios de pruebas, y la falta imputada está entre las que la ley asigna al juicio verbal; además, el despacho tiene solo dos sustanciadores.", "items": [{"id": "DI-162", "niv": 1, "e": "En el primer expediente, el juzgamiento debe adelantarse por el juicio verbal porque", "f": "Ley 1952 de 2019, art. 225A (adicionado por la Ley 2094 de 2021, art. 40)", "o": [["A", "las faltas de los agentes de tránsito se tramitan siempre por juicio verbal, sin excepción.", "El código no fija el juicio verbal por la clase de servidor, sino por la flagrancia, la levedad o ciertas faltas gravísimas (art. 225A de la Ley 1952 de 2019).", false], ["B", "el disciplinable fue sorprendido en el momento de la comisión de la falta.", "El juicio verbal se adelanta cuando el sujeto disciplinable es sorprendido en el momento de la comisión de la falta o con elementos, efectos o instrumentos que provengan de la ejecución de la conducta (Ley 1952 de 2019, art. 225A).", true], ["C", "el disciplinado no presentó alegatos precalificatorios durante la etapa de instrucción.", "No presentar alegatos no es criterio para elegir el juicio; los criterios están en el artículo 225A de la Ley 1952 de 2019.", false]]}, {"id": "DI-163", "niv": 3, "e": "En el segundo expediente, por tratarse de una falta leve, el juzgamiento", "f": "Ley 1952 de 2019, arts. 68 y 225A", "o": [["A", "se adelanta por el juicio ordinario, que es la regla para las faltas leves y graves.", "El artículo 225A asigna expresamente las faltas leves al juicio verbal.", false], ["B", "no procede, porque las faltas leves se corrigen con medidas del jefe inmediato.", "Las medidas correctivas del jefe inmediato (art. 68) son para hechos que no afectan sustancialmente los deberes; una falta leve con pliego notificado se juzga, en principio, por juicio verbal (art. 225A).", false], ["C", "se adelanta por el juicio verbal, salvo que la complejidad del asunto justifique motivadamente el ordinario.", "El juicio verbal se sigue también por las faltas leves, salvo que la complejidad, el número de disciplinables o de cargos, o la carencia de recursos dificulten la celeridad y la eficacia, caso en el cual el funcionario motiva su decisión (Ley 1952 de 2019, art. 225A y parágrafo).", true]]}, {"id": "DI-164", "niv": 3, "e": "En el tercer expediente, el funcionario de juzgamiento", "f": "Ley 1952 de 2019, arts. 214 y 225A (adicionado por la Ley 2094 de 2021, art. 40)", "o": [["A", "debe adelantar el juicio verbal, porque la falta imputada está entre las que la ley asigna a ese trámite.", "El parágrafo del artículo 225A permite apartarse del verbal por la complejidad, el número de disciplinables o de cargos, o la carencia de recursos, motivando la decisión.", false], ["B", "puede adelantar el juicio ordinario por la complejidad del asunto, motivando su decisión.", "Aun en los eventos del juicio verbal, el funcionario adelanta el ordinario cuando la complejidad, el número de disciplinables, el número de cargos o la carencia de recursos dificulten la celeridad, eficacia y economía; debe motivar su decisión y contra ella no procede recurso (Ley 1952 de 2019, art. 225A).", true], ["C", "debe devolver el expediente al instructor para que divida el proceso según el número de disciplinados.", "La ley no prevé esa devolución; la complejidad se atiende eligiendo el juicio ordinario (art. 225A). La ruptura de la unidad procesal procede en los casos taxativos del artículo 214.", false]]}]}, {"comp": "disciplinario", "rol": "general", "tag": "Código General Disciplinario · Recurso de apelación y segunda instancia", "texto": "Usted es profesional universitario del despacho que conoce en segunda instancia de los procesos de una procuraduría provincial de juzgamiento. Llega una apelación interpuesta únicamente por un disciplinado contra el fallo que lo sancionó con suspensión de cuatro meses; el apelante solo discute la valoración de un testimonio. Llega también la apelación de una investigada contra la decisión que, en la etapa de juicio, le negó parte de las pruebas que había pedido; las demás pruebas que solicitó sí se decretaron.", "items": [{"id": "DI-184", "niv": 1, "e": "Al resolver la apelación del disciplinado sancionado con suspensión, la segunda instancia", "f": "Ley 1952 de 2019, arts. 135 y 234", "o": [["A", "no puede agravar la sanción impuesta, porque el disciplinado es apelante único.", "El superior, al resolver la apelación contra el fallo sancionatorio, no puede agravar la sanción cuando el investigado sea apelante único: prohibición de la reformatio in pejus (Ley 1952 de 2019, art. 135).", true], ["B", "debe revisar integralmente el fallo, incluso en lo no impugnado, y puede modificar la sanción en cualquier sentido.", "La apelación solo da competencia sobre lo impugnado y lo inescindiblemente vinculado (art. 234), y no permite agravar la sanción del apelante único (art. 135).", false], ["C", "puede aumentar la sanción si encuentra que la falta era más grave que la calificada.", "Cuando el investigado es apelante único, el superior no puede agravar la sanción impuesta (art. 135 de la Ley 1952 de 2019).", false]]}, {"id": "DI-185", "niv": 2, "e": "Sobre el trámite de esa segunda instancia, es correcto afirmar que el despacho debe decidir", "f": "Ley 1952 de 2019, arts. 225F y 234", "o": [["A", "por escrito, en un plazo de cuarenta y cinco días desde que recibe el expediente, limitándose a lo apelado y a lo inseparable de ello.", "El funcionario de segunda instancia decide por escrito dentro de los cuarenta y cinco días siguientes a la fecha en que recibió el proceso, y la apelación le da competencia solo sobre los aspectos impugnados y los inescindiblemente vinculados (Ley 1952 de 2019, art. 234).", true], ["B", "en audiencia pública, dentro de los diez días siguientes al recibo, sobre la totalidad de lo actuado en el proceso.", "La segunda instancia se decide por escrito en cuarenta y cinco días y se limita a lo impugnado y lo inescindiblemente vinculado (art. 234).", false], ["C", "dentro de los treinta días hábiles siguientes al recibo, sobre los aspectos que la segunda instancia estime relevantes.", "Treinta días hábiles es el término para fallar en primera instancia en el juicio ordinario (art. 225F); en segunda instancia son cuarenta y cinco días y la competencia está limitada (art. 234).", false]]}, {"id": "DI-186", "niv": 3, "e": "La apelación contra la decisión que negó parcialmente las pruebas pedidas por la investigada se concede en el efecto", "f": "Ley 1952 de 2019, art. 134", "o": [["A", "suspensivo.", "El efecto suspensivo se reserva para la apelación del archivo, del fallo de primera instancia y de la negación total de pruebas cuando no se decretaron de oficio (art. 134 de la Ley 1952 de 2019).", false], ["B", "diferido.", "El Código General Disciplinario no prevé el efecto diferido; distingue solo entre suspensivo y devolutivo (art. 134 de la Ley 1952 de 2019).", false], ["C", "devolutivo.", "Cuando la negación de pruebas pedidas por el disciplinado es parcial, o se niegan todas pero se decretan pruebas de oficio, la apelación se concede en el efecto devolutivo (Ley 1952 de 2019, art. 134, inciso 3).", true]]}]}, {"comp": "contratacion", "rol": "general", "tag": "Contratación estatal · Principios: planeación, transparencia y responsabilidad", "texto": "Usted es profesional de la Secretaría de Infraestructura de una alcaldía municipal. El secretario quiere abrir este mes una licitación pública para construir un puente peatonal; como aún no hay estudios ni diseños, propone que el futuro contratista se encargue del diseño y de la construcción. En el borrador del pliego, la oficina jurídica incluyó una cláusula según la cual el contratista renuncia a cualquier reclamación por errores en los planos topográficos que la propia alcaldía elaboró y le entregará. Además, un concejal recuerda que, en una licitación anterior, varios criterios de evaluación quedaron redactados de forma tan ambigua que el comité terminó decidiendo con apreciaciones subjetivas.", "items": [{"id": "CE-101", "niv": 2, "e": "Sobre la propuesta de abrir la licitación sin estudios ni diseños, lo correcto es advertir que", "f": "Ley 80 de 1993, art. 25, num. 12 (modificado por la Ley 1474 de 2011, art. 87)", "o": [["A", "es viable, porque cuando el contrato incluye diseño y construcción los estudios quedan a cargo del contratista seleccionado.", "La misma norma dispone expresamente que la exigencia de estudios y diseños previos se aplica también a los contratos que incluyen el diseño dentro de su objeto.", false], ["B", "previo a la apertura debe contar con estudios y diseños que establezcan la viabilidad del proyecto, aunque el objeto incluya el diseño.", "El numeral 12 del artículo 25 de la Ley 80, modificado por el artículo 87 de la Ley 1474 de 2011, exige que, cuando el objeto incluya una obra, la entidad cuente antes de la apertura con los estudios y diseños que permitan establecer la viabilidad del proyecto y su impacto social, económico y ambiental, y aclara que la regla aplica incluso a los contratos que incluyen el diseño.", true], ["C", "basta con que los estudios y diseños estén terminados antes de firmar el acta de inicio, pues la viabilidad se verifica durante la ejecución.", "El momento que fija la ley es anterior a la apertura del proceso de selección, no el inicio de la ejecución; abrir sin esos estudios desconoce el principio de planeación (art. 25, num. 12, Ley 80).", false]]}, {"id": "CE-102", "niv": 3, "e": "La cláusula de renuncia a reclamaciones por errores en los planos que entregue la alcaldía", "f": "Ley 80 de 1993, art. 24, num. 5, lit. d) e inciso final; Ley 1150 de 2007, art. 4", "o": [["A", "es válida si el proponente la acepta de manera expresa al presentar su oferta, porque se trata de una renuncia voluntaria.", "La ineficacia opera de pleno derecho por mandato del artículo 24 de la Ley 80; la aceptación del proponente no sanea una estipulación que la ley excluye.", false], ["B", "es ineficaz de pleno derecho, porque el pliego no puede eximir a la entidad por los datos que suministra ni imponer renuncias a reclamarlos.", "El literal d) del numeral 5 del artículo 24 de la Ley 80 prohíbe incluir en los pliegos exenciones de la responsabilidad derivada de los datos, informes y documentos que se suministren, y el inciso final declara ineficaces de pleno derecho las estipulaciones que lo contravengan o que dispongan renuncias a reclamaciones por esos hechos.", true], ["C", "es válida, porque traslada al contratista un riesgo previsible que debe asumir en el contrato de obra según la matriz de riesgos del pliego.", "La asignación de riesgos previsibles (art. 4 de la Ley 1150) no autoriza a la entidad a exonerarse de responder por la información que ella misma entrega; esa exoneración está prohibida por el artículo 24, numeral 5, literal d), de la Ley 80.", false]]}, {"id": "CE-103", "niv": 1, "e": "Frente a la licitación anterior con criterios ambiguos, el principio de responsabilidad implica que", "f": "Ley 80 de 1993, art. 26, num. 3; Decreto 1082 de 2015, art. 2.2.1.1.2.2.3", "o": [["A", "la entidad y sus servidores responden cuando los pliegos se elaboran de forma ambigua o confusa y conducen a decisiones subjetivas.", "El numeral 3 del artículo 26 de la Ley 80 dispone que las entidades y los servidores públicos responden cuando los pliegos se elaboran en forma incompleta, ambigua o confusa que conduzca a interpretaciones o decisiones de carácter subjetivo.", true], ["B", "la responsabilidad recae en el comité evaluador y no en la entidad, porque fue el comité el que calificó las ofertas con esos criterios.", "El artículo 26, numeral 3, de la Ley 80 atribuye la responsabilidad a la entidad y a los servidores por pliegos ambiguos; además, el carácter asesor del comité no lo exime de su propia responsabilidad (Decreto 1082 de 2015, art. 2.2.1.1.2.2.3), pero tampoco traslada a él la de la entidad.", false], ["C", "los servidores únicamente responden si el contrato adjudicado termina en incumplimiento del contratista.", "La responsabilidad que prevé el artículo 26, numeral 3, de la Ley 80 surge de haber elaborado pliegos ambiguos que llevan a decisiones subjetivas, con independencia de cómo se ejecute luego el contrato.", false]]}]}, {"comp": "contratacion", "rol": "general", "tag": "Contratación estatal · Competencia y delegación para contratar", "texto": "El gobernador de un departamento expidió un decreto por el cual delega en el secretario general, empleo del nivel directivo, la competencia para celebrar los contratos de la gobernación hasta cierta cuantía. Ahora quiere delegar también en un profesional universitario de la Secretaría General la firma de los contratos de prestación de servicios, para descongestionar el despacho. Paralelamente, la gobernación tiene en ejecución un contrato de obra adjudicado a una unión temporal de tres sociedades, que en su oferta señalaron los términos y la extensión de la participación de cada una. Usted es profesional de la oficina jurídica y debe absolver las consultas del despacho.", "items": [{"id": "CE-104", "niv": 1, "e": "Sobre la intención de delegar la celebración de contratos en un profesional universitario, usted debe conceptuar que", "f": "Ley 80 de 1993, art. 12", "o": [["A", "es posible, porque el gobernador puede delegar en cualquier servidor de la planta de personal mediante un decreto debidamente motivado.", "El artículo 12 de la Ley 80 limita los posibles delegatarios a los servidores de los niveles directivo o ejecutivo o sus equivalentes; no basta con que sea un servidor de planta.", false], ["B", "es posible, siempre que el profesional tenga título de abogado y experiencia en contratación estatal.", "La ley no condiciona la delegación a la formación del servidor sino al nivel del empleo (directivo o ejecutivo o equivalentes), según el artículo 12 de la Ley 80.", false], ["C", "no es posible, porque la delegación procede en servidores de los niveles directivo o ejecutivo o sus equivalentes.", "El artículo 12 de la Ley 80 permite a los jefes y representantes legales delegar total o parcialmente la competencia para celebrar contratos en los servidores que desempeñen cargos del nivel directivo o ejecutivo o sus equivalentes; un profesional universitario no pertenece a esos niveles.", true]]}, {"id": "CE-105", "niv": 2, "e": "Si un contrato celebrado por el secretario general como delegatario presenta irregularidades, frente al gobernador es correcto afirmar que", "f": "Ley 80 de 1993, art. 12, inc. 2 (adicionado por la Ley 1150 de 2007, art. 21)", "o": [["A", "debe ratificar por escrito cada contrato firmado por el delegatario para que el contrato pueda producir efectos jurídicos.", "Ninguna norma exige la ratificación del delegante; el contrato celebrado por el delegatario dentro de la delegación produce efectos por sí mismo. Lo que subsiste es el deber de control y vigilancia.", false], ["B", "la delegación no lo exonera de sus deberes de control y vigilancia de la actividad precontractual y contractual.", "El inciso 2 del artículo 12 de la Ley 80, adicionado por el artículo 21 de la Ley 1150 de 2007, dispone que en ningún caso los jefes y representantes legales quedan exonerados, por virtud de la delegación, de sus deberes de control y vigilancia de la actividad precontractual y contractual.", true], ["C", "queda exento de toda responsabilidad, porque con la delegación la competencia pasó por completo al delegatario.", "Aunque la competencia se traslada al delegatario, la ley mantiene en cabeza del delegante los deberes de control y vigilancia (art. 12, inc. 2, Ley 80).", false]]}, {"id": "CE-106", "niv": 2, "e": "Si la unión temporal incumple el contrato de obra, las sanciones derivadas del incumplimiento", "f": "Ley 80 de 1993, art. 7, nums. 6 y 7 (modificado por la Ley 2160 de 2021, art. 3)", "o": [["A", "se impondrán por igual a todos los integrantes, porque en la unión temporal las omisiones de uno afectan a todos los demás.", "Esa regla corresponde al consorcio, en el que las actuaciones, hechos y omisiones afectan a todos sus miembros; en la unión temporal las sanciones se individualizan según la participación (art. 7, Ley 80).", false], ["B", "recaerán sobre el representante designado por la unión temporal, que responde en nombre de todos.", "El representante actúa por la unión temporal, pero la ley ordena imponer las sanciones de acuerdo con la participación de cada integrante en la ejecución (art. 7, Ley 80).", false], ["C", "se impondrán a cada integrante según su participación en la ejecución, aunque todos respondan solidariamente.", "El artículo 7 de la Ley 80 (modificado por la Ley 2160 de 2021) define la unión temporal: sus miembros responden solidariamente por el cumplimiento total de la propuesta y del objeto, pero las sanciones por incumplimiento se imponen según la participación en la ejecución de cada uno.", true]]}]}, {"comp": "contratacion", "rol": "general", "tag": "Contratación estatal · Prestación de servicios profesionales", "texto": "Una alcaldía municipal necesita un abogado que la represente judicialmente en procesos laborales durante seis meses, pues su planta de personal no tiene empleos con esa función. El jefe de la oficina jurídica le pregunta a usted, profesional de contratación, si es necesario pedir tres cotizaciones antes de escoger al abogado, si debe expedirse un acto administrativo de justificación de la contratación directa y si, al vencer el plazo, el contrato debe liquidarse obligatoriamente.", "items": [{"id": "CE-119", "niv": 1, "e": "Para escoger al abogado, la alcaldía", "f": "Ley 1150 de 2007, art. 2, num. 4, lit. h); Decreto 1082 de 2015, art. 2.2.1.2.1.4.9", "o": [["A", "puede contratar directamente a quien acredite la idoneidad o experiencia requerida, sin pedir varias ofertas.", "El literal h) del numeral 4 del artículo 2 de la Ley 1150 prevé la contratación directa para servicios profesionales, y el artículo 2.2.1.2.1.4.9 del Decreto 1082 de 2015 dispone que no es necesario obtener previamente varias ofertas, siempre que se verifique la idoneidad o experiencia; el ordenador del gasto deja constancia escrita.", true], ["B", "debe adelantar un concurso de méritos, porque el objeto exige conocimientos jurídicos especializados.", "El concurso de méritos es para consultoría; los servicios profesionales son de naturaleza intelectual distinta de la consultoría y se contratan directamente (Decreto 1082, art. 2.2.1.2.1.4.9).", false], ["C", "debe solicitar al menos tres cotizaciones y escoger la de menor valor, por tratarse de contratación directa.", "El artículo 2.2.1.2.1.4.9 del Decreto 1082 de 2015 dispone expresamente que en estos contratos no es necesario haber obtenido previamente varias ofertas.", false]]}, {"id": "CE-120", "niv": 3, "e": "Para contratar al abogado, el acto administrativo de justificación de la contratación directa", "f": "Decreto 1082 de 2015, arts. 2.2.1.2.1.4.1 y 2.2.1.2.1.4.2; Ley 80 de 1993, art. 25, num. 12", "o": [["A", "no es necesario cuando el contrato es de prestación de servicios profesionales y de apoyo a la gestión.", "El artículo 2.2.1.2.1.4.1 del Decreto 1082 de 2015 regula el acto de justificación de la contratación directa y aclara que no es necesario cuando el contrato es de prestación de servicios profesionales y de apoyo a la gestión.", true], ["B", "es obligatorio en este caso y debe indicar la causal, el objeto, el presupuesto y el lugar donde se consultan los estudios previos.", "Ese es el contenido del acto en las demás causales de contratación directa, pero la misma norma lo exceptúa para los contratos de prestación de servicios profesionales y de apoyo a la gestión (Decreto 1082, art. 2.2.1.2.1.4.1).", false], ["C", "reemplaza los estudios previos, que en esta causal no deben elaborarse.", "Los estudios previos se exigen antes de la firma en la contratación directa (art. 25, num. 12, Ley 80); la excepción de no elaborarlos es propia de la urgencia manifiesta (Decreto 1082, art. 2.2.1.2.1.4.2).", false]]}, {"id": "CE-121", "niv": 2, "e": "En cuanto a la liquidación del contrato del abogado, la ley dispone que", "f": "Ley 80 de 1993, art. 60 (modificado por el Decreto Ley 019 de 2012, art. 217); Colombia Compra Eficiente, Guía para la liquidación de los Procesos de Contratación", "o": [["A", "procede únicamente si el contratista la solicita por escrito antes de terminar el plazo.", "La ley no supedita la liquidación a una solicitud del contratista; simplemente dispone que en estos contratos no es obligatoria (art. 60, Ley 80).", false], ["B", "debe hacerse dentro de los cuatro meses siguientes al vencimiento del plazo, como en todo contrato de tracto sucesivo.", "El término de cuatro meses del artículo 11 de la Ley 1150 se aplica a los contratos que deben liquidarse; para estos contratos la liquidación no es obligatoria (art. 60, Ley 80).", false], ["C", "no es obligatoria en los contratos de prestación de servicios profesionales y de apoyo a la gestión.", "El artículo 60 de la Ley 80, modificado por el artículo 217 del Decreto Ley 019 de 2012, señala que la liquidación no será obligatoria en los contratos de prestación de servicios profesionales y de apoyo a la gestión; así lo recoge la Guía de liquidación de Colombia Compra Eficiente.", true]]}]}, {"comp": "contratacion", "rol": "profesional", "tag": "Contratación estatal · Niveles profesional, asesor y ejecutivo · Requisitos habilitantes, factores de ponderación y subsanación", "texto": "Usted integra el comité evaluador de una licitación pública de obra de un departamento. Al revisar las ofertas encuentra que un proponente no adjuntó la copia del documento de identidad de su representante legal; otro no entregó la garantía de seriedad con su propuesta; y un tercero, dentro del término para subsanar, aporta una certificación de experiencia de un contrato que terminó dos semanas después del cierre del proceso. Además, un miembro del comité sugiere otorgar puntos adicionales al proponente que tenga más contratos ejecutados.", "items": [{"id": "CE-135", "niv": 2, "e": "Frente al proponente que no adjuntó la copia del documento de identidad de su representante legal, el comité debe", "f": "Ley 1150 de 2007, art. 5, par. 1 (modificado por la Ley 1882 de 2018, art. 5)", "o": [["A", "solicitarle el documento, que podrá entregar en cualquier momento antes de la firma del contrato.", "La ley fija un límite: el término de traslado del informe de evaluación; si no se entrega en ese plazo, la oferta se rechaza (art. 5, par. 1, Ley 1150).", false], ["B", "solicitarle el documento, que podrá entregar hasta el término de traslado del informe de evaluación.", "El parágrafo 1 del artículo 5 de la Ley 1150, modificado por el artículo 5 de la Ley 1882 de 2018, ordena solicitar los requisitos que no afectan la asignación de puntaje, los cuales pueden entregarse hasta el término de traslado del informe de evaluación; la falta de documentos no necesarios para comparar las ofertas no justifica su rechazo. Las reglas especiales para la mínima cuantía y la subasta no aplican aquí.", true], ["C", "recomendar el rechazo inmediato de la oferta, porque el documento debía entregarse junto con la propuesta.", "La ausencia de documentos que no son necesarios para comparar las propuestas no es título suficiente para rechazarlas (art. 5, par. 1, Ley 1150).", false]]}, {"id": "CE-136", "niv": 1, "e": "Respecto del proponente que no entregó la garantía de seriedad con su propuesta, procede", "f": "Ley 1150 de 2007, art. 5, par. 3 (adicionado por la Ley 1882 de 2018, art. 5)", "o": [["A", "habilitarlo, porque la garantía de seriedad se exige al adjudicatario antes de firmar el contrato.", "La garantía de seriedad ampara los ofrecimientos y debe acompañar la oferta desde su presentación (art. 7, Ley 1150; Decreto 1082 de 2015, art. 2.2.1.2.3.1.9).", false], ["B", "rechazar la oferta, porque esa omisión no es subsanable.", "El parágrafo 3 del artículo 5 de la Ley 1150, adicionado por el artículo 5 de la Ley 1882 de 2018, dispone que la no entrega de la garantía de seriedad junto con la propuesta no es subsanable y es causal de rechazo.", true], ["C", "requerirlo para que la aporte dentro del término de traslado del informe de evaluación.", "La regla general de subsanación no aplica a la garantía de seriedad no entregada con la oferta, que la ley califica expresamente como no subsanable (art. 5, par. 3, Ley 1150).", false]]}, {"id": "CE-137", "niv": 3, "e": "La certificación de experiencia de un contrato terminado después del cierre", "f": "Ley 1150 de 2007, art. 5, par. 1, inc. 2 y par. 5 (Ley 1882 de 2018, art. 5)", "o": [["A", "debe aceptarse si quien certifica el contrato es una entidad pública y no un particular.", "La naturaleza del contratante es irrelevante; de hecho, la ley obliga a aceptar la experiencia adquirida con particulares (art. 5, par. 5, Ley 1150). El problema es que el hecho ocurrió después del cierre.", false], ["B", "debe aceptarse, porque la experiencia es un requisito habilitante que puede subsanarse hasta el traslado del informe.", "Aunque la experiencia es subsanable, lo que se subsana es la prueba de hechos existentes al cierre; la ley prohíbe acreditar circunstancias posteriores (art. 5, par. 1, inc. 2, Ley 1150).", false], ["C", "no puede tenerse en cuenta, porque al subsanar no se pueden acreditar circunstancias ocurridas después del cierre.", "El inciso 2 del parágrafo 1 del artículo 5 de la Ley 1150, modificado por la Ley 1882 de 2018, dispone que durante el término para subsanar los proponentes no pueden acreditar circunstancias ocurridas con posterioridad al cierre del proceso.", true]]}, {"id": "CE-138", "niv": 2, "e": "Sobre la sugerencia de otorgar puntos al proponente con más contratos ejecutados, lo correcto es que", "f": "Ley 1150 de 2007, art. 5, nums. 1, 2 y 4", "o": [["A", "no procede, porque en la licitación la experiencia del proponente es un requisito habilitante que no otorga puntaje.", "El numeral 1 del artículo 5 de la Ley 1150 dispone que la experiencia, la capacidad jurídica, financiera y de organización son requisitos habilitantes que se verifican y no otorgan puntaje, salvo en la selección de consultores (num. 4).", true], ["B", "procede, siempre que el puntaje por experiencia no supere el puntaje que el pliego asigna al precio.", "La ley no permite asignar puntaje a la experiencia del proponente en la licitación, cualquiera que sea su peso frente al precio (art. 5, num. 1, Ley 1150).", false], ["C", "procede, porque la experiencia mide la calidad de la oferta y puede ponderarse junto con el precio.", "En la licitación de obra la experiencia es habilitante; la ponderación de calidad y precio recae sobre los factores técnicos y económicos de la oferta (art. 5, nums. 1 y 2, Ley 1150).", false]]}]}, {"comp": "contratacion", "rol": "general", "tag": "Contratación estatal · Multas, cláusula penal y caducidad", "texto": "Usted es profesional de la oficina jurídica de una alcaldía. En un contrato de obra con multas y cláusula penal pactadas, el supervisor informó atrasos reiterados; el contratista terminó entregando la obra a satisfacción con tres meses de retraso y el plazo contractual ya venció. Aun así, el secretario de Infraestructura quiere imponerle ahora multas por el retraso. En otro contrato de obra, el contratista abandonó los trabajos, lo que afecta de manera grave y directa la ejecución y evidencia que puede conducir a su paralización.", "items": [{"id": "CE-161", "niv": 3, "e": "Sobre la intención de imponer multas al contratista que ya entregó la obra y cuyo plazo venció, lo correcto es que", "f": "Ley 1150 de 2007, art. 17", "o": [["A", "procede, porque las multas pactadas pueden imponerse en cualquier momento antes de la liquidación del contrato.", "La ley limita la imposición de multas al tiempo en que está pendiente la ejecución de las obligaciones (art. 17, Ley 1150), no hasta la liquidación.", false], ["B", "no es posible, porque las multas buscan conminar al cumplimiento y la obligación ya no está pendiente.", "El artículo 17 de la Ley 1150 de 2007 faculta a las entidades para imponer las multas pactadas con el objeto de conminar al contratista a cumplir, previa audiencia del afectado, y dispone expresamente que la decisión «procede sólo mientras se halle pendiente la ejecución de las obligaciones a cargo del contratista». Si ya cumplió, la multa pierde su finalidad conminatoria; la regla está en el texto de la ley, no solo en la jurisprudencia.", true], ["C", "procede, siempre que la alcaldía las descuente del saldo a favor del contratista en el acta de liquidación.", "La forma de hacer efectiva la multa (compensación, garantía, cobro coactivo) no suple el requisito de que esté pendiente la ejecución cuando se impone (art. 17, Ley 1150).", false]]}, {"id": "CE-162", "niv": 1, "e": "Para imponer multas o declarar el incumplimiento, la alcaldía debe citar al contratista a audiencia y, contra la decisión que se adopte en ella,", "f": "Ley 1474 de 2011, art. 86", "o": [["A", "proceden los recursos de reposición y apelación, que pueden interponerse dentro de los diez días siguientes.", "El procedimiento del artículo 86 de la Ley 1474 prevé únicamente la reposición, resuelta en la misma audiencia; no contempla la apelación ni un término posterior.", false], ["B", "no procede ningún recurso, porque la decisión se entiende notificada en estrados a todos los asistentes.", "Que la decisión se notifique en la audiencia no impide recurrirla: la ley concede el recurso de reposición (art. 86, lit. c, Ley 1474
