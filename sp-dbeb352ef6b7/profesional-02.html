<style>body{overflow-wrap:anywhere}

*{box-sizing:border-box}

.op{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:6px 0;cursor:pointer;background:transparent;width:100%;text-align:left;color:inherit;font:inherit}

.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
select{font:inherit;padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);max-width:100%}

.big{font-size:40px;font-weight:800;color:var(--pri);line-height:1.1}

.res-ok{color:var(--ok);font-weight:700}.res-no{color:var(--no);font-weight:700}

footer{max-width:860px;margin:0 auto;padding:8px 16px 40px;font-size:12px;color:var(--mute)}

<footer><a href="./" style="color:var(--pri);font-weight:600">← Volver al menú</a><br><br>Material de preparación independiente. No está afiliado a la Procuraduría General de la Nación, a la Universidad de Antioquia ni a ninguna entidad pública, y no contiene preguntas reales de la prueba.</footer>
<script>
const DATA = [{"comp": "estructura_pgn", "rol": "general", "tag": "Estructura y funciones de la Procuraduría · Ministerio Público en la Constitución", "texto": "Usted acaba de posesionarse como auxiliar administrativo en una procuraduría provincial y participa en la jornada de inducción. El procurador provincial explica la ubicación de la entidad en el Estado y pide a los nuevos servidores resolver tres preguntas de un taller. En la primera deben identificar quiénes ejercen el Ministerio Público según la Constitución. En la segunda, cuáles son los órganos de control. En la tercera, un compañero sostiene que la Procuraduría pertenece a la Rama Ejecutiva porque su planta la paga el Presupuesto General de la Nación, y otro afirma que pertenece a la Rama Judicial porque sus agentes actúan ante los jueces.", "items": [{"id": "PG-101", "niv": 1, "e": "Según el artículo 118 de la Constitución, el Ministerio Público es ejercido, entre otros, por el Procurador General de la Nación y", "f": "Constitución Política, art. 118", "o": [["A", "el Defensor del Pueblo, los procuradores delegados, los agentes del Ministerio Público ante las autoridades jurisdiccionales y los personeros municipales.", "El artículo 118 de la Constitución enumera a quienes ejercen el Ministerio Público: el Procurador, el Defensor del Pueblo, los procuradores delegados y los agentes ante las autoridades jurisdiccionales, los personeros municipales y los demás funcionarios que determine la ley.", true], ["B", "el Contralor General de la República, los contralores departamentales y municipales, los personeros municipales y los demás funcionarios que determine la ley.", "La Contraloría es un órgano de control distinto del Ministerio Público (art. 117 de la Constitución); el artículo 118 no incluye a los contralores entre quienes ejercen el Ministerio Público.", false], ["C", "el Fiscal General de la Nación, los fiscales delegados ante los jueces y el Defensor del Pueblo.", "La Fiscalía General de la Nación hace parte de la Rama Judicial (art. 249 y siguientes de la Constitución) y no aparece en la enumeración del artículo 118 de quienes ejercen el Ministerio Público.", false]]}, {"id": "PG-102", "niv": 1, "e": "En la segunda pregunta del taller, la respuesta acorde con el artículo 117 de la Constitución es que son órganos de control", "f": "Constitución Política, arts. 117 y 120", "o": [["A", "el Ministerio Público, la Contraloría General de la República y la Registraduría Nacional del Estado Civil.", "La Registraduría hace parte de la organización electoral (art. 120 de la Constitución), no de los órganos de control que enumera el artículo 117.", false], ["B", "el Ministerio Público y la Fiscalía General de la Nación, por ejercer ambos vigilancia sobre los servidores públicos.", "La Fiscalía no es órgano de control: integra la Rama Judicial. El artículo 117 solo menciona al Ministerio Público y a la Contraloría General.", false], ["C", "el Ministerio Público y la Contraloría General de la República.", "El artículo 117 de la Constitución dispone que el Ministerio Público y la Contraloría General de la República son órganos de control.", true]]}, {"id": "PG-103", "niv": 3, "e": "Frente a la discusión de los dos compañeros, lo correcto es afirmar que la Procuraduría General de la Nación", "f": "Constitución Política, arts. 113 y 117; Decreto Ley 262 de 2000, art. 1", "o": [["A", "integra la Rama Judicial, porque sus agentes tienen la misma categoría de los jueces ante quienes actúan.", "La equiparación de calidades y remuneración de los agentes del Ministerio Público con los jueces (art. 280) no los convierte en parte de la Rama Judicial; la PGN es un órgano de control (art. 117).", false], ["B", "no hace parte de ninguna de las tres ramas, pues es un órgano de control.", "El artículo 113 de la Constitución prevé, además de las tres ramas, otros órganos autónomos e independientes para las demás funciones del Estado; el artículo 117 califica al Ministerio Público como órgano de control, y el artículo 1 del Decreto Ley 262 de 2000 le reconoce a la PGN autonomía administrativa, financiera y presupuestal.", true], ["C", "pertenece a la Rama Ejecutiva del orden nacional, porque su presupuesto hace parte del Presupuesto General de la Nación.", "Que su presupuesto se incluya en el Presupuesto General no la ubica en la Rama Ejecutiva. El Decreto Ley 262 de 2000 (art. 1) le reconoce autonomía administrativa, financiera y presupuestal, y la Constitución la trata como órgano de control.", false]]}]}, {"comp": "estructura_pgn", "rol": "general", "tag": "Estructura y funciones de la Procuraduría · Atribuciones del Procurador: información, policía judicial y desvinculación", "texto": "Una procuraduría regional adelanta una actuación por presuntas irregularidades en el manejo de los recursos de alimentación escolar de un departamento. La secretaría de educación departamental se niega a entregar las bases de datos de los contratistas y alega que son «información reservada». Un funcionario de la gobernación afirma, además, que la Procuraduría no puede practicar inspecciones porque solo la Fiscalía tiene funciones de policía judicial. En una reunión, un ciudadano pregunta si el procurador regional puede retirar de inmediato del cargo al secretario que obstaculiza la actuación.", "items": [{"id": "PG-110", "niv": 2, "e": "Frente a la negativa de la secretaría de educación a entregar la información, y según el artículo 284 de la Constitución, es correcto afirmar que", "f": "Constitución Política, arts. 277 num. 9 y 284", "o": [["A", "la Procuraduría debe obtener primero una orden judicial, porque la reserva solo puede levantarla un juez.", "La Constitución no condiciona el acceso de la Procuraduría a una orden judicial: el artículo 284 dispone que no puede oponérsele reserva, salvo excepciones legales.", false], ["B", "la Procuraduría puede exigirla y la entidad no puede oponerle reserva, salvo las excepciones constitucionales y legales.", "El artículo 284 de la Constitución permite al Procurador requerir de las autoridades la información necesaria sin que pueda oponérsele reserva, salvo las excepciones constitucionales y legales; el artículo 277, num. 9, le permite exigir información a funcionarios y particulares.", true], ["C", "la secretaría puede negarla legítimamente, porque la reserva legal de la información prevalece sobre las solicitudes que formulen los organismos de control.", "Es la regla contraria a la del artículo 284 de la Constitución, según el cual al Procurador no puede oponérsele reserva, salvo las excepciones de la Constitución y la ley.", false]]}, {"id": "PG-111", "niv": 1, "e": "Sobre la afirmación del funcionario de la gobernación acerca de la policía judicial, lo correcto es que", "f": "Constitución Política, art. 277, inciso final", "o": [["A", "la Constitución otorga a la Procuraduría atribuciones de policía judicial para el cumplimiento de sus funciones.", "El inciso final del artículo 277 de la Constitución dispone que, para el cumplimiento de sus funciones, la Procuraduría tendrá atribuciones de policía judicial y podrá interponer las acciones que considere necesarias.", true], ["B", "la Procuraduría solo puede ejercer esas atribuciones si el Fiscal General se las delega para cada caso.", "La atribución de policía judicial de la Procuraduría proviene directamente de la Constitución (art. 277, inciso final), no de una delegación del Fiscal.", false], ["C", "es cierta, porque la policía judicial es exclusiva de la Fiscalía General de la Nación y de los organismos que esta designe para cada investigación.", "La Constitución también otorga atribuciones de policía judicial a la Procuraduría para cumplir sus funciones (art. 277, inciso final).", false]]}, {"id": "PG-112", "niv": 2, "e": "Sobre la pregunta del ciudadano, la facultad constitucional de desvincular del cargo, previa audiencia y mediante decisión motivada, al funcionario que obstaculice en forma grave las investigaciones de la Procuraduría corresponde", "f": "Constitución Política, art. 278 num. 1; Decreto Ley 262 de 2000, art. 7 parágrafo", "o": [["A", "al gobernador, como nominador, a solicitud de la procuraduría regional.", "La facultad del artículo 278, num. 1, de la Constitución es del Procurador General; no se trata de una solicitud al nominador.", false], ["B", "al procurador regional, como funcionario que adelanta la actuación.", "Esa facultad no está asignada a los procuradores territoriales: el artículo 278, num. 1, de la Constitución la reserva al Procurador General, que la ejerce directamente.", false], ["C", "directamente al Procurador General de la Nación.", "El artículo 278, num. 1, de la Constitución atribuye al Procurador General, en ejercicio directo, la función de desvincular del cargo, previa audiencia y con decisión motivada, al funcionario que, entre otras causales, obstaculice en forma grave las investigaciones de la Procuraduría.", true]]}]}, {"comp": "estructura_pgn", "rol": "general", "tag": "Estructura y funciones de la Procuraduría · Oficinas del Despacho del Procurador", "texto": "En el comité directivo de la Procuraduría se revisan tres temas. Primero, la preparación del anteproyecto de presupuesto de la próxima vigencia. Segundo, el resultado de una visita de verificación a una procuraduría provincial en la que se encontraron expedientes sin movimiento durante más de un año, lo que podría constituir falta disciplinaria. Tercero, la notificación de una demanda de nulidad y restablecimiento del derecho presentada contra la Procuraduría por un exservidor que cuestiona su retiro del servicio.", "items": [{"id": "PG-125", "niv": 2, "e": "La elaboración del anteproyecto de presupuesto y del programa anual de caja, en coordinación con la División Financiera, corresponde a", "f": "Decreto Ley 262 de 2000, arts. 11 num. 4, 13 y 15", "o": [["A", "la Oficina de Planeación.", "El artículo 11, num. 4, del Decreto Ley 262 de 2000 asigna a la Oficina de Planeación elaborar, en coordinación con la División Financiera, el anteproyecto de presupuesto y el programa anual de caja.", true], ["B", "la Oficina Jurídica, que elabora los actos para el ordenador del gasto.", "La Oficina Jurídica proyecta actos para cumplir sentencias y conciliaciones y elabora contratos (art. 15), pero el anteproyecto de presupuesto lo elabora Planeación (art. 11, num. 4).", false], ["C", "la Oficina de Control Interno.", "Control Interno verifica la gestión y los estados financieros (art. 13 del Decreto Ley 262 de 2000), pero no elabora el anteproyecto de presupuesto.", false]]}, {"id": "PG-126", "niv": 2, "e": "Si la visita la realizó la Oficina de Control Interno y advierte posibles faltas disciplinarias, esa oficina debe", "f": "Decreto Ley 262 de 2000, art. 13 nums. 3, 4 y 8", "o": [["A", "abrir indagación previa contra los responsables, porque detectó directamente los hechos.", "La Oficina de Control Interno no tiene competencia disciplinaria; su función es remitir los informes a la dependencia competente (art. 13, num. 8, del Decreto Ley 262 de 2000).", false], ["B", "imponer un plan de mejoramiento y archivar el asunto si la procuraduría provincial lo cumple.", "Proponer correctivos es parte del control de gestión (art. 13, num. 3), pero no reemplaza el envío a la autoridad disciplinaria cuando hay posibles faltas (num. 8); Control Interno no puede archivar asuntos disciplinarios.", false], ["C", "remitir el informe de control de gestión, con sus soportes, a la dependencia competente.", "El artículo 13, num. 8, del Decreto Ley 262 de 2000 ordena a la Oficina de Control Interno enviar los informes de control de gestión, con sus soportes, a la dependencia competente cuando de ellos se concluya que hay posibles faltas disciplinarias.", true]]}, {"id": "PG-127", "niv": 1, "e": "La representación de la Procuraduría en el proceso de nulidad y restablecimiento del derecho promovido por el exservidor está a cargo de", "f": "Decreto Ley 262 de 2000, arts. 9, 10 y 15 num. 2", "o": [["A", "la Procuraduría Auxiliar para Asuntos Disciplinarios.", "Esta procuraduría auxiliar proyecta decisiones disciplinarias del Procurador y absuelve consultas en esa materia (art. 9), pero no representa judicialmente a la entidad.", false], ["B", "la Oficina Jurídica.", "El artículo 15, num. 2, del Decreto Ley 262 de 2000 asigna a la Oficina Jurídica representar a la Procuraduría en los procesos en que sea demandada o deba actuar como demandante.", true], ["C", "la Dirección Nacional de Investigaciones Especiales.", "Esta dirección adelanta investigaciones disciplinarias y actos de investigación complejos (art. 10); no representa a la entidad en procesos judiciales.", false]]}]}, {"comp": "estructura_pgn", "rol": "profesional", "tag": "Estructura y funciones de la Procuraduría · Niveles profesional, asesor y ejecutivo · Salas disciplinarias y competencias en elección popular", "texto": "Usted es profesional especializado en una procuraduría regional y debe proyectar las decisiones de reparto de tres asuntos. En un proceso contra un concejal de un municipio que no es capital de departamento, la procuraduría provincial de instrucción ordenó la suspensión provisional del investigado y el auto debe surtir el grado de consulta. En otro proceso contra un tesorero municipal, la defensa apeló en etapa de instrucción un auto de la procuraduría provincial. En un tercer proceso contra un alcalde, ya en etapa de juzgamiento ante la procuraduría provincial de juzgamiento, la defensa apeló el auto que negó unas pruebas.", "items": [{"id": "PG-137", "niv": 3, "e": "El grado de consulta de la suspensión provisional del concejal corresponde a", "f": "Decreto Ley 262 de 2000, arts. 22 nums. 1 y 3, y 75 num. 4 (modificados por el Decreto Ley 1851 de 2021)", "o": [["A", "la Sala Disciplinaria de Juzgamiento de Servidores Públicos de Elección Popular.", "El artículo 22, num. 3, lit. c, del Decreto Ley 262 de 2000, modificado por el Decreto Ley 1851 de 2021, le asigna la consulta de la suspensión provisional proferida, en cualquier etapa, por las procuradurías territoriales en actuaciones contra servidores de elección popular. La procuraduría regional de instrucción no es competente porque el art. 75, num. 4, excluye expresamente las actuaciones contra servidores de elección popular.", true], ["B", "la procuraduría regional de instrucción, superior de la provincial.", "La regional de instrucción conoce de la consulta de suspensiones dictadas por las provinciales en instrucción, excepto en las actuaciones contra servidores de elección popular (art. 75, num. 4), y el concejal lo es.", false], ["C", "la Sala Disciplinaria de Instrucción, porque el proceso está en etapa de instrucción.", "La Sala de Instrucción conoce de la consulta de suspensiones dictadas por las delegadas de instrucción, excepto en actuaciones contra servidores de elección popular (art. 22, num. 1, lit. c).", false]]}, {"id": "PG-138", "niv": 3, "e": "La apelación interpuesta en etapa de instrucción en el proceso contra el tesorero municipal debe ser resuelta por", "f": "Decreto Ley 262 de 2000, arts. 25 num. 3, 75 num. 3 y 75A num. 2 (modificados o adicionados por el Decreto Ley 1851 de 2021)", "o": [["A", "la procuraduría regional de juzgamiento.", "La regional de juzgamiento resuelve las apelaciones en los procesos de las provinciales en etapa de juzgamiento (art. 75A, num. 2), no en instrucción.", false], ["B", "la procuraduría delegada disciplinaria de instrucción.", "Las delegadas de instrucción resuelven apelaciones de los procesos de las regionales y distritales de Bogotá (art. 25, num. 3), no de las provinciales.", false], ["C", "la procuraduría regional de instrucción.", "El artículo 75, num. 3, del Decreto Ley 262 de 2000, modificado por el artículo 19 del Decreto Ley 1851 de 2021, asigna a las regionales de instrucción los recursos de apelación en los procesos de las provinciales y distritales en etapa de instrucción.", true]]}, {"id": "PG-139", "niv": 3, "e": "La apelación del auto que negó pruebas en el juzgamiento del alcalde corresponde a", "f": "Decreto Ley 262 de 2000, arts. 22 num. 3, 25A num. 2 y 75A num. 2 (modificados o adicionados por el Decreto Ley 1851 de 2021)", "o": [["A", "la procuraduría delegada disciplinaria de juzgamiento.", "Las delegadas de juzgamiento resuelven apelaciones de procesos de las regionales y distritales de Bogotá, excepto en elección popular (art. 25A, num. 2); no son el superior en este caso.", false], ["B", "la Sala Disciplinaria de Juzgamiento de Servidores Públicos de Elección Popular.", "El artículo 22, num. 3, lit. b, del Decreto Ley 262 de 2000 le asigna las apelaciones que se presenten, en etapa de juzgamiento, en los procesos de las procuradurías delegadas, regionales, distritales y provinciales contra servidores de elección popular.", true], ["C", "la procuraduría regional de juzgamiento, como superior funcional de la provincial.", "La regional de juzgamiento conoce de las apelaciones de las provinciales en juzgamiento, excepto en los casos de servidores de elección popular (art. 75A, num. 2).", false]]}]}, {"comp": "estructura_pgn", "rol": "general", "tag": "Estructura y funciones de la Procuraduría · Ley 2094 de 2021 y sentencia C-030 de 2023", "texto": "En un conversatorio organizado por una procuraduría regional, los asistentes discuten los efectos de la sentencia C-030 de 2023, que revisó la Ley 2094 de 2021. Se plantean tres situaciones: la naturaleza de las funciones disciplinarias de la Procuraduría; un fallo de la Procuraduría que destituye e inhabilita a un alcalde en ejercicio del cargo, y un fallo que suspende por tres meses a una secretaria de despacho departamental, que no es de elección popular.", "items": [{"id": "PG-146", "niv": 2, "e": "Según la sentencia C-030 de 2023, las funciones disciplinarias que ejerce la Procuraduría General de la Nación son de naturaleza", "f": "Corte Constitucional, sentencia C-030 de 2023 (Comunicado 04 del 16 de febrero de 2023); Ley 1952 de 2019, art. 2", "o": [["A", "mixta: jurisdiccional frente a servidores de elección popular y administrativa frente a los demás.", "La Corte no adoptó un régimen mixto: retiró el carácter jurisdiccional en todos los casos y precisó que la imposición definitiva de ciertas sanciones a servidores de elección popular corresponde al juez contencioso administrativo.", false], ["B", "jurisdiccional, como lo dispuso la Ley 2094 de 2021 para ajustarse a la Convención Americana.", "La Corte declaró inexequibles las expresiones «jurisdiccionales» y «jurisdiccional» de los artículos 1, 54, 73 y 74 de la Ley 2094 de 2021.", false], ["C", "administrativa, y no jurisdiccional.", "La sentencia C-030 de 2023 declaró exequibles de manera condicionada los artículos 13, 16 y 17 de la Ley 2094 de 2021, en el entendido de que las funciones disciplinarias de la PGN son de naturaleza administrativa y no jurisdiccional.", true]]}, {"id": "PG-147", "niv": 3, "e": "En el caso del fallo que destituye e inhabilita al alcalde, conforme a la sentencia C-030 de 2023", "f": "Corte Constitucional, sentencia C-030 de 2023, resolutivos segundo y cuarto; Ley 1952 de 2019, art. 2 (modificado por el art. 1 de la Ley 2094 de 2021)", "o": [["A", "el juez de lo contencioso administrativo revisa la decisión aunque el alcalde no la impugne, y mientras tanto la sanción no se ejecuta.", "El resolutivo cuarto de la C-030 de 2023 condicionó el artículo 54 de la Ley 2094 de 2021: la revisión opera solo frente a destitución, suspensión o inhabilidad de servidores de elección popular, por ministerio de la ley, automática e inmediatamente, y la ejecución se suspende durante el trámite judicial. Según la Circular 2A de 2023 de la PGN, la regla se aplica a servidores de elección popular sancionados con destitución, suspensión o inhabilidad.", true], ["B", "la sanción queda en firme y se ejecuta si el alcalde no interpone, dentro del término legal, el recurso extraordinario de revisión.", "La Corte condicionó el recurso de revisión para estos casos a que opere de manera automática, por ministerio de la ley; su trámite no depende de que el sancionado lo interponga.", false], ["C", "la sanción se ejecuta de inmediato, como cualquier acto administrativo, y el alcalde puede luego demandarla en nulidad y restablecimiento del derecho.", "Para los servidores de elección popular la ejecución queda suspendida mientras el juez decide la revisión (art. 1 de la Ley 2094 de 2021 y resolutivo cuarto de la C-030 de 2023).", false]]}, {"id": "PG-148", "niv": 3, "e": "En el caso de la secretaria de despacho departamental suspendida por la Procuraduría, es correcto afirmar que", "f": "Corte Constitucional, sentencia C-030 de 2023; Procuraduría General de la Nación, Circular 2A de 2023", "o": [["A", "la suspensión debe ser determinada por el juez contencioso administrativo, como en el caso del alcalde.", "La reserva judicial de la C-030 de 2023 se refiere a servidores de elección popular; la secretaria de despacho no lo es.", false], ["B", "no opera la revisión automática y la sanción, como acto administrativo, se controla mediante el medio de control de nulidad y restablecimiento del derecho.", "Según la C-030 de 2023, la revisión automática solo opera para sanciones de destitución, suspensión e inhabilidad a servidores de elección popular; en los demás eventos, las sanciones de la PGN son administrativas y se controlan por nulidad y restablecimiento del derecho (Circular 2A de 2023 de la PGN).", true], ["C", "se controla mediante el recurso extraordinario de revisión de la Ley 2094 de 2021, que opera de manera automática frente a toda suspensión.", "La C-030 de 2023 condicionó el artículo 54 de la Ley 2094 de 2021: la revisión automática solo opera frente a destitución, suspensión o inhabilidad de servidores de elección popular; la secretaria de despacho no lo es.", false]]}]}, {"comp": "estructura_pgn", "rol": "general", "tag": "Estructura y funciones de la Procuraduría · Ministerio Público en los municipios: personerías", "texto": "Usted es profesional de una procuraduría provincial y atiende a una delegación de un municipio de quinta categoría. Los visitantes preguntan cómo y por cuánto tiempo se elige al personero municipal, cuándo empieza y termina su periodo, y bajo la dirección de quién ejerce sus funciones de Ministerio Público. También quieren saber si el personero debe informar a la Procuraduría de las investigaciones disciplinarias que adelanta contra servidores de la alcaldía.", "items": [{"id": "PG-167", "niv": 1, "e": "Sobre la elección del personero, usted les explica que lo elige", "f": "Ley 136 de 1994, art. 170 (modificado por el art. 4 de la Ley 2422 de 2024)", "o": [["A", "el procurador provincial, previo concurso, para un periodo de tres años.", "La Procuraduría no elige personeros, y el periodo es de cuatro años (art. 170 de la Ley 136 de 1994).", false], ["B", "el concejo municipal, previo concurso público de méritos, para un periodo institucional de cuatro años.", "El artículo 170 de la Ley 136 de 1994, modificado por el artículo 4 de la Ley 2422 de 2024, dispone que los concejos eligen personeros para periodos institucionales de cuatro años, dentro de los diez primeros días de enero del año en que inicia su periodo constitucional, previo concurso público de méritos.", true], ["C", "el alcalde, de terna enviada por el concejo, para un periodo igual al suyo.", "El personero no lo designa el alcalde: lo elige el concejo previo concurso público de méritos (art. 170 de la Ley 136 de 1994, modificado por la Ley 2422 de 2024).", false]]}, {"id": "PG-168", "niv": 2, "e": "Según el texto vigente de la Ley 136 de 1994, el personero elegido inicia su periodo", "f": "Ley 136 de 1994, art. 170 inciso 2 (modificado por el art. 4 de la Ley 2422 de 2024)", "o": [["A", "el 1 de enero siguiente a su elección y lo termina el 31 de diciembre del cuarto año.", "El artículo 170 vigente fija el inicio el 1 de marzo siguiente a la elección y la terminación el último día de febrero del cuarto año.", false], ["B", "el mismo día de su elección, en enero, y lo termina en enero del cuarto año.", "La elección se hace en los primeros diez días de enero, pero el periodo inicia el 1 de marzo siguiente (art. 170 de la Ley 136 de 1994, modificado por la Ley 2422 de 2024).", false], ["C", "el 1 de marzo siguiente a su elección y lo concluye el último día de febrero del cuarto año.", "Así lo dispone el inciso 2 del artículo 170 de la Ley 136 de 1994, modificado por el artículo 4 de la Ley 2422 de 2024.", true]]}, {"id": "PG-169", "niv": 2, "e": "Sobre la dirección de las funciones del personero y el deber de informar sus investigaciones disciplinarias, lo correcto es que el personero", "f": "Ley 136 de 1994, art. 178 y num. 4; Constitución Política, art. 118", "o": [["A", "actúa bajo la dirección suprema del Procurador y debe informar sus investigaciones a los procuradores provinciales.", "El artículo 178 de la Ley 136 de 1994 dispone que el personero ejerce en el municipio, bajo la dirección suprema del Procurador General, las funciones del Ministerio Público, y su num. 4 indica que adelanta las investigaciones bajo la supervigilancia de los procuradores provinciales, a quienes debe informar.", true], ["B", "es autónomo frente a la Procuraduría y no tiene el deber de informarle sus investigaciones, porque fue elegido por el concejo municipal.", "La elección por el concejo no excluye la dirección suprema del Procurador ni el deber de informar a los procuradores provinciales (art. 178, num. 4, de la Ley 136 de 1994).", false], ["C", "ejerce sus funciones bajo la dirección del alcalde y solo informa al concejo.", "El personero no está bajo la dirección del alcalde; ejerce el Ministerio Público bajo la dirección suprema del Procurador General (art. 178 de la Ley 136 de 1994).", false]]}]}, {"comp": "gestion_publica", "rol": "general", "tag": "Gestión pública y funcionamiento del Estado · Estado social de derecho y fines del Estado", "texto": "Usted es profesional universitario de una procuraduría provincial con funciones preventivas y en marzo de 2027 revisa actuaciones de la alcaldía de un municipio de quinta categoría. Encuentra tres situaciones. Primera: un decreto municipal ordena a los inspectores de policía imponer las sanciones por ocupación de vías sin escuchar previamente a los afectados, lo que choca abiertamente con el debido proceso que garantiza el artículo 29 de la Constitución; un inspector pregunta si debe aplicarlo. Segunda: la secretaria de gobierno anuncia que el programa de ayudas para damnificados por inundaciones excluirá a las familias que llegaron hace poco de otro departamento, «porque la alcaldía solo responde por los nacidos aquí». Tercera: el alcalde sostiene que, gracias a la autonomía municipal, puede dejar de aplicar en su territorio una ley nacional de tránsito que considera inconveniente.", "items": [{"id": "GE-101", "niv": 1, "e": "Frente a la consulta del inspector sobre el decreto que suprime la posibilidad de ser escuchado, la regla constitucional aplicable indica que", "f": "Constitución Política, art. 4 (y art. 29)", "o": [["A", "el decreto debe aplicarse mientras un juez no lo anule, porque los actos administrativos se presumen legales.", "La presunción de legalidad no obliga a aplicar una norma abiertamente incompatible con la Constitución: el artículo 4 ordena preferir la norma constitucional, y esa regla vincula también a las autoridades administrativas.", false], ["B", "el inspector debe pedir al concejo municipal que inaplique el decreto, pues solo esa corporación puede dejar sin efectos los decretos del alcalde.", "Ninguna norma reserva al concejo la inaplicación de decretos del alcalde. La regla de preferencia constitucional del artículo 4 se aplica directamente por la autoridad que debe resolver el caso.", false], ["C", "debe darse prevalencia a la Constitución frente al decreto, por ser este incompatible con ella.", "El artículo 4 de la Constitución la define como norma de normas y ordena que, en todo caso de incompatibilidad entre ella y la ley u otra norma jurídica, se apliquen las disposiciones constitucionales (excepción de inconstitucionalidad). El decreto es abiertamente contrario al debido proceso.", true]]}, {"id": "GE-102", "niv": 1, "e": "Sobre la exclusión de las familias que llegaron de otro departamento, usted debe advertir a la secretaria que", "f": "Constitución Política, art. 2", "o": [["A", "la exclusión es válida por la autonomía territorial, que permite a cada municipio atender solo a su población nativa.", "La autonomía de las entidades territoriales se ejerce dentro de los límites de la Constitución y la ley (art. 287) y no autoriza a desconocer el deber de protección del artículo 2 ni el derecho a la igualdad.", false], ["B", "la exclusión es contraria a la Constitución, porque las autoridades deben proteger a todos los residentes en el país, vengan de donde vengan.", "El inciso 2 del artículo 2 de la Constitución señala que las autoridades están instituidas para proteger a todas las personas residentes en Colombia en su vida, honra, bienes, creencias y demás derechos y libertades. El lugar de nacimiento no es un criterio válido para excluir a damnificados.", true], ["C", "la exclusión es válida si se adopta por decreto, porque cada municipio fija los fines del Estado en su plan de desarrollo.", "Los fines esenciales del Estado están fijados en el artículo 2 de la Constitución y no los redefine un plan de desarrollo municipal; un decreto no puede restringir la protección que la Constitución ordena brindar a todas las personas residentes.", false]]}, {"id": "GE-103", "niv": 2, "e": "En relación con la postura del alcalde sobre la ley nacional de tránsito, lo correcto es señalar que", "f": "Constitución Política, arts. 1 y 287", "o": [["A", "la autonomía territorial se ejerce dentro de los límites de la Constitución y la ley, en una república unitaria.", "El artículo 1 de la Constitución define a Colombia como república unitaria, descentralizada, con autonomía de sus entidades territoriales, y el artículo 287 precisa que esa autonomía se ejerce dentro de los límites de la Constitución y la ley. El alcalde no puede dejar de aplicar una ley nacional.", true], ["B", "la autonomía territorial permite apartarse de una ley nacional mientras el gobernador no objete esa decisión.", "El gobernador no tiene facultad para autorizar el desconocimiento de leyes nacionales. La autonomía municipal se ejerce dentro de los límites de la Constitución y la ley (art. 287).", false], ["C", "la descentralización permite inaplicar una ley nacional en el municipio si el concejo lo aprueba mediante acuerdo.", "Un acuerdo municipal es jerárquicamente inferior a la ley y no puede dejarla sin efecto. Colombia es una república unitaria (art. 1), por lo que las leyes del Congreso rigen en todo el territorio.", false]]}]}, {"comp": "gestion_publica", "rol": "profesional", "tag": "Gestión pública y funcionamiento del Estado · Niveles profesional, asesor y ejecutivo · Estructura de la administración (Ley 489 de 1998)", "texto": "Usted es profesional especializado de una procuraduría delegada con funciones preventivas y debe clasificar, en un informe de seguimiento, cuatro entidades del orden nacional: (a) una superintendencia creada por ley, sin personería jurídica, que cumple funciones de inspección y vigilancia; (b) una entidad creada por ley, con capital 100 % estatal, que fabrica y vende productos en competencia con empresas privadas y se rige por el derecho privado; (c) una sociedad anónima autorizada por la ley, en la que la Nación tiene el 60 % de las acciones y particulares el 40 %; y (d) una unidad administrativa especial a la que su ley de creación le reconoció personería jurídica.", "items": [{"id": "GE-114", "niv": 1, "e": "La superintendencia descrita en el literal (a)", "f": "Ley 489 de 1998, arts. 38 y 66", "o": [["A", "pertenece al sector central de la Rama Ejecutiva del orden nacional.", "El artículo 38 de la Ley 489 de 1998 ubica en el sector central a las superintendencias y unidades administrativas especiales sin personería jurídica; el artículo 66 las define como organismos sin personería con autonomía administrativa y financiera.", true], ["B", "es un órgano autónomo e independiente, ajeno a las ramas del poder público.", "Las superintendencias hacen parte de la Rama Ejecutiva (art. 38 de la Ley 489); no son órganos autónomos como la organización electoral o los órganos de control.", false], ["C", "es una entidad descentralizada por servicios, por contar con autonomía administrativa y financiera.", "La autonomía administrativa y financiera no la convierte en descentralizada. Solo las superintendencias con personería jurídica son descentralizadas (arts. 38 y 68).", false]]}, {"id": "GE-115", "niv": 2, "e": "Por sus características, la entidad del literal (b) corresponde a", "f": "Ley 489 de 1998, arts. 70 y 85", "o": [["A", "un establecimiento público, porque todo su capital es estatal.", "Los establecimientos públicos atienden principalmente funciones administrativas y se rigen por el derecho público (art. 70). El origen exclusivamente estatal del capital no los distingue de las empresas industriales y comerciales.", false], ["B", "una sociedad de economía mixta, porque desarrolla actividades comerciales.", "La sociedad de economía mixta exige aportes estatales y de capital privado (art. 97). En el caso el capital es 100 % estatal.", false], ["C", "una empresa industrial y comercial del Estado, porque realiza actividades comerciales con capital público.", "El artículo 85 de la Ley 489 de 1998 define las empresas industriales y comerciales del Estado como organismos creados o autorizados por la ley que desarrollan actividades industriales o comerciales y de gestión económica conforme al derecho privado, con capital independiente.", true]]}, {"id": "GE-116", "niv": 3, "e": "La sociedad del literal (c), con 60 % de capital de la Nación y 40 % de particulares,", "f": "Ley 489 de 1998, arts. 38 y 97", "o": [["A", "es una empresa industrial y comercial del Estado, porque la Nación tiene la mayoría de las acciones.", "La participación mayoritaria de la Nación no la transforma en empresa industrial y comercial: estas no se constituyen con aportes privados. La concurrencia de capital estatal y privado en forma societaria es propia de la sociedad de economía mixta (art. 97).", false], ["B", "es una sociedad de economía mixta, constituida como sociedad comercial con aportes estatales y de capital privado.", "El artículo 97 de la Ley 489 de 1998 define las sociedades de economía mixta como organismos autorizados por la ley, constituidos bajo la forma de sociedades comerciales con aportes estatales y de capital privado. El artículo 38 las ubica en el sector descentralizado por servicios.", true], ["C", "es una sociedad privada, porque se constituyó como sociedad anónima conforme al Código de Comercio.", "La forma de sociedad comercial es precisamente uno de los rasgos de la sociedad de economía mixta; al estar autorizada por la ley y tener aportes estatales, es entidad descentralizada (arts. 38 y 97).", false]]}, {"id": "GE-117", "niv": 3, "e": "La unidad administrativa especial del literal (d), a la que la ley reconoció personería jurídica,", "f": "Ley 489 de 1998, arts. 38, 67 y 68", "o": [["A", "pertenece al sector central, pero se rige por el derecho privado por tener personería jurídica.", "La personería jurídica es justamente lo que la ubica en el sector descentralizado; además, tenerla no implica por sí solo un régimen de derecho privado.", false], ["B", "pertenece al sector central, porque todas las unidades administrativas especiales hacen parte de él.", "Solo las unidades administrativas especiales sin personería jurídica pertenecen al sector central (art. 38, num. 1, lit. e).", false], ["C", "pertenece al sector descentralizado por servicios, porque la ley le otorgó personería jurídica.", "Los artículos 38 y 68 de la Ley 489 de 1998 incluyen entre las entidades descentralizadas a las superintendencias y unidades administrativas especiales con personería jurídica; las que carecen de ella son del sector central (art. 67).", true]]}]}, {"comp": "gestion_publica", "rol": "general", "tag": "Gestión pública y funcionamiento del Estado · Delegación de funciones", "texto": "Usted trabaja en la oficina jurídica de una gobernación. El gobernador quiere delegar en la secretaria general, empleada del nivel directivo, la decisión de las solicitudes de comisión de estudios de los servidores y la firma de las resoluciones que las conceden o niegan. Una vez conocida la propuesta, la secretaria general manifiesta que, por su carga de trabajo, subdelegará esa función en un profesional universitario del área de talento humano. Un servidor, cuya solicitud de comisión fue negada en una resolución firmada por la secretaria, pregunta quién responde si esa resolución resulta ilegal.", "items": [{"id": "GE-118", "niv": 1, "e": "Para que la delegación propuesta por el gobernador sea válida, se requiere que", "f": "Ley 489 de 1998, arts. 9 y 10", "o": [["A", "la asamblea departamental la autorice previamente para cada función que se pretenda delegar.", "La delegación administrativa se hace por acto del delegante conforme a la Constitución y la ley (arts. 209 y 211 de la Constitución y 9 de la Ley 489); no requiere autorización de la asamblea para cada función.", false], ["B", "conste en un acto escrito que determine la autoridad delegataria y las funciones o asuntos que se transfieren.", "El artículo 10 de la Ley 489 de 1998 exige que el acto de delegación sea siempre escrito y determine la autoridad delegataria y las funciones o asuntos específicos cuya atención y decisión se transfieren.", true], ["C", "se imparta como instrucción verbal del gobernador, que se formaliza por escrito solo si algún interesado lo solicita.", "La ley no admite la delegación verbal: el acto de delegación siempre debe ser escrito (art. 10 de la Ley 489).", false]]}, {"id": "GE-119", "niv": 2, "e": "La subdelegación que anuncia la secretaria general", "f": "Ley 489 de 1998, art. 11", "o": [["A", "no es posible, porque la ley excluye de la delegación las funciones que se recibieron por delegación.", "El artículo 11, numeral 2, de la Ley 489 de 1998 prohíbe transferir mediante delegación las funciones, atribuciones y potestades recibidas en virtud de delegación.", true], ["B", "es posible siempre que la secretaria informe al gobernador dentro de los tres días siguientes.", "Ninguna norma permite subdelegar con un simple aviso posterior; la prohibición del artículo 11, numeral 2, de la Ley 489 es expresa.", false], ["C", "es posible si el profesional pertenece al área que maneja las comisiones de estudio.", "La pertenencia al área no salva la prohibición: las funciones recibidas por delegación no se pueden transferir de nuevo (art. 11, num. 2, de la Ley 489).", false]]}, {"id": "GE-120", "niv": 3, "e": "En cuanto a la responsabilidad por la resolución firmada por la secretaria general, la regla aplicable es que", "f": "Constitución Política, art. 211; Ley 489 de 1998, art. 12", "o": [["A", "responden por partes iguales el gobernador y la secretaria general, porque la delegación es un acto conjunto de quien delega y de quien la recibe.", "La Constitución no prevé una responsabilidad compartida por partes iguales: la radica exclusivamente en el delegatario, salvo que el delegante reforme o revoque el acto y reasuma la responsabilidad (art. 211).", false], ["B", "responde la secretaria delegataria, salvo que el gobernador reforme o revoque la resolución y reasuma así la responsabilidad.", "El artículo 211 de la Constitución establece que la delegación exime de responsabilidad al delegante, la cual corresponde exclusivamente al delegatario, cuyos actos o resoluciones puede siempre reformar o revocar aquel, reasumiendo la responsabilidad consiguiente. El artículo 12 de la Ley 489 lo desarrolla. La jurisprudencia constitucional precisa que el delegante conserva deberes de dirección y control cuyo incumplimiento le es imputable, pero la responsabilidad por el acto expedido corresponde a la delegataria.", true], ["C", "responde el gobernador, porque la delegación no traslada la responsabilidad del delegante.", "Es al contrario: el artículo 211 de la Constitución dispone que la delegación exime de responsabilidad al delegante. Las reglas especiales de contratación sobre el deber de vigilancia no aplican a una resolución de comisión de estudios.", false]]}]}, {"comp": "gestion_publica", "rol": "general", "tag": "Gestión pública y funcionamiento del Estado · Empleo público y carrera", "texto": "Usted es técnico de la Oficina de Selección y Carrera de la Procuraduría General de la Nación y atiende el chat de orientación a aspirantes. Recibe tres preguntas: una aspirante quiere saber si la carrera de la Procuraduría se rige por la Ley 909 de 2004 y la administra la Comisión Nacional del Servicio Civil; otro pregunta cuál es la regla general sobre la naturaleza de los empleos en las entidades del Estado; y un tercero cuenta que su hermana ganó un concurso para un empleo de carrera administrativa en la alcaldía de su municipio y quiere saber qué sigue después de su nombramiento.", "items": [{"id": "GE-141", "niv": 3, "e": "A la aspirante que pregunta por el régimen de carrera de la Procuraduría, usted le responde que", "f": "Ley 909 de 2004, art. 3, num. 2; Constitución Política, art. 130; Decreto Ley 262 de 2000", "o": [["A", "es una carrera especial con régimen propio, y la Ley 909 de 2004 se le aplica solo para llenar vacíos.", "El artículo 3, numeral 2, de la Ley 909 de 2004 dispone que sus normas se aplican con carácter supletorio, en caso de vacíos, a las carreras especiales, entre ellas la de la Procuraduría General de la Nación, cuyo régimen está en el Decreto Ley 262 de 2000.", true], ["B", "la carrera de la Procuraduría se rige íntegramente por la Ley 909 de 2004 y la administra la Comisión Nacional del Servicio Civil.", "La carrera de la Procuraduría es especial y de origen constitucional; la Ley 909 solo se le aplica de forma supletoria (art. 3, num. 2), y la CNSC no administra las carreras especiales (art. 130 de la Constitución).", false], ["C", "la Ley 909 de 2004 tampoco se le aplica cuando su régimen especial guarda silencio, porque los dos regímenes son excluyentes.", "La Ley 909 sí se aplica a la Procuraduría, aunque solo de forma supletoria, cuando hay vacíos en su normativa (art. 3, num. 2).", false]]}, {"id": "GE-142", "niv": 1, "e": "Sobre la naturaleza de los empleos en los órganos y entidades del Estado, la regla general es que", "f": "Constitución Política, art. 125", "o": [["A", "son de libre nombramiento y remoción, salvo aquellos que la ley declare expresamente como empleos de carrera.", "La Constitución consagra la regla contraria: la carrera es la regla general y el libre nombramiento y remoción, una excepción (art. 125).", false], ["B", "son de carrera solo los empleos de los niveles técnico y asistencial.", "El artículo 125 no limita la carrera a algunos niveles; hay empleos de carrera en todos los niveles, incluidos el profesional y el asesor.", false], ["C", "son de carrera, salvo excepciones como los de elección popular y los de libre nombramiento y remoción.", "El artículo 125 de la Constitución dispone que los empleos en los órganos y entidades del Estado son de carrera, y exceptúa los de elección popular, los de libre nombramiento y remoción, los de trabajadores oficiales y los demás que determine la ley.", true]]}, {"id": "GE-143", "niv": 2, "e": "Sobre la hermana que ganó el concurso en la alcaldía, usted explica que", "f": "Ley 909 de 2004, art. 31, num. 5", "o": [["A", "adquiere los derechos de carrera desde la posesión, y el período de prueba solo sirve para fijar su salario.", "Los derechos de carrera se adquieren al superar el período de prueba con evaluación satisfactoria, no con la posesión; el período de prueba no tiene que ver con la fijación del salario.", false], ["B", "será nombrada en período de prueba por un año, al cabo del cual queda inscrita automáticamente en carrera.", "El período de prueba es de seis meses y la inscripción depende de una evaluación satisfactoria; si no la obtiene, el nombramiento se declara insubsistente (art. 31, num. 5).", false], ["C", "será nombrada en período de prueba por seis meses y, si su evaluación es satisfactoria, adquirirá los derechos de carrera.", "El artículo 31, numeral 5, de la Ley 909 de 2004 dispone que quien sea seleccionado por concurso y no esté inscrito en carrera será nombrado en período de prueba por seis meses; si obtiene evaluación satisfactoria adquiere los derechos de carrera, que se declaran con la inscripción en el Registro Público.", true]]}]}, {"comp": "atencion_usuario", "rol": "general", "tag": "Atención al usuario · Ampliación del término y peticiones análogas", "texto": "En la Secretaría de Movilidad de un municipio se recibió una petición de interés particular cuya respuesta depende de un estudio técnico que tardará varias semanas. El jefe de la dependencia propone esperar a que venza el término legal y, al día siguiente, enviar al peticionario un oficio que explique la demora. En la misma semana, la secretaría recibe catorce peticiones casi idénticas de vecinos de un barrio, que piden información de interés común sobre el cronograma de una obra de semaforización.", "items": [{"id": "AU-113", "niv": 2, "e": "Para ampliar válidamente el término de la petición que requiere el estudio técnico, la secretaría debe", "f": "Ley 1755 de 2015, art. 1 (art. 14, parágrafo, de la Ley 1437 de 2011)", "o": [["A", "solicitar autorización a la personería municipal para prorrogar el término por una sola vez.", "La ley no exige autorización de la personería ni de ninguna otra autoridad: la ampliación la decide y comunica la misma entidad.", false], ["B", "informar al peticionario, antes de que venza el término, los motivos de la demora y el plazo razonable en que responderá.", "El parágrafo del artículo 14 del CPACA permite, de forma excepcional, ampliar el término si la autoridad informa al interesado antes del vencimiento los motivos de la demora y el plazo razonable de respuesta.", true], ["C", "enviar el oficio al día siguiente del vencimiento, como propone el jefe, porque la ley permite justificar la demora una vez ocurre.", "El parágrafo del artículo 14 del CPACA exige informar antes del vencimiento; un aviso posterior no evita el incumplimiento del término.", false]]}, {"id": "AU-114", "niv": 2, "e": "El plazo que la secretaría anuncie para responder esa petición no puede exceder", "f": "Ley 1755 de 2015, art. 1 (art. 14, parágrafo, de la Ley 1437 de 2011)", "o": [["A", "del doble del término inicialmente previsto para ese tipo de petición.", "El parágrafo del artículo 14 del CPACA dispone que el plazo razonable que se señale no podrá exceder del doble del inicialmente previsto.", true], ["B", "del triple del término inicialmente previsto, si el estudio técnico lo justifica.", "La ley fija un tope fijo, el doble del término inicial, y no permite superarlo por la complejidad del asunto.", false], ["C", "de un mes contado desde el vencimiento del término inicial.", "El plazo de un mes corresponde al que se da al peticionario para completar una petición incompleta (art. 17 del CPACA), no a la ampliación del término para responder.", false]]}, {"id": "AU-115", "niv": 3, "e": "Frente a las catorce peticiones sobre el cronograma de la obra, la secretaría puede", "f": "Ley 1755 de 2015, art. 1 (arts. 19 y 22 de la Ley 1437 de 2011)", "o": [["A", "emitir una sola respuesta para todos, difundirla en un diario de amplia circulación y en su sitio web, y dar copia a quien la pida.", "El inciso 2 del artículo 22 del CPACA permite dar una única respuesta cuando más de diez personas formulan peticiones análogas de información, de interés general o de consulta, con esas formas de publicación y entrega de copias.", true], ["B", "responder solo al primer peticionario y archivar las demás como peticiones reiterativas, porque quedan resueltas con esa respuesta.", "Las peticiones reiterativas del artículo 19 son las que presenta de nuevo quien ya obtuvo respuesta; aquí son personas distintas que no han recibido ninguna.", false], ["C", "acumularlas en un solo expediente y resolverlas dentro de los treinta días siguientes, por tratarse de una petición colectiva.", "La ley no crea un término de treinta días para peticiones colectivas; el de treinta días es para consultas y aquí se pide información.", false]]}]}, {"comp": "atencion_usuario", "rol": "general", "tag": "Atención al usuario · Deberes y prohibiciones de las autoridades en la atención al público", "texto": "La nueva directora administrativa de un instituto descentralizado del orden departamental propone tres medidas para reducir costos: atender al público de manera presencial solo cuatro horas al día, de lunes a viernes; a la hora de cierre, pedir a las personas que ya están dentro de la sede esperando turno que regresen al día siguiente; y exigir a quienes soliciten la renovación de un permiso una copia del permiso anterior, que el mismo instituto expidió y conserva en su archivo.", "items": [{"id": "AU-131", "niv": 1, "e": "La primera medida es contraria a la ley, porque las autoridades deben garantizar atención personal al público", "f": "Ley 1437 de 2011, art. 7, num. 2", "o": [["A", "durante toda la jornada laboral de sus servidores, todos los días hábiles.", "La ley fija un mínimo de cuarenta horas semanales distribuidas en horarios que satisfagan las necesidades del servicio; no exige que coincidan con toda la jornada laboral.", false], ["B", "como mínimo durante treinta y seis horas a la semana.", "El mínimo legal es de cuarenta horas semanales, no de treinta y seis.", false], ["C", "como mínimo durante cuarenta horas a la semana.", "El numeral 2 del artículo 7 del CPACA exige garantizar atención personal al público como mínimo durante cuarenta horas a la semana; la medida propuesta solo suma veinte.", true]]}, {"id": "AU-132", "niv": 1, "e": "La segunda medida desconoce el deber de", "f": "Ley 1437 de 2011, art. 7, num. 3", "o": [["A", "expedir y actualizar cada año la carta de trato digno al usuario.", "La carta de trato digno (art. 7, num. 5) es un deber distinto, que no se relaciona con la atención de quienes están dentro de la sede.", false], ["B", "atender a todas las personas que hayan ingresado a sus oficinas dentro del horario normal de atención.", "El numeral 3 del artículo 7 del CPACA obliga a atender a todas las personas que hubieran ingresado a las oficinas dentro del horario normal de atención.", true], ["C", "habilitar canales electrónicos para recibir peticiones por fuera del horario de atención.", "Los canales electrónicos son otro deber de la entidad, pero lo que la medida vulnera es la atención de quienes ya ingresaron en el horario.", false]]}, {"id": "AU-133", "niv": 1, "e": "Respecto de la tercera medida, es correcto afirmar que", "f": "Ley 1437 de 2011, art. 9, num. 4", "o": [["A", "es válida, porque el permiso anterior es un requisito del trámite y la carga de aportarlo es del usuario.", "El CPACA prohíbe exigir documentos que reposen en la entidad, aunque sean necesarios para el trámite: el instituto debe consultarlos en su propio archivo.", false], ["B", "es válida solo si el instituto entrega la copia sin costo en una ventanilla distinta.", "La gratuidad de la copia no corrige el problema: la prohibición recae sobre la exigencia misma del documento que ya tiene la entidad.", false], ["C", "está prohibida, porque el instituto no puede exigir documentos que reposan en la propia entidad.", "El numeral 4 del artículo 9 del CPACA prohíbe a las autoridades exigir constancias, certificaciones o documentos que reposen en la respectiva entidad.", true]]}]}, {"comp": "atencion_usuario", "rol": "general", "tag": "Atención al usuario · Peticiones entre autoridades", "texto": "El martes 17 de agosto de 2027, la Secretaría de Salud de un municipio recibió un oficio de la personería municipal, que adelanta una investigación disciplinaria contra un servidor de esa secretaría. La personería pide información sobre las auditorías realizadas en el primer semestre y copia de unos documentos que contienen datos de historias clínicas de pacientes, necesarios para la investigación. Ese mismo día, un ciudadano pidió a la secretaría la misma información sobre las auditorías. No hay festivos en ese periodo.", "items": [{"id": "AU-146", "niv": 3, "e": "El último día para que la secretaría responda la solicitud de la personería es el", "f": "Ley 1755 de 2015, art. 1 (art. 30 de la Ley 1437 de 2011); cálculo de días hábiles", "o": [["A", "viernes 27 de agosto de 2027.", "Resulta de contar diez días calendario; el término se cuenta en días hábiles.", false], ["B", "martes 31 de agosto de 2027.", "Cuando una autoridad pide información o documentos a otra, el término es de no más de diez días (art. 30 del CPACA): 18 a 20 de agosto (3), 23 a 27 (8), 30 y 31 (10).", true], ["C", "martes 7 de septiembre de 2027.", "Aplica el término general de quince días; entre autoridades rige el término especial de diez días.", false]]}, {"id": "AU-147", "niv": 3, "e": "Frente a los documentos con datos de historias clínicas que pide la personería, la secretaría debe", "f": "Ley 1755 de 2015, art. 1 (art. 27 de la Ley 1437 de 2011)", "o": [["A", "entregarlos, porque la reserva no se opone a la personería que los requiere para sus funciones.", "El artículo 27 del CPACA dispone que el carácter reservado no es oponible a las autoridades administrativas que, siendo competentes, piden la información para el debido ejercicio de sus funciones, y les impone asegurar la reserva.", true], ["B", "entregarlos únicamente si la personería obtiene antes una orden judicial.", "La ley no exige orden judicial a la autoridad administrativa competente; basta que pida la información para el ejercicio de sus funciones.", false], ["C", "negarlos, porque la historia clínica solo puede entregarse al paciente o a quien este autorice expresamente.", "Esa limitación opera frente a particulares; el artículo 27 del CPACA hace inoponible la reserva a las autoridades administrativas competentes que la piden para ejercer sus funciones.", false]]}, {"id": "AU-148", "niv": 1, "e": "La petición del ciudadano sobre las auditorías debe resolverse", "f": "Ley 1755 de 2015, art. 1 (arts. 14, num. 1, y 30 de la Ley 1437 de 2011)", "o": [["A", "dentro de los treinta días siguientes, porque se trata de información que requiere consolidación.", "El término de treinta días es para consultas; la necesidad de consolidar datos permite, a lo sumo, ampliar el término informándolo antes de su vencimiento.", false], ["B", "dentro de los diez días siguientes a su recepción, por ser una petición de información.", "El numeral 1 del artículo 14 del CPACA fija diez días para las peticiones de documentos y de información.", true], ["C", "dentro de los quince días siguientes, porque el término de diez días solo aplica a las peticiones entre autoridades.", "El término de diez días también aplica a los particulares que piden documentos o información (art. 14, num. 1); el artículo 30 lo prevé además para las peticiones entre autoridades.", false]]}]}, {"comp": "atencion_usuario", "rol": "general", "tag": "Atención al usuario · Atención a usuarios alterados", "texto": "En la sala de atención de una procuraduría provincial, un ciudadano llega furioso porque, según él, lleva dos meses sin respuesta a una queja contra un funcionario de su municipio. Habla en voz alta, golpea el mostrador y dice que «nadie en esta entidad sirve para nada». Usted revisa el sistema y advierte que la respuesta se envió hace una semana a una dirección electrónica equivocada; en los últimos días, otros dos ciudadanos han reportado el mismo problema con las respuestas enviadas por correo electrónico. La entidad aplica los protocolos de servicio al ciudadano del DNP y de Función Pública.", "items": [{"id": "AU-161", "niv": 2, "e": "Mientras el ciudadano expresa su inconformidad, lo recomendable es", "f": "Departamento Nacional de Planeación, Protocolos de servicio al ciudadano (atención a personas alteradas)", "o": [["A", "dejar que se desahogue, escucharlo sin interrumpirlo y evitar calificar su estado de ánimo.", "Los Protocolos de servicio al ciudadano del DNP recomiendan dejar que el ciudadano se desahogue, escucharlo con atención sin interrumpirlo ni discutir, y evitar calificar su estado de ánimo.", true], ["B", "aclararle desde el inicio que usted no cometió el error, para que dirija su reclamo a la dependencia responsable.", "Los protocolos indican no tomar la situación como algo personal ni trasladar la responsabilidad: el ciudadano se queja del servicio de la entidad.", false], ["C", "pedirle de inmediato que se calme, porque no se le puede atender mientras esté alterado.", "Los protocolos de servicio recomiendan expresamente no pedirle al ciudadano que se calme ni calificar su estado de ánimo.", false]]}, {"id": "AU-162", "niv": 2, "e": "Si el ciudadano pasara a insultarlo a usted, el protocolo indica", "f": "Departamento Nacional de Planeación, Protocolos de servicio al ciudadano; Ley 1437 de 2011, art. 6, num. 4 y parágrafo", "o": [["A", "advertirle que su queja será rechazada por irrespetuosa si no cambia de actitud.", "La conducta del ciudadano en la sala no convierte en irrespetuosa su queja ya presentada, y la administración no puede usar ese incumplimiento para desconocer su derecho (art. 6, parágrafo, del CPACA).", false], ["B", "suspender la atención y retirarse del puesto hasta que el ciudadano se calme o abandone la sede de la procuraduría.", "Abandonar el puesto deja al ciudadano sin atención; el protocolo prevé exigir respeto y, si persiste, acudir al superior.", false], ["C", "exigirle respeto de manera cortés y, si persiste, llamar al superior para que asuma el manejo de la situación.", "Los Protocolos de servicio al ciudadano del DNP indican que, si un usuario es grosero o violento, se le exige respeto de manera cortés y, si persiste, se llama al supervisor para cederle el manejo de la situación.", true]]}, {"id": "AU-163", "niv": 1, "e": "Como el mismo problema ya afectó a otros ciudadanos, usted debe", "f": "Departamento Nacional de Planeación, Protocolos de servicio al ciudadano (atención a personas alteradas)", "o": [["A", "resolver cada caso por separado sin reportarlo, porque se trata de errores aislados.", "Tres casos con la misma causa indican una falla del proceso; tratarlos por separado impide corregirla.", false], ["B", "informar al jefe inmediato para que se dé una solución de fondo al problema.", "Los Protocolos de servicio al ciudadano del DNP recomiendan que, si el mismo problema ocurre con otro ciudadano, se informe al jefe inmediato para dar una solución de fondo.", true], ["C", "recomendar a los ciudadanos que en adelante pidan las respuestas solo por correo físico.", "Trasladar al ciudadano la carga de una falla interna no la soluciona; además, la entidad debe mantener los medios electrónicos de atención (art. 7, num. 8, del CPACA).", false]]}]}, {"comp": "atencion_usuario", "rol": "profesional", "tag": "Atención al usuario · Niveles profesional, asesor y ejecutivo · Lenguaje claro en las respuestas", "texto": "Usted es profesional especializado de la oficina jurídica de una entidad del orden nacional y debe revisar este borrador de respuesta a un ciudadano: «En atención a su solicitud radicada con el número 2027-0451, nos permitimos manifestarle que, de conformidad con lo preceptuado en la normatividad vigente y habida cuenta de que la documentación aportada fue objeto de verificación por parte de la SGAC, se procederá a efectuar la revisión de su caso una vez se surta el trámite interno correspondiente». El jefe le pide ajustar el texto según la Guía de lenguaje claro para servidores públicos de Colombia del DNP.", "items": [{"id": "AU-164", "niv": 1, "e": "Para hacer más clara la frase sobre la verificación de los documentos, conviene", "f": "Departamento Nacional de Planeación, Guía de lenguaje claro para servidores públicos de Colombia (utilice voz activa)", "o": [["A", "usar la voz activa, de modo que quien hace la acción sea el sujeto de la oración.", "La guía del DNP recomienda utilizar la voz activa, en la que el sujeto realiza la acción, porque es más simple y directa (por ejemplo, «la dependencia revisó los documentos»).", true], ["B", "reemplazar el verbo por un sustantivo, como «efectuar la verificación», para dar mayor precisión.", "La guía aconseja usar verbos en lugar de sustantivos: «verificar» es más claro que «efectuar la verificación».", false], ["C", "mantener la voz pasiva, porque le da a la respuesta el tono impersonal que exige un documento oficial.", "La guía recomienda lo contrario: la voz activa requiere menos palabras e involucra al lector, mientras la pasiva complica la frase.", false]]}, {"id": "AU-165", "niv": 2, "e": "Respecto de la sigla SGAC, la recomendación es", "f": "Departamento Nacional de Planeación, Guía de lenguaje claro para servidores públicos de Colombia; 10 pasos para comunicarse en lenguaje claro", "o": [["A", "escribirla en minúsculas y entre comillas para que el lector identifique que se trata de una dependencia.", "El formato de la sigla no resuelve el problema: el ciudadano sigue sin saber a qué dependencia se refiere.", false], ["B", "mantenerla, porque el ciudadano puede consultar su significado en la página web de la entidad.", "Obligar al lector a buscar el significado de la sigla interrumpe la lectura, que es justamente lo que el lenguaje claro busca evitar.", false], ["C", "evitarla y, si es indispensable usarla, escribir su significado completo la primera vez que aparezca.", "El material de lenguaje claro del DNP advierte que las siglas no son parte del lenguaje de los ciudadanos y recomienda, si es indispensable usarlas, desagregarlas por lo menos la primera vez que se mencionan.", true]]}, {"id": "AU-166", "niv": 2, "e": "Para iniciar la respuesta, lo más adecuado según el enfoque de lenguaje claro es", "f": "Departamento Nacional de Planeación, Guía de lenguaje claro para servidores públicos de Colombia (pensar en el lector; orden de la información)", "o": [["A", "comunicar desde la primera frase lo que el ciudadano necesita saber sobre su solicitud.", "La guía del DNP señala que las primeras frases deben comunicar algo importante para el lector y que la información debe ordenarse según sus necesidades.", true], ["B", "agradecer al ciudadano su confianza y presentar la misión de la entidad antes de entrar en materia.", "Una introducción institucional no responde a la pregunta del ciudadano; la guía pide que la frase inicial no lleve al lector a preguntarse para qué le sirve.", false], ["C", "citar primero las normas aplicables, para que el ciudadano conozca el sustento jurídico antes de la decisión.", "La guía advierte que los documentos redactados pensando en el sustento jurídico, y no en el lector, retrasan la información que el ciudadano necesita.", false]]}]}, {"comp": "gestion_documental", "rol": "general", "tag": "Gestión documental · Ciclo vital y clases de archivo", "texto": "Usted es auxiliar administrativo de una procuraduría provincial. La secretaría tiene en sus estantes tres grupos de carpetas: los expedientes de las actuaciones que se tramitan este año y que los profesionales consultan a diario; los expedientes cerrados en 2019, que la tabla de retención documental (TRD) señala como de conservación total y que ya cumplieron su tiempo en el archivo central; y unas cajas de expedientes cerrados en 2023, de consulta ocasional, que ya cumplieron su tiempo en el archivo de gestión. Un compañero nuevo opina que todo eso «es asunto del archivo central» y que la secretaría no tiene por qué ocuparse del cuidado de los documentos.", "items": [{"id": "GD-101", "niv": 1, "e": "Los expedientes de las actuaciones en trámite que los profesionales consultan a diario conforman", "f": "Ley 594 de 2000, arts. 3 y 23", "o": [["A", "el archivo central de la entidad, porque son documentos con plena vigencia jurídica.", "Al archivo central llegan los documentos transferidos por los archivos de gestión, cuya consulta ya no es frecuente aunque sigan vigentes (art. 23, lit. b, Ley 594 de 2000). Los expedientes en trámite permanecen en la oficina productora.", false], ["B", "un archivo de apoyo de la secretaría, distinto de los documentos de archivo.", "Los expedientes de las actuaciones son documentos de archivo producidos en ejercicio de funciones (art. 3, Ley 594 de 2000) y recorren el ciclo vital desde la fase de gestión; no son documentos de apoyo.", false], ["C", "el archivo de gestión de la dependencia, porque están en trámite y se consultan con frecuencia.", "El artículo 23 de la Ley 594 de 2000 define el archivo de gestión como la documentación sometida a continua utilización y consulta administrativa por la oficina productora, cuyo trámite se adelanta para resolver los asuntos iniciados.", true]]}, {"id": "GD-102", "niv": 2, "e": "Los expedientes cerrados en 2019, de conservación total según la TRD y con el tiempo cumplido en el archivo central, deben", "f": "Ley 594 de 2000, art. 23; Decreto 1080 de 2015, glosario (transferencia documental); Acuerdo 001 de 2024 del AGN, art. 4.4.4", "o": [["A", "permanecer en el archivo central de forma indefinida, porque allí se conservan los documentos vigentes.", "El archivo central guarda los documentos mientras cumplen el tiempo de retención fijado en la TRD; vencido ese tiempo, los de conservación permanente pasan al archivo histórico (art. 23, Ley 594 de 2000).", false], ["B", "pasar al archivo histórico mediante una transferencia secundaria.", "El archivo histórico recibe del archivo central los documentos de conservación permanente (art. 23, lit. c, Ley 594 de 2000). La entrega del archivo central al histórico es la transferencia secundaria (glosario del Decreto 1080 de 2015; art. 4.4.4 del Acuerdo 001 de 2024 del AGN).", true], ["C", "devolverse al archivo de gestión de la secretaría para su custodia definitiva.", "El ciclo vital avanza del archivo de gestión al central y de este al histórico; no se devuelven expedientes cerrados a la oficina productora para su custodia permanente (art. 23, Ley 594 de 2000).", false]]}, {"id": "GD-103", "niv": 2, "e": "La opinión del compañero sobre el cuidado de los documentos es equivocada, porque la Ley General de Archivos establece que", "f": "Ley 594 de 2000, art. 4, lit. d; Decreto 1080 de 2015, art. 2.8.2.5.3", "o": [["A", "solo los secretarios generales responden por los archivos, de modo que la secretaría de la provincial actúa por delegación.", "El artículo 16 de la Ley 594 de 2000 asigna a los secretarios generales responsabilidades sobre los archivos, pero no excluye a los demás servidores; el artículo 4, literal d, hace responsables a todos los servidores públicos del manejo de los documentos.", false], ["B", "los servidores públicos son responsables de la organización, conservación, uso y manejo de los documentos.", "Es el principio de responsabilidad del artículo 4, literal d, de la Ley 594 de 2000. Además, el artículo 2.8.2.5.3 del Decreto 1080 de 2015 extiende la responsabilidad de aplicar las normas archivísticas a servidores y contratistas.", true], ["C", "el cuidado de los documentos corresponde a los usuarios que los consultan y no a quienes los producen.", "La ley hace responsables a los servidores públicos de la organización y conservación de los documentos; a los particulares solo los hace responsables por el uso que hagan de ellos (art. 4, lit. d, Ley 594 de 2000).", false]]}]}, {"comp": "gestion_documental", "rol": "general", "tag": "Gestión documental · Tiempos de retención y transferencias primarias", "texto": "La secretaría de una procuraduría provincial prepara su plan de transferencias. Entre sus expedientes está uno de la subserie «Derechos de petición», que se abrió el 15 de agosto de 2021 con la petición de un ciudadano. La respuesta de fondo se dio y el trámite terminó; el expediente se cerró el 10 de noviembre de 2023. La tabla de retención documental (TRD) vigente asigna a esa subserie dos años en el archivo de gestión y ocho en el archivo central. Un compañero propone «mandar las cajas al archivo central con una nota» y, más adelante, agregar al expediente una carta de agradecimiento que el ciudadano envió después de la transferencia.", "items": [{"id": "GD-122", "niv": 2, "e": "Según la TRD, el tiempo de retención de ese expediente en el archivo de gestión se cumple el", "f": "Acuerdo 001 de 2024 del AGN, art. 4.3.1.9", "o": [["A", "15 de agosto de 2023.", "Esta fecha cuenta los dos años desde la apertura del expediente; los tiempos de retención empiezan a contarse una vez cerrada la unidad documental (art. 4.3.1.9 del Acuerdo 001 de 2024 del AGN).", false], ["B", "10 de noviembre de 2025.", "El art. 4.3.1.9 del Acuerdo 001 de 2024 del AGN dispone que, cerrada la unidad documental, empiezan a contarse los tiempos de retención de la TRD: dos años desde el cierre del 10 de noviembre de 2023 llevan al 10 de noviembre de 2025.", true], ["C", "10 de noviembre de 2033.", "Esta fecha suma los dos años de gestión y los ocho del archivo central; corresponde al final de la retención total, no al de la etapa en el archivo de gestión.", false]]}, {"id": "GD-123", "niv": 2, "e": "Para hacer la transferencia primaria de esa subserie al archivo central, la secretaría debe", "f": "Acuerdo 001 de 2024 del AGN, arts. 4.3.1.6 y 4.4.3", "o": [["A", "enviar las cajas con un oficio remisorio que indique cuántas carpetas van, porque el archivo central es quien elabora la descripción al recibirlas.", "Desde la fase de gestión las oficinas productoras deben elaborar los inventarios documentales (art. 4.3.1.6, par. 1, del Acuerdo 001 de 2024 del AGN), y la entrega al archivo central se soporta con ellos y con acta (art. 4.4.3, par. 4).", false], ["B", "esperar a que el archivo central solicite cada expediente cuando lo necesite un usuario.", "Las transferencias primarias se programan en un plan anual, de conformidad con los tiempos de retención de la TRD (art. 4.4.3 del Acuerdo 001 de 2024 del AGN); no dependen de solicitudes de consulta.", false], ["C", "entregarla por series, con el inventario documental, la hoja de control firmada y un acta de entrega firmada por quienes intervienen.", "El art. 4.4.3 del Acuerdo 001 de 2024 del AGN exige transferir por series y subseries (par. 1), con la hoja de control o índice electrónico firmado (par. 2), soportada en inventarios documentales y con un acta de entrega firmada por las partes intervinientes (par. 4).", true]]}, {"id": "GD-124", "niv": 2, "e": "Sobre la propuesta de agregar la carta de agradecimiento al expediente ya transferido, es acertado afirmar que", "f": "Acuerdo 001 de 2024 del AGN, art. 4.4.2, par.", "o": [["A", "no procede, porque una vez recibida la transferencia no se deben incorporar nuevos documentos al expediente.", "El parágrafo del art. 4.4.2 del Acuerdo 001 de 2024 del AGN establece que, una vez recibida la transferencia documental, no se deben incorporar nuevos documentos a los expedientes.", true], ["B", "procede solo si la carta llega dentro del primer año siguiente a la transferencia.", "La norma no fija un plazo de gracia: una vez recibida la transferencia no se deben incorporar nuevos documentos a los expedientes (art. 4.4.2, par., del Acuerdo 001 de 2024 del AGN).", false], ["C", "procede si el archivo central refolia el expediente y actualiza la hoja de control.", "La refoliación no habilita agregar documentos a un expediente transferido; el parágrafo del art. 4.4.2 del Acuerdo 001 de 2024 del AGN lo impide.", false]]}]}, {"comp": "gestion_documental", "rol": "general", "tag": "Gestión documental · Documento de archivo, acceso y salida de documentos (Ley 594 de 2000)", "texto": "En el archivo central de la Procuraduría atienden a un ciudadano que pide consultar los expedientes de contratos de suministro ya liquidados por la entidad, que no tienen carácter reservado. Un auxiliar nuevo duda si debe atenderlo, porque cree que el archivo «es solo para uso interno». Ese mismo día, un servidor de una procuraduría provincial solicita llevarse a su casa, durante el fin de semana, varios expedientes originales para adelantar un informe. Al final de la jornada, el auxiliar pregunta qué se entiende por documento de archivo, porque en las cajas también encontró revistas y folletos publicitarios.", "items": [{"id": "GD-150", "niv": 1, "e": "De acuerdo con la Ley General de Archivos, un documento de archivo es", "f": "Ley 594 de 2000, art. 3", "o": [["A", "el registro de información producida o recibida por una entidad en razón de sus actividades o funciones.", "El art. 3 de la Ley 594 de 2000 define el documento de archivo como el registro de información producida o recibida por una entidad pública o privada en razón de sus actividades o funciones.", true], ["B", "únicamente el documento original firmado que tiene valor histórico.", "La definición del art. 3 de la Ley 594 de 2000 no se limita a originales firmados ni a documentos con valor histórico; abarca la información producida o recibida en razón de las funciones, en todo el ciclo vital.", false], ["C", "cualquier papel que se encuentre en las instalaciones de la entidad, incluidas las revistas y los folletos publicitarios.", "Lo que define el documento de archivo no es su ubicación sino su origen: información producida o recibida en razón de las actividades o funciones (art. 3 de la Ley 594 de 2000).", false]]}, {"id": "GD-151", "niv": 2, "e": "Frente a la solicitud del ciudadano, lo correcto es reconocer que", "f": "Ley 594 de 2000, arts. 4 y 27", "o": [["A", "no puede consultarlos, porque los documentos del archivo central son de uso exclusivo de la entidad mientras no pasen al archivo histórico.", "La Ley 594 de 2000 no restringe la consulta a los documentos del archivo histórico; el acceso a los archivos públicos es un derecho ciudadano, salvo las excepciones de ley (arts. 4, lit. f, y 27).", false], ["B", "puede consultarlos solo si demuestra que fue parte en los contratos.", "El derecho de consulta no está limitado a quienes fueron parte: todas las personas pueden consultar los documentos de archivos públicos que no tengan carácter reservado (art. 27 de la Ley 594 de 2000).", false], ["C", "tiene derecho a consultarlos y a obtener copia, porque no tienen carácter reservado.", "El art. 4, lit. f, de la Ley 594 de 2000 consagra el acceso a los archivos públicos como un derecho de los ciudadanos, salvo las excepciones legales, y el art. 27 reconoce el derecho a consultarlos y a obtener copia si no tienen carácter reservado.", true]]}, {"id": "GD-152", "niv": 2, "e": "Respecto de la solicitud de llevarse los expedientes originales a la casa, es acertado afirmar que", "f": "Ley 594 de 2000, arts. 4 y 30", "o": [["A", "no es viable, porque solo por motivos legales puede autorizarse la salida temporal de documentos de archivo.", "El art. 30 de la Ley 594 de 2000 dispone que solo por motivos legales las entidades del Estado podrán autorizar la salida temporal de los documentos de archivo; adelantar un informe en casa no es uno de ellos.", true], ["B", "es viable porque se trata de un servidor de la misma entidad, que ya responde por los documentos.", "Ser servidor de la entidad no habilita la salida de los documentos: la Ley 594 de 2000 la limita a motivos legales (art. 30), y la responsabilidad de los servidores por los documentos (art. 4, lit. d) refuerza su custodia.", false], ["C", "es viable si el servidor firma un recibo en el que se compromete a devolverlos el lunes.", "Un recibo de préstamo no convierte la conveniencia del servidor en un motivo legal; solo por motivos legales puede autorizarse la salida temporal de documentos de archivo (art. 30 de la Ley 594 de 2000).", false]]}]}, {"comp": "documentos_oficina", "rol": "general", "tag": "Elaboración de documentos de oficina · La circular", "texto": "El procurador regional debe informar a todos los procuradores provinciales del departamento el nuevo horario de atención al público, que es igual para todas las sedes. Le pide a usted, auxiliar de la procuraduría regional, que proyecte el documento. Un compañero propone elaborar un acta «para que quede constancia», y otro sugiere escribir el encabezado «PARA:» con dos puntos, como en los memorandos, y omitir el saludo porque «las circulares son impersonales». La entidad sigue los lineamientos de la GTC 185 para la elaboración de sus comunicaciones.", "items": [{"id": "DO-110", "niv": 1, "e": "El tipo documental adecuado para comunicar el nuevo horario es", "f": "Guías institucionales que citan la GTC 185: UIS GGD.10, Senado GD-IT01, Alcaldía de Mitú (ver notas-do.md)", "o": [["A", "un certificado, porque da fe del horario vigente en todas las sedes.", "El certificado es un documento probatorio que da fe de un hecho; no sirve para comunicar instrucciones o información general a un grupo.", false], ["B", "una circular, porque comunica un mismo contenido a un grupo de destinatarios.", "Las guías de la UIS, del Senado y de la Alcaldía de Mitú, basadas en la GTC 185, definen la circular como la comunicación que da a conocer información de interés común, con el mismo contenido, a un grupo específico de destinatarios.", true], ["C", "un acta, porque deja constancia de una decisión de la regional.", "El acta registra lo sucedido, tratado y acordado en una reunión; no es el medio para comunicar una misma información a un grupo de destinatarios.", false]]}, {"id": "DO-111", "niv": 2, "e": "En el encabezado de la circular, el grupo destinatario se introduce con",
