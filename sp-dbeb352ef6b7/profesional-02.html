).", false], ["C", "procede el recurso de reposición, que se interpone, sustenta y decide en la misma audiencia.", "El literal c) del artículo 86 de la Ley 1474 de 2011 dispone que la decisión se adopta mediante resolución motivada que se entiende notificada en la audiencia, y que contra ella solo procede el recurso de reposición, que se interpone, sustenta y decide en la misma audiencia.", true]]}, {"id": "CE-163", "niv": 1, "e": "En el contrato abandonado, si la alcaldía declara la caducidad,", "f": "Ley 80 de 1993, arts. 8, num. 1, lit. c) y 18", "o": [["A", "lo dará por terminado y ordenará liquidarlo, sin indemnización alguna para el contratista.", "El artículo 18 de la Ley 80 dispone que la entidad, mediante acto motivado, da por terminado el contrato y ordena su liquidación en el estado en que se encuentre; no hay lugar a indemnización para el contratista, que queda sujeto a las sanciones e inhabilidades legales, y la declaratoria es constitutiva del siniestro de incumplimiento.", true], ["B", "deberá reconocer al contratista las utilidades dejadas de percibir por la terminación anticipada del contrato.", "La ley excluye cualquier indemnización al contratista cuando se declara la caducidad (art. 18, Ley 80).", false], ["C", "el contrato quedará suspendido hasta que el contratista reanude las obras dentro del plazo que fije la alcaldía.", "La caducidad termina el contrato y ordena su liquidación; no es una suspensión. Si la entidad decide no declararla, adopta medidas de control e intervención (art. 18, Ley 80).", false]]}]}, {"comp": "anticorrupcion", "rol": "profesional", "tag": "Estatuto Anticorrupción y transparencia · Niveles profesional, asesor y ejecutivo · Inhabilidades para contratar por actos de corrupción", "texto": "Usted es profesional de una procuraduría delegada con funciones preventivas en contratación estatal y revisa los contratos de una gobernación. Encuentra tres situaciones. Primera: el señor R, condenado mediante sentencia ejecutoriada por peculado por apropiación cometido en otro departamento, presentó oferta para un contrato de prestación de servicios con la gobernación. Segunda: la sociedad Obras del Llano S.A.S., cuyo representante legal es el mismo señor R, participa en una licitación de la gobernación. Tercera: durante la ejecución de un contrato de suministro, el socio controlante de la empresa contratista fue condenado, con sentencia ejecutoriada, por cohecho propio, y la empresa anunció que renunciará al contrato.", "items": [{"id": "AC-101", "niv": 1, "e": "Frente a la oferta presentada por el señor R, la gobernación debe tener en cuenta que", "f": "Ley 80 de 1993, art. 8, num. 1, lit. j (modificado por la Ley 2014 de 2019, art. 2)", "o": [["A", "está inhabilitado para contratar con las entidades estatales por su condena por un delito contra la Administración Pública.", "El literal j) del numeral 1 del artículo 8 de la Ley 80 de 1993, modificado por el artículo 2 de la Ley 2014 de 2019, en su texto vigente, inhabilita a las personas naturales declaradas responsables judicialmente por delitos contra la Administración Pública, como el peculado.", true], ["B", "solo está inhabilitado para contratar con la entidad territorial afectada por el peculado, por lo que puede contratar con la gobernación.", "El literal j) del numeral 1 del artículo 8 de la Ley 80 de 1993 no limita la inhabilidad a la entidad perjudicada: impide celebrar contratos con las entidades estatales en general.", false], ["C", "solo estará inhabilitado mientras cumple la pena privativa de la libertad, y después puede contratar sin restricción.", "La inhabilidad del literal j) es una consecuencia autónoma de la condena por delitos contra la Administración Pública y no se limita al tiempo de cumplimiento de la pena.", false]]}, {"id": "AC-102", "niv": 2, "e": "Respecto de la sociedad Obras del Llano S.A.S., es acertado concluir que", "f": "Ley 80 de 1993, art. 8, num. 1, lit. j (modificado por la Ley 2014 de 2019, art. 2)", "o": [["A", "puede participar, porque la persona jurídica es distinta de sus administradores y la condena solo afecta al señor R.", "La ley extiende expresamente la inhabilidad a las sociedades en las que el condenado actúe como representante legal, de modo que la separación de personalidades no permite eludirla.", false], ["B", "puede participar si el señor R le transfiere sus acciones antes del cierre, aunque siga como representante legal.", "La extensión no depende solo de la calidad de socio: también alcanza a las sociedades en que el condenado es representante legal o administrador, por lo que la venta de acciones no resuelve la situación.", false], ["C", "también está inhabilitada, porque la inhabilidad se extiende a las sociedades que el condenado representa legalmente.", "El literal j) del numeral 1 del artículo 8 de la Ley 80 de 1993 dispone que la inhabilidad se extiende a las sociedades de las que hagan parte los condenados en calidad de administradores, representantes legales, miembros de junta directiva o socios controlantes, a sus matrices y a sus subordinadas.", true]]}, {"id": "AC-103", "niv": 3, "e": "Ante la inhabilidad que sobrevino a la empresa contratista del suministro, la gobernación debe", "f": "Ley 80 de 1993, art. 9, par. 1 (adicionado por la Ley 2014 de 2019)", "o": [["A", "aceptar la renuncia al contrato y liquidarlo, reconociendo al contratista lo ejecutado y la utilidad esperada.", "Cuando la inhabilidad sobreviniente es la del literal j), la ley excluye la renuncia del contrato y no reconoce indemnización al contratista inhábil.", false], ["B", "ordenar mediante acto administrativo motivado la cesión unilateral del contrato, sin indemnización para el contratista.", "El parágrafo 1 del artículo 9 de la Ley 80 de 1993, adicionado por la Ley 2014 de 2019, establece que, si la inhabilidad sobreviniente es la del literal j), no procede la renuncia y la entidad ordena por acto motivado la cesión unilateral, sin indemnización alguna; la entidad determina el cesionario.", true], ["C", "suspender el contrato hasta que la sentencia sea revisada por la Corte Suprema y decidir entonces si lo termina.", "La sentencia ya está ejecutoriada, y la ley prevé una consecuencia inmediata y específica, la cesión unilateral; no prevé suspender el contrato a la espera de una eventual revisión.", false]]}]}, {"comp": "anticorrupcion", "rol": "general", "tag": "Estatuto Anticorrupción y transparencia · Supervisión e interventoría de contratos", "texto": "Una alcaldía celebró dos contratos. El primero es de suministro de papelería por valor moderado. El segundo es de obra para construir un puente vehicular, cuyo seguimiento exige conocimientos especializados en ingeniería estructural. La secretaria general debe decidir cómo se hará la vigilancia de cada contrato y si, para el puente, la entidad puede encargar a un interventor externo las actividades técnicas y dejar en cabeza de un servidor de planta el seguimiento administrativo y financiero. El supervisor de la papelería, por su parte, nota retrasos en las entregas y se pregunta qué puede hacer.", "items": [{"id": "AC-110", "niv": 1, "e": "La vigilancia del contrato de obra del puente puede contratarse con un interventor externo porque", "f": "Ley 1474 de 2011, art. 83", "o": [["A", "el seguimiento del contrato requiere conocimiento especializado en la materia.", "El artículo 83 de la Ley 1474 de 2011 define la interventoría como el seguimiento técnico que realiza una persona natural o jurídica contratada para tal fin, cuando el seguimiento del contrato suponga conocimiento especializado en la materia o cuando la complejidad o la extensión del mismo lo justifiquen.", true], ["B", "la ley prohíbe que los servidores públicos supervisen contratos de obra, cualquiera que sea su valor.", "La ley no prohíbe la supervisión de contratos de obra por servidores públicos; la interventoría se justifica cuando el seguimiento requiere conocimiento especializado o la complejidad o extensión del contrato lo amerita.", false], ["C", "la ley reserva la supervisión a los contratos de bienes y servicios, de modo que las obras requieren interventor.", "La supervisión es la regla cuando no se requieren conocimientos especializados, y la ejerce la propia entidad; la interventoría procede en los supuestos que la ley señala.", false]]}, {"id": "AC-111", "niv": 3, "e": "Sobre la posibilidad de combinar interventoría y supervisión en el contrato del puente, es correcto afirmar que", "f": "Ley 1474 de 2011, art. 83", "o": [["A", "es obligatoria, porque todo contrato de obra debe tener simultáneamente un supervisor y un interventor con las mismas funciones.", "La ley no impone la concurrencia de supervisor e interventor con las mismas funciones; la regla general es la contraria, salvo que la entidad divida la vigilancia.", false], ["B", "está prohibida, porque la ley impide que supervisor e interventor vigilen un mismo contrato, aunque sea en aspectos distintos.", "La no concurrencia es la regla general, pero la misma norma permite dividir la vigilancia del contrato principal entre interventor y supervisor.", false], ["C", "es posible, porque la entidad puede dividir la vigilancia: el interventor asume las actividades técnicas y la entidad las demás, por medio del supervisor.", "El artículo 83 de la Ley 1474 de 2011 establece que, por regla general, la supervisión y la interventoría no concurren en un mismo contrato, pero la entidad puede dividir la vigilancia: en el contrato de interventoría se indican las actividades técnicas a cargo del interventor, y las demás quedan a cargo de la entidad a través del supervisor.", true]]}, {"id": "AC-112", "niv": 1, "e": "Ante los retrasos en las entregas de papelería, el supervisor", "f": "Ley 1474 de 2011, art. 84", "o": [["A", "debe esperar a la liquidación del contrato para dejar constancia de los incumplimientos en el acta final, y solo entonces informar a la entidad.", "La ley exige informar oportunamente los hechos que puedan poner en riesgo el cumplimiento, no esperar a la liquidación.", false], ["B", "puede pedir al contratista informes y explicaciones, y debe informar a la entidad los hechos que pongan en riesgo el cumplimiento.", "El artículo 84 de la Ley 1474 de 2011 faculta a supervisores e interventores para solicitar informes, aclaraciones y explicaciones sobre la ejecución, y les impone el deber de mantener informada a la entidad de los hechos que puedan constituir actos de corrupción o que pongan o puedan poner en riesgo el cumplimiento del contrato.", true], ["C", "solo puede comunicarse con el contratista a través de la oficina jurídica de la entidad.", "La ley faculta al supervisor para solicitar directamente al contratista informes, aclaraciones y explicaciones sobre el desarrollo de la ejecución.", false]]}]}, {"comp": "anticorrupcion", "rol": "general", "tag": "Estatuto Anticorrupción y transparencia · Trámite de impedimentos de autoridades territoriales", "texto": "El alcalde de un municipio debe resolver una solicitud de licencia de funcionamiento presentada por una empresa de la que su cónyuge es socia mayoritaria. El alcalde reconoce la causal de impedimento, pero no sabe a quién debe remitir la actuación, pues no tiene superior jerárquico dentro de la administración municipal. Además, un ciudadano que conoce la situación anuncia que, si el alcalde no se aparta del asunto, presentará una recusación en su contra. El secretario jurídico prepara un memorando sobre el trámite.", "items": [{"id": "AC-129", "niv": 3, "e": "Como el alcalde no tiene superior ni cabeza de sector a quien remitir la actuación, debe enviarla", "f": "Ley 1437 de 2011 (CPACA), art. 12", "o": [["A", "al procurador regional, por tratarse de una autoridad territorial.", "El artículo 12 del CPACA dispone que, a falta de superior y de cabeza del sector administrativo, la actuación se remite al Procurador General de la Nación si se trata de autoridades nacionales o del alcalde mayor del Distrito Capital, o al procurador regional en el caso de las autoridades territoriales.", true], ["B", "al concejo municipal, que decide en plenaria si acepta el impedimento.", "El artículo 12 del CPACA no asigna esta decisión al concejo municipal; prevé un orden de autoridades que termina en el Ministerio Público.", false], ["C", "al gobernador del departamento, por ser el superior administrativo de los alcaldes.", "El artículo 12 del CPACA no remite al gobernador: a falta de superior y de cabeza de sector, la decisión corresponde al Ministerio Público.", false]]}, {"id": "AC-130", "niv": 2, "e": "Recibida la actuación, la autoridad competente debe decidir sobre el impedimento", "f": "Ley 1437 de 2011 (CPACA), art. 12", "o": [["A", "dentro de los treinta días siguientes a su recibo, después de practicar pruebas y escuchar en audiencia al alcalde y a la empresa.", "La ley ordena decidir de plano y dentro de un término corto, sin un periodo probatorio ni una audiencia como los que plantea esta opción.", false], ["B", "dentro de los diez días siguientes a su recibo y, si lo acepta, señalar quién conoce del asunto, incluso un funcionario ad hoc.", "El artículo 12 del CPACA establece que la autoridad competente decide de plano dentro de los diez días siguientes al recibo y que, si acepta el impedimento, determina a quién corresponde el conocimiento del asunto y puede, si es preciso, designar un funcionario ad hoc.", true], ["C", "en cualquier tiempo, y mientras tanto el alcalde puede continuar el trámite y expedir la licencia.", "La ley fija un término para decidir, y la actuación se suspende mientras se resuelve el impedimento; el alcalde no puede seguir conociendo el asunto.", false]]}, {"id": "AC-131", "niv": 2, "e": "Si el ciudadano presenta la recusación, el alcalde debe manifestar si acepta o no la causal dentro de los", "f": "Ley 1437 de 2011 (CPACA), art. 12", "o": [["A", "tres días siguientes a la fecha de su formulación.", "Los tres días corresponden al término para que el servidor se declare impedido y remita la actuación, no al pronunciamiento del recusado.", false], ["B", "cinco días siguientes a la fecha de su formulación.", "El artículo 12 del CPACA dispone que, en caso de recusación, el recusado manifiesta si acepta o no la causal invocada dentro de los cinco días siguientes a la fecha de su formulación.", true], ["C", "diez días siguientes a la fecha de su formulación.", "Los diez días corresponden al término de la autoridad competente para decidir sobre el impedimento o la recusación, no al pronunciamiento del recusado.", false]]}]}, {"comp": "comportamental", "rol": "profesional", "tag": "Competencias comportamentales (Diccionario de la Procuraduría) · Niveles profesional, asesor y ejecutivo · Responsabilidad con la organización", "texto": "Usted es profesional universitario de una procuraduría provincial del Tolima y su empleo exige la competencia Responsabilidad con la organización en nivel B. El plan de acción de la provincial fija como meta evacuar el 60 % de las indagaciones previas antes de octubre. Al revisar los expedientes que le repartieron, advierte que muchas quejas llegan sin los datos mínimos para identificar al servidor señalado, porque el formato de recepción de quejas no los pide, y eso obliga a hacer requerimientos que retrasan cada trámite. Además, un compañero comenta en una reunión que la meta del plan de acción «es asunto del procurador provincial, no de los sustanciadores».", "items": [{"id": "CO-101", "niv": 1, "e": "Frente a las quejas que llegan sin los datos de identificación, la actuación que corresponde al nivel B de Responsabilidad con la organización es", "f": "Diccionario de Competencias Comportamentales PGN, Responsabilidad con la organización, nivel B", "o": [["A", "requerir los datos faltantes en cada uno de los expedientes que le asignen, hasta completarlos todos.", "Corresponde al nivel C de la misma competencia: buscar solución a los problemas o situaciones que le asignen en cumplimiento de sus funciones. Resuelve cada caso, pero no propone la mejora del proceso que exige el nivel B.", false], ["B", "corregir en sus propios expedientes las fallas de información a medida que las vaya encontrando.", "Corregir errores cuando se encuentran fallas en la actividad a cargo es una conducta de Autogestión, nivel D. Mejora su propio trabajo, pero no propone la mejora del proceso institucional que describe Responsabilidad con la organización en nivel B.", false], ["C", "proponer al procurador provincial ajustar el formato de recepción para que pida esos datos desde el inicio.", "El nivel B de Responsabilidad con la organización describe a quien contribuye a los objetivos de la entidad y propone mejoras; una de sus conductas es buscar de manera permanente la mejora de los procesos institucionales. Ajustar el formato ataca la causa del problema en el proceso y no solo en un expediente.", true]]}, {"id": "CO-102", "niv": 2, "e": "Ante el comentario del compañero sobre la meta del plan de acción, la postura que refleja el nivel B de Responsabilidad con la organización es", "f": "Diccionario de Competencias Comportamentales PGN, Responsabilidad con la organización, nivel B", "o": [["A", "pedir que la meta se reparta en cuotas individuales y responder únicamente por la cuota que le asignen.", "Limita el compromiso a una tarea asignada, lo que se acerca a los niveles C y D (dirigir el trabajo a los resultados que le asignan, cumplir las tareas). El nivel B se caracteriza por asumir como propios los objetivos de la entidad.", false], ["B", "concentrarse en entregar con calidad las actuaciones que le repartan, porque eso es lo que depende directamente de usted.", "Refleja el nivel D (cumplir las tareas asignadas con los parámetros de calidad). El nivel B pide algo más: enfocar la propia actividad hacia el cumplimiento de los objetivos de la institución.", false], ["C", "orientar su trabajo hacia la meta institucional y contribuir a que la provincial la cumpla.", "El nivel B de Responsabilidad con la organización incluye enfocar la propia actividad hacia el cumplimiento de los objetivos de la institución. La meta del plan de acción es un objetivo de la entidad, y el servidor de nivel B la asume como propia y aporta a lograrla.", true]]}, {"id": "CO-103", "niv": 3, "e": "De las siguientes actuaciones, la que el diccionario ubica en Responsabilidad con la organización, nivel B, y no en Cumplimiento de parámetros de trabajo, nivel B, es", "f": "Diccionario de Competencias Comportamentales PGN, Responsabilidad con la organización, nivel B", "o": [["A", "procurar de manera constante que funcionen mejor los procesos de la institución en los que interviene.", "El diccionario asocia al nivel B de Responsabilidad con la organización la búsqueda permanente de la mejora de los procesos institucionales. Las otras dos conductas pertenecen al nivel B de Cumplimiento de parámetros de trabajo.", true], ["B", "definir objetivos para su equipo de trabajo que estén alineados con los procedimientos ya definidos.", "También pertenece al nivel B de Cumplimiento de parámetros de trabajo, cuya segunda conducta es definir objetivos para el equipo alineados con procedimientos definidos.", false], ["C", "seguir las reglas y los lineamientos establecidos para desempeñarse en los distintos procesos de la provincial.", "Es una conducta del nivel B de Cumplimiento de parámetros de trabajo (seguir reglas y lineamientos en diferentes procesos organizacionales), no de Responsabilidad con la organización.", false]]}]}, {"comp": "comportamental", "rol": "profesional", "tag": "Competencias comportamentales (Diccionario de la Procuraduría) · Niveles profesional, asesor y ejecutivo · Orientación a resultados", "texto": "Usted es asesor de la Oficina de Planeación de la Procuraduría y su empleo exige Orientación a resultados en nivel A. El plan estratégico de la entidad fijó para este año reducir en 20 % el tiempo promedio de las actuaciones preventivas. En septiembre, las dependencias ya alcanzaron una reducción del 18 %, pero un recorte presupuestal disminuye los recursos para desplazamientos del último trimestre. El jefe de la oficina le pide proponer qué hacer con la meta y cómo enfrentar el recorte, y luego revisar el desempeño del equipo de planeación.", "items": [{"id": "CO-113", "niv": 2, "e": "Al formular la propuesta sobre la meta para el siguiente año, lo que corresponde al nivel A de Orientación a resultados es", "f": "Diccionario de Competencias Comportamentales PGN, Orientación a resultados, nivel A", "o": [["A", "proponer que se mantenga la meta del 20 % un año más, para consolidar lo logrado antes de fijar otra.", "Es una decisión prudente, pero mantener la misma meta no corresponde al nivel A de Orientación a resultados, cuya conducta es fijar metas que trasciendan los propósitos actuales.", false], ["B", "realizar todas las acciones necesarias para alcanzar el 20 % previsto, superando los obstáculos que surjan.", "Realizar todas las acciones para alcanzar los objetivos enfrentando los obstáculos es una conducta del nivel B. El nivel A va más allá: fija metas que trascienden los propósitos actuales.", false], ["C", "proponer una meta que trascienda el propósito actual y comprometer tiempo y recursos del equipo para lograrla.", "El nivel A de Orientación a resultados consiste en establecer, alcanzar y superar metas desafiantes; sus conductas son fijar metas que trasciendan los propósitos actuales y comprometer recursos y tiempos para mejorar las metas establecidas.", true]]}, {"id": "CO-114", "niv": 3, "e": "Frente al recorte presupuestal del último trimestre, lo que refleja el nivel A de Orientación a resultados es", "f": "Diccionario de Competencias Comportamentales PGN, Orientación a resultados, nivel A", "o": [["A", "asumir personalmente la responsabilidad por el resultado de las actividades que tiene a su cargo.", "Asumir la responsabilidad por los resultados de sus actividades es una conducta del nivel D. Es valiosa, pero no responde a lo que pide el nivel A ante una meta institucional.", false], ["B", "comprometer recursos y tiempos del equipo, redistribuyéndolos, para sostener la meta y procurar mejorarla.", "En el nivel A de Orientación a resultados el servidor compromete recursos y tiempos para mejorar las metas establecidas y busca superar los resultados esperados de metas desafiantes; un recorte no lo lleva a renunciar a ellas.", true], ["C", "solicitar que se rebaje la meta, porque las condiciones en que se fijó cambiaron.", "Ajustar la meta a la baja no refleja ninguna conducta de esta competencia, cuyo núcleo es lograr las metas propuestas; en el nivel A se trata de alcanzarlas y superarlas.", false]]}, {"id": "CO-115", "niv": 3, "e": "Al revisar el desempeño del equipo, la conducta que el diccionario asocia con el nivel C de Orientación a resultados, y no con el nivel A, es", "f": "Diccionario de Competencias Comportamentales PGN, Orientación a resultados, nivel C", "o": [["A", "impulsar que los miembros del grupo trabajen coordinados para que sus objetivos y metas encajen.", "El nivel C de Orientación a resultados (realizar y superar las metas del grupo de trabajo) incluye promover el trabajo en equipo como articulación de objetivos y metas propuestas.", true], ["B", "integrar grupos de personas para lograr objetivos comunes.", "Es una conducta del nivel A de Trabajo en equipo, otra competencia del diccionario; no aparece en Orientación a resultados.", false], ["C", "fijar metas que vayan más allá de los propósitos actuales de la entidad.", "Es una conducta del nivel A, no del C.", false]]}]}, {"comp": "comportamental", "rol": "profesional", "tag": "Competencias comportamentales (Diccionario de la Procuraduría) · Niveles profesional, asesor y ejecutivo · Orientación a resultados", "texto": "Usted es asesor del despacho de una procuraduría regional de instrucción y su empleo exige Orientación a resultados en nivel A. El plan de acción fijó como meta anual cerrar 300 procesos disciplinarios con más de tres años de antigüedad. En junio la meta ya está cumplida. Al mismo tiempo, la regional enfrenta la falta de dos notificadores, lo que retrasa varias etapas. En el despacho trabajan un profesional cuyo empleo exige el nivel B de la misma competencia y un técnico con nivel D.", "items": [{"id": "CO-134", "niv": 3, "e": "Con la meta de procesos antiguos cumplida en junio, lo que refleja el nivel A de Orientación a resultados es", "f": "Diccionario de Competencias Comportamentales PGN, Orientación a resultados, nivel A", "o": [["A", "mantener el ritmo hasta diciembre para cerrar el año por encima de lo previsto, sin modificar la meta.", "Alcanzar y superar la meta de la dependencia corresponde al nivel B. El nivel A pide además mejorar las metas establecidas, comprometiendo recursos y tiempos.", false], ["B", "proponer una meta más exigente para el segundo semestre y destinar tiempo y personal a alcanzarla.", "En el nivel A de Orientación a resultados el servidor fija metas que trascienden los propósitos actuales y compromete recursos y tiempos para mejorar las metas establecidas.", true], ["C", "reasignar al personal a otras tareas pendientes de la regional, pues la meta institucional ya se cumplió.", "Dar por terminado el esfuerzo al cumplir la meta no refleja ninguna conducta de la competencia en nivel A, que busca superar los resultados esperados.", false]]}, {"id": "CO-135", "niv": 2, "e": "Para el profesional del despacho, cuyo empleo exige el nivel B, la conducta que corresponde a su nivel frente a la falta de notificadores es", "f": "Diccionario de Competencias Comportamentales PGN, Orientación a resultados, nivel B", "o": [["A", "reorganizar sus propias actividades ante la falta de notificadores y asumirla como un reto.", "Reorganizar las propias actividades ante cambios del entorno y asumirlos como un reto es la conducta del nivel D de Adaptación al cambio. No implica emprender acciones para remover el obstáculo y alcanzar el objetivo, como pide el nivel B de Orientación a resultados.", false], ["B", "informar la falta de notificadores y esperar a que se provean los cargos para recuperar el ritmo.", "Se detiene ante el obstáculo. El nivel B pide realizar todas las acciones para alcanzar los objetivos enfrentando los obstáculos que se presentan.", false], ["C", "acudir a los otros medios de notificación previstos en la ley para que los procesos no se detengan.", "El nivel B de Orientación a resultados incluye realizar todas las acciones necesarias para alcanzar los objetivos, enfrentando los obstáculos que se presentan; usar los demás medios de notificación disponibles enfrenta el obstáculo sin frenar las metas.", true]]}, {"id": "CO-136", "niv": 1, "e": "Para el técnico del despacho, la conducta que el diccionario describe en el nivel D de Orientación a resultados es", "f": "Diccionario de Competencias Comportamentales PGN, Orientación a resultados, nivel D", "o": [["A", "responder por lo que resulte de su propio trabajo.", "El nivel D de Orientación a resultados (alcanzar las metas en desarrollo de sus funciones) incluye asumir la responsabilidad por los resultados de sus actividades y cumplir con oportunidad las funciones asignadas.", true], ["B", "corregir los errores que encuentre en las actividades a su cargo.", "Corregir errores al encontrar fallas en las actividades a cargo es una conducta del nivel D de Autogestión, no de Orientación a resultados.", false], ["C", "hacer esfuerzos adicionales para cumplir las metas asignadas a su grupo.", "Es una conducta del nivel C, superior al D.", false]]}]}, {"comp": "comportamental", "rol": "profesional", "tag": "Competencias comportamentales (Diccionario de la Procuraduría) · Niveles profesional, asesor y ejecutivo · Responsabilidad con la organización", "texto": "Usted es profesional universitario de una procuraduría regional de instrucción y su empleo exige Responsabilidad con la organización en nivel B. Uno de los objetivos de la regional es reducir el riesgo de prescripción en los procesos disciplinarios. Al revisar su inventario, usted identifica que varios expedientes llegan al despacho con meses de retraso porque el reparto desde la oficina de correspondencia se hace de forma manual una vez al mes. Un compañero opina que proponer mejoras «no es función de los profesionales, sino de la Oficina de Planeación».", "items": [{"id": "CO-155", "niv": 2, "e": "Frente al retraso en el reparto, lo que corresponde al nivel B de Responsabilidad con la organización es", "f": "Diccionario de Competencias Comportamentales PGN, Responsabilidad con la organización, nivel B", "o": [["A", "documentar el patrón y proponer una mejora del reparto que reduzca el riesgo en toda la regional.", "El nivel B de Responsabilidad con la organización consiste en contribuir a los objetivos de la entidad y proponer estrategias de mejoramiento continuo, buscando la mejora de los procesos institucionales.", true], ["B", "resolver uno por uno los casos de demora que le asignen, a medida que vayan apareciendo.", "Buscar solución a los problemas que le asignen es una conducta del nivel C. El nivel B apunta a la mejora de los procesos institucionales.", false], ["C", "hacer seguimiento sistemático a sus propios expedientes para generar acciones de mejora en su trámite.", "Generar acciones de mejoramiento a partir del seguimiento de las propias actividades es el nivel C de Orientación al mejoramiento continuo. Se queda en el trabajo propio y no propone la mejora del proceso de la regional, como el nivel B de Responsabilidad con la organización.", false]]}, {"id": "CO-156", "niv": 2, "e": "Ante la opinión del compañero sobre quién debe proponer mejoras, la respuesta coherente con el nivel B de Responsabilidad con la organización es", "f": "Diccionario de Competencias Comportamentales PGN, Responsabilidad con la organización, nivel B", "o": [["A", "que las mejoras deben proponerse solo cuando el jefe inmediato las solicite de manera expresa y por escrito.", "Condiciona la mejora a una instrucción del jefe, lo que se parece a seguir pautas (Cumplimiento de parámetros de trabajo, nivel C) y no al compromiso que describe el nivel B.", false], ["B", "que tiene razón y que lo mejor es limitarse a cumplir bien las tareas asignadas.", "Limitarse a cumplir las tareas asignadas describe el nivel D, inferior al exigido para este empleo.", false], ["C", "que buscar la mejora de los procesos en que participa también es parte del compromiso con la entidad.", "El nivel B de Responsabilidad con la organización incluye, como conducta, buscar permanentemente la mejora de los procesos institucionales, sin limitarla a una dependencia.", true]]}, {"id": "CO-157", "niv": 1, "e": "Una vez la dirección adopta la mejora del reparto, lo que refleja el nivel B de Responsabilidad con la organización es", "f": "Diccionario de Competencias Comportamentales PGN, Responsabilidad con la organización, nivel B", "o": [["A", "pedir que el aporte quede registrado como logro en su evaluación de desempeño.", "Buscar el reconocimiento del aporte no es una conducta del nivel B; el diccionario menciona los reconocimientos especiales como consecuencia en el nivel A, no como algo que se solicita.", false], ["B", "seguir revisando el proceso para identificar nuevas oportunidades de mejora.", "El diccionario describe en el nivel B la búsqueda permanente de la mejora de los procesos institucionales; la mejora no termina con la primera propuesta.", true], ["C", "dar el asunto por resuelto, pues la propuesta ya cumplió su propósito.", "Contradice el carácter permanente de la búsqueda de mejoras que el diccionario atribuye al nivel B.", false]]}]}, {"comp": "comportamental", "rol": "profesional", "tag": "Competencias comportamentales (Diccionario de la Procuraduría) · Niveles profesional, asesor y ejecutivo · Objetividad", "texto": "Usted es profesional universitario de la Oficina de Planeación de la Procuraduría y su empleo exige Objetividad en nivel B. Varios ciudadanos se han quejado del horario del centro de atención al público de la sede central, y el jefe le pide recomendar si conviene ampliarlo. Usted dispone de los registros de afluencia por franja horaria de los últimos dos años, que muestran además un aumento recurrente de la demanda en diciembre.", "items": [{"id": "CO-179", "niv": 1, "e": "Para responder al jefe, lo que refleja el nivel B de Objetividad es", "f": "Diccionario de Competencias Comportamentales PGN, Objetividad, nivel B", "o": [["A", "recomendar la ampliación del horario, porque varios ciudadanos se han quejado del horario actual.", "Basa la posición en las quejas y no en los datos cuantitativos disponibles, como exige la definición de la competencia.", false], ["B", "consultar a los funcionarios del centro de atención y acoger la opinión de la mayoría.", "Decide por opinión mayoritaria y no por criterios cuantitativos ponderados, que es lo que pide el nivel B.", false], ["C", "evaluar y ponderar los datos de afluencia por franja horaria antes de recomendar una decisión.", "El nivel B de Objetividad (aportar criterios técnicos para las actividades laborales) incluye evaluar y ponderar la información que lleva a tomar decisiones. La competencia se define como adoptar posiciones basadas en criterios cuantitativos.", true]]}, {"id": "CO-180", "niv": 2, "e": "Frente al aumento recurrente de la demanda en diciembre, lo coherente con el nivel B de Objetividad es", "f": "Diccionario de Competencias Comportamentales PGN, Objetividad, nivel B", "o": [["A", "proponer desde ahora una solución técnica, como reforzar la atención en diciembre.", "Una de las conductas del nivel B de Objetividad es proponer soluciones técnicas para anticiparse a los problemas.", true], ["B", "esperar a diciembre para confirmar si la demanda realmente aumenta antes de tomar medidas.", "Desaprovecha los datos que ya muestran la tendencia; el nivel B pide proponer soluciones técnicas para anticiparse a los problemas.", false], ["C", "comparar en enero lo programado con lo ejecutado en diciembre para ajustar el año siguiente.", "Comparar lo programado con lo ejecutado es una conducta del nivel D de Objetividad. No se anticipa al problema.", false]]}, {"id": "CO-181", "niv": 2, "e": "Si el empleo exigiera el nivel A de Objetividad, se esperaría además que el servidor", "f": "Diccionario de Competencias Comportamentales PGN, Objetividad, nivel A", "o": [["A", "estandarizara y normalizara cada acción para desarrollar sus funciones.", "Es una conducta del nivel D de Objetividad.", false], ["B", "diseñara indicadores verificables que él y otros pudieran usar para medir los resultados de la atención.", "El nivel A de Objetividad consiste en construir indicadores demostrables para ser utilizados por sí mismo o por otros en el análisis de situaciones complejas, y en construir indicadores para medir los resultados.", true], ["C", "analizara causas y efectos de los problemas de atención y tomara decisiones medibles y cuantificables.", "Analizar causas y efectos y tomar decisiones medibles es una conducta del nivel A de Pensamiento analítico, otra competencia del diccionario.", false]]}]}];

function save(){try{localStorage.setItem(KEY, JSON.stringify(ST))}catch(e){}}
let ST = load();
ST.r = ST.r || {};
$('#tit').textContent = CFG.titulo;
const ITEMS = [];
DATA.forEach(c => c.items.forEach(it => { it.caso = c; ITEMS.push(it); }));

function justHTML(it){
  return '<div class="just">' + it.o.map(o => `<div><b>${o[0]}.</b> <span class="${o[3]?'okt':'not'}">${o[3]?'Es correcta.':'Es incorrecta.'}</span> ${esc(o[2])}</div>`).join('') +
    `<div class="src">Referencia: ${esc(it.f)}</div></div>`;
}
function itemHTML(it, n, mode){
  const r = ST.r[it.id];
  const reveal = mode === 'review' || (CFG.modo === 'practica' && r);
  let h = `<div class="item" id="i-${it.id}"><p class="enun"><span class="n">${n}.</span> <span class="niv">${CFG.niveles[it.niv]}</span> ${esc(it.e)}</p>`;
  it.o.forEach(o => {
    let cls = '';
    if (reveal) { if (o[3]) cls = 'ok'; else if (r === o[0]) cls = 'no'; }
    else if (r === o[0]) cls = 'sel';
    h += `<button class="op ${cls}" data-id="${it.id}" data-l="${o[0]}" ${reveal?'disabled':''}><span class="l">${o[0]}.</span><span>${esc(o[1])}</span></button>`;
  });
  if (reveal) {
    if (mode === 'review') h += `<div class="${r===keyOf(it)?'res-ok':'res-no'}" style="font-size:14px;margin-top:4px">${r ? (r===keyOf(it)?'Respondiste ' + r + ': correcto.':'Respondiste ' + r + '. La respuesta correcta es ' + keyOf(it) + '.') : 'Sin responder. La respuesta correcta es ' + keyOf(it) + '.'}</div>`;
    h += justHTML(it);
  }
  return h + '</div>';
}
const keyOf = it => it.o.find(o => o[3])[0];

function renderList(list, mode){
  let h = '', last = null, n = 0;
  list.forEach(it => {
    n++;
    if (it.caso !== last) { last = it.caso; h += `<div class="caso"><div class="tag">${esc(it.caso.tag)}</div><p>${esc(it.caso.texto)}</p></div>`; }
    h += itemHTML(it, n, mode);
  });
  return h;
}

// ---------- PRÁCTICA ----------
let LIST = [];
let FILTRO = ST.f || {comp:'', niv:'', rol:''};
function practica(){
  const comps = Object.entries(CFG.componentes).map(([k,v]) => `<option value="${k}" ${FILTRO.comp===k?'selected':''}>${esc(v)}</option>`).join('');
  const nivs = Object.entries(CFG.niveles).map(([k,v]) => `<option value="${k}" ${FILTRO.niv===k?'selected':''}>${esc(v)}</option>`).join('');
  const list = ITEMS.filter(it => (!FILTRO.comp || it.caso.comp===FILTRO.comp) && (!FILTRO.niv || String(it.niv)===FILTRO.niv) && (!FILTRO.rol || it.caso.rol===FILTRO.rol || it.caso.rol==='general'));
  const resp = list.filter(it => ST.r[it.id]); const ok = resp.filter(it => ST.r[it.id]===keyOf(it));
  $('#main').innerHTML = `<div class="panel"><p style="margin-top:0">Elige un tema, tu nivel de empleo y la dificultad. Al responder verás de inmediato si acertaste y la explicación de cada opción.</p>
  <div class="row"><select id="fc"><option value="">Todos los temas</option>${comps}</select>
  <select id="fn"><option value="">Todas las dificultades</option>${nivs}</select>
  <select id="fr"><option value="">Todos los niveles de empleo</option>${['tecnico','profesional'].map(k => `<option value="${k}" ${FILTRO.rol===k?'selected':''}>${esc(CFG.roles[k])} (y temas comunes)</option>`).join('')}</select>
  <button class="btn sec" id="borrar">Borrar mis respuestas</button></div>
  <p class="stat" id="pst" style="margin-bottom:0">${list.length} preguntas · respondidas ${resp.length} · aciertos ${ok.length}${resp.length? ' (' + Math.round(100*ok.length/resp.length) + ' %)':''}</p></div>` + renderList(list, 'practica');
  $('#prog').textContent = `${ok.length}/${resp.length} aciertos`;
  ['fc','fn','fr'].forEach((id,i) => $('#'+id).onchange = e => { FILTRO[['comp','niv','rol'][i]] = e.target.value; ST.f = FILTRO; save(); practica(); });
  LIST = list;
  $('#borrar').onclick = () => { list.forEach(it => delete ST.r[it.id]); save(); practica(); };
}

// ---------- SIMULACRO ----------
let tick = null;
function inicio(){
  const n = ITEMS.length, cnt = {};
  ITEMS.forEach(it => cnt[it.caso.comp] = (cnt[it.caso.comp]||0) + 1);
  const h = Math.floor(CFG.minutos/60), m = CFG.minutos%60;
  $('#main').innerHTML = `<div class="panel"><h2 style="margin-top:0;color:var(--pri)">Instrucciones</h2>
  <p>Este simulacro tiene <b>${n} preguntas</b> en formato de caso: una situación, enunciados que se completan y tres opciones con una sola respuesta correcta.</p>
  <table>${Object.entries(cnt).map(([k,v]) => `<tr><td>${esc(CFG.componentes[k])}</td><td class="r">${v}</td></tr>`).join('')}</table>
  <p>Tiempo sugerido: <b>${h ? h + ' h ' : ''}${m ? m + ' min' : ''}</b> (unos ${Math.round(CFG.minutos*60/n/6)/10} minutos por pregunta). Cuando se acaba el tiempo puedes seguir, pero el cronómetro lo indica.</p>
  <p>Tus respuestas se guardan en este navegador. Al terminar verás tu puntaje por componente y por dificultad, y la explicación de cada pregunta.</p>
  <button class="btn" id="go">${ST.t0 ? 'Continuar el simulacro' : 'Comenzar'}</button></div>`;
  $('#prog').textContent = `${n} preguntas`;
  $('#go').onclick = () => { if (!ST.t0) { ST.t0 = Date.now(); save(); } examen(); };
}
function reloj(){
  const rest = CFG.minutos*60 - Math.floor((Date.now() - ST.t0)/1000);
  const a = Math.abs(rest), hh = Math.floor(a/3600), mm = Math.floor(a%3600/60), ss = a%60;
  const t = (rest < 0 ? '+' : '') + (hh ? hh + ':' : '') + String(mm).padStart(2,'0') + ':' + String(ss).padStart(2,'0');
  $('#timer').textContent = rest < 0 ? 'Tiempo cumplido ' + t : '⏱ ' + t;
  $('#timer').classList.toggle('low', rest < 600);
}
function examen(){
  $('#main').innerHTML = renderList(ITEMS, 'examen') + `<div class="panel"><button class="btn" id="fin">Terminar y calificar</button></div>`;
  progreso(); reloj(); clearInterval(tick); tick = setInterval(reloj, 1000);
  $('#fin').onclick = () => {
    const faltan = ITEMS.length - Object.keys(ST.r).filter(k => ITEMS.some(i => i.id===k)).length;
    $('#mtxt').textContent = faltan ? `Te faltan ${faltan} preguntas por responder. ¿Quieres calificar de todos modos?` : '¿Quieres terminar y ver tu calificación?';
    $('#modal').classList.remove('hide');
  };
}
function progreso(){
  const r = ITEMS.filter(it => ST.r[it.id]).length;
  $('#prog').textContent = `Respondidas ${r}/${ITEMS.length}`;
}
$('#mno').onclick = () => $('#modal').classList.add('hide');
$('#msi').onclick = () => { $('#modal').classList.add('hide'); ST.fin = Date.now(); save(); resultados(); };
function resultados(){
  clearInterval(tick);
  const ok = ITEMS.filter(it => ST.r[it.id] === keyOf(it)).length;
  const pct = Math.round(1000*ok/ITEMS.length)/10;
  const g = (fn, lab) => { const m = {}; ITEMS.forEach(it => { const k = fn(it); m[k] = m[k] || [0,0]; m[k][1]++; if (ST.r[it.id]===keyOf(it)) m[k][0]++; });
    return Object.entries(m).map(([k,v]) => `<tr><td>${esc(lab(k))}</td><td class="r">${v[0]}/${v[1]}</td><td class="r">${Math.round(100*v[0]/v[1])} %</td></tr>`).join(''); };
  const mins = Math.round(((ST.fin||Date.now()) - ST.t0)/60000);
  $('#timer').textContent = `Tiempo usado: ${Math.floor(mins/60) ? Math.floor(mins/60) + ' h ' : ''}${mins%60} min`;
  $('#prog').textContent = `${ok}/${ITEMS.length} aciertos`;
  $('#main').innerHTML = `<div class="panel"><div class="big">${String(pct).replace('.',',')} %</div>
  <p style="margin-top:4px">${ok} de ${ITEMS.length} respuestas correctas. ${pct >= 75 ? 'Muy buen resultado: repasa las explicaciones de tus errores para afianzarlo.' : pct >= 65 ? 'Vas bien, pero con poco margen: refuerza los componentes con menor porcentaje.' : 'Todavía no estás en zona segura: practica por tema los componentes con menor porcentaje.'}</p>
  <p class="aviso">Referencia: en el concurso de la Procuraduría la prueba de conocimientos es eliminatoria con mínimo de 65 puntos sobre 100, y la comportamental es clasificatoria. Este porcentaje de aciertos es una guía de preparación; la calificación oficial usa una escala estándar que compara a los aspirantes.</p>
  <h3>Por componente</h3><table>${g(it => it.caso.comp, k => CFG.componentes[k])}</table>
  <h3>Por dificultad</h3><table>${g(it => it.niv, k => CFG.niveles[k])}</table>
  <div class="row" style="margin-top:14px"><button class="btn" id="solo">Ver solo mis errores</button><button class="btn sec" id="todas">Ver todas</button><button class="btn sec" id="otra">Reiniciar el simulacro</button></div></div><div id="rev"></div>`;
  const rev = errs => { const l = errs ? ITEMS.filter(it => ST.r[it.id] !== keyOf(it)) : ITEMS; $('#rev').innerHTML = renderList(l, 'review'); };
  rev(true);
  $('#solo').onclick = () => rev(true); $('#todas').onclick = () => rev(false);
  $('#otra').onclick = () => { ST = {r:{}}; save(); inicio(); window.scrollTo(0,0); };
}

document.addEventListener('click', e => {
  const b = e.target.closest('button.op'); if (!b || b.disabled) return;
  ST.r[b.dataset.id] = b.dataset.l; save();
  const it = ITEMS.find(i => i.id === b.dataset.id);
  const n = b.closest('.item').querySelector('.n').textContent.replace('.','');
  b.closest('.item').outerHTML = itemHTML(it, n, CFG.modo === 'practica' ? 'practica' : 'examen');
  if (CFG.modo === 'practica') { const resp = LIST.filter(i => ST.r[i.id]); const ok = resp.filter(i => ST.r[i.id]===keyOf(i)).length; $('#prog').textContent = `${ok}/${resp.length} aciertos`; $('#pst').textContent = `${LIST.length} preguntas · respondidas ${resp.length} · aciertos ${ok} (${Math.round(100*ok/resp.length)} %)`; }
  else progreso();
});

if (CFG.modo === 'practica') practica();
else if (ST.fin) resultados();
else if (ST.t0) examen();
else inicio();
</script>
</body>
</html>
