n es competencia de la entidad y su comité evaluador (Decreto 1082, art. 2.2.1.1.2.2.3); los organismos de control no intervienen en el proceso (art. 25, num. 11, Ley 80).", false], ["B", "no le corresponde aprobarlo, porque la función preventiva no implica coadministrar ni decidir por la entidad.", "La función preventiva permite a la Procuraduría hacer seguimiento al proceso, pero no aprobar sus actos ni sustituir a la entidad: el numeral 11 del artículo 25 de la Ley 80 dispone que los organismos de control y vigilancia no intervienen en los procesos de contratación, y la evaluación de las ofertas corresponde a la entidad y a su comité evaluador (Decreto 1082 de 2015, art. 2.2.1.1.2.2.3).", true], ["C", "la procuraduría debe aprobar el informe de evaluación para que el municipio pueda adjudicar el contrato.", "Ninguna norma somete el informe de evaluación a aprobación de la Procuraduría; además, la ley excluye la intervención de los organismos de control en los procesos de contratación (art. 25, num. 11, Ley 80).", false]]}, {"id": "CE-175", "niv": 3, "e": "Sobre la queja del proponente acerca de las ofertas económicas, lo correcto es que", "f": "Ley 80 de 1993, art. 30, pars. 2 y 3 (adicionados por la Ley 1882 de 2018, art. 1)", "o": [["A", "el municipio debió abrir los sobres económicos al cierre, junto con los documentos habilitantes y técnicos.", "En la licitación de obra el sobre económico no se abre al cierre: permanece cerrado hasta la audiencia de adjudicación (art. 30, par. 3, Ley 80).", false], ["B", "las ofertas económicas debían publicarse con el informe de requisitos habilitantes para recibir observaciones.", "El informe del primer sobre se refiere a los requisitos habilitantes y a los factores distintos de la oferta económica; esta se conoce en la audiencia de adjudicación (art. 30, pars. 2 y 3, Ley 80).", false], ["C", "en la licitación de obra el sobre con la oferta económica permanece cerrado hasta la audiencia de adjudicación.", "Los parágrafos 2 y 3 del artículo 30 de la Ley 80, adicionados por el artículo 1 de la Ley 1882 de 2018, disponen que en la licitación de obra la oferta se presenta en dos sobres y que el segundo, con la oferta económica, se mantiene cerrado hasta la audiencia de adjudicación, en la que se abre y evalúa.", true]]}, {"id": "CE-176", "niv": 1, "e": "A la pregunta del alcalde, la adjudicación de esta licitación debe hacerse", "f": "Ley 1150 de 2007, art. 9; Decreto 1082 de 2015, art. 2.2.1.2.1.1.2", "o": [["A", "en audiencia pública, mediante resolución motivada que se entiende notificada al adjudicatario en ella.", "El artículo 9 de la Ley 1150 dispone que en los procesos de licitación pública la adjudicación se hace de forma obligatoria en audiencia pública, mediante resolución motivada que se entiende notificada al proponente favorecido en dicha audiencia.", true], ["B", "por resolución motivada que se notifica personalmente al adjudicatario dentro de los cinco días siguientes.", "En la licitación la adjudicación es obligatoriamente en audiencia pública y la resolución se entiende notificada en ella (art. 9, Ley 1150).", false], ["C", "en audiencia pública, cuando la soliciten un organismo de control o la mayoría de los proponentes.", "La audiencia de adjudicación en la licitación es obligatoria, no depende de una solicitud (art. 9, Ley 1150; Decreto 1082, art. 2.2.1.2.1.1.2).", false]]}]}, {"comp": "anticorrupcion", "rol": "profesional", "tag": "Estatuto Anticorrupción y transparencia · Niveles profesional, asesor y ejecutivo · Responsabilidad de los interventores", "texto": "Usted es profesional de una procuraduría provincial y hace seguimiento preventivo a un contrato de obra de un municipio para pavimentar vías rurales, cuyo valor supera la menor cuantía de la entidad. La firma interventora sabía desde hacía tres meses que el contratista estaba usando materiales de menor especificación que la pactada, pero no informó a la alcaldía. Hoy la obra presenta fallas que causan perjuicios al municipio. La alcaldía adelantó, con el debido proceso, la actuación administrativa correspondiente y declaró mediante acto administrativo, ya ejecutoriado, que la firma interventora incumplió su deber de informar.", "items": [{"id": "AC-113", "niv": 3, "e": "Por los perjuicios derivados del incumplimiento que no informó oportunamente, la firma interventora", "f": "Ley 1474 de 2011, art. 84, par. 3", "o": [["A", "responde solo si se demuestra que recibió dinero del contratista para ocultar el incumplimiento.", "La responsabilidad solidaria nace de no informar oportunamente; no exige probar un soborno, que daría lugar además a responsabilidad penal.", false], ["B", "responde solidariamente con el contratista por los perjuicios que le sean imputables.", "El parágrafo 3 del artículo 84 de la Ley 1474 de 2011 dispone que el interventor que no haya informado oportunamente a la entidad de un posible incumplimiento del contrato vigilado será solidariamente responsable con el contratista por los perjuicios que se ocasionen, en lo que le sea imputable.", true], ["C", "no responde, porque la obligación de ejecutar correctamente la obra recae en el contratista.", "La ley hace responsable al interventor que no informó oportunamente un posible incumplimiento, junto con el contratista, por los perjuicios que le sean imputables.", false]]}, {"id": "AC-114", "niv": 2, "e": "Como consecuencia del acto administrativo ejecutoriado que declaró el incumplimiento de su deber de informar, la firma interventora", "f": "Ley 80 de 1993, art. 8, num. 1, lit. k (Ley 1474 de 2011, art. 84)", "o": [["A", "queda inhabilitada para contratar solo con ese municipio hasta que se liquide el contrato de obra.", "La inhabilidad que prevé la ley no se limita al municipio ni a la liquidación del contrato; tiene un término legal fijo para contratar con el Estado.", false], ["B", "no queda inhabilitada, porque las inhabilidades solo surgen de sentencias penales y no de actos administrativos.", "Esta inhabilidad surge precisamente de un acto administrativo ejecutoriado expedido después de la actuación administrativa correspondiente.", false], ["C", "queda inhabilitada para contratar con el Estado por cinco años, contados desde la ejecutoria de ese acto.", "El literal k) del numeral 1 del artículo 8 de la Ley 80 de 1993, incorporado por el artículo 84 de la Ley 1474 de 2011, inhabilita por cinco años al interventor que incumpla el deber de entregar a la entidad información sobre el incumplimiento del contrato o sobre hechos que lo pongan en riesgo. El término se cuenta desde la ejecutoria del acto que así lo declare, previa la actuación administrativa correspondiente.", true]]}, {"id": "AC-115", "niv": 2, "e": "Antes de contratar una obra de este tipo, cuyo valor supera la menor cuantía, la entidad debía", "f": "Ley 1474 de 2011, art. 83, par. 1", "o": [["A", "pronunciarse en los estudios previos sobre la necesidad de contar con interventoría.", "El parágrafo 1 del artículo 83 de la Ley 1474 de 2011 dispone que en los estudios previos de los contratos de obra cuyo valor supere la menor cuantía de la entidad, cualquiera que sea la modalidad de selección, se debe hacer pronunciamiento sobre la necesidad de contar con interventoría. Ese es el deber general para estas obras; si además el contrato se adjudica por licitación pública, la interventoría es obligatoria (art. 32, num. 1, par. 1, de la Ley 80 de 1993).", true], ["B", "contratar la interventoría siempre por licitación pública, sin importar su valor.", "La ley no impone la licitación como modalidad única para la interventoría; lo que exige es que los estudios previos de la obra se pronuncien sobre su necesidad.", false], ["C", "designar como supervisor a un servidor del nivel directivo, porque la ley lo exige para obras de mayor cuantía.", "La ley no exige que el supervisor sea del nivel directivo; para estas obras, lo que exige es que los estudios previos se pronuncien sobre la interventoría.", false]]}]}, {"comp": "anticorrupcion", "rol": "general", "tag": "Estatuto Anticorrupción y transparencia · Publicación de declaraciones (Ley 2013 de 2019)", "texto": "Martín fue elegido alcalde de un municipio y se posesionará en enero. Su asesor le recuerda las obligaciones de publicidad de la Ley 2013 de 2019. Durante el primer año de gobierno ocurren dos hechos: en mayo, el hermano de Martín se vuelve socio de una empresa que presta servicios de aseo en el municipio, lo que modifica la información de su registro de conflictos de interés; y en agosto Martín presenta ante la DIAN su declaración del impuesto sobre la renta. Al mismo tiempo, Sofía, recién nombrada auxiliar administrativa de la alcaldía, pregunta si a ella también le corresponde declarar sus bienes y rentas.", "items": [{"id": "AC-122", "niv": 1, "e": "Respecto de sus declaraciones, antes de posesionarse, Martín", "f": "Ley 2013 de 2019, art. 2, par. 1", "o": [["A", "puede publicarlas en cualquier momento del primer año de gobierno, porque la ley no las exige como requisito para el cargo.", "La ley las exige como requisito para posesionarse, ejercer y retirarse del cargo, no como un trámite que pueda cumplirse en cualquier momento del período.", false], ["B", "debe publicar y registrar sus declaraciones de bienes y rentas, de conflictos de interés y de renta, como requisito para posesionarse.", "El artículo 2 de la Ley 2013 de 2019 incluye entre los sujetos obligados a los servidores elegidos por voto popular, y su parágrafo 1 establece que la publicación y el registro son requisito para posesionarse, ejercer y retirarse del cargo.", true], ["C", "no está obligado, porque la Ley 2013 de 2019 se aplica a los servidores nombrados y no a los elegidos por voto popular.", "Los servidores elegidos por voto popular están entre los primeros sujetos obligados que enumera el artículo 2 de la Ley 2013 de 2019.", false]]}, {"id": "AC-123", "niv": 2, "e": "El cambio en el registro de conflictos de interés que se produjo en mayo debe comunicarse y registrarse", "f": "Ley 2013 de 2019, art. 3", "o": [["A", "en la actualización anual siguiente, porque las declaraciones solo se modifican una vez al año.", "Además de la actualización anual, la ley exige que los cambios en la información declarada se comuniquen y registren dentro de un plazo corto desde que ocurren.", false], ["B", "solo al retirarse del cargo, en la declaración final del período.", "Esperar al retiro dejaría el registro desactualizado durante todo el período, en contra del propósito de la ley; el cambio debe registrarse dentro de los dos meses siguientes.", false], ["C", "dentro de los dos meses siguientes a la fecha en que se produjo el cambio.", "El artículo 3 de la Ley 2013 de 2019 dispone que cualquier cambio que modifique la información contenida en la declaración debe comunicarse y registrarse dentro de los dos meses siguientes al cambio.", true]]}, {"id": "AC-124", "niv": 2, "e": "La copia de la declaración del impuesto sobre la renta que Martín presentó en agosto debe publicarse", "f": "Ley 2013 de 2019, art. 3", "o": [["A", "al finalizar el período de gobierno, con la declaración de retiro.", "La ley fija un plazo corto contado desde la presentación ante la DIAN; no permite aplazar la publicación hasta el final del período.", false], ["B", "dentro del mes siguiente a su presentación ante la DIAN, sin esperar la actualización anual.", "El artículo 3 de la Ley 2013 de 2019 establece que la copia de la declaración del impuesto sobre la renta y complementarios se publica dentro del mes siguiente a su presentación ante la DIAN.", true], ["C", "solo si la DIAN abre un proceso de fiscalización sobre esa declaración, como parte de la investigación.", "La publicación es una obligación general de los sujetos obligados y no depende de que exista un proceso de fiscalización.", false]]}, {"id": "AC-125", "niv": 3, "e": "Respecto de la pregunta de Sofía, es correcto indicarle que", "f": "Ley 190 de 1995; Decreto 1083 de 2015; Función Pública, Concepto 561261 de 2025", "o": [["A", "debe presentar su declaración de bienes y rentas en el SIGEP, como todo servidor, al posesionarse, cada año y al retirarse.", "Las obligaciones de publicación de la Ley 2013 de 2019 recaen sobre los sujetos que enumera su artículo 2, entre los que no figura un cargo asistencial como el de Sofía; pero, según la Ley 190 de 1995 y el Decreto 1083 de 2015, como lo reitera el Concepto 561261 de 2025 de Función Pública, todo servidor público debe presentar la declaración de bienes y rentas en el SIGEP al posesionarse, actualizarla anualmente y presentarla al retirarse.", true], ["B", "no tiene ninguna obligación, porque las declaraciones de bienes solo se exigen a cargos directivos y de elección popular.", "La declaración de bienes y rentas es una obligación de todo servidor público, prevista en la Ley 190 de 1995; las obligaciones especiales de publicación de la Ley 2013 no eliminan esa regla general.", false], ["C", "solo debe declarar si es ordenadora del gasto o maneja recursos públicos.", "La obligación de declarar bienes y rentas no depende de ordenar el gasto o manejar recursos: se aplica a todo servidor público.", false]]}]}, {"comp": "anticorrupcion", "rol": "general", "tag": "Estatuto Anticorrupción y transparencia · Principios del derecho de acceso a la información pública", "texto": "Una procuraduría provincial, en ejercicio de su función preventiva, revisa la manera en que una alcaldía atiende el derecho de acceso a la información pública. Encuentra que la entidad solo publica información cuando un ciudadano la solicita por escrito, que cobra un \"derecho de consulta\" a quien pide revisar expedientes en las instalaciones y que, cuando un documento contiene datos reservados en algunas de sus páginas, niega el documento completo. El secretario general considera que esas prácticas protegen a la entidad.", "items": [{"id": "AC-141", "niv": 2, "e": "La práctica de publicar información solo cuando se solicita por escrito desconoce el principio de", "f": "Ley 1712 de 2014, art. 3", "o": [["A", "eficacia, porque obliga a tramitar más solicitudes escritas de las necesarias.", "Aunque la práctica puede afectar la gestión, el principio de la Ley 1712 que exige publicar sin esperar solicitud es el de divulgación proactiva.", false], ["B", "divulgación proactiva de la información.", "El artículo 3 de la Ley 1712 de 2014 consagra el principio de divulgación proactiva, que obliga a publicar y divulgar documentos y archivos de interés público de forma rutinaria y proactiva, sin esperar una solicitud, y a promover una cultura de transparencia.", true], ["C", "facilitación, porque el ciudadano debe radicar su solicitud en la ventanilla de la alcaldía.", "La facilitación se refiere a no exigir trámites que obstruyan el acceso; lo que se reprocha aquí es esperar a que haya una solicitud en lugar de publicar de manera rutinaria.", false]]}, {"id": "AC-142", "niv": 3, "e": "Cuando solo algunas páginas de un documento contienen información reservada, la alcaldía debe", "f": "Ley 1712 de 2014, art. 21", "o": [["A", "negar el documento completo, porque basta con que una parte sea reservada para que todo el documento lo sea.", "La ley no permite extender la reserva a todo el documento cuando solo una parte está cobijada; ordena la divulgación parcial.", false], ["B", "entregarlo completo, porque la reserva no puede oponerse a los ciudadanos que lo solicitan por escrito.", "Las excepciones legales de reserva sí pueden oponerse a los solicitantes; lo que exige la ley es proteger solo la parte reservada y entregar el resto.", false], ["C", "entregar una versión pública que mantenga la reserva únicamente sobre la parte cobijada por la excepción.", "El artículo 21 de la Ley 1712 de 2014, sobre divulgación parcial, dispone que si los datos reservados o clasificados pueden separarse del resto, debe hacerse una versión pública que mantenga la reserva solo de la parte indispensable.", true]]}, {"id": "AC-143", "niv": 1, "e": "El cobro de un \"derecho de consulta\" para revisar expedientes", "f": "Ley 1712 de 2014, art. 3", "o": [["A", "desconoce el principio de gratuidad, porque solo puede cobrarse el costo de reproducción de la información.", "El artículo 3 de la Ley 1712 de 2014 establece el principio de gratuidad: el acceso a la información pública es gratuito, y no se pueden cobrar valores adicionales al costo de reproducción.", true], ["B", "es válido si lo aprueba el concejo municipal mediante acuerdo, para cubrir los gastos de administración.", "La ley consagra el principio de gratuidad: el acceso no tiene costo y solo puede cobrarse la reproducción; un acuerdo municipal no puede establecer cobros contrarios a la ley.", false], ["C", "es válido siempre que la tarifa sea igual para todos los ciudadanos.", "Que la tarifa sea igual para todos no la hace válida: la ley prohíbe cobrar por el acceso, más allá del costo de reproducción.", false]]}]}, {"comp": "comportamental", "rol": "profesional", "tag": "Competencias comportamentales (Diccionario de la Procuraduría) · Niveles profesional, asesor y ejecutivo · Organización en el trabajo", "texto": "Usted es asesor de una procuraduría delegada con funciones preventivas y su empleo exige Organización en el trabajo en nivel B. Debe preparar el seguimiento preventivo a un programa de alimentación escolar en 40 municipios entre febrero y junio. Cuenta con cinco profesionales y dos vehículos, y cada visita toma en promedio dos días. Al revisar la información de los municipios, advierte que a partir de abril empieza la temporada de lluvias, que en años anteriores dejó incomunicados por varias semanas a seis de ellos. En el equipo también hay un técnico, cuyo empleo exige el nivel D de la misma competencia.", "items": [{"id": "CO-104", "niv": 1, "e": "Al elaborar el plan de visitas, la actuación que corresponde al nivel B de Organización en el trabajo es", "f": "Diccionario de Competencias Comportamentales PGN, Organización en el trabajo, nivel B", "o": [["A", "revisar cada semana que las actas de visita de los profesionales cumplan el formato y los estándares de calidad de la delegada.", "Corresponde al nivel C: coordinar y hacer seguimiento a las tareas propias o de otros a la luz de estándares, y verificar la aplicación de la normatividad sobre calidad. Es útil, pero no es la programación que pide el nivel B.", false], ["B", "programar las visitas de febrero a junio según personas, vehículos y semanas disponibles, con hitos mensuales.", "El nivel B de Organización en el trabajo consiste en programar, en escenarios de mediano plazo, la realización ordenada de actividades con base en la disponibilidad de recursos y tiempo, y en programar las metas de su área o equipo.", true], ["C", "reunir a los cinco profesionales para analizar con ellos la situación y escuchar sus puntos de vista antes de decidir.", "Interactuar con otros para analizar una situación y escuchar distintos puntos de vista antes de decidir es una conducta de Toma de decisiones, nivel B. Puede acompañar la planeación, pero no es la programación de actividades según recursos y tiempo que define el nivel B de Organización en el trabajo.", false]]}, {"id": "CO-105", "niv": 3, "e": "Frente al dato de la temporada de lluvias, lo que mejor refleja el nivel B de Organización en el trabajo es", "f": "Diccionario de Competencias Comportamentales PGN, Organización en el trabajo, nivel B", "o": [["A", "anticipar ese escenario y ubicar las visitas a los seis municipios en febrero y marzo.", "Una de las conductas del nivel B de Organización en el trabajo es proyectar situaciones y escenarios futuros con acierto. Programar las visitas antes de las lluvias usa esa proyección para ordenar las actividades según el tiempo disponible.", true], ["B", "mantener el orden previsto del cronograma y, si en abril se cierra alguna vía, reprogramar esa visita para junio.", "Es una reacción ante el problema cuando ya ocurrió. El nivel B pide proyectar situaciones y escenarios futuros con acierto, y aquí el riesgo era conocido de antemano.", false], ["C", "asumir las lluvias como un reto y reorganizar sus actividades en el momento en que se presenten los cierres de vías.", "Reconocer los cambios del entorno inmediato, asumirlos como un reto y reorganizar las propias actividades es la conducta de Adaptación al cambio, nivel D. Reacciona cuando el cambio ya ocurrió; el nivel B de Organización en el trabajo pide proyectar con acierto el escenario y programar antes.", false]]}, {"id": "CO-106", "niv": 2, "e": "Para el técnico del equipo, cuyo empleo exige el nivel D de Organización en el trabajo, la conducta que corresponde a su nivel es", "f": "Diccionario de Competencias Comportamentales PGN, Organización en el trabajo, nivel D", "o": [["A", "realizar los trabajos que le asignan ajustándose a las indicaciones y especificaciones que le da el asesor.", "Ejecutar los trabajos asignados de acuerdo con indicaciones y especificaciones establecidas es el nivel D de Orientación al orden, la calidad y la exactitud, otra competencia del diccionario. El nivel D de Organización en el trabajo se refiere a trabajar en forma estandarizada y en menos tiempo del requerido.", false], ["B", "hacer seguimiento a las tareas de los demás miembros del equipo con base en los indicadores de la delegada.", "Coordinar y hacer seguimiento a las tareas de otros a la luz de indicadores es propio del nivel C, superior al D exigido al técnico.", false], ["C", "ejecutar sus tareas con los formatos estandarizados y, en lo posible, en menos tiempo del que fija la entidad.", "El nivel D de Organización en el trabajo describe a quien ejecuta sus actividades según los parámetros de eficiencia de la entidad, en forma estandarizada y en menores tiempos que los requeridos.", true]]}]}, {"comp": "comportamental", "rol": "profesional", "tag": "Competencias comportamentales (Diccionario de la Procuraduría) · Niveles profesional, asesor y ejecutivo · Investigación", "texto": "Usted es profesional universitario de una procuraduría delegada y su empleo exige Investigación en nivel B. El procurador delegado observa que en los dos últimos años creció el número de quejas que terminan archivadas sin abrir investigación y quiere entender por qué. Le encarga un estudio sobre el tema en coordinación con la Oficina de Planeación. Usted tiene acceso al sistema de información misional y a los expedientes físicos de las procuradurías regionales que dependen de la delegada.", "items": [{"id": "CO-116", "niv": 1, "e": "Al recibir el encargo, la actuación que mejor refleja el nivel B de Investigación es", "f": "Diccionario de Competencias Comportamentales PGN, Investigación, nivel B", "o": [["A", "aportar a la Oficina de Planeación información confiable sobre los expedientes archivados, para el estudio que esa oficina adelante.", "Aportar información confiable y veraz a los proyectos de la dependencia es una conducta del nivel C, que apoya investigaciones de otros; el nivel B diseña y realiza el estudio.", false], ["B", "diseñar con Planeación un estudio sobre las causas del archivo y, con sus hallazgos, proponer un plan de mejoramiento.", "El nivel B de Investigación consiste en diseñar y realizar estudios conjuntamente para facilitar el funcionamiento de la entidad y proponer planes y programas de mejoramiento institucional.", true], ["C", "consolidar y valorar la información sobre los expedientes archivados que le envíen las regionales.", "Consolidar y valorar la información necesaria para sus funciones es una conducta de Gestión de la información, nivel B. Es útil, pero no es diseñar un estudio orientado a proponer mejoras, que define el nivel B de Investigación.", false]]}, {"id": "CO-117", "niv": 3, "e": "Para definir cómo se analizarán los expedientes, lo que corresponde al nivel B de Investigación es", "f": "Diccionario de Competencias Comportamentales PGN, Investigación, nivel B", "o": [["A", "revisar uno por uno todos los expedientes archivados en los dos últimos años, para no dejar por fuera ningún caso.", "Muestra dedicación, pero no incorpora un método; el nivel B de Investigación pide incorporar elementos en la búsqueda de métodos aplicables a la investigación.", false], ["B", "aplicar en su trabajo diario los conceptos prácticos que vaya encontrando durante la revisión.", "Aplicar nuevos y prácticos conceptos a sus quehaceres habituales es una conducta del nivel D de Investigación, no del B.", false], ["C", "incorporar elementos de método, como una muestra representativa y categorías de análisis definidas de antemano.", "Una de las conductas del nivel B de Investigación es incorporar elementos en la búsqueda de métodos aplicables a la investigación. La muestra y las categorías son esos elementos de método.", true]]}, {"id": "CO-118", "niv": 1, "e": "Al terminar el estudio, la actuación que corresponde al nivel B de Investigación es", "f": "Diccionario de Competencias Comportamentales PGN, Investigación, nivel B", "o": [["A", "convertir los hallazgos en una propuesta de plan de mejoramiento para la entidad.", "El nivel B de Investigación se define como diseñar y realizar estudios para facilitar el funcionamiento de la entidad y proponer planes y programas de mejoramiento institucional.", true], ["B", "publicar los resultados en la intranet para que cada dependencia los use como considere conveniente.", "Divulgar los resultados no basta: el nivel B de Investigación orienta los estudios a proponer planes y programas de mejoramiento institucional.", false], ["C", "entregar el informe a la Oficina de Planeación para que sea esa oficina la que formule el plan de mejoramiento.", "Deja en otra dependencia la propuesta de mejoramiento y se limita a aportar insumos, algo más cercano al nivel C (aportar información a los programas de la dependencia). El nivel B incluye proponer los planes y programas de mejoramiento.", false]]}]}, {"comp": "comportamental", "rol": "profesional", "tag": "Competencias comportamentales (Diccionario de la Procuraduría) · Niveles profesional, asesor y ejecutivo · Investigación", "texto": "Usted es profesional universitario de la Oficina de Planeación de la Procuraduría y su empleo exige Investigación en nivel B. Las encuestas muestran que bajó la satisfacción de los ciudadanos atendidos en los centros de atención al público de la entidad, y el jefe le pide estudiar las causas. Para recoger datos, le asignan un técnico cuyo empleo exige el nivel D de la misma competencia. Durante la recolección se descubre que el sistema no registra el canal de entrada del 30 % de las solicitudes.", "items": [{"id": "CO-137", "niv": 2, "e": "Para atender el encargo, la actuación que mejor refleja el nivel B de Investigación es", "f": "Diccionario de Competencias Comportamentales PGN, Investigación, nivel B", "o": [["A", "aportar al estudio que adelanta otra dependencia los datos confiables del sistema de peticiones.", "Aportar información confiable y veraz a los proyectos de la dependencia es propio del nivel C, que apoya investigaciones; no las diseña.", false], ["B", "diseñar con los centros de atención un estudio conjunto y, con sus resultados, proponer un plan de mejoramiento.", "Diseñar el estudio junto con los centros de atención y convertir sus resultados en un plan de mejoramiento refleja el nivel B de Investigación: diseñar y realizar estudios conjuntamente para proponer planes y programas de mejoramiento institucional.", true], ["C", "pedir a cada centro de atención un informe con sus quejas más frecuentes y consolidarlo para la dirección.", "Consolidar y valorar información es una conducta de Gestión de la información, nivel B; no es el diseño de un estudio orientado a proponer mejoras.", false]]}, {"id": "CO-138", "niv": 2, "e": "Para el técnico asignado, cuyo empleo exige el nivel D de Investigación, la tarea que corresponde a su nivel es", "f": "Diccionario de Competencias Comportamentales PGN, Investigación, nivel D", "o": [["A", "buscar información sobre las actividades de su cargo y sobre su papel en el estudio.", "Buscar información sobre las actividades del cargo y el propio rol es el nivel D de Aprendizaje continuo, no de Investigación.", false], ["B", "apoyar conceptualmente el estudio aportando objetivos claros y coherentes con las metas de la entidad.", "Aportar objetivos claros y coherentes con las metas organizacionales es una conducta del nivel C, superior al exigido.", false], ["C", "preparar las condiciones para recoger los datos, como ordenar los registros y el instrumento de captura.", "El nivel D de Investigación se define como preparar las condiciones que posibilitan la recolección y el análisis de los datos necesarios para obtener resultados en los estudios.", true]]}, {"id": "CO-139", "niv": 3, "e": "Ante el vacío de información sobre el canal de entrada, lo que corresponde al técnico según el nivel D de Investigación es", "f": "Diccionario de Competencias Comportamentales PGN, Investigación, nivel D", "o": [["A", "proponer un plan alternativo de recolección, como revisar una muestra de esas solicitudes en físico.", "Una de las conductas del nivel D de Investigación es establecer planes alternativos de acción, dentro de su papel de preparar las condiciones para recolectar los datos.", true], ["B", "excluir esas solicitudes del análisis y continuar con el 70 % restante.", "Excluir los datos no es un plan alternativo de recolección y puede sesgar los resultados del estudio; el nivel D pide preparar las condiciones para obtener los datos necesarios.", false], ["C", "suspender la recolección hasta que la Oficina de Tecnología corrija el sistema.", "Detiene el estudio. El nivel D incluye establecer planes alternativos de acción para no frenar la recolección.", false]]}]}, {"comp": "comportamental", "rol": "profesional", "tag": "Competencias comportamentales (Diccionario de la Procuraduría) · Niveles profesional, asesor y ejecutivo · Organización en el trabajo", "texto": "Usted es profesional universitario del área de capacitación de la división de gestión humana de la Procuraduría y su empleo exige Organización en el trabajo en nivel B. Debe programar seis cursos para el primer semestre. El presupuesto llega en dos desembolsos, en marzo y en junio, y el aula virtual estará disponible solo desde abril. Además, en el mes de las elecciones buena parte de los servidores apoyará la vigilancia electoral que realiza la entidad.", "items": [{"id": "CO-158", "niv": 1, "e": "Al programar los seis cursos, lo que mejor refleja el nivel B de Organización en el trabajo es", "f": "Diccionario de Competencias Comportamentales PGN, Organización en el trabajo, nivel B", "o": [["A", "ordenar los cursos según cuándo llega cada desembolso y cuándo estará disponible el aula virtual.", "El nivel B de Organización en el trabajo consiste en programar, a mediano plazo, la realización ordenada de actividades con base en la disponibilidad de recursos y tiempo.", true], ["B", "dictar primero los cursos más solicitados y buscar recursos para los demás a medida que se necesiten.", "Programa según la demanda y no según la disponibilidad de recursos y tiempo, que es el criterio que el diccionario fija para el nivel B.", false], ["C", "verificar que cada curso cumpla los estándares de calidad del sistema de gestión de la entidad.", "Verificar la aplicación de la normatividad de calidad es una conducta del nivel C, no la programación que pide el nivel B.", false]]}, {"id": "CO-159", "niv": 2, "e": "Al iniciar el semestre, el jefe le pide definir qué debe lograr el área. Lo que corresponde al nivel B de Organización en el trabajo es", "f": "Diccionario de Competencias Comportamentales PGN, Organización en el trabajo, nivel B", "o": [["A", "cumplir sus propias tareas del plan de capacitación en menos tiempo del previsto.", "Realizar las actividades en menores tiempos que los requeridos corresponde al nivel D.", false], ["B", "programar las metas del área para el semestre, con fechas y responsables.", "Una de las conductas del nivel B de Organización en el trabajo es programar las metas estratégicas de su área o de su equipo.", true], ["C", "proponer acciones estratégicas que superen lo que se espera del área este semestre.", "Proponer acciones estratégicas que superen las expectativas es una conducta de Orientación a resultados, nivel B. El nivel B de Organización en el trabajo pide programar las metas del área.", false]]}, {"id": "CO-160", "niv": 2, "e": "Frente al periodo de vigilancia electoral, lo coherente con el nivel B de Organización en el trabajo es", "f": "Diccionario de Competencias Comportamentales PGN, Organización en el trabajo, nivel B", "o": [["A", "dejar que cada dependencia escoja las fechas de sus cursos según su carga de trabajo en ese mes.", "Traslada la programación a otros y no aprovecha la información disponible para organizar las actividades, que es lo que corresponde al nivel B.", false], ["B", "programar los cursos con normalidad y, si la asistencia resulta baja, repetirlos en el segundo semestre.", "Reacciona después del problema. El nivel B pide proyectar situaciones y escenarios futuros con acierto.", false], ["C", "anticipar esa situación y no programar cursos presenciales en las semanas de vigilancia electoral.", "El nivel B de Organización en el trabajo incluye proyectar situaciones y escenarios futuros con acierto al programar las actividades según la disponibilidad de tiempo.", true]]}]}, {"comp": "comportamental", "rol": "profesional", "tag": "Competencias comportamentales (Diccionario de la Procuraduría) · Niveles profesional, asesor y ejecutivo · Gestión de la información", "texto": "Usted es profesional universitario de una procuraduría delegada y su empleo exige Gestión de la información en nivel B. Debe preparar el informe semestral de la delegada a partir de los reportes de 32 procuradurías regionales, que llegan por correo, en hojas de cálculo con formatos distintos y algunos en documentos escaneados. Varios reportes traen cifras que no cuadran entre sí. Un periodista le pide por correo la base consolidada, que incluye datos de quejas disciplinarias en curso.", "items": [{"id": "CO-182", "niv": 2, "e": "Para manejar los reportes de las regionales, lo que refleja el nivel B de Gestión de la información es", "f": "Diccionario de Competencias Comportamentales PGN, Gestión de la información, nivel B", "o": [["A", "diseñar y organizar una base de datos para el equipo con la información que llega por los distintos medios.", "El nivel B de Gestión de la información incluye diseñar y organizar bases de datos disponibles para un grupo con información que recibe de diferentes medios.", true], ["B", "diseñar instrumentos para hacer seguimiento a su propio trabajo en la elaboración del informe.", "Diseñar o adaptar instrumentos para seguir el propio trabajo es una conducta del nivel B de Autogestión, no de Gestión de la información.", false], ["C", "solicitar a cada regional los datos que necesita para su informe.", "Solicitar los datos necesarios para sus tareas es una conducta del nivel C, inferior al exigido.", false]]}, {"id": "CO-183", "niv": 3, "e": "Antes de usar las cifras en el informe, lo que refleja el nivel B de Gestión de la información es", "f": "Diccionario de Competencias Comportamentales PGN, Gestión de la información, nivel B", "o": [["A", "incluir todos los datos recibidos, porque los reportaron servidores públicos en ejercicio de sus funciones.", "Usa la información sin evaluarla. La competencia se define como acceder, evaluar y utilizar información relevante y pertinente.", false], ["B", "usar solo la información de las regionales que respondieron primero, para cumplir el plazo.", "Selecciona los datos por la fecha de llegada y no por su pertinencia o calidad, lo que no corresponde a valorar la información.", false], ["C", "valorar si la información es confiable y pertinente, y depurar la que no lo sea.", "Una de las conductas del nivel B de Gestión de la información es consolidar y valorar la información necesaria para el óptimo desarrollo de sus funciones.", true]]}, {"id": "CO-184", "niv": 2, "e": "Frente a la solicitud del periodista, lo coherente con la definición de Gestión de la información del diccionario es", "f": "Diccionario de Competencias Comportamentales PGN, Gestión de la información, nivel B", "o": [["A", "responderle que la información se entregará cuando concluyan los procesos que contiene.", "También es una decisión personal que no aplica los lineamientos de la entidad sobre acceso a la información, que es lo que pide la definición de la competencia.", false], ["B", "tramitar la solicitud conforme a los lineamientos de la entidad sobre acceso a la información.", "El diccionario define Gestión de la información como la capacidad de acceder, evaluar y utilizar información, en una relación determinada por la mesura, la prudencia y los lineamientos que fije la entidad.", true], ["C", "enviarle la base después de quitar los nombres de los quejosos, para proteger su identidad.", "Decide por su cuenta qué entregar, sin aplicar los lineamientos de la entidad; el diccionario define la competencia con mesura, prudencia y sujeción a esos lineamientos, y la base incluye datos de procesos en curso.", false]]}]}];
const CFG = {"titulo": "Simulacro 4 · Profesional, asesor y ejecutivo · Procuraduría 2027", "modo": "simulacro", "minutos": 215, "componentes": {"estructura_pgn": "Estructura y funciones de la Procuraduría", "gestion_publica": "Gestión pública y funcionamiento del Estado", "atencion_usuario": "Atención al usuario", "gestion_documental": "Gestión documental", "documentos_oficina": "Elaboración de documentos de oficina", "ofimatica": "Herramientas ofimáticas", "sistemas_gestion": "Sistemas de gestión (MIPG, control interno y calidad)", "disciplinario": "Código General Disciplinario", "contratacion": "Contratación estatal", "anticorrupcion": "Estatuto Anticorrupción y transparencia", "comportamental": "Competencias comportamentales (Diccionario de la Procuraduría)"}, "niveles": {"1": "Básico", "2": "Intermedio", "3": "Avanzado"}, "roles": {"general": "Todos los niveles", "tecnico": "Niveles técnico, administrativo y operativo", "profesional": "Niveles profesional, asesor y ejecutivo"}, "clave": "profesional-04.html"};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY = 'sim-pgn:' + CFG.clave;
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}
function save(){try{localStorage.setItem(KEY, JSON.stringify(ST))}catch(e){}}
let ST = load();
ST.r = ST.r || {};
$('#tit').textContent = CFG.titulo;
const ITEMS = [];
DATA.forEach(c => c.items.forEach(it => { it.caso = c; ITEMS.push(it); }));

function justHTML(it){
  return '<div class="just">' + it.o.map(o => `<div><b>${o[0]}.</b> <span class="${o[3]?'okt':'not'}">${o[3]?'Es correcta.':'Es incorrecta.'}</span> ${esc(o[2])}</div>`).join('') +
    `<div class="src">Referencia: ${esc(it.f)}</div></div>`;
}
function itemHTML(it, n, mode){
  const r = ST.r[it.id];
  const reveal = mode === 'review' || (CFG.modo === 'practica' && r);
  let h = `<div class="item" id="i-${it.id}"><p class="enun"><span class="n">${n}.</span> <span class="niv">${CFG.niveles[it.niv]}</span> ${esc(it.e)}</p>`;
  it.o.forEach(o => {
    let cls = '';
    if (reveal) { if (o[3]) cls = 'ok'; else if (r === o[0]) cls = 'no'; }
    else if (r === o[0]) cls = 'sel';
    h += `<button class="op ${cls}" data-id="${it.id}" data-l="${o[0]}" ${reveal?'disabled':''}><span class="l">${o[0]}.</span><span>${esc(o[1])}</span></button>`;
  });
  if (reveal) {
    if (mode === 'review') h += `<div class="${r===keyOf(it)?'res-ok':'res-no'}" style="font-size:14px;margin-top:4px">${r ? (r===keyOf(it)?'Respondiste ' + r + ': correcto.':'Respondiste ' + r + '. La respuesta correcta es ' + keyOf(it) + '.') : 'Sin responder. La respuesta correcta es ' + keyOf(it) + '.'}</div>`;
    h += justHTML(it);
  }
  return h + '</div>';
}
const keyOf = it => it.o.find(o => o[3])[0];

function renderList(list, mode){
  let h = '', last = null, n = 0;
  list.forEach(it => {
    n++;
    if (it.caso !== last) { last = it.caso; h += `<div class="caso"><div class="tag">${esc(it.caso.tag)}</div><p>${esc(it.caso.texto)}</p></div>`; }
    h += itemHTML(it, n, mode);
  });
  return h;
}

// ---------- PRÁCTICA ----------
let LIST = [];
let FILTRO = ST.f || {comp:'', niv:'', rol:''};
function practica(){
  const comps = Object.entries(CFG.componentes).map(([k,v]) => `<option value="${k}" ${FILTRO.comp===k?'selected':''}>${esc(v)}</option>`).join('');
  const nivs = Object.entries(CFG.niveles).map(([k,v]) => `<option value="${k}" ${FILTRO.niv===k?'selected':''}>${esc(v)}</option>`).join('');
  const list = ITEMS.filter(it => (!FILTRO.comp || it.caso.comp===FILTRO.comp) && (!FILTRO.niv || String(it.niv)===FILTRO.niv) && (!FILTRO.rol || it.caso.rol===FILTRO.rol || it.caso.rol==='general'));
  const resp = list.filter(it => ST.r[it.id]); const ok = resp.filter(it => ST.r[it.id]===keyOf(it));
  $('#main').innerHTML = `<div class="panel"><p style="margin-top:0">Elige un tema, tu nivel de empleo y la dificultad. Al responder verás de inmediato si acertaste y la explicación de cada opción.</p>
  <div class="row"><select id="fc"><option value="">Todos los temas</option>${comps}</select>
  <select id="fn"><option value="">Todas las dificultades</option>${nivs}</select>
  <select id="fr"><option value="">Todos los niveles de empleo</option>${['tecnico','profesional'].map(k => `<option value="${k}" ${FILTRO.rol===k?'selected':''}>${esc(CFG.roles[k])} (y temas comunes)</option>`).join('')}</select>
  <button class="btn sec" id="borrar">Borrar mis respuestas</button></div>
  <p class="stat" id="pst" style="margin-bottom:0">${list.length} preguntas · respondidas ${resp.length} · aciertos ${ok.length}${resp.length? ' (' + Math.round(100*ok.length/resp.length) + ' %)':''}</p></div>` + renderList(list, 'practica');
  $('#prog').textContent = `${ok.length}/${resp.length} aciertos`;
  ['fc','fn','fr'].forEach((id,i) => $('#'+id).onchange = e => { FILTRO[['comp','niv','rol'][i]] = e.target.value; ST.f = FILTRO; save(); practica(); });
  LIST = list;
  $('#borrar').onclick = () => { list.forEach(it => delete ST.r[it.id]); save(); practica(); };
}

// ---------- SIMULACRO ----------
let tick = null;
function inicio(){
  const n = ITEMS.length, cnt = {};
  ITEMS.forEach(it => cnt[it.caso.comp] = (cnt[it.caso.comp]||0) + 1);
  const h = Math.floor(CFG.minutos/60), m = CFG.minutos%60;
  $('#main').innerHTML = `<div class="panel"><h2 style="margin-top:0;color:var(--pri)">Instrucciones</h2>
  <p>Este simulacro tiene <b>${n} preguntas</b> en formato de caso: una situación, enunciados que se completan y tres opciones con una sola respuesta correcta.</p>
  <table>${Object.entries(cnt).map(([k,v]) => `<tr><td>${esc(CFG.componentes[k])}</td><td class="r">${v}</td></tr>`).join('')}</table>
  <p>Tiempo sugerido: <b>${h ? h + ' h ' : ''}${m ? m + ' min' : ''}</b> (unos ${Math.round(CFG.minutos*60/n/6)/10} minutos por pregunta). Cuando se acaba el tiempo puedes seguir, pero el cronómetro lo indica.</p>
  <p>Tus respuestas se guardan en este navegador. Al terminar verás tu puntaje por componente y por dificultad, y la explicación de cada pregunta.</p>
  <button class="btn" id="go">${ST.t0 ? 'Continuar el simulacro' : 'Comenzar'}</button></div>`;
  $('#prog').textContent = `${n} preguntas`;
  $('#go').onclick = () => { if (!ST.t0) { ST.t0 = Date.now(); save(); } examen(); };
}
function reloj(){
  const rest = CFG.minutos*60 - Math.floor((Date.now() - ST.t0)/1000);
  const a = Math.abs(rest), hh = Math.floor(a/3600), mm = Math.floor(a%3600/60), ss = a%60;
  const t = (rest < 0 ? '+' : '') + (hh ? hh + ':' : '') + String(mm).padStart(2,'0') + ':' + String(ss).padStart(2,'0');
  $('#timer').textContent = rest < 0 ? 'Tiempo cumplido ' + t : '⏱ ' + t;
  $('#timer').classList.toggle('low', rest < 600);
}
function examen(){
  $('#main').innerHTML = renderList(ITEMS, 'examen') + `<div class="panel"><button class="btn" id="fin">Terminar y calificar</button></div>`;
  progreso(); reloj(); clearInterval(tick); tick = setInterval(reloj, 1000);
  $('#fin').onclick = () => {
    const faltan = ITEMS.length - Object.keys(ST.r).filter(k => ITEMS.some(i => i.id===k)).length;
    $('#mtxt').textContent = faltan ? `Te faltan ${faltan} preguntas por responder. ¿Quieres calificar de todos modos?` : '¿Quieres terminar y ver tu calificación?';
    $('#modal').classList.remove('hide');
  };
}
function progreso(){
  const r = ITEMS.filter(it => ST.r[it.id]).length;
  $('#prog').textContent = `Respondidas ${r}/${ITEMS.length}`;
}
$('#mno').onclick = () => $('#modal').classList.add('hide');
$('#msi').onclick = () => { $('#modal').classList.add('hide'); ST.fin = Date.now(); save(); resultados(); };
function resultados(){
  clearInterval(tick);
  const ok = ITEMS.filter(it => ST.r[it.id] === keyOf(it)).length;
  const pct = Math.round(1000*ok/ITEMS.length)/10;
  const g = (fn, lab) => { const m = {}; ITEMS.forEach(it => { const k = fn(it); m[k] = m[k] || [0,0]; m[k][1]++; if (ST.r[it.id]===keyOf(it)) m[k][0]++; });
    return Object.entries(m).map(([k,v]) => `<tr><td>${esc(lab(k))}</td><td class="r">${v[0]}/${v[1]}</td><td class="r">${Math.round(100*v[0]/v[1])} %</td></tr>`).join(''); };
  const mins = Math.round(((ST.fin||Date.now()) - ST.t0)/60000);
  $('#timer').textContent = `Tiempo usado: ${Math.floor(mins/60) ? Math.floor(mins/60) + ' h ' : ''}${mins%60} min`;
  $('#prog').textContent = `${ok}/${ITEMS.length} aciertos`;
  $('#main').innerHTML = `<div class="panel"><div class="big">${String(pct).replace('.',',')} %</div>
  <p style="margin-top:4px">${ok} de ${ITEMS.length} respuestas correctas. ${pct >= 75 ? 'Muy buen resultado: repasa las explicaciones de tus errores para afianzarlo.' : pct >= 65 ? 'Vas bien, pero con poco margen: refuerza los componentes con menor porcentaje.' : 'Todavía no estás en zona segura: practica por tema los componentes con menor porcentaje.'}</p>
  <p class="aviso">Referencia: en el concurso de la Procuraduría la prueba de conocimientos es eliminatoria con mínimo de 65 puntos sobre 100, y la comportamental es clasificatoria. Este porcentaje de aciertos es una guía de preparación; la calificación oficial usa una escala estándar que compara a los aspirantes.</p>
  <h3>Por componente</h3><table>${g(it => it.caso.comp, k => CFG.componentes[k])}</table>
  <h3>Por dificultad</h3><table>${g(it => it.niv, k => CFG.niveles[k])}</table>
  <div class="row" style="margin-top:14px"><button class="btn" id="solo">Ver solo mis errores</button><button class="btn sec" id="todas">Ver todas</button><button class="btn sec" id="otra">Reiniciar el simulacro</button></div></div><div id="rev"></div>`;
  const rev = errs => { const l = errs ? ITEMS.filter(it => ST.r[it.id] !== keyOf(it)) : ITEMS; $('#rev').innerHTML = renderList(l, 'review'); };
  rev(true);
  $('#solo').onclick = () => rev(true); $('#todas').onclick = () => rev(false);
  $('#otra').onclick = () => { ST = {r:{}}; save(); inicio(); window.scrollTo(0,0); };
}

document.addEventListener('click', e => {
  const b = e.target.closest('button.op'); if (!b || b.disabled) return;
  ST.r[b.dataset.id] = b.dataset.l; save();
  const it = ITEMS.find(i => i.id === b.dataset.id);
  const n = b.closest('.item').querySelector('.n').textContent.replace('.','');
  b.closest('.item').outerHTML = itemHTML(it, n, CFG.modo === 'practica' ? 'practica' : 'examen');
  if (CFG.modo === 'practica') { const resp = LIST.filter(i => ST.r[i.id]); const ok = resp.filter(i => ST.r[i.id]===keyOf(i)).length; $('#prog').textContent = `${ok}/${resp.length} aciertos`; $('#pst').textContent = `${LIST.length} preguntas · respondidas ${resp.length} · aciertos ${ok} (${Math.round(100*ok/resp.length)} %)`; }
  else progreso();
});

if (CFG.modo === 'practica') practica();
else if (ST.fin) resultados();
else if (ST.t0) examen();
else inicio();
</script>
</body>
</html>
