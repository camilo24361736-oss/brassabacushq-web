<title>Simulacro 4 · Profesional, asesor y ejecutivo · Procuraduría 2027</title>
<style>body{overflow-wrap:anywhere}
:root{--bg:#f6f8fb;--card:#fff;--ink:#1d2433;--mute:#5a6478;--line:#dbe1ea;--pri:#0b3d6e;--pri2:#1660a8;--ok:#0d6b3a;--okbg:#e6f4ec;--no:#9b1c1c;--nobg:#fbeaea;--sel:#e8f0fa}
@media (prefers-color-scheme: dark){:root{--bg:#10151d;--card:#18202b;--ink:#e6ebf2;--mute:#9aa6b8;--line:#2a3545;--pri:#7fb3ea;--pri2:#9cc6f2;--ok:#7fd3a3;--okbg:#16301f;--no:#f2a3a3;--nobg:#3a1c1c;--sel:#1e2d40}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px}
.hwrap{max-width:860px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
h1{font-size:17px;margin:0;color:var(--pri)}
.stat{font-size:14px;color:var(--mute)}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--pri)}
.timer.low{color:var(--no)}
main{max-width:860px;margin:0 auto;padding:16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin:0 0 16px}
.caso{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--pri);border-radius:10px;padding:14px 16px;margin:22px 0 10px}
.tag{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--pri);font-weight:700}
.caso p{margin:6px 0 0;white-space:pre-line}
.item{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0}
.enun{margin:0 0 8px}
.n{font-weight:700;color:var(--pri)}
.niv{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-right:4px;white-space:nowrap}
.op{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:6px 0;cursor:pointer;background:transparent;width:100%;text-align:left;color:inherit;font:inherit}
.op:hover{border-color:var(--pri2)}
.op .l{font-weight:700;min-width:20px}
.op.sel{background:var(--sel);border-color:var(--pri2)}
.op.ok{background:var(--okbg);border-color:var(--ok)}
.op.no{background:var(--nobg);border-color:var(--no)}
.op[disabled]{cursor:default}
.just{font-size:14px;margin:8px 0 0;padding:8px 10px;border-top:1px dashed var(--line)}
.just div{margin:4px 0}
.just .okt{color:var(--ok);font-weight:700}
.just .not{color:var(--no);font-weight:700}
.src{font-size:13px;color:var(--mute);margin-top:6px}
button.btn{background:var(--pri);color:var(--card);border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer}
button.btn.sec{background:transparent;color:var(--pri);border:1px solid var(--pri)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
select{font:inherit;padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);max-width:100%}
table{border-collapse:collapse;width:100%;font-size:15px}
td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
.big{font-size:40px;font-weight:800;color:var(--pri);line-height:1.1}
.aviso{font-size:13px;color:var(--mute)}
.hide{display:none !important}
.res-ok{color:var(--ok);font-weight:700}.res-no{color:var(--no);font-weight:700}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal .panel{max-width:420px}
footer{max-width:860px;margin:0 auto;padding:8px 16px 40px;font-size:12px;color:var(--mute)}
</style>
</head>

<footer><a href="./" style="color:var(--pri);font-weight:600">← Volver al menú</a><br><br>Material de preparación independiente. No está afiliado a la Procuraduría General de la Nación, a la Universidad de Antioquia ni a ninguna entidad pública, y no contiene preguntas reales de la prueba.</footer>
<script>
const DATA = [{"comp": "estructura_pgn", "rol": "general", "tag": "Estructura y funciones de la Procuraduría · Funciones de los artículos 277 y 278", "texto": "En el despacho del Procurador General se reciben el mismo día tres asuntos: una demanda de inconstitucionalidad que la Corte Constitucional remite para concepto; la solicitud de una veeduría para que la Procuraduría intervenga en un proceso contencioso en el que se discute la nulidad de un contrato que compromete recursos públicos, y una nota del Viceprocurador que recuerda la fecha en que debe presentarse el informe de gestión ante el Congreso. Un asesor nuevo propone delegar todo en las procuradurías delegadas para descongestionar el despacho.", "items": [{"id": "PG-107", "niv": 2, "e": "Respecto del concepto en el proceso de constitucionalidad, la propuesta del asesor es", "f": "Constitución Política, art. 278 num. 5; Decreto Ley 262 de 2000, arts. 7 parágrafo y 8 num. 1", "o": [["A", "procedente, siempre que el concepto lo firme un procurador judicial con categoría equivalente a la de los magistrados de la Corte Constitucional.", "La equiparación del artículo 280 se refiere a los agentes ante los jueces, pero no habilita a nadie distinto del Procurador para rendir el concepto del artículo 278, num. 5, de la Constitución.", false], ["B", "procedente, porque las funciones de intervención ante las altas cortes pueden asignarse a cualquier procurador delegado.", "El concepto de constitucionalidad no es una intervención ordinaria del artículo 277: está en el artículo 278 de la Constitución, cuyas funciones el Procurador ejerce directamente (parágrafo del art. 7 del Decreto Ley 262 de 2000).", false], ["C", "improcedente, pues esa función no admite delegación, aunque una dependencia del despacho proyecte el texto.", "El artículo 278, num. 5, de la Constitución asigna al Procurador el ejercicio directo de la función de rendir concepto en los procesos de control de constitucionalidad. El artículo 8, num. 1, del Decreto Ley 262 de 2000 encarga a la Procuraduría Auxiliar para Asuntos Constitucionales proyectar esos conceptos para consideración del Procurador.", true]]}, {"id": "PG-108", "niv": 2, "e": "De las siguientes funciones, la que el Procurador puede ejercer por medio de sus delegados y agentes es", "f": "Constitución Política, arts. 277 num. 7 y 278 nums. 2 y 3", "o": [["A", "intervenir en el proceso contencioso sobre la nulidad del contrato, en defensa del orden jurídico y del patrimonio público.", "El artículo 277, num. 7, de la Constitución permite al Procurador, por sí o por medio de sus delegados y agentes, intervenir en los procesos ante autoridades judiciales cuando sea necesario en defensa del orden jurídico, del patrimonio público o de los derechos fundamentales.", true], ["B", "presentar proyectos de ley sobre materias relativas a su competencia.", "Presentar proyectos de ley es una función que el Procurador ejerce directamente (art. 278, num. 3, de la Constitución).", false], ["C", "emitir conceptos en los procesos disciplinarios contra funcionarios sometidos a fuero especial.", "Esta función figura en el artículo 278, num. 2, de la Constitución, entre las que el Procurador ejerce directamente.", false]]}, {"id": "PG-109", "niv": 1, "e": "Sobre el informe que recuerda el Viceprocurador, la Constitución establece que el Procurador debe rendir informe de su gestión al Congreso", "f": "Constitución Política, art. 277 num. 8; Decreto Ley 262 de 2000, art. 17 num. 10", "o": [["A", "al terminar su periodo de cuatro años.", "El artículo 277, num. 8, de la Constitución no prevé un único informe al final del periodo, sino uno cada año.", false], ["B", "anualmente.", "El artículo 277, num. 8, de la Constitución ordena rendir anualmente informe de gestión al Congreso; el artículo 17, num. 10, del Decreto Ley 262 de 2000 encarga al Viceprocurador coordinar su elaboración.", true], ["C", "cada semestre, ante la Comisión Primera del Senado.", "La periodicidad constitucional es anual y el destinatario es el Congreso (art. 277, num. 8); la norma no habla de informes semestrales ante una comisión.", false]]}]}, {"comp": "estructura_pgn", "rol": "general", "tag": "Estructura y funciones de la Procuraduría · Agentes del Ministerio Público e intervención judicial", "texto": "Una procuradora judicial II actúa como agente del Ministerio Público ante un tribunal administrativo. Un abogado litigante cuestiona en una audiencia que ella tenga el mismo trato y categoría de los magistrados. Días después, la procuradora delegada que coordina la intervención en ese ramo advierte que en un proceso penal de gran impacto en un municipio interviene el personero municipal y considera necesario que actúe en su lugar un procurador judicial. Además, un nuevo sustanciador pregunta si los procuradores judiciales también intervienen en trámites de conciliación.", "items": [{"id": "PG-116", "niv": 2, "e": "Frente al cuestionamiento del abogado litigante, es correcto afirmar que los agentes del Ministerio Público", "f": "Constitución Política, art. 280", "o": [["A", "tienen la categoría de los jueces de circuito aunque actúen ante un tribunal, porque así lo dispone la planta de personal de la Procuraduría.", "El artículo 280 de la Constitución toma como referencia a los magistrados y jueces de mayor jerarquía ante quienes el agente ejerce; ante un tribunal, la equiparación es con sus magistrados.", false], ["B", "tienen la categoría que determine en cada caso el Procurador General, según la importancia del proceso.", "La categoría de los agentes no depende de una decisión caso a caso: el artículo 280 de la Constitución la fija por equiparación con los magistrados y jueces ante quienes actúan.", false], ["C", "están equiparados en calidades, rango, salario y prestaciones a los magistrados y jueces de mayor jerarquía ante quienes actúan.", "Es la regla del artículo 280 de la Constitución, que equipara a los agentes del Ministerio Público con los magistrados y jueces de mayor jerarquía ante quienes actúan.", true]]}, {"id": "PG-117", "niv": 3, "e": "Respecto del proceso penal en el que interviene el personero, la procuradora delegada coordinadora", "f": "Decreto Ley 262 de 2000, art. 36; Ley 136 de 1994, art. 178", "o": [["A", "puede apartar al personero de esa intervención y disponer que actúe un procurador judicial.", "El artículo 36 del Decreto Ley 262 de 2000 permite a los procuradores delegados con funciones de coordinación de la intervención judicial desplazar a los personeros distritales y municipales, ordenando la intervención de procuradores judiciales.", true], ["B", "debe pedir al concejo municipal que designe un personero ad hoc para ese proceso.", "No existe ese trámite. El artículo 36 del Decreto Ley 262 de 2000 permite a la delegada desplazar directamente al personero y ordenar la intervención de un procurador judicial.", false], ["C", "no puede intervenir, porque las personerías tienen autonomía y el personero solo responde ante el concejo que lo eligió.", "La autonomía de las personerías no impide la coordinación de la intervención judicial: el artículo 36 del Decreto Ley 262 de 2000 permite a los delegados coordinadores desplazar a los personeros en esa función, y el personero actúa bajo la dirección suprema del Procurador (art. 178 de la Ley 136 de 1994).", false]]}, {"id": "PG-118", "niv": 1, "e": "A la pregunta del sustanciador, la respuesta acorde con el Decreto Ley 262 de 2000 es que los procuradores judiciales", "f": "Decreto Ley 262 de 2000, arts. 37 y 41", "o": [["A", "intervienen en la conciliación judicial, pero la conciliación extrajudicial está a cargo exclusivamente de los centros de conciliación.", "Los procuradores judiciales intervienen en los trámites de conciliación (art. 41 del Decreto Ley 262 de 2000), y los de lo contencioso administrativo tienen funciones de conciliación, incluida la extrajudicial (art. 37, adicionado por la Ley 1367 de 2009, y art. 44, parágrafo, num. 4).", false], ["B", "son agentes del Ministerio Público y su labor incluye, entre otras, actuar en los trámites conciliatorios.", "El artículo 41 del Decreto Ley 262 de 2000 dispone que los procuradores judiciales son agentes del Ministerio Público, intervienen ante las autoridades judiciales y también en los trámites de conciliación; el artículo 37 les asigna funciones de conciliación en lo contencioso administrativo.", true], ["C", "intervienen en conciliaciones solo cuando el juez los designa como conciliadores particulares.", "Su intervención en conciliación deriva de la ley y de su condición de agentes del Ministerio Público (arts. 37 y 41 del Decreto Ley 262 de 2000), no de una designación como conciliadores particulares.", false]]}]}, {"comp": "estructura_pgn", "rol": "general", "tag": "Estructura y funciones de la Procuraduría · Funciones del Procurador General y comisiones especiales", "texto": "Una procuraduría regional adelanta una investigación por la caída de un puente construido con recursos departamentales que causó varias víctimas. Por la conmoción nacional, el Procurador General considera asumir personalmente el proceso. Como alternativa, su asesor propone crear una comisión disciplinaria especial integrada por servidores de la Procuraduría. Al mismo tiempo, la Secretaría General solicita trasladar dos cargos de sustanciador de la planta globalizada desde el nivel central hacia esa regional para atender la congestión.", "items": [{"id": "PG-134", "niv": 3, "e": "Sobre la posibilidad de que el Procurador asuma personalmente el proceso, es correcto afirmar que", "f": "Decreto Ley 262 de 2000, arts. 7 num. 16 y parágrafo, 25 parágrafo 2 y 77 (modificados por el Decreto Ley 1851 de 2021)", "o": [["A", "puede hacerlo cuando la importancia o trascendencia del asunto requiera su atención personal.", "El artículo 7, num. 16, del Decreto Ley 262 de 2000, modificado por el Decreto Ley 1851 de 2021, faculta al Procurador para asumir el conocimiento de procesos disciplinarios cuando la importancia o trascendencia del asunto lo requieran; el parágrafo del mismo artículo le permite asumir en cualquier momento las funciones asignadas a otras dependencias.", true], ["B", "requiere concepto previo favorable del Comité Técnico de la función disciplinaria, como ocurre con las procuradurías delegadas.", "El concepto del Comité Técnico es requisito para que las procuradurías delegadas ejerzan competencia preferente sobre las territoriales (art. 25, parágrafo 2), no para que el Procurador General asuma un asunto.", false], ["C", "solo puede hacerlo si el investigado lo solicita, para garantizar el juez natural.", "La facultad del artículo 7, num. 16, no depende de una solicitud del investigado; la petición del investigado es relevante, por ejemplo, para el cambio de radicación (art. 77), que es una figura distinta.", false]]}, {"id": "PG-135", "niv": 3, "e": "Si el Procurador opta por la comisión disciplinaria especial, el fallo será proferido por", "f": "Decreto Ley 262 de 2000, art. 7 num. 18 (modificado por el art. 2 del Decreto Ley 1851 de 2021)", "o": [["A", "el procurador regional desplazado, que conserva la competencia para decidir.", "Al crearse la comisión especial, el funcionario desplazado pierde el conocimiento; el fallo lo profiere quien presida la comisión o el funcionario designado (art. 7, num. 18).", false], ["B", "quien presida la comisión o el funcionario designado para juzgar, siempre que no tenga menor rango que el desplazado.", "Así lo dispone el artículo 7, num. 18, del Decreto Ley 262 de 2000, modificado por el Decreto Ley 1851 de 2021.", true], ["C", "cualquiera de los integrantes de la comisión, sin importar su jerarquía, porque la designación especial suple la competencia.", "El artículo 7, num. 18, exige que quien falle sea de igual o superior jerarquía que el funcionario desplazado.", false]]}, {"id": "PG-136", "niv": 1, "e": "La decisión de reubicar los cargos de sustanciador de la planta globalizada en la procuraduría regional corresponde a", "f": "Decreto Ley 262 de 2000, arts. 7 num. 34 y 87", "o": [["A", "el procurador regional que recibirá los cargos.", "Los procuradores regionales no distribuyen la planta de la entidad; esa función es del Procurador General (art. 7, num. 34, del Decreto Ley 262 de 2000).", false], ["B", "el jefe de la División de Gestión Humana, mediante acto de traslado.", "El traslado de un servidor es una figura distinta (art. 87); distribuir y reubicar los empleos de la planta globalizada es función del Procurador General (art. 7, num. 34).", false], ["C", "el Procurador General.", "El artículo 7, num. 34, del Decreto Ley 262 de 2000, modificado por el Decreto Ley 1851 de 2021, asigna al Procurador distribuir y reubicar los empleos de la planta de personal globalizada entre las dependencias, según las necesidades del servicio.", true]]}]}, {"comp": "estructura_pgn", "rol": "general", "tag": "Estructura y funciones de la Procuraduría · Procuradurías provinciales y regionales: funciones comunes", "texto": "La procuradora provincial de un municipio intermedio enfrenta tres situaciones. En el circuito judicial no hay procurador judicial y se adelanta un proceso en el que es necesario intervenir para defender el patrimonio público. Además, el personero municipal y ella se declaran ambos competentes para instruir una actuación disciplinaria contra un inspector de policía. Por último, un auxiliar recién vinculado pregunta quién es el superior directo de la procuradora provincial.", "items": [{"id": "PG-155", "niv": 1, "e": "A la pregunta del auxiliar, la respuesta acorde con el Decreto Ley 262 de 2000 es que los procuradores provinciales dependen directamente", "f": "Decreto Ley 262 de 2000, art. 80", "o": [["A", "del Viceprocurador General, que coordina el nivel territorial.", "El artículo 80 del Decreto Ley 262 de 2000 no asigna esa dependencia al Viceprocurador.", false], ["B", "del procurador regional respectivo.", "El artículo 80 del Decreto Ley 262 de 2000 dispone que los procuradores provinciales dependen directamente de los respectivos procuradores regionales; los regionales y distritales dependen del Procurador General.", true], ["C", "del Procurador General de la Nación, como los procuradores regionales y distritales.", "Del Procurador General dependen directamente los regionales y distritales; los provinciales dependen del regional (art. 80).", false]]}, {"id": "PG-156", "niv": 2, "e": "Respecto del proceso judicial en el circuito donde no hay procurador judicial, la procuradora provincial", "f": "Decreto Ley 262 de 2000, art. 76B num. 5 (adicionado por el art. 24 del Decreto Ley 1851 de 2021)", "o": [["A", "puede intervenir eventualmente como Ministerio Público, previa comunicación al procurador delegado correspondiente.", "El artículo 76B, num. 5, del Decreto Ley 262 de 2000, adicionado por el artículo 24 del Decreto Ley 1851 de 2021, permite a las provinciales intervenir eventualmente como Ministerio Público en asuntos de los procuradores judiciales donde estos no existan o no puedan actuar, previa comunicación al delegado.", true], ["B", "no puede intervenir, porque esa función es exclusiva de los procuradores judiciales.", "El artículo 76B, num. 5, prevé precisamente la intervención eventual de las provinciales cuando no existen procuradores judiciales o no pueden actuar.", false], ["C", "debe pedir al juez que designe un curador ad litem que represente el interés público.", "El curador ad litem no reemplaza al Ministerio Público; la norma prevé la intervención eventual de la procuraduría provincial (art. 76B, num. 5).", false]]}, {"id": "PG-157", "niv": 2, "e": "El conflicto de competencia entre el personero y la procuradora provincial, en etapa de instrucción, lo dirime", "f": "Decreto Ley 262 de 2000, arts. 22 num. 1 y 75 num. 10 (modificados por el Decreto Ley 1851 de 2021)", "o": [["A", "la Sala Disciplinaria de Instrucción del nivel central.", "La Sala de Instrucción resuelve conflictos en los procesos de las delegadas de instrucción (art. 22, num. 1, lit. b), no entre personeros y provinciales.", false], ["B", "el concejo municipal, como autoridad que eligió al personero.", "El concejo no tiene competencia para resolver conflictos de competencia disciplinaria; la norma la asigna a la procuraduría regional de instrucción (art. 75, num. 10).", false], ["C", "la procuraduría regional de instrucción correspondiente.", "El artículo 75, num. 10, del Decreto Ley 262 de 2000, modificado por el artículo 19 del Decreto Ley 1851 de 2021, asigna a las regionales de instrucción dirimir los conflictos de competencia entre los personeros y los procuradores provinciales en etapa de instrucción.", true]]}]}, {"comp": "estructura_pgn", "rol": "profesional", "tag": "Estructura y funciones de la Procuraduría · Niveles profesional, asesor y ejecutivo · Competencia preferente interna y conexidad", "texto": "Usted es asesor de una procuraduría regional de instrucción y debe proyectar decisiones en tres asuntos. Una procuraduría provincial recibió una queja contra un funcionario cuya investigación corresponde a una procuraduría delegada y pregunta si puede adelantar alguna actuación. En otro proceso, por los mismos hechos deben investigarse un diputado y un concejal de un municipio que no es capital de departamento. Además, una procuraduría delegada de instrucción manifiesta interés en asumir un proceso que adelanta una provincial contra un alcalde.", "items": [{"id": "PG-158", "niv": 3, "e": "Respecto de la queja de competencia de la procuraduría delegada, la procuraduría provincial", "f": "Decreto Ley 262 de 2000, arts. 76 num. 2 y 79 (art. 76 modificado por el art. 22 del Decreto Ley 1851 de 2021)", "o": [["A", "puede avanzar hasta antes de abrir investigación, siempre que informe al delegado a más tardar al día hábil siguiente de iniciar.", "El artículo 76, num. 2, del Decreto Ley 262 de 2000, modificado por el artículo 22 del Decreto Ley 1851 de 2021, permite a las provinciales adelantar actuaciones de competencia de los delegados hasta antes de la apertura de la investigación, con aviso al delegado a más tardar el día siguiente hábil, para que asuma si lo estima conveniente.", true], ["B", "puede adelantar la investigación hasta el pliego de cargos, que debe someter a la aprobación del delegado.", "La provincial solo puede actuar hasta antes de la apertura de investigación (art. 76, num. 2); la investigación y el pliego corresponden al delegado competente, y el archivo y el fallo al competente (art. 79).", false], ["C", "debe remitir la queja al delegado sin practicar diligencias, porque el asunto no es de su competencia.", "La norma autoriza a la provincial a adelantar la actuación hasta antes de la apertura de investigación, con aviso al delegado (art. 76, num. 2); no la obliga a remitir sin actuar.", false]]}, {"id": "PG-159", "niv": 3, "e": "En la investigación conjunta del diputado y del concejal, la competencia para conocer en primera instancia corresponde a", "f": "Decreto Ley 262 de 2000, art. 75 parágrafo 1 (modificado por el art. 19 del Decreto Ley 1851 de 2021)", "o": [["A", "dos procuradurías distintas, porque la conexidad no altera la competencia por el sujeto.", "La conexidad sí unifica la competencia: el parágrafo 1 del artículo 75 la atribuye a la regional.", false], ["B", "la procuraduría regional de instrucción, que conoce de ambos por razones de conexidad.", "El parágrafo 1 del artículo 75 del Decreto Ley 262 de 2000 dispone que, cuando por conexidad deban investigarse asuntos de competencia de una regional y de procuradurías distritales o provinciales, conoce en primera instancia la regional.", true], ["C", "la procuraduría provincial, por el factor territorial del municipio del concejal.", "Cuando por conexidad concurren asuntos de una regional y de una provincial, la competencia es de la regional (art. 75, parágrafo 1).", false]]}, {"id": "PG-160", "niv": 3, "e": "Para que la procuraduría delegada de instrucción asuma el proceso que adelanta la provincial contra el alcalde, se requiere", "f": "Decreto Ley 262 de 2000, art. 25 parágrafo 2 (modificado por el art. 12 del Decreto Ley 1851 de 2021)", "o": [["A", "la autorización del procurador regional, como superior funcional de la provincial.", "La norma no exige autorización del regional; el requisito es el concepto favorable del Comité Técnico de la función disciplinaria (art. 25, parágrafo 2).", false], ["B", "que el alcalde lo solicite, porque la elección popular impide variar la competencia sin su consentimiento.", "El parágrafo 2 del artículo 25 permite el ejercicio de la competencia preferente inclusive contra servidores de elección popular, sin requerir el consentimiento del investigado.", false], ["C", "concepto previo favorable del Comité Técnico de la función disciplinaria.", "El parágrafo 2 del artículo 25 del Decreto Ley 262 de 2000, modificado por el Decreto Ley 1851 de 2021, otorga a las delegadas de instrucción competencia preferente sobre procesos de las regionales, distritales y provinciales, inclusive contra servidores de elección popular, previo concepto favorable de ese comité.", true]]}]}, {"comp": "estructura_pgn", "rol": "general", "tag": "Estructura y funciones de la Procuraduría · Lista de elegibles", "texto": "Terminado un concurso de méritos de la Procuraduría para el empleo de profesional universitario, el puntaje máximo posible era de 100 puntos. Los resultados consolidados de cuatro concursantes fueron: 82,4; 74,1; 70,0 y 68,9 puntos. Un concursante pregunta en la Oficina de Selección y Carrera cuál es el puntaje mínimo para integrar la lista, cuánto tiempo estará vigente esta y en qué plazo debe producirse el nombramiento de quien ocupe el primer lugar en un empleo que ya estaba vacante al convocarse el concurso.", "items": [{"id": "PG-176", "niv": 1, "e": "Con un puntaje máximo posible de 100 puntos, el puntaje total mínimo para integrar la lista de elegibles es", "f": "Decreto Ley 262 de 2000, art. 216", "o": [["A", "65 puntos.", "El 65 sobre 100 es el mínimo aprobatorio de la prueba de conocimientos en la convocatoria (Resolución 076 de 2026), no el umbral legal para integrar la lista de elegibles, que es el 70 % del puntaje total máximo (art. 216 del Decreto Ley 262 de 2000).", false], ["B", "70 puntos.", "El artículo 216 del Decreto Ley 262 de 2000 dispone que integran la lista quienes obtengan un puntaje total igual o superior al 70 % del máximo posible: 70 % de 100 es 70. Por eso integran la lista los tres primeros concursantes, incluido quien obtuvo exactamente 70,0.", true], ["C", "75 puntos.", "No corresponde al porcentaje legal del 70 % del puntaje máximo posible (art. 216).", false]]}, {"id": "PG-177", "niv": 2, "e": "La lista de elegibles tendrá una vigencia de", "f": "Decreto Ley 262 de 2000, art. 216", "o": [["A", "un año contado desde la posesión del primero de la lista.", "La vigencia es de dos años y se cuenta desde la publicación de la lista (art. 216).", false], ["B", "cuatro años, igual al periodo del Procurador que la expidió.", "La vigencia de la lista no está atada al periodo del Procurador; es de dos años desde su publicación (art. 216).", false], ["C", "dos años contados desde su publicación.", "El artículo 216 del Decreto Ley 262 de 2000 dispone que la lista, elaborada en riguroso orden de mérito, tiene vigencia de dos años contados desde su publicación y debe estar contenida en resolución del Procurador General.", true]]}, {"id": "PG-178", "niv": 2, "e": "El nombramiento de quien ocupa el primer lugar, para el empleo que ya estaba vacante, debe producirse", "f": "Decreto Ley 262 de 2000, arts. 185, 190 y 217", "o": [["A", "dentro de los veinte días hábiles siguientes a la publicación de la lista.", "El artículo 217 del Decreto Ley 262 de 2000 ordena producir el nombramiento en periodo de prueba o en propiedad dentro de los veinte días hábiles siguientes a la publicación de la lista, salvo lo previsto en el artículo 190.", true], ["B", "en cualquier momento durante la vigencia de la lista.", "Para empleos vacantes al momento de la convocatoria, el artículo 217 fija un plazo de veinte días hábiles desde la publicación de la lista.", false], ["C", "dentro de los tres meses siguientes al cierre de inscripciones.", "El término de tres meses del artículo 185 se refiere a la convocatoria del concurso después de un encargo o una provisionalidad, no al nombramiento del elegible.", false]]}]}, {"comp": "gestion_publica", "rol": "general", "tag": "Gestión pública y funcionamiento del Estado · Principios de la función administrativa", "texto": "Usted es técnico administrativo de la secretaría de tránsito de un distrito. En una misma semana ocurre lo siguiente: el coordinador de la ventanilla ordena atender primero, sin turno, a los usuarios que lleguen recomendados por concejales; la secretaría expidió una resolución con nuevas tarifas de los parqueaderos oficiales para vehículos inmovilizados y empezó a cobrarlas sin haberla publicado ni dado a conocer; y un usuario le pregunta qué figuras prevé la Constitución para distribuir el trabajo y las decisiones entre el secretario y otros servidores u organismos.", "items": [{"id": "GE-111", "niv": 1, "e": "La orden del coordinador de atender primero a los recomendados desconoce principalmente", "f": "Constitución Política, art. 209; Ley 1437 de 2011, art. 3", "o": [["A", "el principio de publicidad, porque los demás usuarios no conocen el orden de atención.", "La publicidad exige dar a conocer las actuaciones; aunque el orden se publicara, seguiría siendo un favoritismo contrario a la imparcialidad.", false], ["B", "el principio de economía, porque altera el uso racional del tiempo de los funcionarios.", "El principio de economía se refiere al uso eficiente de tiempo y recursos. El problema central de la orden es el trato preferente por razones de afecto o interés, propio de la imparcialidad.", false], ["C", "el principio de imparcialidad, porque introduce un trato preferente por razones ajenas al interés general.", "El artículo 209 de la Constitución incluye la imparcialidad entre los principios de la función administrativa, y el artículo 3 del CPACA la explica como actuar sin consideración de factores de afecto o de interés, garantizando los derechos de todas las personas sin discriminación.", true]]}, {"id": "GE-112", "niv": 2, "e": "El cobro de las nuevas tarifas sin haber dado a conocer la resolución contraría", "f": "Constitución Política, art. 209; Ley 1437 de 2011, arts. 3 y 65", "o": [["A", "el principio de celeridad, porque la resolución se expidió sin respetar los términos de trámite.", "El caso no menciona demoras ni términos incumplidos; la falla consiste en exigir una decisión que no se ha dado a conocer.", false], ["B", "el principio de publicidad, porque las decisiones deben darse a conocer para ser exigibles.", "La publicidad es principio de la función administrativa (art. 209 de la Constitución). El CPACA (art. 3, num. 9) ordena dar a conocer las decisiones mediante comunicaciones, notificaciones o publicaciones, y los actos de carácter general no son obligatorios mientras no se publiquen (art. 65).", true], ["C", "el principio de eficacia, porque los cobros no lograrán su finalidad de recaudo.", "La eficacia busca que los procedimientos logren su finalidad; el defecto descrito no es de resultado sino de falta de divulgación de la decisión, propio del principio de publicidad.", false]]}, {"id": "GE-113", "niv": 2, "e": "Al usuario que pregunta por las figuras para distribuir funciones, usted le indica que el artículo 209 de la Constitución menciona", "f": "Constitución Política, art. 209", "o": [["A", "la descentralización, la delegación y la desconcentración de funciones.", "El artículo 209 de la Constitución dispone que la función administrativa se desarrolla mediante la descentralización, la delegación y la desconcentración de funciones.", true], ["B", "la avocación, la subrogación y la sustitución de competencias entre servidores.", "Ninguna de esas figuras aparece en el artículo 209; además, la avocación y la sustitución no son mecanismos ordinarios para distribuir funciones administrativas.", false], ["C", "la tercerización, la concesión y la comisión de servicios.", "La concesión es un contrato y la comisión una situación administrativa del empleado; ninguna es mencionada por el artículo 209 como forma de desarrollar la función administrativa.", false]]}]}, {"comp": "gestion_publica", "rol": "general", "tag": "Gestión pública y funcionamiento del Estado · Organización territorial y autonomía", "texto": "Usted es profesional universitario de una procuraduría regional y acompaña un foro con concejales de varios municipios del departamento sobre organización territorial. Durante el foro surgen tres inquietudes: un concejal afirma que los corregimientos y las comunas de su municipio son entidades territoriales con los mismos derechos que el municipio; otro pregunta qué derechos concretos les da la autonomía que reconoce la Constitución; y un tercero pide precisar qué lugar ocupa el municipio en la organización del Estado.", "items": [{"id": "GE-124", "niv": 1, "e": "Según la Constitución, son entidades territoriales", "f": "Constitución Política, art. 286", "o": [["A", "los departamentos, los municipios, los corregimientos y las comunas.", "Los corregimientos y las comunas son divisiones administrativas internas del municipio, no entidades territoriales (art. 286 de la Constitución).", false], ["B", "los departamentos, los municipios, las áreas metropolitanas y las asociaciones de municipios.", "Las áreas metropolitanas y las asociaciones de municipios son formas de organización o asociación entre municipios, pero la Constitución no las enumera como entidades territoriales (art. 286).", false], ["C", "los departamentos, los distritos, los municipios y los territorios indígenas.", "El artículo 286 de la Constitución dispone que son entidades territoriales los departamentos, los distritos, los municipios y los territorios indígenas, y que la ley podrá dar ese carácter a las regiones y provincias que se constituyan.", true]]}, {"id": "GE-125", "niv": 2, "e": "Entre los derechos que la autonomía otorga a las entidades territoriales se encuentra el de", "f": "Constitución Política, art. 287", "o": [["A", "dictar sus propias leyes en las materias que el Congreso de la República no haya regulado todavía.", "Las entidades territoriales no expiden leyes: asambleas y concejos dictan ordenanzas y acuerdos sujetos a la Constitución y la ley. La función legislativa corresponde al Congreso.", false], ["B", "administrar sus recursos y establecer los tributos necesarios para cumplir sus funciones.", "El artículo 287 de la Constitución reconoce a las entidades territoriales, dentro de los límites de la Constitución y la ley, los derechos a gobernarse por autoridades propias, ejercer las competencias que les correspondan, administrar los recursos y establecer los tributos necesarios para el cumplimiento de sus funciones, y participar en las rentas nacionales.", true], ["C", "fijar por sí mismas el régimen de inhabilidades e incompatibilidades de sus servidores.", "El régimen de inhabilidades e incompatibilidades es materia de la Constitución y la ley; la autonomía territorial no faculta a las entidades para establecerlo.", false]]}, {"id": "GE-126", "niv": 1, "e": "En cuanto al lugar del municipio en la organización del Estado, la Constitución establece que", "f": "Constitución Política, arts. 286 y 311", "o": [["A", "es la entidad fundamental de la división político-administrativa del Estado.", "El artículo 311 de la Constitución define al municipio como entidad fundamental de la división político-administrativa del Estado, encargado de prestar los servicios públicos que determine la ley y construir las obras que demande el progreso local, entre otras tareas.", true], ["B", "es una dependencia del departamento, encargada de ejecutar en su territorio las políticas departamentales.", "El municipio es una entidad territorial con autonomía (arts. 286 y 287), no una dependencia del departamento; este cumple funciones de coordinación y complementariedad (art. 298).", false], ["C", "es una entidad descentralizada por servicios del orden departamental.", "La descentralización por servicios se predica de entidades como los establecimientos públicos; el municipio es una entidad territorial, es decir, una forma de descentralización territorial.", false]]}]}, {"comp": "gestion_publica", "rol": "profesional", "tag": "Gestión pública y funcionamiento del Estado · Niveles profesional, asesor y ejecutivo · Responsabilidad patrimonial y acción de repetición", "texto": "Usted es profesional especializado de una procuraduría judicial administrativa. En septiembre de 2025 quedó ejecutoriada una sentencia que condenó a un municipio a indemnizar a un motociclista que sufrió graves lesiones al caer en una excavación sin señalizar; en el proceso quedó probado que el secretario de obras ignoró, con culpa grave, varias alertas escritas sobre el peligro. El municipio pagó la totalidad de la condena el 10 de marzo de 2026, dentro del plazo legal para pagar condenas. En octubre de 2026 usted verifica que el municipio aún no ha presentado demanda de repetición contra el exsecretario.", "items": [{"id": "GE-144", "niv": 1, "e": "El fundamento constitucional de la condena al municipio y de la posible repetición contra el exsecretario es que", "f": "Constitución Política, art. 90", "o": [["A", "el Estado solo responde cuando el servidor actuó con dolo, y en ese caso es el servidor quien paga directamente a la víctima.", "El Estado responde por los daños antijurídicos que le sean imputables, sin que se exija dolo del agente; la culpa grave o el dolo del servidor importan para la repetición, no para la responsabilidad del Estado frente a la víctima (art. 90).", false], ["B", "el Estado responde por todo daño y puede repetir contra cualquier servidor que haya intervenido, aunque no haya actuado con culpa.", "La repetición solo procede contra el agente cuya conducta fue dolosa o gravemente culposa (art. 90); no alcanza a cualquier servidor que haya intervenido.", false], ["C", "el Estado responde por los daños antijurídicos que le sean imputables y repite contra el agente que actuó con dolo o culpa grave.", "El artículo 90 de la Constitución dispone que el Estado responde patrimonialmente por los daños antijurídicos que le sean imputables, causados por la acción o la omisión de las autoridades, y que, si es condenado por un daño que fue consecuencia de la conducta dolosa o gravemente culposa de un agente suyo, debe repetir contra este.", true]]}, {"id": "GE-145", "niv": 3, "e": "Como el municipio no presentó la demanda dentro de los seis meses siguientes al pago,", "f": "Ley 678 de 2001, art. 8 (modificado por la Ley 2195 de 2022, art. 41)", "o": [["A", "pueden ejercerla el Ministerio Público o el Ministerio de Justicia y del Derecho, por medio de la Agencia Nacional de Defensa Jurídica.", "El artículo 8 de la Ley 678 de 2001, modificado por el artículo 41 de la Ley 2195 de 2022, ordena a la entidad perjudicada ejercer la acción dentro de los seis meses siguientes al pago total y dispone que, si no lo hace, pueden ejercerla el Ministerio Público y el Ministerio de Justicia y del Derecho a través de la Agencia Nacional de Defensa Jurídica del Estado.", true], ["B", "la acción de repetición caducó, porque ese era el plazo para presentarla.", "Los seis meses son el plazo en que debe actuar la entidad perjudicada (art. 8 de la Ley 678), no el término de caducidad, que es de cinco años (art. 11 de la Ley 678 y art. 164 del CPACA).", false], ["C", "solo el municipio puede presentarla, y por haber vencido el plazo únicamente procede una investigación disciplinaria contra el alcalde.", "La omisión del representante legal puede ser falta disciplinaria (par. 2 del art. 8), pero la ley no deja la acción solo en manos del municipio: vencido el plazo, pueden ejercerla el Ministerio Público y la Agencia Nacional de Defensa Jurídica del Estado.", false]]}, {"id": "GE-146", "niv": 2, "e": "El término de caducidad para demandar en repetición en este caso es de", "f": "Ley 678 de 2001, art. 11 y Ley 1437 de 2011, art. 164, num. 2, lit. l (modificados por la Ley 2195 de 2022, arts. 42 y 43)", "o": [["A", "dos años contados desde la ejecutoria de la sentencia condenatoria.", "Ese fue el término anterior a la Ley 2195 de 2022. Para condenas ejecutoriadas después de su vigencia, el término es de cinco años y se cuenta desde el día siguiente al pago.", false], ["B", "cinco años contados desde el día siguiente a la fecha del pago.", "El artículo 11 de la Ley 678 de 2001 (modificado por el artículo 42 de la Ley 2195 de 2022) y el literal l) del numeral 2 del artículo 164 del CPACA fijan cinco años contados desde el día siguiente al pago o, a más tardar, desde el vencimiento del plazo que tiene la administración para pagar la condena (diez meses según el artículo 192 del CPACA). Como la sentencia quedó ejecutoriada en septiembre de 2025 y el pago se hizo en marzo de 2026, dentro de ese plazo, el término corre desde el día siguiente al pago.", true], ["C", "cuatro meses contados desde el pago, que es el plazo con que cuenta el comité de conciliación para decidir.", "El término con que cuenta el comité de conciliación para estudiar la procedencia de la repetición es un plazo administrativo, distinto del término de caducidad de la acción.", false]]}]}, {"comp": "gestion_publica", "rol": "general", "tag": "Gestión pública y funcionamiento del Estado · Acciones de cumplimiento y popular", "texto": "Usted es profesional universitario de una procuraduría provincial y atiende a un veedor ciudadano que consulta tres asuntos sobre la alcaldía de su municipio. Primero: un acuerdo municipal vigente ordena a la alcaldía publicar cada trimestre un informe de avance de las obras públicas, y en dos años nunca lo ha publicado; el veedor no ha hecho ninguna solicitud previa. Segundo: otro acuerdo ordena construir un polideportivo con un costo estimado de $3.000 millones, que no se ha ejecutado. Tercero: un comerciante ocupa con mesas y vitrinas el andén de la plaza principal, lo que obliga a los peatones a caminar por la vía, y la alcaldía no ha hecho nada.", "items": [{"id": "GE-150", "niv": 2, "e": "Para exigir judicialmente la publicación del informe trimestral, el veedor debe", "f": "Ley 393 de 1997, art. 8; Ley 1437 de 2011, art. 161, num. 3", "o": [["A", "pedir antes a la alcaldía que cumpla el acuerdo y esperar a que se ratifique en el incumplimiento o no responda en diez días.", "El artículo 8 de la Ley 393 de 1997 exige, para constituir la renuencia, que el accionante haya reclamado previamente el cumplimiento del deber y que la autoridad se haya ratificado en el incumplimiento o no haya contestado dentro de los diez días siguientes; solo excepcionalmente se prescinde de ello ante un perjuicio irremediable.", true], ["B", "presentar directamente la demanda de cumplimiento, porque el acuerdo es un acto administrativo de carácter general.", "Salvo inminente perjuicio irremediable, la acción exige que antes se haya reclamado el cumplimiento a la autoridad y que esta se ratifique en el incumplimiento o no conteste en diez días (art. 8 de la Ley 393).", false], ["C", "solicitar primero la conciliación extrajudicial ante la procuraduría judicial administrativa, como requisito de procedibilidad.", "La conciliación extrajudicial no es requisito de la acción de cumplimiento; el requisito de procedibilidad es la constitución en renuencia (art. 8 de la Ley 393 de 1997 y art. 161, num. 3, del CPACA).", false]]}, {"id": "GE-151", "niv": 3, "e": "Respecto del acuerdo que ordena construir el polideportivo, la acción de cumplimiento", "f": "Ley 393 de 1997, art. 9, par.", "o": [["A", "procede, porque el acuerdo es un acto administrativo vigente y la alcaldía lo ha incumplido.", "La vigencia del acto y el incumplimiento no bastan: la ley excluye expresamente de esta acción el cumplimiento de normas que establezcan gastos (par. del art. 9 de la Ley 393).", false], ["B", "procede solo si el veedor demuestra que sufrirá un perjuicio irremediable.", "El perjuicio irremediable permite prescindir de la renuencia previa (art. 8), pero no supera la improcedencia frente a normas que establecen gastos (par. del art. 9).", false], ["C", "no procede, porque no puede perseguir el cumplimiento de normas que establezcan gastos.", "El parágrafo del artículo 9 de la Ley 393 de 1997 dispone que la acción de cumplimiento no podrá perseguir el cumplimiento de normas que establezcan gastos, como ocurre con un acuerdo que ordena construir una obra de $3.000 millones.", true]]}, {"id": "GE-152", "niv": 3, "e": "Frente a la ocupación del andén de la plaza, el veedor puede", "f": "Constitución Política, art. 88; Ley 472 de 1998, art. 4; Ley 1437 de 2011, art. 144", "o": [["A", "interponer una tutela, porque la ocupación del andén vulnera su derecho fundamental a la libre circulación.", "La afectación descrita recae sobre el espacio público, un derecho colectivo, cuya vía principal es la acción popular; la tutela es subsidiaria y no está diseñada para estos intereses colectivos.", false], ["B", "ejercer la acción popular para proteger el espacio público, previa solicitud a la alcaldía para que adopte medidas, salvo peligro inminente.", "El goce del espacio público es un derecho colectivo (art. 4 de la Ley 472 de 1998; art. 88 de la Constitución). El inciso tercero del artículo 144 del CPACA exige pedir antes a la autoridad que adopte las medidas de protección y permite acudir al juez si no lo hace en quince días o se niega, salvo inminente peligro de perjuicio irremediable.", true], ["C", "acudir al personero municipal, que es el único legitimado para ejercer acciones populares.", "Cualquier persona puede demandar la protección de los derechos colectivos (art. 144 del CPACA y Ley 472 de 1998); el personero también puede hacerlo, pero no es el único legitimado.", false]]}]}, {"comp": "atencion_usuario", "rol": "general", "tag": "Atención al usuario · Atención prioritaria de peticiones", "texto": "Usted trabaja en el centro de atención al ciudadano de una procuraduría regional. Llega una mujer con su hijo de 8 años, que requiere con urgencia un medicamento formulado que la EPS no ha entregado; el médico tratante certificó por escrito que la demora pone en riesgo la vida del niño. Ella presenta una petición para que la Procuraduría intervenga ante la EPS y anexa la fórmula y la certificación médica. En la misma fila espera una periodista de un medio regional que, para preparar una nota, pide información sobre el número de quejas recibidas contra alcaldes del departamento durante el último año.", "items": [{"id": "AU-125", "niv": 2, "e": "Para que la petición de la madre reciba atención prioritaria, se requiere que", "f": "Ley 1755 de 2015, art. 1 (art. 20 de la Ley 1437 de 2011)", "o": [["A", "pruebe, al menos de forma sumaria, la titularidad del derecho fundamental del niño y el riesgo de un daño irremediable.", "El artículo 20 del CPACA ordena dar atención prioritaria a las peticiones de reconocimiento de un derecho fundamental que deban resolverse para evitar un perjuicio irremediable; el peticionario debe probar sumariamente la titularidad del derecho y el riesgo.", true], ["B", "aporte una sentencia de tutela que ordene a la EPS entregar el medicamento dentro de un plazo determinado.", "La atención prioritaria no depende de una orden judicial; precisamente busca evitar el perjuicio irremediable sin esperar otros trámites.", false], ["C", "acredite que antes presentó una queja ante la Superintendencia de Salud y que no obtuvo respuesta oportuna.", "La ley no exige agotar quejas ante otras entidades para obtener atención prioritaria; basta la prueba sumaria del derecho y del riesgo.", false]]}, {"id": "AU-126", "niv": 1, "e": "Dado que la vida del niño está en peligro inminente por razones de salud, la autoridad debe", "f": "Ley 1755 de 2015, art. 1 (art. 20, inciso 2, de la Ley 1437 de 2011)", "o": [["A", "resolver la petición dentro de los cinco días siguientes, término especial previsto para las peticiones en salud.", "La ley no fija un término especial de cinco días para peticiones en salud; ordena adoptar de inmediato medidas de urgencia.", false], ["B", "tramitar la petición en el turno que le corresponda y adoptar medidas solo cuando decida de fondo.", "Cuando está en peligro inminente la vida o la integridad, las medidas de urgencia no esperan la decisión de fondo.", false], ["C", "adoptar de inmediato las medidas de urgencia necesarias, sin perjuicio del trámite que deba darse a la petición.", "El inciso 2 del artículo 20 del CPACA dispone que, si por razones de salud o de seguridad personal está en peligro inminente la vida o la integridad del destinatario, la autoridad adoptará de inmediato las medidas de urgencia, sin perjuicio del trámite de la petición.", true]]}, {"id": "AU-127", "niv": 1, "e": "Sobre la solicitud de la periodista, es correcto afirmar que", "f": "Ley 1755 de 2015, art. 1 (art. 20, inciso 2, de la Ley 1437 de 2011)", "o": [["A", "solo puede atenderse con preferencia si acredita una tarjeta profesional de periodista expedida por el Estado.", "La norma no exige tarjeta profesional; basta que la petición se haga para el ejercicio de la actividad periodística.", false], ["B", "se tramita de manera preferencial, porque la formula para el ejercicio de su actividad como periodista.", "El inciso 2 del artículo 20 del CPACA dispone que la petición que realiza un periodista para el ejercicio de su actividad se tramita preferencialmente.", true], ["C", "debe esperar el término general de quince días, porque la información estadística no admite trato preferente.", "La ley ordena el trámite preferencial de las peticiones de periodistas para su actividad; además, una petición de información tiene término especial de diez días, no de quince.", false]]}]}, {"comp": "atencion_usuario", "rol": "general", "tag": "Atención al usuario · Información pública clasificada y reservada", "texto": "Un ciudadano presenta ante una ESE hospital departamental una solicitud de acceso a la información en la que pide: el contrato de suministro de medicamentos suscrito el año anterior; la historia clínica de un vecino suyo, quien no lo ha autorizado para pedirla; y un informe de auditoría interna que, además de datos generales de la gestión, incluye en un anexo los diagnósticos de algunos pacientes identificados con nombre. El jefe de la oficina jurídica le exige al ciudadano que explique para qué quiere la información antes de darle trámite.", "items": [{"id": "AU-137", "niv": 1, "e": "La exigencia del jefe de la oficina jurídica es", "f": "Ley 1712 de 2014, arts. 3 (principio de no discriminación) y 10", "o": [["A", "procedente, porque la entidad debe valorar si el interés del solicitante justifica el acceso.", "El principio de no discriminación de la Ley 1712 de 2014 impide exigir expresión de causa o motivación; el acceso a la información pública no depende del interés del solicitante.", false], ["B", "procedente solo frente al contrato, porque el acceso a la información contractual exige un interés directo.", "La información contractual es pública y de publicación obligatoria (art. 10 de la Ley 1712 de 2014); no se exige interés directo para acceder a ella.", false], ["C", "improcedente, porque no puede exigirse al solicitante que exprese la causa o motivación de su solicitud.", "El artículo 3 de la Ley 1712 de 2014 (principio de no discriminación) obliga a entregar información a todas las personas sin exigir expresión de causa o motivación.", true]]}, {"id": "AU-138", "niv": 3, "e": "Frente a la solicitud de la historia clínica del vecino, la ESE debe", "f": "Ley 1755 de 2015, art. 1 (arts. 24, num. 3 y parágrafo, y 25 de la Ley 1437 de 2011); Ley 1712 de 2014, art. 18", "o": [["A", "remitir la solicitud al vecino para que decida, dentro de los diez días siguientes, si autoriza su entrega.", "La ley no prevé ese traslado al titular: la entidad debe resolver la solicitud y, como el solicitante no está autorizado, negarla motivadamente.", false], ["B", "negarla de forma motivada, porque el solicitante no está autorizado para pedir esa información del vecino.", "La historia clínica está protegida por la intimidad (art. 24, num. 3, del CPACA y art. 18 de la Ley 1712 de 2014), y el parágrafo del artículo 24 limita su solicitud al titular, sus apoderados o personas autorizadas con facultad expresa. El rechazo debe ser motivado.", true], ["C", "entregarla, porque toda información que reposa en una entidad pública es pública sin excepción.", "La información en poder de los sujetos obligados se presume pública, pero admite excepciones legales, como la protección de la intimidad de las personas.", false]]}, {"id": "AU-139", "niv": 2, "e": "Respecto del informe de auditoría con el anexo de diagnósticos, la ESE debe", "f": "Ley 1712 de 2014, art. 21", "o": [["A", "entregar una versión pública que mantenga la reserva solo de la parte indispensable.", "El artículo 21 de la Ley 1712 de 2014 dispone que, cuando no toda la información de un documento está protegida, debe hacerse una versión pública que mantenga la reserva únicamente de la parte indispensable.", true], ["B", "entregar el informe completo, porque el interés público en la auditoría prevalece sobre la intimidad de los pacientes.", "Los diagnósticos de pacientes identificados están protegidos; la ley no autoriza su divulgación por el interés en la auditoría, sino una versión pública.", false], ["C", "negar todo el informe, porque contiene datos sensibles de pacientes.", "La reserva parcial no se extiende a todo el documento: el artículo 21 de la Ley 1712 de 2014 ordena entregar la parte no protegida.", false]]}]}, {"comp": "atencion_usuario", "rol": "profesional", "tag": "Atención al usuario · Niveles profesional, asesor y ejecutivo · Reserva de la información y recurso de insistencia", "texto": "Usted es profesional universitario de la oficina jurídica de la alcaldía de un municipio. Un ciudadano solicitó copia completa del expediente disciplinario que adelanta la Oficina de Control Disciplinario Interno contra un secretario de despacho. El proceso está en etapa de investigación y aún no se ha formulado pliego de cargos. El alcalde le pide proyectar la respuesta y le pregunta qué puede hacer el ciudadano si no está de acuerdo con la negativa.", "items": [{"id": "AU-143", "niv": 3, "e": "La negativa a entregar el expediente puede fundarse en que", "f": "Ley 1952 de 2019, art. 115; Ley 1712 de 2014, art. 19, literal d)", "o": [["A", "la actuación disciplinaria es reservada hasta que se formule pliego de cargos o se ordene el archivo definitivo.", "El artículo 115 de la Ley 1952 de 2019 dispone que las actuaciones disciplinarias son reservadas hasta que se cite a audiencia y se formule pliego de cargos o se emita la providencia que ordene el archivo definitivo; en concordancia, el literal d) del artículo 19 de la Ley 1712 de 2014 exceptúa esa información mientras no se formule pliego de cargos.", true], ["B", "toda actuación disciplinaria es reservada de forma permanente para proteger el buen nombre del investigado.", "La reserva no es permanente: el artículo 115 de la Ley 1952 de 2019 la limita hasta la formulación del pliego de cargos o el archivo definitivo.", false], ["C", "el solicitante no es sujeto procesal ni acreditó un interés directo en el resultado del proceso.", "El acceso a la información pública no depende del interés del solicitante; la negativa debe fundarse en una excepción legal.", false]]}, {"id": "AU-144", "niv": 2, "e": "El acto que niegue la solicitud por reserva debe", "f": "Ley 1755 de 2015, art. 1 (art. 25 de la Ley 1437 de 2011)", "o": [["A", "estar motivado e informar que contra él proceden los recursos de reposición y apelación.", "Contra la decisión que rechaza la petición por reserva legal no procede recurso alguno, salvo la insistencia del artículo 26 del CPACA.", false], ["B", "explicar sus razones, citar las normas que impiden la entrega y notificarse al ciudadano.", "El artículo 25 del CPACA dispone que la decisión que rechace la petición de informaciones o documentos será motivada, indicará en forma precisa las disposiciones legales que impiden la entrega y se notificará al peticionario.", true], ["C", "comunicarse por correo electrónico sin motivación, porque la reserva opera por mandato legal.", "El artículo 25 del CPACA exige que toda decisión que rechace la petición de información sea motivada y se notifique.", false]]}, {"id": "AU-145", "niv": 3, "e": "Si el ciudadano insiste en su solicitud, la decisión de negarla o aceptarla corresponde a", "f": "Ley 1755 de 2015, art. 1 (art. 26 de la Ley 1437 de 2011)", "o": [["A", "el tribunal administrativo con jurisdicción en el lugar de los documentos, en única instancia.", "El tribunal administrativo decide la insistencia frente a autoridades nacionales, departamentales o del Distrito Capital; la alcaldía es una autoridad municipal.", false], ["B", "la procuraduría provincial, en ejercicio del poder preferente sobre la oficina de control disciplinario.", "El poder preferente se refiere a asumir procesos disciplinarios; la decisión sobre la insistencia en materia de reserva es judicial.", false], ["C", "el juez administrativo, en única instancia, por tratarse de una autoridad municipal.", "El artículo 26 del CPACA asigna la insistencia al juez administrativo cuando se trata de autoridades distritales y municipales, que decide en única instancia.", true]]}]}, {"comp": "atencion_usuario", "rol": "general", "tag": "Atención al usuario · Datos públicos y circulación restringida", "texto": "La Oficina de Atención al Ciudadano de una procuraduría regional recibe dos solicitudes sobre un profesional universitario de la entidad: un periodista pregunta si esa persona es servidor de la Procuraduría y qué cargo ocupa; un particular pide su dirección de residencia y su número de celular personal porque quiere «hablar con él directamente». Además, un coordinador propone publicar en la página web de la entidad el listado de las personas que presentaron quejas el último mes, con su nombre, su número de cédula y el asunto de cada queja, para demostrar transparencia.", "items": [{"id": "AU-155", "niv": 2, "e": "La información que pide el periodista", "f": "Decreto 1074 de 2015, art. 2.2.2.25.1.3, num. 2 (Decreto 1377 de 2013, art. 3); Ley 1712 de 2014, art. 9, literal c)", "o": [["A", "es un dato público, porque ser servidor público no es información privada.", "El reglamento de la Ley 1581 de 2012 (art. 2.2.2.25.1.3 del Decreto 1074 de 2015) considera datos públicos, entre otros, los relativos a la profesión u oficio y a la calidad de servidor público.", true], ["B", "es un dato privado que solo puede suministrarse con autorización del servidor.", "La calidad de servidor público es un dato público según la reglamentación de la Ley 1581 de 2012; no requiere autorización del titular.", false], ["C", "es información reservada, porque revela la estructura de personal de la entidad.", "La estructura y el directorio de servidores son información que los sujetos obligados deben publicar (art. 9 de la Ley 1712 de 2014); no están sometidos a reserva.", false]]}, {"id": "AU-156", "niv": 3, "e": "Frente a la solicitud del particular sobre la dirección y el celular personal del servidor, la entidad debe", "f": "Ley 1712 de 2014, arts. 6, literal c), 9, literal c), y 18, literal a)", "o": [["A", "entregarlos, porque los datos de contacto de los servidores públicos hacen parte de la información mínima que se publica.", "La información mínima que se publica corresponde al directorio institucional; la dirección de residencia y el celular personal pertenecen al ámbito privado del servidor.", false], ["B", "entregarlos solo si el particular explica para qué los necesita y firma un compromiso de confidencialidad.", "El motivo del solicitante no convierte en accesible un dato privado del servidor; la entidad debe negar la solicitud de forma motivada.", false], ["C", "negarlos de manera motivada y por escrito, porque son datos del ámbito privado del servidor.", "Es información pública clasificada (art. 6, literal c, de la Ley 1712 de 2014), cuyo acceso puede negarse de manera motivada y por escrito cuando puede dañar el derecho a la intimidad (art. 18, literal a).", true]]}, {"id": "AU-157", "niv": 1, "e": "La propuesta del coordinador sobre el listado de quejosos", "f": "Ley 1581 de 2012, art. 4, literal f)", "o": [["A", "es válida si el listado se publica solo durante el mes siguiente a la presentación de las quejas.", "Limitar el tiempo de publicación no corrige la divulgación masiva e indebida de datos personales que no son públicos.", false], ["B", "desconoce la protección de datos, porque pone en internet datos personales no públicos sin acceso controlado.", "El principio de acceso y circulación restringida (art. 4, literal f, de la Ley 1581 de 2012) prohíbe poner datos personales no públicos en internet u otros medios masivos, salvo que el acceso sea técnicamente controlable.", true], ["C", "es válida, porque la publicación proactiva de información es un deber de los sujetos obligados y fortalece la transparencia.", "La divulgación proactiva se refiere a la información pública sobre la actividad estatal; no autoriza a publicar datos personales de los ciudadanos que presentan quejas.", false]]}]}, {"comp": "atencion_usuario", "rol": "general", "tag": "Atención al usuario · Política de Servicio al Ciudadano y canales de atención", "texto": "La secretaria general de una empresa social del Estado del orden departamental lidera la implementación del Modelo Integrado de Planeación y Gestión (MIPG). En el diagnóstico encuentra que cada dependencia recibe por su cuenta las peticiones verbales que llegan a su oficina, que las llamadas telefónicas con peticiones se atienden en las extensiones de cada área sin dejar constancia, y que no existe ningún canal para recibir peticiones verbales por fuera del horario de atención.", "items": [{"id": "AU-170", "niv": 1, "e": "Dentro del MIPG, el servicio al ciudadano es", "f": "Decreto 1499 de 2017 (art. 2.2.22.2.1 del Decreto 1083 de 2015)", "o": [["A", "una de las políticas de gestión y desempeño institucional previstas en el Decreto 1499 de 2017.", "El artículo 2.2.22.2.1 del Decreto 1083 de 2015, en la redacción dada por el Decreto 1499 de 2017, incluye el servicio al ciudadano entre las políticas de gestión y desempeño institucional.", true], ["B", "un componente del sistema de control interno cuya evaluación corresponde en forma exclusiva a la oficina de control interno.", "El servicio al ciudadano es una política de gestión y desempeño; la oficina de control interno evalúa, pero la política la implementa toda la entidad.", false], ["C", "una dimensión autónoma del modelo que reemplaza al proceso de gestión documental.", "El servicio al ciudadano no reemplaza la gestión documental, que es otra política distinta del mismo listado.", false]]}, {"id": "AU-171", "niv": 1, "e": "Frente a las peticiones verbales presenciales, la empresa debe", "f": "Decreto 1069 de 2015, art. 2.2.3.12.2 (adicionado por el Decreto 1166 de 2016)", "o": [["A", "suprimir la recepción verbal y exigir un formulario escrito, para garantizar la constancia de radicación.", "Las peticiones pueden presentarse verbalmente (art. 15 del CPACA) y no puede negarse su recepción con la excusa de exigir un escrito, salvo que la petición lo requiera.", false], ["B", "concentrar su recepción en una única dependencia, atendida por personal que conozca las funciones de la entidad.", "El artículo 2.2.3.12.2 del Decreto 1069 de 2015 obliga a centralizar en una sola oficina o dependencia la recepción de las peticiones verbales, con funcionarios suficientes y con conocimiento idóneo de las competencias de la entidad.", true], ["C", "mantener la recepción en cada dependencia, porque así la petición llega directamente a quien debe resolverla.", "El Decreto 1069 de 2015 ordena lo contrario: centralizar en una sola oficina o dependencia la recepción de las peticiones verbales.", false]]}, {"id": "AU-172", "niv": 2, "e": "Respecto de las peticiones telefónicas y de las que se formulen fuera del horario, la empresa debe", "f": "Decreto 1069 de 2015, art. 2.2.3.12.2 (adicionado por el Decreto 1166 de 2016)", "o": [["A", "atender las telefónicas en cada extensión y recibir las de fuera del horario solo por correo físico.", "La norma exige centralizar las peticiones telefónicas en la línea de atención y habilitar medios tecnológicos o electrónicos aun fuera del horario.", false], ["B", "recibir las telefónicas solo como orientación, sin radicarlas ni dejar constancia, y no habilitar ningún canal por fuera del horario de atención al público.", "Las peticiones telefónicas son peticiones verbales que deben constar y radicarse; la excepción es solo la simple orientación sobre dónde acudir.", false], ["C", "centralizar las telefónicas en su línea de atención y habilitar medios electrónicos para recibir peticiones verbales aun fuera del horario.", "El artículo 2.2.3.12.2 del Decreto 1069 de 2015 ordena centralizar en la línea de atención la recepción y constancia de radicación de las peticiones telefónicas y habilitar medios tecnológicos o electrónicos para recibir peticiones verbales aun por fuera de las horas de atención.", true]]}]}, {"comp": "gestion_documental", "rol": "general", "tag": "Gestión documental · Principios de procedencia y orden original", "texto": "Usted es asistente de la Procuraduría Regional de un departamento. Al recibir el archivo de gestión del despacho, encuentra que un antiguo servidor reunió en una sola carpeta temática, llamada «Contratación», documentos producidos por la Oficina Jurídica, por el grupo de Vigilancia Preventiva y por la secretaría. Además, dentro de cada expediente ordenó los documentos alfabéticamente por el apellido del remitente. El procurador regional le pide reorganizar el archivo conforme a la normativa del Archivo General de la Nación.", "items": [{"id": "GD-113", "niv": 2, "e": "Al separar los documentos de la carpeta temática «Contratación», usted aplica el principio de procedencia, que consiste en", "f": "Ley 594 de 2000, art. 11; Acuerdo 001 de 2024 del AGN, art. 4.3.1.2", "o": [["A", "mantener agrupados los documentos según la dependencia que los produjo en ejercicio de sus funciones.", "El artículo 4.3.1.2 del Acuerdo 001 de 2024 del AGN ordena respetar la procedencia para determinar, a partir de la estructura orgánico-funcional, las unidades u oficinas que producen los documentos. La Ley 594 de 2000 (art. 11) lo establece como principio de la organización de archivos.", true], ["B", "conservar los documentos en la dependencia que los recibió por última vez.", "La procedencia se define por la oficina productora en desarrollo de sus funciones, no por quien tuvo los documentos por última vez (art. 4.3.1.2, Acuerdo 001 de 2024).", false], ["C", "agrupar los documentos según el asunto que tratan, sin importar qué dependencia los produjo.", "Agrupar por tema es justamente lo que desconoce la procedencia. Este principio atiende a la oficina productora según la estructura orgánico-funcional (art. 4.3.1.2, Acuerdo 001 de 2024 del AGN).", false]]}, {"id": "GD-114", "niv": 2, "e": "Para corregir la ordenación alfabética de los documentos dentro de cada expediente, usted debe", "f": "Acuerdo 001 de 2024 del AGN, arts. 4.3.1.3 y 4.3.1.8, num. 2; AGN, instructivo Foliación en archivos, requisitos, num. 2", "o": [["A", "ordenar los documentos según el tipo documental, primero los oficios y luego los autos.", "Agrupar por tipo documental rompe la secuencia en que se tramitó el asunto; el orden original exige reflejar el desarrollo del trámite (art. 4.3.1.8, num. 2, Acuerdo 001 de 2024).", false], ["B", "ordenar los documentos según la secuencia en que se produjeron durante el trámite, desde el que lo inició.", "El principio de orden original (art. 4.3.1.3, Acuerdo 001 de 2024 del AGN) exige respetar la secuencia en que los documentos se gestionaron y tramitaron hasta su resolución; el numeral 2 del artículo 4.3.1.8 ordena que los tipos documentales evidencien el desarrollo del trámite.", true], ["C", "ubicar primero el documento más reciente, para que la última actuación quede a la vista.", "El orden original sigue la secuencia del trámite; según el instructivo de foliación del AGN, el folio 1 corresponde al documento que dio inicio al trámite, que es el de fecha más antigua.", false]]}, {"id": "GD-115", "niv": 1, "e": "El proceso de organización documental que usted adelanta comprende las operaciones técnicas de", "f": "Acuerdo 001 de 2024 del AGN, art. 4.3.1.1; Decreto 1080 de 2015, art. 2.8.2.5.9, lit. d", "o": [["A", "valoración, selección y eliminación.", "Son actividades de los procesos de valoración y disposición final (arts. 4.5.1 a 4.5.4 y Título 5 del Acuerdo 001 de 2024), no de la organización.", false], ["B", "recepción, radicación y distribución.", "Esas actividades corresponden a la ventanilla única y al proceso de gestión y trámite (arts. 4.2.1 y 4.2.2 del Acuerdo 001 de 2024), no a la organización.", false], ["C", "clasificación, ordenación y descripción.", "El artículo 4.3.1.1 del Acuerdo 001 de 2024 del AGN señala que la organización documental se realiza a partir de los procesos técnicos de clasificación, ordenación y descripción, respetando procedencia, orden original y ciclo vital.", true]]}]}, {"comp": "gestion_documental", "rol": "general", "tag": "Gestión documental · Documentos de apoyo, depuración y principios de la gestión documental", "texto": "Una auxiliar administrativa de la secretaría de una procuraduría provincial organiza el archivo de gestión. En los estantes encuentra carpetas con fotocopias de leyes y decretos, circulares enviadas por otras entidades «para conocimiento» y revistas jurídicas que los abogados guardan solo como material de consulta. En los expedientes de las actuaciones hay hojas en blanco y algunas fotocopias idénticas de documentos que ya están en original. Antes de foliar, un compañero le recomienda imprimir todos los correos electrónicos recibidos durante el año, «para que el archivo quede completo en papel», aunque ninguna norma ni la TRD exige conservarlos impresos.", "items": [{"id": "GD-135", "niv": 1, "e": "Las fotocopias de normas, las circulares recibidas para conocimiento y las revistas que se guardan como material de consulta son", "f": "Ley 594 de 2000, art. 3; Acuerdo 001 de 2024 del AGN, art. 4.5.4, par. 2", "o": [["A", "documentos de apoyo, que no se consignan en la TRD.", "El art. 4.5.4, par. 2, del Acuerdo 001 de 2024 del AGN señala que los documentos de apoyo no se consignan en la TRD de las dependencias y pueden eliminarse cuando pierdan su utilidad, dejando constancia en acta o documento equivalente.", true], ["B", "documentos de archivo de conservación total, por su valor jurídico.", "No son documentos producidos o recibidos en ejercicio de las funciones de la secretaría (art. 3 de la Ley 594 de 2000), sino material de consulta; por eso no tienen disposición final en la TRD.", false], ["C", "una serie documental propia de la secretaría, que debe incluirse en la tabla de retención.", "Los documentos de apoyo no se consignan en la TRD (art. 4.5.4, par. 2, del Acuerdo 001 de 2024 del AGN); no conforman series documentales de la dependencia.", false]]}, {"id": "GD-136", "niv": 2, "e": "Antes de foliar los expedientes de las actuaciones, la auxiliar debe", "f": "AGN, instructivo «Foliación en archivos» (2021); Acuerdo 001 de 2024 del AGN, art. 4.5.4, num. 9", "o": [["A", "foliar todas las hojas, incluidas las que están en blanco y las fotocopias idénticas, y depurar después de la transferencia.", "Según el instructivo de foliación del AGN, la depuración es un requisito previo a la foliación; foliar primero obligaría a refoliar después de retirar hojas.", false], ["B", "depurar los expedientes, retirando las hojas en blanco, las fotocopias idénticas y los documentos de apoyo.", "El instructivo «Foliación en archivos» del AGN establece como requisito previo a la foliación la depuración: retirar duplicados idénticos, folios en blanco y documentos de apoyo; el Acuerdo 001 de 2024 permite retirar copias idénticas (art. 4.5.4, num. 9).", true], ["C", "foliar solo las hojas que tengan firma, porque las demás no son documentos de archivo.", "La foliación es consecutiva sobre todos los documentos que conforman el expediente una vez depurado (instructivo de foliación del AGN); la firma no es el criterio para foliar.", false]]}, {"id": "GD-137", "niv": 2, "e": "La recomendación de imprimir todos los correos aunque ninguna norma lo exija va en contra del principio de la gestión documental denominado", "f": "Decreto 1080 de 2015, art. 2.8.2.5.5", "o": [["A", "neutralidad tecnológica.", "La neutralidad tecnológica se refiere a la libre adopción de tecnologías por parte del Estado (art. 2.8.2.5.5 del Decreto 1080 de 2015); no trata de evitar impresiones innecesarias.", false], ["B", "disponibilidad.", "El principio de disponibilidad pide que los documentos estén disponibles cuando se requieran, independientemente del medio de creación (art. 2.8.2.5.5 del Decreto 1080 de 2015); no es el que desaconseja imprimir sin necesidad.", false], ["C", "protección del medio ambiente.", "El art. 2.8.2.5.5 del Decreto 1080 de 2015 incluye el principio de protección del medio ambiente, según el cual las entidades deben evitar producir documentos impresos en papel cuando no se requiera por razones legales o de preservación histórica.", true]]}]}, {"comp": "gestion_documental", "rol": "profesional", "tag": "Gestión documental · Niveles profesional, asesor y ejecutivo · SGDEA y actualización y convalidación de la TRD", "texto": "Usted es profesional del grupo de gestión documental de la Procuraduría, entidad del orden nacional. La secretaría general planea adquirir un nuevo Sistema de Gestión de Documentos Electrónicos de Archivo (SGDEA) y le pide indicar qué debe elaborarse antes. Además, mediante resolución se creó un nuevo grupo interno de trabajo en la secretaría general; el grupo producirá documentos de series que ya existen en la TRD, sin crear series ni subseries nuevas y sin cambiar los criterios de valoración. Por último, le preguntan qué instancia externa convalida las TRD de la entidad.", "items": [{"id": "GD-147", "niv": 2, "e": "Antes de implementar el nuevo SGDEA, la entidad debe", "f": "Acuerdo 001 de 2024 del AGN, arts. 4.3.2.1, 4.3.2.5 y 5.1.2.1", "o": [["A", "eliminar los expedientes físicos que se van a migrar, para evitar que existan duplicados en papel cuando el sistema entre en funcionamiento.", "No pueden eliminarse documentos originales con el argumento de que han sido digitalizados (art. 4.3.2.5, par., del Acuerdo 001 de 2024 del AGN); la eliminación solo procede según la TRD o la TVD.", false], ["B", "obtener la convalidación del sistema por el Consejo Departamental de Archivos.", "Los consejos territoriales convalidan TRD y TVD de entidades territoriales (art. 5.1.2.1, par., del Acuerdo 001 de 2024 del AGN); no convalidan sistemas de información. El requisito previo al SGDEA es el Modelo de Requisitos (art. 4.3.2.1, par. 3).", false], ["C", "elaborar el Modelo de Requisitos de Documentos Electrónicos de Archivo, según los lineamientos del AGN.", "El art. 4.3.2.1, par. 3, del Acuerdo 001 de 2024 del AGN dispone que, para implementar el SGDEA, las entidades deben elaborar previamente el Modelo de Requisitos de Documentos Electrónicos de Archivo, atendiendo los lineamientos del AGN.", true]]}, {"id": "GD-148", "niv": 3, "e": "Por la creación del nuevo grupo interno de trabajo, en relación con la TRD corresponde", "f": "Acuerdo 001 de 2024 del AGN, arts. 5.1.4.1, 5.1.4.2 y 5.1.4.4", "o": [["A", "no actualizarla, porque la creación de grupos internos de trabajo no es causal de actualización.", "La creación o supresión de grupos internos de trabajo es una de las causales de actualización de la TRD (art. 5.1.4.1, num. 2, del Acuerdo 001 de 2024 del AGN).", false], ["B", "actualizarla dentro de los seis meses siguientes y, como no requiere convalidación, remitirla a la instancia competente dentro de los treinta días hábiles siguientes a su aprobación.", "La creación de grupos internos obliga a actualizar la TRD (art. 5.1.4.1, num. 2) dentro de los seis meses siguientes (art. 5.1.4.2); como no está entre las causales que exigen convalidación, se remite dentro de los treinta días hábiles siguientes a su aprobación (art. 5.1.4.4, par. 2, del Acuerdo 001 de 2024 del AGN).", true], ["C", "actualizarla dentro de los dos años siguientes a la resolución y someterla a evaluación técnica y convalidación ante la instancia competente, como si se tratara de una tabla de retención elaborada por primera vez.", "El término para actualizar es de seis meses (art. 5.1.4.2 del Acuerdo 001 de 2024 del AGN), y la convalidación solo se exige para las causales del art. 5.1.4.4, entre las que no está la creación de grupos internos sin series nuevas.", false]]}, {"id": "GD-149", "niv": 2, "e": "Por tratarse de una entidad del orden nacional, la evaluación técnica y convalidación de las TRD de la Procuraduría corresponde a", "f": "Acuerdo 001 de 2024 del AGN, art. 5.1.2.1", "o": [["A", "el Comité Evaluador de Documentos del Archivo General de la Nación.", "El art. 5.1.2.1, par., num. 1, del Acuerdo 001 de 2024 del AGN asigna al Comité Evaluador de Documentos del AGN la evaluación técnica y convalidación de las TRD y TVD de las entidades del orden nacional.", true], ["B", "el Comité Institucional de Gestión y Desempeño de la propia entidad.", "El comité institucional aprueba las TRD, per
