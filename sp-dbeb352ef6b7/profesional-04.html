o la evaluación técnica y convalidación las hace la instancia externa competente (art. 5.1.2.1 del Acuerdo 001 de 2024 del AGN).", false], ["C", "el consejo departamental de archivos del lugar donde funciona cada procuraduría provincial.", "Los consejos territoriales de archivos convalidan las TRD de las entidades del orden territorial de su jurisdicción (art. 5.1.2.1, par., num. 2, del Acuerdo 001 de 2024 del AGN), no las de una entidad nacional.", false]]}]}, {"comp": "documentos_oficina", "rol": "general", "tag": "Elaboración de documentos de oficina · Partes de la carta u oficio", "texto": "Usted es auxiliar administrativo de una procuraduría provincial y revisa el borrador de un oficio dirigido al alcalde del municipio donde funciona la sede. El borrador tiene estos problemas: debajo del nombre y el cargo del destinatario dice «La ciudad»; en el saludo aparece «Respetado señor alcalde» sin un signo de puntuación claro; y al final, el bloque del remitente muestra primero el cargo en mayúscula sostenida, luego el nombre de la procuradora con mayúscula inicial y la firma debajo de ambos. La entidad elabora sus comunicaciones con base en los lineamientos de la guía técnica colombiana sobre documentos (GTC 185) y en las normas de la Real Academia Española.", "items": [{"id": "DO-101", "niv": 1, "e": "Después del saludo «Respetado señor alcalde» debe escribirse", "f": "RAE, Ortografía básica, uso de los dos puntos en cartas y documentos (ver notas-do.md)", "o": [["A", "una coma, así: «Respetado señor alcalde,».", "La Real Academia Española señala que en español, tras el saludo de cartas y documentos, se escriben dos puntos; el uso de la coma en esa posición es un anglicismo ortográfico.", false], ["B", "punto y coma, para separar el saludo del primer párrafo del oficio.", "El punto y coma no se usa tras el saludo de una carta; la norma académica prescribe los dos puntos para esa función.", false], ["C", "dos puntos, y el texto continúa en la línea siguiente.", "Según la ortografía de la Real Academia Española, tras las fórmulas de saludo de cartas y documentos se escriben dos puntos, y lo que sigue se escribe en línea aparte, con mayúscula inicial.", true]]}, {"id": "DO-102", "niv": 2, "e": "Como el destinatario está en la misma ciudad que la procuraduría provincial, en los datos del destinatario se debe", "f": "Guías institucionales que citan la GTC 185: UIS GGD.10, Senado GD-IT01, ADR circular 028 (ver notas-do.md)", "o": [["A", "escribir el nombre de la ciudad, sin usar «La ciudad» ni «Presente».", "Las guías de comunicaciones oficiales de la UIS y del Senado de la República, que siguen la GTC 185, indican escribir el nombre de la ciudad de destino aun cuando sea la misma de origen, y no usar «La ciudad» ni «Presente».", true], ["B", "mantener «La ciudad», porque el destinatario se encuentra en el mismo municipio que la sede que remite el oficio.", "Las guías institucionales basadas en la GTC 185 consultadas indican que se escribe el nombre de la ciudad aunque el destinatario esté en el mismo lugar; no se usa «La ciudad».", false], ["C", "cambiarlo por «Presente», porque el oficio se entregará personalmente.", "Las guías institucionales basadas en la GTC 185 consultadas desaconsejan expresamente el uso de «Presente» en los datos del destinatario.", false]]}, {"id": "DO-103", "niv": 2, "e": "El bloque del remitente debe organizarse con", "f": "Guías institucionales que citan la GTC 185: UIS GGD.10, Senado GD-IT01, Alcaldía de Mitú (ver notas-do.md)", "o": [["A", "solo la firma y el número de cédula de quien suscribe.", "El bloque del remitente identifica a quien firma por su nombre y su cargo; el número de documento de identidad no hace parte de esos datos en las guías consultadas.", false], ["B", "la firma, debajo el nombre en mayúscula sostenida y en la línea siguiente el cargo con mayúscula inicial.", "Las guías institucionales basadas en la GTC 185 (UIS, Senado y Alcaldía de Mitú) indican escribir el nombre del remitente en mayúscula sostenida, el cargo en la línea siguiente con mayúscula inicial y la firma sobre el nombre.", true], ["C", "el cargo en mayúscula sostenida, debajo el nombre con mayúscula inicial y la firma al final.", "El orden recomendado es el inverso: la firma va sobre el nombre, el nombre se escribe en mayúscula sostenida y el cargo, con mayúscula inicial, en la línea siguiente.", false]]}]}, {"comp": "documentos_oficina", "rol": "general", "tag": "Elaboración de documentos de oficina · El acta", "texto": "Usted es auxiliar de la secretaría de una procuraduría provincial y debe elaborar el acta de la reunión ordinaria mensual del equipo de trabajo. En su borrador escribió: «Siendo las 9:00 a. m., se reúnen los integrantes del equipo…» y redactó todo en tiempo presente. Puso como primer punto del orden del día «proposiciones y varios». Durante la reunión, un sustanciador manifestó su desacuerdo con una decisión sobre la distribución de reparto y pidió expresamente que su posición quedara registrada; otros dos integrantes hicieron comentarios generales sin pedir que constaran. La entidad sigue los lineamientos de la GTC 185 para la elaboración de actas.", "items": [{"id": "DO-113", "niv": 1, "e": "En cuanto a la redacción, el acta debe escribirse", "f": "Guías institucionales que citan la GTC 185: UIS GGD.10, Contraloría de Nariño, Gobernación del Cesar (ver notas-do.md)", "o": [["A", "en tiempo presente, para dar sensación de actualidad a lo que se describe.", "Las guías de actas basadas en la GTC 185 indican redactarlas en tiempo pasado, porque registran hechos ya ocurridos en la reunión.", false], ["B", "en futuro, porque recoge principalmente los compromisos que se cumplirán después.", "Aunque el acta registra compromisos, el relato de lo sucedido, tratado y acordado se redacta en tiempo pasado según las guías basadas en la GTC 185.", false], ["C", "en tiempo pasado y sin iniciar párrafos con gerundio.", "Las guías de la UIS, de la Contraloría de Nariño y de la Gobernación del Cesar, basadas en la GTC 185, indican redactar las actas en tiempo pasado y no iniciar ningún párrafo con gerundio (como «Siendo»).", true]]}, {"id": "DO-114", "niv": 2, "e": "Los dos primeros puntos del orden del día deben ser", "f": "Guías institucionales que citan la GTC 185: UIS GGD.10, Contraloría de Nariño, Gobernación del Cesar (ver notas-do.md)", "o": [["A", "la verificación del quórum y, luego, la lectura y aprobación del acta anterior.", "Las guías de actas basadas en la GTC 185 (UIS, Contraloría de Nariño y Gobernación del Cesar) indican que la primera actividad es la verificación del quórum y la segunda, la lectura y aprobación del acta anterior.", true], ["B", "las proposiciones y varios y, luego, la verificación del quórum.", "Las proposiciones y varios suelen ir al final; la reunión empieza verificando el quórum, porque sin él no pueden tomarse decisiones válidas.", false], ["C", "la lectura del acta anterior y, luego, los temas nuevos, sin verificar asistencia porque la reunión es ordinaria.", "El carácter ordinario de la reunión no elimina la verificación del quórum, que según las guías basadas en la GTC 185 es la primera actividad.", false]]}, {"id": "DO-115", "niv": 3, "e": "Sobre las intervenciones de los integrantes, en el acta se debe", "f": "Guías institucionales que citan la GTC 185: UIS GGD.10, Contraloría de Nariño, Gobernación del Cesar (ver notas-do.md)", "o": [["A", "omitir el desacuerdo del sustanciador, porque el acta solo recoge las decisiones aprobadas.", "Aunque el acta hace énfasis en las decisiones, la discrepancia se registra cuando el integrante lo solicita expresamente, según las guías basadas en la GTC 185.", false], ["B", "registrar la discrepancia del sustanciador, porque la solicitó expresamente, y hacer énfasis en las decisiones.", "Las guías de actas de la UIS, de la Contraloría Departamental de Nariño y de la Gobernación del Cesar, elaboradas con base en la GTC 185, indican hacer énfasis en las decisiones y dejar constancia de las discrepancias cuando se solicita expresamente, como hizo el sustanciador.", true], ["C", "transcribir textualmente todas las intervenciones, incluidos los comentarios generales, para que el acta sea completa.", "Las guías basadas en la GTC 185 indican que el acta hace énfasis en las decisiones y no es una transcripción literal de lo dicho.", false]]}]}, {"comp": "ofimatica", "rol": "general", "tag": "Herramientas ofimáticas · Referencias relativas, absolutas y mixtas", "texto": "Usted es técnico administrativo de la Oficina de Planeación de la Procuraduría General de la Nación y lleva en Excel el consolidado de gastos de cinco procuradurías provinciales. En B2:B6 están los valores ejecutados; en B7, el total =SUMA(B2:B6), y en E1, el porcentaje de un ajuste que se aplica a todas las filas. En C2 escribió =B2*$E$1 y en D2 =B2/B7, y copió ambas fórmulas hacia abajo hasta la fila 6. Para una tabla auxiliar, además, escribió en C10 la fórmula =$B10*C$9 y la copió a otras celdas.", "items": [{"id": "OF-101", "niv": 1, "e": "Al copiar la fórmula de C2 a la celda C4, la fórmula resultante es", "f": "Microsoft Support, «Cambiar entre referencias relativas, absolutas y mixtas» (Excel)", "o": [["A", "=B4*$E$3.", "Trata $E$1 como si fuera relativa. Con el signo $ delante de la columna y de la fila, la referencia se mantiene en E1 al copiarla.", false], ["B", "=B4*$E$1.", "Al copiar dos filas hacia abajo, la referencia relativa B2 se ajusta a B4, mientras que $E$1, por ser absoluta (columna y fila fijas), no cambia.", true], ["C", "=B2*$E$1.", "B2 es una referencia relativa: al copiar la fórmula dos filas hacia abajo se convierte en B4. Solo permanecen fijas las partes precedidas del signo $.", false]]}, {"id": "OF-102", "niv": 3, "e": "Las celdas D3 a D6 muestran el error #¡DIV/0! porque", "f": "Microsoft Support, «Cambiar entre referencias relativas, absolutas y mixtas» (Excel); «Cómo corregir un error #¡DIV/0!»", "o": [["A", "la referencia B7 era relativa y, al copiarse, pasó a B8, B9 y siguientes, que están vacías.", "Al copiar =B2/B7 hacia abajo, el divisor se desplaza a celdas vacías, y dividir por una celda vacía produce #¡DIV/0!. Fijar el total con referencia absoluta ($B$7) corrige la fórmula.", true], ["B", "la celda B7 tiene formato de moneda, que Excel no acepta como divisor en una división.", "El formato de número solo cambia la apariencia del valor; no impide dividir. #¡DIV/0! aparece cuando el divisor es cero o una celda vacía.", false], ["C", "la referencia B2 del numerador debió ser absoluta para que no cambiara al copiar la fórmula.", "El numerador sí debe cambiar en cada fila (B3, B4…). El error está en el divisor: B7 era relativa y al copiarse apuntó a celdas vacías; debió escribirse $B$7.", false]]}, {"id": "OF-103", "niv": 3, "e": "Si copia la fórmula de C10 a la celda E12, la fórmula resultante es", "f": "Microsoft Support, «Cambiar entre referencias relativas, absolutas y mixtas» (Excel)", "o": [["A", "=$B10*E$9.", "Supone que $B10 queda completamente fija. El signo $ solo fija la columna B; la fila 10 es relativa y avanza a 12.", false], ["B", "=$B12*E$11.", "Supone que la fila de C$9 es relativa. El signo $ delante del 9 fija la fila, de modo que solo cambia la columna (de C a E).", false], ["C", "=$B12*E$9.", "Se copió dos columnas a la derecha y dos filas abajo. En $B10 la columna está fija y la fila es relativa, por lo que queda $B12; en C$9 la columna es relativa y la fila fija, por lo que queda E$9.", true]]}]}, {"comp": "ofimatica", "rol": "profesional", "tag": "Herramientas ofimáticas · Niveles profesional, asesor y ejecutivo · INDICE, COINCIDIR y BUSCARX", "texto": "Usted es profesional universitario de una procuraduría delegada y construye un tablero de seguimiento de expedientes. En la hoja de datos, A2:A40 contiene el número de radicado; C2:C40, el funcionario sustanciador, y E2:E40, el estado del expediente. El radicado D-2027-118 está en la celda A9. En la celda H2 del tablero se escribe el radicado que se quiere consultar.", "items": [{"id": "OF-116", "niv": 2, "e": "La fórmula =COINCIDIR(\"D-2027-118\";A2:A40;0) devuelve", "f": "Microsoft Support, «Función COINCIDIR»; «Corregir un error #N/A en funciones INDICE/COINCIDIR»", "o": [["A", "7.", "COINCIDIR no cuenta desde cero: la primera celda del rango es la posición 1.", false], ["B", "8.", "COINCIDIR devuelve la posición relativa dentro del rango, no el número de fila de la hoja. A9 es la octava celda de A2:A40 (A2 es la 1). El 0 pide coincidencia exacta.", true], ["C", "9.", "Es el número de fila de la hoja. COINCIDIR devuelve la posición dentro del rango, que empieza en A2.", false]]}, {"id": "OF-117", "niv": 2, "e": "La fórmula =INDICE(C2:C40;COINCIDIR(H2;A2:A40;0)) sirve para", "f": "Microsoft Support, «Función INDICE», «Función COINCIDIR»", "o": [["A", "devolver la posición en la que aparece el radicado de H2 dentro de la columna C.", "La posición la calcula COINCIDIR en la columna A; INDICE usa esa posición para devolver el contenido de la columna C, no un número de posición.", false], ["B", "devolver el sustanciador del radicado más parecido al de H2 cuando no hay uno idéntico.", "Con tipo de coincidencia 0, COINCIDIR solo acepta coincidencias exactas; si el radicado no existe, la fórmula devuelve #N/D.", false], ["C", "devolver el sustanciador del radicado escrito en H2, con coincidencia exacta.", "COINCIDIR halla la posición de H2 en A2:A40 (el 0 exige coincidencia exacta) e INDICE devuelve el valor que ocupa esa posición en C2:C40, es decir, el sustanciador.", true]]}, {"id": "OF-118", "niv": 3, "e": "Si el radicado de H2 no existe en la base, la fórmula =BUSCARX(H2;A2:A40;E2:E40;\"No registrado\") devuelve", "f": "Microsoft Support, «Función BUSCARX»", "o": [["A", "el texto «No registrado».", "El cuarto argumento de BUSCARX (si_no_se_encuentra) define lo que se muestra cuando no hay coincidencia válida. Sin ese argumento, la función devolvería #N/D.", true], ["B", "el error #N/D, porque BUSCARX no admite mensajes personalizados cuando falla la búsqueda.", "BUSCARX sí admite un mensaje propio en el argumento si_no_se_encuentra; #N/D solo aparece cuando ese argumento se omite.", false], ["C", "el estado del radicado más cercano, porque BUSCARX hace coincidencias aproximadas por defecto.", "BUSCARX realiza coincidencia exacta de forma predeterminada; la aproximada debe pedirse expresamente con el argumento modo_de_coincidencia.", false]]}]}, {"comp": "ofimatica", "rol": "general", "tag": "Herramientas ofimáticas · Funciones de fecha: DIA.LAB, DIAS.LAB y HOY", "texto": "Usted es técnico de la Oficina de Atención al Ciudadano de la Procuraduría y lleva en Excel el control de términos de las peticiones. La celda B2 contiene la fecha de radicación de una petición, miércoles 10/03/2027. En H2:H4 están registrados como festivos el 22, el 25 y el 26 de marzo de 2027; no hay otros festivos en marzo ni a comienzos de abril. La oficina no atiende sábados ni domingos.", "items": [{"id": "OF-119", "niv": 3, "e": "La fórmula =DIA.LAB(B2;10;H2:H4) devuelve la fecha", "f": "Microsoft Support, «Función DIA.LAB»; cálculo verificado", "o": [["A", "24/03/2027.", "Es el resultado de =DIA.LAB(B2;10), sin el argumento de festivos. Con H2:H4 se excluyen el 22, el 25 y el 26 de marzo.", false], ["B", "29/03/2027.", "DIA.LAB cuenta días laborables posteriores a la fecha inicial y excluye fines de semana y festivos: 11 y 12 (2), 15 a 19 (7), 23 y 24 (9) y lunes 29 de marzo (10).", true], ["C", "01/04/2027.", "Resulta de sumar a mano tres días hábiles más al resultado correcto. La función ya descuenta los festivos indicados en H2:H4; no hay que agregarlos.", false]]}, {"id": "OF-120", "niv": 3, "e": "La fórmula =DIAS.LAB(FECHA(2027;3;1);FECHA(2027;3;31);H2:H4) devuelve", "f": "Microsoft Support, «Función DIAS.LAB»; cálculo verificado", "o": [["A", "20.", "DIAS.LAB cuenta los días laborables entre ambas fechas, incluidas, sin fines de semana ni festivos: marzo de 2027 tiene 23 días de lunes a viernes, menos los 3 festivos de H2:H4.", true], ["B", "23.", "Es el número de días de lunes a viernes de marzo de 2027 sin descontar los festivos del argumento vacaciones (H2:H4).", false], ["C", "31.", "Es el número de días calendario del mes. DIAS.LAB excluye sábados, domingos y los festivos indicados.", false]]}, {"id": "OF-121", "niv": 1, "e": "Un compañero propone llenar la columna de fechas de radicación con la fórmula =HOY(). La propuesta es inadecuada porque", "f": "Microsoft Support, «Función HOY»", "o": [["A", "la función HOY devuelve la fecha y la hora, lo que impide calcular términos en días completos.", "Es falsa: la que devuelve fecha y hora es AHORA. HOY devuelve solo la fecha; el problema es que no permanece fija.", false], ["B", "la función HOY devuelve un texto que las funciones DIA.LAB y DIAS.LAB no aceptan como fecha.", "HOY devuelve un número de serie de fecha, que DIA.LAB y DIAS.LAB aceptan. El inconveniente es que el valor cambia cada día.", false], ["C", "la función HOY se recalcula y la fecha cambiaría cada día que se abra el libro.", "HOY devuelve la fecha actual y se vuelve a calcular al abrir o recalcular el libro; sirve para cálculos respecto del día de hoy, no para registrar una fecha fija como la de radicación.", true]]}]}, {"comp": "ofimatica", "rol": "general", "tag": "Herramientas ofimáticas · Estilos y tabla de contenido en Word", "texto": "Usted es técnico de una dependencia de la Procuraduría y prepara un informe de 60 páginas en Word. A los títulos de los capítulos les dio formato a mano (negrita, 14 puntos) y a los subtítulos les aplicó el estilo Título 2. Al insertar la tabla de contenido automática, solo aparecen los subtítulos. Días después agregó dos capítulos nuevos y la tabla tampoco los muestra.", "items": [{"id": "OF-134", "niv": 1, "e": "Los títulos de los capítulos no aparecen en la tabla de contenido porque", "f": "Microsoft Support, «Insertar una tabla de contenido»", "o": [["A", "el programa excluye de la tabla los títulos escritos con más de 12 puntos.", "El tamaño de letra no determina la inclusión en la tabla; lo determina el estilo de título aplicado.", false], ["B", "esos títulos tienen solo formato directo y no un estilo de título.", "Microsoft explica que la tabla de contenido se basa en los títulos del documento y que las entradas faltan cuando no tienen estilo de título; basta aplicarles Título 1 y actualizar.", true], ["C", "la tabla de contenido automática admite un solo nivel de títulos por documento.", "La tabla automática admite varios niveles (Título 1, Título 2…); el problema es que los capítulos no tienen estilo de título.", false]]}, {"id": "OF-135", "niv": 1, "e": "Una vez aplicado el estilo correcto, para que la tabla muestre los capítulos nuevos se debe", "f": "Microsoft Support, «Insertar una tabla de contenido» y «Actualizar una tabla de contenido»", "o": [["A", "escribir a mano las entradas nuevas dentro de la tabla.", "Las entradas escritas a mano se perderían al actualizar el campo y no quedarían vinculadas a los títulos ni a sus páginas.", false], ["B", "insertar un salto de sección antes de cada capítulo para que la tabla los detecte.", "Los saltos de sección sirven para cambiar formato de página o encabezados; no influyen en la tabla de contenido.", false], ["C", "actualizar la tabla de contenido (Actualizar campo).", "La tabla de contenido es un campo que no se actualiza solo; tras cambios en el documento se usa Actualizar campo o Actualizar tabla.", true]]}, {"id": "OF-136", "niv": 2, "e": "Si se decide que todos los títulos de capítulo vayan en otra fuente y tamaño, la forma más eficiente es", "f": "Microsoft Support, «Personalizar o crear estilos» (Word)", "o": [["A", "modificar el estilo Título 1, con lo cual cambian todos los párrafos que lo tienen aplicado.", "Al modificar un estilo, Word actualiza de una vez todos los párrafos que lo usan, lo que garantiza uniformidad y mantiene la tabla de contenido.", true], ["B", "cambiar el formato de cada título con Copiar formato, ya que los estilos predefinidos no se modifican.", "Los estilos predefinidos sí pueden modificarse; cambiar título por título es más lento y propenso a inconsistencias.", false], ["C", "cambiar la fuente de la tabla de contenido, que transmite el formato a los títulos.", "El formato de la tabla de contenido no se traslada a los títulos del documento; son estilos distintos.", false]]}]}, {"comp": "sistemas_gestion", "rol": "general", "tag": "Sistemas de gestión (MIPG, control interno y calidad) · MIPG: definición, objetivos y ámbito", "texto": "Usted es profesional de la Oficina de Planeación de la Procuraduría General de la Nación y prepara una charla de inducción sobre el Modelo Integrado de Planeación y Gestión (MIPG) para servidores recién posesionados. Un asistente afirma que el MIPG «solo existe para los ministerios y las alcaldías» y que, por tanto, nada tiene que ver con un organismo de control. Otro pregunta qué es exactamente el modelo y qué objetivos persigue.", "items": [{"id": "SG-101", "niv": 3, "e": "Según el Decreto 1083 de 2015, modificado por el Decreto 1499 de 2017, frente a un organismo de control lo correcto es afirmar que", "f": "Decreto 1083 de 2015, art. 2.2.22.3.4 (Decreto 1499 de 2017, art. 1); Ley 87 de 1993, art. 5", "o": [["A", "debe aplicar la política de control interno y adoptar las otras políticas del modelo solo en lo que le resulte aplicable.", "El artículo 2.2.22.3.4 dispone que el MIPG se adopta por la rama ejecutiva y que los organismos de control, entre otros, aplican la política de control interno de la Ley 87 de 1993 y las demás políticas de gestión y desempeño en la medida en que les sean aplicables según sus normas.", true], ["B", "debe adoptar el modelo en su integridad, en las mismas condiciones que las entidades de la rama ejecutiva del orden nacional.", "La adopción integral se prevé para la rama ejecutiva; para los organismos de control el decreto establece una aplicación de las políticas en la medida en que les sean aplicables.", false], ["C", "está excluido del modelo y de la Ley 87 de 1993, porque es él quien ejerce control sobre las demás entidades.", "La Ley 87 de 1993 (art. 5) incluye expresamente a los organismos de control, y el decreto les ordena aplicar la política de control interno.", false]]}, {"id": "SG-102", "niv": 1, "e": "El decreto define el MIPG como", "f": "Decreto 1083 de 2015, art. 2.2.22.3.2", "o": [["A", "una certificación de calidad que reemplaza a la norma ISO 9001 en las entidades públicas.", "El MIPG no es una certificación; el Sistema de Gestión que lo opera integró los antiguos sistemas de desarrollo administrativo y de gestión de la calidad de las leyes 489 de 1998 y 872 de 2003.", false], ["B", "un marco de referencia para dirigir, planear, ejecutar, hacer seguimiento, evaluar y controlar la gestión de las entidades.", "Es la definición del artículo 2.2.22.3.2, que agrega que su fin es generar resultados que atiendan los planes de desarrollo y resuelvan las necesidades de los ciudadanos, con integridad y calidad.", true], ["C", "un sistema de evaluación externa con el que la Función Pública califica y sanciona a las entidades que incumplen sus metas.", "La Función Pública mide el desempeño (por ejemplo, con el FURAG), pero el MIPG no es un régimen sancionatorio sino un marco de gestión de cada entidad.", false]]}, {"id": "SG-103", "niv": 1, "e": "Entre los objetivos que el decreto asigna al MIPG se encuentra", "f": "Decreto 1083 de 2015, art. 2.2.22.3.3", "o": [["A", "centralizar en la Función Pública la aprobación de los planes de acción anuales de cada una de las entidades.", "Ninguno de los objetivos del artículo 2.2.22.3.3 traslada a la Función Pública la aprobación de los planes de las entidades.", false], ["B", "sustituir el control fiscal que ejercen las contralorías sobre las entidades públicas.", "El MIPG no sustituye el control fiscal externo; se articula con el sistema de control interno de cada entidad.", false], ["C", "promover la participación ciudadana en la planeación, gestión y evaluación de las entidades.", "Es el objetivo 4 del artículo 2.2.22.3.3, junto con fortalecer el liderazgo y el talento humano, agilizar la operación, desarrollar una cultura basada en información y control, y promover la coordinación entre entidades.", true]]}]}, {"comp": "sistemas_gestion", "rol": "general", "tag": "Sistemas de gestión (MIPG, control interno y calidad) · Comité de coordinación de control interno e informes", "texto": "Usted es profesional universitario de la oficina de control interno de la alcaldía de un municipio. El jefe de la oficina elaboró el plan anual de auditoría de la vigencia y el estatuto de auditoría interna, y el alcalde pregunta qué instancia debe aprobarlos. Además, la oficina debe publicar el informe de evaluación independiente del estado del sistema de control interno.", "items": [{"id": "SG-116", "niv": 1, "e": "Según la Ley 87 de 1993, el comité de coordinación del sistema de control interno debe establecerse", "f": "Ley 87 de 1993, art. 13", "o": [["A", "en la gobernación, como instancia común para los municipios del departamento.", "El comité es propio de cada organismo o entidad (art. 13), no una instancia departamental compartida.", false], ["B", "al más alto nivel jerárquico de la entidad.", "El artículo 13 de la Ley 87 de 1993 ordena establecer el comité de coordinación del sistema de control interno al más alto nivel jerárquico.", true], ["C", "dentro de la oficina de control interno, que lo preside y lo integra.", "La ley no lo ubica dentro de la oficina de control interno, sino al más alto nivel jerárquico de la entidad.", false]]}, {"id": "SG-117", "niv": 2, "e": "El plan anual de auditoría y el estatuto de auditoría interna los aprueba", "f": "Decreto 1083 de 2015, art. 2.2.21.1.6, lits. b y c (Decreto 648 de 2017)", "o": [["A", "el concejo municipal, mediante acuerdo, a iniciativa del alcalde.", "El concejo no aprueba los instrumentos internos de auditoría de la administración; es función del comité de coordinación de control interno.", false], ["B", "el Comité Institucional de Gestión y Desempeño.", "Ese comité orienta la implementación del MIPG; la aprobación del plan y del estatuto de auditoría corresponde al comité de coordinación de control interno.", false], ["C", "el Comité Institucional de Coordinación de Control Interno.", "El artículo 2.2.21.1.6 del Decreto 1083 de 2015 (adicionado por el Decreto 648 de 2017) le asigna aprobar el Plan Anual de Auditoría y el Estatuto de Auditoría Interna con el Código de Ética del auditor.", true]]}, {"id": "SG-118", "niv": 2, "e": "El jefe de control interno debe publicar en el sitio web de la entidad el informe de evaluación independiente del estado del sistema de control interno", "f": "Ley 87 de 1993, art. 14 (modificado por la Ley 1474 de 2011, art. 9, y por el Decreto Ley 2106 de 2019, art. 156)", "o": [["A", "cada cuatro meses.", "Era la periodicidad del informe pormenorizado antes de la modificación del Decreto Ley 2106 de 2019; hoy el término es de seis meses.", false], ["B", "cada seis meses.", "El artículo 14 de la Ley 87 de 1993, modificado por el artículo 156 del Decreto Ley 2106 de 2019, ordena publicarlo cada seis meses, so pena de falta disciplinaria grave (antes, el artículo 9 de la Ley 1474 de 2011 fijaba cuatro meses para el informe pormenorizado).", true], ["C", "una vez al año, con el informe de rendición de cuentas.", "La norma exige una periodicidad semestral, no anual.", false]]}]}, {"comp": "sistemas_gestion", "rol": "profesional", "tag": "Sistemas de gestión (MIPG, control interno y calidad) · Niveles profesional, asesor y ejecutivo · Valoración de controles y riesgo residual", "texto": "Usted es profesional de la segunda línea de defensa de una entidad nacional que aplica la versión 7 de la guía de riesgos de la Función Pública. Para el riesgo «Posibilidad de pérdida económica por pagos duplicados a proveedores debido a la falta de verificación de las facturas ya registradas», la probabilidad inherente es alta (80 %). Hay dos controles: el control 1, preventivo y manual (un auxiliar verifica en el sistema, antes de radicar cada factura, que no haya sido registrada), y el control 2, detectivo y automático (durante el trámite, el sistema financiero bloquea las facturas con número y NIT ya pagados). Ambos controles están documentados, se aplican siempre y dejan evidencia. Según la guía, los atributos de eficiencia pesan así: preventivo 25 %, detectivo 15 %, correctivo 10 %, automático 25 % y manual 15 %.", "items": [{"id": "SG-128", "niv": 2, "e": "La valoración del control 1 es", "f": "Función Pública, Guía para la Gestión Integral del Riesgo en Entidades Públicas, versión 7 (2025), tabla 6 (valoración de controles)", "o": [["A", "25 %.", "Solo toma el peso del tipo de control (preventivo) y omite el de la forma de implementación (manual).", false], ["B", "40 %.", "La valoración suma los atributos de eficiencia: tipo preventivo (25 %) más implementación manual (15 %) = 40 %.", true], ["C", "50 %.", "Suma preventivo (25 %) con automático (25 %); el control 1 lo ejecuta una persona, por lo que es manual (15 %).", false]]}, {"id": "SG-129", "niv": 3, "e": "Aplicados los dos controles en orden, la probabilidad residual del riesgo es", "f": "Función Pública, Guía para la Gestión Integral del Riesgo en Entidades Públicas, versión 7 (2025), tabla 8 (aplicación de controles para establecer el riesgo residual); cálculo verificado", "o": [["A", "16 %.", "Suma las dos valoraciones (40 % + 40 %) y las aplica de una sola vez. La guía aplica cada control sobre el valor que deja el anterior.", false], ["B", "28,8 %.", "Control 1: 80 % − (80 % × 40 %) = 48 %. Control 2 (detectivo 15 % + automático 25 % = 40 %): 48 % − (48 % × 40 %) = 28,8 %. Así calcula la guía la probabilidad residual.", true], ["C", "48 %.", "Solo aplica el control 1. El control 2, también detectivo, reduce la probabilidad sobre ese 48 %.", false]]}, {"id": "SG-130", "niv": 3, "e": "Si se agrega un control que, una vez hecho el pago duplicado, inicia de inmediato el cobro al proveedor para recuperar el dinero, ese control", "f": "Función Pública, Guía para la Gestión Integral del Riesgo en Entidades Públicas, versión 7 (2025), tipologías de controles y ejemplo de valoración del riesgo residual", "o": [["A", "es correctivo y, según la guía, disminuye el impacto, no la probabilidad.", "El control correctivo se acciona después de materializado el riesgo; en la metodología de la guía, los preventivos y detectivos mueven la probabilidad y los correctivos mueven el impacto.", true], ["B", "es preventivo, porque evita que la pérdida sea definitiva, y disminuye la probabilidad.", "Preventivo es el que actúa antes de la actividad que origina el riesgo; este actúa después de hecho el pago.", false], ["C", "es detectivo, porque descubre el pago duplicado, y reduce por igual probabilidad e impacto.", "Detectivo es el que actúa durante el proceso; este opera tras la materialización para reparar el daño, lo que lo hace correctivo y le da efecto sobre el impacto.", false]]}]}, {"comp": "sistemas_gestion", "rol": "general", "tag": "Sistemas de gestión (MIPG, control interno y calidad) · Tipos de controles", "texto": "Usted es técnico de la oficina de control interno de una empresa social del Estado y revisa tres controles del proceso de nómina: (1) antes de cargar las novedades, la coordinadora de talento humano revisa que cada una tenga el acto administrativo que la soporta; (2) durante la liquidación, una vez calculados los valores, se genera un reporte de diferencias superiores al 10 % frente al mes anterior y los errores encontrados obligan a reliquidar; (3) cuando se detecta un pago en exceso ya realizado, la tesorería inicia el procedimiento de reintegro.", "items": [{"id": "SG-134", "niv": 1, "e": "Según la guía de riesgos de la Función Pública, el control (1) es", "f": "Función Pública, Guía para la Gestión Integral del Riesgo en Entidades Públicas, versión 7 (2025), tipologías de controles", "o": [["A", "preventivo y manual.", "Se acciona antes de la actividad que origina el riesgo (cargar novedades) y lo ejecuta una persona.", true], ["B", "detectivo y manual.", "El detectivo se acciona durante la ejecución del proceso; este control opera antes, en la entrada.", false], ["C", "preventivo y automático.", "Es preventivo, pero lo ejecuta una persona (la coordinadora), por lo que es manual; el automático lo ejecuta un sistema.", false]]}, {"id": "SG-135", "niv": 2, "e": "Por el momento en que se acciona, el control (2) es", "f": "Función Pública, Guía para la Gestión Integral del Riesgo en Entidades Públicas, versión 7 (2025), tipologías de controles", "o": [["A", "preventivo, porque opera antes de que se pague la nómina.", "No actúa antes de la actividad que origina el riesgo (la liquidación), sino durante ella, una vez calculados los valores.", false], ["B", "correctivo, porque genera un reporte de diferencias ya ocurridas.", "El correctivo se acciona después de materializado el riesgo (por ejemplo, con el pago ya hecho); aquí aún no se ha pagado.", false], ["C", "detectivo, porque actúa en plena liquidación, con los valores ya calculados.", "La guía define el control detectivo como el que se acciona durante la ejecución del proceso y detecta el riesgo, aunque genera reprocesos, como la reliquidación.", true]]}, {"id": "SG-136", "niv": 1, "e": "El control (3) es", "f": "Función Pública, Guía para la Gestión Integral del Riesgo en Entidades Públicas, versión 7 (2025), tipologías de controles", "o": [["A", "correctivo.", "La guía define el control correctivo como el que se acciona a la salida del proceso, después de materializado el riesgo; el reintegro busca reparar el daño.", true], ["B", "preventivo.", "Se acciona después de hecho el pago en exceso, no antes de la actividad que origina el riesgo.", false], ["C", "detectivo.", "No opera durante la ejecución del proceso, sino una vez materializado el riesgo.", false]]}]}, {"comp": "disciplinario", "rol": "general", "tag": "Código General Disciplinario · Destinatarios de la ley disciplinaria", "texto": "Usted es profesional universitario de una procuraduría provincial y recibe tres quejas. La primera es contra el interventor externo, una persona natural contratada por un municipio para vigilar la construcción de un puente, a quien se acusa de certificar avances de obra inexistentes. La segunda es contra un operario de una empresa privada de aseo que presta el servicio en el municipio, por maltratar a un usuario durante la recolección; la empresa no ejerce funciones públicas ni administra recursos públicos. La tercera es contra un exsecretario de obras que renunció hace seis meses, por hechos ocurridos en 2025, cuando ejercía el cargo.", "items": [{"id": "DI-108", "niv": 1, "e": "Sobre el interventor externo, es correcto afirmar que", "f": "Ley 1952 de 2019, arts. 69 y 70", "o": [["A", "no es disciplinable, porque su vínculo con el municipio es contractual y solo responde civil, fiscal y penalmente.", "El artículo 70 de la Ley 1952 de 2019 incluye expresamente a los particulares que cumplen labores de interventoría en contratos estatales, cualquiera que sea su vínculo.", false], ["B", "es disciplinable como servidor público, porque recibe honorarios pagados por el municipio.", "Recibir honorarios no lo convierte en servidor público; responde como particular disciplinable bajo el régimen especial de los artículos 69 y siguientes de la Ley 1952 de 2019.", false], ["C", "es disciplinable como particular, porque cumple labores de interventoría en un contrato estatal.", "El régimen disciplinario de los particulares se aplica, entre otros, a quienes cumplen labores de interventoría o supervisión en los contratos estatales (Ley 1952 de 2019, art. 70).", true]]}, {"id": "DI-109", "niv": 3, "e": "En relación con la queja contra el operario de la empresa privada de aseo, debe concluirse que", "f": "Ley 1952 de 2019, art. 70", "o": [["A", "es disciplinable como particular, porque presta un servicio público domiciliario a la comunidad.", "El artículo 70 de la Ley 1952 de 2019 excluye a los particulares que presten servicios públicos, salvo que en esa actividad desempeñen funciones públicas, lo que el caso descarta.", false], ["B", "debe remitirse a control disciplinario interno de la alcaldía, competente frente a los contratistas del municipio.", "Las oficinas de control disciplinario interno conocen de los asuntos contra los servidores de su propia entidad (art. 2 de la Ley 1952 de 2019); además, el operario no es sujeto disciplinable.", false], ["C", "no es sujeto disciplinable, porque prestar un servicio público sin ejercer funciones públicas no lo hace destinatario del código.", "No son disciplinables los particulares que prestan servicios públicos, salvo que en ejercicio de esas actividades desempeñen funciones públicas (Ley 1952 de 2019, art. 70, inciso 3). La empresa no ejerce funciones públicas.", true]]}, {"id": "DI-110", "niv": 1, "e": "Frente al exsecretario de obras, la acción disciplinaria", "f": "Ley 1952 de 2019, arts. 25, 32 y 89", "o": [["A", "procede, porque los servidores públicos siguen siendo destinatarios de la ley disciplinaria aunque se retiren.", "Son destinatarios de la ley disciplinaria los servidores públicos aunque se encuentren retirados del servicio, y la acción procede aunque ya no ejerzan funciones públicas (Ley 1952 de 2019, arts. 25 y 89).", true], ["B", "solo procede si vuelve a ocupar un cargo público antes de que se profiera el fallo.", "El artículo 89 de la Ley 1952 de 2019 no impone esa condición; si la sanción no puede cumplirse por el retiro, se registra en la Procuraduría y en la hoja de vida.", false], ["C", "no procede, porque la renuncia aceptada por la administración extingue la acción disciplinaria en curso o por iniciar.", "La renuncia no es causal de extinción de la acción; estas son la muerte del disciplinable, la caducidad y la prescripción (art. 32 de la Ley 1952 de 2019).", false]]}, {"id": "DI-111", "niv": 3, "e": "Si el interventor resultara responsable de una falta gravísima que no implicó detrimento del patrimonio público, la sanción principal que le corresponde como particular es", "f": "Ley 1952 de 2019, arts. 72 y 73", "o": [["A", "destitución e inhabilidad general de diez a veinte años.", "La destitución es la sanción del particular solo cuando la prestación del servicio es permanente y su vinculación proviene de nombramiento oficial (art. 73 de la Ley 1952 de 2019); el interventor es contratista.", false], ["B", "una multa entre 10 y 100 salarios mínimos mensuales, junto con una inhabilidad de entre uno y veinte años.", "Los particulares destinatarios de la ley disciplinaria se sancionan con multa de 10 a 100 salarios mínimos mensuales legales vigentes al momento del hecho y, concurrentemente, inhabilidad de uno a veinte años para ejercer empleo o función pública, prestar servicios al Estado o contratar con él (Ley 1952 de 2019, art. 73).", true], ["C", "suspensión de la ejecución del contrato de uno a doce meses e inhabilidad especial.", "Esa sanción no existe en el régimen de los particulares. El artículo 73 de la Ley 1952 de 2019 prevé multa e inhabilidad concurrente.", false]]}]}, {"comp": "disciplinario", "rol": "profesional", "tag": "Código General Disciplinario · Niveles profesional, asesor y ejecutivo · Graduación de la sanción y concurso de faltas", "texto": "Usted es profesional de una procuraduría provincial de juzgamiento y proyecta el fallo contra la jefa de presupuesto de un municipio. Quedó demostrado que, con una sola omisión ocurrida en marzo de 2025, cometió dos faltas graves dolosas. El funcionario de conocimiento estima que, para la falta más grave, la sanción adecuada sería suspensión de diez meses e inhabilidad especial por el mismo término. En la hoja de vida de la disciplinada consta una amonestación escrita impuesta en enero de 2021, sin otros antecedentes. Además, antes del fallo, ella devolvió por iniciativa propia los recursos que se habían pagado de más, sin que esa devolución se hubiera decretado en otro proceso.", "items": [{"id": "DI-121", "niv": 3, "e": "Por el concurso de faltas, la suspensión e inhabilidad especial de diez meses puede incrementarse como máximo hasta", "f": "Ley 1952 de 2019, arts. 48, num. 3, y 51", "o": [["A", "quince meses.", "El incremento puede ser hasta en otro tanto, siempre que no exceda el máximo legal; quince meses no es el tope que resulta de esa regla (art. 51 de la Ley 1952 de 2019).", false], ["B", "dieciocho meses.", "En el concurso, si la sanción más grave es la suspensión e inhabilidad especial, se incrementa hasta en otro tanto sin exceder el máximo legal (art. 51 de la Ley 1952 de 2019). Otro tanto daría veinte meses, pero el máximo legal para las faltas graves dolosas es de dieciocho meses (art. 48, num. 3).", true], ["C", "veinte meses.", "Duplicar los diez meses daría veinte, pero el incremento no puede exceder el máximo legal de dieciocho meses previsto en el artículo 48, numeral 3, de la Ley 1952 de 2019.", false]]}, {"id": "DI-122", "niv": 3, "e": "Frente a la conducta de marzo de 2025, la amonestación escrita de enero de 2021", "f": "Ley 1952 de 2019, art. 50 (modificado por la Ley 2094 de 2021, art. 11)", "o": [["A", "no puede valorarse como agravante, porque la amonestación solo agrava si se impuso en los tres años anteriores a la conducta.", "El artículo 50, numeral 2, literal a, de la Ley 1952 de 2019 (modificado por el art. 11 de la Ley 2094 de 2021) fija como agravante haber sido sancionado dentro de los cinco años anteriores a la conducta, pero precisa que la multa y la amonestación se tienen como agravantes solo si fueron impuestas en los tres años anteriores a la comisión de la conducta. Entre enero de 2021 y marzo de 2025 pasaron más de cuatro años, así que la amonestación no agrava.", true], ["B", "debe valorarse como agravante, porque todo antecedente registrado agrava la sanción sin límite de tiempo.", "La ley fija límites temporales: cinco años en general y tres años para multa y amonestación (art. 50, num. 2, lit. a, de la Ley 1952 de 2019).", false], ["C", "debe valorarse como agravante, porque fue impuesta dentro de los cinco años anteriores a la conducta.", "Aplica la regla general de cinco años, pero el mismo literal a del numeral 2 del artículo 50 de la Ley 1952 de 2019 trae una regla especial para la multa y la amonestación: solo agravan si se impusieron en los tres años anteriores a la conducta, y aquí pasaron más de cuatro.", false]]}, {"id": "DI-123", "niv": 1, "e": "La devolución voluntaria de los recursos pagados de más", "f": "Ley 1952 de 2019, arts. 32 y 50 (modificado por la Ley 2094 de 2021, art. 11)", "o": [["A", "extingue la acción disciplinaria, porque repara por completo el daño causado.", "La reparación no es causal de extinción de la acción; las causales son la muerte del disciplinable, la caducidad y la prescripción (art. 32 de la Ley 1952 de 2019).", false], ["B", "solo produce efectos en el proceso de responsabilidad fiscal y no puede valorarse en el proceso disciplinario.", "El artículo 50 de la Ley 1952 de 2019 la incluye expresamente como atenuante para graduar la sanción disciplinaria.", false], ["C", "es un atenuante que se tiene en cuenta para fijar el término de la suspensión e inhabilidad.", "Haber devuelto, restituido o reparado el bien afectado, o resarcido el daño por iniciativa propia, siempre que no se haya decretado en otro proceso, es atenuante para fijar la duración de la suspensión e inhabilidad (Ley 1952 de 2019, art. 50, num. 1, lits. c y d).", true]]}]}, {"comp": "disciplinario", "rol": "general", "tag": "Código General Disciplinario · Poder disciplinario preferente", "texto": "Usted es profesional universitario de una procuraduría provincial de instrucción. La oficina de control disciplinario interno de una alcaldía abrió investigación contra el secretario de movilidad por presuntas irregularidades en la expedición de licencias. El caso tiene amplia difusión y el disciplinado pidió a la Procuraduría, con argumentos sustentados, que asuma el proceso porque considera vulnerado su debido proceso. Al mismo tiempo, el personero municipal anunció que también estudia asumir la investigación.", "items": [{"id": "DI-134", "niv": 2, "e": "Para que la Procuraduría asuma la investigación iniciada por la oficina de control interno, se requiere", "f": "Ley 1952 de 2019, arts. 3 y 86", "o": [["A", "que la actuación todavía esté en indagación previa, pues abierta la investigación ya no puede asumirse.", "La Procuraduría puede iniciar, proseguir o remitir cualquier investigación o juzgamiento, e incluso asumir la segunda instancia (art. 3 de la Ley 1952 de 2019).", false], ["B", "que la oficina de control interno acepte remitirla voluntariamente y el alcalde lo autorice.", "El poder preferente no depende de la voluntad de la oficina ni del jefe de la entidad, a quien solo se informa (art. 86 de la Ley 1952 de 2019).", false], ["C", "decisión motivada del funcionario competente; la oficina suspenderá la actuación y la pondrá a su disposición.", "La Procuraduría, previa decisión motivada del funcionario competente, de oficio o a petición del disciplinado que invoque sustentadamente violación del debido proceso, puede asumir la investigación de otro organismo, que la suspenderá y la pondrá a su disposición (Ley 1952 de 2019, arts. 3 y 86).", true]]}, {"id": "DI-135", "niv": 1, "e": "Sobre el anuncio del personero, es correcto afirmar que las personerías municipales", "f": "Ley 1952 de 2019, arts. 3, 86 y 92", "o": [["A", "tienen poder disciplinario preferente frente a la administración municipal.", "Las personerías municipales y distritales tienen poder disciplinario preferente frente a la administración (Ley 1952 de 2019, arts. 3 y 86).", true], ["B", "carecen de poder preferente, porque esa potestad es exclusiva de la Procuraduría General de la Nación.", "El artículo 3 de la Ley 1952 de 2019 reconoce poder preferente también a las personerías frente a la administración, sin perjuicio del de la Procuraduría.", false], ["C", "solo ejercen poder preferente frente a los concejales y ediles del municipio.", "Los concejales y ediles son servidores de elección popular, cuyo conocimiento corresponde a la Procuraduría (art. 92 de la Ley 1952 de 2019); el poder preferente de la personería es frente a la administración.", false]]}, {"id": "DI-136", "niv": 2, "e": "Una vez abrió la investigación, la oficina de control disciplinario interno debía", "f": "Ley 1952 de 2019, art. 216", "o": [["A", "informar de inmediato a la Viceprocuraduría para que se decida si se ejerce el poder preferente.", "Si la investigación disciplinaria la inicia una oficina de control disciplinario interno, esta da aviso inmediato a la Viceprocuraduría General de la Nación y al funcionario competente de esa entidad o de la personería correspondiente, para que decida sobre el ejercicio del poder disciplinario preferente (Ley 1952 de 2019, art. 216).", true], ["B", "pedir autorización previa a la Procuraduría antes de notificar el auto de apertura al disciplinado.", "La ley no exige autorización previa; exige dar aviso inmediato para que se decida sobre el poder preferente (art. 216 de la Ley 1952 de 2019).", false], ["C", "esperar a que el disciplinado manifieste si acepta que la oficina lo investigue.", "La competencia no depende de la aceptación del disciplinado; la acción disciplinaria es pública y oficiosa (arts. 85 y 86 de la Ley 1952 de 2019).", false]]}]}, {"comp": "disciplinario", "rol": "general", "tag": "Código General Disciplinario · Queja anónima, inhibitoria y queja temeraria", "texto": "Usted es técnico de la oficina de control disciplinario interno de una gobernación y clasifica la correspondencia. Recibe un escrito anónimo que afirma, sin ningún dato concreto ni prueba, que «todos en la secretaría de salud son corruptos». Recibe otro anónimo que adjunta copias de las certificaciones de cumplimiento firmadas por un supervisor y de los registros migratorios que muestran que el contratista estaba fuera del país en los días certificados. Además, en un proceso ya tramitado se estableció que un ciudadano presentó una queja temeraria contra una funcionaria.", "items": [{"id": "DI-150", "niv": 1, "e": "Frente al segundo escrito anónimo, la acción disciplinaria", "f": "Ley 1952 de 2019, art. 86; Ley 190 de 1995, art. 38; Ley 24 de 1992, art. 27", "o": [["A", "solo puede iniciarse si quien lo envió se identifica y ratifica la queja bajo juramento.", "La ley no exige identificar al autor cuando el anónimo trae pruebas suficientes; en ese caso la autoridad actúa de oficio (art. 38 de la Ley 190 de 1995).", false], ["B", "no puede iniciarse, porque la ley prohíbe sin excepción tramitar quejas anónimas.", "La prohibición tiene excepción: el anónimo acompañado de medios probatorios suficientes permite actuar de oficio (art. 86 de la Ley 1952 de 2019 y art. 38 de la Ley 190 de 1995).", false], ["C", "puede iniciarse, porque el anónimo viene acompañado de medios probatorios suficientes.", "La acción no procede por anónimos, salvo que cumplan los requisitos del artículo 38 de la Ley 190 de 1995 y del artículo 27 de la Ley 24 de 1992, es decir, que existan medios probatorios suficientes sobre la infracción (Ley 1952 de 2019, art. 86).", true]]}, {"id": "DI-151", "niv": 2, "e": "Ante el primer escrito anónimo, lo procedente es", "f": "Ley 1952 de 2019, arts. 10, 86, 208 y 209", "o": [["A", "abrir investigación contra el secretario de salud, como responsable de toda la dependencia.", "Abrir investigación solo por ser jefe de la dependencia supondría responsabilidad objetiva, proscrita por el artículo 10 de la Ley 1952 de 2019; además, no hay hechos concretos.", false], ["B", "inhibirse de plano de iniciar actuación, porque la información es absolutamente inconcreta y difusa.", "Cuando la información o queja se presenta de manera absolutamente inconcreta o difusa, el funcionario se inhibe de plano de iniciar actuación, y contra esa decisión no procede recurso (Ley 1952 de 2019, art. 209). Además, el anónimo carece de medios probatorios (art. 86).", true], ["C", "abrir indagación previa para identificar a los servidores de la secretaría a los que alude el escrito.", "La indagación previa supone una posible falta cuyo autor no está identificado (art. 208). Aquí no hay hecho concreto alguno y el anónimo no trae pruebas (art. 86).", false]]}, {"id": "DI-152", "niv": 2, "e": "Advertida la temeridad de la queja del ciudadano, la autoridad disciplinaria puede imponerle", "f": "Ley 1952 de 2019, art. 210 (modificado por la Ley 2094 de 2021, art. 35)", "o": [["A", "una amonestación escrita, que se anota en el certificado de antecedentes del ciudadano.", "La amonestación es una sanción para disciplinables por faltas leves culposas (art. 48); al quejoso temerario se le impone multa (art. 210).", false], ["B", "una multa de hasta 180 salarios mínimos diarios, previa citación para escuchar sus explicaciones.", "Advertida la temeridad, la autoridad puede imponer multa de hasta 180 salarios diarios mínimos legales vigentes, citando al quejoso para que dé explicaciones, aporte pruebas y ejerza contradicción (Ley 1952 de 2019, art. 210, modificado por la Ley 2094 de 2021).", true], ["C", "una multa de 10 a 100 salarios mínimos mensuales legales vigentes, sin necesidad de oírlo.", "Ese rango es la multa de los particulares disciplinables (art. 73). Para el quejoso temerario la multa es de hasta 180 salarios diarios y debe oírse previamente (art. 210).", false]]}]}, {"comp": "disciplinario", "rol": "general", "tag": "Código General Disciplinario · Suspensión provisional", "texto": "Usted es profesional universitario de la oficina de control disciplinario interno de un hospital departamental. En la investigación contra el almacenista por una presunta falta gravísima relacionada con el manejo de medicamentos, hay serios elementos de juicio de que, si permanece en el cargo, podría alterar los inventarios que son prueba del proceso. El jefe de la oficina evalúa ordenar la suspensión provisional del almacenista y le pide revisar su procedencia, su término y sus efectos.", "items": [{"id": "DI-174", "niv": 2, "e": "La suspensión provisional del almacenista procede porque", "f": "Ley 1952 de 2019, art. 217", "o": [["A", "se investiga una falta gravísima y su permanencia en el cargo posibilita que interfiera en la investigación.", "Durante la investigación o el juzgamiento por faltas gravísimas o graves, puede ordenarse motivadamente la suspensión provisional, sin remuneración, cuando haya serios elementos de juicio de que la permanencia en el cargo posibilita la interferencia en el trámite, o la continuación o reiteración de la falta (Ley 1952 de 2019, art. 217).", true], ["B", "procede en cualquier proceso, sin importar la gravedad de la falta, cuando la pide el quejoso.", "Solo procede por faltas gravísimas o graves y por decisión motivada del funcionario, no a petición del quejoso (art. 217 de la Ley 1952 de 2019).", false], ["C", "toda apertura de investigación por falta gravísima conlleva automáticamente esa medida.", "La medida no es automática: debe ordenarse motivadamente y exige serios elementos de juicio sobre interferencia, continuidad o reiteración de la falta (art. 217 de la Ley 1952 de 2019).", false]]}, {"id": "DI-175", "niv": 2, "e": "Sobre el término de la suspensión provisional, es correcto afirmar que", "f": "Ley 1952 de 2019, art. 217", "o": [["A", "es de seis meses improrrogables y contra el auto que la ordena procede apelación.", "El término es de tres meses prorrogables, y el auto no se apela sino que se somete a consulta (art. 217 de la Ley 1952 de 2019).", false], ["B", "es de un mes, prorrogable mes a mes hasta que se profiera el fallo de primera instancia.", "La ley fija tres meses prorrogables hasta en otro tanto, y otros tres meses una vez proferido el fallo de primera o única instancia (art. 217).", false], ["C", "es de tres meses durante la investigación o el juzgamiento, prorrogable hasta en otro tanto, y el auto se somete a consulta.", "El término de la suspensión provisional es de tres meses, prorrogable hasta en otro tanto; solo después del fallo de primera o única instancia cabe otra prórroga de tres meses. El auto que la decreta y las prórrogas se someten a consulta, sin perjuicio de su cumplimiento inmediato (Ley 1952 de 2019, art. 217).", true]]}, {"id": "DI-176", "niv": 1, "e": "Si la investigación termina con fallo absolutorio, el almacenista", "f": "Ley 1952 de 2019, art. 218", "o": [["A", "será reintegrado y tendrá derecho al pago de la remuneración dejada de percibir.", "Quien fue suspendido provisionalmente es reintegrado y tiene derecho al reconocimiento y pago de la remuneración dejada de percibir cuando la investigación termina con fallo absolutorio, archivo o terminación, o cuando expira la suspensión sin fallo (Ley 1952 de 2019, art. 218).", true], ["B", "solo podrá reclamar los salarios dejados de percibir ante la jurisdicción contencioso administrativa.", "No necesita acudir a un juez: el reconocimiento y pago es consecuencia directa del fallo absolutorio según el artículo 218 de la Ley 1952 de 2019.", false], ["C", "será reintegrado, pero sin pago de salarios, porque la medida provisional no era una sanción.", "El artículo 218 de la Ley 1952 de 2019 ordena expresamente pagar la remuneración dejada de percibir durante la suspensión.", false]]}]}, {"comp": "disciplinario", "rol": "profesional", "tag": "Código General Disciplinario · Niveles profesional, asesor y ejecutivo · Revocatoria directa", "texto": "Usted es profesional de una dependencia de la Procuraduría que proyecta las respuestas a solicitudes de revocatoria directa. Un servidor municipal fue sancionado en 2025 por la oficina de control disciplinario interno de su alcaldía; no interpuso ningún recurso y ahora pide la revocatoria del fallo, porque considera que se fundó en una norma que ya estaba derogada cuando se profirió. Otro servidor, sancionado por una personería, apeló el fallo, la apelación le fue resuelta desfavorablemente y ahora también pide la revocatoria.", "items": [{"id": "DI-187", "niv": 2, "e": "La autoridad competente para revocar el fallo sancionatorio proferido por la oficina de control interno de la alcaldía es", "f": "Ley 1952 de 2019, arts. 141 (modificado por la Ley 2094 de 2021, art. 28) y 236", "o": [["A", "el jefe de la misma oficina de control disciplinario interno que profirió el fallo.", "Bajo la Ley 1952 de 2019 la oficina que profirió el fallo no puede revocarlo: el artículo 141 (modificado por la Ley 2094 de 2021) y el artículo 142 atribuyen esa competencia a la Procuraduría General de la Nación.", false], ["B", "el alcalde municipal, en su calidad de nominador del servidor sancionado.", "El nominador ejecuta la sanción (art. 236), pero no tiene competencia para revocar fallos disciplinarios (art. 141).", false], ["C", "la Procuraduría General de la Nación, según sus competencias internas.", "Según el artículo 141 de la Ley 1952 de 2019 (modificado por el art. 28 de la Ley 2094 de 2021), los fallos sancionatorios de las personerías y de las oficinas de control interno disciplinario pueden ser revocados, de oficio o a petición del interesado, por la Procuraduría General de la Nación, según sus competencias internas; el artículo 142 reitera que la revocatoria de fallos sancionatorios, autos de archivo y fallos absolutorios es competencia de la Procuraduría.", true]]}, {"id": "DI-188", "niv": 3, "e": "La solicitud de revocatoria del servidor sancionado por la personería", "f": "Ley 1952 de 2019, arts. 141 y 144", "o": [["A", "procede, porque la revocatoria puede pedirse aunque se hayan agotado los recursos ordinarios.", "Es al revés: el artículo 144 de la Ley 1952 de 2019 condiciona la solicitud del sancionado a no haber interpuesto los recursos ordinarios.", false], ["B", "no procede, porque el sancionado interpuso recurso de apelación contra el fallo.", "El sancionado puede solicitar la revocatoria por una única vez, siempre y cuando no hubiere interpuesto contra el fallo los recursos ordinarios previstos en el código (Ley 1952 de 2019, art. 144).", true], ["C", "procede, siempre que se presente dentro de los cuatro meses siguientes a la ejecutoria del fallo.", "El plazo de cuatro meses del artículo 141 es para el quejoso, las víctimas o perjudicados; además, el sancionado que apeló no puede pedir la revocatoria (art. 144).", false]]}, {"id": "DI-189", "niv": 1, "e": "Para que proceda la revocatoria pedida por el primer servidor, debe demostrarse que el fallo", "f": "Ley 1952 de 2019, arts. 140 y 143", "o": [["A", "se basó en pruebas que el sancionado considera insuficientes o mal valoradas por el funcionario.", "La mera inconformidad con la valoración probatoria no es causal; la revocatoria exige infracción manifiesta de normas o vulneración manifiesta de derechos fundamentales (art. 143).", false], ["B", "contiene un error aritmético o un error en el nombre o la identidad del servidor sancionado.", "Esos errores se subsanan mediante corrección, aclaración o adición del fallo por el mismo funcionario (art. 140), no por revocatoria directa.", false], ["C", "desconoce de modo evidente las normas que debían sustentarlo o lesiona claramente derechos fundamentales.", "Los fallos sancionatorios son revocables solo cuando infrinjan manifiestamente las normas constitucionales, legales o reglamentarias en que deban fundarse, o cuando vulneren o amenacen manifiestamente los derechos fundamentales (Ley 1952 de 2019, art. 143).", true]]}]}, {"comp": "contratacion", "rol": "general", "tag": "Contratación estatal · Inhabilidades e incompatibilidades", "texto": "Usted es profesional universitario de la oficina de contratación de una alcaldía. Llegan tres situaciones: (i) el hermano de la esposa del secretario de Hacienda municipal ofrece sus servicios como contador; (ii) quien fue jefe de la oficina asesora jurídica de la alcaldía, empleo del nivel asesor, y se retiró hace siete meses, quiere presentar oferta en un proceso de la misma alcaldía; y (iii) un contratista persona natural que ejecuta un contrato de mantenimiento con la alcaldía fue sancionado con destitución por haber abandonado injustificadamente un empleo público anterior, y la decisión ya quedó en firme.", "items": [{"id": "CE-107", "niv": 2, "e": "Respecto del hermano de la esposa del secretario de Hacienda, lo procedente es indicar que", "f": "Ley 80 de 1993, art. 8, num. 2, lit. b)", "o": [["A", "no puede contratar con la alcaldía, porque es pariente en segundo grado de afinidad de un servidor del nivel directivo.", "El literal b) del numeral 2 del artículo 8 de la Ley 80 impide contratar con la entidad respectiva a quienes tengan parentesco hasta el segundo grado de afinidad con sus servidores de los niveles directivo, asesor o ejecutivo. El cuñado está en segundo grado de afinidad y el secretario de Hacienda pertenece al nivel directivo.", true], ["B", "puede contratar, porque la inhabilidad por afinidad llega únicamente hasta el primer grado.", "La norma cubre el parentesco hasta el segundo grado de afinidad (art. 8, num. 2, lit. b, Ley 80), grado en el que se encuentra el hermano del cónyuge.", false], ["C", "puede contratar si el secretario de Hacienda se declara impedido y se aparta de todas las etapas del proceso de selección y de la supervisión.", "Declararse impedido resuelve un conflicto de interés del servidor, pero no elimina la inhabilidad del pariente, que opera frente a la entidad por mandato del artículo 8 de la Ley 80.", false]]}, {"id": "CE-108", "niv": 3, "e": "En cuanto al exjefe de la oficina asesora jurídica, usted debe advertir que", "f": "Ley 80 de 1993, art. 8, num. 2, lit. a)", "o": [["A", "puede participar, siempre que no haya intervenido en la elaboración de los estudios previos de ese proceso.", "La incompatibilidad no depende de haber intervenido en el proceso: opera por haber sido servidor de esos niveles en la entidad durante el año siguiente al retiro (art. 8, num. 2, lit. a, Ley 80).", false], ["B", "no puede presentar oferta ni contratar con la alcaldía hasta que se cumpla un año contado desde su retiro.", "El literal a) del numeral 2 del artículo 8 de la Ley 80 impide contratar con la entidad a quienes fueron sus servidores en los niveles directivo, asesor o ejecutivo, por el término de un año contado desde la fecha del retiro. Solo han pasado siete meses.", true], ["C", "puede participar, porque la incompatibilidad de los exservidores cobija únicamente los empleos del nivel directivo.", "La incompatibilidad del literal a) del numeral 2 del artículo 8 de la Ley 80 comprende los niveles directivo, asesor y ejecutivo; el empleo era del nivel asesor.", false]]}, {"id": "CE-109", "niv": 1, "e": "Frente al contratista sancionado con destitución, lo que prevé la ley es que", "f": "Ley 80 de 1993, arts. 8, num. 1, lit. d) y 9 (modificado por la Ley 2014 de 2019, art. 6)", "o": [["A", "ceda el contrato con autorización previa y escrita de la alcaldía o, si ello no es posible, renuncie a su ejecución.", "La destitución genera inhabilidad (art. 8, num. 1, lit. d, Ley 80) y, como sobrevino durante la ejecución, aplica el artículo 9 de la Ley 80, modificado por la Ley 2014 de 2019: el contratista cede el contrato previa autorización escrita de la entidad o, si no es posible, renuncia a su ejecución.", true], ["B", "la alcaldía declare la caducidad del contrato y lo liquide en el estado en que se encuentre.", "La caducidad procede por incumplimiento grave del contratista que pueda paralizar el contrato (art. 18, Ley 80), no por una inhabilidad sobreviniente, que tiene su propia regla en el artículo 9.", false], ["C", "continúe ejecutándolo hasta el final, porque la inhabilidad no afecta los contratos celebrados antes de que se impusiera la sanción.", "El artículo 9 de la Ley 80 regula precisamente la inhabilidad que sobreviene durante la ejecución y ordena la cesión o la renuncia; el contratista no puede seguir ejecutándolo como si nada.", false]]}]}, {"comp": "contratacion", "rol": "general", "tag": "Contratación estatal · Planeación: análisis del sector y estudios previos", "texto": "La Secretaría de Educación de una gobernación prepara un proceso para contratar el transporte escolar rural y usted integra el equipo estructurador. El coordinador propone tres cosas: que el análisis del sector se limite a pedir cotizaciones a dos empresas; que en los estudios previos se omita el análisis de riesgos, porque «eso se resuelve durante la ejecución»; y que, para la capacidad financiera, se copien los indicadores del pliego de otra gobernación cuyo proceso tenía un presupuesto diez veces mayor.", "items": [{"id": "CE-128", "niv": 1, "e": "Sobre el alcance del análisis del sector, usted debe advertir que", "f": "Decreto 1082 de 2015, art. 2.2.1.1.1.6.1", "o": [["A", "basta con las dos cotizaciones, porque el análisis del sector sirve para estimar el valor del contrato.", "El análisis del sector no se reduce a estimar precios; el Decreto 1082 de 2015 (art. 2.2.1.1.1.6.1) exige estudiarlo desde varias perspectivas, incluido el riesgo.", false], ["B", "debe abarcar los aspectos jurídicos, comerciales, financieros, organizacionales, técnicos y de riesgo.", "El artículo 2.2.1.1.1.6.1 del Decreto 1082 de 2015 ordena a la entidad hacer, durante la planeación, el análisis necesario para conocer el sector desde las perspectivas legal, comercial, financiera, organizacional, técnica y de análisis de riesgo, y dejar constancia de ello en los documentos del proceso.", true], ["C", "se exige en la licitación pública, de modo que en una selección abreviada puede reducirse a un sondeo de precios.", "El deber de análisis se predica de la entidad en la planeación de sus procesos de contratación, sin limitarlo a la licitación (Decreto 1082 de 2015, art. 2.2.1.1.1.6.1).", false]]}, {"id": "CE-129", "niv": 2, "e": "Frente a la propuesta de omitir el análisis de riesgos en los estudios previos, lo correcto es responder que", "f": "Ley 1150 de 2007, art. 4; Decreto 1082 de 2015, art. 2.2.1.1.2.1.1, num. 6", "o": [["A", "es admisible, porque los riesgos se reparten durante la ejecución mediante las modificaciones que acuerden las partes.", "Los riesgos previsibles deben identificarse y asignarse desde la planeación, en los estudios previos y en los pliegos (art. 4, Ley 1150; Decreto 1082, art. 2.2.1.1.2.1.1, num. 6), no dejarse para la ejecución.", false], ["B", "es admisible si el contrato incluye una cláusula de multas suficientemente amplia para cubrir cualquier eventualidad que se presente.", "Las multas sirven para conminar al contratista a cumplir (art. 17, Ley 1150) y no reemplazan el análisis y la asignación de riesgos que exigen el artículo 4 de la Ley 1150 y el Decreto 1082 de 2015.", false], ["C", "los estudios previos deben incluir el análisis de riesgo y la forma de mitigarlo, y el pliego debe asignar los riesgos previsibles.", "El numeral 6 del artículo 2.2.1.1.2.1.1 del Decreto 1082 de 2015 incluye en los estudios previos el análisis de riesgo y la forma de mitigarlo, y el artículo 4 de la Ley 1150 exige que los pliegos incluyan la estimación, tipificación y asignación de los riesgos previsibles.", true]]}, {"id": "CE-130", "niv": 2, "e": "Sobre copiar los indicadores financieros del pliego de la otra gobernación, usted debe señalar que", "f": "Ley 1150 de 2007, art. 5, num. 1; Decreto 1082 de 2015, art. 2.2.1.1.1.6.2", "o": [["A", "los requisitos habilitantes deben ser proporcionales al contrato y fijarse con base en su riesgo, su valor y el análisis del sector.", "El numeral 1 del artículo 5 de la Ley 1150 exige que los requisitos habilitantes sean adecuados y proporcionales a la naturaleza y al valor del contrato, y el artículo 2.2.1.1.1.6.2 del Decreto 1082 de 2015 ordena fijarlos según el riesgo, el valor, el análisis del sector y el conocimiento de los posibles oferentes, sin aplicar fórmulas de manera mecánica.", true], ["B", "es una buena práctica, porque unos indicadores más exigentes garantizan que se seleccione un contratista con mayor solvencia financiera.", "Exigir indicadores desproporcionados frente al valor del contrato desconoce el numeral 1 del artículo 5 de la Ley 1150 y puede restringir injustificadamente la participación.", false], ["C", "es válido siempre que los indicadores se publiquen en el proyecto de pliego para recibir observaciones.", "La publicación no corrige la falta de proporcionalidad; los requisitos deben definirse con base en el análisis propio del proceso (Decreto 1082, art. 2.2.1.1.1.6.2).", false]]}]}, {"comp": "contratacion", "rol": "general", "tag": "Contratación estatal · Pliegos de condiciones, documentos tipo y adendas", "texto": "Usted es profesional de la oficina de contratación de una alcaldía que adelanta una licitación pública de obra para pavimentar vías urbanas. Durante la planeación, el secretario de Hacienda se opuso a publicar el proyecto de pliego porque aún no había expedido el certificado de disponibilidad presupuestal (CDP). Un asesor externo propone redactar un pliego propio, distinto del documento tipo de Colombia Compra Eficiente, para «ajustarlo a la realidad del municipio». Ya abierto el proceso, y faltando dos días hábiles para el cierre, varios interesados piden una adenda que amplíe el plazo para presentar ofertas.", "items": [{"id": "CE-131", "niv": 3, "e": "Frente a la objeción del secretario de Hacienda sobre el proyecto de pliego, es correcto señalar que", "f": "Ley 1150 de 2007, art. 8, par. (adicionado por la Ley 1882 de 2018, art. 6); Decreto 1082 de 2015, art. 2.2.1.1.2.1.5, num. 6", "o": [["A", "sin el CDP no puede publicarse el proyecto de pliego, porque los documentos del proceso deben tener respaldo presupuestal desde el inicio.", "La Ley 1882 de 2018 (art. 6) aclaró que no es obligatorio contar con disponibilidad presupuestal para publicar el proyecto de pliego.", false], ["B", "no se requiere disponibilidad presupuestal para publicar el proyecto de pliego, aunque el acto de apertura sí debe señalar el CDP.", "El parágrafo del artículo 8 de la Ley 1150, adicionado por el artículo 6 de la Ley 1882 de 2018, dispone que no es obligatorio contar con disponibilidad presupuestal para publicar el proyecto de pliego; en cambio, el acto administrativo de apertura debe señalar el certificado de disponibilidad presupuestal (Decreto 1082 de 2015, art. 2.2.1.1.2.1.5, num. 6).", true], ["C", "el CDP se exige al momento de pagar al contratista, y no durante las etapas de planeación y selección de la licitación.", "El acto de apertura debe indicar el CDP (Decreto 1082, art. 2.2.1.1.2.1.5, num. 6), y la ejecución del contrato requiere la existencia de las disponibilidades presupuestales (art. 41, Ley 80).", false]]}, {"id": "CE-132", "niv": 2, "e": "Sobre la propuesta de usar un pliego propio en lugar del documento tipo, usted debe advertir que", "f": "Ley 1150 de 2007, art. 2, par. 7 (modificado por la Ley 2022 de 2020, art. 1)", "o": [["A", "los documentos tipo son una guía orientadora que cada entidad puede adaptar libremente a sus necesidades.", "La ley les da carácter obligatorio (art. 2, par. 7, Ley 1150, modificado por la Ley 2022 de 2020); no son simples guías.", false], ["B", "los documentos tipo son obligatorios para las entidades del orden nacional, no para los municipios.", "La obligación cobija a todas las entidades sometidas al Estatuto General de Contratación, incluidas las territoriales (art. 2, par. 7, Ley 1150).", false], ["C", "los documentos tipo para obra pública son de uso obligatorio para las entidades sometidas al Estatuto General de Contratación.", "El parágrafo 7 del artículo 2 de la Ley 1150, modificado por el artículo 1 de la Ley 2022 de 2020, establece que los documentos tipo adoptados por Colombia Compra Eficiente son de obligatorio cumplimiento y, en todo caso, de uso obligatorio en los procesos de obra pública de todas las entidades sometidas al Estatuto General de Contratación.", true]]}, {"id": "CE-133", "niv": 3, "e": "Ante la solicitud de adenda presentada faltando dos días hábiles para el cierre, la alcaldía", "f": "Ley 80 de 1993, art. 30, num. 5, inc. 2 (modificado por la Ley 1474 de 2011, art. 89); Decreto 1082 de 2015, art. 2.2.1.1.2.2.1", "o": [["A", "puede expedirla, siempre que la ampliación no supere la mitad del plazo inicialmente fijado para presentar ofertas.", "El límite de la mitad del plazo se refiere a la prórroga hecha antes de su vencimiento; la ley prohíbe en todo caso expedir adendas en los tres días anteriores al cierre, ni para extender el término.", false], ["B", "no puede expedirla, porque en la licitación no se expiden adendas en los tres días anteriores al cierre, ni para ampliar el plazo.", "El inciso 2 del numeral 5 del artículo 30 de la Ley 80, modificado por el artículo 89 de la Ley 1474 de 2011, prohíbe expedir adendas dentro de los tres días anteriores al cierre, ni siquiera para extender el término. El Decreto 1082 de 2015 (art. 2.2.1.1.2.2.1) reitera esa regla para la licitación.", true], ["C", "puede expedirla hasta el día hábil anterior al cierre, siempre que la publique entre las 7:00 a. m. y las 7:00 p. m.", "Esa regla del Decreto 1082 de 2015 (art. 2.2.1.1.2.2.1) aplica a las demás modalidades; en la licitación pública la ley exige tres días de anticipación.", false]]}, {"id": "CE-134", "niv": 1, "e": "Una vez publicado el proyecto de pliego de esta licitación, los interesados pueden presentar observaciones durante", "f": "Decreto 1082 de 2015, art. 2.2.1.1.2.1.4", "o": [["A", "tres días hábiles.", "Tres días hábiles es, por ejemplo, el término para manifestar interés en la selección abreviada de menor cuantía (Decreto 1082, art. 2.2.1.2.1.2.20), no el de observaciones al proyecto de pliego.", false], ["B", "cinco días hábiles.", "Cinco días hábiles es el término de observaciones al proyecto de pliego en la selección abreviada y el concurso de méritos (Decreto 1082, art. 2.2.1.1.2.1.4, lit. b).", false], ["C", "diez días hábiles.", "El literal a) del artículo 2.2.1.1.2.1.4 del Decreto 1082 de 2015 fija un término de diez días hábiles para comentar el proyecto de pliego en la licitación pública.", true]]}]}, {"comp": "contratacion", "rol": "profesional", "tag": "Contratación estatal · Niveles profesional, asesor y ejecutivo · Deberes y responsabilidad de supervisores, interventores y ordenadores del gasto", "texto": "Usted es profesional de la oficina de contratación de una gobernación. El interventor de un contrato de obra vial detectó hace dos meses que el contratista estaba usando materiales de menor especificación que la exigida, pero no lo informó; hoy la vía presenta fallas y la gobernación estima perjuicios. Por otra parte, en otro contrato, el secretario de Infraestructura, como ordenador del gasto, recibió oportunamente un informe del supervisor sobre posibles atrasos graves y hasta ahora no ha requerido al contratista ni adoptado ninguna medida.", "items": [{"id": "CE-152", "niv": 2, "e": "Por no haber informado oportunamente el uso de materiales de menor especificación, el interventor", "f": "Ley 1474 de 2011, art. 84, par. 3; Ley 80 de 1993, art. 53 (modificado por la Ley 1882 de 2018, art. 2)", "o": [["A", "responde solidariamente con el contratista por los perjuicios que le sean imputables.", "El parágrafo 3 del artículo 84 de la Ley 1474 de 2011 dispone que el interventor que no haya informado oportunamente a la entidad un posible incumplimiento del contrato vigilado es solidariamente responsable con el contratista de los perjuicios que se ocasionen, por los daños que le sean imputables.", true], ["B", "no tiene responsabilidad, porque el uso de los materiales es una obligación exclusiva del contratista de obra.", "El interventor tiene el deber de mantener informada a la entidad de los hechos que pongan en riesgo el cumplimiento (art. 84, Ley 1474); su omisión genera responsabilidad propia.", false], ["C", "puede ser sancionado con las multas pactadas en el contrato de interventoría, pero no responde por los perjuicios.", "La ley establece una responsabilidad solidaria por los perjuicios (art. 84, par. 3, Ley 1474), además de la responsabilidad civil, fiscal, penal y disciplinaria de los interventores (art. 53, Ley 80).", false]]}, {"id": "CE-153", "niv": 3, "e": "Además, por incumplir el deber de entregar esa información a la entidad, el interventor puede quedar inhabilitado para contratar", "f": "Ley 80 de 1993, art. 8, num. 1, lit. k) (adicionado por la Ley 1474 de 2011, art. 84, par. 2)", "o": [["A", "por un año, contado desde la terminación del contrato de interventoría.", "El término de esta inhabilidad es de cinco años y se cuenta desde la ejecutoria del acto que la declara (art. 8, num. 1, lit. k, Ley 80).", false], ["B", "de forma permanente, desde el momento en que la gobernación detecta la omisión del interventor.", "La inhabilidad es temporal (cinco años) y requiere un acto administrativo ejecutoriado, previa actuación administrativa (art. 8, num. 1, lit. k, Ley 80).", false], ["C", "por cinco años, contados desde la ejecutoria del acto administrativo que así lo declare.", "El literal k) del numeral 1 del artículo 8 de la Ley 80, adicionado por el parágrafo 2 del artículo 84 de la Ley 1474 de 2011, establece la inhabilidad del interventor que incumpla el deber de entregar esa información, por cinco años contados a partir de la ejecutoria del acto que así lo declare, previa actuación administrativa.", true]]}, {"id": "CE-154", "niv": 2, "e": "En cuanto al ordenador del gasto que no ha adoptado medidas frente al informe de atrasos graves, es correcto afirmar que", "f": "Ley 1474 de 2011, art. 84, par. 3, inc. 2", "o": [["A", "si no conmina al contratista ni adopta medidas para proteger los recursos, responde solidariamente por los perjuicios.", "El inciso 2 del parágrafo 3 del artículo 84 de la Ley 1474 dispone que, cuando el ordenador del gasto es informado oportunamente de posibles incumplimientos y no conmina al contratista ni adopta las medidas necesarias, es responsable solidariamente con este de los perjuicios que se ocasionen.", true], ["B", "debe esperar a que el atraso supere la mitad del plazo pactado antes de requerir al contratista.", "La norma no fija ese umbral; exige actuar ante el informe oportuno de posibles incumplimientos para salvaguardar el interés general y los recursos públicos (art. 84, par. 3, Ley 1474).", false], ["C", "no tiene responsabilidad, porque la vigilancia del contrato corresponde de manera exclusiva al supervisor que designó la entidad.", "La ley atribuye responsabilidad solidaria al ordenador del gasto que, informado, no actúa (art. 84, par. 3, inc. 2, Ley 1474).", false]]}]}, {"comp": "contratacion", "rol": "general", "tag": "Contratación estatal · La procuraduría preventiva frente a una licitación", "texto": "Usted es profesional de una procuraduría provincial que, en ejercicio de la función preventiva, hace seguimiento a una licitación pública de obra para construir un centro de salud que adelanta un municipio. Un veedor ciudadano le pide que la procuraduría apruebe el informe de evaluación antes de la adjudicación. Un proponente se queja de que aún no conoce las ofertas económicas de los demás, aunque ya se publicó el informe de evaluación de los requisitos habilitantes y de los factores técnicos. El alcalde, por su parte, pregunta cómo debe hacerse la adjudicación.", "items": [{"id": "CE-174", "niv": 2, "e": "Frente a la solicitud del veedor, usted debe explicar que", "f": "Ley 80 de 1993, art. 25, num. 11; Decreto 1082 de 2015, art. 2.2.1.1.2.2.3", "o": [["A", "la procuraduría puede ordenar al municipio modificar el informe de evaluación si encuentra errores de calificación.", "La evaluació
