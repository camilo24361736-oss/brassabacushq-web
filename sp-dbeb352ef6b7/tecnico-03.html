ar posibles actos de corrupción de funcionarios de la alcaldía sin tener que desplazarse.", "items": [{"id": "AC-107", "niv": 1, "e": "Frente a lo que descubrió, Tomás", "f": "Ley 1952 de 2019, art. 38, num. 25", "o": [["A", "cumple su deber al informar a su jefe inmediato, quien es el único que decide si se presenta una denuncia.", "El deber de denunciar es personal de cada servidor; informar al superior no lo agota, y la sugerencia de no actuar no lo exime.", false], ["B", "debe denunciar los hechos ante las autoridades competentes, aunque su jefe le haya sugerido lo contrario.", "El numeral 25 del artículo 38 de la Ley 1952 de 2019 establece como deber de todo servidor público denunciar los delitos, contravenciones y faltas disciplinarias de los que tenga conocimiento, salvo las excepciones de ley.", true], ["C", "puede abstenerse de actuar mientras no tenga la certeza plena de que se cometió un delito.", "La ley no exige certeza plena para denunciar; establecer la responsabilidad corresponde a las autoridades que investigan.", false]]}, {"id": "AC-108", "niv": 1, "e": "Al contribuyente se le debe informar que la alcaldía", "f": "Ley 1474 de 2011, art. 76", "o": [["A", "solo recibe denuncias por corrupción presentadas personalmente y por escrito ante el despacho del alcalde o del secretario de gobierno.", "La ley exige que la entidad facilite la presentación de denuncias por su página web, sin limitarla a la presentación personal ante el alcalde.", false], ["B", "no tramita denuncias de corrupción, porque estas solo pueden presentarse ante la Fiscalía.", "Las entidades públicas deben recibir y tramitar quejas, sugerencias y reclamos, y disponer de un espacio para denuncias de corrupción, sin perjuicio de la competencia de la Fiscalía y de los órganos de control.", false], ["C", "debe tener en su página web principal un espacio para denunciar actos de corrupción de sus funcionarios.", "El artículo 76 de la Ley 1474 de 2011 ordena que todas las entidades públicas cuenten con un espacio en su página web principal para que los ciudadanos presenten quejas y denuncias de los actos de corrupción realizados por funcionarios de la entidad.", true]]}, {"id": "AC-109", "niv": 3, "e": "Si Tomás decidiera no denunciar las transferencias que conoció en razón de su cargo, esa omisión", "f": "Ley 1952 de 2019, art. 61, num. 3", "o": [["A", "solo podría calificarse como falta leve, porque no fue él quien se apropió de los recursos.", "La ley califica como gravísima la omisión de denunciar delitos dolosos conocidos en razón del cargo; no la reduce a falta leve por el hecho de no haber participado en la apropiación.", false], ["B", "podría constituir falta gravísima, porque la ley sanciona omitir la denuncia de delitos dolosos conocidos en razón del cargo.", "El numeral 3 del artículo 61 de la Ley 1952 de 2019 establece como falta gravísima omitir o retardar la denuncia de faltas gravísimas o delitos dolosos, preterintencionales o culposos investigables de oficio de que se tenga conocimiento en razón del cargo o función.", true], ["C", "no tendría consecuencias disciplinarias, porque denunciar es una facultad de los ciudadanos y no un deber del servidor.", "Para el servidor público, denunciar es un deber expreso (art. 38 num. 25 de la Ley 1952 de 2019), y su omisión puede acarrear responsabilidad disciplinaria.", false]]}]}, {"comp": "anticorrupcion", "rol": "general", "tag": "Estatuto Anticorrupción y transparencia · Impedimentos y recusaciones en la actuación administrativa", "texto": "Paula es profesional universitaria de la secretaría de tránsito de un municipio y debe resolver varios trámites. En el primero, el solicitante es el hermano de su esposo, quien pide la devolución de un vehículo inmovilizado. En el segundo, la interesada es su prima hermana, que solicita la prescripción de unas multas. Paula no tiene ningún interés económico en esos asuntos y considera que podría decidirlos con total imparcialidad. Antes de actuar, consulta con la oficina jurídica qué debe hacer.", "items": [{"id": "AC-126", "niv": 1, "e": "Respecto del trámite del hermano de su esposo, Paula", "f": "Ley 1437 de 2011 (CPACA), art. 11, num. 1", "o": [["A", "debe declararse impedida, porque él es su pariente en segundo grado de afinidad.", "El numeral 1 del artículo 11 del CPACA prevé como causal de impedimento el interés particular y directo del servidor, de su cónyuge o compañero permanente, o de sus parientes dentro del cuarto grado de consanguinidad, segundo de afinidad o primero civil. El hermano del cónyuge es pariente en segundo grado de afinidad.", true], ["B", "puede decidirlo, porque los parientes por afinidad no generan causal de impedimento.", "La causal comprende expresamente a los parientes hasta el segundo grado de afinidad, entre los que está el hermano del cónyuge.", false], ["C", "puede decidirlo, siempre que deje constancia escrita de que actuará con imparcialidad.", "La causal de impedimento es objetiva: la convicción de imparcialidad o una constancia escrita no permiten al servidor seguir conociendo el asunto.", false]]}, {"id": "AC-127", "niv": 2, "e": "En el trámite que adelanta su prima hermana, Paula", "f": "Ley 1437 de 2011 (CPACA), art. 11, num. 1", "o": [["A", "debe declararse impedida, porque la prima hermana es pariente en cuarto grado de consanguinidad.", "El numeral 1 del artículo 11 del CPACA incluye a los parientes dentro del cuarto grado de consanguinidad. Los primos hermanos están en ese grado: hay dos grados hasta el abuelo común y dos más hasta la prima.", true], ["B", "puede actuar, porque las causales de impedimento solo cubren hasta el segundo grado de consanguinidad.", "Para la consanguinidad, la causal llega hasta el cuarto grado, no solo hasta el segundo.", false], ["C", "puede actuar, porque las primas no se consideran parientes para efectos del régimen de impedimentos.", "Los primos hermanos son parientes en cuarto grado de consanguinidad y están comprendidos en la causal.", fa ", "items": [{"id": "CO-170", "niv": 1, "e": "Frente a los registros duplicados, lo que refleja el nivel D de Pensamiento conceptual es", "f": "Diccionario de Competencias Comportamentales PGN, Pensamiento conceptual, nivel D", "o": [["A", "reportar cada duplicado a la mesa de ayuda para que la Oficina de Tecnología lo corrija.", "Traslada el problema sin comprenderlo ni buscarle solución; el nivel D pide analizar la información y establecer mecanismos de solución.", false], ["B", "analizar por qué se duplican los registros y fijar un mecanismo sencillo para evitarlo en su propio registro.", "El nivel D de Pensamiento conceptual (comprender problemas de baja complejidad necesarios para cumplir sus funciones) incluye analizar la información disponible y establecer mecanismos de solución para el desarrollo de sus funciones.", true], ["C", "elaborar un concepto técnico para la dependencia sobre las fallas del sistema de información.", "Realizar conceptos que aclaran situaciones y problemas es una conducta de los niveles B y C, superior al nivel D exigido.", false]]}, {"id": "CO-171", "niv": 2, "e": "Ante el nuevo duplicado con el mismo origen, lo coherente con el nivel D de Pensamiento conceptual es", "f": "Diccionario de Competencias Comportamentales PGN, Pensamiento conceptual, nivel D", "o": [["A", "volver a analizar el problema desde cero, por si las causas cambiaron.", "El caso ya muestra el mismo origen; repetir el análisis completo no corresponde a la conducta de aplicar las soluciones generadas.", false], ["B", "aplicar la solución que ya había generado para ese tipo de duplicado.", "Una de las conductas del nivel D de Pensamiento conceptual es ejecutar sus labores aplicando soluciones que ha generado para el desarrollo de sus actividades en los casos en que se requiera.", true], ["C", "escalar el caso a su jefe para que decida cómo proceder esta vez.", "Desaprovecha la solución que ya existe; el nivel D incluye aplicar las soluciones que el servidor ha generad const CFG = {"titulo": "Simulacro 3 · Técnico, administrativo y operativo · Procuraduría 2027", "modo": "simulacro", "minutos": 205, "componentes": {"estructura_pgn": "Estructura y funciones de la Procuraduría", "gestion_publica": "Gestión pública y funcionamiento del Estado", "atencion_usuario": "Atención al usuario", "gestion_documental": "Gestión documental", "documentos_oficina": "Elaboración de documentos de oficina", "ofimatica": "Herramientas ofimáticas", "sistemas_gestion": "Sistemas de gestión (MIPG, control interno y calidad)", "disciplinario": "Código General Disciplinario", "contratacion": "Contratación estatal", "anticorrupcion": "Estatuto Anticorrupción y transparencia", "comportamental": "Competencias comportamentales (Diccionario de la Procuraduría)"}, "niveles": {"1": "Básico", "2": "Intermedio", "3": "Avanzado"}, "roles": {"general": "Todos los niveles", "tecnico": "Niveles técnico, administrativo y operativo", "profesional": "Niveles profesional, asesor y ejecutivo"}, "clave": "tecnico-03.html"};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY = 'sim-pgn:' + CFG.clave;
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}
function save(){try{localStorage.setItem(KEY, JSON.stringify(ST))}catch(e){}}
let ST = load();
ST.r = ST.r || {};
$('#tit').textContent = CFG.titulo;
const ITEMS = [];
DATA.forEach(c => c.items.forEach(it => { it.caso = c; ITEMS.push(it); }));

function justHTML(it){
  return '<div class="just">' + it.o.map(o => `<div><b>${o[0]}.</b> <span class="${o[3]?'okt':'not'}">${o[3]?'Es correcta.':'Es incorrecta.'}</span> ${esc(o[2])}</div>`).join('') +
    `<div class="src">Referencia: ${esc(it.f)}</div></div>`;
}
function itemHTML(it, n, mode){
  const r = ST.r[it.id];
  const reveal = mode === 'review' || (CFG.modo === 'practica' && r);
  let h = `<div class="item" id="i-${it.id}"><p class="enun"><span class="n">${n}.</span> <span class="niv">${CFG.niveles[it.niv]}</span> ${esc(it.e)}</p>`;
  it.o.forEach(o => {
    let cls = '';
    if (reveal) { if (o[3]) cls = 'ok'; else if (r === o[0]) cls = 'no'; }
    else if (r === o[0]) cls = 'sel';
    h += `<button class="op ${cls}" data-id="${it.id}" data-l="${o[0]}" ${reveal?'disabled':''}><span class="l">${o[0]}.</span><span>${esc(o[1])}</span></button>`;
  });
  if (reveal) {
    if (mode === 'review') h += `<div class="${r===keyOf(it)?'res-ok':'res-no'}" style="font-size:14px;margin-top:4px">${r ? (r===keyOf(it)?'Respondiste ' + r + ': correcto.':'Respondiste ' + r + '. La respuesta correcta es ' + keyOf(it) + '.') : 'Sin responder. La respuesta correcta es ' + keyOf(it) + '.'}</div>`;
    h += justHTML(it);
  }
  return h + '</div>';
}
const keyOf = it => it.o.find(o => o[3])[0];

function renderList(list, mode){
  let h = '', last = null, n = 0;
  list.forEach(it => {
    n++;
    if (it.caso !== last) { last = it.caso; h += `<div class="caso"><div class="tag">${esc(it.caso.tag)}</div><p>${esc(it.caso.texto)}</p></div>`; }
    h += itemHTML(it, n, mode);
  });
  return h;
}

let LIST = [];
let FILTRO = ST.f || {comp:'', niv:'', rol:''};
function practica(){
  const comps = Object.entries(CFG.componentes).map(([k,v]) => `<option value="${k}" ${FILTRO.comp===k?'selected':''}>${esc(v)}</option>`).join('');
  const nivs = Object.entries(CFG.niveles).map(([k,v]) => `<option value="${k}" ${FILTRO.niv===k?'selected':''}>${esc(v)}</option>`).join('');
  const list = ITEMS.filter(it => (!FILTRO.comp || it.caso.comp===FILTRO.comp) && (!FILTRO.niv || String(it.niv)===FILTRO.niv) && (!FILTRO.rol || it.caso.rol===FILTRO.rol || it.caso.rol==='general'));
  const resp = list.filter(it => ST.r[it.id]); const ok = resp.filter(it => ST.r[it.id]===keyOf(it));
  $('#main').innerHTML = `<div class="panel"><p style="margin-top:0">Elige un tema, tu nivel de empleo y la dificultad. Al responder verás de inmediato si acertaste y la explicación de cada opción.</p>
  <div class="row"><select id="fc"><option value="">Todos los temas</option>${comps}</select>
  <select id="fn"><option value="">Todas las dificultades</option>${nivs}</select>
  <select id="fr"><option value="">Todos los niveles de empleo</option>${['tecnico','profesional'].map(k => `<option value="${k}" ${FILTRO.rol===k?'selected':''}>${esc(CFG.roles[k])} (y temas comunes)</option>`).join('')}</select>
  <button class="btn sec" id="borrar">Borrar mis respuestas</button></div>
  <p class="stat" id="pst" style="margin-bottom:0">${list.length} preguntas · respondidas ${resp.length} · aciertos ${ok.length}${resp.length? ' (' + Math.round(100*ok.length/resp.length) + ' %)':''}</p></div>` + renderList(list, 'practica');
  $('#prog').textContent = `${ok.length}/${resp.length} aciertos`;
  ['fc','fn','fr'].forEach((id,i) => $('#'+id).onchange = e => { FILTRO[['comp','niv','rol'][i]] = e.target.value; ST.f = FILTRO; save(); practica(); });
  LIST = list;
  $('#borrar').onclick = () => { list.forEach(it => delete ST.r[it.id]); save(); practica(); };
}

// ---------- SIMULACRO ----------
let tick = null;
function inicio(){
  const n = ITEMS.length, cnt = {};
  ITEMS.forEach(it => cnt[it.caso.comp] = (cnt[it.caso.comp]||0) + 1);
  const h = Math.floor(CFG.minutos/60), m = CFG.minutos%60;
  $('#main').innerHTML = `<div class="panel"><h2 style="margin-top:0;color:var(--pri)">Instrucciones</h2>
  <p>Este simulacro tiene <b>${n} preguntas</b> en formato de caso: una situación, enunciados que se completan y tres opciones con una sola respuesta correcta.</p>
  <table>${Object.entries(cnt).map(([k,v]) => `<tr><td>${esc(CFG.componentes[k])}</td><td class="r">${v}</td></tr>`).join('')}</table>
  <p>Tiempo sugerido: <b>${h ? h + ' h ' : ''}${m ? m + ' min' : ''}</b> (unos ${Math.round(CFG.minutos*60/n/6)/10} minutos por pregunta). Cuando se acaba el tiempo puedes seguir, pero el cronómetro lo indica.</p>
  <p>Tus respuestas se guardan en este navegador. Al terminar verás tu puntaje por componente y por dificultad, y la explicación de cada pregunta.</p>
  <button class="btn" id="go">${ST.t0 ? 'Continuar el simulacro' : 'Comenzar'}</button></div>`;
  $('#prog').textContent = `${n} preguntas`;
  $('#go').onclick = () => { if (!ST.t0) { ST.t0 = Date.now(); save(); } examen(); };
}
function reloj(){
  const rest = CFG.minutos*60 - Math.floor((Date.now() - ST.t0)/1000);
  const a = Math.abs(rest), hh = Math.floor(a/3600), mm = Math.floor(a%3600/60), ss = a%60;
  const t = (rest < 0 ? '+' : '') + (hh ? hh + ':' : '') + String(mm).padStart(2,'0') + ':' + String(ss).padStart(2,'0');
  $('#timer').textContent = rest < 0 ? 'Tiempo cumplido ' + t : '⏱ ' + t;
  $('#timer').classList.toggle('low', rest < 600);
}
function examen(){
  $('#main').innerHTML = renderList(ITEMS, 'examen') + `<div class="panel"><button class="btn" id="fin">Terminar y calificar</button></div>`;
  progreso(); reloj(); clearInterval(tick); tick = setInterval(reloj, 1000);
  $('#fin').onclick = () => {
    const faltan = ITEMS.length - Object.keys(ST.r).filter(k => ITEMS.some(i => i.id===k)).length;
    $('#mtxt').textContent = faltan ? `Te faltan ${faltan} preguntas por responder. ¿Quieres calificar de todos modos?` : '¿Quieres terminar y ver tu calificación?';
    $('#modal').classList.remove('hide');
  };
}
function progreso(){
  const r = ITEMS.filter(it => ST.r[it.id]).length;
  $('#prog').textContent = `Respondidas ${r}/${ITEMS.length}`;
}
$('#mno').onclick = () => $('#modal').classList.add('hide');
$('#msi').onclick = () => { $('#modal').classList.add('hide'); ST.fin = Date.now(); save(); resultados(); };
function resultados(){
  clearInterval(tick);
  const ok = ITEMS.filter(it => ST.r[it.id] === keyOf(it)).length;
  const pct = Math.round(1000*ok/ITEMS.length)/10;
  const g = (fn, lab) => { const m = {}; ITEMS.forEach(it => { const k = fn(it); m[k] = m[k] || [0,0]; m[k][1]++; if (ST.r[it.id]===keyOf(it)) m[k][0]++; });
    return Object.entries(m).map(([k,v]) => `<tr><td>${esc(lab(k))}</td><td class="r">${v[0]}/${v[1]}</td><td class="r">${Math.round(100*v[0]/v[1])} %</td></tr>`).join(''); };
  const mins = Math.round(((ST.fin||Date.now()) - ST.t0)/60000);
  $('#timer').textContent = `Tiempo usado: ${Math.floor(mins/60) ? Math.floor(mins/60) + ' h ' : ''}${mins%60} min`;
  $('#prog').textContent = `${ok}/${ITEMS.length} aciertos`;
  $('#main').innerHTML = `<div class="panel"><div class="big">${String(pct).replace('.',',')} %</div>
  <p style="margin-top:4px">${ok} de ${ITEMS.length} respuestas correctas. ${pct >= 75 ? 'Muy buen resultado: repasa las explicaciones de tus errores para afianzarlo.' : pct >= 65 ? 'Vas bien, pero con poco margen: refuerza los componentes con menor porcentaje.' : 'Todavía no estás en zona segura: practica por tema los componentes con menor porcentaje.'}</p>
  <p class="aviso">Referencia: en el concurso de la Procuraduría la prueba de conocimientos es eliminatoria con mínimo de 65 puntos sobre 100, y la comportamental es clasificatoria. Este porcentaje de aciertos es una guía de preparación; la calificación oficial usa una escala estándar que compara a los aspirantes.</p>
  <h3>Por componente</h3><table>${g(it => it.caso.comp, k => CFG.componentes[k])}</table>
  <h3>Por dificultad</h3><table>${g(it => it.niv, k => CFG.niveles[k])}</table>
  <div class="row" style="margin-top:14px"><button class="btn" id="solo">Ver solo mis errores</button><button class="btn sec" id="todas">Ver todas</button><button class="btn sec" id="otra">Reiniciar el simulacro</button></div></div><div id="rev"></div>`;
  const rev = errs => { const l = errs ? ITEMS.filter(it => ST.r[it.id] !== keyOf(it)) : ITEMS; $('#rev').innerHTML = renderList(l, 'review'); };
  rev(true);
  $('#solo').onclick = () => rev(true); $('#todas').onclick = () => rev(false);
  $('#otra').onclick = () => { ST = {r:{}}; save(); inicio(); window.scrollTo(0,0); };
}

document.addEventListener('click', e => {
  const b = e.target.closest('button.op'); if (!b || b.disabled) return;
  ST.r[b.dataset.id] = b.dataset.l; save();
  const it = ITEMS.find(i => i.id === b.dataset.id);
  const n = b.closest('.item').querySelector('.n').textContent.replace('.','');
  b.closest('.item').outerHTML = itemHTML(it, n, CFG.modo === 'practica' ? 'practica' : 'examen');
  if (CFG.modo === 'practica') { const resp = LIST.filter(i => ST.r[i.id]); const ok = resp.filter(i => ST.r[i.id]===keyOf(i)).length; $('#prog').textContent = `${ok}/${resp.length} aciertos`; $('#pst').textContent = `${LIST.length} preguntas · respondidas ${resp.length} · aciertos ${ok} (${Math.round(100*ok/resp.length)} %)`; }
  else progreso();
});

if (CFG.modo === 'practica') practica();
else if (ST.fin) resultados();
else if (ST.t0) examen();
else inicio();
</script>
</body>
</html>
