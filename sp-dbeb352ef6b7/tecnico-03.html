unicipal, nos recibió a las 9:00 am. Para llegar recorrimos 25 Kms. por carretera destapada. En la visita se revisó el quince % de los expedientes de contratación». El jefe le pide corregir la escritura de las abreviaturas, los símbolos y las cifras antes de enviar el informe, conforme a las normas ortográficas de la Real Academia Española.", "items": [{"id": "DO-137", "niv": 1, "e": "La abreviatura de «señora» debe escribirse", "f": "RAE, Ortografía de la lengua española y Libro de estilo: abreviaturas y símbolos (ver notas-do.md)", "o": [["A", "«Sra.», con punto final.", "La RAE señala que las abreviaturas se escriben con punto abreviativo; a diferencia de los símbolos, no se escriben sin él.", true], ["B", "«Sra», sin punto, porque va seguida del apellido.", "Las abreviaturas se cierran con punto, con independencia de la palabra que las siga (RAE, Ortografía).", false], ["C", "«SRA.», en mayúscula sostenida, por tratarse de un tratamiento.", "Los tratamientos abreviados se escriben con mayúscula inicial y el resto en minúscula (Sra., Sr., Dr.); la mayúscula sostenida no corresponde (RAE).", false]]}, {"id": "DO-138", "niv": 2, "e": "La hora de la reunión debe escribirse", "f": "RAE, Ortografía de la lengua española y Libro de estilo: abreviaturas y símbolos (ver notas-do.md)", "o": [["A", "«9:00 A.M.», en mayúsculas y sin espacio.", "La abreviatura se escribe en minúscula y con espacio entre sus elementos: «a. m.» (RAE).", false], ["B", "«9:00 am», sin puntos ni espacio.", "«a. m.» es una abreviatura de la expresión latina ante meridiem; como abreviatura, lleva punto y espacio entre sus componentes (RAE).", false], ["C", "«9:00 a. m.», con punto tras cada letra y un espacio entre ellas.", "La RAE recoge «a. m.» como abreviatura de ante meridiem y señala que en las abreviaturas de varios elementos se deja un espacio entre ellos.", true]]}, {"id": "DO-139", "niv": 2, "e": "La distancia recorrida debe escribirse", "f": "RAE, Ortografía de la lengua española y Libro de estilo: abreviaturas y símbolos (ver notas-do.md)", "o": [["A", "«25 kms.», con s de plural y punto abreviativo.", "Los símbolos no llevan punto ni marca de plural: se escribe 25 km, no 25 kms. (RAE, Libro de estilo).", false], ["B", "«25 km», sin punto, sin plural y en minúscula.", "Según la RAE, los símbolos se escriben sin punto, no varían en plural y los de unidades de medida van en minúscula; además se separan de la cifra con un espacio.", true], ["C", "«25 Km.», con mayúscula inicial por ser una unidad del sistema internacional.", "El símbolo del kilómetro es «km», en minúscula y sin punto; solo van en mayúscula los símbolos derivados de nombres propios y los prefijos desde mega- (RAE).", false]]}, {"id": "DO-140", "niv": 3, "e": "La expresión del porcentaje queda correctamente escrita así", "f": "RAE, Ortografía de la lengua española y Libro de estilo: abreviaturas y símbolos (ver notas-do.md)", "o": [["A", "«el 15% de los expedientes», con el símbolo pegado a la cifra.", "Aunque es frecuente verlo pegado, la RAE indica que el símbolo % se separa de la cifra con un espacio, como el resto de los símbolos.", false], ["B", "«el 15 % de los expedientes», con un espacio entre la cifra y el símbolo.", "La RAE recomienda escribir el porcentaje con cifras y el símbolo % separado por un espacio (el 15 %), o enteramente con palabras (el quince por ciento); no se combina el símbolo con números en letras.", true], ["C", "«el quince % de los expedientes», porque el símbolo puede acompañar a números escritos en letras.", "La RAE indica que el símbolo % solo se emplea cuando el porcentaje se escribe con cifras; «el quince %» es incorrecto.", false]]}]}, {"comp": "ofimatica", "rol": "tecnico", "tag": "Herramientas ofimáticas · Niveles técnico, administrativo y operativo · SUMAR.SI y SUMAR.SI.CONJUNTO", "texto": "Usted es técnico administrativo del área financiera de una procuraduría regional y consolida los viáticos pagados en el mes. En A2:A7 está la ciudad de la comisión, en B2:B7 el concepto y en C2:C7 el valor pagado: fila 2, Bogotá, Transporte, 350.000; fila 3, Cali, Alojamiento, 420.000; fila 4, Bogotá, Alojamiento, 510.000; fila 5, Medellín, Transporte, 280.000; fila 6, Bogotá, Transporte, 190.000; fila 7, Cali, Transporte, 260.000.", "items": [{"id": "OF-107", "niv": 1, "e": "La fórmula =SUMAR.SI(A2:A7;\"Bogotá\";C2:C7) devuelve", "f": "Microsoft Support, «Función SUMAR.SI»", "o": [["A", "$540.000.", "Es la suma de Bogotá solo por transporte. La fórmula tiene un único criterio (la ciudad), por lo que también suma el alojamiento de Bogotá.", false], ["B", "$1.050.000.", "SUMAR.SI suma los valores de C2:C7 cuyas filas tienen «Bogotá» en A2:A7: 350.000 + 510.000 + 190.000 = 1.050.000.", true], ["C", "$1.080.000.", "Es el total del concepto «Transporte» en todas las ciudades. El criterio de la fórmula se evalúa sobre las ciudades (A2:A7), no sobre los conceptos.", false]]}, {"id": "OF-108", "niv": 2, "e": "La fórmula =SUMAR.SI.CONJUNTO(C2:C7;A2:A7;\"Bogotá\";B2:B7;\"Transporte\") devuelve", "f": "Microsoft Support, «Función SUMAR.SI.CONJUNTO»", "o": [["A", "$350.000.", "Toma solo la primera fila que cumple los criterios. SUMAR.SI.CONJUNTO suma todas las filas que cumplen ambos criterios (filas 2 y 6).", false], ["B", "$540.000.", "Suma los valores de C2:C7 de las filas con «Bogotá» y «Transporte» a la vez: 350.000 + 190.000 = 540.000.", true], ["C", "$1.050.000.", "Aplica solo el criterio de ciudad. El segundo par de rango y criterio excluye el alojamiento de Bogotá (510.000).", false]]}, {"id": "OF-109", "niv": 2, "e": "Para sumar solo el transporte pagado en Cali, la fórmula escrita correctamente es", "f": "Microsoft Support, «Función SUMAR.SI.CONJUNTO» (sección «Comprenda la diferencia entre SUMAR.SI y SUMAR.SI.CONJUNTO»)", "o": [["A", "=SUMAR.SI.CONJUNTO(C2:C7;A2:A7;\"Cali\";B2:B7;\"Transporte\").", "En SUMAR.SI.CONJUNTO el rango que se suma va primero y luego los pares de rango y criterio. Microsoft advierte que este orden es distinto del de SUMAR.SI, donde el rango de suma va de último.", true], ["B", "=SUMAR.SI(A2:A7;\"Cali\";B2:B7;\"Transporte\";C2:C7).", "SUMAR.SI admite un solo criterio (rango; criterio; [rango_suma]). Para dos condiciones se requiere SUMAR.SI.CONJUNTO.", false], ["C", "=SUMAR.SI.CONJUNTO(A2:A7;\"Cali\";B2:B7;\"Transporte\";C2:C7).", "Usa el orden de SUMAR.SI. En SUMAR.SI.CONJUNTO el primer argumento es el rango_suma (C2:C7), seguido de los pares de rango y criterio.", false]]}]}, {"comp": "ofimatica", "rol": "general", "tag": "Herramientas ofimáticas · Validación de datos, formato condicional y filtros", "texto": "Usted es técnico de una procuraduría distrital y administra la hoja compartida de seguimiento de solicitudes. Detectó tres problemas: los compañeros escriben el estado de cada solicitud de formas distintas («pendiente», «Pend.», «en trámite»); el jefe quiere ver resaltadas en rojo, de forma automática, las solicitudes con más de 10 días sin respuesta; y la coordinadora necesita ver solo las filas de una dependencia, sin borrar ni mover las demás.", "items": [{"id": "OF-128", "niv": 1, "e": "Para que el estado se registre de manera uniforme, la herramienta adecuada es", "f": "Microsoft Support, «Aplicar validación de datos a celdas» y «Crear una lista desplegable»", "o": [["A", "la protección de la hoja con contraseña, para bloquear la columna de estado.", "Proteger la hoja impediría que los compañeros registren el estado; no ofrece una lista de valores válidos.", false], ["B", "el formato condicional, para colorear los estados mal escritos.", "El formato condicional solo cambia la apariencia según una regla; no impide que se escriban valores distintos.", false], ["C", "la validación de datos con una lista de valores permitidos en la columna de estado.", "La validación de datos restringe lo que se puede escribir en una celda; con la opción Lista se ofrece un desplegable con los estados válidos y se rechazan los demás.", true]]}, {"id": "OF-129", "niv": 1, "e": "Para resaltar automáticamente las solicitudes con más de 10 días, debe usarse", "f": "Microsoft Support, «Utilice el formato condicional para resaltar la información en Excel»", "o": [["A", "una ordenación descendente de la columna de días.", "Ordenar cambia la posición de las filas, pero no resalta ninguna ni distingue las que superan los 10 días.", false], ["B", "una validación de datos con alerta de error de estilo Detener.", "La validación controla lo que se escribe, no da formato a las celdas que cumplen una condición.", false], ["C", "un formato condicional con una regla sobre la columna de días.", "El formato condicional aplica formato (como relleno rojo) a las celdas que cumplen una regla, por ejemplo valores mayores que 10, y se actualiza al cambiar los datos.", true]]}, {"id": "OF-130", "niv": 2, "e": "Para atender la necesidad de la coordinadora, lo adecuado es", "f": "Microsoft Support, «Filtrar datos en un rango o tabla»; «Usar las segmentaciones para filtrar datos»", "o": [["A", "aplicar un filtro a la columna de dependencia y elegir la que necesita.", "El filtro oculta temporalmente las filas que no cumplen el criterio, sin borrarlas ni moverlas, y se puede quitar para volver a ver todos los datos.", true], ["B", "ordenar la tabla por dependencia, con lo cual se ocultan las filas de las demás.", "Ordenar reorganiza las filas (las mueve), pero no oculta ninguna; todas siguen visibles.", false], ["C", "crear una tabla dinámica que reemplace los datos originales por los de esa dependencia.", "La tabla dinámica resume datos en otro lugar y no reemplaza la hoja de origen; además, la coordinadora necesita ver las filas, no un resumen.", false]]}]}, {"comp": "ofimatica", "rol": "general", "tag": "Herramientas ofimáticas · PowerPoint: patrón de diapositivas y vista Moderador", "texto": "Usted prepara una presentación de 25 diapositivas para la rendición de cuentas de una procuraduría regional. Debe incluir el logotipo institucional y la misma fuente en todas las diapositivas, y quiere tener a la vista sus apuntes durante la exposición sin que el público los vea. Una compañera le entregó la versión del año anterior, en la que usted no logra borrar, desde la vista Normal, una imagen que aparece en todas las diapositivas.", "items": [{"id": "OF-149", "niv": 1, "e": "Para que el logotipo y la fuente queden en todas las diapositivas, lo más eficiente es", "f": "Microsoft Support, «¿Qué es un patrón de diapositivas en PowerPoint?»", "o": [["A", "insertar el logotipo en la primera diapositiva y duplicarla para crear las demás.", "Duplicar copia el contenido actual, pero cualquier cambio posterior del logotipo o la fuente tendría que hacerse diapositiva por diapositiva.", false], ["B", "pegar el logotipo en cada diapositiva desde la vista Normal y cambiar la fuente una por una.", "Funciona, pero es lento y propenso a inconsistencias; el patrón aplica el formato a todas de una vez.", false], ["C", "insertar el logotipo y definir la fuente en el patrón de diapositivas.", "Microsoft explica que los cambios hechos en el patrón de diapositivas se reflejan en todas las diapositivas basadas en él, como fuentes e imágenes (logotipos).", true]]}, {"id": "OF-150", "niv": 2, "e": "La imagen que no se puede borrar desde la vista Normal probablemente", "f": "Microsoft Support, «¿Qué es un patrón de diapositivas en PowerPoint?»", "o": [["A", "está en el patrón de diapositivas o en un diseño, y se quita desde esa vista.", "Microsoft señala que, si un elemento no se puede editar en la vista Normal, puede deberse a que está definido en el patrón o en un diseño; para editarlo hay que pasar a la vista Patrón de diapositivas.", true], ["B", "es una marca de agua del tema, que PowerPoint no permite quitar.", "Los elementos del tema y del patrón se pueden editar o quitar desde la vista Patrón de diapositivas.", false], ["C", "está protegida con una contraseña que solo conoce la autora del archivo.", "Las contraseñas protegen la apertura o modificación del archivo completo, no una imagen concreta de las diapositivas.", false]]}, {"id": "OF-151", "niv": 2, "e": "Para consultar sus apuntes durante la exposición sin que el público los vea, debe", "f": "Microsoft Support, «Iniciar la presentación y ver las notas en la vista Moderador»", "o": [["A", "escribirlos en cuadros de texto con fuente blanca sobre el fondo de cada diapositiva.", "Ese texto forma parte de la diapositiva proyectada y puede verse o seleccionarse; no es un espacio reservado al expositor.", false], ["B", "escribirlos en el patrón de diapositivas, que el público no ve durante la presentación.", "Lo que se pone en el patrón aparece en todas las diapositivas proyectadas; no está oculto al público.", false], ["C", "escribirlos en el panel de notas y presentar con la vista Moderador.", "La vista Moderador muestra al expositor, en su pantalla, las notas y la diapositiva siguiente, mientras el público solo ve la diapositiva en curso.", true]]}]}, {"comp": "ofimatica", "rol": "general", "tag": "Herramientas ofimáticas · Seguridad de la información en ofimática", "texto": "Usted es profesional universitario de la Oficina de Control Interno de la Procuraduría. Recibe un correo firmado por «Mesa de Ayuda TI», enviado desde un dominio parecido al institucional pero con una letra cambiada, que le advierte que su cuenta se bloqueará en dos horas si no confirma su usuario y contraseña en un vínculo. Ese mismo día debe compartir para revisión, con una contratista externa, un informe preliminar con información reservada guardado en su OneDrive institucional. Además, un compañero que sale a vacaciones le pide que use su usuario y contraseña para responder sus correos pendientes.", "items": [{"id": "OF-152", "niv": 1, "e": "Frente al correo de la supuesta mesa de ayuda, usted debe", "f": "Microsoft Support, «Suplantación de identidad (phishing) y comportamiento sospechoso en Outlook»", "o": [["A", "responder al remitente para pedir que confirme si el mensaje es auténtico antes de ingresar los datos.", "Responder confirma al atacante que la cuenta está activa; la verificación debe hacerse por un canal oficial distinto del mensaje sospechoso.", false], ["B", "no abrir el vínculo ni responder, y reportar el mensaje como suplantación por el canal institucional.", "Es un intento típico de suplantación (phishing). Lo adecuado es no interactuar con el vínculo ni entregar credenciales y reportarlo (por ejemplo, con la opción de informar de phishing o al área de tecnología).", true], ["C", "abrir el vínculo desde su celular personal, fuera de la red institucional, para comprobar si es legítimo.", "Abrir el vínculo desde otro dispositivo no elimina el riesgo de robo de credenciales ni de descarga de código malicioso.", false]]}, {"id": "OF-153", "niv": 1, "e": "Del mensaje recibido, la señal más clara de suplantación es", "f": "Microsoft, «¿Qué es el correo electrónico de suplantación de identidad (phishing)?» (microsoft.com/es-co/security)", "o": [["A", "la combinación de urgencia, solicitud de la contraseña y un dominio que imita el institucional.", "Microsoft señala como alertas de phishing las direcciones parecidas a las reales con pequeñas diferencias, el lenguaje urgente o amenazante y las solicitudes de ingresar datos en vínculos.", true], ["B", "que esté redactado en español formal y sin errores de ortografía.", "La buena redacción no es indicio de fraude; muchos mensajes de suplantación están bien escritos.", false], ["C", "que lo envíe una mesa de ayuda, porque esas áreas no escriben a los usuarios.", "Las mesas de ayuda sí envían comunicaciones; lo sospechoso es el dominio alterado y la petición urgente de la contraseña.", false]]}, {"id": "OF-154", "niv": 3, "e": "Para compartir el informe con la contratista desde OneDrive, la opción más segura es", "f": "Microsoft Learn, «Cómo funcionan los vínculos que se pueden compartir en OneDrive y SharePoint en Microsoft 365»; Microsoft Support, «Uso compartido de archivos o carpetas de SharePoint»", "o": [["A", "un vínculo para personas de la organización, que da acceso a externos mientras no se reenvíe.", "Ese vínculo solo funciona para personas de la organización; no sirve para invitados externos.", false], ["B", "un vínculo para cualquier persona que lo tenga, porque la contratista no pertenece a la organización.", "Los vínculos «Cualquiera» no exigen autenticación, se pueden reenviar y su acceso no se puede auditar; Microsoft recomienda evitarlos salvo necesidad.", false], ["C", "un vínculo para personas específicas, con permiso de solo lectura, dirigido al correo de la contratista.", "El vínculo de personas específicas (en OneDrive, «Personas específicas» o «Solo las personas que usted elija») solo funciona para quien se indica, exige que se autentique y no sirve si se reenvía a otra persona; sirve también con personas externas, si la política de uso compartido de la entidad lo permite.", true]]}, {"id": "OF-155", "niv": 2, "e": "Frente a la solicitud del compañero que sale a vacaciones, lo correcto es", "f": "Microsoft Support, «Permitir que otra persona administre su correo y calendario» (acceso de delegado en Outlook)", "o": [["A", "aceptar, si el jefe inmediato autoriza por correo el uso compartido de la contraseña.", "La autorización del jefe no vuelve personal una credencial ajena; las acciones seguirían quedando registradas a nombre del compañero.", false], ["B", "no usar credenciales ajenas y pedir que tecnología le conceda acceso delegado al buzón.", "Las credenciales son personales e intransferibles: usarlas impide saber quién hizo cada acción. Outlook y Microsoft 365 permiten conceder acceso de delegado al buzón con permisos propios.", true], ["C", "aceptar, siempre que él cambie la contraseña cuando regrese.", "Cambiar después la contraseña no corrige que, mientras tanto, otra persona actúe con una identidad ajena sin trazabilidad.", false]]}]}, {"comp": "sistemas_gestion", "rol": "tecnico", "tag": "Sistemas de gestión (MIPG, control interno y calidad) · Niveles técnico, administrativo y operativo · Identificación y análisis del riesgo", "texto": "Usted es técnico de la Oficina de Planeación de una entidad territorial que aplica la Guía para la Gestión Integral del Riesgo en Entidades Públicas (versión 7) de la Función Pública. Apoya al líder del proceso de gestión documental en el mapa de riesgos. El préstamo de expedientes se realiza unas 300 veces al año. Uno de los riesgos quedó redactado así: «Posibilidad de afectación económica por pérdida de expedientes debido a la ausencia de registro y control en el préstamo documental». Si se materializa, la afectación económica estimada es de 120 SMLMV.", "items": [{"id": "SG-125", "niv": 2, "e": "En esa redacción, la causa raíz del riesgo es", "f": "Función Pública, Guía para la Gestión Integral del Riesgo en Entidades Públicas, versión 7 (2025), estructura para la redacción del riesgo", "o": [["A", "la falta de registro y control del préstamo.", "La guía propone redactar el riesgo con «Posibilidad de» + impacto + causa inmediata + causa raíz; la causa raíz es la razón de fondo, introducida aquí con «debido a».", true], ["B", "la pérdida de los expedientes prestados.", "Es la causa inmediata: la circunstancia visible que genera el impacto, pero no el origen de fondo del problema.", false], ["C", "la afectación económica que sufriría la entidad.", "Es el impacto, es decir, la consecuencia que se produciría si el riesgo se materializa.", false]]}, {"id": "SG-126", "niv": 2, "e": "Con la tabla de probabilidad de la guía, basada en la frecuencia de la actividad, la probabilidad inherente de este riesgo es", "f": "Función Pública, Guía para la Gestión Integral del Riesgo en Entidades Públicas, versión 7 (2025), tabla 4 (criterios para definir el nivel de probabilidad)", "o": [["A", "baja (40 %).", "La probabilidad baja corresponde a actividades que se ejecutan de 3 a 24 veces por año.", false], ["B", "media (60 %).", "La guía asigna probabilidad media (60 %) a las actividades que se ejecutan de 25 a 500 veces por año; el préstamo se hace unas 300 veces.", true], ["C", "alta (80 %).", "La probabilidad alta corresponde a actividades que se ejecutan más de 500 y hasta 5.000 veces por año.", false]]}, {"id": "SG-127", "niv": 2, "e": "Según la tabla de impacto económico de la guía, la afectación económica de 120 SMLMV corresponde al nivel", "f": "Función Pública, Guía para la Gestión Integral del Riesgo en Entidades Públicas, versión 7 (2025), tabla de criterios para definir el nivel de impacto", "o": [["A", "moderado (60 %).", "El nivel moderado corresponde a afectaciones mayores a 50 y hasta 100 SMLMV.", false], ["B", "mayor (80 %).", "La guía clasifica como impacto mayor (80 %) la afectación económica mayor a 100 y hasta 500 SMLMV; el riesgo está redactado como afectación económica.", true], ["C", "catastrófico (100 %).", "El nivel catastrófico corresponde a afectaciones mayores a 500 SMLMV.", false]]}]}, {"comp": "sistemas_gestion", "rol": "general", "tag": "Sistemas de gestión (MIPG, control interno y calidad) · Riesgos para la integridad pública", "texto": "Usted es auxiliar administrativo de la Oficina de Planeación de una entidad del orden departamental y apoya la identificación de riesgos para la integridad pública con base en la guía de riesgos de la Función Pública. En las mesas de trabajo surgen tres situaciones posibles: un supervisor de contratos participa en la evaluación de una propuesta presentada por la empresa de su hermano; un funcionario de ventanilla recibe dinero de un ciudadano para adelantarle el turno de un trámite; y un servidor de almacén registra en el inventario bienes que nunca ingresaron, con el fin de quedarse con el dinero de la compra.", "items": [{"id": "SG-131", "niv": 1, "e": "La situación del supervisor de contratos corresponde a la tipología de", "f": "Función Pública, Guía para la Gestión Integral del Riesgo en Entidades Públicas, versión 7 (2025), tipologías de riesgos para la integridad pública; Ley 1952 de 2019 (conflicto de intereses)", "o": [["A", "inadecuada gestión del conflicto de intereses.", "La guía lo describe como decidir en un asunto en el que el servidor, o un pariente dentro de los grados que señala la ley, tiene un interés particular y directo; un hermano está en segundo grado de consanguinidad.", true], ["B", "soborno.", "No hay oferta ni aceptación de una ventaja para que el servidor actúe; hay un interés particular de un pariente en el asunto que decide.", false], ["C", "fraude interno.", "El fraude interno se refiere a errores, omisiones o informes inexactos hechos con culpa o dolo para beneficio propio o de terceros; aquí lo central es el interés del pariente.", false]]}, {"id": "SG-132", "niv": 1, "e": "La situación del funcionario de ventanilla corresponde a la tipología de", "f": "Función Pública, Guía para la Gestión Integral del Riesgo en Entidades Públicas, versión 7 (2025), tipologías de riesgos para la integridad pública (soborno)", "o": [["A", "inadecuada gestión del conflicto de intereses.", "No hay un interés particular previo del servidor en el trámite; hay una ventaja indebida aceptada a cambio de una actuación.", false], ["B", "fraude interno.", "No se trata de registros o informes falseados por el servidor, sino de recibir un pago para favorecer a un ciudadano.", false], ["C", "soborno.", "La guía entiende el soborno como ofrecer, prometer, dar, aceptar o solicitar una ventaja indebida para que una persona actúe o se abstenga de actuar; el funcionario acepta dinero para alterar el turno.", true]]}, {"id": "SG-133", "niv": 2, "e": "La situación del servidor de almacén corresponde a la tipología de", "f": "Función Pública, Guía para la Gestión Integral del Riesgo en Entidades Públicas, versión 7 (2025), tipologías de riesgos para la integridad pública (fraude interno)", "o": [["A", "fraude interno.", "La guía describe el fraude interno como errores, omisiones, informes inexactos o descripciones incorrectas hechos con culpa o dolo para beneficio personal o de terceros, como registrar bienes que no ingresaron.", true], ["B", "soborno.", "No interviene un tercero que ofrezca una ventaja; el servidor falsea registros en su propio beneficio.", false], ["C", "inadecuada gestión del conflicto de intereses.", "No se trata de decidir un asunto en el que tenga interés particular, sino de alterar registros para apropiarse de recursos.", false]]}]}, {"comp": "sistemas_gestion", "rol": "general", "tag": "Sistemas de gestión (MIPG, control interno y calidad) · Nociones del SG-SST", "texto": "En una procuraduría provincial, un servidor nota que un cable eléctrico suelto atraviesa el pasillo del archivo. En la misma semana, durante una reunión, un compañero afirma que, si la entidad contrata con una empresa especializada la ejecución de actividades de seguridad y salud en el trabajo, la responsabilidad del sistema pasa a esa empresa. Otro pregunta en qué consiste el Sistema de Gestión de la Seguridad y Salud en el Trabajo (SG-SST).", "items": [{"id": "SG-146", "niv": 1, "e": "Frente al cable suelto, el servidor debe", "f": "Decreto 1072 de 2015, art. 2.2.4.6.10", "o": [["A", "esperar la inspección del comité paritario, que es el único facultado para reportar peligros.", "El reporte de peligros no es exclusivo del comité paritario; todos los trabajadores deben informarlos oportunamente.", false], ["B", "retirar el cable por su cuenta, sin reportarlo, para no generar trámites.", "Manipular la instalación sin reportar puede generar nuevos riesgos y deja al empleador sin información para corregir la condición insegura.", false], ["C", "informar oportunamente el peligro al empleador.", "El artículo 2.2.4.6.10 del Decreto 1072 de 2015 incluye entre las responsabilidades de los trabajadores informar oportunamente al empleador sobre los peligros y riesgos latentes en su sitio de trabajo.", true]]}, {"id": "SG-147", "niv": 3, "e": "Sobre lo que afirma el compañero, lo correcto es que", "f": "Decreto 1072 de 2015, arts. 2.2.4.6.4 y 2.2.4.6.42 (texto corregido por el Decreto 1528 de 2015, art. 2)", "o": [["A", "contratar esos servicios no traslada al contratista las responsabilidades del empleador.", "El artículo 2.2.4.6.42 del Decreto 1072 de 2015 dispone que esa contratación no implica el traslado de las responsabilidades del empleador al contratista.", true], ["B", "con el contrato, la empresa especializada asume la responsabilidad legal del sistema ante los trabajadores.", "El decreto dispone lo contrario: contratar los servicios no traslada las responsabilidades del empleador.", false], ["C", "la responsabilidad pasa a la administradora de riesgos laborales, que asesora a la entidad.", "La ARL brinda asesoría y asistencia técnica, pero el SG-SST debe ser liderado e implementado por el empleador.", false]]}, {"id": "SG-148", "niv": 2, "e": "Según el Decreto 1072 de 2015, el SG-SST es un proceso por etapas", "f": "Decreto 1072 de 2015, art. 2.2.4.6.4", "o": [["A", "que se actualiza solo cuando ocurre un accidente de trabajo en la entidad.", "El sistema se basa en la mejora continua y en la prevención, no solo en la reacción ante accidentes.", false], ["B", "a cargo exclusivo de la ARL, que lo diseña e implementa en cada empresa afiliada.", "El SG-SST lo lidera e implementa el empleador; la ARL asesora.", false], ["C", "liderado por el empleador, con participación de los trabajadores y ciclo PHVA.", "El artículo 2.2.4.6.4 lo define como un proceso lógico y por etapas basado en la mejora continua, liderado e implementado por el empleador con participación de los trabajadores, con principios del ciclo PHVA.", true]]}]}, {"comp": "sistemas_gestion", "rol": "general", "tag": "Sistemas de gestión (MIPG, control interno y calidad) · Articulación del Sistema de Gestión y MECI", "texto": "Usted es profesional universitario de la Oficina de Planeación de la Procuraduría y participa en una mesa de estudio sobre la articulación de los sistemas de gestión en el sector público. Para preparar su intervención, revisa el Decreto 1083 de 2015, modificado por el Decreto 1499 de 2017, y el Manual Operativo del MIPG de la Función Pública.", "items": [{"id": "SG-152", "niv": 2, "e": "Según el decreto, dentro del MIPG el control interno", "f": "Decreto 1083 de 2015, art. 2.2.23.1", "o": [["A", "es una política independiente que se activa cuando la oficina de control interno inicia una auditoría.", "El control interno es permanente y transversal; no depende de que se inicie una auditoría.", false], ["B", "atraviesa toda la gestión de la entidad y se pone en marcha mediante el MECI.", "El artículo 2.2.23.1 dispone que el control interno es transversal a la gestión y desempeño de las entidades y se implementa a través del Modelo Estándar de Control Interno (MECI).", true], ["C", "reemplaza al Sistema de Gestión en las entidades obligadas por la Ley 87 de 1993.", "El decreto articula el Sistema de Control Interno con el Sistema de Gestión; no lo sustituye.", false]]}, {"id": "SG-153", "niv": 2, "e": "El decreto dispone que el Sistema de Gestión se complementa y articula, entre otros, con", "f": "Decreto 1083 de 2015, art. 2.2.22.1.5", "o": [["A", "el sistema de responsabilidad fiscal que adelantan la Contraloría General y las territoriales.", "El artículo 2.2.22.1.5 no menciona la responsabilidad fiscal entre los sistemas con los que se articula.", false], ["B", "los sistemas de seguridad y salud en el trabajo, gestión ambiental y seguridad de la información.", "El artículo 2.2.22.1.5 menciona los sistemas nacional de servicio al ciudadano, de gestión de la seguridad y salud en el trabajo, de gestión ambiental y de seguridad de la información.", true], ["C", "el régimen disciplinario que aplican las oficinas de control interno disciplinario de cada entidad.", "El régimen disciplinario no figura entre los sistemas con los que el decreto articula el Sistema de Gestión.", false]]}, {"id": "SG-154", "niv": 3, "e": "El Sistema de Gestión creado por el artículo 133 de la Ley 1753 de 2015 integró en uno solo", "f": "Decreto 1083 de 2015, arts. 2.2.22.1.1 y 2.2.23.2; Ley 1753 de 2015, art. 133", "o": [["A", "los sistemas de Desarrollo Administrativo y de Gestión de la Calidad, articulados con el de Control Interno.", "El artículo 2.2.22.1.1 y los considerandos del Decreto 1499 de 2017 señalan que el Sistema de Gestión integra los sistemas de Desarrollo Administrativo y de Gestión de la Calidad, y que se articula con el Sistema de Control Interno.", true], ["B", "los sistemas de Control Interno y de Gestión de la Calidad, y reemplazó la Ley 87 de 1993.", "La Ley 87 de 1993 sigue vigente; el Sistema de Control Interno no se integró, sino que se articula con el Sistema de Gestión.", false], ["C", "los sistemas de Desarrollo Administrativo y de Control Interno, y suprimió el MECI.", "El MECI no se suprimió: se actualiza a través del Manual Operativo del MIPG (art. 2.2.23.2).", false]]}, {"id": "SG-155", "niv": 2, "e": "En el MECI, el componente que busca asegurar las condiciones mínimas para el ejercicio del control interno, con el compromiso de la alta dirección y del comité de coordinación de control interno, es", "f": "Función Pública, Manual Operativo del MIPG, versión 7 (2026), política de control interno (componentes del MECI)", "o": [["A", "la evaluación del riesgo.", "Ese componente se ocupa de identificar y valorar los riesgos, no de las condiciones básicas de compromiso y liderazgo.", false], ["B", "las actividades de monitoreo.", "Ese componente se refiere a la supervisión continua y a las evaluaciones periódicas (autoevaluación y auditorías).", false], ["C", "el ambiente de control.", "El Manual Operativo del MIPG indica que la entidad debe asegurar un ambiente de control que le permita disponer de las condiciones mínimas para el ejercicio del control interno, con el liderazgo de la alta dirección y del comité.", true]]}]}, {"comp": "disciplinario", "rol": "general", "tag": "Código General Disciplinario · Ilicitud sustancial, culpabilidad y presunción de inocencia", "texto": "Usted es profesional de la oficina de control disciplinario interno de una alcaldía distrital. Un jefe de dependencia le remite tres informes. En el primero, una auxiliar archivó un oficio en la carpeta equivocada, lo advirtió ella misma una hora después y lo corrigió, sin que se retrasara ningún trámite ni resultara afectado nadie. En el segundo, se perdió un computador portátil del almacén y el jefe pide sancionar a la coordinadora únicamente porque es la responsable del área, aunque no se sabe quién retiró el equipo. En el tercero, que ya está en investigación, las pruebas sobre quién alteró la fecha de un acta son contradictorias y, practicadas todas las pruebas posibles, no se ha podido establecer si fue el técnico investigado u otra persona.", "items": [{"id": "DI-104", "niv": 2, "e": "Para establecer si la conducta de la auxiliar del primer informe es disciplinariamente ilícita, debe tenerse en cuenta que", "f": "Ley 1952 de 2019, art. 9 (modificado por la Ley 2094 de 2021, art. 2)", "o": [["A", "solo lo es si con ella causó un daño patrimonial cuantificable a la entidad.", "El código no exige daño patrimonial para que haya falta; el criterio es la afectación sustancial del deber funcional (art. 9). El perjuicio causado solo es uno de los criterios de gravedad del artículo 47.", false], ["B", "basta con que se haya apartado del procedimiento interno, aunque luego lo corrigiera.", "La sola infracción formal no basta. La Ley 2094 de 2021 definió la ilicitud sustancial como la afectación sustancial del deber funcional sin justificación (art. 9 de la Ley 1952 de 2019).", false], ["C", "solo lo es si compromete sustancialmente su deber funcional, sin justificación.", "El artículo 9 de la Ley 1952 de 2019, modificado por el artículo 2 de la Ley 2094 de 2021, dispone que la conducta del disciplinable es ilícita cuando afecta sustancialmente el deber funcional sin justificación alguna.", true]]}, {"id": "DI-105", "niv": 3, "e": "Si el jefe inmediato considera que el hecho del primer informe contrarió en menor grado el orden administrativo de la dependencia, sin afectar sustancialmente los deberes funcionales, debe", "f": "Ley 1952 de 2019, art. 68", "o": [["A", "tomar los correctivos del caso sin trámite procesal formal, los cuales no quedan como antecedente disciplinario.", "Por la preservación del orden interno, ante hechos que contrarían en menor grado el orden administrativo sin afectar sustancialmente los deberes funcionales, el jefe inmediato adopta las medidas correctivas pertinentes sin formalismo procesal, y estas no generan antecedente disciplinario (Ley 1952 de 2019, art. 68).", true], ["B", "abrir indagación previa, porque toda irregularidad debe tramitarse por el procedimiento disciplinario.", "El artículo 68 prevé un tratamiento sin formalismo procesal para estos hechos menores, y la indagación previa procede solo ante duda sobre la identificación del autor (art. 208); aquí la autora está identificada.", false], ["C", "imponer directamente una amonestación escrita y ordenar su anotación en la hoja de vida.", "La amonestación escrita es una sanción disciplinaria que solo se impone mediante fallo, al cabo del proceso (arts. 48 y 49). Las medidas del artículo 68 no son sanciones ni generan antecedente.", false]]}, {"id": "DI-106", "niv": 1, "e": "La solicitud de sancionar a la coordinadora por la pérdida del portátil, solo por ser la responsable del área, es improcedente porque", "f": "Ley 1952 de 2019, art. 10", "o": [["A", "los coordinadores de área no son destinatarios de la ley disciplinaria.", "Todos los servidores públicos son destinatarios de la ley disciplinaria, aun retirados del servicio (art. 25 de la Ley 1952 de 2019).", false], ["B", "en materia disciplinaria está proscrita la responsabilidad objetiva y se exige dolo o culpa.", "Solo puede sancionarse por conductas realizadas con culpabilidad, a título de dolo o culpa; queda proscrita toda forma de responsabilidad objetiva (Ley 1952 de 2019, art. 10). Ser jefe del área no prueba por sí solo la culpabilidad.", true], ["C", "la pérdida de bienes del Estado solo genera responsabilidad fiscal, nunca disciplinaria, para quien los tiene a cargo.", "La pérdida o daño de bienes del Estado puede constituir falta disciplinaria (por ejemplo, art. 62, num. 1, de la Ley 1952 de 2019); lo que impide sancionar aquí es la ausencia de prueba de culpabilidad.", false]]}, {"id": "DI-107", "niv": 2, "e": "En el expediente del acta alterada, agotada la práctica de pruebas, lo procedente es", "f": "Ley 1952 de 2019, arts. 14, 147 y 160", "o": [["A", "mantener abierta la actuación hasta que el técnico demuestre que no fue él quien alteró el acta.", "Invierte la carga de la prueba, que corresponde al Estado (art. 147 de la Ley 1952 de 2019), y desconoce la presunción de inocencia (art. 14).", false], ["B", "resolver la duda razonable a favor del técnico, porque para sancionar se requiere certeza sobre la falta y la responsabilidad.", "El disciplinable se presume inocente y toda duda razonable se resuelve a su favor (art. 14 de la Ley 1952 de 2019), y no puede proferirse fallo sancionatorio sin prueba que conduzca a la certeza sobre la falta y la responsabilidad (art. 160).", true], ["C", "sancionar al técnico a título de culpa, porque la duda solo permite descartar el dolo.", "La duda recae sobre la autoría misma, no sobre la modalidad de la culpabilidad. Sin certeza sobre la falta y la responsabilidad no puede proferirse fallo sancionatorio (arts. 14 y 160).", false]]}]}, {"comp": "disciplinario", "rol": "general", "tag": "Código General Disciplinario · Extinción de la acción y de la sanción", "texto": "Usted es profesional universitario de la oficina de control disciplinario interno de un instituto descentralizado del orden departamental. Revisa tres situaciones. En la primera, a un servidor se le impuso suspensión mediante fallo que quedó ejecutoriado en abril de 2024, pero la entidad nunca ejecutó la sanción. En la segunda, la quejosa de una investigación en curso presentó un escrito en el que desiste de su queja y pide archivar el proceso. En la tercera, un disciplinado presentó personalmente un escrito en el que renuncia a la prescripción de la acción disciplinaria, porque quiere obtener un fallo que lo absuelva.", "items": [{"id": "DI-127", "niv": 2, "e": "La sanción impuesta en el fallo ejecutoriado en abril de 2024 prescribe en un término de", "f": "Ley 1952 de 2019, arts. 33 y 36", "o": [["A", "tres años, contados a partir de la ejecutoria del fallo.", "El término legal de prescripción de la sanción es de cinco años, no de tres (art. 36 de la Ley 1952 de 2019).", false], ["B", "cinco años, contados a partir de la fecha en que se cometió la falta.", "Contar desde la comisión de la falta corresponde a la prescripción de la acción (art. 33); la de la sanción se cuenta desde la ejecutoria del fallo (art. 36).", false], ["C", "cinco años, contados a partir de la ejecutoria del fallo.", "La sanción disciplinaria prescribe en un término de cinco años contados a partir de la ejecutoria del fallo (Ley 1952 de 2019, art. 36).", true]]}, {"id": "DI-128", "niv": 1, "e": "Frente al escrito de desistimiento de la quejosa, debe tenerse en cuenta que", "f": "Ley 1952 de 2019, arts. 32 (modificado por la Ley 2094 de 2021, art. 6), 85 y 86", "o": [["A", "el desistimiento del quejoso no extingue la acción disciplinaria.", "Las causales de extinción de la acción son la muerte del disciplinable, la caducidad y la prescripción, y el parágrafo del artículo 32 de la Ley 1952 de 2019 (modificado por la Ley 2094 de 2021) dispone que el desistimiento del quejoso no extingue la acción.", true], ["B", "el desistimiento extingue la acción solo si se presenta antes de la formulación del pliego de cargos.", "La ley no prevé esa regla: el desistimiento del quejoso no extingue la acción en ninguna etapa (art. 32, parágrafo, de la Ley 1952 de 2019).", false], ["C", "el desistimiento obliga a archivar, porque la acción depende del impulso de quien presentó la queja.", "La acción disciplinaria es pública y se adelanta de oficio (arts. 85 y 86 de la Ley 1952 de 2019); no depende del quejoso.", false]]}, {"id": "DI-129", "niv": 2, "e": "Como consecuencia de la renuncia a la prescripción, la acción disciplinaria", "f": "Ley 1952 de 2019, art. 34", "o": [["A", "puede proseguirse por cinco años más, contados desde la notificación del pliego de cargos al disciplinado.", "El término es de dos años y se cuenta desde la presentación personal de la solicitud de renuncia, no desde el pliego de cargos (art. 34 de la Ley 1952 de 2019).", false], ["B", "solo puede proseguirse por un máximo de dos años, contados desde la presentación personal de la solicitud.", "Si el disciplinable renuncia a la prescripción, la acción solo puede proseguirse por un término máximo de dos años contados desde la presentación personal de la solicitud; vencido sin fallo ejecutoriado, solo procede declarar la prescripción (Ley 1952 de 2019, art. 34).", true], ["C", "puede proseguirse sin límite de tiempo, porque el disciplinado renunció a ese beneficio.", "La ley fija un límite: la acción solo puede proseguirse por un máximo de dos años desde la presentación personal de la solicitud (art. 34 de la Ley 1952 de 2019).", false]]}]}, {"comp": "disciplinario", "rol": "general", "tag": "Código General Disciplinario · Sujetos procesales y derechos del disciplinado", "texto": "Usted es profesional universitario de la oficina de control disciplinario interno de una superintendencia. Se adelantan dos procesos. En el primero, un ciudadano presentó queja porque un funcionario demoró injustificadamente su trámite; ahora pide que se le reconozca como sujeto procesal para solicitar pruebas y apelar cualquier decisión. En el segundo, una profesional presentó queja por hechos constitutivos de acoso laboral atribuidos a su jefe y pide intervenir por medio de apoderado. En este segundo proceso, el disciplinado solicita ser escuchado en versión libre cuando ya se surtió el traslado para presentar alegatos previos al fallo de primera instancia.", "items": [{"id": "DI-147", "niv": 3, "e": "Frente a la solicitud del ciudadano del primer proceso, debe explicársele que", "f": "Ley 1952 de 2019, arts. 109 y 110", "o": [["A", "puede solicitar pruebas y apelar cualquier decisión del proceso, siempre que actúe por medio de un abogado inscrito.", "Actuar con abogado no le otorga la calidad de sujeto procesal; sus facultades son limitadas (art. 110, parágrafo 1, de la Ley 1952 de 2019).", false], ["B", "es sujeto procesal con las mismas facultades del investigado, por haber sido quien dio origen a la actuación disciplinaria.", "El quejoso no es sujeto procesal, salvo las víctimas de violaciones de derechos humanos, DIH y acoso laboral (arts. 109 y 110, parágrafo 1, de la Ley 1952 de 2019).", false], ["C", "no tiene la calidad de sujeto procesal; puede ampliar su queja, allegar pruebas e impugnar el archivo o la absolución.", "La intervención del quejoso, que no es sujeto procesal, se limita a presentar y ampliar la queja bajo juramento, aportar las pruebas que tenga y recurrir la decisión de archivo y el fallo absolutorio (Ley 1952 de 2019, art. 110, parágrafo 1).", true]]}, {"id": "DI-148", "niv": 3, "e": "Respecto de la profesional que denunció el acoso laboral, lo procedente es", "f": "Ley 1952 de 2019, arts. 109 y 110", "o": [["A", "reconocerla como sujeto procesal, con la facultad de designar un apoderado que la represente.", "Tienen la condición de sujetos procesales las víctimas de conductas violatorias de derechos humanos, del DIH y de acoso laboral (art. 109), y pueden designar apoderado (Ley 1952 de 2019, art. 110, parágrafo 2).", true], ["B", "tratarla solo como quejosa, porque la calidad de sujeto procesal se reserva al investigado y a su defensor.", "El artículo 109 de la Ley 1952 de 2019 extiende la calidad de sujeto procesal a las víctimas de acoso laboral.", false], ["C", "remitir su queja al comité de convivencia laboral, porque el acoso laboral no es materia disciplinaria.", "El acoso laboral sí es materia disciplinaria y el código regula expresamente la intervención de sus víctimas (arts. 109 y 110 de la Ley 1952 de 2019).", false]]}, {"id": "DI-149", "niv": 2, "e": "Sobre la solicitud del disciplinado del segundo proceso de rendir versión libre, debe tenerse en cuenta que", "f": "Ley 1952 de 2019, art. 112", "o": [["A", "solo procedía durante la indagación previa, antes de que se abriera la investigación.", "La versión libre procede en cualquier etapa, no solo en la indagación previa, siempre que sea antes del traslado para alegatos previos al fallo (art. 112, num. 3).", false], ["B", "es extemporánea, pues la versión libre solo puede rendirse antes de que se corra el traslado para alegar previo al fallo.", "El disciplinado tiene derecho a ser oído en versión libre en cualquier etapa, hasta antes del traslado para presentar alegatos previos al fallo de primera o única instancia (Ley 1952 de 2019, art. 112, num. 3).", true], ["C", "procede en cualquier momento, incluso después de proferido el fallo de primera instancia.", "La ley fija un límite temporal: hasta antes del traslado para alegatos previos al fallo (art. 112, num. 3, de la Ley 1952 de 2019).", false]]}]}, {"comp": "disciplinario", "rol": "tecnico", "tag": "Código General Disciplinario · Niveles técnico, administrativo y operativo · Término de la investigación disciplinaria", "texto": "Usted es técnico de la secretaría de una procuraduría provincial de instrucción y lleva el control de términos. El 2 de febrero de 2026 se profirió auto de apertura de investigación contra dos servidores de una alcaldía por una misma falta disciplinaria. El instructor le pide calcular los términos máximos de la etapa. En otro despacho de la misma sede se tramita una investigación por presuntas infracciones al Derecho Internacional Humanitario.", "items": [{"id": "DI-156", "niv": 1, "e": "Sin considerar prórrogas, la investigación contra los dos servidores tiene una duración de", "f": "Ley 1952 de 2019, art. 213 (modificado por la Ley 2094 de 2021, art. 36)", "o": [["A", "seis meses, contados a partir de la decisión de apertura.", "La investigación tiene una duración de seis meses contados a partir de la decisión de apertura (Ley 1952 de 2019, art. 213, modificado por la Ley 2094 de 2021).", true], ["B", "doce meses, contados a partir de la decisión de apertura de la investigación.", "Doce meses solo se alcanzan con la prórroga hasta en otro tanto; el término inicial es de seis meses (art. 213 de la Ley 1952 de 2019).", false], ["C", "seis meses, contados desde la notificación personal del auto de apertura.", "El término no se cuenta desde la notificación, sino desde la decisión de apertura (art. 213 de la Ley 1952 de 2019).", false]]}, {"id": "DI-157", "niv": 3, "e": "Si el término se prorroga por haber dos investigados, y sin contar la prórroga adicional por pruebas faltantes, la investigación debe culminar a más tardar en", "f": "Ley 1952 de 2019, art. 213 (modificado por la Ley 2094 de 2021, art. 36)", "o": [["A", "agosto de 2026.", "Agosto de 2026 corresponde solo al término inicial de seis meses, sin la prórroga por pluralidad de investigados (art. 213 de la Ley 1952 de 2019).", false], ["B", "febrero de 2027.", "La investigación dura seis meses desde la apertura y puede prorrogarse hasta en otro tanto cuando se investiga a dos o más servidores (Ley 1952 de 2019, art. 213): seis más seis son doce meses desde febrero de 2026, es decir, febrero de 2027.", true], ["C", "agosto de 2027.", "Dieciocho meses es el límite de las investigaciones por infracciones al DIDH o al DIH, no la prórroga por pluralidad de investigados (art. 213 de la Ley 1952 de 2019).", false]]}, {"id": "DI-158", "niv": 2, "e": "Sin contar la prórroga de tres meses por pruebas faltantes, la investigación por infracciones al Derecho Internacional Humanitario no puede exceder de", "f": "Ley 1952 de 2019, art. 213 (modificado por la Ley 2094 de 2021, art. 36)", "o": [["A", "doce meses.", "Doce meses es el máximo general con prórroga por varias faltas o investigados; para el DIDH y el DIH la ley fija un límite distinto (art. 213 de la Ley 1952 de 2019).", false], ["B", "dieciocho meses.", "Cuando se trate de investigaciones por infracción al Derecho Internacional de los Derechos Humanos o al DIH, el término de investigación no podrá exceder de dieciocho meses (Ley 1952 de 2019, art. 213, inciso 2).", true], ["C", "veinticuatro meses.", "La ley no prevé ese término; el máximo para estas investigaciones es de dieciocho meses, con la eventual prórroga de tres meses por pruebas (art. 213).", false]]}]}, {"comp": "disciplinario", "rol": "general", "tag": "Código General Disciplinario · Juicio verbal: audiencia, notificación y apelación", "texto": "Usted es profesional universitario de una procuraduría distrital de juzgamiento. El funcionario de conocimiento decidió adelantar por juicio verbal un proceso contra un auxiliar de una alcaldía local y le pide proyectar el auto de citación a la audiencia de descargos y pruebas. Ya en la audiencia, se negó una prueba pedida por la defensa. Semanas después, en la sesión fijada para dar a conocer la decisión, se leyó el fallo sancionatorio con el disciplinado y su defensor presentes.", "items": [{"id": "DI-168", "niv": 2, "e": "La audiencia de descargos y pruebas debe realizarse", "f": "Ley 1952 de 2019, art. 225H (adicionado por la Ley 2094 de 2021, art. 47)", "o": [["A", "dentro de los cinco días siguientes a la notificación personal del pliego de cargos al disciplinado.", "El término se cuenta desde el auto de citación y es de diez a veinte días (art. 225H). Cinco días es el plazo de comparecencia para notificar el pliego (art. 225).", false], ["B", "en un término no menor de quince ni mayor de treinta días desde la ejecutoria del auto de citación.", "El artículo 225H fija entre diez y veinte días desde la fecha del auto; además, contra ese auto no procede recurso.", false], ["C", "entre diez y veinte días después de la fecha del auto que la convoca.", "En el auto en que decide adelantar el juicio verbal, el funcionario fija fecha y hora para la audiencia de descargos y pruebas, que se realizará en un término no menor de diez ni mayor de veinte días de la fecha del auto de citación (Ley 1952 de 2019, art. 225H).", true]]}, {"id": "DI-169", "niv": 1, "e": "La decisión que negó la prueba en la audiencia se entiende notificada", "f": "Ley 1952 de 2019, arts. 126 y 227", "o": [["A", "en estrados, a todos los sujetos procesales, estén o no presentes.", "Las decisiones proferidas en audiencia se consideran notificadas a todos los sujetos procesales inmediatamente se hace el pronunciamiento, se encuentren o no presentes (Ley 1952 de 2019, art. 126); el artículo 227 lo reitera para la negación de pruebas.", true], ["B", "por estado electrónico, al día siguiente de terminada la sesión de la audiencia.", "El estado es para decisiones que no se profieren en audiencia; las proferidas en audiencia se notifican en estrados (art. 126 de la Ley 1952 de 2019).", false], ["C", "personalmente, cuando el defensor firme el acta de la sesión de la audiencia.", "La firma del acta (art. 226) no es la forma de notificación; la notificación se surte en estrados en el momento del pronunciamiento (arts. 126 y 227).", false]]}, {"id": "DI-170", "niv": 3, "e": "Si el disciplinado quiere apelar el fallo leído en la audiencia, debe", "f": "Ley 1952 de 2019, arts. 131, 232 y 233", "o": [["A", "interponerlo y sustentarlo por escrito ante la secretaría, dentro de los diez días siguientes.", "Ese es el trámite del artículo 225G de la Ley 1952 de 2019, exclusivo del fallo del juicio ordinario. En el juicio verbal el artículo 233 exige interponer la apelación en la misma diligencia en que se profiere el fallo.", false], ["B", "interponerlo dentro de los cinco días siguientes a la desfijación del edicto que notifique el fallo.", "El fallo del juicio verbal se notifica en estrados (arts. 126 y 232), no por edicto, y el recurso se interpone en la misma diligencia (art. 233).", false], ["C", "interponer el recurso en la misma audiencia.", "En el juicio verbal, el artículo 233 de la Ley 1952 de 2019 dispone que contra el fallo de primera instancia procede apelación, que deberá interponerse en la misma diligencia (con sustentación verbal inmediata o por escrito dentro de los cinco días siguientes). En el mismo sentido, el artículo 131 exige interponer en la audiencia los recursos contra decisiones notificadas en estrados.", true]]}]}, {"comp": "disciplinario", "rol": "general", "tag": "Código General Disciplinario · Doble conformidad y sentencia C-030 de 2023", "texto": "Usted es profesional universitario de la Procuraduría y prepara una charla de inducción sobre los cambios del régimen disciplinario. Le piden explicar tres puntos: qué garantiza la doble conformidad; cuál es la naturaleza de las funciones disciplinarias de la Procuraduría después de la sentencia C-030 de 2023 de la Corte Constitucional; y qué ocurre cuando la Procuraduría impone destitución e inhabilidad general a un alcalde que se encuentra en ejercicio del cargo.", "items": [{"id": "DI-190", "niv": 2, "e": "La doble conformidad garantiza que", "f": "Ley 1952 de 2019, art. 12 (modificado por la Ley 2094 de 2021, art. 3)", "o": [["A", "todo fallo sancionatorio pueda ser revisado por una autoridad diferente, con el trámite de la apelación.", "Todo disciplinable tiene derecho a que el fallo sancionatorio sea revisado por una autoridad diferente, con el trámite previsto para el recurso de apelación (Ley 1952 de 2019, art. 12, inciso 3, modificado por la Ley 2094 de 2021).", true], ["B", "las decisiones de archivo sean confirmadas por el superior antes de quedar en firme.", "El código no prevé que el superior confirme los archivos antes de su firmeza: contra el archivo procede apelación (art. 134 de la Ley 1952 de 2019), y la doble conformidad se refiere a los fallos sancionatorios (art. 12).", false], ["C", "el disciplinado sea investigado y luego juzgado por dos funcionarios distintos dentro del mismo despacho.", "Eso corresponde a la separación entre instrucción y juzgamiento (art. 12, incisos 1 y 2), que es una garantía distinta de la doble conformidad.", false]]}, {"id": "DI-191", "niv": 1, "e": "Según la sentencia C-030 de 2023, las funciones disciplinarias que ejerce la Procuraduría son de naturaleza", "f": "Corte Constitucional, Sentencia C-030 de 2023; Ley 1952 de 2019, art. 2", "o": [["A", "jurisdiccional, por atribución expresa de la Ley 2094 de 2021.", "La Corte declaró inexequibles las expresiones «jurisdiccionales» y «jurisdiccional» de los artículos 1, 54, 73 y 74 de la Ley 2094 de 2021 (Sentencia C-030 de 2023).", false], ["B", "mixta: jurisdiccional frente a elección popular y administrativa frente a los demás servidores.", "La Corte no adoptó un régimen mixto: la función es administrativa en todos los casos, y frente a elección popular exigió intervención del juez para la sanción definitiva (Sentencia C-030 de 2023).", false], ["C", "administrativa, no jurisdiccional.", "La sentencia C-030 de 2023 declaró inexequible la atribución de funciones jurisdiccionales y condicionó varias normas en el entendido de que las funciones disciplinarias de la Procuraduría son de naturaleza administrativa y no jurisdiccional.", true]]}, {"id": "DI-192", "niv": 3, "e": "Si la Procuraduría sanciona con destitución e inhabilidad general a un alcalde en ejercicio, esa sanción", "f": "Ley 1952 de 2019, arts. 2 y 238D; Corte Constitucional, Sentencia C-030 de 2023", "o": [["A", "solo puede ser revisada por un juez si el alcalde interpone una acción de tutela contra el fallo.", "La revisión judicial opera por ministerio de la ley, de manera automática, sin necesidad de tutela (Sentencia C-030 de 2023).", false], ["B", "se somete a revisión automática ante la jurisdicción contencioso administrativa y su ejecución se suspende mientras se decide.", "La C-030 de 2023 condicionó los arts. 1 y 54 de la Ley 2094 de 2021: la destitución, suspensión e inhabilidad de servidores de elección popular las determina definitivamente el juez contencioso administrativo, mediante el recurso extraordinario de revisión que opera de manera automática e inmediata (ante el Consejo de Estado o el tribunal administrativo, según la autoridad que sancionó, art. 238B), y la ejecución se suspende durante ese trámite (Ley 1952 de 2019, arts. 2 y 238D).", true], ["C", "se ejecuta de inmediato por el gobernador, una vez queda en firme en la Procuraduría.", "Para servidores de elección popular, la ejecución se supedita a lo que decida la autoridad judicial y se suspende durante la revisión (art. 2 de la Ley 1952 de 2019; art. 238D; Sentencia C-030 de 2023).", false]]}]}, {"comp": "contratacion", "rol": "general", "tag": "Contratación estatal · Modalidades de selección", "texto": "Usted es profesional de la Secretaría General de una alcaldía y revisa el Plan Anual de Adquisiciones. Hay tres necesidades: (i) comprar resmas de papel, tóner y útiles de oficina por un valor superior a la menor cuantía de la entidad; son bienes con las mismas especificaciones técnicas y patrones de calidad objetivamente definidos, y no existe un acuerdo marco de precios vigente para ellos; (ii) contratar los estudios y diseños para la ampliación de la plaza de mercado, por un valor superior a la mínima cuantía; y (iii) tomar en arriendo una bodega para el archivo central, porque el contrato de arrendamiento actual vence en tres meses y el propietario no lo renovará.", "items": [{"id": "CE-110", "niv": 1, "e": "Para adquirir el papel, el tóner y los útiles de oficina, la modalidad que corresponde es", "f": "Ley 1150 de 2007, art. 2, num. 2, lit. a)", "o": [["A", "la selección abreviada para la adquisición de bienes de características técnicas uniformes y de común utilización.", "El literal a) del numeral 2 del artículo 2 de la Ley 1150 prevé la selección abreviada para bienes y servicios de características técnicas uniformes y de común utilización, es decir, los que tienen las mismas especificaciones técnicas y comparten patrones de desempeño y calidad objetivamente definidos.", true], ["B", "la licitación pública, porque el valor de la compra supera la menor cuantía de la entidad y no hay acuerdo marco vigente.", "La causal de bienes de características técnicas uniformes no depende del valor; superar la menor cuantía no obliga a licitar cuando existe una causal de selección abreviada por el objeto (art. 2, num. 2, lit. a, Ley 1150).", false], ["C", "la mínima cuantía, porque se trata de bienes de consumo para el funcionamiento de la entidad.", "La mínima cuantía depende del valor (que no exceda el 10 % de la menor cuantía), no de que los bienes sean de consumo (art. 2, num. 5, Ley 1150); aquí el valor supera incluso la menor cuantía.", false]]}, {"id": "CE-111", "niv": 2, "e": "En el proceso para contratar los estudios y diseños de la plaza de mercado, la alcaldía", "f": "Ley 1150 de 2007, art. 2, num. 3 y art. 5, num. 4; Decreto 1082 de 2015, art. 2.2.1.2.1.3.1", "o": [["A", "puede acudir a la selección abreviada de menor cuantía y escoger la oferta de menor precio.", "La consultoría tiene una modalidad propia, el concurso de méritos, sin importar que su valor esté dentro de la menor cuantía (art. 2, num. 3, Ley 1150).", false], ["B", "debe acudir al concurso de méritos y darle al precio el mayor puntaje, en aplicación del principio de economía.", "En la selección de consultores se califican aspectos técnicos y la experiencia; la ley prohíbe usar el precio como factor de escogencia (art. 5, num. 4, Ley 1150).", false], ["C", "debe acudir al concurso de méritos y no puede incluir el precio como factor de escogencia.", "Los estudios y diseños son consultoría (art. 32, num. 2, Ley 80), que se contrata por concurso de méritos (art. 2, num. 3, Ley 1150; Decreto 1082 de 2015, art. 2.2.1.2.1.3.1). El numeral 4 del artículo 5 de la Ley 1150 prohíbe incluir el precio como factor de escogencia en la selección de consultores.", true]]}, {"id": "CE-112", "niv": 3, "e": "Para tomar en arriendo la bodega del archivo, la modalidad aplicable es", "f": "Ley 1150 de 2007, art. 2, num. 4, lit. i); Decreto 1082 de 2015, art. 2.2.1.2.1.4.11; Colombia Compra Eficiente, Manual de la modalidad de selección de mínima cuantía", "o": [["A", "la mínima cuantía, si el canon anual no supera el 10 % de la menor cuantía de la alcaldía.", "Cuando concurre una causal de contratación directa, como el arrendamiento de inmuebles, esta prevalece sobre la mínima cuantía, según el Manual de mínima cuantía de Colombia Compra Eficiente.", false], ["B", "la selección abreviada de menor cuantía, previa invitación a varios propietarios de bodegas.", "El arrendamiento de inmuebles tiene causal propia de contratación directa (art. 2, num. 4, lit. i, Ley 1150), de modo que no se acude a la selección abreviada por la cuantía.", false], ["C", "la contratación directa, por tratarse del arrendamiento de un inmueble.", "El literal i) del numeral 4 del artículo 2 de la Ley 1150 incluye el arrendamiento o adquisición de inmuebles entre las causales de contratación directa, desarrolladas en el artículo 2.2.1.2.1.4.11 del Decreto 1082 de 2015.", true]]}]}, {"comp": "contratacion", "rol": "general", "tag": "Contratación estatal · Garantías y su suficiencia", "texto": "Una gobernación adjudicó por licitación pública un contrato de obra para construir un aula múltiple en un colegio departamental. El presupuesto oficial era de $2.000.000.000 y la oferta ganadora fue de $1.950.000.000, valor por el que se firmó el contrato, con un plazo de ejecución de diez meses. El contrato prevé un anticipo del 30 % de su valor. Usted es profesional de la oficina jurídica y debe revisar las garantías antes de aprobarlas. Ninguno de los valores del proceso supera un millón de SMMLV.", "items": [{"id": "CE-142", "niv": 2, "e": "La garantía de seriedad que debía acompañar la oferta ganadora tenía que ser, como mínimo, de", "f": "Decreto 1082 de 2015, art. 2.2.1.2.3.1.9", "o": [["A", "$97.500.000.", "Equivale al 5 % de la oferta; la norma exige al menos el 10 % del valor de la oferta (Decreto 1082 de 2015, art. 2.2.1.2.3.1.9).", false], ["B", "$195.000.000.", "El artículo 2.2.1.2.3.1.9 del Decreto 1082 de 2015 exige que la garantía de seriedad sea de por lo menos el 10 % del valor de la oferta y que esté vigente desde su presentación hasta la aprobación de la garantía de cumplimiento: 10 % de $1.950.000.000 = $195.000.000.", true], ["C", "$200.000.000.", "Es el 10 % del presupuesto oficial, base que el reglamento usa para la subasta inversa y el concurso de méritos, no para la licitación, en la que la base es el valor de la oferta (Decreto 1082, art. 2.2.1.2.3.1.9).", false]]}, {"id": "CE-143", "niv": 1, "e": "La garantía de estabilidad y calidad de la obra, salvo justificación técnica para un término menor, debe estar vigente", "f": "Decreto 1082 de 2015, arts. 2.2.1.2.3.1.12 a 2.2.1.2.3.1.14", "o": [["A", "por no menos de cinco años contados desde que la gobernación recibe la obra a satisfacción.", "El artículo 2.2.1.2.3.1.14 del Decreto 1082 de 2015, modificado por el Decreto 399 de 2021, exige una vigencia no inferior a cinco años desde el recibo a satisfacción; solo con justificación técnica de un experto puede ser menor, y en todo caso de mínimo un año.", true], ["B", "por el plazo del contrato y tres años más, contados desde la firma del contrato de obra.", "Esa vigencia es la del amparo de pago de salarios, prestaciones sociales e indemnizaciones laborales (Decreto 1082, art. 2.2.1.2.3.1.13).", false], ["C", "hasta la liquidación del contrato, igual que el amparo de cumplimiento, porque cubre la obra durante toda la ejecución.", "La vigencia hasta la liquidación corresponde al amparo de cumplimiento (Decreto 1082, art. 2.2.1.2.3.1.12); la estabilidad de la obra cubre daños posteriores a la entrega.", false]]}, {"id": "CE-144", "niv": 3, "e": "El amparo de pago de salarios, prestaciones sociales legales e indemnizaciones laborales debe cubrir, como mínimo,", "f": "Decreto 1082 de 2015, art. 2.2.1.2.3.1.13", "o": [["A", "$97.500.000 y estar vigente por el plazo del contrato y tres años más.", "El artículo 2.2.1.2.3.1.13 del Decreto 1082 de 2015 fija un valor no inferior al 5 % del valor total del contrato y una vigencia igual al plazo del contrato y tres años más: 5 % de $1.950.000.000 = $97.500.000.", true], ["B", "$195.000.000 y estar vigente por el plazo del contrato y tres años más.", "El porcentaje mínimo de este amparo es el 5 % del valor del contrato, no el 10 % que se exige para el amparo de cumplimiento (Decreto 1082, arts. 2.2.1.2.3.1.12 y 2.2.1.2.3.1.13).", false], ["C", "$97.500.000 y estar vigente hasta la liquidación del contrato.", "El valor es correcto, pero la vigencia de este amparo es el plazo del contrato y tres años más, no hasta la liquidación (Decreto 1082, art. 2.2.1.2.3.1.13).", false]]}, {"id": "CE-145", "niv": 3, "e": "En relación con el anticipo pactado, la gobernación debe exigir", "f": "Ley 80 de 1993, art. 40, par.; Ley 1474 de 2011, art. 91; Decreto 1082 de 2015, arts. 2.2.1.1.2.4.1 y 2.2.1.2.3.1.10", "o": [["A", "una garantía de buen manejo por $58.500.000, equivalente al 10 % del anticipo, y su consignación en una cuenta a nombre del contratista.", "La garantía de buen manejo debe cubrir el 100 % del anticipo, no el 10 %, y en un contrato de obra adjudicado por licitación el anticipo se maneja en fiducia o patrimonio autónomo, no en una cuenta del contratista (art. 91, Ley 1474).", false], ["B", "una garantía de buen manejo por $585.000.000 y que el anticipo se maneje en una fiducia o patrimonio autónomo irrevocable.", "El anticipo es de $585.000.000 (30 % de $1.950.000.000), dentro del tope del 50 % del parágrafo del artículo 40 de la Ley 80. La garantía de buen manejo y correcta inversión debe ser del 100 % del anticipo (Decreto 1082, art. 2.2.1.2.3.1.10), y en los contratos de obra el contratista debe constituir una fiducia o patrimonio autónomo irrevocable para manejarlo (art. 91, Ley 1474; Decreto 1082, art. 2.2.1.1.2.4.1).", true], ["C", "una garantía de buen manejo por $195.000.000, equivalente al 10 % del contrato, sin necesidad de constituir una fiducia.", "El valor asegurado se calcula sobre el anticipo (100 %), no sobre el valor del contrato, y la fiducia es obligatoria en los contratos de obra que no son de menor o mínima cuantía (art. 91, Ley 1474).", false]]}]}, {"comp": "contratacion", "rol": "tecnico", "tag": "Contratación estatal · Niveles técnico, administrativo y operativo · Perfeccionamiento y requisitos de ejecución", "texto": "Usted es técnico administrativo del grupo de contratación de la Procuraduría General de la Nación. Le asignan llevar el control de dos contratos. El primero es de suministro de elementos de aseo: ayer lo firmaron el ordenador del gasto y el contratista, quien entregó la póliza, pero la garantía aún no ha sido aprobada. El segundo es la compra de un inmueble para el funcionamiento de una procuraduría provincial, cuyo texto ya acordaron las partes. El contratista del suministro llama a preguntar si puede empezar a entregar los elementos hoy mismo.", "items": [{"id": "CE-146", "niv": 3, "e": "El contrato de suministro firmado ayer", "f": "Ley 80 de 1993, art. 41, inc. 1", "o": [["A", "se perfeccionará cuando la Procuraduría apruebe la garantía presentada por el contratista.", "La aprobación de la garantía es requisito para la ejecución (art. 41, inc. 2, Ley 80), no para el perfeccionamiento, que se produce con el acuerdo escrito sobre objeto y contraprestación.", false], ["B", "se perfeccionará con la publicación del contrato en el SECOP II y la firma del acta de inicio por el supervisor.", "El perfeccionamiento depende del acuerdo sobre objeto y contraprestación elevado a escrito (art. 41, inc. 1, Ley 80); la publicación y el acta de inicio son posteriores.", false], ["C", "ya está perfeccionado, porque hay acuerdo sobre el objeto y la contraprestación y consta por escrito.", "El inciso 1 del artículo 41 de la Ley 80 dispone que los contratos del Estado se perfeccionan cuando se logra acuerdo sobre el objeto y la contraprestación y este se eleva a escrito. La aprobación de la garantía es un requisito de ejecución, no de perfeccionamiento.", true]]}, {"id": "CE-147", "niv": 1, "e": "A la pregunta del contratista sobre si puede iniciar hoy las entregas, usted debe responder que", "f": "Ley 80 de 1993, art. 41, inc. 2 (modificado por la Ley 1150 de 2007, art. 23)", "o": [["A", "sí, porque el contrato ya está perfeccionado y la garantía puede aprobarse durante la ejecución.", "Perfeccionamiento y ejecución son momentos distintos; para ejecutar, la garantía debe estar aprobada previamente (art. 41, inc. 2, Ley 80).", false], ["B", "sí, siempre que el supervisor lo autorice por escrito y que la garantía quede aprobada antes de tramitar el primer pago.", "La autorización del supervisor no suple los requisitos legales de ejecución; la garantía debe aprobarse antes de iniciar la ejecución (art. 41, inc. 2, Ley 80).", false], ["C", "aún no, porque la ejecución requiere la garantía aprobada y el registro presupuestal del contrato.", "El inciso 2 del artículo 41 de la Ley 80, modificado por el artículo 23 de la Ley 1150 de 2007, exige para la ejecución la aprobación de la garantía y la existencia de las disponibilidades presupuestales correspondientes; el artículo 2.2.1.1.2.3.1 del Decreto 1082 de 2015 ordena fijar en el cronograma el plazo para el registro presupuestal como requisito de ejecución y pago.", true]]}, {"id": "CE-148", "niv": 2, "e": "La compra del inmueble para la procuraduría provincial", "f": "Ley 80 de 1993, art. 39; Ley 1150 de 2007, art. 2, num. 4, lit. i); Decreto 1082 de 2015, art. 2.2.1.2.1.4.10", "o": [["A", "debe adjudicarse por licitación pública, porque la adquisición de inmuebles no admite contratación directa.", "La adquisición de inmuebles es causal de contratación directa (art. 2, num. 4, lit. i, Ley 1150; Decreto 1082, art. 2.2.1.2.1.4.10).", false], ["B", "debe elevarse a escritura pública, porque implica la transferencia del dominio de un bien inmueble.", "El artículo 39 de la Ley 80 dispone que los contratos estatales constan por escrito y no requieren escritura pública, salvo los que impliquen mutación del dominio o imposición de gravámenes y servidumbres sobre inmuebles. La adquisición de inmuebles se contrata directamente (art. 2, num. 4, lit. i, Ley 1150).", true], ["C", "basta con que conste en un documento privado, porque los contratos estatales no requieren escritura pública.", "La regla del documento escrito tiene una excepción expresa para los contratos que implican mutación del dominio de inmuebles (art. 39, Ley 80).", false]]}]}, {"comp": "contratacion", "rol": "general", "tag": "Contratación estatal · Supervisión e interventoría", "texto": "Un municipio adjudicó por licitación pública la construcción de un centro de salud. Para el seguimiento de la obra, el secretario de Infraestructura propone designar como supervisor a un ingeniero de planta y no contratar interventoría, para ahorrar recursos. Paralelamente, la alcaldía tiene un contrato de suministro de refrigerios para un evento institucional, cuyo seguimiento no exige conocimientos especializados. Usted es profesional de la oficina jurídica y debe conceptuar sobre la vigilancia de ambos contratos.", "items": [{"id": "CE-149", "niv": 1, "e": "Sobre el seguimiento del contrato de suministro de refrigerios, lo adecuado es", "f": "Ley 1474 de 2011, art. 83", "o": [["A", "designar un supervisor de la misma entidad, porque el seguimiento no requiere conocimientos especializados.", "El artículo 83 de la Ley 1474 de 2011 define la supervisión como el seguimiento técnico, administrativo, financiero, contable y jurídico que ejerce la misma entidad cuando no se requieren conocimientos especializados.", true], ["B", "dejar el seguimiento a cargo del contratista mediante informes periódicos de autocontrol que él mismo elabore.", "Las entidades están obligadas a vigilar permanentemente la ejecución a través de un supervisor o un interventor (art. 83, Ley 1474); el contratista no puede vigilarse a sí mismo.", false], ["C", "contratar un interventor externo, porque todo contrato estatal debe vigilarse mediante interventoría.", "La interventoría se contrata cuando el seguimiento supone conocimiento especializado o la complejidad o extensión del contrato lo justifican (art. 83, Ley 1474); no es obligatoria en todo contrato.", false]]}, {"id": "CE-150", "niv": 2, "e": "Frente a la propuesta de no contratar interventoría para la obra del centro de salud, usted debe advertir que", "f": "Ley 80 de 1993, art. 32, num. 1; Ley 1474 de 2011, art. 83, par. 1", "o": [["A", "en la obra adjudicada por licitación, la interventoría debe contratarse con alguien independiente de la entidad y del contratista.", "El numeral 1 del artículo 32 de la Ley 80 dispone que en los contratos de obra celebrados como resultado de una licitación la interventoría debe contratarse con una persona independiente de la entidad contratante y del contratista. El parágrafo 1 del artículo 83 de la Ley 1474 se refiere a esa obligación de contar con interventoría.", true], ["B", "es viable si el ingeniero de planta tiene posgrado en interventoría de obras civiles.", "La exigencia legal es que la interventoría la ejerza una persona independiente de la entidad; un servidor de planta, cualquiera que sea su formación, no lo es (art. 32, num. 1, Ley 80).", false], ["C", "es viable, porque la entidad puede escoger libremente entre supervisión e interventoría en cualquier contrato, según su presupuesto.", "En la obra licitada la ley impone la interventoría externa (art. 32, num. 1, Ley 80); la libertad de escoger no aplica en ese caso.", false]]}, {"id": "CE-151", "niv": 3, "e": "Si la alcaldía contrata la interventoría de la obra, en relación con la supervisión es correcto afirmar que", "f": "Ley 1474 de 2011, art. 83", "o": [["A", "el contrato de interventoría no requiere supervisión, porque el interventor responde directamente ante la contraloría.", "El artículo 83 de la Ley 1474 dispone expresamente que el contrato de interventoría será supervisado directamente por la entidad estatal.", false], ["B", "por regla general no concurren, aunque la entidad puede dividir la vigilancia entre el interventor y un supervisor.", "El artículo 83 de la Ley 1474 dispone que, por regla general, la supervisión y la interventoría no son concurrentes sobre un mismo contrato, pero la entidad puede dividir la vigilancia: el contrato de interventoría indicará las actividades técnicas del interventor y las demás quedarán a cargo del supervisor. Además, el contrato de interventoría es supervisado por la entidad.", true], ["C", "deben concurrir en todos los casos, porque el interventor vigila lo técnico y el supervisor todo lo demás.", "La concurrencia no es la regla sino una posibilidad cuando la entidad decide dividir la vigilancia (art. 83, Ley 1474).", false]]}]}, {"comp": "contratacion", "rol": "general", "tag": "Contratación estatal · Selección abreviada de menor cuantía y declaratoria de desierta", "texto": "Una alcaldía abrió una licitación pública para dotar con equipos biomédicos los puestos de salud rurales, pero ninguno de los proponentes cumplió los requisitos habilitantes, por lo que ninguna oferta podía ser escogida. En otro proceso, de selección abreviada de menor cuantía para el mantenimiento de las sedes educativas, recibió 25 manifestaciones de interés; el pliego previó la posibilidad de sorteo. Usted es profesional de la oficina de contratación y debe orientar al comité.", "items": [{"id": "CE-177", "niv": 2, "e": "Ante la falta de proponentes habilitados en la licitación, la alcaldía", "f": "Ley 80 de 1993, art. 25, num. 18; Ley 1150 de 2007, art. 2, num. 2, lit. d)", "o": [["A", "debe adjudicar al proponente con mayor puntaje, aunque no cumpla los requisitos habilitantes exigidos en el pliego de condiciones.", "Los requisitos habilitantes condicionan la participación (art. 5, num. 1, Ley 1150); adjudicar a quien no los cumple desconoce la selección objetiva.", false], ["B", "puede contratar directamente con cualquiera de los proponentes, porque la licitación pública fracasó por falta de oferentes hábiles.", "El fracaso de la licitación no es causal de contratación directa (art. 2, num. 4, Ley 1150); la ley prevé la selección abreviada para ese evento.", false], ["C", "debe declararla desierta mediante acto motivado y puede iniciar una selección abreviada dentro de los cuatro meses siguientes.", "Como ninguna oferta podía escogerse, se presenta un motivo que impide la escogencia objetiva y la licitación se declara desierta mediante acto motivado (art. 25, num. 18, Ley 80); y el literal d) del numeral 2 del artículo 2 de la Ley 1150 prevé la selección abreviada cuando la licitación se declara desierta, que debe iniciarse dentro de los cuatro meses siguientes.", true]]}, {"id": "CE-178", "niv": 1, "e": "En la selección abreviada de menor cuantía, los interesados debían manifestar su intención de participar en un término", "f": "Decreto 1082 de 2015, art. 2.2.1.2.1.2.20, num. 1", "o": [["A", "no mayor a tres días hábiles contados desde la apertura del proceso.", "El numeral 1 del artículo 2.2.1.2.1.2.20 del Decreto 1082 de 2015 dispone que, en un término no mayor a tres días hábiles contados a partir de la apertura, los interesados deben manifestar su intención de participar.", true], ["B", "no mayor a cinco días hábiles contados desde la apertura del proceso.", "Cinco días hábiles es el término de observaciones al proyecto de pliego en la selección abreviada (Decreto 1082, art. 2.2.1.1.2.1.4), no el de manifestación de interés.", false], ["C", "no mayor a diez días hábiles contados desde la apertura del proceso.", "Diez días hábiles es el término de observaciones al proyecto de pliego en la licitación pública (Decreto 1082, art. 2.2.1.1.2.1.4).", false]]}, {"id": "CE-179", "niv": 2, "e": "Con las 25 manifestaciones de interés recibidas, la alcaldía", "f": "Decreto 1082 de 2015, art. 2.2.1.2.1.2.20, num. 2; Ley 1150 de 2007, art. 2, par. 2, num. 2", "o": [["A", "debe hacer un sorteo para reducir a cinco el número de interesados que pueden presentar oferta.", "El sorteo es facultativo y, si se hace, selecciona máximo diez interesados, no cinco (Decreto 1082, art. 2.2.1.2.1.2.20, num. 2).", false], ["B", "debe adelantar el proceso como licitación pública, porque se superó el número máximo de interesados.", "Recibir muchas manifestaciones de interés no cambia la modalidad; la norma prevé continuar o sortear (Decreto 1082, art. 2.2.1.2.1.2.20).", false], ["C", "puede continuar con todos los interesados o hacer un sorteo para escoger hasta diez de ellos.", "El numeral 2 del artículo 2.2.1.2.1.2.20 del Decreto 1082 de 2015 dispone que, si se reciben más de diez manifestaciones de interés, la entidad puede continuar el proceso o hacer un sorteo para seleccionar máximo diez interesados, según lo previsto en el pliego (art. 2, par. 2, num. 2, Ley 1150).", true]]}]}, {"comp": "anticorrupcion", "rol": "general", "tag": "Estatuto Anticorrupción y transparencia · Deber de denunciar actos de corrupción", "texto": "Tomás es técnico administrativo de la secretaría de hacienda de un municipio. Al conciliar las cuentas del impuesto predial, descubre que un compañero ha hecho varias transferencias de recursos públicos a una cuenta personal y conserva los soportes. Cuando le cuenta a su jefe inmediato, este le sugiere \"no meterse en problemas\" y olvidar el asunto. Días después, un contribuyente que también notó irregularidades en sus recibos pregunta en la ventanilla cómo puede denunci
