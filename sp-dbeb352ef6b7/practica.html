ca instancia (art. 217).", false], ["C", "es de tres meses durante la investigación o el juzgamiento, prorrogable hasta en otro tanto, y el auto se somete a consulta.", "El término de la suspensión provisional es de tres meses, prorrogable hasta en otro tanto; solo después del fallo de primera o única instancia cabe otra prórroga de tres meses. El auto que la decreta y las prórrogas se someten a consulta, sin perjuicio de su cumplimiento inmediato (Ley 1952 de 2019, art. 217).", true]]}, {"id": "DI-176", "niv": 1, "e": "Si la investigación termina con fallo absolutorio, el almacenista", "f": "Ley 1952 de 2019, art. 218", "o": [["A", "será reintegrado y tendrá derecho al pago de la remuneración dejada de percibir.", "Quien fue suspendido provisionalmente es reintegrado y tiene derecho al reconocimiento y pago de la remuneración dejada de percibir cuando la investigación termina con fallo absolutorio, archivo o terminación, o cuando expira la suspensión sin fallo (Ley 1952 de 2019, art. 218).", true], ["B", "solo podrá reclamar los salarios dejados de percibir ante la jurisdicción contencioso administrativa.", "No necesita acudir a un juez: el reconocimiento y pago es consecuencia directa del fallo absolutorio según el artículo 218 de la Ley 1952 de 2019.", false], ["C", "será reintegrado, pero sin pago de salarios, porque la medida provisional no era una sanción.", "El artículo 218 de la Ley 1952 de 2019 ordena expresamente pagar la remuneración dejada de percibir durante la suspensión.", false]]}]}, {"comp": "disciplinario", "rol": "tecnico", "tag": "Código General Disciplinario · Niveles técnico, administrativo y operativo · Notificaciones y comunicaciones", "texto": "Usted es técnico de la secretaría de una procuraduría provincial de instrucción. Debe dar a conocer varias decisiones de un mismo proceso: el auto de apertura de investigación contra una funcionaria municipal, quien no ha aceptado ser notificada por correo electrónico, y un auto de sustanciación que ordena incorporar al expediente un documento enviado por la alcaldía. En otro proceso, un auto interlocutorio nunca se notificó formalmente al investigado, pero este presentó luego un memorial en el que se refiere a su contenido, sin reclamar por la falta de notificación.", "items": [{"id": "DI-177", "niv": 1, "e": "Entre las decisiones que deben notificarse personalmente, según el código, están", "f": "Ley 1952 de 2019, arts. 121 y 129 (modificados por la Ley 2094 de 2021)", "o": [["A", "solo los fallos de primera y segunda instancia, porque todos los autos del proceso se notifican por estado electrónico.", "El artículo 121 de la Ley 1952 de 2019 incluye también la apertura, la vinculación y el pliego de cargos y su variación.", false], ["B", "los autos de apertura de investigación y de vinculación, el pliego de cargos y su variación, y los fallos.", "Se notifican personalmente los autos de apertura de investigación disciplinaria y de vinculación, el pliego de cargos y su variación, y los fallos de instancia (Ley 1952 de 2019, art. 121, modificado por la Ley 2094 de 2021).", true], ["C", "todas las decisiones del proceso, incluidos los autos de sustanciación y los de simple trámite.", "Las decisiones de sustanciación sin forma especial de notificación se comunican por el medio más eficaz (art. 129); la notificación personal se reserva a las decisiones del artículo 121.", false]]}, {"id": "DI-178", "niv": 2, "e": "Si la funcionaria no comparece a notificarse del auto de apertura dentro de los cinco días siguientes a la entrega de la citación en su última dirección registrada, procede", "f": "Ley 1952 de 2019, arts. 111 y 127 (modificado por la Ley 2094 de 2021, art. 23)", "o": [["A", "suspender la práctica de pruebas hasta que la funcionaria comparezca a la secretaría.", "El trámite de la notificación personal no suspende en ningún caso la actuación probatoria; las pruebas practicadas sin su presencia pueden ampliarse luego si lo pide (art. 111 de la Ley 1952 de 2019).", false], ["B", "notificarla por estado electrónico, que se inserta al día siguiente.", "El estado electrónico no sustituye la notificación personal del auto de apertura; para estas decisiones la ley prevé el edicto (arts. 111 y 127 de la Ley 1952 de 2019).", false], ["C", "notificarla por edicto, fijado en la secretaría por tres días.", "El auto de apertura que no pueda notificarse personalmente se notifica por edicto: si transcurridos cinco días desde la entrega de la citación en la última dirección registrada no comparece el disciplinable, se fija edicto en la secretaría por tres días (Ley 1952 de 2019, arts. 111 y 127, este modificado por la Ley 2094 de 2021).", true]]}, {"id": "DI-179", "niv": 2, "e": "El auto de sustanciación que ordena incorporar el documento enviado por la alcaldía se da a conocer", "f": "Ley 1952 de 2019, art. 129 (modificado por la Ley 2094 de 2021, art. 24)", "o": [["A", "mediante edicto fijado por tres días en un lugar visible de la secretaría.", "El edicto es subsidiario de la notificación personal de las decisiones del artículo 127; no es la forma prevista para autos de sustanciación.", false], ["B", "por comunicación a los sujetos procesales por el medio más eficaz, con constancia en el expediente.", "Las decisiones de sustanciación que no tengan una forma especial de notificación se comunican a los sujetos procesales por el medio más eficaz, y el secretario deja constancia en el expediente (Ley 1952 de 2019, art. 129, modificado por la Ley 2094 de 2021).", true], ["C", "mediante notificación personal, previa citación a la funcionaria investigada.", "La notificación personal se reserva a las decisiones del artículo 121; las de sustanciación se comunican (art. 129 de la Ley 1952 de 2019).", false]]}, {"id": "DI-180", "niv": 2, "e": "Respecto del auto interlocutorio que no se notificó formalmente en el otro proceso, la exigencia de notificación", "f": "Ley 1952 de 2019, arts. 120 y 128", "o": [["A", "se entiende cumplida por conducta concluyente, porque el investigado se refirió a su contenido sin reclamar.", "Cuando no se realizó la notificación o fue irregular, la exigencia se entiende cumplida si el disciplinado o su defensor no reclama y actúa en diligencias posteriores, interpone recursos o se refiere a la decisión o su contenido en escritos posteriores (Ley 1952 de 2019, art. 128).", true], ["B", "no se cumple, y debe declararse la nulidad de todo lo actuado desde la expedición del auto no notificado.", "La ley convalida la notificación por conducta concluyente (art. 128), por lo que no hay irregularidad que justifique la nulidad.", false], ["C", "solo se cumple si el investigado firma después un acta de notificación personal del auto.", "La conducta concluyente produce efectos por sí misma, para todos los efectos, sin necesidad de acta posterior (art. 128 de la Ley 1952 de 2019).", false]]}]}, {"comp": "disciplinario", "rol": "general", "tag": "Código General Disciplinario · Recursos: reposición, apelación y queja", "texto": "Usted es profesional universitario de la oficina de control disciplinario interno de una contraloría departamental. En una investigación, el instructor negó varias pruebas pedidas por el investigado. En otro proceso, ya en juicio, el funcionario de juzgamiento rechazó por extemporáneo el recurso de apelación que el defensor presentó contra el fallo de primera instancia, y el defensor sostiene que lo presentó a tiempo. En un tercer proceso, el auto que resolvió una solicitud de nulidad se notificó personalmente al investigado el martes 3 de marzo de 2026. Para los cálculos, considere días hábiles de lunes a viernes; no hay festivos en ese periodo.", "items": [{"id": "DI-181", "niv": 2, "e": "Contra la decisión que negó pruebas en la etapa de investigación procede el recurso de", "f": "Ley 1952 de 2019, arts. 133 (modificado por la Ley 2094 de 2021, art. 27), 134 y 136", "o": [["A", "queja, ante el superior, dentro del término de ejecutoria del auto.", "La queja procede solo contra la decisión que rechaza el recurso de apelación (art. 136 de la Ley 1952 de 2019).", false], ["B", "apelación en el efecto devolutivo, ante el superior funcional del instructor.", "La apelación procede contra la decisión que niega pruebas en la etapa de juicio, no en la de investigación (art. 134 de la Ley 1952 de 2019).", false], ["C", "reposición, ante el mismo funcionario que negó las pruebas.", "El recurso de reposición procede, entre otras, contra la decisión que niega las pruebas en la etapa de investigación (Ley 1952 de 2019, art. 133, modificado por la Ley 2094 de 2021).", true]]}, {"id": "DI-182", "niv": 1, "e": "Para controvertir el rechazo de su apelación, el defensor puede", "f": "Ley 1952 de 2019, arts. 136 y 137", "o": [["A", "interponer recurso de reposición dentro de los diez días siguientes a la notificación del rechazo.", "La reposición no procede contra el rechazo de la apelación (art. 133); el recurso previsto es la queja (art. 136).", false], ["B", "pedir al Procurador General la revocatoria directa del rechazo, en cualquier tiempo.", "La revocatoria directa recae sobre fallos sancionatorios, autos de archivo y fallos absolutorios en los casos legales (arts. 141 a 143), no sobre el rechazo de un recurso.", false], ["C", "interponer y sustentar el recurso de queja dentro del término de ejecutoria del rechazo.", "El recurso de queja procede contra la decisión que rechaza la apelación, y debe interponerse y sustentarse dentro del término de ejecutoria de esa decisión (Ley 1952 de 2019, arts. 136 y 137).", true]]}, {"id": "DI-183", "niv": 3, "e": "El último día para interponer reposición contra el auto que resolvió la nulidad es el", "f": "Ley 1952 de 2019, arts. 131 y 133 (modificados por la Ley 2094 de 2021, arts. 25 y 27)", "o": [["A", "viernes 6 de marzo de 2026.", "Corresponde a tres días hábiles; el término legal de los recursos de reposición y apelación es de cinco días siguientes a la notificación (art. 131 de la Ley 1952 de 2019).", false], ["B", "martes 10 de marzo de 2026.", "La reposición procede contra la decisión sobre la nulidad (art. 133) y se interpone hasta el vencimiento de los cinco días siguientes a la notificación (Ley 1952 de 2019, art. 131). Desde el miércoles 4 de marzo, cinco días hábiles vencen el martes 10 de marzo de 2026.", true], ["C", "martes 17 de marzo de 2026.", "Corresponde a diez días hábiles, término de la apelación del fallo en el juicio ordinario (art. 225G), no de la reposición (art. 131).", false]]}]}, {"comp": "disciplinario", "rol": "general", "tag": "Código General Disciplinario · Recurso de apelación y segunda instancia", "texto": "Usted es profesional universitario del despacho que conoce en segunda instancia de los procesos de una procuraduría provincial de juzgamiento. Llega una apelación interpuesta únicamente por un disciplinado contra el fallo que lo sancionó con suspensión de cuatro meses; el apelante solo discute la valoración de un testimonio. Llega también la apelación de una investigada contra la decisión que, en la etapa de juicio, le negó parte de las pruebas que había pedido; las demás pruebas que solicitó sí se decretaron.", "items": [{"id": "DI-184", "niv": 1, "e": "Al resolver la apelación del disciplinado sancionado con suspensión, la segunda instancia", "f": "Ley 1952 de 2019, arts. 135 y 234", "o": [["A", "no puede agravar la sanción impuesta, porque el disciplinado es apelante único.", "El superior, al resolver la apelación contra el fallo sancionatorio, no puede agravar la sanción cuando el investigado sea apelante único: prohibición de la reformatio in pejus (Ley 1952 de 2019, art. 135).", true], ["B", "debe revisar integralmente el fallo, incluso en lo no impugnado, y puede modificar la sanción en cualquier sentido.", "La apelación solo da competencia sobre lo impugnado y lo inescindiblemente vinculado (art. 234), y no permite agravar la sanción del apelante único (art. 135).", false], ["C", "puede aumentar la sanción si encuentra que la falta era más grave que la calificada.", "Cuando el investigado es apelante único, el superior no puede agravar la sanción impuesta (art. 135 de la Ley 1952 de 2019).", false]]}, {"id": "DI-185", "niv": 2, "e": "Sobre el trámite de esa segunda instancia, es correcto afirmar que el despacho debe decidir", "f": "Ley 1952 de 2019, arts. 225F y 234", "o": [["A", "por escrito, en un plazo de cuarenta y cinco días desde que recibe el expediente, limitándose a lo apelado y a lo inseparable de ello.", "El funcionario de segunda instancia decide por escrito dentro de los cuarenta y cinco días siguientes a la fecha en que recibió el proceso, y la apelación le da competencia solo sobre los aspectos impugnados y los inescindiblemente vinculados (Ley 1952 de 2019, art. 234).", true], ["B", "en audiencia pública, dentro de los diez días siguientes al recibo, sobre la totalidad de lo actuado en el proceso.", "La segunda instancia se decide por escrito en cuarenta y cinco días y se limita a lo impugnado y lo inescindiblemente vinculado (art. 234).", false], ["C", "dentro de los treinta días hábiles siguientes al recibo, sobre los aspectos que la segunda instancia estime relevantes.", "Treinta días hábiles es el término para fallar en primera instancia en el juicio ordinario (art. 225F); en segunda instancia son cuarenta y cinco días y la competencia está limitada (art. 234).", false]]}, {"id": "DI-186", "niv": 3, "e": "La apelación contra la decisión que negó parcialmente las pruebas pedidas por la investigada se concede en el efecto", "f": "Ley 1952 de 2019, art. 134", "o": [["A", "suspensivo.", "El efecto suspensivo se reserva para la apelación del archivo, del fallo de primera instancia y de la negación total de pruebas cuando no se decretaron de oficio (art. 134 de la Ley 1952 de 2019).", false], ["B", "diferido.", "El Código General Disciplinario no prevé el efecto diferido; distingue solo entre suspensivo y devolutivo (art. 134 de la Ley 1952 de 2019).", false], ["C", "devolutivo.", "Cuando la negación de pruebas pedidas por el disciplinado es parcial, o se niegan todas pero se decretan pruebas de oficio, la apelación se concede en el efecto devolutivo (Ley 1952 de 2019, art. 134, inciso 3).", true]]}]}, {"comp": "disciplinario", "rol": "profesional", "tag": "Código General Disciplinario · Niveles profesional, asesor y ejecutivo · Revocatoria directa", "texto": "Usted es profesional de una dependencia de la Procuraduría que proyecta las respuestas a solicitudes de revocatoria directa. Un servidor municipal fue sancionado en 2025 por la oficina de control disciplinario interno de su alcaldía; no interpuso ningún recurso y ahora pide la revocatoria del fallo, porque considera que se fundó en una norma que ya estaba derogada cuando se profirió. Otro servidor, sancionado por una personería, apeló el fallo, la apelación le fue resuelta desfavorablemente y ahora también pide la revocatoria.", "items": [{"id": "DI-187", "niv": 2, "e": "La autoridad competente para revocar el fallo sancionatorio proferido por la oficina de control interno de la alcaldía es", "f": "Ley 1952 de 2019, arts. 141 (modificado por la Ley 2094 de 2021, art. 28) y 236", "o": [["A", "el jefe de la misma oficina de control disciplinario interno que profirió el fallo.", "Bajo la Ley 1952 de 2019 la oficina que profirió el fallo no puede revocarlo: el artículo 141 (modificado por la Ley 2094 de 2021) y el artículo 142 atribuyen esa competencia a la Procuraduría General de la Nación.", false], ["B", "la Procuraduría General de la Nación, según sus competencias internas.", "Según el artículo 141 de la Ley 1952 de 2019 (modificado por el art. 28 de la Ley 2094 de 2021), los fallos sancionatorios de las personerías y de las oficinas de control interno disciplinario pueden ser revocados, de oficio o a petición del interesado, por la Procuraduría General de la Nación, según sus competencias internas; el artículo 142 reitera que la revocatoria de fallos sancionatorios, autos de archivo y fallos absolutorios es competencia de la Procuraduría.", true], ["C", "el alcalde municipal, en su calidad de nominador del servidor sancionado.", "El nominador ejecuta la sanción (art. 236), pero no tiene competencia para revocar fallos disciplinarios (art. 141).", false]]}, {"id": "DI-188", "niv": 3, "e": "La solicitud de revocatoria del servidor sancionado por la personería", "f": "Ley 1952 de 2019, arts. 141 y 144", "o": [["A", "procede, porque la revocatoria puede pedirse aunque se hayan agotado los recursos ordinarios.", "Es al revés: el artículo 144 de la Ley 1952 de 2019 condiciona la solicitud del sancionado a no haber interpuesto los recursos ordinarios.", false], ["B", "no procede, porque el sancionado interpuso recurso de apelación contra el fallo.", "El sancionado puede solicitar la revocatoria por una única vez, siempre y cuando no hubiere interpuesto contra el fallo los recursos ordinarios previstos en el código (Ley 1952 de 2019, art. 144).", true], ["C", "procede, siempre que se presente dentro de los cuatro meses siguientes a la ejecutoria del fallo.", "El plazo de cuatro meses del artículo 141 es para el quejoso, las víctimas o perjudicados; además, el sancionado que apeló no puede pedir la revocatoria (art. 144).", false]]}, {"id": "DI-189", "niv": 1, "e": "Para que proceda la revocatoria pedida por el primer servidor, debe demostrarse que el fallo", "f": "Ley 1952 de 2019, arts. 140 y 143", "o": [["A", "desconoce de modo evidente las normas que debían sustentarlo o lesiona claramente derechos fundamentales.", "Los fallos sancionatorios son revocables solo cuando infrinjan manifiestamente las normas constitucionales, legales o reglamentarias en que deban fundarse, o cuando vulneren o amenacen manifiestamente los derechos fundamentales (Ley 1952 de 2019, art. 143).", true], ["B", "contiene un error aritmético o un error en el nombre o la identidad del servidor sancionado.", "Esos errores se subsanan mediante corrección, aclaración o adición del fallo por el mismo funcionario (art. 140), no por revocatoria directa.", false], ["C", "se basó en pruebas que el sancionado considera insuficientes o mal valoradas por el funcionario.", "La mera inconformidad con la valoración probatoria no es causal; la revocatoria exige infracción manifiesta de normas o vulneración manifiesta de derechos fundamentales (art. 143).", false]]}]}, {"comp": "disciplinario", "rol": "general", "tag": "Código General Disciplinario · Doble conformidad y sentencia C-030 de 2023", "texto": "Usted es profesional universitario de la Procuraduría y prepara una charla de inducción sobre los cambios del régimen disciplinario. Le piden explicar tres puntos: qué garantiza la doble conformidad; cuál es la naturaleza de las funciones disciplinarias de la Procuraduría después de la sentencia C-030 de 2023 de la Corte Constitucional; y qué ocurre cuando la Procuraduría impone destitución e inhabilidad general a un alcalde que se encuentra en ejercicio del cargo.", "items": [{"id": "DI-190", "niv": 2, "e": "La doble conformidad garantiza que", "f": "Ley 1952 de 2019, art. 12 (modificado por la Ley 2094 de 2021, art. 3)", "o": [["A", "las decisiones de archivo sean confirmadas por el superior antes de quedar en firme.", "El código no prevé que el superior confirme los archivos antes de su firmeza: contra el archivo procede apelación (art. 134 de la Ley 1952 de 2019), y la doble conformidad se refiere a los fallos sancionatorios (art. 12).", false], ["B", "el disciplinado sea investigado y luego juzgado por dos funcionarios distintos dentro del mismo despacho.", "Eso corresponde a la separación entre instrucción y juzgamiento (art. 12, incisos 1 y 2), que es una garantía distinta de la doble conformidad.", false], ["C", "todo fallo sancionatorio pueda ser revisado por una autoridad diferente, con el trámite de la apelación.", "Todo disciplinable tiene derecho a que el fallo sancionatorio sea revisado por una autoridad diferente, con el trámite previsto para el recurso de apelación (Ley 1952 de 2019, art. 12, inciso 3, modificado por la Ley 2094 de 2021).", true]]}, {"id": "DI-191", "niv": 1, "e": "Según la sentencia C-030 de 2023, las funciones disciplinarias que ejerce la Procuraduría son de naturaleza", "f": "Corte Constitucional, Sentencia C-030 de 2023; Ley 1952 de 2019, art. 2", "o": [["A", "jurisdiccional, por atribución expresa de la Ley 2094 de 2021.", "La Corte declaró inexequibles las expresiones «jurisdiccionales» y «jurisdiccional» de los artículos 1, 54, 73 y 74 de la Ley 2094 de 2021 (Sentencia C-030 de 2023).", false], ["B", "mixta: jurisdiccional frente a elección popular y administrativa frente a los demás servidores.", "La Corte no adoptó un régimen mixto: la función es administrativa en todos los casos, y frente a elección popular exigió intervención del juez para la sanción definitiva (Sentencia C-030 de 2023).", false], ["C", "administrativa, no jurisdiccional.", "La sentencia C-030 de 2023 declaró inexequible la atribución de funciones jurisdiccionales y condicionó varias normas en el entendido de que las funciones disciplinarias de la Procuraduría son de naturaleza administrativa y no jurisdiccional.", true]]}, {"id": "DI-192", "niv": 3, "e": "Si la Procuraduría sanciona con destitución e inhabilidad general a un alcalde en ejercicio, esa sanción", "f": "Ley 1952 de 2019, arts. 2 y 238D; Corte Constitucional, Sentencia C-030 de 2023", "o": [["A", "solo puede ser revisada por un juez si el alcalde interpone una acción de tutela contra el fallo.", "La revisión judicial opera por ministerio de la ley, de manera automática, sin necesidad de tutela (Sentencia C-030 de 2023).", false], ["B", "se somete a revisión automática ante la jurisdicción contencioso administrativa y su ejecución se suspende mientras se decide.", "La C-030 de 2023 condicionó los arts. 1 y 54 de la Ley 2094 de 2021: la destitución, suspensión e inhabilidad de servidores de elección popular las determina definitivamente el juez contencioso administrativo, mediante el recurso extraordinario de revisión que opera de manera automática e inmediata (ante el Consejo de Estado o el tribunal administrativo, según la autoridad que sancionó, art. 238B), y la ejecución se suspende durante ese trámite (Ley 1952 de 2019, arts. 2 y 238D).", true], ["C", "se ejecuta de inmediato por el gobernador, una vez queda en firme en la Procuraduría.", "Para servidores de elección popular, la ejecución se supedita a lo que decida la autoridad judicial y se suspende durante la revisión (art. 2 de la Ley 1952 de 2019; art. 238D; Sentencia C-030 de 2023).", false]]}]}, {"comp": "contratacion", "rol": "general", "tag": "Contratación estatal · Principios: planeación, transparencia y responsabilidad", "texto": "Usted es profesional de la Secretaría de Infraestructura de una alcaldía municipal. El secretario quiere abrir este mes una licitación pública para construir un puente peatonal; como aún no hay estudios ni diseños, propone que el futuro contratista se encargue del diseño y de la construcción. En el borrador del pliego, la oficina jurídica incluyó una cláusula según la cual el contratista renuncia a cualquier reclamación por errores en los planos topográficos que la propia alcaldía elaboró y le entregará. Además, un concejal recuerda que, en una licitación anterior, varios criterios de evaluación quedaron redactados de forma tan ambigua que el comité terminó decidiendo con apreciaciones subjetivas.", "items": [{"id": "CE-101", "niv": 2, "e": "Sobre la propuesta de abrir la licitación sin estudios ni diseños, lo correcto es advertir que", "f": "Ley 80 de 1993, art. 25, num. 12 (modificado por la Ley 1474 de 2011, art. 87)", "o": [["A", "previo a la apertura debe contar con estudios y diseños que establezcan la viabilidad del proyecto, aunque el objeto incluya el diseño.", "El numeral 12 del artículo 25 de la Ley 80, modificado por el artículo 87 de la Ley 1474 de 2011, exige que, cuando el objeto incluya una obra, la entidad cuente antes de la apertura con los estudios y diseños que permitan establecer la viabilidad del proyecto y su impacto social, económico y ambiental, y aclara que la regla aplica incluso a los contratos que incluyen el diseño.", true], ["B", "es viable, porque cuando el contrato incluye diseño y construcción los estudios quedan a cargo del contratista seleccionado.", "La misma norma dispone expresamente que la exigencia de estudios y diseños previos se aplica también a los contratos que incluyen el diseño dentro de su objeto.", false], ["C", "basta con que los estudios y diseños estén terminados antes de firmar el acta de inicio, pues la viabilidad se verifica durante la ejecución.", "El momento que fija la ley es anterior a la apertura del proceso de selección, no el inicio de la ejecución; abrir sin esos estudios desconoce el principio de planeación (art. 25, num. 12, Ley 80).", false]]}, {"id": "CE-102", "niv": 3, "e": "La cláusula de renuncia a reclamaciones por errores en los planos que entregue la alcaldía", "f": "Ley 80 de 1993, art. 24, num. 5, lit. d) e inciso final; Ley 1150 de 2007, art. 4", "o": [["A", "es válida si el proponente la acepta de manera expresa al presentar su oferta, porque se trata de una renuncia voluntaria.", "La ineficacia opera de pleno derecho por mandato del artículo 24 de la Ley 80; la aceptación del proponente no sanea una estipulación que la ley excluye.", false], ["B", "es ineficaz de pleno derecho, porque el pliego no puede eximir a la entidad por los datos que suministra ni imponer renuncias a reclamarlos.", "El literal d) del numeral 5 del artículo 24 de la Ley 80 prohíbe incluir en los pliegos exenciones de la responsabilidad derivada de los datos, informes y documentos que se suministren, y el inciso final declara ineficaces de pleno derecho las estipulaciones que lo contravengan o que dispongan renuncias a reclamaciones por esos hechos.", true], ["C", "es válida, porque traslada al contratista un riesgo previsible que debe asumir en el contrato de obra según la matriz de riesgos del pliego.", "La asignación de riesgos previsibles (art. 4 de la Ley 1150) no autoriza a la entidad a exonerarse de responder por la información que ella misma entrega; esa exoneración está prohibida por el artículo 24, numeral 5, literal d), de la Ley 80.", false]]}, {"id": "CE-103", "niv": 1, "e": "Frente a la licitación anterior con criterios ambiguos, el principio de responsabilidad implica que", "f": "Ley 80 de 1993, art. 26, num. 3; Decreto 1082 de 2015, art. 2.2.1.1.2.2.3", "o": [["A", "la entidad y sus servidores responden cuando los pliegos se elaboran de forma ambigua o confusa y conducen a decisiones subjetivas.", "El numeral 3 del artículo 26 de la Ley 80 dispone que las entidades y los servidores públicos responden cuando los pliegos se elaboran en forma incompleta, ambigua o confusa que conduzca a interpretaciones o decisiones de carácter subjetivo.", true], ["B", "la responsabilidad recae en el comité evaluador y no en la entidad, porque fue el comité el que calificó las ofertas con esos criterios.", "El artículo 26, numeral 3, de la Ley 80 atribuye la responsabilidad a la entidad y a los servidores por pliegos ambiguos; además, el carácter asesor del comité no lo exime de su propia responsabilidad (Decreto 1082 de 2015, art. 2.2.1.1.2.2.3), pero tampoco traslada a él la de la entidad.", false], ["C", "los servidores únicamente responden si el contrato adjudicado termina en incumplimiento del contratista.", "La responsabilidad que prevé el artículo 26, numeral 3, de la Ley 80 surge de haber elaborado pliegos ambiguos que llevan a decisiones subjetivas, con independencia de cómo se ejecute luego el contrato.", false]]}]}, {"comp": "contratacion", "rol": "general", "tag": "Contratación estatal · Competencia y delegación para contratar", "texto": "El gobernador de un departamento expidió un decreto por el cual delega en el secretario general, empleo del nivel directivo, la competencia para celebrar los contratos de la gobernación hasta cierta cuantía. Ahora quiere delegar también en un profesional universitario de la Secretaría General la firma de los contratos de prestación de servicios, para descongestionar el despacho. Paralelamente, la gobernación tiene en ejecución un contrato de obra adjudicado a una unión temporal de tres sociedades, que en su oferta señalaron los términos y la extensión de la participación de cada una. Usted es profesional de la oficina jurídica y debe absolver las consultas del despacho.", "items": [{"id": "CE-104", "niv": 1, "e": "Sobre la intención de delegar la celebración de contratos en un profesional universitario, usted debe conceptuar que", "f": "Ley 80 de 1993, art. 12", "o": [["A", "es posible, porque el gobernador puede delegar en cualquier servidor de la planta de personal mediante un decreto debidamente motivado.", "El artículo 12 de la Ley 80 limita los posibles delegatarios a los servidores de los niveles directivo o ejecutivo o sus equivalentes; no basta con que sea un servidor de planta.", false], ["B", "es posible, siempre que el profesional tenga título de abogado y experiencia en contratación estatal.", "La ley no condiciona la delegación a la formación del servidor sino al nivel del empleo (directivo o ejecutivo o equivalentes), según el artículo 12 de la Ley 80.", false], ["C", "no es posible, porque la delegación procede en servidores de los niveles directivo o ejecutivo o sus equivalentes.", "El artículo 12 de la Ley 80 permite a los jefes y representantes legales delegar total o parcialmente la competencia para celebrar contratos en los servidores que desempeñen cargos del nivel directivo o ejecutivo o sus equivalentes; un profesional universitario no pertenece a esos niveles.", true]]}, {"id": "CE-105", "niv": 2, "e": "Si un contrato celebrado por el secretario general como delegatario presenta irregularidades, frente al gobernador es correcto afirmar que", "f": "Ley 80 de 1993, art. 12, inc. 2 (adicionado por la Ley 1150 de 2007, art. 21)", "o": [["A", "debe ratificar por escrito cada contrato firmado por el delegatario para que el contrato pueda producir efectos jurídicos.", "Ninguna norma exige la ratificación del delegante; el contrato celebrado por el delegatario dentro de la delegación produce efectos por sí mismo. Lo que subsiste es el deber de control y vigilancia.", false], ["B", "la delegación no lo exonera de sus deberes de control y vigilancia de la actividad precontractual y contractual.", "El inciso 2 del artículo 12 de la Ley 80, adicionado por el artículo 21 de la Ley 1150 de 2007, dispone que en ningún caso los jefes y representantes legales quedan exonerados, por virtud de la delegación, de sus deberes de control y vigilancia de la actividad precontractual y contractual.", true], ["C", "queda exento de toda responsabilidad, porque con la delegación la competencia pasó por completo al delegatario.", "Aunque la competencia se traslada al delegatario, la ley mantiene en cabeza del delegante los deberes de control y vigilancia (art. 12, inc. 2, Ley 80).", false]]}, {"id": "CE-106", "niv": 2, "e": "Si la unión temporal incumple el contrato de obra, las sanciones derivadas del incumplimiento", "f": "Ley 80 de 1993, art. 7, nums. 6 y 7 (modificado por la Ley 2160 de 2021, art. 3)", "o": [["A", "se impondrán por igual a todos los integrantes, porque en la unión temporal las omisiones de uno afectan a todos los demás.", "Esa regla corresponde al consorcio, en el que las actuaciones, hechos y omisiones afectan a todos sus miembros; en la unión temporal las sanciones se individualizan según la participación (art. 7, Ley 80).", false], ["B", "recaerán sobre el representante designado por la unión temporal, que responde en nombre de todos.", "El representante actúa por la unión temporal, pero la ley ordena imponer las sanciones de acuerdo con la participación de cada integrante en la ejecución (art. 7, Ley 80).", false], ["C", "se impondrán a cada integrante según su participación en la ejecución, aunque todos respondan solidariamente.", "El artículo 7 de la Ley 80 (modificado por la Ley 2160 de 2021) define la unión temporal: sus miembros responden solidariamente por el cumplimiento total de la propuesta y del objeto, pero las sanciones por incumplimiento se imponen según la participación en la ejecución de cada uno.", true]]}]}, {"comp": "contratacion", "rol": "general", "tag": "Contratación estatal · Inhabilidades e incompatibilidades", "texto": "Usted es profesional universitario de la oficina de contratación de una alcaldía. Llegan tres situaciones: (i) el hermano de la esposa del secretario de Hacienda municipal ofrece sus servicios como contador; (ii) quien fue jefe de la oficina asesora jurídica de la alcaldía, empleo del nivel asesor, y se retiró hace siete meses, quiere presentar oferta en un proceso de la misma alcaldía; y (iii) un contratista persona natural que ejecuta un contrato de mantenimiento con la alcaldía fue sancionado con destitución por haber abandonado injustificadamente un empleo público anterior, y la decisión ya quedó en firme.", "items": [{"id": "CE-107", "niv": 2, "e": "Respecto del hermano de la esposa del secretario de Hacienda, lo procedente es indicar que", "f": "Ley 80 de 1993, art. 8, num. 2, lit. b)", "o": [["A", "no puede contratar con la alcaldía, porque es pariente en segundo grado de afinidad de un servidor del nivel directivo.", "El literal b) del numeral 2 del artículo 8 de la Ley 80 impide contratar con la entidad respectiva a quienes tengan parentesco hasta el segundo grado de afinidad con sus servidores de los niveles directivo, asesor o ejecutivo. El cuñado está en segundo grado de afinidad y el secretario de Hacienda pertenece al nivel directivo.", true], ["B", "puede contratar, porque la inhabilidad por afinidad llega únicamente hasta el primer grado.", "La norma cubre el parentesco hasta el segundo grado de afinidad (art. 8, num. 2, lit. b, Ley 80), grado en el que se encuentra el hermano del cónyuge.", false], ["C", "puede contratar si el secretario de Hacienda se declara impedido y se aparta de todas las etapas del proceso de selección y de la supervisión.", "Declararse impedido resuelve un conflicto de interés del servidor, pero no elimina la inhabilidad del pariente, que opera frente a la entidad por mandato del artículo 8 de la Ley 80.", false]]}, {"id": "CE-108", "niv": 3, "e": "En cuanto al exjefe de la oficina asesora jurídica, usted debe advertir que", "f": "Ley 80 de 1993, art. 8, num. 2, lit. a)", "o": [["A", "puede participar, siempre que no haya intervenido en la elaboración de los estudios previos de ese proceso.", "La incompatibilidad no depende de haber intervenido en el proceso: opera por haber sido servidor de esos niveles en la entidad durante el año siguiente al retiro (art. 8, num. 2, lit. a, Ley 80).", false], ["B", "no puede presentar oferta ni contratar con la alcaldía hasta que se cumpla un año contado desde su retiro.", "El literal a) del numeral 2 del artículo 8 de la Ley 80 impide contratar con la entidad a quienes fueron sus servidores en los niveles directivo, asesor o ejecutivo, por el término de un año contado desde la fecha del retiro. Solo han pasado siete meses.", true], ["C", "puede participar, porque la incompatibilidad de los exservidores cobija únicamente los empleos del nivel directivo.", "La incompatibilidad del literal a) del numeral 2 del artículo 8 de la Ley 80 comprende los niveles directivo, asesor y ejecutivo; el empleo era del nivel asesor.", false]]}, {"id": "CE-109", "niv": 1, "e": "Frente al contratista sancionado con destitución, lo que prevé la ley es que", "f": "Ley 80 de 1993, arts. 8, num. 1, lit. d) y 9 (modificado por la Ley 2014 de 2019, art. 6)", "o": [["A", "ceda el contrato con autorización previa y escrita de la alcaldía o, si ello no es posible, renuncie a su ejecución.", "La destitución genera inhabilidad (art. 8, num. 1, lit. d, Ley 80) y, como sobrevino durante la ejecución, aplica el artículo 9 de la Ley 80, modificado por la Ley 2014 de 2019: el contratista cede el contrato previa autorización escrita de la entidad o, si no es posible, renuncia a su ejecución.", true], ["B", "la alcaldía declare la caducidad del contrato y lo liquide en el estado en que se encuentre.", "La caducidad procede por incumplimiento grave del contratista que pueda paralizar el contrato (art. 18, Ley 80), no por una inhabilidad sobreviniente, que tiene su propia regla en el artículo 9.", false], ["C", "continúe ejecutándolo hasta el final, porque la inhabilidad no afecta los contratos celebrados antes de que se impusiera la sanción.", "El artículo 9 de la Ley 80 regula precisamente la inhabilidad que sobreviene durante la ejecución y ordena la cesión o la renuncia; el contratista no puede seguir ejecutándolo como si nada.", false]]}]}, {"comp": "contratacion", "rol": "general", "tag": "Contratación estatal · Modalidades de selección", "texto": "Usted es profesional de la Secretaría General de una alcaldía y revisa el Plan Anual de Adquisiciones. Hay tres necesidades: (i) comprar resmas de papel, tóner y útiles de oficina por un valor superior a la menor cuantía de la entidad; son bienes con las mismas especificaciones técnicas y patrones de calidad objetivamente definidos, y no existe un acuerdo marco de precios vigente para ellos; (ii) contratar los estudios y diseños para la ampliación de la plaza de mercado, por un valor superior a la mínima cuantía; y (iii) tomar en arriendo una bodega para el archivo central, porque el contrato de arrendamiento actual vence en tres meses y el propietario no lo renovará.", "items": [{"id": "CE-110", "niv": 1, "e": "Para adquirir el papel, el tóner y los útiles de oficina, la modalidad que corresponde es", "f": "Ley 1150 de 2007, art. 2, num. 2, lit. a)", "o": [["A", "la licitación pública, porque el valor de la compra supera la menor cuantía de la entidad y no hay acuerdo marco vigente.", "La causal de bienes de características técnicas uniformes no depende del valor; superar la menor cuantía no obliga a licitar cuando existe una causal de selección abreviada por el objeto (art. 2, num. 2, lit. a, Ley 1150).", false], ["B", "la mínima cuantía, porque se trata de bienes de consumo para el funcionamiento de la entidad.", "La mínima cuantía depende del valor (que no exceda el 10 % de la menor cuantía), no de que los bienes sean de consumo (art. 2, num. 5, Ley 1150); aquí el valor supera incluso la menor cuantía.", false], ["C", "la selección abreviada para la adquisición de bienes de características técnicas uniformes y de común utilización.", "El literal a) del numeral 2 del artículo 2 de la Ley 1150 prevé la selección abreviada para bienes y servicios de características técnicas uniformes y de común utilización, es decir, los que tienen las mismas especificaciones técnicas y comparten patrones de desempeño y calidad objetivamente definidos.", true]]}, {"id": "CE-111", "niv": 2, "e": "En el proceso para contratar los estudios y diseños de la plaza de mercado, la alcaldía", "f": "Ley 1150 de 2007, art. 2, num. 3 y art. 5, num. 4; Decreto 1082 de 2015, art. 2.2.1.2.1.3.1", "o": [["A", "debe acudir al concurso de méritos y no puede incluir el precio como factor de escogencia.", "Los estudios y diseños son consultoría (art. 32, num. 2, Ley 80), que se contrata por concurso de méritos (art. 2, num. 3, Ley 1150; Decreto 1082 de 2015, art. 2.2.1.2.1.3.1). El numeral 4 del artículo 5 de la Ley 1150 prohíbe incluir el precio como factor de escogencia en la selección de consultores.", true], ["B", "puede acudir a la selección abreviada de menor cuantía y escoger la oferta de menor precio.", "La consultoría tiene una modalidad propia, el concurso de méritos, sin importar que su valor esté dentro de la menor cuantía (art. 2, num. 3, Ley 1150).", false], ["C", "debe acudir al concurso de méritos y darle al precio el mayor puntaje, en aplicación del principio de economía.", "En la selección de consultores se califican aspectos técnicos y la experiencia; la ley prohíbe usar el precio como factor de escogencia (art. 5, num. 4, Ley 1150).", false]]}, {"id": "CE-112", "niv": 3, "e": "Para tomar en arriendo la bodega del archivo, la modalidad aplicable es", "f": "Ley 1150 de 2007, art. 2, num. 4, lit. i); Decreto 1082 de 2015, art. 2.2.1.2.1.4.11; Colombia Compra Eficiente, Manual de la modalidad de selección de mínima cuantía", "o": [["A", "la mínima cuantía, si el canon anual no supera el 10 % de la menor cuantía de la alcaldía.", "Cuando concurre una causal de contratación directa, como el arrendamiento de inmuebles, esta prevalece sobre la mínima cuantía, según el Manual de mínima cuantía de Colombia Compra Eficiente.", false], ["B", "la contratación directa, por tratarse del arrendamiento de un inmueble.", "El literal i) del numeral 4 del artículo 2 de la Ley 1150 incluye el arrendamiento o adquisición de inmuebles entre las causales de contratación directa, desarrolladas en el artículo 2.2.1.2.1.4.11 del Decreto 1082 de 2015.", true], ["C", "la selección abreviada de menor cuantía, previa invitación a varios propietarios de bodegas.", "El arrendamiento de inmuebles tiene causal propia de contratación directa (art. 2, num. 4, lit. i, Ley 1150), de modo que no se acude a la selección abreviada por la cuantía.", false]]}]}, {"comp": "contratacion", "rol": "profesional", "tag": "Contratación estatal · Niveles profesional, asesor y ejecutivo · Cuantías de la entidad", "texto": "Usted es profesional de la oficina de contratación de un municipio cuyo presupuesto anual aprobado para 2026 es de $350.000.000.000. El salario mínimo legal mensual vigente (SMMLV) para 2026 es de $1.750.905. La oficina debe fijar las cuantías del año y definir la modalidad de dos procesos: el mantenimiento preventivo del parque automotor, con presupuesto oficial de $60.000.000, y la construcción de un centro de acopio, con presupuesto oficial de $900.000.000. Ninguno de los dos encaja en una causal de contratación directa ni en una causal de selección abreviada distinta de la menor cuantía.", "items": [{"id": "CE-113", "niv": 2, "e": "La menor cuantía del municipio para 2026 asciende a", "f": "Ley 1150 de 2007, art. 2, num. 2, lit. b); Decreto 1469 de 2025 (SMMLV 2026); Colombia Compra Eficiente, Manual de la modalidad de selección de mínima cuantía", "o": [["A", "$490.253.400.", "Equivale a 280 SMMLV, tope de las entidades con presupuesto inferior a 120.000 SMMLV. El presupuesto del municipio equivale a unos 199.896 SMMLV (350.000.000.000 / 1.750.905), es decir, está en el rango siguiente.", false], ["B", "$787.907.250.", "El presupuesto equivale a unos 199.896 SMMLV, que está entre 120.000 y 400.000 SMMLV; para ese rango la menor cuantía es de hasta 450 SMMLV (art. 2, num. 2, lit. b, Ley 1150): 450 × $1.750.905 = $787.907.250.", true], ["C", "$1.138.088.250.", "Equivale a 650 SMMLV, tope que corresponde a entidades con presupuesto igual o superior a 400.000 SMMLV e inferior a 850.000 SMMLV, rango que el municipio no alcanza.", false]]}, {"id": "CE-114", "niv": 3, "e": "Para el mantenimiento preventivo del parque automotor, la modalidad que corresponde es", "f": "Ley 1150 de 2007, art. 2, num. 2, lit. b) y num. 5 (modificado por la Ley 2069 de 2020, art. 30)", "o": [["A", "la licitación pública, porque se trata de un servicio que no tiene características técnicas uniformes.", "Que el servicio no sea uniforme no obliga a licitar: por su valor, inferior al 10 % de la menor cuantía, corresponde la mínima cuantía (art. 2, num. 5, Ley 1150).", false], ["B", "la selección abreviada de menor cuantía, porque el valor está por debajo de 450 SMMLV.", "La selección abreviada de menor cuantía se usa por encima de la mínima cuantía y hasta la menor cuantía; los procesos que no exceden el 10 % de la menor cuantía van por mínima cuantía (art. 2, num. 5, Ley 1150).", false], ["C", "la mínima cuantía, porque el valor no supera el 10 % de la menor cuantía del municipio.", "La mínima cuantía es el 10 % de la menor cuantía: 45 SMMLV, es decir, $78.790.725. Como $60.000.000 no excede ese valor, se aplica la modalidad de mínima cuantía, independientemente del objeto (art. 2, num. 5, Ley 1150).", true]]}, {"id": "CE-115", "niv": 3, "e": "Para la construcción del centro de acopio, la modalidad que corresponde es", "f": "Ley 1150 de 2007, art. 2, nums. 1 y 2, lit. b); Decreto 1082 de 2015, art. 2.2.1.2.1.3.1", "o": [["A", "el concurso de méritos, porque la construcción requiere conocimientos especializados.", "El concurso de méritos es para consultoría y proyectos de arquitectura (Decreto 1082 de 2015, art. 2.2.1.2.1.3.1), no para la ejecución de una obra.", false], ["B", "la selección abreviada de menor cuantía, porque el valor es inferior a 650 SMMLV.", "El tope de 650 SMMLV no corresponde a este municipio; su menor cuantía es de 450 SMMLV ($787.907.250) y los $900.000.000 (unos 514 SMMLV) la superan.", false], ["C", "la licitación pública, porque el valor supera la menor cuantía del municipio.", "El presupuesto de $900.000.000 supera la menor cuantía ($787.907.250) y no hay otra causal de selección abreviada ni de contratación directa, de modo que aplica la regla general: licitación pública (art. 2, num. 1, Ley 1150).", true]]}]}, {"comp": "contratacion", "rol": "general", "tag": "Contratación estatal · Mínima cuantía", "texto": "La Secretaría General de la Procuraduría General de la Nación necesita comprar sillas ergonómicas para una procuraduría regional, por un valor que no supera su mínima cuantía. Usted, profesional del grupo de contratación, prepara la invitación en el SECOP II. Al vencer el plazo se reciben tres ofertas: la de menor precio no acredita la experiencia mínima exigida en la invitación ni la subsana en el término fijado para ello; la de segundo menor precio cumple todas las condiciones. Un oferente pregunta si debía aportar el certificado del Registro Único de Proponentes (RUP) y una póliza de seriedad de la oferta.", "items": [{"id": "CE-116", "niv": 1, "e": "La invitación de este proceso debe publicarse por un término", "f": "Ley 1150 de 2007, art. 2, num. 5, lit. a); Decreto 1082 de 2015, art. 2.2.1.2.1.5.2, num. 3", "o": [["A", "no inferior a un día hábil, para que los interesados conozcan su contenido y formulen observaciones.", "El literal a) del numeral 5 del artículo 2 de la Ley 1150 y el numeral 3 del artículo 2.2.1.2.1.5.2 del Decreto 1082 de 2015 disponen que la invitación de mínima cuantía se publica por un término no inferior a un día hábil para que los interesados se informen y formulen observaciones.", true], ["B", "no inferior a diez días hábiles, igual que el proyecto de pliego de la licitación pública.", "Los diez días hábiles son el término de observaciones al proyecto de pliego en la licitación pública; la mínima cuantía tiene un procedimiento abreviado con invitación de al menos un día hábil.", false], ["C", "no inferior a cinco días hábiles, igual que el proyecto de pliego de condiciones en la selección abreviada.", "Los cinco días hábiles corresponden a las observaciones al proyecto de pliego en la selección abreviada y el concurso de méritos (Decreto 1082, art. 2.2.1.1.2.1.4), no a la invitación de mínima cuantía.", false]]}, {"id": "CE-117", "niv": 2, "e": "Frente a las ofertas recibidas, la Procuraduría debe", "f": "Ley 1150 de 2007, art. 2, num. 5, lit. c); Decreto 1082 de 2015, art. 2.2.1.2.1.5.2, nums. 5 y 7", "o": [["A", "declarar desierto el proceso, porque la oferta de menor precio no cumplió y la invitación no permite pasar a la siguiente oferta.", "La norma prevé expresamente pasar a la oferta con el segundo mejor precio cuando la primera no cumple (Decreto 1082, art. 2.2.1.2.1.5.2, num. 5).", false], ["B", "aceptar la oferta de segundo menor precio, porque la de menor precio no cumplió las condiciones de la invitación.", "El artículo 2.2.1.2.1.5.2 del Decreto 1082 de 2015 ordena verificar que la oferta de menor precio cumpla; si no cumple, se verifica la del segundo mejor precio, y así sucesivamente, y se acepta la de menor precio que cumpla las condiciones (nums. 5 y 7).", true], ["C", "asignar puntaje a la experiencia de las tres ofertas y aceptar la que obtenga el mayor puntaje.", "En la mínima cuantía no se ponderan factores: se acepta la oferta de menor precio que cumpla las condiciones de la invitación (art. 2, num. 5, lit. c, Ley 1150).", false]]}, {"id": "CE-118", "niv": 2, "e": "A la pregunta del oferente sobre el RUP y la póliza de seriedad, la respuesta correcta es que", "f": "Ley 1150 de 2007, arts. 6, inc. 2 y 7; Decreto 1082 de 2015, art. 2.2.1.2.1.5.5", "o": [["A", "en la mínima cuantía no se exige el RUP y la Procuraduría es libre de exigir o no garantías.", "El inciso 2 del artículo 6 de la Ley 1150 excluye del RUP los contratos de mínima cuantía, y el artículo 2.2.1.2.1.5.5 del Decreto 1082 de 2015 deja a la entidad en libertad de exigir o no garantías en ese proceso.", true], ["B", "el RUP es obligatorio en todo proceso de selección, aunque las garantías no se exigen en la mínima cuantía.", "La Ley 1150 (art. 6, inc. 2) excluye expresamente del RUP la mínima cuantía, entre otros casos; en ellos la entidad verifica directamente las condiciones del proponente.", false], ["C", "el RUP no se exige, pero la garantía de seriedad es obligatoria en todas las modalidades de selección.", "En la mínima cuantía la entidad decide si exige garantías (Decreto 1082, art. 2.2.1.2.1.5.5); la garantía de seriedad no es obligatoria en ella.", false]]}]}, {"comp": "contratacion", "rol": "general", "tag": "Contratación estatal · Prestación de servicios profesionales", "texto": "Una alcaldía municipal necesita un abogado que la represente judicialmente en procesos laborales durante seis meses, pues su planta de personal no tiene empleos con esa función. El jefe de la oficina jurídica le pregunta a usted, profesional de contratación, si es necesario pedir tres cotizaciones antes de escoger al abogado, si debe expedirse un acto administrativo de justificación de la contratación directa y si, al vencer el plazo, el contrato debe liquidarse obligatoriamente.", "items": [{"id": "CE-119", "niv": 1, "e": "Para escoger al abogado, la alcaldía", "f": "Ley 1150 de 2007, art. 2, num. 4, lit. h); Decreto 1082 de 2015, art. 2.2.1.2.1.4.9", "o": [["A", "debe adelantar un concurso de méritos, porque el objeto exige conocimientos jurídicos especializados.", "El concurso de méritos es para consultoría; los servicios profesionales son de naturaleza intelectual distinta de la consultoría y se contratan directamente (Decreto 1082, art. 2.2.1.2.1.4.9).", false], ["B", "debe solicitar al menos tres cotizaciones y escoger la de menor valor, por tratarse de contratación directa.", "El artículo 2.2.1.2.1.4.9 del Decreto 1082 de 2015 dispone expresamente que en estos contratos no es necesario haber obtenido previamente varias ofertas.", false], ["C", "puede contratar directamente a quien acredite la idoneidad o experiencia requerida, sin pedir varias ofertas.", "El literal h) del numeral 4 del artículo 2 de la Ley 1150 prevé la contratación directa para servicios profesionales, y el artículo 2.2.1.2.1.4.9 del Decreto 1082 de 2015 dispone que no es necesario obtener previamente varias ofertas, siempre que se verifique la idoneidad o experiencia; el ordenador del gasto deja constancia escrita.", true]]}, {"id": "CE-120", "niv": 3, "e": "Para contratar al abogado, el acto administrativo de justificación de la contratación directa", "f": "Decreto 1082 de 2015, arts. 2.2.1.2.1.4.1 y 2.2.1.2.1.4.2; Ley 80 de 1993, art. 25, num. 12", "o": [["A", "no es necesario cuando el contrato es de prestación de servicios profesionales y de apoyo a la gestión.", "El artículo 2.2.1.2.1.4.1 del Decreto 1082 de 2015 regula el acto de justificación de la contratación directa y aclara que no es necesario cuando el contrato es de prestación de servicios profesionales y de apoyo a la gestión.", true], ["B", "es obligatorio en este caso y debe indicar la causal, el objeto, el presupuesto y el lugar donde se consultan los estudios previos.", "Ese es el contenido del acto en las demás causales de contratación directa, pero la misma norma lo exceptúa para los contratos de prestación de servicios profesionales y de apoyo a la gestión (Decreto 1082, art. 2.2.1.2.1.4.1).", false], ["C", "reemplaza los estudios previos, que en esta causal no deben elaborarse.", "Los estudios previos se exigen antes de la firma en la contratación directa (art. 25, num. 12, Ley 80); la excepción de no elaborarlos es propia de la urgencia manifiesta (Decreto 1082, art. 2.2.1.2.1.4.2).", false]]}, {"id": "CE-121", "niv": 2, "e": "En cuanto a la liquidación del contrato del abogado, la ley dispone que", "f": "Ley 80 de 1993, art. 60 (modificado por el Decreto Ley 019 de 2012, art. 217); Colombia Compra Eficiente, Guía para la liquidación de los Procesos de Contratación", "o": [["A", "procede únicamente si el contratista la solicita por escrito antes de terminar el plazo.", "La ley no supedita la liquidación a una solicitud del contratista; simplemente dispone que en estos contratos no es obligatoria (art. 60, Ley 80).", false], ["B", "debe hacerse dentro de los cuatro meses siguientes al vencimiento del plazo, como en todo contrato de tracto sucesivo.", "El término de cuatro meses del artículo 11 de la Ley 1150 se aplica a los contratos que deben liquidarse; para estos contratos la liquidación no es obligatoria (art. 60, Ley 80).", false], ["C", "no es obligatoria en los contratos de prestación de servicios profesionales y de apoyo a la gestión.", "El artículo 60 de la Ley 80, modificado por el artículo 217 del Decreto Ley 019 de 2012, señala que la liquidación no será obligatoria en los contratos de prestación de servicios profesionales y de apoyo a la gestión; así lo recoge la Guía de liquidación de Colombia Compra Eficiente.", true]]}]}, {"comp": "contratacion", "rol": "tecnico", "tag": "Contratación estatal · Niveles técnico, administrativo y operativo · Pagos a contratistas de prestación de servicios", "texto": "Usted es técnico administrativo de la oficina financiera de una gobernación y recibe las cuentas de cobro mensuales de los contratistas de apoyo a la gestión. Una contratista presenta su cuenta con la certificación de cumplimiento firmada por el supervisor, pero sin la planilla que acredite el pago de los aportes a seguridad social del período. Otro contratista entrega su cuenta con un error de cálculo en el valor de la cuota mensual. Un tercero le pregunta si, al terminar su contrato, tiene derecho a que le paguen prima de servicios y vacaciones.", "items": [{"id": "CE-122", "niv": 1, "e": "Ante la cuenta presentada sin la planilla de aportes, usted debe", "f": "Ley 80 de 1993, art. 41, inc. 2 y par. 1 (modificados por la Ley 1150 de 2007, art. 23)", "o": [["A", "tramitar el pago, porque la certificación del supervisor basta para acreditar el cumplimiento de todas las obligaciones del contratista.", "La certificación de cumplimiento del supervisor no sustituye la acreditación del pago de aportes a seguridad social, que la ley exige de manera específica para cada pago (art. 41, par. 1, Ley 80).", false], ["B", "verificar que la contratista acredite el pago de los aportes a seguridad social antes de tramitar ese pago.", "El inciso 2 y el parágrafo 1 del artículo 41 de la Ley 80, modificados por el artículo 23 de la Ley 1150 de 2007, exigen que el contratista acredite estar al día en los aportes al Sistema de Seguridad Social Integral para la realización de cada pago; el servidor que sin justa causa no lo verifique incurre en causal de mala conducta.", true], ["C", "tramitar el pago, porque el pago de aportes se verifica una sola vez, al momento de firmar el contrato.", "La ley exige acreditar el pago de aportes para cada pago derivado del contrato, no solo al suscribirlo (art. 41, par. 1, Ley 80).", false]]}, {"id": "CE-123", "niv": 2, "e": "Frente a la cuenta con el error de cálculo, lo procedente es", "f": "Ley 80 de 1993, art. 25, num. 17", "o": [["A", "radicarla el día en que se presenta y ajustarla de oficio o, si no se puede, devolverla con una explicación escrita.", "El numeral 17 del artículo 25 de la Ley 80 obliga a las entidades a radicar las actas o cuentas de cobro en la fecha en que el contratista las presenta, a corregirlas o ajustarlas de oficio si hay lugar y, si no es posible, a devolverlas a la mayor brevedad explicando por escrito los motivos.", true], ["B", "abstenerse de radicarla y pedir al contratista que presente una nueva cuenta de cobro con el valor correcto en el período siguiente.", "La ley prohíbe dejar de radicar la cuenta: debe radicarse en la fecha de presentación y corregirse de oficio o devolverse con explicación escrita (art. 25, num. 17, Ley 80).", false], ["C", "radicarla y dejarla en espera, sin tramitarla, hasta que el contratista advierta el error y la corrija por iniciativa propia.", "La entidad tiene el deber de corregir de oficio o devolver la cuenta explicando el motivo; dejarla en espera contraría el numeral 17 del artículo 25 de la Ley 80.", false]]}, {"id": "CE-124", "niv": 1, "e": "A la pregunta sobre la prima de servicios y las vacaciones, la respuesta ajustada a la ley es que", "f": "Ley 80 de 1993, art. 32, num. 3", "o": [["A", "proceden en proporción al tiempo de ejecución, porque el contrato se celebró con una persona natural.", "Que el contratista sea persona natural no convierte el contrato en laboral; la ley excluye la relación laboral y las prestaciones sociales (art. 32, num. 3, Ley 80).", false], ["B", "proceden cuando el contrato supera un año de ejecución continua con la misma entidad.", "La Ley 80 no reconoce prestaciones sociales a los contratistas de prestación de servicios por la duración del contrato; el numeral 3 del artículo 32 las excluye.", false], ["C", "no proceden, porque los contratos de prestación de servicios no generan relación laboral ni prestaciones sociales.", "El numeral 3 del artículo 32 de la Ley 80 dispone que en ningún caso los contratos de prestación de servicios generan relación laboral ni prestaciones sociales, y que se celebran por el término estrictamente indispensable.", true]]}]}, {"comp": "contratacion", "rol": "profesional", "tag": "Contratación estatal · Niveles profesional, asesor y ejecutivo · Urgencia manifiesta y su control", "texto": "Tras una avalancha que destruyó el acueducto de varias veredas y las dejó sin agua, el alcalde de un municipio declaró la urgencia manifiesta mediante decreto motivado y, al día siguiente, celebró contratos de suministro de agua potable en carrotanques y de obras de emergencia. Usted es profesional de una procuraduría provincial y, en ejercicio de la función preventiva, revisa el expediente: no hay estudios previos y el único soporte de la contratación directa es el decreto que declaró la urgencia.", "items": [{"id": "CE-125", "niv": 3, "e": "Sobre la ausencia de estudios previos y de un acto de justificación separado, usted concluye que", "f": "Ley 80 de 1993, art. 42; Decreto 1082 de 2015, art. 2.2.1.2.1.4.2", "o": [["A", "es irregular, porque toda contratación directa exige un acto de justificación independiente del que declara la urgencia.", "En la urgencia manifiesta el propio acto de declaratoria sirve de justificación (Decreto 1082 de 2015, art. 2.2.1.2.1.4.2).", false], ["B", "no es irregular, porque el acto de declaratoria sirve de justificación y en ese caso no se exigen estudios previos.", "El artículo 2.2.1.2.1.4.2 del Decreto 1082 de 2015 dispone que, cuando la causal de contratación directa es la urgencia manifiesta, el acto que la declara hace las veces del acto de justificación y la entidad no está obligada a elaborar estudios y documentos previos. El artículo 42 de la Ley 80 exige que la urgencia se declare por acto motivado, como ocurrió.", true], ["C", "es irregular, porque los estudios previos deben elaborarse antes de firmar cualquier contrato estatal, sin excepciones.", "Aunque la regla general exige estudios previos (art. 25, num. 12, Ley 80), el reglamento exime de ellos a la entidad cuando contrata por urgencia manifiesta (Decreto 1082, art. 2.2.1.2.1.4.2).", false]]}, {"id": "CE-126", "niv": 2, "e": "Celebrados los contratos, el alcalde debe remitirlos, junto con el acto de declaratoria y el expediente,", "f": "Ley 80 de 1993, arts. 25, num. 11 y 43", "o": [["A", "de inmediato al organismo que ejerce el control fiscal, que se pronunciará dentro de los dos meses siguientes.", "El artículo 43 de la Ley 80 ordena que, inmediatamente después de celebrados los contratos originados en la urgencia, estos y el acto que la declaró, con el expediente y las pruebas, se envíen al funcionario u organismo que ejerce el control fiscal, el cual debe pronunciarse dentro de los dos meses siguientes.", true], ["B", "a la procuraduría provincial, para que los apruebe antes de que se inicie su ejecución.", "La ley asigna la revisión de la urgencia al organismo de control fiscal (art. 43, Ley 80); la Procuraduría no aprueba contratos ni interviene en su celebración (art. 25, num. 11, Ley 80).", false], ["C", "al concejo municipal dentro del mes siguiente, para que ejerza control político sobre la declaratoria y los contratos.", "El artículo 43 de la Ley 80 no prevé el envío al concejo; el destinatario es el organismo de control fiscal de la entidad.", false]]}, {"id": "CE-127", "niv": 3, "e": "Si el organismo de control fiscal concluye que no existían los hechos que justificaban la urgencia, lo que dispone la ley es que", "f": "Ley 80 de 1993, art. 43", "o": [["A", "imponga directamente al alcalde la sanción de destitución por el uso indebido de la contratación directa.", "El organismo de control fiscal no impone sanciones disciplinarias; el artículo 43 de la Ley 80 le ordena solicitar la iniciación de la investigación disciplinaria a la autoridad competente.", false], ["B", "declare la nulidad absoluta de los contratos celebrados y ordene su liquidación inmediata en el estado en que se encuentren.", "El organismo de control fiscal no declara la nulidad de los contratos; su función, según el artículo 43 de la Ley 80, es pronunciarse sobre los hechos y promover las investigaciones y acciones ante las autoridades competentes.", false], ["C", "pida iniciar la investigación disciplinaria y dé traslado del asunto a las demás autoridades competentes.", "Según el artículo 43 de la Ley 80, si es procedente, el organismo de control fiscal solicita al jefe inmediato del servidor o a la autoridad competente la iniciación de la investigación disciplinaria y envía el asunto a los funcionarios competentes para las demás acciones; además, el uso indebido de la contratación de urgencia es causal de mala conducta.", true]]}]}, {"comp": "contratacion", "rol": "general", "tag": "Contratación estatal · Planeación: análisis del sector y estudios previos", "texto": "La Secretaría de Educación de una gobernación prepara un proceso para contratar el transporte escolar rural y usted integra el equipo estructurador. El coordinador propone tres cosas: que el análisis del sector se limite a pedir cotizaciones a dos empresas; que en los estudios previos se omita el análisis de riesgos, porque «eso se resuelve durante la ejecución»; y que, para la capacidad financiera, se copien los indicadores del pliego de otra gobernación cuyo proceso tenía un presupuesto diez veces mayor.", "items": [{"id": "CE-128", "niv": 1, "e": "Sobre el alcance del análisis del sector, usted debe advertir que", "f": "Decreto 1082 de 2015, art. 2.2.1.1.1.6.1", "o": [["A", "basta con las dos cotizaciones, porque el análisis del sector sirve para estimar el valor del contrato.", "El análisis del sector no se reduce a estimar precios; el Decreto 1082 de 2015 (art. 2.2.1.1.1.6.1) exige estudiarlo desde varias perspectivas, incluido el riesgo.", false], ["B", "debe abarcar los aspectos jurídicos, comerciales, financieros, organizacionales, técnicos y de riesgo.", "El artículo 2.2.1.1.1.6.1 del Decreto 1082 de 2015 ordena a la entidad hacer, durante la planeación, el análisis necesario para conocer el sector desde las perspectivas legal, comercial, financiera, organizacional, técnica y de análisis de riesgo, y dejar constancia de ello en los documentos del proceso.", true], ["C", "se exige en la licitación pública, de modo que en una selección abreviada puede reducirse a un sondeo de precios.", "El deber de análisis se predica de la entidad en la planeación de sus procesos de contratación, sin limitarlo a la licitación (Decreto 1082 de 2015, art. 2.2.1.1.1.6.1).", false]]}, {"id": "CE-129", "niv": 2, "e": "Frente a la propuesta de omitir el análisis de riesgos en los estudios previos, lo correcto es responder que", "f": "Ley 1150 de 2007, art. 4; Decreto 1082 de 2015, art. 2.2.1.1.2.1.1, num. 6", "o": [["A", "es admisible, porque los riesgos se reparten durante la ejecución mediante las modificaciones que acuerden las partes.", "Los riesgos previsibles deben identificarse y asignarse desde la planeación, en los estudios previos y en los pliegos (art. 4, Ley 1150; Decreto 1082, art. 2.2.1.1.2.1.1, num. 6), no dejarse para la ejecución.", false], ["B", "es admisible si el contrato incluye una cláusula de multas suficientemente amplia para cubrir cualquier eventualidad que se presente.", "Las multas sirven para conminar al contratista a cumplir (art. 17, Ley 1150) y no reemplazan el análisis y la asignación de riesgos que exigen el artículo 4 de la Ley 1150 y el Decreto 1082 de 2015.", false], ["C", "los estudios previos deben incluir el análisis de riesgo y la forma de mitigarlo, y el pliego debe asignar los riesgos previsibles.", "El numeral 6 del artículo 2.2.1.1.2.1.1 del Decreto 1082 de 2015 incluye en los estudios previos el análisis de riesgo y la forma de mitigarlo, y el artículo 4 de la Ley 1150 exige que los pliegos incluyan la estimación, tipificación y asignación de los riesgos previsibles.", true]]}, {"id": "CE-130", "niv": 2, "e": "Sobre copiar los indicadores financieros del pliego de la otra gobernación, usted debe señalar que", "f": "Ley 1150 de 2007, art. 5, num. 1; Decreto 1082 de 2015, art. 2.2.1.1.1.6.2", "o": [["A", "los requisitos habilitantes deben ser proporcionales al contrato y fijarse con base en su riesgo, su valor y el análisis del sector.", "El numeral 1 del artículo 5 de la Ley 1150 exige que los requisitos habilitantes sean adecuados y proporcionales a la naturaleza y al valor del contrato, y el artículo 2.2.1.1.1.6.2 del Decreto 1082 de 2015 ordena fijarlos según el riesgo, el valor, el análisis del sector y el conocimiento de los posibles oferentes, sin aplicar fórmulas de manera mecánica.", true], ["B", "es una buena práctica, porque unos indicadores más exigentes garantizan que se seleccione un contratista con mayor solvencia financiera.", "Exigir indicadores desproporcionados frente al valor del contrato desconoce el numeral 1 del artículo 5 de la Ley 1150 y puede restringir injustificadamente la participación.", false], ["C", "es válido siempre que los indicadores se publiquen en el proyecto de pliego para recibir observaciones.", "La publicación no corrige la falta de proporcionalidad; los requisitos deben definirse con base en el análisis propio del proceso (Decreto 1082, art. 2.2.1.1.1.6.2).", false]]}]}, {"comp": "contratacion", "rol": "general", "tag": "Contratación estatal · Pliegos de condiciones, documentos tipo y adendas", "texto": "Usted es profesional de la oficina de contratación de una alcaldía que adelanta una licitación pública de obra para pavimentar vías urbanas. Durante la planeación, el secretario de Hacienda se opuso a publicar el proyecto de pliego porque aún no había expedido el certificado de disponibilidad presupuestal (CDP). Un asesor externo propone redactar un pliego propio, distinto del documento tipo de Colombia Compra Eficiente, para «ajustarlo a la realidad del municipio». Ya abierto el proceso, y faltando dos días hábiles para el cierre, varios interesados piden una adenda que amplíe el plazo para presentar ofertas.", "items": [{"id": "CE-131", "niv": 3, "e": "Frente a la objeción del secretario de Hacienda sobre el proyecto de pliego, es correcto señalar que", "f": "Ley 1150 de 2007, art. 8, par. (adicionado por la Ley 1882 de 2018, art. 6); Decreto 1082 de 2015, art. 2.2.1.1.2.1.5, num. 6", "o": [["A", "sin el CDP no puede publicarse el proyecto de pliego, porque los documentos del proceso deben tener respaldo presupuestal desde el inicio.", "La Ley 1882 de 2018 (art. 6) aclaró que no es obligatorio contar con disponibilidad presupuestal para publicar el proyecto de pliego.", false], ["B", "no se requiere disponibilidad presupuestal para publicar el proyecto de pliego, aunque el acto de apertura sí debe señalar el CDP.", "El parágrafo del artículo 8 de la Ley 1150, adicionado por el artículo 6 de la Ley 1882 de 2018, dispone que no es obligatorio contar con disponibilidad presupuestal para publicar el proyecto de pliego; en cambio, el acto administrativo de apertura debe señalar el certificado de disponibilidad presupuestal (Decreto 1082 de 2015, art. 2.2.1.1.2.1.5, num. 6).", true], ["C", "el CDP se exige al momento de pagar al contratista, y no durante las etapas de planeación y selección de la licitación.", "El acto de apertura debe indicar el CDP (Decreto 1082, art. 2.2.1.1.2.1.5, num. 6), y la ejecución del contrato requiere la existencia de las disponibilidades presupuestales (art. 41, Ley 80).", false]]}, {"id": "CE-132", "niv": 2, "e": "Sobre la propuesta de usar un pliego propio en lugar del documento tipo, usted debe advertir que", "f": "Ley 1150 de 2007, art. 2, par. 7 (modificado por la Ley 2022 de 2020, art. 1)", "o": [["A", "los documentos tipo son una guía orientadora que cada entidad puede adaptar libremente a sus necesidades.", "La ley les da carácter obligatorio (art. 2, par. 7, Ley 1150, modificado por la Ley 2022 de 2020); no son simples guías.", false], ["B", "los documentos tipo para obra pública son de uso obligatorio para las entidades sometidas al Estatuto General de Contratación.", "El parágrafo 7 del artículo 2 de la Ley 1150, modificado por el artículo 1 de la Ley 2022 de 2020, establece que los documentos tipo adoptados por Colombia Compra Eficiente son de obligatorio cumplimiento y, en todo caso, de uso obligatorio en los procesos de obra pública de todas las entidades sometidas al Estatuto General de Contratación.", true], ["C", "los documentos tipo son obligatorios para las entidades del orden nacional, no para los municipios.", "La obligación cobija a todas las entidades sometidas al Estatuto General de Contratación, incluidas las territoriales (art. 2, par. 7, Ley 1150).", false]]}, {"id": "CE-133", "niv": 3, "e": "Ante la solicitud de adenda presentada faltando dos días hábiles para el cierre, la alcaldía", "f": "Ley 80 de 1993, art. 30, num. 5, inc. 2 (modificado por la Ley 1474 de 2011, art. 89); Decreto 1082 de 2015, art. 2.2.1.1.2.2.1", "o": [["A", "puede expedirla, siempre que la ampliación no supere la mitad del plazo inicialmente fijado para presentar ofertas.", "El límite de la mitad del plazo se refiere a la prórroga hecha antes de su vencimiento; la ley prohíbe en todo caso expedir adendas en los tres días anteriores al cierre, ni para extender el término.", false], ["B", "puede expedirla hasta el día hábil anterior al cierre, siempre que la publique entre las 7:00 a. m. y las 7:00 p. m.", "Esa regla del Decreto 1082 de 2015 (art. 2.2.1.1.2.2.1) aplica a las demás modalidades; en la licitación pública la ley exige tres días de anticipación.", false], ["C", "no puede expedirla, porque en la licitación no se expiden adendas en los tres días anteriores al cierre, ni para ampliar el plazo.", "El inciso 2 del numeral 5 del artículo 30 de la Ley 80, modificado por el artículo 89 de la Ley 1474 de 2011, prohíbe expedir adendas dentro de los tres días anteriores al cierre, ni siquiera para extender el término. El Decreto 1082 de 2015 (art. 2.2.1.1.2.2.1) reitera esa regla para la licitación.", true]]}, {"id": "CE-134", "niv": 1, "e": "Una vez publicado el proyecto de pliego de esta licitación, los interesados pueden presentar observaciones durante", "f": "Decreto 1082 de 2015, art. 2.2.1.1.2.1.4", "o": [["A", "tres días hábiles.", "Tres días hábiles es, por ejemplo, el término para manifestar interés en la selección abreviada de menor cuantía (Decreto 1082, art. 2.2.1.2.1.2.20), no el de observaciones al proyecto de pliego.", false], ["B", "cinco días hábiles.", "Cinco días hábiles es el término de observaciones al proyecto de pliego en la selección abreviada y el concurso de méritos (Decreto 1082, art. 2.2.1.1.2.1.4, lit. b).", false], ["C", "diez días hábiles.", "El literal a) del artículo 2.2.1.1.2.1.4 del Decreto 1082 de 2015 fija un término de diez días hábiles para comentar el proyecto de pliego en la licitación pública.", true]]}]}, {"comp": "contratacion", "rol": "profesional", "tag": "Contratación estatal · Niveles profesional, asesor y ejecutivo · Requisitos habilitantes, factores de ponderación y subsanación", "texto": "Usted integra el comité evaluador de una licitación pública de obra de un departamento. Al revisar las ofertas encuentra que un proponente no adjuntó la copia del documento de identidad de su representante legal; otro no entregó la garantía de seriedad con su propuesta; y un tercero, dentro del término para subsanar, aporta una certificación de experiencia de un contrato que terminó dos semanas después del cierre del proceso. Además, un miembro del comité sugiere otorgar puntos adicionales al proponente que tenga más contratos ejecutados.", "items": [{"id": "CE-135", "niv": 2, "e": "Frente al proponente que no adjuntó la copia del documento de identidad de su representante legal, el comité debe", "f": "Ley 1150 de 2007, art. 5, par. 1 (modificado por la Ley 1882 de 2018, art. 5)", "o": [["A", "solicitarle el documento, que podrá entregar hasta el término de traslado del informe de evaluación.", "El parágrafo 1 del artículo 5 de la Ley 1150, modificado por el artículo 5 de la Ley 1882 de 2018, ordena solicitar los requisitos que no afectan la asignación de puntaje, los cuales pueden entregarse hasta el término de traslado del informe de evaluación; la falta de documentos no necesarios para comparar las ofertas no justifica su rechazo. Las reglas especiales para la mínima cuantía y la subasta no aplican aquí.", true], ["B", "solicitarle el documento, que podrá entregar en cualquier momento antes de la firma del contrato.", "La ley fija un límite: el término de traslado del informe de evaluación; si no se entrega en ese plazo, la oferta se rechaza (art. 5, par. 1, Ley 1150).", false], ["C", "recomendar el rechazo inmediato de la oferta, porque el documento debía entregarse junto con la propuesta.", "La ausencia de documentos que no son necesarios para comparar las propuestas no es título suficiente para rechazarlas (art. 5, par. 1, Ley 1150).", false]]}, {"id": "CE-136", "niv": 1, "e": "Respecto del proponente que no entregó la garantía de seriedad con su propuesta, procede", "f": "Ley 1150 de 2007, art. 5, par. 3 (adicionado por la Ley 1882 de 2018, art. 5)", "o": [["A", "habilitarlo, porque la garantía de seriedad se exige al adjudicatario antes de firmar el contrato.", "La garantía de seriedad ampara los ofrecimientos y debe acompañar la oferta desde su presentación (art. 7, Ley 1150; Decreto 1082 de 2015, art. 2.2.1.2.3.1.9).", false], ["B", "rechazar la oferta, porque esa omisión no es subsanable.", "El parágrafo 3 del artículo 5 de la Ley 1150, adicionado por el artículo 5 de la Ley 1882 de 2018, dispone que la no entrega de la garantía de seriedad junto con la propuesta no es subsanable y es causal de rechazo.", true], ["C", "requerirlo para que la aporte dentro del término de traslado del informe de evaluación.", "La regla general de subsanación no aplica a la garantía de seriedad no entregada con la oferta, que la ley califica expresamente como no subsanable (art. 5, par. 3, Ley 1150).", false]]}, {"id": "CE-137", "niv": 3, "e": "La certificación de experiencia de un contrato terminado después del cierre", "f": "Ley 1150 de 2007, art. 5, par. 1, inc. 2 y par. 5 (Ley 1882 de 2018, art. 5)", "o": [["A", "no puede tenerse en cuenta, porque al subsanar no se pueden acreditar circunstancias ocurridas después del cierre.", "El inciso 2 del parágrafo 1 del artículo 5 de la Ley 1150, modificado por la Ley 1882 de 2018, dispone que durante el término para subsanar los proponentes no pueden acreditar circunstancias ocurridas con posterioridad al cierre del proceso.", true], ["B", "debe aceptarse si quien certifica el contrato es una entidad pública y no un particular.", "La naturaleza del contratante es irrelevante; de hecho, la ley obliga a aceptar la experiencia adquirida con particulares (art. 5, par. 5, Ley 1150). El problema es que el hecho ocurrió después del cierre.", false], ["C", "debe aceptarse, porque la experiencia es un requisito habilitante que puede subsanarse hasta el traslado del informe.", "Aunque la experiencia es subsanable, lo que se subsana es la prueba de hechos existentes al cierre; la ley prohíbe acreditar circunstancias posteriores (art. 5, par. 1, inc. 2, Ley 1150).", false]]}, {"id": "CE-138", "niv": 2, "e": "Sobre la sugerencia de otorgar puntos al proponente con más contratos ejecutados, lo correcto es que", "f": "Ley 1150 de 2007, art. 5, nums. 1, 2 y 4", "o": [["A", "procede, siempre que el puntaje por experiencia no supere el puntaje que el pliego asigna al precio.", "La ley no permite asignar puntaje a la experiencia del proponente en la licitación, cualquiera que sea su peso frente al precio (art. 5, num. 1, Ley 1150).", false], ["B", "procede, porque la experiencia mide la calidad de la oferta y puede ponderarse junto con el precio.", "En la licitación de obra la experiencia es habilitante; la ponderación de calidad y precio recae sobre los factores técnicos y económicos de la oferta (art. 5, nums. 1 y 2, Ley 1150).", false], ["C", "no procede, porque en la licitación la experiencia del proponente es un requisito habilitante que no otorga puntaje.", "El numeral 1 del artículo 5 de la Ley 1150 dispone que la experiencia, la capacidad jurídica, financiera y de organización son requisitos habilitantes que se verifican y no otorgan puntaje, salvo en la selección de consultores (num. 4).", true]]}]}, {"comp": "contratacion", "rol": "tecnico", "tag": "Contratación estatal · Niveles técnico, administrativo y operativo · Registro Único de Proponentes", "texto": "Usted es técnico de la oficina de contratación de una gobernación y apoya la revisión documental de los procesos. En una selección abreviada de menor cuantía, un proponente presentó su certificado del RUP vigente y en firme, pero la oficina le pidió además los estados financieros con los que se inscribió en la cámara de comercio. En paralelo, la oficina va a celebrar un contrato de prestación de servicios de apoyo a la gestión con una persona natural. Al final del mes, su jefe le encarga reportar a la cámara de comercio las multas impuestas a contratistas.", "items": [{"id": "CE-139", "niv": 3, "e": "Sobre la solicitud de los estados financieros al proponente inscrito en el RUP, lo correcto es que", "f": "Ley 1150 de 2007, art. 6, num. 6.1; Decreto 1082 de 2015, art. 2.2.1.1.1.5.3", "o": [["A", "no debió pedirse, porque el certificado del RUP prueba por sí solo los requisitos habilitantes que verificó la cámara.", "El numeral 6.1 del artículo 6 de la Ley 1150 dispone que el certificado del RUP es plena prueba de las circunstancias verificadas por las cámaras de comercio y que las entidades no pueden exigir, ni los proponentes aportar, la documentación que deba utilizarse para la inscripción.", true], ["B", "era procedente, porque el RUP acredita la experiencia del
