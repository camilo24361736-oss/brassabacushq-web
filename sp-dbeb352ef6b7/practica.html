ior: cuarta.", true], ["B", "quinta categoría.", "Es la categoría que corresponde a su población, pero la ley ordena subirlo a la inmediatamente superior porque sus ICLD superan el monto señalado para la quinta categoría.", false], ["C", "sexta categoría.", "La sexta categoría es para municipios con población igual o inferior a 10.000 habitantes e ICLD no superiores a 15.000 salarios mínimos; el municipio A no cumple ninguno de los dos criterios.", false]]}, {"id": "GE-128", "niv": 3, "e": "El municipio B, con 45.000 habitantes e ICLD de 12.000 salarios mínimos, debe clasificarse en", "f": "Ley 136 de 1994, art. 6, par. 1 (texto vigente: Decreto Ley 2106 de 2019, art. 153)", "o": [["A", "tercera categoría, que corresponde a su población.", "La población lo ubicaría en tercera categoría (30.001 a 50.000 habitantes), pero sus ICLD no alcanzan el monto de esa categoría (más de 30.000 salarios mínimos), y en ese caso prima la categoría que corresponde a los ingresos.", false], ["B", "cuarta categoría, por ser la inmediatamente inferior a la de su población.", "La ley no ordena bajar solo un nivel: cuando los ICLD no alcanzan el monto de la categoría poblacional, el municipio se clasifica en la categoría que corresponda a sus ICLD.", false], ["C", "sexta categoría, que corresponde a sus ingresos corrientes de libre destinación.", "El parágrafo 1 del artículo 6 de la Ley 136, en el texto que le dio el artículo 153 del Decreto Ley 2106 de 2019, dispone que, si los ICLD no alcanzan el monto de la categoría poblacional, el municipio se clasifica en la categoría correspondiente a sus ICLD. Con 12.000 salarios mínimos (no superiores a 15.000), le corresponde la sexta.", true]]}, {"id": "GE-129", "niv": 1, "e": "Al alcalde que pregunta por el plazo para categorizar su municipio, usted le responde que debe hacerlo", "f": "Ley 136 de 1994, art. 6, par. 3 (texto vigente: Decreto Ley 2106 de 2019, art. 153)", "o": [["A", "mediante decreto expedido antes del 31 de diciembre; si no lo hace, la categoría la fija el gobernador en enero.", "La fecha y la autoridad son equivocadas: el plazo vence el 31 de octubre y, ante la omisión, la categoría la fija el Contador General de la Nación en noviembre.", false], ["B", "mediante decreto expedido antes del 31 de octubre; si no lo hace, la fija el Contador General de la Nación en noviembre.", "El parágrafo 3 del artículo 6 de la Ley 136 de 1994, modificado por el artículo 153 del Decreto Ley 2106 de 2019, ordena a los alcaldes determinar anualmente, por decreto expedido antes del 31 de octubre, la categoría para el año siguiente; si no lo expiden, la fija el Contador General de la Nación en noviembre.", true], ["C", "mediante decreto expedido antes del 31 de octubre; si no lo hace, conserva automáticamente la categoría del año anterior.", "La ley no prevé la conservación automática de la categoría: ante la omisión del alcalde, la categorización la fija el Contador General de la Nación en noviembre.", false]]}, {"id": "GE-130", "niv": 3, "e": "A la capital del departamento que consulta por la Ley 2082 de 2021, usted le explica que", "f": "Ley 2082 de 2021, art. 2", "o": [["A", "pasa automáticamente a la categoría especial, por su condición de capital departamental.", "La Ley 2082 no ordena reclasificar en categoría especial a las capitales; por el contrario, dispone que para los efectos de la Ley 617 de 2000 conservan la categoría que les corresponda según los criterios generales.", false], ["B", "deja de categorizarse por población e ingresos y queda sometida al mismo régimen del Distrito Capital.", "La ley mantiene la categorización por los criterios generales para efectos de la Ley 617 y no somete a las capitales al régimen del Distrito Capital; solo dispone que el régimen de Bogotá se armonice con el Decreto 1421 de 1993.", false], ["C", "pertenece a la categoría de ciudades capitales y, para efectos de la Ley 617 de 2000, conserva la categoría que le corresponda.", "El artículo 2 de la Ley 2082 de 2021 crea la categoría «ciudades capitales», a la que pertenecen Bogotá y los distritos y municipios capitales de departamento, con un régimen especial, y aclara que para los efectos de la Ley 617 de 2000 conservan la categoría que les corresponda según los criterios allí establecidos.", true]]}]}, {"comp": "gestion_publica", "rol": "general", "tag": "Gestión pública y funcionamiento del Estado · Plan de desarrollo territorial", "texto": "Usted es profesional universitario de una procuraduría provincial y hace seguimiento preventivo a la adopción del plan de desarrollo 2028-2031 de un municipio. El alcalde se posesionó el 1 de enero de 2028. El consejo de gobierno consolidó el proyecto de plan y el 15 de febrero lo entregó al consejo territorial de planeación, que nunca se reunió ni emitió concepto. El alcalde radicó el proyecto ante el concejo municipal el 20 de abril de 2028. El 25 de mayo el concejo aún no había adoptado decisión alguna sobre el plan.", "items": [{"id": "GE-131", "niv": 1, "e": "Según la Ley 152 de 1994, el plan de desarrollo del municipio debe estar conformado por", "f": "Ley 152 de 1994, art. 31", "o": [["A", "una parte estratégica y un plan de inversiones de mediano y corto plazo.", "El artículo 31 de la Ley 152 de 1994 dispone que los planes de desarrollo de las entidades territoriales estarán conformados por una parte estratégica y un plan de inversiones a mediano y corto plazo.", true], ["B", "el programa de gobierno inscrito y un presupuesto plurianual aprobado por el consejo de planeación.", "El programa de gobierno orienta la elaboración del plan (art. 39), pero no es uno de sus componentes; y el consejo territorial de planeación emite concepto, no aprueba presupuestos.", false], ["C", "un diagnóstico financiero y un programa anual mensualizado de caja.", "El programa anual mensualizado de caja es un instrumento de ejecución presupuestal, no un componente del plan de desarrollo (art. 31 de la Ley 152).", false]]}, {"id": "GE-132", "niv": 2, "e": "Frente al silencio del consejo territorial de planeación, debe entenderse que", "f": "Ley 152 de 1994, arts. 25 y 39, num. 6", "o": [["A", "el concepto debía solicitarse al Consejo Nacional de Planeación ante el silencio del consejo territorial.", "La Ley 152 no prevé que el Consejo Nacional de Planeación reemplace al territorial; establece que, transcurrido el mes, se considera surtido el requisito.", false], ["B", "si pasa un mes desde la entrega sin pronunciamiento del consejo, el requisito del concepto se tiene por cumplido.", "El artículo 39, numeral 6, de la Ley 152 de 1994 dispone que el consejo territorial debe realizar su labor dentro del mes siguiente a la presentación del documento consolidado y que, si no se reúne o no se pronuncia, se considera surtido el requisito en esa fecha, regla que reproduce para el nivel territorial la del artículo 25 de la misma ley.", true], ["C", "el alcalde debía esperar el concepto, pues sin él no podía presentar el proyecto al concejo.", "La ley no convierte el silencio del consejo en un obstáculo indefinido: vencido el mes sin pronunciamiento, el requisito se entiende surtido (art. 39, num. 6).", false]]}, {"id": "GE-133", "niv": 3, "e": "Como el concejo no decidió sobre el plan dentro del mes siguiente a su presentación, el alcalde", "f": "Ley 152 de 1994, art. 40", "o": [["A", "puede adoptar el plan mediante decreto.", "El artículo 40 de la Ley 152 de 1994 dispone que los planes se someten al concejo dentro de los primeros cuatro meses del período del alcalde (aquí se radicó el 20 de abril) y que, si el concejo no decide dentro del mes siguiente a su presentación, el alcalde podrá adoptarlos mediante decreto.", true], ["B", "debe presentarlo de nuevo en las siguientes sesiones ordinarias, porque ya vencieron los primeros cuatro meses del período.", "Los cuatro meses son el plazo para presentar el plan, y el alcalde lo cumplió al radicarlo el 20 de abril; vencido el mes sin decisión del concejo, procede la adopción por decreto (art. 40).", false], ["C", "debe publicarlo como acuerdo municipal, porque el silencio del concejo equivale a una aprobación tácita.", "La ley no prevé aprobación tácita por el concejo ni la expedición de un acuerdo sin votación: la consecuencia del silencio es que el alcalde puede adoptar el plan por decreto.", false]]}]}, {"comp": "gestion_publica", "rol": "tecnico", "tag": "Gestión pública y funcionamiento del Estado · Niveles técnico, administrativo y operativo · Ejecución presupuestal", "texto": "Usted es técnico del grupo de presupuesto de una entidad del orden nacional que hace parte del Presupuesto General de la Nación. Durante el año se presentan cuatro situaciones: el coordinador de compras quiere firmar un contrato de mantenimiento de vehículos y solicita los documentos presupuestales; una vez firmado el contrato, pregunta qué operación debe seguir; el 28 de diciembre queda un saldo de apropiación sin comprometer y un directivo propone firmar el 5 de enero un contrato con cargo a ese saldo; y un coordinador pide usar recursos de la apropiación para viáticos en la compra de muebles, sin trámite de modificación presupuestal.", "items": [{"id": "GE-134", "niv": 1, "e": "Antes de expedir el acto o firmar el contrato que afecta la apropiación, la entidad debe", "f": "Decreto 111 de 1996, art. 71", "o": [["A", "solicitar la inclusión del gasto en el programa anual mensualizado de caja de la vigencia siguiente.", "El PAC regula los pagos y no reemplaza la disponibilidad previa; además, el gasto debe atenderse con apropiaciones de la vigencia en curso.", false], ["B", "contar con un certificado de disponibilidad presupuestal que garantice la existencia de apropiación suficiente.", "El artículo 71 del Decreto 111 de 1996 exige que todos los actos administrativos que afecten las apropiaciones presupuestales cuenten con certificados de disponibilidad previos que garanticen la existencia de apropiación suficiente para atender esos gastos.", true], ["C", "obtener el registro presupuestal antes de iniciar el proceso de selección del contratista.", "El registro presupuestal se hace sobre el compromiso ya adquirido (el contrato firmado), no antes del proceso de selección; lo previo es el certificado de disponibilidad (art. 71).", false]]}, {"id": "GE-135", "niv": 2, "e": "Firmado el contrato, la operación presupuestal que perfecciona el compromiso y asegura que los recursos no se desvíen a otro fin es", "f": "Decreto 111 de 1996, art. 71", "o": [["A", "la orden de pago, que se registra en la tesorería con la firma del contrato.", "La orden de pago corresponde a la etapa de pago, cuando el contratista ha cumplido; no es la operación que perfecciona el compromiso según el artículo 71.", false], ["B", "el certificado de disponibilidad presupuestal, que se expide una vez firmado el contrato.", "El certificado de disponibilidad es previo al compromiso, no posterior (art. 71); su función es garantizar que existe apropiación suficiente.", false], ["C", "el registro presupuestal, en el que se indican el valor y el plazo de las prestaciones.", "El artículo 71 del Decreto 111 de 1996 dispone que los compromisos deben contar con registro presupuestal para que los recursos con él financiados no sean desviados a ningún otro fin, que en él se indican el valor y el plazo de las prestaciones y que es requisito de perfeccionamiento.", true]]}, {"id": "GE-136", "niv": 3, "e": "Frente a la propuesta de firmar el 5 de enero un contrato con cargo al saldo de la vigencia anterior, usted advierte que", "f": "Decreto 111 de 1996, arts. 14 y 89", "o": [["A", "es posible si el compromiso se incorpora como reserva presupuestal de la vigencia anterior antes del 31 de enero.", "Las reservas presupuestales se constituyen con compromisos legalmente contraídos que al 31 de diciembre no se hayan cumplido (art. 89); un contrato firmado en enero no es un compromiso de la vigencia anterior.", false], ["B", "es posible siempre que el certificado de disponibilidad se haya expedido antes del 31 de diciembre.", "El certificado de disponibilidad no es un compromiso: si al 31 de diciembre no se había adquirido el compromiso, el saldo de apropiación caducó (art. 14).", false], ["C", "no es posible, porque después del 31 de diciembre no se asumen compromisos con cargo a la vigencia cerrada.", "El principio de anualidad (art. 14 del Decreto 111 de 1996) establece que el año fiscal va del 1 de enero al 31 de diciembre, que después de esa fecha no pueden asumirse compromisos con cargo a las apropiaciones del año que se cierra y que los saldos no comprometidos caducan sin excepción.", true]]}, {"id": "GE-137", "niv": 3, "e": "Usar la apropiación de viáticos para comprar muebles, sin modificación presupuestal,", "f": "Decreto 111 de 1996, arts. 12, 15, 16 y 18", "o": [["A", "contraría el principio de especialización, porque las apropiaciones se ejecutan conforme al fin para el que se programaron.", "El artículo 18 del Decreto 111 de 1996 dispone que las apropiaciones deben referirse en cada órgano a su objeto y funciones y ejecutarse estrictamente conforme al fin para el cual fueron programadas.", true], ["B", "contraría el principio de unidad de caja, según el cual todas las rentas atienden la totalidad de los gastos.", "La unidad de caja permite atender con el recaudo de todas las rentas el pago de las apropiaciones autorizadas (art. 16); no autoriza cambiar la destinación de una apropiación, que es lo que aquí ocurre.", false], ["C", "es válido por el principio de universalidad, ya que ambos gastos están incluidos en el presupuesto.", "La universalidad exige que el presupuesto contenga todos los gastos (art. 15); que ambos rubros existan no permite trasladar recursos de uno a otro sin la modificación correspondiente.", false]]}]}, {"comp": "gestion_publica", "rol": "profesional", "tag": "Gestión pública y funcionamiento del Estado · Niveles profesional, asesor y ejecutivo · Vigencias futuras y universalidad del gasto", "texto": "Usted es profesional especializado de una procuraduría provincial y realiza vigilancia preventiva a la gestión presupuestal de un municipio. En el segundo año de su período, el alcalde quiere contratar por tres años la recolección de residuos sólidos; el proyecto está incluido en el plan de desarrollo y su ejecución empezaría con presupuesto de la vigencia en curso. Las vigencias futuras que se solicitarán suman $2.000.000.000. Además, el secretario de hacienda propone pagar con recursos de la tesorería un festival que no figura en el presupuesto municipal, «porque hay caja disponible».", "items": [{"id": "GE-138", "niv": 2, "e": "La autorización para comprometer estas vigencias futuras ordinarias debe impartirla", "f": "Ley 819 de 2003, art. 12", "o": [["A", "el Ministerio de Hacienda y Crédito Público, previo concepto favorable del Departamento Nacional de Planeación y del ministerio del ramo.", "El concepto del DNP se exige solo cuando el proyecto conlleva inversión nacional, y el Ministerio de Hacienda no autoriza las vigencias futuras de los municipios (art. 12 de la Ley 819).", false], ["B", "el concejo municipal, a iniciativa del alcalde y previa aprobación del Confis territorial o el órgano que haga sus veces.", "El artículo 12 de la Ley 819 de 2003 dispone que, en las entidades territoriales, las autorizaciones para comprometer vigencias futuras son impartidas por la asamblea o el concejo, a iniciativa del gobierno local, previa aprobación del Confis territorial o del órgano que haga sus veces.", true], ["C", "el Consejo Superior de Política Fiscal del municipio, sin necesidad de pasar por el concejo.", "En las entidades territoriales el Confis o el órgano que haga sus veces da una aprobación previa, pero la autorización corresponde al concejo (art. 12 de la Ley 819 de 2003).", false]]}, {"id": "GE-139", "niv": 3, "e": "Para que el concejo pueda autorizar las vigencias futuras por $2.000.000.000, el municipio debe", "f": "Ley 819 de 2003, art. 12, lit. b", "o": [["A", "contar con una apropiación de al menos $200.000.000 en la vigencia en que se autoricen.", "Corresponde al 10 % de las vigencias futuras solicitadas; la ley exige como mínimo el 15 %.", false], ["B", "contar con una apropiación de al menos $300.000.000 en la vigencia en que se autoricen.", "El literal b) del artículo 12 de la Ley 819 de 2003 exige contar, como mínimo, con apropiación del 15 % de las vigencias futuras solicitadas en la vigencia fiscal en que se autoricen: 15 % de $2.000.000.000 = $300.000.000.", true], ["C", "contar con una apropiación de al menos $600.000.000 en la vigencia en que se autoricen.", "Corresponde al 30 % del valor solicitado; la ley fija el mínimo en el 15 %.", false]]}, {"id": "GE-140", "niv": 2, "e": "Sobre la propuesta de pagar el festival con recursos de tesorería, usted advierte que", "f": "Constitución Política, art. 345; Decreto 111 de 1996, arts. 15 y 16", "o": [["A", "es procedente si el secretario de hacienda expide un certificado de disponibilidad con cargo a la caja disponible.", "El certificado de disponibilidad garantiza la existencia de una apropiación (art. 71 del Decreto 111); no puede expedirse sobre un gasto que no tiene apropiación en el presupuesto.", false], ["B", "es procedente, porque el principio de unidad de caja permite atender cualquier gasto con los recursos que haya disponibles.", "La unidad de caja permite pagar con el conjunto de las rentas las apropiaciones autorizadas (art. 16 del Decreto 111), no gastos que no están en el presupuesto.", false], ["C", "no es procedente, porque no puede hacerse ningún gasto público que no figure en el presupuesto.", "El artículo 345 de la Constitución prohíbe hacer gastos públicos no incluidos en el presupuesto de gastos, y el principio de universalidad (art. 15 del Decreto 111 de 1996) dispone que ninguna autoridad puede efectuar gastos públicos que no figuren en el presupuesto.", true]]}]}, {"comp": "gestion_publica", "rol": "general", "tag": "Gestión pública y funcionamiento del Estado · Empleo público y carrera", "texto": "Usted es técnico de la Oficina de Selección y Carrera de la Procuraduría General de la Nación y atiende el chat de orientación a aspirantes. Recibe tres preguntas: una aspirante quiere saber si la carrera de la Procuraduría se rige por la Ley 909 de 2004 y la administra la Comisión Nacional del Servicio Civil; otro pregunta cuál es la regla general sobre la naturaleza de los empleos en las entidades del Estado; y un tercero cuenta que su hermana ganó un concurso para un empleo de carrera administrativa en la alcaldía de su municipio y quiere saber qué sigue después de su nombramiento.", "items": [{"id": "GE-141", "niv": 3, "e": "A la aspirante que pregunta por el régimen de carrera de la Procuraduría, usted le responde que", "f": "Ley 909 de 2004, art. 3, num. 2; Constitución Política, art. 130; Decreto Ley 262 de 2000", "o": [["A", "es una carrera especial con régimen propio, y la Ley 909 de 2004 se le aplica solo para llenar vacíos.", "El artículo 3, numeral 2, de la Ley 909 de 2004 dispone que sus normas se aplican con carácter supletorio, en caso de vacíos, a las carreras especiales, entre ellas la de la Procuraduría General de la Nación, cuyo régimen está en el Decreto Ley 262 de 2000.", true], ["B", "la carrera de la Procuraduría se rige íntegramente por la Ley 909 de 2004 y la administra la Comisión Nacional del Servicio Civil.", "La carrera de la Procuraduría es especial y de origen constitucional; la Ley 909 solo se le aplica de forma supletoria (art. 3, num. 2), y la CNSC no administra las carreras especiales (art. 130 de la Constitución).", false], ["C", "la Ley 909 de 2004 tampoco se le aplica cuando su régimen especial guarda silencio, porque los dos regímenes son excluyentes.", "La Ley 909 sí se aplica a la Procuraduría, aunque solo de forma supletoria, cuando hay vacíos en su normativa (art. 3, num. 2).", false]]}, {"id": "GE-142", "niv": 1, "e": "Sobre la naturaleza de los empleos en los órganos y entidades del Estado, la regla general es que", "f": "Constitución Política, art. 125", "o": [["A", "son de carrera, salvo excepciones como los de elección popular y los de libre nombramiento y remoción.", "El artículo 125 de la Constitución dispone que los empleos en los órganos y entidades del Estado son de carrera, y exceptúa los de elección popular, los de libre nombramiento y remoción, los de trabajadores oficiales y los demás que determine la ley.", true], ["B", "son de libre nombramiento y remoción, salvo aquellos que la ley declare expresamente como empleos de carrera.", "La Constitución consagra la regla contraria: la carrera es la regla general y el libre nombramiento y remoción, una excepción (art. 125).", false], ["C", "son de carrera solo los empleos de los niveles técnico y asistencial.", "El artículo 125 no limita la carrera a algunos niveles; hay empleos de carrera en todos los niveles, incluidos el profesional y el asesor.", false]]}, {"id": "GE-143", "niv": 2, "e": "Sobre la hermana que ganó el concurso en la alcaldía, usted explica que", "f": "Ley 909 de 2004, art. 31, num. 5", "o": [["A", "será nombrada en período de prueba por un año, al cabo del cual queda inscrita automáticamente en carrera.", "El período de prueba es de seis meses y la inscripción depende de una evaluación satisfactoria; si no la obtiene, el nombramiento se declara insubsistente (art. 31, num. 5).", false], ["B", "será nombrada en período de prueba por seis meses y, si su evaluación es satisfactoria, adquirirá los derechos de carrera.", "El artículo 31, numeral 5, de la Ley 909 de 2004 dispone que quien sea seleccionado por concurso y no esté inscrito en carrera será nombrado en período de prueba por seis meses; si obtiene evaluación satisfactoria adquiere los derechos de carrera, que se declaran con la inscripción en el Registro Público.", true], ["C", "adquiere los derechos de carrera desde la posesión, y el período de prueba solo sirve para fijar su salario.", "Los derechos de carrera se adquieren al superar el período de prueba con evaluación satisfactoria, no con la posesión; el período de prueba no tiene que ver con la fijación del salario.", false]]}]}, {"comp": "gestion_publica", "rol": "profesional", "tag": "Gestión pública y funcionamiento del Estado · Niveles profesional, asesor y ejecutivo · Responsabilidad patrimonial y acción de repetición", "texto": "Usted es profesional especializado de una procuraduría judicial administrativa. En septiembre de 2025 quedó ejecutoriada una sentencia que condenó a un municipio a indemnizar a un motociclista que sufrió graves lesiones al caer en una excavación sin señalizar; en el proceso quedó probado que el secretario de obras ignoró, con culpa grave, varias alertas escritas sobre el peligro. El municipio pagó la totalidad de la condena el 10 de marzo de 2026, dentro del plazo legal para pagar condenas. En octubre de 2026 usted verifica que el municipio aún no ha presentado demanda de repetición contra el exsecretario.", "items": [{"id": "GE-144", "niv": 1, "e": "El fundamento constitucional de la condena al municipio y de la posible repetición contra el exsecretario es que", "f": "Constitución Política, art. 90", "o": [["A", "el Estado responde por todo daño y puede repetir contra cualquier servidor que haya intervenido, aunque no haya actuado con culpa.", "La repetición solo procede contra el agente cuya conducta fue dolosa o gravemente culposa (art. 90); no alcanza a cualquier servidor que haya intervenido.", false], ["B", "el Estado solo responde cuando el servidor actuó con dolo, y en ese caso es el servidor quien paga directamente a la víctima.", "El Estado responde por los daños antijurídicos que le sean imputables, sin que se exija dolo del agente; la culpa grave o el dolo del servidor importan para la repetición, no para la responsabilidad del Estado frente a la víctima (art. 90).", false], ["C", "el Estado responde por los daños antijurídicos que le sean imputables y repite contra el agente que actuó con dolo o culpa grave.", "El artículo 90 de la Constitución dispone que el Estado responde patrimonialmente por los daños antijurídicos que le sean imputables, causados por la acción o la omisión de las autoridades, y que, si es condenado por un daño que fue consecuencia de la conducta dolosa o gravemente culposa de un agente suyo, debe repetir contra este.", true]]}, {"id": "GE-145", "niv": 3, "e": "Como el municipio no presentó la demanda dentro de los seis meses siguientes al pago,", "f": "Ley 678 de 2001, art. 8 (modificado por la Ley 2195 de 2022, art. 41)", "o": [["A", "solo el municipio puede presentarla, y por haber vencido el plazo únicamente procede una investigación disciplinaria contra el alcalde.", "La omisión del representante legal puede ser falta disciplinaria (par. 2 del art. 8), pero la ley no deja la acción solo en manos del municipio: vencido el plazo, pueden ejercerla el Ministerio Público y la Agencia Nacional de Defensa Jurídica del Estado.", false], ["B", "la acción de repetición caducó, porque ese era el plazo para presentarla.", "Los seis meses son el plazo en que debe actuar la entidad perjudicada (art. 8 de la Ley 678), no el término de caducidad, que es de cinco años (art. 11 de la Ley 678 y art. 164 del CPACA).", false], ["C", "pueden ejercerla el Ministerio Público o el Ministerio de Justicia y del Derecho, por medio de la Agencia Nacional de Defensa Jurídica.", "El artículo 8 de la Ley 678 de 2001, modificado por el artículo 41 de la Ley 2195 de 2022, ordena a la entidad perjudicada ejercer la acción dentro de los seis meses siguientes al pago total y dispone que, si no lo hace, pueden ejercerla el Ministerio Público y el Ministerio de Justicia y del Derecho a través de la Agencia Nacional de Defensa Jurídica del Estado.", true]]}, {"id": "GE-146", "niv": 2, "e": "El término de caducidad para demandar en repetición en este caso es de", "f": "Ley 678 de 2001, art. 11 y Ley 1437 de 2011, art. 164, num. 2, lit. l (modificados por la Ley 2195 de 2022, arts. 42 y 43)", "o": [["A", "cinco años contados desde el día siguiente a la fecha del pago.", "El artículo 11 de la Ley 678 de 2001 (modificado por el artículo 42 de la Ley 2195 de 2022) y el literal l) del numeral 2 del artículo 164 del CPACA fijan cinco años contados desde el día siguiente al pago o, a más tardar, desde el vencimiento del plazo que tiene la administración para pagar la condena (diez meses según el artículo 192 del CPACA). Como la sentencia quedó ejecutoriada en septiembre de 2025 y el pago se hizo en marzo de 2026, dentro de ese plazo, el término corre desde el día siguiente al pago.", true], ["B", "dos años contados desde la ejecutoria de la sentencia condenatoria.", "Ese fue el término anterior a la Ley 2195 de 2022. Para condenas ejecutoriadas después de su vigencia, el término es de cinco años y se cuenta desde el día siguiente al pago.", false], ["C", "cuatro meses contados desde el pago, que es el plazo con que cuenta el comité de conciliación para decidir.", "El término con que cuenta el comité de conciliación para estudiar la procedencia de la repetición es un plazo administrativo, distinto del término de caducidad de la acción.", false]]}]}, {"comp": "gestion_publica", "rol": "general", "tag": "Gestión pública y funcionamiento del Estado · Acción de tutela", "texto": "Usted es auxiliar administrativo de la oficina de atención al ciudadano de una procuraduría provincial. Una ciudadana en tratamiento contra el cáncer le cuenta que su EPS lleva dos meses sin entregarle un medicamento que su médico tratante le formuló y que, por esa demora, su salud se está deteriorando. Le pregunta qué mecanismo judicial puede usar para obtener una protección rápida, en cuánto tiempo debe decidir el juez y de cuánto tiempo dispondría para impugnar si el fallo le resulta desfavorable.", "items": [{"id": "GE-147", "niv": 1, "e": "El mecanismo judicial adecuado para la situación de la ciudadana es", "f": "Constitución Política, art. 86; Decreto 2591 de 1991, art. 42", "o": [["A", "la acción popular, porque la salud de la población es un derecho colectivo.", "La acción popular protege derechos e intereses colectivos; la situación descrita afecta el derecho individual y fundamental a la salud de la ciudadana, cuya vía es la tutela.", false], ["B", "la acción de tutela, por la amenaza a sus derechos fundamentales.", "El artículo 86 de la Constitución consagra la tutela para la protección inmediata de los derechos fundamentales vulnerados o amenazados, también frente a particulares encargados de la prestación de un servicio público; el artículo 42 del Decreto 2591 de 1991 la admite contra quienes prestan servicios de salud.", true], ["C", "la acción de cumplimiento, porque la EPS está incumpliendo una obligación legal.", "La acción de cumplimiento no procede para proteger derechos que pueden garantizarse mediante tutela (art. 9 de la Ley 393 de 1997); aquí está en juego el derecho fundamental a la salud.", false]]}, {"id": "GE-148", "niv": 2, "e": "Sobre el tiempo que tiene el juez para decidir, usted le informa que", "f": "Constitución Política, art. 86", "o": [["A", "el juez cuenta con treinta días, prorrogables si necesita practicar pruebas.", "La Constitución fija un término máximo de diez días entre la solicitud y la resolución, sin prórroga por pruebas (art. 86).", false], ["B", "el juez debe resolver dentro de los diez días siguientes a la presentación de la solicitud.", "El artículo 86 de la Constitución dispone que en ningún caso podrán transcurrir más de diez días entre la solicitud de tutela y su resolución.", true], ["C", "el juez cuenta con quince días hábiles, igual que para resolver un derecho de petición.", "El término de quince días corresponde a la respuesta de peticiones por las autoridades, no al fallo de tutela, que debe proferirse dentro de los diez días del artículo 86.", false]]}, {"id": "GE-149", "niv": 2, "e": "Si el fallo le resulta desfavorable, la ciudadana puede impugnarlo dentro de", "f": "Decreto 2591 de 1991, art. 31", "o": [["A", "los tres días siguientes a su notificación.", "El artículo 31 del Decreto 2591 de 1991 dispone que, dentro de los tres días siguientes a su notificación, el fallo de tutela podrá ser impugnado por el Defensor del Pueblo, el solicitante, la autoridad pública o el representante del órgano correspondiente.", true], ["B", "los cinco días siguientes a su notificación.", "No es el término que fija el Decreto 2591 de 1991 para impugnar el fallo de tutela; el artículo 31 señala tres días.", false], ["C", "los diez días siguientes a su notificación.", "Diez días es el término máximo para fallar (art. 86 de la Constitución), no el plazo para impugnar, que es de tres días (art. 31 del Decreto 2591).", false]]}]}, {"comp": "gestion_publica", "rol": "general", "tag": "Gestión pública y funcionamiento del Estado · Acciones de cumplimiento y popular", "texto": "Usted es profesional universitario de una procuraduría provincial y atiende a un veedor ciudadano que consulta tres asuntos sobre la alcaldía de su municipio. Primero: un acuerdo municipal vigente ordena a la alcaldía publicar cada trimestre un informe de avance de las obras públicas, y en dos años nunca lo ha publicado; el veedor no ha hecho ninguna solicitud previa. Segundo: otro acuerdo ordena construir un polideportivo con un costo estimado de $3.000 millones, que no se ha ejecutado. Tercero: un comerciante ocupa con mesas y vitrinas el andén de la plaza principal, lo que obliga a los peatones a caminar por la vía, y la alcaldía no ha hecho nada.", "items": [{"id": "GE-150", "niv": 2, "e": "Para exigir judicialmente la publicación del informe trimestral, el veedor debe", "f": "Ley 393 de 1997, art. 8; Ley 1437 de 2011, art. 161, num. 3", "o": [["A", "presentar directamente la demanda de cumplimiento, porque el acuerdo es un acto administrativo de carácter general.", "Salvo inminente perjuicio irremediable, la acción exige que antes se haya reclamado el cumplimiento a la autoridad y que esta se ratifique en el incumplimiento o no conteste en diez días (art. 8 de la Ley 393).", false], ["B", "solicitar primero la conciliación extrajudicial ante la procuraduría judicial administrativa, como requisito de procedibilidad.", "La conciliación extrajudicial no es requisito de la acción de cumplimiento; el requisito de procedibilidad es la constitución en renuencia (art. 8 de la Ley 393 de 1997 y art. 161, num. 3, del CPACA).", false], ["C", "pedir antes a la alcaldía que cumpla el acuerdo y esperar a que se ratifique en el incumplimiento o no responda en diez días.", "El artículo 8 de la Ley 393 de 1997 exige, para constituir la renuencia, que el accionante haya reclamado previamente el cumplimiento del deber y que la autoridad se haya ratificado en el incumplimiento o no haya contestado dentro de los diez días siguientes; solo excepcionalmente se prescinde de ello ante un perjuicio irremediable.", true]]}, {"id": "GE-151", "niv": 3, "e": "Respecto del acuerdo que ordena construir el polideportivo, la acción de cumplimiento", "f": "Ley 393 de 1997, art. 9, par.", "o": [["A", "procede, porque el acuerdo es un acto administrativo vigente y la alcaldía lo ha incumplido.", "La vigencia del acto y el incumplimiento no bastan: la ley excluye expresamente de esta acción el cumplimiento de normas que establezcan gastos (par. del art. 9 de la Ley 393).", false], ["B", "procede solo si el veedor demuestra que sufrirá un perjuicio irremediable.", "El perjuicio irremediable permite prescindir de la renuencia previa (art. 8), pero no supera la improcedencia frente a normas que establecen gastos (par. del art. 9).", false], ["C", "no procede, porque no puede perseguir el cumplimiento de normas que establezcan gastos.", "El parágrafo del artículo 9 de la Ley 393 de 1997 dispone que la acción de cumplimiento no podrá perseguir el cumplimiento de normas que establezcan gastos, como ocurre con un acuerdo que ordena construir una obra de $3.000 millones.", true]]}, {"id": "GE-152", "niv": 3, "e": "Frente a la ocupación del andén de la plaza, el veedor puede", "f": "Constitución Política, art. 88; Ley 472 de 1998, art. 4; Ley 1437 de 2011, art. 144", "o": [["A", "interponer una tutela, porque la ocupación del andén vulnera su derecho fundamental a la libre circulación.", "La afectación descrita recae sobre el espacio público, un derecho colectivo, cuya vía principal es la acción popular; la tutela es subsidiaria y no está diseñada para estos intereses colectivos.", false], ["B", "ejercer la acción popular para proteger el espacio público, previa solicitud a la alcaldía para que adopte medidas, salvo peligro inminente.", "El goce del espacio público es un derecho colectivo (art. 4 de la Ley 472 de 1998; art. 88 de la Constitución). El inciso tercero del artículo 144 del CPACA exige pedir antes a la autoridad que adopte las medidas de protección y permite acudir al juez si no lo hace en quince días o se niega, salvo inminente peligro de perjuicio irremediable.", true], ["C", "acudir al personero municipal, que es el único legitimado para ejercer acciones populares.", "Cualquier persona puede demandar la protección de los derechos colectivos (art. 144 del CPACA y Ley 472 de 1998); el personero también puede hacerlo, pero no es el único legitimado.", false]]}]}, {"comp": "gestion_publica", "rol": "general", "tag": "Gestión pública y funcionamiento del Estado · Órganos de control y órganos autónomos", "texto": "Usted es técnico de una procuraduría provincial y atiende tres consultas en la misma mañana. Un ciudadano denuncia que el tesorero de un municipio hizo pagos dobles a un proveedor y pide que la Procuraduría «le cobre al tesorero el dinero perdido». Una aspirante pregunta qué entidad administra y vigila la carrera de los empleados de la alcaldía y si esa misma entidad administra la carrera de la Procuraduría. Y un estudiante de economía pregunta quién es la autoridad monetaria, cambiaria y crediticia del país.", "items": [{"id": "GE-153", "niv": 1, "e": "Al ciudadano que pide que la Procuraduría cobre al tesorero el dinero perdido, usted le explica que", "f": "Constitución Política, arts. 267, 268, 272 y 277", "o": [["A", "la responsabilidad fiscal la declara la contraloría competente, sin perjuicio de la acción disciplinaria.", "El control fiscal y el establecimiento de la responsabilidad que se derive de la gestión fiscal corresponden a la Contraloría General de la República y, en el nivel territorial, a las contralorías departamentales y municipales (arts. 267, 268 y 272); la Procuraduría puede adelantar la acción disciplinaria por los mismos hechos (art. 277).", true], ["B", "la Procuraduría declara la responsabilidad fiscal y ordena al tesorero reintegrar los recursos.", "La responsabilidad fiscal no la declara la Procuraduría sino las contralorías (arts. 267, 268 y 272 de la Constitución); la Procuraduría ejerce el poder disciplinario.", false], ["C", "el concejo municipal declara la responsabilidad fiscal del tesorero mediante un acuerdo, previo informe del personero.", "El concejo ejerce control político, no fiscal; la responsabilidad fiscal es competencia de las contralorías.", false]]}, {"id": "GE-154", "niv": 3, "e": "A la aspirante que pregunta por la administración de las carreras, usted le responde que", "f": "Constitución Política, arts. 130 y 279", "o": [["A", "la Comisión Nacional del Servicio Civil administra y vigila la carrera de la alcaldía, pero no la de la Procuraduría, que es especial.", "El artículo 130 de la Constitución asigna a la Comisión Nacional del Servicio Civil la administración y vigilancia de las carreras de los servidores públicos, excepto las que tengan carácter especial. La de la Procuraduría es una carrera especial de origen constitucional (art. 279).", true], ["B", "la Comisión Nacional del Servicio Civil administra y vigila ambas carreras, porque es responsable de todas las carreras del Estado.", "El artículo 130 de la Constitución excluye de la competencia de la Comisión las carreras de carácter especial, como la de la Procuraduría.", false], ["C", "la alcaldía y la Procuraduría administran cada una su propia carrera, sin vigilancia de ninguna entidad externa.", "La carrera administrativa de las alcaldías la administra y vigila la Comisión Nacional del Servicio Civil (art. 130); no es la propia alcaldía la que la administra.", false]]}, {"id": "GE-155", "niv": 2, "e": "Al estudiante que pregunta por la autoridad monetaria, cambiaria y crediticia, usted le indica que es", "f": "Constitución Política, arts. 371 y 372", "o": [["A", "la Superintendencia Financiera, porque vigila a los establecimientos bancarios.", "La Superintendencia Financiera ejerce inspección y vigilancia sobre entidades financieras; no es la autoridad monetaria, cambiaria y crediticia (art. 372).", false], ["B", "el Ministerio de Hacienda y Crédito Público, como cabeza del sector.", "El ministro de Hacienda integra la junta directiva del Banco de la República, pero la Constitución atribuye la condición de autoridad monetaria a la junta, no al Ministerio (art. 372).", false], ["C", "la junta directiva del Banco de la República, que es un órgano con autonomía administrativa, patrimonial y técnica.", "El artículo 371 de la Constitución organiza el Banco de la República como persona jurídica de derecho público con autonomía administrativa, patrimonial y técnica, y el artículo 372 dispone que su junta directiva es la autoridad monetaria, cambiaria y crediticia.", true]]}]}, {"comp": "atencion_usuario", "rol": "tecnico", "tag": "Atención al usuario · Niveles técnico, administrativo y operativo · Peticiones verbales", "texto": "Usted es técnico de la Oficina de Atención al Ciudadano de una procuraduría regional y atiende la ventanilla presencial. Un lunes en la mañana, una señora le expone de palabra que la alcaldía de su municipio no le ha resuelto una solicitud de subsidio y pide que la Procuraduría intervenga; al terminar, le solicita un documento que pruebe que presentó la petición. Luego llega un líder indígena que solo habla wayuunaiki y quiere presentar una petición verbal; la sede no tiene intérprete en su planta de personal. Por último, un joven le pregunta en qué lugar de la ciudad puede averiguar el estado de su cédula, y usted le indica la dirección de la registraduría más cercana.", "items": [{"id": "AU-101", "niv": 1, "e": "Con la solicitud verbal de la señora, lo que corresponde es", "f": "Ley 1755 de 2015, art. 1 (art. 15 de la Ley 1437 de 2011); Decreto 1069 de 2015, art. 2.2.3.12.3 (adicionado por el Decreto 1166 de 2016)", "o": [["A", "orientarla sin radicar nada y explicarle que la constancia de presentación solo se expide para peticiones escritas.", "Es al revés: el artículo 15 del CPACA dispone que, si quien presenta una petición verbal pide constancia, el funcionario la expedirá en forma sucinta.", false], ["B", "dejar constancia de la petición, radicarla de inmediato y entregarle copia de esa constancia, como ella lo pidió.", "El artículo 15 del CPACA admite las peticiones verbales con constancia, y el artículo 2.2.3.12.3 del Decreto 1069 de 2015 ordena radicar de inmediato la constancia y entregar copia de ella si el peticionario la pide.", true], ["C", "pedirle que la presente por escrito, porque las solicitudes de intervención ante otra entidad no pueden formularse de palabra.", "Ninguna norma exige la forma escrita para esta solicitud. El Decreto 1069 de 2015 (art. 2.2.3.12.12) prohíbe negar la recepción de una petición verbal con la excusa de exigir un documento escrito, salvo que la petición lo requiera.", false]]}, {"id": "AU-102", "niv": 2, "e": "Frente a la petición del líder indígena, la sede debe", "f": "Decreto 1069 de 2015, art. 2.2.3.12.9 (adicionado por el Decreto 1166 de 2016)", "o": [["A", "pedirle que regrese con una persona que traduzca su petición al castellano, pues sin traducción no puede radicarse.", "Las personas que hablan una lengua nativa pueden presentar peticiones verbales en ella ante cualquier autoridad; la falta de intérprete no autoriza a trasladarle esa carga al peticionario.", false], ["B", "remitirlo a la Defensoría del Pueblo, entidad encargada de recibir las peticiones presentadas en lenguas nativas.", "No existe una entidad única para recibir peticiones en lenguas nativas: la norma obliga a cualquier autoridad a habilitar mecanismos para recibirlas, constatarlas y radicarlas.", false], ["C", "anotar que la sede no tiene intérprete y grabar lo que expone para traducirlo y contestarle más adelante.", "El artículo 2.2.3.12.9 del Decreto 1069 de 2015 prevé que, si la entidad no tiene intérpretes en su planta, deja constancia de ello y graba la petición por cualquier medio tecnológico para su posterior traducción y respuesta.", true]]}, {"id": "AU-103", "niv": 2, "e": "Sobre la consulta del joven, es acertado afirmar que", "f": "Decreto 1069 de 2015, art. 2.2.3.12.4 (adicionado por el Decreto 1166 de 2016)", "o": [["A", "debía radicarse y trasladarse a la registraduría dentro de los cinco días siguientes, por falta de competencia.", "El traslado del artículo 21 del CPACA aplica a peticiones escritas que la entidad no es competente para resolver; una simple orientación verbal sobre dónde acudir no requiere radicación ni remisión.", false], ["B", "no requería constancia ni radicación, porque se resolvió con una simple orientación sobre a dónde acudir.", "El inciso 2 del artículo 2.2.3.12.4 del Decreto 1069 de 2015 exime de constancia y radicación la petición de información cuya respuesta consiste en una simple orientación del servidor sobre el lugar al que puede dirigirse el ciudadano.", true], ["C", "debía radicarse como solicitud de información y responderse por escrito dentro de los diez días siguientes.", "La respuesta escrita se exige para las solicitudes verbales de acceso a información pública que se radican; aquí bastó una orientación, caso en el que la norma no exige constancia ni radicación.", false]]}]}, {"comp": "atencion_usuario", "rol": "tecnico", "tag": "Atención al usuario · Niveles técnico, administrativo y operativo · Radicación de peticiones", "texto": "Usted es auxiliar administrativo encargado de radicar la correspondencia en una procuraduría provincial. Un ciudadano entrega una petición escrita en la que solicita que la Procuraduría vigile un proceso de contratación de su municipio, pero no adjunta la copia del contrato que la oficina suele pedir y tampoco explica por qué cree que hay irregularidades. Usted le advierte del documento faltante, pero él insiste en que se la reciban así. Más tarde, una exfuncionaria de la misma procuraduría solicita una certificación laboral, y el coordinador le sugiere a usted exigirle copia de su acta de posesión, documento que reposa en la hoja de vida que custodia la entidad.", "items": [{"id": "AU-104", "niv": 1, "e": "Ante la insistencia del ciudadano, usted debe", "f": "Ley 1755 de 2015, art. 1 (art. 15, incisos 2 y 3 y parágrafo 2, de la Ley 1437 de 2011)", "o": [["A", "radicar la petición y dejar constancia del documento que hace falta.", "Según el artículo 15 del CPACA, en el acto de recibo se indican los documentos faltantes y, si el peticionario insiste, se radica dejando constancia de ellos. Ninguna autoridad puede negarse a radicar peticiones respetuosas.", true], ["B", "devolverle la petición para que la presente de nuevo cuando tenga la copia del contrato.", "Contradice el parágrafo 2 del artículo 15 del CPACA, que prohíbe negarse a recibir y radicar peticiones respetuosas; la falta de un anexo no autoriza la devolución.", false], ["C", "recibirla de manera provisional, sin número de radicado, hasta que el ciudadano complete el anexo.", "La ley no contempla recibos provisionales: la petición debe radicarse, porque desde la radicación corren los términos y queda prueba de su presentación.", false]]}, {"id": "AU-105", "niv": 3, "e": "Sobre la falta de explicación de los motivos de la petición, es correcto afirmar que", "f": "Ley 1755 de 2015, art. 1 (arts. 16, parágrafo 2, 17 y 19 de la Ley 1437 de 2011)", "o": [["A", "la petición debe devolverse para que el ciudadano la aclare, porque sin razones su objeto no se comprende.", "La devolución para aclarar procede solo cuando no se comprende la finalidad u objeto de la petición (art. 19 del CPACA); aquí el objeto, vigilar un proceso de contratación, es claro.", false], ["B", "la falta de argumentos no autoriza a rechazar la petición, que debe tramitarse de todos modos.", "El parágrafo 2 del artículo 16 del CPACA dispone que en ningún caso podrá rechazarse una petición por fundamentación inadecuada o incompleta.", true], ["C", "la petición se entiende desistida si el ciudadano no explica sus razones dentro del mes siguiente.", "El desistimiento tácito del artículo 17 del CPACA exige un requerimiento previo por falta de requisitos o documentos necesarios para decidir; la ausencia de fundamentación no es causal de desistimiento.", false]]}, {"id": "AU-106", "niv": 2, "e": "Frente a la sugerencia del coordinador sobre el acta de posesión, lo procedente es", "f": "Ley 1437 de 2011, art. 9, num. 4; Ley 1755 de 2015, art. 1 (art. 16, parágrafo 1, de la Ley 1437 de 2011)", "o": [["A", "no exigirla, porque es un documento que ya reposa en los archivos de la entidad.", "El artículo 9, numeral 4, del CPACA prohíbe exigir constancias, certificaciones o documentos que reposen en la respectiva entidad, y el parágrafo 1 del artículo 16 impide tener por incompleta una petición por esa razón.", true], ["B", "exigirla solo si la exfuncionaria se retiró hace más de un año, porque su hoja de vida ya pasó al archivo central.", "El traslado de la hoja de vida al archivo central no cambia que el documento repose en la entidad; la prohibición del artículo 9, numeral 4, del CPACA sigue aplicando.", false], ["C", "exigirla, porque la certificación laboral es un trámite personal que el titular debe soportar con sus propios documentos.", "Que el trámite sea personal no autoriza a pedir documentos que ya tiene la entidad: el artículo 9, numeral 4, del CPACA lo prohíbe expresamente.", false]]}]}, {"comp": "atencion_usuario", "rol": "profesional", "tag": "Atención al usuario · Niveles profesional, asesor y ejecutivo · Modalidades y términos del derecho de petición", "texto": "Usted es profesional universitario de la oficina jurídica de una gobernación y proyecta respuestas a derechos de petición. Hoy recibe dos asuntos: un ciudadano, que además es concejal de uno de los municipios del departamento, pide a título personal el concepto de la gobernación sobre cómo debe entenderse una ordenanza que regula una estampilla; y una veeduría ciudadana pide copias de los informes de supervisión de un contrato de obra. El secretario de despacho le pregunta qué plazos aplican, qué ocurre si no se responde a tiempo y si la respuesta al primer asunto obligará al peticionario.", "items": [{"id": "AU-107", "niv": 1, "e": "El término para resolver la pregunta sobre el alcance de la ordenanza es de", "f": "Ley 1755 de 2015, art. 1 (art. 14 de la Ley 1437 de 2011)", "o": [["A", "diez días siguientes a su recepción, porque se pide información sobre una norma.", "El término de diez días es para peticiones de documentos e información; aquí no se pide un dato o un documento, sino el criterio de la entidad, lo que constituye una consulta.", false], ["B", "quince días siguientes a su recepción, por ser una petición de interés general.", "Quince días es el término general; la pregunta sobre cómo interpreta la entidad una materia a su cargo es una consulta, que tiene término especial.", false], ["C", "treinta días siguientes a su recepción, por tratarse de una consulta sobre materias a su cargo.", "El numeral 2 del artículo 14 del CPACA fija treinta días para resolver las peticiones con las que se eleva una consulta a las autoridades sobre materias a su cargo.", true]]}, {"id": "AU-108", "niv": 2, "e": "Si la gobernación deja vencer el término sin responder a la veeduría, la consecuencia legal es que", "f": "Ley 1755 de 2015, art. 1 (art. 14, num. 1, de la Ley 1437 de 2011)", "o": [["A", "la solicitud se entiende negada y la veeduría puede acudir directamente al recurso de insistencia ante el tribunal administrativo.", "Para las peticiones de documentos la ley prevé el efecto contrario: el silencio equivale a aceptación. La insistencia procede cuando la autoridad rechaza la solicitud invocando reserva.", false], ["B", "la gobernación debe pedir la ampliación del término al día siguiente del vencimiento, explicando los motivos de la demora.", "La ampliación del parágrafo del artículo 14 debe informarse antes de que venza el término; vencido este sin respuesta, ya se produjo el efecto legal de aceptación.", false], ["C", "la solicitud se entiende aceptada, ya no puede negarse la entrega y las copias deben darse dentro de los tres días siguientes.", "El numeral 1 del artículo 14 del CPACA dispone que, si la petición de documentos no se responde en diez días, se entiende aceptada para todos los efectos, la administración ya no puede negar la entrega y las copias se entregan dentro de los tres días siguientes.", true]]}, {"id": "AU-109", "niv": 2, "e": "Sobre los efectos de la respuesta que se dé al primer asunto, es correcto afirmar que", "f": "Ley 1755 de 2015, art. 1 (art. 28 de la Ley 1437 de 2011)", "o": [["A", "por regla general no será de obligatorio cumplimiento ni de ejecución para quien formuló la consulta.", "Según el artículo 28 del CPACA, salvo disposición legal en contrario, los conceptos que se emiten en respuesta a consultas no son de obligatorio cumplimiento o ejecución.", true], ["B", "obligará al peticionario y a los municipios del departamento, por provenir de la autoridad que expidió la ordenanza.", "El artículo 28 del CPACA establece lo contrario: salvo disposición legal en contrario, los conceptos emitidos como respuesta a consultas no son de obligatorio cumplimiento.", false], ["C", "solo obligará al peticionario si este la acepta expresamente dentro de los diez días siguientes a su notificación.", "La ley no condiciona el efecto del concepto a una aceptación del peticionario; simplemente dispone que, por regla general, no es obligatorio.", false]]}]}, {"comp": "atencion_usuario", "rol": "general", "tag": "Atención al usuario · Cálculo de términos del derecho de petición", "texto": "Usted trabaja en el grupo de atención al ciudadano de una procuraduría provincial y lleva el control de vencimientos. El miércoles 3 de febrero de 2027 se radicaron por el canal electrónico tres peticiones de distintos ciudadanos: una queja por la mala atención que uno de ellos recibió en la sede; una solicitud de copia de un informe de gestión de la entidad; y una consulta en la que se pide el concepto de la procuraduría sobre cómo interpreta su intervención en las conciliaciones extrajudiciales. Las tres están completas, la procuraduría es competente, ninguna tiene un término especial distinto de los del CPACA y no hay festivos en ese periodo.", "items": [{"id": "AU-110", "niv": 3, "e": "El último día para resolver oportunamente la queja es el", "f": "Ley 1755 de 2015, art. 1 (art. 14 de la Ley 1437 de 2011); cálculo de días hábiles", "o": [["A", "jueves 18 de febrero de 2027.", "Resulta de contar quince días calendario. Los términos en días del CPACA se cuentan en días hábiles, por lo que se excluyen sábados y domingos.", false], ["B", "martes 23 de febrero de 2027.", "Resulta de contar el mismo 3 de febrero como primer día. El término corre dentro de los quince días siguientes a la recepción, es decir, desde el 4 de febrero.", false], ["C", "miércoles 24 de febrero de 2027.", "La queja sigue el término general de quince días hábiles siguientes a la recepción: 4 y 5 de febrero (2), 8 a 12 (7), 15 a 19 (12), 22, 23 y 24 (15).", true]]}, {"id": "AU-111", "niv": 2, "e": "El último día para resolver la solicitud de copia del informe es el", "f": "Ley 1755 de 2015, art. 1 (art. 14, num. 1, de la Ley 1437 de 2011); cálculo de días hábiles", "o": [["A", "martes 16 de febrero de 2027.", "Resulta de contar el día de la radicación como primer día; el plazo empieza el día siguiente a la recepción.", false], ["B", "miércoles 17 de febrero de 2027.", "Las peticiones de documentos se resuelven dentro de los diez días hábiles siguientes a su recepción: 4 y 5 de febrero (2), 8 a 12 (7), 15, 16 y 17 (10).", true], ["C", "miércoles 24 de febrero de 2027.", "Aplica el término general de quince días, pero la solicitud de copias de documentos tiene término especial de diez días.", false]]}, {"id": "AU-112", "niv": 3, "e": "El último día para resolver la consulta es el", "f": "Ley 1755 de 2015, art. 1 (art. 14, num. 2, de la Ley 1437 de 2011); cálculo de días hábiles", "o": [["A", "viernes 5 de marzo de 2027.", "Resulta de contar treinta días calendario; el término es de días hábiles.", false], ["B", "martes 16 de marzo de 2027.", "Resulta de incluir el día de la radicación en el conteo; el término corre desde el día siguiente.", false], ["C", "miércoles 17 de marzo de 2027.", "Las consultas se resuelven dentro de los treinta días hábiles siguientes a su recepción: 4 y 5 de febrero (2), 8 a 12 (7), 15 a 19 (12), 22 a 26 (17), 1 a 5 de marzo (22), 8 a 12 (27) y 15 a 17 (30).", true]]}]}, {"comp": "atencion_usuario", "rol": "general", "tag": "Atención al usuario · Ampliación del término y peticiones análogas", "texto": "En la Secretaría de Movilidad de un municipio se recibió una petición de interés particular cuya respuesta depende de un estudio técnico que tardará varias semanas. El jefe de la dependencia propone esperar a que venza el término legal y, al día siguiente, enviar al peticionario un oficio que explique la demora. En la misma semana, la secretaría recibe catorce peticiones casi idénticas de vecinos de un barrio, que piden información de interés común sobre el cronograma de una obra de semaforización.", "items": [{"id": "AU-113", "niv": 2, "e": "Para ampliar válidamente el término de la petición que requiere el estudio técnico, la secretaría debe", "f": "Ley 1755 de 2015, art. 1 (art. 14, parágrafo, de la Ley 1437 de 2011)", "o": [["A", "solicitar autorización a la personería municipal para prorrogar el término por una sola vez.", "La ley no exige autorización de la personería ni de ninguna otra autoridad: la ampliación la decide y comunica la misma entidad.", false], ["B", "informar al peticionario, antes de que venza el término, los motivos de la demora y el plazo razonable en que responderá.", "El parágrafo del artículo 14 del CPACA permite, de forma excepcional, ampliar el término si la autoridad informa al interesado antes del vencimiento los motivos de la demora y el plazo razonable de respuesta.", true], ["C", "enviar el oficio al día siguiente del vencimiento, como propone el jefe, porque la ley permite justificar la demora una vez ocurre.", "El parágrafo del artículo 14 del CPACA exige informar antes del vencimiento; un aviso posterior no evita el incumplimiento del término.", false]]}, {"id": "AU-114", "niv": 2, "e": "El plazo que la secretaría anuncie para responder esa petición no puede exceder", "f": "Ley 1755 de 2015, art. 1 (art. 14, parágrafo, de la Ley 1437 de 2011)", "o": [["A", "del doble del término inicialmente previsto para ese tipo de petición.", "El parágrafo del artículo 14 del CPACA dispone que el plazo razonable que se señale no podrá exceder del doble del inicialmente previsto.", true], ["B", "del triple del término inicialmente previsto, si el estudio técnico lo justifica.", "La ley fija un tope fijo, el doble del término inicial, y no permite superarlo por la complejidad del asunto.", false], ["C", "de un mes contado desde el vencimiento del término inicial.", "El plazo de un mes corresponde al que se da al peticionario para completar una petición incompleta (art. 17 del CPACA), no a la ampliación del término para responder.", false]]}, {"id": "AU-115", "niv": 3, "e": "Frente a las catorce peticiones sobre el cronograma de la obra, la secretaría puede", "f": "Ley 1755 de 2015, art. 1 (arts. 19 y 22 de la Ley 1437 de 2011)", "o": [["A", "emitir una sola respuesta para todos, difundirla en un diario de amplia circulación y en su sitio web, y dar copia a quien la pida.", "El inciso 2 del artículo 22 del CPACA permite dar una única respuesta cuando más de diez personas formulan peticiones análogas de información, de interés general o de consulta, con esas formas de publicación y entrega de copias.", true], ["B", "responder solo al primer peticionario y archivar las demás como peticiones reiterativas, porque quedan resueltas con esa respuesta.", "Las peticiones reiterativas del artículo 19 son las que presenta de nuevo quien ya obtuvo respuesta; aquí son personas distintas que no han recibido ninguna.", false], ["C", "acumularlas en un solo expediente y resolverlas dentro de los treinta días siguientes, por tratarse de una petición colectiva.", "La ley no crea un término de treinta días para peticiones colectivas; el de treinta días es para consultas y aquí se pide información.", false]]}]}, {"comp": "atencion_usuario", "rol": "tecnico", "tag": "Atención al usuario · Niveles técnico, administrativo y operativo · Falta de competencia y traslado", "texto": "Usted es técnico administrativo de la ventanilla de radicación de una procuraduría provincial. El jueves 11 de febrero de 2027 recibe por correo certificado una petición escrita en la que una ciudadana solicita a la Procuraduría que le reconozca y pague una pensión de sobrevivientes, asunto que corresponde al fondo de pensiones al que estaba afiliado su esposo. Ese mismo día, un señor se acerca a la ventanilla y pide, de palabra, que la Procuraduría le expida a su hijo el certificado de antecedentes judiciales; usted le explica que esa no es una función de la entidad y le indica a quién acudir, pero él insiste en que le reciban la petición. No hay festivos en ese periodo.", "items": [{"id": "AU-116", "niv": 3, "e": "El último día para informar a la ciudadana y remitir su petición al fondo de pensiones es el", "f": "Ley 1755 de 2015, art. 1 (art. 21 de la Ley 1437 de 2011); cálculo de días hábiles", "o": [["A", "martes 16 de febrero de 2027.", "Resulta de contar cinco días calendario; el término se cuenta en días hábiles, sin sábados ni domingos.", false], ["B", "miércoles 17 de febrero de 2027.", "Resulta de contar el día de la recepción como primer día; el plazo corre dentro de los cinco días siguientes al de la recepción.", false], ["C", "jueves 18 de febrero de 2027.", "Si la petición se presentó por escrito, hay cinco días siguientes a la recepción para informar y remitir: 12 de febrero (1), 15, 16, 17 y 18 (5).", true]]}, {"id": "AU-117", "niv": 1, "e": "Una vez el fondo de pensiones reciba la petición remitida, el término para resolverla se cuenta", "f": "Ley 1755 de 2015, art. 1 (art. 21 de la Ley 1437 de 2011)", "o": [["A", "desde la fecha en que la ciudadana confirme que recibió la copia del oficio remisorio.", "La copia del oficio remisorio informa a la peticionaria, pero no marca el inicio del término para decidir.", false], ["B", "a partir del día siguiente a la recepción de la petición por la autoridad competente.", "El artículo 21 del CPACA dispone que los términos para decidir o responder se cuentan a partir del día siguiente a la recepción de la petición por la autoridad competente.", true], ["C", "a partir del día siguiente a la fecha en que la Procuraduría recibió la petición.", "La ley no traslada al competente el tiempo corrido ante la autoridad que no lo era: el término empieza con la recepción por la autoridad competente.", false]]}, {"id": "AU-118", "niv": 2, "e": "Frente a la insistencia del señor que hizo la petición verbal, usted debe", "f": "Decreto 1069 de 2015, art. 2.2.3.12.7 (adicionado por el Decreto 1166 de 2016)", "o": [["A", "exigirle que la presente por escrito, porque solo así puede remitirse a la autoridad competente.", "Exigir la forma escrita como condición para radicar una petición verbal está proscrito, salvo que la petición así lo requiera (art. 2.2.3.12.12 del Decreto 1069 de 2015).", false], ["B", "radicarla, dejar constancia de la orientación que le dio y darle después el trámite que corresponda.", "El artículo 2.2.3.12.7 del Decreto 1069 de 2015 dispone que, si el peticionario verbal insiste pese a la falta de competencia, el funcionario deja constancia, la radica y le da el trámite correspondiente, registrando la orientación dada.", true], ["C", "abstenerse de radicarla, porque en las peticiones verbales la falta de competencia se resuelve solo con la orientación en el acto.", "La orientación en el acto es el primer paso, pero la norma reconoce al peticionario el derecho a insistir en que se radique.", false]]}]}, {"comp": "atencion_usuario", "rol": "profesional", "tag": "Atención al usuario · Niveles profesional, asesor y ejecutivo · Peticiones incompletas y desistimiento tácito", "texto": "Usted es profesional universitario de la Secretaría de Vivienda de un municipio y proyecta los actos de trámite y las decisiones del programa de mejoramiento de vivienda. El lunes 1 de marzo de 2027 se radicó la solicitud de inscripción de un ciudadano. Al revisarla, usted constata que falta el certificado de libertad y tradición del inmueble, documento exigido por el reglamento del programa, necesario para decidir y que la secretaría no tiene en sus archivos. La actuación puede continuar sin oponerse a la ley. No hay festivos en ese periodo.", "items": [{"id": "AU-119", "niv": 3, "e": "El último día para requerir al ciudadano que complete la solicitud es el", "f": "Ley 1755 de 2015, art. 1 (art. 17 de la Ley 1437 de 2011); cálculo de días hábiles", "o": [["A", "jueves 11 de marzo de 2027.", "Resulta de contar diez días calendario; el término es de días hábiles.", false], ["B", "viernes 12 de marzo de 2027.", "Resulta de contar el día de la radicación como primer día; el requerimiento se hace dentro de los diez días siguientes a la radicación.", false], ["C", "lunes 15 de marzo de 2027.", "El artículo 17 del CPACA ordena requerir dentro de los diez días siguientes a la radicación: 2 a 5 de marzo (4), 8 a 12 (9) y lunes 15 (10).", true]]}, {"id": "AU-120", "niv": 2, "e": "Si el ciudadano no logra conseguir el certificado dentro del plazo que se le conceda, puede", "f": "Ley 1755 de 2015, art. 1 (art. 17 de la Ley 1437 de 2011)", "o": [["A", "pedir, antes de que venza ese plazo, una prórroga hasta por un término igual.", "El artículo 17 del CPACA concede hasta un mes para completar la petición y permite pedir, antes de su vencimiento, prórroga hasta por un término igual.", true], ["B", "pedir la prórroga dentro de los diez días siguientes al vencimiento del plazo.", "La prórroga debe pedirse antes de que venza el plazo concedido; vencido este sin cumplir el requerimiento, se entiende que desistió.", false], ["C", "pedir una prórroga de quince días, que es el máximo que la ley admite para completar una petición.", "La prórroga no es de quince días: puede ser hasta por un término igual al concedido, que es de máximo un mes.", false]]}, {"id": "AU-121", "niv": 3, "e": "Si vence el plazo y el ciudadano no aporta el certificado ni pide prórroga, la secretaría debe", "f": "Ley 1755 de 2015, art. 1 (art. 17 de la Ley 1437 de 2011)", "o": [["A", "archivar la solicitud sin acto administrativo, porque el desistimiento tácito opera de pleno derecho.", "El artículo 17 del CPACA exige que la autoridad decrete el desistimiento y el archivo mediante acto administrativo motivado.", false], ["B", "declarar por acto motivado que desistió y archivar, con notificación personal y solo recurso de reposición.", "Así lo ordena el artículo 17 del CPACA, que además permite al ciudadano presentar de nuevo la solicitud con el lleno de los requisitos legales.", true], ["C", "negar de fondo la inscripción, decisión contra la cual proceden los recursos de reposición y apelación.", "La consecuencia legal no es una negativa de fondo, sino el desistimiento, y contra ese acto únicamente procede el recurso de reposición.", false]]}]}, {"comp": "atencion_usuario", "rol": "general", "tag": "Atención al usuario · Peticiones irrespetuosas, oscuras o reiterativas", "texto": "En la oficina de atención al ciudadano de una gobernación se reciben tres escritos. El primero contiene insultos contra el gobernador y su equipo, sin ninguna solicitud concreta. El segundo, firmado por un vecino que dejó su dirección, es una hoja manuscrita con frases sueltas sobre «el problema del agua», de la que no se logra entender qué pide ni a qué se refiere. El tercero es de una señora a quien el mes anterior se le negó la inscripción en un programa para adultos mayores porque no acreditó la edad mínima; ahora presenta la misma solicitud y anexa el registro civil que demuestra que ya cumplió esa edad.", "items": [{"id": "AU-122", "niv": 1, "e": "Frente al primer escrito, la ley permite a la gobernación", "f": "Ley 1755 de 2015, art. 1 (art. 19 de la Ley 1437 de 2011); Corte Constitucional, Sentencia C-951 de 2014", "o": [["A", "rechazarlo mediante una respuesta motivada, porque toda petición debe ser respetuosa.", "El artículo 19 del CPACA dispone que toda petición debe ser respetuosa so pena de rechazo; la Corte Constitucional, al revisar esa norma en la Sentencia C-951 de 2014, precisó que el rechazo debe ser motivado y excepcional.", true], ["B", "tramitarlo como petición general y responderlo dentro de los quince días siguientes.", "La ley autoriza el rechazo de las peticiones irrespetuosas; no obliga a tramitar un escrito ofensivo como si fuera una petición ordinaria.", false], ["C", "devolverlo para que su autor lo corrija dentro de los diez días siguientes.", "La devolución para corregir o aclarar es la regla para las peticiones oscuras, cuya finalidad u objeto no se comprende, no para las irrespetuosas.", false]]}, {"id": "AU-123", "niv": 3, "e": "Con el segundo escrito, lo procedente es", "f": "Ley 1755 de 2015, art. 1 (arts. 17 y 19 de la Ley 1437 de 2011)", "o": [["A", "devolverlo para que su autor lo aclare dentro de los diez días siguientes y archivarlo si no lo hace.", "El artículo 19 del CPACA ordena devolver la petición cuya finalidad u objeto no se comprende para que se corrija o aclare dentro de los diez días siguientes; si no se aclara, se archiva.", true], ["B", "archivarlo de inmediato, porque un escrito incomprensible no genera la obligación de responder.", "Antes de archivar, la ley exige devolver el escrito para que el interesado lo aclare; el archivo solo procede si no lo hace.", false], ["C", "requerir a su autor para que lo complete en el término máximo de un mes, so pena de desistimiento tácito.", "El requerimiento del artículo 17 es para peticiones incompletas cuyo objeto se entiende; cuando no se comprende qué se pide, aplica la devolución del artículo 19.", false]]}, {"id": "AU-124", "niv": 3, "e": "Respecto de la nueva solicitud de la señora, la gobernación", "f": "Ley 1755 de 2015, art. 1 (art. 19, inciso 2, de la Ley 1437 de 2011)", "o": [["A", "debe rechazarla, porque la negativa anterior quedó en firme y solo podía discutirse con los recursos.", "La firmeza de la negativa anterior no impide presentar una nueva petición que acredita el requisito que antes faltaba.", false], ["B", "debe resolverla de fondo, porque la nueva petición subsana el requisito por el que se negó la anterior.", "El inciso 2 del artículo 19 del CPACA exceptúa de la remisión a respuestas anteriores las peticiones negadas por no acreditar requisitos, siempre que en la nueva se subsanen.", true], ["C", "puede limitarse a remitirla a la respuesta anterior, por tratarse de una petición reiterativa ya resuelta.", "La remisión a respuestas anteriores no aplica a las peticiones que se negaron por no acreditar requisitos cuando la nueva petición los subsana, como ocurre aquí.", false]]}]}, {"comp": "atencion_usuario", "rol": "general", "tag": "Atención al usuario · Atención prioritaria de peticiones", "texto": "Usted trabaja en el centro de atención al ciudadano de una procuraduría regional. Llega una mujer con su hijo de 8 años, que requiere con urgencia un medicamento formulado que la EPS no ha entregado; el médico tratante certificó por escrito que la demora pone en riesgo la vida del niño. Ella presenta una petición para que la Procuraduría intervenga ante la EPS y anexa la fórmula y la certificación médica. En la misma fila espera una periodista de un medio regional que, para preparar una nota, pide información sobre el número de quejas recibidas contra alcaldes del departamento durante el último año.", "items": [{"id": "AU-125", "niv": 2, "e": "Para que la petición de la madre reciba atención prioritaria, se requiere que", "f": "Ley 1755 de 2015, art. 1 (art. 20 de la Ley 1437 de 2011)", "o": [["A", "aporte una sentencia de tutela que ordene a la EPS entregar el medicamento dentro de un plazo determinado.", "La atención prioritaria no depende de una orden judicial; precisamente busca evitar el perjuicio irremediable sin esperar otros trámites.", false], ["B", "acredite que antes presentó una queja ante la Superintendencia de Salud y que no obtuvo respuesta oportuna.", "La ley no exige agotar quejas ante otras entidades para obtener atención prioritaria; basta la prueba sumaria del derecho y del riesgo.", false], ["C", "pruebe, al menos de forma sumaria, la titularidad del derecho fundamental del niño y el riesgo de un daño irremediable.", "El artículo 20 del CPACA ordena dar atención prioritaria a las peticiones de reconocimiento de un derecho fundamental que deban resolverse para evitar un perjuicio irremediable; el peticionario debe probar sumariamente la titularidad del derecho y el riesgo.", true]]}, {"id": "AU-126", "niv": 1, "e": "Dado que la vida del niño está en peligro inminente por razones de salud, la autoridad debe", "f": "Ley 1755 de 2015, art. 1 (art. 20, inciso 2, de la Ley 1437 de 2011)", "o": [["A", "resolver la petición dentro de los cinco días siguientes, término especial previsto para las peticiones en salud.", "La ley no fija un término especial de cinco días para peticiones en salud; ordena adoptar de inmediato medidas de urgencia.", false], ["B", "adoptar de inmediato las medidas de urgencia necesarias, sin perjuicio del trámite que deba darse a la petición.", "El inciso 2 del artículo 20 del CPACA dispone que, si por razones de salud o de seguridad personal está en peligro inminente la vida o la integridad del destinatario, la autoridad adoptará de inmediato las medidas de urgencia, sin perjuicio del trámite de la petición.", true], ["C", "tramitar la petición en el turno que le corresponda y adoptar medidas solo cuando decida de fondo.", "Cuando está en peligro inminente la vida o la integridad, las medidas de urgencia no esperan la decisión de fondo.", false]]}, {"id": "AU-127", "niv": 1, "e": "Sobre la solicitud de la periodista, es correcto afirmar que", "f": "Ley 1755 de 2015, art. 1 (art. 20, inciso 2, de la Ley 1437 de 2011)", "o": [["A", "solo puede atenderse con preferencia si acredita una tarjeta profesional de periodista expedida por el Estado.", "La norma no exige tarjeta profesional; basta que la petición se haga para el ejercicio de la actividad periodística.", false], ["B", "debe esperar el término general de quince días, porque la información estadística no admite trato preferente.", "La ley ordena el trámite preferencial de las peticiones de periodistas para su actividad; además, una petición de información tiene término especial de diez días, no de quince.", false], ["C", "se tramita de manera preferencial, porque la formula para el ejercicio de su actividad como periodista.", "El inciso 2 del artículo 20 del CPACA dispone que la petición que realiza un periodista para el ejercicio de su actividad se tramita preferencialmente.", true]]}]}, {"comp": "atencion_usuario", "rol": "general", "tag": "Atención al usuario · Derechos y deberes de las personas ante las autoridades", "texto": "En la sede de atención al público de una alcaldía funciona un sistema de turnos. Una mujer con ocho meses de embarazo llega cuando hay veinte personas esperando. Minutos después, un usuario que en los últimos meses ha presentado varias solicitudes evidentemente improcedentes reclama, en tono ofensivo hacia el funcionario de turno, la respuesta a una petición nueva y procedente que radicó hace un mes y que no ha sido resuelta. Por último, el apoderado de una empresa pide conocer el estado de un trámite de su poderdante y obtener copia de lo actuado; el expediente no está sometido a reserva.", "items": [{"id": "AU-128", "niv": 1, "e": "Respecto de la mujer embarazada, la alcaldía debe", "f": "Ley 1437 de 2011, arts. 5, num. 6, y 7, num. 4", "o": [["A", "darle atención especial y preferente, sin que deba esperar el turno ordinario.", "El numeral 6 del artículo 5 del CPACA reconoce a las mujeres gestantes el derecho a recibir atención especial y preferente, y el numeral 4 del artículo 7 dispone que el sistema de turnos no afecta ese derecho.", true], ["B", "atenderla con prioridad solo si presenta un certificado médico de su estado de gestación.", "La ley no condiciona la atención preferente a un certificado médico; exigirlo crearía un requisito no previsto en la norma.", false], ["C", "asignarle el siguiente turno disponible, porque el sistema de turnos garantiza la igualdad entre todos los usuarios.", "El propio CPACA aclara que el sistema de turnos se aplica sin perjuicio de la atención especial y preferente del numeral 6 del artículo 5.", false]]}, {"id": "AU-129", "niv": 3, "e": "Frente al usuario que se comporta de forma ofensiva y ha reiterado solicitudes improcedentes, la alcaldía", "f": "Ley 1437 de 2011, art. 6 y parágrafo", "o": [["A", "puede abstenerse de responder la petición nueva mientras el usuario no rectifique su trato hacia el funcionario.", "El parágrafo del artículo 6 del CPACA impide usar el incumplimiento de los deberes del ciudadano como pretexto para desconocer el derecho reclamado.", false], ["B", "debe resolver la petición nueva, porque las faltas del usuario a sus deberes no le quitan ese derecho.", "Tratar con respeto a los servidores y no reiterar solicitudes improcedentes son deberes de las personas (art. 6 del CPACA), pero su parágrafo prohíbe a la administración invocar su incumplimiento para desconocer el derecho; solo puede dar lugar a las sanciones que procedan.", true], ["C", "puede rechazar la petición nueva, porque haber reiterado solicitudes improcedentes la convierte en irrespetuosa.", "La petición nueva es procedente y respetuosa; el rechazo por irrespetuosa se refiere al contenido de la petición, no a la conducta pasada del usuario.", false]]}, {"id": "AU-130", "niv": 1, "e": "Sobre la solicitud del apoderado, es correcto afirmar que tiene derecho a", "f": "Ley 1437 de 2011, art. 5, num. 2", "o": [["A", "conocer el estado del trámite y obtener copias de los documentos, a su costa.", "El numeral 2 del artículo 5 del CPACA reconoce el derecho a conocer, salvo reserva legal, el estado de cualquier actuación o trámite y a obtener copias, a su costa, de los documentos.", true], ["B", "conocer el estado del trámite, pero las copias solo se entregan cuando la actuación haya terminado.", "El numeral 2 del artículo 5 del CPACA no limita el acceso a las copias a la terminación de la actuación; lo permite respecto de cualquier actuación no reservada.", false], ["C", "obtener copias gratuitas de lo actuado, porque el ejercicio del derecho de petición no tiene costo.", "La gratuidad se refiere al ejercicio del derecho de petición; el costo de las copias corre por cuenta del interesado (arts. 5, num. 2, y 29 del CPACA).", false]]}]}, {"comp": "atencion_usuario", "rol": "general", "tag": "Atención al usuario · Deberes y prohibiciones de las autoridades en la atención al público", "texto": "La nueva directora administrativa de un instituto descentralizado del orden departamental propone tres medidas para reducir costos: atender al público de manera presencial solo cuatro horas al día, de lunes a viernes; a la hora de cierre, pedir a las personas que ya están dentro de la sede esperando turno que regresen al día siguiente; y exigir a quienes soliciten la renovación de un permiso una copia del permiso anterior, que el mismo instituto expidió y conserva en su archivo.", "items": [{"id": "AU-131", "niv": 1, "e": "La primera medida es contraria a la ley, porque las autoridades deben garantizar atención personal al público", "f": "Ley 1437 de 2011, art. 7, num. 2", "o": [["A", "durante toda la jornada laboral de sus servidores, todos los días hábiles.", "La ley fija un mínimo de cuarenta horas semanales distribuidas en horarios que satisfagan las necesidades del servicio; no exige que coincidan con toda la jornada laboral.", false], ["B", "como mínimo durante treinta y seis horas a la semana.", "El mínimo legal es de cuarenta horas semanales, no de treinta y seis.", false], ["C", "como mínimo durante cuarenta horas a la semana.", "El numeral 2 del artículo 7 del CPACA exige garantizar atención personal al público como mínimo durante cuarenta horas a la semana; la medida propuesta solo suma veinte.", true]]}, {"id": "AU-132", "niv": 1, "e": "La segunda medida desconoce el deber de", "f": "Ley 1437 de 2011, art. 7, num. 3", "o": [["A", "atender a todas las personas que hayan ingresado a sus oficinas dentro del horario normal de atención.", "El numeral 3 del artículo 7 del CPACA obliga a atender a todas las personas que hubieran ingresado a las oficinas dentro del horario normal de atención.", true], ["B", "expedir y actualizar cada año la carta de trato digno al usuario.", "La carta de trato digno (art. 7, num. 5) es un deber distinto, que no se relaciona con la atención de quienes están dentro de la sede.", false], ["C
