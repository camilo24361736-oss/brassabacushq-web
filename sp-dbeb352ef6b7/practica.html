 de culpa.", false], ["B", "una ignorancia o un descuido extremos en lo elemental, o una infracción evidente de reglas obligatorias.", "Hay culpa gravísima cuando se incurre en falta disciplinaria por ignorancia supina, desatención elemental o violación manifiesta de reglas de obligatorio cumplimiento (Ley 1952 de 2019, art. 29, modificado por el art. 4 de la Ley 2094 de 2021).", true], ["C", "inobservancia del cuidado necesario que cualquier persona del común imprime a sus actuaciones ordinarias.", "Esa es la definición legal de culpa grave, no de culpa gravísima (art. 29 de la Ley 1952 de 2019, modificado por la Ley 2094 de 2021).", false]]}, {"id": "DI-114", "niv": 3, "e": "Si en el tercer expediente la culpa leve es la única forma de culpabilidad demostrada, corresponde", "f": "Ley 1952 de 2019, art. 29 (modificado por la Ley 2094 de 2021, art. 4)", "o": [["A", "concluir que no hay lugar a sanción, porque la culpa leve no es sancionable en materia disciplinaria.", "La culpa sancionable puede ser gravísima o grave; la culpa leve no es sancionable en materia disciplinaria (Ley 1952 de 2019, art. 29, modificado por la Ley 2094 de 2021). No debe confundirse la culpa leve (grado de culpabilidad, no sancionable) con la falta leve culposa (clase de falta cometida con culpa grave o gravísima, sancionada con amonestación escrita).", true], ["B", "imponer amonestación escrita, porque esa es la sanción que la ley prevé para las faltas leves culposas.", "Confunde la levedad de la falta con la culpa leve. Las faltas leves culposas se cometen con culpa grave o gravísima; la culpa leve no es sancionable (art. 29 de la Ley 1952 de 2019).", false], ["C", "imponer multa reducida a la mitad, por tratarse de la forma más baja de culpabilidad.", "No existe esa rebaja. La culpa leve no da lugar a sanción alguna (art. 29 de la Ley 1952 de 2019).", false]]}]}, {"comp": "disciplinario", "rol": "profesional", "tag": "Código General Disciplinario · Niveles profesional, asesor y ejecutivo · Clasificación de las faltas y criterios de gravedad", "texto": "Usted es profesional especializado de una procuraduría regional de instrucción y proyecta la evaluación de dos investigaciones. En la primera, un profesional de contratación de un departamento participó en la etapa precontractual desconociendo los principios de la contratación estatal, conducta que se adecua objetivamente a una de las faltas gravísimas descritas en el código; sin embargo, las pruebas solo demuestran que actuó con culpa grave. En la segunda, un auxiliar incumplió uno de los deberes del servidor público y su abogado sostiene que, como esa conducta no aparece en la lista de faltas gravísimas ni en ninguna lista de faltas graves o leves, no puede calificarse ni sancionarse.", "items": [{"id": "DI-115", "niv": 1, "e": "Frente al argumento del abogado del auxiliar, lo correcto es responder que", "f": "Ley 1952 de 2019, arts. 47 (modificado por la Ley 2094 de 2021, art. 8) y 67", "o": [["A", "solo son sancionables las conductas que el código enumera una a una como faltas gravísimas, graves o leves.", "El código no enumera faltas graves ni leves; el artículo 67 de la Ley 1952 de 2019 las define de forma general por incumplimiento de deberes, abuso de derechos, extralimitación o incursión en prohibiciones.", false], ["B", "la calificación como grave o leve la define el manual de funciones de cada entidad.", "La calificación la hace la autoridad disciplinaria con los criterios legales del artículo 47 de la Ley 1952 de 2019, no el manual de funciones.", false], ["C", "solo la ley define cuáles faltas son gravísimas; las demás infracciones de deberes se califican como graves o leves según criterios legales.", "Las faltas gravísimas están taxativamente señaladas en la ley y la gravedad o levedad de las demás se determina con los criterios del artículo 47; constituye falta grave o leve el incumplimiento de deberes, salvo que esté prevista como gravísima (Ley 1952 de 2019, arts. 47 y 67).", true]]}, {"id": "DI-116", "niv": 3, "e": "La conducta del profesional de contratación debe calificarse como", "f": "Ley 1952 de 2019, art. 47, num. 9 (modificado por la Ley 2094 de 2021, art. 8)", "o": [["A", "falta leve, porque la culpa grave impide calificar una falta como gravísima o grave.", "La culpa grave es sancionable (art. 29), y la ley ordena calificar como grave, no como leve, la falta objetivamente gravísima cometida con culpa grave (art. 47, num. 9).", false], ["B", "falta grave, porque la realización de una falta objetivamente gravísima con culpa grave se considera grave.", "Según el artículo 47, numeral 9, de la Ley 1952 de 2019 (modificado por la Ley 2094 de 2021), la realización típica de una falta objetivamente gravísima cometida con culpa grave será considerada falta grave.", true], ["C", "falta gravísima, porque la descripción típica no cambia según la forma de culpabilidad.", "El numeral 9 del artículo 47 de la Ley 1952 de 2019 dispone expresamente que la realización típica de una falta objetivamente gravísima con culpa grave se considera falta grave.", false]]}, {"id": "DI-117", "niv": 2, "e": "Si la conducta del profesional de contratación se juzga finalmente como falta grave culposa, la sanción aplicable es", "f": "Ley 1952 de 2019, art. 48 (modificado por la Ley 2094 de 2021, art. 9)", "o": [["A", "suspensión en el ejercicio del cargo de uno a doce meses.", "Para las faltas graves culposas la sanción es suspensión en el ejercicio del cargo de uno a doce meses, sin inhabilidad especial (Ley 1952 de 2019, art. 48, num. 4, modificado por la Ley 2094 de 2021). Nótese que el art. 47, num. 9, solo dice que la falta se considera grave; el carácter culposo proviene de la forma de culpabilidad probada (culpa grave).", true], ["B", "suspensión en el ejercicio del cargo de tres a dieciocho meses e inhabilidad especial por el mismo término.", "Esa sanción corresponde a las faltas graves dolosas (art. 48, num. 3, de la Ley 1952 de 2019).", false], ["C", "destitución e inhabilidad general de ocho a diez años.", "Esa sanción corresponde a las faltas gravísimas cometidas con culpa gravísima (art. 48, num. 2, de la Ley 1952 de 2019).", false]]}]}, {"comp": "disciplinario", "rol": "general", "tag": "Código General Disciplinario · Clases y límites de las sanciones", "texto": "Usted es auxiliar administrativo de la secretaría de una procuraduría provincial y debe preparar las comunicaciones de tres fallos ejecutoriados en el mismo mes. El primero sanciona a un tesorero municipal por una falta gravísima cometida con dolo. El segundo sanciona a una secretaria de despacho por una falta leve dolosa. El tercero sanciona a un conductor por una falta leve culposa. Antes de redactar, su jefe le pide verificar que la clase de sanción de cada fallo coincida con la que prevé la ley.", "items": [{"id": "DI-118", "niv": 1, "e": "Para el tesorero municipal, la sanción que prevé la ley es", "f": "Ley 1952 de 2019, art. 48 (modificado por la Ley 2094 de 2021, art. 9)", "o": [["A", "destitución e inhabilidad general de ocho a diez años.", "Ese rango corresponde a las faltas gravísimas realizadas con culpa gravísima, no a las dolosas (art. 48, num. 2, de la Ley 1952 de 2019).", false], ["B", "suspensión de tres a dieciocho meses e inhabilidad especial por el mismo término.", "Esa sanción es la de las faltas graves dolosas (art. 48, num. 3, de la Ley 1952 de 2019).", false], ["C", "destitución e inhabilidad general de diez a veinte años.", "Las faltas gravísimas dolosas se sancionan con destitución e inhabilidad general de diez a veinte años (Ley 1952 de 2019, art. 48, num. 1, modificado por la Ley 2094 de 2021).", true]]}, {"id": "DI-119", "niv": 2, "e": "La sanción de la secretaria de despacho debe consistir en", "f": "Ley 1952 de 2019, art. 48 (modificado por la Ley 2094 de 2021, art. 9)", "o": [["A", "multa de diez a ciento ochenta días del salario básico devengado para la época de los hechos.", "Las faltas leves dolosas se sancionan con multa de diez a ciento ochenta días del salario básico devengado para la época de los hechos (Ley 1952 de 2019, art. 48, num. 5, modificado por la Ley 2094 de 2021).", true], ["B", "amonestación escrita con anotación en la hoja de vida.", "La amonestación escrita es la sanción de las faltas leves culposas, no de las dolosas (art. 48, num. 6, de la Ley 1952 de 2019).", false], ["C", "suspensión en el ejercicio del cargo de uno a doce meses.", "Esa sanción corresponde a las faltas graves culposas (art. 48, num. 4, de la Ley 1952 de 2019).", false]]}, {"id": "DI-120", "niv": 1, "e": "La sanción que corresponde al conductor implica", "f": "Ley 1952 de 2019, arts. 48 y 49 (modificados por la Ley 2094 de 2021, arts. 9 y 10)", "o": [["A", "la separación del cargo durante un mes, sin derecho a remuneración.", "La separación del cargo es propia de la suspensión, que no se aplica a las faltas leves (arts. 48 y 49 de la Ley 1952 de 2019).", false], ["B", "un llamado de atención escrito que se registra en la hoja de vida.", "Las faltas leves culposas se sancionan con amonestación escrita (art. 48, num. 6), que implica un llamado de atención por escrito que debe registrarse en la hoja de vida (Ley 1952 de 2019, art. 49, num. 4).", true], ["C", "un descuento de diez días de salario a favor de la entidad.", "El descuento de salario corresponde a la multa, sanción de las faltas leves dolosas (art. 48, num. 5, de la Ley 1952 de 2019).", false]]}]}, {"comp": "disciplinario", "rol": "profesional", "tag": "Código General Disciplinario · Niveles profesional, asesor y ejecutivo · Graduación de la sanción y concurso de faltas", "texto": "Usted es profesional de una procuraduría provincial de juzgamiento y proyecta el fallo contra la jefa de presupuesto de un municipio. Quedó demostrado que, con una sola omisión ocurrida en marzo de 2025, cometió dos faltas graves dolosas. El funcionario de conocimiento estima que, para la falta más grave, la sanción adecuada sería suspensión de diez meses e inhabilidad especial por el mismo término. En la hoja de vida de la disciplinada consta una amonestación escrita impuesta en enero de 2021, sin otros antecedentes. Además, antes del fallo, ella devolvió por iniciativa propia los recursos que se habían pagado de más, sin que esa devolución se hubiera decretado en otro proceso.", "items": [{"id": "DI-121", "niv": 3, "e": "Por el concurso de faltas, la suspensión e inhabilidad especial de diez meses puede incrementarse como máximo hasta", "f": "Ley 1952 de 2019, arts. 48, num. 3, y 51", "o": [["A", "quince meses.", "El incremento puede ser hasta en otro tanto, siempre que no exceda el máximo legal; quince meses no es el tope que resulta de esa regla (art. 51 de la Ley 1952 de 2019).", false], ["B", "dieciocho meses.", "En el concurso, si la sanción más grave es la suspensión e inhabilidad especial, se incrementa hasta en otro tanto sin exceder el máximo legal (art. 51 de la Ley 1952 de 2019). Otro tanto daría veinte meses, pero el máximo legal para las faltas graves dolosas es de dieciocho meses (art. 48, num. 3).", true], ["C", "veinte meses.", "Duplicar los diez meses daría veinte, pero el incremento no puede exceder el máximo legal de dieciocho meses previsto en el artículo 48, numeral 3, de la Ley 1952 de 2019.", false]]}, {"id": "DI-122", "niv": 3, "e": "Frente a la conducta de marzo de 2025, la amonestación escrita de enero de 2021", "f": "Ley 1952 de 2019, art. 50 (modificado por la Ley 2094 de 2021, art. 11)", "o": [["A", "debe valorarse como agravante, porque todo antecedente registrado agrava la sanción sin límite de tiempo.", "La ley fija límites temporales: cinco años en general y tres años para multa y amonestación (art. 50, num. 2, lit. a, de la Ley 1952 de 2019).", false], ["B", "debe valorarse como agravante, porque fue impuesta dentro de los cinco años anteriores a la conducta.", "Aplica la regla general de cinco años, pero el mismo literal a del numeral 2 del artículo 50 de la Ley 1952 de 2019 trae una regla especial para la multa y la amonestación: solo agravan si se impusieron en los tres años anteriores a la conducta, y aquí pasaron más de cuatro.", false], ["C", "no puede valorarse como agravante, porque la amonestación solo agrava si se impuso en los tres años anteriores a la conducta.", "El artículo 50, numeral 2, literal a, de la Ley 1952 de 2019 (modificado por el art. 11 de la Ley 2094 de 2021) fija como agravante haber sido sancionado dentro de los cinco años anteriores a la conducta, pero precisa que la multa y la amonestación se tienen como agravantes solo si fueron impuestas en los tres años anteriores a la comisión de la conducta. Entre enero de 2021 y marzo de 2025 pasaron más de cuatro años, así que la amonestación no agrava.", true]]}, {"id": "DI-123", "niv": 1, "e": "La devolución voluntaria de los recursos pagados de más", "f": "Ley 1952 de 2019, arts. 32 y 50 (modificado por la Ley 2094 de 2021, art. 11)", "o": [["A", "extingue la acción disciplinaria, porque repara por completo el daño causado.", "La reparación no es causal de extinción de la acción; las causales son la muerte del disciplinable, la caducidad y la prescripción (art. 32 de la Ley 1952 de 2019).", false], ["B", "solo produce efectos en el proceso de responsabilidad fiscal y no puede valorarse en el proceso disciplinario.", "El artículo 50 de la Ley 1952 de 2019 la incluye expresamente como atenuante para graduar la sanción disciplinaria.", false], ["C", "es un atenuante que se tiene en cuenta para fijar el término de la suspensión e inhabilidad.", "Haber devuelto, restituido o reparado el bien afectado, o resarcido el daño por iniciativa propia, siempre que no se haya decretado en otro proceso, es atenuante para fijar la duración de la suspensión e inhabilidad (Ley 1952 de 2019, art. 50, num. 1, lits. c y d).", true]]}]}, {"comp": "disciplinario", "rol": "general", "tag": "Código General Disciplinario · Causales de exclusión de responsabilidad", "texto": "Usted es técnico administrativo de una personería municipal y apoya el análisis de tres actuaciones. En la primera, un notificador no entregó a tiempo una citación porque un derrumbe imprevisible e irresistible cerró durante tres días la única vía hacia la vereda. En la segunda, un auxiliar trasladó un archivo de gestión a otra sede en cumplimiento de una orden escrita del secretario general, quien tenía competencia para darla. En la tercera, una técnica entregó a un tercero un documento que creyó, equivocadamente, de libre acceso; el error habría podido evitarse consultando el índice de información clasificada publicado en la intranet.", "items": [{"id": "DI-124", "niv": 1, "e": "La situación del notificador corresponde a la causal de exclusión de responsabilidad denominada", "f": "Ley 1952 de 2019, art. 31 (modificado por la Ley 2094 de 2021, art. 5)", "o": [["A", "fuerza mayor.", "No hay responsabilidad disciplinaria cuando la conducta se realiza por fuerza mayor (Ley 1952 de 2019, art. 31, num. 1). Un derrumbe imprevisible e irresistible que impide el acceso es un hecho de esa naturaleza.", true], ["B", "estricto cumplimiento de un deber legal de mayor importancia.", "Esa causal supone que el servidor sacrificó un deber para cumplir otro de mayor importancia (art. 31, num. 3); aquí no hubo elección entre deberes, sino un hecho externo que le impidió actuar.", false], ["C", "insuperable coacción ajena.", "La coacción ajena (art. 31, num. 6) supone la presión de otra persona sobre la voluntad del servidor; el derrumbe es un hecho de la naturaleza.", false]]}, {"id": "DI-125", "niv": 2, "e": "Para que la orden del secretario general excluya la responsabilidad del auxiliar, debe tratarse de una orden", "f": "Ley 1952 de 2019, art. 31, num. 4 (modificado por la Ley 2094 de 2021, art. 5)", "o": [["A", "ajustada a derecho, dada por quien tiene competencia y con las formalidades legales.", "Excluye la responsabilidad actuar en cumplimiento de orden legítima de autoridad competente emitida con las formalidades legales (Ley 1952 de 2019, art. 31, num. 4).", true], ["B", "escrita y firmada, aunque quien la emite carezca de competencia sobre el asunto.", "La forma escrita no suple la falta de competencia; la causal exige que la orden provenga de autoridad competente y sea legítima (art. 31, num. 4).", false], ["C", "de cualquier superior jerárquico, sin importar su contenido.", "La causal no ampara órdenes ilegítimas: exige legitimidad, competencia y formalidades legales (art. 31, num. 4). Además, el deber de cumplir órdenes superiores cede cuando son contrarias a la Constitución o la ley (art. 38, num. 8).", false]]}, {"id": "DI-126", "niv": 3, "e": "Si se establece que el error de la técnica fue un error de hecho vencible, la consecuencia es que", "f": "Ley 1952 de 2019, art. 31, num. 8 (modificado por la Ley 2094 de 2021, art. 5)", "o": [["A", "procede la destitución y las demás sanciones graduables se reducen a la mitad.", "Esa es la consecuencia del error de derecho vencible, no del error de hecho vencible (art. 31, num. 8, de la Ley 1952 de 2019).", false], ["B", "su conducta se sanciona a título de culpa, siempre que la falta admita esa modalidad.", "Si el error de hecho fuere vencible, la conducta se sanciona a título de culpa, siempre que la falta admita tal modalidad (Ley 1952 de 2019, art. 31, num. 8, modificado por la Ley 2094 de 2021).", true], ["C", "queda excluida de responsabilidad, porque actuó convencida de que su conducta era lícita.", "Solo la convicción errada e invencible excluye la responsabilidad. Si el error es vencible, como en el caso, la ley prevé una consecuencia distinta (art. 31, num. 8, de la Ley 1952 de 2019).", false]]}]}, {"comp": "disciplinario", "rol": "general", "tag": "Código General Disciplinario · Extinción de la acción y de la sanción", "texto": "Usted es profesional universitario de la oficina de control disciplinario interno de un instituto descentralizado del orden departamental. Revisa tres situaciones. En la primera, a un servidor se le impuso suspensión mediante fallo que quedó ejecutoriado en abril de 2024, pero la entidad nunca ejecutó la sanción. En la segunda, la quejosa de una investigación en curso presentó un escrito en el que desiste de su queja y pide archivar el proceso. En la tercera, un disciplinado presentó personalmente un escrito en el que renuncia a la prescripción de la acción disciplinaria, porque quiere obtener un fallo que lo absuelva.", "items": [{"id": "DI-127", "niv": 2, "e": "La sanción impuesta en el fallo ejecutoriado en abril de 2024 prescribe en un término de", "f": "Ley 1952 de 2019, arts. 33 y 36", "o": [["A", "tres años, contados a partir de la ejecutoria del fallo.", "El término legal de prescripción de la sanción es de cinco años, no de tres (art. 36 de la Ley 1952 de 2019).", false], ["B", "cinco años, contados a partir de la fecha en que se cometió la falta.", "Contar desde la comisión de la falta corresponde a la prescripción de la acción (art. 33); la de la sanción se cuenta desde la ejecutoria del fallo (art. 36).", false], ["C", "cinco años, contados a partir de la ejecutoria del fallo.", "La sanción disciplinaria prescribe en un término de cinco años contados a partir de la ejecutoria del fallo (Ley 1952 de 2019, art. 36).", true]]}, {"id": "DI-128", "niv": 1, "e": "Frente al escrito de desistimiento de la quejosa, debe tenerse en cuenta que", "f": "Ley 1952 de 2019, arts. 32 (modificado por la Ley 2094 de 2021, art. 6), 85 y 86", "o": [["A", "el desistimiento obliga a archivar, porque la acción depende del impulso de quien presentó la queja.", "La acción disciplinaria es pública y se adelanta de oficio (arts. 85 y 86 de la Ley 1952 de 2019); no depende del quejoso.", false], ["B", "el desistimiento extingue la acción solo si se presenta antes de la formulación del pliego de cargos.", "La ley no prevé esa regla: el desistimiento del quejoso no extingue la acción en ninguna etapa (art. 32, parágrafo, de la Ley 1952 de 2019).", false], ["C", "el desistimiento del quejoso no extingue la acción disciplinaria.", "Las causales de extinción de la acción son la muerte del disciplinable, la caducidad y la prescripción, y el parágrafo del artículo 32 de la Ley 1952 de 2019 (modificado por la Ley 2094 de 2021) dispone que el desistimiento del quejoso no extingue la acción.", true]]}, {"id": "DI-129", "niv": 2, "e": "Como consecuencia de la renuncia a la prescripción, la acción disciplinaria", "f": "Ley 1952 de 2019, art. 34", "o": [["A", "puede proseguirse por cinco años más, contados desde la notificación del pliego de cargos al disciplinado.", "El término es de dos años y se cuenta desde la presentación personal de la solicitud de renuncia, no desde el pliego de cargos (art. 34 de la Ley 1952 de 2019).", false], ["B", "solo puede proseguirse por un máximo de dos años, contados desde la presentación personal de la solicitud.", "Si el disciplinable renuncia a la prescripción, la acción solo puede proseguirse por un término máximo de dos años contados desde la presentación personal de la solicitud; vencido sin fallo ejecutoriado, solo procede declarar la prescripción (Ley 1952 de 2019, art. 34).", true], ["C", "puede proseguirse sin límite de tiempo, porque el disciplinado renunció a ese beneficio.", "La ley fija un límite: la acción solo puede proseguirse por un máximo de dos años desde la presentación personal de la solicitud (art. 34 de la Ley 1952 de 2019).", false]]}]}, {"comp": "disciplinario", "rol": "tecnico", "tag": "Código General Disciplinario · Niveles técnico, administrativo y operativo · Prescripción de la acción disciplinaria", "texto": "Usted es técnico de una procuraduría provincial y lleva el control de términos de cuatro expedientes, todos por conductas ocurridas después del 29 de diciembre de 2023. Expediente A: falta instantánea consumada el 12 de mayo de 2024; aún no hay fallo. Expediente B: desde enero de 2024 un servidor omitió presentar unos informes obligatorios; su deber de presentarlos cesó el 30 de septiembre de 2025, cuando fue trasladado a otro cargo. Expediente C: el fallo de primera instancia se notificó el 10 de junio de 2025 y el proceso está en segunda instancia. Expediente D: se investiga una de las faltas relacionadas con infracciones al Derecho Internacional Humanitario previstas en el artículo 52 del código.", "items": [{"id": "DI-130", "niv": 2, "e": "En el expediente A, si la prescripción no se interrumpe, el término de prescripción de la acción se cumple en", "f": "Ley 1952 de 2019, art. 33 (modificado por la Ley 2094 de 2021, art. 7)", "o": [["A", "mayo de 2027.", "Corresponde a tres años, pero el término general de prescripción de la acción es de cinco años (art. 33 de la Ley 1952 de 2019).", false], ["B", "mayo de 2029.", "La acción prescribe en cinco años, contados para las faltas instantáneas desde el día de su consumación (Ley 1952 de 2019, art. 33, modificado por la Ley 2094 de 2021): mayo de 2024 más cinco años es mayo de 2029.", true], ["C", "mayo de 2036.", "Doce años es el término para las faltas del artículo 52 (DIDH y DIH), no para una falta instantánea común (art. 33 de la Ley 1952 de 2019).", false]]}, {"id": "DI-131", "niv": 3, "e": "En el expediente B, por tratarse de una falta omisiva, el término de prescripción empieza a contarse", "f": "Ley 1952 de 2019, art. 33 (modificado por la Ley 2094 de 2021, art. 7)", "o": [["A", "desde el 30 de septiembre de 2025, cuando cesó su deber de actuar.", "Para las faltas omisivas, la prescripción se cuenta desde cuando haya cesado el deber de actuar (Ley 1952 de 2019, art. 33, modificado por la Ley 2094 de 2021).", true], ["B", "desde la fecha del auto de apertura de la investigación disciplinaria.", "Con el texto vigente del artículo 33, el término no se cuenta desde la apertura de investigación, sino desde la consumación, el último acto o el cese del deber, según el tipo de falta.", false], ["C", "desde enero de 2024, cuando comenzó la omisión.", "Para las faltas omisivas el término no corre desde que empieza la omisión, sino desde que cesa el deber de actuar (art. 33 de la Ley 1952 de 2019).", false]]}, {"id": "DI-132", "niv": 3, "e": "En el expediente C, la acción prescribirá si la decisión de segunda instancia no se ha notificado a más tardar en", "f": "Ley 1952 de 2019, art. 33 (modificado por la Ley 2094 de 2021, art. 7)", "o": [["A", "junio de 2026.", "Un año no es el término legal. Interrumpida la prescripción, esta se produce si en dos años no se notifica la segunda instancia (art. 33 de la Ley 1952 de 2019).", false], ["B", "junio de 2027.", "La prescripción se interrumpe con la notificación del fallo de primera instancia y se produce si, transcurridos dos años desde esa notificación, no se notifica la decisión de segunda instancia (Ley 1952 de 2019, art. 33): junio de 2025 más dos años es junio de 2027.", true], ["C", "junio de 2030.", "Contar cinco años nuevos desde el fallo de primera instancia no tiene base legal; después de la interrupción el plazo es de dos años (art. 33 de la Ley 1952 de 2019).", false]]}, {"id": "DI-133", "niv": 2, "e": "Para el expediente D, el término de prescripción de la acción es de", "f": "Ley 1952 de 2019, arts. 33 y 52", "o": [["A", "cinco años.", "Cinco años es el término general; para las faltas del artículo 52 la ley fija uno mayor (art. 33 de la Ley 1952 de 2019).", false], ["B", "doce años.", "Para las faltas señaladas en el artículo 52 (infracciones al DIDH y al DIH), el término de prescripción es de doce años; interrumpido con la notificación del fallo de primera instancia, se produce si en tres años no se notifica la segunda instancia (Ley 1952 de 2019, art. 33).", true], ["C", "veinte años.", "Veinte años es el máximo de la inhabilidad general (art. 48), no el término de prescripción de las faltas del artículo 52, que es de doce años (art. 33).", false]]}]}, {"comp": "disciplinario", "rol": "general", "tag": "Código General Disciplinario · Poder disciplinario preferente", "texto": "Usted es profesional universitario de una procuraduría provincial de instrucción. La oficina de control disciplinario interno de una alcaldía abrió investigación contra el secretario de movilidad por presuntas irregularidades en la expedición de licencias. El caso tiene amplia difusión y el disciplinado pidió a la Procuraduría, con argumentos sustentados, que asuma el proceso porque considera vulnerado su debido proceso. Al mismo tiempo, el personero municipal anunció que también estudia asumir la investigación.", "items": [{"id": "DI-134", "niv": 2, "e": "Para que la Procuraduría asuma la investigación iniciada por la oficina de control interno, se requiere", "f": "Ley 1952 de 2019, arts. 3 y 86", "o": [["A", "que la actuación todavía esté en indagación previa, pues abierta la investigación ya no puede asumirse.", "La Procuraduría puede iniciar, proseguir o remitir cualquier investigación o juzgamiento, e incluso asumir la segunda instancia (art. 3 de la Ley 1952 de 2019).", false], ["B", "que la oficina de control interno acepte remitirla voluntariamente y el alcalde lo autorice.", "El poder preferente no depende de la voluntad de la oficina ni del jefe de la entidad, a quien solo se informa (art. 86 de la Ley 1952 de 2019).", false], ["C", "decisión motivada del funcionario competente; la oficina suspenderá la actuación y la pondrá a su disposición.", "La Procuraduría, previa decisión motivada del funcionario competente, de oficio o a petición del disciplinado que invoque sustentadamente violación del debido proceso, puede asumir la investigación de otro organismo, que la suspenderá y la pondrá a su disposición (Ley 1952 de 2019, arts. 3 y 86).", true]]}, {"id": "DI-135", "niv": 1, "e": "Sobre el anuncio del personero, es correcto afirmar que las personerías municipales", "f": "Ley 1952 de 2019, arts. 3, 86 y 92", "o": [["A", "tienen poder disciplinario preferente frente a la administración municipal.", "Las personerías municipales y distritales tienen poder disciplinario preferente frente a la administración (Ley 1952 de 2019, arts. 3 y 86).", true], ["B", "carecen de poder preferente, porque esa potestad es exclusiva de la Procuraduría General de la Nación.", "El artículo 3 de la Ley 1952 de 2019 reconoce poder preferente también a las personerías frente a la administración, sin perjuicio del de la Procuraduría.", false], ["C", "solo ejercen poder preferente frente a los concejales y ediles del municipio.", "Los concejales y ediles son servidores de elección popular, cuyo conocimiento corresponde a la Procuraduría (art. 92 de la Ley 1952 de 2019); el poder preferente de la personería es frente a la administración.", false]]}, {"id": "DI-136", "niv": 2, "e": "Una vez abrió la investigación, la oficina de control disciplinario interno debía", "f": "Ley 1952 de 2019, art. 216", "o": [["A", "informar de inmediato a la Viceprocuraduría para que se decida si se ejerce el poder preferente.", "Si la investigación disciplinaria la inicia una oficina de control disciplinario interno, esta da aviso inmediato a la Viceprocuraduría General de la Nación y al funcionario competente de esa entidad o de la personería correspondiente, para que decida sobre el ejercicio del poder disciplinario preferente (Ley 1952 de 2019, art. 216).", true], ["B", "pedir autorización previa a la Procuraduría antes de notificar el auto de apertura al disciplinado.", "La ley no exige autorización previa; exige dar aviso inmediato para que se decida sobre el poder preferente (art. 216 de la Ley 1952 de 2019).", false], ["C", "esperar a que el disciplinado manifieste si acepta que la oficina lo investigue.", "La competencia no depende de la aceptación del disciplinado; la acción disciplinaria es pública y oficiosa (arts. 85 y 86 de la Ley 1952 de 2019).", false]]}]}, {"comp": "disciplinario", "rol": "general", "tag": "Código General Disciplinario · Oficinas de control disciplinario interno", "texto": "Usted es profesional universitario del área de talento humano de un pequeño establecimiento público del orden nacional, sin regionales. La dirección reorganiza la oficina de control disciplinario interno: propone nombrar como jefe a un administrador público del nivel profesional y advierte que, por la estructura de la entidad, no es posible garantizar la segunda instancia de los procesos. El director también pregunta quién deberá hacer efectivas las sanciones que imponga la oficina.", "items": [{"id": "DI-137", "niv": 1, "e": "Sobre la propuesta para el cargo de jefe de la oficina, la ley exige que esa persona", "f": "Ley 1952 de 2019, art. 93 (modificado por la Ley 2094 de 2021, art. 14)", "o": [["A", "pertenezca al nivel profesional y acredite especialización en derecho disciplinario.", "El nivel profesional es el mínimo para los integrantes de la oficina, pero el jefe debe ser abogado del nivel directivo (art. 93, parágrafo 1, de la Ley 1952 de 2019).", false], ["B", "sea abogado del nivel asesor y sea designado por el Procurador General de la Nación.", "La ley exige nivel directivo y no atribuye su designación al Procurador General (art. 93 de la Ley 1952 de 2019).", false], ["C", "sea abogado y pertenezca al nivel directivo de la entidad.", "El jefe de la oficina de control disciplinario interno debe ser abogado y pertenecer al nivel directivo de la entidad (Ley 1952 de 2019, art. 93, parágrafo 1, modificado por la Ley 2094 de 2021).", true]]}, {"id": "DI-138", "niv": 2, "e": "Si la entidad no puede garantizar la segunda instancia por su estructura organizacional, esta corresponderá a", "f": "Ley 1952 de 2019, art. 93 (modificado por la Ley 2094 de 2021, art. 14)", "o": [["A", "el juez de lo contencioso administrativo, mediante el medio de control de nulidad y restablecimiento.", "El control judicial de las decisiones sancionatorias (art. 93, parágrafo 2) no reemplaza la segunda instancia disciplinaria, que corresponde a la Procuraduría.", false], ["B", "el director de la entidad, como superior jerárquico del jefe de la oficina disciplinaria.", "El artículo 93 vigente asigna expresamente la segunda instancia no garantizada a la Procuraduría, no al director de la entidad.", false], ["C", "la Procuraduría General de la Nación, de acuerdo con sus competencias.", "Si no fuere posible garantizar la segunda instancia por razones de estructura organizacional, será de competencia de la Procuraduría General de la Nación de acuerdo con sus competencias (Ley 1952 de 2019, art. 93, modificado por la Ley 2094 de 2021).", true]]}, {"id": "DI-139", "niv": 2, "e": "Las sanciones que imponga la oficina de control disciplinario interno deberá hacerlas efectivas", "f": "Ley 1952 de 2019, arts. 93 (modificado por la Ley 2094 de 2021, art. 14), 236 y 238", "o": [["A", "el jefe o director del organismo al que pertenece el sancionado.", "El jefe o director del organismo tiene competencia para ejecutar la sanción (Ley 1952 de 2019, art. 93), en concordancia con el artículo 236, que atribuye la ejecución al nominador respecto de los servidores de libre nombramiento y de carrera.", true], ["B", "la Procuraduría General de la Nación, por medio de su División de Registro y Control.", "La Procuraduría registra las sanciones para el certificado de antecedentes (art. 238), pero no las ejecuta respecto de servidores de otras entidades; ejecuta las de particulares y entidades en liquidación (art. 236, num. 7).", false], ["C", "el jefe de la oficina de control disciplinario interno que profirió el fallo.", "La ley separa la función de juzgar de la de ejecutar: la ejecución corresponde al jefe o director del organismo (art. 93 de la Ley 1952 de 2019).", false]]}]}, {"comp": "disciplinario", "rol": "profesional", "tag": "Código General Disciplinario · Niveles profesional, asesor y ejecutivo · Separación entre instrucción y juzgamiento y competencia", "texto": "Usted es profesional universitario de una procuraduría provincial de instrucción. Tiene a cargo una investigación contra un servidor de la secretaría de hacienda de un municipio que no es capital de departamento. Además, la personería de otro municipio de la circunscripción informa que, por tener un solo funcionario con funciones disciplinarias, no puede garantizar que quien instruye un proceso sea distinto de quien lo juzga. Por último, llega una queja contra el alcalde de un municipio que tampoco es capital, por hechos de su gestión.", "items": [{"id": "DI-140", "niv": 1, "e": "La garantía que impide que su despacho, como instructor, adelante también el juzgamiento del servidor de hacienda es", "f": "Ley 1952 de 2019, arts. 12 (modificado por la Ley 2094 de 2021, art. 3) y 16", "o": [["A", "la doble conformidad, según la cual todo fallo sancionatorio debe ser revisado por autoridad diferente.", "La doble conformidad se refiere a la revisión del fallo sancionatorio por otra autoridad (art. 12, inciso 3), no a la separación entre quien instruye y quien juzga.", false], ["B", "la cosa juzgada, que impide que un mismo funcionario se pronuncie dos veces sobre el mismo hecho.", "La cosa juzgada (art. 16) impide nuevo proceso por un hecho ya decidido con fallo ejecutoriado; no regula la separación de funciones dentro de un mismo proceso.", false], ["C", "el debido proceso, que exige que el funcionario instructor no sea el mismo que adelante el juzgamiento.", "Según el artículo 12 de la Ley 1952 de 2019, modificado por la Ley 2094 de 2021, el disciplinable debe ser investigado y luego juzgado por funcionario diferente, y debe garantizarse que el instructor no sea el mismo que adelante el juzgamiento.", true]]}, {"id": "DI-141", "niv": 2, "e": "En el proceso contra el servidor de hacienda, la competencia de la procuraduría provincial de instrucción se extiende", "f": "Decreto Ley 262 de 2000, arts. 76 y 76A (modificados por el Decreto Ley 1851 de 2021); Ley 1952 de 2019, art. 225A", "o": [["A", "hasta que quede notificado el pliego de cargos o, en su caso, la decisión de archivo.", "Las procuradurías provinciales y distritales de instrucción conocen de las actuaciones disciplinarias contra servidores del orden municipal hasta la notificación del pliego de cargos o de la decisión de archivo (Decreto Ley 262 de 2000, art. 76, modificado por el Decreto Ley 1851 de 2021).", true], ["B", "hasta el fallo de primera instancia, cuando el juzgamiento se adelante por el juicio verbal.", "El juicio verbal también corresponde al funcionario de juzgamiento (art. 225A de la Ley 1952 de 2019); la instrucción termina con el pliego o el archivo.", false], ["C", "hasta la ejecutoria del fallo, porque la provincial de juzgamiento solo conoce de los recursos.", "La procuraduría provincial de juzgamiento conoce de la etapa de juzgamiento, no solo de recursos (Decreto Ley 262 de 2000, art. 76A).", false]]}, {"id": "DI-142", "niv": 3, "e": "La etapa de juzgamiento de los procesos de la personería que no puede garantizar la separación entre instrucción y juzgamiento corresponde a", "f": "Ley 1952 de 2019, art. 92 (modificado por la Ley 2094 de 2021, art. 13); Decreto Ley 262 de 2000, art. 76A", "o": [["A", "un personero ad hoc que designe el concejo municipal para cada proceso.", "La ley no prevé esa designación; dispone que, si no se satisfacen esas garantías, el asunto pasa a la Procuraduría (art. 92 de la Ley 1952 de 2019).", false], ["B", "la procuraduría provincial de juzgamiento de la circunscripción.", "El artículo 92 de la Ley 1952 de 2019 (modificado por la Ley 2094 de 2021) dispone que, si las personerías no pueden satisfacer las garantías de instrucción y juzgamiento, el asunto pasa a la Procuraduría según la calidad del disciplinable; y el artículo 76A, numeral 2, del Decreto Ley 262 de 2000 (adicionado por el Decreto Ley 1851 de 2021) concreta que la etapa de juzgamiento de esos procesos la conocen las procuradurías provinciales y distritales de juzgamiento.", true], ["C", "el alcalde municipal, como nominador de los servidores investigados por la personería.", "El nominador ejecuta sanciones (art. 236), pero no tiene competencia para juzgar; la competencia pasa a la Procuraduría (art. 92).", false]]}, {"id": "DI-143", "niv": 2, "e": "La queja contra el alcalde municipal debe ser tramitada por", "f": "Ley 1952 de 2019, arts. 2 y 92 (modificados por la Ley 2094 de 2021, arts. 1 y 13)", "o": [["A", "la personería municipal, en ejercicio de su poder preferente frente a la administración.", "El poder preferente de la personería no alcanza a los servidores de elección popular, cuyo conocimiento es privativo de la Procuraduría (art. 2 de la Ley 1952 de 2019).", false], ["B", "la Procuraduría General de la Nación, por ser un servidor de elección popular.", "La Procuraduría conoce de la investigación y el juzgamiento de las faltas de los servidores públicos de elección popular, y esa competencia es privativa (Ley 1952 de 2019, arts. 2 y 92, modificados por la Ley 2094 de 2021). Tratándose de un alcalde de municipio que no es capital, la instrucción corresponde a la procuraduría provincial de instrucción (Decreto Ley 262 de 2000, art. 76, num. 1, lit. a).", true], ["C", "la oficina de control disciplinario interno de la alcaldía.", "El alcalde es servidor de elección popular; la competencia para investigarlo y juzgarlo es de la Procuraduría (arts. 2 y 92 de la Ley 1952 de 2019).", false]]}]}, {"comp": "disciplinario", "rol": "general", "tag": "Código General Disciplinario · Impedimentos y recusaciones", "texto": "Usted es el procurador provincial de juzgamiento de una circunscripción. Al recibir un expediente nuevo, advierte que el disciplinado es su primo hermano. En otro proceso, el defensor de una investigada presentó un escrito en el que lo recusa a usted con el argumento de que tiene enemistad grave con su cliente, y adjuntó las pruebas en que se funda. Su asistente le pregunta cómo debe tramitarse cada situación y qué pasa con los términos de los procesos.", "items": [{"id": "DI-144", "niv": 2, "e": "Frente al expediente en el que el disciplinado es su primo hermano, usted debe", "f": "Ley 1952 de 2019, arts. 104 y 105", "o": [["A", "seguir conociendo, porque el parentesco solo es causal hasta el segundo grado de consanguinidad.", "La causal comprende a los parientes dentro del cuarto grado de consanguinidad (art. 104, num. 3, de la Ley 1952 de 2019); los primos hermanos están en ese grado.", false], ["B", "seguir conociendo hasta que algún sujeto procesal formule recusación en su contra.", "El impedimento debe declararse de oficio e inmediatamente, una vez advertida la causal, sin esperar recusación (art. 105 de la Ley 1952 de 2019).", false], ["C", "declararse impedido de inmediato, por ser pariente en cuarto grado de consanguinidad de un sujeto procesal.", "Es causal ser pariente dentro del cuarto grado de consanguinidad de cualquiera de los sujetos procesales (art. 104, num. 3), y quien la advierte debe declararse inmediatamente impedido por escrito (Ley 1952 de 2019, art. 105). Los primos hermanos son parientes en cuarto grado.", true]]}, {"id": "DI-145", "niv": 2, "e": "Ante la recusación por enemistad grave, el trámite indica que usted debe", "f": "Ley 1952 de 2019, arts. 106 y 107", "o": [["A", "manifestar si acepta o no la causal dentro de los dos días siguientes a su formulación.", "En la recusación, el servidor manifiesta si acepta o no la causal dentro de los dos días siguientes a su formulación; vencido ese término, se envía al superior, que decide de plano dentro de los tres días siguientes a su recibo (Ley 1952 de 2019, art. 107).", true], ["B", "remitir de inmediato el expediente a la Sala Disciplinaria, que debe decidir en diez días.", "Primero el recusado manifiesta, en dos días, si acepta la causal; luego decide el superior en tres días (art. 107 de la Ley 1952 de 2019).", false], ["C", "resolver usted mismo la recusación mediante auto, contra el cual procede el recurso de reposición.", "El recusado no decide su propia recusación; si no la acepta, la decide el superior (art. 107 de la Ley 1952 de 2019).", false]]}, {"id": "DI-146", "niv": 2, "e": "Mientras se deciden el impedimento y la recusación, las actuaciones disciplinarias respectivas", "f": "Ley 1952 de 2019, art. 107", "o": [["A", "continúan, pero las pruebas que se practiquen mientras tanto deberán repetirse luego.", "No se prevé continuar con repetición posterior de pruebas: la actuación se suspende hasta la decisión (art. 107 de la Ley 1952 de 2019).", false], ["B", "se suspenden desde que se manifiesta el impedimento o se presenta la recusación, hasta que se decida.", "La actuación disciplinaria se suspende desde que se manifiesta el impedimento o se presenta la recusación y hasta cuando se decida (Ley 1952 de 2019, art. 107, inciso final).", true], ["C", "continúan su curso normal y solo se suspende el término para proferir el fallo.", "La ley suspende toda la actuación, no solo el término para fallar (art. 107 de la Ley 1952 de 2019).", false]]}]}, {"comp": "disciplinario", "rol": "general", "tag": "Código General Disciplinario · Sujetos procesales y derechos del disciplinado", "texto": "Usted es profesional universitario de la oficina de control disciplinario interno de una superintendencia. Se adelantan dos procesos. En el primero, un ciudadano presentó queja porque un funcionario demoró injustificadamente su trámite; ahora pide que se le reconozca como sujeto procesal para solicitar pruebas y apelar cualquier decisión. En el segundo, una profesional presentó queja por hechos constitutivos de acoso laboral atribuidos a su jefe y pide intervenir por medio de apoderado. En este segundo proceso, el disciplinado solicita ser escuchado en versión libre cuando ya se surtió el traslado para presentar alegatos previos al fallo de primera instancia.", "items": [{"id": "DI-147", "niv": 3, "e": "Frente a la solicitud del ciudadano del primer proceso, debe explicársele que", "f": "Ley 1952 de 2019, arts. 109 y 110", "o": [["A", "puede solicitar pruebas y apelar cualquier decisión del proceso, siempre que actúe por medio de un abogado inscrito.", "Actuar con abogado no le otorga la calidad de sujeto procesal; sus facultades son limitadas (art. 110, parágrafo 1, de la Ley 1952 de 2019).", false], ["B", "es sujeto procesal con las mismas facultades del investigado, por haber sido quien dio origen a la actuación disciplinaria.", "El quejoso no es sujeto procesal, salvo las víctimas de violaciones de derechos humanos, DIH y acoso laboral (arts. 109 y 110, parágrafo 1, de la Ley 1952 de 2019).", false], ["C", "no tiene la calidad de sujeto procesal; puede ampliar su queja, allegar pruebas e impugnar el archivo o la absolución.", "La intervención del quejoso, que no es sujeto procesal, se limita a presentar y ampliar la queja bajo juramento, aportar las pruebas que tenga y recurrir la decisión de archivo y el fallo absolutorio (Ley 1952 de 2019, art. 110, parágrafo 1).", true]]}, {"id": "DI-148", "niv": 3, "e": "Respecto de la profesional que denunció el acoso laboral, lo procedente es", "f": "Ley 1952 de 2019, arts. 109 y 110", "o": [["A", "reconocerla como sujeto procesal, con la facultad de designar un apoderado que la represente.", "Tienen la condición de sujetos procesales las víctimas de conductas violatorias de derechos humanos, del DIH y de acoso laboral (art. 109), y pueden designar apoderado (Ley 1952 de 2019, art. 110, parágrafo 2).", true], ["B", "tratarla solo como quejosa, porque la calidad de sujeto procesal se reserva al investigado y a su defensor.", "El artículo 109 de la Ley 1952 de 2019 extiende la calidad de sujeto procesal a las víctimas de acoso laboral.", false], ["C", "remitir su queja al comité de convivencia laboral, porque el acoso laboral no es materia disciplinaria.", "El acoso laboral sí es materia disciplinaria y el código regula expresamente la intervención de sus víctimas (arts. 109 y 110 de la Ley 1952 de 2019).", false]]}, {"id": "DI-149", "niv": 2, "e": "Sobre la solicitud del disciplinado del segundo proceso de rendir versión libre, debe tenerse en cuenta que", "f": "Ley 1952 de 2019, art. 112", "o": [["A", "solo procedía durante la indagación previa, antes de que se abriera la investigación.", "La versión libre procede en cualquier etapa, no solo en la indagación previa, siempre que sea antes del traslado para alegatos previos al fallo (art. 112, num. 3).", false], ["B", "es extemporánea, pues la versión libre solo puede rendirse antes de que se corra el traslado para alegar previo al fallo.", "El disciplinado tiene derecho a ser oído en versión libre en cualquier etapa, hasta antes del traslado para presentar alegatos previos al fallo de primera o única instancia (Ley 1952 de 2019, art. 112, num. 3).", true], ["C", "procede en cualquier momento, incluso después de proferido el fallo de primera instancia.", "La ley fija un límite temporal: hasta antes del traslado para alegatos previos al fallo (art. 112, num. 3, de la Ley 1952 de 2019).", false]]}]}, {"comp": "disciplinario", "rol": "general", "tag": "Código General Disciplinario · Queja anónima, inhibitoria y queja temeraria", "texto": "Usted es técnico de la oficina de control disciplinario interno de una gobernación y clasifica la correspondencia. Recibe un escrito anónimo que afirma, sin ningún dato concreto ni prueba, que «todos en la secretaría de salud son corruptos». Recibe otro anónimo que adjunta copias de las certificaciones de cumplimiento firmadas por un supervisor y de los registros migratorios que muestran que el contratista estaba fuera del país en los días certificados. Además, en un proceso ya tramitado se estableció que un ciudadano presentó una queja temeraria contra una funcionaria.", "items": [{"id": "DI-150", "niv": 1, "e": "Frente al segundo escrito anónimo, la acción disciplinaria", "f": "Ley 1952 de 2019, art. 86; Ley 190 de 1995, art. 38; Ley 24 de 1992, art. 27", "o": [["A", "solo puede iniciarse si quien lo envió se identifica y ratifica la queja bajo juramento.", "La ley no exige identificar al autor cuando el anónimo trae pruebas suficientes; en ese caso la autoridad actúa de oficio (art. 38 de la Ley 190 de 1995).", false], ["B", "no puede iniciarse, porque la ley prohíbe sin excepción tramitar quejas anónimas.", "La prohibición tiene excepción: el anónimo acompañado de medios probatorios suficientes permite actuar de oficio (art. 86 de la Ley 1952 de 2019 y art. 38 de la Ley 190 de 1995).", false], ["C", "puede iniciarse, porque el anónimo viene acompañado de medios probatorios suficientes.", "La acción no procede por anónimos, salvo que cumplan los requisitos del artículo 38 de la Ley 190 de 1995 y del artículo 27 de la Ley 24 de 1992, es decir, que existan medios probatorios suficientes sobre la infracción (Ley 1952 de 2019, art. 86).", true]]}, {"id": "DI-151", "niv": 2, "e": "Ante el primer escrito anónimo, lo procedente es", "f": "Ley 1952 de 2019, arts. 10, 86, 208 y 209", "o": [["A", "inhibirse de plano de iniciar actuación, porque la información es absolutamente inconcreta y difusa.", "Cuando la información o queja se presenta de manera absolutamente inconcreta o difusa, el funcionario se inhibe de plano de iniciar actuación, y contra esa decisión no procede recurso (Ley 1952 de 2019, art. 209). Además, el anónimo carece de medios probatorios (art. 86).", true], ["B", "abrir investigación contra el secretario de salud, como responsable de toda la dependencia.", "Abrir investigación solo por ser jefe de la dependencia supondría responsabilidad objetiva, proscrita por el artículo 10 de la Ley 1952 de 2019; además, no hay hechos concretos.", false], ["C", "abrir indagación previa para identificar a los servidores de la secretaría a los que alude el escrito.", "La indagación previa supone una posible falta cuyo autor no está identificado (art. 208). Aquí no hay hecho concreto alguno y el anónimo no trae pruebas (art. 86).", false]]}, {"id": "DI-152", "niv": 2, "e": "Advertida la temeridad de la queja del ciudadano, la autoridad disciplinaria puede imponerle", "f": "Ley 1952 de 2019, art. 210 (modificado por la Ley 2094 de 2021, art. 35)", "o": [["A", "una amonestación escrita, que se anota en el certificado de antecedentes del ciudadano.", "La amonestación es una sanción para disciplinables por faltas leves culposas (art. 48); al quejoso temerario se le impone multa (art. 210).", false], ["B", "una multa de hasta 180 salarios mínimos diarios, previa citación para escuchar sus explicaciones.", "Advertida la temeridad, la autoridad puede imponer multa de hasta 180 salarios diarios mínimos legales vigentes, citando al quejoso para que dé explicaciones, aporte pruebas y ejerza contradicción (Ley 1952 de 2019, art. 210, modificado por la Ley 2094 de 2021).", true], ["C", "una multa de 10 a 100 salarios mínimos mensuales legales vigentes, sin necesidad de oírlo.", "Ese rango es la multa de los particulares disciplinables (art. 73). Para el quejoso temerario la multa es de hasta 180 salarios diarios y debe oírse previamente (art. 210).", false]]}]}, {"comp": "disciplinario", "rol": "general", "tag": "Código General Disciplinario · Indagación previa", "texto": "Usted es profesional universitario de la oficina de control disciplinario interno de una secretaría de educación departamental. Llega una queja, acompañada de copias de las nóminas, según la cual alguien del área de nómina incluyó a un docente fallecido en la liquidación de salarios de dos meses. En el área trabajan seis servidores con acceso al sistema de nómina y, por ahora, no se sabe quién hizo el registro. La investigación no versa sobre violaciones de derechos humanos ni del Derecho Internacional Humanitario.", "items": [{"id": "DI-153", "niv": 1, "e": "Como no se sabe cuál de los servidores hizo el registro, lo procedente es", "f": "Ley 1952 de 2019, arts. 208 (modificado por la Ley 2094 de 2021, art. 34), 209 y 211", "o": [["A", "inhibirse de iniciar actuación, porque la queja no identifica al autor de la conducta.", "La decisión inhibitoria procede ante quejas temerarias, irrelevantes, imposibles o absolutamente inconcretas (art. 209); esta es concreta y viene con soportes. La falta de identificación del autor se resuelve con indagación previa (art. 208).", false], ["B", "abrir investigación disciplinaria contra los seis servidores con acceso al sistema.", "La investigación procede cuando se identifica al posible autor (art. 211 de la Ley 1952 de 2019). Vincular a todos sin individualizar desconoce que la indagación previa es la etapa prevista para la duda sobre el autor (art. 208).", false], ["C", "adelantar indagación previa para identificar o individualizar al posible autor.", "En caso de duda sobre la identificación o individualización del posible autor de una falta disciplinaria se adelanta indagación previa (Ley 1952 de 2019, art. 208, modificado por la Ley 2094 de 2021).", true]]}, {"id": "DI-154", "niv": 1, "e": "La indagación previa en este caso tiene una duración de", "f": "Ley 1952 de 2019, art. 208 (modificado por la Ley 2094 de 2021, art. 34)", "o": [["A", "seis meses, y culmina con el archivo definitivo o con el auto de apertura de investigación.", "La indagación previa tiene una duración de seis meses y culmina con el archivo definitivo o auto de apertura de investigación; solo en investigaciones por violación de derechos humanos o DIH puede extenderse otros seis meses (Ley 1952 de 2019, art. 208).", true], ["B", "doce meses, y culmina con la citación a audiencia del posible autor.", "El término es de seis meses (ampliable a otros seis solo en casos de derechos humanos o DIH), y la citación a audiencia es propia del juzgamiento (art. 208).", false], ["C", "tres meses prorrogables por otro tanto, y culmina con la formulación del pliego de cargos.", "La indagación previa dura seis meses y no culmina con pliego de cargos, sino con archivo definitivo o apertura de investigación (art. 208 de la Ley 1952 de 2019).", false]]}, {"id": "DI-155", "niv": 3, "e": "Si al terminar la indagación no se logra identificar al autor y se ordena el archivo, esa decisión", "f": "Ley 1952 de 2019, arts. 208 (parágrafo) y 224", "o": [["A", "hace tránsito a cosa juzgada material e impide cualquier actuación posterior por los mismos hechos.", "La ley dispone lo contrario: el archivo de la indagación por no identificar al autor no hace tránsito a cosa juzgada material (art. 208, parágrafo); solo produce cosa juzgada formal (art. 224).", false], ["B", "no hace tránsito a cosa juzgada material.", "El parágrafo del artículo 208 de la Ley 1952 de 2019 dispone que el archivo por no identificar o individualizar al posible autor no hace tránsito a cosa juzgada material, y el artículo 224 precisa que en ese evento solo hace tránsito a cosa juzgada formal.", true], ["C", "debe enviarse en consulta a la Procuraduría, que decide si la confirma o la revoca.", "El código no prevé consulta del archivo de la indagación; la consulta solo se mantiene para la suspensión provisional (art. 217).", false]]}]}, {"comp": "disciplinario", "rol": "tecnico", "tag": "Código General Disciplinario · Niveles técnico, administrativo y operativo · Término de la investigación disciplinaria", "texto": "Usted es técnico de la secretaría de una procuraduría provincial de instrucción y lleva el control de términos. El 2 de febrero de 2026 se profirió auto de apertura de investigación contra dos servidores de una alcaldía por una misma falta disciplinaria. El instructor le pide calcular los términos máximos de la etapa. En otro despacho de la misma sede se tramita una investigación por presuntas infracciones al Derecho Internacional Humanitario.", "items": [{"id": "DI-156", "niv": 1, "e": "Sin considerar prórrogas, la investigación contra los dos servidores tiene una duración de", "f": "Ley 1952 de 2019, art. 213 (modificado por la Ley 2094 de 2021, art. 36)", "o": [["A", "seis meses, contados a partir de la decisión de apertura.", "La investigación tiene una duración de seis meses contados a partir de la decisión de apertura (Ley 1952 de 2019, art. 213, modificado por la Ley 2094 de 2021).", true], ["B", "doce meses, contados a partir de la decisión de apertura de la investigación.", "Doce meses solo se alcanzan con la prórroga hasta en otro tanto; el término inicial es de seis meses (art. 213 de la Ley 1952 de 2019).", false], ["C", "seis meses, contados desde la notificación personal del auto de apertura.", "El término no se cuenta desde la notificación, sino desde la decisión de apertura (art. 213 de la Ley 1952 de 2019).", false]]}, {"id": "DI-157", "niv": 3, "e": "Si el término se prorroga por haber dos investigados, y sin contar la prórroga adicional por pruebas faltantes, la investigación debe culminar a más tardar en", "f": "Ley 1952 de 2019, art. 213 (modificado por la Ley 2094 de 2021, art. 36)", "o": [["A", "agosto de 2026.", "Agosto de 2026 corresponde solo al término inicial de seis meses, sin la prórroga por pluralidad de investigados (art. 213 de la Ley 1952 de 2019).", false], ["B", "febrero de 2027.", "La investigación dura seis meses desde la apertura y puede prorrogarse hasta en otro tanto cuando se investiga a dos o más servidores (Ley 1952 de 2019, art. 213): seis más seis son doce meses desde febrero de 2026, es decir, febrero de 2027.", true], ["C", "agosto de 2027.", "Dieciocho meses es el límite de las investigaciones por infracciones al DIDH o al DIH, no la prórroga por pluralidad de investigados (art. 213 de la Ley 1952 de 2019).", false]]}, {"id": "DI-158", "niv": 2, "e": "Sin contar la prórroga de tres meses por pruebas faltantes, la investigación por infracciones al Derecho Internacional Humanitario no puede exceder de", "f": "Ley 1952 de 2019, art. 213 (modificado por la Ley 2094 de 2021, art. 36)", "o": [["A", "doce meses.", "Doce meses es el máximo general con prórroga por varias faltas o investigados; para el DIDH y el DIH la ley fija un límite distinto (art. 213 de la Ley 1952 de 2019).", false], ["B", "dieciocho meses.", "Cuando se trate de investigaciones por infracción al Derecho Internacional de los Derechos Humanos o al DIH, el término de investigación no podrá exceder de dieciocho meses (Ley 1952 de 2019, art. 213, inciso 2).", true], ["C", "veinticuatro meses.", "La ley no prevé ese término; el máximo para estas investigaciones es de dieciocho meses, con la eventual prórroga de tres meses por pruebas (art. 213).", false]]}]}, {"comp": "disciplinario", "rol": "profesional", "tag": "Código General Disciplinario · Niveles profesional, asesor y ejecutivo · Cierre de la investigación, evaluación y pliego de cargos", "texto": "Usted es profesional especializado de una procuraduría regional de instrucción. En la investigación contra el gerente de una empresa social del Estado ya se practicaron todas las pruebas ordenadas dentro del término, y debe proyectar los autos siguientes. El defensor del gerente anunció que, si se formulan cargos, presentará recurso de reposición contra el pliego para que se revoque.", "items": [{"id": "DI-159", "niv": 2, "e": "Recaudadas las pruebas, el paso procesal siguiente es", "f": "Ley 1952 de 2019, arts. 112 y 220", "o": [["A", "citar al disciplinado a una audiencia para que rinda descargos ante el funcionario instructor.", "Los descargos se rinden en la etapa de juzgamiento, después del pliego (arts. 225B y 227 de la Ley 1952 de 2019), no ante el instructor tras recaudar las pruebas.", false], ["B", "formular de inmediato el pliego de cargos y remitir el expediente al funcionario de juzgamiento.", "Antes de evaluar debe cerrarse la investigación y correrse traslado para alegatos precalificatorios (art. 220); omitirlo afecta el derecho del disciplinado a alegar antes de la evaluación (art. 112, num. 8).", false], ["C", "declarar cerrada la investigación y correr traslado por diez días para alegatos precalificatorios.", "Recaudadas las pruebas o vencido el término, el funcionario, mediante decisión de sustanciación, declara cerrada la investigación y corre traslado por diez días para alegatos previos a la evaluación (Ley 1952 de 2019, art. 220).", true]]}, {"id": "DI-160", "niv": 1, "e": "Surtido el traslado para alegatos, en la decisión de evaluación el instructor debe", "f": "Ley 1952 de 2019, arts. 12 y 221 (modificados por la Ley 2094 de 2021)", "o": [["A", "remitir el expediente al funcionario de juzgamiento para que este decida si formula cargos.", "Formular cargos es función del instructor en la decisión de evaluación (art. 221); el funcionario de juzgamiento recibe el expediente después de notificado el pliego (art. 225).", false], ["B", "proferir fallo de primera instancia, si la prueba de la responsabilidad es suficiente.", "El instructor no falla: por la separación entre instrucción y juzgamiento, el fallo lo profiere un funcionario distinto (art. 12 de la Ley 1952 de 2019).", false], ["C", "formular pliego de cargos o terminar la actuación y ordenar el archivo, según el mérito de las pruebas.", "Surtido el traslado, el funcionario, mediante decisión motivada, evalúa el mérito de las pruebas y formula pliego de cargos o termina la actuación y ordena el archivo, según corresponda (Ley 1952 de 2019, art. 221, modificado por la Ley 2094 de 2021).", true]]}, {"id": "DI-161", "niv": 3, "e": "Frente al recurso que anuncia el defensor contra el pliego de cargos, debe tenerse en cuenta que", "f": "Ley 1952 de 2019, arts. 133, 134 y 222", "o": [["A", "contra la decisión que formula cargos no procede recurso alguno.", "Contra la decisión de citación a audiencia y formulación de cargos no procede recurso alguno (Ley 1952 de 2019, art. 222). Además, la reposición solo procede contra las decisiones taxativamente señaladas en el artículo 133.", true], ["B", "procede apelación en el efecto devolutivo ante el superior funcional del instructor.", "La apelación procede únicamente contra las decisiones del artículo 134 (niega pruebas en juicio, archivo, testigo renuente y quejoso temerario, fallo de primera instancia), no contra el pliego.", false], ["C", "procede reposición dentro de los cinco días siguientes a la notificación personal del pliego.", "La reposición procede solo contra las decisiones que enumera el artículo 133, entre las que no está el pliego de cargos; el artículo 222 excluye todo recurso contra esa decisión.", false]]}]}, {"comp": "disciplinario", "rol": "general", "tag": "Código General Disciplinario · Juicio ordinario y juicio verbal", "texto": "Usted es profesional universitario de una procuraduría provincial de juzgamiento y recibe tres expedientes con el pliego de cargos ya notificado. En el primero, un agente de tránsito fue sorprendido por la policía en el momento en que recibía dinero de un conductor. En el segundo, los cargos se formularon por una falta calificada como leve. En el tercero, hay once disciplinados, veinte cargos y miles de folios de pruebas, y la falta imputada está entre las que la ley asigna al juicio verbal; además, el despacho tiene solo dos sustanciadores.", "items": [{"id": "DI-162", "niv": 1, "e": "En el primer expediente, el juzgamiento debe adelantarse por el juicio verbal porque", "f": "Ley 1952 de 2019, art. 225A (adicionado por la Ley 2094 de 2021, art. 40)", "o": [["A", "las faltas de los agentes de tránsito se tramitan siempre por juicio verbal, sin excepción.", "El código no fija el juicio verbal por la clase de servidor, sino por la flagrancia, la levedad o ciertas faltas gravísimas (art. 225A de la Ley 1952 de 2019).", false], ["B", "el disciplinado no presentó alegatos precalificatorios durante la etapa de instrucción.", "No presentar alegatos no es criterio para elegir el juicio; los criterios están en el artículo 225A de la Ley 1952 de 2019.", false], ["C", "el disciplinable fue sorprendido en el momento de la comisión de la falta.", "El juicio verbal se adelanta cuando el sujeto disciplinable es sorprendido en el momento de la comisión de la falta o con elementos, efectos o instrumentos que provengan de la ejecución de la conducta (Ley 1952 de 2019, art. 225A).", true]]}, {"id": "DI-163", "niv": 3, "e": "En el segundo expediente, por tratarse de una falta leve, el juzgamiento", "f": "Ley 1952 de 2019, arts. 68 y 225A", "o": [["A", "se adelanta por el juicio verbal, salvo que la complejidad del asunto justifique motivadamente el ordinario.", "El juicio verbal se sigue también por las faltas leves, salvo que la complejidad, el número de disciplinables o de cargos, o la carencia de recursos dificulten la celeridad y la eficacia, caso en el cual el funcionario motiva su decisión (Ley 1952 de 2019, art. 225A y parágrafo).", true], ["B", "se adelanta por el juicio ordinario, que es la regla para las faltas leves y graves.", "El artículo 225A asigna expresamente las faltas leves al juicio verbal.", false], ["C", "no procede, porque las faltas leves se corrigen con medidas del jefe inmediato.", "Las medidas correctivas del jefe inmediato (art. 68) son para hechos que no afectan sustancialmente los deberes; una falta leve con pliego notificado se juzga, en principio, por juicio verbal (art. 225A).", false]]}, {"id": "DI-164", "niv": 3, "e": "En el tercer expediente, el funcionario de juzgamiento", "f": "Ley 1952 de 2019, arts. 214 y 225A (adicionado por la Ley 2094 de 2021, art. 40)", "o": [["A", "debe adelantar el juicio verbal, porque la falta imputada está entre las que la ley asigna a ese trámite.", "El parágrafo del artículo 225A permite apartarse del verbal por la complejidad, el número de disciplinables o de cargos, o la carencia de recursos, motivando la decisión.", false], ["B", "puede adelantar el juicio ordinario por la complejidad del asunto, motivando su decisión.", "Aun en los eventos del juicio verbal, el funcionario adelanta el ordinario cuando la complejidad, el número de disciplinables, el número de cargos o la carencia de recursos dificulten la celeridad, eficacia y economía; debe motivar su decisión y contra ella no procede recurso (Ley 1952 de 2019, art. 225A).", true], ["C", "debe devolver el expediente al instructor para que divida el proceso según el número de disciplinados.", "La ley no prevé esa devolución; la complejidad se atiende eligiendo el juicio ordinario (art. 225A). La ruptura de la unidad procesal procede en los casos taxativos del artículo 214.", false]]}]}, {"comp": "disciplinario", "rol": "tecnico", "tag": "Código General Disciplinario · Niveles técnico, administrativo y operativo · Términos del juicio ordinario", "texto": "Usted es técnico de la secretaría de una procuraduría provincial de juzgamiento. En un proceso contra un servidor de una gobernación, el funcionario de juzgamiento decidió aplicar el juicio ordinario y le pide controlar los términos de cada etapa. El apoderado del disciplinado, inconforme con el pliego de cargos que se le notificó, llama a la secretaría para preguntar qué recurso puede presentar contra esa decisión.", "items": [{"id": "DI-165", "niv": 2, "e": "En el auto que ordena el juicio ordinario, el expediente queda a disposición de los sujetos procesales para presentar descargos y aportar o solicitar pruebas durante", "f": "Ley 1952 de 2019, art. 225B (adicionado por la Ley 2094 de 2021, art. 41)", "o": [["A", "diez días.", "Diez días es el término de los alegatos de conclusión del juicio ordinario (art. 225E) y el de los descargos tras una variación de cargos (art. 225D), no el inicial para descargos.", false], ["B", "quince días.", "En el auto que decide aplicar el procedimiento ordinario se dispone que, por el término de quince días, el expediente quede a disposición de los sujetos procesales para presentar descargos y aportar y solicitar pruebas (Ley 1952 de 2019, art. 225B).", true], ["C", "veinte días.", "Veinte días es el límite superior para celebrar la audiencia del juicio verbal (art. 225H) y el término de práctica de pruebas en ese juicio (art. 227), no el de descargos del ordinario.", false]]}, {"id": "DI-166", "niv": 2, "e": "Las pruebas decretadas en el juicio ordinario deben practicarse en un término no mayor de", "f": "Ley 1952 de 2019, art. 225C (adicionado por la Ley 2094 de 2021, art. 42)", "o": [["A", "veinte días.", "Veinte días, prorrogables, es el término de práctica de pruebas del juicio verbal (art. 227 de la Ley 1952 de 2019).", false], ["B", "cuarenta y cinco días.", "Cuarenta y cinco días es el término para decidir la segunda instancia (art. 234), no el periodo probatorio del juicio ordinario.", false], ["C", "noventa días.", "Las pruebas ordenadas en el juicio ordinario se practican en un término no mayor de noventa días (Ley 1952 de 2019, art. 225C).", true]]}, {"id": "DI-167", "niv": 2, "e": "Al apoderado se le debe informar que, contra el pliego de cargos,", "f": "Ley 1952 de 2019, art. 222", "o": [["A", "no procede recurso alguno; su defensa se ejerce con los descargos y las pruebas en el juicio.", "El art. 222 de la Ley 1952 de 2019 señala que contra la decisión de formular pliego de cargos no procede recurso; el disciplinado controvierte los cargos al presentar descargos y aportar o pedir pruebas.", true], ["B", "procede el recurso de reposición, que debe interponer dentro de los cinco días siguientes a la notificación.", "El pliego de cargos no admite recursos (art. 222 de la Ley 1952 de 2019); la defensa frente a los cargos se ejerce con los descargos y la solicitud de pruebas.", false], ["C", "procede el recurso de apelación ante el superior funcional, en el efecto devolutivo.", "La apelación no procede contra el pliego de cargos, que no admite recursos (art. 222 de la Ley 1952 de 2019).", false]]}]}, {"comp": "disciplinario", "rol": "general", "tag": "Código General Disciplinario · Juicio verbal: audiencia, notificación y apelación", "texto": "Usted es profesional universitario de una procuraduría distrital de juzgamiento. El funcionario de conocimiento decidió adelantar por juicio verbal un proceso contra un auxiliar de una alcaldía local y le pide proyectar el auto de citación a la audiencia de descargos y pruebas. Ya en la audiencia, se negó una prueba pedida por la defensa. Semanas después, en la sesión fijada para dar a conocer la decisión, se leyó el fallo sancionatorio con el disciplinado y su defensor presentes.", "items": [{"id": "DI-168", "niv": 2, "e": "La audiencia de descargos y pruebas debe realizarse", "f": "Ley 1952 de 2019, art. 225H (adicionado por la Ley 2094 de 2021, art. 47)", "o": [["A", "entre diez y veinte días después de la fecha del auto que la convoca.", "En el auto en que decide adelantar el juicio verbal, el funcionario fija fecha y hora para la audiencia de descargos y pruebas, que se realizará en un término no menor de diez ni mayor de veinte días de la fecha del auto de citación (Ley 1952 de 2019, art. 225H).", true], ["B", "dentro de los cinco días siguientes a la notificación personal del pliego de cargos al disciplinado.", "El término se cuenta desde el auto de citación y es de diez a veinte días (art. 225H). Cinco días es el plazo de comparecencia para notificar el pliego (art. 225).", false], ["C", "en un término no menor de quince ni mayor de treinta días desde la ejecutoria del auto de citación.", "El artículo 225H fija entre diez y veinte días desde la fecha del auto; además, contra ese auto no procede recurso.", false]]}, {"id": "DI-169", "niv": 1, "e": "La decisión que negó la prueba en la audiencia se entiende notificada", "f": "Ley 1952 de 2019, arts. 126 y 227", "o": [["A", "por estado electrónico, al día siguiente de terminada la sesión de la audiencia.", "El estado es para decisiones que no se profieren en audiencia; las proferidas en audiencia se notifican en estrados (art. 126 de la Ley 1952 de 2019).", false], ["B", "personalmente, cuando el defensor firme el acta de la sesión de la audiencia.", "La firma del acta (art. 226) no es la forma de notificación; la notificación se surte en estrados en el momento del pronunciamiento (arts. 126 y 227).", false], ["C", "en estrados, a todos los sujetos procesales, estén o no presentes.", "Las decisiones proferidas en audiencia se consideran notificadas a todos los sujetos procesales inmediatamente se hace el pronunciamiento, se encuentren o no presentes (Ley 1952 de 2019, art. 126); el artículo 227 lo reitera para la negación de pruebas.", true]]}, {"id": "DI-170", "niv": 3, "e": "Si el disciplinado quiere apelar el fallo leído en la audiencia, debe", "f": "Ley 1952 de 2019, arts. 131, 232 y 233", "o": [["A", "interponer el recurso en la misma audiencia.", "En el juicio verbal, el artículo 233 de la Ley 1952 de 2019 dispone que contra el fallo de primera instancia procede apelación, que deberá interponerse en la misma diligencia (con sustentación verbal inmediata o por escrito dentro de los cinco días siguientes). En el mismo sentido, el artículo 131 exige interponer en la audiencia los recursos contra decisiones notificadas en estrados.", true], ["B", "interponerlo y sustentarlo por escrito ante la secretaría, dentro de los diez días siguientes.", "Ese es el trámite del artículo 225G de la Ley 1952 de 2019, exclusivo del fallo del juicio ordinario. En el juicio verbal el artículo 233 exige interponer la apelación en la misma diligencia en que se profiere el fallo.", false], ["C", "interponerlo dentro de los cinco días siguientes a la desfijación del edicto que notifique el fallo.", "El fallo del juicio verbal se notifica en estrados (arts. 126 y 232), no por edicto, y el recurso se interpone en la misma diligencia (art. 233).", false]]}]}, {"comp": "disciplinario", "rol": "profesional", "tag": "Código General Disciplinario · Niveles profesional, asesor y ejecutivo · Confesión y aceptación de cargos", "texto": "Usted es profesional de una procuraduría provincial. En una investigación por una falta grave dolosa, el servidor investigado, que no tiene abogado, se presenta en la etapa de investigación y manifiesta que quiere aceptar los cargos para obtener una rebaja. En otro proceso, por una falta grave dolosa que no está entre las del artículo 52 del código, el disciplinado aceptó los cargos en la etapa de juzgamiento, antes de la ejecutoria del auto que concede el traslado para alegar de conclusión y asistido por su defensor; el funcionario considera que, sin la aceptación, la sanción adecuada habría sido suspensión de doce meses e inhabilidad especial por el mismo término.", "items": [{"id": "DI-171", "niv": 1, "e": "Para que la aceptación de cargos del primer servidor sea válida, se requiere, entre otros requisitos, que", "f": "Ley 1952 de 2019, art. 161 (modificado por la Ley 2094 de 2021, art. 29)", "o": [["A", "cuente con el aval previo del quejoso o de la víctima de la conducta investigada.", "El artículo 161 no exige aval del quejoso ni de la víctima; la autoridad constata que la aceptación sea voluntaria, consciente, libre, espontánea e informada.", false], ["B", "esté asistido por defensor y se le informe de sus derechos y de los beneficios legales.", "La confesión o aceptación de cargos exige, entre otros requisitos, que la persona esté asistida por defensor y sea informada del derecho a no declarar contra sí misma, de las garantías del artículo 33 de la Constitución y de los beneficios y rebajas legales (Ley 1952 de 2019, art. 161, modificado por la Ley 2094 de 2021).", true], ["C", "la presente por escrito y la ratifique ante notario dentro de los tres días siguientes.", "La ley no exige escrito ni ratificación notarial; exige que se haga ante la autoridad competente, con defensor y con la información de derechos y beneficios (art. 161 de la Ley 1952 de 2019).", false]]}, {"id": "DI-172", "niv": 2, "e": "Si la aceptación en la etapa de investigación cumple los requisitos, la autoridad disciplinaria debe", "f": "Ley 1952 de 2019, arts. 12, 32 y 162 (modificado por la Ley 2094 de 2021, art. 30)", "o": [["A", "archivar la actuación, porque la aceptación de cargos extingue la acción disciplinaria.", "La aceptación de cargos no es causal de extinción (art. 32); da lugar a una rebaja de la sanción (art. 162).", false], ["B", "proferir de inmediato el fallo sancionatorio, porque la aceptación suprime la etapa de juzgamiento.", "El instructor no falla; el acta se remite al funcionario de juzgamiento para que profiera el fallo (art. 162 de la Ley 1952 de 2019), en garantía de la separación de funciones (art. 12).", false], ["C", "elaborar en diez días un acta que equivale al pliego de cargos y remitirla al funcionario de juzgamiento.", "Evaluada la manifestación, en el término improrrogable de diez días se elabora un acta con los términos de la aceptación, los hechos, su encuadramiento, calificación y culpabilidad, que equivale al pliego de cargos y se remite al funcionario de juzgamiento, quien falla en cuarenta y cinco días (Ley 1952 de 2019, art. 162).", true]]}, {"id": "DI-173", "niv": 3, "e": "En el segundo proceso, la suspensión e inhabilidad especial debe quedar en", "f": "Ley 1952 de 2019, art. 162 (modificado por la Ley 2094 de 2021, art. 30)", "o": [["A", "seis meses.", "La rebaja hasta la mitad aplica cuando la aceptación ocurre en la etapa de investigación, no en la de juzgamiento (art. 162 de la Ley 1952 de 2019).", false], ["B", "ocho meses.", "Si la aceptación de cargos se produce en la etapa de juzgamiento, las sanciones de inhabilidad, suspensión o multa se reducen en una tercera parte, rebaja fija; en la etapa de investigación la rebaja es «hasta la mitad» (Ley 1952 de 2019, art. 162). Doce meses menos un tercio (cuatro meses) da ocho meses.", true], ["C", "nueve meses.", "Corresponde a reducir una cuarta parte, porcentaje que no prevé la ley; en juzgamiento la reducción es de una tercera parte (art. 162).", false]]}]}, {"comp": "disciplinario", "rol": "general", "tag": "Código General Disciplinario · Suspensión provisional", "texto": "Usted es profesional universitario de la oficina de control disciplinario interno de un hospital departamental. En la investigación contra el almacenista por una presunta falta gravísima relacionada con el manejo de medicamentos, hay serios elementos de juicio de que, si permanece en el cargo, podría alterar los inventarios que son prueba del proceso. El jefe de la oficina evalúa ordenar la suspensión provisional del almacenista y le pide revisar su procedencia, su término y sus efectos.", "items": [{"id": "DI-174", "niv": 2, "e": "La suspensión provisional del almacenista procede porque", "f": "Ley 1952 de 2019, art. 217", "o": [["A", "se investiga una falta gravísima y su permanencia en el cargo posibilita que interfiera en la investigación.", "Durante la investigación o el juzgamiento por faltas gravísimas o graves, puede ordenarse motivadamente la suspensión provisional, sin remuneración, cuando haya serios elementos de juicio de que la permanencia en el cargo posibilita la interferencia en el trámite, o la continuación o reiteración de la falta (Ley 1952 de 2019, art. 217).", true], ["B", "procede en cualquier proceso, sin importar la gravedad de la falta, cuando la pide el quejoso.", "Solo procede por faltas gravísimas o graves y por decisión motivada del funcionario, no a petición del quejoso (art. 217 de la Ley 1952 de 2019).", false], ["C", "toda apertura de investigación por falta gravísima conlleva automáticamente esa medida.", "La medida no es automática: debe ordenarse motivadamente y exige serios elementos de juicio sobre interferencia, continuidad o reiteración de la falta (art. 217 de la Ley 1952 de 2019).", false]]}, {"id": "DI-175", "niv": 2, "e": "Sobre el término de la suspensión provisional, es correcto afirmar que", "f": "Ley 1952 de 2019, art. 217", "o": [["A", "es de seis meses improrrogables y contra el auto que la ordena procede apelación.", "El término es de tres meses prorrogables, y el auto no se apela sino que se somete a consulta (art. 217 de la Ley 1952 de 2019).", false], ["B", "es de un mes, prorrogable mes a mes hasta que se profiera el fallo de primera instancia.", "La ley fija tres meses prorrogables hasta en otro tanto, y otros tres meses una vez proferido el fallo de primera o úni
