 vínculo para personas de la organización, que da acceso a externos mientras no se reenvíe.", "Ese vínculo solo funciona para personas de la organización; no sirve para invitados externos.", false], ["B", "un vínculo para cualquier persona que lo tenga, porque la contratista no pertenece a la organización.", "Los vínculos «Cualquiera» no exigen autenticación, se pueden reenviar y su acceso no se puede auditar; Microsoft recomienda evitarlos salvo necesidad.", false], ["C", "un vínculo para personas específicas, con permiso de solo lectura, dirigido al correo de la contratista.", "El vínculo de personas específicas (en OneDrive, «Personas específicas» o «Solo las personas que usted elija») solo funciona para quien se indica, exige que se autentique y no sirve si se reenvía a otra persona; sirve también con personas externas, si la política de uso compartido de la entidad lo permite.", true]]}, {"id": "OF-155", "niv": 2, "e": "Frente a la solicitud del compañero que sale a vacaciones, lo correcto es", "f": "Microsoft Support, «Permitir que otra persona administre su correo y calendario» (acceso de delegado en Outlook)", "o": [["A", "aceptar, si el jefe inmediato autoriza por correo el uso compartido de la contraseña.", "La autorización del jefe no vuelve personal una credencial ajena; las acciones seguirían quedando registradas a nombre del compañero.", false], ["B", "no usar credenciales ajenas y pedir que tecnología le conceda acceso delegado al buzón.", "Las credenciales son personales e intransferibles: usarlas impide saber quién hizo cada acción. Outlook y Microsoft 365 permiten conceder acceso de delegado al buzón con permisos propios.", true], ["C", "aceptar, siempre que él cambie la contraseña cuando regrese.", "Cambiar después la contraseña no corrige que, mientras tanto, otra persona actúe con una identidad ajena sin trazabilidad.", false]]}]}, {"comp": "sistemas_gestion", "rol": "general", "tag": "Sistemas de gestión (MIPG, control interno y calidad) · MIPG: definición, objetivos y ámbito", "texto": "Usted es profesional de la Oficina de Planeación de la Procuraduría General de la Nación y prepara una charla de inducción sobre el Modelo Integrado de Planeación y Gestión (MIPG) para servidores recién posesionados. Un asistente afirma que el MIPG «solo existe para los ministerios y las alcaldías» y que, por tanto, nada tiene que ver con un organismo de control. Otro pregunta qué es exactamente el modelo y qué objetivos persigue.", "items": [{"id": "SG-101", "niv": 3, "e": "Según el Decreto 1083 de 2015, modificado por el Decreto 1499 de 2017, frente a un organismo de control lo correcto es afirmar que", "f": "Decreto 1083 de 2015, art. 2.2.22.3.4 (Decreto 1499 de 2017, art. 1); Ley 87 de 1993, art. 5", "o": [["A", "debe aplicar la política de control interno y adoptar las otras políticas del modelo solo en lo que le resulte aplicable.", "El artículo 2.2.22.3.4 dispone que el MIPG se adopta por la rama ejecutiva y que los organismos de control, entre otros, aplican la política de control interno de la Ley 87 de 1993 y las demás políticas de gestión y desempeño en la medida en que les sean aplicables según sus normas.", true], ["B", "debe adoptar el modelo en su integridad, en las mismas condiciones que las entidades de la rama ejecutiva del orden nacional.", "La adopción integral se prevé para la rama ejecutiva; para los organismos de control el decreto establece una aplicación de las políticas en la medida en que les sean aplicables.", false], ["C", "está excluido del modelo y de la Ley 87 de 1993, porque es él quien ejerce control sobre las demás entidades.", "La Ley 87 de 1993 (art. 5) incluye expresamente a los organismos de control, y el decreto les ordena aplicar la política de control interno.", false]]}, {"id": "SG-102", "niv": 1, "e": "El decreto define el MIPG como", "f": "Decreto 1083 de 2015, art. 2.2.22.3.2", "o": [["A", "un marco de referencia para dirigir, planear, ejecutar, hacer seguimiento, evaluar y controlar la gestión de las entidades.", "Es la definición del artículo 2.2.22.3.2, que agrega que su fin es generar resultados que atiendan los planes de desarrollo y resuelvan las necesidades de los ciudadanos, con integridad y calidad.", true], ["B", "una certificación de calidad que reemplaza a la norma ISO 9001 en las entidades públicas.", "El MIPG no es una certificación; el Sistema de Gestión que lo opera integró los antiguos sistemas de desarrollo administrativo y de gestión de la calidad de las leyes 489 de 1998 y 872 de 2003.", false], ["C", "un sistema de evaluación externa con el que la Función Pública califica y sanciona a las entidades que incumplen sus metas.", "La Función Pública mide el desempeño (por ejemplo, con el FURAG), pero el MIPG no es un régimen sancionatorio sino un marco de gestión de cada entidad.", false]]}, {"id": "SG-103", "niv": 1, "e": "Entre los objetivos que el decreto asigna al MIPG se encuentra", "f": "Decreto 1083 de 2015, art. 2.2.22.3.3", "o": [["A", "centralizar en la Función Pública la aprobación de los planes de acción anuales de cada una de las entidades.", "Ninguno de los objetivos del artículo 2.2.22.3.3 traslada a la Función Pública la aprobación de los planes de las entidades.", false], ["B", "promover la participación ciudadana en la planeación, gestión y evaluación de las entidades.", "Es el objetivo 4 del artículo 2.2.22.3.3, junto con fortalecer el liderazgo y el talento humano, agilizar la operación, desarrollar una cultura basada en información y control, y promover la coordinación entre entidades.", true], ["C", "sustituir el control fiscal que ejercen las contralorías sobre las entidades públicas.", "El MIPG no sustituye el control fiscal externo; se articula con el sistema de control interno de cada entidad.", false]]}]}, {"comp": "sistemas_gestion", "rol": "general", "tag": "Sistemas de gestión (MIPG, control interno y calidad) · Comité Institucional de Gestión y Desempeño", "texto": "Usted es técnico de la Oficina de Planeación de un establecimiento público del orden nacional, adscrito a un ministerio. La entidad tiene tres comités internos creados por resolución del director, relacionados con temas del MIPG y sin origen en una norma legal; cada uno se reúne por separado y sus decisiones a veces se contradicen. La nueva directora pide revisar cómo debe organizarse la instancia que orienta la implementación del modelo.", "items": [{"id": "SG-104", "niv": 3, "e": "Frente a los tres comités internos, el Decreto 1083 de 2015 dispone que", "f": "Decreto 1083 de 2015, art. 2.2.22.3.8", "o": [["A", "deben fusionarse en el Comité Institucional de Coordinación de Control Interno, que orienta el modelo.", "La instancia que orienta la implementación y operación del MIPG es el Comité Institucional de Gestión y Desempeño; el de control interno tiene funciones propias del sistema de control interno.", false], ["B", "deben mantenerse, y el Comité Institucional de Gestión y Desempeño solo coordina sus agendas.", "El decreto no prevé que esos comités subsistan bajo coordinación: los sustituye cuando no son obligatorios por ley.", false], ["C", "el Comité Institucional de Gestión y Desempeño los sustituye y asume sus temas.", "El artículo 2.2.22.3.8 ordena integrar en cada entidad un Comité Institucional de Gestión y Desempeño que sustituye los demás comités relacionados con el modelo que no sean obligatorios por mandato legal.", true]]}, {"id": "SG-105", "niv": 1, "e": "La secretaría técnica del Comité Institucional de Gestión y Desempeño corresponde a", "f": "Decreto 1083 de 2015, art. 2.2.22.3.8, par. 1", "o": [["A", "el jefe de la oficina de control interno de la entidad.", "El decreto asigna la secretaría técnica al jefe de planeación; la oficina de control interno conserva su independencia como evaluadora.", false], ["B", "un servidor del nivel asesor elegido por los miembros en cada sesión.", "La secretaría técnica no es rotativa ni electiva; el decreto la asigna al jefe de la oficina de planeación o a quien haga sus veces.", false], ["C", "el jefe de la oficina de planeación o quien haga sus veces.", "Así lo dispone el parágrafo 1 del artículo 2.2.22.3.8 del Decreto 1083 de 2015.", true]]}, {"id": "SG-106", "niv": 2, "e": "Entre sus funciones, el comité debe aprobar y hacer seguimiento a las acciones y estrategias para la operación del MIPG", "f": "Decreto 1083 de 2015, art. 2.2.22.3.8, num. 1", "o": [["A", "por lo menos una vez al mes.", "El decreto no fija una periodicidad mensual; el mínimo es trimestral.", false], ["B", "por lo menos una vez cada tres meses.", "El numeral 1 de las funciones del artículo 2.2.22.3.8 exige aprobar y hacer seguimiento, por lo menos una vez cada tres meses, a las acciones y estrategias del modelo.", true], ["C", "por lo menos una vez al año, al cierre de la vigencia.", "Un seguimiento anual no cumple el mínimo trimestral que fija el decreto.", false]]}]}, {"comp": "sistemas_gestion", "rol": "tecnico", "tag": "Sistemas de gestión (MIPG, control interno y calidad) · Niveles técnico, administrativo y operativo · FURAG y medición del MECI", "texto": "Usted es técnico administrativo de la oficina de control interno de una gobernación. Se abrió el periodo anual de reporte de la medición del desempeño institucional y el gobernador pregunta quién reporta qué y por qué medio. Una compañera sostiene que la oficina de control interno debe medir tanto el avance como la efectividad del Modelo Estándar de Control Interno (MECI), y que la metodología de medición la fija cada gobernación.", "items": [{"id": "SG-107", "niv": 1, "e": "La información para medir la gestión y el desempeño institucional se recoge mediante", "f": "Decreto 1083 de 2015, art. 2.2.22.3.10", "o": [["A", "el Formulario Único de Reporte y Avance de Gestión (FURAG).", "El artículo 2.2.22.3.10 del Decreto 1083 de 2015 dispone que la recolección de información para la medición se hace a través del FURAG.", true], ["B", "el Sistema de Información y Gestión del Empleo Público (SIGEP).", "El SIGEP registra información del talento humano y de las hojas de vida; la medición del desempeño institucional se hace con el FURAG.", false], ["C", "el Sistema Electrónico para la Contratación Pública (SECOP).", "El SECOP es la plataforma de la contratación pública; no es el instrumento de medición del MIPG.", false]]}, {"id": "SG-108", "niv": 3, "e": "Sobre la medición del MECI, lo correcto es que", "f": "Decreto 1083 de 2015, art. 2.2.23.3", "o": [["A", "el representante legal mide el avance del MECI y el jefe de control interno, su efectividad.", "El artículo 2.2.23.3 dispone que los representantes legales y jefes de organismos miden el avance del MECI, y que los jefes de control interno, o quienes hagan sus veces, miden su efectividad.", true], ["B", "el jefe de control interno mide tanto el avance como la efectividad del modelo.", "El decreto distingue: el avance lo miden los representantes legales y jefes de organismo; a control interno le corresponde medir la efectividad.", false], ["C", "el jefe de planeación mide el avance y la Función Pública mide la efectividad mediante visitas.", "La Función Pública fija la metodología y recoge la información con el FURAG; la medición de la efectividad corresponde a los jefes de control interno.", false]]}, {"id": "SG-109", "niv": 2, "e": "La metodología y la periodicidad de esas mediciones las establece", "f": "Decreto 1083 de 2015, arts. 2.2.22.3.10 y 2.2.23.3", "o": [["A", "cada gobernación, mediante resolución de su comité de control interno.", "Las entidades reportan, pero no definen la metodología; esta la fija la Función Pública para todas.", false], ["B", "la Contraloría General de la República, como órgano de control fiscal.", "La Contraloría ejerce control fiscal externo; la metodología del FURAG y del MECI corresponde a la Función Pública.", false], ["C", "el Departamento Administrativo de la Función Pública.", "Los artículos 2.2.22.3.10 y 2.2.23.3 asignan a la Función Pública (en coordinación con el Consejo para la Gestión y el Desempeño Institucional, en el caso del FURAG) la metodología, la periodicidad y las demás condiciones.", true]]}]}, {"comp": "sistemas_gestion", "rol": "general", "tag": "Sistemas de gestión (MIPG, control interno y calidad) · Ley 87 de 1993: definición y objetivos", "texto": "Usted es auxiliar administrativo de una procuraduría provincial y asiste a una capacitación sobre control interno. El facilitador presenta tres situaciones de otras entidades: en una alcaldía, varios computadores portátiles se prestaban sin registro y se perdieron dos; en un hospital público, los reportes financieros se entregaban tarde y con cifras que no coincidían con los registros contables; y en una personería, un funcionario afirmó que el control interno «es asunto exclusivo de la oficina de control interno».", "items": [{"id": "SG-110", "niv": 1, "e": "La pérdida de los portátiles revela una falla frente al objetivo del sistema de control interno de", "f": "Ley 87 de 1993, art. 2, lit. a", "o": [["A", "garantizar que el sistema de control interno tenga sus propios mecanismos de verificación.", "Ese objetivo (literal g) se refiere a la autoevaluación del sistema, no a la custodia de bienes.", false], ["B", "proteger los recursos de la organización, buscando su adecuada administración ante los riesgos.", "Es el objetivo del literal a) del artículo 2 de la Ley 87 de 1993: los bienes prestados sin registro quedan expuestos a pérdida.", true], ["C", "velar por procesos de planeación adecuados para el diseño y desarrollo organizacional.", "El literal h) se refiere a la planeación y al diseño organizacional; el caso muestra la falta de protección de los recursos.", false]]}, {"id": "SG-111", "niv": 2, "e": "La situación de los reportes financieros del hospital afecta, sobre todo, el objetivo de", "f": "Ley 87 de 1993, art. 2, lit. e", "o": [["A", "asegurar la oportunidad y confiabilidad de la información y de sus registros.", "El literal e) del artículo 2 de la Ley 87 de 1993 busca que la información sea oportuna y confiable; reportes tardíos que no coinciden con los registros contables la incumplen.", true], ["B", "proteger los recursos de la organización ante posibles riesgos que los afecten.", "Ese objetivo apunta a la custodia y administración de los recursos; el caso describe información tardía e inconsistente.", false], ["C", "garantizar la correcta evaluación y seguimiento de la gestión organizacional.", "Ese objetivo (literal d) se refiere a evaluar la gestión; el problema descrito es la calidad y oportunidad de la información y sus registros.", false]]}, {"id": "SG-112", "niv": 2, "e": "La afirmación del funcionario de la personería es", "f": "Ley 87 de 1993, arts. 1, 3 y 6", "o": [["A", "correcta, pero solo en las entidades territoriales, donde el jefe de control interno tiene periodo fijo.", "El periodo fijo del jefe de control interno territorial (art. 11) no cambia que el control interno sea tarea de todos los cargos.", false], ["B", "errónea, porque el control interno hace parte de las funciones de todos los cargos.", "El artículo 1 de la Ley 87 de 1993 dispone que el ejercicio del control interno debe ser intrínseco al desarrollo de las funciones de todos los cargos de la entidad, y en particular de los que tienen responsabilidad de mando.", true], ["C", "correcta, porque la ley asigna a la oficina de control interno el establecimiento y desarrollo del sistema.", "El establecimiento y desarrollo del sistema es responsabilidad del representante legal (art. 6); la oficina de control interno lo evalúa en forma independiente (art. 3, lit. d).", false]]}]}, {"comp": "sistemas_gestion", "rol": "profesional", "tag": "Sistemas de gestión (MIPG, control interno y calidad) · Niveles profesional, asesor y ejecutivo · Responsabilidades frente al control interno", "texto": "Usted es asesor de la oficina de control interno de una entidad pública del orden nacional. El secretario general le pide que, para «agilizar», la oficina firme el visto bueno de cada orden de pago antes de que la tesorería la gire. Ese mismo mes, el jefe de la oficina de contratación sostiene que la calidad de los controles de su proceso es responsabilidad de control interno y no suya. Y el director pregunta a quién corresponde establecer y desarrollar el sistema de control interno.", "items": [{"id": "SG-113", "niv": 3, "e": "Frente a la solicitud del secretario general, usted debe responder que", "f": "Ley 87 de 1993, art. 12 y parágrafo", "o": [["A", "es procedente, porque verificar los procesos de manejo de recursos es una de las funciones de la oficina.", "La función de verificar los procesos de manejo de recursos (art. 12, lit. g) se ejerce como evaluación, no mediante la firma de cada operación.", false], ["B", "es procedente si el comité de coordinación de control interno lo incluye en el plan anual de auditoría.", "Ninguna aprobación interna levanta la prohibición legal del parágrafo del artículo 12.", false], ["C", "no es procedente, porque el auditor interno no puede autorizar ni refrendar trámites administrativos.", "El parágrafo del artículo 12 de la Ley 87 de 1993 prohíbe al asesor, coordinador o auditor interno participar en los procedimientos administrativos mediante autorizaciones o refrendaciones, lo que preserva su independencia.", true]]}, {"id": "SG-114", "niv": 2, "e": "Frente a lo que sostiene el jefe de contratación, lo correcto es que", "f": "Ley 87 de 1993, arts. 3, lit. c, y 6", "o": [["A", "la oficina de control interno responde por los controles de todos los procesos, porque es la encargada de diseñarlos.", "La oficina de control interno evalúa en forma independiente; el diseño y la aplicación de los controles corresponden a la dirección y a los responsables de cada área.", false], ["B", "los jefes de cada dependencia también responden por la aplicación, calidad y eficacia de los controles.", "El artículo 6 de la Ley 87 de 1993 lo dispone expresamente, y el artículo 3, literal c), hace a cada jefe de área responsable del control interno ante su jefe inmediato.", true], ["C", "esa responsabilidad es de la oficina de planeación, como instancia que consolida el mapa de riesgos.", "Consolidar riesgos o asesorar no traslada la responsabilidad legal que el artículo 6 asigna a los jefes de dependencia.", false]]}, {"id": "SG-115", "niv": 1, "e": "Al director debe respondérsele que establecer y desarrollar el sistema de control interno es responsabilidad de", "f": "Ley 87 de 1993, arts. 3, lit. b, y 6", "o": [["A", "el representante legal o máximo directivo de la entidad.", "El artículo 6 de la Ley 87 de 1993 asigna esa responsabilidad al representante legal o máximo directivo, y el artículo 3, literal b), a la máxima autoridad.", true], ["B", "el Departamento Administrativo de la Función Pública, como líder de la política.", "La Función Pública fija lineamientos y metodologías, pero la responsabilidad del sistema en cada entidad es de su máximo directivo.", false], ["C", "el jefe de la oficina de control interno de la entidad.", "El jefe de control interno evalúa el sistema en forma independiente y recomienda mejoras; no es el responsable de establecerlo.", false]]}]}, {"comp": "sistemas_gestion", "rol": "general", "tag": "Sistemas de gestión (MIPG, control interno y calidad) · Comité de coordinación de control interno e informes", "texto": "Usted es profesional universitario de la oficina de control interno de la alcaldía de un municipio. El jefe de la oficina elaboró el plan anual de auditoría de la vigencia y el estatuto de auditoría interna, y el alcalde pregunta qué instancia debe aprobarlos. Además, la oficina debe publicar el informe de evaluación independiente del estado del sistema de control interno.", "items": [{"id": "SG-116", "niv": 1, "e": "Según la Ley 87 de 1993, el comité de coordinación del sistema de control interno debe establecerse", "f": "Ley 87 de 1993, art. 13", "o": [["A", "en la gobernación, como instancia común para los municipios del departamento.", "El comité es propio de cada organismo o entidad (art. 13), no una instancia departamental compartida.", false], ["B", "dentro de la oficina de control interno, que lo preside y lo integra.", "La ley no lo ubica dentro de la oficina de control interno, sino al más alto nivel jerárquico de la entidad.", false], ["C", "al más alto nivel jerárquico de la entidad.", "El artículo 13 de la Ley 87 de 1993 ordena establecer el comité de coordinación del sistema de control interno al más alto nivel jerárquico.", true]]}, {"id": "SG-117", "niv": 2, "e": "El plan anual de auditoría y el estatuto de auditoría interna los aprueba", "f": "Decreto 1083 de 2015, art. 2.2.21.1.6, lits. b y c (Decreto 648 de 2017)", "o": [["A", "el Comité Institucional de Gestión y Desempeño.", "Ese comité orienta la implementación del MIPG; la aprobación del plan y del estatuto de auditoría corresponde al comité de coordinación de control interno.", false], ["B", "el concejo municipal, mediante acuerdo, a iniciativa del alcalde.", "El concejo no aprueba los instrumentos internos de auditoría de la administración; es función del comité de coordinación de control interno.", false], ["C", "el Comité Institucional de Coordinación de Control Interno.", "El artículo 2.2.21.1.6 del Decreto 1083 de 2015 (adicionado por el Decreto 648 de 2017) le asigna aprobar el Plan Anual de Auditoría y el Estatuto de Auditoría Interna con el Código de Ética del auditor.", true]]}, {"id": "SG-118", "niv": 2, "e": "El jefe de control interno debe publicar en el sitio web de la entidad el informe de evaluación independiente del estado del sistema de control interno", "f": "Ley 87 de 1993, art. 14 (modificado por la Ley 1474 de 2011, art. 9, y por el Decreto Ley 2106 de 2019, art. 156)", "o": [["A", "cada cuatro meses.", "Era la periodicidad del informe pormenorizado antes de la modificación del Decreto Ley 2106 de 2019; hoy el término es de seis meses.", false], ["B", "cada seis meses.", "El artículo 14 de la Ley 87 de 1993, modificado por el artículo 156 del Decreto Ley 2106 de 2019, ordena publicarlo cada seis meses, so pena de falta disciplinaria grave (antes, el artículo 9 de la Ley 1474 de 2011 fijaba cuatro meses para el informe pormenorizado).", true], ["C", "una vez al año, con el informe de rendición de cuentas.", "La norma exige una periodicidad semestral, no anual.", false]]}]}, {"comp": "sistemas_gestion", "rol": "general", "tag": "Sistemas de gestión (MIPG, control interno y calidad) · Roles de la oficina de control interno", "texto": "Usted es técnico de la oficina de control interno de una entidad del orden departamental. En el plan de trabajo de la oficina aparecen tres actividades: (1) capacitar a los líderes de proceso en autocontrol y acompañarlos en la formulación de sus controles, sin decidir por ellos; (2) consolidar y entregar oportunamente la información que solicita la contraloría departamental en una auditoría; (3) verificar si los controles de los mapas de riesgos están bien diseñados y si se aplican.", "items": [{"id": "SG-119", "niv": 2, "e": "La actividad (1) corresponde al rol de", "f": "Decreto 1083 de 2015, art. 2.2.21.5.3 (Decreto 648 de 2017); Función Pública, Guía rol de las unidades u oficinas de control interno", "o": [["A", "enfoque hacia la prevención.", "Este rol articula la asesoría y el acompañamiento con el fomento de la cultura del control, sin que la oficina asuma decisiones de la administración.", true], ["B", "evaluación y seguimiento.", "La evaluación y el seguimiento se hacen mediante auditorías y verificaciones; capacitar y acompañar es una labor preventiva.", false], ["C", "liderazgo estratégico.", "Ese rol se refiere al jefe de control interno como soporte estratégico de la alta dirección para la toma de decisiones, no a la asesoría a los líderes de proceso.", false]]}, {"id": "SG-120", "niv": 1, "e": "La actividad (2) corresponde al rol de", "f": "Decreto 1083 de 2015, art. 2.2.21.5.3 (Decreto 648 de 2017); Función Pública, Guía rol de las unidades u oficinas de control interno", "o": [["A", "liderazgo estratégico frente a la alta dirección.", "Ese rol apunta al apoyo a la alta dirección en la toma de decisiones; atender requerimientos de la contraloría es relación con entes externos.", false], ["B", "relación con entes externos de control.", "Mediante este rol el jefe de control interno sirve de puente entre los entes de control externos y la entidad y facilita el flujo de información con ellos.", true], ["C", "evaluación y seguimiento.", "Ese rol se refiere a la evaluación independiente de la gestión y de los controles de la entidad, no a la interlocución con la contraloría.", false]]}, {"id": "SG-121", "niv": 2, "e": "La actividad (3) corresponde al rol de", "f": "Decreto 1083 de 2015, art. 2.2.21.5.3 (Decreto 648 de 2017); Función Pública, Guía rol de las unidades u oficinas de control interno", "o": [["A", "relación con entes externos de control.", "La actividad es interna: evalúa los controles de la entidad sin intervención de un ente externo.", false], ["B", "enfoque hacia la prevención.", "La prevención se ejerce con asesoría y fomento de la cultura del control; verificar diseño y aplicación de controles de riesgos es una evaluación.", false], ["C", "evaluación de la gestión del riesgo.", "Este rol comprende evaluar el diseño y la efectividad de los controles frente a los riesgos identificados por la entidad.", true]]}]}, {"comp": "sistemas_gestion", "rol": "general", "tag": "Sistemas de gestión (MIPG, control interno y calidad) · Esquema de líneas de defensa", "texto": "Usted es profesional de la Oficina de Planeación de una superintendencia. En una sesión sobre el esquema de líneas de defensa del Modelo Estándar de Control Interno se analizan tres actores: la coordinadora del grupo de contratos y su equipo, que revisan a diario que cada contrato tenga los soportes antes de su firma; la Oficina de Planeación, que consolida el mapa de riesgos, asesora a los líderes de proceso y monitorea si los controles operan; y la alta dirección con el Comité Institucional de Coordinación de Control Interno, que define la política de administración del riesgo.", "items": [{"id": "SG-122", "niv": 1, "e": "La coordinadora del grupo de contratos y su equipo actúan como", "f": "Función Pública, Manual Operativo del MIPG, versión 7 (2026), política de control interno, esquema de líneas de defensa", "o": [["A", "primera línea de defensa, por ser responsables del proceso y ejecutar los controles en el día a día.", "El Manual Operativo del MIPG ubica en la primera línea a los responsables de procesos y sus equipos, que gestionan los riesgos y ejecutan los controles.", true], ["B", "segunda línea de defensa, por supervisar el cumplimiento de los requisitos contractuales.", "La segunda línea supervisa y monitorea transversalmente los controles de la primera; quien revisa sus propios contratos antes de firmarlos ejecuta controles.", false], ["C", "tercera línea de defensa, por verificar los soportes antes de la firma.", "La tercera línea es la oficina de control interno, que da aseguramiento independiente; no ejecuta controles operativos.", false]]}, {"id": "SG-123", "niv": 2, "e": "La Oficina de Planeación, en las tareas descritas, actúa como", "f": "Función Pública, Manual Operativo del MIPG, versión 7 (2026); Función Pública, Guía para la Gestión Integral del Riesgo en Entidades Públicas, versión 7 (2025), líneas de aseguramiento", "o": [["A", "primera línea de defensa, porque elabora el mapa de riesgos de la entidad.", "Los riesgos de cada proceso los gestionan sus responsables (primera línea); Planeación consolida, asesora y monitorea, que son funciones de segunda línea.", false], ["B", "segunda línea de defensa, porque asesora, consolida y monitorea la operación de los controles.", "El Manual Operativo ubica en la segunda línea a quienes ejercen supervisión, asesoría y monitoreo transversal, como planeación y gestión de riesgos.", true], ["C", "línea estratégica, porque define los riesgos de toda la entidad.", "La línea estratégica está conformada por la alta dirección y el comité de coordinación de control interno, que definen la política de riesgos.", false]]}, {"id": "SG-124", "niv": 3, "e": "Si el jefe de control interno propone que su oficina asuma la revisión diaria de los soportes contractuales para «blindar» el proceso, debe advertírsele que", "f": "Función Pública, Manual Operativo del MIPG, versión 7 (2026); Ley 87 de 1993, art. 12, parágrafo", "o": [["A", "la revisión diaria es válida siempre que la oficina firme también cada contrato como refrendación.", "La Ley 87 de 1993 (art. 12, par.) prohíbe al jefe de control interno participar mediante autorizaciones o refrendaciones.", false], ["B", "la oficina solo puede revisar contratos cuando lo ordene la contraloría.", "La oficina puede evaluar la contratación en sus auditorías; lo que no debe hacer es asumir la ejecución diaria de controles.", false], ["C", "la tercera línea evalúa con independencia y no debe asumir tareas de la primera o la segunda.", "El Manual Operativo precisa que la tercera línea proporciona aseguramiento independiente sin asumir responsabilidades de la primera o segunda línea; ejecutar controles comprometería su objetividad.", true]]}]}, {"comp": "sistemas_gestion", "rol": "tecnico", "tag": "Sistemas de gestión (MIPG, control interno y calidad) · Niveles técnico, administrativo y operativo · Identificación y análisis del riesgo", "texto": "Usted es técnico de la Oficina de Planeación de una entidad territorial que aplica la Guía para la Gestión Integral del Riesgo en Entidades Públicas (versión 7) de la Función Pública. Apoya al líder del proceso de gestión documental en el mapa de riesgos. El préstamo de expedientes se realiza unas 300 veces al año. Uno de los riesgos quedó redactado así: «Posibilidad de afectación económica por pérdida de expedientes debido a la ausencia de registro y control en el préstamo documental». Si se materializa, la afectación económica estimada es de 120 SMLMV.", "items": [{"id": "SG-125", "niv": 2, "e": "En esa redacción, la causa raíz del riesgo es", "f": "Función Pública, Guía para la Gestión Integral del Riesgo en Entidades Públicas, versión 7 (2025), estructura para la redacción del riesgo", "o": [["A", "la falta de registro y control del préstamo.", "La guía propone redactar el riesgo con «Posibilidad de» + impacto + causa inmediata + causa raíz; la causa raíz es la razón de fondo, introducida aquí con «debido a».", true], ["B", "la pérdida de los expedientes prestados.", "Es la causa inmediata: la circunstancia visible que genera el impacto, pero no el origen de fondo del problema.", false], ["C", "la afectación económica que sufriría la entidad.", "Es el impacto, es decir, la consecuencia que se produciría si el riesgo se materializa.", false]]}, {"id": "SG-126", "niv": 2, "e": "Con la tabla de probabilidad de la guía, basada en la frecuencia de la actividad, la probabilidad inherente de este riesgo es", "f": "Función Pública, Guía para la Gestión Integral del Riesgo en Entidades Públicas, versión 7 (2025), tabla 4 (criterios para definir el nivel de probabilidad)", "o": [["A", "baja (40 %).", "La probabilidad baja corresponde a actividades que se ejecutan de 3 a 24 veces por año.", false], ["B", "media (60 %).", "La guía asigna probabilidad media (60 %) a las actividades que se ejecutan de 25 a 500 veces por año; el préstamo se hace unas 300 veces.", true], ["C", "alta (80 %).", "La probabilidad alta corresponde a actividades que se ejecutan más de 500 y hasta 5.000 veces por año.", false]]}, {"id": "SG-127", "niv": 2, "e": "Según la tabla de impacto económico de la guía, la afectación económica de 120 SMLMV corresponde al nivel", "f": "Función Pública, Guía para la Gestión Integral del Riesgo en Entidades Públicas, versión 7 (2025), tabla de criterios para definir el nivel de impacto", "o": [["A", "moderado (60 %).", "El nivel moderado corresponde a afectaciones mayores a 50 y hasta 100 SMLMV.", false], ["B", "mayor (80 %).", "La guía clasifica como impacto mayor (80 %) la afectación económica mayor a 100 y hasta 500 SMLMV; el riesgo está redactado como afectación económica.", true], ["C", "catastrófico (100 %).", "El nivel catastrófico corresponde a afectaciones mayores a 500 SMLMV.", false]]}]}, {"comp": "sistemas_gestion", "rol": "profesional", "tag": "Sistemas de gestión (MIPG, control interno y calidad) · Niveles profesional, asesor y ejecutivo · Valoración de controles y riesgo residual", "texto": "Usted es profesional de la segunda línea de defensa de una entidad nacional que aplica la versión 7 de la guía de riesgos de la Función Pública. Para el riesgo «Posibilidad de pérdida económica por pagos duplicados a proveedores debido a la falta de verificación de las facturas ya registradas», la probabilidad inherente es alta (80 %). Hay dos controles: el control 1, preventivo y manual (un auxiliar verifica en el sistema, antes de radicar cada factura, que no haya sido registrada), y el control 2, detectivo y automático (durante el trámite, el sistema financiero bloquea las facturas con número y NIT ya pagados). Ambos controles están documentados, se aplican siempre y dejan evidencia. Según la guía, los atributos de eficiencia pesan así: preventivo 25 %, detectivo 15 %, correctivo 10 %, automático 25 % y manual 15 %.", "items": [{"id": "SG-128", "niv": 2, "e": "La valoración del control 1 es", "f": "Función Pública, Guía para la Gestión Integral del Riesgo en Entidades Públicas, versión 7 (2025), tabla 6 (valoración de controles)", "o": [["A", "25 %.", "Solo toma el peso del tipo de control (preventivo) y omite el de la forma de implementación (manual).", false], ["B", "40 %.", "La valoración suma los atributos de eficiencia: tipo preventivo (25 %) más implementación manual (15 %) = 40 %.", true], ["C", "50 %.", "Suma preventivo (25 %) con automático (25 %); el control 1 lo ejecuta una persona, por lo que es manual (15 %).", false]]}, {"id": "SG-129", "niv": 3, "e": "Aplicados los dos controles en orden, la probabilidad residual del riesgo es", "f": "Función Pública, Guía para la Gestión Integral del Riesgo en Entidades Públicas, versión 7 (2025), tabla 8 (aplicación de controles para establecer el riesgo residual); cálculo verificado", "o": [["A", "16 %.", "Suma las dos valoraciones (40 % + 40 %) y las aplica de una sola vez. La guía aplica cada control sobre el valor que deja el anterior.", false], ["B", "28,8 %.", "Control 1: 80 % − (80 % × 40 %) = 48 %. Control 2 (detectivo 15 % + automático 25 % = 40 %): 48 % − (48 % × 40 %) = 28,8 %. Así calcula la guía la probabilidad residual.", true], ["C", "48 %.", "Solo aplica el control 1. El control 2, también detectivo, reduce la probabilidad sobre ese 48 %.", false]]}, {"id": "SG-130", "niv": 3, "e": "Si se agrega un control que, una vez hecho el pago duplicado, inicia de inmediato el cobro al proveedor para recuperar el dinero, ese control", "f": "Función Pública, Guía para la Gestión Integral del Riesgo en Entidades Públicas, versión 7 (2025), tipologías de controles y ejemplo de valoración del riesgo residual", "o": [["A", "es preventivo, porque evita que la pérdida sea definitiva, y disminuye la probabilidad.", "Preventivo es el que actúa antes de la actividad que origina el riesgo; este actúa después de hecho el pago.", false], ["B", "es detectivo, porque descubre el pago duplicado, y reduce por igual probabilidad e impacto.", "Detectivo es el que actúa durante el proceso; este opera tras la materialización para reparar el daño, lo que lo hace correctivo y le da efecto sobre el impacto.", false], ["C", "es correctivo y, según la guía, disminuye el impacto, no la probabilidad.", "El control correctivo se acciona después de materializado el riesgo; en la metodología de la guía, los preventivos y detectivos mueven la probabilidad y los correctivos mueven el impacto.", true]]}]}, {"comp": "sistemas_gestion", "rol": "general", "tag": "Sistemas de gestión (MIPG, control interno y calidad) · Riesgos para la integridad pública", "texto": "Usted es auxiliar administrativo de la Oficina de Planeación de una entidad del orden departamental y apoya la identificación de riesgos para la integridad pública con base en la guía de riesgos de la Función Pública. En las mesas de trabajo surgen tres situaciones posibles: un supervisor de contratos participa en la evaluación de una propuesta presentada por la empresa de su hermano; un funcionario de ventanilla recibe dinero de un ciudadano para adelantarle el turno de un trámite; y un servidor de almacén registra en el inventario bienes que nunca ingresaron, con el fin de quedarse con el dinero de la compra.", "items": [{"id": "SG-131", "niv": 1, "e": "La situación del supervisor de contratos corresponde a la tipología de", "f": "Función Pública, Guía para la Gestión Integral del Riesgo en Entidades Públicas, versión 7 (2025), tipologías de riesgos para la integridad pública; Ley 1952 de 2019 (conflicto de intereses)", "o": [["A", "inadecuada gestión del conflicto de intereses.", "La guía lo describe como decidir en un asunto en el que el servidor, o un pariente dentro de los grados que señala la ley, tiene un interés particular y directo; un hermano está en segundo grado de consanguinidad.", true], ["B", "soborno.", "No hay oferta ni aceptación de una ventaja para que el servidor actúe; hay un interés particular de un pariente en el asunto que decide.", false], ["C", "fraude interno.", "El fraude interno se refiere a errores, omisiones o informes inexactos hechos con culpa o dolo para beneficio propio o de terceros; aquí lo central es el interés del pariente.", false]]}, {"id": "SG-132", "niv": 1, "e": "La situación del funcionario de ventanilla corresponde a la tipología de", "f": "Función Pública, Guía para la Gestión Integral del Riesgo en Entidades Públicas, versión 7 (2025), tipologías de riesgos para la integridad pública (soborno)", "o": [["A", "soborno.", "La guía entiende el soborno como ofrecer, prometer, dar, aceptar o solicitar una ventaja indebida para que una persona actúe o se abstenga de actuar; el funcionario acepta dinero para alterar el turno.", true], ["B", "inadecuada gestión del conflicto de intereses.", "No hay un interés particular previo del servidor en el trámite; hay una ventaja indebida aceptada a cambio de una actuación.", false], ["C", "fraude interno.", "No se trata de registros o informes falseados por el servidor, sino de recibir un pago para favorecer a un ciudadano.", false]]}, {"id": "SG-133", "niv": 2, "e": "La situación del servidor de almacén corresponde a la tipología de", "f": "Función Pública, Guía para la Gestión Integral del Riesgo en Entidades Públicas, versión 7 (2025), tipologías de riesgos para la integridad pública (fraude interno)", "o": [["A", "soborno.", "No interviene un tercero que ofrezca una ventaja; el servidor falsea registros en su propio beneficio.", false], ["B", "inadecuada gestión del conflicto de intereses.", "No se trata de decidir un asunto en el que tenga interés particular, sino de alterar registros para apropiarse de recursos.", false], ["C", "fraude interno.", "La guía describe el fraude interno como errores, omisiones, informes inexactos o descripciones incorrectas hechos con culpa o dolo para beneficio personal o de terceros, como registrar bienes que no ingresaron.", true]]}]}, {"comp": "sistemas_gestion", "rol": "general", "tag": "Sistemas de gestión (MIPG, control interno y calidad) · Tipos de controles", "texto": "Usted es técnico de la oficina de control interno de una empresa social del Estado y revisa tres controles del proceso de nómina: (1) antes de cargar las novedades, la coordinadora de talento humano revisa que cada una tenga el acto administrativo que la soporta; (2) durante la liquidación, una vez calculados los valores, se genera un reporte de diferencias superiores al 10 % frente al mes anterior y los errores encontrados obligan a reliquidar; (3) cuando se detecta un pago en exceso ya realizado, la tesorería inicia el procedimiento de reintegro.", "items": [{"id": "SG-134", "niv": 1, "e": "Según la guía de riesgos de la Función Pública, el control (1) es", "f": "Función Pública, Guía para la Gestión Integral del Riesgo en Entidades Públicas, versión 7 (2025), tipologías de controles", "o": [["A", "preventivo y manual.", "Se acciona antes de la actividad que origina el riesgo (cargar novedades) y lo ejecuta una persona.", true], ["B", "detectivo y manual.", "El detectivo se acciona durante la ejecución del proceso; este control opera antes, en la entrada.", false], ["C", "preventivo y automático.", "Es preventivo, pero lo ejecuta una persona (la coordinadora), por lo que es manual; el automático lo ejecuta un sistema.", false]]}, {"id": "SG-135", "niv": 2, "e": "Por el momento en que se acciona, el control (2) es", "f": "Función Pública, Guía para la Gestión Integral del Riesgo en Entidades Públicas, versión 7 (2025), tipologías de controles", "o": [["A", "preventivo, porque opera antes de que se pague la nómina.", "No actúa antes de la actividad que origina el riesgo (la liquidación), sino durante ella, una vez calculados los valores.", false], ["B", "correctivo, porque genera un reporte de diferencias ya ocurridas.", "El correctivo se acciona después de materializado el riesgo (por ejemplo, con el pago ya hecho); aquí aún no se ha pagado.", false], ["C", "detectivo, porque actúa en plena liquidación, con los valores ya calculados.", "La guía define el control detectivo como el que se acciona durante la ejecución del proceso y detecta el riesgo, aunque genera reprocesos, como la reliquidación.", true]]}, {"id": "SG-136", "niv": 1, "e": "El control (3) es", "f": "Función Pública, Guía para la Gestión Integral del Riesgo en Entidades Públicas, versión 7 (2025), tipologías de controles", "o": [["A", "correctivo.", "La guía define el control correctivo como el que se acciona a la salida del proceso, después de materializado el riesgo; el reintegro busca reparar el daño.", true], ["B", "preventivo.", "Se acciona después de hecho el pago en exceso, no antes de la actividad que origina el riesgo.", false], ["C", "detectivo.", "No opera durante la ejecución del proceso, sino una vez materializado el riesgo.", false]]}]}, {"comp": "sistemas_gestion", "rol": "general", "tag": "Sistemas de gestión (MIPG, control interno y calidad) · ISO 9001: enfoque a procesos y ciclo PHVA", "texto": "Usted es técnico de una dependencia de una entidad pública que mantiene un sistema de gestión de la calidad basado en la norma ISO 9001:2015. Su equipo realiza cuatro actividades en el proceso de atención de quejas: definir los objetivos, recursos y riesgos del proceso para la vigencia; tramitar las quejas según el procedimiento; medir cada mes el tiempo de respuesta frente a la meta; y ajustar el procedimiento cuando los resultados no alcanzan la meta.", "items": [{"id": "SG-137", "niv": 1, "e": "En el ciclo PHVA, medir cada mes el tiempo de respuesta frente a la meta corresponde a", "f": "NTC ISO 9001:2015, numeral 0.3.2 (ciclo PHVA)", "o": [["A", "actuar.", "Actuar es tomar acciones para mejorar el desempeño a partir de lo verificado, como ajustar el procedimiento.", false], ["B", "hacer.", "Hacer es implementar lo planificado, es decir, tramitar las quejas; medir resultados frente a la meta es verificar.", false], ["C", "verificar.", "En el ciclo PHVA que describe la norma, verificar es hacer seguimiento y medir los procesos y resultados frente a objetivos y metas.", true]]}, {"id": "SG-138", "niv": 2, "e": "Ajustar el procedimiento cuando los resultados no alcanzan la meta corresponde a", "f": "NTC ISO 9001:2015, numeral 0.3.2 (ciclo PHVA)", "o": [["A", "verificar.", "Verificar es medir y comparar con la meta; la decisión de ajustar el procedimiento es la etapa siguiente.", false], ["B", "actuar.", "En el PHVA, actuar es tomar acciones para mejorar el desempeño según los resultados verificados.", true], ["C", "planificar.", "Planificar es establecer objetivos, recursos y riesgos antes de ejecutar; ajustar a partir de resultados medidos es actuar.", false]]}, {"id": "SG-139", "niv": 2, "e": "En la ISO 9001:2015, el pensamiento basado en riesgos", "f": "NTC ISO 9001:2015, numerales 0.3.3 y 6.1", "o": [["A", "se limita a tratar las no conformidades que ya se presentaron en los procesos.", "Tratar no conformidades ya ocurridas es la acción correctiva; el pensamiento basado en riesgos es anticipatorio.", false], ["B", "obliga a aplicar en todos los procesos una metodología formal y cuantitativa de gestión del riesgo.", "La ISO 9001:2015 exige abordar riesgos y oportunidades, pero no impone métodos formales de gestión del riesgo ni un proceso documentado específico.", false], ["C", "busca prevenir efectos no deseados, sin un requisito aparte de acción preventiva.", "La norma explica que el pensamiento basado en riesgos permite determinar los factores que podrían desviar los procesos y poner en marcha controles preventivos; por eso la acción preventiva dejó de ser un requisito independiente.", true]]}]}, {"comp": "sistemas_gestion", "rol": "general", "tag": "Sistemas de gestión (MIPG, control interno y calidad) · No conformidad, corrección y acción correctiva", "texto": "En una auditoría interna de calidad a una dependencia de una entidad pública certificada en ISO 9001:2015, se encontró que 14 respuestas a peticiones se enviaron sin el visto bueno del coordinador que exige el procedimiento. El coordinador ordenó revisar y reenviar de inmediato esas 14 respuestas. El análisis posterior mostró que el sistema de gestión documental permitía firmar y enviar una respuesta aunque el campo del visto bueno estuviera vacío.", "items": [{"id": "SG-140", "niv": 1, "e": "El hallazgo de la auditoría constituye", "f": "ISO 9000:2015, término 3.6.9 (no conformidad); NTC ISO 9001:2015, numeral 10.2", "o": [["A", "una no conformidad, porque se incumplió un requisito del procedimiento.", "En la terminología ISO 9000, una no conformidad es el incumplimiento de un requisito; el visto bueno es un requisito establecido por la propia entidad.", true], ["B", "una observación sin efectos, porque el incumplimiento no generó quejas de los usuarios.", "La no conformidad existe por el incumplimiento del requisito, aunque no haya causado quejas.", false], ["C", "una oportunidad de mejora, porque las respuestas salieron dentro del término legal.", "Cumplir el término no subsana el incumplimiento del requisito interno del visto bueno.", false]]}, {"id": "SG-141", "niv": 2, "e": "La revisión y el reenvío inmediato de las 14 respuestas es", "f": "ISO 9000:2015, términos 3.12.2 (acción correctiva) y 3.12.3 (corrección); NTC ISO 9001:2015, numeral 10.2", "o": [["A", "una acción preventiva, porque evita que los peticionarios presenten quejas.", "La acción preventiva actúa sobre no conformidades potenciales; aquí la no conformidad ya ocurrió y se está subsanando.", false], ["B", "una acción correctiva, porque resuelve el problema en las respuestas afectadas.", "La acción correctiva elimina la causa para evitar que se repita; reenviar las 14 respuestas no cambia el sistema que lo permitió.", false], ["C", "una corrección, porque elimina la no conformidad detectada sin atacar su causa.", "La ISO 9000 define la corrección como la acción para eliminar una no conformidad detectada, a diferencia de la acción correctiva, que elimina su causa.", true]]}, {"id": "SG-142", "niv": 3, "e": "Una acción correctiva adecuada para este caso es", "f": "NTC ISO 9001:2015, numeral 10.2.1; ISO 9000:2015, término 3.12.2", "o": [["A", "ajustar el sistema para que no permita enviar respuestas sin visto bueno y verificar luego su eficacia.", "La acción correctiva debe eliminar la causa de la no conformidad para evitar que vuelva a ocurrir, y la norma exige revisar su eficacia.", true], ["B", "capacitar de nuevo al coordinador en el procedimiento, porque el error fue suyo.", "El análisis atribuyó la causa al sistema, no al desconocimiento del coordinador; capacitarlo no la elimina.", false], ["C", "sancionar a los servidores que enviaron las 14 respuestas sin visto bueno.", "Una sanción no elimina la causa identificada (el sistema permitía enviar sin visto bueno), así que el error podría repetirse.", false]]}]}, {"comp": "sistemas_gestion", "rol": "profesional", "tag": "Sistemas de gestión (MIPG, control interno y calidad) · Niveles profesional, asesor y ejecutivo · Auditoría interna y revisión por la dirección", "texto": "Usted es profesional de la oficina de control interno de una entidad que mantiene un sistema de gestión de la calidad conforme a la ISO 9001:2015, y coordina el programa de auditorías internas de la vigencia. La líder del proceso de gestión contractual se ofrece como auditora de su propio proceso porque es quien mejor lo conoce. Al final del ciclo, el director pregunta qué uso se da a los resultados de las auditorías.", "items": [{"id": "SG-143", "niv": 3, "e": "Frente al ofrecimiento de la líder de gestión contractual, lo adecuado es", "f": "NTC ISO 9001:2015, numeral 9.2.2", "o": [["A", "aceptarlo, porque la norma exige que el auditor tenga experiencia directa en el proceso auditado.", "La norma no exige que el auditor haya trabajado en el proceso; exige asegurar la objetividad y la imparcialidad.", false], ["B", "no asignarla a su propio proceso, para proteger la objetividad e imparcialidad de la auditoría.", "El numeral 9.2.2 de la ISO 9001:2015 pide seleccionar los auditores y realizar las auditorías de forma que se asegure la objetividad y la imparcialidad del proceso de auditoría; auditar el propio trabajo las compromete.", true], ["C", "aceptarlo, siempre que el informe lo firme también el jefe de control interno.", "La firma de otra persona no elimina la falta de imparcialidad de quien audita su propio proceso.", false]]}, {"id": "SG-144", "niv": 2, "e": "Al director debe explicársele que los resultados de las auditorías internas", "f": "NTC ISO 9001:2015, numerales 9.2.2 y 9.3", "o": [["A", "se archivan como evidencia y solo se usan cuando un ente de control los solicita.", "La norma exige informar los resultados a la dirección pertinente y usarlos en la revisión por la dirección y la mejora.", false], ["B", "se envían a la entidad certificadora, que decide qué acciones correctivas debe tomar la entidad.", "Las acciones correctivas las determina la propia organización (numeral 10.2); el organismo certificador hace su auditoría externa.", false], ["C", "son una entrada de la revisión por la dirección sobre la eficacia del sistema.", "El numeral 9.3 de la norma incluye los resultados de las auditorías entre las entradas de la revisión por la dirección, cuyo fin es asegurar la conveniencia, adecuación, eficacia y alineación del sistema.", true]]}, {"id": "SG-145", "niv": 3, "e": "Al planificar el programa de auditoría, la norma exige tener en cuenta", "f": "NTC ISO 9001:2015, numeral 9.2.2, literal a", "o": [["A", "la relevancia de los procesos, los cambios y los hallazgos de auditorías previas.", "El numeral 9.2.2 a) pide que el programa considere la importancia de los procesos involucrados, los cambios que afectan a la organización y los resultados de las auditorías previas.", true], ["B", "que todos los procesos se auditen con la misma frecuencia y el mismo alcance.", "La norma no exige igual frecuencia; el programa se define según la importancia de los procesos, los cambios y los resultados previos.", false], ["C", "solo los procesos que tuvieron no conformidades en la auditoría externa anterior.", "La norma no limita el programa a esos procesos; pide considerar la importancia de los procesos, los cambios y los resultados de auditorías previas.", false]]}]}, {"comp": "sistemas_gestion", "rol": "general", "tag": "Sistemas de gestión (MIPG, control interno y calidad) · Nociones del SG-SST", "texto": "En una procuraduría provincial, un servidor nota que un cable eléctrico suelto atraviesa el pasillo del archivo. En la misma semana, durante una reunión, un compañero afirma que, si la entidad contrata con una empresa especializada la ejecución de actividades de seguridad y salud en el trabajo, la responsabilidad del sistema pasa a esa empresa. Otro pregunta en qué consiste el Sistema de Gestión de la Seguridad y Salud en el Trabajo (SG-SST).", "items": [{"id": "SG-146", "niv": 1, "e": "Frente al cable suelto, el servidor debe", "f": "Decreto 1072 de 2015, art. 2.2.4.6.10", "o": [["A", "esperar la inspección del comité paritario, que es el único facultado para reportar peligros.", "El reporte de peligros no es exclusivo del comité paritario; todos los trabajadores deben informarlos oportunamente.", false], ["B", "informar oportunamente el peligro al empleador.", "El artículo 2.2.4.6.10 del Decreto 1072 de 2015 incluye entre las responsabilidades de los trabajadores informar oportunamente al empleador sobre los peligros y riesgos latentes en su sitio de trabajo.", true], ["C", "retirar el cable por su cuenta, sin reportarlo, para no generar trámites.", "Manipular la instalación sin reportar puede generar nuevos riesgos y deja al empleador sin información para corregir la condición insegura.", false]]}, {"id": "SG-147", "niv": 3, "e": "Sobre lo que afirma el compañero, lo correcto es que", "f": "Decreto 1072 de 2015, arts. 2.2.4.6.4 y 2.2.4.6.42 (texto corregido por el Decreto 1528 de 2015, art. 2)", "o": [["A", "contratar esos servicios no traslada al contratista las responsabilidades del empleador.", "El artículo 2.2.4.6.42 del Decreto 1072 de 2015 dispone que esa contratación no implica el traslado de las responsabilidades del empleador al contratista.", true], ["B", "con el contrato, la empresa especializada asume la responsabilidad legal del sistema ante los trabajadores.", "El decreto dispone lo contrario: contratar los servicios no traslada las responsabilidades del empleador.", false], ["C", "la responsabilidad pasa a la administradora de riesgos laborales, que asesora a la entidad.", "La ARL brinda asesoría y asistencia técnica, pero el SG-SST debe ser liderado e implementado por el empleador.", false]]}, {"id": "SG-148", "niv": 2, "e": "Según el Decreto 1072 de 2015, el SG-SST es un proceso por etapas", "f": "Decreto 1072 de 2015, art. 2.2.4.6.4", "o": [["A", "que se actualiza solo cuando ocurre un accidente de trabajo en la entidad.", "El sistema se basa en la mejora continua y en la prevención, no solo en la reacción ante accidentes.", false], ["B", "a cargo exclusivo de la ARL, que lo diseña e implementa en cada empresa afiliada.", "El SG-SST lo lidera e implementa el empleador; la ARL asesora.", false], ["C", "liderado por el empleador, con participación de los trabajadores y ciclo PHVA.", "El artículo 2.2.4.6.4 lo define como un proceso lógico y por etapas basado en la mejora continua, liderado e implementado por el empleador con participación de los trabajadores, con principios del ciclo PHVA.", true]]}]}, {"comp": "sistemas_gestion", "rol": "tecnico", "tag": "Sistemas de gestión (MIPG, control interno y calidad) · Niveles técnico, administrativo y operativo · Seguridad de la información: confidencialidad, integridad y disponibilidad", "texto": "Usted es técnico de la Oficina de Planeación de una entidad nacional que identifica riesgos de seguridad de la información con la guía de riesgos de la Función Pública, cuyo capítulo correspondiente clasifica estos riesgos como pérdida de confidencialidad, de integridad o de disponibilidad. Se analizan dos eventos: (1) un servidor envía por error a un ciudadano un expediente con datos personales de terceros; (2) el servidor de archivos queda fuera de servicio dos días y nadie puede consultar los documentos. Además, la entidad estudia adquirir una póliza que cubra las pérdidas por incidentes cibernéticos.", "items": [{"id": "SG-149", "niv": 1, "e": "El evento (1) corresponde a una pérdida de", "f": "Función Pública, Guía para la Gestión Integral del Riesgo en Entidades Públicas, versión 7 (2025), capítulo de riesgos de seguridad de la información (tipo de riesgo)", "o": [["A", "disponibilidad.", "La disponibilidad se afecta cuando los autorizados no pueden acceder a la información; aquí el problema es el acceso de un tercero no autorizado.", false], ["B", "confidencialidad.", "La información llegó a una persona no autorizada para conocerla; eso afecta la confidencialidad.", true], ["C", "integridad.", "La integridad se pierde cuando la información se altera sin autorización; aquí el expediente no se modificó.", false]]}, {"id": "SG-150", "niv": 1, "e": "El evento (2) corresponde a una pérdida de", "f": "Función Pública, Guía para la Gestión Integral del Riesgo en Entidades Públicas, versión 7 (2025), capítulo de riesgos de seguridad de la información (tipo de riesgo)", "o": [["A", "disponibilidad.", "La disponibilidad implica que la información sea accesible para los autorizados cuando la requieren; la caída del servidor la impidió durante dos días.", true], ["B", "confidencialidad.", "Nadie no autorizado accedió a la información; el problema es que los autorizados no pudieron consultarla.", false], ["C", "integridad.", "Los documentos no fueron alterados; simplemente no estuvieron accesibles.", false]]}, {"id": "SG-151", "niv": 2, "e": "La adquisición de la póliza contra incidentes cibernéticos corresponde a la opción de tratamiento de", "f": "Función Pública, Guía para la Gestión Integral del Riesgo en Entidades Públicas, versión 7 (2025), opciones de tratamiento (riesgos de seguridad de la información)", "o": [["A", "evitar el riesgo.", "Evitar implica eliminar la fuente del riesgo (por ejemplo, dar de baja un servidor); la póliza no elimina la amenaza.", false], ["B", "aceptar el riesgo.", "Aceptar es asumir el riesgo sin acciones adicionales cuando está por debajo del apetito definido; contratar una póliza es una medida de tratamiento.", false], ["C", "compartir el riesgo.", "La guía describe compartir como trasladar parte de las consecuencias de la materialización, por ejemplo con la adquisición de una ciberpóliza.", true]]}]}, {"comp": "sistemas_gestion", "rol": "general", "tag": "Sistemas de gestión (MIPG, control interno y calidad) · Articulación del Sistema de Gestión y MECI", "texto": "Usted es profesional universitario de la Oficina de Planeación de la Procuraduría y participa en una mesa de estudio sobre la articulación de los sistemas de gestión en el sector público. Para preparar su intervención, revisa el Decreto 1083 de 2015, modificado por el Decreto 1499 de 2017, y el Manual Operativo del MIPG de la Función Pública.", "items": [{"id": "SG-152", "niv": 2, "e": "Según el decreto, dentro del MIPG el control interno", "f": "Decreto 1083 de 2015, art. 2.2.23.1", "o": [["A", "es una política independiente que se activa cuando la oficina de control interno inicia una auditoría.", "El control interno es permanente y transversal; no depende de que se inicie una auditoría.", false], ["B", "atraviesa toda la gestión de la entidad y se pone en marcha mediante el MECI.", "El artículo 2.2.23.1 dispone que el control interno es transversal a la gestión y desempeño de las entidades y se implementa a través del Modelo Estándar de Control Interno (MECI).", true], ["C", "reemplaza al Sistema de Gestión en las entidades obligadas por la Ley 87 de 1993.", "El decreto articula el Sistema de Control Interno con el Sistema de Gestión; no lo sustituye.", false]]}, {"id": "SG-153", "niv": 2, "e": "El decreto dispone que el Sistema de Gestión se complementa y articula, entre otros, con", "f": "Decreto 1083 de 2015, art. 2.2.22.1.5", "o": [["A", "el sistema de responsabilidad fiscal que adelantan la Contraloría General y las territoriales.", "El artículo 2.2.22.1.5 no menciona la responsabilidad fiscal entre los sistemas con los que se articula.", false], ["B", "los sistemas de seguridad y salud en el trabajo, gestión ambiental y seguridad de la información.", "El artículo 2.2.22.1.5 menciona los sistemas nacional de servicio al ciudadano, de gestión de la seguridad y salud en el trabajo, de gestión ambiental y de seguridad de la información.", true], ["C", "el régimen disciplinario que aplican las oficinas de control interno disciplinario de cada entidad.", "El régimen disciplinario no figura entre los sistemas con los que el decreto articula el Sistema de Gestión.", false]]}, {"id": "SG-154", "niv": 3, "e": "El Sistema de Gestión creado por el artículo 133 de la Ley 1753 de 2015 integró en uno solo", "f": "Decreto 1083 de 2015, arts. 2.2.22.1.1 y 2.2.23.2; Ley 1753 de 2015, art. 133", "o": [["A", "los sistemas de Desarrollo Administrativo y de Gestión de la Calidad, articulados con el de Control Interno.", "El artículo 2.2.22.1.1 y los considerandos del Decreto 1499 de 2017 señalan que el Sistema de Gestión integra los sistemas de Desarrollo Administrativo y de Gestión de la Calidad, y que se articula con el Sistema de Control Interno.", true], ["B", "los sistemas de Control Interno y de Gestión de la Calidad, y reemplazó la Ley 87 de 1993.", "La Ley 87 de 1993 sigue vigente; el Sistema de Control Interno no se integró, sino que se articula con el Sistema de Gestión.", false], ["C", "los sistemas de Desarrollo Administrativo y de Control Interno, y suprimió el MECI.", "El MECI no se suprimió: se actualiza a través del Manual Operativo del MIPG (art. 2.2.23.2).", false]]}, {"id": "SG-155", "niv": 2, "e": "En el MECI, el componente que busca asegurar las condiciones mínimas para el ejercicio del control interno, con el compromiso de la alta dirección y del comité de coordinación de control interno, es", "f": "Función Pública, Manual Operativo del MIPG, versión 7 (2026), política de control interno (componentes del MECI)", "o": [["A", "la evaluación del riesgo.", "Ese componente se ocupa de identificar y valorar los riesgos, no de las condiciones básicas de compromiso y liderazgo.", false], ["B", "las actividades de monitoreo.", "Ese componente se refiere a la supervisión continua y a las evaluaciones periódicas (autoevaluación y auditorías).", false], ["C", "el ambiente de control.", "El Manual Operativo del MIPG indica que la entidad debe asegurar un ambiente de control que le permita disponer de las condiciones mínimas para el ejercicio del control interno, con el liderazgo de la alta dirección y del comité.", true]]}]}, {"comp": "disciplinario", "rol": "general", "tag": "Código General Disciplinario · Legalidad, favorabilidad y cosa juzgada", "texto": "Usted es profesional universitario de la oficina de control disciplinario interno de una gobernación y revisa tres asuntos. Primero: en febrero de 2025 un auxiliar realizó una conducta que en ese momento no estaba descrita como falta en ninguna ley; una ley expedida en 2026 la describió expresamente como falta disciplinaria. Segundo: una técnica cumple desde hace dos meses una sanción de suspensión impuesta en fallo ejecutoriado, y una ley posterior redujo el máximo de esa sanción para su falta a un término inferior al que se le impuso. Tercero: un conductor fue absuelto en 2025, mediante fallo ejecutoriado, por haber usado el vehículo oficial en un viaje personal; ahora llega una nueva queja por el mismo viaje, que el quejoso denomina «uso indebido de bienes del Estado».", "items": [{"id": "DI-101", "niv": 1, "e": "Respecto de la conducta del auxiliar, lo procedente es concluir que", "f": "Ley 1952 de 2019, art. 4", "o": [["A", "no puede ser investigado ni sancionado por ella, porque no estaba descrita como falta en la ley vigente cuando la realizó.", "Por el principio de legalidad, los destinatarios del código solo pueden ser investigados y sancionados por comportamientos descritos como falta en la ley vigente al momento de su realización (Ley 1952 de 2019, art. 4).", true], ["B", "puede ser investigado con la ley de 2026, porque las normas disciplinarias tienen efecto general inmediato.", "El efecto inmediato no permite aplicar hacia atrás una descripción de falta: la preexistencia de la falta es exigencia del principio de legalidad (art. 4 de la Ley 1952 de 2019).", false], ["C", "puede ser investigado, pero la sanción debe reducirse a la mitad por tratarse de una falta creada después.", "No existe esa rebaja. Si la conducta no era falta cuando se realizó, no hay lugar a investigación ni a sanción alguna (art. 4 de la Ley 1952 de 2019).", false]]}, {"id": "DI-102", "niv": 2, "e": "Si la técnica pide que se le aplique la nueva ley, usted debe responderle que", "f": "Ley 1952 de 2019, art. 8", "o": [["A", "solo podría obtener ese efecto si solicita la revocatoria directa del fallo dentro de los cuatro meses siguientes.", "La aplicación de la ley favorable no depende de la revocatoria directa; el artículo 8 la extiende directamente a quien cumple la sanción. Además, el plazo de cuatro meses del artículo 141 es para quejosos y víctimas.", false], ["B", "la ley posterior más favorable se aplica también a quien está cumpliendo la sanción.", "La ley permisiva o favorable, aun posterior, se aplica de preferencia a la desfavorable, y este principio rige también para quien esté cumpliendo la sanción, salvo lo dispuesto en la Constitución (Ley 1952 de 2019, art. 8).", true], ["C", "la favorabilidad solo opera en los procesos en curso y no cuando el fallo ya está ejecutoriado.", "El código dispone expresamente lo contrario: el principio de favorabilidad rige también para quien esté cumpliendo la sanción (art. 8 de la Ley 1952 de 2019).", false]]}, {"id": "DI-103", "niv": 2, "e": "Frente a la nueva queja contra el conductor, la oficina debe tener en cuenta que", "f": "Ley 1952 de 2019, art. 16", "o": [["A", "puede abrir una nueva investigación, porque la queja describe una falta con una denominación diferente.", "El cambio de nombre de la falta no habilita un nuevo proceso: la cosa juzgada impide investigar de nuevo el mismo hecho aun cuando se le dé una denominación distinta (art. 16 de la Ley 1952 de 2019).", false], ["B", "puede abrir una nueva investigación si quien presenta la queja es una persona distinta del primer quejoso.", "La identidad que importa es la del disciplinado y el hecho, no la del quejoso. Decidido el asunto por fallo ejecutoriado, no hay nueva investigación por el mismo hecho (art. 16).", false], ["C", "no puede someterlo a nueva investigación por el mismo hecho, aunque se le dé una denominación distinta.", "Por la cosa juzgada disciplinaria, quien fue juzgado mediante fallo ejecutoriado no puede ser sometido a nueva investigación y juzgamiento por el mismo hecho, aun cuando se le dé una denominación distinta (Ley 1952 de 2019, art. 16). Como el fallo es absolutorio y no versa sobre DIDH ni DIH, tampoco cabe su revocatoria directa (art. 141).", true]]}]}, {"comp": "disciplinario", "rol": "general", "tag": "Código General Disciplinario · Ilicitud sustancial, culpabilidad y presunción de inocencia", "texto": "Usted es profesional de la oficina de control disciplinario interno de una alcaldía distrital. Un jefe de dependencia le remite tres informes. En el primero, una auxiliar archivó un oficio en la carpeta equivocada, lo advirtió ella misma una hora después y lo corrigió, sin que se retrasara ningún trámite ni resultara afectado nadie. En el segundo, se perdió un computador portátil del almacén y el jefe pide sancionar a la coordinadora únicamente porque es la responsable del área, aunque no se sabe quién retiró el equipo. En el tercero, que ya está en investigación, las pruebas sobre quién alteró la fecha de un acta son contradictorias y, practicadas todas las pruebas posibles, no se ha podido establecer si fue el técnico investigado u otra persona.", "items": [{"id": "DI-104", "niv": 2, "e": "Para establecer si la conducta de la auxiliar del primer informe es disciplinariamente ilícita, debe tenerse en cuenta que", "f": "Ley 1952 de 2019, art. 9 (modificado por la Ley 2094 de 2021, art. 2)", "o": [["A", "solo lo es si con ella causó un daño patrimonial cuantificable a la entidad.", "El código no exige daño patrimonial para que haya falta; el criterio es la afectación sustancial del deber funcional (art. 9). El perjuicio causado solo es uno de los criterios de gravedad del artículo 47.", false], ["B", "basta con que se haya apartado del procedimiento interno, aunque luego lo corrigiera.", "La sola infracción formal no basta. La Ley 2094 de 2021 definió la ilicitud sustancial como la afectación sustancial del deber funcional sin justificación (art. 9 de la Ley 1952 de 2019).", false], ["C", "solo lo es si compromete sustancialmente su deber funcional, sin justificación.", "El artículo 9 de la Ley 1952 de 2019, modificado por el artículo 2 de la Ley 2094 de 2021, dispone que la conducta del disciplinable es ilícita cuando afecta sustancialmente el deber funcional sin justificación alguna.", true]]}, {"id": "DI-105", "niv": 3, "e": "Si el jefe inmediato considera que el hecho del primer informe contrarió en menor grado el orden administrativo de la dependencia, sin afectar sustancialmente los deberes funcionales, debe", "f": "Ley 1952 de 2019, art. 68", "o": [["A", "tomar los correctivos del caso sin trámite procesal formal, los cuales no quedan como antecedente disciplinario.", "Por la preservación del orden interno, ante hechos que contrarían en menor grado el orden administrativo sin afectar sustancialmente los deberes funcionales, el jefe inmediato adopta las medidas correctivas pertinentes sin formalismo procesal, y estas no generan antecedente disciplinario (Ley 1952 de 2019, art. 68).", true], ["B", "abrir indagación previa, porque toda irregularidad debe tramitarse por el procedimiento disciplinario.", "El artículo 68 prevé un tratamiento sin formalismo procesal para estos hechos menores, y la indagación previa procede solo ante duda sobre la identificación del autor (art. 208); aquí la autora está identificada.", false], ["C", "imponer directamente una amonestación escrita y ordenar su anotación en la hoja de vida.", "La amonestación escrita es una sanción disciplinaria que solo se impone mediante fallo, al cabo del proceso (arts. 48 y 49). Las medidas del artículo 68 no son sanciones ni generan antecedente.", false]]}, {"id": "DI-106", "niv": 1, "e": "La solicitud de sancionar a la coordinadora por la pérdida del portátil, solo por ser la responsable del área, es improcedente porque", "f": "Ley 1952 de 2019, art. 10", "o": [["A", "los coordinadores de área no son destinatarios de la ley disciplinaria.", "Todos los servidores públicos son destinatarios de la ley disciplinaria, aun retirados del servicio (art. 25 de la Ley 1952 de 2019).", false], ["B", "en materia disciplinaria está proscrita la responsabilidad objetiva y se exige dolo o culpa.", "Solo puede sancionarse por conductas realizadas con culpabilidad, a título de dolo o culpa; queda proscrita toda forma de responsabilidad objetiva (Ley 1952 de 2019, art. 10). Ser jefe del área no prueba por sí solo la culpabilidad.", true], ["C", "la pérdida de bienes del Estado solo genera responsabilidad fiscal, nunca disciplinaria, para quien los tiene a cargo.", "La pérdida o daño de bienes del Estado puede constituir falta disciplinaria (por ejemplo, art. 62, num. 1, de la Ley 1952 de 2019); lo que impide sancionar aquí es la ausencia de prueba de culpabilidad.", false]]}, {"id": "DI-107", "niv": 2, "e": "En el expediente del acta alterada, agotada la práctica de pruebas, lo procedente es", "f": "Ley 1952 de 2019, arts. 14, 147 y 160", "o": [["A", "mantener abierta la actuación hasta que el técnico demuestre que no fue él quien alteró el acta.", "Invierte la carga de la prueba, que corresponde al Estado (art. 147 de la Ley 1952 de 2019), y desconoce la presunción de inocencia (art. 14).", false], ["B", "resolver la duda razonable a favor del técnico, porque para sancionar se requiere certeza sobre la falta y la responsabilidad.", "El disciplinable se presume inocente y toda duda razonable se resuelve a su favor (art. 14 de la Ley 1952 de 2019), y no puede proferirse fallo sancionatorio sin prueba que conduzca a la certeza sobre la falta y la responsabilidad (art. 160).", true], ["C", "sancionar al técnico a título de culpa, porque la duda solo permite descartar el dolo.", "La duda recae sobre la autoría misma, no sobre la modalidad de la culpabilidad. Sin certeza sobre la falta y la responsabilidad no puede proferirse fallo sancionatorio (arts. 14 y 160).", false]]}]}, {"comp": "disciplinario", "rol": "general", "tag": "Código General Disciplinario · Destinatarios de la ley disciplinaria", "texto": "Usted es profesional universitario de una procuraduría provincial y recibe tres quejas. La primera es contra el interventor externo, una persona natural contratada por un municipio para vigilar la construcción de un puente, a quien se acusa de certificar avances de obra inexistentes. La segunda es contra un operario de una empresa privada de aseo que presta el servicio en el municipio, por maltratar a un usuario durante la recolección; la empresa no ejerce funciones públicas ni administra recursos públicos. La tercera es contra un exsecretario de obras que renunció hace seis meses, por hechos ocurridos en 2025, cuando ejercía el cargo.", "items": [{"id": "DI-108", "niv": 1, "e": "Sobre el interventor externo, es correcto afirmar que", "f": "Ley 1952 de 2019, arts. 69 y 70", "o": [["A", "no es disciplinable, porque su vínculo con el municipio es contractual y solo responde civil, fiscal y penalmente.", "El artículo 70 de la Ley 1952 de 2019 incluye expresamente a los particulares que cumplen labores de interventoría en contratos estatales, cualquiera que sea su vínculo.", false], ["B", "es disciplinable como servidor público, porque recibe honorarios pagados por el municipio.", "Recibir honorarios no lo convierte en servidor público; responde como particular disciplinable bajo el régimen especial de los artículos 69 y siguientes de la Ley 1952 de 2019.", false], ["C", "es disciplinable como particular, porque cumple labores de interventoría en un contrato estatal.", "El régimen disciplinario de los particulares se aplica, entre otros, a quienes cumplen labores de interventoría o supervisión en los contratos estatales (Ley 1952 de 2019, art. 70).", true]]}, {"id": "DI-109", "niv": 3, "e": "En relación con la queja contra el operario de la empresa privada de aseo, debe concluirse que", "f": "Ley 1952 de 2019, art. 70", "o": [["A", "no es sujeto disciplinable, porque prestar un servicio público sin ejercer funciones públicas no lo hace destinatario del código.", "No son disciplinables los particulares que prestan servicios públicos, salvo que en ejercicio de esas actividades desempeñen funciones públicas (Ley 1952 de 2019, art. 70, inciso 3). La empresa no ejerce funciones públicas.", true], ["B", "es disciplinable como particular, porque presta un servicio público domiciliario a la comunidad.", "El artículo 70 de la Ley 1952 de 2019 excluye a los particulares que presten servicios públicos, salvo que en esa actividad desempeñen funciones públicas, lo que el caso descarta.", false], ["C", "debe remitirse a control disciplinario interno de la alcaldía, competente frente a los contratistas del municipio.", "Las oficinas de control disciplinario interno conocen de los asuntos contra los servidores de su propia entidad (art. 2 de la Ley 1952 de 2019); además, el operario no es sujeto disciplinable.", false]]}, {"id": "DI-110", "niv": 1, "e": "Frente al exsecretario de obras, la acción disciplinaria", "f": "Ley 1952 de 2019, arts. 25, 32 y 89", "o": [["A", "procede, porque los servidores públicos siguen siendo destinatarios de la ley disciplinaria aunque se retiren.", "Son destinatarios de la ley disciplinaria los servidores públicos aunque se encuentren retirados del servicio, y la acción procede aunque ya no ejerzan funciones públicas (Ley 1952 de 2019, arts. 25 y 89).", true], ["B", "solo procede si vuelve a ocupar un cargo público antes de que se profiera el fallo.", "El artículo 89 de la Ley 1952 de 2019 no impone esa condición; si la sanción no puede cumplirse por el retiro, se registra en la Procuraduría y en la hoja de vida.", false], ["C", "no procede, porque la renuncia aceptada por la administración extingue la acción disciplinaria en curso o por iniciar.", "La renuncia no es causal de extinción de la acción; estas son la muerte del disciplinable, la caducidad y la prescripción (art. 32 de la Ley 1952 de 2019).", false]]}, {"id": "DI-111", "niv": 3, "e": "Si el interventor resultara responsable de una falta gravísima que no implicó detrimento del patrimonio público, la sanción principal que le corresponde como particular es", "f": "Ley 1952 de 2019, arts. 72 y 73", "o": [["A", "destitución e inhabilidad general de diez a veinte años.", "La destitución es la sanción del particular solo cuando la prestación del servicio es permanente y su vinculación proviene de nombramiento oficial (art. 73 de la Ley 1952 de 2019); el interventor es contratista.", false], ["B", "suspensión de la ejecución del contrato de uno a doce meses e inhabilidad especial.", "Esa sanción no existe en el régimen de los particulares. El artículo 73 de la Ley 1952 de 2019 prevé multa e inhabilidad concurrente.", false], ["C", "una multa entre 10 y 100 salarios mínimos mensuales, junto con una inhabilidad de entre uno y veinte años.", "Los particulares destinatarios de la ley disciplinaria se sancionan con multa de 10 a 100 salarios mínimos mensuales legales vigentes al momento del hecho y, concurrentemente, inhabilidad de uno a veinte años para ejercer empleo o función pública, prestar servicios al Estado o contratar con él (Ley 1952 de 2019, art. 73).", true]]}]}, {"comp": "disciplinario", "rol": "general", "tag": "Código General Disciplinario · Dolo y culpa", "texto": "Usted es técnico de la oficina de control disciplinario interno de una empresa social del Estado y apoya la proyección de autos en tres expedientes originados en un mismo proceso de contratación. En el primero, las pruebas muestran que un profesional sabía que el oferente al que favoreció no cumplía los requisitos, sabía que favorecerlo estaba prohibido y quiso que ganara. En el segundo, una técnica omitió verificar la póliza del contratista, verificación que el manual de contratación le impone de manera expresa en todos los casos. En el tercero, la funcionaria instructora concluyó que el auxiliar investigado actuó únicamente con culpa leve.", "items": [{"id": "DI-112", "niv": 1, "e": "La conducta del profesional del primer expediente debe calificarse como", "f": "Ley 1952 de 2019, arts. 28 y 29", "o": [["A", "culposa con culpa grave, porque no tuvo el cuidado que cualquier persona del común imprime a sus actos.", "Esa es la definición de culpa grave (art. 29), que no corresponde a quien actúa sabiendo la ilicitud y queriendo el resultado (art. 28).", false], ["B", "dolosa, porque conocía los hechos constitutivos de falta y su ilicitud, y quiso su realización.", "La conducta es dolosa cuando el sujeto disciplinable conoce los hechos constitutivos de falta disciplinaria, su ilicitud y quiere su realización (Ley 1952 de 2019, art. 28). Los tres elementos están probados.", true], ["C", "culposa con culpa gravísima, porque violó de manera manifiesta una regla de obligatorio cumplimiento.", "La culpa supone que el sujeto no quiso el resultado. Aquí se probó conocimiento y voluntad de favorecer al oferente, que es dolo (arts. 28 y 29 de la Ley 1952 de 2019).", false]]}, {"id": "DI-113", "niv": 2, "e": "Para atribuir a la técnica del segundo expediente la falta a título de culpa gravísima, debe probarse que incurrió en ella por", "f": "Ley 1952 de 2019, art. 29 (modificado por la Ley 2094 de 2021, art. 4)", "o": [["A", "conocimiento de los hechos y de su ilicitud, unido a la voluntad de realizarlos.", "Esos elementos definen el dolo (art. 28 de la Ley 1952 de 2019), no una modalidad
