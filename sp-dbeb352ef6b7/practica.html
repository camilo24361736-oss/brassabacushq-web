 autos de trámite sencillos, como hacen en la otra provincial, para ganar tiempo.", "Se aparta de la pauta fijada por el jefe de su dependencia. La práctica de otra oficina no reemplaza las directrices que rigen la propia dependencia.", false], ["C", "seguir la pauta del procurador provincial y pasar cada proyecto al profesional antes de la firma.", "El nivel C de Cumplimiento de parámetros de trabajo consiste en aplicar directrices para conseguir los objetivos de la dependencia; una de sus conductas es seguir las pautas definidas por el jefe inmediato.", true]]}, {"id": "CO-129", "niv": 2, "e": "Ante la plantilla que cita una norma derogada, lo coherente con el nivel C de Cumplimiento de parámetros de trabajo es", "f": "Diccionario de Competencias Comportamentales PGN, Cumplimiento de parámetros de trabajo, nivel C", "o": [["A", "dejar el proyecto en espera hasta que el jefe actualice la plantilla oficial de la dependencia.", "Detiene el trámite sin necesidad. La norma vigente se puede aplicar de inmediato, que es lo que pide acatar las normas que rigen la dependencia.", false], ["B", "aplicar la norma vigente en el auto e informar a su jefe para que la plantilla se corrija.", "El nivel C de Cumplimiento de parámetros de trabajo incluye acatar las normas que rigen el quehacer de la dependencia y seguir las pautas del jefe inmediato; informar al jefe respeta su papel en la definición de la plantilla.", true], ["C", "usar la plantilla tal como está, porque es la que aprobó el jefe de la dependencia.", "Seguir la pauta del jefe no justifica aplicar una norma derogada. El nivel C incluye acatar las normas y la reglamentación que rigen el quehacer de la dependencia.", false]]}, {"id": "CO-130", "niv": 3, "e": "Si el empleo exigiera el nivel B de Cumplimiento de parámetros de trabajo, en lugar del C, la diferencia sería que el servidor", "f": "Diccionario de Competencias Comportamentales PGN, Cumplimiento de parámetros de trabajo, nivel B", "o": [["A", "cumple las normas fijadas para sus actividades y vigila con herramientas de control la calidad de las tareas del equipo.", "Describe el nivel B de Orientación al orden, la calidad y la exactitud (cumplir las normas de sus actividades e implementar herramientas de control de las tareas del equipo), no el de Cumplimiento de parámetros de trabajo.", false], ["B", "sigue los lineamientos en distintos procesos organizacionales y define objetivos para su equipo alineados con los procedimientos.", "El nivel B de Cumplimiento de parámetros de trabajo (aplicar criterios para desempeñarse dentro de procesos organizacionales) incluye seguir reglas y lineamientos en diferentes procesos y definir objetivos del equipo alineados con procedimientos definidos.", true], ["C", "acata las normas de su dependencia y sigue las pautas de su jefe inmediato.", "Estas son las conductas del nivel C, el que ya exige el empleo.", false]]}]}, {"comp": "comportamental", "rol": "profesional", "tag": "Competencias comportamentales (Diccionario de la Procuraduría) · Niveles profesional, asesor y ejecutivo · Pensamiento conceptual", "texto": "Usted es asesor de la Oficina Jurídica de la Procuraduría y su empleo exige Pensamiento conceptual en nivel A. Desde la entrada en vigencia de la Ley 2094 de 2021, que reformó el Código General Disciplinario y separó las funciones de instrucción y juzgamiento, varias procuradurías regionales aplican criterios distintos sobre el momento en que un expediente debe pasar de la etapa de instrucción a la de juzgamiento. Las consultas llegan a la oficina casi a diario. El jefe le pide preparar una directriz que aclare el asunto y presentarla después en una reunión con los procuradores regionales. En el equipo hay un profesional cuyo empleo exige el nivel B de la misma competencia.", "items": [{"id": "CO-131", "niv": 3, "e": "Frente a las interpretaciones contradictorias, lo que mejor refleja el nivel A de Pensamiento conceptual es", "f": "Diccionario de Competencias Comportamentales PGN, Pensamiento conceptual, nivel A", "o": [["A", "compilar la jurisprudencia y la doctrina sobre el tema en un documento de consulta para todas las procuradurías regionales.", "Buscar y reunir información se relaciona con Investigación o Gestión de la información; no explica el problema ni formula directrices, como pide el nivel A.", false], ["B", "emitir un concepto sobre cada consulta de las regionales a medida que lleguen a la oficina.", "Realizar conceptos que aclaran situaciones concretas es una conducta de los niveles B y C. El nivel A atiende el problema de fondo formulando directrices.", false], ["C", "identificar los elementos que originan las interpretaciones y proponer una directriz que unifique el criterio.", "El nivel A de Pensamiento conceptual consiste en explicar problemas de alta complejidad y formular directrices para atenderlos, entendiendo el problema a partir de los elementos que lo conforman.", true]]}, {"id": "CO-132", "niv": 1, "e": "Al presentar la directriz en la reunión con los procuradores regionales, lo coherente con el nivel A de Pensamiento conceptual es", "f": "Diccionario de Competencias Comportamentales PGN, Pensamiento conceptual, nivel A", "o": [["A", "presentar con claridad y precisión los elementos del problema y el criterio que deben aplicar.", "El nivel A de Pensamiento conceptual incluye explicar problemas complejos y generar lineamientos claros y precisos que permitan entender situaciones o problemas específicos.", true], ["B", "exponer en detalle la evolución jurisprudencial del tema, para que cada procurador saque sus conclusiones.", "Deja la conclusión en manos de cada procurador y no aporta los lineamientos claros que exige el nivel A.", false], ["C", "entregar el texto completo de la directriz y resolver dudas solo si los asistentes las formulan.", "No hace el esfuerzo de explicar el problema; el nivel A pide aclarar las situaciones y generar lineamientos que permitan entenderlas.", false]]}, {"id": "CO-133", "niv": 3, "e": "Para el profesional del equipo, cuyo empleo exige el nivel B de Pensamiento conceptual, la tarea que corresponde a su nivel es", "f": "Diccionario de Competencias Comportamentales PGN, Pensamiento conceptual, nivel B", "o": [["A", "separar el problema en sus componentes y proponer soluciones medibles para cada uno.", "Desagregar un problema en sus componentes y proponer soluciones medibles y cuantificables es el nivel B de Pensamiento analítico, otra competencia; el nivel B de Pensamiento conceptual pide conceptuar para aclarar la situación.", false], ["B", "formular la directriz que se enviará a todas las procuradurías regionales para unificar el criterio.", "Formular directrices para atender problemas de alta complejidad es la conducta del nivel A, que corresponde al asesor.", false], ["C", "contrastar expedientes de las regionales con la jurisprudencia y aclarar en un concepto una situación de elementos diversos.", "El nivel B de Pensamiento conceptual consiste en conceptuar sobre situaciones formadas por elementos heterogéneos, con análisis técnico de información primaria (los expedientes) y secundaria (la jurisprudencia).", true]]}]}, {"comp": "comportamental", "rol": "profesional", "tag": "Competencias comportamentales (Diccionario de la Procuraduría) · Niveles profesional, asesor y ejecutivo · Orientación a resultados", "texto": "Usted es asesor del despacho de una procuraduría regional de instrucción y su empleo exige Orientación a resultados en nivel A. El plan de acción fijó como meta anual cerrar 300 procesos disciplinarios con más de tres años de antigüedad. En junio la meta ya está cumplida. Al mismo tiempo, la regional enfrenta la falta de dos notificadores, lo que retrasa varias etapas. En el despacho trabajan un profesional cuyo empleo exige el nivel B de la misma competencia y un técnico con nivel D.", "items": [{"id": "CO-134", "niv": 3, "e": "Con la meta de procesos antiguos cumplida en junio, lo que refleja el nivel A de Orientación a resultados es", "f": "Diccionario de Competencias Comportamentales PGN, Orientación a resultados, nivel A", "o": [["A", "mantener el ritmo hasta diciembre para cerrar el año por encima de lo previsto, sin modificar la meta.", "Alcanzar y superar la meta de la dependencia corresponde al nivel B. El nivel A pide además mejorar las metas establecidas, comprometiendo recursos y tiempos.", false], ["B", "proponer una meta más exigente para el segundo semestre y destinar tiempo y personal a alcanzarla.", "En el nivel A de Orientación a resultados el servidor fija metas que trascienden los propósitos actuales y compromete recursos y tiempos para mejorar las metas establecidas.", true], ["C", "reasignar al personal a otras tareas pendientes de la regional, pues la meta institucional ya se cumplió.", "Dar por terminado el esfuerzo al cumplir la meta no refleja ninguna conducta de la competencia en nivel A, que busca superar los resultados esperados.", false]]}, {"id": "CO-135", "niv": 2, "e": "Para el profesional del despacho, cuyo empleo exige el nivel B, la conducta que corresponde a su nivel frente a la falta de notificadores es", "f": "Diccionario de Competencias Comportamentales PGN, Orientación a resultados, nivel B", "o": [["A", "acudir a los otros medios de notificación previstos en la ley para que los procesos no se detengan.", "El nivel B de Orientación a resultados incluye realizar todas las acciones necesarias para alcanzar los objetivos, enfrentando los obstáculos que se presentan; usar los demás medios de notificación disponibles enfrenta el obstáculo sin frenar las metas.", true], ["B", "reorganizar sus propias actividades ante la falta de notificadores y asumirla como un reto.", "Reorganizar las propias actividades ante cambios del entorno y asumirlos como un reto es la conducta del nivel D de Adaptación al cambio. No implica emprender acciones para remover el obstáculo y alcanzar el objetivo, como pide el nivel B de Orientación a resultados.", false], ["C", "informar la falta de notificadores y esperar a que se provean los cargos para recuperar el ritmo.", "Se detiene ante el obstáculo. El nivel B pide realizar todas las acciones para alcanzar los objetivos enfrentando los obstáculos que se presentan.", false]]}, {"id": "CO-136", "niv": 1, "e": "Para el técnico del despacho, la conducta que el diccionario describe en el nivel D de Orientación a resultados es", "f": "Diccionario de Competencias Comportamentales PGN, Orientación a resultados, nivel D", "o": [["A", "corregir los errores que encuentre en las actividades a su cargo.", "Corregir errores al encontrar fallas en las actividades a cargo es una conducta del nivel D de Autogestión, no de Orientación a resultados.", false], ["B", "hacer esfuerzos adicionales para cumplir las metas asignadas a su grupo.", "Es una conducta del nivel C, superior al D.", false], ["C", "responder por lo que resulte de su propio trabajo.", "El nivel D de Orientación a resultados (alcanzar las metas en desarrollo de sus funciones) incluye asumir la responsabilidad por los resultados de sus actividades y cumplir con oportunidad las funciones asignadas.", true]]}]}, {"comp": "comportamental", "rol": "profesional", "tag": "Competencias comportamentales (Diccionario de la Procuraduría) · Niveles profesional, asesor y ejecutivo · Investigación", "texto": "Usted es profesional universitario de la Oficina de Planeación de la Procuraduría y su empleo exige Investigación en nivel B. Las encuestas muestran que bajó la satisfacción de los ciudadanos atendidos en los centros de atención al público de la entidad, y el jefe le pide estudiar las causas. Para recoger datos, le asignan un técnico cuyo empleo exige el nivel D de la misma competencia. Durante la recolección se descubre que el sistema no registra el canal de entrada del 30 % de las solicitudes.", "items": [{"id": "CO-137", "niv": 2, "e": "Para atender el encargo, la actuación que mejor refleja el nivel B de Investigación es", "f": "Diccionario de Competencias Comportamentales PGN, Investigación, nivel B", "o": [["A", "aportar al estudio que adelanta otra dependencia los datos confiables del sistema de peticiones.", "Aportar información confiable y veraz a los proyectos de la dependencia es propio del nivel C, que apoya investigaciones; no las diseña.", false], ["B", "diseñar con los centros de atención un estudio conjunto y, con sus resultados, proponer un plan de mejoramiento.", "Diseñar el estudio junto con los centros de atención y convertir sus resultados en un plan de mejoramiento refleja el nivel B de Investigación: diseñar y realizar estudios conjuntamente para proponer planes y programas de mejoramiento institucional.", true], ["C", "pedir a cada centro de atención un informe con sus quejas más frecuentes y consolidarlo para la dirección.", "Consolidar y valorar información es una conducta de Gestión de la información, nivel B; no es el diseño de un estudio orientado a proponer mejoras.", false]]}, {"id": "CO-138", "niv": 2, "e": "Para el técnico asignado, cuyo empleo exige el nivel D de Investigación, la tarea que corresponde a su nivel es", "f": "Diccionario de Competencias Comportamentales PGN, Investigación, nivel D", "o": [["A", "preparar las condiciones para recoger los datos, como ordenar los registros y el instrumento de captura.", "El nivel D de Investigación se define como preparar las condiciones que posibilitan la recolección y el análisis de los datos necesarios para obtener resultados en los estudios.", true], ["B", "buscar información sobre las actividades de su cargo y sobre su papel en el estudio.", "Buscar información sobre las actividades del cargo y el propio rol es el nivel D de Aprendizaje continuo, no de Investigación.", false], ["C", "apoyar conceptualmente el estudio aportando objetivos claros y coherentes con las metas de la entidad.", "Aportar objetivos claros y coherentes con las metas organizacionales es una conducta del nivel C, superior al exigido.", false]]}, {"id": "CO-139", "niv": 3, "e": "Ante el vacío de información sobre el canal de entrada, lo que corresponde al técnico según el nivel D de Investigación es", "f": "Diccionario de Competencias Comportamentales PGN, Investigación, nivel D", "o": [["A", "proponer un plan alternativo de recolección, como revisar una muestra de esas solicitudes en físico.", "Una de las conductas del nivel D de Investigación es establecer planes alternativos de acción, dentro de su papel de preparar las condiciones para recolectar los datos.", true], ["B", "excluir esas solicitudes del análisis y continuar con el 70 % restante.", "Excluir los datos no es un plan alternativo de recolección y puede sesgar los resultados del estudio; el nivel D pide preparar las condiciones para obtener los datos necesarios.", false], ["C", "suspender la recolección hasta que la Oficina de Tecnología corrija el sistema.", "Detiene el estudio. El nivel D incluye establecer planes alternativos de acción para no frenar la recolección.", false]]}]}, {"comp": "comportamental", "rol": "profesional", "tag": "Competencias comportamentales (Diccionario de la Procuraduría) · Niveles profesional, asesor y ejecutivo · Cumplimiento de parámetros de trabajo", "texto": "Usted es profesional universitario de la dependencia de contratación de la Procuraduría y ejerce la supervisión de un contrato de mantenimiento de sedes. Su empleo exige Cumplimiento de parámetros de trabajo en nivel B. El manual de supervisión vigente exige un informe de actividades firmado antes de tramitar cada pago. El contratista entregó el trabajo del mes, pero pide que se tramite el pago sin el informe, porque tiene urgencia de liquidez. Usted coordina a dos técnicos que apoyan la revisión documental de la supervisión.", "items": [{"id": "CO-140", "niv": 1, "e": "Ante la petición del contratista, lo que mejor refleja el nivel B de Cumplimiento de parámetros de trabajo es", "f": "Diccionario de Competencias Comportamentales PGN, Cumplimiento de parámetros de trabajo, nivel B", "o": [["A", "tramitar el pago y pedir el informe después, para no afectar el servicio que presta el contratista.", "Se aparta del lineamiento del manual. La competencia consiste en aplicar en las labores la normatividad interna o externa.", false], ["B", "aplicar el manual y exigir el informe antes de tramitar el pago, explicando al contratista el requisito.", "El nivel B de Cumplimiento de parámetros de trabajo incluye seguir las reglas y los lineamientos establecidos para el desempeño dentro de los procesos organizacionales; el manual de supervisión es uno de ellos.", true], ["C", "consultar al jefe de la dependencia si, por esta vez, puede aceptar la entrega sin el informe.", "Pedir al jefe una excepción a una regla clara no refleja el nivel B, en el que el servidor sigue por sí mismo las reglas y lineamientos establecidos.", false]]}, {"id": "CO-141", "niv": 2, "e": "Para organizar el trabajo de los dos técnicos de apoyo, lo que refleja el nivel B de Cumplimiento de parámetros de trabajo es", "f": "Diccionario de Competencias Comportamentales PGN, Cumplimiento de parámetros de trabajo, nivel B", "o": [["A", "permitir que cada técnico organice la revisión como le resulte más ágil, siempre que entregue a tiempo.", "Deja de lado el alineamiento con el procedimiento, que es justamente lo que pide la segunda conducta del nivel B.", false], ["B", "redactar un nuevo procedimiento de supervisión para la entidad y ponerlo en práctica con ellos.", "Modificar los procedimientos de la entidad corresponde al nivel A de esta competencia, y diseñar métodos nuevos se relaciona con Creatividad e innovación.", false], ["C", "fijarles objetivos de revisión documental que sigan los pasos del manual de supervisión.", "Una de las conductas del nivel B de Cumplimiento de parámetros de trabajo es definir objetivos para su equipo alineados con los procedimientos definidos.", true]]}, {"id": "CO-142", "niv": 3, "e": "De las siguientes actuaciones del supervisor, la que el diccionario ubica en Cumplimiento de parámetros de trabajo, y no en Gestión de recursos, es", "f": "Diccionario de Competencias Comportamentales PGN, Cumplimiento de parámetros de trabajo, nivel B", "o": [["A", "ejecutar los recursos conforme a la normatividad y a las directivas, y supervisar los recursos asignados a la dependencia.", "Son las conductas del nivel B de Gestión de recursos, competencia que trata del uso eficiente de los recursos públicos.", false], ["B", "ceñirse a lo que dispone el manual de supervisión en cada etapa del contrato.", "Seguir las reglas y lineamientos establecidos para el desempeño dentro de los procesos organizacionales es una conducta del nivel B de Cumplimiento de parámetros de trabajo.", true], ["C", "racionalizar los recursos que le asignan para el desarrollo de sus tareas.", "Es una conducta del nivel D de Gestión de recursos, no de Cumplimiento de parámetros de trabajo.", false]]}]}, {"comp": "comportamental", "rol": "tecnico", "tag": "Competencias comportamentales (Diccionario de la Procuraduría) · Niveles técnico, administrativo y operativo · Organización en el trabajo", "texto": "Usted es técnico de la secretaría de una procuraduría distrital y su empleo exige Organización en el trabajo en nivel C. Además de radicar y tramitar comunicaciones, debe coordinar las tareas de dos auxiliares. La secretaría tiene un indicador de oportunidad: toda comunicación debe quedar radicada y digitalizada con sus anexos el mismo día de su recibo, según el procedimiento del sistema de gestión de calidad. Al revisar el trabajo de la semana, encuentra que uno de los auxiliares no está digitalizando los anexos.", "items": [{"id": "CO-143", "niv": 2, "e": "En su trabajo diario, la actuación que mejor refleja el nivel C de Organización en el trabajo es", "f": "Diccionario de Competencias Comportamentales PGN, Organización en el trabajo, nivel C", "o": [["A", "controlar las tareas de radicación suyas y de los auxiliares frente al indicador de oportunidad.", "El nivel C de Organización en el trabajo consiste en coordinar y hacer seguimiento a las actividades o tareas propias o de otros a la luz de estándares o indicadores.", true], ["B", "radicar sus propias comunicaciones con el estándar fijado y en menos tiempo del que exige la entidad.", "Realizar las actividades en forma estandarizada y en menores tiempos corresponde al nivel D. El nivel C incluye coordinar y hacer seguimiento a las tareas propias o de otros.", false], ["C", "construir con los auxiliares, en reuniones de grupo, soluciones a los problemas de la secretaría.", "Compartir, discutir y construir soluciones con otros es la conducta del nivel C de Trabajo en equipo, no de Organización en el trabajo, que en el nivel C pide coordinar y hacer seguimiento a las tareas a la luz de indicadores.", false]]}, {"id": "CO-144", "niv": 2, "e": "Frente al auxiliar que no está digitalizando los anexos, lo coherente con el nivel C de Organización en el trabajo es", "f": "Diccionario de Competencias Comportamentales PGN, Organización en el trabajo, nivel C", "o": [["A", "digitalizar usted mismo los anexos faltantes, para evitar un roce con el compañero.", "Resuelve el pendiente puntual, pero no verifica con el compañero la aplicación del procedimiento, como pide el nivel C.", false], ["B", "anotar la novedad para mencionarla en la próxima evaluación de desempeño del auxiliar.", "Posterga la corrección y no hace el seguimiento oportuno a la luz del estándar que describe el nivel C.", false], ["C", "verificar con él la aplicación del procedimiento y acordar que complete los registros.", "Una de las conductas del nivel C de Organización en el trabajo es verificar la aplicación de la normatividad sobre calidad en las actividades propias y de compañeros o subalternos.", true]]}, {"id": "CO-145", "niv": 3, "e": "La actuación que corresponde a Organización en el trabajo, nivel C, y no a Cumplimiento de parámetros de trabajo, nivel C, es", "f": "Diccionario de Competencias Comportamentales PGN, Organización en el trabajo, nivel C", "o": [["A", "acatar las normas y la reglamentación que rigen el quehacer de la dependencia.", "Es la otra conducta del nivel C de Cumplimiento de parámetros de trabajo, no de Organización en el trabajo.", false], ["B", "vigilar el avance de su trabajo y el de otros comparándolo con indicadores o estándares.", "El diccionario define el nivel C de Organización en el trabajo como coordinar y hacer seguimiento a las actividades propias o de otros a la luz de estándares o indicadores.", true], ["C", "seguir las pautas del jefe inmediato para cumplir los objetivos de la dependencia.", "Es una conducta del nivel C de Cumplimiento de parámetros de trabajo.", false]]}]}, {"comp": "comportamental", "rol": "tecnico", "tag": "Competencias comportamentales (Diccionario de la Procuraduría) · Niveles técnico, administrativo y operativo · Creatividad e innovación", "texto": "Usted es técnico de una procuraduría judicial para asuntos administrativos y programa las audiencias de conciliación extrajudicial. Su empleo exige Creatividad e innovación en nivel C. En el último trimestre, una de cada cuatro audiencias se reprogramó porque alguna de las partes no asistió. Un compañero le cuenta que en otra procuraduría judicial redujeron las reprogramaciones confirmando la asistencia por teléfono dos días antes de cada audiencia.", "items": [{"id": "CO-146", "niv": 1, "e": "Frente a la práctica que le contó su compañero, lo que refleja el nivel C de Creatividad e innovación es", "f": "Diccionario de Competencias Comportamentales PGN, Creatividad e innovación, nivel C", "o": [["A", "adaptar esa práctica a su forma de programar audiencias y ensayarla antes de adoptarla.", "El nivel C de Creatividad e innovación incluye crear nuevas formas de trabajo a partir de la adaptación de las mejores prácticas conocidas y poner a prueba los nuevos procedimientos.", true], ["B", "copiar exactamente el mismo esquema, porque ya demostró que funciona en la otra procuraduría.", "Trasladar la práctica sin adaptarla ni probarla omite las dos conductas del nivel C: perfeccionar o adaptar las mejores prácticas y poner a prueba el nuevo procedimiento.", false], ["C", "esperar a que la práctica se adopte de forma oficial en toda la entidad antes de usarla.", "No crea ni prueba ninguna forma nueva de trabajo; el nivel C pide diseñar nuevos procedimientos para realizar las propias funciones.", false]]}, {"id": "CO-147", "niv": 2, "e": "Durante la prueba, el nuevo procedimiento falla con las partes que no tienen teléfono. Lo coherente con el nivel C de Creatividad e innovación es", "f": "Diccionario de Competencias Comportamentales PGN, Creatividad e innovación, nivel C", "o": [["A", "mantener el procedimiento sin cambios, porque funciona en la mayoría de los casos.", "Ignora el resultado de la prueba. Poner a prueba el procedimiento tiene sentido justamente para perfeccionarlo con lo que se observa.", false], ["B", "abandonar el nuevo procedimiento y regresar al anterior, que ya era conocido por todos en la oficina.", "Renuncia a perfeccionar la práctica. El nivel C supone ajustar y volver a probar el procedimiento, no descartarlo ante el primer problema.", false], ["C", "perfeccionar el procedimiento con otro medio de confirmación para esos casos y volver a probarlo.", "El nivel C de Creatividad e innovación describe nuevas formas de trabajo construidas a partir del perfeccionamiento de las prácticas, que se ponen a prueba antes de adoptarse.", true]]}, {"id": "CO-148", "niv": 3, "e": "Si el técnico propusiera un cambio para todas las procuradurías judiciales del país, distinto del modelo tradicional y con evaluación de su impacto mediante metodologías probadas, esa conducta correspondería", "f": "Diccionario de Competencias Comportamentales PGN, Creatividad e innovación, nivel A", "o": [["A", "al nivel C de Creatividad e innovación.", "El nivel C se limita a diseñar nuevos procedimientos para realizar las propias funciones.", false], ["B", "al nivel A de Adaptación al cambio.", "Adaptación al cambio, nivel A, trata de anticiparse a las transformaciones del entorno y proponer programas de cambio documentados; no menciona la distancia frente a lo tradicional ni la evaluación de impacto con metodologías probadas, que el diccionario ubica en Creatividad e innovación, nivel A.", false], ["C", "al nivel A de Creatividad e innovación.", "El nivel A de Creatividad e innovación incluye formular procesos de cambio que se distancian de lo tradicionalmente establecido en la institución y evaluar con metodologías probadas el impacto de los cambios propuestos.", true]]}]}, {"comp": "comportamental", "rol": "profesional", "tag": "Competencias comportamentales (Diccionario de la Procuraduría) · Niveles profesional, asesor y ejecutivo · Responsabilidad con la organización", "texto": "Usted es profesional universitario de la procuraduría delegada para la defensa de los derechos de la infancia y la adolescencia, y su empleo exige Responsabilidad con la organización en nivel B. El objetivo de la delegada este año es hacer seguimiento a las políticas de infancia en 50 municipios, con una matriz de seguimiento que se envía a cada alcaldía. En noviembre usted tiene sus informes al día, pero una compañera salió a licencia y dejó doce informes pendientes; el procurador delegado pregunta quién puede ayudar. Al trabajar con la matriz, usted nota que obliga a pedir dos veces la misma información a las alcaldías.", "items": [{"id": "CO-149", "niv": 1, "e": "Ante la pregunta del procurador delegado sobre los informes pendientes, lo que refleja el nivel B de Responsabilidad con la organización es", "f": "Diccionario de Competencias Comportamentales PGN, Responsabilidad con la organización, nivel B", "o": [["A", "proponer al equipo líneas de acción claras para evacuar entre todos los informes pendientes.", "Establecer líneas de acción claras para cumplir los objetivos y orientar la acción del grupo es una conducta de Trabajo en equipo, nivel B. El nivel B de Responsabilidad con la organización se refleja en enfocar la propia actividad hacia los objetivos de la entidad.", false], ["B", "ofrecerse a asumir parte de los informes, porque el objetivo es de la delegada y no solo de cada servidor.", "El nivel B de Responsabilidad con la organización incluye contribuir al desarrollo de los objetivos de la entidad y enfocar la propia actividad hacia el cumplimiento de los objetivos de la institución.", true], ["C", "atender los informes de la compañera solo si el procurador delegado se los asigna formalmente.", "Limitarse a resolver lo que le asignen corresponde al nivel C (buscar solución a los problemas que le asignen), inferior al exigido.", false]]}, {"id": "CO-150", "niv": 2, "e": "Frente a la doble solicitud de información que genera la matriz, lo que corresponde al nivel B de Responsabilidad con la organización es", "f": "Diccionario de Competencias Comportamentales PGN, Responsabilidad con la organización, nivel B", "o": [["A", "proponer a la delegada un ajuste de la matriz para el siguiente ciclo.", "El nivel B de Responsabilidad con la organización incluye proponer estrategias de mejoramiento continuo y buscar permanentemente la mejora de los procesos institucionales.", true], ["B", "seguir usando la matriz, porque es la herramienta oficial aprobada para el seguimiento.", "Cumplir los parámetros establecidos es una conducta del nivel D. El nivel B pide además buscar la mejora de los procesos institucionales.", false], ["C", "crear para su uso personal una hoja de control que evite la doble solicitud en sus municipios.", "Diseñar instrumentos para el propio trabajo es una conducta de Creatividad e innovación, nivel D. No mejora el proceso de la delegada.", false]]}, {"id": "CO-151", "niv": 3, "e": "Al final del año, usted recibe un reconocimiento especial por un informe de calidad excepcional que superó las expectativas de la delegada y de las alcaldías. Según el diccionario, esa situación describe", "f": "Diccionario de Competencias Comportamentales PGN, Responsabilidad con la organización, nivel A", "o": [["A", "el nivel A de Responsabilidad con la organización.", "El nivel A de Responsabilidad con la organización (superar las expectativas de los usuarios internos y externos) incluye mostrar resultados con niveles de calidad excepcionales y obtener reconocimientos especiales por el cumplimiento de sus funciones.", true], ["B", "el nivel A de Orientación a resultados.", "El nivel A de Orientación a resultados se refiere a fijar metas desafiantes y comprometer recursos para superarlas, no a la calidad excepcional ni a los reconocimientos.", false], ["C", "el nivel B de Responsabilidad con la organización.", "El nivel B trata de contribuir a los objetivos de la entidad y proponer mejoras; los resultados excepcionales y los reconocimientos especiales los ubica el diccionario en el nivel A.", false]]}]}, {"comp": "comportamental", "rol": "tecnico", "tag": "Competencias comportamentales (Diccionario de la Procuraduría) · Niveles técnico, administrativo y operativo · Responsabilidad con la organización", "texto": "Usted es técnico del grupo de notificaciones de una procuraduría distrital y su empleo exige Responsabilidad con la organización en nivel D. Cada día recibe un listado de comunicaciones y notificaciones por realizar, con un formato de control de calidad que exige verificar la identidad del destinatario y dejar constancia de cada actuación. Esta semana el supervisor informó un nuevo parámetro: toda notificación electrónica debe incluir la constancia de envío del correo. Hoy, una citación volvió con la anotación «dirección errada».", "items": [{"id": "CO-152", "niv": 1, "e": "En su trabajo diario, lo que corresponde al nivel D de Responsabilidad con la organización es", "f": "Diccionario de Competencias Comportamentales PGN, Responsabilidad con la organización, nivel D", "o": [["A", "atender primero las notificaciones más sencillas, para mostrar más resultados al final del día.", "Escoge las tareas según la facilidad y no según lo asignado y los parámetros de calidad; no refleja ninguna conducta del nivel D.", false], ["B", "proponer un rediseño del proceso de notificaciones de la procuraduría distrital.", "Buscar la mejora de los procesos institucionales es una conducta del nivel B, muy superior al nivel D exigido.", false], ["C", "realizar las notificaciones que tiene a cargo verificando cada requisito del formato de calidad.", "En el nivel D de Responsabilidad con la organización el servidor cumple las tareas que le son asignadas: realiza las actividades a su cargo, en este caso las notificaciones, y cumple los parámetros de calidad de la entidad.", true]]}, {"id": "CO-153", "niv": 2, "e": "Frente al nuevo parámetro sobre la constancia de envío, lo coherente con el nivel D de Responsabilidad con la organización es", "f": "Diccionario de Competencias Comportamentales PGN, Responsabilidad con la organización, nivel D", "o": [["A", "pedir que el cambio se aplique cuando se haya evacuado el represamiento de notificaciones.", "Aplaza el cumplimiento de un parámetro de calidad ya fijado por la entidad, contrario a la segunda conducta del nivel D.", false], ["B", "incorporar el nuevo parámetro en todas las notificaciones que envíe desde ese momento.", "Una de las conductas del nivel D de Responsabilidad con la organización es cumplir con los parámetros de calidad establecidos por la entidad en las actividades a su cargo.", true], ["C", "aplicarlo solo a los destinatarios nuevos y seguir con el parámetro anterior para los que ya estaban en su listado.", "Cumple solo a medias el parámetro vigente. El nivel D incluye cumplir con los parámetros de calidad establecidos por la entidad en todas las actividades a cargo.", false]]}, {"id": "CO-154", "niv": 3, "e": "Frente a la citación devuelta, si el empleo exigiera el nivel C en lugar del D, lo esperado sería", "f": "Diccionario de Competencias Comportamentales PGN, Responsabilidad con la organización, nivel C", "o": [["A", "informar al supervisor los datos del expediente para que él decida qué hacer con la citación.", "Aportar elementos para que otros tomen la decisión es el nivel D de Toma de decisiones. El nivel C de Responsabilidad con la organización pide buscar uno mismo la solución al problema asignado.", false], ["B", "buscar la solución al problema, por ejemplo consultando otras direcciones registradas en el expediente.", "En el nivel C de Responsabilidad con la organización el servidor busca solución a los problemas o situaciones que le asignan en cumplimiento de sus funciones, como la citación devuelta, en lugar de limitarse a registrarlos.", true], ["C", "registrar la devolución en el formato establecido y continuar con las demás notificaciones.", "Es la conducta propia del nivel D (realizar sus actividades y cumplir los parámetros), no del nivel C.", false]]}]}, {"comp": "comportamental", "rol": "profesional", "tag": "Competencias comportamentales (Diccionario de la Procuraduría) · Niveles profesional, asesor y ejecutivo · Responsabilidad con la organización", "texto": "Usted es profesional universitario de una procuraduría regional de instrucción y su empleo exige Responsabilidad con la organización en nivel B. Uno de los objetivos de la regional es reducir el riesgo de prescripción en los procesos disciplinarios. Al revisar su inventario, usted identifica que varios expedientes llegan al despacho con meses de retraso porque el reparto desde la oficina de correspondencia se hace de forma manual una vez al mes. Un compañero opina que proponer mejoras «no es función de los profesionales, sino de la Oficina de Planeación».", "items": [{"id": "CO-155", "niv": 2, "e": "Frente al retraso en el reparto, lo que corresponde al nivel B de Responsabilidad con la organización es", "f": "Diccionario de Competencias Comportamentales PGN, Responsabilidad con la organización, nivel B", "o": [["A", "documentar el patrón y proponer una mejora del reparto que reduzca el riesgo en toda la regional.", "El nivel B de Responsabilidad con la organización consiste en contribuir a los objetivos de la entidad y proponer estrategias de mejoramiento continuo, buscando la mejora de los procesos institucionales.", true], ["B", "resolver uno por uno los casos de demora que le asignen, a medida que vayan apareciendo.", "Buscar solución a los problemas que le asignen es una conducta del nivel C. El nivel B apunta a la mejora de los procesos institucionales.", false], ["C", "hacer seguimiento sistemático a sus propios expedientes para generar acciones de mejora en su trámite.", "Generar acciones de mejoramiento a partir del seguimiento de las propias actividades es el nivel C de Orientación al mejoramiento continuo. Se queda en el trabajo propio y no propone la mejora del proceso de la regional, como el nivel B de Responsabilidad con la organización.", false]]}, {"id": "CO-156", "niv": 2, "e": "Ante la opinión del compañero sobre quién debe proponer mejoras, la respuesta coherente con el nivel B de Responsabilidad con la organización es", "f": "Diccionario de Competencias Comportamentales PGN, Responsabilidad con la organización, nivel B", "o": [["A", "que las mejoras deben proponerse solo cuando el jefe inmediato las solicite de manera expresa y por escrito.", "Condiciona la mejora a una instrucción del jefe, lo que se parece a seguir pautas (Cumplimiento de parámetros de trabajo, nivel C) y no al compromiso que describe el nivel B.", false], ["B", "que tiene razón y que lo mejor es limitarse a cumplir bien las tareas asignadas.", "Limitarse a cumplir las tareas asignadas describe el nivel D, inferior al exigido para este empleo.", false], ["C", "que buscar la mejora de los procesos en que participa también es parte del compromiso con la entidad.", "El nivel B de Responsabilidad con la organización incluye, como conducta, buscar permanentemente la mejora de los procesos institucionales, sin limitarla a una dependencia.", true]]}, {"id": "CO-157", "niv": 1, "e": "Una vez la dirección adopta la mejora del reparto, lo que refleja el nivel B de Responsabilidad con la organización es", "f": "Diccionario de Competencias Comportamentales PGN, Responsabilidad con la organización, nivel B", "o": [["A", "pedir que el aporte quede registrado como logro en su evaluación de desempeño.", "Buscar el reconocimiento del aporte no es una conducta del nivel B; el diccionario menciona los reconocimientos especiales como consecuencia en el nivel A, no como algo que se solicita.", false], ["B", "seguir revisando el proceso para identificar nuevas oportunidades de mejora.", "El diccionario describe en el nivel B la búsqueda permanente de la mejora de los procesos institucionales; la mejora no termina con la primera propuesta.", true], ["C", "dar el asunto por resuelto, pues la propuesta ya cumplió su propósito.", "Contradice el carácter permanente de la búsqueda de mejoras que el diccionario atribuye al nivel B.", false]]}]}, {"comp": "comportamental", "rol": "profesional", "tag": "Competencias comportamentales (Diccionario de la Procuraduría) · Niveles profesional, asesor y ejecutivo · Organización en el trabajo", "texto": "Usted es profesional universitario del área de capacitación de la división de gestión humana de la Procuraduría y su empleo exige Organización en el trabajo en nivel B. Debe programar seis cursos para el primer semestre. El presupuesto llega en dos desembolsos, en marzo y en junio, y el aula virtual estará disponible solo desde abril. Además, en el mes de las elecciones buena parte de los servidores apoyará la vigilancia electoral que realiza la entidad.", "items": [{"id": "CO-158", "niv": 1, "e": "Al programar los seis cursos, lo que mejor refleja el nivel B de Organización en el trabajo es", "f": "Diccionario de Competencias Comportamentales PGN, Organización en el trabajo, nivel B", "o": [["A", "ordenar los cursos según cuándo llega cada desembolso y cuándo estará disponible el aula virtual.", "El nivel B de Organización en el trabajo consiste en programar, a mediano plazo, la realización ordenada de actividades con base en la disponibilidad de recursos y tiempo.", true], ["B", "dictar primero los cursos más solicitados y buscar recursos para los demás a medida que se necesiten.", "Programa según la demanda y no según la disponibilidad de recursos y tiempo, que es el criterio que el diccionario fija para el nivel B.", false], ["C", "verificar que cada curso cumpla los estándares de calidad del sistema de gestión de la entidad.", "Verificar la aplicación de la normatividad de calidad es una conducta del nivel C, no la programación que pide el nivel B.", false]]}, {"id": "CO-159", "niv": 2, "e": "Al iniciar el semestre, el jefe le pide definir qué debe lograr el área. Lo que corresponde al nivel B de Organización en el trabajo es", "f": "Diccionario de Competencias Comportamentales PGN, Organización en el trabajo, nivel B", "o": [["A", "cumplir sus propias tareas del plan de capacitación en menos tiempo del previsto.", "Realizar las actividades en menores tiempos que los requeridos corresponde al nivel D.", false], ["B", "proponer acciones estratégicas que superen lo que se espera del área este semestre.", "Proponer acciones estratégicas que superen las expectativas es una conducta de Orientación a resultados, nivel B. El nivel B de Organización en el trabajo pide programar las metas del área.", false], ["C", "programar las metas del área para el semestre, con fechas y responsables.", "Una de las conductas del nivel B de Organización en el trabajo es programar las metas estratégicas de su área o de su equipo.", true]]}, {"id": "CO-160", "niv": 2, "e": "Frente al periodo de vigilancia electoral, lo coherente con el nivel B de Organización en el trabajo es", "f": "Diccionario de Competencias Comportamentales PGN, Organización en el trabajo, nivel B", "o": [["A", "anticipar esa situación y no programar cursos presenciales en las semanas de vigilancia electoral.", "El nivel B de Organización en el trabajo incluye proyectar situaciones y escenarios futuros con acierto al programar las actividades según la disponibilidad de tiempo.", true], ["B", "dejar que cada dependencia escoja las fechas de sus cursos según su carga de trabajo en ese mes.", "Traslada la programación a otros y no aprovecha la información disponible para organizar las actividades, que es lo que corresponde al nivel B.", false], ["C", "programar los cursos con normalidad y, si la asistencia resulta baja, repetirlos en el segundo semestre.", "Reacciona después del problema. El nivel B pide proyectar situaciones y escenarios futuros con acierto.", false]]}]}, {"comp": "comportamental", "rol": "tecnico", "tag": "Competencias comportamentales (Diccionario de la Procuraduría) · Niveles técnico, administrativo y operativo · Organización en el trabajo", "texto": "Usted es técnico administrativo de la secretaría de una procuraduría provincial y su empleo exige Organización en el trabajo en nivel D. Expide constancias, presta expedientes y alimenta el sistema de información. La secretaría fija tres días hábiles para expedir cada constancia y tiene un procedimiento estandarizado para cada trámite. Para ubicar los expedientes que necesita cuenta con el inventario documental y el sistema de información.", "items": [{"id": "CO-161", "niv": 1, "e": "En su trabajo diario, lo que corresponde al nivel D de Organización en el trabajo es", "f": "Diccionario de Competencias Comportamentales PGN, Organización en el trabajo, nivel D", "o": [["A", "revisar que sus compañeros de la secretaría apliquen las normas de calidad en sus trámites.", "Verificar la aplicación de normas de calidad en el trabajo de compañeros es una conducta del nivel C.", false], ["B", "aplicar el procedimiento estandarizado y procurar terminar cada trámite antes del tiempo fijado.", "Según el diccionario, el nivel D de Organización en el trabajo consiste en ejecutar las actividades según los parámetros de eficiencia de la entidad, de forma estandarizada y en menos tiempo del requerido.", true], ["C", "hacer cada trámite a su manera, siempre que el resultado final se entregue dentro del plazo fijado.", "Se aparta del trabajo estandarizado que el diccionario exige en el nivel D.", false]]}, {"id": "CO-162", "niv": 2, "e": "Para cumplir el plazo de las constancias en una semana de alta demanda, lo coherente con el nivel D de Organización en el trabajo es", "f": "Diccionario de Competencias Comportamentales PGN, Organización en el trabajo, nivel D", "o": [["A", "omitir los pasos de verificación en las constancias más sencillas para terminar más rápido.", "Gana tiempo a costa del procedimiento; el nivel D busca menores tiempos, pero dentro de la forma estandarizada.", false], ["B", "acumular las solicitudes de la semana y tramitarlas todas juntas el último día del plazo.", "No hace las actividades en menos tiempo del requerido y arriesga el cumplimiento del plazo, contrario al nivel D.", false], ["C", "tramitar cada solicitud con el procedimiento estandarizado apenas llega.", "El nivel D de Organización en el trabajo incluye realizar las actividades en forma estandarizada y en menores tiempos que los requeridos por la entidad.", true]]}, {"id": "CO-163", "niv": 2, "e": "Al buscar los expedientes que necesita para sus trámites, lo coherente con el nivel D de Organización en el trabajo es", "f": "Diccionario de Competencias Comportamentales PGN, Organización en el trabajo, nivel D", "o": [["A", "recorrer los estantes del archivo hasta familiarizarse con la ubicación de las carpetas.", "Es una búsqueda por ensayo y error, que no corresponde al acceso sistemático a la información del nivel D.", false], ["B", "consultar en orden el inventario y el sistema de información antes de ir al estante.", "Una de las conductas del nivel D de Organización en el trabajo es acceder a la información y los datos en forma sistemática y didáctica para realizar el trabajo.", true], ["C", "preguntar a la secretaria más antigua, que conoce de memoria la ubicación de cada carpeta.", "Depende de la memoria de otra persona y no de un acceso sistemático a la información, como describe el nivel D.", false]]}]}, {"comp": "comportamental", "rol": "profesional", "tag": "Competencias comportamentales (Diccionario de la Procuraduría) · Niveles profesional, asesor y ejecutivo · Cumplimiento de parámetros de trabajo", "texto": "Usted es profesional universitario de la oficina de control disciplinario interno de la Procuraduría y su empleo exige Cumplimiento de parámetros de trabajo en nivel B. Sustancia procesos disciplinarios y, además, representa a la oficina en el comité del sistema de gestión de la entidad. La entidad acaba de adoptar un nuevo formato para los autos de apertura. El jefe de la oficina, cuyo empleo exige el nivel A de la misma competencia, advierte que el procedimiento interno de la oficina no está alineado con una política institucional adoptada recientemente.", "items": [{"id": "CO-164", "niv": 3, "e": "Como participa en dos procesos distintos, lo que refleja el nivel B de Cumplimiento de parámetros de trabajo es", "f": "Diccionario de Competencias Comportamentales PGN, Cumplimiento de parámetros de trabajo, nivel B", "o": [["A", "seguir en cada uno de los dos procesos las reglas y los lineamientos que lo rigen.", "El nivel B de Cumplimiento de parámetros de trabajo consiste en aplicar criterios para desempeñarse dentro de procesos organizacionales, siguiendo las reglas y lineamientos establecidos en cada uno.", true], ["B", "seguir en el comité las indicaciones del jefe y, en la sustanciación, los pasos que considere más eficientes.", "Sustituye los lineamientos por su propio criterio en la sustanciación y se limita a las pautas del jefe en el comité, lo que no refleja el nivel B.", false], ["C", "aplicar con rigor las reglas de la sustanciación, que es su función principal, y participar en el comité según su criterio.", "Aplica los lineamientos solo en uno de los procesos. El nivel B pide seguir las reglas y lineamientos en los diferentes procesos organizacionales en que participa.", false]]}, {"id": "CO-165", "niv": 1, "e": "Al proyectar un auto de apertura, lo que corresponde al nivel B de Cumplimiento de parámetros de trabajo es", "f": "Diccionario de Competencias Comportamentales PGN, Cumplimiento de parámetros de trabajo, nivel B", "o": [["A", "elaborar un formato propio que combine los dos y proponerlo como nuevo estándar.", "Crear instrumentos o procedimientos nuevos se relaciona con Creatividad e innovación; en esta competencia y nivel lo esperado es aplicar el lineamiento vigente.", false], ["B", "usar el formato anterior, que conoce mejor y contiene la misma información.", "Se aparta del lineamiento vigente; la competencia consiste en aplicar en las labores la normatividad interna.", false], ["C", "usar el nuevo formato adoptado por la entidad.", "En el nivel B de Cumplimiento de parámetros de trabajo el servidor sigue las reglas y los lineamientos establecidos para desempeñarse en los procesos organizacionales; el formato adoptado es uno de ellos.", true]]}, {"id": "CO-166", "niv": 3, "e": "Frente al desajuste entre el procedimiento y la política institucional, lo que corresponde al jefe de la oficina según el nivel A de Cumplimiento de parámetros de trabajo es", "f": "Diccionario de Competencias Comportamentales PGN, Cumplimiento de parámetros de trabajo, nivel A", "o": [["A", "modificar el procedimiento para alinearlo con la política y fijar lineamientos de desempeño.", "El nivel A de Cumplimiento de parámetros de trabajo incluye modificar los procedimientos de trabajo para alinearlos con las políticas y principios de la entidad y definir lineamientos para lograr y superar estándares de desempeño.", true], ["B", "seguir aplicando el procedimiento vigente hasta que otra dependencia lo actualice.", "Es una actitud pasiva que no corresponde al nivel A, cuya conducta es modificar los procedimientos para alinearlos con las políticas.", false], ["C", "pedir al equipo que aplique la nueva política de manera informal, sin cambiar el procedimiento escrito.", "Deja el procedimiento desalineado y crea prácticas por fuera de lo establecido; el nivel A pide ajustar formalmente el procedimiento.", false]]}]}, {"comp": "comportamental", "rol": "tecnico", "tag": "Competencias comportamentales (Diccionario de la Procuraduría) · Niveles técnico, administrativo y operativo · Cumplimiento de parámetros de trabajo", "texto": "Usted es técnico administrativo de la ventanilla de radicación de una procuraduría regional y su empleo exige Cumplimiento de parámetros de trabajo en nivel D. El instructivo de radicación indica, paso a paso, cómo registrar cada documento, contar folios y anexos, y qué hacer si falta un anexo anunciado: recibir el documento y dejar constancia del faltante. Hoy en la mañana, el coordinador le indicó que, desde ese día, las acciones de tutela deben radicarse antes que cualquier otro documento.", "items": [{"id": "CO-167", "niv": 1, "e": "Al radicar documentos en una mañana de mucha afluencia, lo que corresponde al nivel D de Cumplimiento de parámetros de trabajo es", "f": "Diccionario de Competencias Comportamentales PGN, Cumplimiento de parámetros de trabajo, nivel D", "o": [["A", "adaptar el instructivo según el tipo de documento, porque algunos pasos no aplican a todos.", "Modificar el procedimiento por cuenta propia no corresponde al nivel D, que sigue las instrucciones detalladas establecidas.", false], ["B", "dejar el conteo de folios para el final de la jornada, cuando haya menos fila.", "Altera el procedimiento establecido; el nivel D consiste en seguir las normas y procedimientos fijados para las tareas operativas.", false], ["C", "radicar siguiendo paso a paso el instructivo, incluido el registro de folios y anexos.", "El nivel D de Cumplimiento de parámetros de trabajo consiste en aplicar instrucciones detalladas en tareas operativas y seguir las normas y procedimientos establecidos para su desarrollo.", true]]}, {"id": "CO-168", "niv": 2, "e": "Frente a la indicación del coordinador sobre las tutelas, lo que refleja el nivel D de Cumplimiento de parámetros de trabajo es", "f": "Diccionario de Competencias Comportamentales PGN, Cumplimiento de parámetros de trabajo, nivel D", "o": [["A", "pedir que la indicación se le entregue por escrito antes de empezar a aplicarla.", "Retrasa el cumplimiento de una indicación clara del superior sobre una tarea cotidiana, contrario a la segunda conducta del nivel D.", false], ["B", "cumplir la indicación y dar prelación a las tutelas en la radicación del día.", "Una de las conductas del nivel D de Cumplimiento de parámetros de trabajo es cumplir las indicaciones de sus superiores para la implementación de procedimientos en el desarrollo de tareas cotidianas.", true], ["C", "seguir el orden de llegada, porque es el que fija el instructivo escrito.", "Desconoce la indicación del superior. El nivel D incluye cumplir las indicaciones de sus superiores para implementar procedimientos en las tareas cotidianas.", false]]}, {"id": "CO-169", "niv": 1, "e": "Un ciudadano entrega un escrito que anuncia tres anexos, pero solo trae dos. Lo que corresponde al nivel D de Cumplimiento de parámetros de trabajo es", "f": "Diccionario de Competencias Comportamentales PGN, Cumplimiento de parámetros de trabajo, nivel D", "o": [["A", "recibir el escrito y dejar constancia del anexo faltante, como indica el instructivo.", "El nivel D de Cumplimiento de parámetros de trabajo consiste en seguir las normas y procedimientos establecidos para las tareas operativas; el instructivo prevé este caso de forma expresa.", true], ["B", "devolver el escrito al ciudadano para que regrese con el anexo completo.", "Contradice la instrucción detallada del instructivo, que ordena recibir y dejar constancia.", false], ["C", "recibir el escrito sin dejar constancia, para no demorar la atención de la fila.", "Omite un paso del procedimiento; el nivel D exige seguir las instrucciones establecidas completas.", false]]}]}, {"comp": "comportamental", "rol": "tecnico", "tag": "Competencias comportamentales (Diccionario de la Procuraduría) · Niveles técnico, administrativo y operativo · Pensamiento conceptual", "texto": "Usted es técnico de la oficina de atención al ciudadano de una procuraduría regional y su empleo exige Pensamiento conceptual en nivel D. Lleva la base de datos de visitas y solicitudes. En las últimas semanas aparecieron registros duplicados: usted revisó y encontró que se originan cuando un mismo ciudadano llega por la ventanilla y por el correo con la misma solicitud. Tres semanas después aparece otro duplicado con el mismo origen.", "items": [{"id": "CO-170", "niv": 1, "e": "Frente a los registros duplicados, lo que refleja el nivel D de Pensamiento conceptual es", "f": "Diccionario de Competencias Comportamentales PGN, Pensamiento conceptual, nivel D", "o": [["A", "reportar cada duplicado a la mesa de ayuda para que la Oficina de Tecnología lo corrija.", "Traslada el problema sin comprenderlo ni buscarle solución; el nivel D pide analizar la información y establecer mecanismos de solución.", false], ["B", "analizar por qué se duplican los registros y fijar un mecanismo sencillo para evitarlo en su propio registro.", "El nivel D de Pensamiento conceptual (comprender problemas de baja complejidad necesarios para cumplir sus funciones) incluye analizar la información disponible y establecer mecanismos de solución para el desarrollo de sus funciones.", true], ["C", "elaborar un concepto técnico para la dependencia sobre las fallas del sistema de información.", "Realizar conceptos que aclaran situaciones y problemas es una conducta de los niveles B y C, superior al nivel D exigido.", false]]}, {"id": "CO-171", "niv": 2, "e": "Ante el nuevo duplicado con el mismo origen, lo coherente con el nivel D de Pensamiento conceptual es", "f": "Diccionario de Competencias Comportamentales PGN, Pensamiento conceptual, nivel D", "o": [["A", "volver a analizar el problema desde cero, por si las causas cambiaron.", "El caso ya muestra el mismo origen; repetir el análisis completo no corresponde a la conducta de aplicar las soluciones generadas.", false], ["B", "escalar el caso a su jefe para que decida cómo proceder esta vez.", "Desaprovecha la solución que ya existe; el nivel D incluye aplicar las soluciones que el servidor ha generado.", false], ["C", "aplicar la solución que ya había generado para ese tipo de duplicado.", "Una de las conductas del nivel D de Pensamiento conceptual es ejecutar sus labores aplicando soluciones que ha generado para el desarrollo de sus actividades en los casos en que se requiera.", true]]}, {"id": "CO-172", "niv": 3, "e": "Si el empleo exigiera el nivel C de Pensamiento conceptual, se esperaría además que el técnico", "f": "Diccionario de Competencias Comportamentales PGN, Pensamiento conceptual, nivel C", "o": [["A", "emitiera conceptos sobre problemas formados por elementos de la misma clase, aclarándolos con análisis técnico.", "El nivel C de Pensamiento conceptual consiste en conceptuar sobre problemas o situaciones constituidos por elementos homogéneos y aclarar situaciones que requieren análisis técnico de la información.", true], ["B", "solucionara problemas de baja complejidad con la información que tiene a su alcance.", "Solucionar problemas de baja complejidad con la información disponible es el nivel C de Pensamiento analítico, otra competencia del diccionario.", false], ["C", "conceptuara sobre situaciones con elementos heterogéneos a partir de información primaria y secundaria.", "Conceptuar sobre situaciones constituidas por elementos heterogéneos corresponde al nivel B.", false]]}]}, {"comp": "comportamental", "rol": "tecnico", "tag": "Competencias comportamentales (Diccionario de la Procuraduría) · Niveles técnico, administrativo y operativo · Orientación a resultados", "texto": "Usted es técnico del centro de atención al público de la Procuraduría en una capital departamental y su empleo exige Orientación a resultados en nivel C. El grupo de cuatro técnicos tiene la meta de responder 500 solicitudes al mes dentro de los términos. A falta de una semana para el cierre del mes, el grupo va 40 solicitudes por debajo de la meta. En el grupo también trabaja un auxiliar cuyo empleo exige el nivel D de la misma competencia, quien cometió un error en una respuesta enviada ayer.", "items": [{"id": "CO-173", "niv": 3, "e": "Para que el grupo cumpla su meta mensual, lo que mejor refleja el nivel C de Orientación a resultados es", "f": "Diccionario de Competencias Comportamentales PGN, Orientación a resultados, nivel C", "o": [["A", "responder a tiempo las solicitudes que le corresponden y responder por sus propios resultados.", "Cumplir con oportunidad sus funciones y asumir la responsabilidad por sus resultados es la conducta del nivel D, inferior al exigido.", false], ["B", "promover que el grupo coordine el reparto de las solicitudes pendientes para cumplir la meta común.", "Proponer al grupo una distribución de la carga para lograr la meta común es promover el trabajo en equipo como articulación de objetivos y metas, conducta del nivel C de Orientación a resultados.", true], ["C", "construir con sus compañeros soluciones a los problemas del centro que solo pueden resolverse en grupo.", "Compartir, discutir y construir soluciones que solo se dan en grupo es el nivel C de Trabajo en equipo. Orientación a resultados, nivel C, vincula el trabajo en equipo con el cumplimiento de las metas del grupo.", false]]}, {"id": "CO-174", "niv": 1, "e": "En la última semana del mes, lo coherente con el nivel C de Orientación a resultados es", "f": "Diccionario de Competencias Comportamentales PGN, Orientación a resultados, nivel C", "o": [["A", "informar que la meta no se alcanzará y pedir que se ajuste para el mes siguiente.", "Renuncia a la meta antes del cierre. El nivel C incluye hacer esfuerzos adicionales para cumplir las metas asignadas.", false], ["B", "concentrarse en las solicitudes sencillas para subir la cifra, aunque las complejas sigan esperando.", "Prioriza la cifra sobre los términos de todas las solicitudes; no refleja el esfuerzo por cumplir la meta tal como fue fijada.", false], ["C", "hacer un esfuerzo adicional esa semana para cumplir la meta asignada.", "Una de las conductas del nivel C de Orientación a resultados es hacer esfuerzos adicionales para cumplir las metas asignadas.", true]]}, {"id": "CO-175", "niv": 1, "e": "Frente a su error en la respuesta enviada, lo que corresponde al auxiliar según el nivel D de Orientación a resultados es", "f": "Diccionario de Competencias Comportamentales PGN, Orientación a resultados, nivel D", "o": [["A", "asumir la responsabilidad por ese resultado y corregirlo.", "El nivel D de Orientación a resultados incluye asumir la responsabilidad por los resultados de sus actividades.", true], ["B", "esperar a que el coordinador lo detecte y le indique cómo corregirlo.", "Deja en otros la responsabilidad por el resultado de su propia actividad.", false], ["C", "explicar que el error se debió a la presión por cumplir la meta del grupo.", "Atribuye el resultado a factores externos en lugar de asumirlo, contrario a la conducta del nivel D.", false]]}]}, {"comp": "comportamental", "rol": "profesional", "tag": "Competencias comportamentales (Diccionario de la Procuraduría) · Niveles profesional, asesor y ejecutivo · Investigación", "texto": "Usted es profesional universitario del Instituto de Estudios del Ministerio Público, adscrito a la Procuraduría, y su empleo exige Investigación en nivel B. El instituto quiere estudiar si las audiencias virtuales han cambiado la duración de los procesos disciplinarios verbales. Necesita un modelo de análisis sólido y el apoyo de varias procuradurías regionales. El director del instituto tiene exigido el nivel A de la misma competencia, y un profesional de una procuraduría regional que colaborará con el estudio tiene exigido el nivel C.", "items": [{"id": "CO-176", "niv": 3, "e": "Para contar con un modelo de análisis sólido, lo que refleja el nivel B de Investigación es", "f": "Diccionario de Competencias Comportamentales PGN, Investigación, nivel B", "o": [["A", "aplicar el modelo de análisis que el instituto ha usado siempre, para conservar la comparabilidad de los resultados.", "No incorpora elementos nuevos ni busca nuevos modelos de investigación, que son las conductas del nivel B.", false], ["B", "proponer un trabajo conjunto con un grupo de investigación de una universidad acreditada para construir el modelo.", "Una de las conductas del nivel B de Investigación es realizar alianzas con instituciones educativas reconocidas para desarrollar nuevos modelos de investigación.", true], ["C", "consultar artículos académicos sobre el tema y adoptar el modelo que más se cite.", "Acudir a las fuentes de información disponibles se relaciona con Gestión de la información, nivel C; no es el desarrollo conjunto de un modelo.", false]]}, {"id": "CO-177", "niv": 2, "e": "Para el director del instituto, la conducta que corresponde al nivel A de Investigación es", "f": "Diccionario de Competencias Comportamentales PGN, Investigación, nivel A", "o": [["A", "aportar información confiable y veraz a los proyectos que adelante el instituto.", "Es una conducta del nivel C de Investigación.", false], ["B", "promover la participación de los servidores en convenios de formación con universidades.", "Buscar programas y convenios de formación para los colaboradores es una conducta del nivel A de Aprendizaje continuo, no de Investigación.", false], ["C", "plantear proyectos sobre las funciones misionales de la entidad y promover estudios sobre cómo investigar.", "El nivel A de Investigación (diseñar y ejecutar estrategias para promover la investigación en asuntos de interés de la Procuraduría) incluye impulsar estudios sobre método de investigación y formular proyectos relacionados con las funciones misionales.", true]]}, {"id": "CO-178", "niv": 3, "e": "Para el profesional de la procuraduría regional que colabora con el estudio, la conducta que corresponde al nivel C de Investigación es", "f": "Diccionario de Competencias Comportamentales PGN, Investigación, nivel C", "o": [["A", "aportar información veraz de su regional y objetivos claros, coherentes con las metas del estudio.", "El nivel C de Investigación (apoyar metodológica y conceptualmente las investigaciones) incluye aportar información confiable y veraz y aportar objetivos claros, concisos y coherentes con las metas organizacionales.", true], ["B", "preparar en su regional las condiciones para recolectar los datos que el instituto necesita.", "Preparar las condiciones para la recolección de datos es la conducta del nivel D, inferior al exigido para este profesional.", false], ["C", "expresar sus ideas sobre el estudio con claridad y escuchar con respeto las de los demás.", "Expresar ideas con claridad y escuchar con atención y respeto es el nivel C de Comunicación, no de Investigación.", false]]}]}, {"comp": "comportamental", "rol": "profesional", "tag": "Competencias comportamentales (Diccionario de la Procuraduría) · Niveles profesional, asesor y ejecutivo · Objetividad", "texto": "Usted es profesional universitario de la Oficina de Planeación de la Procuraduría y su empleo exige Objetividad en nivel B. Varios ciudadanos se han quejado del horario del centro de atención al público de la sede central, y el jefe le pide recomendar si conviene ampliarlo. Usted dispone de los registros de afluencia por franja horaria de los últimos dos años, que muestran además un aumento recurrente de la demanda en diciembre.", "items": [{"id": "CO-179", "niv": 1, "e": "Para responder al jefe, lo que refleja el nivel B de Objetividad es", "f": "Diccionario de Competencias Comportamentales PGN, Objetividad, nivel B", "o": [["A", "consultar a los funcionarios del centro de atención y acoger la opinión de la mayoría.", "Decide por opinión mayoritaria y no por criterios cuantitativos ponderados, que es lo que pide el nivel B.", false], ["B", "recomendar la ampliación del horario, porque varios ciudadanos se han quejado del horario actual.", "Basa la posición en las quejas y no en los datos cuantitativos disponibles, como exige la definición de la competencia.", false], ["C", "evaluar y ponderar los datos de afluencia por franja horaria antes de recomendar una decisión.", "El nivel B de Objetividad (aportar criterios técnicos para las actividades laborales) incluye evaluar y ponderar la información que lleva a tomar decisiones. La competencia se define como adoptar posiciones basadas en criterios cuantitativos.", true]]}, {"id": "CO-180", "niv": 2, "e": "Frente al aumento recurrente de la demanda en diciembre, lo coherente con el nivel B de Objetividad es", "f": "Diccionario de Competencias Comportamentales PGN, Objetividad, nivel B", "o": [["A", "esperar a diciembre para confirmar si la demanda realmente aumenta antes de tomar medidas.", "Desaprovecha los datos que ya muestran la tendencia; el nivel B pide proponer soluciones técnicas para anticiparse a los problemas.", false], ["B", "proponer desde ahora una solución técnica, como reforzar la atención en diciembre.", "Una de las conductas del nivel B de Objetividad es proponer soluciones técnicas para anticiparse a los problemas.", true], ["C", "comparar en enero lo programado con lo ejecutado en diciembre para ajustar el año siguiente.", "Comparar lo programado con lo ejecutado es una conducta del nivel D de Objetividad. No se anticipa al problema.", false]]}, {"id": "CO-181", "niv": 2, "e": "Si el empleo exigiera el nivel A de Objetividad, se esperaría además que el servidor", "f": "Diccionario de Competencias Comportamentales PGN, Objetividad, nivel A", "o": [["A", "analizara causas y efectos de los problemas de atención y tomara decisiones medibles y cuantificables.", "Analizar causas y efectos y tomar decisiones medibles es una conducta del nivel A de Pensamiento analítico, otra competencia del diccionario.", false], ["B", "estandarizara y normalizara cada acción para desarrollar sus funciones.", "Es una conducta del nivel D de Objetividad.", false], ["C", "diseñara indicadores verificables que él y otros pudieran usar para medir los resultados de la atención.", "El nivel A de Objetividad consiste en construir indicadores demostrables para ser utilizados por sí mismo o por otros en el análisis de situaciones complejas, y en construir indicadores para medir los resultados.", true]]}]}, {"comp": "comportamental", "rol": "profesional", "tag": "Competencias comportamentales (Diccionario de la Procuraduría) · Niveles profesional, asesor y ejecutivo · Gestión de la información", "texto": "Usted es profesional universitario de una procuraduría delegada y su empleo exige Gestión de la información en nivel B. Debe preparar el informe semestral de la delegada a partir de los reportes de 32 procuradurías regionales, que llegan por correo, en hojas de cálculo con formatos distintos y algunos en documentos escaneados. Varios reportes traen cifras que no cuadran entre sí. Un periodista le pide por correo la base consolidada, que incluye datos de quejas disciplinarias en curso.", "items": [{"id": "CO-182", "niv": 2, "e": "Para manejar los reportes de las regionales, lo que refleja el nivel B de Gestión de la información es", "f": "Diccionario de Competencias Comportamentales PGN, Gestión de la información, nivel B", "o": [["A", "diseñar y organizar una base de datos para el equipo con la información que llega por los distintos medios.", "El nivel B de Gestión de la información incluye diseñar y organizar bases de datos disponibles para un grupo con información que recibe de diferentes medios.", true], ["B", "diseñar instrumentos para hacer seguimiento a su propio trabajo en la elaboración del informe.", "Diseñar o adaptar instrumentos para seguir el propio trabajo es una conducta del nivel B de Autogestión, no de Gestión de la información.", false], ["C", "solicitar a cada regional los datos que necesita para su informe.", "Solicitar los datos necesarios para sus tareas es una conducta del nivel C, inferior al exigido.", false]]}, {"id": "CO-183", "niv": 3, "e": "Antes de usar las cifras en el informe, lo que refleja el nivel B de Gestión de la información es", "f": "Diccionario de Competencias Comportamentales PGN, Gestión de la información, nivel B", "o": [["A", "incluir todos los datos recibidos, porque los reportaron servidores públicos en ejercicio de sus funciones.", "Usa la información sin evaluarla. La competencia se define como acceder, evaluar y utilizar información relevante y pertinente.", false], ["B", "valorar si la información es confiable y pertinente, y depurar la que no lo sea.", "Una de las conductas del nivel B de Gestión de la información es consolidar y valorar la información necesaria para el óptimo desarrollo de sus funciones.", true], ["C", "usar solo la información de las regionales que respondieron primero, para cumplir el plazo.", "Selecciona los datos por la fecha de llegada y no por su pertinencia o calidad, lo que no corresponde a valorar la información.", false]]}, {"id": "CO-184", "niv": 2, "e": "Frente a la solicitud del periodista, lo coherente con la definición de Gestión de la información del diccionario es", "f": "Diccionario de Competencias Comportamentales PGN, Gestión de la información, nivel B", "o": [["A", "responderle que la información se entregará cuando concluyan los procesos que contiene.", "También es una decisión personal que no aplica los lineamientos de la entidad sobre acceso a la información, que es lo que pide la definición de la competencia.", false], ["B", "tramitar la solicitud conforme a los lineamientos de la entidad sobre acceso a la información.", "El diccionario define Gestión de la i a intervención, sus plazos y la instancia competente.", "El nivel C de Orientación al usuario consiste en guiar en procesos, procedimientos, plazos o instancias relacionados con las solicitudes de los usuarios.", true]]}, {"id": "CO-186", "niv": 2, "e": "Frente a la duda de la ciudadana sobre los documentos, lo coherente con el nivel C de Orientación al usuario es", "f": "Diccionario de Competencias Comportamentales PGN, Orientación al usuario, nivel C", "o": [["A", "estar atento a lo que ella necesita y darle la información precisa que su solicitud requiere.", "Las conductas del nivel C de Orientación al usuario incluyen brindar información de acuerdo con los requerimientos de los usuarios y estar atento a esos requerimientos para darles la información necesaria.", true], ["B", "diseñar una estrategia para que el centro resuelva mejor este tipo de solicitudes en el futuro.", "Diseñar e implementar estrategias para recibir y resolver solicitudes es propio del nivel A; no atiende la necesidad presente de la ciudadana.", false], ["C", "pedirle que consulte la página web de la entidad, donde está la información de todos los trámites.", "Remite a una fuente general en vez de responder a su requerimiento concreto, que es lo que describe el nivel C.", false]]}, {"id": "CO-187", "niv": 3, "e": "La tarea de averiguar, con una encuesta, qué tan conformes quedan los ciudadanos con la atención recibida corresponde, según el diccionario,", "f": "Diccionario de Competencias Comportamentales PGN, Orientación al usuario, nivel B", "o": [["A", "al nivel B de Objetividad.", "Objetividad trata de adoptar posiciones con criterios cuantitativos; los estudios de satisfacción del usuario el diccionario los ubica expresamente en Orientación al usuario.", false], ["B", "al nivel B de Orientación al usuario.", "El nivel B de Orientación al usuario (anticiparse a las necesidades y mantener la relación hasta lograr la satisfacción) incluye realizar estudios orientados a la satisfacción del us
