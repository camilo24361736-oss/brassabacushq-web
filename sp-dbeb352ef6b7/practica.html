", "habilitar canales electrónicos para recibir peticiones por fuera del horario de atención.", "Los canales electrónicos son otro deber de la entidad, pero lo que la medida vulnera es la atención de quienes ya ingresaron en el horario.", false]]}, {"id": "AU-133", "niv": 1, "e": "Respecto de la tercera medida, es correcto afirmar que", "f": "Ley 1437 de 2011, art. 9, num. 4", "o": [["A", "es válida solo si el instituto entrega la copia sin costo en una ventanilla distinta.", "La gratuidad de la copia no corrige el problema: la prohibición recae sobre la exigencia misma del documento que ya tiene la entidad.", false], ["B", "es válida, porque el permiso anterior es un requisito del trámite y la carga de aportarlo es del usuario.", "El CPACA prohíbe exigir documentos que reposen en la entidad, aunque sean necesarios para el trámite: el instituto debe consultarlos en su propio archivo.", false], ["C", "está prohibida, porque el instituto no puede exigir documentos que reposan en la propia entidad.", "El numeral 4 del artículo 9 del CPACA prohíbe a las autoridades exigir constancias, certificaciones o documentos que reposen en la respectiva entidad.", true]]}]}, {"comp": "atencion_usuario", "rol": "general", "tag": "Atención al usuario · Deberes especiales de los servidores de la Procuraduría", "texto": "Usted es servidor de una procuraduría provincial. Un campesino le cuenta que fue tres veces a la alcaldía de su municipio a presentar una solicitud escrita para que arreglen el camino de acceso a su vereda y que en todas le dijeron que no la recibían porque «no era el día de radicación». Le pide ayuda para que alguien reciba su solicitud. Además, quiere saber qué consecuencias tiene para los servidores de la alcaldía que no atiendan las peticiones ni respeten los términos para resolverlas.", "items": [{"id": "AU-134", "niv": 2, "e": "Frente a la solicitud que la alcaldía se abstuvo de recibir, usted", "f": "Ley 1755 de 2015, art. 1 (art. 23 de la Ley 1437 de 2011)", "o": [["A", "debe orientarlo para que la presente en la personería, única autoridad que puede recibirla en sustitución.", "El deber del artículo 23 del CPACA recae también en los servidores de la Procuraduría y de la Defensoría, no solo en los personeros.", false], ["B", "puede recibirla en sustitución de la alcaldía y cerciorarse de que esta la tramite debidamente.", "El artículo 23 del CPACA faculta a los servidores de la Procuraduría, de la Defensoría y a los personeros para recibir, en sustitución de las autoridades, las peticiones que estas se abstuvieron de recibir, y cerciorarse de su trámite.", true], ["C", "debe abstenerse de recibirla, porque la Procuraduría no es la autoridad competente para arreglar vías.", "La Procuraduría no resuelve la petición, pero sí la recibe en sustitución para garantizar el derecho de petición, que es lo que el campesino necesita.", false]]}, {"id": "AU-135", "niv": 2, "e": "Además de recibir la solicitud, los servidores de la Procuraduría pueden, si es necesario", "f": "Ley 1755 de 2015, art. 1 (art. 23 de la Ley 1437 de 2011)", "o": [["A", "intervenir ante la alcaldía para exigirle que cumpla sus deberes legales en el caso concreto.", "El artículo 23 del CPACA dispone que, si fuere necesario, estos servidores intervendrán ante las autoridades competentes para exigirles, en cada caso concreto, el cumplimiento de sus deberes legales.", true], ["B", "ordenar a la alcaldía, mediante acto administrativo, que ejecute la obra solicitada.", "La norma no otorga a la Procuraduría la facultad de ordenar la ejecución de obras; le permite intervenir para exigir el cumplimiento de los deberes legales.", false], ["C", "resolver de fondo la solicitud en lugar de la alcaldía si esta no lo hace a tiempo.", "La Procuraduría no sustituye a la alcaldía en la decisión de fondo; su papel es asistir al ciudadano y exigir que la autoridad competente cumpla.", false]]}, {"id": "AU-136", "niv": 1, "e": "Sobre la pregunta del campesino, la falta de atención a las peticiones y a los términos para resolverlas", "f": "Ley 1755 de 2015, art. 1 (arts. 14 y 31 de la Ley 1437 de 2011)", "o": [["A", "solo genera responsabilidad fiscal si ocasiona un daño al patrimonio del municipio.", "El CPACA califica esa conducta como falta disciplinaria, con independencia de que exista o no un daño patrimonial.", false], ["B", "constituye falta disciplinaria para el servidor público responsable.", "El artículo 31 del CPACA dispone que la falta de atención a las peticiones y a los términos para resolver constituye falta para el servidor público y da lugar a sanciones según el régimen disciplinario.", true], ["C", "da lugar únicamente a que la petición se entienda resuelta a favor del peticionario.", "El silencio con efecto de aceptación es excepcional (por ejemplo, en peticiones de documentos) y no excluye la responsabilidad disciplinaria del servidor.", false]]}]}, {"comp": "atencion_usuario", "rol": "general", "tag": "Atención al usuario · Información pública clasificada y reservada", "texto": "Un ciudadano presenta ante una ESE hospital departamental una solicitud de acceso a la información en la que pide: el contrato de suministro de medicamentos suscrito el año anterior; la historia clínica de un vecino suyo, quien no lo ha autorizado para pedirla; y un informe de auditoría interna que, además de datos generales de la gestión, incluye en un anexo los diagnósticos de algunos pacientes identificados con nombre. El jefe de la oficina jurídica le exige al ciudadano que explique para qué quiere la información antes de darle trámite.", "items": [{"id": "AU-137", "niv": 1, "e": "La exigencia del jefe de la oficina jurídica es", "f": "Ley 1712 de 2014, arts. 3 (principio de no discriminación) y 10", "o": [["A", "procedente solo frente al contrato, porque el acceso a la información contractual exige un interés directo.", "La información contractual es pública y de publicación obligatoria (art. 10 de la Ley 1712 de 2014); no se exige interés directo para acceder a ella.", false], ["B", "procedente, porque la entidad debe valorar si el interés del solicitante justifica el acceso.", "El principio de no discriminación de la Ley 1712 de 2014 impide exigir expresión de causa o motivación; el acceso a la información pública no depende del interés del solicitante.", false], ["C", "improcedente, porque no puede exigirse al solicitante que exprese la causa o motivación de su solicitud.", "El artículo 3 de la Ley 1712 de 2014 (principio de no discriminación) obliga a entregar información a todas las personas sin exigir expresión de causa o motivación.", true]]}, {"id": "AU-138", "niv": 3, "e": "Frente a la solicitud de la historia clínica del vecino, la ESE debe", "f": "Ley 1755 de 2015, art. 1 (arts. 24, num. 3 y parágrafo, y 25 de la Ley 1437 de 2011); Ley 1712 de 2014, art. 18", "o": [["A", "remitir la solicitud al vecino para que decida, dentro de los diez días siguientes, si autoriza su entrega.", "La ley no prevé ese traslado al titular: la entidad debe resolver la solicitud y, como el solicitante no está autorizado, negarla motivadamente.", false], ["B", "negarla de forma motivada, porque el solicitante no está autorizado para pedir esa información del vecino.", "La historia clínica está protegida por la intimidad (art. 24, num. 3, del CPACA y art. 18 de la Ley 1712 de 2014), y el parágrafo del artículo 24 limita su solicitud al titular, sus apoderados o personas autorizadas con facultad expresa. El rechazo debe ser motivado.", true], ["C", "entregarla, porque toda información que reposa en una entidad pública es pública sin excepción.", "La información en poder de los sujetos obligados se presume pública, pero admite excepciones legales, como la protección de la intimidad de las personas.", false]]}, {"id": "AU-139", "niv": 2, "e": "Respecto del informe de auditoría con el anexo de diagnósticos, la ESE debe", "f": "Ley 1712 de 2014, art. 21", "o": [["A", "entregar una versión pública que mantenga la reserva solo de la parte indispensable.", "El artículo 21 de la Ley 1712 de 2014 dispone que, cuando no toda la información de un documento está protegida, debe hacerse una versión pública que mantenga la reserva únicamente de la parte indispensable.", true], ["B", "entregar el informe completo, porque el interés público en la auditoría prevalece sobre la intimidad de los pacientes.", "Los diagnósticos de pacientes identificados están protegidos; la ley no autoriza su divulgación por el interés en la auditoría, sino una versión pública.", false], ["C", "negar todo el informe, porque contiene datos sensibles de pacientes.", "La reserva parcial no se extiende a todo el documento: el artículo 21 de la Ley 1712 de 2014 ordena entregar la parte no protegida.", false]]}]}, {"comp": "atencion_usuario", "rol": "general", "tag": "Atención al usuario · Respuesta a solicitudes de información y costos de reproducción", "texto": "En la Oficina de Atención al Ciudadano de una entidad del orden nacional se reciben dos solicitudes de acceso a la información. La primera la hace de palabra, en la ventanilla, una estudiante que pide el informe de gestión del último año; el documento existe en formato PDF y ella deja su correo electrónico. La segunda la presenta por escrito un investigador que pide copias impresas de 400 folios de documentos públicos que solo existen en papel. Un compañero propone responder a la estudiante de forma verbal y cobrarle al investigador, además de las fotocopias, el valor de las horas que el servidor dedique a sacarlas.", "items": [{"id": "AU-140", "niv": 2, "e": "La respuesta a la solicitud que la estudiante presentó de palabra debe darse", "f": "Decreto 1069 de 2015, art. 2.2.3.12.10 (adicionado por el Decreto 1166 de 2016); Ley 1712 de 2014, art. 26", "o": [["A", "por el medio que elija el servidor que la atendió, siempre que quede registro en el sistema.", "No es el servidor quien escoge el medio: la respuesta debe ser escrita y el solicitante puede elegir el medio por el cual recibirla.", false], ["B", "de forma verbal en el mismo acto, porque así fue presentada la solicitud.", "La forma de presentación no define la de la respuesta: para las solicitudes verbales de acceso a información, la norma exige respuesta escrita.", false], ["C", "por escrito, después de radicarla y dejar la constancia respectiva.", "El artículo 2.2.3.12.10 del Decreto 1069 de 2015 dispone que la respuesta a las peticiones verbales de acceso a información, una vez radicadas y con su constancia, se da por escrito, conforme al artículo 26 de la Ley 1712 de 2014.", true]]}, {"id": "AU-141", "niv": 2, "e": "Como el informe está en formato digital y la estudiante suministró su correo electrónico, la entidad", "f": "Decreto 1081 de 2015, art. 2.1.1.3.1.5; Ley 1712 de 2014, arts. 3 y 26", "o": [["A", "debe citarla a la sede para que consulte el documento, porque la información digital no se reproduce para particulares.", "La entidad debe facilitar el acceso por el medio elegido; no puede limitarlo a la consulta presencial de un documento digital.", false], ["B", "puede cobrarle la reproducción en medio magnético, según el acto de costos de la entidad.", "El cobro de reproducción no procede cuando la información es digital y se envía al correo indicado por el solicitante.", false], ["C", "debe enviárselo a ese correo electrónico sin cobrarle ningún costo de reproducción.", "El artículo 2.1.1.3.1.5 del Decreto 1081 de 2015 dispone que, si la información está en formato electrónico y se tiene el correo del solicitante, debe enviarse por ese medio sin costo de reproducción.", true]]}, {"id": "AU-142", "niv": 3, "e": "Frente a la propuesta de cobrarle al investigador el tiempo del servidor, es correcto afirmar que", "f": "Decreto 1081 de 2015, arts. 2.1.1.3.1.5 y 2.1.1.3.1.6; Ley 1712 de 2014, art. 3 (principio de gratuidad)", "o": [["A", "procede solo cuando el volumen supera cien folios, porque la gratuidad se limita a solicitudes pequeñas.", "La norma no establece un umbral de folios: en todos los casos solo se cobra el costo de reproducción, sin el tiempo del servidor.", false], ["B", "no procede, porque los costos de reproducción excluyen el valor del tiempo de quien hace las copias.", "El artículo 2.1.1.3.1.5 del Decreto 1081 de 2015 define los costos de reproducción como los valores directos para obtener la información, excluyendo el valor del tiempo del servidor, empleado o contratista que realiza la reproducción.", true], ["C", "procede, siempre que el valor esté fijado en el acto que motiva los costos de reproducción de la entidad.", "El acto de motivación de costos fija el costo unitario por formato, pero no puede incluir conceptos que la norma excluye, como el tiempo del servidor.", false]]}]}, {"comp": "atencion_usuario", "rol": "profesional", "tag": "Atención al usuario · Niveles profesional, asesor y ejecutivo · Reserva de la información y recurso de insistencia", "texto": "Usted es profesional universitario de la oficina jurídica de la alcaldía de un municipio. Un ciudadano solicitó copia completa del expediente disciplinario que adelanta la Oficina de Control Disciplinario Interno contra un secretario de despacho. El proceso está en etapa de investigación y aún no se ha formulado pliego de cargos. El alcalde le pide proyectar la respuesta y le pregunta qué puede hacer el ciudadano si no está de acuerdo con la negativa.", "items": [{"id": "AU-143", "niv": 3, "e": "La negativa a entregar el expediente puede fundarse en que", "f": "Ley 1952 de 2019, art. 115; Ley 1712 de 2014, art. 19, literal d)", "o": [["A", "la actuación disciplinaria es reservada hasta que se formule pliego de cargos o se ordene el archivo definitivo.", "El artículo 115 de la Ley 1952 de 2019 dispone que las actuaciones disciplinarias son reservadas hasta que se cite a audiencia y se formule pliego de cargos o se emita la providencia que ordene el archivo definitivo; en concordancia, el literal d) del artículo 19 de la Ley 1712 de 2014 exceptúa esa información mientras no se formule pliego de cargos.", true], ["B", "toda actuación disciplinaria es reservada de forma permanente para proteger el buen nombre del investigado.", "La reserva no es permanente: el artículo 115 de la Ley 1952 de 2019 la limita hasta la formulación del pliego de cargos o el archivo definitivo.", false], ["C", "el solicitante no es sujeto procesal ni acreditó un interés directo en el resultado del proceso.", "El acceso a la información pública no depende del interés del solicitante; la negativa debe fundarse en una excepción legal.", false]]}, {"id": "AU-144", "niv": 2, "e": "El acto que niegue la solicitud por reserva debe", "f": "Ley 1755 de 2015, art. 1 (art. 25 de la Ley 1437 de 2011)", "o": [["A", "estar motivado e informar que contra él proceden los recursos de reposición y apelación.", "Contra la decisión que rechaza la petición por reserva legal no procede recurso alguno, salvo la insistencia del artículo 26 del CPACA.", false], ["B", "comunicarse por correo electrónico sin motivación, porque la reserva opera por mandato legal.", "El artículo 25 del CPACA exige que toda decisión que rechace la petición de información sea motivada y se notifique.", false], ["C", "explicar sus razones, citar las normas que impiden la entrega y notificarse al ciudadano.", "El artículo 25 del CPACA dispone que la decisión que rechace la petición de informaciones o documentos será motivada, indicará en forma precisa las disposiciones legales que impiden la entrega y se notificará al peticionario.", true]]}, {"id": "AU-145", "niv": 3, "e": "Si el ciudadano insiste en su solicitud, la decisión de negarla o aceptarla corresponde a", "f": "Ley 1755 de 2015, art. 1 (art. 26 de la Ley 1437 de 2011)", "o": [["A", "el juez administrativo, en única instancia, por tratarse de una autoridad municipal.", "El artículo 26 del CPACA asigna la insistencia al juez administrativo cuando se trata de autoridades distritales y municipales, que decide en única instancia.", true], ["B", "el tribunal administrativo con jurisdicción en el lugar de los documentos, en única instancia.", "El tribunal administrativo decide la insistencia frente a autoridades nacionales, departamentales o del Distrito Capital; la alcaldía es una autoridad municipal.", false], ["C", "la procuraduría provincial, en ejercicio del poder preferente sobre la oficina de control disciplinario.", "El poder preferente se refiere a asumir procesos disciplinarios; la decisión sobre la insistencia en materia de reserva es judicial.", false]]}]}, {"comp": "atencion_usuario", "rol": "general", "tag": "Atención al usuario · Peticiones entre autoridades", "texto": "El martes 17 de agosto de 2027, la Secretaría de Salud de un municipio recibió un oficio de la personería municipal, que adelanta una investigación disciplinaria contra un servidor de esa secretaría. La personería pide información sobre las auditorías realizadas en el primer semestre y copia de unos documentos que contienen datos de historias clínicas de pacientes, necesarios para la investigación. Ese mismo día, un ciudadano pidió a la secretaría la misma información sobre las auditorías. No hay festivos en ese periodo.", "items": [{"id": "AU-146", "niv": 3, "e": "El último día para que la secretaría responda la solicitud de la personería es el", "f": "Ley 1755 de 2015, art. 1 (art. 30 de la Ley 1437 de 2011); cálculo de días hábiles", "o": [["A", "viernes 27 de agosto de 2027.", "Resulta de contar diez días calendario; el término se cuenta en días hábiles.", false], ["B", "martes 31 de agosto de 2027.", "Cuando una autoridad pide información o documentos a otra, el término es de no más de diez días (art. 30 del CPACA): 18 a 20 de agosto (3), 23 a 27 (8), 30 y 31 (10).", true], ["C", "martes 7 de septiembre de 2027.", "Aplica el término general de quince días; entre autoridades rige el término especial de diez días.", false]]}, {"id": "AU-147", "niv": 3, "e": "Frente a los documentos con datos de historias clínicas que pide la personería, la secretaría debe", "f": "Ley 1755 de 2015, art. 1 (art. 27 de la Ley 1437 de 2011)", "o": [["A", "negarlos, porque la historia clínica solo puede entregarse al paciente o a quien este autorice expresamente.", "Esa limitación opera frente a particulares; el artículo 27 del CPACA hace inoponible la reserva a las autoridades administrativas competentes que la piden para ejercer sus funciones.", false], ["B", "entregarlos únicamente si la personería obtiene antes una orden judicial.", "La ley no exige orden judicial a la autoridad administrativa competente; basta que pida la información para el ejercicio de sus funciones.", false], ["C", "entregarlos, porque la reserva no se opone a la personería que los requiere para sus funciones.", "El artículo 27 del CPACA dispone que el carácter reservado no es oponible a las autoridades administrativas que, siendo competentes, piden la información para el debido ejercicio de sus funciones, y les impone asegurar la reserva.", true]]}, {"id": "AU-148", "niv": 1, "e": "La petición del ciudadano sobre las auditorías debe resolverse", "f": "Ley 1755 de 2015, art. 1 (arts. 14, num. 1, y 30 de la Ley 1437 de 2011)", "o": [["A", "dentro de los treinta días siguientes, porque se trata de información que requiere consolidación.", "El término de treinta días es para consultas; la necesidad de consolidar datos permite, a lo sumo, ampliar el término informándolo antes de su vencimiento.", false], ["B", "dentro de los diez días siguientes a su recepción, por ser una petición de información.", "El numeral 1 del artículo 14 del CPACA fija diez días para las peticiones de documentos y de información.", true], ["C", "dentro de los quince días siguientes, porque el término de diez días solo aplica a las peticiones entre autoridades.", "El término de diez días también aplica a los particulares que piden documentos o información (art. 14, num. 1); el artículo 30 lo prevé además para las peticiones entre autoridades.", false]]}]}, {"comp": "atencion_usuario", "rol": "general", "tag": "Atención al usuario · Datos sensibles y autorización para su tratamiento", "texto": "La Oficina de Atención al Ciudadano de una entidad del orden nacional rediseña su formulario web de PQRSD. El borrador pide como campos obligatorios el nombre, el documento de identidad y la dirección de notificación, y además la pertenencia étnica, la orientación sexual y si la persona tiene alguna discapacidad, con el fin de producir estadísticas de atención con enfoque diferencial. También se plantea capturar la huella dactilar de quienes acudan a la sede presencial, para agilizar su identificación en futuras visitas.", "items": [{"id": "AU-149", "niv": 1, "e": "De los datos que pide la entidad, son datos sensibles", "f": "Ley 1581 de 2012, art. 5", "o": [["A", "la pertenencia étnica, la orientación sexual, la información sobre discapacidad y la huella dactilar.", "El artículo 5 de la Ley 1581 de 2012 incluye entre los datos sensibles los que revelan el origen racial o étnico, los relativos a la salud y a la vida sexual, y los datos biométricos, como la huella.", true], ["B", "solo la orientación sexual, porque los demás datos se piden para el enfoque diferencial y no generan discriminación.", "La finalidad del tratamiento no cambia la naturaleza del dato: el origen étnico, la salud y los datos biométricos son sensibles según la ley.", false], ["C", "el documento de identidad y la dirección de notificación, porque permiten ubicar al titular.", "Son datos personales, pero no sensibles: la ley define como sensibles los que afectan la intimidad o cuyo uso indebido puede generar discriminación.", false]]}, {"id": "AU-150", "niv": 2, "e": "Al pedir la autorización para tratar la pertenencia étnica, la orientación sexual y la discapacidad, la entidad debe informar al titular, entre otros aspectos, que", "f": "Ley 1581 de 2012, arts. 9 y 12, literal b)", "o": [["A", "la autorización se entiende otorgada con el solo envío del formulario, sin necesidad de conservar prueba de ella.", "La autorización debe ser previa e informada y obtenerse por un medio que pueda ser objeto de consulta posterior (art. 9 de la Ley 1581 de 2012).", false], ["B", "responderlas es obligatorio para radicar la PQRSD, porque la entidad debe caracterizar a sus usuarios.", "Condicionar la radicación a entregar datos sensibles desconoce el carácter facultativo de esas respuestas y el deber de recibir y radicar las peticiones.", false], ["C", "responder esas preguntas es facultativo, por tratarse de datos sensibles.", "El literal b) del artículo 12 de la Ley 1581 de 2012 obliga a informar al titular el carácter facultativo de la respuesta a las preguntas sobre datos sensibles.", true]]}, {"id": "AU-151", "niv": 2, "e": "Para tratar la huella dactilar de los usuarios con la finalidad descrita, por regla general la entidad necesita", "f": "Ley 1581 de 2012, arts. 5 y 6", "o": [["A", "la autorización explícita de cada titular, por tratarse de un dato biométrico.", "La huella es un dato biométrico y, por tanto, sensible (art. 5); el artículo 6 de la Ley 1581 de 2012 prohíbe tratar datos sensibles salvo, entre otros casos, con autorización explícita del titular.", true], ["B", "la autorización del jefe de la entidad, porque se trata de una base de datos pública.", "La autorización la da el titular del dato, no el jefe de la entidad responsable del tratamiento.", false], ["C", "solo publicar un aviso de privacidad en la sede, por ser una entidad pública.", "El aviso de privacidad informa sobre las políticas de tratamiento, pero no reemplaza la autorización explícita que exige el tratamiento de datos sensibles.", false]]}]}, {"comp": "atencion_usuario", "rol": "tecnico", "tag": "Atención al usuario · Niveles técnico, administrativo y operativo · Consultas y reclamos sobre datos personales", "texto": "Usted es técnico administrativo de la Oficina de Atención al Ciudadano de una alcaldía, que es responsable de la base de datos de beneficiarios de sus programas sociales. El lunes 6 de septiembre de 2027 una beneficiaria presenta un reclamo completo en el que pide corregir su dirección y suprimir un número de teléfono que no es suyo. Dos semanas antes, la misma señora había acudido directamente a la Superintendencia de Industria y Comercio para quejarse por el mal manejo de sus datos, sin haber presentado antes ninguna solicitud a la alcaldía. No hay festivos en ese periodo.", "items": [{"id": "AU-152", "niv": 1, "e": "Una vez recibido el reclamo completo, la alcaldía debe incluir en la base de datos la leyenda «reclamo en trámite» y su motivo", "f": "Ley 1581 de 2012, art. 15, num. 2", "o": [["A", "solo si la beneficiaria lo pide expresamente en su escrito de reclamo.", "La inclusión de la leyenda es un deber legal del responsable una vez recibe el reclamo completo; no depende de que el titular la pida.", false], ["B", "a más tardar dos días hábiles después, y conservarla mientras el reclamo no se resuelva.", "El numeral 2 del artículo 15 de la Ley 1581 de 2012 ordena incluir la leyenda «reclamo en trámite» y su motivo en no más de dos días hábiles y mantenerla hasta que se decida el reclamo.", true], ["C", "dentro de los cinco días siguientes, y retirarla cuando venza el término para responder.", "El plazo de cinco días es para requerir al interesado cuando el reclamo está incompleto; además, la leyenda se mantiene hasta que el reclamo se decida, no hasta que venza el término.", false]]}, {"id": "AU-153", "niv": 3, "e": "Si no es necesario ampliar el término, el último día para atender el reclamo es el", "f": "Ley 1581 de 2012, art. 15, num. 3; cálculo de días hábiles", "o": [["A", "lunes 20 de septiembre de 2027.", "Resulta de aplicar el término de diez días hábiles, que corresponde a las consultas (art. 14), no a los reclamos.", false], ["B", "lunes 27 de septiembre de 2027.", "El reclamo se atiende en máximo quince días hábiles contados desde el día siguiente a su recibo: 7 a 10 de septiembre (4), 13 a 17 (9), 20 a 24 (14) y lunes 27 (15).", true], ["C", "jueves 7 de octubre de 2027.", "Suma los ocho días hábiles de ampliación, que solo proceden si se informa al interesado el motivo de la demora; el enunciado descarta la ampliación.", false]]}, {"id": "AU-154", "niv": 2, "e": "Sobre la queja que la beneficiaria presentó ante la Superintendencia de Industria y Comercio, es correcto afirmar que", "f": "Ley 1581 de 2012, arts. 16 y 19", "o": [["A", "solo podía presentarla después de agotar el trámite de consulta o reclamo ante la alcaldía.", "El artículo 16 de la Ley 1581 de 2012 establece como requisito de procedibilidad agotar el trámite de consulta o reclamo ante el responsable o el encargado del tratamiento antes de acudir a la Superintendencia.", true], ["B", "procedía directamente, porque la Superintendencia es la autoridad de protección de datos personales.", "La Superintendencia es la autoridad de protección de datos (art. 19), pero la ley exige agotar antes el trámite ante el responsable o encargado.", false], ["C", "debía presentarla ante la Procuraduría, que vigila el tratamiento de datos personales en las entidades públicas.", "La Ley 1581 de 2012 asigna la vigilancia del tratamiento de datos personales a la Superintendencia de Industria y Comercio, también frente a entidades públicas.", false]]}]}, {"comp": "atencion_usuario", "rol": "general", "tag": "Atención al usuario · Datos públicos y circulación restringida", "texto": "La Oficina de Atención al Ciudadano de una procuraduría regional recibe dos solicitudes sobre un profesional universitario de la entidad: un periodista pregunta si esa persona es servidor de la Procuraduría y qué cargo ocupa; un particular pide su dirección de residencia y su número de celular personal porque quiere «hablar con él directamente». Además, un coordinador propone publicar en la página web de la entidad el listado de las personas que presentaron quejas el último mes, con su nombre, su número de cédula y el asunto de cada queja, para demostrar transparencia.", "items": [{"id": "AU-155", "niv": 2, "e": "La información que pide el periodista", "f": "Decreto 1074 de 2015, art. 2.2.2.25.1.3, num. 2 (Decreto 1377 de 2013, art. 3); Ley 1712 de 2014, art. 9, literal c)", "o": [["A", "es un dato privado que solo puede suministrarse con autorización del servidor.", "La calidad de servidor público es un dato público según la reglamentación de la Ley 1581 de 2012; no requiere autorización del titular.", false], ["B", "es información reservada, porque revela la estructura de personal de la entidad.", "La estructura y el directorio de servidores son información que los sujetos obligados deben publicar (art. 9 de la Ley 1712 de 2014); no están sometidos a reserva.", false], ["C", "es un dato público, porque ser servidor público no es información privada.", "El reglamento de la Ley 1581 de 2012 (art. 2.2.2.25.1.3 del Decreto 1074 de 2015) considera datos públicos, entre otros, los relativos a la profesión u oficio y a la calidad de servidor público.", true]]}, {"id": "AU-156", "niv": 3, "e": "Frente a la solicitud del particular sobre la dirección y el celular personal del servidor, la entidad debe", "f": "Ley 1712 de 2014, arts. 6, literal c), 9, literal c), y 18, literal a)", "o": [["A", "entregarlos, porque los datos de contacto de los servidores públicos hacen parte de la información mínima que se publica.", "La información mínima que se publica corresponde al directorio institucional; la dirección de residencia y el celular personal pertenecen al ámbito privado del servidor.", false], ["B", "entregarlos solo si el particular explica para qué los necesita y firma un compromiso de confidencialidad.", "El motivo del solicitante no convierte en accesible un dato privado del servidor; la entidad debe negar la solicitud de forma motivada.", false], ["C", "negarlos de manera motivada y por escrito, porque son datos del ámbito privado del servidor.", "Es información pública clasificada (art. 6, literal c, de la Ley 1712 de 2014), cuyo acceso puede negarse de manera motivada y por escrito cuando puede dañar el derecho a la intimidad (art. 18, literal a).", true]]}, {"id": "AU-157", "niv": 1, "e": "La propuesta del coordinador sobre el listado de quejosos", "f": "Ley 1581 de 2012, art. 4, literal f)", "o": [["A", "desconoce la protección de datos, porque pone en internet datos personales no públicos sin acceso controlado.", "El principio de acceso y circulación restringida (art. 4, literal f, de la Ley 1581 de 2012) prohíbe poner datos personales no públicos en internet u otros medios masivos, salvo que el acceso sea técnicamente controlable.", true], ["B", "es válida si el listado se publica solo durante el mes siguiente a la presentación de las quejas.", "Limitar el tiempo de publicación no corrige la divulgación masiva e indebida de datos personales que no son públicos.", false], ["C", "es válida, porque la publicación proactiva de información es un deber de los sujetos obligados y fortalece la transparencia.", "La divulgación proactiva se refiere a la información pública sobre la actividad estatal; no autoriza a publicar datos personales de los ciudadanos que presentan quejas.", false]]}]}, {"comp": "atencion_usuario", "rol": "general", "tag": "Atención al usuario · Atención incluyente a personas con discapacidad", "texto": "Usted atiende el punto presencial de servicio al ciudadano de una gobernación. Llega un hombre ciego que se orienta con bastón y pide información sobre un trámite. Después llega una mujer usuaria de silla de ruedas, acompañada por su hermano, quien empieza a explicar el caso mientras ella permanece en silencio. Más tarde, una persona con discapacidad intelectual pide que la respuesta a su petición se le entregue en un formato de lectura fácil, con frases cortas e imágenes; la gobernación puede hacerlo sin un costo desproporcionado.", "items": [{"id": "AU-158", "niv": 1, "e": "Para guiar al hombre ciego hasta la ventanilla, lo adecuado es", "f": "Departamento Nacional de Planeación, Manual para la atención al ciudadano; Función Pública, Protocolo de servicio a las ciudadanías", "o": [["A", "pedirle que espere a un familiar o acompañante que pueda llevarlo hasta la ventanilla.", "Hacer depender la atención de un acompañante desconoce la autonomía de la persona y su derecho a atención especial y preferente (art. 5, num. 6, del CPACA).", false], ["B", "ofrecerle ayuda, preguntarle cómo quiere ser guiado y no halarlo del brazo.", "Los protocolos de servicio al ciudadano (DNP y Función Pública) recomiendan preguntar a la persona con discapacidad si necesita ayuda y cómo, no halarla del brazo o la ropa y mantenerla informada.", true], ["C", "tomarlo firmemente del brazo y conducirlo sin hablarle, para no distraerlo.", "Los protocolos de servicio indican no halar del brazo o de la ropa a la persona ciega y mantenerla informada de lo que se hace.", false]]}, {"id": "AU-159", "niv": 2, "e": "Frente a la mujer usuaria de silla de ruedas y su acompañante, usted debe", "f": "Función Pública, Protocolo de servicio a las ciudadanías (atención a personas con discapacidad); Ley 1618 de 2013, art. 2", "o": [["A", "dirigirse a ella y dejar que ella indique si hace la gestión directamente o prefiere que la haga su hermano.", "El protocolo de servicio de Función Pública señala que, cuando la persona con discapacidad lleva un acompañante, es ella quien indica si realiza la gestión directamente o si prefiere que la haga su acompañante.", true], ["B", "atender al hermano, porque es quien explica el caso y así se agiliza la atención.", "Dirigirse solo al acompañante ignora a la persona con discapacidad, que es la titular del trámite y quien decide cómo se adelanta.", false], ["C", "pedir al hermano que se retire de la ventanilla para que la mujer sea atendida sin intermediarios ni interferencias.", "No corresponde al servidor excluir al acompañante; es la persona con discapacidad quien decide si hace la gestión ella misma o con su apoyo.", false]]}, {"id": "AU-160", "niv": 3, "e": "Entregar la respuesta en formato de lectura fácil es un ejemplo de", "f": "Ley 1996 de 2019, art. 3, num. 6; Ley 1618 de 2013, arts. 1 y 2", "o": [["A", "rehabilitación integral, porque mejora la integración social de la persona con discapacidad.", "La rehabilitación integral se refiere a procesos terapéuticos, educativos y formativos (art. 2 de la Ley 1618 de 2013), no a la forma de comunicar una respuesta.", false], ["B", "ajuste razonable, porque adapta la atención a un caso particular sin imponer una carga desproporcionada.", "Los ajustes razonables son modificaciones y adaptaciones que no imponen una carga desproporcionada o indebida, requeridas en un caso particular para garantizar a las personas con discapacidad el ejercicio de sus derechos en igualdad de condiciones (art. 3, num. 6, de la Ley 1996 de 2019).", true], ["C", "acción afirmativa, porque es una política general dirigida a favorecer a un grupo de personas con discapacidad.", "Las acciones afirmativas son políticas o medidas dirigidas a grupos (art. 2, num. 3, de la Ley 1618 de 2013); aquí se trata de una adaptación para una persona en un caso concreto.", false]]}]}, {"comp": "atencion_usuario", "rol": "general", "tag": "Atención al usuario · Atención a usuarios alterados", "texto": "En la sala de atención de una procuraduría provincial, un ciudadano llega furioso porque, según él, lleva dos meses sin respuesta a una queja contra un funcionario de su municipio. Habla en voz alta, golpea el mostrador y dice que «nadie en esta entidad sirve para nada». Usted revisa el sistema y advierte que la respuesta se envió hace una semana a una dirección electrónica equivocada; en los últimos días, otros dos ciudadanos han reportado el mismo problema con las respuestas enviadas por correo electrónico. La entidad aplica los protocolos de servicio al ciudadano del DNP y de Función Pública.", "items": [{"id": "AU-161", "niv": 2, "e": "Mientras el ciudadano expresa su inconformidad, lo recomendable es", "f": "Departamento Nacional de Planeación, Protocolos de servicio al ciudadano (atención a personas alteradas)", "o": [["A", "aclararle desde el inicio que usted no cometió el error, para que dirija su reclamo a la dependencia responsable.", "Los protocolos indican no tomar la situación como algo personal ni trasladar la responsabilidad: el ciudadano se queja del servicio de la entidad.", false], ["B", "pedirle de inmediato que se calme, porque no se le puede atender mientras esté alterado.", "Los protocolos de servicio recomiendan expresamente no pedirle al ciudadano que se calme ni calificar su estado de ánimo.", false], ["C", "dejar que se desahogue, escucharlo sin interrumpirlo y evitar calificar su estado de ánimo.", "Los Protocolos de servicio al ciudadano del DNP recomiendan dejar que el ciudadano se desahogue, escucharlo con atención sin interrumpirlo ni discutir, y evitar calificar su estado de ánimo.", true]]}, {"id": "AU-162", "niv": 2, "e": "Si el ciudadano pasara a insultarlo a usted, el protocolo indica", "f": "Departamento Nacional de Planeación, Protocolos de servicio al ciudadano; Ley 1437 de 2011, art. 6, num. 4 y parágrafo", "o": [["A", "advertirle que su queja será rechazada por irrespetuosa si no cambia de actitud.", "La conducta del ciudadano en la sala no convierte en irrespetuosa su queja ya presentada, y la administración no puede usar ese incumplimiento para desconocer su derecho (art. 6, parágrafo, del CPACA).", false], ["B", "exigirle respeto de manera cortés y, si persiste, llamar al superior para que asuma el manejo de la situación.", "Los Protocolos de servicio al ciudadano del DNP indican que, si un usuario es grosero o violento, se le exige respeto de manera cortés y, si persiste, se llama al supervisor para cederle el manejo de la situación.", true], ["C", "suspender la atención y retirarse del puesto hasta que el ciudadano se calme o abandone la sede de la procuraduría.", "Abandonar el puesto deja al ciudadano sin atención; el protocolo prevé exigir respeto y, si persiste, acudir al superior.", false]]}, {"id": "AU-163", "niv": 1, "e": "Como el mismo problema ya afectó a otros ciudadanos, usted debe", "f": "Departamento Nacional de Planeación, Protocolos de servicio al ciudadano (atención a personas alteradas)", "o": [["A", "resolver cada caso por separado sin reportarlo, porque se trata de errores aislados.", "Tres casos con la misma causa indican una falla del proceso; tratarlos por separado impide corregirla.", false], ["B", "recomendar a los ciudadanos que en adelante pidan las respuestas solo por correo físico.", "Trasladar al ciudadano la carga de una falla interna no la soluciona; además, la entidad debe mantener los medios electrónicos de atención (art. 7, num. 8, del CPACA).", false], ["C", "informar al jefe inmediato para que se dé una solución de fondo al problema.", "Los Protocolos de servicio al ciudadano del DNP recomiendan que, si el mismo problema ocurre con otro ciudadano, se informe al jefe inmediato para dar una solución de fondo.", true]]}]}, {"comp": "atencion_usuario", "rol": "profesional", "tag": "Atención al usuario · Niveles profesional, asesor y ejecutivo · Lenguaje claro en las respuestas", "texto": "Usted es profesional especializado de la oficina jurídica de una entidad del orden nacional y debe revisar este borrador de respuesta a un ciudadano: «En atención a su solicitud radicada con el número 2027-0451, nos permitimos manifestarle que, de conformidad con lo preceptuado en la normatividad vigente y habida cuenta de que la documentación aportada fue objeto de verificación por parte de la SGAC, se procederá a efectuar la revisión de su caso una vez se surta el trámite interno correspondiente». El jefe le pide ajustar el texto según la Guía de lenguaje claro para servidores públicos de Colombia del DNP.", "items": [{"id": "AU-164", "niv": 1, "e": "Para hacer más clara la frase sobre la verificación de los documentos, conviene", "f": "Departamento Nacional de Planeación, Guía de lenguaje claro para servidores públicos de Colombia (utilice voz activa)", "o": [["A", "usar la voz activa, de modo que quien hace la acción sea el sujeto de la oración.", "La guía del DNP recomienda utilizar la voz activa, en la que el sujeto realiza la acción, porque es más simple y directa (por ejemplo, «la dependencia revisó los documentos»).", true], ["B", "reemplazar el verbo por un sustantivo, como «efectuar la verificación», para dar mayor precisión.", "La guía aconseja usar verbos en lugar de sustantivos: «verificar» es más claro que «efectuar la verificación».", false], ["C", "mantener la voz pasiva, porque le da a la respuesta el tono impersonal que exige un documento oficial.", "La guía recomienda lo contrario: la voz activa requiere menos palabras e involucra al lector, mientras la pasiva complica la frase.", false]]}, {"id": "AU-165", "niv": 2, "e": "Respecto de la sigla SGAC, la recomendación es", "f": "Departamento Nacional de Planeación, Guía de lenguaje claro para servidores públicos de Colombia; 10 pasos para comunicarse en lenguaje claro", "o": [["A", "evitarla y, si es indispensable usarla, escribir su significado completo la primera vez que aparezca.", "El material de lenguaje claro del DNP advierte que las siglas no son parte del lenguaje de los ciudadanos y recomienda, si es indispensable usarlas, desagregarlas por lo menos la primera vez que se mencionan.", true], ["B", "escribirla en minúsculas y entre comillas para que el lector identifique que se trata de una dependencia.", "El formato de la sigla no resuelve el problema: el ciudadano sigue sin saber a qué dependencia se refiere.", false], ["C", "mantenerla, porque el ciudadano puede consultar su significado en la página web de la entidad.", "Obligar al lector a buscar el significado de la sigla interrumpe la lectura, que es justamente lo que el lenguaje claro busca evitar.", false]]}, {"id": "AU-166", "niv": 2, "e": "Para iniciar la respuesta, lo más adecuado según el enfoque de lenguaje claro es", "f": "Departamento Nacional de Planeación, Guía de lenguaje claro para servidores públicos de Colombia (pensar en el lector; orden de la información)", "o": [["A", "agradecer al ciudadano su confianza y presentar la misión de la entidad antes de entrar en materia.", "Una introducción institucional no responde a la pregunta del ciudadano; la guía pide que la frase inicial no lleve al lector a preguntarse para qué le sirve.", false], ["B", "comunicar desde la primera frase lo que el ciudadano necesita saber sobre su solicitud.", "La guía del DNP señala que las primeras frases deben comunicar algo importante para el lector y que la información debe ordenarse según sus necesidades.", true], ["C", "citar primero las normas aplicables, para que el ciudadano conozca el sustento jurídico antes de la decisión.", "La guía advierte que los documentos redactados pensando en el sustento jurídico, y no en el lector, retrasan la información que el ciudadano necesita.", false]]}]}, {"comp": "atencion_usuario", "rol": "general", "tag": "Atención al usuario · Quejas contra servidores y remisión al control disciplinario", "texto": "En la oficina de peticiones, quejas, reclamos, sugerencias y denuncias de la alcaldía de un municipio se reciben tres escritos: una queja firmada por una ciudadana contra un auxiliar administrativo de la Secretaría de Tránsito que, según ella, le pidió dinero para agilizar un trámite; un escrito anónimo que afirma, sin ningún detalle ni prueba, que «en la alcaldía todos son corruptos»; y una queja firmada contra el alcalde por presuntas irregularidades en la celebración de un contrato.", "items": [{"id": "AU-167", "niv": 2, "e": "Para efectos disciplinarios, la queja contra el auxiliar de la Secretaría de Tránsito debe remitirse a", "f": "Ley 1952 de 2019, arts. 2 y 93 (modificados por la Ley 2094 de 2021)", "o": [["A", "la Secretaría de Tránsito, para que el jefe inmediato del auxiliar decida si lo sanciona.", "El jefe inmediato no es el titular de la acción disciplinaria; esta corresponde a la oficina de control disciplinario interno o a los órganos de control con poder preferente.", false], ["B", "la contraloría municipal, porque la solicitud de dinero afecta el patrimonio público.", "La contraloría ejerce control fiscal, no disciplinario; la conducta denunciada se investiga disciplinariamente por los órganos competentes.", false], ["C", "la Oficina de Control Disciplinario Interno de la alcaldía, que conoce de las faltas de sus servidores.", "Según los artículos 2 y 93 del Código General Disciplinario, las oficinas de control disciplinario interno conocen de los asuntos disciplinarios contra los servidores de su entidad, sin perjuicio del poder disciplinario preferente de la Procuraduría y de las personerías.", true]]}, {"id": "AU-168", "niv": 2, "e": "Frente al escrito anónimo, es correcto afirmar que", "f": "Ley 1952 de 2019, art. 86; Ley 190 de 1995, art. 38; Ley 24 de 1992, art. 27", "o": [["A", "obliga a abrir indagación previa, porque toda denuncia sobre corrupción debe investigarse aunque sea anónima.", "El artículo 86 del Código General Disciplinario dispone que la acción no procede por anónimos, salvo que cumplan los requisitos mínimos de las Leyes 190 de 1995 y 24 de 1992.", false], ["B", "debe devolverse a su autor para que lo aclare dentro de los diez días siguientes, como ocurre con las peticiones oscuras.", "La devolución para aclarar supone un autor identificado; además, frente a anónimos la regla especial es la del artículo 86 del Código General Disciplinario.", false], ["C", "no da lugar a acción disciplinaria, salvo que existieran pruebas suficientes de la falta, y este escrito no las trae.", "Según el artículo 86 del Código General Disciplinario, en concordancia con el artículo 38 de la Ley 190 de 1995, el anónimo solo permite actuar de oficio si existen medios probatorios suficientes sobre la comisión de la falta; este escrito no los tiene.", true]]}, {"id": "AU-169", "niv": 3, "e": "La queja contra el alcalde debe remitirse a", "f": "Ley 1952 de 2019, art. 83", "o": [["A", "la Procuraduría General de la Nación, porque las personerías no ejercen poder disciplinario sobre el alcalde.", "El inciso 2 del artículo 83 del Código General Disciplinario dispone que el poder disciplinario de los personeros no se ejerce respecto del alcalde y de los concejales, y que esa competencia corresponde a la Procuraduría General de la Nación.", true], ["B", "la personería municipal, que tiene poder preferente frente a la administración municipal.", "El artículo 83 del Código General Disciplinario excluye expresamente al alcalde y a los concejales del poder disciplinario de los personeros.", false], ["C", "la Oficina de Control Disciplinario Interno de la alcaldía, que conoce de los procesos contra los servidores de la entidad.", "El alcalde es el jefe de la entidad; la ley atribuye la competencia disciplinaria sobre los alcaldes a la Procuraduría General de la Nación.", false]]}]}, {"comp": "atencion_usuario", "rol": "general", "tag": "Atención al usuario · Política de Servicio al Ciudadano y canales de atención", "texto": "La secretaria general de una empresa social del Estado del orden departamental lidera la implementación del Modelo Integrado de Planeación y Gestión (MIPG). En el diagnóstico encuentra que cada dependencia recibe por su cuenta las peticiones verbales que llegan a su oficina, que las llamadas telefónicas con peticiones se atienden en las extensiones de cada área sin dejar constancia, y que no existe ningún canal para recibir peticiones verbales por fuera del horario de atención.", "items": [{"id": "AU-170", "niv": 1, "e": "Dentro del MIPG, el servicio al ciudadano es", "f": "Decreto 1499 de 2017 (art. 2.2.22.2.1 del Decreto 1083 de 2015)", "o": [["A", "un componente del sistema de control interno cuya evaluación corresponde en forma exclusiva a la oficina de control interno.", "El servicio al ciudadano es una política de gestión y desempeño; la oficina de control interno evalúa, pero la política la implementa toda la entidad.", false], ["B", "una de las políticas de gestión y desempeño institucional previstas en el Decreto 1499 de 2017.", "El artículo 2.2.22.2.1 del Decreto 1083 de 2015, en la redacción dada por el Decreto 1499 de 2017, incluye el servicio al ciudadano entre las políticas de gestión y desempeño institucional.", true], ["C", "una dimensión autónoma del modelo que reemplaza al proceso de gestión documental.", "El servicio al ciudadano no reemplaza la gestión documental, que es otra política distinta del mismo listado.", false]]}, {"id": "AU-171", "niv": 1, "e": "Frente a las peticiones verbales presenciales, la empresa debe", "f": "Decreto 1069 de 2015, art. 2.2.3.12.2 (adicionado por el Decreto 1166 de 2016)", "o": [["A", "suprimir la recepción verbal y exigir un formulario escrito, para garantizar la constancia de radicación.", "Las peticiones pueden presentarse verbalmente (art. 15 del CPACA) y no puede negarse su recepción con la excusa de exigir un escrito, salvo que la petición lo requiera.", false], ["B", "mantener la recepción en cada dependencia, porque así la petición llega directamente a quien debe resolverla.", "El Decreto 1069 de 2015 ordena lo contrario: centralizar en una sola oficina o dependencia la recepción de las peticiones verbales.", false], ["C", "concentrar su recepción en una única dependencia, atendida por personal que conozca las funciones de la entidad.", "El artículo 2.2.3.12.2 del Decreto 1069 de 2015 obliga a centralizar en una sola oficina o dependencia la recepción de las peticiones verbales, con funcionarios suficientes y con conocimiento idóneo de las competencias de la entidad.", true]]}, {"id": "AU-172", "niv": 2, "e": "Respecto de las peticiones telefónicas y de las que se formulen fuera del horario, la empresa debe", "f": "Decreto 1069 de 2015, art. 2.2.3.12.2 (adicionado por el Decreto 1166 de 2016)", "o": [["A", "centralizar las telefónicas en su línea de atención y habilitar medios electrónicos para recibir peticiones verbales aun fuera del horario.", "El artículo 2.2.3.12.2 del Decreto 1069 de 2015 ordena centralizar en la línea de atención la recepción y constancia de radicación de las peticiones telefónicas y habilitar medios tecnológicos o electrónicos para recibir peticiones verbales aun por fuera de las horas de atención.", true], ["B", "atender las telefónicas en cada extensión y recibir las de fuera del horario solo por correo físico.", "La norma exige centralizar las peticiones telefónicas en la línea de atención y habilitar medios tecnológicos o electrónicos aun fuera del horario.", false], ["C", "recibir las telefónicas solo como orientación, sin radicarlas ni dejar constancia, y no habilitar ningún canal por fuera del horario de atención al público.", "Las peticiones telefónicas son peticiones verbales que deben constar y radicarse; la excepción es solo la simple orientación sobre dónde acudir.", false]]}]}, {"comp": "atencion_usuario", "rol": "general", "tag": "Atención al usuario · Derecho de petición ante organizaciones privadas", "texto": "Usted trabaja en el centro de atención al ciudadano de una procuraduría provincial y recibe tres consultas. Un trabajador de una panadería, cuyo dueño es una persona natural, pregunta si puede presentarle un derecho de petición a su empleador para que le entregue certificados de sus aportes, que necesita para tramitar su pensión. Una señora quiere saber si el club social privado al que pertenece puede negarse a radicar una petición respetuosa que ella necesita para defender su derecho a la igualdad. Y el usuario de un banco pregunta si la entidad puede negarle información invocando una reserva que solo aparece en su reglamento interno.", "items": [{"id": "AU-173", "niv": 3, "e": "Frente a la consulta del trabajador, es correcto afirmar que", "f": "Ley 1755 de 2015, art. 1 (art. 32, parágrafo 1, de la Ley 1437 de 2011)", "o": [["A", "solo puede hacerlo por intermedio de un inspector de trabajo, que actúa como receptor de la petición.", "La ley no exige intermediarios: el trabajador puede presentar la petición directamente a su empleador.", false], ["B", "puede presentarla a su empleador, porque está subordinado a él en la relación laboral.", "El parágrafo 1 del artículo 32 del CPACA permite ejercer el derecho de petición ante personas naturales cuando el solicitante se encuentra frente a ellas en situación de indefensión o subordinación, como ocurre en la relación laboral.", true], ["C", "no puede hacerlo, porque frente a particulares el derecho de petición solo procede ante personas jurídicas.", "El parágrafo 1 del artículo 32 del CPACA extiende el derecho de petición a las personas naturales cuando el solicitante está frente a ellas en situación de indefensión o subordinación.", false]]}, {"id": "AU-174", "niv": 2, "e": "Sobre la pregunta de la señora, el club social", "f": "Ley 1755 de 2015, art. 1 (art. 32, inciso 1 y parágrafo 3, de la Ley 1437 de 2011)", "o": [["A", "puede negarse, porque las organizaciones privadas sin ánimo de lucro no están obligadas a atender peticiones.", "El artículo 32 del CPACA permite ejercer el derecho de petición ante organizaciones privadas con o sin personería jurídica, entre ellas los clubes, para garantizar derechos fundamentales.", false], ["B", "está obligado a recibir y radicar su petición respetuosa, y si se niega puede ser sancionado o multado.", "El parágrafo 3 del artículo 32 del CPACA dispone que ninguna entidad privada podrá negarse a la recepción y radicación de solicitudes y peticiones respetuosas, so pena de sanciones o multas; el inciso 1 menciona expresamente a los clubes.", true], ["C", "puede negarse a radicarla, siempre que le explique por escrito los motivos de la negativa.", "La ley prohíbe negarse a recibir y radicar; una explicación escrita no convierte la negativa en válida.", false]]}, {"id": "AU-175", "niv": 3, "e": "Sobre la pregunta del usuario del banco, la entidad financiera", "f": "Ley 1755 de 2015, art. 1 (arts. 32, inciso 3, y 33 de la Ley 1437 de 2011)", "o": [["A", "puede invocar cualquier reserva que esté prevista en su reglamento interno de atención al usuario.", "Un reglamento interno no es fuente de reserva: solo la Constitución y la ley pueden establecerla.", false], ["B", "puede invocar libremente reservas comerciales, porque se rige por el derecho privado.", "Que se rija por el derecho privado no la libera de las reglas del derecho de petición, que la ley le aplica en sus relaciones con los usuarios (art. 33 del CPACA).", false], ["C", "no puede ampararse en una reserva que no esté prevista en la Constitución o en la ley.", "El inciso 3 del artículo 32 del CPACA dispone que las organizaciones privadas solo pueden invocar la reserva en los casos expresamente establecidos en la Constitución y la ley, y el artículo 33 aplica estas reglas a las entidades financieras en sus relaciones con los usuarios.", true]]}]}, {"comp": "gestion_documental", "rol": "general", "tag": "Gestión documental · Ciclo vital y clases de archivo", "texto": "Usted es auxiliar administrativo de una procuraduría provincial. La secretaría tiene en sus estantes tres grupos de carpetas: los expedientes de las actuaciones que se tramitan este año y que los profesionales consultan a diario; los expedientes cerrados en 2019, que la tabla de retención documental (TRD) señala como de conservación total y que ya cumplieron su tiempo en el archivo central; y unas cajas de expedientes cerrados en 2023, de consulta ocasional, que ya cumplieron su tiempo en el archivo de gestión. Un compañero nuevo opina que todo eso «es asunto del archivo central» y que la secretaría no tiene por qué ocuparse del cuidado de los documentos.", "items": [{"id": "GD-101", "niv": 1, "e": "Los expedientes de las actuaciones en trámite que los profesionales consultan a diario conforman", "f": "Ley 594 de 2000, arts. 3 y 23", "o": [["A", "el archivo de gestión de la dependencia, porque están en trámite y se consultan con frecuencia.", "El artículo 23 de la Ley 594 de 2000 define el archivo de gestión como la documentación sometida a continua utilización y consulta administrativa por la oficina productora, cuyo trámite se adelanta para resolver los asuntos iniciados.", true], ["B", "el archivo central de la entidad, porque son documentos con plena vigencia jurídica.", "Al archivo central llegan los documentos transferidos por los archivos de gestión, cuya consulta ya no es frecuente aunque sigan vigentes (art. 23, lit. b, Ley 594 de 2000). Los expedientes en trámite permanecen en la oficina productora.", false], ["C", "un archivo de apoyo de la secretaría, distinto de los documentos de archivo.", "Los expedientes de las actuaciones son documentos de archivo producidos en ejercicio de funciones (art. 3, Ley 594 de 2000) y recorren el ciclo vital desde la fase de gestión; no son documentos de apoyo.", false]]}, {"id": "GD-102", "niv": 2, "e": "Los expedientes cerrados en 2019, de conservación total según la TRD y con el tiempo cumplido en el archivo central, deben", "f": "Ley 594 de 2000, art. 23; Decreto 1080 de 2015, glosario (transferencia documental); Acuerdo 001 de 2024 del AGN, art. 4.4.4", "o": [["A", "devolverse al archivo de gestión de la secretaría para su custodia definitiva.", "El ciclo vital avanza del archivo de gestión al central y de este al histórico; no se devuelven expedientes cerrados a la oficina productora para su custodia permanente (art. 23, Ley 594 de 2000).", false], ["B", "permanecer en el archivo central de forma indefinida, porque allí se conservan los documentos vigentes.", "El archivo central guarda los documentos mientras cumplen el tiempo de retención fijado en la TRD; vencido ese tiempo, los de conservación permanente pasan al archivo histórico (art. 23, Ley 594 de 2000).", false], ["C", "pasar al archivo histórico mediante una transferencia secundaria.", "El archivo histórico recibe del archivo central los documentos de conservación permanente (art. 23, lit. c, Ley 594 de 2000). La entrega del archivo central al histórico es la transferencia secundaria (glosario del Decreto 1080 de 2015; art. 4.4.4 del Acuerdo 001 de 2024 del AGN).", true]]}, {"id": "GD-103", "niv": 2, "e": "La opinión del compañero sobre el cuidado de los documentos es equivocada, porque la Ley General de Archivos establece que", "f": "Ley 594 de 2000, art. 4, lit. d; Decreto 1080 de 2015, art. 2.8.2.5.3", "o": [["A", "solo los secretarios generales responden por los archivos, de modo que la secretaría de la provincial actúa por delegación.", "El artículo 16 de la Ley 594 de 2000 asigna a los secretarios generales responsabilidades sobre los archivos, pero no excluye a los demás servidores; el artículo 4, literal d, hace responsables a todos los servidores públicos del manejo de los documentos.", false], ["B", "los servidores públicos son responsables de la organización, conservación, uso y manejo de los documentos.", "Es el principio de responsabilidad del artículo 4, literal d, de la Ley 594 de 2000. Además, el artículo 2.8.2.5.3 del Decreto 1080 de 2015 extiende la responsabilidad de aplicar las normas archivísticas a servidores y contratistas.", true], ["C", "el cuidado de los documentos corresponde a los usuarios que los consultan y no a quienes los producen.", "La ley hace responsables a los servidores públicos de la organización y conservación de los documentos; a los particulares solo los hace responsables por el uso que hagan de ellos (art. 4, lit. d, Ley 594 de 2000).", false]]}]}, {"comp": "gestion_documental", "rol": "tecnico", "tag": "Gestión documental · Niveles técnico, administrativo y operativo · Entrega de documentos al dejar el cargo", "texto": "Usted es técnico de la Oficina de Control Interno de la Procuraduría. Una compañera, sustanciadora de la misma oficina, fue trasladada a una procuraduría regional y deja su puesto el viernes. Tiene a su cargo once carpetas de informes de auditoría y varios expedientes electrónicos. Ella le comenta que piensa dejarle las carpetas sobre el escritorio con una nota, y que se llevará en una memoria USB los borradores de informes que proyectó, «porque son trabajo mío». Usted fue designado para recibir los documentos.", "items": [{"id": "GD-104", "niv": 1, "e": "Para cumplir la normativa archivística, la entrega de los documentos a cargo de la compañera debe hacerse", "f": "Ley 594 de 2000, art. 15; Acuerdo 001 de 2024 del AGN, art. 1.3.2", "o": [["A", "mediante un inventario documental en el Formato Único de Inventario Documental (FUID).", "El artículo 15 de la Ley 594 de 2000 exige entregar los documentos debidamente inventariados, y el artículo 1.3.2 del Acuerdo 001 de 2024 del AGN ordena que la entrega por traslado o retiro se haga con inventarios documentales en el FUID.", true], ["B", "con una nota sencilla que relacione el número de carpetas entregadas, firmada solo por quien entrega.", "Una nota con el número de carpetas no es un inventario documental. El Acuerdo 001 de 2024 (art. 1.3.2, par. 2) exige el FUID y que los documentos estén registrados en la hoja de control o el índice electrónico.", false], ["C", "por medio de un acta de entrega del puesto que elabore la oficina de talento humano.", "Un acta del puesto, como el acta de informe de gestión de la Ley 951 de 2005, no reemplaza el inventario documental: la entrega de los documentos se soporta en el FUID (art. 1.3.2 del Acuerdo 001 de 2024 del AGN).", false]]}, {"id": "GD-105", "niv": 2, "e": "Frente a la intención de llevarse los borradores de informes que proyectó, usted debe explicarle que", "f": "Acuerdo 001 de 2024 del AGN, art. 1.3.3, parágrafo", "o": [["A", "puede llevárselos porque, al no estar firmados, no son documentos de archivo.", "Los proyectos elaborados en ejercicio del cargo son documentación producida en desarrollo de las funciones, que el Acuerdo 001 de 2024 (art. 1.3.3, par.) prohíbe llevarse; la falta de firma no los convierte en bienes personales.", false], ["B", "no puede llevarse la documentación producida en ejercicio de sus funciones, porque los documentos públicos son propiedad del Estado.", "Así lo dispone el parágrafo del artículo 1.3.3 del Acuerdo 001 de 2024 del AGN, que además advierte las sanciones previstas por la ley para quien lo haga.", true], ["C", "puede llevárselos siempre que deje una copia en el expediente de la oficina.", "El parágrafo del artículo 1.3.3 del Acuerdo 001 de 2024 prohíbe, por ningún motivo, llevarse la documentación producida en ejercicio de las funciones; dejar una copia no levanta esa prohibición.", false]]}, {"id": "GD-106", "niv": 3, "e": "Si meses después de una entrega hecha con inventario se descubre una irregularidad en los documentos que manejó la compañera, es correcto afirmar que", "f": "Ley 594 de 2000, art. 15; Acuerdo 001 de 2024 del AGN, art. 1.3.3", "o": [["A", "la firma del inventario por quien recibe traslada a esta persona toda la responsabilidad por los documentos.", "Quien recibe asume la custodia desde la entrega, pero la ley no traslada a él la responsabilidad por irregularidades anteriores; el artículo 15 de la Ley 594 de 2000 mantiene la de quien entregó.", false], ["B", "solo podría responder disciplinariamente si hubiera omitido hacer el inventario.", "La omisión de la entrega genera responsabilidad (art. 1.3.3 del Acuerdo 001 de 2024), pero hacer el inventario no extingue la responsabilidad por irregularidades, que puede ser disciplinaria, penal, fiscal o administrativa (art. 15, Ley 594 de 2000).", false], ["C", "la entrega inventariada no la exonera de la responsabilidad a que haya lugar por esa irregularidad.", "El artículo 15 de la Ley 594 de 2000 dispone que la entrega de los documentos debidamente inventariados se hace sin que ello implique exoneración de la responsabilidad en caso de irregularidades.", true]]}]}, {"comp": "gestion_documental", "rol": "general", "tag": "Gestión documental · Instrumentos archivísticos", "texto": "Usted es profesional de apoyo de la Oficina de Planeación de la Procuraduría y participa en una mesa de trabajo con el grupo de gestión documental. En la reunión se mencionan varios instrumentos: el que fija cuánto tiempo permanece cada serie en el archivo de gestión y en el central; el que muestra, con códigos, cómo se divide el fondo en secciones, subsecciones, series y subseries; y el que se necesita para valorar un fondo acumulado de expedientes producidos entre 1996 y 2005, periodo en el que la entidad no tenía tablas de retención. Los asistentes discuten cómo se llama cada uno.", "items": [{"id": "GD-107", "niv": 1, "e": "El instrumento que lista las series con sus tipos documentales y asigna el tiempo de permanencia en cada etapa del ciclo vital es", "f": "Ley 594 de 2000, arts. 3, 24 y 26; Acuerdo 001 de 2024 del AGN, art. 4.3.1.4", "o": [["A", "la tabla de retención documental (TRD).", "El artículo 3 de la Ley 594 de 2000 define la TRD como el listado de series con sus tipos documentales a las que se asigna el tiempo de permanencia en cada etapa del ciclo vital; su adopción es obligatoria (art. 24).", true], ["B", "el inventario documental.", "El inventario describe las unidades documentales existentes para controlarlas en sus diferentes fases (art. 26, Ley 594 de 2000); no asigna tiempos de permanencia.", false], ["C", "el cuadro de clasificación documental (CCD).", "El CCD representa la jerarquía codificada de las agrupaciones documentales del fondo (art. 4.3.1.4 del Acuerdo 001 de 2024), pero no fija tiempos de retención.", false]]}, {"id": "GD-108", "niv": 2, "e": "El instrumento que representa, codificadas y jerarquizadas, las secciones, subsecciones, series y subseries en que se divide el fondo es", "f": "Decreto 1080 de 2015, art. 2.8.2.5.8; Acuerdo 001 de 2024 del AGN, art. 4.3.1.4", "o": [["A", "el cuadro de clasificación documental (CCD).", "El artículo 4.3.1.4 del Acuerdo 001 de 2024 del AGN dispone que las agrupaciones documentales se codifican representando la jerarquía del fondo (secciones, subsecciones, series y subseries) conforme al CCD, instrumento previsto en el artículo 2.8.2.5.8 del Decreto 1080 de 2015.", true], ["B", "la tabla de control de acceso a los documentos.", "Las tablas de control de acceso establecen derechos y restricciones de acceso y seguridad de los documentos (art. 2.8.2.5.8, lit. i, Decreto 1080 de 2015), no la clasificación del fondo.", false], ["C", "el programa de gestión documental (PGD).", "El PGD es el instrumento que planea los procesos de la gestión documental a corto, mediano y largo plazo (art. 2.8.2.5.10, Decreto 1080 de 2015); no representa la estructura codificada del fondo.", false]]}, {"id": "GD-109", "niv": 2, "e": "Para valorar el fondo acumulado de 1996 a 2005, producido cuando la entidad no tenía tablas de retención, el instrumento que corresponde elaborar es", "f": "Acuerdo 001 de 2024 del AGN, arts. 1.2.4 y 5.1.1.1", "o": [["A", "una TRD con fecha retroactiva, porque las tablas de retención se aplican a toda la documentación de la entidad.", "Las TRD se elaboran para valorar los documentos que la entidad debe producir según sus funciones (art. 5.1.1.1, num. 1, Acuerdo 001 de 2024); para periodos sin TRD se usa otro instrumento.", false], ["B", "el plan institucional de archivos (PINAR), que fija los tiempos de retención de los fondos antiguos.", "El PINAR es un instrumento de planeación de la función archivística (art. 1.2.4, Acuerdo 001 de 2024); no valora series ni fija tiempos de retención.", false], ["C", "una tabla de valoración documental (TVD).", "El artículo 5.1.1.1, numeral 2, del Acuerdo 001 de 2024 del AGN establece que las TVD se elaboran para documentos ya producidos en periodos de la historia de la entidad que no cuentan con TRD (fondos acumulados).", true]]}]}, {"comp": "gestion_documental", "rol": "tecnico", "tag": "Gestión documental · Niveles técnico, administrativo y operativo · Foliación", "texto": "Usted es auxiliar administrativo de la secretaría de una procuraduría provincial y debe foliar varios expedientes disciplinarios antes de transferirlos. Uno de ellos ocupa dos carpetas: la primera termina en el folio 200. En otro expediente, ya foliado del 1 al 85, al revisar descubre que una hoja quedó sin número entre los folios 15 y 16. Un compañero le sugiere usar el esfero rojo de la oficina «para que se note más» y numerar la hoja olvidada como «15A». Usted aplica el instructivo de foliación del Archivo General de la Nación (AGN).", "items": [{"id": "GD-110", "niv": 1, "e": "Para foliar los expedientes, usted debe usar", "f": "AGN, instructivo Foliación en archivos (actualización 2021), materiales y procedimiento, nums. 1 a 4", "o": [["A", "lápiz de mina roja, para distinguir la numeración del texto del documento.", "El instructivo de foliación del AGN indica lápiz de mina negra y blanda (HB o B) y descarta el lápiz de color rojo.", false], ["B", "lápiz de mina negra y blanda (HB o B) y escribir el número en la esquina superior derecha de la cara recta del folio.", "El instructivo Foliación en archivos del AGN ordena usar lápiz de mina negra y blanda, tipo HB o B, y escribir el número en la esquina superior derecha de la cara recta, en el mismo sentido del texto.", true], ["C", "lápiz de mina negra y escribir el número en la esquina superior derecha de ambas caras de cada hoja.", "Foliar es numerar las hojas por su cara recta; numerar ambas caras es paginar, que el instructivo «Foliación en archivos» del AGN distingue de la foliación.", false]]}, {"id": "GD-111", "niv": 2, "e": "En el expediente que ocupa dos carpetas, la primera hoja de la segunda carpeta debe llevar el folio número", "f": "AGN, instructivo Foliación en archivos (actualización 2021), requisitos, num. 4; AGN, cartilla Ordenación documental", "o": [["A", "1, porque cada carpeta es una unidad de conservación con foliación propia.", "Esa regla vale para series simples (resoluciones, circulares), foliadas por carpeta. En series complejas como las investigaciones disciplinarias, foliar desde 1 cada carpeta rompe la unidad del expediente (instructivo del AGN).", false], ["B", "200, para mostrar que continúa el folio final de la carpeta anterior.", "La numeración es consecutiva, sin repetir números; el 200 ya corresponde a la última hoja de la primera carpeta (instructivo Foliación en archivos del AGN, procedimiento, num. 1).", false], ["C", "201, porque la segunda carpeta continúa la foliación de la primera.", "En series complejas (contratos, historias laborales, investigaciones disciplinarias) cada expediente tiene una foliación continua y, si ocupa más de una carpeta, la segunda continúa la numeración de la primera (instructivo Foliación en archivos del AGN, requisitos, num. 4).", true]]}, {"id": "GD-112", "niv": 3, "e": "Para corregir la hoja que quedó sin foliar entre los folios 15 y 16, lo procedente es", "f": "AGN, instructivo Foliación en archivos (actualización 2021), procedimiento, nums. 1, 2, 4 y 14", "o": [["A", "anular con una línea oblicua la numeración errada y refoliar en forma consecutiva desde esa hoja, sin tachones.", "El instructivo Foliación en archivos del AGN exige numerar en forma consecutiva, sin omitir ni repetir números, y dispone que los errores de foliación se anulen con una línea oblicua, evitando tachones.", true], ["B", "numerarla como 15A, para no alterar la foliación de las hojas siguientes.", "El instructivo del AGN prohíbe foliar con números acompañados de los suplementos A, B, C o bis.", false], ["C", "borrar con corrector la numeración desde el folio 16 y escribir encima la nueva.", "El número debe escribirse sin enmendaduras, y los errores se anulan con una línea oblicua evitando tachones; el corrector altera el soporte y oculta la numeración anterior (instructivo del AGN).", false]]}]}, {"comp": "gestion_documental", "rol": "general", "tag": "Gestión documental · Principios de procedencia y orden original", "texto": "Usted es asistente de la Procuraduría Regional de un departamento. Al recibir el archivo de gestión del despacho, encuentra que un antiguo servidor reunió en una sola carpeta temática, llamada «Contratación», documentos producidos por la Oficina Jurídica, por el grupo de Vigilancia Preventiva y por la secretaría. Además, dentro de cada expediente ordenó los documentos alfabéticamente por el apellido del remitente. El procurador regional le pide reorganizar el archivo conforme a la normativa del Archivo General de la Nación.", "items": [{"id": "GD-113", "niv": 2, "e": "Al separar los documentos de la carpeta temática «Contratación», usted aplica el principio de procedencia, que consiste en", "f": "Ley 594 de 2000, art. 11; Acuerdo 001 de 2024 del AGN, art. 4.3.1.2", "o": [["A", "conservar los documentos en la dependencia que los recibió por última vez.", "La procedencia se define por la oficina productora en desarrollo de sus funciones, no por quien tuvo los documentos por última vez (art. 4.3.1.2, Acuerdo 001 de 2024).", false], ["B", "mantener agrupados los documentos según la dependencia que los produjo en ejercicio de sus funciones.", "El artículo 4.3.1.2 del Acuerdo 001 de 2024 del AGN ordena respetar la procedencia para determinar, a partir de la estructura orgánico-funcional, las unidades u oficinas que producen los documentos. La Ley 594 de 2000 (art. 11) lo establece como principio de la organización de archivos.", true], ["C", "agrupar los documentos según el asunto que tratan, sin importar qué dependencia los produjo.", "Agrupar por tema es justamente lo que desconoce la procedencia. Este principio atiende a la oficina productora según la estructura orgánico-funcional (art. 4.3.1.2, Acuerdo 001 de 2024 del AGN).", false]]}, {"id": "GD-114", "niv": 2, "e": "Para corregir la ordenación alfabética de los documentos dentro de cada expediente, usted debe", "f": "Acuerdo 001 de 2024 del AGN, arts. 4.3.1.3 y 4.3.1.8, num. 2; AGN, instructivo Foliación en archivos, requisitos, num. 2", "o": [["A", "ordenar los documentos según la secuencia en que se produjeron durante el trámite, desde el que lo inició.", "El principio de orden original (art. 4.3.1.3, Acuerdo 001 de 2024 del AGN) exige respetar la secuencia en que los documentos se gestionaron y tramitaron hasta su resolución; el numeral 2 del artículo 4.3.1.8 ordena que los tipos documentales evidencien el desarrollo del trámite.", true], ["B", "ordenar los documentos según el tipo documental, primero los oficios y luego los autos.", "Agrupar por tipo documental rompe la secuencia en que se tramitó el asunto; el orden original exige reflejar el desarrollo del trámite (art. 4.3.1.8, num. 2, Acuerdo 001 de 2024).", false], ["C", "ubicar primero el documento más reciente, para que la última actuación quede a la vista.", "El orden original sigue la secuencia del trámite; según el instructivo de foliación del AGN, el folio 1 corresponde al documento que dio inicio al trámite, que es el de fecha más antigua.", false]]}, {"id": "GD-115", "niv": 1, "e": "El proceso de organización documental que usted adelanta comprende las operaciones técnicas de", "f": "Acuerdo 001 de 2024 del AGN, art. 4.3.1.1; Decreto 1080 de 2015, art. 2.8.2.5.9, lit. d", "o": [["A", "valoración, selección y eliminación.", "Son actividades de los procesos de valoración y disposición final (arts. 4.5.1 a 4.5.4 y Título 5 del Acuerdo 001 de 2024), no de la organización.", false], ["B", "recepción, radicación y distribución.", "Esas actividades corresponden a la ventanilla única y al proceso de gestión y trámite (arts. 4.2.1 y 4.2.2 del Acuerdo 001 de 2024), no a la organización.", false], ["C", "clasificación, ordenación y descripción.", "El artículo 4.3.1.1 del Acuerdo 001 de 2024 del AGN señala que la organización documental se realiza a partir de los procesos técnicos de clasificación, ordenación y descripción, respetando procedencia, orden original y ciclo vital.", true]]}]}, {"comp": "gestion_documental", "rol": "general", "tag": "Gestión documental · Ventanilla única y radicación", "texto": "Usted trabaja en la ventanilla única de correspondencia de una sede de la Procuraduría. El jueves, el coordinador le pide «apartar» los radicados de salida 1520 a 1525 para unos oficios que el despacho firmará la próxima semana. Ese mismo día, por un error del sistema, se generó el radicado de entrada 3307 para un documento que ya había sido radicado con el 3306. Además, un profesional le reenvía un escrito de un ciudadano que llegó directamente a su correo institucional, con un anexo en PDF.", "items": [{"id": "GD-116", "niv": 1, "e": "Ante la solicitud de apartar los radicados de salida para los oficios de la próxima semana, usted debe", "f": "Acuerdo 001 de 2024 del AGN, art. 4.2.3", "o": [["A", "asignarles desde ahora números consecutivos y anularlos con acta si al final no se usan.", "La anulación con acta (art. 4.2.3, par. 4, del Acuerdo 001 de 2024 del AGN) está prevista para errores en la radicación, no como mecanismo para apartar números, que el mismo artículo prohíbe.", false], ["B", "abstenerse de hacerlo, porque no se pueden reservar números de radicación.", "El artículo 4.2.3 del Acuerdo 001 de 2024 del AGN dispone que no se pueden reservar números de radicación ni habrá números repetidos, enmendados, corregidos o tachados; la numeración se asigna en estricto orden consecutivo.", true], ["C", "apartarlos, siempre que deje constancia en la planilla de la ventanilla de los números reservados.", "La reserva de números está prohibida aunque se deje constancia (art. 4.2.3, Acuerdo 001 de 2024); el radicado se asigna al momento del envío, con fecha y hora.", false]]}, {"id": "GD-117", "niv": 2, "e": "Respecto del radicado 3307, generado por error, lo procedente es", "f": "Acuerdo 001 de 2024 del AGN, art. 4.2.3, parágrafo 4", "o": [["A", "anularlo con una anotación en el sistema firmada por el técnico de la ventanilla que cometió el error.", "La anulación debe constar en acta o documento equivalente con justificación y firma del jefe del área responsable de archivo o gestión documental (art. 4.2.3, par. 4, del Acuerdo 001 de 2024 del AGN), no del técnico que radicó.", false], ["B", "reutilizar el número 3307 para la siguiente comunicación que llegue, anotando el cambio en la planilla de control, para que no quede un vacío en la numeración consecutiva.", "Reasignar un número ya generado produce números repetidos o corregidos, lo que prohíbe el artículo 4.2.3 del Acuerdo 001 de 2024; el número errado se anula y se deja constancia.", false], ["C", "anularlo y dejar constancia en un acta o documento equivalente, con la justificación y la firma del jefe del área de gestión documental.", "El parágrafo 4 del artículo 4.2.3 del Acuerdo 001 de 2024 del AGN dispone que, cuando existan errores en la radicación y se anulen números, se deje constancia en acta o documento equivalente con la justificación y la firma del jefe del área responsable de archivo o gestión documental.", true]]}, {"id": "GD-118", "niv": 2, "e": "Con el escrito del ciudadano que llegó al correo institucional del profesional, usted debe", "f": "Acuerdo 001 de 2024 del AGN, arts. 4.2.2 y 4.2.6", "o": [["A", "radicarlo junto con su anexo, verificando que tenga datos de contacto para la respuesta, y distribuirlo a la dependencia competente.", "El artículo 4.2.6 del Acuerdo 001 de 2024 del AGN ordena que las comunicaciones que ingresen por cualquier canal, incluidos los correos institucionales de servidores o contratistas, se remitan a la ventanilla única para radicarse con sus anexos, verificando los datos de contacto para la respuesta.", true], ["B", "devolverlo al profesional, porque al haberlo recibido él mismo en su correo institucional ya quedó oficialmente presentado ante la entidad.", "La llegada al correo de un servidor no oficializa el trámite; las comunicaciones recibidas por correos instituci
