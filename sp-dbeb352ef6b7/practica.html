onales deben radicarse en la ventanilla única o la sede electrónica (art. 4.2.6, Acuerdo 001 de 2024).", false], ["C", "pedir al ciudadano que lo envíe de nuevo por correo certificado para poder radicarlo.", "La ventanilla única debe habilitar canales presenciales y electrónicos (art. 4.2.2, par. 3, Acuerdo 001 de 2024); exigir el reenvío físico desconoce que el escrito ya ingresó por un canal de la entidad.", false]]}]}, {"comp": "gestion_documental", "rol": "tecnico", "tag": "Gestión documental · Niveles técnico, administrativo y operativo · Ventanilla única y radicación de comunicaciones oficiales", "texto": "Usted es técnico de la ventanilla de correspondencia de una procuraduría provincial. El procedimiento interno señala qué cargos están autorizados para firmar las comunicaciones oficiales que salen de la dependencia. Durante la mañana se presentan tres situaciones: un sustanciador trae un oficio dirigido a una alcaldía que aún no tiene firma y pide que se le asigne número de salida «para adelantar», porque el procurador lo firmará en la tarde; una ciudadana llega a presentar personalmente una petición; y por correo postal llega un escrito en el que se solicita a la procuraduría vigilar la ejecución de un contrato municipal, sin firma ni nombre de quien lo envía.", "items": [{"id": "GD-119", "niv": 2, "e": "Frente al oficio de salida que aún no tiene firma, el técnico de la ventanilla debe", "f": "Acuerdo 001 de 2024 del AGN, arts. 4.1.3 y 4.2.3", "o": [["A", "radicarlo de inmediato y anotar en la planilla de control que la firma está pendiente.", "La ventanilla única debe radicar solamente los documentos que cumplen lo establecido sobre firmas responsables (art. 4.1.3 del Acuerdo 001 de 2024 del AGN); una anotación en la planilla no suple la firma del servidor autorizado.", false], ["B", "abstenerse de radicarlo hasta que lo firme el servidor autorizado según el procedimiento.", "El art. 4.1.3 del Acuerdo 001 de 2024 del AGN ordena a las entidades fijar los cargos autorizados para firmar las comunicaciones oficiales y dispone que las ventanillas únicas radiquen solamente los documentos que cumplan esa exigencia.", true], ["C", "asignarle un número de radicado reservado, que quedará en firme cuando el procurador firme el oficio en la tarde.", "El art. 4.2.3 del Acuerdo 001 de 2024 del AGN prohíbe reservar números de radicación; además, el documento sin firma autorizada no puede radicarse (art. 4.1.3).", false]]}, {"id": "GD-120", "niv": 1, "e": "Al radicar la petición que la ciudadana presenta personalmente, debe quedar constancia de", "f": "Acuerdo 001 de 2024 del AGN, art. 4.2.3 y par. 3", "o": [["A", "la fecha, la hora de recibo y el número único de radicado.", "Según el art. 4.2.3 del Acuerdo 001 de 2024 del AGN, al radicar se deja constancia de la fecha, la hora de recibo o envío y el número único del radicado; el parágrafo 3 del mismo artículo ordena asignar radicado a las peticiones presentadas de manera presencial.", true], ["B", "el número de radicado y la fecha, sin registrar la hora, porque la fecha basta para contar los términos de respuesta.", "La hora de recibo es uno de los datos de los que debe quedar constancia al radicar (art. 4.2.3 del Acuerdo 001 de 2024 del AGN); omitirla resta trazabilidad a la actuación.", false], ["C", "la firma del profesional que tramitará la petición y la fecha en que deberá responderla.", "La radicación no exige la firma de quien tramitará el asunto; el art. 4.2.3 del Acuerdo 001 de 2024 del AGN pide dejar constancia de la fecha, la hora de recibo y el número único de radicado.", false]]}, {"id": "GD-121", "niv": 3, "e": "Respecto del escrito que llegó por correo postal sin firma ni nombre de quien lo envía, lo procedente en la ventanilla es", "f": "Acuerdo 001 de 2024 del AGN, arts. 4.1.3 y 4.2.6, par. 2", "o": [["A", "radicarlo solo después de que un profesional de la procuraduría confirme que los hechos descritos son ciertos.", "La radicación no depende de verificar previamente los hechos; es el registro inicial que permite el trámite (art. 4.2.3 del Acuerdo 001 de 2024 del AGN). La petición anónima se radica y se atiende (art. 4.2.6, par. 2).", false], ["B", "radicarlo como comunicación anónima y remitirlo a la dependencia competente para que lo atienda.", "Las comunicaciones que ingresan por cualquier canal se radican (art. 4.2.6 del Acuerdo 001 de 2024 del AGN), y el par. 2 de ese artículo precisa que la petición sin firma ni nombre del responsable se considera anónima y debe ser radicada y atendida; la dependencia competente decide su trámite.", true], ["C", "archivarlo sin radicar, porque la ventanilla solo puede radicar documentos con firma autorizada.", "La exigencia de firma autorizada del art. 4.1.3 del Acuerdo 001 de 2024 del AGN se refiere a las comunicaciones oficiales que firman los servidores de la entidad; para las peticiones sin firma ni nombre, el art. 4.2.6, par. 2, ordena radicarlas y atenderlas.", false]]}]}, {"comp": "gestion_documental", "rol": "general", "tag": "Gestión documental · Tiempos de retención y transferencias primarias", "texto": "La secretaría de una procuraduría provincial prepara su plan de transferencias. Entre sus expedientes está uno de la subserie «Derechos de petición», que se abrió el 15 de agosto de 2021 con la petición de un ciudadano. La respuesta de fondo se dio y el trámite terminó; el expediente se cerró el 10 de noviembre de 2023. La tabla de retención documental (TRD) vigente asigna a esa subserie dos años en el archivo de gestión y ocho en el archivo central. Un compañero propone «mandar las cajas al archivo central con una nota» y, más adelante, agregar al expediente una carta de agradecimiento que el ciudadano envió después de la transferencia.", "items": [{"id": "GD-122", "niv": 2, "e": "Según la TRD, el tiempo de retención de ese expediente en el archivo de gestión se cumple el", "f": "Acuerdo 001 de 2024 del AGN, art. 4.3.1.9", "o": [["A", "15 de agosto de 2023.", "Esta fecha cuenta los dos años desde la apertura del expediente; los tiempos de retención empiezan a contarse una vez cerrada la unidad documental (art. 4.3.1.9 del Acuerdo 001 de 2024 del AGN).", false], ["B", "10 de noviembre de 2025.", "El art. 4.3.1.9 del Acuerdo 001 de 2024 del AGN dispone que, cerrada la unidad documental, empiezan a contarse los tiempos de retención de la TRD: dos años desde el cierre del 10 de noviembre de 2023 llevan al 10 de noviembre de 2025.", true], ["C", "10 de noviembre de 2033.", "Esta fecha suma los dos años de gestión y los ocho del archivo central; corresponde al final de la retención total, no al de la etapa en el archivo de gestión.", false]]}, {"id": "GD-123", "niv": 2, "e": "Para hacer la transferencia primaria de esa subserie al archivo central, la secretaría debe", "f": "Acuerdo 001 de 2024 del AGN, arts. 4.3.1.6 y 4.4.3", "o": [["A", "enviar las cajas con un oficio remisorio que indique cuántas carpetas van, porque el archivo central es quien elabora la descripción al recibirlas.", "Desde la fase de gestión las oficinas productoras deben elaborar los inventarios documentales (art. 4.3.1.6, par. 1, del Acuerdo 001 de 2024 del AGN), y la entrega al archivo central se soporta con ellos y con acta (art. 4.4.3, par. 4).", false], ["B", "esperar a que el archivo central solicite cada expediente cuando lo necesite un usuario.", "Las transferencias primarias se programan en un plan anual, de conformidad con los tiempos de retención de la TRD (art. 4.4.3 del Acuerdo 001 de 2024 del AGN); no dependen de solicitudes de consulta.", false], ["C", "entregarla por series, con el inventario documental, la hoja de control firmada y un acta de entrega firmada por quienes intervienen.", "El art. 4.4.3 del Acuerdo 001 de 2024 del AGN exige transferir por series y subseries (par. 1), con la hoja de control o índice electrónico firmado (par. 2), soportada en inventarios documentales y con un acta de entrega firmada por las partes intervinientes (par. 4).", true]]}, {"id": "GD-124", "niv": 2, "e": "Sobre la propuesta de agregar la carta de agradecimiento al expediente ya transferido, es acertado afirmar que", "f": "Acuerdo 001 de 2024 del AGN, art. 4.4.2, par.", "o": [["A", "no procede, porque una vez recibida la transferencia no se deben incorporar nuevos documentos al expediente.", "El parágrafo del art. 4.4.2 del Acuerdo 001 de 2024 del AGN establece que, una vez recibida la transferencia documental, no se deben incorporar nuevos documentos a los expedientes.", true], ["B", "procede solo si la carta llega dentro del primer año siguiente a la transferencia.", "La norma no fija un plazo de gracia: una vez recibida la transferencia no se deben incorporar nuevos documentos a los expedientes (art. 4.4.2, par., del Acuerdo 001 de 2024 del AGN).", false], ["C", "procede si el archivo central refolia el expediente y actualiza la hoja de control.", "La refoliación no habilita agregar documentos a un expediente transferido; el parágrafo del art. 4.4.2 del Acuerdo 001 de 2024 del AGN lo impide.", false]]}]}, {"comp": "gestion_documental", "rol": "tecnico", "tag": "Gestión documental · Niveles técnico, administrativo y operativo · Hoja de control y rotulación de unidades de conservación", "texto": "Usted es técnico del archivo de gestión de la secretaría de una procuraduría provincial. Debe organizar los expedientes de las actuaciones disciplinarias terminadas el año anterior. Cada expediente reúne, en orden de producción, la queja, los autos, las comunicaciones, las pruebas y la decisión final, y algunos ocupan dos carpetas. También hay carpetas de unidades documentales simples, como los consecutivos de comunicaciones. Su jefe le pide revisar las hojas de control, porque en una auditoría interna se encontró que algunas estaban al final de la carpeta y numeradas como un folio más, y completar los rótulos de las carpetas antes de la transferencia.", "items": [{"id": "GD-125", "niv": 1, "e": "La hoja de control debe diligenciarse para", "f": "Acuerdo 001 de 2024 del AGN, arts. 4.3.1.6 y 4.3.1.8", "o": [["A", "todas las carpetas del archivo de gestión, incluidas las de unidades documentales simples como los consecutivos.", "La norma reserva la hoja de control a las unidades documentales complejas; para las simples, los controles de descripción se fijan en el Programa de Gestión Documental (art. 4.3.1.8, num. 5, del Acuerdo 001 de 2024 del AGN).", false], ["B", "solo los expedientes que se transferirán al archivo histórico.", "La hoja de control se diligencia desde la fase de gestión (art. 4.3.1.6, par. 1, del Acuerdo 001 de 2024 del AGN) y acompaña la transferencia primaria (art. 4.4.3, par. 2); no se limita a la transferencia secundaria.", false], ["C", "las unidades documentales complejas, como los expedientes de las actuaciones disciplinarias.", "El art. 4.3.1.8, num. 5, del Acuerdo 001 de 2024 del AGN señala que la hoja de control se diligencia para las unidades documentales complejas; para las simples, el PGD establece los controles de descripción.", true]]}, {"id": "GD-126", "niv": 2, "e": "Para corregir lo encontrado en la auditoría, la hoja de control de cada expediente debe", "f": "Acuerdo 001 de 2024 del AGN, art. 4.3.1.8, num. 5", "o": [["A", "quedar al final de la carpeta, numerarse como último folio y firmarse cuando se abre el expediente.", "La hoja de control se ubica al inicio de la unidad de conservación, no se folia y se firma al cierre del expediente (art. 4.3.1.8, num. 5, del Acuerdo 001 de 2024 del AGN).", false], ["B", "ubicarse al inicio de la carpeta, numerarse como folio 1 y firmarse cada vez que se agrega un documento al expediente.", "Aunque la ubicación al inicio es correcta, la hoja de control no se debe foliar y se firma al cierre del expediente, no con cada documento (art. 4.3.1.8, num. 5, del Acuerdo 001 de 2024 del AGN).", false], ["C", "ubicarse al inicio de la unidad de conservación, sin foliarse, y firmarse al cierre del expediente.", "El art. 4.3.1.8, num. 5, del Acuerdo 001 de 2024 del AGN dispone que la hoja de control se ubica al inicio de cada unidad de conservación, no se folia y se firma al cierre del expediente.", true]]}, {"id": "GD-127", "niv": 2, "e": "Entre los datos que deben aparecer en el rótulo de cada carpeta está", "f": "Acuerdo 001 de 2024 del AGN, art. 4.3.1.8, num. 6", "o": [["A", "un resumen de la decisión adoptada en la actuación.", "El rótulo sirve para ubicar y recuperar la unidad de conservación; el contenido de la decisión está en el propio expediente y no figura entre los datos de identificación del art. 4.3.1.8, num. 6, del Acuerdo 001 de 2024 del AGN.", false], ["B", "el número de folios y las fechas extremas del expediente.", "El art. 4.3.1.8, num. 6, del Acuerdo 001 de 2024 del AGN incluye en la identificación de las unidades de conservación el número de folios y las fechas extremas, junto con fondo, sección, subsección, código y nombre de la serie y subserie, nombre y número del expediente, y número de caja y carpeta.", true], ["C", "el nombre del servidor que tramitó la actuación y su número de documento de identidad.", "La identificación de las unidades de conservación no incluye datos del servidor que tramitó el asunto; comprende fondo, sección, subsección, serie y subserie, datos del expediente, folios, fechas extremas, caja y carpeta (art. 4.3.1.8, num. 6, del Acuerdo 001 de 2024 del AGN).", false]]}]}, {"comp": "gestion_documental", "rol": "general", "tag": "Gestión documental · Disposición final: conservación total, selección y digitalización", "texto": "En el archivo central de la Procuraduría se hace una jornada de inducción para el personal nuevo. La coordinadora explica que la TRD de cada dependencia fija, para cada serie o subserie, una disposición final: conservación total (CT), selección (S) o eliminación (E). Luego presenta una propuesta que recibió de otra dependencia: digitalizar los expedientes de una subserie que, según la TRD, se conserva diez años en total y luego se elimina; una vez digitalizados, eliminar de inmediato los originales en papel y reducir a cinco años el tiempo de retención, «porque las imágenes ya quedan guardadas en el sistema».", "items": [{"id": "GD-128", "niv": 1, "e": "Las series o subseries con disposición final de conservación total (CT) son aquellas que", "f": "Acuerdo 001 de 2024 del AGN, arts. 4.4.4, 4.5.2 y 4.5.4", "o": [["A", "pasan a guardarse indefinidamente por su valor como testimonio para la historia, la ciencia o la cultura.", "El art. 4.5.2 del Acuerdo 001 de 2024 del AGN define la conservación total atendiendo a los valores históricos, socioculturales, científicos o estéticos de los documentos, que justifican su permanencia.", true], ["B", "se eliminan cuando cumplen su tiempo de retención en el archivo central.", "La eliminación corresponde a la disposición final E, no a la conservación total (art. 4.5.4 del Acuerdo 001 de 2024 del AGN).", false], ["C", "permanecen en el archivo central hasta que el comité decida, caso por caso, si se seleccionan o se eliminan.", "La disposición final de conservación total ya queda fijada en la TRD o TVD (art. 4.5.2 del Acuerdo 001 de 2024 del AGN); no se decide caso por caso, y estas series pasan al archivo histórico (art. 4.4.4).", false]]}, {"id": "GD-129", "niv": 2, "e": "La disposición final de selección (S) se aplica a series o subseries", "f": "Acuerdo 001 de 2024 del AGN, arts. 4.5.2, 4.5.3 y 4.5.4", "o": [["A", "formadas por documentos de apoyo que no figuran en la TRD.", "Los documentos de apoyo no se consignan en la TRD y, por tanto, no reciben una disposición final de selección; pueden eliminarse cuando pierden su utilidad, con constancia en acta (art. 4.5.4, par. 2, del Acuerdo 001 de 2024 del AGN).", false], ["B", "muy voluminosas o con información repetida en otras, de las que se guarda una muestra representativa.", "El art. 4.5.3 del Acuerdo 001 de 2024 del AGN aplica la selección a series y subseries de gran volumen o cuyo contenido informativo se repite o se encuentra registrado en otras, con sustento en tamaños de muestra y métodos de selección.", true], ["C", "de valor histórico excepcional, de las que se conserva la totalidad de los expedientes producidos.", "Conservar la totalidad corresponde a la conservación total (art. 4.5.2 del Acuerdo 001 de 2024 del AGN); la selección conserva solo una muestra representativa.", false]]}, {"id": "GD-130", "niv": 3, "e": "Sobre la propuesta de la otra dependencia, es acertado concluir que", "f": "Acuerdo 001 de 2024 del AGN, art. 4.3.2.5, par.", "o": [["A", "no es viable: digitalizar no cambia el tiempo fijado en la TRD ni autoriza destruir los originales.", "El parágrafo del art. 4.3.2.5 del Acuerdo 001 de 2024 del AGN dispone que la digitalización no puede aumentar ni disminuir el tiempo de retención de la TRD y que no pueden eliminarse documentos originales con el argumento de que han sido digitalizados.", true], ["B", "es viable si las imágenes quedan en el SGDEA con metadatos y el comité aprueba la propuesta.", "Ni la aprobación del comité ni el almacenamiento de las imágenes permiten eliminar originales por haber sido digitalizados o cambiar por esa razón la retención (art. 4.3.2.5, par., del Acuerdo 001 de 2024 del AGN).", false], ["C", "es viable en cuanto a reducir la retención, pero no en cuanto a eliminar los originales antes de tiempo.", "La digitalización tampoco puede disminuir el tiempo de retención establecido en la TRD (art. 4.3.2.5, par., del Acuerdo 001 de 2024 del AGN); ninguna de las dos partes de la propuesta es procedente.", false]]}]}, {"comp": "gestion_documental", "rol": "profesional", "tag": "Gestión documental · Niveles profesional, asesor y ejecutivo · Eliminación documental: requisitos y acta", "texto": "Usted es profesional del grupo de gestión documental de la Procuraduría. En el archivo central hay expedientes de una subserie que, según la TRD convalidada, ya cumplieron su tiempo de retención y tienen como disposición final la eliminación. El coordinador le encarga preparar el procedimiento. Al revisar las cajas, un auxiliar le sugiere aprovechar el proceso para retirar también, de los expedientes de otra subserie de conservación total, las fotocopias idénticas de algunos autos y las constancias de notificación, «que ya no aportan nada», para liberar espacio. El coordinador quiere saber qué requisitos se deben cumplir y qué pasará con los documentos que soporten la eliminación.", "items": [{"id": "GD-131", "niv": 2, "e": "Antes de eliminar los expedientes que cumplieron su tiempo de retención, la entidad debe", "f": "Acuerdo 001 de 2024 del AGN, art. 4.5.4, nums. 1 a 4", "o": [["A", "obtener la autorización escrita de cada dependencia productora y publicar el inventario en cartelera durante diez días hábiles, para que los interesados se pronuncien.", "La norma no prevé autorizaciones de las dependencias ni un término de diez días: la publicación del inventario es en el sitio web por sesenta días hábiles (art. 4.5.4, num. 2, del Acuerdo 001 de 2024 del AGN).", false], ["B", "acreditar que la TRD está convalidada y publicar el inventario en su sitio web durante treinta días hábiles.", "El inventario debe publicarse por sesenta días hábiles, no treinta, y el requisito previo es acreditar la inscripción de la TRD o TVD en el RUSD (art. 4.5.4, nums. 1 y 2, del Acuerdo 001 de 2024 del AGN).", false], ["C", "demostrar que la TRD está inscrita en el RUSD y dejar el inventario publicado en la web durante sesenta días hábiles.", "El art. 4.5.4 del Acuerdo 001 de 2024 del AGN exige, previo a la eliminación, acreditar la inscripción de la TRD o TVD en el Registro Único de Series Documentales (num. 1) y publicar en el sitio web, por sesenta días hábiles, el inventario de los documentos a eliminar (num. 2).", true]]}, {"id": "GD-132", "niv": 3, "e": "La eliminación de esos expedientes debe contar con", "f": "Acuerdo 001 de 2024 del AGN, arts. 1.4.3 y 4.5.4, num. 6", "o": [["A", "la aprobación del Archivo General de la Nación, con acta firmada por el secretario general de la entidad.", "La eliminación la aprueba el comité institucional de la entidad (art. 4.5.4 del Acuerdo 001 de 2024 del AGN); el AGN interviene como instancia de concepto cuando hay observaciones ciudadanas (nums. 3, 4 y 8), y el acta la suscriben el presidente y el secretario técnico del comité (num. 6).", false], ["B", "el aval del comité institucional de gestión y desempeño o quien haga sus veces, con acta de su presidente y su secretario técnico.", "El art. 4.5.4 del Acuerdo 001 de 2024 del AGN dispone que la eliminación debe ser aprobada por el Comité Institucional de Gestión y Desempeño o quien haga sus veces, y su num. 6 exige que conste en un acta de eliminación suscrita por el presidente y el secretario técnico de ese comité.", true], ["C", "el visto bueno del jefe de control interno, en un acta que firman él y el jefe del archivo central después de revisar el inventario publicado.", "Control interno verifica el cumplimiento de la normativa archivística en sus auditorías (art. 1.4.3 del Acuerdo 001 de 2024 del AGN), pero no aprueba la eliminación: esa decisión corresponde al comité (art. 4.5.4).", false]]}, {"id": "GD-133", "niv": 3, "e": "Frente a la sugerencia del auxiliar sobre los expedientes de la subserie de conservación total, lo correcto es que", "f": "Acuerdo 001 de 2024 del AGN, art. 4.5.4, num. 9", "o": [["A", "solo se retiren las fotocopias idénticas y se conserven las constancias de notificación, que integran el expediente.", "El art. 4.5.4, num. 9, del Acuerdo 001 de 2024 del AGN ordena eliminar por series y subseries y prohíbe eliminar tipos documentales de una serie o expediente, excepto cuando se trate de copias idénticas.", true], ["B", "se retiren ambas, porque las constancias de notificación pierden utilidad cuando la decisión queda en firme y ya no puede impugnarse.", "No se pueden eliminar tipos documentales de una serie o expediente, salvo copias idénticas (art. 4.5.4, num. 9, del Acuerdo 001 de 2024 del AGN); las constancias de notificación son tipos documentales del expediente.", false], ["C", "no se retire ningún documento, ni siquiera las copias idénticas, porque la subserie es de conservación total.", "La excepción de las copias idénticas aplica sin distinguir la disposición final de la serie (art. 4.5.4, num. 9, del Acuerdo 001 de 2024 del AGN); retirarlas no afecta la integridad del expediente.", false]]}, {"id": "GD-134", "niv": 2, "e": "Una vez hecha la eliminación, el acta y el inventario de los documentos eliminados", "f": "Acuerdo 001 de 2024 del AGN, art. 4.5.4, num. 7", "o": [["A", "se conservan durante el tiempo que fije la TRD para la serie de actas del comité.", "El num. 7 del art. 4.5.4 del Acuerdo 001 de 2024 del AGN no remite a un tiempo de retención: ordena conservarlos de manera permanente.", false], ["B", "se conservan de forma permanente, pero se retiran de la página web cuando concluye el proceso de eliminación de la serie.", "El num. 7 del art. 4.5.4 del Acuerdo 001 de 2024 del AGN exige conservarlos permanentemente y, además, mantenerlos publicados en el sitio web para consulta.", false], ["C", "deben guardarse de forma permanente y seguir disponibles para consulta en la página web de la entidad.", "Según el art. 4.5.4, num. 7, del Acuerdo 001 de 2024 del AGN, las actas de eliminación y el inventario de los documentos eliminados se conservan permanentemente y la entidad debe mantenerlos publicados en su sitio web para consulta.", true]]}]}, {"comp": "gestion_documental", "rol": "general", "tag": "Gestión documental · Documentos de apoyo, depuración y principios de la gestión documental", "texto": "Una auxiliar administrativa de la secretaría de una procuraduría provincial organiza el archivo de gestión. En los estantes encuentra carpetas con fotocopias de leyes y decretos, circulares enviadas por otras entidades «para conocimiento» y revistas jurídicas que los abogados guardan solo como material de consulta. En los expedientes de las actuaciones hay hojas en blanco y algunas fotocopias idénticas de documentos que ya están en original. Antes de foliar, un compañero le recomienda imprimir todos los correos electrónicos recibidos durante el año, «para que el archivo quede completo en papel», aunque ninguna norma ni la TRD exige conservarlos impresos.", "items": [{"id": "GD-135", "niv": 1, "e": "Las fotocopias de normas, las circulares recibidas para conocimiento y las revistas que se guardan como material de consulta son", "f": "Ley 594 de 2000, art. 3; Acuerdo 001 de 2024 del AGN, art. 4.5.4, par. 2", "o": [["A", "documentos de apoyo, que no se consignan en la TRD.", "El art. 4.5.4, par. 2, del Acuerdo 001 de 2024 del AGN señala que los documentos de apoyo no se consignan en la TRD de las dependencias y pueden eliminarse cuando pierdan su utilidad, dejando constancia en acta o documento equivalente.", true], ["B", "documentos de archivo de conservación total, por su valor jurídico.", "No son documentos producidos o recibidos en ejercicio de las funciones de la secretaría (art. 3 de la Ley 594 de 2000), sino material de consulta; por eso no tienen disposición final en la TRD.", false], ["C", "una serie documental propia de la secretaría, que debe incluirse en la tabla de retención.", "Los documentos de apoyo no se consignan en la TRD (art. 4.5.4, par. 2, del Acuerdo 001 de 2024 del AGN); no conforman series documentales de la dependencia.", false]]}, {"id": "GD-136", "niv": 2, "e": "Antes de foliar los expedientes de las actuaciones, la auxiliar debe", "f": "AGN, instructivo «Foliación en archivos» (2021); Acuerdo 001 de 2024 del AGN, art. 4.5.4, num. 9", "o": [["A", "foliar todas las hojas, incluidas las que están en blanco y las fotocopias idénticas, y depurar después de la transferencia.", "Según el instructivo de foliación del AGN, la depuración es un requisito previo a la foliación; foliar primero obligaría a refoliar después de retirar hojas.", false], ["B", "depurar los expedientes, retirando las hojas en blanco, las fotocopias idénticas y los documentos de apoyo.", "El instructivo «Foliación en archivos» del AGN establece como requisito previo a la foliación la depuración: retirar duplicados idénticos, folios en blanco y documentos de apoyo; el Acuerdo 001 de 2024 permite retirar copias idénticas (art. 4.5.4, num. 9).", true], ["C", "foliar solo las hojas que tengan firma, porque las demás no son documentos de archivo.", "La foliación es consecutiva sobre todos los documentos que conforman el expediente una vez depurado (instructivo de foliación del AGN); la firma no es el criterio para foliar.", false]]}, {"id": "GD-137", "niv": 2, "e": "La recomendación de imprimir todos los correos aunque ninguna norma lo exija va en contra del principio de la gestión documental denominado", "f": "Decreto 1080 de 2015, art. 2.8.2.5.5", "o": [["A", "neutralidad tecnológica.", "La neutralidad tecnológica se refiere a la libre adopción de tecnologías por parte del Estado (art. 2.8.2.5.5 del Decreto 1080 de 2015); no trata de evitar impresiones innecesarias.", false], ["B", "disponibilidad.", "El principio de disponibilidad pide que los documentos estén disponibles cuando se requieran, independientemente del medio de creación (art. 2.8.2.5.5 del Decreto 1080 de 2015); no es el que desaconseja imprimir sin necesidad.", false], ["C", "protección del medio ambiente.", "El art. 2.8.2.5.5 del Decreto 1080 de 2015 incluye el principio de protección del medio ambiente, según el cual las entidades deben evitar producir documentos impresos en papel cuando no se requiera por razones legales o de preservación histórica.", true]]}]}, {"comp": "gestion_documental", "rol": "general", "tag": "Gestión documental · Procesos de la gestión documental", "texto": "La secretaría general de la Procuraduría revisa su Programa de Gestión Documental (PGD) y reparte tareas entre tres equipos. El primero diseñará un nuevo formato para las solicitudes de copias antes de que empiece a usarse y definirá cómo se registrará en el sistema de gestión documental. El segundo se encargará de que cada comunicación recibida quede registrada, vinculada al trámite que corresponde, distribuida al responsable y con seguimiento hasta que el asunto se resuelva. El tercero estudiará las series de la entidad para determinar cuáles tienen solo valores administrativos y legales y cuáles tienen además valores para la investigación y la historia, con el fin de decidir su destino final.", "items": [{"id": "GD-138", "niv": 2, "e": "La tarea del segundo equipo, de registrar, vincular, distribuir y hacer seguimiento a las comunicaciones hasta la resolución del asunto, corresponde al proceso de", "f": "Decreto 1080 de 2015, art. 2.8.2.5.9", "o": [["A", "planeación documental.", "La planeación se ocupa de la generación y valoración de los documentos, incluido el diseño de formas y formularios (art. 2.8.2.5.9, lit. a, del Decreto 1080 de 2015), no del seguimiento de cada comunicación.", false], ["B", "gestión y trámite.", "El art. 2.8.2.5.9, lit. c, del Decreto 1080 de 2015 define la gestión y trámite como las actuaciones para el registro, la vinculación a un trámite, la distribución, la descripción, la disponibilidad y el control y seguimiento de los trámites hasta la resolución de los asuntos.", true], ["C", "organización documental.", "La organización comprende declarar el documento en el sistema, clasificarlo, ubicarlo, ordenarlo y describirlo (art. 2.8.2.5.9, lit. d, del Decreto 1080 de 2015); no incluye la distribución ni el seguimiento del trámite.", false]]}, {"id": "GD-139", "niv": 2, "e": "La tarea del tercer equipo corresponde al proceso de", "f": "Decreto 1080 de 2015, art. 2.8.2.5.9", "o": [["A", "transferencia, que se realiza una sola vez al final del ciclo vital.", "La transferencia agrupa las operaciones para trasladar documentos entre las fases de archivo (art. 2.8.2.5.9, lit. e, del Decreto 1080 de 2015); no es el proceso que determina los valores de los documentos.", false], ["B", "disposición de documentos, que se aplica a las series cuando cumplen su tiempo en el archivo central.", "La disposición puede aplicarse en cualquier etapa según la TRD o TVD (art. 2.8.2.5.9, lit. f, del Decreto 1080 de 2015), y la determinación de valores primarios y secundarios es propia de la valoración (lit. h).", false], ["C", "valoración, proceso continuo que comienza desde la planificación de los documentos.", "El art. 2.8.2.5.9, lit. h, del Decreto 1080 de 2015 define la valoración como un proceso permanente y continuo, que inicia desde la planificación, por medio del cual se determinan los valores primarios y secundarios para establecer la permanencia y el destino final de los documentos.", true]]}, {"id": "GD-140", "niv": 2, "e": "El diseño del nuevo formato de solicitud de copias, antes de su uso, hace parte del proceso de", "f": "Decreto 1080 de 2015, art. 2.8.2.5.9", "o": [["A", "planeación, que comprende la creación y diseño de formas, formularios y documentos.", "El art. 2.8.2.5.9, lit. a, del Decreto 1080 de 2015 incluye en la planeación la creación y diseño de formas, formularios y documentos, el análisis de procesos, el análisis diplomático y su registro en el sistema de gestión documental.", true], ["B", "organización, porque el formato debe clasificarse en el CCD.", "La organización recae sobre los documentos ya producidos: los clasifica, ordena y describe (art. 2.8.2.5.9, lit. d, del Decreto 1080 de 2015); el diseño de formatos ocurre antes.", false], ["C", "gestión y trámite, porque el formato servirá para tramitar las solicitudes.", "La gestión y trámite comprende el registro, la distribución y el seguimiento de los documentos hasta resolver los asuntos (art. 2.8.2.5.9, lit. c, del Decreto 1080 de 2015); el diseño previo de formatos está asignado a la planeación.", false]]}]}, {"comp": "gestion_documental", "rol": "profesional", "tag": "Gestión documental · Niveles profesional, asesor y ejecutivo · PGD, política de gestión documental y control interno", "texto": "Usted es profesional de la secretaría general de la Procuraduría y participa en una mesa de trabajo sobre gestión documental. Un asistente propone formular el Programa de Gestión Documental (PGD) solo para el año en curso y en un documento aparte del Plan Estratégico Institucional, «para no complicar la planeación». La representante de control interno afirma que su oficina no incluye temas de archivo en sus auditorías, porque eso «le toca al Archivo General de la Nación». Por último, el grupo de gestión documental presenta un borrador de la política institucional de gestión documental y pregunta cómo debe aprobarse y darse a conocer.", "items": [{"id": "GD-141", "niv": 2, "e": "Frente a la propuesta del asistente sobre el PGD, la norma dispone que este debe formularse", "f": "Decreto 1080 de 2015, art. 2.8.2.5.10", "o": [["A", "a corto, mediano y largo plazo, como parte del Plan Estratégico Institucional y del Plan de Acción Anual.", "El art. 2.8.2.5.10 del Decreto 1080 de 2015 obliga a todas las entidades del Estado a formular un PGD a corto, mediano y largo plazo, como parte del Plan Estratégico Institucional y del Plan de Acción Anual.", true], ["B", "a corto, mediano y largo plazo, en un documento que adopta directamente el Archivo General de la Nación.", "Cada entidad formula su propio PGD como parte de su planeación institucional (art. 2.8.2.5.10 del Decreto 1080 de 2015); el AGN no lo adopta por ella.", false], ["C", "para una sola vigencia anual, en un documento independiente del Plan Estratégico Institucional y sin relación con el Plan de Acción.", "El PGD no es un documento aislado de una vigencia: se formula a corto, mediano y largo plazo e integrado al Plan Estratégico Institucional y al Plan de Acción Anual (art. 2.8.2.5.10 del Decreto 1080 de 2015).", false]]}, {"id": "GD-142", "niv": 3, "e": "Sobre lo dicho por la representante de control interno, es acertado afirmar que esa oficina", "f": "Acuerdo 001 de 2024 del AGN, art. 1.4.3; Decreto 1080 de 2015, art. 2.8.2.5.11", "o": [["A", "solo puede revisar el tema si el comité se lo solicita por escrito.", "La inclusión del tema en el plan anual de auditorías es un deber propio de control interno (art. 1.4.3 del Acuerdo 001 de 2024 del AGN), no una actuación sujeta a solicitud del comité.", false], ["B", "no tiene competencia en el tema, porque verificar el cumplimiento de la normativa archivística es función exclusiva del AGN.", "Además de la inspección que ejerce el AGN, el art. 1.4.3 del Acuerdo 001 de 2024 asigna a los jefes de control interno la tarea de incluir en su plan anual de auditorías la verificación del cumplimiento del Acuerdo.", false], ["C", "debe incorporar en su plan anual de auditorías acciones para verificar el cumplimiento de la normativa archivística.", "El art. 1.4.3 del Acuerdo 001 de 2024 del AGN, en concordancia con el art. 2.8.2.5.11 del Decreto 1080 de 2015, dispone que los jefes de control interno incorporen en su plan anual de auditorías acciones para verificar el cumplimiento del Acuerdo en desarrollo del PGD.", true]]}, {"id": "GD-143", "niv": 2, "e": "La política institucional de gestión documental debe", "f": "Acuerdo 001 de 2024 del AGN, art. 1.2.5", "o": [["A", "adoptarse por el Archivo General de la Nación mediante resolución dirigida a la entidad.", "Cada entidad formula su propia política institucional; el AGN fija lineamientos de referencia (art. 1.2.5, par. 1, del Acuerdo 001 de 2024), pero la aprobación corresponde al comité de la entidad (par. 2).", false], ["B", "ser aprobada por el comité de archivo o el institucional de gestión y desempeño, o quien haga sus veces, y publicarse en la página web.", "El art. 1.2.5, par. 2, del Acuerdo 001 de 2024 del AGN dispone que la política institucional de gestión documental debe ser aprobada por el Comité de archivo o el Comité Institucional de Gestión y Desempeño, o quien haga sus veces, y publicada en la página web de la entidad.", true], ["C", "ser aprobada por el comité competente y mantenerse como documento interno, sin publicarse en la página web.", "Además de la aprobación del comité, el art. 1.2.5, par. 2, del Acuerdo 001 de 2024 del AGN exige publicarla en la página web de la entidad.", false]]}]}, {"comp": "gestion_documental", "rol": "tecnico", "tag": "Gestión documental · Niveles técnico, administrativo y operativo · Expediente electrónico y expediente híbrido", "texto": "Usted es técnico de apoyo en una procuraduría provincial que tramita sus actuaciones en el Sistema de Gestión de Documentos Electrónicos de Archivo (SGDEA) de la entidad. Un sustanciador le pregunta qué debe contener como mínimo un expediente electrónico y cómo se reemplaza la foliación cuando no hay papel. Además, en una actuación se recibieron por ventanilla unas pruebas en papel que no se pueden digitalizar por su formato, mientras el resto del expediente está en el sistema. El sustanciador quiere saber cómo manejar ese expediente, que tiene una parte física y otra electrónica.", "items": [{"id": "GD-144", "niv": 1, "e": "Los elementos mínimos de un expediente electrónico de archivo son", "f": "Acuerdo 001 de 2024 del AGN, arts. 4.3.1.8 y 4.3.2.2", "o": [["A", "los documentos escaneados en PDF, una carpeta física espejo con sus impresiones y una hoja de control firmada en papel.", "La norma no exige una carpeta física espejo; los elementos mínimos son los documentos electrónicos de archivo, el índice electrónico, su firma y los metadatos (art. 4.3.2.2 del Acuerdo 001 de 2024 del AGN).", false], ["B", "los documentos electrónicos y una hoja de control en papel firmada por el técnico.", "En el expediente electrónico, el equivalente funcional de la hoja de control es el índice electrónico (art. 4.3.1.8, num. 5, del Acuerdo 001 de 2024 del AGN); no se exige una hoja de control en papel.", false], ["C", "los documentos electrónicos de archivo, el índice electrónico, la firma del índice y los metadatos.", "El art. 4.3.2.2 del Acuerdo 001 de 2024 del AGN fija como elementos mínimos del expediente electrónico los documentos electrónicos de archivo, el índice electrónico, la firma del índice electrónico y los metadatos.", true]]}, {"id": "GD-145", "niv": 2, "e": "En los documentos electrónicos, el equivalente funcional de la foliación es", "f": "Acuerdo 001 de 2024 del AGN, art. 4.3.1.8, num. 4", "o": [["A", "su asociación a un índice electrónico.", "El art. 4.3.1.8, num. 4, del Acuerdo 001 de 2024 del AGN dispone que, para los documentos electrónicos, el equivalente funcional de la foliación es su asociación a un índice electrónico.", true], ["B", "la numeración manual de las páginas de cada archivo PDF con un sello digital.", "La norma no establece la numeración de páginas con sellos como equivalente de la foliación; el equivalente es la asociación al índice electrónico (art. 4.3.1.8, num. 4, del Acuerdo 001 de 2024 del AGN).", false], ["C", "la impresión de los documentos para foliarlos con lápiz.", "Imprimir para foliar desconoce que la norma prevé un equivalente funcional electrónico: la asociación del documento a un índice electrónico (art. 4.3.1.8, num. 4, del Acuerdo 001 de 2024 del AGN).", false]]}, {"id": "GD-146", "niv": 3, "e": "Respecto del expediente que tiene una parte en papel y otra en el sistema, lo correcto es que", "f": "Acuerdo 001 de 2024 del AGN, arts. 4.3.2.5 y 4.3.3.1", "o": [["A", "se conformen dos expedientes independientes, uno físico y otro electrónico, cada uno con su número.", "Aunque los soportes estén separados, el expediente híbrido es una sola unidad documental en razón del trámite (art. 4.3.3.1 del Acuerdo 001 de 2024 del AGN).", false], ["B", "se maneje como una sola unidad documental, con referencia cruzada en la hoja de control y en el índice electrónico.", "El art. 4.3.3.1 del Acuerdo 001 de 2024 del AGN dispone que el expediente híbrido forma una sola unidad documental y su par. 2 exige una referencia cruzada en la hoja de control y en el índice electrónico entre los documentos físicos y electrónicos.", true], ["C", "se digitalicen las pruebas en papel y luego se eliminen los originales, para que el expediente quede solo en el sistema.", "No pueden eliminarse documentos originales con el argumento de que han sido digitalizados (art. 4.3.2.5, par., del Acuerdo 001 de 2024 del AGN); el expediente se maneja como híbrido (art. 4.3.3.1).", false]]}]}, {"comp": "gestion_documental", "rol": "profesional", "tag": "Gestión documental · Niveles profesional, asesor y ejecutivo · SGDEA y actualización y convalidación de la TRD", "texto": "Usted es profesional del grupo de gestión documental de la Procuraduría, entidad del orden nacional. La secretaría general planea adquirir un nuevo Sistema de Gestión de Documentos Electrónicos de Archivo (SGDEA) y le pide indicar qué debe elaborarse antes. Además, mediante resolución se creó un nuevo grupo interno de trabajo en la secretaría general; el grupo producirá documentos de series que ya existen en la TRD, sin crear series ni subseries nuevas y sin cambiar los criterios de valoración. Por último, le preguntan qué instancia externa convalida las TRD de la entidad.", "items": [{"id": "GD-147", "niv": 2, "e": "Antes de implementar el nuevo SGDEA, la entidad debe", "f": "Acuerdo 001 de 2024 del AGN, arts. 4.3.2.1, 4.3.2.5 y 5.1.2.1", "o": [["A", "eliminar los expedientes físicos que se van a migrar, para evitar que existan duplicados en papel cuando el sistema entre en funcionamiento.", "No pueden eliminarse documentos originales con el argumento de que han sido digitalizados (art. 4.3.2.5, par., del Acuerdo 001 de 2024 del AGN); la eliminación solo procede según la TRD o la TVD.", false], ["B", "obtener la convalidación del sistema por el Consejo Departamental de Archivos.", "Los consejos territoriales convalidan TRD y TVD de entidades territoriales (art. 5.1.2.1, par., del Acuerdo 001 de 2024 del AGN); no convalidan sistemas de información. El requisito previo al SGDEA es el Modelo de Requisitos (art. 4.3.2.1, par. 3).", false], ["C", "elaborar el Modelo de Requisitos de Documentos Electrónicos de Archivo, según los lineamientos del AGN.", "El art. 4.3.2.1, par. 3, del Acuerdo 001 de 2024 del AGN dispone que, para implementar el SGDEA, las entidades deben elaborar previamente el Modelo de Requisitos de Documentos Electrónicos de Archivo, atendiendo los lineamientos del AGN.", true]]}, {"id": "GD-148", "niv": 3, "e": "Por la creación del nuevo grupo interno de trabajo, en relación con la TRD corresponde", "f": "Acuerdo 001 de 2024 del AGN, arts. 5.1.4.1, 5.1.4.2 y 5.1.4.4", "o": [["A", "no actualizarla, porque la creación de grupos internos de trabajo no es causal de actualización.", "La creación o supresión de grupos internos de trabajo es una de las causales de actualización de la TRD (art. 5.1.4.1, num. 2, del Acuerdo 001 de 2024 del AGN).", false], ["B", "actualizarla dentro de los seis meses siguientes y, como no requiere convalidación, remitirla a la instancia competente dentro de los treinta días hábiles siguientes a su aprobación.", "La creación de grupos internos obliga a actualizar la TRD (art. 5.1.4.1, num. 2) dentro de los seis meses siguientes (art. 5.1.4.2); como no está entre las causales que exigen convalidación, se remite dentro de los treinta días hábiles siguientes a su aprobación (art. 5.1.4.4, par. 2, del Acuerdo 001 de 2024 del AGN).", true], ["C", "actualizarla dentro de los dos años siguientes a la resolución y someterla a evaluación técnica y convalidación ante la instancia competente, como si se tratara de una tabla de retención elaborada por primera vez.", "El término para actualizar es de seis meses (art. 5.1.4.2 del Acuerdo 001 de 2024 del AGN), y la convalidación solo se exige para las causales del art. 5.1.4.4, entre las que no está la creación de grupos internos sin series nuevas.", false]]}, {"id": "GD-149", "niv": 2, "e": "Por tratarse de una entidad del orden nacional, la evaluación técnica y convalidación de las TRD de la Procuraduría corresponde a", "f": "Acuerdo 001 de 2024 del AGN, art. 5.1.2.1", "o": [["A", "el Comité Evaluador de Documentos del Archivo General de la Nación.", "El art. 5.1.2.1, par., num. 1, del Acuerdo 001 de 2024 del AGN asigna al Comité Evaluador de Documentos del AGN la evaluación técnica y convalidación de las TRD y TVD de las entidades del orden nacional.", true], ["B", "el Comité Institucional de Gestión y Desempeño de la propia entidad.", "El comité institucional aprueba las TRD, pero la evaluación técnica y convalidación las hace la instancia externa competente (art. 5.1.2.1 del Acuerdo 001 de 2024 del AGN).", false], ["C", "el consejo departamental de archivos del lugar donde funciona cada procuraduría provincial.", "Los consejos territoriales de archivos convalidan las TRD de las entidades del orden territorial de su jurisdicción (art. 5.1.2.1, par., num. 2, del Acuerdo 001 de 2024 del AGN), no las de una entidad nacional.", false]]}]}, {"comp": "gestion_documental", "rol": "general", "tag": "Gestión documental · Documento de archivo, acceso y salida de documentos (Ley 594 de 2000)", "texto": "En el archivo central de la Procuraduría atienden a un ciudadano que pide consultar los expedientes de contratos de suministro ya liquidados por la entidad, que no tienen carácter reservado. Un auxiliar nuevo duda si debe atenderlo, porque cree que el archivo «es solo para uso interno». Ese mismo día, un servidor de una procuraduría provincial solicita llevarse a su casa, durante el fin de semana, varios expedientes originales para adelantar un informe. Al final de la jornada, el auxiliar pregunta qué se entiende por documento de archivo, porque en las cajas también encontró revistas y folletos publicitarios.", "items": [{"id": "GD-150", "niv": 1, "e": "De acuerdo con la Ley General de Archivos, un documento de archivo es", "f": "Ley 594 de 2000, art. 3", "o": [["A", "el registro de información producida o recibida por una entidad en razón de sus actividades o funciones.", "El art. 3 de la Ley 594 de 2000 define el documento de archivo como el registro de información producida o recibida por una entidad pública o privada en razón de sus actividades o funciones.", true], ["B", "únicamente el documento original firmado que tiene valor histórico.", "La definición del art. 3 de la Ley 594 de 2000 no se limita a originales firmados ni a documentos con valor histórico; abarca la información producida o recibida en razón de las funciones, en todo el ciclo vital.", false], ["C", "cualquier papel que se encuentre en las instalaciones de la entidad, incluidas las revistas y los folletos publicitarios.", "Lo que define el documento de archivo no es su ubicación sino su origen: información producida o recibida en razón de las actividades o funciones (art. 3 de la Ley 594 de 2000).", false]]}, {"id": "GD-151", "niv": 2, "e": "Frente a la solicitud del ciudadano, lo correcto es reconocer que", "f": "Ley 594 de 2000, arts. 4 y 27", "o": [["A", "no puede consultarlos, porque los documentos del archivo central son de uso exclusivo de la entidad mientras no pasen al archivo histórico.", "La Ley 594 de 2000 no restringe la consulta a los documentos del archivo histórico; el acceso a los archivos públicos es un derecho ciudadano, salvo las excepciones de ley (arts. 4, lit. f, y 27).", false], ["B", "puede consultarlos solo si demuestra que fue parte en los contratos.", "El derecho de consulta no está limitado a quienes fueron parte: todas las personas pueden consultar los documentos de archivos públicos que no tengan carácter reservado (art. 27 de la Ley 594 de 2000).", false], ["C", "tiene derecho a consultarlos y a obtener copia, porque no tienen carácter reservado.", "El art. 4, lit. f, de la Ley 594 de 2000 consagra el acceso a los archivos públicos como un derecho de los ciudadanos, salvo las excepciones legales, y el art. 27 reconoce el derecho a consultarlos y a obtener copia si no tienen carácter reservado.", true]]}, {"id": "GD-152", "niv": 2, "e": "Respecto de la solicitud de llevarse los expedientes originales a la casa, es acertado afirmar que", "f": "Ley 594 de 2000, arts. 4 y 30", "o": [["A", "es viable porque se trata de un servidor de la misma entidad, que ya responde por los documentos.", "Ser servidor de la entidad no habilita la salida de los documentos: la Ley 594 de 2000 la limita a motivos legales (art. 30), y la responsabilidad de los servidores por los documentos (art. 4, lit. d) refuerza su custodia.", false], ["B", "no es viable, porque solo por motivos legales puede autorizarse la salida temporal de documentos de archivo.", "El art. 30 de la Ley 594 de 2000 dispone que solo por motivos legales las entidades del Estado podrán autorizar la salida temporal de los documentos de archivo; adelantar un informe en casa no es uno de ellos.", true], ["C", "es viable si el servidor firma un recibo en el que se compromete a devolverlos el lunes.", "Un recibo de préstamo no convierte la conveniencia del servidor en un motivo legal; solo por motivos legales puede autorizarse la salida temporal de documentos de archivo (art. 30 de la Ley 594 de 2000).", false]]}]}, {"comp": "gestion_documental", "rol": "tecnico", "tag": "Gestión documental · Niveles técnico, administrativo y operativo · Inventarios documentales e integración de comunicaciones al expediente", "texto": "Usted es técnico de la secretaría de una procuraduría provincial. La jefa le pide actualizar el inventario del archivo de gestión, porque un compañero asegura que esa tarea «la hace el archivo central cuando recibe las cajas». También le consulta sobre una petición que entró por la ventanilla, quedó radicada en el sistema y fue respondida por la dependencia: el compañero sostiene que, como ya está en el sistema de radicación, no hace falta incluirla en el expediente físico del trámite. Usted debe aclarar ambas dudas con base en la normativa archivística vigente.", "items": [{"id": "GD-153", "niv": 1, "e": "El Formato Único de Inventario Documental (FUID) se utiliza para", "f": "Acuerdo 001 de 2024 del AGN, arts. 1.3.2, 4.3.1.6 y 4.4.3", "o": [["A", "describir las unidades documentales en los inventarios, como los de transferencia o de entrega del cargo.", "El Acuerdo 001 de 2024 del AGN adopta el FUID para los inventarios documentales (art. 4.3.1.6, par. 2), que soportan la transferencia (art. 4.4.3, par. 4) y la entrega de los documentos al ser trasladado o desvinculado (art. 1.3.2).", true], ["B", "registrar en la ventanilla las comunicaciones que se radican cada día.", "El registro de la radicación se lleva en los sistemas y planillas de la ventanilla (arts. 4.2.3 y 4.2.5 del Acuerdo 001 de 2024 del AGN); el FUID es un instrumento de descripción de unidades documentales.", false], ["C", "fijar los tiempos de retención de cada serie y subserie.", "Los tiempos de retención se fijan en la TRD (art. 24 de la Ley 594 de 2000), no en el inventario.", false]]}, {"id": "GD-154", "niv": 2, "e": "Sobre quién elabora los inventarios documentales del archivo de gestión, lo correcto es que", "f": "Ley 594 de 2000, art. 26; Acuerdo 001 de 2024 del AGN, arts. 4.3.1.6 y 4.4.2", "o": [["A", "los elabora el archivo central únicamente cuando recibe las transferencias primarias de las dependencias.", "El archivo central verifica la aplicación de los instrumentos al recibir (art. 4.4.2 del Acuerdo 001 de 2024 del AGN), pero los inventarios los elaboran las oficinas productoras desde la fase de gestión (art. 4.3.1.6, par. 1).", false], ["B", "los elaboran las oficinas productoras desde la fase de gestión de los documentos.", "El art. 4.3.1.6, par. 1, del Acuerdo 001 de 2024 del AGN dispone que las oficinas productoras, desde la fase de gestión, deben elaborar inventarios documentales, hojas de control o índice electrónico.", true], ["C", "los elabora el AGN durante sus visitas de inspección.", "El AGN no elabora los inventarios de las entidades; la Ley 594 de 2000 (art. 26) obliga a las entidades a elaborarlos y el Acuerdo 001 de 2024 asigna esa tarea a las oficinas productoras (art. 4.3.1.6, par. 1).", false]]}, {"id": "GD-155", "niv": 3, "e": "Sobre la petición radicada y respondida, es correcto afirmar que", "f": "Acuerdo 001 de 2024 del AGN, arts. 4.2.5 y 4.3.1.8", "o": [["A", "debe guardarse en un consecutivo de la ventanilla, separado del expediente del trámite, para no duplicar la información ya registrada en el sistema.", "Separar la petición del expediente rompe la unidad del trámite; la norma exige incluirla en el expediente de la serie o subserie de la dependencia competente (art. 4.2.5, par., del Acuerdo 001 de 2024 del AGN) y respetar el orden original (art. 4.3.1.8, num. 2).", false], ["B", "basta con su registro en el sistema de radicación, que reemplaza su inclusión en el expediente.", "El registro en el sistema no sustituye la inclusión en el expediente: las peticiones deben incluirse en el expediente de la serie o subserie que corresponda, sin importar que estén registradas en sistemas manuales o automatizados (art. 4.2.5, par., del Acuerdo 001 de 2024 del AGN).", false], ["C", "debe incluirse en el expediente de la serie o subserie que corresponda según la TRD de la dependencia competente para resolverla.", "El parágrafo del art. 4.2.5 del Acuerdo 001 de 2024 del AGN ordena que las comunicaciones oficiales y las peticiones, aunque estén registradas en sistemas manuales o automatizados, se incluyan en el expediente de la serie o subserie de la TRD de la dependencia competente para resolver el trámite.", true]]}]}, {"comp": "documentos_oficina", "rol": "general", "tag": "Elaboración de documentos de oficina · Partes de la carta u oficio", "texto": "Usted es auxiliar administrativo de una procuraduría provincial y revisa el borrador de un oficio dirigido al alcalde del municipio donde funciona la sede. El borrador tiene estos problemas: debajo del nombre y el cargo del destinatario dice «La ciudad»; en el saludo aparece «Respetado señor alcalde» sin un signo de puntuación claro; y al final, el bloque del remitente muestra primero el cargo en mayúscula sostenida, luego el nombre de la procuradora con mayúscula inicial y la firma debajo de ambos. La entidad elabora sus comunicaciones con base en los lineamientos de la guía técnica colombiana sobre documentos (GTC 185) y en las normas de la Real Academia Española.", "items": [{"id": "DO-101", "niv": 1, "e": "Después del saludo «Respetado señor alcalde» debe escribirse", "f": "RAE, Ortografía básica, uso de los dos puntos en cartas y documentos (ver notas-do.md)", "o": [["A", "una coma, así: «Respetado señor alcalde,».", "La Real Academia Española señala que en español, tras el saludo de cartas y documentos, se escriben dos puntos; el uso de la coma en esa posición es un anglicismo ortográfico.", false], ["B", "punto y coma, para separar el saludo del primer párrafo del oficio.", "El punto y coma no se usa tras el saludo de una carta; la norma académica prescribe los dos puntos para esa función.", false], ["C", "dos puntos, y el texto continúa en la línea siguiente.", "Según la ortografía de la Real Academia Española, tras las fórmulas de saludo de cartas y documentos se escriben dos puntos, y lo que sigue se escribe en línea aparte, con mayúscula inicial.", true]]}, {"id": "DO-102", "niv": 2, "e": "Como el destinatario está en la misma ciudad que la procuraduría provincial, en los datos del destinatario se debe", "f": "Guías institucionales que citan la GTC 185: UIS GGD.10, Senado GD-IT01, ADR circular 028 (ver notas-do.md)", "o": [["A", "escribir el nombre de la ciudad, sin usar «La ciudad» ni «Presente».", "Las guías de comunicaciones oficiales de la UIS y del Senado de la República, que siguen la GTC 185, indican escribir el nombre de la ciudad de destino aun cuando sea la misma de origen, y no usar «La ciudad» ni «Presente».", true], ["B", "mantener «La ciudad», porque el destinatario se encuentra en el mismo municipio que la sede que remite el oficio.", "Las guías institucionales basadas en la GTC 185 consultadas indican que se escribe el nombre de la ciudad aunque el destinatario esté en el mismo lugar; no se usa «La ciudad».", false], ["C", "cambiarlo por «Presente», porque el oficio se entregará personalmente.", "Las guías institucionales basadas en la GTC 185 consultadas desaconsejan expresamente el uso de «Presente» en los datos del destinatario.", false]]}, {"id": "DO-103", "niv": 2, "e": "El bloque del remitente debe organizarse con", "f": "Guías institucionales que citan la GTC 185: UIS GGD.10, Senado GD-IT01, Alcaldía de Mitú (ver notas-do.md)", "o": [["A", "solo la firma y el número de cédula de quien suscribe.", "El bloque del remitente identifica a quien firma por su nombre y su cargo; el número de documento de identidad no hace parte de esos datos en las guías consultadas.", false], ["B", "la firma, debajo el nombre en mayúscula sostenida y en la línea siguiente el cargo con mayúscula inicial.", "Las guías institucionales basadas en la GTC 185 (UIS, Senado y Alcaldía de Mitú) indican escribir el nombre del remitente en mayúscula sostenida, el cargo en la línea siguiente con mayúscula inicial y la firma sobre el nombre.", true], ["C", "el cargo en mayúscula sostenida, debajo el nombre con mayúscula inicial y la firma al final.", "El orden recomendado es el inverso: la firma va sobre el nombre, el nombre se escribe en mayúscula sostenida y el cargo, con mayúscula inicial, en la línea siguiente.", false]]}]}, {"comp": "documentos_oficina", "rol": "tecnico", "tag": "Elaboración de documentos de oficina · Niveles técnico, administrativo y operativo · Líneas especiales: anexos, copias, redactor y transcriptor", "texto": "Usted es técnico de la secretaría de una procuraduría provincial y transcribe un oficio que redactó un sustanciador y que firmará el procurador provincial. El oficio remite a una entidad dos anexos: una copia de una resolución en seis folios y un disco compacto con grabaciones. El procurador pide enviar copia del oficio a la procuraduría regional. En el borrador, las líneas finales dicen «Anx.: resolución y CD» y «C.c.: Regional», y no aparecen los nombres de quienes participaron en la elaboración. La entidad sigue los lineamientos de la GTC 185 para la presentación de sus comunicaciones.", "items": [{"id": "DO-104", "niv": 1, "e": "La línea de anexos debería quedar así", "f": "Guías institucionales que citan la GTC 185: UIS GGD.10, Senado GD-IT01 (ver notas-do.md)", "o": [["A", "«Anx.: resolución y CD», con abreviaturas para ahorrar espacio.", "Las líneas especiales se escriben sin abreviar, según las guías basadas en la GTC 185; además, la línea debe indicar la cantidad de anexos y sus folios.", false], ["B", "«ANEXOS», en mayúscula sostenida, sin indicar la cantidad, porque esta se aprecia al abrir el sobre.", "Las guías basadas en la GTC 185 indican escribir la palabra con mayúscula inicial, seguida de dos puntos, y enunciar la cantidad de anexos y, entre paréntesis, su detalle.", false], ["C", "«Anexos: dos (resolución en seis folios y un disco compacto)».", "Según las guías de la UIS y del Senado basadas en la GTC 185, la palabra «Anexo» o «Anexos» se escribe con mayúscula inicial y dos puntos; luego se indica la cantidad y, entre paréntesis, el número de folios y el tipo de anexo.", true]]}, {"id": "DO-105", "niv": 2, "e": "La línea que indica el envío de copia a la procuraduría regional debe escribirse con", "f": "Guías institucionales que citan la GTC 185: UIS GGD.10, Senado GD-IT01, Alcaldía de Mitú (ver notas-do.md)", "o": [["A", "la palabra «Copia:», con mayúscula inicial, sin abreviar y seguida de dos puntos.", "Las guías de la UIS, del Senado y de la Alcaldía de Mitú, basadas en la GTC 185, indican escribir la palabra «Copia» con mayúscula inicial, sin abreviar y seguida de dos puntos, y luego los destinatarios de la copia.", true], ["B", "«cc:» en minúscula, como en los campos del correo electrónico.", "La línea de copia en las comunicaciones oficiales no sigue la convención de los campos del correo electrónico: se escribe «Copia:» con mayúscula inicial y sin abreviar.", false], ["C", "la abreviatura «C.c.», porque es la forma tradicional de indicar las copias en la correspondencia.", "Las guías basadas en la GTC 185 indican que la palabra «Copia» se escribe sin abreviar.", false]]}, {"id": "DO-106", "niv": 3, "e": "Respecto de los nombres del sustanciador que redactó y del técnico que transcribió el oficio, lo recomendado es", "f": "Guías institucionales que citan la GTC 185: UIS GGD.10, Alcaldía de Mitú (ver notas-do.md)", "o": [["A", "escribirlos en el primer párrafo del texto, antes de exponer el asunto, para que el destinatario sepa con quién comunicarse.", "Los nombres de redactor y transcriptor van en las líneas especiales, al final de la comunicación, no en el cuerpo del texto.", false], ["B", "incluirlos en las líneas especiales (redactor y transcriptor), debajo de anexos y copias.", "Las guías de la UIS y de la Alcaldía de Mitú, que siguen la GTC 185, prevén escribir al final, después de anexos y copias, el nombre de quienes participaron en la redacción y transcripción; la de la UIS lo ubica a una interlínea libre de anexos y copias.", true], ["C", "omitirlos, porque basta la firma del procurador para identificar la autoría del oficio.", "La firma identifica a quien responde por el oficio, pero las guías basadas en la GTC 185 prevén identificar también a quienes participaron en su elaboración.", false]]}]}, {"comp": "documentos_oficina", "rol": "general", "tag": "Elaboración de documentos de oficina · El memorando", "texto": "La secretaria de una procuraduría provincial debe comunicarse por escrito con el coordinador administrativo de la procuraduría regional, que pertenece a la misma entidad. Necesita pedirle elementos de papelería para el segundo semestre y, además, informarle las fechas de vacaciones del personal de la sede. Un compañero le sugiere hacer una carta dirigida «a quien corresponda», incluir los dos temas en el mismo documento y escribir el encabezado como «Para», «De» y «Asunto», con mayúscula inicial y sin dos puntos. La entidad sigue los lineamientos de la GTC 185 para la elaboración de sus comunicaciones.", "items": [{"id": "DO-107", "niv": 1, "e": "Para esta comunicación, el tipo documental adecuado es", "f": "Guías institucionales que citan la GTC 185: UIS GGD.10, Senado GD-IT01, Alcaldía de Mitú (ver notas-do.md)", "o": [["A", "una carta u oficio, porque el destinatario trabaja en otra sede.", "Estar en otra sede no convierte al destinatario en externo: pertenece a la misma entidad, por lo que corresponde el memorando y no la carta u oficio, reservada a destinatarios externos.", false], ["B", "un memorando, porque es una comunicación interna entre dependencias de la misma entidad.", "Las guías de la UIS, del Senado y de la Alcaldía de Mitú, basadas en la GTC 185, definen el memorando como la comunicación escrita que se emplea en las organizaciones para tratar asuntos internos.", true], ["C", "una circular, porque se informa algo a otra dependencia.", "La circular comunica un mismo contenido de interés común a un grupo de destinatarios (guías basadas en la GTC 185); aquí hay un solo destinatario interno.", false]]}, {"id": "DO-108", "niv": 2, "e": "En el encabezado del memorando, los datos de destinatario, remitente y tema deben introducirse con", "f": "Guías institucionales que citan la GTC 185: UIS GGD.10, Senado GD-IT01, Alcaldía de Mitú (ver notas-do.md)", "o": [["A", "la fórmula «A quien corresponda», seguida del nombre de la dependencia que envía el documento y de un resumen extenso del contenido.", "El memorando identifica al destinatario y al remitente con sus nombres y cargos; «A quien corresponda» no identifica a nadie y el asunto debe ser una síntesis, no un resumen extenso.", false], ["B", "las palabras «Para», «De» y «Asunto», con mayúscula inicial y sin dos puntos.", "Las guías basadas en la GTC 185 indican que en el memorando estas palabras se escriben en mayúscula sostenida y seguidas de dos puntos.", false], ["C", "«PARA:», «DE:» y «ASUNTO:», en mayúscula sostenida y seguidos de dos puntos.", "Las guías de la UIS, del Senado y de la Alcaldía de Mitú, basadas en la GTC 185, indican que en el memorando las palabras PARA, DE y ASUNTO se escriben en mayúscula sostenida, seguidas de dos puntos.", true]]}, {"id": "DO-109", "niv": 2, "e": "Respecto de los dos temas que la secretaria debe comunicar, lo recomendado es", "f": "Guías institucionales que citan la GTC 185: UIS GGD.10, Senado GD-IT01, Alcaldía de Mitú; Acuerdo 001 de 2024 del AGN, art. 4.2.4", "o": [["A", "elaborar un memorando para cada tema, porque se recomienda que cada uno trate un solo asunto.", "Las guías basadas en la GTC 185 consultadas recomiendan que cada comunicación trate preferiblemente un solo tema, lo que facilita su trámite, su respuesta y su archivo en el expediente correspondiente.", true], ["B", "incluir ambos temas en un mismo memorando, porque así se ahorra papel.", "Las guías basadas en la GTC 185 recomiendan tratar un solo tema por comunicación; mezclar asuntos dificulta el trámite de cada uno y su archivo en el expediente que corresponde.", false], ["C", "enviar el tema de papelería en un memorando y el de vacaciones por mensajería instantánea, sin dejar registro.", "Las comunicaciones oficiales deben quedar registradas para su control y seguimiento (art. 4.2.4 del Acuerdo 001 de 2024 del AGN); enviarlas sin registro impide su trazabilidad.", false]]}]}, {"comp": "documentos_oficina", "rol": "general", "tag": "Elaboración de documentos de oficina · La circular", "texto": "El procurador regional debe informar a todos los procuradores provinciales del departamento el nuevo horario de atención al público, que es igual para todas las sedes. Le pide a usted, auxiliar de la procuraduría regional, que proyecte el documento. Un compañero propone elaborar un acta «para que quede constancia», y otro sugiere escribir el encabezado «PARA:» con dos puntos, como en los memorandos, y omitir el saludo porque «las circulares son impersonales». La entidad sigue los lineamientos de la GTC 185 para la elaboración de sus comunicaciones.", "items": [{"id": "DO-110", "niv": 1, "e": "El tipo documental adecuado para comunicar el nuevo horario es", "f": "Guías institucionales que citan la GTC 185: UIS GGD.10, Senado GD-IT01, Alcaldía de Mitú (ver notas-do.md)", "o": [["A", "una circular, porque comunica un mismo contenido a un grupo de destinatarios.", "Las guías de la UIS, del Senado y de la Alcaldía de Mitú, basadas en la GTC 185, definen la circular como la comunicación que da a conocer información de interés común, con el mismo contenido, a un grupo específico de destinatarios.", true], ["B", "un certificado, porque da fe del horario vigente en todas las sedes.", "El certificado es un documento probatorio que da fe de un hecho; no sirve para comunicar instrucciones o información general a un grupo.", false], ["C", "un acta, porque deja constancia de una decisión de la regional.", "El acta registra lo sucedido, tratado y acordado en una reunión; no es el medio para comunicar una misma información a un grupo de destinatarios.", false]]}, {"id": "DO-111", "niv": 2, "e": "En el encabezado de la circular, el grupo destinatario se introduce con", "f": "Guías institucionales que citan la GTC 185: UIS GGD.10, Senado GD-IT01, Alcaldía de Mitú (ver notas-do.md)", "o": [["A", "el nombre completo y la dirección de cada procurador provincial, uno por renglón, como si se tratara de cartas individuales.", "La circular se dirige a un grupo destinatario identificado de forma general; no se relacionan uno a uno los nombres y direcciones como en una carta.", false], ["B", "«PARA:», con dos puntos, igual que en el memorando.", "En las guías basadas en la GTC 185 el encabezado de la circular se distingue del memorando: allí PARA se escribe sin dos puntos.", false], ["C", "la palabra «PARA» en mayúscula sostenida, sin dos puntos, seguida del grupo destinatario.", "Las guías de la UIS, del Senado y de la Alcaldía de Mitú, basadas en la GTC 185, indican que en la circular la palabra PARA se escribe en mayúscula sostenida, sin dos puntos, seguida del grupo destinatario.", true]]}, {"id": "DO-112", "niv": 2, "e": "Sobre el saludo en la circular, lo recomendado es que", "f": "Guías institucionales que citan la GTC 185: UIS GGD.10, Senado GD-IT01, Alcaldía de Mitú (ver notas-do.md)", "o": [["A", "se ubique al final, junto a la despedida y antes de la firma del procurador regional.", "El saludo abre la comunicación; al final van la despedida y los datos del remitente, no el saludo.", false], ["B", "se incluya al inicio del texto.", "Las guías de la UIS, del Senado y de la Alcaldía de Mitú, basadas en la GTC 185, señalan que en la circular el saludo se incluye al inicio del texto.", true], ["C", "se omita, porque las circulares son impersonales y no admiten saludo.", "Las guías basadas en la GTC 185 consultadas no excluyen el saludo de la circular; indican incluirlo al inicio del texto.", false]]}]}, {"comp": "documentos_oficina", "rol": "general", "tag": "Elaboración de documentos de oficina · El acta", "texto": "Usted es auxiliar de la secretaría de una procuraduría provincial y debe elaborar el acta de la reunión ordinaria mensual del equipo de trabajo. En su borrador escribió: «Siendo las 9:00 a. m., se reúnen los integrantes del equipo…» y redactó todo en tiempo presente. Puso como primer punto del orden del día «proposiciones y varios». Durante la reunión, un sustanciador manifestó su desacuerdo con una decisión sobre la distribución de reparto y pidió expresamente que su posición quedara registrada; otros dos integrantes hicieron comentarios generales sin pedir que constaran. La entidad sigue los lineamientos de la GTC 185 para la elaboración de actas.", "items": [{"id": "DO-113", "niv": 1, "e": "En cuanto a la redacción, el acta debe escribirse", "f": "Guías institucionales que citan la GTC 185: UIS GGD.10, Contraloría de Nariño, Gobernación del Cesar (ver notas-do.md)", "o": [["A", "en tiempo presente, para dar sensación de actualidad a lo que se describe.", "Las guías de actas basadas en la GTC 185 indican redactarlas en tiempo pasado, porque registran hechos ya ocurridos en la reunión.", false], ["B", "en futuro, porque recoge principalmente los compromisos que se cumplirán después.", "Aunque el acta registra compromisos, el relato de lo sucedido, tratado y acordado se redacta en tiempo pasado según las guías basadas en la GTC 185.", false], ["C", "en tiempo pasado y sin iniciar párrafos con gerundio.", "Las guías de la UIS, de la Contraloría de Nariño y de la Gobernación del Cesar, basadas en la GTC 185, indican redactar las actas en tiempo pasado y no iniciar ningún párrafo con gerundio (como «Siendo»).", true]]}, {"id": "DO-114", "niv": 2, "e": "Los dos primeros puntos del orden del día deben ser", "f": "Guías institucionales que citan la GTC 185: UIS GGD.10, Contraloría de Nariño, Gobernación del Cesar (ver notas-do.md)", "o": [["A", "la verificación del quórum y, luego, la lectura y aprobación del acta anterior.", "Las guías de actas basadas en la GTC 185 (UIS, Contraloría de Nariño y Gobernación del Cesar) indican que la primera actividad es la verificación del quórum y la segunda, la lectura y aprobación del acta anterior.", true], ["B", "las proposiciones y varios y, luego, la verificación del quórum.", "Las proposiciones y varios suelen ir al final; la reunión empieza verificando el quórum, porque sin él no pueden tomarse decisiones válidas.", false], ["C", "la lectura del acta anterior y, luego, los temas nuevos, sin verificar asistencia porque la reunión es ordinaria.", "El carácter ordinario de la reunión no elimina la verificación del quórum, que según las guías basadas en la GTC 185 es la primera actividad.", false]]}, {"id": "DO-115", "niv": 3, "e": "Sobre las intervenciones de los integrantes, en el acta se debe", "f": "Guías institucionales que citan la GTC 185: UIS GGD.10, Contraloría de Nariño, Gobernación del Cesar (ver notas-do.md)", "o": [["A", "omitir el desacuerdo del sustanciador, porque el acta solo recoge las decisiones aprobadas.", "Aunque el acta hace énfasis en las decisiones, la discrepancia se registra cuando el integrante lo solicita expresamente, según las guías basadas en la GTC 185.", false], ["B", "registrar la discrepancia del sustanciador, porque la solicitó expresamente, y hacer énfasis en las decisiones.", "Las guías de actas de la UIS, de la Contraloría Departamental de Nariño y de la Gobernación del Cesar, elaboradas con base en la GTC 185, indican hacer énfasis en las decisiones y dejar constancia de las discrepancias cuando se solicita expresamente, como hizo el sustanciador.", true], ["C", "transcribir textualmente todas las intervenciones, incluidos los comentarios generales, para que el acta sea completa.", "Las guías basadas en la GTC 185 indican que el acta hace énfasis en las decisiones y no es una transcripción literal de lo dicho.", false]]}]}, {"comp": "documentos_oficina", "rol": "tecnico", "tag": "Elaboración de documentos de oficina · Niveles técnico, administrativo y operativo · Certificado y constancia; fecha", "texto": "Usted es técnico de la secretaría de una procuraduría provincial y debe proyectar dos documentos probatorios que firmará el procurador. En el borrador del primero escribió «CERTIFICA, que el señor…» en una sola línea, y en el lugar y fecha puso «Neiva, 12 de Marzo de 2.026». Un compañero le pregunta cuál es la diferencia entre un certificado y una constancia, porque en la dependencia los usan indistintamente. La entidad sigue los lineamientos de la GTC 185 y las normas ortográficas de la Real Academia Española.", "items": [{"id": "DO-116", "niv": 3, "e": "Según las guías institucionales basadas en la GTC 185, la diferencia entre el certificado y la constancia es que", "f": "Guías institucionales que citan la GTC 185: UIS GGD.10, Alcaldía de Mitú, Alcaldía de Ibagué (ver notas-do.md)", "o": [["A", "el certificado da fe de un hecho o acto solemne, mientras que la constancia acredita hechos que no requieren solemnidad.", "Las guías de la UIS, de la Alcaldía de Mitú y de la Alcaldía de Ibagué, basadas en la GTC 185, describen ambos como documentos probatorios: el certificado asegura la veracidad y legalidad de un hecho o acto solemne y la constancia no requiere solemnidad.", true], ["B", "la constancia tiene valor probatorio y el certificado no.", "Ambos son documentos de carácter probatorio según las guías basadas en la GTC 185; se diferencian por la solemnidad de lo que acreditan.", false], ["C", "el certificado se expide solo a otras entidades y la constancia solo a los particulares.", "Las guías consultadas no distinguen estos documentos por el destinatario, sino por la naturaleza de lo que acreditan: el certificado, un hecho o acto solemne; la constancia, hechos que no requieren solemnidad.", false]]}, {"id": "DO-117", "niv": 2, "e": "Después de la palabra CERTIFICA se debe escribir", "f": "RAE, uso de los dos puntos en cartas y documentos administrativos; Alcaldía de Mitú, guía de documentos (ver notas-do.md)", "o": [["A", "una coma, y continuar en la misma línea con «que» en minúscula.", "La Real Academia Española prescribe dos puntos tras los verbos que presentan el objeto de documentos como certificados, y el texto que sigue va en párrafo aparte con mayúscula inicial.", false], ["B", "punto seguido, y escribir el resto del texto en mayúscula sostenida.", "El punto rompería el enunciado y la mayúscula sostenida no se usa para el cuerpo del texto; la norma académica indica dos puntos y párrafo aparte.", false], ["C", "dos puntos y, en párrafo aparte, el texto que empieza con «Que».", "La Real Academia Española indica usar dos puntos tras el verbo que presenta el objeto en certificados y documentos semejantes (CERTIFICA, HACE CONSTAR), y escribir lo que sigue en párrafo aparte con mayúscula inicial; la guía de la Alcaldía de Mitú lo ejemplifica con «Que».", true]]}, {"id": "DO-118", "niv": 1, "e": "El lugar y la fecha del documento deben escribirse así", "f": "Guías institucionales que citan la GTC 185: UIS GGD.10, Alcaldía de Mitú; RAE, Ortografía (ver notas-do.md)", "o": [["A", "«Neiva, 12 de Marzo de 2026», con el mes en mayúscula inicial.", "Los nombres de los meses son nombres comunes y se escriben con minúscula; las guías basadas en la GTC 185 así lo indican para la fecha.", false], ["B", "«Neiva, 12 de marzo de 2026».", "Las guías de la UIS y de la Alcaldía de Mitú, basadas en la GTC 185, indican escribir el mes en minúscula y el año sin punto; la RAE también señala que los nombres de los meses se escriben con minúscula y que los años no llevan punto.", true], ["C", "«Neiva, 12 de marzo de 2.026», con punto de separación de miles en el año.", "Los números de los años se escriben sin punto, según la RAE y las guías basadas en la GTC 185.", false]]}]}, {"comp": "documentos_oficina", "rol": "general", "tag": "Elaboración de documentos de oficina · Lenguaje claro en las comunicaciones al ciudadano", "texto": "Usted es auxiliar de una procuraduría provincial y revisa la respuesta a una ciudadana que se quejó porque la alcaldía no le respondía una petición sobre el alumbrado de su barrio. El despacho concluyó que el asunto debía tramitarlo la personería municipal y le remitió la queja. El borrador empieza con dos párrafos que transcriben normas y termina así: «Su solicitud, presentada el 3 de marzo de 2026 ante esta procuraduría provincial en relación con la presunta demora de la alcaldía en responder su petición, una vez revisada por el despacho y teniendo en cuenta las competencias que la ley asigna, fue remitida a la Personería Municipal». El jefe pide aplicar la Guía de lenguaje claro del DNP.", "items": [{"id": "DO-119", "niv": 1, "e": "Siguiendo la recomendación de preferir la voz activa, la frase mejor redactada es", "f": "DNP, Guía de lenguaje claro para servidores públicos de Colombia (2015)", "o": [["A", "«Su solicitud fue recibida por este despacho el 3 de marzo».", "La frase está en voz pasiva («fue recibida por»); la Guía de lenguaje claro del DNP recomienda la voz activa, en la que el sujeto realiza la acción.", false], ["B", "«Por parte de este despacho se efectuó la recepción de su solicitud el 3 de marzo».", "La frase recurre a una construcción impersonal y a un sustantivo («recepción») en lugar del verbo; la guía del DNP recomienda la voz activa y las palabras sencillas.", false], ["C", "«Este despacho recibió su solicitud el 3 de marzo».", "La Guía de lenguaje claro del DNP recomienda usar la voz activa: el sujeto que realiza la acción («este despacho») va antes del verbo («recibió»), lo que hace la frase más directa y fácil de entender.", true]]}, {"id": "DO-120", "niv": 2, "e": "La mejor forma de reescribir el último párrafo del borrador, según la Guía de lenguaje claro del DNP, es", "f": "DNP, Guía de lenguaje claro para servidores públicos de Colombia (2015)", "o": [["A", "dividirlo en oraciones cortas y acercar el sujeto al verbo: «Revisamos su solicitud del 3 de marzo. La enviamos a la Personería Municipal».", "La Guía de lenguaje claro del DNP recomienda oraciones cortas, el orden sujeto-verbo-complemento sin separar el sujeto del verbo y la voz activa; en el borrador, el sujeto («Su solicitud») queda muy lejos del verbo («fue remitida»).", true], ["B", "mantener una sola oración y cambiar únicamente «fue remitida» por «se remitió».", "El cambio no resuelve el problema principal: la oración sigue siendo larga y el sujeto sigue lejos del verbo; la guía del DNP recomienda oraciones cortas y orden sujeto-verbo-complemento.", false], ["C", "agregar al inicio del párrafo las citas de las normas de competencia.", "Anteponer más citas normativas alarga el texto y aleja aún más la información principal; la guía del DNP recomienda
