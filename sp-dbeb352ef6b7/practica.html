 (modificado por la Ley 2195 de 2022, art. 31)", "o": [["A", "los fija la Procuraduría General de la Nación, que además aprueba cada programa antes de su adopción.", "La ley no asigna a la Procuraduría la fijación de los estándares ni la aprobación previa de cada programa, sin perjuicio de sus funciones preventivas y de vigilancia.", false], ["B", "cada entidad los define libremente, porque la ley solo exige que el programa se publique en la página web.", "La ley no deja los estándares a la libre definición de cada entidad: asigna su fijación a una autoridad del orden nacional.", false], ["C", "los señala la Secretaría de Transparencia de la Presidencia, en armonía con el Modelo Integrado de Planeación y Gestión.", "El artículo 73 de la Ley 1474 de 2011, modificado por la Ley 2195 de 2022, dispone que la Secretaría de Transparencia de la Presidencia de la República señala las características, estándares, elementos, requisitos, procedimientos y controles mínimos de los programas, que deben articularse con el Modelo Integrado de Planeación y Gestión (MIPG).", true]]}]}, {"comp": "anticorrupcion", "rol": "profesional", "tag": "Estatuto Anticorrupción y transparencia · Niveles profesional, asesor y ejecutivo · Responsabilidad de las personas jurídicas por corrupción", "texto": "Usted es profesional de una procuraduría delegada y apoya un informe sobre una sociedad comercial domiciliada en Colombia. El gerente de la sociedad pagó un soborno al director de un hospital departamental para obtener un contrato de suministro de equipos; ambos fueron condenados penalmente con sentencias ejecutoriadas, y la sociedad se benefició con el contrato. Además, se conoció que la misma sociedad, por medio de un empleado, ofreció dinero a un servidor público de otro país para obtener allí una licencia. La junta directiva pregunta qué consecuencias puede enfrentar la empresa y qué programa de prevención debería adoptar.", "items": [{"id": "AC-119", "niv": 2, "e": "Frente al soborno pagado al director del hospital, la sociedad", "f": "Ley 1474 de 2011, art. 34 (modificado por la Ley 2195 de 2022)", "o": [["A", "puede ser sancionada administrativamente, con independencia de las responsabilidades penales individuales.", "El artículo 34 de la Ley 1474 de 2011, modificado por la Ley 2195 de 2022, establece un régimen de responsabilidad administrativa sancionatoria de las personas jurídicas que se hayan beneficiado de delitos contra la Administración Pública o el patrimonio público cometidos por sus administradores o funcionarios, independientemente de las responsabilidades penales individuales a que hubiere lugar.", true], ["B", "no puede ser sancionada, porque la responsabilidad por corrupción es personal y ya fue condenado su gerente.", "La ley prevé medidas administrativas contra la persona jurídica que se buscó beneficiar del delito, adicionales a la responsabilidad penal de las personas naturales.", false], ["C", "solo puede ser sancionada si un juez penal la condena como persona jurídica en el mismo proceso del gerente.", "Las medidas contra la persona jurídica que prevé la Ley 1474 son de naturaleza administrativa; la ley no condiciona su aplicación a una condena penal de la sociedad como tal.", false]]}, {"id": "AC-120", "niv": 2, "e": "Respecto del ofrecimiento de dinero al servidor público extranjero, es acertado afirmar que", "f": "Ley 1778 de 2016, arts. 2 y 3 (modificados por la Ley 2195 de 2022)", "o": [["A", "ninguna autoridad colombiana puede actuar, porque la conducta se cometió fuera del territorio nacional.", "El régimen de soborno transnacional existe precisamente para conductas que involucran a servidores públicos extranjeros, y alcanza a las personas jurídicas domiciliadas en Colombia.", false], ["B", "la Superintendencia de Sociedades puede investigarla y sancionarla administrativamente por soborno transnacional.", "La Ley 1778 de 2016, en sus artículos 2 y 3, modificados por la Ley 2195 de 2022, establece la responsabilidad administrativa de las personas jurídicas por soborno transnacional y asigna a la Superintendencia de Sociedades su investigación y sanción, incluidas conductas ocurridas en el exterior por personas jurídicas domiciliadas en Colombia.", true], ["C", "la Procuraduría General de la Nación debe sancionarla disciplinariamente, porque se trata de un acto de corrupción.", "El poder disciplinario recae sobre servidores públicos y, en ciertos casos, particulares que ejercen funciones públicas; la sanción de la persona jurídica por soborno transnacional es administrativa y corresponde a la Superintendencia de Sociedades.", false]]}, {"id": "AC-121", "niv": 3, "e": "Sobre el programa de transparencia y ética empresarial que debe adoptar la sociedad, se le explica a la junta que", "f": "Ley 1474 de 2011, art. 34-7 (adicionado por la Ley 2195 de 2022)", "o": [["A", "cada empresa lo define libremente y solo debe presentarlo a la superintendencia cuando se le abra una investigación administrativa.", "La ley no deja el programa a la libre definición de la empresa ni lo reserva para cuando exista una investigación; su contenido responde a los lineamientos de la superintendencia.", false], ["B", "existe un programa único para todas las sociedades del país, expedido por la Secretaría de Transparencia.", "La ley no prevé un programa único: los lineamientos los fija la superintendencia respectiva, teniendo en cuenta las características de cada sociedad.", false], ["C", "la superintendencia que la vigila fija su contenido según el sector, los riesgos, los activos, los ingresos y los empleados.", "El artículo 34-7 de la Ley 1474 de 2011, adicionado por la Ley 2195 de 2022, dispone que las personas jurídicas sujetas a vigilancia de las superintendencias adopten programas de transparencia y ética empresarial cuyo contenido define la superintendencia, teniendo en cuenta criterios como el sector, los riesgos del sector, el monto de activos, los ingresos, el número de empleados y el objeto social.", true]]}]}, {"comp": "anticorrupcion", "rol": "general", "tag": "Estatuto Anticorrupción y transparencia · Publicación de declaraciones (Ley 2013 de 2019)", "texto": "Martín fue elegido alcalde de un municipio y se posesionará en enero. Su asesor le recuerda las obligaciones de publicidad de la Ley 2013 de 2019. Durante el primer año de gobierno ocurren dos hechos: en mayo, el hermano de Martín se vuelve socio de una empresa que presta servicios de aseo en el municipio, lo que modifica la información de su registro de conflictos de interés; y en agosto Martín presenta ante la DIAN su declaración del impuesto sobre la renta. Al mismo tiempo, Sofía, recién nombrada auxiliar administrativa de la alcaldía, pregunta si a ella también le corresponde declarar sus bienes y rentas.", "items": [{"id": "AC-122", "niv": 1, "e": "Respecto de sus declaraciones, antes de posesionarse, Martín", "f": "Ley 2013 de 2019, art. 2, par. 1", "o": [["A", "debe publicar y registrar sus declaraciones de bienes y rentas, de conflictos de interés y de renta, como requisito para posesionarse.", "El artículo 2 de la Ley 2013 de 2019 incluye entre los sujetos obligados a los servidores elegidos por voto popular, y su parágrafo 1 establece que la publicación y el registro son requisito para posesionarse, ejercer y retirarse del cargo.", true], ["B", "puede publicarlas en cualquier momento del primer año de gobierno, porque la ley no las exige como requisito para el cargo.", "La ley las exige como requisito para posesionarse, ejercer y retirarse del cargo, no como un trámite que pueda cumplirse en cualquier momento del período.", false], ["C", "no está obligado, porque la Ley 2013 de 2019 se aplica a los servidores nombrados y no a los elegidos por voto popular.", "Los servidores elegidos por voto popular están entre los primeros sujetos obligados que enumera el artículo 2 de la Ley 2013 de 2019.", false]]}, {"id": "AC-123", "niv": 2, "e": "El cambio en el registro de conflictos de interés que se produjo en mayo debe comunicarse y registrarse", "f": "Ley 2013 de 2019, art. 3", "o": [["A", "solo al retirarse del cargo, en la declaración final del período.", "Esperar al retiro dejaría el registro desactualizado durante todo el período, en contra del propósito de la ley; el cambio debe registrarse dentro de los dos meses siguientes.", false], ["B", "en la actualización anual siguiente, porque las declaraciones solo se modifican una vez al año.", "Además de la actualización anual, la ley exige que los cambios en la información declarada se comuniquen y registren dentro de un plazo corto desde que ocurren.", false], ["C", "dentro de los dos meses siguientes a la fecha en que se produjo el cambio.", "El artículo 3 de la Ley 2013 de 2019 dispone que cualquier cambio que modifique la información contenida en la declaración debe comunicarse y registrarse dentro de los dos meses siguientes al cambio.", true]]}, {"id": "AC-124", "niv": 2, "e": "La copia de la declaración del impuesto sobre la renta que Martín presentó en agosto debe publicarse", "f": "Ley 2013 de 2019, art. 3", "o": [["A", "al finalizar el período de gobierno, con la declaración de retiro.", "La ley fija un plazo corto contado desde la presentación ante la DIAN; no permite aplazar la publicación hasta el final del período.", false], ["B", "dentro del mes siguiente a su presentación ante la DIAN, sin esperar la actualización anual.", "El artículo 3 de la Ley 2013 de 2019 establece que la copia de la declaración del impuesto sobre la renta y complementarios se publica dentro del mes siguiente a su presentación ante la DIAN.", true], ["C", "solo si la DIAN abre un proceso de fiscalización sobre esa declaración, como parte de la investigación.", "La publicación es una obligación general de los sujetos obligados y no depende de que exista un proceso de fiscalización.", false]]}, {"id": "AC-125", "niv": 3, "e": "Respecto de la pregunta de Sofía, es correcto indicarle que", "f": "Ley 190 de 1995; Decreto 1083 de 2015; Función Pública, Concepto 561261 de 2025", "o": [["A", "debe presentar su declaración de bienes y rentas en el SIGEP, como todo servidor, al posesionarse, cada año y al retirarse.", "Las obligaciones de publicación de la Ley 2013 de 2019 recaen sobre los sujetos que enumera su artículo 2, entre los que no figura un cargo asistencial como el de Sofía; pero, según la Ley 190 de 1995 y el Decreto 1083 de 2015, como lo reitera el Concepto 561261 de 2025 de Función Pública, todo servidor público debe presentar la declaración de bienes y rentas en el SIGEP al posesionarse, actualizarla anualmente y presentarla al retirarse.", true], ["B", "no tiene ninguna obligación, porque las declaraciones de bienes solo se exigen a cargos directivos y de elección popular.", "La declaración de bienes y rentas es una obligación de todo servidor público, prevista en la Ley 190 de 1995; las obligaciones especiales de publicación de la Ley 2013 no eliminan esa regla general.", false], ["C", "solo debe declarar si es ordenadora del gasto o maneja recursos públicos.", "La obligación de declarar bienes y rentas no depende de ordenar el gasto o manejar recursos: se aplica a todo servidor público.", false]]}]}, {"comp": "anticorrupcion", "rol": "general", "tag": "Estatuto Anticorrupción y transparencia · Impedimentos y recusaciones en la actuación administrativa", "texto": "Paula es profesional universitaria de la secretaría de tránsito de un municipio y debe resolver varios trámites. En el primero, el solicitante es el hermano de su esposo, quien pide la devolución de un vehículo inmovilizado. En el segundo, la interesada es su prima hermana, que solicita la prescripción de unas multas. Paula no tiene ningún interés económico en esos asuntos y considera que podría decidirlos con total imparcialidad. Antes de actuar, consulta con la oficina jurídica qué debe hacer.", "items": [{"id": "AC-126", "niv": 1, "e": "Respecto del trámite del hermano de su esposo, Paula", "f": "Ley 1437 de 2011 (CPACA), art. 11, num. 1", "o": [["A", "puede decidirlo, porque los parientes por afinidad no generan causal de impedimento.", "La causal comprende expresamente a los parientes hasta el segundo grado de afinidad, entre los que está el hermano del cónyuge.", false], ["B", "puede decidirlo, siempre que deje constancia escrita de que actuará con imparcialidad.", "La causal de impedimento es objetiva: la convicción de imparcialidad o una constancia escrita no permiten al servidor seguir conociendo el asunto.", false], ["C", "debe declararse impedida, porque él es su pariente en segundo grado de afinidad.", "El numeral 1 del artículo 11 del CPACA prevé como causal de impedimento el interés particular y directo del servidor, de su cónyuge o compañero permanente, o de sus parientes dentro del cuarto grado de consanguinidad, segundo de afinidad o primero civil. El hermano del cónyuge es pariente en segundo grado de afinidad.", true]]}, {"id": "AC-127", "niv": 2, "e": "En el trámite que adelanta su prima hermana, Paula", "f": "Ley 1437 de 2011 (CPACA), art. 11, num. 1", "o": [["A", "puede actuar, porque las causales de impedimento solo cubren hasta el segundo grado de consanguinidad.", "Para la consanguinidad, la causal llega hasta el cuarto grado, no solo hasta el segundo.", false], ["B", "debe declararse impedida, porque la prima hermana es pariente en cuarto grado de consanguinidad.", "El numeral 1 del artículo 11 del CPACA incluye a los parientes dentro del cuarto grado de consanguinidad. Los primos hermanos están en ese grado: hay dos grados hasta el abuelo común y dos más hasta la prima.", true], ["C", "puede actuar, porque las primas no se consideran parientes para efectos del régimen de impedimentos.", "Los primos hermanos son parientes en cuarto grado de consanguinidad y están comprendidos en la causal.", false]]}, {"id": "AC-128", "niv": 1, "e": "Para declararse impedida, Paula debe", "f": "Ley 1437 de 2011 (CPACA), art. 12", "o": [["A", "enviar la actuación con escrito motivado a su superior, dentro de los tres días siguientes a conocer el asunto.", "El artículo 12 del CPACA dispone que el servidor en quien concurra una causal de impedimento debe, dentro de los tres días siguientes a su conocimiento, remitir la actuación con escrito motivado al superior o, si no lo tuviere, a la cabeza del respectivo sector administrativo.", true], ["B", "decidir los trámites y luego informar a la oficina de control interno para que revise sus decisiones.", "El impedimento debe manifestarse antes de decidir, separándose del asunto; informar después a control interno no cumple el procedimiento legal.", false], ["C", "pedir a los interesados que desistan de sus solicitudes y las presenten de nuevo ante otro funcionario.", "La ley no traslada la carga a los interesados: es el servidor impedido quien remite la actuación para que la autoridad competente decida y, de ser el caso, designe a otro funcionario.", false]]}]}, {"comp": "anticorrupcion", "rol": "general", "tag": "Estatuto Anticorrupción y transparencia · Trámite de impedimentos de autoridades territoriales", "texto": "El alcalde de un municipio debe resolver una solicitud de licencia de funcionamiento presentada por una empresa de la que su cónyuge es socia mayoritaria. El alcalde reconoce la causal de impedimento, pero no sabe a quién debe remitir la actuación, pues no tiene superior jerárquico dentro de la administración municipal. Además, un ciudadano que conoce la situación anuncia que, si el alcalde no se aparta del asunto, presentará una recusación en su contra. El secretario jurídico prepara un memorando sobre el trámite.", "items": [{"id": "AC-129", "niv": 3, "e": "Como el alcalde no tiene superior ni cabeza de sector a quien remitir la actuación, debe enviarla", "f": "Ley 1437 de 2011 (CPACA), art. 12", "o": [["A", "al concejo municipal, que decide en plenaria si acepta el impedimento.", "El artículo 12 del CPACA no asigna esta decisión al concejo municipal; prevé un orden de autoridades que termina en el Ministerio Público.", false], ["B", "al procurador regional, por tratarse de una autoridad territorial.", "El artículo 12 del CPACA dispone que, a falta de superior y de cabeza del sector administrativo, la actuación se remite al Procurador General de la Nación si se trata de autoridades nacionales o del alcalde mayor del Distrito Capital, o al procurador regional en el caso de las autoridades territoriales.", true], ["C", "al gobernador del departamento, por ser el superior administrativo de los alcaldes.", "El artículo 12 del CPACA no remite al gobernador: a falta de superior y de cabeza de sector, la decisión corresponde al Ministerio Público.", false]]}, {"id": "AC-130", "niv": 2, "e": "Recibida la actuación, la autoridad competente debe decidir sobre el impedimento", "f": "Ley 1437 de 2011 (CPACA), art. 12", "o": [["A", "dentro de los treinta días siguientes a su recibo, después de practicar pruebas y escuchar en audiencia al alcalde y a la empresa.", "La ley ordena decidir de plano y dentro de un término corto, sin un periodo probatorio ni una audiencia como los que plantea esta opción.", false], ["B", "en cualquier tiempo, y mientras tanto el alcalde puede continuar el trámite y expedir la licencia.", "La ley fija un término para decidir, y la actuación se suspende mientras se resuelve el impedimento; el alcalde no puede seguir conociendo el asunto.", false], ["C", "dentro de los diez días siguientes a su recibo y, si lo acepta, señalar quién conoce del asunto, incluso un funcionario ad hoc.", "El artículo 12 del CPACA establece que la autoridad competente decide de plano dentro de los diez días siguientes al recibo y que, si acepta el impedimento, determina a quién corresponde el conocimiento del asunto y puede, si es preciso, designar un funcionario ad hoc.", true]]}, {"id": "AC-131", "niv": 2, "e": "Si el ciudadano presenta la recusación, el alcalde debe manifestar si acepta o no la causal dentro de los", "f": "Ley 1437 de 2011 (CPACA), art. 12", "o": [["A", "tres días siguientes a la fecha de su formulación.", "Los tres días corresponden al término para que el servidor se declare impedido y remita la actuación, no al pronunciamiento del recusado.", false], ["B", "cinco días siguientes a la fecha de su formulación.", "El artículo 12 del CPACA dispone que, en caso de recusación, el recusado manifiesta si acepta o no la causal invocada dentro de los cinco días siguientes a la fecha de su formulación.", true], ["C", "diez días siguientes a la fecha de su formulación.", "Los diez días corresponden al término de la autoridad competente para decidir sobre el impedimento o la recusación, no al pronunciamiento del recusado.", false]]}]}, {"comp": "anticorrupcion", "rol": "profesional", "tag": "Estatuto Anticorrupción y transparencia · Niveles profesional, asesor y ejecutivo · Conflicto de intereses en el régimen disciplinario", "texto": "Usted es profesional de una procuraduría provincial y analiza una queja contra el secretario de infraestructura de un municipio. Según la queja, el secretario integró el comité evaluador de una licitación de mantenimiento vial y votó a favor de la oferta de una firma de su amigo Julián. Desde hace años, el secretario y Julián explotan juntos un negocio de alquiler de maquinaria, sin haber constituido formalmente una sociedad, y se reparten las utilidades. Además, la queja señala que, durante la evaluación, el secretario recibió de otro de los oferentes un préstamo personal para pagar una deuda hipotecaria.", "items": [{"id": "AC-132", "niv": 2, "e": "Sobre la relación del secretario con Julián, se puede concluir que", "f": "Ley 1952 de 2019, art. 44", "o": [["A", "genera conflicto de intereses, porque la ley comprende el interés de los socios de hecho o de derecho del servidor.", "El artículo 44 de la Ley 1952 de 2019 obliga al servidor a declararse impedido cuando tenga interés particular y directo en el asunto, o lo tengan su cónyuge o compañero permanente, sus parientes dentro del cuarto grado de consanguinidad, segundo de afinidad o primero civil, o su socio o socios de hecho o de derecho.", true], ["B", "solo generaría conflicto de intereses si Julián fuera su pariente dentro del cuarto grado de consanguinidad.", "El parentesco es solo uno de los supuestos de la norma; los socios de hecho o de derecho están incluidos de forma independiente.", false], ["C", "no genera conflicto de intereses, porque el negocio no está constituido formalmente como sociedad.", "La ley no exige que la sociedad esté formalmente constituida: incluye expresamente a los socios de hecho.", false]]}, {"id": "AC-133", "niv": 3, "e": "Si se prueba que el secretario votó a sabiendas del conflicto de intereses, esa conducta", "f": "Ley 1952 de 2019, art. 56, num. 1", "o": [["A", "no sería falta disciplinaria si no se demuestra que el secretario obtuvo un beneficio económico.", "La falta se configura al actuar a pesar del conflicto de intereses; la ley no exige demostrar un beneficio económico efectivo.", false], ["B", "solo sería falta leve si la obra se ejecuta correctamente y sin sobrecostos para el municipio.", "La calificación de la falta no depende del resultado de la obra: la ley describe como gravísima la conducta de actuar pese al conflicto de intereses.", false], ["C", "encaja en una falta gravísima descrita por la ley: actuar a pesar de un conflicto de intereses.", "El numeral 1 del artículo 56 de la Ley 1952 de 2019 describe como falta gravísima actuar u omitir a pesar de la existencia de causales de incompatibilidad, inhabilidad y conflicto de intereses.", true]]}, {"id": "AC-134", "niv": 2, "e": "Respecto del préstamo que el secretario recibió de un oferente, es correcto afirmar que", "f": "Ley 1952 de 2019, art. 39, num. 10", "o": [["A", "está permitido, siempre que el préstamo se pacte con intereses de mercado y conste por escrito.", "Las condiciones del préstamo no lo hacen admisible: la prohibición recae sobre la relación de deudor con personas interesadas en los asuntos a cargo del servidor.", false], ["B", "le está prohibido al servidor constituirse en deudor de personas interesadas en los asuntos a su cargo.", "El numeral 10 del artículo 39 de la Ley 1952 de 2019 prohíbe a los servidores públicos constituirse en acreedores o deudores de personas interesadas directa o indirectamente en los asuntos a su cargo, de sus representantes o apoderados, y de sus parientes o cónyuges.", true], ["C", "solo estaría prohibido si el préstamo se destinara a gastos relacionados con la licitación.", "La prohibición no depende del destino que el servidor dé al dinero: se refiere a constituirse en deudor de un interesado en los asuntos a su cargo.", false]]}]}, {"comp": "anticorrupcion", "rol": "tecnico", "tag": "Estatuto Anticorrupción y transparencia · Niveles técnico, administrativo y operativo · Código de Integridad del servicio público", "texto": "Andrés es técnico de la ventanilla de atención de una alcaldía. Sus compañeros destacan que siempre termina a tiempo los trámites asignados, revisa con atención cada documento y busca la forma de hacer más con menos recursos. También aplica los mismos requisitos a todos los usuarios: no le da prioridad a nadie por ser conocido o por su posición social, y garantiza a cada persona el trámite al que tiene derecho. Este año, el comité de gestión y desempeño de la alcaldía propone incluir en el código de integridad de la entidad un valor adicional, \"solidaridad\", con sus propias conductas asociadas.", "items": [{"id": "AC-135", "niv": 1, "e": "La conducta de Andrés al terminar a tiempo sus trámites, con atención y optimizando los recursos, corresponde principalmente al valor denominado", "f": "Código de Integridad del Servicio Público (Función Pública)", "o": [["A", "diligencia.", "El Código de Integridad define la diligencia como cumplir los deberes, funciones y responsabilidades del cargo de la mejor manera posible, con atención, prontitud, destreza y eficiencia, para optimizar el uso de los recursos del Estado.", true], ["B", "respeto.", "El respeto se refiere a reconocer, valorar y tratar de manera digna a todas las personas; no describe la oportunidad y la eficiencia en el cumplimiento de las tareas.", false], ["C", "honestidad.", "La honestidad se refiere a actuar con fundamento en la verdad, con transparencia y rectitud, favoreciendo el interés general; no describe la prontitud y la eficiencia en el trabajo.", false]]}, {"id": "AC-136", "niv": 1, "e": "Aplicar los mismos requisitos a todos, sin favorecer a nadie y garantizando los derechos de cada persona, refleja el valor denominado", "f": "Código de Integridad del Servicio Público (Función Pública)", "o": [["A", "diligencia.", "La diligencia se refiere a cumplir las funciones con atención, prontitud y eficiencia; no describe la imparcialidad y la igualdad de trato.", false], ["B", "compromiso.", "El compromiso se refiere a ser consciente de la importancia del rol de servidor y estar dispuesto a comprender y resolver las necesidades de las personas; no describe la imparcialidad en la aplicación de los requisitos.", false], ["C", "justicia.", "El Código de Integridad define la justicia como actuar con imparcialidad, garantizando los derechos de las personas, con equidad, igualdad y sin discriminación.", true]]}, {"id": "AC-137", "niv": 2, "e": "Sobre la propuesta de agregar el valor \"solidaridad\" al código de integridad de la alcaldía, es correcto afirmar que", "f": "Ley 2016 de 2020, art. 1", "o": [["A", "puede incorporarse como complemento, siempre que se respeten los valores del Código de Integridad.", "El artículo 1 de la Ley 2016 de 2020 ordena adoptar el Código de Integridad en todas las entidades y ramas del poder público, y reconoce la autonomía de cada entidad para complementarlo respetando los valores que ya están contenidos en él.", true], ["B", "la alcaldía puede reemplazar el Código de Integridad por un código propio, porque cada entidad tiene autonomía administrativa.", "La Ley 2016 de 2020 hace obligatoria la adopción del Código de Integridad; la autonomía de la entidad le permite complementarlo, no sustituirlo.", false], ["C", "no puede agregarse ningún valor, porque el código debe adoptarse de forma literal y sin complementos.", "La ley permite a cada entidad complementar el código, siempre que respete sus valores; no impone una adopción literal sin complementos.", false]]}]}, {"comp": "anticorrupcion", "rol": "tecnico", "tag": "Estatuto Anticorrupción y transparencia · Niveles técnico, administrativo y operativo · Publicación de información mínima obligatoria", "texto": "Valentina es técnica de la oficina de comunicaciones de una alcaldía y está a cargo de la sección \"Transparencia y acceso a la información pública\" del sitio web. Al revisarla, nota que el directorio de servidores no tiene datos de contacto, que no se han publicado las escalas salariales y que la información de los contratistas de prestación de servicios está incompleta. Además, la última actualización de la sección se hizo hace cinco meses. Su jefe le pide preparar un plan para cumplir lo que exige la ley.", "items": [{"id": "AC-138", "niv": 1, "e": "En relación con los servidores de la alcaldía, la sección de transparencia debe publicar como mínimo", "f": "Ley 1712 de 2014, art. 9, lit. c", "o": [["A", "las hojas de vida completas de los servidores, con sus números de identificación y direcciones de residencia.", "La ley exige un directorio con datos institucionales; los números de identificación y las direcciones de residencia son datos personales que no hacen parte de la información mínima.", false], ["B", "un directorio con el cargo, el correo electrónico y el teléfono del despacho, y las escalas salariales por categorías.", "El literal c) del artículo 9 de la Ley 1712 de 2014 exige publicar un directorio con el cargo, las direcciones de correo electrónico y el teléfono del despacho de los empleados y funcionarios, y las escalas salariales correspondientes a las categorías de todos los servidores.", true], ["C", "solo el nombre del alcalde y de los secretarios de despacho, porque los demás servidores no tienen funciones de dirección.", "El directorio que exige la ley comprende a los empleados y funcionarios de la entidad, no solo a los cargos directivos.", false]]}, {"id": "AC-139", "niv": 1, "e": "Sobre los contratistas que son personas naturales con contratos de prestación de servicios, debe publicarse", "f": "Ley 1712 de 2014, art. 9, lit. e", "o": [["A", "solo el número total de contratistas de la vigencia, sin datos individuales.", "La ley exige datos de cada contrato de prestación de servicios con personas naturales, no solo una cifra global.", false], ["B", "la copia de sus declaraciones de renta y de sus afiliaciones a seguridad social.", "Esos documentos no hacen parte de la información mínima que exige la ley sobre los contratistas de prestación de servicios.", false], ["C", "el objeto del contrato, el monto de los honorarios y la dirección de correo electrónico.", "El literal e) del artículo 9 de la Ley 1712 de 2014 dispone que, para las personas naturales con contratos de prestación de servicios, se publiquen el objeto del contrato, el monto de los honorarios y las direcciones de correo electrónico, según el formato de información de servidores públicos y contratistas.", true]]}, {"id": "AC-140", "niv": 2, "e": "Según la Ley 1712 de 2014, la información mínima de su artículo 9 debe actualizarse como mínimo", "f": "Ley 1712 de 2014, art. 10, par.", "o": [["A", "cada mes.", "El parágrafo del artículo 10 de la Ley 1712 de 2014 dispone que los sujetos obligados deben actualizar la información a que se refiere el artículo 9 mínimo cada mes. Una actualización de hace cinco meses incumple ese mandato.", true], ["B", "cada seis meses.", "La ley no fija una periodicidad semestral para esta información; exige actualizarla como mínimo cada mes.", false], ["C", "cada año.", "Una actualización anual no basta para la información mínima del artículo 9, que la ley ordena actualizar como mínimo cada mes.", false]]}]}, {"comp": "anticorrupcion", "rol": "general", "tag": "Estatuto Anticorrupción y transparencia · Principios del derecho de acceso a la información pública", "texto": "Una procuraduría provincial, en ejercicio de su función preventiva, revisa la manera en que una alcaldía atiende el derecho de acceso a la información pública. Encuentra que la entidad solo publica información cuando un ciudadano la solicita por escrito, que cobra un \"derecho de consulta\" a quien pide revisar expedientes en las instalaciones y que, cuando un documento contiene datos reservados en algunas de sus páginas, niega el documento completo. El secretario general considera que esas prácticas protegen a la entidad.", "items": [{"id": "AC-141", "niv": 2, "e": "La práctica de publicar información solo cuando se solicita por escrito desconoce el principio de", "f": "Ley 1712 de 2014, art. 3", "o": [["A", "eficacia, porque obliga a tramitar más solicitudes escritas de las necesarias.", "Aunque la práctica puede afectar la gestión, el principio de la Ley 1712 que exige publicar sin esperar solicitud es el de divulgación proactiva.", false], ["B", "facilitación, porque el ciudadano debe radicar su solicitud en la ventanilla de la alcaldía.", "La facilitación se refiere a no exigir trámites que obstruyan el acceso; lo que se reprocha aquí es esperar a que haya una solicitud en lugar de publicar de manera rutinaria.", false], ["C", "divulgación proactiva de la información.", "El artículo 3 de la Ley 1712 de 2014 consagra el principio de divulgación proactiva, que obliga a publicar y divulgar documentos y archivos de interés público de forma rutinaria y proactiva, sin esperar una solicitud, y a promover una cultura de transparencia.", true]]}, {"id": "AC-142", "niv": 3, "e": "Cuando solo algunas páginas de un documento contienen información reservada, la alcaldía debe", "f": "Ley 1712 de 2014, art. 21", "o": [["A", "negar el documento completo, porque basta con que una parte sea reservada para que todo el documento lo sea.", "La ley no permite extender la reserva a todo el documento cuando solo una parte está cobijada; ordena la divulgación parcial.", false], ["B", "entregar una versión pública que mantenga la reserva únicamente sobre la parte cobijada por la excepción.", "El artículo 21 de la Ley 1712 de 2014, sobre divulgación parcial, dispone que si los datos reservados o clasificados pueden separarse del resto, debe hacerse una versión pública que mantenga la reserva solo de la parte indispensable.", true], ["C", "entregarlo completo, porque la reserva no puede oponerse a los ciudadanos que lo solicitan por escrito.", "Las excepciones legales de reserva sí pueden oponerse a los solicitantes; lo que exige la ley es proteger solo la parte reservada y entregar el resto.", false]]}, {"id": "AC-143", "niv": 1, "e": "El cobro de un \"derecho de consulta\" para revisar expedientes", "f": "Ley 1712 de 2014, art. 3", "o": [["A", "es válido si lo aprueba el concejo municipal mediante acuerdo, para cubrir los gastos de administración.", "La ley consagra el principio de gratuidad: el acceso no tiene costo y solo puede cobrarse la reproducción; un acuerdo municipal no puede establecer cobros contrarios a la ley.", false], ["B", "desconoce el principio de gratuidad, porque solo puede cobrarse el costo de reproducción de la información.", "El artículo 3 de la Ley 1712 de 2014 establece el principio de gratuidad: el acceso a la información pública es gratuito, y no se pueden cobrar valores adicionales al costo de reproducción.", true], ["C", "es válido siempre que la tarifa sea igual para todos los ciudadanos.", "Que la tarifa sea igual para todos no la hace válida: la ley prohíbe cobrar por el acceso, más allá del costo de reproducción.", false]]}]}, {"comp": "anticorrupcion", "rol": "general", "tag": "Estatuto Anticorrupción y transparencia · Control interno y lucha contra la corrupción", "texto": "En un municipio, el alcalde de turno designó al jefe de la oficina de control interno a mediados de su período de gobierno, como lo prevé la ley. Dos años después se posesiona un nuevo alcalde, que anuncia que reemplazará al jefe de control interno por una persona de su confianza. Mientras tanto, el jefe de control interno detecta en una auditoría indicios de que un contratista cobró dos veces por el mismo servicio con la complicidad de un funcionario. Además, la oficina de atención al ciudadano le pregunta qué papel tiene control interno frente a las quejas y reclamos.", "items": [{"id": "AC-144", "niv": 3, "e": "Frente al anuncio del nuevo alcalde, es correcto afirmar que", "f": "Ley 87 de 1993, art. 11 (modificado por la Ley 1474 de 2011, art. 8)", "o": [["A", "puede reemplazarlo libremente, porque el jefe de control interno es de libre nombramiento y remoción del alcalde de turno.", "En el nivel territorial, la ley dispone que el jefe de control interno se designa para un período fijo, lo que impide reemplazarlo libremente al cambiar el alcalde.", false], ["B", "debe reemplazarlo, porque el período del jefe de control interno termina con el del alcalde que lo designó.", "La ley desvincula los períodos: el jefe de control interno se designa en la mitad del período del mandatario, de modo que su período no termina con el del alcalde que lo designó.", false], ["C", "no puede reemplazarlo a discreción, porque fue designado para un período fijo de cuatro años que no coincide con el del alcalde.", "El artículo 8 de la Ley 1474 de 2011 dispone que, en las entidades territoriales, el jefe de la unidad de control interno es designado por el alcalde o gobernador para un período fijo de cuatro años, en la mitad del respectivo período del alcalde o gobernador.", true]]}, {"id": "AC-145", "niv": 2, "e": "Frente a los indicios del doble cobro, el jefe de control interno", "f": "Ley 87 de 1993, art. 14 (modificado por la Ley 1474 de 2011, art. 9, y el Decreto Ley 2106 de 2019, art. 156)", "o": [["A", "debe reportar a los organismos de control los posibles actos de corrupción e irregularidades encontrados.", "El artículo 14 de la Ley 87 de 1993, modificado por el artículo 9 de la Ley 1474 de 2011 y luego por el artículo 156 del Decreto Ley 2106 de 2019, dispone que el jefe de la unidad de control interno debe reportar a los organismos de control los posibles actos de corrupción e irregularidades que encuentre en el ejercicio de sus funciones. Aunque la norma se refiere al jefe del orden nacional, el deber se predica también del jefe territorial por la naturaleza de su función y por el deber general de denuncia de los servidores.", true], ["B", "debe esperar a la auditoría del año siguiente para confirmar los hechos antes de informar a cualquier autoridad.", "Aplazar el reporte iría en contra del deber legal de informar los posibles actos de corrupción; confirmar los hechos corresponde a las autoridades competentes.", false], ["C", "solo debe informar al alcalde, quien decide si los hechos se remiten a otras autoridades.", "La ley impone al jefe de control interno el deber de reportar directamente a los organismos de control; su deber no depende de la decisión del alcalde.", false]]}, {"id": "AC-146", "niv": 1, "e": "Frente a las quejas y reclamos, a la oficina de control interno le corresponde", "f": "Ley 1474 de 2011, art. 76", "o": [["A", "vigilar que la atención se preste conforme a las normas y rendir un informe semestral a la administración.", "El artículo 76 de la Ley 1474 de 2011 dispone que la oficina de control interno vigila que la atención de quejas, sugerencias y reclamos se preste de acuerdo con las normas legales vigentes y rinde a la administración de la entidad un informe semestral sobre el particular.", true], ["B", "resolver directamente todas las quejas y reclamos, en reemplazo de la dependencia de atención al ciudadano.", "La ley exige una dependencia encargada de recibir, tramitar y resolver las quejas; a control interno le corresponde vigilar esa atención, no reemplazar a la dependencia.", false], ["C", "ninguna función, porque las quejas y reclamos son competencia exclusiva de la personería municipal.", "La ley asigna a la oficina de control interno una función de vigilancia sobre la atención de quejas, sugerencias y reclamos de la entidad.", false]]}]}, {"comp": "comportamental", "rol": "profesional", "tag": "Competencias comportamentales (Diccionario de la Procuraduría) · Niveles profesional, asesor y ejecutivo · Responsabilidad con la organización", "texto": "Usted es profesional universitario de una procuraduría provincial del Tolima y su empleo exige la competencia Responsabilidad con la organización en nivel B. El plan de acción de la provincial fija como meta evacuar el 60 % de las indagaciones previas antes de octubre. Al revisar los expedientes que le repartieron, advierte que muchas quejas llegan sin los datos mínimos para identificar al servidor señalado, porque el formato de recepción de quejas no los pide, y eso obliga a hacer requerimientos que retrasan cada trámite. Además, un compañero comenta en una reunión que la meta del plan de acción «es asunto del procurador provincial, no de los sustanciadores».", "items": [{"id": "CO-101", "niv": 1, "e": "Frente a las quejas que llegan sin los datos de identificación, la actuación que corresponde al nivel B de Responsabilidad con la organización es", "f": "Diccionario de Competencias Comportamentales PGN, Responsabilidad con la organización, nivel B", "o": [["A", "requerir los datos faltantes en cada uno de los expedientes que le asignen, hasta completarlos todos.", "Corresponde al nivel C de la misma competencia: buscar solución a los problemas o situaciones que le asignen en cumplimiento de sus funciones. Resuelve cada caso, pero no propone la mejora del proceso que exige el nivel B.", false], ["B", "proponer al procurador provincial ajustar el formato de recepción para que pida esos datos desde el inicio.", "El nivel B de Responsabilidad con la organización describe a quien contribuye a los objetivos de la entidad y propone mejoras; una de sus conductas es buscar de manera permanente la mejora de los procesos institucionales. Ajustar el formato ataca la causa del problema en el proceso y no solo en un expediente.", true], ["C", "corregir en sus propios expedientes las fallas de información a medida que las vaya encontrando.", "Corregir errores cuando se encuentran fallas en la actividad a cargo es una conducta de Autogestión, nivel D. Mejora su propio trabajo, pero no propone la mejora del proceso institucional que describe Responsabilidad con la organización en nivel B.", false]]}, {"id": "CO-102", "niv": 2, "e": "Ante el comentario del compañero sobre la meta del plan de acción, la postura que refleja el nivel B de Responsabilidad con la organización es", "f": "Diccionario de Competencias Comportamentales PGN, Responsabilidad con la organización, nivel B", "o": [["A", "pedir que la meta se reparta en cuotas individuales y responder únicamente por la cuota que le asignen.", "Limita el compromiso a una tarea asignada, lo que se acerca a los niveles C y D (dirigir el trabajo a los resultados que le asignan, cumplir las tareas). El nivel B se caracteriza por asumir como propios los objetivos de la entidad.", false], ["B", "concentrarse en entregar con calidad las actuaciones que le repartan, porque eso es lo que depende directamente de usted.", "Refleja el nivel D (cumplir las tareas asignadas con los parámetros de calidad). El nivel B pide algo más: enfocar la propia actividad hacia el cumplimiento de los objetivos de la institución.", false], ["C", "orientar su trabajo hacia la meta institucional y contribuir a que la provincial la cumpla.", "El nivel B de Responsabilidad con la organización incluye enfocar la propia actividad hacia el cumplimiento de los objetivos de la institución. La meta del plan de acción es un objetivo de la entidad, y el servidor de nivel B la asume como propia y aporta a lograrla.", true]]}, {"id": "CO-103", "niv": 3, "e": "De las siguientes actuaciones, la que el diccionario ubica en Responsabilidad con la organización, nivel B, y no en Cumplimiento de parámetros de trabajo, nivel B, es", "f": "Diccionario de Competencias Comportamentales PGN, Responsabilidad con la organización, nivel B", "o": [["A", "definir objetivos para su equipo de trabajo que estén alineados con los procedimientos ya definidos.", "También pertenece al nivel B de Cumplimiento de parámetros de trabajo, cuya segunda conducta es definir objetivos para el equipo alineados con procedimientos definidos.", false], ["B", "procurar de manera constante que funcionen mejor los procesos de la institución en los que interviene.", "El diccionario asocia al nivel B de Responsabilidad con la organización la búsqueda permanente de la mejora de los procesos institucionales. Las otras dos conductas pertenecen al nivel B de Cumplimiento de parámetros de trabajo.", true], ["C", "seguir las reglas y los lineamientos establecidos para desempeñarse en los distintos procesos de la provincial.", "Es una conducta del nivel B de Cumplimiento de parámetros de trabajo (seguir reglas y lineamientos en diferentes procesos organizacionales), no de Responsabilidad con la organización.", false]]}]}, {"comp": "comportamental", "rol": "profesional", "tag": "Competencias comportamentales (Diccionario de la Procuraduría) · Niveles profesional, asesor y ejecutivo · Organización en el trabajo", "texto": "Usted es asesor de una procuraduría delegada con funciones preventivas y su empleo exige Organización en el trabajo en nivel B. Debe preparar el seguimiento preventivo a un programa de alimentación escolar en 40 municipios entre febrero y junio. Cuenta con cinco profesionales y dos vehículos, y cada visita toma en promedio dos días. Al revisar la información de los municipios, advierte que a partir de abril empieza la temporada de lluvias, que en años anteriores dejó incomunicados por varias semanas a seis de ellos. En el equipo también hay un técnico, cuyo empleo exige el nivel D de la misma competencia.", "items": [{"id": "CO-104", "niv": 1, "e": "Al elaborar el plan de visitas, la actuación que corresponde al nivel B de Organización en el trabajo es", "f": "Diccionario de Competencias Comportamentales PGN, Organización en el trabajo, nivel B", "o": [["A", "revisar cada semana que las actas de visita de los profesionales cumplan el formato y los estándares de calidad de la delegada.", "Corresponde al nivel C: coordinar y hacer seguimiento a las tareas propias o de otros a la luz de estándares, y verificar la aplicación de la normatividad sobre calidad. Es útil, pero no es la programación que pide el nivel B.", false], ["B", "reunir a los cinco profesionales para analizar con ellos la situación y escuchar sus puntos de vista antes de decidir.", "Interactuar con otros para analizar una situación y escuchar distintos puntos de vista antes de decidir es una conducta de Toma de decisiones, nivel B. Puede acompañar la planeación, pero no es la programación de actividades según recursos y tiempo que define el nivel B de Organización en el trabajo.", false], ["C", "programar las visitas de febrero a junio según personas, vehículos y semanas disponibles, con hitos mensuales.", "El nivel B de Organización en el trabajo consiste en programar, en escenarios de mediano plazo, la realización ordenada de actividades con base en la disponibilidad de recursos y tiempo, y en programar las metas de su área o equipo.", true]]}, {"id": "CO-105", "niv": 3, "e": "Frente al dato de la temporada de lluvias, lo que mejor refleja el nivel B de Organización en el trabajo es", "f": "Diccionario de Competencias Comportamentales PGN, Organización en el trabajo, nivel B", "o": [["A", "anticipar ese escenario y ubicar las visitas a los seis municipios en febrero y marzo.", "Una de las conductas del nivel B de Organización en el trabajo es proyectar situaciones y escenarios futuros con acierto. Programar las visitas antes de las lluvias usa esa proyección para ordenar las actividades según el tiempo disponible.", true], ["B", "mantener el orden previsto del cronograma y, si en abril se cierra alguna vía, reprogramar esa visita para junio.", "Es una reacción ante el problema cuando ya ocurrió. El nivel B pide proyectar situaciones y escenarios futuros con acierto, y aquí el riesgo era conocido de antemano.", false], ["C", "asumir las lluvias como un reto y reorganizar sus actividades en el momento en que se presenten los cierres de vías.", "Reconocer los cambios del entorno inmediato, asumirlos como un reto y reorganizar las propias actividades es la conducta de Adaptación al cambio, nivel D. Reacciona cuando el cambio ya ocurrió; el nivel B de Organización en el trabajo pide proyectar con acierto el escenario y programar antes.", false]]}, {"id": "CO-106", "niv": 2, "e": "Para el técnico del equipo, cuyo empleo exige el nivel D de Organización en el trabajo, la conducta que corresponde a su nivel es", "f": "Diccionario de Competencias Comportamentales PGN, Organización en el trabajo, nivel D", "o": [["A", "realizar los trabajos que le asignan ajustándose a las indicaciones y especificaciones que le da el asesor.", "Ejecutar los trabajos asignados de acuerdo con indicaciones y especificaciones establecidas es el nivel D de Orientación al orden, la calidad y la exactitud, otra competencia del diccionario. El nivel D de Organización en el trabajo se refiere a trabajar en forma estandarizada y en menos tiempo del requerido.", false], ["B", "hacer seguimiento a las tareas de los demás miembros del equipo con base en los indicadores de la delegada.", "Coordinar y hacer seguimiento a las tareas de otros a la luz de indicadores es propio del nivel C, superior al D exigido al técnico.", false], ["C", "ejecutar sus tareas con los formatos estandarizados y, en lo posible, en menos tiempo del que fija la entidad.", "El nivel D de Organización en el trabajo describe a quien ejecuta sus actividades según los parámetros de eficiencia de la entidad, en forma estandarizada y en menores tiempos que los requeridos.", true]]}]}, {"comp": "comportamental", "rol": "profesional", "tag": "Competencias comportamentales (Diccionario de la Procuraduría) · Niveles profesional, asesor y ejecutivo · Cumplimiento de parámetros de trabajo", "texto": "Usted es profesional universitario de una procuraduría regional y coordina a dos técnicos que apoyan la sustanciación. Su empleo exige Cumplimiento de parámetros de trabajo en nivel B. La entidad expidió un lineamiento interno que cambia la forma de registrar las actuaciones en el sistema de información: ahora cada auto debe registrarse el mismo día de su firma. Uno de los técnicos, preocupado por varios expedientes próximos a vencer, propone no registrar esas actuaciones hasta después de evacuarlos, «para ganar tiempo». El empleo de ese técnico exige el nivel D de la misma competencia.", "items": [{"id": "CO-107", "niv": 2, "e": "Al recibir el nuevo lineamiento de registro, la actuación que corresponde al nivel B de Cumplimiento de parámetros de trabajo es", "f": "Diccionario de Competencias Comportamentales PGN, Cumplimiento de parámetros de trabajo, nivel B", "o": [["A", "aplicarlo en los expedientes a su cargo y fijar a los técnicos metas de registro acordes con el nuevo procedimiento.", "El nivel B de Cumplimiento de parámetros de trabajo incluye seguir las reglas y lineamientos establecidos en los procesos organizacionales y definir objetivos para su equipo alineados con los procedimientos definidos.", true], ["B", "transmitir a los técnicos el cambio en el registro y documentar sus propias actividades según la nueva exigencia.", "Transmitir los procedimientos que involucran cambios y documentar las actividades según las nuevas demandas de la entidad son conductas de Adaptación al cambio, nivel C (facilitador del cambio). No incluyen aplicar el lineamiento ni alinear las metas del equipo con él, que es lo que describe el nivel B de Cumplimiento de parámetros de trabajo.", false], ["C", "esperar las pautas que imparta el procurador regional sobre cómo aplicarlo y seguirlas en cuanto las comunique.", "Seguir las pautas definidas por el jefe inmediato para cumplir los objetivos de la dependencia es una conducta del nivel C. En el nivel B el servidor aplica por sí mismo los lineamientos establecidos y alinea a su equipo con ellos.", false]]}, {"id": "CO-108", "niv": 3, "e": "Frente a la propuesta del técnico de aplazar el registro, la respuesta coherente con el nivel B de Cumplimiento de parámetros de trabajo es", "f": "Diccionario de Competencias Comportamentales PGN, Cumplimiento de parámetros de trabajo, nivel B", "o": [["A", "trasladar la propuesta al procurador regional para que sea él quien decida si se aplica o no.", "Remitir al jefe una decisión que ya está resuelta por el lineamiento se acerca al nivel C (seguir pautas del jefe inmediato). En el nivel B el servidor aplica los criterios establecidos y orienta a su equipo con base en ellos.", false], ["B", "explicarle que el registro hace parte del procedimiento y organizar con él los tiempos para cumplir ambas cosas.", "En el nivel B de Cumplimiento de parámetros de trabajo el servidor sigue los lineamientos establecidos y define objetivos para su equipo alineados con los procedimientos. Organizar el trabajo del técnico respetando el registro aplica ambas conductas.", true], ["C", "aceptarla solo para los expedientes próximos a vencer, porque proteger los términos es el objetivo principal de la dependencia.", "Privilegia el resultado por encima de la regla establecida. Esta competencia trata de aplicar en las labores la normatividad interna o externa; en el nivel B se siguen los lineamientos y se alinean los objetivos del equipo con ellos.", false]]}, {"id": "CO-109", "niv": 1, "e": "Para el técnico, cuyo empleo exige el nivel D de Cumplimiento de parámetros de trabajo, la conducta esperada en su nivel es", "f": "Diccionario de Competencias Comportamentales PGN, Cumplimiento de parámetros de trabajo, nivel D", "o": [["A", "pedir a su superior una orden específica antes de registrar cada actuación.", "Requerir órdenes específicas para desarrollar las actividades es una conducta del nivel D de Orientación al orden, la calidad y la exactitud, no de Cumplimiento de parámetros de trabajo. Además, el instructivo ya trae las instrucciones detalladas que el técnico debe seguir.", false], ["B", "definir las metas de registro del grupo de sustanciación, alineadas con el procedimiento.", "Definir objetivos para el equipo alineados con los procedimientos es propio del nivel B, que en este caso corresponde al profesional que coordina.", false], ["C", "seguir el instructivo paso a paso al registrar cada actuación y atender las indicaciones de su superior.", "El nivel D de Cumplimiento de parámetros de trabajo describe a quien aplica instrucciones detalladas en tareas operativas: sigue las normas y procedimientos establecidos y cumple las indicaciones de sus superiores en las tareas cotidianas.", true]]}]}, {"comp": "comportamental", "rol": "profesional", "tag": "Competencias comportamentales (Diccionario de la Procuraduría) · Niveles profesional, asesor y ejecutivo · Pensamiento conceptual", "texto": "Usted es asesor de una procuraduría delegada para asuntos ambientales y su empleo exige Pensamiento conceptual en nivel A. Hace tres años un tribunal ordenó a 18 municipios descontaminar un río, y la mayoría sigue incumpliendo. Los informes de seguimiento muestran causas muy distintas: falta de presupuesto en unos, contratos de obra suspendidos en otros, dudas sobre qué entidad es competente y planes de saneamiento desactualizados. Un procurador regional sostiene que todo se explica por la falta de recursos. El procurador delegado le pide preparar un documento para orientar a las procuradurías regionales que vigilan el cumplimiento de la orden.", "items": [{"id": "CO-110", "niv": 3, "e": "Para responder al encargo, la actuación que mejor refleja el nivel A de Pensamiento conceptual es", "f": "Diccionario de Competencias Comportamentales PGN, Pensamiento conceptual, nivel A", "o": [["A", "explicar el problema a partir de sus causas y proponer directrices para que las regionales actúen frente a cada una.", "El nivel A de Pensamiento conceptual consiste en explicar problemas de alta complejidad y formular directrices para atenderlos, generando lineamientos claros que permitan entender el problema a partir de sus elementos.", true], ["B", "elaborar un concepto técnico, con base en los informes municipales y en estudios externos, que aclare la situación del río.", "Realizar análisis técnico a partir de información primaria y secundaria y conceptuar sobre situaciones con elementos heterogéneos es la conducta del nivel B. El nivel A añade formular directrices para atender el problema.", false], ["C", "organizar todos los informes de seguimiento en una base de datos para que el procurador delegado los consulte.", "Diseñar y organizar bases de datos con información de diferentes medios es una conducta de Gestión de la información, nivel B, no de Pensamiento conceptual.", false]]}, {"id": "CO-111", "niv": 2, "e": "Frente a la afirmación del procurador regional sobre la falta de recursos, lo que corresponde al nivel A de Pensamiento conceptual es", "f": "Diccionario de Competencias Comportamentales PGN, Pensamiento conceptual, nivel A", "o": [["A", "aceptar la explicación, porque proviene de quien conoce de cerca la situación de los municipios de su región.", "Adopta una explicación sin analizar los elementos del problema. Contradice la definición de la competencia y la rigurosidad técnica y conceptual que el diccionario exige en el nivel A.", false], ["B", "examinar con rigor cada factor del problema y aclarar si el presupuesto explica todos los incumplimientos o solo una parte.", "Una de las conductas del nivel A es aclarar situaciones o problemas que requieren rigurosidad técnica y conceptual. La competencia se define como entender un problema a partir de los elementos que lo conforman, no desde una sola explicación.", true], ["C", "convocar una mesa de trabajo con los alcaldes para gestionar recursos que permitan cumplir la orden judicial.", "Puede ser una acción útil, pero apunta a obtener un resultado y no a entender el problema. Además parte de una premisa no verificada: que la causa es solo presupuestal.", false]]}, {"id": "CO-112", "niv": 1, "e": "Según el diccionario, el documento que se espera de un servidor con nivel A de Pensamiento conceptual debe", "f": "Diccionario de Competencias Comportamentales PGN, Pensamiento conceptual, nivel A", "o": [["A", "reunir toda la normativa y la jurisprudencia aplicables, para que cada regional saque sus propias conclusiones.", "Recopilar información sin aclarar el problema no responde al nivel A. Esta conducta se parece más a buscar información (Gestión de la información o Investigación) que a formular directrices.", false], ["B", "resolver el caso de cada municipio con un concepto individual elaborado por la delegada.", "Realizar conceptos que aclaran situaciones concretas aparece en los niveles B y C. El nivel A pide lineamientos que permitan entender el problema y atenderlo de manera general.", false], ["C", "dar a las regionales pautas concretas e inequívocas para que comprendan el problema y sepan cómo actuar.", "El nivel A de Pensamiento conceptual incluye generar lineamientos claros y precisos que permitan entender situaciones o problemas específicos, y formular directrices para atenderlos.", true]]}]}, {"comp": "comportamental", "rol": "profesional", "tag": "Competencias comportamentales (Diccionario de la Procuraduría) · Niveles profesional, asesor y ejecutivo · Orientación a resultados", "texto": "Usted es asesor de la Oficina de Planeación de la Procuraduría y su empleo exige Orientación a resultados en nivel A. El plan estratégico de la entidad fijó para este año reducir en 20 % el tiempo promedio de las actuaciones preventivas. En septiembre, las dependencias ya alcanzaron una reducción del 18 %, pero un recorte presupuestal disminuye los recursos para desplazamientos del último trimestre. El jefe de la oficina le pide proponer qué hacer con la meta y cómo enfrentar el recorte, y luego revisar el desempeño del equipo de planeación.", "items": [{"id": "CO-113", "niv": 2, "e": "Al formular la propuesta sobre la meta para el siguiente año, lo que corresponde al nivel A de Orientación a resultados es", "f": "Diccionario de Competencias Comportamentales PGN, Orientación a resultados, nivel A", "o": [["A", "proponer una meta que trascienda el propósito actual y comprometer tiempo y recursos del equipo para lograrla.", "El nivel A de Orientación a resultados consiste en establecer, alcanzar y superar metas desafiantes; sus conductas son fijar metas que trasciendan los propósitos actuales y comprometer recursos y tiempos para mejorar las metas establecidas.", true], ["B", "realizar todas las acciones necesarias para alcanzar el 20 % previsto, superando los obstáculos que surjan.", "Realizar todas las acciones para alcanzar los objetivos enfrentando los obstáculos es una conducta del nivel B. El nivel A va más allá: fija metas que trascienden los propósitos actuales.", false], ["C", "proponer que se mantenga la meta del 20 % un año más, para consolidar lo logrado antes de fijar otra.", "Es una decisión prudente, pero mantener la misma meta no corresponde al nivel A de Orientación a resultados, cuya conducta es fijar metas que trasciendan los propósitos actuales.", false]]}, {"id": "CO-114", "niv": 3, "e": "Frente al recorte presupuestal del último trimestre, lo que refleja el nivel A de Orientación a resultados es", "f": "Diccionario de Competencias Comportamentales PGN, Orientación a resultados, nivel A", "o": [["A", "asumir personalmente la responsabilidad por el resultado de las actividades que tiene a su cargo.", "Asumir la responsabilidad por los resultados de sus actividades es una conducta del nivel D. Es valiosa, pero no responde a lo que pide el nivel A ante una meta institucional.", false], ["B", "comprometer recursos y tiempos del equipo, redistribuyéndolos, para sostener la meta y procurar mejorarla.", "En el nivel A de Orientación a resultados el servidor compromete recursos y tiempos para mejorar las metas establecidas y busca superar los resultados esperados de metas desafiantes; un recorte no lo lleva a renunciar a ellas.", true], ["C", "solicitar que se rebaje la meta, porque las condiciones en que se fijó cambiaron.", "Ajustar la meta a la baja no refleja ninguna conducta de esta competencia, cuyo núcleo es lograr las metas propuestas; en el nivel A se trata de alcanzarlas y superarlas.", false]]}, {"id": "CO-115", "niv": 3, "e": "Al revisar el desempeño del equipo, la conducta que el diccionario asocia con el nivel C de Orientación a resultados, y no con el nivel A, es", "f": "Diccionario de Competencias Comportamentales PGN, Orientación a resultados, nivel C", "o": [["A", "integrar grupos de personas para lograr objetivos comunes.", "Es una conducta del nivel A de Trabajo en equipo, otra competencia del diccionario; no aparece en Orientación a resultados.", false], ["B", "impulsar que los miembros del grupo trabajen coordinados para que sus objetivos y metas encajen.", "El nivel C de Orientación a resultados (realizar y superar las metas del grupo de trabajo) incluye promover el trabajo en equipo como articulación de objetivos y metas propuestas.", true], ["C", "fijar metas que vayan más allá de los propósitos actuales de la entidad.", "Es una conducta del nivel A, no del C.", false]]}]}, {"comp": "comportamental", "rol": "profesional", "tag": "Competencias comportamentales (Diccionario de la Procuraduría) · Niveles profesional, asesor y ejecutivo · Investigación", "texto": "Usted es profesional universitario de una procuraduría delegada y su empleo exige Investigación en nivel B. El procurador delegado observa que en los dos últimos años creció el número de quejas que terminan archivadas sin abrir investigación y quiere entender por qué. Le encarga un estudio sobre el tema en coordinación con la Oficina de Planeación. Usted tiene acceso al sistema de información misional y a los expedientes físicos de las procuradurías regionales que dependen de la delegada.", "items": [{"id": "CO-116", "niv": 1, "e": "Al recibir el encargo, la actuación que mejor refleja el nivel B de Investigación es", "f": "Diccionario de Competencias Comportamentales PGN, Investigación, nivel B", "o": [["A", "aportar a la Oficina de Planeación información confiable sobre los expedientes archivados, para el estudio que esa oficina adelante.", "Aportar información confiable y veraz a los proyectos de la dependencia es una conducta del nivel C, que apoya investigaciones de otros; el nivel B diseña y realiza el estudio.", false], ["B", "consolidar y valorar la información sobre los expedientes archivados que le envíen las regionales.", "Consolidar y valorar la información necesaria para sus funciones es una conducta de Gestión de la información, nivel B. Es útil, pero no es diseñar un estudio orientado a proponer mejoras, que define el nivel B de Investigación.", false], ["C", "diseñar con Planeación un estudio sobre las causas del archivo y, con sus hallazgos, proponer un plan de mejoramiento.", "El nivel B de Investigación consiste en diseñar y realizar estudios conjuntamente para facilitar el funcionamiento de la entidad y proponer planes y programas de mejoramiento institucional.", true]]}, {"id": "CO-117", "niv": 3, "e": "Para definir cómo se analizarán los expedientes, lo que corresponde al nivel B de Investigación es", "f": "Diccionario de Competencias Comportamentales PGN, Investigación, nivel B", "o": [["A", "incorporar elementos de método, como una muestra representativa y categorías de análisis definidas de antemano.", "Una de las conductas del nivel B de Investigación es incorporar elementos en la búsqueda de métodos aplicables a la investigación. La muestra y las categorías son esos elementos de método.", true], ["B", "revisar uno por uno todos los expedientes archivados en los dos últimos años, para no dejar por fuera ningún caso.", "Muestra dedicación, pero no incorpora un método; el nivel B de Investigación pide incorporar elementos en la búsqueda de métodos aplicables a la investigación.", false], ["C", "aplicar en su trabajo diario los conceptos prácticos que vaya encontrando durante la revisión.", "Aplicar nuevos y prácticos conceptos a sus quehaceres habituales es una conducta del nivel D de Investigación, no del B.", false]]}, {"id": "CO-118", "niv": 1, "e": "Al terminar el estudio, la actuación que corresponde al nivel B de Investigación es", "f": "Diccionario de Competencias Comportamentales PGN, Investigación, nivel B", "o": [["A", "publicar los resultados en la intranet para que cada dependencia los use como considere conveniente.", "Divulgar los resultados no basta: el nivel B de Investigación orienta los estudios a proponer planes y programas de mejoramiento institucional.", false], ["B", "convertir los hallazgos en una propuesta de plan de mejoramiento para la entidad.", "El nivel B de Investigación se define como diseñar y realizar estudios para facilitar el funcionamiento de la entidad y proponer planes y programas de mejoramiento institucional.", true], ["C", "entregar el informe a la Oficina de Planeación para que sea esa oficina la que formule el plan de mejoramiento.", "Deja en otra dependencia la propuesta de mejoramiento y se limita a aportar insumos, algo más cercano al nivel C (aportar información a los programas de la dependencia). El nivel B incluye proponer los planes y programas de mejoramiento.", false]]}]}, {"comp": "comportamental", "rol": "tecnico", "tag": "Competencias comportamentales (Diccionario de la Procuraduría) · Niveles técnico, administrativo y operativo · Creatividad e innovación", "texto": "Usted es técnico de una procuraduría provincial de Boyacá y lleva el control de términos de los expedientes. Su empleo exige Creatividad e innovación en nivel C. El control lo hace hoy con un cuaderno y recordatorios en el correo, y en el último mes dos actuaciones estuvieron a punto de vencerse. En una capacitación conoció que otra procuraduría provincial organiza el control de términos por semáforos semanales, con buenos resultados. Su compañero, técnico de la secretaría, diseñó hace un año una hoja de cálculo para controlar sus préstamos de expedientes y la ha ido mejorando a medida que gana experiencia.", "items": [{"id": "CO-119", "niv": 2, "e": "Para mejorar su control de términos, la actuación que corresponde al nivel C de Creatividad e innovación es", "f": "Diccionario de Competencias Comportamentales PGN, Creatividad e innovación, nivel C", "o": [["A", "adaptar a su labor el método de semáforos semanales de la otra provincial y ensayarlo antes de adoptarlo.", "El nivel C de Creatividad e innovación consiste en diseñar nuevos procedimientos para realizar sus funciones: crear nuevas formas de trabajo perfeccionando o adaptando las mejores prácticas conocidas y ponerlas a prueba.", true], ["B", "crear una hoja de cálculo con alertas de vencimiento que le facilite su trabajo diario.", "Diseñar instrumentos para facilitar el propio desempeño es la conducta del nivel D (desarrollar herramientas para realizar su trabajo). El nivel C se refiere a nuevos procedimientos construidos desde mejores prácticas.", false], ["C", "hacer seguimiento sistemático a sus actividades para generar acciones de mejora en el control de términos.", "Generar acciones de mejoramiento mediante un seguimiento sistemático de las propias actividades es la conducta del nivel C de Orientación al mejoramiento continuo, no de Creatividad e innovación, cuyo nivel C trata de crear nuevos procedimientos adaptando las mejores prácticas y ponerlos a prueba.", false]]}, {"id": "CO-120", "niv": 1, "e": "Después de diseñar su nuevo procedimiento de control de términos, lo que corresponde al nivel C de Creatividad e innovación es", "f": "Diccionario de Competencias Comportamentales PGN, Creatividad e innovación, nivel C", "o": [["A", "aplicarlo de inmediato a todos los expedientes, porque mejora claramente el método del cuaderno.", "Omite la prueba del nuevo procedimiento, que el diccionario incluye expresamente en el nivel C.", false], ["B", "presentarlo al procurador provincial para que lo adopte como procedimiento oficial de toda la entidad.", "Proponer reformas para la entidad se asocia al nivel A de la competencia; además, se saltaría la prueba previa que exige el nivel C.", false], ["C", "ponerlo a prueba con un grupo de expedientes y ajustarlo antes de usarlo con todos.", "Una de las conductas del nivel C de Creatividad e innovación es poner a prueba los nuevos procedimientos que surgen del perfeccionamiento de las prácticas de trabajo.", true]]}, {"id": "CO-121", "niv": 3, "e": "La conducta del técnico de la secretaría, que diseñó una hoja de control para su propio trabajo y la ha ido perfeccionando con la práctica, corresponde en el diccionario a", "f": "Diccionario de Competencias Comportamentales PGN, Creatividad e innovación, nivel D", "o": [["A", "el nivel D de Creatividad e innovación.", "El nivel D de Creatividad e innovación (desarrollar herramientas para realizar su trabajo) incluye diseñar instrumentos que faciliten el desempeño y aplicarlos y mejorarlos a medida que se adquiere experticia, que es lo que hace el compañero.", true], ["B", "el nivel D de Organización en el trabajo.", "El nivel D de Organización en el trabajo trata de ejecutar las actividades según parámetros de eficiencia, en forma estandarizada y en menos tiempo; no describe el diseño ni el mejoramiento de instrumentos propios.", false], ["C", "el nivel C de Creatividad e innovación.", "El nivel C se refiere a diseñar nuevos procedimientos a partir de las mejores prácticas y probarlos; la hoja de cálculo es un instrumento para el propio desempeño, que el diccionario ubica en el nivel D.", false]]}]}, {"comp": "comportamental", "rol": "tecnico", "tag": "Competencias comportamentales (Diccionario de la Procuraduría) · Niveles técnico, administrativo y operativo · Responsabilidad con la organización", "texto": "Usted es técnico del archivo de gestión de una procuraduría regional y su empleo exige Responsabilidad con la organización en nivel C. La regional debe hacer este mes la transferencia documental al archivo central. Durante el alistamiento se detecta que faltan siete carpetas registradas en el inventario, y la jefe le asigna a usted resolver ese faltante. En el archivo trabaja también un auxiliar administrativo, cuyo empleo exige el nivel D de la misma competencia, encargado de foliar y rotular las carpetas.", "items": [{"id": "CO-122", "niv": 1, "e": "Frente al faltante de carpetas que le asignaron, lo que corresponde al nivel C de Responsabilidad con la organización es", "f": "Diccionario de Competencias Comportamentales PGN, Responsabilidad con la organización, nivel C", "o": [["A", "recopilar la información de préstamos y entregarla a la jefe para que sea ella quien decida cómo resolver el faltante.", "Aportar elementos para que otros tomen la decisión es la conducta del nivel D de Toma de decisiones. El problema le fue asignado a usted, y el nivel C de Responsabilidad con la organización pide buscarle solución.", false], ["B", "continuar con la transferencia programada y reportar el faltante en el formato de novedades del archivo.", "Cumplir las tareas asignadas y los parámetros de calidad describe el nivel D. El problema fue asignado a usted y el nivel C pide buscarle solución.", false], ["C", "buscar la solución al faltante, rastreando préstamos y ubicaciones, hasta resolverlo.", "El nivel C de Responsabilidad con la organización incluye buscar solución a los problemas o situaciones que le asignen en cumplimiento de sus funciones.", true]]}, {"id": "CO-123", "niv": 2, "e": "Al organizar su semana de trabajo, la conducta que refleja el nivel C de Responsabilidad con la organización es", "f": "Diccionario de Competencias Comportamentales PGN, Responsabilidad con la organización, nivel C", "o": [["A", "esperar a que la jefe le indique cada mañana qué tarea debe priorizar.", "Depender de la indicación diaria del jefe se asemeja a seguir instrucciones (Cumplimiento de parámetros de trabajo), no a dirigir el propio trabajo a la obtención de resultados.", false], ["B", "ordenar sus tareas en función de completar la transferencia, que es el resultado esperado este mes.", "Una de las conductas del nivel C de Responsabilidad con la organización es dirigir su trabajo a la obtención de resultados.", true], ["C", "dedicar el mismo tiempo a cada una de sus tareas del día, para no descuidar ninguna.", "Repartir el tiempo por igual no orienta el trabajo hacia el resultado esperado, que es lo que describe el nivel C.", false]]}, {"id": "CO-124", "niv": 1, "e": "Para el auxiliar administrativo del archivo, cuyo empleo exige el nivel D de Responsabilidad con la organización, la conducta que corresponde a su nivel es", "f": "Diccionario de Competencias Comportamentales PGN, Responsabilidad con la organización, nivel D", "o": [["A", "buscar por iniciativa propia la solución a los problemas de ubicación de expedientes de la oficina.", "Buscar solución a los problemas de la entidad se asocia al nivel C, superior al exigido para el auxiliar.", false], ["B", "foliar y rotular las carpetas a su cargo con los parámetros de calidad que fija la entidad.", "El nivel D de Responsabilidad con la organización consiste en cumplir las tareas asignadas: realizar las actividades a su cargo y cumplir con los parámetros de calidad establecidos por la entidad.", true], ["C", "buscar información sobre las tareas de su cargo y sobre su papel en el archivo.", "Buscar información sobre las actividades del cargo y el propio rol es una conducta del nivel D de Aprendizaje continuo, no de Responsabilidad con la organización.", false]]}]}, {"comp": "comportamental", "rol": "profesional", "tag": "Competencias comportamentales (Diccionario de la Procuraduría) · Niveles profesional, asesor y ejecutivo · Organización en el trabajo", "texto": "Usted es profesional universitario de la Oficina de Control Interno de la Procuraduría y su empleo exige Organización en el trabajo en nivel B. El jefe le pide programar las 12 auditorías internas del segundo semestre. La oficina cuenta con cuatro auditores; uno de ellos estará de vacaciones todo septiembre, y en diciembre el equipo se dedica a los informes de cierre de la vigencia. El jefe también quiere empezar a pensar en cómo debería funcionar la oficina en los próximos cinco años. En la oficina trabaja una técnica cuyo empleo exige el nivel D de la misma competencia.", "items": [{"id": "CO-125", "niv": 1, "e": "Al elaborar la programación del semestre, lo que mejor refleja el nivel B de Organización en el trabajo es", "f": "Diccionario de Competencias Comportamentales PGN, Organización en el trabajo, nivel B", "o": [["A", "programar dos auditorías por mes de julio a diciembre y ajustar sobre la marcha cuando algún auditor no esté disponible.", "Reparte las auditorías de manera mecánica, sin considerar la disponibilidad de recursos y tiempo que exige el nivel B, y deja auditorías en diciembre, mes ya comprometido.", false], ["B", "hacer seguimiento semanal al avance de cada auditoría frente a los indicadores del plan.", "Hacer seguimiento a las tareas a la luz de indicadores es una conducta del nivel C. Es útil durante la ejecución, pero no responde a la tarea de programar.", false], ["C", "repartir las 12 auditorías entre julio y noviembre según los auditores disponibles cada mes, previendo septiembre.", "El nivel B de Organización en el trabajo consiste en programar, a mediano plazo, la realización ordenada de actividades con base en la disponibilidad de recursos y tiempo, proyectando con acierto escenarios futuros.", true]]}, {"id": "CO-126", "niv": 3, "e": "La tarea de planear cómo funcionará la oficina en los próximos cinco años, estructurando su programación con base en gestión de calidad, corresponde según el diccionario", "f": "Diccionario de Competencias Comportamentales PGN, Organización en el trabajo, nivel A", "o": [["A", "al nivel A de Organización en el trabajo, porque implica planear a largo plazo con base en calidad.", "El nivel A de Organización en el trabajo se define como planear, en escenarios de largo plazo, programas o eventos con base en objetivos y metas, y estructurar la programación de las actividades basada en gestión de calidad.", true], ["B", "al nivel B de Orientación a resultados, porque implica alcanzar y superar las metas de la dependencia.", "Orientación a resultados trata del logro de metas, no de la planeación y organización de las actividades; la tarea descrita corresponde a Organización en el trabajo.", false], ["C", "al nivel B de Organización en el trabajo, porque implica programar las metas estratégicas del área.", "El nivel B se refiere a escenarios de mediano plazo. La planeación a largo plazo, estructurada con base en gestión de calidad, la ubica el diccionario en el nivel A.", false]]}, {"id": "CO-127", "niv": 2, "e": "Para la técnica de la oficina, cuyo empleo exige el nivel D de Organización en el trabajo, la conducta que corresponde a su nivel es", "f": "Diccionario de Competencias Comportamentales PGN, Organización en el trabajo, nivel D", "o": [["A", "consultar con método la información que necesita y hacer sus tareas estandarizadas en menos tiempo.", "El nivel D de Organización en el trabajo incluye acceder a la información y los datos en forma sistemática para realizar el trabajo y realizar las actividades en forma estandarizada y en menores tiempos que los requeridos.", true], ["B", "seguir paso a paso las instrucciones que el jefe le da para cada tarea operativa.", "Describe el nivel D de otra competencia, Cumplimiento de parámetros de trabajo (aplicar instrucciones detalladas en tareas operativas), no de Organización en el trabajo.", false], ["C", "verificar que sus compañeros apliquen las normas de calidad en los papeles de trabajo de las auditorías.", "Verificar la aplicación de la normatividad sobre calidad en el trabajo de compañeros es una conducta del nivel C, superior al exigido para la técnica.", false]]}]}, {"comp": "comportamental", "rol": "tecnico", "tag": "Competencias comportamentales (Diccionario de la Procuraduría) · Niveles técnico, administrativo y operativo · Cumplimiento de parámetros de trabajo", "texto": "Usted es sustanciador, de nivel técnico, en una procuraduría provincial, y su empleo exige Cumplimiento de parámetros de trabajo en nivel C. El procurador provincial fijó como pauta que todo proyecto de auto pase por revisión de un profesional antes de la firma. Un colega de otra provincial le cuenta que allá no hacen esa revisión en los autos de trámite sencillos. Hoy, mientras proyecta un auto, nota que la plantilla de auto de apertura, que se usa para quejas recibidas este año, todavía cita como norma de procedimiento la Ley 734 de 2002, derogada por el Código General Disciplinario (Ley 1952 de 2019, reformada por la Ley 2094 de 2021).", "items": [{"id": "CO-128", "niv": 1, "e": "Frente a la pauta de revisión previa, lo que mejor refleja el nivel C de Cumplimiento de parámetros de trabajo es", "f": "Diccionario de Competencias Comportamentales PGN, Cumplimiento de parámetros de trabajo, nivel C", "o": [["A", "proponer que la revisión se elimine y se reemplace por una lista de chequeo que usted mismo elabore.", "Diseñar herramientas propias se relaciona con Creatividad e innovación; en Cumplimiento de parámetros de trabajo, nivel C, lo esperado es aplicar la pauta vigente.", false], ["B", "omitir la revisión en los
