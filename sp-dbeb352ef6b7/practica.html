conocen de los concejales de municipios que no son capital de departamento (art. 76, num. 1, lit. a); los de las capitales corresponden a las regionales.", false], ["C", "la procuraduría regional de instrucción, por tratarse de un concejal de la capital del departamento.", "El artículo 75, num. 1, lit. c, del Decreto Ley 262 de 2000 asigna a las regionales de instrucción a los concejales de las capitales de departamento; los de los demás municipios corresponden a las provinciales (art. 76, num. 1, lit. a).", true]]}, {"id": "PG-154", "niv": 3, "e": "La instrucción de la queja contra el alcalde de la capital del departamento corresponde a", "f": "Decreto Ley 262 de 2000, arts. 25 num. 1 lit. c, 75 y 76 num. 1 lit. a (modificados por el Decreto Ley 1851 de 2021)", "o": [["A", "la procuraduría regional de instrucción, por ser el alcalde un servidor del orden departamental.", "El alcalde es un servidor del orden municipal o distrital, y el artículo 75 del Decreto Ley 262 de 2000 no incluye a los alcaldes de las capitales entre los sujetos de las regionales.", false], ["B", "las procuradurías delegadas disciplinarias de instrucción.", "El artículo 25, num. 1, lit. c, del Decreto Ley 262 de 2000, modificado por el artículo 12 del Decreto Ley 1851 de 2021, asigna a las delegadas de instrucción las actuaciones contra los alcaldes de capitales de departamento y los distritales, salvo el de Bogotá.", true], ["C", "la procuraduría provincial de instrucción, como ocurre con los demás alcaldes.", "Las provinciales conocen de los alcaldes de municipios que no sean capital de departamento (art. 76, num. 1, lit. a).", false]]}]}, {"comp": "estructura_pgn", "rol": "general", "tag": "Estructura y funciones de la Procuraduría · Procuradurías provinciales y regionales: funciones comunes", "texto": "La procuradora provincial de un municipio intermedio enfrenta tres situaciones. En el circuito judicial no hay procurador judicial y se adelanta un proceso en el que es necesario intervenir para defender el patrimonio público. Además, el personero municipal y ella se declaran ambos competentes para instruir una actuación disciplinaria contra un inspector de policía. Por último, un auxiliar recién vinculado pregunta quién es el superior directo de la procuradora provincial.", "items": [{"id": "PG-155", "niv": 1, "e": "A la pregunta del auxiliar, la respuesta acorde con el Decreto Ley 262 de 2000 es que los procuradores provinciales dependen directamente", "f": "Decreto Ley 262 de 2000, art. 80", "o": [["A", "del Viceprocurador General, que coordina el nivel territorial.", "El artículo 80 del Decreto Ley 262 de 2000 no asigna esa dependencia al Viceprocurador.", false], ["B", "del procurador regional respectivo.", "El artículo 80 del Decreto Ley 262 de 2000 dispone que los procuradores provinciales dependen directamente de los respectivos procuradores regionales; los regionales y distritales dependen del Procurador General.", true], ["C", "del Procurador General de la Nación, como los procuradores regionales y distritales.", "Del Procurador General dependen directamente los regionales y distritales; los provinciales dependen del regional (art. 80).", false]]}, {"id": "PG-156", "niv": 2, "e": "Respecto del proceso judicial en el circuito donde no hay procurador judicial, la procuradora provincial", "f": "Decreto Ley 262 de 2000, art. 76B num. 5 (adicionado por el art. 24 del Decreto Ley 1851 de 2021)", "o": [["A", "puede intervenir eventualmente como Ministerio Público, previa comunicación al procurador delegado correspondiente.", "El artículo 76B, num. 5, del Decreto Ley 262 de 2000, adicionado por el artículo 24 del Decreto Ley 1851 de 2021, permite a las provinciales intervenir eventualmente como Ministerio Público en asuntos de los procuradores judiciales donde estos no existan o no puedan actuar, previa comunicación al delegado.", true], ["B", "no puede intervenir, porque esa función es exclusiva de los procuradores judiciales.", "El artículo 76B, num. 5, prevé precisamente la intervención eventual de las provinciales cuando no existen procuradores judiciales o no pueden actuar.", false], ["C", "debe pedir al juez que designe un curador ad litem que represente el interés público.", "El curador ad litem no reemplaza al Ministerio Público; la norma prevé la intervención eventual de la procuraduría provincial (art. 76B, num. 5).", false]]}, {"id": "PG-157", "niv": 2, "e": "El conflicto de competencia entre el personero y la procuradora provincial, en etapa de instrucción, lo dirime", "f": "Decreto Ley 262 de 2000, arts. 22 num. 1 y 75 num. 10 (modificados por el Decreto Ley 1851 de 2021)", "o": [["A", "la Sala Disciplinaria de Instrucción del nivel central.", "La Sala de Instrucción resuelve conflictos en los procesos de las delegadas de instrucción (art. 22, num. 1, lit. b), no entre personeros y provinciales.", false], ["B", "el concejo municipal, como autoridad que eligió al personero.", "El concejo no tiene competencia para resolver conflictos de competencia disciplinaria; la norma la asigna a la procuraduría regional de instrucción (art. 75, num. 10).", false], ["C", "la procuraduría regional de instrucción correspondiente.", "El artículo 75, num. 10, del Decreto Ley 262 de 2000, modificado por el artículo 19 del Decreto Ley 1851 de 2021, asigna a las regionales de instrucción dirimir los conflictos de competencia entre los personeros y los procuradores provinciales en etapa de instrucción.", true]]}]}, {"comp": "estructura_pgn", "rol": "profesional", "tag": "Estructura y funciones de la Procuraduría · Niveles profesional, asesor y ejecutivo · Competencia preferente interna y conexidad", "texto": "Usted es asesor de una procuraduría regional de instrucción y debe proyectar decisiones en tres asuntos. Una procuraduría provincial recibió una queja contra un funcionario cuya investigación corresponde a una procuraduría delegada y pregunta si puede adelantar alguna actuación. En otro proceso, por los mismos hechos deben investigarse un diputado y un concejal de un municipio que no es capital de departamento. Además, una procuraduría delegada de instrucción manifiesta interés en asumir un proceso que adelanta una provincial contra un alcalde.", "items": [{"id": "PG-158", "niv": 3, "e": "Respecto de la queja de competencia de la procuraduría delegada, la procuraduría provincial", "f": "Decreto Ley 262 de 2000, arts. 76 num. 2 y 79 (art. 76 modificado por el art. 22 del Decreto Ley 1851 de 2021)", "o": [["A", "puede avanzar hasta antes de abrir investigación, siempre que informe al delegado a más tardar al día hábil siguiente de iniciar.", "El artículo 76, num. 2, del Decreto Ley 262 de 2000, modificado por el artículo 22 del Decreto Ley 1851 de 2021, permite a las provinciales adelantar actuaciones de competencia de los delegados hasta antes de la apertura de la investigación, con aviso al delegado a más tardar el día siguiente hábil, para que asuma si lo estima conveniente.", true], ["B", "puede adelantar la investigación hasta el pliego de cargos, que debe someter a la aprobación del delegado.", "La provincial solo puede actuar hasta antes de la apertura de investigación (art. 76, num. 2); la investigación y el pliego corresponden al delegado competente, y el archivo y el fallo al competente (art. 79).", false], ["C", "debe remitir la queja al delegado sin practicar diligencias, porque el asunto no es de su competencia.", "La norma autoriza a la provincial a adelantar la actuación hasta antes de la apertura de investigación, con aviso al delegado (art. 76, num. 2); no la obliga a remitir sin actuar.", false]]}, {"id": "PG-159", "niv": 3, "e": "En la investigación conjunta del diputado y del concejal, la competencia para conocer en primera instancia corresponde a", "f": "Decreto Ley 262 de 2000, art. 75 parágrafo 1 (modificado por el art. 19 del Decreto Ley 1851 de 2021)", "o": [["A", "dos procuradurías distintas, porque la conexidad no altera la competencia por el sujeto.", "La conexidad sí unifica la competencia: el parágrafo 1 del artículo 75 la atribuye a la regional.", false], ["B", "la procuraduría regional de instrucción, que conoce de ambos por razones de conexidad.", "El parágrafo 1 del artículo 75 del Decreto Ley 262 de 2000 dispone que, cuando por conexidad deban investigarse asuntos de competencia de una regional y de procuradurías distritales o provinciales, conoce en primera instancia la regional.", true], ["C", "la procuraduría provincial, por el factor territorial del municipio del concejal.", "Cuando por conexidad concurren asuntos de una regional y de una provincial, la competencia es de la regional (art. 75, parágrafo 1).", false]]}, {"id": "PG-160", "niv": 3, "e": "Para que la procuraduría delegada de instrucción asuma el proceso que adelanta la provincial contra el alcalde, se requiere", "f": "Decreto Ley 262 de 2000, art. 25 parágrafo 2 (modificado por el art. 12 del Decreto Ley 1851 de 2021)", "o": [["A", "la autorización del procurador regional, como superior funcional de la provincial.", "La norma no exige autorización del regional; el requisito es el concepto favorable del Comité Técnico de la función disciplinaria (art. 25, parágrafo 2).", false], ["B", "que el alcalde lo solicite, porque la elección popular impide variar la competencia sin su consentimiento.", "El parágrafo 2 del artículo 25 permite el ejercicio de la competencia preferente inclusive contra servidores de elección popular, sin requerir el consentimiento del investigado.", false], ["C", "concepto previo favorable del Comité Técnico de la función disciplinaria.", "El parágrafo 2 del artículo 25 del Decreto Ley 262 de 2000, modificado por el Decreto Ley 1851 de 2021, otorga a las delegadas de instrucción competencia preferente sobre procesos de las regionales, distritales y provinciales, inclusive contra servidores de elección popular, previo concepto favorable de ese comité.", true]]}]}, {"comp": "estructura_pgn", "rol": "tecnico", "tag": "Estructura y funciones de la Procuraduría · Niveles técnico, administrativo y operativo · Reparto y radicación de procesos en el nivel territorial", "texto": "Usted es técnico en la secretaría de una procuraduría regional. Por congestión, el procurador regional dispuso que una procuraduría provincial vecina adelante varias diligencias de investigaciones que corresponden a otra provincial. En otro expediente, el investigado presentó escrito pidiendo que su proceso se tramite en otra dependencia, por considerar que en su ciudad no hay garantías. Por último, llega una queja contra un servidor del orden departamental, y dos procuradurías regionales del mismo departamento se consideran competentes por el factor territorial.", "items": [{"id": "PG-161", "niv": 2, "e": "Sobre las investigaciones adelantadas por la provincial vecina, es correcto afirmar que", "f": "Decreto Ley 262 de 2000, art. 79", "o": [["A", "carecen de validez, porque las diligencias deben practicarlas la provincial competente o quien ella comisione.", "El artículo 79 del Decreto Ley 262 de 2000 autoriza a las procuradurías territoriales a adelantar investigaciones de competencia de otras de su mismo nivel, sin exigir comisión de la competente.", false], ["B", "la provincial vecina adquiere toda la competencia, incluida la de fallar.", "El artículo 79 reserva el archivo y los fallos al funcionario competente según el decreto.", false], ["C", "pueden adelantarse, pero las decisiones de archivo y los fallos le corresponden al funcionario competente.", "El artículo 79 del Decreto Ley 262 de 2000 permite que las procuradurías territoriales adelanten investigaciones de competencia de otras de su mismo nivel, pero reserva al competente las decisiones de archivo y los fallos.", true]]}, {"id": "PG-162", "niv": 2, "e": "La solicitud del investigado de que su proceso se tramite en otra dependencia debe resolverla", "f": "Decreto Ley 262 de 2000, art. 77", "o": [["A", "el procurador regional, como superior de la dependencia de conocimiento.", "El cambio de radicación es una facultad del Procurador General (art. 77), no del procurador regional.", false], ["B", "el Procurador General de la Nación.", "El artículo 77 del Decreto Ley 262 de 2000 faculta al Procurador General para cambiar la radicación del proceso disciplinario, de oficio, a solicitud del investigado o del funcionario de conocimiento, cuando sea necesario para garantizar el orden jurídico, el interés público o los derechos fundamentales del investigado.", true], ["C", "la misma dependencia que conoce del proceso, mediante auto de sustanciación.", "El funcionario de conocimiento puede solicitar el cambio, pero no decidirlo; la decisión es del Procurador General (art. 77).", false]]}, {"id": "PG-163", "niv": 1, "e": "Cuando dos procuradurías regionales se consideran competentes por el factor territorial para conocer del proceso contra el servidor del orden departamental, conoce", "f": "Decreto Ley 262 de 2000, art. 75 parágrafo 2 (modificado por el art. 19 del Decreto Ley 1851 de 2021)", "o": [["A", "la regional cuya circunscripción comprenda la capital del departamento.", "El parágrafo 2 del artículo 75 del Decreto Ley 262 de 2000, modificado por el Decreto Ley 1851 de 2021, asigna el conocimiento a la regional en cuya circunscripción esté comprendida la capital del departamento.", true], ["B", "la que designe por sorteo la Sala Disciplinaria de Instrucción del nivel central, previa solicitud de cualquiera de las dos regionales.", "No existe sorteo; la ley fija el criterio de la capital del departamento (art. 75, parágrafo 2).", false], ["C", "la que primero haya recibido la queja, por aplicación de la competencia a prevención.", "El criterio legal no es la prevención por recibo de la queja, sino la circunscripción que comprenda la capital del departamento (art. 75, parágrafo 2).", false]]}]}, {"comp": "estructura_pgn", "rol": "general", "tag": "Estructura y funciones de la Procuraduría · Función de intervención judicial", "texto": "En una procuraduría regional se reúnen los procuradores judiciales de la sede para planear el semestre. Un procurador judicial en lo administrativo informa que un concejal de la capital habría incurrido en una causal de pérdida de investidura. Una procuradora judicial en asuntos laborales comenta que un proceso que acompañó desde el juzgado llegará en casación a la Sala de Casación Laboral de la Corte Suprema de Justicia. Otro procurador judicial pregunta qué acciones puede interponer directamente para proteger un parque público que una alcaldía pretende vender.", "items": [{"id": "PG-164", "niv": 1, "e": "Frente a la posible causal de pérdida de investidura del concejal, el procurador judicial en lo administrativo", "f": "Decreto Ley 262 de 2000, art. 44", "o": [["A", "puede promover la acción de pérdida de investidura e intervenir en ese proceso.", "El artículo 44 del Decreto Ley 262 de 2000 dispone que los procuradores judiciales en lo contencioso administrativo intervienen en los procesos de pérdida de investidura de alcaldes, diputados y concejales y promueven esas acciones conforme a la ley.", true], ["B", "solo puede informar al concejo para que este decida si promueve la acción.", "El artículo 44 del Decreto Ley 262 de 2000 faculta a los procuradores judiciales administrativos para promover directamente la acción de pérdida de investidura.", false], ["C", "debe remitir el asunto a la Sala Disciplinaria de Instrucción, única competente frente a servidores de elección popular.", "La pérdida de investidura es un proceso judicial distinto del disciplinario; el artículo 44 asigna la intervención y la promoción de esa acción a los procuradores judiciales administrativos.", false]]}, {"id": "PG-165", "niv": 2, "e": "La intervención como Ministerio Público en el proceso que llegará a la Sala de Casación Laboral de la Corte Suprema de Justicia corresponde a", "f": "Decreto Ley 262 de 2000, arts. 33, 48 y 75B num. 6", "o": [["A", "la misma procuradora judicial, que conserva el proceso en todas las instancias.", "Los procuradores judiciales laborales actúan ante las salas laborales de los tribunales superiores y los juzgados laborales (art. 48); ante la Sala de Casación Laboral actúan los procuradores delegados (art. 33).", false], ["B", "los procuradores delegados con funciones de intervención en procesos laborales.", "El artículo 33 del Decreto Ley 262 de 2000 asigna a los procuradores delegados actuar como Ministerio Público ante la Sala de Casación Laboral de la Corte Suprema de Justicia y presentar allí recursos de casación y revisión.", true], ["C", "la procuraduría regional del lugar donde se tramitó la primera instancia.", "Las regionales intervienen solo ocasionalmente donde no haya procuradores judiciales (art. 75B, num. 6); la intervención ante la Corte Suprema está asignada a los procuradores delegados (art. 33).", false]]}, {"id": "PG-166", "niv": 2, "e": "Para proteger el parque público, el procurador judicial", "f": "Decreto Ley 262 de 2000, art. 38 num. 1; Constitución Política, arts. 277 y 282 num. 5", "o": [["A", "puede intervenir en una acción popular ya iniciada, pero promoverla corresponde al Defensor del Pueblo y a los ciudadanos.", "La Defensoría puede interponer acciones populares (art. 282, num. 5, de la Constitución), pero ello no excluye a los procuradores judiciales, a quienes el artículo 38, num. 1, también se lo permite.", false], ["B", "debe pedir al personero que presente la acción popular, porque a la Procuraduría le corresponde intervenir en ella, no promoverla.", "El artículo 38, num. 1, del Decreto Ley 262 de 2000 permite al procurador judicial interponer directamente la acción popular; no necesita acudir al personero.", false], ["C", "puede promover directamente una acción popular en defensa de ese bien de uso público.", "El artículo 38, num. 1, del Decreto Ley 262 de 2000 faculta a los procuradores judiciales para interponer acciones populares, de tutela, de cumplimiento, de nulidad de actos administrativos y de nulidad absoluta de contratos estatales; el artículo 277 de la Constitución permite a la Procuraduría interponer las acciones que considere necesarias.", true]]}]}, {"comp": "estructura_pgn", "rol": "general", "tag": "Estructura y funciones de la Procuraduría · Ministerio Público en los municipios: personerías", "texto": "Usted es profesional de una procuraduría provincial y atiende a una delegación de un municipio de quinta categoría. Los visitantes preguntan cómo y por cuánto tiempo se elige al personero municipal, cuándo empieza y termina su periodo, y bajo la dirección de quién ejerce sus funciones de Ministerio Público. También quieren saber si el personero debe informar a la Procuraduría de las investigaciones disciplinarias que adelanta contra servidores de la alcaldía.", "items": [{"id": "PG-167", "niv": 1, "e": "Sobre la elección del personero, usted les explica que lo elige", "f": "Ley 136 de 1994, art. 170 (modificado por el art. 4 de la Ley 2422 de 2024)", "o": [["A", "el procurador provincial, previo concurso, para un periodo de tres años.", "La Procuraduría no elige personeros, y el periodo es de cuatro años (art. 170 de la Ley 136 de 1994).", false], ["B", "el concejo municipal, previo concurso público de méritos, para un periodo institucional de cuatro años.", "El artículo 170 de la Ley 136 de 1994, modificado por el artículo 4 de la Ley 2422 de 2024, dispone que los concejos eligen personeros para periodos institucionales de cuatro años, dentro de los diez primeros días de enero del año en que inicia su periodo constitucional, previo concurso público de méritos.", true], ["C", "el alcalde, de terna enviada por el concejo, para un periodo igual al suyo.", "El personero no lo designa el alcalde: lo elige el concejo previo concurso público de méritos (art. 170 de la Ley 136 de 1994, modificado por la Ley 2422 de 2024).", false]]}, {"id": "PG-168", "niv": 2, "e": "Según el texto vigente de la Ley 136 de 1994, el personero elegido inicia su periodo", "f": "Ley 136 de 1994, art. 170 inciso 2 (modificado por el art. 4 de la Ley 2422 de 2024)", "o": [["A", "el 1 de enero siguiente a su elección y lo termina el 31 de diciembre del cuarto año.", "El artículo 170 vigente fija el inicio el 1 de marzo siguiente a la elección y la terminación el último día de febrero del cuarto año.", false], ["B", "el mismo día de su elección, en enero, y lo termina en enero del cuarto año.", "La elección se hace en los primeros diez días de enero, pero el periodo inicia el 1 de marzo siguiente (art. 170 de la Ley 136 de 1994, modificado por la Ley 2422 de 2024).", false], ["C", "el 1 de marzo siguiente a su elección y lo concluye el último día de febrero del cuarto año.", "Así lo dispone el inciso 2 del artículo 170 de la Ley 136 de 1994, modificado por el artículo 4 de la Ley 2422 de 2024.", true]]}, {"id": "PG-169", "niv": 2, "e": "Sobre la dirección de las funciones del personero y el deber de informar sus investigaciones disciplinarias, lo correcto es que el personero", "f": "Ley 136 de 1994, art. 178 y num. 4; Constitución Política, art. 118", "o": [["A", "actúa bajo la dirección suprema del Procurador y debe informar sus investigaciones a los procuradores provinciales.", "El artículo 178 de la Ley 136 de 1994 dispone que el personero ejerce en el municipio, bajo la dirección suprema del Procurador General, las funciones del Ministerio Público, y su num. 4 indica que adelanta las investigaciones bajo la supervigilancia de los procuradores provinciales, a quienes debe informar.", true], ["B", "es autónomo frente a la Procuraduría y no tiene el deber de informarle sus investigaciones, porque fue elegido por el concejo municipal.", "La elección por el concejo no excluye la dirección suprema del Procurador ni el deber de informar a los procuradores provinciales (art. 178, num. 4, de la Ley 136 de 1994).", false], ["C", "ejerce sus funciones bajo la dirección del alcalde y solo informa al concejo.", "El personero no está bajo la dirección del alcalde; ejerce el Ministerio Público bajo la dirección suprema del Procurador General (art. 178 de la Ley 136 de 1994).", false]]}]}, {"comp": "estructura_pgn", "rol": "profesional", "tag": "Estructura y funciones de la Procuraduría · Niveles profesional, asesor y ejecutivo · Procuradurías territoriales frente a personerías y control interno", "texto": "Usted es asesor en una procuraduría regional. La personería de un municipio pequeño, con una planta de solo dos abogados, adelanta un proceso disciplinario contra un funcionario de la alcaldía y no puede garantizar que la instrucción y el juzgamiento los realicen funcionarios distintos. En otro proceso, la misma personería profirió en instrucción un auto apelable, pero no tiene superior que pueda resolver la segunda instancia. Finalmente, un abogado pide que la Procuraduría revoque un fallo disciplinario dictado por esa personería que considera abiertamente ilegal.", "items": [{"id": "PG-170", "niv": 3, "e": "Ante la imposibilidad de la personería de separar instrucción y juzgamiento, el juzgamiento lo asume", "f": "Decreto Ley 262 de 2000, arts. 75A num. 6 y 76A num. 2 (adicionados por los arts. 20 y 23 del Decreto Ley 1851 de 2021)", "o": [["A", "el mismo personero, que debe designar un abogado externo para que dicte el fallo.", "La ley resuelve la falta de separación trasladando el juzgamiento a la provincial de juzgamiento (art. 76A, num. 2); no prevé que se contrate a un tercero para fallar.", false], ["B", "la procuraduría provincial de juzgamiento.", "El artículo 76A, num. 2, del Decreto Ley 262 de 2000, adicionado por el artículo 23 del Decreto Ley 1851 de 2021, asigna a las provinciales y distritales de juzgamiento el juzgamiento de los procesos de las personerías municipales y distritales cuando no puedan garantizar esa separación.", true], ["C", "la procuraduría regional de juzgamiento, como superior funcional de las personerías.", "La regional de juzgamiento asume el juzgamiento cuando es el control interno del orden departamental el que no puede garantizar la separación (art. 75A, num. 6); para personerías, la norma remite a la provincial de juzgamiento (art. 76A, num. 2).", false]]}, {"id": "PG-171", "niv": 3, "e": "La apelación del auto proferido en instrucción por la personería que no puede garantizar la segunda instancia corresponde a", "f": "Decreto Ley 262 de 2000, art. 75 num. 5 (modificado por el art. 19 del Decreto Ley 1851 de 2021)", "o": [["A", "la procuraduría provincial de instrucción, por ser la autoridad más cercana a la personería.", "La norma no asigna esta segunda instancia a la provincial, sino a la regional de instrucción (art. 75, num. 5).", false], ["B", "el concejo municipal, que eligió al personero.", "El concejo no tiene competencia disciplinaria de segunda instancia sobre las decisiones de la personería; la ley la asigna a la regional de instrucción (art. 75, num. 5).", false], ["C", "la procuraduría regional de instrucción.", "El artículo 75, num. 5, del Decreto Ley 262 de 2000, modificado por el artículo 19 del Decreto Ley 1851 de 2021, asigna a las regionales de instrucción los recursos contra las decisiones proferidas en instrucción por el control interno municipal y las personerías cuando no se pueda garantizar la segunda instancia.", true]]}, {"id": "PG-172", "niv": 3, "e": "La revocatoria directa del fallo disciplinario dictado por la personería, cuando proceda, corresponde a", "f": "Decreto Ley 262 de 2000, arts. 7 num. 24 y 9 num. 1 (modificados por el Decreto Ley 1851 de 2021)", "o": [["A", "el Procurador General, por sí mismo o mediante el servidor que designe para ello.", "El artículo 7, num. 24, del Decreto Ley 262 de 2000, modificado por el Decreto Ley 1851 de 2021, faculta al Procurador para revocar directamente, o a través del funcionario que designe, las decisiones disciplinarias del control interno disciplinario de las entidades y de las personerías.", true], ["B", "la Procuraduría Auxiliar para Asuntos Disciplinarios, por competencia propia.", "Esta procuraduría auxiliar proyecta las decisiones del Procurador en esos casos (art. 9, num. 1), pero la competencia para revocar es del Procurador o del funcionario que designe (art. 7, num. 24).", false], ["C", "el alcalde municipal, como jefe de la administración a la que pertenece el sancionado.", "El alcalde no tiene competencia para revocar decisiones disciplinarias de la personería; el artículo 7, num. 24, la asigna al Procurador o al funcionario que este designe.", false]]}]}, {"comp": "estructura_pgn", "rol": "general", "tag": "Estructura y funciones de la Procuraduría · Régimen especial de carrera: concursos", "texto": "La Oficina de Selección y Carrera prepara una nueva convocatoria para proveer empleos del nivel técnico en varias procuradurías provinciales. En la reunión de planeación surgen tres preguntas: cuáles son las etapas del proceso de selección según el Decreto Ley 262 de 2000; cuándo debe convocarse un concurso de ascenso en lugar de uno abierto, y con cuánta antelación debe divulgarse la convocatoria antes de iniciar las inscripciones.", "items": [{"id": "PG-173", "niv": 1, "e": "Según el Decreto Ley 262 de 2000, el proceso de selección comprende, además de la convocatoria, el reclutamiento, la aplicación de pruebas y la lista de elegibles,", "f": "Decreto Ley 262 de 2000, arts. 194 y 204", "o": [["A", "el periodo de prueba y su calificación.", "El artículo 194 del Decreto Ley 262 de 2000 incluye como etapas del proceso de selección la convocatoria, el reclutamiento, la aplicación de pruebas, la conformación de la lista de elegibles, el periodo de prueba y la calificación del periodo de prueba.", true], ["B", "la entrevista obligatoria y eliminatoria de todos los aspirantes.", "La entrevista no es una etapa obligatoria y, cuando se programa, nunca puede ser eliminatoria (art. 204 del Decreto Ley 262 de 2000).", false], ["C", "la posesión, con la cual termina el proceso de selección.", "El artículo 194 no incluye la posesión como etapa; el proceso de selección continúa con el periodo de prueba y su calificación.", false]]}, {"id": "PG-174", "niv": 2, "e": "El concurso debe convocarse como de ascenso cuando en la entidad existan", "f": "Decreto Ley 262 de 2000, art. 192", "o": [["A", "por lo menos tres empleados de carrera interesados en ascender, según el registro que lleve la Comisión de Carrera.", "El número que exige el artículo 192 es de cinco empleados inscritos en carrera que cumplan los requisitos, certificados por la División de Gestión Humana.", false], ["B", "empleados provisionales con más de un año de servicio en el empleo vacante.", "En los concursos de ascenso participan empleados inscritos en carrera (art. 192); la provisionalidad no da derecho a concurso de ascenso.", false], ["C", "al menos cinco empleados inscritos en carrera que cumplan los requisitos para ascender.", "El artículo 192 del Decreto Ley 262 de 2000 ordena convocar concurso de ascenso cuando existan por lo menos cinco empleados inscritos en carrera que cumplan los requisitos para ascender, según certificación del jefe de la División de Gestión Humana.", true]]}, {"id": "PG-175", "niv": 1, "e": "La convocatoria debe divulgarse con una antelación no inferior a", "f": "Decreto Ley 262 de 2000, art. 197", "o": [["A", "treinta días calendario a la fecha de aplicación de la prueba escrita.", "El artículo 197 toma como referencia el inicio de las inscripciones, no la aplicación de pruebas, y fija quince días hábiles.", false], ["B", "quince días hábiles a la fecha de iniciación de las inscripciones.", "El artículo 197 del Decreto Ley 262 de 2000 ordena divulgar la convocatoria con una antelación no inferior a quince días hábiles a la fecha de iniciación de las inscripciones.", true], ["C", "cinco días hábiles a la fecha de iniciación de las inscripciones.", "El término del artículo 197 es de quince días hábiles, no de cinco.", false]]}]}, {"comp": "estructura_pgn", "rol": "general", "tag": "Estructura y funciones de la Procuraduría · Lista de elegibles", "texto": "Terminado un concurso de méritos de la Procuraduría para el empleo de profesional universitario, el puntaje máximo posible era de 100 puntos. Los resultados consolidados de cuatro concursantes fueron: 82,4; 74,1; 70,0 y 68,9 puntos. Un concursante pregunta en la Oficina de Selección y Carrera cuál es el puntaje mínimo para integrar la lista, cuánto tiempo estará vigente esta y en qué plazo debe producirse el nombramiento de quien ocupe el primer lugar en un empleo que ya estaba vacante al convocarse el concurso.", "items": [{"id": "PG-176", "niv": 1, "e": "Con un puntaje máximo posible de 100 puntos, el puntaje total mínimo para integrar la lista de elegibles es", "f": "Decreto Ley 262 de 2000, art. 216", "o": [["A", "65 puntos.", "El 65 sobre 100 es el mínimo aprobatorio de la prueba de conocimientos en la convocatoria (Resolución 076 de 2026), no el umbral legal para integrar la lista de elegibles, que es el 70 % del puntaje total máximo (art. 216 del Decreto Ley 262 de 2000).", false], ["B", "70 puntos.", "El artículo 216 del Decreto Ley 262 de 2000 dispone que integran la lista quienes obtengan un puntaje total igual o superior al 70 % del máximo posible: 70 % de 100 es 70. Por eso integran la lista los tres primeros concursantes, incluido quien obtuvo exactamente 70,0.", true], ["C", "75 puntos.", "No corresponde al porcentaje legal del 70 % del puntaje máximo posible (art. 216).", false]]}, {"id": "PG-177", "niv": 2, "e": "La lista de elegibles tendrá una vigencia de", "f": "Decreto Ley 262 de 2000, art. 216", "o": [["A", "un año contado desde la posesión del primero de la lista.", "La vigencia es de dos años y se cuenta desde la publicación de la lista (art. 216).", false], ["B", "cuatro años, igual al periodo del Procurador que la expidió.", "La vigencia de la lista no está atada al periodo del Procurador; es de dos años desde su publicación (art. 216).", false], ["C", "dos años contados desde su publicación.", "El artículo 216 del Decreto Ley 262 de 2000 dispone que la lista, elaborada en riguroso orden de mérito, tiene vigencia de dos años contados desde su publicación y debe estar contenida en resolución del Procurador General.", true]]}, {"id": "PG-178", "niv": 2, "e": "El nombramiento de quien ocupa el primer lugar, para el empleo que ya estaba vacante, debe producirse", "f": "Decreto Ley 262 de 2000, arts. 185, 190 y 217", "o": [["A", "dentro de los veinte días hábiles siguientes a la publicación de la lista.", "El artículo 217 del Decreto Ley 262 de 2000 ordena producir el nombramiento en periodo de prueba o en propiedad dentro de los veinte días hábiles siguientes a la publicación de la lista, salvo lo previsto en el artículo 190.", true], ["B", "en cualquier momento durante la vigencia de la lista.", "Para empleos vacantes al momento de la convocatoria, el artículo 217 fija un plazo de veinte días hábiles desde la publicación de la lista.", false], ["C", "dentro de los tres meses siguientes al cierre de inscripciones.", "El término de tres meses del artículo 185 se refiere a la convocatoria del concurso después de un encargo o una provisionalidad, no al nombramiento del elegible.", false]]}]}, {"comp": "estructura_pgn", "rol": "tecnico", "tag": "Estructura y funciones de la Procuraduría · Niveles técnico, administrativo y operativo · Reclamaciones en el concurso", "texto": "Usted es técnico de la Oficina de Selección y Carrera y atiende el buzón de reclamaciones de un concurso. Un aspirante figura como no admitido porque, según la verificación, no acreditó la experiencia requerida. Otra concursante advierte que, al sumar sus puntajes parciales, el resultado publicado tiene un error aritmético. Mientras tanto, su jefe le pide organizar el archivo de seguridad de los bancos de preguntas que se usarán en las pruebas.", "items": [{"id": "PG-179", "niv": 2, "e": "La reclamación del aspirante no admitido debe presentarse", "f": "Decreto Ley 262 de 2000, arts. 12 num. 10, 202 y 240 num. 8", "o": [["A", "dentro de los dos días hábiles siguientes a la publicación de la lista, ante el jefe de la Oficina de Selección y Carrera.", "El artículo 202 del Decreto Ley 262 de 2000 fija dos días hábiles para reclamar ante el jefe de la Oficina de Selección y Carrera, quien resuelve en cinco días hábiles; contra su decisión procede apelación ante la Comisión de Carrera (ver también arts. 12, num. 10, y 240, num. 8).", true], ["B", "dentro de los diez días hábiles siguientes a la publicación de la lista, directamente ante la Comisión de Carrera.", "El término es de dos días hábiles y la reclamación se presenta ante el jefe de la Oficina de Selección y Carrera; la Comisión de Carrera conoce en apelación (art. 202).", false], ["C", "en cualquier momento antes de la aplicación de la prueba escrita, mediante escrito dirigido al Procurador General de la Nación.", "La reclamación tiene un término preclusivo de dos días hábiles; si se presenta tarde se rechaza por extemporánea (art. 202).", false]]}, {"id": "PG-180", "niv": 3, "e": "La reclamación por el error aritmético la resuelve", "f": "Decreto Ley 262 de 2000, arts. 12 num. 9 y 212", "o": [["A", "el jurado calificador en primera instancia y la Comisión de Carrera en segunda instancia.", "Ese doble trámite aplica a las reclamaciones por estructura y contenido de las pruebas de pregunta abierta (art. 212), no a los errores aritméticos.", false], ["B", "la Comisión de Carrera, en única instancia, dentro de los diez días hábiles siguientes.", "La Comisión de Carrera no conoce de los errores aritméticos; los resuelve el jefe de la Oficina de Selección y Carrera (art. 12, num. 9, y art. 212).", false], ["C", "el jefe de la Oficina de Selección y Carrera, de plano y en única instancia.", "El artículo 212 del Decreto Ley 262 de 2000 dispone que las reclamaciones por errores aritméticos se presentan ante el jefe de la Oficina de Selección y Carrera, quien resuelve de plano, en única instancia, dentro de los cinco días hábiles siguientes; el artículo 12, num. 9, lo reitera.", true]]}, {"id": "PG-181", "niv": 1, "e": "La custodia de los bancos de preguntas construidos para las pruebas corresponde a", "f": "Decreto Ley 262 de 2000, arts. 12 num. 7, 13, 19 y 208", "o": [["A", "la Oficina de Control Interno.", "Control Interno verifica la gestión de las dependencias (art. 13), pero no custodia los bancos de preguntas.", false], ["B", "la Oficina de Selección y Carrera.", "El artículo 12, num. 7, del Decreto Ley 262 de 2000 asigna a la Oficina de Selección y Carrera custodiar los bancos de preguntas que se construyan para las pruebas; el artículo 208 dispone que las pruebas tienen carácter reservado.", true], ["C", "la División de Documentación.", "La División de Documentación conserva información normativa y documental de la entidad (art. 19), pero la custodia de los bancos de preguntas está asignada a la Oficina de Selección y Carrera (art. 12, num. 7).", false]]}]}, {"comp": "estructura_pgn", "rol": "general", "tag": "Estructura y funciones de la Procuraduría · Periodo de prueba y calificación de servicios", "texto": "En una procuraduría distrital se posesionan en periodo de prueba dos servidores seleccionados en el concurso. El primero ingresa por concurso abierto y, al segundo mes, sufre una incapacidad médica de quince días calendario continuos. La segunda ya estaba inscrita en carrera como técnica y ascendió, mediante concurso, a un empleo del nivel profesional. Al mismo tiempo, un servidor de carrera de otra dependencia no está de acuerdo con su calificación anual de servicios y quiere saber quién conoce del recurso de apelación.", "items": [{"id": "PG-182", "niv": 1, "e": "Según el Decreto Ley 262 de 2000, el periodo de prueba tiene una duración de", "f": "Decreto Ley 262 de 2000, arts. 218 y 230", "o": [["A", "cuatro meses.", "El artículo 218 del Decreto Ley 262 de 2000 dispone que la persona seleccionada por concurso abierto, o por ascenso con cambio de nivel, es nombrada en periodo de prueba por cuatro meses, al cabo de los cuales se evalúa su desempeño.", true], ["B", "seis meses.", "El artículo 218 del Decreto Ley 262 de 2000, que rige la carrera especial de la PGN, fija el periodo de prueba en cuatro meses.", false], ["C", "un año.", "Un año es el periodo de la calificación anual de servicios (art. 230), no el del periodo de prueba, que es de cuatro meses (art. 218).", false]]}, {"id": "PG-183", "niv": 2, "e": "Por la incapacidad de quince días calendario continuos del primer servidor, su periodo de prueba", "f": "Decreto Ley 262 de 2000, art. 219", "o": [["A", "termina anticipadamente y debe repetirse completo desde la reincorporación.", "La norma no ordena reiniciar el periodo; lo prorroga por el tiempo necesario para culminarlo (art. 219).", false], ["B", "se prorroga por el tiempo necesario para completarlo.", "El artículo 219 del Decreto Ley 262 de 2000 dispone que, si por causa justificada se interrumpe el desempeño de las funciones por más de diez días calendario continuos, el periodo de prueba se prorroga por el término necesario para su culminación.", true], ["C", "se mantiene sin cambios y la incapacidad se valora en la evaluación final.", "La norma no prevé valorar la incapacidad en la evaluación: si la interrupción justificada supera diez días calendario continuos, el periodo de prueba se prorroga (art. 219).", false]]}, {"id": "PG-184", "niv": 3, "e": "Si la servidora que ascendió al nivel profesional no obtiene calificación satisfactoria en su periodo de prueba,", "f": "Decreto Ley 262 de 2000, art. 218", "o": [["A", "continúa en el empleo profesional en provisionalidad hasta un nuevo concurso.", "No está prevista esa consecuencia; la norma ordena el regreso al empleo anterior con conservación de la inscripción (art. 218).", false], ["B", "su nombramiento se declara insubsistente y pierde los derechos de carrera.", "La insubsistencia aplica a quien ingresó por concurso abierto sin estar inscrito; quien asciende con cambio de nivel regresa a su empleo anterior y conserva la inscripción (art. 218).", false], ["C", "vuelve al empleo técnico que ocupaba y mantiene sus derechos de carrera.", "El artículo 218 del Decreto Ley 262 de 2000 dispone que, cuando el ascenso ocasiona cambio de nivel y el empleado no obtiene calificación satisfactoria en el periodo de prueba, regresa a su empleo anterior y conserva su inscripción en la carrera.", true]]}, {"id": "PG-185", "niv": 2, "e": "El recurso de apelación contra la calificación anual de servicios lo resuelve", "f": "Decreto Ley 262 de 2000, arts. 12 num. 14, 227, 232 y 240 num. 10", "o": [["A", "la Comisión de Carrera.", "El artículo 232 del Decreto Ley 262 de 2000 dispone que del recurso de apelación contra la calificación conoce la Comisión de Carrera; el artículo 240, num. 10, le asigna conocer en segunda instancia los recursos contra las calificaciones de servicios.", true], ["B", "el jefe de la Oficina de Selección y Carrera, que notifica la calificación definitiva.", "La Oficina de Selección y Carrera efectúa los promedios y notifica la calificación definitiva (art. 12, num. 14), pero la apelación es de competencia de la Comisión de Carrera (arts. 232 y 240, num. 10).", false], ["C", "el superior inmediato del calificador, como jefe de la dependencia.", "Al superior del calificador se le puede pedir que ordene calificar cuando la calificación no se hace (art. 227), pero la apelación contra la calificación la resuelve la Comisión de Carrera (art. 232).", false]]}]}, {"comp": "gestion_publica", "rol": "general", "tag": "Gestión pública y funcionamiento del Estado · Estado social de derecho y fines del Estado", "texto": "Usted es profesional universitario de una procuraduría provincial con funciones preventivas y en marzo de 2027 revisa actuaciones de la alcaldía de un municipio de quinta categoría. Encuentra tres situaciones. Primera: un decreto municipal ordena a los inspectores de policía imponer las sanciones por ocupación de vías sin escuchar previamente a los afectados, lo que choca abiertamente con el debido proceso que garantiza el artículo 29 de la Constitución; un inspector pregunta si debe aplicarlo. Segunda: la secretaria de gobierno anuncia que el programa de ayudas para damnificados por inundaciones excluirá a las familias que llegaron hace poco de otro departamento, «porque la alcaldía solo responde por los nacidos aquí». Tercera: el alcalde sostiene que, gracias a la autonomía municipal, puede dejar de aplicar en su territorio una ley nacional de tránsito que considera inconveniente.", "items": [{"id": "GE-101", "niv": 1, "e": "Frente a la consulta del inspector sobre el decreto que suprime la posibilidad de ser escuchado, la regla constitucional aplicable indica que", "f": "Constitución Política, art. 4 (y art. 29)", "o": [["A", "el decreto debe aplicarse mientras un juez no lo anule, porque los actos administrativos se presumen legales.", "La presunción de legalidad no obliga a aplicar una norma abiertamente incompatible con la Constitución: el artículo 4 ordena preferir la norma constitucional, y esa regla vincula también a las autoridades administrativas.", false], ["B", "el inspector debe pedir al concejo municipal que inaplique el decreto, pues solo esa corporación puede dejar sin efectos los decretos del alcalde.", "Ninguna norma reserva al concejo la inaplicación de decretos del alcalde. La regla de preferencia constitucional del artículo 4 se aplica directamente por la autoridad que debe resolver el caso.", false], ["C", "debe darse prevalencia a la Constitución frente al decreto, por ser este incompatible con ella.", "El artículo 4 de la Constitución la define como norma de normas y ordena que, en todo caso de incompatibilidad entre ella y la ley u otra norma jurídica, se apliquen las disposiciones constitucionales (excepción de inconstitucionalidad). El decreto es abiertamente contrario al debido proceso.", true]]}, {"id": "GE-102", "niv": 1, "e": "Sobre la exclusión de las familias que llegaron de otro departamento, usted debe advertir a la secretaria que", "f": "Constitución Política, art. 2", "o": [["A", "la exclusión es válida por la autonomía territorial, que permite a cada municipio atender solo a su población nativa.", "La autonomía de las entidades territoriales se ejerce dentro de los límites de la Constitución y la ley (art. 287) y no autoriza a desconocer el deber de protección del artículo 2 ni el derecho a la igualdad.", false], ["B", "la exclusión es contraria a la Constitución, porque las autoridades deben proteger a todos los residentes en el país, vengan de donde vengan.", "El inciso 2 del artículo 2 de la Constitución señala que las autoridades están instituidas para proteger a todas las personas residentes en Colombia en su vida, honra, bienes, creencias y demás derechos y libertades. El lugar de nacimiento no es un criterio válido para excluir a damnificados.", true], ["C", "la exclusión es válida si se adopta por decreto, porque cada municipio fija los fines del Estado en su plan de desarrollo.", "Los fines esenciales del Estado están fijados en el artículo 2 de la Constitución y no los redefine un plan de desarrollo municipal; un decreto no puede restringir la protección que la Constitución ordena brindar a todas las personas residentes.", false]]}, {"id": "GE-103", "niv": 2, "e": "En relación con la postura del alcalde sobre la ley nacional de tránsito, lo correcto es señalar que", "f": "Constitución Política, arts. 1 y 287", "o": [["A", "la autonomía territorial se ejerce dentro de los límites de la Constitución y la ley, en una república unitaria.", "El artículo 1 de la Constitución define a Colombia como república unitaria, descentralizada, con autonomía de sus entidades territoriales, y el artículo 287 precisa que esa autonomía se ejerce dentro de los límites de la Constitución y la ley. El alcalde no puede dejar de aplicar una ley nacional.", true], ["B", "la autonomía territorial permite apartarse de una ley nacional mientras el gobernador no objete esa decisión.", "El gobernador no tiene facultad para autorizar el desconocimiento de leyes nacionales. La autonomía municipal se ejerce dentro de los límites de la Constitución y la ley (art. 287).", false], ["C", "la descentralización permite inaplicar una ley nacional en el municipio si el concejo lo aprueba mediante acuerdo.", "Un acuerdo municipal es jerárquicamente inferior a la ley y no puede dejarla sin efecto. Colombia es una república unitaria (art. 1), por lo que las leyes del Congreso rigen en todo el territorio.", false]]}]}, {"comp": "gestion_publica", "rol": "general", "tag": "Gestión pública y funcionamiento del Estado · Responsabilidad de los servidores y competencia", "texto": "Usted es técnico de una procuraduría provincial y apoya el trámite de una queja contra funcionarios de la alcaldía de un municipio. En la revisión se establece lo siguiente: el secretario de planeación dejó de expedir durante cuatro meses, sin justificación, las certificaciones de estratificación que el manual de funciones le asigna; la secretaria de gobierno, sin norma alguna que se lo permita, otorgó licencias de construcción, función que en ese municipio corresponde a la secretaría de planeación; el alcalde anunció que nombrará a un «asesor de paz», empleo que no existe en la planta de personal ni tiene recursos en el presupuesto; y un concejal investigado alega que, como no es empleado de la alcaldía, no es servidor público.", "items": [{"id": "GE-104", "niv": 1, "e": "Respecto del secretario de planeación que dejó de expedir las certificaciones, de acuerdo con la Constitución", "f": "Constitución Política, art. 6", "o": [["A", "solo respondería si infringiera una prohibición expresa de la Constitución o de la ley, del mismo modo que ocurre con los particulares.", "Ese es el régimen de los particulares, que responden únicamente por infringir la Constitución y las leyes. Los servidores responden además por omisión o extralimitación (art. 6).", false], ["B", "no responde, porque la omisión solo genera responsabilidad cuando ocasiona un daño patrimonial al municipio.", "El artículo 6 no condiciona la responsabilidad por omisión a un daño patrimonial; dejar de cumplir las funciones asignadas basta para comprometer la responsabilidad del servidor.", false], ["C", "responde por la omisión en el ejercicio de sus funciones, además de responder por infringir la Constitución y las leyes.", "El artículo 6 de la Constitución dispone que los servidores públicos son responsables por infringir la Constitución y las leyes y por omisión o extralimitación en el ejercicio de sus funciones.", true]]}, {"id": "GE-105", "niv": 2, "e": "La actuación de la secretaria de gobierno al otorgar las licencias de construcción", "f": "Constitución Política, art. 121", "o": [["A", "es válida si el alcalde ratifica después las licencias, pues la ratificación corrige la falta de competencia.", "La competencia proviene de la Constitución y la ley (art. 121); una ratificación posterior del alcalde no crea retroactivamente una competencia que la secretaria no tenía.", false], ["B", "es inválida por falta de competencia, pues la secretaría solo puede ejercer las funciones que la Constitución y la ley le asignan.", "El artículo 121 de la Constitución prohíbe a toda autoridad ejercer funciones distintas de las que le atribuyen la Constitución y la ley. La secretaria actuó sin competencia.", true], ["C", "es válida porque, al ser dependencias de la misma alcaldía, una secretaría puede asumir funciones de otra cuando hay congestión.", "Pertenecer a la misma entidad no habilita a una dependencia para ejercer funciones asignadas a otra; se requiere atribución normativa (art. 121) o una figura legal como la delegación con los requisitos de ley.", false]]}, {"id": "GE-106", "niv": 2, "e": "En cuanto al nombramiento del «asesor de paz», usted debe concluir que", "f": "Constitución Política, art. 122", "o": [["A", "puede hacerse de forma provisional mientras el concejo aprueba la modificación de la planta de personal.", "No existe empleo que proveer provisionalmente: sin estar creado en la planta y sin presupuesto, el cargo no puede proveerse de ninguna forma (art. 122).", false], ["B", "no es posible mientras el cargo no exista en la planta de personal y su remuneración no esté prevista en el presupuesto.", "El artículo 122 de la Constitución dispone que no habrá empleo público sin funciones detalladas en ley o reglamento y que, para proveer los de carácter remunerado, se requiere que estén contemplados en la planta y previstos sus emolumentos en el presupuesto.", true], ["C", "puede hacerse por decreto del alcalde, siempre que en el acto de nombramiento se fijen las funciones del cargo.", "Fijar funciones en el nombramiento no basta: el artículo 122 exige, para proveer empleos remunerados, que estén contemplados en la planta respectiva y que sus emolumentos estén previstos en el presupuesto.", false]]}, {"id": "GE-107", "niv": 1, "e": "Frente al argumento del concejal investigado, es acertado responder que", "f": "Constitución Política, art. 123", "o": [["A", "los concejales tienen la calidad de servidores públicos, por ser miembros de una corporación pública.", "Según el artículo 123 de la Constitución, son servidores públicos los miembros de las corporaciones públicas, los empleados y los trabajadores del Estado y de sus entidades descentralizadas territorialmente y por servicios.", true], ["B", "los concejales son particulares que ejercen funciones públicas de manera transitoria.", "Los concejales no son particulares: la Constitución los incluye expresamente entre los servidores públicos por ser miembros de una corporación pública (art. 123).", false], ["C", "solo son servidores públicos quienes tienen vínculo laboral con la administración municipal.", "La categoría de servidor público no depende de un vínculo laboral con la alcaldía: incluye a los miembros de corporaciones públicas de elección popular (art. 123).", false]]}]}, {"comp": "gestion_publica", "rol": "general", "tag": "Gestión pública y funcionamiento del Estado · Ramas del poder y órganos de control", "texto": "Usted es auxiliar de la oficina de atención al ciudadano de una procuraduría regional y prepara una charla para estudiantes de último grado de un colegio público. El profesor le envía con anticipación tres preguntas de los estudiantes: si la Procuraduría General de la Nación depende del Presidente de la República; a qué rama del poder pertenecen el Consejo Nacional Electoral y la Registraduría Nacional del Estado Civil; y si el personero del municipio es un empleado más del alcalde.", "items": [{"id": "GE-108", "niv": 1, "e": "Sobre la ubicación de la Procuraduría General de la Nación en la estructura del Estado, usted debe explicar que", "f": "Constitución Política, arts. 113, 117 y 118", "o": [["A", "hace parte de la rama judicial, porque adelanta procesos disciplinarios contra servidores públicos.", "Adelantar procesos disciplinarios no la convierte en parte de la rama judicial; es un órgano de control (art. 117) cuyas funciones disciplinarias son de naturaleza administrativa.", false], ["B", "es un organismo de la rama ejecutiva adscrito a la Presidencia de la República.", "La Procuraduría no pertenece a la rama ejecutiva: el Procurador es elegido por el Senado y la entidad hace parte de los órganos de control, autónomos e independientes (arts. 113, 117 y 276).", false], ["C", "integra el Ministerio Público, que la Constitución define como un órgano de control.", "El artículo 113 reconoce, además de las tres ramas, órganos autónomos e independientes, y el artículo 117 establece que el Ministerio Público y la Contraloría General de la República son órganos de control. El Ministerio Público es ejercido por el Procurador General (art. 118).", true]]}, {"id": "GE-109", "niv": 2, "e": "Sobre el Consejo Nacional Electoral y la Registraduría Nacional del Estado Civil, la respuesta correcta es que", "f": "Constitución Política, arts. 113 y 120", "o": [["A", "el primero pertenece a la rama judicial y la segunda a la rama ejecutiva.", "Ninguno de los dos pertenece a esas ramas: la Constitución los agrupa en la organización electoral (art. 120).", false], ["B", "conforman la organización electoral, que es uno de los órganos autónomos e independientes del Estado.", "El artículo 120 de la Constitución dispone que la organización electoral está conformada por el Consejo Nacional Electoral, la Registraduría Nacional del Estado Civil y los demás organismos que establezca la ley; el artículo 113 reconoce estos órganos autónomos e independientes.", true], ["C", "pertenecen a la rama legislativa, porque el Congreso elige a los magistrados del Consejo Nacional Electoral.", "Que el Congreso elija a los miembros del Consejo Nacional Electoral no lo integra a la rama legislativa. El artículo 120 los ubica en la organización electoral, que es autónoma.", false]]}, {"id": "GE-110", "niv": 2, "e": "Respecto del personero municipal, lo que debe aclararse a los estudiantes es que", "f": "Constitución Política, art. 118", "o": [["A", "es un empleado de libre nombramiento y remoción del alcalde, encargado de la defensa judicial del municipio.", "El personero no es nombrado ni removido por el alcalde (lo elige el concejo) y su función no es la defensa judicial del municipio, sino la de Ministerio Público (art. 118).", false], ["B", "es un delegado del Defensor del Pueblo y depende jerárquicamente de este.", "Aunque el personero colabora con la Defensoría en derechos humanos, no es su delegado ni su subordinado; la Constitución lo menciona de manera autónoma como agente del Ministerio Público (art. 118).", false], ["C", "ejerce funciones de Ministerio Público en el municipio y no es un subordinado del alcalde.", "El artículo 118 de la Constitución dispone que el Ministerio Público es ejercido, entre otros, por los personeros municipales; por eso el personero cumple funciones de control y no depende jerárquicamente del alcalde.", true]]}]}, {"comp": "gestion_publica", "rol": "general", "tag": "Gestión pública y funcionamiento del Estado · Principios de la función administrativa", "texto": "Usted es técnico administrativo de la secretaría de tránsito de un distrito. En una misma semana ocurre lo siguiente: el coordinador de la ventanilla ordena atender primero, sin turno, a los usuarios que lleguen recomendados por concejales; la secretaría expidió una resolución con nuevas tarifas de los parqueaderos oficiales para vehículos inmovilizados y empezó a cobrarlas sin haberla publicado ni dado a conocer; y un usuario le pregunta qué figuras prevé la Constitución para distribuir el trabajo y las decisiones entre el secretario y otros servidores u organismos.", "items": [{"id": "GE-111", "niv": 1, "e": "La orden del coordinador de atender primero a los recomendados desconoce principalmente", "f": "Constitución Política, art. 209; Ley 1437 de 2011, art. 3", "o": [["A", "el principio de imparcialidad, porque introduce un trato preferente por razones ajenas al interés general.", "El artículo 209 de la Constitución incluye la imparcialidad entre los principios de la función administrativa, y el artículo 3 del CPACA la explica como actuar sin consideración de factores de afecto o de interés, garantizando los derechos de todas las personas sin discriminación.", true], ["B", "el principio de publicidad, porque los demás usuarios no conocen el orden de atención.", "La publicidad exige dar a conocer las actuaciones; aunque el orden se publicara, seguiría siendo un favoritismo contrario a la imparcialidad.", false], ["C", "el principio de economía, porque altera el uso racional del tiempo de los funcionarios.", "El principio de economía se refiere al uso eficiente de tiempo y recursos. El problema central de la orden es el trato preferente por razones de afecto o interés, propio de la imparcialidad.", false]]}, {"id": "GE-112", "niv": 2, "e": "El cobro de las nuevas tarifas sin haber dado a conocer la resolución contraría", "f": "Constitución Política, art. 209; Ley 1437 de 2011, arts. 3 y 65", "o": [["A", "el principio de celeridad, porque la resolución se expidió sin respetar los términos de trámite.", "El caso no menciona demoras ni términos incumplidos; la falla consiste en exigir una decisión que no se ha dado a conocer.", false], ["B", "el principio de publicidad, porque las decisiones deben darse a conocer para ser exigibles.", "La publicidad es principio de la función administrativa (art. 209 de la Constitución). El CPACA (art. 3, num. 9) ordena dar a conocer las decisiones mediante comunicaciones, notificaciones o publicaciones, y los actos de carácter general no son obligatorios mientras no se publiquen (art. 65).", true], ["C", "el principio de eficacia, porque los cobros no lograrán su finalidad de recaudo.", "La eficacia busca que los procedimientos logren su finalidad; el defecto descrito no es de resultado sino de falta de divulgación de la decisión, propio del principio de publicidad.", false]]}, {"id": "GE-113", "niv": 2, "e": "Al usuario que pregunta por las figuras para distribuir funciones, usted le indica que el artículo 209 de la Constitución menciona", "f": "Constitución Política, art. 209", "o": [["A", "la avocación, la subrogación y la sustitución de competencias entre servidores.", "Ninguna de esas figuras aparece en el artículo 209; además, la avocación y la sustitución no son mecanismos ordinarios para distribuir funciones administrativas.", false], ["B", "la tercerización, la concesión y la comisión de servicios.", "La concesión es un contrato y la comisión una situación administrativa del empleado; ninguna es mencionada por el artículo 209 como forma de desarrollar la función administrativa.", false], ["C", "la descentralización, la delegación y la desconcentración de funciones.", "El artículo 209 de la Constitución dispone que la función administrativa se desarrolla mediante la descentralización, la delegación y la desconcentración de funciones.", true]]}]}, {"comp": "gestion_publica", "rol": "profesional", "tag": "Gestión pública y funcionamiento del Estado · Niveles profesional, asesor y ejecutivo · Estructura de la administración (Ley 489 de 1998)", "texto": "Usted es profesional especializado de una procuraduría delegada con funciones preventivas y debe clasificar, en un informe de seguimiento, cuatro entidades del orden nacional: (a) una superintendencia creada por ley, sin personería jurídica, que cumple funciones de inspección y vigilancia; (b) una entidad creada por ley, con capital 100 % estatal, que fabrica y vende productos en competencia con empresas privadas y se rige por el derecho privado; (c) una sociedad anónima autorizada por la ley, en la que la Nación tiene el 60 % de las acciones y particulares el 40 %; y (d) una unidad administrativa especial a la que su ley de creación le reconoció personería jurídica.", "items": [{"id": "GE-114", "niv": 1, "e": "La superintendencia descrita en el literal (a)", "f": "Ley 489 de 1998, arts. 38 y 66", "o": [["A", "pertenece al sector central de la Rama Ejecutiva del orden nacional.", "El artículo 38 de la Ley 489 de 1998 ubica en el sector central a las superintendencias y unidades administrativas especiales sin personería jurídica; el artículo 66 las define como organismos sin personería con autonomía administrativa y financiera.", true], ["B", "es un órgano autónomo e independiente, ajeno a las ramas del poder público.", "Las superintendencias hacen parte de la Rama Ejecutiva (art. 38 de la Ley 489); no son órganos autónomos como la organización electoral o los órganos de control.", false], ["C", "es una entidad descentralizada por servicios, por contar con autonomía administrativa y financiera.", "La autonomía administrativa y financiera no la convierte en descentralizada. Solo las superintendencias con personería jurídica son descentralizadas (arts. 38 y 68).", false]]}, {"id": "GE-115", "niv": 2, "e": "Por sus características, la entidad del literal (b) corresponde a", "f": "Ley 489 de 1998, arts. 70 y 85", "o": [["A", "un establecimiento público, porque todo su capital es estatal.", "Los establecimientos públicos atienden principalmente funciones administrativas y se rigen por el derecho público (art. 70). El origen exclusivamente estatal del capital no los distingue de las empresas industriales y comerciales.", false], ["B", "una empresa industrial y comercial del Estado, porque realiza actividades comerciales con capital público.", "El artículo 85 de la Ley 489 de 1998 define las empresas industriales y comerciales del Estado como organismos creados o autorizados por la ley que desarrollan actividades industriales o comerciales y de gestión económica conforme al derecho privado, con capital independiente.", true], ["C", "una sociedad de economía mixta, porque desarrolla actividades comerciales.", "La sociedad de economía mixta exige aportes estatales y de capital privado (art. 97). En el caso el capital es 100 % estatal.", false]]}, {"id": "GE-116", "niv": 3, "e": "La sociedad del literal (c), con 60 % de capital de la Nación y 40 % de particulares,", "f": "Ley 489 de 1998, arts. 38 y 97", "o": [["A", "es una sociedad de economía mixta, constituida como sociedad comercial con aportes estatales y de capital privado.", "El artículo 97 de la Ley 489 de 1998 define las sociedades de economía mixta como organismos autorizados por la ley, constituidos bajo la forma de sociedades comerciales con aportes estatales y de capital privado. El artículo 38 las ubica en el sector descentralizado por servicios.", true], ["B", "es una empresa industrial y comercial del Estado, porque la Nación tiene la mayoría de las acciones.", "La participación mayoritaria de la Nación no la transforma en empresa industrial y comercial: estas no se constituyen con aportes privados. La concurrencia de capital estatal y privado en forma societaria es propia de la sociedad de economía mixta (art. 97).", false], ["C", "es una sociedad privada, porque se constituyó como sociedad anónima conforme al Código de Comercio.", "La forma de sociedad comercial es precisamente uno de los rasgos de la sociedad de economía mixta; al estar autorizada por la ley y tener aportes estatales, es entidad descentralizada (arts. 38 y 97).", false]]}, {"id": "GE-117", "niv": 3, "e": "La unidad administrativa especial del literal (d), a la que la ley reconoció personería jurídica,", "f": "Ley 489 de 1998, arts. 38, 67 y 68", "o": [["A", "pertenece al sector central, porque todas las unidades administrativas especiales hacen parte de él.", "Solo las unidades administrativas especiales sin personería jurídica pertenecen al sector central (art. 38, num. 1, lit. e).", false], ["B", "pertenece al sector central, pero se rige por el derecho privado por tener personería jurídica.", "La personería jurídica es justamente lo que la ubica en el sector descentralizado; además, tenerla no implica por sí solo un régimen de derecho privado.", false], ["C", "pertenece al sector descentralizado por servicios, porque la ley le otorgó personería jurídica.", "Los artículos 38 y 68 de la Ley 489 de 1998 incluyen entre las entidades descentralizadas a las superintendencias y unidades administrativas especiales con personería jurídica; las que carecen de ella son del sector central (art. 67).", true]]}]}, {"comp": "gestion_publica", "rol": "general", "tag": "Gestión pública y funcionamiento del Estado · Delegación de funciones", "texto": "Usted trabaja en la oficina jurídica de una gobernación. El gobernador quiere delegar en la secretaria general, empleada del nivel directivo, la decisión de las solicitudes de comisión de estudios de los servidores y la firma de las resoluciones que las conceden o niegan. Una vez conocida la propuesta, la secretaria general manifiesta que, por su carga de trabajo, subdelegará esa función en un profesional universitario del área de talento humano. Un servidor, cuya solicitud de comisión fue negada en una resolución firmada por la secretaria, pregunta quién responde si esa resolución resulta ilegal.", "items": [{"id": "GE-118", "niv": 1, "e": "Para que la delegación propuesta por el gobernador sea válida, se requiere que", "f": "Ley 489 de 1998, arts. 9 y 10", "o": [["A", "la asamblea departamental la autorice previamente para cada función que se pretenda delegar.", "La delegación administrativa se hace por acto del delegante conforme a la Constitución y la ley (arts. 209 y 211 de la Constitución y 9 de la Ley 489); no requiere autorización de la asamblea para cada función.", false], ["B", "conste en un acto escrito que determine la autoridad delegataria y las funciones o asuntos que se transfieren.", "El artículo 10 de la Ley 489 de 1998 exige que el acto de delegación sea siempre escrito y determine la autoridad delegataria y las funciones o asuntos específicos cuya atención y decisión se transfieren.", true], ["C", "se imparta como instrucción verbal del gobernador, que se formaliza por escrito solo si algún interesado lo solicita.", "La ley no admite la delegación verbal: el acto de delegación siempre debe ser escrito (art. 10 de la Ley 489).", false]]}, {"id": "GE-119", "niv": 2, "e": "La subdelegación que anuncia la secretaria general", "f": "Ley 489 de 1998, art. 11", "o": [["A", "es posible siempre que la secretaria informe al gobernador dentro de los tres días siguientes.", "Ninguna norma permite subdelegar con un simple aviso posterior; la prohibición del artículo 11, numeral 2, de la Ley 489 es expresa.", false], ["B", "es posible si el profesional pertenece al área que maneja las comisiones de estudio.", "La pertenencia al área no salva la prohibición: las funciones recibidas por delegación no se pueden transferir de nuevo (art. 11, num. 2, de la Ley 489).", false], ["C", "no es posible, porque la ley excluye de la delegación las funciones que se recibieron por delegación.", "El artículo 11, numeral 2, de la Ley 489 de 1998 prohíbe transferir mediante delegación las funciones, atribuciones y potestades recibidas en virtud de delegación.", true]]}, {"id": "GE-120", "niv": 3, "e": "En cuanto a la responsabilidad por la resolución firmada por la secretaria general, la regla aplicable es que", "f": "Constitución Política, art. 211; Ley 489 de 1998, art. 12", "o": [["A", "responde la secretaria delegataria, salvo que el gobernador reforme o revoque la resolución y reasuma así la responsabilidad.", "El artículo 211 de la Constitución establece que la delegación exime de responsabilidad al delegante, la cual corresponde exclusivamente al delegatario, cuyos actos o resoluciones puede siempre reformar o revocar aquel, reasumiendo la responsabilidad consiguiente. El artículo 12 de la Ley 489 lo desarrolla. La jurisprudencia constitucional precisa que el delegante conserva deberes de dirección y control cuyo incumplimiento le es imputable, pero la responsabilidad por el acto expedido corresponde a la delegataria.", true], ["B", "responden por partes iguales el gobernador y la secretaria general, porque la delegación es un acto conjunto de quien delega y de quien la recibe.", "La Constitución no prevé una responsabilidad compartida por partes iguales: la radica exclusivamente en el delegatario, salvo que el delegante reforme o revoque el acto y reasuma la responsabilidad (art. 211).", false], ["C", "responde el gobernador, porque la delegación no traslada la responsabilidad del delegante.", "Es al contrario: el artículo 211 de la Constitución dispone que la delegación exime de responsabilidad al delegante. Las reglas especiales de contratación sobre el deber de vigilancia no aplican a una resolución de comisión de estudios.", false]]}]}, {"comp": "gestion_publica", "rol": "general", "tag": "Gestión pública y funcionamiento del Estado · Desconcentración y descentralización", "texto": "Usted es técnico de la secretaría de planeación de un municipio de primera categoría. El alcalde estudia tres propuestas para mejorar la prestación de servicios: (a) abrir puntos de la secretaría de hacienda en cuatro corregimientos para recibir declaraciones del impuesto de industria y comercio y expedir paz y salvos, bajo las instrucciones y orientaciones del secretario de hacienda; (b) crear un instituto municipal de deportes con personería jurídica, autonomía administrativa y financiera y patrimonio independiente, que preste ese servicio conforme al derecho público; y (c) para ganar tiempo, crear ese instituto mediante decreto del alcalde, sin acudir al concejo municipal.", "items": [{"id": "GE-121", "niv": 3, "e": "La propuesta (a), de abrir puntos de la secretaría de hacienda en los corregimientos, corresponde a la figura de", "f": "Ley 489 de 1998, art. 8", "o": [["A", "la desconcentración, porque acerca a los corregimientos funciones de la misma secretaría.", "El artículo 8 de la Ley 489 de 1998 define la desconcentración como la radicación de competencias y funciones en dependencias ubicadas fuera de la sede principal del organismo, sin perjuicio de las potestades de orientación e instrucción de los jefes superiores, y precisa que no implica delegación.", true], ["B", "la descentralización territorial, porque las funciones pasan a los corregimientos.", "Los corregimientos no son entidades territoriales ni reciben las funciones como titulares; la secretaría de hacienda sigue siendo la responsable.", false], ["C", "la delegación, porque el secretario transfiere el ejercicio de funciones a los funcionarios de los puntos.", "La delegación exige un acto escrito que transfiera la decisión a un delegatario determinado (arts. 9 y 10 de la Ley 489). Aquí las funciones se radican en dependencias externas que siguen bajo las instrucciones del secretario, lo que la ley califica como desconcentración, y aclara que esta no implica delegación.", false]]}, {"id": "GE-122", "niv": 2, "e": "La creación del instituto de deportes descrita en la propuesta (b) es un caso de", "f": "Ley 489 de 1998, arts. 68 y 70", "o": [["A", "desconcentración, porque el instituto seguirá sometido a la orientación del alcalde.", "La desconcentración ocurre dentro de la misma entidad, sin crear una persona jurídica distinta (art. 8). El control administrativo que conserva el alcalde no cambia la naturaleza descentralizada del nuevo instituto.", false], ["B", "delegación, porque el alcalde traslada al instituto funciones que hoy ejerce directamente.", "La delegación transfiere el ejercicio de funciones a colaboradores u otras autoridades mediante un acto escrito (art. 9) y no crea una nueva persona jurídica.", false], ["C", "descentralización por servicios, porque se crea una entidad con personería jurídica para prestar ese servicio.", "El instituto tendría personería jurídica, autonomía administrativa y financiera y patrimonio independiente, y prestaría un servicio conforme al derecho público: son las características del establecimiento público (art. 70 de la Ley 489), entidad descentralizada por servicios (art. 68).", true]]}, {"id": "GE-123", "niv": 1, "e": "Frente a la propuesta (c), usted debe advertir que", "f": "Ley 489 de 1998, art. 69; Constitución Política, art. 313, num. 6", "o": [["A", "el alcalde puede crear el instituto por decreto, porque es el jefe de la administración municipal.", "Ser jefe de la administración no lo faculta para crear entidades descentralizadas por sí solo: requiere acuerdo del concejo o su autorización (art. 69 de la Ley 489; art. 313, num. 6, de la Constitución).", false], ["B", "en el orden municipal, las entidades descentralizadas se crean por acuerdo del concejo o con su autorización.", "El artículo 69 de la Ley 489 de 1998 dispone que las entidades descentralizadas se crean en el orden municipal por el acuerdo o con su autorización; el artículo 313, numeral 6, de la Constitución asigna al concejo la creación de establecimientos públicos.", true], ["C", "solo una ley de la República puede crear el instituto, como ocurre con las entidades nacionales.", "La creación por ley se exige para las entidades descentralizadas del orden nacional; en el orden municipal basta el acuerdo del concejo o su autorización (art. 69).", false]]}]}, {"comp": "gestion_publica", "rol": "general", "tag": "Gestión pública y funcionamiento del Estado · Organización territorial y autonomía", "texto": "Usted es profesional universitario de una procuraduría regional y acompaña un foro con concejales de varios municipios del departamento sobre organización territorial. Durante el foro surgen tres inquietudes: un concejal afirma que los corregimientos y las comunas de su municipio son entidades territoriales con los mismos derechos que el municipio; otro pregunta qué derechos concretos les da la autonomía que reconoce la Constitución; y un tercero pide precisar qué lugar ocupa el municipio en la organización del Estado.", "items": [{"id": "GE-124", "niv": 1, "e": "Según la Constitución, son entidades territoriales", "f": "Constitución Política, art. 286", "o": [["A", "los departamentos, los municipios, los corregimientos y las comunas.", "Los corregimientos y las comunas son divisiones administrativas internas del municipio, no entidades territoriales (art. 286 de la Constitución).", false], ["B", "los departamentos, los municipios, las áreas metropolitanas y las asociaciones de municipios.", "Las áreas metropolitanas y las asociaciones de municipios son formas de organización o asociación entre municipios, pero la Constitución no las enumera como entidades territoriales (art. 286).", false], ["C", "los departamentos, los distritos, los municipios y los territorios indígenas.", "El artículo 286 de la Constitución dispone que son entidades territoriales los departamentos, los distritos, los municipios y los territorios indígenas, y que la ley podrá dar ese carácter a las regiones y provincias que se constituyan.", true]]}, {"id": "GE-125", "niv": 2, "e": "Entre los derechos que la autonomía otorga a las entidades territoriales se encuentra el de", "f": "Constitución Política, art. 287", "o": [["A", "dictar sus propias leyes en las materias que el Congreso de la República no haya regulado todavía.", "Las entidades territoriales no expiden leyes: asambleas y concejos dictan ordenanzas y acuerdos sujetos a la Constitución y la ley. La función legislativa corresponde al Congreso.", false], ["B", "administrar sus recursos y establecer los tributos necesarios para cumplir sus funciones.", "El artículo 287 de la Constitución reconoce a las entidades territoriales, dentro de los límites de la Constitución y la ley, los derechos a gobernarse por autoridades propias, ejercer las competencias que les correspondan, administrar los recursos y establecer los tributos necesarios para el cumplimiento de sus funciones, y participar en las rentas nacionales.", true], ["C", "fijar por sí mismas el régimen de inhabilidades e incompatibilidades de sus servidores.", "El régimen de inhabilidades e incompatibilidades es materia de la Constitución y la ley; la autonomía territorial no faculta a las entidades para establecerlo.", false]]}, {"id": "GE-126", "niv": 1, "e": "En cuanto al lugar del municipio en la organización del Estado, la Constitución establece que", "f": "Constitución Política, arts. 286 y 311", "o": [["A", "es la entidad fundamental de la división político-administrativa del Estado.", "El artículo 311 de la Constitución define al municipio como entidad fundamental de la división político-administrativa del Estado, encargado de prestar los servicios públicos que determine la ley y construir las obras que demande el progreso local, entre otras tareas.", true], ["B", "es una dependencia del departamento, encargada de ejecutar en su territorio las políticas departamentales.", "El municipio es una entidad territorial con autonomía (arts. 286 y 287), no una dependencia del departamento; este cumple funciones de coordinación y complementariedad (art. 298).", false], ["C", "es una entidad descentralizada por servicios del orden departamental.", "La descentralización por servicios se predica de entidades como los establecimientos públicos; el municipio es una entidad territorial, es decir, una forma de descentralización territorial.", false]]}]}, {"comp": "gestion_publica", "rol": "tecnico", "tag": "Gestión pública y funcionamiento del Estado · Niveles técnico, administrativo y operativo · Categorización de municipios", "texto": "Usted es técnico administrativo de la secretaría de hacienda de un departamento y apoya la revisión de la categorización de los municipios para la vigencia 2027. El municipio A tiene 18.500 habitantes y unos ingresos corrientes de libre destinación (ICLD) anuales equivalentes a 27.000 salarios mínimos legales mensuales. El municipio B tiene 45.000 habitantes y unos ICLD equivalentes a 12.000 salarios mínimos. Ninguno de los dos es municipio de frontera ni capital de departamento; ambos estaban en quinta categoría en 2026 y sus gastos de funcionamiento están dentro de los límites legales. Además, el alcalde de un tercer municipio pregunta hasta cuándo debe expedir su decreto de categorización, y la alcaldía de la capital del departamento consulta qué efecto tiene la Ley 2082 de 2021.", "items": [{"id": "GE-127", "niv": 3, "e": "De acuerdo con el artículo 6 de la Ley 136 de 1994, en su texto vigente (modificado por el Decreto Ley 2106 de 2019), el municipio A debe clasificarse en", "f": "Ley 136 de 1994, art. 6, par. 1 (texto vigente: Decreto Ley 2106 de 2019, art. 153)", "o": [["A", "cuarta categoría.", "Por población (10.001 a 20.000 habitantes) le correspondería la quinta categoría, cuyo tope de ICLD es 25.000 salarios mínimos. Como sus ICLD (27.000) superan ese monto, el parágrafo 1 del artículo 6 de la Ley 136, en el texto que le dio el artículo 153 del Decreto Ley 2106 de 2019, ordena clasificarlo en la categoría inmediatamente super
