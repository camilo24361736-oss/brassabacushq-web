proponente pero no su capacidad financiera.", "El RUP contiene la capacidad jurídica, la experiencia y la capacidad financiera y de organización del proponente (Decreto 1082 de 2015, art. 2.2.1.1.1.5.3).", false], ["C", "era obligatoria, porque la entidad debe verificar directamente toda la información financiera de los proponentes.", "La verificación de la capacidad financiera se demuestra con el certificado del RUP; la entidad no puede pedir los documentos usados para la inscripción (art. 6, num. 6.1, Ley 1150).", false]]}, {"id": "CE-140", "niv": 1, "e": "Para el contrato de apoyo a la gestión con la persona natural,", "f": "Ley 1150 de 2007, arts. 2, num. 4, lit. h) y 6, inc. 2", "o": [["A", "se exige el RUP cuando el valor del contrato supera la mínima cuantía de la gobernación.", "La excepción del RUP en la contratación directa no depende del valor del contrato (art. 6, inc. 2, Ley 1150).", false], ["B", "no se exige el RUP y la gobernación verifica directamente las condiciones del contratista.", "El inciso 2 del artículo 6 de la Ley 1150 exceptúa del RUP, entre otros, los casos de contratación directa, y dispone que en ellos corresponde a la entidad verificar las condiciones de los proponentes. La prestación de servicios de apoyo a la gestión es una causal de contratación directa (art. 2, num. 4, lit. h).", true], ["C", "se exige el RUP, porque toda persona que aspire a contratar con el Estado debe estar inscrita en él.", "La regla de inscripción tiene excepciones expresas, entre ellas la contratación directa (art. 6, inc. 2, Ley 1150).", false]]}, {"id": "CE-141", "niv": 1, "e": "La información sobre las multas impuestas debe enviarse a la cámara de comercio", "f": "Ley 1150 de 2007, art. 6, num. 6.2; Decreto 1082 de 2015, art. 2.2.1.1.1.5.7", "o": [["A", "mensualmente, con copia de los actos administrativos en firme que las impusieron.", "El numeral 6.2 del artículo 6 de la Ley 1150 ordena a las entidades enviar mensualmente a la cámara de comercio la información sobre contratos, multas y sanciones, y el artículo 2.2.1.1.1.5.7 del Decreto 1082 de 2015 precisa que se remite copia de los actos administrativos en firme.", true], ["B", "cuando el contratista sancionado solicite la renovación de su inscripción en el RUP.", "El reporte es un deber periódico de la entidad, que no depende de los trámites del contratista ante la cámara (art. 6, num. 6.2, Ley 1150).", false], ["C", "una vez al año, junto con el informe de gestión contractual que se rinde a los organismos de control.", "La periodicidad legal es mensual (art. 6, num. 6.2, Ley 1150; Decreto 1082, art. 2.2.1.1.1.5.7).", false]]}]}, {"comp": "contratacion", "rol": "general", "tag": "Contratación estatal · Garantías y su suficiencia", "texto": "Una gobernación adjudicó por licitación pública un contrato de obra para construir un aula múltiple en un colegio departamental. El presupuesto oficial era de $2.000.000.000 y la oferta ganadora fue de $1.950.000.000, valor por el que se firmó el contrato, con un plazo de ejecución de diez meses. El contrato prevé un anticipo del 30 % de su valor. Usted es profesional de la oficina jurídica y debe revisar las garantías antes de aprobarlas. Ninguno de los valores del proceso supera un millón de SMMLV.", "items": [{"id": "CE-142", "niv": 2, "e": "La garantía de seriedad que debía acompañar la oferta ganadora tenía que ser, como mínimo, de", "f": "Decreto 1082 de 2015, art. 2.2.1.2.3.1.9", "o": [["A", "$97.500.000.", "Equivale al 5 % de la oferta; la norma exige al menos el 10 % del valor de la oferta (Decreto 1082 de 2015, art. 2.2.1.2.3.1.9).", false], ["B", "$195.000.000.", "El artículo 2.2.1.2.3.1.9 del Decreto 1082 de 2015 exige que la garantía de seriedad sea de por lo menos el 10 % del valor de la oferta y que esté vigente desde su presentación hasta la aprobación de la garantía de cumplimiento: 10 % de $1.950.000.000 = $195.000.000.", true], ["C", "$200.000.000.", "Es el 10 % del presupuesto oficial, base que el reglamento usa para la subasta inversa y el concurso de méritos, no para la licitación, en la que la base es el valor de la oferta (Decreto 1082, art. 2.2.1.2.3.1.9).", false]]}, {"id": "CE-143", "niv": 1, "e": "La garantía de estabilidad y calidad de la obra, salvo justificación técnica para un término menor, debe estar vigente", "f": "Decreto 1082 de 2015, arts. 2.2.1.2.3.1.12 a 2.2.1.2.3.1.14", "o": [["A", "por el plazo del contrato y tres años más, contados desde la firma del contrato de obra.", "Esa vigencia es la del amparo de pago de salarios, prestaciones sociales e indemnizaciones laborales (Decreto 1082, art. 2.2.1.2.3.1.13).", false], ["B", "hasta la liquidación del contrato, igual que el amparo de cumplimiento, porque cubre la obra durante toda la ejecución.", "La vigencia hasta la liquidación corresponde al amparo de cumplimiento (Decreto 1082, art. 2.2.1.2.3.1.12); la estabilidad de la obra cubre daños posteriores a la entrega.", false], ["C", "por no menos de cinco años contados desde que la gobernación recibe la obra a satisfacción.", "El artículo 2.2.1.2.3.1.14 del Decreto 1082 de 2015, modificado por el Decreto 399 de 2021, exige una vigencia no inferior a cinco años desde el recibo a satisfacción; solo con justificación técnica de un experto puede ser menor, y en todo caso de mínimo un año.", true]]}, {"id": "CE-144", "niv": 3, "e": "El amparo de pago de salarios, prestaciones sociales legales e indemnizaciones laborales debe cubrir, como mínimo,", "f": "Decreto 1082 de 2015, art. 2.2.1.2.3.1.13", "o": [["A", "$97.500.000 y estar vigente por el plazo del contrato y tres años más.", "El artículo 2.2.1.2.3.1.13 del Decreto 1082 de 2015 fija un valor no inferior al 5 % del valor total del contrato y una vigencia igual al plazo del contrato y tres años más: 5 % de $1.950.000.000 = $97.500.000.", true], ["B", "$195.000.000 y estar vigente por el plazo del contrato y tres años más.", "El porcentaje mínimo de este amparo es el 5 % del valor del contrato, no el 10 % que se exige para el amparo de cumplimiento (Decreto 1082, arts. 2.2.1.2.3.1.12 y 2.2.1.2.3.1.13).", false], ["C", "$97.500.000 y estar vigente hasta la liquidación del contrato.", "El valor es correcto, pero la vigencia de este amparo es el plazo del contrato y tres años más, no hasta la liquidación (Decreto 1082, art. 2.2.1.2.3.1.13).", false]]}, {"id": "CE-145", "niv": 3, "e": "En relación con el anticipo pactado, la gobernación debe exigir", "f": "Ley 80 de 1993, art. 40, par.; Ley 1474 de 2011, art. 91; Decreto 1082 de 2015, arts. 2.2.1.1.2.4.1 y 2.2.1.2.3.1.10", "o": [["A", "una garantía de buen manejo por $58.500.000, equivalente al 10 % del anticipo, y su consignación en una cuenta a nombre del contratista.", "La garantía de buen manejo debe cubrir el 100 % del anticipo, no el 10 %, y en un contrato de obra adjudicado por licitación el anticipo se maneja en fiducia o patrimonio autónomo, no en una cuenta del contratista (art. 91, Ley 1474).", false], ["B", "una garantía de buen manejo por $585.000.000 y que el anticipo se maneje en una fiducia o patrimonio autónomo irrevocable.", "El anticipo es de $585.000.000 (30 % de $1.950.000.000), dentro del tope del 50 % del parágrafo del artículo 40 de la Ley 80. La garantía de buen manejo y correcta inversión debe ser del 100 % del anticipo (Decreto 1082, art. 2.2.1.2.3.1.10), y en los contratos de obra el contratista debe constituir una fiducia o patrimonio autónomo irrevocable para manejarlo (art. 91, Ley 1474; Decreto 1082, art. 2.2.1.1.2.4.1).", true], ["C", "una garantía de buen manejo por $195.000.000, equivalente al 10 % del contrato, sin necesidad de constituir una fiducia.", "El valor asegurado se calcula sobre el anticipo (100 %), no sobre el valor del contrato, y la fiducia es obligatoria en los contratos de obra que no son de menor o mínima cuantía (art. 91, Ley 1474).", false]]}]}, {"comp": "contratacion", "rol": "tecnico", "tag": "Contratación estatal · Niveles técnico, administrativo y operativo · Perfeccionamiento y requisitos de ejecución", "texto": "Usted es técnico administrativo del grupo de contratación de la Procuraduría General de la Nación. Le asignan llevar el control de dos contratos. El primero es de suministro de elementos de aseo: ayer lo firmaron el ordenador del gasto y el contratista, quien entregó la póliza, pero la garantía aún no ha sido aprobada. El segundo es la compra de un inmueble para el funcionamiento de una procuraduría provincial, cuyo texto ya acordaron las partes. El contratista del suministro llama a preguntar si puede empezar a entregar los elementos hoy mismo.", "items": [{"id": "CE-146", "niv": 3, "e": "El contrato de suministro firmado ayer", "f": "Ley 80 de 1993, art. 41, inc. 1", "o": [["A", "se perfeccionará cuando la Procuraduría apruebe la garantía presentada por el contratista.", "La aprobación de la garantía es requisito para la ejecución (art. 41, inc. 2, Ley 80), no para el perfeccionamiento, que se produce con el acuerdo escrito sobre objeto y contraprestación.", false], ["B", "se perfeccionará con la publicación del contrato en el SECOP II y la firma del acta de inicio por el supervisor.", "El perfeccionamiento depende del acuerdo sobre objeto y contraprestación elevado a escrito (art. 41, inc. 1, Ley 80); la publicación y el acta de inicio son posteriores.", false], ["C", "ya está perfeccionado, porque hay acuerdo sobre el objeto y la contraprestación y consta por escrito.", "El inciso 1 del artículo 41 de la Ley 80 dispone que los contratos del Estado se perfeccionan cuando se logra acuerdo sobre el objeto y la contraprestación y este se eleva a escrito. La aprobación de la garantía es un requisito de ejecución, no de perfeccionamiento.", true]]}, {"id": "CE-147", "niv": 1, "e": "A la pregunta del contratista sobre si puede iniciar hoy las entregas, usted debe responder que", "f": "Ley 80 de 1993, art. 41, inc. 2 (modificado por la Ley 1150 de 2007, art. 23)", "o": [["A", "sí, porque el contrato ya está perfeccionado y la garantía puede aprobarse durante la ejecución.", "Perfeccionamiento y ejecución son momentos distintos; para ejecutar, la garantía debe estar aprobada previamente (art. 41, inc. 2, Ley 80).", false], ["B", "sí, siempre que el supervisor lo autorice por escrito y que la garantía quede aprobada antes de tramitar el primer pago.", "La autorización del supervisor no suple los requisitos legales de ejecución; la garantía debe aprobarse antes de iniciar la ejecución (art. 41, inc. 2, Ley 80).", false], ["C", "aún no, porque la ejecución requiere la garantía aprobada y el registro presupuestal del contrato.", "El inciso 2 del artículo 41 de la Ley 80, modificado por el artículo 23 de la Ley 1150 de 2007, exige para la ejecución la aprobación de la garantía y la existencia de las disponibilidades presupuestales correspondientes; el artículo 2.2.1.1.2.3.1 del Decreto 1082 de 2015 ordena fijar en el cronograma el plazo para el registro presupuestal como requisito de ejecución y pago.", true]]}, {"id": "CE-148", "niv": 2, "e": "La compra del inmueble para la procuraduría provincial", "f": "Ley 80 de 1993, art. 39; Ley 1150 de 2007, art. 2, num. 4, lit. i); Decreto 1082 de 2015, art. 2.2.1.2.1.4.10", "o": [["A", "debe adjudicarse por licitación pública, porque la adquisición de inmuebles no admite contratación directa.", "La adquisición de inmuebles es causal de contratación directa (art. 2, num. 4, lit. i, Ley 1150; Decreto 1082, art. 2.2.1.2.1.4.10).", false], ["B", "debe elevarse a escritura pública, porque implica la transferencia del dominio de un bien inmueble.", "El artículo 39 de la Ley 80 dispone que los contratos estatales constan por escrito y no requieren escritura pública, salvo los que impliquen mutación del dominio o imposición de gravámenes y servidumbres sobre inmuebles. La adquisición de inmuebles se contrata directamente (art. 2, num. 4, lit. i, Ley 1150).", true], ["C", "basta con que conste en un documento privado, porque los contratos estatales no requieren escritura pública.", "La regla del documento escrito tiene una excepción expresa para los contratos que implican mutación del dominio de inmuebles (art. 39, Ley 80).", false]]}]}, {"comp": "contratacion", "rol": "general", "tag": "Contratación estatal · Supervisión e interventoría", "texto": "Un municipio adjudicó por licitación pública la construcción de un centro de salud. Para el seguimiento de la obra, el secretario de Infraestructura propone designar como supervisor a un ingeniero de planta y no contratar interventoría, para ahorrar recursos. Paralelamente, la alcaldía tiene un contrato de suministro de refrigerios para un evento institucional, cuyo seguimiento no exige conocimientos especializados. Usted es profesional de la oficina jurídica y debe conceptuar sobre la vigilancia de ambos contratos.", "items": [{"id": "CE-149", "niv": 1, "e": "Sobre el seguimiento del contrato de suministro de refrigerios, lo adecuado es", "f": "Ley 1474 de 2011, art. 83", "o": [["A", "designar un supervisor de la misma entidad, porque el seguimiento no requiere conocimientos especializados.", "El artículo 83 de la Ley 1474 de 2011 define la supervisión como el seguimiento técnico, administrativo, financiero, contable y jurídico que ejerce la misma entidad cuando no se requieren conocimientos especializados.", true], ["B", "dejar el seguimiento a cargo del contratista mediante informes periódicos de autocontrol que él mismo elabore.", "Las entidades están obligadas a vigilar permanentemente la ejecución a través de un supervisor o un interventor (art. 83, Ley 1474); el contratista no puede vigilarse a sí mismo.", false], ["C", "contratar un interventor externo, porque todo contrato estatal debe vigilarse mediante interventoría.", "La interventoría se contrata cuando el seguimiento supone conocimiento especializado o la complejidad o extensión del contrato lo justifican (art. 83, Ley 1474); no es obligatoria en todo contrato.", false]]}, {"id": "CE-150", "niv": 2, "e": "Frente a la propuesta de no contratar interventoría para la obra del centro de salud, usted debe advertir que", "f": "Ley 80 de 1993, art. 32, num. 1; Ley 1474 de 2011, art. 83, par. 1", "o": [["A", "en la obra adjudicada por licitación, la interventoría debe contratarse con alguien independiente de la entidad y del contratista.", "El numeral 1 del artículo 32 de la Ley 80 dispone que en los contratos de obra celebrados como resultado de una licitación la interventoría debe contratarse con una persona independiente de la entidad contratante y del contratista. El parágrafo 1 del artículo 83 de la Ley 1474 se refiere a esa obligación de contar con interventoría.", true], ["B", "es viable si el ingeniero de planta tiene posgrado en interventoría de obras civiles.", "La exigencia legal es que la interventoría la ejerza una persona independiente de la entidad; un servidor de planta, cualquiera que sea su formación, no lo es (art. 32, num. 1, Ley 80).", false], ["C", "es viable, porque la entidad puede escoger libremente entre supervisión e interventoría en cualquier contrato, según su presupuesto.", "En la obra licitada la ley impone la interventoría externa (art. 32, num. 1, Ley 80); la libertad de escoger no aplica en ese caso.", false]]}, {"id": "CE-151", "niv": 3, "e": "Si la alcaldía contrata la interventoría de la obra, en relación con la supervisión es correcto afirmar que", "f": "Ley 1474 de 2011, art. 83", "o": [["A", "el contrato de interventoría no requiere supervisión, porque el interventor responde directamente ante la contraloría.", "El artículo 83 de la Ley 1474 dispone expresamente que el contrato de interventoría será supervisado directamente por la entidad estatal.", false], ["B", "por regla general no concurren, aunque la entidad puede dividir la vigilancia entre el interventor y un supervisor.", "El artículo 83 de la Ley 1474 dispone que, por regla general, la supervisión y la interventoría no son concurrentes sobre un mismo contrato, pero la entidad puede dividir la vigilancia: el contrato de interventoría indicará las actividades técnicas del interventor y las demás quedarán a cargo del supervisor. Además, el contrato de interventoría es supervisado por la entidad.", true], ["C", "deben concurrir en todos los casos, porque el interventor vigila lo técnico y el supervisor todo lo demás.", "La concurrencia no es la regla sino una posibilidad cuando la entidad decide dividir la vigilancia (art. 83, Ley 1474).", false]]}]}, {"comp": "contratacion", "rol": "profesional", "tag": "Contratación estatal · Niveles profesional, asesor y ejecutivo · Deberes y responsabilidad de supervisores, interventores y ordenadores del gasto", "texto": "Usted es profesional de la oficina de contratación de una gobernación. El interventor de un contrato de obra vial detectó hace dos meses que el contratista estaba usando materiales de menor especificación que la exigida, pero no lo informó; hoy la vía presenta fallas y la gobernación estima perjuicios. Por otra parte, en otro contrato, el secretario de Infraestructura, como ordenador del gasto, recibió oportunamente un informe del supervisor sobre posibles atrasos graves y hasta ahora no ha requerido al contratista ni adoptado ninguna medida.", "items": [{"id": "CE-152", "niv": 2, "e": "Por no haber informado oportunamente el uso de materiales de menor especificación, el interventor", "f": "Ley 1474 de 2011, art. 84, par. 3; Ley 80 de 1993, art. 53 (modificado por la Ley 1882 de 2018, art. 2)", "o": [["A", "no tiene responsabilidad, porque el uso de los materiales es una obligación exclusiva del contratista de obra.", "El interventor tiene el deber de mantener informada a la entidad de los hechos que pongan en riesgo el cumplimiento (art. 84, Ley 1474); su omisión genera responsabilidad propia.", false], ["B", "puede ser sancionado con las multas pactadas en el contrato de interventoría, pero no responde por los perjuicios.", "La ley establece una responsabilidad solidaria por los perjuicios (art. 84, par. 3, Ley 1474), además de la responsabilidad civil, fiscal, penal y disciplinaria de los interventores (art. 53, Ley 80).", false], ["C", "responde solidariamente con el contratista por los perjuicios que le sean imputables.", "El parágrafo 3 del artículo 84 de la Ley 1474 de 2011 dispone que el interventor que no haya informado oportunamente a la entidad un posible incumplimiento del contrato vigilado es solidariamente responsable con el contratista de los perjuicios que se ocasionen, por los daños que le sean imputables.", true]]}, {"id": "CE-153", "niv": 3, "e": "Además, por incumplir el deber de entregar esa información a la entidad, el interventor puede quedar inhabilitado para contratar", "f": "Ley 80 de 1993, art. 8, num. 1, lit. k) (adicionado por la Ley 1474 de 2011, art. 84, par. 2)", "o": [["A", "por un año, contado desde la terminación del contrato de interventoría.", "El término de esta inhabilidad es de cinco años y se cuenta desde la ejecutoria del acto que la declara (art. 8, num. 1, lit. k, Ley 80).", false], ["B", "de forma permanente, desde el momento en que la gobernación detecta la omisión del interventor.", "La inhabilidad es temporal (cinco años) y requiere un acto administrativo ejecutoriado, previa actuación administrativa (art. 8, num. 1, lit. k, Ley 80).", false], ["C", "por cinco años, contados desde la ejecutoria del acto administrativo que así lo declare.", "El literal k) del numeral 1 del artículo 8 de la Ley 80, adicionado por el parágrafo 2 del artículo 84 de la Ley 1474 de 2011, establece la inhabilidad del interventor que incumpla el deber de entregar esa información, por cinco años contados a partir de la ejecutoria del acto que así lo declare, previa actuación administrativa.", true]]}, {"id": "CE-154", "niv": 2, "e": "En cuanto al ordenador del gasto que no ha adoptado medidas frente al informe de atrasos graves, es correcto afirmar que", "f": "Ley 1474 de 2011, art. 84, par. 3, inc. 2", "o": [["A", "si no conmina al contratista ni adopta medidas para proteger los recursos, responde solidariamente por los perjuicios.", "El inciso 2 del parágrafo 3 del artículo 84 de la Ley 1474 dispone que, cuando el ordenador del gasto es informado oportunamente de posibles incumplimientos y no conmina al contratista ni adopta las medidas necesarias, es responsable solidariamente con este de los perjuicios que se ocasionen.", true], ["B", "debe esperar a que el atraso supere la mitad del plazo pactado antes de requerir al contratista.", "La norma no fija ese umbral; exige actuar ante el informe oportuno de posibles incumplimientos para salvaguardar el interés general y los recursos públicos (art. 84, par. 3, Ley 1474).", false], ["C", "no tiene responsabilidad, porque la vigilancia del contrato corresponde de manera exclusiva al supervisor que designó la entidad.", "La ley atribuye responsabilidad solidaria al ordenador del gasto que, informado, no actúa (art. 84, par. 3, inc. 2, Ley 1474).", false]]}]}, {"comp": "contratacion", "rol": "general", "tag": "Contratación estatal · Cláusulas excepcionales: en qué contratos proceden", "texto": "Usted es profesional de la oficina jurídica de una gobernación y revisa las minutas de tres contratos: uno de obra para el mejoramiento de una vía secundaria, en cuyo texto no se incluyeron cláusulas excepcionales; un convenio interadministrativo con un municipio para cofinanciar la construcción de un polideportivo; y un contrato de suministro de raciones alimentarias para el Programa de Alimentación Escolar (PAE) en los colegios del departamento.", "items": [{"id": "CE-155", "niv": 2, "e": "En el contrato de obra en el que no se incluyeron las cláusulas excepcionales, estas", "f": "Ley 80 de 1993, art. 14, num. 2 (modificado por la Ley 2195 de 2022, art. 52)", "o": [["A", "deberán incluirse mediante un otrosí firmado antes del acta de inicio para que produzcan efectos.", "No se requiere otrosí: la ley las entiende pactadas en los contratos de obra aunque no se consignen (art. 14, num. 2, Ley 80).", false], ["B", "se entienden pactadas aunque no se hayan consignado expresamente.", "El numeral 2 del artículo 14 de la Ley 80, modificado por el artículo 52 de la Ley 2195 de 2022, ordena pactar las cláusulas excepcionales en los contratos de obra, entre otros, y dispone que en esos casos se entienden pactadas aun cuando no se consignen expresamente.", true], ["C", "no podrán ejercerse, porque las partes no las incluyeron en el texto del contrato.", "En los contratos de obra las cláusulas excepcionales se entienden incorporadas por ministerio de la ley (art. 14, num. 2, Ley 80).", false]]}, {"id": "CE-156", "niv": 1, "e": "En el convenio interadministrativo con el municipio, las cláusulas excepcionales", "f": "Ley 80 de 1993, art. 14, par.", "o": [["A", "no se utilizan, porque la ley ordena prescindir de ellas en los contratos interadministrativos.", "El parágrafo del artículo 14 de la Ley 80 dispone que en los contratos interadministrativos, entre otros, se prescindirá de la utilización de las cláusulas o estipulaciones excepcionales.", true], ["B", "son obligatorias, porque el convenio destina recursos a la construcción de una obra pública.", "La obligatoriedad para la obra se refiere a los contratos de obra; en los contratos interadministrativos la ley ordena prescindir de las cláusulas excepcionales (art. 14, par., Ley 80).", false], ["C", "pueden pactarse si ambas entidades lo acuerdan expresamente en el texto del convenio que suscriban.", "La ley no deja esta materia a la voluntad de las partes: en los contratos interadministrativos se prescinde de las cláusulas excepcionales (art. 14, par., Ley 80).", false]]}, {"id": "CE-157", "niv": 3, "e": "En el contrato de suministro de raciones del PAE, las cláusulas excepcionales", "f": "Ley 80 de 1993, art. 14, num. 2 (modificado por la Ley 2195 de 2022, art. 52)", "o": [["A", "son facultativas, porque se trata de un contrato de suministro.", "Aunque en el suministro en general las cláusulas son facultativas, la Ley 2195 de 2022 las hizo obligatorias en los contratos relacionados con el PAE (art. 14, num. 2, Ley 80).", false], ["B", "son obligatorias, porque la ley las exige en los contratos relacionados con el PAE.", "Desde la modificación del numeral 2 del artículo 14 de la Ley 80 por el artículo 52 de la Ley 2195 de 2022, los contratos relacionados con el Programa de Alimentación Escolar están entre aquellos en los que se deben pactar las cláusulas excepcionales, y se entienden pactadas aunque no se consignen.", true], ["C", "están prohibidas, porque el contrato se financia con recursos del sector educación transferidos por la Nación.", "La fuente de financiación no está entre los supuestos del parágrafo del artículo 14 de la Ley 80; para el PAE la ley ordena pactarlas.", false]]}]}, {"comp": "contratacion", "rol": "profesional", "tag": "Contratación estatal · Niveles profesional, asesor y ejecutivo · Modificación, interpretación y terminación unilaterales", "texto": "Un municipio ejecuta un contrato de obra de $800.000.000 para construir un parque. Durante la ejecución: (i) para evitar la paralización de la obra, la alcaldía necesita añadir obras de drenaje por $180.000.000 y el contratista no acepta modificar el contrato de común acuerdo; (ii) surge un desacuerdo sobre el sentido de la cláusula de especificaciones de la cubierta que amenaza con paralizar los trabajos, y no ha sido posible llegar a un acuerdo; y (iii) en otro contrato de obra, celebrado con una persona natural, el contratista fallece. Usted es profesional de la oficina jurídica.", "items": [{"id": "CE-158", "niv": 3, "e": "Si la alcaldía modifica unilateralmente el contrato para añadir las obras de drenaje, el contratista", "f": "Ley 80 de 1993, arts. 16 y 40, par.", "o": [["A", "no podrá renunciar, porque la modificación unilateral obliga al contratista sin importar su cuantía.", "El artículo 16 de la Ley 80 reconoce al contratista el derecho a renunciar cuando la modificación altera el valor en 20 % o más del inicial.", false], ["B", "no podrá renunciar, porque ese derecho surge únicamente cuando la modificación supera el 50 % del valor inicial.", "El 50 % es el límite de las adiciones del parágrafo del artículo 40 de la Ley 80; el umbral para la renuncia en la modificación unilateral es el 20 % (art. 16).", false], ["C", "podrá renunciar a continuar la ejecución, porque la modificación altera el valor inicial en un 22,5 %.", "El artículo 16 de la Ley 80 permite al contratista renunciar a continuar la ejecución cuando la modificación unilateral altera el valor del contrato en un 20 % o más del valor inicial: $180.000.000 / $800.000.000 = 22,5 %. En ese evento se ordena la liquidación y la entidad adopta las medidas para terminar el objeto.", true]]}, {"id": "CE-159", "niv": 1, "e": "Frente al desacuerdo sobre la cláusula de especificaciones de la cubierta, la alcaldía puede", "f": "Ley 80 de 1993, arts. 15 y 18", "o": [["A", "suspender el contrato hasta que un juez defina el alcance de la cláusula en un proceso contractual.", "La ley dota a la entidad de la potestad de interpretación unilateral precisamente para evitar la paralización (art. 15, Ley 80); no necesita esperar una decisión judicial.", false], ["B", "interpretar la cláusula mediante acto administrativo motivado.", "El artículo 15 de la Ley 80 permite a la entidad, si no se logra acuerdo y la discrepancia puede conducir a la paralización o afectación grave del servicio, interpretar en acto administrativo debidamente motivado las estipulaciones objeto de la diferencia.", true], ["C", "declarar la caducidad del contrato, porque el desacuerdo puede paralizar la obra.", "La caducidad procede por incumplimiento grave del contratista (art. 18, Ley 80), no por una diferencia de interpretación de buena fe.", false]]}, {"id": "CE-160", "niv": 2, "e": "Ante el fallecimiento del contratista persona natural, la entidad", "f": "Ley 80 de 1993, arts. 17, num. 2 e inc. final y 18", "o": [["A", "dispondrá la terminación unilateral mediante acto motivado, aunque la ejecución puede continuar con el garante.", "El numeral 2 del artículo 17 de la Ley 80 prevé la terminación unilateral por muerte del contratista persona natural, y el mismo artículo permite, en los casos de los numerales 2 y 3, continuar la ejecución con el garante de la obligación.", true], ["B", "debe entregar el contrato a los herederos del contratista para que terminen la obra en las mismas condiciones pactadas.", "La ley no prevé la cesión a los herederos; lo que permite es continuar la ejecución con el garante (art. 17, Ley 80).", false], ["C", "debe declarar la caducidad del contrato, porque la muerte del contratista impide continuar la ejecución.", "La caducidad supone un incumplimiento grave imputable al contratista (art. 18, Ley 80); la muerte es una causal de terminación unilateral (art. 17, num. 2).", false]]}]}, {"comp": "contratacion", "rol": "general", "tag": "Contratación estatal · Multas, cláusula penal y caducidad", "texto": "Usted es profesional de la oficina jurídica de una alcaldía. En un contrato de obra con multas y cláusula penal pactadas, el supervisor informó atrasos reiterados; el contratista terminó entregando la obra a satisfacción con tres meses de retraso y el plazo contractual ya venció. Aun así, el secretario de Infraestructura quiere imponerle ahora multas por el retraso. En otro contrato de obra, el contratista abandonó los trabajos, lo que afecta de manera grave y directa la ejecución y evidencia que puede conducir a su paralización.", "items": [{"id": "CE-161", "niv": 3, "e": "Sobre la intención de imponer multas al contratista que ya entregó la obra y cuyo plazo venció, lo correcto es que", "f": "Ley 1150 de 2007, art. 17", "o": [["A", "procede, porque las multas pactadas pueden imponerse en cualquier momento antes de la liquidación del contrato.", "La ley limita la imposición de multas al tiempo en que está pendiente la ejecución de las obligaciones (art. 17, Ley 1150), no hasta la liquidación.", false], ["B", "procede, siempre que la alcaldía las descuente del saldo a favor del contratista en el acta de liquidación.", "La forma de hacer efectiva la multa (compensación, garantía, cobro coactivo) no suple el requisito de que esté pendiente la ejecución cuando se impone (art. 17, Ley 1150).", false], ["C", "no es posible, porque las multas buscan conminar al cumplimiento y la obligación ya no está pendiente.", "El artículo 17 de la Ley 1150 de 2007 faculta a las entidades para imponer las multas pactadas con el objeto de conminar al contratista a cumplir, previa audiencia del afectado, y dispone expresamente que la decisión «procede sólo mientras se halle pendiente la ejecución de las obligaciones a cargo del contratista». Si ya cumplió, la multa pierde su finalidad conminatoria; la regla está en el texto de la ley, no solo en la jurisprudencia.", true]]}, {"id": "CE-162", "niv": 1, "e": "Para imponer multas o declarar el incumplimiento, la alcaldía debe citar al contratista a audiencia y, contra la decisión que se adopte en ella,", "f": "Ley 1474 de 2011, art. 86", "o": [["A", "proceden los recursos de reposición y apelación, que pueden interponerse dentro de los diez días siguientes.", "El procedimiento del artículo 86 de la Ley 1474 prevé únicamente la reposición, resuelta en la misma audiencia; no contempla la apelación ni un término posterior.", false], ["B", "procede el recurso de reposición, que se interpone, sustenta y decide en la misma audiencia.", "El literal c) del artículo 86 de la Ley 1474 de 2011 dispone que la decisión se adopta mediante resolución motivada que se entiende notificada en la audiencia, y que contra ella solo procede el recurso de reposición, que se interpone, sustenta y decide en la misma audiencia.", true], ["C", "no procede ningún recurso, porque la decisión se entiende notificada en estrados a todos los asistentes.", "Que la decisión se notifique en la audiencia no impide recurrirla: la ley concede el recurso de reposición (art. 86, lit. c, Ley 1474).", false]]}, {"id": "CE-163", "niv": 1, "e": "En el contrato abandonado, si la alcaldía declara la caducidad,", "f": "Ley 80 de 1993, arts. 8, num. 1, lit. c) y 18", "o": [["A", "lo dará por terminado y ordenará liquidarlo, sin indemnización alguna para el contratista.", "El artículo 18 de la Ley 80 dispone que la entidad, mediante acto motivado, da por terminado el contrato y ordena su liquidación en el estado en que se encuentre; no hay lugar a indemnización para el contratista, que queda sujeto a las sanciones e inhabilidades legales, y la declaratoria es constitutiva del siniestro de incumplimiento.", true], ["B", "deberá reconocer al contratista las utilidades dejadas de percibir por la terminación anticipada del contrato.", "La ley excluye cualquier indemnización al contratista cuando se declara la caducidad (art. 18, Ley 80).", false], ["C", "el contrato quedará suspendido hasta que el contratista reanude las obras dentro del plazo que fije la alcaldía.", "La caducidad termina el contrato y ordena su liquidación; no es una suspensión. Si la entidad decide no declararla, adopta medidas de control e intervención (art. 18, Ley 80).", false]]}]}, {"comp": "contratacion", "rol": "profesional", "tag": "Contratación estatal · Niveles profesional, asesor y ejecutivo · Adiciones: límite del 50 % del valor inicial", "texto": "Una gobernación suscribió en 2024 un contrato de obra por $520.000.000. El SMMLV fue de $1.300.000 en 2024 y de $1.423.500 en 2025. En noviembre de 2024 el contrato se adicionó en $130.000.000, y en 2025 se requiere una nueva adición. Por otra parte, la obra se prorrogó y el contrato de interventoría que la vigila debe prorrogarse por el mismo plazo, con el ajuste de valor correspondiente. Usted es profesional de la oficina de contratación y debe calcular los topes siguiendo el criterio de Colombia Compra Eficiente: expresar el valor inicial y cada adición en SMMLV del año respectivo.", "items": [{"id": "CE-164", "niv": 2, "e": "El tope total de adiciones de ese contrato, expresado en SMMLV, es de", "f": "Ley 80 de 1993, art. 40, par.; Colombia Compra Eficiente, concepto C-583 de 2025", "o": [["A", "100 SMMLV.", "Corresponde a lo que ya se adicionó en 2024 ($130.000.000 / $1.300.000), no al tope total.", false], ["B", "200 SMMLV.", "El parágrafo del artículo 40 de la Ley 80 prohíbe adicionar más del 50 % del valor inicial expresado en SMMLV: $520.000.000 / $1.300.000 = 400 SMMLV; el 50 % son 200 SMMLV. Así lo explica Colombia Compra Eficiente (concepto C-583 de 2025).", true], ["C", "400 SMMLV.", "Es el valor inicial completo del contrato expresado en SMMLV; el límite es la mitad de ese valor (art. 40, par., Ley 80).", false]]}, {"id": "CE-165", "niv": 3, "e": "Teniendo en cuenta la adición de noviembre de 2024, el valor máximo de la nueva adición en 2025 es de", "f": "Ley 80 de 1993, art. 40, par.; Colombia Compra Eficiente, concepto C-583 de 2025", "o": [["A", "$130.000.000.", "Resulta de restar en pesos ($260.000.000 − $130.000.000) sin actualizar el saldo al SMMLV de 2025; el límite legal se expresa en salarios mínimos.", false], ["B", "$142.350.000.", "El tope es de 200 SMMLV; la adición de 2024 consumió 100 SMMLV ($130.000.000 / $1.300.000). Quedan 100 SMMLV, que en 2025 equivalen a 100 × $1.423.500 = $142.350.000 (art. 40, par., Ley 80; concepto C-583 de 2025 de Colombia Compra Eficiente).", true], ["C", "$154.700.000.", "Resulta de convertir todo el tope a pesos de 2025 (200 × $1.423.500 = $284.700.000) y restar la adición anterior en pesos de 2024, mezclando valores de años distintos.", false]]}, {"id": "CE-166", "niv": 2, "e": "En cuanto al valor del contrato de interventoría que se prorroga por el mismo plazo de la obra,", "f": "Ley 1474 de 2011, art. 85; Ley 80 de 1993, art. 40, par.", "o": [["A", "está sujeto al mismo límite del 50 % del valor inicial expresado en SMMLV que rige para la obra.", "La ley excluye expresamente la aplicación del parágrafo del artículo 40 de la Ley 80 en este supuesto (art. 85, Ley 1474).", false], ["B", "no puede modificarse, porque la prórroga de la interventoría debe hacerse sin costo adicional para la gobernación.", "El artículo 85 de la Ley 1474 autoriza ajustar el valor de la interventoría prorrogada según sus obligaciones.", false], ["C", "puede ajustarse según las obligaciones de la interventoría, sin que se aplique el límite del 50 % del valor inicial.", "El artículo 85 de la Ley 1474 de 2011 permite prorrogar los contratos de interventoría por el mismo plazo en que se prorrogó el contrato vigilado y ajustar su valor en atención a las obligaciones de la interventoría, sin que resulte aplicable el parágrafo del artículo 40 de la Ley 80.", true]]}]}, {"comp": "contratacion", "rol": "general", "tag": "Contratación estatal · Liquidación: plazos de la Ley 1150", "texto": "Usted es profesional de la oficina jurídica de una alcaldía. El plazo de ejecución de un contrato de obra venció el 30 de abril de 2025. Ni el pliego de condiciones ni el contrato fijaron un término para liquidarlo, y las partes no acordaron uno después. La alcaldía convocó oportunamente al contratista para liquidar el contrato de mutuo acuerdo, pero este no se presentó.", "items": [{"id": "CE-167", "niv": 2, "e": "El término para liquidar el contrato de mutuo acuerdo vencía el", "f": "Ley 1150 de 2007, art. 11, inc. 1", "o": [["A", "30 de agosto de 2025.", "A falta de término en el pliego o acordado por las partes, el artículo 11 de la Ley 1150 fija los cuatro meses siguientes a la expiración del plazo de ejecución, contados como meses calendario: del 30 de abril al 30 de agosto de 2025.", true], ["B", "30 de octubre de 2025.", "Es el vencimiento del término para la liquidación unilateral (cuatro meses más dos), no el de la liquidación de mutuo acuerdo.", false], ["C", "30 de abril de 2026.", "Cuenta un año desde el vencimiento del plazo; la ley fija cuatro meses para la liquidación de mutuo acuerdo cuando no hay término pactado.", false]]}, {"id": "CE-168", "niv": 2, "e": "Como el contratista no se presentó, la alcaldía podía liquidar unilateralmente dentro de un término que vencía el", "f": "Ley 1150 de 2007, art. 11, inc. 2", "o": [["A", "30 de septiembre de 2025.", "Suma un solo mes al vencimiento del término de mutuo acuerdo; la ley concede dos meses para la liquidación unilateral.", false], ["B", "30 de octubre de 2025.", "El inciso 2 del artículo 11 de la Ley 1150 permite liquidar unilateralmente dentro de los dos meses siguientes al vencimiento del término de mutuo acuerdo (30 de agosto de 2025), contados como meses calendario, es decir, hasta el 30 de octubre de 2025.", true], ["C", "30 de diciembre de 2025.", "Suma cuatro meses al término de mutuo acuerdo; el término para la liquidación unilateral es de dos meses.", false]]}, {"id": "CE-169", "niv": 3, "e": "Si vencido el término para liquidar unilateralmente la alcaldía aún no lo ha hecho, el contrato puede liquidarse, de mutuo acuerdo o unilateralmente, a más tardar el", "f": "Ley 1150 de 2007, art. 11, inc. 3; Colombia Compra Eficiente, Guía para la liquidación de los Procesos de Contratación", "o": [["A", "30 de abril de 2027.", "Cuenta los dos años desde el vencimiento del plazo de ejecución; la ley los cuenta desde el vencimiento de los términos anteriores (mutuo acuerdo y unilateral).", false], ["B", "30 de agosto de 2027.", "Cuenta los dos años desde el vencimiento del término de mutuo acuerdo; la ley los cuenta desde el vencimiento del término para liquidar unilateralmente.", false], ["C", "30 de octubre de 2027.", "El inciso 3 del artículo 11 de la Ley 1150 permite liquidar en cualquier tiempo dentro de los dos años siguientes al vencimiento de los términos anteriores, es decir, desde el vencimiento del término para liquidar unilateralmente (30 de octubre de 2025) y no desde el fin del plazo contractual: hasta el 30 de octubre de 2027.", true]]}, {"id": "CE-170", "niv": 3, "e": "Si el contratista se hubiera presentado y firmado el acta de liquidación con salvedades sobre algunos valores, la alcaldía", "f": "Ley 1150 de 2007, art. 11, inc. final", "o": [["A", "podría liquidar unilateralmente los aspectos que no fueron objeto de acuerdo.", "El inciso final del artículo 11 de la Ley 1150 reconoce al contratista el derecho a dejar salvedades en la liquidación de mutuo acuerdo y dispone que, en ese evento, la liquidación unilateral procede en relación con los aspectos que no fueron objeto de acuerdo.", true], ["B", "tendría que rechazar el acta, porque el contratista no puede dejar salvedades en una liquidación de mutuo acuerdo.", "La ley reconoce expresamente el derecho del contratista a efectuar salvedades a la liquidación por mutuo acuerdo (art. 11, inc. final, Ley 1150).", false], ["C", "debería rehacer la liquidación completa de manera unilateral, porque las salvedades anulan el acta bilateral.", "Las salvedades no anulan el acta: lo acordado queda en firme y la liquidación unilateral se limita a lo no acordado (art. 11, Ley 1150).", false]]}]}, {"comp": "contratacion", "rol": "tecnico", "tag": "Contratación estatal · Niveles técnico, administrativo y operativo · SECOP II, publicidad y Plan Anual de Adquisiciones", "texto": "Usted es técnico administrativo del grupo de contratación de la Procuraduría General de la Nación y administra la cuenta de la entidad en el SECOP II. El ordenador del gasto le entrega el Plan Anual de Adquisiciones de la vigencia y le pregunta si, por estar un bien incluido en el Plan, la Procuraduría queda obligada a comprarlo. Ese mismo día le entregan para publicar varios documentos del proceso y actos administrativos expedidos ayer. Además, en la ventanilla de atención, un ciudadano pregunta si una empresa social del Estado de su municipio, que tiene un régimen contractual especial, está obligada a publicar sus contratos en el SECOP II.", "items": [{"id": "CE-171", "niv": 1, "e": "Los documentos y actos administrativos del proceso que le entregaron deben publicarse en el SECOP", "f": "Decreto 1082 de 2015, art. 2.2.1.1.1.7.1", "o": [["A", "el mismo día de su expedición, so pena de nulidad del proceso.", "El reglamento no exige publicar el mismo día ni sanciona con nulidad; fija un término de tres días siguientes a la expedición (Decreto 1082, art. 2.2.1.1.1.7.1).", false], ["B", "dentro de los tres días siguientes a su expedición.", "El artículo 2.2.1.1.1.7.1 del Decreto 1082 de 2015 obliga a publicar en el SECOP los documentos del proceso y los actos administrativos del proceso de contratación dentro de los tres días siguientes a su expedición.", true], ["C", "dentro de los diez días hábiles siguientes a la firma del contrato.", "El término se cuenta desde la expedición de cada documento o acto, y es de tres días (Decreto 1082, art. 2.2.1.1.1.7.1).", false]]}, {"id": "CE-172", "niv": 3, "e": "A la pregunta del ciudadano sobre la empresa social del Estado con régimen especial, la respuesta correcta es que", "f": "Ley 1150 de 2007, art. 13 (incisos adicionados por la Ley 2195 de 2022, art. 53)", "o": [["A", "debe publicar los contratos cuyo valor supere su menor cuantía, y los demás puede reservarlos.", "La norma no distingue por cuantía: se publica la actividad contractual, entendida como los documentos, contratos, actos e información de todas las etapas (art. 13, Ley 1150, adicionado por la Ley 2195 de 2022).", false], ["B", "no está obligada, porque la publicación en el SECOP II cobija a las entidades sometidas a la Ley 80 de 1993.", "Desde la Ley 2195 de 2022 la obligación de publicar en el SECOP II se extiende a las entidades con régimen contractual excepcional (art. 13, Ley 1150).", false], ["C", "sí debe publicar en el SECOP II los documentos de su actividad contractual, aunque tenga régimen especial.", "El artículo 13 de la Ley 1150, con los incisos adicionados por el artículo 53 de la Ley 2195 de 2022, obliga a las entidades con régimen contractual excepcional a publicar en el SECOP II (o la plataforma que haga sus veces) los documentos de su actividad contractual, en las etapas precontractual, contractual y poscontractual.", true]]}, {"id": "CE-173", "niv": 1, "e": "A la pregunta del ordenador del gasto sobre el Plan Anual de Adquisiciones, usted debe responder que el Plan", "f": "Decreto 1082 de 2015, arts. 2.2.1.1.1.4.2 a 2.2.1.1.1.4.4", "o": [["A", "no puede actualizarse durante la vigencia una vez se publica en el SECOP II y en la página web de la entidad.", "El reglamento ordena actualizar el Plan por lo menos una vez durante la vigencia y cuando haya ajustes, inclusiones o exclusiones (Decreto 1082, art. 2.2.1.1.1.4.4).", false], ["B", "obliga a contratar todos los bienes incluidos, salvo que se modifique mediante acto administrativo motivado.", "El Plan es un instrumento de planeación y no genera la obligación de adquirir lo que contiene (Decreto 1082, art. 2.2.1.1.1.4.2).", false], ["C", "no obliga a la Procuraduría a adelantar los procesos de adquisición que en él se enumeran.", "El artículo 2.2.1.1.1.4.2 del Decreto 1082 de 2015 dispone que el Plan Anual de Adquisiciones no obliga a las entidades a efectuar los procesos de adquisición que en él se enumeran.", true]]}]}, {"comp": "contratacion", "rol": "general", "tag": "Contratación estatal · La procuraduría preventiva frente a una licitación", "texto": "Usted es profesional de una procuraduría provincial que, en ejercicio de la función preventiva, hace seguimiento a una licitación pública de obra para construir un centro de salud que adelanta un municipio. Un veedor ciudadano le pide que la procuraduría apruebe el informe de evaluación antes de la adjudicación. Un proponente se queja de que aún no conoce las ofertas económicas de los demás, aunque ya se publicó el informe de evaluación de los requisitos habilitantes y de los factores técnicos. El alcalde, por su parte, pregunta cómo debe hacerse la adjudicación.", "items": [{"id": "CE-174", "niv": 2, "e": "Frente a la solicitud del veedor, usted debe explicar que", "f": "Ley 80 de 1993, art. 25, num. 11; Decreto 1082 de 2015, art. 2.2.1.1.2.2.3", "o": [["A", "no le corresponde aprobarlo, porque la función preventiva no implica coadministrar ni decidir por la entidad.", "La función preventiva permite a la Procuraduría hacer seguimiento al proceso, pero no aprobar sus actos ni sustituir a la entidad: el numeral 11 del artículo 25 de la Ley 80 dispone que los organismos de control y vigilancia no intervienen en los procesos de contratación, y la evaluación de las ofertas corresponde a la entidad y a su comité evaluador (Decreto 1082 de 2015, art. 2.2.1.1.2.2.3).", true], ["B", "la procuraduría puede ordenar al municipio modificar el informe de evaluación si encuentra errores de calificación.", "La evaluación es competencia de la entidad y su comité evaluador (Decreto 1082, art. 2.2.1.1.2.2.3); los organismos de control no intervienen en el proceso (art. 25, num. 11, Ley 80).", false], ["C", "la procuraduría debe aprobar el informe de evaluación para que el municipio pueda adjudicar el contrato.", "Ninguna norma somete el informe de evaluación a aprobación de la Procuraduría; además, la ley excluye la intervención de los organismos de control en los procesos de contratación (art. 25, num. 11, Ley 80).", false]]}, {"id": "CE-175", "niv": 3, "e": "Sobre la queja del proponente acerca de las ofertas económicas, lo correcto es que", "f": "Ley 80 de 1993, art. 30, pars. 2 y 3 (adicionados por la Ley 1882 de 2018, art. 1)", "o": [["A", "el municipio debió abrir los sobres económicos al cierre, junto con los documentos habilitantes y técnicos.", "En la licitación de obra el sobre económico no se abre al cierre: permanece cerrado hasta la audiencia de adjudicación (art. 30, par. 3, Ley 80).", false], ["B", "las ofertas económicas debían publicarse con el informe de requisitos habilitantes para recibir observaciones.", "El informe del primer sobre se refiere a los requisitos habilitantes y a los factores distintos de la oferta económica; esta se conoce en la audiencia de adjudicación (art. 30, pars. 2 y 3, Ley 80).", false], ["C", "en la licitación de obra el sobre con la oferta económica permanece cerrado hasta la audiencia de adjudicación.", "Los parágrafos 2 y 3 del artículo 30 de la Ley 80, adicionados por el artículo 1 de la Ley 1882 de 2018, disponen que en la licitación de obra la oferta se presenta en dos sobres y que el segundo, con la oferta económica, se mantiene cerrado hasta la audiencia de adjudicación, en la que se abre y evalúa.", true]]}, {"id": "CE-176", "niv": 1, "e": "A la pregunta del alcalde, la adjudicación de esta licitación debe hacerse", "f": "Ley 1150 de 2007, art. 9; Decreto 1082 de 2015, art. 2.2.1.2.1.1.2", "o": [["A", "en audiencia pública, mediante resolución motivada que se entiende notificada al adjudicatario en ella.", "El artículo 9 de la Ley 1150 dispone que en los procesos de licitación pública la adjudicación se hace de forma obligatoria en audiencia pública, mediante resolución motivada que se entiende notificada al proponente favorecido en dicha audiencia.", true], ["B", "por resolución motivada que se notifica personalmente al adjudicatario dentro de los cinco días siguientes.", "En la licitación la adjudicación es obligatoriamente en audiencia pública y la resolución se entiende notificada en ella (art. 9, Ley 1150).", false], ["C", "en audiencia pública, cuando la soliciten un organismo de control o la mayoría de los proponentes.", "La audiencia de adjudicación en la licitación es obligatoria, no depende de una solicitud (art. 9, Ley 1150; Decreto 1082, art. 2.2.1.2.1.1.2).", false]]}]}, {"comp": "contratacion", "rol": "general", "tag": "Contratación estatal · Selección abreviada de menor cuantía y declaratoria de desierta", "texto": "Una alcaldía abrió una licitación pública para dotar con equipos biomédicos los puestos de salud rurales, pero ninguno de los proponentes cumplió los requisitos habilitantes, por lo que ninguna oferta podía ser escogida. En otro proceso, de selección abreviada de menor cuantía para el mantenimiento de las sedes educativas, recibió 25 manifestaciones de interés; el pliego previó la posibilidad de sorteo. Usted es profesional de la oficina de contratación y debe orientar al comité.", "items": [{"id": "CE-177", "niv": 2, "e": "Ante la falta de proponentes habilitados en la licitación, la alcaldía", "f": "Ley 80 de 1993, art. 25, num. 18; Ley 1150 de 2007, art. 2, num. 2, lit. d)", "o": [["A", "debe declararla desierta mediante acto motivado y puede iniciar una selección abreviada dentro de los cuatro meses siguientes.", "Como ninguna oferta podía escogerse, se presenta un motivo que impide la escogencia objetiva y la licitación se declara desierta mediante acto motivado (art. 25, num. 18, Ley 80); y el literal d) del numeral 2 del artículo 2 de la Ley 1150 prevé la selección abreviada cuando la licitación se declara desierta, que debe iniciarse dentro de los cuatro meses siguientes.", true], ["B", "debe adjudicar al proponente con mayor puntaje, aunque no cumpla los requisitos habilitantes exigidos en el pliego de condiciones.", "Los requisitos habilitantes condicionan la participación (art. 5, num. 1, Ley 1150); adjudicar a quien no los cumple desconoce la selección objetiva.", false], ["C", "puede contratar directamente con cualquiera de los proponentes, porque la licitación pública fracasó por falta de oferentes hábiles.", "El fracaso de la licitación no es causal de contratación directa (art. 2, num. 4, Ley 1150); la ley prevé la selección abreviada para ese evento.", false]]}, {"id": "CE-178", "niv": 1, "e": "En la selección abreviada de menor cuantía, los interesados debían manifestar su intención de participar en un término", "f": "Decreto 1082 de 2015, art. 2.2.1.2.1.2.20, num. 1", "o": [["A", "no mayor a tres días hábiles contados desde la apertura del proceso.", "El numeral 1 del artículo 2.2.1.2.1.2.20 del Decreto 1082 de 2015 dispone que, en un término no mayor a tres días hábiles contados a partir de la apertura, los interesados deben manifestar su intención de participar.", true], ["B", "no mayor a cinco días hábiles contados desde la apertura del proceso.", "Cinco días hábiles es el término de observaciones al proyecto de pliego en la selección abreviada (Decreto 1082, art. 2.2.1.1.2.1.4), no el de manifestación de interés.", false], ["C", "no mayor a diez días hábiles contados desde la apertura del proceso.", "Diez días hábiles es el término de observaciones al proyecto de pliego en la licitación pública (Decreto 1082, art. 2.2.1.1.2.1.4).", false]]}, {"id": "CE-179", "niv": 2, "e": "Con las 25 manifestaciones de interés recibidas, la alcaldía", "f": "Decreto 1082 de 2015, art. 2.2.1.2.1.2.20, num. 2; Ley 1150 de 2007, art. 2, par. 2, num. 2", "o": [["A", "debe hacer un sorteo para reducir a cinco el número de interesados que pueden presentar oferta.", "El sorteo es facultativo y, si se hace, selecciona máximo diez interesados, no cinco (Decreto 1082, art. 2.2.1.2.1.2.20, num. 2).", false], ["B", "debe adelantar el proceso como licitación pública, porque se superó el número máximo de interesados.", "Recibir muchas manifestaciones de interés no cambia la modalidad; la norma prevé continuar o sortear (Decreto 1082, art. 2.2.1.2.1.2.20).", false], ["C", "puede continuar con todos los interesados o hacer un sorteo para escoger hasta diez de ellos.", "El numeral 2 del artículo 2.2.1.2.1.2.20 del Decreto 1082 de 2015 dispone que, si se reciben más de diez manifestaciones de interés, la entidad puede continuar el proceso o hacer un sorteo para seleccionar máximo diez interesados, según lo previsto en el pliego (art. 2, par. 2, num. 2, Ley 1150).", true]]}]}, {"comp": "anticorrupcion", "rol": "profesional", "tag": "Estatuto Anticorrupción y transparencia · Niveles profesional, asesor y ejecutivo · Inhabilidades para contratar por actos de corrupción", "texto": "Usted es profesional de una procuraduría delegada con funciones preventivas en contratación estatal y revisa los contratos de una gobernación. Encuentra tres situaciones. Primera: el señor R, condenado mediante sentencia ejecutoriada por peculado por apropiación cometido en otro departamento, presentó oferta para un contrato de prestación de servicios con la gobernación. Segunda: la sociedad Obras del Llano S.A.S., cuyo representante legal es el mismo señor R, participa en una licitación de la gobernación. Tercera: durante la ejecución de un contrato de suministro, el socio controlante de la empresa contratista fue condenado, con sentencia ejecutoriada, por cohecho propio, y la empresa anunció que renunciará al contrato.", "items": [{"id": "AC-101", "niv": 1, "e": "Frente a la oferta presentada por el señor R, la gobernación debe tener en cuenta que", "f": "Ley 80 de 1993, art. 8, num. 1, lit. j (modificado por la Ley 2014 de 2019, art. 2)", "o": [["A", "solo está inhabilitado para contratar con la entidad territorial afectada por el peculado, por lo que puede contratar con la gobernación.", "El literal j) del numeral 1 del artículo 8 de la Ley 80 de 1993 no limita la inhabilidad a la entidad perjudicada: impide celebrar contratos con las entidades estatales en general.", false], ["B", "está inhabilitado para contratar con las entidades estatales por su condena por un delito contra la Administración Pública.", "El literal j) del numeral 1 del artículo 8 de la Ley 80 de 1993, modificado por el artículo 2 de la Ley 2014 de 2019, en su texto vigente, inhabilita a las personas naturales declaradas responsables judicialmente por delitos contra la Administración Pública, como el peculado.", true], ["C", "solo estará inhabilitado mientras cumple la pena privativa de la libertad, y después puede contratar sin restricción.", "La inhabilidad del literal j) es una consecuencia autónoma de la condena por delitos contra la Administración Pública y no se limita al tiempo de cumplimiento de la pena.", false]]}, {"id": "AC-102", "niv": 2, "e": "Respecto de la sociedad Obras del Llano S.A.S., es acertado concluir que", "f": "Ley 80 de 1993, art. 8, num. 1, lit. j (modificado por la Ley 2014 de 2019, art. 2)", "o": [["A", "puede participar, porque la persona jurídica es distinta de sus administradores y la condena solo afecta al señor R.", "La ley extiende expresamente la inhabilidad a las sociedades en las que el condenado actúe como representante legal, de modo que la separación de personalidades no permite eludirla.", false], ["B", "puede participar si el señor R le transfiere sus acciones antes del cierre, aunque siga como representante legal.", "La extensión no depende solo de la calidad de socio: también alcanza a las sociedades en que el condenado es representante legal o administrador, por lo que la venta de acciones no resuelve la situación.", false], ["C", "también está inhabilitada, porque la inhabilidad se extiende a las sociedades que el condenado representa legalmente.", "El literal j) del numeral 1 del artículo 8 de la Ley 80 de 1993 dispone que la inhabilidad se extiende a las sociedades de las que hagan parte los condenados en calidad de administradores, representantes legales, miembros de junta directiva o socios controlantes, a sus matrices y a sus subordinadas.", true]]}, {"id": "AC-103", "niv": 3, "e": "Ante la inhabilidad que sobrevino a la empresa contratista del suministro, la gobernación debe", "f": "Ley 80 de 1993, art. 9, par. 1 (adicionado por la Ley 2014 de 2019)", "o": [["A", "aceptar la renuncia al contrato y liquidarlo, reconociendo al contratista lo ejecutado y la utilidad esperada.", "Cuando la inhabilidad sobreviniente es la del literal j), la ley excluye la renuncia del contrato y no reconoce indemnización al contratista inhábil.", false], ["B", "ordenar mediante acto administrativo motivado la cesión unilateral del contrato, sin indemnización para el contratista.", "El parágrafo 1 del artículo 9 de la Ley 80 de 1993, adicionado por la Ley 2014 de 2019, establece que, si la inhabilidad sobreviniente es la del literal j), no procede la renuncia y la entidad ordena por acto motivado la cesión unilateral, sin indemnización alguna; la entidad determina el cesionario.", true], ["C", "suspender el contrato hasta que la sentencia sea revisada por la Corte Suprema y decidir entonces si lo termina.", "La sentencia ya está ejecutoriada, y la ley prevé una consecuencia inmediata y específica, la cesión unilateral; no prevé suspender el contrato a la espera de una eventual revisión.", false]]}]}, {"comp": "anticorrupcion", "rol": "general", "tag": "Estatuto Anticorrupción y transparencia · Prohibiciones e inhabilidades para exservidores", "texto": "Laura fue secretaria de planeación de un municipio, cargo del nivel directivo, hasta el 31 de enero de 2026. En febrero se vinculó como consultora a una firma privada de urbanismo. En septiembre de 2026, la firma le propone tres encargos: asesorar a un constructor en el trámite de una licencia ante la misma secretaría de planeación; representar a otro constructor en un proceso sancionatorio urbanístico que ella conoció y en el que firmó el auto de apertura cuando era secretaria; y elaborar la oferta de la firma para un contrato de consultoría en ordenamiento territorial con la alcaldía de ese municipio. Laura consulta en la personería qué puede hacer.", "items": [{"id": "AC-104", "niv": 2, "e": "Sobre la asesoría al constructor en el trámite de la licencia, la personería le indica a Laura que", "f": "Ley 1952 de 2019, art. 56, num. 4", "o": [["A", "no debe prestarla: en el año siguiente al retiro no puede asesorar ante la misma entidad en asuntos propios de su cargo.", "El numeral 4 del artículo 56 de la Ley 1952 de 2019 sanciona como falta gravísima prestar, a título personal o por interpuesta persona, servicios de asistencia, representación o asesoría en asuntos relacionados con las funciones propias del cargo, hasta por el término de un año después de la dejación del cargo, con respecto de la entidad en la que se prestaron los servicios. Han pasado ocho meses desde el retiro de Laura, de modo que está dentro del término.", true], ["B", "puede prestarla siempre que el constructor no tenga contratos vigentes con el municipio.", "La prohibición se refiere a asuntos relacionados con las funciones propias del cargo, como una licencia urbanística ante la secretaría que dirigía, y no depende de que el particular tenga contratos con el municipio.", false], ["C", "puede prestarla, porque ya no es servidora pública y el régimen disciplinario dejó de aplicársele desde el día en que se retiró del cargo.", "El régimen disciplinario contempla prohibiciones que siguen aplicando al exservidor durante un tiempo después del retiro, precisamente para evitar el uso indebido de su posición anterior.", false]]}, {"id": "AC-105", "niv": 3, "e": "En cuanto al proceso sancionatorio en el que Laura firmó el auto de apertura, ella", "f": "Ley 1952 de 2019, art. 56, num. 4", "o": [["A", "puede representarlo desde ya, si se declara impedida ante la secretaría de planeación y renuncia a cobrar honorarios.", "Los impedimentos son una figura para quien ejerce funciones públicas; la gratuidad de la gestión tampoco elimina la prohibición, que recae sobre la representación misma en ese asunto concreto.", false], ["B", "no puede representarlo en ningún momento, por tratarse de un asunto concreto que conoció como secretaria.", "El numeral 4 del artículo 56 de la Ley 1952 de 2019 dispone que la incompatibilidad es indefinida en el tiempo respecto de los asuntos concretos que el servidor conoció en ejercicio de sus funciones, entendidos como los de carácter particular que fueron objeto de decisión y tienen sujetos claramente determinados.", true], ["C", "podrá representar al constructor una vez cumplido el primer año desde su retiro.", "El término de un año se aplica a los asuntos relacionados con las funciones del cargo en general; para el asunto concreto que conoció como servidora, la prohibición no tiene límite temporal.", false]]}, {"id": "AC-106", "niv": 3, "e": "Respecto de la oferta de la firma para el contrato de consultoría con la alcaldía, es acertado afirmar que", "f": "Ley 80 de 1993, art. 8, num. 2, lit. f (adicionado por la Ley 1474 de 2011, art. 4)", "o": [["A", "la firma puede presentar la oferta si Laura no la firma ni participa en la ejecución del contrato.", "La inhabilidad se configura por el vínculo de Laura con la sociedad y la relación del objeto con su sector, no porque ella suscriba la oferta o ejecute el contrato.", false], ["B", "la firma puede presentar la oferta, pues la inhabilidad de los exdirectivos solo cobija a Laura como persona natural y no a la sociedad que la vinculó como consultora.", "La norma extiende expresamente la inhabilidad a las sociedades de las que el exdirectivo haga parte o a las que esté vinculado a cualquier título.", false], ["C", "la firma no puede contratar con esa alcaldía en los dos años siguientes al retiro de Laura, pues ella fue directiva y el objeto es de su sector.", "El literal f) del numeral 2 del artículo 8 de la Ley 80 de 1993, adicionado por el artículo 4 de la Ley 1474 de 2011, impide contratar con la entidad respectiva a quienes ejercieron cargos del nivel directivo, y a las sociedades de las que hagan parte o a las que estén vinculados a cualquier título, durante los dos años siguientes al retiro, cuando el objeto que desarrollen tenga relación con el sector al cual prestaron sus servicios.", true]]}]}, {"comp": "anticorrupcion", "rol": "general", "tag": "Estatuto Anticorrupción y transparencia · Deber de denunciar actos de corrupción", "texto": "Tomás es técnico administrativo de la secretaría de hacienda de un municipio. Al conciliar las cuentas del impuesto predial, descubre que un compañero ha hecho varias transferencias de recursos públicos a una cuenta personal y conserva los soportes. Cuando le cuenta a su jefe inmediato, este le sugiere \"no meterse en problemas\" y olvidar el asunto. Días después, un contribuyente que también notó irregularidades en sus recibos pregunta en la ventanilla cómo puede denunciar posibles actos de corrupción de funcionarios de la alcaldía sin tener que desplazarse.", "items": [{"id": "AC-107", "niv": 1, "e": "Frente a lo que descubrió, Tomás", "f": "Ley 1952 de 2019, art. 38, num. 25", "o": [["A", "cumple su deber al informar a su jefe inmediato, quien es el único que decide si se presenta una denuncia.", "El deber de denunciar es personal de cada servidor; informar al superior no lo agota, y la sugerencia de no actuar no lo exime.", false], ["B", "debe denunciar los hechos ante las autoridades competentes, aunque su jefe le haya sugerido lo contrario.", "El numeral 25 del artículo 38 de la Ley 1952 de 2019 establece como deber de todo servidor público denunciar los delitos, contravenciones y faltas disciplinarias de los que tenga conocimiento, salvo las excepciones de ley.", true], ["C", "puede abstenerse de actuar mientras no tenga la certeza plena de que se cometió un delito.", "La ley no exige certeza plena para denunciar; establecer la responsabilidad corresponde a las autoridades que investigan.", false]]}, {"id": "AC-108", "niv": 1, "e": "Al contribuyente se le debe informar que la alcaldía", "f": "Ley 1474 de 2011, art. 76", "o": [["A", "no tramita denuncias de corrupción, porque estas solo pueden presentarse ante la Fiscalía.", "Las entidades públicas deben recibir y tramitar quejas, sugerencias y reclamos, y disponer de un espacio para denuncias de corrupción, sin perjuicio de la competencia de la Fiscalía y de los órganos de control.", false], ["B", "solo recibe denuncias por corrupción presentadas personalmente y por escrito ante el despacho del alcalde o del secretario de gobierno.", "La ley exige que la entidad facilite la presentación de denuncias por su página web, sin limitarla a la presentación personal ante el alcalde.", false], ["C", "debe tener en su página web principal un espacio para denunciar actos de corrupción de sus funcionarios.", "El artículo 76 de la Ley 1474 de 2011 ordena que todas las entidades públicas cuenten con un espacio en su página web principal para que los ciudadanos presenten quejas y denuncias de los actos de corrupción realizados por funcionarios de la entidad.", true]]}, {"id": "AC-109", "niv": 3, "e": "Si Tomás decidiera no denunciar las transferencias que conoció en razón de su cargo, esa omisión", "f": "Ley 1952 de 2019, art. 61, num. 3", "o": [["A", "podría constituir falta gravísima, porque la ley sanciona omitir la denuncia de delitos dolosos conocidos en razón del cargo.", "El numeral 3 del artículo 61 de la Ley 1952 de 2019 establece como falta gravísima omitir o retardar la denuncia de faltas gravísimas o delitos dolosos, preterintencionales o culposos investigables de oficio de que se tenga conocimiento en razón del cargo o función.", true], ["B", "solo podría calificarse como falta leve, porque no fue él quien se apropió de los recursos.", "La ley califica como gravísima la omisión de denunciar delitos dolosos conocidos en razón del cargo; no la reduce a falta leve por el hecho de no haber participado en la apropiación.", false], ["C", "no tendría consecuencias disciplinarias, porque denunciar es una facultad de los ciudadanos y no un deber del servidor.", "Para el servidor público, denunciar es un deber expreso (art. 38 num. 25 de la Ley 1952 de 2019), y su omisión puede acarrear responsabilidad disciplinaria.", false]]}]}, {"comp": "anticorrupcion", "rol": "general", "tag": "Estatuto Anticorrupción y transparencia · Supervisión e interventoría de contratos", "texto": "Una alcaldía celebró dos contratos. El primero es de suministro de papelería por valor moderado. El segundo es de obra para construir un puente vehicular, cuyo seguimiento exige conocimientos especializados en ingeniería estructural. La secretaria general debe decidir cómo se hará la vigilancia de cada contrato y si, para el puente, la entidad puede encargar a un interventor externo las actividades técnicas y dejar en cabeza de un servidor de planta el seguimiento administrativo y financiero. El supervisor de la papelería, por su parte, nota retrasos en las entregas y se pregunta qué puede hacer.", "items": [{"id": "AC-110", "niv": 1, "e": "La vigilancia del contrato de obra del puente puede contratarse con un interventor externo porque", "f": "Ley 1474 de 2011, art. 83", "o": [["A", "el seguimiento del contrato requiere conocimiento especializado en la materia.", "El artículo 83 de la Ley 1474 de 2011 define la interventoría como el seguimiento técnico que realiza una persona natural o jurídica contratada para tal fin, cuando el seguimiento del contrato suponga conocimiento especializado en la materia o cuando la complejidad o la extensión del mismo lo justifiquen.", true], ["B", "la ley prohíbe que los servidores públicos supervisen contratos de obra, cualquiera que sea su valor.", "La ley no prohíbe la supervisión de contratos de obra por servidores públicos; la interventoría se justifica cuando el seguimiento requiere conocimiento especializado o la complejidad o extensión del contrato lo amerita.", false], ["C", "la ley reserva la supervisión a los contratos de bienes y servicios, de modo que las obras requieren interventor.", "La supervisión es la regla cuando no se requieren conocimientos especializados, y la ejerce la propia entidad; la interventoría procede en los supuestos que la ley señala.", false]]}, {"id": "AC-111", "niv": 3, "e": "Sobre la posibilidad de combinar interventoría y supervisión en el contrato del puente, es correcto afirmar que", "f": "Ley 1474 de 2011, art. 83", "o": [["A", "es obligatoria, porque todo contrato de obra debe tener simultáneamente un supervisor y un interventor con las mismas funciones.", "La ley no impone la concurrencia de supervisor e interventor con las mismas funciones; la regla general es la contraria, salvo que la entidad divida la vigilancia.", false], ["B", "está prohibida, porque la ley impide que supervisor e interventor vigilen un mismo contrato, aunque sea en aspectos distintos.", "La no concurrencia es la regla general, pero la misma norma permite dividir la vigilancia del contrato principal entre interventor y supervisor.", false], ["C", "es posible, porque la entidad puede dividir la vigilancia: el interventor asume las actividades técnicas y la entidad las demás, por medio del supervisor.", "El artículo 83 de la Ley 1474 de 2011 establece que, por regla general, la supervisión y la interventoría no concurren en un mismo contrato, pero la entidad puede dividir la vigilancia: en el contrato de interventoría se indican las actividades técnicas a cargo del interventor, y las demás quedan a cargo de la entidad a través del supervisor.", true]]}, {"id": "AC-112", "niv": 1, "e": "Ante los retrasos en las entregas de papelería, el supervisor", "f": "Ley 1474 de 2011, art. 84", "o": [["A", "debe esperar a la liquidación del contrato para dejar constancia de los incumplimientos en el acta final, y solo entonces informar a la entidad.", "La ley exige informar oportunamente los hechos que puedan poner en riesgo el cumplimiento, no esperar a la liquidación.", false], ["B", "puede pedir al contratista informes y explicaciones, y debe informar a la entidad los hechos que pongan en riesgo el cumplimiento.", "El artículo 84 de la Ley 1474 de 2011 faculta a supervisores e interventores para solicitar informes, aclaraciones y explicaciones sobre la ejecución, y les impone el deber de mantener informada a la entidad de los hechos que puedan constituir actos de corrupción o que pongan o puedan poner en riesgo el cumplimiento del contrato.", true], ["C", "solo puede comunicarse con el contratista a través de la oficina jurídica de la entidad.", "La ley faculta al supervisor para solicitar directamente al contratista informes, aclaraciones y explicaciones sobre el desarrollo de la ejecución.", false]]}]}, {"comp": "anticorrupcion", "rol": "profesional", "tag": "Estatuto Anticorrupción y transparencia · Niveles profesional, asesor y ejecutivo · Responsabilidad de los interventores", "texto": "Usted es profesional de una procuraduría provincial y hace seguimiento preventivo a un contrato de obra de un municipio para pavimentar vías rurales, cuyo valor supera la menor cuantía de la entidad. La firma interventora sabía desde hacía tres meses que el contratista estaba usando materiales de menor especificación que la pactada, pero no informó a la alcaldía. Hoy la obra presenta fallas que causan perjuicios al municipio. La alcaldía adelantó, con el debido proceso, la actuación administrativa correspondiente y declaró mediante acto administrativo, ya ejecutoriado, que la firma interventora incumplió su deber de informar.", "items": [{"id": "AC-113", "niv": 3, "e": "Por los perjuicios derivados del incumplimiento que no informó oportunamente, la firma interventora", "f": "Ley 1474 de 2011, art. 84, par. 3", "o": [["A", "responde solo si se demuestra que recibió dinero del contratista para ocultar el incumplimiento.", "La responsabilidad solidaria nace de no informar oportunamente; no exige probar un soborno, que daría lugar además a responsabilidad penal.", false], ["B", "responde solidariamente con el contratista por los perjuicios que le sean imputables.", "El parágrafo 3 del artículo 84 de la Ley 1474 de 2011 dispone que el interventor que no haya informado oportunamente a la entidad de un posible incumplimiento del contrato vigilado será solidariamente responsable con el contratista por los perjuicios que se ocasionen, en lo que le sea imputable.", true], ["C", "no responde, porque la obligación de ejecutar correctamente la obra recae en el contratista.", "La ley hace responsable al interventor que no informó oportunamente un posible incumplimiento, junto con el contratista, por los perjuicios que le sean imputables.", false]]}, {"id": "AC-114", "niv": 2, "e": "Como consecuencia del acto administrativo ejecutoriado que declaró el incumplimiento de su deber de informar, la firma interventora", "f": "Ley 80 de 1993, art. 8, num. 1, lit. k (Ley 1474 de 2011, art. 84)", "o": [["A", "queda inhabilitada para contratar solo con ese municipio hasta que se liquide el contrato de obra.", "La inhabilidad que prevé la ley no se limita al municipio ni a la liquidación del contrato; tiene un término legal fijo para contratar con el Estado.", false], ["B", "no queda inhabilitada, porque las inhabilidades solo surgen de sentencias penales y no de actos administrativos.", "Esta inhabilidad surge precisamente de un acto administrativo ejecutoriado expedido después de la actuación administrativa correspondiente.", false], ["C", "queda inhabilitada para contratar con el Estado por cinco años, contados desde la ejecutoria de ese acto.", "El literal k) del numeral 1 del artículo 8 de la Ley 80 de 1993, incorporado por el artículo 84 de la Ley 1474 de 2011, inhabilita por cinco años al interventor que incumpla el deber de entregar a la entidad información sobre el incumplimiento del contrato o sobre hechos que lo pongan en riesgo. El término se cuenta desde la ejecutoria del acto que así lo declare, previa la actuación administrativa correspondiente.", true]]}, {"id": "AC-115", "niv": 2, "e": "Antes de contratar una obra de este tipo, cuyo valor supera la menor cuantía, la entidad debía", "f": "Ley 1474 de 2011, art. 83, par. 1", "o": [["A", "pronunciarse en los estudios previos sobre la necesidad de contar con interventoría.", "El parágrafo 1 del artículo 83 de la Ley 1474 de 2011 dispone que en los estudios previos de los contratos de obra cuyo valor supere la menor cuantía de la entidad, cualquiera que sea la modalidad de selección, se debe hacer pronunciamiento sobre la necesidad de contar con interventoría. Ese es el deber general para estas obras; si además el contrato se adjudica por licitación pública, la interventoría es obligatoria (art. 32, num. 1, par. 1, de la Ley 80 de 1993).", true], ["B", "contratar la interventoría siempre por licitación pública, sin importar su valor.", "La ley no impone la licitación como modalidad única para la interventoría; lo que exige es que los estudios previos de la obra se pronuncien sobre su necesidad.", false], ["C", "designar como supervisor a un servidor del nivel directivo, porque la ley lo exige para obras de mayor cuantía.", "La ley no exige que el supervisor sea del nivel directivo; para estas obras, lo que exige es que los estudios previos se pronuncien sobre la interventoría.", false]]}]}, {"comp": "anticorrupcion", "rol": "general", "tag": "Estatuto Anticorrupción y transparencia · Programas de Transparencia y Ética Pública", "texto": "Un equipo de una procuraduría delegada con funciones preventivas visita una empresa industrial y comercial del Estado del orden municipal dedicada a la promoción turística, que contrata con normas de derecho privado. El gerente sostiene que la entidad no está obligada a adoptar un Programa de Transparencia y Ética Pública, porque no aplica el Estatuto General de Contratación y porque, según él, esa obligación es solo para los ministerios y demás entidades nacionales. El jefe de planeación, por su parte, presenta un borrador del programa y pregunta qué contenidos debe incluir y quién fija los estándares mínimos que debe cumplir.", "items": [{"id": "AC-116", "niv": 2, "e": "Frente a la posición del gerente, el equipo de la procuraduría le explica que la empresa", "f": "Ley 1474 de 2011, art. 73 (modificado por la Ley 2195 de 2022, art. 31)", "o": [["A", "no está obligada, porque los programas de transparencia solo se exigen a las entidades que contratan con el Estatuto General, la Ley 80 de 1993.", "La norma incluye expresamente a las entidades cualquiera que sea su régimen de contratación, de modo que contratar con derecho privado no la excluye.", false], ["B", "sí debe implementarlo, porque la obligación cobija a entidades de todos los órdenes, cualquiera que sea su régimen de contratación.", "El artículo 73 de la Ley 1474 de 2011, modificado por el artículo 31 de la Ley 2195 de 2022, ordena que cada entidad del orden nacional, departamental y municipal, cualquiera que sea su régimen de contratación, implemente Programas de Transparencia y Ética Pública.", true], ["C", "solo debe adoptarlo si el concejo municipal se lo ordena mediante acuerdo, porque es una entidad descentralizada.", "La obligación surge directamente de la ley para las entidades de todos los órdenes; no depende de un acuerdo del concejo.", false]]}, {"id": "AC-117", "niv": 2, "e": "Entre los contenidos que el programa debe incluir según la ley se encuentran", "f": "Ley 1474 de 2011, art. 73 (modificado por la Ley 2195 de 2022, art. 31)", "o": [["A", "las medidas de debida diligencia y los canales de denuncia previstos en la ley.", "El artículo 73 de la Ley 1474 de 2011, modificado por la Ley 2195 de 2022, incluye entre los contenidos del programa las medidas de debida diligencia en las entidades del sector público, los canales de denuncia conforme al artículo 76 de esa ley y las estrategias de transparencia, Estado abierto, acceso a la información pública y cultura de legalidad, entre otros.", true], ["B", "un régimen especial de inhabilidades para sus contratistas, distinto del previsto en las leyes.", "Las inhabilidades son de reserva legal; una entidad no puede crear un régimen propio de inhabilidades mediante su programa de transparencia.", false], ["C", "la definición de faltas disciplinarias y sanciones propias para los servidores de la empresa.", "Las faltas y sanciones disciplinarias están definidas en la ley disciplinaria, no en el programa de la entidad; el programa contiene medidas de prevención y gestión del riesgo de corrupción.", false]]}, {"id": "AC-118", "niv": 3, "e": "Sobre los estándares mínimos del programa, el jefe de planeación debe saber que", "f": "Ley 1474 de 2011, art. 73
