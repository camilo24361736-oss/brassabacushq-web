oraciones cortas y palabras sencillas.", false]]}, {"id": "DO-121", "niv": 2, "e": "En cuanto al orden de la respuesta, lo más adecuado es", "f": "DNP, Guía de lenguaje claro (2015); Función Pública, técnica n.º 1 de lenguaje claro", "o": [["A", "mantener al principio la transcripción de las normas que fijan la competencia de la procuraduría y de la personería.", "Empezar con transcripciones normativas aplaza la información que la ciudadana necesita; la guía del DNP recomienda pensar en el lector y priorizar lo que le interesa.", false], ["B", "empezar por lo que más le interesa a la ciudadana: qué se hizo con su queja y ante quién continúa el trámite.", "La Guía de lenguaje claro del DNP recomienda conocer al lector antes de escribir y organizar el texto según su propósito; la técnica de lenguaje claro de Función Pública indica poner al comienzo la información que interesa a más lectores.", true], ["C", "dejar la decisión para el final, para respetar el orden cronológico del trámite.", "El orden cronológico del trámite no es el criterio de una comunicación clara; lo importante para la lectora debe ir al comienzo, según las recomendaciones de lenguaje claro del DNP y de Función Pública.", false]]}]}, {"comp": "documentos_oficina", "rol": "general", "tag": "Elaboración de documentos de oficina · Ortografía: mayúsculas, siglas y tildes", "texto": "Usted es auxiliar de la secretaría de una procuraduría provincial y corrige un informe breve antes de enviarlo. En el borrador se lee: «El Procurador Provincial remitió el documento a la secretaría general»; más adelante: «Se realizó una reunión con las ONGs de la región»; y en un cuadro aparece el título «OFICINA JURIDICA», escrito sin tilde porque, según el autor, «las mayúsculas no se tildan». La entidad sigue las normas ortográficas de la Real Academia Española.", "items": [{"id": "DO-122", "niv": 3, "e": "La primera frase, corregida según la ortografía académica, queda así", "f": "RAE, Ortografía, mayúsculas en cargos y en nombres de entidades (ver notas-do.md)", "o": [["A", "«El procurador provincial remitió el documento a la Secretaría General», con el cargo en minúscula y la dependencia con mayúsculas iniciales.", "La Real Academia Española recomienda escribir con minúscula los sustantivos que designan cargos, incluso en textos administrativos, y con mayúscula inicial las palabras significativas del nombre de dependencias y organismos, como Secretaría General.", true], ["B", "«El Procurador Provincial remitió el documento a la Secretaría General», porque en los documentos oficiales todo va con mayúscula.", "La RAE recomienda la minúscula para los cargos aun en documentos oficiales o administrativos; la mayúscula corresponde a los nombres de las dependencias.", false], ["C", "«El Procurador Provincial remitió el documento a la secretaría general», con la dependencia en minúscula.", "La frase invierte la regla: los cargos se escriben con minúscula y los nombres de las dependencias, con mayúscula inicial en sus palabras significativas (RAE).", false]]}, {"id": "DO-123", "niv": 2, "e": "La forma correcta de escribir el plural de la sigla en la segunda frase es", "f": "RAE, plural de las siglas (ver notas-do.md)", "o": [["A", "«las O.N.G.», con puntos entre las letras de la sigla para indicar que es una abreviación.", "Las siglas se escriben sin puntos entre sus letras, según la RAE.", false], ["B", "«las ONGs», con s final para marcar el plural.", "La RAE señala que las siglas son invariables en la escritura; el plural se marca con el artículo o los determinantes, no con una s añadida.", false], ["C", "«las ONG», sin marca de plural en la sigla.", "La Real Academia Española indica que las siglas son invariables en la escritura y que su plural se manifiesta en las palabras que las acompañan, como el artículo: «las ONG».", true]]}, {"id": "DO-124", "niv": 2, "e": "Sobre el título del cuadro, lo correcto es escribir", "f": "RAE, tilde en las mayúsculas (ver notas-do.md)", "o": [["A", "«OFICINA JURIDICA», sin tilde, porque las mayúsculas no se acentúan.", "La RAE señala que el uso de mayúsculas no exime de poner la tilde cuando la palabra la lleva según las reglas de acentuación.", false], ["B", "«OFICINA JURÍDICA», con tilde, porque las mayúsculas se tildan como las minúsculas.", "La Real Academia Española establece que las letras mayúsculas llevan tilde si les corresponde según las reglas de acentuación; solo las siglas escritas en mayúscula no se tildan.", true], ["C", "cualquiera de las dos formas, porque la tilde en mayúsculas es opcional.", "La tilde en mayúsculas no es opcional: es obligatoria cuando la palabra la requiere, según la RAE.", false]]}]}, {"comp": "documentos_oficina", "rol": "tecnico", "tag": "Elaboración de documentos de oficina · Niveles técnico, administrativo y operativo · Puntuación: vocativo, despedida y dos puntos", "texto": "Usted es técnico de la ventanilla de una procuraduría provincial y revisa la puntuación de una respuesta dirigida a una ciudadana. El borrador contiene estas frases: «Le informo señora Gómez que su solicitud fue radicada»; «Para el trámite debe presentar: la cédula y el formulario diligenciado»; y, como cierre, dos posibles despedidas que el redactor no sabe cómo puntuar: «Atentamente» y «Reciba un cordial saludo». La entidad sigue las normas ortográficas de la Real Academia Española.", "items": [{"id": "DO-125", "niv": 1, "e": "La primera frase, bien puntuada, es", "f": "RAE, Ortografía básica, la coma: vocativos (ver notas-do.md)", "o": [["A", "«Le informo, señora Gómez, que su solicitud fue radicada», con el vocativo entre comas.", "Según la RAE, el vocativo se separa con coma del resto del enunciado; cuando va en medio, se escribe entre comas.", true], ["B", "«Le informo: señora Gómez que su solicitud fue radicada», con dos puntos tras el verbo.", "Los dos puntos no aíslan el vocativo y además separan indebidamente el verbo de su complemento; el vocativo intercalado va entre comas (RAE).", false], ["C", "«Le informo señora Gómez, que su solicitud fue radicada», con una sola coma tras el vocativo.", "El vocativo «señora Gómez» queda abierto por un lado: al ir en medio del enunciado, debe ir entre dos comas (RAE).", false]]}, {"id": "DO-126", "niv": 3, "e": "Las despedidas deben puntuarse así", "f": "RAE, Libro de estilo de la lengua española, puntuación de despedidas (ver notas-do.md)", "o": [["A", "«Atentamente:» con dos puntos y «Reciba un cordial saludo.» con punto.", "Los dos puntos corresponden al saludo inicial, no a la despedida; tras una fórmula sin verbo como «Atentamente» va coma (RAE, Libro de estilo).", false], ["B", "«Atentamente,» con coma, y «Reciba un cordial saludo.» con punto, porque esta es una oración completa.", "El Libro de estilo de la RAE indica que las despedidas sin verbo, como «Atentamente», van seguidas de coma, mientras que las que forman una oración completa, como «Reciba un cordial saludo», se cierran con punto.", true], ["C", "«Atentamente» y «Reciba un cordial saludo», ambas sin ningún signo de cierre.", "Las despedidas llevan puntuación: coma tras la fórmula sin verbo y punto tras la oración completa (RAE, Libro de estilo).", false]]}, {"id": "DO-127", "niv": 3, "e": "La segunda frase, bien puntuada, es", "f": "RAE, Ortografía básica, los dos puntos (ver notas-do.md)", "o": [["A", "«Para el trámite debe presentar: la cédula y el formulario diligenciado», con dos puntos tras el verbo.", "Los dos puntos separan indebidamente el verbo «presentar» de su complemento; la RAE desaconseja ese uso cuando no hay un elemento que anticipe la enumeración.", false], ["B", "«Para el trámite, debe presentar: la cédula, y el formulario diligenciado», con coma tras «trámite», dos puntos tras el verbo y coma antes de «y».", "Además de separar el verbo de su complemento con dos puntos, la frase introduce una coma ante la conjunción «y» en una enumeración simple, lo que la RAE no admite en ese caso.", false], ["C", "«Para el trámite debe presentar la cédula y el formulario diligenciado», sin signo entre el verbo y su complemento.", "La RAE indica que no se escriben dos puntos entre el verbo y su complemento cuando no hay un elemento anticipador; «la cédula y el formulario» es el complemento directo de «presentar».", true]]}]}, {"comp": "documentos_oficina", "rol": "profesional", "tag": "Elaboración de documentos de oficina · Niveles profesional, asesor y ejecutivo · El informe y la redacción concisa", "texto": "Usted es profesional de una procuraduría provincial y prepara el documento con el que se presentarán al procurador regional los resultados de las visitas de vigilancia realizadas durante el semestre. Un compañero le entrega un borrador que empieza con tres páginas sobre la historia de la sede, deja las conclusiones para un anexo y usa frases como «Se procedió a la realización de la revisión de la totalidad de los expedientes existentes». El procurador regional pidió un documento que pueda leer rápido y que le permita tomar decisiones.", "items": [{"id": "DO-128", "niv": 2, "e": "El tipo documental adecuado para presentar esos resultados es", "f": "UIS, Guía GGD.10 (basada en la GTC 185), definiciones (ver notas-do.md)", "o": [["A", "un informe, porque da a conocer datos precisos sobre el estado y los resultados de una actividad.", "La guía de comunicaciones de la UIS, basada en la GTC 185, define el informe como el documento que describe o da a conocer datos precisos sobre el estado de una actividad, estudio o proyecto, para conocer resultados de procesos administrativos.", true], ["B", "una constancia, porque deja registro de las actividades del semestre.", "La constancia es un documento probatorio que acredita hechos; no es el medio para exponer y analizar resultados de un periodo.", false], ["C", "una circular, porque se dirige a una autoridad de la misma entidad.", "La circular comunica un mismo contenido a un grupo de destinatarios; no es el documento para presentar resultados a un superior.", false]]}, {"id": "DO-129", "niv": 2, "e": "Para atender lo que pidió el procurador regional, la estructura del documento debe", "f": "DNP, Guía de lenguaje claro (2015); Función Pública, técnica n.º 1 de lenguaje claro", "o": [["A", "comenzar con la historia de la sede para dar contexto completo antes de cualquier dato.", "Tres páginas de antecedentes aplazan la información que el lector necesita para decidir; el lenguaje claro recomienda priorizar lo que le interesa al destinatario.", false], ["B", "presentar al comienzo los resultados y conclusiones principales, y luego el detalle que los sustenta.", "Las recomendaciones de lenguaje claro del DNP y de Función Pública indican organizar el texto según el propósito y el lector, y ubicar al comienzo la información que más le interesa a quien lee.", true], ["C", "mantener las conclusiones en un anexo, para que el cuerpo del documento solo describa las visitas realizadas una por una.", "Enviar las conclusiones a un anexo obliga al lector a buscar lo principal; las recomendaciones de lenguaje claro indican presentarlo primero.", false]]}, {"id": "DO-130", "niv": 3, "e": "La frase «Se procedió a la realización de la revisión de la totalidad de los expedientes existentes» queda mejor redactada así", "f": "DNP, Guía de lenguaje claro para servidores públicos de Colombia (2015)", "o": [["A", "«Se procedió a realizar la revisión de todos los expedientes existentes».", "Aunque simplifica un poco, mantiene el rodeo «se procedió a realizar la revisión» en lugar del verbo directo, y conserva la palabra innecesaria «existentes».", false], ["B", "«Se llevó a cabo el proceso de revisión de la totalidad de los expedientes».", "La frase sigue usando construcciones impersonales y sustantivos en lugar del verbo («proceso de revisión»), contra las recomendaciones de voz activa y palabras sencillas del DNP.", false], ["C", "«Revisamos todos los expedientes».", "La Guía de lenguaje claro del DNP recomienda oraciones cortas, voz activa y palabras sencillas: el verbo «revisamos» reemplaza a «se procedió a la realización de la revisión» y «todos» a «la totalidad de».", true]]}]}, {"comp": "documentos_oficina", "rol": "profesional", "tag": "Elaboración de documentos de oficina · Niveles profesional, asesor y ejecutivo · Redacción de cartas al ciudadano: persona gramatical, léxico y asunto", "texto": "Usted es profesional de una procuraduría provincial y revisa una carta de respuesta a un ciudadano que presentó una queja. El borrador mezcla «yo considero» con «esta procuraduría estima», y en un párrafo tutea al destinatario. Además, explica la decisión con términos técnicos como «auto inhibitorio» y «falta de legitimación», sin aclarar qué significan en la práctica para el ciudadano. La línea del asunto aparece como «ASUNTO: RESPUESTA», en negrilla y subrayada. La entidad sigue los lineamientos de la GTC 185 y la Guía de lenguaje claro del DNP.", "items": [{"id": "DO-131", "niv": 2, "e": "En cuanto a la persona gramatical y el trato al destinatario, la carta debe redactarse en", "f": "Guías institucionales que citan la GTC 185: UIS GGD.10, Senado GD-IT01 (ver notas-do.md)", "o": [["A", "primera persona del plural, con tratamiento de usted para el destinatario.", "Las guías de la UIS y del Senado, basadas en la GTC 185, recomiendan redactar la carta en primera persona del plural y con tratamiento de usted, lo que da unidad al texto y respeto al destinatario.", true], ["B", "primera persona del singular y con tuteo, para generar cercanía.", "Las guías basadas en la GTC 185 recomiendan la primera persona del plural y el tratamiento de usted; el tuteo no es el trato adecuado en una comunicación oficial.", false], ["C", "tercera persona impersonal, evitando dirigirse directamente al ciudadano.", "Las guías consultadas no prescriben un texto impersonal; indican la primera persona del plural y el tratamiento de usted hacia el destinatario.", false]]}, {"id": "DO-132", "niv": 3, "e": "Frente a los términos técnicos del borrador, lo más adecuado según la Guía de lenguaje claro del DNP es", "f": "DNP, Guía de lenguaje claro para servidores públicos de Colombia (2015)", "o": [["A", "agregar citas de jurisprudencia para que el ciudadano entienda la decisión.", "Las citas añaden más lenguaje técnico y alargan el texto; la guía del DNP recomienda pensar en el lector y usar palabras sencillas.", false], ["B", "conservarlos sin explicación, porque la respuesta es un documento jurídico y debe usar el lenguaje propio del derecho.", "La guía del DNP recomienda palabras sencillas que el lector entienda; usar tecnicismos sin explicar impide que el ciudadano comprenda qué se decidió.", false], ["C", "usar palabras sencillas y explicar qué significa en la práctica la decisión para el ciudadano.", "La Guía de lenguaje claro del DNP recomienda conocer al lector y preferir palabras sencillas y comunes; explicar en términos cotidianos qué implica la decisión permite que el ciudadano la entienda.", true]]}, {"id": "DO-133", "niv": 2, "e": "La línea del asunto de la carta debe escribirse con", "f": "Guías institucionales que citan la GTC 185: UIS GGD.10, Senado GD-IT01, Alcaldía de Mitú (ver notas-do.md)", "o": [["A", "la abreviatura «Ref.», seguida solo del número de radicado.", "El asunto es una síntesis del contenido de la comunicación; el número de radicado no lo reemplaza y las guías no usan la abreviatura «Ref.» para esa línea.", false], ["B", "la palabra «Asunto:» con mayúscula inicial y dos puntos, sin negrilla ni subrayado, seguida de una síntesis del tema.", "Las guías de la UIS, del Senado y de la Alcaldía de Mitú, basadas en la GTC 185, indican escribir «Asunto» con mayúscula inicial y dos puntos, sin negrilla ni subrayado, seguido de la síntesis del contenido.", true], ["C", "«ASUNTO:» en mayúscula sostenida, en negrilla y subrayado, para destacarlo.", "En la carta, las guías basadas en la GTC 185 indican «Asunto» con mayúscula inicial y sin resaltados; la mayúscula sostenida es propia del encabezado del memorando.", false]]}]}, {"comp": "documentos_oficina", "rol": "tecnico", "tag": "Elaboración de documentos de oficina · Niveles técnico, administrativo y operativo · Presentación: márgenes y páginas subsiguientes", "texto": "Usted es técnico de la secretaría de una procuraduría provincial y debe ajustar la plantilla de oficios de la dependencia. La plantilla actual tiene márgenes de 1 cm en todos los lados «para ahorrar papel». Además, muchos oficios ocupan dos o tres páginas y se imprimen por ambas caras, y en las páginas siguientes a la primera no aparece ningún dato que permita saber a qué comunicación pertenecen si se separan. La entidad sigue los lineamientos de la GTC 185 para la presentación de sus comunicaciones.", "items": [{"id": "DO-134", "niv": 2, "e": "Los márgenes recomendados por las guías basadas en la GTC 185 son", "f": "Guías institucionales que citan la GTC 185: UIS GGD.10, Alcaldía de Ibagué, Universidad del Tolima (ver notas-do.md)", "o": [["A", "superior e inferior de 5 cm y laterales de 1 cm, para centrar visualmente el texto en la hoja impresa.", "Esas medidas no coinciden con los rangos recomendados por las guías basadas en la GTC 185 para ningún margen.", false], ["B", "superior entre 3 y 4 cm, inferior entre 2 y 3 cm, izquierdo entre 3 y 4 cm y derecho entre 2 y 3 cm.", "Las guías de la UIS, de la Alcaldía de Ibagué y de la Universidad del Tolima, basadas en la GTC 185, recomiendan márgenes superior de 3 a 4 cm, inferior de 2 a 3 cm, izquierdo de 3 a 4 cm y derecho de 2 a 3 cm.", true], ["C", "de 1 cm en todos los lados, para aprovechar el papel.", "Las guías basadas en la GTC 185 recomiendan márgenes mucho mayores, que facilitan la lectura, la encuadernación y la inclusión de datos como el radicado.", false]]}, {"id": "DO-135", "niv": 3, "e": "Para los oficios que se imprimen por ambas caras, las guías basadas en la GTC 185 recomiendan", "f": "Guías institucionales que citan la GTC 185: UIS GGD.10, Alcaldía de Ibagué (ver notas-do.md)", "o": [["A", "márgenes laterales simétricos de 3 cm.", "Las guías de la UIS y de la Alcaldía de Ibagué, basadas en la GTC 185, indican que cuando la comunicación se imprime por ambas caras los márgenes laterales deben ser simétricos, de 3 cm.", true], ["B", "eliminar los márgenes laterales para que el texto coincida al reverso.", "Las guías basadas en la GTC 185 no prevén suprimir márgenes; para doble cara indican márgenes laterales simétricos de 3 cm.", false], ["C", "un margen izquierdo de 4 cm en todas las páginas, sin importar si es la cara frontal o la posterior.", "En la impresión a doble cara un margen izquierdo amplio en ambas caras queda descompensado al encuadernar; las guías recomiendan márgenes laterales simétricos de 3 cm.", false]]}, {"id": "DO-136", "niv": 1, "e": "Para que las páginas siguientes a la primera se puedan identificar, deben llevar", "f": "Guías institucionales que citan la GTC 185: UIS GGD.10, Alcaldía de Mitú, Alcaldía de Ibagué (ver notas-do.md)", "o": [["A", "la firma del remitente en cada una.", "La firma va en el bloque del remitente al final de la comunicación; las páginas subsiguientes se identifican con un encabezado y el número de página.", false], ["B", "el membrete completo de la entidad en cada página y ningún número, para que todas se vean iguales.", "Sin número de página ni datos de la comunicación no es posible saber a qué documento pertenece una hoja separada; las guías indican encabezado de identificación y número de página.", false], ["C", "un encabezado de identificación de la comunicación y el número de página.", "Las guías de la UIS, de la Alcaldía de Mitú y de la Alcaldía de Ibagué, basadas en la GTC 185, indican identificar las páginas subsiguientes con un encabezado o línea de identificación y el número de página a partir de la segunda.", true]]}]}, {"comp": "documentos_oficina", "rol": "general", "tag": "Elaboración de documentos de oficina · Abreviaturas, símbolos y porcentajes", "texto": "Usted es auxiliar administrativo de una procuraduría provincial y revisa el informe de una comisión de servicio a un municipio. El borrador dice: «La Sra Gómez, personera municipal, nos recibió a las 9:00 am. Para llegar recorrimos 25 Kms. por carretera destapada. En la visita se revisó el quince % de los expedientes de contratación». El jefe le pide corregir la escritura de las abreviaturas, los símbolos y las cifras antes de enviar el informe, conforme a las normas ortográficas de la Real Academia Española.", "items": [{"id": "DO-137", "niv": 1, "e": "La abreviatura de «señora» debe escribirse", "f": "RAE, Ortografía de la lengua española y Libro de estilo: abreviaturas y símbolos (ver notas-do.md)", "o": [["A", "«Sra.», con punto final.", "La RAE señala que las abreviaturas se escriben con punto abreviativo; a diferencia de los símbolos, no se escriben sin él.", true], ["B", "«Sra», sin punto, porque va seguida del apellido.", "Las abreviaturas se cierran con punto, con independencia de la palabra que las siga (RAE, Ortografía).", false], ["C", "«SRA.», en mayúscula sostenida, por tratarse de un tratamiento.", "Los tratamientos abreviados se escriben con mayúscula inicial y el resto en minúscula (Sra., Sr., Dr.); la mayúscula sostenida no corresponde (RAE).", false]]}, {"id": "DO-138", "niv": 2, "e": "La hora de la reunión debe escribirse", "f": "RAE, Ortografía de la lengua española y Libro de estilo: abreviaturas y símbolos (ver notas-do.md)", "o": [["A", "«9:00 A.M.», en mayúsculas y sin espacio.", "La abreviatura se escribe en minúscula y con espacio entre sus elementos: «a. m.» (RAE).", false], ["B", "«9:00 am», sin puntos ni espacio.", "«a. m.» es una abreviatura de la expresión latina ante meridiem; como abreviatura, lleva punto y espacio entre sus componentes (RAE).", false], ["C", "«9:00 a. m.», con punto tras cada letra y un espacio entre ellas.", "La RAE recoge «a. m.» como abreviatura de ante meridiem y señala que en las abreviaturas de varios elementos se deja un espacio entre ellos.", true]]}, {"id": "DO-139", "niv": 2, "e": "La distancia recorrida debe escribirse", "f": "RAE, Ortografía de la lengua española y Libro de estilo: abreviaturas y símbolos (ver notas-do.md)", "o": [["A", "«25 kms.», con s de plural y punto abreviativo.", "Los símbolos no llevan punto ni marca de plural: se escribe 25 km, no 25 kms. (RAE, Libro de estilo).", false], ["B", "«25 km», sin punto, sin plural y en minúscula.", "Según la RAE, los símbolos se escriben sin punto, no varían en plural y los de unidades de medida van en minúscula; además se separan de la cifra con un espacio.", true], ["C", "«25 Km.», con mayúscula inicial por ser una unidad del sistema internacional.", "El símbolo del kilómetro es «km», en minúscula y sin punto; solo van en mayúscula los símbolos derivados de nombres propios y los prefijos desde mega- (RAE).", false]]}, {"id": "DO-140", "niv": 3, "e": "La expresión del porcentaje queda correctamente escrita así", "f": "RAE, Ortografía de la lengua española y Libro de estilo: abreviaturas y símbolos (ver notas-do.md)", "o": [["A", "«el 15% de los expedientes», con el símbolo pegado a la cifra.", "Aunque es frecuente verlo pegado, la RAE indica que el símbolo % se separa de la cifra con un espacio, como el resto de los símbolos.", false], ["B", "«el 15 % de los expedientes», con un espacio entre la cifra y el símbolo.", "La RAE recomienda escribir el porcentaje con cifras y el símbolo % separado por un espacio (el 15 %), o enteramente con palabras (el quince por ciento); no se combina el símbolo con números en letras.", true], ["C", "«el quince % de los expedientes», porque el símbolo puede acompañar a números escritos en letras.", "La RAE indica que el símbolo % solo se emplea cuando el porcentaje se escribe con cifras; «el quince %» es incorrecto.", false]]}]}, {"comp": "ofimatica", "rol": "general", "tag": "Herramientas ofimáticas · Referencias relativas, absolutas y mixtas", "texto": "Usted es técnico administrativo de la Oficina de Planeación de la Procuraduría General de la Nación y lleva en Excel el consolidado de gastos de cinco procuradurías provinciales. En B2:B6 están los valores ejecutados; en B7, el total =SUMA(B2:B6), y en E1, el porcentaje de un ajuste que se aplica a todas las filas. En C2 escribió =B2*$E$1 y en D2 =B2/B7, y copió ambas fórmulas hacia abajo hasta la fila 6. Para una tabla auxiliar, además, escribió en C10 la fórmula =$B10*C$9 y la copió a otras celdas.", "items": [{"id": "OF-101", "niv": 1, "e": "Al copiar la fórmula de C2 a la celda C4, la fórmula resultante es", "f": "Microsoft Support, «Cambiar entre referencias relativas, absolutas y mixtas» (Excel)", "o": [["A", "=B4*$E$3.", "Trata $E$1 como si fuera relativa. Con el signo $ delante de la columna y de la fila, la referencia se mantiene en E1 al copiarla.", false], ["B", "=B2*$E$1.", "B2 es una referencia relativa: al copiar la fórmula dos filas hacia abajo se convierte en B4. Solo permanecen fijas las partes precedidas del signo $.", false], ["C", "=B4*$E$1.", "Al copiar dos filas hacia abajo, la referencia relativa B2 se ajusta a B4, mientras que $E$1, por ser absoluta (columna y fila fijas), no cambia.", true]]}, {"id": "OF-102", "niv": 3, "e": "Las celdas D3 a D6 muestran el error #¡DIV/0! porque", "f": "Microsoft Support, «Cambiar entre referencias relativas, absolutas y mixtas» (Excel); «Cómo corregir un error #¡DIV/0!»", "o": [["A", "la referencia B7 era relativa y, al copiarse, pasó a B8, B9 y siguientes, que están vacías.", "Al copiar =B2/B7 hacia abajo, el divisor se desplaza a celdas vacías, y dividir por una celda vacía produce #¡DIV/0!. Fijar el total con referencia absoluta ($B$7) corrige la fórmula.", true], ["B", "la celda B7 tiene formato de moneda, que Excel no acepta como divisor en una división.", "El formato de número solo cambia la apariencia del valor; no impide dividir. #¡DIV/0! aparece cuando el divisor es cero o una celda vacía.", false], ["C", "la referencia B2 del numerador debió ser absoluta para que no cambiara al copiar la fórmula.", "El numerador sí debe cambiar en cada fila (B3, B4…). El error está en el divisor: B7 era relativa y al copiarse apuntó a celdas vacías; debió escribirse $B$7.", false]]}, {"id": "OF-103", "niv": 3, "e": "Si copia la fórmula de C10 a la celda E12, la fórmula resultante es", "f": "Microsoft Support, «Cambiar entre referencias relativas, absolutas y mixtas» (Excel)", "o": [["A", "=$B12*E$9.", "Se copió dos columnas a la derecha y dos filas abajo. En $B10 la columna está fija y la fila es relativa, por lo que queda $B12; en C$9 la columna es relativa y la fila fija, por lo que queda E$9.", true], ["B", "=$B10*E$9.", "Supone que $B10 queda completamente fija. El signo $ solo fija la columna B; la fila 10 es relativa y avanza a 12.", false], ["C", "=$B12*E$11.", "Supone que la fila de C$9 es relativa. El signo $ delante del 9 fija la fila, de modo que solo cambia la columna (de C a E).", false]]}]}, {"comp": "ofimatica", "rol": "general", "tag": "Herramientas ofimáticas · CONTAR, CONTARA, CONTAR.SI y CONTAR.SI.CONJUNTO", "texto": "Usted apoya el seguimiento de solicitudes en una procuraduría regional. En la hoja de control, B2:B9 contiene el estado de cada solicitud y C2:C9 los días que lleva en trámite, así: fila 2, Pendiente, 12; fila 3, Tramitado, 5; fila 4, Tramitado, 8; fila 5, Pendiente, el texto «s.d.» (sin dato); fila 6, Pendiente, 15; fila 7, Tramitado, celda vacía; fila 8, Pendiente, 9; fila 9, Pendiente, 21. No hay otros datos en esos rangos.", "items": [{"id": "OF-104", "niv": 2, "e": "La fórmula =CONTARA(C2:C9) devuelve", "f": "Microsoft Support, «Función CONTARA» y «Función CONTAR»", "o": [["A", "6.", "Ese es el resultado de CONTAR, que solo cuenta celdas con números. CONTARA también cuenta la celda con el texto «s.d.».", false], ["B", "7.", "CONTARA cuenta las celdas que no están vacías, cualquiera que sea su contenido: los seis números y el texto «s.d.». No cuenta la celda vacía de la fila 7 (si esa celda tuviera una fórmula que devuelve , sí la contaría).", true], ["C", "8.", "Supone que CONTARA cuenta todas las celdas del rango. La función no cuenta las celdas vacías, como C7.", false]]}, {"id": "OF-105", "niv": 1, "e": "La fórmula =CONTAR.SI(B2:B9;\"Pendiente\") devuelve", "f": "Microsoft Support, «Función CONTAR.SI»", "o": [["A", "3.", "Corresponde a las solicitudes pendientes con más de 10 días, que exigiría un segundo criterio (CONTAR.SI.CONJUNTO). CONTAR.SI con un solo criterio cuenta todas las pendientes.", false], ["B", "5.", "Hay cinco celdas con «Pendiente» en B2:B9 (filas 2, 5, 6, 8 y 9). CONTAR.SI cuenta las celdas del rango que cumplen el criterio.", true], ["C", "8.", "Es el total de filas del rango. CONTAR.SI solo cuenta las que cumplen el criterio indicado.", false]]}, {"id": "OF-106", "niv": 3, "e": "La fórmula =CONTAR.SI.CONJUNTO(B2:B9;\"Pendiente\";C2:C9;\">10\") devuelve", "f": "Microsoft Support, «Función CONTAR.SI.CONJUNTO»", "o": [["A", "3.", "Cuenta las filas que cumplen ambos criterios a la vez: pendientes con más de 10 días (filas 2, 6 y 9). La fila 5 es pendiente, pero «s.d.» es texto y no cumple la condición numérica «>10».", true], ["B", "4.", "Incluye la fila 5, cuyo valor es el texto «s.d.». Un texto no satisface el criterio numérico «>10», por lo que esa fila no se cuenta.", false], ["C", "5.", "Cuenta todas las solicitudes pendientes y omite el segundo criterio. CONTAR.SI.CONJUNTO exige que cada fila cumpla todos los criterios.", false]]}]}, {"comp": "ofimatica", "rol": "tecnico", "tag": "Herramientas ofimáticas · Niveles técnico, administrativo y operativo · SUMAR.SI y SUMAR.SI.CONJUNTO", "texto": "Usted es técnico administrativo del área financiera de una procuraduría regional y consolida los viáticos pagados en el mes. En A2:A7 está la ciudad de la comisión, en B2:B7 el concepto y en C2:C7 el valor pagado: fila 2, Bogotá, Transporte, 350.000; fila 3, Cali, Alojamiento, 420.000; fila 4, Bogotá, Alojamiento, 510.000; fila 5, Medellín, Transporte, 280.000; fila 6, Bogotá, Transporte, 190.000; fila 7, Cali, Transporte, 260.000.", "items": [{"id": "OF-107", "niv": 1, "e": "La fórmula =SUMAR.SI(A2:A7;\"Bogotá\";C2:C7) devuelve", "f": "Microsoft Support, «Función SUMAR.SI»", "o": [["A", "$540.000.", "Es la suma de Bogotá solo por transporte. La fórmula tiene un único criterio (la ciudad), por lo que también suma el alojamiento de Bogotá.", false], ["B", "$1.050.000.", "SUMAR.SI suma los valores de C2:C7 cuyas filas tienen «Bogotá» en A2:A7: 350.000 + 510.000 + 190.000 = 1.050.000.", true], ["C", "$1.080.000.", "Es el total del concepto «Transporte» en todas las ciudades. El criterio de la fórmula se evalúa sobre las ciudades (A2:A7), no sobre los conceptos.", false]]}, {"id": "OF-108", "niv": 2, "e": "La fórmula =SUMAR.SI.CONJUNTO(C2:C7;A2:A7;\"Bogotá\";B2:B7;\"Transporte\") devuelve", "f": "Microsoft Support, «Función SUMAR.SI.CONJUNTO»", "o": [["A", "$350.000.", "Toma solo la primera fila que cumple los criterios. SUMAR.SI.CONJUNTO suma todas las filas que cumplen ambos criterios (filas 2 y 6).", false], ["B", "$540.000.", "Suma los valores de C2:C7 de las filas con «Bogotá» y «Transporte» a la vez: 350.000 + 190.000 = 540.000.", true], ["C", "$1.050.000.", "Aplica solo el criterio de ciudad. El segundo par de rango y criterio excluye el alojamiento de Bogotá (510.000).", false]]}, {"id": "OF-109", "niv": 2, "e": "Para sumar solo el transporte pagado en Cali, la fórmula escrita correctamente es", "f": "Microsoft Support, «Función SUMAR.SI.CONJUNTO» (sección «Comprenda la diferencia entre SUMAR.SI y SUMAR.SI.CONJUNTO»)", "o": [["A", "=SUMAR.SI(A2:A7;\"Cali\";B2:B7;\"Transporte\";C2:C7).", "SUMAR.SI admite un solo criterio (rango; criterio; [rango_suma]). Para dos condiciones se requiere SUMAR.SI.CONJUNTO.", false], ["B", "=SUMAR.SI.CONJUNTO(A2:A7;\"Cali\";B2:B7;\"Transporte\";C2:C7).", "Usa el orden de SUMAR.SI. En SUMAR.SI.CONJUNTO el primer argumento es el rango_suma (C2:C7), seguido de los pares de rango y criterio.", false], ["C", "=SUMAR.SI.CONJUNTO(C2:C7;A2:A7;\"Cali\";B2:B7;\"Transporte\").", "En SUMAR.SI.CONJUNTO el rango que se suma va primero y luego los pares de rango y criterio. Microsoft advierte que este orden es distinto del de SUMAR.SI, donde el rango de suma va de último.", true]]}]}, {"comp": "ofimatica", "rol": "general", "tag": "Herramientas ofimáticas · SI anidado, Y, O", "texto": "En la Oficina de Planeación de la Procuraduría, usted consolida el avance de las metas del plan de acción de las procuradurías regionales. En la columna B registra el porcentaje de avance y en C2 escribió =SI(B2>=90%;\"Satisfactorio\";SI(B2>=70%;\"Aceptable\";\"Crítico\")). En la columna D se escribe «Sí» cuando la dependencia entregó las evidencias. En la columna E se deben marcar como «Cumple» solo las metas que tengan avance de al menos 80 % y, además, evidencias entregadas.", "items": [{"id": "OF-110", "niv": 1, "e": "Para una regional con avance de exactamente 70 %, la fórmula de la columna C devuelve", "f": "Microsoft Support, «Función SI» y «Funciones SI anidadas»", "o": [["A", "«Satisfactorio».", "Solo se obtiene con un avance de 90 % o más (primera prueba). Con 70 % esa prueba es falsa y el SI anidado devuelve «Aceptable».", false], ["B", "«Crítico».", "Supone que el avance debe superar el 70 %. El operador >= incluye el valor límite; con > sí se excluiría el 70 %, pero la fórmula usa mayor o igual.", false], ["C", "«Aceptable».", "La primera prueba (B2>=90%) es falsa, de modo que se evalúa el SI anidado; como 70 % es mayor o igual que 70 %, devuelve «Aceptable».", true]]}, {"id": "OF-111", "niv": 3, "e": "Un compañero reescribió la fórmula como =SI(B2>=70%;\"Aceptable\";SI(B2>=90%;\"Satisfactorio\";\"Crítico\")). Con un avance de 95 %, esta versión devuelve", "f": "Microsoft Support, «Función SI» y «Funciones SI anidadas»", "o": [["A", "«Aceptable», porque la primera condición ya es verdadera y la función no evalúa el SI anidado.", "SI devuelve el valor de la primera prueba verdadera. Como 95 % >= 70 %, retorna «Aceptable» y nunca llega a evaluar B2>=90%; por eso, en clasificaciones por rangos, las condiciones deben ordenarse de la más exigente a la menos exigente.", true], ["B", "«Crítico», porque las condiciones quedaron en un orden contradictorio.", "El orden no vuelve contradictoria la fórmula ni la lleva a la opción final; simplemente la primera condición verdadera (>=70 %) determina el resultado.", false], ["C", "«Satisfactorio», porque Excel evalúa todas las condiciones y aplica la más exigente que se cumpla.", "Excel no busca la condición más exigente: devuelve el resultado de la primera prueba lógica verdadera.", false]]}, {"id": "OF-112", "niv": 2, "e": "Para la columna E, la fórmula que marca correctamente las metas que cumplen es", "f": "Microsoft Support, «Función Y», «Función O» y «Función SI»", "o": [["A", "=SI(B2>=80%;\"Cumple\";SI(D2=\"Sí\";\"Cumple\";\"No cumple\")).", "Equivale a una O: basta el avance o basta la evidencia para obtener «Cumple», cuando se exigen las dos condiciones a la vez.", false], ["B", "=SI(O(B2>=80%;D2=\"Sí\");\"Cumple\";\"No cumple\").", "O devuelve VERDADERO si se cumple cualquiera de las condiciones, de modo que marcaría «Cumple» una meta con 85 % sin evidencias.", false], ["C", "=SI(Y(B2>=80%;D2=\"Sí\");\"Cumple\";\"No cumple\").", "Y devuelve VERDADERO solo cuando todas sus condiciones se cumplen, que es lo que se pide: avance de al menos 80 % y evidencias entregadas.", true]]}]}, {"comp": "ofimatica", "rol": "tecnico", "tag": "Herramientas ofimáticas · Niveles técnico, administrativo y operativo · BUSCARV", "texto": "Usted es auxiliar administrativo de una procuraduría regional y apoya el reparto de correspondencia. En la hoja «Directorio», el rango A2:D60 contiene: en A, el código de cada dependencia (por ejemplo, PP-04); en B, su nombre; en C, la ciudad, y en D, el correo institucional. En la hoja «Reparto», la celda F2 tiene el código de la dependencia que se debe buscar.", "items": [{"id": "OF-113", "niv": 1, "e": "Para obtener, con coincidencia exacta, la ciudad de la dependencia cuyo código está en F2, la fórmula adecuada es", "f": "Microsoft Support, «Función BUSCARV»", "o": [["A", "=BUSCARV(F2;Directorio!$A$2:$D$60;3;FALSO).", "BUSCARV busca F2 en la primera columna del rango (A) y devuelve la tercera columna del rango (C, ciudad). FALSO exige coincidencia exacta, y las referencias absolutas fijan el rango al copiar.", true], ["B", "=BUSCARV(F2;Directorio!$A$2:$D$60;2;FALSO).", "El indicador de columnas se cuenta desde la primera columna del rango (A = 1). La columna 2 es B, que contiene el nombre, no la ciudad.", false], ["C", "=BUSCARV(F2;Directorio!$A$2:$D$60;3;VERDADERO).", "VERDADERO pide coincidencia aproximada, que supone la primera columna ordenada y puede devolver datos de otra dependencia si el código no existe.", false]]}, {"id": "OF-114", "niv": 2, "e": "Si en la fórmula de la pregunta anterior se usa 5 como indicador_columnas, el resultado será", "f": "Microsoft Support, «¡Cómo corregir un #¡REF! error» (BUSCARV con referencia de columna incorrecta)", "o": [["A", "el valor de la columna E de la hoja, contigua al rango indicado.", "BUSCARV solo devuelve columnas que están dentro del rango del segundo argumento; no extiende la búsqueda a columnas contiguas.", false], ["B", "el error #N/D, porque no se encontró el código en la quinta columna.", "#N/D indica que no se encontró el valor buscado. Aquí el problema es que la columna pedida no existe dentro del rango, lo que genera #¡REF!.", false], ["C", "el error #¡REF!, porque el rango de búsqueda solo tiene cuatro columnas.", "Microsoft explica que BUSCARV devuelve #¡REF! cuando el indicador de columnas es mayor que el número de columnas del rango (A:D tiene cuatro).", true]]}, {"id": "OF-115", "niv": 3, "e": "Le piden obtener el código (columna A) a partir del nombre de la dependencia (columna B), sin reorganizar la tabla. Lo procedente es", "f": "Microsoft Support, «Función BUSCARV» y «Función BUSCARX»", "o": [["A", "usar BUSCARV con indicador_columnas igual a -1 para que devuelva la columna anterior a la de búsqueda.", "El indicador de columnas de BUSCARV empieza en 1 (la primera columna del rango); un valor negativo no devuelve columnas a la izquierda, sino un error.", false], ["B", "usar BUSCARV con el último argumento en VERDADERO, que permite buscar en cualquier columna del rango.", "VERDADERO solo activa la coincidencia aproximada; la búsqueda sigue haciéndose en la primera columna del rango.", false], ["C", "usar BUSCARX o INDICE con COINCIDIR, que pueden devolver columnas a la izquierda.", "BUSCARV exige que el valor buscado esté en la primera columna del rango y devuelve columnas situadas a su derecha. BUSCARX, en cambio, devuelve resultados de cualquier lado, al igual que INDICE con COINCIDIR.", true]]}]}, {"comp": "ofimatica", "rol": "profesional", "tag": "Herramientas ofimáticas · Niveles profesional, asesor y ejecutivo · INDICE, COINCIDIR y BUSCARX", "texto": "Usted es profesional universitario de una procuraduría delegada y construye un tablero de seguimiento de expedientes. En la hoja de datos, A2:A40 contiene el número de radicado; C2:C40, el funcionario sustanciador, y E2:E40, el estado del expediente. El radicado D-2027-118 está en la celda A9. En la celda H2 del tablero se escribe el radicado que se quiere consultar.", "items": [{"id": "OF-116", "niv": 2, "e": "La fórmula =COINCIDIR(\"D-2027-118\";A2:A40;0) devuelve", "f": "Microsoft Support, «Función COINCIDIR»; «Corregir un error #N/A en funciones INDICE/COINCIDIR»", "o": [["A", "7.", "COINCIDIR no cuenta desde cero: la primera celda del rango es la posición 1.", false], ["B", "8.", "COINCIDIR devuelve la posición relativa dentro del rango, no el número de fila de la hoja. A9 es la octava celda de A2:A40 (A2 es la 1). El 0 pide coincidencia exacta.", true], ["C", "9.", "Es el número de fila de la hoja. COINCIDIR devuelve la posición dentro del rango, que empieza en A2.", false]]}, {"id": "OF-117", "niv": 2, "e": "La fórmula =INDICE(C2:C40;COINCIDIR(H2;A2:A40;0)) sirve para", "f": "Microsoft Support, «Función INDICE», «Función COINCIDIR»", "o": [["A", "devolver el sustanciador del radicado escrito en H2, con coincidencia exacta.", "COINCIDIR halla la posición de H2 en A2:A40 (el 0 exige coincidencia exacta) e INDICE devuelve el valor que ocupa esa posición en C2:C40, es decir, el sustanciador.", true], ["B", "devolver la posición en la que aparece el radicado de H2 dentro de la columna C.", "La posición la calcula COINCIDIR en la columna A; INDICE usa esa posición para devolver el contenido de la columna C, no un número de posición.", false], ["C", "devolver el sustanciador del radicado más parecido al de H2 cuando no hay uno idéntico.", "Con tipo de coincidencia 0, COINCIDIR solo acepta coincidencias exactas; si el radicado no existe, la fórmula devuelve #N/D.", false]]}, {"id": "OF-118", "niv": 3, "e": "Si el radicado de H2 no existe en la base, la fórmula =BUSCARX(H2;A2:A40;E2:E40;\"No registrado\") devuelve", "f": "Microsoft Support, «Función BUSCARX»", "o": [["A", "el error #N/D, porque BUSCARX no admite mensajes personalizados cuando falla la búsqueda.", "BUSCARX sí admite un mensaje propio en el argumento si_no_se_encuentra; #N/D solo aparece cuando ese argumento se omite.", false], ["B", "el texto «No registrado».", "El cuarto argumento de BUSCARX (si_no_se_encuentra) define lo que se muestra cuando no hay coincidencia válida. Sin ese argumento, la función devolvería #N/D.", true], ["C", "el estado del radicado más cercano, porque BUSCARX hace coincidencias aproximadas por defecto.", "BUSCARX realiza coincidencia exacta de forma predeterminada; la aproximada debe pedirse expresamente con el argumento modo_de_coincidencia.", false]]}]}, {"comp": "ofimatica", "rol": "general", "tag": "Herramientas ofimáticas · Funciones de fecha: DIA.LAB, DIAS.LAB y HOY", "texto": "Usted es técnico de la Oficina de Atención al Ciudadano de la Procuraduría y lleva en Excel el control de términos de las peticiones. La celda B2 contiene la fecha de radicación de una petición, miércoles 10/03/2027. En H2:H4 están registrados como festivos el 22, el 25 y el 26 de marzo de 2027; no hay otros festivos en marzo ni a comienzos de abril. La oficina no atiende sábados ni domingos.", "items": [{"id": "OF-119", "niv": 3, "e": "La fórmula =DIA.LAB(B2;10;H2:H4) devuelve la fecha", "f": "Microsoft Support, «Función DIA.LAB»; cálculo verificado", "o": [["A", "24/03/2027.", "Es el resultado de =DIA.LAB(B2;10), sin el argumento de festivos. Con H2:H4 se excluyen el 22, el 25 y el 26 de marzo.", false], ["B", "29/03/2027.", "DIA.LAB cuenta días laborables posteriores a la fecha inicial y excluye fines de semana y festivos: 11 y 12 (2), 15 a 19 (7), 23 y 24 (9) y lunes 29 de marzo (10).", true], ["C", "01/04/2027.", "Resulta de sumar a mano tres días hábiles más al resultado correcto. La función ya descuenta los festivos indicados en H2:H4; no hay que agregarlos.", false]]}, {"id": "OF-120", "niv": 3, "e": "La fórmula =DIAS.LAB(FECHA(2027;3;1);FECHA(2027;3;31);H2:H4) devuelve", "f": "Microsoft Support, «Función DIAS.LAB»; cálculo verificado", "o": [["A", "20.", "DIAS.LAB cuenta los días laborables entre ambas fechas, incluidas, sin fines de semana ni festivos: marzo de 2027 tiene 23 días de lunes a viernes, menos los 3 festivos de H2:H4.", true], ["B", "23.", "Es el número de días de lunes a viernes de marzo de 2027 sin descontar los festivos del argumento vacaciones (H2:H4).", false], ["C", "31.", "Es el número de días calendario del mes. DIAS.LAB excluye sábados, domingos y los festivos indicados.", false]]}, {"id": "OF-121", "niv": 1, "e": "Un compañero propone llenar la columna de fechas de radicación con la fórmula =HOY(). La propuesta es inadecuada porque", "f": "Microsoft Support, «Función HOY»", "o": [["A", "la función HOY devuelve la fecha y la hora, lo que impide calcular términos en días completos.", "Es falsa: la que devuelve fecha y hora es AHORA. HOY devuelve solo la fecha; el problema es que no permanece fija.", false], ["B", "la función HOY devuelve un texto que las funciones DIA.LAB y DIAS.LAB no aceptan como fecha.", "HOY devuelve un número de serie de fecha, que DIA.LAB y DIAS.LAB aceptan. El inconveniente es que el valor cambia cada día.", false], ["C", "la función HOY se recalcula y la fecha cambiaría cada día que se abra el libro.", "HOY devuelve la fecha actual y se vuelve a calcular al abrir o recalcular el libro; sirve para cálculos respecto del día de hoy, no para registrar una fecha fija como la de radicación.", true]]}]}, {"comp": "ofimatica", "rol": "general", "tag": "Herramientas ofimáticas · SIFECHA, REDONDEAR y operador &", "texto": "Usted apoya a la Oficina de Selección y Carrera de la Procuraduría en un libro de Excel. En B2 está la fecha de posesión de una servidora (15/08/2019) y en C2 la fecha de corte del informe (01/03/2027). En D2 hay un valor de 1.234.567,891. En E2 está el código «E-2027-0153» y en F2 la fecha 10/03/2027, con formato de fecha.", "items": [{"id": "OF-122", "niv": 2, "e": "La fórmula =SIFECHA(B2;C2;\"Y\") devuelve", "f": "Microsoft Support, «Función SIFECHA»", "o": [["A", "6.", "Entre el 15/08/2019 y el 15/08/2026 ya se completaron siete años; seis subestima el periodo.", false], ["B", "7.", "Con la unidad \"Y\", SIFECHA devuelve los años completos del periodo. Del 15/08/2019 al 01/03/2027 se completaron 7 años (el octavo se cumpliría el 15/08/2027).", true], ["C", "8.", "Resta los años (2027 − 2019) sin verificar si el último año está completo. SIFECHA con \"Y\" solo cuenta años completos.", false]]}, {"id": "OF-123", "niv": 2, "e": "La fórmula =REDONDEAR(D2;-3) devuelve", "f": "Microsoft Support, «Función REDONDEAR»", "o": [["A", "1.234.000.", "Trunca el valor a los miles en lugar de redondearlo. Como las centenas (567) superan la mitad de mil, el redondeo es hacia arriba.", false], ["B", "1.234.567,9.", "Es el resultado de redondear a un decimal (REDONDEAR(D2;1)). Un número de decimales negativo redondea a la izquierda de la coma.", false], ["C", "1.235.000.", "Con núm_decimales igual a −3, REDONDEAR lleva el número al millar más cercano: 1.234.567,891 queda en 1.235.000.", true]]}, {"id": "OF-124", "niv": 3, "e": "La fórmula =\"Radicado \"&E2&\" del \"&F2 muestra", "f": "Microsoft Support, «Combinar texto y números» y «Función TEXTO»; Excel almacena las fechas como números de serie («Función DIA.LAB», observaciones); serie calculada con base 30/12/1899", "o": [["A", "«Radicado E-2027-0153 del 10/03/2027».", "El formato de fecha de F2 solo afecta cómo se ve la celda; al concatenar con &, Excel usa el valor subyacente, que es el número de serie.", false], ["B", "«Radicado E-2027-0153 del 46456».", "Excel guarda las fechas como números de serie. Al unirlas con texto mediante &, aparece el número; para mostrar la fecha debe usarse, por ejemplo, TEXTO(F2;\"dd/mm/aaaa\").", true], ["C", "el error #¡VALOR!, porque no se puede unir texto con una fecha.", "El operador & sí puede unir texto con números o fechas; no genera error, pero muestra el número de serie de la fecha.", false]]}]}, {"comp": "ofimatica", "rol": "general", "tag": "Herramientas ofimáticas · Errores en fórmulas de Excel", "texto": "Antes de enviar a la Oficina de Planeación el libro de indicadores de una procuraduría provincial, usted encuentra tres celdas con problemas: (1) en G5, la fórmula =F5/E5, donde E5 está vacía porque aún no se ha reportado la meta; (2) en G8, la fórmula =SUMA(Quejas2027), aunque en el libro nunca se definió un rango con ese nombre; (3) en G12, la fórmula =B12+C12+D12, que mostraba un valor correcto hasta que alguien eliminó la columna C completa.", "items": [{"id": "OF-125", "niv": 1, "e": "La celda G5 muestra el error", "f": "Microsoft Support, «Detectar errores de fórmula en Excel» y «Cómo corregir un error #¡DIV/0!»", "o": [["A", "#¡DIV/0!, porque el divisor es una celda vacía.", "Excel muestra #¡DIV/0! al dividir por cero o por una celda que no contiene ningún valor, como E5.", true], ["B", "#¡VALOR!, porque una celda vacía no es un número.", "En una división, la celda vacía se trata como cero, por eso el error es #¡DIV/0! y no #¡VALOR!.", false], ["C", "#N/D, porque el dato de la meta todavía no está disponible.", "#N/D aparece cuando una función no encuentra un valor, por ejemplo una búsqueda sin coincidencia. Dividir por una celda vacía produce #¡DIV/0!.", false]]}, {"id": "OF-126", "niv": 2, "e": "La celda G8 muestra #¿NOMBRE?, y la forma adecuada de corregirlo es", "f": "Microsoft Support, «Cómo corregir un error #¿NOMBRE?»", "o": [["A", "convertir a número las celdas del rango, porque SUMA no reconoce valores con formato de texto.", "El problema no está en los valores sumados, sino en que el nombre «Quejas2027» no existe en el libro.", false], ["B", "envolver la fórmula en SI.ERROR para que muestre cero mientras se definen los datos.", "Microsoft indica que #¿NOMBRE? señala un error de sintaxis que debe resolverse y que no conviene enmascararlo con funciones de control de errores.", false], ["C", "definir el nombre Quejas2027 para el rango que corresponde o reemplazarlo por la referencia del rango.", "#¿NOMBRE? indica que Excel no reconoce un texto de la fórmula, por ejemplo un nombre no definido. Se corrige definiendo el nombre o usando la referencia; Microsoft advierte que no debe ocultarse con SI.ERROR.", true]]}, {"id": "OF-127", "niv": 2, "e": "Después de eliminar la columna C, la fórmula de la fila 12 (que se desplazó a F12) muestra", "f": "Microsoft Support, «¡Cómo corregir un #¡REF! error»", "o": [["A", "el error #¡REF!, porque una de sus referencias apunta a una celda que ya no existe.", "Al eliminar una columna referida de forma individual, Excel reemplaza esa referencia por #¡REF! (por ejemplo, =B12+#¡REF!+C12) y la fórmula devuelve ese error.", true], ["B", "la suma de los dos valores restantes, porque Excel ajusta automáticamente la fórmula.", "Excel ajusta rangos continuos (como B12:D12), pero no puede resolver una referencia individual a una celda eliminada.", false], ["C", "el error #N/D, porque falta uno de los valores que se iban a sumar.", "#N/D se refiere a valores no encontrados por funciones de búsqueda; una referencia eliminada produce #¡REF!.", false]]}]}, {"comp": "ofimatica", "rol": "general", "tag": "Herramientas ofimáticas · Validación de datos, formato condicional y filtros", "texto": "Usted es técnico de una procuraduría distrital y administra la hoja compartida de seguimiento de solicitudes. Detectó tres problemas: los compañeros escriben el estado de cada solicitud de formas distintas («pendiente», «Pend.», «en trámite»); el jefe quiere ver resaltadas en rojo, de forma automática, las solicitudes con más de 10 días sin respuesta; y la coordinadora necesita ver solo las filas de una dependencia, sin borrar ni mover las demás.", "items": [{"id": "OF-128", "niv": 1, "e": "Para que el estado se registre de manera uniforme, la herramienta adecuada es", "f": "Microsoft Support, «Aplicar validación de datos a celdas» y «Crear una lista desplegable»", "o": [["A", "la validación de datos con una lista de valores permitidos en la columna de estado.", "La validación de datos restringe lo que se puede escribir en una celda; con la opción Lista se ofrece un desplegable con los estados válidos y se rechazan los demás.", true], ["B", "la protección de la hoja con contraseña, para bloquear la columna de estado.", "Proteger la hoja impediría que los compañeros registren el estado; no ofrece una lista de valores válidos.", false], ["C", "el formato condicional, para colorear los estados mal escritos.", "El formato condicional solo cambia la apariencia según una regla; no impide que se escriban valores distintos.", false]]}, {"id": "OF-129", "niv": 1, "e": "Para resaltar automáticamente las solicitudes con más de 10 días, debe usarse", "f": "Microsoft Support, «Utilice el formato condicional para resaltar la información en Excel»", "o": [["A", "una ordenación descendente de la columna de días.", "Ordenar cambia la posición de las filas, pero no resalta ninguna ni distingue las que superan los 10 días.", false], ["B", "una validación de datos con alerta de error de estilo Detener.", "La validación controla lo que se escribe, no da formato a las celdas que cumplen una condición.", false], ["C", "un formato condicional con una regla sobre la columna de días.", "El formato condicional aplica formato (como relleno rojo) a las celdas que cumplen una regla, por ejemplo valores mayores que 10, y se actualiza al cambiar los datos.", true]]}, {"id": "OF-130", "niv": 2, "e": "Para atender la necesidad de la coordinadora, lo adecuado es", "f": "Microsoft Support, «Filtrar datos en un rango o tabla»; «Usar las segmentaciones para filtrar datos»", "o": [["A", "crear una tabla dinámica que reemplace los datos originales por los de esa dependencia.", "La tabla dinámica resume datos en otro lugar y no reemplaza la hoja de origen; además, la coordinadora necesita ver las filas, no un resumen.", false], ["B", "ordenar la tabla por dependencia, con lo cual se ocultan las filas de las demás.", "Ordenar reorganiza las filas (las mueve), pero no oculta ninguna; todas siguen visibles.", false], ["C", "aplicar un filtro a la columna de dependencia y elegir la que necesita.", "El filtro oculta temporalmente las filas que no cumplen el criterio, sin borrarlas ni moverlas, y se puede quitar para volver a ver todos los datos.", true]]}]}, {"comp": "ofimatica", "rol": "profesional", "tag": "Herramientas ofimáticas · Niveles profesional, asesor y ejecutivo · Tablas dinámicas y gráficos", "texto": "Usted es profesional de la Oficina de Planeación de la Procuraduría y prepara un informe para el comité directivo. Tiene una hoja con 4.800 filas, una por cada queja recibida en 2026, con las columnas fecha, mes, procuraduría regional, tipo de queja (cinco tipos) y canal. Le piden un cuadro con el número de quejas por regional y por mes; una gráfica que muestre cómo evolucionó el total mensual durante los doce meses, y otra que muestre qué porcentaje del total anual representa cada tipo de queja.", "items": [{"id": "OF-131", "niv": 1, "e": "Para elaborar el cuadro de quejas por regional y por mes, lo más adecuado es", "f": "Microsoft Support, «Información general sobre tablas dinámicas y gráficos dinámicos»", "o": [["A", "una tabla dinámica con la regional en filas, el mes en columnas y el recuento de quejas en valores.", "La tabla dinámica resume grandes volúmenes de datos por categorías y subcategorías, con recuentos o sumas, sin modificar los datos de origen.", true], ["B", "ordenar la hoja por regional y luego por mes, con lo cual las quejas quedan agrupadas y totalizadas.", "Ordenar solo cambia el orden de las filas; no produce totales ni un cuadro de doble entrada.", false], ["C", "un gráfico circular por cada regional, generado directamente desde las 4.800 filas de la hoja.", "Un gráfico no es un cuadro de conteos y, además, el circular no sirve para cruzar regionales con meses.", false]]}, {"id": "OF-132", "niv": 2, "e": "Para mostrar la evolución del total mensual de quejas, el gráfico más adecuado es", "f": "Microsoft Support, «Tipos de gráfico disponibles en Office»", "o": [["A", "un gráfico de anillos, que muestra los doce meses como partes del total anual.", "El de anillos, como el circular, muestra la relación de las partes con un todo; no permite apreciar la tendencia mes a mes.", false], ["B", "un gráfico de líneas, con los meses en el eje horizontal.", "Microsoft indica que los gráficos de líneas muestran datos continuos en el tiempo y son idóneos para tendencias a intervalos iguales, como meses.", true], ["C", "un gráfico circular, con un sector para cada mes del año.", "El circular muestra partes de un todo, no la evolución en el tiempo, y Microsoft recomienda usarlo con no más de siete categorías.", false]]}, {"id": "OF-133", "niv": 2, "e": "Para mostrar el porcentaje del total que representa cada tipo de queja, el gráfico más adecuado es", "f": "Microsoft Support, «Tipos de gráfico disponibles en Office» (gráficos circulares)", "o": [["A", "un gráfico de líneas, porque permite comparar los cinco tipos entre sí.", "Las líneas muestran tendencias a lo largo de categorías ordenadas o del tiempo; no expresan cada tipo como porcentaje del total.", false], ["B", "un gráfico de líneas apiladas, porque suma los tipos hasta llegar al total anual.", "Las líneas apiladas muestran la contribución en el tiempo; con una sola cifra anual por tipo no reflejan la proporción de cada uno.", false], ["C", "un gráfico circular, que muestra cada tipo como parte del total anual.", "Microsoft recomienda el circular cuando hay una sola serie, sin valores negativos, no más de siete categorías y se quiere mostrar cada valor como porcentaje del total.", true]]}]}, {"comp": "ofimatica", "rol": "general", "tag": "Herramientas ofimáticas · Estilos y tabla de contenido en Word", "texto": "Usted es técnico de una dependencia de la Procuraduría y prepara un informe de 60 páginas en Word. A los títulos de los capítulos les dio formato a mano (negrita, 14 puntos) y a los subtítulos les aplicó el estilo Título 2. Al insertar la tabla de contenido automática, solo aparecen los subtítulos. Días después agregó dos capítulos nuevos y la tabla tampoco los muestra.", "items": [{"id": "OF-134", "niv": 1, "e": "Los títulos de los capítulos no aparecen en la tabla de contenido porque", "f": "Microsoft Support, «Insertar una tabla de contenido»", "o": [["A", "el programa excluye de la tabla los títulos escritos con más de 12 puntos.", "El tamaño de letra no determina la inclusión en la tabla; lo determina el estilo de título aplicado.", false], ["B", "esos títulos tienen solo formato directo y no un estilo de título.", "Microsoft explica que la tabla de contenido se basa en los títulos del documento y que las entradas faltan cuando no tienen estilo de título; basta aplicarles Título 1 y actualizar.", true], ["C", "la tabla de contenido automática admite un solo nivel de títulos por documento.", "La tabla automática admite varios niveles (Título 1, Título 2…); el problema es que los capítulos no tienen estilo de título.", false]]}, {"id": "OF-135", "niv": 1, "e": "Una vez aplicado el estilo correcto, para que la tabla muestre los capítulos nuevos se debe", "f": "Microsoft Support, «Insertar una tabla de contenido» y «Actualizar una tabla de contenido»", "o": [["A", "actualizar la tabla de contenido (Actualizar campo).", "La tabla de contenido es un campo que no se actualiza solo; tras cambios en el documento se usa Actualizar campo o Actualizar tabla.", true], ["B", "escribir a mano las entradas nuevas dentro de la tabla.", "Las entradas escritas a mano se perderían al actualizar el campo y no quedarían vinculadas a los títulos ni a sus páginas.", false], ["C", "insertar un salto de sección antes de cada capítulo para que la tabla los detecte.", "Los saltos de sección sirven para cambiar formato de página o encabezados; no influyen en la tabla de contenido.", false]]}, {"id": "OF-136", "niv": 2, "e": "Si se decide que todos los títulos de capítulo vayan en otra fuente y tamaño, la forma más eficiente es", "f": "Microsoft Support, «Personalizar o crear estilos» (Word)", "o": [["A", "modificar el estilo Título 1, con lo cual cambian todos los párrafos que lo tienen aplicado.", "Al modificar un estilo, Word actualiza de una vez todos los párrafos que lo usan, lo que garantiza uniformidad y mantiene la tabla de contenido.", true], ["B", "cambiar el formato de cada título con Copiar formato, ya que los estilos predefinidos no se modifican.", "Los estilos predefinidos sí pueden modificarse; cambiar título por título es más lento y propenso a inconsistencias.", false], ["C", "cambiar la fuente de la tabla de contenido, que transmite el formato a los títulos.", "El formato de la tabla de contenido no se traslada a los títulos del documento; son estilos distintos.", false]]}]}, {"comp": "ofimatica", "rol": "tecnico", "tag": "Herramientas ofimáticas · Niveles técnico, administrativo y operativo · Combinación de correspondencia", "texto": "Usted es auxiliar administrativo de una procuraduría provincial y debe enviar 85 citaciones personalizadas a ciudadanos para una jornada de atención. Tiene un libro de Excel con las columnas Nombre, Dirección, Municipio y Correo, y un modelo de citación en Word con el texto común.", "items": [{"id": "OF-137", "niv": 1, "e": "Para generar las citaciones con la combinación de correspondencia de Word, el libro de Excel cumple el papel de", "f": "Microsoft Support, «Usar la combinación de correspondencia de correo electrónico masivo, cartas, etiquetas y sobres»", "o": [["A", "plantilla de destino, en la que Word guarda las 85 cartas generadas.", "Las cartas resultantes se generan en Word (o se imprimen o envían); el libro de Excel solo suministra los datos.", false], ["B", "documento principal, en el que se escribe el texto que se repite en todas las cartas.", "El documento principal es el modelo de Word con el texto común y los campos insertados; Excel aporta los datos.", false], ["C", "origen de datos, cuyos encabezados de columna se convierten en campos de combinación.", "En la combinación de correspondencia, el origen de datos (una hoja de Excel, por ejemplo) aporta la información personalizada; los campos de combinación provienen de sus encabezados de columna.", true]]}, {"id": "OF-138", "niv": 2, "e": "Para que en cada citación aparezca el municipio del ciudadano, se debe", "f": "Microsoft Support, «Insertar campos de combinación de correspondencia»", "o": [["A", "copiar la columna Municipio de Excel y pegarla en el modelo de Word.", "Pegar la columna insertaría la lista completa en cada carta; la personalización registro por registro se logra con campos de combinación.", false], ["B", "insertar en el modelo el campo de combinación «Municipio» donde debe aparecer el dato.", "Los campos de combinación son marcadores que indican a Word dónde poner la información del origen de datos; se insertan con Insertar campo de combinación.", true], ["C", "escribir en el modelo la palabra Municipio entre comillas en el lugar del dato.", "Un texto escrito, aunque coincida con el nombre de la columna, no es un campo de combinación y se imprimiría igual en todas las cartas.", false]]}, {"id": "OF-139", "niv": 3, "e": "Si decide enviar las citaciones por correo electrónico desde la combinación de Word, debe tener en cuenta que", "f": "Microsoft Support, «Usar la combinación de correspondencia en Word para enviar mensajes de correo electrónico masivo»", "o": [["A", "todos los ciudadanos reciben un único mensaje con sus direcciones en el campo CCO.", "La combinación por correo genera un mensaje por destinatario, con su dirección en el campo Para; no usa CCO.", false], ["B", "cada ciudadano recibe un mensaje individual con su dirección en el campo Para, sin copia a los demás.", "La combinación de correspondencia de Word envía un mensaje separado a cada dirección del origen de datos, con esa dirección en el campo Para, y la función nativa no permite agregar destinatarios en CC ni en CCO.", true], ["C", "el programa adjunta a cada mensaje el PDF de la citación si se marca la opción de datos adjuntos.", "Word no permite adjuntar archivos externos, como un PDF, a cada mensaje; el formato «Datos adjuntos» solo envía el propio documento combinado en formato de Word. Para compartir otro archivo puede incluirse un vínculo.", false]]}]}, {"comp": "ofimatica", "rol": "profesional", "tag": "Herramientas ofimáticas · Niveles profesional, asesor y ejecutivo · Control de cambios y comentarios", "texto": "Usted es profesional especializado de una procuraduría delegada y revisa en Word el proyecto de un auto elaborado por un sustanciador. Su jefe quiere ver cada palabra que usted agregue o suprima y decidir si la acepta. Usted tiene, además, dudas sobre una cita jurisprudencial que no le corresponde corregir, sino que debe verificar el sustanciador. Al final, una versión del documento debe remitirse a otra entidad sin rastros de la revisión interna.", "items": [{"id": "OF-140", "niv": 1, "e": "Para que su jefe vea cada modificación y decida sobre ella, usted debe", "f": "Microsoft Support, «Aceptar o rechazar las marcas de revisión en Word»", "o": [["A", "resaltar en amarillo el texto que agregue y tachar a mano el que suprima.", "El formato manual no permite aceptar o rechazar cambios y obliga a limpiar el documento a mano.", false], ["B", "guardar una copia con otro nombre para que el jefe compare las versiones a simple vista.", "Comparar a simple vista no identifica de forma confiable cada inserción o supresión; el Control de cambios las registra todas.", false], ["C", "activar Control de cambios antes de editar el documento.", "Con Control de cambios activado, Word marca las inserciones y eliminaciones, que luego pueden aceptarse o rechazarse una a una.", true]]}, {"id": "OF-141", "niv": 2, "e": "Frente a la cita jurisprudencial, lo adecuado es", "f": "Microsoft Support, «Insertar o eliminar un comentario» (Word)", "o": [["A", "insertar un comentario en la cita para que el sustanciador la verifique.", "El comentario permite señalar una duda sin modificar el texto, que es lo que se busca cuando la corrección corresponde a otra persona.", true], ["B", "corregirla según su criterio, ya que el Control de cambios dejará registrada la modificación.", "La verificación corresponde al sustanciador; registrar el cambio no suple que usted modifique algo que no le corresponde.", false], ["C", "eliminar la cita con Control de cambios activado, para que el sustanciador decida si la restituye.", "Suprimir el texto es una modificación de contenido; aquí no se busca cambiar la cita, sino pedir que se verifique.", false]]}, {"id": "OF-142", "niv": 3, "e": "Para remitir a la otra entidad una versión sin rastros de la revisión, se debe", "f": "Microsoft Support, «Aceptar o rechazar las marcas de revisión en Word»", "o": [["A", "aceptar o rechazar las marcas, borrar los comentarios y pasar el Inspector de documento.", "Microsoft advierte que para quitar las marcas hay que aceptarlas o rechazarlas, y recomienda una comprobación final con el Inspector de documento, que detecta marcas de revisión, comentarios, texto oculto y nombres personales.", true], ["B", "cambiar la vista a «Sin marcas» y guardar, con lo cual las marcas desaparecen del archivo.", "Esa vista solo oculta temporalmente las marcas; vuelven a verse cuando otra persona abre el documento.", false], ["C", "desactivar Control de cambios, con lo cual se eliminan las revisiones hechas mientras estuvo activo.", "Desactivar el Control de cambios solo deja de registrar cambios nuevos; las marcas existentes permanecen hasta aceptarlas o rechazarlas.", false]]}]}, {"comp": "ofimatica", "rol": "general", "tag": "Herramientas ofimáticas · Saltos de sección y encabezados", "texto": "Usted elabora en Word el informe de gestión de una procuraduría regional, en orientación vertical y con encabezado institucional. En la mitad del documento debe incluir un anexo de tres páginas con una tabla muy ancha, en orientación horizontal y con un encabezado distinto que diga «Anexo estadístico». Después del anexo, el informe continúa en vertical con el encabezado original.", "items": [{"id": "OF-143", "niv": 1, "e": "Para que solo las páginas del anexo queden en horizontal, lo correcto es", "f": "Microsoft Support, «Configurar encabezados y pies de página para diferentes secciones de un documento de Word»", "o": [["A", "insertar saltos de página antes y después del anexo y cambiar la orientación del documento.", "El salto de página no crea una sección nueva, así que el cambio de orientación afectaría a todo el documento.", false], ["B", "insertar saltos de sección (página siguiente) antes y después del anexo y cambiar la orientación solo en esa sección.", "La orientación y los encabezados se configuran por sección; con saltos de sección antes y después del anexo, este puede ir en horizontal sin afectar el resto.", true], ["C", "cambiar la orientación de esas tres páginas desde la vista previa de impresión, sin tocar el resto.", "La orientación es una propiedad de la sección, no de páginas sueltas; sin saltos de sección el cambio se aplica a toda la sección.", false]]}, {"id": "OF-144", "niv": 2, "e": "Al escribir «Anexo estadístico» en el encabezado del anexo, el texto aparece también en el resto del informe. Esto ocurre porque", "f": "Microsoft Support, «Vincular al anterior»", "o": [["A", "los encabezados solo pueden ser distintos en la primera página de un documento.", "Word permite encabezados distintos en cada sección, además de la opción de primera página diferente.", false], ["B", "los saltos de sección no admiten encabezados propios si la orientación cambia.", "Las secciones con orientación distinta pueden tener encabezados propios; basta con desvincularlos.", false], ["C", "el encabezado de esa sección sigue vinculado al de la sección anterior.", "Por defecto las secciones están vinculadas; hay que desactivar Vincular al anterior en el encabezado de la nueva sección para que sea independiente.", true]]}, {"id": "OF-145", "niv": 3, "e": "Ya desvinculado el encabezado, usted cambia el texto del pie de página del anexo y el cambio aparece también en el resto del informe. La explicación es que", "f": "Microsoft Support, «Configurar encabezados y pies de página para diferentes secciones de un documento de Word»", "o": [["A", "el encabezado y el pie de página se vinculan por separado, y el pie sigue vinculado.", "Microsoft aclara que encabezados y pies se vinculan por separado; si se quiere un pie distinto, también debe desactivarse Vincular al anterior en el pie.", true], ["B", "el número de página es un campo que no se puede modificar por secciones.", "La numeración y el contenido del pie pueden variar por sección; el problema es la vinculación del pie.", false], ["C", "al desvincular el encabezado, Word vincula de nuevo el pie para conservar la numeración.", "Desvincular el encabezado no altera el pie; este simplemente conservaba su vínculo con la sección anterior.", false]]}]}, {"comp": "ofimatica", "rol": "general", "tag": "Herramientas ofimáticas · Outlook: CCO, reglas y calendario", "texto": "Usted es técnico de la Oficina de Atención al Ciudadano de la Procuraduría. Debe enviar por correo institucional la invitación a una audiencia pública a 60 ciudadanos que no se conocen entre sí. Además, a diario recibe decenas de notificaciones automáticas del sistema de gestión documental que llenan su bandeja de entrada, y debe organizar una reunión virtual con cinco procuradurías provinciales y saber quién confirmó asistencia.", "items": [{"id": "OF-146", "niv": 1, "e": "Para proteger la privacidad de los ciudadanos, sus direcciones deben ir en el campo", "f": "Microsoft Support, «Mostrar, ocultar y ver el campo CCO (copia carbón oculta) en Outlook para Windows»", "o": [["A", "de destinatarios (Para), porque Outlook oculta automáticamente las listas largas.", "Outlook no oculta las direcciones del campo Para, sin importar cuántas sean; todos los destinatarios las ven.", false], ["B", "de copia oculta (CCO), porque cada uno recibe el mensaje sin ver las demás direcciones.", "Los destinatarios en CCO reciben copia sin que su dirección sea visible para los demás; Microsoft lo recomienda para mantener privada la lista de destinatarios.", true], ["C", "de copia (CC), porque las copias no muestran las direcciones a los demás destinatarios.", "Las direcciones en CC son visibles para todos los destinatarios; la que las oculta es CCO.", false]]}, {"id": "OF-147", "niv": 2, "e": "Para manejar las notificaciones del sistema de gestión documental, lo adecuado es", "f": "Microsoft Support, «Administrar el correo electrónico mediante reglas en Outlook»", "o": [["A", "configurar una respuesta automática para que el sistema deje de enviarlas.", "La respuesta automática informa ausencias al remitente; no organiza la bandeja ni detiene las notificaciones de un sistema.", false], ["B", "marcarlas como correo no deseado para que el sistema deje de entregarlas.", "Las notificaciones son mensajes legítimos de trabajo; marcarlas como no deseadas las desviaría a esa carpeta y podría hacer que se pierdan.", false], ["C", "crear una regla que las mueva automáticamente a una carpeta según el remitente.", "Las reglas de Outlook ejecutan acciones automáticas sobre los mensajes que cumplen condiciones, como mover a una carpeta los que provienen de un remitente determinado.", true]]}, {"id": "OF-148", "niv": 1, "e": "Para la reunión con las procuradurías provinciales, lo adecuado es", "f": "Microsoft Support, «Programar una reunión con otras personas» (Outlook)", "o": [["A", "enviar un correo con la fecha y pedir respuesta, porque el calendario no registra confirmaciones.", "El calendario de Outlook sí registra las respuestas a las convocatorias de reunión; un correo simple obliga a consolidarlas a mano.", false], ["B", "enviar una convocatoria de reunión desde el calendario, que registra las respuestas.", "La convocatoria (solicitud) de reunión invita a otras personas desde el calendario y permite ver quién aceptó, rechazó o propuso otra hora.", true], ["C", "crear una cita en su calendario y reenviarla como archivo adjunto.", "Una cita es un evento del propio calendario; reenviarla como adjunto no permite hacer seguimiento a las respuestas.", false]]}]}, {"comp": "ofimatica", "rol": "general", "tag": "Herramientas ofimáticas · PowerPoint: patrón de diapositivas y vista Moderador", "texto": "Usted prepara una presentación de 25 diapositivas para la rendición de cuentas de una procuraduría regional. Debe incluir el logotipo institucional y la misma fuente en todas las diapositivas, y quiere tener a la vista sus apuntes durante la exposición sin que el público los vea. Una compañera le entregó la versión del año anterior, en la que usted no logra borrar, desde la vista Normal, una imagen que aparece en todas las diapositivas.", "items": [{"id": "OF-149", "niv": 1, "e": "Para que el logotipo y la fuente queden en todas las diapositivas, lo más eficiente es", "f": "Microsoft Support, «¿Qué es un patrón de diapositivas en PowerPoint?»", "o": [["A", "insertar el logotipo en la primera diapositiva y duplicarla para crear las demás.", "Duplicar copia el contenido actual, pero cualquier cambio posterior del logotipo o la fuente tendría que hacerse diapositiva por diapositiva.", false], ["B", "pegar el logotipo en cada diapositiva desde la vista Normal y cambiar la fuente una por una.", "Funciona, pero es lento y propenso a inconsistencias; el patrón aplica el formato a todas de una vez.", false], ["C", "insertar el logotipo y definir la fuente en el patrón de diapositivas.", "Microsoft explica que los cambios hechos en el patrón de diapositivas se reflejan en todas las diapositivas basadas en él, como fuentes e imágenes (logotipos).", true]]}, {"id": "OF-150", "niv": 2, "e": "La imagen que no se puede borrar desde la vista Normal probablemente", "f": "Microsoft Support, «¿Qué es un patrón de diapositivas en PowerPoint?»", "o": [["A", "está en el patrón de diapositivas o en un diseño, y se quita desde esa vista.", "Microsoft señala que, si un elemento no se puede editar en la vista Normal, puede deberse a que está definido en el patrón o en un diseño; para editarlo hay que pasar a la vista Patrón de diapositivas.", true], ["B", "es una marca de agua del tema, que PowerPoint no permite quitar.", "Los elementos del tema y del patrón se pueden editar o quitar desde la vista Patrón de diapositivas.", false], ["C", "está protegida con una contraseña que solo conoce la autora del archivo.", "Las contraseñas protegen la apertura o modificación del archivo completo, no una imagen concreta de las diapositivas.", false]]}, {"id": "OF-151", "niv": 2, "e": "Para consultar sus apuntes durante la exposición sin que el público los vea, debe", "f": "Microsoft Support, «Iniciar la presentación y ver las notas en la vista Moderador»", "o": [["A", "escribirlos en cuadros de texto con fuente blanca sobre el fondo de cada diapositiva.", "Ese texto forma parte de la diapositiva proyectada y puede verse o seleccionarse; no es un espacio reservado al expositor.", false], ["B", "escribirlos en el patrón de diapositivas, que el público no ve durante la presentación.", "Lo que se pone en el patrón aparece en todas las diapositivas proyectadas; no está oculto al público.", false], ["C", "escribirlos en el panel de notas y presentar con la vista Moderador.", "La vista Moderador muestra al expositor, en su pantalla, las notas y la diapositiva siguiente, mientras el público solo ve la diapositiva en curso.", true]]}]}, {"comp": "ofimatica", "rol": "general", "tag": "Herramientas ofimáticas · Seguridad de la información en ofimática", "texto": "Usted es profesional universitario de la Oficina de Control Interno de la Procuraduría. Recibe un correo firmado por «Mesa de Ayuda TI», enviado desde un dominio parecido al institucional pero con una letra cambiada, que le advierte que su cuenta se bloqueará en dos horas si no confirma su usuario y contraseña en un vínculo. Ese mismo día debe compartir para revisión, con una contratista externa, un informe preliminar con información reservada guardado en su OneDrive institucional. Además, un compañero que sale a vacaciones le pide que use su usuario y contraseña para responder sus correos pendientes.", "items": [{"id": "OF-152", "niv": 1, "e": "Frente al correo de la supuesta mesa de ayuda, usted debe", "f": "Microsoft Support, «Suplantación de identidad (phishing) y comportamiento sospechoso en Outlook»", "o": [["A", "responder al remitente para pedir que confirme si el mensaje es auténtico antes de ingresar los datos.", "Responder confirma al atacante que la cuenta está activa; la verificación debe hacerse por un canal oficial distinto del mensaje sospechoso.", false], ["B", "no abrir el vínculo ni responder, y reportar el mensaje como suplantación por el canal institucional.", "Es un intento típico de suplantación (phishing). Lo adecuado es no interactuar con el vínculo ni entregar credenciales y reportarlo (por ejemplo, con la opción de informar de phishing o al área de tecnología).", true], ["C", "abrir el vínculo desde su celular personal, fuera de la red institucional, para comprobar si es legítimo.", "Abrir el vínculo desde otro dispositivo no elimina el riesgo de robo de credenciales ni de descarga de código malicioso.", false]]}, {"id": "OF-153", "niv": 1, "e": "Del mensaje recibido, la señal más clara de suplantación es", "f": "Microsoft, «¿Qué es el correo electrónico de suplantación de identidad (phishing)?» (microsoft.com/es-co/security)", "o": [["A", "la combinación de urgencia, solicitud de la contraseña y un dominio que imita el institucional.", "Microsoft señala como alertas de phishing las direcciones parecidas a las reales con pequeñas diferencias, el lenguaje urgente o amenazante y las solicitudes de ingresar datos en vínculos.", true], ["B", "que esté redactado en español formal y sin errores de ortografía.", "La buena redacción no es indicio de fraude; muchos mensajes de suplantación están bien escritos.", false], ["C", "que lo envíe una mesa de ayuda, porque esas áreas no escriben a los usuarios.", "Las mesas de ayuda sí envían comunicaciones; lo sospechoso es el dominio alterado y la petición urgente de la contraseña.", false]]}, {"id": "OF-154", "niv": 3, "e": "Para compartir el informe con la contratista desde OneDrive, la opción más segura es", "f": "Microsoft Learn, «Cómo funcionan los vínculos que se pueden compartir en OneDrive y SharePoint en Microsoft 365»; Microsoft Support, «Uso compartido de archivos o carpetas de SharePoint»", "o": [["A", "un
