<title>Práctica por tema y nivel · Procuraduría 2027</title>
<style>body{overflow-wrap:anywhere}
:root{--bg:#f6f8fb;--card:#fff;--ink:#1d2433;--mute:#5a6478;--line:#dbe1ea;--pri:#0b3d6e;--pri2:#1660a8;--ok:#0d6b3a;--okbg:#e6f4ec;--no:#9b1c1c;--nobg:#fbeaea;--sel:#e8f0fa}
@media (prefers-color-scheme: dark){:root{--bg:#10151d;--card:#18202b;--ink:#e6ebf2;--mute:#9aa6b8;--line:#2a3545;--pri:#7fb3ea;--pri2:#9cc6f2;--ok:#7fd3a3;--okbg:#16301f;--no:#f2a3a3;--nobg:#3a1c1c;--sel:#1e2d40}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px}
.hwrap{max-width:860px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
h1{font-size:17px;margin:0;color:var(--pri)}
.stat{font-size:14px;color:var(--mute)}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--pri)}
.timer.low{color:var(--no)}
main{max-width:860px;margin:0 auto;padding:16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin:0 0 16px}
.caso{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--pri);border-radius:10px;padding:14px 16px;margin:22px 0 10px}
.tag{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--pri);font-weight:700}
.caso p{margin:6px 0 0;white-space:pre-line}
.item{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0}
.enun{margin:0 0 8px}
.n{font-weight:700;color:var(--pri)}
.niv{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-right:4px;white-space:nowrap}
.op{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:6px 0;cursor:pointer;background:transparent;width:100%;text-align:left;color:inherit;font:inherit}
.op:hover{border-color:var(--pri2)}
.op .l{font-weight:700;min-width:20px}
.op.sel{background:var(--sel);border-color:var(--pri2)}
.op.ok{background:var(--okbg);border-color:var(--ok)}
.op.no{background:var(--nobg);border-color:var(--no)}
.op[disabled]{cursor:default}
.just{font-size:14px;margin:8px 0 0;padding:8px 10px;border-top:1px dashed var(--line)}
.just div{margin:4px 0}
.just .okt{color:var(--ok);font-weight:700}
.just .not{color:var(--no);font-weight:700}
.src{font-size:13px;color:var(--mute);margin-top:6px}
button.btn{background:var(--pri);color:var(--card);border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer}
button.btn.sec{background:transparent;color:var(--pri);border:1px solid var(--pri)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
select{font:inherit;padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);max-width:100%}
table{border-collapse:collapse;width:100%;font-size:15px}
td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
.big{font-size:40px;font-weight:800;color:var(--pri);line-height:1.1}
.aviso{font-size:13px;color:var(--mute)}
.hide{display:none !important}
.res-ok{color:var(--ok);font-weight:700}.res-no{color:var(--no);font-weight:700}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal .panel{max-width:420px}
footer{max-width:860px;margin:0 auto;padding:8px 16px 40px;font-size:12px;color:var(--mute)}
</style>
</head>
<body>
<header><div class="hwrap"><h1 id="tit"></h1><div class="row stat"><span id="prog"></span><span id="timer" class="timer"></span></div></div></header>
<main id="main"></main>
<div id="modal" class="modal hide"><div class="panel"><p id="mtxt"></p><div class="row"><button class="btn" id="msi">Sí, calificar</button><button class="btn sec" id="mno">Seguir respondiendo</button></div></div></div>
<footer><a href="./" style="color:var(--pri);font-weight:600">← Volver al menú</a><br><br>Material de preparación independiente. No está afiliado a la Procuraduría General de la Nación, a la Universidad de Antioquia ni a ninguna entidad pública, y no contiene preguntas reales de la prueba.</footer>
<script>
const DATA = [{"comp": "estructura_pgn", "rol": "general", "tag": "Estructura y funciones de la Procuraduría · Ministerio Público en la Constitución", "texto": "Usted acaba de posesionarse como auxiliar administrativo en una procuraduría provincial y participa en la jornada de inducción. El procurador provincial explica la ubicación de la entidad en el Estado y pide a los nuevos servidores resolver tres preguntas de un taller. En la primera deben identificar quiénes ejercen el Ministerio Público según la Constitución. En la segunda, cuáles son los órganos de control. En la tercera, un compañero sostiene que la Procuraduría pertenece a la Rama Ejecutiva porque su planta la paga el Presupuesto General de la Nación, y otro afirma que pertenece a la Rama Judicial porque sus agentes actúan ante los jueces.", "items": [{"id": "PG-101", "niv": 1, "e": "Según el artículo 118 de la Constitución, el Ministerio Público es ejercido, entre otros, por el Procurador General de la Nación y", "f": "Constitución Política, art. 118", "o": [["A", "el Defensor del Pueblo, los procuradores delegados, los agentes del Ministerio Público ante las autoridades jurisdiccionales y los personeros municipales.", "El artículo 118 de la Constitución enumera a quienes ejercen el Ministerio Público: el Procurador, el Defensor del Pueblo, los procuradores delegados y los agentes ante las autoridades jurisdiccionales, los personeros municipales y los demás funcionarios que determine la ley.", true], ["B", "el Contralor General de la República, los contralores departamentales y municipales, los personeros municipales y los demás funcionarios que determine la ley.", "La Contraloría es un órgano de control distinto del Ministerio Público (art. 117 de la Constitución); el artículo 118 no incluye a los contralores entre quienes ejercen el Ministerio Público.", false], ["C", "el Fiscal General de la Nación, los fiscales delegados ante los jueces y el Defensor del Pueblo.", "La Fiscalía General de la Nación hace parte de la Rama Judicial (art. 249 y siguientes de la Constitución) y no aparece en la enumeración del artículo 118 de quienes ejercen el Ministerio Público.", false]]}, {"id": "PG-102", "niv": 1, "e": "En la segunda pregunta del taller, la respuesta acorde con el artículo 117 de la Constitución es que son órganos de control", "f": "Constitución Política, arts. 117 y 120", "o": [["A", "el Ministerio Público, la Contraloría General de la República y la Registraduría Nacional del Estado Civil.", "La Registraduría hace parte de la organización electoral (art. 120 de la Constitución), no de los órganos de control que enumera el artículo 117.", false], ["B", "el Ministerio Público y la Fiscalía General de la Nación, por ejercer ambos vigilancia sobre los servidores públicos.", "La Fiscalía no es órgano de control: integra la Rama Judicial. El artículo 117 solo menciona al Ministerio Público y a la Contraloría General.", false], ["C", "el Ministerio Público y la Contraloría General de la República.", "El artículo 117 de la Constitución dispone que el Ministerio Público y la Contraloría General de la República son órganos de control.", true]]}, {"id": "PG-103", "niv": 3, "e": "Frente a la discusión de los dos compañeros, lo correcto es afirmar que la Procuraduría General de la Nación", "f": "Constitución Política, arts. 113 y 117; Decreto Ley 262 de 2000, art. 1", "o": [["A", "integra la Rama Judicial, porque sus agentes tienen la misma categoría de los jueces ante quienes actúan.", "La equiparación de calidades y remuneración de los agentes del Ministerio Público con los jueces (art. 280) no los convierte en parte de la Rama Judicial; la PGN es un órgano de control (art. 117).", false], ["B", "no hace parte de ninguna de las tres ramas, pues es un órgano de control.", "El artículo 113 de la Constitución prevé, además de las tres ramas, otros órganos autónomos e independientes para las demás funciones del Estado; el artículo 117 califica al Ministerio Público como órgano de control, y el artículo 1 del Decreto Ley 262 de 2000 le reconoce a la PGN autonomía administrativa, financiera y presupuestal.", true], ["C", "pertenece a la Rama Ejecutiva del orden nacional, porque su presupuesto hace parte del Presupuesto General de la Nación.", "Que su presupuesto se incluya en el Presupuesto General no la ubica en la Rama Ejecutiva. El Decreto Ley 262 de 2000 (art. 1) le reconoce autonomía administrativa, financiera y presupuestal, y la Constitución la trata como órgano de control.", false]]}]}, {"comp": "estructura_pgn", "rol": "general", "tag": "Estructura y funciones de la Procuraduría · Elección y periodo del Procurador General", "texto": "La Oficina de Prensa de la Procuraduría prepara una cartilla pedagógica sobre la entidad y usted, profesional de apoyo, debe revisar tres apartes del borrador. El primero describe cómo se elige al Procurador General de la Nación. El segundo explica qué ocurre si el Procurador muere o renuncia antes de terminar su periodo. El tercero responde a la pregunta frecuente de un ciudadano: «¿Puede quien ya fue Procurador en propiedad volver a ser elegido para ese mismo cargo?».", "items": [{"id": "PG-104", "niv": 1, "e": "El primer aparte de la cartilla quedará correcto si indica que el Procurador General es elegido", "f": "Constitución Política, art. 276; Decreto Ley 262 de 2000, art. 3", "o": [["A", "por el Congreso en pleno, para un periodo de cuatro años, de terna elaborada por el Presidente de la República.", "Confunde la elección del Procurador con otras elecciones. El artículo 276 de la Constitución atribuye la elección al Senado, de terna con candidatos de tres autoridades distintas.", false], ["B", "por el Senado de la República, para un periodo de cuatro años, de terna integrada por candidatos de la Corte Constitucional, la Corte Suprema de Justicia y el Consejo de Estado.", "La terna no la integra la Corte Constitucional sino el Presidente de la República, junto con la Corte Suprema y el Consejo de Estado (art. 276 de la Constitución).", false], ["C", "por el Senado, para un periodo de cuatro años, de terna integrada por candidatos del Presidente de la República, la Corte Suprema de Justicia y el Consejo de Estado.", "Así lo dispone el artículo 276 de la Constitución, reiterado en el artículo 3 del Decreto Ley 262 de 2000.", true]]}, {"id": "PG-105", "niv": 2, "e": "En el segundo aparte, sobre la falta absoluta del Procurador General, debe explicarse que, según el Decreto Ley 262 de 2000,", "f": "Decreto Ley 262 de 2000, arts. 6 y 17 num. 2 (modificado por el art. 7 del Decreto Ley 1851 de 2021)", "o": [["A", "el Presidente de la República designa un procurador encargado hasta completar el periodo.", "Ninguna norma atribuye al Presidente esa designación. El artículo 6 del Decreto Ley 262 de 2000 ordena una nueva elección y asigna el ejercicio transitorio al Viceprocurador.", false], ["B", "se hace nueva elección dentro de los treinta días siguientes y, mientras tanto, el Viceprocurador ejerce como Procurador General.", "El artículo 6 del Decreto Ley 262 de 2000 ordena una nueva elección dentro de los treinta días siguientes a la falta y dispone que, mientras se realizan la elección y la posesión, el Viceprocurador ejerce como Procurador General (ver también el art. 17, num. 2).", true], ["C", "el Secretario General de la entidad asume el cargo y lo ejerce hasta que el Senado de la República elija y posesione al reemplazo.", "El Secretario General no reemplaza al Procurador; esa función corresponde al Viceprocurador (arts. 6 y 17, num. 2, del Decreto Ley 262 de 2000).", false]]}, {"id": "PG-106", "niv": 2, "e": "A la pregunta del ciudadano sobre la posibilidad de que un exprocurador vuelva a ser elegido para el mismo cargo, la cartilla debe responder que", "f": "Constitución Política, art. 126 (modificado por el art. 2 del Acto Legislativo 2 de 2015)", "o": [["A", "no puede, porque la Constitución prohíbe reelegir en ese cargo a quien lo haya ejercido en propiedad.", "El artículo 126 de la Constitución, modificado por el Acto Legislativo 2 de 2015, dispone que quien haya ejercido en propiedad, entre otros, el cargo de Procurador General de la Nación no podrá ser reelegido para el mismo.", true], ["B", "sí puede por una sola vez, si la terna lo vuelve a incluir.", "No existe una reelección por una vez para el Procurador. El artículo 126 de la Constitución lo incluye en la lista de cargos para los cuales no procede la reelección.", false], ["C", "sí puede, siempre que no sea para el periodo inmediatamente siguiente.", "La Constitución no establece una reelección diferida para este cargo: el artículo 126, modificado por el Acto Legislativo 2 de 2015, prohíbe reelegir para el mismo cargo a quien lo haya ejercido en propiedad, sin distinguir periodos.", false]]}]}, {"comp": "estructura_pgn", "rol": "general", "tag": "Estructura y funciones de la Procuraduría · Funciones de los artículos 277 y 278", "texto": "En el despacho del Procurador General se reciben el mismo día tres asuntos: una demanda de inconstitucionalidad que la Corte Constitucional remite para concepto; la solicitud de una veeduría para que la Procuraduría intervenga en un proceso contencioso en el que se discute la nulidad de un contrato que compromete recursos públicos, y una nota del Viceprocurador que recuerda la fecha en que debe presentarse el informe de gestión ante el Congreso. Un asesor nuevo propone delegar todo en las procuradurías delegadas para descongestionar el despacho.", "items": [{"id": "PG-107", "niv": 2, "e": "Respecto del concepto en el proceso de constitucionalidad, la propuesta del asesor es", "f": "Constitución Política, art. 278 num. 5; Decreto Ley 262 de 2000, arts. 7 parágrafo y 8 num. 1", "o": [["A", "procedente, siempre que el concepto lo firme un procurador judicial con categoría equivalente a la de los magistrados de la Corte Constitucional.", "La equiparación del artículo 280 se refiere a los agentes ante los jueces, pero no habilita a nadie distinto del Procurador para rendir el concepto del artículo 278, num. 5, de la Constitución.", false], ["B", "procedente, porque las funciones de intervención ante las altas cortes pueden asignarse a cualquier procurador delegado.", "El concepto de constitucionalidad no es una intervención ordinaria del artículo 277: está en el artículo 278 de la Constitución, cuyas funciones el Procurador ejerce directamente (parágrafo del art. 7 del Decreto Ley 262 de 2000).", false], ["C", "improcedente, pues esa función no admite delegación, aunque una dependencia del despacho proyecte el texto.", "El artículo 278, num. 5, de la Constitución asigna al Procurador el ejercicio directo de la función de rendir concepto en los procesos de control de constitucionalidad. El artículo 8, num. 1, del Decreto Ley 262 de 2000 encarga a la Procuraduría Auxiliar para Asuntos Constitucionales proyectar esos conceptos para consideración del Procurador.", true]]}, {"id": "PG-108", "niv": 2, "e": "De las siguientes funciones, la que el Procurador puede ejercer por medio de sus delegados y agentes es", "f": "Constitución Política, arts. 277 num. 7 y 278 nums. 2 y 3", "o": [["A", "intervenir en el proceso contencioso sobre la nulidad del contrato, en defensa del orden jurídico y del patrimonio público.", "El artículo 277, num. 7, de la Constitución permite al Procurador, por sí o por medio de sus delegados y agentes, intervenir en los procesos ante autoridades judiciales cuando sea necesario en defensa del orden jurídico, del patrimonio público o de los derechos fundamentales.", true], ["B", "presentar proyectos de ley sobre materias relativas a su competencia.", "Presentar proyectos de ley es una función que el Procurador ejerce directamente (art. 278, num. 3, de la Constitución).", false], ["C", "emitir conceptos en los procesos disciplinarios contra funcionarios sometidos a fuero especial.", "Esta función figura en el artículo 278, num. 2, de la Constitución, entre las que el Procurador ejerce directamente.", false]]}, {"id": "PG-109", "niv": 1, "e": "Sobre el informe que recuerda el Viceprocurador, la Constitución establece que el Procurador debe rendir informe de su gestión al Congreso", "f": "Constitución Política, art. 277 num. 8; Decreto Ley 262 de 2000, art. 17 num. 10", "o": [["A", "al terminar su periodo de cuatro años.", "El artículo 277, num. 8, de la Constitución no prevé un único informe al final del periodo, sino uno cada año.", false], ["B", "anualmente.", "El artículo 277, num. 8, de la Constitución ordena rendir anualmente informe de gestión al Congreso; el artículo 17, num. 10, del Decreto Ley 262 de 2000 encarga al Viceprocurador coordinar su elaboración.", true], ["C", "cada semestre, ante la Comisión Primera del Senado.", "La periodicidad constitucional es anual y el destinatario es el Congreso (art. 277, num. 8); la norma no habla de informes semestrales ante una comisión.", false]]}]}, {"comp": "estructura_pgn", "rol": "general", "tag": "Estructura y funciones de la Procuraduría · Atribuciones del Procurador: información, policía judicial y desvinculación", "texto": "Una procuraduría regional adelanta una actuación por presuntas irregularidades en el manejo de los recursos de alimentación escolar de un departamento. La secretaría de educación departamental se niega a entregar las bases de datos de los contratistas y alega que son «información reservada». Un funcionario de la gobernación afirma, además, que la Procuraduría no puede practicar inspecciones porque solo la Fiscalía tiene funciones de policía judicial. En una reunión, un ciudadano pregunta si el procurador regional puede retirar de inmediato del cargo al secretario que obstaculiza la actuación.", "items": [{"id": "PG-110", "niv": 2, "e": "Frente a la negativa de la secretaría de educación a entregar la información, y según el artículo 284 de la Constitución, es correcto afirmar que", "f": "Constitución Política, arts. 277 num. 9 y 284", "o": [["A", "la Procuraduría debe obtener primero una orden judicial, porque la reserva solo puede levantarla un juez.", "La Constitución no condiciona el acceso de la Procuraduría a una orden judicial: el artículo 284 dispone que no puede oponérsele reserva, salvo excepciones legales.", false], ["B", "la Procuraduría puede exigirla y la entidad no puede oponerle reserva, salvo las excepciones constitucionales y legales.", "El artículo 284 de la Constitución permite al Procurador requerir de las autoridades la información necesaria sin que pueda oponérsele reserva, salvo las excepciones constitucionales y legales; el artículo 277, num. 9, le permite exigir información a funcionarios y particulares.", true], ["C", "la secretaría puede negarla legítimamente, porque la reserva legal de la información prevalece sobre las solicitudes que formulen los organismos de control.", "Es la regla contraria a la del artículo 284 de la Constitución, según el cual al Procurador no puede oponérsele reserva, salvo las excepciones de la Constitución y la ley.", false]]}, {"id": "PG-111", "niv": 1, "e": "Sobre la afirmación del funcionario de la gobernación acerca de la policía judicial, lo correcto es que", "f": "Constitución Política, art. 277, inciso final", "o": [["A", "la Constitución otorga a la Procuraduría atribuciones de policía judicial para el cumplimiento de sus funciones.", "El inciso final del artículo 277 de la Constitución dispone que, para el cumplimiento de sus funciones, la Procuraduría tendrá atribuciones de policía judicial y podrá interponer las acciones que considere necesarias.", true], ["B", "la Procuraduría solo puede ejercer esas atribuciones si el Fiscal General se las delega para cada caso.", "La atribución de policía judicial de la Procuraduría proviene directamente de la Constitución (art. 277, inciso final), no de una delegación del Fiscal.", false], ["C", "es cierta, porque la policía judicial es exclusiva de la Fiscalía General de la Nación y de los organismos que esta designe para cada investigación.", "La Constitución también otorga atribuciones de policía judicial a la Procuraduría para cumplir sus funciones (art. 277, inciso final).", false]]}, {"id": "PG-112", "niv": 2, "e": "Sobre la pregunta del ciudadano, la facultad constitucional de desvincular del cargo, previa audiencia y mediante decisión motivada, al funcionario que obstaculice en forma grave las investigaciones de la Procuraduría corresponde", "f": "Constitución Política, art. 278 num. 1; Decreto Ley 262 de 2000, art. 7 parágrafo", "o": [["A", "al gobernador, como nominador, a solicitud de la procuraduría regional.", "La facultad del artículo 278, num. 1, de la Constitución es del Procurador General; no se trata de una solicitud al nominador.", false], ["B", "al procurador regional, como funcionario que adelanta la actuación.", "Esa facultad no está asignada a los procuradores territoriales: el artículo 278, num. 1, de la Constitución la reserva al Procurador General, que la ejerce directamente.", false], ["C", "directamente al Procurador General de la Nación.", "El artículo 278, num. 1, de la Constitución atribuye al Procurador General, en ejercicio directo, la función de desvincular del cargo, previa audiencia y con decisión motivada, al funcionario que, entre otras causales, obstaculice en forma grave las investigaciones de la Procuraduría.", true]]}]}, {"comp": "estructura_pgn", "rol": "general", "tag": "Estructura y funciones de la Procuraduría · Defensor del Pueblo como parte del Ministerio Público", "texto": "En la ventanilla de atención de una procuraduría provincial, un estudiante de derecho que prepara una exposición le pregunta a usted, técnico administrativo, por la relación entre la Procuraduría y la Defensoría del Pueblo. Quiere saber quién elige al Defensor del Pueblo, si la Defensoría hace parte del Ministerio Público y si el Procurador dirige sus actuaciones, y a qué entidad le corresponde organizar el servicio de defensoría pública para quienes no pueden pagar un abogado.", "items": [{"id": "PG-113", "niv": 1, "e": "Sobre la elección del Defensor del Pueblo, usted le explica que, según el texto vigente de la Constitución, lo elige", "f": "Constitución Política, art. 281 (modificado por el art. 24 del Acto Legislativo 2 de 2015)", "o": [["A", "el Procurador General, como supremo director del Ministerio Público, mediante decreto y para un periodo igual al suyo.", "El Procurador no elige al Defensor. Ser supremo director del Ministerio Público (art. 275) no le da esa competencia; la elección es de la Cámara (art. 281).", false], ["B", "el Senado de la República, de terna elaborada por el Procurador General de la Nación, para un periodo institucional de cuatro años.", "La elección no corresponde al Senado ni la terna al Procurador. El artículo 281 vigente asigna la elección a la Cámara de Representantes, de terna del Presidente.", false], ["C", "la Cámara de Representantes, de una terna que presenta el Presidente de la República, por cuatro años.", "El artículo 281 de la Constitución, modificado por el artículo 24 del Acto Legislativo 2 de 2015, dispone que el Defensor del Pueblo es elegido por la Cámara de Representantes para un periodo institucional de cuatro años, de terna elaborada por el Presidente.", true]]}, {"id": "PG-114", "niv": 3, "e": "Sobre la relación entre la Defensoría y el Ministerio Público, la respuesta correcta es que el Defensor del Pueblo", "f": "Constitución Política, arts. 118 y 281 (modificado por el art. 24 del Acto Legislativo 2 de 2015)", "o": [["A", "dejó de hacer parte del Ministerio Público con la reforma de 2015, que convirtió a la Defensoría en un órgano autónomo.", "La reforma de 2015 modificó el artículo 281, pero el artículo 118 sigue incluyendo al Defensor del Pueblo entre quienes ejercen el Ministerio Público.", false], ["B", "hace parte del Ministerio Público y, según el texto vigente del artículo 281, ejerce sus funciones de manera autónoma.", "El artículo 118 de la Constitución incluye al Defensor entre quienes ejercen el Ministerio Público, y el artículo 281, modificado por el Acto Legislativo 2 de 2015, dispone que ejerce sus funciones de manera autónoma.", true], ["C", "es un agente del Procurador, que le imparte instrucciones obligatorias en cada caso.", "El Defensor no es agente del Procurador; el artículo 281 vigente dispone que ejerce sus funciones de manera autónoma.", false]]}, {"id": "PG-115", "niv": 2, "e": "Sobre la defensoría pública, usted le indica que organizarla y dirigirla corresponde", "f": "Constitución Política, art. 282 num. 4", "o": [["A", "al Defensor del Pueblo, en los términos que señale la ley.", "El artículo 282, num. 4, de la Constitución asigna al Defensor del Pueblo la función de organizar y dirigir la defensoría pública en los términos que señale la ley.", true], ["B", "a la Procuraduría General, por medio de los procuradores judiciales en lo penal.", "Los procuradores judiciales intervienen como Ministerio Público en los procesos, pero no prestan ni dirigen la defensoría pública, que corresponde al Defensor del Pueblo (art. 282, num. 4).", false], ["C", "a las personerías municipales, por ser el Ministerio Público más cercano al ciudadano.", "Aunque los personeros ejercen el Ministerio Público en el municipio, la Constitución asigna la organización de la defensoría pública al Defensor del Pueblo (art. 282, num. 4).", false]]}]}, {"comp": "estructura_pgn", "rol": "general", "tag": "Estructura y funciones de la Procuraduría · Agentes del Ministerio Público e intervención judicial", "texto": "Una procuradora judicial II actúa como agente del Ministerio Público ante un tribunal administrativo. Un abogado litigante cuestiona en una audiencia que ella tenga el mismo trato y categoría de los magistrados. Días después, la procuradora delegada que coordina la intervención en ese ramo advierte que en un proceso penal de gran impacto en un municipio interviene el personero municipal y considera necesario que actúe en su lugar un procurador judicial. Además, un nuevo sustanciador pregunta si los procuradores judiciales también intervienen en trámites de conciliación.", "items": [{"id": "PG-116", "niv": 2, "e": "Frente al cuestionamiento del abogado litigante, es correcto afirmar que los agentes del Ministerio Público", "f": "Constitución Política, art. 280", "o": [["A", "tienen la categoría de los jueces de circuito aunque actúen ante un tribunal, porque así lo dispone la planta de personal de la Procuraduría.", "El artículo 280 de la Constitución toma como referencia a los magistrados y jueces de mayor jerarquía ante quienes el agente ejerce; ante un tribunal, la equiparación es con sus magistrados.", false], ["B", "tienen la categoría que determine en cada caso el Procurador General, según la importancia del proceso.", "La categoría de los agentes no depende de una decisión caso a caso: el artículo 280 de la Constitución la fija por equiparación con los magistrados y jueces ante quienes actúan.", false], ["C", "están equiparados en calidades, rango, salario y prestaciones a los magistrados y jueces de mayor jerarquía ante quienes actúan.", "Es la regla del artículo 280 de la Constitución, que equipara a los agentes del Ministerio Público con los magistrados y jueces de mayor jerarquía ante quienes actúan.", true]]}, {"id": "PG-117", "niv": 3, "e": "Respecto del proceso penal en el que interviene el personero, la procuradora delegada coordinadora", "f": "Decreto Ley 262 de 2000, art. 36; Ley 136 de 1994, art. 178", "o": [["A", "puede apartar al personero de esa intervención y disponer que actúe un procurador judicial.", "El artículo 36 del Decreto Ley 262 de 2000 permite a los procuradores delegados con funciones de coordinación de la intervención judicial desplazar a los personeros distritales y municipales, ordenando la intervención de procuradores judiciales.", true], ["B", "debe pedir al concejo municipal que designe un personero ad hoc para ese proceso.", "No existe ese trámite. El artículo 36 del Decreto Ley 262 de 2000 permite a la delegada desplazar directamente al personero y ordenar la intervención de un procurador judicial.", false], ["C", "no puede intervenir, porque las personerías tienen autonomía y el personero solo responde ante el concejo que lo eligió.", "La autonomía de las personerías no impide la coordinación de la intervención judicial: el artículo 36 del Decreto Ley 262 de 2000 permite a los delegados coordinadores desplazar a los personeros en esa función, y el personero actúa bajo la dirección suprema del Procurador (art. 178 de la Ley 136 de 1994).", false]]}, {"id": "PG-118", "niv": 1, "e": "A la pregunta del sustanciador, la respuesta acorde con el Decreto Ley 262 de 2000 es que los procuradores judiciales", "f": "Decreto Ley 262 de 2000, arts. 37 y 41", "o": [["A", "intervienen en la conciliación judicial, pero la conciliación extrajudicial está a cargo exclusivamente de los centros de conciliación.", "Los procuradores judiciales intervienen en los trámites de conciliación (art. 41 del Decreto Ley 262 de 2000), y los de lo contencioso administrativo tienen funciones de conciliación, incluida la extrajudicial (art. 37, adicionado por la Ley 1367 de 2009, y art. 44, parágrafo, num. 4).", false], ["B", "son agentes del Ministerio Público y su labor incluye, entre otras, actuar en los trámites conciliatorios.", "El artículo 41 del Decreto Ley 262 de 2000 dispone que los procuradores judiciales son agentes del Ministerio Público, intervienen ante las autoridades judiciales y también en los trámites de conciliación; el artículo 37 les asigna funciones de conciliación en lo contencioso administrativo.", true], ["C", "intervienen en conciliaciones solo cuando el juez los designa como conciliadores particulares.", "Su intervención en conciliación deriva de la ley y de su condición de agentes del Ministerio Público (arts. 37 y 41 del Decreto Ley 262 de 2000), no de una designación como conciliadores particulares.", false]]}]}, {"comp": "estructura_pgn", "rol": "tecnico", "tag": "Estructura y funciones de la Procuraduría · Niveles técnico, administrativo y operativo · Atención al ciudadano y registro de sanciones", "texto": "Usted es técnico en el nivel central de la Procuraduría y apoya la ventanilla de atención. Una aspirante a un empleo en una alcaldía solicita su certificado de antecedentes disciplinarios. Luego llega un oficio de un juzgado que, en un fallo de tutela, ordena retirar de la base de datos de la entidad el registro de una sanción impuesta a un exconcejal. Finalmente, un ciudadano sancionado hace más de diez años pregunta qué autoridad de la Procuraduría ordena la cancelación de antecedentes disciplinarios cuando ello es procedente.", "items": [{"id": "PG-119", "niv": 1, "e": "En el nivel central, la dependencia encargada de expedir el certificado de antecedentes disciplinarios que pide la aspirante es", "f": "Decreto Ley 262 de 2000, arts. 15, 18A y 18B num. 12 (adicionados por el art. 9 del Decreto Ley 1851 de 2021)", "o": [["A", "la División de Registro de Sanciones y Causas de Inhabilidad.", "Esta división registra las sanciones y atiende los requerimientos sobre ese registro (art. 18A), pero la expedición de certificados está asignada a la División de Relacionamiento con el Ciudadano (art. 18B, num. 12).", false], ["B", "la División de Relacionamiento con el Ciudadano.", "El artículo 18B, num. 12, del Decreto Ley 262 de 2000, adicionado por el artículo 9 del Decreto Ley 1851 de 2021, asigna a la División de Relacionamiento con el Ciudadano la expedición de los certificados de antecedentes disciplinarios.", true], ["C", "la Oficina Jurídica.", "Las funciones de la Oficina Jurídica (art. 15 del Decreto Ley 262 de 2000) son de asesoría, representación judicial y contratación; no incluyen expedir certificados de antecedentes.", false]]}, {"id": "PG-120", "niv": 2, "e": "El oficio del juzgado que ordena retirar el registro de la sanción debe dirigirse para su cumplimiento a", "f": "Decreto Ley 262 de 2000, arts. 18A num. 5 y 19 (art. 18A adicionado por el art. 9 del Decreto Ley 1851 de 2021)", "o": [["A", "la procuraduría provincial que impuso la sanción, que debe revocarla antes de retirar el registro.", "El fallo de tutela se cumple directamente. El retiro del registro corresponde a la División de Registro de Sanciones (art. 18A, num. 5), sin que deba esperarse una revocatoria del fallo disciplinario.", false], ["B", "la División de Documentación, que conserva los expedientes y archivos de la entidad.", "La División de Documentación maneja información normativa y archivo (art. 19 del Decreto Ley 262 de 2000), no el registro de sanciones.", false], ["C", "la División de Registro de Sanciones y Causas de Inhabilidad.", "El artículo 18A, num. 5, del Decreto Ley 262 de 2000 asigna a esa división dar cumplimiento a las providencias de revocatoria directa, fallos de tutela y demás decisiones judiciales que ordenen retirar un registro.", true]]}, {"id": "PG-121", "niv": 2, "e": "A la pregunta del ciudadano sancionado, usted responde que, cuando procede, ordenar la cancelación de antecedentes disciplinarios corresponde", "f": "Decreto Ley 262 de 2000, arts. 17 num. 12 (modificado por el art. 7 del Decreto Ley 1851 de 2021) y 18B", "o": [["A", "al Viceprocurador General.", "El artículo 17, num. 12, del Decreto Ley 262 de 2000, modificado por el artículo 7 del Decreto Ley 1851 de 2021, asigna al Viceprocurador la función de ordenar la cancelación de antecedentes disciplinarios cuando sea procedente.", true], ["B", "al jefe de la División de Relacionamiento con el Ciudadano.", "Esa división expide certificados y gestiona peticiones (art. 18B), pero no ordena cancelaciones de antecedentes.", false], ["C", "a la Sala Disciplinaria Ordinaria de Juzgamiento.", "Las Salas Disciplinarias tienen competencias procesales (art. 22 del Decreto Ley 262 de 2000), no la de ordenar cancelaciones de antecedentes, que el artículo 17, num. 12, asigna al Viceprocurador.", false]]}]}, {"comp": "estructura_pgn", "rol": "general", "tag": "Estructura y funciones de la Procuraduría · Estructura orgánica de la PGN", "texto": "La Oficina de Planeación le pide a usted, profesional universitario, actualizar el organigrama de la Procuraduría que se publicará en la intranet, de acuerdo con el artículo 2 del Decreto Ley 262 de 2000, modificado por el Decreto Ley 1851 de 2021. En el borrador recibido aparecen tres dudas marcadas en rojo: de qué despacho depende la Oficina de Selección y Carrera, en qué parte de la estructura se ubican las procuradurías judiciales y cómo se conforma el nivel territorial.", "items": [{"id": "PG-122", "niv": 1, "e": "En el organigrama, la Oficina de Selección y Carrera debe aparecer como dependencia", "f": "Decreto Ley 262 de 2000, art. 2 (modificado por el art. 1 del Decreto Ley 1851 de 2021)", "o": [["A", "del Despacho del Procurador General.", "El artículo 2, num. 1.1.6, del Decreto Ley 262 de 2000, modificado por el artículo 1 del Decreto Ley 1851 de 2021, ubica la Oficina de Selección y Carrera en el Despacho del Procurador General.", true], ["B", "de la Secretaría General, junto con la División de Gestión Humana.", "La Secretaría General agrupa las divisiones de Gestión Humana, Administrativa y Financiera (art. 2, num. 1.6), pero la Oficina de Selección y Carrera depende del Despacho del Procurador (num. 1.1.6).", false], ["C", "del Despacho del Viceprocurador General, junto con la División de Documentación.", "Del Despacho del Viceprocurador dependen la Dirección de Apoyo Estratégico y las divisiones de Relacionamiento con el Ciudadano, Documentación y Seguridad (art. 2, num. 1.2), no la Oficina de Selección y Carrera.", false]]}, {"id": "PG-123", "niv": 2, "e": "Las procuradurías judiciales I y II deben ubicarse en el organigrama", "f": "Decreto Ley 262 de 2000, arts. 2 y 36 (art. 2 modificado por el art. 1 del Decreto Ley 1851 de 2021)", "o": [["A", "en el nivel territorial, al mismo nivel de las procuradurías provinciales.", "El nivel territorial solo comprende las procuradurías regionales, distritales y provinciales (art. 2, num. 2); las judiciales hacen parte del nivel central.", false], ["B", "dentro de las procuradurías delegadas de intervención, en el nivel central.", "El artículo 2 del Decreto Ley 262 de 2000, modificado por el Decreto Ley 1851 de 2021, ubica las procuradurías judiciales I y II en el num. 1.4.5.1, dentro de las procuradurías delegadas de intervención.", true], ["C", "como dependencias del Despacho del Viceprocurador, que coordina la intervención judicial.", "El Despacho del Viceprocurador no incluye las procuradurías judiciales (art. 2, num. 1.2); la coordinación de la intervención judicial está a cargo de procuradores delegados (art. 36).", false]]}, {"id": "PG-124", "niv": 1, "e": "El nivel territorial de la Procuraduría está conformado por", "f": "Decreto Ley 262 de 2000, art. 2 num. 2 (modificado por el art. 1 del Decreto Ley 1851 de 2021)", "o": [["A", "las procuradurías departamentales, las municipales y las personerías.", "La estructura de la PGN no tiene procuradurías departamentales ni municipales, y las personerías no son dependencias de la Procuraduría, aunque ejerzan el Ministerio Público en el municipio.", false], ["B", "las procuradurías regionales, las provinciales y las procuradurías judiciales.", "Las procuradurías judiciales pertenecen al nivel central, dentro de las delegadas de intervención (art. 2, num. 1.4.5.1); además, la opción omite las procuradurías distritales.", false], ["C", "las procuradurías regionales, distritales y provinciales, cada una con dependencias de instrucción y de juzgamiento.", "El artículo 2, num. 2, del Decreto Ley 262 de 2000, modificado por el Decreto Ley 1851 de 2021, conforma el nivel territorial con procuradurías regionales, distritales y provinciales, divididas en instrucción y juzgamiento.", true]]}]}, {"comp": "estructura_pgn", "rol": "general", "tag": "Estructura y funciones de la Procuraduría · Oficinas del Despacho del Procurador", "texto": "En el comité directivo de la Procuraduría se revisan tres temas. Primero, la preparación del anteproyecto de presupuesto de la próxima vigencia. Segundo, el resultado de una visita de verificación a una procuraduría provincial en la que se encontraron expedientes sin movimiento durante más de un año, lo que podría constituir falta disciplinaria. Tercero, la notificación de una demanda de nulidad y restablecimiento del derecho presentada contra la Procuraduría por un exservidor que cuestiona su retiro del servicio.", "items": [{"id": "PG-125", "niv": 2, "e": "La elaboración del anteproyecto de presupuesto y del programa anual de caja, en coordinación con la División Financiera, corresponde a", "f": "Decreto Ley 262 de 2000, arts. 11 num. 4, 13 y 15", "o": [["A", "la Oficina de Planeación.", "El artículo 11, num. 4, del Decreto Ley 262 de 2000 asigna a la Oficina de Planeación elaborar, en coordinación con la División Financiera, el anteproyecto de presupuesto y el programa anual de caja.", true], ["B", "la Oficina Jurídica, que elabora los actos para el ordenador del gasto.", "La Oficina Jurídica proyecta actos para cumplir sentencias y conciliaciones y elabora contratos (art. 15), pero el anteproyecto de presupuesto lo elabora Planeación (art. 11, num. 4).", false], ["C", "la Oficina de Control Interno.", "Control Interno verifica la gestión y los estados financieros (art. 13 del Decreto Ley 262 de 2000), pero no elabora el anteproyecto de presupuesto.", false]]}, {"id": "PG-126", "niv": 2, "e": "Si la visita la realizó la Oficina de Control Interno y advierte posibles faltas disciplinarias, esa oficina debe", "f": "Decreto Ley 262 de 2000, art. 13 nums. 3, 4 y 8", "o": [["A", "abrir indagación previa contra los responsables, porque detectó directamente los hechos.", "La Oficina de Control Interno no tiene competencia disciplinaria; su función es remitir los informes a la dependencia competente (art. 13, num. 8, del Decreto Ley 262 de 2000).", false], ["B", "imponer un plan de mejoramiento y archivar el asunto si la procuraduría provincial lo cumple.", "Proponer correctivos es parte del control de gestión (art. 13, num. 3), pero no reemplaza el envío a la autoridad disciplinaria cuando hay posibles faltas (num. 8); Control Interno no puede archivar asuntos disciplinarios.", false], ["C", "remitir el informe de control de gestión, con sus soportes, a la dependencia competente.", "El artículo 13, num. 8, del Decreto Ley 262 de 2000 ordena a la Oficina de Control Interno enviar los informes de control de gestión, con sus soportes, a la dependencia competente cuando de ellos se concluya que hay posibles faltas disciplinarias.", true]]}, {"id": "PG-127", "niv": 1, "e": "La representación de la Procuraduría en el proceso de nulidad y restablecimiento del derecho promovido por el exservidor está a cargo de", "f": "Decreto Ley 262 de 2000, arts. 9, 10 y 15 num. 2", "o": [["A", "la Procuraduría Auxiliar para Asuntos Disciplinarios.", "Esta procuraduría auxiliar proyecta decisiones disciplinarias del Procurador y absuelve consultas en esa materia (art. 9), pero no representa judicialmente a la entidad.", false], ["B", "la Oficina Jurídica.", "El artículo 15, num. 2, del Decreto Ley 262 de 2000 asigna a la Oficina Jurídica representar a la Procuraduría en los procesos en que sea demandada o deba actuar como demandante.", true], ["C", "la Dirección Nacional de Investigaciones Especiales.", "Esta dirección adelanta investigaciones disciplinarias y actos de investigación complejos (art. 10); no representa a la entidad en procesos judiciales.", false]]}]}, {"comp": "estructura_pgn", "rol": "profesional", "tag": "Estructura y funciones de la Procuraduría · Niveles profesional, asesor y ejecutivo · Procuradurías auxiliares y Dirección de Investigaciones Especiales", "texto": "Usted es profesional especializado en el Despacho del Procurador General y debe repartir tres asuntos. El personero de un municipio de sexta categoría consulta cómo debe surtir el trámite de una apelación en un proceso disciplinario que adelanta contra un servidor de la alcaldía. Otro personero consulta si puede interponer una acción popular para proteger un humedal. Además, el Procurador asignó a la Dirección Nacional de Investigaciones Especiales una investigación de alto impacto contra un funcionario del orden nacional.", "items": [{"id": "PG-128", "niv": 3, "e": "La consulta del personero sobre el trámite de la apelación en el proceso disciplinario debe repartirse a", "f": "Decreto Ley 262 de 2000, arts. 8 num. 3, 9 num. 3 y 22 (modificados por el Decreto Ley 1851 de 2021)", "o": [["A", "la Sala Disciplinaria de Instrucción, por tratarse de un asunto disciplinario.", "Las Salas Disciplinarias deciden procesos y recursos (art. 22 del Decreto Ley 262 de 2000); no absuelven consultas de personeros.", false], ["B", "la Procuraduría Auxiliar para Asuntos Disciplinarios.", "El artículo 9, num. 3, del Decreto Ley 262 de 2000, modificado por el artículo 4 del Decreto Ley 1851 de 2021, le asigna absolver las consultas en materia disciplinaria de los funcionarios de la Procuraduría, los personeros y los organismos de control disciplinario interno.", true], ["C", "la Procuraduría Auxiliar para Asuntos Constitucionales.", "Esta procuraduría auxiliar absuelve consultas de los personeros sobre funciones del Ministerio Público distintas de las disciplinarias (art. 8, num. 3, del Decreto Ley 262 de 2000).", false]]}, {"id": "PG-129", "niv": 2, "e": "La consulta del otro personero sobre la acción popular debe repartirse a", "f": "Decreto Ley 262 de 2000, arts. 8 num. 3, 9 num. 3 y 17 num. 17 (modificados por el Decreto Ley 1851 de 2021)", "o": [["A", "la Procuraduría Auxiliar para Asuntos Constitucionales.", "El artículo 8, num. 3, del Decreto Ley 262 de 2000, modificado por el artículo 3 del Decreto Ley 1851 de 2021, le asigna absolver las consultas de los personeros sobre funciones del Ministerio Público distintas de las disciplinarias.", true], ["B", "la Procuraduría Auxiliar para Asuntos Disciplinarios, que orienta a las personerías en todas sus funciones.", "Esa procuraduría auxiliar se ocupa de consultas en materia disciplinaria (art. 9, num. 3); la acción popular es una función de Ministerio Público distinta de la disciplinaria.", false], ["C", "el Despacho del Viceprocurador, que absuelve las consultas que formulan los personeros sobre sus funciones.", "El Viceprocurador establece mecanismos de coordinación con las personerías (art. 17, num. 17), pero no absuelve sus consultas; la absolución de consultas de los personeros sobre funciones no disciplinarias es de la Procuraduría Auxiliar para Asuntos Constitucionales (art. 8, num. 3).", false]]}, {"id": "PG-130", "niv": 3, "e": "En la investigación asignada a la Dirección Nacional de Investigaciones Especiales, esta dirección", "f": "Decreto Ley 262 de 2000, art. 10 (modificado por el art. 5 del Decreto Ley 1851 de 2021)", "o": [["A", "actúa como comisionada de la Sala Disciplinaria de Instrucción para practicar pruebas, mientras la Sala conserva la dirección del proceso.", "La Dirección adelanta directamente las indagaciones e investigaciones que le asigna el Procurador (art. 10, num. 1); no actúa como comisionada de la Sala.", false], ["B", "adelanta la investigación completa y profiere el fallo de primera instancia, cuya apelación decide luego el Procurador General de la Nación.", "Desde el Decreto Ley 1851 de 2021 la Dirección solo instruye; el juzgamiento lo asumen las procuradurías delegadas de juzgamiento (art. 10, num. 1).", false], ["C", "solo instruye: llega hasta el pliego de cargos o el archivo, y el juzgamiento lo asumen las procuradurías delegadas de juzgamiento.", "El artículo 10, num. 1, del Decreto Ley 262 de 2000, modificado por el artículo 5 del Decreto Ley 1851 de 2021, así lo dispone, en desarrollo de la separación entre instrucción y juzgamiento.", true]]}]}, {"comp": "estructura_pgn", "rol": "general", "tag": "Estructura y funciones de la Procuraduría · Funciones del Viceprocurador General", "texto": "El Procurador General viaja durante diez días a un foro internacional. Durante su ausencia, la Defensoría del Pueblo propone a la Procuraduría una jornada conjunta de verificación de derechos en centros de reclusión. Ese mismo mes, el Viceprocurador decide asumir el conocimiento de una actuación disciplinaria que una procuraduría provincial adelantaba, en etapa de instrucción, contra el alcalde de un municipio que no es capital de departamento.", "items": [{"id": "PG-131", "niv": 1, "e": "Durante la ausencia temporal del Procurador General, sus funciones las asume", "f": "Decreto Ley 262 de 2000, art. 17 num. 2 (modificado por el art. 7 del Decreto Ley 1851 de 2021)", "o": [["A", "el Viceprocurador General.", "El artículo 17, num. 2, del Decreto Ley 262 de 2000, modificado por el artículo 7 del Decreto Ley 1851 de 2021, dispone que el Viceprocurador asume las funciones del Procurador en sus ausencias temporales.", true], ["B", "el procurador delegado más antiguo.", "Ninguna norma asigna ese reemplazo al delegado más antiguo; el artículo 17, num. 2, del Decreto Ley 262 de 2000 lo asigna al Viceprocurador.", false], ["C", "el Secretario General.", "El Secretario General no reemplaza al Procurador en sus ausencias; esa función es del Viceprocurador (art. 17, num. 2).", false]]}, {"id": "PG-132", "niv": 2, "e": "La coordinación de la jornada conjunta con la Defensoría del Pueblo es una función asignada a", "f": "Decreto Ley 262 de 2000, arts. 8 y 17 num. 7 (modificados por el Decreto Ley 1851 de 2021)", "o": [["A", "la procuraduría regional del lugar donde están los centros de reclusión, sin intervención del nivel central.", "Aunque las regionales pueden participar en la jornada, la coordinación de las actividades conjuntas con la Defensoría es función del Viceprocurador (art. 17, num. 7).", false], ["B", "el Viceprocurador General.", "El artículo 17, num. 7, del Decreto Ley 262 de 2000, modificado por el Decreto Ley 1851 de 2021, asigna al Viceprocurador coordinar las actividades que desarrollen conjuntamente la Procuraduría y la Defensoría del Pueblo.", true], ["C", "la Procuraduría Auxiliar para Asuntos Constitucionales, porque se trata de derechos fundamentales.", "Esta procuraduría auxiliar proyecta conceptos y absuelve consultas (art. 8), pero no coordina las actividades conjuntas con la Defensoría, que el artículo 17, num. 7, asigna al Viceprocurador.", false]]}, {"id": "PG-133", "niv": 3, "e": "Si el Viceprocurador asume la instrucción del proceso contra el alcalde y se formula pliego de cargos, el juzgamiento corresponderá a", "f": "Decreto Ley 262 de 2000, arts. 17 parágrafo 3 y 22 num. 3 (modificados por el Decreto Ley 1851 de 2021); Ley 1952 de 2019, art. 12", "o": [["A", "la procuraduría provincial de juzgamiento de la circunscripción del municipio.", "Cuando el Viceprocurador ejerce su competencia preferente en instrucción, el juzgamiento lo asume una de las Salas Disciplinarias, no la provincial de origen (art. 17, parágrafo 3).", false], ["B", "el mismo Viceprocurador, que conserva el proceso hasta el fallo.", "El sistema separa instrucción y juzgamiento (art. 12 de la Ley 1952 de 2019); por eso el parágrafo 3 del artículo 17 envía el juzgamiento a una Sala Disciplinaria.", false], ["C", "la Sala Disciplinaria de Juzgamiento de Servidores Públicos de Elección Popular.", "El parágrafo 3 del artículo 17 del Decreto Ley 262 de 2000 dispone que, si el Viceprocurador asume en instrucción, el juzgamiento corresponde a la Sala Ordinaria de Juzgamiento o a la de Elección Popular, según el caso; el alcalde es de elección popular (art. 22, num. 3, lit. a).", true]]}]}, {"comp": "estructura_pgn", "rol": "general", "tag": "Estructura y funciones de la Procuraduría · Funciones del Procurador General y comisiones especiales", "texto": "Una procuraduría regional adelanta una investigación por la caída de un puente construido con recursos departamentales que causó varias víctimas. Por la conmoción nacional, el Procurador General considera asumir personalmente el proceso. Como alternativa, su asesor propone crear una comisión disciplinaria especial integrada por servidores de la Procuraduría. Al mismo tiempo, la Secretaría General solicita trasladar dos cargos de sustanciador de la planta globalizada desde el nivel central hacia esa regional para atender la congestión.", "items": [{"id": "PG-134", "niv": 3, "e": "Sobre la posibilidad de que el Procurador asuma personalmente el proceso, es correcto afirmar que", "f": "Decreto Ley 262 de 2000, arts. 7 num. 16 y parágrafo, 25 parágrafo 2 y 77 (modificados por el Decreto Ley 1851 de 2021)", "o": [["A", "puede hacerlo cuando la importancia o trascendencia del asunto requiera su atención personal.", "El artículo 7, num. 16, del Decreto Ley 262 de 2000, modificado por el Decreto Ley 1851 de 2021, faculta al Procurador para asumir el conocimiento de procesos disciplinarios cuando la importancia o trascendencia del asunto lo requieran; el parágrafo del mismo artículo le permite asumir en cualquier momento las funciones asignadas a otras dependencias.", true], ["B", "requiere concepto previo favorable del Comité Técnico de la función disciplinaria, como ocurre con las procuradurías delegadas.", "El concepto del Comité Técnico es requisito para que las procuradurías delegadas ejerzan competencia preferente sobre las territoriales (art. 25, parágrafo 2), no para que el Procurador General asuma un asunto.", false], ["C", "solo puede hacerlo si el investigado lo solicita, para garantizar el juez natural.", "La facultad del artículo 7, num. 16, no depende de una solicitud del investigado; la petición del investigado es relevante, por ejemplo, para el cambio de radicación (art. 77), que es una figura distinta.", false]]}, {"id": "PG-135", "niv": 3, "e": "Si el Procurador opta por la comisión disciplinaria especial, el fallo será proferido por", "f": "Decreto Ley 262 de 2000, art. 7 num. 18 (modificado por el art. 2 del Decreto Ley 1851 de 2021)", "o": [["A", "el procurador regional desplazado, que conserva la competencia para decidir.", "Al crearse la comisión especial, el funcionario desplazado pierde el conocimiento; el fallo lo profiere quien presida la comisión o el funcionario designado (art. 7, num. 18).", false], ["B", "quien presida la comisión o el funcionario designado para juzgar, siempre que no tenga menor rango que el desplazado.", "Así lo dispone el artículo 7, num. 18, del Decreto Ley 262 de 2000, modificado por el Decreto Ley 1851 de 2021.", true], ["C", "cualquiera de los integrantes de la comisión, sin importar su jerarquía, porque la designación especial suple la competencia.", "El artículo 7, num. 18, exige que quien falle sea de igual o superior jerarquía que el funcionario desplazado.", false]]}, {"id": "PG-136", "niv": 1, "e": "La decisión de reubicar los cargos de sustanciador de la planta globalizada en la procuraduría regional corresponde a", "f": "Decreto Ley 262 de 2000, arts. 7 num. 34 y 87", "o": [["A", "el procurador regional que recibirá los cargos.", "Los procuradores regionales no distribuyen la planta de la entidad; esa función es del Procurador General (art. 7, num. 34, del Decreto Ley 262 de 2000).", false], ["B", "el jefe de la División de Gestión Humana, mediante acto de traslado.", "El traslado de un servidor es una figura distinta (art. 87); distribuir y reubicar los empleos de la planta globalizada es función del Procurador General (art. 7, num. 34).", false], ["C", "el Procurador General.", "El artículo 7, num. 34, del Decreto Ley 262 de 2000, modificado por el Decreto Ley 1851 de 2021, asigna al Procurador distribuir y reubicar los empleos de la planta de personal globalizada entre las dependencias, según las necesidades del servicio.", true]]}]}, {"comp": "estructura_pgn", "rol": "profesional", "tag": "Estructura y funciones de la Procuraduría · Niveles profesional, asesor y ejecutivo · Salas disciplinarias y competencias en elección popular", "texto": "Usted es profesional especializado en una procuraduría regional y debe proyectar las decisiones de reparto de tres asuntos. En un proceso contra un concejal de un municipio que no es capital de departamento, la procuraduría provincial de instrucción ordenó la suspensión provisional del investigado y el auto debe surtir el grado de consulta. En otro proceso contra un tesorero municipal, la defensa apeló en etapa de instrucción un auto de la procuraduría provincial. En un tercer proceso contra un alcalde, ya en etapa de juzgamiento ante la procuraduría provincial de juzgamiento, la defensa apeló el auto que negó unas pruebas.", "items": [{"id": "PG-137", "niv": 3, "e": "El grado de consulta de la suspensión provisional del concejal corresponde a", "f": "Decreto Ley 262 de 2000, arts. 22 nums. 1 y 3, y 75 num. 4 (modificados por el Decreto Ley 1851 de 2021)", "o": [["A", "la Sala Disciplinaria de Juzgamiento de Servidores Públicos de Elección Popular.", "El artículo 22, num. 3, lit. c, del Decreto Ley 262 de 2000, modificado por el Decreto Ley 1851 de 2021, le asigna la consulta de la suspensión provisional proferida, en cualquier etapa, por las procuradurías territoriales en actuaciones contra servidores de elección popular. La procuraduría regional de instrucción no es competente porque el art. 75, num. 4, excluye expresamente las actuaciones contra servidores de elección popular.", true], ["B", "la procuraduría regional de instrucción, superior de la provincial.", "La regional de instrucción conoce de la consulta de suspensiones dictadas por las provinciales en instrucción, excepto en las actuaciones contra servidores de elección popular (art. 75, num. 4), y el concejal lo es.", false], ["C", "la Sala Disciplinaria de Instrucción, porque el proceso está en etapa de instrucción.", "La Sala de Instrucción conoce de la consulta de suspensiones dictadas por las delegadas de instrucción, excepto en actuaciones contra servidores de elección popular (art. 22, num. 1, lit. c).", false]]}, {"id": "PG-138", "niv": 3, "e": "La apelación interpuesta en etapa de instrucción en el proceso contra el tesorero municipal debe ser resuelta por", "f": "Decreto Ley 262 de 2000, arts. 25 num. 3, 75 num. 3 y 75A num. 2 (modificados o adicionados por el Decreto Ley 1851 de 2021)", "o": [["A", "la procuraduría regional de juzgamiento.", "La regional de juzgamiento resuelve las apelaciones en los procesos de las provinciales en etapa de juzgamiento (art. 75A, num. 2), no en instrucción.", false], ["B", "la procuraduría delegada disciplinaria de instrucción.", "Las delegadas de instrucción resuelven apelaciones de los procesos de las regionales y distritales de Bogotá (art. 25, num. 3), no de las provinciales.", false], ["C", "la procuraduría regional de instrucción.", "El artículo 75, num. 3, del Decreto Ley 262 de 2000, modificado por el artículo 19 del Decreto Ley 1851 de 2021, asigna a las regionales de instrucción los recursos de apelación en los procesos de las provinciales y distritales en etapa de instrucción.", true]]}, {"id": "PG-139", "niv": 3, "e": "La apelación del auto que negó pruebas en el juzgamiento del alcalde corresponde a", "f": "Decreto Ley 262 de 2000, arts. 22 num. 3, 25A num. 2 y 75A num. 2 (modificados o adicionados por el Decreto Ley 1851 de 2021)", "o": [["A", "la procuraduría delegada disciplinaria de juzgamiento.", "Las delegadas de juzgamiento resuelven apelaciones de procesos de las regionales y distritales de Bogotá, excepto en elección popular (art. 25A, num. 2); no son el superior en este caso.", false], ["B", "la Sala Disciplinaria de Juzgamiento de Servidores Públicos de Elección Popular.", "El artículo 22, num. 3, lit. b, del Decreto Ley 262 de 2000 le asigna las apelaciones que se presenten, en etapa de juzgamiento, en los procesos de las procuradurías delegadas, regionales, distritales y provinciales contra servidores de elección popular.", true], ["C", "la procuraduría regional de juzgamiento, como superior funcional de la provincial.", "La regional de juzgamiento conoce de las apelaciones de las provinciales en juzgamiento, excepto en los casos de servidores de elección popular (art. 75A, num. 2).", false]]}]}, {"comp": "estructura_pgn", "rol": "tecnico", "tag": "Estructura y funciones de la Procuraduría · Niveles técnico, administrativo y operativo · Ingreso y posesión en la PGN", "texto": "Usted es técnico de la coordinación administrativa de una procuraduría regional y apoya el trámite de vinculación de los elegibles de un concurso. Una elegible para un cargo de técnico en esa regional pregunta cómo se formaliza su ingreso a la entidad. Otro elegible, nombrado como profesional universitario en la misma sede, aceptó el nombramiento y pregunta de cuánto tiempo dispone para posesionarse, porque debe terminar un contrato en otra ciudad. Ambos quieren saber ante quién deben tomar posesión.", "items": [{"id": "PG-140", "niv": 1, "e": "Según el Decreto Ley 262 de 2000, el ingreso al servicio en la Procuraduría se efectúa por medio de", "f": "Decreto Ley 262 de 2000, arts. 81 y 217", "o": [["A", "decreto de nombramiento expedido por el Procurador General y la respectiva posesión.", "El artículo 81 del Decreto Ley 262 de 2000 dispone que el ingreso se efectúa por medio de decreto de nombramiento expedido por el Procurador General y la respectiva posesión.", true], ["B", "la publicación de la lista de elegibles, que por sí sola vincula al primero de la lista.", "La lista de elegibles no vincula por sí sola: debe expedirse el nombramiento dentro del término legal (art. 217) y luego producirse la posesión (art. 81).", false], ["C", "la firma de un contrato de trabajo con la Secretaría General.", "Los empleados de la Procuraduría se vinculan por nombramiento y posesión, no por contrato de trabajo (art. 81 del Decreto Ley 262 de 2000).", false]]}, {"id": "PG-141", "niv": 2, "e": "Al elegible que ya aceptó el nombramiento debe informársele que", "f": "Decreto Ley 262 de 2000, art. 84 y parágrafo", "o": [["A", "tiene ocho días para posesionarse, contados desde la comunicación del nombramiento, sin posibilidad de prórroga.", "Los ocho días son los plazos para comunicar y aceptar el nombramiento (art. 84); la posesión tiene un término de 15 días desde la aceptación, prorrogable.", false], ["B", "dispone de quince días desde la aceptación, prorrogables una vez hasta por treinta si lo pide a tiempo y con justa causa.", "El artículo 84 del Decreto Ley 262 de 2000 fija en 15 días, contados desde la aceptación, el término para la posesión, y su parágrafo permite prorrogarlo por una sola vez hasta por 30 días si la causa es justa y la solicitud se formula antes del vencimiento.", true], ["C", "puede posesionarse en cualquier momento mientras la lista de elegibles esté vigente, pues esa vigencia protege su derecho al empleo.", "La posesión tiene un término legal de 15 días desde la aceptación, con una sola prórroga posible (art. 84); la vigencia de la lista no amplía ese plazo.", false]]}, {"id": "PG-142", "niv": 2, "e": "Por tratarse de empleos de los niveles técnico y profesional en una procuraduría regional, la posesión de ambos elegibles la da", "f": "Decreto Ley 262 de 2000, arts. 7 num. 52, 75B num. 10 y 84 (modificados o adicionados por el Decreto Ley 1851 de 2021)", "o": [["A", "el Procurador General, en el nivel central.", "El Procurador da posesión al Viceprocurador, delegados, auxiliares, directores y Secretario General (art. 7, num. 52); a los empleados territoriales de los niveles profesional, técnico, administrativo y operativo la da el procurador regional (art. 75B, num. 10).", false], ["B", "el jefe de la División de Gestión Humana, que verifica los requisitos.", "El jefe de Gestión Humana verifica el cumplimiento de requisitos antes de la posesión (art. 84), pero no da la posesión a los empleados territoriales, función del procurador regional (art. 75B, num. 10).", false], ["C", "el procurador regional.", "El artículo 75B, num. 10, del Decreto Ley 262 de 2000, adicionado por el artículo 21 del Decreto Ley 1851 de 2021, asigna a los procuradores regionales dar posesión a los servidores del nivel territorial en empleos de los niveles profesional, técnico, administrativo y operativo.", true]]}]}, {"comp": "estructura_pgn", "rol": "general", "tag": "Estructura y funciones de la Procuraduría · Poder disciplinario preferente", "texto": "En un municipio de cuarta categoría, la oficina de control disciplinario interno de la alcaldía adelanta una investigación contra un auxiliar de la secretaría de obras por la pérdida de equipos. La procuraduría provincial considera que la actuación avanza con lentitud. Por su parte, el personero municipal también quiere asumir esa investigación. Una semana después, la personería recibe una queja contra un concejal del mismo municipio por presunta participación indebida en un contrato, y el personero pregunta si puede tramitarla.", "items": [{"id": "PG-143", "niv": 1, "e": "En ejercicio del poder disciplinario preferente, la Procuraduría puede, respecto de la investigación que adelanta el control interno de la alcaldía,", "f": "Constitución Política, art. 277 num. 6; Ley 1952 de 2019, arts. 2 y 3", "o": [["A", "tomar la actuación, continuarla o enviarla a otra autoridad competente, y también conocerla en segunda instancia.", "El artículo 3 de la Ley 1952 de 2019 dispone que, en ejercicio del poder preferente, la PGN podrá iniciar, proseguir o remitir cualquier investigación o juzgamiento de competencia del control interno disciplinario y de las personerías, e igualmente asumir el proceso en segunda instancia; el artículo 277, num. 6, de la Constitución consagra ese poder.", true], ["B", "asumirla siempre que el investigado lo solicite y la oficina de control interno manifieste que no puede tramitarla.", "El poder preferente se ejerce por decisión de la Procuraduría (art. 3 de la Ley 1952 de 2019); no depende de una solicitud del investigado ni de que el control interno se declare incapaz de tramitar el asunto.", false], ["C", "hacer seguimiento y formular recomendaciones, ya que la competencia del control interno sobre los servidores de su entidad es prevalente.", "La competencia del control interno no prevalece sobre la de la PGN: el artículo 2 de la Ley 1952 de 2019 la reconoce sin perjuicio del poder preferente de la Procuraduría, que puede asumir la actuación (art. 3).", false]]}, {"id": "PG-144", "niv": 3, "e": "Sobre la intención del personero de asumir la investigación contra el auxiliar de la secretaría de obras, es correcto afirmar que", "f": "Ley 1952 de 2019, arts. 2 y 3; Ley 136 de 1994, art. 178 num. 4", "o": [["A", "no puede, porque el poder preferente es exclusivo de la Procuraduría General de la Nación.", "La ley también reconoce poder preferente a las personerías frente a la administración (art. 3, inciso 2, de la Ley 1952 de 2019).", false], ["B", "puede, pero solo con autorización previa y escrita del procurador provincial.", "La ley no condiciona el poder preferente de las personerías a una autorización previa del procurador provincial; el personero actúa bajo su supervigilancia y debe informarle de las investigaciones (art. 178, num. 4, de la Ley 136 de 1994).", false], ["C", "puede, porque las personerías municipales tienen poder disciplinario preferente frente a la administración.", "El inciso 2 del artículo 3 de la Ley 1952 de 2019 dispone que las personerías municipales y distritales tienen poder disciplinario preferente frente a la administración; el artículo 2 de la misma ley lo reconoce también. El auxiliar es un servidor de la alcaldía.", true]]}, {"id": "PG-145", "niv": 3, "e": "Frente a la queja contra el concejal, el personero debe", "f": "Ley 1952 de 2019, art. 2 (modificado por el art. 1 de la Ley 2094 de 2021); Decreto Ley 262 de 2000, art. 76 num. 1", "o": [["A", "tramitarla, porque los concejales son servidores públicos municipales sujetos a su poder preferente.", "Aunque el concejal es servidor del orden municipal, la Ley 1952 de 2019 (art. 2) hace privativa de la PGN la competencia sobre los servidores de elección popular, lo que excluye a la personería.", false], ["B", "remitirla a la Procuraduría, porque su competencia sobre los servidores de elección popular es privativa.", "El artículo 2 de la Ley 1952 de 2019, modificado por la Ley 2094 de 2021, dispone que la competencia de la PGN es privativa para los procesos contra servidores de elección popular. Los concejales de municipios que no son capital corresponden a las provinciales de instrucción (art. 76, num. 1, lit. a, del Decreto Ley 262 de 2000).", true], ["C", "remitirla a la oficina de control interno disciplinario del concejo, como entidad a la que pertenece el concejal.", "Tampoco el control interno es competente: la competencia sobre servidores de elección popular es privativa de la Procuraduría (art. 2 de la Ley 1952 de 2019).", false]]}]}, {"comp": "estructura_pgn", "rol": "general", "tag": "Estructura y funciones de la Procuraduría · Ley 2094 de 2021 y sentencia C-030 de 2023", "texto": "En un conversatorio organizado por una procuraduría regional, los asistentes discuten los efectos de la sentencia C-030 de 2023, que revisó la Ley 2094 de 2021. Se plantean tres situaciones: la naturaleza de las funciones disciplinarias de la Procuraduría; un fallo de la Procuraduría que destituye e inhabilita a un alcalde en ejercicio del cargo, y un fallo que suspende por tres meses a una secretaria de despacho departamental, que no es de elección popular.", "items": [{"id": "PG-146", "niv": 2, "e": "Según la sentencia C-030 de 2023, las funciones disciplinarias que ejerce la Procuraduría General de la Nación son de naturaleza", "f": "Corte Constitucional, sentencia C-030 de 2023 (Comunicado 04 del 16 de febrero de 2023); Ley 1952 de 2019, art. 2", "o": [["A", "mixta: jurisdiccional frente a servidores de elección popular y administrativa frente a los demás.", "La Corte no adoptó un régimen mixto: retiró el carácter jurisdiccional en todos los casos y precisó que la imposición definitiva de ciertas sanciones a servidores de elección popular corresponde al juez contencioso administrativo.", false], ["B", "jurisdiccional, como lo dispuso la Ley 2094 de 2021 para ajustarse a la Convención Americana.", "La Corte declaró inexequibles las expresiones «jurisdiccionales» y «jurisdiccional» de los artículos 1, 54, 73 y 74 de la Ley 2094 de 2021.", false], ["C", "administrativa, y no jurisdiccional.", "La sentencia C-030 de 2023 declaró exequibles de manera condicionada los artículos 13, 16 y 17 de la Ley 2094 de 2021, en el entendido de que las funciones disciplinarias de la PGN son de naturaleza administrativa y no jurisdiccional.", true]]}, {"id": "PG-147", "niv": 3, "e": "En el caso del fallo que destituye e inhabilita al alcalde, conforme a la sentencia C-030 de 2023", "f": "Corte Constitucional, sentencia C-030 de 2023, resolutivos segundo y cuarto; Ley 1952 de 2019, art. 2 (modificado por el art. 1 de la Ley 2094 de 2021)", "o": [["A", "el juez de lo contencioso administrativo revisa la decisión aunque el alcalde no la impugne, y mientras tanto la sanción no se ejecuta.", "El resolutivo cuarto de la C-030 de 2023 condicionó el artículo 54 de la Ley 2094 de 2021: la revisión opera solo frente a destitución, suspensión o inhabilidad de servidores de elección popular, por ministerio de la ley, automática e inmediatamente, y la ejecución se suspende durante el trámite judicial. Según la Circular 2A de 2023 de la PGN, la regla se aplica a servidores de elección popular sancionados con destitución, suspensión o inhabilidad.", true], ["B", "la sanción queda en firme y se ejecuta si el alcalde no interpone, dentro del término legal, el recurso extraordinario de revisión.", "La Corte condicionó el recurso de revisión para estos casos a que opere de manera automática, por ministerio de la ley; su trámite no depende de que el sancionado lo interponga.", false], ["C", "la sanción se ejecuta de inmediato, como cualquier acto administrativo, y el alcalde puede luego demandarla en nulidad y restablecimiento del derecho.", "Para los servidores de elección popular la ejecución queda suspendida mientras el juez decide la revisión (art. 1 de la Ley 2094 de 2021 y resolutivo cuarto de la C-030 de 2023).", false]]}, {"id": "PG-148", "niv": 3, "e": "En el caso de la secretaria de despacho departamental suspendida por la Procuraduría, es correcto afirmar que", "f": "Corte Constitucional, sentencia C-030 de 2023; Procuraduría General de la Nación, Circular 2A de 2023", "o": [["A", "la suspensión debe ser determinada por el juez contencioso administrativo, como en el caso del alcalde.", "La reserva judicial de la C-030 de 2023 se refiere a servidores de elección popular; la secretaria de despacho no lo es.", false], ["B", "no opera la revisión automática y la sanción, como acto administrativo, se controla mediante el medio de control de nulidad y restablecimiento del derecho.", "Según la C-030 de 2023, la revisión automática solo opera para sanciones de destitución, suspensión e inhabilidad a servidores de elección popular; en los demás eventos, las sanciones de la PGN son administrativas y se controlan por nulidad y restablecimiento del derecho (Circular 2A de 2023 de la PGN).", true], ["C", "se controla mediante el recurso extraordinario de revisión de la Ley 2094 de 2021, que opera de manera automática frente a toda suspensión.", "La C-030 de 2023 condicionó el artículo 54 de la Ley 2094 de 2021: la revisión automática solo opera frente a destitución, suspensión o inhabilidad de servidores de elección popular; la secretaria de despacho no lo es.", false]]}]}, {"comp": "estructura_pgn", "rol": "general", "tag": "Estructura y funciones de la Procuraduría · Función preventiva y de control de gestión", "texto": "Una procuraduría delegada preventiva y de control de gestión recibe la solicitud de una veeduría ciudadana para que visite un hospital público de segundo nivel donde, según la queja, se están venciendo medicamentos en bodega. Al mismo tiempo, la delegada decide hacer seguimiento a la ejecución de un contrato de infraestructura vial de gran cuantía, escogido entre varios por su nivel de riesgo. Un servidor nuevo pregunta de quién dependen los procuradores delegados.", "items": [{"id": "PG-149", "niv": 1, "e": "A la pregunta del servidor nuevo, la respuesta correcta es que los procuradores delegados dependen directamente", "f": "Decreto Ley 262 de 2000, art. 23 parágrafo", "o": [["A", "de la Sala Disciplinaria de Instrucción.", "Las Salas Disciplinarias tienen competencias procesales; no son el superior administrativo de los delegados (art. 23, parágrafo, del Decreto Ley 262 de 2000).", false], ["B", "del Viceprocurador General.", "Aunque el Viceprocurador coordina actividades preventivas y otras funciones (art. 17), los delegados dependen directamente del Procurador (art. 23, parágrafo).", false], ["C", "del Procurador General.", "El parágrafo del artículo 23 del Decreto Ley 262 de 2000 dispone que los procuradores delegados dependen directamente del Procurador General.", true]]}, {"id": "PG-150", "niv": 2, "e": "Frente a la solicitud de la veeduría, la procuraduría delegada", "f": "Decreto Ley 262 de 2000, art. 24 num. 6", "o": [["A", "debe trasladar la petición a la personería, que es la competente para atender las solicitudes de las veedurías ciudadanas.", "Aunque las personerías apoyan a las veedurías, el artículo 24, num. 6, permite a las delegadas visitar entidades a solicitud de cualquier persona, de modo que no está obligada a trasladar la petición.", false], ["B", "puede atender la petición y practicar la visita, porque puede hacerlo tanto de oficio como a pedido de un particular.", "El artículo 24, num. 6, del Decreto Ley 262 de 2000 permite a las delegadas visitar entidades estatales o particulares que cumplen función pública, a solicitud de cualquier persona u oficiosamente, para proteger los recursos públicos y garantizar los principios de la función pública.", true], ["C", "debe pedir a la Contraloría que practique la visita, porque se trata de verificar el manejo de bienes públicos.", "La Procuraduría no depende de la Contraloría para visitar entidades: el artículo 24, num. 6, del Decreto Ley 262 de 2000 le permite practicar visitas directamente para proteger los recursos públicos.", false]]}, {"id": "PG-151", "niv": 2, "e": "El seguimiento a la ejecución del contrato vial, escogido por su nivel de riesgo, es una manifestación de", "f": "Decreto Ley 262 de 2000, art. 24 num. 3; Constitución Política, arts. 267 y 272", "o": [["A", "la vigilancia preventiva sobre la gestión y la contratación, que la delegada aplica escogiendo los asuntos que sigue.", "El artículo 24, num. 3, del Decreto Ley 262 de 2000 asigna a las delegadas ejercer, de manera selectiva, control preventivo de la gestión administrativa y de la contratación estatal de las entidades públicas.", true], ["B", "el control fiscal posterior y selectivo, que la Procuraduría comparte con la Contraloría.", "El control fiscal corresponde a las contralorías (arts. 267 y 272 de la Constitución); la Procuraduría ejerce vigilancia preventiva y de control de gestión, no control fiscal.", false], ["C", "la función disciplinaria, que obliga a abrir indagación previa contra el supervisor del contrato.", "El seguimiento preventivo no es una actuación disciplinaria ni obliga a abrir indagación; si se detectan posibles faltas, se dará traslado a la dependencia competente.", false]]}]}, {"comp": "estructura_pgn", "rol": "profesional", "tag": "Estructura y funciones de la Procuraduría · Niveles profesional, asesor y ejecutivo · Régimen de competencias por sujeto disciplinable", "texto": "Usted es profesional universitario del grupo de reparto disciplinario de una procuraduría regional y debe proyectar la remisión por competencia de tres quejas recibidas el mismo día. La primera es contra un diputado de la asamblea departamental. La segunda, contra un concejal de la capital del departamento. La tercera, contra el alcalde de la capital del departamento. Todas se refieren a hechos ocurridos durante el ejercicio de sus cargos.", "items": [{"id": "PG-152", "niv": 3, "e": "La instrucción de la queja contra el diputado corresponde a", "f": "Decreto Ley 262 de 2000, arts. 75 num. 1 y 76 num. 1 (modificados por el Decreto Ley 1851 de 2021); Ley 1952 de 2019, art. 101", "o": [["A", "la procuraduría regional de instrucción.", "El artículo 75, num. 1, lit. c, del Decreto Ley 262 de 2000, modificado por el artículo 19 del Decreto Ley 1851 de 2021, asigna a las regionales de instrucción las actuaciones contra los diputados.", true], ["B", "la Sala Disciplinaria de Instrucción, por tratarse de un servidor de elección popular.", "Las Salas conocen de los servidores enumerados en el artículo 101 de la Ley 1952 de 2019, lista que no incluye a los diputados; la elección popular, por sí sola, no traslada la instrucción a la Sala.", false], ["C", "la procuraduría provincial de instrucción de la capital.", "Las provinciales conocen de servidores del orden municipal y de concejales de municipios que no son capital (art. 76, num. 1); los diputados están asignados a las regionales.", false]]}, {"id": "PG-153", "niv": 2, "e": "La instrucción de la queja contra el concejal de la capital del departamento corresponde a", "f": "Decreto Ley 262 de 2000, arts. 75 num. 1 lit. c y 76 num. 1 lit. a; Ley 1952 de 2019, art. 2", "o": [["A", "la personería de la capital, por su poder preferente frente a los servidores municipales.", "Los concejales son de elección popular, y frente a ellos la competencia de la PGN es privativa (art. 2 de la Ley 1952 de 2019).", false], ["B", "la procuraduría provincial de instrucción, porque los concejales son servidores municipales.", "Las provinciales
